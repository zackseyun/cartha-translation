  edition: SBLGNT
  text: Ἐβάστασαν ⸀οὖν πάλιν λίθους οἱ Ἰουδαῖοι ἵνα λιθάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/031.yaml
  text: So the Jews picked up stones again to stone him[a].
translation:
  language: hi
  text: इस पर यहूदियों ने उस पर पथराव करने के लिए फिर से पत्थर उठा लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ में इसका अर्थ संभवतः ‘यहूदी अगुवे’ या ‘यहूदिया के लोग’ भी हो सकता है। यूहन्ना में ‘यहूदी’ पद प्रायः समस्त यहूदी लोगों के बजाय यीशु का विरोध करने वाले कुछ विशेष यहूदियों के लिए प्रयुक्त हुआ है।
    reason: वैकल्पिक संदर्भगत अर्थ स्पष्ट करना और पूरे यहूदी समुदाय पर कथन का अनुचित सामान्यीकरण रोकना।
lexical_decisions:
- source_word: Ἐβάστασαν
  choice: उठा लिए
  rationale: βαστάζω का मूल अर्थ ‘उठाना/लेना’ या ‘ढोना’ हो सकता है; पत्थरों और तत्काल हिंसक उद्देश्य के इस संदर्भ में ‘पत्थर उठा लिए’ स्वाभाविक और सटीक है।
- source_word: οὖν
  choice: इस पर
  rationale: οὖν पिछले कथन से प्रतिक्रिया या परिणाम का संबंध जोड़ता है। यहाँ ‘इस पर’ आधुनिक हिन्दी में उस कथन के प्रत्युत्तर में हुई कार्रवाई को सहज रूप से व्यक्त करता है।
- source_word: πάλιν
  choice: फिर से
  rationale: πάλιν पुनरावृत्ति बताता है; ‘फिर से’ उसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: λίθους
  choice: पत्थर
  rationale: λίθος का सीधा अर्थ ‘पत्थर’ है। संज्ञा में ही निष्पादन का भाव जोड़ना आवश्यक नहीं है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यूनानी पद का सीधा अर्थ ‘यहूदी’ है। यूहन्ना में इसका संदर्भ कई बार यीशु के कुछ विशेष यहूदी विरोधियों तक सीमित होता है, पर पद स्वयं यहाँ ‘अगुवे’ नहीं कहता; इसलिए मुख्य पाठ में सीधा अनुवाद रखा गया है और संदर्भगत संभावना पादटिप्पणी में दी गई है।
- source_word: ἵνα
  choice: करने के लिए
  rationale: ἵνα और संभावनार्थक क्रिया यहाँ उद्देश्य व्यक्त करते हैं; ‘करने के लिए’ हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से दिखाता है।
- source_word: λιθάσωσιν
  choice: पथराव करने
  rationale: λιθάζω का विशिष्ट अर्थ पत्थरों से प्रहार करना या पत्थरवाह करना है। ‘पथराव करना’ आधुनिक हिन्दी में समझने योग्य है और ‘मार डालना’ जोड़कर घातक परिणाम को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: αὐτόν
  choice: उस पर
  rationale: सर्वनाम यीशु को सूचित करता है। हिन्दी में ‘पथराव करना’ के साथ लक्ष्य के लिए ‘उस पर’ स्वाभाविक व्याकरणिक रूप है।
theological_decisions:
- issue: यूहन्ना के सुसमाचार में οἱ Ἰουδαῖοι का संदर्भ और दायरा
  choice: मुख्य पाठ में ‘यहूदी’ रखा गया और संदर्भगत सीमित अर्थ को पादटिप्पणी में बताया गया।
  alternative: ‘यहूदी अगुवे’ या ‘यहूदिया के लोग’
  rationale: मूल यूनानी पद स्पष्ट रूप से ‘यहूदी’ कहता है, इसलिए मुख्य पाठ में उसके दायरे को ‘अगुवों’ तक सीमित करना पाठ से अधिक विशिष्ट होगा। फिर भी यूहन्ना में यह पद प्रायः समस्त यहूदी लोगों के बजाय यीशु के कुछ विशेष यहूदी विरोधियों को सूचित करता है; पादटिप्पणी इस तनाव को बिना चुपचाप सुलझाए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पत्थरवाह’ की अपेक्षा ‘पथराव’ सामान्य पाठक के लिए अधिक परिचित है। ‘इस पर’ पिछले कथन से प्रतिक्रिया का संबंध स्वाभाविक हिन्दी में जोड़ता है।
