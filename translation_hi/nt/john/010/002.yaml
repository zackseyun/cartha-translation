  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण रूप। ‘द्वार’ और ‘चरवाहा’ सामान्य पाठक के लिए परिचित हैं; ‘भीतर’ प्रवेश की गति स्पष्ट करता है।
