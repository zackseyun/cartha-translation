lexical_decisions:
- source_word: ὁ δὲ εἰσερχόμενος
  choice: पर जो ... भीतर आता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी ऐसे व्यक्ति को बताता है जिसकी पहचान उसके प्रवेश करने से होती है। δέ पिछले पद के चोर और डाकू से विरोध दिखाता है, इसलिए ‘पर’ स्वाभाविक है।
- source_word: διὰ τῆς θύρας
  choice: द्वार से
  rationale: संबंधकारक के साथ διά यहाँ किसी मार्ग से होकर जाने का स्थानिक अर्थ देता है। हिंदी में ‘द्वार से भीतर आता है’ इस गति को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: ποιμήν
  choice: वही ... चरवाहा
  rationale: ποιμήν विधेय संज्ञा है और यूनानी में इसके साथ उपपद नहीं है। तत्काल संदर्भ वैध प्रवेश करने वाले व्यक्ति को अवैध घुसने वालों से अलग पहचानता है; ‘वही’ इस संदर्भगत निश्चितता को व्यक्त करता है, जबकि अनिश्चित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τῶν προβάτων
  choice: भेड़ों का
  rationale: πρόβατα का सीधा अर्थ ‘भेड़ें’ है। ‘झुंड’ कहने की अपेक्षा ‘भेड़ों’ से मूल रूपक अधिक निकटता से बना रहता है।
theological_decisions:
- issue: विधेय ποιμήν की निश्चितता
  choice: वही भेड़ों का चरवाहा है
  alternative: वह भेड़ों का एक चरवाहा है
  rationale: यूनानी विधेय संज्ञा के साथ उपपद न होने से रूप की दृष्टि से दोनों संभावनाएँ खुली हैं। फिर भी पिछले पद के चोर और डाकू के विपरीत यह कथन वैध, पहचाने हुए चरवाहे की ओर संकेत करता है। ‘वही’ इस वाक्यगत विरोध को व्यक्त करता है, बिना इस पद में बाद की मसीह-संबंधी पहचान को आवश्यकता से अधिक स्पष्ट किए।
