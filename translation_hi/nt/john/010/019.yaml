lexical_decisions:
- source_word: Σχίσμα
  choice: फूट
  rationale: यह शब्द किसी समूह के भीतर विभाजन या मतभेद को दर्शाता है। इस प्रसंग में ‘फूट’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पहले भी हुए ऐसे विभाजन की पुनरावृत्ति स्पष्ट करता है।
- source_word: ἐγένετο
  choice: पड़ गई
  rationale: ‘फूट पड़ गई’ हिन्दी का स्वाभाविक प्रयोग है और किसी विभाजन के उत्पन्न होने का घटनात्मक भाव बनाए रखता है।
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: यहूदियों में
  rationale: यह यूनानी पदबंध का सीधा अर्थ बनाए रखता है। यूहन्ना में Ἰουδαῖοι का संदर्भ कभी यहूदिया के लोगों या यहूदी अगुओं से भी हो सकता है; इसलिए प्रसंगगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διά यहाँ कारण व्यक्त करता है; ‘के कारण’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: τοὺς λόγους τούτους
  choice: इन बातों
  rationale: λόγοι यीशु की अभी-अभी कही बातों को सूचित करता है। हिन्दी में इस संदर्भ में ‘इन बातों’ ‘इन शब्दों’ से अधिक स्वाभाविक है और कथनों का अर्थ बनाए रखता है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖοι का अभिप्राय
  choice: मुख्य पाठ में ‘यहूदियों’ रखा गया और प्रसंगगत अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई।
  alternative: ‘यहूदिया के लोगों’ या ‘यहूदी अगुओं’
  rationale: मूल पद संदर्भ के अनुसार विभिन्न यहूदी समूहों को सूचित कर सकता है। मुख्य पाठ में सीधा अर्थ रखना और पादटिप्पणी में सीमा बताना मूल की अस्पष्टता बचाता है तथा पूरे यहूदी समुदाय के बारे में अनुचित सामान्यीकरण से सावधान करता है।
