id: JHN.10.29
reference: John 10:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ πατήρ μου ⸀ὃ δέδωκέν ⸀μοι ⸂πάντων μεῖζων⸃ ἐστίν, καὶ οὐδεὶς δύναται ἁρπάζειν ἐκ τῆς χειρὸς τοῦ ⸀πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/029.yaml
  text: My Father[a], who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand.
translation:
  language: hi
  text: मेरे पिता[a], जिन्होंने उन्हें मुझे दिया है, सबसे बढ़कर हैं; और कोई भी उन्हें पिता के हाथ से छीन नहीं सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से इसका अनुवाद हो सकता है, “मेरे पिता ने जो मुझे दिया है, वह सबसे बढ़कर है।” यहाँ यूनानी वाक्य-विन्यास कठिन है; कुछ लोग दिए गए व्यक्तियों के बजाय स्वयं दिए गए उपहार को तुलना का कर्ता समझते हैं।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: ὁ πατήρ μου
  choice: मेरे पिता
  rationale: यह स्वाभाविक हिन्दी में यीशु और पिता के संबंध को बिना किसी व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: ὃ δέδωκέν μοι
  choice: जिन्होंने उन्हें मुझे दिया है
  rationale: यूनानी नपुंसकलिंग एकवचन संबंधवाचक रूप कठिन है; निकटवर्ती संदर्भ में भेड़ों का उल्लेख होने के कारण हिन्दी में व्यक्तिवाचक कर्म ‘उन्हें’ स्पष्ट किया गया है। पूर्णकालिक क्रिया का स्थायी परिणाम ‘दिया है’ से बना रहता है।
- source_word: πάντων μεῖζων
  choice: सबसे बढ़कर
  rationale: यह व्यापक तुलना को स्वाभाविक हिन्दी में रखता है और यह निर्धारित नहीं करता कि तुलना सभी व्यक्तियों से है या सभी वस्तुओं से।
- source_word: οὐδεὶς δύναται
  choice: कोई भी … नहीं सकता
  rationale: यह सामर्थ्य के पूर्ण निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἁρπάζειν
  choice: छीन
  rationale: यह बलपूर्वक किसी को अधिकार या सुरक्षा से निकाल लेने का भाव देता है और पिछले पद की समान क्रिया से संगति रखता है।
- source_word: ἐκ τῆς χειρὸς τοῦ πατρός
  choice: पिता के हाथ से
  rationale: ‘हाथ’ संरक्षण, अधिकार और सामर्थ्य के मूल रूपक को बनाए रखता है; ‘से’ किसी को उस सुरक्षित अधिकार-क्षेत्र से निकालने का अर्थ देता है।
theological_decisions:
- issue: ὃ δέδωκέν μοι की पाठ-संबंधी और वाक्यगत कठिनाई
  choice: मुख्य पाठ में संदर्भानुसार उन भेड़ों को पिता द्वारा यीशु को दिए जाने का अर्थ व्यक्त किया गया है।
  alternative: “मेरे पिता ने जो मुझे दिया है, वह सबसे बढ़कर है।”
  rationale: मुद्रित यूनानी वाक्य-विन्यास कठिन है और पांडुलिपियों में भी भिन्नताएँ हैं। संदर्भ व्यक्तियों—भेड़ों—का है, इसलिए मुख्य पाठ में ‘उन्हें’ स्वाभाविक है; फिर भी उपहार को तुलना का कर्ता समझने की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- issue: πάντων μεῖζων में तुलना का दायरा
  choice: सबसे बढ़कर
  alternative: सब लोगों से बढ़कर; सब वस्तुओं से बढ़कर
  rationale: यूनानी शब्द का दायरा व्यापक है। चुना हुआ अनुवाद व्यक्तियों या वस्तुओं में से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सबसे बढ़कर’ व्यापक तुलना को बनाए रखता है, जबकि ‘हाथ’ का मूल रूपक ज्यों का त्यों सुरक्षित है।
