id: JHN.10.21
reference: John 10:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἄλλοι ἔλεγον· Ταῦτα τὰ ῥήματα οὐκ ἔστιν δαιμονιζομένου· μὴ δαιμόνιον δύναται τυφλῶν ὀφθαλμοὺς ⸀ἀνοῖξαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/021.yaml
  text: Others were saying[a], “These words are not those of a demon-possessed man. A demon cannot open the eyes of the blind, can it?”
translation:
  language: hi
  text: दूसरे लोग कह रहे थे[a], “ये बातें किसी दुष्टात्मा-ग्रस्त व्यक्ति की नहीं हैं। भला कोई दुष्टात्मा अंधों की आँखें खोल सकती है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये बातें किसी ऐसे व्यक्ति की ओर से नहीं हैं जो दुष्टात्मा-ग्रस्त है।”
    reason: संबंधकारक कृदन्त को हिन्दी में वक्ता से जुड़ी बातों के रूप में या उनकी ओर से आने वाली बातों के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἄλλοι
  choice: दूसरे लोग
  rationale: यह पिछले पद में बोलने वाले समूह के विपरीत एक अन्य समूह को दर्शाता है; आधुनिक हिन्दी में यह सहज और स्पष्ट है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल भीड़ में चल रही या बार-बार व्यक्त की जा रही प्रतिक्रिया को सूचित करता है।
- source_word: Ταῦτα τὰ ῥήματα
  choice: ये बातें
  rationale: यह यीशु के बोले हुए वचनों को दर्शाता है। ‘ये बातें’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और आशय को अनावश्यक रूप से तकनीकी नहीं बनाता।
- source_word: οὐκ ἔστιν δαιμονιζομένου
  choice: किसी दुष्टात्मा से ग्रस्त व्यक्ति की नहीं हैं
  rationale: यूनानी संबंधकारक कृदन्त इन बातों के कथित वक्ता के प्रकार को बताता है। यह हिन्दी अभिव्यक्ति उस संबंध को स्पष्ट रखते हुए δαιμονίζομαι की अवस्था को किसी अधिक विकसित तकनीकी सिद्धान्त में नहीं बदलती।
- source_word: μὴ
  choice: क्या ... सकती है?
  rationale: μή ऐसे प्रश्न का संकेत देता है जिसका अपेक्षित उत्तर ‘नहीं’ है। हिन्दी में प्रसंग सहित यह प्रश्नात्मक रचना उस आलंकारिक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: δαιμόνιον
  choice: कोई दुष्टात्मा
  rationale: ‘दुष्टात्मा’ δαιμόνιον का प्रचलित और स्पष्ट हिन्दी समतुल्य है; ‘कोई’ अनिश्चित एकवचन को स्वाभाविक बनाता है।
- source_word: δύναται
  choice: सकती है
  rationale: यह सामर्थ्य को व्यक्त करता है; μή से आरम्भ हुए आलंकारिक प्रश्न के भीतर इसका अपेक्षित उत्तर नकारात्मक है।
- source_word: τυφλῶν ὀφθαλμοὺς
  choice: अंधों की आँखें
  rationale: यह मूल संबंधकारक रचना और पिछले प्रसंग में जन्म से अंधे व्यक्ति को दृष्टि मिलने की ठोस छवि दोनों को बनाए रखता है।
- source_word: ἀνοῖξαι
  choice: खोल
  rationale: मूल क्रिया का सीधा अर्थ ‘खोलना’ है। इससे आँखें खोलने की ठोस छवि बनी रहती है, जबकि ‘दृष्टि देना’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: δαιμονίζομαι और δαιμόνιον का अनुवाद
  choice: दुष्टात्मा से ग्रस्त व्यक्ति / दुष्टात्मा
  alternative: दुष्टात्मा के वश में व्यक्ति / अशुद्ध आत्मा
  rationale: पद में लोगों का तर्क है कि यीशु की बातें और उनका कार्य दुष्टात्मा की गतिविधि से मेल नहीं खाते। चुनी हुई भाषा मूल के दुष्टात्मा-संबंधी कथन को स्पष्ट रखती है, पर ‘ग्रस्त’ की अवस्था के बारे में मूल से अधिक विस्तृत धार्मिक सिद्धान्त नहीं जोड़ती।
- issue: μή से आरम्भ प्रश्न का आलंकारिक बल
  choice: क्या कोई दुष्टात्मा अंधों की आँखें खोल सकती है?
  alternative: भला कोई दुष्टात्मा अंधों की आँखें खोल सकती है?
  rationale: मूल प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। सरल ‘क्या’ वाला रूप प्रसंग में यह अपेक्षा बनाए रखता है और ‘भला’ जोड़कर बल को आवश्यकता से अधिक नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कह रहे थे’ चलती हुई चर्चा को, और ‘अंधों की आँखें खोलना’ मूल की ठोस छवि को सुरक्षित रखता है।
