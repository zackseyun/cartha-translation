source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ ⸀Ἰουδαῖοι· Περὶ καλοῦ ἔργου οὐ λιθάζομέν σε ἀλλὰ περὶ βλασφημίας, καὶ ὅτι σὺ ἄνθρωπος ὢν ποιεῖς σεαυτὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/033.yaml
  text: The Jews answered him[a], “We are not stoning you for a good work, but for blasphemy, and because you, being a man, make yourself God.”
translation:
  language: hi
  text: यहूदियों ने उसे उत्तर दिया, “हम किसी भले काम के कारण तुम्हें पत्थरवाह नहीं कर रहे, बल्कि परमेश्वर की निन्दा के कारण कर रहे हैं, क्योंकि तुम मनुष्य होकर अपने आपको परमेश्वर[a] ठहराते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको एक देवता ठहराते हो।” यूनानी में θεόν के साथ उपपद नहीं है, पर इस प्रसंग में परमेश्वर की निन्दा के आरोप को देखते हुए “परमेश्वर” अधिक संभावित अर्थ है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰουδαῖοι
  choice: यहूदी
  rationale: यह यूनानी पद का सीधा और स्वाभाविक अनुवाद है। इस प्रसंग में इसका तात्कालिक संकेत यीशु का विरोध कर रहे समूह की ओर है; ‘यहूदी अगुवे’ कहना मूल से अधिक संकीर्ण व्याख्या होती।
- source_word: Περὶ καλοῦ ἔργου
  choice: किसी भले काम के कारण
  rationale: περί के कारणात्मक भाव और ἔργου के एकवचन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λιθάζομέν
  choice: पत्थरवाह नहीं कर रहे
  rationale: वर्तमान काल की जारी कार्रवाई अथवा तत्काल मंशा को व्यक्त करता है। ‘पत्थरवाह करना’ प्रसंग में पत्थरों से मार डालने का अर्थ स्पष्ट रखता है।
- source_word: βλασφημίας
  choice: परमेश्वर की निन्दा
  rationale: हिन्दी में अकेला ‘निन्दा’ व्यापक हो सकता है; यहाँ आरोप विशेष रूप से परमेश्वर का अपमान करने का है, इसलिए यह वाक्यांश अर्थ स्पष्ट करता है।
- source_word: ἄνθρωπος ὢν
  choice: मनुष्य होकर
  rationale: यूनानी कृदन्तीय रचना के परिस्थितिजन्य तथा निहित विरोधात्मक भाव को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ποιεῖς σεαυτὸν θεόν
  choice: अपने आपको परमेश्वर ठहराते हो
  rationale: ποιέω के साथ आत्मवाचक कर्म और विधेय कर्मकारक का आशय स्वयं को किसी पद या स्वरूप का बताना/ठहराना है। ‘परमेश्वर’ इस ईशनिन्दा के आरोप का सर्वाधिक संभावित आशय है।
theological_decisions:
- issue: ποιεῖς σεαυτὸν θεόν में θεόν का अनुवाद
  choice: अपने आपको परमेश्वर ठहराते हो
  alternative: अपने आपको एक देवता ठहराते हो
  rationale: θεόν के साथ उपपद नहीं है, इसलिए केवल व्याकरण की दृष्टि से ‘एक देवता’ संभव है। फिर भी परमेश्वर की निन्दा के आरोप और यूहन्ना के एकेश्वरवादी प्रसंग में आरोप का अधिक संभावित आशय इस्राएल के परमेश्वर का दर्जा ग्रहण करना है। वैकल्पिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘पत्थरवाह’ बाइबलीय प्रसंग में सटीक और प्रचलित है; ‘परमेश्वर की निन्दा’ सामान्य पाठक के लिए ‘ईशनिन्दा’ से अधिक पारदर्शी है। पादटिप्पणी-चिह्न [a] उसी विवादित पद के बाद रखा गया है जिस पर टिप्पणी लागू होती है।
