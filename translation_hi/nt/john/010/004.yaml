source:
  edition: SBLGNT
  text: ⸀ὅταν τὰ ἴδια ⸀πάντα ἐκβάλῃ, ἔμπροσθεν αὐτῶν πορεύεται, καὶ τὰ πρόβατα αὐτῷ ἀκολουθεῖ, ὅτι οἴδασιν τὴν φωνὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/004.yaml
  text: When he has brought out all his own[a], he goes before them, and the sheep follow him, because they know his voice.
translation:
  language: hi
  text: जब वह अपनी सभी भेड़ों को बाहर निकाल लेता है[a], तब वह उनके आगे-आगे चलता है, और भेड़ें उसके पीछे चलती हैं, क्योंकि वे उसकी आवाज़ पहचानती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाहर हाँक देता है’ अथवा ‘बाहर ले आता है’; यूनानी क्रिया में किसी घेरे से हाँककर या बाहर लाने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: अनिश्चित कालवाचक उपवाक्य का स्वाभाविक हिन्दी रूप; इस प्रसंग में सामान्यतः होने वाली क्रिया को व्यक्त करता है।
- source_word: τὰ ἴδια πάντα
  choice: अपनी सभी भेड़ों को
  rationale: शाब्दिक अर्थ ‘अपने सभी’ है, पर हिन्दी में संज्ञा के बिना यह अस्वाभाविक और अस्पष्ट होगा। संदर्भ स्पष्ट रूप से चरवाहे की अपनी भेड़ों का है।
- source_word: ἐκβάλῃ
  choice: बाहर निकाल लेता है
  rationale: क्रिया बाहर की ओर ले जाने या हाँकने का भाव रखती है। यह चयन बाड़े से बाहर आने की गति को बनाए रखता है, पर अनावश्यक रूप से कठोर निष्कासन का भाव नहीं देता।
- source_word: ἔμπροσθεν αὐτῶν πορεύεται
  choice: वह उनके आगे-आगे चलता है
  rationale: चरवाहे के झुंड के आगे चलकर मार्ग दिखाने का स्थानिक चित्र स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: αὐτῷ ἀκολουθεῖ
  choice: उसके पीछे चलती हैं
  rationale: ἀκολουθέω का अर्थ यहाँ किसी के पीछे चलना है; हिन्दी में यह ‘उसका अनुसरण करती हैं’ की अपेक्षा अधिक ठोस और स्वाभाविक है।
- source_word: οἴδασιν τὴν φωνὴν αὐτοῦ
  choice: वे उसकी आवाज़ पहचानती हैं
  rationale: οἶδα मूलतः ‘जानना’ है, पर आवाज़ के संदर्भ में हिन्दी में ‘पहचानना’ उसी ज्ञान को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: चरवाही के रूपक में ἐκβάλῃ का बल
  choice: बाहर निकाल लेता है
  alternative: बाहर हाँक देता है / बाहर ले आता है
  rationale: मूल क्रिया में बलपूर्वक बाहर निकालने या हाँकने की संभावना है, किंतु तत्काल संदर्भ अपनी भेड़ों को बाड़े से बाहर लाने का है, शत्रुतापूर्ण निष्कासन का नहीं। मुख्य पाठ संदर्भानुकूल सामान्य अर्थ देता है और पादटिप्पणी अधिक प्रबल विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘आगे-आगे चलता है’ और ‘पीछे चलती हैं’ चरवाही के दृश्य को ठोस रखते हैं; ‘पहचानती हैं’ आवाज़ के संदर्भ में सामान्य हिन्दी प्रयोग है।
