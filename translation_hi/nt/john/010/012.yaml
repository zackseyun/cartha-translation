source:
  edition: SBLGNT
  text: ὁ ⸀μισθωτὸς καὶ οὐκ ὢν ποιμήν, οὗ οὐκ ⸀ἔστιν τὰ πρόβατα ἴδια, θεωρεῖ τὸν λύκον ἐρχόμενον καὶ ἀφίησιν τὰ πρόβατα καὶ φεύγει— καὶ ὁ λύκος ἁρπάζει αὐτὰ καὶ ⸀σκορπίζει—
base_translation:
  language: en
  yaml_path: translation/nt/john/010/012.yaml
  text: The hired hand[a], who is not a shepherd and whose sheep are not his own, sees the wolf coming and leaves the sheep and flees—and the wolf snatches them and scatters them.
translation:
  language: hi
  text: मज़दूर, जो चरवाहा नहीं है और जिसकी अपनी भेड़ें नहीं हैं, भेड़िए को आते देखता है और भेड़ों को छोड़ देता है[a] और भाग जाता है—और भेड़िया उन्हें झपट लेता है और तितर-बितर कर देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भेड़ों को संकट में बेसहारा छोड़ देता है।” यहाँ प्रयुक्त क्रिया में त्यागकर चले जाने का अधिक कठोर भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μισθωτός
  choice: मज़दूर
  rationale: यह शब्द मज़दूरी के लिए काम करनेवाले व्यक्ति को दर्शाता है। ‘मज़दूर’ आधुनिक और सहज है तथा सच्चे चरवाहे के साथ मूल विरोध को बनाए रखता है।
- source_word: οὐκ ὢν ποιμήν
  choice: जो चरवाहा नहीं है
  rationale: यूनानी कृदंत-वाक्यांश को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है, जिससे यह बात स्पष्ट रहती है कि वह वास्तव में चरवाहा नहीं है।
- source_word: οὗ οὐκ ἔστιν τὰ πρόβατα ἴδια
  choice: भेड़ें जिसकी अपनी नहीं हैं
  rationale: यह भेड़ों पर उसके स्वामित्व और निजी संबंध के अभाव को व्यक्त करता है तथा ἴδια के ‘अपनी’ भाव को बनाए रखता है।
- source_word: θεωρεῖ
  choice: देखता है
  rationale: संदर्भ में यह आनेवाले खतरे को प्रत्यक्ष देखने का बोध देता है; ‘देखता है’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: τὸν λύκον ἐρχόμενον
  choice: भेड़िए को आते
  rationale: यह कर्म के साथ वर्तमान कृदंत की गतिशीलता को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀφίησιν
  choice: छोड़ देता है
  rationale: क्रिया का मूल अर्थ ‘छोड़ना’ है और इस संदर्भ में संकट के समय बेसहारा छोड़ने का अधिक कठोर भाव भी हो सकता है; मुख्य पाठ सीधा अर्थ रखता है और पादटिप्पणी उस संभावना को बताती है।
- source_word: φεύγει
  choice: भाग जाता है
  rationale: यह खतरे से पलायन को स्पष्ट, जीवंत और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἁρπάζει
  choice: झपट लेता है
  rationale: यह शिकारी द्वारा हिंसक और अचानक पकड़ लेने की क्रिया को सजीव रूप से व्यक्त करता है।
- source_word: σκορπίζει
  choice: तितर-बितर कर देता है
  rationale: यह भेड़ों को अलग-अलग दिशाओं में बिखेर देने का अर्थ स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: πρόβατα
  choice: भेड़ें
  rationale: बहुवचन ठोस संज्ञा को बनाए रखने से पूरे चरवाही रूपक की दृश्यात्मकता सुरक्षित रहती है।
theological_decisions:
- issue: चरवाहे के रूपक का स्वरूप
  choice: ‘चरवाहा’, ‘मज़दूर’, ‘भेड़ें’ और ‘भेड़िया’ जैसे चरवाही-संबंधी शब्दों को रूपक के भीतर उनके प्रत्यक्ष अर्थ में बनाए रखा गया है।
  alternative: इनके स्थान पर ‘अगुवा’, ‘देखभाल करनेवाला’, ‘लोग’ या ‘शत्रु’ जैसे व्याख्यात्मक शब्द रखना।
  rationale: यूहन्ना 10 में चरवाही का रूपक लगातार चलता है। व्याख्यात्मक पदों से बदलने पर मूल चित्र धुंधला होता और पाठ से अधिक धार्मिक व्याख्या अनुवाद में आ जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। वाक्य की पुनरावृत्त संरचना और यूनानी पाठ की नाटकीय गति को डैश तथा क्रमिक क्रियाओं से बनाए रखा गया है।
