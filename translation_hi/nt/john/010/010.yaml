base_translation:
  language: en
  yaml_path: translation/nt/john/010/010.yaml
  text: The thief comes only to steal and slaughter and destroy[a]; I came so that they may have life[b], and have it abundantly.
translation:
  language: hi
  text: चोर केवल चोरी करने, वध करने और नाश करने आता है[a]; मैं इसलिए आया कि वे जीवन पाएँ और भरपूर जीवन पाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मार डालने’। यूनानी क्रिया प्रायः पशु के वध के लिए प्रयुक्त होती है, जो यहाँ भेड़ों के प्रसंग के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जीवन बहुतायत से पाएँ’ अथवा ‘जीवन भरपूर रूप से पाएँ’।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ κλέπτης
  choice: चोर
  rationale: संज्ञा के साथ लगा निश्चित लेख एक प्रतिनिधि, निश्चित चोर की ओर संकेत करता है; हिन्दी में ‘चोर’ यह भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἔρχεται εἰ μὴ
  choice: केवल ... आता है
  rationale: यह मुहावरा आने के एकमात्र उद्देश्य पर बल देता है। ‘केवल’ हिन्दी में इस विशिष्टता को सहज ढंग से बनाए रखता है।
- source_word: ἵνα κλέψῃ
  choice: चोरी करने
  rationale: यह उद्देश्यसूचक उपवाक्य है; पहले पद के साथ क्रियार्थक रूप हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: θύσῃ
  choice: वध करने
  rationale: θύω प्रायः पशु को मारने या उसका वध करने के लिए आता है। भेड़ों के प्रसंग में ‘वध’ उसकी विशिष्ट और तीखी छवि को सुरक्षित रखता है।
- source_word: ἀπολέσῃ
  choice: नाश करने
  rationale: यह शब्द पूर्ण विनाश या बरबादी का व्यापक भाव रखता है; ‘नाश करने’ क्रियाओं की इस क्रमिक श्रृंखला में उपयुक्त है।
- source_word: ἐγὼ ἦλθον
  choice: मैं ... आया
  rationale: साधारण भूतकाल यीशु के आने के उद्देश्य को चोर के आने के उद्देश्य के विपरीत रखता है। अलग सर्वनाम ‘मैं’ यूनानी के स्पष्ट बल को भी बनाए रखता है।
- source_word: ἵνα ζωὴν ἔχωσιν
  choice: कि वे जीवन पाएँ
  rationale: ‘जीवन’ यूहन्ना का प्रमुख और अर्थगर्भित शब्द है। ‘पाएँ’ हिन्दी में जीवन को प्राप्त करने और धारण करने का भाव स्वाभाविक रूप से देता है, बिना ‘अनन्त’ जैसा अनुपस्थित विशेषण जोड़े।
- source_word: περισσὸν ἔχωσιν
  choice: और उसे भरपूर पाएँ
  rationale: περισσόν यहाँ जीवन की प्रचुरता या परिपूर्ण मात्रा बताता है। ‘उसे’ का संकेत जीवन की ओर है और ‘भरपूर’ इस भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के प्रयोग में ζωὴ का आशय
  choice: जीवन
  alternative: अनन्त जीवन; सच्चा जीवन
  rationale: मूल पद में ‘अनन्त’ विशेषण नहीं है। केवल ‘जीवन’ रखने से यूहन्ना की व्यापक धर्मवैचारिक प्रतिध्वनि बनी रहती है और अनुवाद पाठ से अधिक निश्चित नहीं होता।
- issue: περισσὸν की शक्ति
  choice: उसे भरपूर पाएँ
  alternative: जीवन बहुतायत से पाएँ; जीवन पूरी तरह पाएँ
  rationale: वाक्य यीशु द्वारा दिए जाने वाले जीवन की प्रचुरता बताता है। ‘भरपूर’ इस सकारात्मक पूर्णता को सुरक्षित रखता है, पर इसे भौतिक समृद्धि के दावे में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘वध’ प्रसंग की पशु-संबंधी छवि को बनाए रखता है, जबकि पादटिप्पणी अधिक सामान्य विकल्प देती है। ‘भरपूर’ प्रचुर जीवन का भाव व्यक्त करता है और समृद्धि-सिद्धान्त जैसी अतिरिक्त व्याख्या से बचता है।
