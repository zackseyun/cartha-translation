id: JHN.10.16
reference: John 10:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἄλλα πρόβατα ἔχω ἃ οὐκ ἔστιν ἐκ τῆς αὐλῆς ταύτης· κἀκεῖνα ⸂δεῖ με⸃ ἀγαγεῖν, καὶ τῆς φωνῆς μου ἀκούσουσιν, καὶ ⸀γενήσονται μία ποίμνη, εἷς ποιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/016.yaml
  text: And I have other sheep that are not from this sheepfold[a]. I must bring them also, and they will listen to my voice. Then there will be one flock[b], one shepherd.
translation:
  language: hi
  text: मेरी और भी भेड़ें हैं, जो इस भेड़शाला की नहीं हैं। मुझे उन्हें भी अवश्य लाना है। वे मेरी आवाज़ सुनेंगी,[a] और तब एक झुंड होगा,[b] और एक चरवाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे मेरी आवाज़ पर ध्यान देंगी।” यूनानी क्रिया का अर्थ केवल सुनना या ध्यान देकर सुनना—दोनों हो सकता है; यहाँ संभवतः उत्तरदायी होकर सुनना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “भेड़शाला” (αὐλή)—अर्थात घेरा—और “झुंड” (ποίμνη)—अर्थात भेड़ों का समूह—के लिए अलग शब्द हैं। इसलिए अंतिम वाक्यांश “एक भेड़शाला” नहीं, बल्कि “एक झुंड” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλα πρόβατα
  choice: और भी भेड़ें
  rationale: πρόβατα सामान्य रूप से ‘भेड़ें’ है, केवल मेमने नहीं; ἄλλα पहले से दृष्टि में मौजूद भेड़ों के अतिरिक्त अन्य भेड़ों को दर्शाता है।
- source_word: αὐλή
  choice: भेड़शाला
  rationale: चरवाही के इस संदर्भ में αὐλή भेड़ों के घेरे या बाड़े को दर्शाता है। ‘भेड़शाला’ इसे स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: κἀκεῖνα
  choice: उन्हें भी
  rationale: यह नपुंसकलिंग बहुवचन सर्वनाम पीछे उल्लिखित ‘और भेड़ों’ की ओर संकेत करता है; हिंदी में ‘उन्हें भी’ स्वाभाविक है।
- source_word: δεῖ με ἀγαγεῖν
  choice: मुझे उन्हें भी लाना अवश्य है
  rationale: δεῖ आवश्यकता की प्रबलता रखता है और ἀγαγεῖν का अर्थ यहाँ लाना या ले आना है। ‘अवश्य है’ उस आवश्यकता को बनाए रखता है, बिना उसका कोई विशेष धर्मवैज्ञानिक कारण निर्धारित किए।
- source_word: τῆς φωνῆς μου ἀκούσουσιν
  choice: वे मेरी आवाज़ सुनेंगी
  rationale: ἀκούω का अर्थ ‘सुनना’ और संदर्भानुसार ‘ध्यान देकर सुनना/मानना’ दोनों हो सकता है। मुख्य पाठ में ‘सुनेंगी’ मूल की अस्पष्टता बनाए रखता है और पादटिप्पणी उत्तरदायी सुनने की संभावित छाया बताती है।
- source_word: γενήσονται
  choice: तब ... होगा
  rationale: γίνομαι यहाँ भविष्य में अस्तित्व में आने वाली परिणामी स्थिति व्यक्त करता है; ‘तब ... होगा’ सहज हिंदी है।
- source_word: μία ποίμνη
  choice: एक झुंड
  rationale: ποίμνη भेड़ों के समूह को दर्शाता है, उनके घेरे को नहीं। ‘एक झुंड’ αὐλή से शब्दार्थगत भेद बनाए रखता है।
- source_word: εἷς ποιμήν
  choice: एक चरवाहा
  rationale: ποιμήν का सीधा अर्थ ‘चरवाहा’ है और यह पद की चरवाही-विषयक छवि को स्पष्ट रखता है।
theological_decisions:
- issue: αὐλή और ποίμνη का भेद
  choice: इस भेड़शाला ... एक झुंड
  alternative: इस बाड़े ... एक बाड़ा
  rationale: यूनानी पाठ पहले भेड़ों के घेरे (αὐλή) और बाद में भेड़ों के समूह (ποίμνη) के लिए अलग शब्द रखता है। हिंदी में इस अंतर को बनाए रखने से पाठ को एक ही संस्थागत घेरे के अर्थ में सीमित नहीं किया जाता।
- issue: δεῖ की प्रबलता
  choice: मुझे उन्हें भी लाना अवश्य है
  alternative: मुझे उन्हें भी लाना है
  rationale: ‘अवश्य’ आवश्यकता की प्रबलता को व्यक्त करता है, जबकि उस आवश्यकता के धर्मवैज्ञानिक आधार को अनिर्धारित रहने देता है।
- issue: ἀκούω में सुनने और उत्तरदायी सुनने की संभावना
  choice: वे मेरी आवाज़ सुनेंगी
  alternative: वे मेरी आवाज़ मानेंगी
  rationale: ‘मानेंगी’ आज्ञाकारिता को स्पष्ट कर देता, जबकि यूनानी क्रिया सुनने से लेकर ध्यानपूर्वक या उत्तरदायी सुनने तक अर्थ दे सकती है। मुख्य पाठ मूल की व्यापकता रखता है; पादटिप्पणी संभावित आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। चरवाही की उपमा स्पष्ट रखी गई है। ‘भेड़शाला’ और ‘झुंड’ का अंतर जानबूझकर सुरक्षित है। स्त्रीलिंग बहुवचन ‘सुनेंगी’ का संबंध ‘भेड़ें’ से है।
