source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν, ὁ μὴ εἰσερχόμενος διὰ τῆς θύρας εἰς τὴν αὐλὴν τῶν προβάτων ἀλλὰ ἀναβαίνων ἀλλαχόθεν ἐκεῖνος κλέπτης ἐστὶν καὶ λῃστής·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/001.yaml
  text: Truly[a], truly, I say to you, the one who does not enter through the door into the sheepfold[c][b], but climbs up from somewhere else—that man is a thief and a robber.
translation:
  language: hi
  text: '“मैं तुमसे सच-सच कहता हूँ: जो भेड़ों के बाड़े[a] में द्वार[b] से प्रवेश नहीं करता, बल्कि किसी और जगह से चढ़कर आता है, वही चोर और लुटेरा[c] है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेड़ों के घेरे में।” यूनानी αὐλή किसी घिरे हुए आँगन या पशु-बाड़े को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “फाटक से।” यूनानी θύρα का अर्थ प्रसंग के अनुसार “द्वार,” “दरवाज़ा” या “फाटक” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “चोर” (κλέπτης) और “लुटेरा” (λῃστής) अलग शब्द हैं; दूसरा शब्द प्रायः बलपूर्वक या हिंसक ढंग से लूटने वाले का संकेत देता है।
    reason: lexical_distinction
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराए गए गंभीर और बलपूर्ण कथन-सूत्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन-सूत्र को स्पष्ट तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὁ μὴ εἰσερχόμενος
  choice: जो ... प्रवेश नहीं करता
  rationale: यूनानी के संज्ञार्थक वर्तमान कृदन्त का सामान्य एकवचन भाव सहज हिन्दी में सुरक्षित रहता है।
- source_word: διὰ τῆς θύρας
  choice: द्वार से
  rationale: θύρα के ‘दरवाज़ा/फाटक/द्वार’ अर्थ-क्षेत्र को समेटने वाला गरिमापूर्ण और प्रसंगानुकूल शब्द है।
- source_word: εἰς τὴν αὐλὴν τῶν προβάτων
  choice: भेड़ों के बाड़े में
  rationale: αὐλή के घेरे हुए स्थान या पशु-बाड़े के अर्थ को देहाती चित्र के अनुरूप स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ ἀναβαίνων ἀλλαχόθεν
  choice: बल्कि किसी दूसरी ओर से चढ़कर भीतर आता है
  rationale: ἀναβαίνων की चढ़ने की भौतिक छवि और ἀλλαχόθεν की दूसरी दिशा या स्थान—दोनों को स्पष्ट रखता है; ‘भीतर आता है’ हिन्दी में निहित प्रवेश को सहज बनाता है।
- source_word: ἐκεῖνος
  choice: वही
  rationale: बलात्मक संकेत को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक रूप से ‘वह मनुष्य’ नहीं जोड़ता।
- source_word: κλέπτης
  choice: चोर
  rationale: छिपकर चोरी करने वाले के लिए मानक और सटीक हिन्दी शब्द।
- source_word: λῃστής
  choice: लुटेरा
  rationale: κλέπτης से भेद बनाए रखते हुए बलपूर्वक या हिंसक ढंग से लूटने वाले का भाव देता है।
theological_decisions:
- issue: αὐλή और θύρα की रूपकात्मक छवि
  choice: छवि को ‘भेड़ों का बाड़ा’ और ‘द्वार’ के रूप में ठोस रखा गया है, बिना इस पद में रूपक की पहचान समझाए।
  alternative: ‘भेड़शाला’ और ‘फाटक’ कहना, या आगे के प्रसंग के आधार पर रूपक का अर्थ पाठ में खोल देना।
  rationale: यह पद रूपक आरम्भ करता है और उसका स्पष्टीकरण आगे आता है; अनुवाद को इस पद में अतिरिक्त मसीही, कलीसियाई या उद्धार-संबंधी व्याख्या नहीं जोड़नी चाहिए।
- issue: संज्ञार्थक पुल्लिंग एकवचन कृदन्त और ἐκεῖνος
  choice: ‘जो ... करता’ और ‘वही’ के द्वारा सामान्य एकवचन तथा बलात्मक संकेत सुरक्षित रखा गया है।
  alternative: ‘वह मनुष्य जो ...’ या बहुवचन ‘जो लोग ...’।
  rationale: हिन्दी में ‘जो ... वही’ स्वाभाविक रूप से प्रतिनिधिक एकवचन व्यक्त करता है; इससे यूनानी का बल बना रहता है और पाठ में अनावश्यक संज्ञा नहीं जुड़ती।
- issue: κλέπτης और λῃστής का भेद
  choice: ‘चोर और लुटेरा’
  alternative: दोनों के लिए केवल ‘चोर’, अथवा ‘चोर और डाकू’।
  rationale: दो अलग यूनानी शब्दों का अर्थगत तनाव बनाए रखना आवश्यक है; ‘लुटेरा’ बलपूर्वक लूट का संकेत देता है, जबकि ‘डाकू’ संगठित या सशस्त्र गिरोह का अपेक्षाकृत अधिक विशिष्ट भाव ला सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। ‘सच-सच’ यूहन्ना के दोहरे Ἀμὴν सूत्र का परिचित और स्वाभाविक रूप है। ‘बाड़ा,’ ‘द्वार,’ ‘चढ़कर,’ ‘चोर’ और ‘लुटेरा’ मूल की ठोस चरवाही छवि तथा शब्दगत भेद को बनाए रखते हैं।
