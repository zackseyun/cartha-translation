id: JHN.10.28
reference: John 10:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κἀγὼ ⸂δίδωμι αὐτοῖς ζωὴν αἰώνιον⸃, καὶ οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα, καὶ οὐχ ἁρπάσει τις αὐτὰ ἐκ τῆς χειρός μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/028.yaml
  text: And I give them eternal life, and they will certainly never perish forever, and no one will snatch them out of my hand.
translation:
  language: hi
  text: और मैं उन्हें अनन्त जीवन देता हूँ, और वे अनन्तकाल तक कभी नाश नहीं होंगे, और कोई उन्हें मेरे हाथ से छीन नहीं लेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह प्रचलित, स्वाभाविक और अर्थ की दृष्टि से सटीक हिन्दी पदबंध है।
- source_word: οὐ μὴ ἀπόλωνται εἰς τὸν αἰῶνα
  choice: वे अनन्तकाल तक कभी नाश नहीं होंगे
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कभी नहीं’ और εἰς τὸν αἰῶνα की कालगत व्यापकता को ‘अनन्तकाल तक’ से व्यक्त किया गया है, बिना दोनों को एक-दूसरे में मिला देने के।
- source_word: ἁρπάσει
  choice: छीन लेगा
  rationale: यह बलपूर्वक किसी के अधिकार या पकड़ से निकाल लेने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τῆς χειρός μου
  choice: मेरे हाथ से
  rationale: मूल रूपक को सीधे और स्पष्ट रूप में बनाए रखा गया है।
theological_decisions:
- issue: प्रबल निषेध और ‘सदा के लिए’ के वाक्यांश का संबंध
  choice: ‘अनन्तकाल तक कभी नाश नहीं होंगे’ के द्वारा दोनों तत्व स्पष्ट रखे गए हैं।
  alternative: ‘वे कभी नाश नहीं होंगे’ या ‘वे सदा के लिए नाश नहीं होंगे’
  rationale: मूल यूनानी में οὐ μή और εἰς τὸν αἰῶνα दोनों उपस्थित हैं; चुना हुआ रूप किसी विशेष धर्मसैद्धान्तिक प्रणाली को जोड़े बिना दोनों की अभिव्यक्ति करता है।
- issue: ‘मेरे हाथ’ का रूपक
  choice: रूपक को ज्यों का त्यों रखा गया है।
  alternative: ‘मेरी सुरक्षा/अधीनता से’
  rationale: व्याख्यात्मक विस्तार से बचते हुए यीशु के कथन की सजीवता और सम्भावित अर्थ-व्याप्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। वाक्य की समानान्तर संरचना तथा मूल के बलाघात को यथासम्भव बनाए रखा गया है।
