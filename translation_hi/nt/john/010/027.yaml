id: JHN.10.27
reference: John 10:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ⸀ἀκούουσιν, κἀγὼ γινώσκω αὐτά, καὶ ἀκολουθοῦσίν μοι,
base_translation:
  language: en
  yaml_path: translation/nt/john/010/027.yaml
  text: My sheep hear my voice, and I know them, and they follow me.
translation:
  language: hi
  text: मेरी भेड़ें मेरी आवाज़ सुनती हैं; मैं उन्हें जानता हूँ, और वे मेरे पीछे चलती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρόβατα τὰ ἐμὰ
  choice: मेरी भेड़ें
  rationale: चरवाहे और भेड़ों के रूपक में यह स्वाभाविक और प्रचलित हिन्दी है; अधिकारसूचक बल बना रहता है, पर अनावश्यक रूप से ‘मेरी अपनी’ नहीं जोड़ा गया।
- source_word: τῆς φωνῆς μου
  choice: मेरी आवाज़
  rationale: व्यक्तिगत पहचान के प्रसंग में ‘आवाज़’ व्यापक ‘ध्वनि’ से अधिक सटीक और सहज है।
- source_word: ἀκούουσιν
  choice: सुनती हैं
  rationale: वर्तमान काल की निरंतर या चारित्रिक क्रिया को हिन्दी का सामान्य वर्तमान स्वाभाविक रूप से व्यक्त करता है; ‘ध्यान से सुनती हैं’ कहना मूल से अधिक अर्थ जोड़ता।
- source_word: κἀγὼ γινώσκω αὐτά
  choice: मैं उन्हें जानता हूँ
  rationale: ‘जानता हूँ’ यूहन्ना में निहित संबंधपरक गहराई को खुला रखता है; ‘पहचानता हूँ’ अर्थ को संकुचित करता और ‘व्यक्तिगत रूप से जानता हूँ’ व्याख्यात्मक विस्तार होता।
- source_word: ἀκολουθοῦσίν μοι
  choice: वे मेरे पीछे चलती हैं
  rationale: भेड़ और चरवाहे के प्रत्यक्ष चित्र में ‘पीछे चलती हैं’ स्वाभाविक हिन्दी है और शिष्यत्व के रूपक को भी बनाए रखता है।
theological_decisions:
- issue: γινώσκω का संबंधपरक आशय
  choice: ‘जानता हूँ’
  alternative: ‘व्यक्तिगत रूप से जानता हूँ’ या ‘पहचानता हूँ’
  rationale: मूल क्रिया में संबंधपरक गहराई हो सकती है, पर पद स्वयं उसे किसी संकीर्ण धर्मवैज्ञानिक सूत्र में स्पष्ट नहीं करता; सरल अनुवाद अर्थ की व्यापकता और तनाव दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘आवाज़’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘मेरे पीछे चलती हैं’ चरवाहे के दृश्य और रूपकात्मक अनुसरण दोनों को संप्रेषित करता है।
