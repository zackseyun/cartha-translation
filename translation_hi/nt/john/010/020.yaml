  text: ἔλεγον δὲ πολλοὶ ἐξ αὐτῶν· Δαιμόνιον ἔχει καὶ μαίνεται· τί αὐτοῦ ἀκούετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/010/020.yaml
  text: But many of them were saying[a], “He has a demon and is insane. Why do you listen to him?”
translation:
  language: hi
  text: पर उनमें से बहुत-से लोग कह रहे थे, “उसमें दुष्टात्मा है और वह पागल है। तुम उसकी क्यों सुनते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल दृश्य में चलती या बार-बार कही जा रही बात को व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: पिछली प्रतिक्रिया के विपरीत प्रतिक्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: πολλοὶ ἐξ αὐτῶν
  choice: उनमें से बहुत-से लोग
  rationale: 'अंशवाचक अभिव्यक्ति को बनाए रखता है: यह पूरे समूह की नहीं, उसमें से बहुतों की प्रतिक्रिया थी।'
- source_word: Δαιμόνιον ἔχει
  choice: उसमें दुष्टात्मा है
  rationale: यूनानी अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है; यह आरोप को 'दुष्टात्मा के वश में है' जैसी अधिक व्याख्यात्मक भाषा में नहीं बदलता।
- source_word: μαίνεται
  choice: वह पागल है
  rationale: संदर्भ में मानसिक विक्षिप्तता के शत्रुतापूर्ण आरोप को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: τί αὐτοῦ ἀκούετε;
  choice: तुम उसकी क्यों सुनते हो?
  rationale: τί यहाँ प्रसंगानुसार 'क्यों' है और जननकारक के साथ ἀκούω किसी की बात सुनने या उस पर ध्यान देने का भाव देता है।
theological_decisions:
- issue: यीशु की दशा के विषय में विरोधियों का अपमानजनक आरोप
  choice: उसमें दुष्टात्मा है और वह पागल है
  alternative: वह दुष्टात्मा के वश में है और सनकी है
  rationale: चुना हुआ रूप विरोधियों के आरोप को बिना नरम किए सीधे रखता है, पर यूनानी से आगे बढ़कर आधिपत्य की कोई विशिष्ट व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। संवाद में 'तुम' समूह को संबोधित करता है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि मुख्य पाठ यूनानी की वास्तविक संरचना और अर्थ को पर्याप्त रूप से संप्रेषित करता है।
