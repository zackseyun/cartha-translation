id: JHN.10.17
reference: John 10:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτό ⸂με ὁ πατὴρ⸃ ἀγαπᾷ ὅτι ἐγὼ τίθημι τὴν ψυχήν μου, ἵνα πάλιν λάβω αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/017.yaml
  text: For this reason the Father loves me[a], because I lay down my life so that I may take it up again.
translation:
  language: hi
  text: इसी कारण पिता मुझसे प्रेम करता है, क्योंकि मैं अपना जीवन[a] दे देता हूँ, ताकि उसे फिर से ले लूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना प्राण।” यहाँ ψυχή का सबसे स्वाभाविक अर्थ वह जीवन है जिसे यीशु मृत्यु में देता और फिर से लेता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पहले के कथन से संबंध जोड़ते हुए आगे आने वाले कारण की ओर संकेत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: με ὁ πατὴρ ἀγαπᾷ
  choice: पिता मुझसे प्रेम करता है
  rationale: यूनानी पाठ में कर्ता निश्चित पद के साथ ‘पिता’ है, ‘मेरा पिता’ नहीं; हिन्दी वाक्य कर्ता और कर्म का यही संबंध बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ यह पिता के प्रेम का कारण बताता है, केवल कथन की विषय-वस्तु प्रस्तुत नहीं करता।
- source_word: τίθημι τὴν ψυχήν μου
  choice: मैं अपना जीवन दे देता हूँ
  rationale: यूहन्ना 10 के प्रसंग में यह यीशु द्वारा स्वेच्छा से मृत्यु स्वीकार करने का मुहावरा है। ‘जीवन दे देना’ हिन्दी में स्वाभाविक है और स्वैच्छिक आत्मसमर्पण का भाव रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य की शक्ति को स्पष्ट रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: πάλιν
  choice: फिर से
  rationale: यह जीवन देने के बाद उसे पुनः लेने को स्पष्ट रूप से व्यक्त करता है।
- source_word: λάβω αὐτήν
  choice: उसे फिर से ले लूँ
  rationale: λαμβάνω का ‘लेना’ अर्थ और यीशु की सक्रिय भूमिका सुरक्षित रहती है; यह केवल निष्क्रिय रूप से जीवन ‘पाने’ का भाव नहीं देता।
theological_decisions:
- issue: मसीह के आत्मबलिदान के प्रसंग में ψυχή का अर्थ
  choice: ‘जीवन’
  alternative: ‘प्राण’ या शाब्दिक रूप से ‘आत्मा’
  rationale: यह पद यीशु की स्वैच्छिक मृत्यु और पुनः जीवन लेने की बात करता है। ‘आत्मा’ शरीर-आत्मा संबंधी ऐसा दावा सुझा सकता है जो यहाँ प्रमुख नहीं है; ‘जीवन’ प्रसंगगत अर्थ को स्पष्ट रखता है।
- issue: ἵνα के साथ λάβω में उद्देश्य और परिणाम का संबंध
  choice: ‘ताकि उसे फिर से ले लूँ’
  alternative: ‘जिससे मैं उसे फिर से लूँ’ या निश्चित भविष्य के रूप में ‘और मैं उसे फिर से लूँगा’
  rationale: ‘ताकि’ उद्देश्य की शक्ति बनाए रखता है, जबकि ‘ले लूँ’ यूनानी संभावनार्थक रूप को हिन्दी में स्वाभाविक ढंग से दर्शाता है और उसे केवल साधारण भविष्य में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दे देता हूँ’ स्वैच्छिकता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ले लूँ’ पुनरुत्थान में यीशु की सक्रिय भूमिका को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
