  text: Εἶπεν οὖν πάλιν ⸀αὐτοῖς ὁ Ἰησοῦς· Ἀμὴν ἀμὴν λέγω ὑμῖν ⸀ὅτι ἐγώ εἰμι ἡ θύρα τῶν προβάτων.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/007.yaml
  text: So Jesus said to them again[a], “Truly, truly, I say to you, I am the door for the sheep.”
translation:
  language: hi
  text: इसलिए यीशु ने उनसे फिर कहा, “मैं तुमसे सच-सच कहता हूँ, भेड़ों का द्वार[a] मैं हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेड़ों का फाटक।” यूनानी शब्द θύρα का अर्थ “द्वार,” “दरवाज़ा” या “फाटक” हो सकता है, विशेषकर भेड़ों के बाड़े के चित्र में।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले संवाद से कथात्मक और तार्किक निष्कर्ष को जोड़ता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक रूप से उस प्रवाह को बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यीशु के दोबारा कहने का सीधा और स्वाभाविक संकेत।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में प्रयुक्त दोहरे गंभीर उद्घोष की पुनरुक्ति और बल को स्पष्ट, प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: मूल वाक्य-विन्यास के औपचारिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: प्रत्यक्ष कथन के बाद हिन्दी में विषयवाचक संयोजक आवश्यक नहीं है; आशय पूर्णतः उपस्थित है।
- source_word: ἐγώ εἰμι
  choice: मैं हूँ
  rationale: स्पष्ट आत्म-पहचान को बनाए रखता है; ‘मैं’ को विधेय के बाद रखने से हिन्दी में उस पर स्वाभाविक बल पड़ता है।
- source_word: θύρα
  choice: द्वार
  rationale: यह ‘दरवाज़ा’ या ‘फाटक’ दोनों अर्थ दे सकता है। ‘द्वार’ गरिमापूर्ण, बोधगम्य और रूपक के लिए उपयुक्त है; चरवाही के प्रसंग में ‘फाटक’ को पादटिप्पणी में रखा गया है।
- source_word: τῶν προβάτων
  choice: भेड़ों का
  rationale: सम्बन्धकारक पदबंध को निकटता से रखता है और यह तय नहीं करता कि द्वार भेड़ों का है, उनके लिए है, या उनसे सम्बद्ध बाड़े का प्रवेश है।
theological_decisions:
- issue: ‘मैं हूँ’ वाले कथन में रूपकात्मक आत्म-पहचान
  choice: भेड़ों का द्वार मैं हूँ
  alternative: मैं भेड़ों के लिए फाटक हूँ
  rationale: यह अनुवाद यीशु की रूपकात्मक आत्म-पहचान को बिना सैद्धान्तिक विस्तार के सुरक्षित रखता है। ‘भेड़ों का’ यूनानी सम्बन्धकारक की सम्भावित व्यापकता को बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘सच-सच’ यूहन्ना के दोहरे Ἀμὴν को पारम्परिक धार्मिक जटिलता के बिना व्यक्त करता है; ‘भेड़ों का द्वार’ मूल के सम्बन्धकारक की अस्पष्टता को जानबूझकर बनाए रखता है।
