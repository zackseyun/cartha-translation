source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτοῖς ὁ Ἰησοῦς· Εἶπον ὑμῖν καὶ οὐ πιστεύετε· τὰ ἔργα ἃ ἐγὼ ποιῶ ἐν τῷ ὀνόματι τοῦ πατρός μου ταῦτα μαρτυρεῖ περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/025.yaml
  text: Jesus answered them[a], “I told you, and you do not believe[b]. The works that I do in the name of my Father—these testify about me.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “मैं तुमसे कह चुका हूँ, और तुम विश्वास नहीं करते। जो काम मैं अपने पिता के नाम से[a] करता हूँ, वे मेरे विषय में गवाही देते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पिता के अधिकार से।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरे बारे में साक्षी देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में ἀποκρίνομαι का स्वाभाविक और मानक हिन्दी रूप; कथात्मक शैली की गरिमा बनाए रखता है।
- source_word: Εἶπον ὑμῖν
  choice: मैं तुमसे कह चुका हूँ
  rationale: पूर्व में कही गई बात की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है; मूल का आशय है कि यीशु उन्हें पहले ही बता चुके हैं।
- source_word: οὐ πιστεύετε
  choice: तुम विश्वास नहीं करते
  rationale: यूहन्ना में πιστεύω की प्रमुख धार्मिक और साहित्यिक शब्दावली को बनाए रखता है तथा यीशु के कथन और साक्ष्य पर विश्वास न करने को व्यक्त करता है।
- source_word: τὰ ἔργα
  choice: काम
  rationale: आधुनिक हिन्दी में सहज है और यीशु के कार्यों को दर्शाता है; ‘कर्म’ की अपेक्षा कम दार्शनिक या कर्म-सिद्धांत संबंधी अर्थछाया रखता है।
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: अपने पिता के नाम से
  rationale: मूल यूनानी मुहावरे को बनाए रखते हुए प्रतिनिधित्व और अधिकार—दोनों अर्थ-संभावनाओं के लिए स्थान छोड़ता है।
- source_word: ταῦτα μαρτυρεῖ περὶ ἐμοῦ
  choice: वे ही मेरे विषय में गवाही देते हैं
  rationale: ταῦτα के बल को ‘वे ही’ से व्यक्त करता है और μαρτυρέω की यूहन्नाई साक्ष्य-विषयक अर्थछाया को ‘गवाही देते हैं’ में सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के कामों का पिता के नाम और अधिकार से संबंध
  choice: अपने पिता के नाम से
  alternative: अपने पिता के अधिकार से
  rationale: ‘नाम से’ मूल अभिव्यक्ति की व्यापकता को सुरक्षित रखता है और उसे केवल अधिकार तक सीमित करके व्याख्यायित नहीं करता।
- issue: यीशु के विषय में कामों की साक्षी
  choice: काम स्वयं यीशु के विषय में गवाही देते हैं
  alternative: काम केवल उनके दावे की पुष्टि करते हैं
  rationale: मूल के साक्ष्य-विधान को सीधे रखा गया है; गवाही के धर्मवैचारिक महत्व को न घटाया गया है, न उससे आगे कोई निष्कर्ष जोड़ा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम’ बहुवचन श्रोताओं के लिए प्रसंगानुकूल है। ‘काम’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘गवाही’ यूहन्ना के साक्ष्य-विषयक शब्द-तंत्र को बनाए रखती है।
