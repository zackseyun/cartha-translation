    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο
  choice: मनाया जा रहा था
  rationale: पर्व के संदर्भ में γίνομαι के घटनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘हुआ’ की अपेक्षा यह अधिक सहज है।
- source_word: τότε
  choice: उस समय
  rationale: काल-संबंधी संक्रमण को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὰ ἐγκαίνια
  choice: समर्पण का पर्व
  rationale: मन्दिर के पुनःसमर्पण से जुड़े उत्सव का अर्थ पाठक के लिए स्पष्ट करता है, जबकि प्रचलित नाम ‘हनुक्का’ को टिप्पणी में रखा गया है।
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: स्थानवाचक यूनानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: χειμὼν ἦν
  choice: सर्दी का मौसम था
  rationale: सरल वर्णनात्मक उपवाक्य को सामान्य आधुनिक हिन्दी में व्यक्त करता है; केवल ‘सर्दी थी’ की तुलना में ऋतु का भाव अधिक स्पष्ट है।
theological_decisions:
- issue: τὰ ἐγκαίνια की पहचान
  choice: मुख्य पाठ में ‘समर्पण का पर्व’
  alternative: ‘हनुक्का’ अथवा ‘पुनःसमर्पण का पर्व’
  rationale: मुख्य पाठ यूनानी पद का अर्थ प्रस्तुत करता है और बाद के प्रचलित नाम को टिप्पणी में सुरक्षित रखता है; इससे सांस्कृतिक पहचान स्पष्ट रहती है, पर उसे मूल शब्द का प्रत्यक्ष रूप मानकर आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनाया जा रहा था’ हिन्दी में पर्व के घटित होने का स्वाभाविक प्रयोग है। पद के अंत का अल्पविराम अगले पद से वाक्यगत निरंतरता दर्शाता है।
