  text: εἰ δὲ ποιῶ, κἂν ἐμοὶ μὴ πιστεύητε τοῖς ἔργοις ⸀πιστεύετε, ἵνα γνῶτε καὶ ⸀γινώσκητε ὅτι ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν ⸂τῷ πατρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/038.yaml
  text: But if I do them[a], even if you do not believe me, believe the works, so that you may know and continue to know that the Father is in me[c][b], and I am in the Father.
translation:
  language: hi
  text: पर यदि मैं ये काम करता हूँ, तो भले ही तुम मेरी बात पर विश्वास न करो,[a] इन कामों पर विश्वास करो, ताकि तुम जानो और जानते रहो[b] कि पिता मुझमें है और मैं पिता में हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मुझ पर विश्वास न करो।” यूनानी अभिव्यक्ति का अर्थ “मेरी बात पर विश्वास करना” या “मुझ पर विश्वास करना,” दोनों हो सकता है; यहाँ अगले वाक्यांश के साथ विरोध को देखते हुए “मेरी बात पर विश्वास” मुख्य पाठ में रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ ‘जानना’ क्रिया के दो अलग रूप हैं, जो संभवतः जान लेने और उस ज्ञान में बने रहने—दोनों पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιῶ
  choice: मैं उन्हें करता हूँ
  rationale: वर्तमानकालीन क्रिया का निहित कर्म निकटवर्ती प्रसंग के ‘काम’ हैं; हिन्दी में स्पष्टता के लिए ‘उन्हें’ जोड़ा गया है।
- source_word: κἂν ἐμοὶ μὴ πιστεύητε
  choice: भले ही तुम मेरी बात पर विश्वास न करो
  rationale: πιστεύω के साथ दत्तिव ἐμοί यहाँ यीशु की गवाही को सच मानने का भाव देता है। ‘मेरी बात पर विश्वास’ हिन्दी में स्वाभाविक है और अगले खंड में कामों पर विश्वास करने से स्पष्ट विरोध बनाए रखता है।
- source_word: τοῖς ἔργοις πιστεύετε
  choice: उन कामों पर विश्वास करो
  rationale: अर्थ यह है कि यीशु के कामों की साक्षी को स्वीकार किया जाए; ‘कामों में विश्वास’ कहना उन कामों को स्वयं विश्वास का धार्मिक विषय बना सकता है।
- source_word: ἔργοις
  choice: कामों
  rationale: यूहन्ना में ἔργα यीशु के प्रकाशनकारी कार्यों के लिए प्रयुक्त होता है। ‘काम’ सरल और स्वाभाविक है तथा ‘चिह्न’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἵνα γνῶτε καὶ γινώσκητε
  choice: ताकि तुम जानो और जानते रहो
  rationale: दोनों यूनानी क्रियारूपों के पहलूगत अंतर को रखते हुए यह अनुवाद ज्ञान प्राप्त करने और उसमें बने रहने की प्रगति व्यक्त करता है।
- source_word: ἐν ἐμοὶ ὁ πατὴρ κἀγὼ ἐν τῷ πατρί
  choice: पिता मुझमें है और मैं पिता में हूँ
  rationale: दोहराए गए ἐν को सीधे ‘में’ से व्यक्त करने पर परस्पर अंतर्निवास का कथन और उसकी धर्मवैज्ञानिक गहनता बिना व्याख्यात्मक विस्तार के सुरक्षित रहती है।
- source_word: πατήρ
  choice: पिता
  rationale: यूनानी पाठ में ‘पिता’ निश्चित रूप में है, ‘मेरा पिता’ नहीं; हिन्दी में यह संदर्भ से निश्चित और स्वाभाविक है।
theological_decisions:
- issue: पिता और पुत्र का परस्पर अंतर्निवास
  choice: पिता मुझमें है और मैं पिता में हूँ
  alternative: पिता मेरे साथ एक है और मैं पिता के साथ एक हूँ
  rationale: सीधा स्थानवाची रूप यूहन्ना के मूल संबंधपरक कथन और उसके धर्मवैज्ञानिक तनाव को सुरक्षित रखता है; ‘एक’ या ‘एकता’ जोड़ना बाद की व्याख्या को पाठ में मिला देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेरी बात पर विश्वास’ और ‘कामों पर विश्वास’ से यूनानी दत्तिवों का अर्थ स्वाभाविक हिन्दी में अलग किया गया है। ‘जानो और जानते रहो’ कुछ असामान्य होते हुए भी मूल के दो क्रियारूपों का सार्थक अंतर सुरक्षित रखता है।
