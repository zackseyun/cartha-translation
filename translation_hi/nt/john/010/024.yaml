  text: ἐκύκλωσαν οὖν αὐτὸν οἱ Ἰουδαῖοι καὶ ἔλεγον αὐτῷ· Ἕως πότε τὴν ψυχὴν ἡμῶν αἴρεις; εἰ σὺ εἶ ὁ χριστός, εἰπὲ ἡμῖν παρρησίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/010/024.yaml
  text: So the Jews surrounded him and were saying to him[a], “How long will you keep us in suspense? If you are the Messiah[b], tell us plainly.”
translation:
  language: hi
  text: तब यहूदियों[b] ने उसे घेर लिया और उससे कह रहे थे, “तुम कब तक हमें असमंजस में रखोगे?[a] यदि तुम मसीहा हो, तो हमें साफ़-साफ़ बता दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम कब तक हमारे प्राण को उठाते हो?” यह एक मुहावरा है, जिसका अर्थ किसी को अनिश्चितता या असमंजस में रखना है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के सुसमाचार में “यहूदी” शब्द संदर्भ के अनुसार कभी-कभी विशेष रूप से यहूदी अधिकारियों या यीशु के विरोधियों के लिए प्रयुक्त होता है, न कि पूरे यहूदी समुदाय के लिए।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκύκλωσαν
  choice: घेर लिया
  rationale: क्रिया का मूल अर्थ चारों ओर से घेरना है; यह प्रसंग की शारीरिक और कुछ हद तक टकरावपूर्ण मुद्रा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक अथवा तार्किक संबंध दिखाता है; ‘इसलिए’ उस संबंध को स्पष्ट रखता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यूनानी में अभिव्यक्ति शाब्दिक रूप से ‘यहूदी’ है। पद स्वयं इसे केवल अगुओं तक सीमित नहीं करता, इसलिए मुख्य पाठ में व्यापक शब्द रखा गया है और संदर्भगत संकीर्ण अर्थ को पादटिप्पणी में बताया गया है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल जारी कथन को सूचित करता है; ‘कहने लगे’ हिन्दी कथा में स्वाभाविक है और उस पहलू को पर्याप्त रूप से व्यक्त करता है।
- source_word: τὴν ψυχὴν ἡμῶν αἴρεις
  choice: हमें असमंजस में रखोगे
  rationale: शाब्दिक चित्र ‘हमारे प्राण को उठाए रखना’ है, पर यहाँ मुहावरे का अर्थ अनिश्चितता या असमंजस में रखना है। अर्थ मुख्य पाठ में और मूल चित्र पादटिप्पणी में सुरक्षित है।
- source_word: ὁ χριστός
  choice: मसीहा
  rationale: यहाँ शब्द यहूदी अभिषिक्त उद्धारकर्ता-राजा की उपाधि के रूप में आया है, इसलिए ‘मसीहा’ उपयुक्त है।
- source_word: παρρησίᾳ
  choice: साफ़-साफ़
  rationale: संदर्भ में माँग स्पष्ट, खुली और बिना दुविधा वाली घोषणा की है; ‘साफ़-साफ़’ आधुनिक सामान्य हिन्दी में यही भाव देता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीहा
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस प्रश्न में Χριστός नाम-सदृश प्रयोग नहीं, बल्कि अपेक्षित अभिषिक्त राजा और उद्धारकर्ता की उपाधि है।
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: यहूदी
  alternative: यहूदी अगुए / यहूदिया के लोग
  rationale: इस पद का यूनानी पाठ स्वयं किसी अधिक संकीर्ण समूह को स्पष्ट नहीं करता। अतः मुख्य पाठ अस्पष्टता को बनाए रखता है, जबकि पादटिप्पणी बताती है कि यूहन्ना में संदर्भ कभी-कभी विशेष विरोधियों या अधिकारियों की ओर संकेत करता है।
