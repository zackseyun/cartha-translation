  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘असमंजस में रखना’ मुहावरे का अर्थ स्पष्ट करता है; ‘साफ़-साफ़ बता दो’ प्रत्यक्ष और आग्रहपूर्ण वाणी को स्वाभाविक रूप देता है।
