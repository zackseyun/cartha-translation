  text: Ἐγώ εἰμι ὁ ποιμὴν ὁ καλός· ὁ ποιμὴν ὁ καλὸς τὴν ψυχὴν αὐτοῦ τίθησιν ὑπὲρ τῶν προβάτων·
base_translation:
  language: en
  yaml_path: translation/nt/john/010/011.yaml
  text: I am the good shepherd[c][b][a]. The good shepherd lays down his life for the sheep.
translation:
  language: hi
  text: “मैं अच्छा चरवाहा हूँ।[a] अच्छा चरवाहा भेड़ों के लिए अपना जीवन दे देता है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अच्छा’ का अनुवाद ‘उत्तम’, ‘श्रेष्ठ’ या ‘आदर्श’ भी किया जा सकता है; यूनानी शब्द भलाई के साथ उत्कृष्ट और अनुकरणीय होने का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में शाब्दिक रूप से, ‘अपना प्राण रख देता है’; यह मुहावरा अपना जीवन दे देने के अर्थ में है। ‘भेड़ों के लिए’ का अर्थ ‘भेड़ों के हित में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: मैं हूँ
  rationale: स्पष्ट सर्वनाम के बल को स्वाभाविक हिन्दी शब्दक्रम ‘अच्छा चरवाहा मैं हूँ’ से व्यक्त किया गया है; इससे अनावश्यक धर्मवैज्ञानिक विस्तार किए बिना आत्म-पहचान पर जोर बना रहता है।
- source_word: ποιμήν
  choice: चरवाहा
  rationale: यह भेड़ों की देखभाल करने वाले व्यक्ति का सीधा और सामान्य हिन्दी शब्द है; ‘पास्टर’ कहने से बाद की कलीसियाई पदवी का अर्थ जुड़ जाता।
- source_word: καλός
  choice: अच्छा
  rationale: ‘अच्छा’ नैतिक उत्कृष्टता, भलापन और आदर्श योग्यता के व्यापक अर्थ को स्वाभाविक हिन्दी में रखता है; ‘उत्तम’ भी संभव है पर कुछ अधिक औपचारिक और व्याख्यात्मक है।
- source_word: τὴν ψυχὴν αὐτοῦ τίθησιν
  choice: अपना जीवन दे देता है
  rationale: शाब्दिक रूप से ‘अपना प्राण रख देता है’ कहने वाला यूनानी मुहावरा यहाँ स्वेच्छा से जीवन अर्पित करने का अर्थ देता है। हिन्दी में ‘अपना जीवन दे देता है’ उसी अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπὲρ τῶν προβάτων
  choice: भेड़ों के लिए
  rationale: यह लाभार्थक और प्रतिनिधिक दोनों संभावित भावों को खुला रखता है तथा किसी विशिष्ट प्रायश्चित-सिद्धान्त को वाक्य में नहीं जोड़ता।
- source_word: προβάτων
  choice: भेड़ों
  rationale: मूल पाठ में निश्चित पद है, पर कोई स्वत्वसूचक सर्वनाम नहीं; हिन्दी में ‘भेड़ों के लिए’ स्वाभाविक है और ‘अपनी भेड़ों’ जैसी अतिरिक्त बात नहीं जोड़ता।
theological_decisions:
- issue: Ἐγώ εἰμι में यीशु की आत्म-पहचान का बल
  choice: ‘अच्छा चरवाहा मैं हूँ’
  alternative: ‘मैं ही अच्छा चरवाहा हूँ’ या दिव्य नाम की ओर स्पष्ट संकेत करने वाली विस्तृत अभिव्यक्ति
  rationale: हिन्दी का विधेय-प्रथम शब्दक्रम स्पष्ट Ἐγώ पर जोर देता है, जबकि ‘ही’ संभावित रूप से अपवर्जक अर्थ बढ़ा सकता है। पद में व्यापक यूहन्नाई प्रतिध्वनियाँ संभव हैं, पर अनुवाद उन्हें सिद्ध मानकर नहीं जोड़ता।
- issue: καλός का आशय
  choice: ‘अच्छा चरवाहा’
  alternative: ‘उत्तम चरवाहा’, ‘आदर्श चरवाहा’ या ‘श्रेष्ठ चरवाहा’
  rationale: ‘अच्छा’ मूल शब्द की नैतिक, उत्कृष्ट और आदर्शगत अर्थ-सीमा को बिना अति-व्याख्या के सुरक्षित रखता है। वैकल्पिक अर्थ पादटिप्पणी में बताया गया है।
- issue: ὑπὲρ τῶν προβάτων और यीशु की मृत्यु का संबंध
  choice: ‘भेड़ों के लिए’
  alternative: ‘भेड़ों की ओर से’ या ‘भेड़ों के हित में’
  rationale: ‘के लिए’ प्रतिनिधिक, लाभार्थक और बलिदानी भाव की गुंजाइश बनाए रखता है, पर किसी एक विशिष्ट प्रायश्चित-व्याख्या तक अर्थ को सीमित नहीं करता।
- issue: τίθησιν का वर्तमानकालीन रूप
  choice: ‘दे देता है’
  alternative: ‘देगा’ या ‘दे रहा है’
  rationale: वर्तमान काल चरवाहे के चरित्रगत कार्य को व्यक्त करता है और आगामी आत्म-बलिदान की ओर भी संकेत कर सकता है। हिन्दी का सामान्य वर्तमान ‘दे देता है’ इस पक्ष को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज पाठ। परिचित ‘अच्छा चरवाहा’ रखा गया है। स्पष्ट यूनानी सर्वनाम के जोर को ‘मैं ही’ जोड़ने के बजाय स्वाभाविक हिन्दी शब्दक्रम से व्यक्त किया गया है।
