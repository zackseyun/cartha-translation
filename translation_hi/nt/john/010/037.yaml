  yaml_path: translation/nt/john/010/037.yaml
  text: If I am not doing the works of my Father[a], do not believe me;
translation:
  language: hi
  text: यदि मैं मेरे पिता के कार्य नहीं करता, तो मुझ पर विश्वास[a] न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी बात पर विश्वास न करो।”
    reason: πιστεύω के साथ μοι का अर्थ किसी व्यक्ति की बात को सच मानना भी हो सकता है; मुख्य पाठ व्यक्तिगत विश्वास का सीधा अर्थ रखता है।
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह शर्तवाचक उपवाक्य आरम्भ करता है; ‘यदि’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: οὐ ποιῶ
  choice: मैं ... नहीं करता
  rationale: वर्तमानकालीन क्रिया के निषेध को हिन्दी में सामान्य वर्तमान से व्यक्त किया गया है; यह यीशु के कार्यों की चलती हुई वास्तविकता को संदर्भ में समेट सकता है, जबकि ‘नहीं कर रहा हूँ’ अनावश्यक रूप से क्षणिक अर्थ दे सकता है।
- source_word: τὰ ἔργα
  choice: काम
  rationale: ἔργα के व्यापक अर्थ—काम, कार्य या कर्म—को सहज हिन्दी ‘काम’ से व्यक्त किया गया है; यूहन्ना में यह यीशु के उन कार्यों की ओर संकेत करता है जो उनके दावे की गवाही देते हैं।
- source_word: τοῦ πατρός μου
  choice: अपने पिता के
  rationale: कर्ता के साथ संबंध स्पष्ट करने के लिए हिन्दी में ‘मेरे’ की अपेक्षा ‘अपने’ अधिक स्वाभाविक है; ‘पिता’ परमेश्वर के लिए संबंधसूचक पद है।
- source_word: μὴ πιστεύετέ
  choice: विश्वास न करो
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध को हिन्दी के स्वाभाविक निषेधात्मक आदेश से व्यक्त किया गया है।
- source_word: μοι
  choice: मुझ पर
  rationale: πιστεύω के साथ संप्रदान कारक सर्वनाम व्यक्ति की ओर निर्देशित विश्वास को व्यक्त कर सकता है। हिन्दी में ‘मुझ पर विश्वास’ स्वाभाविक है; ‘मेरी बात पर विश्वास’ वाला साक्ष्यात्मक अर्थ संभव है और पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: πιστεύω के साथ μοι का आशय
  choice: मुझ पर विश्वास न करो
  alternative: मेरी बात पर विश्वास न करो
  rationale: यूनानी रचना किसी व्यक्ति पर विश्वास करने और उसकी बात को सच मानने—दोनों की गुंजाइश रखती है। मुख्य पाठ व्यक्तिगत दिशा को बनाए रखता है, जबकि वैकल्पिक साक्ष्यात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
