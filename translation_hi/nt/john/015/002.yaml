source:
  edition: SBLGNT
  text: πᾶν κλῆμα ἐν ἐμοὶ μὴ φέρον καρπὸν αἴρει αὐτό, καὶ πᾶν τὸ καρπὸν φέρον καθαίρει αὐτὸ ἵνα ⸂καρπὸν πλείονα⸃ φέρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/002.yaml
  text: Every branch in me that does not bear fruit[a], he removes; and every branch that bears fruit[b], he prunes so that it may bear more fruit.
translation:
  language: hi
  text: मुझ में जो हर डाली फल नहीं लाती, उसे वह हटा देता है[a]; और जो हर डाली फल लाती है, उसकी वह छँटाई करता है[b], ताकि वह और अधिक फल लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसे ले जाता है’; कुछ लोग αἴρει का अर्थ यहाँ ‘उसे ऊपर उठा देता है’ समझते हैं।
    reason: alternative_reading
  - marker: b
    text: जिस क्रिया का अनुवाद ‘छँटाई करता है’ किया गया है, उसका अर्थ ‘साफ़ करता है’ या ‘शुद्ध करता है’ भी हो सकता है। यह शब्दावली अंगूर की बेल के बिंब के अनुकूल है और अगले पद में ‘शुद्ध’ होने की भाषा की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κλῆμα
  choice: हर वह डाली
  rationale: एकवचन के साथ πᾶν का वितरणात्मक अर्थ है। ‘हर वह डाली’ स्वाभाविक हिन्दी में प्रत्येक डाली पर अलग-अलग ध्यान बनाए रखता है।
- source_word: ἐν ἐμοὶ
  choice: मुझमें लगी
  rationale: ‘मुझमें’ यूहन्ना के संबंध और एकता के कथन को सुरक्षित रखता है; ‘लगी’ बेल की डाली के बिंब को हिन्दी में स्वाभाविक बनाता है, बिना ‘बनी रहती’ जैसा अतिरिक्त अर्थ जोड़ने के।
- source_word: μὴ φέρον καρπὸν
  choice: जो फल नहीं लाती
  rationale: कृदन्त पदबंध को स्पष्ट और सहज हिन्दी संबंधवाचक उपवाक्य में रखा गया है तथा फल उत्पन्न करने की क्रिया बनी रहती है।
- source_word: αἴρει
  choice: हटा देता है
  rationale: αἴρω यहाँ ‘ले जाना/हटा देना’ अर्थ दे सकता है और फलविहीन तथा फलवाली डालियों के साथ किए जाने वाले भिन्न व्यवहार का विरोध स्पष्ट करता है। ‘ऊपर उठा देता है’ को पाठ-टिप्पणी में सुरक्षित रखा गया है।
- source_word: καρπός
  choice: फल
  rationale: बेल के कृषि-बिंब और यूहन्ना के रूपक, दोनों के लिए यह मानक और स्वाभाविक हिन्दी शब्द है।
- source_word: καθαίρει
  choice: छँटाई करता है
  rationale: बेल की देखभाल के प्रसंग में यह बागवानी की अपेक्षित क्रिया को स्पष्ट करता है। क्रिया में निहित ‘शुद्ध/साफ करना’ अर्थ और अगले पद के καθαροί से उसका संबंध पाठ-टिप्पणी में दिया गया है।
- source_word: ἵνα καρπὸν πλείονα φέρῃ
  choice: ताकि वह और अधिक फल लाए
  rationale: ἵνα के प्रयोजनार्थक भाव और πλείονα के तुलनात्मक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτό / αὐτὸ
  choice: उसे / उसकी
  rationale: सर्वनाम का संबंध ‘डाली’ से है। हिन्दी में विभक्ति और स्वाभाविक वाक्य-रचना के अनुसार ‘उसे’ तथा ‘उसकी’ प्रयुक्त हुए हैं।
- source_word: καὶ πᾶν τὸ καρπὸν φέρον
  choice: और हर वह डाली जो फल लाती है
  rationale: यूनानी लेख और कृदन्त पहले आए κλῆμα की ओर संकेत करते हैं; हिन्दी में स्पष्टता और समानांतर रचना के लिए ‘डाली’ दोहराई गई है।
theological_decisions:
- issue: पहले उपवाक्य में αἴρει का अर्थ
  choice: वह उसे हटा देता है
  alternative: वह उसे ले जाता है / ऊपर उठा देता है
  rationale: तात्कालिक बिंब में फलविहीन डालियों को हटाने और फलवाली डालियों की छँटाई करने का विरोध सबसे स्वाभाविक है। फिर भी ‘ऊपर उठाना’ एक संभव शाब्दिक व्याख्या है, इसलिए किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को मुख्य पाठ में थोपे बिना उसे पाठ-टिप्पणी में रखा गया है।
- issue: καθαίρει में छँटाई और शुद्ध करने का शब्द-संबंध
  choice: वह उसकी छँटाई करता है
  alternative: वह उसे साफ़/शुद्ध करता है
  rationale: दाखबारी के रूपक में ‘छँटाई’ क्रिया को सबसे स्पष्ट ढंग से व्यक्त करती है, जबकि अगले पद में ‘शुद्ध’ होने की भाषा से जुड़ा वास्तविक शब्द-संबंध पाठ-टिप्पणी द्वारा सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘डाली’, ‘फल लाती है’ और ‘छँटाई करता है’ सामान्य पाठक के लिए बेल के रूपक को स्पष्ट रखते हैं। मुख्य पाठ में वास्तविक अर्थगत तनाव को निर्णायक धर्मवैज्ञानिक विस्तार से नहीं भरा गया; वैकल्पिक अर्थ टिप्पणियों में सुरक्षित हैं।
