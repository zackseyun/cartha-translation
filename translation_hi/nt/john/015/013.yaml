source:
  edition: SBLGNT
  text: μείζονα ταύτης ἀγάπην οὐδεὶς ἔχει, ἵνα τις τὴν ψυχὴν αὐτοῦ θῇ ὑπὲρ τῶν φίλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/013.yaml
  text: 'No one has greater love than this: that someone lay down his life for his friends[a][b][c][d].'
translation:
  language: hi
  text: इससे बड़ा प्रेम किसी का नहीं कि कोई अपने मित्रों के लिए अपना जीवन दे दे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जीवन’ के लिए यूनानी शब्द psychē है, जिसका अर्थ ‘प्राण’, ‘आत्मा’ या ‘स्वयं’ भी हो सकता है; यहाँ आशय मृत्यु तक अपना जीवन दे देने से है।
    reason: lexical_alternative
  - marker: b
    text: ‘के लिए’ का अनुवाद ‘की ओर से’ या ‘की खातिर’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα ταύτης ἀγάπην
  choice: इससे बड़ा प्रेम
  rationale: तुलनात्मक μείζονα और तुलना-सूचक ταύτης को स्वाभाविक हिन्दी में ‘इससे बड़ा’ कहा गया है; ‘इस’ आगे आने वाले कथन की ओर संकेत करता है।
- source_word: οὐδεὶς ἔχει
  choice: किसी का नहीं
  rationale: शाब्दिक अर्थ ‘कोई नहीं रखता’ है, पर प्रेम के संबंध में ‘किसी का नहीं’ सहज और अर्थनिष्ठ हिन्दी है।
- source_word: ἵνα τις
  choice: कि कोई
  rationale: ἵνα यहाँ मुख्यतः उस प्रेम की पहचान या विषयवस्तु बताता है; τις अनिश्चित और सामान्य कर्ता है, इसलिए ‘कि कोई’ उपयुक्त है।
- source_word: τὴν ψυχὴν αὐτοῦ θῇ
  choice: अपना जीवन दे दे
  rationale: ψυχή यहाँ मृत्यु तक समर्पित जीवन को दर्शाता है। τίθημι का शाब्दिक अर्थ ‘रखना’ है, किंतु हिन्दी में ‘जीवन दे देना’ आत्मबलिदान का स्वाभाविक मुहावरा है।
- source_word: ὑπὲρ τῶν φίλων αὐτοῦ
  choice: अपने मित्रों के लिए
  rationale: ὑπέρ का लाभार्थक या प्रतिनिधिक भाव ‘के लिए’ से सुरक्षित रहता है; αὐτοῦ का संबंध सामान्य कर्ता से ‘अपने’ द्वारा स्पष्ट होता है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: ‘जीवन’
  alternative: ‘प्राण’ या ‘आत्मा’
  rationale: संदर्भ वास्तविक आत्मसमर्पण और मृत्यु तक जीवन देने का है; ‘आत्मा’ शरीर-आत्मा संबंधी ऐसा भेद ला सकता है जिस पर पद बल नहीं देता।
- issue: ὑπέρ का भाव
  choice: ‘के लिए’
  alternative: ‘की ओर से’ या ‘के स्थान पर’
  rationale: ‘के लिए’ लाभार्थक और संभावित प्रतिनिधिक अर्थ को खुला रखता है; ‘के स्थान पर’ इस पद में अपेक्षा से अधिक स्पष्ट प्रतिस्थापनात्मक अर्थ निर्धारित कर देगा।
- issue: सामान्य कर्ता τις और αὐτοῦ
  choice: ‘कोई ... अपना ... अपने’
  alternative: लिंग-चिह्नित ‘कोई मनुष्य ... उसका ... उसके’
  rationale: यह रचना यूनानी के अनिश्चित एकवचन कर्ता को बिना पुरुष-लिंग तक सीमित किए स्वाभाविक हिन्दी में व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘जीवन दे दे’ हिन्दी की स्वाभाविक अभिव्यक्ति है और यूहन्ना के आत्मबलिदानी संदर्भ को स्पष्ट रखती है।
