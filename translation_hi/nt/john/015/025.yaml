  text: ἀλλ’ ἵνα πληρωθῇ ὁ λόγος ὁ ⸂ἐν τῷ νόμῳ αὐτῶν γεγραμμένος⸃ ὅτι Ἐμίσησάν με δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/025.yaml
  text: 'But this happened so that the word written in their Law might be fulfilled: ‘They hated me without cause.’[a][b][c]'
translation:
  language: hi
  text: 'पर यह इसलिए हुआ ताकि उनकी व्यवस्था में लिखा हुआ वचन पूरा हो: “उन्होंने मुझसे अकारण घृणा की।”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “पर ताकि उनकी व्यवस्था में लिखा हुआ वचन पूरा हो।” यूनानी में मुख्य उपवाक्य अध्याहृत है; प्रसंग के आधार पर हिन्दी में “यह हुआ” जोड़ा गया है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उनकी व्यवस्था” व्यापक अर्थ में यहूदी धर्मग्रन्थों के लिए प्रयुक्त है; उद्धरण भजन संहिता से है (देखें भजन 35:19; 69:4)।
    reason: cross_reference
  - marker: c
    text: या “बिना किसी कारण के” अथवा “बेवजह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: पर यह इसलिए हुआ
  rationale: ἀλλά विरोध या पिछले कथन से मोड़ दिखाता है। यूनानी वाक्य में मुख्य उपवाक्य अध्याहृत है; सहज आधुनिक हिन्दी के लिए प्रसंग से ‘यह हुआ’ जोड़ा गया है।
- source_word: ἵνα πληρωθῇ
  choice: कि ... पूरा हो
  rationale: ἵνα के साथ aorist passive subjunctive उद्देश्य अथवा परिणाम व्यक्त कर सकता है। ‘पूरा हो’ यूहन्ना के शास्त्र-पूर्ति भाव को रखते हुए इस संभावित अर्थ-तनाव को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὁ λόγος
  choice: वचन
  rationale: यहाँ λόγος किसी विशिष्ट शास्त्रीय कथन को सूचित करता है, न कि यूहन्ना 1 का व्यक्तिवाचक ‘वचन’। हिन्दी में ‘वचन’ उद्धरण-सूत्र के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐν τῷ νόμῳ αὐτῶν γεγραμμένος
  choice: उनकी व्यवस्था में लिखा हुआ
  rationale: Perfect passive participle उस बात को दर्शाता है जो लिखी हुई है और अब भी शास्त्र में विद्यमान है। ‘उनकी’ मूल सर्वनाम और यीशु की आलंकारिक दूरी को सुरक्षित रखता है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: νόμος का सीधा पारंपरिक हिन्दी समतुल्य ‘व्यवस्था’ है। यहाँ यह व्यापक अर्थ में यहूदी धर्मग्रन्थों को समेटता है, क्योंकि उद्धरण भजन से है; मुख्य पाठ मूल शब्दावली को बनाए रखता है और पादटिप्पणी व्यापक अर्थ स्पष्ट करती है।
- source_word: ὅτι
  choice: ':'
  rationale: ὅτι लिखे हुए वचन की विषयवस्तु प्रस्तुत करता है। हिन्दी में उद्धरण से पहले विसर्ग-चिह्न इसकी भूमिका स्वाभाविक रूप से निभाता है।
- source_word: Ἐμίσησάν με
  choice: उन्होंने मुझसे ... घृणा की
  rationale: Aorist indicative को उद्धरण में सामान्य भूतकाल से व्यक्त किया गया है। ‘घृणा की’ μισέω का सीधा और प्रचलित अर्थ है।
- source_word: δωρεάν
  choice: अकारण
  rationale: यहाँ δωρεάν का अर्थ ‘बिना कारण’ या ‘बेवजह’ है। ‘अकारण’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है तथा घृणा के अनुचित और अनर्जित होने का भाव रखता है।
theological_decisions:
- issue: भजन के उद्धरण के लिए ‘उनकी व्यवस्था’ का प्रयोग
  choice: νόμος का अनुवाद ‘व्यवस्था’ किया गया और पादटिप्पणी में बताया गया कि यहाँ इसका अर्थ व्यापक यहूदी धर्मग्रन्थ है।
  alternative: मुख्य पाठ में ‘उनके धर्मशास्त्र’ या ‘उनके पवित्रशास्त्र’ कहना।
  rationale: मूल यूनानी स्पष्ट रूप से νόμος कहता है, यद्यपि उद्धरण भजन से आता है। ‘व्यवस्था’ मूल रूप को और पादटिप्पणी यूहन्ना में इसके व्यापक प्रयोग को सुरक्षित रखती है।
- issue: ἀλλ’ के बाद अध्याहृत मुख्य उपवाक्य
  choice: सहज हिन्दी के लिए ‘यह ... हुआ’ जोड़ा गया।
  alternative: यूनानी की दीर्घवृत्तता रखते हुए ‘पर इसलिए कि ...’ कहना।
  rationale: यूनानी वाक्य पिछले प्रसंग पर निर्भर है। हिन्दी में अध्याहृत बात जोड़ने से अर्थ स्पष्ट होता है, पर कोई नया कारण या धर्मवैज्ञानिक दावा नहीं जोड़ा जाता।
- issue: ἵνα में उद्देश्य और परिणाम का संबंध
  choice: ‘कि ... पूरा हो’ रखा गया, जो उद्देश्य और परिणाम दोनों के लिए खुला रह सकता है।
  alternative: ‘जिससे ... पूरा हुआ’ कहकर केवल परिणाम, या ‘ताकि ... अवश्य पूरा हो’ कहकर अधिक प्रबल उद्देश्य व्यक्त करना।
  rationale: मूल रचना उद्देश्य और परिणाम की परस्परता को सह सकती है। चुना हुआ हिन्दी रूप इस तनाव को किसी एक दिशा में अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘व्यवस्था’, ‘वचन’ और ‘पूरा हो’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं, पर वाक्य-विन्यास को वर्तमान हिन्दी के अनुरूप बनाया गया है।
