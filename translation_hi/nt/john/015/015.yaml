  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκέτι ⸂λέγω ὑμᾶς⸃ δούλους, ὅτι ὁ δοῦλος οὐκ οἶδεν τί ποιεῖ αὐτοῦ ὁ κύριος· ὑμᾶς δὲ εἴρηκα φίλους, ὅτι πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου ἐγνώρισα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/015.yaml
  text: I no longer call you servants[a], because the servant does not know what his master is doing. But I have called you friends[b], because I have made known to you everything that I heard from my Father.
translation:
  language: hi
  text: अब मैं तुम्हें दास[a] नहीं कहता, क्योंकि दास नहीं जानता कि उसका मालिक[b] क्या कर रहा है। पर मैंने तुम्हें मित्र कहा है, क्योंकि जो कुछ मैंने अपने पिता से सुना, वह सब मैंने तुम्हें बता दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘दास’ या ‘सेवक’ हो सकता है। यहाँ ‘मित्र’ के साथ विरोध अधीन स्थिति पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसका प्रभु’; यहाँ दास-मालिक संबंध के कारण ‘मालिक’ अनूदित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι λέγω ὑμᾶς
  choice: अब मैं तुम्हें ... नहीं कहता
  rationale: यह वर्तमान काल में बदली हुई स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है और λέγω के यहाँ ‘कहना/नाम देना’ वाले भाव को बनाए रखता है।
- source_word: δούλους / ὁ δοῦλος
  choice: दास / दास
  rationale: मित्रों के साथ किया गया विरोध अधीन सामाजिक स्थिति पर बल देता है। ‘दास’ हिन्दी में सेवक और स्वामी की तुलना में अधिक स्पष्ट रूप से बँधी हुई अधीनता व्यक्त करता है।
- source_word: οἶδεν τί ποιεῖ
  choice: नहीं जानता कि ... क्या कर रहा है
  rationale: οἶδα के ज्ञान-संबंधी अर्थ और ποιεῖ के वर्तमान, चल रहे कार्य—दोनों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτοῦ ὁ κύριος
  choice: उसका मालिक
  rationale: यहाँ κύριος कोई ईश्वरीय उपाधि नहीं, बल्कि दास-मालिक संबंध में उच्च पक्ष को दर्शाता है; इसलिए ‘मालिक’ प्रसंगानुकूल है।
- source_word: ὑμᾶς δὲ εἴρηκα φίλους
  choice: बल्कि मैंने तुम्हें मित्र कहा है
  rationale: ‘बल्कि’ दास और मित्र के बीच विरोध स्पष्ट करता है। ‘कहा है’ यूनानी पूर्णकाल से उत्पन्न वर्तमान स्थिति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πάντα ἃ ἤκουσα παρὰ τοῦ πατρός μου
  choice: जो कुछ मैंने अपने पिता से सुना, वह सब
  rationale: यह παρά के स्रोत-सूचक अर्थ और πάντα ἃ की व्यापकता को बिना अर्थ बढ़ाए व्यक्त करता है।
- source_word: ἐγνώρισα ὑμῖν
  choice: मैंने तुम्हें बता दिया है
  rationale: γνωρίζω के ‘ज्ञात कराना’ या ‘बताना’ अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘दिया है’ सूचना दिए जाने की पूर्णता और वर्तमान प्रासंगिकता को सहज रूप से दर्शाता है।
theological_decisions:
- issue: शिष्यत्व के संदर्भ में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: वचन में केवल सेवा का कार्य नहीं, बल्कि मालिक के अधीन रहने वाले व्यक्ति और मित्र के बीच स्थिति तथा जानकारी का अंतर प्रमुख है। ‘दास’ इस तनाव को अधिक स्पष्ट रखता है।
- issue: दास-मालिक उपमा में κύριος का अनुवाद
  choice: मालिक
  alternative: प्रभु
  rationale: यहाँ शब्द मसीही उपाधि के रूप में प्रयुक्त नहीं हुआ है। ‘मालिक’ घरेलू और सामाजिक उपमा को स्पष्ट करता है तथा अनावश्यक ईश्वरीय अर्थ नहीं जोड़ता।
- issue: εἴρηκα और ἐγνώρισα के काल-पक्ष को हिन्दी में व्यक्त करना
  choice: मैंने ... कहा है; मैंने ... बता दिया है
  alternative: मैंने ... कहा; मैंने ... बताया
  rationale: पहली क्रिया के यूनानी पूर्णकाल का स्थायी परिणाम ‘कहा है’ से प्रकट होता है। दूसरी क्रिया यूनानी में अतीत की पूर्ण घटना है; हिन्दी का ‘बता दिया है’ उस पूर्ण प्रकटीकरण और प्रसंग में उसकी बनी हुई प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है, बिना दोनों यूनानी क्रियाओं को एक ही काल मानने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हें’ यूहन्ना के संबोधन की निकटता और बहुवचन को प्रसंगानुसार व्यक्त करता है। ‘पिता’ को धार्मिक-संबंधपरक अर्थ के कारण यथावत रखा गया है।
