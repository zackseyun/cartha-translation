id: JHN.15.23
reference: John 15:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἐμὲ μισῶν καὶ τὸν πατέρα μου μισεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/023.yaml
  text: The one who hates me also hates my Father.
translation:
  language: hi
  text: जो मुझसे घृणा करता है, वह मेरे पिता से भी घृणा करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ... μισῶν
  choice: जो ... घृणा करता है
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित लेख और वर्तमान कृदंत किसी ऐसे व्यक्ति को सूचित करते हैं जिसकी पहचान इस क्रिया से होती है। हिंदी में ‘जो ... करता है’ सामान्य और स्वाभाविक है तथा यूनानी के व्यापक एकवचन भाव को बनाए रखता है।
- source_word: ἐμὲ
  choice: मुझसे
  rationale: μισέω के कर्म को आधुनिक मानक हिंदी में स्वाभाविक रूप से ‘से’ परसर्ग के साथ व्यक्त किया जाता है। अलग बलयुक्त सर्वनाम-रूप के बावजूद संदर्भ में अतिरिक्त ‘मुझ ही से’ कहना अनावश्यक रूप से जोर बढ़ाता।
- source_word: μισῶν / μισεῖ
  choice: घृणा करता है
  rationale: μισέω का अर्थ ‘घृणा करना’ है। दोनों यूनानी रूपों के लिए एक ही हिंदी पदावली रखकर मूल की शब्दगत पुनरावृत्ति और सामान्य वर्तमान का भाव सुरक्षित रखा गया है।
- source_word: καὶ
  choice: भी
  rationale: 'यहाँ καί दूसरी बात को पहली के साथ जोड़ते हुए ‘भी’ का भाव देता है: यीशु से घृणा करने वाला पिता से भी घृणा करता है।'
- source_word: τὸν πατέρα μου
  choice: मेरे पिता
  rationale: πατέρα के साथ μου का स्वाभाविक हिंदी रूप ‘मेरे पिता’ है। देवनागरी में बड़े और छोटे अक्षरों का भेद न होने से ईश्वर के लिए प्रयुक्त संबंधपरक उपाधि संदर्भ से पहचानी जाती है।
theological_decisions:
- issue: ‘पिता’ का संदर्भ परमेश्वर से है
  choice: मेरे पिता
  alternative: मेरे पिताजी
  rationale: ‘मेरे पिता’ गरिमापूर्ण और सटीक है तथा यूहन्ना में यीशु और परमेश्वर के विशिष्ट संबंध को व्यक्त करता है। ‘पिताजी’ अनावश्यक रूप से घरेलू-संबोधन का रंग देता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल के समानांतर वाक्य-विन्यास और ‘घृणा’ की पुनरावृत्ति सुरक्षित रखी गई है।
