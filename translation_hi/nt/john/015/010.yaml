source:
  edition: SBLGNT
  text: ἐὰν τὰς ἐντολάς μου τηρήσητε, μενεῖτε ἐν τῇ ἀγάπῃ μου, καθὼς ἐγὼ ⸂τὰς ἐντολὰς τοῦ πατρός μου⸃ τετήρηκα καὶ μένω αὐτοῦ ἐν τῇ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/010.yaml
  text: If you keep my commandments, you will remain in my love, just as I have kept my Father's commandments and remain in his love.
translation:
  language: hi
  text: यदि तुम मेरी आज्ञाओं का पालन करोगे, तो मेरे प्रेम में बने रहोगे, ठीक वैसे ही जैसे मैंने अपने पिता की आज्ञाओं का पालन किया है और उनके प्रेम में बना रहता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐὰν
  choice: यदि
  rationale: यह सम्भावना-सूचक शर्त को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और बार-बार होने का अतिरिक्त भाव नहीं जोड़ता।
- source_word: ἐντολάς
  choice: आज्ञाओं
  rationale: यह अधिकारपूर्ण आदेशों के भाव को बनाए रखता है और यूहन्ना के प्रसंग में स्वाभाविक धार्मिक शब्दावली है।
- source_word: τηρήσητε / τετήρηκα
  choice: पालन करोगे / पालन किया है
  rationale: ‘पालन करना’ आज्ञाओं को मानते हुए निष्ठापूर्वक आचरण करने का भाव देता है; दोनों यूनानी रूपों के लिए एक ही हिन्दी पद रखकर मूल की शब्दगत कड़ी भी सुरक्षित रहती है। पूर्णकालिक τετήρηκα के लिए ‘पालन किया है’ उसके वर्तमान तक प्रासंगिक परिणाम को व्यक्त करता है।
- source_word: μενεῖτε / μένω
  choice: बने रहोगे / बना रहता हूँ
  rationale: यह यूहन्ना के प्रमुख ‘बने रहने’ के सम्बन्धपरक और निरन्तरता-सूचक भाव को स्पष्ट आधुनिक हिन्दी में रखता है तथा दोनों रूपों की पुनरावृत्ति सुरक्षित करता है।
- source_word: ἐν τῇ ἀγάπῃ μου / αὐτοῦ ἐν τῇ ἀγάπῃ
  choice: मेरे प्रेम में / उसके प्रेम में
  rationale: ‘प्रेम में’ मूल की सम्बन्धपरक परिधि की छवि को बिना व्याख्यात्मक विस्तार के बनाए रखता है; ‘उसके’ का निकटतम सन्दर्भ पिता है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह शिष्यों और यीशु के आज्ञापालन तथा प्रेम में बने रहने के बीच स्पष्ट तुलनात्मक समानता व्यक्त करता है।
- source_word: τοῦ πατρός μου
  choice: अपने पिता की
  rationale: यीशु वक्ता हैं, इसलिए हिन्दी का निजवाचक ‘अपने’ स्वाभाविक रूप से उसी कर्ता की ओर संकेत करता है और सम्बन्ध को स्पष्ट रखता है।
theological_decisions:
- issue: आज्ञापालन और यीशु के प्रेम में बने रहने का सम्बन्ध
  choice: वाक्य को वास्तविक शर्त के रूप में सीधे प्रस्तुत किया गया है।
  alternative: इसे प्रेम अर्जित करने का साधन मानना, अथवा शर्त को केवल बाहरी प्रमाण बताकर उसका वास्तविक बल घटा देना।
  rationale: यूनानी पाठ आज्ञाओं के पालन और प्रेम में बने रहने के बीच वास्तविक शर्त रखता है, पर उद्धार, योग्यता या अन्त तक स्थिर रहने पर कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष स्पष्ट नहीं करता।
- issue: ἀγάπη का अनुवाद
  choice: प्रेम
  alternative: प्रीति / दानशीलता
  rationale: ‘प्रेम’ आधुनिक मानक हिन्दी में सबसे स्वाभाविक और व्यापक शब्द है तथा पद के दोनों समानान्तर प्रयोगों में शब्दगत सम्बन्ध बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञाओं का पालन करना’ तथा ‘प्रेम में बने रहना’ सामान्य हिन्दी पाठक के लिए स्पष्ट हैं और मूल की समानान्तर रचना तथा यूहन्नाई शब्द-पुनरावृत्ति को सुरक्षित रखते हैं।
