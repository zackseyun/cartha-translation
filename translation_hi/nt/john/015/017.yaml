  yaml_path: translation/nt/john/015/017.yaml
  text: These things I command you[b][a], so that you may love one another.
translation:
  language: hi
  text: मैं तुम्हें ये आज्ञाएँ देता हूँ, ताकि तुम एक-दूसरे से प्रेम रखो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मैं तुम्हें ये आज्ञाएँ देता हूँ: एक-दूसरे से प्रेम रखो।” यूनानी में ‘ताकि’ से आरंभ होने वाला उपवाक्य उद्देश्य भी बता सकता है और यहाँ आज्ञा की विषयवस्तु के निकट भी हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ταῦτα
  choice: ये आज्ञाएँ
  rationale: यह नपुंसकलिंग बहुवचन संकेतवाचक सर्वनाम है, जिसका मूल अर्थ ‘ये बातें’ है। हिंदी में ‘ये बातें आज्ञा देता हूँ’ अस्वाभाविक होता; इसलिए आज्ञा देने के प्रसंग में ‘ये आज्ञाएँ’ स्वाभाविक रूप से उसी बहुवचन संकेत को व्यक्त करता है।
- source_word: ἐντέλλομαι
  choice: देता हूँ
  rationale: ‘आज्ञाएँ’ के साथ ‘देता हूँ’ मिलकर यूनानी क्रिया ‘आज्ञा देना’ का सीधा और वर्तमानकालिक भाव व्यक्त करता है। हिंदी में सामान्य वर्तमान यहाँ चल रहे कथन और स्थायी आदेश—दोनों के लिए स्वाभाविक है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: द्वितीय पुरुष बहुवचन के संप्रदान कारक को सामान्य आधुनिक हिंदी में ‘तुम्हें’ से व्यक्त किया गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रयोजन अथवा अभिप्रेत परिणाम बताने वाले उपवाक्य को स्वाभाविक हिंदी में स्पष्ट करता है, जबकि उसके आशय-वाचक प्रयोग की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἀγαπᾶτε
  choice: प्रेम रखो
  rationale: ἵνα के बाद आया वर्तमान संभावनार्थक रूप यहाँ उद्देश्यगत अपेक्षा व्यक्त करता है। ‘प्रेम रखो’ आधुनिक, गरिमापूर्ण हिंदी में पारस्परिक और निरंतर प्रेम का स्वाभाविक कथन है, बिना क्रिया के पक्ष को जरूरत से अधिक निश्चित किए।
- source_word: ἀλλήλους
  choice: एक-दूसरे से
  rationale: यह समूह के सदस्यों के बीच परस्पर क्रिया को स्पष्ट और प्रचलित हिंदी में व्यक्त करता है।
theological_decisions:
- issue: आज्ञा और ἵνα-उपवाक्य का संबंध
  choice: 'मुख्य पाठ में ἵνα को प्रयोजनसूचक ‘ताकि’ के रूप में रखा गया है: यीशु ये आज्ञाएँ इस उद्देश्य से देते हैं कि शिष्य एक-दूसरे से प्रेम रखें।'
  alternative: 'इसे आज्ञा की विषयवस्तु बताने वाला भी समझा जा सकता है: ‘मैं तुम्हें यह आज्ञा देता हूँ: एक-दूसरे से प्रेम रखो।’'
  rationale: यूनानी रचना सामान्यतः प्रयोजन या अभिप्रेत परिणाम बताती है, पर यूहन्ना की शैली में ἵνα कभी-कभी विषयवस्तु स्पष्ट करने के निकट आता है। मुख्य पाठ मूल रचना को बनाए रखता है और दूसरी संभावना पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ये आज्ञाएँ देता हूँ’ हिंदी में स्वाभाविक है और यूनानी बहुवचन संकेत तथा आदेश की शक्ति दोनों को व्यक्त करता है। ‘एक-दूसरे से प्रेम रखो’ कलीसियाई पाठकों के लिए परिचित होते हुए भी सामान्य पाठक को स्पष्ट है।
