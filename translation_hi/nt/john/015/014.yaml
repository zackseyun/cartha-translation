  text: You are my friends if you do what I command you[a].
translation:
  language: hi
  text: यदि तुम वह करते हो जो मैं तुम्हें करने की आज्ञा देता हूँ, तो तुम मेरे मित्र हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: द्वितीय पुरुष बहुवचन सर्वनाम आरंभ में बलयुक्त है। हिन्दी में अलग से ‘तुम ही’ जोड़ना अनावश्यक रूप से अधिक बल देता; वाक्य-विन्यास और संदर्भ पर्याप्त हैं।
- source_word: φίλοι μού
  choice: मेरे मित्र
  rationale: φίλοι संबंध की निकटता दर्शाता है; ‘मेरे मित्र’ स्वाभाविक, गरिमापूर्ण और यूहन्ना के प्रसंग के अनुरूप है।
- source_word: ἐστε
  choice: हो
  rationale: वर्तमानकालीन अस्तित्व-सूचक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐὰν
  choice: यदि … तो
  rationale: उपवाक्य की वास्तविक शर्त को स्पष्ट हिन्दी संरचना में व्यक्त करता है; इसे केवल समयसूचक ‘जब’ नहीं बनाया गया।
- source_word: ποιῆτε
  choice: करते हो
  rationale: ποιέω यहाँ आज्ञा को पूरा करने के अर्थ में है। ‘करते रहते हो’ वर्तमान पक्ष को आवश्यकता से अधिक प्रबल कर देता।
- source_word: ἃ
  choice: वह जिसकी
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम आज्ञा की विषय-वस्तु को सूचित करता है। हिन्दी में यह संरचना ‘वे बातें जो’ की अपेक्षा अधिक सहज है।
- source_word: ἐγὼ ἐντέλλομαι ὑμῖν
  choice: जिसकी आज्ञा मैं तुम्हें देता हूँ
  rationale: ἐντέλλομαι के अधिकारपूर्ण भाव को ‘आज्ञा देता हूँ’ सुरक्षित रखता है; स्पष्ट ἐγώ के कारण ‘मैं’ रखा गया है और ὑμῖν को ‘तुम्हें’ से व्यक्त किया गया है।
theological_decisions:
- issue: मित्रता और आज्ञापालन के बीच शर्त का स्वरूप
  choice: यदि तुम … तो तुम मेरे मित्र हो
  alternative: जब तुम … तब तुम मेरे मित्र हो
  rationale: ἐὰν के साथ संभावनार्थक क्रिया सबसे स्वाभाविक रूप से शर्त व्यक्त करती है। अनुवाद आज्ञापालन और यीशु की मित्रता के बीच कथित संबंध को बनाए रखता है, पर योग्यता, उद्धार या धीरज के विषय में कोई बाहरी धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ है, जो शिष्यों के प्रति निकटता को व्यक्त करता है और ‘आप’ की औपचारिक दूरी से बचता है। भाषा सरल, वर्तमान और गरिमापूर्ण रखी गई है।
