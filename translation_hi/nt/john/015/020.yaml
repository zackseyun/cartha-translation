id: JHN.15.20
reference: John 15:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μνημονεύετε τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν· Οὐκ ἔστιν δοῦλος μείζων τοῦ κυρίου αὐτοῦ· εἰ ἐμὲ ἐδίωξαν, καὶ ὑμᾶς διώξουσιν· εἰ τὸν λόγον μου ἐτήρησαν, καὶ τὸν ὑμέτερον τηρήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/020.yaml
  text: 'Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me[a], they will also persecute you; if they kept my word[b], they will also keep yours.'
translation:
  language: hi
  text: 'जो बात मैंने तुमसे कही थी, उसे याद रखो: ‘दास[a] अपने स्वामी से बड़ा नहीं होता।’ यदि उन्होंने मुझे सताया, तो वे तुम्हें भी सताएँगे; यदि उन्होंने मेरी बात मानी,[b] तो वे तुम्हारी बात भी मानेंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गुलाम’। यूनानी δοῦλος अधीनता और स्वामी के अधिकार में होने की स्थिति बताता है; संदर्भ के अनुसार इसका अनुवाद ‘दास’, ‘गुलाम’ या ‘सेवक’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी बात का पालन किया’। यहाँ ‘बात मानने’ में यीशु के संदेश को स्वीकार करना और उसके अनुसार चलना, दोनों शामिल हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύετε
  choice: याद रखो
  rationale: वर्तमान काल की आज्ञा निरंतर स्मरण रखने का भाव देती है; ‘याद रखो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τοῦ λόγου οὗ ἐγὼ εἶπον ὑμῖν
  choice: जो बात मैंने तुमसे कही थी
  rationale: यहाँ λόγος यीशु की पहले कही हुई विशिष्ट उक्ति को दर्शाता है। ‘बात’ हिन्दी में स्वाभाविक है और आगे ‘मेरी बात’ के साथ शब्दगत संबंध बनाए रखता है।
- source_word: δοῦλος
  choice: दास
  rationale: κύριος के साथ विरोध में यह अधीन सामाजिक स्थिति को व्यक्त करता है। ‘दास’ गरिमापूर्ण हिन्दी में प्रचलित है; स्वामित्व के अधिक स्पष्ट अर्थ ‘गुलाम’ को पादटिप्पणी में रखा गया है।
- source_word: μείζων
  choice: बड़ा
  rationale: यह पद या महत्त्व की व्यापक तुलना को बिना अनावश्यक व्याख्या के व्यक्त करता है और हिन्दी की कहावत-सदृश शैली में स्वाभाविक है।
- source_word: κυρίου
  choice: स्वामी
  rationale: यहाँ κύριος मसीही उपाधि नहीं, बल्कि दास पर अधिकार रखने वाले व्यक्ति के अर्थ में है; ‘स्वामी’ दास–स्वामी संबंध को स्पष्ट रखता है।
- source_word: ἐδίωξαν / διώξουσιν
  choice: सताया / सताएँगे
  rationale: संदर्भ में διώκω विरोध और उत्पीड़न का अर्थ देता है। ‘सताना’ सामान्य पाठकों के लिए स्वाभाविक है और धार्मिक विरोध सहित व्यापक उत्पीड़न को समेटता है।
- source_word: ἐτήρησαν / τηρήσουσιν
  choice: मानी / मानेंगे
  rationale: τηρέω यहाँ यीशु की बात को ग्रहण करने और उसके अनुसार चलने, दोनों का भाव रख सकता है। ‘बात मानना’ हिन्दी में इन दोनों पहलुओं को अपेक्षाकृत खुला रखता है।
- source_word: τὸν λόγον μου ... τὸν ὑμέτερον
  choice: मेरी बात ... तुम्हारी बात
  rationale: यह यीशु के वचन और शिष्यों द्वारा सुनाई जाने वाली बात के बीच मूल समानांतरता बनाए रखता है।
theological_decisions:
- issue: δοῦλος की अधीन सामाजिक स्थिति
  choice: दास
  alternative: गुलाम / सेवक
  rationale: मूल उक्ति की शक्ति दास और स्वामी के असमान पद पर निर्भर है। ‘दास’ उस अधीनता को बनाए रखता है; ‘सेवक’ संबंध को नरम कर सकता है, जबकि ‘गुलाम’ स्वामित्व को अधिक स्पष्ट करता है और इसलिए पादटिप्पणी में दिया गया है।
- issue: κύριος का संदर्भगत अर्थ
  choice: स्वामी
  alternative: प्रभु / मालिक
  rationale: यहाँ शब्द यीशु की उपाधि के रूप में नहीं, दास के अधिकारी के रूप में प्रयुक्त है। ‘स्वामी’ उसी संबंध को व्यक्त करता और उक्ति की गरिमा बनाए रखता है।
- issue: τηρέω में ग्रहण और आज्ञापालन का संबंध
  choice: बात मानी
  alternative: बात का पालन किया / बात को ग्रहण किया
  rationale: यूहन्ना में यह क्रिया संदेश को स्वीकार करने और उसके अनुसार चलने, दोनों की ओर संकेत कर सकती है। ‘बात मानी’ इस तनाव को किसी एक पहलू तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कहावत-सदृश शैली रखी गई है। ‘तुम’ का प्रयोग शिष्यों के लिए मूल बहुवचन संबोधन के स्वाभाविक हिन्दी रूप के रूप में किया गया है।
