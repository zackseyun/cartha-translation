review_pass:
  verdict: revise
  source_fidelity: 'The clause structure and core sense are substantially accurate: the Advocate is sent to the disciples from the Father, is identified as the Spirit of truth, proceeds from the Father, and will testify about Jesus. However, ‘पिता के पास से निकलता है’ is needlessly spatial and can suggest physical emergence; ‘पिता से निकलता है’ more directly conveys ἐκπορεύεται while retaining its formal wording.'
  naturalness: The draft is generally clear and suitably dignified. Removing the inserted ‘अर्थात्’ makes the apposition more natural and closer to the Greek. ‘सत्य का आत्मा’ is retained as an established, grammatically appropriate biblical title in Hindi.
  terminology: ‘सहायक’ is a defensible accessible rendering of παράκλητος, with alternatives supplied. ‘गवाही देगा’ accurately renders μαρτυρήσει. The transliteration in the lexical footnote is normalized to ‘पाराक्लेत,’ reflecting the Greek form more closely.
  issues:
  - severity: medium
    issue: ‘पिता के पास से निकलता है’ over-specifies spatial movement.
    rationale: παρὰ τοῦ πατρὸς ἐκπορεύεται states that the Spirit proceeds from the Father. In Hindi, ‘पिता के पास से निकलता है’ can evoke leaving a physical location. ‘पिता से निकलता है’ is more idiomatic and formally preserves the source wording without adding that implication.
  - severity: low
    issue: The explicit connector ‘अर्थात्’ is not represented in the Greek.
    rationale: The following noun phrase is appositional to ‘सहायक.’ Dashes alone communicate this relationship and avoid making the identification sound like an explanatory gloss.
  - severity: low
    issue: The lexical alternative ‘वह मेरे विषय में साक्षी होगा’ is less precise for μαρτυρήσει.
    rationale: The Greek verb means ‘will testify/bear witness,’ an action. ‘मेरे विषय में गवाही देगा’ or ‘मेरे विषय में साक्ष्य देगा’ better retains the verbal force.
  revised_text: जब वह सहायक[a] आएगा, जिसे मैं पिता की ओर से तुम्हारे पास भेजूँगा—सत्य का आत्मा, जो पिता से निकलता है[b]—तो वह मेरे विषय में गवाही देगा[c]।
