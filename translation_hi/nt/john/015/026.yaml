revisions:
- from: जब वह सहायक[a] आएगा, जिसे मैं पिता के पास से तुम्हारे पास भेजूँगा—अर्थात् सत्य का आत्मा, जो पिता के पास से निकलता है[b]—तो वह मेरे विषय में गवाही देगा[c]।
  to: जब वह सहायक[a] आएगा, जिसे मैं पिता की ओर से तुम्हारे पास भेजूँगा—सत्य का आत्मा, जो पिता से निकलता है[b]—तो वह मेरे विषय में गवाही देगा[c]।
  rationale: The revision preserves the Greek apposition and the personal presentation of the Advocate/Spirit while improving Hindi idiom. ‘पिता की ओर से’ naturally renders the sending source in the first clause; ‘पिता से निकलता है’ retains the distinct, theologically notable wording of ἐκπορεύεται without importing later doctrinal conclusions. Footnotes remain anchored to the relevant expressions and the lexical alternative for μαρτυρήσει is made verbal.
