id: JHN.15.26
reference: John 15:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ὅταν ἔλθῃ ὁ παράκλητος ὃν ἐγὼ πέμψω ὑμῖν παρὰ τοῦ πατρός, τὸ πνεῦμα τῆς ἀληθείας ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται, ἐκεῖνος μαρτυρήσει περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/026.yaml
  text: When the Advocate comes[a], whom I will send to you from the Father—the Spirit of truth[c][b], who proceeds from the Father—he will testify about me.
translation:
  language: hi
  text: जब वह सहायक[a] आएगा, जिसे मैं पिता की ओर से तुम्हारे पास भेजूँगा—सत्य का आत्मा, जो पिता से निकलता है[b]—तो वह मेरे विषय में गवाही देगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी παράκλητος का अनुवाद ‘पैरवी करने वाला,’ ‘सलाहकार,’ ‘सांत्वना देने वाला,’ या लिप्यंतरण करके ‘पाराक्लेत’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में कहा गया है कि वह ‘पिता से निकलता है।’ यह वाक्यांश बाद में त्रिएकत्व-संबंधी धर्मविज्ञान में विशेष महत्त्व का हुआ।
    reason: cross_reference
  - marker: c
    text: या ‘वह मेरे विषय में साक्ष्य देगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅταν ἔλθῃ
  choice: जब ... आएगा
  rationale: ὅταν के साथ अओरिस्ट सब्जंक्टिव यहाँ भविष्य में अपेक्षित घटना को व्यक्त करता है। स्वाभाविक हिन्दी में मुख्य भाव को भविष्यकाल से स्पष्ट किया गया है।
- source_word: ὁ παράκλητος
  choice: वह सहायक
  rationale: παράκλητος ऐसे व्यक्ति को सूचित करता है जो सहायता, समर्थन, प्रतिनिधित्व या पैरवी के लिए साथ खड़ा हो। ‘सहायक’ आधुनिक हिन्दी में सहज और व्यापक है; अन्य वैध अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ὃν ἐγὼ πέμψω ὑμῖν
  choice: जिसे मैं ... तुम्हारे पास भेजूँगा
  rationale: भविष्यकालीन πέμψω और अप्रत्यक्ष कर्म ὑμῖν को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: παρὰ τοῦ πατρός
  choice: पिता के पास से
  rationale: जनक कारक के साथ παρά स्रोत के साथ-साथ किसी की उपस्थिति या निकटता से आने का भाव दे सकता है। ‘पिता के पास से’ इस अर्थ-छाया को केवल ‘पिता से’ की अपेक्षा बेहतर रखता है।
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: सत्य का आत्मा
  rationale: मूल यूनानी की संबंधकारक संरचना और यूहन्ना की विशिष्ट उपाधि को सीधे सुरक्षित रखा गया है।
- source_word: ὃ παρὰ τοῦ πατρὸς ἐκπορεύεται
  choice: जो पिता के पास से निकलता है
  rationale: ἐκπορεύεται का विशिष्ट ‘बाहर निकलने/आने’ का भाव सुरक्षित है। ‘निकलता है’ आधुनिक हिन्दी में सुबोध है और बाद की धर्मवैज्ञानिक व्याख्या को मूल वाक्य में नहीं जोड़ता।
- source_word: ἐκεῖνος
  choice: तो वह
  rationale: पुल्लिंग बलाघाती संकेतवाचक आत्मा/सहायक को व्यक्तिगत कर्ता के रूप में सामने लाता है। हिन्दी ‘वह’ इसी व्यक्तिगत संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: μαρτυρήσει περὶ ἐμοῦ
  choice: मेरे विषय में गवाही देगा
  rationale: μαρτυρέω के साक्षी और न्यायिक अर्थ-क्षेत्र को ‘गवाही देगा’ स्पष्ट रूप से व्यक्त करता है; περί के साथ ‘मेरे विषय में’ मूल संबंध को सुरक्षित रखता है।
theological_decisions:
- issue: παράκλητος का बहुअर्थी पदनाम
  choice: सहायक
  alternative: पैरवी करनेवाला, सलाहकार, सांत्वना देनेवाला, या ‘पाराक्लीत’
  rationale: कोई एक हिन्दी शब्द इस पद के सहायता, प्रतिनिधित्व, पैरवी और सांत्वना के सभी भावों को नहीं समेटता। मुख्य पाठ में सुबोध व्यापक शब्द रखा गया है और अर्थगत विकल्प पाद-टिप्पणी में बताए गए हैं।
- issue: पवित्र आत्मा के लिए व्यक्तिगत संदर्भ
  choice: जो ... वह ... गवाही देगा
  alternative: निर्जीव या नपुंसक ढंग का संदर्भ
  rationale: πνεῦμα यूनानी में व्याकरणतः नपुंसकलिंग है, पर ἐκεῖνος पुल्लिंग है और आत्मा को साक्ष्य देनेवाले व्यक्तिगत कर्ता के रूप में प्रस्तुत करता है। हिन्दी में ‘आत्मा’ भी पुल्लिंग है, इसलिए ‘वह’ मूल प्रस्तुति को सहज रूप से रखता है।
- issue: ἐκπορεύεται और बाद का त्रिएकत्व-विवाद
  choice: पिता के पास से निकलता है
  alternative: पिता से आता है; पिता से उद्भूत होता है
  rationale: ‘निकलता है’ क्रिया की विशिष्टता बनाए रखता है, पर बाद की त्रिएकत्व-संबंधी शब्दावली या निष्कर्ष को पाठ में आरोपित नहीं करता। पाद-टिप्पणी इस वाक्यांश के बाद के धर्मवैज्ञानिक महत्त्व की सूचना मात्र देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अर्थात्’ समानाधिकरण को स्पष्ट करता है कि ‘सत्य का आत्मा’ उसी ‘सहायक’ की पहचान है। डैश मूल वाक्य की व्याख्यात्मक संरचना को दिखाते हैं।
