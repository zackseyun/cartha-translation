source:
  edition: SBLGNT
  text: εἰ τὰ ἔργα μὴ ἐποίησα ἐν αὐτοῖς ἃ οὐδεὶς ἄλλος ⸀ἐποίησεν, ἁμαρτίαν οὐκ ⸀εἴχοσαν· νῦν δὲ καὶ ἑωράκασιν καὶ μεμισήκασιν καὶ ἐμὲ καὶ τὸν πατέρα μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/024.yaml
  text: If I had not done among them the works that no one else did[a], they would not have sin[b]; but now they have both seen and hated both me and my Father.
translation:
  language: hi
  text: यदि मैंने उनके बीच वे काम न किए होते जो किसी और ने नहीं किए, तो उनमें पाप न होता[a]; लेकिन अब उन्होंने मुझे और मेरे पिता दोनों को देखा है और दोनों से घृणा की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो वे पाप के दोषी न होते।” यूनानी में अधिक शाब्दिक रूप से “उनमें पाप न होता” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔργα
  choice: वे काम
  rationale: ‘काम’ आधुनिक हिन्दी में स्वाभाविक है और यूहन्ना में यीशु के प्रकटकारी कार्यों के अर्थ को बनाए रखता है; ‘वे’ पूर्वप्रसंग से जुड़े निश्चित पदबंध को दर्शाता है।
- source_word: ἐποίησα ἐν αὐτοῖς
  choice: मैंने उनके बीच ... किए होते
  rationale: ‘उनके बीच’ ἐν αὐτοῖς का सामाजिक/स्थानवाचक भाव व्यक्त करता है। ‘किए होते’ असत्य-विपरीत शर्त को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἃ οὐδεὶς ἄλλος ἐποίησεν
  choice: जो किसी और ने नहीं किए
  rationale: यह यीशु के कामों की अद्वितीयता को संक्षिप्त और सहज रूप में सुरक्षित रखता है।
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: उनमें पाप न होता
  rationale: यह ‘पाप रखना/होना’ वाले यूहन्नाई मुहावरे को यथासंभव बनाए रखता है और मुख्य पाठ में उसे केवल ‘दोषी होना’ कहकर संकुचित नहीं करता।
- source_word: νῦν δὲ
  choice: लेकिन अब
  rationale: यह काल्पनिक स्थिति और वर्तमान वास्तविकता के बीच स्पष्ट विरोध प्रकट करता है।
- source_word: καὶ ἑωράκασιν καὶ μεμισήκασιν
  choice: देखा भी है और ... घृणा भी की है
  rationale: ‘भी ... भी’ दोनों पूर्ण क्रियाओं पर यूनानी καὶ ... καὶ का बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ἐμὲ καὶ τὸν πατέρα μου
  choice: मुझे और मेरे पिता—दोनों को ... और दोनों से
  rationale: ‘दोनों’ की पुनरावृत्ति यीशु और पिता, दोनों को देखने तथा दोनों से घृणा करने का समान संबंध स्पष्ट करती है और यूनानी के बल को बनाए रखती है।
theological_decisions:
- issue: ‘उनमें पाप न होता’ और उत्तरदायित्व का संबंध
  choice: मुख्य पाठ में यूहन्नाई अभिव्यक्ति ‘उनमें पाप न होता’ को बनाए रखा गया है।
  alternative: वे पाप के दोषी न होते
  rationale: संदर्भ यीशु के अद्वितीय काम देखने के बाद बढ़े हुए नैतिक उत्तरदायित्व की ओर संकेत करता है, पर मूल वाक्य केवल कानूनी दोष की शब्दावली नहीं अपनाता। इसलिए अस्पष्टता और धर्मवैचारिक तनाव को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कार्य’ के बजाय ‘काम’ अधिक स्वाभाविक है, जबकि ‘पाप’ और ‘पिता’ जैसे स्थापित यूहन्नाई शब्द सुरक्षित हैं।
