source:
  edition: SBLGNT
  text: εἰ ἐκ τοῦ κόσμου ἦτε, ὁ κόσμος ἂν τὸ ἴδιον ἐφίλει· ὅτι δὲ ἐκ τοῦ κόσμου οὐκ ἐστέ, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς ἐκ τοῦ κόσμου, διὰ τοῦτο μισεῖ ὑμᾶς ὁ κόσμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/019.yaml
  text: If you were from the world[a], the world would love its own. But because you are not from the world, but I chose you out of the world, for this reason the world hates you.
translation:
  language: hi
  text: यदि तुम संसार के होते[a], तो संसार अपनों से प्रेम करता। लेकिन क्योंकि तुम संसार के नहीं हो, बल्कि मैंने तुम्हें संसार में से चुना, इसी कारण संसार तुमसे घृणा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार से होते।” यूनानी पदबंध ἐκ τοῦ κόσμου स्रोत (“से”) या संबंध/संबद्धता (“के”) का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ κόσμου
  choice: संसार के
  rationale: पहले दो प्रयोगों में यह स्वाभाविक हिन्दी में संबंध या संबद्धता व्यक्त करता है। यूनानी ἐκ स्रोत और संबंध—दोनों का भाव दे सकता है; पादटिप्पणी वैकल्पिक ‘संसार से’ को सुरक्षित रखती है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना के प्रसंग में यह परमेश्वर-विरोधी मानवीय व्यवस्था या क्षेत्र का भाव रख सकता है, पर ‘संसार’ मूल शब्द की व्यापकता और धर्मवैचारिक तनाव को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἂν ... ἐφίλει
  choice: तो ... प्रेम करता
  rationale: यह हिन्दी में अवास्तविक शर्त के परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ ἴδιον
  choice: अपनों से
  rationale: यूनानी मुहावरा उस व्यक्ति या समूह को दर्शाता है जो किसी का अपना है। ‘अपनों से’ संक्षिप्त और सहज हिन्दी है, यद्यपि यूनानी रूप अपने आप में अधिक सामान्य है।
- source_word: φιλέω
  choice: प्रेम करता
  rationale: यहाँ μισέω के साथ तीखा विरोध है; ‘प्रेम करना’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: ἐξελεξάμην
  choice: मैंने ... चुन लिया है
  rationale: यह यीशु द्वारा किए गए चयन को सीधे व्यक्त करता है। हिन्दी पूर्ण वर्तमान उस पूर्व चयन की वर्तमान प्रासंगिकता को सहज रूप से सामने लाता है, बिना मध्यवाच्य में अतिरिक्त धर्मवैचारिक अर्थ जोड़ने के।
- source_word: ἐκ τοῦ κόσμου
  choice: संसार में से
  rationale: ἐξελεξάμην के साथ यह चयन और अलग किए जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह यूनानी पदबंध के स्पष्ट कारणात्मक बल को बनाए रखता है।
- source_word: μισεῖ
  choice: घृणा करता है
  rationale: सरल वर्तमान काल जारी वास्तविकता को व्यक्त करता है और मूल के प्रबल विरोध को नरम नहीं करता।
theological_decisions:
- issue: यूहन्ना के प्रसंग में ‘संसार’ का अर्थ
  choice: मुख्य पाठ में केवल ‘संसार’ रखा गया है।
  alternative: ‘परमेश्वर-विरोधी संसार-व्यवस्था’ या ‘परमेश्वर का विरोध करने वाला मानव समाज’
  rationale: प्रसंग में नैतिक और आत्मिक विरोध निहित है, पर व्याख्यात्मक विस्तार मूल की व्यापक धर्मवैचारिक श्रेणी को अनावश्यक रूप से संकीर्ण कर देता।
- issue: ἐξελεξάμην में यीशु के चयन का धर्मवैचारिक आशय
  choice: ‘मैंने तुम्हें संसार में से चुन लिया है’ के रूप में कथन को सीधे रखा गया है।
  alternative: बाद की किसी विशिष्ट पूर्वनियति या चुनाव-संबंधी धर्मसैद्धांतिक प्रणाली के अनुसार अधिक विशिष्ट अनुवाद
  rationale: पद यीशु द्वारा शिष्यों के चयन को स्पष्ट कहता है, पर चुनाव-संबंधी बाद के मतभेदों का समाधान स्वयं इस पद में नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पर क्योंकि’ के स्थान पर स्वाभाविक हिन्दी ‘पर क्योंकि’ ही रखा गया है ताकि विरोध और कारण दोनों स्पष्ट रहें; ‘अपनों’ मूल मुहावरे का सहज हिन्दी रूप है।
