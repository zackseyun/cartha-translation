base_translation:
  language: en
  yaml_path: translation/nt/john/015/012.yaml
  text: 'This is my command: that you love one another just as I have loved you[a].'
translation:
  language: hi
  text: यह मेरी आज्ञा है कि तुम एक-दूसरे से वैसा ही प्रेम करो जैसा मैंने तुमसे प्रेम किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὕτη ἐστὶν ἡ ἐντολὴ ἡ ἐμὴ
  choice: मेरी आज्ञा यह है
  rationale: यह स्वाभाविक हिन्दी में संकेतवाचक बल, आज्ञा की अधिकारपूर्ण प्रकृति और यीशु के स्वामित्व—तीनों को बनाए रखता है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ ἵνα आज्ञा की विषयवस्तु प्रस्तुत करता है; हिन्दी में ‘कि’ इसका सहज समतुल्य है।
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: तुम एक-दूसरे से ... प्रेम रखो
  rationale: वर्तमान कालीन क्रिया आज्ञात सतत आचरण को सूचित करती है। ‘प्रेम रखो’ आधुनिक, सुबोध और गरिमापूर्ण हिन्दी में पारस्परिक प्रेम की आज्ञा व्यक्त करता है।
- source_word: καθὼς
  choice: वैसा ही ... जैसा
  rationale: यह यीशु के प्रेम को शिष्यों के पारस्परिक प्रेम का नमूना और मापदंड बनाने वाली तुलना को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἠγάπησα ὑμᾶς
  choice: मैंने तुमसे प्रेम रखा है
  rationale: यूनानी अओरिस्ट यीशु के पूर्व और निर्णायक प्रेम की ओर संकेत करता है। हिन्दी पूर्ण पक्ष ‘रखा है’ उसके वर्तमान महत्त्व को स्वाभाविक ढंग से व्यक्त करता है, बिना कालगत अर्थ को अत्यधिक निश्चित किए।
theological_decisions:
- issue: ἀγαπάω का अनुवाद
  choice: प्रेम रखना
  alternative: प्यार करना
  rationale: ‘प्रेम’ मूल शब्द-समूह की गरिमा और यूहन्ना 15 में उसकी शब्दगत निरंतरता बनाए रखता है; ‘प्यार’ अधिक बोलचाल का है और इस प्रसंग में अपेक्षाकृत कम गरिमापूर्ण लग सकता है।
- issue: यीशु के प्रेम और शिष्यों के प्रेम का संबंध
  choice: वैसा ही प्रेम ... जैसा मैंने
  alternative: इसलिए प्रेम ... क्योंकि मैंने
  rationale: καθὼς तुलना और आदर्श प्रस्तुत करता है, कारण नहीं। अनुवाद उस नैतिक और मसीह-केंद्रित प्रतिरूप को बनाए रखता है तथा अतिरिक्त कारणात्मक अर्थ नहीं जोड़ता।
- issue: ἠγάπησα का काल-पक्ष
  choice: प्रेम रखा है
  alternative: प्रेम रखा
  rationale: दोनों सम्भव हैं; ‘रखा है’ हिन्दी में उस पूर्व प्रेम की वर्तमान प्रासंगिकता को व्यक्त करता है। इसे किसी विशिष्ट प्रायश्चित-सिद्धांत तक सीमित नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘एक-दूसरे’ पारस्परिकता को स्पष्ट करता है। मूल पाठ में ऐसी कोई प्रमुख पाठांतर या अनिवार्य अस्पष्टता नहीं है जिसके लिए पाद-टिप्पणी आवश्यक हो।
