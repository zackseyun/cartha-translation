id: JHN.15.3
reference: John 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἤδη ὑμεῖς καθαροί ἐστε διὰ τὸν λόγον ὃν λελάληκα ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/003.yaml
  text: Already you are clean because of the word that I have spoken to you[a].
translation:
  language: hi
  text: जो वचन मैंने तुमसे कहा है, उसके कारण तुम पहले ही शुद्ध हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो वचन मैंने तुमसे कहा है, उसके द्वारा तुम पहले ही शुद्ध हो।”
    reason: διά के कारणात्मक अर्थ ‘के कारण’ के साथ साधनात्मक अर्थ ‘के द्वारा’ भी संभव है।
lexical_decisions:
- source_word: ἤδη
  choice: पहले ही
  rationale: यह वर्तमान में पहले से प्रभावी अवस्था को व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: यह बहुवचन संबोधन है। हिन्दी में अलग बलसूचक शब्द जोड़ना अनावश्यक और अस्वाभाविक होगा।
- source_word: καθαροί
  choice: शुद्ध
  rationale: यह बेल और छाँटने/साफ़ करने के निकटवर्ती बिंब से जुड़ी स्वच्छता को बनाए रखता है, साथ ही हिन्दी में आध्यात्मिक और नैतिक अर्थ के लिए स्वाभाविक है।
- source_word: διὰ τὸν λόγον
  choice: वचन के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण को व्यक्त करता है; यह अनुवाद उस कारणात्मक संबंध को स्पष्ट रखते हुए वैकल्पिक साधनार्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: λόγον
  choice: वचन
  rationale: यह यूहन्ना की शब्दावली को बनाए रखता है और ‘संदेश’ या ‘शिक्षा’ से कम व्याख्यात्मक है।
- source_word: ὃν λελάληκα ὑμῖν
  choice: जो मैंने तुमसे कहा है
  rationale: पूर्ण काल के पूर्व कथन और उसके बने हुए प्रभाव को ‘कहा है’ व्यक्त करता है; ‘तुमसे’ हिन्दी में λαλέω के संबोधन का स्वाभाविक रूप है।
theological_decisions:
- issue: शिष्यों की शुद्धता का स्वरूप
  choice: कथन को वर्तमान आध्यात्मिक/नैतिक शुद्धता के रूप में खुला रखा गया है।
  alternative: इसे विशेष रूप से संस्कारगत शुद्धि या न्यायिक धर्मी-ठहराया जाना बताना।
  rationale: निकटवर्ती संदर्भ बेल और छँटाई/सफ़ाई का बिंब देता है तथा यीशु उनके शुद्ध होने को अपने कहे वचन से जोड़ते हैं; इसलिए अनुवाद बाद की किसी विशिष्ट सिद्धान्तगत श्रेणी को आरोपित नहीं करता।
- issue: διά का कारणात्मक या साधनात्मक अर्थ
  choice: मुख्य पाठ में ‘के कारण’।
  alternative: ‘के द्वारा’।
  rationale: कर्मकारक के साथ διά का कारणात्मक अर्थ यहाँ सुसंगत है, पर साधनात्मक समझ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए स्वाभाविक बहुवचन ‘तुम’; भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है।
