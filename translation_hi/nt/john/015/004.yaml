id: JHN.15.4
reference: John 15:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μείνατε ἐν ἐμοί, κἀγὼ ἐν ὑμῖν. καθὼς τὸ κλῆμα οὐ δύναται καρπὸν φέρειν ἀφ’ ἑαυτοῦ ἐὰν μὴ ⸀μένῃ ἐν τῇ ἀμπέλῳ, οὕτως οὐδὲ ὑμεῖς ἐὰν μὴ ἐν ἐμοὶ ⸀μένητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/004.yaml
  text: Remain in me[a], and I in you. Just as the branch is not able to bear fruit by itself unless it remains in the vine, so neither can you unless you remain in me.
translation:
  language: hi
  text: मुझमें बने रहो[a], और मैं तुममें। जैसे डाली अपने-आप फल नहीं ला सकती, यदि वह दाखलता में बनी न रहे, वैसे ही तुम भी फल नहीं ला सकते, यदि तुम मुझमें बने न रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझमें स्थिर रहो, और मैं तुममें।” यूनानी क्रिया μένω में बने रहने, टिके रहने या स्थिर रहने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνατε / μένῃ / μένητε
  choice: बने रहो / बनी रहे / बने रहो
  rationale: μένω के निरंतर संबंध और टिके रहने के भाव को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है और पूरे पद में मूल शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: ἐν ἐμοί
  choice: मुझमें
  rationale: ἐν के ‘में’ वाले संबंधात्मक और सहभागितापूर्ण भाव को सुरक्षित रखता है; केवल ‘मेरे साथ’ कहना अर्थ को निकटता तक सीमित कर देता।
- source_word: κἀγὼ ἐν ὑμῖν
  choice: और मैं तुममें
  rationale: यूनानी में क्रिया नहीं दी गई है। हिन्दी में भी संक्षिप्त, समानांतर वाक्यांश रखकर किसी अतिरिक्त काल या प्रतिज्ञा को नहीं जोड़ा गया।
- source_word: τὸ κλῆμα
  choice: डाली
  rationale: दाखलता के रूपक में κλῆμα का सहज और सटीक हिन्दी रूप।
- source_word: οὐ δύναται καρπὸν φέρειν
  choice: फल नहीं ला सकती
  rationale: असमर्थता के स्पष्ट भाव और कृषि-रूपक दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀφ’ ἑαυτοῦ
  choice: अपने-आप
  rationale: स्वतंत्र रूप से या अपने ही स्रोत से फल लाने की असमर्थता को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ἀμπέλῳ
  choice: दाखलता में
  rationale: ἀμπέλος के विशिष्ट अर्थ और ‘में’ के मूल रूपक को बिना ‘जुड़ी हुई’ जैसी व्याख्यात्मक वृद्धि के सुरक्षित रखता है।
- source_word: οὕτως οὐδὲ ὑμεῖς
  choice: वैसे ही तुम भी फल नहीं ला सकते
  rationale: पिछले खंड की ‘फल लाने की सामर्थ्य’ को हिन्दी में स्पष्ट रूप से दोहराना स्वाभाविक और अर्थ-सटीक है, यद्यपि यूनानी में यह क्रिया निहित है।
theological_decisions:
- issue: शिष्यत्व और यीशु के साथ संबंध के संदर्भ में μένω
  choice: बने रहो
  alternative: स्थिर रहो
  rationale: ‘बने रहो’ निरंतर संबंध, टिके रहने और अलग न होने के भाव को सहज आधुनिक हिन्दी में रखता है। ‘स्थिर रहो’ संभव है, पर वह गतिहीनता या केवल दृढ़ता का भाव अधिक दे सकता है।
- issue: κἀγὼ ἐν ὑμῖν में क्रिया का लोप
  choice: और मैं तुममें
  alternative: और मैं तुममें बना रहूँगा
  rationale: मूल यूनानी में क्रिया और काल दोनों अनुक्त हैं। संक्षिप्त रूप पारस्परिक अंतर्निवास का तनाव सुरक्षित रखता है और इसे स्पष्ट भविष्यकालीन प्रतिज्ञा में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और रूपक-संगत रखी गई है। ‘दाखलता’ बाइबलीय और कृषि-संदर्भ में सटीक है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
