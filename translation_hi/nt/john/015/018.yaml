source:
  edition: SBLGNT
  text: Εἰ ὁ κόσμος ὑμᾶς μισεῖ, γινώσκετε ὅτι ἐμὲ πρῶτον ⸀ὑμῶν μεμίσηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/018.yaml
  text: If the world hates you[a], know that it has hated me before you.
translation:
  language: hi
  text: यदि संसार तुमसे घृणा करता है, तो जान लो कि उसने तुमसे पहले मुझसे घृणा की है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने पहले मुझसे घृणा की—तुमसे पहले।” यूनानी में “पहले” और “तुम” का प्रयोग कालगत प्राथमिकता व्यक्त करता है।
    reason: मूल वाक्यक्रम और πρῶτον ὑμῶν के वैकल्पिक, अधिक शब्दशः रूप को दिखाना।
lexical_decisions:
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना में यह शब्द प्रायः परमेश्वर के विरोध में खड़े मानव-जगत को सूचित करता है, पर ‘संसार’ मूल शब्द की व्यापकता और प्रसंगगत धार्मिक तनाव—दोनों को बनाए रखता है।
- source_word: μισεῖ
  choice: घृणा करता है
  rationale: वर्तमानकाल का सरल, सामान्य अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और इसे केवल इसी क्षण चल रही क्रिया तक सीमित नहीं करता।
- source_word: γινώσκετε
  choice: जान लो
  rationale: यह रूप व्याकरण की दृष्टि से कथन (‘तुम जानते हो’) या आज्ञार्थक आग्रह हो सकता है; शर्तवाले उपवाक्य के बाद प्रसंग में आज्ञार्थक अर्थ अधिक स्वाभाविक है।
- source_word: πρῶτον ὑμῶν
  choice: तुमसे पहले
  rationale: सम्बन्धकारक ὑμῶν के साथ πρῶτον कालगत प्राथमिकता व्यक्त करता है; ‘तुमसे पहले’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: μεμίσηκεν
  choice: घृणा की है
  rationale: यूनानी पूर्णकाल बीती हुई क्रिया की वर्तमान प्रासंगिकता को बनाए रखता है; हिन्दी का पूर्ण रूप ‘की है’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐμὲ
  choice: मुझसे
  rationale: यूनानी में सर्वनाम पर बल है। हिन्दी वाक्यक्रम ‘तुमसे पहले मुझसे’ तुलना को स्पष्ट रखता है, जबकि ‘मुझसे’ यीशु को घृणा के लक्ष्य के रूप में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के लेखन में κόσμος का आशय
  choice: मुख्य पाठ में ‘संसार’ रखा गया है।
  alternative: ‘परमेश्वर के विरोध में खड़ा मानव-जगत’ या ‘सांसारिक व्यवस्था’
  rationale: प्रसंग में संसार यीशु और उसके चेलों का विरोध करता है, फिर भी अनुवाद में व्याख्यात्मक विस्तार जोड़ना मूल की व्यापकता को अनावश्यक रूप से सीमित कर देगा।
- issue: γινώσκετε का कथनात्मक या आज्ञार्थक अर्थ
  choice: ‘जान लो’—आज्ञार्थक आग्रह
  alternative: ‘तुम जानते हो’—कथन
  rationale: दोनों अर्थ रूप की दृष्टि से सम्भव हैं, लेकिन शर्तवाले वाक्य के बाद यीशु का निर्देश समझना प्रवचन के प्रवाह में अधिक उपयुक्त है; अनुवाद इस चुनाव को व्याकरण से अधिक निश्चित धार्मिक दावे में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘नफ़रत’ की अपेक्षा ‘घृणा’ चुना गया है क्योंकि यह इस गंभीर प्रवचन-संदर्भ के अनुकूल है, फिर भी सामान्य पाठक के लिए स्पष्ट है।
