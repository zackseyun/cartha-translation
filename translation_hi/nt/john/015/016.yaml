id: JHN.15.16
reference: John 15:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς με ἐξελέξασθε, ἀλλ’ ἐγὼ ἐξελεξάμην ὑμᾶς, καὶ ἔθηκα ὑμᾶς ἵνα ὑμεῖς ὑπάγητε καὶ καρπὸν φέρητε καὶ ὁ καρπὸς ὑμῶν μένῃ, ἵνα ὅ τι ἂν αἰτήσητε τὸν πατέρα ἐν τῷ ὀνόματί μου δῷ ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/016.yaml
  text: You did not choose me[a], but I chose you and appointed you so that you should go and bear fruit, and that your fruit should remain, so that whatever you ask the Father in my name[c][b], he may give you.
translation:
  language: hi
  text: तुमने मुझे नहीं चुना[a], बल्कि मैंने तुम्हें चुना और तुम्हें नियुक्त किया कि तुम जाओ, फल लाओ और तुम्हारा फल बना रहे[b], ताकि तुम पिता[c] से मेरे नाम में जो कुछ माँगो, वह तुम्हें दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चुना’ का अनुवाद ‘चयन किया’ भी हो सकता है। यहाँ सामान्य ‘चुना’ तत्काल प्रसंग के लिए अधिक स्वाभाविक है और मुख्य पाठ में बाद की पारिभाषिक धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘टिका रहे’ भी हो सकता है। यूहन्ना इस क्रिया का प्रयोग बने रहने, निरन्तर रहने या संबंध में स्थिर रहने के लिए बार-बार करता है; यहाँ फल के विषय में ‘बना रहे’ सहज हिन्दी है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ में ‘पिता’ है, ‘मेरे पिता’ नहीं।
    reason: textual_clarification
lexical_decisions:
- source_word: ἐξελέξασθε / ἐξελεξάμην
  choice: चुना / चुना
  rationale: ἐκλέγομαι का सामान्य अर्थ चुनना है। ‘चुना’ इस पद के संबंधपरक विरोध को स्वाभाविक रूप से व्यक्त करता है और मुख्य पाठ में बाद की पारिभाषिक धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- source_word: ἔθηκα
  choice: नियुक्त किया
  rationale: τίθημι का मूल अर्थ ‘रखना’ या ‘ठहराना’ हो सकता है, पर यहाँ शिष्यों को जाने और फल लाने के उद्देश्य से ठहराने का भाव है; ‘नियुक्त किया’ इस उद्देश्यपूर्ण दायित्व को स्पष्ट करता है, बिना इसे किसी विशेष कलीसियाई पद तक सीमित किए।
- source_word: ἵνα
  choice: कि / ताकि
  rationale: पहला ἵνα नियुक्ति का उद्देश्य बताता है, जिसके लिए हिन्दी में ‘कि’ सहज है; दूसरा उद्देश्य या परिणाम आगे बढ़ाता है, इसलिए ‘ताकि’ प्रयुक्त है।
- source_word: ὑπάγητε
  choice: जाओ
  rationale: ὑπάγω यहाँ जाने या आगे बढ़कर कार्य करने का व्यापक भाव रखता है। ‘जाओ’ सरल, स्वाभाविक और अर्थ की सम्भावित व्यापकता को सुरक्षित रखता है।
- source_word: καρπὸν φέρητε
  choice: फल लाओ
  rationale: यह यूहन्ना के प्रसंग में स्थापित रूपक है। ‘फल लाना’ हिन्दी में स्वाभाविक है और रूपक को बनाए रखता है।
- source_word: μένῃ
  choice: बना रहे
  rationale: μένω का अर्थ बने रहना, टिके रहना या निवास करना हो सकता है। यहाँ फल के स्थायी रहने की बात है; ‘बना रहे’ आधुनिक हिन्दी में स्पष्ट है और अवधि के भाव को सुरक्षित रखता है।
- source_word: ὅ τι ἂν αἰτήσητε
  choice: जो कुछ माँगो
  rationale: सापेक्ष पदबंध और ἄν अनिश्चित व्यापकता व्यक्त करते हैं। ‘जो कुछ माँगो’ हिन्दी में स्वाभाविक रूप से ‘whatever you ask’ का भाव देता है।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह प्रार्थना-संबंधी प्रसंग में प्रचलित और अर्थपूर्ण हिन्दी अभिव्यक्ति है। यह यीशु के नाम में माँगने के संबंधपरक और अधिकारगत भाव को बिना अतिरिक्त व्याख्या के बनाए रखती है।
- source_word: δῷ
  choice: दे
  rationale: ἵνα के अधीन अओरिस्ट सब्जंक्टिव उद्देश्य/परिणाम की संरचना में है। हिन्दी का ‘दे’ इस आश्रित वाक्य-विन्यास को स्वाभाविक रूप से व्यक्त करता है और इसे अलग, सपाट भविष्यवाणी में नहीं बदलता।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: यूनानी पाठ में ‘पिता’ है, ‘मेरे पिता’ नहीं। हिन्दी में संबंधकारक/परसर्गीय रचना ‘पिता से’ निश्चित संदर्भ को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: ἐξελεξάμην को धर्मवैज्ञानिक ‘चुनाव’ की पारिभाषिक धारणा के रूप में पढ़ने की सम्भावना
  choice: तत्काल शिष्यत्व और मिशन के संदर्भ में ‘मैंने तुम्हें चुना’
  alternative: ऐसा पारिभाषिक शब्द प्रयोग करना जो व्यवस्थित धर्मविज्ञान के ‘चुनाव’ को मुख्य रूप से सामने लाए
  rationale: पद यीशु की पहल को स्पष्ट करता है, पर क्रिया का सामान्य अर्थ ‘चुनना’ है। अनुवाद को बाद की धर्मवैज्ञानिक व्यवस्था थोपे बिना संदर्भ की पूरी गंभीरता बनाए रखनी चाहिए।
- issue: ἔθηκα ὑμᾶς का आशय
  choice: जाने और फल लाने के लिए उद्देश्यपूर्ण नियुक्ति
  alternative: शाब्दिक ‘तुम्हें रखा’ अथवा किसी विशिष्ट कलीसियाई पद पर अभिषेक
  rationale: आगे आने वाले उद्देश्य—जाना, फल लाना और प्रार्थना—एक दायित्व सौंपे जाने की ओर संकेत करते हैं, पर पाठ किसी विशेष पद को निर्धारित नहीं करता।
- issue: अन्तिम ἵνα उपवाक्य का बल
  choice: 'उद्देश्य/परिणाम: ‘ताकि ... वह तुम्हें दे’'
  alternative: 'एक पृथक और प्रबल सरल भविष्य-वचन: ‘वह तुम्हें देगा’'
  rationale: यूनानी वाक्य-विन्यास अन्तिम कथन को नियुक्ति और फल लाने से ἵνα द्वारा जोड़ता है। हिन्दी में आश्रित ‘दे’ इस संबंध को सुरक्षित रखता है और कथन को संदर्भ से अलग बिना शर्त सूत्र नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल पर गरिमापूर्ण रखी गई है। ‘बल्कि’, ‘नियुक्त किया’, ‘फल लाओ’ और ‘बना रहे’ जैसे पद सामान्य पाठक के लिए बोधगम्य हैं। यूनानी वाक्य की उद्देश्यपरक गति बनाए रखते हुए हिन्दी में आवश्यक विराम लगाए गए हैं।
