  text: καθὼς ἠγάπησέν με ὁ πατήρ, κἀγὼ ⸂ὑμᾶς ἠγάπησα⸃, μείνατε ἐν τῇ ἀγάπῃ τῇ ἐμῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/009.yaml
  text: Just as the Father has loved me[a], I also have loved you; remain in my love.
translation:
  language: hi
  text: जैसे पिता ने मुझसे प्रेम किया है,[a] वैसे ही मैंने भी तुमसे प्रेम किया है। मेरे प्रेम में बने रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जैसे पिता ने मुझसे प्रेम किया, वैसे ही मैंने भी तुमसे प्रेम किया। मेरे प्रेम में बने रहो।” यूनानी में दोनों क्रियाएँ एओरिस्ट रूप में हैं, जिनका अनुवाद सामान्य भूतकाल से भी किया जा सकता है; मुख्य पाठ में पूर्ण वर्तमान रूप उनके वर्तमान तक बने हुए महत्त्व को दर्शाता है।'
    reason: कालगत वैकल्पिक अनुवाद
lexical_decisions:
- source_word: καθὼς
  choice: जैसे ... वैसे ही
  rationale: यह पिता के यीशु से प्रेम और यीशु के शिष्यों से प्रेम के बीच तुलना और अनुरूपता को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: ἠγάπησέν
  choice: ने ... प्रेम किया है
  rationale: यूनानी एओरिस्ट को हिन्दी पूर्ण भूत में व्यक्त किया गया है, जिससे भूतकालीन क्रिया के वर्तमान तक बने हुए महत्त्व का संकेत मिलता है; सामान्य भूत भी सम्भव है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यूहन्ना के प्रसंग में यह परमेश्वर के लिए यीशु के पिता के रूप में प्रयुक्त सम्बोधन है।
- source_word: κἀγὼ
  choice: वैसे ही मैंने भी
  rationale: κἀγώ के संयोजक और बलात्मक दोनों भावों को पकड़ते हुए पहले खंड से अनुरूपता व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुमसे
  rationale: यह बहुवचन द्वितीय पुरुष है। हिन्दी में प्रेम करना के साथ स्वाभाविक परसर्ग ‘से’ लगाया गया है; प्रसंग से बहुवचन स्पष्ट है।
- source_word: ἠγάπησα
  choice: मैंने ... प्रेम किया है
  rationale: पहले एओरिस्ट के समान रूप रखकर यीशु के प्रेम की वर्तमान प्रासंगिकता व्यक्त होती है, जबकि सामान्य भूत एक वैध विकल्प है।
- source_word: μείνατε
  choice: बने रहो
  rationale: यह बहुवचन आज्ञार्थक रूप है। ‘बने रहो’ आधुनिक हिन्दी में स्वाभाविक है और यूहन्ना में μένω के टिके रहने के भाव को सुरक्षित रखता है।
- source_word: ἐν τῇ ἀγάπῃ τῇ ἐμῇ
  choice: मेरे प्रेम में
  rationale: स्वामित्व और ἐν के संबंध को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀγάπη का अनुवाद
  choice: प्रेम
  alternative: प्रीति
  rationale: ‘प्रेम’ आधुनिक मानक हिन्दी में व्यापक, स्पष्ट और गरिमापूर्ण है तथा किसी विशेष सांप्रदायिक अर्थ को नहीं जोड़ता।
- issue: ἠγάπησέν और ἠγάπησα के एओरिस्ट का कालगत निरूपण
  choice: 'पूर्ण भूत: ‘प्रेम किया है’'
  alternative: 'सामान्य भूत: ‘प्रेम किया’'
  rationale: पूर्ण भूत प्रसंग में इन प्रेमपूर्ण क्रियाओं की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में दर्शाता है, पर यूनानी एओरिस्ट स्वयं इसे अनिवार्य नहीं करता; इसलिए सामान्य भूत को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘मेरे प्रेम’ का संबंधगत अर्थ
  choice: अस्पष्टता को यथावत रखना
  alternative: ‘तुम्हारे लिए मेरे प्रेम में’ अथवा ‘मेरे प्रति प्रेम में’
  rationale: ग्रीक ἐν τῇ ἀγάπῃ τῇ ἐμῇ को ‘मेरे प्रेम में’ कहना स्वाभाविक है और यह जबरन तय नहीं करता कि मुख्य बल यीशु के प्रेम पर है या शिष्यों के उसमें बने रहने पर।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण शैली। शिष्यों के समूह को संबोधित करने के कारण ‘तुम’ और बहुवचन आज्ञार्थक ‘बने रहो’ प्रयुक्त हैं।
