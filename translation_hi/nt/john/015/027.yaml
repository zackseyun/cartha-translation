lexical_decisions:
- source_word: καὶ ὑμεῖς δὲ
  choice: और तुम भी
  rationale: 'καὶ वाक्य को पिछले कथन से जोड़ता है, जबकि स्पष्ट सर्वनाम ὑμεῖς और δὲ मिलकर चेलों पर हल्का बल देते हैं: सहायक के साथ-साथ वे भी गवाही देते हैं।'
- source_word: μαρτυρεῖτε
  choice: गवाही देते हो
  rationale: यह वर्तमानकालीन क्रिया है और न्यायिक अथवा प्रत्यक्षदर्शी साक्ष्य का भाव रखती है। आधुनिक हिन्दी में ‘गवाही देना’ स्वाभाविक और स्पष्ट है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι सबसे स्वाभाविक रूप से चेलों के गवाही देने का कारण प्रस्तुत करता है—वे आरम्भ से यीशु के साथ रहे हैं।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से
  rationale: मूल अभिव्यक्ति को संक्षिप्त और स्वाभाविक रूप में रखता है तथा आरम्भ की सटीक सीमा को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: μετά के संबंध और संगति के सीधे अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐστε
  choice: रहे हो
  rationale: यूनानी में रूप वर्तमानकाल ‘हो’ है, पर ἀπ’ ἀρχῆς के साथ यह अतीत से वर्तमान तक जारी अवस्था बताता है। हिन्दी में ‘आरम्भ से मेरे साथ रहे हो’ इस निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘आरम्भ से’ का दायरा
  choice: मुख्य पाठ में केवल ‘आरम्भ से’ रखा गया है
  alternative: इसे स्पष्ट रूप से ‘मेरी सेवकाई के आरम्भ से’ कहना, या इसे निरपेक्ष/सृष्टिगत आरम्भ समझना
  rationale: तात्कालिक प्रसंग चेलों की ऐतिहासिक संगति और इसलिए उनकी साक्षी देने की योग्यता से संबंधित है। फिर भी मूल पाठ आरम्भ को अधिक विशिष्ट नहीं करता, इसलिए अनुवाद उसकी खुली अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। ‘गवाही देते हो’ सामान्य पाठक के लिए स्वाभाविक है; ‘साक्षी देते हो’ को निकट lexical विकल्प के रूप में पादटिप्पणी में रखा गया है।
