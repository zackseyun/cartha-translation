review_pass:
  verdict: revise
  source_fidelity: The draft preserves the future action, the causal force of ‘because of my name,’ and the implicit wording for the sender. However, ‘तुम्हारे साथ करेंगे’ can naturally suggest doing something jointly with the disciples, whereas εἰς ὑμᾶς here denotes actions directed at them in the hostile setting. ‘तुम्हारे विरुद्ध’ conveys the contextual force clearly; the less explicit directional rendering is retained in a footnote.
  naturalness: The revised word order and ‘तुम्हारे विरुद्ध ये सब करेंगे’ are idiomatic, clear modern standard Hindi. ‘ये सब बातें’ is serviceable, though ‘ये सब’ is more natural with the broad verb करेंगे and does not unnecessarily specify the nature of the actions.
  terminology: ‘मेरे नाम के कारण,’ ‘नहीं जानते,’ and ‘जिसने मुझे भेजा है’ appropriately retain Johannine terminology and do not add ‘पिता,’ which the Greek does not explicitly state.
  issues:
  - severity: medium
    issue: ‘तुम्हारे साथ करेंगे’ is semantically ambiguous in Hindi.
    rationale: It may mean that the opponents will do these things together with the disciples rather than direct hostile acts toward them. The Greek construction in this context concerns acts directed at the disciples.
  revised_text: पर वे मेरे नाम के कारण तुम्हारे विरुद्ध ये सब करेंगे, क्योंकि वे उसे नहीं जानते जिसने मुझे भेजा है।
  revised_footnotes:
  - marker: a
    text: या, “तुम्हारे साथ।” यूनानी वाक्यांश का अर्थ शिष्यों की ओर निर्देशित कार्य हो सकता है; इस संदर्भ में वे शत्रुतापूर्ण हैं।
    reason: lexical_alternative
  revision_rationale: The directional phrase has been made unambiguous in Hindi in light of the hostile context, while the footnote preserves the broader, less explicit rendering permitted by the Greek. The rest of the draft is retained in substance, with no added theological identification of the one who sent Jesus.
