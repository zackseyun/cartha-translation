source:
  edition: SBLGNT
  text: ἀλλὰ ταῦτα πάντα ποιήσουσιν ⸂εἰς ὑμᾶς⸃ διὰ τὸ ὄνομά μου, ὅτι οὐκ οἴδασιν τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/021.yaml
  text: But they will do all these things to you because of my name[a], because they do not know the one who sent me.
translation:
  language: hi
  text: पर वे मेरे नाम के कारण तुम्हारे विरुद्ध ये सब करेंगे, क्योंकि वे उसे नहीं जानते जिसने मुझे भेजा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले कथन के साथ स्पष्ट विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: संकेतवाचक और समग्रता—दोनों को बनाए रखता है; सन्दर्भ में इसका अर्थ पहले बताए गए व्यवहार और उत्पीड़न से है।
- source_word: ποιήσουσιν
  choice: करेंगे
  rationale: भविष्यत् सक्रिय क्रिया का सीधा और व्यापक अनुवाद है; इसे केवल किसी एक प्रकार के दुर्व्यवहार तक सीमित नहीं करता।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे साथ
  rationale: व्यक्तियों की ओर निर्देशित व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है और सन्दर्भगत शत्रुता को अनावश्यक रूप से मूल वाक्य में अधिक स्पष्ट नहीं करता।
- source_word: διὰ τὸ ὄνομά μου
  choice: मेरे नाम के कारण
  rationale: διά के कारणवाचक अर्थ को स्पष्ट करता है और ‘नाम’ में निहित यीशु की पहचान तथा अधिकार की प्रतिनिधिक महत्ता को बनाए रखता है।
- source_word: οὐκ οἴδασιν
  choice: नहीं जानते
  rationale: यूहन्ना में यह केवल जानकारी नहीं, बल्कि सम्बन्धपरक पहचान को भी सूचित कर सकता है; हिन्दी अभिव्यक्ति दोनों सम्भावनाएँ बनाए रखती है।
- source_word: τὸν πέμψαντά με
  choice: उसे ... जिसने मुझे भेजा है
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का स्वाभाविक हिन्दी रूप है और मूल में अनुपस्थित ‘पिता’ पद को नहीं जोड़ता।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ का अभिप्रेत व्यक्ति
  choice: अप्रत्यक्ष उल्लेख को बनाए रखते हुए ‘उसे ... जिसने मुझे भेजा है’
  alternative: ‘मेरे पिता को, जिन्होंने मुझे भेजा है’
  rationale: यूहन्ना के व्यापक सन्दर्भ में अभिप्राय पिता से है, पर यूनानी पाठ यहाँ ‘पिता’ शब्द नहीं कहता; इसलिए उसे स्पष्ट रूप से जोड़ना मूल से आगे जाना होगा।
- issue: ‘नाम’ का अर्थ
  choice: शाब्दिक ‘मेरे नाम के कारण’ बनाए रखा गया
  alternative: ‘मेरी पहचान/मेरे कारण’
  rationale: ‘नाम’ यीशु के व्यक्तित्व, पहचान और अधिकार का प्रतिनिधित्व करता है; इसे केवल प्रतिष्ठा या सामान्य कारण में बदलने से इसकी धर्मवैज्ञानिक गहराई घट सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ‘पर’, ‘ये सब बातें’ और ‘नहीं जानते’ बोलचाल की सहजता तथा शास्त्रीय गंभीरता के बीच संतुलन रखते हैं।
