source:
  edition: SBLGNT
  text: ἐγώ εἰμι ἡ ἄμπελος, ὑμεῖς τὰ κλήματα. ὁ μένων ἐν ἐμοὶ κἀγὼ ἐν αὐτῷ οὗτος φέρει καρπὸν πολύν, ὅτι χωρὶς ἐμοῦ οὐ δύνασθε ποιεῖν οὐδέν.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/005.yaml
  text: I am the vine[a]; you are the branches. The one who remains in me, and I in him, bears much fruit[b], because apart from me you are not able to do anything.
translation:
  language: hi
  text: मैं दाखलता हूँ; तुम डालियाँ हो। जो मुझमें बना रहता है और मैं उसमें बना रहता हूँ, वही बहुत फल लाता है, क्योंकि मुझसे अलग होकर तुम कुछ भी नहीं कर सकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄμπελος
  choice: दाखलता
  rationale: यह अंगूर की बेल के लिए प्रचलित और संक्षिप्त हिन्दी शब्द है तथा रूपक को स्पष्ट रखता है।
- source_word: κλήματα
  choice: डालियाँ
  rationale: दाखलता के संदर्भ में यह उसकी फल देने वाली शाखाओं का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ὁ μένων
  choice: जो ... बना रहता है
  rationale: यह μένω के निरंतर बने रहने और संबंध में टिके रहने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν ἐμοὶ ... ἐν αὐτῷ
  choice: मुझमें ... उसमें
  rationale: ‘में’ को बनाए रखने से यूनानी पाठ का पारस्परिक अंतर्वास-संबंध सुरक्षित रहता है; ‘मेरे साथ’ इस बल को घटा देता।
- source_word: κἀγὼ
  choice: और मैं
  rationale: यह शिष्य के मसीह में और मसीह के शिष्य में बने रहने की पारस्परिक संरचना को बनाए रखता है।
- source_word: φέρει καρπὸν πολύν
  choice: बहुत फल लाता है
  rationale: दाखलता के रूपक में ‘फल लाना’ स्वाभाविक हिन्दी प्रयोग है और मात्रा के अर्थ को भी ठीक रखता है।
- source_word: χωρὶς ἐμοῦ
  choice: मुझसे अलग होकर
  rationale: यह केवल सहायता के अभाव की अपेक्षा यीशु से पृथक होने का अर्थ अधिक स्पष्टता से व्यक्त करता है।
- source_word: οὐ δύνασθε ποιεῖν οὐδέν
  choice: तुम कुछ भी नहीं कर सकते
  rationale: यह स्पष्ट अक्षमता को स्वाभाविक हिन्दी निषेध-वाक्य में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना का पारस्परिक अंतर्वास-संबंध
  choice: ‘जो मुझमें बना रहता है, और मैं उसमें’
  alternative: ‘जो मेरे साथ रहता है, और मैं उसके साथ’
  rationale: ‘में’ यूनानी ἐν को सुरक्षित रखता है और मसीह तथा शिष्य के पारस्परिक संबंध की गहराई व धर्मवैज्ञानिक तनाव को बिना व्याख्यात्मक रूप से हल किए प्रस्तुत करता है।
- issue: αὐτῷ का व्याकरणिक पुल्लिंग एकवचन
  choice: ‘उसमें’
  alternative: ‘उनमें’ अथवा ‘उस व्यक्ति में’
  rationale: हिन्दी में ‘जो ... उसमें’ स्वाभाविक प्रतिनिधिक एकवचन है; यह कथन किसी भी ऐसे शिष्य पर लागू होता है, जबकि अनावश्यक बहुवचन या भारी परिभाषा से बचता है।
- issue: ‘कुछ भी नहीं’ का विस्तार
  choice: कथन को उसके सार्वभौमिक निषेध सहित रखा गया
  alternative: ‘कोई आत्मिक फल नहीं ला सकते’
  rationale: मूल पाठ οὐδέν को सीमित नहीं करता; इसलिए अनुवाद इसमें ‘आत्मिक’ या ‘फल’ जोड़कर यीशु के कथन का दायरा स्वयं निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखलता,’ ‘डालियाँ,’ और ‘फल लाता है’ कृषि-रूपक को एकरूप रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
