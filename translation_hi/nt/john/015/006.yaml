id: JHN.15.6
reference: John 15:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν μή τις ⸀μένῃ ἐν ἐμοί, ἐβλήθη ἔξω ὡς τὸ κλῆμα καὶ ἐξηράνθη, καὶ συνάγουσιν αὐτὰ καὶ εἰς τὸ πῦρ βάλλουσιν καὶ καίεται.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/006.yaml
  text: If anyone does not remain in me[a], he is thrown out like the branch and dries up; and they gather them and throw them into the fire[b], and they are burned.
translation:
  language: hi
  text: यदि कोई मुझमें बना नहीं रहता[a], तो वह डाली के समान बाहर फेंक दिया जाता है और सूख जाता है। फिर लोग ऐसी डालियों को इकट्ठा करके आग में डाल देते हैं[b], और वे जल जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझमें स्थिर नहीं रहता।’ यूनानी क्रिया का अर्थ किसी संबंध या अवस्था में लगातार बने रहना भी है।
    reason: lexical_alternative
  - marker: b
    text: यह छवि बाहर किए जाने और जलने की चेतावनी देती है, पर यह पद स्वयं स्पष्ट नहीं करता कि इसका अर्थ सच्ची शिष्यता का खो जाना है या केवल बाहरी जुड़ाव का उजागर होना।
    reason: alternative_reading
lexical_decisions:
- source_word: μένῃ
  choice: बना रहता
  rationale: यूहन्ना के लेखन में μένω निरंतर संबंध में टिके रहने का प्रमुख शब्द है। ‘बना रहना’ आधुनिक हिन्दी में स्वाभाविक है और निरंतरता का भाव सुरक्षित रखता है।
- source_word: ἐν ἐμοί
  choice: मुझमें
  rationale: मूल के स्थान-संबंधी रूपक और यीशु के साथ संबंध की धार्मिक गहनता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐβλήθη ἔξω
  choice: बाहर फेंक दिया जाता है
  rationale: निष्क्रिय क्रिया और बहिष्कार की ठोस छवि को सुरक्षित रखते हुए सामान्य शर्त में स्वाभाविक हिन्दी वर्तमान प्रयोग किया गया है।
- source_word: ὡς τὸ κλῆμα
  choice: डाली के समान
  rationale: κλῆμα यहाँ अंगूर की बेल की डाली है; निकटवर्ती संदर्भ से ‘डाली’ स्पष्ट और सहज है।
- source_word: ἐξηράνθη
  choice: सूख जाता है
  rationale: क्रिया के सूख जाने के मूल अर्थ और डाली के रूपक दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνάγουσιν
  choice: लोग ... इकट्ठा करके
  rationale: यूनानी का अनिर्दिष्ट तृतीय पुरुष बहुवचन हिन्दी में ‘लोग’ द्वारा स्वाभाविक रूप से व्यक्त होता है और कर्ताओं की पहचान अनिर्दिष्ट रहती है।
- source_word: αὐτὰ
  choice: ऐसी डालियों को
  rationale: नपुंसकलिंग बहुवचन सर्वनाम उन जैसी डालियों की ओर संकेत करता है। हिन्दी में स्पष्टता और वचन-सामंजस्य के लिए संज्ञा दोहराई गई है।
- source_word: εἰς τὸ πῦρ βάλλουσιν
  choice: आग में डाल देते हैं
  rationale: मूल क्रिया की ठोस क्रिया को सहज आधुनिक हिन्दी में रखता है; ‘झोंकना’ अनावश्यक रूप से अधिक तीव्र होता।
- source_word: καίεται
  choice: वे जल जाती हैं
  rationale: यद्यपि यूनानी रूप एकवचन है, निकटतम बहुवचन αὐτά और एकत्र की गई डालियों की सामूहिक छवि के अनुसार हिन्दी में बहुवचन स्वाभाविक है। यह जलाए जाने/जलने के परिणाम को बिना ‘भस्म’ जैसी अतिरिक्त धारणा के व्यक्त करता है।
- source_word: τις
  choice: कोई
  rationale: शर्तवाचक वाक्य में अनिर्दिष्ट व्यक्ति के लिए ‘कोई’ सामान्य, समावेशी और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: क्या चेतावनी को सच्चे शिष्य के पतन या केवल बाहरी जुड़ाव के प्रकट होने के रूप में निश्चित किया जाए
  choice: रूपकात्मक चेतावनी को सीधे और बिना सिद्धान्तगत विस्तार के रखा गया
  alternative: इसे सच्चे विश्वासियों के पतन अथवा झूठे शिष्यों के उजागर होने की स्पष्ट घोषणा बनाना
  rationale: पद बहिष्कार, सूखने और आग की गंभीर छवि देता है, पर व्यक्ति की पूर्व आत्मिक दशा को स्वयं स्पष्ट नहीं करता। इसलिए अनुवाद उस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘मुझमें बना रहना’ यूहन्ना के प्रमुख संबंधपरक रूपक को सुरक्षित रखता है। एकवचन डाली से बहुवचन डालियों की ओर यूनानी पाठ में होने वाले परिवर्तन को हिन्दी में ‘ऐसी डालियों’ द्वारा स्पष्ट किया गया है।
