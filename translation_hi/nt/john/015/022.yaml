base_translation:
  language: en
  yaml_path: translation/nt/john/015/022.yaml
  text: If I had not come and spoken to them[a], they would not have sin[c][b]; but now they have no excuse for their sin.
translation:
  language: hi
  text: यदि मैं न आया होता और उनसे बात न की होती, तो उन्हें पाप न होता[a]; पर अब उनके पास अपने पाप के लिए कोई बहाना नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थ यह भी हो सकता है: “वे पाप के दोषी न होते” या “उन पर पाप का दोष न होता।” यूनानी का अधिक शाब्दिक अर्थ है, “उन्हें पाप न होता।”'
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप से: “अपने पाप के विषय में कोई बहाना नहीं है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὴ ἦλθον καὶ ἐλάλησα αὐτοῖς
  choice: यदि मैं न आया होता और उनसे बातें न की होतीं
  rationale: यूनानी में भूतकाल की तथ्य-विपरीत शर्त है। ‘न आया होता ... न की होतीं’ आधुनिक हिन्दी में उस अवास्तविक भूतकालीन स्थिति को स्वाभाविक रूप से व्यक्त करता है। αὐτοῖς को ‘उनसे’ के द्वारा λαλέω के साथ मुहावरेदार हिन्दी में रखा गया है।
- source_word: ἁμαρτίαν οὐκ εἴχοσαν
  choice: तो उन्हें पाप न होता
  rationale: यह यूनानी के ‘पाप न रखते/होता’ वाले कथन को यथासंभव निकट रखते हुए हिन्दी में समझने योग्य है। ‘वे दोषी न होते’ अर्थ की सम्भावित व्याख्या है, पर मुख्य पाठ में दोषिता को स्पष्ट करके मूल की धार्मिक अस्पष्टता को समाप्त नहीं किया गया।
- source_word: νῦν δὲ
  choice: पर अब
  rationale: काल्पनिक पिछली स्थिति और वर्तमान वास्तविकता के तीखे विरोध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρόφασιν οὐκ ἔχουσιν
  choice: उनके पास ... कोई बहाना नहीं है
  rationale: πρόφασις यहाँ बहाने या सफाई के आधार का बोध कराता है। ‘बहाना’ आधुनिक सामान्य हिन्दी में स्पष्ट है; ‘आड़’ या ‘ढोंग’ इस प्रसंग में कम सटीक होंगे।
- source_word: περὶ τῆς ἁμαρτίας αὐτῶν
  choice: अपने पाप के लिए
  rationale: περί + संबंधकारक मूलतः ‘के विषय में’ है, पर ‘बहाना’ के साथ हिन्दी का स्वाभाविक प्रयोग ‘के लिए बहाना’ है। पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: क्या ‘ἁμαρτίαν οὐκ εἴχοσαν’ का अर्थ पूर्ण पापहीनता है या यीशु के प्रकाशन को ठुकराने के पाप के लिए उत्तरदायित्व का अभाव
  choice: मुख्य पाठ में ‘उन्हें पाप न होता’ रखा गया है।
  alternative: ‘वे पाप के दोषी न होते’ अथवा ‘इस पाप के लिए उत्तरदायी न होते।’
  rationale: निकट प्रसंग यीशु के आने और बोलने के बाद उसे अस्वीकार करने की बढ़ी हुई जवाबदेही की ओर संकेत करता है; फिर भी यूनानी केवल ‘पाप रखते’ कहता है। इसलिए मुख्य पाठ उस धार्मिक तनाव को व्याख्या द्वारा समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बातें न की होतीं’ बहुवचन रूप में यीशु के उनसे किए गए संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में मूल की ‘पाप होना’ वाली अभिव्यक्ति को जानबूझकर पूरी तरह ‘दोषी होना’ में नहीं बदला गया।
