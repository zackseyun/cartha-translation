lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: मैं ही ... हूँ
  rationale: स्पष्ट सर्वनाम Ἐγώ कथन पर बल देता है। हिन्दी में ‘ही’ उस बल को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि इसे अलग आत्मपरक पदबंध बनाकर अधिक भारी नहीं किया गया।
- source_word: ἄμπελος
  choice: दाखलता
  rationale: यह अंगूर की बेल के लिए प्रचलित, संक्षिप्त और रूपक के अनुकूल हिन्दी शब्द है।
- source_word: ἀληθινή
  choice: सच्ची
  rationale: ‘सच्ची’ वास्तविक, प्रामाणिक और परम वास्तविकता से मेल खाने के यूहन्नाई अर्थ-विस्तार को खुला रखती है; ‘असली’ की अपेक्षा इसका धार्मिक-साहित्यिक स्वर अधिक गरिमापूर्ण है।
- source_word: πατήρ μου
  choice: मेरा पिता
  rationale: सम्बन्धवाचक पदबंध का सीधा अनुवाद है। देवनागरी में बड़े अक्षर न होने के कारण ईश्वर के लिए प्रयुक्त ‘पिता’ का अर्थ प्रसंग से स्पष्ट होता है।
- source_word: γεωργός
  choice: दाख की खेती करनेवाला
  rationale: γεωργός भूमि की खेती करनेवाले व्यक्ति को दर्शाता है। दाखलता के तत्काल प्रसंग में यह पद अर्थ को स्पष्ट और सटीक रखता है, जबकि ‘माली’ अधिक संक्षिप्त विकल्प है।
theological_decisions:
- issue: यीशु के ‘मैं हूँ’ कथन में रूपकात्मक पहचान
  choice: रूपक को सीधे ‘मैं ही सच्ची दाखलता हूँ’ के रूप में रखा गया।
  alternative: मैं असली दाखलता हूँ
  rationale: मूल पाठ रूपक की व्याख्या नहीं करता। ‘सच्ची’ यूहन्ना के लेखन में सत्य, प्रामाणिकता और परम वास्तविकता के बीच की अर्थगत गहराई को बिना हल किए सुरक्षित रखती है।
- issue: पिता के लिए γεωργός का अनुवाद
  choice: दाख की खेती करनेवाला
  alternative: माली
  rationale: यह चुनाव सामान्य कृषि-अर्थ और दाखलता के विशिष्ट प्रसंग—दोनों को व्यक्त करता है तथा पिता की भूमिका में कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दाखलता’ बाइबलीय रूपक को बनाए रखती है, जबकि ‘दाख की खेती करनेवाला’ आज के सामान्य पाठक के लिए भूमिका स्पष्ट करता है।
