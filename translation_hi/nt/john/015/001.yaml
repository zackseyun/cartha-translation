    issue: The rendering ‘दाख की खेती करनेवाला’ is stylistically cumbersome in the main text.
    rationale: Although semantically defensible in context, it is not the most natural modern Hindi designation for the cultivator in a vine metaphor. ‘दाखलता का माली’ is concise, intelligible, and retains the contextual specificity.
