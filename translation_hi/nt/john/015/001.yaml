  naturalness: The established biblical term ‘दाखलता’ is understandable, though literary. The predicate ‘दाख की खेती करनेवाला’ is less idiomatic than a concise contextual rendering such as ‘दाखलता का माली.’
  terminology: ‘दाखलता’ and ‘सच्ची’ retain the biblical image and register. ‘माली’ is a natural main-text term for γεωργός in this vine image; the footnote preserves the more explicit alternative ‘दाख की खेती करनेवाला.’ The footnote marker remains anchored immediately after the translated term.
