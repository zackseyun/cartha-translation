lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी में
  rationale: यह निकट संकेतवाचक वाक्यांश पूर्ववर्ती संदर्भ से जुड़ते हुए अगले ἵνα-वाक्य में बताई गई बात की ओर भी संकेत कर सकता है; इसलिए इसकी वास्तविक संदर्भगत व्यापकता को खुला रखा गया है।
- source_word: ἐδοξάσθη
  choice: महिमा हुई है
  rationale: एओरिस्ट निष्क्रिय रूप को हिन्दी के स्वाभाविक पूर्ण भाव में रखा गया है; इससे पिता की महिमा प्रकट/स्थापित होने का अर्थ आता है, बिना कर्मवाच्य को अनावश्यक रूप से कर्तृवाच्य बनाने के।
- source_word: καρπὸν πολὺν φέρητε
  choice: तुम बहुत फल लाओ
  rationale: यूहन्ना 15 के फलवंत होने वाले रूपक को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: γένησθε ἐμοὶ μαθηταί
  choice: मेरे चेले बनो
  rationale: γίνομαι के 'बनना' अर्थ और ἐμοί के व्यक्तिगत संबंध को सीधे व्यक्त करता है; μαθηταί के लिए आम और बोधगम्य बाइबलीय शब्द 'चेले' चुना गया है।
theological_decisions:
- issue: ἵνα का संबंध और अर्थ
  choice: कि तुम बहुत फल लाओ और मेरे चेले बनो
  alternative: जिससे तुम बहुत फल लाओ और अपने को मेरे चेले सिद्ध करो
  rationale: ἵνα परिणाम, उद्देश्य या व्याख्यात्मक आशय दे सकता है। यहाँ 'कि' इस अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता और फल लाने तथा चेले बनने—दोनों समानांतर क्रियाओं—को सुरक्षित रखता है।
- issue: γένησθε की पाठगत और धार्मिक धारणा
  choice: मेरे चेले बनो
  alternative: मेरे चेले ठहरो / सिद्ध होओ
  rationale: SBLGNT के γένησθε का सामान्य अर्थ 'बनो' है। इसे 'सिद्ध होओ' कहना शिष्यत्व के प्रमाण की व्याख्या जोड़ देगा, जो यूनानी क्रिया में स्वयं स्पष्ट नहीं है।
