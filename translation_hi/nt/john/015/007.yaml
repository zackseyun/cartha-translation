id: JHN.15.7
reference: John 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν μείνητε ἐν ἐμοὶ καὶ τὰ ῥήματά μου ἐν ὑμῖν μείνῃ, ὃ ἐὰν θέλητε ⸀αἰτήσασθε καὶ γενήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/015/007.yaml
  text: If you remain in me and my words remain in you[a], ask whatever you want[b], and it will be done for you.
translation:
  language: hi
  text: यदि तुम मुझमें बने रहो और मेरी बातें तुममें बनी रहें[a], तो जो कुछ तुम चाहो[b], माँगो, और वह तुम्हारे लिए हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुझमें स्थिर रहो और मेरी बातें तुममें स्थिर रहें।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘जो कुछ तुम इच्छा करो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: μείνητε / μείνῃ (μένω)
  choice: बने रहो / बनी रहें
  rationale: यह यूहन्ना के लेखन का एक प्रमुख शब्द है, जो निरंतर संबंध और टिके रहने का भाव व्यक्त करता है। दोनों स्थानों पर एक ही हिन्दी अभिव्यक्ति रखकर यूनानी की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ἐν ἐμοὶ
  choice: मुझमें
  rationale: ‘में’ को बनाए रखने से यीशु के साथ एकता और संबंध की भाषा सुरक्षित रहती है; इसे केवल ‘मेरे साथ’ कहकर हल्का नहीं किया गया।
- source_word: τὰ ῥήματά μου
  choice: मेरी बातें
  rationale: ῥήματα यीशु के कहे हुए वचनों या बातों की ओर संकेत करता है। ‘मेरी बातें’ आधुनिक हिन्दी में सहज और स्रोत के निकट है।
- source_word: ὃ ἐὰν θέλητε
  choice: जो कुछ तुम चाहो
  rationale: यह अनिश्चित और व्यापक अभिव्यक्ति है। अनुवाद उसी व्यापकता को रखता है और ऐसी कोई शर्त नहीं जोड़ता जो इस वाक्यांश में नहीं है।
- source_word: αἰτήσασθε
  choice: माँगो
  rationale: आज्ञार्थक क्रिया प्रार्थना या निवेदन में माँगने को व्यक्त करती है। ‘माँगो’ सीधा, स्वाभाविक और प्रसंगानुकूल है।
- source_word: γενήσεται ὑμῖν
  choice: वह तुम्हारे लिए हो जाएगा
  rationale: γίνομαι यहाँ किसी बात के घटित या पूरा होने का भाव देता है। यह अनुवाद कर्मवाच्य अर्थ को अनावश्यक रूप से जोड़े बिना परिणामसूचक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: प्रार्थना के विषय में यीशु के कथन में शर्त और प्रतिज्ञा का संबंध
  choice: माँगने की प्रतिज्ञा को इस स्पष्ट शर्त के अधीन रखा गया है कि शिष्य यीशु में बने रहें और उसकी बातें उनमें बनी रहें।
  alternative: ऐसा स्वतंत्र अनुवाद जिसमें प्रतिज्ञा बिना किसी शर्त के सुनाई दे।
  rationale: यूनानी वाक्य-विन्यास में ἐὰν से आरंभ होने वाला स्पष्ट शर्तसूचक उपवाक्य है। अनुवाद इस संरचना और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बने रहो’ यूहन्ना के प्रमुख संबंधसूचक शब्द की निरंतरता व्यक्त करता है, और पूरे पद में बहुवचन ‘तुम’ का प्रयोग मूल पाठ के अनुरूप है।
