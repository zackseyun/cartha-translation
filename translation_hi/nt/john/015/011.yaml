id: JHN.15.11
reference: John 15:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα λελάληκα ὑμῖν ἵνα ἡ χαρὰ ἡ ἐμὴ ἐν ὑμῖν ⸀ᾖ καὶ ἡ χαρὰ ὑμῶν πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/015/011.yaml
  text: I have spoken these things to you so that my joy may be in you[b][a], and your joy may be made full.
translation:
  language: hi
  text: मैंने ये बातें तुमसे इसलिए कही हैं कि मेरा आनन्द तुम में हो[a] और तुम्हारा आनन्द परिपूर्ण हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारे बीच हो।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘पूरा हो जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक को बनाए रखते हुए हिन्दी में पूर्ववर्ती शिक्षा के लिए स्वाभाविक अभिव्यक्ति।
- source_word: λελάληκα
  choice: मैंने … कही हैं
  rationale: पूर्णकालिक क्रिया के पूर्व में कहे जाने और उसके वर्तमान प्रभाव को हिन्दी के पूर्ण रूप से व्यक्त किया गया है।
- source_word: ὑμῖν
  choice: तुमसे
  rationale: λαλέω के साथ हिन्दी में ‘बातें तुमसे कहना’ स्वाभाविक है; ‘तुम’ का रूप प्रसंगानुसार बहुवचन शिष्यों को सम्बोधित करता है।
- source_word: ἵνα
  choice: इसलिए … कि
  rationale: उद्देश्य को सहज आधुनिक हिन्दी में स्पष्ट करता है, बिना उसे केवल परिणाम तक सीमित किए।
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: मेरा आनन्द
  rationale: यीशु से सम्बन्धित आनन्द को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुम में
  rationale: ἐν के आन्तरिक अर्थ को मुख्य पाठ में रखा गया है; ‘तुम्हारे बीच’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ᾖ
  choice: हो
  rationale: ἵνα के बाद वर्तमान संभावनार्थक रूप को हिन्दी उद्देश्य-वाक्य में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: दोनों उद्देश्यगत कथनों को साधारण समुच्चय से जोड़ता है।
- source_word: ἡ χαρὰ ὑμῶν
  choice: तुम्हारा आनन्द
  rationale: ‘मेरा आनन्द’ के समानान्तर स्वामित्व-संबंध को स्पष्ट और स्वाभाविक रूप में रखता है।
- source_word: πληρωθῇ
  choice: परिपूर्ण हो जाए
  rationale: क्रिया के पूर्णता और भरपूरी, दोनों भावों को संक्षिप्त तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मेरा आनन्द’ का स्वरूप
  choice: ‘मेरा आनन्द’ को बिना विस्तार के रखा गया है।
  alternative: ‘वह आनन्द जो मैं देता हूँ’ अथवा ‘मेरे विषय का आनन्द’
  rationale: यूनानी पाठ केवल ‘मेरा आनन्द’ कहता है; सीधा अनुवाद यीशु के अपने आनन्द के साझा होने और उससे प्राप्त आनन्द, दोनों सम्भावनाओं को खुला रखता है।
- issue: ἐν ὑμῖν का स्थानगत अथवा सामुदायिक अर्थ
  choice: मुख्य पाठ में ‘तुम में’
  alternative: ‘तुम्हारे बीच’
  rationale: शिष्यों के आनन्द के परिपूर्ण होने के समानान्तर आन्तरिक अर्थ उपयुक्त है, पर यूनानी पूर्वसर्ग सामुदायिक अर्थ भी दे सकता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण सम्बोधन अपनाया गया है। ‘आनन्द’ यूहन्ना के प्रसंग और धार्मिक गद्य में परिचित है; वाक्यरचना सामान्य पाठक के लिए सीधी रखी गई है।
