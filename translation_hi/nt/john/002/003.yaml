  - marker: b
    text: यूनानी में यहाँ ऐतिहासिक वर्तमान काल, “कहती है,” प्रयुक्त है। कुछ अनुवादों में इसे “कहा” अनूदित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑστερήσαντος οἴνου
  choice: जब दाखरस खत्म हो गया
  rationale: यह संबंधकारक निरपेक्ष रचना मुख्य क्रिया से पहले घटी परिस्थिति बताती है। ‘खत्म हो गया’ आधुनिक हिन्दी में अभाव की स्थिति को स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: λέγει
  choice: कहती है
  rationale: यूनानी में ऐतिहासिक वर्तमान काल है। हिन्दी कथन में वर्तमान काल यहाँ यूहन्ना की जीवंत कथाशैली को बनाए रखता है।
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: यीशु की माता
  rationale: यह यूनानी अभिव्यक्ति और इस प्रसंग में यूहन्ना द्वारा उनके उल्लेख की विशिष्ट रीति के निकट है।
- source_word: πρὸς αὐτόν
  choice: उससे
  rationale: ‘कहती है’ के साथ ‘उससे’ आधुनिक हिन्दी में संबोधित व्यक्ति को स्वाभाविक और स्पष्ट रूप से दर्शाता है।
- source_word: Οἶνον οὐκ ἔχουσιν
  choice: उनके पास दाखरस नहीं है
  rationale: बहुवचन क्रिया का कर्ता मूल पाठ में स्पष्ट नहीं किया गया है। ‘उनके’ उस अस्पष्टता को बनाए रखता है और मेजबानों या विवाह-दल को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: οἶνος
  choice: दाखरस
  rationale: यह अंगूर से बने मद्य के लिए प्रचलित, गरिमापूर्ण बाइबलीय हिन्दी शब्द है और मूल शब्द को कमजोर करके किसी गैर-मादक पेय में नहीं बदलता।
theological_decisions:
- issue: यूहन्ना की कथा में ऐतिहासिक वर्तमान काल
  choice: वर्तमान काल ‘कहती है’ को बनाए रखा गया
  alternative: भूतकाल ‘कहा’
  rationale: यह यूनानी कथाशैली की जीवंतता को सुरक्षित रखता है और हिन्दी में भी समझने योग्य है।
- issue: ‘उनके पास दाखरस नहीं है’ में निहित बहुवचन कर्ता का संदर्भ
  choice: ‘उनके’ कहकर संदर्भ को अनिर्दिष्ट रखा गया
  alternative: ‘मेजबानों’ या ‘विवाह वालों’ को स्पष्ट कर्ता बनाना
  rationale: यूनानी पाठ कर्ता की पहचान स्पष्ट नहीं करता; इसलिए अनुवाद में अतिरिक्त विवरण जोड़कर वास्तविक अस्पष्टता को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, स्पष्ट और गरिमापूर्ण शैली रखी गई है। ‘खत्म हो गया’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी अधिक शाब्दिक रूप देती है। ‘दाखरस’ को प्रसंगानुसार अंगूर से बने मद्य के अर्थ में लिया गया है।
