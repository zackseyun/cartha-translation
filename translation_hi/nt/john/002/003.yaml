  text: और जब दाखरस खत्म हो गया[a], तो यीशु की माता उससे कहती है[b], “उनके पास दाखरस नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप में: “जब दाखरस की कमी हो गई।”'
