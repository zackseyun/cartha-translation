source:
  edition: SBLGNT
  text: καὶ ὅτι οὐ χρείαν εἶχεν ἵνα τις μαρτυρήσῃ περὶ τοῦ ἀνθρώπου, αὐτὸς γὰρ ἐγίνωσκεν τί ἦν ἐν τῷ ἀνθρώπῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/025.yaml
  text: and because he had no need that anyone should testify about man[a], for he himself knew what was in man.
translation:
  language: hi
  text: और उसे इस बात की आवश्यकता नहीं थी कि कोई मनुष्य के विषय में गवाही दे[a], क्योंकि वह स्वयं जानता था कि मनुष्य के भीतर क्या था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘किसी व्यक्ति के विषय में ... किसी व्यक्ति के भीतर।’ यूनानी में एकवचन ‘मनुष्य’ का प्रयोग सामान्य रूप से किसी मानव या मानवजाति के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαν εἶχεν
  choice: उसे यह आवश्यकता नहीं थी
  rationale: यह यूनानी मुहावरे ‘आवश्यकता होना’ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἵνα τις μαρτυρήσῃ
  choice: कि कोई ... गवाही दे
  rationale: μαρτυρέω के साक्ष्य/गवाही संबंधी अर्थ को बनाए रखते हुए ἵνα-वाक्यांश को सहज हिन्दी में रखा गया है।
- source_word: περὶ τοῦ ἀνθρώπου
  choice: मनुष्य के विषय में
  rationale: एकवचन ἄνθρωπος यहाँ सामान्य या प्रतिनिधिक अर्थ रखता है; ‘मनुष्य’ उस रूप और व्यापकता दोनों को सुरक्षित रखता है।
- source_word: αὐτὸς γὰρ
  choice: क्योंकि वह स्वयं
  rationale: ‘स्वयं’ αὐτός के बलाघात को बनाए रखता है, और ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: ἐγίνωσκεν
  choice: जानता था
  rationale: अपूर्ण भूतकाल यहाँ निरंतर या स्वभावगत ज्ञान दिखाता है; हिन्दी में अवस्था-सूचक क्रिया के लिए ‘जानता था’ स्वाभाविक है।
- source_word: τί ἦν ἐν τῷ ἀνθρώπῳ
  choice: मनुष्य के भीतर क्या था
  rationale: यह मनुष्य के आंतरिक यथार्थ की व्यापक अभिव्यक्ति को बनाए रखता है और पहले आए ‘मनुष्य’ की पुनरावृत्ति भी सुरक्षित करता है।
theological_decisions:
- issue: मनुष्य के संबंध में यीशु के ज्ञान का दायरा
  choice: कथन को यीशु के प्रत्यक्ष ज्ञान के रूप में व्यापक ही रखा गया है—वह जानता था कि मनुष्य के भीतर क्या था।
  alternative: वह प्रत्येक व्यक्ति के मन की बात जानता था; अथवा वह सामान्य मानव-स्वभाव जानता था।
  rationale: यूनानी एकवचन ἀνθρώπου/ἀνθρώπῳ प्रतिनिधिक अर्थ में व्यक्ति और मानवता दोनों की ओर संकेत कर सकता है। अनुवाद इनमें से किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘मनुष्य’ को प्रतिनिधिक एकवचन तथा दोनों वाक्यांशों की साहित्यिक समानता बनाए रखने के लिए चुना गया है।
