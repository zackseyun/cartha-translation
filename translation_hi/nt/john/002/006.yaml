  text: ἦσαν δὲ ἐκεῖ ⸂λίθιναι ὑδρίαι⸃ ἓξ ⸂κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων κείμεναι⸃, χωροῦσαι ἀνὰ μετρητὰς δύο ἢ τρεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/006.yaml
  text: There were six stone water jars standing there[a], in accordance with the Jewish rites of purification[b], each holding two or three measures.
translation:
  language: hi
  text: वहाँ यहूदियों की शुद्धि की रीति के लिए पत्थर के छह जलपात्र रखे थे[a]। हरेक में दो या तीन माप[b] पानी समाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदियों की शुद्धि की रीति के अनुसार।” यह पदबंध धार्मिक रीति से की जाने वाली शुद्धि की प्रथाओं की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: '‘माप’ (यूनानी: मेत्रेतेस) तरल पदार्थ नापने की एक प्राचीन इकाई थी, जो लगभग 35–40 लीटर के बराबर होती थी।'
    reason: cultural_note
lexical_decisions:
- source_word: λίθιναι ὑδρίαι
  choice: पत्थर के जलपात्र
  rationale: λίθιναι पात्रों की सामग्री ‘पत्थर’ बताता है और ὑδρίαι पानी रखने के पात्रों को। ‘जलपात्र’ संक्षिप्त, वर्तमान और गरिमापूर्ण है।
- source_word: ἦσαν δὲ ἐκεῖ … κείμεναι
  choice: वहाँ … रखे थे
  rationale: δέ हल्का कथात्मक संयोजक है, जिसके लिए अलग शब्द आवश्यक नहीं। ἐκεῖ को ‘वहाँ’ और κείμεναι की स्थितिवाचक भावना को ‘रखे थे’ से व्यक्त किया गया है।
- source_word: ἓξ
  choice: छह
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: κατὰ τὸν καθαρισμὸν τῶν Ἰουδαίων
  choice: यहूदियों की शुद्धि की रीति के लिए
  rationale: यह वाक्यांश यहूदी धार्मिक शुद्धि-प्रथा से इन पात्रों का संबंध और प्रयोजन बताता है। ‘शुद्धि की रीति’ कर्मकांडीय संदर्भ को स्पष्ट रखता है, जबकि κατά की संभावित ‘के अनुसार’ छाया पादटिप्पणी में सुरक्षित है।
- source_word: χωροῦσαι
  choice: हरेक में … पानी समाता था
  rationale: यहाँ क्रिया पात्रों की धारिता बताती है। ἀνά की वितरणात्मक भावना ‘हरेक’ में प्रकट होती है।
- source_word: ἀνὰ μετρητὰς δύο ἢ τρεῖς
  choice: दो या तीन माप
  rationale: प्राचीन इकाई को अनिश्चित आधुनिक रूपांतरण से बदलने के बजाय मूल की सामान्य इकाई ‘माप’ रखी गई है; अनुमानित आधुनिक मात्रा पादटिप्पणी में दी गई है।
theological_decisions:
- issue: यूहन्ना के वर्णन में τῶν Ἰουδαίων का अर्थ
  choice: यहूदियों की
  alternative: यहूदिया-निवासियों की
  rationale: इस प्रसंग में पहचान क्षेत्रीय नहीं, बल्कि मान्य धार्मिक शुद्धि-प्रथा से जुड़ी है; इसलिए ‘यहूदियों की’ सांस्कृतिक-धार्मिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- issue: κατά द्वारा शुद्धि-प्रथा और पात्रों के संबंध की प्रकृति
  choice: शुद्धि की रीति के लिए
  alternative: शुद्धि की रीति के अनुसार
  rationale: प्रसंग में पात्रों का व्यावहारिक प्रयोजन प्रमुख प्रतीत होता है, पर मूल पदबंध अनुरूपता या प्रथा-संबंध भी जता सकता है; इस वास्तविक अर्थ-छाया को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘जलपात्र’ पात्र के प्रकार को संक्षेप में स्पष्ट करता है; प्राचीन माप को मुख्य पाठ में सुरक्षित रखकर आधुनिक अनुमान पादटिप्पणी में दिया गया है।
