  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: वह
  rationale: सन्दर्भ में संकेतवाचक सर्वनाम यीशु की ओर लौटता है; हिन्दी में ‘वह’ स्वाभाविक है और अनावश्यक बल नहीं जोड़ता।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में व्यक्त गलत समझ के विपरीत यूहन्ना की व्याख्या प्रस्तुत करता है; ‘पर’ उस हल्के विरोध को स्वाभाविक रूप से दिखाता है।
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल वर्णनात्मक या जारी भूतकालीन क्रिया का भाव रखता है; ‘कह रहा था’ इसे सुरक्षित रखता है, जबकि ‘उसका अर्थ था’ अधिक व्याख्यात्मक होता।
- source_word: περὶ
  choice: के विषय में
  rationale: सम्बन्धकारक के साथ περί का अर्थ ‘के विषय में’ या ‘के बारे में’ है; यहाँ dignified और स्पष्ट हिन्दी के लिए ‘के विषय में’ चुना गया है।
- source_word: ναοῦ
  choice: मन्दिर
  rationale: ναός विशेष रूप से मन्दिर के पवित्र भवन या गर्भगृह-सदृश भीतरी भाग को सूचित कर सकता है। मुख्य पाठ में परिचित शब्द ‘मन्दिर’ रखा गया है और अधिक विशिष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: σώματος
  choice: शरीर
  rationale: ‘शरीर’ मूल शब्द का सीधा, स्पष्ट और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण समतुल्य है।
- source_word: αὐτοῦ
  choice: अपने
  rationale: हिन्दी में कर्ता यीशु और उसी के शरीर के सम्बन्ध को स्वाभाविक और स्पष्ट रूप से व्यक्त करने के लिए निजवाचक ‘अपने’ उपयुक्त है।
theological_decisions:
- issue: यीशु के शरीर और मन्दिर का रूपकात्मक सम्बन्ध
  choice: ‘अपने शरीर के मन्दिर’ के रूप में मूल सम्बन्धकारक रूपक को सीधे बनाए रखना
  alternative: ‘उसका शरीर ही मन्दिर था’ या ‘अपने शरीर-रूपी मन्दिर’
  rationale: मूल पाठ ‘उसके शरीर के मन्दिर’ कहता है। चुना हुआ रूप उस रूपक और उसकी सम्भावित अर्थ-गहनता को बिना व्याख्यात्मक विस्तार या सिद्धान्तगत जोड़ के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मन्दिर’ सामान्य पाठक के लिए स्पष्ट है; ‘पवित्रस्थान’ की अधिक विशिष्ट शाब्दिक सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
