    text: यहाँ ‘मंदिर’ के लिए यूनानी शब्द ἱερόν है, जिसका अर्थ मंदिर-परिसर या उसके आँगन हो सकता है, न कि विशेष रूप से भीतरी पवित्रस्थान।
