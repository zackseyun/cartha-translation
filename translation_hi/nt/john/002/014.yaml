lexical_decisions:
- source_word: εὗρεν
  choice: पाया
  rationale: यह εὑρίσκω के सामान्य अर्थ को सीधे व्यक्त करता है और बताता है कि यीशु ने वहाँ प्रवेश करने पर यह स्थिति पाई; केवल ‘देखा’ कहना इसके अर्थ को कुछ संकुचित कर देता।
- source_word: ἱερῷ
  choice: मन्दिर
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, न कि केवल भीतरी पवित्रस्थान को। मुख्य पाठ में प्रचलित और सहज ‘मन्दिर’ रखा गया है तथा स्थानगत सूक्ष्मता पादटिप्पणी में स्पष्ट की गई है।
- source_word: πωλοῦντας
  choice: बेचनेवालों
  rationale: वर्तमान कृदन्त जारी गतिविधि को दर्शाता है; हिन्दी में यह संक्षिप्त और स्वाभाविक संज्ञात्मक रूप है।
- source_word: βόας
  choice: बैल
  rationale: βοῦς मवेशियों के लिए प्रयुक्त हो सकता है; बलिदानी पशुओं के इस संदर्भ में ‘बैल’ स्पष्ट और सामान्य हिन्दी विकल्प है, यद्यपि मूल शब्द लिंग को हर प्रसंग में अनिवार्य रूप से सीमित नहीं करता।
- source_word: πρόβατα
  choice: भेड़ें
  rationale: इस प्रसंग में πρόβατα का सामान्य और स्पष्ट अर्थ ‘भेड़ें’ है।
- source_word: περιστερὰς
  choice: कबूतर
  rationale: περιστερά कबूतर/फाख्ता वर्ग के पक्षी को सूचित करता है; बलिदान के प्रसंग में ‘कबूतर’ आधुनिक हिन्दी में सर्वाधिक सहज और बोधगम्य है।
- source_word: κερματιστὰς
  choice: सिक्के बदलनेवालों
  rationale: κερματιστής विभिन्न सिक्कों या मुद्राओं का विनिमय करनेवाले व्यक्ति को दर्शाता है। यह पद प्राचीन प्रसंग को ‘पैसे बदलनेवाले’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: καθημένους
  choice: बैठे हुए
  rationale: यह कृदन्त मुद्रा बदलनेवालों की बैठी हुई स्थिति बताता है; हिन्दी वाक्य-विन्यास में इसे उन्हीं के साथ रखा गया है ताकि यह पशु-विक्रेताओं पर भी लागू न समझा जाए।
theological_decisions:
- issue: यरूशलेम मन्दिर के संदर्भ में ἱερόν का क्षेत्र
  choice: मुख्य पाठ में ‘मन्दिर’, इस अर्थ में कि यह मन्दिर-परिसर या उसके आँगनों को दर्शाता है
  alternative: ‘मन्दिर का आँगन’, ‘मन्दिर-परिसर’, या ‘पवित्रस्थान’
  rationale: पशु-विक्रेताओं और सिक्के बदलनेवालों की उपस्थिति व्यापक मन्दिर-परिसर की ओर संकेत करती है। ‘पवित्रस्थान’ भीतरी भाग का भ्रामक अर्थ दे सकता है, जबकि ‘मन्दिर’ स्वाभाविक है और पादटिप्पणी मूल यूनानी की स्थानगत व्यापकता सुरक्षित रखती है।
