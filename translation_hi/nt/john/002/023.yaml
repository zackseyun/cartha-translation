id: JHN.2.23
reference: John 2:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὡς δὲ ἦν ἐν τοῖς Ἱεροσολύμοις ἐν τῷ πάσχα ἐν τῇ ἑορτῇ, πολλοὶ ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ, θεωροῦντες αὐτοῦ τὰ σημεῖα ἃ ἐποίει·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/023.yaml
  text: When he was in Jerusalem at the Passover[a], during the feast[b], many believed in his name as they were seeing the signs that he was doing.
translation:
  language: hi
  text: जब वह यरूशलेम में फसह के समय, पर्व के दौरान, था, तब बहुतों ने उसके नाम पर विश्वास किया[a], और वे उन चिन्हों[b] को देख रहे थे जो वह कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर विश्वास किया।” मूल में “उसके नाम पर विश्वास किया” है—यूहन्ना की यह अभिव्यक्ति उसकी प्रकट पहचान पर भरोसा करने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: “चिन्ह” उन कार्यों के लिए यूहन्ना का विशिष्ट शब्द है जो अपने से आगे बढ़कर यह प्रकट करते हैं कि यीशु कौन है; कुछ अनुवादों में “चमत्कारी चिन्ह” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: जब ... तब
  rationale: यह अभिव्यक्ति हल्की कथात्मक निरंतरता के साथ समय बताती है। हिन्दी में ‘जब ... तब’ स्वाभाविक है और मूल में न होने वाला ‘अब’ नहीं जोड़ती।
- source_word: ἐν τῷ πάσχα ἐν τῇ ἑορτῇ
  choice: फसह के समय, पर्व के दौरान
  rationale: दोनों ἐν-वाक्यांशों को रखते हुए दूसरा वाक्यांश स्पष्ट करता है कि प्रसंग फसह के पर्व का है। ‘फसह’ बाइबलीय नाम है और ‘पर्व’ आधुनिक पाठक के लिए प्रसंग स्पष्ट करता है।
- source_word: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ
  choice: उसके नाम पर विश्वास किया
  rationale: यूहन्ना की विशिष्ट ‘नाम पर विश्वास’ अभिव्यक्ति को बनाए रखा गया है; यह यीशु की प्रकट पहचान की ओर निर्देशित भरोसे को व्यक्त करती है और इसे केवल ‘उस पर विश्वास किया’ बनाकर समतल नहीं करती।
- source_word: θεωροῦντες
  choice: क्योंकि वे ... देख रहे थे
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रहे अवलोकन को बताता है और प्रसंग में विश्वास का अवसर या कारण भी सूचित करता है। हिन्दी में यह संबंध स्पष्ट और स्वाभाविक है।
- source_word: τὰ σημεῖα
  choice: चिन्हों
  rationale: यूहन्ना के धर्मवैचारिक रूप से महत्त्वपूर्ण शब्द को ‘चमत्कार’ तक सीमित न करके ‘चिन्ह’ रखा गया है, क्योंकि ये कार्य अपने से आगे यीशु की पहचान की ओर संकेत करते हैं।
- source_word: ἃ ἐποίει
  choice: जो वह कर रहा था
  rationale: अपूर्ण काल की जारी या बार-बार घटित होने वाली भूतकालीन क्रिया को हिन्दी के अपूर्ण पक्ष से व्यक्त किया गया है।
theological_decisions:
- issue: ἐπίστευσαν εἰς τὸ ὄνομα αὐτοῦ में बताए गए विश्वास की प्रकृति
  choice: ‘बहुत-से लोगों ने उसके नाम पर विश्वास किया’ को बिना कमजोर किए सीधा अनुवादित किया गया है।
  alternative: ‘लोगों ने केवल आरंभिक या सतही विश्वास किया’ अथवा ‘चमत्कारों के कारण विश्वास का दावा किया।’
  rationale: यह पद स्वयं विश्वास को स्पष्ट रूप से बताता है; अगले पद में कथावाचक उसका तनाव और सीमा सामने लाता है। इसलिए इस पद में ही विश्वास को सतही ठहराकर उस तनाव को पहले से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक ढंग अपनाया गया है। ‘फसह’, ‘पर्व’, ‘विश्वास’ और ‘चिन्ह’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। पादटिप्पणी-चिह्न ठीक उन्हीं पदों के बाद लगाए गए हैं जिनकी वे व्याख्या करते हैं।
