source:
  edition: SBLGNT
  text: ἀπεκρίθησαν οὖν οἱ Ἰουδαῖοι καὶ εἶπαν αὐτῷ· Τί σημεῖον δεικνύεις ἡμῖν, ὅτι ταῦτα ποιεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/018.yaml
  text: So the Jews answered and said to him[a], “What sign do you show us, that you do these things?”
translation:
  language: hi
  text: तब यहूदियों ने उसे उत्तर दिया[a], “तुम हमें कौन-सा चिन्ह दिखाते हो कि तुम ये काम करते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी अगुओं ने” अथवा “यहूदिया के लोगों ने”; यूहन्ना में “यहूदी” शब्द प्रसंग के अनुसार कभी-कभी अधिक सीमित रूप से, विशेषकर यहूदिया के अधिकारियों या किसी प्रतिनिधि समूह के लिए, प्रयुक्त हो सकता है।
    reason: मूल अभिव्यक्ति की व्यापकता और प्रसंग में उसके संभावित सीमित संदर्भ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν ... καὶ εἶπαν αὐτῷ
  choice: इसलिए ... उससे कहा
  rationale: ग्रीक में ‘उत्तर देकर कहा’ का युग्म कथात्मक शैली में वाणी की प्रतिक्रिया आरम्भ करता है। स्वाभाविक आधुनिक हिन्दी में ‘उससे कहा’ प्रतिक्रिया का भाव पर्याप्त रूप से व्यक्त करता है, और οὖν को ‘इसलिए’ पिछले मंदिर-कार्य से तार्किक संबंध में रखता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: मूल पद का सीधा अर्थ ‘यहूदी’ है। प्रसंग में इसका संकेत अधिक सीमित समूह, विशेषतः यहूदी अगुओं या यहूदिया के प्रतिनिधियों, की ओर हो सकता है; पर यह सीमा पद में स्पष्ट नहीं है, इसलिए मुख्य पाठ में व्यापक मूल अभिव्यक्ति रखी गई है और टिप्पणी में संभावना बताई गई है।
- source_word: Τί σημεῖον
  choice: कौन-सा चिन्ह
  rationale: यूहन्ना में σημεῖον केवल चमत्कार नहीं, बल्कि अधिकार या पहचान की ओर संकेत करने वाला कार्य है। ‘चिन्ह’ इस प्रमुख साहित्यिक अर्थ को सुरक्षित रखता है।
- source_word: δεικνύεις ἡμῖν
  choice: तुम हमें ... दिखाते हो
  rationale: यह वर्तमानकालीन सीधी चुनौती है और ἡμῖν के दत्तिव अर्थ को ‘हमें’ से स्पष्ट किया गया है।
- source_word: ὅτι ταῦτα ποιεῖς
  choice: कि तुम ये काम कर सकते हो
  rationale: 'यहाँ ὅτι उनके चिन्ह माँगने का आधार बताता है: वे ऐसा प्रमाण चाहते हैं जो इन कार्यों को करने के उसके अधिकार को सिद्ध करे। हिन्दी में ‘कर सकते हो’ संदर्भगत अधिकार/औचित्य की चुनौती को स्वाभाविक रूप से व्यक्त करता है, न कि केवल शारीरिक सामर्थ्य को।'
theological_decisions:
- issue: यूहन्ना में ‘οἱ Ἰουδαῖοι’ का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ रखा गया
  alternative: ‘यहूदी अगुओं’ अथवा ‘यहूदिया के लोगों/अधिकारियों’
  rationale: मूल भाषा जातीय/सामुदायिक पद का प्रयोग करती है, जबकि इस प्रसंग में बोलने वाले प्रतिनिधि या अधिकारी हो सकते हैं। अनुवाद ने मुख्य पाठ में अनिर्दिष्टता सुरक्षित रखी और पूरे यहूदी लोगों पर सार्वत्रिक दोष लगाने से बचाने के लिए पादटिप्पणी दी।
- issue: चिन्ह की माँग और यीशु के अधिकार का संबंध
  choice: ‘कि तुम ये काम कर सकते हो’
  alternative: ‘क्योंकि तुम ये काम कर रहे हो’ अथवा ‘कि तुम ये काम करते हो’
  rationale: मंदिर में यीशु की कार्रवाई के उत्तर में माँगा गया चिन्ह उसके ऐसा करने के अधिकार का प्रमाण है। यह चयन प्रसंगगत चुनौती स्पष्ट करता है, पर चिन्ह के स्वरूप या यीशु के उत्तर का धर्मवैज्ञानिक निष्कर्ष पहले से तय नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उत्तर देकर कहा’ जैसे ग्रीकनिष्ठ दोहरे प्रयोग से बचते हुए संवाद की प्रतिक्रियात्मक प्रकृति बनाए रखी गई है; ‘चिन्ह’ को यूहन्ना की प्रमुख पारिभाषिक शब्दावली के रूप में स्थिर रखा गया है।
