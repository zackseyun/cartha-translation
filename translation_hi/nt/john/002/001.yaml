  text: Καὶ τῇ ⸂ἡμέρᾳ τῇ τρίτῃ⸃ γάμος ἐγένετο ἐν Κανὰ τῆς Γαλιλαίας, καὶ ἦν ἡ μήτηρ τοῦ Ἰησοῦ ἐκεῖ·
base_translation:
  language: en
  yaml_path: translation/nt/john/002/001.yaml
  text: And on the third day there was a wedding in Cana of Galilee[b][a], and the mother of Jesus was there.
translation:
  language: hi
  text: और तीसरे दिन गलील के काना में एक विवाह[a] हुआ, और यीशु की माता वहाँ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विवाह-भोज।” यूनानी शब्द विवाह की घटना के साथ-साथ विवाह-उत्सव को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: साधारण कथात्मक संयोजक के रूप में यूहन्ना के वर्णन-प्रवाह को बनाए रखता है।
- source_word: τῇ ἡμέρᾳ τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: समयवाचक दत्तिव का स्वाभाविक हिन्दी रूप; यह कथानक में एक निश्चित समय-संकेत को सुरक्षित रखता है।
- source_word: γάμος
  choice: एक विवाह
  rationale: यह यूनानी शब्द विवाह की घटना और उसके उत्सव—दोनों को सूचित कर सकता है। ‘विवाह’ सहज और पर्याप्त रूप से व्यापक है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐγένετο
  choice: हुआ
  rationale: यहाँ क्रिया किसी घटना के घटित होने का परिचय देती है; ‘विवाह हुआ’ स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: गलील के काना में
  rationale: सम्बन्धकारक रचना को निकटता से रखते हुए स्थान का स्पष्ट और स्वाभाविक हिन्दी रूप देता है।
- source_word: ἡ μήτηρ τοῦ Ἰησοῦ
  choice: यीशु की माता
  rationale: मूल की सम्बन्धकारक रचना और गरिमापूर्ण कथात्मक शैली दोनों को सुरक्षित रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: सरल स्थानवाचक क्रियाविशेषण का सीधा अनुवाद है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
theological_decisions:
- issue: ‘तीसरे दिन’ का कथात्मक समय-संकेत
  choice: इसे बिना व्याख्यात्मक विस्तार के कालक्रम-सूचक वाक्यांश के रूप में रखा गया।
  alternative: इसे आगे आने वाले पुनरुत्थान का प्रतीकात्मक संकेत बनाकर अनुवाद में स्पष्ट करना।
  rationale: वाक्यांश संभावित यूहन्नाई प्रतीकात्मक अनुगूँज के लिए खुला रह सकता है, पर इस पद में वह प्रत्यक्ष रूप से समय बताता है; अनुवाद को किसी एक धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में आरोपित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘माता’ मूल पाठ की औपचारिकता के अनुरूप है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
