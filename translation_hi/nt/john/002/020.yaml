  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘मंदिर’ सामान्य पाठक के लिए स्पष्ट है। प्रश्न में ‘क्या तुम’ वक्ताओं के अविश्वास को व्यक्त करता है, और पाद-टिप्पणियाँ मूल की संदर्भगत तथा धर्मवैचारिक अस्पष्टता को सुरक्षित रखती हैं।
