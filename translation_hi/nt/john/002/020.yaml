  text: εἶπαν οὖν οἱ Ἰουδαῖοι· Τεσσεράκοντα καὶ ἓξ ἔτεσιν οἰκοδομήθη ὁ ναὸς οὗτος, καὶ σὺ ἐν τρισὶν ἡμέραις ἐγερεῖς αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/john/002/020.yaml
  text: So the Jews said[a], “This temple was built in forty-six years[b], and will you raise it up in three days?”
translation:
  language: hi
  text: इस पर यहूदियों ने कहा[a], “यह मंदिर छियालीस वर्षों में बनाया गया था, और क्या तुम इसे तीन दिनों में खड़ा करोगे[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के यहूदी।” यूनानी में “यहूदियों” है; यूहन्ना इस शब्द का प्रयोग संदर्भ के अनुसार अलग-अलग समूहों के लिए करता है।
    reason: alternative_reading
  - marker: b
    text: या “फिर से बना दोगे।” यूनानी क्रिया को वक्ता निर्माण के अर्थ में समझते हैं, पर “खड़ा करोगे” आगे यूहन्ना द्वारा यीशु के जी उठने से जोड़े गए शब्द-प्रयोग को भी बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इस पर
  rationale: यह पिछले कथन के प्रत्युत्तर और परिणामस्वरूप कही गई बात को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यह यूनानी पद के सामान्य अर्थ को बनाए रखता है और वक्ताओं को केवल ‘यहूदी अगुवे’ कहकर मूल से अधिक सीमित नहीं करता। यूहन्ना में इसके संदर्भानुसार बदलते प्रयोग को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: Τεσσεράκοντα καὶ ἓξ ἔτεσιν
  choice: छियालीस वर्षों में
  rationale: यह निर्माण में लगे समय की अवधि व्यक्त करता है और यूनानी कालवाचक दत्तिव का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: οἰκοδομήθη
  choice: बनाया गया था
  rationale: यह अओरिस्ट कर्मवाच्य का साररूप कथन बनाए रखता है और निर्माण-कार्य की ऐतिहासिक अवधि के संदर्भ में सहज हिन्दी है।
- source_word: ὁ ναὸς οὗτος
  choice: यह मंदिर
  rationale: ναός अधिक विशेष रूप से मंदिर के पवित्र भवन को सूचित कर सकता है, पर इस संदर्भ में ‘मंदिर’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: καὶ σὺ
  choice: और क्या तुम
  rationale: ‘तुम’ यूनानी में बलयुक्त है; प्रश्नात्मक हिन्दी वक्ताओं के अविश्वास और चुनौतीपूर्ण लहजे को प्रकट करती है।
- source_word: ἐν τρισὶν ἡμέραις
  choice: तीन दिनों में
  rationale: यह समयावधि का सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐγερεῖς
  choice: खड़ा कर दोगे
  rationale: यह मंदिर को पुनः खड़ा करने की वक्ताओं की समझ के अनुकूल है, फिर भी केवल ‘फिर से बना दोगे’ कहकर आगे आने वाले पुनरुत्थान-संबंधी अर्थ को पूरी तरह समाप्त नहीं करता।
- source_word: αὐτόν
  choice: इसे
  rationale: यह पूर्वोक्त मंदिर की ओर स्वाभाविक हिन्दी सर्वनाम से संकेत करता है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι को यहूदी-विरोधी व्यापक कथन समझे जाने की संभावना
  choice: मुख्य पाठ में ‘यहूदी’ रखा गया
  alternative: ‘यहूदिया के लोग’ अथवा ‘यहूदी अगुवे’
  rationale: मूल पद को बनाए रखते हुए उसके संदर्भगत लचीलेपन को पाद-टिप्पणी में बताया गया है। ‘यहूदी अगुवे’ इस पद के अर्थ को इस पद्य से अधिक संकीर्ण कर देता।
- issue: ἐγερεῖς में मंदिर-निर्माण और पुनरुत्थान के बीच अर्थगत तनाव
  choice: ‘खड़ा कर दोगे’
  alternative: ‘फिर से बना दोगे’ अथवा ‘उठा दोगे’
  rationale: वक्ता भौतिक मंदिर के निर्माण की बात समझते हैं, जबकि अगला पद यीशु के शरीर की ओर संकेत करता है। चुना हुआ रूप इस विडंबना को समय से पहले पूरी तरह हल नहीं करता।
