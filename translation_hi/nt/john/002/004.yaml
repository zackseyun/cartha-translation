base_translation:
  language: en
  yaml_path: translation/nt/john/002/004.yaml
  text: And Jesus said to her[a], “What does that have to do with me and with you[b], woman? My hour has not yet come.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “मेरा और तुम्हारा इससे क्या लेना-देना है[a], स्त्री?[b] मेरा समय अभी तक नहीं आया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मुझे और तुम्हें इससे क्या?” यह मुहावरा सरोकार या भूमिका से दूरी प्रकट करता है; यह आवश्यक नहीं कि शत्रुता व्यक्त करे।
    reason: lexical_alternative
  - marker: b
    text: उस समय “स्त्री” सामान्य और सम्मानपूर्ण सम्बोधन हो सकता था, यद्यपि आधुनिक हिन्दी में यह कुछ रूखा सुनाई दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान (‘कहता है’) है, पर आधुनिक हिन्दी कथन-शैली में यहाँ सामान्य भूतकाल ‘कहा’ अधिक स्वाभाविक है और वही कथात्मक कार्य बनाए रखता है।
- source_word: Τί ἐμοὶ καὶ σοί
  choice: मेरा और तुम्हारा इससे क्या लेना-देना है
  rationale: यह सामी पृष्ठभूमि वाला यूनानी मुहावरा सरोकार या भूमिका से दूरी जताता है। हिन्दी का ‘क्या लेना-देना’ उसके मुहावरेदार बल को स्पष्ट रखता है, पर उसे अनिवार्य रूप से शत्रुतापूर्ण नहीं बनाता।
- source_word: γύναι
  choice: स्त्री
  rationale: सम्बोधन का शाब्दिक अर्थ ‘स्त्री’ है। ‘माँ’ संबंध को मूल से अधिक स्पष्ट करता और ‘प्रिय स्त्री’ अनकही आत्मीयता जोड़ता; इसलिए मूल सम्बोधन रखा गया है और उसके सांस्कृतिक स्वर को पादटिप्पणी में समझाया गया है।
- source_word: οὔπω
  choice: अभी नहीं
  rationale: यह बताता है कि अपेक्षित समय अब तक नहीं आया; ‘अभी नहीं’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἥκει
  choice: आई है
  rationale: क्रिया आने या उपस्थित हो जाने का भाव देती है। ‘घड़ी’ के साथ ‘आई है’ स्वाभाविक हिन्दी है और पूर्णता का पक्ष सुरक्षित रखता है।
- source_word: ἡ ὥρα μου
  choice: मेरी घड़ी
  rationale: यूहन्ना में ‘घड़ी’ यीशु के ठहराए हुए निर्णायक समय का विषयगत संकेत है। ‘मेरा समय’ अधिक सामान्य होता; ‘मेरी घड़ी’ मूल रूपक और उसकी व्यापक धार्मिक प्रतिध्वनि बचाती है।
theological_decisions:
- issue: अपनी माता के प्रति यीशु के उत्तर का स्वर और बल
  choice: सम्मान की संभावना बनाए रखते हुए दूरी जताने वाला उत्तर
  alternative: इसे कठोर डाँट या अत्यन्त स्नेहपूर्ण सम्बोधन बनाना
  rationale: ‘Τί ἐμοὶ καὶ σοί’ सरोकार या भूमिका की दूरी व्यक्त करता है, जबकि ‘γύναι’ उस परिवेश में सामान्य और सम्मानपूर्ण सम्बोधन हो सकता था। अनुवाद न तो तनाव मिटाता है, न मूल से अधिक कठोरता या आत्मीयता जोड़ता है।
- issue: यूहन्ना के धर्मवैचारिक सन्दर्भ में ‘मेरी घड़ी’ का अर्थ
  choice: यीशु के ठहराए हुए समय को दर्शाने वाला, व्यापक विषयगत प्रतिध्वनि रखने वाला वाक्यांश
  alternative: केवल इस चिन्ह को करने का अवसर, या बिना किसी व्यापक अर्थ का साधारण समय
  rationale: यूहन्ना में ‘घड़ी’ यीशु के मिशन और महिमा से बार-बार जुड़ती है। शाब्दिक रूपक रखने से पाठक वह प्रतिध्वनि देख सकते हैं, जबकि मुख्य पाठ उसे आवश्यकता से अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्या लेना-देना’ वर्तमान हिन्दी का स्वाभाविक मुहावरा है; ‘स्त्री’ और ‘मेरी घड़ी’ मूल के महत्वपूर्ण शब्दों को सुरक्षित रखते हैं, और जहाँ वे आधुनिक पाठक को असामान्य लग सकते हैं वहाँ पादटिप्पणियाँ दी गई हैं।
