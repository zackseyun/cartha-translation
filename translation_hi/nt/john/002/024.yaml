  yaml_path: translation/nt/john/002/024.yaml
  text: But Jesus himself was not entrusting himself to them[a], because he knew all people,
translation:
  language: hi
  text: परन्तु यीशु स्वयं अपने आपको उनके भरोसे नहीं छोड़ता था[a], क्योंकि वह सब लोगों को जानता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में वही क्रिया है जो पिछले पद में आई है: बहुतों ने यीशु पर “विश्वास किया,” पर यीशु अपने आपको उनके भरोसे “नहीं छोड़ता था।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς δὲ Ἰησοῦς
  choice: परन्तु यीशु स्वयं
  rationale: δέ पिछले पद से विरोधात्मक मोड़ दिखाता है, और αὐτός कर्ता पर बल देता है; इसलिए ‘परन्तु’ और ‘स्वयं’ दोनों रखे गए हैं।
- source_word: οὐκ ἐπίστευεν
  choice: अपने आपको ... नहीं सौंपता था
  rationale: यहाँ πιστεύω के साथ स्वयं का कर्म और व्यक्तियों का सम्प्रदान है, इसलिए अर्थ ‘भरोसा करके अपने को सौंपना’ है। अपूर्ण काल की निरंतर अथवा प्रवृत्तिगत छाया के लिए ‘नहीं सौंपता था’ चुना गया है।
- source_word: αὑτὸν αὐτοῖς
  choice: अपने आपको उन पर
  rationale: प्रतिबिंबवाचक सर्वनाम व्यक्तिगत आत्म-समर्पण या भरोसे के साथ स्वयं को किसी के हाथ सौंपने का भाव देता है। ‘उन पर ... सौंपना’ आधुनिक हिन्दी में भरोसा रखने का संकेत भी बनाए रखता है।
- source_word: διὰ τὸ αὐτὸν γινώσκειν
  choice: क्योंकि वह ... जानता था
  rationale: διά के साथ सन्धिवाचक क्रियारूप कारण व्यक्त करता है; हिन्दी में इसे स्वाभाविक कारणवाचक उपवाक्य बनाया गया है।
- source_word: πάντας
  choice: सब लोगों को
  rationale: पुल्लिंग बहुवचन यहाँ सामान्य रूप से मनुष्यों की ओर संकेत करता है; ‘सब लोगों’ से इसका व्यापक मानवीय संदर्भ स्पष्ट रहता है।
theological_decisions:
- issue: पद 23–24 में πιστεύω की पुनरावृत्ति
  choice: मुख्य पाठ में प्रसंगानुकूल ‘सौंपता था’ और पादटिप्पणी में ‘विश्वास’ से शब्द-संबंध स्पष्ट करना
  alternative: दोनों पदों में एक ही हिन्दी क्रिया का कृत्रिम रूप से प्रयोग करना
  rationale: यूनानी में जानबूझकर एक ही क्रिया प्रयुक्त है, पर हिन्दी में ‘विश्वास करना’ के साथ ‘अपने आपको’ का प्रयोग इस अर्थ में स्वाभाविक नहीं है। चुना हुआ रूप अर्थ को स्पष्ट रखता और पादटिप्पणी शब्दालंकार को सुरक्षित करती है।
- issue: πάντας का विस्तार
  choice: सब लोगों को
  alternative: सबको; सभी पुरुषों को
  rationale: पाठ यीशु के ज्ञान को किसी संकुचित समूह तक सीमित नहीं करता। ‘सब लोगों’ में व्यापकता और मनुष्यों का आशय दोनों स्पष्ट हैं, बिना पद से आगे कोई धर्मवैज्ञानिक निष्कर्ष जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘अपने आपको’ सामान्य पाठक के लिए स्वाभाविक है; ‘नहीं सौंपता था’ यूनानी अपूर्ण काल के निरंतर या प्रवृत्तिगत भाव को व्यक्त करता है।
