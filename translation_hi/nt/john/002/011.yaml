  yaml_path: translation/nt/john/002/011.yaml
  text: Jesus did this[a], the beginning of his signs, in Cana of Galilee, and revealed his glory, and his disciples believed in him.
translation:
  language: hi
  text: यीशु ने गलील के काना में यह किया—अपने चिह्नों का आरम्भ—और अपनी महिमा प्रकट की; और उसके चेलों ने उस पर विश्वास किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην ἐποίησεν
  choice: यह … किया
  rationale: संकेतवाचक सर्वनाम पहले वर्णित कार्य की ओर लौटता है। ‘यह … किया’ यूनानी की सरलता बनाए रखता है और अनावश्यक रूप से ‘चमत्कार’ नहीं जोड़ता।
- source_word: ἀρχὴν τῶν σημείων
  choice: अपने चिह्नों का … आरम्भ
  rationale: ἀρχή का मूल भाव ‘आरम्भ’ है और यह काना के कार्य को यीशु के चिह्नों की शृंखला का उद्घाटन बताता है। ‘अपने’ प्रसंग से स्पष्ट सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σημείων
  choice: चिह्नों
  rationale: यूहन्ना में σημεῖον केवल सामर्थ्य का अद्भुत काम नहीं, बल्कि यीशु की पहचान प्रकट करने वाला संकेत है; इसलिए ‘चमत्कारों’ की अपेक्षा ‘चिह्नों’ अधिक उपयुक्त है।
- source_word: ἐν Κανὰ τῆς Γαλιλαίας
  choice: गलील के काना में
  rationale: यह भौगोलिक सम्बन्ध को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἐφανέρωσεν
  choice: प्रकट की
  rationale: φανερόω का अर्थ दृश्य या ज्ञात कर देना है। ‘प्रकट की’ महिमा के साथ स्वाभाविक है और प्रकाशन का भाव बनाए रखता है।
- source_word: τὴν δόξαν αὐτοῦ
  choice: अपनी महिमा
  rationale: δόξα के लिए ‘महिमा’ मानक और प्रसंगानुकूल शब्द है; ‘अपनी’ हिन्दी में कर्ता यीशु की ओर स्पष्ट रूप से लौटता है।
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: उस पर विश्वास किया
  rationale: πιστεύω εἰς यीशु की ओर निर्देशित व्यक्तिगत भरोसे को व्यक्त करता है। ‘उस पर विश्वास किया’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके चेले
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और सम्बन्धवाचक पद का अर्थ पूर्णतः रखता है।
theological_decisions:
- issue: यूहन्ना में σημεῖον की शब्दावली
  choice: ‘चिह्न’
  alternative: ‘चमत्कार’
  rationale: ‘चिह्न’ इन कार्यों के प्रकाशनात्मक उद्देश्य को सुरक्षित रखता है—वे यीशु की पहचान और महिमा की ओर संकेत करते हैं—जबकि ‘चमत्कार’ मुख्यतः आश्चर्य या सामर्थ्य पर बल दे सकता है।
- issue: ἀρχὴν τῶν σημείων का बल
  choice: ‘अपने चिह्नों का यह आरम्भ’
  alternative: ‘यह उसके चिह्नों में पहला था’
  rationale: मुख्य पाठ में ‘आरम्भ’ यूनानी ἀρχή के शब्द और आरम्भिकता के भाव के निकट है। ‘पहला’ अर्थ की वैध और अधिक व्याख्यात्मक अभिव्यक्ति है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चिह्न’, ‘महिमा’ और ‘विश्वास’ जैसी यूहन्ना की प्रमुख धर्मवैचारिक शब्दावली को बनाए रखा गया है। अर्धविराम अन्तिम दो उपवाक्यों को स्पष्ट करता है और यूनानी के क्रमागत καί को दूसरे ‘और’ द्वारा सुरक्षित रखता है।
