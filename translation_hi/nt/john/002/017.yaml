  text: ⸀ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι γεγραμμένον ἐστίν· Ὁ ζῆλος τοῦ οἴκου σου καταφάγεταί με.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/017.yaml
  text: His disciples remembered that it is written[a], “Zeal for your house will consume me.”
translation:
  language: hi
  text: उसके चेलों को याद आया कि लिखा है[a], “तेरे घर की धुन मुझे खा जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: भजन 69:9 की कुछ पाठ-परम्पराओं के शब्दों के अनुरूप इसका अनुवाद “मुझे खा गया है” भी हो सकता है; पर यहाँ यूहन्ना के यूनानी पाठ में “मुझे खा जाएगी” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμνήσθησαν
  choice: याद आया
  rationale: यह क्रिया यहाँ किसी लिखित वचन का स्मरण होने को बताती है। आधुनिक हिन्दी में बहुवचन कर्ता ‘चेलों’ के साथ ‘को याद आया’ स्वाभाविक और सीधा है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: नए नियम के सन्दर्भ में μαθητής के लिए यह परिचित, संक्षिप्त और सामान्य हिन्दी शब्द है।
- source_word: γεγραμμένον ἐστίν
  choice: लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का स्थापित सूत्र है और यूनानी पूर्णकाल के वर्तमान परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: ζῆλος
  choice: जोश
  rationale: यह तीव्र लगाव और उत्साह का भाव रखता है। ‘उत्साह’ अपेक्षाकृत हल्का पड़ सकता है, जबकि ‘धुन’ अधिक बोलचाल की और कभी-कभी नकारात्मक है।
- source_word: οἴκου
  choice: घर
  rationale: उद्धृत भजन की शब्दावली को बनाए रखता है; प्रसंग में परमेश्वर का मन्दिर अभिप्रेत है, पर ‘मन्दिर’ करने से मूल रूपक और उद्धरण की भाषा बदल जाती।
- source_word: καταφάγεταί
  choice: खा जाएगा
  rationale: भविष्यकाल और ‘खा डालने/निगल जाने’ की सजीव छवि दोनों को बनाए रखता है। हिन्दी मुहावरे में किसी प्रबल आवेग के व्यक्ति को ‘खा जाने’ का प्रयोग स्वाभाविक है।
- source_word: με
  choice: मुझे
  rationale: भजन के वक्ता को सूचित करने वाला सीधा कर्मवाचक सर्वनाम है, जिसे यूहन्ना के प्रसंग में यीशु पर लागू किया गया है।
theological_decisions:
- issue: भजन के उद्धरण में भविष्यकाल का रूप और यीशु पर उसका प्रयोग
  choice: “मुझे खा जाएगा” के रूप में भविष्यकाल बनाए रखा
  alternative: “मुझे खा गया है”
  rationale: SBLGNT के यूहन्ना-पाठ में καταφάγεταί भविष्यकाल है। इसलिए इसे भजन की अन्य पाठ-परम्पराओं के भूत/पूर्ण भाव से मिलाने के बजाय यूहन्ना की अपनी शब्दावली के अनुसार अनूदित किया गया है।
- issue: οἶκος का मन्दिर-सन्दर्भ
  choice: “घर”
  alternative: “मन्दिर”
  rationale: तात्कालिक प्रसंग मन्दिर का है, फिर भी उद्धरण में ‘घर’ रखना पुराने नियम की अनुगूँज और शब्दगत रूपक को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तेरे’ उद्धरण के भीतर परमेश्वर को सम्बोधित करने वाले एकवचन सर्वनाम को दर्शाता है। ‘जोश’ और ‘खा जाएगा’ मूल उद्धरण की तीव्रता तथा सजीव रूपक को सामान्य पाठक के लिए स्पष्ट रखते हैं।
