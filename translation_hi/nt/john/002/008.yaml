lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी वर्तमान काल यहाँ कथात्मक ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथा-शैली में भूतकाल उपयुक्त है।
- source_word: Ἀντλήσατε
  choice: इसमें से निकालो
  rationale: क्रिया का अर्थ द्रव निकालना है। प्रसंग से पात्रों में भरी सामग्री अभिप्रेत है; ‘इसमें से’ हिन्दी में आवश्यक संबंध स्पष्ट करता है, पर सामग्री को नाम देकर समय से पहले नहीं बताता।
- source_word: νῦν
  choice: अब
  rationale: आज्ञा की तात्कालिकता को सीधे बनाए रखता है।
- source_word: φέρετε
  choice: ले जाओ
  rationale: सेवकों के दृष्टिकोण से निकाली हुई सामग्री को भोज के प्रभारी तक पहुँचाने के लिए यह स्वाभाविक हिन्दी है।
- source_word: ἀρχιτρικλίνῳ
  choice: भोज के प्रबंधक
  rationale: यह शब्द भोज की व्यवस्था के प्रभारी व्यक्ति को दर्शाता है; यह अनुवाद आधुनिक पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: οἱ δὲ ἤνεγκαν
  choice: और वे ले गए
  rationale: δέ यहाँ हल्का संयोजक है, और क्रिया आदेश के अनुसार वस्तु पहुँचाने को बताती है। यूनानी में स्पष्ट कर्म नहीं है, इसलिए हिन्दी में भी अनावश्यक ‘उसे’ जोड़ने से बचा गया है।
