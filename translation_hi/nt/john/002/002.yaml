  text: Jesus also was invited to the wedding[a], along with his disciples.
translation:
  language: hi
  text: यीशु और उनके शिष्यों को भी विवाह में बुलाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλήθη
  choice: बुलाया गया था
  rationale: सामाजिक आयोजन के संदर्भ में καλέω के कर्मवाच्य का स्वाभाविक अर्थ निमंत्रित किया जाना है; सामान्य हिंदी में ‘विवाह में बुलाया गया’ यही अर्थ सहजता से व्यक्त करता है।
- source_word: δὲ καὶ
  choice: भी
  rationale: δέ हल्का संयोजक है और उसके बाद का καὶ पहले पद में बताई गई मरियम के साथ यीशु और उनके शिष्यों के आमंत्रित होने की अतिरिक्त सूचना देता है; हिंदी में ‘भी’ पर्याप्त और स्वाभाविक है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी रूप रखा गया है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उनके शिष्य
  rationale: μαθηταί के लिए ‘शिष्य’ सुसमाचारों के संदर्भ में सीखने वाले और यीशु से संबद्ध समूह—दोनों भाव सुरक्षित रखता है; आदरसूचक हिंदी के अनुरूप αὐτοῦ को ‘उनके’ कहा गया है।
- source_word: εἰς τὸν γάμον
  choice: विवाह में
  rationale: γάμος यहाँ विवाह-समारोह को सूचित करता है। ‘विवाह में’ आधुनिक हिंदी में आयोजन में आमंत्रित होने का स्वाभाविक प्रयोग है और मूल में स्पष्ट न होने के कारण ‘भोज’ नहीं जोड़ता।
