  text: καὶ τοῖς τὰς περιστερὰς πωλοῦσιν εἶπεν· Ἄρατε ταῦτα ἐντεῦθεν, μὴ ποιεῖτε τὸν οἶκον τοῦ πατρός μου οἶκον ἐμπορίου.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/016.yaml
  text: And he said to those selling the doves[a], “Take these things away from here; do not make my Father’s house a house of trade.”
translation:
  language: hi
  text: और कबूतर बेचने वालों से उसने कहा, “इन चीज़ों को यहाँ से ले जाओ। मेरे पिता के घर को व्यापार का घर[a] मत बनाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाज़ार।” यूनानी में अधिक शाब्दिक रूप से “व्यापार का घर” है, जिससे वाक्य में “घर” की पुनरावृत्ति बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιστερὰς
  choice: कबूतर
  rationale: यह शब्द बलिदान के लिए बेचे जानेवाले कपोत-वर्ग के पक्षियों को दर्शाता है। आधुनिक हिन्दी में ‘कबूतर’ इसका सहज और प्रचलित रूप है।
- source_word: πωλοῦσιν
  choice: बेचनेवालों
  rationale: वर्तमान कृदंत उस समूह की चल रही गतिविधि के आधार पर उसकी पहचान कराता है; ‘बेचनेवालों’ से यह भाव संक्षेप और स्वाभाविक रूप में बना रहता है।
- source_word: Ἄρατε ... ἐντεῦθεν
  choice: यहाँ से ले जाओ
  rationale: आज्ञार्थक क्रिया निर्णायक हटाने की माँग करती है, और स्थानवाचक क्रिया-विशेषण ‘यहाँ से’ को व्यक्त करता है। यह हिन्दी में स्वाभाविक और स्पष्ट आदेश है।
- source_word: ταῦτα
  choice: इन्हें
  rationale: नपुंसक बहुवचन संकेतवाचक निकट उपस्थित वस्तुओं अथवा पक्षियों की ओर संकेत करता है। प्रसंग में ‘इन्हें’ सहज है और संदर्भ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: μὴ ποιεῖτε
  choice: मत बनाओ
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। ‘मत बनाओ’ ποιέω का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: οἶκον τοῦ πατρός μου
  choice: मेरे पिता के घर
  rationale: यह रूप एकवचन ‘मेरे’ सहित यीशु के स्पष्ट पुत्र-संबंधी दावे और मंदिर के संकेत, दोनों को बनाए रखता है।
- source_word: οἶκον ἐμπορίου
  choice: व्यापार का घर
  rationale: ἐμπόριον व्यापार अथवा वाणिज्य को दर्शाता है। ‘व्यापार का घर’ यूनानी में οἶκος की पुनरावृत्ति—‘घर ... घर’—को सुरक्षित रखता है, यद्यपि ‘बाज़ार’ अधिक मुहावरेदार विकल्प है।
theological_decisions:
- issue: मंदिर के लिए यीशु का पदबंध ‘मेरे पिता का घर’
  choice: मेरे पिता के घर
  alternative: परमेश्वर के घर / हमारे पिता के घर
  rationale: यूनानी पाठ में πατρός के साथ एकवचन संबंधसूचक μου स्पष्ट है। अनुवाद उस विशिष्ट पुत्र-संबंधी दावे को न तो नरम करता है, न पाठ से आगे बढ़ाकर उसकी व्याख्या करता है।
- issue: ‘घर’ की आलंकारिक पुनरावृत्ति
  choice: घर ... व्यापार का घर
  alternative: घर ... बाज़ार
  rationale: मूल पाठ में οἶκον दो बार आता है और यीशु का विरोध इसी पुनरावृत्ति से तीखा बनता है। मुख्य पाठ में इसे बनाए रखा गया है और अधिक सहज वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष वचन में आदेश की दृढ़ता बनी हुई है; ‘व्यापार का घर’ थोड़ा असामान्य होते हुए भी मूल की जानबूझकर की गई पुनरावृत्ति को सुरक्षित रखता है।
