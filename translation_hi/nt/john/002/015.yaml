id: JHN.2.15
reference: John 2:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ποιήσας φραγέλλιον ἐκ σχοινίων πάντας ἐξέβαλεν ἐκ τοῦ ἱεροῦ τά τε πρόβατα καὶ τοὺς βόας, καὶ τῶν κολλυβιστῶν ἐξέχεεν ⸂τὰ κέρματα⸃ καὶ τὰς τραπέζας ⸀ἀνέστρεψεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/002/015.yaml
  text: And after making a whip out of cords[a], he drove them all out of the temple courts, including both the sheep and the cattle[c][b]; and he poured out the coins of the money changers and overturned the tables.
translation:
  language: hi
  text: और रस्सियों का कोड़ा बनाकर उसने उन सबको मंदिर-परिसर[a] से बाहर निकाल दिया—भेड़ों और बैलों को भी[b]। उसने मुद्रा बदलने वालों के सिक्के उड़ेल दिए और उनकी मेज़ें उलट दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मंदिर’ के लिए आया यूनानी शब्द ἱερόν पूरे मंदिर-परिसर या उसके आँगनों को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
  - marker: b
    text: यूनानी पाठ पहले ‘उन सबको’ कहता है और फिर ‘भेड़ों और बैलों’ का उल्लेख करता है। वह स्पष्ट रूप से यह नहीं कहता कि कोड़ा मनुष्यों पर चलाया गया था।
    reason: alternative_reading
lexical_decisions:
- source_word: ποιήσας
  choice: बनाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है; ‘बनाकर’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: φραγέλλιον ἐκ σχοινίων
  choice: रस्सियों का कोड़ा
  rationale: φραγέλλιον कोड़े जैसे उपकरण को और σχοινίων रस्सियों या डोरियों को दर्शाता है। यह चयन स्पष्ट, सहज और स्रोत के भौतिक चित्र के निकट है।
- source_word: πάντας
  choice: उन सबको
  rationale: पुल्लिंग बहुवचन कर्मकारक का व्यापक बल बनाए रखा गया है, बिना इसके संदर्भ को केवल मनुष्यों या केवल पशुओं तक सीमित किए।
- source_word: ἐξέβαλεν
  choice: बाहर निकाल दिया
  rationale: यहाँ क्रिया बलपूर्वक बाहर करने का भाव रखती है; हिन्दी में ‘बाहर निकाल दिया’ स्वाभाविक है और प्रसंग में उसका प्रबल अर्थ स्पष्ट रहता है।
- source_word: τοῦ ἱεροῦ
  choice: मंदिर-परिसर
  rationale: ἱερόν पूरे मंदिर-क्षेत्र या उसके आँगनों को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
- source_word: τά τε πρόβατα καὶ τοὺς βόας
  choice: भेड़ों और बैलों को भी
  rationale: τε…καί का समावेशी बल ‘भी’ से व्यक्त होता है। βόας के लिए ‘बैलों’ परिचित और प्रसंगानुकूल है।
- source_word: κολλυβιστῶν
  choice: मुद्रा बदलने वालों
  rationale: यह मंदिर में एक प्रकार की मुद्रा को दूसरी मुद्रा में बदलने वालों के लिए प्रचलित अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐξέχεεν τὰ κέρματα
  choice: सिक्के उड़ेल दिए
  rationale: ἐκχέω का मूल चित्र ‘उड़ेलने’ का है; यह चयन सिक्कों को बाहर डाल देने की क्रिया को बनाए रखता है, जबकि ‘बिखेर दिए’ कुछ अधिक व्याख्यात्मक होता।
- source_word: ἀνέστρεψεν
  choice: मेज़ें उलट दीं
  rationale: प्रसंग में क्रिया का अर्थ मेज़ों को पलट देना है; यह आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: मंदिर में यीशु की कार्रवाई का दायरा और कोड़े का प्रयोग
  choice: ‘उन सबको’ के बाद ‘भेड़ों और बैलों को भी’ रखा गया है; यह नहीं कहा गया कि कोड़ा मनुष्यों पर चलाया गया।
  alternative: इसे केवल पशुओं को बाहर निकालना, या मनुष्यों और पशुओं दोनों पर कोड़ा चलाना समझना।
  rationale: यूनानी में πάντας के बाद भेड़ों और बैलों का उल्लेख आता है, पर पाठ स्पष्ट रूप से यह नहीं बताता कि कोड़ा किस पर इस्तेमाल हुआ। अनुवाद इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘मंदिर-परिसर’ ऐतिहासिक स्थान-संदर्भ को स्पष्ट करता है; ‘मुद्रा बदलने वालों’ आधुनिक हिन्दी में अर्थ को बिना अनावश्यक तकनीकीपन के व्यक्त करता है।
