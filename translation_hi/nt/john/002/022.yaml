source:
  edition: SBLGNT
  text: ὅτε οὖν ἠγέρθη ἐκ νεκρῶν, ἐμνήσθησαν οἱ μαθηταὶ αὐτοῦ ὅτι τοῦτο ἔλεγεν, καὶ ἐπίστευσαν τῇ γραφῇ καὶ τῷ λόγῳ ⸀ὃν εἶπεν ὁ Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/022.yaml
  text: So when he was raised from the dead, his disciples remembered that he had been saying this, and they believed the Scripture and the word that Jesus had spoken.
translation:
  language: hi
  text: इसलिए जब वह मरे हुओं में से जिलाया गया[a], तब उसके शिष्यों को स्मरण हुआ कि वह यह कहता रहा था[b], और उन्होंने पवित्र शास्त्र पर और उस वचन[c] पर विश्वास किया जो यीशु ने कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मरे हुओं में से जी उठा।” यूनानी क्रिया कर्मवाच्य है—“जिलाया गया”—जिसे मुख्य पाठ में बनाए रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने यह कहा था।” यूनानी अपूर्ण भूतकाल जारी या बार-बार कही गई पूर्ववर्ती बात का संकेत दे सकता है, पर संदर्भ में साधारण भूतकाल भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: “वचन” का अनुवाद “कथन” भी किया जा सकता है। यहाँ यूनानी शब्द किसी कही हुई बात, कथन या संदेश को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: इसलिए जब
  rationale: ὅτε के कालसूचक अर्थ और οὖν की निष्कर्षात्मक/कथात्मक संयोजक शक्ति—दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἠγέρθη
  choice: जिलाया गया
  rationale: पुनरुत्थान के संदर्भ में ἐγείρω के कर्मवाच्य रूप को बनाए रखता है; हिन्दी में ‘उठाया गया’ की अपेक्षा ‘जिलाया गया’ मृत्यु से जीवन में लाए जाने का अर्थ अधिक स्पष्ट करता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यूनानी बहुवचन और ‘उनके बीच से’ निकलने की अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἐμνήσθησαν
  choice: याद आया
  rationale: शिष्यों के स्मरण में उस पूर्व कथन के आने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὅτι τοῦτο ἔλεγεν
  choice: कि वह यह कहता रहा था
  rationale: ἔλεγεν के अपूर्ण भूतकाल की जारी या प्रसंगगत पूर्ववर्ती वाणी की संभावना को बनाए रखता है, यद्यपि संदर्भ में साधारण ‘कहा था’ भी संभव है।
- source_word: ἐπίστευσαν τῇ γραφῇ
  choice: पवित्र शास्त्र पर विश्वास किया
  rationale: πιστεύω के दातृकारक कर्म को स्वाभाविक हिन्दी में ‘पर विश्वास किया’ से व्यक्त करता है और γραφή के एकवचन को बनाए रखता है।
- source_word: τῷ λόγῳ
  choice: उस वचन पर
  rationale: λόγος यहाँ यीशु के अभी उल्लिखित कथन को सूचित करता है; ‘वचन’ यूहन्ना की शब्दावली से संबंध बनाए रखते हुए हिन्दी में परिचित है।
- source_word: ὃν εἶπεν ὁ Ἰησοῦς
  choice: जो यीशु ने कहा था
  rationale: संबंधवाचक उपवाक्य को स्पष्ट रूप से ‘वचन’ से जोड़ता और कथानक की पूर्वकालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पुनरुत्थान-क्रिया का कर्मवाच्य रूप
  choice: वह ... जिलाया गया
  alternative: वह मरे हुओं में से जी उठा
  rationale: यूनानी ἠγέρθη कर्मवाच्य है। मुख्य पाठ में इसे बनाए रखने से कर्ता को पाठ में जोड़े बिना मूल व्याकरण सुरक्षित रहता है।
- issue: πιστεύω के दातृकारक कर्मों का अनुवाद
  choice: पवित्र शास्त्र पर और उस वचन पर विश्वास किया
  alternative: पवित्र शास्त्र और उस वचन को सत्य माना
  rationale: ‘विश्वास किया’ मूल क्रिया का सीधा और न्यूनतम व्याख्यात्मक अनुवाद है; यह विश्वास की प्रकृति को अनावश्यक रूप से सीमित नहीं करता।
- issue: ἔλεγεν के अपूर्ण भूतकाल की शक्ति
  choice: कहता रहा था
  alternative: कहा था
  rationale: मुख्य पाठ अपूर्ण भूतकाल की जारी या पुनरावृत्त वाणी की संभावित छाया को रखता है, जबकि पादटिप्पणी प्रसंगानुसार सरल भूतकाल की संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘पवित्र शास्त्र’ एकवचन γραφή को स्पष्ट करता है; ‘वचन’ यूहन्ना की भाषा से संबंध बनाए रखता है। सभी पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
