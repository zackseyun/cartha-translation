lexical_decisions:
- source_word: ἐγγὺς
  choice: निकट था
  rationale: यहाँ यह क्रिया-विशेषण समय की निकटता बताता है। ‘निकट था’ सरल और स्वाभाविक हिन्दी है।
- source_word: πάσχα
  choice: फसह पर्व
  rationale: यह यहूदी फसह के त्योहार का मानक हिन्दी नाम है; ‘पर्व’ जोड़ने से सामान्य पाठक के लिए आशय स्पष्ट होता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों का
  rationale: इस प्रसंग में पदबंध फसह को यहूदी पर्व के रूप में पहचानता है। यूहन्ना में Ἰουδαῖοι कभी-कभी ‘यहूदिया के लोग’ भी हो सकता है, इसलिए वह विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἀνέβη
  choice: गए
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘ऊपर गए’ है और यरूशलेम की यात्रा के लिए यह प्रचलित तीर्थयात्रा-भाषा है। हिन्दी में ‘यरूशलेम को चढ़ गए’ अस्वाभाविक और भ्रामक हो सकता है, इसलिए मुख्य पाठ में स्वाभाविक ‘गए’ रखा गया है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: नगर के नाम का मानक हिन्दी रूप।
- source_word: Καὶ
  choice: और
  rationale: दूसरा καί दोनों उपवाक्यों को जोड़ता है। आरम्भिक καί को हिन्दी में अलग शब्द देकर व्यक्त करना आवश्यक नहीं, क्योंकि वाक्य-संदर्भ में कथात्मक क्रम स्वाभाविक रूप से स्पष्ट है।
