- issue: यूहन्ना में Ἰουδαῖοι का अनुवाद
  choice: यहूदियों का
  alternative: यहूदिया के लोगों का
  rationale: यहाँ बात किसी संकुचित क्षेत्रीय या विरोधी समूह की नहीं, बल्कि फसह को यहूदी पर्व के रूप में पहचानने की है। फिर भी यूहन्ना में इस शब्द की प्रसंगानुसार क्षेत्रीय सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
