  naturalness: वाक्य आधुनिक मानक हिन्दी में सहज, स्पष्ट और गरिमापूर्ण है। ‘वही करना’ निर्देशात्मक शैली में स्वाभाविक है तथा पूर्ववर्ती ‘जो कुछ’ को स्पष्टता से ग्रहण करता है।
  terminology: ‘माँ’ और ‘सेवकों’ दोनों प्रसंगानुकूल, सामान्य आधुनिक शब्द हैं। ‘सेवकों’ का चयन उचित है; इसे ‘डीकनों’ कहना ऐतिहासिक-संदर्भगत रूप से भ्रामक होता।
