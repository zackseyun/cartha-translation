  text: λέγει ἡ μήτηρ αὐτοῦ τοῖς διακόνοις· ⸂Ὅ τι⸃ ἂν λέγῃ ὑμῖν ποιήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/005.yaml
  text: His mother said to the servants[a], “Whatever he tells you, do it.”
translation:
  language: hi
  text: उसकी माँ ने सेवकों से कहा, “वह तुमसे जो कुछ कहे, वही करना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μήτηρ αὐτοῦ
  choice: उसकी माँ
  rationale: सम्बन्धवाचक यूनानी रचना का स्वाभाविक हिन्दी रूप; प्रसंग में ‘उसकी’ का संकेत यीशु की ओर स्पष्ट है।
- source_word: διακόνοις
  choice: सेवकों
  rationale: विवाह-भोज के प्रसंग में यह शब्द सेवा करने वालों को दर्शाता है, कलीसियाई पद ‘डीकन’ को नहीं। ‘सेवक’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: Ὅ τι ἂν
  choice: जो कुछ
  rationale: अनिश्चित सम्बन्धवाचक रचना की खुली व्यापकता और सम्भाव्यता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λέγῃ ὑμῖν
  choice: वह तुमसे ... कहे
  rationale: ἄν के साथ वर्तमान संभावनार्थक रूप अनिश्चित भावी कथन को दर्शाता है; ‘कहे’ हिन्दी में इस सम्भाव्यता को सहज रूप से बनाए रखता है।
- source_word: ποιήσατε
  choice: वही करना
  rationale: बहुवचन आज्ञार्थक क्रिया निर्णायक पालन का आह्वान करती है। ‘वही’ पहले आए ‘जो कुछ’ को स्पष्ट रूप से ग्रहण करता है, और ‘करना’ प्रत्यक्ष निर्देश के रूप में स्वाभाविक हिन्दी है।
theological_decisions:
- issue: λέγῃ का अप्रकट कर्ता
  choice: ‘वह’ रखा गया है, जो प्रसंग में यीशु की ओर संकेत करता है।
  alternative: ‘यीशु तुमसे जो कुछ कहे’
  rationale: यूनानी में कर्ता अप्रकट है, यद्यपि प्रसंग उसका संकेत स्पष्ट करता है। ‘वह’ मूल की संक्षिप्तता बनाए रखता और अनावश्यक व्याख्यात्मक विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक निर्देश के अनुरूप स्वाभाविक शैली। ‘तुमसे’ बहुवचन सेवकों को सम्बोधित करता है; ‘वही करना’ आदेश की स्पष्टता और बल बनाए रखता है।
