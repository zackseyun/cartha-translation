  text: Jesus said to them[a], “Fill the water jars with water.” And they filled them to the brim.
translation:
  language: hi
  text: यीशु ने उनसे कहा, “पानी के मटकों को पानी से भर दो।” और उन्होंने उन्हें एकदम ऊपर तक भर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान काल है, पर आधुनिक हिन्दी की स्वाभाविक कथा-शैली में भूतकाल अधिक सहज है।
- source_word: Γεμίσατε
  choice: भर दो
  rationale: बहुवचन आज्ञार्थक क्रिया को आधुनिक, सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑδρίας
  choice: पानी के मटकों
  rationale: ὑδρία पानी रखने के बड़े पात्र को दर्शाता है; प्रसंग में ‘मटके’ साधारण हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक है। इस पद में ‘पत्थर के’ शब्द नहीं जोड़े गए हैं।
- source_word: ὕδατος
  choice: पानी से
  rationale: यह उस पदार्थ को बताता है जिससे मटके भरे जाने थे; ‘पानी से भर दो’ हिन्दी का स्वाभाविक प्रयोग है।
- source_word: ἕως ἄνω
  choice: एकदम ऊपर तक
  rationale: यह पात्रों के पूरी तरह ऊपर तक भरे जाने को स्पष्ट करता है और किसी खास आकार के ‘किनारे’ या ‘मुँह’ का अनावश्यक अनुमान नहीं लगाता।
