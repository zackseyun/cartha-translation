  text: ὡς δὲ ἐγεύσατο ὁ ἀρχιτρίκλινος τὸ ὕδωρ οἶνον γεγενημένον, καὶ οὐκ ᾔδει πόθεν ἐστίν, οἱ δὲ διάκονοι ᾔδεισαν οἱ ἠντληκότες τὸ ὕδωρ, φωνεῖ τὸν νυμφίον ὁ ἀρχιτρίκλινος
base_translation:
  language: en
  yaml_path: translation/nt/john/002/009.yaml
  text: When the master of the feast tasted the water that had become wine[a], and did not know where it came from (though the servants who had drawn the water knew)[c][b], the master of the feast calls the bridegroom
translation:
  language: hi
  text: जब भोज के प्रबंधक[a] ने उस पानी को चखा जो दाखरस बन चुका था[b]—और वह नहीं जानता था कि वह कहाँ से आया था, हालाँकि पानी निकालने वाले सेवक जानते थे—तो भोज का प्रबंधक दूल्हे को बुलाता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोज का प्रधान सेवक।’ यूनानी शब्द भोज की व्यवस्था की देखरेख करने वाले व्यक्ति के लिए है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘दाखरस बन चुका पानी’; या ‘वह पानी जो दाखरस में बदल गया था।’
    reason: lexical_alternative
  - marker: c
    text: यूनानी में यहाँ ऐतिहासिक वर्तमान काल, ‘बुलाता है,’ प्रयुक्त हुआ है; हिन्दी में इसे ‘बुलाया’ भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιτρίκλινος
  choice: भोज का प्रबंधक
  rationale: यह शब्द भोज की व्यवस्था की देखरेख करने वाले व्यक्ति को दर्शाता है। ‘भोज का प्रबंधक’ आधुनिक हिन्दी में उसकी भूमिका को स्पष्ट करता है और उसे केवल प्रधान सेवक तक सीमित नहीं करता।
- source_word: ἐγεύσατο
  choice: चखा
  rationale: यहाँ क्रिया का सीधा अर्थ किसी वस्तु का स्वाद लेना या उसे चखना है।
- source_word: τὸ ὕδωρ οἶνον γεγενημένον
  choice: उस पानी को … जो दाखरस बन चुका था
  rationale: पूर्ण कृदन्त पूर्ण हो चुके परिवर्तन और उसके विद्यमान परिणाम को व्यक्त करता है; ‘बन चुका था’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἶνον
  choice: दाखरस
  rationale: यह यूनानी शब्द अंगूर से बने मदिरा-पेय को दर्शाता है। ‘दाखरस’ हिन्दी बाइबलीय भाषा में परिचित है और ‘रस’ मात्र कहने से उत्पन्न अस्पष्टता से बचाता है।
- source_word: οὐκ ᾔδει πόθεν ἐστίν
  choice: वह नहीं जानता था कि वह कहाँ से आया है
  rationale: πόθεν स्रोत या उद्गम पूछता है; यह वाक्यांश आधुनिक हिन्दी में उसी भाव को सहजता से व्यक्त करता है।
- source_word: διάκονοι
  choice: सेवक
  rationale: इस विवाह-भोज के प्रसंग में यह घरेलू अथवा भोज-सेवकों को दर्शाता है, कलीसियाई पद को नहीं।
- source_word: ἠντληκότες
  choice: पानी निकालने वाले
  rationale: क्रिया पानी खींचने या निकालने को दर्शाती है। स्रोत यह नहीं बताता कि वे उसे कहाँ से निकाल रहे थे, इसलिए अनावश्यक विवरण नहीं जोड़ा गया।
- source_word: φωνεῖ
  choice: बुलाता है
  rationale: यूनानी में ऐतिहासिक वर्तमान है। वर्तमानकालीन हिन्दी रूप कथन की वही जीवंतता सुरक्षित रखता है।
- source_word: νυμφίον
  choice: दूल्हे
  rationale: विवाह के प्रसंग में यह आधुनिक, स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ὡς δὲ
  choice: जब … तो
  rationale: δὲ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है, प्रबल विरोध नहीं। हिन्दी की ‘जब … तो’ रचना घटना-क्रम को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: चमत्कार में पानी के दाखरस बनने का वर्णन
  choice: ‘पानी … जो दाखरस बन चुका था’ के रूप में वास्तविक परिवर्तन को सीधे व्यक्त किया गया है।
  alternative: ‘पानी जो दाखरस जैसा लगा’ अथवा अधिक मुहावरेदार ‘पानी जो दाखरस में बदल गया था।’
  rationale: यूनानी पाठ स्पष्ट रूप से कहता है कि पानी दाखरस बन चुका था। अनुवाद को न इस कथन को केवल आभास बनाकर कमजोर करना चाहिए, न इसमें अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़नी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। कोष्ठकों के बजाय दीर्घ विराम-चिह्नों से बीच की व्याख्यात्मक सूचना स्पष्ट की गई है। ‘बुलाता है’ कुछ असामान्य लग सकता है, पर यह मूल यूनानी के ऐतिहासिक वर्तमान को जानबूझकर सुरक्षित रखता है; पादटिप्पणी सामान्य भूतकालीन विकल्प बताती है।
