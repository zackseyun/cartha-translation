  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτοῖς· Λύσατε τὸν ναὸν τοῦτον καὶ ἐν τρισὶν ἡμέραις ἐγερῶ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/019.yaml
  text: Jesus answered and said to them[a], “Destroy this temple, and in three days I will raise it up.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “इस मंदिर को ढा दो, और मैं इसे तीन दिन में खड़ा कर दूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस मंदिर को गिरा दो … मैं इसे फिर से बना दूँगा।” ‘खड़ा कर दूँगा’ के लिए प्रयुक्त यूनानी क्रिया के संदर्भ में पुनरुत्थान की अंतर्ध्वनि भी है; यूहन्ना आगे स्पष्ट करता है कि यीशु अपनी देह के मंदिर की बात कर रहे थे (2:21)।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी का यह प्रचलित कथात्मक मुहावरा हिन्दी में स्वाभाविक रूप से ‘उत्तर दिया’ कहा जाता है; दोनों क्रियाओं को यांत्रिक रूप से दोहराना अनावश्यक होगा।
- source_word: Λύσατε
  choice: ढा दो
  rationale: यहाँ λύω का अर्थ मन्दिर को गिराना या ध्वस्त करना है। ‘ढा दो’ आज की हिन्दी में स्वाभाविक है और निर्माण-संबंधी बिंब बनाए रखता है।
- source_word: τὸν ναὸν τοῦτον
  choice: इस मन्दिर को
  rationale: ναός यहाँ मन्दिर/पवित्रस्थान को सूचित करता है। ‘इस मन्दिर’ कथन की जानबूझकर रखी गई अस्पष्टता को बनाए रखता है, जिसकी व्याख्या 2:21 में होती है।
- source_word: ἐν τρισὶν ἡμέραις
  choice: तीन दिन में
  rationale: यह यूनानी कालवाचक पदबंध का सटीक और स्वाभाविक हिन्दी रूप है; यह अवधि की सीमा को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: ἐγερῶ αὐτόν
  choice: मैं इसे … फिर खड़ा कर दूँगा
  rationale: ἐγείρω का मूल भाव उठाने या खड़ा करने का है। ‘फिर खड़ा कर दूँगा’ मन्दिर के बिंब में स्वाभाविक रहते हुए पुनरुत्थान की अंतर्ध्वनि को पूरी तरह ‘फिर बनाऊँगा’ तक सीमित नहीं करता।
theological_decisions:
- issue: क्या ‘मन्दिर’ को मुख्य पाठ में स्पष्ट रूप से यीशु की देह बताया जाए
  choice: मुख्य पाठ में केवल ‘इस मन्दिर’ रखा गया।
  alternative: ‘मेरी देह के इस मन्दिर’ या ‘इस मन्दिर अर्थात मेरी देह’
  rationale: यीशु का कथन इस पद में जानबूझकर रहस्यमय है और यूहन्ना 2:21 में उसका अर्थ समझाया जाता है। पहले ही अर्थ खोल देना कथात्मक और धर्मवैज्ञानिक तनाव को मिटा देता।
- issue: ἐγερῶ को स्थापत्य भाषा या पुनरुत्थान-संकेत वाली भाषा में व्यक्त करना
  choice: ‘फिर खड़ा कर दूँगा’
  alternative: ‘फिर बना दूँगा’ या ‘उठा दूँगा’
  rationale: ‘फिर बना दूँगा’ अर्थ को केवल पुनर्निर्माण तक सीमित कर सकता है, जबकि ‘उठा दूँगा’ हिन्दी में मन्दिर के साथ अस्वाभाविक है। चुना हुआ रूप दोनों संदर्भों के बीच की शब्द-क्रीड़ा और अंतर्ध्वनि को यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मन्दिर’ सामान्य पाठक के लिए स्वाभाविक है; ‘ढा दो’ विध्वंस का स्पष्ट किंतु अत्यधिक तकनीकी न होने वाला रूप है। मुख्य पाठ की अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
