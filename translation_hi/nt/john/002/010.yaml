source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Πᾶς ἄνθρωπος πρῶτον τὸν καλὸν οἶνον τίθησιν, καὶ ὅταν ⸀μεθυσθῶσιν τὸν ἐλάσσω· σὺ τετήρηκας τὸν καλὸν οἶνον ἕως ἄρτι.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/010.yaml
  text: And he said to him[a], “Everyone sets out the good wine first, and when they have become drunk, then the inferior[b]. But you have kept the good wine until now.”
translation:
  language: hi
  text: और उसने उससे कहा, “हर कोई[a] पहले अच्छा दाखरस परोसता है, और जब वे नशे में हो जाते हैं[b], तब घटिया दाखरस; पर तुमने अच्छा दाखरस अब तक रख रखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘हर मनुष्य’ है; यह सामान्य कथन सभी लोगों के विषय में है, केवल पुरुषों के विषय में नहीं।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद ‘जब वे मतवाले हो जाते हैं’ भी किया जा सकता है। यूनानी क्रिया सामान्यतः नशे में या मतवाले हो जाने का अर्थ देती है; कुछ अनुवाद इसे नरम करके ‘जब वे जी भरकर पी लेते हैं’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: उसने उससे कहा
  rationale: यूनानी वर्तमान काल यहाँ ऐतिहासिक वर्तमान है; हिन्दी कथा-शैली में भूतकाल स्वाभाविक है। सर्वनामों का संदर्भ पिछले पद से स्पष्ट रहता है।
- source_word: Πᾶς ἄνθρωπος
  choice: हर कोई
  rationale: एकवचन पदबंध सामान्य रूप से सभी लोगों की प्रथा बताता है, केवल पुरुषों की नहीं। ‘हर कोई’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: τὸν καλὸν οἶνον
  choice: अच्छा दाखरस
  rationale: καλός यहाँ गुणवत्ता का बोध कराता है। ‘अच्छा दाखरस’ आगे आने वाले घटिया दाखरस के साथ सीधा विरोध बनाए रखता है।
- source_word: τίθησιν
  choice: परोसता है
  rationale: τίθημι का मूल अर्थ ‘रखना’ है, पर भोज के प्रसंग में इसका आशय अतिथियों के सामने दाखरस प्रस्तुत करना है; हिन्दी में ‘परोसता है’ सर्वाधिक स्वाभाविक है।
- source_word: ὅταν μεθυσθῶσιν
  choice: जब लोग मतवाले हो जाते हैं
  rationale: μεθύω का सामान्य अर्थ नशे में आना है। ‘मतवाले हो जाते हैं’ इसे शिष्ट किंतु स्पष्ट आधुनिक हिन्दी में व्यक्त करता है और कथन को केवल ‘भरपेट पी लेने’ तक नरम नहीं करता।
- source_word: τὸν ἐλάσσω
  choice: घटिया दाखरस
  rationale: ἐλάσσων यहाँ पहले दाखरस की तुलना में निम्न गुणवत्ता बताता है। हिन्दी में संज्ञा दोबारा देना अस्पष्टता से बचाता है और वाक्य को स्वाभाविक रखता है।
- source_word: τετήρηκας
  choice: रख छोड़ा है
  rationale: यूनानी पूर्ण काल अतीत में सुरक्षित रखने और वर्तमान तक उसके परिणाम को दर्शाता है। ‘रख छोड़ा है’ इस वर्तमान परिणाम को सहज हिन्दी में बनाए रखता है।
- source_word: ἕως ἄρτι
  choice: अब तक
  rationale: यह पदबंध कथा के वर्तमान क्षण तक की अवधि बताता है; ‘अब तक’ संक्षिप्त और सटीक है।
theological_decisions:
- issue: दाखरस के चमत्कार के प्रसंग में μεθυσθῶσιν का अर्थ
  choice: जब लोग मतवाले हो जाते हैं
  alternative: जब लोग जी भरकर पी लेते हैं
  rationale: यूनानी क्रिया सामान्यतः नशे में आने को स्पष्ट रूप से व्यक्त करती है। वक्ता की सामाजिक टिप्पणी को मदहोशी की नैतिक स्वीकृति बनाए बिना ज्यों का त्यों रखना चाहिए; वैचारिक कारणों से अर्थ को नरम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखरस’ बाइबलीय प्रसंग में प्रचलित और स्पष्ट है। ‘मतवाले’ मूल के स्पष्ट अर्थ को बनाए रखते हुए अनावश्यक रूप से कठोर या बोलचाल का नहीं लगता। footnote markers को उनके वास्तविक विषय—‘हर कोई’ और ‘मतवाले’—के ठीक बाद रखा गया है।
