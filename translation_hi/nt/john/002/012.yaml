  text: Μετὰ τοῦτο κατέβη εἰς Καφαρναοὺμ αὐτὸς καὶ ἡ μήτηρ αὐτοῦ καὶ οἱ ⸀ἀδελφοὶ καὶ οἱ μαθηταὶ αὐτοῦ, καὶ ἐκεῖ ἔμειναν οὐ πολλὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/002/012.yaml
  text: After this he went down to Capernaum[a], he and his mother and his brothers and his disciples, and they stayed there not many days.
translation:
  language: hi
  text: इसके बाद वह अपनी माता, अपने भाइयों[a] और अपने चेलों के साथ कफरनहूम उतर गया, और वे वहाँ बहुत दिन नहीं ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रिश्तेदारों” अथवा “निकट संबंधियों”; यूनानी शब्द संकीर्ण अर्थ में भाइयों के लिए, या कुछ संदर्भों में व्यापक पारिवारिक संबंध के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: इसके बाद
  rationale: यह स्वाभाविक आधुनिक हिन्दी में समय-संबंधी परिवर्तन व्यक्त करता है और एकवचन संकेतवाचक भाव को बनाए रखता है।
- source_word: κατέβη
  choice: उतर गया
  rationale: यह काना से कफरनहूम की भौगोलिक यात्रा के नीचे की ओर होने का भाव सुरक्षित रखता है।
- source_word: εἰς Καφαρναοὺμ
  choice: कफरनहूम को
  rationale: नगर को गंतव्य के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है और नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: ἡ μήτηρ αὐτοῦ
  choice: अपनी माता
  rationale: यूनानी पाठ केवल उसकी माता कहता है; मरियम नाम जोड़ना पाठ से बाहर की सूचना होती। कर्ता के साथ संबंध स्पष्ट करने के लिए हिन्दी में ‘अपनी’ स्वाभाविक है।
- source_word: οἱ ἀδελφοὶ
  choice: अपने भाइयों
  rationale: पुल्लिंग बहुवचन ἀδελφοί का इस प्रसंग में सबसे सीधा अर्थ ‘भाई’ है; व्यापक पारिवारिक अर्थ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: अपने चेलों
  rationale: ‘चेले’ आधुनिक हिन्दी बाइबलीय प्रयोग में μαθηταί का सुबोध और स्थापित रूप है, जिसमें सीखने और अनुसरण करने दोनों का भाव है।
- source_word: ἐκεῖ ἔμειναν
  choice: वे वहाँ ... ठहरे
  rationale: बहुवचन क्रिया पूरे साथ गए समूह की ओर संकेत करती है; ‘ठहरे’ अस्थायी निवास के लिए स्वाभाविक हिन्दी है।
- source_word: οὐ πολλὰς ἡμέρας
  choice: बहुत दिन नहीं
  rationale: यह यूनानी की नकारात्मक अभिव्यक्ति को ‘केवल कुछ दिन’ जैसे अधिक व्याख्यात्मक रूप में बदले बिना निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के परिवार के संबंध में ἀδελφοί का आशय
  choice: मुख्य पाठ में ‘भाइयों’
  alternative: ‘रिश्तेदारों’ या ‘कुटुम्बियों’
  rationale: यूनानी शब्द का सबसे सीधा और व्याकरणानुकूल अर्थ ‘भाई’ है, पर कुछ संदर्भों में यह व्यापक पारिवारिक संबंध भी व्यक्त कर सकता है। मुख्य पाठ किसी बाद की मत-संबंधी बहस का निर्णय नहीं करता; वैकल्पिक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उतर गया’ स्थलाकृतिक दिशा को, और ‘बहुत दिन नहीं ठहरे’ मूल की संयत नकारात्मक अभिव्यक्ति को सुरक्षित रखते हैं।
