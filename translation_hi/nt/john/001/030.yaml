base_translation:
  language: en
  yaml_path: translation/nt/john/001/030.yaml
  text: This is he of whom I said[a], ‘After me comes a man who ranks before me[b], because he was before me.’
translation:
  language: hi
  text: यह वही है जिसके विषय में मैंने कहा था, ‘मेरे बाद एक मनुष्य आता है जो मुझसे आगे हो गया है,[a] क्योंकि वह मुझसे पहले था।’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने मुझ पर प्रधानता पा ली है।” यूनानी पद केवल समयक्रम ही नहीं, अग्रता या ऊँचे स्थान का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह मुझसे पहले से अस्तित्व में था।” ये शब्द संभवतः यीशु के पूर्व-अस्तित्व की ओर संकेत करते हैं, यद्यपि यूनानी में अधिक संक्षेप से “वह मुझसे पहले था” कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτός ἐστιν
  choice: यह वही है
  rationale: संकेतवाचक सर्वनाम और योजक क्रिया की बलयुक्त पहचान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ οὗ ἐγὼ εἶπον
  choice: जिसके विषय में मैंने कहा था
  rationale: εἶπον के साथ ὑπέρ यहाँ किसी के विषय में कहने का भाव देता है; ‘कहा था’ पूर्व कथन की ओर संकेत को सहज बनाता है।
- source_word: Ὀπίσω μου ἔρχεται
  choice: मेरे बाद ... आता है
  rationale: ὀπίσω μου को यहाँ स्थान की अपेक्षा क्रम अथवा समय के अर्थ में समझना अधिक उपयुक्त है।
- source_word: ἀνὴρ
  choice: एक पुरुष
  rationale: यूनानी शब्द स्पष्ट रूप से वयस्क पुरुष को सूचित करता है; ‘पुरुष’ लिंग-सटीक और गरिमापूर्ण है।
- source_word: ἔμπροσθέν μου γέγονεν
  choice: मुझसे आगे हो गया है
  rationale: पूर्णकाल γέγονεν से उत्पन्न वर्तमान अवस्था और ἔμπροσθεν के अग्रता-भाव दोनों बने रहते हैं; वाक्यांश पद, महत्त्व या प्राथमिकता की छाया भी रख सकता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पहले कथन की अग्रता का कारण प्रस्तुत करता है।
- source_word: πρῶτός μου ἦν
  choice: वह मुझसे पहले था
  rationale: यूनानी की संक्षिप्त अभिव्यक्ति को बनाए रखते हुए कालगत पूर्वता तथा संभावित श्रेष्ठता के बीच का तनाव सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में मसीह के पूर्व-अस्तित्व को कितना स्पष्ट किया जाए
  choice: वह मुझसे पहले था
  alternative: वह मुझसे पहले से अस्तित्व में था
  rationale: यूहन्ना के प्रसंग में पूर्व-अस्तित्व का संकेत प्रबल है, पर मूल यूनानी इसे संक्षेप में कहता है। चुना हुआ पाठ उस निहितार्थ को सुरक्षित रखता है, उसे व्याख्यात्मक विस्तार से अनिवार्य नहीं बनाता।
- issue: ἔμπροσθέν μου γέγονεν में अग्रता का स्वरूप
  choice: मुझसे आगे हो गया है
  alternative: उसने मुझ पर प्रधानता पा ली है
  rationale: चुना हुआ रूप अग्रता को व्यक्त करता है पर उसे केवल पदगत श्रेष्ठता तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए स्पष्ट, किंतु साक्ष्यात्मक कथन की गरिमा और मूल की धार्मिक अर्थ-समृद्धि सुरक्षित रखी गई है। उद्धरण के भीतर स्वाभाविक हिन्दी क्रम अपनाया गया है।
