  yaml_path: translation/nt/john/001/008.yaml
  text: He was not the light[a], but came to bear witness about the light.
translation:
  language: hi
  text: वह स्वयं ज्योति नहीं था, बल्कि ज्योति के विषय में गवाही देने आया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἦν ἐκεῖνος
  choice: वह स्वयं ... नहीं था
  rationale: नकारयुक्त अपूर्ण भूतकाल को स्वाभाविक हिन्दी भूतकाल में रखा गया है। ἐκεῖνος के बल को ‘स्वयं’ व्यक्त करता है और यूहन्ना तथा ज्योति के बीच भेद स्पष्ट रखता है।
- source_word: τὸ φῶς
  choice: ज्योति
  rationale: प्रस्तावना में पहले से परिचित विशिष्ट प्रकाश के लिए पारंपरिक, गरिमापूर्ण और प्रसंगानुकूल शब्द; हिन्दी में भाववाचक संज्ञा के साथ निश्चित उपपद आवश्यक नहीं है।
- source_word: ἀλλ’ ἵνα
  choice: बल्कि ... देने आया था
  rationale: यूनानी में ἀλλά के बाद मुख्य क्रिया संदर्भ से समझी जाती है। पिछले पद में यूहन्ना के आने और उद्देश्य को देखते हुए ‘आया था’ स्वाभाविक रूप से उस लोप की पूर्ति करता है।
- source_word: μαρτυρήσῃ
  choice: गवाही देने
  rationale: μαρτυρέω के साक्ष्य और गवाही संबंधी अर्थ को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: περὶ τοῦ φωτός
  choice: ज्योति के विषय में
  rationale: περί और संबंधकारक का सीधा, स्पष्ट तथा गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: यूहन्ना की पहचान और ज्योति के संबंध में उसकी भूमिका
  choice: पद यूहन्ना के स्वयं ज्योति होने का निषेध करता और ज्योति के विषय में गवाही देना उसका उद्देश्य बताता है।
  alternative: 'अधिक शाब्दिक रूप: ‘वह ज्योति नहीं था, बल्कि इसलिए कि ज्योति के विषय में गवाही दे।’'
  rationale: अनुवाद गवाह और ज्योति के बीच मूल पाठ का भेद बनाए रखता है। ‘आया था’ संदर्भगत क्रिया-लोप की स्वाभाविक पूर्ति है, कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। ‘ज्योति’ यूहन्ना की प्रस्तावना की रूपकात्मक और धर्मवैज्ञानिक भाषा को बनाए रखती है, जबकि ‘गवाही देना’ सामान्य पाठक के लिए स्पष्ट है।
