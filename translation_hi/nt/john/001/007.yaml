source:
  edition: SBLGNT
  text: οὗτος ἦλθεν εἰς μαρτυρίαν, ἵνα μαρτυρήσῃ περὶ τοῦ φωτός, ἵνα πάντες πιστεύσωσιν δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/007.yaml
  text: He came as a witness[a], so that he might testify about the Light[b], so that all might believe through him.
translation:
  language: hi
  text: वह गवाही देने आया, ताकि वह ज्योति के विषय में गवाही दे, ताकि उसके द्वारा सब लोग विश्वास करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“उसके द्वारा” का सबसे स्वाभाविक अर्थ है: यूहन्ना की गवाही के द्वारा; कुछ लोग “उसके” को ज्योति की ओर संकेत मानते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτος
  choice: वह
  rationale: यह संकेतवाचक शब्द पिछले पद में आए यूहन्ना की ओर लौटकर संकेत करता है। हिंदी में “वह” इस संदर्भ को स्वाभाविक रूप से व्यक्त करता है; “यह व्यक्ति” अनावश्यक रूप से भारी लगता।
- source_word: εἰς μαρτυρίαν
  choice: गवाही देने
  rationale: शाब्दिक “गवाही के लिए” संभव है, पर उद्देश्य और यूहन्ना की साक्षी-भूमिका को आधुनिक हिंदी में “गवाही देने” अधिक सहजता से व्यक्त करता है।
- source_word: ἵνα μαρτυρήσῃ περὶ τοῦ φωτός
  choice: ताकि ज्योति के विषय में गवाही दे
  rationale: ἵνα के उद्देश्यभाव और μαρτυρέω के साक्ष्य देने वाले अर्थ को बनाए रखा गया है। περί के लिए गरिमापूर्ण और स्पष्ट “के विषय में” चुना गया है।
- source_word: τοῦ φωτός
  choice: ज्योति
  rationale: यहाँ प्रकाश का रूपक यीशु की ओर संकेत करता है। “ज्योति” यूहन्ना के साहित्य की गरिमा और रूपक-संबंध दोनों बनाए रखती है, बिना पाठ में व्याख्यात्मक नाम जोड़े।
- source_word: ἵνα πάντες πιστεύσωσιν
  choice: और उसके द्वारा सब लोग विश्वास करें
  rationale: दूसरे ἵνα-वाक्य का अंतिम उद्देश्य हिंदी में समन्वित ढंग से व्यक्त किया गया है। πάντες को समावेशी “सब लोग” और πιστεύω को प्रचलित धर्मशास्त्रीय “विश्वास करें” से अनूदित किया गया है।
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: διά + संबंधकारक का माध्यम-सूचक अर्थ सुरक्षित है। सर्वनाम की स्रोतगत संदर्भ-अस्पष्टता मुख्य पाठ में बनी रहती है।
theological_decisions:
- issue: δι’ αὐτοῦ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में “उसके द्वारा” रखकर व्याकरणिक अस्पष्टता सुरक्षित रखी गई; संदर्भ में इसका सबसे स्वाभाविक संकेत यूहन्ना की ओर है।
  alternative: कुछ पाठक इसे ज्योति अर्थात मसीह की ओर संकेत मान सकते हैं।
  rationale: पद का कर्ता यूहन्ना है और अगले पद में उसे ज्योति से अलग किया गया है, इसलिए यूहन्ना प्रमुख संदर्भ है। फिर भी यूनानी पुल्लिंग सर्वनाम अपने आप संदर्भ को पूर्णतः स्पष्ट नहीं करता, अतः विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली अपनाई गई है। “गवाही” से पद में μαρτυρία/μαρτυρέω की शब्द-पुनरावृत्ति आंशिक रूप से सुरक्षित है। “ज्योति” को देवनागरी में सामान्य संज्ञा की तरह लिखा गया है, क्योंकि हिंदी में अंग्रेज़ी जैसी शीर्षक-सूचक capitalization उपलब्ध नहीं है।
