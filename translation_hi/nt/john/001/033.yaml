  text: κἀγὼ οὐκ ᾔδειν αὐτόν, ἀλλ’ ὁ πέμψας με βαπτίζειν ἐν ὕδατι ἐκεῖνός μοι εἶπεν· Ἐφ’ ὃν ἂν ἴδῃς τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν, οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/033.yaml
  text: And I did not know him[a], but the one who sent me to baptize in water said to me, ‘The one on whom you see the Spirit descending and remaining on him[c][b], this is he who baptizes in the Holy Spirit.’
translation:
  language: hi
  text: और मैं उसे नहीं जानता था[a], पर जिसने मुझे पानी में[b] बपतिस्मा देने के लिए भेजा, उसी ने मुझसे कहा, “जिस पर तुम पवित्र आत्मा को उतरते और उसी पर ठहरते देखो[c], वही है जो पवित्र आत्मा में बपतिस्मा देता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं उसे पहचानता नहीं था।” यहाँ यूनानी क्रिया का अर्थ उससे परिचित न होना या उसकी पहचान न होना—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पानी से।” इसी प्रकार पद के अन्त में “पवित्र आत्मा से।” यूनानी में दोनों जगह एक ही पूर्वसर्ग (“में”) है; मुख्य पाठ उस समानान्तरता को बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: “ठहरते” के लिए प्रयुक्त यूनानी क्रिया यूहन्ना के लेखन में महत्त्वपूर्ण है और इसका अनुवाद “बने रहते” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ οὐκ ᾔδειν αὐτόν
  choice: और मैं उसे नहीं जानता था
  rationale: κἀγώ के संयोजक बल और οὐκ ᾔδειν के पूर्वकालिक अज्ञान को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पहचानता नहीं था’ भी संदर्भगत रूप से सम्भव है।
- source_word: ὁ πέμψας με βαπτίζειν ἐν ὕδατι
  choice: जिसने मुझे पानी में बपतिस्मा देने के लिए भेजा
  rationale: संज्ञात्मक कृदन्त को सम्बन्धवाचक उपवाक्य से और उद्देश्यसूचक infinitive को ‘के लिए’ से व्यक्त किया गया है। ἐν के लिए ‘में’ चुनकर पद के अन्त में आने वाले समान प्रयोग से समानान्तरता रखी गई है।
- source_word: ἐκεῖνός μοι εἶπεν
  choice: उसी ने मुझसे कहा
  rationale: ἐκεῖνος के पुनरुक्त और बलात्मक संकेत को हिन्दी के ‘उसी ने’ से स्पष्ट रखा गया है।
- source_word: Ἐφ’ ὃν ἂν ἴδῃς
  choice: जिस पर तुम ... देखो
  rationale: अनिश्चित सम्बन्धवाचक पहचान-संकेत को सहज हिन्दी संरचना में रखा गया है।
- source_word: τὸ πνεῦμα καταβαῖνον καὶ μένον ἐπ’ αὐτόν
  choice: आत्मा को उतरते और उसी पर ठहरते
  rationale: दोनों वर्तमान कृदन्तों की जारी क्रिया और ἐπ’ αὐτόν की पुनरुक्ति को ‘उसी पर’ द्वारा सुरक्षित रखा गया है; μένω के लिए सुलभ ‘ठहरना’ चुना गया है।
- source_word: οὗτός ἐστιν ὁ βαπτίζων ἐν πνεύματι ἁγίῳ
  choice: वही है जो पवित्र आत्मा में बपतिस्मा देता है
  rationale: οὗτός की स्पष्ट पहचान को ‘वही’ से और ἐν की पहले वाक्यांश से समानान्तरता को ‘में’ से बनाए रखा गया है।
theological_decisions:
- issue: πνεῦμα और πνεύματι ἁγίῳ का सन्दर्भ
  choice: आत्मा ... पवित्र आत्मा
  alternative: आत्मा ... पवित्र आत्मा; पहले प्रयोग को सामान्य ‘आत्मा’ समझना
  rationale: अन्तिम पदबंध ‘पवित्र आत्मा’ उतरने वाली आत्मा के दैवी सन्दर्भ की पहचान करता है; हिन्दी में वही शब्दावली इस सम्बन्ध को बनाए रखती है।
- issue: बपतिस्मा वाले दोनों वाक्यांशों में ἐν
  choice: पानी में ... पवित्र आत्मा में
  alternative: पानी से ... पवित्र आत्मा से
  rationale: ‘में’ मूल यूनानी के एक ही सम्बन्धसूचक शब्द और दोनों बपतिस्मों की जानबूझकर रखी गई समानान्तरता को सुरक्षित रखता है; साधनवाचक ‘से’ भी सम्भव हिन्दी अनुवाद है।
- issue: μένω का यूहन्नाई बल
  choice: ठहरते
  alternative: बने रहते
  rationale: ‘ठहरते’ आधुनिक पाठक के लिए स्वाभाविक है और क्षणिक उतरने के विपरीत निरन्तर उपस्थिति का संकेत देता है, बिना उस बल को किसी विशिष्ट धर्मवैज्ञानिक प्रणाली में बाँधे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुलभ हिन्दी। ‘बपतिस्मा’ प्रचलित बाइबलीय पद है; वाक्यरचना मूल की पहचान-सूचक पुनरुक्ति और पानी/पवित्र आत्मा की समानान्तरता को यथासम्भव स्वाभाविक रूप में रखती है।
