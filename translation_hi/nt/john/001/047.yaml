base_translation:
  language: en
  yaml_path: translation/nt/john/001/047.yaml
  text: Jesus saw Nathanael coming toward him and said about him, “Look, truly an Israelite in whom there is no deceit.”
translation:
  language: hi
  text: यीशु ने नतनएल को अपनी ओर आते देखा और उसके विषय में कहा, “देखो, सचमुच एक इस्राएली, जिसमें कोई छल नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला स्वाभाविक आधुनिक हिन्दी उद्गार है और यूनानी आज्ञार्थक की जीवंतता बनाए रखता है।
- source_word: ἀληθῶς Ἰσραηλίτης
  choice: सचमुच एक इस्राएली
  rationale: ἀληθῶς के बल को सीधे व्यक्त करता है और जातीय-संधि पहचान ‘इस्राएली’ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: δόλος
  choice: छल
  rationale: यह शब्द धोखे, कपट या धूर्तता के अर्थ-क्षेत्र को संक्षिप्त और dignified हिन्दी में व्यक्त करता है; यहाँ ‘छल’ प्रसंगानुकूल और सहज है।
theological_decisions:
- issue: यीशु द्वारा नतनएल को ‘सचमुच एक इस्राएली’ कहना
  choice: वाक्य को सीधे प्रशंसात्मक कथन के रूप में रखा गया है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के।
  alternative: ‘सच्चा इस्राएली’
  rationale: ‘सचमुच एक इस्राएली’ यूनानी ἀληθῶς Ἰσραηλίτης की संरचना और संभावित अर्थगत तनाव को बेहतर बनाए रखता है; ‘सच्चा इस्राएली’ पहचान की कोई अतिरिक्त परिभाषा सुझा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुरूप। ‘उसके विषय में’ स्रोत के περὶ αὐτοῦ को स्पष्ट रूप से सुरक्षित रखता है।
