    text: या, “मैं उसे नहीं पहचानता था।” यूनानी अभिव्यक्ति व्यक्तिगत रूप से न जानने या पहचान न पाने—दोनों अर्थ दे सकती है; मुख्य पाठ व्यापक शब्दावली रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: और मैं
  rationale: καί और ἐγώ के संयुक्त रूप का संवादगत क्रम और सर्वनाम पर हल्का बल बना रहता है, बिना अनावश्यक रूप से ‘मैं भी’ जोड़ने के।
- source_word: οὐκ ᾔδειν αὐτόν
  choice: उसे नहीं जानता था
  rationale: अपूर्ण भूतकाल अतीत में बनी हुई न जानने की अवस्था व्यक्त करता है। ‘जानता था’ यूनानी की व्यापकता बनाए रखता है; ‘पहचानता था’ संदर्भ में संभव, पर अधिक व्याख्यात्मक है।
- source_word: ἀλλ’
  choice: पर
  rationale: यह यूहन्ना के पहले न जानने और उसके बपतिस्मा देने के उद्देश्य के बीच विरोध दर्शाता है।
- source_word: ἵνα φανερωθῇ
  choice: कि वह ... प्रकट हो
  rationale: ἵνα उद्देश्य बताता है और φανερωθῇ का कर्मवाच्य भाव ‘प्रकट हो’ में स्वाभाविक हिंदी के साथ सुरक्षित रहता है।
- source_word: τῷ Ἰσραήλ
  choice: इस्राएल पर
  rationale: प्रकट होने के प्राप्तकर्ता/समुदाय को हिंदी में स्वाभाविक रीति से व्यक्त करता है और सामूहिक नाम ‘इस्राएल’ को बिना विस्तार के बनाए रखता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह आगे आने वाले उद्देश्य की ओर संकेत करता है और कारणसूचक बल को स्पष्ट रखता है।
- source_word: ἦλθον ἐγὼ
  choice: मैं ... आया
  rationale: ἦλθον का सामान्य भूतकाल और स्पष्ट ἐγώ का बल सहज हिंदी में सुरक्षित है।
- source_word: ἐν ὕδατι
  choice: पानी में
  rationale: ἐν के स्थानवाचक रूप को सीधे रखता है और हिंदी में भी स्वाभाविक है; ‘पानी से’ साधन का अर्थ अधिक निश्चित कर देता।
- source_word: βαπτίζων
  choice: बपतिस्मा देता हुआ
  rationale: 'समकालिक वर्तमान कृदंत का भाव सुरक्षित रहता है: उसका आना बपतिस्मा देते हुए आने के रूप में बताया गया है। ‘बपतिस्मा देने आया’ इसे केवल आने के उद्देश्य के रूप में पढ़े जाने की ओर झुका सकता है।'
theological_decisions:
- issue: यूहन्ना का यह कहना कि वह यीशु को नहीं जानता था
  choice: पूर्व में न जानने का व्यापक कथन रखा गया है।
  alternative: ‘मैं उसे नहीं पहचानता था’ अथवा ‘मैं उसे मसीह के रूप में नहीं जानता था।’
  rationale: पद स्वयं यह निश्चित नहीं करता कि बात व्यक्तिगत परिचय की कमी की है या मसीही पहचान की। व्यापक भाषा इस अस्पष्टता और धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘बपतिस्मा’ प्रचलित धार्मिक शब्द है; ‘इस्राएल’ सामूहिक ऐतिहासिक-संधिगत संबोधन के रूप में यथावत रखा गया है।
