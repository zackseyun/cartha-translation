  yaml_path: translation/nt/john/001/031.yaml
  text: 'And I did not know him[a], but for this reason I came baptizing in water: that he might be revealed to Israel.'
translation:
  language: hi
  text: और मैं उसे नहीं जानता था[a], पर मैं इसी कारण पानी में बपतिस्मा देता हुआ आया कि वह इस्राएल के सामने प्रकट हो।
  philosophy: optimal-equivalence
  footnotes:
