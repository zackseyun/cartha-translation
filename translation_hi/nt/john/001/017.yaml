  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ὁ νόμος διὰ Μωϋσέως ἐδόθη, ἡ χάρις καὶ ἡ ἀλήθεια διὰ Ἰησοῦ Χριστοῦ ἐγένετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/017.yaml
  text: For the law was given through Moses[a]; grace and truth came through Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि व्यवस्था मूसा के द्वारा दी गई; अनुग्रह और सत्य यीशु मसीह के द्वारा आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद पिछले कथन का आधार स्पष्ट करता है; ‘क्योंकि’ यूनानी संयोजक के कारणसूचक और व्याख्यात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: संदर्भ में यह मूसा के द्वारा दी गई वाचा-संबंधी व्यवस्था को सूचित करता है। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित है।
- source_word: διὰ Μωϋσέως
  choice: मूसा के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम अथवा मध्यस्थता बताता है। यह अनुवाद यीशु के विषय में आने वाले समानांतर वाक्यांश को भी बनाए रखता है।
- source_word: ἐδόθη
  choice: दी गई
  rationale: यह δίδωμι का अओरिस्ट कर्मवाच्य रूप है; ‘दी गई’ उसके कर्मवाच्य और ऐतिहासिक कथन दोनों को सुरक्षित रखता है।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: यूहन्ना के संदर्भ में χάρις परमेश्वर के कृपापूर्ण अनुग्रह को व्यक्त करता है; ‘अनुग्रह’ इसका प्रतिष्ठित और अर्थपूर्ण हिन्दी रूप है।
- source_word: ἡ ἀλήθεια
  choice: सत्य
  rationale: ‘सत्य’ यूहन्ना 1:14 की प्रतिध्वनि बनाए रखता है और ἀλήθεια के सत्य तथा प्रकट वास्तविकता के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: ‘के द्वारा’ मध्यस्थता को सुरक्षित रखता है। हिन्दी में ‘मसीह’ Χριστός का अर्थसूचक और प्रचलित रूप है तथा यहाँ उपाधि का मसीहाई अर्थ भी वहन करता है।
- source_word: ἐγένετο
  choice: आए
  rationale: बहुवचन संयुक्त कर्ता ‘अनुग्रह और सत्य’ के अनुरूप ‘आए’ स्वाभाविक है और उनके यीशु मसीह के द्वारा इतिहास में प्रकट होने का भाव देता है, बिना यह कहे कि वे पहले अस्तित्व में नहीं थे।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु मसीहा; यीशु ख्रीस्त
  rationale: आधुनिक हिन्दी में ‘मसीह’ उपाधि Χριστός का प्रचलित रूप है और उसका अर्थ ‘अभिषिक्त जन/मसीहा’ है। ‘यीशु मसीहा’ कम स्वाभाविक लगता है, जबकि ‘ख्रीस्त’ अर्थ का अनुवाद करने के बजाय ध्वन्यंतरण पर अधिक निर्भर है।
- issue: व्यवस्था और अनुग्रह-सत्य के बीच संबंध
  choice: मूल के समानांतर कथनों को बिना विरोधसूचक शब्द जोड़े रखा गया
  alternative: ‘परन्तु अनुग्रह और सत्य…’
  rationale: यूनानी पाठ में μέν/δέ अथवा ἀλλά जैसा स्पष्ट विरोधसूचक संयोजक नहीं है। इसलिए ऐसा ‘परन्तु’ नहीं जोड़ा गया जो व्यवस्था और अनुग्रह के बीच मूल से अधिक तीखा धर्मवैज्ञानिक विरोध स्थापित करे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों खंडों में ‘के द्वारा’ की समान रचना मूल यूनानी के जानबूझकर किए गए समानांतर को सुरक्षित रखती है। अर्धविराम दोनों संबंधित कथनों को स्पष्ट रूप से अलग करता है।
