id: JHN.1.12
reference: John 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅσοι δὲ ἔλαβον αὐτόν, ἔδωκεν αὐτοῖς ἐξουσίαν τέκνα θεοῦ γενέσθαι, τοῖς πιστεύουσιν εἰς τὸ ὄνομα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/012.yaml
  text: But to all who received him[a], he gave them the right to become children of God—to those who believe in his name,
translation:
  language: hi
  text: परन्तु जितनों ने उसे ग्रहण किया, उसने उन्हें परमेश्वर की संतान बनने का अधिकार[a] दिया—अर्थात् उन्हें, जो उसके नाम पर विश्वास करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्राधिकार’ अथवा ‘सामर्थ्य’; यूनानी शब्द दिए गए अधिकार, वैध पात्रता या क्षमता का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: जितनों ने
  rationale: यह बहुवचन संबंधवाचक अभिव्यक्ति उन सभी लोगों को समेटती है जिन्होंने उसे ग्रहण किया; ‘जितनों ने’ स्वाभाविक हिन्दी में इसके व्यापक और सामूहिक अर्थ को बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद में बताए गए अस्वीकार के विपरीत स्थिति को सामने लाता है।
- source_word: ἔλαβον αὐτόν
  choice: उसे ग्रहण किया
  rationale: यहाँ λαμβάνω का आशय उसे शारीरिक रूप से पकड़ना नहीं, बल्कि उसका स्वागत करके उसे स्वीकार करना है; ‘ग्रहण किया’ इस अर्थ को संक्षेप में बनाए रखता है।
- source_word: ἔδωκεν
  choice: दिया
  rationale: δίδωμι के सामान्य अर्थ का सीधा और स्वाभाविक अनुवाद; प्रदान की गई वस्तु का भाव अगले शब्द ‘अधिकार’ से स्पष्ट होता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: इस प्रसंग में शब्द परमेश्वर की संतान बनने के लिए दिए गए अधिकार या अनुमति को दर्शाता है, केवल कच्ची शक्ति को नहीं।
- source_word: τέκνα θεοῦ
  choice: परमेश्वर की संतान
  rationale: τέκνα स्त्री-पुरुष दोनों को समेटने वाला शब्द है; हिन्दी में सामूहिक एकवचन ‘संतान’ स्वाभाविक है और स्रोत को पुरुष-विशेष ‘पुत्र’ तक सीमित नहीं करता।
- source_word: γενέσθαι
  choice: बनने
  rationale: γίνομαι एक नई अवस्था में आने का भाव रखता है; ‘बनने’ इस परिवर्तन को सुरक्षित रखता है।
- source_word: τοῖς πιστεύουσιν
  choice: उन्हें, जो ... विश्वास करते हैं
  rationale: वर्तमान कृदन्त उन लोगों की पहचान उनके विश्वास करने से कराता है; यह हिन्दी में स्पष्ट और स्वाभाविक संबंधवाचक रचना है।
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: उसके नाम पर
  rationale: πιστεύω εἰς यहाँ भरोसे की दिशा और विषय को व्यक्त करता है; ‘उसके नाम पर विश्वास’ उसके प्रकट व्यक्तित्व और पहचान पर भरोसा रखने की स्वाभाविक हिन्दी अभिव्यक्ति है, जबकि ‘नाम में’ अधिक शब्दशः और कम सहज है।
theological_decisions:
- issue: ‘उसे ग्रहण किया’ और ‘उसके नाम पर विश्वास करते हैं’ के बीच संबंध
  choice: दोनों अभिव्यक्तियों को रखा गया है और ‘अर्थात्’ से बाद वाली को पहले समूह की व्याख्यात्मक पहचान के रूप में प्रस्तुत किया गया है।
  alternative: दोनों को पूर्ण पर्याय मानकर केवल ‘उस पर विश्वास किया’ कहना।
  rationale: यूनानी पाठ दोनों अभिव्यक्तियाँ रखता है। बाद का वाक्यांश अधिकार पाने वालों को अधिक स्पष्ट रूप से पहचानता है, पर पहले कथन को मिटाता नहीं; दोनों को रखने से यूहन्ना की मूल धार्मिक और साहित्यिक बनावट सुरक्षित रहती है।
- issue: परमेश्वर से संतान-संबंध का शब्द
  choice: परमेश्वर की संतान
  alternative: परमेश्वर के पुत्र
  rationale: मूल में τέκνα है, υἱοί नहीं; इसलिए पुरुष-विशेष अर्थ आरोपित किए बिना स्त्री और पुरुष दोनों को समेटने वाला ‘संतान’ अधिक सटीक है।
- issue: ἐξουσίαν में अधिकार और सामर्थ्य की अर्थ-सीमा
  choice: मुख्य पाठ में ‘अधिकार’, और पादटिप्पणी में ‘प्राधिकार’ तथा ‘सामर्थ्य’ की संभावित छायाएँ।
  alternative: मुख्य पाठ में केवल ‘सामर्थ्य’ या ‘शक्ति’।
  rationale: इस प्रसंग में दिया हुआ दर्जा या पात्रता प्रमुख प्रतीत होती है, फिर भी यूनानी शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’ औपचारिक किन्तु प्रचलित बाइबलीय संयोजक है। पादटिप्पणी-चिह्न [a] को उसी शब्द ‘अधिकार’ के बाद रखा गया है जिसकी वैकल्पिक अर्थ-छायाएँ पादटिप्पणी में दी गई हैं।
