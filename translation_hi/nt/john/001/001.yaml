  text: In the beginning was the Word[a], and the Word was with God[b], and the Word was God.
translation:
  language: hi
  text: आरम्भ में[b] वचन था, और वचन परमेश्वर के साथ था, और वचन परमेश्वर था।[a]
  philosophy: optimal-equivalence
  footnotes: &id001
  - marker: a
    text: अथवा, “वचन ईश्वरीय था” या “परमेश्वर जो था, वही वचन था।” अन्तिम उपवाक्य में यूनानी शब्द ‘परमेश्वर’ बिना उपपद के है और उसका स्थान उसके गुणात्मक अर्थ पर बल देता है। यह वचन के बारे में परमेश्वर के स्वभाव का कथन करता है, जबकि पिछले उपवाक्य में उल्लिखित ‘परमेश्वर’ से वचन का भेद बना रहता है।
    reason: alternative_reading
  - marker: b
    text: “आरम्भ में” वाक्यांश उत्पत्ति 1:1 की प्रतिध्वनि करता है और वचन को सृष्टि के आरम्भ से जोड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: Ἐν ἀρχῇ
  choice: आरम्भ में
  rationale: यह स्वाभाविक हिन्दी है और उत्पत्ति 1:1 की प्रतिध्वनि को बनाए रखती है।
- source_word: ἦν
  choice: था
  rationale: εἰμί के अपूर्ण भूतकाल का सरल और स्वाभाविक अनुवाद है; इसकी पुनरावृत्ति मूल पद की लय भी बनाए रखती है।
- source_word: ὁ λόγος
  choice: वचन
  rationale: यूहन्ना के प्रसंग में λόγος प्रकाशन, अभिव्यक्ति और व्यक्तिगत पहचान से जुड़ी अर्थ-समृद्ध उपाधि है। ‘वचन’ हिन्दी बाइबलीय भाषा में सुस्थापित है और ‘सन्देश’ या लिप्यंतरण ‘लोगोस’ की अपेक्षा इस विस्तार को बेहतर बनाए रखता है।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर के साथ
  rationale: πρός यहाँ निकट सम्बन्ध और व्यक्तिगत भिन्नता का भाव देता है। ‘के साथ’ वर्तमान हिन्दी में स्वाभाविक है; ‘परमेश्वर की ओर’ इस प्रसंग में अनावश्यक रूप से शब्दशः और अस्पष्ट होगा।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: सव्ययपद में निश्चित रूप से स्वयं परमेश्वर का उल्लेख है; हिन्दी में इसके लिए किसी उपपद की आवश्यकता नहीं है।
- source_word: θεὸς ἦν ὁ λόγος
  choice: वचन परमेश्वर था
  rationale: यह स्वाभाविक हिन्दी में विधेय θεός की गुणात्मक शक्ति को बनाए रखते हुए वचन के पूर्ण ईश्वरत्व की पुष्टि करता है। पिछले उपवाक्य में व्यक्त व्यक्तिगत भिन्नता को मिटाए बिना मूल कथन की संक्षिप्तता और तनाव सुरक्षित रहता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में उपपद-रहित विधेय θεός का अनुवाद
  choice: वचन परमेश्वर था
  alternative: वचन ईश्वरीय था; परमेश्वर जो था, वही वचन था
  rationale: 'यूनानी वाक्य-विन्यास में θεός मुख्यतः गुणात्मक है: यह वचन के स्वभाव के विषय में पूर्ण ईश्वरत्व का कथन करता है, पर पिछले उपवाक्य के ‘परमेश्वर’ और ‘वचन’ की व्यक्तिगत भिन्नता को समाप्त नहीं करता। मुख्य पाठ का सीधा अनुवाद इस धार्मिक तनाव को बनाए रखता है; ‘ईश्वरीय’ हिन्दी में केवल देवतुल्य या दैवी गुणों वाला समझा जा सकता है और इसलिए मूल कथन को कमजोर कर सकता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘आरम्भ’, ‘वचन’ और ‘परमेश्वर’ बाइबलीय संदर्भ में परिचित हैं, पर भाषा अनावश्यक रूप से पुरातन नहीं है।
