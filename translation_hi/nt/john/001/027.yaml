review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the coming one’s succession to John and John’s unworthiness to perform the action. However, ὑπόδημα in this setting is more specifically a sandal, and ἱμάς is its strap; “जूते का फीता” naturally suggests a laced shoe and therefore weakens the source’s concrete imagery.
  naturalness: The proposed revision is natural, clear modern Hindi. “चप्पल की पट्टी खोलने के योग्य” is idiomatic enough in context and retains the humble, dignified register.
  terminology: “चप्पल” appropriately represents the ancient sandal, while “पट्टी” represents its fastening strap more accurately than “फीता.” The relative relationship introduced by οὗ is retained with “जिसकी.”
  issues:
  - severity: low
    issue: “जूते का फीता” is less precise for “the strap of his sandal.”
    rationale: A फीता normally evokes a shoelace, whereas the Greek specifies the strap of a sandal. “चप्पल की पट्टी” preserves the historical object and fastening more closely.
  revised_text: वह जो मेरे बाद आ रहा है, जिसकी चप्पल की पट्टी खोलने के योग्य मैं नहीं हूँ।
