source:
  edition: SBLGNT
  text: ⸀ὁ ὀπίσω μου ⸀ἐρχόμενος, οὗ ⸂οὐκ εἰμὶ⸃ ἄξιος ἵνα λύσω αὐτοῦ τὸν ἱμάντα τοῦ ὑποδήματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/027.yaml
  text: the one coming after me[a], whose sandal strap I am not worthy to untie.
translation:
  language: hi
  text: वह जो मेरे बाद आ रहा है, जिसकी चप्पल की पट्टी खोलने के योग्य मैं नहीं हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὀπίσω μου ἐρχόμενος
  choice: वही जो मेरे बाद आ रहा है
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदन्त एक निश्चित व्यक्ति की ओर संकेत करता है। ‘मेरे बाद’ यहाँ मुख्यतः क्रम या उत्तरवर्ती आगमन बताता है, केवल स्थानिक रूप से पीछे होना नहीं। ‘आ रहा है’ कृदन्त के वर्तमान और गतिशील भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: οὗ
  choice: उसके
  rationale: सम्बन्धवाचक सर्वनाम का सम्बन्ध आगे के ‘जूते के फीते’ से है। हिन्दी में वाक्य को स्वाभाविक रखने के लिए इसे ‘उसके’ से व्यक्त किया गया है।
- source_word: οὐκ εἰμὶ ἄξιος
  choice: मैं ... योग्य भी नहीं हूँ
  rationale: ἄξιος योग्यता या पात्रता व्यक्त करता है। ‘योग्य भी नहीं’ यूहन्ना की गहरी दीनता को बिना अतिरिक्त व्याख्या जोड़े स्पष्ट करता है।
- source_word: ἵνα λύσω
  choice: खोलने
  rationale: योग्यता बताने वाली अभिव्यक्ति के बाद ἵνα और सम्भावनार्थक क्रिया को आधुनिक हिन्दी में कृदन्त ‘खोलने’ से स्वाभाविक और ठीक रूप से व्यक्त किया जाता है।
- source_word: ἱμάντα
  choice: फीता
  rationale: यह जूते या चप्पल को बाँधने वाली पट्टी अथवा डोरी को दर्शाता है। ‘फीता’ साधारण आधुनिक हिन्दी में क्रिया ‘खोलना’ के साथ सहज है।
- source_word: τοῦ ὑποδήματος
  choice: जूते
  rationale: ὑπόδημα सामान्यतः पाँव में पहनी जाने वाली वस्तु, जूता या चप्पल, को दर्शा सकता है। ‘जूता’ आधुनिक हिन्दी में व्यापक और स्वाभाविक शब्द है; प्राचीन बनावट का अनावश्यक रूप से अधिक विशिष्टीकरण नहीं करता।
theological_decisions:
- issue: आने वाले व्यक्ति का ‘मेरे बाद’ होने का सम्बन्ध
  choice: समय और सेवकाई के क्रम के अर्थ में ‘मेरे बाद आ रहा है’
  alternative: मेरे पीछे आ रहा है
  rationale: यूहन्ना के प्रसंग में यह वाक्य आने वाले व्यक्ति के सेवकाई-क्रम में बाद में प्रकट होने की बात करता है। निकटवर्ती पदों में उसकी श्रेष्ठता स्पष्ट होती है, पर इस खण्ड में उस पूरे धार्मिक निष्कर्ष को जोड़कर मूल अभिव्यक्ति का तनाव समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वही’ निश्चित व्यक्ति पर बल देता है; डैश मूल यूनानी की सम्बन्धवाचक संरचना को हिन्दी में स्पष्ट और प्रवाहपूर्ण बनाता है।
