source:
  edition: SBLGNT
  text: στραφεὶς δὲ ὁ Ἰησοῦς καὶ θεασάμενος αὐτοὺς ἀκολουθοῦντας λέγει αὐτοῖς· Τί ζητεῖτε; οἱ δὲ εἶπαν αὐτῷ· Ῥαββί (ὃ λέγεται ⸀μεθερμηνευόμενον Διδάσκαλε), ποῦ μένεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/038.yaml
  text: Then Jesus turned and[a], seeing them following, said to them, “What are you seeking?” They said to him, “Rabbi” (which translated means Teacher)[c][b], “where are you staying?”
translation:
  language: hi
  text: तब यीशु ने मुड़कर उन्हें अपने पीछे आते देखा और उनसे कहा, “तुम क्या खोज रहे हो?”[a] उन्होंने यीशु से कहा, “रब्बी”[b] (जिसका अर्थ है, “गुरु”), “आप कहाँ ठहरे हुए हैं?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम क्या ढूँढ़ रहे हो?” यूनानी शब्द साधारण तलाश के लिए भी प्रयुक्त हो सकता है, पर “खोज रहे हो” यहाँ सम्भव गहरे अर्थ को भी खुला रखता है।
    reason: lexical_alternative
  - marker: b
    text: “रब्बी” इब्रानी/अरामी संबोधन है, जिसका अर्थ “गुरु” है।
    reason: cultural_note
  - marker: c
    text: या “आप कहाँ बने रहते हैं?” यहाँ प्रयुक्त यूनानी क्रिया को यूहन्ना में अन्य स्थानों पर प्रायः “बने रहना” कहा जाता है। इस प्रसंग में अर्थ है कि यीशु कहाँ ठहरे हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: यह यीशु के बोलने से पहले की क्रिया को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है; दिशा को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: θεασάμενος
  choice: देखा
  rationale: यह ध्यानपूर्वक दृश्य ग्रहण करने के भाव को सरल हिन्दी में रखता है और क्रियाओं के क्रम में स्वाभाविक है।
- source_word: ἀκολουθοῦντας
  choice: अपने पीछे आते
  rationale: तात्कालिक दृश्य में वे सचमुच यीशु के पीछे आ रहे हैं; यह अभिव्यक्ति शिष्यत्व के उभरते संकेत को न तो थोपती है, न मिटाती है।
- source_word: Τί ζητεῖτε;
  choice: तुम क्या खोज रहे हो?
  rationale: ζητέω के साधारण खोजने और यूहन्ना के वृत्तांत में सम्भव गहरे अभिप्राय—दोनों को सुरक्षित रखता है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: मूल सेमिटिक संबोधन का लिप्यंतरण रखा गया है, क्योंकि पाठ स्वयं तुरंत उसका अर्थ बताता है।
- source_word: μεθερμηνευόμενον Διδάσκαλε
  choice: जिसका अनुवाद है, “गुरु”
  rationale: लेखक की व्याख्यात्मक टिप्पणी को स्पष्ट आधुनिक हिन्दी में रखता है; सम्बोधन के रूप में Διδάσκαλε के लिए “गुरु” स्वाभाविक है।
- source_word: ποῦ μένεις;
  choice: आप कहाँ ठहरे हुए हैं?
  rationale: इस प्रसंग में μένω का तात्कालिक अर्थ निवास या अस्थायी ठहराव है; “ठहरे हुए” स्वाभाविक हिन्दी है और क्रिया की जारी अवस्था भी व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में μένω के बाद के धर्मवैचारिक महत्व के बावजूद इस प्रथम प्रयोग का अनुवाद
  choice: आप कहाँ ठहरे हुए हैं?
  alternative: आप कहाँ बने रहते हैं? / आप कहाँ निवास करते हैं?
  rationale: तात्कालिक प्रसंग में शिष्य यीशु के ठहरने का स्थान पूछते हैं। मुख्य पाठ में स्वाभाविक स्थितिजन्य अर्थ रखा गया है, जबकि पाद-टिप्पणी उसी क्रिया के “बने रहना” अर्थ की ओर संकेत करती है।
- issue: ζητέω में सम्भावित यूहन्नाई दोहरा अर्थ
  choice: तुम क्या खोज रहे हो?
  alternative: तुम क्या ढूँढ़ रहे हो?
  rationale: “खोज रहे हो” साधारण तलाश और सम्भावित गहरी आत्मिक खोज—दोनों अर्थों के लिए खुला रहता है, बिना किसी एक अर्थ को आरोपित किए।
- issue: ἀκολουθέω में भौतिक अनुसरण और उभरते शिष्यत्व का तनाव
  choice: अपने पीछे आते
  alternative: अपना अनुसरण करते
  rationale: तत्काल दृश्यगत अर्थ प्राथमिक है। यह चयन औपचारिक शिष्यत्व को समय से पहले स्पष्ट नहीं करता, यद्यपि कथा के व्यापक सन्दर्भ में वह संकेत सम्भव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सहज कथात्मक शैली। यीशु के लिए शिष्यों के संबोधन में “आप” रखा गया है, जबकि यीशु उनसे “तुम” कहते हैं। “रब्बी” को मूल रूप में रखकर पाठ के भीतर उसका अर्थ दिया गया है।
