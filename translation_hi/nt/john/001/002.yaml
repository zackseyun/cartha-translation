  yaml_path: translation/nt/john/001/002.yaml
  text: He was in the beginning with God[a].
translation:
  language: hi
  text: वही आदि में परमेश्वर के साथ था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: वही
  rationale: यह संकेतवाचक सर्वनाम पिछले पद के ‘वचन’ की ओर लौटता है। ‘वही’ हिन्दी में इस पुनः-संदर्भ को स्वाभाविक और स्पष्ट रखता है; केवल ‘वह’ की तुलना में यूनानी οὗτος का संकेतात्मक बल भी बेहतर व्यक्त करता है।
- source_word: ἦν
  choice: था
  rationale: εἰμί के अपूर्ण भूतकाल का स्वाभाविक हिन्दी रूप ‘था’ है। यह उस समय पहले से विद्यमान स्थिति को बिना अनावश्यक व्याख्या जोड़े व्यक्त करता है।
- source_word: ἐν ἀρχῇ
  choice: आदि में
  rationale: यह पद 1 की अभिव्यक्ति दोहराता और उत्पत्ति 1:1 की प्रतिध्वनि बनाए रखता है। ‘आदि में’ संक्षिप्त, प्रतिष्ठित और आधुनिक हिन्दी में बोधगम्य है।
- source_word: πρὸς
  choice: के साथ
  rationale: यहाँ πρός संबंध और भिन्नता दोनों का संकेत देता है। ‘के साथ’ स्वाभाविक हिन्दी है और ‘की ओर’ जैसी अत्यधिक स्थानिक व्याख्या से बचता है।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: संदर्भ में निश्चित ईश्वरीय व्यक्ति का बोध है। हिन्दी में ‘परमेश्वर’ स्वाभाविक रूप से निश्चित है, इसलिए यूनानी लेख के लिए अलग शब्द जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: οὗτος का संदर्भ और उसका व्यक्तिगत रूप
  choice: ‘वही’ द्वारा पिछले पद के ‘वचन’ की ओर संकेत
  alternative: ‘यह’ या ‘वह’
  rationale: पद पिछले कथन का सार दोहराते हुए उसी ‘वचन’ को संदर्भित करता है। ‘वही’ अनाफोरिक और संकेतात्मक बल बनाए रखता है, पर मूल से आगे बढ़कर कोई अतिरिक्त मसीही उपाधि नहीं जोड़ता।
- issue: πρὸς τὸν θεόν का संबंधात्मक बल
  choice: ‘परमेश्वर के साथ’
  alternative: ‘परमेश्वर की ओर’ या ‘परमेश्वर की उपस्थिति में’
  rationale: ‘के साथ’ निकट संबंध तथा संदर्भगत भिन्नता को संक्षेप में व्यक्त करता है और संबंध की दार्शनिक प्रकृति को मूल पाठ से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। पद 1 से शब्दगत निरंतरता रखने के लिए ‘आदि में’ और ‘परमेश्वर के साथ’ अपनाए गए हैं। ‘वही’ οὗτος के संकेतात्मक पुनः-संदर्भ को इतना स्पष्ट करता है कि हिन्दी में अलग वैकल्पिक पाठ-टिप्पणी आवश्यक नहीं समझी गई।
