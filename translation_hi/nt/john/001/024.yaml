  text: And they had been sent from the Pharisees[a].
translation:
  language: hi
  text: और वे फरीसियों की ओर से भेजे गए थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे फरीसियों से आए थे।” यूनानी में “फरीसियों से” है; यह दल के स्रोत या फरीसियों से उसके संबंध को दर्शाता है और प्रत्यक्ष कर्तृत्व को अनिवार्य नहीं ठहराता।
    reason: वैकल्पिक अनुवाद; ἐκ के स्रोत/उद्गम के भाव और ‘की ओर से’ में निहित प्रतिनिधित्व/कर्तृत्व की संभावित बारीकी को सुरक्षित रखना।
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: साधारण संयोजक के रूप में कथा का प्रवाह बनाए रखता है और कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता।
- source_word: ἀπεσταλμένοι ἦσαν
  choice: वे ... भेजे गए थे
  rationale: पूर्ण कृदंत और अपूर्णकालिक सहायक क्रिया से बनी यह परिभाषात्मक रचना पहले हो चुके भेजे जाने और उसके बने हुए परिणाम को व्यक्त करती है; हिन्दी में ‘भेजे गए थे’ इसका स्वाभाविक रूप है।
- source_word: ἐκ
  choice: में से
  rationale: ἐκ मुख्यतः स्रोत या उद्गम बताता है। ‘में से’ यह संकेत सुरक्षित रखता है कि भेजे गए लोग फरीसियों के समूह से थे, बिना प्रत्यक्ष कर्तृत्व को निश्चित किए।
- source_word: τῶν Φαρισαίων
  choice: फरीसियों
  rationale: Φαρισαῖοι के लिए प्रचलित और व्यापक रूप से समझा जाने वाला हिन्दी समूह-नाम।
theological_decisions:
- issue: भेजे गए लोगों का फरीसियों से संबंध
  choice: वे फरीसियों में से भेजे गए थे—अर्थात प्रतिनिधिमंडल का स्रोत या समूहगत संबंध फरीसियों से था।
  alternative: वे फरीसियों की ओर से भेजे गए थे—इसमें फरीसियों के कर्तृत्व या प्रतिनिधित्व पर अधिक बल पड़ता है।
  rationale: यूनानी ἐκ + संबंधकारक सीधे तौर पर स्रोत या उद्गम दर्शाता है, स्पष्ट कर्ता नहीं। इसलिए मुख्य पाठ स्रोत-संबंध को रखता है और कर्तृत्व वाले स्वाभाविक विकल्प को पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘में से भेजे गए’ कुछ हद तक शाब्दिक है, पर यूनानी में निहित स्रोत/समूह-संबंध को ‘की ओर से’ कहकर समय से पहले कर्तृत्व में नहीं बदलता।
