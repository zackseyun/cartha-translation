    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρία
  choice: गवाही
  rationale: यह शब्द यूहन्ना द्वारा दी गई साक्ष्यपूर्ण घोषणा को व्यक्त करता है और मूल के न्यायिक/साक्षी संबंधी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοῦ Ἰωάννου
  choice: यूहन्ना की
  rationale: 'सम्बन्धकारक को कर्तृवाचक माना गया है: यह यूहन्ना द्वारा दी गई गवाही है, यूहन्ना के विषय में दी गई गवाही नहीं।'
- source_word: ὅτε
  choice: जब
  rationale: यह कालवाचक संयोजक उस अवसर का परिचय देता है जिस पर यूहन्ना ने यह गवाही दी।
- source_word: ἀπέστειλαν
  choice: भेजा
  rationale: कथा के इस प्रसंग में यह सामान्य, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: मुख्य पाठ में यूनानी अभिव्यक्ति का सीधा सामुदायिक पद बनाए रखा गया है; प्रसंग में इसका संकेत विशेषतः यहूदिया के धार्मिक अधिकारियों की ओर हो सकता है, इसलिए पादटिप्पणी दी गई है।
- source_word: ἐξ Ἱεροσολύμων
  choice: यरूशलेम से
  rationale: स्थान के उद्गम को व्यक्त करने वाला स्वाभाविक हिन्दी रूप।
- source_word: ἱερεῖς καὶ Λευίτας
  choice: याजकों और लेवियों
  rationale: मन्दिर से जुड़े इन दो अलग समूहों को स्पष्ट और परम्परागत बाइबलीय हिन्दी पदों से व्यक्त किया गया है।
- source_word: ἵνα ἐρωτήσωσιν αὐτόν
  choice: उसके पास यह पूछने के लिए
  rationale: ἵνα उपवाक्य का प्रयोजन स्पष्ट किया गया है; ‘उसके पास’ हिन्दी में भेजे गए प्रतिनिधियों और पूछे जाने वाले व्यक्ति के सम्बन्ध को स्वाभाविक बनाता है।
- source_word: Σὺ τίς εἶ;
  choice: तुम कौन हो?
  rationale: यह सीधा और स्वाभाविक हिन्दी प्रश्न है; ‘तुम’ मूल के स्पष्ट सर्वनाम Σὺ को भी बनाए रखता है।
theological_decisions:
