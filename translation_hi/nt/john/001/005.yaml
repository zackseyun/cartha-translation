  text: καὶ τὸ φῶς ἐν τῇ σκοτίᾳ φαίνει, καὶ ἡ σκοτία αὐτὸ οὐ κατέλαβεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/005.yaml
  text: And the light shines in the darkness[a], and the darkness has not overcome it.
translation:
  language: hi
  text: और ज्योति अंधकार में चमकती है, और अंधकार उस पर विजय नहीं पा सका।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंधकार उसे समझ न सका” अथवा “उसे ग्रहण नहीं कर सका।” यूनानी क्रिया का अर्थ काबू पाना या विजय पाना भी हो सकता है और समझना या ग्रहण करना भी।
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ज्योति
  rationale: यूहन्ना की प्रस्तावना में यह निश्चित और विषयगत प्रकाश है। हिंदी में ‘ज्योति’ इस रूपक को स्वाभाविक, गरिमापूर्ण और स्पष्ट रखती है; प्रसंग से इसकी निश्चितता प्रकट होती है।
- source_word: σκοτίᾳ / σκοτία
  choice: अंधकार
  rationale: दोनों स्थलों पर एक ही शब्द रखकर ज्योति और अंधकार के विषयगत तथा मानवीकृत विरोध को सुरक्षित रखा गया है। हिंदी में पदार्थवाचक संज्ञा के साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: φαίνει
  choice: चमकती है
  rationale: वर्तमान काल ongoing और जीवंत क्रिया को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: κατέλαβεν
  choice: विजय नहीं पा सका
  rationale: प्रकाश और अंधकार के संघर्षपूर्ण रूपक में ‘विजय पाना’ प्रमुख अर्थ को स्वाभाविक हिंदी में व्यक्त करता है। यूनानी क्रिया के ‘समझना/ग्रहण करना’ अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: αὐτὸ
  choice: उस पर
  rationale: यूनानी नपुंसकलिंग सर्वनाम φῶς की ओर संकेत करता है। ‘उस पर विजय पाना’ हिंदी का स्वाभाविक मुहावरा है और यहाँ ज्योति को अनावश्यक रूप से स्पष्टतः पुरुषवाचक नहीं बनाता।
theological_decisions:
- issue: ज्योति-अंधकार के विरोध में κατέλαβεν का अर्थ
  choice: अंधकार उस पर विजय नहीं पा सका
  alternative: अंधकार ने उसे समझा नहीं / ग्रहण नहीं किया
  rationale: यूनानी क्रिया में शत्रुतापूर्वक काबू पाने और मानसिक रूप से समझने या ग्रहण करने—दोनों अर्थ संभव हैं। निकटवर्ती ज्योति-अंधकार रूपक मुख्य पाठ में ‘विजय’ का समर्थन करता है, पर संभावित बहुस्तरीय अर्थ को पाद-टिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘ज्योति’ और ‘अंधकार’ का चयन प्रस्तावना के काव्यात्मक तथा विषयगत विरोध को बनाए रखता है। पाद-टिप्पणी चिह्न उसी वाक्य के अंत में दिया गया है जिसकी वैकल्पिक व्याख्या बताई गई है।
