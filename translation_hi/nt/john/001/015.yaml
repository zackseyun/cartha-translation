  text: (Ἰωάννης μαρτυρεῖ περὶ αὐτοῦ καὶ κέκραγεν λέγων· Οὗτος ἦν ⸂ὃν εἶπον⸃· Ὁ ὀπίσω μου ἐρχόμενος ἔμπροσθέν μου γέγονεν, ὅτι πρῶτός μου ἦν·)
base_translation:
  language: en
  yaml_path: translation/nt/john/001/015.yaml
  text: John testifies about him and has cried out[a], saying, “This was he of whom I said, ‘The one coming after me has become before me[b], because he was before me.’”
translation:
  language: hi
  text: 'यूहन्ना उसके विषय में गवाही देता है और पुकारकर कहा है: “यह वही था जिसके विषय में मैंने कहा था, ‘जो मेरे बाद आ रहा है, वह मुझसे आगे हो गया है[a], क्योंकि वह मुझसे पहले था[b]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मुझ पर प्रधानता पाई है” अथवा “वह मुझसे श्रेष्ठ ठहरा है।” यूनानी अभिव्यक्ति क्रम के साथ-साथ प्राथमिकता या पद भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह मुझसे पहले से अस्तित्व में था।” “वह मुझसे पहले था” यूनानी के अधिक निकट है और संदर्भ में पूर्व-अस्तित्व के संकेत को खुला रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: गवाही देता है
  rationale: वर्तमान काल की सतत या सजीव गवाही को व्यक्त करता है और साक्षी देने का भाव बनाए रखता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί के साथ संबंधकारक का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: κέκραγεν
  choice: पुकारकर कह चुका है
  rationale: यूनानी पूर्णकाल में अतीत की पुकार और उसके बने रहने वाले प्रभाव—दोनों का संकेत है; ‘कह चुका है’ इस पक्ष को साधारण भूतकाल से अधिक स्पष्ट रखता है।
- source_word: Οὗτος ἦν ὃν εἶπον
  choice: यह वही था जिसके विषय में मैंने कहा था
  rationale: ἦν और εἶπον के भूतकाल तथा संबंधवाचक रचना को निकटता से सुरक्षित रखता है।
- source_word: Ὁ ὀπίσω μου ἐρχόμενος
  choice: जो मेरे बाद आ रहा है
  rationale: वर्तमान कृदंत के गतिशील भाव और ὀπίσω की क्रमसूचक अस्पष्टता को बनाए रखता है।
- source_word: ἔμπροσθέν μου γέγονεν
  choice: मुझसे आगे हो गया है
  rationale: γέγονεν के पूर्णकाल और ἔμπροσθεν के ‘आगे’ वाले रूपक को बिना केवल पद या श्रेष्ठता तक सीमित किए व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: पिछले कथन का कारण स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: πρῶτός μου ἦν
  choice: वह मुझसे पहले था
  rationale: कालगत प्राथमिकता और संभावित पूर्व-अस्तित्व दोनों के लिए जगह छोड़ते हुए यूनानी कथन के निकट रहता है।
theological_decisions:
- issue: अंतिम उपवाक्य में मसीह के पूर्व-अस्तित्व को कितना स्पष्ट किया जाए
  choice: ‘वह मुझसे पहले था’
  alternative: ‘वह मुझसे पहले से अस्तित्व में था’
  rationale: संदर्भ पूर्व-अस्तित्व की ओर दृढ़ संकेत करता है, पर मूल यूनानी में ‘अस्तित्व में’ स्पष्ट रूप से नहीं जोड़ा गया। चुना हुआ रूप इस धर्मवैज्ञानिक बल को खुला रखता है, पर व्याख्यात्मक शब्द नहीं जोड़ता।
- issue: ἔμπροσθέν μου γέγονεν को क्रम या पद में प्राथमिकता के रूप में प्रस्तुत करना
  choice: ‘मुझसे आगे हो गया है’
  alternative: ‘उसने मुझ पर प्रधानता पाई है’ / ‘वह मुझसे श्रेष्ठ ठहरा है’
  rationale: यूनानी अभिव्यक्ति क्रम, प्राथमिकता या पद—एक से अधिक अर्थ दे सकती है। मुख्य पाठ में ‘आगे’ इस तनाव को बनाए रखता है और पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘यह वही था’ सामान्य बोलचाल के ‘यह वही है’ से कुछ अधिक औपचारिक है, पर मूल के ἦν को सुरक्षित रखता है। ‘पुकारकर कह चुका है’ पूर्णकाल के स्थायी प्रभाव को व्यक्त करता है।
