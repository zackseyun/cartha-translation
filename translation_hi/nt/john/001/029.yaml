id: JHN.1.29
reference: John 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῇ ἐπαύριον βλέπει τὸν Ἰησοῦν ἐρχόμενον πρὸς αὐτόν, καὶ λέγει· Ἴδε ὁ ἀμνὸς τοῦ θεοῦ ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/029.yaml
  text: The next day he sees Jesus coming toward him and says, “Look, the Lamb of God, who takes away the sin of the world!”
translation:
  language: hi
  text: अगले दिन वह यीशु को अपनी ओर आते देखता है और कहता है, “देखो, परमेश्वर का मेमना, जो संसार का पाप उठा ले जाता है!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: अगले दिन
  rationale: समय-सूचक यूनानी वाक्यांश का स्वाभाविक और सटीक आधुनिक हिन्दी रूप।
- source_word: βλέπει
  choice: देखता है
  rationale: ऐतिहासिक वर्तमान को मूल की कथात्मक सजीवता बनाए रखने के लिए वर्तमान काल में रखा गया है।
- source_word: Ἴδε
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली आज्ञा का सहज आधुनिक हिन्दी रूप; ‘निहारो’ या ‘देखो तो’ की अपेक्षा अधिक सामान्य और सीधा।
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: परमेश्वर का मेमना
  rationale: संबंधवाचक संरचना और धार्मिक बिंब दोनों को सीधे बनाए रखता है।
- source_word: ὁ αἴρων
  choice: जो ... उठा ले जाता है
  rationale: αἴρω में ‘उठाना’ और ‘दूर ले जाना/हटा देना’ दोनों भाव संभव हैं; संयुक्त हिन्दी अभिव्यक्ति इस अर्थ-व्याप्ति को यथासंभव सुरक्षित रखती है।
- source_word: τὴν ἁμαρτίαν τοῦ κόσμου
  choice: संसार का पाप
  rationale: मूल में ἁμαρτία एकवचन है; इसलिए इसे बहुवचन ‘पापों’ में नहीं बदला गया।
theological_decisions:
- issue: ‘परमेश्वर का मेमना’ के बिंब की व्याख्या
  choice: बिंब को बिना विस्तार के ज्यों का त्यों रखा गया
  alternative: बलिदान का मेमना / वह मेमना जिसे परमेश्वर ने दिया
  rationale: पद स्वयं इस बिंब की किसी एक पृष्ठभूमि या धर्मवैज्ञानिक व्याख्या को स्पष्ट नहीं करता; व्याख्यात्मक शब्द जोड़ने से वास्तविक अर्थ-तनाव सीमित हो सकता था।
- issue: αἴρων का अर्थ
  choice: ‘उठा ले जाता है’
  alternative: दूर करता है / अपने ऊपर उठा लेता है
  rationale: मूल क्रिया दोष को हटाने और उठाकर ले जाने का भाव दे सकती है, पर केवल इसी पद के आधार पर ‘अपने ऊपर’ जोड़ना अनावश्यक धर्मवैज्ञानिक स्पष्टीकरण होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के ऐतिहासिक वर्तमान (‘देखता है’, ‘कहता है’) और एकवचन ‘पाप’ को सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
