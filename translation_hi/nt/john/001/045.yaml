source:
  edition: SBLGNT
  text: εὑρίσκει Φίλιππος τὸν Ναθαναὴλ καὶ λέγει αὐτῷ· Ὃν ἔγραψεν Μωϋσῆς ἐν τῷ νόμῳ καὶ οἱ προφῆται εὑρήκαμεν, ⸀Ἰησοῦν υἱὸν τοῦ Ἰωσὴφ τὸν ἀπὸ Ναζαρέτ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/045.yaml
  text: 'Philip found Nathanael and said to him[a], “We have found him of whom Moses in the Law and also the prophets wrote: Jesus son of Joseph[b], from Nazareth.”'
translation:
  language: hi
  text: फिलिप्पुस को नतनएल मिला, और उसने उससे कहा, “जिसके विषय में मूसा ने व्यवस्था[a] में और भविष्यद्वक्ताओं ने भी लिखा था, वह हमें मिल गया है—यीशु, यूसुफ का पुत्र, जो नासरत से है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “व्यवस्था” से आशय मूसा से सम्बद्ध पवित्रशास्त्र, अर्थात तोराह, है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में अधिक शाब्दिक क्रम है: “यीशु, यूसुफ का पुत्र, नासरत से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὑρίσκει
  choice: ढूँढ़ लिया
  rationale: यूनानी में ऐतिहासिक वर्तमान है; हिन्दी कथन-शैली में भूतकाल अधिक स्वाभाविक है। ‘ढूँढ़ लिया’ फिलिप्पुस के नतनएल तक पहुँचने को स्पष्ट करता है।
- source_word: λέγει
  choice: कहा
  rationale: यह भी ऐतिहासिक वर्तमान है; प्रसंग के स्वाभाविक हिन्दी कथाक्रम के लिए भूतकाल रखा गया है।
- source_word: Ὃν ... ἔγραψεν
  choice: जिसके विषय में ... लिखा था
  rationale: सम्बन्धवाचक सर्वनाम व्यक्ति को सूचित करता है। ‘जिसके विषय में’ हिन्दी में स्वाभाविक रूप से γράφω के आशय को पूरा करता है।
- source_word: ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: यह मूसा से सम्बद्ध धर्मशास्त्रीय संग्रह अर्थात तोराह का संकेत है, सामान्य नियम-कानून का नहीं। प्रचलित हिन्दी बाइबलीय शब्दावली के कारण ‘व्यवस्था’ चुना गया है।
- source_word: οἱ προφῆται
  choice: भविष्यद्वक्ताओं ने भी
  rationale: कर्ता के रूप में बहुवचन को स्पष्ट रखा गया है और καί का बल ‘भी’ से व्यक्त किया गया है।
- source_word: εὑρήκαμεν
  choice: हमें मिल गया है
  rationale: यूनानी पूर्णकाल खोज के वर्तमान परिणाम को व्यक्त करता है; हिन्दी का पूर्ण रूप इस भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: υἱὸν τοῦ Ἰωσὴφ
  choice: यूसुफ का पुत्र
  rationale: फिलिप्पुस द्वारा दी गई सामान्य सामाजिक पहचान को बिना किसी धर्मवैज्ञानिक स्पष्टीकरण या सामंजस्य के ज्यों का त्यों रखा गया है।
- source_word: τὸν ἀπὸ Ναζαρέτ
  choice: जो नासरत से है
  rationale: ἀπό का मूल भाव ‘से’ है। यह पारंपरिक ‘नासरी’ की अपेक्षा मूल पाठ में व्यक्त स्थानगत सम्बन्ध को अधिक पारदर्शी ढंग से दिखाता है।
- source_word: Φίλιππος / Ναθαναὴλ / Ἰησοῦν / Ἰωσὴφ
  choice: फिलिप्पुस / नतनएल / यीशु / यूसुफ
  rationale: आधुनिक हिन्दी बाइबल-पाठकों के लिए परिचित और स्थापित नाम-रूप अपनाए गए हैं।
theological_decisions:
- issue: ‘यूसुफ का पुत्र’ और मसीह-विज्ञान
  choice: फिलिप्पुस की कही हुई पहचान को सीधे ‘यूसुफ का पुत्र’ रखा गया है।
  alternative: ‘जिसे यूसुफ का पुत्र समझा जाता था’ या ‘कानूनी रूप से यूसुफ का पुत्र’
  rationale: मूल पद फिलिप्पुस की प्रारम्भिक सामाजिक पहचान प्रस्तुत करता है। कुँवारी से जन्म सम्बन्धी बाद की जानकारी को यहाँ जोड़ना मूल कथन को बदल देता।
- issue: ‘मूसा ... और भविष्यद्वक्ता’ की गवाही का दायरा
  choice: दोनों को उस व्यक्ति के विषय में लिखने वाले अलग-अलग कर्ताओं के रूप में स्पष्ट रखा गया है।
  alternative: ‘जिसके विषय में मूसा की व्यवस्था और भविष्यद्वक्ताओं में लिखा है’
  rationale: मूल यूनानी में मूसा और भविष्यद्वक्ता कर्ता हैं। अनुवाद इस दावे को सुरक्षित रखता है, पर यह नहीं बताता कि कौन-से विशिष्ट अंश अभिप्रेत हैं।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास को हिन्दी के अनुरूप बनाया गया है, जबकि ऐतिहासिक वर्तमान, पूर्णकाल, दोनों शास्त्रीय साक्षियों और ‘नासरत से’ के मूल अर्थ को सुरक्षित रखा गया है।
