base_translation:
  language: en
  yaml_path: translation/nt/john/001/016.yaml
  text: For from his fullness we have all received[a], and grace upon grace.
translation:
  language: hi
  text: क्योंकि उसकी परिपूर्णता में से हम सबने प्राप्त किया है, और अनुग्रह के स्थान पर अनुग्रह[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनुग्रह पर अनुग्रह’ अथवा ‘एक अनुग्रह के बाद दूसरा अनुग्रह।’ यूनानी वाक्यांश क्रमशः मिलने वाले अनुग्रह का संकेत दे सकता है, यद्यपि ἀντί का अधिक शाब्दिक अर्थ ‘के स्थान पर’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τοῦ πληρώματος αὐτοῦ
  choice: उसकी परिपूर्णता में से
  rationale: πλήρωμα उसकी पूर्णता अथवा भरपूरी को दर्शाता है, और ἐκ स्रोत का बोध कराता है; यह अनुवाद दोनों बातों को बनाए रखता है।
- source_word: ἡμεῖς πάντες
  choice: हम सब ने
  rationale: स्पष्ट सर्वनाम ἡμεῖς और πάντες के संयुक्त बल को हिन्दी में ‘हम सब’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐλάβομεν
  choice: पाया है
  rationale: यूनानी अओरिस्ट प्राप्त करने की घटना बताता है; हिन्दी पूर्ण वर्तमान यहाँ उस प्राप्ति और उसके वर्तमान फल को सहज रूप से व्यक्त करता है।
- source_word: καὶ χάριν ἀντὶ χάριτος
  choice: —अनुग्रह के स्थान पर अनुग्रह
  rationale: καί को हिन्दी में विराम-चिह्न द्वारा स्वाभाविक रूप से जोड़ा गया है, जबकि ἀντί के मूल प्रतिस्थापन-संबंध को ‘के स्थान पर’ सुरक्षित रखा गया है।
theological_decisions:
- issue: χάριν ἀντὶ χάριτος का अर्थ
  choice: अनुग्रह के स्थान पर अनुग्रह
  alternative: अनुग्रह पर अनुग्रह; एक अनुग्रह के बाद दूसरा अनुग्रह
  rationale: ἀντί का अधिक मूल अर्थ ‘के स्थान पर’ है, पर प्रसंग में क्रमिक अथवा बढ़ते हुए अनुग्रह का अर्थ भी संभव है। मुख्य पाठ प्रतिस्थापन और उत्तराधिकार के बीच मूल तनाव को बनाए रखता है, और अधिक व्याख्यात्मक विकल्प पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परिपूर्णता’ और ‘अनुग्रह’ बाइबलीय अर्थ-सघनता बनाए रखते हैं; विवादित यूनानी वाक्यांश को अत्यधिक सरल बनाकर उसकी वास्तविक अस्पष्टता दूर नहीं की गई है।
