base_translation:
  language: en
  yaml_path: translation/nt/john/001/037.yaml
  text: And the two disciples heard him speaking[a], and they followed Jesus.
translation:
  language: hi
  text: उसके दोनों शिष्यों[a] ने उसे बोलते सुना, और वे यीशु के पीछे चल पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् यूहन्ना बपतिस्मा देनेवाले के दोनों शिष्य।
    reason: ‘उसके’ का संदर्भ पिछले पदों के अनुसार यूहन्ना बपतिस्मा देनेवाले से है।
lexical_decisions:
- source_word: ἤκουσαν
  choice: सुना
  rationale: यहाँ क्रिया का अओरिस्ट रूप कही जा रही बात को सुन लेने की साधारण घटना बताता है; इसलिए ‘सुना’ स्वाभाविक और सटीक है।
- source_word: οἱ δύο μαθηταὶ αὐτοῦ
  choice: उनके दोनों शिष्य
  rationale: मूल यूनानी में संबंधवाचक सर्वनाम αὐτοῦ मौजूद है। ‘उनके दोनों शिष्य’ उसे बनाए रखता है और पिछले पदों के अनुसार उसका संकेत यूहन्ना बपतिस्मा देनेवाले की ओर है।
- source_word: λαλοῦντος
  choice: उन्हें यह कहते
  rationale: वर्तमान कृदंत उनके सुनने के समय चल रही वाणी को दर्शाता है। ‘उन्हें यह कहते सुना’ आधुनिक हिन्दी में इस समकालिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἠκολούθησαν
  choice: पीछे हो लिए
  rationale: यह तत्काल यीशु के पीछे चल पड़ने को बताता है, पर शिष्य बनकर अनुसरण करने की कथात्मक प्रतिध्वनि भी बनाए रखता है।
- source_word: τῷ Ἰησοῦ
  choice: यीशु के पीछे
  rationale: ἀκολουθέω के साथ सम्प्रदान कारक उस व्यक्ति को दर्शाता है जिसका अनुसरण किया गया। हिन्दी मुहावरे में ‘यीशु के पीछे हो लिए’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: αὐτοῦ (‘उनके’) का संदर्भ
  choice: संदर्भ को यूहन्ना बपतिस्मा देनेवाला समझा गया है, जबकि मुख्य पाठ में मूल सर्वनाम रखा गया है।
  alternative: मुख्य पाठ में सीधे ‘यूहन्ना के दोनों शिष्य’ कहना।
  rationale: यूहन्ना 1:35–36 में यूहन्ना अपने दो शिष्यों के साथ खड़ा है और यीशु के विषय में बोलता है। इसलिए संदर्भ यूहन्ना है; फिर भी ‘उनके’ रखकर यूनानी की अभिव्यक्ति को अनावश्यक रूप से स्पष्ट नाम में नहीं बदला गया।
- issue: ‘पीछे हो लिए’ का अर्थ-क्षेत्र
  choice: भौतिक रूप से पीछे चलने और आगे विकसित होने वाले शिष्यत्व—दोनों की संभावना खुली रखी गई है।
  alternative: केवल ‘उनका शिष्य बन गए’ कहना।
  rationale: इस स्थल पर तत्काल घटना यीशु के पीछे चलना है; केवल औपचारिक शिष्यत्व कहना कथन को समय से पहले धर्मवैचारिक रूप से निश्चित कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पीछे हो लिए’ सामान्य पाठक के लिए स्वाभाविक है और मूल क्रिया के शाब्दिक तथा शिष्यत्व-संबंधी दोनों संकेतों को सुरक्षित रखता है।
