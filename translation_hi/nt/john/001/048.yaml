language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει αὐτῷ Ναθαναήλ· Πόθεν με γινώσκεις; ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Πρὸ τοῦ σε Φίλιππον φωνῆσαι ὄντα ὑπὸ τὴν συκῆν εἶδόν σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/048.yaml
  text: Nathanael said to him[a], “How do you know me?” Jesus answered and said to him, “Before Philip called you, while you were under the fig tree, I saw you.”
translation:
  language: hi
  text: नतनएल ने उनसे कहा, “आप मुझे कैसे[a] जानते हैं?” यीशु ने उसे उत्तर दिया और कहा, “फिलिप्पुस के तुम्हें बुलाने से पहले, जब तुम अंजीर के पेड़ के नीचे थे, मैंने तुम्हें देखा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “आप मुझे कहाँ से जानते हैं?”
    reason: Πόθεν का मूल अर्थ ‘कहाँ से’ है; मुख्य पाठ में प्रसंगानुकूल हिन्दी ‘कैसे’ रखा गया है।
lexical_decisions:
- source_word: Πόθεν
  choice: कैसे
  rationale: शाब्दिक अर्थ ‘कहाँ से’ है, पर γινώσκεις के साथ यह यीशु के नतनएल को जानने के आधार या रीति के विषय में प्रश्न करता है। ‘कैसे’ आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: γινώσκεις
  choice: जानते हैं
  rationale: यहाँ व्यक्ति के विषय में ज्ञान या परिचय व्यक्त होता है। ‘जानते हैं’ सटीक, सामान्य और प्रसंगानुकूल है।
- source_word: ἀπεκρίθη ... καὶ εἶπεν αὐτῷ
  choice: उसे उत्तर दिया
  rationale: यूनानी की उत्तर देने और कहने की संयुक्त अभिव्यक्ति का अर्थ स्वाभाविक हिन्दी में ‘उत्तर दिया’ से स्पष्ट रूप से व्यक्त होता है; दोनों क्रियाओं को यांत्रिक रूप से दोहराने से हिन्दी अस्वाभाविक होती।
- source_word: Πρὸ τοῦ σε Φίλιππον φωνῆσαι
  choice: फिलिप्पुस के तुम्हें बुलाने से पहले
  rationale: Πρὸ τοῦ और infinitive पूर्वकालिक संबंध बताते हैं। यह हिन्दी रचना उसी संबंध को स्पष्ट और सहज रूप में रखती है।
- source_word: ὄντα ὑπὸ τὴν συκῆν
  choice: जब तुम अंजीर के पेड़ के नीचे थे
  rationale: सहभागी कृदन्त उस परिस्थिति को बताता है जिसमें यीशु ने नतनएल को देखा। ‘जब ... थे’ हिन्दी में उसका स्वाभाविक कालिक-परिस्थितिजन्य रूप है।
- source_word: εἶδόν σε
  choice: मैंने तुम्हें देखा था
  rationale: यूनानी aorist एक पूर्ण भूतकालीन घटना बताता है। हिन्दी में पहले से बताए गए ‘बुलाने से पहले’ वाले समय-संबंध के कारण ‘देखा था’ स्वाभाविक है और पूर्ववर्ती घटना को स्पष्ट रखता है।
- source_word: συκῆν
  choice: अंजीर का पेड़
  rationale: यह συκῆ का प्रचलित और सटीक हिन्दी अर्थ है; निश्चित लेख को प्रसंगानुसार ‘पेड़’ के एक पहचाने हुए संदर्भ से व्यक्त किया गया है।
theological_decisions:
- issue: नतनएल के विषय में यीशु के ज्ञान का स्वरूप
  choice: यीशु के कथन को सीधे रूप में रखा गया है और ज्ञान की रीति की व्याख्या नहीं जोड़ी गई।
  alternative: अनुवाद में इसे स्पष्टतः अलौकिक पूर्वज्ञान बताना, या इसे केवल साधारण पूर्व-दर्शन के रूप में सीमित करना।
  rationale: पद बताता है कि यीशु ने फिलिप्पुस के बुलाने से पहले नतनएल को देखा था, पर यह नहीं बताता कि उन्होंने कैसे देखा या जाना। इसलिए अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। नतनएल की ओर से यीशु के लिए आदरसूचक ‘आप’ रखा गया है, जबकि यीशु के संबोधन में स्वाभाविक ‘तुम’ प्रयुक्त है। नामों के लिए प्रचलित रूप ‘नतनएल’ और ‘फिलिप्पुस’ अपनाए गए हैं।
