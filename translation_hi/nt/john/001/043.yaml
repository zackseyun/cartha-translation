base_translation:
  language: en
  yaml_path: translation/nt/john/001/043.yaml
  text: The next day he wanted to go out into Galilee[a], and Jesus finds Philip and says to him[c][b], “Follow me.”
translation:
  language: hi
  text: अगले दिन यीशु ने गलील जाने की इच्छा की। वे फिलिप्पुस को पाते हैं और उससे कहते हैं,[a] “मेरे पीछे चलो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पाते हैं” और “कहते हैं” यूनानी में वर्तमान काल में हैं; कथा को सजीव बनाने वाला यह ऐतिहासिक वर्तमान है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे पीछे चलो” का अर्थ यीशु के साथ चलना और व्यापक रूप से उनका शिष्य बनना—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: अगले दिन
  rationale: यह स्वाभाविक हिन्दी में कथा के अगले दिन को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἠθέλησεν
  choice: इच्छा की
  rationale: यह θέλω के इच्छा अथवा अभिप्राय के भाव को रखता है और ‘निर्णय किया’ जैसी अधिक निश्चित व्याख्या नहीं जोड़ता।
- source_word: ἐξελθεῖν εἰς τὴν Γαλιλαίαν
  choice: गलील प्रदेश में जाने
  rationale: हिन्दी में यह गंतव्य की ओर जाने और उस क्षेत्र में प्रवेश करने, दोनों के लिए स्वाभाविक है; ‘बाहर निकलने’ का अलग अनुवाद यहाँ बोझिल होता।
- source_word: εὑρίσκει
  choice: पाते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान की सजीवता बनाए रखने के लिए हिन्दी वर्तमान काल रखा गया है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यह भी ऐतिहासिक वर्तमान है; वर्तमान काल मूल कथन की तात्कालिकता सुरक्षित रखता है।
- source_word: Φίλιππον
  choice: फिलिप्पुस
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे हो लो
  rationale: यह शारीरिक रूप से पीछे चलने और यीशु का शिष्य बनने के व्यापक आह्वान—दोनों अर्थों को स्वाभाविक हिन्दी में खुला रखता है।
theological_decisions:
- issue: फिलिप्पुस को यीशु की आज्ञा का आशय
  choice: “मेरे पीछे हो लो” के रूप में प्रत्यक्ष आह्वान
  alternative: केवल “मेरे साथ चलो” अर्थात यात्रा में साथ आने का निमंत्रण
  rationale: संदर्भ में वास्तविक यात्रा भी है, पर सुसमाचारों में यह अभिव्यक्ति शिष्यत्व का आह्वान भी दर्शाती है। चुना हुआ अनुवाद दोनों स्तरों को बिना सीमित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आरम्भ में निहित कर्ता को संदर्भ के अनुसार ‘यीशु’ कहकर स्पष्ट किया गया है; बाद के ऐतिहासिक वर्तमान को आदरसूचक एकवचन क्रियाओं से रखा गया है।
