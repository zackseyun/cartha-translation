  text: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων· Ἐγὼ βαπτίζω ἐν ὕδατι· ⸀μέσος ὑμῶν ⸀ἕστηκεν ὃν ὑμεῖς οὐκ οἴδατε,
base_translation:
  language: en
  yaml_path: translation/nt/john/001/026.yaml
  text: John answered them[a], saying, “I baptize in water. Among you stands one whom you do not know,”
translation:
  language: hi
  text: यूहन्ना ने उन्हें उत्तर दिया, “मैं पानी में बपतिस्मा देता हूँ। तुम्हारे बीच[a] एक व्यक्ति खड़ा है, जिसे तुम नहीं जानते,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “तुम्हारे मध्य एक व्यक्ति खड़ा है, जिसे तुम नहीं जानते।”
    reason: ‘तुम्हारे बीच’ के लिए μέσος ὑμῶν का अधिक साहित्यिक, किंतु अर्थतः समतुल्य विकल्प।
lexical_decisions:
- source_word: ἀπεκρίθη αὐτοῖς ὁ Ἰωάννης λέγων
  choice: यूहन्ना ने उन्हें उत्तर दिया
  rationale: हिन्दी में ‘उत्तर दिया’ स्वाभाविक रूप से उत्तर देने की क्रिया और उसके बाद कही गई बात—दोनों को व्यक्त करता है; λέγων का अलग अनुवाद अनावश्यक और बोझिल होता।
- source_word: βαπτίζω
  choice: बपतिस्मा देता हूँ
  rationale: ‘बपतिस्मा’ हिन्दी मसीही प्रयोग में स्थापित शब्द है और यहाँ ‘डुबोना’ कहकर विधि को अनावश्यक रूप से संकीर्ण या सांप्रदायिक नहीं बनाता।
- source_word: ἐν ὕδατι
  choice: पानी में
  rationale: ἐν के स्थानगत रूप को निकटता से बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: μέσος ὑμῶν
  choice: तुम्हारे बीच
  rationale: समूह के मध्य उपस्थित होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἕστηκεν
  choice: खड़ा है
  rationale: यूनानी पूर्णकाल के वर्तमान परिणामी/स्थितिमूलक भाव को हिन्दी का वर्तमान अवस्था-सूचक रूप सहजता से व्यक्त करता है।
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: जिसे तुम नहीं जानते
  rationale: οἶδα का सामान्य अर्थ ‘जानना’ सुरक्षित रहता है; ‘पहचानते’ कहने से अर्थ अनावश्यक रूप से केवल पहचान तक सीमित हो सकता था।
- source_word: ὁ Ἰωάννης
  choice: यूहन्ना
  rationale: मूल पाठ की तरह केवल नाम रखा गया है; ‘बपतिस्मा देनेवाला’ जोड़ना इस पद में अनुपस्थित सूचना जोड़ देता।
theological_decisions:
- issue: बीच में खड़े अनाम व्यक्ति की पहचान
  choice: एक ऐसा व्यक्ति
  alternative: मसीह / वह
  rationale: निकटवर्ती प्रसंग अंततः उसकी पहचान स्पष्ट करता है, पर यह पद स्वयं उसे नाम नहीं देता। अनिश्चित और मानवीय संदर्भ वाला रूप कथात्मक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य-विन्यास हिन्दी के अनुरूप रखा गया है और मूल पाठ की अस्पष्टता को नहीं सुलझाया गया।
