  text: θεὸν οὐδεὶς ἑώρακεν πώποτε· ⸂μονογενὴς θεὸς⸃ ὁ ὢν εἰς τὸν κόλπον τοῦ πατρὸς ἐκεῖνος ἐξηγήσατο.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/018.yaml
  text: No one has ever seen God[a]; the one and only God, who is in the bosom of the Father[c][b], has made him known.
translation:
  language: hi
  text: परमेश्वर को किसी ने कभी नहीं देखा; एकमात्र परमेश्वर[a], जो पिता की गोद में है[b], उसी ने उसे प्रकट किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाण्डुलिपियों में “एकमात्र परमेश्वर” के स्थान पर “एकमात्र पुत्र” (या “एकलौता पुत्र”) है।
    reason: textual_variant
  - marker: b
    text: अथवा “पिता के पास।” यूनानी में शाब्दिक रूप से “पिता की गोद में” है, जो अत्यन्त घनिष्ठ निकटता व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: अथवा “उसे ज्ञात कराया है” या “उसकी व्याख्या की है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: θεὸν
  choice: परमेश्वर को
  rationale: यह ἑώρακεν का कर्म है और यहाँ θεός निरपेक्ष रूप से परमेश्वर को सूचित करता है।
- source_word: οὐδεὶς ... πώποτε
  choice: किसी ने कभी नहीं
  rationale: सार्वभौमिक निषेध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἑώρακεν
  choice: नहीं देखा
  rationale: πώποτε के साथ यूनानी पूर्णकाल का भाव हिन्दी में ‘कभी नहीं देखा’ से स्वाभाविक रूप से आता है।
- source_word: μονογενὴς θεὸς
  choice: एकमात्र परमेश्वर
  rationale: मुद्रित SBLGNT पाठ में θεός है; μονογενής यहाँ अद्वितीय या एकमात्र होने का भाव देता है, न कि अनिवार्य रूप से उत्पन्न किए जाने का।
- source_word: ὁ ὢν
  choice: जो ... है
  rationale: संज्ञात्मक कृदन्त को पूर्ववर्ती पद का वर्णन करने वाले स्वाभाविक सम्बन्धवाचक उपवाक्य के रूप में रखा गया है।
- source_word: εἰς τὸν κόλπον τοῦ πατρὸς
  choice: पिता की गोद में
  rationale: κόλπος की निकटता और आत्मीयता की देहात्मक उपमा को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐκεῖνος
  choice: उसी ने
  rationale: बलाघाती संकेतवाचक सर्वनाम का जोर सुरक्षित रखते हुए हिन्दी में पूर्वोक्त व्यक्ति की ओर स्पष्ट संकेत करता है।
- source_word: ἐξηγήσατο
  choice: उसे प्रकट किया है
  rationale: क्रिया के समझाने, वर्णन करने और ज्ञात कराने के अर्थक्षेत्र में प्रसंगानुकूल प्रकाशन का भाव स्पष्ट करता है।
theological_decisions:
- issue: μονογενὴς θεὸς बनाम ὁ μονογενὴς υἱός का पाठांतर
  choice: मुख्य पाठ में SBLGNT के अनुसार ‘एकमात्र परमेश्वर’
  alternative: ‘एकमात्र पुत्र’ अथवा ‘एकलौता पुत्र’
  rationale: दिए गए मूल पाठ का अनुसरण किया गया है; महत्वपूर्ण मसीह-विषयक पाठांतर को पादटिप्पणी में पारदर्शी रूप से सुरक्षित रखा गया है।
- issue: μονογενής का अर्थ
  choice: ‘एकमात्र’
  alternative: ‘एकलौता’ अथवा ‘एकमात्र उत्पन्न’
  rationale: यह चयन अद्वितीयता के प्रमुख शब्दार्थ को व्यक्त करता है और शब्द में अपने-आप ‘जन्मे/उत्पन्न’ होने का अर्थ आरोपित नहीं करता।
- issue: ἐξηγήσατο की प्रकाशनात्मक शक्ति
  choice: ‘उसे प्रकट किया है’
  alternative: ‘उसका वर्णन किया है’ अथवा ‘उसे ज्ञात कराया है’
  rationale: वाक्य के सन्दर्भ में पुत्र द्वारा परमेश्वर को मनुष्यों पर प्रकट करने का व्यापक भाव आता है; वैकल्पिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पिता की गोद में’ मूल उपमा को बचाता है; ‘उसी ने’ यूनानी ἐκεῖνος के बलाघात को स्वाभाविक हिन्दी में व्यक्त करता है। पाठांतर की पादटिप्पणी का संकेत सम्बन्धित विवादित पद के तुरन्त बाद न रखकर वचन के अंत में है, फिर भी मुख्य पाठ में [a] स्पष्ट रूप से उपस्थित है।
