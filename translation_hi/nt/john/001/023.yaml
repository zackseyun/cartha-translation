reference: John 1:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔφη· Ἐγὼ φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Εὐθύνατε τὴν ὁδὸν κυρίου, καθὼς εἶπεν Ἠσαΐας ὁ προφήτης.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/023.yaml
  text: He said[a], “I am a voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ just as Isaiah the prophet said.”
translation:
  language: hi
  text: उसने कहा[a], “मैं जंगल में पुकारने वाले की आवाज़ हूँ, ‘प्रभु का मार्ग सीधा करो,’ जैसा कि यशायाह भविष्यद्वक्ता ने कहा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्यांश में ‘जंगल में’ को ‘आवाज़’ से भी जोड़ा जा सकता है: “मैं जंगल में एक पुकारने वाले की आवाज़ हूँ।” पर मुख्य पाठ वाला अर्थ यहाँ अधिक स्वाभाविक है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφη
  choice: उसने कहा
  rationale: संवाद के प्रसंग में यह सामान्य और स्वाभाविक कथन-सूचक रूप है।
- source_word: Ἐγὼ φωνὴ
  choice: मैं ... आवाज़ हूँ
  rationale: स्पष्ट सर्वनाम से आत्म-पहचान का बल बना रहता है; हिन्दी में विधेय के साथ अलग अनिश्चित उपपद की आवश्यकता नहीं है।
- source_word: βοῶντος
  choice: पुकारने वाले की
  rationale: सम्बन्धकारक कृदन्त को ‘आवाज़’ से जोड़ता है और ऊँची, सार्वजनिक भविष्यद्वाणीपूर्ण पुकार का भाव रखता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: जंगल में
  rationale: ‘जंगल’ आधुनिक हिन्दी में निर्जन वन-प्रदेश का स्वाभाविक बाइबलीय पद है और केवल रेतीले मरुस्थल तक अर्थ को सीमित नहीं करता।
- source_word: Εὐθύνατε τὴν ὁδὸν
  choice: मार्ग सीधा करो
  rationale: आज्ञार्थक बल, मार्ग की प्रतिमा और उसके रूपकात्मक अर्थ—तीनों को संक्षिप्त तथा स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: κυρίου
  choice: प्रभु का
  rationale: यशायाह के उद्धरण में κύριος के वाचाई और धर्मवैज्ञानिक भार को बनाए रखता है।
- source_word: καθὼς εἶπεν Ἠσαΐας ὁ προφήτης
  choice: ठीक जैसा यशायाह भविष्यद्वक्ता ने कहा था
  rationale: καθὼς के अनुरूप सटीक समानता व्यक्त करता है और हिन्दी में उद्धरण के पूर्व कथन के लिए पूर्ण भूतकाल स्वाभाविक है।
theological_decisions:
- issue: यशायाह के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ उद्धृत भविष्यद्वाणी के वाचाई संकेत और यूहन्ना के प्रसंग में उसके धर्मवैज्ञानिक भार को सुरक्षित रखता है; ‘स्वामी’ यहाँ अर्थ को अनावश्यक रूप से सामान्य बना देगा।
- issue: ‘जंगल में’ का वाक्यगत सम्बन्ध
  choice: जंगल में पुकारने वाले की आवाज़
  alternative: जंगल में एक आवाज़, जो पुकारती है
  rationale: मुख्य पाठ सबसे स्वाभाविक रचना अपनाता है, जिसमें जंगल में पुकारने वाला व्यक्ति है; यूनानी पदक्रम दूसरी व्याकरणिक सम्भावना की गुंजाइश देता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। ‘जंगल’, ‘मार्ग’, ‘प्रभु’ और ‘भविष्यद्वक्ता’ परिचित बाइबलीय शब्द हैं, पर वाक्यरचना सामान्य आधुनिक हिन्दी की है।
