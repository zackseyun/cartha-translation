id: JHN.1.21
reference: John 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτόν· Τί οὖν; ⸂σὺ Ἠλίας εἶ⸃; καὶ λέγει· Οὐκ εἰμί. Ὁ προφήτης εἶ σύ; καὶ ἀπεκρίθη· Οὔ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/021.yaml
  text: And they asked him[a], “What then? Are you Elijah?” And he says, “I am not.” “Are you the Prophet?” And he answered[b], “No.”
translation:
  language: hi
  text: और उन्होंने उससे पूछा, “तो फिर क्या? क्या तुम एलिय्याह हो?” वह कहता है[a], “मैं नहीं हूँ।” “क्या तुम वह नबी[b] हो?” उसने उत्तर दिया, “नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ऐतिहासिक वर्तमान काल है: “वह कहता है”; यह कथन को सजीव बनाने वाली कथाशैली है।'
    reason: lexical_alternative
  - marker: b
    text: “वह नबी” संभवतः मूसा के समान आनेवाले उस अपेक्षित नबी की ओर संकेत करता है जिसका उल्लेख व्यवस्थाविवरण 18:15, 18 में है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἠρώτησαν
  choice: पूछा
  rationale: ἐρωτάω के सामान्य कथात्मक अर्थ को सहज और सीधी आधुनिक हिन्दी में व्यक्त करता है; इसमें अनावश्यक कठोरता नहीं जोड़ी गई।
- source_word: Τί οὖν;
  choice: तो फिर क्या?
  rationale: οὖν पिछले उत्तरों के आधार पर आगे बढ़ते प्रश्न को दिखाता है, और यह रूप यूनानी की संक्षिप्तता तथा अचानकपन को बनाए रखता है।
- source_word: σὺ Ἠλίας εἶ
  choice: क्या तुम एलिय्याह हो?
  rationale: प्रश्न का स्वाभाविक हिन्दी रूप है; σὺ का बल ‘तुम’ से पर्याप्त रूप से प्रकट होता है और Ἠλίας के लिए प्रचलित हिन्दी नाम ‘एलिय्याह’ रखा गया है।
- source_word: Οὐκ εἰμί
  choice: मैं नहीं हूँ
  rationale: मूल का उत्तर संक्षिप्त और स्पष्ट है; इसमें ‘वह’ या कोई अन्य पूरक जोड़कर अर्थ का विस्तार नहीं किया गया।
- source_word: Ὁ προφήτης
  choice: वह नबी
  rationale: निश्चित उपपद ὁ किसी पहचाने हुए, अपेक्षित नबी की ओर संकेत करता है। ‘वह नबी’ इस विशिष्टता को बनाए रखता है, पर उसकी पहचान को मुख्य पाठ में निर्णीत नहीं करता।
- source_word: λέγει
  choice: वह कहता है
  rationale: वर्तमान काल के ऐतिहासिक प्रयोग को सुरक्षित रखते हुए यूहन्ना की सजीव कथाशैली को दर्शाता है।
- source_word: ἀπεκρίθη
  choice: उसने उत्तर दिया
  rationale: यह सामान्य कथात्मक उत्तर-सूचक क्रिया का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: Οὔ
  choice: नहीं
  rationale: स्वतंत्र नकारात्मक उत्तर की संक्षिप्तता और दृढ़ता को ज्यों का त्यों रखता है।
theological_decisions:
- issue: ‘वह नबी’ की पहचान
  choice: मुख्य पाठ में ‘वह नबी’ रखा गया है।
  alternative: इसे स्पष्ट रूप से व्यवस्थाविवरण 18 में मूसा के समान आनेवाले नबी के रूप में पहचानना, अथवा सामान्य अर्थ में ‘कोई नबी’ कहना।
  rationale: Ὁ προφήτης एक विशिष्ट अपेक्षित व्यक्ति का संकेत देता है, पर इस पद में उसकी पहचान खुलकर नहीं बताई गई। अनुवाद इस ऐतिहासिक और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: एलिय्याह होने के विषय में यूहन्ना का इनकार
  choice: इनकार को सीधे ‘मैं नहीं हूँ’ के रूप में रखा गया है।
  alternative: ‘मैं स्वयं एलिय्याह नहीं हूँ’ जैसा स्पष्टीकरण जोड़ना या अन्य सुसमाचारों के प्रकाश में इसे समन्वित करना।
  rationale: यह पद यूहन्ना का सीधा इनकार प्रस्तुत करता है। दूसरे पदों के साथ उसका धर्मवैज्ञानिक सामंजस्य मुख्य अनुवाद में जोड़ना मूल से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की संक्षिप्तता तथा मूल के बदलते कथात्मक काल को सुरक्षित रखा गया है। ‘नबी’ सामान्य आधुनिक हिन्दी में सुबोध है और προφήτης को केवल भविष्य बताने वाले व्यक्ति तक सीमित नहीं करता।
