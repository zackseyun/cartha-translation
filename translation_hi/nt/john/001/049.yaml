language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸂αὐτῷ Ναθαναήλ⸃· Ῥαββί, σὺ εἶ ὁ υἱὸς τοῦ θεοῦ, σὺ ⸂βασιλεὺς εἶ⸃ τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/049.yaml
  text: Nathanael answered him, “Rabbi, you are the Son of God; you are the King of Israel.”
translation:
  language: hi
  text: नतनएल ने उसे उत्तर दिया, “रब्बी, आप परमेश्वर के पुत्र हैं; आप इस्राएल के राजा हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद के वर्णन में ἀποκρίνομαι का सीधा और स्वाभाविक हिन्दी रूप; यह कथात्मक शैली की गरिमा बनाए रखता है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यहूदी संबोधन और पहली सदी के सांस्कृतिक संदर्भ को सुरक्षित रखने के लिए उपाधि का प्रचलित लिप्यंतरण रखा गया है; केवल ‘गुरु’ कहने से उसका विशिष्ट यहूदी स्वरूप घट जाता।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: सुनिश्चित उपाधि का सीधा रूप, जो कथन की मसीही और ख्रीस्त-संबंधी शक्ति को न तो घटाता है, न व्याख्यात्मक रूप से बढ़ाता है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: मूल शब्द का सीधा हिन्दी समतुल्य; ‘इस्राएल के’ से जुड़कर यह स्वाभाविक रूप से निश्चित राजकीय उपाधि बनता है।
- source_word: τοῦ Ἰσραήλ
  choice: इस्राएल के
  rationale: सम्बन्धकारक का औपचारिक और स्वाभाविक हिन्दी रूप, जो ‘इस्राएल पर’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: σὺ εἶ … σὺ … εἶ
  choice: आप … हैं; आप … हैं
  rationale: दोनों खंडों में सर्वनाम और क्रिया दोहराकर यूनानी के बलयुक्त, समानांतर अंगीकार को सुरक्षित रखा गया है; आधुनिक सम्मानसूचक ‘आप’ संबोधन को स्वाभाविक बनाता है।
- source_word: Ναθαναήλ
  choice: नतनएल
  rationale: नाम को उसके यूनानी रूप के निकट, मानक देवनागरी लिप्यंतरण में दिया गया है।
theological_decisions:
- issue: ‘परमेश्वर के पुत्र’ के रूप में नतनएल के अंगीकार की ख्रीस्त-संबंधी शक्ति
  choice: उपाधि को ज्यों का त्यों ‘परमेश्वर के पुत्र’ रखा गया है।
  alternative: ‘परमेश्वर का एक पुत्र’ अथवा ऐसा परिभाषात्मक विस्तार जो बाद की धर्मवैज्ञानिक भाषा जोड़ दे
  rationale: यूहन्ना के सुसमाचार में यह निश्चित और प्रबल उपाधि है। अनुवाद न इसे अनिश्चित बनाता है, न मूल कथन से आगे जाकर इसकी व्याख्या करता है।
- issue: ‘इस्राएल के राजा’ का राजकीय-मसीही अर्थ
  choice: स्पष्ट उपाधि ‘इस्राएल के राजा’ रखी गई है।
  alternative: ‘इस्राएल पर शासन करनेवाले’ या अन्य व्याख्यात्मक रूप
  rationale: यह रूप इस्राएल की राजकीय-मसीही अपेक्षा की अनुगूँज को सुरक्षित रखता है और मूल सम्बन्धकारक संरचना के निकट रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘रब्बी’ ऐतिहासिक यहूदी संदर्भ बनाए रखता है, जबकि सम्मानसूचक ‘आप’ सीधे संबोधन को वर्तमान मानक हिन्दी में स्वाभाविक बनाता है। समानांतर वाक्य-रचना अंगीकार के जोर को सुरक्षित रखती है।
