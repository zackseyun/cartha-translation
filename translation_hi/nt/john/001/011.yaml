- from: वह अपनी ही जगह में आया[a], पर उसके अपने लोगों ने उसे ग्रहण नहीं किया[b]।
  to: वह उसमें आया जो उसका अपना था[a], पर उसके अपने लोगों ने उसे ग्रहण नहीं किया[b]।
  rationale: The revision replaces the awkward and overly locative “अपनी ही जगह में” with a relative construction that represents the broad sense of τὰ ἴδια (“what was his own”) without identifying it too narrowly as a place, home, or people. The footnote supplies narrower contextual possibilities while explicitly retaining the grammatical contrast with the following masculine plural. The remainder faithfully and naturally conveys the Greek.
