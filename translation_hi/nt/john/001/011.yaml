  yaml_path: translation/nt/john/001/011.yaml
  text: He came to his own[b][a], and his own people did not receive him.
translation:
  language: hi
  text: वह उसमें आया जो उसका अपना था[a], पर उसके अपने लोगों ने उसे ग्रहण नहीं किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने ही क्षेत्र में आया” या “वह अपने घर में आया।” यूनानी में यहाँ नपुंसकलिंग बहुवचन है; आगे “उसके अपने लोग” के लिए पुल्लिंग बहुवचन प्रयुक्त हुआ है।
    reason: alternative_reading
  - marker: b
    text: या, “उसे स्वीकार नहीं किया” अथवा “उसका स्वागत नहीं किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τὰ ἴδια
  choice: अपनी ही जगह में
  rationale: नपुंसकलिंग बहुवचन τὰ ἴδια उन वस्तुओं, स्थान या क्षेत्र की ओर संकेत करता है जो उसके अपने थे। ‘अपनी ही जगह में’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल घर या केवल लोगों तक सीमित नहीं करता।
- source_word: ἦλθεν
  choice: आया
  rationale: ἔρχομαι के अओरिस्ट का सरल और प्रसंगानुकूल अनुवाद ‘आया’ है।
- source_word: οἱ ἴδιοι
  choice: उसके अपने लोग
  rationale: पुल्लिंग बहुवचन स्पष्टतः व्यक्तियों को दर्शाता है। यह पहले नपुंसकलिंग प्रयोग से भेद बनाए रखता है।
- source_word: παρέλαβον
  choice: ग्रहण नहीं किया
  rationale: यहाँ παραλαμβάνω किसी व्यक्ति को स्वीकार करने, अपनाने या स्वागतपूर्वक अपने पास लेने का भाव रखता है। ‘ग्रहण नहीं किया’ अर्थ की व्यापकता बनाए रखता है।
- source_word: αὐτόν
  choice: उसे
  rationale: सर्वनाम प्रसंग में वचन/ज्योति की ओर संकेत करता है और हिन्दी में स्वाभाविक रूप से ‘उसे’ है।
theological_decisions:
- issue: ἴδιος के दो भिन्न रूपों का संकेत
  choice: पहला प्रयोग उसकी अपनी जगह या अधिकार-क्षेत्र की ओर, और दूसरा उसके अपने लोगों की ओर संकेत करता है।
  alternative: दोनों प्रयोगों को केवल ‘अपने लोगों’ के अर्थ में लेना, या पहले को विशेष रूप से ‘अपने घर’ तक सीमित करना।
  rationale: यूनानी में पहले नपुंसकलिंग बहुवचन τὰ ἴδια और फिर पुल्लिंग बहुवचन οἱ ἴδιοι है। अनुवाद इस जानबूझकर किए गए भेद को सुरक्षित रखता है, पर पहले पदबंध का आशय अत्यधिक संकीर्ण नहीं करता।
- issue: παρέλαβον में अस्वीकार और स्वागत न करने का भाव
  choice: ग्रहण नहीं किया
  alternative: स्वीकार नहीं किया; स्वागत नहीं किया
  rationale: ‘ग्रहण’ स्वीकार करने और अपने पास लेने—दोनों अर्थों को समेटता है तथा किसी एक धार्मिक व्याख्या को अनावश्यक रूप से प्रमुख नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी ही जगह’ और ‘उसके अपने लोग’ के द्वारा यूनानी के नपुंसकलिंग तथा पुल्लिंग बहुवचन का अंतर पठनीय हिन्दी में सुरक्षित रखा गया है।
