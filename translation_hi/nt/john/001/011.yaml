  naturalness: “अपनी ही जगह में आया” is not natural modern standard Hindi; “जगह में” should not be used here. “वह उसमें आया जो उसका अपना था” is grammatical, retains the source’s breadth, and allows the following phrase to identify people distinctly.
  terminology: “उसके अपने लोग” appropriately represents the masculine plural and preserves the contrast. “ग्रहण नहीं किया” is a suitably formal, broad rendering; the footnote gives accessible alternatives.
