  source_fidelity: 'The causal interrogative is conveyed accurately: “क्या तुम इसलिए विश्वास करते हो कि…?” preserves the rhetorical question without making it a rebuke. “अंजीर के पेड़ के नीचे” correctly renders ὑποκάτω τῆς συκῆς. However, “बड़े काम” narrows the substantival neuter plural μείζω (''greater things'') to deeds/works, an interpretive specification absent from the Greek.'
  naturalness: The Hindi is clear, modern, and appropriately dignified. The direct quotation within Jesus’ speech is natural and makes the second ὅτι clear. “बड़ी बातें” is a natural broad rendering in this context and avoids the unnecessary restriction created by “काम.”
  terminology: '“विश्वास करते हो” is suitable Johannine terminology. “यीशु,” “अंजीर का पेड़,” and the future “देखोगे” are well chosen. The comparative should remain broad: “इनसे भी बड़ी बातें,” not “बड़े काम.”'
  issues:
