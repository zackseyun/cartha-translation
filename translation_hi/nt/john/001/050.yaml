    issue: “मेज़ω τούτων” is translated as “इनसे भी बड़े काम.”
    rationale: The Greek means 'greater things' and does not supply 'works' (ἔργα). 'काम' interprets the referent more narrowly than the source. “बड़ी बातें” retains the broad, intentionally unspecified reference.
