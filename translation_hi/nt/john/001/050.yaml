  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ὅτι εἶπόν σοι ⸀ὅτι εἶδόν σε ὑποκάτω τῆς συκῆς πιστεύεις; μείζω τούτων ⸀ὄψῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/050.yaml
  text: Jesus answered and said to him[a], “Because I told you that I saw you under the fig tree, do you believe? You will see greater things than these.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “क्या तुम इसलिए विश्वास करते हो कि मैंने तुमसे कहा, ‘मैंने तुम्हें अंजीर के पेड़ के नीचे देखा था’? तुम इनसे भी बड़ी बातें देखोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ
  choice: यीशु ने उसे उत्तर दिया
  rationale: यूनानी संवाद-सूत्र का स्वाभाविक हिन्दी रूप; ‘उत्तर दिया और कहा’ हिन्दी में अनावश्यक पुनरुक्ति लगेगी।
- source_word: Ὅτι ... πιστεύεις;
  choice: क्या तुम इसलिए विश्वास करते हो कि... ?
  rationale: पहला ὅτι कारण बताता है और प्रश्नवाचक πιστεύεις के साथ मिलकर कारणसूचक आलंकारिक प्रश्न बनाता है।
- source_word: ὅτι εἶδόν σε
  choice: कि मैंने तुमसे कहा, ‘मैंने तुम्हें ... देखा था’
  rationale: दूसरा ὅτι कथन की विषयवस्तु प्रस्तुत करता है। हिन्दी में प्रत्यक्ष उद्धरण इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὑποκάτω τῆς συκῆς
  choice: अंजीर के पेड़ के नीचे
  rationale: ठोस बिंब को स्पष्ट, सामान्य आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: πιστεύεις
  choice: विश्वास करते हो
  rationale: यूहन्ना में विश्वास की प्रमुख शब्दावली से संगति रखता है और यहाँ वर्तमान प्रश्न का स्वाभाविक हिन्दी रूप है।
- source_word: μείζω τούτων
  choice: इनसे भी बड़े काम
  rationale: नपुंसकलिंग बहुवचन का प्रसंगानुकूल संज्ञात्मक रूप; ‘काम’ आगामी चिन्हों और प्रकाशन के लिए स्वाभाविक है, जबकि तुलना का बहुवचन ‘इनसे’ सुरक्षित है।
- source_word: ὄψῃ
  choice: तुम ... देखोगे
  rationale: भविष्यकाल का सीधा और आधुनिक हिन्दी रूप।
theological_decisions:
- issue: πιστεύεις; में यीशु के प्रश्न का बल
  choice: 'कारण पूछता हुआ आलंकारिक प्रश्न: ‘क्या तुम इसलिए विश्वास करते हो...?’'
  alternative: ‘तुम इसलिए विश्वास करते हो कि...?’ अथवा कथनात्मक ‘तुम विश्वास करते हो क्योंकि...’
  rationale: यूनानी शब्दक्रम प्रश्न को समर्थन देता है, पर स्वर को कठोर फटकार के रूप में निश्चित नहीं करता। अनुवाद प्रश्न और उसकी हल्की चुनौती—दोनों को खुला रखता है।
- issue: μείζω τούτων का आशय
  choice: इनसे भी बड़े काम
  alternative: इनसे भी बड़ी बातें / चीज़ें
  rationale: मूल में नपुंसकलिंग बहुवचन जानबूझकर व्यापक है। ‘काम’ हिन्दी में दृश्य घटनाओं के लिए स्वाभाविक है, पर इसे केवल चमत्कारों तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। संवाद में स्वाभाविकता के लिए यूनानी ‘उत्तर दिया और कहा’ को ‘उत्तर दिया’ किया गया है। प्रश्न की वास्तविकता और संभावित हल्की चुनौती को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
