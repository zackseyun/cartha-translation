  text: πάντα δι’ αὐτοῦ ἐγένετο, καὶ χωρὶς αὐτοῦ ἐγένετο οὐδὲ ἕν. ὃ γέγονεν
base_translation:
  language: en
  yaml_path: translation/nt/john/001/003.yaml
  text: All things came into being through him[a], and apart from him not even one thing came into being that has come into being.
translation:
  language: hi
  text: सब कुछ उसी के द्वारा अस्तित्व में आया, और उससे अलग एक भी ऐसी वस्तु अस्तित्व में नहीं आई जो अस्तित्व में आई है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, पद 4 को यहाँ से आरम्भ करते हुए: “जो कुछ उसमें अस्तित्व में आया, वह जीवन था।”'
    reason: alternative_reading
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का आशय समस्त सृष्ट वस्तुओं को समेटता है। स्वाभाविक आधुनिक हिन्दी में ‘सब कुछ’ इसकी व्यापकता स्पष्ट करता है।
- source_word: δι’ αὐτοῦ
  choice: उसी के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम अथवा अभिकर्तृत्व बताता है। ‘के द्वारा’ वचन की गरिमा रखते हुए इस माध्यमात्मक अर्थ को व्यक्त करता है; ‘उसी’ बल भी बनाए रखता है।
- source_word: ἐγένετο
  choice: अस्तित्व में आया
  rationale: यहाँ γίνομαι किसी वस्तु के बनकर अस्तित्व में आने को सूचित करता है। यह अनुवाद साधारण निर्माण की अपेक्षा अस्तित्वारम्भ का अर्थ सुरक्षित रखता है।
- source_word: χωρὶς αὐτοῦ
  choice: उससे अलग
  rationale: χωρίς पृथकता अथवा किसी के बिना होने का भाव देता है। ‘उससे अलग’ किसी स्वतंत्र उद्गम के निषेध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐδὲ ἕν
  choice: एक भी ऐसी वस्तु … नहीं
  rationale: यह रचना οὐδέ और नपुंसकलिंग ἕν के प्रबल, सर्वसमावेशी निषेध को हिन्दी में सुरक्षित रखती है। ‘वस्तु’ जोड़ने से नपुंसकलिंग ‘एक’ का आशय स्पष्ट होता है।
- source_word: ὃ γέγονεν
  choice: जो अस्तित्व में आई है
  rationale: प्रदत्त विराम-चिह्न के अनुसार इसे पद 3 के साथ जोड़ा गया है। पूर्णकाल γέγονεν को ‘आई है’ से व्यक्त किया गया है, जिससे घटित होने और उसके वर्तमान परिणाम दोनों का संकेत मिलता है।
theological_decisions:
- issue: अन्तिम उपवाक्य ὃ γέγονεν का सम्बन्ध
  choice: 'इसे पद 3 के साथ जोड़ना: ‘एक भी ऐसी वस्तु अस्तित्व में नहीं आई जो अस्तित्व में आई है।’'
  alternative: 'इसे पद 4 के आरम्भ से जोड़ना: ‘जो कुछ उसमें अस्तित्व में आया, वह जीवन था।’'
  rationale: प्राचीन यूनानी पाण्डुलिपियों में मूल विराम-चिह्न न होने के कारण दोनों सम्बन्ध व्याकरणतः सम्भव हैं। मुख्य पाठ में SBLGNT के दिए हुए विराम और व्यापक रूप से स्वीकृत पठन का अनुसरण किया गया है; वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्वाभाविक और गरिमापूर्ण रखी गई है। ‘अस्तित्व में आया’ यूहन्ना की प्रस्तावना के सृष्टि-विषयक अर्थ को स्पष्ट करता है; पुनरावृत्ति मूल यूनानी की तर्कपूर्ण व्यापकता को बनाए रखने के लिए जानबूझकर रखी गई है।
