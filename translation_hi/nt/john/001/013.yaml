review_pass:
  verdict: revise
  source_fidelity: The draft retains the threefold contrast and correctly presents the birth as originating from God rather than natural human descent or procreative will. However, Hindi ‘रक्तों से’ is not an idiomatic way to convey Greek ἐξ αἱμάτων and risks suggesting literal quantities of blood rather than descent. ‘वंशों से,’ with a note preserving the striking Greek plural, conveys the source sense more clearly. The unqualified generic ‘पुरुष की इच्छा’ more closely reflects ἀνδρός than ‘किसी पुरुष की इच्छा.’
  naturalness: ‘जिनका जन्म न तो वंशों से, न देह की इच्छा से, न पुरुष की इच्छा से, बल्कि परमेश्वर से हुआ’ is natural, concise modern Hindi while retaining the deliberately parallel structure. ‘देह’ remains suitable here without importing a doctrine-specific sense.
  terminology: ‘परमेश्वर’ appropriately renders θεός in the established elevated biblical register. ‘देह’ is retained for σάρξ, and the footnote explains the plural form of αἱμάτων without forcing an unnatural literal plural into the Hindi main text.
  issues:
  - severity: medium
    issue: ‘रक्तों से’ is unnatural and potentially misleading in Hindi.
    rationale: Although αἱμάτων is formally plural, Hindi ‘रक्तों’ does not naturally signify lineage or parentage. The Greek idiom concerns natural descent; ‘वंशों से’ communicates this in modern Hindi, while the footnote can preserve the literal plural observation.
  - severity: low
    issue: ‘किसी पुरुष की इच्छा’ adds an unnecessary indefinite nuance.
    rationale: Greek ἀνδρός is anarthrous and generic in this construction. Hindi ‘पुरुष की इच्छा’ is the more direct generic equivalent and maintains the parallelism.
  revised_text: जिनका जन्म न तो वंशों[a] से, न देह की इच्छा से, न पुरुष की इच्छा से, बल्कि परमेश्वर से हुआ।
