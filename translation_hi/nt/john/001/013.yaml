  yaml_path: translation/nt/john/001/013.yaml
  text: who were born, not from bloods, nor from the will of the flesh, nor from the will of a man, but from God.
translation:
  language: hi
  text: जिनका जन्म न तो वंशों[a] से, न देह की इच्छा से, न पुरुष की इच्छा से, बल्कि परमेश्वर से हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘रक्तों’; यह असामान्य बहुवचन प्राकृतिक वंश या मानवीय माता-पिता से होने वाली उत्पत्ति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: जिनका
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में बताए गए लोगों से वाक्य को जोड़ता है; ‘जिनका जन्म’ हिन्दी में इस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐξ αἱμάτων
  choice: रक्तों से
  rationale: यूनानी में ‘रक्त’ का असामान्य बहुवचन है, जो प्राकृतिक वंश या मानवीय माता-पिता से उत्पत्ति की ओर संकेत करता है। मुख्य पाठ में बहुवचन सुरक्षित रखा गया है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: θελήματος
  choice: इच्छा
  rationale: यह शब्द मानवीय चाह या संकल्प को व्यक्त करता है और दोनों समानांतर वाक्यांशों में स्रोत की पुनरावृत्ति को बनाए रखता है।
- source_word: σαρκὸς
  choice: देह
  rationale: ‘देह’ प्रजनन से जुड़ी स्वाभाविक मानवीय प्रेरणा का संकेत देता है और यहाँ किसी विशिष्ट ‘पापी स्वभाव’ की व्याख्या आरोपित नहीं करता।
- source_word: ἀνδρὸς
  choice: किसी पुरुष
  rationale: यहाँ एक वयस्क पुरुष की मानवीय जनन-भूमिका अभिप्रेत है। ‘किसी पुरुष’ यूनानी एकवचन की अनिश्चितता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ θεοῦ
  choice: परमेश्वर से
  rationale: यह पूर्ववर्ती तीन मानवीय स्रोतों के विपरीत जन्म के दिव्य स्रोत को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγεννήθησαν
  choice: जन्म ... हुआ
  rationale: बहुवचन कर्ताओं के लिए संबंधवाचक रचना ‘जिनका जन्म ... हुआ’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के निष्क्रिय जन्म/उत्पत्ति भाव को सुरक्षित रखती है।
theological_decisions:
- issue: मानवीय उत्पत्ति और परमेश्वर से उत्पत्ति के बीच विरोध
  choice: पद प्राकृतिक वंश, देहगत प्रेरणा और पुरुष की इच्छा को नकारकर जन्म का स्रोत परमेश्वर को बताता है।
  alternative: इसे केवल जातीय वंश के निषेध के रूप में या बाद की किसी विशिष्ट संस्कारवादी अथवा तत्त्वमीमांसात्मक धारणा के अनुसार पढ़ा जा सकता है।
  rationale: तीन बार किया गया निषेध सामान्य मानवीय जन्म और परमेश्वर से प्राप्त जन्म के बीच व्यापक विरोध प्रस्तुत करता है। अनुवाद इस विरोध को बनाए रखता है, पर पुनर्जन्म की प्रक्रिया के विषय में कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘रक्तों’ जानबूझकर असामान्य है, क्योंकि मूल यूनानी का बहुवचन भी ध्यान खींचता है; पादटिप्पणी उसका मुहावरेदार आशय बताती है।
