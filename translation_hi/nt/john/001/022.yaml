base_translation:
  language: en
  yaml_path: translation/nt/john/001/022.yaml
  text: So they said to him, “Who are you, so that we may give an answer to those who sent us? What do you say about yourself?”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “तुम कौन हो? ताकि हम उन लोगों को उत्तर दे सकें जिन्होंने हमें भेजा है। तुम अपने विषय में क्या कहते हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले संवाद से आगे बढ़ते हुए परिणामसूचक या संक्रमणात्मक संबंध दिखाता है; ‘तब’ आधुनिक हिन्दी में सहज प्रवाह देता है।
- source_word: εἶπαν ... αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: प्रत्यक्ष कथन का स्वाभाविक और न्यूनतम व्याख्यात्मक हिन्दी रूप।
- source_word: Τίς εἶ;
  choice: तुम कौन हो?
  rationale: यूनानी के संक्षिप्त और सीधे पहचान-संबंधी प्रश्न को ज्यों का त्यों रखता है।
- source_word: ἵνα ἀπόκρισιν δῶμεν
  choice: हमें ... उत्तर देना है
  rationale: प्रेषकों को उत्तर देने के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में यह उनके दायित्व और प्रयोजन दोनों को स्पष्ट करता है।
- source_word: τοῖς πέμψασιν ἡμᾶς
  choice: उन लोगों को ... जिन्होंने हमें भेजा है
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी कृदंत का स्पष्ट और सहज हिन्दी रूप।
- source_word: τί λέγεις περὶ σεαυτοῦ;
  choice: तुम अपने विषय में क्या कहते हो?
  rationale: περί के विषय-संदर्भ और आत्मवाचक σεαυτοῦ दोनों को गरिमापूर्ण, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद सीधा, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘अपने विषय में’ को ‘अपने बारे में’ की अपेक्षा किंचित अधिक गरिमापूर्ण बाइबिलीय गद्य के लिए चुना गया है।
