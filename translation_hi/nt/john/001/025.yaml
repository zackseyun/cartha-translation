id: JHN.1.25
reference: John 1:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἠρώτησαν αὐτὸν καὶ εἶπαν αὐτῷ· Τί οὖν βαπτίζεις εἰ σὺ οὐκ εἶ ὁ χριστὸς ⸂οὐδὲ Ἠλίας οὐδὲ⸃ ὁ προφήτης;
base_translation:
  language: en
  yaml_path: translation/nt/john/001/025.yaml
  text: And they asked him and said to him[a], “Why then are you baptizing, if you are not the Messiah, nor Elijah[b], nor the Prophet?”
translation:
  language: hi
  text: उन्होंने उससे पूछकर कहा, “तो फिर तुम बपतिस्मा क्यों देते हो, यदि तुम न तो मसीह[a] हो, न एलिय्याह और न वह भविष्यद्वक्ता[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी उपाधि ख्रिस्तोस का अर्थ “अभिषिक्त जन” है; इसे “ख्रीस्त” भी कहा जाता है। यहाँ “मसीह” यहूदी मसीहाई प्रतीक्षा को व्यक्त करता है।
    reason: alternative_reading
  - marker: b
    text: “वह भविष्यद्वक्ता” संभवतः मूसा के समान आने वाले उस भविष्यद्वक्ता की ओर संकेत करता है जिसकी प्रतीक्षा की जाती थी; देखें व्यवस्थाविवरण 18:15।
    reason: cross_reference
lexical_decisions:
- source_word: ἠρώτησαν ... καὶ εἶπαν αὐτῷ
  choice: उन्होंने उससे पूछकर कहा
  rationale: यूनानी के दोनों कथन-क्रिया पदों को बनाए रखते हुए यह हिंदी में स्वाभाविक प्रश्न-परिचय देता है; केवल ‘पूछा’ कहने से εἶπαν छूट जाता, जबकि ‘पूछा और कहा’ अनावश्यक रूप से बोझिल लगता।
- source_word: Τί οὖν
  choice: तो फिर ... क्यों
  rationale: यहाँ τί कारण या आधार पूछता है और οὖν पिछले कथन से निष्कर्ष जोड़ता है; ‘तो फिर ... क्यों’ आधुनिक हिंदी में इसके प्रश्नात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: βαπτίζεις
  choice: बपतिस्मा देते हो
  rationale: वर्तमान काल यूहन्ना की जारी प्रथा पर प्रश्न करता है। ‘बपतिस्मा देना’ हिंदी मसीही प्रयोग में प्रचलित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός व्यक्तिगत नाम नहीं, अपेक्षित अभिषिक्त जन की उपाधि है। ‘मसीह’ यहूदी मसीहाई संदर्भ को सुरक्षित रखता है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: नाम का मानक हिंदी बाइबलीय रूप रखा गया है।
- source_word: ὁ προφήτης
  choice: वह भविष्यद्वक्ता
  rationale: निश्चित लेख एक पहचाने हुए, प्रतीक्षित व्यक्ति की ओर संकेत करता है। हिंदी में ‘वह’ इस विशिष्टता को बड़े अक्षर जैसी अंग्रेज़ी-आधारित युक्ति के बिना स्पष्ट करता है।
- source_word: οὐδὲ ... οὐδὲ
  choice: न तो ... न ... और न
  rationale: दोहराई गई निषेधात्मक समुच्चय-रचना को हिंदी की स्वाभाविक समानांतर संरचना में रखा गया है।
theological_decisions:
- issue: यूहन्ना के पहचान-संबंधी प्रश्न में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: संदर्भ में यह एक उपाधि और इस्राएल की प्रतीक्षा का संकेत है। ‘मसीह’ उस संदर्भ को बनाए रखता है और हिंदी में व्यापक रूप से पहचाना जाता है।
- issue: ὁ προφήτης को किसी विशिष्ट प्रतीक्षित व्यक्ति के रूप में प्रस्तुत करना
  choice: वह भविष्यद्वक्ता
  alternative: भविष्यद्वक्ता
  rationale: यूनानी निश्चित लेख और निकट संदर्भ इसे किसी सामान्य नबी के बजाय एक पहचानी हुई अपेक्षित हस्ती के रूप में रखते हैं; व्यवस्थाविवरण 18:15 इसकी संभावित पृष्ठभूमि है, पर पद स्वयं उस पहचान को पूरी तरह स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक प्रश्न के अनुकूल रखी गई है। ‘पूछकर कहा’ मूल के दो क्रिया पदों को स्वाभाविक हिंदी में समेटता है। ‘वह भविष्यद्वक्ता’ विशिष्टता दिखाता है, पर उसकी पहचान को पद की अपेक्षा अधिक निश्चित नहीं बनाता।
