source:
  edition: SBLGNT
  text: ⸀ἤγαγεν αὐτὸν πρὸς τὸν Ἰησοῦν. ἐμβλέψας αὐτῷ ὁ Ἰησοῦς εἶπεν· Σὺ εἶ Σίμων ὁ υἱὸς ⸀Ἰωάννου, σὺ κληθήσῃ Κηφᾶς (ὃ ἑρμηνεύεται Πέτρος).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/042.yaml
  text: He brought him to Jesus[a]. Looking at him, Jesus said, “You are Simon, the son of John[b]; you will be called Cephas” (which is translated Peter).
translation:
  language: hi
  text: वह उसे यीशु के पास लाया। यीशु ने उसे ध्यान से देखकर कहा, “तुम यूहन्ना[a] के पुत्र शमौन हो। तुम कैफा[b] कहलाओगे” (जिसका अनुवाद ‘पतरस’ किया जाता है)।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘यूहन्ना’ के स्थान पर ‘योना’ है; SBLGNT के मुख्य पाठ में ‘यूहन्ना’ है।
    reason: textual_variant
  - marker: b
    text: ‘कैफा’ सामी भाषा का नाम है, जिसके अनुरूप यूनानी नाम ‘पतरस’ है; दोनों में ‘चट्टान’ या ‘पत्थर’ का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤγαγεν
  choice: लाया
  rationale: यहाँ ἄγω का भूतकालिक रूप किसी व्यक्ति को दूसरे व्यक्ति के पास ले आने की पूर्ण हुई क्रिया बताता है; ‘लाया’ स्वाभाविक और सटीक है।
- source_word: πρὸς τὸν Ἰησοῦν
  choice: यीशु के पास
  rationale: πρός के साथ कर्मकारक यहाँ किसी व्यक्ति की ओर गति व्यक्त करता है; हिन्दी में ‘यीशु के पास’ इसका सहज समतुल्य है।
- source_word: ἐμβλέψας αὐτῷ
  choice: उसे ध्यान से देखकर
  rationale: ἐμβλέπω साधारण दृष्टि डालने से अधिक ध्यानपूर्वक देखने का भाव दे सकता है; यह अनुवाद उस भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Σὺ εἶ Σίμων
  choice: तुम ... शमौन हो
  rationale: स्पष्ट सर्वनाम σὺ की सीधी संबोधन-शैली हिन्दी में ‘तुम’ से बनी रहती है।
- source_word: ὁ υἱὸς Ἰωάννου
  choice: यूहन्ना के पुत्र
  rationale: मुख्य पाठ Ἰωάννου का अनुसरण किया गया है; वैकल्पिक पाठ ‘योना’ को पादटिप्पणी में रखा गया है।
- source_word: κληθήσῃ
  choice: कहलाओगे
  rationale: καλέω का भविष्यकालीन कर्मवाच्य नाम दिए जाने का भाव रखता है; ‘कहलाओगे’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Κηφᾶς
  choice: कैफा
  rationale: व्यक्तिनाम को अर्थानुवाद करने के बजाय हिन्दी की प्रचलित बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
- source_word: ὃ ἑρμηνεύεται Πέτρος
  choice: जिसका अनुवाद ‘पतरस’ है
  rationale: यूनानी पाठ स्वयं सामी नाम का यूनानी नाम से स्पष्टीकरण देता है; दोनों को व्यक्तिनाम के रूप में रखते हुए व्याख्यात्मक कोष्ठक सुरक्षित रखा गया है।
theological_decisions:
- issue: कैफा और पतरस के व्याख्यात्मक संबंध का अनुवाद
  choice: 'मुख्य पाठ में दोनों को व्यक्तिनाम के रूप में रखना: ‘कैफा’ ... ‘पतरस’'
  alternative: अर्थ का सीधा अनुवाद ‘चट्टान’ या ‘पत्थर’ करना
  rationale: यह पद शमौन को नया नाम दिए जाने पर केंद्रित है। मूल पाठ सामी नाम को उसके यूनानी समतुल्य व्यक्तिनाम से स्पष्ट करता है। मुख्य पाठ में नामों को बनाए रखने और उनके शाब्दिक अर्थ को पादटिप्पणी में बताने से किसी बाद की धर्मवैज्ञानिक व्याख्या को पाठ पर आरोपित किए बिना मूल का शब्द-संबंध सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसे ध्यान से देखकर’ ἐμβλέψας की दृष्टि की तीव्रता को बिना अस्वाभाविक औपचारिकता के व्यक्त करता है। पाठ-साक्ष्य और शब्दार्थ से संबंधित पादटिप्पणी-चिह्न उनके वास्तविक संदर्भ—‘यूहन्ना’ और ‘कैफा’—के तुरंत बाद रखे गए हैं।
