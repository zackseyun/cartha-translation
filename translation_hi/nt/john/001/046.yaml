  text: καὶ εἶπεν αὐτῷ Ναθαναήλ· Ἐκ Ναζαρὲτ δύναταί τι ἀγαθὸν εἶναι; λέγει αὐτῷ ⸀ὁ Φίλιππος· Ἔρχου καὶ ἴδε.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/046.yaml
  text: And Nathanael said to him[a], “Can anything good come from Nazareth?” Philip said to him, “Come and see.”
translation:
  language: hi
  text: नतनएल ने उससे कहा, “क्या नासरत से कोई अच्छी चीज़ आ सकती है?”[a] फ़िलिप्पुस ने उससे कहा, “आओ और देखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “क्या नासरत से कुछ अच्छा हो सकता है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ εἶπεν αὐτῷ
  choice: ने उससे कहा
  rationale: सरल यूनानी संयोजक καὶ को हिंदी कथानक के स्वाभाविक प्रवाह में अलग से व्यक्त करना आवश्यक नहीं; दत्तिव αὐτῷ का अर्थ ‘उससे’ द्वारा स्पष्ट है।
- source_word: Ναθαναήλ
  choice: नतनएल
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: Ἐκ Ναζαρὲτ
  choice: नासरत से
  rationale: ἐκ स्रोत या उद्गम बताता है; ‘नासरत से’ आधुनिक हिंदी में स्वाभाविक और सटीक है।
- source_word: δύναταί τι ἀγαθὸν εἶναι
  choice: कोई अच्छी चीज़ आ सकती है
  rationale: शाब्दिक अर्थ ‘कुछ अच्छा हो सकता है’ है, पर स्थान से उद्गम के प्रश्न में ‘आ सकती है’ स्वाभाविक हिंदी है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: λέγει αὐτῷ ὁ Φίλιππος
  choice: फ़िलिप्पुस ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान λέγει को हिंदी कथात्मक भूतकाल में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: Ἔρχου καὶ ἴδε
  choice: आओ और देखो
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखते हुए निमंत्रण का सीधा और संक्षिप्त स्वर सुरक्षित रखा गया है।
theological_decisions:
- issue: नासरत के विषय में नतनएल के प्रश्न का स्वर
  choice: सीधे आलंकारिक प्रश्न के रूप में अनुवाद
  alternative: ‘भला नासरत से कोई अच्छी चीज़ आ सकती है?’
  rationale: प्रश्न में संदेह स्पष्ट है, पर यूनानी पाठ व्यंग्य या तिरस्कार की तीव्रता को अलग से चिह्नित नहीं करता। इसलिए ‘भला’ जैसे अतिरिक्त भावसूचक शब्द को नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। संवाद को संक्षिप्त रखा गया है और मूल पाठ की संदेहपूर्ण किंतु अनिर्धारित भाव-तीव्रता सुरक्षित रखी गई है।
