  text: These things took place in Bethany beyond the Jordan[a], where John was baptizing.
translation:
  language: hi
  text: ये बातें यरदन के पार बैतनिय्याह[a] में हुईं, जहाँ यूहन्ना बपतिस्मा दे रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और बाद की अनुवाद-परम्पराओं में ‘बैतनिय्याह’ के स्थान पर ‘बैतबारा’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक पद पहले वर्णित बातचीत और घटनाओं की ओर संकेत करता है; ‘ये बातें’ यूनानी के बहुवचन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν Βηθανίᾳ
  choice: बैतनिय्याह में
  rationale: ἐν स्थानवाचक है; स्थान-नाम के साथ ‘में’ सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: ἐγένετο
  choice: हुईं
  rationale: यहाँ क्रिया घटनाओं के घटित होने को बताती है; ‘बातें’ के साथ ‘हुईं’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार
  rationale: यह पद नदी के दूसरी ओर स्थित स्थान दर्शाता है; ‘के पार’ दृष्टिकोण को अनावश्यक रूप से निश्चित किए बिना अर्थ सुरक्षित रखता है।
- source_word: ὅπου
  choice: जहाँ
  rationale: स्थानसूचक सम्बन्धवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἦν ὁ Ἰωάννης βαπτίζων
  choice: जहाँ यूहन्ना बपतिस्मा दे रहा था
  rationale: ἦν के साथ वर्तमान कृदन्त चल रही भूतकालीन गतिविधि को व्यक्त करता है; ‘दे रहा था’ इस अपूर्णतापरक पक्ष को सुरक्षित रखता है और ‘बपतिस्मा’ स्थापित हिन्दी बाइबलीय शब्दावली है।
theological_decisions:
- issue: स्थान-नाम Βηθανίᾳ (‘बैतनिय्याह’) और पाठांतर Βηθαβαρᾷ (‘बैतबारा’)
  choice: मुख्य पाठ में ‘बैतनिय्याह’
  alternative: कुछ पांडुलिपियों और बाद की अनुवाद-परम्पराओं का ‘बैतबारा’
  rationale: SBLGNT के मूल पाठ में Βηθανίᾳ है, इसलिए मुख्य पाठ उसी का अनुसरण करता है; ऐतिहासिक रूप से परिचित वैकल्पिक पाठ को पाठ-संबंधी टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। प्रचलित नाम-रूप ‘यरदन’, ‘यूहन्ना’ और ‘बपतिस्मा’ अपनाए गए हैं।
