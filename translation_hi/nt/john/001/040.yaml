  text: ἦν Ἀνδρέας ὁ ἀδελφὸς Σίμωνος Πέτρου εἷς ἐκ τῶν δύο τῶν ἀκουσάντων παρὰ Ἰωάννου καὶ ἀκολουθησάντων αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/040.yaml
  text: Andrew[a], Simon Peter’s brother, was one of the two who had heard from John and followed him.
translation:
  language: hi
  text: अन्द्रियास, जो शमौन पतरस का भाई था, उन दो व्यक्तियों में से एक था जिन्होंने यूहन्ना से सुना और उसके पीछे चले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में ‘उसके’ का संकेत यीशु की ओर है।
    reason: यूनानी सर्वनाम αὐτῷ का संदर्भ निकटवर्ती कथानक से स्पष्ट होता है, जबकि मुख्य पाठ में सर्वनाम ही रखकर मूल की अभिव्यक्ति संरक्षित की गई है।
lexical_decisions:
- source_word: ἦν
  choice: था
  rationale: यहाँ εἰμί का अपूर्णकालिक रूप पहचान बताने वाली सामान्य संयोजक क्रिया है; हिन्दी में ‘था’ स्वाभाविक है।
- source_word: Ἀνδρέας
  choice: अन्द्रियास
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: ὁ ἀδελφὸς Σίμωνος Πέτρου
  choice: शमौन पतरस का भाई
  rationale: सम्बन्धकारक रचना और सगे भाई का अर्थ सीधे तथा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: εἷς ἐκ τῶν δύο
  choice: उन दो जनों में से एक
  rationale: अंशसूचक यूनानी पदबंध का सटीक और सहज हिन्दी रूप है।
- source_word: τῶν ἀκουσάντων
  choice: जिन्होंने ... सुना
  rationale: अोरिस्ट कृदन्त को सम्बन्धवाचक उपवाक्य में प्रस्तुत किया गया है; आगे ‘पीछे हो लिए’ से घटनाक्रम स्पष्ट रहता है।
- source_word: παρὰ Ἰωάννου
  choice: यूहन्ना से
  rationale: παρά के सम्बन्धकारक का स्रोतार्थ ‘से’ द्वारा सुरक्षित है; मूल में न दिया हुआ ‘बपतिस्मा देने वाला’ नहीं जोड़ा गया।
- source_word: καὶ ἀκολουθησάντων αὐτῷ
  choice: और उसके पीछे हो लिए
  rationale: ἀκολουθέω का शिष्यगत संदर्भ में स्वाभाविक हिन्दी रूप है। ‘उसके’ यूनानी सर्वनाम की अस्पष्टता को मुख्य पाठ में बनाए रखता है, जबकि प्रसंग उसका संकेत यीशु की ओर करता है।
theological_decisions:
- issue: αὐτῷ का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ रखा गया; टिप्पणी में यीशु का संदर्भ स्पष्ट किया गया
  alternative: मुख्य पाठ में सीधे ‘यीशु के पीछे’ लिखना, अथवा सर्वनाम को यूहन्ना का संदर्भ मानना
  rationale: यूहन्ना 1:35–39 के कथानक में दोनों शिष्य यूहन्ना की बात सुनकर यीशु के पीछे जाते हैं। फिर भी यूनानी पद में नाम के स्थान पर सर्वनाम है, इसलिए मुख्य पाठ मूल की अभिव्यक्ति सुरक्षित रखता है और पादटिप्पणी संदर्भगत अर्थ बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘पीछे हो लिए’ यहाँ केवल शारीरिक रूप से पीछे चलने के साथ शिष्य बनकर अनुसरण करने की प्रसंगगत छाया भी रखता है।
