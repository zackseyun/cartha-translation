  text: और यूहन्ना ने यह गवाही दी, “मैंने आत्मा को कबूतर के समान[a] स्वर्ग से[b] उतरते देखा है, और वह उस पर बना रहा।”
  philosophy: optimal-equivalence
  footnotes:
