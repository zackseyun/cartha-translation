    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: गवाही देते हुए
  rationale: μαρτυρέω के साक्ष्य देने के भाव को सहज आधुनिक हिन्दी में रखता है; λέγων के साथ मिलकर यूनानी वाक्य-संरचना को स्वाभाविक रूप देता है।
- source_word: Τεθέαμαι
  choice: मैंने ... देखा है
  rationale: पूर्णकालिक रूप प्रत्यक्ष देखे हुए अनुभव और उसकी वर्तमान प्रासंगिकता, दोनों को व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: निकटवर्ती प्रसंग इसे पवित्र आत्मा की ओर संकेत करता है; हिन्दी में ‘आत्मा’ इस संदर्भ के लिए स्पष्ट और स्वाभाविक है।
- source_word: καταβαῖνον
  choice: उतरते
  rationale: नीचे की ओर गति को सरल और ठीक रूप में व्यक्त करता है तथा ‘आत्मा’ के साथ कृदंत-संबंध बनाए रखता है।
- source_word: ὡς περιστερὰν
  choice: कबूतर के समान
  rationale: ὡς के तुलनात्मक भाव को सुरक्षित रखता है और आत्मा को अनिवार्यतः वास्तविक कबूतर ठहराने से बचता है।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: ἐξ के स्रोत और वहाँ से नीचे आने के भाव को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔμεινεν
  choice: ठहरा रहा
  rationale: μένω के टिके रहने के भाव को व्यक्त करता है और यूहन्ना के सुसमाचार में इसके विषयगत महत्व को बनाए रखता है।
- source_word: ἐπ’ αὐτόν
  choice: उस पर
  rationale: व्यक्ति के ऊपर आकर टिकने के अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: τὸ πνεῦμα की पहचान
  choice: ‘आत्मा’ से पवित्र आत्मा अभिप्रेत है
  alternative: किसी सामान्य या अवैयक्तिक ‘आत्मा’ का अर्थ
  rationale: यूहन्ना 1:32–33 का निकट प्रसंग इसे परमेश्वर के दिए हुए चिन्ह और पवित्र आत्मा से बपतिस्मा देने वाले से जोड़ता है; फिर भी मूल में न आया ‘पवित्र’ शब्द मुख्य पाठ में नहीं जोड़ा गया।
- issue: ὡς περιστερὰν का बल
  choice: तुलना—‘कबूतर के समान’
  alternative: रूप-परिवर्तन या पहचान—‘कबूतर के रूप में’
  rationale: ὡς स्वाभाविक रूप से समानता बताता है; यह अनावश्यक रूप से यह निर्धारित नहीं करता कि आत्मा ने सचमुच कबूतर का भौतिक रूप धारण किया था।
- issue: ἔμεινεν के कर्ता के लिए हिन्दी सर्वनाम
  choice: ‘वह’
  alternative: ‘यह’ या संज्ञा ‘आत्मा’ की पुनरावृत्ति
  rationale: यूनानी क्रिया का कर्ता पहले उल्लिखित आत्मा है। हिन्दी में ‘आत्मा’ व्याकरण की दृष्टि से पुल्लिंग है, इसलिए ‘वह ... ठहरा रहा’ स्वाभाविक व्याकरणिक सामंजस्य है और मूल में अनुपस्थित जैविक लिंग का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गवाही’, ‘आत्मा’ और ‘ठहरा रहा’ जैसे शब्द यूहन्ना के सुसमाचार की साक्ष्य और बने रहने की प्रमुख शब्दावली को सुरक्षित रखते हैं।
