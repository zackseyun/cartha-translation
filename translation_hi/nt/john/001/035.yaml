  yaml_path: translation/nt/john/001/035.yaml
  text: On the next day[a], John was standing there again, and two of his disciples were with him.
translation:
  language: hi
  text: अगले दिन[a] यूहन्ना फिर वहाँ खड़ा था, और उसके चेलों में से दो उसके साथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “अगले दिन यूहन्ना फिर खड़ा था, और उसके चेलों में से दो [वहाँ थे]।”'
    reason: मूल यूनानी में ‘वहाँ’ और ‘उसके साथ थे’ स्पष्ट रूप से नहीं लिखे गए; वाक्य-संरचना को अधिक शाब्दिक ढंग से भी समझा जा सकता है।
lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: अगले दिन
  rationale: सव्यय पदबंध समय का संकेत देता है—‘अगले दिन’ या ‘दूसरे दिन।’ ‘अगले दिन’ आधुनिक हिन्दी में स्वाभाविक है और कथानक का क्रम स्पष्ट रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पिछले दृश्य की पुनरावृत्ति और कथात्मक निरंतरता दिखाता है। ‘फिर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: εἱστήκει
  choice: वहाँ खड़ा था
  rationale: यह भूतकाल में जारी स्थिर अवस्था बताता है। ‘खड़ा था’ उस अवस्था को व्यक्त करता है; ‘वहाँ’ हिन्दी में दृश्य को स्वाभाविक बनाने के लिए संदर्भानुसार जोड़ा गया है।
- source_word: ὁ Ἰωάννης
  choice: यूहन्ना
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप। संदर्भ में यह बपतिस्मा देनेवाला यूहन्ना है, पर मूल पाठ केवल ‘यूहन्ना’ कहता है, इसलिए मुख्य पाठ में विस्तार नहीं किया गया।
- source_word: καὶ
  choice: और
  rationale: यह यूहन्ना और उसके दो चेलों से संबंधित वाक्यांशों को सीधे जोड़ता है।
- source_word: ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: उसके चेलों में से दो उसके साथ थे
  rationale: शाब्दिक अर्थ ‘उसके चेलों में से दो’ है। हिन्दी में वाक्य पूरा और स्वाभाविक करने के लिए ‘उसके साथ थे’ संदर्भ से पूरित किया गया है, जबकि ἐκ का अंशवाचक भाव ‘में से’ द्वारा सुरक्षित है।
