translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘चेला’ सामान्य पाठक के लिए परिचित बाइबलीय शब्द है। पूरित शब्दों से दृश्य स्वाभाविक बनाया गया है और पादटिप्पणी में मूल की संक्षिप्त संरचना सुरक्षित रखी गई है।
