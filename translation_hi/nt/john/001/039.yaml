  text: λέγει αὐτοῖς· Ἔρχεσθε καὶ ⸂ὄψεσθε. ἦλθαν οὖν⸃ καὶ εἶδαν ποῦ μένει, καὶ παρ’ αὐτῷ ἔμειναν τὴν ἡμέραν ἐκείνην· ὥρα ἦν ὡς δεκάτη.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/039.yaml
  text: He said to them[a], “Come, and you will see.” So they went and saw where he was staying, and they stayed with him that day. It was about the tenth hour.
translation:
  language: hi
  text: उसने उनसे कहा, “आओ, और तुम देखोगे।” तब वे गए और उन्होंने देखा कि वह कहाँ ठहरा था, और वे उस दिन उसके साथ ठहरे। लगभग दसवाँ घंटा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यदि सूर्योदय से घंटे गिने जाएँ, तो लगभग शाम 4 बजे; कुछ लोग इसे रोमी समय-गणना के अनुसार लगभग सुबह 10 बजे समझते हैं।
    reason: समय-गणना की वैकल्पिक सम्भावनाएँ
lexical_decisions:
- source_word: Ἔρχεσθε
  choice: आओ
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक यहाँ आमंत्रण के रूप में प्रयुक्त है। ‘आओ’ सीधा, स्वाभाविक और बिना अतिरिक्त अर्थ जोड़े यूनानी रूप का भाव रखता है।
- source_word: ὄψεσθε
  choice: तुम देखोगे
  rationale: भविष्यकालीन बहुवचन रूप को बनाए रखता है और ‘आओ, और तुम देखोगे’ में आमंत्रण के साथ आश्वासन का भाव भी आने देता है।
- source_word: ἦλθαν οὖν
  choice: तब उन्होंने जाकर
  rationale: οὖν पूर्व कथन के स्वाभाविक परिणाम को दिखाता है, जिसे यहाँ ‘तब’ सहज रूप से व्यक्त करता है। निमंत्रण के उत्तर में शिष्यों की गति को हिन्दी में ‘जाकर’ कहना कथावाचन की दृष्टि से स्वाभाविक है।
- source_word: εἶδαν
  choice: देखा
  rationale: ὁράω के साधारण भूतकालीन रूप का सीधा अनुवाद है और पहले आए ‘देखोगे’ के साथ मूल पाठ की शब्दगत प्रतिध्वनि बनाए रखता है।
- source_word: ποῦ μένει
  choice: वह कहाँ ठहरा हुआ था
  rationale: इस प्रसंग में μένω किसी स्थान पर ठहरने या निवास करने को सूचित करता है। ‘ठहरा हुआ था’ अस्थायी निवास की सम्भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρ’ αὐτῷ
  choice: उसके साथ
  rationale: παρά के साथ सम्प्रदान कारक यहाँ निकटता और संगति बताता है। ‘उसके साथ’ स्थान और व्यक्तिगत संगति दोनों को खुला रखता है।
- source_word: ἔμειναν
  choice: रहे
  rationale: यह μένω का भूतकालीन रूप है। ‘रहे’ हिन्दी में स्वाभाविक है और पूर्ववर्ती ‘ठहरा हुआ था’ से अर्थगत सम्बन्ध बनाए रखता है।
- source_word: τὴν ἡμέραν ἐκείνην
  choice: उस दिन
  rationale: मूल पाठ केवल उस दिन का उल्लेख करता है; ‘बाकी दिन’ या ‘सारा दिन’ जोड़ना पाठ से अधिक व्याख्या करना होता।
- source_word: ὥρα ἦν ὡς δεκάτη
  choice: उस समय लगभग दसवाँ घंटा था
  rationale: ὡς को ‘लगभग’ और δεκάτη को ‘दसवाँ’ देकर समय-गणना की मूल अभिव्यक्ति सुरक्षित रखी गई है, बिना किसी विवादित गणना-पद्धति को मुख्य पाठ में निश्चित किए।
- source_word: λέγει αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को आधुनिक हिन्दी के स्वाभाविक कथात्मक भूतकाल में व्यक्त किया गया है।
theological_decisions:
- issue: ‘दसवें घंटे’ की समय-गणना
  choice: मुख्य पाठ में मूल अभिव्यक्ति ‘लगभग दसवाँ घंटा’ बनाए रखना
  alternative: सूर्योदय से गिनने पर लगभग शाम 4 बजे; रोमी गणना मानने पर लगभग सुबह 10 बजे
  rationale: मूल पाठ समय गिनने की पद्धति स्पष्ट नहीं करता। इसलिए मुख्य पाठ में किसी एक गणना को निश्चित करना उचित नहीं; दोनों प्रमुख सम्भावनाएँ टिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। सर्वनाम और क्रियाएँ प्रसंगानुकूल सामान्य बोलचाल की हिन्दी में हैं। विवादित समय-गणना को मुख्य पाठ में हल करने के बजाय मूल अस्पष्टता सुरक्षित रखी गई है।
