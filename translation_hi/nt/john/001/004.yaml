translation:
  language: hi
  text: उसमें जीवन था, और वह जीवन मनुष्यों की ज्योति था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: ἐν के स्थानवाचक अर्थ और αὐτῷ के पूर्ववर्ती ‘वचन’ की ओर संकेत—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है। हिन्दी में ‘उसमें’ प्रसंगानुसार व्यक्तिवाचक भी है, इसलिए ‘वचन’ के व्यक्तिगत चित्रण को कम नहीं करता।
- source_word: ζωὴ
  choice: जीवन
  rationale: सरल और सीधा अर्थ ‘जीवन’ है। यहाँ ‘अनन्त जीवन’ जोड़ना मूल से अधिक स्पष्टता थोपता, इसलिए पद की संक्षिप्तता और यूहन्ना की अर्थ-गहराई सुरक्षित रखी गई है।
- source_word: ἦν
  choice: था
  rationale: εἰμί के अपूर्णकाल का स्वाभाविक हिन्दी रूप ‘था’ है; यह प्रस्तावना की शैली के अनुरूप है और अनावश्यक रूप से ‘अस्तित्व में था’ जैसी व्याख्या नहीं जोड़ता।
- source_word: ἡ ζωὴ
  choice: वह जीवन
  rationale: लेख सहित यह पदबंध पहले उल्लेखित जीवन की ओर फिर संकेत करता है। हिन्दी में ‘वह जीवन’ इस अनाफोरिक बल को ‘जीवन’ की पुनरावृत्ति के साथ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ φῶς
  choice: ज्योति
  rationale: φῶς का अर्थ ‘प्रकाश/ज्योति’ है। यूहन्ना की प्रस्तावना की गरिमामय रूपकात्मक भाषा में ‘ज्योति’ सहज, परिचित और विषयगत रूप से उपयुक्त है।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों की
  rationale: ἄνθρωποι यहाँ समस्त मानवजाति के लिए सामान्य अर्थ में है। ‘मनुष्यों’ स्त्री-पुरुष सभी को समाविष्ट करता है और सम्बन्धकारक रचना को ‘की’ द्वारा औपचारिक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: αὐτῷ का सन्दर्भ और व्यक्तिगत भाव
  choice: ‘उसमें’ को ‘वचन’ के व्यक्तिगत सन्दर्भ में लिया गया है।
  alternative: इसे किसी निरपेक्ष वस्तु या अमूर्त सिद्धान्त के अर्थ में समझना।
  rationale: निकटवर्ती प्रसंग में λόγος परमेश्वर के साथ सम्बन्ध में प्रस्तुत है और आगे देहधारण करता है। ‘उसमें’ मूल की संक्षिप्तता रखते हुए इसी व्यक्तिगत सन्दर्भ को सम्भव और स्वाभाविक बनाए रखता है।
- issue: ἀνθρώπων का सामान्य मानवीय अर्थ
  choice: ‘मनुष्यों’—अर्थात सभी मानवों—के रूप में अनुवाद किया गया है।
  alternative: ‘मानवता’ या ‘लोगों’ की ज्योति।
  rationale: यूनानी बहुवचन व्याकरणतः पुल्लिंग होते हुए भी यहाँ सामान्य मानव-सन्दर्भ रखता है। हिन्दी ‘मनुष्य’ इसी समावेशी अर्थ को बिना लिंग-सीमा के और मूल सम्बन्धकारक संरचना के निकट व्यक्त करता है।
- issue: जीवन और ज्योति का सम्बन्ध
  choice: ‘वह जीवन मनुष्यों की ज्योति था’ कहकर मूल की विधेयात्मक पहचान सुरक्षित रखी गई है।
  alternative: ‘वह जीवन मनुष्यों को ज्योति देता था,’ जो सम्बन्ध को क्रिया के रूप में समझाता है।
  rationale: मूल पाठ जीवन को ज्योति देने वाला मात्र नहीं कहता, बल्कि जीवन और मनुष्यों की ज्योति के बीच सीधी पहचान स्थापित करता है; इसलिए इसे व्याख्यात्मक क्रिया में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमामय और सामान्य पाठक के लिए स्पष्ट रूप। ‘ज्योति’ यूहन्ना की प्रकाश-रूपक परम्परा तथा प्रस्तावना की उन्नत शैली को बनाए रखती है; ‘मनुष्यों’ का प्रयोग सभी मनुष्यों को समाविष्ट करता है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं है।
