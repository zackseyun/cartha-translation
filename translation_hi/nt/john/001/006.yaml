  yaml_path: translation/nt/john/001/006.yaml
  text: There was a man sent from God[a], whose name was John.
translation:
  language: hi
  text: एक मनुष्य आया, जिसे परमेश्वर की ओर से भेजा गया था; उसका नाम यूहन्ना था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: ‘जिसका नाम यूहन्ना था।’'
    reason: मूल यूनानी नाम बताने के लिए एक मुहावरेदार रचना प्रयोग करता है; हिन्दी में यह समान अर्थ वाला स्वाभाविक वैकल्पिक वाक्य-विन्यास है।
lexical_decisions:
- source_word: Ἐγένετο
  choice: आया
  rationale: यह क्रिया कथा में एक नए व्यक्ति के प्रवेश का परिचय देती है। ‘आया’ आधुनिक हिन्दी में स्वाभाविक है और ‘सृष्टि की गई’ या केवल ‘दिखाई दिया’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἄνθρωπος
  choice: एक मनुष्य
  rationale: यहाँ एक विशिष्ट पुरुष, यूहन्ना, का उल्लेख है। ‘एक मनुष्य’ मूल के सामान्य मानव-संज्ञा वाले स्वर को बनाए रखता है।
- source_word: ἀπεσταλμένος
  choice: भेजा गया था
  rationale: यह पूर्ण कर्मवाच्य कृदन्त यूहन्ना को ऐसे व्यक्ति के रूप में प्रस्तुत करता है जिसे भेजा गया था। हिन्दी रूप कर्मवाच्य और उसके मिशन—दोनों को सुरक्षित रखता है।
- source_word: παρὰ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: सम्बन्धकारक के साथ παρά यहाँ स्रोत को दर्शाता है। ‘परमेश्वर की ओर से’ भेजे जाने के दिव्य स्रोत और नियुक्ति को व्यक्त करता है, बिना केवल कर्ता पर बल दिए।
- source_word: ὄνομα αὐτῷ Ἰωάννης
  choice: उसका नाम यूहन्ना था
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और व्यक्ति की स्पष्ट पहचान बनाए रखता है।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: यह हिन्दी बाइबल परम्परा में प्रचलित और व्यापक रूप से पहचाना जाने वाला नाम-रूप है।
theological_decisions:
- issue: यूहन्ना के मिशन का स्वरूप
  choice: यूहन्ना को परमेश्वर की ओर से भेजा गया व्यक्ति बताया गया है।
  alternative: यूहन्ना को परमेश्वर ने भेजा था।
  rationale: ἀπεσταλμένος παρὰ θεοῦ दिव्य स्रोत और नियुक्ति को व्यक्त करता है। ‘परमेश्वर की ओर से’ स्रोत की सूक्ष्मता बनाए रखता है और पद से आगे बढ़कर किसी विशिष्ट धार्मिक पदवी का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। अर्धविराम मूल वाक्य की एकता बनाए रखते हुए परिचय और नाम-निर्देश को अलग करता है।
