source:
  edition: SBLGNT
  text: Καὶ ὁ λόγος σὰρξ ἐγένετο καὶ ἐσκήνωσεν ἐν ἡμῖν, καὶ ἐθεασάμεθα τὴν δόξαν αὐτοῦ, δόξαν ὡς μονογενοῦς παρὰ πατρός, πλήρης χάριτος καὶ ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/john/001/014.yaml
  text: And the Word became flesh and dwelt among us[a], and we saw his glory, glory as of the one and only Son from the Father[b], full of grace and truth.
translation:
  language: hi
  text: और वचन देह बना और हमारे बीच निवास किया[a]। हमने उसकी महिमा देखी—ऐसी महिमा, जैसी पिता के पास से आए अद्वितीय पुत्र की होती है[b]। वह अनुग्रह और सत्य से परिपूर्ण था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे बीच अपना डेरा लगाया।” यूनानी क्रिया तंबू में रहने की छवि जगाती है और पवित्र-तंबू की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “पिता के पास से आए एकलौते पुत्र की”; अथवा, “एकमात्र पुत्र की।” यूनानी शब्द अनन्यता पर बल देता है; पुराने अनुवादों में इसे कभी-कभी “एकलौता पुत्र” भी कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: वचन
  rationale: यूहन्ना की प्रस्तावना में यह एक व्यक्तिगत और अर्थगर्भित उपाधि है। ‘वचन’ हिन्दी बाइबिलीय परंपरा में सुबोध है और यूनानी शब्द के संदेश, अभिव्यक्ति और तर्क जैसे अनेक पहलुओं को किसी एक संकुचित अर्थ तक सीमित नहीं करता।
- source_word: σὰρξ ἐγένετο
  choice: देहधारी हुआ
  rationale: शाब्दिक ‘देह हुआ’ आधुनिक हिन्दी में अस्वाभाविक है। ‘देहधारी हुआ’ वास्तविक मानवीय, शारीरिक अस्तित्व ग्रहण करने का बल बनाए रखते हुए ἐγένετο के परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσκήνωσεν ἐν ἡμῖν
  choice: हमारे बीच निवास किया
  rationale: यह वर्तमान हिन्दी में स्पष्ट और सहज है। क्रिया में निहित डेरा या पवित्र-तंबू की छवि को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐθεασάμεθα
  choice: हमने ... देखा
  rationale: यह प्रत्यक्ष अनुभव या साक्षी होने के भाव को सरल, स्वाभाविक हिन्दी में व्यक्त करता है; ‘निहारा’ यहाँ अनावश्यक रूप से काव्यात्मक होता।
- source_word: δόξαν
  choice: महिमा
  rationale: ‘महिमा’ यूहन्ना और व्यापक बाइबिलीय प्रयोग में स्थापित तथा अर्थगर्भित शब्द है; ‘वैभव’ या ‘तेज’ इसके अर्थ को संकुचित कर सकते हैं।
- source_word: μονογενοῦς
  choice: अद्वितीय पुत्र
  rationale: μονογενής का मुख्य बल अनन्यता और एकमात्रता पर है। ‘पुत्र’ निकटवर्ती संदर्भ से स्पष्ट किया गया है; अन्य संभावित पारंपरिक रूप पादटिप्पणी में दिए गए हैं।
- source_word: παρὰ πατρός
  choice: पिता से आए
  rationale: παρά यहाँ उद्गम और निकट संबंध व्यक्त करता है। ‘पिता से आए’ स्वाभाविक हिन्दी में दोनों का पर्याप्त संकेत देता है।
- source_word: πλήρης χάριτος καὶ ἀληθείας
  choice: वह अनुग्रह और सत्य से परिपूर्ण था
  rationale: ‘अनुग्रह और सत्य’ वाचा-संबंधी बाइबिलीय प्रतिध्वनि को बनाए रखता है। ‘वह’ से स्पष्ट होता है कि यूनानी पुल्लिंग πλήρης वचन/अद्वितीय पुत्र का वर्णन करता है।
theological_decisions:
- issue: मसीह-संबंधी प्रसंग में μονογενοῦς का अनुवाद
  choice: अद्वितीय पुत्र
  alternative: एकलौता पुत्र; एकमात्र पुत्र
  rationale: यह शब्द की अनन्यता पर केंद्रित संभावित अर्थ को सामने रखता है और उससे किसी विशेष उत्पत्ति-विवेचन को अनिवार्य नहीं बनाता। ऐतिहासिक और पारंपरिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: ἐσκήνωσεν में पवित्र-तंबू की छवि को मुख्य पाठ में कितना स्पष्ट किया जाए
  choice: हमारे बीच निवास किया
  alternative: हमारे बीच अपना डेरा लगाया; हमारे बीच तंबू में वास किया
  rationale: मुख्य पाठ आधुनिक पाठक के लिए स्वाभाविक रखा गया है, जबकि निर्गमन और पवित्र-तंबू से संभावित प्रतिध्वनि को पादटिप्पणी में बताया गया है, ताकि संकेत न खोए और न ही मुख्य पाठ में आवश्यकता से अधिक व्याख्या जोड़ी जाए।
- issue: πλήρης का संबंध किससे है
  choice: वचन/अद्वितीय पुत्र से संबंध स्पष्ट करने के लिए ‘वह’
  alternative: इसे ‘महिमा’ से जुड़ा हुआ समझना
  rationale: यूनानी πλήρης पुल्लिंग एकवचन है, इसलिए व्याकरणतः यह पुल्लिंग λόγος अथवा μονογενής की ओर लौटता है, न कि स्त्रीलिंग δόξα की ओर।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वचन’, ‘महिमा’, ‘अनुग्रह’ और ‘सत्य’ जैसे स्थापित बाइबिलीय पद अर्थगत और अंतर्पाठीय गहराई के कारण बनाए गए हैं। वाक्य-विन्यास को हिन्दी की स्वाभाविक लय के लिए तीन वाक्यों में बाँटा गया है।
