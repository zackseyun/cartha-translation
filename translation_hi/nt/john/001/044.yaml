  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। हल्के यूनानी कथात्मक संयोजक को कृत्रिम ‘अब’ से नहीं दर्शाया गया। ‘नगर’ πόλις की व्यापक अर्थ-सीमा बनाए रखता है और ‘का नगर’ की संक्षिप्तता मूल की वास्तविक संबंधगत अस्पष्टता को पूरी तरह व्याख्यायित नहीं करती।
