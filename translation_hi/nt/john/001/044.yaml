base_translation:
  language: en
  yaml_path: translation/nt/john/001/044.yaml
  text: Philip was from Bethsaida[a], from the town of Andrew and Peter.
translation:
  language: hi
  text: फिलिप्पुस बैतसैदा से था[a], जो अन्द्रियास और पतरस का नगर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्द्रियास और पतरस के नगर से था,” अर्थात वह उनका गृह-नगर था।
    reason: πόλις के साथ संबंधकारक पद का अर्थ उस नगर से अन्द्रियास और पतरस के संबंध अथवा मूल-निवास के रूप में भी स्पष्ट किया जा सकता है।
lexical_decisions:
- source_word: ἦν
  choice: था
  rationale: εἰμί का अपूर्ण भूतकाल यहाँ फिलिप्पुस की पृष्ठभूमि और मूल स्थान बताता है; हिन्दी में ‘था’ इसका सीधा और स्वाभाविक रूप है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया गया
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है, प्रबल विरोध नहीं। आधुनिक हिन्दी में पद का प्रवाह बिना ‘अब’ या ‘परन्तु’ जोड़े स्वाभाविक रहता है, और यूनानी में कोई स्पष्ट कालवाचक ‘अब’ नहीं है।
- source_word: Φίλιππος
  choice: फिलिप्पुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἀπὸ Βηθσαϊδά
  choice: बैतसैदा से
  rationale: ἀπό मूल स्थान या उद्गम दर्शाता है; ‘से’ हिन्दी में संक्षिप्त और स्वाभाविक है। स्थाननाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: ἐκ τῆς πόλεως
  choice: जो ... का नगर था
  rationale: ἐκ मूल स्थान और πόλις बस्ती/नगर को दर्शाते हैं। हिन्दी में पहले आए बैतसैदा से संबंध स्पष्ट करने के लिए संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: Ἀνδρέου καὶ Πέτρου
  choice: अन्द्रियास और पतरस का
  rationale: दोनों संबंधकारक रूप πόλεως पर निर्भर हैं और उस नगर से उनका संबंध या मूल-निवास बताते हैं। संक्षिप्त ‘का नगर’ यूनानी संरचना के निकट रहते हुए हिन्दी में बोधगम्य है।
