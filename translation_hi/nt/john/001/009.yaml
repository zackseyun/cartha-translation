  text: ἦν τὸ φῶς τὸ ἀληθινὸν ὃ φωτίζει πάντα ἄνθρωπον ἐρχόμενον εἰς τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/009.yaml
  text: The true light[a], which enlightens every person, was coming into the world.
translation:
  language: hi
  text: वह सच्ची ज्योति[a], जो हर मनुष्य को प्रकाशित करती है, संसार में आ रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “वह सच्ची ज्योति थी, जो संसार में आने वाले हर मनुष्य को प्रकाशित करती है।” यूनानी में “आने वाले” को “हर मनुष्य” के साथ भी जोड़ा जा सकता है, न कि “सच्ची ज्योति” के साथ।'
    reason: alternative_reading
lexical_decisions:
- source_word: φῶς
  choice: ज्योति
  rationale: यूहन्ना के इस प्रसंग में यह साधारण प्रकाश से बढ़कर रूपकात्मक और मसीह-संबंधी अर्थ रखता है; ‘ज्योति’ स्वाभाविक, गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है।
- source_word: ἀληθινόν
  choice: सच्ची
  rationale: यह वास्तविक, असली और परम स्वरूप का भाव बनाए रखता है; केवल तथ्यगत सत्यता तक सीमित नहीं करता।
- source_word: φωτίζει
  choice: प्रकाशित करती है
  rationale: क्रिया के प्रकाश देने और रूपकात्मक आलोकित करने—दोनों भावों को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντα ἄνθρωπον
  choice: हर मनुष्य को
  rationale: एकवचन जातिवाचक ἄνθρωπον को लिंग-समावेशी और स्रोत-सन्निकट हिन्दी में व्यक्त करता है।
- source_word: ἐρχόμενον εἰς τὸν κόσμον
  choice: संसार में आ रही थी
  rationale: मुख्य पाठ में कृदंत को अर्थ की दृष्टि से ‘सच्ची ज्योति’ से जोड़ता है और ἦν के साथ अपूर्ण भूतकालीन आगमन को स्वाभाविक हिन्दी में व्यक्त करता है; व्याकरणतः संभव दूसरा संबंध पादटिप्पणी में रखा गया है।
- source_word: κόσμον
  choice: संसार
  rationale: κόσμος के लिए यूहन्नाई संदर्भ में मानक और व्यापक हिन्दी प्रतिशब्द है।
- source_word: ἦν
  choice: थी
  rationale: स्त्रीलिंग ‘ज्योति’ के अनुरूप अपूर्ण भूतकाल को व्यक्त करता है और ‘आ रही थी’ में कृदंत के साथ संयुक्त है।
theological_decisions:
- issue: ἐρχόμενον (‘आने वाला/आ रही’) का वाक्यगत संबंध
  choice: 'अर्थ की दृष्टि से ‘सच्ची ज्योति’ से संबंध: ‘संसार में आ रही थी’'
  alternative: ‘हर संसार में आने वाले मनुष्य को प्रकाशित करती है’
  rationale: कृदंत व्याकरणतः ἄνθρωπον से जुड़ सकता है, पर यूहन्ना का व्यापक प्रयोग और प्रस्तावना का संदर्भ ज्योति के संसार में आगमन का समर्थन करते हैं। वास्तविक अस्पष्टता को मिटाने के बजाय वैकल्पिक पाठ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘ज्योति’ स्त्रीलिंग होने के कारण ‘सच्ची’, ‘करती’ और ‘थी’ का प्रयोग किया गया है।
