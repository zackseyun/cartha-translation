id: JHN.1.41
reference: John 1:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εὑρίσκει οὗτος ⸀πρῶτον τὸν ἀδελφὸν τὸν ἴδιον Σίμωνα καὶ λέγει αὐτῷ· Εὑρήκαμεν τὸν Μεσσίαν (ὅ ἐστιν μεθερμηνευόμενον χριστός).
base_translation:
  language: en
  yaml_path: translation/nt/john/001/041.yaml
  text: He first found his own brother Simon and said to him[a], “We have found the Messiah” (which means Messiah).
translation:
  language: hi
  text: उसने पहले अपने ही भाई शमौन को ढूँढ़ा और उससे कहा, “हमें मसीहा मिल गया है” (जिसका अर्थ है “अभिषिक्त जन”[a])।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक पारंपरिक रूप में: “जिसका अनुवाद ‘मसीह’ है।”'
    reason: χριστός के पारंपरिक लिप्यंतरित रूप को देते हुए मूल की व्याख्यात्मक संरचना का वैकल्पिक, अधिक औपचारिक अनुवाद प्रस्तुत करना।
lexical_decisions:
- source_word: εὑρίσκει
  choice: ढूँढ़ा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: οὗτος
  choice: उसने
  rationale: संदर्भ में संकेतवाचक सर्वनाम अन्द्रियास की ओर लौटता है; हिन्दी में ‘उसने’ स्वाभाविक है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह अन्द्रियास के कार्य का क्रम बताने वाली क्रियाविशेषणीय शक्ति को बनाए रखता है।
- source_word: ἀδελφὸν τὸν ἴδιον
  choice: अपने ही भाई
  rationale: ‘ही’ ἴδιον के बल को व्यक्त करता है, जबकि ‘भाई’ व्यक्ति और संदर्भ के अनुरूप है।
- source_word: Σίμωνα
  choice: शमौन
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: λέγει αὐτῷ
  choice: उससे कहा
  rationale: ऐतिहासिक वर्तमान को हिन्दी में भूतकाल से व्यक्त किया गया है और वाक्यांश का सीधा कथन-संबंध बना रहता है।
- source_word: Εὑρήκαμεν
  choice: हमें ... मिल गया है
  rationale: यूनानी पूर्णकाल की पूर्ण हुई खोज और उसकी वर्तमान प्रासंगिकता, दोनों स्वाभाविक हिन्दी में व्यक्त होती हैं।
- source_word: Μεσσίαν
  choice: मसीहा
  rationale: सेमिटिक मसीही उपाधि को लिप्यंतरित करके उसके यहूदी संदर्भ को सुरक्षित रखा गया है।
- source_word: μεθερμηνευόμενον χριστός
  choice: जिसका अर्थ है “अभिषिक्त जन”
  rationale: यह यूनानी पाठ में दिए गए व्याख्यात्मक अनुवाद का अर्थ हिन्दी पाठक के लिए स्पष्ट करता है; केवल ‘मसीह’ कहने से व्याख्या का आशय अस्पष्ट रह सकता है।
theological_decisions:
- issue: मसीही उपाधि और उसकी यूनानी व्याख्या
  choice: मुख्य पाठ में ‘मसीहा’ और व्याख्या में ‘अभिषिक्त जन’
  alternative: ‘मसीहा’ ... ‘मसीह’
  rationale: Μεσσίας से χριστός की व्याख्यात्मक गति को अर्थ-स्पष्ट हिन्दी में बनाए रखा गया है, बिना किसी संप्रदायगत अर्थ को जोड़ने के; पारंपरिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। कथा के ऐतिहासिक वर्तमान को स्वाभाविक भूतकाल में रखा गया है; उद्धरण में पूर्णकाल का वर्तमान परिणाम सुरक्षित है।
