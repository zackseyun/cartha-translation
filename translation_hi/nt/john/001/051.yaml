id: JHN.1.51
reference: John 1:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ἀμὴν ἀμὴν λέγω ⸀ὑμῖν, ὄψεσθε τὸν οὐρανὸν ἀνεῳγότα καὶ τοὺς ἀγγέλους τοῦ θεοῦ ἀναβαίνοντας καὶ καταβαίνοντας ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/051.yaml
  text: And he said to him[a], “Truly, truly, I say to you[b], you will see heaven opened and the angels of God ascending and descending on the Son of Man.”
translation:
  language: hi
  text: और उसने उससे कहा, “मैं तुम सब से सच-सच कहता हूँ[a], तुम स्वर्ग को खुला हुआ और परमेश्वर के स्वर्गदूतों को मनुष्य के पुत्र पर चढ़ते और उतरते देखोगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “तुम सब से” और आगे “तुम ... देखोगे” के लिए यूनानी शब्द बहुवचन में हैं, यद्यपि यीशु कथानक में नतनएल से बात कर रहे हैं।
    reason: lexical_alternative
  - marker: b
    text: यह चित्र उत्पत्ति 28:12 में याकूब के स्वप्न की प्रतिध्वनि है; यहाँ स्वर्गदूतों का चढ़ना और उतरना मनुष्य के पुत्र पर केंद्रित है।
    reason: cross_reference
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव की गंभीरता और ज़ोर को बनाए रखते हुए आधुनिक हिन्दी में सूत्र का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑμῖν / ὄψεσθε
  choice: तुम सबसे / तुम ... देखोगे
  rationale: दोनों यूनानी रूप बहुवचन हैं। ‘तुम सब’ नतनएल से कही जा रही बात का दायरा अन्य श्रोताओं तक बढ़ने को हिन्दी में स्पष्ट रखता है।
- source_word: τὸν οὐρανὸν ἀνεῳγότα
  choice: स्वर्ग को खुला हुआ
  rationale: पूर्ण कृदन्त स्वर्ग के खोले जा चुके होने की अवस्था व्यक्त करता है; यह अनुवाद उस परिणामकारी अवस्था को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἀγγέλους τοῦ θεοῦ
  choice: परमेश्वर के स्वर्गदूतों
  rationale: इस दर्शनात्मक और उत्पत्ति 28 से प्रतिध्वनित प्रसंग में ἄγγελοι से अलौकिक स्वर्गदूत अभिप्रेत हैं, सामान्य संदेशवाहक नहीं।
- source_word: ἀναβαίνοντας καὶ καταβαίνοντας
  choice: चढ़ते और उतरते
  rationale: दिशा-सूचक दोनों कृदन्तों और याकूब के स्वप्न से उनकी शास्त्रीय प्रतिध्वनि को सीधे रूप में सुरक्षित रखता है।
- source_word: ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र पर
  rationale: ἐπί के स्थान-संबंधी चित्र को ‘पर’ से सुरक्षित रखा गया है और यीशु की आत्म-पदवी ‘मनुष्य का पुत्र’ को उसके शास्त्रीय और धर्मवैचारिक संदर्भ सहित बनाए रखा गया है।
theological_decisions:
- issue: कथात्मक संबोधन αὐτῷ एकवचन है, पर प्रत्यक्ष कथन में ὑμῖν और ὄψεσθε बहुवचन हैं।
  choice: मुख्य पाठ में बहुवचन को ‘तुम सब’ से स्पष्ट किया गया है।
  alternative: सिर्फ ‘तुम’ लिखकर बहुवचन की जानकारी केवल पादटिप्पणी में देना।
  rationale: हिन्दी में संख्या को स्वाभाविक ढंग से स्पष्ट किया जा सकता है; इससे यूनानी पाठ में नतनएल से व्यापक श्रोता-समूह की ओर हुआ बदलाव सुरक्षित रहता है।
- issue: स्वर्गदूतों के चढ़ने और उतरने का चित्र उत्पत्ति 28:12 में याकूब के स्वप्न की प्रतिध्वनि है और यहाँ मनुष्य के पुत्र पर केंद्रित है।
  choice: मुख्य पाठ में चित्र को बिना व्याख्यात्मक विस्तार के रखा गया और संबंध को पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में याकूब या सीढ़ी का स्पष्ट उल्लेख जोड़ना।
  rationale: मूल पाठ संकेत देता है पर याकूब या सीढ़ी का नाम नहीं लेता; अतः अंतर्पाठीय संबंध की व्याख्या पादटिप्पणी में उचित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘सच-सच’ यूहन्ना में प्रयुक्त दोहरे आमीन-सूत्र का स्पष्ट और स्मरणीय रूप है। वाक्य-रचना मूल दर्शनात्मक चित्र को बनाए रखती है, जबकि ‘तुम सब’ यूनानी बहुवचन को सामान्य पाठक के लिए स्पष्ट करती है।
