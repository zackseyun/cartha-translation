- from: उसने साफ़-साफ़ मान लिया और इनकार नहीं किया, बल्कि स्वीकार किया, “मैं मसीह नहीं हूँ।”
  to: उसने स्वीकार किया और इनकार नहीं किया; उसने स्वीकार किया, “मैं मसीह नहीं हूँ।”
  rationale: The revision preserves the repeated ὡμολόγησεν with the same Hindi verb, retains the emphatic denial, and renders the titular χριστός as ‘मसीह.’ The semicolon provides a natural Hindi equivalent for the source’s cumulative rhetorical sequence while avoiding an unnecessary adversative conjunction.
