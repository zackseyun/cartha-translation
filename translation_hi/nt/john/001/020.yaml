  text: καὶ ὡμολόγησεν καὶ οὐκ ἠρνήσατο, καὶ ὡμολόγησεν ὅτι ⸂Ἐγὼ οὐκ εἰμὶ⸃ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/020.yaml
  text: And he confessed and did not deny[a], but confessed, “I am not the Messiah.”
translation:
  language: hi
  text: उसने स्वीकार किया और इनकार नहीं किया; उसने स्वीकार किया, “मैं मसीह नहीं हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡμολόγησεν
  choice: साफ़-साफ़ मान लिया / स्वीकार किया
  rationale: यह क्रिया यहाँ खुले और सार्वजनिक स्वीकार को व्यक्त करती है। हिन्दी में एक ही शब्द की असहज पुनरावृत्ति से बचते हुए दोनों पदबंध मूल की पुनरुक्ति और औपचारिक बल बनाए रखते हैं।
- source_word: οὐκ ἠρνήσατο
  choice: इनकार नहीं किया
  rationale: यह यूहन्ना के प्रयोग में प्रत्यक्ष नकार को व्यक्त करता है और मूल के जोरदार क्रम को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... और ... बल्कि ...
  rationale: पहले दो καί को ‘और’ तथा अंतिम को ‘बल्कि’ कहना उस चरम पुनर्कथन को स्वाभाविक हिन्दी में व्यक्त करता है, जो पिछले नकार के बाद आता है।
- source_word: Ἐγὼ οὐκ εἰμὶ
  choice: मैं ... नहीं हूँ
  rationale: स्पष्ट सर्वनाम Ἐγώ में जोर है; हिन्दी का ‘मैं’ और सीधा नकार इसे बिना अस्वाभाविक ‘मैं स्वयं’ के पर्याप्त रूप से व्यक्त करते हैं।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός प्रतीक्षित अभिषिक्त जन की उपाधि है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ इस यहूदी मसीहाई संदर्भ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: संदर्भ में यूहन्ना इस बात से इनकार करता है कि वह प्रतीक्षित मसीह है; शब्द नाम की तरह नहीं, उपाधि की तरह प्रयुक्त हुआ है। ‘मसीह’ हिन्दी में स्थापित रूप है और पाठ की मसीहाई अपेक्षा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सार्वजनिक और जोरदार घोषणा का भाव बनाए रखने के लिए ‘साफ़-साफ़ मान लिया’ चुना गया है। वाक्य की त्रिस्तरीय बयानबाजी को ‘और… और… बल्कि…’ से स्वाभाविक रूप दिया गया है।
