source:
  edition: SBLGNT
  text: Ἐν τῷ κόσμῳ ἦν, καὶ ὁ κόσμος δι’ αὐτοῦ ἐγένετο, καὶ ὁ κόσμος αὐτὸν οὐκ ἔγνω.
base_translation:
  language: en
  yaml_path: translation/nt/john/001/010.yaml
  text: He was in the world[a], and the world came into being through him[b], and the world did not know him.
translation:
  language: hi
  text: वह संसार में था, और संसार उसके द्वारा अस्तित्व में आया[a], और संसार ने उसे नहीं जाना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार उसके द्वारा बनाया गया।” यूनानी क्रिया का अर्थ “अस्तित्व में आना” या “हो जाना” है।
    reason: lexical_alternative
  - marker: b
    text: “उसे नहीं जाना” में “उसे नहीं पहचाना” या “उसे स्वीकार नहीं किया” का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κόσμῳ / κόσμος
  choice: संसार
  rationale: इस पद में κόσμος तीन बार आया है। ‘संसार’ तीनों स्थानों पर एकरूपता बनाए रखते हुए सृष्टि, मानव-जगत और परमेश्वर से विमुख जगत—इन संभावित अर्थ-छायाओं को खुला रखता है।
- source_word: ἦν
  choice: था
  rationale: εἰμί का अपूर्णकाल यहाँ निरंतर उपस्थिति बताता है। ‘था’ सहज हिन्दी है और मूल के साधारण कथन में कोई अतिरिक्त दार्शनिक अर्थ नहीं जोड़ता।
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या अभिकर्तृत्व प्रकट करता है। ‘उसके द्वारा’ हिन्दी में स्पष्ट है और यूहन्ना 1:3 में व्यक्त मध्यस्थ भूमिका के अनुरूप है।
- source_word: ἐγένετο
  choice: अस्तित्व में आया
  rationale: γίνομαι यहाँ अस्तित्व में आने को दर्शाता है। यह अनुवाद सृष्टि का भाव स्पष्ट करता और पहले आए ἦν (‘था’) से यूहन्ना के जानबूझकर किए गए भेद को सुरक्षित रखता है।
- source_word: ἔγνω
  choice: नहीं जाना
  rationale: γινώσκω का मूल अर्थ ‘जानना’ है। प्रसंग में पहचानने या स्वीकार करने का भाव भी हो सकता है, पर ‘नहीं जाना’ यूनानी अभिव्यक्ति और उसकी सम्बन्धपरक गहराई को सुरक्षित रखता है।
- source_word: αὐτοῦ / αὐτόν
  choice: उसके / उसे
  rationale: ये सर्वनाम पिछले प्रसंग के ‘वचन’ की ओर संकेत करते हैं। पुल्लिंग व्यक्तिगत सर्वनाम उस व्यक्तिगत सन्दर्भ को बनाए रखते हैं।
theological_decisions:
- issue: अव्यक्त कर्ता का सन्दर्भ
  choice: कर्ता को व्यक्तिगत पुल्लिंग ‘वह’ के रूप में रखा गया है, जो निकटवर्ती प्रसंग के ‘वचन’ को दर्शाता है।
  alternative: केवल ‘वचन’ को एक अमूर्त संज्ञा मानकर नपुंसक या अवैयक्तिक रूप देना।
  rationale: इस पद में कर्ता-संज्ञा दोहराई नहीं गई, पर यूहन्ना 1:1–9 का तत्काल प्रसंग ‘वचन’ को व्यक्तिगत रूप में प्रस्तुत करता है। ‘वह’ उसी प्रवचन-सन्दर्भ को स्वाभाविक रूप से बनाए रखता है।
- issue: वचन और सृष्टि के बीच अस्तित्वगत भेद
  choice: ἦν को ‘था’ और ἐγένετο को ‘अस्तित्व में आया’ अनूदित किया गया है।
  alternative: दोनों क्रियाओं को ऐसे समान शब्दों में अनूदित करना जिनसे उनके बीच का भेद धुंधला हो जाए; अथवा ‘उसके द्वारा बनाया गया’ कहना।
  rationale: भूमिका में यूहन्ना ‘होने’ और ‘अस्तित्व में आने’ के बीच स्पष्ट भाषिक भेद रखता है। अलग अभिव्यक्तियाँ उस पाठगत और धर्मवैचारिक तनाव को बिना बाद की पारिभाषिक शब्दावली जोड़े सुरक्षित रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पठन के योग्य शैली अपनाई गई है। ‘संसार’ की तीनfold पुनरावृत्ति मूल की अलंकारिक संरचना और अर्थ-परतों को बनाए रखने के लिए जानबूझकर रखी गई है।
