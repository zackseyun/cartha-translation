base_translation:
  language: en
  yaml_path: translation/nt/john/001/036.yaml
  text: And looking at Jesus as he was walking, he says, “Look, the Lamb of God!”
translation:
  language: hi
  text: और यीशु को चलते हुए ध्यान से देखकर उसने कहा, “देखो, परमेश्वर का मेमना!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας
  choice: ध्यान से देखकर
  rationale: यह साधारणतः देखने से अधिक एकाग्र होकर दृष्टि डालने का भाव व्यक्त करता है।
- source_word: περιπατοῦντι
  choice: चलते हुए
  rationale: वर्तमान कृदंत यीशु के उस समय चल रहे होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἴδε
  choice: देखो
  rationale: ध्यान आकर्षित करने वाली आज्ञा के लिए आधुनिक और सहज हिन्दी; ‘निहारो’ या ‘देखो तो’ की अपेक्षा अधिक सीधा है।
- source_word: ὁ ἀμνὸς τοῦ θεοῦ
  choice: परमेश्वर का मेमना
  rationale: ‘मेमना’ बलिदान-संबंधी और धर्मवैज्ञानिक संकेतों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है; संबंधवाचक पदबंध की मूल अस्पष्टता भी बनी रहती है।
- source_word: λέγει
  choice: उसने कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को प्रसंगानुकूल स्वाभाविक हिन्दी भूतकाल में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘परमेश्वर का मेमना’ का आशय
  choice: उपाधि को ज्यों का त्यों रखा गया
  alternative: ‘परमेश्वर द्वारा दिया गया बलिदानी मेमना’ जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: मूल पदबंध में बलिदान, स्वामित्व, उद्गम या नियुक्ति के संबंध को स्पष्ट नहीं किया गया; अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। कर्ता यूहन्ना प्रसंग से स्पष्ट है, इसलिए हिन्दी में ‘उसने’ रखा गया है।
