language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ οὖν Ἰουδαῖοι οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ καὶ παραμυθούμενοι αὐτήν, ἰδόντες τὴν ⸀Μαριὰμ ὅτι ταχέως ἀνέστη καὶ ἐξῆλθεν, ἠκολούθησαν αὐτῇ ⸀δόξαντες ὅτι ὑπάγει εἰς τὸ μνημεῖον ἵνα κλαύσῃ ἐκεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/031.yaml
  text: So the Jews who were with her in the house and comforting her[a], when they saw that Mary got up quickly and went out, followed her, thinking that she was going to the tomb to weep there.
translation:
  language: hi
  text: तब जो यहूदी घर में मरियम के साथ थे और उसे सांत्वना दे रहे थे, उन्होंने मरियम को जल्दी से उठकर बाहर जाते देखा, तो वे यह सोचकर उसके पीछे चले गए कि वह वहाँ कब्र पर रोने जा रही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ οὖν Ἰουδαῖοι
  choice: तब जो यहूदी
  rationale: οὖν को कथा की स्वाभाविक प्रगति दिखाने के लिए ‘तब’ से व्यक्त किया गया है। Ἰουδαῖοι का सीधा अर्थ यहाँ ‘यहूदी’ है और संदर्भ घर में मरियम के साथ शोक मना रहे लोगों का है।
- source_word: οἱ ὄντες μετ’ αὐτῆς ἐν τῇ οἰκίᾳ
  choice: जो ... घर में मरियम के साथ थे
  rationale: यह सहभागी पदबंध स्पष्ट करता है कि यहाँ किन यहूदियों की बात हो रही है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: παραμυθούμενοι αὐτήν
  choice: उसे सांत्वना दे रहे थे
  rationale: क्रिया शोक की स्थिति में ढाढ़स या सांत्वना देने का भाव रखती है; ‘सांत्वना देना’ dignified और सामान्य आधुनिक हिन्दी है।
- source_word: ταχέως ἀνέστη καὶ ἐξῆλθεν
  choice: वह जल्दी से उठकर बाहर चली गई
  rationale: ἀνέστη यहाँ बैठे स्थान से उठने को बताता है, पुनरुत्थान को नहीं। संयुक्त क्रियात्मक रचना हिन्दी में घटनाक्रम को सहज रूप से व्यक्त करती है।
- source_word: ἠκολούθησαν αὐτῇ
  choice: वे ... उसके पीछे हो लिए
  rationale: यहाँ भौतिक रूप से पीछे जाने का अर्थ है, शिष्यत्व का विशेष भाव नहीं। ‘पीछे हो लिए’ तत्काल अनुसरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δόξαντες
  choice: यह सोचकर
  rationale: सहभागी रूप उनकी धारणा या अनुमान बताता है; ‘यह सोचकर’ कारण और क्रिया का संबंध स्पष्ट रखता है।
- source_word: εἰς τὸ μνημεῖον
  choice: कब्र पर
  rationale: μνημεῖον दफनाने के स्थान को सूचित करता है। लाज़र के संदर्भ में ‘कब्र’ साधारण हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: ἵνα κλαύσῃ ἐκεῖ
  choice: वहाँ रोने के लिए
  rationale: ἵνα के साथ विधिलिंग उद्देश्य व्यक्त करता है, जिसे हिन्दी में ‘के लिए’ स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: यूहन्ना के वर्णन में Ἰουδαῖοι का अर्थ
  choice: यहूदी
  alternative: यहूदिया के लोग
  rationale: इस प्रसंग में शब्द मरियम के साथ उपस्थित शोक मनाने वालों को सूचित करता है, न कि अनिवार्य रूप से समस्त यहूदी समुदाय या केवल नेतृत्व को। सीधा अर्थ मुख्य पाठ में रखा गया है और संभावित भौगोलिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शोक के प्रसंग के अनुरूप सहज किंतु गरिमापूर्ण भाषा। वाक्य-विन्यास को हिन्दी में स्वाभाविक रखा गया है, जबकि यूनानी पाठ में घटनाओं का क्रम और समूह की अनुमानात्मक धारणा सुरक्षित है।
