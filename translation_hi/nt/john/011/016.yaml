id: JHN.11.16
reference: John 11:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν Θωμᾶς ὁ λεγόμενος Δίδυμος τοῖς συμμαθηταῖς· Ἄγωμεν καὶ ἡμεῖς ἵνα ἀποθάνωμεν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/016.yaml
  text: So Thomas[a], called Didymus, said to his fellow disciples, “Let us also go, so that we may die with him.”
translation:
  language: hi
  text: तब थोमा ने, जो दिदुमुस[a] कहलाता था, अपने साथी चेलों से कहा, “हम भी चलें, ताकि हम उसके साथ मरें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दिदुमुस का अर्थ “जुड़वाँ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले संवाद से कथा और विचार की आगे की कड़ी दर्शाता है। ‘तब’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग को अनावश्यक रूप से कठोर कारण-परिणाम में नहीं बदलता।
- source_word: Θωμᾶς
  choice: थोमा
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: ὁ λεγόμενος Δίδυμος
  choice: जो दिदुमुस कहलाता था
  rationale: Δίδυμος को नाम/उपनाम के रूप में लिप्यंतरित रखा गया है और उसका अर्थ पादटिप्पणी में दिया गया है; इससे यूनानी पाठ का नाम भी सुरक्षित रहता है और उसका अर्थ भी स्पष्ट होता है।
- source_word: τοῖς συμμαθηταῖς
  choice: अपने साथी चेलों से
  rationale: συμμαθητής साथ सीखने वाले या सह-शिष्य को दर्शाता है। इस यूहन्नाई प्रसंग में ‘साथी चेले’ स्वाभाविक और स्पष्ट है; ‘अपने’ सम्बन्ध को हिन्दी में सहज बनाता है।
- source_word: Ἄγωμεν
  choice: हम ... चलें
  rationale: यह प्रथम पुरुष बहुवचन का आग्रहसूचक संभावनार्थक रूप है। ‘हम चलें’ साथ जाने के आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ἡμεῖς
  choice: हम भी
  rationale: यह थोमा और अन्य चेलों को यीशु के साथ सम्मिलित करने पर बल देता है; ‘हम भी’ उस बल को स्पष्ट रखता है।
- source_word: ἵνα ἀποθάνωμεν
  choice: ताकि हम ... मरें
  rationale: ἵνα के उद्देश्य अथवा अपेक्षित परिणाम के सम्बन्ध को ‘ताकि’ से सुरक्षित रखा गया है, जबकि ‘मरें’ मूल के संभावनार्थक रूप की गंभीरता बनाए रखता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: यह साधारण संगति को व्यक्त करता है और प्रसंग के अनुसार सर्वनाम का संकेत यीशु की ओर रहने देता है।
theological_decisions:
- issue: थोमा के कथन का भाव और अभिप्राय
  choice: कथन को बिना अतिरिक्त भावात्मक व्याख्या के सीधे रूप में प्रस्तुत किया गया है।
  alternative: इसे वीर निष्ठा, निराश भाग्यवाद या व्यंग्यात्मक निराशा के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ थोमा के स्वर या मनोभाव को निश्चित नहीं करता। अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चेले’ सामान्य पाठकों के लिए परिचित बाइबलीय शब्द है। वाक्य में थोमा के स्वर को साहसी, निराश या व्यंग्यात्मक ठहराने वाली कोई अतिरिक्त भाषा नहीं जोड़ी गई है।
