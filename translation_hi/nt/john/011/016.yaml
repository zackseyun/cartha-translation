  terminology: “थोमा,” “दिदुमुस,” and “चेले” are appropriate established biblical Hindi forms. The footnote correctly explains Δίδυμος as “जुड़वाँ.” The relative expression “जो दिदुमुस कहलाता था” is idiomatic in historical narration and faithfully conveys the appellation.
