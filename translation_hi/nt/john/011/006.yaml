base_translation:
  language: en
  yaml_path: translation/nt/john/011/006.yaml
  text: So when he heard that he was sick[a], he then stayed two days in the place where he was.
translation:
  language: hi
  text: इसलिए जब उसने सुना कि वह बीमार है, तब वह जिस स्थान पर था, वहीं दो दिन ठहरा रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς οὖν
  choice: इसलिए जब
  rationale: ὡς का कालसूचक अर्थ ‘जब’ और οὖν का पूर्ववर्ती प्रसंग से निष्कर्षात्मक/कथात्मक संबंध ‘इसलिए’ द्वारा स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἤκουσεν
  choice: उसने सुना
  rationale: ἀκούω के सामान्य अर्थ को बिना अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
- source_word: ὅτι ἀσθενεῖ
  choice: कि वह बीमार है
  rationale: सन्दर्भ में ἀσθενέω शारीरिक बीमारी को दर्शाता है। यूनानी वर्तमान काल को हिन्दी में ‘है’ कहना स्वाभाविक है और मूल का काल भी सुरक्षित रखता है।
- source_word: τότε μὲν
  choice: तब
  rationale: τότε की कालसूचकता स्पष्ट रहती है। μέν यहाँ आगे की कथा से हल्का विरोध/क्रम बनाता है, जिसे हिन्दी में कृत्रिम जोर जोड़े बिना वाक्य-विन्यास से व्यक्त किया गया है।
- source_word: ἔμεινεν
  choice: ठहरा रहा
  rationale: स्थान पर बने रहने के अर्थ में μένω के लिए यह सहज हिन्दी है और अवधि की निरन्तरता भी व्यक्त करता है।
- source_word: ἐν ᾧ ἦν τόπῳ
  choice: जिस स्थान पर था, वहीं
  rationale: मूल की स्थानवाचक अभिव्यक्ति और उसके जोर को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δύο ἡμέρας
  choice: दो दिन
  rationale: अवधि बताने वाले कर्मकारक का सीधा और निर्विवाद अनुवाद।
theological_decisions:
- issue: लाज़र की बीमारी सुनने के बाद यीशु के ठहरे रहने का कथात्मक निहितार्थ
  choice: विलम्ब को बिना नरम किए या उसका कारण समझाए सीधे प्रस्तुत किया गया है।
  alternative: मुख्य पाठ में करुणामय योजना का कारण जोड़ना या कथात्मक तनाव घटाने के लिए वाक्य को सहज बनाना।
  rationale: मूल पाठ बीमारी सुनने और फिर दो दिन वहीं ठहरे रहने के बीच जानबूझकर तनाव रखता है; अनुवाद को इसका धर्मवैज्ञानिक समाधान स्वयं नहीं देना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बीमार है’ हिन्दी में भूतकालीन ‘सुना’ के बाद भी स्वाभाविक है और यूनानी वर्तमान काल को सुरक्षित रखता है, इसलिए काल-विकल्प की पादटिप्पणी आवश्यक नहीं।
