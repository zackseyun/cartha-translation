source:
  edition: SBLGNT
  text: καὶ πᾶς ὁ ζῶν καὶ πιστεύων εἰς ἐμὲ οὐ μὴ ἀποθάνῃ εἰς τὸν αἰῶνα· πιστεύεις τοῦτο;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/026.yaml
  text: And everyone who lives and believes in me will certainly never die forever. Do you believe this?
translation:
  language: hi
  text: और जो कोई जीवित है और मुझ पर विश्वास करता है, वह अनन्तकाल तक कभी नहीं मरेगा। क्या तुम इस पर विश्वास करती हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ὁ ζῶν
  choice: जो कोई जीवित है
  rationale: यूनानी की सार्वभौमिक और वर्तमान कृदन्तीय अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πιστεύων εἰς ἐμέ
  choice: मुझ पर विश्वास करता है
  rationale: εἰς के संबंधपरक आशय को हिन्दी की प्रचलित और स्पष्ट अभिव्यक्ति ‘पर विश्वास करना’ से व्यक्त करता है।
- source_word: οὐ μὴ ἀποθάνῃ
  choice: कभी नहीं मरेगा
  rationale: οὐ μή की प्रबल नकारात्मकता को ‘कभी नहीं’ द्वारा व्यक्त किया गया है।
- source_word: εἰς τὸν αἰῶνα
  choice: अनन्तकाल तक
  rationale: कालगत मुहावरे का औपचारिक आशय सुरक्षित रहता है और यह केवल शारीरिक मृत्यु के बारे में एक सपाट दावे के रूप में तनाव को अनावश्यक रूप से नहीं सुलझाता।
- source_word: πιστεύεις
  choice: क्या तुम ... विश्वास करती हो?
  rationale: संदर्भ में यीशु मार्था से बात कर रहे हैं; हिन्दी में क्रिया का स्त्रीलिंग रूप संबोधित व्यक्ति को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: विश्वासी के ‘न मरने’ और शारीरिक मृत्यु के बीच तनाव
  choice: वह अनन्तकाल तक कभी नहीं मरेगा
  alternative: वह कभी नहीं मरेगा
  rationale: εἰς τὸν αἰῶνα को स्पष्ट रूप से अनूदित करके मूल का कालगत और धर्मवैचारिक तनाव बनाए रखा गया है; इसे ‘आत्मिक मृत्यु’ जैसी व्याख्यात्मक शब्दावली से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गंभीर और प्रत्यक्ष है। संदर्भगत स्त्री संबोधन के कारण ‘करती हो’ रखा गया है।
