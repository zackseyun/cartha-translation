  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। यीशु के लिए आदरसूचक बहुवचन का प्रयोग किया गया है। मूल में ‘गाँव’ के साथ कोई पाठगत फुटनोट-योग्य वैकल्पिक अर्थ नहीं है; अंग्रेज़ी परत का फुटनोट वास्तव में ὑπήντησεν से संबंधित प्रतीत होता है, इसलिए भ्रामक चिह्न नहीं जोड़ा गया।
