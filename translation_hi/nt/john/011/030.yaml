base_translation:
  language: en
  yaml_path: translation/nt/john/011/030.yaml
  text: Jesus had not yet come into the village[a], but was still in the place where Martha had met him.
translation:
  language: hi
  text: यीशु अभी तक गाँव में नहीं पहुँचे थे, बल्कि अब भी उस जगह पर थे जहाँ मार्था उनसे मिली थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक स्पष्ट रूप से: “जहाँ मार्था उनसे मिलने बाहर गई थी।”'
    reason: ὑπήντησεν का अर्थ ‘मिली’ हो सकता है; संदर्भ में मार्था के यीशु से मिलने बाहर जाने की दिशात्मक बारीकी भी संभव है।
lexical_decisions:
- source_word: οὔπω
  choice: अभी तक नहीं
  rationale: यह अभिव्यक्ति बताती है कि उस समय तक घटना नहीं हुई थी; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: यहाँ δέ हल्का कथात्मक संक्रमण सूचित करता है। हिन्दी वाक्य-प्रवाह में इसे अलग संयोजक से व्यक्त करना आवश्यक नहीं है; आगे का ‘बल्कि’ वास्तविक विरोध को स्पष्ट करता है।
- source_word: ἐληλύθει
  choice: पहुँचे थे
  rationale: पूर्णभूत रूप आसपास की कथा की अपेक्षा पहले तक की स्थिति बताता है। गाँव के संदर्भ में ‘पहुँचे थे’ स्वाभाविक है और प्रवेश कर लेने का अनावश्यक आग्रह नहीं करता।
- source_word: κώμην
  choice: गाँव
  rationale: κώμη सामान्यतः छोटी बस्ती या गाँव को सूचित करता है।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह गाँव में न पहुँचने और दूसरी जगह बने रहने के बीच स्पष्ट विरोध प्रस्तुत करता है।
- source_word: ἔτι
  choice: अब भी
  rationale: यह उसी स्थान पर निरंतर बने रहने पर बल देता है।
- source_word: τόπῳ
  choice: जगह
  rationale: सामान्य स्थान के लिए सरल और प्रचलित हिन्दी शब्द।
- source_word: ὅπου
  choice: जहाँ
  rationale: स्थानवाचक संबंधवाक्य को सीधे और स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: ὑπήντησεν
  choice: मिली थी
  rationale: ὑπαντάω का अर्थ ‘मिलना’ अथवा ‘मिलने जाना’ हो सकता है। मुख्य पाठ संक्षिप्त मूल कथन को बनाए रखता है; पद 20 के संदर्भ से बाहर जाकर गति को अनिवार्य नहीं बनाता।
- source_word: αὐτῷ
  choice: उनसे
  rationale: आदरपूर्ण हिन्दी में यीशु के लिए ‘उनसे’ स्वाभाविक कर्म-संबंध व्यक्त करता है।
- source_word: Μάρθα
  choice: मार्था
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण।
