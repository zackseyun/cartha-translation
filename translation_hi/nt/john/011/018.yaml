lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है, प्रबल विरोध या स्पष्ट कालगत ‘अब’ नहीं। हिंदी में अलग संयोजक न रखना स्वाभाविक प्रवाह देता है और अर्थ को अनावश्यक रूप से प्रबल नहीं करता।
- source_word: Βηθανία
  choice: बैतनिय्याह
  rationale: स्थान-नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: ἐγγὺς τῶν Ἱεροσολύμων
  choice: यरूशलेम के पास
  rationale: ἐγγύς स्थानिक निकटता बताता है; यह संक्षिप्त और स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: ὡς
  choice: लगभग
  rationale: माप के साथ ὡς अनुमान सूचित करता है; ‘लगभग’ उस अनिश्चितता को बनाए रखता है।
- source_word: ἀπὸ σταδίων δεκαπέντε
  choice: उससे लगभग पंद्रह स्तादिया की दूरी पर
  rationale: ἀπό दूरी का आरंभ-बिंदु सूचित करता है, और प्राचीन माप ‘स्तादिया’ को मुख्य पाठ में सुरक्षित रखा गया है; आधुनिक समतुल्य पाद-टिप्पणी में दिया गया है।
