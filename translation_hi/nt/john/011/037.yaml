source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπαν· Οὐκ ἐδύνατο οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ ποιῆσαι ἵνα καὶ οὗτος μὴ ἀποθάνῃ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/037.yaml
  text: But some of them said[a], “Could not this man, who opened the eyes of the blind man, also have made it so that this man would not die?”
translation:
  language: hi
  text: पर उनमें से कुछ ने कहा[a], “क्या यह व्यक्ति, जिसने उस अंधे व्यक्ति की आँखें खोली थीं, ऐसा नहीं कर सकता था कि यह व्यक्ति भी न मरता?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह इस व्यक्ति को मरने से नहीं बचा सकता था?”
    reason: ποιῆσαι ἵνα की अधिक मुहावरेदार, संक्षिप्त हिन्दी अभिव्यक्ति।
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: पर उनमें से कुछ ने
  rationale: ἐξ αὐτῶν का स्वाभाविक अर्थ ‘उनमें से’ है; δέ को ‘पर’ से व्यक्त किया गया है, जो पिछली प्रतिक्रिया के साथ विरोध दिखाता है।
- source_word: Οὐκ ἐδύνατο
  choice: क्या ... ऐसा नहीं कर सकता था
  rationale: नकारात्मक आलंकारिक प्रश्न और भूतकालीन सामर्थ्य—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὗτος ὁ ἀνοίξας τοὺς ὀφθαλμοὺς τοῦ τυφλοῦ
  choice: यह व्यक्ति, जिसने उस अंधे व्यक्ति की आँखें खोली थीं
  rationale: पहला οὗτος यीशु की ओर संकेत करता है; संबंधवाचक उपवाक्य कृदंत का स्वाभाविक हिन्दी रूप है। ‘उस अंधे व्यक्ति’ से यूहन्ना 9 के विशिष्ट व्यक्ति का संकेत स्पष्ट रहता है।
- source_word: ποιῆσαι ἵνα
  choice: ऐसा ... कि
  rationale: यह रचना किसी परिणाम को घटित करने का भाव देती है; हिन्दी में ‘ऐसा ... कि’ संक्षिप्त, सहज और अर्थनिष्ठ है।
- source_word: καὶ οὗτος μὴ ἀποθάνῃ
  choice: कि यह व्यक्ति भी न मरता
  rationale: καί को ‘भी’ से व्यक्त किया गया है, और दूसरा οὗτος लाज़र की ओर संकेत करता है। ‘न मरता’ ἵνα-वाक्य के अभिप्रेत परिणाम को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: वक्ताओं के प्रश्न का स्वर
  choice: यीशु की सामर्थ्य और उनके न रोकने पर आलोचनात्मक आश्चर्य प्रकट करने वाला आलंकारिक प्रश्न
  alternative: एक तटस्थ, जानकारी माँगने वाला प्रश्न
  rationale: Οὐκ से आरम्भ नकारात्मक प्रश्न अपेक्षा प्रकट करता है कि वह ऐसा कर सकता था; अनुवाद इस तनाव को बनाए रखता है, पर पाठ से आगे बढ़कर कोई स्पष्ट आरोप नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। दोनों οὗτος को ‘यह व्यक्ति’ से रखा गया है ताकि यूनानी पाठ का प्रत्यक्ष संकेत और यीशु तथा लाज़र के बीच का विरोध बना रहे।
