base_translation:
  language: en
  yaml_path: translation/nt/john/011/005.yaml
  text: Jesus loved Martha and her sister and Lazarus.
translation:
  language: hi
  text: यीशु मार्था, मार्था की बहन और लाज़र से प्रेम करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπα
  choice: प्रेम करते थे
  rationale: ἀγαπάω का अपूर्ण भूतकाल यहाँ अतीत में जारी मनोभाव को व्यक्त करता है। हिंदी में आदरसूचक बहुवचन के साथ “प्रेम करते थे” स्वाभाविक रूप से इस निरंतरता को प्रकट करता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: δέ हल्का कथात्मक संयोजक है। इस हिंदी वाक्य में उसे “अब” या “परन्तु” कहना अनावश्यक कालगत या विरोधात्मक अर्थ जोड़ सकता है; प्रसंग-संबंध वाक्य-क्रम से स्पष्ट है।
- source_word: τὴν ἀδελφὴν αὐτῆς
  choice: उसकी बहन
  rationale: यह यूनानी संज्ञा और संबंधवाचक सर्वनाम का सहज हिंदी रूप है। इस पद में बहन का नाम नहीं दिया गया, इसलिए उसे यहाँ नाम से निर्दिष्ट नहीं किया गया।
- source_word: Μάρθαν
  choice: मार्था
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: Λάζαρον
  choice: लाज़र
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: καὶ ... καὶ ... καὶ
  choice: मार्था, उसकी बहन और लाज़र
  rationale: यूनानी में तीनों कर्म καί से जुड़े हैं। आधुनिक हिंदी में सूची के अंतिम पद से पहले “और” लगाना सबसे स्वाभाविक है; तीनों व्यक्तियों का समान समन्वय बना रहता है।
theological_decisions:
- issue: ἠγάπα के अपूर्ण भूतकाल का बल
  choice: यीशु के मार्था, उसकी बहन और लाज़र के प्रति बने रहने वाले प्रेम का साधारण कथन
  alternative: “प्रेम करने लगे थे” या अधिक बलयुक्त प्रगतिशील अभिव्यक्ति
  rationale: अपूर्ण भूतकाल यहाँ अतीत में चलने वाली अवस्था को सबसे स्वाभाविक रूप से दर्शाता है। “प्रेम करते थे” निरंतर मनोभाव बताता है, बिना आरंभिक या असामान्य रूप से प्रगतिशील अर्थ थोपे।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिंदी। यीशु के लिए प्रचलित आदरसूचक क्रिया-रूप “करते थे” रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं है।
