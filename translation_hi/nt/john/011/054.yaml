source:
  edition: SBLGNT
  text: ⸂Ὁ οὖν Ἰησοῦς⸃ οὐκέτι παρρησίᾳ περιεπάτει ἐν τοῖς Ἰουδαίοις, ἀλλὰ ἀπῆλθεν ἐκεῖθεν εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου, εἰς Ἐφραὶμ λεγομένην πόλιν, κἀκεῖ ⸀ἔμεινεν μετὰ τῶν ⸀μαθητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/054.yaml
  text: So Jesus no longer walked openly among the Jews[a], but departed from there to the region near the wilderness, to a city called Ephraim, and stayed there with the disciples.
translation:
  language: hi
  text: इसलिए यीशु अब यहूदियों[a] के बीच खुले रूप से नहीं घूमते थे, बल्कि वहाँ से निर्जन प्रदेश के पास के क्षेत्र में स्थित एप्रैम नामक नगर को चले गए और वहाँ चेलों के साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के लोगों के बीच।” यूहन्ना के सुसमाचार में “यहूदी” शब्द प्रसंग के अनुसार कभी अधिक विशेष रूप से यहूदिया के लोगों या यहूदी नेताओं की ओर संकेत कर सकता है।
    reason: वैकल्पिक संदर्भगत अर्थ
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग में यीशु के विरुद्ध रची गई योजना का कथात्मक परिणाम बताता है; ‘इसलिए’ इसके निष्कर्षात्मक बल को स्पष्ट रखता है।
- source_word: οὐκέτι
  choice: अब ... नहीं
  rationale: यह पहले के व्यवहार के बंद हो जाने का समयगत अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρρησίᾳ
  choice: खुले रूप से
  rationale: यहाँ अर्थ साहस के बजाय सार्वजनिक और प्रत्यक्ष रूप से आना-जाना है।
- source_word: περιεπάτει
  choice: घूमते थे
  rationale: अपूर्णकालीन क्रिया सार्वजनिक रूप से चलते-फिरते रहने की गतिविधि दिखाती है; ‘घूमते थे’ हिन्दी में इस प्रसंग में स्वाभाविक है।
- source_word: ἐν τοῖς Ἰουδαίοις
  choice: यहूदियों के बीच
  rationale: Ἰουδαῖοι का सामान्य अर्थ बनाए रखा गया है, जबकि यूहन्ना में संभव क्षेत्रीय अर्थ ‘यहूदिया के लोगों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀπῆλθεν ἐκεῖθεν
  choice: वहाँ से ... चले गए
  rationale: यह पिछले स्थान को छोड़कर जाने की कथात्मक गति को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν χώραν ἐγγὺς τῆς ἐρήμου
  choice: उजाड़ प्रदेश के निकट के इलाके में
  rationale: χώρα को किसी आधुनिक देश के बजाय क्षेत्र या इलाके के अर्थ में और ἔρημος को निर्जन भूभाग के अर्थ में प्रस्तुत किया गया है।
- source_word: εἰς Ἐφραὶμ λεγομένην πόλιν
  choice: एप्रैम कहलाने वाले नगर में
  rationale: πόλις के लिए ‘नगर’ गरिमापूर्ण और सामान्य हिन्दी है; λεγομένην का अर्थ ‘कहलाने वाले’ से सीधे व्यक्त होता है।
- source_word: κἀκεῖ ἔμεινεν
  choice: और वहाँ ... रहे
  rationale: यात्रा-वृत्तांत में μένω का स्वाभाविक अर्थ किसी स्थान पर ठहरकर रहना है।
- source_word: μετὰ τῶν μαθητῶν
  choice: चेलों के साथ
  rationale: यूनानी में स्वत्वसूचक सर्वनाम नहीं है, इसलिए ‘अपने’ जोड़े बिना निश्चित पदबंध का अर्थ रखा गया है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖοι का संदर्भ
  choice: यहूदियों के बीच
  alternative: यहूदिया के लोगों के बीच
  rationale: यह शब्द जातीय, क्षेत्रीय या कभी-कभी नेतृत्व-संबंधी अर्थ दे सकता है। यहाँ यीशु के सार्वजनिक आवागमन का भौगोलिक-सामाजिक संदर्भ है; मुख्य पाठ परिचित अर्थ रखता है और पादटिप्पणी क्षेत्रीय संभावना को बचाती है, ताकि कथन को सभी यहूदियों के विषय में व्यापक धार्मिक आरोप न समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली सहज, गरिमापूर्ण और कथात्मक है। ‘खुले रूप से नहीं घूमते थे’ सार्वजनिक गतिविधि का अर्थ देता है, और पादटिप्पणी Ἰουδαῖοι की वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखती है।
