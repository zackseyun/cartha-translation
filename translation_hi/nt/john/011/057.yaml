  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य प्रशासनिक आदेश और यीशु को पकड़ने के उद्देश्य को स्पष्ट करता है, पर यूनानी से अधिक औपचारिक कानूनी अर्थ नहीं जोड़ता।
