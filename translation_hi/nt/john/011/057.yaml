  text: δεδώκεισαν ⸀δὲ οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ⸀ἐντολὰς ἵνα ἐάν τις γνῷ ποῦ ἐστιν μηνύσῃ, ὅπως πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/057.yaml
  text: The chief priests and the Pharisees had given orders that if anyone knew where he was[a], he should report it[b], so that they might seize him.
translation:
  language: hi
  text: प्रधान याजकों और फरीसियों ने आदेश दे रखे थे कि यदि किसी को मालूम हो कि वह कहाँ है, तो वह इसकी सूचना दे, ताकि वे उसे पकड़ सकें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δεδώκεισαν
  choice: दे रखे थे
  rationale: पूर्णभूतकाल का रूप बताता है कि आदेश कथा के इस समय से पहले दिए जा चुके थे; ‘दे रखे थे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: यहाँ δέ मुख्यतः कथा को आगे बढ़ाने वाला हल्का संयोजक है। हिन्दी में पद की शुरुआत बिना कृत्रिम ‘अब’ या अनावश्यक ‘परन्तु’ के स्वाभाविक है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: यह बहुवचन उस समय के प्रमुख याजकीय अधिकारियों को दर्शाता है, न कि अनेक पदासीन महायाजकों को।
- source_word: οἱ Φαρισαῖοι
  choice: फरीसियों
  rationale: यह यहूदी धार्मिक समूह के नाम का प्रचलित हिन्दी रूप है।
- source_word: ἐντολὰς
  choice: आदेश
  rationale: प्रसंग में अधिकारियों द्वारा जारी बाध्यकारी निर्देश अभिप्रेत हैं; ‘आदेश’ उनका अधिकारपूर्ण स्वर बनाए रखता है।
- source_word: ἵνα ἐάν τις γνῷ
  choice: कि यदि किसी को मालूम हो
  rationale: यह आदेश की विषयवस्तु में निहित शर्त को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποῦ ἐστιν
  choice: कि वह कहाँ है
  rationale: यूनानी वर्तमान काल ‘है’ को हिन्दी परोक्ष कथन में भी स्वाभाविक रूप से बनाए रखा गया है।
- source_word: μηνύσῃ
  choice: वह इसकी सूचना दे
  rationale: क्रिया का अर्थ अधिकारियों को कोई बात बताना या उसकी सूचना देना है; ‘इसकी’ से यीशु के ठिकाने की जानकारी स्पष्ट रहती है।
- source_word: ὅπως πιάσωσιν αὐτόν
  choice: ताकि वे उसे पकड़ सकें
  rationale: यह उद्देश्य को व्यक्त करता है और πιάζω के पकड़ने या हिरासत में लेने के व्यापक अर्थ को ‘गिरफ़्तार’ की अपेक्षा कम विशिष्ट रूप में सुरक्षित रखता है।
