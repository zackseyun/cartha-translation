source:
  edition: SBLGNT
  text: λέγει αὐτῇ ὁ Ἰησοῦς· Οὐκ εἶπόν σοι ὅτι ἐὰν πιστεύσῃς ⸀ὄψῃ τὴν δόξαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/040.yaml
  text: Jesus said to her, “Did I not tell you that if you believe, you will see the glory of God?”
translation:
  language: hi
  text: यीशु ने उससे कहा, “क्या मैंने तुमसे नहीं कहा था कि यदि तुम विश्वास करोगी, तो परमेश्वर की महिमा देखोगी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: ने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी की कथात्मक शैली में भूतकाल ‘ने कहा’ अधिक स्वाभाविक है।
- source_word: αὐτῇ
  choice: उससे
  rationale: संदर्भ में यह स्त्रीलिंग सर्वनाम मार्था के लिए है; हिन्दी में ‘उससे कहा’ स्वाभाविक रूप है।
- source_word: Οὐκ εἶπόν σοι
  choice: क्या मैंने तुमसे नहीं कहा था
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। ‘नहीं कहा था’ पूर्व में कही गई बात की ओर स्वाभाविक हिन्दी में संकेत करता है।
- source_word: ἐὰν πιστεύσῃς
  choice: यदि तुम विश्वास करोगी
  rationale: πιστεύω के यूहन्नाई प्रयोग से संबंध बनाए रखने के लिए ‘विश्वास’ चुना गया है। स्त्रीलिंग क्रिया संदर्भ में मार्था को संबोधन स्पष्ट करती है।
- source_word: ὄψῃ
  choice: देखोगी
  rationale: भविष्यकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप है; स्त्रीलिंग संबोधन संदर्भानुकूल है।
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: परमेश्वर की महिमा
  rationale: ‘महिमा’ δόξα का स्थापित और प्रसंगानुकूल अनुवाद है, और ‘परमेश्वर की’ यूनानी संबंधकारक को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विश्वास और परमेश्वर की महिमा देखने का संबंध
  choice: कथन को मार्था से कही गई सीधी शर्तयुक्त प्रतिज्ञा के रूप में रखा गया है।
  alternative: इसे सभी विश्वासियों और चमत्कारों पर लागू सामान्य सिद्धांत या केवल लाज़र के जिलाए जाने तक सीमित कथन के रूप में स्पष्ट करना।
  rationale: मूल पाठ इन व्यापक व्याख्यात्मक प्रश्नों का निर्णय नहीं करता; इसलिए अनुवाद शर्त और प्रतिज्ञा को बिना धार्मिक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘यदि’ कथन की औपचारिक गंभीरता बनाए रखता है, जबकि ‘तुमसे’ और स्त्रीलिंग क्रियाएँ प्रसंग को स्पष्ट और स्वाभाविक बनाती हैं।
