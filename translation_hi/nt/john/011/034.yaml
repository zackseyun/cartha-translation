  yaml_path: translation/nt/john/011/034.yaml
  text: And he said[a], “Where have you laid him?” They said to him, “Lord, come and see.”
translation:
  language: hi
  text: उन्होंने कहा, “तुम लोगों ने उसे कहाँ रखा है?” उन्होंने उससे कहा, “प्रभु[a], आइए और देखिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय, आइए और देखिए।” यूनानी शब्द κύριε आदरसूचक संबोधन के रूप में भी प्रयुक्त हो सकता है; मुख्य पाठ में “प्रभु” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν
  choice: उन्होंने कहा
  rationale: λέγω का सामान्य अर्थ ‘कहना’ है। कथन प्रश्न के रूप में है, फिर भी ‘पूछा’ कहने के बजाय मूल क्रिया को बनाए रखा गया है।
- source_word: Ποῦ
  choice: कहाँ
  rationale: यह स्थान पूछने वाला सीधा प्रश्नवाचक क्रियाविशेषण है।
- source_word: τεθείκατε
  choice: तुम लोगों ने ... रखा है
  rationale: τίθημι के पूर्णकालिक रूप में लाज़र के शरीर को किसी स्थान पर रख देने की पूरी हुई क्रिया का वर्तमान परिणाम निहित है। बहुवचन संबोधन को ‘तुम लोगों ने’ से स्पष्ट किया गया है।
- source_word: αὐτόν
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम का संकेत लाज़र की ओर है; हिन्दी में स्वाभाविक कर्मरूप ‘उसे’ है।
- source_word: λέγουσιν
  choice: उन्होंने ... कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-वर्णन में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह यीशु के लिए सीधा आदरसूचक संबोधन है। ‘प्रभु’ सम्मान और संभावित मसीही आशय दोनों को सुरक्षित रखता है; केवल शिष्टाचारवाची अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: ἔρχου
  choice: आइए
  rationale: ἔρχομαι की आज्ञार्थक क्रिया को हिन्दी में संबोधित व्यक्ति के प्रति आदर बनाए रखते हुए व्यक्त किया गया है।
- source_word: ἴδε
  choice: देखिए
  rationale: ὁράω की आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; ‘आइए और देखिए’ मूल के समन्वित निमंत्रण को बनाए रखता है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: संदर्भ में यह सम्मानसूचक संबोधन हो सकता है, पर इसमें अधिक गहरा मसीही आशय भी संभव है। ‘प्रभु’ उस संभावित अर्थ को बनाए रखता है, जबकि पादटिप्पणी साधारण आदरसूचक अर्थ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम लोगों ने’ यूनानी के बहुवचन को स्पष्ट करता है, जबकि यीशु के लिए उत्तर में आदरसूचक ‘आइए’ और ‘देखिए’ स्वाभाविक हिन्दी व्यवहार के अनुरूप हैं।
