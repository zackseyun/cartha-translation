review_pass:
  verdict: revise
  source_fidelity: 'The first clause accurately renders καὶ εἶπεν and the perfect τεθείκατε as “तुम लोगों ने ... रखा है.” The response clause, however, has a referential error: αὐτῷ is singular (“to him,” Jesus), whereas “उन्होंने उनसे कहा” uses the plural oblique pronoun “उनसे.” It must be “उन्होंने उससे कहा.”'
  naturalness: The register is modern, clear, and appropriately respectful. “आइए और देखिए” is an idiomatic and natural rendering of ἔρχου καὶ ἴδε. “तुम लोगों ने” explicitly conveys the plural addressees, though it is somewhat more emphatic than necessary; it remains acceptable.
  terminology: “प्रभु” appropriately preserves the possible theological force of Κύριε without excluding its respectful-address sense. The footnote’s alternative “महोदय” suitably signals that possibility.
  issues:
  - severity: medium
    issue: Singular Greek pronoun αὐτῷ is translated with plural Hindi pronoun “उनसे.”
    rationale: 'The speakers address Jesus individually: λέγουσιν αὐτῷ means “they said to him.” Hindi should read “उन्होंने उससे कहा,” not “उन्होंने उनसे कहा.”'
  revised_text: उन्होंने कहा, “तुम लोगों ने उसे कहाँ रखा है?” उन्होंने उससे कहा, “प्रभु[a], आइए और देखिए।”
