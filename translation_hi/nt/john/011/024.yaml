source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸀ἡ Μάρθα· Οἶδα ὅτι ἀναστήσεται ἐν τῇ ἀναστάσει ἐν τῇ ἐσχάτῃ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/024.yaml
  text: Martha said to him[a], “I know that he will rise again in the resurrection on the last day.”
translation:
  language: hi
  text: मार्था ने उससे कहा, “मैं जानती हूँ कि वह अंतिम दिन के पुनरुत्थान में[a] जी उठेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पुनरुत्थान के समय, अंतिम दिन जी उठेगा।”
    reason: यूनानी में ‘पुनरुत्थान में’ और ‘अंतिम दिन’ दो क्रमिक ἐν-वाक्यांश हैं; हिन्दी में इन्हें एक संयुक्त पदबंध या दो समय-सूचक पदबंधों के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ Μάρθα
  choice: मार्था ने उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान ‘कहती है’ है, पर आधुनिक हिन्दी कथा और संवाद-परिचय में सामान्य भूतकाल ‘कहा’ अधिक स्वाभाविक है। αὐτῷ का स्वाभाविक रूप ‘उससे’ है।
- source_word: Οἶδα
  choice: मैं जानती हूँ
  rationale: यह मार्था के निश्चित ज्ञान या विश्वासपूर्ण कथन को सीधे व्यक्त करता है और वक्ता के स्त्रीलिंग के अनुसार स्वाभाविक हिन्दी रूप है।
- source_word: ἀναστήσεται
  choice: वह ... जी उठेगा
  rationale: पुनरुत्थान के प्रसंग में भविष्यकालीन मध्यम रूप का स्वाभाविक अर्थ ‘जी उठेगा’ है। यह ‘जिलाया जाएगा’ कहकर यूनानी की वाच्य-दृष्टि को अनावश्यक रूप से नहीं बदलता।
- source_word: ἐν τῇ ἀναστάσει
  choice: पुनरुत्थान में
  rationale: यह पुनरुत्थान की घटना अथवा उसके समय-क्षेत्र को व्यक्त करता है और यूनानी ἐν की संरचना को यथासंभव बनाए रखता है।
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: अंतिम दिन होने वाले
  rationale: हिन्दी में यह वाक्यांश ‘पुनरुत्थान’ के साथ स्वाभाविक रूप से जुड़कर बताता है कि वह पुनरुत्थान अंतिम दिन होगा। ‘अंतिम दिन’ यूहन्ना के इस पारिभाषिक समय-संदर्भ का स्पष्ट और प्रचलित अनुवाद है।
theological_decisions:
- issue: अंतिम दिन के पुनरुत्थान का संदर्भ
  choice: मार्था भविष्य में अंतिम दिन होने वाले पुनरुत्थान की बात करती है।
  alternative: मृत्यु के बाद जीवन की एक सामान्य और अनिश्चित आशा।
  rationale: ἀναστήσεται और ἀνάστασις के दोहरे पुनरुत्थान-संदर्भ के साथ ‘अंतिम दिन’ का उल्लेख अंतकालीन पुनरुत्थान की ओर संकेत करता है। अनुवाद इस विशिष्टता को रखता है, पर शरीर, क्रम या रीति के विषय में पाठ से अधिक सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘जी उठेगा’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘पुनरुत्थान’ मूल पाठ की विशिष्ट अंतकालीन शब्दावली को सुरक्षित रखता है।
