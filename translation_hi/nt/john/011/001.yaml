id: JHN.11.1
reference: John 11:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἦν δέ τις ἀσθενῶν, Λάζαρος ἀπὸ Βηθανίας ἐκ τῆς κώμης Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/001.yaml
  text: A certain man was sick[a], Lazarus from Bethany, from the village of Mary and her sister Martha.
translation:
  language: hi
  text: एक व्यक्ति बीमार था—लाज़र, जो बैतनियाह का रहने वाला था। बैतनियाह मरियम और उसकी बहन मार्था का गाँव था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἦν δέ
  choice: था
  rationale: Ἦν को भूतकालीन अस्तित्व/स्थिति के रूप में ‘था’ से व्यक्त किया गया है। δέ यहाँ हल्का कथात्मक संयोजक है; हिंदी में अलग संयोजक जोड़ने से अनावश्यक विरोध या कालगत अर्थ आ सकता था, इसलिए वाक्य-प्रवाह में इसे अप्रकट रखा गया है।
- source_word: τις
  choice: एक व्यक्ति
  rationale: τις एक अनिश्चित किंतु विशिष्ट व्यक्ति का परिचय देता है। ‘एक व्यक्ति’ स्वाभाविक आधुनिक हिंदी है और संदर्भ में पुरुष लाज़र की ओर संकेत करता है।
- source_word: ἀσθενῶν
  choice: बीमार
  rationale: इस प्रसंग में participle शारीरिक बीमारी को बताता है, केवल दुर्बलता को नहीं; ‘बीमार था’ हिंदी में स्वाभाविक विधेय है।
- source_word: Λάζαρος
  choice: लाज़र
  rationale: व्यक्तिनाम को प्रचलित हिंदी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: ἀπὸ Βηθανίας
  choice: बैतनियाह का रहने वाला
  rationale: ἀπό यहाँ स्थान-स्रोत या निवास-संबंध दर्शाता है। ‘का रहने वाला’ हिंदी में व्यक्ति के स्थान-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τῆς κώμης
  choice: गाँव
  rationale: κώμη छोटे बसे हुए स्थान को दर्शाता है, इसलिए ‘गाँव’ उपयुक्त है। दूसरे वाक्य में बैतनियाह को उसी गाँव के रूप में स्पष्ट किया गया है।
- source_word: Μαρίας καὶ Μάρθας τῆς ἀδελφῆς αὐτῆς
  choice: मरियम और उसकी बहन मार्था
  rationale: τῆς ἀδελφῆς αὐτῆς मार्था को मरियम की बहन के रूप में पहचानता है। ‘उसकी बहन मार्था’ इस संबंध को स्पष्ट और सहज हिंदी में बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल यूनानी की स्थान-संबंधी पुनरुक्ति को बोझिल शब्दशः ढाँचे के बजाय दो छोटे वाक्यों में व्यक्त किया गया है; इससे बैतनियाह का लाज़र से संबंध और मरियम-मार्था के गाँव के रूप में उसकी पहचान दोनों सुरक्षित रहते हैं।
