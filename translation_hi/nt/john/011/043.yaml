  text: καὶ ταῦτα εἰπὼν φωνῇ μεγάλῃ ἐκραύγασεν· Λάζαρε, δεῦρο ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/043.yaml
  text: And after saying these things[a], he cried out with a loud voice, “Lazarus, come out!”
translation:
  language: hi
  text: ये बातें कहने के बाद उसने ऊँची आवाज़ में पुकारा, “लाज़र, बाहर आ!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का निकट और स्वाभाविक हिन्दी रूप; इससे मूल का बहुवचन बना रहता है।
- source_word: εἰπὼν
  choice: कहने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया दिखाता है; यह रूप समय-क्रम को सहज हिन्दी में स्पष्ट करता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: रीति/साधन सूचक दत्तिव का स्वाभाविक हिन्दी रूप, जो आवाज़ की प्रबलता व्यक्त करता है।
- source_word: ἐκραύγασεν
  choice: पुकारा
  rationale: क्रिया ऊँची पुकार या चिल्लाहट बताती है; साथ का ‘ऊँची आवाज़ में’ बल को सुरक्षित रखता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: Λάζαρε
  choice: लाज़र
  rationale: सम्बोधन रूप में आए व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: δεῦρο ἔξω
  choice: बाहर आ
  rationale: δεῦρο का आदेशात्मक ‘आ’ और ἔξω का ‘बाहर’ मिलकर मृतक को बाहर निकलने की सीधी, प्रबल आज्ञा देते हैं; आधुनिक हिन्दी में यही स्वाभाविक है।
theological_decisions:
- issue: प्रसिद्ध चमत्कार-आज्ञा को परंपरागत किंतु अप्रचलित भाषा के बिना व्यक्त करना
  choice: बाहर आ
  alternative: बाहर निकल आ
  rationale: ‘बाहर आ’ δεῦρο ἔξω का सीधा, संक्षिप्त और स्वाभाविक अर्थ देता है तथा पाठ में कोई अतिरिक्त गति-विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष सम्बोधन में एकवचन आदेश ‘आ’ प्रसंगानुकूल और प्रभावशाली है। ‘ऊँची आवाज़ में पुकारा’ मूल के दोनों बलसूचक तत्वों को स्वाभाविक हिन्दी में रखता है।
