base_translation:
  language: en
  yaml_path: translation/nt/john/011/012.yaml
  text: So the disciples said to him[a], “Lord, if he has fallen asleep[b], he will recover.”
translation:
  language: hi
  text: इसलिए चेलों ने उससे कहा, “प्रभु, यदि वह सो गया है[a], तो वह स्वस्थ हो जाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “सो चुका है।” यीशु ने लाज़र की मृत्यु को नींद के रूपक में कहा था, पर चेले उसे साधारण नींद समझे।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का अनुवाद “बच जाएगा” भी हो सकता है, पर यहाँ बीमारी से उबरना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह यीशु की पिछली बात से चेलों द्वारा निकाले गए निष्कर्ष को दर्शाता है और कथात्मक संबंध बनाए रखता है।
- source_word: οἱ μαθηταὶ
  choice: चेलों
  rationale: संदर्भ से निश्चित समूह स्पष्ट है; हिन्दी में ‘चेलों ने’ स्वाभाविक है और यूनानी में निहित न होने के कारण ‘उसके’ नहीं जोड़ा गया।
- source_word: αὐτῷ
  choice: उससे
  rationale: यूनानी सर्वनाम यीशु की ओर संकेत करता है; संदर्भ में ‘उससे’ स्पष्ट और स्रोत के अनुरूप है।
- source_word: Κύριε
  choice: प्रभु
  rationale: प्रत्यक्ष संबोधन में यह सम्मान और यूहन्ना के मसीह-संबंधी अर्थ की संभावना दोनों को बनाए रखता है।
- source_word: εἰ
  choice: यदि
  rationale: यह चेलों की समझ पर आधारित सीधी शर्त व्यक्त करता है।
- source_word: κεκοίμηται
  choice: सो गया है
  rationale: पूर्णकालिक रूप सो जाने के फलस्वरूप वर्तमान अवस्था बताता है। चेले इसे साधारण नींद समझते हैं, इसलिए सहज हिन्दी में वही अर्थ मुख्य पाठ में रखा गया है।
- source_word: σωθήσεται
  choice: स्वस्थ हो जाएगा
  rationale: बीमारी के प्रसंग में σῴζω का अर्थ बच जाना अथवा स्वास्थ्य-लाभ करना है; यहाँ ‘स्वस्थ हो जाएगा’ चेलों के आशय को बिना अनावश्यक उद्धार-संबंधी अर्थ आरोपित किए स्पष्ट करता है।
theological_decisions:
- issue: यीशु के लिए प्रत्यक्ष संबोधन κύριος
  choice: प्रभु
  alternative: स्वामी / महोदय
  rationale: ‘प्रभु’ सम्मानपूर्ण संबोधन और सुसमाचार में संभावित मसीह-संबंधी गूंज दोनों को खुला रखता है, बिना इस पद में उससे अधिक दावा किए।
- issue: κεκοίμηται में नींद और मृत्यु का दोहरा अर्थ
  choice: मुख्य पाठ में साधारण नींद की भाषा
  alternative: सोया हुआ है / विश्राम कर रहा है
  rationale: कथा में चेले यीशु की मृत्यु-सूचक रूपकात्मक भाषा को वास्तविक नींद समझते हैं। ‘सो गया है’ उनकी गलतफहमी को सुरक्षित रखता है; अगला प्रसंग इसे स्पष्ट करता है।
- issue: σωθήσεται का उद्धार अथवा स्वास्थ्य-लाभ अर्थ
  choice: स्वस्थ हो जाएगा
  alternative: बच जाएगा
  rationale: बीमारी और नींद के तत्काल प्रसंग में स्वास्थ्य-लाभ अभिप्रेत है। पादटिप्पणी व्यापक शाब्दिक संभावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘चेला’ सामान्य पाठक के लिए परिचित बाइबलीय शब्द है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के तुरंत बाद दिए गए हैं।
