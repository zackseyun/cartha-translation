source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς· Οὐχὶ δώδεκα ⸂ὧραί εἰσιν⸃ τῆς ἡμέρας; ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ, οὐ προσκόπτει, ὅτι τὸ φῶς τοῦ κόσμου τούτου βλέπει·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/009.yaml
  text: Jesus answered[a], “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble[c][b], because he sees the light of this world.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “क्या दिन के बारह घंटे नहीं होते? यदि कोई दिन में चलता है, तो वह ठोकर नहीं खाता, क्योंकि वह इस संसार का प्रकाश[a] देखता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “प्रकाश” पहले स्तर पर दिन का दिखाई देने वाला प्रकाश है; यूहन्ना के सुसमाचार में इस शब्द की व्यापक धार्मिक अर्थ-प्रतिध्वनि भी हो सकती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: कथात्मक प्रसंग में यह सामान्य और स्वाभाविक हिन्दी अभिव्यक्ति है तथा यूनानी क्रिया में कोई अतिरिक्त भाव नहीं जोड़ती।
- source_word: Οὐχὶ
  choice: क्या ... नहीं होते?
  rationale: यह ऐसा आलंकारिक प्रश्न प्रस्तुत करता है जिसका अपेक्षित उत्तर ‘हाँ’ है; हिन्दी में यह रचना उसी बल को स्वाभाविक ढंग से बनाए रखती है।
- source_word: δώδεκα ὧραί εἰσιν τῆς ἡμέρας
  choice: दिन के बारह घंटे होते
  rationale: सम्बन्धवाचक यूनानी रचना को सहज हिन्दी में व्यक्त करता है और दिन के उजाले की अवधि को बारह घंटों में बाँटने की प्राचीन धारणा को यथावत रखता है।
- source_word: ἐάν τις περιπατῇ ἐν τῇ ἡμέρᾳ
  choice: यदि कोई दिन में चलता है
  rationale: τις के सामान्य, अनिश्चित एकवचन अर्थ और शर्तवाचक रचना को सुरक्षित रखता है; ‘दिन में’ निकटवर्ती ‘दिन के बारह घंटे’ के साथ समानता भी बनाए रखता है।
- source_word: προσκόπτει
  choice: ठोकर नहीं खाता
  rationale: यह शाब्दिक चलने की छवि और सम्भावित रूपकात्मक अर्थ—दोनों को ‘टकराता’ या ‘गिरता’ की अपेक्षा अधिक ठीक ढंग से खुला रखता है।
- source_word: τὸ φῶς τοῦ κόσμου τούτου
  choice: इस संसार का प्रकाश
  rationale: यूनानी सम्बन्धवाचक पदबंध और संकेतवाचक ‘इस’ को निकटता से व्यक्त करता है, साथ ही यूहन्ना में ‘प्रकाश’ की व्यापक अर्थ-प्रतिध्वनि को बिना स्पष्ट व्याख्या जोड़े बनाए रखता है।
- source_word: βλέπει
  choice: देखता है
  rationale: वर्तमानकालीन क्रिया का सीधा अर्थ देता है; ‘देख सकता है’ कहने से जुड़ने वाली सामर्थ्य की व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: यूहन्ना के प्रसंग में ‘प्रकाश’ का सम्भावित प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में सामान्य दृश्य-प्रकाश की छवि को रखते हुए प्रतीकात्मक सम्भावना को खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से यीशु अथवा परमेश्वर के मार्गदर्शन का प्रकाश कहना।
  rationale: तात्कालिक कथन दिन में सुरक्षित चलने की परिचित छवि पर आधारित है, पर यूहन्ना में ‘प्रकाश’ का व्यापक धर्मवैचारिक महत्त्व भी है। अनुवाद किसी एक स्तर को थोपे बिना दोनों को सम्भव रहने देता है।
- issue: τις के अनिश्चित प्रतिनिधिक एकवचन का प्रस्तुतीकरण
  choice: ‘कोई ... वह’
  alternative: बहुवचन ‘लोग ... वे’ या केवल लिंग-निरपेक्ष पुनर्रचना।
  rationale: हिन्दी की स्वाभाविक प्रतिनिधिक एकवचन रचना यूनानी संख्या को सुरक्षित रखती है; यहाँ ‘वह’ व्याकरणिक रूप से लिंग प्रकट नहीं करता, इसलिए अनावश्यक पुरुषवाचक अर्थ भी नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आलंकारिक प्रश्न, चलने और ठोकर खाने की ठोस छवि तथा ‘प्रकाश’ की सम्भावित बहुस्तरीयता को सुरक्षित रखा गया है।
