source:
  edition: SBLGNT
  text: συνήγαγον οὖν οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι συνέδριον, καὶ ἔλεγον· Τί ποιοῦμεν ὅτι οὗτος ὁ ἄνθρωπος πολλὰ ⸂ποιεῖ σημεῖα⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/047.yaml
  text: So the chief priests and the Pharisees gathered a council and were saying[a], “What are we doing? For this man is doing many signs.”
translation:
  language: hi
  text: इसलिए प्रधान याजकों और फरीसियों ने परिषद्[a] बुलाई और कह रहे थे, “हम क्या कर रहे हैं? क्योंकि यह आदमी बहुत-से चिन्ह दिखा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदी महासभा (सन्हेद्रिन)।” यूनानी शब्द यहूदियों की शासकीय परिषद् का उल्लेख कर सकता है।
    reason: संस्थागत पहचान की संभावित वैकल्पिक अभिव्यक्ति
lexical_decisions:
- source_word: συνήγαγον
  choice: बैठक बुलाई
  rationale: क्रिया का अर्थ इकट्ठा करना या एकत्र करना है। परिषद् के संदर्भ में आधुनिक हिन्दी में ‘बैठक बुलाई’ स्वाभाविक रूप से सभा को एकत्र करने का भाव व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह लाज़र को जिलाए जाने के बाद की प्रतिक्रिया और परिणाम को पिछले प्रसंग से जोड़ता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन यहाँ प्रमुख याजकीय अधिकारियों के लिए है, न कि एक ही समय पद पर बैठे अनेक महायाजकों के लिए।
- source_word: Φαρισαῖοι
  choice: फरीसियों
  rationale: इस यहूदी धार्मिक समूह का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: συνέδριον
  choice: परिषद्
  rationale: यह व्यापक यूनानी अर्थ को बनाए रखता है और मुख्य पाठ में तत्काल ‘सन्हेद्रिन’ की तकनीकी पहचान थोपता नहीं; संभावित संस्थागत पहचान पादटिप्पणी में दी गई है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल चल रही या आरम्भ होकर जारी चर्चा का संकेत देता है; ‘कहने लगे’ हिन्दी में इस पहलू को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Τί ποιοῦμεν
  choice: हम क्या कर रहे हैं?
  rationale: यूनानी में वर्तमान निर्देशार्थक रूप है। यह अनुवाद उसके सीधे रूप और वक्ताओं की व्याकुलता दोनों को बनाए रखता है, बिना उसे स्पष्ट रूप से ‘हमें क्या करना चाहिए?’ में बदलने के।
- source_word: ὅτι
  choice: क्योंकि
  rationale: उनके प्रश्न का कारण प्रस्तुत करता है।
- source_word: οὗτος ὁ ἄνθρωπος
  choice: यह आदमी
  rationale: वक्ताओं द्वारा यीशु के लिए प्रयुक्त प्रत्यक्ष और कुछ हद तक उपेक्षापूर्ण संबोधन को सुरक्षित रखता है।
- source_word: πολλὰ ποιεῖ σημεῖα
  choice: बहुत-से चिन्ह दिखा रहा है
  rationale: ‘चिन्ह’ यूहन्ना में इन कामों के प्रकाशनात्मक महत्व को बनाए रखता है। हिन्दी में ‘चिन्ह करना’ अस्वाभाविक है, इसलिए ‘चिन्ह दिखाना’ वर्तमानकालीन निरंतर कार्य को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में σημεῖα का अनुवाद
  choice: चिन्ह
  alternative: चमत्कार; चमत्कारी चिन्ह
  rationale: यूहन्ना यीशु के कामों को ऐसे प्रकाशनात्मक चिन्हों के रूप में प्रस्तुत करता है जो उनकी पहचान की ओर संकेत करते हैं। ‘चिन्ह’ इस धार्मिक अर्थभार को बचाता है और मुख्य पाठ में ‘चमत्कारी’ जैसा व्याख्यात्मक विशेषण नहीं जोड़ता।
- issue: συνέδριον की संस्थागत पहचान
  choice: परिषद्
  alternative: यहूदी महासभा; सन्हेद्रिन
  rationale: मुख्य पाठ यूनानी संज्ञा का अर्थ देता है और यह निश्चित किए बिना कि तकनीकी नाम ही अभिप्रेत है, उसकी वास्तविक संदर्भगत पहचान की संभावना पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘प्रधान याजक,’ ‘फरीसी’ और ‘चिन्ह’ जैसे बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी का है।
