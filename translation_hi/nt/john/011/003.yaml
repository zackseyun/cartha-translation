id: JHN.11.3
reference: John 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπέστειλαν οὖν αἱ ἀδελφαὶ πρὸς αὐτὸν λέγουσαι· Κύριε, ἴδε ὃν φιλεῖς ἀσθενεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/003.yaml
  text: So the sisters sent word to him, saying, “Lord, look, the one you love is sick.”
translation:
  language: hi
  text: इसलिए बहनों ने यीशु के पास यह संदेश भेजा, “प्रभु, देखिए, जिससे आप प्रेम करते हैं वह बीमार है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλαν ... πρὸς αὐτόν
  choice: यीशु के पास ... संदेश भेजा
  rationale: क्रिया का शाब्दिक अर्थ ‘भेजा’ है; λέγουσαι के साथ प्रसंग स्पष्ट करता है कि बहनों ने मौखिक संदेश भिजवाया। सर्वनाम αὐτόν को हिन्दी में संदर्भ की स्पष्टता के लिए ‘यीशु’ किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्मानपूर्ण संबोधन और यूहन्ना के कथानक में इसकी संभावित धार्मिक गहराई—दोनों को सुरक्षित रखता है।
- source_word: ἴδε
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले यूनानी आदेशवाचक का स्वाभाविक और सम्मानसूचक हिन्दी रूप; इसे केवल ‘सुनिए’ या पूर्णतः लोप नहीं किया गया।
- source_word: ὃν φιλεῖς
  choice: जिससे आप प्रेम करते हैं
  rationale: φιλέω यहाँ व्यक्तिगत स्नेह/प्रेम व्यक्त करता है; ‘प्रेम’ स्वाभाविक है और आवश्यकता से अधिक विशिष्ट भाव नहीं थोपता।
- source_word: ἀσθενεῖ
  choice: बीमार है
  rationale: वर्तमान दशा बताने वाली क्रिया का सीधा, सामान्य हिन्दी रूप।
theological_decisions:
- issue: ‘प्रभु’ संबोधन का आशय
  choice: प्रभु
  alternative: स्वामी/महोदय
  rationale: मूल Κύριε को ऐसे ही रखा गया है कि यह सम्मानपूर्ण संबोधन भी रह सके और यूहन्ना के व्यापक धार्मिक अर्थ को भी समय से पहले सीमित न करे।
- issue: φιλέω और ἀγαπάω के बीच संभावित भेद
  choice: प्रेम करते हैं
  alternative: स्नेह रखते हैं
  rationale: इस पद में किसी तकनीकी या सिद्धान्तगत भेद को आरोपित नहीं किया गया; सामान्य ‘प्रेम’ मूल की संबंधपरक गर्माहट को पर्याप्त रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’ और ‘देखिए’ के साथ। वाक्य साधारण पाठकों के लिए स्वाभाविक रखा गया है, जबकि ‘प्रभु’ और ‘देखिए’ जैसे मूल के प्रमुख तत्व सुरक्षित हैं।
