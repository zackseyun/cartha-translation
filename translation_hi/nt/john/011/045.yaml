    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλοὶ οὖν
  choice: इसलिए ... बहुतों ने
  rationale: οὖν पिछले प्रसंग, विशेषकर लाज़र को जीवित किए जाने, से परिणामसूचक संबंध दिखाता है; ‘इसलिए’ इसे स्पष्ट रखता है। Πολλοὶ का ‘बहुतों’ स्वाभाविक और अनिश्चित किंतु बड़ी संख्या का संकेत देता है।
- source_word: ἐκ τῶν Ἰουδαίων
  choice: उन यहूदियों में से
  rationale: ἐκ के अंशवाचक भाव को स्पष्ट रूप से बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ ἐλθόντες πρὸς τὴν Μαριὰμ
  choice: जो मरियम के पास आए थे
  rationale: संज्ञार्थक कृदंत उन यहूदियों की पहचान करता है जिनका उल्लेख है; ‘आए थे’ मुख्य क्रिया से पहले की घटना व्यक्त करता है।
- source_word: θεασάμενοι ἃ ἐποίησεν
  choice: जिन्होंने देखा था कि उसने क्या किया
  rationale: θεάομαι के प्रत्यक्ष और ध्यानपूर्वक देखने के भाव को सहज हिन्दी ‘देखा’ से व्यक्त किया गया है; ἃ ἐποίησεν को मुहावरेदार ढंग से ‘उसने क्या किया’ कहा गया है।
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: उस पर विश्वास किया
  rationale: यूहन्ना में εἰς के साथ πιστεύω व्यक्ति की ओर निर्देशित विश्वास को दर्शाता है; ‘उस पर विश्वास किया’ मानक, स्पष्ट और अनावश्यक विस्तार से मुक्त हिन्दी है।
theological_decisions:
- issue: यूहन्ना के उद्धार-संबंधी प्रसंग में πιστεύω εἰς αὐτόν का अनुवाद
  choice: उस पर विश्वास किया
  alternative: उस पर भरोसा रखा
  rationale: ‘विश्वास किया’ यूनानी अभिव्यक्ति को निकटता से और स्वाभाविक हिन्दी में रखता है। ‘भरोसा रखा’ संभव है, पर वह विश्वास के भाव को कुछ अधिक व्याख्यायित करता है।
