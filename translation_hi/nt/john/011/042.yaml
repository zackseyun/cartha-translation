id: JHN.11.42
reference: John 11:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ᾔδειν ὅτι πάντοτέ μου ἀκούεις· ἀλλὰ διὰ τὸν ὄχλον τὸν περιεστῶτα εἶπον, ἵνα πιστεύσωσιν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/042.yaml
  text: But I knew that you always hear me[a]. Yet I said this because of the crowd standing around[b], so that they may believe that you sent me.
translation:
  language: hi
  text: पर मैं जानता था कि आप हमेशा मेरी सुनते हैं। फिर भी मैंने यह बात आसपास खड़ी भीड़ के कारण[a] कही, ताकि वे विश्वास करें कि आपने ही[b] मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आसपास खड़ी भीड़ की खातिर।’
    reason: διά के साथ कर्मकारक कारण (‘के कारण’) के साथ-साथ किसी के हित अथवा वास्ते (‘की खातिर’) का भाव भी दे सकता है।
  - marker: b
    text: यूनानी में ‘आप’ पर विशेष बल है।
    reason: मूल पाठ में स्पष्ट कर्ता-सर्वनाम σύ प्रयुक्त है; मुख्य पाठ में यह बल ‘ही’ से व्यक्त किया गया है।
lexical_decisions:
- source_word: ᾔδειν
  choice: मैं जानता था
  rationale: οἶδα का यह रूप भूतकालीन अर्थ देता है। ‘मैं जानता था’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से पूर्वपूर्ण काल नहीं थोपता।
- source_word: πάντοτέ μου ἀκούεις
  choice: आप हमेशा मेरी सुनते हैं
  rationale: πάντοτε का अर्थ ‘हमेशा’ है। प्रार्थना के संदर्भ में ἀκούω के साथ सम्बन्धकारक सर्वनाम ग्रहणशील ढंग से सुनने का भाव देता है; हिन्दी मुहावरा ‘मेरी सुनते हैं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀλλὰ
  choice: फिर भी
  rationale: यह यीशु के पहले से जानने और भीड़ के लाभ के लिए ऊँचे स्वर में कहने के बीच विरोध व्यक्त करता है।
- source_word: διὰ τὸν ὄχλον τὸν περιεστῶτα
  choice: आसपास खड़ी भीड़ के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा किसी के हित को सूचित कर सकता है। मुख्य पाठ में सीधा कारणार्थ रखा गया है और वैकल्पिक हितार्थ फुटनोट में दिया गया है। περιεστῶτα भीड़ की यीशु के आसपास उपस्थित स्थिति बताता है।
- source_word: εἶπον
  choice: मैंने यह बात ... कही
  rationale: ‘यह बात’ निकटवर्ती संदर्भ में अभी कही गई प्रार्थना की ओर संकेत करता है और हिन्दी में आवश्यक स्पष्टता देता है।
- source_word: ἵνα πιστεύσωσιν
  choice: ताकि वे विश्वास करें
  rationale: ἵνα और विधिलिंग उद्देश्य प्रकट करते हैं; ‘ताकि’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι σύ με ἀπέστειλας
  choice: कि आपने ही मुझे भेजा है
  rationale: स्पष्ट सर्वनाम σύ का बल ‘ही’ से सुरक्षित रखा गया है। हिन्दी में पूर्व में किए गए भेजने के कार्य की वर्तमान प्रासंगिकता के लिए ‘भेजा है’ स्वाभाविक है।
theological_decisions:
- issue: पिता द्वारा यीशु की बात हमेशा सुने जाने का आशय
  choice: कथन को बिना विस्तार के रखा गया है कि पिता हमेशा यीशु की सुनते हैं, जबकि यीशु ने उपस्थित लोगों के लाभ के लिए यह बात सार्वजनिक रूप से कही।
  alternative: इसे सामान्य रूप से हर प्रार्थना के उत्तर की प्रतिज्ञा के रूप में समझाना।
  rationale: तात्कालिक संदर्भ लाज़र को जिलाने से पहले यीशु की प्रार्थना है। अनुवाद पिता और पुत्र के सम्बन्ध तथा सार्वजनिक कथन के उद्देश्य—दोनों को बनाए रखता है, पर पाठ से आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: सार्वजनिक प्रार्थना का उद्देश्य
  choice: उद्देश्य यह है कि आसपास के लोग विश्वास करें कि पिता ने यीशु को भेजा है।
  alternative: उद्देश्य को केवल इसी विशेष चमत्कार की पुष्टि तक सीमित करना।
  rationale: ἵνα-वाक्य स्पष्ट रूप से ‘कि आपने मुझे भेजा है’ पर केंद्रित है। अनुवाद यीशु के भेजे जाने के कथन को न संकुचित करता है, न उससे आगे बढ़ाता है।
- issue: σύ का बल
  choice: ‘आपने ही’ द्वारा पिता पर निहित बल व्यक्त किया गया है।
  alternative: सिर्फ ‘आपने मुझे भेजा है’ कहना और बल को केवल फुटनोट में बताना।
  rationale: मूल यूनानी में सर्वनाम σύ स्पष्ट रूप से उपस्थित है और कर्ता पर बल देता है; हिन्दी का ‘ही’ इस बल को मुख्य पाठ में स्वाभाविक रूप से संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, आदरपूर्ण और गरिमापूर्ण रूप अपनाया गया है। पिता के लिए ‘आप’ और सम्बद्ध बहुवचन क्रियारूप रखे गए हैं। ‘मेरी सुनते हैं’ प्रार्थना के संदर्भ में सामान्य पाठक के लिए स्वाभाविक है। अंग्रेज़ी परामर्श-पाठ में फुटनोट चिह्नों का स्थान उनकी सामग्री से उलटा दिखाई देता था; स्रोत के आधार पर [a] को ‘भीड़ के कारण’ और [b] को बलयुक्त ‘आपने ही’ के बाद रखा गया है।
