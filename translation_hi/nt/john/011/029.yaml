  verdict: revise
  source_fidelity: The draft accurately identifies Mary as the referent of ἐκείνη, renders ἠγέρθη naturally as ‘उठी,’ and appropriately reflects the imperfect ἤρχετο with ‘जाने लगी.’ However, ‘सुनते ही’ makes the response more immediate than ὡς (‘when’) necessarily states. ‘जब उसने यह सुना’ preserves the temporal relation without adding that emphasis.
  naturalness: The revised wording is fluent, modern standard Hindi and retains a restrained narrative register. The honorific ‘उनके’ is natural for referring to Jesus in Hindi.
  terminology: No theological terminology occurs. ‘उनके पास’ is an idiomatic and contextually clear rendering of πρὸς αὐτόν; ‘जाने लगी’ retains the movement-in-progress nuance without claiming more than the Greek does.
  issues:
