  text: And when she heard it[a], she got up quickly and went to him.
translation:
  language: hi
  text: जब उसने यह सुना, तो वह जल्दी से उठी और उनके पास जाने लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκείνη
  choice: वह
  rationale: यह संकेतवाचक शब्द निकट संदर्भ में मरियम की ओर संकेत करता है। आधुनिक हिन्दी में ‘वह’ स्वाभाविक है और संदर्भ से स्त्रीलिंग स्पष्ट रहता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: यहाँ δέ केवल कथा को आगे बढ़ाने वाला हल्का संयोजक है। हिन्दी वाक्य-प्रवाह में इसे अलग से ‘और’ या ‘तब’ कहना आवश्यक नहीं है।
- source_word: ὡς ἤκουσεν
  choice: यह सुनते ही
  rationale: ὡς यहाँ कालवाचक है और ἤκουσεν का अर्थ ‘सुना’ है। ‘यह’ पिछले पद में दिए गए संदेश की ओर संकेत करता है; ‘सुनते ही’ मरियम की तत्पर प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि यह साधारण ‘जब उसने सुना’ से कुछ अधिक तात्कालिक है।
- source_word: ἠγέρθη
  choice: उठी
  rationale: रूप औपचारिक रूप से कर्मवाच्य है, पर इस अकर्मक प्रसंग में अर्थ स्वयं उठने का है; ‘उठाई गई’ बाहरी कर्ता का अनुचित संकेत देगा।
- source_word: ταχὺ
  choice: जल्दी से
  rationale: यह क्रिया-विशेषण शीघ्रता या तत्परता बताता है। ‘जल्दी से’ सरल और स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἤρχετο
  choice: जाने लगी
  rationale: अपूर्ण भूतकाल गति को प्रगतिशील रूप में दिखाता है। ‘जाने लगी’ उस आरम्भ और जारी गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρὸς αὐτόν
  choice: उनके पास
  rationale: πρός + कर्मकारक किसी व्यक्ति की ओर गति दर्शाता है। सम्मानसूचक ‘उनके’ यीशु के लिए स्वाभाविक हिन्दी प्रयोग है; ‘पास’ लक्ष्य की ओर जाने को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। ‘उनके’ में यीशु के लिए प्रचलित सम्मानसूचक बहुवचन रखा गया है। यूनानी अपूर्ण भूतकाल की प्रगतिशीलता ‘जाने लगी’ से सुरक्षित है।
