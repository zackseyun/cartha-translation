    issue: ‘यह सुनते ही’ is stronger than the temporal connective ὡς.
    rationale: It conventionally implies immediate action (‘as soon as she heard’), whereas the Greek can simply mean ‘when she heard.’ The promptness is already explicitly expressed by ταχὺ, ‘जल्दी से.’
