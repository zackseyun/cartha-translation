  yaml_path: translation/nt/john/011/025.yaml
  text: Jesus said to her[a], “I am the resurrection and the life. The one who believes in me, even if he dies, will live,”
translation:
  language: hi
  text: यीशु ने उससे कहा, “मैं पुनरुत्थान और जीवन हूँ। जो मुझ पर विश्वास करता है[a], वह मर भी जाए, तो जीएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “जो विश्वास करता है … वह मर जाए” एकवचन पुल्लिंग रूप में है, लेकिन यह प्रतिनिधिक अर्थ में किसी भी विश्वास करने वाले व्यक्ति के लिए प्रयुक्त है।
    reason: यूनानी के प्रतिनिधिक पुल्लिंग एकवचन के समावेशी संदर्भ को स्पष्ट करता है, बिना किसी भ्रामक वैकल्पिक अनुवाद को प्रस्तुत किए।
lexical_decisions:
- source_word: εἶπεν αὐτῇ
  choice: उससे कहा
  rationale: यह सामान्य कथात्मक वाक्य-विन्यास है। αὐτῇ संदर्भ में मार्था की ओर संकेत करता है; हिन्दी का ‘उससे’ स्वाभाविक रूप से अप्रत्यक्ष कर्म व्यक्त करता है।
- source_word: Ἐγώ εἰμι
  choice: मैं ही … हूँ
  rationale: व्यक्त सर्वनाम Ἐγώ के बल को हिन्दी में ‘ही’ से स्वाभाविक ढंग से व्यक्त किया गया है, जबकि यीशु के सीधे आत्म-परिचय को बनाए रखा गया है।
- source_word: ἡ ἀνάστασις
  choice: पुनरुत्थान
  rationale: यहाँ शब्द मृतकों में से जी उठने के अर्थ में है। हिन्दी में उपपद न होने के कारण यूनानी निश्चित उपपद का अलग शब्द जोड़ना आवश्यक नहीं है।
- source_word: ἡ ζωή
  choice: जीवन
  rationale: ‘जीवन’ पुनरुत्थान के समानांतर यीशु के निश्चित आत्म-परिचय को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὁ πιστεύων
  choice: जो … विश्वास करता है
  rationale: यह वर्तमान कृदन्त विश्वास करने वाले किसी भी व्यक्ति को प्रतिनिधिक एकवचन में दर्शाता है; हिन्दी में यह संरचना स्वाभाविक है और निरंतर विशेषता का भाव बनाए रखती है।
- source_word: εἰς ἐμέ
  choice: मुझ पर
  rationale: πιστεύω εἰς का सम्बन्धपरक भरोसे वाला अर्थ हिन्दी में ‘पर विश्वास करना’ से मुहावरेदार ढंग से व्यक्त होता है।
- source_word: κἂν ἀποθάνῃ
  choice: वह मर भी जाए, तो
  rationale: यह concessive condition को सहज हिन्दी में व्यक्त करता है; ‘भी’ κἂν के ‘भले ही/यदि भी’ वाले बल को बनाए रखता है।
- source_word: ζήσεται
  choice: जीवित रहेगा
  rationale: यह भविष्यकालीन जीवन की प्रतिज्ञा को बनाए रखता है, बिना यूनानी से अधिक स्पष्ट रूप से ‘फिर’ या ‘दोबारा’ जोड़ने के।
theological_decisions:
- issue: ὁ πιστεύων और उसके बाद की एकवचन पुल्लिंग क्रियाओं का प्रतिनिधिक प्रयोग
  choice: जो मुझ पर विश्वास करता है, वह मर भी जाए, तो जीवित रहेगा
  alternative: जो कोई मुझ पर विश्वास करता है, भले ही मर जाए, जीवित रहेगा
  rationale: मुख्य पाठ यूनानी के एकवचन को बनाए रखता है। हिन्दी का पुल्लिंग एकवचन यहाँ प्रतिनिधिक है और किसी भी विश्वास करने वाले व्यक्ति को समेटता है; पादटिप्पणी इस समावेशी अर्थ को स्पष्ट करती है।
- issue: Ἐγώ εἰμι ἡ ἀνάστασις καὶ ἡ ζωή में यीशु का आत्म-परिचय
  choice: मैं ही पुनरुत्थान और जीवन हूँ
  alternative: मैं पुनरुत्थान देता और जीवन देता हूँ
  rationale: सीधा विधेयात्मक दावा सुरक्षित रखा गया है; इसे केवल यीशु के कार्य के वर्णन में बदलकर उसके मसीह-संबंधी बल को कम नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘मैं ही’ मूल के व्यक्त सर्वनाम पर बल को दर्शाता है। ‘पुनरुत्थान’ स्थापित बाइबलीय शब्द है, जबकि शेष वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
