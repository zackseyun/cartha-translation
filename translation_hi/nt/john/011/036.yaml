  yaml_path: translation/nt/john/011/036.yaml
  text: So the Jews were saying[a], “See how he loved him!”
translation:
  language: hi
  text: इसलिए यहूदी कह रहे थे[a], “देखो, वह उससे कितना प्रेम करता था!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के निवासी,” यदि इसे वहाँ उपस्थित यहूदी दर्शकों के लिए अधिक क्षेत्र-विशिष्ट उल्लेख माना जाए।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार कही जा रही बात का भाव देता है; ‘कह रहे थे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद में यीशु के रोने पर उपस्थित लोगों की प्रतिक्रिया या निष्कर्ष को जोड़ता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यह यूनानी पद का सीधा और पारंपरिक अर्थ है। इस प्रसंग में इसका संकेत वहाँ उपस्थित यहूदी शोक मनाने वालों या देखने वालों की ओर है, समस्त यहूदी लोगों की ओर नहीं।
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाली आज्ञा है और उद्धृत वाणी में स्वाभाविक है।
- source_word: πῶς
  choice: कितना
  rationale: यहाँ रोने से प्रकट प्रेम की तीव्रता प्रमुख है; ‘कितना’ आधुनिक हिन्दी में इस विस्मय को स्वाभाविक रूप से व्यक्त करता है, यद्यपि यूनानी शब्द रीति और मात्रा दोनों का भाव दे सकता है।
- source_word: ἐφίλει
  choice: प्रेम करता था
  rationale: φιλέω यहाँ व्यक्तिगत स्नेह और प्रेम को व्यक्त करता है। ‘प्रेम करता था’ गरिमापूर्ण, सहज और अपूर्ण भूतकाल के अनुकूल है।
- source_word: αὐτόν
  choice: उससे
  rationale: हिन्दी में ‘प्रेम करना’ के साथ संबंधबोधक ‘से’ आता है; इसका संकेत लाज़र की ओर है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का अनुवाद
  choice: यहूदी
  alternative: यहूदिया के लोग
  rationale: मुख्य पाठ स्रोत की सामान्य जातीय-सामुदायिक संज्ञा को बनाए रखता है। संदर्भ स्पष्ट करता है कि यहाँ विशेष रूप से घटनास्थल पर उपस्थित यहूदी लोगों की बात है; इसे समस्त यहूदियों के विषय में कथन नहीं समझना चाहिए। क्षेत्रीय अर्थ की संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बोलचाल में स्वाभाविक उद्धरण। ‘कितना प्रेम करता था’ दृश्य में व्यक्त भाव की तीव्रता को सहज हिन्दी में सामने लाता है।
