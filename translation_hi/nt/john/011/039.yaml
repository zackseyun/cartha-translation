id: JHN.11.39
reference: John 11:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει ὁ Ἰησοῦς· Ἄρατε τὸν λίθον. λέγει αὐτῷ ἡ ἀδελφὴ τοῦ ⸀τετελευτηκότος Μάρθα· Κύριε, ἤδη ὄζει, τεταρταῖος γάρ ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/039.yaml
  text: Jesus said[a], “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by now he smells[c][b], for he has been dead four days.”
translation:
  language: hi
  text: यीशु ने कहा, “पत्थर हटा दो।” मृत व्यक्ति[a] की बहन मार्था ने उनसे कहा, “प्रभु, अब तो उससे दुर्गंध आती है[b], क्योंकि उसे मरे चार दिन हो चुके हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस व्यक्ति की, जिसकी मृत्यु हो चुकी थी।”
    reason: यूनानी परफेक्ट कृदन्त का अधिक शाब्दिक विकल्प।
  - marker: b
    text: यूनानी क्रिया का अर्थ “गंध छोड़ना” है; इस प्रसंग में आशय दुर्गंध से है। या, “वह बदबू मारता है।”
    reason: मूल क्रिया की अर्थ-सीमा और अधिक तीखे बोलचाल के विकल्प को स्पष्ट करना।
  - marker: c
    text: शाब्दिक रूप से, “क्योंकि वह चौथे दिन का है,” अर्थात उसे मरे चार दिन हो चुके हैं।
    reason: यूनानी विशेषण की असामान्य शाब्दिक बनावट और उसके प्रसंगगत अर्थ को बताना।
lexical_decisions:
- source_word: Ἄρατε
  choice: हटा दो
  rationale: बहुवचन अओरिस्ट आज्ञार्थक यहाँ उपस्थित लोगों को कब्र के मुँह से पत्थर हटाने की आज्ञा देता है। ‘हटा दो’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के अनुकूल है।
- source_word: τὸν λίθον
  choice: पत्थर
  rationale: कब्र के प्रसंग में यह उस पत्थर को सूचित करता है जो प्रवेश-द्वार पर रखा था।
- source_word: τοῦ τετελευτηκότος
  choice: मृत व्यक्ति
  rationale: परफेक्ट कृदन्त उस व्यक्ति को सूचित करता है जिसकी मृत्यु हो चुकी है और जो अब मृत अवस्था में है। ‘मृत व्यक्ति’ संक्षिप्त, स्पष्ट और स्वाभाविक है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन में κύριε आदर व्यक्त करता है और यूहन्ना के व्यापक कथानक में केवल सामान्य शिष्टाचार से अधिक अर्थ रख सकता है। ‘प्रभु’ इस अर्थ-भार को खुला रखता है।
- source_word: ἤδη
  choice: अब तो
  rationale: यह बताता है कि बताई गई दशा इस समय तक उपस्थित हो चुकी है। संवाद में ‘अब तो’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ὄζει
  choice: उससे दुर्गंध आती है
  rationale: क्रिया का मूल अर्थ गंध छोड़ना है; मृत्यु और चार दिन के प्रसंग से अप्रिय गंध स्पष्ट है। हिन्दी में ‘उससे दुर्गंध आती है’ स्वाभाविक है, जबकि ‘वह बदबू मारता है’ अधिक बोलचाल का और तीखा है।
- source_word: τεταρταῖος
  choice: उसे मरे चार दिन हो चुके हैं
  rationale: विशेषण का शाब्दिक भाव ‘वह चौथे दिन का है’ है, अर्थात उसकी मृत्यु को चार दिन हो गए हैं। हिन्दी में अर्थ स्पष्ट करने के लिए इस स्वाभाविक विस्तार की आवश्यकता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह मार्था के कथन का कारण प्रस्तुत करता है; हिन्दी संवाद में ‘क्योंकि’ सम्बन्ध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: मार्था द्वारा यीशु के लिए κύριε सम्बोधन
  choice: प्रभु
  alternative: महोदय
  rationale: यह सम्बोधन आदरपूर्ण है और यूहन्ना के सुसमाचार में गहरा धार्मिक अर्थ भी ग्रहण कर सकता है। ‘प्रभु’ उस सम्भावना को बनाए रखता है, पर इस एक पद में मार्था के आशय को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक संवाद के अनुकूल है। ‘दुर्गंध’ ने प्रसंग की स्पष्टता बनाए रखते हुए अत्यधिक बोलचाल के ‘बदबू मारना’ से परहेज़ किया है। सर्वनाम ‘उनसे’ यीशु के लिए सामान्य आदरसूचक प्रयोग है।
