reference: John 11:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ ὡς ἦλθεν ὅπου ⸀ἦν Ἰησοῦς ἰδοῦσα αὐτὸν ἔπεσεν αὐτοῦ ⸀πρὸς τοὺς πόδας, λέγουσα αὐτῷ· Κύριε, εἰ ἦς ὧδε οὐκ ἄν ⸂μου ἀπέθανεν⸃ ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/032.yaml
  text: So when Mary came where Jesus was and saw him[a], she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”
translation:
  language: hi
  text: तब जब मरियम उस जगह पहुँची जहाँ यीशु थे और उन्हें देखा, तो वह उनके चरणों में गिर पड़ी और उनसे कहा, “प्रभु[a], यदि आप यहाँ होते, तो मेरा भाई न मरा होता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε आदरपूर्ण संबोधन भी हो सकता है; यहाँ यीशु के लिए इसका अनुवाद “प्रभु” किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा की प्रगति और परिणाम-संबंध को जोड़ता है; ‘इसलिए’ संयोजक बल को स्पष्ट रखता है।
- source_word: ὡς ἦλθεν
  choice: जब ... पहुँची
  rationale: ὡς यहाँ कालवाचक है और मरियम के यीशु के स्थान पर पहुँचने की परिस्थिति बताता है।
- source_word: ὅπου ἦν Ἰησοῦς
  choice: उस जगह ... जहाँ यीशु थे
  rationale: यह स्थानवाचक उपवाक्य का स्वाभाविक हिन्दी रूप है और मूल अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: ἰδοῦσα αὐτόν
  choice: और उन्हें देखा
  rationale: काल-सापेक्ष कृदन्त को हिन्दी में जुड़े हुए समापिका क्रिया-रूप से व्यक्त करना सहज है और घटनाक्रम सुरक्षित रहता है।
- source_word: ἔπεσεν αὐτοῦ πρὸς τοὺς πόδας
  choice: वह उनके पैरों पर गिर पड़ी
  rationale: यह यीशु के चरणों में गिरने या दण्डवत होने की मुद्रा व्यक्त करता है; ‘पैरों पर गिर पड़ी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: λέγουσα αὐτῷ
  choice: उनसे कहने लगी
  rationale: वर्तमान कृदन्त उसके गिरने के साथ जुड़े कथन का परिचय देता है; यह हिन्दी में प्रवाहपूर्ण ढंग से उस संबंध को व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριε आदरसूचक ‘महोदय’ भी हो सकता है, पर यूहन्ना के वृत्तांत और κύριος के सामान्य बाइबलीय अनुवाद को ध्यान में रखते हुए ‘प्रभु’ उपयुक्त है; विकल्प को पादटिप्पणी में रखा गया है।
- source_word: εἰ ἦς ὧδε
  choice: यदि आप यहाँ होते
  rationale: यह भूतकाल की तथ्य-विपरीत शर्त है; हिन्दी में ‘यदि आप यहाँ होते’ उसका स्वाभाविक रूप है।
- source_word: οὐκ ἄν ... ἀπέθανεν
  choice: न मरता
  rationale: ἄν के साथ अओरिस्ट तथ्य-विपरीत भूतकालीन परिणाम व्यक्त करता है; शर्तीय वाक्य में ‘न मरता’ इसे संक्षेप और स्वाभाविक रूप से देता है।
- source_word: μου ὁ ἀδελφός
  choice: मेरा भाई
  rationale: μου का संबंधवाचक अर्थ हिन्दी के स्वाभाविक अधिकारसूचक ‘मेरा’ से व्यक्त होता है।
theological_decisions:
- issue: यीशु को संबोधित करते हुए κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: संबोधन में आदर का अर्थ संभव है, किंतु ‘प्रभु’ यूहन्ना के सुसमाचार में शब्द के व्यापक कथात्मक और धर्मवैचारिक भार को बनाए रखता है। पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरवाचक बहुवचन के साथ। भाषा सहज और गरिमापूर्ण रखी गई है; तथ्य-विपरीत शर्त को हिन्दी के स्वाभाविक ‘यदि ... होते, तो ... न मरता’ ढाँचे में व्यक्त किया गया है।
