review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Mary's arrival, seeing Jesus, falling at his feet, and the counterfactual statement. However, “कहने लगी” can suggest that she began speaking, whereas λέγουσα simply introduces her words. “न मरा होता” more explicitly communicates the past contrary-to-fact aorist result than “न मरता.”
  naturalness: The revised wording is fluent modern standard Hindi. “चरणों में गिर पड़ी” is idiomatic and clearly expresses falling at Jesus’ feet; “उनसे कहा” is natural direct-speech introduction.
  terminology: “प्रभु” appropriately retains the project’s default rendering of κύριε while the footnote preserves the viable respectful alternative “महोदय.” Honorific plural forms for Jesus are consistent.
  issues:
  - severity: low
    issue: “कहने लगी” adds an inceptive nuance.
    rationale: λέγουσα means “saying,” not specifically “began to say.” Replacing it with “उनसे कहा” gives the intended speech introduction without that added nuance.
  - severity: medium
    issue: “न मरता” is less explicit about the completed past result.
    rationale: The Greek apodosis uses an aorist with ἄν in a past contrary-to-fact condition. “न मरा होता” naturally and explicitly expresses “would not have died.”
  - severity: low
    issue: “इसलिए” may sound more inferential than the narrative connective requires.
    rationale: οὖν can mark narrative continuation here. “तब” is a natural Hindi equivalent that preserves the transition without overstating logical consequence.
  revised_text: तब जब मरियम उस जगह पहुँची जहाँ यीशु थे और उन्हें देखा, तो वह उनके चरणों में गिर पड़ी और उनसे कहा, “प्रभु[a], यदि आप यहाँ होते, तो मेरा भाई न मरा होता।”
