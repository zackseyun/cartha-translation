  to: तब जब मरियम उस जगह पहुँची जहाँ यीशु थे और उन्हें देखा, तो वह उनके चरणों में गिर पड़ी और उनसे कहा, “प्रभु[a], यदि आप यहाँ होते, तो मेरा भाई न मरा होता।”
  rationale: The revision removes the unnecessary inceptive force of “कहने लगी,” makes the past contrary-to-fact result explicit, and uses a smoother narrative connective. It retains the meaning, respectful register, and the lexical ambiguity of κύριε through the anchored footnote.
