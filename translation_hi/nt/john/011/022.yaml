  text: ⸀καὶ νῦν οἶδα ὅτι ὅσα ἂν αἰτήσῃ τὸν θεὸν δώσει σοι ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/022.yaml
  text: But even now I know that whatever you ask from God, God will give you.
translation:
  language: hi
  text: फिर भी अब मैं जानती हूँ कि आप परमेश्वर से जो कुछ भी माँगेंगे, परमेश्वर आपको दे देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ νῦν
  choice: फिर भी अब
  rationale: संदर्भ में καί मार्था के पिछले कथन के बाद विरोधात्मक मोड़ लाता है, जबकि νῦν का समय-संबंधी अर्थ बना रहता है।
- source_word: οἶδα
  choice: मैं जानती हूँ
  rationale: οἶδα का यहाँ वर्तमान अर्थ है। वक्ता मार्था है, इसलिए हिन्दी में स्त्रीलिंग रूप स्वाभाविक है।
- source_word: ὅσα ἂν
  choice: जो कुछ भी
  rationale: सापेक्ष सर्वनाम के साथ ἄν अनिश्चित और व्यापक दायरा व्यक्त करता है।
- source_word: αἰτήσῃ τὸν θεόν
  choice: आप परमेश्वर से ... माँगेंगे
  rationale: αἰτέω के साथ θεόν यूनानी में सीधा कर्म है; इस अर्थ में आधुनिक हिन्दी का स्वाभाविक प्रयोग ‘परमेश्वर से माँगना’ है। अोरिस्ट सब्जंक्टिव को अनिश्चित सापेक्ष वाक्य में भविष्य रूप सहजता से व्यक्त करता है।
- source_word: δώσει σοι ὁ θεός
  choice: परमेश्वर आपको दे देगा
  rationale: भविष्यकाल और स्पष्ट कर्ता ὁ θεός को सीधे रखा गया है; ‘दे देगा’ हिन्दी में आश्वस्त भाव और पूर्ण भविष्य क्रिया को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के परमेश्वर से माँगने और परमेश्वर के उन्हें देने संबंधी मार्था के कथन को सिद्धान्तगत विस्तार देकर बदलने का जोखिम
  choice: 'मार्था के कथन को उसके सीधे रूप में रखा गया: ‘आप परमेश्वर से जो कुछ भी माँगेंगे, परमेश्वर आपको दे देगा।’'
  alternative: ‘परमेश्वर’ को ‘पिता’ कहना या कथित अधीनता को कम करने के लिए वाक्य की व्याख्यात्मक पुनर्रचना करना
  rationale: पद मार्था का कथन प्रस्तुत करता है। ‘पिता’ मूल पाठ में नहीं है; इसलिए यूहन्ना के वृत्तांत में मौजूद संबंध और तनाव को बिना doctrinal विस्तार के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आप’ यीशु के प्रति मार्था के संबोधन के लिए उपयुक्त है। भाषा सहज और गरिमापूर्ण रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि ‘फिर भी अब’ संदर्भगत विरोध और ‘परमेश्वर से माँगना’ यूनानी मुहावरे—दोनों को स्वाभाविक हिन्दी में पर्याप्त रूप से व्यक्त करते हैं।
