id: JHN.11.21
reference: John 11:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν ⸀ἡ Μάρθα πρὸς ⸀τὸν Ἰησοῦν· Κύριε, εἰ ἦς ὧδε ⸂οὐκ ἂν ἀπέθανεν ὁ ἀδελφός μου⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/011/021.yaml
  text: So Martha said to Jesus[a], “Lord, if you had been here, my brother would not have died.”
translation:
  language: hi
  text: तब मार्था ने यीशु से कहा[a], “प्रभु, यदि आप यहाँ होते, तो मेरा भाई न मरता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय”; यूनानी शब्द κύριε आदरपूर्ण संबोधन के रूप में प्रयुक्त हो सकता है, लेकिन “प्रभु” यूहन्ना के सुसमाचार में उसके संभावित धर्मवैज्ञानिक अर्थ-भार को भी बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह कथानक को आगे बढ़ाने वाला संबंधसूचक शब्द है। यहाँ ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम की निरंतरता दिखाता है; ‘इसलिए’ अपेक्षाकृत अधिक स्पष्ट निष्कर्ष का भाव दे सकता है।
- source_word: εἶπεν
  choice: कहा
  rationale: इस कथात्मक प्रसंग में सामान्य वाणी-क्रिया के लिए ‘कहा’ सबसे स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: πρὸς τὸν Ἰησοῦν
  choice: यीशु से
  rationale: वाणी-क्रिया के बाद πρός तथा कर्मकारक संबोधित व्यक्ति को दर्शाते हैं। हिन्दी में ‘यीशु से कहा’ स्वाभाविक प्रयोग है।
- source_word: Κύριε
  choice: प्रभु
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन और यूहन्ना के सुसमाचार में संभव धर्मवैज्ञानिक गूंज—दोनों को बनाए रखता है।
- source_word: εἰ ἦς ὧδε
  choice: यदि आप यहाँ होते
  rationale: यह भूतकाल की तथ्य-विरुद्ध शर्त है। हिन्दी में ‘यदि आप यहाँ होते’ उस काल्पनिक पूर्वस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐκ ἂν ἀπέθανεν
  choice: तो मेरा भाई न मरता
  rationale: οὐκ + ἄν + भूतकालिक संकेतार्थ तथ्य-विरुद्ध शर्त का परिणाम व्यक्त करता है; ‘न मरता’ हिन्दी में उस अवास्तविक भूतकालीन परिणाम को संक्षेप और स्वाभाविक रूप से देता है।
- source_word: ὁ ἀδελφός μου
  choice: मेरा भाई
  rationale: यहाँ ἀδελφός मार्था के सगे पुरुष सहोदर लाज़र को दर्शाता है; ‘मेरा भाई’ सीधा और संदर्भानुकूल अनुवाद है।
theological_decisions:
- issue: यीशु के लिए मार्था के संबोधन Κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: ‘प्रभु’ सम्मानपूर्ण संबोधन होने के साथ संभावित मसीही अर्थ-भार भी सुरक्षित रखता है, पर इस पद में उस अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। आदरसूचक ‘आप’ मार्था के संबोधन के अनुरूप है।
