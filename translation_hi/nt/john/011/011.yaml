  text: ταῦτα εἶπεν, καὶ μετὰ τοῦτο λέγει αὐτοῖς· Λάζαρος ὁ φίλος ἡμῶν κεκοίμηται, ἀλλὰ πορεύομαι ἵνα ἐξυπνίσω αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/011.yaml
  text: After saying these things[a], he said to them, “Lazarus our friend has fallen asleep, but I am going so that I may wake him up.”
translation:
  language: hi
  text: ये बातें कहने के बाद उसने उनसे कहा, “हमारा मित्र लाज़र सो गया है[a], लेकिन मैं उसे जगाने के लिए जा रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “मर गया है।” यहाँ यीशु मृत्यु के लिए नींद का रूपक इस्तेमाल करते हैं; अगले पदों में शिष्य पहले उनके कथन को गलत समझते हैं।
    reason: वैकल्पिक, अधिक स्पष्ट अर्थ बताना, जबकि मुख्य पाठ में मूल रूपक और कथा का तनाव बनाए रखना।
lexical_decisions:
- source_word: ταῦτα εἶπεν, καὶ μετὰ τοῦτο
  choice: ये बातें कहने के बाद
  rationale: यह स्वाभाविक हिन्दी में पहले कथन की पूर्णता और उसके बाद की कालानुक्रमिक प्रगति—दोनों को व्यक्त करता है; ταῦτα का बहुवचन ‘ये बातें’ में सुरक्षित है।
- source_word: λέγει αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को सहज हिन्दी कथाशैली में भूतकाल से व्यक्त किया गया है।
- source_word: Λάζαρος ὁ φίλος ἡμῶν
  choice: हमारा मित्र लाज़र
  rationale: सम्बन्ध पर दिए गए बल को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κεκοίμηται
  choice: सो गया है
  rationale: पूर्ण काल के परिणामस्वरूप वर्तमान अवस्था को व्यक्त करते हुए मृत्यु के लिए प्रयुक्त ‘नींद’ के रूपक को सुरक्षित रखता है।
- source_word: ἀλλὰ πορεύομαι
  choice: लेकिन मैं … जा रहा हूँ
  rationale: ἀλλά के विरोध और πορεύομαι की वर्तमान, उद्देश्यपूर्ण गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα ἐξυπνίσω αὐτόν
  choice: उसे जगाने
  rationale: हिन्दी का उद्देश्यवाचक रूप ἵνα और उसके बाद आए संभावनार्थक क्रियारूप का आशय सहजता से व्यक्त करता तथा नींद-जागने के रूपक को बनाए रखता है।
theological_decisions:
- issue: κεκοίμηται को व्याख्यात्मक रूप से ‘मर गया है’ कहना या नींद का रूपक बनाए रखना
  choice: मुख्य पाठ में ‘सो गया है’
  alternative: ‘मर गया है’
  rationale: यीशु यहाँ मृत्यु के लिए रूपक का प्रयोग करते हैं, जिसे शिष्य आगे आने वाले पदों में पहले शाब्दिक नींद समझते हैं। रूपक बनाए रखने से कथा का तनाव और कथन की धार्मिक गहराई समय से पहले समाप्त नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मित्र’ सम्बन्ध की गरिमा बनाए रखता है, जबकि ‘सो गया है’ और ‘जगाने’ परस्पर जुड़े मूल रूपक को स्वाभाविक ढंग से व्यक्त करते हैं।
