revisions:
- from: और तुम्हारे कारण मैं आनन्दित हूँ कि मैं वहाँ नहीं था, ताकि तुम विश्वास करो। पर आओ, हम उसके पास चलें।
  to: और मुझे तुम्हारे लिए खुशी है कि मैं वहाँ नहीं था, ताकि तुम विश्वास करो। पर आओ, हम उसके पास चलें।
  rationale: The revision changes the potentially misleading causal expression ‘तुम्हारे कारण’ to the beneficiary-oriented ‘तुम्हारे लिए’ and uses more natural modern Hindi for χαίρω. The purpose, temporal reference, and collective exhortation remain unchanged. The footnote retains the English audit trail’s lexical alternative for πιστεύσητε.
