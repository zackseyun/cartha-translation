review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the purpose clause, Jesus’ absence, and the hortatory ‘let us go.’ However, ‘तुम्हारे कारण’ ordinarily presents the disciples as the cause of Jesus’ gladness, whereas δι’ ὑμᾶς here is best understood in the beneficial sense, ‘for your sake.’
  naturalness: ‘मुझे खुशी है’ is more natural modern standard Hindi than ‘मैं आनन्दित हूँ’ while retaining the positive force of χαίρω. The remaining sentence structure is clear and appropriately dignified.
  terminology: ‘विश्वास करो’ is an appropriate non-sectarian rendering of πιστεύσητε. A note preserves the possible ingressive nuance (‘विश्वास करने लगो’) without making it mandatory in the main text.
  issues:
  - severity: medium
    issue: ‘तुम्हारे कारण’ can imply that the disciples themselves caused Jesus’ gladness.
    rationale: In this context δι’ ὑμᾶς expresses gladness with a view to their benefit. ‘तुम्हारे लिए’ conveys this sense without introducing an unintended causal implication.
  - severity: low
    issue: ‘मैं आनन्दित हूँ’ is somewhat formal and less idiomatic for modern standard Hindi.
    rationale: ‘मुझे खुशी है’ naturally expresses the present χαίρω and fits the direct speech register.
  revised_text: और मुझे तुम्हारे लिए खुशी है कि मैं वहाँ नहीं था, ताकि तुम विश्वास करो। पर आओ, हम उसके पास चलें।
  revised_footnotes:
  - marker: a
    text: या, ‘ताकि तुम विश्वास करने लगो।’ यूनानी एओरिस्ट सब्जंक्टिव विश्वास में आने या विश्वास आरम्भ होने पर बल दे सकता है; फिर भी मुख्य पाठ में व्यापक और कम व्याख्यात्मक अर्थ ‘विश्वास करो’ रखा गया है।
    reason: lexical_alternative
  revision_rationale: The revision changes the potentially misleading causal expression ‘तुम्हारे कारण’ to the beneficiary-oriented ‘तुम्हारे लिए’ and uses more natural modern Hindi for χαίρω. The purpose, temporal reference, and collective exhortation remain unchanged. The footnote retains the English audit trail’s lexical alternative for πιστεύσητε.
