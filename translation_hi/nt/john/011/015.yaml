  text: καὶ χαίρω δι’ ὑμᾶς, ἵνα πιστεύσητε, ὅτι οὐκ ἤμην ἐκεῖ· ἀλλὰ ἄγωμεν πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/015.yaml
  text: And I am glad for your sake that I was not there[a], so that you may believe. But let us go to him.
translation:
  language: hi
  text: और मुझे तुम्हारे लिए खुशी है कि मैं वहाँ नहीं था, ताकि तुम विश्वास करो। पर आओ, हम उसके पास चलें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρω
  choice: मैं आनन्दित हूँ
  rationale: वर्तमानकालीन प्रसन्नता को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘खुश हूँ’ की अपेक्षा प्रसंग के भाव को बेहतर रखता है।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे कारण
  rationale: διά के साथ कर्मकारक यहाँ शिष्यों के संदर्भ और हित की ओर संकेत करता है। ‘तुम्हारे कारण’ मूल संरचना के निकट रहते हुए स्वाभाविक है, यद्यपि आशय उनके लाभ से जुड़ा है।
- source_word: ἵνα πιστεύσητε
  choice: ताकि तुम विश्वास करो
  rationale: ἵνα के उद्देश्यबोध और πιστεύω के सामान्य यूहन्नाई अर्थ को रखता है। यूनानी एओरिस्ट सब्जंक्टिव में ‘विश्वास करने लगो’ की संभावित आरंभात्मक छाया है, पर मुख्य पाठ उसे अनिवार्य नहीं बनाता।
- source_word: ὅτι οὐκ ἤμην ἐκεῖ
  choice: कि मैं वहाँ नहीं था
  rationale: ὅτι को कथ्य-सूचक ‘कि’ और अपूर्ण भूतकाल ἤμην को सहज हिन्दी भूतकाल में सीधा व्यक्त किया गया है।
- source_word: ἀλλὰ
  choice: पर
  rationale: व्याख्या से आगामी कार्य की ओर विरोधात्मक संक्रमण को संक्षिप्त, स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἄγωμεν
  choice: आओ, हम ... चलें
  rationale: प्रथम पुरुष बहुवचन के आग्रहसूचक सब्जंक्टिव को हिन्दी के स्वाभाविक सम्मिलित आह्वान से व्यक्त करता है।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: किसी व्यक्ति की ओर गमन के लिए πρός का सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: यूहन्नाई प्रसंग में πιστεύσητε का बल
  choice: विश्वास करो
  alternative: विश्वास करने लगो
  rationale: एओरिस्ट सब्जंक्टिव आरंभात्मक अर्थ दे सकता है, पर यह आवश्यक रूप से नहीं कहता कि शिष्यों में पहले कोई विश्वास था ही नहीं। सामान्य अनुवाद उस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘आओ, हम उसके पास चलें’ आग्रहसूचक रूप को स्वाभाविक रूप से व्यक्त करता है।
