source:
  edition: SBLGNT
  text: ἐὰν ἀφῶμεν αὐτὸν οὕτως, πάντες πιστεύσουσιν εἰς αὐτόν, καὶ ἐλεύσονται οἱ Ῥωμαῖοι καὶ ἀροῦσιν ἡμῶν καὶ τὸν τόπον καὶ τὸ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/048.yaml
  text: If we let him go on like this[a], everyone will believe in him[b], and the Romans will come and take away both our place and our nation.
translation:
  language: hi
  text: यदि हम उसे इसी तरह करते रहने दें, तो सब उस पर विश्वास करेंगे, और रोमी आकर हमारा स्थान[a] और राष्ट्र[b]—दोनों ले लेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारा मंदिर’; यूनानी में ‘स्थान’ है, जो विशेष रूप से मंदिर या अधिक व्यापक रूप से उनके स्थान अथवा प्रतिष्ठा की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘राष्ट्र’ का अनुवाद ‘लोग’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφῶμεν αὐτὸν οὕτως
  choice: उसे इसी तरह करते रहने दें
  rationale: ἀφίημι यहाँ अनुमति देने के अर्थ में है और οὕτως वर्तमान ढंग की ओर संकेत करता है। यह सहज हिन्दी में यीशु की चल रही गतिविधि को व्यक्त करता है, बिना किसी विशेष कार्य को जोड़कर अर्थ सीमित किए।
- source_word: πάντες
  choice: सब
  rationale: यह सामान्य और व्यापक बहुवचन है; ‘सब’ आधुनिक हिन्दी में स्वाभाविक रूप से इसकी समावेशी व्यापकता व्यक्त करता है।
- source_word: πιστεύσουσιν εἰς αὐτόν
  choice: उस पर विश्वास करने लगेंगे
  rationale: यूहन्ना में πιστεύω εἰς का स्वाभाविक अर्थ ‘उस पर विश्वास करना’ है। भविष्यकाल और प्रसंग में बढ़ती प्रतिक्रिया को हिन्दी में ‘करने लगेंगे’ सहज रूप से व्यक्त करता है।
- source_word: οἱ Ῥωμαῖοι
  choice: रोमी
  rationale: यह रोमन सत्ता और उसके प्रतिनिधियों को सूचित करने वाला सीधा, प्रचलित हिन्दी रूप है।
- source_word: ἀροῦσιν
  choice: छीन लेंगे
  rationale: αἴρω का मूल भाव यहाँ ले जाने या हटा देने का है। ‘छीन लेंगे’ शत्रुतापूर्ण रोमी कार्रवाई के प्रसंग में स्वाभाविक है, जबकि ‘नष्ट कर देंगे’ से अधिक तीव्र अर्थ नहीं जोड़ता।
- source_word: τόπον
  choice: स्थान
  rationale: τόπος का सीधा अर्थ ‘स्थान’ है। इससे मन्दिर, उनका संस्थागत स्थान, या अधिक व्यापक अधिकार-क्षेत्र की सम्भावनाएँ खुली रहती हैं।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: ἔθνος राष्ट्र अथवा जन-समुदाय का अर्थ दे सकता है। राजनीतिक भय के इस प्रसंग में ‘राष्ट्र’ उपयुक्त है; ‘लोग’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἡμῶν ... καὶ τὸν τόπον καὶ τὸ ἔθνος
  choice: हमारा स्थान और हमारा राष्ट्र—दोनों
  rationale: ἡμῶν दोनों कर्मों से जुड़ा है और दोहरे καί का बल हिन्दी में ‘दोनों’ से स्पष्ट तथा स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: τόπον में ‘हमारे स्थान’ का अभिप्राय
  choice: मुख्य पाठ में ‘स्थान’ रखकर अभिप्राय खुला रखा गया
  alternative: मन्दिर; स्थान या पद-प्रतिष्ठा
  rationale: प्रसंग में मन्दिर और अगुवों की संस्थागत स्थिति दोनों का भय सम्भव है, पर यूनानी शब्द किसी एक अर्थ को निश्चित नहीं करता। इसलिए मुख्य पाठ उसकी वास्तविक अस्पष्टता बनाए रखता है।
- issue: ἔθνος का सामूहिक या राजनीतिक अर्थ
  choice: राष्ट्र
  alternative: लोग; जन-समुदाय
  rationale: रोमी हस्तक्षेप की राजनीतिक आशंका के साथ ‘राष्ट्र’ ठीक बैठता है, पर यहूदी लोगों के सामूहिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्थान’ कुछ असामान्य लग सकता है, पर मूल पाठ की अर्थगत खुलावट बनाए रखने के लिए इसे जानबूझकर रखा गया है; सम्भावित अर्थ पादटिप्पणी में दिए गए हैं।
