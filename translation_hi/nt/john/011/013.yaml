  text: εἰρήκει δὲ ὁ Ἰησοῦς περὶ τοῦ θανάτου αὐτοῦ. ἐκεῖνοι δὲ ἔδοξαν ὅτι περὶ τῆς κοιμήσεως τοῦ ὕπνου λέγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/013.yaml
  text: Jesus had spoken about his death[a], but they thought that he was speaking about the sleep of rest.
translation:
  language: hi
  text: यीशु ने उसकी मृत्यु के बारे में कहा था, पर वे समझे कि वह वास्तविक नींद[a] की बात कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “नींद की नींद”; अर्थात वे इसे मृत्यु नहीं, बल्कि वास्तविक नींद समझे।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήκει
  choice: कहा था
  rationale: पूर्णभूतकालीन रूप पहले कही गई बात को चेलों की बाद की गलत समझ से पूर्व रखता है; आधुनिक हिन्दी में “कहा था” स्वाभाविक है।
- source_word: δὲ … δὲ
  choice: तो … पर
  rationale: पहला δέ हल्का संक्रमण और दूसरा स्पष्ट विरोध दिखाता है; “तो … पर” यीशु के आशय और चेलों की समझ के बीच का अंतर सहज रूप से व्यक्त करता है।
- source_word: περὶ τοῦ θανάτου αὐτοῦ
  choice: उसकी मृत्यु के विषय में
  rationale: περί के साथ संबंधकारक का अर्थ “के विषय में” है। αὐτοῦ को सर्वनाम के रूप में रखा गया है, जिससे मूल का संदर्भ बना रहता है।
- source_word: ἐκεῖνοι
  choice: उन्होंने
  rationale: यह पहले से संदर्भित चेलों की ओर संकेत करता है; हिन्दी में सम्मानसूचक बहुवचन सर्वनाम स्वाभाविक है।
- source_word: ἔδοξαν
  choice: समझा
  rationale: यहाँ δοκέω चेलों की गलत धारणा व्यक्त करता है; “समझा” स्पष्ट और प्रचलित है।
- source_word: κοιμήσεως τοῦ ὕπνου
  choice: नींद में सोने
  rationale: दोनों निद्रा-संबंधी संज्ञाओं की पुनरुक्ति को शब्दशः असहज बनाए बिना रखा गया है और शाब्दिक नींद का भाव स्पष्ट होता है।
- source_word: λέγει
  choice: कह रहे हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को चेलों की धारणा के भीतर स्वाभाविक हिन्दी वर्तमान-निरंतर रूप में व्यक्त किया गया है।
theological_decisions:
- issue: मृत्यु के लिए प्रयुक्त ‘सोने’ के रूपक से मृतकों की अवस्था के बारे में कोई विशिष्ट सिद्धांत निकालना
  choice: यीशु के आशय को सीधे “मृत्यु” और चेलों की गलत समझ को वास्तविक नींद के रूप में प्रस्तुत किया गया है।
  alternative: ऐसी व्याख्यात्मक भाषा जोड़ना जो मृत्यु के बाद आत्मा की अवस्था पर कोई निश्चित मत सिखाए।
  rationale: यह पद कथा में रूपक और उसके शाब्दिक गलत अर्थ के बीच अंतर दिखाता है; इससे आगे कोई संप्रदायगत निष्कर्ष जोड़ना मूल से अधिक होगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। “उसकी” मूल के सर्वनाम को सुरक्षित रखता है, जबकि आसपास का संदर्भ इसे लाज़र से जोड़ता है।
