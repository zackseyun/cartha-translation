base_translation:
  language: en
  yaml_path: translation/nt/john/011/019.yaml
  text: Many of the Jews had come to Martha and Mary to comfort them about their brother[a].
translation:
  language: hi
  text: बहुत-से यहूदी[a] मार्था और मरियम के पास उनके भाई के विषय में उन्हें सांत्वना देने आए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के निवासियों में से बहुत-से लोग मार्था और मरियम के पास आए थे।” यूनानी शब्द सामान्य रूप से यहूदियों को, या यूहन्ना के कुछ प्रसंगों में अधिक विशेष रूप से यहूदिया के निवासियों को, सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πολλοὶ δὲ
  choice: बहुत-से
  rationale: πολλοί का अर्थ ‘बहुत-से’ है। δέ एक हल्का संयोजक है; इस वाक्य में अलग शब्द जोड़ने के बजाय हिन्दी के स्वाभाविक कथाप्रवाह में उसका संबंध निहित रखा गया है।
- source_word: ἐκ τῶν Ἰουδαίων
  choice: यहूदी
  rationale: यह पदबंध अंशवाचक है—यहूदियों में से बहुत-से। सहज हिन्दी में ‘बहुत-से यहूदी’ यही अर्थ व्यक्त करता है। यूहन्ना में Ἰουδαῖοι कभी अधिक विशिष्ट रूप से यहूदिया-निवासियों का संकेत भी दे सकता है, इसलिए वह संभावना पादटिप्पणी में रखी गई है।
- source_word: ἐληλύθεισαν
  choice: आए थे
  rationale: ἔρχομαι का पूर्णभूत रूप कथा के उस समय से पहले घटित आगमन दर्शाता है; ‘आए थे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τὴν Μάρθαν καὶ Μαριὰμ
  choice: मार्था और मरियम के पास
  rationale: πρός के साथ कर्मकारक यहाँ व्यक्तियों के पास आने या उनसे मिलने का भाव देता है। नामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
- source_word: ἵνα παραμυθήσωνται αὐτὰς
  choice: उन्हें सांत्वना देने
  rationale: ἵνα के साथ संभावनार्थक क्रिया उद्देश्य व्यक्त करती है। παραμυθέομαι शोक में ढाढ़स या सांत्वना देने को दर्शाता है।
- source_word: περὶ τοῦ ἀδελφοῦ
  choice: उनके भाई के विषय में
  rationale: περί के साथ संबंधकारक का अर्थ ‘के विषय में/के संबंध में’ है। यूनानी में ‘भाई’ एकवचन और निश्चित है; ‘उनके’ से स्पष्ट होता है कि वह दोनों बहनों का भाई था।
theological_decisions:
- issue: यूहन्ना के संदर्भ में Ἰουδαίων का अनुवाद
  choice: यहूदी
  alternative: यहूदिया के निवासी
  rationale: यह पद विरोधी अधिकारियों का नहीं, शोकग्रस्त बहनों को सांत्वना देने आए लोगों का वर्णन करता है। इसलिए व्यापक जातीय-धार्मिक अर्थ ‘यहूदी’ प्रसंग में स्वाभाविक है, जबकि यूहन्ना में संभावित भौगोलिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘सांत्वना’ शोक के प्रसंग के अनुरूप प्रचलित शब्द है; Ἰουδαίων की वास्तविक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
