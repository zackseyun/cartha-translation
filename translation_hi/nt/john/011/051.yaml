  text: τοῦτο δὲ ἀφ’ ἑαυτοῦ οὐκ εἶπεν, ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου ἐπροφήτευσεν ὅτι ἔμελλεν Ἰησοῦς ἀποθνῄσκειν ὑπὲρ τοῦ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/051.yaml
  text: He did not say this from himself[a], but being high priest that year, he prophesied that Jesus was going to die for the nation[c][b],
translation:
  language: hi
  text: उसने यह बात अपनी ओर से[a] नहीं कही; बल्कि उस वर्ष महायाजक होने के नाते उसने भविष्यवाणी की कि यीशु राष्ट्र के लिए[b] मरने वाला था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आप से’ अथवा ‘अपनी ही पहल पर’।
    reason: lexical_alternative
  - marker: b
    text: या ‘राष्ट्र की ओर से’।
    reason: alternative_reading
  - marker: c
    text: या ‘मरने जा रहा था’; अथवा ‘उसका मरना नियत था’।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ
  choice: उसने यह बात
  rationale: δέ का हल्का संयोजक बल हिन्दी में अगले विरोधसूचक ‘बल्कि’ और वाक्य-प्रवाह से स्पष्ट है; कोई अनावश्यक कालवाचक शब्द नहीं जोड़ा गया।
- source_word: ἀφ’ ἑαυτοῦ
  choice: अपनी ओर से
  rationale: यह कथन के स्रोत या पहल को दर्शाता है और सहज हिन्दी में बताता है कि बात केवल कैफा की अपनी पहल से नहीं निकली थी।
- source_word: ἀλλὰ ἀρχιερεὺς ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: बल्कि उस वर्ष महायाजक होने के नाते
  rationale: यह पद और पृष्ठभूमि का संबंध बनाए रखता है, पर कैफा की मनोदशा या धार्मिक योग्यता के विषय में कुछ नहीं जोड़ता।
- source_word: ἐπροφήτευσεν
  choice: उसने भविष्यवाणी की
  rationale: यूनानी क्रिया के वास्तविक भविष्यसूचक बल को सीधे सुरक्षित रखता है।
- source_word: ἔμελλεν ... ἀποθνῄσκειν
  choice: मरने वाला था
  rationale: आगामी और निश्चित रूप से घटने वाली मृत्यु का भाव देता है, पर अनिवार्य भाग्यवाद या अत्यधिक तात्कालिकता नहीं थोपता।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: हितकारी और प्रतिनिधिक अर्थ के लिए स्वाभाविक तथा पर्याप्त रूप से व्यापक हिन्दी अभिव्यक्ति है।
- source_word: τοῦ ἔθνους
  choice: राष्ट्र
  rationale: एकवचन में यह प्रसंग के यहूदी राष्ट्र को सूचित करता है; ‘जाति’ आधुनिक हिन्दी में वर्ण/कास्ट का भ्रामक अर्थ दे सकती है।
theological_decisions:
- issue: कैफा के कथन का भविष्यवाणी होना
  choice: पाठ स्पष्ट रूप से कहता है कि उसने महायाजक होने के नाते भविष्यवाणी की।
  alternative: इसे केवल विडंबनापूर्ण कथन मानना, या यह जोड़ना कि कैफा पूरी चेतना से ईश्वरीय प्रेरणा में बोल रहा था।
  rationale: अनुवाद भविष्यवाणी के वास्तविक बल को रखता है, लेकिन कैफा की चेतना, धार्मिकता या प्रेरणा की प्रक्रिया के विषय में पाठ से आगे नहीं जाता।
- issue: यीशु की मृत्यु के संबंध में ὑπὲρ का बल
  choice: राष्ट्र के लिए
  alternative: राष्ट्र की ओर से; राष्ट्र के स्थान पर
  rationale: मुख्य पाठ हितकारी और प्रतिनिधिक अर्थ के लिए खुला रहता है और इस पद से अकेले कोई अधिक तकनीकी प्रायश्चित्त-सूत्र आरोपित नहीं करता।
- issue: ἔμελλεν का भाव
  choice: मरने वाला था
  alternative: मरने जा रहा था; मरना नियत था
  rationale: यह भविष्याभिमुखता को बनाए रखता है, जबकि अत्यधिक निकटता या भाग्य-निर्धारण में से किसी एक अर्थ को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। ‘राष्ट्र’ को ‘जाति’ की आधुनिक सामाजिक अस्पष्टता से बचने और ἔθνος के सामूहिक-राष्ट्रीय संदर्भ को स्पष्ट रखने के लिए चुना गया है।
