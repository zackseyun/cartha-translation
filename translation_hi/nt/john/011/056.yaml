    issue: The participial phrase “खड़े होकर” can imply sequence rather than concurrent posture.
    rationale: The perfect participle ἑστηκότες portrays those speaking as standing in the temple precincts. Rendering it with a finite stative clause preserves this more precisely.
  - severity: low
    issue: The footnote’s alternative unnecessarily repeats “तुम्हें क्या लगता है?” and can be made more concise.
    rationale: The lexical note should present the alternative rendering of the emphatic negation clearly while retaining the interrogative force.
