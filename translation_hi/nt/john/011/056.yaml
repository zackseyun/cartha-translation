  text: ἐζήτουν οὖν τὸν Ἰησοῦν καὶ ἔλεγον μετ’ ἀλλήλων ἐν τῷ ἱερῷ ἑστηκότες· Τί δοκεῖ ὑμῖν; ὅτι οὐ μὴ ἔλθῃ εἰς τὴν ἑορτήν;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/056.yaml
  text: So they were looking for Jesus and saying to one another as they stood in the temple courts[b][a], “What do you think? That he certainly will not come to the feast?”
translation:
  language: hi
  text: इसलिए वे यीशु को ढूँढ़ रहे थे और मंदिर के प्रांगण में खड़े थे और आपस में कह रहे थे, “तुम्हें क्या लगता है? क्या वह पर्व में बिल्कुल नहीं आएगा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह पर्व में किसी भी हालत में नहीं आएगा?” यूनानी में यहाँ प्रबल नकार (οὐ μή) है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐζήτουν
  choice: ढूँढ़ रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार की जा रही खोज को दिखाता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग के परिणाम या कथात्मक संबंध को व्यक्त करता है।
- source_word: ἔλεγον μετ’ ἀλλήλων
  choice: आपस में कह रहे थे
  rationale: अपूर्ण भूतकाल जारी बातचीत और μετ’ ἀλλήλων पारस्परिक संवाद को व्यक्त करता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर के प्रांगण में
  rationale: ἱερόν पूरे मन्दिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
- source_word: ἑστηκότες
  choice: खड़े होकर
  rationale: पूर्णकालिक कृदन्त उनकी उस समय की स्थिर खड़ी अवस्था बताता है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: Τί δοκεῖ ὑμῖν;
  choice: तुम्हें क्या लगता है?
  rationale: यह राय पूछने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: οὐ μὴ ἔλθῃ
  choice: क्या वह ... बिल्कुल नहीं आएगा?
  rationale: οὐ μή की प्रबल नकारात्मकता को ‘बिल्कुल नहीं’ व्यक्त करता है, जबकि प्रश्नात्मक प्रसंग की वास्तविक अस्पष्टता बनी रहती है।
- source_word: εἰς τὴν ἑορτήν
  choice: पर्व में
  rationale: ἑορτή यहाँ यहूदी धार्मिक पर्व, प्रसंगतः फसह, को सूचित करता है; ‘पर्व’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: अंतिम प्रश्न में ὅτι οὐ μὴ की व्याख्या
  choice: क्या वह पर्व में बिल्कुल नहीं आएगा?
  alternative: वह पर्व में निश्चय ही नहीं आएगा।
  rationale: विराम-चिह्न मूल पाण्डुलिपियों का भाग नहीं हैं, और इस वाक्य को आशंकित प्रश्न या दृढ़ नकारात्मक अनुमान की तरह समझा जा सकता है। प्रश्नवाचक रूप प्रसंग और Τί δοκεῖ ὑμῖν के साथ स्वाभाविक है, जबकि ‘बिल्कुल नहीं’ प्रबल निषेध बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘मन्दिर के प्रांगण’ से ἱερόν और भीतरी पवित्रस्थान के बीच का भेद मुख्य पाठ में स्पष्ट किया गया है; इसलिए अलग सांस्कृतिक टिप्पणी आवश्यक नहीं मानी गई।
