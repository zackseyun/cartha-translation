revisions:
- from: इसलिए जब यीशु वहाँ पहुँचे, तो उन्हें पता चला कि लाज़र को कब्र में रखे हुए चार दिन हो चुके थे।
  to: तब जब यीशु पहुँचे, तो उन्होंने पाया कि लाज़र को कब्र में पड़े पहले ही चार दिन हो चुके थे।
  rationale: The revision preserves the narrative connective, the temporal force of the participle, Jesus’ finding, the explicit reference to Lazarus, the “already” of ἤδη, the four-day duration, and the tomb. It removes an unnecessary locative addition and avoids implying that Jesus merely received a report.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:49:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies Lazarus as the referent and conveys that four days had already elapsed while he was in the tomb. However, “उन्हें पता चला” shifts εὗρεν (“he found”) toward receiving information rather than encountering/ascertaining the situation. “वहाँ” is also not expressed in the Greek and is unnecessary.
  naturalness: The draft is generally understandable, but “लाज़र को कब्र में रखे हुए चार दिन हो चुके थे” is less idiomatic and can suggest the act of placing him rather than his continuing presence in the tomb. The revision uses a natural Hindi duration expression.
  terminology: “कब्र” is an appropriate modern Hindi rendering for μνημεῖον in this narrative context. “यीशु” and “लाज़र” are suitable established forms. No theological terminology issue arises.
  issues:
  - severity: medium
    issue: Main verb rendered as “उन्हें पता चला”
    rationale: εὗρεν is “he found.” In this context it can introduce the discovered state of affairs, but “उन्हें पता चला” more specifically suggests that Jesus was informed. “उन्होंने पाया कि” retains the source verb without imposing a means of discovery.
  - severity: low
    issue: Addition of “वहाँ”
    rationale: The destination is clear from the wider context, but it is not stated in this verse. Omitting it is safer and fully natural.
  - severity: low
    issue: Duration expression “रखे हुए चार दिन”
    rationale: This wording foregrounds placement/burial, whereas the Greek states that Lazarus had already been in the tomb for four days. “कब्र में पड़े पहले ही चार दिन” naturally expresses the elapsed duration and continuing location.
  revised_text: तब जब यीशु पहुँचे, तो उन्होंने पाया कि लाज़र को कब्र में पड़े पहले ही चार दिन हो चुके थे।
  revised_footnotes: []
  revision_rationale: The revision preserves the narrative connective, the temporal force of the participle, Jesus’ finding, the explicit reference to Lazarus, the “already” of ἤδη, the four-day duration, and the tomb. It removes an unnecessary locative addition and avoids implying that Jesus merely received a report.
