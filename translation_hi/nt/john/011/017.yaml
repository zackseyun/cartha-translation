id: JHN.11.17
reference: John 11:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐλθὼν οὖν ὁ Ἰησοῦς εὗρεν αὐτὸν τέσσαρας ⸂ἤδη ἡμέρας⸃ ἔχοντα ἐν τῷ μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/017.yaml
  text: So when Jesus arrived, he found that Lazarus had already been in the tomb four days.
translation:
  language: hi
  text: तब जब यीशु पहुँचे, तो उन्होंने पाया कि लाज़र को कब्र में पड़े पहले ही चार दिन हो चुके थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: जब यीशु वहाँ पहुँचे
  rationale: क्रियाविशेषणीय एओरिस्ट कृदंत मुख्य क्रिया से पहले की घटना बताता है। आधुनिक हिन्दी में ‘जब ... पहुँचे’ इस काल-संबंध को स्वाभाविक ढंग से व्यक्त करता है; ‘वहाँ’ प्रसंगगत गंतव्य को स्पष्ट करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पिछले वर्णन से इस घटना का संबंध जोड़ता है। ‘इसलिए’ उस परिणामात्मक कथानक-संबंध को बनाए रखता है, यद्यपि यहाँ कठोर तार्किक निष्कर्ष अभिप्रेत नहीं है।
- source_word: εὗρεν
  choice: उन्हें पता चला
  rationale: εὑρίσκω यहाँ किसी व्यक्ति को देखने के बजाय एक स्थिति का ज्ञात होना व्यक्त करता है। हिन्दी में ‘उन्हें पता चला कि’ आगामी आश्रित कथन के साथ स्वाभाविक है।
- source_word: αὐτὸν
  choice: लाज़र को
  rationale: यूनानी सर्वनाम का निकट प्रसंग में संकेत लाज़र की ओर है। हिन्दी में नाम स्पष्ट करने से संदर्भ सहज रहता है और कोई नई सूचना नहीं जुड़ती।
- source_word: τέσσαρας ἤδη ἡμέρας ἔχοντα
  choice: रखे हुए चार दिन हो चुके थे
  rationale: शाब्दिक रूप से ‘पहले से चार दिन रखते हुए’ समयावधि बताने वाली यूनानी अभिव्यक्ति है। हिन्दी का ‘चार दिन हो चुके थे’ ἤδη तथा बीती अवधि, दोनों को स्वाभाविक रूप से व्यक्त करता है। ‘रखे हुए’ दफ़न अवस्था को μνημείῳ के संदर्भ में स्पष्ट करता है।
- source_word: μνημείῳ
  choice: कब्र में
  rationale: μνημεῖον यहाँ शव रखने का स्थान है। आधुनिक सामान्य हिन्दी में ‘कब्र’ स्पष्ट, गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
theological_decisions:
- issue: αὐτόν के संकेत को स्पष्ट करना
  choice: सर्वनाम के स्थान पर ‘लाज़र’ नाम देना
  alternative: ‘उसे’ या ‘उन्हें’ कहना
  rationale: यूनानी में संकेत पिछले प्रसंग से स्पष्ट है। हिन्दी में नाम देने से संभावित सर्वनाम-संदेह दूर होता है और अर्थ नहीं बदलता।
- issue: चार दिनों की अवधि का संबंध
  choice: ‘कब्र में रखे हुए चार दिन हो चुके थे’
  alternative: ‘वह चार दिन से कब्र में था’
  rationale: चुनी हुई अभिव्यक्ति दफ़न किए जाने के बाद बीती अवधि को स्पष्ट करती है और ἤδη के पूर्ण हो चुके समय-भाव को बनाए रखती है; इससे मृत्यु के सटीक क्षण के बारे में पाठ से अधिक दावा नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। यीशु के लिए आदरसूचक बहुवचन प्रयोग किया गया है। कोई पादटिप्पणी आवश्यक नहीं है।
