  text: λέγει αὐτῷ· Ναί, κύριε· ἐγὼ πεπίστευκα ὅτι σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ ὁ εἰς τὸν κόσμον ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/027.yaml
  text: She said to him[a], “Yes, Lord; I have believed that you are the Messiah, the Son of God[b], the one coming into the world.”
translation:
  language: hi
  text: उसने उनसे कहा, “हाँ, प्रभु! मैंने विश्वास किया है कि आप ही मसीह[a], परमेश्वर के पुत्र हैं—वही जो संसार में आने वाले हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “ख्रीस्त।” यूनानी Χριστός एक पदवी है, जिसका अर्थ “अभिषिक्त जन” है; यहाँ इसे “मसीह” कहा गया है।
    reason: alternative_reading
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “वह जो संसार में आ रहा है।” यूनानी वर्तमान कृदन्त उस प्रत्याशित आनेवाले की पहचान भी व्यक्त कर सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ
  choice: उसने उनसे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान ‘कहती है’ है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल स्वाभाविक है। प्रसंग से कर्ता मार्था है; यीशु के लिए आदरसूचक ‘उनसे’ रखा गया है।
- source_word: Ναί, κύριε
  choice: हाँ, प्रभु!
  rationale: Ναί सीधी स्वीकृति है और κύριε को इस श्रद्धापूर्ण विश्वास-घोषणा में केवल ‘महोदय’ के बजाय ‘प्रभु’ कहना अधिक उपयुक्त है।
- source_word: ἐγὼ πεπίστευκα
  choice: मैं विश्वास कर चुकी हूँ
  rationale: पूर्णकाल पहले बने और अब भी कायम विश्वास को दर्शाता है। ‘कर चुकी हूँ’ हिन्दी में उसके परिणामस्वरूप वर्तमान दृढ़ विश्वास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι σὺ εἶ
  choice: कि आप ही … हैं
  rationale: ὅτι विश्वास की विषय-वस्तु आरम्भ करता है और स्पष्ट σὺ के बल को ‘आप ही’ से बनाए रखा गया है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός व्यक्तिगत नाम नहीं, अभिषिक्त और प्रतिज्ञात राजा का पदवीसूचक शीर्षक है; इसलिए प्रचलित हिन्दी ‘मसीह’ उपयुक्त है।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यह निश्चित और धर्मवैचारिक रूप से महत्वपूर्ण उपाधि का सीधा, मानक हिन्दी रूप है।
- source_word: ὁ εἰς τὸν κόσμον ἐρχόμενος
  choice: वही जो संसार में आनेवाले हैं
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदन्त यीशु की पहचान उस प्रत्याशित आनेवाले के रूप में करता है। ‘वही जो’ इस पहचान और यूनानी के निश्चित भाव को स्पष्ट रखता है।
- source_word: κόσμον
  choice: संसार
  rationale: यूहन्ना में κόσμος के लिए ‘संसार’ स्वाभाविक और व्यापक हिन्दी समतुल्य है।
theological_decisions:
- issue: विश्वास-घोषणा में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: पदवी के अर्थ और यहूदी मसीहाई पृष्ठभूमि को स्पष्ट रखने के लिए अर्थपूर्ण, प्रचलित पद ‘मसीह’ चुना गया है; लिप्यंतरण को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- issue: मार्था के संबोधन κύριε का भाव
  choice: प्रभु
  alternative: महोदय
  rationale: आस-पास का प्रसंग यीशु की पहचान की गंभीर विश्वास-घोषणा है। ‘प्रभु’ श्रद्धापूर्ण और संभावित धर्मवैचारिक बल को सुरक्षित रखता है, जबकि ‘महोदय’ उसे केवल शिष्टाचार तक सीमित कर सकता है।
- issue: πεπίστευκα के पूर्णकाल का बल
  choice: मैं विश्वास कर चुकी हूँ
  alternative: मैं विश्वास करती हूँ
  rationale: चुना हुआ रूप पूर्व में बने और वर्तमान में कायम विश्वास की परिणामी अवस्था को बनाए रखता है; साधारण वर्तमान उस कालगत पक्ष को कम कर देता।
- issue: ὁ εἰς τὸν κόσμον ἐρχόμενος की पहचानसूचक अभिव्यक्ति
  choice: वही जो संसार में आनेवाले हैं
  alternative: संसार में आनेवाले
  rationale: ‘वही जो’ यूनानी के संज्ञात्मक, निश्चित कृदन्त को स्पष्ट करता है और इसे ‘मसीह’ तथा ‘परमेश्वर के पुत्र’ के साथ यीशु की पहचान बताने वाली तीसरी अभिव्यक्ति के रूप में रखता है।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और सार्वजनिक पाठ के योग्य रखी गई है। ‘आप/उनसे/आनेवाले हैं’ से यीशु के लिए हिन्दी का स्वाभाविक सम्मान बना रहता है। डैश तीनों पहचानसूचक पदों के संबंध को स्पष्ट करता है, बिना उनकी धर्मवैचारिक समानता या भिन्नता को पाठ से अधिक परिभाषित किए।
