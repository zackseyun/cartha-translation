id: JHN.11.44
reference: John 11:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἐξῆλθεν ὁ τεθνηκὼς δεδεμένος τοὺς πόδας καὶ τὰς χεῖρας κειρίαις, καὶ ἡ ὄψις αὐτοῦ σουδαρίῳ περιεδέδετο. λέγει ⸂αὐτοῖς ὁ Ἰησοῦς⸃· Λύσατε αὐτὸν καὶ ἄφετε ⸀αὐτὸν ὑπάγειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/044.yaml
  text: The man who had died came out, his feet and hands bound with burial cloths, and his face wrapped with a cloth. Jesus says to them, “Unbind him and let him go.”
translation:
  language: hi
  text: जो मर गया था, वह बाहर निकला। उसके हाथ-पाँव कफ़न की पट्टियों से बँधे हुए थे और उसका चेहरा एक कपड़े से लिपटा हुआ था। यीशु उनसे कहते हैं, “इसके बंधन खोल दो और इसे जाने दो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τεθνηκώς
  choice: जो मर गया था
  rationale: पूर्ण कृदंत उस व्यक्ति की पूर्व मृत्यु और वर्तमान अवस्था—अब बाहर आते हुए व्यक्ति—दोनों को सामने रखता है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: κειρίαις
  choice: कफ़न की पट्टियों से
  rationale: यह दफ़नाने में प्रयुक्त कपड़े की पट्टियों को सूचित करता है; केवल ‘पट्टियाँ’ की तुलना में प्रसंग स्पष्ट रहता है।
- source_word: ἡ ὄψις
  choice: उसका चेहरा
  rationale: यहाँ शब्द का आशय चेहरे या मुखमंडल से है; आधुनिक हिन्दी में ‘चेहरा’ सहज है।
- source_word: σουδαρίῳ
  choice: एक कपड़े से
  rationale: यह चेहरे पर लपेटे गए अलग कपड़े को दर्शाता है; ‘रूमाल’ आधुनिक पाठक को अनुपयुक्त छोटा वस्त्र सुझा सकता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखा गया है, जिससे कथन की सजीवता सुरक्षित रहती है।
- source_word: Λύσατε αὐτὸν καὶ ἄφετε αὐτὸν ὑπάγειν
  choice: इसे खोल दो और जाने दो
  rationale: दोनों आज्ञाओं को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है; दूसरी आज्ञा उसके स्वतंत्र रूप से जाने देने का भाव देती है।
theological_decisions:
- issue: ऐतिहासिक वर्तमान λέγει
  choice: यीशु उनसे कहते हैं
  alternative: यीशु ने उनसे कहा
  rationale: मूल पाठ वर्तमान काल का प्रयोग करता है। हिन्दी में यह कथात्मक ऐतिहासिक वर्तमान थोड़ा चिह्नित है, पर समझने योग्य है और स्रोत की शैली को सुरक्षित रखता है।
- issue: मृत व्यक्ति की पहचान
  choice: जो मर गया था
  alternative: मृतक
  rationale: सापेक्ष वाक्यांश मूल के पूर्ण कृदंत का कालगत तनाव बनाए रखता है और व्यक्ति को निर्जीव ‘मृतक’ के रूप में स्थिर नहीं करता, क्योंकि वह अब बाहर निकल रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘कफ़न की पट्टियाँ’ यहूदी दफ़न-संदर्भ को स्पष्ट करती हैं, जबकि ‘एक कपड़ा’ σουδάριον के आकार या आधुनिक उपयोग के बारे में अनावश्यक विशिष्टता से बचता है।
