id: JHN.11.10
reference: John 11:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δέ τις περιπατῇ ἐν τῇ νυκτί, προσκόπτει, ὅτι τὸ φῶς οὐκ ἔστιν ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/010.yaml
  text: But if anyone walks in the night[a], he stumbles, because the light is not in him.
translation:
  language: hi
  text: पर यदि कोई रात में चलता है, तो वह ठोकर खाता है, क्योंकि ज्योति उसमें नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्योति उसके साथ नहीं है।” यूनानी में अधिक शाब्दिक रूप से “उसमें” है, जो केवल बाहरी प्रकाश के अभाव से बढ़कर भी कुछ सुझा सकता है।
    reason: वैकल्पिक अर्थ और मूल यूनानी की सम्भावित गहराई स्पष्ट करना।
lexical_decisions:
- source_word: ἐὰν δέ τις
  choice: पर यदि कोई
  rationale: δέ के विरोधसूचक संबंध, ἐὰν की शर्त और τις के सामान्य, अनिश्चित अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: περιπατῇ
  choice: चलता है
  rationale: क्रिया के शाब्दिक अर्थ के साथ उसके संभावित नैतिक या आत्मिक संकेत को भी खुला रखता है।
- source_word: ἐν τῇ νυκτί
  choice: रात में
  rationale: रात्रि की मूल छवि को सुरक्षित रखता है और इसे पहले ही अमूर्त ‘अन्धकार’ में नहीं बदलता।
- source_word: προσκόπτει
  choice: ठोकर खाता है
  rationale: भौतिक ठोकर और रूपकात्मक चूक—दोनों अर्थों के लिए स्वाभाविक हिन्दी है।
- source_word: ὅτι τὸ φῶς
  choice: क्योंकि ज्योति
  rationale: ὅτι के कारणसूचक बल को स्पष्ट करता है; ‘ज्योति’ यूहन्ना की प्रकाश-संबंधी भाषा की गरिमा और संभावित धर्मवैचारिक गहराई बनाए रखती है।
- source_word: οὐκ ἔστιν ἐν αὐτῷ
  choice: उसमें नहीं है
  rationale: ἐν के मूल आन्तरिक स्थानवाचक अर्थ को सीधे रखता है और कथन को केवल बाहरी रोशनी की अनुपस्थिति तक सीमित नहीं करता।
theological_decisions:
- issue: ‘ज्योति उसमें नहीं है’ का आशय
  choice: आन्तरिक शब्दावली ‘उसमें’ को मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘ज्योति उसके साथ नहीं है,’ अर्थात केवल बाहर से प्रकाश उपलब्ध न होना।
  rationale: यूनानी ἐν αὐτῷ का स्वाभाविक अर्थ ‘उसमें’ है। यूहन्ना में ज्योति की भाषा प्रायः गहरा आत्मिक संकेत भी रखती है; इसलिए अनुवाद शाब्दिक दृश्य और धर्मवैचारिक संभावना के बीच का तनाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘ज्योति’ को यूहन्ना की प्रमुख प्रकाश-छवि और उसके आत्मिक संकेत को बनाए रखने के लिए चुना गया है।
