    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις ἐξ αὐτῶν
  choice: पर उनमें से एक व्यक्ति
  rationale: εἷς और τις मिलकर समूह के किसी एक व्यक्ति का परिचय देते हैं। ‘उनमें से एक व्यक्ति’ स्वाभाविक हिन्दी है, और δέ का हल्का विरोध अथवा प्रसंग-परिवर्तन ‘पर’ से व्यक्त होता है।
- source_word: Καϊάφας
  choice: कैफा
  rationale: व्यक्तिनाम को हिन्दी बाइबल परंपरा के प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह एकवचन पदाधिकारी के लिए सटीक और प्रचलित हिन्दी शब्द है; इससे व्यापक याजकीय नेतृत्व और महायाजक के विशिष्ट पद का भेद बना रहता है।
- source_word: ὢν τοῦ ἐνιαυτοῦ ἐκείνου
  choice: जो उस वर्ष महायाजक था
  rationale: कृदन्तीय वाक्यांश कैफा का वर्णन करता है। यह रूप हिन्दी में सहज है और यूहन्ना की काल-सूचना को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे बोला
  rationale: λέγω और सम्प्रदान कारक का अर्थ सीधे संबोधन में ‘उनसे बोला’ है; यह संवाद के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: Ὑμεῖς οὐκ οἴδατε οὐδέν
  choice: तुम कुछ भी नहीं जानते!
  rationale: स्पष्ट सर्वनाम Ὑμεῖς और οὐκ…οὐδέν की नकारात्मक रचना मिलकर तीखी, जोरदार फटकार देती है। ‘कुछ भी नहीं’ उस बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कैफा के पद के विषय में यूहन्ना की काल-सूचना
  choice: जो उस वर्ष महायाजक था
  alternative: जो उस साल का महायाजक था
  rationale: चुना हुआ पाठ इसे केवल ऐतिहासिक वर्णन के रूप में रखता है और महायाजक के पद अथवा कथानक की विडंबना के विषय में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
