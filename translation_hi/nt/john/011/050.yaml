  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कैफा की कठोर व्यावहारिक गणना स्पष्ट है, पर ὑπέρ की जानबूझकर व्यापक अर्थ-सीमा को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
