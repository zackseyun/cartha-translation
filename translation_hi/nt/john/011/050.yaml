base_translation:
  language: en
  yaml_path: translation/nt/john/011/050.yaml
  text: Nor do you consider that it is better for you that one man die for the people[a], and not that the whole nation perish.
translation:
  language: hi
  text: और तुम यह भी नहीं सोचते कि तुम्हारे लिए यह हितकर है कि एक मनुष्य लोगों के लिए[a] मर जाए और पूरा राष्ट्र नष्ट न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों की ओर से”; इस वाक्यांश का अर्थ “लोगों के स्थान पर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲ
  choice: और तुम यह भी नहीं
  rationale: यह पिछले कथन से जुड़ी हुई आगे की फटकार है; यह रूप संयोजक और नकारात्मक दोनों बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λογίζεσθε
  choice: सोचते
  rationale: क्रिया का अर्थ विचार करना, हिसाब लगाना या ध्यान में रखना है; सभा के व्यावहारिक विचार-विमर्श में ‘सोचते’ सहज और स्पष्ट है।
- source_word: συμφέρει ὑμῖν
  choice: तुम्हारे लिए यही भला है
  rationale: यह व्यावहारिक लाभ और स्वार्थगत हित को व्यक्त करता है; ‘भला’ सामान्य आधुनिक हिन्दी में लाभकारी होने का भाव रखता है।
- source_word: ἵνα εἷς ἄνθρωπος ἀποθάνῃ
  choice: कि एक मनुष्य ... मर जाए
  rationale: ‘कि’ लाभकारी मानी गई बात की विषयवस्तु प्रस्तुत करता है, और ‘मर जाए’ यूनानी संभावनार्थक रूप को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ὑπὲρ τοῦ λαοῦ
  choice: लोगों के लिए
  rationale: ὑπέρ लाभ, प्रतिनिधित्व अथवा स्थानापन्नता का भाव रख सकता है; व्यापक ‘के लिए’ इस अर्थ-सीमा को खुला रखता है।
- source_word: ὅλον τὸ ἔθνος
  choice: पूरा राष्ट्र
  rationale: यहाँ ἔθνος राजनीतिक-जातीय समष्टि को सूचित करता है; ‘पूरा राष्ट्र’ उसी सामूहिक राष्ट्रीय विनाश की चिंता को स्पष्ट करता है।
- source_word: ἀπόληται
  choice: नष्ट न हो
  rationale: संदर्भ में क्रिया विनाश या बरबादी को दर्शाती है; ‘नष्ट न हो’ राष्ट्र के सामूहिक विनाश को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यीशु की मृत्यु के संबंध में ὑπέρ का अर्थ
  choice: मुख्य पाठ में व्यापक रूप ‘लोगों के लिए’
  alternative: ‘लोगों की ओर से’ अथवा ‘लोगों के स्थान पर’
  rationale: कैफा तत्काल संदर्भ में राजनीतिक लाभ की बात करता है, जबकि अगली आयत उसके शब्दों को अनजाने में की गई भविष्यवाणी बताती है। व्यापक अनुवाद तत्काल राजनीतिक अर्थ और बलिदानी/स्थानापन्न अर्थ की अनुगूँज—दोनों को सुरक्षित रखता है।
