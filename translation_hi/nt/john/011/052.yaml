source:
  edition: SBLGNT
  text: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’ ἵνα καὶ τὰ τέκνα τοῦ θεοῦ τὰ διεσκορπισμένα συναγάγῃ εἰς ἕν.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/052.yaml
  text: and not for the nation only[b][a], but also so that he might gather into one the scattered children of God.
translation:
  language: hi
  text: और केवल उस राष्ट्र के लिए ही नहीं[a], बल्कि इसलिए भी कि वह परमेश्वर की तितर-बितर हुई संतानों को एक कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “राष्ट्र” से संदर्भ के अनुसार यहूदी राष्ट्र अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἔθνους
  choice: राष्ट्र
  rationale: यहाँ एकवचन सामूहिक अर्थ में यहूदी राष्ट्र अभिप्रेत है; ‘राष्ट्र’ मूल की संक्षिप्तता बनाए रखता है।
- source_word: ἵνα
  choice: इसलिए कि
  rationale: यह उद्देश्यसूचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τέκνα τοῦ θεοῦ
  choice: परमेश्वर की संतानों
  rationale: τέκνα स्त्री-पुरुष दोनों को समेटने वाला शब्द है; ‘संतान’ अनावश्यक रूप से केवल पुरुषों का संकेत नहीं देता।
- source_word: διεσκορπισμένα
  choice: तितर-बितर हुई
  rationale: पूर्ण निष्क्रिय कृदन्त बिखरे होने की वर्तमान अवस्था का बोध कराता है।
- source_word: συναγάγῃ
  choice: एक कर दे
  rationale: संग्रह करने की क्रिया को εἰς ἕν के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἕν
  choice: एक
  rationale: मूल पाठ ‘एक देह’ या ‘एकता’ स्पष्ट नहीं करता; संक्षिप्त अभिव्यक्ति उसकी व्यापकता बनाए रखती है।
- source_word: καὶ οὐχ ὑπὲρ τοῦ ἔθνους μόνον, ἀλλ’
  choice: और केवल उस राष्ट्र के लिए ही नहीं, बल्कि ... भी
  rationale: यह पिछले पद में यीशु के दूसरों के लिए मरने के कथन को आगे बढ़ाता और मूल विरोधात्मक संरचना को बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर की संतानों’ की पहचान
  choice: यहूदी राष्ट्र से व्यापक, तितर-बितर समूह का संकेत रखते हुए उनकी सटीक पहचान को अनिर्धारित रखा गया है।
  alternative: इसे केवल प्रवासी यहूदियों अथवा स्पष्ट रूप से यहूदियों और गैर-यहूदियों में से चुने हुए विश्वासियों तक सीमित करना।
  rationale: यूनानी पाठ ‘राष्ट्र’ के सामने एक व्यापक समूह रखता है, पर उसकी सीमा को स्पष्ट नहीं करता; अनुवाद इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ‘एक कर दे’ हिन्दी में स्वाभाविक है और συναγάγῃ εἰς ἕν की संयुक्त शक्ति व्यक्त करता है, बिना ‘देह’ जैसी अनुपस्थित संज्ञा जोड़े।
