  rationale: आगे के वृत्तांत में लाज़र मरता है; इसलिए अनुवाद πρὸς की अंतिम परिणाम की दिशा को व्यक्त करता है, बिना कथात्मक और धर्मवैज्ञानिक तनाव मिटाए।
- issue: परमेश्वर की महिमा और परमेश्वर के पुत्र की महिमा का संबंध
  choice: दोनों कथनों को अलग और स्पष्ट रखा गया है।
  alternative: दोनों को मिलाकर दिव्य महिमा का एक सामान्य कथन बना देना।
  rationale: यूनानी पाठ बीमारी को परमेश्वर की महिमा के लिए बताता है और फिर उसके द्वारा पुत्र की महिमा होने का उद्देश्य प्रकट करता है।
