- source_word: οὐκ ἔστιν πρὸς θάνατον
  choice: मृत्यु पर समाप्त होने के लिए नहीं
  rationale: πρός के परिणाम/अंत की ओर संकेत को स्पष्ट करता है और इस तनाव को बनाए रखता है कि लाज़र मरता तो है, पर मृत्यु इस बीमारी का अंतिम परिणाम नहीं रहती।
- source_word: ὑπὲρ τῆς δόξης τοῦ θεοῦ
  choice: परमेश्वर की महिमा के लिए
  rationale: यहाँ ὑπέρ उद्देश्य अथवा हित व्यक्त करता है; हिन्दी वाक्यांश स्वाभाविक और अर्थ-सटीक है।
- source_word: ἵνα δοξασθῇ
  choice: ताकि ... की महिमा हो
  rationale: ἵνα के उद्देश्य को ‘ताकि’ से और यूनानी कर्मवाच्य को ‘महिमा हो’ से सुरक्षित रखा गया है।
- source_word: ὁ υἱὸς τοῦ θεοῦ
