theological_decisions:
- issue: लाज़र की वास्तविक मृत्यु के प्रकाश में ‘οὐκ ἔστιν πρὸς θάνατον’ का अर्थ
  choice: ‘मृत्यु पर समाप्त होने के लिए नहीं’—मृत्यु बीमारी का अंतिम परिणाम नहीं है।
