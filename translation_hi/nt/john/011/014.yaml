  text: τότε οὖν εἶπεν αὐτοῖς ὁ Ἰησοῦς παρρησίᾳ· Λάζαρος ἀπέθανεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/014.yaml
  text: So then Jesus told them plainly[a], “Lazarus has died.”
translation:
  language: hi
  text: तब यीशु ने उनसे साफ़-साफ़ कहा[a], “लाज़र मर गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब यीशु ने उनसे खुलकर कहा, ‘लाज़र मर गया।’”
    reason: παρρησίᾳ के लिए ‘खुलकर’ और ἀπέθανεν के लिए सरल भूतकाल भी सम्भव हैं।
lexical_decisions:
- source_word: τότε οὖν
  choice: तब
  rationale: यह संयुक्त पद घटनाक्रम में अगले चरण और पिछले कथन के परिणामस्वरूप अब स्पष्ट बोलने की ओर संक्रमण दिखाता है। हिन्दी में ‘तब’ इसे स्वाभाविक रूप से व्यक्त करता है; ‘इसलिए तब’ अनावश्यक रूप से बोझिल होता।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे ... कहा
  rationale: ‘उनसे कहा’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी क्रिया तथा अप्रत्यक्ष कर्म का सीधा अर्थ सुरक्षित रखता है।
- source_word: παρρησίᾳ
  choice: साफ़-साफ़
  rationale: संदर्भ में यह पहले प्रयुक्त ‘सो गया है’ वाली अप्रत्यक्ष भाषा के विपरीत खुलकर और अस्पष्टता के बिना कहने को दर्शाता है। ‘साफ़-साफ़’ साधारण पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: Λάζαρος
  choice: लाज़र
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ἀπέθανεν
  choice: मर गया है
  rationale: यूनानी एओरिस्ट मृत्यु की घटित घटना बताता है। हिन्दी पूर्ण पक्ष ‘मर गया है’ उस पूरी हो चुकी घटना और उसकी वर्तमान प्रासंगिकता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: लाज़र की दशा के बारे में यीशु के कथन का स्वरूप
  choice: शारीरिक मृत्यु का सीधा और स्पष्ट कथन
  alternative: पहले के ‘नींद’ रूपक को यहाँ भी बनाए रखना
  rationale: ἀπέθανεν स्पष्ट रूप से मृत्यु बताता है; इस पद में मूल पाठ स्वयं पिछले रूपक से उत्पन्न अस्पष्टता दूर करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘साफ़-साफ़’ स्पष्टता का बोलचाल में परिचित किंतु सम्मानजनक संकेत है; विकल्प पादटिप्पणी में अधिक शाब्दिक ‘खुलकर’ दिया गया है।
