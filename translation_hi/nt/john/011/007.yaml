base_translation:
  language: en
  yaml_path: translation/nt/john/011/007.yaml
  text: Then after this he says to the disciples[a], “Let us go into Judea again.”
translation:
  language: hi
  text: फिर इसके बाद वह चेलों से कहता है, “आओ, हम फिर यहूदिया चलें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπειτα
  choice: फिर
  rationale: यह कथा में समय-क्रम को स्वाभाविक और स्पष्ट ढंग से आगे बढ़ाता है।
- source_word: μετὰ τοῦτο
  choice: इसके बाद
  rationale: यूनानी पदबंध के काल-संबंधी अर्थ को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: λέγει
  choice: कहता है
  rationale: यूहन्ना के ऐतिहासिक वर्तमान को सुरक्षित रखता है और कथन में मूल की सजीवता बनाए रखता है।
- source_word: τοῖς μαθηταῖς
  choice: चेलों से
  rationale: सम्बोधन के लक्ष्य को स्वाभाविक हिन्दी में व्यक्त करता है; मूल में स्पष्ट न होने के कारण ‘अपने’ नहीं जोड़ा गया।
- source_word: Ἄγωμεν
  choice: आओ, हम ... चलें
  rationale: प्रथम पुरुष बहुवचन के प्रोत्साहनात्मक संभावनार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν Ἰουδαίαν
  choice: यहूदिया चलें
  rationale: गंतव्य की ओर गति को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; ‘यहूदिया में चलें’ यहाँ अप्राकृतिक होगा।
- source_word: πάλιν
  choice: फिर
  rationale: पहले गए हुए प्रदेश में दोबारा जाने का भाव सीधे और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना की कथा में ऐतिहासिक वर्तमान
  choice: ‘कहता है’ के द्वारा वर्तमान काल बनाए रखा गया
  alternative: हिन्दी कथा-शैली के अनुसार ‘कहा’
  rationale: वर्तमान काल मूल यूनानी की कथात्मक सजीवता और यूहन्ना की शैली को अधिक निकटता से सुरक्षित रखता है; इससे कोई अनावश्यक धर्मवैज्ञानिक अर्थ नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चेला’ आधुनिक हिन्दी बाइबल-प्रयोग में परिचित है। ‘फिर इसके बाद’ मूल के ἔπειτα और μετὰ τοῦτο—दोनों काल-सूचकों को सुरक्षित रखता है, यद्यपि हिन्दी में हल्की पुनरुक्ति सुनाई देती है।
