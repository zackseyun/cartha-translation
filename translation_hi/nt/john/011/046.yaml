  yaml_path: translation/nt/john/011/046.yaml
  text: But some of them went to the Pharisees and told them what Jesus had done[a].
translation:
  language: hi
  text: लेकिन उनमें से कुछ फरीसियों के पास गए और उन्हें बताया कि यीशु ने क्या किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उन्हें बताया कि यीशु ने क्या किया।” यूनानी पाठ यह स्पष्ट नहीं करता कि फरीसियों के पास जाने वालों की मंशा क्या थी।'
    reason: क्रिया-काल का वैकल्पिक स्वाभाविक अनुवाद और कथित मंशा के विषय में मूल पाठ की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: लेकिन उनमें से कुछ
  rationale: δὲ पिछले पद में विश्वास करनेवालों से विरोध दिखाता है, जबकि τινὲς ἐξ αὐτῶν उसी समूह के एक अनिश्चित उपसमूह को सूचित करता है। यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: ἀπῆλθον πρὸς τοὺς Φαρισαίους
  choice: फरीसियों के पास गए
  rationale: ἀπῆλθον घटनास्थल से जाने को सूचित करता है; लक्ष्य πρὸς τοὺς Φαρισαίους के साथ स्पष्ट होने के कारण हिन्दी में “के पास गए” स्वाभाविक है और अनावश्यक रूप से “वहाँ से चले गए” दोहराने से बचता है।
- source_word: εἶπαν αὐτοῖς
  choice: उन्हें बताया
  rationale: इस कथात्मक संदर्भ में λέγω का आशय सूचना देना है। “बताया” न तो केवल बोलने तक सीमित करता है, न कोई विरोधी मंशा जोड़ता है।
- source_word: ἃ ἐποίησεν Ἰησοῦς
  choice: कि यीशु ने क्या किया था
  rationale: ἃ को स्वाभाविक हिन्दी में “क्या” से व्यक्त किया गया है। पूर्ण हो चुकी घटना रिपोर्ट करने से पहले हुई थी, इसलिए “किया था” घटनाक्रम स्पष्ट करता है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय मानक रूप।
theological_decisions:
- issue: फरीसियों को बतानेवालों की मंशा
  choice: 'तटस्थ सूचना-भाषा: “उन्हें बताया”'
  alternative: “यीशु की शिकायत की” या “यीशु के विरुद्ध खबर दी”
  rationale: यूनानी पाठ केवल उनके जाने और बताने की बात करता है; इस पद में उनकी मंशा स्पष्ट नहीं की गई। अतः अनुवाद शत्रुतापूर्ण उद्देश्य नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। “फरीसी” का प्रचलित हिन्दी बाइबलीय रूप रखा गया है और मूल पाठ से परे कोई आरोपात्मक आशय नहीं जोड़ा गया।
