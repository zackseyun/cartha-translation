base_translation:
  language: en
  yaml_path: translation/nt/john/011/020.yaml
  text: So when Martha heard that Jesus was coming[a], she went to meet him; but Mary was sitting in the house.
translation:
  language: hi
  text: इसलिए जब मार्था ने सुना कि यीशु आ रहे थे[a], तो वह उनसे मिलने गई; पर मरियम घर में बैठी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु आ रहे हैं।” यूनानी में परोक्ष कथन के भीतर वर्तमान काल की क्रिया है; इसे सजीव वर्तमान के रूप में भी अनूदित किया जा सकता है।
    reason: कालगत और अनुवादगत विकल्प को स्पष्ट करना
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा की परिणति या अगली घटना को जोड़ता है; ‘इसलिए’ इसके संयोजक और निष्कर्षसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ὡς
  choice: जब
  rationale: यहाँ यह कालवाचक उपवाक्य आरम्भ करता है। ‘जब’ स्पष्ट और स्वाभाविक है; ‘जैसे ही’ मूल से अधिक तात्कालिकता जोड़ सकता है।
- source_word: ἤκουσεν
  choice: ने सुना
  rationale: ἀκούω के सामान्य और सीधे अर्थ को सुरक्षित रखता है; ‘पता चला’ सम्भव है, पर कम शाब्दिक है।
- source_word: ἔρχεται
  choice: आ रहे हैं
  rationale: यूनानी वर्तमान काल को परोक्ष कथन में उसके सजीव और जारी क्रिया-बोध सहित रखता है। हिन्दी में आदरसूचक बहुवचन यीशु के लिए स्वाभाविक है।
- source_word: ὑπήντησεν αὐτῷ
  choice: वह उनसे मिलने गई
  rationale: क्रिया में किसी की ओर जाकर मिलने का दिशात्मक भाव है। ‘मिलने गई’ इसे केवल ‘मिली’ की अपेक्षा अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: मार्था की गतिविधि और मरियम की स्थिति के बीच हल्का विरोध प्रकट करता है।
- source_word: ἐν τῷ οἴκῳ
  choice: घर में
  rationale: पूर्वसर्गीय पदबंध का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἐκαθέζετο
  choice: बैठी रही
  rationale: अपूर्ण भूतकाल में व्यक्त जारी स्थिति को स्वाभाविक हिन्दी में दर्शाता है और मार्था के बाहर जाने के विपरीत मरियम के घर में बैठे रहने का भाव बनाए रखता है।
- source_word: Μάρθα / Μαρία / Ἰησοῦς
  choice: मार्था / मरियम / यीशु
  rationale: आधुनिक मानक हिन्दी बाइबलीय परम्परा में प्रचलित नाम-रूप अपनाए गए हैं।
