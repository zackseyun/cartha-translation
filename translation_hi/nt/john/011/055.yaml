base_translation:
  language: en
  yaml_path: translation/nt/john/011/055.yaml
  text: The Passover of the Jews was near[b][a], and many went up to Jerusalem from the countryside before the Passover to purify themselves.
translation:
  language: hi
  text: यहूदियों का फसह पर्व[a] निकट था। बहुत-से लोग फसह से पहले देहात से यरूशलेम चढ़ गए, ताकि वे अपने आप को शुद्ध करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदी फसह पर्व।” यूनानी में अधिक शाब्दिक रूप से “यहूदियों का फसह” है; यूहन्ना में यह अभिव्यक्ति बार-बार आती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, फसह की तैयारी के लिए अनुष्ठानिक शुद्धि करने हेतु।
    reason: cultural_note
lexical_decisions:
- source_word: Ἦν δὲ
  choice: था
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। अलग से ‘अब’ जोड़ना आवश्यक नहीं; हिन्दी में नया वाक्य स्वाभाविक रूप से कथानक को आगे बढ़ाता है।
- source_word: ἐγγὺς
  choice: निकट
  rationale: यहाँ समय की निकटता व्यक्त होती है; ‘निकट था’ संक्षिप्त और स्पष्ट है।
- source_word: τὸ πάσχα τῶν Ἰουδαίων
  choice: यहूदियों का फसह पर्व
  rationale: यह रूप यूनानी संबंधकारक ‘यहूदियों का’ को बनाए रखता है और यूहन्ना में बार-बार आने वाली अभिव्यक्ति को अत्यधिक समतल नहीं करता। ‘पर्व’ जोड़ने से आधुनिक हिन्दी पाठक के लिए फसह का प्रसंग स्पष्ट होता है।
- source_word: ἀνέβησαν
  choice: चढ़ गए
  rationale: यरूशलेम की तीर्थयात्रा के लिए प्रयुक्त ‘ऊपर जाने’ की भौगोलिक और पारंपरिक धारणा को सुरक्षित रखता है।
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यूनानी विशेषण यहाँ संज्ञा की तरह प्रयुक्त है; हिन्दी में ‘लोग’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: गति की दिशा ‘चढ़ गए’ के साथ हिन्दी वाक्य-विन्यास में स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἐκ τῆς χώρας
  choice: देहात से
  rationale: χώρα यहाँ नगर के बाहर के ग्रामीण क्षेत्र को सूचित करता है; ‘देहात’ सहज आधुनिक हिन्दी है।
- source_word: πρὸ τοῦ πάσχα
  choice: फसह से पहले
  rationale: मूल की सीधी कालवाचक अभिव्यक्ति को स्पष्ट हिन्दी में रखता है।
- source_word: ἵνα ἁγνίσωσιν ἑαυτούς
  choice: ताकि वे अपने आप को शुद्ध करें
  rationale: ἵνα के उद्देश्यबोधक अर्थ और आत्मवाचक ἑαυτούς दोनों को स्पष्ट रूप से सुरक्षित रखता है; अनुष्ठानिक आशय पादटिप्पणी में समझाया गया है।
theological_decisions:
- issue: फसह से पहले शुद्ध होने का स्वरूप
  choice: अपने आप को शुद्ध करें
  alternative: अनुष्ठान के अनुसार अपने आप को शुद्ध करें; अपने आप को पवित्र करें
  rationale: संदर्भ यहूदी फसह की तैयारी के लिए अनुष्ठानिक शुद्धि का है। मुख्य पाठ मूल की सामान्य शब्दावली को बनाए रखता है और इसे बाद की मसीही संस्कार-संबंधी या केवल नैतिक श्रेणी में नहीं बाँधता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘फसह’ स्थापित बाइबलीय पद है; ‘देहात’ ग्रामीण क्षेत्र को सहज ढंग से व्यक्त करता है। ‘यरूशलेम चढ़ गए’ तीर्थयात्रा की स्रोत-भाषायी दिशा को बचाता है, यद्यपि सामान्य हिन्दी में केवल ‘गए’ भी संभव है।
