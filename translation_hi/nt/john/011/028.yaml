source:
  edition: SBLGNT
  text: Καὶ ⸀τοῦτο εἰποῦσα ἀπῆλθεν καὶ ἐφώνησεν ⸀Μαριὰμ τὴν ἀδελφὴν αὐτῆς λάθρᾳ εἰποῦσα· Ὁ διδάσκαλος πάρεστιν καὶ φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/john/011/028.yaml
  text: And after saying this[a], she went away and called Mary her sister privately, saying[c][b], “The Teacher is here and is calling for you.”
translation:
  language: hi
  text: यह कहने के बाद वह चली गई और अपनी बहन मरियम को चुपके से बुलाया। उसने उससे कहा, “गुरु यहाँ हैं और तुम्हें बुला रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰποῦσα
  choice: यह कहने के बाद
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी में क्रमसूचक रूप से व्यक्त किया गया है; इससे पहले कही गई बात की ओर संकेत बना रहता है।
- source_word: ἀπῆλθεν
  choice: वह चली गई
  rationale: क्रिया स्थान से चले जाने को बताती है; कथात्मक हिन्दी में यह सहज और स्पष्ट है।
- source_word: ἐφώνησεν Μαριὰμ τὴν ἀδελφὴν αὐτῆς
  choice: अपनी बहन मरियम को ... बुलाकर
  rationale: φωνέω यहाँ किसी को अपने पास बुलाने के अर्थ में है, और संबंधसूचक पद मरियम की पहचान उसकी बहन के रूप में कराता है।
- source_word: λάθρᾳ
  choice: चुपके से
  rationale: यह क्रियाविशेषण दूसरों की सुनवाई से बचाकर कही गई बात का संकेत देता है। हिन्दी में ‘चुपके से’ उस गोपनीय ढंग को स्वाभाविक रूप से व्यक्त करता है, बिना किसी अनुचित उद्देश्य को निश्चित किए।
- source_word: εἰποῦσα
  choice: कहा
  rationale: वचन का परिचय देने वाले कृदंत को हिन्दी की स्वाभाविक संयुक्त क्रिया ‘बुलाकर कहा’ में व्यक्त किया गया है।
- source_word: Ὁ διδάσκαλος
  choice: गुरु
  rationale: διδάσκαλος का मूल अर्थ शिक्षक है; यीशु के लिए सम्मानसूचक संबोधन के रूप में आधुनिक हिन्दी में ‘गुरु’ संक्षिप्त और स्वाभाविक है, जबकि ‘स्वामी’ मूल शब्द से अधिक प्रभुत्व का भाव जोड़ सकता है।
- source_word: πάρεστιν
  choice: यहाँ हैं
  rationale: क्रिया वर्तमान उपस्थिति व्यक्त करती है। आदरसूचक बहुवचन के साथ ‘यहाँ हैं’ स्वाभाविक हिन्दी है।
- source_word: φωνεῖ σε
  choice: तुम्हें बुला रहे हैं
  rationale: वर्तमानकालीन क्रिया यहाँ मरियम को उपस्थित होने के लिए बुलाने का भाव देती है; यह रूप केवल उसका नाम पुकारने की अपेक्षा प्रसंग को अधिक ठीक व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए διδάσκαλος की उपाधि
  choice: गुरु
  alternative: शिक्षक; स्वामी
  rationale: ‘गुरु’ शिक्षण और सम्मान दोनों का भाव रखता है तथा मूल पद को अनावश्यक रूप से प्रभुत्वसूचक मसीही उपाधि में नहीं बदलता।
- issue: λάθρᾳ का आशय
  choice: चुपके से
  alternative: अलग ले जाकर; गुप्त रूप से
  rationale: मूल शब्द सार्वजनिक सुनवाई से बचाकर संवाद करने का संकेत देता है, पर उसके कारण या उद्देश्य को स्पष्ट नहीं करता। चुना हुआ रूप उसी अस्पष्टता को बनाए रखता है।
- issue: φωνεῖ से अभिप्रेत बुलावा
  choice: तुम्हें बुला रहे हैं
  alternative: तुम्हें पुकारते हैं; तुम्हें अपने पास बुला रहे हैं
  rationale: यह मरियम की उपस्थिति माँगे जाने का स्वाभाविक अर्थ देता है, पर ‘अपने पास’ जैसी मूल में अनुपस्थित स्पष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज कथात्मक प्रवाह और यीशु के लिए आदरसूचक बहुवचन। वाक्य सामान्य पाठक के लिए स्पष्ट रखा गया है और मूल की विवेकपूर्ण, निजी सूचना का भाव बनाए रखता है।
