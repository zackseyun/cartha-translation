source:
  edition: SBLGNT
  text: ἦραν οὖν τὸν ⸀λίθον. ὁ δὲ Ἰησοῦς ἦρεν τοὺς ὀφθαλμοὺς ἄνω καὶ εἶπεν· Πάτερ, εὐχαριστῶ σοι ὅτι ἤκουσάς μου,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/041.yaml
  text: So they took away the stone[a]. And Jesus lifted his eyes upward and said, “Father[b], I thank you that you have heard me,”
translation:
  language: hi
  text: इसलिए उन्होंने पत्थर हटा दिया। तब यीशु ने अपनी आँखें ऊपर उठाईं[a] और कहा, “हे पिता, मैं आपका धन्यवाद करता हूँ कि आपने मेरी सुन ली है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपर देखा।”
    reason: lexical_alternative
  - marker: b
    text: या “आपने मेरी सुनी।” यूनानी में यहाँ एओरिस्ट रूप है; इसे अधिक शाब्दिक रूप से इस तरह भी अनुवाद किया जा सकता है। मुख्य पाठ का “सुन ली है” पूरी हुई क्रिया की वर्तमान प्रासंगिकता को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: हटा दिया
  rationale: कब्र के मुँह से पत्थर दूर किए जाने के संदर्भ में यह स्वाभाविक और स्पष्ट हिन्दी है; केवल ‘उठाया’ कहने से कार्य अधूरा या अस्पष्ट लग सकता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले आदेश के परिणामस्वरूप हुई कार्रवाई को दर्शाता है और कथानक की कारणात्मक कड़ी बनाए रखता है।
- source_word: λίθον
  choice: पत्थर
  rationale: कब्र के द्वार को बंद करने वाली वस्तु के लिए यही मानक और स्वाभाविक हिन्दी शब्द है।
- source_word: ἦρεν τοὺς ὀφθαλμοὺς ἄνω
  choice: अपनी आँखें ऊपर उठाईं
  rationale: यह यूनानी अभिव्यक्ति की दृश्यात्मकता को बनाए रखते हुए प्रार्थना के लिए ऊपर दृष्टि करने का भाव स्पष्ट करती है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि अगली कथात्मक क्रिया की ओर हल्का संक्रमण करता है; हिन्दी में ‘तब’ इस क्रम को स्वाभाविक बनाता है।
- source_word: Πάτερ
  choice: हे पिता
  rationale: सम्बोधन को स्पष्ट और प्रार्थना के प्रसंग में स्वाभाविक बनाता है, बिना किसी अतिरिक्त उपाधि या धर्मवैज्ञानिक व्याख्या के।
- source_word: εὐχαριστῶ σοι
  choice: मैं आपका धन्यवाद करता हूँ
  rationale: वर्तमान काल के धन्यवाद को सरल, आधुनिक और सम्मानपूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὅτι ἤκουσάς μου
  choice: कि आपने मेरी सुन ली है
  rationale: यह प्रार्थना को अनुकूल रूप से सुनने का प्रसंगगत अर्थ और पूर्ण हुई क्रिया की वर्तमान प्रासंगिकता दोनों व्यक्त करता है।
theological_decisions:
- issue: प्रार्थना में परमेश्वर के लिए यीशु का सम्बोधन
  choice: हे पिता
  alternative: पिता
  rationale: सरल पितृ-सम्बोधन को सुरक्षित रखते हुए हिन्दी में प्रत्यक्ष सम्बोधन स्पष्ट किया गया है; कोई अतिरिक्त उपाधि नहीं जोड़ी गई।
- issue: ἤκουσάς μου का प्रार्थना-संदर्भ में आशय
  choice: आपने मेरी सुन ली है
  alternative: आपने मेरी सुनी
  rationale: यह पिता द्वारा यीशु की प्रार्थना सुने जाने की पूर्ण घटना और उसके वर्तमान महत्व को व्यक्त करता है, पर इससे आगे उत्तरित प्रार्थना के विषय में कोई व्यापक सिद्धान्त नहीं जोड़ता।
- issue: परमेश्वर के लिए द्वितीय पुरुष सम्बोधन
  choice: आप/आपने
  alternative: तू/तूने
  rationale: आधुनिक मानक हिन्दी में सम्मान और गरिमा बनाए रखने के लिए आदरसूचक रूप चुना गया है; इससे यूनानी एकवचन सम्बोधन के संबंधात्मक आशय में कोई धर्मवैज्ञानिक परिवर्तन नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। परमेश्वर के सम्बोधन में आधुनिक आदरसूचक ‘आप’ रखा गया है। दृश्यात्मक यूनानी मुहावरे को मुख्य पाठ में सुरक्षित रखा गया है और अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
