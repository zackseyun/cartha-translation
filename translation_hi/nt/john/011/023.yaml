  text: Jesus says to her[a], “Your brother will rise again.”
translation:
  language: hi
  text: यीशु उससे कहते हैं, “तुम्हारा भाई जी उठेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहते हैं
  rationale: यूहन्ना के वर्णन में प्रयुक्त ऐतिहासिक वर्तमान को बनाए रखता है और हिन्दी में स्वाभाविक कथात्मक सजीवता देता है।
- source_word: αὐτῇ
  choice: उससे
  rationale: सम्प्रदानवाची सर्वनाम को ‘कहते हैं’ के साथ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀναστήσεται
  choice: जी उठेगा
  rationale: सन्दर्भ में यह मृतकों में से उठने का संकेत देता है। ‘जी उठेगा’ हिन्दी में पुनरुत्थान का स्वाभाविक प्रयोग है और यूनानी के अकर्मक/मध्य रूप के अनुरूप है; ‘जिलाया जाएगा’ अनावश्यक रूप से बाहरी कर्ता को प्रमुख बनाता।
- source_word: ὁ ἀδελφός σου
  choice: तुम्हारा भाई
  rationale: सम्बन्धवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप; सन्दर्भ में मार्था के भाई लाज़र को सूचित करता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप; यूनानी निश्चित उपपद का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
theological_decisions:
- issue: पुनरुत्थान की अभिव्यक्ति
  choice: जी उठेगा
  alternative: उठेगा; जिलाया जाएगा
  rationale: यह कथन पुनरुत्थान का आश्वासन देता है, पर इसी पद में यह स्पष्ट नहीं करता कि संकेत तत्काल जीवन-बहाली की ओर है या अन्तिम दिन के पुनरुत्थान की ओर। ‘जी उठेगा’ उस अर्थ और तनाव को बनाए रखता है, जबकि ‘जिलाया जाएगा’ यूनानी रूप से अधिक स्पष्ट रूप में किसी बाहरी कर्ता की क्रिया बताता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यीशु के लिए आदरसूचक बहुवचन ‘कहते हैं’ रखा गया है, जबकि यूनानी ऐतिहासिक वर्तमान भी सुरक्षित है। ‘जी उठेगा’ में हिन्दी का ‘जी’ पुनरुत्थान का अर्थ स्वाभाविक रूप से स्पष्ट करता है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं समझी गई।
