source:
  edition: SBLGNT
  text: λέγουσιν αὐτῷ οἱ μαθηταί· Ῥαββί, νῦν ἐζήτουν σε λιθάσαι οἱ Ἰουδαῖοι, καὶ πάλιν ὑπάγεις ἐκεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/011/008.yaml
  text: The disciples said to him[a], “Rabbi, just now the Jews were seeking to stone you, and are you going there again?”
translation:
  language: hi
  text: चेलों ने उनसे कहा[a], “रब्बी, अभी-अभी यहूदी आपको पत्थर मारने की कोशिश कर रहे थे, और आप फिर वहीं जा रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के निवासी”; अथवा, सन्दर्भ के अनुसार, “यहूदी अगुवे।” यूहन्ना प्रायः “यहूदी” शब्द का प्रयोग समस्त यहूदी लोगों के लिए नहीं, बल्कि यहूदिया में यीशु के विरोधियों के लिए करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγουσιν
  choice: ने ... कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान आधुनिक हिन्दी कथा में स्वाभाविक रूप से सामान्य भूतकाल में व्यक्त किया गया है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: मूल में लिप्यंतरित सामी संबोधन है; ‘रब्बी’ उसे और यूहन्ना की शैली को सुरक्षित रखता है।
- source_word: νῦν
  choice: अभी-अभी
  rationale: सन्दर्भ में यह वर्तमान क्षण से अधिक हाल की घटना पर बल देता है।
- source_word: ἐζήτουν
  choice: कोशिश कर रहे थे
  rationale: अपूर्ण भूतकाल जारी या प्रयत्नशील पिछली क्रिया दर्शाता है; हिन्दी में यह प्रयोग उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λιθάσαι
  choice: पत्थरवाह करने
  rationale: यह पत्थर मारने की क्रिया का सीधा अर्थ देता है; मूल में मृत्यु का परिणाम स्पष्टतः नहीं जोड़ा गया है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यह शब्द का सीधा और व्यापक अर्थ है; यूहन्ना में सम्भावित संकीर्ण स्थानीय या विरोधी समूह का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πάλιν
  choice: फिर
  rationale: पुनः होने का सामान्य क्रियाविशेषणात्मक अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπάγεις
  choice: जा रहे हैं
  rationale: यहाँ क्रिया पहले उल्लिखित स्थान की ओर जाने को बताती है; यह आधुनिक हिन्दी का स्पष्ट और स्वाभाविक रूप है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: यह यहूदिया में उसी खतरे वाले स्थान की ओर संकेत करता है; ‘वहीं’ पुनरागमन के भाव को सहज बनाता है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का अभिप्रेत समूह
  choice: यहूदी
  alternative: यहूदिया के लोग; यहूदी अगुवे
  rationale: मुख्य पाठ शब्द का सीधा अर्थ रखता है, क्योंकि इस पद में अगुवों का स्पष्ट उल्लेख नहीं है। फिर भी यूहन्ना में यह पद प्रायः यहूदिया में यीशु के विरोधियों के लिए प्रयुक्त हो सकता है; इस सम्भावना को पादटिप्पणी में रखा गया है ताकि समस्त यहूदी लोगों पर आरोप का अनुचित अर्थ न निकले।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सुबोध हिन्दी। आदरसूचक ‘आप’ शिष्यों के संबोधन के अनुरूप है। ‘पत्थरवाह’ बाइबलीय सन्दर्भ में सटीक और प्रचलित है, जबकि वाक्य-संरचना सहज रखी गई है।
