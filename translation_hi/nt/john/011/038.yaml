base_translation:
  language: en
  yaml_path: translation/nt/john/011/038.yaml
  text: Jesus[a], then, again deeply moved within himself, came to the tomb. Now it was a cave, and a stone was lying against it.
translation:
  language: hi
  text: तब यीशु अपने भीतर फिर से बहुत व्याकुल[a] होकर कब्र पर आए। वह एक गुफा थी, और उसके मुँह पर एक पत्थर रखा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने भीतर क्रोधित होकर’ अथवा ‘अपने भीतर अत्यन्त उद्विग्न होकर’; यूनानी क्रिया असामान्य रूप से प्रबल है और केवल शोक से बढ़कर किसी भाव का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले दृश्य से कथा की प्रगति और हल्का निष्कर्ष-संबंध दिखाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक है।
- source_word: πάλιν
  choice: फिर से
  rationale: यह पहले वर्णित यीशु की तीव्र भावात्मक प्रतिक्रिया की पुनरावृत्ति स्पष्ट करता है।
- source_word: ἐμβριμώμενος ἐν ἑαυτῷ
  choice: अपने भीतर फिर से बहुत व्याकुल होकर
  rationale: यह अभिव्यक्ति तीव्र आंतरिक भावावेग बताती है, पर मुख्य पाठ में उसे केवल शोक या केवल रोष के रूप में सीमित नहीं करती।
- source_word: ἔρχεται
  choice: आए
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में स्वाभाविक भूतकाल से व्यक्त किया गया है; आदरसूचक बहुवचन आधुनिक हिन्दी में यीशु के लिए सहज है।
- source_word: μνημεῖον
  choice: कब्र
  rationale: संदर्भ एक गुफानुमा दफ़न-स्थान का है; ‘कब्र’ सामान्य पाठक के लिए स्पष्ट और प्रचलित है।
- source_word: σπήλαιον
  choice: गुफा
  rationale: यह यूनानी संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: λίθος
  choice: पत्थर
  rationale: दफ़न-स्थान के प्रवेश को बंद करने वाले पत्थर के लिए सामान्य और सटीक शब्द है।
- source_word: ἐπέκειτο ἐπ’ αὐτῷ
  choice: उसके मुँह पर एक पत्थर रखा हुआ था
  rationale: गुफा के संदर्भ में यह पत्थर की प्रवेश-द्वार पर अवरोधक स्थिति स्पष्ट करता है, जबकि यूनानी संबंधवाचक प्रयोग का आशय स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: यीशु के विषय में ἐμβριμώμενος की भावात्मक शक्ति
  choice: मुख्य पाठ में ‘बहुत व्याकुल’ रखकर तीव्र आंतरिक भावावेग व्यक्त किया गया है, बिना उसकी प्रकृति को केवल शोक या केवल रोष ठहराए।
  alternative: ‘अपने भीतर क्रोधित’ अथवा ‘अपने भीतर अत्यन्त उद्विग्न’
  rationale: क्रिया असामान्य रूप से प्रबल है और रोष या क्षोभ का संकेत दे सकती है, पर इस पद में सटीक भाव विवादित है; इसलिए मुख्य पाठ अस्पष्टता बचाता है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथा-शैली। यीशु के लिए सम्मानसूचक क्रिया ‘आए’ प्रयुक्त हुई है। ‘कब्र’ के साथ अगला वाक्य उसके गुफा होने और मुँह पर पत्थर रखे होने को स्पष्ट करता है।
