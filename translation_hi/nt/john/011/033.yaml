source:
  edition: SBLGNT
  text: Ἰησοῦς οὖν ὡς εἶδεν αὐτὴν κλαίουσαν καὶ τοὺς συνελθόντας αὐτῇ Ἰουδαίους κλαίοντας ἐνεβριμήσατο τῷ πνεύματι καὶ ἐτάραξεν ἑαυτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/011/033.yaml
  text: Therefore[a], when Jesus saw her weeping, and the Jews who had come with her weeping[b], he was deeply moved in his spirit and troubled himself.
translation:
  language: hi
  text: इसलिए जब यीशु ने उसे रोते हुए और उसके साथ आए यहूदियों[a] को रोते हुए देखा, तो वह अपनी आत्मा में गहराई से उद्वेलित हुआ[b] और उसने अपने आप को व्याकुल किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदिया के निवासी’। यहाँ यह शब्द मरियम के साथ आए यहूदी शोक मनाने वालों के लिए है, समस्त यहूदी जाति के लिए नहीं।
    reason: lexical_alternative
  - marker: b
    text: इस क्रिया का अर्थ ‘रोष से भर उठा’ या ‘बहुत क्षुब्ध हुआ’ भी हो सकता है; यह तीव्र भीतरी हलचल व्यक्त करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक संबंध और परिणामसूचक आगे बढ़ाव को बनाए रखता है।
- source_word: ὡς εἶδεν
  choice: जब ... देखा
  rationale: यहाँ ὡς का प्रयोग कालवाचक है; यह रूप आधुनिक हिन्दी में स्वाभाविक ढंग से घटनाक्रम व्यक्त करता है।
- source_word: κλαίουσαν / κλαίοντας
  choice: रोते हुए
  rationale: κλαίω सुनाई देने वाले रोने को व्यक्त कर सकता है। ‘रोते हुए’ मरियम और उसके साथ आए लोगों—दोनों के लिए सहज है और अनुष्ठानिक विलाप का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: συνελθόντας αὐτῇ
  choice: उसके साथ आए
  rationale: यह मरियम के साथ आए या उससे आ मिले लोगों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰουδαίους
  choice: यहूदियों
  rationale: यह सीधा शाब्दिक अर्थ है; प्रसंग में इसका संकेत मरियम के साथ आए यहूदी शोक मनाने वालों की ओर है, समस्त यहूदी जाति की ओर नहीं। इस सीमा को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐνεβριμήσατο
  choice: गहराई से उद्वेलित हुआ
  rationale: क्रिया तीव्र भीतरी हलचल व्यक्त करती है और उसमें रोष या क्षोभ का भाव भी हो सकता है। ‘गहराई से उद्वेलित हुआ’ तीव्रता को रखता है, पर भावना का सटीक प्रकार तय नहीं करता।
- source_word: τῷ πνεύματι
  choice: अपनी आत्मा में
  rationale: यह उस भीतरी क्षेत्र को व्यक्त करता है जिसमें यीशु की तीव्र भावनात्मक हलचल हुई।
- source_word: ἐτάραξεν ἑαυτόν
  choice: उसने अपने आपको व्याकुल कर लिया
  rationale: यह यूनानी पाठ की स्पष्ट आत्मवाचक रचना को बनाए रखता है और उसे केवल ‘व्याकुल हो गया’ बनाकर सपाट नहीं करता।
theological_decisions:
- issue: ἐνεβριμήσατο में यीशु की भावना का स्वरूप
  choice: गहराई से उद्वेलित हुआ
  alternative: रोष से भर उठा; बहुत क्षुब्ध हुआ
  rationale: यूनानी क्रिया प्रबल भीतरी हलचल बताती है, पर यहाँ उसका प्रमुख भाव दुःख, रोष या क्षोभ है—यह निश्चित नहीं। मुख्य पाठ इस तनाव को खुला रखता है और अधिक तीखे संभावित अर्थ पादटिप्पणी में देता है।
- issue: ἐτάραξεν ἑαυτόν की आत्मवाचक अभिव्यक्ति
  choice: उसने अपने आपको व्याकुल कर लिया
  alternative: वह व्याकुल हो गया
  rationale: वैकल्पिक रूप हिन्दी में अधिक सामान्य है, पर वह मूल पाठ की आत्मवाचकता मिटा देता है। चुना हुआ रूप यीशु की प्रतिक्रिया को मात्र निष्क्रिय भाव-दशा नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘उद्वेलित’ तीव्र भावनात्मक हलचल के लिए चुना गया है, जबकि पादटिप्पणी रोष या क्षोभ की संभावित छाया सुरक्षित रखती है। आत्मवाचक यूनानी वाक्यांश के कारण अंतिम खंड जानबूझकर थोड़ा चिह्नित है।
