base_translation:
  language: en
  yaml_path: translation/nt/john/011/053.yaml
  text: So from that day on they planned to kill him.
translation:
  language: hi
  text: इसलिए उस दिन से वे उसे मार डालने की योजना बनाने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπ’ ἐκείνης ... τῆς ἡμέρας
  choice: उस दिन से
  rationale: ἀπό के साथ संबंधकारक पदबंध उस दिन को आगे चलने वाली स्थिति का आरंभ-बिंदु बताता है। हिंदी में क्रिया-पदबंध ‘योजना बनाने लगे’ निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले महासभा-विचार-विमर्श के परिणाम या निष्कर्ष को जोड़ता है; ‘इसलिए’ उसका स्पष्ट और स्वाभाविक हिंदी रूप है।
- source_word: ἐβουλεύσαντο
  choice: योजना बनाने लगे
  rationale: यहाँ क्रिया विचार-विमर्श से निकली जानबूझकर बनाई गई योजना को व्यक्त करती है। ‘योजना बनाने लगे’ षड्यंत्रकारी आशय और उस दिन से आरंभ हुई कार्रवाई, दोनों को सहज हिंदी में रखता है।
- source_word: ἵνα ἀποκτείνωσιν
  choice: मार डालने की
  rationale: ἵνα के साथ क्रिया यहाँ विचार/योजना की विषयवस्तु और उद्देश्य बताती है। ‘मार डालना’ ἀποκτείνω का सीधा अर्थ देता है और अनावश्यक न्यायिक प्रक्रिया का संकेत नहीं जोड़ता।
- source_word: αὐτόν
  choice: उसे
  rationale: सर्वनाम निकट संदर्भ में यीशु की ओर संकेत करता है; मूल की तरह नाम जोड़े बिना ‘उसे’ स्वाभाविक है।
theological_decisions:
- issue: यीशु के प्रति अगुवों के इरादे का स्वरूप
  choice: कथन को उसे मार डालने की वास्तविक और सोची-समझी योजना के रूप में प्रस्तुत किया गया है।
  alternative: उन्होंने उसे मार डालने पर विचार किया।
  rationale: यूनानी पाठ केवल संभावना पर चर्चा नहीं, बल्कि विचार-विमर्श से निकली निर्णायक योजना व्यक्त करता है। अनुवाद इस गंभीरता को बनाए रखता है, पर किसी अतिरिक्त न्यायिक या धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गंभीर और गरिमापूर्ण शैली। ‘मार डालना’ स्पष्ट है, जबकि ‘वध करना’ अधिक साहित्यिक और ‘मृत्युदंड देना’ मूल से अधिक न्यायिक अर्थ जोड़ता।
