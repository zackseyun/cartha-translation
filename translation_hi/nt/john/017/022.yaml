  text: κἀγὼ τὴν δόξαν ἣν δέδωκάς μοι δέδωκα αὐτοῖς, ἵνα ὦσιν ἓν καθὼς ἡμεῖς ⸀ἕν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/022.yaml
  text: And I have given them the glory that you have given me[a], so that they may be one, just as we are one.
translation:
  language: hi
  text: और मैंने[a] उन्हें वह महिमा दी है जो आपने मुझे दी है, ताकि वे एक हों, ठीक जैसे हम एक हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “और मैंने भी उन्हें वह महिमा दी है जो आपने मुझे दी है।” यूनानी κἀγώ में “भी” का योगात्मक बल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: और मैंने
  rationale: κἀγώ, καί और ἐγώ का संक्षिप्त रूप है। “और मैंने” पिछले कथन से संबंध और स्पष्ट कर्ता—दोनों को स्वाभाविक हिन्दी में बनाए रखता है; इसमें “मैंने भी” का योगात्मक भाव संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: δόξαν
  choice: महिमा
  rationale: यूहन्ना के सन्दर्भ में δόξα केवल मान-सम्मान नहीं, बल्कि ईश्वरीय महिमा का गहरा भाव रखता है। “महिमा” इस अर्थ और पुस्तक के भीतर शब्द-संगति को सुरक्षित रखता है।
- source_word: ἣν δέδωκάς μοι
  choice: जो आपने मुझे दी है
  rationale: सम्बन्धवाचक वाक्यांश को सहज हिन्दी में रखा गया है। पूर्णकाल δέδωκάς के सम्पन्न कार्य और उसके वर्तमान परिणाम को “दी है” व्यक्त करता है।
- source_word: δέδωκα αὐτοῖς
  choice: उन्हें ... दी है
  rationale: पूर्णकाल δέδωκα को “दी है” कहना सम्पन्न दान के बने रहने वाले परिणाम को दर्शाता है; “उन्हें” स्वाभाविक अप्रत्यक्ष कर्म है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम प्रस्तुत करता है; “ताकि” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὦσιν
  choice: वे ... हों
  rationale: ἵνα के साथ वर्तमान सम्भावनार्थक क्रिया को हिन्दी के “हों” से व्यक्त किया गया है, जो अभिप्रेत उद्देश्य/परिणाम को बनाए रखता है।
- source_word: ἓν
  choice: एक
  rationale: नपुंसकलिंग एकवचन का संक्षिप्त रूप “एक” रखा गया है। “एकजुट” अर्थ की व्याख्या कर देता, जबकि मूल पाठ एकता के स्वरूप को खुला छोड़ता है।
- source_word: καθὼς
  choice: ठीक जैसे
  rationale: “ठीक जैसे” तुलना को स्पष्ट करता है और καθὼς के बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡμεῖς ἕν
  choice: हम एक हैं
  rationale: यूनानी में दूसरी बार क्रिया निहित है; हिन्दी में स्पष्टता के लिए “हैं” आवश्यक है। यह वाक्यांश तुलना को बनाए रखता है, पर एकता के स्वरूप की अतिरिक्त व्याख्या नहीं करता।
theological_decisions:
- issue: विश्वासियों की एकता और पिता-पुत्र की एकता के बीच तुलना का स्वरूप
  choice: “ताकि वे एक हों, ठीक जैसे हम एक हैं” के रूप में सीधी तुलना को बनाए रखा गया है।
  alternative: इसे केवल सम्बन्धपरक, दैवी जीवन में सहभागिता, या संस्थागत/कलीसियाई एकता के रूप में स्पष्ट किया जा सकता था।
  rationale: पद शिष्यों की एकता और पिता-पुत्र की एकता के बीच वास्तविक तुलना करता है, पर यहाँ उस तुलना के सटीक स्वरूप को परिभाषित नहीं करता। इसलिए अनुवाद इस धार्मिक तनाव और वास्तविक अस्पष्टता को बिना किसी विशेष सिद्धान्त को आरोपित किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पिता को सम्बोधित करते हुए “आपने” प्रयोग किया गया है। वाक्य का क्रम हिन्दी की स्वाभाविकता के अनुसार है, जबकि मूल के पूर्णकाल, उद्देश्य और संक्षिप्त ‘एक’ को सुरक्षित रखा गया है।
