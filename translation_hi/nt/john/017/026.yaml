id: JHN.17.26
reference: John 17:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγνώρισα αὐτοῖς τὸ ὄνομά σου καὶ γνωρίσω, ἵνα ἡ ἀγάπη ἣν ἠγάπησάς με ἐν αὐτοῖς ᾖ κἀγὼ ἐν αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/026.yaml
  text: And I made your name known to them[a], and I will make it known, so that the love with which you loved me may be in them[c][b], and I in them.
translation:
  language: hi
  text: और मैंने उन्हें तुम्हारा नाम प्रकट किया है[a], और आगे भी प्रकट करूँगा, ताकि वह प्रेम, जिससे तुमने मुझसे प्रेम किया, उनमें हो[b]—और मैं भी उनमें होऊँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारा नाम” केवल किसी संबोधन को नहीं, बल्कि परमेश्वर की प्रकट पहचान और चरित्र को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: “उनमें” का अनुवाद “उनके बीच” भी हो सकता है; यहाँ “उनमें” यूहन्ना में पाए जाने वाले अन्तर्वास के भाव को अधिक निकटता से बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγνώρισα
  choice: मैंने ... प्रकट किया है
  rationale: γνωρίζω का अर्थ किसी को ज्ञात कराना है। हिन्दी में “नाम प्रकट किया” स्वाभाविक है और पूर्ण भूतकालीन कार्य की वर्तमान प्रासंगिकता को व्यक्त करता है।
- source_word: τὸ ὄνομά σου
  choice: तुम्हारा नाम
  rationale: मूल पाठ की ठोस अभिव्यक्ति “नाम” सुरक्षित रखी गई है; इसे मुख्य पाठ में “चरित्र” या “तुम कौन हो” कहकर व्याख्यायित नहीं किया गया।
- source_word: γνωρίσω
  choice: आगे भी प्रकट करूँगा
  rationale: भविष्यकाल को स्पष्ट करता है और पहले किए गए प्रकाशन की निरंतरता दिखाता है; कर्म के रूप में “नाम” पिछले खंड से समझा जाता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ ἀγάπη ἣν ἠγάπησάς με
  choice: वह प्रेम, जिससे तुमने मुझसे प्रेम किया
  rationale: सम्बन्धवाचक संरचना और पिता द्वारा पुत्र से किए गए प्रेम को यथासंभव निकटता से बनाए रखता है।
- source_word: ἐν αὐτοῖς ᾖ
  choice: उनमें बना रहे
  rationale: ἐν का सीधा अर्थ “में” रखा गया है। “बना रहे” वर्तमान subjunctive की सतत उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κἀγὼ ἐν αὐτοῖς
  choice: और मैं भी उनमें बना रहूँ
  rationale: यूनानी की लुप्त क्रिया को हिन्दी में स्पष्ट किया गया है, जबकि प्रेम और यीशु की अन्तर्वास-संबंधी उपस्थिति को समन्वित रखा गया है।
theological_decisions:
- issue: यूहन्ना के सन्दर्भ में “तुम्हारा नाम” का अर्थ
  choice: मुख्य पाठ में “तुम्हारा नाम” बनाए रखना
  alternative: “तुम्हारा चरित्र” अथवा “तुम कौन हो”
  rationale: यह अभिव्यक्ति परमेश्वर की प्रकट पहचान और चरित्र को समेटती है, पर मूल पाठ स्वयं “नाम” कहता है। शाब्दिक बिम्ब बनाए रखने से उसकी धर्मवैज्ञानिक गहराई खुली रहती है।
- issue: प्रेम और मसीह के अन्तर्वास का पारस्परिक सम्बन्ध
  choice: दोनों को उद्देश्यवाचक खंड के समन्वित परिणामों के रूप में रखना
  alternative: एक को दूसरे का कारण या अधीन परिणाम बताना
  rationale: यूनानी पाठ दोनों वास्तविकताओं को साथ रखता है, पर उनके बीच कारणात्मक सम्बन्ध स्पष्ट नहीं करता; अनुवाद उस तनाव को नहीं सुलझाता।
- issue: ἐν αὐτοῖς का स्थानगत/समुदायगत अर्थ
  choice: “उनमें”
  alternative: “उनके बीच”
  rationale: “उनमें” अधिक सीधा अनुवाद है और यूहन्ना में अन्तर्वास की धारणा को सुरक्षित रखता है, यद्यपि समुदायगत अर्थ की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। “प्रकट किया है/करूँगा” समानांतर क्रियाओं को बनाए रखता है। अन्तिम खंड में हिन्दी की स्पष्टता के लिए निहित क्रिया दोहराई गई है और “बना रहे/बना रहूँ” से सतत अन्तर्वास का भाव व्यक्त किया गया है।
