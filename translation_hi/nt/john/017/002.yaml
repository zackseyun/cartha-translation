id: JHN.17.2
reference: John 17:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθὼς ἔδωκας αὐτῷ ἐξουσίαν πάσης σαρκός, ἵνα πᾶν ὃ δέδωκας αὐτῷ ⸀δώσῃ αὐτοῖς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/002.yaml
  text: just as you gave him authority over all flesh[a], so that to all whom you have given him[b], he may give eternal life.
translation:
  language: hi
  text: ठीक वैसे ही जैसे आपने उसे सभी मनुष्यों पर[a] अधिकार दिया, ताकि वह उन सबको, जिन्हें आपने उसे दिया है,[b] अनन्त जीवन दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘समस्त देह पर’; यह बाइबिल में सभी मनुष्यों के लिए प्रयुक्त एक मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘वह सब जो आपने उसे दिया है’; यूनानी में पिता द्वारा पुत्र को दिए गए लोगों के लिए नपुंसकलिंग एकवचन का सामूहिक पदबंध प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह पिछले पद की विनती और यहाँ बताए गए अधिकार के बीच तुलना तथा अनुरूपता को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἔδωκας
  choice: आपने ... दिया
  rationale: अओरिस्ट क्रिया को यहाँ साधारण भूतकाल में रखा गया है; यह पिता द्वारा पुत्र को अधिकार सौंपे जाने को दर्शाती है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि सौंपे गए वैध अधिकार और कार्यक्षेत्र का भाव व्यक्त करता है।
- source_word: πάσης σαρκός
  choice: सभी मनुष्यों पर
  rationale: यूनानी का शाब्दिक रूप 'समस्त देह' एक बाइबिलीय मुहावरा है जिसका आशय पूरी मानवजाति है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶν ὃ
  choice: उन सबको, जिन्हें
  rationale: यूनानी में नपुंसकलिंग एकवचन का सामूहिक प्रयोग है, पर सन्दर्भ में यह पिता द्वारा पुत्र को दिए गए लोगों की ओर संकेत करता है। हिन्दी में व्यक्तिगत सन्दर्भ को स्पष्ट रखते हुए सामूहिकता भी बचाई गई है।
- source_word: δέδωκας
  choice: आपने उसे दिया है
  rationale: पूर्णकाल किसी पूर्ण किए गए कार्य की वर्तमान तक बनी हुई प्रासंगिकता दर्शाता है।
- source_word: δώσῃ
  choice: वह ... दे
  rationale: ἵνα के बाद प्रयुक्त संभावनार्थक क्रिया उद्देश्य को व्यक्त करती है; हिन्दी का यह रूप बिना अनावश्यक अनिश्चितता जोड़े वही भाव देता है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह यूहन्ना के लेखन का मानक और स्वाभाविक धार्मिक पद है, जो कभी समाप्त न होने वाले और आने वाले युग से सम्बन्धित जीवन को व्यक्त करता है।
theological_decisions:
- issue: '''सभी मनुष्यों'' और ''उन सबको, जिन्हें आपने उसे दिया है'' का दायरा और सम्बन्ध'
  choice: पुत्र का अधिकार सभी मनुष्यों पर बताया गया है, जबकि अनन्त जीवन पाने वालों को उन लोगों के रूप में रखा गया है जिन्हें पिता ने पुत्र को दिया है।
  alternative: दोनों पदबंधों को समान दायरे का मानकर व्यापक या संकीर्ण धार्मिक निष्कर्ष को अनुवाद में ही स्पष्ट कर देना।
  rationale: यूनानी पाठ सार्वभौमिक अधिकार और पिता द्वारा पुत्र को दिए गए लोगों के बीच जो भेद और धार्मिक तनाव रखता है, अनुवाद उसे किसी सम्प्रदायगत व्यवस्था के अनुसार हल नहीं करता।
- issue: परमेश्वर को सम्बोधित करने का हिन्दी सर्वनाम
  choice: आप
  alternative: तू
  rationale: मूल यूनानी आदर-स्तर का भेद नहीं बताता। आधुनिक मानक हिन्दी में 'आप' सामान्य पाठक के लिए स्वाभाविक और सम्मानपूर्ण है तथा इससे कोई निजी धार्मिक सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। वाक्य-क्रम हिन्दी में स्वाभाविक है, जबकि अधिकार के सार्वभौमिक दायरे और अनन्त जीवन पाने वाले समूह के बीच मूल पाठ का भेद सुरक्षित रखा गया है।
