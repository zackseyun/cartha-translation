  text: ἐγώ σε ἐδόξασα ἐπὶ τῆς γῆς, τὸ ἔργον ⸀τελειώσας ὃ δέδωκάς μοι ἵνα ποιήσω·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/004.yaml
  text: I glorified you on the earth by completing the work that you have given me to do[a].
translation:
  language: hi
  text: मैंने पृथ्वी पर आपकी महिमा की, उस काम को पूरा करके जिसे आपने मुझे करने के लिए दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैंने पृथ्वी पर आपकी महिमा की और उस काम को पूरा किया जो आपने मुझे करने के लिए दिया है।’
    reason: τελειώσας कृदन्त को सहवर्ती/समन्वयी भाव से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἐδόξασα
  choice: महिमा की
  rationale: यूहन्ना के सन्दर्भ में δοξάζω परमेश्वर की महिमा प्रकट करने और उनका गौरव बढ़ाने का गहरा धर्मवैज्ञानिक अर्थ रखता है; ‘महिमा की’ इसे स्वाभाविक और पारंपरिक हिन्दी में बनाए रखता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: यह यूनानी पदबंध के स्थानवाचक अर्थ को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τελειώσας
  choice: पूरा किया
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया के साथ निकटता से जुड़ा है। हिन्दी में ‘और ... पूरा किया’ उसका सहवर्ती या साधनात्मक सम्बन्ध स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी अधिक स्पष्ट साधनात्मक पाठ देती है।
- source_word: τὸ ἔργον
  choice: उस काम को
  rationale: ‘काम’ सामान्य पाठक के लिए सहज है और यीशु को पिता द्वारा सौंपे गए कार्य के अर्थ को बनाए रखता है; ‘उस’ आगे आने वाले सम्बन्धवाचक उपवाक्य से निश्चितता स्पष्ट करता है।
- source_word: δέδωκάς μοι
  choice: आपने मुझे ... दिया था
  rationale: यूनानी पूर्णकाल पहले दिए गए काम की वर्तमान प्रासंगिकता रखता है। हिन्दी में मुख्य क्रिया के भूतकालीन परिप्रेक्ष्य में ‘दिया था’ पूर्ववर्ती सौंपे जाने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἵνα ποιήσω
  choice: मुझे करने के लिए
  rationale: यह दिए जाने के उद्देश्य को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐγώ σε
  choice: मैंने ... आपकी
  rationale: ‘मैंने’ और ‘आपकी’ कर्ता तथा कर्म को स्पष्ट रखते हैं। अलग से ‘मैं स्वयं’ जोड़ना यूनानी सर्वनाम के बल को हिन्दी में अनावश्यक रूप से बढ़ा देता।
theological_decisions:
- issue: τελειώσας का ‘महिमा की’ से सम्बन्ध
  choice: 'मुख्य पाठ में इसे सहवर्ती क्रिया के रूप में रखा गया है: ‘महिमा की और ... पूरा किया’; पादटिप्पणी साधनात्मक सम्बन्ध ‘पूरा करके’ प्रस्तुत करती है।'
  alternative: ‘आपने मुझे जो काम करने को दिया था, उसे पूरा करके मैंने पृथ्वी पर आपकी महिमा की।’
  rationale: यूनानी कृदन्त को साधनात्मक रूप में समझना अत्यन्त सम्भावित है, पर उसमें सहवर्ती या परिस्थितिजन्य भाव भी सम्भव है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक वाक्यगत अस्पष्टता को बिना धर्मवैज्ञानिक सम्बन्ध मिटाए सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को सम्बोधित करते हुए आदरसूचक ‘आप’ का प्रयोग। भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है।
