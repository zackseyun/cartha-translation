source:
  edition: SBLGNT
  text: ⸀Πάτερ δίκαιε, καὶ ὁ κόσμος σε οὐκ ἔγνω, ἐγὼ δέ σε ἔγνων, καὶ οὗτοι ἔγνωσαν ὅτι σύ με ἀπέστειλας,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/025.yaml
  text: Righteous Father[a], though the world has not known you, I have known you[b], and these have known that you sent me.
translation:
  language: hi
  text: हे धर्मी पिता, यद्यपि संसार[a] ने आपको नहीं जाना, फिर भी मैंने आपको जाना है, और इन्होंने यह जाना है[b] कि आपने मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूहन्ना में “संसार” प्रायः केवल सृष्टि नहीं, बल्कि परमेश्वर से विमुख मानवता की ओर भी संकेत करता है। आरम्भ का यूनानी संयोजक साधारण रूप से “और” भी अनूदित हो सकता है: “और संसार ने आपको नहीं जाना, पर मैंने आपको जाना है।”'
    reason: lexical_alternative
  - marker: b
    text: “नहीं जाना,” “जाना” और “यह जाना है” के लिए यूनानी में एओरिस्ट रूप हैं। इन्हें हिन्दी में प्रसंग और वर्तमान प्रासंगिकता के अनुसार सामान्य भूत तथा पूर्ण रूपों से व्यक्त किया गया है; सभी को सामान्य भूत में भी अनूदित किया जा सकता है।
    reason: grammatical_alternative
lexical_decisions:
- source_word: Πάτερ δίκαιε
  choice: हे धर्मी पिता
  rationale: सम्बोधन कारक को स्वाभाविक हिन्दी में ‘हे’ से व्यक्त किया गया है। ‘धर्मी’ δίκαιος के नैतिक और धर्मवैचारिक भार को बनाए रखता है; ‘न्यायी’ इसे केवल न्यायिक अर्थ तक सीमित कर सकता है।
- source_word: καὶ ... ἐγὼ δέ
  choice: यद्यपि ... फिर भी मैंने
  rationale: यह रचना संसार के न जानने और यीशु के जानने के बीच स्पष्ट विरोध को स्वाभाविक हिन्दी में व्यक्त करती है। पहले καὶ का साधारण ‘और’ भी सम्भव है, पर सन्दर्भ में रियायती भाव अधिक सहज है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्ना में κόσμος का व्यापक और बहुस्तरीय अर्थ सुरक्षित रहता है; इसे मुख्य पाठ में ‘संसार के लोग’ या ‘परमेश्वर-विरोधी व्यवस्था’ कहकर सीमित नहीं किया गया।
- source_word: ἔγνω / ἔγνων / ἔγνωσαν
  choice: नहीं जाना / जाना है / जान लिया है
  rationale: 'तीनों यूनानी क्रियाएँ एओरिस्ट हैं, पर हिन्दी में प्रसंगानुकूल पक्ष का प्रयोग किया गया है: संसार की असफलता के लिए सामान्य भूत, और वर्तमान प्रासंगिकता रखने वाले ज्ञान के लिए पूर्ण रूप। इससे सम्बन्धपरक ‘जानना’ भी बना रहता है।'
- source_word: οὗτοι
  choice: इन्होंने
  rationale: सम्मानसूचक निकटवाची सर्वनाम मूल के संकेतवाची भाव को बनाए रखता है और मुख्य पाठ में ‘चेले’ जैसा व्याख्यात्मक संज्ञा-पद नहीं जोड़ता।
- source_word: σύ με ἀπέστειλας
  choice: आपने मुझे भेजा है
  rationale: पूर्ण रूप प्रार्थना के वर्तमान प्रसंग में भेजे जाने के स्थायी महत्व को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δίκαιε में पिता के गुण का अनुवाद
  choice: धर्मी पिता
  alternative: न्यायी पिता
  rationale: ‘धर्मी’ नैतिक सत्यता और उचितता की व्यापकता को बनाए रखता है, जबकि ‘न्यायी’ पाठक को मुख्यतः न्याय करने की भूमिका की ओर ले जा सकता है।
- issue: यूहन्ना के प्रसंग में κόσμος का अर्थ
  choice: संसार
  alternative: संसार के लोग
  rationale: मूल शब्द में सृष्टि, मानव-जगत और परमेश्वर से विमुख मानवता की परतें हो सकती हैं; ‘संसार’ इस धर्मवैचारिक तनाव को बिना संकुचित किए सुरक्षित रखता है।
- issue: γινώσκω के एओरिस्ट रूपों का काल-पक्ष
  choice: प्रसंगानुकूल सामान्य भूत और पूर्ण रूप
  alternative: 'सभी जगह सामान्य भूत: ‘नहीं जाना / मैंने जाना / इन्होंने जाना’'
  rationale: यूनानी एओरिस्ट को हिन्दी में हर जगह एक ही भूतकाल से बाँधना आवश्यक नहीं। चुने हुए रूप यीशु और शिष्यों के ज्ञान की वर्तमान प्रासंगिकता स्पष्ट करते हैं, फिर भी घटना को अनावश्यक रूप से प्रगतिशील नहीं बनाते।
- issue: पहले καὶ का वाक्यगत सम्बन्ध
  choice: यद्यपि ... फिर भी
  alternative: और संसार ने आपको नहीं जाना, पर मैंने आपको जाना
  rationale: प्रसंग में रियायती-विरोधी सम्बन्ध प्रबल है, पर साधारण समन्वय भी व्याकरणतः सम्भव है; इसलिए वैकल्पिक पठन को टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और प्रार्थनात्मक है। परमपिता के लिए ‘आप’ का प्रयोग साधारण आधुनिक हिन्दी में गरिमा और स्वाभाविकता बनाए रखता है। ‘हे’ स्पष्ट सम्बोधन के लिए रखा गया है, जबकि शेष वाक्य अनावश्यक रूप से पुरातन नहीं बनाया गया।
