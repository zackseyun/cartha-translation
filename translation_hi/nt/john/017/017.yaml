base_translation:
  language: en
  yaml_path: translation/nt/john/017/017.yaml
  text: Sanctify them in the truth[a]; your word is truth.
translation:
  language: hi
  text: उन्हें सत्य में पवित्र कीजिए; आपका वचन सत्य है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘आपका वचन ही सत्य है’ भी किया जा सकता है। यूनानी में विधेय ‘सत्य’ के साथ उपपद नहीं है; इससे पहचान की अपेक्षा गुण पर बल हो सकता है—अर्थात् ‘वचन सत्य-स्वरूप है।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἁγίασον
  choice: पवित्र कीजिए
  rationale: यह ἁγιάζω का आज्ञार्थक रूप है और समर्पित करने तथा पवित्र बनाने—दोनों अर्थ-छायाओं को बनाए रखता है। आदरसूचक रूप आधुनिक हिन्दी में पिता परमेश्वर से सीधे संबोधन के अनुरूप स्वाभाविक और गरिमापूर्ण है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह कर्मकारक बहुवचन सर्वनाम है, जिसका संदर्भ शिष्यों से है; ‘उन्हें’ इसका सहज हिन्दी रूप है।
- source_word: ἐν τῇ ἀληθείᾳ
  choice: सत्य में
  rationale: ἐν के स्थानवाचक और साधनवाचक दोनों संभावित भावों को खुला रखता है। ‘सत्य के द्वारा’ केवल साधन के अर्थ को निश्चित कर देता, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- source_word: λόγος
  choice: वचन
  rationale: यहाँ λόγος परमेश्वर द्वारा कहे और प्रकट किए गए संदेश को सूचित करता है। ‘वचन’ यूहन्ना के संदर्भ में अर्थपूर्ण, परिचित और पाठ के निकट है।
- source_word: ὁ σὸς
  choice: आपका
  rationale: संबंधसूचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप। ‘आपका’ आधुनिक आदरसूचक संबोधन बनाए रखता है; यूनानी सर्वनाम स्वयं हिन्दी के आदर-स्तर को निर्धारित नहीं करता।
- source_word: ἀλήθειά ἐστιν
  choice: सत्य है
  rationale: 'विधेय संज्ञा ἀλήθεια के सारगुणात्मक बल को बनाए रखता है: परमेश्वर का वचन सत्य-स्वरूप है। हिन्दी में उपपद न होने के कारण यह रूप यूनानी के निश्चित और गुणात्मक भावों के बीच अनावश्यक रूप से कठोर भेद नहीं बनाता।'
theological_decisions:
- issue: दूसरे उपवाक्य में ἀλήθεια को गुणात्मक मानना या निश्चित पहचान के रूप में व्यक्त करना
  choice: आपका वचन सत्य है
  alternative: आपका वचन ही सत्य है
  rationale: यूनानी में विधेय ἀλήθεια के साथ उपपद नहीं है, जिससे गुणात्मक अर्थ प्रमुख हो सकता है। ‘ही’ जोड़ने से एक विशेष बल अथवा अनन्यता स्पष्ट हो जाती है जो यूनानी रूप में प्रत्यक्ष रूप से चिह्नित नहीं है। मुख्य पाठ मूल की संक्षिप्तता और अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आदरसूचक शैली अपनाई गई है। ‘सत्य में’ मूल की स्थानवाचक/साधनवाचक व्यापकता को सुरक्षित रखता है, और ‘सत्य है’ हिन्दी में स्वाभाविक रहते हुए यूनानी की संक्षिप्तता बनाए रखता है।
