reference: John 17:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ ἐν αὐτοῖς καὶ σὺ ἐν ἐμοί, ἵνα ὦσιν τετελειωμένοι εἰς ἕν, ⸀ἵνα γινώσκῃ ὁ κόσμος ὅτι σύ με ἀπέστειλας καὶ ἠγάπησας αὐτοὺς καθὼς ἐμὲ ἠγάπησας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/023.yaml
  text: I in them and you in me[a], so that they may be perfected into one, so that the world may know that you sent me and loved them just as you loved me.
translation:
  language: hi
  text: मैं उनमें और आप मुझमें, ताकि वे एकता में पूर्ण किए जाएँ[a], ताकि संसार जाने कि आपने मुझे भेजा और उनसे वैसा ही प्रेम किया जैसा आपने मुझसे प्रेम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक बनाकर पूर्णता तक पहुँचाए जाएँ’ या ‘एकता में परिपूर्ण किए जाएँ।’
    reason: ‘पूर्ण किए जाएँ’ के लिए वैकल्पिक अनुवाद; ये τετελειωμένοι के पूर्णता/परिणति के अर्थ और εἰς ἕν के एकता-लक्ष्य को अलग-अलग ढंग से व्यक्त करते हैं।
lexical_decisions:
- source_word: ἐν αὐτοῖς / ἐν ἐμοί
  choice: उनमें / मुझमें
  rationale: ‘में’ यूहन्ना के परस्पर निवास के महत्त्वपूर्ण भाव को बनाए रखता है; ‘उनके बीच’ इस अर्थ को कमजोर कर देता।
- source_word: τετελειωμένοι
  choice: पूर्ण किए जाएँ
  rationale: पूर्ण निष्क्रिय कृदंत ऐसी अवस्था दिखाता है जो पूर्ण किए जाने की क्रिया का परिणाम है। हिन्दी में यह रूप स्वाभाविक है और केवल निष्पाप नैतिक सिद्धता का अर्थ थोपे बिना पूर्णता तक पहुँचाए जाने का भाव रखता है।
- source_word: εἰς ἕν
  choice: एक होकर
  rationale: εἰς के परिणाम या लक्ष्य की दिशा को सहज हिन्दी में व्यक्त करता है—वे एकता की परिणति तक पहुँचें—न कि केवल पहले से मौजूद अवस्था में रहें।
- source_word: γινώσκῃ
  choice: जाने
  rationale: ἵνα के बाद वर्तमान संभावनार्थक क्रिया के उद्देश्यभाव को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना के प्रचलित और व्यापक प्रयोग को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἀπέστειλας
  choice: भेजा
  rationale: पिता द्वारा पुत्र को भेजे जाने के मिशन-भाव को सहज और सुसंगत रूप से व्यक्त करता है।
- source_word: ἠγάπησας
  choice: प्रेम किया
  rationale: मूल में दोनों बार आई एक ही क्रिया की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: καθὼς
  choice: वैसा ही…जैसा
  rationale: तुलना की वास्तविक शक्ति को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है, न उसे नरम करता है और न उसकी सीमा की व्याख्या जोड़ता है।
theological_decisions:
- issue: ‘उनसे वैसा ही प्रेम किया जैसा आपने मुझसे प्रेम किया’ में तुलना की शक्ति
  choice: 'तुलना को बिना नरम किए सीधे व्यक्त किया गया: ‘वैसा ही…जैसा।’'
  alternative: ‘जिस प्रकार’ अथवा व्याख्यात्मक रूप से ‘उसी प्रकार का प्रेम।’
  rationale: καθὼς वास्तविक तुलना प्रस्तुत करता है। अनुवाद पिता के विश्वासियों के प्रति प्रेम और पुत्र के प्रति प्रेम के बीच रखे गए धर्मवैज्ञानिक तनाव को यथावत रखता है।
- issue: संदर्भ में τετελειωμένοι का अर्थ
  choice: 'एकता की पूर्णता तक पहुँचाए जाने का भाव: ‘एक होकर पूर्ण किए जाएँ।’'
  alternative: ‘एक में सिद्ध किए जाएँ’ अथवा ‘एकता में पूर्ण हो जाएँ।’
  rationale: यह रूप पूर्णता और परिणति का अर्थ बनाए रखता है, पर ऐसा नहीं कहता कि विश्वासी पहले ही निरपेक्ष निष्पाप सिद्धता प्राप्त कर चुके हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरवाचक ‘आप’ के साथ प्रार्थना का गरिमापूर्ण स्वर। वाक्य की दोहरी ‘ताकि’ संरचना मूल के दोनों ἵνα उद्देश्य-वाक्यों को बनाए रखती है।
