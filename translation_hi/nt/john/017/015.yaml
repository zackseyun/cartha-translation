source:
  edition: SBLGNT
  text: οὐκ ἐρωτῶ ἵνα ἄρῃς αὐτοὺς ἐκ τοῦ κόσμου ἀλλ’ ἵνα τηρήσῃς αὐτοὺς ἐκ τοῦ πονηροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/015.yaml
  text: I am not asking that you take them out of the world[a], but that you keep them from the evil one.
translation:
  language: hi
  text: मैं यह नहीं माँगता कि तू उन्हें संसार से हटा ले, बल्कि यह कि तू उन्हें उस दुष्ट से बचाए रखे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें बुराई से बचाए रखे।” यूनानी τοῦ πονηροῦ का अर्थ “उस दुष्ट” या “बुराई”—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: मैं यह नहीं माँगता
  rationale: वर्तमानकालीन प्रार्थनात्मक निवेदन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘प्रार्थना करता’ की अपेक्षा मूल क्रिया के ‘माँगना/निवेदन करना’ अर्थ के अधिक निकट है।
- source_word: ἄρῃς
  choice: उठा ले
  rationale: αἴρω यहाँ किसी स्थान या क्षेत्र से ले जाने अथवा हटा देने के अर्थ में है। ‘संसार से उठा ले’ हिन्दी में स्पष्ट है और ἐκ की गति-सूचना बनाए रखता है।
- source_word: κόσμου
  choice: संसार
  rationale: यूहन्ना के व्यापक और कभी-कभी नैतिक रूप से भारित κόσμος को बिना अनावश्यक व्याख्या के व्यक्त करने वाला प्रचलित हिन्दी शब्द है।
- source_word: τηρήσῃς
  choice: बचाए रखे
  rationale: τηρέω के रक्षा, संभाल और सुरक्षित रखने के अर्थ को सहज हिन्दी में व्यक्त करता है; केवल ‘रखे’ अस्पष्ट होता और ‘रक्षा करे’ उसके सतत संरक्षण के भाव को कुछ कम व्यक्त करता।
- source_word: ἐκ
  choice: से
  rationale: τηρέω ... ἐκ के साथ हानि या शत्रु से संरक्षण का भाव है; हिन्दी में ‘से बचाए रखे’ स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: τοῦ πονηροῦ
  choice: उस दुष्ट
  rationale: सविशेषण यूनानी रूप पुल्लिंग (‘दुष्ट जन/दुष्ट’) अथवा नपुंसकलिंग (‘बुराई’) हो सकता है। यूहन्नाई प्रयोग व्यक्तिगत दुष्ट की ओर झुकता है; ‘उस दुष्ट’ व्यक्तिगत संदर्भ रखता है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: τοῦ πονηροῦ व्यक्तिगत ‘दुष्ट’ है या अवैयक्तिक ‘बुराई’
  choice: उस दुष्ट
  alternative: बुराई
  rationale: यूनानी व्याकरण दोनों अर्थों की अनुमति देता है। यूहन्नाई साहित्य और संरक्षण के इस संदर्भ में व्यक्तिगत अर्थ अधिक संभावित है, पर वैकल्पिक अवैयक्तिक अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की धर्मवैचारिक अस्पष्टता बनी रहे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रार्थना में पिता को संबोधन के संदर्भ के अनुरूप एकवचन ‘तू’ रखा गया है। मुख्य पाठ व्यक्तिगत अर्थ को अपनाता है, जबकि पादटिप्पणी मूल यूनानी की वास्तविक अस्पष्टता सुरक्षित रखती है।
