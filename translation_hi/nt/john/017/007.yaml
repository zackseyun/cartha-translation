  text: νῦν ἔγνωκαν ὅτι πάντα ὅσα ⸀δέδωκάς μοι παρὰ σοῦ ⸀εἰσιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/007.yaml
  text: Now they have come to know that everything you have given me is from you[a].
translation:
  language: hi
  text: अब वे जान गए हैं कि जो कुछ तूने मुझे दिया है, वह सब तुझसे है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कुछ तूने मुझे दिया है, वह सब तुझसे आता है।”
    reason: παρὰ σοῦ εἰσιν को स्थिर स्रोत (‘तुझसे है’) अथवा स्रोत से आने (‘तुझसे आता है’) के रूप में स्वाभाविक हिन्दी में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: νῦν
  choice: अब
  rationale: यह कालवाचक क्रियाविशेषण शिष्यों की समझ की वर्तमान अवस्था को दिखाता है; ‘अब’ संक्षिप्त और स्वाभाविक है।
- source_word: ἔγνωκαν
  choice: वे जान गए हैं
  rationale: γινώσκω का पूर्णकाल पहले प्राप्त हुई समझ और उससे बनी वर्तमान स्थिति—दोनों को व्यक्त करता है; ‘जान गए हैं’ इस परिणामात्मक भाव को सहज हिन्दी में रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस विषय-वस्तु का परिचय देने वाला सामान्य समुच्चयबोधक है जिसे वे जान गए हैं।
- source_word: πάντα ὅσα
  choice: जो कुछ … वह सब
  rationale: यह हिन्दी संरचना यूनानी के व्यापक तथा सम्बन्धवाचक दोनों भावों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: δέδωκάς μοι
  choice: तूने मुझे दिया है
  rationale: पूर्णकाल दिए जाने की क्रिया और उसके बने हुए महत्व को व्यक्त करता है; हिन्दी पूर्ण रूप ‘दिया है’ इसे बनाए रखता है।
- source_word: παρὰ σοῦ
  choice: तुझसे
  rationale: παρά के साथ सम्बन्धकारक यहाँ स्रोत या उद्गम बताता है; ‘तुझसे’ इस अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: εἰσιν
  choice: है
  rationale: यूनानी में क्रिया बहुवचन है, पर हिन्दी में सम्बन्धवाचक-नित्यसम्बन्धी रचना ‘जो कुछ … वह सब’ के साथ विधेय ‘तुझसे है’ स्वाभाविक एकवचन रूप लेता है।
theological_decisions:
- issue: पिता द्वारा पुत्र को दी गई वस्तुओं और उनके स्रोत का सम्बन्ध
  choice: ‘जो कुछ तूने मुझे दिया है, वह सब तुझसे है’ के रूप में स्रोत का कथन
  alternative: ‘जो कुछ तूने मुझे दिया है, वह सब तुझसे आता है’
  rationale: पाठ पिता को उस सबका स्रोत बताता है जो पुत्र को दिया गया है। अनुवाद इस दावे को बनाए रखता है, पर उसे बाद की धर्मवैज्ञानिक व्याख्या से नहीं फैलाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यूहन्ना 17 की प्रत्यक्ष प्रार्थना के अनुरूप परमेश्वर के लिए निकट संबोधन ‘तू’ रखा गया है; यह अनादर नहीं, प्रार्थनात्मक आत्मीयता व्यक्त करता है।
