source:
  edition: SBLGNT
  text: ὅτι τὰ ῥήματα ἃ ⸀ἔδωκάς μοι δέδωκα αὐτοῖς, καὶ αὐτοὶ ἔλαβον καὶ ἔγνωσαν ἀληθῶς ὅτι παρὰ σοῦ ἐξῆλθον, καὶ ἐπίστευσαν ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/008.yaml
  text: For the words that you gave me I have given to them[a], and they received them and truly came to know that I came from you[b], and they believed that you sent me.
translation:
  language: hi
  text: क्योंकि जो वचन आपने मुझे दिए, वे मैंने उन्हें दिए हैं। उन्होंने उन्हें ग्रहण किया और सचमुच जान लिया कि मैं आपसे आया हूँ,[b] और उन्होंने विश्वास किया कि आपने ही मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “मैं आपसे निकलकर आया हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥήματα
  choice: वचन
  rationale: यह बहुवचन में बोले गए शब्दों या कथनों को दर्शाता है। ‘वचन’ इस ठोस बहुवचन अर्थ और प्रसंग की गरिमा को बनाए रखता है; अधिक व्याख्यात्मक एकवचन ‘संदेश’ से बचा गया है।
- source_word: ἔδωκάς ... δέδωκα
  choice: दिए ... दे दिए हैं
  rationale: पहली क्रिया को साधारण पूर्ण भूतकाल और दूसरी को वर्तमान परिणाम सहित पूर्ण क्रिया के रूप में व्यक्त किया गया है, जिससे यूनानी अओरिस्ट और परफेक्ट के बीच का पक्षगत अंतर यथासंभव बना रहता है।
- source_word: ἔλαβον
  choice: ग्रहण किया
  rationale: यह दी गई बात को प्राप्त करने और अपनाने का भाव रखता है। ‘ग्रहण किया’ प्रसंग में स्वाभाविक है और केवल भौतिक ‘ले लिया’ से अधिक उपयुक्त है, पर ‘स्वीकार किया’ जितना व्याख्यात्मक नहीं।
- source_word: ἔγνωσαν ἀληθῶς
  choice: सचमुच जान लिया
  rationale: ‘जान लिया’ प्राप्त हुई समझ या पहचान को व्यक्त करता है, जबकि ‘सचमुच’ ἀληθῶς को बिना ‘निश्चयपूर्वक’ जैसी अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: παρὰ σοῦ ἐξῆλθον
  choice: मैं आपकी ओर से आया हूँ
  rationale: παρά के साथ यह अभिव्यक्ति स्रोत या उद्गम को दर्शाती है। आधुनिक हिन्दी में ‘आपकी ओर से आया हूँ’ स्वाभाविक है और कथन का धर्मवैज्ञानिक भार बनाए रखता है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: इसके बाद ὅτι-वाक्य आता है, इसलिए यह किसी कथन को सत्य मानने का सीधा अर्थ देता है; ‘भरोसा रखा’ वाक्य-संरचना का बल बदल देता।
- source_word: ἀπέστειλας
  choice: भेजा
  rationale: यह पिता द्वारा यीशु को भेजे जाने को सीधे और पर्याप्त गंभीरता से व्यक्त करता है, बिना ‘नियुक्त किया’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: σύ
  choice: आपने ही
  rationale: 'व्यक्त सर्वनाम σύ के बल को हिन्दी के ‘ही’ से व्यक्त किया गया है: भेजने वाला पिता ही है।'
- source_word: ὅτι
  choice: क्योंकि
  rationale: आरम्भिक ὅτι पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: παρὰ σοῦ ἐξῆλθον में यीशु और पिता का संबंध
  choice: मैं आपकी ओर से आया हूँ
  alternative: मैं आपसे निकलकर आया हूँ
  rationale: मुख्य पाठ स्रोत या उद्गम के कथन को स्वाभाविक हिन्दी में रखता है, पर बाद की धर्मवैज्ञानिक शब्दावली आरोपित नहीं करता। अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ὅτι-वाक्य के साथ πιστεύω का अनुवाद
  choice: विश्वास किया कि
  alternative: भरोसा किया कि
  rationale: यहाँ विश्वास का व्याकरणिक विषय एक कथन है—‘कि आपने मुझे भेजा है’—इसलिए ‘विश्वास किया कि’ संरचना और अर्थ दोनों को सीधे बनाए रखता है।
- issue: व्यक्त सर्वनाम σύ का बल
  choice: आपने ही मुझे भेजा है
  alternative: आपने मुझे भेजा है
  rationale: यूनानी में कर्ता सर्वनाम स्पष्ट रूप से आया है और बलसूचक है; ‘ही’ उस बल को व्यक्त करता है, बिना भेजे जाने के अर्थ में कुछ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। पिता को संबोधन में आदरसूचक ‘आप’ रखा गया है। ‘वचन’ और ‘ग्रहण किया’ बाइबलीय प्रसंग की गरिमा बनाए रखते हैं, पर वाक्य-विन्यास समकालीन हिन्दी का है।
