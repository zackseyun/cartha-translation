id: JHN.17.1
reference: John 17:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ⸂ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ εἰς τὸν οὐρανὸν εἶπεν⸃· Πάτερ, ἐλήλυθεν ἡ ὥρα· δόξασόν σου τὸν υἱόν, ⸀ἵνα ὁ ⸀υἱὸς δοξάσῃ σέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/001.yaml
  text: 'Jesus said these things, and lifting up his eyes to heaven, he said: “Father, the hour has come. Glorify your Son, so that the Son may glorify you,”'
translation:
  language: hi
  text: यीशु ने ये बातें कहीं और अपनी आँखें स्वर्ग की ओर उठाकर कहा, “पिता, वह घड़ी आ गई है। अपने पुत्र की महिमा कर, ताकि पुत्र तेरी महिमा करे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पहले के उपदेश की बातों की ओर संकेत करता है; ‘ये बातें’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ἐλάλησεν
  choice: कहीं
  rationale: λαλέω का मूल भाव बोलना है, पर ‘ये बातें’ कर्म के साथ हिन्दी में ‘कहीं’ अधिक स्वाभाविक है।
- source_word: ἐπάρας τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: अपनी आँखें ... उठाकर
  rationale: एओरिस्ट कृदन्त और उसके कर्म को हिन्दी की पूर्वकालिक क्रिया-रचना में रखा गया है; इससे शारीरिक भाव स्पष्ट रहता है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: εἰς यहाँ दिशा प्रकट करता है; ‘की ओर’ इस गतिशील दिशा को स्पष्ट रूप से व्यक्त करता है।
- source_word: Πάτερ
  choice: पिता
  rationale: सम्बोधन में कोई स्वत्ववाचक सर्वनाम नहीं है, इसलिए ‘मेरे पिता’ नहीं जोड़ा गया।
- source_word: ἐλήλυθεν ἡ ὥρα
  choice: वह घड़ी आ गई है
  rationale: पूर्णकाल नियुक्त घड़ी के निर्णायक रूप से आ पहुँचने को व्यक्त करता है। ‘घड़ी’ यूहन्ना की विषयगत भाषा को बनाए रखती है; ‘वह’ निश्चित लेख और पूर्वपरिचित घड़ी के भाव को सहज हिन्दी में दर्शाता है।
- source_word: δόξασόν
  choice: महिमा कर
  rationale: δοξάζω यूहन्ना में सम्मान, प्रकाशन और महिमा के गहरे अर्थ रखता है; ‘महिमा कर’ इस प्रमुख धार्मिक पदावली और समानांतरता को बचाता है।
- source_word: σου τὸν υἱόν
  choice: अपने पुत्र
  rationale: स्वत्ववाचक सम्बन्ध को हिन्दी में कर्ता-सापेक्ष ‘अपने’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रयोजन अथवा परिणाम की धारा आरम्भ करता है; ‘ताकि’ आधुनिक हिन्दी में स्पष्ट है और प्रयोजन-बल बनाए रखता है।
- source_word: ὁ υἱὸς
  choice: पुत्र
  rationale: दूसरी बार पद विषय के रूप में आता है। हिन्दी में ‘पुत्र’ स्पष्ट रूप से उसी पुत्र को संदर्भित करता है; अनावश्यक ‘वह पुत्र’ वाक्य को भारी बनाता।
- source_word: δοξάσῃ σέ
  choice: तेरी महिमा करे
  rationale: ἵνα के बाद विधिलिंग का प्रयोजन हिन्दी में ‘ताकि ... करे’ से स्वाभाविक रूप से व्यक्त होता है। ‘तेरी’ एकवचन निकट सम्बोधन के अनुरूप है।
theological_decisions:
- issue: पिता और पुत्र द्वारा परस्पर महिमा किए जाने का निरूपण
  choice: “अपने पुत्र की महिमा कर, ताकि पुत्र तेरी महिमा करे”
  alternative: “अपने पुत्र का सम्मान कर, ताकि वह तेरा सम्मान करे”
  rationale: मूल में दोनों बार एक ही δοξάζω धातु है। ‘महिमा’ की पुनरावृत्ति पारस्परिकता और यूहन्ना के धार्मिक भार को बनाए रखती है, बिना उसका अर्थ विस्तार से समझाए।
- issue: ‘पुत्र’ का लेखन
  choice: पुत्र
  alternative: पुत्र (विशेष रूप से बड़े अक्षर द्वारा चिह्नित)
  rationale: देवनागरी में बड़े और छोटे अक्षरों का भेद नहीं होता। प्रसंग स्वयं स्पष्ट करता है कि यहाँ यीशु के लिए सम्बन्धपरक और मसीही उपाधि प्रयुक्त है।
- issue: पिता के लिए सम्बोधन-सर्वनाम
  choice: तेरी
  alternative: आपकी
  rationale: यूनानी में एकवचन सम्बोधन है और हिन्दी बाइबलीय प्रार्थना-भाषा में ‘तू/तेरा’ निकट, प्रत्यक्ष सम्बोधन व्यक्त करता है; इसे अनादर के रूप में नहीं, आत्मीय सम्बन्ध के रूप में लिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। ‘घड़ी’ और ‘महिमा’ जैसे यूहन्ना के प्रमुख शब्द सुरक्षित हैं। वाक्य की औपचारिक समरूपता रखते हुए हिन्दी क्रम और मुहावरे को स्वाभाविक बनाया गया है।
