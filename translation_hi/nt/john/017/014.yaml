id: JHN.17.14
reference: John 17:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δέδωκα αὐτοῖς τὸν λόγον σου, καὶ ὁ κόσμος ἐμίσησεν αὐτούς, ὅτι οὐκ εἰσὶν ἐκ τοῦ κόσμου καθὼς ἐγὼ οὐκ εἰμὶ ἐκ τοῦ κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/014.yaml
  text: I have given them your word[a], and the world has hated them because they are not of the world, just as I am not of the world.
translation:
  language: hi
  text: मैंने उन्हें आपका वचन दिया है, और संसार ने उनसे घृणा की है, क्योंकि वे संसार से[a] नहीं हैं, ठीक जैसे मैं संसार से नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार के नहीं हैं।” यूनानी अभिव्यक्ति का शाब्दिक अर्थ “संसार से” है और यह स्रोत या संबद्धता—दोनों का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δέδωκα
  choice: दिया है
  rationale: यूनानी पूर्णकाल पूरी हुई क्रिया के वर्तमान परिणाम को व्यक्त करता है; ‘दिया है’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λόγον
  choice: वचन
  rationale: यह पिता द्वारा यीशु के माध्यम से दिया गया कथन या संदेश है। ‘वचन’ यूहन्ना की शब्दावली और धार्मिक अनुगूँज को बचाता है, जबकि ‘संदेश’ अधिक व्याख्यात्मक होता।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना में यह शब्द प्रायः परमेश्वर के विरोध में खड़ी मानव-व्यवस्था को भी सूचित करता है। ‘संसार’ शब्द की व्यापकता बनाए रखता है और विरोध का भाव प्रसंग से स्पष्ट होता है।
- source_word: ἐμίσησεν
  choice: घृणा की है
  rationale: यूनानी अनिश्चित भूतकाल यहाँ घटित और अब भी प्रासंगिक शत्रुता बताता है; हिन्दी पूर्ण रूप ‘घृणा की है’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: 'यहाँ संयोजक कारण बताता है: संसार की घृणा का आधार शिष्यों का संसार से न होना है।'
- source_word: ἐκ τοῦ κόσμου
  choice: संसार से
  rationale: ἐκ स्रोत या उद्गम को दर्शाता है और साथ ही संबंध अथवा संबद्धता का भाव रख सकता है। ‘संसार से’ मूल रूपक और उसकी अर्थगत अस्पष्टता को यथासंभव सुरक्षित रखता है।
- source_word: καθὼς
  choice: ठीक जैसे
  rationale: यह शिष्यों और यीशु के संसार से संबंध के बीच स्पष्ट तुलना को व्यक्त करता है।
theological_decisions:
- issue: शिष्यों और यीशु का ‘संसार’ से संबंध
  choice: ‘वे संसार से नहीं हैं, ठीक जैसे मैं संसार से नहीं हूँ’ के रूप में तुलना को सीधे बनाए रखा गया।
  alternative: ‘वे संसार के नहीं हैं, जैसे मैं भी संसार का नहीं हूँ।’
  rationale: यह अनुवाद वास्तविक समानता को कम नहीं करता, पर ἐκ को केवल सामाजिक संबद्धता में भी नहीं बदलता और न ही पाठ से आगे बढ़कर कोई निश्चित तत्त्वमीमांसक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी अपनाई गई है। परमेश्वर को संबोधित करते समय सम्मानसूचक ‘आपका’ रखा गया है। ‘ठीक जैसे’ तुलना की स्पष्टता बनाए रखता है, और ‘संसार से’ यूहन्ना की मूल अभिव्यक्ति के तनाव को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
