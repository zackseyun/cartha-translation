  text: ἐκ τοῦ κόσμου οὐκ εἰσὶν καθὼς ἐγὼ ⸂οὐκ εἰμὶ ἐκ τοῦ κόσμου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/016.yaml
  text: They are not from the world[a], just as I am not from the world.
translation:
  language: hi
  text: वे संसार से नहीं हैं[a], जैसे मैं संसार से नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संसार के नहीं हैं।” यूनानी वाक्यांश में “से” (ἐκ) है, जो स्रोत, उत्पत्ति या संबद्धता का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: से
  rationale: ‘से’ स्रोत, उत्पत्ति या संबद्धता के ग्रीक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और उसका अर्थ केवल भौतिक रूप से बाहर होने तक सीमित नहीं करता।
- source_word: κόσμου
  choice: संसार
  rationale: ‘संसार’ यूहन्ना के व्यापक और धर्मवैज्ञानिक रूप से अर्थपूर्ण प्रयोग को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: οὐκ εἰσὶν
  choice: नहीं हैं
  rationale: यह εἰμί के निषेधात्मक वर्तमान बहुवचन का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: καθὼς
  choice: जैसे
  rationale: ‘जैसे’ शिष्यों और यीशु के बीच तुलना को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट सर्वनाम तुलना में यीशु पर दिए गए बल को बनाए रखता है।
- source_word: οὐκ εἰμὶ
  choice: नहीं हूँ
  rationale: यह εἰμί के निषेधात्मक वर्तमान प्रथम पुरुष का सटीक हिन्दी रूप है।
- source_word: ἐκ τοῦ κόσμου
  choice: संसार से
  rationale: दोनों उपवाक्यों में एक ही वाक्यांश समान रूप से रखा गया है; यह स्रोत या उत्पत्ति के भाव को सुरक्षित रखते हुए संबद्धता का अर्थ भी खुला रखता है।
theological_decisions:
- issue: यूहन्ना के धर्मविज्ञान में ‘संसार’ का अर्थ
  choice: मुख्य पाठ में केवल ‘संसार’ रखा गया है।
  alternative: ‘संसार की व्यवस्था’ या ‘पतित वर्तमान व्यवस्था’
  rationale: κόσμος यहाँ धर्मवैज्ञानिक गहराई रख सकता है, पर पद स्वयं किसी विस्तृत व्याख्या की माँग नहीं करता। सरल शब्द बनाए रखने से मूल पाठ का अर्थ-विस्तार और तनाव सुरक्षित रहता है।
- issue: ἐκ द्वारा व्यक्त स्रोत और संबद्धता
  choice: मुख्य पाठ में ‘से’, और पाद-टिप्पणी में ‘का/के’ का विकल्प
  alternative: मुख्य पाठ में ‘संसार के नहीं’
  rationale: ‘से’ ग्रीक के स्रोत या उत्पत्ति संबंधी बल को अधिक सीधे दर्शाता है, जबकि पाद-टिप्पणी संबद्धता के सम्भव भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और बोलचाल में सहज। ‘संसार’ को बिना संप्रदायगत या व्याख्यात्मक विस्तार के रखा गया है।
