source:
  edition: SBLGNT
  text: Ἐφανέρωσά σου τὸ ὄνομα τοῖς ἀνθρώποις οὓς ⸀ἔδωκάς μοι ἐκ τοῦ κόσμου. σοὶ ἦσαν κἀμοὶ αὐτοὺς ⸁ἔδωκας, καὶ τὸν λόγον σου τετήρηκαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/006.yaml
  text: I have made your name known to the men whom you gave me out of the world. They were yours, and you gave them to me, and they have kept your word.
translation:
  language: hi
  text: “मैंने आपका नाम[a] उन लोगों को प्रकट किया है जिन्हें आपने संसार में से मुझे सौंपे। वे आपके थे, और आपने उन्हें मुझे सौंपे; और उन्होंने आपके वचन का पालन किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आपका नाम” केवल बोला जाने वाला नाम नहीं, बल्कि परमेश्वर की प्रकट पहचान और चरित्र को भी सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἐφανέρωσά
  choice: प्रकट किया है
  rationale: φανερόω का अर्थ किसी को दृश्यमान या ज्ञात करना है। ‘प्रकट किया है’ नाम के प्रकाशन का भाव स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है; पूर्णतासूचक हिन्दी रूप संदर्भ में अब तक के कार्य और उसके वर्तमान परिणाम दोनों को व्यक्त करता है।
- source_word: τὸ ὄνομα
  choice: आपका नाम
  rationale: मूल पाठ के ठोस शब्द ‘नाम’ को बनाए रखा गया है। यहाँ यह केवल संबोधन नहीं, बल्कि परमेश्वर की प्रकट पहचान और चरित्र को समेटता है; इस व्यापकता को मुख्य पाठ में व्याख्यात्मक परिभाषा से सीमित नहीं किया गया।
- source_word: τοῖς ἀνθρώποις
  choice: उन लोगों पर
  rationale: ἄνθρωποι का स्वाभाविक सामूहिक अर्थ ‘लोग’ है। तत्काल संदर्भ शिष्यों का है, पर यूनानी संज्ञा स्वयं पुरुषत्व पर जोर नहीं देती। ‘पर प्रकट किया’ हिन्दी में किसी के सामने अपना स्वरूप/नाम प्रकट करने का स्वाभाविक प्रयोग है।
- source_word: οὓς ἔδωκάς μοι ἐκ τοῦ κόσμου
  choice: जिन्हें आपने संसार में से मुझे दिया
  rationale: ‘संसार में से’ ἐκ की चयन अथवा स्रोत-संबंधी छाया को बनाए रखता है और हिन्दी में ‘संसार से बाहर’ होने की स्थानगत गलतफहमी से बचाता है।
- source_word: σοὶ ἦσαν
  choice: वे आपके थे
  rationale: मूल की संक्षिप्त अधिकारसूचक संरचना को सीधे और गंभीर ढंग से रखा गया है।
- source_word: κἀμοὶ αὐτοὺς ἔδωκας
  choice: और आपने उन्हें मुझे दिया
  rationale: κἀμοί के ‘और मुझे’ भाव को स्वाभाविक हिन्दी शब्दक्रम में व्यक्त किया गया है, बिना देने के धर्मशास्त्रीय आशय को विस्तार देने के।
- source_word: τὸν λόγον σου
  choice: आपके वचन
  rationale: λόγος के लिए ‘वचन’ बाइबलीय संदर्भ में स्वाभाविक है और ‘संदेश’ या ‘शिक्षा’ से अधिक व्यापक अर्थ-संभावना बनाए रखता है।
- source_word: τετήρηκαν
  choice: पालन किया है
  rationale: τηρέω में संभालकर रखना, मानना और पालन करना सम्मिलित हो सकते हैं। इस प्रसंग में ‘वचन का पालन करना’ स्वाभाविक हिन्दी है; पूर्ण काल का ‘किया है’ उसके वर्तमान तक बने परिणाम को दर्शाता है।
theological_decisions:
- issue: यूहन्ना में ‘आपका नाम’ का अर्थ
  choice: मुख्य पाठ में ‘आपका नाम’ को बनाए रखना
  alternative: ‘आप कौन हैं’ या ‘आपका चरित्र’
  rationale: यह पद पिता की प्रकट पहचान और चरित्र की ओर संकेत करता है, फिर भी मूल पाठ ‘नाम’ कहता है। ठोस रूपक को बनाए रखने से इसकी धर्मशास्त्रीय गहराई व्याख्यात्मक पुनर्लेखन में सीमित नहीं होती।
- issue: τοῖς ἀνθρώποις का लिंग और संदर्भ
  choice: ‘उन लोगों’
  alternative: ‘उन पुरुषों’ अथवा ‘उन मनुष्यों’
  rationale: तत्काल ऐतिहासिक संदर्भ में शिष्य पुरुष हैं, पर ἄνθρωποι यहाँ सामूहिक रूप से व्यक्तियों को सूचित करता है और लिंग पर बल नहीं देता। ‘लोग’ आधुनिक हिन्दी में सबसे स्वाभाविक है और संदर्भ को नहीं बदलता।
- issue: पिता द्वारा लोगों को पुत्र को दिया जाना
  choice: देने की भाषा को ज्यों का त्यों बनाए रखना
  alternative: इसे किसी विशिष्ट पूर्वनिर्धारण, पूर्वज्ञान या मानवीय प्रत्युत्तर की प्रणाली के रूप में स्पष्ट करना
  rationale: पद स्पष्ट रूप से कहता है कि पिता ने ये लोग पुत्र को दिए, पर इस देने की पूरी धर्मशास्त्रीय प्रक्रिया नहीं समझाता। अनुवाद इस तनाव को किसी सांप्रदायिक ढाँचे में नहीं बाँधता।
- issue: τετήρηκαν का अर्थ
  choice: ‘पालन किया है’
  alternative: ‘सुरक्षित रखा है’ या अधिक शाब्दिक ‘रखा है’
  rationale: वचन के संबंध में हिन्दी में ‘पालन करना’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, यद्यपि यूनानी शब्द में संभालकर रखने की व्यापक छाया भी है; इसे पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’, और प्रार्थना के अनुरूप गंभीर किंतु सहज शैली अपनाई गई है। वाक्य-संरचना मूल के क्रम और समानांतरता के निकट है, पर अस्वाभाविक शाब्दिकता से बचती है।
