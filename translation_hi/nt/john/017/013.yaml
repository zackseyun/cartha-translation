reference: John 17:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: νῦν δὲ πρὸς σὲ ἔρχομαι, καὶ ταῦτα λαλῶ ἐν τῷ κόσμῳ ἵνα ἔχωσιν τὴν χαρὰν τὴν ἐμὴν πεπληρωμένην ἐν ⸀ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/013.yaml
  text: But now I am coming to you[b][a], and I am speaking these things in the world so that they may have my joy fulfilled in themselves.
translation:
  language: hi
  text: पर अब मैं आपके पास आ रहा हूँ, और ये बातें संसार में कह रहा हूँ, ताकि वे अपने भीतर मेरा आनन्द पूर्ण रूप से पाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νῦν δὲ
  choice: पर अब
  rationale: νῦν वर्तमान घड़ी को पहले कही बातों से अलग दिखाता है और δέ हल्का विरोध अथवा प्रसंग-परिवर्तन व्यक्त करता है; ‘पर अब’ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: πρὸς σὲ ἔρχομαι
  choice: मैं आपके पास आ रहा हूँ
  rationale: ἔρχομαι का वर्तमान रूप और πρὸς के साथ प्रयोग पिता की ओर आने को व्यक्त करता है। आदरसूचक ‘आपके’ प्रार्थना के सम्बोधन के अनुरूप है।
- source_word: ταῦτα λαλῶ
  choice: ये बातें ... कह रहा हूँ
  rationale: λαλέω यहाँ बोलने की क्रिया को व्यक्त करता है; आधुनिक हिन्दी में ‘ये बातें कह रहा हूँ’ सहज और अर्थनिष्ठ है।
- source_word: ἐν τῷ κόσμῳ
  choice: संसार में रहते हुए
  rationale: वाक्य-सन्दर्भ में यह यीशु के संसार में रहते हुए इन बातों को बोलने का संकेत देता है। ‘रहते हुए’ हिन्दी में सम्बन्ध स्पष्ट करता है, बिना κόσμος की यूहन्नाई शब्दावली खोए।
- source_word: ἵνα ἔχωσιν
  choice: ताकि वे ... भर जाएँ
  rationale: ἵνα उद्देश्य को व्यक्त करता है। यूनानी संरचना में ‘रखें/पाएँ’ के साथ पूर्ण हुई खुशी है; हिन्दी में ‘आनन्द से भर जाएँ’ उसी परिणाम को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν χαρὰν τὴν ἐμὴν
  choice: मेरे आनन्द से
  rationale: ἐμὴν आनन्द को यीशु का अपना आनन्द बताता है। ‘मेरे आनन्द’ इस स्वामित्व को स्पष्ट रखता है और इसे केवल यीशु के विषय में आनन्द नहीं बनाता।
- source_word: πεπληρωμένην ἐν ἑαυτοῖς
  choice: पूरी तरह भर जाएँ
  rationale: πληρόω का पूर्ण निष्पन्न अवस्था वाला भाव परिपूर्णता और भरपूरी दोनों समेटता है। ‘पूरी तरह भर जाएँ’ स्वाभाविक हिन्दी में शिष्यों के भीतर यीशु के आनन्द की पूर्णता व्यक्त करता है।
theological_decisions:
- issue: ‘मेरे आनन्द’ का स्वरूप
  choice: यीशु का अपना आनन्द शिष्यों में पूरी तरह उपस्थित हो
  alternative: यीशु के विषय में उनका आनन्द पूरा हो
  rationale: ἐμὴν का सबसे स्वाभाविक अर्थ यीशु का अपना आनन्द है। अनुवाद इस बात को रखता है, पर सहभागिता या एकता के विषय में पाठ से आगे कोई सिद्धान्त नहीं जोड़ता।
- issue: ἐν ἑαυτοῖς का सम्बन्ध
  choice: आनन्द की पूर्णता शिष्यों के भीतर अनुभव की जाए
  alternative: आनन्द उनके बीच सामूहिक रूप से पूर्ण हो
  rationale: बहुवचन आत्मवाचक सर्वनाम आन्तरिक अनुभव का संकेत दे सकता है, यद्यपि सामूहिक अर्थ व्याकरणतः असम्भव नहीं। मुख्य पाठ हिन्दी में स्वाभाविक आन्तरिक अर्थ व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमपिता को सम्बोधित करते हुए आदरसूचक ‘आप’ प्रयुक्त है। ‘संसार’ यूहन्ना की प्रमुख शब्दावली को बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
