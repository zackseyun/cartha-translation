revisions:
- from: पर अब मैं आपके पास आ रहा हूँ, और ये बातें संसार में रहते हुए कह रहा हूँ, ताकि वे मेरे आनन्द से पूरी तरह भर जाएँ।
  to: पर अब मैं आपके पास आ रहा हूँ, और ये बातें संसार में कह रहा हूँ, ताकि वे अपने भीतर मेरा आनन्द पूर्ण रूप से पाएँ।
  rationale: This revision restores the explicit internal sense of ἐν ἑαυτοῖς and more closely reflects the construction in which the disciples have Jesus’ joy in a fulfilled state. “संसार में” retains the Johannine term without adding an interpretive temporal phrase; the context sufficiently indicates that Jesus is speaking while in the world.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:54:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys the discourse shift, Jesus’ coming to the Father, his speaking in the world, and the purpose clause. However, “वे मेरे आनन्द से पूरी तरह भर जाएँ” recasts the Greek construction too freely: it does not explicitly retain the disciples’ having Jesus’ joy in its fulfilled state, and it leaves ἐν ἑαυτοῖς (“in/within themselves”) unexpressed.'
  naturalness: The current Hindi is generally natural and appropriately reverent. The revised wording remains modern and clear while more directly representing the Greek syntax and sense.
  terminology: “संसार” appropriately preserves Johannine κόσμος, and “आनन्द” is suitable for χαρά. The respectful “आपके” is appropriate for address to the Father. “पूर्ण रूप से” conveys the fullness denoted by πεπληρωμένην without imposing an interpretation.
  issues:
  - severity: medium
    issue: The final clause omits the explicit internal/reflexive sense of ἐν ἑαυτοῖς.
    rationale: “मेरे आनन्द से पूरी तरह भर जाएँ” says that the disciples are filled with joy, but does not state that the joy is fulfilled in/within them.
  - severity: medium
    issue: The wording changes ἔχωσιν τὴν χαρὰν ... πεπληρωμένην (“may have my joy fulfilled”) into a simple inchoative ‘may be filled.’
    rationale: The proposed revision preserves both their possession/experience of Jesus’ joy and its being brought to fullness.
  revised_text: पर अब मैं आपके पास आ रहा हूँ, और ये बातें संसार में कह रहा हूँ, ताकि वे अपने भीतर मेरा आनन्द पूर्ण रूप से पाएँ।
  revised_footnotes: []
