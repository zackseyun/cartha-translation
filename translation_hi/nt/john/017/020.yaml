id: JHN.17.20
reference: John 17:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ περὶ τούτων δὲ ἐρωτῶ μόνον, ἀλλὰ καὶ περὶ τῶν πιστευόντων διὰ τοῦ λόγου αὐτῶν εἰς ἐμέ,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/020.yaml
  text: I do not ask concerning these only[a], but also concerning those who believe in me through their word[b],
translation:
  language: hi
  text: मैं केवल इन्हीं के विषय में विनती नहीं करता, बल्कि उनके विषय में भी, जो इनके वचन[a] के द्वारा मुझ पर विश्वास करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संदेश’।
    reason: λόγος यहाँ ‘वचन’ अथवा संप्रेषित ‘संदेश’ के अर्थ में समझा जा सकता है।
lexical_decisions:
- source_word: ἐρωτῶ
  choice: विनती करता
  rationale: यूहन्ना 17 में यीशु पिता से निवेदन कर रहे हैं। ‘विनती करता’ क्रिया के निवेदनात्मक अर्थ और प्रार्थना के प्रसंग—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि केवल ‘प्रार्थना करता’ मूल क्रिया में निहित ‘माँगने’ के भाव को कुछ हद तक ढक सकता है।
- source_word: περὶ τούτων
  choice: इन्हीं के विषय में
  rationale: περί के संबंधसूचक अर्थ को ‘के विषय में’ व्यक्त करता है। ‘इन्हीं’ निकटवर्ती शिष्यों की ओर संकेत करता है, पर अनुवाद में उनकी पहचान स्पष्ट रूप से जोड़ता नहीं।
- source_word: μόνον
  choice: केवल
  rationale: यह यीशु की विनती के दायरे को सीमित करने वाले μόνον का सहज आधुनिक हिन्दी समतुल्य है।
- source_word: ἀλλὰ καὶ
  choice: बल्कि ... भी
  rationale: यह यूनानी पदबंध के विरोध और विस्तार—दोनों को बनाए रखता है।
- source_word: τῶν πιστευόντων
  choice: जो ... विश्वास करते हैं
  rationale: संज्ञात्मक वर्तमान कृदन्त का क्रियात्मक बल बना रहता है। यूनानी में भविष्यकाल नहीं है, इसलिए ‘विश्वास करेंगे’ नहीं जोड़ा गया।
- source_word: διὰ τοῦ λόγου αὐτῶν
  choice: इनके वचन के द्वारा
  rationale: διά साधन को ‘के द्वारा’ से व्यक्त करता है। λόγος के लिए ‘वचन’ औपचारिक निकटता और यूहन्नाई प्रतिध्वनि बनाए रखता है; ‘इनके’ का निकट संकेत ‘इन्हीं’ शिष्यों की गवाही से संबंध स्पष्ट करता है।
- source_word: εἰς ἐμέ
  choice: मुझ पर
  rationale: πιστεύω εἰς का हिन्दी में स्वाभाविक व्यक्तिगत विश्वास-संबंध ‘मुझ पर विश्वास करना’ है; शाब्दिक स्थानगत ‘मुझमें’ यहाँ कम स्वाभाविक और भ्रामक हो सकता है।
- source_word: Οὐ ... μόνον
  choice: केवल ... नहीं
  rationale: यूनानी निषेध और सीमासूचक संरचना को स्वाभाविक हिन्दी शब्दक्रम में सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की विनती का निकटवर्ती शिष्यों से आगे विस्तार
  choice: पाठ उन लोगों को भी समाविष्ट करता है जो शिष्यों के वचन द्वारा यीशु पर विश्वास करते हैं; उनके विश्वास का समय अनिर्दिष्ट रखा गया है।
  alternative: इसे स्पष्ट रूप से केवल भविष्य के विश्वासियों, या केवल उस समय विश्वास करने लगे एक संकुचित समूह, के रूप में प्रस्तुत करना।
  rationale: τῶν πιστευόντων वर्तमान कृदन्त है और διὰ τοῦ λόγου αὐτῶν विश्वास के माध्यम को बताता है। यह व्यापक दायरा स्वीकार करता है, पर ‘भविष्य में’ या ‘विश्वास करेंगे’ जोड़कर यूनानी की कालगत खुलावट को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘विनती’ प्रार्थना के प्रसंग के अनुकूल है; ‘वचन’ के साथ वैकल्पिक अर्थ फुटनोट में दिया गया है।
