source:
  edition: SBLGNT
  text: ⸀πάτερ, ⸀ὃ δέδωκάς μοι, θέλω ἵνα ὅπου εἰμὶ ἐγὼ κἀκεῖνοι ὦσιν μετ’ ἐμοῦ, ἵνα θεωρῶσιν τὴν δόξαν τὴν ἐμὴν ἣν ⸀δέδωκάς μοι, ὅτι ἠγάπησάς με πρὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/024.yaml
  text: Father[a], I desire that those whom you have given me also may be with me where I am, so that they may see my glory that you have given me, because you loved me before the foundation of the world.
translation:
  language: hi
  text: हे पिता,[a] जिन लोगों को आपने मुझे दिया है, मेरी इच्छा है कि जहाँ मैं हूँ, वहाँ वे भी मेरे साथ हों, ताकि वे मेरी वह महिमा देखें जो आपने मुझे दी है, क्योंकि संसार की नींव डाले जाने से पहले आपने मुझसे प्रेम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शब्दशः ‘जो/वह जो आपने मुझे दिया है’ है। यह अभिव्यक्ति सामूहिक रूप से उन लोगों की ओर संकेत करती है जिन्हें पिता ने पुत्र को दिया है; इसलिए मुख्य पाठ में ‘जिन लोगों को आपने मुझे दिया है’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάτερ
  choice: हे पिता
  rationale: प्रत्यक्ष सम्बोधन को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; यूनानी में निहित न होने के कारण ‘मेरे’ नहीं जोड़ा गया।
- source_word: ὃ δέδωκάς μοι
  choice: जिन्हें आपने मुझे दिया है
  rationale: ὃ व्याकरणतः नपुंसकलिंग एकवचन है, पर यहाँ सामूहिक रूप से पिता द्वारा पुत्र को दिए गए लोगों को सूचित करता है; आगे का बहुवचन κἀκεῖνοι ὦσιν इसकी पुष्टि करता है।
- source_word: δέδωκάς
  choice: आपने ... दिया है
  rationale: पूर्ण काल किसी पूरी हुई क्रिया के वर्तमान परिणाम को दर्शाता है; हिन्दी का पूर्ण रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: θέλω
  choice: मेरी इच्छा है
  rationale: प्रार्थना के प्रसंग में प्रबल इच्छा या संकल्प का भाव बनाए रखता है, पर इसे आदेश या भविष्यकाल के रूप में नहीं दर्शाता।
- source_word: ὅπου εἰμὶ ἐγώ
  choice: जहाँ मैं हूँ
  rationale: मूल अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है; अलग से ‘मैं स्वयं’ कहना अनावश्यक रूप से भारी होता।
- source_word: κἀκεῖνοι ὦσιν μετ’ ἐμοῦ
  choice: वहाँ वे भी मेरे साथ हों
  rationale: κἀκεῖνοι के योगसूचक ‘भी’ को सुरक्षित रखते हुए स्थानवाचक सम्बन्ध को हिन्दी में स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: θεωρῶσιν
  choice: देखें
  rationale: θεωρέω का यहाँ उपयुक्त आधुनिक हिन्दी अर्थ ‘देखना’ है; प्रसंग में महिमा को प्रत्यक्ष देखने का भाव बना रहता है।
- source_word: τὴν δόξαν τὴν ἐμὴν ἣν δέδωκάς μοι
  choice: मेरी वह महिमा ... जो आपने मुझे दी है
  rationale: दोनों सम्बन्धों—महिमा का पुत्र की होना और पिता द्वारा उसे दिया जाना—को बिना समतल किए स्पष्ट रखता है।
- source_word: ὅτι ἠγάπησάς με
  choice: क्योंकि ... आपने मुझसे प्रेम किया
  rationale: ὅτι को कारणसूचक माना गया है और अतीतकालीन ἠγάπησας को सरल भूतार्थ में रखा गया है।
- source_word: πρὸ καταβολῆς κόσμου
  choice: संसार की नींव डाले जाने से पहले
  rationale: सृष्टि से पूर्व का कालबोध सुरक्षित रखते हुए καταβολή के रूपक को हिन्दी में समझने योग्य ढंग से बनाए रखता है।
theological_decisions:
- issue: पुत्र का सृष्टि से पूर्व अस्तित्व, जो पिता के पूर्व-सृष्टि प्रेम से निहित है
  choice: ‘संसार की नींव डाले जाने से पहले आपने मुझसे प्रेम किया’ के सीधे कालवाचक कथन को सुरक्षित रखा गया।
  alternative: पूर्वकालिक कथन को रूपक या केवल पूर्वनियोजन के अर्थ में व्याख्यात्मक ढंग से नरम करना।
  rationale: यूनानी पाठ सृष्टि से पहले पिता के पुत्र से प्रेम का सीधा कथन करता है; अनुवाद इसे न तो कमजोर करता है, न अतिरिक्त सिद्धान्तगत व्याख्या जोड़ता है।
- issue: प्रार्थना में θέλω का बल
  choice: ‘मेरी इच्छा है’
  alternative: ‘मैं चाहता हूँ’ अथवा ‘मेरी आज्ञा है’
  rationale: यह वास्तविक और प्रबल इच्छा को व्यक्त करता है, साथ ही प्रार्थना को आदेश में बदलने या θέλω की धर्मवैचारिक तीव्रता पहले से तय करने से बचता है।
- issue: पिता द्वारा पुत्र को दी गई महिमा और पुत्र की अपनी महिमा के बीच तनाव
  choice: ‘मेरी वह महिमा ... जो आपने मुझे दी है’
  alternative: केवल ‘आपकी दी हुई महिमा’ या केवल ‘मेरी महिमा’
  rationale: मूल पाठ दोनों बातों को साथ रखता है; अनुवाद किसी एक पर बल देकर दूसरी को लुप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, श्रद्धापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ईश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘हे पिता’ प्रार्थनात्मक सम्बोधन को गरिमा देता है; वाक्यरचना मूल के सम्बन्धों और उद्देश्यसूचक प्रवाह को बनाए रखते हुए सहज हिन्दी में है।
