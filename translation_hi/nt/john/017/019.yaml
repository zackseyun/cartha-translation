  text: καὶ ὑπὲρ αὐτῶν ἐγὼ ἁγιάζω ἐμαυτόν, ἵνα ⸂ὦσιν καὶ αὐτοὶ⸃ ἡγιασμένοι ἐν ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/019.yaml
  text: And for their sake I sanctify myself[b][a], so that they also may be sanctified in truth.
translation:
  language: hi
  text: और उनके लिए मैं अपने आपको पवित्र करता हूँ[a], ताकि वे भी सत्य में पवित्र किए गए हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने आपको अर्पित करता हूँ।” यूनानी में यहाँ वही शब्द-मूल है जो आगे “पवित्र किए गए” के लिए आया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस सत्य में”; 17:17 से तुलना करें।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπὲρ αὐτῶν
  choice: उनके लिए
  rationale: ὑπέρ के साथ संबंधकारक यहाँ लाभ या पक्ष में किए गए कार्य को व्यक्त करता है। ‘उनके लिए’ सहज हिन्दी है और अनावश्यक रूप से स्थानापन्नता का अर्थ नहीं जोड़ता।
- source_word: ἁγιάζω ἐμαυτόν
  choice: मैं अपने आपको पवित्र करता हूँ
  rationale: यह अनुवाद क्रिया ἁγιάζω को अगली उपवाक्य की ἡγιασμένοι के साथ एक ही हिन्दी मूल से जोड़ता है। संदर्भ में इसका आशय स्वयं को परमेश्वर के कार्य के लिए अर्पित या अलग करना है, नैतिक अशुद्धता से शुद्ध होना नहीं।
- source_word: ἵνα
  choice: ताकि
  rationale: ἵνα के प्रयोजनात्मक बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ αὐτοὶ
  choice: वे भी
  rationale: समावेश और बल दोनों को संक्षिप्त तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡγιασμένοι
  choice: पवित्र किए हुए हों
  rationale: पूर्ण निष्क्रिय कृदंत उस अवस्था को दिखाता है जो पवित्र किए जाने की क्रिया से उत्पन्न हुई है; ‘किए हुए हों’ इस परिणामी अवस्था को बनाए रखता है और पहली क्रिया के साथ शब्द-संबंध भी सुरक्षित रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सत्य में
  rationale: अनुच्छेदरहित यूनानी पदबंध को बिना अतिरिक्त निश्चितता जोड़े क्षेत्र या वास्तविकता के अर्थ में प्रस्तुत करता है; यूहन्ना 17:17 की प्रतिध्वनि बनी रहती है।
theological_decisions:
- issue: यीशु के स्वयं को पवित्र करने का अर्थ
  choice: यीशु शिष्यों के लिए अपने आपको परमेश्वर के उद्देश्य और मिशन हेतु अर्पित/अलग करते हैं।
  alternative: यीशु अपने आपको नैतिक रूप से अधिक पवित्र बनाते हैं।
  rationale: संदर्भ में ἁγιάζω का समर्पणात्मक अर्थ उपयुक्त है। मुख्य पाठ में एक ही शब्द-मूल की पुनरावृत्ति बचाई गई है, जबकि पादटिप्पणी अर्थ स्पष्ट करती है और नैतिक अपवित्रता से शुद्ध होने का भाव आरोपित नहीं करती।
- issue: ἐν ἀληθείᾳ का बल
  choice: सत्य में
  alternative: उस सत्य में; सत्य के द्वारा
  rationale: यूनानी में निश्चित उपपद नहीं है और ἐν साधन अथवा क्षेत्र दोनों से जुड़ सकता है। मुख्य पाठ क्षेत्र/वास्तविकता को सामने रखता है, जबकि पादटिप्पणी निकट संदर्भ के आधार पर अधिक निश्चित अर्थ की संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य-विन्यास अपनाया गया है। ‘पवित्र’ की पुनरावृत्ति मूल यूनानी के शब्द-संबंध को बनाए रखती है; ‘अर्पित’ को पादटिप्पणी में देकर संदर्भगत अर्थ स्पष्ट किया गया है।
