source:
  edition: SBLGNT
  text: ὅτε ἤμην μετ’ ⸀αὐτῶν ἐγὼ ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου ⸀ᾧ δέδωκάς μοι, ⸀καὶ ἐφύλαξα, καὶ οὐδεὶς ἐξ αὐτῶν ἀπώλετο εἰ μὴ ὁ υἱὸς τῆς ἀπωλείας, ἵνα ἡ γραφὴ πληρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/012.yaml
  text: While I was with them[a], I kept them in your name, which you have given me, and I guarded them, and not one of them perished except the son of destruction[b], so that the Scripture might be fulfilled.
translation:
  language: hi
  text: जब मैं उनके साथ था, मैं उन्हें आपके उस नाम में सुरक्षित रखता था, जो आपने मुझे दिया है, और मैंने उनकी रक्षा की। उनमें से एक भी नाश नहीं हुआ, सिवाय विनाश के पुत्र के[a], ताकि पवित्रशास्त्र की बात पूरी हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘विनाश का पुत्र’ सामी शैली की अभिव्यक्ति है; इसका अर्थ ‘विनाश से संबद्ध व्यक्ति’ भी समझा जा सकता है। पारंपरिक अनुवाद: ‘नाश का पुत्र।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε ἤμην μετ’ αὐτῶν
  choice: जब तक मैं उनके साथ था
  rationale: कालवाचक उपवाक्य और अपूर्णकाल की जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐτήρουν αὐτοὺς ἐν τῷ ὀνόματί σου
  choice: मैं उन्हें आपके उस नाम में सुरक्षित रखता था
  rationale: अपूर्णकाल की निरंतरता को ‘रखता था’ से और ἐν τῷ ὀνόματί σου की धर्मवैचारिक व्यापकता को ‘नाम में’ से बनाए रखा गया है। ‘सुरक्षित’ प्रसंग में τηρέω का भाव स्पष्ट करता है, पर इसे केवल शारीरिक सुरक्षा तक सीमित नहीं करता।
- source_word: ᾧ δέδωκάς μοι
  choice: जो आपने मुझे दिया है
  rationale: नपुंसकलिंग एकवचन संबंधवाचक सर्वनाम स्वाभाविक रूप से ‘नाम’ को विशेषित करता है; पूर्णकाल के वर्तमान-प्रभाव को ‘दिया है’ व्यक्त करता है।
- source_word: καὶ ἐφύλαξα
  choice: और मैंने उनकी रक्षा की
  rationale: φυλάσσω को पहले क्रियापद से अलग रखते हुए पहरा देने या रक्षा करने का अधिक प्रबल भाव व्यक्त किया गया है।
- source_word: οὐδεὶς ἐξ αὐτῶν ἀπώλετο
  choice: उनमें से एक भी नाश नहीं हुआ
  rationale: ἀπόλλυμι के गंभीर अर्थ को ‘नाश नहीं हुआ’ व्यक्त करता है; ‘खोया नहीं’ की तुलना में यह मात्र गुम हो जाने का आभास नहीं देता।
- source_word: ὁ υἱὸς τῆς ἀπωλείας
  choice: विनाश का पुत्र
  rationale: यूनानी में सुरक्षित सामी शैली की अभिव्यक्ति को औपचारिक निकटता के साथ रखा गया है, बिना उसे नियति या पूर्वनियोजन के स्पष्ट सिद्धान्त में बदलने के।
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: ताकि पवित्रशास्त्र की बात पूरी हो
  rationale: ἵνα के प्रयोजन/परिणाम संबंधी तनाव को ‘ताकि’ बनाए रखता है; एकवचन सलेख γραφή को स्वाभाविक हिन्दी में किसी विशिष्ट शास्त्रीय वचन की ओर संकेत करते हुए व्यक्त किया गया है।
theological_decisions:
- issue: ᾧ δέδωκάς μοι का संबंध
  choice: 'यह संबंधवाचक उपवाक्य ‘आपके नाम’ को विशेषित करता है: ‘जो आपने मुझे दिया है।’'
  alternative: 'इसे शिष्यों से संबंधित मानना: ‘जिन्हें आपने मुझे दिया है।’'
  rationale: प्रस्तुत SBLGNT पाठ में नपुंसकलिंग एकवचन ᾧ का व्याकरणिक संबंध नपुंसकलिंग एकवचन ὀνόματι से सबसे स्वाभाविक है, न कि पुल्लिंग बहुवचन αὐτούς से।
- issue: ὁ υἱὸς τῆς ἀπωλείας का अर्थ
  choice: ‘विनाश का पुत्र’—एक सामी शैली की अभिव्यक्ति, जो विनाश से विशेष संबंध या उसकी ओर अभिमुखता सूचित करती है।
  alternative: ‘वह जो विनाश के लिए ठहराया गया है’ अथवा पारंपरिक ‘नाश का पुत्र।’
  rationale: मुख्य पाठ में औपचारिक अभिव्यक्ति रखकर यह तय नहीं किया गया कि पद केवल चरित्र, अंतिम परिणाम या दैवी नियति में से किस पर बल देता है।
- issue: ἵνα में प्रयोजन और परिणाम
  choice: ‘ताकि’
  alternative: ‘जिससे’ अथवा अधिक स्पष्ट प्रयोजनवाचक विस्तार
  rationale: ἵνα के प्रयोजन/परिणाम संबंधी संभावित तनाव को बिना अतिरिक्त धर्मवैचारिक निष्कर्ष के बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘नाम में’ जैसी यूहन्ना-संबंधी धर्मवैचारिक भाषा को व्याख्यात्मक विस्तार से नहीं बदला गया। मुख्य पाठ में केवल वास्तविक पद-संबंधी टिप्पणी का चिह्न [a] रखा गया है।
