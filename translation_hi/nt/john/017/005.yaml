id: JHN.17.5
reference: John 17:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ νῦν δόξασόν με σύ, πάτερ, παρὰ σεαυτῷ τῇ δόξῃ ᾗ εἶχον πρὸ τοῦ τὸν κόσμον εἶναι παρὰ σοί.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/005.yaml
  text: And now[a], Father[b], glorify me in your presence with the glory that I had with you before the world existed.
translation:
  language: hi
  text: और अब, हे पिता, अपनी उपस्थिति में[a] मुझे उस महिमा से महिमान्वित कर, जो संसार के होने से पहले[b] तेरे पास मेरी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पास” अथवा “अपने साथ”; यूनानी पदबंध पिता के निकट या उनके सान्निध्य में होने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “संसार के अस्तित्व में आने से पहले” अथवा “संसार के अस्तित्व से पहले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόξασόν
  choice: महिमान्वित कर
  rationale: आज्ञार्थक क्रिया का सीधा बल बनाए रखते हुए यह यूहन्ना में ‘महिमा’ और ‘महिमान्वित करने’ की पारिभाषिक संगति को सुरक्षित रखता है; केवल ‘आदर दे’ कहना अर्थ को संकरा कर देता।
- source_word: παρὰ σεαυτῷ
  choice: अपनी उपस्थिति में
  rationale: παρά के साथ चतुर्थी यहाँ निकटता या सान्निध्य सूचित करती है। ‘अपनी उपस्थिति में’ स्वाभाविक हिन्दी में इस संबंधपरक और स्थानिक भाव को व्यक्त करता है।
- source_word: τῇ δόξῃ
  choice: उस महिमा से
  rationale: 'चतुर्थी को यहाँ साधन अथवा संबद्धता के अर्थ में लेना उपयुक्त है: यीशु उसी निर्दिष्ट महिमा से महिमान्वित किए जाने की विनती करते हैं।'
- source_word: ᾗ εἶχον
  choice: जो … मेरी थी
  rationale: अपूर्ण भूतकाल εἶχον पूर्वकाल में उस महिमा के यीशु के पास होने को बताता है। हिन्दी में ‘मेरी थी’ स्वाभाविक रूप से पूर्व स्वामित्व या सहभागिता व्यक्त करता है।
- source_word: πρὸ τοῦ τὸν κόσμον εἶναι
  choice: संसार के होने से पहले
  rationale: यह सव्ययी infinitive रचना पूर्ववर्ती समय व्यक्त करती है। ‘होने से पहले’ εἶναι की मूल अस्पष्टता को बनाए रखता है और अनावश्यक रूप से सृष्टि की प्रक्रिया का विवरण नहीं जोड़ता।
- source_word: παρὰ σοί
  choice: तेरे पास
  rationale: παρά के साथ चतुर्थी निकटता और संगति का भाव देती है। ‘तेरे पास’ संक्षिप्त, स्वाभाविक और पहले आए समान यूनानी पदबंध के स्थानिक-संबंधपरक भाव के अनुरूप है।
- source_word: σύ, πάτερ
  choice: हे पिता
  rationale: सम्बोधन को स्पष्ट और प्रार्थनात्मक रखा गया है। यूनानी में व्यक्त सर्वनाम का बल हिन्दी में सम्बोधन और वाक्य-विन्यास से पर्याप्त रूप से प्रकट होता है।
- source_word: κόσμον
  choice: संसार
  rationale: यूहन्ना में κόσμος के लिए ‘संसार’ मानक और प्रसंगानुकूल हिन्दी शब्द है; ‘ब्रह्मांड’ या ‘सृष्टि-व्यवस्था’ यहाँ अनावश्यक रूप से अर्थ को सीमित करेंगे।
theological_decisions:
- issue: पुत्र का संसार से पूर्व अस्तित्व
  choice: कालवाचक उपवाक्य को सीधे उस महिमा के रूप में प्रस्तुत किया गया है जो यीशु की संसार के होने से पहले पिता के पास थी।
  alternative: इसे केवल पूर्वनियोजित अथवा भावी महिमा के रूप में व्याख्यायित करना।
  rationale: यूनानी पाठ पूर्वकालिक अस्तित्व और पिता के पास महिमा होने की बात सीधे कहता है। अनुवाद इस कथन को न नरम करता है, न उससे अधिक व्याख्या जोड़ता है।
- issue: पिता के पास रही ‘महिमा’ का स्वरूप
  choice: ‘महिमा’ शब्द को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: ‘वैभव’, ‘प्रतिष्ठा’ या ‘आदर’।
  rationale: इस पद में उस महिमा का स्वरूप और अधिक परिभाषित नहीं है। ‘महिमा’ यूहन्ना की शब्दावली और मूल धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। पिता के लिए एकवचन आत्मीय ‘तू/तेरे’ का प्रयोग यीशु के सीधे सम्बोधन और निकट संबंध को दर्शाता है। ‘महिमा/महिमान्वित’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल यूनानी की शब्दगत और धर्मवैज्ञानिक संगति बनी रहे।
