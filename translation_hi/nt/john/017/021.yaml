source:
  edition: SBLGNT
  text: ἵνα πάντες ἓν ὦσιν, καθὼς σύ, ⸀πάτερ, ἐν ἐμοὶ κἀγὼ ἐν σοί, ἵνα καὶ αὐτοὶ ἐν ⸀ἡμῖν ὦσιν, ἵνα ὁ κόσμος ⸀πιστεύῃ ὅτι σύ με ἀπέστειλας.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/021.yaml
  text: that they may all be one[a], just as you, Father, are in me and I am in you; that they also may be in us[c][b], so that the world may believe that you sent me.
translation:
  language: hi
  text: कि वे सब एक हों[a], जैसे आप, हे पिता, मुझ में हैं और मैं आप में हूँ; कि वे भी हम में हों[b], ताकि संसार विश्वास करे[c] कि आपने मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कि वे सब एकजुट हों।” यूनानी में अधिक शाब्दिक रूप से “कि वे सब एक हों” है, जो एकता को किसी एक पहलू तक सीमित किए बिना उसका व्यापक अर्थ बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: बार-बार आया “में” (“मुझ में,” “आप में,” “हम में”) यूहन्ना की पारस्परिक अंतर्निवास और सहभागिता की भाषा को दर्शाता है; इसका अर्थ केवल साथ या संगति से अधिक गहरा है।
    reason: cross_reference
  - marker: c
    text: या “विश्वास करने लगे।” यूनानी को संसार के विश्वास करने के अर्थ में समझा जा सकता है, पर यह स्पष्ट रूप से तय नहीं करता कि बल विश्वास आरम्भ करने पर है या विश्वास में बने रहने पर।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: कि / ताकि
  rationale: तीन उद्देश्यसूचक उपवाक्यों की शृंखला को पहले दो स्थानों पर “कि” और अंतिम परिणाम/उद्देश्य के लिए “ताकि” से स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: πάντες
  choice: सब
  rationale: यह संक्षिप्त और स्वाभाविक रूप सार्वभौमिक दायरे को बनाए रखता है।
- source_word: ἓν
  choice: एक
  rationale: यूनानी का नपुंसकलिंग एकवचन रूप विश्वासियों की एकता का प्रकार निर्धारित नहीं करता; “एक” उसी व्यापकता और अस्पष्टता को सुरक्षित रखता है।
- source_word: καθὼς
  choice: जैसे
  rationale: यह विश्वासियों की एकता और पिता-पुत्र के संबंध के बीच तुलना को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάτερ
  choice: हे पिता
  rationale: संबोधन को स्पष्ट रखा गया है; “हे” हिन्दी में प्रत्यक्ष और गरिमापूर्ण संबोधन दर्शाता है।
- source_word: ἐν ἐμοὶ ... ἐν σοί
  choice: मुझ में ... आप में
  rationale: हर स्थान पर ἐν का “में” अनुवाद यूहन्ना की पारस्परिक अंतर्निवास और सहभागिता की भाषा को बनाए रखता है; “साथ” इसका बल घटा देता।
- source_word: κἀγώ
  choice: और मैं
  rationale: यह परस्पर संबंध के दूसरे पक्ष को सहजता से जोड़ता है।
- source_word: καὶ αὐτοὶ
  choice: वे भी
  rationale: καί के योगात्मक बल को बनाए रखते हुए विश्वासियों की सहभागिता को पिता-पुत्र के संबंध से जोड़ता है।
- source_word: ἐν ἡμῖν
  choice: हम में
  rationale: यह मूल यूनानी और यूहन्ना की सहभागिता/अंतर्निवास की भाषा को सुरक्षित रखता है; “हमारे साथ” केवल संगति का अर्थ दे सकता है।
- source_word: κόσμος
  choice: संसार
  rationale: यूहन्ना में यह स्थापित, व्यापक और धर्मवैचारिक गहराई वाला पद है।
- source_word: πιστεύῃ
  choice: विश्वास करे
  rationale: वर्तमान संभावनार्थक रूप को बिना यह तय किए व्यक्त करता है कि आशय विश्वास आरम्भ करने का है या उसमें बने रहने का।
- source_word: ἀπέστειλας
  choice: भेजा है
  rationale: हिन्दी में वर्तमान से संबद्ध पूर्ण घटना के लिए यह स्वाभाविक है और पिता द्वारा यीशु को भेजे जाने के कथन को स्पष्ट रखता है।
theological_decisions:
- issue: पिता और पुत्र के संबंध के संदर्भ में विश्वासियों की एकता का स्वरूप
  choice: ἓν को “एक” और ἐν ἡμῖν को “हम में” रखा गया है।
  alternative: “पूरी तरह एकजुट हों” या “एक उद्देश्य वाले हों”
  rationale: पाठ एकता को संगठनात्मक, नैतिक या तत्त्वमीमांसक किसी एक अर्थ तक सीमित नहीं करता। शाब्दिक रूप इसकी धर्मवैचारिक गहराई और तनाव को बनाए रखता है।
- issue: यूहन्ना की अंतर्निवास-संबंधी भाषा
  choice: “मुझ में,” “आप में,” और “हम में”
  alternative: “मेरे साथ,” “आपके साथ,” या “हमसे जुड़े हुए”
  rationale: बार-बार प्रयुक्त ἐν पारस्परिक अंतर्निवास और सहभागिता को व्यक्त करता है; व्याख्यात्मक विकल्प स्रोत की अपेक्षा अर्थ को अनावश्यक रूप से सीमित करते हैं।
- issue: πιστεύῃ में विश्वास के आरम्भ या निरंतरता का प्रश्न
  choice: “विश्वास करे”
  alternative: “विश्वास करने लगे”
  rationale: यूनानी रूप विश्वास करने को व्यक्त करता है, पर अपने आप में यह निश्चित नहीं करता कि बल विश्वास के आरम्भ पर है या उसकी निरंतरता पर।
