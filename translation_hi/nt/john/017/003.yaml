source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ αἰώνιος ζωὴ ἵνα γινώσκωσι σὲ τὸν μόνον ἀληθινὸν θεὸν καὶ ὃν ἀπέστειλας Ἰησοῦν Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/003.yaml
  text: 'And this is eternal life: that they may know you[a], the only true God, and Jesus the Messiah whom you sent.'
translation:
  language: hi
  text: और अनन्त जीवन यह है कि वे तुझे, एकमात्र सच्चे परमेश्वर को, और यीशु मसीह को, जिसे तूने भेजा, जानें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὕτη δέ ἐστιν
  choice: और ... यह है
  rationale: δέ के संयोजक बल को सहज हिन्दी में बनाए रखते हुए यह वाक्य पिछले कथन से जुड़ता और आगे स्पष्टीकरण देता है।
- source_word: ἡ αἰώνιος ζωὴ
  choice: अनन्त जीवन
  rationale: यह यूहन्ना का प्रचलित पद है, जो आने वाले युग से संबंधित और स्थायी दिव्य जीवन को व्यक्त करता है; ‘अनन्त जीवन’ सटीक, स्वाभाविक और व्यापक रूप से समझा जाने वाला हिन्दी रूप है।
- source_word: ἵνα γινώσκωσι
  choice: कि वे ... जानें
  rationale: यहाँ ἵνα अनन्त जीवन की विषय-वस्तु बताता है। वर्तमान काल का γινώσκωσι निरन्तर और संबंधपरक जानने का भाव रख सकता है; ‘जानें’ मूल की विधिलिंगात्मक अभिव्यक्ति और अर्थगत खुलापन बनाए रखता है।
- source_word: σὲ
  choice: तुझको
  rationale: यह γινώσκωσι का प्रत्यक्ष कर्म है और यीशु की प्रार्थना में पिता को संबोधित करता है। ‘तुझको’ प्रार्थनात्मक, एकवचन संबोधन को स्पष्ट रखता है।
- source_word: τὸν μόνον ἀληθινὸν θεὸν
  choice: एकमात्र सच्चे परमेश्वर को
  rationale: यह σὲ के समानाधिकरण में है। ‘एकमात्र सच्चा परमेश्वर’ μόνον और ἀληθινόν दोनों का सीधा तथा स्वाभाविक अर्थ देता है।
- source_word: καὶ
  choice: और
  rationale: यह पिता और भेजे गए यीशु को व्याकरणिक रूप से जोड़ता है, बिना उनकी पहचान या पारस्परिक संबंध के विषय में मूल वाक्य से अधिक कुछ जोड़े।
- source_word: ὃν ἀπέστειλας
  choice: जिसे तूने भेजा है
  rationale: संबंधवाचक उपवाक्य यीशु की पहचान पिता द्वारा भेजे गए व्यक्ति के रूप में करता है। हिन्दी का पूर्ण भूतकाल वर्तमान संदर्भ में उस पूर्ण घटना की प्रासंगिकता को सहज रूप से व्यक्त करता है।
- source_word: Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: Χριστός का मूल अर्थ ‘अभिषिक्त जन/मसीहा’ है और यहाँ उपाधि का अर्थ सुनाई देता है। आधुनिक हिन्दी में ‘मसीह’ इस उपाधि का स्वाभाविक और स्थापित रूप है; वैकल्पिक पारंपरिक रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘एकमात्र सच्चे परमेश्वर’ और यीशु के बीच इस वाक्य में व्यक्त संबंध
  choice: पिता को सीधे ‘एकमात्र सच्चा परमेश्वर’ कहा गया है और यीशु को उससे अलग, उसके द्वारा भेजे गए व्यक्ति के रूप में रखा गया है।
  alternative: त्रित्व या मसीह की दिव्यता को स्पष्ट करने के लिए अनुवाद में अतिरिक्त व्याख्यात्मक शब्द जोड़ना।
  rationale: अनुवाद मूल वाक्य की सीधी भाषा और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है। यह न तो बाद की धर्मवैज्ञानिक बहस का समाधान पाठ में जोड़ता है, न इस पद की व्याकरणिक भिन्नता को कम करता है।
- issue: Χριστόν का रूपान्तरण
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: संदर्भ में उपाधिगत अर्थ सक्रिय है, इसलिए ‘मसीह’ चुना गया है। नाम-जैसे पारंपरिक रूप की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुझको/तूने’ प्रार्थना के एकवचन संबोधन और निकटता को दर्शाते हैं। समानाधिकरण को अल्पविरामों से स्पष्ट किया गया है, और किसी सिद्धान्तगत निष्कर्ष को मूल पाठ में नहीं जोड़ा गया।
