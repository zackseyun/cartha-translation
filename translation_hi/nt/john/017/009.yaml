  text: ἐγὼ περὶ αὐτῶν ἐρωτῶ· οὐ περὶ τοῦ κόσμου ἐρωτῶ ἀλλὰ περὶ ὧν δέδωκάς μοι, ὅτι σοί εἰσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/017/009.yaml
  text: I am asking on their behalf[a]. I am not asking on behalf of the world, but on behalf of those whom you have given me[b], because they are yours.
translation:
  language: hi
  text: मैं उनके लिए[a] विनती करता हूँ[b]। मैं संसार के लिए विनती नहीं करता, बल्कि उनके लिए करता हूँ जिन्हें तूने मुझे दिया है, क्योंकि वे तेरे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विषय में”; यहाँ यूनानी पूर्वसर्ग का अर्थ “के लिए” या “के विषय में” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “निवेदन करता हूँ”; यूनानी क्रिया का अधिक सीधा अर्थ “माँगता हूँ” या “अनुरोध करता हूँ” है, यद्यपि यहाँ संदर्भ प्रार्थना का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρωτῶ
  choice: विनती करता हूँ
  rationale: ἐρωτάω का मूल भाव ‘माँगना/निवेदन करना’ है। पिता को संबोधित इस प्रार्थना-संदर्भ में ‘विनती करता हूँ’ स्वाभाविक हिन्दी है और ‘प्रार्थना करता हूँ’ की अपेक्षा यूनानी क्रिया के अनुरोध वाले भाव को अधिक स्पष्ट रखता है।
- source_word: περὶ αὐτῶν
  choice: उनके लिए
  rationale: περί + संबंधकारक का अर्थ ‘उनके विषय में’ भी हो सकता है, पर इस मध्यस्थतापूर्ण प्रार्थना-संदर्भ में ‘उनके लिए’ स्वाभाविक और उपयुक्त है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κόσμου
  choice: संसार
  rationale: यूहन्ना के लेखन में κόσμος के व्यापक और कभी-कभी तनावपूर्ण अर्थ को किसी संकुचित व्याख्या में बाँधे बिना पारंपरिक तथा स्पष्ट हिन्दी शब्द ‘संसार’ से रखा गया है।
- source_word: ὧν δέδωκάς μοι
  choice: जिन्हें तूने मुझे दिया है
  rationale: यह व्यक्ति-समूह को सूचित करने वाले संबंधवाचक सर्वनाम और पूर्णकालिक क्रिया का स्वाभाविक हिन्दी रूप है। ‘दिया है’ बीते हुए कार्य के वर्तमान परिणाम को बनाए रखता है।
- source_word: ὅτι σοί εἰσιν
  choice: क्योंकि वे तेरे हैं
  rationale: ὅτι का कारणसूचक बल ‘क्योंकि’ से और σοί εἰσιν का संबंधात्मक-अधिकार भाव ‘वे तेरे हैं’ से सीधा तथा संक्षिप्त रूप में व्यक्त होता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट कर्ता सर्वनाम यीशु के कथन और पद की विरोधात्मक संरचना को बनाए रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: οὐ ... ἀλλά की ‘नहीं ... बल्कि’ संरचना को स्वाभाविक हिन्दी में स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ἐρωτῶ को स्पष्ट धार्मिक शब्दावली से अनुवादित करना या सामान्य अनुरोध की भाषा से
  choice: ‘विनती करता हूँ’
  alternative: ‘प्रार्थना करता हूँ’ या ‘माँगता हूँ’
  rationale: संदर्भ निस्संदेह पिता से की जा रही प्रार्थना है, फिर भी यूनानी क्रिया का मूल अर्थ पूछना/माँगना/अनुरोध करना है। ‘विनती’ प्रार्थना-संदर्भ में स्वाभाविक रहते हुए क्रिया को अनावश्यक रूप से तकनीकी धार्मिक शब्द नहीं बनाती।
- issue: περί का अर्थ ‘विषय में’ या ‘के लिए’
  choice: मुख्य पाठ में ‘के लिए’
  alternative: ‘के विषय में’
  rationale: यहाँ यीशु का अनुरोध उन लोगों के हित में है, इसलिए ‘के लिए’ सहज हिन्दी है। फिर भी यूनानी पूर्वसर्ग की विषय-संबंधी संभावना पादटिप्पणी में दी गई है ताकि मूल की अस्पष्टता न मिटे।
- issue: ‘संसार’ का आशय
  choice: अर्थ को ‘संसार’ के रूप में खुला रखा गया
  alternative: ‘समस्त मानवजाति’ या ‘अविश्वासी संसार-व्यवस्था’
  rationale: यूहन्ना में κόσμος के अर्थ संदर्भानुसार कई छायाएँ रखते हैं। यहाँ उसे किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित करना मूल पाठ के तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली मानक हिन्दी अपनाई गई है। पिता के लिए ‘तू/तेरे’ का प्रयोग निकटता और प्रचलित बाइबिलीय प्रार्थना-शैली दोनों को बनाए रखता है। समानांतर ‘के लिए’ संरचना पद के विरोध को स्पष्ट रखती है।
