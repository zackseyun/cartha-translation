  text: καθὼς ἐμὲ ἀπέστειλας εἰς τὸν κόσμον, κἀγὼ ἀπέστειλα αὐτοὺς εἰς τὸν κόσμον·
base_translation:
  language: en
  yaml_path: translation/nt/john/017/018.yaml
  text: Just as you sent me into the world, I also sent them into the world.
translation:
  language: hi
  text: जैसे तूने मुझे संसार में भेजा, वैसे ही मैंने भी उन्हें संसार में भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: जैसे ... वैसे ही
  rationale: तुलना और दोनों उपवाक्यों के समानांतर संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐμὲ
  choice: मुझे
  rationale: यह ἀπέστειλας का प्रत्यक्ष कर्म है; हिन्दी में इसका सीधा और स्वाभाविक रूप ‘मुझे’ है।
- source_word: ἀπέστειλας / ἀπέστειλα
  choice: भेजा / भेजा
  rationale: दोनों स्थानों पर एक ही क्रिया रखकर पिता द्वारा यीशु को भेजे जाने और यीशु द्वारा शिष्यों को भेजे जाने की जानबूझकर रची गई समानता सुरक्षित रहती है।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: εἰς की गमन-दिशा और यूहन्ना में κόσμος के व्यापक मानवीय एवं धर्मवैचारिक अर्थ को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: κἀγὼ
  choice: मैंने भी
  rationale: καὶ ἐγώ के योगात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता और पहले उपवाक्य से समानता बनाए रखता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: संदर्भ में यह शिष्यों की ओर संकेत करता है; ‘उन्हें’ मूल की सर्वनामगत संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: पिता द्वारा पुत्र को भेजने और पुत्र द्वारा शिष्यों को भेजने के बीच मिशन-संबंधी समानता
  choice: दोनों उपवाक्यों में ‘भेजा’ रखकर ‘जैसे ... वैसे ही’ से समानता व्यक्त की गई।
  alternative: पहले ‘भेजा’ और दूसरे में ‘नियुक्त किया’ या ‘आज्ञा देकर भेजा’ कहना।
  rationale: मूल एक ही यूनानी क्रिया ἀποστέλλω को दोहराता है। समान हिन्दी क्रिया इस साहित्यिक और धर्मवैचारिक समानता को सुरक्षित रखती है, पर यह दावा नहीं करती कि शिष्यों का पद या मिशन पुत्र के अद्वितीय मिशन के हर पहलू में समान है।
- issue: κόσμος का अर्थ
  choice: संसार
  alternative: दुनिया; मानव-जगत
  rationale: ‘संसार’ यूहन्ना के बहुअर्थी κόσμος को खुला रखता है—यह मानव-जगत तथा परमेश्वर के विरोध में खड़ी व्यवस्था, दोनों की प्रतिध्वनि दे सकता है—और किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। प्रार्थना में पिता को संबोधित करने के कारण एकवचन निकट संबोधन ‘तूने’ रखा गया है; यह पद के गंभीर स्वर में स्वाभाविक है। ‘जैसे ... वैसे ही’ मूल तुलना को स्पष्ट करता है, और ‘भेजा ... भेजा’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
