id: JHN.17.11
reference: John 17:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐκέτι εἰμὶ ἐν τῷ κόσμῳ, καὶ ⸀αὐτοὶ ἐν τῷ κόσμῳ εἰσίν, κἀγὼ πρὸς σὲ ἔρχομαι. πάτερ ἅγιε, τήρησον αὐτοὺς ἐν τῷ ὀνόματί σου ᾧ δέδωκάς μοι, ἵνα ὦσιν ἓν ⸀καθὼς ἡμεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/017/011.yaml
  text: And I am no longer in the world[a], but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given to me, so that they may be one[b], just as we are.
translation:
  language: hi
  text: और अब मैं संसार में नहीं हूँ, पर वे संसार में हैं, और मैं आपके पास आ रहा हूँ। हे पवित्र पिता, उन्हें अपने उस नाम में सुरक्षित रखिए[a], जो आपने मुझे दिया है[b], ताकि वे एक हों, जैसे हम हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें अपने नाम से सुरक्षित रखिए’ अथवा ‘अपने नाम के द्वारा उनकी रक्षा कीजिए।’ यूनानी वाक्यांश क्षेत्र, साधन या अधिकार का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पाण्डुलिपियों में ‘जो आपने मुझे दिया है’ के स्थान पर ‘जिन्हें आपने मुझे दिया है’ पढ़ा जाता है; उस पाठ के अनुसार अर्थ होगा, ‘उन्हें अपने नाम में सुरक्षित रखिए, जिन्हें आपने मुझे दिया है।’ यह अनुवाद SBLGNT के पाठ का अनुसरण करता है, जिसमें ‘जो’ का सम्बन्ध ‘नाम’ से है।
    reason: textual_variant
lexical_decisions:
- source_word: οὐκέτι
  choice: अब … नहीं
  rationale: यह वर्तमान दृष्टिकोण से किसी अवस्था के समाप्त होने का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: κόσμος
  choice: संसार
  rationale: यहाँ यह उस पार्थिव मानवीय क्षेत्र या व्यवस्था को दर्शाता है जिसमें शिष्य बने रहते हैं; ‘संसार’ यूहन्ना की शब्दावली को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: κἀγὼ πρὸς σὲ ἔρχομαι
  choice: और मैं आपके पास आ रहा हूँ
  rationale: वर्तमान काल संदर्भ में निकट भविष्य की ओर संकेत करता है। ‘आपके पास आ रहा हूँ’ यूनानी क्रिया और संबोधित व्यक्ति की ओर गति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάτερ ἅγιε
  choice: हे पवित्र पिता
  rationale: सम्बोधन के रूप में यह ‘पिता’ की निकटता और ‘पवित्र’ की विशिष्टता दोनों को बनाए रखता है।
- source_word: τήρησον
  choice: सुरक्षित रखिए
  rationale: τηρέω में संभालकर रखने, रक्षा करने और बनाए रखने का भाव हो सकता है। ‘सुरक्षित रखिए’ इस प्रसंग में स्वाभाविक है और केवल शारीरिक सुरक्षा तक सीमित नहीं है।
- source_word: ἐν τῷ ὀνόματί σου
  choice: अपने उस नाम में
  rationale: ‘में’ सम्बन्ध, क्षेत्र, साधन अथवा अधिकार की सम्भावित छटाओं को खुला रखता है। ‘उस’ अगले सम्बन्धवाचक उपवाक्य को स्पष्ट रूप से ‘नाम’ से जोड़ता है।
- source_word: ᾧ δέδωκάς μοι
  choice: जो आपने मुझे दिया है
  rationale: सम्बन्धवाचक सर्वनाम SBLGNT पाठ में ‘नाम’ की ओर संकेत करता है; अनुवाद पिता द्वारा पुत्र को नाम दिए जाने के कथन को अस्पष्ट नहीं करता।
- source_word: ἵνα ὦσιν ἓν
  choice: ताकि वे एक हों
  rationale: ἵνα उद्देश्य व्यक्त करता है और नपुंसकलिंग एकवचन ἓν एकता का संकेत देता है; परिचित हिन्दी अभिव्यक्ति मूल की संक्षिप्तता बनाए रखती है।
- source_word: καθὼς ἡμεῖς
  choice: जैसे हम हैं
  rationale: यह शिष्यों की एकता और पिता-पुत्र की एकता के बीच वास्तविक तुलना को बनाए रखता है, पर तुलना के स्वरूप को अनुवाद में अतिरिक्त रूप से परिभाषित नहीं करता।
theological_decisions:
- issue: ‘अपने नाम में सुरक्षित रखिए’ का अर्थ
  choice: मुख्य पाठ में ‘अपने उस नाम में सुरक्षित रखिए’ रखा गया है।
  alternative: ‘अपने नाम से उनकी रक्षा कीजिए’ अथवा ‘अपने नाम के द्वारा उन्हें सुरक्षित रखिए।’
  rationale: ἐν क्षेत्र, साधन या अधिकार का बोध करा सकता है। ‘नाम में’ इस बहुअर्थकता और धर्मवैचारिक तनाव को किसी एक व्याख्या में सीमित नहीं करता।
- issue: ‘जो आपने मुझे दिया है’ का सम्बन्ध
  choice: सम्बन्धवाचक उपवाक्य को ‘नाम’ से जोड़ा गया है।
  alternative: 'कुछ पाण्डुलिपियों या उनकी व्याख्या के अनुसार अर्थ हो सकता है: ‘जिन्हें आपने मुझे दिया है, उन्हें अपने नाम में सुरक्षित रखिए।’'
  rationale: दिए गए SBLGNT पाठ में सम्बन्धवाचक सर्वनाम ‘नाम’ के अनुरूप है; इसलिए मुख्य पाठ उसी को दर्शाता है, जबकि पाठांतर पादटिप्पणी में दिया गया है।
- issue: ‘ताकि वे एक हों, जैसे हम हैं’ का बल
  choice: पिता-पुत्र की एकता और शिष्यों की एकता के बीच तुलना को यथावत रखा गया है।
  alternative: इसे केवल नैतिक सहयोग तक सीमित करना, या अनुवाद में ही तत्त्वमीमांसात्मक समानता जोड़ देना।
  rationale: मूल पाठ तुलना को बल देता है, पर उसकी प्रकृति को इस वाक्य में विस्तार से परिभाषित नहीं करता; इसलिए अनुवाद न उसे हल्का करता है, न उसमें बाद की धर्मवैचारिक शब्दावली जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। परमेश्वर के लिए सम्मानसूचक ‘आप’ और क्रिया ‘रखिए’ प्रयुक्त हुई है; इससे यूनानी के एकवचन सम्बोधन में कोई अतिरिक्त धर्मवैचारिक अर्थ नहीं जोड़ा गया। पादटिप्पणी-चिह्न सम्बद्ध वाक्यांशों के ठीक बाद रखे गए हैं।
