  text: And all that is mine is yours[a], and what is yours is mine, and I have been glorified in them.
translation:
  language: hi
  text: और जो कुछ मेरा है, वह सब आपका है, और जो आपका है, वह मेरा है; और मैं उनमें महिमान्वित हुआ हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके द्वारा” अथवा “उनके बीच।” यूनानी में “उनमें” है; संदर्भ में यह स्थान, माध्यम, या उनके बीच/उनमें महिमा के प्रकट होने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἐμὰ πάντα
  choice: जो कुछ मेरा है, वह सब
  rationale: नपुंसकलिंग बहुवचन के साथ πᾶς व्यापक रूप से यीशु से संबंधित सब कुछ व्यक्त करता है। यह हिन्दी में स्वाभाविक है और केवल भौतिक वस्तुओं का भाव नहीं देता।
- source_word: σά
  choice: आपका है
  rationale: अधिकारसूचक विशेषण को इस समीकरणात्मक वाक्य में हिन्दी के स्वाभाविक अधिकारसूचक रूप में रखा गया है। पिता के संबोधन के लिए आदरसूचक ‘आप’ उपयुक्त है।
- source_word: τὰ σὰ ἐμά
  choice: जो आपका है, वह मेरा है
  rationale: यह पहले खंड के समानांतर पारस्परिक अधिकार को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: δεδόξασμαι
  choice: मेरी महिमा प्रकट हुई है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य पूर्ण हुई क्रिया के वर्तमान परिणाम को व्यक्त करता है। हिन्दी में यह वाक्यांश महिमा पाने और उसके प्रकट होने के भाव को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि अधिक शाब्दिक ‘मैं महिमान्वित हुआ हूँ’ भी संभव है।
- source_word: ἐν αὐτοῖς
  choice: उनमें
  rationale: यह ἐν का सीधा अनुवाद है और संभवतः आसपास के संदर्भ में पिता द्वारा यीशु को दिए गए लोगों की ओर संकेत करता है। इससे स्थान, माध्यम अथवा अभिव्यक्ति की संभावित छायाएँ बिना निर्णायक व्याख्या थोपे बनी रहती हैं।
theological_decisions:
- issue: पुत्र और पिता के बीच पारस्परिक अधिकार
  choice: ‘जो कुछ मेरा है, वह सब आपका है, और जो आपका है, वह मेरा है’ के रूप में कथन को सीधे पारस्परिक अधिकार के रूप में रखा गया।
  alternative: इसे केवल कार्यगत सहयोग बताकर पारस्परिक अधिकार के कथन को कमजोर करना।
  rationale: यूनानी पाठ पारस्परिक अधिकार को स्पष्ट रूप से कहता है। अनुवाद इसे न तो नरम करता है, न पद में अनुपस्थित बाद की धर्मसैद्धांतिक शब्दावली जोड़ता है।
- issue: ‘उनमें’ का संदर्भ और अर्थ
  choice: मुख्य पाठ में सीधा रूप ‘उनमें’ रखा गया।
  alternative: ‘उनके द्वारा’ को साधनवाचक अर्थ में या ‘उनके बीच’ को संबंध अथवा उपस्थिति के अर्थ में रखना।
  rationale: ἐν संदर्भ में अनेक अर्थ-छायाएँ धारण कर सकता है; पाठ किसी एक को अनिवार्य नहीं बनाता। इसलिए मुख्य पाठ में अस्पष्टता सुरक्षित रखी गई और विकल्प पादटिप्पणी में दिए गए।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’, और सामान्य पाठकों के लिए स्वाभाविक किंतु गरिमापूर्ण शैली अपनाई गई है। पारस्परिकता बनाए रखने के लिए दोनों अधिकारसूचक खंड समानांतर रखे गए हैं।
