  rationale: यहाँ यह सामान्य अभिवादन नहीं, बल्कि राजा के लिए किए जाने वाले सम्मानसूचक अभिवादन का व्यंग्यपूर्ण प्रयोग है। ‘आपकी जय हो’ उसके औपचारिक और उपहासपूर्ण दोनों प्रभावों को व्यक्त करता है।
- source_word: ὁ βασιλεὺς τῶν Ἰουδαίων
  choice: यहूदियों के राजा
  rationale: राजनीतिक और मसीही विडंबना से भरी इस उपाधि का सीधा और प्रचलित हिन्दी रूप रखा गया है।
- source_word: ἐδίδοσαν αὐτῷ ῥαπίσματα
  choice: वे उसे थप्पड़ मारते थे
  rationale: ῥαπίσματα हाथ से मारे गए थप्पड़ों या प्रहारों को दर्शाता है, और अपूर्णकाल ἐδίδοσαν बार-बार अथवा जारी क्रिया का संकेत देता है। यह हिन्दी रूप सटीक, स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: यीशु को संबोधित करने का भाव
  choice: राजकीय सम्मान के व्यंग्यपूर्ण अनुकरण के रूप में ‘आपकी जय हो’
  alternative: ‘प्रणाम’ या तटस्थ ‘नमस्कार’
  rationale: निकटवर्ती यातना और उपहास के प्रसंग में यह अभिवादन सच्ची श्रद्धा नहीं, बल्कि बनावटी राजकीय सम्मान है। अनुवाद प्रसंग से प्रकट इस व्यंग्य को बनाए रखता है, पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
