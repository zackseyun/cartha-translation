  rationale: दोनों अपूर्णकालिक क्रियाओं का रूप चलती हुई या बार-बार की गई क्रिया का संकेत दे सकता है। हिन्दी में ‘आते और कहते थे’ इस दृश्य की पुनरावृत्त, उपहासपूर्ण गतिविधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Χαῖρε
