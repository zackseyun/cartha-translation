base_translation:
  language: en
  yaml_path: translation/nt/john/019/005.yaml
  text: So Jesus came out[a], wearing the crown of thorns and the purple robe. And he says to them, “Behold, the man.”
translation:
  language: hi
  text: तब यीशु काँटों का मुकुट और बैंगनी वस्त्र पहने हुए बाहर आए। और पिलातुस ने उनसे कहा, “देखो, यह मनुष्य!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लो, यह मनुष्य!” यूनानी ἰδού सामने उपस्थित व्यक्ति की ओर ध्यान खींचने वाली अभिव्यक्ति है; इसका अनुवाद “देखो,” “लो,” या “देखिए” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν οὖν ... ἔξω
  choice: तब ... बाहर आए
  rationale: οὖν कथा के परिणाम और आगे बढ़ने का संकेत देता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक है। ἐξῆλθεν और ἔξω की संयुक्त बलवत्ता ‘बाहर आए’ में व्यक्त होती है। यीशु के लिए आदरसूचक बहुवचन हिन्दी की सामान्य गरिमापूर्ण शैली के अनुरूप है।
- source_word: φορῶν
  choice: पहने हुए
  rationale: यह वर्तमान कृदन्त मुकुट और वस्त्र धारण किए होने की साथ-साथ चल रही अवस्था बताता है।
- source_word: τὸν ἀκάνθινον στέφανον
  choice: काँटों का मुकुट
  rationale: यह मुकुट के काँटों से बने होने का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: τὸ πορφυροῦν ἱμάτιον
  choice: बैंगनी वस्त्र
  rationale: ἱμάτιον सामान्य बाहरी परिधान है। ‘वस्त्र’ मूल की व्यापकता बनाए रखता है और ‘चोगा’ जैसी अनावश्यक विशिष्टता से बचता है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को सहज हिन्दी कथन में भूतकाल से व्यक्त किया गया है; बोलने वाला पिलातुस पिछले पद के स्पष्ट कर्ता से ग्रहण होता है और अस्पष्ट सर्वनाम से बचने के लिए नाम दोहराया गया है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाली सार्वजनिक उद्घोषणा है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का निर्देशात्मक बल बनाए रखता है।
- source_word: ὁ ἄνθρωπος
  choice: यह मनुष्य
  rationale: निश्चित पदबंध सामने उपस्थित यीशु की ओर संकेत करता है। हिन्दी में ‘यह मनुष्य’ प्रत्यक्ष प्रस्तुति को स्पष्ट करता है और व्यापक प्रतिनिधि-मानव संबंधी संभावित अनुगूँज को सीमित नहीं करता।
theological_decisions:
- issue: पिलातुस की उद्घोषणा में ὁ ἄνθρωπος का अनुवाद
  choice: यह मनुष्य
  alternative: वह मनुष्य; यह आदमी
  rationale: ‘मनुष्य’ गरिमापूर्ण रहते हुए यीशु को एक विशिष्ट पुरुष के रूप में प्रस्तुत करता है और मूल की संभावित व्यापक मानवीय अनुगूँज को भी खुला रखता है। ‘आदमी’ अधिक बोलचाल का है, जबकि केवल ‘मनुष्य’ हिन्दी में प्रत्यक्ष संकेत को कमजोर कर सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यीशु के लिए आदरसूचक बहुवचन रखा गया है। कथानक की स्वाभाविकता के लिए यूनानी ऐतिहासिक वर्तमान को हिन्दी भूतकाल में व्यक्त किया गया है।
