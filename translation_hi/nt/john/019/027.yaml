source:
  edition: SBLGNT
  text: εἶτα λέγει τῷ μαθητῇ· ⸀Ἴδε ἡ μήτηρ σου. καὶ ἀπ’ ἐκείνης τῆς ὥρας ἔλαβεν ὁ μαθητὴς αὐτὴν εἰς τὰ ἴδια.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/027.yaml
  text: Then he said to the disciple, “Look, your mother.” And from that hour the disciple took her into his own home.
translation:
  language: hi
  text: फिर उसने उस शिष्य से कहा, “देखो, यह तुम्हारी माँ है।” और उसी घड़ी से वह शिष्य उसे अपने घर ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἴδε
  choice: देखो
  rationale: यह संबोधन ध्यान आकर्षित करता है; आधुनिक हिन्दी में “देखो” स्वाभाविक है और मूल की संक्षिप्त, प्रत्यक्ष शैली बनाए रखता है।
- source_word: εἰς τὰ ἴδια
  choice: अपने घर
  rationale: शाब्दिक अर्थ ‘अपनी वस्तुओं/अपने लोगों के बीच’ हो सकता है, पर इस प्रसंग में यह मुहावरा शिष्य द्वारा मरियम को अपने घरेलू आश्रय में स्वीकार करने को व्यक्त करता है; ‘अपने घर’ स्पष्ट और स्वाभाविक है।
- source_word: ἀπ’ ἐκείνης τῆς ὥρας
  choice: उसी घड़ी से
  rationale: यह मूल की समय-सूचक अभिव्यक्ति को निकटता से रखता है और तत्काल आरम्भ होने का भाव देता है।
theological_decisions:
- issue: यीशु के कथन में निहित नए पारिवारिक संबंध का स्वरूप
  choice: “यह तुम्हारी माँ है” के रूप में सीधा कथन
  alternative: “अपनी माँ को देखो” या ऐसा विस्तार जो किसी विशिष्ट सिद्धान्त को स्पष्ट करे
  rationale: मूल वाक्य संक्षिप्त है और संबंध घोषित करता है; अनुवाद इसमें किसी व्यापक कलीसियाई या मत-संबंधी अर्थ को न जोड़ता है, न नकारता है।
- issue: शिष्य द्वारा मरियम को ग्रहण करने का अर्थ
  choice: “उसे अपने घर ले गया”
  alternative: “उसे अपनी संपत्ति में ग्रहण किया” या “उसे अपना लिया”
  rationale: प्रसंग में घरेलू देखभाल का अर्थ सबसे स्वाभाविक है; ‘अपना लिया’ कानूनी या सिद्धान्तगत अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। “माँ” सामान्य पाठक के लिए सहज है, और कथन की संक्षिप्तता संरक्षित रखी गई है।
