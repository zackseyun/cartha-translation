  yaml_path: translation/nt/john/019/028.yaml
  text: After this[a], Jesus, knowing that all things had already been completed, in order that the Scripture might be fulfilled, said, “I thirst.”
translation:
  language: hi
  text: इसके बाद यीशु ने, यह जानते हुए कि सब कुछ पहले ही पूरा हो चुका था, ताकि पवित्रशास्त्र की बात पूरी हो, कहा, “मैं प्यासा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: इसके बाद
  rationale: यह τοῦτο के एकवचन संकेत को बनाए रखते हुए यूहन्ना की कथा में स्वाभाविक काल-संक्रमण व्यक्त करता है।
- source_word: εἰδὼς
  choice: यह जानते हुए
  rationale: यह यीशु से संबंधित समकालिक परिस्थितिजन्य कृदंत का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: ἤδη πάντα τετέλεσται
  choice: अब सब कुछ पूरा हो चुका है
  rationale: πάντα को ‘सब कुछ’ और पूर्णकाल τετέλεσται को पूरी हो चुकी वर्तमान अवस्था के रूप में व्यक्त किया गया है; ἤδη के लिए प्रसंगानुकूल ‘अब’ चुना गया है।
- source_word: ἵνα τελειωθῇ ἡ γραφή
  choice: पवित्रशास्त्र की बात पूरी हो इसलिए
  rationale: γραφή को पवित्र लेख के रूप में पहचानते हुए ‘पवित्रशास्त्र’ कहा गया है। ‘पूरी हो’ τελειωθῇ की completion-संबंधी ध्वनि को बनाए रखता है और हिन्दी में शास्त्र-वचन की सिद्धि का स्वाभाविक बोध देता है; ‘इसलिए’ ἵνα का प्रयोजनसूचक संबंध व्यक्त करता है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथात्मक भूतकाल में प्रस्तुत किया गया है।
- source_word: Διψῶ
  choice: मैं प्यासा हूँ
  rationale: वर्तमानकालीन प्यास को सामान्य, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के ज्ञान, सब कुछ पूरा हो चुकने और पवित्रशास्त्र की बात पूरी होने का संबंध
  choice: पाठ यह कहता है कि यीशु जानते थे कि सब कुछ पूरा हो चुका है, और पवित्रशास्त्र की बात पूरी हो इसलिए उन्होंने कहा।
  alternative: ἵνα को कठोर प्रयोजन के बजाय परिणाम की छाया के साथ समझा जा सकता है—उनके कहने के फलस्वरूप पवित्रशास्त्र की बात पूरी हुई।
  rationale: अनुवाद यूनानी वाक्य-संबंध और उसके धर्मवैचारिक तनाव को बनाए रखता है; यह दैवी पूर्वज्ञान या पूर्वनियति की कोई विस्तृत प्रणाली पाठ में नहीं जोड़ता। τετέλεσται और τελειωθῇ के बीच की शब्दगत निकटता भी ‘पूरा’ द्वारा दिखाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘मैं प्यासा हूँ’ सामान्य पाठक के लिए स्वाभाविक है। स्रोत पद में किसी वास्तविक पाठ-टिप्पणी की आवश्यकता नहीं पाई गई; दिए गए अंग्रेज़ी फुटनोट का चिह्न मुख्य पाठ के ‘After this’ पर असंगत था और उसका पाठ स्वयं अंग्रेज़ी विकल्प से संबंधित था, इसलिए हिन्दी मसौदे में उसे नहीं अपनाया गया।
