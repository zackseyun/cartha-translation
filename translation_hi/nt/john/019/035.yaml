source:
  edition: SBLGNT
  text: καὶ ὁ ἑωρακὼς μεμαρτύρηκεν, καὶ ἀληθινὴ ⸂αὐτοῦ ἐστιν⸃ ἡ μαρτυρία, καὶ ἐκεῖνος οἶδεν ὅτι ἀληθῆ λέγει, ἵνα ⸀καὶ ὑμεῖς ⸀πιστεύητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/035.yaml
  text: And the one who has seen has testified[a], and his testimony is true, and that one knows that he is telling the truth, so that you also may believe.
translation:
  language: hi
  text: और जिसने देखा है, उसने गवाही दी है; उसकी गवाही सच्ची है, और वही जानता है कि वह सच कहता है, ताकि तुम भी विश्वास करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि तुम भी विश्वास करते रहो।” वर्तमान संभावनार्थक क्रिया निरंतर विश्वास का भाव दे सकती है।
    reason: वैकल्पिक पक्षगत अर्थ
lexical_decisions:
- source_word: ὁ ἑωρακὼς
  choice: जिसने यह देखा है
  rationale: पूर्णकालिक कृदंत देख लेने की घटना और उसकी बनी हुई प्रासंगिकता दोनों को व्यक्त करता है। यह अनुवाद मूल के व्यक्तिवाचक कृदंत को बनाए रखता है और गवाह की पहचान तय नहीं करता।
- source_word: μεμαρτύρηκεν
  choice: उसने गवाही दी है
  rationale: पूर्णकाल को स्वाभाविक हिन्दी में रखा गया है, जिससे दी जा चुकी गवाही की वर्तमान वैधता का भाव बना रहता है।
- source_word: ἀληθινὴ ... ἡ μαρτυρία
  choice: उसकी गवाही सच्ची है
  rationale: ἀληθινή यहाँ गवाही की सत्यता और विश्वसनीयता बताता है; ‘सच्ची’ सीधा और सहज हिन्दी रूप है।
- source_word: ἐκεῖνος
  choice: वह व्यक्ति
  rationale: साधारण ‘वह’ की अपेक्षा संकेतवाचक बल को कुछ हद तक सुरक्षित रखता है, पर गवाह की पहचान को स्पष्ट करके नहीं जोड़ता।
- source_word: οἶδεν
  choice: जानता है
  rationale: οἶδα रूप की दृष्टि से पूर्णकालिक होते हुए भी वर्तमान स्थिति का अर्थ देता है; इसलिए ‘जानता है’ स्वाभाविक है।
- source_word: ἀληθῆ λέγει
  choice: वह सच कहता है
  rationale: नपुंसकलिंग बहुवचन ἀληθῆ और λέγει का मुहावरेदार अर्थ सत्य कहना है; हिन्दी में ‘सच कहता है’ स्पष्ट और स्वाभाविक है।
- source_word: ἵνα καὶ ὑμεῖς πιστεύητε
  choice: ताकि तुम भी विश्वास करो
  rationale: ἵνα उद्देश्य व्यक्त करता है और καὶ ὑμεῖς पाठकों को भी सम्मिलित करता है। मुख्य पाठ में πιστεύητε का अनिर्दिष्ट, स्वाभाविक रूप रखा गया है।
theological_decisions:
- issue: पद में बलयुक्त सर्वनामों का संदर्भ
  choice: तीसरे पुरुष की अभिव्यक्ति बनाए रखते हुए गवाह की पहचान अनिर्धारित रखी गई है।
  alternative: वक्ता प्रिय शिष्य के रूप में अपने लिए तीसरे पुरुष में बोल रहा है; अथवा वह किसी अलग प्रत्यक्षदर्शी का उल्लेख कर रहा है।
  rationale: यूनानी पाठ गवाह की पहचान स्पष्ट नहीं करता। ‘जिसने यह देखा है’ और ‘वह व्यक्ति’ उस अस्पष्टता और बल को बिना किसी विशेष पहचान को आरोपित किए बनाए रखते हैं।
- issue: πιστεύητε का पक्षगत भाव
  choice: विश्वास करो
  alternative: विश्वास करते रहो
  rationale: वर्तमानकालिक संभावनार्थक रूप निरंतर विश्वास का भाव दे सकता है, पर इस प्रसंग में आरंभिक या निरंतर—दोनों अर्थ संभव हैं। मुख्य पाठ में अनिर्दिष्ट रूप और पादटिप्पणी में निरंतरता की संभावना रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘गवाही’ और ‘विश्वास’ जैसे प्रचलित बाइबलीय शब्द स्वाभाविक धार्मिक संदर्भ में प्रयुक्त हैं; वाक्यरचना मूल के क्रम और बल के निकट रहते हुए हिन्दी की पठनीयता के अनुसार ढाली गई है।
