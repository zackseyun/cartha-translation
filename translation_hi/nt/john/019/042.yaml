id: JHN.19.42
reference: John 19:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐκεῖ οὖν διὰ τὴν παρασκευὴν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν τὸ μνημεῖον, ἔθηκαν τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/042.yaml
  text: So there[a], because of the Jews’ day of preparation, since the tomb was nearby, they laid Jesus there.
translation:
  language: hi
  text: इसलिए यहूदियों की तैयारी के दिन के कारण, और क्योंकि वह कब्र पास ही थी, उन्होंने यीशु को वहीं रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: वहीं
  rationale: स्थानवाचक क्रियाविशेषण है, जो निकटवर्ती कब्र में रखे जाने की ओर संकेत करता है। वाक्य के अंत में ‘वहीं’ स्वाभाविक हिन्दी है और यूनानी के स्थान-संदर्भ को स्पष्ट रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले प्रसंग से निकलने वाले कथात्मक परिणाम को व्यक्त करता है। ‘इसलिए’ इसके निष्कर्षात्मक संबंध को बनाए रखता है।
- source_word: διὰ τὴν παρασκευὴν
  choice: तैयारी के दिन के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। παρασκευή सब्त या पर्व से पहले की तैयारी के दिन का प्रचलित पद हो सकता है; ‘तैयारी का दिन’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों की
  rationale: संबंधकारक पद को निकटता से दर्शाता है और जातीय, धार्मिक अथवा प्रथागत संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ὅτι
  choice: और क्योंकि
  rationale: यह उस कब्र को चुनने का अतिरिक्त कारण प्रस्तुत करता है। ‘और क्योंकि’ हिन्दी में दोनों कारणों का संबंध स्पष्ट और सहज बनाता है।
- source_word: ἐγγὺς
  choice: पास ही
  rationale: कब्र की निकटता बताता है। ‘पास ही’ स्वाभाविक आधुनिक हिन्दी में निकटता पर उचित बल देता है।
- source_word: μνημεῖον
  choice: कब्र
  rationale: इस दफन-संदर्भ में तैयार किए गए शव-स्थान के लिए ‘कब्र’ सामान्य, स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: ἔθηκαν
  choice: रख दिया
  rationale: τίθημι का यहाँ अर्थ यीशु के शरीर को कब्र में रखना है। ‘रख दिया’ दफन के पूर्ण हुए कार्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν Ἰησοῦν
  choice: यीशु
  rationale: क्रिया का प्रत्यक्ष कर्म; नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: दुःखभोग-वर्णन में παρασκευή का अनुवाद
  choice: तैयारी का दिन
  alternative: तैयारी
  rationale: यूनानी शब्द एक प्रचलित पंचांगीय पद के रूप में प्रयुक्त हो सकता है। ‘तैयारी का दिन’ आधुनिक पाठक के लिए स्पष्ट है, पर पाठ से आगे बढ़कर यह निश्चित नहीं करता कि किस विशेष अनुष्ठान या कैलेंडर-व्याख्या की बात है।
- issue: यूहन्ना के वर्णन में τῶν Ἰουδαίων का अनुवाद
  choice: यहूदियों की तैयारी का दिन
  alternative: यहूदी तैयारी का दिन
  rationale: यह रूप यूनानी संबंधकारक संरचना को दिखाई देता रहने देता है और कथन को यहूदी लोगों के विषय में किसी धर्मवैचारिक निर्णय के रूप में नहीं बढ़ाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। दो कारणों—तैयारी के दिन और कब्र की निकटता—को स्पष्ट रूप से जोड़ा गया है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
