id: JHN.19.25
reference: John 19:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἱστήκεισαν δὲ παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ ἡ μήτηρ αὐτοῦ καὶ ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ, Μαρία ἡ τοῦ Κλωπᾶ καὶ Μαρία ἡ Μαγδαληνή.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/025.yaml
  text: Standing by the cross of Jesus were his mother[a], and his mother's sister, Mary the wife of Clopas[b], and Mary Magdalene.
translation:
  language: hi
  text: यीशु के क्रूस के पास उसकी माता, उसकी माता की बहन, क्लोपास की मरियम[a][b] और मरियम मगदलीनी खड़ी थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात क्लोपास से सम्बन्धित मरियम; यूनानी मूल यह स्पष्ट नहीं करता कि वह उसकी पत्नी थी, यद्यपि ‘क्लोपास की पत्नी मरियम’ एक प्रचलित अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: इस वाक्य को तीन स्त्रियों का उल्लेख मानकर भी पढ़ा जा सकता है; उस स्थिति में ‘उसकी माता की बहन’ और ‘क्लोपास की मरियम’ एक ही स्त्री होंगी।
    reason: alternative_reading
lexical_decisions:
- source_word: Εἱστήκεισαν
  choice: खड़ी थीं
  rationale: यह रूप वहाँ लगातार खड़े रहने की अवस्था व्यक्त करता है; हिन्दी में ‘खड़ी थीं’ उस जारी स्थिति को स्वाभाविक रूप से प्रकट करता है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ कथा के दृश्य में हल्का परिवर्तन सूचित करता है, प्रबल विरोध नहीं। हिन्दी वाक्य का क्रम इस संक्रमण को बिना कृत्रिम ‘अब’ या ‘परन्तु’ जोड़े स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρὰ τῷ σταυρῷ τοῦ Ἰησοῦ
  choice: यीशु के क्रूस के पास
  rationale: παρά के साथ दत्तिव निकटता बताता है, और सम्बन्धकारक τοῦ Ἰησοῦ को सीधे ‘यीशु के क्रूस’ के रूप में रखा गया है।
- source_word: ἡ μήτηρ αὐτοῦ
  choice: उसकी माता
  rationale: मूल के सम्बन्धसूचक सर्वनाम और पारिवारिक पद का सीधा, गरिमापूर्ण हिन्दी रूप।
- source_word: ἡ ἀδελφὴ τῆς μητρὸς αὐτοῦ
  choice: उसकी माता की बहन
  rationale: सम्बन्धकारक रचना को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: Μαρία ἡ τοῦ Κλωπᾶ
  choice: क्लोपास की मरियम
  rationale: यूनानी रचना मरियम का क्लोपास से सम्बन्ध बताती है, पर उस सम्बन्ध को स्पष्ट रूप से ‘पत्नी’ नहीं कहती। संक्षिप्त हिन्दी पदबंध इस अस्पष्टता को बनाए रखता है; सम्भावित वैवाहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: Μαρία ἡ Μαγδαληνή
  choice: मरियम मगदलीनी
  rationale: यह मगदला से सम्बन्धित मरियम की प्रचलित और पहचानी जाने वाली हिन्दी संज्ञा है।
theological_decisions:
- issue: क्रूस के पास उपस्थित स्त्रियों की पहचान और संख्या
  choice: 'मुख्य पाठ में चार स्त्रियों की सूची मानी गई है: यीशु की माता, उसकी माता की बहन, क्लोपास की मरियम और मरियम मगदलीनी।'
  alternative: इसे तीन स्त्रियों की सूची भी समझा जा सकता है, यदि ‘उसकी माता की बहन’ और ‘क्लोपास की मरियम’ एक ही स्त्री के दो परिचय हों।
  rationale: यूनानी वाक्य की समन्वित संरचना चार स्त्रियों की सूची के रूप में सहज पढ़ी जाती है, पर प्राचीन विराम-चिह्नों के अभाव और सघन वाक्य-विन्यास के कारण तीन स्त्रियों वाला पाठ भी सम्भव है। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मरियम का क्लोपास से सम्बन्ध
  choice: मुख्य पाठ में अस्पष्ट ‘क्लोपास की मरियम’ रखा गया है।
  alternative: ‘क्लोपास की पत्नी मरियम’ एक प्रचलित व्याख्या है।
  rationale: τοῦ Κλωπᾶ सम्बन्ध तो व्यक्त करता है, किन्तु ‘पत्नी’ का शब्द मूल में नहीं है; इसलिए अनुवाद उस सम्बन्ध को सिद्ध मानकर सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘माता’ और ‘क्रूस’ परिचित बाइबलीय शब्द हैं; वाक्य-क्रम हिन्दी के स्वाभाविक प्रवाह के अनुरूप है।
