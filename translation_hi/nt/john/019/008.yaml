  text: When Pilate heard this statement, he became even more afraid,
translation:
  language: hi
  text: जब पिलातुस ने यह बात सुनी, तो वह और भी डर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτε
  choice: जब
  rationale: यह कालवाचक संयोजक पिलातुस की प्रतिक्रिया की परिस्थिति बताता है; आधुनिक हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन और पिलातुस की बढ़ी हुई प्रतिक्रिया के बीच कथात्मक-परिणामसूचक संबंध दिखाता है। हिन्दी में ‘इसलिए जब’ इस संबंध को स्पष्ट रखते हुए सहज है।
- source_word: ἤκουσεν
  choice: सुनी
  rationale: यहाँ क्रिया कही गई बात सुनने को व्यक्त करती है; ‘बात’ के अनुसार स्त्रीलिंग रूप ‘सुनी’ स्वाभाविक है।
- source_word: ὁ Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी रूप; यूनानी निश्चित उपपद का अलग अनुवाद आवश्यक नहीं है।
- source_word: τοῦτον τὸν λόγον
  choice: यह बात
  rationale: λόγος यहाँ पिछले पद में कही गई बात या दावे की विषयवस्तु को दर्शाता है, किसी एक शब्द को नहीं। ‘यह बात’ सामान्य आधुनिक हिन्दी में सटीक और सहज है।
- source_word: μᾶλλον
  choice: और भी
  rationale: यह पिलातुस के भय में पहले की अपेक्षा वृद्धि व्यक्त करता है।
- source_word: ἐφοβήθη
  choice: डर गया
  rationale: संदर्भ में यह भय की बढ़ी हुई अवस्था में प्रवेश को व्यक्त करता है; μᾶλλον के साथ ‘और भी डर गया’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: पिलातुस के भय का स्वरूप
  choice: भय को सामान्य मनोवैज्ञानिक अर्थ में रखा गया है और केवल उसकी वृद्धि बताई गई है।
  alternative: भय को विशेष रूप से राजनीतिक आशंका अथवा यीशु के दैवी पुत्र होने के दावे से उपजे धार्मिक/अंधविश्वासी भय के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ भय का कारण या स्वरूप निश्चित नहीं करता। अनुवाद इस कथात्मक और धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘पिलातुस’ प्रचलित हिन्दी बाइबलीय नाम-रूप है; ‘यह बात’ आम पाठकों के लिए ‘यह कथन’ से अधिक स्वाभाविक है।
