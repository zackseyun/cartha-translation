revisions:
- from: पिलातुस ने एक दोषपत्र भी लिखवाकर क्रूस पर लगवा दिया। उस पर लिखा था, “यीशु नासरी, यहूदियों का राजा।”[a]
  to: पीलातुस ने एक शिलालेख भी लिखा और उसे क्रूस पर लगाया। उस पर यह लिखा था, “यीशु नासरी, यहूदियों[a] का राजा।”
