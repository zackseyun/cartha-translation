  verdict: revise
  source_fidelity: The draft over-specifies τίτλος as “दोषपत्र” and changes Pilate’s explicit actions (“wrote” and “placed”) into causatives (“लिखवाकर…लगवा दिया”). The Greek does not state that Pilate commissioned others, nor does τίτλος itself explicitly identify the notice as a formal charge sheet.
  naturalness: “शिलालेख” is a natural, dignified Hindi rendering for a publicly displayed inscription in this context. The revised syntax is clear and preserves the two coordinated actions without unnecessary repetition.
  terminology: “क्रूस,” “यीशु,” “नासरी,” and “यहूदियों का राजा” are suitable established Hindi biblical terms. The alternative regional sense of Ἰουδαίων is retained in a footnote, whose anchor is moved directly to “यहूदियों.”
  issues:
  - severity: medium
    issue: “दोषपत्र” for τίτλον
    rationale: A दोषपत्र is specifically a document of accusation or charges. Although the crucifixion notice has accusatory-political force in context, τίτλος means an inscription, notice, or placard; the narrower Hindi term adds information not expressed by the source.
  - severity: medium
    issue: Causative verbs “लिखवाकर” and “लगवा दिया”
    rationale: ἔγραψεν and ἔθηκεν name Pilate directly as the one who wrote and placed the inscription. A causative rendering permits or suggests action by unnamed agents and is less source-faithful.
  - severity: low
    issue: Footnote anchor placement
    rationale: The note concerns Ἰουδαίων (“यहूदियों”), so its marker should immediately follow that word rather than follow the entire quotation.
