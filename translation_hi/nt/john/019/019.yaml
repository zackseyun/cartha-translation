id: JHN.19.19
reference: John 19:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔγραψεν δὲ καὶ τίτλον ὁ Πιλᾶτος καὶ ἔθηκεν ἐπὶ τοῦ σταυροῦ· ἦν δὲ γεγραμμένον· Ἰησοῦς ὁ Ναζωραῖος ὁ βασιλεὺς τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/019.yaml
  text: 'Pilate also wrote an inscription and put it on the cross. It was written: “Jesus the Nazarene[a], the King of the Jews.”'
translation:
  language: hi
  text: पीलातुस ने एक शिलालेख भी लिखा और उसे क्रूस पर लगाया। उस पर यह लिखा था, “यीशु नासरी, यहूदियों[a] का राजा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोगों का राजा।” प्रसंग के अनुसार यूनानी शब्द का अर्थ व्यापक रूप से “यहूदी” या विशेष रूप से “यहूदिया के लोग” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τίτλον
  choice: दोषपत्र
  rationale: क्रूस पर दंडित व्यक्ति के विरुद्ध आरोप बताने वाले लिखित पट्ट को दर्शाता है; इस प्रसंग में केवल ‘लेख’ की अपेक्षा ‘दोषपत्र’ उसका न्यायिक कार्य अधिक स्पष्ट करता है।
- source_word: ἔγραψεν ... ὁ Πιλᾶτος
  choice: पिलातुस ने ... लिखवाकर
  rationale: शासक द्वारा आधिकारिक लेख तैयार कराने के लिए हिन्दी का प्रेरणार्थक ‘लिखवाया’ स्वाभाविक है और पिलातुस की उत्तरदायित्वपूर्ण कर्तृता बनाए रखता है।
- source_word: ἔθηκεν ἐπὶ τοῦ σταυροῦ
  choice: क्रूस पर लगवा दिया
  rationale: ग्रीक में स्थान स्पष्टतः ‘क्रूस पर’ है; हिन्दी में लिखित पट्ट के लिए ‘लगवा दिया’ स्वाभाविक है और ‘ऊपर’ जैसा स्रोत से परे स्थान नहीं जोड़ता।
- source_word: γεγραμμένον
  choice: उस पर लिखा था
  rationale: परिणामी/स्थितिवाचक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ναζωραῖος
  choice: नासरी
  rationale: ग्रीक विशेषण/उपनाम को हिन्दी में प्रचलित पहचानसूचक रूप से व्यक्त करता है, न कि उसे स्पष्टतः ‘नासरत का निवासी’ में बदलता है।
- source_word: βασιλεὺς τῶν Ἰουδαίων
  choice: यहूदियों का राजा
  rationale: दुःखभोग-वृत्तांत के सार्वजनिक राजकीय आरोप में यह स्वाभाविक और परंपरागत अर्थ है; क्षेत्रीय अर्थ ‘यहूदिया के लोगों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δὲ καὶ
  choice: भी
  rationale: वृत्तांत की निरंतरता में जोड़े गए कार्य का योगात्मक बल सहज हिन्दी में व्यक्त करता है।
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: ग्रीक नाम का हिन्दी बाइबलीय प्रयोग में परिचित लिप्यंतरण।
- source_word: σταυροῦ
  choice: क्रूस
  rationale: सुसमाचार के दुःखभोग-वृत्तांत में σταυρός का मानक और प्रसंगानुकूल हिन्दी रूप।
theological_decisions:
- issue: Ἰουδαίων का अर्थ
  choice: यहूदियों
  alternative: यहूदिया के लोगों
  rationale: यहाँ राजकीय उपाधि और आरोप पूरे यहूदी जनसमुदाय के संदर्भ में समझा जाना सबसे स्वाभाविक है; फिर भी ग्रीक शब्द का क्षेत्रीय अर्थ संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘दोषपत्र’ क्रूस पर लगाए गए आरोपसूचक लेख का कार्य स्पष्ट करता है; प्रेरणार्थक क्रियाएँ पिलातुस की आधिकारिक भूमिका को स्वाभाविक हिन्दी में व्यक्त करती हैं।
