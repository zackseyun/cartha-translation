base_translation:
  language: en
  yaml_path: translation/nt/john/019/026.yaml
  text: So when Jesus saw his mother and the disciple whom he loved standing there[a], he says to his mother, “Woman, behold, your son.”
translation:
  language: hi
  text: तब जब यीशु ने अपनी माँ को और उस चेले को, जिससे यीशु प्रेम करता था, वहाँ खड़े देखा, तो उसने अपनी माँ से कहा, “हे नारी,[a] देख, यह तुम्हारा बेटा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी संबोधन आदरपूर्ण है, रूखा या अपमानजनक नहीं। इसका अनुवाद ‘प्रिय नारी’ या ‘महोदया’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा की प्रगति और परिणाम-संबंध को बनाए रखता है।
- source_word: ἰδὼν
  choice: जब ... देखा
  rationale: एओरिस्ट कृदंत का स्वाभाविक कालवाचक हिन्दी रूप है और घटनाक्रम स्पष्ट रखता है।
- source_word: τὴν μητέρα
  choice: अपनी माँ को
  rationale: यूनानी में निश्चित पद है; हिन्दी में यीशु से संबंध स्पष्ट और स्वाभाविक करने के लिए ‘अपनी’ उचित है।
- source_word: τὸν μαθητὴν παρεστῶτα
  choice: उस चेले को ... पास खड़े
  rationale: निश्चित चेले और उसके निकट उपस्थित होकर खड़े रहने, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ὃν ἠγάπα
  choice: जिससे वह प्रेम करता था
  rationale: संबंधवाचक उपवाक्य चेले की पहचान यीशु के प्रेम के द्वारा करता है; ‘वह’ का संदर्भ प्रसंग में स्पष्ट है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान की कथात्मक जीवंतता हिन्दी में सामान्य भूतकाल से अधिक स्वाभाविक रूप में संप्रेषित होती है।
- source_word: Γύναι
  choice: हे नारी
  rationale: प्रत्यक्ष संबोधन को औपचारिक और गरिमापूर्ण हिन्दी में बनाए रखता है; टिप्पणी स्पष्ट करती है कि यह असम्मानजनक नहीं है।
- source_word: ἴδε
  choice: देख
  rationale: संकेतात्मक आज्ञार्थक की गंभीरता और सामने उपस्थित व्यक्ति की ओर ध्यान दिलाने का बल रखता है।
- source_word: ὁ υἱός σου
  choice: यह तेरा बेटा है
  rationale: यूनानी पहचान-वाक्य का स्वाभाविक हिन्दी रूप है और चेले को नए पुत्र-संबंध में प्रस्तुत करता है।
theological_decisions:
- issue: Γύναι में मरियम के प्रति यीशु के संबोधन का भाव
  choice: मुख्य पाठ में ‘हे नारी’ रखकर टिप्पणी में इसके आदरपूर्ण भाव को स्पष्ट किया गया।
  alternative: ‘माँ’, ‘प्रिय नारी’ या ‘महोदया’
  rationale: ‘माँ’ मूल संबोधन को बदल देता, जबकि ‘प्रिय नारी’ अतिरिक्त आत्मीयता जोड़ता और ‘महोदया’ प्रसंग में कृत्रिम लगता। ‘हे नारी’ स्रोत की प्रत्यक्षता और गरिमा दोनों रखता है।
- issue: ὁ υἱός σου से व्यक्त संबंध
  choice: ‘यह तेरा बेटा है’
  alternative: ‘अपने बेटे को देख’
  rationale: चुना हुआ रूप पहचान और संबंध-स्थापन की मूल अस्पष्टता को बनाए रखता है; यह नहीं बताता कि संबंध केवल देखभाल, प्रतिनिधित्व या किसी व्यापक धार्मिक अर्थ तक सीमित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘चेला’ साधारण बाइबलीय प्रयोग है; ‘हे नारी’ का कुछ औपचारिक स्वर मूल संबोधन की गंभीरता के लिए जानबूझकर रखा गया है।
