source:
  edition: SBLGNT
  text: καὶ εἰσῆλθεν εἰς τὸ πραιτώριον πάλιν καὶ λέγει τῷ Ἰησοῦ· Πόθεν εἶ σύ; ὁ δὲ Ἰησοῦς ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/009.yaml
  text: And he entered the governor’s headquarters again and said to Jesus[a], “Where are you from?” But Jesus gave him no answer.
translation:
  language: hi
  text: वह फिर राज्यपाल के मुख्यालय[a] में गया और यीशु से कहा, “तुम कहाँ से हो?” परन्तु यीशु ने उसे कोई उत्तर नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रैटोरियम’; अर्थात रोमी राज्यपाल का आधिकारिक निवास या मुख्यालय।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: के भीतर गया
  rationale: यह क्रिया किसी स्थान के अंदर जाने को दर्शाती है। ‘के भीतर गया’ आधुनिक हिन्दी में स्वाभाविक है और गति की दिशा स्पष्ट रखता है।
- source_word: πραιτώριον
  choice: राज्यपाल का मुख्यालय
  rationale: यह शब्द रोमी राज्यपाल के आधिकारिक निवास अथवा प्रशासनिक मुख्यालय को सूचित करता है। ‘राज्यपाल का मुख्यालय’ इसका कार्य साधारण पाठकों के लिए स्पष्ट करता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पहले हुई क्रिया की पुनरावृत्ति बताता है; प्रसंग में ‘फिर’ संक्षिप्त और स्वाभाविक है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथात्मक शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है।
- source_word: Πόθεν εἶ σύ
  choice: तुम कहाँ से हो?
  rationale: प्रश्न यीशु के उद्गम या मूल के विषय में है। यह हिन्दी में स्वाभाविक है और स्रोत की संभावित गहराई को बिना समझाए खुला रखता है।
- source_word: ἀπόκρισιν οὐκ ἔδωκεν αὐτῷ
  choice: उसे कोई उत्तर नहीं दिया
  rationale: यह मूल अभिव्यक्ति ‘उसे उत्तर नहीं दिया’ की संरचना और यीशु की चुप्पी दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καὶ ... καὶ ... δὲ
  choice: फिर ... और ... परन्तु
  rationale: ये संयोजक घटनाक्रम और पिलातुस के प्रश्न के विपरीत यीशु की चुप्पी को व्यक्त करते हैं।
theological_decisions:
- issue: क्रिया के निहित कर्ता का निर्देश
  choice: ‘वह’ रखा गया है; प्रसंग से इसका संकेत पिलातुस की ओर है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘पिलातुस’ जोड़ना।
  rationale: यूनानी पाठ कर्ता को नाम से दोहराता नहीं है। ‘वह’ स्रोत की अभिव्यक्ति के अधिक निकट है और निकटवर्ती प्रसंग में पर्याप्त स्पष्ट है।
- issue: ‘तुम कहाँ से हो?’ में उद्गम का आशय
  choice: प्रश्न को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे केवल भौगोलिक जन्मस्थान या स्पष्टतः दिव्य उद्गम के प्रश्न के रूप में खोलना।
  rationale: Πόθεν उद्गम या स्रोत पूछता है और यूहन्ना के प्रसंग में प्रश्न में कथात्मक तथा धर्मवैचारिक तनाव हो सकता है; अनुवाद किसी एक अर्थ को जबरन निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘राज्यपाल’ और ‘मुख्यालय’ सामान्य पाठक के लिए स्पष्ट हैं; ‘प्रैटोरियम’ को पारदर्शिता हेतु पादटिप्पणी में रखा गया है।
