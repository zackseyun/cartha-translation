    reason: cross_reference
  - marker: b
    text: या, “जब उन्होंने देखा कि वह पहले ही मर गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ δὲ τὸν Ἰησοῦν ἐλθόντες
  choice: लेकिन जब वे यीशु के पास आए
  rationale: δέ पिछले पद में अन्य क्रूसित लोगों के साथ किए गए काम से हल्का विरोध दिखाता है। कृदन्तीय रचना को हिन्दी में स्वाभाविक कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ὡς εἶδον
  choice: और देखा कि
  rationale: ὡς यहाँ उस परिस्थिति को प्रस्तुत करता है जिसे देखकर आगे की कार्रवाई तय हुई। हिन्दी में यह वाक्य-क्रम बोध और उससे निकले परिणाम, दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἤδη
  choice: पहले ही
  rationale: यह सूचित करता है कि सैनिकों के पहुँचने और देखने से पहले यीशु की मृत्यु हो चुकी थी।
- source_word: τεθνηκότα
  choice: मर चुका था
  rationale: पूर्णकालिक कृदन्त मृत्यु के घटित हो जाने और उसकी वर्तमान परिणामी अवस्था, दोनों को व्यक्त करता है। ‘मर चुका था’ हिन्दी में इस पहलू को स्पष्ट और सहज रूप से संप्रेषित करता है; ‘मृत था’ भी सम्भव है।
- source_word: οὐ κατέαξαν
  choice: उन्होंने ... नहीं तोड़ीं
  rationale: κατάγνυμι इस प्रसंग में अंगों अथवा उनकी हड्डियों को तोड़ने के लिए प्रयुक्त है। ‘तोड़ना’ सटीक और सामान्य हिन्दी है।
- source_word: τὰ σκέλη
  choice: उसकी टाँगें
  rationale: σκέλη का सीधा अर्थ ‘टाँगें’ है। हड्डियाँ तोड़ना क्रिया में निहित है, पर मूल पद यहाँ ‘हड्डियाँ’ नहीं कहता।
theological_decisions:
- issue: यीशु की टाँगें न तोड़े जाने का पवित्रशास्त्र की पूर्ति से संबंध
  choice: मुख्य पाठ को सीधा कथात्मक कथन रखा गया है; पूर्ति का संबंध पादटिप्पणी में दिया गया है।
  alternative: ‘टाँगों’ के स्थान पर ‘हड्डियों’ का प्रयोग करके यूहन्ना 19:36 से संबंध पहले ही उभारना।
  rationale: पद 36 स्वयं पवित्रशास्त्र की पूर्ति का संबंध स्पष्ट करता है। पद 33 में σκέλη ‘टाँगें’ है, इसलिए यहाँ व्याख्यात्मक रूप से ‘हड्डियाँ’ जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण हिन्दी में है। ‘टाँगें’ सामान्य आधुनिक प्रयोग है और σκέλη का सीधा अर्थ सुरक्षित रखता है। ‘मर चुका था’ यूनानी पूर्णकालिक रूप की परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
