  text: But when they came to Jesus[a], seeing that he was already dead[b], they did not break his legs.
translation:
  language: hi
  text: लेकिन जब वे यीशु के पास आए[a] और उन्होंने देखा कि वह पहले ही मर चुका था[b], तो उन्होंने उसकी टाँगें नहीं तोड़ीं।
