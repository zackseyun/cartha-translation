source:
  edition: SBLGNT
  text: καὶ βαστάζων ⸂αὑτῷ τὸν σταυρὸν⸃ ἐξῆλθεν εἰς ⸀τὸν λεγόμενον Κρανίου Τόπον, ⸀ὃ λέγεται Ἑβραϊστὶ Γολγοθα,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/017.yaml
  text: And carrying the cross by himself[a], he went out to the place called Skull Place, which in Hebrew is called Golgotha.
translation:
  language: hi
  text: और वह स्वयं क्रूस उठाए हुए बाहर निकलकर उस स्थान पर गया, जो “खोपड़ी का स्थान” कहलाता है और जिसे इब्रानी[a] में “गुलगुता” कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “अरामी।” यूहन्ना का “इब्रानी” शब्द यहूदिया की स्थानीय सामी भाषा के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βαστάζων αὑτῷ τὸν σταυρόν
  choice: स्वयं क्रूस उठाए हुए
  rationale: βαστάζων क्रूस को शारीरिक रूप से उठाकर ले जाने का भाव देता है। αὑτῷ के आत्मवाचक बल को “स्वयं” से व्यक्त किया गया है; इससे यूनानी पाठ में स्पष्ट न किए गए स्वामित्व को अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: σταυρός
  choice: क्रूस
  rationale: दुःखभोग के प्रसंग में यह स्थापित और स्रोत के अनुरूप सामान्य पद है। “आड़ा शहतीर” जैसी अधिक संकीर्ण ऐतिहासिक व्याख्या यूनानी शब्द से यहाँ अनिवार्य नहीं है।
- source_word: ἐξῆλθεν
  choice: बाहर ... गया
  rationale: क्रिया का सीधा अर्थ बाहर जाना है। हिंदी वाक्य-विन्यास में गंतव्य को बीच में रखकर यह स्वाभाविक रूप से व्यक्त होता है।
- source_word: τὸν λεγόμενον Κρανίου Τόπον
  choice: उस स्थान पर, जो “खोपड़ी का स्थान” कहलाता है
  rationale: यह Κρανίον और Τόπος दोनों के अर्थ को स्पष्ट तथा स्वाभाविक हिंदी में बनाए रखता है और पारंपरिक नाम के कारण मूल अभिव्यक्ति को धुँधला नहीं करता।
- source_word: Ἑβραϊστί
  choice: इब्रानी
  rationale: मुख्य पाठ यूनानी शब्द का परंपरागत सीधा अर्थ “इब्रानी” रखता है। प्रथम शताब्दी में स्थानीय सामी भाषा, संभवतः अरामी, के व्यापक संकेत की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: Γολγοθα
  choice: गुलगुता
  rationale: यह सामी स्थान-नाम का हिंदी में प्रचलित लिप्यंतरण है।
theological_decisions:
- issue: Ἑβραϊστί में निर्दिष्ट सामी भाषा
  choice: मुख्य पाठ में “इब्रानी”
  alternative: “अरामी”
  rationale: यूनानी पाठ स्पष्ट रूप से Ἑβραϊστί कहता है, इसलिए मुख्य पाठ उसी को दर्शाता है। यूहन्ना के प्रयोग में यह यहूदिया की स्थानीय सामी भाषा के लिए भी प्रयुक्त हो सकता है; इस वास्तविक भाषाई संभावना को पादटिप्पणी में रखा गया है, न कि मुख्य पाठ में निर्णयपूर्वक बदल दिया गया है।
- issue: αὑτῷ का आत्मवाचक बल
  choice: “स्वयं क्रूस उठाए हुए”
  alternative: “अपना क्रूस उठाए हुए”
  rationale: “स्वयं” उस बल को सुरक्षित रखता है कि यीशु क्रूस खुद उठा रहे थे, जबकि “अपना” स्वामित्व को अधिक प्रमुख कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। “खोपड़ी का स्थान” मूल स्थान-संज्ञा का अर्थ स्पष्ट करता है, जबकि “गुलगुता” को नाम के रूप में लिप्यंतरित किया गया है। पादटिप्पणी-चिह्न भाषा-संदर्भ “इब्रानी” के ठीक बाद रखा गया है।
