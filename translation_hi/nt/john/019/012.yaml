source:
  edition: SBLGNT
  text: ἐκ τούτου ⸂ὁ Πιλᾶτος ἐζήτει⸃ ἀπολῦσαι αὐτόν· οἱ δὲ Ἰουδαῖοι ⸀ἐκραύγασαν λέγοντες· Ἐὰν τοῦτον ἀπολύσῃς, οὐκ εἶ φίλος τοῦ Καίσαρος· πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν ἀντιλέγει τῷ Καίσαρι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/012.yaml
  text: From then on Pilate was seeking to release him. But the Jews shouted, saying, “If you release this man, you are not Caesar’s friend. Everyone who makes himself a king speaks against Caesar.”
translation:
  language: hi
  text: तब से पिलातुस उसे रिहा करने का प्रयास करता रहा।[a] लेकिन यहूदी[b] चिल्लाकर बोले, “यदि तुम इस मनुष्य को रिहा करोगे, तो तुम कैसर के मित्र नहीं हो। जो कोई अपने आपको राजा बनाता है, वह कैसर का विरोध करता है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस कारण पिलातुस उसे रिहा करने का प्रयास करता रहा।” यूनानी वाक्यांश ἐκ τούτου का अर्थ समयसूचक (“तब से”) या कारणसूचक (“इस कारण”) हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के सुसमाचार में “यहूदी” शब्द प्रायः कथा-प्रसंग के विशेष यहूदी विरोधियों या यहूदिया के अधिकारियों की ओर संकेत करता है; इससे पूरी यहूदी जाति अभिप्रेत होना आवश्यक नहीं है।
    reason: cultural_note
  - marker: c
    text: या, “कैसर के विरुद्ध बोलता है” अथवा “कैसर के विरुद्ध खड़ा होता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τούτου
  choice: तब से
  rationale: यह वाक्यांश यहाँ स्वाभाविक रूप से कथानक में समय की प्रगति दर्शाता है; कारणवाचक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἐζήτει
  choice: प्रयास करता रहा
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार किए गए प्रयास का भाव देता है; यह हिन्दी में उस कालगत पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπολῦσαι / ἀπολύσῃς
  choice: छोड़ देने / छोड़ दोगे
  rationale: न्यायिक प्रसंग में इसका अर्थ हिरासत से मुक्त करना है; ‘छोड़ देना’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: οἱ δὲ Ἰουδαῖοι
  choice: लेकिन यहूदी
  rationale: मूल यूनानी पद को मुख्य पाठ में बिना व्याख्यात्मक संकीर्णता के रखा गया है; प्रसंगगत संकेत पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐκραύγασαν λέγοντες
  choice: चिल्लाकर कहने लगे
  rationale: यह ऊँची आवाज़ में सार्वजनिक पुकार को व्यक्त करता है और हिन्दी में वाक्य को स्वाभाविक रखता है।
- source_word: τοῦτον
  choice: इस मनुष्य
  rationale: यह संकेतवाचक शब्द का बल और वक्ताओं का दूरीपूर्ण स्वर बनाए रखता है।
- source_word: φίλος τοῦ Καίσαρος
  choice: कैसर के मित्र
  rationale: यह यूनानी संबंधकारक का सीधा और स्वाभाविक हिन्दी रूप है तथा राजनीतिक निष्ठा के आरोप को सुरक्षित रखता है।
- source_word: πᾶς ὁ βασιλέα ἑαυτὸν ποιῶν
  choice: जो कोई अपने आपको राजा बनाता है
  rationale: यह मूल अभिव्यक्ति के निकट है और इसे केवल ‘राजा होने का दावा करता है’ कहकर अर्थ को कमजोर नहीं करता।
- source_word: ἀντιλέγει τῷ Καίσαρι
  choice: कैसर का विरोध करता है
  rationale: राजनीतिक और न्यायिक संदर्भ में ἀντιλέγω का आशय कैसर के विरुद्ध खड़े होना है; ‘विरोध करता है’ हिन्दी में इस व्यापक अर्थ को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में ‘यहूदी’ का संदर्भ
  choice: मुख्य पाठ में ‘यहूदी’ रखा गया
  alternative: यहूदी अगुवे; यहूदिया के लोग
  rationale: यूनानी पाठ οἱ Ἰουδαῖοι कहता है। संदर्भ को मुख्य पाठ में अनावश्यक रूप से सीमित करने के बजाय यह स्पष्टता पादटिप्पणी में दी गई है कि यहाँ समस्त यहूदी जाति अभिप्रेत होना आवश्यक नहीं है।
- issue: ἀντιλέγει का राजनीतिक अर्थ
  choice: विरोध करता है
  alternative: कैसर के विरुद्ध बोलता है; कैसर के विरुद्ध खड़ा होता है
  rationale: इस आरोप में केवल मौखिक असहमति नहीं, बल्कि सम्राट के अधिकार के प्रतिरोध का भाव है; फिर भी वैकल्पिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘कैसर’ बाइबलीय-ऐतिहासिक उपाधि के रूप में रखा गया है। अपूर्ण क्रिया का निरंतर भाव ‘प्रयास करता रहा’ से व्यक्त किया गया है।
