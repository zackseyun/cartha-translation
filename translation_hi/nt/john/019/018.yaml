source:
  edition: SBLGNT
  text: ὅπου αὐτὸν ἐσταύρωσαν, καὶ μετ’ αὐτοῦ ἄλλους δύο ἐντεῦθεν καὶ ἐντεῦθεν, μέσον δὲ τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/018.yaml
  text: where they crucified him[a], and with him two others, one on each side, and Jesus in the middle.
translation:
  language: hi
  text: वहाँ उन्होंने उसे क्रूस पर चढ़ाया, और उसके साथ दो अन्य लोगों को भी—एक को इस ओर, दूसरे को उस ओर, और यीशु को बीच में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक संक्षेप में: “दोनों ओर एक-एक, और उनके बीच यीशु।”'
    reason: शब्द-विन्यास का वैकल्पिक, अधिक संक्षिप्त अनुवाद।
lexical_decisions:
- source_word: ὅπου
  choice: वहाँ
  rationale: यह स्थान-सूचक संबंधवाचक क्रियाविशेषण है। पिछले संदर्भ से जुड़े हिंदी वाक्य में ‘वहाँ’ स्वाभाविक और पर्याप्त रूप से स्पष्ट है।
- source_word: ἐσταύρωσαν
  choice: उन्होंने ... क्रूस पर चढ़ाया
  rationale: यूहन्ना के दुःखभोग-वृत्तांत में σταυρόω क्रूस पर चढ़ाकर मृत्युदंड देने को बताता है। यह मानक हिंदी अभिव्यक्ति है और कीलों आदि की प्रक्रिया को अनावश्यक रूप से निर्दिष्ट नहीं करती।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: संबंधकारक के साथ μετά सहभागिता या साथ होने का अर्थ देता है; ‘उसके साथ’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ἄλλους δύο
  choice: दो अन्य लोगों को
  rationale: मूल पाठ का अर्थ ‘दो और/अन्य’ है। हिंदी में कर्म को स्पष्ट और सहज बनाने के लिए ‘लोगों’ जोड़ा गया है, बिना उनकी पहचान या अपराध को निर्दिष्ट किए।
- source_word: ἐντεῦθεν καὶ ἐντεῦθεν
  choice: एक को इस ओर, दूसरे को उस ओर
  rationale: दोहराया हुआ स्थान-सूचक पद दोनों विपरीत ओरों पर एक-एक व्यक्ति की व्यवस्था दिखाता है। यह हिंदी में उसके वितरणात्मक और दृश्यात्मक प्रभाव को बनाए रखता है।
- source_word: μέσον
  choice: बीच में
  rationale: यहाँ μέσον केंद्रीय स्थान बताता है। ‘बीच में’ स्वाभाविक है और मूल की स्थानिक छवि को सुरक्षित रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं। ‘और’ वाक्य-विन्यास तथा स्थानों की अंतिम व्यवस्था को स्वाभाविक रूप से जोड़ता है।
- source_word: τὸν Ἰησοῦν
  choice: यीशु को
  rationale: कर्मकारक रूप यीशु को बीच में रखे गए व्यक्ति के रूप में प्रस्तुत करता है; हिंदी में ‘को’ इस व्याकरणिक संबंध को स्पष्ट करता है।
theological_decisions:
- issue: क्या यह स्पष्ट किया जाए कि यीशु उन दोनों अन्य व्यक्तियों के बीच थे
  choice: ‘एक को इस ओर, दूसरे को उस ओर, और यीशु को बीच में’
  alternative: ‘दोनों ओर एक-एक, और उनके बीच यीशु’
  rationale: मूल यूनानी पहले दोनों ओरों की व्यवस्था और फिर यीशु की केंद्रीय स्थिति बताता है। चुना गया रूप उसी क्रम और दृश्य को बनाए रखता है; ‘उनके बीच’ सही निष्कर्ष है, पर मूल के μέσον से कुछ अधिक स्पष्ट व्याख्या करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘क्रूस पर चढ़ाया’ प्रचलित बाइबलीय पद है। वाक्य में दीर्घ विराम-चिह्न स्थानिक व्यवस्था को स्पष्ट करता है और मूल पाठ की सघनता बनाए रखता है।
