  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुगंध-द्रव्य’ धार्मिक-सांस्कृतिक प्रसंग में ‘मसाले’ से अधिक स्पष्ट है। ‘दफ़नाना’ मानक आधुनिक हिन्दी में व्यापक रूप से बोधगम्य है।
