base_translation:
  language: en
  yaml_path: translation/nt/john/019/040.yaml
  text: So they took Jesus’s body and wrapped it in linen cloths with the spices[a], as is the burial custom of the Jews.
translation:
  language: hi
  text: इसलिए उन्होंने यीशु का शरीर लिया और उसे सुगंध-द्रव्यों के साथ सन के कपड़ों में लपेटा, जैसा यहूदियों[a] की दफ़नाने की रीति है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के निवासियों की,” यदि इसे यहूदी लोगों के बजाय भौगोलिक अर्थ में लिया जाए; यहाँ प्रसंग सामान्य यहूदी दफ़नाने की रीति की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλαβον
  choice: उन्होंने ... लिया
  rationale: यहाँ क्रिया शव को दफ़नाने की तैयारी के लिए अपने अधिकार में लेने और उठाने का भाव देती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद में बताई गई अनुमति और उसके परिणाम के बीच तार्किक-कथात्मक संबंध बनाए रखता है।
- source_word: σῶμα
  choice: शरीर
  rationale: यह σῶμα का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; ‘लाश’ यूनानी से अधिक कठोर होता।
- source_word: ἔδησαν
  choice: लपेटा
  rationale: δέω का मूल भाव बाँधना है, पर दफ़नाने के लिए कपड़े की पट्टियों के संदर्भ में ‘लपेटा’ आधुनिक हिन्दी में क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀθονίοις
  choice: मलमल की पट्टियों में
  rationale: यह बहुवचन में प्रयुक्त महीन सन के छोटे कपड़ों या पट्टियों को दर्शाता है; ‘पट्टियाँ’ दफ़नाने की क्रिया के संदर्भ में स्पष्ट है और ‘मलमल’ कपड़े की महीन प्रकृति बताता है।
- source_word: ἀρωμάτων
  choice: सुगंध-द्रव्यों
  rationale: यह दफ़नाने में प्रयुक्त सुगंधित पदार्थों का व्यापक अर्थ रखता है और केवल रसोई के ‘मसालों’ का भ्रम नहीं पैदा करता।
- source_word: καθὼς
  choice: जैसा
  rationale: यह बताता है कि किया गया कार्य प्रचलित रीति के अनुरूप था।
- source_word: ἔθος ἐστὶν
  choice: रीति है
  rationale: ‘रीति’ प्रचलित सांस्कृतिक व्यवहार के लिए संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों में
  rationale: इस प्रसंग में शब्द व्यापक यहूदी धार्मिक-सांस्कृतिक समुदाय की दफ़नाने की रीति को सूचित करता है, न कि केवल यहूदिया के निवासियों या अधिकारियों को।
- source_word: ἐνταφιάζειν
  choice: दफ़नाने
  rationale: यहाँ क्रिया में शव को दफ़नाने के लिए तैयार करने सहित अंतिम संस्कार का भाव है; वाक्य में ‘दफ़नाने की रीति’ सहज हिन्दी है।
theological_decisions:
- issue: τοῖς Ἰουδαίοις का सामुदायिक या भौगोलिक अर्थ
  choice: यहूदियों में
  alternative: यहूदिया के लोगों में
  rationale: यह प्रसंग किसी क्षेत्रीय या विरोधी समूह की पहचान नहीं, बल्कि सामान्य यहूदी दफ़नाने की प्रथा बताता है। फिर भी शब्द की सम्भव भौगोलिक व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
