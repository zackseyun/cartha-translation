base_translation:
  language: en
  yaml_path: translation/nt/john/019/013.yaml
  text: So when Pilate heard these words[a], he brought Jesus outside and sat down on the judgment seat at a place called the Stone Pavement, and in Hebrew[b], Gabbatha.
translation:
  language: hi
  text: इसलिए जब पिलातुस ने ये बातें सुनीं[a], तो वह यीशु को बाहर ले आया और उस स्थान पर न्याय-आसन पर बैठ गया, जो ‘पत्थर का फर्श’ कहलाता है और इब्रानी में ‘गब्बता’ कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसने उसे न्याय-आसन पर बैठाया।” यूनानी क्रिया को सकर्मक समझा जा सकता है, यद्यपि यहाँ अधिक सम्भावित अर्थ यह है कि पिलातुस स्वयं न्याय-आसन पर बैठा।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से परिणाम और कथा की आगे की कड़ी को व्यक्त करता है।
- source_word: ἀκούσας τῶν λόγων τούτων
  choice: जब पिलातुस ने ये बातें सुनीं
  rationale: एओरिस्ट कृदन्त को स्वाभाविक कालवाचक उपवाक्य से व्यक्त किया गया है; λόγων यहाँ अभी कही गई बातों को सूचित करता है।
- source_word: ἤγαγεν ἔξω τὸν Ἰησοῦν
  choice: वह यीशु को बाहर ले आया
  rationale: ἄγω और ἔξω बाहर की ओर ले जाने की क्रिया बताते हैं; हिन्दी में यह सहज और अर्थ-सटीक है।
- source_word: ἐκάθισεν ἐπὶ βήματος
  choice: न्याय-आसन पर बैठ गया
  rationale: βῆμα यहाँ न्यायिक कार्यवाही के आधिकारिक आसन या मंच को सूचित करता है। प्रमुख वाक्यगत अर्थ में बैठने वाला पिलातुस है।
- source_word: εἰς τόπον λεγόμενον Λιθόστρωτον
  choice: उस स्थान पर ... जो ‘पत्थर का फर्श’ कहलाता था
  rationale: Λιθόστρωτον का अर्थ अनुवादित किया गया है; εἰς को परिणामी स्थान के रूप में स्वाभाविक हिन्दी में ‘उस स्थान पर’ कहा गया है।
- source_word: Ἑβραϊστὶ δὲ Γαββαθα
  choice: और इब्रानी में ‘गब्बता’
  rationale: मुख्य पाठ Ἑβραϊστί को ‘इब्रानी’ ही कहता है, इसलिए उसे सुरक्षित रखा गया है; स्थानीय सामी भाषा संबंधी स्पष्टीकरण पाद-टिप्पणी में है।
theological_decisions:
- issue: ἐκάθισεν का कर्ता और सकर्मक अथवा अकर्मक अर्थ
  choice: पिलातुस न्याय-आसन पर बैठ गया
  alternative: पिलातुस ने यीशु को न्याय-आसन पर बैठाया
  rationale: यूनानी क्रिया को सकर्मक समझना सम्भव है, पर न्यायिक प्रसंग और अधिक स्वाभाविक वाक्यरचना पिलातुस के स्वयं बैठने का समर्थन करती है। वास्तविक अर्थगत अस्पष्टता को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। ‘न्याय-आसन’ कानूनी प्रसंग स्पष्ट करता है; स्थान-नाम के यूनानी अर्थ का अनुवाद और सामी नाम का देवनागरी लिप्यन्तरण किया गया है।
