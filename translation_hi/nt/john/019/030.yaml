source:
  edition: SBLGNT
  text: ὅτε οὖν ἔλαβεν τὸ ὄξος ὁ Ἰησοῦς εἶπεν· Τετέλεσται, καὶ κλίνας τὴν κεφαλὴν παρέδωκεν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/030.yaml
  text: So when Jesus had received the sour wine[a], he said, “It is finished,” and bowing his head[c][b], he gave up his spirit.
translation:
  language: hi
  text: इसलिए, जब यीशु ने खट्टी दाख-मदिरा[a] ली, तो उन्होंने कहा, “पूरा हो गया।”[b] फिर सिर झुकाकर उन्होंने अपनी आत्मा सौंप दी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिरका” या “दाख-मदिरा का सिरका।” यूनानी शब्द खट्टी दाख-मदिरा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “सम्पन्न हो गया” अथवा “पूरा हो चुका है।”
    reason: lexical_alternative
  - marker: c
    text: या “उन्होंने अंतिम साँस ली।” यूनानी में अधिक शाब्दिक रूप से है, “उन्होंने अपनी आत्मा सौंप दी।”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτε οὖν
  choice: इसलिए जब
  rationale: ὅτε के कालसूचक अर्थ और οὖν के कथानक-संबंधी निष्कर्षात्मक प्रवाह—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔλαβεν
  choice: ग्रहण कर लिया
  rationale: सन्दर्भ में यीशु को स्पंज पर दाखमधु दिया गया था; इसलिए ‘ग्रहण कर लिया’ केवल ‘लिया’ की अपेक्षा अधिक स्वाभाविक है और इसके बाद कहे गए वचन से पहले की पूर्ण क्रिया को स्पष्ट करता है।
- source_word: τὸ ὄξος
  choice: वह खट्टा दाखमधु
  rationale: ὄξος खट्टे हो चुके दाखमधु या wine vinegar को दर्शाता है। ‘खट्टा दाखमधु’ आधुनिक पाठक को पेय का स्वरूप ‘सिरका’ की अपेक्षा अधिक ठीक ढंग से बताता है।
- source_word: Τετέλεσται
  choice: पूरा हो गया
  rationale: τελέω के पूर्णकालिक रूप में पूर्ण हुई क्रिया और उसके बने हुए परिणाम—दोनों निहित हैं। हिन्दी में बिना कर्म जोड़े ‘पूरा हो गया’ मूल की अनिर्दिष्टता और अंतिमता बनाए रखता है।
- source_word: κλίνας τὴν κεφαλήν
  choice: सिर झुकाकर
  rationale: 'यह पूर्वकालिक कृदन्त की क्रिया को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है: आत्मा सौंपने से पहले यीशु ने सिर झुकाया।'
- source_word: παρέδωκεν τὸ πνεῦμα
  choice: अपनी आत्मा सौंप दी
  rationale: παραδίδωμι के ‘सौंप देना’ और πνεῦμα के ‘आत्मा’ अर्थ को बनाए रखते हुए यह मृत्यु का संकेत भी देता है; केवल ‘मर गए’ कहना मूल अभिव्यक्ति की विशिष्टता खो देता।
theological_decisions:
- issue: παρέδωκεν τὸ πνεῦμα को केवल मृत्यु के मुहावरे के रूप में दिया जाए या उसके शाब्दिक और व्यक्तिगत आयाम को भी सुरक्षित रखा जाए
  choice: उन्होंने अपनी आत्मा सौंप दी
  alternative: उन्होंने अंतिम साँस ली / उनकी मृत्यु हो गई
  rationale: मूल यूनानी साधारणतः ‘वे मर गए’ से अधिक विशिष्ट है। ‘अपनी आत्मा सौंप दी’ यीशु के कार्य की स्वैच्छिकता की सम्भावित यूहन्नाई प्रतिध्वनि को सुरक्षित रखता है, पर उस पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं थोपता।
- issue: Τετέλεσται में किस कार्य या योजना के पूरा होने को स्पष्ट किया जाए
  choice: पूरा हो गया
  alternative: सब कुछ पूरा हो गया / कार्य सम्पन्न हो गया
  rationale: यूनानी वाक्य में पूरा होने वाली वस्तु स्पष्ट रूप से नहीं कही गई। हिन्दी में भी उसे अनिर्दिष्ट रखने से मूल की व्यापकता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक बहुवचन ‘उन्होंने’ प्रयुक्त हुआ है। ‘दाखमधु’ सामान्य पाठक के लिए कुछ साहित्यिक है, पर ‘मदिरा’ की सम्भावित सांस्कृतिक छाया से बचते हुए स्रोत के wine-संबंधी अर्थ को स्पष्ट रखता है।
