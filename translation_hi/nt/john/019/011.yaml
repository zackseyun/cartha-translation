id: JHN.19.11
reference: John 19:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀αὐτῷ Ἰησοῦς· Οὐκ εἶχες ἐξουσίαν ⸂κατ’ ἐμοῦ οὐδεμίαν⸃ εἰ μὴ ἦν ⸂δεδομένον σοι⸃ ἄνωθεν· διὰ τοῦτο ὁ ⸀παραδούς μέ σοι μείζονα ἁμαρτίαν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/011.yaml
  text: Jesus answered him[a], “You would have no authority over me at all unless it had been given to you from above[b]. Therefore the one who handed me over to you has the greater sin.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “यदि तुम्हें ऊपर से[a] न दिया गया होता, तो मुझ पर तुम्हारा कोई भी अधिकार न होता। इसलिए जिसने मुझे तुम्हारे हवाले किया है[b], उसका पाप अधिक बड़ा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग से।” यूनानी में शाब्दिक रूप से “ऊपर से” है, जो यूहन्ना में प्रायः दैवी स्रोत की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ यीशु को पीलातुस के हवाले करने वाले की स्पष्ट पहचान नहीं बताई गई है। इसे यहूदा, कैफा, या व्यापक रूप से यहूदी अगुवों के लिए समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: पीलातुस के संदर्भ में यह उसके सौंपे गए शासकीय और न्यायिक अधिकार को व्यक्त करता है; “शक्ति” केवल सामर्थ्य या बल का अर्थ दे सकती है।
- source_word: κατ’ ἐμοῦ οὐδεμίαν
  choice: मुझ पर तुम्हारा कोई भी अधिकार न होता
  rationale: κατά के साथ ἐξουσία यहाँ किसी पर अधिकार को दर्शाता है, और “कोई भी” οὐδεμίαν के जोर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δεδομένον σοι
  choice: तुम्हें … न दिया गया होता
  rationale: पूर्ण निष्क्रिय कृदंत को शर्तसूचक भूतकालीन रचना में रखा गया है, जिससे वर्तमान अधिकार से पहले उसके दिए जाने का भाव स्पष्ट होता है।
- source_word: ἄνωθεν
  choice: ऊपर से
  rationale: यह यूनानी शब्द का सीधा और यूहन्ना के प्रयोग के अनुकूल अर्थ है; यहाँ दैवी स्रोत की ओर संकेत है, पर मुख्य पाठ “स्वर्ग से” कहकर उसे आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पहले कथन से निकलने वाले कारणात्मक और निष्कर्षात्मक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ παραδούς μέ σοι
  choice: जिसने मुझे तुम्हारे हवाले किया है
  rationale: “हवाले किया” गिरफ्तारी और न्यायिक सुपुर्दगी के प्रसंग में स्वाभाविक है तथा कर्ता को यहूदा, कैफा या किसी समूह के रूप में पहले से निश्चित नहीं करता।
- source_word: μείζονα ἁμαρτίαν ἔχει
  choice: उसका पाप अधिक बड़ा है
  rationale: यह पीलातुस और यीशु को उसके हवाले करने वाले व्यक्ति की दोष-गंभीरता के बीच निहित तुलना को बनाए रखता है, बिना यह कहे कि पीलातुस निर्दोष था।
theological_decisions:
- issue: ἄνωθεν में पीलातुस के अधिकार का स्रोत
  choice: “ऊपर से” रखकर अधिकार के दैवी स्रोत का संकेत दिया गया है।
  alternative: “स्वर्ग से”
  rationale: प्रसंग में स्रोत परमेश्वर की ओर संकेत करता है, लेकिन पद किसी व्यापक राजनीतिक सिद्धांत को विस्तार से नहीं बताता; इसलिए मूल अभिव्यक्ति की सांकेतिकता बनाए रखी गई है।
- issue: ὁ παραδούς μέ σοι की पहचान
  choice: मुख्य पाठ में सामान्य रूप से “जिसने मुझे तुम्हारे हवाले किया है” रखा गया है।
  alternative: यहूदा, कैफा, या यहूदी अगुवे सामूहिक रूप से
  rationale: यूनानी पाठ इस व्यक्ति या पक्ष का नाम नहीं बताता। सामान्य अनुवाद वास्तविक संदिग्धता को सुरक्षित रखता है।
- issue: “अधिक बड़ा पाप” और पीलातुस की दोषिता
  choice: तुलनात्मक दोष को रखा गया है, जिससे हवाले करने वाले का पाप अधिक बड़ा बताया जाता है।
  alternative: पीलातुस को निर्दोष समझना
  rationale: μείζονα तुलना करता है; यह पीलातुस की दोषिता को नकारता नहीं, बल्कि दूसरे पक्ष की अधिक दोषिता बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली रखी गई है। “तुम्हें/तुम्हारा” मूल के एकवचन संबोधन को स्वाभाविक ढंग से दर्शाता है। “हवाले किया” न्यायिक सुपुर्दगी के प्रसंग में प्रचलित और अर्थ-सटीक है।
