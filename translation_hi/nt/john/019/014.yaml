  text: ἦν δὲ παρασκευὴ τοῦ πάσχα, ὥρα ⸂ἦν ὡς⸃ ἕκτη. καὶ λέγει τοῖς Ἰουδαίοις· Ἴδε ὁ βασιλεὺς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/014.yaml
  text: It was the day of preparation of the Passover[a]; it was about the sixth hour. And he says to the Jews, “Behold[b], your king!”
translation:
  language: hi
  text: यह फसह की तैयारी का दिन था; लगभग छठा घंटा[a] था। और वह यहूदियों[b] से कहता है, “देखो, तुम्हारा राजा!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समय गिनने की पद्धति के अनुसार आधुनिक समय में इसका अर्थ लगभग दोपहर हो सकता है।
    reason: cultural_note
  - marker: b
    text: इस प्रसंग में ‘यहूदी’ से अधिक विशेष रूप से यहूदिया के अधिकारी या यहूदी अगुए अभिप्रेत हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: παρασκευὴ τοῦ πάσχα
  choice: फसह की तैयारी का दिन
  rationale: παρασκευή यहाँ पर्व/विश्राम-दिन से पहले की तैयारी के दिन को सूचित करता है। ‘फसह की तैयारी का दिन’ संबंधवाचक यूनानी पदबंध को स्वाभाविक हिन्दी में रखता है और यह तय नहीं करता कि इससे केवल फसह-भोज की तैयारी अभिप्रेत है या फसह के समय का तैयारी-दिन।
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: लगभग छठा घंटा था
  rationale: यह अनुवाद ὡς की अनुमानसूचकता और प्राचीन समय-सूचना ‘छठा घंटा’—दोनों को सुरक्षित रखता है; आधुनिक घड़ी के अनुसार संभावित समय पादटिप्पणी में दिया गया है।
- source_word: λέγει
  choice: कहता है
  rationale: यूहन्ना के ऐतिहासिक वर्तमान को वर्तमान काल में रखकर मूल की कथात्मक सजीवता सुरक्षित की गई है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों से
  rationale: मूल पद का सीधा अर्थ रखा गया है। प्रसंग में इससे विशेष रूप से यहूदी अगुए अथवा यहूदिया के अधिकारी अभिप्रेत हो सकते हैं, पर मुख्य पाठ में उस अर्थ को अनिवार्य नहीं बनाया गया।
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक, स्वाभाविक और सार्वजनिक घोषणा के अनुरूप प्रभावशाली हिन्दी है।
- source_word: ὁ βασιλεὺς ὑμῶν
  choice: तुम्हारा राजा
  rationale: स्वाभाविक हिन्दी में अधिकार-संबंध रखते हुए कथन की राजनीतिक धार और विडंबना सुरक्षित रहती है।
theological_decisions:
- issue: यूहन्ना में ‘यहूदियों’ का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ रखा गया
  alternative: यहूदी अगुए; यहूदिया के अधिकारी
  rationale: τοῖς Ἰουδαίοις अपने आप संदर्भ को अगुओं तक सीमित नहीं करता। संभावित प्रासंगिक संकीर्ण अर्थ पादटिप्पणी में रखा गया है, ताकि न तो मूल का व्यापक शब्द बदला जाए और न उसका संदर्भगत अर्थ छिपे।
- issue: ‘छठे घंटे’ की प्राचीन समय-गणना
  choice: मुख्य पाठ में ‘लगभग छठा घंटा’ रखा गया
  alternative: लगभग दोपहर
  rationale: मूल प्राचीन समय-पद्धति में बोलता है और ὡς अनुमान व्यक्त करता है। इसे आधुनिक समय में निश्चित रूप से बदलना कालक्रम-संबंधी प्रश्न को अनावश्यक रूप से सुलझा देता; संभावित आधुनिक समतुल्य पादटिप्पणी में है।
- issue: ‘फसह की तैयारी’ का संबंध
  choice: ‘फसह की तैयारी का दिन’
  alternative: फसह के लिए तैयारी का दिन; फसह-काल का तैयारी-दिन
  rationale: τοῦ πάσχα संबंधवाचक है, पर उसका सटीक अर्थगत संबंध एक से अधिक प्रकार से समझा जा सकता है। चुना हुआ हिन्दी रूप इस वास्तविक अस्पष्टता को पर्याप्त रूप से खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘देखो’ सामान्य पाठक के लिए ‘निहारो’ से अधिक स्वाभाविक है। यूनानी ऐतिहासिक वर्तमान के कारण ‘कहता है’ रखा गया है। पादटिप्पणी-चिह्न उन्हीं पदों के बाद लगाए गए हैं जिनकी वे व्याख्या करते हैं।
