language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθησαν αὐτῷ οἱ Ἰουδαῖοι· Ἡμεῖς νόμον ἔχομεν, καὶ κατὰ τὸν ⸀νόμον ὀφείλει ἀποθανεῖν, ὅτι ⸂υἱὸν θεοῦ ἑαυτὸν⸃ ἐποίησεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/007.yaml
  text: The Jews answered him[a], “We have a law, and according to that law he ought to die[b], because he made himself the Son of God.”
translation:
  language: hi
  text: यहूदियों ने उसे उत्तर दिया, “हमारे पास एक व्यवस्था है, और उस व्यवस्था के अनुसार उसे मरना चाहिए, क्योंकि उसने अपने आपको परमेश्वर का पुत्र ठहराया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: उत्तर दिया
  rationale: कथात्मक प्रसंग में यह सामान्य और स्वाभाविक उत्तर-सूचक क्रिया है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यूनानी पद सीधे पूरे समूह का नाम देता है; इस पद में केवल अगुओं तक अर्थ को सीमित करने का स्पष्ट संकेत नहीं है।
- source_word: νόμον ἔχομεν
  choice: हमारे पास एक व्यवस्था है
  rationale: पहली बार νόμος अनिश्चित रूप में आया है। ‘एक व्यवस्था’ उसके रूप को बनाए रखते हुए स्वाभाविक हिन्दी देती है।
- source_word: κατὰ τὸν νόμον
  choice: उस व्यवस्था के अनुसार
  rationale: दूसरी बार निश्चित रूप में आया νόμος पहले बताई गई व्यवस्था की ओर लौटता है; ‘उस व्यवस्था’ इस संदर्भ-संबंध को स्पष्ट रखता है।
- source_word: ὀφείλει ἀποθανεῖν
  choice: उसे मरना चाहिए
  rationale: यह कानूनी बाध्यता का दावा व्यक्त करता है, पर उसे निरपेक्ष दैवी अनिवार्यता में नहीं बदलता।
- source_word: υἱὸν θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: व्याकरण और यूहन्ना के प्रसंग में यह विशिष्ट पुत्रत्व-संबंधी उपाधि है, किसी अनिश्चित वर्ग के एक सदस्य का उल्लेख नहीं।
- source_word: ἑαυτὸν ἐποίησεν
  choice: अपने आपको … ठहराया है
  rationale: शाब्दिक ‘अपने आपको बनाया’ हिन्दी में भ्रामक हो सकता है। ‘ठहराया’ विरोधियों के इस आरोप को स्वाभाविक रूप से व्यक्त करता है कि यीशु ने अपने लिए यह पद ग्रहण किया।
theological_decisions:
- issue: विरोधियों के आरोप में υἱὸν θεοῦ का अर्थ
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का एक पुत्र
  rationale: प्रसंग में आरोप यीशु के विशिष्ट दिव्य पुत्रत्व के दावे से संबंधित है। निश्चित उपाधि उस बल को बनाए रखती है, जबकि कथन को अनुवादक की ओर से किया गया धर्मवैज्ञानिक समर्थन नहीं बनाती।
- issue: ἑαυτὸν ἐποίησεν में आरोप की प्रकृति
  choice: अपने आपको … ठहराया है
  alternative: अपने आपको … बनाया है
  rationale: ‘ठहराया’ आत्म-घोषणा या अपने लिए पद ग्रहण करने का आरोप व्यक्त करता है और यह संकेत नहीं देता कि यीशु ने सचमुच अपने अस्तित्व या स्वभाव की रचना की।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण न्यायिक-कथात्मक लहजा रखा गया है। मूल के पहले अनिश्चित ‘एक व्यवस्था’ और फिर उसी की ओर संकेत करते ‘उस व्यवस्था’ का भेद सुरक्षित है। किसी पक्ष की पहचान को मूल से अधिक संकीर्ण नहीं किया गया।
