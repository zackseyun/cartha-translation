  text: ⸀σκεῦος ἔκειτο ὄξους μεστόν· ⸂σπόγγον οὖν μεστὸν τοῦ⸃ ὄξους ⸀ὑσσώπῳ περιθέντες προσήνεγκαν αὐτοῦ τῷ στόματι.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/029.yaml
  text: A container full of sour wine was lying there[b][a]; so they put a sponge full of the sour wine on hyssop and brought it to his mouth.
translation:
  language: hi
  text: वहाँ खट्टी दाखमदिरा[a] से भरा एक पात्र रखा था। इसलिए उन्होंने उस खट्टी दाखमदिरा से भरे एक स्पंज को जूफ़े पर लगाया[b] और उसे उसके मुँह तक ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सिरका।’ यूनानी शब्द खट्टी दाखमदिरा अथवा सिरके के लिए प्रयुक्त हो सकता है; यहाँ संभवतः सैनिकों के लिए उपलब्ध खट्टी दाखमदिरा का पेय अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जूफ़े की डाली पर लगाया’ अथवा ‘जूफ़े के सहारे लगाया।’ यूनानी में केवल ‘जूफ़े पर/से’ है; क्रिया का ठीक दृश्य निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκεῦος
  choice: पात्र
  rationale: यह सामान्य शब्द किसी बर्तन या पात्र को दर्शाता है; ‘पात्र’ उसके प्रकार को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक और गरिमापूर्ण है।
- source_word: ἔκειτο
  choice: रखा था
  rationale: यह रूप किसी वस्तु के वहाँ स्थित होने की अवस्था बताता है; ‘रखा था’ आधुनिक हिन्दी में दृश्य की पृष्ठभूमि स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: ὄξους
  choice: खट्टी दाखमदिरा
  rationale: संदर्भ में यह सैनिकों के लिए उपलब्ध सस्ती, खट्टी हो चुकी दाखमदिरा को सूचित कर सकता है। यह अनुवाद पेय का स्वरूप स्पष्ट करता है, जबकि ‘सिरका’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में रखा गया है।
- source_word: μεστόν / μεστὸν
  choice: से भरा / से भरे
  rationale: विशेषण की ‘भरा हुआ’ अर्थवत्ता दोनों बार बनाए रखी गई है और हिन्दी वाक्य के अनुसार लिंग-कारक का स्वाभाविक रूप अपनाया गया है।
- source_word: σπόγγον
  choice: एक स्पंज
  rationale: यह मूल शब्द का सीधा और आधुनिक हिन्दी में प्रचलित समतुल्य है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पहले कही गई बात के फलस्वरूप हुई अगली क्रिया को जोड़ता है; ‘इसलिए’ कथात्मक संबंध स्पष्ट रखता है।
- source_word: ὑσσώπῳ
  choice: जूफ़े पर
  rationale: दत्तिव कारक साधन अथवा किसी वस्तु पर लगाने—दोनों की संभावना रखता है। ‘जूफ़े पर’ यूनानी की संक्षिप्तता और संभावित धार्मिक-सांस्कृतिक अनुगूँज बचाए रखता है।
- source_word: περιθέντες
  choice: लगाया
  rationale: कृदन्त मुख्य क्रिया से पहले की गई क्रिया बताता है; हिन्दी में इसे क्रमबद्ध समापिका क्रिया के रूप में कहना स्वाभाविक है।
- source_word: προσήνεγκαν
  choice: ले गए
  rationale: क्रिया का अर्थ किसी वस्तु को पास लाना या प्रस्तुत करना है। ‘मुँह तक ले गए’ शारीरिक क्रिया को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: αὐτοῦ τῷ στόματι
  choice: उसके मुँह तक
  rationale: संदर्भ में सर्वनाम यीशु को सूचित करता है; मूल का सर्वनाम बनाए रखते हुए हिन्दी में लक्ष्य का भाव ‘तक’ से स्वाभाविक रूप से व्यक्त हुआ है।
theological_decisions:
- issue: ὑσσώπῳ में जूफ़े की ऐतिहासिक और उपासना-संबंधी अनुगूँज
  choice: मुख्य पाठ में ‘जूफ़े’ को बनाए रखा गया है, पर उसके प्रतीकवाद की व्याख्या नहीं जोड़ी गई।
  alternative: ‘जूफ़े की डाली पर’ कहना या इसे सामान्य ‘डंडी’ के रूप में प्रस्तुत करना।
  rationale: यह शब्द फसह या शुद्धिकरण की ओर संकेत कर सकता है, किंतु पद स्वयं उस प्रतीकवाद को स्पष्ट नहीं करता। ‘जूफ़ा’ मूल की संभावित धर्मवैचारिक अनुगूँज को बिना किसी विशेष व्याख्या को थोपे सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पात्र’ वस्तु का प्रकार अनिश्चित रखता है, ‘स्पंज’ सामान्य आधुनिक शब्द है, और ‘जूफ़ा’ बाइबलीय वनस्पति-संज्ञा तथा उसकी संभावित अनुगूँज को सुरक्षित रखता है।
