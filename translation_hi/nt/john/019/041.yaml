source:
  edition: SBLGNT
  text: ἦν δὲ ἐν τῷ τόπῳ ὅπου ἐσταυρώθη κῆπος, καὶ ἐν τῷ κήπῳ μνημεῖον καινόν, ἐν ᾧ οὐδέπω οὐδεὶς ⸂ἦν τεθειμένος⸃·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/041.yaml
  text: In the place where he was crucified there was a garden, and in the garden a new tomb, in which no one had yet been laid.
translation:
  language: hi
  text: जिस स्थान पर उसे क्रूस पर चढ़ाया गया था, वहाँ एक बगीचा था, और उस बगीचे में एक नई कब्र थी, जिसमें अभी तक किसी को नहीं रखा गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द के रूप में नहीं
  rationale: यहाँ δὲ हल्का कथात्मक संक्रमण करता है; हिन्दी में वाक्य के स्वाभाविक प्रवाह से यह संबंध स्पष्ट है, इसलिए ‘अब’ या विरोधसूचक ‘परन्तु’ जोड़ना अनावश्यक है।
- source_word: τόπῳ
  choice: स्थान
  rationale: τόπος के लिए ‘स्थान’ सीधा, स्वाभाविक और प्रसंगानुकूल हिन्दी पर्याय है।
- source_word: ὅπου ἐσταυρώθη
  choice: जहाँ उसे क्रूस पर चढ़ाया गया था
  rationale: यूनानी कर्मवाच्य को हिन्दी में कर्मवाच्य रूप में रखा गया है; ‘उसे’ का संदर्भ पिछले प्रसंग से स्पष्ट है।
- source_word: κῆπος
  choice: बगीचा
  rationale: κῆπος का सामान्य अर्थ बगीचा है; ‘बाग’ भी संभव है, पर ‘बगीचा’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: μνημεῖον
  choice: कब्र
  rationale: यहाँ शब्द शव रखे जाने वाली दफन-स्थली को दर्शाता है। आधुनिक हिन्दी बाइबलीय और सामान्य प्रयोग में ‘कब्र’ स्वाभाविक है और केवल मिट्टी के गड्ढे तक सीमित नहीं समझी जाती।
- source_word: καινόν
  choice: नई
  rationale: विशेषण का मूल अर्थ ‘नई’ है; उसके अब तक अप्रयुक्त होने की बात अगला उपवाक्य अलग से बताता है।
- source_word: ἐν ᾧ
  choice: जिसमें
  rationale: यह संबंधवाचक पद निकटवर्ती स्त्रीलिंग संज्ञा ‘कब्र’ की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: οὐδέπω οὐδεὶς
  choice: अभी तक किसी को नहीं
  rationale: यह पदबंध समयगत अर्थ और पूर्ण निषेध—अब तक एक भी व्यक्ति नहीं—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἦν τεθειμένος
  choice: रखा गया था
  rationale: परिप्रयुक्त पूर्वकाल पहले से पूरी हो चुकी अवस्था बताता है। दफन के प्रसंग में ‘रखा गया था’ स्वाभाविक है और क्रिया में स्रोत से अधिक विवरण नहीं जोड़ता।
theological_decisions:
- issue: μνημεῖον और τεθειμένος की दफन-संदर्भित भाषा
  choice: कब्र ... रखा गया था
  alternative: समाधि ... लिटाया गया था
  rationale: ‘कब्र’ और ‘रखा गया था’ ठोस दफन-प्रसंग को स्पष्ट रखते हैं, पर दफन की रीति या कब्र की बनावट के बारे में स्रोत से अधिक अर्थ नहीं जोड़ते।
- issue: ἐσταυρώθη का वाच्य
  choice: उसे क्रूस पर चढ़ाया गया था
  alternative: उन्होंने उसे क्रूस पर चढ़ाया था
  rationale: कर्मवाच्य रूप यूनानी संरचना को बनाए रखता है और इस उपवाक्य में किसी अनुल्लिखित कर्ता को स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। वाक्य की दोहरी स्थान-संरचना—क्रूस पर चढ़ाए जाने का स्थान, फिर उसी बगीचे में कब्र—स्रोत के कथात्मक क्रम के अनुरूप संरक्षित है।
