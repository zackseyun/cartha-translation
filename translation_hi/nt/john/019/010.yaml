base_translation:
  language: en
  yaml_path: translation/nt/john/019/010.yaml
  text: So Pilate said to him[a], “Will you not speak to me? Do you not know that I have authority to release you and authority to crucify you?”
translation:
  language: hi
  text: तब पिलातुस ने उससे कहा, “क्या तुम मुझसे नहीं बोलोगे? क्या तुम नहीं जानते कि मुझे तुम्हें छोड़ देने का अधिकार[a] है और तुम्हें क्रूस पर चढ़ाने का भी अधिकार है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सत्ता”; यूनानी शब्द का अर्थ अधिकार, प्राधिकार या सामर्थ्य हो सकता है। यहाँ न्यायिक और शासकीय प्रसंग के कारण “अधिकार” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν αὐτῷ ὁ Πιλᾶτος
  choice: तब पिलातुस ने उससे कहा
  rationale: οὖν यहाँ कथा को आगे बढ़ाने वाला संयोजक है; ‘तब’ क्रम और प्रसंगगत परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। αὐτῷ को ‘उससे’ के रूप में स्पष्ट रखा गया है।
- source_word: Ἐμοὶ οὐ λαλεῖς
  choice: क्या तुम मुझसे नहीं बोलोगे?
  rationale: आरम्भ में आए Ἐμοὶ का बल ‘मुझसे’ पर है। प्रश्नवाचक भविष्याभिमुख हिन्दी प्रयोग पिलातुस के आहत और धौंसपूर्ण स्वर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ οἶδας ὅτι
  choice: क्या तुम नहीं जानते कि
  rationale: οἶδα का सीधा अर्थ ‘जानना’ है; यह अनावश्यक व्याख्या किए बिना आलंकारिक प्रश्न बनाए रखता है।
- source_word: ἐξουσίαν ἔχω
  choice: मुझे ... का अधिकार है
  rationale: ἐξουσία कानूनी-शासकीय प्रसंग में अधिकार या प्राधिकार को सूचित करता है। सामान्य आधुनिक हिन्दी में ‘मुझे ... का अधिकार है’ सबसे सहज है; यह पिलातुस के दावे को प्रस्तुत करता है, उसकी वैधता की पुष्टि नहीं करता।
- source_word: ἀπολῦσαί σε
  choice: तुम्हें छोड़ देने
  rationale: न्यायिक प्रसंग में ἀπολύω का अर्थ हिरासत या दंड से छोड़ना है। ‘छोड़ देने’ स्वाभाविक है और इसे निर्दोष ठहराए जाने के अर्थ तक नहीं बढ़ाता।
- source_word: καὶ ἐξουσίαν ἔχω σταυρῶσαί σε
  choice: और तुम्हें क्रूस पर चढ़ाने का भी अधिकार है
  rationale: दोनों विपरीत परिणामों के लिए ἐξουσία की पुनरावृत्ति हिन्दी में ‘अधिकार’ दोहराकर और ‘भी’ लगाकर सुरक्षित रखी गई है।
- source_word: σταυρῶσαί σε
  choice: तुम्हें क्रूस पर चढ़ाने
  rationale: यह क्रिया का सीधा अनुवाद है। पिलातुस इसे दूसरों के द्वारा कार्यान्वित करा सकता था, फिर भी यूनानी पाठ स्वयं क्रिया को सीधे कहता है।
theological_decisions:
- issue: पिलातुस द्वारा दावा की गई ἐξουσία का स्वरूप
  choice: ‘अधिकार’ के रूप में अनुवाद, बिना उसके दावे की वैधता या निरपेक्षता की पुष्टि किए
  alternative: ‘सामर्थ्य’ या ‘सत्ता’
  rationale: पद पिलातुस का दावा बताता है; वह रोमी शासन की स्वायत्त या परम प्रभुता पर कथावाचक की मुहर नहीं लगाता। अगला पद इस दावे को जिस तनाव में रखता है, उसे यहाँ खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पिलातुस के प्रश्नों का धौंसपूर्ण स्वर और ‘मुझसे’ का बल बनाए रखा गया है।
