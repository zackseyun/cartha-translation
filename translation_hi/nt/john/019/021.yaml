source:
  edition: SBLGNT
  text: ἔλεγον οὖν τῷ Πιλάτῳ οἱ ἀρχιερεῖς τῶν Ἰουδαίων· Μὴ γράφε· Ὁ βασιλεὺς τῶν Ἰουδαίων, ἀλλ’ ὅτι ἐκεῖνος εἶπεν Βασιλεὺς ⸂τῶν Ἰουδαίων εἰμί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/021.yaml
  text: So the chief priests of the Jews were saying to Pilate[a], “Do not write, ‘The King of the Jews,’ but that he said[b], ‘I am King of the Jews.’”
translation:
  language: hi
  text: इसलिए यहूदियों[a] के प्रधान याजक पिलातुस से कहते रहे, “मत लिखिए, ‘यहूदियों का राजा,’ बल्कि लिखिए कि उसने कहा, ‘मैं यहूदियों का राजा हूँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के लोगों।” यूनानी शब्द का अर्थ संदर्भ के अनुसार सामान्य रूप से “यहूदी” या अधिक विशेष रूप से “यहूदिया के लोग” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγον
  choice: कहते रहे
  rationale: अपूर्ण भूतकाल चलती या बार-बार की जा रही विनती को व्यक्त करता है; ‘कहते रहे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पूर्ववर्ती घटनाक्रम से निष्कर्ष अथवा कथात्मक संबंध दिखाता है; ‘इसलिए’ इसके संयोजक बल को स्पष्ट रखता है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन यहाँ प्रमुख याजकीय अधिकारियों के लिए है, न कि एक ही समय में अनेक महायाजकों के पद पर होने के दावे के रूप में।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों के / यहूदियों का
  rationale: यूहन्ना के दुःखभोग-वृत्तांत में यह प्रचलित राजनीतिक-धार्मिक पदवी ‘यहूदियों का राजा’ से जुड़ा है; हिन्दी में यही मान्य और सहज रूप है।
- source_word: Μὴ γράφε
  choice: यह मत लिखिए
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है; पिलातुस को संबोधित आदरसूचक रूप हिन्दी में स्वाभाविक है।
- source_word: ἀλλ’ ὅτι ἐκεῖνος εἶπεν
  choice: बल्कि यह लिखिए कि उसने कहा था
  rationale: मूल यूनानी अपेक्षित संशोधन का विषय बताता है। हिन्दी में ‘यह लिखिए’ को स्पष्ट रूप से दोहराना अर्थ को बदले बिना वाक्य को स्वाभाविक बनाता है; ἐκεῖνος का संकेत ‘उसने’ में बना रहता है।
- source_word: Βασιλεὺς τῶν Ἰουδαίων εἰμί
  choice: मैं यहूदियों का राजा हूँ
  rationale: विधेय पदवी में यूनानी लेख का अभाव हिन्दी में किसी अनिश्चित अर्थ की माँग नहीं करता; यह स्वाभाविक रूप पदवीगत अर्थ को ठीक से व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के दुःखभोग-वृत्तांत में Ἰουδαίων का अर्थ
  choice: यहूदियों
  alternative: यहूदिया के लोगों / यहूदियों
  rationale: तात्कालिक संदर्भ शिलालेख की स्थापित पदवी ‘यहूदियों का राजा’ है। ‘यहूदियों’ इसे सहज रूप से सुरक्षित रखता है; जातीय या क्षेत्रीय दायरे को उससे अधिक संकीर्ण नहीं किया गया जितना संदर्भ माँगता है।
- issue: ἐκεῖνος में संभावित दूरी या तिरस्कार
  choice: उसने
  alternative: उस व्यक्ति ने
  rationale: संकेतवाचक सर्वनाम दूरी जता सकता है, पर यहाँ तिरस्कार निश्चित नहीं है। मुख्य पाठ में स्वाभाविक ‘उसने’ रखकर अनावश्यक भावार्थ नहीं जोड़ा गया।
- issue: विधेय βασιλεύς के साथ लेख का अभाव
  choice: मैं यहूदियों का राजा हूँ
  alternative: मैं यहूदियों का एक राजा हूँ
  rationale: यूनानी में लेख का न होना यहाँ अनिश्चित ‘एक’ को बाध्य नहीं करता। हिन्दी में निश्चित पदवी का स्वाभाविक रूप मूल कथन की राजनीतिक-धार्मिक धार को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, आदरसूचक और कथात्मक है। ‘पिलातुस’ के साथ ‘लिखिए’ सामाजिक संबोधन के अनुरूप है। उद्धरण-स्तरों को सरल रखा गया है, और ‘कहते रहे’ से यूनानी अपूर्ण भूतकाल का पक्ष सुरक्षित है।
