id: JHN.19.20
reference: John 19:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτον οὖν τὸν τίτλον πολλοὶ ἀνέγνωσαν τῶν Ἰουδαίων, ὅτι ἐγγὺς ἦν ὁ τόπος τῆς πόλεως ὅπου ἐσταυρώθη ὁ Ἰησοῦς· καὶ ἦν γεγραμμένον Ἑβραϊστί, ⸂Ῥωμαϊστί, Ἑλληνιστί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/020.yaml
  text: Therefore many of the Jews read this inscription[a], because the place where Jesus was crucified was near the city; and it was written in Hebrew, in Latin, and in Greek.
translation:
  language: hi
  text: इसलिए यहूदियों में से बहुतों ने उस लेख को पढ़ा, क्योंकि वह स्थान जहाँ यीशु को क्रूस पर चढ़ाया गया था, नगर के पास था; और वह इब्रानी[a], लातीनी और यूनानी भाषाओं में लिखा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः ‘अरामी’; यूहन्ना स्थानीय सामी भाषा के लिए ‘इब्रानी’ शब्द का प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίτλον
  choice: लेख
  rationale: क्रूस पर लगाई गई लिखित सूचना के लिए ‘लेख’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है; ‘शीर्षक’ यहाँ भ्रामक हो सकता है।
- source_word: πολλοὶ ... τῶν Ἰουδαίων
  choice: यहूदियों में से बहुतों ने
  rationale: यह अनुवाद संबंधकारक की अंशवाचक भावना को बनाए रखता है और सभी यहूदियों के बारे में व्यापक कथन करने से बचता है।
- source_word: ἀνέγνωσαν
  choice: पढ़ा
  rationale: क्रिया लिखी हुई सूचना को पढ़ने की सामान्य क्रिया बताती है; मूल पाठ में ‘ज़ोर से’ पढ़ने का स्पष्ट संकेत नहीं है।
- source_word: ἐγγὺς ἦν ὁ τόπος τῆς πόλεως
  choice: वह स्थान ... नगर के पास था
  rationale: यह यूनानी वाक्य की सीधी भावना व्यक्त करता है और नगर-द्वार जैसी कोई अतिरिक्त बात नहीं जोड़ता।
- source_word: ὅπου ἐσταυρώθη ὁ Ἰησοῦς
  choice: जहाँ यीशु को क्रूस पर चढ़ाया गया था
  rationale: कर्मवाच्य रूप को स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है और किसी अनकहे कर्ता को नहीं जोड़ा गया।
- source_word: γεγραμμένον
  choice: लिखा हुआ था
  rationale: यह पूर्ण कृदंत से व्यक्त उस विद्यमान अवस्था को बनाए रखता है कि लेख वहाँ लिखा हुआ उपस्थित था।
- source_word: Ἑβραϊστί
  choice: इब्रानी
  rationale: मुख्य पाठ यूनानी की स्पष्ट शब्दावली को बनाए रखता है; यूहन्ना के प्रयोग में स्थानीय सामी भाषा, संभवतः अरामी, अभिप्रेत होने की संभावना पादटिप्पणी में दी गई है।
- source_word: Ῥωμαϊστί
  choice: लातीनी
  rationale: शाब्दिक ‘रोमी’ के स्थान पर उस भाषा का प्रचलित हिन्दी नाम दिया गया है जिसका यूनानी क्रियाविशेषण संकेत करता है।
- source_word: Ἑλληνιστί
  choice: यूनानी
  rationale: यह भाषा-सूचक यूनानी क्रियाविशेषण का सीधा और मानक हिन्दी रूप है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद से जुड़े कथात्मक और तार्किक परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के प्रयोग में Ἑβραϊστί का अर्थ
  choice: मुख्य पाठ में ‘इब्रानी’
  alternative: अरामी
  rationale: यूनानी पाठ स्पष्ट रूप से ‘इब्रानी’ कहता है, इसलिए मूल-पाठ की प्रधानता के अनुसार वही मुख्य अनुवाद है। फिर भी यह शब्द स्थानीय सामी बोलचाल की भाषा, संभवतः अरामी, के लिए प्रयुक्त हो सकता है; इस वास्तविक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘यहूदियों में से बहुतों’ से मूल की अंशवाचक रचना सुरक्षित रहती है, और तीनों भाषाओं के नाम सामान्य हिन्दी बाइबलीय प्रयोग के अनुरूप हैं।
