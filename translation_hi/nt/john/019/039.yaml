base_translation:
  language: en
  yaml_path: translation/nt/john/019/039.yaml
  text: Nicodemus also came—the one who had first come to him at night—bringing a mixture of myrrh and aloes[b][a], about a hundred litras.
translation:
  language: hi
  text: निकोदेमुस भी आया—वही जो पहले उसके पास रात में आया था[a]—और वह गन्धरस और अगरु का मिश्रण, लगभग सौ लीत्रा[b], लाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह पहले रात में यीशु के पास आया था; देखें यूहन्ना 3:1–2।
    reason: cross_reference
  - marker: b
    text: एक लीत्रा रोमी पौंड था, जिसका भार लगभग 327 ग्राम था; सौ लीत्रा का भार लगभग 32–33 किलोग्राम था।
    reason: cultural_note
lexical_decisions:
- source_word: ἦλθεν δὲ καὶ
  choice: निकोदेमुस भी आया
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है और καί निकोदेमुस को पहले बताए गए यूसुफ के साथ जोड़ता है। हिन्दी में ‘भी आया’ इस योगात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Νικόδημος
  choice: निकोदेमुस
  rationale: नाम का प्रचलित हिन्दी लिप्यन्तरण अपनाया गया है।
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν νυκτὸς τὸ πρῶτον
  choice: वही जो पहले रात को उसके पास आया था
  rationale: संज्ञीकृत कृदन्त निकोदेमुस की पहचान बताता और यूहन्ना 3:1–2 की घटना स्मरण कराता है। ‘पहले’ τὸ πρῶτον के पूर्वकालिक अर्थ को रखता है, जबकि ‘उसके’ मूल सर्वनाम αὐτόν को अनावश्यक रूप से नाम में नहीं बदलता।
- source_word: φέρων
  choice: वह ... मिश्रण लाया
  rationale: वर्तमान कृदन्त निकोदेमुस के आने के साथ जुड़ी परिस्थिति बताता है। हिन्दी में अलग वाक्य के रूप में ‘लाया’ अधिक सहज है और क्रिया का सम्बन्ध स्पष्ट रखता है।
- source_word: μίγμα σμύρνης καὶ ἀλόης
  choice: गन्धरस और अगरु का मिश्रण
  rationale: μίγμα का अर्थ ‘मिश्रण’, σμύρνη का ‘गन्धरस’ और ἀλόη का यहाँ दफ़न की तैयारी में प्रयुक्त सुगन्धित अगरु है; यह आधुनिक एलोवेरा पौधे का संकेत नहीं है।
- source_word: ὡς
  choice: लगभग
  rationale: परिमाण के साथ ὡς अनुमान व्यक्त करता है; ‘लगभग’ आधुनिक हिन्दी में सटीक और स्वाभाविक है।
- source_word: λίτρας ἑκατόν
  choice: सौ लीत्रा
  rationale: प्राचीन रोमी माप को लिप्यन्तरित रूप में रखने से उसे आधुनिक पाउंड या किलोग्राम के बराबर बताने की भ्रामक सटीकता से बचा जाता है; आधुनिक तुल्यता पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: पहचानसूचक उपवाक्य में αὐτόν का सन्दर्भ
  choice: ‘उसके’ से यीशु अभिप्रेत है
  alternative: ‘यीशु के पास’ कहकर सन्दर्भ को स्पष्ट करना
  rationale: कथानक यूहन्ना 3:1–2 में निकोदेमुस के यीशु के पास आने की ओर संकेत करता है। फिर भी मूल पाठ के सर्वनाम को बनाए रखने के लिए मुख्य पाठ में ‘उसके’ रखा गया है; निकटवर्ती प्रसंग से उसका सन्दर्भ स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अगरु’ सुगन्धित दफ़न-सामग्री का अर्थ स्पष्ट करता है और एलोवेरा वाली आधुनिक धारणा से बचाता है। मूल के एक लम्बे वाक्य को पठनीय हिन्दी के लिए दो वाक्यों में बाँटा गया है।
