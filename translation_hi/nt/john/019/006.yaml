id: JHN.19.6
reference: John 19:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτε οὖν εἶδον αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ ὑπηρέται ἐκραύγασαν λέγοντες· Σταύρωσον ⸀σταύρωσον. λέγει αὐτοῖς ὁ Πιλᾶτος· Λάβετε αὐτὸν ὑμεῖς καὶ σταυρώσατε, ἐγὼ γὰρ οὐχ εὑρίσκω ἐν αὐτῷ αἰτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/006.yaml
  text: So when the chief priests and the officers saw him[a], they cried out, saying, “Crucify him! Crucify him!” Pilate said to them, “You take him and crucify him[b], for I find no charge against him.”
translation:
  language: hi
  text: इसलिए जब प्रधान याजकों और अधिकारियों ने उसे देखा, तो वे चिल्ला उठे, “उसे क्रूस पर चढ़ाओ! क्रूस पर चढ़ाओ!” पिलातुस ने उनसे कहा, “तुम ही[a] उसे ले जाओ और क्रूस पर चढ़ाओ, क्योंकि मुझे उसमें आरोप लगाने का कोई आधार नहीं मिलता[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में “तुम” स्पष्ट रूप से आया है और उस पर बल है; अर्थ यह भी व्यक्त किया जा सकता है: “तुम स्वयं उसे ले जाओ।”'
    reason: emphasis
  - marker: b
    text: या, “मुझे उसमें कोई दोष नहीं मिलता।” यूनानी शब्द का अर्थ कानूनी आरोप अथवा आरोप लगाने का आधार भी हो सकता है; यहाँ न्यायिक अर्थ प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε οὖν
  choice: इसलिए जब
  rationale: ὅτε के समय-सूचक अर्थ और οὖν के निष्कर्षात्मक/कथानक-संयोजक बल, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह बहुवचन यरूशलेम के प्रमुख याजकीय नेतृत्व को दर्शाता है; ‘प्रधान याजक’ आधुनिक हिन्दी में सटीक और प्रचलित है।
- source_word: ὑπηρέται
  choice: अधिकारी
  rationale: यूहन्ना के प्रसंग में यह यहूदी नेतृत्व के अधीन कार्य करने वाले आधिकारिक सेवकों को सूचित करता है। ‘अधिकारी’ संस्थागत अर्थ बनाए रखता है और पद या स्थान को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: ἐκραύγασαν λέγοντες
  choice: वे चिल्ला उठे
  rationale: ऊँची और तीखी सार्वजनिक पुकार का भाव स्वाभाविक हिन्दी में व्यक्त करता है; अलग से ‘कहते हुए’ जोड़ना हिन्दी में अनावश्यक और बोझिल होता।
- source_word: Σταύρωσον σταύρωσον
  choice: उसे क्रूस पर चढ़ाओ! क्रूस पर चढ़ाओ!
  rationale: दोहराव का प्रबल आलंकारिक प्रभाव सुरक्षित है। यूनानी में कर्म प्रसंग से स्पष्ट है, जबकि हिन्दी में पहली आज्ञा के साथ ‘उसे’ जोड़ना स्वाभाविक स्पष्टता देता है।
- source_word: Λάβετε αὐτὸν ὑμεῖς
  choice: तुम ही उसे ले जाओ
  rationale: स्पष्ट सर्वनाम ὑμεῖς के विरोधात्मक बल को ‘तुम ही’ व्यक्त करता है—अर्थात पिलातुस स्वयं यह काम करने से दूरी बना रहा है।
- source_word: σταυρώσατε
  choice: क्रूस पर चढ़ाओ
  rationale: क्रूस पर मृत्युदंड देने की आज्ञा का सटीक, स्थापित और समझने योग्य हिन्दी रूप।
- source_word: αἰτίαν
  choice: आरोप लगाने का कोई आधार
  rationale: न्यायिक प्रसंग में αἰτία किसी कानूनी आरोप, आरोप के कारण या मुकदमे के आधार को दर्शाता है। यह अनुवाद केवल सामान्य नैतिक ‘दोष’ कहने की अपेक्षा विधिक अर्थ को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: यीशु के विषय में पिलातुस का न्यायिक निष्कर्ष
  choice: मुझे उसमें आरोप लगाने का कोई आधार नहीं मिलता
  alternative: मुझे उसमें कोई दोष नहीं मिलता
  rationale: यह कथन तत्कालीन मुकदमे में पिलातुस के कानूनी आकलन को व्यक्त करता है। चुना हुआ रूप यीशु की निर्दोषता का प्रसंगगत अर्थ बनाए रखते हुए इसे व्यापक धर्मवैज्ञानिक घोषणा में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायिक प्रसंग को स्पष्ट करने के लिए ‘आरोप लगाने का कोई आधार’ चुना गया है; ‘तुम ही’ पिलातुस और अभियोग लगाने वालों के बीच निहित विरोध को सुरक्षित रखता है।
