  text: ἦλθον οὖν οἱ στρατιῶται, καὶ τοῦ μὲν πρώτου κατέαξαν τὰ σκέλη καὶ τοῦ ἄλλου τοῦ συσταυρωθέντος αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/032.yaml
  text: So the soldiers came and broke the legs of the first man[b][a], and of the other who had been crucified with him.
translation:
  language: hi
  text: इसलिए सैनिक आए और उन्होंने पहले व्यक्ति की टाँगें तोड़ीं और उस दूसरे व्यक्ति की भी, जिसे यीशु के साथ क्रूस पर चढ़ाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद के आदेश के परिणामस्वरूप आगे बढ़ती घटना को दर्शाता है; ‘इसलिए’ उस कारणात्मक प्रवाह को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ στρατιῶται
  choice: सैनिक
  rationale: इस प्रसंग में रोमी सैन्यकर्मियों के लिए मानक, स्पष्ट और स्वाभाविक शब्द।
- source_word: τοῦ μὲν πρώτου
  choice: पहले व्यक्ति की
  rationale: यूनानी में संज्ञा निहित है; हिन्दी में ‘व्यक्ति’ जोड़ने से उन दो क्रूस पर चढ़ाए गए लोगों में पहले का संकेत स्पष्ट होता है।
- source_word: κατέαξαν τὰ σκέλη
  choice: टाँगें तोड़ीं
  rationale: क्रिया और उसके कर्म का सीधा, प्रसंगानुकूल तथा सहज हिन्दी अनुवाद।
- source_word: τοῦ ἄλλου
  choice: उस दूसरे की भी
  rationale: यह यीशु के साथ क्रूस पर चढ़ाए गए दूसरे व्यक्ति को सूचित करता है; ‘की भी’ से ‘टाँगें तोड़ीं’ का लोप स्वाभाविक रूप से पूरा होता है।
- source_word: τοῦ συσταυρωθέντος αὐτῷ
  choice: जिसे उसके साथ क्रूस पर चढ़ाया गया था
  rationale: विशेषणात्मक कृदंत को स्वाभाविक सम्बन्धवाचक उपवाक्य में व्यक्त किया गया है; ‘उसके साथ’ का संदर्भ प्रसंगानुसार यीशु है।
theological_decisions:
- issue: αὐτῷ का संदर्भ
  choice: ‘उसके साथ’ अर्थात यीशु के साथ
  alternative: पहले व्यक्ति के साथ
  rationale: यूहन्ना के क्रूसारोपण-वृत्तांत में दोनों अन्य व्यक्तियों की पहचान यीशु के सम्बन्ध में होती है; इस कारण एकवचन सर्वनाम का सबसे स्वाभाविक संदर्भ यीशु है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यूनानी की संक्षिप्त समानांतर रचना को ‘उस दूसरे की भी’ द्वारा रखा गया है, जिससे अनावश्यक पुनरुक्ति के बिना अर्थ स्पष्ट रहता है।
