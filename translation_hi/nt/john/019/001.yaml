  text: Then Pilate took Jesus and flogged him[a].
translation:
  language: hi
  text: तब पिलातुस ने यीशु को लिया और उसे कोड़े लगाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, प्रशासनिक अर्थ में: “उसे कोड़े लगवाए।”'
    reason: मूल यूनानी में पिलातुस दोनों क्रियाओं का व्याकरणिक कर्ता है, पर यह स्पष्ट नहीं किया गया कि उसने स्वयं दंड दिया या अपने अधीन लोगों से दिलवाया।
lexical_decisions:
- source_word: Τότε
  choice: तब
  rationale: यह क्रियाविशेषण कथा में अगली घटना का समय और क्रम बताता है; आधुनिक हिन्दी में ‘तब’ संक्षिप्त और स्वाभाविक है।
- source_word: οὖν
  choice: — (वाक्य के प्रवाह में निहित)
  rationale: यह तर्कात्मक अथवा कथात्मक प्रगति दिखाता है। हिन्दी में ‘तब’ और वाक्यक्रम मिलकर इसका भाव पर्याप्त रूप से व्यक्त करते हैं; अलग से ‘इसलिए’ जोड़ना कारण-परिणाम को आवश्यकता से अधिक स्पष्ट कर सकता है।
- source_word: ἔλαβεν
  choice: लिया
  rationale: λαμβάνω का सामान्य अर्थ ‘लेना’ है। यह मूल पाठ की सीधी अभिव्यक्ति को बनाए रखता है और ‘पकड़ लिया’ जैसी अधिक बलपूर्ण व्याख्या से बचता है।
- source_word: ὁ Πιλᾶτος
  choice: पिलातुस
  rationale: व्यक्ति के नाम का हिन्दी बाइबलीय रूप; संदर्भ में उसका परिचय पहले से स्थापित है।
- source_word: τὸν Ἰησοῦν
  choice: यीशु को
  rationale: नाम का मानक हिन्दी रूप और कर्मकारक चिह्न मूल यूनानी के प्रत्यक्ष कर्म को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: ἐμαστίγωσεν
  choice: उसे कोड़े लगवाए
  rationale: μαστιγόω कोड़े से दंड देने को दर्शाता है। हिन्दी में शासकीय अधिकारी के विषय में प्रेरणार्थक ‘लगवाए’ स्वाभाविक रूप से आधिकारिक एजेंसी व्यक्त करता है, बिना दंड की कठोरता घटाए।
theological_decisions:
- issue: रोमी प्रक्रिया के संदर्भ में पिलातुस की प्रत्यक्ष अथवा प्रत्यायोजित एजेंसी
  choice: ‘उसे कोड़े लगवाए’ द्वारा पिलातुस को आदेश देने वाला आधिकारिक कर्ता व्यक्त किया गया है।
  alternative: ‘उसे कोड़े लगाए’, जो यूनानी की सतही व्याकरणिक रचना को अधिक सीधे रखता है और प्रत्यक्ष या प्रत्यायोजित क्रिया को खुला छोड़ सकता है।
  rationale: यूनानी में पिलातुस दोनों क्रियाओं का व्याकरणिक कर्ता है, पर अधिकारी के लिए सक्रिय क्रिया प्रत्यायोजित कार्य को भी व्यक्त कर सकती है। आधुनिक हिन्दी में ‘कोड़े लगाए’ प्रायः पिलातुस के स्वयं मारने का संकेत देगा; ‘लगवाए’ प्रसंगानुकूल स्वाभाविकता रखता है और उसके आधिकारिक उत्तरदायित्व को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और कथात्मक है। ‘कोड़े’ सामान्य पाठक के लिए स्पष्ट है तथा ‘कोड़े मारे’ की अपेक्षा दंड की औपचारिक प्रकृति को बेहतर व्यक्त करता है।
