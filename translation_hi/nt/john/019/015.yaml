id: JHN.19.15
reference: John 19:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἐκραύγασαν οὖν ἐκεῖνοι⸃· Ἆρον ἆρον, σταύρωσον αὐτόν. λέγει αὐτοῖς ὁ Πιλᾶτος· Τὸν βασιλέα ὑμῶν σταυρώσω; ἀπεκρίθησαν οἱ ἀρχιερεῖς· Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/015.yaml
  text: So they cried out[a], “Away, away! Crucify him!” Pilate said to them, “Shall I crucify your king?” The chief priests answered, “We have no king except Caesar.”
translation:
  language: hi
  text: इस पर वे चिल्लाए, “हटा दो! हटा दो! उसे क्रूस पर चढ़ाओ!” पिलातुस ने उनसे कहा, “क्या मैं तुम्हारे राजा को क्रूस पर चढ़ाऊँ?” प्रधान याजकों ने उत्तर दिया, “कैसर के सिवा हमारा कोई राजा नहीं है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκραύγασαν οὖν ἐκεῖνοι
  choice: इस पर वे चिल्लाए
  rationale: οὖν को प्रसंग के परिणाम या अगली प्रतिक्रिया के रूप में स्वाभाविक हिन्दी ‘इस पर’ से व्यक्त किया गया है। ἐκραύγασαν की ऊँची और तीखी सामूहिक पुकार के लिए ‘चिल्लाए’ उपयुक्त है; ἐκεῖνοι का पृथक बल हिन्दी के ‘वे’ में पर्याप्त रूप से बना रहता है।
- source_word: Ἆρον ἆρον
  choice: हटा दो! हटा दो!
  rationale: दोहराया गया आज्ञार्थक रूप किसी को वहाँ से दूर कर देने की उग्र माँग है। ‘हटा दो’ पुनरुक्ति और संक्षिप्त नारे जैसी तीव्रता बनाए रखता है, जबकि यूनानी में इस वाक्यांश के साथ कर्म स्पष्ट रूप से नहीं दोहराया गया।
- source_word: σταύρωσον αὐτόν
  choice: उसे क्रूस पर चढ़ाओ
  rationale: रोमी दंड-विधान के इस प्रसंग में σταυρόω का ऐतिहासिक और प्रचलित हिन्दी समतुल्य ‘क्रूस पर चढ़ाना’ है।
- source_word: Τὸν βασιλέα ὑμῶν σταυρώσω;
  choice: क्या मैं तुम्हारे राजा को क्रूस पर चढ़ाऊँ?
  rationale: विचारार्थक subjunctive को हिन्दी के प्रश्नवाचक ‘क्या मैं … चढ़ाऊँ?’ से व्यक्त किया गया है, जिससे पिलातुस के प्रश्न की चुनौतीपूर्ण और व्यंग्यपूर्ण धार बनी रहती है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन ἀρχιερεῖς यहाँ प्रमुख याजकीय अधिकारियों को सूचित करता है; ‘प्रधान याजक’ इसका स्थापित और स्पष्ट हिन्दी रूप है।
- source_word: Οὐκ ἔχομεν βασιλέα εἰ μὴ Καίσαρα
  choice: कैसर के सिवा हमारा कोई राजा नहीं है
  rationale: εἰ μὴ की अपवादसूचक और अनन्य शक्ति ‘के सिवा … कोई नहीं’ में स्पष्ट रहती है। Καίσαρα को प्रसंग के रोमी शासकीय पदनाम ‘कैसर’ के रूप में रखा गया है।
theological_decisions:
- issue: प्रधान याजकों की राजनीतिक निष्ठा की घोषणा
  choice: कैसर के सिवा हमारा कोई राजा नहीं है
  alternative: कैसर को छोड़कर हमारा कोई राजा नहीं है
  rationale: यह रूप कथन की कठोर अनन्यता और यूहन्ना के वर्णन में उपस्थित विडंबना को बनाए रखता है, पर उससे आगे कोई सांप्रदायिक या व्यवस्थित धर्मवैज्ञानिक निष्कर्ष अनुवाद में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भीड़ की पुकार को छोटे, दोहराए गए वाक्यों में रखा गया है ताकि मूल की उग्रता सुनाई दे; शेष संवाद स्वाभाविक आधुनिक मानक हिन्दी में है।
