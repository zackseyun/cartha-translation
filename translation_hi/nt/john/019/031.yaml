source:
  edition: SBLGNT
  text: Οἱ οὖν Ἰουδαῖοι, ⸂ἐπεὶ παρασκευὴ ἦν, ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ⸃, ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου, ἠρώτησαν τὸν Πιλᾶτον ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη καὶ ἀρθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/031.yaml
  text: Therefore the Jews[a], because it was the day of preparation[d][c][b], asked Pilate that the bodies might not remain on the cross on the Sabbath—for that Sabbath day was a great one—and that their legs might be broken and they might be taken away.
translation:
  language: hi
  text: इसलिए, क्योंकि वह तैयारी का दिन था और उस सब्त का दिन विशेष महत्त्व का था, यहूदियों[a] ने पिलातुस से विनती की कि शव सब्त के दिन क्रूस पर न रहें; उनकी टाँगें तोड़ दी जाएँ और शवों को क्रूस से उतार लिया जाए[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूहन्ना के लेखन में ‘यहूदी’ शब्द कुछ प्रसंगों में अधिक विशेष रूप से यहूदी अगुवों या यहूदिया के अधिकारियों की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: d
    text: या ‘हटा दिया जाए’ अथवा ‘ले जाया जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ οὖν Ἰουδαῖοι
  choice: इसलिए यहूदियों ने
  rationale: οὖν प्रसंग में परिणाम अथवा क्रम को दिखाता है, इसलिए ‘इसलिए’ स्वाभाविक है। Ἰουδαῖοι का अर्थ यूहन्ना में प्रसंगानुसार बदल सकता है; मुख्य पाठ में व्यापक और कम व्याख्यात्मक ‘यहूदी’ रखा गया है।
- source_word: ἐπεὶ παρασκευὴ ἦν
  choice: क्योंकि वह तैयारी का दिन था
  rationale: παρασκευή सब्त से पहले तैयारी के दिन को सूचित करता है। ‘तैयारी का दिन’ आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए यूनानी के निकट है।
- source_word: ἵνα μὴ μείνῃ ἐπὶ τοῦ σταυροῦ τὰ σώματα ἐν τῷ σαββάτῳ
  choice: कि शव सब्त के दिन क्रूस पर न रहें
  rationale: ἵνα के प्रयोजनार्थक भाव को ‘कि ... न रहें’ से सहज हिन्दी में व्यक्त किया गया है; σώματα के लिए मृत्यु के प्रसंग में ‘शव’ स्वाभाविक है।
- source_word: ἦν γὰρ μεγάλη ἡ ἡμέρα ἐκείνου τοῦ σαββάτου
  choice: क्योंकि उस सब्त का दिन विशेष महत्त्व का था
  rationale: μεγάλη का मूल अर्थ ‘बड़ा/महान’ है, पर दिन के संदर्भ में इसका आशय विशेष महत्त्व से है। यह हिन्दी रूप अर्थ को स्पष्ट करता है, बिना किसी बाद की पारिभाषिक धार्मिक अभिव्यक्ति को आरोपित किए।
- source_word: ἠρώτησαν τὸν Πιλᾶτον
  choice: पिलातुस से विनती की
  rationale: ἐρωτάω यहाँ साधारण प्रश्न पूछने के बजाय शासक से अनुरोध करने के अर्थ में है; ‘विनती की’ प्रसंग के अनुरूप और स्वाभाविक है।
- source_word: ἵνα κατεαγῶσιν αὐτῶν τὰ σκέλη
  choice: उनकी टाँगें तोड़ दी जाएँ
  rationale: κατάγνυμι का अर्थ ‘तोड़ना’ है और कर्मवाच्य विधि को हिन्दी में ‘तोड़ दी जाएँ’ से सुरक्षित रखा गया है।
- source_word: καὶ ἀρθῶσιν
  choice: और उन्हें उतार लिया जाए
  rationale: αἴρω का अर्थ उठाना, हटाना या ले जाना हो सकता है। क्रूस के प्रसंग में ‘उतार लिया जाए’ स्वाभाविक है, जबकि व्यापक ‘हटा दिया जाए’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖοι का अभिप्रेत समूह
  choice: मुख्य पाठ में ‘यहूदी’
  alternative: ‘यहूदिया के लोग’ या ‘यहूदी अगुवे/अधिकारी’
  rationale: यूहन्ना में यह शब्द कभी व्यापक जातीय समूह और कभी अधिक सीमित विरोधी नेतृत्व के लिए प्रयुक्त हो सकता है। इस पद में लेखक स्वयं इसे स्पष्ट रूप से केवल अगुवों तक सीमित नहीं करता, इसलिए मुख्य पाठ में कम व्याख्यात्मक रूप रखा गया और संभावित सीमित अर्थ पादटिप्पणी में दिया गया है।
- issue: उस सब्त के लिए μεγάλη का अर्थ
  choice: ‘विशेष महत्त्व का’
  alternative: ‘महान’ या पारंपरिक ‘बड़ा दिन’
  rationale: यह वाक्य उस सब्त की असाधारण महत्ता बताता है। हिन्दी में शाब्दिक ‘महान’ अस्पष्ट या अस्वाभाविक हो सकता है; ‘विशेष महत्त्व का’ प्रसंगगत अर्थ व्यक्त करता है, पर यह नहीं बताता कि उसका महत्त्व ठीक किस धार्मिक गणना से था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की जटिल यूनानी संरचना को डैश और अर्धविराम से व्यवस्थित किया गया है। ‘शव,’ ‘क्रूस,’ ‘सब्त’ और ‘पिलातुस’ जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं; अस्पष्ट अथवा प्रसंगानुसार बदलने वाले अर्थ पादटिप्पणियों में सुरक्षित हैं।
