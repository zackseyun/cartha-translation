  text: οἱ οὖν στρατιῶται ὅτε ἐσταύρωσαν τὸν Ἰησοῦν ἔλαβον τὰ ἱμάτια αὐτοῦ καὶ ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος, καὶ τὸν χιτῶνα. ἦν δὲ ὁ χιτὼν ἄραφος, ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/023.yaml
  text: So when the soldiers had crucified Jesus[a], they took his outer garments and made four parts, a part for each soldier, and also the tunic. Now the tunic was seamless[c][b], woven from the top throughout.
translation:
  language: hi
  text: तब जब सैनिक यीशु को क्रूस पर चढ़ा चुके, तो उन्होंने उसके ऊपरी वस्त्र[a] लेकर चार भाग किए—हर सैनिक के लिए एक भाग—और कुरता भी लिया। वह कुरता बिना सीवन का[b] था और ऊपर से नीचे तक पूरा बुना हुआ था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके वस्त्र”; यूनानी शब्द व्यापक रूप से कपड़ों के लिए प्रयुक्त हो सकता है, पर यहाँ अलग बताए गए कुरते के विपरीत सम्भवतः ऊपरी वस्त्र अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या “जिसमें कोई सीवन नहीं था।”
    reason: lexical_alternative
  - marker: c
    text: या “ऊपर से पूरे का पूरा बुना हुआ था”; यूनानी अभिव्यक्ति का आशय सम्भवतः है कि पूरा कुरता ऊपर से नीचे तक एक ही टुकड़े में बुना गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ οὖν στρατιῶται
  choice: इसलिए ... सैनिक
  rationale: οὖν कथा की पिछली बात से जोड़कर घटनाक्रम आगे बढ़ाता है; ‘इसलिए’ संबंध बनाए रखता है, जबकि ‘सैनिक’ στρατιῶται का स्वाभाविक हिन्दी रूप है।
- source_word: ὅτε ἐσταύρωσαν τὸν Ἰησοῦν
  choice: जब सैनिक यीशु को क्रूस पर चढ़ा चुके
  rationale: ὅτε के साथ अओरिस्ट क्रिया अगली कार्रवाइयों से पहले पूरी हुई घटना बताती है; ‘चढ़ा चुके’ हिन्दी में क्रम स्पष्ट करता है।
- source_word: ἔλαβον τὰ ἱμάτια αὐτοῦ
  choice: उन्होंने उसके ऊपरी वस्त्र लेकर
  rationale: ἱμάτια सामान्यतः कपड़ों या वस्त्रों को कह सकता है, पर यहाँ अलग उल्लिखित χιτών के विपरीत ‘ऊपरी वस्त्र’ सबसे संभावित अर्थ है।
- source_word: ἐποίησαν τέσσαρα μέρη, ἑκάστῳ στρατιώτῃ μέρος
  choice: चार भाग किए—हर सैनिक के लिए एक भाग
  rationale: μέρος की पुनरावृत्ति और चार सैनिकों में वितरण दोनों को स्पष्ट और निकट रूप से सुरक्षित रखा गया है।
- source_word: καὶ τὸν χιτῶνα
  choice: और कुरता भी लिया
  rationale: χιτών शरीर के निकट पहना जाने वाला वस्त्र था। आधुनिक हिन्दी में ‘कुरता’ ‘अंगरखा’ से अधिक सहज है; ‘भी लिया’ ἔλαβον की साझा क्रिया तथा καί की योगात्मक शक्ति स्पष्ट करता है।
- source_word: ἦν δὲ ὁ χιτὼν ἄραφος
  choice: वह कुरता बिना सीवन का था
  rationale: δέ यहाँ वर्णन की अगली बात आरम्भ करता है, इसलिए अलग विरोधसूचक ‘परन्तु’ आवश्यक नहीं। ἄραφος का सीधा अर्थ ‘बिना सीवन का’ है।
- source_word: ἐκ τῶν ἄνωθεν ὑφαντὸς δι’ ὅλου
  choice: ऊपर से नीचे तक पूरा बुना हुआ था
  rationale: ἐκ τῶν ἄνωθεν वस्त्र के ऊपरी भाग से आरम्भ होने को और δι’ ὅλου उसकी पूरी लंबाई/समग्रता को सूचित करता है। ‘नीचे तक’ प्रसंगानुकूल निहित दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु के बिना सीवन वाले कुरते का संभावित प्रतीकात्मक अर्थ
  choice: वस्त्र की बनावट का केवल वर्णनात्मक अनुवाद
  alternative: इसे याजकीय वस्त्र या कलीसिया की एकता का प्रतीक बनाकर अनुवादित करना
  rationale: पद स्वयं सैनिकों की कार्रवाई और वस्त्र की बनावट बताता है; कोई प्रतीकात्मक या सांस्कारिक अर्थ मुख्य पाठ में जोड़ना स्रोत से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुरता’ χιτών के लिए सहज हिन्दी शब्द है; पादटिप्पणियाँ वास्तविक शाब्दिक और संरचनात्मक विकल्पों को सुरक्षित रखती हैं।
