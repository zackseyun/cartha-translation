source:
  edition: SBLGNT
  text: τότε οὖν παρέδωκεν αὐτὸν αὐτοῖς ἵνα σταυρωθῇ. Παρέλαβον ⸀οὖν τὸν ⸀Ἰησοῦν·
base_translation:
  language: en
  yaml_path: translation/nt/john/019/016.yaml
  text: Then he handed him over to them to be crucified[b][a]. So they took Jesus.
translation:
  language: hi
  text: तब उसने उसे उनके[a] हाथ सौंप दिया, ताकि उसे क्रूस पर चढ़ाया जाए। फिर वे यीशु को ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में ‘उनके’ और आगे आए ‘वे’ से किन लोगों का संकेत है, यह स्पष्ट रूप से नहीं बताया गया है। निकटवर्ती प्रसंग से आशय समझा जा सकता है, पर यूनानी पाठ यहाँ किसी समूह का नाम नहीं लेता।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: तब
  rationale: दोनों कण मिलकर पिछले प्रसंग के परिणामस्वरूप कथा के अगले चरण को दिखाते हैं। हिन्दी में ‘तब’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है; ‘तब इसलिए’ अनावश्यक रूप से बोझिल होता।
- source_word: παρέδωκεν
  choice: हाथ सौंप दिया
  rationale: यह किसी को दूसरे के अधिकार या नियंत्रण में सौंपने का भाव व्यक्त करता है और न्यायिक प्रसंग में भी स्वाभाविक है।
- source_word: αὐτὸν αὐτοῖς
  choice: उसे उनके हाथ
  rationale: स्रोत के दोनों सर्वनाम बनाए रखे गए हैं; इस पद में उनके संदर्भित व्यक्तियों के नाम जोड़कर अस्पष्टता दूर नहीं की गई।
- source_word: ἵνα σταυρωθῇ
  choice: ताकि उसे क्रूस पर चढ़ाया जाए
  rationale: ‘ताकि’ प्रयोजन का भाव और ‘चढ़ाया जाए’ यूनानी के कर्मवाच्य को सुरक्षित रखता है।
- source_word: Παρέλαβον
  choice: वे ... ले गए
  rationale: इस प्रसंग में क्रिया यीशु को अपने अधिकार में लेकर आगे ले जाने का भाव देती है। ‘ले गए’ सहज हिन्दी कथन है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: οὖν
  choice: फिर
  rationale: दूसरे वाक्य में यह कण कथा की परिणामी प्रगति दिखाता है। ‘फिर’ आधुनिक हिन्दी में इस संक्रमण को सहज रखता है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: नाम का हिन्दी में प्रचलित बाइबलीय रूप।
theological_decisions:
- issue: αὐτοῖς और Παρέλαβον के निहित कर्ता का संदर्भ
  choice: मुख्य पाठ में ‘उनके’ और ‘वे’ बनाए रखना
  alternative: इन्हें प्रधान याजक और उनके सेवक, यहूदी अगुए, अथवा रोमी सैनिक कहना
  rationale: इस पद का यूनानी पाठ समूह को स्पष्ट नाम से नहीं बताता। किसी समूह का नाम जोड़ने से वह संदर्भगत अस्पष्टता समाप्त हो जाती जिसे स्रोत पाठ खुला छोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्रूस पर चढ़ाया जाए’ प्रयोजन और कर्मवाच्य दोनों को सुरक्षित रखता है; सर्वनामों की वास्तविक अस्पष्टता जानबूझकर नहीं सुलझाई गई।
