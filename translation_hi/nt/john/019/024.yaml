  edition: SBLGNT
  text: εἶπαν οὖν πρὸς ἀλλήλους· Μὴ σχίσωμεν αὐτόν, ἀλλὰ λάχωμεν περὶ αὐτοῦ τίνος ἔσται· ἵνα ἡ γραφὴ πληρωθῇ ⸂ἡ λέγουσα⸃· Διεμερίσαντο τὰ ἱμάτιά μου ἑαυτοῖς καὶ ἐπὶ τὸν ἱματισμόν μου ἔβαλον κλῆρον. Οἱ μὲν οὖν στρατιῶται ταῦτα ἐποίησαν.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/024.yaml
  text: So they said to one another[a], “Let us not tear it, but cast lots for it to decide whose it will be,” so that the Scripture might be fulfilled that says, “They divided my garments among themselves[b], and for my clothing they cast a lot.” So the soldiers did these things.
translation:
  language: hi
  text: 'इसलिए उन्होंने आपस में कहा, “हम इसे न फाड़ें, बल्कि इसके लिए चिट्ठी डालें कि यह किसका होगा।” ऐसा इसलिए हुआ कि पवित्रशास्त्र का वह वचन पूरा हो, जिसमें कहा गया है,


    “उन्होंने मेरे वस्त्र आपस में बाँट लिए,

    और मेरे पहनावे के लिए चिट्ठी डाली।”[b]


    इसलिए सैनिकों ने ये बातें कीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: भजन 22:18 से उद्धृत।
    reason: cross_reference
lexical_decisions:
- source_word: σχίσωμεν
  choice: फाड़ें
  rationale: कपड़े को चीरने या फाड़ने के अर्थ में यह सहज और सटीक आधुनिक हिन्दी है।
- source_word: αὐτόν
  choice: इसे
  rationale: यूनानी सर्वनाम व्याकरण की दृष्टि से पुल्लिंग है, पर प्रसंग में उसका संकेत अंगरखे की ओर है; हिन्दी में निकटवर्ती वस्तु के लिए ‘इसे’ स्वाभाविक है।
- source_word: λάχωμεν
  choice: चिट्ठी डालें
  rationale: यह किसी वस्तु का स्वामी चिट्ठी द्वारा तय करने की प्राचीन रीति को व्यक्त करता है और हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: περὶ αὐτοῦ τίνος ἔσται
  choice: यह तय करने के लिए कि यह किसका होगा
  rationale: वाक्यांश चिट्ठी डालने के उद्देश्य—स्वामित्व निर्धारित करने—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα ἡ γραφὴ πληρωθῇ
  choice: ऐसा इसलिए हुआ कि पवित्रशास्त्र का वह वचन पूरा हो
  rationale: यूहन्ना के पूर्ति-सूत्र को बनाए रखता है, पर सैनिकों की सचेत मंशा या दैवी नियतिवाद के बारे में पाठ से अधिक नहीं कहता।
- source_word: ἡ λέγουσα
  choice: जिसमें कहा गया है
  rationale: उद्धरण का परिचय स्वाभाविक हिन्दी में देता है और यूनानी कृदंत का कार्य सुरक्षित रखता है।
- source_word: Διεμερίσαντο
  choice: बाँट लिए
  rationale: वस्त्रों को अपने बीच विभाजित करने का अर्थ सरल और स्पष्ट हिन्दी में व्यक्त होता है।
- source_word: ἱμάτιά
  choice: वस्त्र
  rationale: बहुवचन कपड़ों के लिए गरिमापूर्ण किंतु सामान्यतः समझ में आने वाला शब्द है।
- source_word: ἑαυτοῖς
  choice: आपस में
  rationale: सैनिकों के बीच वितरण के आत्मवाचक और वितरणात्मक भाव को व्यक्त करता है।
- source_word: ἱματισμόν
  choice: पहनावे
  rationale: पहले प्रयुक्त ἱμάτια से शब्दगत भिन्नता कुछ हद तक बनाए रखता है और समूचे पहनावे का भाव देता है।
- source_word: ἔβαλον κλῆρον
  choice: चिट्ठी डाली
  rationale: एकवचन κλῆρον को उद्धरण में एक निर्णयकारी चिट्ठी के रूप में स्वाभाविक हिन्दी मुहावरे से व्यक्त करता है।
theological_decisions:
- issue: सैनिकों के कार्य और पवित्रशास्त्र की पूर्ति के बीच ἵνα द्वारा व्यक्त संबंध
  choice: इसे पवित्रशास्त्र की पूर्ति के कथन के रूप में प्रस्तुत किया गया है, बिना यह कहे कि सैनिक जान-बूझकर वचन पूरा कर रहे थे।
  alternative: ‘ताकि पवित्रशास्त्र पूरा हो’ कहकर उद्देश्य का अधिक प्रत्यक्ष रूप देना, या इसे केवल परिणाम मानकर ‘इससे पवित्रशास्त्र पूरा हुआ’ कहना।
  rationale: यूहन्ना का सूत्र घटना को पवित्रशास्त्र की पूर्ति से जोड़ता है। चुना गया रूप दैवी उद्देश्य और मानवीय कार्य के संबंध को अनावश्यक रूप से परिभाषित किए बिना इस दावे को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भजन के उद्धरण में ‘वस्त्र’ और ‘पहनावा’ द्वारा यूनानी के दो अलग वस्त्र-संबंधी शब्दों का भेद यथासंभव सुरक्षित रखा गया है।
