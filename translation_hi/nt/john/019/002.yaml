source:
  edition: SBLGNT
  text: καὶ οἱ στρατιῶται πλέξαντες στέφανον ἐξ ἀκανθῶν ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ, καὶ ἱμάτιον πορφυροῦν περιέβαλον αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/john/019/002.yaml
  text: And the soldiers, after weaving a crown out of thorns, put it on his head and clothed him in a purple robe,
translation:
  language: hi
  text: और सैनिकों ने काँटों का मुकुट गूँथकर उसके सिर पर रखा और उसे बैंगनी वस्त्र पहनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सैनिकों ने काँटों का मुकुट गूँथा, उसे उसके सिर पर रखा और उसके चारों ओर बैंगनी वस्त्र लपेट दिया।”
    reason: πλέξαντες की सहभागी रचना और περιέβαλον के ‘चारों ओर डालना/लपेटना’ अर्थ की अधिक शाब्दिक वैकल्पिक अभिव्यक्ति।
lexical_decisions:
- source_word: στρατιῶται
  choice: सैनिकों
  rationale: रोमी सैन्यकर्मियों के लिए यह स्वाभाविक और सटीक आधुनिक हिन्दी शब्द है।
- source_word: πλέξαντες
  choice: गूँथकर
  rationale: काँटों को आपस में पिरोकर मुकुट बनाने की क्रिया और मुख्य क्रिया से पहले हुई कार्रवाई, दोनों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: στέφανον ἐξ ἀκανθῶν
  choice: काँटों का मुकुट
  rationale: στέφανος के राजकीय उपहास-संदर्भ को ‘मुकुट’ व्यक्त करता है, जबकि ἐξ ἀκανθῶν उसकी सामग्री बताता है; हिन्दी में ‘काँटों का मुकुट’ स्वाभाविक है।
- source_word: ἐπέθηκαν αὐτοῦ τῇ κεφαλῇ
  choice: उसके सिर पर रखा
  rationale: यूनानी वाक्य-विन्यास का अर्थ सहज हिन्दी में सटीक रूप से देता है।
- source_word: ἱμάτιον πορφυροῦν
  choice: बैंगनी वस्त्र
  rationale: ἱμάτιον सामान्यतः वस्त्र या बाहरी परिधान है; ‘वस्त्र’ उसे अनावश्यक रूप से विशेष प्रकार का चोगा नहीं बनाता। ‘बैंगनी’ राजकीय रंग-संकेत को बनाए रखता है।
- source_word: περιέβαλον αὐτόν
  choice: उसे … पहनाया
  rationale: किसी व्यक्ति पर वस्त्र डालने या उसे वस्त्र पहनाने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सैनिकों की कार्रवाइयों में राजकीय उपहास
  choice: मुकुट और बैंगनी वस्त्र का सीधा वर्णन, बिना ‘उपहास’ शब्द जोड़े
  alternative: ‘राजा बनाकर उसका उपहास किया’ जैसी व्याख्यात्मक भाषा
  rationale: संदर्भ से उपहास स्पष्ट है, पर इस पद का यूनानी पाठ केवल कार्रवाइयों का वर्णन करता है; इसलिए व्याख्या को मूल पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘बैंगनी वस्त्र’ मूल के व्यापक ἱμάτιον को बनाए रखता है और ‘राजसी चोगा’ जैसी अतिरिक्त विशिष्टता से बचता है।
