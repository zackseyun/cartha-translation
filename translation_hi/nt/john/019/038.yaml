source:
  edition: SBLGNT
  text: Μετὰ ⸀δὲ ταῦτα ἠρώτησεν τὸν Πιλᾶτον Ἰωσὴφ ⸀ἀπὸ Ἁριμαθαίας, ὢν μαθητὴς τοῦ Ἰησοῦ κεκρυμμένος δὲ διὰ τὸν φόβον τῶν Ἰουδαίων, ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ· καὶ ἐπέτρεψεν ὁ Πιλᾶτος. ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/038.yaml
  text: After these things[a], Joseph from Arimathea, being a disciple of Jesus but having kept it hidden because of fear of the Jews, asked Pilate that he might take away the body of Jesus. And Pilate gave permission. So he came and took away his body.
translation:
  language: hi
  text: इन बातों के बाद, अरिमतिया निवासी यूसुफ ने—जो यीशु का शिष्य था, किंतु यहूदियों[a] के डर से अपने शिष्य होने की बात छिपाए रखता था—पिलातुस से यीशु का शव ले जाने की अनुमति माँगी। पिलातुस ने अनुमति दे दी। इसलिए वह आया और उसका शव ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस प्रसंग में अधिक विशेष रूप से, “यहूदिया के/यहूदी अधिकारी।” यूहन्ना प्रायः “यहूदियों” शब्द का प्रयोग यीशु का विरोध करनेवालों के लिए करता है, न कि बिना किसी भेद के समस्त यहूदी लोगों के लिए।
    reason: शब्दगत विकल्प और प्रसंगगत स्पष्टीकरण; मुख्य पाठ में मूल की व्यापक अभिव्यक्ति बनाए रखते हुए संभावित प्रसंगगत संदर्भ स्पष्ट किया गया है।
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: इन बातों के बाद
  rationale: यह बहुवचन ταῦτα और यूहन्ना के घटनाक्रम-सूचक संक्रमण को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπὸ Ἁριμαθαίας
  choice: अरिमतिया निवासी
  rationale: ἀπό से व्यक्त स्थान-संबंध या मूल स्थान को स्पष्ट करता है, बिना यह संकेत दिए कि यूसुफ उसी समय अरिमतिया से आया था।
- source_word: ὢν μαθητὴς τοῦ Ἰησοῦ
  choice: जो यीशु का शिष्य था
  rationale: कृदन्तीय वाक्यांश को सहज आधुनिक हिन्दी के संबंधवाचक उपवाक्य में व्यक्त करता है।
- source_word: κεκρυμμένος
  choice: इस बात को छिपाए हुए था
  rationale: सिद्ध भाव को बनाए रखते हुए उस निहित बात को स्पष्ट करता है जिसे यूसुफ ने छिपाया था—कि वह यीशु का शिष्य था।
- source_word: διὰ τὸν φόβον τῶν Ἰουδαίων
  choice: यहूदियों के डर से
  rationale: यूनानी कारण-सूचक वाक्यांश का निकट और स्वाभाविक हिन्दी रूप है; Ἰουδαίων की व्यापक शब्दगत अभिव्यक्ति मुख्य पाठ में रखी गई है।
- source_word: ἵνα ἄρῃ τὸ σῶμα τοῦ Ἰησοῦ
  choice: यीशु का शव ले जाने की अनुमति माँगी
  rationale: निवेदन और उसके उद्देश्य को हिन्दी में स्पष्ट रूप से जोड़ता है; मृत देह के प्रसंग में ‘शव’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπέτρεψεν
  choice: अनुमति दे दी
  rationale: पिलातुस द्वारा निवेदन स्वीकार किए जाने का सीधा और प्रचलित हिन्दी रूप है।
- source_word: ἦλθεν οὖν καὶ ἦρεν τὸ σῶμα αὐτοῦ
  choice: इसलिए वह आया और उसका शव ले गया
  rationale: οὖν का परिणाम-सूचक संबंध और αἴρω की पहले आए ‘ले जाने’ से शब्दगत संगति दोनों बनाए रखता है; αὐτοῦ को ‘उसका’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: यूहन्ना में τῶν Ἰουδαίων का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ और स्पष्टीकरण के लिए पादटिप्पणी
  alternative: ‘यहूदी अधिकारी’ अथवा ‘यहूदिया के लोग/अधिकारी’
  rationale: मूल पाठ की अभिव्यक्ति को संकीर्ण करके व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया। साथ ही पादटिप्पणी यह स्पष्ट करती है कि इस प्रसंग में इसका संकेत समस्त यहूदी जाति की ओर नहीं, बल्कि यीशु का विरोध करनेवाले अधिकारियों या प्रभावशाली समूह की ओर हो सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को हिन्दी की स्पष्टता के लिए तीन वाक्यों में बाँटा गया है; मध्यवर्ती विवरण को डैश के भीतर रखा गया है ताकि यूसुफ के शिष्य होने और उसे छिपाने का संबंध स्पष्ट रहे।
