  - marker: a
    text: या, “जो मैंने लिखा, वह मैंने लिखा।” यूनानी में “लिखा है” के लिए दोनों बार पूर्णकाल प्रयुक्त हुआ है, जो लिखे हुए के बने रहने वाले परिणाम और पिलातुस के निर्णय की अंतिमता पर बल दे सकता है।
