  naturalness: “जो मैंने लिखा है, वह मैंने लिखा है” is grammatical, idiomatic modern Hindi, and preserves the deliberate repetition without the awkward ellipsis. “लिखा है” is a natural Hindi perfect and need not add दिया, which is not explicit in γράφω.
  terminology: “पिलातुस” and “उत्तर दिया” are appropriate standard Hindi forms. The footnote should be attached to the saying it explains, rather than to “उत्तर दिया,” and should offer the actual simple-past alternative corresponding to the English audit trail.
