lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह ἀποκρίνομαι का कथात्मक प्रयोग है, जिसका स्वाभाविक आधुनिक हिन्दी अर्थ ‘उत्तर दिया’ है।
- source_word: ὁ Πιλᾶτος
  choice: पिलातुस
  rationale: यूनानी लेख के साथ आया व्यक्तिवाचक नाम हिन्दी में बिना लेख के मानक रूप ‘पिलातुस’ रखा गया है।
- source_word: Ὃ
  choice: जो
  rationale: नपुंसकलिंग एकवचन सम्बन्धवाचक सर्वनाम यहाँ संज्ञात्मक है; ‘मैंने जो...’ आधुनिक हिन्दी में स्वाभाविक रूप से ‘what/that which’ का अर्थ देता है।
- source_word: γέγραφα
  choice: मैंने ... लिख दिया है / वह लिख दिया है
  rationale: पूर्णकालिक रूप पूरे हो चुके लेखन और उसके बने हुए परिणाम को व्यक्त करता है। ‘लिख दिया है’ इस पूर्णता और वर्तमान स्थायित्व को स्वाभाविक हिन्दी में रखता है; दोहराव भी सुरक्षित है।
theological_decisions:
- issue: दोहराए गए पूर्णकाल γέγραφα γέγραφα का बल
  choice: “मैंने जो लिख दिया है, वह लिख दिया है।”
  alternative: “मैंने जो लिखा, सो लिखा।”
  rationale: चुना हुआ रूप लिखे जा चुके शब्दों की बनी हुई स्थिति और पिलातुस के निर्णय की अंतिमता को व्यक्त करता है, पर पाठ से आगे कोई धार्मिक अर्थ नहीं जोड़ता। वैकल्पिक रूप संक्षिप्त और मुहावरेदार है, पर यूनानी पूर्णकाल के वर्तमान परिणाम को कम स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लिख दिया है’ बोलचाल की स्वाभाविकता के साथ यूनानी पूर्णकाल का बल देता है, और दूसरे खंड में कर्ता के स्थान पर ‘वह’ रखने से हिन्दी वाक्य स्पष्ट रहते हुए मूल का emphatic दोहराव बनाए रखता है।
