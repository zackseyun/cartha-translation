lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रियाविशेषण पिछले उद्धरण के बाद एक अतिरिक्त शास्त्रीय उद्धरण प्रस्तुत करता है; आधुनिक हिन्दी में “फिर” स्वाभाविक और स्पष्ट है।
- source_word: ἑτέρα γραφή
  choice: पवित्रशास्त्र का एक और वचन
  rationale: यहाँ γραφή किसी शास्त्रीय लेख अथवा वचन को दर्शाता है और ἑτέρα एक अतिरिक्त साक्ष्य प्रस्तुत करता है। “एक और वचन” हिन्दी में “एक और पवित्रशास्त्र” की अपेक्षा अधिक स्वाभाविक है।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमान काल में दिया गया यह उद्धरण-सूत्र यूनानी की सजीव अभिव्यक्ति को बनाए रखता है।
- source_word: Ὄψονται
  choice: वे ... देखेंगे
  rationale: यह भविष्यकालीन क्रिया केवल दिखाई देने के बजाय किसी की ओर दृष्टि करने का भाव रखती है; εἰς के साथ “उसकी ओर देखेंगे” इसे स्पष्ट करता है।
- source_word: εἰς ὃν
  choice: उसकी ओर ... जिसे
  rationale: εἰς दृष्टि की दिशा बताता है। “उसकी ओर” स्वाभाविक हिन्दी है, जबकि “जिसे” उस व्यक्ति से संबंध बनाए रखता है जिसे बेधा गया।
- source_word: ἐξεκέντησαν
  choice: उन्होंने बेधा था
  rationale: क्रिया किसी नुकीली वस्तु से आर-पार करने या छेदने की घटना बताती है। “बेधा” क्रूस पर चढ़ाए जाने के निकट प्रसंग और जकर्याह 12:10 की प्रतिध्वनि, दोनों के अनुकूल है; “था” पूर्व में पूरी हुई घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: जकर्याह 12:10 की प्रतिध्वनि को यूहन्ना के अपने यूनानी शब्दों के अनुसार प्रस्तुत करना
  choice: वे उसकी ओर देखेंगे, जिसे उन्होंने बेधा था
  alternative: वे उसे देखेंगे, जिसे उन्होंने बेधा था
  rationale: “उसकी ओर” εἰς द्वारा व्यक्त दिशात्मक भाव को बनाए रखता है और उस बेधे गए व्यक्ति की पहचान को प्रसंग में यीशु से जुड़ा रहने देता है। साथ ही, यह जकर्याह के हिब्रू पाठ के प्रथम-पुरुष ईश्वरीय कथन को यूहन्ना के इस वाक्य में जोड़कर धर्मवैज्ञानिक तनाव को कृत्रिम रूप से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “पवित्रशास्त्र का एक और वचन” हिन्दी में स्वाभाविक उद्धरण-सूत्र है; “बेधा” बाइबलीय प्रसंग के अनुरूप होते हुए भी समझने योग्य है।
