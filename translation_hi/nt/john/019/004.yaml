  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ ἐξῆλθεν⸃ πάλιν ἔξω ὁ Πιλᾶτος καὶ λέγει αὐτοῖς· Ἴδε ἄγω ὑμῖν αὐτὸν ἔξω, ἵνα γνῶτε ὅτι ⸂οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/019/004.yaml
  text: Then Pilate went outside again and said to them[a], “Look, I am bringing him out to you so that you may know that I find no case against him.”
translation:
  language: hi
  text: तब पिलातुस फिर बाहर गया और उनसे कहा, “देखो, मैं उसे तुम्हारे पास ले आ रहा हूँ, ताकि तुम जान सको कि मुझे उसके विरुद्ध कोई आरोप नहीं मिलता।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “मुझे उसमें कोई दोष नहीं मिलता।” यूनानी पद का यह अधिक पारंपरिक अनुवाद भी सम्भव है, पर यहाँ उसका आशय सम्भवतः न्यायिक है: पिलातुस को यीशु के विरुद्ध कोई वैध आरोप या आरोप का आधार नहीं मिलता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν ... ἔξω
  choice: बाहर गया
  rationale: क्रिया और स्थानवाचक क्रियाविशेषण दोनों मिलकर बाहर की ओर जाने को व्यक्त करते हैं; हिन्दी में ‘बाहर गया’ स्वाभाविक है।
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया की पुनरावृत्ति बताता है और प्रसंग में सहज आधुनिक हिन्दी है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त करना स्वाभाविक है।
- source_word: Ἴδε
  choice: देखो
  rationale: यह श्रोताओं का ध्यान खींचने वाला उद्गार है; ‘देखो’ आधुनिक और सीधा रूप है।
- source_word: ἄγω ... αὐτὸν ἔξω
  choice: मैं उसे तुम्हारे पास बाहर ला रहा हूँ
  rationale: ἄγω यहाँ यीशु को भीड़ के सामने बाहर लाने को दर्शाता है; अपूर्ण वर्तमान क्रिया तत्काल चल रही कार्रवाई को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἵνα γνῶτε
  choice: ताकि तुम जान लो
  rationale: ‘ताकि’ उद्देश्य का बल बनाए रखता है और ‘जान लो’ अपेक्षित बोध को सहज हिन्दी में व्यक्त करता है।
- source_word: οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ
  choice: मुझे उसके विरुद्ध कोई दोष सिद्ध करने का आधार नहीं मिलता
  rationale: αἰτία इस न्यायिक प्रसंग में आरोप, मुकदमे या दोषारोपण के वैध आधार को दर्शाता है। यह रूप कानूनी आशय को स्पष्ट करता है, पर व्यापक नैतिक निष्पापता को अनावश्यक रूप से नहीं जोड़ता।
theological_decisions:
- issue: पिलातुस की घोषणा का न्यायिक स्वर
  choice: मुझे उसके विरुद्ध कोई दोष सिद्ध करने का आधार नहीं मिलता
  alternative: मुझे उसमें कोई दोष नहीं मिलता
  rationale: मूल के αἰτία का इस प्रसंग में न्यायिक अर्थ प्रमुख है। चुना हुआ रूप पिलातुस के कानूनी आकलन को सामने रखता है, जबकि वैकल्पिक पारंपरिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक और गरिमापूर्ण रखा गया है। ‘पिलातुस’ प्रचलित हिन्दी बाइबलीय नामरूप है। मुख्य पाठ में न्यायिक अर्थ स्पष्ट किया गया है और पारंपरिक ‘कोई दोष नहीं’ को पादटिप्पणी में रखा गया है।
