- from: तब पिलातुस फिर बाहर गया और उनसे कहा, “देखो, मैं उसे तुम्हारे पास बाहर ला रहा हूँ, ताकि तुम जान लो कि मुझे उसके विरुद्ध कोई दोष सिद्ध करने का आधार नहीं मिलता।”[a]
  to: तब पिलातुस फिर बाहर गया और उनसे कहा, “देखो, मैं उसे तुम्हारे पास ले आ रहा हूँ, ताकि तुम जान सको कि मुझे उसके विरुद्ध कोई आरोप नहीं मिलता।”[a]
  rationale: The revision preserves the source's judicial ambiguity and force by using “कोई आरोप नहीं मिलता,” without adding the distinct concept of establishing/proving guilt. It also makes the action of bringing Jesus out more idiomatic in modern Hindi while the preceding clause preserves Pilate's movement outside. The footnote retains the traditional “दोष” alternative and explains the judicial reading without overstating it.
