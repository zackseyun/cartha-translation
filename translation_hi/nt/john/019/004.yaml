review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents Pilate's going out again, his address to the group, the attention-getter, the purpose clause, and the judicial sense of οὐδεμίαν αἰτίαν εὑρίσκω ἐν αὐτῷ. However, “कोई दोष सिद्ध करने का आधार” adds the specific idea of proving guilt (सिद्ध करने), which is not stated by αἰτίαν; the Greek says Pilate finds no charge/case/ground against Jesus. The wording should retain the forensic sense without importing an evidentiary-proving formulation.
  naturalness: “तुम्हारे पास बाहर” is understandable but unnecessarily awkward and spatially redundant in modern Hindi. “तुम्हारे सामने बाहर” or, more naturally here, “तुम्हारे पास ले आ रहा हूँ” is suitable, since Pilate's movement outside has already been expressed. “तुम जान लो” is acceptable, though “तुम जान सको” more idiomatically expresses the purpose in this context.
  terminology: '“पिलातुस” is an established Hindi biblical form. “आरोप” is a clear modern judicial rendering of αἰτία and avoids both the overly broad moral term दोष and the added notion of proving guilt. The footnote''s traditional alternative should correspond exactly to the Greek''s “in him”: “मुझे उसमें कोई दोष नहीं मिलता.”'
  issues:
  - severity: medium
    issue: The phrase “दोष सिद्ध करने का आधार” over-specifies the judicial claim.
    rationale: αἰτία denotes a charge, case, cause, or grounds for accusation. It does not explicitly say that Pilate lacks grounds to prove guilt. “कोई आरोप नहीं मिलता” preserves the legal force with less interpretive expansion.
  - severity: low
    issue: “तुम्हारे पास बाहर” is awkward Hindi.
    rationale: The Greek has ἔξω both with Pilate's exit and with his bringing Jesus out, but direct repetition as “तुम्हारे पास बाहर” is not idiomatic. The preceding “बाहर गया” supplies the setting; “तुम्हारे पास ले आ रहा हूँ” communicates the presentation naturally.
  - severity: low
    issue: The footnote repeats the over-expanded expression.
    rationale: Its explanation should describe αἰτία as a valid charge or basis for accusation, rather than “दोष सिद्ध करने का आधार.”
