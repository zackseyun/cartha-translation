base_translation:
  language: en
  yaml_path: translation/nt/john/019/034.yaml
  text: But one of the soldiers pierced his side with a spear[b][a], and immediately blood and water came out.
translation:
  language: hi
  text: लेकिन सैनिकों में से एक ने भाले[a] से उसकी बगल में भाला भोंका, और तुरंत खून और पानी निकल आया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बरछे से।’
    reason: lexical_alternative
  - marker: b
    text: कुछ व्याख्याकार ‘खून और पानी’ को प्रतीकात्मक या संस्कार-संबंधी अर्थ में समझते हैं; दूसरे इसे एक शारीरिक विवरण मानते हैं। यहाँ यूनानी पाठ स्वयं इसका महत्व नहीं समझाता।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: लेकिन
  rationale: यह पिछले कथन से विरोध दिखाता है कि यीशु की टाँगें नहीं तोड़ी गईं; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक और स्पष्ट है।
- source_word: εἷς τῶν στρατιωτῶν
  choice: सैनिकों में से एक
  rationale: यूनानी का अंशसूचक प्रयोग स्पष्ट रूप से सुरक्षित रहता है; इसे केवल ‘एक सैनिक’ कहना इस विशेषता को कम कर देता।
- source_word: λόγχῃ
  choice: भाले से
  rationale: यह सैनिक द्वारा प्रयुक्त नुकीले भाले या बरछे को सूचित करता है; ‘भाला’ आधुनिक हिन्दी में सबसे सामान्य और स्पष्ट शब्द है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: संदर्भ में सर्वनाम यीशु की ओर संकेत करता है; मूल के सर्वनाम को बिना अनावश्यक स्पष्टीकरण के बनाए रखा गया है।
- source_word: τὴν πλευρὰν
  choice: बगल को
  rationale: πλευρά शरीर के पार्श्व या बगल को दर्शाता है। ‘बगल’ सहज हिन्दी है और शरीर के किसी अधिक विशिष्ट अंग का अनुमान नहीं लगाता।
- source_word: ἔνυξεν
  choice: बेधा
  rationale: क्रिया किसी नुकीली वस्तु से छेदने या भेदने का अर्थ देती है; ‘बेधा’ सटीक, संक्षिप्त और गरिमापूर्ण है।
- source_word: καὶ ⸂ἐξῆλθεν εὐθὺς⸃
  choice: और तुरंत ... निकल आया
  rationale: इससे καί का क्रमसूचक संबंध और εὐθύς की तात्कालिकता दोनों सुरक्षित रहते हैं तथा हिन्दी वाक्य स्वाभाविक बनता है।
- source_word: αἷμα καὶ ὕδωρ
  choice: खून और पानी
  rationale: मूल की असामान्य अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है। साधारण आधुनिक हिन्दी में ‘खून’ अधिक सहज है।
theological_decisions:
- issue: ‘खून और पानी’ को प्रतीकात्मक, संस्कार-संबंधी या शारीरिक विवरण के रूप में समझना
  choice: मुख्य पाठ में शाब्दिक वाक्यांश ‘खून और पानी’ रखा गया है, बिना उसकी व्याख्या किए।
  alternative: इसे संस्कार-संबंधी संकेत या घाव के शारीरिक प्रभाव का विवरण मानना।
  rationale: पद घटना बताता है, पर उसका महत्व स्वयं स्पष्ट नहीं करता। यह अनुवाद किसी एक परंपरागत या चिकित्सकीय व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सैनिकों में से एक’ मूल की अंशसूचक रचना को सुरक्षित रखता है। ‘बगल’ πλευρά का सामान्य शारीरिक अर्थ देता है, और ‘खून और पानी’ की व्याख्यात्मक अस्पष्टता ज्यों की त्यों बनी रहती है।
