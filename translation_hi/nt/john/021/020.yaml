review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Peter's turning, seeing the disciple Jesus loved, and the implicit object of ἀκολουθοῦντα. However, “छाती की ओर झुककर” means leaning toward Jesus' chest, whereas ἀνέπεσεν ἐπὶ τὸ στῆθος αὐτοῦ describes reclining/leaning back against or upon his chest. “पकड़वाने वाला है” is understandable but unnecessarily shifts the present participle toward a prospective agent; “पकड़वा रहा है” more directly represents the ongoing ‘handing over/betraying’ sense in context.
  naturalness: The Hindi is generally fluent and appropriately dignified. A continuous relative construction is more natural than the explanatory independent sentence “यह वही शिष्य था,” and “पीछे-पीछे चलते हुए” conveys following more clearly while leaving its object unstated.
  terminology: “शिष्य,” “प्रेम करते थे,” and “प्रभु” are suitable. “भोज” is acceptable for δεῖπνον in this context. The revised wording preserves the concrete sense of παραδίδωμι without imposing a doctrinal interpretation.
  issues:
  - severity: medium
    issue: “यीशु की छाती की ओर झुककर” does not express the contact and reclining direction of ἀνέπεσεν ἐπὶ τὸ στῆθος αὐτοῦ.
    rationale: The Greek recalls the disciple leaning back against/on Jesus' chest at the meal, not merely bending in the direction of his chest.
  - severity: low
    issue: “जो आपको पकड़वाने वाला है” is more future-oriented than the Greek present participle ὁ παραδιδούς.
    rationale: “जो आपको पकड़वा रहा है” is idiomatic Hindi and better retains the active, contextually ongoing sense of handing Jesus over.
  - severity: low
    issue: The wording can represent ἀκολουθοῦντα more explicitly as following without supplying its unstated object.
    rationale: “पीछे-पीछे चलते हुए” naturally conveys following, while the footnote preserves the Greek ambiguity about whom he was following.
  revised_text: पतरस ने मुड़कर उस शिष्य को, जिससे यीशु प्रेम करते थे, पीछे-पीछे चलते हुए[a] देखा—वही शिष्य जो भोज के समय यीशु की छाती से लगकर पीछे की ओर झुका था और बोला था, “प्रभु, वह कौन है जो आपको पकड़वा रहा है?”
  revised_footnotes:
