id: JHN.21.20
reference: John 21:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Ἐπιστραφεὶς ὁ Πέτρος βλέπει τὸν μαθητὴν ὃν ἠγάπα ὁ Ἰησοῦς ἀκολουθοῦντα, ὃς καὶ ἀνέπεσεν ἐν τῷ δείπνῳ ἐπὶ τὸ στῆθος αὐτοῦ καὶ εἶπεν· Κύριε, τίς ἐστιν ὁ παραδιδούς σε;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/020.yaml
  text: Peter turned and saw the disciple whom Jesus loved following[a], who had also leaned back against his chest at the supper and said, “Lord[b], who is the one betraying you?”
translation:
  language: hi
  text: पतरस ने मुड़कर उस शिष्य को, जिससे यीशु प्रेम करते थे, पीछे-पीछे चलते हुए[a] देखा—वही शिष्य जो भोज के समय यीशु की छाती से लगकर पीछे की ओर झुका था और बोला था, “प्रभु, वह कौन है जो आपको पकड़वा रहा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “पीछे-पीछे चलते हुए” का कर्म स्पष्ट नहीं है; अर्थात वह किसके पीछे चल रहा था, यह नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπιστραφεὶς
  choice: मुड़कर
  rationale: पूर्वकालिक कृदंत पतरस के मुड़ने और फिर देखने का स्वाभाविक क्रम बताता है।
- source_word: βλέπει
  choice: देखा
  rationale: यूनानी ऐतिहासिक वर्तमान को सहज हिन्दी कथन-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: τὸν μαθητὴν
  choice: उस शिष्य को
  rationale: ‘शिष्य’ यूहन्ना में प्रयुक्त मानक शब्दावली और यहाँ संकेतित परिचित व्यक्ति—दोनों को बनाए रखता है।
- source_word: ὃν ἠγάπα ὁ Ἰησοῦς
  choice: जिससे यीशु प्रेम करते थे
  rationale: यह सम्बन्धवाचक उपवाक्य का स्वाभाविक आधुनिक हिन्दी रूप है और ἀγαπάω को ‘प्रेम करना’ से व्यक्त करता है।
- source_word: ἀκολουθοῦντα
  choice: पीछे आते
  rationale: कृदंत किसी स्पष्ट कर्म का उल्लेख नहीं करता; ‘पीछे आते’ दृश्य को स्वाभाविक बनाते हुए यह अस्पष्टता बनाए रखता है कि वह विशेष रूप से किसके पीछे था।
- source_word: ἀνέπεσεν
  choice: झुककर
  rationale: भोज में लेटकर खाने की मुद्रा में पीछे की ओर टिकने की विशेष क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ δείπνῳ
  choice: भोज के समय
  rationale: निश्चित संध्या-भोज के प्रसंग को गरिमापूर्ण और सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὸ στῆθος αὐτοῦ
  choice: यीशु की छाती की ओर
  rationale: αὐτοῦ का संदर्भ स्पष्ट करते हुए भोज की लेटकर खाने वाली मुद्रा और निकटता को दर्शाता है; ‘की ओर’ मूल पूर्वसर्गीय अभिव्यक्ति को अनावश्यक शारीरिक कठोरता के बिना रखता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को सीधे संबोधन में κύριος का मानक, गरिमापूर्ण और धर्मवैज्ञानिक रूप से खुला अनुवाद है।
- source_word: ὁ παραδιδούς σε
  choice: जो आपको पकड़वाने वाला है
  rationale: दुःखभोग के प्रसंग में παραδίδωμι किसी को अधिकारियों के हाथ सौंपने अथवा पकड़वाने का भाव देता है; यह रूप केवल आंतरिक विश्वासघात तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: ἀκολουθοῦντα के अनकहे कर्म को व्यक्त करना
  choice: किसी कर्म को न जोड़कर ‘पीछे आते’
  alternative: ‘उनके पीछे आते’ या ‘यीशु के पीछे आते’
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि शिष्य यीशु, पतरस या दोनों के पीछे चल रहा था। हिन्दी में ‘पीछे आते’ स्वाभाविक रहते हुए इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: παραδιδούς का अर्थ
  choice: पकड़वाने वाला
  alternative: विश्वासघात करने वाला / सौंपने वाला
  rationale: दुःखभोग-वृत्तांत में यह क्रिया यीशु को विरोधियों के हाथ दिलाने की ठोस क्रिया बताती है। ‘पकड़वाना’ आधुनिक हिन्दी में स्वाभाविक है और केवल नैतिक ‘विश्वासघात’ तक अर्थ को संकुचित नहीं करता।
- issue: βλέπει का ऐतिहासिक वर्तमान
  choice: भूतकाल ‘देखा’
  alternative: वर्तमानकाल ‘देखता है’
  rationale: यह शैलीगत चयन है; हिन्दी कथा में भूतकाल स्वाभाविक है और घटना के अर्थ या धर्मवैज्ञानिक बल को नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘पीछे आते’ के द्वारा यूनानी की अस्पष्टता बचाई गई है। भोजन की प्राचीन लेटकर खाने की मुद्रा को अत्यधिक तकनीकी शब्दों के बिना स्पष्ट किया गया है।
