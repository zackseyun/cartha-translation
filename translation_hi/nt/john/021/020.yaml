- from: पतरस ने मुड़कर उस शिष्य को पीछे आते देखा, जिससे यीशु प्रेम करते थे[a]। यह वही शिष्य था, जो भोज के समय यीशु की छाती की ओर झुककर बोला था, “प्रभु, वह कौन है जो आपको पकड़वाने वाला है?”
  to: पतरस ने मुड़कर उस शिष्य को, जिससे यीशु प्रेम करते थे, पीछे-पीछे चलते हुए[a] देखा—वही शिष्य जो भोज के समय यीशु की छाती से लगकर पीछे की ओर झुका था और बोला था, “प्रभु, वह कौन है जो आपको पकड़वा रहा है?”
  rationale: The revision corrects the meal-posture expression so that it reflects reclining against Jesus' chest, refines the rendering of the present participle for ‘handing over,’ and improves the expression of ‘following’ without adding an object absent from the Greek. It retains the historical past-tense narration and all intended referents.
