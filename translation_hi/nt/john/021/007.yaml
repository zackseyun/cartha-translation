source:
  edition: SBLGNT
  text: λέγει οὖν ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς τῷ Πέτρῳ· Ὁ κύριός ἐστιν. Σίμων οὖν Πέτρος, ἀκούσας ὅτι ὁ κύριός ἐστιν, τὸν ἐπενδύτην διεζώσατο, ἦν γὰρ γυμνός, καὶ ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν·
base_translation:
  language: en
  yaml_path: translation/nt/john/021/007.yaml
  text: So that disciple whom Jesus loved said to Peter[a], “It is the Lord.” Therefore, when Simon Peter heard that it was the Lord, he tied his outer garment around himself (for he was lightly clothed) and threw himself into the sea.
translation:
  language: hi
  text: तब उस चेले ने, जिससे यीशु प्रेम करते थे, पतरस से कहा, “यह प्रभु हैं।” इसलिए शमौन पतरस ने जब सुना कि यह प्रभु हैं, तो अपना ऊपरी वस्त्र कमर पर कस लिया—क्योंकि वह कम कपड़े पहने हुए था[a]—और अपने आपको समुद्र में फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह नंगा था।” यूनानी शब्द का अर्थ प्रसंग के अनुसार पूरी तरह नंगा अथवा बहुत कम कपड़े पहने होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: तब ... कहा
  rationale: οὖν यहाँ कथा की अगली घटना को जोड़ता है; आधुनिक हिन्दी में ‘तब’ इसका स्वाभाविक कथात्मक रूप है।
- source_word: ὁ μαθητὴς ἐκεῖνος ὃν ἠγάπα ὁ Ἰησοῦς
  choice: उस चेले ने, जिससे यीशु प्रेम करते थे
  rationale: ἐκεῖνος के संकेतार्थ को ‘उस’ से रखा गया है और यूहन्ना की विशिष्ट पहचान-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Ὁ κύριός ἐστιν
  choice: यह प्रभु हैं
  rationale: κύριος का मानक धर्मवैचारिक भार ‘प्रभु’ से सुरक्षित रहता है; यीशु के लिए आदरसूचक हिन्दी क्रिया ‘हैं’ स्वाभाविक है।
- source_word: Σίμων οὖν Πέτρος, ἀκούσας
  choice: इसलिए शमौन पतरस ने जब सुना
  rationale: दूसरे οὖν का परिणामसूचक संबंध ‘इसलिए’ से और अओरिस्ट कृदंत का कालगत संबंध ‘जब सुना’ से व्यक्त किया गया है।
- source_word: τὸν ἐπενδύτην διεζώσατο
  choice: अपना ऊपरी वस्त्र कमर पर कस लिया
  rationale: ἐπενδύτης को अनावश्यक रूप से किसी खास पोशाक का नाम दिए बिना ‘ऊपरी वस्त्र’ कहा गया है; διεζώσατο में वस्त्र को शरीर/कमर पर बाँधने-कसने की क्रिया है।
- source_word: ἦν γὰρ γυμνός
  choice: क्योंकि वह कम कपड़े पहने हुए था
  rationale: γυμνός का अर्थ पूर्णतः नग्न या पर्याप्त वस्त्र न पहने होना दोनों हो सकता है। मछली पकड़ने के प्रसंग में मुख्य पाठ का यह रूप स्वाभाविक है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἔβαλεν ἑαυτὸν εἰς τὴν θάλασσαν
  choice: अपने आपको झील में फेंक दिया
  rationale: प्रतिवाची संरचना की सजीवता ‘अपने आपको ... फेंक दिया’ में बनी रहती है। यहाँ θάλασσα गलील की झील के लिए प्रयुक्त है, इसलिए सामान्य हिन्दी पाठक के लिए ‘झील’ भौगोलिक रूप से स्पष्ट है।
theological_decisions:
- issue: यीशु की पहचान में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सामान्य उपाधि और पुनरुत्थान-प्रसंग के मसीही अर्थभार दोनों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- issue: पतरस की अवस्था के लिए γυμνός का अर्थ
  choice: कम कपड़े पहने हुए था
  alternative: नंगा था
  rationale: यूनानी शब्द दोनों अर्थों की अनुमति देता है। प्रसंगानुकूल अर्थ मुख्य पाठ में है और वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चेला’ सामान्य पाठक के लिए स्वाभाविक है; ‘प्रभु’ धार्मिक अर्थभार बनाए रखता है। वाक्य की कथात्मक गति के लिए पहले οὖν को ‘तब’ और दूसरे को परिणामसूचक ‘इसलिए’ किया गया है।
