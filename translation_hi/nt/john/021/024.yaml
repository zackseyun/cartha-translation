  text: Οὗτός ἐστιν ὁ μαθητὴς ὁ μαρτυρῶν περὶ τούτων καὶ ⸀ὁ γράψας ταῦτα, καὶ οἴδαμεν ὅτι ἀληθὴς ⸂αὐτοῦ ἡ μαρτυρία ἐστίν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/024.yaml
  text: This is the disciple who testifies about these things and who wrote these things[a], and we know that his testimony is true.
translation:
  language: hi
  text: यह वही शिष्य है जो इन बातों के विषय में गवाही देता है और जिसने इन बातों को लिखा है[a]; और हम जानते हैं कि उसकी गवाही सच्ची है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ ‘गवाही देता है’ और ‘गवाही’ के लिए एक ही शब्द-मूल के शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτός ἐστιν ὁ μαθητὴς
  choice: यह वही शिष्य है
  rationale: पहचानसूचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और पहले बताए गए शिष्य की ओर संकेत बनाए रखता है।
- source_word: ὁ μαρτυρῶν
  choice: जो ... गवाही देता है
  rationale: वर्तमान कृदन्त के निरन्तर अथवा चारित्रिक भाव को व्यक्त करता है; ‘गवाही देना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: περὶ τούτων
  choice: इन बातों के विषय में
  rationale: सुसमाचार में वर्णित विषयों की ओर संकेत करने वाले बहुवचन को सीधे बनाए रखता है।
- source_word: ὁ γράψας ταῦτα
  choice: जिसने इन बातों को लिखा है
  rationale: पूर्ण हो चुके लेखन-कर्म को हिन्दी के स्वाभाविक पूर्ण रूप में व्यक्त करता है।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: यूनानी पूर्णकालिक रूप के वर्तमान अर्थ और अस्पष्ट प्रथम पुरुष बहुवचन को यथावत रखता है।
- source_word: ἀληθὴς
  choice: सच्ची
  rationale: गवाही की सत्यता को सीधे व्यक्त करता है; ‘विश्वसनीय’ कहने से अर्थ अनावश्यक रूप से व्याख्यायित हो सकता था।
- source_word: αὐτοῦ ἡ μαρτυρία
  choice: उसकी गवाही
  rationale: सम्बन्धकारक सर्वनाम को स्वाभाविक हिन्दी अधिकारसूचक रचना में प्रस्तुत करता है और μαρτυρῶν के साथ समान शब्द-मूल का सम्बन्ध हिन्दी में भी बनाए रखता है।
theological_decisions:
- issue: ‘हम जानते हैं’ में वक्ता की पहचान
  choice: प्रथम पुरुष बहुवचन को बिना वक्ता निर्धारित किए ‘हम जानते हैं’ के रूप में रखा गया है।
  alternative: इसे सुसमाचार लेखक का सम्पादकीय कथन या शिष्य की गवाही की पुष्टि करने वाले किसी समुदाय का कथन मानना।
  rationale: यूनानी पाठ वक्ताओं की पहचान स्पष्ट नहीं करता; अनुवाद लेखकत्व अथवा समुदाय से जुड़े प्रश्न को स्वयं हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘के विषय में’ हल्का औपचारिक है, पर बाइबलीय गद्य में स्वाभाविक और स्पष्ट है।
