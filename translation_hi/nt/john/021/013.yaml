  yaml_path: translation/nt/john/021/013.yaml
  text: Jesus comes and takes the bread and gives it to them[b][a], and the fish likewise.
translation:
  language: hi
  text: यीशु आते हैं, रोटी लेते हैं और उन्हें रोटी देते हैं[a], और मछली भी उसी प्रकार देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु आए, रोटी ली और उन्हें रोटी दी।” यूनानी में यहाँ ऐतिहासिक वर्तमानकाल का प्रयोग हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “और मछली भी उसी प्रकार।” यूनानी में ‘देते हैं’ क्रिया दूसरे खंड में निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: आते हैं
  rationale: यूनानी का वर्तमानकालिक कथात्मक रूप बनाए रखा गया है; यह ऐतिहासिक वर्तमान है और घटना को सजीव ढंग से प्रस्तुत करता है।
- source_word: λαμβάνει
  choice: लेते हैं
  rationale: भोजन बाँटने से पहले रोटी हाथ में लेने की सीधी क्रिया के लिए यह स्वाभाविक और सटीक चयन है।
- source_word: τὸν ἄρτον
  choice: रोटी
  rationale: संदर्भ में सामने रखी विशिष्ट रोटी अभिप्रेत है; हिन्दी में निश्चित उपपद न होने के कारण केवल ‘रोटी’ स्वाभाविक है।
- source_word: δίδωσιν αὐτοῖς
  choice: उन्हें देते हैं
  rationale: हिन्दी में तुरंत पहले आए कर्म ‘रोटी’ को दोहराए बिना यह वाक्य स्वाभाविक रहता है और ‘परोसते हैं’ जैसी व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: τὸ ὀψάριον
  choice: मछली
  rationale: यहाँ मछली भोजन के रूप में है; मूल शब्द अपने आप ‘पकी हुई’ जैसी अतिरिक्त विशिष्टता आवश्यक नहीं करता।
- source_word: ὁμοίως
  choice: उसी प्रकार
  rationale: यह बताता है कि यीशु ने मछली के साथ भी वही किया जो रोटी के साथ किया था, और यूनानी की संक्षिप्त समानांतर रचना सुरक्षित रहती है।
theological_decisions:
- issue: पुनरुत्थान के बाद के प्रकट होने के वृत्तांत में ऐतिहासिक वर्तमान
  choice: 'वर्तमानकाल रखा गया: ‘आते हैं … लेते हैं … देते हैं’'
  alternative: 'सरल भूतकाल: ‘आए … ली … दी’'
  rationale: यह सिद्धान्तगत निष्कर्ष नहीं, बल्कि यूनानी कथाशैली का संरक्षण है; दोनों रूप घटना को भूतकाल की ही घटना बताते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आदरसूचक बहुवचन क्रियाएँ हिन्दी में यीशु के उल्लेख के साथ स्वाभाविक हैं। अर्धविराम रोटी से संबंधित पूर्ण क्रियाक्रम और मछली के लिए संक्षिप्त समानांतर वाक्यांश के बीच संबंध स्पष्ट करता है।
