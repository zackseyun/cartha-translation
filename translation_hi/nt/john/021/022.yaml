  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ; σύ ⸂μοι ἀκολούθει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/022.yaml
  text: Jesus said to him[a], “If I want him to remain until I come[b], what is that to you? You follow me.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “यदि मैं चाहता हूँ कि वह मेरे आने तक[b] बना रहे,[a] तो इससे तुम्हें क्या? तुम मेरे पीछे चलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं चाहूँ कि वह मेरे आने तक बना रहे।” यूनानी क्रिया इच्छा या इच्छाशक्ति—दोनों व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “मेरे आने तक” का आशय जानबूझकर खुला रखा गया है; इस पद में यह स्पष्ट नहीं किया गया कि यीशु किस आने की बात कर रहे हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक वाक्य आरम्भ करता है; ‘यदि’ स्वाभाविक हिन्दी में इसकी काल्पनिक शर्त को बनाए रखता है।
- source_word: θέλω
  choice: मैं चाहता हूँ
  rationale: यह क्रिया इच्छा अथवा संकल्प व्यक्त कर सकती है; मुख्य पाठ में ‘चाहता हूँ’ सहज आधुनिक हिन्दी है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: μένειν
  choice: बना रहे
  rationale: यह ‘ठहरे/बना रहे’ का अर्थ देता है और प्रसंग के आधार पर ‘जीवित रहे’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἕως ἔρχομαι
  choice: मेरे आने तक
  rationale: यह अभिव्यक्ति आने की प्रकृति या समय को निर्दिष्ट किए बिना यूनानी पाठ की खुली अर्थ-सम्भावना बनाए रखती है।
- source_word: τί πρὸς σέ;
  choice: तो इससे तुम्हें क्या?
  rationale: यह मुहावरे का सीधा और स्वाभाविक हिन्दी रूप है, जो दूसरे चेले के विषय में पतरस की चिंता को रोकने वाली तीक्ष्णता बनाए रखता है।
- source_word: σύ μοι ἀκολούθει
  choice: तुम मेरे पीछे चलते रहो
  rationale: स्पष्ट ‘तुम’ विरोधात्मक बल को सुरक्षित रखता है, और वर्तमान आज्ञार्थक के निरन्तर अनुसरण के भाव को ‘चलते रहो’ व्यक्त करता है।
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथाशैली में भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: ἕως ἔρχομαι में यीशु के ‘आने’ का आशय
  choice: ‘मेरे आने तक’—आने की घटना को अनिर्दिष्ट रखा गया है।
  alternative: इसे पुनरुत्थान के बाद प्रकट होने, यरूशलेम पर न्याय, अथवा अन्तिम आगमन के रूप में स्पष्ट करना।
  rationale: पद स्वयं इस ‘आने’ की पहचान निश्चित नहीं करता; इसलिए अनुवाद किसी एक ऐतिहासिक या अन्तकालीन व्याख्या को आरोपित नहीं करता।
- issue: θέλω में इच्छा और संकल्प का सम्बन्ध
  choice: मुख्य पाठ में ‘चाहता हूँ’।
  alternative: ‘मेरी इच्छा हो’ अथवा ‘मैं ठहराना चाहूँ’।
  rationale: θέλω इच्छा और संकल्प दोनों व्यक्त कर सकता है। सहज हिन्दी के लिए ‘चाहता हूँ’ चुना गया है और व्यापक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज भाषा। ‘बना रहे’ यूहन्ना के μένω की व्यापकता बचाता है, जबकि ‘चलते रहो’ वर्तमान आज्ञार्थक के निरन्तर भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
