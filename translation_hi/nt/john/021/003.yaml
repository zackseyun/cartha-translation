base_translation:
  language: en
  yaml_path: translation/nt/john/021/003.yaml
  text: Simon Peter said to them[a], “I am going to fish.” They said to him, “We are also coming with you.” They went out and got into the boat, and that night they caught nothing.
translation:
  language: hi
  text: शमौन पतरस ने उनसे कहा,[a] “मैं मछली पकड़ने जा रहा हूँ।” उन्होंने उससे कहा, “हम भी तुम्हारे साथ चलेंगे।” वे बाहर निकले और नाव में चढ़ गए, और उस रात उन्होंने कुछ भी नहीं पकड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ ऐतिहासिक वर्तमान काल है: “शमौन पतरस उनसे कहता है ... वे उससे कहते हैं।” यह कथा-वर्णन की एक सामान्य शैली है, जिसे हिन्दी में प्रायः भूतकाल में व्यक्त किया जाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει / λέγουσιν
  choice: ने कहा / उन्होंने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल अधिक स्वाभाविक है; पादटिप्पणी मूल रूप की सूचना देती है।
- source_word: Ὑπάγω ἁλιεύειν
  choice: मैं मछली पकड़ने जा रहा हूँ
  rationale: यह हिन्दी में निकट भविष्य के इरादे को स्वाभाविक रूप से व्यक्त करता है और गति तथा उद्देश्य दोनों को सुरक्षित रखता है।
- source_word: Ἐρχόμεθα καὶ ἡμεῖς σὺν σοί
  choice: हम भी तुम्हारे साथ चलेंगे
  rationale: “हम भी” καὶ ἡμεῖς के बल को रखता है; इस प्रसंग में साथ जाने की तत्परता के लिए “चलेंगे” सहज हिन्दी है।
- source_word: ἐξῆλθον
  choice: वे बाहर निकले
  rationale: क्रिया के बाहर जाने के मूल अर्थ और कथा की गति को बनाए रखता है।
- source_word: ἐνέβησαν εἰς τὸ πλοῖον
  choice: नाव पर चढ़ गए
  rationale: मछली पकड़ने वाली नाव में सवार होने के लिए यह स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: ἐν ἐκείνῃ τῇ νυκτὶ ἐπίασαν οὐδέν
  choice: उस रात वे कुछ भी न पकड़ सके
  rationale: समय-सूचक पद और पकड़ में पूर्ण असफलता दोनों स्पष्ट तथा सहज हिन्दी में व्यक्त होते हैं।
