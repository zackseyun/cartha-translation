  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Δεῦτε ἀριστήσατε. οὐδεὶς ⸀δὲ ἐτόλμα τῶν μαθητῶν ἐξετάσαι αὐτόν· Σὺ τίς εἶ; εἰδότες ὅτι ὁ κύριός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/012.yaml
  text: Jesus said to them[a], “Come, eat breakfast.” But none of the disciples dared to ask him[b], “Who are you?” knowing that it was the Lord.
translation:
  language: hi
  text: यीशु ने उनसे कहा, “आओ, नाश्ता कर लो।” पर चेलों में से किसी ने भी उनसे यह पूछने[a] का साहस नहीं किया, “आप कौन हैं?” वे जानते थे कि वह प्रभु हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूछने” के लिए प्रयुक्त यूनानी क्रिया का अर्थ “पूछताछ करने” या “बारीकी से जाँचने” का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δεῦτε
  choice: आओ
  rationale: यह आमंत्रण के रूप में प्रयुक्त आज्ञार्थक शब्द है; ‘आओ’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: ἀριστήσατε
  choice: नाश्ता कर लो
  rationale: यूनानी क्रिया विशेष रूप से सुबह का भोजन करने को दर्शाती है; ‘नाश्ता कर लो’ इस अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: οὐδεὶς δὲ
  choice: पर ... किसी ने भी नहीं
  rationale: δέ यहाँ हल्का विरोध अथवा प्रसंग-परिवर्तन दिखाता है, जिसे ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐτόλμα
  choice: साहस नहीं किया
  rationale: τολμάω साहस करने या हिम्मत जुटाने का भाव रखता है; यह हिन्दी प्रयोग प्रसंग के अनुकूल है।
- source_word: ἐξετάσαι
  choice: पूछने
  rationale: सीधे उद्धृत प्रश्न के साथ यहाँ सामान्य अर्थ ‘पूछना’ उपयुक्त है, जबकि अधिक गहराई से पूछताछ करने की संभावित छाया पादटिप्पणी में दी गई है।
- source_word: Σὺ τίς εἶ;
  choice: आप कौन हैं?
  rationale: Σὺ पर बल संभव है, पर हिन्दी में स्वतंत्र सर्वनाम ‘आप’ पहले से स्पष्ट है; सम्मानसूचक रूप यीशु को संबोधित करते समय स्वाभाविक है।
- source_word: εἰδότες ὅτι
  choice: वे जानते थे कि
  rationale: यह कृदन्त शिष्यों के जानने की साथ-साथ चल रही अवस्था बताता है। स्वतंत्र वाक्य हिन्दी में स्वाभाविक है और कारणात्मक संबंध को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: ὁ κύριός
  choice: प्रभु
  rationale: पुनरुत्थान के इस प्रसंग में κύριος के मसीही और कथात्मक भार को ‘प्रभु’ सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ इस पुनरुत्थान-दर्शन में उपाधि का मसीही महत्व बनाए रखता है, जबकि ‘स्वामी’ अर्थ को अनावश्यक रूप से केवल सामाजिक संबोधन तक सीमित कर सकता है।
- issue: εἰδότες कृदन्त का संबंध
  choice: वे जानते थे कि
  alternative: क्योंकि वे जानते थे कि
  rationale: मूल कृदन्त परिस्थिति या कारण—दोनों की छाया रख सकता है। स्वतंत्र कथन उस वास्तविक अस्पष्टता को बनाए रखता है और स्पष्ट कारणात्मक अर्थ नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘नाश्ता कर लो’ सुबह के भोजन की विशिष्टता व्यक्त करता है; इसके लिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
