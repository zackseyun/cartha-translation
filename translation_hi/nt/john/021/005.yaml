lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यहाँ οὖν कथा को आगे बढ़ाने वाला संबंधसूचक शब्द है; आधुनिक हिन्दी में “तब” स्वाभाविक है और अनावश्यक तार्किक निष्कर्ष का भाव नहीं जोड़ता।
- source_word: Παιδία
  choice: बच्चो
  rationale: सम्बोधन के रूप में यह आत्मीयता दर्शाता है। “बच्चो” मूल के प्रत्यक्ष अर्थ और स्नेहपूर्ण लहजे को बनाए रखता है; “मित्रो” अधिक व्याख्यात्मक होता।
- source_word: μή τι
  choice: '...तो नहीं है?'
  rationale: μή से आरम्भ प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिन्दी की “तो नहीं” संरचना उस अपेक्षा को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: προσφάγιον
  choice: खाने के लिए कुछ मछली
  rationale: यह शब्द मूलतः रोटी के साथ खाए जाने वाले खाद्य पदार्थ को सूचित करता है; मछली पकड़ने के इस प्रसंग में मछली अभिप्रेत होना सबसे स्वाभाविक है। “कुछ मछली” हिन्दी में परिमाणवाचक अर्थ भी सहजता से देता है।
- source_word: ἔχετε
  choice: तुम्हारे पास ... है
  rationale: साधारण अधिकार या उपलब्धता को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπεκρίθησαν αὐτῷ
  choice: उन्होंने उसे उत्तर दिया
  rationale: मूल की सामान्य कथात्मक उत्तर-सूचना का सीधा और गरिमापूर्ण अनुवाद।
- source_word: Οὔ
  choice: नहीं
  rationale: यूनानी के संक्षिप्त नकारात्मक उत्तर को उसी संक्षिप्तता से रखता है।
