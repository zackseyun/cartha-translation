  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘भूमि’ की अपेक्षा ‘किनारा’ प्रसंगानुकूल है। संख्या और जाल के न फटने के बीच मूल पाठ का तनाव स्पष्ट रखा गया है।
