  text: ἀνέβη ⸀οὖν Σίμων Πέτρος καὶ εἵλκυσεν τὸ δίκτυον ⸂εἰς τὴν γῆν⸃ μεστὸν ἰχθύων μεγάλων ἑκατὸν πεντήκοντα τριῶν· καὶ τοσούτων ὄντων οὐκ ἐσχίσθη τὸ δίκτυον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/011.yaml
  text: So Simon Peter went aboard and pulled the net onto the shore[a], full of large fish, one hundred fifty-three; and though there were so many[b], the net was not torn.
translation:
  language: hi
  text: तब शमौन पतरस नाव पर चढ़ा[a] और जाल को किनारे पर खींच लाया। जाल एक सौ तिरपन बड़ी मछलियों से भरा था; और इतनी मछलियाँ होने पर भी जाल नहीं फटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘ऊपर चढ़ा’; प्रसंग में सम्भवतः पतरस जाल खींचने के लिए नाव पर चढ़ा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη
  choice: नाव पर चढ़ा
  rationale: क्रिया का मूल अर्थ ‘ऊपर चढ़ा’ है; इस प्रसंग में स्वाभाविक रूप से नाव पर चढ़ना अभिप्रेत है। मुख्य पाठ में प्रसंग स्पष्ट किया गया है और पादटिप्पणी मूल की संक्षिप्त अभिव्यक्ति बताती है।
- source_word: οὖν
  choice: तब
  rationale: यह पिछले आदेश के प्रत्युत्तर में आगे बढ़ती कथात्मक क्रिया को जोड़ता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक है।
- source_word: εἵλκυσεν
  choice: खींच लाया
  rationale: जाल को पानी से किनारे तक खींचने की दिशा और क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ δίκτυον
  choice: जाल
  rationale: मछली पकड़ने के साधन के लिए सीधा और मानक हिन्दी शब्द।
- source_word: εἰς τὴν γῆν
  choice: किनारे पर
  rationale: शाब्दिक अर्थ ‘भूमि पर’ है, पर झील में मछली पकड़ने के प्रसंग में ‘किनारे पर’ आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: μεστὸν ἰχθύων μεγάλων
  choice: बड़ी मछलियों से भरा
  rationale: विशेषण और संबंधकारक पदबंध का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ἑκατὸν πεντήκοντα τριῶν
  choice: एक सौ तिरपन
  rationale: मूल पाठ में दी गई निश्चित संख्या को यथावत रखता है।
- source_word: τοσούτων ὄντων
  choice: इतनी मछलियाँ होने पर भी
  rationale: संबंधकारक निरपेक्ष रचना के प्रसंगगत रियायती भाव को व्यक्त करता है और ‘इतनी’ का संदर्भ स्पष्ट करता है।
- source_word: οὐκ ἐσχίσθη
  choice: नहीं फटा
  rationale: यूनानी अओरिस्ट कर्मवाच्य का स्वाभाविक हिन्दी रूप; जाल के भारी दबाव में भी साबुत रहने को व्यक्त करता है।
