source:
  edition: SBLGNT
  text: ἐξῆλθεν οὖν ⸂οὗτος ὁ λόγος⸃ εἰς τοὺς ἀδελφοὺς ὅτι ὁ μαθητὴς ἐκεῖνος οὐκ ἀποθνῄσκει. ⸂οὐκ εἶπεν δὲ⸃ αὐτῷ ὁ Ἰησοῦς ὅτι οὐκ ἀποθνῄσκει ἀλλ’· Ἐὰν αὐτὸν θέλω μένειν ἕως ἔρχομαι, τί πρὸς σέ;
base_translation:
  language: en
  yaml_path: translation/nt/john/021/023.yaml
  text: So this report spread among the brothers that that disciple would not die. Yet Jesus did not say to him that he would not die, but, “If I want him to remain until I come, what is that to you?”
translation:
  language: hi
  text: इसलिए भाइयों[b] के बीच यह बात[a] फैल गई कि वह शिष्य नहीं मरेगा। पर यीशु ने उससे यह नहीं कहा कि वह नहीं मरेगा; बल्कि कहा, “यदि मैं चाहूँ कि वह मेरे आने तक बना रहे, तो तुझे इससे क्या?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह कथन फैल गया।” यूनानी λόγος का अर्थ “बात,” “कथन,” या “समाचार” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से आशय शिष्यों के समुदाय से है; यूनानी में पुल्लिंग बहुवचन ἀδελφοί प्रयुक्त हुआ है।
    reason: cultural_note
  - marker: c
    text: 'अर्थात यीशु ने यह प्रतिज्ञा नहीं की थी कि यह शिष्य कभी नहीं मरेगा; उन्होंने एक शर्तसूचक बात कही थी: “यदि मैं चाहूँ कि वह मेरे आने तक बना रहे ...।”'
    reason: clarification
lexical_decisions:
- source_word: ἐξῆλθεν οὖν οὗτος ὁ λόγος
  choice: इसलिए ... यह बात फैल गई
  rationale: यूनानी अभिव्यक्ति का आशय किसी कथन या खबर का लोगों में फैल जाना है। ‘यह बात फैल गई’ आधुनिक हिन्दी में स्वाभाविक है और λόγος की ‘बात/कथन’ वाली व्यापकता को बनाए रखता है।
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: भाइयों के बीच
  rationale: यहाँ वाक्यांश शिष्यों के समुदाय के भीतर बात फैलने को दर्शाता है; ἀδελφοί के पुल्लिंग बहुवचन को ‘भाइयों’ से व्यक्त किया गया है।
- source_word: ὁ μαθητὴς ἐκεῖνος
  choice: वह शिष्य
  rationale: ἐκεῖνος किसी पहले से पहचाने गए विशिष्ट शिष्य की ओर संकेत करता है; हिन्दी में ‘वह शिष्य’ स्वाभाविक और स्पष्ट है।
- source_word: οὐκ ἀποθνῄσκει
  choice: नहीं मरेगा
  rationale: यूनानी में वर्तमान रूप होने पर भी प्रसंग में यह फैली हुई धारणा की भविष्य-संबंधी विषयवस्तु है; हिन्दी में ‘नहीं मरेगा’ उचित है।
- source_word: οὐκ εἶπεν δὲ αὐτῷ ὁ Ἰησοῦς
  choice: लेकिन यीशु ने उससे यह नहीं कहा था
  rationale: δέ यहाँ पिछली धारणा का सुधार प्रस्तुत करता है। ‘लेकिन’ विरोध को स्पष्ट करता है और पूर्ण भूत ‘कहा था’ पूर्व कथन की ओर स्वाभाविक संकेत देता है।
- source_word: Ἐὰν αὐτὸν θέλω μένειν
  choice: यदि मैं चाहूँ कि वह ... बना रहे
  rationale: θέλω इच्छा को और μένειν बने रहने को व्यक्त करता है। ‘यदि मैं चाहूँ’ शर्त को वास्तविक प्रतिज्ञा में बदले बिना सुरक्षित रखता है।
- source_word: ἕως ἔρχομαι
  choice: मेरे आने तक
  rationale: यह यूनानी की संक्षिप्तता और भावी संदर्भ को बनाए रखता है; ‘लौटने’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया।
- source_word: τί πρὸς σέ
  choice: तुझे इससे क्या?
  rationale: यह प्रत्यक्ष, संक्षिप्त हिन्दी मुहावरा है जो दूसरे शिष्य के विषय में पतरस की चिंता को अप्रासंगिक ठहराने वाले मूल प्रश्न का बल बनाए रखता है।
theological_decisions:
- issue: उस शिष्य के न मरने संबंधी फैली हुई धारणा का स्वरूप
  choice: ‘यह बात फैल गई’ कहकर समुदाय में प्रचलित कथन दिखाया गया है, फिर यीशु के वास्तविक शब्दों से उसका स्पष्ट सुधार किया गया है।
  alternative: ‘यह समाचार फैल गया’ या अधिक शाब्दिक ‘यह वचन निकल गया’।
  rationale: पद स्वयं गलत निष्कर्ष और यीशु के शर्तसूचक कथन में भेद करता है। अनुवाद यह संकेत नहीं देता कि यीशु ने उस शिष्य के कभी न मरने की प्रतिज्ञा की थी।
- issue: यीशु के कथन की शर्तसूचक प्रकृति
  choice: ‘यदि मैं चाहूँ’ को स्पष्ट शर्त के रूप में रखा गया है।
  alternative: इसे भविष्यवाणी या निश्चित इच्छा के रूप में व्यक्त करना।
  rationale: Ἐὰν के कारण कथन काल्पनिक/शर्तसूचक है; इसे निश्चित भविष्यवाणी बनाना मूल की धार्मिक और कथात्मक तनातनी को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुझे’ यीशु के पतरस से एकवचन प्रत्यक्ष संबोधन को दर्शाता है और इस प्रसंग में स्वाभाविक है। ‘बना रहे’ μένειν की निरंतर बने रहने की धारणा को व्यक्त करता है।
