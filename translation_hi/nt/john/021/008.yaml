translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छोटी नाव,’ ‘किनारे’ और ‘खींचते आ रहे थे’ दृश्य को सामान्य पाठक के लिए स्पष्ट बनाते हैं। प्राचीन माप को मुख्य पाठ में सुरक्षित रखते हुए उसका आधुनिक अनुमान पादटिप्पणी में दिया गया है।
