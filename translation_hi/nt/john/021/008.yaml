source:
  edition: SBLGNT
  text: οἱ δὲ ἄλλοι μαθηταὶ τῷ πλοιαρίῳ ἦλθον, οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων, σύροντες τὸ δίκτυον τῶν ἰχθύων.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/008.yaml
  text: But the other disciples came in the small boat[a], for they were not far from the land, but about two hundred cubits away[c][b], dragging the net of fish.
translation:
  language: hi
  text: पर दूसरे चेले छोटी नाव में आए, क्योंकि वे किनारे से दूर नहीं, बल्कि लगभग दो सौ हाथ[a] की दूरी पर थे। वे मछलियों वाला जाल[b] खींचते आ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दो सौ हाथ लगभग 90 मीटर के बराबर थे।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, “मछलियों का जाल।” यूनानी वाक्यांश जाल में मौजूद मछलियों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἄλλοι μαθηταὶ
  choice: पर दूसरे चेले
  rationale: δέ पिछली आयत में पतरस की अलग कार्रवाई के साथ हल्का विरोध दिखाता है; इसलिए स्वाभाविक हिन्दी में ‘पर’ उपयुक्त है। μαθηταί के लिए सामान्य और प्रचलित बाइबलीय शब्द ‘चेले’ रखा गया है।
- source_word: τῷ πλοιαρίῳ
  choice: छोटी नाव में
  rationale: πλοιάριον का लघुतासूचक भाव ‘छोटी नाव’ से व्यक्त होता है; विभक्ति यहाँ आने के साधन या स्थान को दर्शाती है।
- source_word: οὐ γὰρ ἦσαν μακρὰν ἀπὸ τῆς γῆς
  choice: क्योंकि वे किनारे से दूर नहीं ... थे
  rationale: γάρ कारण बताता है। जल के विपरीत γῆ इस प्रसंग में तट या किनारे को सूचित करता है, इसलिए ‘किनारे’ आधुनिक हिन्दी में ‘भूमि’ से अधिक स्वाभाविक है।
- source_word: ἀλλὰ ὡς ἀπὸ πηχῶν διακοσίων
  choice: बल्कि लगभग दो सौ हाथ की दूरी पर
  rationale: ὡς अनुमान को दर्शाता है। πῆχυς प्राचीन कोहनी-से-उँगली तक की माप है, जिसे हिन्दी की पारंपरिक माप ‘हाथ’ से प्रस्तुत किया गया और आधुनिक अनुमान पादटिप्पणी में दिया गया है।
- source_word: σύροντες
  choice: खींचते आ रहे थे
  rationale: वर्तमान कृदंत उनके आने के साथ चल रही कार्रवाई बताता है। हिन्दी की संयुक्त क्रिया ‘खींचते आ रहे थे’ इस समकालिक गति को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: τὸ δίκτυον τῶν ἰχθύων
  choice: मछलियों वाला जाल
  rationale: सम्बन्धकारक τῶν ἰχθύων को प्रसंग में जाल के भीतर मौजूद मछलियों के रूप में समझना स्वाभाविक है। ‘मछलियों वाला’ यह अर्थ देता है, पर ‘मछलियों से भरा’ कहकर जाल के पूरी तरह भरे होने की अतिरिक्त बात नहीं जोड़ता।
