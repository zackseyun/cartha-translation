source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν σημαίνων ποίῳ θανάτῳ δοξάσει τὸν θεόν. καὶ τοῦτο εἰπὼν λέγει αὐτῷ· Ἀκολούθει μοι.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/019.yaml
  text: He said this to indicate by what kind of death he would glorify God[a]. And after saying this, he says to him[b], “Follow me.”
translation:
  language: hi
  text: यीशु ने यह संकेत देने के लिए यह बात कही कि पतरस किस प्रकार की मृत्यु से[a] परमेश्वर की महिमा करेगा। और यह कहकर वह उससे कहता है,[b] “मेरे पीछे चल।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कैसी मृत्यु से।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में यहाँ सजीव ऐतिहासिक वर्तमानकाल है: “वह उससे कहता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: σημαίνων
  choice: यह संकेत करने के लिए
  rationale: यह कृदन्त यीशु के कथन का आशय स्पष्ट करता है। ‘संकेत करने’ से किसी बात को अप्रत्यक्ष रूप से प्रकट करने का भाव बना रहता है।
- source_word: ποίῳ θανάτῳ
  choice: किस प्रकार की मृत्यु से
  rationale: ποίῳ का गुणात्मक भाव केवल ‘किस मृत्यु’ से अधिक है; यह मृत्यु के प्रकार या ढंग की ओर संकेत करता है। हिन्दी में ‘से’ साधनवाचक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δοξάσει τὸν θεόν
  choice: परमेश्वर की महिमा करेगा
  rationale: भविष्यकाल को यथावत रखा गया है और वाक्य को सामान्य हिन्दी मुहावरे के अनुसार बनाया गया है।
- source_word: καὶ τοῦτο εἰπὼν
  choice: और यह कहकर
  rationale: यूनानी के पूर्वकालिक कृदन्त को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: λέγει αὐτῷ
  choice: वह उससे कहता है
  rationale: वर्तमानकालीन रूप ‘कहता है’ यूहन्ना की सजीव ऐतिहासिक-वर्तमान शैली को सुरक्षित रखता है।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे चल
  rationale: यह वर्तमान आज्ञार्थक का स्वाभाविक आधुनिक हिन्दी रूप है और तत्काल तथा निरन्तर शिष्यत्व—दोनों की सम्भावना खुली रखता है।
theological_decisions:
- issue: पतरस की मृत्यु के द्वारा परमेश्वर की महिमा
  choice: ‘परमेश्वर की महिमा करेगा’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: यह स्पष्ट जोड़ना कि पतरस शहीद होकर या अपने विश्वासयोग्य साक्ष्य के द्वारा परमेश्वर की महिमा करेगा।
  rationale: पाठ मृत्यु को परमेश्वर की महिमा से जोड़ता है, पर यह नहीं बताता कि ऐसा ठीक किस रीति से होगा; इसलिए अनुवाद उस धार्मिक अर्थ और तनाव को खुला रखता है।
- issue: दो निहित कर्ताओं की पहचान
  choice: स्पष्टता के लिए पहले कर्ता को ‘यीशु’ और भावी मृत्यु वाले कर्ता को ‘पतरस’ कहा गया है।
  alternative: दोनों स्थानों पर केवल ‘वह’ रखकर यूनानी की सर्वनामगत संरचना का अनुकरण करना।
  rationale: सन्दर्भ में व्यक्तियों की पहचान स्पष्ट है, पर हिन्दी में लगातार ‘वह’ रखने से यह भ्रम हो सकता है कि यीशु अपनी ही मृत्यु की बात कह रहे हैं। नामों का प्रयोग अर्थ नहीं बढ़ाता, केवल संदर्भित व्यक्तियों को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘मेरे पीछे चल’ को पुराने या अत्यधिक धार्मिक मुहावरों की अपेक्षा स्वाभाविक आज्ञा के रूप में रखा गया है; ऐतिहासिक वर्तमान को मुख्य पाठ में सुरक्षित रखा गया है।
