source:
  edition: SBLGNT
  text: ἔστιν δὲ καὶ ἄλλα πολλὰ ⸀ἃ ἐποίησεν ὁ Ἰησοῦς, ἅτινα ἐὰν γράφηται καθ’ ἕν, οὐδ’ αὐτὸν οἶμαι τὸν κόσμον ⸀χωρήσειν τὰ γραφόμενα ⸀βιβλία.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/025.yaml
  text: There are also many other things that Jesus did[a], which, if they were written down one by one, I suppose that not even the world itself would have room for the books being written.
translation:
  language: hi
  text: यीशु ने और भी बहुत-से काम किए। यदि वे एक-एक करके लिखे जाते, तो मुझे लगता है कि लिखी जानेवाली पुस्तकों के लिए स्वयं संसार में भी जगह न होती।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लिखी जानेवाली पुस्तकों को स्वयं संसार भी समा न पाता।” यूनानी क्रिया का अर्थ “जगह होना” या “समाना/समाहित करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ καὶ ἄλλα πολλὰ ἃ ἐποίησεν ὁ Ἰησοῦς
  choice: यीशु ने और भी बहुत-से काम किए
  rationale: ‘और भी’ अतिरिक्त कामों का भाव रखता है; ποιέω को इस प्रसंग में स्वाभाविक और व्यापक ‘काम किए’ से व्यक्त किया गया है। δέ का हल्का संयोजक बल ‘और भी’ में समाहित है।
- source_word: ἐὰν γράφηται καθ’ ἕν
  choice: यदि वे एक-एक करके लिखे जाते
  rationale: ἐάν के साथ वर्तमान कर्मवाच्य संभावनार्थक क्रिया काल्पनिक शर्त व्यक्त करती है; ‘एक-एक करके’ καθ’ ἕν के वितरणात्मक बल को सुरक्षित रखता है।
- source_word: οὐδ’ αὐτὸν οἶμαι τὸν κόσμον χωρήσειν
  choice: तो मुझे लगता है कि ... स्वयं संसार में भी जगह न होती
  rationale: οἶμαι के लेखक-केंद्रित कथन को ‘मुझे लगता है’ से रखा गया है; αὐτόν का बल ‘स्वयं’ और οὐδέ का बल ‘भी ... न’ से व्यक्त है। χωρέω की स्थान-संबंधी छवि को ‘जगह न होती’ सुरक्षित रखता है।
- source_word: τὰ γραφόμενα βιβλία
  choice: लिखी जानेवाली पुस्तकें
  rationale: वर्तमान कर्मवाच्य कृदंत को हिंदी में स्वाभाविक रूप से प्रस्तुत करते हुए काल्पनिक लेखन से बननेवाली पुस्तकों का आशय रखा गया है।
theological_decisions:
- issue: संसार में पुस्तकों के लिए स्थान न होने का अतिशयोक्तिपूर्ण कथन
  choice: स्थान की मूल छवि सहित अलंकारिक अतिशयोक्ति को ज्यों का त्यों रखा गया
  alternative: इसे ढीले रूप में ‘अनगिनत पुस्तकें बन जातीं’ कहना
  rationale: मूल पाठ यीशु के कार्यों की विशालता पर बल देने के लिए जानबूझकर अतिशयोक्ति करता है; अनुवाद न इसे कठोर शाब्दिक दावा बनाता है, न इसकी तीव्रता घटाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य को हिंदी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर उसका तार्किक संबंध और समापन की अलंकारिक शक्ति सुरक्षित है।
