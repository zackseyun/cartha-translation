source:
  edition: SBLGNT
  text: Πρωΐας δὲ ἤδη ⸀γενομένης ⸀ἔστη Ἰησοῦς εἰς τὸν αἰγιαλόν· οὐ μέντοι ᾔδεισαν οἱ μαθηταὶ ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/004.yaml
  text: When daybreak had already come[a], Jesus stood on the shore; yet the disciples did not know that it was Jesus.
translation:
  language: hi
  text: जब भोर हो चुकी थी, तब यीशु किनारे पर आ खड़े हुए; फिर भी शिष्य यह नहीं जानते थे[a] कि वे यीशु हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “यह नहीं पहचान पाए कि वे यीशु हैं।” यूनानी में अधिक शाब्दिक रूप से: “यह नहीं जानते थे कि वे यीशु हैं।”'
    reason: οἶδα का मूल अर्थ ‘जानना’ है, जबकि इस प्रसंग में उसका आशय ‘पहचानना’ भी हो सकता है; पादटिप्पणी दोनों सम्भावनाएँ सामने रखती है।
lexical_decisions:
- source_word: Πρωΐας δὲ ἤδη γενομένης
  choice: जब भोर हो चुकी थी, तब
  rationale: सम्बन्धकारक निरपेक्ष रचना समय की परिस्थिति बताती है। ‘भोर’ πρωΐα के आरम्भिक सुबह वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘हो चुकी थी’ ἤδη तथा γενομένης को दर्शाता है। δέ को अलग शब्द से व्यक्त करने के बजाय हिन्दी की ‘जब…तब’ रचना में कथानक की सहज प्रगति रखी गई है।
- source_word: ἔστη
  choice: आ खड़े हुए
  rationale: ἵστημι का अओरिस्ट यहाँ यीशु के किनारे पर खड़े होने की घटना बताता है। ‘आ खड़े हुए’ हिन्दी में स्वाभाविक है और εἰς के दिशात्मक रंग को भी हल्के रूप में बनाए रखता है, बिना किसी अतिरिक्त कारण या ढंग का संकेत दिए।
- source_word: εἰς τὸν αἰγιαλόν
  choice: किनारे पर
  rationale: क्रिया ‘खड़े होना’ के साथ εἰς यहाँ स्थान को मुहावरेदार ढंग से व्यक्त करता है। αἰγιαλός झील के तट या किनारे को दर्शाता है; प्रसंग में ‘किनारे पर’ सरल और सटीक है।
- source_word: οὐ μέντοι
  choice: फिर भी … नहीं
  rationale: यह संयोजन यीशु के सामने उपस्थित होने और शिष्यों के उन्हें न जानने के बीच विरोध दिखाता है। ‘फिर भी’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ᾔδεισαν
  choice: जानते थे
  rationale: मूल क्रिया οἶδα का सीधा अर्थ ‘जानना’ है। प्रसंग में पहचानने का भाव सम्भव है, पर मुख्य पाठ अधिक विशिष्ट अर्थ को अनिवार्य नहीं बनाता; इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: οἱ μαθηταὶ
  choice: शिष्य
  rationale: निश्चित उपपद परिचित शिष्य-समूह की ओर संकेत करता है। हिन्दी में प्रसंग से निश्चितता स्पष्ट है, इसलिए किसी अतिरिक्त संबंधवाचक शब्द की आवश्यकता नहीं है।
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: कि वह यीशु हैं
  rationale: पहचान बताने वाली इस यूनानी उपवाक्य-रचना को हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है। ‘हैं’ यीशु के लिए प्रचलित सम्मानसूचक प्रयोग है।
theological_decisions:
- issue: पुनरुत्थान के बाद यीशु को न जानना या न पहचानना
  choice: मुख्य पाठ में ‘नहीं जानते थे’ रखा गया है और ‘पहचान नहीं पाए’ को पादटिप्पणी में दिया गया है।
  alternative: ‘पहचान नहीं पाए कि वह यीशु हैं’
  rationale: पद यह बताता है कि शिष्यों ने यीशु को नहीं जाना, पर इसका कारण नहीं बताता। यह अनुवाद उनके न पहचानने के पीछे यीशु के रूप, अलौकिक रोक या शिष्यों की धारणा के बारे में कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। वाक्य में ‘जब…तब’ समय-संबंध को स्पष्ट करता है; अर्धविराम उपस्थिति और न जानने के बीच विरोध को पठनीय बनाता है। यीशु के लिए सम्मानसूचक क्रिया-रूप प्रयुक्त है।
