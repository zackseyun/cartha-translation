    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में यह ऐतिहासिक वर्तमान है; हिन्दी कथात्मक शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और संवाद की भूमिका बनाए रखता है।
- source_word: Ἐνέγκατε
  choice: ले आओ
  rationale: यह बहुवचन में सीधी आज्ञा है; ‘ले आओ’ मछलियों को यीशु के पास लाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῶν ὀψαρίων
  choice: मछलियों में से कुछ
  rationale: ἀπό के अंशवाचक प्रयोग को हिन्दी में ‘में से कुछ’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀψαρίων
  choice: मछलियाँ
  rationale: संदर्भ अभी समुद्र से पकड़ी गई मछलियों का है; आकार या पकाए जाने की अवस्था को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ὧν ἐπιάσατε
  choice: जो ... तुमने ... पकड़ी हैं
  rationale: सम्बन्धवाचक उपवाक्य उन्हीं मछलियों की पहचान करता है; ‘पकड़ी हैं’ हाल में पूरी हुई क्रिया का वर्तमान से संबंध बनाए रखता है।
- source_word: νῦν
  choice: अभी
  rationale: ‘अभी’ हाल ही में हुई पकड़ की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है और ‘अब’ की संभावित समयगत कठोरता से बचता है।
