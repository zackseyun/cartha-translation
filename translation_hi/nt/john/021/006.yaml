base_translation:
  language: en
  yaml_path: translation/nt/john/021/006.yaml
  text: But he said to them[a], “Cast the net on the right side of the boat, and you will find some.” So they cast it, and they were no longer able to haul it in because of the multitude of fish.
translation:
  language: hi
  text: पर उसने उनसे कहा, “नाव की दाहिनी ओर जाल डालो, तो तुम्हें कुछ मछलियाँ मिलेंगी[a]।” इसलिए उन्होंने जाल डाला, और मछलियों की बहुतायत के कारण वे अब उसे खींचने में समर्थ नहीं रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल, “तो तुम्हें मिलेगा”; यूनानी में कर्म (अर्थात् “मछलियाँ” या “कुछ मछलियाँ”) स्पष्ट रूप से नहीं कहा गया है, बल्कि मछली पकड़ने के प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Βάλετε
  choice: जाल डालो
  rationale: मछली पकड़ने के प्रसंग में βάλλω के आज्ञार्थक रूप का स्वाभाविक हिन्दी प्रयोग; केवल ‘फेंको’ की अपेक्षा अधिक प्रसंगानुकूल।
- source_word: τὰ δεξιὰ μέρη τοῦ πλοίου
  choice: नाव की दाहिनी ओर
  rationale: शाब्दिक ‘दाहिने भागों’ के बजाय दिशा और स्थान को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: πλοίου
  choice: नाव
  rationale: गलील की मछली पकड़ने वाली छोटी जलयान-संदर्भ में ‘नाव’ स्वाभाविक है।
- source_word: τὸ δίκτυον
  choice: जाल
  rationale: मछली पकड़ने के जाल के लिए सीधा और प्रचलित हिन्दी शब्द।
- source_word: εὑρήσετε
  choice: तुम्हें कुछ मछलियाँ मिलेंगी
  rationale: यूनानी में कर्म व्यक्त नहीं है, पर मछली पकड़ने के प्रसंग से निहित है; ‘कुछ मछलियाँ’ सहज हिन्दी बनाता है, और पादटिप्पणी मूल की संक्षिप्तता बताती है।
- source_word: οὐκέτι ... ἴσχυον
  choice: वे ... नहीं पाए
  rationale: यहाँ सामर्थ्य के अभाव को आधुनिक हिन्दी की स्वाभाविक क्रिया-रचना में व्यक्त करता है; प्रसंग में पहले की स्थिति से परिवर्तन स्वतः स्पष्ट है।
- source_word: ἑλκύσαι
  choice: खींच
  rationale: भरे हुए जाल को अपनी ओर लाने की शारीरिक क्रिया के लिए सरल और सटीक शब्द।
- source_word: ἀπὸ τοῦ πλήθους τῶν ἰχθύων
  choice: मछलियों की बहुतायत के कारण
  rationale: ἀπό की प्रसंगगत कारणवाचक शक्ति और πλήθος की बड़ी संख्या/बहुतायत दोनों को गरिमापूर्ण, स्वाभाविक हिन्दी में रखता है।
