  yaml_path: translation/nt/john/021/001.yaml
  text: After these things[a], Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way.
translation:
  language: hi
  text: इन बातों के बाद, यीशु ने तिबिरियास झील के किनारे चेलों को फिर अपने आप को प्रकट किया[a]। उसने अपने आप को इस प्रकार प्रकट किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दिखाई दिया’; यूनानी क्रिया का अर्थ स्वयं को दिखाई देना या ज्ञात कराना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह बहुवचन संकेतवाचक अभिव्यक्ति और यूहन्ना की कथात्मक शैली को बनाए रखते हुए स्वाभाविक हिन्दी काल-संक्रमण देती है।
- source_word: ἐφανέρωσεν ἑαυτὸν
  choice: अपने आपको प्रकट किया
  rationale: यह यूनानी क्रिया के दृश्य होने और अपने को ज्ञात कराने, दोनों अर्थ-आयामों तथा आत्मवाचक बल को सुरक्षित रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पहले हो चुके पुनरुत्थान-प्रकटीकरणों के बाद पुनरावृत्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῖς μαθηταῖς
  choice: चेलों पर
  rationale: ‘चेलों’ मूल पाठ में बिना स्पष्ट स्वत्वसूचक के है; ‘पर प्रकट किया’ हिन्दी में आत्म-प्रकटीकरण का स्वाभाविक निर्माण है।
- source_word: ἐπὶ τῆς θαλάσσης τῆς Τιβεριάδος
  choice: तिबिरियास झील के किनारे
  rationale: ἐπί के स्थानवाचक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में देता है; θαλάσσης का यहाँ अभिप्राय गलील की झील से है, इसलिए ‘झील’ आधुनिक पाठक के लिए भौगोलिक रूप से उपयुक्त है।
- source_word: ἐφανέρωσεν δὲ οὕτως
  choice: उसने अपने आपको इस प्रकार प्रकट किया
  rationale: मूल में क्रिया की पुनरावृत्ति को साहित्यिक सामंजस्य के लिए बनाए रखा गया है और οὕτως आगामी वर्णन की रीति प्रस्तुत करता है।
theological_decisions:
- issue: पुनरुत्थान के बाद यीशु के दिखाई देने की भाषा
  choice: अपने आपको प्रकट किया
  alternative: दिखाई दिया; अपने आपको ज्ञात कराया
  rationale: यह अनुवाद वास्तविक दृश्य उपस्थिति को नकारे बिना यूनानी φανερόω में निहित आत्म-प्रकाशन और स्वयं को ज्ञात कराने के भाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘तिबिरियास झील’ पारंपरिक नाम को रखते हुए भौगोलिक अर्थ स्पष्ट करता है; दोनों खंडों में ‘प्रकट किया’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
