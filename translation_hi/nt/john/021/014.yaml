translation:
  language: hi
  text: यह अब तीसरी बार था कि यीशु मरे हुओं में से जिलाए जाने के बाद चेलों के सामने प्रकट हुए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह अब तीसरी बार था कि यीशु मरे हुओं में से जिलाए जाने के बाद चेलों को दिखाई दिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο ἤδη τρίτον
  choice: यह तीसरी बार था
  rationale: यह पद अभी-अभी वर्णित घटना की ओर संकेत करते हुए उसे तीसरा प्रकटन बताता है। हिन्दी में यह स्वाभाविक और स्पष्ट है; ἤδη का प्रसंगगत भाव गिनती के इस बिंदु तक पहुँचने में निहित है।
- source_word: ἐφανερώθη
  choice: प्रकट हुए
  rationale: यूनानी निष्क्रिय रूप का मूल भाव ‘प्रकट किया गया/प्रकट हुआ’ है। यीशु के व्यक्त होने के संदर्भ में ‘प्रकट हुए’ स्वाभाविक हिन्दी है और यूहन्ना की प्रकटन-संबंधी भाषा को बनाए रखता है।
- source_word: τοῖς μαθηταῖς
  choice: चेलों पर
  rationale: φανερόω के साथ दत्तिव यहाँ उन व्यक्तियों को बताता है जिनके सामने यीशु प्रकट हुए। ‘चेलों पर प्रकट हुए’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और यूनानी में अनुल्लिखित ‘अपने’ नहीं जोड़ता।
- source_word: ἐγερθεὶς ἐκ νεκρῶν
  choice: मरे हुओं में से जिलाए जाने के बाद
  rationale: अओरिस्ट निष्क्रिय कृदन्त मुख्य क्रिया से पहले हुई घटना दर्शाता है। यह अनुवाद निष्क्रिय वाच्य और पुनरुत्थान की कालगत पूर्वता, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ἐγερθεὶς ἐκ νεκρῶν में पुनरुत्थान की भाषा
  choice: मरे हुओं में से जिलाए जाने के बाद
  alternative: मरे हुओं में से जी उठने के बाद
  rationale: यूनानी कृदन्त निष्क्रिय है; इसलिए मुख्य पाठ में ‘जिलाए जाने’ से स्रोत का वाच्य सुरक्षित रखा गया है, बिना पुनरुत्थान के अर्थ को बदले।
- issue: ἐφανερώθη का रूप और अर्थ
  choice: प्रकट हुए
  alternative: प्रकट किए गए
  rationale: यद्यपि यूनानी रूप व्याकरणतः निष्क्रिय है, हिन्दी में किसी व्यक्ति के संदर्भ में ‘प्रकट किए गए’ अस्वाभाविक और संभावित रूप से भ्रामक है। ‘प्रकट हुए’ उसी प्रकटन-भाव को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘चेलों’ का चयन यूहन्ना के परिचित बाइबलीय पदबंध को बनाए रखता है; वाक्य में स्रोत से परे ‘अपने’ नहीं जोड़ा गया।
