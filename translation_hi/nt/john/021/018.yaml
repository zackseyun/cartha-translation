id: JHN.21.18
reference: John 21:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι, ὅτε ἦς νεώτερος, ἐζώννυες σεαυτὸν καὶ περιεπάτεις ὅπου ἤθελες· ὅταν δὲ γηράσῃς, ἐκτενεῖς τὰς χεῖράς σου, καὶ ἄλλος ⸂σε ζώσει⸃ καὶ οἴσει ὅπου οὐ θέλεις.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/018.yaml
  text: Truly[a], truly, I say to you, when you were younger, you used to dress yourself and walk where you wanted; but when you grow old, you will stretch out your hands[c][b], and another will dress you and carry you where you do not want to go.
translation:
  language: hi
  text: '“मैं तुमसे सच-सच कहता हूँ: जब तुम जवान थे, तब अपने वस्त्र स्वयं पहनते थे[a] और जहाँ चाहते थे वहाँ चलते थे; लेकिन जब तुम बूढ़े हो जाओगे, तो अपने हाथ फैलाओगे[b], और कोई दूसरा तुम्हें वस्त्र पहनाएगा और तुम्हें वहाँ ले जाएगा[c] जहाँ तुम नहीं जाना चाहते।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “अपनी कमर कसते थे” या “अपने को कमरबंद से सज्जित करते थे।” यही यूनानी क्रिया आगे “कोई दूसरा तुम्हें वस्त्र पहनाएगा” में भी आई है और पतरस की पहले की स्वतंत्रता तथा बाद की पराधीनता के बीच विरोध दिखाती है।
    reason: lexical_alternative
  - marker: b
    text: “अपने हाथ फैलाओगे” को प्रायः पतरस की क्रूस पर मृत्यु की ओर संकेत माना जाता है। अगला पद बताता है कि यीशु ने यह उस मृत्यु के प्रकार का संकेत देने के लिए कहा था जिसके द्वारा पतरस परमेश्वर की महिमा करेगा।
    reason: cross_reference
  - marker: c
    text: या “तुम्हें उठाकर ले जाएगा” अथवा “ले चलेगा।” यूनानी क्रिया किसी को अनचाहे स्थान की ओर ले जाए जाने या पहुँचाए जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव की गंभीरता और जोर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὅτε ἦς νεώτερος
  choice: जब तुम जवान थे
  rationale: यह पतरस की पहले की अपेक्षाकृत कम आयु को आगामी बुढ़ापे के विपरीत रखता है; हिन्दी में ‘जवान’ इस तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐζώννυες σεαυτόν / ἄλλος σε ζώσει
  choice: अपनी कमर स्वयं बाँधते थे / कोई दूसरा तुम्हारी कमर बाँधेगा
  rationale: एक ही यूनानी क्रिया के दोनों प्रयोगों में शब्दगत समानता बनाए रखकर पहले की स्वतंत्रता और बाद की पराधीनता का विरोध स्पष्ट करता है।
- source_word: περιεπάτεις ὅπου ἤθελες
  choice: जहाँ चाहते थे वहाँ चलते थे
  rationale: यहाँ साधारण आवागमन का ठोस अर्थ है, न कि नैतिक चाल-चलन का रूपक।
- source_word: ὅταν δὲ γηράσῃς
  choice: लेकिन जब तुम बूढ़े हो जाओगे
  rationale: δέ के विरोध और भविष्य की ओर संकेत करने वाली कालगत रचना को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐκτενεῖς τὰς χεῖράς σου
  choice: अपने हाथ फैलाओगे
  rationale: चित्रात्मक कथन को बिना उसकी व्याख्या मुख्य पाठ में जोड़े सीधे रूप में सुरक्षित रखता है।
- source_word: οἴσει
  choice: ले जाएगा
  rationale: φέρω के प्रसंगगत अर्थ—किसी को किसी स्थान तक ले जाना या ले चलना—को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विवशता का भाव पूरे वाक्य से उभरता है।
- source_word: ὅπου οὐ θέλεις
  choice: जहाँ तुम नहीं जाना चाहते
  rationale: यूनानी में निहित गति के भाव को हिन्दी में आवश्यक ‘जाना’ जोड़कर स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: क्या इस कथन को मुख्य पाठ में सीधे क्रूस पर चढ़ाए जाने की भविष्यवाणी के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में हाथ फैलाने और दूसरे द्वारा कमर बाँधकर ले जाए जाने की मूल चित्रात्मक भाषा बनाए रखना
  alternative: इसे स्पष्ट रूप से क्रूस पर चढ़ाए जाने और बाँधे जाने के रूप में अनुवाद करना
  rationale: अगला पद स्वयं बताता है कि यीशु ने यह पतरस की मृत्यु के प्रकार का संकेत देने के लिए कहा था। इसलिए इस पद में कथन की वास्तविक सांकेतिकता और पाठ की क्रमिक व्याख्या को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सच-सच’ यूहन्ना की दोहरी गंभीर उद्घोषणा को सुरक्षित रखता है। ‘कमर बाँधना’ वस्त्र बाँधने की प्राचीन क्रिया को पर्याप्त रूप से दर्शाता है और दोनों समान यूनानी क्रियाओं के बीच संबंध बनाए रखता है।
