  text: ἦσαν ὁμοῦ Σίμων Πέτρος καὶ Θωμᾶς ὁ λεγόμενος Δίδυμος καὶ Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας καὶ οἱ τοῦ Ζεβεδαίου καὶ ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/002.yaml
  text: Simon Peter[a], Thomas called Didymus, Nathanael from Cana of Galilee, the sons of Zebedee, and two others of his disciples were together.
translation:
  language: hi
  text: शमौन पतरस, थोमा जो दिदुमुस[a] कहलाता था, गलील के काना से नतनएल, जब्दी के पुत्र और उसके चेलों में से दो अन्य एक साथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दिदुमुस’ यूनानी शब्द है, जिसका अर्थ ‘जुड़वाँ’ है।
    reason: नामरूप को रखते हुए यूनानी उपाधि का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: ἦσαν ὁμοῦ
  choice: एक साथ थे
  rationale: अपूर्ण भूतकाल ἦσαν यहाँ बीती हुई अवस्था व्यक्त करता है और ὁμοῦ का अर्थ साथ या एक ही स्थान पर होना है; हिंदी में ‘एक साथ थे’ स्वाभाविक और अर्थपूर्ण है।
- source_word: Σίμων Πέτρος
  choice: शमौन पतरस
  rationale: मूल व्यक्तिगत नाम और उपनाम के प्रचलित हिंदी बाइबलीय रूप रखे गए हैं।
- source_word: Θωμᾶς ὁ λεγόμενος Δίδυμος
  choice: थोमा जो दिदुमुस कहलाता था
  rationale: λεγόμενος को स्वाभाविक रूप से ‘कहलाता था’ और Δίδυμος को नामरूप ‘दिदुमुस’ दिया गया है; उसके शाब्दिक अर्थ ‘जुड़वाँ’ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: Ναθαναὴλ ὁ ἀπὸ Κανὰ τῆς Γαλιλαίας
  choice: गलील के काना नगर का नतनएल
  rationale: ἀπό व्यक्ति के मूल स्थान को बताता है। ‘गलील के काना नगर का’ आधुनिक हिंदी में स्थान-संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ τοῦ Ζεβεδαίου
  choice: जब्दी के बेटे
  rationale: यूनानी संबंधवाचक पदबंध प्रसंग में जब्दी के पुत्रों को निश्चित रूप से सूचित करता है; स्पष्ट हिंदी के लिए ‘बेटे’ जोड़ा गया है।
- source_word: ἄλλοι ἐκ τῶν μαθητῶν αὐτοῦ δύο
  choice: उसके चेलों में से दो अन्य
  rationale: ‘में से’ ἐκ के अंशवाचक भाव को बनाए रखता है और ‘दो अन्य’ मूल शब्दक्रम के आशय को सहज हिंदी में व्यक्त करता है।
- source_word: καί ... καί
  choice: अल्पविरामों से बनी सूची और अंतिम संयोजन
  rationale: बार-बार आए καί सूची के सदस्यों को जोड़ते हैं; हिंदी में अल्पविरामों और अंतिम ‘और’ से वही संबंध स्वाभाविक ढंग से व्यक्त होता है।
