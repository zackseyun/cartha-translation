source:
  edition: SBLGNT
  text: λέγει αὐτῷ πάλιν δεύτερον· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Ποίμαινε τὰ πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/016.yaml
  text: He said to him again a second time[a], “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Shepherd my sheep.”
translation:
  language: hi
  text: उसने उससे फिर दूसरी बार कहा, “शमौन, यूहन्ना के पुत्र, क्या तुम मुझसे प्रेम करते हो?”[a] उसने उससे कहा, “हाँ, प्रभु, आप जानते हैं कि मैं आपसे प्रेम करता हूँ।” उसने उससे कहा, “मेरी भेड़ों की चरवाही करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस संवाद में ‘प्रेम’ के लिए यूनानी में दो अलग क्रियाएँ हैं: यीशु ἀγαπάω का प्रयोग करते हैं और पतरस φιλέω का। कुछ व्याख्याकार इनमें अर्थ का भेद देखते हैं, जबकि अन्य इसे शैलीगत विविधता मानते हैं। मुख्य पाठ में दोनों का अनुवाद ‘प्रेम’ किया गया है, ताकि सम्भावित भेद को आवश्यकता से अधिक प्रबल न किया जाए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν δεύτερον
  choice: फिर, दूसरी बार
  rationale: दोनों यूनानी पद पुनरावृत्ति पर बल देते हैं। हिन्दी में यह थोड़ा पुनरुक्तिपूर्ण है, पर मूल की स्पष्ट अभिव्यक्ति को सुरक्षित रखता है।
- source_word: Σίμων Ἰωάννου
  choice: शमौन, यूहन्ना के पुत्र
  rationale: सम्बन्धकारक Ἰωάννου यहाँ स्वाभाविक रूप से पितृनाम दर्शाता है; इस पाठ में ‘योना के पुत्र’ नहीं है।
- source_word: ἀγαπᾷς / φιλῶ
  choice: प्रेम करते हो / प्रेम करता हूँ
  rationale: दोनों क्रियाओं के अर्थ इस सन्दर्भ में पर्याप्त रूप से एक-दूसरे से मिलते हैं। मुख्य पाठ में अलग हिन्दी क्रियाएँ रखना अनिश्चित भेद को आवश्यकता से अधिक प्रबल कर सकता था; वास्तविक शब्द-भिन्नता पाद-टिप्पणी में दी गई है।
- source_word: κύριε
  choice: प्रभु
  rationale: पतरस का यीशु को किया गया श्रद्धापूर्ण सम्बोधन साधारण ‘महोदय’ की अपेक्षा ‘प्रभु’ से उचित रूप में व्यक्त होता है।
- source_word: σὺ οἶδας
  choice: आप जानते हैं
  rationale: सम्मानसूचक ‘आप’ हिन्दी में स्वाभाविक है और स्पष्ट सर्वनाम के हल्के बल को भी बनाए रखता है।
- source_word: Ποίμαινε
  choice: चरवाही करो
  rationale: यह क्रिया चरवाहे के व्यापक कार्य—देखभाल, मार्गदर्शन और रखवाली—को व्यक्त करती है; केवल ‘खिलाओ’ कहना अर्थ को संकुचित करता।
- source_word: τὰ πρόβατά μου
  choice: मेरी भेड़ों
  rationale: मूल के ठोस चरवाही-रूपक और यीशु के अधिकारसूचक सम्बन्ध को सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀγαπάω और φιλέω के बीच सम्भावित अर्थ-भेद
  choice: मुख्य पाठ में दोनों का अनुवाद ‘प्रेम’ किया गया और शब्द-भिन्नता पाद-टिप्पणी में बताई गई।
  alternative: ἀγαπάω के लिए ‘प्रेम करना’ और φιλέω के लिए ‘स्नेह रखना’ जैसे अलग पद रखना।
  rationale: यूहन्ना के प्रयोग में दोनों क्रियाएँ अर्थ की दृष्टि से एक-दूसरे पर चढ़ सकती हैं। अलग-अलग हिन्दी पद कोई ऐसा मनोवैज्ञानिक या धर्मवैज्ञानिक स्तर-भेद निश्चित कर सकते थे जिसे मूल पाठ निर्विवाद रूप से स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप अपनाया गया है। यीशु के लिए सम्मानसूचक ‘आप’ और पतरस के लिए ‘तुम’ रखा गया है। ‘चरवाही करो’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल चरवाहा-रूपक को बनाए रखता है।
