source:
  edition: SBLGNT
  text: Ὅτε οὖν ἠρίστησαν λέγει τῷ Σίμωνι Πέτρῳ ὁ Ἰησοῦς· Σίμων ⸀Ἰωάννου, ἀγαπᾷς με πλέον τούτων; λέγει αὐτῷ· Ναί, κύριε, σὺ οἶδας ὅτι φιλῶ σε. λέγει αὐτῷ· Βόσκε τὰ ἀρνία μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/015.yaml
  text: So when they had eaten breakfast[a], Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him[b], “Feed my lambs.”
translation:
  language: hi
  text: जब वे नाश्ता कर चुके थे, तब यीशु ने शमौन पतरस से कहा, “यूहन्ना के पुत्र शमौन, क्या तुम इनसे अधिक मुझसे प्रेम करते हो?[a]” पतरस ने उनसे कहा, “हाँ, प्रभु, आप जानते हैं कि मैं आपसे प्रेम करता हूँ।”[b] यीशु ने उससे कहा, “मेरे मेमनों को चराओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इनसे अधिक” का अर्थ “जितना ये लोग मुझसे प्रेम करते हैं, उससे अधिक” या “इन लोगों अथवा इन वस्तुओं से अधिक” हो सकता है। यूनानी में तुलना का दूसरा पक्ष स्पष्ट नहीं किया गया है।
    reason: alternative_reading
  - marker: b
    text: यीशु के प्रश्न में यूनानी क्रिया ἀγαπάω और पतरस के उत्तर में φιλέω है। दोनों का अर्थ “प्रेम करना” हो सकता है, यद्यपि φιλέω में स्नेह या लगाव का भाव भी हो सकता है। कुछ व्याख्याकार यहाँ दोनों में अंतर देखते हैं; अन्य इसे शैलीगत भिन्नता मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠρίστησαν
  choice: नाश्ता कर चुके थे
  rationale: ἀριστάω यहाँ सुबह का भोजन करने को दर्शाता है। यह रूप उस भोजन के पूरा हो जाने और उसके बाद हुई बातचीत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Σίμων Ἰωάννου
  choice: यूहन्ना के पुत्र शमौन
  rationale: Ἰωάννου सम्बन्धकारक रूप में पिता का नाम बताता है; इसलिए इसका सीधा अर्थ ‘यूहन्ना के पुत्र’ है। ‘योना के पुत्र’ किसी अन्य पाठ-परंपरा का रूप होगा और यहाँ दिए गए यूनानी पाठ का अनुवाद नहीं है।
- source_word: ἀγαπᾷς / φιλῶ
  choice: प्रेम करते हो / प्रेम करता हूँ
  rationale: दोनों क्रियाओं के लिए मुख्य पाठ में स्वाभाविक हिन्दी ‘प्रेम’ रखा गया है। यूनानी में शब्दों का अंतर है, पर यहाँ उसका आशय विवादित है; इसलिए अंतर को पादटिप्पणी में बताया गया है, मुख्य पाठ में कृत्रिम स्तर-भेद नहीं बनाया गया।
- source_word: πλέον τούτων
  choice: इनसे अधिक
  rationale: यूनानी वाक्य तुलना का दूसरा पक्ष स्पष्ट नहीं करता। ‘इनसे अधिक’ यह खुलापन बनाए रखता है कि संकेत लोगों की ओर है, उनकी तुलना में प्रेम की मात्रा की ओर है, या पास की वस्तुओं की ओर।
- source_word: κύριε
  choice: प्रभु
  rationale: यूहन्ना के इस प्रसंग में यह यीशु के प्रति आदरपूर्ण सम्बोधन है; ‘प्रभु’ इसके धार्मिक और संबंधपरक भार को बनाए रखता है।
- source_word: Βόσκε τὰ ἀρνία μου
  choice: मेरे मेमनों को चराओ
  rationale: βόσκω पशुओं को भोजन कराने या चराने को और ἀρνία मेमनों को दर्शाता है। ‘चराओ’ हिन्दी में पशुपालक बिंब को स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: ἀγαπάω और φιλέω के बीच अर्थ-भेद
  choice: मुख्य पाठ में दोनों का अनुवाद ‘प्रेम’ से किया गया और यूनानी शब्द-भेद पादटिप्पणी में रखा गया।
  alternative: पहले को ‘प्रेम करना’ और दूसरे को ‘स्नेह रखना’ कहना, या दोनों को प्रेम के अलग-अलग स्तर मानना।
  rationale: यूहन्ना के प्रयोग में इन दोनों क्रियाओं के बीच यहाँ निर्णायक श्रेणी-भेद सिद्ध नहीं है। अलग हिन्दी शब्द चुनना उस धार्मिक या मनोवैज्ञानिक अंतर को निश्चित कर देता जिसे मूल पाठ स्पष्ट रूप से निश्चित नहीं करता।
- issue: πλέον τούτων में तुलना का आशय
  choice: ‘इनसे अधिक’ कहकर मूल की अस्पष्टता बनाए रखी गई।
  alternative: ‘इन लोगों से अधिक मुझसे प्रेम करते हो,’ ‘जितना ये करते हैं उससे अधिक,’ या ‘इन वस्तुओं से अधिक।’
  rationale: यूनानी में तुलना का अपेक्षित पूरक अव्यक्त है। किसी एक व्याख्या को मुख्य पाठ में चुनने से पाठ का अर्थ अनावश्यक रूप से सीमित हो जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। सम्मानसूचक संवाद में यीशु के लिए ‘आप’ और ‘उनसे’ प्रयुक्त हुआ है। ‘इनसे अधिक’ की संक्षिप्तता जानबूझकर मूल यूनानी की वास्तविक अस्पष्टता को बनाए रखती है।
