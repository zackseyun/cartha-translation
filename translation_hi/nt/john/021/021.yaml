  text: So when Peter saw him, he says to Jesus, “Lord, what about this man?”
translation:
  language: hi
  text: इसलिए जब पतरस ने उसे देखा, तो वह यीशु से कहता है, “प्रभु, और इसका क्या?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτον ... ἰδών
  choice: जब पतरस ने उसे देखा
  rationale: संकेतवाचक सर्वनाम उस शिष्य की ओर लौटता है जिसका उल्लेख पिछले पद में है; हिन्दी में ‘उसे’ स्वाभाविक और संदर्भ-सम्मत है।
- source_word: λέγει
  choice: उसने ... कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-शैली में सामान्य भूतकाल से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन का सम्मानपूर्ण और प्रचलित हिन्दी रूप।
- source_word: οὗτος δὲ τί;
  choice: इसका क्या?
  rationale: संक्षिप्त यूनानी प्रश्न का संक्षिप्त रूप बनाए रखता है; संदर्भ में अर्थ है कि इस व्यक्ति के विषय में क्या होगा, पर मूल में क्रिया न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: पतरस के प्रश्न में निहित आशय
  choice: इसका क्या?
  alternative: इस व्यक्ति का क्या होगा?
  rationale: मूल प्रश्न जानबूझकर संक्षिप्त और क्रियारहित है। अधिक स्पष्ट विकल्प अर्थ को संभावित भविष्य या नियति तक सीमित कर देता, इसलिए अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य की कथात्मक गति तथा मूल प्रश्न की संक्षिप्तता बनाए रखी गई है।
