  source_fidelity: The draft accurately identifies the antecedent of τοῦτον and appropriately preserves the terse, verbless force of οὗτος δὲ τί; as “इसका क्या?” However, λέγει is a present-tense historical present in the SBLGNT, and the English POB audit trail deliberately retains “he says.” Rendering it as “उसने ... कहा” removes that feature without a compelling Hindi idiomatic necessity.
  naturalness: “इसलिए जब पतरस ने उसे देखा, तो वह यीशु से कहता है” is clear, idiomatic enough for elevated biblical narrative, and preserves the source's narrative-present movement. “इसका क्या?” is concise, natural in context, and does not improperly specify a future outcome.
  terminology: “पतरस,” “यीशु,” and the respectful vocative “प्रभु” are standard and suitable. No theological terminology requires adjustment.
  issues:
