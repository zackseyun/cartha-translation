    issue: Historical present λέγει is translated as past tense “उसने ... कहा.”
    rationale: The Greek explicitly uses λέγει (“he says”), and the English POB audit trail retains this feature. Hindi can naturally retain it here as “वह ... कहता है,” so a revision improves source fidelity without making the sentence unnatural.
