  text: λέγει αὐτῷ τὸ τρίτον· Σίμων ⸀Ἰωάννου, φιλεῖς με; ἐλυπήθη ὁ Πέτρος ὅτι εἶπεν αὐτῷ τὸ τρίτον· Φιλεῖς με; καὶ ⸀εἶπεν αὐτῷ· Κύριε, ⸂πάντα σὺ⸃ οἶδας, σὺ γινώσκεις ὅτι φιλῶ σε. λέγει αὐτῷ ⸀ὁ Ἰησοῦς· Βόσκε τὰ ⸀πρόβατά μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/017.yaml
  text: He said to him the third time[a], “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” And he said to him, “Lord, you know all things; you know that I love you.” Jesus said to him[b], “Feed my sheep.”
translation:
  language: hi
  text: यीशु ने उससे तीसरी बार[a] कहा, “शमौन, यूहन्ना के पुत्र, क्या तुम मुझसे प्रेम करते हो?” पतरस दुःखी हुआ, क्योंकि यीशु ने उससे तीसरी बार पूछा, “क्या तुम मुझसे प्रेम करते हो?” पतरस ने उससे कहा, “प्रभु, आप सब कुछ जानते हैं; आप जानते हैं[b] कि मैं आपसे प्रेम करता हूँ।” यीशु ने उससे कहा, “मेरी भेड़ों को चराओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी में φιλέω (‘प्रेम या स्नेह रखना’) आया है, जबकि इससे पहले यीशु ने अपने पहले दो प्रश्नों में ἀγαπάω का प्रयोग किया था। कुछ व्याख्याकार इस बदलाव को अर्थपूर्ण मानते हैं, जबकि दूसरे इस प्रसंग में दोनों क्रियाओं के अर्थों को परस्पर अतिव्यापी मानते हैं। अनुवाद में दोनों के लिए ‘प्रेम’ रखा गया है, ताकि मूल यूनानी से अधिक तीखा भेद न बनाया जाए।
    reason: lexical_alternative
  - marker: b
    text: 'पतरस के उत्तर में ‘जानना’ के लिए दो यूनानी क्रियाएँ हैं: οἶδα और γινώσκω। यहाँ हिन्दी में दोनों का स्वाभाविक अनुवाद ‘जानना’ है। पुनरावृत्ति में कोई सूक्ष्म अर्थ हो सकता है, पर अलग हिन्दी शब्द चुनना अनावश्यक रूप से उसकी व्याख्या कर देगा।'
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ τρίτον
  choice: तीसरी बार
  rationale: यह काल-सूचक प्रयोग स्वाभाविक हिन्दी में ‘तीसरी बार’ है और प्रश्न की पुनरावृत्ति को स्पष्ट रखता है।
- source_word: Σίμων Ἰωάννου
  choice: शमौन, यूहन्ना के पुत्र
  rationale: Ἰωάννου संबंधकारक है और यहाँ पिता के नाम का संकेत देता है; पाठ में ‘योना’ नहीं, ‘यूहन्ना’ है।
- source_word: φιλεῖς / φιλῶ
  choice: प्रेम करते हो / प्रेम करता हूँ
  rationale: φιλέω प्रेम या स्नेह को व्यक्त करता है। हिन्दी में ‘प्रेम’ संवाद की गरिमा बनाए रखता है; ἀγαπάω और φιλέω के बीच विवादित भेद को मुख्य पाठ में कृत्रिम रूप से तीखा नहीं किया गया।
- source_word: ἐλυπήθη
  choice: दुःखी हुआ
  rationale: यह पतरस के भीतर उठे शोक और व्यथा को स्वाभाविक तथा पर्याप्त गंभीर हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: पुनरुत्थित यीशु को पतरस का संबोधन केवल शिष्टाचारसूचक ‘महोदय’ से अधिक अर्थ रखता है; ‘प्रभु’ प्रसंग और शब्द दोनों के अनुकूल है।
- source_word: πάντα σὺ οἶδας
  choice: आप सब कुछ जानते हैं
  rationale: यह πάντα की व्यापकता और पतरस के कथन का बल बिना किसी व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: οἶδας ... γινώσκεις
  choice: जानते हैं ... जानते हैं
  rationale: दोनों यूनानी क्रियाएँ जानने से संबंधित हैं। यहाँ हिन्दी में अलग-अलग क्रियाएँ चुनना अनिश्चित सूक्ष्म भेद को आवश्यकता से अधिक निर्णायक बना देता।
- source_word: Βόσκε
  choice: चराओ
  rationale: βόσκω का आशय पशुओं को भोजन या चरागाह देना है। ‘भेड़ों को चराओ’ हिन्दी में स्वाभाविक है और ποιμαίνω के व्यापक ‘चरवाही करना’ से इसका भेद बनाए रखता है।
- source_word: πρόβατά
  choice: भेड़ों
  rationale: πρόβατα का अर्थ भेड़ें है, मेमने नहीं; इससे पद 15 के ἀρνία के साथ शब्दगत अंतर सुरक्षित रहता है।
theological_decisions:
- issue: क्या यीशु और पतरस के संवाद में φιλέω और ἀγαπάω के बीच तीखा भेद अनुवाद में दिखाया जाए
  choice: φιλέω को ‘प्रेम’ से अनूदित किया गया और मुख्य पाठ में अलग प्रकार के प्रेम का संकेत नहीं जोड़ा गया।
  alternative: ἀγαπάω के लिए ‘प्रेम’ और φιλέω के लिए ‘स्नेह’ या ‘लगाव’ जैसे अलग शब्द प्रयोग किए जाएँ।
  rationale: कोइने यूनानी में इन क्रियाओं के अर्थ पर्याप्त रूप से एक-दूसरे पर चढ़ते हैं; अतः शब्द-परिवर्तन को निर्णायक धर्मवैज्ञानिक भेद बनाना मूल पाठ से आगे जाना होगा। संभावित अंतर पादटिप्पणी में सुरक्षित है।
- issue: ‘आप सब कुछ जानते हैं’ का धर्मवैज्ञानिक बल
  choice: कथन को उसकी पूर्ण व्यापकता के साथ सीधे अनूदित किया गया।
  alternative: इसे ‘आप इस विषय की सारी बात जानते हैं’ कहकर सीमित करना या सर्वज्ञता की स्पष्ट धर्मसैद्धांतिक व्याख्या जोड़ना।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘सब कुछ’ कहता है। अनुवाद को न इसे सीमित करना चाहिए, न इसके भीतर व्याख्यात्मक धर्मसिद्धांत जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। यीशु पतरस को ‘तुम’ कहते हैं और पतरस यीशु को आदरसूचक ‘आप’ कहता है। ‘मेरी भेड़ों को चराओ’ सामान्य पाठक के लिए स्पष्ट रहते हुए चरवाही के रूपक और βόσκω की भोजन कराने वाली विशिष्टता को बनाए रखता है।
