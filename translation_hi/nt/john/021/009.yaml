  naturalness: “वे नाव से उतरकर भूमि पर आए” and especially “इसलिए जब” sound somewhat wooden in modern Hindi. “जब वे किनारे पर उतरे, तो…” is idiomatic, while the footnote can preserve the more literal “भूमि पर” wording.
  terminology: “कोयलों की आग” suitably renders ἀνθρακιά and preserves its distinction from a generic fire. “मछली” and “रोटी” are appropriate unmarked renderings. The cross-reference note should identify the shared Greek term without imposing an interpretive conclusion.
