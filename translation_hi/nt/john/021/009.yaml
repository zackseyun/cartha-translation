id: JHN.21.9
reference: John 21:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὡς οὖν ἀπέβησαν εἰς τὴν γῆν βλέπουσιν ἀνθρακιὰν κειμένην καὶ ὀψάριον ἐπικείμενον καὶ ἄρτον.
base_translation:
  language: en
  yaml_path: translation/nt/john/021/009.yaml
  text: So when they got out onto the land[a], they saw a charcoal fire laid there, and fish lying on it[b], and bread.
translation:
  language: hi
  text: जब वे किनारे पर उतरे[a], तो उन्होंने वहाँ कोयलों की आग[b] देखी, जिस पर मछली रखी हुई थी, और रोटी भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे भूमि पर उतरे।” यूनानी में अधिक शाब्दिक रूप से, “वे भूमि पर उतरे” है।
    reason: lexical_alternative
  - marker: b
    text: “कोयलों की आग” उस यूनानी शब्द का अनुवाद है जो यूहन्ना 18:18 में भी प्रयुक्त है; इस प्रकार दोनों दृश्यों में शब्दगत संबंध है।
    reason: cross_reference
lexical_decisions:
- source_word: Ὡς οὖν
  choice: इसलिए जब
  rationale: ὡς के कालसूचक अर्थ और οὖν के कथात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπέβησαν εἰς τὴν γῆν
  choice: वे नाव से उतरकर भूमि पर आए
  rationale: मूल में नाव स्पष्ट रूप से नहीं कही गई, पर प्रसंग और ἀποβαίνω उतरने का भाव देते हैं; ‘भूमि पर आए’ γῆ को ‘किनारा’ बनाकर अधिक विशिष्ट नहीं करता।
- source_word: βλέπουσιν
  choice: उन्होंने ... देखी
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथन में स्वाभाविक भूतकाल से प्रस्तुत किया गया है।
- source_word: ἀνθρακιὰν
  choice: कोयलों की आग
  rationale: यह जलते कोयलों की आग का स्पष्ट और सहज वर्णन है तथा यूहन्ना 18:18 के समान यूनानी शब्द के साथ शाब्दिक संबंध बनाए रखता है।
- source_word: κειμένην
  choice: वहाँ ... देखी
  rationale: हिन्दी में आग के लिए ‘पड़ी हुई’ अस्वाभाविक लगता है; स्थानसूचक ‘वहाँ’ उसकी मौजूदगी को सहज रूप में व्यक्त करता है।
- source_word: ὀψάριον ἐπικείμενον
  choice: जिस पर मछली रखी थी
  rationale: एकवचन रूप और आग के ऊपर रखे होने का संबंध सुरक्षित रहता है; यह नहीं जोड़ा गया कि मछली पक चुकी थी।
- source_word: ἄρτον
  choice: रोटी
  rationale: सामान्य, स्वाभाविक हिन्दी शब्द है और संख्या या आकार को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: कथात्मक ऐतिहासिक वर्तमान
  choice: βλέπουσιν को भूतकाल ‘उन्होंने ... देखी’ में प्रस्तुत किया
  alternative: 'सजीव वर्तमान: ‘वे ... देखते हैं’'
  rationale: यह धार्मिक व्याख्या नहीं, कथाशैली का प्रश्न है; आधुनिक हिन्दी में भूतकाल घटनाक्रम को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- issue: ἀνθρακιὰ के शब्दगत संबंध का संरक्षण
  choice: ‘कोयलों की आग’
  alternative: ‘अंगीठी’ या केवल ‘आग’
  rationale: यह यूहन्ना 18:18 में पतरस के इनकार के दृश्य में प्रयुक्त उसी विशिष्ट यूनानी शब्द के संबंध को बनाए रखता है, बिना इस संबंध का अर्थ पाठ में समझाए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘भूमि’ मूल γῆ के निकट है, जबकि ‘नाव से’ प्रसंगगत क्रिया को हिन्दी में स्पष्ट और स्वाभाविक बनाता है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
