    issue: Narrative connective is awkward
    rationale: “इसलिए जब” is not the most natural Hindi rendering of Ὡς οὖν in this narrative setting. “जब …, तो …” preserves the sequence and connective flow naturally.
  - severity: low
    issue: Main text adds an explicit boat reference
    rationale: “नाव से” is clear from the wider context but is not expressed in John 21:9 itself. Omitting it keeps the translation closer to the verse while remaining natural.
  - severity: medium
    issue: Charcoal-fire cross-reference footnote is absent
    rationale: The English audit trail marks the verbal link between ἀνθρακιά here and John 18:18. A corresponding Hindi footnote preserves this significant lexical observation and its anchor.
