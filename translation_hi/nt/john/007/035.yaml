id: JHN.7.35
reference: John 7:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπον οὖν οἱ Ἰουδαῖοι πρὸς ἑαυτούς· Ποῦ οὗτος μέλλει πορεύεσθαι ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν; μὴ εἰς τὴν διασπορὰν τῶν Ἑλλήνων μέλλει πορεύεσθαι καὶ διδάσκειν τοὺς Ἕλληνας;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/035.yaml
  text: So the Jews said to one another, “Where is this man about to go, that we will not find him? He is not about to go to the dispersion among the Greeks and teach the Greeks, is he?”
translation:
  language: hi
  text: इसलिए यहूदियों[a] ने आपस में कहा, “यह व्यक्ति कहाँ जानेवाला है कि हम उसे नहीं पाएँगे? क्या वह यूनानियों के बीच फैले हुए यहूदियों[b] के पास जाकर यूनानियों को सिखानेवाला तो नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोगों।” यूनानी शब्द सामान्य रूप से यहूदियों को अथवा कुछ संदर्भों में यहूदिया के लोगों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “यूनानियों के बीच का बिखराव।” यह यूनानियों के बीच विभिन्न स्थानों पर फैले हुए यहूदी समुदायों को सूचित करता है, न कि तितर-बितर यूनानियों को।
    reason: cultural_note
lexical_decisions:
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदियों
  rationale: यह पद समूह को सामान्य जातीय-सामुदायिक संज्ञा से प्रस्तुत करता है; मूल पाठ स्पष्ट रूप से ‘अगुवे’ नहीं कहता। ‘यहूदिया के लोग’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: यह पारस्परिक बातचीत का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: Ποῦ οὗτος
  choice: यह व्यक्ति कहाँ
  rationale: οὗτος की संकेतात्मक और कुछ दूरी बनानेवाली ध्वनि को ‘यह व्यक्ति’ सुरक्षित रखता है।
- source_word: μέλλει πορεύεσθαι
  choice: जानेवाला है
  rationale: यह आगामी या अभिप्रेत गमन का भाव देता है, पर उद्देश्य को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ὅτι ἡμεῖς οὐχ εὑρήσομεν αὐτόν
  choice: कि हम उसे नहीं पाएँगे
  rationale: भविष्यकाल और परिणाम-संबंध को सीधे रखता है तथा ‘पा नहीं सकेंगे’ जैसी अतिरिक्त सामर्थ्य-सूचना नहीं जोड़ता।
- source_word: μὴ
  choice: क्या ... है?
  rationale: संदर्भ में यह ऐसे प्रश्न को प्रस्तुत करता है जिसका अपेक्षित उत्तर नकारात्मक है; हिन्दी में प्रश्न-रचना इस आलंकारिक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: διασπορὰν τῶν Ἑλλήνων
  choice: यूनानियों के बीच तितर-बितर होकर बसे यहूदियों के पास
  rationale: διασπορά यहाँ यूनानी आबादी के बीच बिखरे यहूदियों को सूचित करता है, न कि बिखरे हुए यूनानियों को। ‘प्रवासी समुदाय’ की अपेक्षा यह रूप सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: Ἕλληνας
  choice: यूनानियों को
  rationale: मूल शब्द का सीधा जातीय-सांस्कृतिक अर्थ सुरक्षित रहता है; इसे व्यापक ‘गैर-यहूदियों’ में नहीं बदला गया।
- source_word: καὶ διδάσκειν τοὺς Ἕλληνας
  choice: और यूनानियों को सिखाने
  rationale: समन्वित infinitive वाक्यांश का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: यूहन्ना के वृत्तांत में Ἰουδαῖοι का अनुवाद
  choice: यहूदी
  alternative: यहूदिया के लोग
  rationale: इस संदर्भ में क्षेत्रीय अर्थ अनिवार्य नहीं है, और ‘यहूदी’ मूल पद का सबसे पारदर्शी समतुल्य है। फिर भी संभावित क्षेत्रीय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: διασπορὰν τῶν Ἑλλήνων का संबंध
  choice: यूनानियों के बीच बिखरे यहूदी
  alternative: यूनानियों का बिखराव
  rationale: यहूदी प्रयोग और प्रसंग के अनुसार διασπορά विभिन्न देशों में बिखरे यहूदी समुदाय को दर्शाता है; τῶν Ἑλλήνων यहाँ उनके यूनानियों के बीच होने का संकेत देता है।
- issue: Ἕλληνας की सीमा
  choice: यूनानी
  alternative: गैर-यहूदी
  rationale: पद में जातीय-सांस्कृतिक शब्द ‘यूनानी’ है। उसे ‘गैर-यहूदी’ कहना संभव व्यापक अर्थ को चुनकर मूल की सीमा से आगे जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘तितर-बितर होकर बसे यहूदियों’ से ऐतिहासिक ‘डायस्पोरा’ की धारणा सामान्य पाठक के लिए स्पष्ट की गई है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
