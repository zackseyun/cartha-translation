lexical_decisions:
- source_word: τινὲς δὲ
  choice: परन्तु ... कुछ लोग
  rationale: τινὲς एक अनिश्चित समूह को सूचित करता है; ‘कुछ लोग’ स्वाभाविक हिन्दी है। δὲ यहाँ पिछली विविध प्रतिक्रियाओं के विपरीत भाव लाता है, जिसे ‘परन्तु’ व्यक्त करता है।
- source_word: ἤθελον
  choice: चाहते थे
  rationale: अपूर्ण भूतकाल रूप बीते समय में बनी हुई इच्छा या मंशा को दर्शाता है; ‘चाहते थे’ इसे सहज रूप से व्यक्त करता है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से
  rationale: यह बड़े समूह के भीतर के एक अनिश्चित हिस्से को सूचित करता है; ‘उनमें से’ स्रोत की संरचना और अर्थ दोनों को स्पष्ट रखता है।
- source_word: πιάσαι
  choice: पकड़ना
  rationale: πιάζω का मूल भाव किसी को पकड़ लेने का है और इस प्रसंग में गिरफ्तारी का आशय हो सकता है। ‘पकड़ना’ मूल व्यापकता को बनाए रखता है।
- source_word: ἀλλ’ οὐδεὶς
  choice: फिर भी किसी ने नहीं
  rationale: ἀλλά इच्छा और वास्तविक परिणाम के बीच प्रबल विरोध दिखाता है; ‘फिर भी’ हिन्दी में इस विरोध को स्वाभाविक ढंग से व्यक्त करता है। οὐδείς का सीधा अर्थ ‘किसी ने नहीं’ है।
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: उस पर हाथ नहीं डाला
  rationale: यह यूनानी मुहावरा किसी को बलपूर्वक पकड़ने या हिरासत में लेने के लिए हाथ बढ़ाने को दर्शाता है। हिन्दी का ‘हाथ डालना’ शारीरिक पकड़ और शत्रुतापूर्ण मंशा दोनों को बनाए रखता है।
