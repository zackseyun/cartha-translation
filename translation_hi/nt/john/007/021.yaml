  yaml_path: translation/nt/john/007/021.yaml
  text: Jesus answered and said to them[a], “I did one work[b], and you all marvel.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया और कहा, “मैंने एक ही काम[a] किया[b], और तुम सब चकित होते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कार्य।” यूनानी शब्द का अर्थ “काम” या “कार्य” हो सकता है; “काम” यूहन्ना में यीशु के कामों के लिए बार-बार आने वाली शब्दावली को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: सम्भवतः सब्त के दिन अशक्त मनुष्य को यीशु द्वारा चंगा किए जाने की ओर संकेत है; देखें यूहन्ना 5:1–18।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर में … कहा
  rationale: यह हिन्दी में स्वाभाविक ढंग से यूनानी के दोनों क्रियात्मक भाव—उत्तर देना और कहना—को व्यक्त करता है, जबकि शाब्दिक ‘उत्तर दिया और कहा’ अनावश्यक रूप से बोझिल लगता।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: सम्बोधित समूह को दिखाने के लिए सम्प्रदान/सम्बन्ध का स्वाभाविक हिन्दी रूप।
- source_word: Ἓν
  choice: एक ही
  rationale: '‘ही’ यूनानी में आरम्भ में रखी गई संख्या ‘एक’ के बल को स्पष्ट करता है: केवल एक काम उनकी प्रतिक्रिया का कारण बना।'
- source_word: ἔργον
  choice: काम
  rationale: यह सामान्य पाठक के लिए स्वाभाविक है और यूहन्ना में यीशु के कामों के लिए बार-बार प्रयुक्त प्रमुख शब्द की संगति बनाए रख सकता है।
- source_word: ἐποίησα
  choice: मैंने … किया
  rationale: यूनानी साधारण भूतकालीन कर्तृवाच्य का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πάντες
  choice: तुम सब
  rationale: सम्बोधित पूरे बहुवचन समूह को स्पष्ट रूप से व्यक्त करता है।
- source_word: θαυμάζετε
  choice: अचम्भा करते हो
  rationale: वर्तमान काल तथा आश्चर्य और उलझन—दोनों की सम्भावना को बनाए रखता है; इसे केवल सकारात्मक प्रशंसा नहीं बनाता।
theological_decisions:
- issue: यूहन्ना में ἔργον का महत्त्व
  choice: काम
  alternative: कार्य / कर्म
  rationale: ‘काम’ यीशु के कार्यों के लिए यूहन्ना की आवर्ती शब्दावली को सहज हिन्दी में बनाए रखता है। पद सम्भवतः सब्त के दिन चंगाई की ओर संकेत करता है, पर यह संकेत मुख्य पाठ में स्पष्ट जोड़ के रूप में नहीं डाला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में स्वाभाविक। ‘उत्तर में उनसे कहा’ मूल के उत्तर देने और कहने—दोनों भावों को बिना कृत्रिम पुनरुक्ति के रखता है।
