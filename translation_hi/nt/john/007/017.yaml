source:
  edition: SBLGNT
  text: ἐάν τις θέλῃ τὸ θέλημα αὐτοῦ ποιεῖν, γνώσεται περὶ τῆς διδαχῆς πότερον ἐκ τοῦ θεοῦ ἐστιν ἢ ἐγὼ ἀπ’ ἐμαυτοῦ λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/017.yaml
  text: If anyone wants to do his will[a], he will know about the teaching, whether it is from God or whether I am speaking from myself.
translation:
  language: hi
  text: यदि कोई उसकी इच्छा पूरी करना चाहे, तो वह इस शिक्षा के विषय में जान जाएगा कि यह परमेश्वर की ओर से है या मैं अपनी ओर से[a] बोल रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आप’ अथवा ‘अपने ही अधिकार से।’ यूनानी में मूल भाव ‘स्वयं से’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις θέλῃ
  choice: यदि कोई ... चाहे
  rationale: ἐάν के साथ विधिलिङ्ग सामान्य शर्त व्यक्त करता है, और θέλω इच्छा या तत्परता को। यह हिंदी प्रयोग दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ θέλημα αὐτοῦ ποιεῖν
  choice: उसकी इच्छा पूरी करना
  rationale: मूल पाठ में αὐτοῦ सर्वनाम है, जिसका संदर्भ प्रसंग में परमेश्वर है। हिंदी में ‘इच्छा पूरी करना’ ποιεῖν τὸ θέλημα का स्वाभाविक और सीधा रूप है।
- source_word: γνώσεται
  choice: जान जाएगा
  rationale: भविष्यकाल यहाँ परिणामस्वरूप प्राप्त होने वाले ज्ञान या पहचान को दर्शाता है; ‘जान जाएगा’ इस भाव को सहज हिंदी में रखता है।
- source_word: περὶ τῆς διδαχῆς
  choice: इस शिक्षा के विषय में
  rationale: περί के साथ संबंधवाचक रूप का अर्थ ‘के विषय में’ है। ‘इस शिक्षा’ प्रसंग में चर्चााधीन यीशु की शिक्षा की ओर स्वाभाविक संकेत करता है।
- source_word: πότερον ... ἢ
  choice: कि ... या
  rationale: यह रचना दो विकल्प सामने रखती है। हिंदी में ‘कि ... या’ वही स्पष्ट वैकल्पिक संबंध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: ἐκ स्रोत या उद्गम बताता है। ‘परमेश्वर की ओर से’ हिंदी में स्रोत को स्पष्ट रखता है, बिना अतिरिक्त क्रिया जोड़े।
- source_word: ἀπ’ ἐμαυτοῦ
  choice: अपनी ओर से
  rationale: यह पद स्वयं से उत्पन्न स्रोत का भाव रखता है। ‘अपनी ओर से’ हिंदी में स्वाभाविक है और स्वतंत्र पहल तथा अधिकार—दोनों संभावित निहितार्थों को खुला रखता है।
- source_word: λαλῶ
  choice: मैं ... बोल रहा हूँ
  rationale: वर्तमानकालीन discourse में यह स्वाभाविक हिंदी निरंतर वर्तमान है और यीशु के तत्काल कथन को दर्शाता है।
theological_decisions:
- issue: αὐτοῦ (‘उसकी’) का संदर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उसकी’ बनाए रखा गया है; प्रसंग में इसका संदर्भ परमेश्वर है।
  alternative: स्पष्ट करके ‘परमेश्वर की इच्छा’ कहना।
  rationale: निकटवर्ती प्रसंग संदर्भ को पर्याप्त रूप से स्पष्ट करता है। सर्वनाम बनाए रखने से मूल पाठ का रूप सुरक्षित रहता है और अनावश्यक व्याख्यात्मक विस्तार नहीं होता।
- issue: ἀπ’ ἐμαυτοῦ का अर्थ-बल
  choice: ‘अपनी ओर से’
  alternative: ‘अपने आप’ अथवा ‘अपने ही अधिकार से’
  rationale: यूनानी पद सीधे स्रोत या उद्गम व्यक्त करता है। मुख्य पाठ में ऐसा हिंदी रूप चुना गया है जो स्रोत को बनाए रखे और स्वतंत्र अधिकार के निहितार्थ को आवश्यकता से अधिक निश्चित न करे; विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की शर्त और उसके परिणाम का संबंध स्पष्ट है; मूल पाठ के स्रोत-संबंधी विरोध—‘परमेश्वर की ओर से’ बनाम ‘अपनी ओर से’—को समानांतर रूप में सुरक्षित रखा गया है।
