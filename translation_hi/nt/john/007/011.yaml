base_translation:
  language: en
  yaml_path: translation/nt/john/007/011.yaml
  text: So the Jews were looking for him at the feast and were saying[a], “Where is that one?”
translation:
  language: hi
  text: इसलिए यहूदी[a] पर्व में उसे ढूँढ़ रहे थे और कह रहे थे, “वह कहाँ है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोग”; यूहन्ना के इस कथात्मक प्रसंग में इससे विशेष रूप से यहूदी अधिकारी भी अभिप्रेत हो सकते हैं।
    reason: Ἰουδαῖοι के संदर्भगत अर्थ की वास्तविक अस्पष्टता बनाए रखने के लिए।
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथा का संबंध और परिणामी प्रवाह दिखाता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ἰουδαῖοι
  choice: यहूदी
  rationale: मूल शब्द व्यापक रूप से यहूदियों, यहूदिया-निवासियों या प्रसंगानुसार यहूदी अधिकारियों को सूचित कर सकता है। पद स्वयं दायरा स्पष्ट रूप से सीमित नहीं करता, इसलिए मुख्य पाठ में सामान्य अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐζήτουν
  choice: ढूँढ़ रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया को दर्शाता है; यह हिन्दी में स्वाभाविक रूप से उसकी खोज करने का भाव देता है।
- source_word: ἐν τῇ ἑορτῇ
  choice: पर्व में
  rationale: प्रसंग में पहले बताए गए पर्व के दौरान या उसके आयोजन-स्थल पर होने का संक्षिप्त और स्वाभाविक संकेत है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार कही जा रही बात का भाव बनाए रखता है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: यूनानी संकेतवाचक सर्वनाम में दूरी का भाव हो सकता है, पर हिन्दी संवाद में “वह कहाँ है?” स्वाभाविक है और बिना अनावश्यक रूप से “आदमी” जोड़कर मूल का अर्थ व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में “यहूदी”
  alternative: “यहूदिया के लोग” अथवा प्रसंगानुसार “यहूदी अधिकारी”
  rationale: यह पद अपने आप किसी संकुचित समूह को स्पष्ट नहीं करता। इसलिए मुख्य पाठ में शब्द की व्यापकता सुरक्षित रखी गई है, जबकि यूहन्ना के कथात्मक प्रसंग में संभव संकीर्ण अर्थ पादटिप्पणी में बताया गया है।
