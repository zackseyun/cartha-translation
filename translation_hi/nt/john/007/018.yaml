id: JHN.7.18
reference: John 7:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἀφ’ ἑαυτοῦ λαλῶν τὴν δόξαν τὴν ἰδίαν ζητεῖ· ὁ δὲ ζητῶν τὴν δόξαν τοῦ πέμψαντος αὐτὸν οὗτος ἀληθής ἐστιν καὶ ἀδικία ἐν αὐτῷ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/018.yaml
  text: The one who speaks from himself seeks his own glory[a]; but the one who seeks the glory of the one who sent him, this one is true[c][b], and there is no unrighteousness in him.
translation:
  language: hi
  text: जो अपनी ओर से बोलता है, वह अपनी ही महिमा चाहता है; पर जो अपने भेजनेवाले की महिमा चाहता है, वही सच्चा है[a], और उसमें कोई अधर्म नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सत्यवादी”।
    reason: lexical_alternative
  - marker: b
    text: या “अन्याय” अथवा “गलत काम”।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφ’ ἑαυτοῦ
  choice: अपनी ओर से
  rationale: यह यूनानी पदबंध के ‘स्वयं से’ वाले मूल भाव को स्वाभाविक हिन्दी में रखता है और अपने भेजनेवाले की ओर से बोलने के निहित विरोध को सुरक्षित रखता है।
- source_word: λαλῶν
  choice: बोलता है
  rationale: वर्तमान कृदन्त यहाँ सामान्य विशेषणात्मक अर्थ में है; ‘बोलता है’ सहज हिन्दी है।
- source_word: δόξαν
  choice: महिमा
  rationale: ‘महिमा’ यूहन्ना में δόξα की धार्मिक और सम्मान-संबंधी व्यापकता बनाए रखती है।
- source_word: τὴν ἰδίαν
  choice: अपनी ही
  rationale: ‘ही’ उसके अपने सम्मान और भेजनेवाले की महिमा के बीच बलयुक्त विरोध को स्पष्ट करता है।
- source_word: ζητεῖ
  choice: चाहता है
  rationale: इस संदर्भ में ζητέω सम्मान को पाने या बढ़ाने का प्रयत्न दर्शाता है; ‘चाहता है’ साधारण हिन्दी में स्वाभाविक है और दोनों खंडों में पुनरावृत्ति बनाए रखता है।
- source_word: τοῦ πέμψαντος αὐτὸν
  choice: अपने भेजनेवाले की
  rationale: यह कृदन्तीय पदबंध को संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा भेजनेवाले की व्यक्तिगत भूमिका सुरक्षित रखता है।
- source_word: οὗτος
  choice: वही
  rationale: ‘वही’ संकेतवाचक सर्वनाम का बल और पहले वर्णित व्यक्ति पर विशेष जोर स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀληθής
  choice: सच्चा
  rationale: यह शब्द सत्यनिष्ठा, विश्वसनीयता और वास्तविकता की व्यापकता रखता है; केवल ‘सत्य बोलनेवाला’ कहना अर्थ को संकरा कर सकता है।
- source_word: ἀδικία
  choice: अधार्मिकता
  rationale: यह नैतिक अन्याय और गलत आचरण की व्यापकता को धार्मिक-नैतिक संदर्भ में रखता है, यद्यपि ‘अन्याय’ भी संभव है।
- source_word: ἐν αὐτῷ οὐκ ἔστιν
  choice: उसमें कोई ... नहीं है
  rationale: अस्तित्ववाचक यूनानी रचना और व्यक्ति के भीतर नैतिक दोष न होने की बात को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘अपनी ओर से’ बोलने और भेजनेवाले की महिमा चाहने के बीच विरोध
  choice: पद को स्वयं-प्रेरित, आत्म-महिमाकांक्षी वाणी और भेजनेवाले के सम्मान की खोज के बीच विरोध के रूप में रखा गया है।
  alternative: ‘अपने अधिकार से’ कहकर अधिकार के प्रश्न को स्पष्ट करना।
  rationale: मूल पाठ शिक्षा के स्रोत और उद्देश्य दोनों को जोड़ता है। ‘अपनी ओर से’ वास्तविक अस्पष्टता बनाए रखता है और बाद की धर्मवैज्ञानिक श्रेणियाँ आरोपित नहीं करता।
- issue: ἀληθής का आशय
  choice: सच्चा
  alternative: सत्यवादी
  rationale: ‘सच्चा’ व्यक्ति की समग्र विश्वसनीयता और सत्यनिष्ठा व्यक्त कर सकता है; ‘सत्यवादी’ इसे केवल कथनों की सत्यता तक सीमित कर सकता है।
- issue: ἀδικία का आशय
  choice: अधार्मिकता
  alternative: अन्याय या गलत काम
  rationale: मूल शब्द में अन्याय, नैतिक गलतपन और अधर्म की अर्थ-सीमा है। मुख्य पाठ में व्यापक धार्मिक-नैतिक अभिव्यक्ति रखी गई है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘भेजनेवाले’ को संयुक्त रूप में रखा गया है। वाक्य की समानांतर संरचना और ‘वही’ का संकेतात्मक बल मूल यूनानी के अनुरूप सुरक्षित हैं।
