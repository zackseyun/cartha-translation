  text: ὁ πιστεύων εἰς ἐμέ, καθὼς εἶπεν ἡ γραφή, ποταμοὶ ἐκ τῆς κοιλίας αὐτοῦ ῥεύσουσιν ὕδατος ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/038.yaml
  text: The one who believes in me[a], just as the Scripture has said[b], rivers of living water will flow from his belly.
translation:
  language: hi
  text: जो मुझ पर विश्वास करता है—जैसा पवित्रशास्त्र ने कहा है—उसके भीतर से[a] जीवित जल की नदियाँ बह निकलेंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ ‘पेट’ या ‘गर्भ’ भी हो सकता है; यहाँ इसका आशय संभवतः व्यक्ति का अंतरतम है। ‘उसके’ को कुछ लोग विश्वास करने वाले के बजाय मसीह की ओर संकेत मानते हैं।
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς ἐμέ
  choice: जो मुझ पर विश्वास करता है
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदंत विश्वास करने वाले व्यक्ति को सामान्य और चरित्रगत रूप में दर्शाता है। πιστεύω के साथ εἰς का स्वाभाविक हिन्दी रूप ‘पर विश्वास करना’ है।
- source_word: καθὼς εἶπεν ἡ γραφή
  choice: जैसा पवित्रशास्त्र ने कहा है
  rationale: यह वाक्य पवित्रशास्त्रीय प्रमाण प्रस्तुत करता है। यूनानी में क्रिया एओरिस्ट है, पर हिन्दी में उद्धरण-सूत्र के रूप में ‘ने कहा है’ स्वाभाविक है और उस कथन की वर्तमान प्रासंगिकता भी बनाए रखता है। एकवचन ἡ γραφή के लिए ‘पवित्रशास्त्र’ रखा गया है।
- source_word: ποταμοὶ
  choice: नदियाँ
  rationale: शब्द छोटी धाराओं के बजाय नदियों को सूचित करता है और प्रचुरता के बिंब को बनाए रखता है।
- source_word: ἐκ τῆς κοιλίας αὐτοῦ
  choice: उसके भीतर से
  rationale: κοιλία का शाब्दिक अर्थ ‘पेट’ या ‘गर्भ’ हो सकता है, किंतु यहाँ यह व्यक्ति के अंतरतम का रूपक है। ‘भीतर से’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक शारीरिक अर्थ से बचता है; सर्वनाम के संभावित मसीही संदर्भ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ῥεύσουσιν
  choice: बह निकलेंगी
  rationale: भविष्यकालीन प्रवाह को स्पष्ट करता है; ‘निकलेंगी’ स्रोत से बाहर आने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनुचित तीव्रता जोड़े।
- source_word: ὕδατος ζῶντος
  choice: जीवित जल
  rationale: यह यूहन्ना में धर्मवैचारिक प्रतिध्वनि वाला स्थापित रूपक है। ‘जीवित जल’ उसके शाब्दिक बिंब और जीवनदायी अर्थ दोनों को खुला रखता है।
theological_decisions:
- issue: αὐτοῦ (‘उसके’) का संदर्भ
  choice: मुख्य पाठ में सर्वनाम का निकटतम व्याकरणिक पूर्वपद विश्वास करने वाला व्यक्ति माना गया है।
  alternative: कुछ लोग इसे मसीह/यीशु की ओर संकेत मानते हैं, अर्थात नदियाँ मसीह के भीतर से बहती हैं।
  rationale: वाक्यविन्यास में निकटतम पूर्वपद ‘जो मुझ पर विश्वास करता है’ है, और अगले पद में विश्वासियों द्वारा आत्मा पाए जाने की व्याख्या इसका समर्थन करती है। फिर भी वैकल्पिक मसीही संदर्भ प्राचीन चित्र-विन्यास और विराम-संभावना से जुड़ा है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: κοιλία का रूपकीय अर्थ
  choice: भीतर
  alternative: पेट; गर्भ; अंतरतम
  rationale: शाब्दिक शारीरिक अर्थ आधुनिक पाठक को भ्रमित कर सकता है। ‘भीतर’ व्यक्ति के आंतरिक केंद्र का भाव सहज रूप से देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘मुझ पर विश्वास’ और ‘जीवित जल’ जैसे परिचित बाइबलीय पदबंध बनाए गए हैं। डैश उद्धरणात्मक उपवाक्य की सीमा स्पष्ट करते हैं और संदिग्ध विराम-विन्यास को अनावश्यक रूप से अधिक नहीं सुलझाते।
