  text: ⸂ἐθαύμαζον οὖν⸃ οἱ Ἰουδαῖοι λέγοντες· Πῶς οὗτος γράμματα οἶδεν μὴ μεμαθηκώς;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/015.yaml
  text: So the Jews were marveling[a], saying[b], “How does this man know letters without having studied?”
translation:
  language: hi
  text: तब यहूदी[a] अचम्भित होकर कहने लगे, “इस व्यक्ति को बिना शिक्षा पाए इतनी विद्या कैसे है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “यहूदी” से प्रसंगतः यरूशलेम में यीशु से प्रश्न करने या उसका विरोध करने वाले यहूदी लोग अभिप्रेत हैं—सम्भवतः उनमें यहूदी अधिकारी भी थे—न कि समस्त यहूदी लोग।
    reason: cultural_note
lexical_decisions:
- source_word: ἐθαύμαζον
  choice: अचम्भा करते हुए
  rationale: अपूर्ण भूतकाल उनकी जारी प्रतिक्रिया को दर्शाता है; यह प्रयोग आश्चर्य के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: तब
  rationale: यह पिछले प्रसंग से कथात्मक परिणाम और आगे की घटना को जोड़ता है; यहाँ ‘तब’ सहज हिन्दी संयोजक है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: मूल यूनानी पद का सीधा और व्यापक अनुवाद रखा गया है। प्रसंगगत सीमा को मुख्य पाठ में संकीर्ण किए बिना पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: प्रत्यक्ष कथन का स्वाभाविक हिन्दी परिचय देता है और उनके आश्चर्य की प्रतिक्रिया से कथन की ओर गति व्यक्त करता है।
- source_word: Πῶς
  choice: कैसे
  rationale: साधन अथवा कारण पूछने वाले यूनानी प्रश्नवाचक का सीधा और स्वाभाविक अनुवाद।
- source_word: οὗτος
  choice: इस मनुष्य
  rationale: ‘यह व्यक्ति’ की अपेक्षा अधिक सहज है और मूल पद की कुछ दूरी बनाए रखने वाली अभिव्यक्ति को बिना तिरस्कार जोड़े व्यक्त करता है।
- source_word: γράμματα
  choice: शास्त्रीय ज्ञान
  rationale: बहुवचन γράμματα का शाब्दिक अर्थ ‘अक्षर’ है, पर यहाँ इसका आशय लिखित ग्रन्थों से संबंधित विद्या या मान्य शास्त्रीय शिक्षा से है। चयन प्रसंग में स्वाभाविक है, जबकि शाब्दिकता और व्यापक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: οἶδεν
  choice: ज्ञान ... है
  rationale: οἶδα की स्थितिवाचक वर्तमान शक्ति को हिन्दी की स्वाभाविक संज्ञात्मक रचना में व्यक्त करता है।
- source_word: μὴ μεμαθηκώς
  choice: बिना शिक्षा पाए
  rationale: पूर्ण कृदन्त अपेक्षित औपचारिक अध्ययन या शिक्षण न पाने की स्थिति बताता है। यह अनुवाद किसी खास शिक्षण-संस्था को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में ‘यहूदी’
  alternative: ‘यहूदी अगुवे’ या ‘यहूदिया के लोग’
  rationale: मूल पद की व्यापकता को मुख्य पाठ में बनाए रखा गया है और उसे व्याख्यात्मक रूप से केवल अगुवों तक सीमित नहीं किया गया। साथ ही आधुनिक पाठक इसे पूरे यहूदी समुदाय पर आरोप न समझें, इसलिए प्रसंगगत आशय पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: γράμματα का अर्थ
  choice: शास्त्रीय ज्ञान
  alternative: ‘अक्षरों का ज्ञान’, ‘विद्या’ या ‘पवित्र शास्त्रों का ज्ञान’
  rationale: मन्दिर में यीशु की शिक्षा के प्रसंग में मान्य लिखित और शास्त्रीय विद्या आशय है, पर केवल ‘पवित्र शास्त्र’ कहना मूल की अर्थ-सीमा को आवश्यकता से अधिक संकीर्ण कर सकता है। पाद-टिप्पणी मूल मुहावरे की अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शास्त्रीय ज्ञान’ औपचारिक विद्या का संकेत देता है, पर किसी विशेष रब्बी-विद्यालय या संस्थागत व्यवस्था को पाठ में नहीं जोड़ता।
