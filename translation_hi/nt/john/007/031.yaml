source:
  edition: SBLGNT
  text: ⸂ἐκ τοῦ ὄχλου δὲ πολλοὶ⸃ ἐπίστευσαν εἰς αὐτόν, καὶ ⸀ἔλεγον· Ὁ χριστὸς ὅταν ἔλθῃ ⸀μὴ πλείονα ⸀σημεῖα ποιήσει ὧν οὗτος ἐποίησεν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/031.yaml
  text: But many from the crowd believed in him[a], and they were saying, “When the Messiah comes, he will not do more signs than this man has done, will he?”
translation:
  language: hi
  text: पर भीड़ में से बहुतों ने उस पर विश्वास किया और वे कह रहे थे, “जब मसीह[a] आएगा, तो भला वह इस मनुष्य के किए हुए चिह्नों से अधिक चिह्न करेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी उपाधि Χριστός यहाँ यहूदी मसीही संदर्भ में प्रयुक्त हुई है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ τοῦ ὄχλου δὲ πολλοὶ
  choice: पर भीड़ में से बहुतों ने
  rationale: ‘भीड़ में से’ बड़े समूह में से एक हिस्से को दर्शाता है; ‘पर’ आसपास के अविश्वास और विवाद के विपरीत हल्का विरोध प्रकट करता है।
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: उस पर विश्वास किया
  rationale: यह प्रयोग यीशु की ओर निर्देशित व्यक्तिगत विश्वास को स्वाभाविक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἔλεγον
  choice: वे कह रहे थे
  rationale: अपूर्णकाल चल रही या बार-बार कही जा रही बात का संकेत देता है; ‘कह रहे थे’ इस पहलू को बनाए रखता है।
- source_word: Ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द एक यहूदी मसीही उपाधि के रूप में प्रयुक्त है, व्यक्तिगत नाम की तरह नहीं।
- source_word: ὅταν ἔλθῃ
  choice: जब ... आएगा
  rationale: ὅταν के साथ संभाव्य aorist भविष्य की अपेक्षित घटना को दर्शाता है, जिसे हिन्दी में स्वाभाविक रूप से ‘जब ... आएगा’ कहा जाता है।
- source_word: μὴ ... ποιήσει
  choice: तो क्या वह ... करेगा?
  rationale: प्रश्न में μή नकारात्मक उत्तर की अपेक्षा रखता है। हिन्दी का प्रसंगयुक्त ‘तो क्या’ प्रश्न उस अलंकारिक बल को सहज रूप में व्यक्त करता है।
- source_word: πλείονα σημεῖα
  choice: अधिक चिह्न
  rationale: πλείονα संख्या की तुलना करता है, आवश्यक रूप से महानता की नहीं; ‘चिह्न’ यूहन्ना की विशिष्ट और धर्मवैचारिक शब्दावली को सुरक्षित रखता है।
- source_word: οὗτος ἐποίησεν
  choice: इस मनुष्य के किए हुए
  rationale: ‘इस मनुष्य’ भीड़ की सार्वजनिक बोलचाल के अनुरूप यीशु की ओर संकेत करता है और पूर्ण किए गए कार्यों को तुलना के आधार के रूप में रखता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: वाक्यांश ‘जब ... आएगा’ स्पष्ट रूप से अपेक्षित यहूदी अभिषिक्त जन की उपाधि को दर्शाता है। मुख्य पाठ में ‘मसीह’ इस संदर्भ को स्पष्ट रखता है, जबकि वैकल्पिक रूप पादटिप्पणी में सुरक्षित है।
- issue: μή वाले अलंकारिक प्रश्न का बल
  choice: ऐसा प्रश्न जो नकारात्मक उत्तर की अपेक्षा रखता है
  alternative: भविष्य के बारे में तटस्थ प्रश्न
  rationale: μή सामान्यतः अपेक्षित उत्तर ‘नहीं’ होने का संकेत देता है। अनुवाद इसे प्रश्न के रूप में रखता है और भीड़ के विश्वास की सीमा या पूर्णता को अतिरिक्त व्याख्या से तय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चमत्कार’ के बजाय ‘चिह्न’ चुना गया है ताकि यूहन्ना की मूल शब्दावली और उसके संकेतात्मक धर्मवैचारिक भार को सुरक्षित रखा जा सके।
