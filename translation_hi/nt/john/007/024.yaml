  verdict: revise
  source_fidelity: 'The draft accurately represents the prohibition μὴ κρίνετε and the contrast introduced by ἀλλά. However, ‘सही न्याय’ is broader and weaker than δικαίαν κρίσιν: it can mean merely an accurate/correct decision, whereas the Greek calls for judgment characterized by justice/righteousness.'
  naturalness: ‘बाहरी रूप देखकर’ is clear and natural. ‘न्यायसंगत ढंग से न्याय करो’ is more idiomatic in modern Hindi than the literal but awkward ‘न्यायसंगत न्याय करो.’
  terminology: ‘न्यायसंगत’ appropriately conveys the ethical-juridical force of δικαίαν without importing a denominational sense. Retaining ‘न्याय’ in both clauses preserves the rhetorical recurrence of κρίνετε as far as idiomatic Hindi permits.
  issues:
  - severity: medium
    issue: ‘सही न्याय’ understates δικαίαν κρίσιν.
    rationale: ‘सही’ commonly denotes correctness or accuracy; δικαίαν denotes what is just, right, or righteous. ‘न्यायसंगत’ more directly retains the moral and judicial quality of the Greek.
  - severity: low
    issue: The footnote’s alternative ‘न्यायसंगत न्याय’ is overly literal and stylistically awkward.
    rationale: A footnote may offer a closer alternative, but it should still be understandable modern Hindi. ‘न्यायसंगत निर्णय’ provides a clear lexical alternative without altering the sense.
