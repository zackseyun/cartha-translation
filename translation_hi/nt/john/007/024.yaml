  yaml_path: translation/nt/john/007/024.yaml
  text: Do not judge according to appearance[a], but judge with righteous judgment.
translation:
  language: hi
  text: बाहरी रूप देखकर न्याय मत करो,[a] बल्कि न्यायसंगत ढंग से न्याय करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “बाहरी रूप के आधार पर न्याय मत करो, बल्कि न्यायसंगत निर्णय करो।”'
    reason: κατ’ ὄψιν के लिए ‘बाहरी रूप के आधार पर’ और δικαίαν κρίσιν के लिए ‘न्यायसंगत निर्णय’ वैकल्पिक, अपेक्षाकृत निकट अभिव्यक्तियाँ हैं।
lexical_decisions:
- source_word: μὴ κρίνετε
  choice: न्याय न करो
  rationale: μή के साथ वर्तमान काल का आज्ञार्थक यहाँ स्वाभाविक निषेध व्यक्त करता है। ‘न्याय न करो’ संक्षिप्त है और बिना पक्षपात या निंदा जैसे अतिरिक्त अर्थ जोड़े κρίνω की न्याय करने की धारणा बनाए रखता है।
- source_word: κατ’ ὄψιν
  choice: बाहरी रूप देखकर
  rationale: यह पदबंध दिखाई देने वाले बाहरी रूप या सतही छाप को न्याय का आधार बनाने की ओर संकेत करता है। आधुनिक हिन्दी में ‘बाहरी रूप देखकर’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह निषिद्ध प्रकार के न्याय और अपेक्षित प्रकार के न्याय के बीच प्रबल विरोध दर्शाता है; हिन्दी में ‘बल्कि’ इस सुधारात्मक विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν δικαίαν κρίσιν
  choice: सही न्याय
  rationale: δικαίαν यहाँ नैतिक और न्यायिक रूप से उचित या धर्मसम्मत होने का भाव रखता है। ‘सही न्याय’ सामान्य पाठक के लिए सहज है और ‘धर्मी न्याय’ की अस्वाभाविकता से बचता है।
- source_word: κρίνετε
  choice: न्याय करो
  rationale: दोनों उपवाक्यों में ‘न्याय’ को बनाए रखने से यूनानी मूल में κρίνετε की पुनरावृत्ति और वाक्य का अलंकारिक संतुलन सुरक्षित रहता है।
theological_decisions:
- issue: δικαίαν का नैतिक-न्यायिक अर्थ
  choice: सही
  alternative: धर्मी; न्यायसंगत
  rationale: ‘सही’ नैतिक रूप से उचित और निष्पक्ष न्याय का व्यापक भाव देता है, पर इसे केवल कानूनी प्रक्रिया तक सीमित नहीं करता। इससे मूल की नैतिक गंभीरता बनी रहती है और कोई विशिष्ट सांप्रदायिक अर्थ नहीं जुड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक शैली। ‘बाहरी रूप देखकर’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प दर्ज करती है।
