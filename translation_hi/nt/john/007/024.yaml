  rationale: The revision replaces ‘सही’ with ‘न्यायसंगत’ to preserve the just/righteous quality of δικαίαν. It also uses the idiomatic phrase ‘न्यायसंगत ढंग से न्याय करो’ to express the Greek object phrase naturally while maintaining the deliberate repetition of ‘न्याय.’ ‘मत करो’ is the standard modern Hindi prohibitive form.
