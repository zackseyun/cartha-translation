source:
  edition: SBLGNT
  text: οὐδεὶς μέντοι παρρησίᾳ ἐλάλει περὶ αὐτοῦ διὰ τὸν φόβον τῶν Ἰουδαίων.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/013.yaml
  text: Yet no one was speaking openly about him for fear of the Jews[a].
translation:
  language: hi
  text: फिर भी यहूदियों[a] के डर से कोई उसके विषय में खुलकर बात नहीं कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस प्रसंग में ‘यहूदियों’ का अधिक विशिष्ट अर्थ ‘यहूदी नेता’ या ‘यहूदिया के अधिकारी’ हो सकता है। यूहन्ना में ‘यहूदी’ कभी सामान्य रूप से यहूदी लोगों को और कभी यीशु का विरोध करने वाले यरूशलेम-केंद्रित अधिकारियों को दर्शाता है।
    reason: वैकल्पिक संदर्भगत अर्थ को स्पष्ट करना और अनुचित सामान्यीकरण से बचाना।
lexical_decisions:
- source_word: οὐδεὶς
  choice: कोई ... नहीं
  rationale: यह व्यापक नकारात्मक अनिश्चित सर्वनाम है; हिन्दी में विभक्त ‘कोई ... नहीं’ स्वाभाविक और स्पष्ट है।
- source_word: μέντοι
  choice: फिर भी
  rationale: यह पिछली आयत में व्यक्त परस्पर-विरोधी चर्चाओं के साथ हल्का विरोध दिखाता है।
- source_word: παρρησίᾳ
  choice: खुलकर
  rationale: संदर्भ में बिना छिपाए और सार्वजनिक रूप से बोलने का भाव प्रमुख है; ‘खुलकर’ आधुनिक हिन्दी में इस अर्थ को सहज रूप से व्यक्त करता है।
- source_word: ἐλάλει
  choice: बात नहीं कर रहा था
  rationale: अपूर्ण भूतकाल चल रही या प्रचलित गतिविधि को दर्शाता है; ‘कर रहा था’ उसके अपूर्णतात्मक पक्ष को बनाए रखता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί और संबंधकारक का सीधा, गरिमापूर्ण और स्वाभाविक हिन्दी रूप है।
- source_word: διὰ τὸν φόβον
  choice: के डर से
  rationale: διά और कर्मकारक कारण व्यक्त करते हैं; ‘के डर से’ हिन्दी में संज्ञात्मक कारण-संबंध को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों
  rationale: मुख्य पाठ में यूनानी पद की व्यापक और सीधी समानता रखी गई है; यूहन्ना में इसके संदर्भगत रूप से अधिक विशिष्ट अर्थ की सूचना पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: यूहन्ना के वृत्तांत में τῶν Ἰουδαίων का अभिप्रेत समुदाय
  choice: मुख्य पाठ में ‘यहूदियों’ रखा गया है और संदर्भगत संकीर्ण अर्थ पाद-टिप्पणी में बताया गया है।
  alternative: ‘यहूदी अगुओं’ अथवा ‘यहूदिया के अधिकारियों’
  rationale: सीधा रूप यूनानी अभिव्यक्ति की वास्तविक व्यापकता और अस्पष्टता को सुरक्षित रखता है। साथ ही पाद-टिप्पणी बताती है कि इस प्रसंग में आशय संभवतः यरूशलेम-केंद्रित विरोधी अधिकारियों से है, ताकि पूरे यहूदी समुदाय के बारे में कालविपरीत या यहूदी-विरोधी सामान्यीकरण न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है। अपूर्ण भूतकाल तथा मूल पाठ की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
