source:
  edition: SBLGNT
  text: Ὡς δὲ ἀνέβησαν οἱ ἀδελφοὶ αὐτοῦ ⸂εἰς τὴν ἑορτήν, τότε καὶ αὐτὸς ἀνέβη⸃, οὐ φανερῶς ἀλλὰ ὡς ἐν κρυπτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/010.yaml
  text: But when his brothers had gone up to the feast[a], then he also went up, not openly but as if in secret.
translation:
  language: hi
  text: पर जब उसके भाई पर्व के लिए ऊपर गए, तब वह भी ऊपर गया, खुले रूप से नहीं, बल्कि मानो गुप्त रूप से।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बल्कि गुप्त रूप से।’ यूनानी में शाब्दिक भाव ‘बल्कि मानो गुप्त रूप से’ है, जो कथन को कुछ नरम कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὡς δὲ
  choice: पर जब
  rationale: ὡς कालवाचक उपवाक्य आरम्भ करता है और δέ हल्का संक्रमण अथवा विरोध दिखाता है; ‘पर जब’ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀνέβησαν ... ἀνέβη
  choice: चले गए ... गया
  rationale: यरूशलेम की यात्रा में ἀναβαίνω का शाब्दिक भाव ‘ऊपर जाना’ है, पर आधुनिक हिन्दी में ‘पर्व में चले गए/गया’ अधिक स्वाभाविक है; पहले और बाद के जाने का क्रम ‘जब ... चले गए, तब ... गया’ से स्पष्ट है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाई
  rationale: संदर्भ में ἀδελφοί यीशु के पुरुष भाइयों को सूचित करता है; ‘भाई’ लिंग और प्रसंग दोनों के अनुरूप है।
- source_word: εἰς τὴν ἑορτήν
  choice: पर्व में
  rationale: ἑορτή यहाँ झोपड़ियों के पर्व को सूचित करता है। हिन्दी में किसी पर्व में जाने के लिए ‘पर्व में’ सहज है और निकटवर्ती संदर्भ विशिष्ट पर्व की पहचान कराता है।
- source_word: τότε καὶ αὐτὸς
  choice: तब वह भी
  rationale: τότε घटनाक्रम में बाद का समय और καὶ αὐτός यीशु के भी जाने का योगात्मक बल व्यक्त करता है।
- source_word: οὐ φανερῶς
  choice: खुले रूप से नहीं
  rationale: φανερῶς का अर्थ सार्वजनिक या प्रत्यक्ष ढंग से है; यह पद अगले गुप्तता-सूचक वाक्यांश से स्पष्ट विरोध बनाता है।
- source_word: ἀλλὰ ὡς ἐν κρυπτῷ
  choice: बल्कि मानो गुप्त रूप से
  rationale: ‘मानो’ ὡς की हल्की योग्यता को सुरक्षित रखता है; केवल ‘गुप्त रूप से’ कहना मूल की संभावित नरमी को मिटा देता।
theological_decisions:
- issue: पर्व में जाने की यीशु की इस क्रिया और 7:8 में कही गई बात का संबंध
  choice: 'पाठ को सीधा रखा गया है: भाइयों के जाने के बाद यीशु भी गया, पर खुले रूप से नहीं।'
  alternative: ऐसी व्याख्यात्मक भाषा जोड़ना जिससे लगे कि यीशु ने मन बदल लिया था, या पहले कथन के साथ तनाव को अनुवाद में ही सुलझा देना।
  rationale: यूनानी पाठ केवल बाद के समय और भिन्न ढंग से जाने का वर्णन करता है; वह संबंध की व्याख्या नहीं करता। इसलिए कथात्मक और धर्मवैचारिक तनाव को यथावत रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘मानो गुप्त रूप से’ कुछ असामान्य होते हुए भी मूल यूनानी की वास्तविक योग्यता सुरक्षित रखता है; इसलिए वैकल्पिक सहज पाठ पादटिप्पणी में दिया गया है।
