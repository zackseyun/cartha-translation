source:
  edition: SBLGNT
  text: ἀλλὰ τοῦτον οἴδαμεν πόθεν ἐστίν· ὁ δὲ χριστὸς ὅταν ἔρχηται οὐδεὶς γινώσκει πόθεν ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/027.yaml
  text: But we know where this man is from; but when the Messiah comes[a], no one knows where he is from.
translation:
  language: hi
  text: लेकिन हम जानते हैं कि यह व्यक्ति कहाँ का है; पर जब मसीह आएगा,[a] तो कोई नहीं जानता कि वह कहाँ का है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लेकिन हम जानते हैं कि यह व्यक्ति कहाँ से है; पर जब मसीह आएगा, तो कोई नहीं जानता कि वह कहाँ से है।”
    reason: πόθεν ἐστίν के लिए ‘कहाँ का है’ के स्थान पर ‘कहाँ से है’ भी स्वाभाविक हिन्दी विकल्प है; दोनों उद्गम या मूल स्थान का भाव व्यक्त करते हैं।
lexical_decisions:
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: यह पिछले विचार के साथ स्पष्ट विरोध दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοῦτον
  choice: यह आदमी
  rationale: संकेतवाचक सर्वनाम यहाँ यीशु की ओर सीधे और कुछ बलपूर्वक संकेत करता है; ‘यह आदमी’ उस व्यक्तिगत संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: वक्ताओं के पास मानी हुई जानकारी को सीधे व्यक्त करता है।
- source_word: πόθεν ἐστίν
  choice: कहाँ का है
  rationale: यह उद्गम या मूल स्थान के प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है और दोनों उपवाक्यों में पुनरावृत्ति बनाए रखता है।
- source_word: ὁ δὲ χριστός
  choice: पर ... मसीह
  rationale: χριστός यहाँ अपेक्षित अभिषिक्त व्यक्ति की उपाधि है, इसलिए ‘मसीह’ उपयुक्त है; ‘पर’ दोनों कथनों का विरोध बनाए रखता है।
- source_word: ὅταν ἔρχηται
  choice: जब ... आएगा
  rationale: अनिश्चित भविष्य में अपेक्षित आगमन को हिन्दी की स्वाभाविक भविष्यकालीन रचना से व्यक्त करता है।
- source_word: οὐδεὶς γινώσκει
  choice: कोई नहीं जानता
  rationale: सार्वभौमिक निषेध और ज्ञान के अर्थ को स्पष्ट, सामान्य हिन्दी में रखता है।
theological_decisions:
- issue: χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: यहाँ शब्द किसी नाम की तरह नहीं, बल्कि यहूदी अपेक्षा के विशेष मसीही व्यक्ति की उपाधि के रूप में प्रयुक्त है।
- issue: मसीह के उद्गम के विषय में भीड़ के कथन का स्वरूप
  choice: कथन को बिना व्याख्यात्मक सुधार के सीधे प्रस्तुत किया गया
  alternative: मुख्य पाठ में यह जोड़ना कि यह केवल भीड़ की मान्यता या गलतफहमी थी
  rationale: पद वक्ताओं की धारणा बताता है; अनुवाद उसे न तो सत्यापित करता है और न धर्मवैज्ञानिक व्याख्या जोड़कर तनाव को मिटाता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यह आदमी’ बोलने वाली भीड़ के सीधे संकेत को बनाए रखता है, जबकि ‘मसीह’ को अपेक्षित धार्मिक उपाधि के रूप में रखा गया है।
