  yaml_path: translation/nt/john/007/040.yaml
  text: Therefore[a], some from the crowd, when they heard these words, were saying, “This truly is the Prophet.”
translation:
  language: hi
  text: इसलिए भीड़ में से कुछ लोग ये बातें सुनकर कह रहे थे, “यह सचमुच वह भविष्यवक्ता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वह भविष्यवक्ता’ से संभवतः मूसा के समान आनेवाले अपेक्षित भविष्यवक्ता का आशय है (देखें व्यवस्थाविवरण 18:15), हालाँकि कुछ व्याख्याकार इसे अधिक सामान्य अर्थ में ‘वह भविष्यवक्ता’ मानते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: Ἐκ τοῦ ὄχλου
  choice: भीड़ में से कुछ लोग
  rationale: यह पदबंध पूरी भीड़ नहीं, बल्कि उसमें से एक समूह को सूचित करता है; हिंदी में ‘भीड़ में से कुछ लोग’ इस अंशात्मक भाव को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकली प्रतिक्रिया या कथा-विकास को जोड़ता है; ‘इसलिए’ इसके संयोजक और निष्कर्षात्मक बल को बनाए रखता है।
- source_word: ἀκούσαντες
  choice: सुनकर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है; ‘सुनकर’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: τῶν λόγων τούτων
  choice: ये बातें
  rationale: यह यीशु के ठीक पहले कहे हुए वचनों की ओर संकेत करता है; इस प्रसंग में ‘ये बातें’ सामान्य आधुनिक हिंदी में सहज है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण काल जारी या अनेक व्यक्तियों द्वारा व्यक्त प्रतिक्रिया का पक्ष बनाए रखता है।
- source_word: Οὗτός ἐστιν
  choice: यह ... है
  rationale: संकेतवाचक सर्वनाम यीशु की ओर सीधे और सजीव ढंग से संकेत करता है; ‘यह’ हिंदी में उसी संकेतात्मक बल को रखता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: यह कथन की सत्यता और दृढ़ता पर बल देता है तथा आधुनिक हिंदी में गरिमापूर्ण और स्वाभाविक है।
- source_word: ὁ προφήτης
  choice: वही भविष्यवक्ता
  rationale: निश्चित पदबंध किसी अपेक्षित विशिष्ट भविष्यवक्ता की ओर संकेत कर सकता है। देवनागरी में अक्षर-आधारित शीर्षकीय भेद संभव नहीं, इसलिए ‘वही’ विशिष्टता दिखाता है, पर उसकी पहचान को मसीह के साथ स्पष्ट रूप से नहीं मिला देता।
theological_decisions:
- issue: ‘ὁ προφήτης’ से अभिप्रेत पहचान
  choice: ‘वही भविष्यवक्ता’ के रूप में अनुवाद, बिना मुख्य पाठ में उसे स्पष्टतः मसीह कहे
  alternative: सामान्य अर्थ में ‘वह भविष्यवक्ता’ या ‘एक भविष्यवक्ता’; अथवा उसे सीधे मसीह के समान ठहराना
  rationale: यूहन्ना के प्रसंग में यह व्यवस्थाविवरण 18:15 के मूसा-जैसे अपेक्षित भविष्यवक्ता की ओर संकेत कर सकता है, पर यह पद स्वयं उस उपाधि की पहचान पूरी तरह निर्धारित नहीं करता। ‘वही भविष्यवक्ता’ अपेक्षा और विशिष्टता को रखते हुए धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘ये बातें सुनकर’ तथा ‘कह रहे थे’ स्वाभाविक हिंदी में यूनानी क्रियात्मक पक्ष को रखते हैं। फुटनोट-चिह्न संबंधित उद्धरण के तुरंत बाद रखा गया है।
