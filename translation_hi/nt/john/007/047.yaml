  source_fidelity: The Hindi accurately represents the discourse connection (οὖν), the indirect object, the Pharisees as speakers, and the rhetorical question. “बहकाए गए हो” appropriately conveys πεπλάνησθε as having been misled/led into error, while “भी” preserves καί. The unexpanded question retains the Greek μή-question’s expectation of a negative reply without making that expectation overly explicit.
