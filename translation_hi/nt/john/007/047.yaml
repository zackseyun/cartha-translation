  text: ἀπεκρίθησαν οὖν αὐτοῖς οἱ Φαρισαῖοι· Μὴ καὶ ὑμεῖς πεπλάνησθε;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/047.yaml
  text: So the Pharisees answered them[a], “Have you also been led astray?”
translation:
  language: hi
  text: इस पर फ़रीसियों ने उन्हें उत्तर दिया, “क्या तुम भी बहकाए गए हो?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम्हें भी धोखा दिया गया है?” यहाँ प्रयुक्त क्रिया का अर्थ किसी को भ्रमित करना या बहकाकर गलत राह पर ले जाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν οὖν
  choice: इस पर ... उत्तर दिया
  rationale: οὖν पिछले कथन के परिणामस्वरूप हुई प्रतिक्रिया को जोड़ता है; ‘इस पर’ संवाद में स्वाभाविक है। ἀπεκρίθησαν के लिए ‘उत्तर दिया’ मानक कथात्मक प्रयोग है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: दत्तिव अप्रत्यक्ष कर्म को हिन्दी में ‘उन्हें’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसियों ने
  rationale: यह यहूदी समूह के नाम का प्रचलित हिन्दी रूप है; कर्ता होने के कारण ‘ने’ लगाया गया है।
- source_word: Μὴ καὶ ὑμεῖς
  choice: क्या तुम भी
  rationale: ‘क्या’ प्रश्न को और ‘भी’ καί की समावेशी बलवत्ता को व्यक्त करता है। μή से अपेक्षित नकारात्मक उत्तर को अतिरिक्त शब्द जोड़कर स्पष्ट नहीं किया गया, ताकि आलंकारिक तनाव बना रहे।
- source_word: πεπλάνησθε
  choice: बहकाए गए हो
  rationale: पूर्णकालिक कर्मवाच्य रूप यहाँ किसी के द्वारा भ्रम या भूल की ओर ले जाए जाने का भाव देता है। ‘बहकाए गए’ इस निष्क्रिय अर्थ और त्रुटि की ओर मोड़े जाने—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: μή से आरम्भ प्रश्न का आलंकारिक बल
  choice: ऐसा प्रश्न रखा गया है जो प्रसंग और लहजे में ‘नहीं’ उत्तर की अपेक्षा करता है, पर मुख्य पाठ में ‘कहीं’ या ‘निश्चय ही नहीं’ नहीं जोड़ा गया।
  alternative: “कहीं तुम भी तो नहीं बहकाए गए?”
  rationale: यूनानी μή वक्ताओं की नकारात्मक अपेक्षा दर्शाता है। सरल ‘क्या तुम भी...?’ प्रश्न उस तिरस्कारपूर्ण चुनौती को प्रसंग में खुला रखता है और स्रोत से अधिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तुम’ अधिकारियों द्वारा अधीनस्थ मंदिर-पहरेदारों को किए गए संबोधन के अनुरूप है। वाक्य में आरोपपूर्ण आलंकारिक प्रश्न का संक्षिप्त रूप बनाए रखा गया है।
