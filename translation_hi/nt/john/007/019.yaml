id: JHN.7.19
reference: John 7:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ Μωϋσῆς ⸀δέδωκεν ὑμῖν τὸν νόμον; καὶ οὐδεὶς ἐξ ὑμῶν ποιεῖ τὸν νόμον. τί με ζητεῖτε ἀποκτεῖναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/019.yaml
  text: Did not Moses give you the law? Yet none of you keeps the law[b][a]. Why are you seeking to kill me?
translation:
  language: hi
  text: क्या मूसा ने तुम्हें व्यवस्था नहीं दी?[a] फिर भी तुममें से कोई भी व्यवस्था का पालन नहीं करता।[b] तुम मुझे मार डालने की कोशिश क्यों कर रहे हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मूसा ने तुम्हें व्यवस्था नहीं दी है?” यूनानी पूर्णकाल का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “व्यवस्था को करता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ ... δέδωκεν
  choice: क्या ... नहीं दी?
  rationale: वाक्य के आरम्भ में οὐ ऐसे प्रश्न को सूचित करता है जिसमें ‘हाँ’ उत्तर अपेक्षित है। यूनानी पूर्णकाल δέδωκεν के परिणाम की वर्तमान प्रासंगिकता है; हिन्दी में ऐतिहासिक कर्ता ‘मूसा’ के साथ ‘दी’ स्वाभाविक है, जबकि ‘दी है’ भी सम्भव है और उसे पादटिप्पणी में रखा गया है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: यह नाम हिन्दी बाइबल-परम्परा और सामान्य प्रयोग के मानक रूप में दिया गया है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यहाँ निश्चित पद उस मूसा की व्यवस्था की ओर संकेत करता है जो इस्राएल को दी गई थी। ‘व्यवस्था’ आधुनिक हिन्दी बाइबलीय प्रयोग में इस विशिष्ट विधान के लिए सुबोध और प्रतिष्ठित शब्द है।
- source_word: καὶ
  choice: फिर भी
  rationale: καί का मूल अर्थ ‘और’ है, पर यहाँ पहले कथन और अगले आरोप के बीच विरोध स्पष्ट है; ‘फिर भी’ उस प्रवचनात्मक विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐδεὶς ἐξ ὑμῶν
  choice: तुममें से कोई भी
  rationale: यह अभिव्यक्ति पूरे समूह के विषय में पूर्ण निषेध को स्पष्ट और सहज हिन्दी में बनाए रखती है।
- source_word: ποιεῖ τὸν νόμον
  choice: व्यवस्था का पालन नहीं करता
  rationale: ποιεῖ का शाब्दिक अर्थ ‘करता है’ है, पर व्यवस्था के साथ हिन्दी में ‘पालन करना’ आज्ञाओं को मानने और व्यवहार में लाने का स्वाभाविक मुहावरा है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τί
  choice: क्यों
  rationale: खोजने/कोशिश करने की क्रिया और उद्देश्यवाचक infinitive के साथ τί यहाँ कारण पूछता है; ‘क्यों’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ζητεῖτε ἀποκτεῖναι
  choice: मार डालने की कोशिश क्यों कर रहे हो
  rationale: वर्तमानकाल ζητεῖτε जारी अभिप्राय या प्रयास व्यक्त करता है। ‘कोशिश कर रहे हो’ आधुनिक हिन्दी में इस भाव को सहजता से देता है, और ‘मार डालना’ ἀποκτείνω की स्पष्ट घातकता बनाए रखता है।
theological_decisions:
- issue: ‘व्यवस्था’ का सन्दर्भ
  choice: मूसा के द्वारा दी गई मूसा की व्यवस्था/तोरा
  alternative: सामान्य नैतिक नियम या अमूर्त ‘कानून’
  rationale: यीशु सीधे मूसा को देनेवाला बताते हैं, इसलिए νόμος यहाँ सामान्य नैतिक सिद्धान्त नहीं, मूसा की व्यवस्था को सूचित करता है। अनुवाद पाठ में अतिरिक्त व्याख्या जोड़े बिना इस सन्दर्भ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम’ मूल के बहुवचन ὑμῖν/ὑμῶν/ζητεῖτε को दर्शाता है। ‘व्यवस्था का पालन करना’ सामान्य पाठक के लिए स्वाभाविक है, जबकि शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
