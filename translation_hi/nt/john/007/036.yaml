id: JHN.7.36
reference: John 7:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς ἐστιν ⸂ὁ λόγος οὗτος⸃ ὃν εἶπε· Ζητήσετέ με καὶ οὐχ ⸀εὑρήσετε, καὶ ὅπου εἰμὶ ἐγὼ ὑμεῖς οὐ δύνασθε ἐλθεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/036.yaml
  text: What is this statement that he said[a], ‘You will seek me and will not find me, and where I am[c][b], you are not able to come’?”
translation:
  language: hi
  text: “यह कैसी बात है जो उसने कही[a], ‘तुम मुझे ढूँढ़ोगे और मुझे नहीं पाओगे, और जहाँ मैं हूँ[b], वहाँ तुम नहीं आ सकते’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह कैसा वचन है जो उसने कहा?” यूनानी λόγος का अर्थ प्रसंग के अनुसार ‘शब्द,’ ‘वचन,’ ‘संदेश’ या ‘बात’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ अनुवादों में “जहाँ मैं जा रहा हूँ” है, पर यहाँ यूनानी पाठ शाब्दिक रूप से “जहाँ मैं हूँ” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: λόγος
  choice: बात
  rationale: यहाँ λόγος यीशु के कहे हुए कथन की विषय-वस्तु को दर्शाता है। आधुनिक हिन्दी में ‘बात’ स्वाभाविक है और ‘शब्द’ की अपेक्षा पूरे कथन का अर्थ बेहतर व्यक्त करता है।
- source_word: τίς ἐστιν ὁ λόγος οὗτος
  choice: यह कैसी बात है
  rationale: ग्रीक प्रश्न की संरचना को बनाए रखते हुए यह हिन्दी में स्वाभाविक ढंग से उस कथन के स्वरूप या आशय पर प्रश्न व्यक्त करता है; ‘इस बात का क्या अर्थ है’ अधिक व्याख्यात्मक होता।
- source_word: Ζητήσετέ με
  choice: तुम मुझे ढूँढ़ोगे
  rationale: ζητέω का प्रसंगानुकूल अर्थ किसी व्यक्ति को खोजने या ढूँढ़ने का प्रयास करना है। ‘ढूँढ़ोगे’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: οὐχ εὑρήσετε
  choice: मुझे नहीं पाओगे
  rationale: भविष्यकालीन निषेध को सीधे व्यक्त करता है। हिन्दी की स्पष्टता और स्वाभाविकता के लिए कर्म ‘मुझे’ दोहराया गया है।
- source_word: ὅπου εἰμὶ ἐγώ
  choice: जहाँ मैं हूँ
  rationale: मूल में वर्तमानकाल εἰμί है, इसलिए ‘जहाँ मैं जा रहा हूँ’ जैसी व्याख्यात्मक भविष्यगत अभिव्यक्ति नहीं अपनाई गई।
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: वहाँ तुम नहीं आ सकते
  rationale: ‘नहीं आ सकते’ हिन्दी में स्वाभाविक रूप से सामर्थ्य या संभावना के अभाव को व्यक्त करता है और δύνασθε का बल बनाए रखता है।
- source_word: εἶπε
  choice: उसने कही
  rationale: λέγω के भूतकालीन रूप का प्रसंगानुकूल सरल अनुवाद है; हिन्दी में ‘बात’ के साथ स्त्रीलिंग क्रिया ‘कही’ आती है।
theological_decisions:
- issue: यीशु के कथन में वर्तमानकाल—‘जहाँ मैं हूँ’
  choice: वर्तमानकाल ‘जहाँ मैं हूँ’ को बनाए रखा गया।
  alternative: ‘जहाँ मैं जा रहा हूँ’
  rationale: ग्रीक पाठ वर्तमानकाल εἰμί का प्रयोग करता है। यूहन्ना के लेखन में इससे जुड़ी यीशु की पहचान, उद्गम और पिता से संबंध की संभावित गहराई को व्याख्यात्मक रूप से केवल भविष्य के गंतव्य में बदलना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह कैसी बात है’ भीड़ के उलझनभरे प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है। उद्धरण को एक ही सतत कथन रखा गया है, क्योंकि दोनों खंड καί से जुड़े हैं।
