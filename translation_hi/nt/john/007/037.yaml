source:
  edition: SBLGNT
  text: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ τῇ μεγάλῃ τῆς ἑορτῆς εἱστήκει ὁ Ἰησοῦς, καὶ ἔκραξεν λέγων· Ἐάν τις διψᾷ ἐρχέσθω πρός με καὶ πινέτω.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/037.yaml
  text: On the last day[a], the great day of the feast, Jesus stood and cried out, saying, “If anyone is thirsty, let him come to me and drink.”
translation:
  language: hi
  text: पर्व के अंतिम दिन—उस महान दिन—यीशु खड़े थे और जोर से पुकारकर कहने लगे, “यदि कोई प्यासा हो, तो वह मेरे पास आए और पिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῇ ἐσχάτῃ ἡμέρᾳ
  choice: पर्व के अंतिम दिन
  rationale: Ἐν के साथ दत्तिव समय बताता है; δέ हल्का कथात्मक संयोजक है, जिसे स्वाभाविक हिन्दी प्रवाह में अलग शब्द से व्यक्त करना आवश्यक नहीं। τῇ ἐσχάτῃ ἡμέρᾳ का सीधा और सहज अर्थ ‘अंतिम दिन’ है।
- source_word: τῇ μεγάλῃ τῆς ἑορτῆς
  choice: जो उसका सबसे महत्त्वपूर्ण दिन था
  rationale: μέγας यहाँ उसी दिन की विशेषता बताता है। हिन्दी में दिन के लिए ‘महान’ की अपेक्षा ‘सबसे महत्त्वपूर्ण’ उत्सव-संदर्भ में अधिक स्वाभाविक है और उसके विशेष गौरव को स्पष्ट रखता है।
- source_word: εἱστήκει ὁ Ἰησοῦς
  choice: यीशु खड़े हुए
  rationale: ἵστημι का यह रूप यीशु के खड़े होने अथवा खड़े होकर सार्वजनिक रूप से बोलने की स्थिति दर्शाता है। संक्षिप्त हिन्दी कथन उस दृश्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔκραξεν λέγων
  choice: ऊँची आवाज़ में पुकारकर कहा
  rationale: κράζω जोर से सार्वजनिक रूप से पुकारने का भाव रखता है, और λέγων आगे कथन की विषयवस्तु प्रस्तुत करता है। संयुक्त हिन्दी पदबंध दोनों तत्वों को बनाए रखता है।
- source_word: Ἐάν τις διψᾷ
  choice: यदि कोई प्यासा हो
  rationale: τις अनिश्चित और सामान्य है; ‘कोई’ उसी व्यापक निमंत्रण को व्यक्त करता है। διψᾷ को ‘प्यासा हो’ कहना सहज है और शाब्दिक तथा रूपक—दोनों संभावनाएँ खुली रखता है।
- source_word: ἐρχέσθω πρός με καὶ πινέτω
  choice: तो वह मेरे पास आए और पिए
  rationale: दोनों वर्तमान आज्ञार्थक रूप निमंत्रण के साथ आग्रह व्यक्त करते हैं। ‘वह’ यूनानी के व्याकरणिक एकवचन को बनाए रखते हुए हिन्दी में सामान्य व्यक्ति का स्वाभाविक निर्देश करता है।
theological_decisions:
- issue: प्यास और पीने का रूपक
  choice: ‘प्यासा’ और ‘पिए’ की मूल छवि को बिना व्याख्या जोड़े बनाए रखा गया है।
  alternative: इसे ‘जीवन की लालसा’ या ‘विश्वास करने’ के रूप में स्पष्ट करके अनुवाद करना।
  rationale: पद स्वयं सजीव रूपक के रूप में निमंत्रण देता है और उसका अर्थ आगे के प्रसंग में खुलता है। मुख्य पाठ में व्याख्या जोड़ना यूहन्ना की जानबूझकर रखी गई अर्थ-समृद्धि को सीमित कर देता।
- issue: τις के बाद सामान्य एकवचन व्यक्ति
  choice: ‘कोई ... वह’ का प्रयोग किया गया है।
  alternative: बहुवचन ‘वे’ या लिंग-विशिष्ट ‘वह पुरुष’ का प्रयोग।
  rationale: हिन्दी का ‘कोई ... वह’ व्याकरणिक एकवचन और सार्वभौमिक निमंत्रण दोनों को स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक लिंग-विशेष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सार्वजनिक पाठ के योग्य, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘सबसे महत्त्वपूर्ण दिन’ μέγας का प्रसंगानुकूल स्वाभाविक रूप है, जबकि प्यास और पीने की धर्मवैचारिक छवि जानबूझकर अनव्याख्यायित रखी गई है।
