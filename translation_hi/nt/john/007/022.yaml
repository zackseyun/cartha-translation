  edition: SBLGNT
  text: διὰ τοῦτο Μωϋσῆς δέδωκεν ὑμῖν τὴν περιτομήν— οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων— καὶ ἐν σαββάτῳ περιτέμνετε ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/022.yaml
  text: For this reason Moses has given you circumcision—not that it is from Moses[a], but from the fathers—and on the Sabbath you circumcise a man.
translation:
  language: hi
  text: इसी कारण मूसा ने तुम्हें खतना दिया है—ऐसा नहीं कि वह मूसा से है, बल्कि पितृपुरुषों से है[a]—और सब्त के दिन तुम एक पुरुष का खतना करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए नहीं कि वह मूसा से है, बल्कि पितृपुरुषों से है।” यह बीच का कथन स्पष्ट करता है कि खतने की शुरुआत मूसा से नहीं, बल्कि पितृपुरुषों से हुई थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह वाक्यांश यीशु की व्याख्या को पिछले कथन से जोड़ने वाला स्वाभाविक कारणसूचक संबंध बनाए रखता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप।
- source_word: δέδωκεν
  choice: दिया है
  rationale: यूनानी पूर्णकाल अतीत में दिए जाने और वर्तमान में उसके बने हुए प्रभाव—प्रथा की मान्यता—दोनों को व्यक्त करता है।
- source_word: τὴν περιτομήν
  choice: खतना
  rationale: वाचा से जुड़ी प्रथा के लिए आधुनिक हिन्दी में सर्वाधिक सहज और व्यापक रूप से समझा जाने वाला शब्द।
- source_word: οὐχ ὅτι ἐκ τοῦ Μωϋσέως ἐστὶν ἀλλ’ ἐκ τῶν πατέρων
  choice: हालाँकि वह मूसा से नहीं, बल्कि पूर्वजों से है
  rationale: कोष्ठकीय स्पष्टीकरण खतने के ऐतिहासिक स्रोत को बताता है। ‘हालाँकि’ हिन्दी में वाक्य-संबंध को स्वाभाविक बनाता है, जबकि ‘से’ स्रोत का अर्थ सुरक्षित रखता है।
- source_word: ἐν σαββάτῳ
  choice: सब्त के दिन भी
  rationale: कालवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘भी’ καί के बल को दिखाता और सब्त के बावजूद प्रथा किए जाने को उभारता है।
- source_word: περιτέμνετε
  choice: तुम ... खतना करते हो
  rationale: वर्तमानकालीन बहुवचन संबोधन उनकी स्वीकृत और नियमित प्रथा को सीधे व्यक्त करता है।
- source_word: ἄνθρωπον
  choice: किसी पुरुष का
  rationale: खतने के ठोस संदर्भ में पुरुष व्यक्ति का संकेत आवश्यक है; ‘किसी’ सामान्य उदाहरण का भाव देता है।
theological_decisions:
- issue: ‘पूर्वजों’ (τῶν πατέρων) का संदर्भ
  choice: यह पितृपुरुषों/पूर्वजों की ओर संकेत करता है, जिनसे खतने की प्रथा मूसा से पहले चली।
  alternative: इसे सामान्य रूप से इस्राएल के सभी पुरखों के लिए समझना।
  rationale: अनुवाद ‘पूर्वजों’ कहकर ऐतिहासिक प्राथमिकता बनाए रखता है, पर मुख्य पाठ में विशेष व्यक्तियों के नाम जोड़कर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- issue: मूसा और खतने के संबंध की अभिव्यक्ति
  choice: मूसा ने व्यवस्था में खतना दिया, पर उसका उद्गम मूसा से नहीं था।
  alternative: वाक्य को ऐसा समझना कि मूसा ने खतना इसलिए दिया क्योंकि वह मूसा से उत्पन्न था।
  rationale: यूनानी कोष्ठकीय खंड स्पष्टतः उद्गम को मूसा से हटाकर पूर्वजों से जोड़ता है; ‘हालाँकि’ इस तनाव को बिना विरोधाभास मिटाए व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खतना’ प्रचलित हिन्दी शब्द है; ‘सब्त’ बाइबलीय संज्ञा के रूप में रखा गया है। डैश मूल के कोष्ठकीय स्पष्टीकरण को दर्शाते हैं।
