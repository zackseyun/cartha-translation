base_translation:
  language: en
  yaml_path: translation/nt/john/007/012.yaml
  text: And there was much murmuring about him among the crowds[a]. Some were saying, “He is good.” Others were saying, “No, on the contrary[b], he is misleading the crowd.”
translation:
  language: hi
  text: और जनसमूहों में उसके विषय में बहुत कानाफूसी हो रही थी[a]। कुछ कहते थे, “वह भला है।” दूसरे कहते थे, “नहीं, बल्कि वह भीड़ को गुमराह कर रहा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विषय में बहुत बड़बड़ाहट” अथवा “दबी आवाज़ में बातचीत।”
    reason: lexical_alternative
  - marker: b
    text: या “भीड़ को धोखा दे रहा है” अथवा “भीड़ को भटका रहा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γογγυσμός
  choice: कानाफूसी
  rationale: यह शब्द धीमे स्वर में होने वाली बुदबुदाहट, असंतोष या गुप्त चर्चा को व्यक्त करता है। यहाँ ‘कानाफूसी’ उत्सव के बीच यीशु के विषय में दबे स्वर में चल रही विभाजित बातचीत को स्वाभाविक हिन्दी में व्यक्त करती है; अन्य अर्थ पाद-टिप्पणी में रखे गए हैं।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: यह मूल यूनानी वाक्यांश का सीधा और गरिमापूर्ण आधुनिक हिन्दी रूप है।
- source_word: πολύς
  choice: बहुत
  rationale: यह कानाफूसी की व्यापक मात्रा को सरल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τοῖς ὄχλοις
  choice: भीड़ों में
  rationale: बहुवचन ὄχλοις को बनाए रखता है और पर्व में एकत्र विभिन्न जनसमूहों की ओर संकेत करता है।
- source_word: οἱ μὲν ... ἄλλοι δὲ
  choice: कुछ ... दूसरे ...
  rationale: यह भीड़ों के भीतर दो विरोधी मत रखने वाले समूहों को स्पष्ट और स्वाभाविक हिन्दी में दर्शाता है।
- source_word: Ἀγαθός
  choice: भला
  rationale: मूल में विधेय विशेषण केवल ‘अच्छा/भला’ है; ‘मनुष्य’ जोड़ने के बजाय ‘वह भला है’ मूल की संक्षिप्तता और शाब्दिक अनिश्चितता बनाए रखता है। चरित्र के नैतिक मूल्यांकन के लिए ‘भला’ स्वाभाविक है।
- source_word: Οὔ, ἀλλὰ
  choice: नहीं, बल्कि
  rationale: यह पहले कथन के सीधे निषेध और उसके विपरीत सुधार, दोनों को संक्षेप में व्यक्त करता है।
- source_word: πλανᾷ
  choice: भटका रहा है
  rationale: πλανάω में गुमराह करने, धोखा देने या सही मार्ग से हटाने का भाव हो सकता है। ‘भटका रहा है’ परिणाम पर बल देता है और जानबूझकर छल का आशय अनिवार्य नहीं बनाता; अन्य सम्भव अर्थ पाद-टिप्पणी में हैं।
- source_word: τὸν ὄχλον
  choice: भीड़ को
  rationale: यहाँ यूनानी एकवचन सामूहिक जनसमूह को दर्शाता है; हिन्दी में ‘भीड़’ उसका सीधा और स्वाभाविक रूप है।
theological_decisions:
- issue: यीशु के विषय में भीड़ के परस्पर विरोधी आकलन
  choice: 'दोनों कथनों को प्रत्यक्ष और तटस्थ रूप में रखा गया है: ‘वह भला है’ और ‘वह भीड़ को भटका रहा है।’'
  alternative: किसी एक कथन को कथावाचक का अनुमोदित निर्णय मानकर नरम या स्पष्ट करना।
  rationale: पद विभाजित जनमत की सूचना देता है, न कि इस स्थान पर कथावाचक द्वारा किसी कथन की पुष्टि। अनुवाद इस तनाव को बिना सुलझाए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘भीड़ों’ मूल के बहुवचन और बाद की ‘भीड़’ मूल के एकवचन को सुरक्षित रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
