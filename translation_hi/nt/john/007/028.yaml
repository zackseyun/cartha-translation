- from: इसलिए यीशु ने मन्दिर-परिसर में शिक्षा देते हुए ऊँचे स्वर में कहा, “तुम मुझे भी जानते हो और यह भी जानते हो कि मैं कहाँ से हूँ।[a] और मैं अपने आप से नहीं आया हूँ,[b] बल्कि जिसने मुझे भेजा है, वह सच्चा है,[c] और उसे तुम नहीं जानते।”
  to: इसलिए यीशु ने मन्दिर-परिसर में शिक्षा देते हुए ऊँचे स्वर में कहा, “तुम मुझे भी जानते हो और यह भी जानते हो कि मैं कहाँ से हूँ।[a] और मैं अपनी ओर से नहीं आया हूँ,[b] बल्कि जिसने मुझे भेजा है, वह सच्चा है,[c] जिसे तुम नहीं जानते।”
  rationale: The revision resolves a genuine Hindi ambiguity in the rendering of ἀπ’ ἐμαυτοῦ while preserving the source’s broad statement about mission and authority. It also makes the final relative clause more idiomatic and syntactically close to the Greek. The declarative/possibly ironic force, the ambiguity of Jesus’ origin, and the unnamed sender remain intact.
