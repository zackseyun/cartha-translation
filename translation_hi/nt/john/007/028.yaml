id: JHN.7.28
reference: John 7:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔκραξεν οὖν ἐν τῷ ἱερῷ διδάσκων ὁ Ἰησοῦς καὶ λέγων· Κἀμὲ οἴδατε καὶ οἴδατε πόθεν εἰμί· καὶ ἀπ’ ἐμαυτοῦ οὐκ ἐλήλυθα, ἀλλ’ ἔστιν ἀληθινὸς ὁ πέμψας με, ὃν ὑμεῖς οὐκ οἴδατε·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/028.yaml
  text: So Jesus cried out in the temple[a], teaching and saying, “You know me, and you know where I am from. And I have not come from myself, but the one who sent me is true[c][b], whom you do not know.”
translation:
  language: hi
  text: इसलिए यीशु ने मन्दिर-परिसर में शिक्षा देते हुए ऊँचे स्वर में कहा, “तुम मुझे भी जानते हो और यह भी जानते हो कि मैं कहाँ से हूँ।[a] और मैं अपनी ओर से नहीं आया हूँ,[b] बल्कि जिसने मुझे भेजा है, वह सच्चा है,[c] जिसे तुम नहीं जानते।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस कथन को सन्दर्भ में विडम्बना या चुनौती के रूप में सुना जा सकता है, लेकिन यूनानी में इसका रूप प्रश्नवाचक नहीं, घोषणात्मक है।
    reason: alternative_reading
  - marker: b
    text: “अपनी ओर से” का अनुवाद “अपने ही अधिकार से” या “अपनी ही पहल पर” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “सच्चा” में “असली” या “वास्तविक” का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: ऊँचे स्वर में कहा
  rationale: यह सार्वजनिक रूप से जोर से बोलने का भाव व्यक्त करता है, पर हिन्दी में दुःख या घबराहट का अनावश्यक संकेत नहीं देता।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर-परिसर में
  rationale: ἱερόν केवल भीतरी पवित्रस्थान नहीं, बल्कि पूरे मन्दिर-परिसर को सूचित करता है।
- source_word: διδάσκων ... καὶ λέγων
  choice: शिक्षा देते हुए ... कहा
  rationale: यह यीशु के बोलने को उनकी चल रही सार्वजनिक शिक्षा के प्रसंग में स्वाभाविक हिन्दी में रखता है।
- source_word: Κἀμὲ οἴδατε καὶ οἴδατε
  choice: तुम मुझे भी जानते हो और यह भी जानते हो
  rationale: दोनों बार आए ‘जानते हो’ को बनाए रखा गया है और Κἀμὲ के बल को ‘भी’ से व्यक्त किया गया है।
- source_word: πόθεν εἰμί
  choice: मैं कहाँ से हूँ
  rationale: यह मूल की बात को खुला रखता है—उसे केवल भौगोलिक या स्पष्टतः स्वर्गीय अर्थ तक सीमित नहीं करता।
- source_word: ἀπ’ ἐμαυτοῦ
  choice: अपने आप से
  rationale: यह स्रोत-पाठ की अभिव्यक्ति और यूहन्ना में यीशु के स्वतंत्र रूप से न आने के विषय को यथासम्भव सुरक्षित रखता है; अधिक स्वाभाविक अर्थ फुटनोट में दिया गया है।
- source_word: οὐκ ἐλήλυθα
  choice: नहीं आया हूँ
  rationale: यूनानी पूर्णकाल को हिन्दी के पूर्ण वर्तमान से व्यक्त किया गया है, जिससे आने की घटना और उसकी वर्तमान परिणति दोनों बनी रहती हैं।
- source_word: ἀληθινὸς
  choice: सच्चा
  rationale: ‘सच्चा’ विश्वसनीय होने के साथ-साथ वास्तविक या असली होने की अर्थ-छाया को भी सम्भव रहने देता है।
- source_word: ὁ πέμψας με
  choice: जिसने मुझे भेजा है
  rationale: यह भेजने वाले की व्यक्तिगत सक्रियता बनाए रखता है और मूल में अनुपस्थित ‘पिता’ को स्पष्ट रूप से नहीं जोड़ता।
- source_word: ὃν ὑμεῖς οὐκ οἴδατε
  choice: उसे तुम नहीं जानते
  rationale: यह प्रत्यक्ष आरोप और ‘जानने’ के व्यक्तिगत भाव को सुरक्षित रखता है।
theological_decisions:
- issue: ‘तुम मुझे भी जानते हो ... मैं कहाँ से हूँ’ कथन को सीधा कथन मानना या प्रश्न/स्पष्ट व्यंग्य बनाना
  choice: मुख्य पाठ में इसे यूनानी व्याकरण के अनुसार घोषणात्मक कथन रखा गया है।
  alternative: “क्या तुम मुझे जानते हो और जानते हो कि मैं कहाँ से हूँ?” अथवा स्पष्ट व्यंग्यसूचक अनुवाद।
  rationale: सन्दर्भ में यह कथन विडम्बनापूर्ण या चुनौतीपूर्ण सुनाई दे सकता है, पर यूनानी रूप प्रश्नवाचक नहीं है। मुख्य पाठ उस तनाव को हल किए बिना बनाए रखता है।
- issue: यीशु के ‘कहाँ से’ होने और ‘अपने आप से’ न आने का आशय
  choice: भाषा को इतना व्यापक रखा गया है कि प्रत्यक्ष मानवीय मूल और गहरे ईश्वरीय मिशन दोनों की सम्भावना बनी रहे।
  alternative: इसे केवल भौगोलिक मूल या स्पष्ट रूप से स्वर्गीय मूल बताना।
  rationale: यूहन्ना में यीशु के मूल के विषय में प्रायः अर्थ की कई परतें रहती हैं; इस वाक्य में मूल से अधिक स्पष्ट बात जोड़ना उचित नहीं।
- issue: ‘जिसने मुझे भेजा है’ का परिचय
  choice: मूल की तरह सम्बन्धसूचक वर्णन रखा गया है।
  alternative: “पिता, जिसने मुझे भेजा है।”
  rationale: प्रसंग से भेजने वाले का परिचय समझा जा सकता है, पर इस उपवाक्य में यूनानी पाठ स्वयं ‘पिता’ पद नहीं जोड़ता।
- issue: ἀληθινός का अर्थ
  choice: ‘सच्चा’ रखा गया है, ताकि सत्यनिष्ठ और वास्तविक/असली दोनों अर्थ-छायाएँ सम्भव रहें।
  alternative: केवल ‘विश्वसनीय’ या केवल ‘वास्तविक’।
  rationale: यूहन्ना में यह शब्द अक्सर केवल कथन की सत्यता से अधिक, वास्तविकता या प्रामाणिकता का भाव भी रखता है; किसी एक अर्थ तक सीमित करना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक-वाचन के अनुकूल रूप अपनाया गया है। ‘मन्दिर-परिसर’ ἱερόν की व्यापकता स्पष्ट करता है। वाक्य की पुनरुक्ति और यूहन्ना के कथन में निहित विडम्बनात्मक तनाव को बनाए रखा गया है; व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़े गए।
