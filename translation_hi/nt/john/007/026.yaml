id: JHN.7.26
reference: John 7:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἴδε παρρησίᾳ λαλεῖ καὶ οὐδὲν αὐτῷ λέγουσιν· μήποτε ἀληθῶς ἔγνωσαν οἱ ἄρχοντες ὅτι οὗτός ⸀ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/026.yaml
  text: And look[a], he is speaking openly, and they say nothing to him. Can it be that the rulers truly know that this is the Messiah?
translation:
  language: hi
  text: और देखो, वह खुलकर बोल रहा है, और वे उससे कुछ नहीं कहते। कहीं ऐसा तो नहीं कि अधिकारियों ने सचमुच जान लिया है कि यही मसीह है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस प्रश्न का अनुवाद यह भी हो सकता है: “क्या यह हो सकता है कि अधिकारियों ने सचमुच जान लिया है कि यही मसीह है?”'
    reason: μήποτε से व्यक्त प्रश्न में आशंकापूर्ण अनुमान और वास्तविक सम्भावना—दोनों की छाया हो सकती है।
lexical_decisions:
- source_word: ἴδε
  choice: देखो
  rationale: यह ध्यान खींचने वाला उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और दृश्य पर श्रोताओं का ध्यान केंद्रित करता है।
- source_word: παρρησίᾳ
  choice: खुलकर
  rationale: संदर्भ में यह सार्वजनिक और बिना रोक-टोक बोलने का भाव देता है। ‘खुलकर’ साहस की अपेक्षा खुले रूप से बोलने पर उचित बल देता है।
- source_word: λαλεῖ
  choice: बोल रहा है
  rationale: वर्तमान दृश्य में चल रही क्रिया को हिन्दी के प्रगतिशील रूप से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: οὐδὲν αὐτῷ λέγουσιν
  choice: वे उससे कुछ नहीं कहते
  rationale: यूनानी में αὐτῷ के दत्तिव भाव को बनाए रखते हुए वाक्य को सीधा रखा गया है; ‘उसके विरुद्ध’ जोड़ना संदर्भगत व्याख्या होती।
- source_word: μήποτε
  choice: कहीं ऐसा तो नहीं कि
  rationale: यह आश्चर्य और संकोच से भरी सम्भावना व्यक्त करता है, न कि सपाट निषेध। हिन्दी में यह वाक्यांश उसी संशयपूर्ण अनुमान को स्वाभाविक रूप से प्रकट करता है।
- source_word: ἀληθῶς
  choice: सचमुच
  rationale: यह क्रियाविशेषण अनुमान की वास्तविकता पर बल देता है और सामान्य आधुनिक हिन्दी में सहज है।
- source_word: ἔγνωσαν
  choice: जान लिया है
  rationale: अओरिस्ट रूप में किसी निष्कर्ष या पहचान तक पहुँचने का भाव सम्भव है। ‘जान लिया है’ उस पूर्णता को बनाए रखता है, बिना अर्थ को केवल ‘पहचान लिया’ तक सीमित किए।
- source_word: οἱ ἄρχοντες
  choice: अधिकारी
  rationale: यह प्रसंग के शासकीय नेतृत्व को दर्शाता है। ‘अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से किसी विशिष्ट धार्मिक पद को नहीं जोड़ता।
- source_word: ὅτι οὗτός ἐστιν ὁ χριστός
  choice: कि यही मसीह है
  rationale: οὗτός पर हिन्दी का ‘यही’ उपयुक्त संकेतात्मक बल देता है। χριστός यहाँ उपाधि है, इसलिए यहूदी मसीही अपेक्षा को व्यक्त करने के लिए ‘मसीह’ चुना गया है।
theological_decisions:
- issue: ὁ χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस प्रसंग में χριστός व्यक्ति के नाम की तरह नहीं, प्रतिज्ञात अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है। ‘मसीह’ हिन्दी पाठकों के लिए उस यहूदी मसीही संदर्भ को सुरक्षित रखता है।
- issue: ἔγνωσαν में ज्ञान अथवा पहचान का भाव
  choice: जान लिया है
  alternative: पहचान लिया है
  rationale: ‘जान लिया है’ यूनानी क्रिया के व्यापक ज्ञानार्थ को बनाए रखते हुए किसी निष्कर्ष तक पहुँचने का भाव भी देता है। ‘पहचान लिया है’ सम्भव है, पर अर्थ को कुछ अधिक संकीर्ण कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘खुलकर’, ‘अधिकारी’ और ‘कहीं ऐसा तो नहीं’ जैसे पद मूल के सार्वजनिक भाषण, नेतृत्व और आश्चर्यपूर्ण संशय को बिना अनावश्यक धार्मिक व्याख्या जोड़े व्यक्त करते हैं।
