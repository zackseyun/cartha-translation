  yaml_path: translation/nt/john/007/005.yaml
  text: For not even his brothers believed in him[a].
translation:
  language: hi
  text: क्योंकि उसके भाई तक उस पर विश्वास नहीं करते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसके भाई तक उस पर विश्वास नहीं कर रहे थे।” यूनानी अपूर्ण भूतकाल की क्रिया को उस समय जारी क्रिया अथवा अवस्था के रूप में भी व्यक्त किया जा सकता है।
    reason: काल-पक्ष का वैकल्पिक अनुवाद
lexical_decisions:
- source_word: οὐδὲ
  choice: भी ... नहीं
  rationale: 'यहाँ οὐδέ कथन पर जोर देता है: यीशु के अपने भाई तक विश्वास नहीं करते थे। स्वाभाविक हिन्दी में ‘भी ... नहीं’ इस अर्थ को स्पष्ट रखता है।'
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को सहज ढंग से व्यक्त करता है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाई
  rationale: पुल्लिंग बहुवचन ἀδελφοί को इस प्रसंग में यीशु के भाइयों के रूप में प्रस्तुत किया गया है; ‘भाई’ अनावश्यक रूप से व्यापक या संप्रदायगत अर्थ तय नहीं करता।
- source_word: ἐπίστευον
  choice: विश्वास नहीं करते थे
  rationale: अपूर्ण भूतकाल को हिन्दी की अभ्यस्त/जारी भूतकालीन रचना ‘करते थे’ से व्यक्त किया गया है, जो प्रसंग में स्वाभाविक भी है और जारी अथवा उस समय की स्थिति का पहलू भी बचाए रखता है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: πιστεύω εἰς के साथ व्यक्तिगत विश्वास या भरोसे की दिशा व्यक्त होती है। आधुनिक हिन्दी में ‘उस पर विश्वास करना’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: यूहन्ना में πιστεύω εἰς αὐτόν का अर्थ
  choice: यीशु पर केंद्रित व्यक्तिगत विश्वास
  alternative: उसकी बात पर भरोसा करना
  rationale: मूल वाक्य यीशु के प्रति विश्वास के अभाव को बताता है, पर उस अविश्वास के कारण या उसके पूर्ण धर्मवैज्ञानिक आशय को नहीं खोलता। ‘उस पर विश्वास’ इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- issue: ἀδελφοί का पारिवारिक संबंध
  choice: भाई
  alternative: निकट संबंधी
  rationale: कथा का सीधा शब्द ‘भाई’ है। अनुवाद यह अलग से निर्धारित नहीं करता कि इस संबंध की सटीक जैविक या विस्तृत पारिवारिक प्रकृति क्या थी।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘विश्वास नहीं करते थे’ बोलचाल में स्वाभाविक रहते हुए यूनानी अपूर्ण भूतकाल का जारी या अभ्यस्त पक्ष बनाए रखता है। सर्वनाम मूल पाठ की निकटता के अनुसार रखे गए हैं; व्यापक प्रसंग में उनका संकेत यीशु की ओर है।
