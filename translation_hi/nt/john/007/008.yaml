  text: तुम पर्व के लिए ऊपर जाओ। मैं इस पर्व में नहीं जा रहा हूँ[a], क्योंकि मेरा समय[b] अभी पूरा नहीं हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में है, “मैं अभी इस पर्व में नहीं जा रहा हूँ।”
    reason: textual_variant
  - marker: b
    text: या “मेरा नियत समय अभी पूरा नहीं हुआ है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάβητε
  choice: जाओ
  rationale: येरूशलेम की ओर ‘ऊपर जाने’ का भाव संदर्भ में निहित है; सामान्य आधुनिक हिन्दी में ‘पर्व में जाओ’ अधिक स्वाभाविक है।
- source_word: ἑορτή
  choice: पर्व
  rationale: यह धार्मिक उत्सव का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: οὐκ ἀναβαίνω
  choice: मैं ... नहीं जा रहा हूँ
  rationale: वर्तमान काल को निकट भविष्य की प्रगतिशील क्रिया के रूप में व्यक्त करता है और मूल पाठ के οὐκ (‘नहीं’) को बनाए रखता है।
- source_word: καιρός
  choice: समय
  rationale: सरल और स्वाभाविक रूप है, जो संदर्भ में नियत अवसर का अर्थ ग्रहण कर सकता है, पर उसे व्याख्यात्मक रूप से थोपता नहीं।
- source_word: πεπλήρωται
  choice: पूरा हुआ है
  rationale: पूर्ण निष्क्रिय रूप में निहित पूर्णता के भाव को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: पर्व में जाने के विषय में यीशु के कथन का पाठांतर
  choice: 'मुख्य पाठ में SBLGNT का οὐκ: ‘मैं ... नहीं जा रहा हूँ।’'
  alternative: 'कुछ पांडुलिपियों में οὔπω: ‘मैं अभी ... नहीं जा रहा हूँ।’'
  rationale: दिए गए यूनानी आधार-पाठ का अनुसरण करते हुए वास्तविक व्याख्यात्मक तनाव बनाए रखा गया है; महत्त्वपूर्ण पाठांतर पादटिप्पणी में दिया गया है।
- issue: καιρός में नियत समय का संभावित भाव
  choice: मेरा समय
  alternative: मेरा नियत समय
  rationale: ‘समय’ मूल की अर्थगत व्यापकता को बनाए रखता है; ‘नियत’ संभावित संदर्भगत अर्थ को अधिक स्पष्ट करता है, इसलिए उसे पादटिप्पणी में रखा गया है।
