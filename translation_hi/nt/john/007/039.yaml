language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτο δὲ εἶπεν περὶ τοῦ πνεύματος ⸀οὗ ἔμελλον λαμβάνειν οἱ ⸀πιστεύσαντες εἰς αὐτόν· οὔπω γὰρ ἦν ⸀πνεῦμα, ὅτι Ἰησοῦς ⸀οὐδέπω ἐδοξάσθη.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/039.yaml
  text: He said this about the Spirit[a], whom those who believed in him were about to receive; for the Spirit was not yet[b], because Jesus had not yet been glorified.
translation:
  language: hi
  text: उसने यह बात आत्मा[a] के विषय में कही, जिसे उस पर विश्वास करने वाले प्राप्त करने वाले थे; क्योंकि आत्मा अभी तक नहीं थी[b], क्योंकि यीशु अब तक महिमान्वित नहीं हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में यहाँ केवल ‘आत्मा’ है; संदर्भ पवित्र आत्मा की ओर संकेत करता है।
    reason: source_clarity
  - marker: b
    text: 'अधिक स्पष्ट रूप में: ‘पवित्र आत्मा अब तक दिया नहीं गया था।’ मूल यूनानी में केवल ‘आत्मा अभी तक नहीं थी’ है, और इसे यीशु के अब तक महिमान्वित न होने से जोड़ा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: πνεύματος / πνεῦμα
  choice: पवित्र आत्मा / आत्मा
  rationale: संदर्भ में अभिप्राय परमेश्वर के आत्मा से है। पहली बार ‘पवित्र आत्मा’ कहना आधुनिक हिन्दी में संदर्भ स्पष्ट करता है; बाद की कठिन अनिर्दिष्ट पदावली में ‘आत्मा’ यूनानी के अधिक निकट है।
- source_word: οὗ
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम उसी आत्मा की ओर संकेत करता है जिसे विश्वास करनेवाले पाने वाले थे।
- source_word: ἔμελλον λαμβάνειν
  choice: पाने वाले थे
  rationale: यह μέλλω और infinitive की भावी/निकटवर्ती सम्भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πιστεύσαντες εἰς αὐτόν
  choice: उस पर विश्वास करनेवाले
  rationale: यूहन्ना में πιστεύω εἰς की सामान्य दिशा ‘उस पर विश्वास करना’ है; हिन्दी कृदन्त समय-सम्बन्ध को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: οὔπω γὰρ ἦν πνεῦμα
  choice: क्योंकि आत्मा अभी तक नहीं था
  rationale: यूनानी की संक्षिप्त और धर्मवैचारिक रूप से तनावपूर्ण अभिव्यक्ति को बिना ‘दिया गया’ जोड़कर सुरक्षित रखा गया है।
- source_word: ἐδοξάσθη
  choice: महिमान्वित हुआ था
  rationale: यह यूहन्ना में यीशु की मृत्यु, पुनरुत्थान और ऊँचा किए जाने से जुड़ी ‘महिमा’ की प्रमुख शब्दावली बनाए रखता है।
theological_decisions:
- issue: οὔπω γὰρ ἦν πνεῦμα का अर्थ ऐसा दिए बिना व्यक्त करना मानो आत्मा का अस्तित्व ही न था।
  choice: 'मुख्य पाठ में शाब्दिक तनाव रखा गया: ‘आत्मा अभी तक नहीं था’।'
  alternative: ‘पवित्र आत्मा अब तक दिया नहीं गया था’ या ‘आत्मा अब तक इस रीति से उपस्थित नहीं था’।
  rationale: मूल यूनानी में ‘दिया गया’ या ‘उपस्थित’ नहीं है। वाक्य को यीशु के महिमान्वित न होने से जोड़कर पाठ स्वयं अर्थ की दिशा देता है; इसलिए व्याख्यात्मक पूर्ति पादटिप्पणी में दी गई है।
- issue: πνεῦμα में ἅγιον न होने पर हिन्दी में पहचान स्पष्ट करना।
  choice: पहले उल्लेख में ‘पवित्र आत्मा’, फिर कठिन मूल वाक्य में ‘आत्मा’।
  alternative: दोनों स्थानों पर केवल ‘आत्मा’।
  rationale: संदर्भ दिव्य आत्मा की स्पष्ट पहचान कराता है। फिर भी दूसरे स्थान पर ‘आत्मा’ रखना यूनानी की अनिर्दिष्ट, संक्षिप्त रचना को अधिक निकटता से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पाने वाले थे’ स्वाभाविक भविष्याभिमुखता देता है। कठिन मूल वाक्य की असामान्यता जानबूझकर रखी गई है और पादटिप्पणी से स्पष्ट की गई है।
