  text: λέγει Νικόδημος πρὸς αὐτούς, ὁ ⸀ἐλθὼν πρὸς αὐτὸν ⸀πρότερον, εἷς ὢν ἐξ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/050.yaml
  text: Nicodemus[a], the one who had come to him earlier, being one of them, said to them,
translation:
  language: hi
  text: नीकुदेमुस—जो पहले उसके[a] पास आया था और उनमें से एक था—ने उनसे कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो पहले उसके पास आया था।’ व्यापक संदर्भ में ‘उसके’ का संकेत यीशु की ओर है।
    reason: यूनानी सर्वनाम αὐτόν को मुख्य पाठ में बनाए रखते हुए उसके संदर्भ को स्पष्ट करता है।
lexical_decisions:
- source_word: λέγει
  choice: ने ... कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल अधिक स्वाभाविक है।
- source_word: Νικόδημος
  choice: नीकुदेमुस
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: πρὸς αὐτούς
  choice: उनसे
  rationale: वाणी-सूचक क्रिया के साथ यह संबोधित व्यक्तियों को दर्शाता है; हिन्दी में ‘उनसे कहा’ स्वाभाविक है।
- source_word: ὁ ἐλθὼν πρὸς αὐτὸν πρότερον
  choice: वह पहले यीशु के पास आया था
  rationale: वाक्यांश नीकुदेमुस की पहचान कराता है। पूर्वकालिक क्रिया के लिए ‘आया था’ उपयुक्त है। व्यापक संदर्भ में सर्वनाम का संकेत यीशु की ओर है; हिन्दी में अस्पष्ट ‘उसके’ से बचने के लिए नाम स्पष्ट किया गया है।
- source_word: εἷς ὢν ἐξ αὐτῶν
  choice: और उन्हीं में से एक था
  rationale: यह नीकुदेमुस के उस समूह का सदस्य होने की पृष्ठभूमिगत पहचान देता है; कारण-संबंध जोड़े बिना अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: αὐτόν का संदर्भ
  choice: मुख्य पाठ में ‘यीशु’
  alternative: ‘उसके पास’, जिससे यूनानी सर्वनाम की औपचारिक अस्पष्टता बनी रहती
  rationale: यूहन्ना 3:1–2 के व्यापक कथानक में संदर्भ यीशु है। आधुनिक हिन्दी में ‘उसके’ का निकटस्थ संदर्भ भ्रामक हो सकता है, इसलिए आशय स्पष्ट किया गया है।
- issue: ὢν पदबंध का संबंध
  choice: सदस्यता बताने वाला समानाधिकरणात्मक विवरण
  alternative: 'कारणार्थक अनुवाद: ‘क्योंकि वह उन्हीं में से एक था’'
  rationale: यूनानी कृदंत कारण को अनिवार्य रूप से व्यक्त नहीं करता; इसलिए कारणार्थक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। दोनों पहचानसूचक वाक्यांशों को डैश के भीतर रखा गया है, ताकि मूल की समानाधिकरणात्मक संरचना स्पष्ट रहे और पद 51 की ओर बढ़ता अधूरा उद्धरण स्वाभाविक लगे।
