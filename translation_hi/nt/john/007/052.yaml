  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सीधे विवादात्मक लहजे का प्रयोग किया गया है। ‘भविष्यद्वक्ता’ बाइबलीय पदावली को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
