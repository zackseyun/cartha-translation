base_translation:
  language: en
  yaml_path: translation/nt/john/007/052.yaml
  text: They answered and said to him[b][a], “Are you also from Galilee? Search and see that no prophet arises from Galilee.”
translation:
  language: hi
  text: उन्होंने उसे उत्तर दिया, “क्या तुम भी गलील से हो?[a] खोजकर देखो कि गलील से कोई भविष्यद्वक्ता प्रकट नहीं होता।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं तुम भी तो गलील से नहीं हो?” यूनानी प्रश्न इस ढंग से रखा गया है कि बोलने वाले नकारात्मक उत्तर की अपेक्षा करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “गलील से कोई भविष्यद्वक्ता उठाया नहीं जाता।” इससे यह सम्भावना बनी रहती है कि आशय परमेश्वर द्वारा भविष्यद्वक्ता को उठाए जाने से हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθησαν καὶ εἶπαν
  choice: उन्होंने उसे उत्तर दिया
  rationale: यूहन्ना की सामान्य कथात्मक अभिव्यक्ति के दोनों यूनानी क्रियापदों का शब्दशः दोहराव हिन्दी में अस्वाभाविक होगा; ‘उत्तर दिया’ उनके संयुक्त अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Μὴ καὶ σὺ ἐκ τῆς Γαλιλαίας εἶ;
  choice: क्या तुम भी गलील से हो?
  rationale: यह सरल और स्वाभाविक हिन्दी प्रश्न है; μή से सूचित नकारात्मक उत्तर की अपेक्षा और तिरस्कारपूर्ण लहजा संदर्भ से प्रकट होते हैं, जबकि स्पष्टतर विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐραύνησον καὶ ἴδε
  choice: खोजकर देखो
  rationale: दोनों आज्ञार्थक क्रियाओं को संक्षिप्त, प्रचलित हिन्दी पदबंध में बनाए रखता है और शास्त्रों में जाँच करने की चुनौती व्यक्त करता है।
- source_word: προφήτης
  choice: कोई भविष्यद्वक्ता
  rationale: अनिश्चित, बिना उपपद वाले संज्ञा-रूप को सामान्य दावे के रूप में व्यक्त करता है; यहाँ किसी विशिष्ट अंतकालीन ‘उस भविष्यद्वक्ता’ का संकेत आरोपित नहीं किया गया।
- source_word: οὐκ ἐγείρεται
  choice: प्रकट नहीं होता
  rationale: संदर्भ में किसी भविष्यद्वक्ता के उदय या सामने आने का स्वाभाविक हिन्दी रूप है; परमेश्वर द्वारा उठाए जाने की संभावित कर्मवाच्य छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: μή वाले प्रश्न का आलंकारिक बल
  choice: क्या तुम भी गलील से हो?
  alternative: कहीं तुम भी तो गलील से नहीं हो?
  rationale: मूल प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है। मुख्य पाठ में सहज हिन्दी रखी गई है और अधिक स्पष्ट नकारात्मक अपेक्षा को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἐγείρεται में कर्तृवाच्य अथवा दिव्य कर्मवाच्य की सम्भावना
  choice: प्रकट नहीं होता
  alternative: उठाया नहीं जाता
  rationale: क्रिया संदर्भ में भविष्यद्वक्ता के उदय को बता सकती है, पर कर्मवाच्य रूप परमेश्वर द्वारा उठाए जाने का संकेत भी दे सकता है। मुख्य पाठ किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता और विकल्प पादटिप्पणी में देता है।
