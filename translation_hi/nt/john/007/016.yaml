  text: So Jesus answered them[a], “My teaching is not mine, but his who sent me.”
translation:
  language: hi
  text: तब यीशु ने उन्हें उत्तर देकर कहा, “मेरी शिक्षा मेरी अपनी नहीं, बल्कि उसकी है जिसने मुझे भेजा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτοῖς ὁ Ἰησοῦς καὶ εἶπεν
  choice: इसलिए यीशु ने उन्हें उत्तर दिया
  rationale: ‘इसलिए’ οὖν के प्रसंग-संबंध और निष्कर्षात्मक प्रवाह को रखता है। हिन्दी में ‘उत्तर दिया’ के बाद उद्धरण आने से ἀπεκρίθη और καὶ εἶπεν का संयुक्त कथन स्वाभाविक रूप में व्यक्त हो जाता है।
- source_word: Ἡ ἐμὴ διδαχὴ
  choice: मेरी शिक्षा
  rationale: ‘शिक्षा’ διδαχή का स्पष्ट, आधुनिक और गैर-तकनीकी हिन्दी रूप है; ‘मेरी’ यूनानी के बलयुक्त स्वत्वबोध को सहजता से व्यक्त करता है।
- source_word: οὐκ ἔστιν ἐμὴ
  choice: मेरी अपनी नहीं
  rationale: ‘अपनी’ जोड़ने से यूनानी में दोहराए गए ἐμὴ का विरोधात्मक बल स्पष्ट होता है और स्वतंत्र स्वामित्व अथवा उद्गम का निषेध स्वाभाविक हिन्दी में बना रहता है।
- source_word: ἀλλὰ τοῦ πέμψαντός με
  choice: बल्कि उसकी है जिसने मुझे भेजा है
  rationale: यह अपूर्ण रूप से व्यक्त यूनानी संबंधकारक को हिन्दी में स्वत्व/स्रोत के रूप में स्पष्ट करता है। ‘जिसने मुझे भेजा है’ πέμψαντός με का सहज अनुवाद है और ‘भेजा’ में अनावश्यक रूप से ‘नियुक्त किया’ जैसी अतिरिक्त धारणा नहीं जोड़ी गई।
theological_decisions:
- issue: यीशु की शिक्षा और भेजने वाले के बीच संबंध
  choice: ‘मेरी अपनी नहीं, बल्कि उसकी है’ द्वारा स्वत्व और उद्गम—दोनों की संभावित छाया बनाए रखी गई है।
  alternative: ‘मुझसे नहीं आती, बल्कि उससे आती है जिसने मुझे भेजा है।’
  rationale: यूनानी संबंधकारक भेजने वाले से शिक्षा के संबंध को व्यक्त करता है, पर केवल उद्गम या केवल स्वामित्व तक उसे सीमित नहीं करता। चुना हुआ रूप यीशु और भेजने वाले के भेद तथा उनके मिशन की एकता को रखता है, बिना किसी अतिरिक्त मतवैज्ञानिक निष्कर्ष को पाठ में डालने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य में मूल का संक्षिप्त विरोध और कथात्मक संबंध सुरक्षित रखा गया है।
