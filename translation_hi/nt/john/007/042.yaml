reference: John 7:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀οὐχ ἡ γραφὴ εἶπεν ὅτι ἐκ τοῦ σπέρματος Δαυίδ, καὶ ἀπὸ Βηθλέεμ τῆς κώμης ὅπου ἦν Δαυίδ, ⸂ἔρχεται ὁ χριστός⸃;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/042.yaml
  text: Has not the Scripture said that the Messiah comes from the offspring of David and from Bethlehem[a], the village where David was?
translation:
  language: hi
  text: क्या पवित्रशास्त्र ने यह नहीं कहा है कि मसीह[a] दाऊद के वंश से और बैतलहम से, उस गाँव से जहाँ दाऊद था, आता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट।” यूनानी उपाधि ὁ χριστός है।
    reason: मूल उपाधि का वैकल्पिक लिप्यंतरण देना और ‘मसीह’ के अर्थसूचक अनुवाद को पारदर्शी बनाना।
lexical_decisions:
- source_word: ἡ γραφή
  choice: पवित्रशास्त्र
  rationale: यूहन्ना में यह पद प्रामाणिक पवित्र लेख के लिए प्रयुक्त होता है; हिंदी में ‘पवित्रशास्त्र’ इसका स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: εἶπεν
  choice: ने यह नहीं कहा है
  rationale: यूनानी एओरिस्ट को हिंदी के पूर्ण वर्तमान में रखा गया है, क्योंकि अलंकारिक प्रश्न में पवित्रशास्त्र का कथन वर्तमान में भी प्रामाणिक माना जा रहा है।
- source_word: ἐκ τοῦ σπέρματος Δαυίδ
  choice: दाऊद के वंश से
  rationale: यहाँ σπέρμα का अर्थ शाब्दिक बीज नहीं, बल्कि वंश या वंशावली है; ‘वंश’ संक्षिप्त, स्वाभाविक और अर्थ-सटीक है।
- source_word: ἀπὸ Βηθλέεμ
  choice: बैतलहम गाँव से
  rationale: ἀπό उद्गम या मूल स्थान बताता है; ‘से’ हिंदी में यही संबंध सहज रूप से व्यक्त करता है।
- source_word: τῆς κώμης
  choice: गाँव
  rationale: κώμη छोटे बसे हुए स्थान या गाँव को दर्शाता है; ‘गाँव’ ‘नगर’ की तुलना में अधिक सटीक है।
- source_word: ὅπου ἦν Δαυίδ
  choice: जहाँ दाऊद था
  rationale: मूल पाठ केवल दाऊद के वहाँ होने की बात कहता है; ‘रहता था’ या ‘जहाँ से आया था’ कहने से अनावश्यक व्याख्या जुड़ जाती।
- source_word: ἔρχεται
  choice: आता है
  rationale: वर्तमान काल को सामान्य मसीही अपेक्षा के कथन के रूप में सीधे वर्तमान काल में रखा गया है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός यहूदी प्रत्याशित अभिषिक्त राजा और उद्धारकर्ता की उपाधि है; इसलिए अर्थसूचक ‘मसीह’ उपयुक्त है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: विवाद का संदर्भ प्रत्याशित यहूदी अभिषिक्त जन की पहचान और उत्पत्ति है; अतः नाम-जैसे लिप्यंतरण के बजाय उपाधि का अर्थ व्यक्त किया गया है। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दाऊद और बैतलहम के संबंध की अस्पष्टता
  choice: जहाँ दाऊद था
  alternative: जहाँ दाऊद रहता था / जहाँ से दाऊद आया था
  rationale: मूल यूनानी ὅπου ἦν Δαυίδ संबंध को विस्तार से परिभाषित नहीं करता; अनुवाद ने उसी संक्षिप्तता और अस्पष्टता को बनाए रखा है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। अलंकारिक प्रश्न की संरचना बनाए रखी गई है। ‘उस बैतलहम गाँव’ से apposition को स्वाभाविक हिंदी में समाहित किया गया है, जबकि ‘जहाँ दाऊद था’ को जानबूझकर अधिक स्पष्ट नहीं किया गया।
