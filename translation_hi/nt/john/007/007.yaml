id: JHN.7.7
reference: John 7:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ δύναται ὁ κόσμος μισεῖν ὑμᾶς, ἐμὲ δὲ μισεῖ, ὅτι ἐγὼ μαρτυρῶ περὶ αὐτοῦ ὅτι τὰ ἔργα αὐτοῦ πονηρά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/007.yaml
  text: The world is not able to hate you[a], but it hates me[d][c][b], because I testify about it that its works are evil.
translation:
  language: hi
  text: संसार[b] तुमसे घृणा नहीं कर सकता[a], पर वह मुझसे घृणा करता है, क्योंकि मैं उसके विषय में यह गवाही देता हूँ[c] कि उसके काम[d] बुरे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुमसे घृणा करने में समर्थ नहीं है।’
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के लेखन में ‘संसार’ का अर्थ प्रायः परमेश्वर के विरोध में खड़ी मानव-व्यवस्था होता है, न कि सृष्टि किया हुआ जगत मात्र।
    reason: cultural_note
  - marker: c
    text: या, ‘उसके बारे में साक्षी देता हूँ।’
    reason: lexical_alternative
  - marker: d
    text: या, ‘उसके कर्म।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ δύναται
  choice: नहीं कर सकता
  rationale: यह δύναμαι में निहित सामर्थ्य या असमर्थता के भाव को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: यूहन्ना में यह शब्द प्रायः परमेश्वर के विरोध में खड़ी मानव-व्यवस्था की ओर संकेत करता है। मुख्य पाठ में ‘संसार’ रखने से इसका व्यापक और बहुस्तरीय अर्थ सुरक्षित रहता है।
- source_word: μισεῖν / μισεῖ
  choice: घृणा करना / घृणा करता है
  rationale: दोनों स्थानों पर एक ही प्रबल क्रिया रखकर यूनानी पाठ की तीक्ष्णता और ‘तुम’ तथा ‘मुझ’ के बीच का विरोध सुरक्षित किया गया है।
- source_word: ἐμὲ δὲ
  choice: पर वह मुझसे घृणा करता है
  rationale: δέ का विरोधसूचक भाव स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त होता है और यीशु पर बल बना रहता है।
- source_word: μαρτυρῶ
  choice: गवाही देता हूँ
  rationale: यह μαρτυρέω के साक्ष्य देने वाले भाव को सामान्य, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: सर्वनाम का पूर्वपद ‘संसार’ है; यह रूप उसके विषय में गवाही देने का अर्थ रखता है, बिना उसे किसी व्यक्ति तक सीमित किए।
- source_word: τὰ ἔργα αὐτοῦ
  choice: उसके काम
  rationale: ‘काम’ ἔργα का सीधा और सहज हिन्दी पर्याय है तथा यूहन्ना में इसके नैतिक आशय को बनाए रखता है।
- source_word: πονηρά
  choice: बुरे
  rationale: यहाँ शब्द नैतिक बुराई को दर्शाता है; ‘बुरे’ साधारण पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में ‘संसार’ का संकेत और धर्मवैचारिक बल
  choice: मुख्य पाठ में बिना व्याख्यात्मक विस्तार के ‘संसार’ रखा गया है।
  alternative: ‘परमेश्वर के विरोध में खड़ी मानव-व्यवस्था’ या ‘परमेश्वर से विद्रोह करने वाली मानवता’
  rationale: κόσμος में व्यापक और परतदार अर्थ है। यह पद संसार को यीशु का विरोधी दिखाता है क्योंकि वह उसके बुरे कामों को उजागर करता है। मुख्य पाठ किसी एक संकुचित व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘घृणा’ की प्रबलता, ‘संसार’ की यूहन्नाई बहुअर्थकता और गवाही की धारणा को बिना अनावश्यक धर्मवैचारिक विस्तार के सुरक्षित रखा गया है।
