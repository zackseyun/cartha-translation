  text: Ἤκουσαν οἱ Φαρισαῖοι τοῦ ὄχλου γογγύζοντος περὶ αὐτοῦ ταῦτα, καὶ ἀπέστειλαν ⸂οἱ ἀρχιερεῖς καὶ οἱ Φαρισαῖοι ὑπηρέτας⸃ ἵνα πιάσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/032.yaml
  text: The Pharisees heard the crowd muttering these things about him[c][b][a], and the chief priests and the Pharisees sent officers to seize him.
translation:
  language: hi
  text: फरीसियों ने भीड़ को उसके बारे में ये बातें बुदबुदाते[a] सुना। तब प्रधान याजकों और फरीसियों ने उसे पकड़ने[c] के लिए अधिकारियों[b] को भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धीमे स्वर में बातें करते’ अथवा ‘कानाफूसी करते।’ यूनानी शब्द में दबे स्वर में कही गई, संभवतः असंतोष भरी बात का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पहरेदारों’ अथवा ‘मन्दिर के पहरेदारों।’ यूनानी शब्द यहूदी धर्म-अधिकारियों के अधीन आधिकारिक सेवकों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘गिरफ्तार करने।’ यूनानी में अधिक शाब्दिक अर्थ ‘पकड़ने’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤκουσαν
  choice: सुना
  rationale: यहाँ ἀκούω का अओरिस्ट रूप किसी बात के सुनाई पड़ने या जानकारी मिलने को व्यक्त करता है; ‘सुना’ स्वाभाविक और सटीक है।
- source_word: τοῦ ὄχλου
  choice: भीड़ को
  rationale: ὄχλος यहाँ एकत्र लोगों की भीड़ को दर्शाता है। यूनानी की संबंधकारक कर्ता-रचना को हिन्दी में ‘भीड़ को ... बड़बड़ाते सुना’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: γογγύζοντος
  choice: बड़बड़ाते
  rationale: यह शब्द धीमे स्वर में, प्रायः असंतोष या संकोच के साथ कही जा रही बातों का संकेत देता है। ‘बड़बड़ाते’ इन दोनों भावों को काफी हद तक बनाए रखता है।
- source_word: περὶ αὐτοῦ ταῦτα
  choice: उसके बारे में ये बातें
  rationale: περί के साथ संबंधकारक का अर्थ ‘उसके बारे में’ है और बहुवचन ταῦτα को ‘ये बातें’ कहकर सुरक्षित रखा गया है।
- source_word: ἀπέστειλαν
  choice: भेजा
  rationale: ἀποστέλλω का अओरिस्ट यहाँ सीधे किसी को उद्देश्यपूर्वक भेजने का अर्थ देता है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन ἀρχιερεῖς महायाजकीय नेतृत्व-वर्ग को सूचित करता है, न कि एक साथ पद धारण करने वाले अनेक महायाजकों को; ‘प्रधान याजक’ प्रचलित और ऐतिहासिक रूप से उपयुक्त पद है।
- source_word: ὑπηρέτας
  choice: पहरेदारों
  rationale: यूहन्ना के इस प्रसंग में ये यहूदी अधिकारियों के अधीन काम करने वाले आधिकारिक सेवक हैं जिन्हें यीशु को पकड़ने भेजा गया। ‘पहरेदार’ उनकी कार्यगत भूमिका स्पष्ट करता है, जबकि अधिक विशिष्ट पहचान पादटिप्पणी में रखी गई है।
- source_word: ἵνα πιάσωσιν αὐτόν
  choice: उसे पकड़ने के लिए
  rationale: ἵνα और संभावनार्थक क्रिया उद्देश्य व्यक्त करते हैं। πιάζω का मूल भाव पकड़ लेना या अपने काबू में करना है; ‘पकड़ने’ से इसे कानूनी ‘गिरफ्तारी’ तक सीमित किए बिना सुरक्षित रखा गया है।
theological_decisions:
- issue: ὑπηρέτας की संस्थागत पहचान
  choice: प्रधान याजकों और फरीसियों के अधीन पहरेदार
  alternative: अधिकारी; सेवक; मन्दिर के पहरेदार
  rationale: प्रसंग में उन्हें यीशु को पकड़ने के आधिकारिक उद्देश्य से भेजा गया है। ‘पहरेदार’ इस अधिकारपूर्ण कार्य को दर्शाता है, पर यूनानी से अधिक निश्चित संस्थागत पद या सैन्य पहचान आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ यूनानी καί के प्रसंगगत परिणाम/क्रम को स्वाभाविक हिन्दी में व्यक्त करता है। पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद लगाए गए हैं।
