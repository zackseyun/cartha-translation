  yaml_path: translation/nt/john/007/025.yaml
  text: So some of the people of Jerusalem were saying[a], “Is this not the man they are seeking to kill?”
translation:
  language: hi
  text: तब यरूशलेम के कुछ निवासी कह रहे थे, “क्या यह वही व्यक्ति नहीं है जिसे वे मार डालने की कोशिश कर रहे हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल दृश्य में चलती या बार-बार कही जा रही बात को व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्षात्मक और कथात्मक संबंध दिखाता है; यहाँ यीशु के सार्वजनिक रूप से बोलने के प्रत्युत्तर को जोड़ता है।
- source_word: τινες ἐκ τῶν Ἱεροσολυμιτῶν
  choice: यरूशलेम के निवासियों में से कुछ लोग
  rationale: ἐκ की ‘में से’ की भावना और Ἱεροσολυμιτῶν का नगर-निवासी अर्थ दोनों स्वाभाविक हिन्दी में स्पष्ट रहते हैं।
- source_word: Οὐχ οὗτός ἐστιν
  choice: क्या यह वही नहीं है
  rationale: Οὐχ वाला प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है; ‘वही’ उस पहचाने हुए व्यक्ति की ओर संकेत करता है।
- source_word: ζητοῦσιν
  choice: चाहते हैं
  rationale: ζητέω यहाँ किसी कार्य को करने का प्रयत्न या इरादा रखने के अर्थ में है; ‘मार डालना चाहते हैं’ आधुनिक हिन्दी में स्वाभाविक है और वर्तमान मंशा व्यक्त करता है।
- source_word: ἀποκτεῖναι
  choice: मार डालना
  rationale: यह क्रिया सीधे किसी की हत्या करने का अर्थ देती है; ‘मार डालना’ बिना न्यायिक अर्थ जोड़े उस बल को बनाए रखता है।
