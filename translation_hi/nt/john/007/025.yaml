  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। प्रश्न की प्रत्याशित सहमति और यूनानी अपूर्ण भूतकाल की गतिशीलता सुरक्षित रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं, क्योंकि ‘निवासियों में से’ मूल वाक्यांश को स्पष्ट रूप से व्यक्त करता है।
