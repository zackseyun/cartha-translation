base_translation:
  language: en
  yaml_path: translation/nt/john/007/033.yaml
  text: So Jesus said[a], “I am with you a little while longer[b], and I am going to the one who sent me.”
translation:
  language: hi
  text: इस पर यीशु ने कहा, “मैं थोड़ी देर और[a] तुम्हारे साथ हूँ, और मैं उसके पास जा रहा हूँ जिसने मुझे भेजा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभी थोड़े समय तक।”
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के व्यापक संदर्भ में “जिसने मुझे भेजा है” से पिता का संकेत मिलता है।
    reason: cross_reference
lexical_decisions:
- source_word: οὖν
  choice: इस पर
  rationale: यह पूर्ववर्ती घटना और यीशु के कथन के बीच कथात्मक तथा तार्किक संबंध दिखाता है। यहाँ ‘इस पर’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी संयोजक को अत्यधिक निष्कर्षात्मक नहीं बनाता।
- source_word: Ἔτι χρόνον μικρόν
  choice: कुछ समय और
  rationale: ἔτι के ‘अभी भी/और’ तथा χρόνον μικρόν के ‘थोड़ा समय’—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: μεθ’ ὑμῶν εἰμι
  choice: तुम्हारे साथ हूँ
  rationale: वर्तमान काल और यीशु की अपने श्रोताओं के बीच जारी उपस्थिति को सीधे बनाए रखता है।
- source_word: καὶ ὑπάγω
  choice: और मैं ... जा रहा हूँ
  rationale: ὑπάγω के जाने अथवा विदा होने के सरल अर्थ को रखता है। यूनानी में स्पष्ट न होने के कारण ‘फिर’ नहीं जोड़ा गया।
- source_word: πρὸς τὸν πέμψαντά με
  choice: उसके पास ... जिसने मुझे भेजा है
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत का संबंधपरक रूप बनाए रखता है और मुख्य पाठ में भेजने वाले की पहचान स्पष्ट करके नहीं जोड़ता।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ उसकी पहचान
  choice: मुख्य पाठ में परोक्ष अभिव्यक्ति को बनाए रखा गया है।
  alternative: ‘उस पिता के पास जिसने मुझे भेजा है’
  rationale: यूहन्ना के व्यापक संदर्भ में संकेत पिता की ओर है, पर इस पद का यूनानी पाठ केवल ‘जिसने मुझे भेजा’ कहता है। इसलिए मुख्य पाठ उस अप्रत्यक्षता को सुरक्षित रखता है और टिप्पणी में संदर्भ बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारे’ बहुवचन श्रोताओं को व्यक्त करता है। वाक्य की सरलता और मूल पाठ की अप्रत्यक्ष ईश्वर-संबंधी अभिव्यक्ति सुरक्षित रखी गई है।
