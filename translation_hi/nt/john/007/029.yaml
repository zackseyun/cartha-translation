lexical_decisions:
- source_word: ἐγὼ
  choice: मैं
  rationale: कर्ता सर्वनाम को स्पष्ट रूप से रखा गया है, क्योंकि यूनानी में यह बलाघात लिए हुए है और यीशु के दावे को सामने लाता है।
- source_word: οἶδα
  choice: जानता हूँ
  rationale: यह पूर्ण रूप वर्तमान अवस्था का अर्थ देता है; आधुनिक हिन्दी में ‘जानता हूँ’ स्वाभाविक और सटीक है।
- source_word: αὐτόν
  choice: उसे
  rationale: सन्दर्भ में सर्वनाम पिता की ओर संकेत करता है; मुख्य पाठ में ‘पिता’ जोड़ने के बजाय मूल का सर्वनाम सुरक्षित रखा गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: 'यहाँ संयोजक को कारणसूचक समझना सन्दर्भ के अनुकूल है: यीशु उसे जानते हैं, क्योंकि वे उसी की ओर से हैं। ‘कि’ की सम्भावना पादटिप्पणी में रखी गई है।'
- source_word: παρ’ αὐτοῦ
  choice: उसी की ओर से
  rationale: παρά के सम्बन्धकारक रूप में स्रोत या उद्गम का भाव है। ‘उसी की ओर से’ हिन्दी में स्रोत और निकट सम्बन्ध का संकेत देता है, यद्यपि ‘उसी से’ भी सम्भव है।
- source_word: εἰμι
  choice: हूँ
  rationale: वर्तमानकालीन क्रिया को उसी रूप में रखा गया है; इसे ‘आया हूँ’ बनाकर आगमन मात्र तक सीमित नहीं किया गया।
- source_word: κἀκεῖνός
  choice: और उसी ने
  rationale: καί और ἐκεῖνος के संयुक्त रूप को स्वाभाविक हिन्दी में अनुवादित किया गया है; ‘उसी’ से पहले सर्वनाम के साथ सम्बन्ध और बल बना रहता है।
- source_word: με
  choice: मुझे
  rationale: ἀπέστειλεν का सीधा कर्म स्वाभाविक हिन्दी रूप में दिया गया है।
- source_word: ἀπέστειλεν
  choice: भेजा है
  rationale: यूनानी अओरिस्ट भेजे जाने की घटना बताता है। हिन्दी में वर्तमान प्रसंग से जुड़े पूर्ण कार्य के लिए ‘भेजा है’ अधिक स्वाभाविक है और मिशन के जारी परिणाम को व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
theological_decisions:
- issue: παρ’ αὐτοῦ εἰμι में यीशु का पिता से सम्बन्ध
  choice: ‘मैं उसी की ओर से हूँ’—स्रोत/उद्गम और सम्बन्ध को खुला रखते हुए वर्तमानकालीन ‘हूँ’ सुरक्षित रखा गया।
  alternative: ‘मैं उसी से हूँ’; ‘मैं उसके पास से आया हूँ’
  rationale: यह वाक्य यीशु के पिता से विशिष्ट सम्बन्ध और उद्गम की ओर संकेत करता है। ‘आया हूँ’ इसे केवल प्रेषित होकर आने तक सीमित कर सकता है, जबकि ‘उसी से हूँ’ हिन्दी में उत्पत्ति का अधिक सीधा अर्थ दे सकता है। चुना हुआ रूप इन अर्थ-छायाओं को अनावश्यक रूप से निर्णीत नहीं करता।
- issue: ὅτι का कारणसूचक या कथनसूचक अर्थ
  choice: मुख्य पाठ में ‘क्योंकि’
  alternative: ‘कि’
  rationale: तात्कालिक तर्क में यह यीशु के उसे जानने का कारण प्रस्तुत करता है; फिर भी यूनानी व्याकरण कथनसूचक अर्थ की सम्भावना रखता है, इसलिए उसे पादटिप्पणी में सुरक्षित किया गया है।
