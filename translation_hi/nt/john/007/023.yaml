id: JHN.7.23
reference: John 7:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ περιτομὴν ⸀λαμβάνει ἄνθρωπος ἐν σαββάτῳ ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως, ἐμοὶ χολᾶτε ὅτι ὅλον ἄνθρωπον ὑγιῆ ἐποίησα ἐν σαββάτῳ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/023.yaml
  text: If a man receives circumcision on the Sabbath so that the law of Moses may not be broken[c][b][a], are you angry with me because I made a whole man well on the Sabbath?
translation:
  language: hi
  text: यदि किसी पुरुष का सब्त के दिन खतना किया जाता है, ताकि मूसा की व्यवस्था भंग न हो[a], तो क्या तुम मुझ पर इसलिए क्रोधित हो कि मैंने सब्त के दिन एक मनुष्य को पूरी तरह स्वस्थ किया[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भंग न हो’ का अनुवाद ‘अलग न रखी जाए’ या ‘निरस्त न हो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘एक मनुष्य को पूरी तरह स्वस्थ किया’ शरीर के एक अंग का खतना करने और पूरे मनुष्य को स्वस्थ करने के बीच के विरोध को उभारता है।
    reason: cross_reference
lexical_decisions:
- source_word: περιτομὴν λαμβάνει
  choice: खतना ग्रहण करता है
  rationale: यह यूनानी मुहावरे की संरचना को निकटता से रखता है और हिन्दी में बोधगम्य है; भाव है कि उस पुरुष का खतना किया जाता है।
- source_word: ἄνθρωπος
  choice: कोई पुरुष
  rationale: खतने के संदर्भ में यहाँ पुरुष ही अभिप्रेत है; ‘कोई’ शर्तवाचक वाक्य में स्वाभाविक है।
- source_word: ἐν σαββάτῳ
  choice: सब्त के दिन
  rationale: कालवाचक दत्तिव का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: ἵνα μὴ λυθῇ ὁ νόμος Μωϋσέως
  choice: ताकि मूसा की व्यवस्था न टूटे
  rationale: λύω के कानूनी संदर्भ में ‘टूटे’ स्पष्ट है, जबकि ‘निरस्त हो’ भी संभव अर्थ है; अनुवाद व्यवस्था के उल्लंघन का भाव रखता है।
- source_word: χολᾶτε
  choice: क्या तुम मुझसे ... क्रोधित हो
  rationale: क्रिया के क्रोध अथवा रोष के भाव को बिना तीव्रता बढ़ाए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅλον ἄνθρωπον
  choice: एक पूरे मनुष्य को
  rationale: शरीर के एक अंग के खतने और समूचे मनुष्य को स्वस्थ करने के बीच यीशु के अलंकारिक विरोध को सुरक्षित रखता है।
- source_word: ὑγιῆ ἐποίησα
  choice: स्वस्थ कर दिया
  rationale: शाब्दिक भाव ‘स्वस्थ बनाया’ है; ‘स्वस्थ कर दिया’ आधुनिक हिन्दी में सहज है और ὅλον के साथ पूर्ण बहाली का बल बनाए रखता है।
theological_decisions:
- issue: सब्त के दिन खतने और चंगाई के बीच यीशु की तुलना
  choice: स्वीकृत सब्त-दिन के खतने से समूचे मनुष्य को स्वस्थ करने की और भी बड़ी उचितता की ओर तर्क
  alternative: कर्मकांड की व्यवस्था और करुणामय कार्य के बीच एक सामान्य विरोध
  rationale: वाक्य का तर्क मूसा की व्यवस्था को न तोड़ने के लिए सब्त पर खतना किए जाने से आरंभ होकर पूरे मनुष्य को स्वस्थ करने तक जाता है। अनुवाद इस ‘छोटे से बड़े’ तर्क को रखता है, पर व्यवस्था के विरुद्ध कोई बाद का धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘सब्त,’ ‘खतना’ और ‘मूसा की व्यवस्था’ जैसे स्थापित बाइबलीय पद रखे गए हैं।
