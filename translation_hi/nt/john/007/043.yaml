  yaml_path: translation/nt/john/007/043.yaml
  text: So there was a division in the crowd because of him.
translation:
  language: hi
  text: इसलिए उसके कारण भीड़ में फूट पड़ गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σχίσμα
  choice: फूट
  rationale: यह शब्द लोगों के बीच हुए विभाजन को दर्शाता है। इस प्रसंग में ‘फूट’ स्वाभाविक, संक्षिप्त और सामाजिक बँटवारे की तीव्रता को व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह अव्यय पिछली चर्चा के परिणाम को प्रस्तुत करता है; ‘इसलिए’ उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐγένετο
  choice: पड़ गई
  rationale: σχίσμα के साथ γίνομαι किसी विभाजन के उत्पन्न होने को बताता है। हिन्दी मुहावरे ‘फूट पड़ गई’ में यह भाव सहज रूप से आता है।
- source_word: ἐν τῷ ὄχλῳ
  choice: भीड़ में
  rationale: ὄχλος यहाँ एकत्र लोगों की भीड़ को संदर्भित करता है; ‘भीड़ में’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: δι’ αὐτόν
  choice: उसके कारण
  rationale: कर्ता कारक के साथ διά यहाँ कारण बताता है। ‘उसके कारण’ मूल सर्वनाम को बनाए रखते हुए कारण का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: αὐτόν का संदर्भ
  choice: ‘उसके’—सर्वनाम को बनाए रखा गया; संदर्भ यीशु है
  alternative: ‘यीशु के कारण’
  rationale: प्रसंग में सर्वनाम का संदर्भ यीशु है, पर मूल पाठ उसे नाम से स्पष्ट नहीं करता। हिन्दी में सर्वनाम स्वाभाविक है और मूल की अभिव्यक्ति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘फूट पड़ गई’ मूल के ‘विभाजन उत्पन्न हुआ’ को मुहावरेदार रूप में व्यक्त करता है।
