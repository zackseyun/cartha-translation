source:
  edition: SBLGNT
  text: Καὶ ⸂μετὰ ταῦτα περιεπάτει ὁ Ἰησοῦς⸃ ἐν τῇ Γαλιλαίᾳ, οὐ γὰρ ἤθελεν ἐν τῇ Ἰουδαίᾳ περιπατεῖν, ὅτι ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/001.yaml
  text: And after these things Jesus was walking in Galilee[a], for he did not want to walk in Judea, because the Jews were seeking to kill him.
translation:
  language: hi
  text: इन बातों के बाद यीशु गलील में घूमते रहे। वे यहूदिया में घूमना नहीं चाहते थे, क्योंकि यहूदी[a] उन्हें मार डालने की कोशिश कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोग” अथवा “यहूदी अगुवे।” यूहन्ना के सुसमाचार में “यहूदी” शब्द प्रायः कथानक के संदर्भ में विशेष रूप से यहूदिया के यहूदी अधिकारियों या यीशु का विरोध करने वाले समूह के लिए प्रयुक्त होता है, न कि समस्त यहूदी लोगों के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: बहुवचन संकेतवाचक और यूहन्ना की कथात्मक कड़ी को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περιεπάτει / περιπατεῖν
  choice: घूमते रहे / घूमना
  rationale: अपूर्ण काल की निरंतर गतिविधि और एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में यथासंभव सुरक्षित रखता है; यहाँ शाब्दिक ‘चलना’ क्षेत्र में आते-जाते रहने के आशय को कम स्पष्ट करता।
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: गलील में
  rationale: स्थानवाचक अभिव्यक्ति का सीधा और स्वाभाविक अनुवाद।
- source_word: οὐ γὰρ ἤθελεν
  choice: वे ... नहीं चाहते थे
  rationale: इच्छा के अभाव को स्पष्ट करता है, असमर्थता को नहीं; γάρ का व्याख्यात्मक संबंध अगले वाक्य की संरचना से व्यक्त होता है।
- source_word: ὅτι ἐζήτουν ... ἀποκτεῖναι
  choice: क्योंकि ... मार डालने की कोशिश कर रहे थे
  rationale: चल रहे शत्रुतापूर्ण प्रयास और हत्या के उद्देश्य, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: मूल पद का औपचारिक रूप मुख्य पाठ में रखा गया है; यूहन्ना के इस कथानक में उसके अधिक सीमित संदर्भ को पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: मुख्य पाठ में ‘यहूदी’, साथ में स्पष्टीकरणात्मक पादटिप्पणी
  alternative: ‘यहूदी अगुवे’ या ‘यहूदिया के लोग’
  rationale: यह मूल की शब्दावली और उसकी संभावित संदर्भगत व्यापकता को सुरक्षित रखता है, पर यह गलत धारणा बनने से रोकता है कि यहाँ बिना भेद किए समस्त यहूदी जाति की बात है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। आदरसूचक बहुवचन ‘वे’ का प्रयोग किया गया है। ‘घूमते रहे’ क्षेत्र के भीतर निरंतर आते-जाते रहने का भाव देता है और दोनों περιπατέω रूपों की पुनरावृत्ति भी बनाए रखता है।
