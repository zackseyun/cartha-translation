reference: John 7:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει οὖν αὐτοῖς ὁ Ἰησοῦς· Ὁ καιρὸς ὁ ἐμὸς οὔπω πάρεστιν, ὁ δὲ καιρὸς ὁ ὑμέτερος πάντοτέ ἐστιν ἕτοιμος.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/006.yaml
  text: So Jesus said to them[a], “My time has not yet come, but your time is always ready.”
translation:
  language: hi
  text: इसलिए यीशु ने उनसे कहा, “मेरा समय अभी नहीं आया है,[a] पर तुम्हारा समय सदा तैयार है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा नियत समय अभी नहीं आया है।” यूनानी शब्द सामान्य समय के साथ-साथ किसी उपयुक्त या निर्धारित अवसर का भी अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्षात्मक अथवा कथात्मक संबंध दिखाता है; ‘इसलिए’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: λέγει ... ὁ Ἰησοῦς
  choice: यीशु ने ... कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में सामान्य भूतकाल अधिक स्वाभाविक है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: दत्तिव अप्रत्यक्ष कर्म का स्वाभाविक हिन्दी रूप; प्रसंग में ये यीशु के भाई हैं, पर पद में नाम जोड़ना आवश्यक नहीं।
- source_word: καιρός
  choice: समय
  rationale: यह उपयुक्त अथवा नियत अवसर का बोध करा सकता है। मुख्य पाठ में ‘समय’ संक्षिप्त और स्वाभाविक है, जबकि अर्थ की विशेष छाया पादटिप्पणी में दी गई है।
- source_word: ὁ καιρὸς ὁ ἐμός
  choice: मेरा समय
  rationale: स्वामित्व पर दिए गए बल और यीशु के समय तथा उनके समय के बीच समानांतर विरोध को बनाए रखता है।
- source_word: οὔπω πάρεστιν
  choice: अभी नहीं आया है
  rationale: πάρεστιν के ‘उपस्थित होना/आ पहुँचना’ और οὔπω के ‘अभी तक नहीं’ को स्वाभाविक काल-संबंधी हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यीशु के समय और उनके समय के बीच स्पष्ट विरोध दिखाता है।
- source_word: ὁ καιρὸς ὁ ὑμέτερος
  choice: तुम्हारा समय
  rationale: पहले खंड के ‘मेरा समय’ के साथ समानांतरता और प्रत्यक्ष संबोधन बनाए रखता है।
- source_word: πάντοτέ
  choice: सदा
  rationale: ‘हर समय’ के अर्थ को संक्षिप्त, गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: ἕτοιμος
  choice: तैयार
  rationale: मूल विशेषण का सीधा अर्थ रखता है और ‘समय सदा तैयार है’ के जानबूझकर असामान्य विरोध को अनावश्यक व्याख्या से नहीं बदलता।
theological_decisions:
- issue: यूहन्ना के प्रसंग में यीशु के ‘समय’ का अर्थ
  choice: मुख्य पाठ में ‘मेरा समय’ रखा गया है।
  alternative: ‘मेरा नियत समय’ अथवा ‘मेरी घड़ी’
  rationale: यहाँ यूनानी शब्द καιρός है, ὥρα नहीं। ‘मेरा समय’ मिशन-संबंधी धार्मिक गहराई की संभावना खुली रखता है, पर मुख्य पाठ में ‘घड़ी’ या किसी विशेष घटना को आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण शैली। ‘तुम्हारा’ प्रसंग के निकट पारिवारिक संबोधन के अनुकूल है। मूल के ‘मेरा समय/तुम्हारा समय’ वाले समानांतर विरोध और उसकी अर्थगत तीक्ष्णता को सुरक्षित रखा गया है।
