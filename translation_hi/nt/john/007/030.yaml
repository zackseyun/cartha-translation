source:
  edition: SBLGNT
  text: ἐζήτουν οὖν αὐτὸν πιάσαι, καὶ οὐδεὶς ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα, ὅτι οὔπω ἐληλύθει ἡ ὥρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/030.yaml
  text: So they were seeking to seize him[a], yet no one laid a hand on him[b], because his hour had not yet come.
translation:
  language: hi
  text: इसलिए वे उसे पकड़ने की कोशिश कर रहे थे[a], फिर भी किसी ने उस पर हाथ नहीं डाला, क्योंकि उसकी घड़ी अभी नहीं आई थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे गिरफ़्तार करने की कोशिश कर रहे थे।” यूनानी क्रिया का अर्थ “पकड़ना” है; इस प्रसंग में संभवतः गिरफ़्तार करना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के सुसमाचार में “उसकी घड़ी” यीशु के मिशन के परमेश्वर द्वारा ठहराए हुए समय की ओर संकेत करने वाली बार-बार आने वाली अभिव्यक्ति है, विशेषकर उसके दुःख, मृत्यु, पुनरुत्थान और महिमा का समय।
    reason: cross_reference
lexical_decisions:
- source_word: ἐζήτουν
  choice: कोशिश कर रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए जा रहे प्रयास को दर्शाता है; आधुनिक हिन्दी में यह स्वाभाविक रूप से उस पक्ष को व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले कथात्मक और तार्किक परिणाम को व्यक्त करता है।
- source_word: πιάσαι
  choice: पकड़ने
  rationale: मूल क्रिया का प्राथमिक अर्थ पकड़ना या काबू में करना है; प्रसंग में इसका आशय गिरफ़्तार करना हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: οὐδεὶς
  choice: किसी ने ... नहीं
  rationale: यूनानी नकारात्मक सर्वनाम का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: ἐπέβαλεν ἐπ’ αὐτὸν τὴν χεῖρα
  choice: उस पर हाथ नहीं डाला
  rationale: यह किसी को पकड़ने के लिए हाथ लगाने का मुहावरा है और यूनानी के एकवचन ‘हाथ’ को भी बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह बताता है कि किसी ने उस पर हाथ क्यों नहीं डाला।
- source_word: οὔπω
  choice: अभी नहीं
  rationale: समय-संबंधी निषेध का सीधा और प्रचलित हिन्दी रूप।
- source_word: ἐληλύθει
  choice: आई थी
  rationale: पूर्णपूर्वकाल यह बताता है कि उस कथात्मक बिंदु तक वह निर्णायक घड़ी नहीं आई थी।
- source_word: ἡ ὥρα αὐτοῦ
  choice: उसकी घड़ी
  rationale: यूहन्ना में बार-बार आने वाली अर्थगर्भित अभिव्यक्ति ‘घड़ी’ को बनाए रखा गया है; इसे सामान्य ‘समय’ में समतल नहीं किया गया।
theological_decisions:
- issue: यूहन्ना के प्रसंग में ‘उसकी घड़ी’ का अर्थ
  choice: मुख्य पाठ में शाब्दिक और अर्थगर्भित अभिव्यक्ति ‘उसकी घड़ी’ रखी गई।
  alternative: ‘उसका समय’ या ‘उसकी मृत्यु का ठहराया हुआ समय’
  rationale: यूहन्ना में यह अभिव्यक्ति यीशु के मिशन के परमेश्वर-निर्धारित समय की ओर संकेत करती है, विशेषकर उसके दुःख, मृत्यु, पुनरुत्थान और महिमा की ओर; फिर भी यह पद इसे केवल मृत्यु या गिरफ़्तारी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पकड़ना’ और ‘घड़ी’ मूल की शब्दावली तथा यूहन्ना की अर्थगत गहराई को सुरक्षित रखते हैं।
