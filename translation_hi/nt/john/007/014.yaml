  - marker: b
    text: यहाँ “मंदिर” के लिए प्रयुक्त यूनानी शब्द पूरे मंदिर-परिसर या उसके आँगनों को सूचित करता है, केवल भीतरी पवित्र भवन को नहीं।
    reason: cultural_note
  - marker: c
    text: यूनानी में क्रिया का रूप शिक्षा देने की जारी गतिविधि पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤδη
  choice: बीत चुका था
  rationale: पूर्णतासूचक हिन्दी क्रिया उस समय तक पर्व के मध्यबिंदु पर पहुँच चुकने का भाव स्वाभाविक रूप से व्यक्त करती है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δὲ तीखा विरोध नहीं, बल्कि हल्का कथात्मक संक्रमण है; ‘तब’ समय-संबंध और कथा की गति को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: τῆς ἑορτῆς μεσούσης
  choice: पर्व का आधा समय बीत चुका था
  rationale: सम्बन्धकारक निरपेक्ष रचना समयगत परिस्थिति बताती है और μεσούσης पर्व के मध्य में होने का संकेत देता है। यह रूप आधुनिक हिन्दी में स्पष्ट है और ‘लगभग पर्व के बीच में’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἀνέβη
  choice: गए
  rationale: ἀναβαίνω में ऊपर जाने का मूल भाव है, पर मंदिर में प्रवेश के लिए हिन्दी में ‘मंदिर में गए’ अधिक स्वाभाविक है; प्रसंगगत चढ़ाई को यांत्रिक ढंग से जोड़ने से वाक्य असहज होता।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम Ἰησοῦς का प्रचलित मानक हिन्दी रूप।
- source_word: εἰς τὸ ἱερὸν
  choice: मंदिर में
  rationale: ἱερόν पूरे मंदिर-परिसर या उसके आँगनों को सूचित करता है, केवल भीतरी पवित्र भवन को नहीं। मुख्य पाठ में परिचित ‘मंदिर’ रखा गया है और सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἐδίδασκεν
  choice: वहाँ शिक्षा दे रहे थे
  rationale: अपूर्ण भूतकाल क्रिया जारी गतिविधि दिखा सकती है। यह अनुवाद ‘शिक्षा देने लगे’ जैसा आरम्भसूचक अर्थ जोड़े बिना उस पक्ष को बनाए रखता है।
theological_decisions:
- issue: ἱερόν का संदर्भ
  choice: ‘मंदिर’ से मंदिर-परिसर या उसके आँगन अभिप्रेत हैं
  alternative: केवल मंदिर का भीतरी पवित्र भवन
  rationale: यूनानी ἱερόν व्यापक मंदिर-परिसर के लिए प्रयुक्त है, जबकि भीतरी भवन के लिए सामान्यतः ναός आता है। दृश्य की सही सांस्कृतिक समझ के लिए यह भेद पादटिप्पणी में बताया गया है।
- issue: ἐδίδασκεν का क्रियापक्ष
  choice: ‘शिक्षा दे रहे थे’—जारी कार्य
  alternative: ‘शिक्षा देने लगे’—आरम्भसूचक कार्य
  rationale: अपूर्ण भूतकाल जारी कार्य को स्पष्टतः सहारा देता है; केवल कथात्मक क्रम के आधार पर आरम्भ का भाव जोड़ना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘पर्व’ धार्मिक उत्सव के लिए प्रचलित और व्यापक रूप से बोधगम्य है। ‘शिक्षा दे रहे थे’ मूल यूनानी के अपूर्ण भूतकाल को बिना अनावश्यक आरम्भसूचक अर्थ जोड़े व्यक्त करता है।
