  text: When the feast was already half over[c][b][a], Jesus went up into the temple and was teaching.
translation:
  language: hi
  text: जब पर्व आधा बीत चुका था[a], यीशु मंदिर[b] में चढ़ गए और शिक्षा दे रहे थे[c]।
  philosophy: optimal-equivalence
  footnotes:
