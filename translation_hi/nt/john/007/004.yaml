id: JHN.7.4
reference: John 7:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐδεὶς γάρ ⸂τι ἐν κρυπτῷ⸃ ποιεῖ καὶ ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι· εἰ ταῦτα ποιεῖς, φανέρωσον σεαυτὸν τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/007/004.yaml
  text: For no one does anything in secret while seeking to be in public view. If you do these things, show yourself to the world.
translation:
  language: hi
  text: क्योंकि कोई भी व्यक्ति छिपकर कुछ नहीं करता और स्वयं खुले तौर पर प्रकट होना चाहता है। यदि तुम ये काम करते हो, तो संसार के सामने अपने आप को प्रकट करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς γάρ
  choice: क्योंकि कोई भी
  rationale: γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से और οὐδεὶς का सामान्य निषेध ‘कोई भी ... नहीं’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τι ἐν κρυπτῷ ποιεῖ
  choice: छिपकर कुछ नहीं करता
  rationale: ἐν κρυπτῷ का मुहावरेदार अर्थ गुप्त या छिपे ढंग से करना है; τι को ‘कुछ’ के रूप में स्पष्ट रखा गया है।
- source_word: ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι
  choice: यदि वह स्वयं लोगों के सामने आना चाहता है
  rationale: ζητεῖ यहाँ अभिलाषा या प्रयत्न बताता है, αὐτός का बल ‘स्वयं’ से सुरक्षित है, और ἐν παρρησίᾳ सार्वजनिक खुलेपन या दृश्यता को सूचित करता है। ‘लोगों के सामने आना’ आधुनिक हिन्दी में इस प्रसंग का स्वाभाविक अर्थ देता है।
- source_word: εἰ ταῦτα ποιεῖς
  choice: यदि तुम ये काम करते हो
  rationale: ग्रीक की वर्तमानकालीन शर्त को सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: φανέρωσον σεαυτὸν
  choice: अपने आपको ... प्रकट करो
  rationale: आज्ञार्थक क्रिया निर्णायक सार्वजनिक आत्म-प्रकटीकरण व्यक्त करती है; ‘प्रकट करो’ यूहन्ना की शब्दावली और प्रसंग दोनों के अनुकूल है।
- source_word: τῷ κόσμῳ
  choice: संसार पर
  rationale: κόσμος के लिए ‘संसार’ यूहन्ना में प्रमुख शब्दगत और साहित्यिक संबंध को बनाए रखता है; हिन्दी में ‘अपने आपको संसार पर प्रकट करो’ प्रतिष्ठित, बोधगम्य प्रयोग है।
theological_decisions:
- issue: यूहन्ना में κόσμος का अर्थ
  choice: संसार
  alternative: जनता / लोगों के सामने
  rationale: तात्कालिक प्रसंग सार्वजनिक दृश्यता का है, फिर भी ‘संसार’ मूल शब्द की व्यापक यूहन्नाई प्रतिध्वनि को सुरक्षित रखता है और उसे केवल ‘जनता’ तक सीमित नहीं करता।
- issue: ἐν παρρησίᾳ का प्रसंगगत आशय
  choice: लोगों के सामने आना
  alternative: खुले तौर पर जाना जाना / सार्वजनिक होना
  rationale: यहाँ विषय निर्भीक वाणी नहीं, सार्वजनिक दृश्यता है। अनुवाद उसी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि मुख्य बल प्रसिद्धि पर है या प्रत्यक्ष उपस्थिति पर।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। भाइयों के चुनौतीपूर्ण कथन की धार बनी रहती है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई।
