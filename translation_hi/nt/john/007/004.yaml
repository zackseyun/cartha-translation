- from: क्योंकि कोई भी छिपकर कुछ नहीं करता, यदि वह स्वयं लोगों के सामने आना चाहता है। यदि तुम ये काम करते हो, तो अपने आपको संसार पर प्रकट करो।
  to: क्योंकि कोई भी व्यक्ति छिपकर कुछ नहीं करता और स्वयं खुले तौर पर प्रकट होना चाहता है। यदि तुम ये काम करते हो, तो संसार के सामने अपने आप को प्रकट करो।
  rationale: The revision restores the Greek non-conditional coordination in the first clause, retains the emphatic force of αὐτός through ‘स्वयं,’ expresses public openness naturally, and corrects the relational sense of τῷ κόσμῳ with ‘संसार के सामने.’ No footnote is necessary because the chosen Hindi wording is clear and does not conceal a materially disputed reading.
