review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the general contrast between secret activity and public visibility, as well as the conditional imperative in the second sentence. However, it renders the participial clause ζητεῖ αὐτὸς ἐν παρρησίᾳ εἶναι as a separate conditional clause ('यदि वह... चाहता है'), altering the Greek coordination. The dative τῷ κόσμῳ means 'to/before the world,' not 'upon the world.'
  naturalness: '''संसार पर प्रकट करो'' is not natural modern Hindi in this sense; ''संसार के सामने अपने आप को प्रकट करो'' is idiomatic and clear. A coordinated construction in the first sentence better reflects the source and reads naturally.'
  terminology: ‘संसार’ appropriately preserves κόσμος and its Johannine resonance. ‘खुले तौर पर प्रकट होना’ suitably represents the contextual sense of ἐν παρρησίᾳ εἶναι as public openness/visibility, without importing the distinct sense of bold speech.
  issues:
  - severity: medium
    issue: The first sentence introduces an unwarranted conditional with ‘यदि’.
    rationale: ζητεῖ is coordinated with ποιεῖ and is not the protasis of a conditional sentence. The contrast is that no one acts secretly while also seeking public openness.
  - severity: medium
    issue: ‘संसार पर’ does not correctly render τῷ κόσμῳ in this construction.
    rationale: The dative marks the audience before whom one is manifested. Hindi requires ‘संसार के सामने’ (or ‘संसार पर प्रकट हो’) rather than ‘संसार पर प्रकट करो’; the revised wording retains the reflexive imperative accurately.
  revised_text: क्योंकि कोई भी व्यक्ति छिपकर कुछ नहीं करता और स्वयं खुले तौर पर प्रकट होना चाहता है। यदि तुम ये काम करते हो, तो संसार के सामने अपने आप को प्रकट करो।
  revised_footnotes: []
