base_translation:
  language: en
  yaml_path: translation/nt/john/007/045.yaml
  text: So the officers came to the chief priests and Pharisees[a], and they said to them[b], “Why did you not bring him?”
translation:
  language: hi
  text: तब पहरेदार प्रधान याजकों और फरीसियों के पास आए, और उन लोगों ने उनसे कहा[a], “तुम उसे क्यों नहीं लाए?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में संकेतवाचक शब्द स्पष्ट रूप से आया है, जिसका अर्थ है “उन लोगों ने”; यह प्रधान याजकों और फरीसियों पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम उसे यहाँ क्यों नहीं ले आए?” यूनानी क्रिया का अर्थ “ले चलना” या “ले आना” हो सकता है; इस प्रसंग में “लाना” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले घटनाक्रम के परिणामस्वरूप आगे बढ़ती कथा को जोड़ता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक है।
- source_word: ὑπηρέται
  choice: पहरेदार
  rationale: संदर्भ में ये धार्मिक अधिकारियों द्वारा यीशु को पकड़ने भेजे गए कर्मचारी हैं। ‘पहरेदार’ उनके कार्य को स्पष्ट करता है, जबकि ‘सेवक’ अत्यधिक सामान्य होता।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह प्रमुख याजकीय अधिकारियों के समूह के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: Φαρισαίους
  choice: फरीसी
  rationale: यह यहूदी धार्मिक समूह के नाम का मानक हिन्दी रूप है।
- source_word: ἐκεῖνοι
  choice: उन लोगों ने
  rationale: यूनानी संकेतवाचक सर्वनाम पर बल देता है और प्रधान याजकों तथा फरीसियों की ओर लौटकर संकेत करता है; ‘उन लोगों ने’ इस चिह्नित कर्ता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने का सहज और सीधा हिन्दी रूप।
- source_word: ἠγάγετε
  choice: पकड़कर ... लाए
  rationale: मूल क्रिया का आधारभूत अर्थ ‘ले आना/ले चलना’ है; इस प्रसंग में भेजे जाने का उद्देश्य गिरफ्तारी था, इसलिए ‘पकड़कर लाना’ अपेक्षित कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह यीशु की ओर संकेत करता हुआ कर्मवाचक सर्वनाम है।
