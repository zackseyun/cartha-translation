lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: उत्तर दिया
  rationale: संवाद के प्रसंग में अओरिस्ट रूप का स्वाभाविक और सटीक हिन्दी कथात्मक अनुवाद।
- source_word: οἱ ὑπηρέται
  choice: पहरेदारों
  rationale: यूहन्ना 7:32, 45 के अनुसार ये यीशु को पकड़ने भेजे गए अधिकारी-कर्मचारी थे; ‘पहरेदार’ उनके कार्य को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘मन्दिर के सिपाही’ मूल से अधिक विशिष्ट होता।
- source_word: Οὐδέποτε
  choice: कभी ... नहीं
  rationale: समय के संबंध में पूर्ण निषेध को हिन्दी की स्वाभाविक नकारात्मक रचना में व्यक्त करता है।
- source_word: ἐλάλησεν
  choice: बात नहीं की
  rationale: λαλέω यहाँ बोलने के ढंग को सूचित करता है; ‘बात की’ सहज आधुनिक हिन्दी है और अओरिस्ट को सामान्य भूतकाल से व्यक्त करता है।
- source_word: οὕτως
  choice: इस तरह
  rationale: बोलने की रीति या ढंग को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: किसी मनुष्य ने
  rationale: एकवचन ἄνθρωπος की मानवीय और प्रतिनिधिक शक्ति को बनाए रखता है; नकार के साथ ‘किसी मनुष्य ने ... नहीं’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ἄνθρωπος का प्रतिनिधिक एकवचन
  choice: किसी मनुष्य ने कभी इस तरह बात नहीं की
  alternative: किसी ने कभी इस तरह बात नहीं की
  rationale: चुना हुआ पाठ मूल के स्पष्ट मानवीय संज्ञा-रूप को बनाए रखता है, पर हिन्दी में अनावश्यक रूप से केवल पुरुष लिंग तक अर्थ को सीमित नहीं करता।
