id: JHN.7.41
reference: John 7:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄλλοι ἔλεγον· Οὗτός ἐστιν ὁ χριστός· ⸂οἱ δὲ⸃ ἔλεγον· Μὴ γὰρ ἐκ τῆς Γαλιλαίας ὁ χριστὸς ἔρχεται;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/041.yaml
  text: Others were saying[a], “This is the Messiah.” But some were saying, “Surely the Messiah does not come from Galilee[b], does he?”
translation:
  language: hi
  text: कुछ और लोग कह रहे थे, “यही मसीह है।” लेकिन दूसरे लोग कह रहे थे, “मसीह गलील से तो नहीं आता, है न?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλοι
  choice: कुछ और लोग
  rationale: यह भीड़ के भीतर एक अन्य समूह को दर्शाता है और अगले विरोधी समूह से स्वाभाविक भेद बनाए रखता है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल भीड़ में चल रही या बार-बार व्यक्त की जा रही बात को दर्शाता है।
- source_word: Οὗτός ἐστιν
  choice: यही ... है
  rationale: हिन्दी में पहचान पर बल देने वाला स्वाभाविक रूप है; संकेतवाचक का आशय स्पष्ट रहता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द अपेक्षित अभिषिक्त जन की उपाधि है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ इसी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ δὲ
  choice: लेकिन दूसरे लोग
  rationale: δέ के विरोध और दूसरे समूह की पहचान, दोनों को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: Μὴ γὰρ
  choice: क्या ...?
  rationale: μή वाला प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है। हिन्दी में प्रसंग और प्रश्न-स्वर से यह अलंकारिक बल स्वाभाविक रूप से व्यक्त होता है; कृत्रिम दोहरे नकार से बचा गया है।
- source_word: ἐκ τῆς Γαλιλαίας
  choice: गलील से
  rationale: ἐκ यहाँ उत्पत्ति या आने के स्थान को सूचित करता है, जिसके लिए ‘से’ स्वाभाविक हिन्दी है।
- source_word: ἔρχεται
  choice: आता है
  rationale: वर्तमान काल यहाँ मसीह के उद्गम के विषय में सामान्य अपेक्षा व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: वाक्य में भीड़ अपेक्षित मसीही व्यक्ति की पहचान पर विवाद कर रही है। ‘मसीह’ हिन्दी में स्थापित और अर्थपूर्ण उपाधि है; इसे व्यक्ति-नाम की तरह विस्तार देकर नहीं समझाया गया।
- issue: अलंकारिक प्रश्न का नकारात्मक अभिप्राय
  choice: क्या मसीह गलील से आता है?
  alternative: मसीह गलील से तो नहीं आता, है न?
  rationale: मूल μή प्रश्न नकारात्मक उत्तर की अपेक्षा करता है, पर उसे कथन में बदलता नहीं। मुख्य पाठ प्रश्न को खुला रखते हुए हिन्दी में उसका संदेहपूर्ण स्वर बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। भीड़ के दो समूहों का विरोध स्पष्ट है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पाद-टिप्पणी चिह्न नहीं है।
