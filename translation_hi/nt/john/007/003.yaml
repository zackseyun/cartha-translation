id: JHN.7.3
reference: John 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπον οὖν πρὸς αὐτὸν οἱ ἀδελφοὶ αὐτοῦ· Μετάβηθι ἐντεῦθεν καὶ ὕπαγε εἰς τὴν Ἰουδαίαν, ἵνα καὶ οἱ μαθηταί σου ⸀θεωρήσουσιν ⸂σοῦ τὰ ἔργα⸃ ἃ ποιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/john/007/003.yaml
  text: So his brothers said to him[a], “Leave here and go to Judea, so that your disciples also may see the works you are doing.”
translation:
  language: hi
  text: तब उसके भाइयों ने उससे कहा, “यहाँ से निकलकर यहूदिया चले जाओ, ताकि तुम्हारे चेले भी उन कामों को देख सकें[a] जो तुम कर रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देखें” अथवा “देखेंगे।” यूनानी क्रिया ध्यान से देखने या निहारने का भाव भी दे सकती है। यहाँ उद्देश्य बताने वाले वाक्य में उसका रूप भविष्यकाल का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यहाँ यह कथानक को आगे बढ़ाने वाला स्वाभाविक संबंधसूचक है; ‘तब’ क्रम और प्रसंगगत निष्कर्ष—दोनों को बिना अनावश्यक औपचारिकता के व्यक्त करता है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाई
  rationale: पुल्लिंग बहुवचन पारिवारिक पद को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है; अनुवाद इससे आगे किसी विशेष पारिवारिक सिद्धांत का निर्णय नहीं करता।
- source_word: Μετάβηθι ἐντεῦθεν
  choice: यहाँ से निकलकर
  rationale: आज्ञार्थक क्रिया वर्तमान स्थान को छोड़ने का सीधा निर्देश देती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὕπαγε εἰς τὴν Ἰουδαίαν
  choice: यहूदिया चले जाओ
  rationale: गंतव्य की ओर जाने की आज्ञा को स्पष्ट और बोलचाल-संगत सम्मानरहित बहुवचन/निकट संबंध वाले रूप में व्यक्त करता है, जैसा भाइयों द्वारा यीशु को संबोधन में उचित है।
- source_word: ἵνα καὶ οἱ μαθηταί σου
  choice: ताकि तुम्हारे चेले भी
  rationale: ‘ताकि’ उद्देश्य को और ‘भी’ καὶ के समावेशी बल को सुरक्षित रखता है।
- source_word: θεωρήσουσιν
  choice: देख सकें
  rationale: ἵνα वाले उद्देश्य-वाक्य में भविष्यकालीन रूप को हिन्दी के स्वाभाविक संभावनार्थक उद्देश्य-रूप में दिया गया है; क्रिया में केवल क्षणिक दृष्टि नहीं, देखने/निरीक्षण करने का भाव भी हो सकता है।
- source_word: σοῦ τὰ ἔργα ἃ ποιεῖς
  choice: उन कामों को ... जो तुम कर रहे हो
  rationale: ἔργα के यूहन्नाई विषयगत महत्व को ‘काम’ से बनाए रखते हुए वर्तमानकालीन क्रिया की जारी गतिविधि को ‘कर रहे हो’ से व्यक्त किया गया है। सम्बन्धवाचक रचना हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘उसके भाई’ का संदर्भ
  choice: पाठ में वक्ताओं को यीशु के ‘भाई’ ही कहा गया है।
  alternative: इसे व्यापक अर्थ में निकट संबंधी या कुटुंबी समझना।
  rationale: ἀδελφοί का सीधा हिन्दी समकक्ष ‘भाई’ है। अनुवाद पारिवारिक संबंध को स्पष्ट रखता है, पर पद से परे जाकर बाद की धर्मसैद्धांतिक बहस का निष्कर्ष आरोपित नहीं करता।
- issue: चेलों द्वारा काम देखने का उद्देश्य और परिणाम
  choice: ‘ताकि ... देख सकें’
  alternative: ‘ताकि ... देखेंगे’ अथवा ‘जिससे ... देखें’
  rationale: ἵνα उद्देश्य व्यक्त करता है, जबकि θεωρήσουσιν रूपतः भविष्य निर्देशार्थक है। मुख्य पाठ स्वाभाविक हिन्दी में उद्देश्य रखता है और पादटिप्पणी भविष्य रूप तथा देखने के गहन भाव की सूचना देती है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। भाइयों के सीधे संबोधन में ‘तुम’ रखा गया है। ‘चेले’ सामान्य पाठक के लिए सहज है और गुरु-शिष्य संबंध को सुरक्षित रखता है; ‘काम’ यूहन्ना में ἔργα की विषयगत पुनरावृत्ति के लिए उपयुक्त है।
