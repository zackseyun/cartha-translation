base_translation:
  language: en
  yaml_path: translation/nt/john/007/034.yaml
  text: You will seek me and will not find me[a], and where I am[b], you are not able to come.
translation:
  language: hi
  text: तुम मुझे ढूँढ़ोगे, पर मुझे पाओगे नहीं[a]; और जहाँ मैं हूँ, वहाँ तुम आ नहीं सकते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन हस्तलिपियों में: “तुम मुझे ढूँढ़ोगे।”'
    reason: textual_variant
  - marker: b
    text: 'या: “तुम आने में समर्थ नहीं हो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσετέ
  choice: ढूँढ़ोगे
  rationale: यह भविष्यकाल का बहुवचन रूप है। संदर्भ में यीशु को खोजने या उनका पता लगाने का भाव है; ‘ढूँढ़ोगे’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: με
  choice: मुझे
  rationale: यह यीशु की ओर संकेत करने वाला प्रत्यक्ष कर्म सर्वनाम है।
- source_word: οὐχ εὑρήσετε
  choice: मुझे पाओगे नहीं
  rationale: सरल निषेधात्मक भविष्य को व्यक्त करता है। ‘मुझे’ की पुनरावृत्ति हिन्दी में अर्थ को स्पष्ट और प्रवाहपूर्ण बनाती है, बिना अतिरिक्त बल जोड़े।
- source_word: ὅπου
  choice: जहाँ
  rationale: स्थान बताने वाले सम्बन्धवाचक क्रियाविशेषण का स्वाभाविक हिन्दी समतुल्य।
- source_word: εἰμὶ ἐγώ
  choice: मैं हूँ
  rationale: ἐγώ से ‘मैं’ पर कुछ विरोधात्मक बल है; हिन्दी की वाक्य-संरचना इसे पर्याप्त रूप से बनाए रखती है, इसलिए ‘मैं स्वयं’ जैसा अतिरिक्त बल नहीं जोड़ा गया।
- source_word: ὑμεῖς
  choice: तुम
  rationale: द्वितीय पुरुष बहुवचन। आधुनिक हिन्दी में ‘तुम’ समुदाय को सम्बोधित करने के लिए स्वाभाविक है और ἐγώ के साथ निहित विरोध को बनाए रखता है।
- source_word: οὐ δύνασθε ἐλθεῖν
  choice: तुम आ नहीं सकते
  rationale: δύνασθε सामर्थ्य या संभावना की कमी व्यक्त करता है, अनुमति का निषेध नहीं। ‘आ नहीं सकते’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इसी असमर्थता को स्पष्ट करता है।
theological_decisions:
- issue: ‘जहाँ मैं हूँ, वहाँ तुम आ नहीं सकते’ में असमर्थता का स्वरूप
  choice: इसे असमर्थता के कथन के रूप में रखा गया है, पर उसका कारण निर्धारित नहीं किया गया।
  alternative: ‘तुम्हें आने की अनुमति नहीं है’—यह निषेध या अनुमति का अर्थ जोड़ता, जो यूनानी δύνασθε में नहीं है।
  rationale: पद स्वयं यह स्पष्ट नहीं करता कि असमर्थता नैतिक, आत्मिक, न्यायिक या अस्थायी है। अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ढूँढ़ोगे’ तत्काल संदर्भ में किसी व्यक्ति का पता लगाने का स्वाभाविक भाव देता है; ‘खोजोगे’ को पाद-टिप्पणी में विकल्प के रूप में रखा गया है। विराम और ‘पर’ से दोनों भविष्यकालीन कथनों का विरोध स्पष्ट होता है।
