base_translation:
  language: en
  yaml_path: translation/nt/john/007/049.yaml
  text: But this crowd[a], which does not know the law[b], is accursed.
translation:
  language: hi
  text: पर यह भीड़, जो व्यवस्था[b] को नहीं जानती, शापित[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शाप के अधीन।’
    reason: lexical_alternative
  - marker: b
    text: ‘व्यवस्था’ से आशय यहूदी व्यवस्था अर्थात तोराह है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले कथन के साथ स्पष्ट विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ ὄχλος οὗτος
  choice: यह भीड़
  rationale: ὄχλος के सामूहिक अर्थ को सहज रूप से व्यक्त करता है और ‘उपद्रवी भीड़’ जैसा अतिरिक्त नकारात्मक भाव नहीं जोड़ता।
- source_word: ὁ μὴ γινώσκων
  choice: जो ... नहीं जानती
  rationale: विशेषणात्मक वर्तमान कृदन्त को भीड़ की बनी हुई अवस्था के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: यहाँ इसका संकेत यहूदी धार्मिक व्यवस्था अर्थात तोराह की ओर है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ अर्थपूर्ण और परिचित है।
- source_word: ἐπάρατοί
  choice: शापित
  rationale: यह वक्ताओं की कठोर निन्दा को संक्षिप्त रूप में बनाए रखता है; ‘शाप के अधीन’ भी सम्भव है।
- source_word: εἰσιν
  choice: है
  rationale: यूनानी में क्रिया बहुवचन है, पर हिन्दी में ‘भीड़’ सामूहिक एकवचन संज्ञा है, इसलिए ‘है’ व्याकरणसम्मत और स्वाभाविक है।
theological_decisions:
- issue: क्या वक्ताओं की शत्रुतापूर्ण निन्दा को कथावाचक का धार्मिक निष्कर्ष समझा जाए
  choice: कथन को प्रत्यक्ष वाणी में ज्यों का त्यों कठोर रूप में रखा गया है, बिना उसे कथावाचक की स्वीकृति बताए।
  alternative: ‘उनके अनुसार यह भीड़ शापित है’ जैसे शब्द जोड़कर कथावाचक को स्पष्ट रूप से अलग करना।
  rationale: मूल यूनानी में यह यीशु के विरोधियों की प्रत्यक्ष वाणी है। अनुवाद को उनकी निन्दा न तो नरम करनी चाहिए, न अतिरिक्त शब्दों से उसका समाधान करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भीड़’ के अनुसार स्त्रीलिंग एकवचन क्रिया-विशेषण और क्रिया-रूप प्रयुक्त हुए हैं।
