lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पिछले कथनों की ओर संकेत करता है; ‘ये बातें’ उसके बहुवचन रूप और संदर्भ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ … εἰπὼν
  choice: कहकर
  rationale: δέ के साथ प्रयुक्त एओरिस्ट कृदन्त εἰπών मुख्य क्रिया से पहले हुई क्रिया बताता है। हिन्दी में ‘कहकर’ इस कालक्रम और सहज कथात्मक प्रवाह, दोनों को व्यक्त करता है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: स्पष्ट सर्वनाम αὐτός यहाँ कर्ता पर बल देता है और संदर्भ में यीशु के भाइयों से उसके अपने आचरण का अंतर उभारता है; ‘वह स्वयं’ इस बल को सुरक्षित रखता है।
- source_word: ἔμεινεν
  choice: ही रहा
  rationale: μένω का अर्थ यहाँ किसी स्थान में ठहरे या बने रहना है। ‘गलील में ही रहा’ आधुनिक हिन्दी में स्थान पर बने रहने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῇ Γαλιλαίᾳ
  choice: गलील में
  rationale: यह सीधा स्थानवाचक वाक्यांश है; ‘गलील में’ भौगोलिक संकेत को बिना विस्तार के सुरक्षित रखता है।
