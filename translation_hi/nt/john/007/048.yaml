  yaml_path: translation/nt/john/007/048.yaml
  text: Has any one of the rulers or of the Pharisees believed in him?[a]
translation:
  language: hi
  text: क्या अधिकारियों में से या फ़रीसियों में से किसी ने उस पर विश्वास किया है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यह प्रश्न μή के साथ इस प्रकार रखा गया है कि ‘नहीं’ उत्तर की अपेक्षा होती है।
    reason: नकारात्मक उत्तर की अपेक्षा रखने वाले यूनानी प्रश्न का निहित बल स्पष्ट करना।
lexical_decisions:
- source_word: μή τις
  choice: क्या ... किसी ने
  rationale: यह स्वाभाविक हिन्दी में प्रश्न का रूप बनाए रखता है। μή से संकेत मिलता है कि वक्ता उत्तर ‘नहीं’ की अपेक्षा करते हैं, पर उस निहित उत्तर को मुख्य पाठ में स्पष्ट कथन नहीं बनाया गया।
- source_word: ἐκ τῶν ἀρχόντων
  choice: शासकों में से
  rationale: यह मान्य यहूदी शासकीय अधिकारियों के समूह में से किसी व्यक्ति को सूचित करता है और यूनानी ἐκ की समूह-सदस्यता की भावना को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπίστευσεν
  choice: विश्वास किया है
  rationale: इस आलंकारिक प्रश्न में पूर्ण वर्तमान हिन्दी में स्वाभाविक है और अब तक किसी के विश्वास करने की बात पूछता है; यह यूहन्ना में πιστεύω के सामान्य धार्मिक अर्थ को भी बनाए रखता है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: πιστεύω εἰς का हिन्दी में स्वाभाविक और प्रचलित रूप ‘उस पर विश्वास करना’ है; शाब्दिक ‘उसमें’ यहाँ कम सहज होगा।
- source_word: ἢ
  choice: या
  rationale: सरल विकल्प-सूचक संयोजक यूनानी संरचना और दोनों समूहों के समानांतर उल्लेख को बनाए रखता है।
- source_word: ἐκ τῶν Φαρισαίων
  choice: फ़रीसियों में से
  rationale: यह पहले पदबंध के समानांतर समूह-सदस्यता व्यक्त करता है और समूह के मानक हिन्दी नाम का प्रयोग करता है।
theological_decisions:
- issue: नकारात्मक उत्तर की अपेक्षा रखने वाले आलंकारिक प्रश्न का बल
  choice: प्रश्न का रूप बनाए रखा गया और अपेक्षित उत्तर ‘नहीं’ को पादटिप्पणी में बताया गया।
  alternative: ‘निश्चय ही किसी शासक या फ़रीसी ने उस पर विश्वास नहीं किया है।’
  rationale: μή τις वक्ताओं की नकारात्मक उत्तर की अपेक्षा दिखाता है, पर मूल पाठ व्याकरणतः प्रश्न ही है। प्रश्न को कथन में बदलने से उनकी उपेक्षापूर्ण धारणा आवश्यकता से अधिक स्पष्ट हो जाती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘शासकों’ से तत्काल प्रसंग के मान्य यहूदी शासकीय अधिकारी अभिप्रेत हैं। प्रश्न की पुनरुक्त समानांतर संरचना मूल के दोनों समूहों को स्पष्ट रखती है।
