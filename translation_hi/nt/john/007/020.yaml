review_pass:
  verdict: revise
  source_fidelity: ‘भीड़ ने उत्तर दिया’ accurately renders ἀπεκρίθη ὁ ὄχλος, and ‘तुम में दुष्टात्मा है’ preserves the hostile accusation Δαιμόνιον ἔχεις without endorsing it. However, ‘मार डालने की कोशिश कर रहा है’ can suggest an already initiated attempt, whereas ζητεῖ with the infinitive denotes seeking/intending to kill. ‘मार डालना चाहता है’ more naturally conveys the question’s intended hostile purpose in Hindi.
  naturalness: The draft is generally clear modern Hindi. Replacing ‘मार डालने की कोशिश कर रहा है’ with ‘मार डालना चाहता है’ gives a more idiomatic and contextually accurate rhetorical question.
  terminology: ‘दुष्टात्मा’ is an established and suitable Hindi rendering of δαιμόνιον. It should remain an accusation reported in direct speech, not be expanded to ‘दुष्टात्मा से ग्रस्त,’ which is more interpretive.
  issues:
  - severity: medium
    issue: ‘मार डालने की कोशिश कर रहा है’ overstates ζητεῖ ἀποκτεῖναι.
    rationale: The Greek says ‘is seeking to kill,’ not necessarily that someone is currently making a concrete attempt. Hindi ‘कौन तुम्हें मार डालना चाहता है?’ retains the rhetorical question and hostile intention without adding that implication.
