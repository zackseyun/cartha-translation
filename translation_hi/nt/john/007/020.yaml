  text: The crowd answered[a], “You have a demon. Who is seeking to kill you?”
translation:
  language: hi
  text: भीड़ ने उत्तर दिया, “तुम में दुष्टात्मा है। कौन तुम्हें मार डालना चाहता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में प्रतिक्रिया व्यक्त करने वाले सामान्य यूनानी क्रियापद का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ὄχλος
  choice: भीड़
  rationale: यह शब्द लोगों के समूह को दर्शाता है; ‘भीड़’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: Δαιμόνιον ἔχεις
  choice: तुममें दुष्टात्मा है
  rationale: यूनानी का शाब्दिक अर्थ ‘तुम एक दुष्टात्मा रखते हो’ है, पर हिन्दी में ‘तुममें दुष्टात्मा है’ उसी आरोप को अधिक स्वाभाविक ढंग से व्यक्त करता है और ‘दुष्टात्मा से ग्रस्त’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: τίς
  choice: कौन
  rationale: मूल पाठ के स्पष्ट प्रश्नवाचक सर्वनाम को बनाए रखता है; भीड़ सीधे इनकार करने के बजाय आलंकारिक प्रश्न करती है।
- source_word: ζητεῖ
  choice: कोशिश कर रहा है
  rationale: वर्तमान काल की जारी मंशा/प्रयास को सहज हिन्दी में व्यक्त करता है; यहाँ केवल ‘खोजने’ का भाव अभिप्रेत नहीं है।
- source_word: ἀποκτεῖναι
  choice: मार डालने
  rationale: ‘जान से मारना’ के अर्थ को सीधे व्यक्त करता है और ‘हत्या’ के अतिरिक्त कानूनी-नैतिक अर्थ को नहीं जोड़ता।
theological_decisions:
- issue: यीशु पर लगाए गए आरोप में δαιμόνιον का अनुवाद
  choice: तुममें दुष्टात्मा है
  alternative: तुम दुष्टात्मा से ग्रस्त हो
  rationale: पाठ भीड़ के शत्रुतापूर्ण आरोप को दर्ज करता है, उसका समर्थन नहीं करता। चुना हुआ रूप यूनानी मुहावरे के निकट रहते हुए स्वाभाविक हिन्दी देता है और ‘ग्रस्त’ की अधिक व्याख्यात्मक धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद सहज, स्पष्ट और गरिमापूर्ण रखा गया है। ‘मार डालने की कोशिश’ सामान्य पाठक के लिए ‘ζητεῖ ἀποκτεῖναι’ का स्वाभाविक मुहावरेदार रूप है।
