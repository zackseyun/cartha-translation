source:
  edition: SBLGNT
  text: Μὴ ὁ νόμος ἡμῶν κρίνει τὸν ἄνθρωπον ἐὰν μὴ ἀκούσῃ ⸂πρῶτον παρ’ αὐτοῦ⸃ καὶ γνῷ τί ποιεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/john/007/051.yaml
  text: Our law does not judge a man unless it first hears from him and knows what he is doing[b][a], does it?
translation:
  language: hi
  text: “क्या हमारी व्यवस्था किसी मनुष्य का न्याय तब तक नहीं करती, जब तक वह पहले उसकी बात न सुन ले और यह न जान ले कि वह क्या कर रहा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ
  choice: क्या ... करती है?
  rationale: वाक्य के आरम्भ में μή ऐसा प्रश्न बनाता है जिसका अपेक्षित उत्तर ‘नहीं’ है। हिन्दी में ‘क्या’ के साथ प्रश्नवाचक रूप इस आलंकारिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ νόμος ἡμῶν
  choice: हमारी व्यवस्था
  rationale: यह निकुदेमुस द्वारा अपनी समुदायगत कानूनी व्यवस्था की ओर संकेत है। ‘व्यवस्था’ यूहन्ना के यहूदी धार्मिक-कानूनी संदर्भ में νόμος का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: κρίνει
  choice: न्याय करती है
  rationale: κρίνω यहाँ कानूनी निर्णय करने के व्यापक अर्थ में है। ‘दोषी ठहराती है’ मूल से अधिक संकीर्ण और कठोर होता।
- source_word: τὸν ἄνθρωπον
  choice: किसी मनुष्य का
  rationale: ἄνθρωπον एकवचन में सामान्य प्रतिनिधि अर्थ रखता है। ‘किसी मनुष्य’ हिन्दी में उस सामान्य कानूनी कथन को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐὰν μὴ
  choice: तब तक ... जब तक कि ... न
  rationale: यह आवश्यक नकारात्मक शर्त को हिन्दी के स्वाभाविक ‘तब तक...जब तक...न’ ढाँचे में व्यक्त करता है।
- source_word: ἀκούσῃ πρῶτον παρ’ αὐτοῦ
  choice: पहले उसी से सुन न ले
  rationale: παρ’ αὐτοῦ का अर्थ उस व्यक्ति से सीधे सुनना है; ‘उसी से’ इस स्रोतगत भाव को स्पष्ट रखता है और πρῶτον को ‘पहले’ से व्यक्त करता है।
- source_word: γνῷ
  choice: जान ले
  rationale: यह तथ्यों की जानकारी प्राप्त करने का भाव देता है। पूर्णतासूचक ‘ले’ कानूनी जाँच की प्रक्रिया को सहज हिन्दी में दर्शाता है।
- source_word: τί ποιεῖ
  choice: वह क्या कर रहा है
  rationale: यह ποιεῖ के वर्तमानकालीन, चल रही क्रिया के भाव को बनाए रखता है।
theological_decisions: []
