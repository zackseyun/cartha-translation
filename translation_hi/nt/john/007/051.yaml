  register: आधुनिक मानक हिन्दी; कानूनी संदर्भ के अनुरूप गरिमापूर्ण पर सरल भाषा। प्रश्न का अपेक्षित नकारात्मक उत्तर शब्दशः उत्तर जोड़े बिना प्रश्नवाचक संरचना से व्यक्त किया गया है।
