- source_word: ἡ ἑορτὴ τῶν Ἰουδαίων
  choice: यहूदियों का पर्व
  rationale: सम्बन्धवाचक पदबंध को सीधे और स्वाभाविक रूप में रखा गया है। यहाँ यह पर्व की पहचान बताता है, कोई विवादात्मक टिप्पणी नहीं।
- source_word: ἡ σκηνοπηγία
  choice: झोपड़ियों का पर्व
  rationale: यह नाम पर्व के दौरान अस्थायी छप्परों या झोपड़ियों में रहने की प्रथा को स्पष्ट करता है और मूल शब्द के अर्थ के निकट है।
theological_decisions:
- issue: τῶν Ἰουδαίων का पर्व-सूचक प्रयोग
  choice: यहूदियों का पर्व
  alternative: यहूदी पर्व
  rationale: सम्बन्धवाचक मूल रचना को स्पष्ट रखते हुए यह बताया गया है कि यह यहूदी लोगों का धार्मिक पर्व है; पदबंध को किसी नकारात्मक या विवादात्मक अर्थ में नहीं लिया गया।
- issue: σκηνοπηγία के पारंपरिक पर्व-नाम का अनुवाद
  choice: झोपड़ियों का पर्व
  alternative: मंडपों का पर्व
  rationale: ‘झोपड़ियों’ से अस्थायी आश्रयों का मूल संकेत सामान्य पाठक के लिए अधिक स्पष्ट होता है। ‘मंडपों’ पारंपरिक विकल्प है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
