  text: ἔλαβον τὰ βαΐα τῶν φοινίκων καὶ ἐξῆλθον εἰς ὑπάντησιν αὐτῷ, καὶ ⸀ἐκραύγαζον· Ὡσαννά, εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου, ⸂καὶ ὁ⸃ βασιλεὺς τοῦ Ἰσραήλ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/013.yaml
  text: They took the palm branches and went out to meet him[a], and they were crying out, “Hosanna! Blessed is the one who comes in the name of the Lord[c][b], even the King of Israel!”
translation:
  language: hi
  text: उन्होंने खजूर की डालियाँ लीं और उससे मिलने के लिए बाहर गए। वे पुकारते जा रहे थे, “होशाना![a] धन्य है वह जो प्रभु के नाम से आता है[b]—इस्राएल का राजा!”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘होशाना’ इब्रानी-मूल का जयघोष है, जिसका अर्थ ‘अब बचाइए’ या ‘कृपा करके बचाइए’ है; उस समय तक यह स्तुति के जयघोष के रूप में भी प्रयुक्त होता था।
    reason: lexical_alternative
  - marker: b
    text: यह कथन भजन 118:26 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: c
    text: या, “और इस्राएल का राजा!”
    reason: alternative_reading
lexical_decisions:
- source_word: βαΐα τῶν φοινίκων
  choice: खजूर की डालियाँ
  rationale: यह पदबंध डालियों और उनके वृक्ष-प्रकार दोनों को स्पष्ट करता है; आधुनिक हिन्दी में ‘खजूर की डालियाँ’ स्वाभाविक और सटीक है।
- source_word: ἐξῆλθον εἰς ὑπάντησιν αὐτῷ
  choice: उससे मिलने के लिए बाहर गए
  rationale: यह यूनानी पदबंध किसी से मिलने के उद्देश्य से बाहर जाने को सीधे व्यक्त करता है; ‘स्वागत करने’ से अनावश्यक व्याख्यात्मक भाव जुड़ता।
- source_word: ἐκραύγαζον
  choice: पुकारते जा रहे थे
  rationale: अपूर्ण भूतकाल लगातार या बार-बार हो रही पुकार को दर्शाता है; यह हिन्दी रूप उस पक्ष को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: Ὡσαννά
  choice: होशाना
  rationale: यह इब्रानी-मूल का प्रचलित धर्मोपासना-संबंधी जयघोष है; लिप्यंतरण इसके स्तुतिपरक प्रयोग को रखता है, जबकि मूल अर्थ पादटिप्पणी में दिया गया है।
- source_word: εὐλογημένος ὁ ἐρχόμενος
  choice: धन्य है वह जो आता है
  rationale: यह भजन 118:26 की प्रतिध्वनि को बनाए रखते हुए substantival participle का सहज आधुनिक हिन्दी रूप है।
- source_word: ἐν ὀνόματι κυρίου
  choice: प्रभु के नाम से
  rationale: यह मानक बाइबलीय अभिव्यक्ति है और यूनानी κυρίου को औपचारिक रूप से सुरक्षित रखती है।
- source_word: καὶ ὁ βασιλεὺς τοῦ Ἰσραήλ
  choice: इस्राएल का राजा
  rationale: यह राजकीय उपाधि को स्पष्ट और उत्कर्षपूर्ण रूप में रखता है। पूर्ववर्ती καί का संबंध ‘और’ भी समझा जा सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: भजन के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: प्रस्तुत यूनानी पाठ में κυρίου है, इसलिए मुख्य पाठ में ‘प्रभु’ मूल साक्ष्य का सीधा प्रतिनिधित्व करता है। भजन 118 की इब्रानी पृष्ठभूमि के कारण दिव्य नाम का रूप देना संभव है, पर वह यूनानी पाठ से अधिक विशिष्ट होगा।
- issue: भीड़ के जयघोष का राजकीय-मसीही बल
  choice: ‘इस्राएल का राजा’ उपाधि को बिना विस्तार या नरमी के रखना
  alternative: इस्राएल के राजा भी
  rationale: पद यीशु के लिए राजकीय उपाधि स्पष्टतः प्रस्तुत करता है। मुख्य पाठ उसे यथावत रखता है और καί के संयोजक अथवा उत्कर्षसूचक संबंध को पादटिप्पणी में खुला छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘होशाना’ पारंपरिक लिप्यंतरण के रूप में रखा गया है; निरंतर पुकार को ‘पुकारते जा रहे थे’ से व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
