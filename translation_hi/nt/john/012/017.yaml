base_translation:
  language: en
  yaml_path: translation/nt/john/012/017.yaml
  text: So the crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead was bearing witness[a].
translation:
  language: hi
  text: इसलिए, जो भीड़ उसके साथ थी जब उसने लाज़र को कब्र से बाहर बुलाया और उसे मरे हुओं में से जिलाया, वह गवाही दे रही थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘साक्ष्य दे रही थी’; यूनानी क्रिया का अर्थ गवाही देना या साक्ष्य देना हो सकता है, और यह यूहन्ना में बार-बार आने वाला एक प्रमुख विषय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρει
  choice: गवाही दे रही थी
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली क्रिया का संकेत देता है। ‘गवाही दे रही थी’ यूहन्ना में μαρτυρέω के प्रमुख साक्ष्य-विषय को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक और तार्किक संबंध दिखाता है; ‘इसलिए’ आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: ὁ ὄχλος ὁ ὢν μετ’ αὐτοῦ
  choice: जो भीड़ उसके साथ थी
  rationale: संज्ञीकृत कृदन्त उस विशिष्ट भीड़ की पहचान कराता है जो उस घटना के समय यीशु के साथ थी।
- source_word: ἐφώνησεν
  choice: उसने ... बुलाया
  rationale: φωνέω यहाँ लाज़र को पुकारने के अर्थ में है; ‘बुलाया’ स्पष्ट है और मूल से अधिक जोर नहीं जोड़ता।
- source_word: ἐκ τοῦ μνημείου
  choice: कब्र से बाहर
  rationale: μνημεῖον यहाँ दफनाने की जगह है और ἐκ बाहर की ओर गति व्यक्त करता है।
- source_word: ἤγειρεν αὐτὸν ἐκ νεκρῶν
  choice: उसे मरे हुओं में से जिलाया
  rationale: ἐγείρω पुनर्जीवन के संदर्भ में उठाने या जिलाने को व्यक्त करता है। हिन्दी में ‘जिलाया’ चमत्कार के दावे को स्पष्ट रखते हुए स्वाभाविक है, और ‘मरे हुओं में से’ ἐκ νεκρῶν की सामूहिक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: लाज़र के पुनर्जीवन का कथन
  choice: उसे मरे हुओं में से जिलाया
  alternative: उसे मरे हुओं में से उठाया
  rationale: मूल पाठ स्पष्ट रूप से बताता है कि यीशु ने लाज़र को मृतकों में से उठाया। ‘जिलाया’ आधुनिक हिन्दी में आशय स्पष्ट करता है, बिना चमत्कार को हल्का करने या अतिरिक्त धर्मसैद्धान्तिक व्याख्या जोड़ने के।
