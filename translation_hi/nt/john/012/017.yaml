  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में स्त्रीलिंग एकवचन क्रिया ‘दे रही थी’ का संबंध ‘भीड़’ से है। ‘लाज़र’ आधुनिक हिन्दी में प्रचलित बाइबलीय नाम-रूप है।
