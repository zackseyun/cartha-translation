base_translation:
  language: en
  yaml_path: translation/nt/john/012/020.yaml
  text: There were some Greeks among those going up to worship at the feast[a].
translation:
  language: hi
  text: पर्व[a] में आराधना करने के लिए ऊपर जा रहे लोगों में कुछ यूनानी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यूनानी’ का अर्थ ‘गैर-यहूदी’ भी समझा गया है; पर पाठ उनकी धार्मिक या जातीय स्थिति को और स्पष्ट नहीं करता।
    reason: ‘यूनानी’ की पहचान के विषय में व्याख्यात्मक अनिश्चितता को बनाए रखते हुए मूल पद का सीधा अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: Ἦσαν δὲ
  choice: भी थे
  rationale: ἦσαν अस्तित्व बताता है और δέ प्रसंग में हल्का जोड़ या बदलाव सूचित करता है। हिन्दी में ‘भी थे’ पूर्ववर्ती प्रसंग से स्वाभाविक संबंध रखता है, बिना कोई स्पष्ट कालवाचक शब्द जोड़े।
- source_word: Ἕλληνές τινες
  choice: कुछ यूनानी
  rationale: Ἕλληνες का सीधा जातीय-सांस्कृतिक अर्थ ‘यूनानी’ है और τινες अनिश्चित संख्या बताता है, इसलिए ‘कुछ’ उपयुक्त है। इसे सामान्यीकृत करके ‘गैर-यहूदी’ नहीं किया गया।
- source_word: ἐκ τῶν ἀναβαινόντων
  choice: ऊपर जा रहे लोगों में
  rationale: ἐκ यहाँ उस बड़े समूह में सम्मिलित होने का भाव देता है। ‘ऊपर जा रहे’ यरूशलेम की तीर्थयात्रा के पारंपरिक दिशाबोध को सुरक्षित रखता है, पर गंतव्य को पाठ में जोड़े बिना।
- source_word: ἵνα προσκυνήσωσιν
  choice: आराधना करने
  rationale: ἵνα और संभावनार्थक क्रिया उद्देश्य व्यक्त करते हैं। यहाँ προσκυνέω धार्मिक आराधना के अर्थ में है; केवल शारीरिक दंडवत का अर्थ अपेक्षित नहीं।
- source_word: ἐν τῇ ἑορτῇ
  choice: पर्व में
  rationale: ἑορτή यहाँ यहूदी धार्मिक पर्व का अवसर है। ‘पर्व में’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: Ἕλληνες की पहचान
  choice: ‘यूनानी’ जातीय-सांस्कृतिक पद के रूप में रखा गया है।
  alternative: ‘गैर-यहूदी’
  rationale: पाठ उन्हें यूनानी कहता है, पर यह स्पष्ट नहीं करता कि वे यूनानी-भाषी यहूदी, यहूदी मत अपनाने वाले, परमेश्वर का भय मानने वाले गैर-यहूदी, या अन्य यूनानी थे। अनुवाद इस अनिश्चितता को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य विन्यास सरल और गरिमापूर्ण रखा गया है। ‘ऊपर जा रहे’ तीर्थयात्रा की स्रोत-पाठीय अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
