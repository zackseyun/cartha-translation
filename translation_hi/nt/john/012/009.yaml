source:
  edition: SBLGNT
  text: Ἔγνω ⸀οὖν ὄχλος πολὺς ἐκ τῶν Ἰουδαίων ὅτι ἐκεῖ ἐστιν, καὶ ἦλθον οὐ διὰ τὸν Ἰησοῦν μόνον, ἀλλ’ ἵνα καὶ τὸν Λάζαρον ἴδωσιν ὃν ἤγειρεν ἐκ νεκρῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/009.yaml
  text: So a large crowd of the Jews learned that he was there[a], and they came not only because of Jesus, but also so that they might see Lazarus, whom he had raised from the dead.
translation:
  language: hi
  text: इसलिए यहूदियों में से[a] एक बड़ी भीड़ को पता चला कि वह वहाँ है। वे केवल यीशु के कारण ही नहीं आए, बल्कि इसलिए भी कि लाज़र को देखें, जिसे उसने मरे हुओं में से जिलाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया-निवासियों में से।” यूनानी शब्द सामान्य रूप से यहूदी लोगों को, और यूहन्ना के कुछ प्रसंगों में विशेष रूप से यहूदिया-निवासियों को भी सूचित कर सकता है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: Ἔγνω
  choice: पता चला
  rationale: यहाँ क्रिया का भूतकालीन रूप नई सूचना मिलने या जान लेने को व्यक्त करता है; ‘पता चला’ आधुनिक हिन्दी में इस कथात्मक भाव को स्वाभाविक रूप से रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक परिणाम या संबंध दिखाता है; ‘इसलिए’ इसके संयोजक बल को स्पष्ट रखता है।
- source_word: ὄχλος πολὺς
  choice: एक बड़ी भीड़
  rationale: यह पद एक बड़ी जनसमूह-संख्या को सूचित करता है और यूनानी के सामूहिक एकवचन को बनाए रखता है।
- source_word: ἐκ τῶν Ἰουδαίων
  choice: यहूदियों में से
  rationale: ἐκ का ‘में से’ भाव स्पष्ट रहता है और भीड़ को व्यापक यहूदी समुदाय के भीतर के एक समूह के रूप में प्रस्तुत करता है।
- source_word: ὅτι ἐκεῖ ἐστιν
  choice: कि वह वहाँ है
  rationale: यूनानी में वर्तमानकाल ‘है’ है; हिन्दी में यह स्वाभाविक लगता है और मूल काल को अनावश्यक रूप से भूतकाल में नहीं बदलता। संदर्भ से ‘वह’ यीशु है।
- source_word: ἦλθον
  choice: वे ... आए
  rationale: दृश्य के कथात्मक दृष्टिकोण से ‘आए’ उपयुक्त और स्वाभाविक गति-सूचक क्रिया है।
- source_word: οὐ διὰ τὸν Ἰησοῦν μόνον
  choice: केवल यीशु के कारण ही नहीं
  rationale: διά के साथ कर्मकारक यहाँ कारण या प्रेरणा व्यक्त करता है; यह रूप हिन्दी में कारण और ‘न केवल’ की तुलना दोनों को स्पष्ट करता है।
- source_word: ἀλλ’ ἵνα καὶ
  choice: बल्कि इसलिए भी कि
  rationale: यह विरोध के साथ उद्देश्य बताता है; चुना गया वाक्यांश दोनों अर्थगत तत्वों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἴδωσιν
  choice: देखें
  rationale: ἵνα के बाद संभावनार्थक क्रिया उद्देश्य व्यक्त करती है; हिन्दी का ‘कि ... देखें’ यही प्रयोजन स्वाभाविक ढंग से बताता है।
- source_word: Λάζαρον
  choice: लाज़र
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ὃν ἤγειρεν ἐκ νεκρῶν
  choice: जिसे उसने मरे हुओं में से जिलाया था
  rationale: यह लाज़र को जीवन में लौटाने की पूर्व घटना बताता है; ‘था’ उसके भीड़ के आने से पहले घटने को स्पष्ट करता है और ‘मरे हुओं में से’ बहुवचन ἐκ νεκρῶν को बनाए रखता है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαίων का अर्थ
  choice: यहूदियों में से
  alternative: यहूदिया-निवासियों में से
  rationale: यहाँ पद भीड़ को व्यापक यहूदी जनसमुदाय के भीतर से आए समूह के रूप में बता सकता है, जबकि यूहन्ना में यही शब्द कुछ प्रसंगों में अधिक भौगोलिक अर्थ ‘यहूदिया-निवासी’ भी रखता है। मुख्य पाठ सहज जातीय-धार्मिक अर्थ रखता है और पादटिप्पणी वास्तविक संदर्भगत अस्पष्टता सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पता चला’, ‘के कारण’ और ‘इसलिए भी कि ... देखें’ सामान्य पाठकों के लिए स्पष्ट हैं। मूल यूनानी का वर्तमानकाल ‘वह वहाँ है’ तथा Ἰουδαίων की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
