source:
  edition: SBLGNT
  text: εἶπεν δὲ τοῦτο οὐχ ὅτι περὶ τῶν πτωχῶν ἔμελεν αὐτῷ, ἀλλ’ ὅτι κλέπτης ἦν καὶ τὸ γλωσσόκομον ⸀ἔχων τὰ βαλλόμενα ἐβάσταζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/006.yaml
  text: He said this not because he cared about the poor[a], but because he was a thief, and having the money box[b], he used to take what was put into it.
translation:
  language: hi
  text: उसने यह बात इसलिए नहीं कही कि उसे गरीबों की चिंता थी, बल्कि इसलिए कि वह चोर था। वह धन-पेटी[a] अपने पास रखता था और उसमें जो कुछ डाला जाता था, उसे ले लिया करता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन की थैली।” यूनानी शब्द धन रखने के किसी पात्र—पेटी या थैली—के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ले जाया करता था”; संदर्भ के अनुसार अधिक स्पष्ट रूप से, “चुरा लिया करता था।” इस क्रिया का सामान्य अर्थ “उठाना” या “ले जाना” हो सकता है, पर यहाँ “वह चोर था” अनुचित रूप से अपने लिए लेने का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶπεν δὲ τοῦτο
  choice: उसने यह बात ... कही
  rationale: δέ को अलग भारी विरोधसूचक शब्द से व्यक्त नहीं किया गया, क्योंकि यहाँ उसका संबंधसूचक बल हल्का है; हिंदी वाक्य का प्रवाह इसे स्वाभाविक रूप से वहन करता है।
- source_word: οὐχ ὅτι ... ἀλλ’ ὅτι
  choice: इसलिए नहीं ... बल्कि इसलिए कि
  rationale: यह रचना पहले कथित उद्देश्य का निषेध और फिर वास्तविक कारण प्रस्तुत करती है; आधुनिक हिंदी में यह जोड़ी स्पष्ट और स्वाभाविक है।
- source_word: περὶ τῶν πτωχῶν ἔμελεν αὐτῷ
  choice: उसे गरीबों की चिंता थी
  rationale: μέλει के साथ περί संबंधी चिंता या परवाह व्यक्त करता है। यह हिंदी प्रयोग अर्थ को सीधे और सहज ढंग से देता है।
- source_word: κλέπτης
  choice: चोर
  rationale: κλέπτης गुप्त रूप से चोरी करनेवाले व्यक्ति को दर्शाता है; ‘लुटेरा’ इस प्रसंग में गलत बल देता।
- source_word: τὸ γλωσσόκομον
  choice: धन-पेटी
  rationale: यह शब्द यहाँ सामूहिक धन रखने के पात्र को दर्शाता है। ‘धन-पेटी’ स्पष्ट है और पात्र की मूल धारणा बनाए रखता है; ‘धन की थैली’ भी संभव है।
- source_word: ἔχων
  choice: उसके पास रहती थी
  rationale: वर्तमान कृदंत यह बताता है कि वह धन-पेटी उसके अधिकार या देखरेख में थी। अपूर्णकालीन संदर्भ के अनुरूप ‘रहती थी’ नियमित व्यवस्था को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τὰ βαλλόμενα
  choice: उसमें जो कुछ डाला जाता था
  rationale: निष्क्रिय कृदंत पेटी में रखी जानेवाली वस्तु या धन को दर्शाता है। गंतव्य को ‘उसमें’ से स्पष्ट करना हिंदी में आवश्यक और संदर्भसंगत है।
- source_word: ἐβάσταζεν
  choice: निकाल लिया करता था
  rationale: βαστάζω सामान्यतः उठाने या ले जाने का अर्थ दे सकता है, पर ‘वह चोर था’ के तत्काल संदर्भ में यहाँ अपने लिए निकाल लेने का आशय प्रबल है। ‘लिया करता था’ अपूर्णकाल की बारंबारता को व्यक्त करता है।
theological_decisions:
- issue: ἐβάσταζεν का अर्थ और यहूदा द्वारा धन की हेराफेरी
  choice: संदर्भानुसार बार-बार अनुचित रूप से लेने के अर्थ में ‘निकाल लिया करता था’
  alternative: ‘जो कुछ उसमें डाला जाता था, उसे वह संभालता/ढोता था’ या अधिक स्पष्ट रूप से ‘चुरा लिया करता था’
  rationale: क्रिया का व्यापक शब्दार्थ ‘उठाना/ले जाना’ हो सकता है, किंतु लेखक का उसे ‘चोर’ कहना केवल पेटी संभालने की तटस्थ व्याख्या के विरुद्ध है। मुख्य पाठ संदर्भित चोरी को स्पष्ट करता है, फिर भी सीधे ‘चुराता था’ कहकर क्रिया के शब्दार्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबे यूनानी वाक्य को हिंदी में दो वाक्यों में बाँटा गया है, पर कारण-विरोध और यहूदा की निरंतर हेराफेरी का संबंध सुरक्षित है।
