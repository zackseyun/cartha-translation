lexical_decisions:
- source_word: Τῇ ἐπαύριον
  choice: अगले दिन
  rationale: कालसूचक पद का यह स्वाभाविक आधुनिक हिन्दी रूप है और कथा का क्रम स्पष्ट रखता है।
- source_word: ὁ ὄχλος πολὺς
  choice: बड़ा जनसमूह
  rationale: ὄχλος लोगों की भीड़ या जनसमूह को और πολὺς उसके बड़े आकार को व्यक्त करता है; यह रूप गरिमापूर्ण और सहज है।
- source_word: ὁ ἐλθὼν εἰς τὴν ἑορτήν
  choice: पर्व में आया हुआ
  rationale: आर्टिक्युलर कृदन्त जनसमूह को विशेषित करता है और उसका आना कथित क्षण से पहले हुआ था; हिन्दी में यह संबंध स्वाभाविक रूप से बना रहता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: बहुवचन कृदन्त सामूहिक संज्ञा के भीतर के लोगों की क्रिया बताता है; ‘सुनकर’ उसका पूर्वकालिक/परिस्थितिजन्य संबंध संक्षेप में व्यक्त करता है।
- source_word: ἑορτήν
  choice: पर्व
  rationale: ἑορτή धार्मिक उत्सव अथवा पर्व को दर्शाता है; यूहन्ना के यहूदी पर्व-संदर्भ में ‘पर्व’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὅτι ἔρχεται ὁ Ἰησοῦς
  choice: कि यीशु ... आ रहे हैं
  rationale: मूल का ऐतिहासिक वर्तमान सुरक्षित रखा गया है; आदरसूचक बहुवचन हिन्दी में यीशु के लिए स्वाभाविक मानक प्रयोग है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: गति-सूचक ‘आ रहे हैं’ के साथ गंतव्य बिना परसर्ग के स्वाभाविक हिन्दी में व्यक्त होता है।
