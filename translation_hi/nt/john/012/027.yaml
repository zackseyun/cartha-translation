  text: Νῦν ἡ ψυχή μου τετάρακται, καὶ τί εἴπω; πάτερ, σῶσόν με ἐκ τῆς ὥρας ταύτης. ἀλλὰ διὰ τοῦτο ἦλθον εἰς τὴν ὥραν ταύτην.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/027.yaml
  text: Now my soul is troubled[a], and what should I say? Father, save me from this hour. But for this reason I came to this hour.
translation:
  language: hi
  text: अब मेरा मन व्याकुल है,[a] और मैं क्या कहूँ? ‘पिता, मुझे इस घड़ी से बचा।’ परन्तु इसी कारण मैं इस घड़ी तक आया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या इस प्रकार पढ़ा जा सकता है: “और मैं क्या कहूँ—‘पिता, मुझे इस घड़ी से बचा’?” यूनानी वाक्य को सीधी विनती के बजाय अलंकारिक प्रश्न के रूप में भी समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: अब
  rationale: यह वर्तमान क्षण में यीशु की व्याकुलता की तात्कालिकता व्यक्त करता है।
- source_word: ἡ ψυχή μου
  choice: मेरा मन
  rationale: यहाँ ψυχή यीशु के भीतर के व्यक्ति या अंतर्मन को सूचित करता है। आधुनिक हिन्दी में ‘मेरा मन व्याकुल है’ स्वाभाविक है और इसे केवल जैविक ‘प्राण’ या पृथक दार्शनिक सत्ता तक सीमित नहीं करता।
- source_word: τετάρακται
  choice: व्याकुल है
  rationale: पूर्णकालीन रूप किसी विक्षोभ से उत्पन्न वर्तमान अवस्था बताता है; ‘व्याकुल है’ भावनात्मक और आंतरिक अशांति को सहज हिन्दी में व्यक्त करता है।
- source_word: τί εἴπω
  choice: मैं क्या कहूँ?
  rationale: विचारात्मक संभावनार्थक क्रिया आत्ममंथन या प्रश्न का भाव रखती है; हिन्दी संभावनार्थक ‘कहूँ’ इसे ठीक प्रकार व्यक्त करता है।
- source_word: πάτερ
  choice: पिता
  rationale: परमेश्वर के लिए प्रत्यक्ष सम्बोधन को सरल और गरिमापूर्ण रूप में रखता है।
- source_word: σῶσόν με ἐκ τῆς ὥρας ταύτης
  choice: मुझे इस घड़ी से बचा
  rationale: आज्ञार्थक σῶσόν और ἐκ के छुटकारे के भाव को निकटता से रखता है; ‘घड़ी’ यूहन्ना के निर्णायक नियुक्त समय वाले रूपक को सुरक्षित रखती है।
- source_word: ὥρα
  choice: घड़ी
  rationale: यूहन्ना में यह यीशु के दुःख, मृत्यु और महिमा के नियुक्त निर्णायक समय का भार लिए है; ‘घड़ी’ उस आवर्ती साहित्यिक-धर्मवैचारिक शब्द को बनाए रखती है।
- source_word: ἀλλὰ διὰ τοῦτο
  choice: परन्तु इसी कारण
  rationale: ἀλλά का विरोध और διὰ τοῦτο का कारण/प्रयोजन दोनों सुरक्षित रहते हैं, बिना केवल एक अर्थ को अत्यधिक निश्चित किए।
- source_word: ἦλθον εἰς τὴν ὥραν ταύτην
  choice: मैं इस घड़ी तक पहुँचा हूँ
  rationale: शाब्दिक ‘इस घड़ी में आया’ हिन्दी में अस्वाभाविक है। ‘तक पहुँचा हूँ’ εἰς के लक्ष्य की ओर आगमन और वर्तमान निर्णायक बिंदु पर पहुँचने का भाव देता है; ‘के लिए आया’ कहकर प्रयोजन को व्याकरण से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: क्या ‘पिता, मुझे इस घड़ी से बचा’ सीधी प्रार्थना है या ‘मैं क्या कहूँ?’ से जुड़ा हुआ एक अलंकारिक प्रश्न?
  choice: 'मुख्य पाठ में इसे सीधी विनती के रूप में रखा गया है: ‘पिता, मुझे इस घड़ी से बचा।’'
  alternative: ‘और मैं क्या कहूँ—“पिता, मुझे इस घड़ी से बचा”?’ अर्थात ऐसा अनुरोध करने की संभावना को प्रश्न के रूप में रखना।
  rationale: प्राचीनतम पांडुलिपियों का विराम-चिह्न मूल नहीं है, इसलिए यूनानी दोनों प्रकार से पढ़ी जा सकती है। SBLGNT की विराम-व्यवस्था सीधी विनती का समर्थन करती है, जिसके बाद विरोधसूचक कथन आता है। मुख्य पाठ यीशु की वास्तविक व्याकुलता और अपने नियुक्त कार्य को स्वीकार करने के बीच का तनाव बनाए रखता है; पादटिप्पणी दूसरी सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘मन’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘घड़ी’ यूहन्ना के विशिष्ट रूपक को सुरक्षित रखती है। ‘परन्तु’ औपचारिक किंतु प्रचलित विरोधसूचक संयोजक है।
