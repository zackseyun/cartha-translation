id: JHN.12.38
reference: John 12:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα ὁ λόγος Ἠσαΐου τοῦ προφήτου πληρωθῇ ὃν εἶπεν· Κύριε, τίς ἐπίστευσεν τῇ ἀκοῇ ἡμῶν; καὶ ὁ βραχίων κυρίου τίνι ἀπεκαλύφθη;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/038.yaml
  text: 'so that the word of Isaiah the prophet might be fulfilled[a], which he said: “Lord, who has believed our report? And to whom has the arm of the Lord been revealed?”'
translation:
  language: hi
  text: 'ताकि भविष्यद्वक्ता यशायाह का वह वचन पूरा हो[a], जो उसने कहा था: “हे प्रभु, किसने हमारे संदेश पर विश्वास किया? और प्रभु की भुजा किस पर प्रकट हुई?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी सुनाई हुई बात पर” या “जो हमने सुना, उस पर।”
    reason: ἀκοή का अर्थ सुनी या सुनाई गई बात, संदेश, अथवा सुनने की धारणा हो सकता है।
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पूर्ववर्ती अविश्वास को वचन की पूर्ति से जोड़ता है और प्रयोजन तथा परिणाम के बीच यूनानी की संभावित अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ὁ λόγος Ἠσαΐου τοῦ προφήτου ... ὃν εἶπεν
  choice: भविष्यद्वक्ता यशायाह का कहा हुआ यह वचन
  rationale: यह हिन्दी में स्वाभाविक रहते हुए λόγος को ‘वचन’ से व्यक्त करता और ὃν εἶπεν के ‘जो उसने कहा’ भाव को समाहित करता है।
- source_word: πληρωθῇ
  choice: पूरा हो
  rationale: यह उद्धृत वचन की पूर्ति का यूहन्नाई भाव स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को हिन्दी के स्वाभाविक सम्बोधन ‘हे’ सहित व्यक्त किया गया है।
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: हमारे संदेश पर
  rationale: यहाँ ἀκοή सुनी या सुनाई गई बात, अर्थात प्रचारित संदेश, को दर्शा सकता है। ‘संदेश’ आधुनिक हिन्दी में ‘रिपोर्ट’ की तुलना में अधिक स्वाभाविक है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: ὁ βραχίων κυρίου
  choice: प्रभु की भुजा
  rationale: परमेश्वर की सामर्थ्य और कार्य का बाइबलीय रूपक व्याख्या करके हटाने के बजाय ज्यों का त्यों रखा गया है।
- source_word: ἀπεκαλύφθη
  choice: प्रकट हुई
  rationale: यूनानी के निष्क्रिय भाव को सुरक्षित रखते हुए यह हिन्दी में उद्धरण के समानांतर प्रश्न के लिए स्वाभाविक है।
theological_decisions:
- issue: ἵνα के द्वारा व्यक्त पूर्ति में ईश्वरीय प्रयोजन अथवा परिणाम
  choice: ‘ताकि ... पूरा हो’ रखा गया है।
  alternative: ‘जिसके परिणामस्वरूप ... पूरा हुआ’ अथवा ‘इसलिए कि ... पूरा हो’
  rationale: मूल भाषा प्रयोजन और परिणाम दोनों की छाया ग्रहण कर सकती है। चुनी हुई अभिव्यक्ति इस तनाव को किसी एक नियतिवादी व्याख्या में नहीं बाँधती।
- issue: ἀκοή का अर्थ
  choice: मुख्य पाठ में ‘संदेश’
  alternative: ‘हमारी सुनाई हुई बात’ या ‘जो हमने सुना’
  rationale: शब्द सुनने की क्रिया, सुनी हुई बात, या घोषित संदेश का अर्थ दे सकता है। सन्दर्भ में संदेश स्वाभाविक है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- issue: ‘प्रभु की भुजा’ का रूपक
  choice: रूपक को अक्षुण्ण रखा गया है।
  alternative: ‘प्रभु की सामर्थ्य’
  rationale: ‘भुजा’ शास्त्रीय उद्धरण में परमेश्वर की सामर्थ्यपूर्ण कार्रवाई का सजीव रूपक है; इसे केवल उसके अर्थ से बदलना मूल की काव्यात्मक और धर्मवैचारिक बनावट को घटा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘वचन’, ‘प्रभु’ और ‘भुजा’ जैसे शास्त्रीय शब्द सन्दर्भगत रूप से परिचित और अर्थपूर्ण हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है।
