  text: So they made a dinner for him there[a], and Martha was serving, but Lazarus was one of those reclining at the table with him.
translation:
  language: hi
  text: इसलिए उन्होंने वहाँ उसके लिए भोजन तैयार किया। मार्था परोसने में लगी थी, जबकि लाज़र उन लोगों में से एक था जो उसके साथ भोजन करने के लिए टेक लगाकर बैठे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उस समय औपचारिक भोजन में लोग प्रायः टेक लगाकर या अधलेटे होकर खाते थे।
    reason: cultural_note
lexical_decisions:
- source_word: ἐποίησαν οὖν αὐτῷ δεῖπνον
  choice: इसलिए उन्होंने वहाँ उसके लिए भोजन तैयार किया
  rationale: οὖν को कथानक के निष्कर्षात्मक संबंध के लिए ‘इसलिए’ और ποιέω के साथ δεῖπνον को स्वाभाविक हिन्दी में ‘भोजन तैयार किया’ कहा गया है। αὐτῷ के सर्वनाम को मूल के अनुरूप ‘उसके लिए’ रखा गया है; संदर्भ में यह यीशु है।
- source_word: διηκόνει
  choice: परोसने में लगी थी
  rationale: अपूर्ण भूतकाल चल रही क्रिया को दिखाता है। भोजन के प्रसंग में διακονέω का अर्थ मेज़ पर सेवा करना या परोसना है; धार्मिक अर्थ वाला ‘सेवा-टहल’ यहाँ अनावश्यक है।
- source_word: ὁ δὲ Λάζαρος
  choice: जबकि लाज़र
  rationale: δέ यहाँ मार्था की सक्रिय सेवा और लाज़र के भोजन में सम्मिलित होने के बीच हल्का अंतर दिखाता है; ‘जबकि’ इसे बिना तीखा विरोध बनाए व्यक्त करता है।
- source_word: εἷς ἦν ἐκ τῶν ἀνακειμένων
  choice: उन लोगों में से एक था जो … टेक लगाकर बैठे थे
  rationale: εἷς ἦν ἐκ का समूह-सदस्यता वाला अर्थ स्पष्ट रखा गया है। ἀνάκειμαι भोजन के समय लेटकर या टेक लगाकर बैठने की प्राचीन रीति दर्शाता है; ‘टेक लगाकर बैठे’ आधुनिक हिन्दी में समझने योग्य रहते हुए उस सांस्कृतिक मुद्रा को बनाए रखता है।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: मूल का साधारण सहचर्य और सर्वनाम सुरक्षित रखा गया है; संदर्भ में सर्वनाम यीशु की ओर संकेत करता है।
