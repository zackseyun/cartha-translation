source:
  edition: SBLGNT
  text: ὁ φιλῶν τὴν ψυχὴν αὐτοῦ ⸀ἀπολλύει αὐτήν, καὶ ὁ μισῶν τὴν ψυχὴν αὐτοῦ ἐν τῷ κόσμῳ τούτῳ εἰς ζωὴν αἰώνιον φυλάξει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/025.yaml
  text: The one who loves his life loses it[b][a], and the one who hates his life in this world will keep it for eternal life.
translation:
  language: hi
  text: जो अपने जीवन[a] से प्रेम करता है, वह उसे खो देता है; और जो इस संसार में अपने जीवन से घृणा करता है[b], वह उसे अनन्त जीवन के लिए सुरक्षित रखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्राण’ अथवा ‘स्वयं’; यूनानी ψυχή का अर्थ प्रसंग के अनुसार ‘जीवन’, ‘स्वयं’ या ‘प्राण/आत्मा’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने जीवन से घृणा करना’ जानबूझकर प्रयुक्त विरोधाभासी भाषा है। इसका अर्थ इस संसार में अपने जीवन से ऐसे चिपके रहने को ठुकराना है मानो वही सर्वोच्च हो; यह आत्म-घृणा की शिक्षा नहीं देता। ऐसी ही भाषा के लिए लूका 14:26 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: ὁ φιλῶν
  choice: जो … से प्रेम करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त के सामान्य और निरन्तर भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपने जीवन
  rationale: इस प्रसंग में ψυχή व्यक्ति के वर्तमान जीवन अथवा स्वयं को सूचित करता है, जिसे खोया या सुरक्षित रखा जा सकता है; ‘जीवन’ यहाँ ‘प्राण’ या ‘आत्मा’ से अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀπολλύει αὐτήν
  choice: उसे खो देता है
  rationale: वर्तमानकालीन क्रिया प्रेम के फलस्वरूप होने वाली हानि बताती है और आगे के ‘सुरक्षित रखेगा’ के साथ स्पष्ट विरोध बनाती है।
- source_word: ὁ μισῶν
  choice: जो … से घृणा करता है
  rationale: μισέω की जानबूझकर रखी गई कठोर और विरोधाभासी भाषा को ‘कम प्रेम करता है’ जैसे नरम अर्थ में बदले बिना सुरक्षित रखता है।
- source_word: ἐν τῷ κόσμῳ τούτῳ
  choice: इस संसार में
  rationale: वर्तमान संसार में जीवन से लगाव और अनन्त जीवन के बीच यूहन्नाई विरोध को सहज हिन्दी में व्यक्त करता है।
- source_word: φυλάξει αὐτήν
  choice: उसे … सुरक्षित रखेगा
  rationale: भविष्यकाल और ‘रखने/बचाए रखने’ के भाव को स्पष्ट करता है तथा ‘खो देता है’ के साथ अर्थपूर्ण विरोध बनाए रखता है।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς के लक्ष्य अथवा परिणाम के भाव को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘अपने जीवन से घृणा करता है’ का अर्थ
  choice: कठोर विरोधाभासी अभिव्यक्ति को मुख्य पाठ में बनाए रखा गया है; यह वर्तमान संसार में अपने जीवन को सर्वोच्च मानकर उससे चिपके रहने का त्याग बताती है।
  alternative: ‘अपने जीवन से कम प्रेम करता है’ या ‘अपने जीवन की कम परवाह करता है’
  rationale: यूनानी पाठ में μισέω स्पष्ट रूप से ‘घृणा करना’ है। मुख्य पाठ में इसे नरम करना कथन के तनाव को समय से पहले सुलझा देगा; आवश्यक स्पष्टीकरण पादटिप्पणी में दिया गया है।
- issue: ψυχή का अर्थ
  choice: दोनों स्थानों पर ‘जीवन’
  alternative: ‘प्राण’, ‘स्वयं’ या ‘आत्मा’
  rationale: खोने और सुरक्षित रखने का निकट प्रसंग व्यक्ति के जीवन/स्व को सूचित करता है, न कि अनिवार्य रूप से शरीर से अलग किसी अभौतिक आत्मा को। शब्द की व्यापक अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘घृणा’ की तीव्रता मूल यूनानी के कथनात्मक तनाव को बनाए रखती है, जबकि पादटिप्पणी उसके आशय को स्पष्ट करती है।
