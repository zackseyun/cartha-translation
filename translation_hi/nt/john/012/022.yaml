lexical_decisions:
- source_word: ἔρχεται
  choice: आकर
  rationale: ऐतिहासिक वर्तमान की जीवंतता को अगले क्रिया-रूप ‘बताता है’ के साथ बनाए रखते हुए, हिन्दी में गति और उसके बाद होने वाली बातचीत का स्वाभाविक संबंध व्यक्त करता है।
- source_word: ὁ Φίλιππος
  choice: फ़िलिप्पुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में निकट लिप्यंतरण; यूनानी निश्चित उपपद का अलग अनुवाद आवश्यक नहीं है।
- source_word: λέγει
  choice: बताता है
  rationale: यहाँ किसी व्यक्ति को सूचना पहुँचाने का भाव है; ‘कहता है’ भी संभव है, पर ‘बताता है’ प्रसंग में अधिक स्वाभाविक है।
- source_word: τῷ Ἀνδρέᾳ
  choice: अन्द्रियास को
  rationale: व्यक्तिगत नाम का यूनानी-आधारित लिप्यंतरण और सम्प्रदान कारक के लिए स्वाभाविक हिन्दी ‘को’।
- source_word: ἔρχεται Ἀνδρέας καὶ Φίλιππος
  choice: फिर अन्द्रियास और फ़िलिप्पुस आकर
  rationale: बहुवचन कर्ता और गति को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘फिर’ घटनाक्रम को स्पष्ट करता है, बिना कोई कारणात्मक अर्थ जोड़े।
- source_word: λέγουσιν τῷ Ἰησοῦ
  choice: यीशु को बताते हैं
  rationale: बहुवचन क्रिया और सूचना देने का भाव स्पष्ट तथा सहज हिन्दी में व्यक्त होता है।
- source_word: καί
  choice: और / फिर
  rationale: नामों को जोड़ते समय ‘और’ रखा गया है; वाक्यखंडों के क्रम में हिन्दी की सहजता के लिए एक स्थान पर ‘फिर’ प्रयुक्त है, जो संदर्भगत अनुक्रम को व्यक्त करता है।
