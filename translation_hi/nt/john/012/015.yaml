  yaml_path: translation/nt/john/012/015.yaml
  text: Do not be afraid[a], daughter of Zion. Look, your King is coming[e][d][c][b], seated on a donkey’s colt.
translation:
  language: hi
  text: “मत डर, सिय्योन की बेटी![a] देख, तेरा राजा आ रहा है; वह गधे के बच्चे पर बैठा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सिय्योन की बेटी’ भविष्यद्वाणी की भाषा में सिय्योन अर्थात् यरूशलेम का मानवीकरण है।
    reason: cultural_note
  - marker: b
    text: 'यह जकर्याह 9:9 की प्रतिध्वनि है और यीशु को सिय्योन के प्रतिज्ञात राजा के रूप में प्रस्तुत करता है। शाब्दिक रूप: ‘एक गधे के बच्चे पर।’'
    reason: cross_reference_and_lexical_note
lexical_decisions:
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: μή के साथ वर्तमान आज्ञार्थक का निषेध यहाँ भय न करने की सीधी आज्ञा देता है। ‘मत डर’ आधुनिक, स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: θυγάτηρ Σιών
  choice: सिय्योन की बेटी
  rationale: सम्बोधन और सम्बन्धकारक को सीधे बनाए रखता है तथा भविष्यद्वाणी में सिय्योन/यरूशलेम के मानवीकरण को संरक्षित करता है।
- source_word: ἰδοὺ
  choice: देख
  rationale: ध्यान आकर्षित करने वाले अव्यय का सहज आधुनिक हिन्दी समतुल्य है; ‘देखो’ की तुलना में एकवचन सम्बोधन ‘बेटी’ से भी मेल खाता है।
- source_word: ὁ βασιλεύς σου
  choice: तेरा राजा
  rationale: निश्चित संज्ञा और एकवचन अधिकारवाचक सर्वनाम को स्वाभाविक हिन्दी में रखता है। देवनागरी में बड़े अक्षरों का भेद न होने से मसीही राजकीय सन्दर्भ शब्द और प्रसंग से व्यक्त होता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: वर्तमान काल की सजीव और प्रगतिशील क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθήμενος
  choice: बैठा है
  rationale: आने के ढंग को व्यक्त करने वाले वर्तमान कृदन्त का सीधा और सहज रूप है; ‘सवार’ मूल में स्पष्ट निहित अर्थ को कुछ अधिक व्याख्यायित करता।
- source_word: ἐπὶ πῶλον ὄνου
  choice: गधी के बच्चे पर
  rationale: πῶλος के छोटे पशु/बच्चे और ὄνος के गधे को दोनों बनाए रखता है। यूनानी सम्बन्धकारक का लिंग-रूप अपने आप निश्चित नहीं है, पर जकर्याह 9:9 की पृष्ठभूमि में हिन्दी का पारंपरिक और स्पष्ट ‘गधी के बच्चे’ उपयुक्त है।
theological_decisions:
- issue: जकर्याह 9:9 की मसीही-राजकीय प्रतिध्वनि
  choice: मुख्य पाठ में ‘सिय्योन की बेटी’ और ‘तेरा राजा’ को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: मुख्य पाठ में सिय्योन को यरूशलेम बताना या राजा को स्पष्टतः प्रतिज्ञात मसीह कहना
  rationale: यूहन्ना यीशु को भविष्यद्वाणी के राजकीय रूप में प्रस्तुत करता है, पर अनुवाद को मूल उद्धरण की भाषा बनाए रखनी चाहिए; सम्बन्ध को पादटिप्पणी में स्पष्ट किया जा सकता है।
- issue: ‘राजा’ का आदरसूचक या धर्मवैज्ञानिक चिह्नीकरण
  choice: सामान्य देवनागरी रूप ‘राजा’
  alternative: विशेष विराम-चिह्न या अन्य संपादकीय साधन से उपाधि पर बल देना
  rationale: यूनानी पाण्डुलिपियों का अक्षर-विन्यास धर्मवैज्ञानिक बड़े अक्षर का निर्णय नहीं करता और हिन्दी में अंग्रेज़ी जैसा capitalization नहीं है। राजकीय-मसीही बल प्रसंग से सुरक्षित रहता है।
- issue: ὄνου का लिंग और जकर्याह की पृष्ठभूमि
  choice: ‘गधी के बच्चे’
  alternative: ‘गधे के बच्चे’ या ‘एक जवान गधे पर’
  rationale: यूनानी रूप स्वयं नर/मादा का भेद निर्णायक रूप से नहीं बताता। उद्धरण की जकर्याह 9:9 वाली पृष्ठभूमि ‘गधी’ का समर्थन करती है, जबकि पादटिप्पणी शाब्दिक संरचना और सम्भव सामान्य अर्थ को पारदर्शी रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। एकवचन सम्बोधन के अनुरूप ‘मत डर’, ‘देख’ और ‘तेरा’ प्रयुक्त हैं। ‘सिय्योन’ स्थापित बाइबलीय नामरूप है; भविष्यद्वाणी का मानवीकरण मुख्य पाठ में सुरक्षित है और उसका अर्थ पादटिप्पणी में दिया गया है।
