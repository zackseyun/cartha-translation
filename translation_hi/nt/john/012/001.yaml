reference: John 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ οὖν Ἰησοῦς πρὸ ἓξ ἡμερῶν τοῦ πάσχα ἦλθεν εἰς Βηθανίαν, ὅπου ἦν ⸀Λάζαρος, ὃν ἤγειρεν ἐκ νεκρῶν ⸀Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/001.yaml
  text: So Jesus came to Bethany six days before the Passover[a], where Lazarus was, whom Jesus had raised from the dead.
translation:
  language: hi
  text: इसलिए यीशु फसह से छह दिन पहले बैतनियाह आए। वहाँ लाज़र था, जिसे यीशु ने मरे हुओं में से जिलाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से तर्कपूर्ण कथात्मक संबंध बनाए रखता है; यहाँ केवल कालक्रम बताने वाला ‘तब’ अपेक्षाकृत कमजोर होगा।
- source_word: πρὸ ἓξ ἡμερῶν τοῦ πάσχα
  choice: फसह से छह दिन पहले
  rationale: यूनानी कालवाचक वाक्यांश का स्वाभाविक और सटीक हिन्दी रूप; ‘फसह’ ज्ञात यहूदी पर्व को सूचित करता है।
- source_word: ἦλθεν εἰς Βηθανίαν
  choice: बैतनियाह आए
  rationale: ἔρχομαι का सामान्य कथात्मक अर्थ रखा गया है और स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: ὅπου ἦν Λάζαρος
  choice: वहाँ लाज़र था
  rationale: मूल के साधारण स्थानवाचक कथन को सुरक्षित रखा गया है; ‘रहता था’ या ‘ठहरा हुआ था’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ी गई।
- source_word: ἤγειρεν
  choice: जिलाया था
  rationale: मृत्यु के संदर्भ में ἐγείρω का स्वाभाविक हिन्दी अर्थ है; ‘था’ इस घटना को यीशु के आगमन से पहले घटित दिखाता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: ἐκ और बहुवचन νεκρῶν की ‘मृत लोगों के बीच से’ वाली संरचना को स्वाभाविक हिन्दी में स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: लाज़र के पुनर्जीवन में कर्ता की स्पष्ट पहचान
  choice: जिसे यीशु ने मरे हुओं में से जिलाया था
  alternative: जिसे उन्होंने मरे हुओं में से जिलाया था
  rationale: यूनानी पाठ संबंधवाचक उपवाक्य के अंत में Ἰησοῦς नाम को फिर स्पष्ट करता है। इसलिए सर्वनाम के बजाय ‘यीशु’ की पुनरावृत्ति स्रोत की अभिव्यक्ति और बल को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फसह’, ‘बैतनियाह’ और ‘लाज़र’ के प्रचलित बाइबलीय हिन्दी रूप लिए गए हैं। मूल यूनानी की ‘मरे हुओं में से’ अभिव्यक्ति मुख्य पाठ में ही स्वाभाविक होने के कारण अंग्रेज़ी परामर्श-पाठ की पाद-टिप्पणी आवश्यक नहीं रही।
