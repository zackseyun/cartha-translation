base_translation:
  language: en
  yaml_path: translation/nt/john/012/041.yaml
  text: Isaiah said these things because he saw his glory and spoke about him[a].
translation:
  language: hi
  text: यशायाह ने ये बातें इसलिए कहीं कि उसने उसकी महिमा देखी और उसके विषय में कहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “यशायाह ने ये बातें इसलिए कहीं कि उसने परमेश्वर की महिमा देखी और उसके विषय में कहा।” यूहन्ना के निकट सन्दर्भ में सर्वनाम सम्भवतः यीशु की ओर संकेत करते हैं, जबकि यशायाह की व्यापक पृष्ठभूमि में यह प्रभु की महिमा का दर्शन है (यशायाह 6:1)।
    reason: वैकल्पिक अर्थ और सर्वनामों के संकेत की वास्तविक सन्दर्भगत अस्पष्टता।
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक शब्द पीछे उद्धृत भविष्यवाणियों की ओर संकेत करता है; हिन्दी में “ये बातें” स्वाभाविक है।
- source_word: εἶπεν
  choice: कहीं
  rationale: λέγω के एओरिस्ट का सरल अर्थ “कहा” है; कर्ता और कर्म के अनुसार यहाँ स्त्रीलिंग बहुवचन “कहीं” प्रयुक्त हुआ है।
- source_word: Ἠσαΐας
  choice: यशायाह
  rationale: हिन्दी बाइबलीय परंपरा में भविष्यद्वक्ता के नाम का प्रचलित रूप।
- source_word: ὅτι
  choice: इसलिए...कि
  rationale: सन्दर्भ में ὅτι कारण बताता है; हिन्दी की स्वाभाविक कारणवाचक रचना मूल के “क्योंकि” अर्थ को व्यक्त करती है।
- source_word: εἶδεν
  choice: देखी
  rationale: ὁράω के एओरिस्ट का सीधा अनुवाद; हिन्दी में कर्म “महिमा” के अनुसार रूप रखा गया है।
- source_word: δόξαν
  choice: महिमा
  rationale: यूहन्ना और यशायाह के सन्दर्भ में δόξα का भारपूर्ण तथा स्थापित हिन्दी समतुल्य “महिमा” है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: मूल यूनानी में सर्वनाम का नामित व्यक्ति स्पष्ट नहीं किया गया; “उसकी” उसी वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: ἐλάλησεν
  choice: कहा
  rationale: λαλέω यहाँ उसके विषय में बोलने को व्यक्त करता है; “कहा” आधुनिक हिन्दी में स्वाभाविक है, यद्यपि पहले εἶπεν के साथ “कहीं” भी उसी धातु का रूप दिखाई देता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί + संबंधकारक का अर्थ “के विषय में/के बारे में” है; “उसके विषय में” गरिमापूर्ण और सहज है।
theological_decisions:
- issue: αὐτοῦ / αὐτοῦ सर्वनामों का संकेत
  choice: मुख्य पाठ में दोनों को “उसकी/उसके” रखा गया है; यूहन्ना के निकट सन्दर्भ में वे यीशु की ओर संकेत करते हैं।
  alternative: इन्हें स्पष्ट रूप से “परमेश्वर की महिमा” और “परमेश्वर के विषय में” अनूदित करना।
  rationale: यूहन्ना 12:37–41 का तर्क इन कथनों को यीशु पर लागू करता है, पर यूनानी पाठ केवल सर्वनाम देता है और यशायाह 6 की पृष्ठभूमि प्रभु की महिमा का दर्शन है। इसलिए मुख्य पाठ सर्वनाम की वास्तविक अस्पष्टता बचाता है और पादटिप्पणी दोनों स्तर स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। “उसकी/उसके” को मुख्य पाठ में रखकर यूनानी सर्वनामों की अस्पष्टता सुरक्षित की गई है; व्याख्यात्मक स्पष्टता पादटिप्पणी में दी गई है।
