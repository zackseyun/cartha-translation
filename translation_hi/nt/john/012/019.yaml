  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ οὖν Φαρισαῖοι εἶπαν πρὸς ἑαυτούς· Θεωρεῖτε ὅτι οὐκ ὠφελεῖτε οὐδέν· ἴδε ὁ ⸀κόσμος ὀπίσω αὐτοῦ ἀπῆλθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/019.yaml
  text: So the Pharisees said to one another[a], “You see that you are accomplishing nothing. Look—the world has gone after him.”
translation:
  language: hi
  text: इसलिए फरीसियों ने आपस में कहा, “तुम देख रहे हो कि तुम कुछ भी नहीं कर पा रहे हो। देखो, संसार[a] उसके पीछे चला गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर कोई उसके पीछे चला गया है।” यूनानी में “संसार” है; यहाँ संभवतः यह अलंकारिक अतिशयोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले दृश्य के परिणामस्वरूप फरीसियों की प्रतिक्रिया को जोड़ता है और यूनानी के निष्कर्षात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: यहाँ वाक्यांश का पारस्परिक अर्थ है—फरीसी अपने समूह में एक-दूसरे से बात कर रहे हैं।
- source_word: Θεωρεῖτε
  choice: तुम देख रहे हो
  rationale: वर्तमानकालीन बहुवचन रूप को कथन के रूप में रखा गया है; यह झुँझलाहट भरे इस स्वीकार को व्यक्त करता है कि परिणाम अब स्पष्ट है।
- source_word: οὐκ ὠφελεῖτε οὐδέν
  choice: तुम कुछ भी नहीं कर पा रहे हो
  rationale: दोहरा निषेध उनकी कार्रवाई की पूर्ण निष्फलता बताता है। यह अभिव्यक्ति आधुनिक हिन्दी में सहज है और प्रसंगगत अर्थ को स्पष्ट रखती है।
- source_word: ἴδε
  choice: देखो
  rationale: यह ध्यान खींचने वाला उद्गार है और कथन की अचानक, जोरदार धार को बनाए रखता है।
- source_word: κόσμος
  choice: संसार
  rationale: मूल शब्द को बनाए रखा गया है। प्रसंग में यह झुँझलाहट से कही गई अतिशयोक्ति है, पर मुख्य पाठ में इसे ‘हर कोई’ बनाकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: ὀπίσω αὐτοῦ
  choice: उसके पीछे
  rationale: यह किसी का अनुसरण करने की यूनानी छवि को बनाए रखता है और हिन्दी में ‘चला गया है’ के साथ स्वाभाविक है।
- source_word: ἀπῆλθεν
  choice: चला गया है
  rationale: पूर्ण वर्तमान फरीसियों की दृष्टि में अब सामने आए परिणाम पर बल देता है।
theological_decisions:
- issue: फरीसियों के कथन में κόσμος का दायरा
  choice: मुख्य पाठ में ‘संसार’ रखकर कथन की अतिशयोक्तिपूर्ण प्रकृति को टिप्पणी में स्पष्ट करना
  alternative: ‘हर कोई उसके पीछे चला गया है’ या ‘सारी भीड़ उसके पीछे चली गई है’
  rationale: फरीसी झुँझलाहट में अलंकारिक अतिशयोक्ति कर रहे हैं। ‘संसार’ मूल शब्दावली और यूहन्ना के व्यापक भाषिक प्रतिध्वनि को सुरक्षित रखता है, जबकि इसे सार्वभौमिक शिष्यत्व का शाब्दिक दावा नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम’ समूह के भीतर फरीसियों के परस्पर संबोधन को स्वाभाविक रूप से व्यक्त करता है; ‘देखो’ उनकी झुँझलाहट और जोर को बनाए रखता है।
