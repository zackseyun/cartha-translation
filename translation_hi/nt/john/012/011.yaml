  edition: SBLGNT
  text: ὅτι πολλοὶ δι’ αὐτὸν ὑπῆγον τῶν Ἰουδαίων καὶ ἐπίστευον εἰς τὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/011.yaml
  text: because many of the Jews were going away because of him and were believing in Jesus[a][b][c][d].
translation:
  language: hi
  text: क्योंकि उसके कारण बहुत-से यहूदी[a] अलग होते जा रहे थे[b] और यीशु पर विश्वास कर रहे थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदिया के बहुत-से निवासी।’ यूहन्ना में ‘यहूदी’ शब्द का आशय संदर्भ के अनुसार यहूदिया के निवासी या कभी-कभी यहूदी अगुए भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘दूर जा रहे थे’ अथवा ‘छोड़कर जा रहे थे।’ यूनानी क्रिया जारी रूप से अलग होने या चले जाने का भाव देती है; यहाँ संभवतः विरोधी अगुओं के पक्ष या प्रभाव से हटना अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: या ‘यीशु पर भरोसा रख रहे थे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद में लाज़र को मार डालने की योजना का कारण बताता है; हिन्दी में ‘क्योंकि’ कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δι’ αὐτὸν
  choice: उसके कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; संदर्भ में ‘उसके’ का संकेत लाज़र की ओर है।
- source_word: πολλοὶ … τῶν Ἰουδαίων
  choice: बहुत-से यहूदी
  rationale: यह यहूदियों के व्यापक समूह में से अनेक लोगों को सूचित करता है, सभी यहूदियों को नहीं। यह संक्षिप्त हिन्दी अभिव्यक्ति यूनानी के अंशात्मक भाव को स्वाभाविक रूप से रखती है।
- source_word: ὑπῆγον
  choice: अलग होते जा रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली क्रिया दिखाता है। ‘अलग होते जा रहे थे’ विरोधी अगुओं के प्रभाव या पक्ष से हटने का संदर्भगत भाव रखता है, पर इसे औपचारिक धर्मत्याग नहीं बनाता।
- source_word: ἐπίστευον εἰς τὸν Ἰησοῦν
  choice: यीशु पर विश्वास कर रहे थे
  rationale: यह अभिव्यक्ति यीशु की ओर निर्देशित व्यक्तिगत विश्वास को व्यक्त करती है। अपूर्ण भूतकाल की जारी क्रिया ‘कर रहे थे’ से बनी रहती है; पद में कही बात से आगे बढ़कर उद्धार या शिष्यत्व का दावा नहीं जोड़ा गया।
theological_decisions:
- issue: यूहन्ना में Ἰουδαίων का आशय
  choice: मुख्य पाठ में ‘यहूदी’, अर्थात यहूदी समुदाय में से बहुत-से लोग
  alternative: ‘यहूदिया के निवासी’ या, कुछ संदर्भों में, ‘यहूदी अगुए’
  rationale: यूहन्ना में इस शब्द का संदर्भानुसार भिन्न आशय हो सकता है। यहाँ ‘बहुत-से’ स्पष्ट करता है कि सभी यहूदियों पर सामूहिक आरोप नहीं लगाया गया है।
- issue: πιστεύω εἰς का धार्मिक बल
  choice: ‘यीशु पर विश्वास कर रहे थे’
  alternative: ‘यीशु पर भरोसा रख रहे थे’
  rationale: पद यीशु की ओर निर्देशित विश्वास बताता है, पर उसके सभी धार्मिक परिणामों को स्पष्ट नहीं करता; इसलिए उनसे अधिक मजबूत doctrinal निष्कर्ष नहीं जोड़ा गया।
- issue: ὑπῆγον में अलग होने का लक्ष्य
  choice: किससे अलग हो रहे थे, इसे मुख्य पाठ में अनिर्दिष्ट रखा गया
  alternative: ‘यहूदी अगुओं से दूर जा रहे थे’
  rationale: संदर्भ विरोधी अगुओं के प्रभाव से हटने का संकेत दे सकता है, लेकिन यूनानी वाक्य में उनका स्पष्ट कर्म नहीं है; इसलिए अनिश्चितता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अलग होते जा रहे थे’ प्रचलित हिन्दी में जारी परिवर्तन को व्यक्त करता है और यूनानी वाक्य में अनकहे कर्म को मुख्य पाठ में जोड़ने से बचता है।
