source:
  edition: SBLGNT
  text: καὶ οἶδα ὅτι ἡ ἐντολὴ αὐτοῦ ζωὴ αἰώνιός ἐστιν. ἃ οὖν ⸂ἐγὼ λαλῶ⸃, καθὼς εἴρηκέν μοι ὁ πατήρ, οὕτως λαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/050.yaml
  text: And I know that his commandment is eternal life. So what I speak[a], I speak just as the Father has told me.
translation:
  language: hi
  text: और मैं जानता हूँ कि उसकी आज्ञा अनन्त जीवन है[a]। इसलिए मैं जो कुछ बोलता हूँ, ठीक वैसा ही बोलता हूँ जैसा पिता ने मुझसे कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी आज्ञा अनन्त जीवन की ओर ले जाती है,’ अथवा ‘उसकी आज्ञा अनन्त जीवन के विषय में है।’ यूनानी में अधिक शाब्दिक रूप से ‘उसकी आज्ञा अनन्त जीवन है’ कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐντολή
  choice: आज्ञा
  rationale: ‘आज्ञा’ आधुनिक हिन्दी में किसी अधिकारपूर्ण आदेश को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करती है तथा यूहन्ना के प्रसंग में उपयुक्त है।
- source_word: ζωὴ αἰώνιος
  choice: अनन्त जीवन
  rationale: यह यूहन्ना के साहित्य में प्रचलित धर्मवैचारिक पद है और जीवन की अनन्त अवधि तथा आने वाले युग से उसके संबंध—दोनों को बनाए रखता है।
- source_word: ἃ
  choice: जो कुछ
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम को हिन्दी में ‘जो कुछ’ कहना स्वाभाविक है और यीशु के कथन की विषयवस्तु को समेटता है।
- source_word: λαλῶ
  choice: मैं ... बोलता हूँ
  rationale: दोनों स्थानों पर ‘बोलता हूँ’ रखने से यूनानी क्रिया की पुनरावृत्ति सुरक्षित रहती है।
- source_word: καθὼς
  choice: ठीक वैसा ही ... जैसा
  rationale: यह पिता के कहे हुए और यीशु के बोलने के बीच सटीक अनुरूपता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἴρηκέν μοι
  choice: मुझसे कहा है
  rationale: पूर्णकालीन रूप को ‘कहा है’ से व्यक्त करने पर पहले कही गई बात की वर्तमान प्रासंगिकता बनी रहती है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यूनानी में सम्बन्धसूचक ‘मेरे’ नहीं है; हिन्दी में उपाधि के रूप में ‘पिता’ स्वाभाविक है और मूल की शब्दावली को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पूर्ववर्ती कथन से निकलने वाले निष्कर्ष को स्पष्ट रूप से व्यक्त करता है।
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: यह οἶδα का सीधा और स्वाभाविक हिन्दी रूप है तथा कथन की निश्चितता को बनाए रखता है।
theological_decisions:
- issue: ‘उसकी आज्ञा अनन्त जीवन है’ का अर्थ
  choice: मुख्य पाठ में यूनानी की सीधी समतामूलक अभिव्यक्ति ‘आज्ञा अनन्त जीवन है’ रखी गई है।
  alternative: आज्ञा अनन्त जीवन की ओर ले जाती है; अथवा आज्ञा अनन्त जीवन के विषय में है।
  rationale: मूल पाठ परिणाम, विषय और सार के बीच सम्बन्ध को स्पष्ट रूप से सीमित नहीं करता। इसलिए मुख्य पाठ धर्मवैचारिक तनाव और वास्तविक अस्पष्टता को सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञा’ तथा ‘अनन्त जीवन’ जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास सामान्य आधुनिक हिन्दी के अनुरूप है।
