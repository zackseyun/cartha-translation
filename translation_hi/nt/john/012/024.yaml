review_pass:
  verdict: revise
  source_fidelity: The agricultural metaphor, emphatic doubled opening, direct address, conditional contrast, and result clause are all represented. However, “जब तक ... मर नहीं जाता” is temporally framed (“until”) and can imply that the grain ceases to remain alone once it dies; the Greek uses a negative conditional, “unless/if it does not die.” A conditional Hindi construction represents this more precisely.
  naturalness: The draft is generally clear and appropriately dignified. “बहुत फल देता है” is more idiomatic in modern Hindi than “बहुत फल लाता है.” The existing second footnote is understandable but “आगे अपने पीछे चलने वालों” is awkward; “जो उसके पीछे चलते हैं” is natural.
  terminology: “सच-सच,” “गेहूँ का दाना,” “भूमि,” and “फल” fit modern standard Hindi and preserve the Johannine and agricultural register. “अकेला ही रहता है” appropriately conveys αὐτὸς μόνος μένει. The lexical-alternative footnote should give a genuinely distinct, natural alternative rather than the redundant phrase “अपने आप अकेला.”
  issues:
  - severity: medium
    issue: The first conditional clause is translated with “जब तक ... मर नहीं जाता.”
    rationale: ἐὰν μὴ is “unless/if not,” not principally a temporal “until” clause. “यदि गेहूँ का दाना भूमि में गिरकर न मरे, तो...” preserves the source’s conditional structure and contrast.
  - severity: low
    issue: “बहुत फल लाता है” is less idiomatic than “बहुत फल देता है.”
    rationale: Both can be understood, but “फल देना” is the standard natural Hindi expression for bearing fruit and retains the metaphor.
  - severity: low
    issue: Both footnotes need stylistic revision.
    rationale: Footnote a currently offers a redundant wording rather than a clear alternative. Footnote b contains an awkward phrase for followers of Jesus; it can be clarified without adding interpretation beyond the supplied English audit trail.
