id: JHN.12.24
reference: John 12:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω ὑμῖν, ἐὰν μὴ ὁ κόκκος τοῦ σίτου πεσὼν εἰς τὴν γῆν ἀποθάνῃ, αὐτὸς μόνος μένει· ἐὰν δὲ ἀποθάνῃ, πολὺν καρπὸν φέρει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/024.yaml
  text: Truly[a], truly, I say to you, unless the grain of wheat falls into the ground and dies, it remains by itself; but if it dies[b], it bears much fruit.
translation:
  language: hi
  text: 'मैं तुमसे सच-सच कहता हूँ: यदि गेहूँ का दाना भूमि में गिरकर न मरे, तो वह अकेला ही रहता है[a]; लेकिन यदि वह मर जाए, तो बहुत फल देता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह अपने आप ही रहता है।”
    reason: lexical_alternative
  - marker: b
    text: यह चित्र उस दाने का है जो भूमि में मरकर फलदायी होता है। प्रसंग में यीशु इस प्रतिरूप को अपनी मृत्यु और जो उसके पीछे चलते हैं, उन पर लागू करते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यूहन्ना में प्रयुक्त इस गंभीर और बलपूर्ण कथन-सूचक पद की पुनरावृत्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और यूहन्ना की विशिष्ट कथन-शैली दोनों को सुरक्षित रखता है।
- source_word: ἐὰν μὴ
  choice: जब तक ... नहीं
  rationale: इस नकारात्मक शर्त को कृषि-विषयक वाक्य में सहज हिन्दी में व्यक्त करता है; अर्थ 'यदि नहीं' अथवा 'जब तक नहीं' है।
- source_word: ὁ κόκκος τοῦ σίτου
  choice: गेहूँ का दाना
  rationale: κόκκος के दाने/बीज के अर्थ और कृषि-चित्र को साधारण, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πεσὼν εἰς τὴν γῆν
  choice: भूमि में गिरकर
  rationale: कृदन्त की पूर्ववर्ती क्रिया और εἰς की भीतर जाने की दिशा को संक्षेप में सुरक्षित रखता है।
- source_word: ἀποθάνῃ
  choice: मर नहीं जाता / मर जाए
  rationale: शर्तवाचक उपवाक्यों में यूनानी अओरिस्ट सब्जंक्टिव को स्वाभाविक हिन्दी शर्तवाचक रूपों से व्यक्त करता है।
- source_word: αὐτὸς μόνος μένει
  choice: वह अकेला ही रहता है
  rationale: μόνος का 'अकेला' और αὐτός का बल 'ही' से प्रकट होता है; यह दाने के एकमात्र और निष्फल बने रहने का चित्र सुरक्षित रखता है।
- source_word: πολὺν καρπὸν φέρει
  choice: बहुत फल लाता है
  rationale: φέρει καρπόν की फल उत्पन्न करने वाली कृषि-उपमा को बनाए रखता है और 'फसल' जैसे अधिक व्याख्यात्मक शब्द से बचता है।
theological_decisions:
- issue: कृषि-उपमा में निहित मसीह-संबंधी और शिष्यत्व-संबंधी अर्थ
  choice: मुख्य पाठ में कृषि-उपमा को ज्यों का त्यों रखा गया है और उसके प्रसंगगत संकेत को पाद-टिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में स्पष्ट जोड़ना कि यीशु अपनी मृत्यु और उसके फल की बात कर रहे हैं।
  rationale: प्रसंग इस उपमा को यीशु की मृत्यु और आगे शिष्यों के मार्ग से जोड़ता है, पर इस पद का कथन स्वयं उपमा के रूप में है। स्पष्ट व्याख्यात्मक विस्तार मूल पाठ की अर्थगत गुंजाइश को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “सच-सच” यूहन्ना की दोहरी ἀμήν शैली को बचाता है; “भूमि” कृषि-संदर्भ में स्पष्ट है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
