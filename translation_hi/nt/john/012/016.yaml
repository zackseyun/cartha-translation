source:
  edition: SBLGNT
  text: ⸀ταῦτα οὐκ ἔγνωσαν ⸂αὐτοῦ οἱ μαθηταὶ⸃ τὸ πρῶτον, ἀλλ’ ὅτε ἐδοξάσθη Ἰησοῦς τότε ἐμνήσθησαν ὅτι ταῦτα ἦν ἐπ’ αὐτῷ γεγραμμένα καὶ ταῦτα ἐποίησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/016.yaml
  text: His disciples did not understand these things at first[a], but when Jesus was glorified[c][b], then they remembered that these things had been written about him and that they had done these things to him.
translation:
  language: hi
  text: उसके चेले पहले इन बातों को नहीं समझे[a]; पर जब यीशु महिमान्वित हुआ[b], तब उन्हें याद आया कि ये बातें उसके विषय में लिखी हुई थीं और उसके लिए ये सब किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले इन बातों को नहीं जानते थे।”
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के सुसमाचार में यीशु का “महिमान्वित” होना प्रायः उसकी मृत्यु, पुनरुत्थान और ऊँचा उठाए जाने से जुड़ा है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔγνωσαν
  choice: नहीं समझे
  rationale: यहाँ बात केवल तथ्य न जानने की नहीं, बल्कि घट रही घटनाओं का अर्थ न समझ पाने की है। ‘नहीं समझे’ प्रसंग में γινώσκω का स्वाभाविक अर्थ व्यक्त करता है; ‘नहीं जानते थे’ को पाद-टिप्पणी में रखा गया है।
- source_word: αὐτοῦ οἱ μαθηταί
  choice: उसके चेले
  rationale: सम्बन्धवाचक सर्वनाम को सहज आधुनिक हिन्दी में व्यक्त किया गया है। ‘चेले’ साधारण पाठकों के लिए स्पष्ट और प्रचलित बाइबलीय शब्द है।
- source_word: τὸ πρῶτον
  choice: पहले
  rationale: यह समयसूचक पद आरम्भिक अवस्था को दिखाता है; हिन्दी में ‘पहले’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐδοξάσθη
  choice: महिमान्वित हुआ
  rationale: यह निष्क्रिय क्रिया और यूहन्ना में δοξάζω के गहरे धार्मिक अर्थ—यीशु की मृत्यु, पुनरुत्थान और ऊँचा उठाए जाने से जुड़ी महिमा—दोनों को बनाए रखता है।
- source_word: ἐμνήσθησαν
  choice: उन्हें याद आया
  rationale: यूनानी रूप का सहज हिन्दी कथात्मक समतुल्य है और बाद में हुई समझ को स्पष्ट करता है।
- source_word: ἐπ’ αὐτῷ γεγραμμένα
  choice: उसके विषय में लिखी हुई थीं
  rationale: ἐπί के साथ सम्प्रदान कारक यहाँ स्थानसूचक नहीं, बल्कि ‘उसके विषय में/सम्बन्ध में’ अर्थ देता है। ‘लिखी हुई थीं’ पहले से विद्यमान शास्त्रीय लेखन को व्यक्त करता है।
- source_word: ταῦτα ἐποίησαν αὐτῷ
  choice: लोगों ने उसके साथ यही सब किया था
  rationale: यूनानी में कर्ता अव्यक्त बहुवचन है। हिन्दी में ‘लोगों ने’ उस अनिर्दिष्ट समूह को स्वाभाविक ढंग से व्यक्त करता है और ‘उन्होंने’ से चेलों को कर्ता समझ लेने की सम्भावना घटाता है। ‘यही सब’ बार-बार आए ταῦτα को सामूहिक घटनाओं के रूप में रखता है।
theological_decisions:
- issue: यूहन्ना के प्रसंग में यीशु के ‘महिमान्वित’ होने का आशय
  choice: ‘महिमान्वित हुआ’ को बिना किसी एक घटना तक सीमित किए रखा गया है।
  alternative: ‘ऊँचा उठाया गया’ या ‘सम्मानित हुआ’
  rationale: यूहन्ना में महिमा की भाषा यीशु की मृत्यु, पुनरुत्थान और ऊँचा उठाए जाने से परतदार ढंग से जुड़ी है। अनुवाद इस धार्मिक तनाव को बनाए रखता है और उसे किसी एक व्याख्या में सीमित नहीं करता।
- issue: ταῦτα ἐποίησαν αὐτῷ में अव्यक्त कर्ता
  choice: अनिर्दिष्ट समूह को ‘लोगों ने’ कहा गया है।
  alternative: ‘उन्होंने’—जिससे चेलों को कर्ता समझा जा सकता है—या कर्मवाच्य ‘उसके साथ यही सब किया गया था’
  rationale: प्रसंग में जय-प्रवेश से जुड़ी गतिविधियाँ करने वाले लोग अभिप्रेत हैं। ‘लोगों ने’ अनावश्यक रूप से किसी विशेष समूह की पहचान तय किए बिना अर्थ स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की कथात्मक गति और ‘इन/ये बातें’ की पुनरावृत्ति सुरक्षित है। ‘महिमान्वित’ धार्मिक गहराई को बनाए रखता है, जबकि पाद-टिप्पणी उसका प्रसंग बताती है, अर्थ को सीमित नहीं करती।
