    text: या, “उन्होंने उस पर विश्वास नहीं किया।” यूनानी क्रिया का अपूर्ण भूतकाल लगातार या बार-बार के अविश्वास की ओर संकेत कर सकता है।
    reason: aspectual_alternative
lexical_decisions:
- source_word: τοσαῦτα
  choice: इतने
  rationale: यहाँ शब्द चिह्नों की बड़ी संख्या पर बल देता है; ‘इतने चिह्न’ सहज हिन्दी में वही बल बनाए रखता है।
- source_word: δὲ
  choice: फिर भी
  rationale: यह पिछले कथन से विरोध और आश्चर्यपूर्ण मोड़ दिखाता है; हिन्दी वाक्य में ‘फिर भी’ इस प्रतिकूल संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σημεῖα
  choice: चिह्न
  rationale: यूहन्ना में यह शब्द केवल आश्चर्यकर्म नहीं, बल्कि यीशु की पहचान और महिमा की ओर संकेत करने वाले कार्य के लिए प्रयुक्त होता है; इसलिए ‘चमत्कार’ की अपेक्षा ‘चिह्न’ उपयुक्त है।
- source_word: πεποιηκότος
  choice: किए थे
  rationale: पूर्ण कृदन्त पहले किए गए कार्य और उसकी बनी हुई प्रासंगिकता को दर्शाता है; ‘किए थे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔμπροσθεν αὐτῶν
  choice: उनके सामने
  rationale: यह बताता है कि चिह्न उनकी उपस्थिति में, प्रत्यक्ष रूप से किए गए थे।
- source_word: οὐκ ἐπίστευον
  choice: विश्वास नहीं करते थे
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार बने रहे अविश्वास की ओर संकेत कर सकता है; यह हिन्दी रूप उस पक्ष को बिना ‘जानबूझकर इनकार’ का अतिरिक्त भाव जोड़े सुरक्षित रखता है।
- source_word: εἰς αὐτόν
  choice: उस पर
  rationale: πιστεύω εἰς का स्वाभाविक हिन्दी समतुल्य ‘उस पर विश्वास करना’ है, जो यीशु की ओर लक्षित भरोसे का भाव बनाए रखता है।
theological_decisions:
- issue: अपूर्ण भूतकाल में व्यक्त यूहन्नाई अविश्वास
  choice: वे उस पर विश्वास नहीं करते थे
  alternative: उन्होंने उस पर विश्वास नहीं किया
  rationale: चुना गया रूप चिह्नों के बावजूद बने रहे अविश्वास को व्यक्त करता है, पर यूनानी पाठ से अधिक प्रबल इच्छापूर्वक अस्वीकार करने का भाव नहीं जोड़ता।
