  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चिह्न’ को यूहन्ना की विशिष्ट धार्मिक अर्थछाया बनाए रखने के लिए रखा गया है; वाक्य-विन्यास प्रतिकूल संबंध को स्पष्ट और स्वाभाविक बनाता है।
