  text: ⸀ὡς τὸ φῶς ἔχετε, πιστεύετε εἰς τὸ φῶς, ἵνα υἱοὶ φωτὸς γένησθε. Ταῦτα ⸀ἐλάλησεν Ἰησοῦς, καὶ ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/036.yaml
  text: While you have the light[a], believe in the light, so that you may become sons of light. Jesus spoke these things[b], and he departed and hid from them.
translation:
  language: hi
  text: जब तक ज्योति तुम्हारे पास है, ज्योति पर विश्वास करो, ताकि तुम ज्योति के पुत्र[a] बनो। यीशु ने ये बातें कहीं[b]; फिर वह चला गया और उनसे छिप गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ज्योति की संतानें।” यूनानी में शाब्दिक रूप से “ज्योति के पुत्र” है—अर्थात ऐसे लोग जिनकी पहचान ज्योति से होती है।
    reason: lexical_alternative
  - marker: b
    text: या, “यीशु ने ये बातें कहीं और, चला जाने के बाद, उनसे छिप गया।”
    reason: syntactic_alternative
lexical_decisions:
- source_word: ὡς τὸ φῶς ἔχετε
  choice: जब तक ज्योति तुम्हारे पास है
  rationale: ὡς के साथ वर्तमानकालीन ἔχετε यहाँ समय की सीमित अवधि और तात्कालिकता व्यक्त करता है। ‘जब तक’ आधुनिक हिन्दी में स्वाभाविक है और ‘जितने समय तक’ की अपेक्षा अधिक सहज है।
- source_word: τὸ φῶς
  choice: ज्योति
  rationale: यूहन्ना में यह एक प्रमुख रूपक और मसीह-संबंधी संकेत है। ‘ज्योति’ गरिमापूर्ण, सुबोध और इस धार्मिक-साहित्यिक प्रसंग में स्थापित शब्द है।
- source_word: πιστεύετε εἰς τὸ φῶς
  choice: ज्योति पर विश्वास करो
  rationale: हिन्दी में किसी व्यक्ति या सत्ता के संबंध में πιστεύω εἰς का स्वाभाविक रूप ‘पर विश्वास करना’ है। यह केवल किसी कथन को सत्य मानने के बजाय भरोसा रखने की यूहन्नाई पुकार को बनाए रखता है।
- source_word: ἵνα υἱοὶ φωτὸς γένησθε
  choice: ताकि तुम ज्योति के पुत्र बनो
  rationale: ‘ताकि’ उद्देश्य/परिणाम का बल रखता है; γένησθε को ‘बनो’ कहना बनने की गति को सुरक्षित रखता है। υἱοί के स्पष्ट पुल्लिंग रूप को मुख्य पाठ में ‘पुत्र’ रखा गया है।
- source_word: Ταῦτα ἐλάλησεν Ἰησοῦς
  choice: यीशु ने ये बातें कहीं
  rationale: λαλέω का यहाँ सामान्य कथनात्मक अर्थ है। ‘ये बातें कहीं’ आधुनिक हिन्दी में ‘इन बातों को बोला’ से अधिक स्वाभाविक है।
- source_word: ἀπελθὼν ἐκρύβη ἀπ’ αὐτῶν
  choice: फिर वह वहाँ से चला गया और उसने अपने को उनसे छिपा लिया
  rationale: अओरिस्ट कृदंत के बाद मुख्य क्रिया की क्रमिकता को सहज हिन्दी में समन्वित क्रियाओं से व्यक्त किया गया है। ἐκρύβη रूपतः कर्मवाच्य है, पर प्रसंग में आत्मवाचक/मध्यवाचक अर्थ स्वाभाविक है; इसलिए ‘अपने को ... छिपा लिया’ चुना गया।
theological_decisions:
- issue: υἱοὶ φωτός का लिंगयुक्त पारिवारिक मुहावरा
  choice: ज्योति के पुत्र
  alternative: ज्योति की संतान
  rationale: मुख्य पाठ यूनानी के पुल्लिंग υἱοί को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह मुहावरा ज्योति से पहचाने जाने वाले लोगों के लिए प्रतिनिधिक अर्थ में है।
- issue: यूहन्ना में πιστεύω εἰς की अभिव्यक्ति
  choice: ज्योति पर विश्वास करो
  alternative: ज्योति पर भरोसा रखो
  rationale: ‘विश्वास करो’ मूल क्रिया का सीधा और परिचित धार्मिक रूप है; ‘पर’ हिन्दी में εἰς के संबंधपरक लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है, बिना अतिरिक्त धर्मसैद्धांतिक व्याख्या जोड़े।
- issue: ἐκρύβη की वाच्यगत अस्पष्टता
  choice: उसने अपने को उनसे छिपा लिया
  alternative: वह उनसे छिप गया
  rationale: यूनानी रूप कर्मवाच्य होते हुए भी यहाँ मध्यवाचक/आत्मवाचक अर्थ दे सकता है। मुख्य अनुवाद यीशु की सचेत कथा-क्रिया को दर्शाता है; सरल अकर्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध, गरिमापूर्ण और सामान्य पाठकों के अनुकूल स्तर रखा गया है। ‘ज्योति’ यूहन्ना के साहित्यिक-धर्मवैचारिक रूपक को बनाए रखता है; वाक्य-विन्यास को हिन्दी में सहज बनाने के साथ मूल की समयगत तात्कालिकता, उद्देश्य और क्रम सुरक्षित रखे गए हैं।
