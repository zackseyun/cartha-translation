  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τετύφλωκεν αὐτῶν τοὺς ὀφθαλμοὺς καὶ ⸀ἐπώρωσεν αὐτῶν τὴν καρδίαν, ἵνα μὴ ἴδωσιν τοῖς ὀφθαλμοῖς καὶ νοήσωσιν τῇ καρδίᾳ καὶ ⸀στραφῶσιν, καὶ ⸀ἰάσομαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/040.yaml
  text: He has blinded their eyes and hardened their heart[a], so that they may not see with their eyes and understand with their heart and turn[c][b], and I would heal them.
translation:
  language: hi
  text: उसने उनकी आँखें अंधी कर दी हैं और उनके हृदय को कठोर कर दिया है, ताकि वे अपनी आँखों से न देखें, अपने हृदय से न समझें और न फिरें[a], और मैं उन्हें चंगा करूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परिवर्तित हों।” यह पंक्ति यशायाह 6:10 की प्रतिध्वनि है।
    reason: lexical_alternative; cross_reference
  - marker: b
    text: यूनानी में “मैं उन्हें चंगा करूँगा” भविष्यकालीन रूप है। उद्धृत उद्देश्य/परिणाम-रचना में मुख्य पाठ का “मैं उन्हें चंगा करूँ” उसका संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τετύφλωκεν
  choice: अंधी कर दी हैं
  rationale: पूर्णकाल किसी किए गए कार्य से बनी वर्तमान दशा को व्यक्त करता है; यह रूप उस प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπώρωσεν
  choice: कठोर कर दिया है
  rationale: यह क्रिया कठोर या संवेदनहीन बना देने का भाव रखती है। ‘कठोर’ भविष्यद्वाणी में निहित न्याय के कठिन भाव को नरम किए बिना सहज हिन्दी देता है।
- source_word: καρδίαν / καρδίᾳ
  choice: हृदय / हृदय से
  rationale: मूल में ‘हृदय’ समझ-बूझ सहित भीतरी मनुष्य को सूचित करता है; ‘समझें’ उसका बौद्धिक पक्ष स्पष्ट करता है। एकवचन मूल के सामूहिक प्रयोग को भी सुरक्षित रखता है।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह उद्देश्य अथवा परिणाम की संरचना को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है, बिना दोनों में से किसी एक को अनावश्यक रूप से निर्णीत किए।
- source_word: ἴδωσιν τοῖς ὀφθαλμοῖς
  choice: अपनी आँखों से न देखें
  rationale: मूल की ठोस छवि और ‘हृदय से समझने’ के साथ उसका समानांतर विन्यास सुरक्षित रहता है।
- source_word: νοήσωσιν
  choice: समझें
  rationale: यहाँ क्रिया मानसिक बोध को व्यक्त करती है; ‘समझें’ सरल और प्रसंगानुकूल है।
- source_word: στραφῶσιν
  choice: मेरी ओर न फिरें
  rationale: ‘फिरें’ मूल क्रिया की व्यापकता और भविष्यद्वाणी के लौटने वाले मुहावरे को बनाए रखता है। ‘मेरी ओर’ उपचार करने वाले प्रथम पुरुष वक्ता की ओर लौटने का निहित लक्ष्य हिन्दी में स्वाभाविक रूप से स्पष्ट करता है; अधिक सिद्धान्तगत ‘मन-परिवर्तन करें’ मुख्य पाठ में नहीं रखा गया।
- source_word: ἰάσομαι
  choice: मैं उन्हें चंगा करूँ
  rationale: यूनानी रूप व्याकरणतः भविष्य है, पर ἵνα-आश्रित क्रम में हिन्दी का संभावनार्थक ‘करूँ’ उद्देश्य/परिणाम की संरचना के भीतर अपेक्षित उपचार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτῶν τὴν καρδίαν
  choice: उनके हृदय को
  rationale: यूनानी में ‘हृदय’ एकवचन है और सामूहिक अर्थ रखता है; हिन्दी में एकवचन बनाए रखने से मूल रूप और सामूहिक बोध दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: अंधा और कठोर करने में परमेश्वर की कर्तृता
  choice: 'स्पष्ट एकवचन कर्ता रखा गया है: ‘उसने ... अंधी कर दी हैं और ... कठोर कर दिया है।’'
  alternative: कर्तृता को नरम करने वाला कर्मवाच्य या निर्वैयक्तिक अनुवाद
  rationale: यूनानी पाठ यह कार्य स्पष्ट रूप से एकवचन कर्ता को देता है। न्यायस्वरूप कठोर किए जाने के धार्मिक तनाव को अनुवाद में कम नहीं किया गया।
- issue: στραφῶσιν में लौटने या मन-परिवर्तन का भाव
  choice: मुख्य पाठ में ‘मेरी ओर न फिरें’
  alternative: ‘मन-परिवर्तन न करें’ या ‘परिवर्तित न किए जाएँ’
  rationale: ‘फिरें’ क्रिया के व्यापक अर्थ और भविष्यद्वाणी के मुहावरे को बचाता है; संकीर्ण धार्मिक पारिभाषिक अर्थ थोपने से बचता है।
- issue: ἰάσομαι का काल और आश्रित भाव
  choice: ‘मैं उन्हें चंगा करूँ’
  alternative: ‘मैं उन्हें चंगा करूँगा’
  rationale: मूल रूप भविष्यकालीन है, किंतु उद्धृत उद्देश्य/परिणाम संरचना के भीतर हिन्दी संभावनार्थक रूप उसके संबंध को अधिक स्वाभाविक ढंग से दिखाता है; भविष्यकालीन विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और श्रव्य शैली रखी गई है। ‘हृदय’, ‘कठोर’ और ‘चंगा’ जैसे परिचित बाइबलीय शब्द मूल की छवि तथा धार्मिक तनाव बनाए रखते हैं। सर्वनाम ‘उसने’ पूर्ववर्ती संदर्भ और उद्धरण की कर्तृता को सुरक्षित रखता है।
