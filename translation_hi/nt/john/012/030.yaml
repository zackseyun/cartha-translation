  text: Jesus answered and said[a], “This voice has not come for my sake, but for yours.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया और कहा[a], “यह आवाज़ मेरे लिए नहीं आई, बल्कि तुम्हारे लिए आई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह आवाज़ मेरे कारण नहीं, बल्कि तुम्हारे कारण आई है।” यूनानी संबंधबोधक शब्द का अर्थ कारण-सूचक भी हो सकता है, हालाँकि इस संदर्भ में “के लिए,” अर्थात हित या प्रयोजन का भाव, अधिक उपयुक्त लगता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर दिया और कहा
  rationale: यूहन्ना की दोहरी कथात्मक अभिव्यक्ति को बनाए रखते हुए यह हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: φωνή
  choice: आवाज़
  rationale: संदर्भ में यह अभी-अभी सुनी गई स्वर्गीय वाणी को दर्शाता है; सामान्य पाठक के लिए ‘आवाज़’ सहज है।
- source_word: γέγονεν
  choice: आई है
  rationale: यहाँ पूर्णकालिक क्रिया आवाज़ के घटित होकर उपस्थित होने का भाव देती है; हिन्दी में आवाज़ के साथ ‘आई है’ स्वाभाविक है।
- source_word: δι’ ἐμέ … δι’ ὑμᾶς
  choice: मेरे लिए … तुम्हारे लिए
  rationale: संदर्भ में διά के प्रयोजन अथवा हित-सूचक अर्थ को व्यक्त करता है और दोनों वाक्यांशों की समानांतरता बनाए रखता है।
- source_word: Οὐ … ἀλλὰ
  choice: नहीं … बल्कि
  rationale: मूल यूनानी के स्पष्ट विरोध को सीधे और स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: स्वर्गीय आवाज़ का प्रयोजन
  choice: आवाज़ यीशु के हित के लिए नहीं, बल्कि सुनने वालों के हित के लिए आई।
  alternative: आवाज़ यीशु के कारण नहीं, बल्कि सुनने वालों के कारण हुई।
  rationale: इस संदर्भ में διά + कर्मकारक का हित अथवा प्रयोजन-सूचक अर्थ अधिक उपयुक्त है, पर उसके संभावित कारण-सूचक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण शैली। ‘तुम्हारे’ बहुवचन श्रोताओं को संबोधित करता है और निकटवर्ती संवाद की प्रत्यक्षता बनाए रखता है।
