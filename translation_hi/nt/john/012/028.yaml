source:
  edition: SBLGNT
  text: πάτερ, δόξασόν σου τὸ ὄνομα. ἦλθεν οὖν φωνὴ ἐκ τοῦ οὐρανοῦ· Καὶ ἐδόξασα καὶ πάλιν δοξάσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/028.yaml
  text: 'Father[a], glorify your name. Then a voice came from heaven: “I have glorified it, and I will glorify it again.”'
translation:
  language: hi
  text: “हे पिता, अपने नाम की महिमा कर।” तब स्वर्ग से एक वाणी आई, “मैंने उसकी महिमा की है[a], और फिर उसकी महिमा करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मैंने उसकी महिमा की, और फिर उसकी महिमा करूँगा।”
    reason: पहला यूनानी क्रियारूप अओरिस्ट है; हिन्दी का सामान्य भूतकाल उसके रूप को अधिक सीधे दिखाता है, जबकि मुख्य पाठ का पूर्ण रूप वर्तमान प्रासंगिकता को स्वाभाविक ढंग से व्यक्त करता है।
lexical_decisions:
- source_word: πάτερ
  choice: हे पिता
  rationale: यह परमेश्वर को सीधे संबोधित करने वाला सम्बोधन है। यूनानी में ‘मेरे’ नहीं है, इसलिए उसे नहीं जोड़ा गया; ‘हे पिता’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: δόξασόν
  choice: महिमा कर
  rationale: δοξάζω के यूहन्ना-संबंधी धार्मिक अर्थ—महिमा को प्रकट करना—को बनाए रखता है; ‘आदर कर’ इसका अर्थ कमजोर कर देता।
- source_word: σου τὸ ὄνομα
  choice: अपने नाम की
  rationale: सीधे संबोधन में हिन्दी का निजवाचक ‘अपने’ स्वाभाविक रूप से यूनानी ‘तेरे/तुम्हारे नाम’ को व्यक्त करता है और परमेश्वर के प्रकट चरित्र तथा प्रतिष्ठा से जुड़े ‘नाम’ के बाइबिलीय अर्थ को सुरक्षित रखता है।
- source_word: ἦλθεν οὖν
  choice: तब ... आई
  rationale: यहाँ οὖν कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में सहज है। φωνή स्त्रीलिंग होने के कारण क्रिया ‘आई’ है।
- source_word: φωνὴ ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से एक वाणी
  rationale: आगे प्रत्यक्ष कथन होने के कारण φωνή का अर्थ स्पष्टतः बोलती हुई ‘वाणी’ है, केवल कोई ‘आवाज़’ या ‘ध्वनि’ नहीं; ‘स्वर्ग’ इसके दिव्य उद्गम को बनाए रखता है।
- source_word: Καὶ ἐδόξασα καὶ πάλιν δοξάσω
  choice: मैंने उसकी महिमा की है, और फिर उसकी महिमा करूँगा
  rationale: पहले अओरिस्ट को हिन्दी पूर्ण रूप में प्रस्तुत वर्तमान प्रासंगिकता सहित स्वाभाविक ढंग से व्यक्त किया गया है। ‘उसकी’ का संदर्भ ठीक पहले आए ‘नाम’ से है, और πάλιν को भविष्य की क्रिया के साथ ‘फिर’ रखा गया है।
theological_decisions:
- issue: दिव्य उत्तर में लुप्त कर्म का संदर्भ
  choice: ‘उसकी’ जोड़कर उसे ‘अपने नाम’ से जोड़ा गया
  alternative: 'कर्म को लुप्त रखना: ‘मैंने महिमा की है, और फिर महिमा करूँगा’'
  rationale: यूनानी में कर्म प्रसंग से समझा जाता है, पर हिन्दी में उसे छोड़ने से कथन अस्वाभाविक और संदिग्ध हो जाता। ‘उसकी’ यह स्पष्ट करता है कि पिता अपने नाम की महिमा करने की बात कह रहे हैं।
- issue: यूहन्ना में धर्मवैचारिक रूप से महत्वपूर्ण δοξάζω
  choice: महिमा कर/महिमा की है/महिमा करूँगा
  alternative: आदर कर; गौरवान्वित कर
  rationale: ‘महिमा’ पिता और पुत्र से संबंधित यूहन्ना के व्यापक शब्द-जाल को बनाए रखती है और अर्थ को केवल सम्मान या प्रतिष्ठा तक सीमित नहीं करती।
- issue: पहले अओरिस्ट का कालगत निरूपण
  choice: ‘मैंने ... की है’
  alternative: ‘मैंने ... की’
  rationale: दोनों अर्थगत रूप से संभव हैं। मुख्य पाठ में पूर्ण कार्य की वर्तमान प्रासंगिकता दिखाने वाला स्वाभाविक हिन्दी रूप चुना गया है; अधिक रूपगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रार्थना के आत्मीय प्रत्यक्ष संबोधन में ‘हे पिता’ और ‘कर’ रखा गया है। ‘वाणी’ दिव्य, स्पष्ट कथन के लिए उपयुक्त है।
