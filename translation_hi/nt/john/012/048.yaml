  text: ὁ ἀθετῶν ἐμὲ καὶ μὴ λαμβάνων τὰ ῥήματά μου ἔχει τὸν κρίνοντα αὐτόν· ὁ λόγος ὃν ἐλάλησα ἐκεῖνος κρινεῖ αὐτὸν ἐν τῇ ἐσχάτῃ ἡμέρᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/048.yaml
  text: 'The one who rejects me and does not receive my words has one who judges him: the word that I spoke will judge him on the last day[a][b].'
translation:
  language: hi
  text: 'जो मुझे ठुकराता है और मेरी बातों को ग्रहण नहीं करता[a], उसका न्याय करने वाला उसके पास है: मैंने जो वचन कहा[b], वही अंतिम दिन उसका न्याय करेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरी बातों को स्वीकार नहीं करता।’ यूनानी क्रिया में ग्रहण करने, स्वागत करने या स्वीकार करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मैंने जो संदेश सुनाया।’ यूनानी शब्द λόγος का अर्थ संदर्भ के अनुसार ‘वचन’ या ‘संदेश’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶν
  choice: ठुकराता है
  rationale: यहाँ क्रिया का अर्थ यीशु को केवल अनदेखा करना नहीं, बल्कि उन्हें अस्वीकार करना है। ‘ठुकराता है’ व्यक्तिगत और प्रबल भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μὴ λαμβάνων τὰ ῥήματά μου
  choice: मेरी बातों को ग्रहण नहीं करता
  rationale: λαμβάνω में पाने के साथ स्वागत या स्वीकार करने का भाव भी हो सकता है। ‘ग्रहण नहीं करता’ इस व्यापकता को बनाए रखता है, और बहुवचन ῥήματα के लिए ‘बातों’ स्वाभाविक है।
- source_word: ἔχει τὸν κρίνοντα αὐτόν
  choice: उसका न्याय करने वाला है
  rationale: यूनानी वाक्य की कुछ संक्षिप्त संरचना को बनाए रखते हुए यह बताता है कि उसे ठुकराने वाले के लिए न्याय करने वाला पहले से उपस्थित है; अगला खंड उसकी पहचान यीशु के बोले हुए वचन से करता है।
- source_word: ὁ λόγος
  choice: वचन
  rationale: λόγος यहाँ यीशु द्वारा बोले गए प्रकाशन को सूचित करता है। ‘वचन’ उसके एकवचन, गंभीर और लगभग व्यक्तिरूप बल को रखता है; ‘संदेश’ भी संदर्भतः संभव है।
- source_word: ὃν ἐλάλησα
  choice: मैंने जो ... कहा है
  rationale: यह यीशु के बोले हुए वचन को सीधे व्यक्त करता है। हिन्दी में ‘कहा है’ वर्तमान संदर्भ से उसके स्थायी संबंध को सहज रूप से रखता है, यद्यपि यूनानी रूप सामान्य भूतकालीन कथन है।
- source_word: ἐκεῖνος
  choice: वही
  rationale: बलाघाती संकेतवाचक सर्वनाम पहले बताए गए वचन की ओर लौटता है। ‘वही’ इस बात पर जोर देता है कि ठीक वही वचन न्याय करेगा।
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: κρίνω का व्यापक अर्थ ‘न्याय करना’ है। ‘दोषी ठहराएगा’ परिणाम को मूल क्रिया से अधिक निश्चित कर देता।
- source_word: ἐν τῇ ἐσχάτῃ ἡμέρᾳ
  choice: अंतिम दिन
  rationale: यह यूहन्ना की प्रलयकालीन अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है, बिना किसी विस्तृत सिद्धान्तगत योजना को पाठ में जोड़ने के।
theological_decisions:
- issue: न्याय करने वाले की पहचान
  choice: पद यीशु के बोले हुए वचन को अंतिम न्याय करने वाला अथवा न्याय का कार्यकारी आधार बताता है।
  alternative: ‘वचन’ को केवल यीशु द्वारा प्रयुक्त न्याय-मानदंड मानकर, न्याय करने वाले के रूप में केवल यीशु को स्पष्ट करना।
  rationale: वाक्य पहले कहता है कि ठुकराने वाले का न्याय करने वाला है, फिर उस न्याय करने वाले को यीशु के बोले हुए वचन के रूप में पहचानता है। अनुवाद इस तनाव को बनाए रखता है और यूहन्ना के अन्य कथनों के आधार पर इसे चुपचाप पुनर्व्याख्यायित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ठुकराता है’ व्यक्तिगत अस्वीकार को स्पष्ट करता है; ‘ग्रहण’ और ‘वचन’ यूहन्ना की धार्मिक शब्दावली का भार रखते हुए भी प्रचलित हिन्दी हैं।
