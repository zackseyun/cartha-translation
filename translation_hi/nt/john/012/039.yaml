translation:
  language: hi
  text: 'इसी कारण वे विश्वास नहीं कर सकते थे, क्योंकि यशायाह ने फिर कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: διά के साथ τοῦτο यहाँ कारण व्यक्त करता है और पिछले संदर्भ से स्पष्ट संबंध बनाए रखता है।
- source_word: οὐκ ἠδύναντο
  choice: नहीं कर सकते थे
  rationale: δύναμαι का अपूर्णकालीन रूप वास्तविक असमर्थता व्यक्त करता है; यह केवल अनिच्छा का भाव नहीं देता।
- source_word: πιστεύειν
  choice: विश्वास
  rationale: यूहन्ना में πιστεύω के सामान्य और स्वाभाविक हिन्दी समतुल्य के रूप में ‘विश्वास करना’ उपयुक्त है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह अगले यशायाह-उद्धरण द्वारा बताई गई असमर्थता का कारण प्रस्तुत करता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह यशायाह से पहले दिए गए उद्धरण के बाद एक और कथन की ओर संकेत करता है।
- source_word: εἶπεν
  choice: कहा था
  rationale: उद्धरण प्रस्तुत करने के लिए ‘कहा’ स्वाभाविक है; पूर्ण भूतकाल का प्रयोग हिन्दी में मुख्य भूतकालीन कथन से पूर्व कही गई बात स्पष्ट करता है।
- source_word: Ἠσαΐας
  choice: यशायाह
  rationale: यह नाम का हिन्दी बाइबलीय प्रचलित रूप है।
theological_decisions:
- issue: विश्वास करने की बताई गई असमर्थता का स्वरूप
  choice: ‘विश्वास नहीं कर सकते थे’ के द्वारा असमर्थता को सीधे व्यक्त किया गया है।
  alternative: ‘विश्वास नहीं करना चाहते थे’ या किसी विशिष्ट धर्मवैज्ञानिक पद्धति के अनुसार कारण की व्याख्या करना।
  rationale: यूनानी पाठ असमर्थता बताता है, केवल अनिच्छा नहीं। साथ ही अनुवाद यह तय नहीं करता कि यह असमर्थता व्यापक धर्मवैज्ञानिक विवादों में ठीक किस प्रकार कार्य करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इसी कारण’ पिछले संदर्भ से संबंध स्पष्ट करता है और ‘कहा था’ अगले पद में आने वाले उद्धरण के लिए स्वाभाविक भूमिका बनाता है।
