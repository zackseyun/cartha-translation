  text: ἐγὼ φῶς εἰς τὸν κόσμον ἐλήλυθα, ἵνα πᾶς ὁ πιστεύων εἰς ἐμὲ ἐν τῇ σκοτίᾳ μὴ μείνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/046.yaml
  text: I have come into the world as light[b][a], so that everyone who believes in me may not remain in the darkness.
translation:
  language: hi
  text: मैं संसार में ज्योति बनकर आया हूँ[a], ताकि हर वह व्यक्ति जो मुझ पर विश्वास करता है[b], अन्धकार में न रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक ज्योति के रूप में।’ यूनानी में ‘ज्योति’ के साथ उपपद नहीं है; वाक्यांश को गुणात्मक अर्थ में ‘ज्योति बनकर’ या अधिक शब्दानुसार ‘एक ज्योति के रूप में’ समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जो कोई मुझ पर विश्वास करता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς
  choice: ज्योति बनकर
  rationale: यूनानी में संज्ञा के साथ उपपद नहीं है और प्रयोग गुणात्मक है। ‘ज्योति बनकर’ यीशु की पहचान और भूमिका—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना रूपक को व्याख्यात्मक विस्तार दिए।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: εἰς संसार के क्षेत्र में प्रवेश को दर्शाता है। हिन्दी में ‘संसार में आया हूँ’ इस आगमन की दिशा और देहधारण/मिशन के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλήλυθα
  choice: आया हूँ
  rationale: यूनानी पूर्णकाल पहले हुए आगमन के वर्तमान परिणाम को उभारता है; हिन्दी का पूर्ण वर्तमान ‘आया हूँ’ इस अर्थ को सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य बताता है। ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रहते हुए प्रयोजन का बल बनाए रखता है।
- source_word: πᾶς ὁ πιστεύων
  choice: हर कोई जो विश्वास करता है
  rationale: यह पद विश्वास करने वालों के सामान्य और सर्वसमावेशी वर्ग को सूचित करता है। यह हिन्दी अभिव्यक्ति उस व्यापकता को सहज रूप में रखती है।
- source_word: πιστεύων εἰς ἐμέ
  choice: मुझ पर विश्वास करता है
  rationale: व्यक्ति के साथ πιστεύω εἰς यूहन्ना में यीशु की ओर निर्देशित व्यक्तिगत विश्वास को व्यक्त करता है; ‘मुझ पर विश्वास’ मानक और स्वाभाविक हिन्दी है।
- source_word: ἐν τῇ σκοτίᾳ
  choice: अन्धकार में
  rationale: यूनानी निश्चित उपपद यूहन्ना के लेखन में पहचाने जाने योग्य नैतिक और आत्मिक क्षेत्र की ओर संकेत करता है। हिन्दी में ‘अन्धकार’ यही विषयगत रूपक स्वाभाविक रूप से वहन करता है।
- source_word: μὴ μείνῃ
  choice: न रहे
  rationale: ἵνα के बाद निषेध सहित संभावनार्थक रूप इच्छित नकारात्मक परिणाम या उद्देश्य बताता है। ‘न रहे’ किसी अवस्था में बने रहने के अर्थ को संक्षेप और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: यूहन्ना के ज्योति-रूपक में मसीह की आत्म-पहचान
  choice: यीशु के संसार में ‘ज्योति बनकर’ आने की बात को मूल रूपक के रूप में रखा गया है।
  alternative: ‘मैं संसार में प्रकाश लाने आया हूँ’ जैसा व्याख्यात्मक अनुवाद।
  rationale: मूल पाठ यीशु को केवल ज्योति लाने वाला नहीं, स्वयं ज्योति के रूप में प्रस्तुत करता है। अनुवाद उस मसीह-संबंधी दावे को सुरक्षित रखता है, पर उसकी धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
- issue: πᾶς ὁ πιστεύων में विश्वास करने वालों का दायरा
  choice: ‘हर कोई जो मुझ पर विश्वास करता है’ द्वारा सभी विश्वास करने वालों के वर्ग को व्यक्त किया गया है।
  alternative: ‘जो कोई मुझ पर विश्वास करे’।
  rationale: पद इस वचन में विश्वास करने वाले हर व्यक्ति को सम्मिलित करता है, पर विश्वास की उत्पत्ति के विषय में व्यापक चुनाव या स्वतंत्र इच्छा संबंधी विवादों का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘संसार’, ‘ज्योति’ और ‘अन्धकार’ यूहन्ना के प्रमुख रूपकों की पारंपरिक पहचान बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
