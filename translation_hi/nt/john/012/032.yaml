base_translation:
  language: en
  yaml_path: translation/nt/john/012/032.yaml
  text: And I[a], when I am lifted up from the earth[c][b], will draw all people to myself.
translation:
  language: hi
  text: और मैं, जब पृथ्वी से ऊँचा उठाया जाऊँगा[a][b], तो सब लोगों को अपनी ओर खींचूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं पृथ्वी से ऊँचा उठाया जाऊँ।” यूनानी में शर्तसूचक रूप है, पर प्रसंग में यह यीशु की निकट आती और निश्चित मृत्यु को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: “ऊँचा उठाया जाना” में “महिमित किया जाना” भी निहित हो सकता है; यूहन्ना यहाँ क्रूस पर उठाए जाने और महिमा पाने के दोहरे अर्थ को बनाए रखते हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “सबको।” यूनानी शब्द यहाँ लोगों की ओर संकेत करता है, पर यह पद अपने आप बाद के इस धर्मवैज्ञानिक विवाद का निर्णय नहीं करता कि “सब” का सटीक दायरा क्या है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀγὼ
  choice: और मैं
  rationale: καί + ἐγώ के संयोजन में संबंधसूचक और हल्का बलाघात दोनों हैं; ‘और मैं’ हिन्दी में इन्हें स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐὰν
  choice: जब
  rationale: यद्यपि यूनानी में शर्तसूचक रचना है, यूहन्ना के प्रसंग में यीशु अपनी निकट और निश्चित मृत्यु की बात कर रहे हैं; इसलिए मुख्य पाठ में ‘जब’ स्वाभाविक है, जबकि ‘यदि’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὑψωθῶ
  choice: ऊँचा उठाया जाऊँगा
  rationale: यह अभिव्यक्ति क्रूस पर शारीरिक रूप से उठाए जाने और महिमित किए जाने—यूहन्ना के दोनों आशयों—को खुला रखती है।
- source_word: ἐκ τῆς γῆς
  choice: पृथ्वी से
  rationale: यहाँ γῆ का स्वाभाविक अर्थ पृथ्वी अथवा भूमि है; ‘पृथ्वी से’ क्रूस पर ऊपर उठाए जाने के चित्र और अगले पद की व्याख्या के अनुकूल है।
- source_word: πάντας
  choice: सब लोगों को
  rationale: पुल्लिंग बहुवचन कर्म यहाँ मनुष्यों की ओर संकेत करता है। ‘सब लोगों’ से यह स्पष्ट होता है, पर पद को बाद के उद्धार-विवादों की किसी एक व्याख्या तक सीमित नहीं किया जाता।
- source_word: ἑλκύσω
  choice: खींचूँगा
  rationale: ἕλκω में अपनी ओर खींचने अथवा आकर्षित करने का भाव है; ‘खींचूँगा’ इसकी शक्ति को बनाए रखता है और क्रिया की विधि को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: πρὸς ἐμαυτόν
  choice: अपनी ओर
  rationale: यह हिन्दी में स्वाभाविक ढंग से आत्मवाचक ἐμαυτόν का बल सुरक्षित रखता है।
theological_decisions:
- issue: πάντας का दायरा और उद्धार-संबंधी अर्थ
  choice: सब लोगों को
  alternative: सबको; सभी प्रकार के लोगों को; प्रत्येक व्यक्ति को
  rationale: पद यीशु के खींचने की व्यापकता बताता है, पर यह स्वयं स्पष्ट नहीं करता कि ‘सब’ को बाद की धर्मवैज्ञानिक श्रेणियों में कैसे परिभाषित किया जाए। अनुवाद व्यापक कथन को बनाए रखता है और किसी सांप्रदायिक निष्कर्ष को आरोपित नहीं करता।
- issue: ὑψωθῶ में यूहन्ना का द्विअर्थ
  choice: ऊँचा उठाया जाऊँगा
  alternative: महिमित किया जाऊँगा
  rationale: ‘ऊँचा उठाया जाना’ क्रूस पर चढ़ाए जाने और महिमा पाने, दोनों अर्थों को साथ रखता है; केवल ‘महिमित’ कहने से शारीरिक क्रूसारोहण का संकेत दब जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘ऊँचा उठाया’ जानबूझकर चुना गया है ताकि यूहन्ना का क्रूस और महिमा संबंधी द्विअर्थ बना रहे। पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
