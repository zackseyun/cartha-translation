  yaml_path: translation/nt/john/012/008.yaml
  text: For you always have the poor with you[a], but you do not always have me.
translation:
  language: hi
  text: क्योंकि गरीब हमेशा तुम्हारे साथ हैं[a], लेकिन मैं हमेशा तुम्हारे साथ नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गरीब लोग।” यूनानी में विशेषण का प्रयोग संज्ञा के रूप में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πτωχούς
  choice: गरीब
  rationale: विशेषण यहाँ संज्ञा के रूप में गरीब लोगों के सामान्य वर्ग को दर्शाता है। हिंदी में ‘गरीब’ स्वाभाविक, संक्षिप्त और सम्मानजनक है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण देता है; आधुनिक हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντοτε
  choice: हमेशा
  rationale: दोनों खंडों में निरंतर उपलब्धता या उपस्थिति का भाव है; ‘हमेशा’ सरल और सुसंगत समतुल्य है।
- source_word: ἔχετε
  choice: तुम्हारे साथ हैं / मैं तुम्हारे साथ नहीं हूँ
  rationale: यहाँ क्रिया स्वामित्व नहीं, संगति या उपस्थिति व्यक्त करती है। मुहावरेदार हिंदी में दोनों खंडों को ‘साथ होना’ से व्यक्त करना मूल आशय को ठीक रखता है।
- source_word: μεθ’ ἑαυτῶν
  choice: तुम्हारे साथ
  rationale: वाक्यांश संगति या निकट उपस्थिति को बताता है; ‘तुम्हारे साथ’ स्वाभाविक आधुनिक हिंदी है।
- source_word: ἐμέ
  choice: मैं
  rationale: ग्रीक में कर्मकारक सर्वनाम है, पर हिंदी की ‘साथ होना’ संरचना में स्वाभाविक रूप से कर्ता रूप ‘मैं’ आवश्यक है।
- source_word: δέ
  choice: लेकिन
  rationale: यह गरीबों की सतत उपस्थिति और यीशु की सीमित देहधारी उपस्थिति के बीच स्पष्ट विरोध प्रकट करता है।
- source_word: οὐ πάντοτε
  choice: हमेशा ... नहीं
  rationale: नकार को ‘हमेशा’ के साथ रखकर मूल कथन का अर्थ स्वाभाविक हिंदी में सुरक्षित रहता है।
theological_decisions:
- issue: कथन को गरीबों की देखभाल का महत्त्व घटाने के रूप में समझे जाने की संभावना
  choice: उपस्थिति और समय के सीधे विरोध को बनाए रखा गया है, बिना यह संकेत दिए कि गरीबों की देखभाल कम महत्त्वपूर्ण है।
  alternative: ऐसा व्याख्यात्मक अनुवाद जो गरीबों को कम महत्त्वपूर्ण बताए, या ऐसा नरम अनुवाद जो मूल विरोध को अस्पष्ट कर दे।
  rationale: ग्रीक पाठ गरीबों की सतत उपस्थिति और यीशु की शिष्यों के बीच सीमित उपस्थिति की तुलना करता है। अनुवाद इस तनाव को बनाए रखता है, पर पाठ में न कही गई कोई मूल्य-व्यवस्था नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारे’ बहुवचन श्रोताओं को दर्शाता है। ‘हैं/हूँ’ वाली संरचना हिंदी में ‘अपने साथ रखना’ की तुलना में उपस्थिति का आशय अधिक स्वाभाविक ढंग से व्यक्त करती है।
