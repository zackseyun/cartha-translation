id: JHN.12.35
reference: John 12:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ὁ Ἰησοῦς· Ἔτι μικρὸν χρόνον τὸ φῶς ⸂ἐν ὑμῖν⸃ ἐστιν. περιπατεῖτε ⸀ὡς τὸ φῶς ἔχετε, ἵνα μὴ σκοτία ὑμᾶς καταλάβῃ, καὶ ὁ περιπατῶν ἐν τῇ σκοτίᾳ οὐκ οἶδεν ποῦ ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/035.yaml
  text: So Jesus said to them[a], “The light is still among you for a little while. Walk while you have the light, so that darkness may not overtake you. The one who walks in the darkness does not know where he is going.”
translation:
  language: hi
  text: तब यीशु ने उनसे कहा, “ज्योति अभी थोड़े समय तक तुम्हारे बीच[a] है। जब तक ज्योति तुम्हारे पास है, तब तक चलो, ताकि अंधकार तुम्हें आ न घेरे। जो अंधकार में चलता है, वह नहीं जानता कि कहाँ जा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे भीतर” अथवा “तुम्हारे साथ।” यूनानी वाक्यांश के एक से अधिक अर्थ हो सकते हैं, यद्यपि इस प्रसंग में लोगों के बीच यीशु की वर्तमान सार्वजनिक उपस्थिति के लिए “तुम्हारे बीच” अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले संवाद से कथन को जोड़ने वाला स्वाभाविक हिन्दी संबंधसूचक है और अनावश्यक रूप से कठोर तार्किक निष्कर्ष नहीं जताता।
- source_word: Ἔτι μικρὸν χρόνον
  choice: अभी थोड़े समय तक
  rationale: ἔτι की निरंतरता और μικρὸν χρόνον की अल्प अवधि, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ φῶς
  choice: ज्योति
  rationale: यूहन्ना के प्रकाश-अंधकार रूपक और मसीह-संबंधी अर्थभार को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: तात्कालिक प्रसंग में लोगों के बीच यीशु की सीमित अवधि वाली सार्वजनिक उपस्थिति के लिए सबसे स्वाभाविक है; अन्य संभावित अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: περιπατεῖτε
  choice: चलो
  rationale: यूनानी के चलने वाले रूपक को बनाए रखता है; प्रसंग में जीवन-आचरण का संकेत भी खुला रहता है।
- source_word: ὡς τὸ φῶς ἔχετε
  choice: जब तक ज्योति तुम्हारे पास है
  rationale: ὡς को यहाँ कालवाचक समझना कथन की तात्कालिकता से मेल खाता है और हिन्दी में स्पष्ट है।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: उद्देश्य अथवा अपेक्षित बचाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σκοτία
  choice: अंधकार
  rationale: ज्योति के विपरीत यूहन्ना की प्रमुख छवि को सीधे बनाए रखता है।
- source_word: καταλάβῃ
  choice: आ घेरे
  rationale: अंधकार द्वारा किसी को अचानक पकड़ लेने या अपने घेरे में ले लेने की गतिशील छवि व्यक्त करता है; ‘पराजित करे’ से कम व्याख्यात्मक है।
- source_word: ὁ περιπατῶν
  choice: जो ... चलता है
  rationale: सामान्य अर्थ वाले यूनानी कृदंत को स्वाभाविक हिन्दी संबंधवाचक रचना में व्यक्त करता है।
- source_word: οὐκ οἶδεν ποῦ ὑπάγει
  choice: वह नहीं जानता कि कहाँ जा रहा है
  rationale: दिशाहीनता के वर्तमान और निरंतर भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘ज्योति’ के संबंध में ἐν ὑμῖν का अर्थ
  choice: तुम्हारे बीच
  alternative: तुम्हारे भीतर; तुम्हारे साथ
  rationale: वर्णनात्मक प्रसंग यीशु की भीड़ के बीच वर्तमान सार्वजनिक उपस्थिति की ओर संकेत करता है, इसलिए ‘तुम्हारे बीच’ मुख्य पाठ में उपयुक्त है। फिर भी यूनानी वाक्यांश आंतरिक अथवा साथ होने का अर्थ भी दे सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: περιπατεῖτε की छवि
  choice: चलो
  alternative: जीवन बिताओ; आचरण करो
  rationale: ‘चलो’ मूल रूपक को सुरक्षित रखता है और पाठक को उसके नैतिक एवं अस्तित्वगत आशय को प्रसंग से ग्रहण करने देता है, बजाय उसे सीधे व्याख्या में बदल देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज स्तर अपनाया गया है। ‘ज्योति’ और ‘अंधकार’ साहित्यिक-बाइबलीय प्रतिमाओं को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए स्पष्ट रखी गई है।
