reference: John 12:49
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ἐγὼ ἐξ ἐμαυτοῦ οὐκ ἐλάλησα, ἀλλ’ ὁ πέμψας με πατὴρ αὐτός μοι ἐντολὴν ⸀δέδωκεν τί εἴπω καὶ τί λαλήσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/049.yaml
  text: For I have not spoken from myself[b][a], but the Father who sent me has himself given me a command as to what I should say and what I should speak.
translation:
  language: hi
  text: क्योंकि मैंने अपनी ओर से[a] नहीं बोला, बल्कि मुझे भेजने वाले पिता ने स्वयं मुझे आज्ञा दी है कि मैं क्या कहूँ और क्या बोलूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने आप से’ अथवा ‘अपने अधिकार से’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ दो अलग क्रियाएँ हैं, जिनका अनुवाद क्रमशः ‘कहूँ’ और ‘बोलूँ’ किया गया है। आरंभ में ‘नहीं बोला’ भी उसी दूसरी यूनानी क्रिया का रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξ ἐμαυτοῦ
  choice: अपनी ओर से
  rationale: यह यूनानी मुहावरे के स्रोत और यीशु द्वारा स्वतंत्र रूप से न बोलने के भाव—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: οὐκ ἐλάλησα
  choice: मैंने ... नहीं कहा
  rationale: यूनानी एओरिस्ट को हिन्दी के पूर्ण भूत रूप में रखना प्रसंग में स्वाभाविक है और अब तक के कथन-कार्य की ओर संकेत करता है।
- source_word: ὁ πέμψας με πατὴρ
  choice: पिता ने, जिसने मुझे भेजा है
  rationale: यह कृदन्तीय पदबंध और ‘पिता’ के साथ उसके संबंध को स्पष्ट रखते हुए हिन्दी में सहज वाक्य बनाता है।
- source_word: αὐτός
  choice: स्वयं
  rationale: यूनानी सर्वनाम का बल सुरक्षित रखा गया है।
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: ‘आज्ञा’ आधुनिक हिन्दी में प्रामाणिक निर्देश का अधिकारपूर्ण बल व्यक्त करती है और इस प्रसंग में ‘व्यवस्था’ जैसा अनावश्यक अर्थ नहीं जोड़ती।
- source_word: δέδωκεν
  choice: दी है
  rationale: यूनानी पूर्ण काल को ऐसे कार्य के रूप में व्यक्त करता है जिसका प्रभाव वर्तमान तक बना हुआ है।
- source_word: τί εἴπω καὶ τί λαλήσω
  choice: कि मैं क्या कहूँ और क्या बोलूँ
  rationale: अप्रत्यक्ष प्रश्न और निर्देश का भाव सुरक्षित है; ‘कहना’ तथा ‘बोलना’ यूनानी के दो अलग क्रियापदों की भिन्नता को भी दर्शाते हैं।
theological_decisions:
- issue: पुत्र के वचन और पिता की आज्ञा का संबंध
  choice: यीशु अपनी ओर से स्वतंत्र होकर नहीं बोलते, बल्कि भेजने वाले पिता की आज्ञा के अनुसार बोलते हैं।
  alternative: यीशु केवल एक मानवीय भविष्यद्वक्ता की तरह बोलते हैं; अथवा वह पिता से स्वतंत्र होकर केवल सहमति में बोलते हैं।
  rationale: मूल पाठ मिशन और वाणी के संबंध में पिता पर निर्भरता को स्पष्ट करता है, पर पुत्र के स्वभाव या अस्तित्व के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
- issue: πατήρ का अनुवाद
  choice: पिता
  alternative: जनक
  rationale: यूहन्ना के प्रसंग में यह परमेश्वर के लिए संबंधपरक उपाधि है; ‘पिता’ स्वाभाविक, प्रतिष्ठित और स्पष्ट हिन्दी रूप है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनी ओर से’ स्रोत-मुहावरे और उसके अर्थगत खुलेपन को बनाए रखता है। ‘कहूँ’ और ‘बोलूँ’ की हल्की पुनरुक्ति जानबूझकर रखी गई है ताकि मूल के दो क्रियापद सपाट न हो जाएँ।
