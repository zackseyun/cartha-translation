  text: νῦν κρίσις ἐστὶν τοῦ κόσμου τούτου, νῦν ὁ ἄρχων τοῦ κόσμου τούτου ἐκβληθήσεται ἔξω·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/031.yaml
  text: Now is the judgment of this world[b][a]; now the ruler of this world will be cast out.
translation:
  language: hi
  text: अब इस संसार का न्याय हो रहा है; अब इस संसार का शासक[a][b] बाहर निकाल दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस संसार का अधिपति।’
    reason: lexical_alternative
  - marker: b
    text: ‘इस संसार का शासक’ वाक्यांश सामान्यतः शैतान के लिए समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: νῦν
  choice: अब
  rationale: दोनों स्थानों पर ‘अब’ रखकर यूनानी की बलपूर्ण काल-सूचना और समानांतर रचना सुरक्षित रखी गई है।
- source_word: κρίσις
  choice: न्याय
  rationale: यहाँ शब्द इस संसार पर होने वाले निर्णायक न्याय को व्यक्त करता है; ‘न्याय’ मूल्यांकन और दंडादेश, दोनों की संभावनाओं को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κόσμου τούτου
  choice: इस संसार
  rationale: यह अनुवाद τούτου के संकेतवाचक बल और यूहन्ना में वर्तमान संसार-व्यवस्था से जुड़े विरोधाभास को बनाए रखता है।
- source_word: ἄρχων
  choice: शासक
  rationale: ‘शासक’ आधुनिक हिन्दी में स्पष्ट है और अधिकार रखने वाले व्यक्ति का अर्थ देता है, जबकि ‘राजकुमार’ यहाँ भ्रामक हो सकता है।
- source_word: ἐκβληθήσεται ἔξω
  choice: बाहर निकाल दिया जाएगा
  rationale: यह भविष्यकालीन कर्मवाच्य तथा ἔξω से प्रबल हुई निष्कासन की धारणा, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘इस संसार के शासक’ की पहचान
  choice: मुख्य पाठ में पहचान स्पष्ट किए बिना ‘इस संसार का शासक’ रखा गया है।
  alternative: शैतान/इब्लीस; अथवा वर्तमान संसार-व्यवस्था का मानवीकरण
  rationale: यूहन्ना के व्यापक संदर्भ में यह उपाधि सामान्यतः शैतान के लिए समझी जाती है, पर यूनानी पाठ नाम के बजाय उपाधि देता है। इसलिए पहचान को मुख्य पाठ में आरोपित न करके टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘न्याय हो रहा है’ वर्तमान निर्णायक घटना का भाव देता है, और अर्धविराम मूल के समानांतर दोनों कथनों को जोड़ता है।
