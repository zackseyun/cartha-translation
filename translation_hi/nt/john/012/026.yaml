source:
  edition: SBLGNT
  text: ἐὰν ἐμοί ⸂τις διακονῇ⸃ ἐμοὶ ἀκολουθείτω, καὶ ὅπου εἰμὶ ἐγὼ ἐκεῖ καὶ ὁ διάκονος ὁ ἐμὸς ἔσται· ⸀ἐάν τις ἐμοὶ διακονῇ τιμήσει αὐτὸν ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/026.yaml
  text: If anyone serves me[a], let him follow me; and where I am, there my servant will be also. If anyone serves me, the Father will honor him.
translation:
  language: hi
  text: यदि कोई मेरी सेवा करे[a], तो वह मेरे पीछे चले; और जहाँ मैं हूँ, वहाँ मेरा सेवक भी होगा। यदि कोई मेरी सेवा करे, तो पिता उसका सम्मान करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में सामान्य अर्थ वाली पुल्लिंग एकवचन रचना है: “यदि कोई मेरी सेवा करे … पिता उसका सम्मान करेगा।”'
    reason: source_form
lexical_decisions:
- source_word: διακονῇ (διακονέω)
  choice: सेवा करे
  rationale: यहाँ क्रिया का अर्थ यीशु की सेवा करना है। ‘सेवा करे’ सहज और व्यापक है तथा इसे किसी कलीसियाई पद तक सीमित नहीं करता।
- source_word: ἀκολουθείτω
  choice: वह मेरे पीछे चले
  rationale: यह वर्तमान काल की आज्ञा है और शिष्य के रूप में यीशु का अनुसरण करने का भाव रखती है। हिंदी में यह रूप आज्ञार्थक बल को स्वाभाविक ढंग से व्यक्त करता है, बिना निरंतरता को आवश्यकता से अधिक स्पष्ट किए।
- source_word: διάκονος
  choice: सेवक
  rationale: संदर्भ में यह यीशु की सेवा करने वाले व्यक्ति को दर्शाता है, किसी औपचारिक ‘डीकन’ या धर्माधिकारी के पद को नहीं।
- source_word: ὅπου εἰμὶ ἐγὼ
  choice: जहाँ मैं हूँ
  rationale: यह स्वाभाविक हिंदी है। यूनानी में ἐγώ का बल संदर्भ से पर्याप्त रूप से प्रकट होता है; ‘जहाँ मैं स्वयं हूँ’ अनावश्यक रूप से चिह्नित लगता।
- source_word: ἐκεῖ καὶ
  choice: वहाँ ... भी
  rationale: यह स्थानसूचक ἐκεῖ और योगसूचक καί, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: τιμήσει
  choice: सम्मान करेगा
  rationale: τιμάω यहाँ सम्मान देने का अर्थ रखता है। यह भविष्य की प्रतिज्ञा को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यूनानी पाठ में केवल ‘पिता’ है, ‘मेरा पिता’ नहीं; इसलिए कोई अप्रकट संबंधवाचक शब्द नहीं जोड़ा गया।
- source_word: τις ... αὐτόν
  choice: कोई ... वह/उसका
  rationale: τις का अर्थ सामान्य और समावेशी ‘कोई’ है। हिंदी में ‘वह’ और ‘उसका’ एकवचन संदर्भ को स्वाभाविक रूप से बनाए रखते हैं और किसी विशेष लिंग तक अर्थ को सीमित नहीं करते।
theological_decisions:
- issue: शर्तवाचक कथन में सामान्य एकवचन व्यक्ति का उल्लेख
  choice: ‘यदि कोई’ के साथ आगे ‘वह’ और ‘उसका’ रखा गया है।
  alternative: बहुवचन या स्पष्ट रूप से लिंग-चिह्नित सर्वनामों का प्रयोग करना।
  rationale: यूनानी में सामान्य अर्थ वाला एकवचन τις है और उससे सहमत पुल्लिंग एकवचन रूप आते हैं। हिंदी के ‘कोई’, ‘वह’ और ‘उसका’ इस एकवचन संबंध को स्वाभाविक रूप से रखते हुए किसी एक लिंग तक दायरा सीमित नहीं करते।
- issue: सेवा करने वाले को मिलने वाले सम्मान का स्वरूप
  choice: प्रतिज्ञा को केवल ‘पिता उसका सम्मान करेगा’ के रूप में रखा गया है।
  alternative: इसे मुख्य पाठ में विशेष रूप से स्वर्गीय पुरस्कार या अंतकालीन महिमा बताना।
  rationale: पद दिव्य सम्मान की प्रतिज्ञा करता है, पर यहाँ उसका सटीक स्वरूप नहीं बताता। अनुवाद इस व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘सेवा’, ‘पीछे चले’, ‘सेवक’ और ‘सम्मान’ परिचित शब्द हैं; भाषा को न तो अनावश्यक रूप से संस्कृतनिष्ठ बनाया गया है, न कलीसियाई पदावली से बाँधा गया है।
