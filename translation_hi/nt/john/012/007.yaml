source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς· Ἄφες αὐτήν, ⸀ἵνα εἰς τὴν ἡμέραν τοῦ ἐνταφιασμοῦ μου ⸀τηρήσῃ αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/007.yaml
  text: So Jesus said[a], “Leave her alone[b], so that she may keep it for the day of my burial.”
translation:
  language: hi
  text: इस पर यीशु ने कहा, “उसे रहने दो, ताकि वह इसे मेरे दफ़न के दिन के लिए संभालकर रखे।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे रहने दो; उसने इसे मेरे दफ़न के दिन के लिए संभालकर रखा है।” कुछ लोग इस उपवाक्य को उस काम का वर्णन मानते हैं जो वह पहले ही कर चुकी थी, न कि उस काम का जो उसे आगे करना था।
    reason: alternative_reading
  - marker: b
    text: या, “उसे रहने दो, ताकि वह इसे मेरे दफ़न के दिन तक संभालकर रखे।” यूनानी वाक्य-रचना को अधिक स्पष्ट कालगत अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: इस पर
  rationale: यह शब्द पिछले कथन से कथा और विचार का संबंध जोड़ता है। प्रसंग में “इस पर” स्वाभाविक हिन्दी है और इसे अत्यधिक कठोर निष्कर्ष के रूप में प्रस्तुत नहीं करता।
- source_word: Ἄφες αὐτήν
  choice: उसे छोड़ दो
  rationale: यह आज्ञा यहाँ स्त्री को न रोकने और उससे हस्तक्षेप बंद करने का भाव देती है। “उसे छोड़ दो” संक्षिप्त, सीधा और संवाद में स्वाभाविक है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम का उपवाक्य आरम्भ करता है। “ताकि” यूनानी वाक्य के संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: εἰς τὴν ἡμέραν
  choice: दिन के लिए
  rationale: यह आगे आने वाले अवसर की ओर संकेत कर सकता है। मुख्य पाठ में “के लिए” चुनने से “तक” वाले अधिक स्पष्ट कालगत अर्थ को अनिवार्य नहीं बनाया गया है।
- source_word: ἐνταφιασμοῦ
  choice: दफ़नाए जाने
  rationale: यह दफ़न अथवा कब्र में रखे जाने की क्रिया को बताता है। “दफ़नाए जाने” आधुनिक हिन्दी में स्पष्ट है और अनावश्यक तकनीकी भाषा से बचता है।
- source_word: τηρήσῃ
  choice: रखे
  rationale: τηρέω यहाँ किसी वस्तु को किसी निश्चित अवसर के लिए बचाकर रखने का अर्थ दे सकता है। ἵνα के बाद संभाव्य क्रिया को हिन्दी के “ताकि…रखे” से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: αὐτό
  choice: इसे
  rationale: नपुंसकलिंग सर्वनाम का संकेत सुगंधित तेल की ओर है। “इसे” मूल के सर्वनाम को बनाए रखता है और पाठ में कोई व्याख्यात्मक संज्ञा नहीं जोड़ता।
theological_decisions:
- issue: यीशु के कथन में अभिषेक और उनके आने वाले दफ़न का संबंध
  choice: 'वाक्य को उद्देश्यसूचक और आगे की ओर संकेत करने वाले कथन के रूप में रखा गया है: “ताकि वह इसे…दिन के लिए रखे।”'
  alternative: इसे पूर्ण हो चुकी क्रिया के रूप में, “उसने इसे मेरे दफ़नाए जाने के दिन के लिए रखा था,” अथवा स्पष्ट कालगत अर्थ में, “वह इसे…दिन तक रखे,” समझा जा सकता है।
  rationale: यूनानी वाक्य-विन्यास कठिन है और एक से अधिक अर्थों में समझा गया है। मुख्य पाठ Ἄφες…ἵνα…τηρήσῃ की प्रत्यक्ष उद्देश्यसूचक रचना को बनाए रखता है, जबकि वास्तविक अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “इस पर” कथा-संबंध को स्वाभाविक बनाता है; “उसे छोड़ दो” यीशु की सीधी आज्ञा की शक्ति बनाए रखता है। कठिन यूनानी उपवाक्य को मुख्य पाठ में अनावश्यक रूप से नहीं सुलझाया गया, और दोनों प्रमुख विकल्प पादटिप्पणियों में दिए गए हैं।
