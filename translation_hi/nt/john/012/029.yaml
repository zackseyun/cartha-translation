id: JHN.12.29
reference: John 12:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ οὖν ὄχλος ὁ ἑστὼς καὶ ἀκούσας ἔλεγεν βροντὴν γεγονέναι· ἄλλοι ἔλεγον· Ἄγγελος αὐτῷ λελάληκεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/029.yaml
  text: So the crowd that was standing there and had heard it was saying that thunder had happened; others were saying[a], “An angel has spoken to him.”
translation:
  language: hi
  text: इसलिए वहाँ खड़ी भीड़ यह सुनकर कह रही थी कि गरज हुई है;[a] दूसरे कह रहे थे, “एक स्वर्गदूत ने उससे बात की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “गड़गड़ाहट हुई है।”
    reason: यूनानी βροντὴν γεγονέναι में ‘गरज/गड़गड़ाहट के होने’ की अभिव्यक्ति का निकटतर, वैकल्पिक रूप दर्ज करने के लिए।
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद में सुनाई दी आवाज़ से भीड़ की प्रतिक्रिया को जोड़ता है; ‘इसलिए’ संबंधसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ οὖν ὄχλος ὁ ἑστὼς
  choice: इसलिए वहाँ खड़ी भीड़
  rationale: ὄχλος के लिए ‘भीड़’ सामान्य आधुनिक हिन्दी है; सिद्ध कृदन्त ἑστὼς दृश्य में भीड़ की विद्यमान स्थिति को ‘वहाँ खड़ी’ से व्यक्त करता है।
- source_word: καὶ ἀκούσας
  choice: ने जब यह सुना
  rationale: ἀκούσας की मुख्य क्रिया से पूर्ववर्ती क्रिया को ‘जब ... सुना’ स्वाभाविक ढंग से व्यक्त करता है; ‘यह’ पिछले पद की आवाज़/ध्वनि की ओर संकेत करता है, जिसका कर्म यूनानी में निहित है।
- source_word: ἔλεγεν
  choice: कहने लगी
  rationale: अपूर्ण काल के जारी या सामूहिक कथन को हिन्दी में ‘कहने लगी’ सहज रूप से व्यक्त करता है।
- source_word: βροντὴν γεγονέναι
  choice: बादल गरजा है
  rationale: शाब्दिक संरचना ‘गर्जन हुआ है’ हिन्दी में अस्वाभाविक है; ‘बादल गरजा है’ उसी श्रव्य घटना को सामान्य, मुहावरेदार हिन्दी में व्यक्त करता है और सिद्ध infinitive की परिणामी प्रासंगिकता बनाए रखता है।
- source_word: ἄλλοι
  choice: दूसरे
  rationale: यह भीड़ के भीतर एक अन्य समूह के विपरीत मत को संक्षेप और स्वाभाविक रूप से दर्शाता है।
- source_word: Ἄγγελος
  choice: एक स्वर्गदूत
  rationale: प्रसंग में भीड़ किसी स्वर्गीय प्राणी द्वारा यीशु से बोलने की बात समझती है; ‘स्वर्गदूत’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: αὐτῷ
  choice: उससे
  rationale: λαλέω के साथ दत्तिव को हिन्दी में ‘उससे बात की’ स्वाभाविक रूप से व्यक्त करता है; सर्वनाम का संदर्भ यीशु है।
- source_word: λελάληκεν
  choice: बात की है
  rationale: सिद्ध काल के पूर्ण कार्य और वर्तमान प्रासंगिकता को ‘की है’ बनाए रखता है; ‘बात की’ अकेले ‘बोला’ से अधिक स्वाभाविक है।
theological_decisions:
- issue: स्वर्गीय वक्ता के बारे में भीड़ की धारणा
  choice: एक स्वर्गदूत ने उससे बात की है
  alternative: एक दूत ने उससे बात की है
  rationale: ἄγγελος का मूल अर्थ ‘दूत’ हो सकता है, पर यहाँ पिछले पद की स्वर्गीय आवाज़ की व्याख्या के प्रसंग में अलौकिक प्राणी अभिप्रेत है। यह कथन भीड़ की धारणा के रूप में ही रखा गया है, कथावाचक की पुष्टि के रूप में नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘वहाँ खड़ी भीड़’ दृश्य को स्पष्ट रखता है; प्रत्यक्ष कथन भीड़ के दो अलग-अलग आकलनों को जीवंत ढंग से प्रस्तुत करते हैं। मुख्य पाठ में मुहावरेदार ‘बादल गरजा है’ है और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
