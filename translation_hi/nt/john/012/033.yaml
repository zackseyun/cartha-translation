  text: He was saying this to signify what kind of death he was about to die[a].
translation:
  language: hi
  text: उसने यह बात यह संकेत करने के लिए कही कि वह किस प्रकार की मृत्यु मरने वाला था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह किस ढंग से मरने वाला था।” यूनानी अभिव्यक्ति मृत्यु के ढंग पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: यह बात
  rationale: नपुंसकलिंग एकवचन संकेतवाचक शब्द यीशु के ठीक पहले के कथन की ओर संकेत करता है; हिन्दी में ‘यह बात’ स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: यहाँ δέ हल्का संयोजक या संक्रमणसूचक है। हिन्दी वाक्य में कोई अतिरिक्त ‘अब’ या प्रबल ‘परन्तु’ जोड़ना अनावश्यक और भ्रामक होता।
- source_word: ἔλεγεν
  choice: कही
  rationale: यूनानी अपूर्णकाल संदर्भगत भूतकालीन कथन को दिखाता है। हिन्दी में ‘कह रहा था’ सम्भव है, पर इस व्याख्यात्मक वाक्य में ‘कही’ अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: σημαίνων
  choice: संकेत देने के लिए
  rationale: यह कृदन्त बताता है कि उस कथन के द्वारा मृत्यु के प्रकार का संकेत दिया गया। ‘संकेत देने’ से यूहन्ना की अप्रत्यक्ष अभिव्यक्ति बनी रहती है।
- source_word: ποίῳ θανάτῳ
  choice: किस प्रकार की मृत्यु
  rationale: यह पद केवल मृत्यु के तथ्य को नहीं, बल्कि उसके प्रकार या ढंग को व्यक्त करता है।
- source_word: ἤμελλεν
  choice: मरने वाला था
  rationale: μέλλω भावी और प्रसंग में निकट घटना को सूचित करता है। यह हिन्दी प्रयोग स्वाभाविक है और ‘नियत था’ जैसी अधिक प्रबल धर्मवैज्ञानिक धारणा नहीं जोड़ता।
- source_word: ἀποθνῄσκειν
  choice: मरने
  rationale: यह ἤμελλεν का पूरक अनन्तरूप है; हिन्दी में ‘मरने वाला था’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: क्या क्रूस पर मृत्यु को पद में स्पष्ट कर दिया जाए
  choice: 'अप्रत्यक्ष शब्दावली बनाए रखी: ‘किस प्रकार की मृत्यु’'
  alternative: ‘वह क्रूस पर मरने वाला था’ या ‘उसे किस प्रकार मृत्युदण्ड दिया जाने वाला था’
  rationale: प्रसंग क्रूस पर मृत्यु की ओर संकेत करता है, पर यह पद स्वयं उसे नाम से नहीं कहता। इसलिए मूल की अप्रत्यक्षता और कथात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘यह बात’ पिछले कथन से संबंध स्पष्ट करता है, और अनावश्यक संक्रमणसूचक ‘अब’ नहीं जोड़ा गया है।
