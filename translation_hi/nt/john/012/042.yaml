  yaml_path: translation/nt/john/012/042.yaml
  text: Nevertheless, even among the rulers many believed in him, but because of the Pharisees they were not confessing it, so that they might not become excluded from the synagogue.
translation:
  language: hi
  text: फिर भी, अधिकारियों में से भी बहुतों ने उस पर विश्वास किया; पर फरीसियों के कारण वे इसका अंगीकार नहीं करते थे, ताकि वे सभागृह से बहिष्कृत न हो जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभागृह से निकाल न दिए जाएँ” या “सभागृह से निष्कासित न हो जाएँ।” यूनानी शब्द सभागृह के समुदाय से बाहर किए जाने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅμως μέντοι
  choice: फिर भी
  rationale: दोनों अव्ययों का संयुक्त प्रयोग प्रबल विरोध और रियायत का भाव देता है; आधुनिक हिन्दी में ‘फिर भी’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ ἐκ τῶν ἀρχόντων πολλοὶ
  choice: शासकों में से भी बहुतों ने
  rationale: ἐκ समूह के भीतर से होने का भाव देता है, और ἄρχοντες यहाँ नेतृत्व अथवा अधिकार रखने वाले लोगों को सूचित करता है।
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: उस पर विश्वास किया
  rationale: यूहन्ना में πιστεύω εἰς यीशु की ओर निर्देशित व्यक्तिगत विश्वास को व्यक्त करता है; ‘उस पर विश्वास किया’ हिन्दी में सटीक और स्वाभाविक है।
- source_word: διὰ τοὺς Φαρισαίους
  choice: फरीसियों के कारण
  rationale: διά के साथ कर्मकारक कारण बताता है। प्रसंग में भय निहित हो सकता है, पर मूल पदबंध में वह स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: οὐχ ὡμολόγουν
  choice: वे इसका अंगीकार नहीं करते थे
  rationale: अपूर्ण काल लगातार अथवा बार-बार अंगीकार न करने का संकेत देता है। यूनानी में कर्म प्रत्यक्ष रूप से नहीं दिया गया; ‘इसका’ पिछले कथन की ओर संकेत करता है और अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह उस परिणाम से बचने के उद्देश्य को व्यक्त करता है।
- source_word: ἀποσυνάγωγοι γένωνται
  choice: यहूदी सभागृह से बहिष्कृत न कर दिए जाएँ
  rationale: ἀποσυνάγωγος सभागृह-समुदाय से बाहर किए जाने को सूचित करता है; यह अनुवाद सामाजिक और धार्मिक बहिष्कार का भाव स्पष्ट रखता है।
theological_decisions:
- issue: यूहन्ना के धर्मविज्ञान के प्रकाश में शासकों के विश्वास का स्वरूप
  choice: ἐπίστευσαν का सीधा अनुवाद ‘विश्वास किया’ किया गया है, जबकि उनके अंगीकार न करने की बात भी यथावत रखी गई है।
  alternative: इसे केवल ऊपरी विश्वास कहना, अथवा इसे स्पष्ट रूप से उद्धारदायी विश्वास घोषित करना।
  rationale: पद उनके विश्वास और सार्वजनिक अंगीकार की कमी, दोनों को साथ रखता है। अनुवाद को इस तनाव को बनाए रखना चाहिए और उनके विश्वास की अंतिम आध्यात्मिक स्थिति तय नहीं करनी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘यहूदी सभागृह’ सामान्य पाठक के लिए स्थान और समुदाय दोनों का प्रसंग स्पष्ट करता है; पादटिप्पणी बहिष्कार के वैकल्पिक स्वाभाविक रूप को देती है।
