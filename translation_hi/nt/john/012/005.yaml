id: JHN.12.5
reference: John 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Διὰ τί τοῦτο τὸ μύρον οὐκ ἐπράθη τριακοσίων δηναρίων καὶ ἐδόθη πτωχοῖς;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/005.yaml
  text: Why was this perfume not sold for three hundred denarii and given to the poor?[a]
translation:
  language: hi
  text: “यह इत्र तीन सौ दीनार में बेचकर उसका धन गरीबों को क्यों नहीं दिया गया?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक दीनार किसी मजदूर की एक दिन की सामान्य मजदूरी थी; काम न किए जाने वाले दिनों को ध्यान में रखें तो तीन सौ दीनार लगभग एक वर्ष की कमाई के बराबर थे।
    reason: cultural_note
lexical_decisions:
- source_word: Διὰ τί
  choice: क्यों नहीं
  rationale: नकारात्मक प्रश्न में यूनानी Διὰ τί ... οὐκ का स्वाभाविक आधुनिक हिन्दी रूप ‘क्यों नहीं’ है।
- source_word: μύρον
  choice: इत्र
  rationale: यह महँगे सुगंधित द्रव्य को दर्शाता है; ‘इत्र’ सामान्य पाठक के लिए सहज और प्रसंगानुकूल है।
- source_word: ἐπράθη
  choice: बेचकर
  rationale: यूनानी में कर्मवाच्य ‘नहीं बेचा गया’ है, पर संयुक्त प्रश्न का स्वाभाविक हिन्दी रूप ‘बेचकर ... क्यों नहीं दिया गया’ वही आशय और भूतकालीन शिकायत बनाए रखता है।
- source_word: τριακοσίων δηναρίων
  choice: तीन सौ दीनार में
  rationale: मूल ऐतिहासिक मुद्रा और मूल्य-संबंध को सुरक्षित रखता है; उसका आर्थिक परिमाण पादटिप्पणी में समझाया गया है।
- source_word: ἐδόθη
  choice: उसका धन ... नहीं दिया गया
  rationale: सिर्फ इत्र बेचने के बाद प्राप्त राशि ही गरीबों को दी जा सकती थी; ‘उसका धन’ हिन्दी में निहित आशय स्पष्ट करता है, जबकि कर्मवाच्य संरचना बनाए रखता है।
- source_word: πτωχοῖς
  choice: गरीबों को
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण का सीधा, स्वाभाविक और सम्मानजनक हिन्दी रूप।
