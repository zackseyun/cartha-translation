  text: ἠγάπησαν γὰρ τὴν δόξαν τῶν ἀνθρώπων μᾶλλον ἤπερ τὴν δόξαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/043.yaml
  text: For they loved the glory of men rather than the glory of God[a].
translation:
  language: hi
  text: क्योंकि उन्होंने मनुष्यों से मिलने वाली महिमा को परमेश्वर से मिलने वाली महिमा से अधिक प्रेम किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγάπησαν
  choice: अधिक प्रिय समझा
  rationale: ἀγαπάω का मूल भाव प्रेम और गहरे लगाव का है; तुलनात्मक वाक्यांश के साथ यह चुनाव या प्राथमिकता व्यक्त करता है। हिंदी में ‘अधिक प्रिय समझा’ दोनों पक्षों को स्वाभाविक रूप से सामने लाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण बताता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट कारणसूचक संयोजक है।
- source_word: δόξαν
  choice: महिमा
  rationale: δόξα के दोनों प्रयोगों में एक ही शब्द रखकर यूनानी की पुनरावृत्ति और यूहन्ना में उसके व्यापक धार्मिक अर्थ को सुरक्षित रखा गया है; ‘प्रशंसा’ या ‘स्वीकृति’ इसके अर्थ को अधिक संकीर्ण कर देते।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों से मिलने वाली
  rationale: ἄνθρωποι यहाँ समस्त मनुष्यों के लिए है, इसलिए ‘मनुष्यों’ लिंग-समावेशी और अर्थ-सटीक है। संबंधकारक को ‘से मिलने वाली’ कहना इस संदर्भ में महिमा के स्रोत का स्वाभाविक हिंदी रूप है।
- source_word: μᾶλλον ἤπερ
  choice: से अधिक
  rationale: यह तुलनात्मक युग्म दो प्रकार की महिमा के बीच प्राथमिकता व्यक्त करता है; ‘से अधिक’ हिंदी में उस तुलना को सीधे व्यक्त करता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर से मिलने वाली
  rationale: समानांतर संबंधकारक को पहले पद की तरह स्रोत के अर्थ में व्यक्त किया गया है, जबकि ‘महिमा’ शब्द को दोनों जगह समान रखा गया है।
theological_decisions:
- issue: मनुष्यों और परमेश्वर के संदर्भ में δόξα का अर्थ
  choice: महिमा
  alternative: प्रशंसा / आदर / स्वीकृति
  rationale: ‘महिमा’ स्रोत की शब्दगत समानता और यूहन्ना के धर्मवैचारिक प्रतिध्वनि को सुरक्षित रखती है। संदर्भ में प्रशंसा या स्वीकृति का भाव निहित हो सकता है, पर उन्हें मुख्य पाठ में रखना अर्थ को अनावश्यक रूप से संकीर्ण करेगा।
- issue: δόξα के साथ संबंधकारक का संबंध
  choice: से मिलने वाली महिमा
  alternative: की महिमा
  rationale: संबंधकारक व्याकरणतः स्रोत या संबंध/अधिकार, दोनों का संकेत दे सकता है। इस संदर्भ में लोगों और परमेश्वर से मिलने वाला सम्मान प्रमुख भाव है; ‘से मिलने वाली’ हिंदी में स्पष्ट और स्वाभाविक है, पर ‘महिमा’ को बनाए रखने से शब्द की व्यापकता बनी रहती है।
- issue: ἀνθρώπων का लिंग-संदर्भ
  choice: मनुष्यों
  alternative: लोगों / मनुष्यों की
  rationale: यहाँ यूनानी शब्द सामान्यतः मानव समुदाय को दर्शाता है, केवल पुरुषों को नहीं। ‘मनुष्यों’ आधुनिक हिंदी में सटीक, गरिमापूर्ण और लिंग-समावेशी है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘महिमा’ की पुनरावृत्ति मूल यूनानी के समानांतर बल को सुरक्षित रखती है।
