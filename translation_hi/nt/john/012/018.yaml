  text: διὰ τοῦτο ⸀καὶ ὑπήντησεν αὐτῷ ὁ ὄχλος ὅτι ⸀ἤκουσαν τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/018.yaml
  text: For this reason also the crowd went to meet him[b][a], because they heard that he had done this sign.
translation:
  language: hi
  text: इसी कारण भीड़ भी उनसे मिलने गई[a], क्योंकि भीड़ ने सुना था कि उन्होंने यह चिन्ह किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीड़ उनसे मिली” अथवा “भीड़ उनसे मिलने निकल पड़ी।” यूनानी क्रिया में किसी की ओर जाकर मिलने का भाव शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “चिन्ह” यूहन्ना द्वारा चमत्कारपूर्ण कार्य के लिए प्रयुक्त विशिष्ट शब्द है, जो अपने से आगे यीशु की पहचान और उनके कार्य की ओर संकेत करता है; दूसरा अनुवाद, “चमत्कार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद को पिछले प्रसंग से स्पष्ट कारणात्मक रूप से जोड़ता है और διά के कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: καὶ
  choice: भी
  rationale: यह भीड़ की कार्रवाई में निहित योजक बल को बिना अनावश्यक जोर दिए व्यक्त करता है।
- source_word: ὑπήντησεν αὐτῷ
  choice: उनसे मिलने गई
  rationale: क्रिया में किसी की ओर जाकर मिलने का भाव है। आदरसूचक ‘उनसे’ आधुनिक हिन्दी में यीशु के संदर्भ में स्वाभाविक है।
- source_word: ὁ ὄχλος
  choice: भीड़
  rationale: यह ὄχλος का सामान्य, वर्तमान और सहज हिन्दी पर्याय है।
- source_word: ὅτι ἤκουσαν
  choice: क्योंकि लोगों ने सुना था
  rationale: ὅτι यहाँ कारण बताता है। यूनानी बहुवचन क्रिया का कर्ता अर्थतः भीड़ के लोग हैं; हिन्दी में ‘लोगों ने’ कहने से वाक्य व्याकरणसम्मत और स्पष्ट रहता है। पूर्वकालिक सुनने की घटना के लिए ‘सुना था’ स्वाभाविक है।
- source_word: τοῦτο αὐτὸν πεποιηκέναι τὸ σημεῖον
  choice: उन्होंने यह चिन्ह किया है
  rationale: ‘यह’ निकट पूर्ववर्ती विशेष कार्य की ओर संकेत करता है। पूर्ण infinitive उस संपन्न कार्य की वर्तमान प्रासंगिकता रखता है; परोक्ष कथन में हिन्दी का ‘किया है’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ σημεῖον
  choice: यह चिन्ह
  rationale: यूहन्ना में σημεῖον ऐसा आश्चर्यकर्म है जो यीशु की पहचान और कार्य की ओर संकेत करता है; ‘चिन्ह’ इस अर्थ को केवल ‘चमत्कार’ कहने की अपेक्षा अधिक सुरक्षित रखता है।
theological_decisions:
- issue: यूहन्ना के विशिष्ट शब्द σημεῖον का अनुवाद
  choice: चिन्ह
  alternative: चमत्कार
  rationale: ‘चिन्ह’ कार्य के आश्चर्यजनक होने के साथ उसके संकेतात्मक और प्रकाशनकारी महत्व को भी बनाए रखता है, जबकि ‘चमत्कार’ मुख्यतः अद्भुतता पर बल दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। यीशु के लिए आदरसूचक बहुवचन रखा गया है। मुख्य पाठ में कारणात्मक संबंध, भीड़ के जाकर मिलने की दिशा और ‘चिन्ह’ की यूहन्नाई शब्दावली सुरक्षित रखी गई है।
