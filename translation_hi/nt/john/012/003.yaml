id: JHN.12.3
reference: John 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ οὖν ⸀Μαριὰμ λαβοῦσα λίτραν μύρου νάρδου πιστικῆς πολυτίμου ἤλειψεν τοὺς πόδας τοῦ Ἰησοῦ καὶ ἐξέμαξεν ταῖς θριξὶν αὐτῆς τοὺς πόδας αὐτοῦ· ἡ δὲ οἰκία ἐπληρώθη ἐκ τῆς ὀσμῆς τοῦ μύρου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/003.yaml
  text: Then Mary took a litra of costly pure nard perfume[a], anointed Jesus's feet, and wiped his feet with her hair[c][b]. And the house was filled with the fragrance of the perfume.
translation:
  language: hi
  text: तब मरियम ने बहुमूल्य शुद्ध जटामांसी का एक लित्रा[a] सुगंधित तेल लिया, यीशु के पाँवों पर लगाया और अपने बालों से उनके पाँव पोंछे। तेल की सुगंध से सारा घर भर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक लित्रा रोमी भार-माप था, जो लगभग 327 ग्राम के बराबर था।
    reason: cultural_note
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले प्रसंग से कथा को आगे बढ़ाने वाला संबंधसूचक है; हिन्दी कथा में ‘तब’ स्वाभाविक है और अनावश्यक निष्कर्षात्मक बल नहीं देता।
- source_word: λίτραν
  choice: लगभग एक रोमी पौंड
  rationale: λίτρα रोमी भार-माप था। ‘रोमी पौंड’ प्राचीन इकाई की पहचान बनाए रखता है, जबकि ‘लगभग’ आधुनिक पौंड से संभावित भ्रम घटाता है; सही परिमाण पादटिप्पणी में दिया गया है।
- source_word: μύρου
  choice: सुगंधित तेल
  rationale: μύρον सुगंधयुक्त तेल या लेप को सूचित करता है जिसे शरीर पर लगाया जाता था। आधुनिक हिन्दी में ‘सुगंधित तेल’ क्रिया और बाद की सुगंध—दोनों के साथ स्पष्ट और स्वाभाविक है।
- source_word: νάρδου
  choice: जटामांसी
  rationale: νάρδος के लिए प्रचलित हिन्दी वनस्पति-सुगंधद्रव्य नाम ‘जटामांसी’ चुना गया है; इससे पदार्थ की विशिष्टता बनी रहती है।
- source_word: πιστικῆς
  choice: शुद्ध
  rationale: विशेषण का अर्थ विवादित है। ‘शुद्ध’ संदर्भ में महँगी और असली गुणवत्ता का स्वाभाविक संकेत देता है, पर अनिश्चितता को पादटिप्पणी में स्पष्ट रखा गया है।
- source_word: πολυτίμου
  choice: बहुमूल्य
  rationale: यह अत्यधिक मूल्यवान या महँगा होने को व्यक्त करता है। ‘बहुमूल्य’ गरिमापूर्ण, सहज हिन्दी है और आर्थिक मूल्य के साथ मूल्यवान होने का भाव रखता है।
- source_word: ἤλειψεν
  choice: लगाया
  rationale: ἀλείφω यहाँ सुगंधित तेल शरीर पर लगाने की क्रिया है। ‘लगाया’ भौतिक क्रिया को स्पष्ट रखता है और हिन्दी में ‘अभिषेक किया’ से जुड़ सकने वाले अनावश्यक धार्मिक या राजकीय अर्थ को आरोपित नहीं करता।
- source_word: ἐξέμαξεν
  choice: पोंछे
  rationale: क्रिया पोंछने या सुखाने का अर्थ देती है। बालों को साधन बताने के साथ ‘पोंछे’ सीधा और स्वाभाविक है।
- source_word: ταῖς θριξὶν αὐτῆς
  choice: अपने बालों से
  rationale: साधनवाचक दत्तिव का सहज हिन्दी रूप, जो मरियम के अपने बाल होने को स्पष्ट रखता है।
- source_word: ἐπληρώθη ἐκ τῆς ὀσμῆς
  choice: सुगंध से सारा घर भर गया
  rationale: निष्क्रिय यूनानी रचना का यह स्वाभाविक हिन्दी रूप है; ‘सारा’ घर में सुगंध के फैल जाने के भाव को स्पष्ट करता है।
theological_decisions:
- issue: तेल लगाने की क्रिया में संभावित अभिषेक-संबंधी संकेत
  choice: मुख्य पाठ में ‘यीशु के पाँवों पर लगाया’
  alternative: ‘यीशु के पाँवों का अभिषेक किया’
  rationale: मूल क्रिया सुगंधित तेल लगाने को निश्चित रूप से बताती है और प्रतीकात्मक अर्थ की संभावना खुली रखती है, पर इस संदर्भ में हिन्दी ‘अभिषेक’ राजकीय, संस्कारगत या औपचारिक धार्मिक अर्थ को आवश्यकता से अधिक उभार सकता है। इसलिए प्रत्यक्ष क्रिया का अनुवाद किया गया है, बिना संभावित प्रतीकात्मक प्रतिध्वनि का निषेध किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। प्राचीन माप को ‘रोमी पौंड’ के रूप में पहचाना गया और पादटिप्पणी में ग्राम-मान दिया गया। ‘जटामांसी’ पदार्थ की विशिष्टता बनाए रखता है। मुख्य पाठ में केवल वही दो पादटिप्पणी-चिह्न हैं जिनकी पादटिप्पणियाँ दी गई हैं।
