  text: ὁ δὲ Ἰησοῦς ⸀ἀποκρίνεται αὐτοῖς λέγων· Ἐλήλυθεν ἡ ὥρα ἵνα δοξασθῇ ὁ υἱὸς τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/023.yaml
  text: But Jesus answered them[a], saying[b], “The hour has come for the Son of Man to be glorified.”
translation:
  language: hi
  text: पर यीशु ने उन्हें उत्तर दिया, “वह घड़ी[a] आ पहुँची है कि मनुष्य का पुत्र[b] महिमा पाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह समय आ पहुँचा है।” यूनानी में शाब्दिक रूप से “घड़ी” है। यूहन्ना में यह यीशु के दुःख और महिमा के लिए ठहराए हुए निर्णायक समय का बार-बार आने वाला संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “मानव-पुत्र।” यूनानी पदवी दानिय्येल 7 की प्रतिध्वनि करती है; उसके धर्मवैचारिक और अंतर्पाठीय बल के कारण मुख्य पाठ में “मनुष्य का पुत्र” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποκρίνεται αὐτοῖς λέγων
  choice: उन्हें उत्तर दिया
  rationale: यूनानी वर्तमान काल यहाँ कथात्मक वर्तमान है। आधुनिक हिन्दी में भूतकाल स्वाभाविक है। प्रत्यक्ष कथन आरम्भ होने के कारण λέγων को अलग से ‘कहते हुए’ कहना अनावश्यक और बोझिल होता।
- source_word: Ἐλήλυθεν
  choice: आ पहुँची है
  rationale: पूर्णकाल किसी ऐसी घटना को व्यक्त करता है जिसका परिणाम अभी विद्यमान है। ‘आ पहुँची है’ निर्णायक घड़ी के अब उपस्थित हो जाने पर बल देता है।
- source_word: ἡ ὥρα
  choice: वह घड़ी
  rationale: ‘घड़ी’ यूहन्ना में यीशु के ठहराए हुए दुःख और महिमा के निर्णायक समय का आवर्ती संकेत सुरक्षित रखती है; ‘वह’ निश्चित उपपद के विशिष्ट भाव को व्यक्त करता है।
- source_word: ἵνα δοξασθῇ
  choice: जब … महिमा पाए
  rationale: इस प्रसंग में ἵνα उस घड़ी की परिणति अथवा विषय बताता है। ‘जब’ आधुनिक हिन्दी में स्वाभाविक है, और ‘महिमा पाए’ δοξασθῇ के निष्क्रिय अर्थ तथा उसके गहरे यूहन्नाई आशय को सहज भाषा में रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी है और दानिय्येल 7 की प्रतिध्वनि को बनाए रखती है; इसे केवल सामान्य मानवता के अर्थ में समतल नहीं किया गया।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου की मसीही पदवी
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ हिन्दी बाइबिल परम्परा में पहचानी जाने वाली पदवी है और दानिय्येल 7 तथा यूहन्ना के मसीही और युगान्तकारी संकेतों को सुरक्षित रखती है।
- issue: Ἐλήλυθεν ἡ ὥρα का कालगत और धर्मवैचारिक बल
  choice: वह घड़ी आ पहुँची है
  alternative: वह समय आ गया है
  rationale: ‘घड़ी’ यूहन्ना के आवर्ती संकेत को बनाए रखती है, जबकि ‘आ पहुँची है’ यूनानी पूर्णकाल के इस भाव को व्यक्त करता है कि ठहराया हुआ निर्णायक क्षण अब उपस्थित है।
- issue: δοξασθῇ की निष्क्रियता और महिमा का अर्थ
  choice: महिमा पाए
  alternative: महिमित किया जाए
  rationale: ‘महिमा पाए’ सहज हिन्दी में निष्क्रिय आशय को व्यक्त करता है और महिमा देने वाले कर्ता को अनकहा रहने देता है, जैसा यूनानी पाठ करता है। यह मृत्यु, पुनरुत्थान और ऊँचा उठाए जाने के बीच यूहन्नाई तनाव को भी समय से पहले नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पर’ संवाद का स्वाभाविक विरोध-सूचक है। यूनानी के ‘उत्तर देता है … कहते हुए’ को हिन्दी में अनावश्यक पुनरुक्ति से बचाते हुए ‘उत्तर दिया’ और सीधे उद्धरण के रूप में प्रस्तुत किया गया है।
