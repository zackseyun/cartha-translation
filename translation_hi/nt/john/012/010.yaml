  text: ἐβουλεύσαντο δὲ οἱ ἀρχιερεῖς ἵνα καὶ τὸν Λάζαρον ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/010.yaml
  text: So the chief priests decided to kill Lazarus also,[a]
translation:
  language: hi
  text: तब प्रधान याजकों ने लाज़र को भी मार डालने का निश्चय किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाज़र को भी मार डालने की योजना बनाई।”
    reason: ἐβουλεύσαντο विचार-विमर्श से बने निर्णय अथवा योजना का भाव रख सकता है; मुख्य पाठ में ठोस निश्चय और पादटिप्पणी में संभावित वैकल्पिक भाव दिया गया है।
lexical_decisions:
- source_word: ἐβουλεύσαντο
  choice: निश्चय किया
  rationale: यह क्रिया विचार-विमर्श से निकले ठोस इरादे को व्यक्त करती है। ‘निश्चय किया’ आधुनिक हिन्दी में स्वाभाविक है और निर्णय तथा संकल्प—दोनों भावों को बनाए रखता है।
- source_word: δὲ
  choice: इसलिए
  rationale: यह संयोजक पिछले प्रसंग से कथा की कारण-परिणामगत प्रगति को जोड़ता है। यहाँ ‘इसलिए’ उस प्रवाह को स्वाभाविक रूप से व्यक्त करता है, यद्यपि केवल ‘और’ भी संभव है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन पद यहाँ महायाजकीय नेतृत्व-वर्ग को सूचित करता है; ‘प्रधान याजक’ हिन्दी बाइबलीय प्रयोग में सटीक और परिचित है।
- source_word: ἵνα
  choice: मार डालने का
  rationale: निर्णय की क्रिया के बाद ἵνα और संभावनार्थक क्रिया निर्णय की अभिप्रेत कार्रवाई को व्यक्त करते हैं। हिन्दी में ‘मार डालने का निश्चय किया’ इसका स्वाभाविक रूप है।
- source_word: καὶ
  choice: भी
  rationale: यह लाज़र को पहले से लक्षित व्यक्ति, प्रसंगतः यीशु, के साथ जोड़ता है। ‘भी’ इसके योगात्मक भाव को बिना अनावश्यक जोर के व्यक्त करता है।
- source_word: τὸν Λάζαρον
  choice: लाज़र को
  rationale: नाम का मानक हिन्दी लिप्यंतरण ‘लाज़र’ रखा गया है; कर्मकारक को ‘को’ से व्यक्त किया गया है।
- source_word: ἀποκτείνωσιν
  choice: मार डालने
  rationale: क्रिया का सीधा अर्थ किसी की जान लेना है। ‘मार डालना’ स्पष्ट और स्वाभाविक है; ‘हत्या करना’ स्रोत से अधिक स्पष्ट नैतिक-कानूनी मूल्यांकन जोड़ सकता है।
theological_decisions:
- issue: लाज़र के विरुद्ध प्रधान याजकों के इरादे का वर्णन
  choice: उनके ठोस निर्णय को सीधे ‘मार डालने का निश्चय किया’ कहा गया है।
  alternative: ‘लाज़र को भी मार डालने की योजना बनाई’ या अधिक तीव्र ‘षड्यंत्र रचा’।
  rationale: मूल पाठ सुनियोजित और जानबूझकर लिए गए निर्णय को बताता है, पर षड्यंत्र के लिए कोई विशिष्ट शब्द नहीं देता। अनुवाद शत्रुतापूर्ण इरादे की गंभीरता रखता है, बिना अतिरिक्त प्रेरणा या षड्यंत्रकारी अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रधान याजक’ और ‘लाज़र’ प्रचलित हिन्दी बाइबलीय शब्दावली के अनुरूप हैं। मुख्य वाक्य स्रोत की संक्षिप्तता और कथात्मक प्रवाह बनाए रखता है।
