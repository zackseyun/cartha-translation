source:
  edition: SBLGNT
  text: οὗτοι οὖν προσῆλθον Φιλίππῳ τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας, καὶ ἠρώτων αὐτὸν λέγοντες· Κύριε, θέλομεν τὸν Ἰησοῦν ἰδεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/021.yaml
  text: So these came to Philip[a], who was from Bethsaida in Galilee, and were asking him, saying, “Lord, we want to see Jesus.”
translation:
  language: hi
  text: तब वे फिलिप्पुस के पास आए, जो गलील के बैतसैदा का रहनेवाला था, और उससे अनुरोध करते रहे, “महोदय,[a] हम यीशु को देखना चाहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु।” यूनानी संबोधन κύριε किसी व्यक्ति के लिए आदरसूचक “महोदय” के रूप में भी और “प्रभु” के अर्थ में भी प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὗτοι οὖν
  choice: इसलिए वे
  rationale: ‘वे’ पिछले पद में बताए गए यूनानियों की ओर संकेत करता है, और ‘इसलिए’ οὖν के कथात्मक तथा निष्कर्षसूचक संबंध को बनाए रखता है।
- source_word: προσῆλθον
  choice: के पास आए
  rationale: यह προσέρχομαι के निकट आने या किसी के पास जाने के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Φιλίππῳ
  choice: फिलिप्पुस
  rationale: यूनानी नाम Φίλιππος का हिन्दी में प्रचलित और स्रोत के निकट लिप्यंतरण।
- source_word: τῷ ἀπὸ Βηθσαϊδὰ τῆς Γαλιλαίας
  choice: गलील के बैतसैदा निवासी
  rationale: फिलिप्पुस की भौगोलिक पहचान को संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠρώτων αὐτὸν λέγοντες
  choice: उससे निवेदन करने लगे
  rationale: ἠρώτων का अपूर्ण भूतकाल जारी या आरंभ हुई विनती का भाव देता है। ‘निवेदन करने लगे’ अनुरोध के प्रसंग को स्वाभाविक रूप से व्यक्त करता है; λέγοντες की कथन-भूमिका प्रत्यक्ष उद्धरण से स्पष्ट हो जाती है।
- source_word: Κύριε
  choice: महोदय
  rationale: यहाँ संबोधन फिलिप्पुस से है; इसलिए आदरसूचक ‘महोदय’ प्रसंगानुकूल है। यूनानी शब्द का ‘प्रभु’ अर्थ भी संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: θέλομεν
  choice: हम ... चाहते हैं
  rationale: θέλω की इच्छा या चाह को सरल, आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: τὸν Ἰησοῦν ἰδεῖν
  choice: यीशु को देखना
  rationale: ἰδεῖν का मूल अर्थ ‘देखना’ सुरक्षित रखा गया है; ‘मिलना’ या ‘बात करना’ जैसे संभावित आशयों को मूल पाठ में जोड़ा नहीं गया।
theological_decisions:
- issue: फिलिप्पुस के लिए सीधे संबोधन में Κύριε का अनुवाद
  choice: महोदय
  alternative: प्रभु
  rationale: κύριε ‘प्रभु’ का संबोधन हो सकता है, पर किसी व्यक्ति को आदरपूर्वक संबोधित करने के लिए भी प्रयुक्त होता है। चूँकि यहाँ यूनानी लोग फिलिप्पुस से अनुरोध कर रहे हैं, ‘महोदय’ प्रसंग के अनुकूल है; फिर भी वास्तविक शाब्दिक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘निवेदन करने लगे’ अपूर्ण भूतकाल के प्रवाह और विनम्र अनुरोध दोनों को व्यक्त करता है। भौगोलिक पदबंध को हिन्दी की स्वाभाविक रीति से ‘गलील के बैतसैदा निवासी’ बनाया गया है।
