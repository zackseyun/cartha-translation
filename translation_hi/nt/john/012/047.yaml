  source_fidelity: ‘यदि कोई मेरी बातें सुने और उनका पालन न करे’ faithfully represents the general conditional (ἐάν τίς), ‘hear,’ Jesus’ words, and the Johannine sense of φυλάσσω as keeping/observing. ‘मैं उसका न्याय नहीं करता’ consistently renders κρίνω in both occurrences without importing a temporal or condemnatory interpretation. ‘संसार को बचाने आया हूँ’ preserves the stated saving purpose and the repeated κόσμον.
  naturalness: The Hindi is modern, clear, and suitably dignified. The conditional construction, pronoun reference, and purpose expression ‘न्याय करने नहीं, बल्कि संसार को बचाने’ are idiomatic. ‘मेरी बातें’ is natural for ῥήματα in this context.
  terminology: ‘पालन,’ ‘न्याय,’ ‘संसार,’ and ‘बचाने’ are appropriate and mutually coherent choices. The footnote responsibly gives ‘दोषी नहीं ठहराता’ as a contextual alternative rather than placing that interpretive narrowing in the main text.
