id: JHN.12.47
reference: John 12:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐάν τίς μου ἀκούσῃ τῶν ῥημάτων καὶ μὴ ⸀φυλάξῃ, ἐγὼ οὐ κρίνω αὐτόν, οὐ γὰρ ἦλθον ἵνα κρίνω τὸν κόσμον ἀλλ’ ἵνα σώσω τὸν κόσμον.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/047.yaml
  text: And if anyone hears my words and does not keep them[a], I do not judge him; for I did not come to judge the world[b], but to save the world.
translation:
  language: hi
  text: और यदि कोई मेरी बातें सुने और उनका पालन न करे, तो मैं उसका न्याय नहीं करता[a]; क्योंकि मैं संसार का न्याय करने नहीं, बल्कि संसार को बचाने आया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे दोषी नहीं ठहराता।” यूनानी क्रिया का अर्थ “न्याय करना” हो सकता है और इस प्रसंग में प्रतिकूल निर्णय, अर्थात दोषी ठहराने, का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τίς
  choice: यदि कोई
  rationale: यह अनिश्चित शर्त किसी भी व्यक्ति पर लागू होने वाली सामान्य स्थिति व्यक्त करती है; ‘यदि कोई’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀκούσῃ
  choice: सुने
  rationale: मूल क्रिया का प्राथमिक अर्थ सुनना है। यह ‘ध्यान से माने’ जैसा अतिरिक्त भाव नहीं जोड़ती।
- source_word: τῶν ῥημάτων
  choice: मेरी बातें
  rationale: ῥήματα यहाँ यीशु के बोले हुए वचनों को दर्शाता है। ‘मेरी बातें’ सहज आधुनिक हिन्दी है और अर्थ को अनावश्यक रूप से तकनीकी नहीं बनाता।
- source_word: φυλάξῃ
  choice: उनका पालन न करे
  rationale: φυλάσσω में रखना, सुरक्षित रखना और मानना/पालन करना शामिल हो सकता है। इस प्रसंग में ‘पालन करना’ आज्ञापूर्ण निष्ठा का स्वाभाविक हिन्दी भाव देता है, यद्यपि यह ‘रखना’ की तुलना में अर्थ को कुछ स्पष्ट करता है।
- source_word: οὐ κρίνω αὐτόν
  choice: मैं उसका न्याय नहीं करता
  rationale: κρίνω को ‘न्याय करना’ अनूदित करने से इसी पद में इसकी पुनरावृत्ति बनी रहती है और यूहन्ना के न्याय-विषयक कथनों का तनाव बिना व्याख्यात्मक समाधान के सुरक्षित रहता है। ‘उसका’ अनिश्चित ‘कोई’ की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: ἦλθον
  choice: आया हूँ
  rationale: यूनानी अओरिस्ट यीशु के आगमन और मिशन को समग्र रूप में प्रस्तुत करता है। हिन्दी में वर्तमान-सम्बद्ध ‘आया हूँ’ इस कथन के प्रसंग में स्वाभाविक है।
- source_word: ἵνα κρίνω
  choice: न्याय करने
  rationale: हिन्दी का उद्देश्यवाचक infinitive ἵνα के प्रयोजनार्थक भाव को सहज रूप में व्यक्त करता है।
- source_word: κόσμον
  choice: संसार
  rationale: यूहन्ना में κόσμος के लिए ‘संसार’ मानक और प्रसंगानुकूल शब्द है; यहाँ इसे केवल किसी संकुचित समूह तक सीमित करने का आधार नहीं है।
- source_word: σώσω
  choice: बचाने
  rationale: σῴζω का अर्थ बचाना/उद्धार करना है। ‘बचाना’ सामान्य पाठक के लिए स्पष्ट है और धार्मिक अर्थ को भी समेट सकता है।
theological_decisions:
- issue: ‘मैं उसका न्याय नहीं करता’ और यूहन्ना में यीशु से जुड़े न्याय-विषयक अन्य कथनों का संबंध
  choice: κρίνω का दोनों स्थानों पर ‘न्याय करना’ अनुवाद करके मिशन और समय से जुड़ी सूक्ष्मता को प्रसंग में निहित रहने देना।
  alternative: ‘मैं उसे दोषी नहीं ठहराता’ अथवा ‘मैं अभी उसका न्याय नहीं करता।’
  rationale: यह पद यीशु के आगमन का प्रधान उद्देश्य न्याय नहीं, बल्कि संसार को बचाना बताता है। ‘दोषी ठहराना’ या ‘अभी’ कहना सम्भव व्याख्याओं में से किसी एक को पाठ में जोड़ देता; ‘न्याय’ मूल तनाव को बनाए रखता है।
- issue: αὐτόν का अनिश्चित τις से संबंध
  choice: ‘यदि कोई … तो मैं उसका’
  alternative: ‘यदि कोई व्यक्ति … तो मैं उस व्यक्ति का’
  rationale: हिन्दी में ‘उसका’ इस सामान्य, एकवचन संदर्भ को स्वाभाविक रूप से बनाए रखता है और अनावश्यक लैंगिक सीमांकन नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरी बातें’ बोलचाल की स्पष्टता देता है, जबकि ‘पालन’ और ‘न्याय’ बाइबिलीय गंभीरता तथा मूल की वैचारिक पुनरावृत्ति बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिन्दी मसौदे में केवल प्रासंगिक lexical alternative को ‘न्याय’ के साथ चिह्नित किया गया है।
