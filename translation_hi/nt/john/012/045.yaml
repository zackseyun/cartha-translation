  text: καὶ ὁ θεωρῶν ἐμὲ θεωρεῖ τὸν πέμψαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/john/012/045.yaml
  text: And the one who sees me sees the one who sent me[a].
translation:
  language: hi
  text: और जो मुझे देखता है, वह उसे देखता है जिसने मुझे भेजा है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ध्यान से देखता है’; यूनानी क्रिया केवल आँखों से देखने के बजाय ध्यानपूर्वक देखने या ग्रहण करने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से इस वाक्य को जोड़ने वाला सामान्य संयोजक है।
- source_word: ὁ θεωρῶν
  choice: जो … देखता है
  rationale: निश्चित उपपद के साथ वर्तमान कृदंत यहाँ सामान्य रूप से किसी भी ऐसे व्यक्ति को दर्शाता है जो यह कार्य करता है। हिंदी का ‘जो … देखता है’ इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐμὲ
  choice: मुझे
  rationale: यह प्रथम पुरुष एकवचन का प्रत्यक्ष कर्म है; हिंदी में ‘मुझे’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: θεωρεῖ
  choice: देखता है
  rationale: θεωρέω देखने, ध्यान से निहारने या समझ-बूझकर ग्रहण करने का भाव रख सकता है। ‘देखता है’ आधुनिक हिंदी में स्वाभाविक है और मूल में θεωρέω की पुनरावृत्ति को भी बनाए रखता है।
- source_word: τὸν πέμψαντά με
  choice: उसे … जिसने मुझे भेजा है
  rationale: निश्चित उपपद सहित अओरिस्ट कृदंत यीशु को भेजने वाले व्यक्ति का संबंधपरक वर्णन करता है। यह अनुवाद मूल में अनुपस्थित ‘पिता’ जैसी उपाधि जोड़े बिना उस वर्णन को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु को देखने और उसे भेजने वाले को देखने का संबंध
  choice: 'कथन को उसके सीधे और प्रबल रूप में रखा गया है: जो यीशु को देखता है, वह उसे भेजने वाले को देखता है।'
  alternative: इसे केवल ‘भेजने वाले के विषय में जानना’ कहना, या दूसरी ओर इसे ऐसी व्याख्यात्मक भाषा में बढ़ाना जो दोनों की तात्त्विक अभिन्नता स्पष्ट रूप से घोषित करे।
  rationale: यूनानी पाठ प्रकाशन-संबंधी एकता का सीधा कथन करता है, पर इस पद में उसका दार्शनिक या सिद्धांतगत विस्तार नहीं करता। अनुवाद उसी धार्मिक तनाव और सामर्थ्य को बिना घटाए या बढ़ाए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जो … वह …’ की संरचना यूनानी के सामान्य प्रतिनिधिक एकवचन को स्वाभाविक हिंदी में व्यक्त करती है; दोनों स्थानों पर ‘देखता है’ रखकर मूल की शब्द-पुनरावृत्ति सुरक्षित की गई है।
