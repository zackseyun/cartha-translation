  text: Ἰησοῦς δὲ ἔκραξεν καὶ εἶπεν· Ὁ πιστεύων εἰς ἐμὲ οὐ πιστεύει εἰς ἐμὲ ἀλλὰ εἰς τὸν πέμψαντά με,
base_translation:
  language: en
  yaml_path: translation/nt/john/012/044.yaml
  text: But Jesus cried out and said[a], “The one who believes in me does not believe in me[b], but in the one who sent me,”
translation:
  language: hi
  text: परन्तु यीशु ने पुकारकर कहा[a], “जो मुझ पर विश्वास करता है, वह मुझ पर विश्वास नहीं करता[b], बल्कि उस पर विश्वास करता है जिसने मुझे भेजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोई मुझ पर विश्वास करता है।”
    reason: lexical_alternative
  - marker: b
    text: यह कथन यीशु पर विश्वास करने का निषेध नहीं करता; यह व्यक्त करता है कि यीशु पर विश्वास करना उसे भेजने वाले पर विश्वास करने से अलग नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔκραξεν
  choice: ऊँची आवाज़ में कहा
  rationale: क्रिया सार्वजनिक और प्रबल स्वर में बोलने को दर्शाती है। यह हिन्दी में स्वाभाविक रहते हुए केवल ‘कहा’ की अपेक्षा उसके बल को सुरक्षित रखती है।
- source_word: Ὁ πιστεύων
  choice: जो ... विश्वास करता है
  rationale: लेखयुक्त वर्तमान कृदन्त का सामान्य, व्यक्तिवाचक अर्थ है। ‘जो ... करता है’ आधुनिक हिन्दी में सहज है और किसी भी ऐसे व्यक्ति को सूचित करता है।
- source_word: πιστεύων / πιστεύει
  choice: विश्वास करता है
  rationale: यूहन्ना में πιστεύω के साथ εἰς व्यक्तिगत विश्वास और भरोसे की दिशा व्यक्त करता है। दोनों occurrences में एक ही अभिव्यक्ति रखने से यूनानी की पुनरावृत्ति बनी रहती है।
- source_word: εἰς ἐμέ
  choice: मुझ पर
  rationale: ‘विश्वास करना’ के साथ ‘पर’ मानक और स्वाभाविक हिन्दी प्रयोग है; शाब्दिक स्थान-सूचक अनुवाद यहाँ भ्रामक होता।
- source_word: ἀλλὰ εἰς τὸν πέμψαντά με
  choice: बल्कि उस पर ... जिसने मुझे भेजा है
  rationale: यह ἀλλά के स्पष्ट विरोध और कृदन्तीय वर्णन दोनों को बनाए रखता है तथा मुख्य पाठ में भेजने वाले को समय से पहले ‘पिता’ नहीं कहता।
- source_word: δὲ
  choice: परन्तु
  rationale: यह प्रसंग में हल्के संक्रमण अथवा विरोध को व्यक्त करता है; ‘परन्तु’ गरिमामय और स्पष्ट है।
theological_decisions:
- issue: ‘वह मुझ पर नहीं ... विश्वास करता है’ को यीशु को विश्वास का उचित विषय मानने के निषेध के रूप में समझा जा सकता है।
  choice: यूनानी की तनावपूर्ण शब्दावली को बिना ‘केवल’ जोड़े यथावत रखा गया है।
  alternative: ‘वह केवल मुझ पर ही विश्वास नहीं करता’ अथवा मुख्य पाठ में ‘पिता’ जोड़ना।
  rationale: मूल में ‘केवल’ नहीं है। कथन का बल यह है कि यीशु पर विश्वास उससे अलग नहीं रहता जिसने उसे भेजा है; व्याख्यात्मक शब्द जोड़कर इस धर्मवैचारिक तनाव को समाप्त नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमामय रूप अपनाया गया है। ‘ऊँची आवाज़ में कहा’ सार्वजनिक और प्रबल उद्घोषणा का भाव देता है। मूल पाठ की पुनरावृत्ति और धर्मवैचारिक तनाव सुरक्षित रखे गए हैं।
