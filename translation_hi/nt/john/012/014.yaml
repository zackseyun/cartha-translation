source:
  edition: SBLGNT
  text: εὑρὼν δὲ ὁ Ἰησοῦς ὀνάριον ἐκάθισεν ἐπ’ αὐτό, καθώς ἐστιν γεγραμμένον·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/014.yaml
  text: 'Then Jesus[a], having found a young donkey, sat on it, just as it is written:'
translation:
  language: hi
  text: 'तब यीशु ने गदहे का एक बच्चा पाया और उस पर बैठ गए, जैसा लिखा है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὑρὼν
  choice: पाया और
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। हिन्दी में समान कर्ता वाली क्रमिक क्रियाओं के लिए ‘पाया और ... बैठ गए’ स्वाभाविक है और घटनाक्रम सुरक्षित रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ हल्के कथात्मक संयोजक के रूप में वृत्तांत को आगे बढ़ाता है; ‘तब’ बिना अनावश्यक विरोध जोड़े यही कार्य करता है।
- source_word: ὀνάριον
  choice: गदहे का एक बच्चा
  rationale: ὀνάριον गदहे के लिए प्रयुक्त लघुतासूचक रूप है और प्रायः कम आयु के गदहे को दर्शाता है। ‘गदहे का एक बच्चा’ आधुनिक हिन्दी में स्पष्ट है और शब्द से अधिक विशिष्टता नहीं जोड़ता।
- source_word: ἐκάθισεν ἐπ’ αὐτό
  choice: उस पर बैठ गए
  rationale: यह यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है; ‘सवार हुए’ की अपेक्षा मूल क्रिया ‘बैठना’ को सुरक्षित रखता है।
- source_word: καθώς ἐστιν γεγραμμένον
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित सूत्र है। ‘जैसा’ καθώς के अनुरूपता-संबंध को और ‘लिखा है’ पूर्ण क्रिया के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिवाचक नाम के साथ यूनानी निश्चित उपपद हिन्दी में अलग से अनूदित नहीं होता।
theological_decisions:
- issue: यीशु के कार्य और पवित्रशास्त्र के उद्धरण का संबंध
  choice: यीशु का गदहे के बच्चे को पाना और उस पर बैठना उस लिखित वचन के अनुरूप प्रस्तुत किया गया है।
  alternative: ऐसा अधिक व्याख्यात्मक अनुवाद जो स्पष्ट रूप से कहे कि यीशु ने जानबूझकर भविष्यवाणी पूरी करने के लिए यह किया।
  rationale: पद कार्य का वर्णन करके उद्धरण-सूत्र जोड़ता है, पर यीशु की मंशा को यहाँ स्पष्ट नहीं करता। इसलिए अनुवाद भविष्यसूचक अनुरूपता बनाए रखता है, पर उद्देश्य के विषय में मूल से अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आदरसूचक बहुवचन ‘बैठ गए’ सामान्य हिन्दी बाइबिलीय प्रयोग और वर्तमान पाठक की अपेक्षा के अनुरूप है। ‘गदहे’ की वर्तनी मानक आधुनिक हिन्दी के अनुसार है।
