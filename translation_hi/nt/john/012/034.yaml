id: JHN.12.34
reference: John 12:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀οὖν αὐτῷ ὁ ὄχλος· Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου ὅτι ὁ χριστὸς μένει εἰς τὸν αἰῶνα, καὶ πῶς ⸂λέγεις σὺ⸃ ⸀ὅτι δεῖ ὑψωθῆναι τὸν υἱὸν τοῦ ἀνθρώπου; τίς ἐστιν οὗτος ὁ υἱὸς τοῦ ἀνθρώπου;
base_translation:
  language: en
  yaml_path: translation/nt/john/012/034.yaml
  text: So the crowd answered him[a], "We have heard from the Law that the Messiah remains forever[b], and how can you say that the Son of Man must be lifted up? Who is this Son of Man?"
translation:
  language: hi
  text: तब भीड़ ने उसे उत्तर दिया, “हमने व्यवस्था से सुना है कि मसीह सदा बना रहता है। फिर तुम कैसे कहते हो कि मनुष्य के पुत्र को ऊँचा उठाया जाना अवश्य है?[a] यह मनुष्य का पुत्र कौन है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऊँचा उठाया जाना” का अर्थ “महिमामंडित किया जाना” भी हो सकता है। यूहन्ना में यह अभिव्यक्ति शारीरिक रूप से ऊपर उठाए जाने और महिमामंडित किए जाने, दोनों अर्थों की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη οὖν αὐτῷ ὁ ὄχλος
  choice: इसलिए भीड़ ने उसे उत्तर दिया
  rationale: οὖν पिछले कथन से प्रतिक्रिया का संबंध जोड़ता है; ‘इसलिए’ इसकी निष्कर्षात्मक/संयोजक शक्ति रखता है। ὄχλος के लिए ‘भीड़’ सहज और तटस्थ है।
- source_word: Ἡμεῖς ἠκούσαμεν ἐκ τοῦ νόμου
  choice: हमने व्यवस्था से सुना है
  rationale: ‘सुना है’ प्राप्त परंपरा की वर्तमान प्रासंगिकता व्यक्त करता है। ‘व्यवस्था’ νόμος की यहूदी शास्त्रीय रूपरेखा को व्यापक ‘पवित्रशास्त्र’ में बदले बिना सुरक्षित रखता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी में प्रचलित यहूदी मसीहाई आशा को व्यक्त करता है।
- source_word: μένει εἰς τὸν αἰῶνα
  choice: सदा बना रहता है
  rationale: μένει की स्थायित्वसूचक शक्ति और εἰς τὸν αἰῶνα के ‘सदा’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πῶς λέγεις σὺ
  choice: फिर तुम कैसे कहते हो
  rationale: यह केवल सूचना का प्रश्न नहीं, बल्कि विस्मय और आपत्ति है; ‘फिर’ पहले कथन के साथ दिखाई देने वाले विरोध को स्पष्ट करता है।
- source_word: δεῖ ὑψωθῆναι
  choice: ऊँचे पर उठाया जाना अवश्य है
  rationale: ‘अवश्य है’ δεῖ की आवश्यकता को रखता है। ‘ऊँचे पर उठाया जाना’ शारीरिक रूप से ऊपर उठाए जाने और महिमामंडित किए जाने के बीच यूहन्नाई द्विअर्थता को यथासंभव सुरक्षित रखता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित उपाधि और दानिय्येली प्रतिध्वनि को सुरक्षित रखने वाला पारंपरिक, बोधगम्य हिन्दी रूप है।
theological_decisions:
- issue: Χριστός का उपाधिसूचक अर्थ
  choice: मसीह
  alternative: ख्रीस्त
  rationale: वाक्य यहूदी अपेक्षा—मसीह के सदा बने रहने—की बात करता है; इसलिए उपाधिसूचक ‘मसीह’ उपयुक्त है।
- issue: ὑψωθῆναι की यूहन्नाई बहुअर्थता
  choice: ऊँचे पर उठाया जाना
  alternative: महिमामंडित किया जाना / ऊपर उठाया जाना
  rationale: चुना हुआ रूप क्रूस पर शारीरिक रूप से उठाए जाने और ऊँचा किए जाने के अर्थों को एक ही अभिव्यक्ति में खुला रखता है; किसी एक अर्थ को अंतिम नहीं बनाता।
- issue: δεῖ में व्यक्त आवश्यकता
  choice: अवश्य है
  alternative: ज़रूरी है
  rationale: ‘अवश्य’ दैवी अथवा कथानकगत आवश्यकता की गंभीरता रखता है, पर उसके स्रोत की अनावश्यक व्याख्या नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘व्यवस्था’, ‘मसीह’ और ‘मनुष्य का पुत्र’ जैसे परिचित बाइबलीय पद बनाए गए हैं। प्रश्नों में भीड़ की आपत्ति और उलझन को स्वाभाविक हिन्दी में व्यक्त किया गया है।
