  text: λέγει ⸀δὲ ⸂Ἰούδας ὁ Ἰσκαριώτης εἷς τῶν μαθητῶν αὐτοῦ⸃, ὁ μέλλων αὐτὸν παραδιδόναι·
base_translation:
  language: en
  yaml_path: translation/nt/john/012/004.yaml
  text: But Judas Iscariot[a], one of his disciples—the one who was about to betray him—said,
translation:
  language: hi
  text: लेकिन उसके चेलों में से एक, यहूदा इस्करियोती—जो उसे धोखा देने वाला था[a]—बोला,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जो उसे सौंप देने वाला था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: बोला
  rationale: यूनानी में ऐतिहासिक वर्तमान काल (‘कहता है’) है, पर आधुनिक हिन्दी कथावाचन में भूतकाल ‘बोला’ अधिक स्वाभाविक है और वही कथात्मक कार्य व्यक्त करता है।
- source_word: δὲ
  choice: लेकिन
  rationale: यह अव्यय मरियम के कार्य और उसके बाद उठाई गई आपत्ति के बीच हल्का विरोध दर्शाता है; ‘लेकिन’ इस मोड़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰούδας ὁ Ἰσκαριώτης
  choice: यहूदा इस्करियोती
  rationale: नाम का यह रूप हिन्दी बाइबल परंपरा में परिचित है और आधुनिक पाठक के लिए स्वाभाविक है।
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: उसके चेलों में से एक
  rationale: ‘चेला’ शिक्षक से सीखने और उसका अनुसरण करने के संबंध को सामान्य आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ μέλλων
  choice: जो ... वाला था
  rationale: यह रचना निकट या निश्चित भावी घटना की ओर संकेत करती है; हिन्दी का ‘वाला था’ इस प्रत्याशित कार्य को सहज ढंग से व्यक्त करता है।
- source_word: παραδιδόναι
  choice: पकड़वाने
  rationale: यहूदा के संदर्भ में क्रिया का आशय यीशु को विरोधियों के हाथ लगवा देना है। ‘पकड़वाने’ प्रसंगगत विश्वासघात को स्पष्ट करता है, जबकि मूल क्रिया के व्यापक ‘सौंप देना’ अर्थ को पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: यहूदा के कार्य के लिए παραδιδόναι का अनुवाद
  choice: पकड़वाने
  alternative: सौंप देने
  rationale: मूल क्रिया सामान्यतः किसी को ‘सौंप देने’ या ‘हवाले करने’ के लिए प्रयुक्त हो सकती है। यहाँ यहूदा का कार्य विश्वासघाती रूप से यीशु को अधिकारियों के हाथ लगवाना है, इसलिए मुख्य पाठ में प्रसंगानुकूल ‘पकड़वाने’ रखा गया है; व्यापक और अधिक शाब्दिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य के अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है। अंतःस्थ व्याख्यात्मक वाक्यांश को डैश से अलग किया गया है ताकि यूनानी की समानाधिकरणात्मक संरचना स्पष्ट रहे।
