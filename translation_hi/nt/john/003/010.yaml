source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Σὺ εἶ ὁ διδάσκαλος τοῦ Ἰσραὴλ καὶ ταῦτα οὐ γινώσκεις;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/010.yaml
  text: Jesus answered and said to him[a], “You are the teacher of Israel, and you do not know these things?”
translation:
  language: hi
  text: यीशु ने उसे उत्तर दिया, “तुम इस्राएल के शिक्षक हो और इन बातों को नहीं जानते?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम इस्राएल के एक शिक्षक हो और इन बातों को नहीं जानते?” यूनानी में “इस्राएल का शिक्षक” है; निश्चित उपपद सम्भवतः प्रश्न को विशेष, नुकीला आलंकारिक बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी का दो-क्रियात्मक संवाद-सूत्र हिन्दी में स्वाभाविक रूप से एक ही अभिव्यक्ति ‘उत्तर दिया’ से व्यक्त होता है; ‘उत्तर दिया और कहा’ आधुनिक हिन्दी में अनावश्यक रूप से बोझिल होता।
- source_word: Σὺ
  choice: तुम
  rationale: स्पष्ट सर्वनाम का बल बनाए रखने के लिए ‘तुम’ रखा गया है; प्रश्न की संरचना भी निकुदेमुस की स्थिति पर जोर देती है।
- source_word: ὁ διδάσκαλος
  choice: गुरु
  rationale: ‘गुरु’ धार्मिक शिक्षण-संदर्भ में διδάσκαλος का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है। यूनानी निश्चित पदबंध के कारण मुख्य पाठ में ‘इस्राएल के गुरु’ रखा गया है।
- source_word: τοῦ Ἰσραὴλ
  choice: इस्राएल के
  rationale: सम्बन्धकारक का सीधा अनुवाद है और यह इस्राएल के लोगों के बीच निकुदेमुस की प्रतिनिधिक शिक्षकीय स्थिति व्यक्त करता है।
- source_word: ταῦτα
  choice: इन बातों
  rationale: निकटवर्ती शिक्षा की ओर संकेत करने वाले बहुवचन का स्वाभाविक हिन्दी रूप।
- source_word: οὐ γινώσκεις
  choice: नहीं जानते
  rationale: γινώσκω का मूल अर्थ ‘जानना’ सुरक्षित रहता है, जबकि प्रसंग में समझ न पाने का भाव भी स्वतः प्रकट होता है।
- source_word: καί
  choice: फिर भी
  rationale: यहाँ संयोजक निकुदेमुस की शिक्षकीय प्रतिष्ठा और उसकी अनभिज्ञता के बीच तीखा विरोध उभारता है; हिन्दी में ‘फिर भी’ उस निहित आलंकारिक बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ὁ διδάσκαλος τοῦ Ἰσραὴλ में निश्चितता और आलंकारिक बल
  choice: ‘इस्राएल के गुरु’—निश्चित पदबंध को मुख्य पाठ में बनाए रखना
  alternative: ‘इस्राएल के एक गुरु’ अथवा ‘इस्राएल में एक शिक्षक’
  rationale: ὁ निश्चित उपपद निकुदेमुस को केवल अनेक शिक्षकों में से एक बताने के बजाय एक प्रतिष्ठित, पहचाने हुए शिक्षक के रूप में संबोधित करता है। इससे यीशु के प्रश्न की नुकीली विडंबना बनी रहती है, पर कोई अतिरिक्त पदवी या सिद्धान्त आरोपित नहीं होता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उत्तर दिया और कहा’ के बजाय स्वाभाविक ‘उत्तर दिया’ अपनाया गया है। ‘फिर भी’ मूल के निहित विरोध को स्पष्ट करता है।
