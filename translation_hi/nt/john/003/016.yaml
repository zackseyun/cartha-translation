  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर’, ‘संसार’, ‘अनन्त जीवन’ और ‘नाश’ जैसे परिचित बाइबलीय पद सामान्य पाठकों के लिए बोधगम्य हैं। मुख्य वाक्य में कोलन परमेश्वर के प्रेम के ठोस प्रकट रूप—पुत्र को देने—को स्पष्ट करता है।
