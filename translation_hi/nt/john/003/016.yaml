source:
  edition: SBLGNT
  text: Οὕτως γὰρ ἠγάπησεν ὁ θεὸς τὸν κόσμον ὥστε τὸν ⸀υἱὸν τὸν μονογενῆ ἔδωκεν, ἵνα πᾶς ὁ πιστεύων εἰς αὐτὸν μὴ ἀπόληται ἀλλὰ ἔχῃ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/016.yaml
  text: 'For God loved the world in this way: he gave his only Son[b][a], so that everyone who believes in him should not perish but have eternal life.'
translation:
  language: hi
  text: 'क्योंकि परमेश्वर ने संसार से इस प्रकार प्रेम किया[a]: उसने अपना एकमात्र पुत्र[b] दे दिया, ताकि हर वह व्यक्ति जो उस पर विश्वास करता है, नाश न हो, बल्कि अनन्त जीवन पाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत रूप से इसका अनुवाद “क्योंकि परमेश्वर ने संसार से ऐसा प्रेम किया” भी किया जाता है। यूनानी को परमेश्वर के प्रेम के ढंग पर बल देते हुए समझा जा सकता है: “परमेश्वर ने संसार से इस प्रकार प्रेम किया।”'
    reason: lexical_alternative
  - marker: b
    text: या “अपना एकलौता पुत्र”; पारंपरिक रूप से “अपना एकलौता जन्मा पुत्र”; “अपना अद्वितीय पुत्र” भी सम्भव है।
    reason: alternative_reading
lexical_decisions:
- source_word: Οὕτως
  choice: इस प्रकार
  rationale: यहाँ यह शब्द मुख्यतः प्रेम की मात्रा नहीं, बल्कि उसके प्रकट होने के ढंग की ओर संकेत करता है; आगे पुत्र को देना उसी ढंग को स्पष्ट करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन से इस पद के व्याख्यात्मक और आधार देने वाले संबंध को बनाए रखता है।
- source_word: ἠγάπησεν
  choice: प्रेम किया
  rationale: यूनानी एओरिस्ट को स्वाभाविक हिन्दी में साधारण भूतकाल से व्यक्त किया गया है।
- source_word: τὸν κόσμον
  choice: संसार से
  rationale: ‘संसार’ यूनानी शब्द की व्यापकता को बनाए रखता है और इसे केवल ‘मनुष्यजाति’ तक सीमित नहीं करता। हिन्दी में ‘से प्रेम करना’ स्वाभाविक प्रयोग है।
- source_word: ὥστε
  choice: ': उसने'
  rationale: ‘इस प्रकार’ के बाद विराम-चिह्न उस वास्तविक कार्य को स्पष्ट रूप से प्रस्तुत करता है जिसमें परमेश्वर का प्रेम प्रकट हुआ।
- source_word: τὸν υἱὸν τὸν μονογενῆ
  choice: अपना एकमात्र पुत्र
  rationale: ‘एकमात्र’ पुत्र की अनन्य और अद्वितीय पुत्रता को स्पष्ट करता है, बिना मुख्य पाठ में जन्मे होने की व्युत्पत्तिगत व्याख्या थोपे।
- source_word: ἔδωκεν
  choice: दे दिया
  rationale: मूल क्रिया की व्यापकता रखी गई है; यह पुत्र के भेजे जाने और आत्मदान को समेट सकती है, पर किसी एक घटना तक अर्थ को सीमित नहीं करती।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶς ὁ πιστεύων
  choice: हर वह व्यक्ति जो … विश्वास करता है
  rationale: वाक्यांश की समावेशी और सामान्य प्रकृति बनाए रखता है तथा वर्तमान कृदन्त के सामान्य/निरंतर भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτὸν
  choice: उस पर
  rationale: ‘विश्वास करना’ के साथ यह स्वाभाविक हिन्दी मुहावरा है और यूनानी πιστεύω εἰς का आशय व्यक्त करता है।
- source_word: μὴ ἀπόληται
  choice: नाश न हो
  rationale: उद्देश्यवाचक उपवाक्य और ἀπόλλυμι की गंभीरता को बनाए रखता है, पर नाश के स्वरूप को अनावश्यक रूप से परिभाषित नहीं करता।
- source_word: ἔχῃ ζωὴν αἰώνιον
  choice: अनन्त जीवन पाए
  rationale: ‘अनन्त जीवन हो/रखे’ की तुलना में यह स्वाभाविक हिन्दी है और प्रसंग में जीवन प्राप्त करने के अर्थ को स्पष्टतः व्यक्त करता है।
theological_decisions:
- issue: Οὕτως का अर्थ
  choice: ढंग—‘इस प्रकार’
  alternative: मात्रा या तीव्रता—‘इतना प्रेम किया’
  rationale: वाक्य-विन्यास में पुत्र को देना उस ढंग को स्पष्ट करता है जिसमें परमेश्वर ने प्रेम किया। विकल्प को पादटिप्पणी में रखा गया है ताकि पारंपरिक समझ भी दिखाई दे।
- issue: μονογενής का अनुवाद
  choice: ‘एकमात्र पुत्र’
  alternative: ‘एकलौता पुत्र’, ‘अद्वितीय पुत्र’ या पारंपरिक ‘एकलौता जन्मा पुत्र’
  rationale: वर्तमान शब्दार्थ-साक्ष्य के अनुसार अनन्यता पर बल दिया गया है, साथ ही पुत्र का पिता से विशिष्ट संबंध सुरक्षित है। ऐतिहासिक रूप से महत्त्वपूर्ण वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- issue: πᾶς ὁ πιστεύων का दायरा
  choice: ‘हर वह व्यक्ति जो … विश्वास करता है’
  alternative: ‘जो कोई … विश्वास करता है’
  rationale: समावेशी और सामान्य कथन को बनाए रखा गया है, बिना चुनाव, प्रायश्चित के विस्तार या मानवीय प्रत्युत्तर से जुड़े बाद के धर्मवैज्ञानिक विवादों का समाधान पाठ में थोपे।
