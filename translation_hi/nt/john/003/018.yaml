source:
  edition: SBLGNT
  text: ὁ πιστεύων εἰς αὐτὸν οὐ κρίνεται· ὁ ⸀δὲ μὴ πιστεύων ἤδη κέκριται, ὅτι μὴ πεπίστευκεν εἰς τὸ ὄνομα τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/018.yaml
  text: The one who believes in him is not judged[a]; but the one who does not believe has already been judged[b], because he has not believed in the name of the one and only Son of God.
translation:
  language: hi
  text: जो उस पर विश्वास करता है, उसे दोषी नहीं ठहराया जाता[a]; पर जो विश्वास नहीं करता, वह पहले ही दोषी ठहराया जा चुका है, क्योंकि उसने परमेश्वर के एकमात्र पुत्र[b] के नाम पर विश्वास नहीं किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका न्याय नहीं किया जाता।” इसी प्रकार आगे, “उसका न्याय पहले ही किया जा चुका है।” यूनानी क्रिया का अर्थ “न्याय करना” या, इस संदर्भ में, “दोषी ठहराना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “एकमात्र पुत्र” का अनुवाद “अद्वितीय पुत्र” भी हो सकता है; परंपरागत अनुवाद है, “एकलौता पुत्र।”
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς αὐτόν
  choice: जो उस पर विश्वास करता है
  rationale: संज्ञात्मक वर्तमान कृदंत को सामान्य और निरंतर अर्थ के साथ स्वाभाविक हिन्दी में व्यक्त करता है; πιστεύω εἰς यहाँ व्यक्ति पर भरोसा रखने का भाव देता है।
- source_word: οὐ κρίνεται / ἤδη κέκριται
  choice: उसे दोषी नहीं ठहराया जाता / वह पहले ही दोषी ठहराया जा चुका है
  rationale: यूहन्ना 3:17–19 के न्यायिक संदर्भ में κρίνω प्रतिकूल निर्णय का भाव रखता है। दूसरे खंड का पूर्णकाल पहले हो चुके निर्णय से बनी वर्तमान दशा को व्यक्त करता है।
- source_word: μὴ πεπίστευκεν
  choice: उसने ... विश्वास नहीं किया है
  rationale: यूनानी पूर्णकाल अतीत में विश्वास न करने और उससे बनी वर्तमान स्थिति, दोनों का संकेत देता है।
- source_word: εἰς τὸ ὄνομα
  choice: के नाम पर
  rationale: यूहन्ना की इस अभिव्यक्ति में ‘नाम’ व्यक्ति की प्रकट पहचान और अधिकार को समेटता है; हिन्दी में ‘नाम पर विश्वास’ स्वाभाविक है और मूल रूपक को बनाए रखता है।
- source_word: τοῦ μονογενοῦς υἱοῦ τοῦ θεοῦ
  choice: परमेश्वर के एकमात्र पुत्र
  rationale: μονογενής यहाँ पुत्र की अद्वितीयता और अकेलेपन को व्यक्त करता है; ‘एकमात्र’ आधुनिक हिन्दी में इसे स्पष्ट करता है, बिना अनिवार्य रूप से जैविक उत्पत्ति का भाव जोड़े।
theological_decisions:
- issue: κρίνω का अर्थ
  choice: दोनों स्थानों पर ‘दोषी ठहराना’
  alternative: ‘न्याय करना’
  rationale: निकटवर्ती संदर्भ उद्धार के विपरीत प्रतिकूल न्याय की बात करता है। फिर भी यूनानी क्रिया का व्यापक अर्थ ‘न्याय करना’ हो सकता है, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: μονογενής का अनुवाद
  choice: ‘एकमात्र पुत्र’
  alternative: ‘अद्वितीय पुत्र’; परंपरागत रूप से ‘एकलौता जन्मा पुत्र’
  rationale: मूल शब्द मुख्यतः पुत्र की अनुपम, एकमात्र स्थिति पर बल देता है। परंपरागत अनुवाद को मुख्य पाठ में थोपे बिना पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘दोषी ठहराया’ न्यायिक भाव को सामान्य पाठक के लिए स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित स्थानों पर दिए गए हैं।
