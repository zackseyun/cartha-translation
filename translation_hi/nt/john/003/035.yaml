base_translation:
  language: en
  yaml_path: translation/nt/john/003/035.yaml
  text: The Father loves the Son and has given all things into his hand[a].
translation:
  language: hi
  text: पिता पुत्र से प्रेम करता है और उसने सब कुछ उसके हाथ में दे दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूहन्ना के संदर्भ में यह परमेश्वर के लिए प्रयुक्त संबंधपरक उपाधि है; हिन्दी में ‘पिता’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀγαπᾷ
  choice: प्रेम करता है
  rationale: वर्तमान काल एक सतत वास्तविकता व्यक्त करता है; हिन्दी का सामान्य वर्तमान इसे स्वाभाविक रूप से संप्रेषित करता है।
- source_word: τὸν υἱόν
  choice: पुत्र
  rationale: यह यीशु की पिता के साथ विशिष्ट संबंधपरक उपाधि है; ‘पुत्र’ इस आशय को संक्षिप्त और स्पष्ट रखता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ है; ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक ढंग से उसकी पूर्ण व्यापकता बनाए रखता है।
- source_word: δέδωκεν
  choice: सौंप दिया है
  rationale: यूनानी पूर्ण काल उस संपन्न कार्य के वर्तमान और स्थायी परिणाम को दर्शाता है; ‘दिया है’ इसे बनाए रखता है और ‘सौंप’ हाथ वाले मुहावरे में निहित अधिकार तथा जिम्मेदारी को स्पष्ट करता है।
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: उसके हाथ में
  rationale: यह शाब्दिक रूप को बनाए रखने वाला स्वाभाविक हिन्दी मुहावरा है, जो अधिकार, अधिकार-क्षेत्र या सुपुर्दगी का भाव व्यक्त कर सकता है।
theological_decisions:
- issue: पिता और पुत्र का संबंध
  choice: ‘पिता’ और ‘पुत्र’ की व्यक्तिगत, संबंधपरक उपाधियाँ यथावत रखी गईं।
  alternative: इन्हें सामान्य पारिवारिक संज्ञाओं या व्याख्यात्मक धर्मशास्त्रीय पदों में बदलना।
  rationale: मूल पाठ इन उपाधियों के द्वारा विशिष्ट संबंध व्यक्त करता है; अनुवाद उसी को रखता है, न घटाता है और न उसमें अतिरिक्त सिद्धांत जोड़ता है।
- issue: पुत्र को दिए गए अधिकार का विस्तार और स्थायी परिणाम
  choice: πάντα को ‘सब कुछ’ और δέδωκεν को ‘सौंप दिया है’ किया गया।
  alternative: ‘सब दिया’ या केवल भूतकाल में ‘सौंप दिया’।
  rationale: यह व्यापकता और यूनानी पूर्ण काल के वर्तमान परिणाम दोनों को बनाए रखता है, जबकि ‘हाथ में’ की अभिव्यक्ति में निहित अधिकार को किसी अधिक संकीर्ण धर्मशास्त्रीय अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘प्रेम करता है’ बोलचाल और औपचारिकता के बीच स्वाभाविक संतुलन रखता है। ‘सौंप दिया है’ यूनानी पूर्ण काल और हाथ में दिए जाने के मुहावरे, दोनों को सहज हिन्दी में व्यक्त करता है।
