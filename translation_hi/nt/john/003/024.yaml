  text: For John had not yet been thrown into prison[a].
translation:
  language: hi
  text: क्योंकि उस समय तक यूहन्ना को बंदीगृह में नहीं डाला गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् बपतिस्मा देनेवाला यूहन्ना।
