lexical_decisions:
- source_word: οὔπω
  choice: उस समय तक ... नहीं
  rationale: यह क्रिया-विशेषण कथा के उस बिंदु तक घटना के न घटने को दर्शाता है। हिंदी में ‘उस समय तक ... नहीं’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह आसपास के कथन की व्याख्यात्मक पृष्ठभूमि देता है; ‘क्योंकि’ उसके कारणसूचक-व्याख्यात्मक संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἦν βεβλημένος
  choice: डाला गया था
  rationale: यह परोक्ष पूर्णभूत कर्मवाच्य रचना संदर्भित समय से पहले पूरी हुई अवस्था को सूचित करती है। ‘डाला गया था’ हिंदी में उस काल और कर्मवाच्य को सहजता से रखता है।
- source_word: εἰς τὴν φυλακήν
  choice: बंदीगृह में
  rationale: यहाँ φυλακή का अर्थ पहरा नहीं, बल्कि कारावास का स्थान है। ‘बंदीगृह में’ दिशात्मक भाव सहित गरिमापूर्ण और सुबोध हिंदी है।
- source_word: ὁ Ἰωάννης
  choice: यूहन्ना
  rationale: यूनानी पाठ केवल यूहन्ना नाम देता है। संदर्भ उसकी पहचान स्पष्ट करता है, इसलिए मुख्य पाठ में ‘बपतिस्मा देनेवाला’ नहीं जोड़ा गया।
theological_decisions:
- issue: ὁ Ἰωάννης की पहचान
  choice: यूहन्ना
  alternative: बपतिस्मा देनेवाला यूहन्ना
  rationale: संदर्भ में यह बपतिस्मा देनेवाले यूहन्ना हैं, पर इस पद के यूनानी पाठ में केवल नाम है। इसलिए स्रोत की सीमा बनाए रखते हुए पहचान को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। ‘बंदीगृह’ औपचारिक किंतु सामान्यतः बोधगम्य है, और मूल के कर्मवाच्य तथा पूर्वकालिक भाव को सुरक्षित रखा गया है।
