source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῷ· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἄνωθεν, οὐ δύναται ἰδεῖν τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/003.yaml
  text: Jesus answered and said to him, “Truly, truly, I say to you, unless someone is born from above,[a] he is not able to see the kingdom of God.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर में कहा, “मैं तुमसे सच-सच कहता हूँ, यदि कोई ऊपर से जन्म न ले,[a] तो वह परमेश्वर का राज्य नहीं देख सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से” अथवा “नए सिरे से।” यूनानी शब्द का अर्थ “ऊपर से” और “फिर से” दोनों हो सकता है; अगले पद का संवाद इसी द्विअर्थ पर आधारित है।
    reason: वैकल्पिक अर्थ और यूहन्नाई शब्द-क्रीड़ा को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी के उत्तर देने और कहने वाले युग्म का स्वाभाविक हिन्दी कथन; ‘उत्तर देकर कहा’ सम्भव है, पर आधुनिक हिन्दी में अनावश्यक रूप से भारी लगता है।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव की प्रबलता बनाए रखते हुए सामान्य आधुनिक हिन्दी में सूत्र का अर्थ स्पष्ट करता है।
- source_word: ἐὰν μή τις
  choice: जब तक कोई … न
  rationale: शर्त और अनिश्चित, सर्वसामान्य व्यक्ति का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γεννηθῇ
  choice: जन्म न ले
  rationale: γεννάω के निष्क्रिय रूप को हिन्दी की स्वाभाविक जन्म-अभिव्यक्ति में प्रस्तुत करता है; ‘फिर से’ का अर्थ क्रिया में नहीं जोड़ा गया।
- source_word: ἄνωθεν
  choice: ऊपर से
  rationale: यूहन्ना में स्वर्गीय मूल की दिशा को सामने रखता है, जबकि ‘फिर से’ वाला वास्तविक द्विअर्थ पादटिप्पणी में सुरक्षित है।
- source_word: οὐ δύναται ἰδεῖν
  choice: नहीं देख सकता
  rationale: असमर्थता और ‘देखने’ की यूहन्नाई अर्थ-व्याप्ति—प्रत्यक्ष देखना, समझना या सहभागिता—को बिना संकुचित किए रखता है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: हिन्दी बाइबलीय प्रयोग में परिचित और सटीक पद, जो शासन और राज्य-क्षेत्र दोनों की सम्भावना खुली रखता है।
theological_decisions:
- issue: ἄνωθεν का द्विअर्थ
  choice: मुख्य पाठ में ‘ऊपर से’
  alternative: ‘फिर से’ या ‘नए सिरे से’
  rationale: यूहन्ना का स्वर्गीय/पार्थिव विरोध ‘ऊपर से’ को समर्थन देता है, पर अगले पद में नीकुदेमुस की प्रतिक्रिया ‘फिर से’ अर्थ पर निर्भर है; इसलिए अस्पष्टता को पादटिप्पणी में स्पष्ट रूप से बनाए रखा गया है।
- issue: ‘परमेश्वर का राज्य देखना’ का आशय
  choice: ‘देखना’ को यथावत रखना
  alternative: ‘पहचानना,’ ‘अनुभव करना,’ या ‘उसमें प्रवेश करना’
  rationale: ἰδεῖν का सीधा अर्थ और उसकी सम्भावित रूपकात्मक गहराई दोनों सुरक्षित रखी गई हैं; पद 5 की ‘प्रवेश’ भाषा को यहाँ पहले से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘सच-सच’ पारंपरिक सूत्र की प्रबलता बनाए रखता है; ‘ऊपर से जन्म’ की असामान्यता जानबूझकर रखी गई है क्योंकि वही मूल कथन और अगले संवाद का तनाव है।
