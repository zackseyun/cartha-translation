  text: so that everyone who believes in him may have eternal life[a][b].
translation:
  language: hi
  text: ताकि हर वह व्यक्ति जो उस पर विश्वास करता है, अनन्त जीवन पाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसमें विश्वास करता है”; यहाँ यूनानी में ἐν (“में”) है, εἰς (“की ओर/में”) नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पूर्ववर्ती कथन से जुड़े उद्देश्य या परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶς ὁ πιστεύων
  choice: हर वह व्यक्ति जो ... विश्वास करता है
  rationale: यह संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त की व्यापक और सामान्य व्याप्ति को स्पष्ट रखता है और किसी लिंग-विशेष तक सीमित नहीं करता।
- source_word: πιστεύων
  choice: विश्वास करता है
  rationale: यूहन्ना के सन्दर्भ में πιστεύω का यह मानक, पारदर्शी और सहज हिन्दी रूप है।
- source_word: ἐν αὐτῷ
  choice: उस पर
  rationale: हिन्दी में किसी व्यक्ति पर विश्वास करने का स्वाभाविक प्रयोग ‘उस पर विश्वास करना’ है। यह यूनानी ἐν αὐτῷ के सम्बन्धात्मक अर्थ को बिना अस्वाभाविक ‘उसमें विश्वास’ के व्यक्त करता है; स्रोत में εἰς नहीं होने की बात टिप्पणी में सुरक्षित रखी गई है।
- source_word: ἔχῃ
  choice: पाए
  rationale: ἵνα के साथ आए संभावनार्थक रूप को हिन्दी में उद्देश्यसूचक ‘ताकि ... पाए’ स्वाभाविक ढंग से व्यक्त करता है और अनावश्यक अनिश्चितता नहीं जोड़ता।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह यूहन्ना के सन्दर्भ में स्थापित और सटीक हिन्दी पद है, जो जीवन की अनन्त अवधि और भावी युग से जुड़ी गुणवत्ता—दोनों को समेट सकता है।
theological_decisions:
- issue: ἐν αὐτῷ वाले विश्वास-वाक्यांश का अनुवाद
  choice: उस पर विश्वास करता है
  alternative: उसमें विश्वास करता है
  rationale: मूल पाठ में ἐν है, εἰς नहीं; फिर भी आधुनिक हिन्दी में व्यक्ति के सम्बन्ध में ‘पर विश्वास करना’ स्वाभाविक है। पादटिप्पणी मूल पूर्वसर्ग को स्पष्ट करती है, ताकि अधिक प्रचलित यूहन्नाई εἰς-विन्यास को चुपचाप आरोपित न किया जाए।
- issue: πᾶς ὁ πιστεύων की व्याप्ति
  choice: हर वह व्यक्ति जो विश्वास करता है
  alternative: जो कोई विश्वास करता है
  rationale: यह वाक्यांश की सार्वत्रिक, सामान्य और समावेशी व्याप्ति को स्पष्ट करता है तथा मूल में निहित किसी व्यक्ति-विशेष या पुरुष-विशेष का संकेत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण शैली। ‘हर वह व्यक्ति’ व्यापकता को स्पष्ट करता है; ‘अनन्त जीवन’ परिचित बाइबलीय शब्दावली है। मुख्य पाठ में स्वाभाविक हिन्दी को प्राथमिकता देते हुए यूनानी पूर्वसर्ग की वास्तविक रचना पादटिप्पणी में सुरक्षित रखी गई है।
