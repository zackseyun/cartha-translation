  text: ὁ δὲ ποιῶν τὴν ἀλήθειαν ἔρχεται πρὸς τὸ φῶς, ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα ὅτι ἐν θεῷ ἐστιν εἰργασμένα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/021.yaml
  text: But the one who does the truth comes to the light[a], so that his works may be revealed[d][c][b], because they have been done in God.
translation:
  language: hi
  text: परन्तु जो सत्य का आचरण करता है[a], वह ज्योति की ओर आता है, ताकि उसके काम प्रकट हो जाएँ, क्योंकि[b] वे परमेश्वर में[c] किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अभिव्यक्ति ‘सत्य को करता है’ है। इसका अनुवाद ‘सत्य के अनुसार चलता है’ या ‘जो सत्य है वही करता है’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: '‘क्योंकि’ के स्थान पर इसका अर्थ यह भी हो सकता है: ‘ताकि उसके कामों के विषय में यह प्रकट हो कि वे परमेश्वर में किए गए हैं।’ यूनानी संयोजक कारण या प्रकट होने वाली बात—दोनों का परिचय दे सकता है।'
    reason: alternative_reading
  - marker: c
    text: ‘परमेश्वर में’ का भाव ‘परमेश्वर के द्वारा’ या ‘परमेश्वर के माध्यम से’ भी हो सकता है; यूनानी अभिव्यक्ति इन अर्थच्छटाओं को खुला छोड़ती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ ποιῶν τὴν ἀλήθειαν
  choice: परन्तु जो सत्य का आचरण करता है
  rationale: δέ पिछले पद से हल्का विरोध दिखाता है। कृदन्तीय अभिव्यक्ति किसी ऐसे व्यक्ति को दर्शाती है जिसकी पहचान इस निरंतर आचरण से होती है। ‘सत्य का आचरण करता है’ असामान्य यूनानी मुहावरे ‘सत्य को करता है’ के नैतिक और प्रकाशनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔρχεται πρὸς τὸ φῶς
  choice: ज्योति के पास आता है
  rationale: πρός गति के साथ ‘के पास/की ओर’ का भाव देता है। यह अनुवाद प्रकाश की ओर आने के रूपक को बनाए रखता है और ‘ज्योति में प्रवेश करता है’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἵνα φανερωθῇ αὐτοῦ τὰ ἔργα
  choice: ताकि उसके काम प्रकट हो जाएँ
  rationale: ἵνα उद्देश्य व्यक्त करता है और φανερωθῇ का कर्मवाच्य रूप ‘प्रकट हो जाएँ’ में सुरक्षित है। ἔργα के लिए ‘काम’ सहज हिन्दी है और उसके नैतिक मूल्य को अनावश्यक रूप से पहले से निर्धारित नहीं करता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι को प्रकाश में आने के कारण का परिचायक माना गया है। फिर भी यह उसके कामों के विषय में प्रकट होने वाली बात—‘कि वे परमेश्वर में किए गए हैं’—भी बता सकता है; इस वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: ἐν θεῷ
  choice: परमेश्वर में
  rationale: ἐν के खुले अर्थ को बनाए रखने के लिए इसका सीधा अनुवाद किया गया है। इससे परमेश्वर की सामर्थ्य, उसके क्षेत्र में होना, और उसके साथ संबंध जैसे संभावित भावों में से किसी एक को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: ἐστιν εἰργασμένα
  choice: किए गए हैं
  rationale: परिप्रयुक्त पूर्ण कर्मवाच्य किसी पूरे किए गए कार्य की वर्तमान परिणति को व्यक्त करता है। ‘किए गए हैं’ हिन्दी में स्वाभाविक रहते हुए कर्मवाच्य और परिणामगत बल को सुरक्षित रखता है।
theological_decisions:
- issue: ποιῶν τὴν ἀλήθειαν मुहावरे का अर्थ
  choice: सत्य का आचरण करता है
  alternative: सत्य को करता है; जो सत्य है वही करता है; सत्य के अनुसार चलता है
  rationale: शाब्दिक ‘सत्य को करता है’ आधुनिक हिन्दी में अत्यन्त अस्वाभाविक है। ‘सत्य का आचरण करता है’ इस यूहन्नाई विचार को सुरक्षित रखता है कि सत्य केवल माना नहीं जाता, बल्कि जीवन में किया भी जाता है, और अर्थ को केवल तथ्यात्मक सत्यवादिता तक सीमित नहीं करता।
- issue: ὅτι का संबंध
  choice: कारण के रूप में—‘क्योंकि’
  alternative: प्रकट होने वाली बात के रूप में—‘कि वे परमेश्वर में किए गए हैं’
  rationale: दोनों व्याकरणिक रूप से संभव हैं। मुख्य पाठ में कारणवाचक अर्थ सहज प्रवाह देता है, जबकि वैकल्पिक विषयवाचक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἐν θεῷ की धार्मिक अर्थच्छटा
  choice: परमेश्वर में
  alternative: परमेश्वर के द्वारा; परमेश्वर के माध्यम से; परमेश्वर के साथ एकता में
  rationale: यूनानी वाक्यांश परमेश्वर की कर्तृता, उसके प्रभाव-क्षेत्र और उससे संबंध के बीच खुला है। ‘परमेश्वर में’ इसी तनाव को बनाए रखता है और किसी संकीर्ण सिद्धान्तगत व्याख्या को मुख्य पाठ में नहीं डालता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप रखा गया है। ‘ज्योति’ यूहन्ना के प्रकाश-रूपक और साहित्यिक गरिमा को बनाए रखती है; ‘काम’ सामान्य और स्पष्ट है। वाक्य-संरचना मूल के उद्देश्य, कर्मवाच्य और धार्मिक अस्पष्टता को यथासंभव सुरक्षित रखती है।
