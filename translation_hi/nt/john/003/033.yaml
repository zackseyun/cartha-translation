  text: ὁ λαβὼν αὐτοῦ τὴν μαρτυρίαν ἐσφράγισεν ὅτι ὁ θεὸς ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/033.yaml
  text: Whoever has received his testimony has certified that God is true[a].
translation:
  language: hi
  text: जिसने उसकी गवाही स्वीकार की है, उसने इस बात पर अपनी मुहर लगा दी है कि परमेश्वर सच्चा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ λαβὼν
  choice: जिसने ... स्वीकार की है
  rationale: संज्ञार्थक भूतकालिक कृदंत किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जिसने गवाही ग्रहण की है; यह हिन्दी में पूर्ण हुए ग्रहण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: सर्वनाम का स्वाभाविक संदर्भ प्रसंग में स्वर्ग से आने वाले, अर्थात पुत्र, की ओर है।
- source_word: τὴν μαρτυρίαν
  choice: गवाही
  rationale: यह शब्द साक्ष्य या गवाही को दर्शाता है; ‘गवाही’ यूहन्ना के साक्षी-विषयक प्रसंग में सहज और स्पष्ट है।
- source_word: ἐσφράγισεν
  choice: अपनी मुहर लगा दी है
  rationale: क्रिया का मूल रूपक ‘मुहर लगाना’ है और यहाँ किसी बात की दृढ़ पुष्टि या प्रमाणन का अर्थ देता है। हिन्दी में यह रूपक स्वाभाविक और बोधगम्य है, इसलिए उसे मुख्य पाठ में बनाए रखा गया है।
- source_word: ὅτι
  choice: कि
  rationale: यह आगे आने वाली पुष्टि की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: निश्चित कर्ता के लिए मानक और स्पष्ट हिन्दी पद।
- source_word: ἀληθής
  choice: सच्चा
  rationale: यह परमेश्वर के सत्यवादी और विश्वसनीय होने को व्यक्त करता है, साथ ही मूल शब्द की व्यापक ‘सत्य’ संबंधी ध्वनि बनाए रखता है।
theological_decisions:
- issue: मुहर लगाने के रूपक का बल
  choice: मुख्य पाठ में ‘अपनी मुहर लगा दी है’
  alternative: ‘प्रमाणित कर दिया है’ या ‘पुष्टि कर दी है’
  rationale: मूल यूनानी में मुहर का सजीव रूपक है। आधुनिक हिन्दी में यह मुहावरा समझने योग्य है और गवाही स्वीकार करने को परमेश्वर की सत्यता पर व्यक्तिगत एवं दृढ़ अनुमोदन के रूप में प्रस्तुत करता है; इसलिए अर्थ खोलकर केवल ‘प्रमाणित’ कहना आवश्यक नहीं।
- issue: ἀληθής का अर्थ-परास
  choice: ‘परमेश्वर सच्चा है’
  alternative: ‘परमेश्वर सत्यवादी है’ या ‘परमेश्वर विश्वसनीय है’
  rationale: ‘सच्चा’ मूल की संक्षिप्तता और यूहन्ना में सत्य की व्यापक धर्मवैचारिक प्रतिध्वनि को सुरक्षित रखता है, जबकि सत्यवादिता और विश्वसनीयता दोनों की संभावना खुली रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल पाठ का मुहर वाला रूपक मुख्य पाठ में ही सुरक्षित रखा गया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं।
