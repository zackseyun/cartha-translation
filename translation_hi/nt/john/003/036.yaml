  text: ὁ πιστεύων εἰς τὸν υἱὸν ἔχει ζωὴν αἰώνιον· ὁ δὲ ἀπειθῶν τῷ υἱῷ οὐκ ὄψεται ζωήν, ἀλλ’ ἡ ὀργὴ τοῦ θεοῦ μένει ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/036.yaml
  text: The one who believes in the Son has eternal life; but the one who disobeys the Son will not see life, but the wrath of God remains on him.
translation:
  language: hi
  text: जो पुत्र पर विश्वास करता है, उसके पास अनन्त जीवन है; पर जो पुत्र की आज्ञा नहीं मानता[a], वह जीवन को नहीं देखेगा, बल्कि परमेश्वर का क्रोध उस पर बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पुत्र पर विश्वास करने से इनकार करता है।” यूनानी क्रिया में आज्ञा न मानने के साथ-साथ विश्वास करने से इनकार करने का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πιστεύων εἰς τὸν υἱὸν
  choice: जो पुत्र पर विश्वास करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त को सामान्य व्यक्ति-सूचक वाक्यांश में रखा गया है। πιστεύω εἰς यहाँ पुत्र की ओर निर्देशित भरोसे को व्यक्त करता है; आधुनिक हिन्दी में ‘पर विश्वास करना’ स्वाभाविक है।
- source_word: ἔχει ζωὴν αἰώνιον
  choice: उसके पास अनन्त जीवन है
  rationale: वर्तमानकालीन ἔχει जीवन के अभी प्राप्त होने को दर्शाता है; ‘उसके पास ... है’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ δὲ ἀπειθῶν τῷ υἱῷ
  choice: पर जो पुत्र की आज्ञा नहीं मानता
  rationale: ἀπειθέω में आज्ञा न मानने के साथ विश्वास करने से इनकार का भाव भी हो सकता है। मुख्य पाठ व्यापक आज्ञाभंग के अर्थ को रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: οὐκ ὄψεται ζωήν
  choice: वह जीवन को नहीं देखेगा
  rationale: मूल के ‘जीवन देखना’ मुहावरे को बनाए रखा गया है, ताकि इसे केवल ‘जीवन पाना’ कहकर समतल न कर दिया जाए।
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: परमेश्वर का क्रोध
  rationale: यह यूनानी संबंधकारक रचना का सीधा और धर्मवैचारिक रूप से असंशोधित अनुवाद है।
- source_word: μένει ἐπ’ αὐτόν
  choice: उस पर बना रहता है
  rationale: वर्तमानकालीन μένει क्रोध की जारी अवस्था व्यक्त करता है; ‘बना रहता है’ आधुनिक हिन्दी में स्वाभाविक है और योहन्ना में इस क्रिया की निरंतरता को सुरक्षित रखता है।
theological_decisions:
- issue: ἀπειθῶν का अर्थ और πιστεύων के साथ उसका विरोध
  choice: मुख्य पाठ में ‘पुत्र की आज्ञा नहीं मानता’, पादटिप्पणी में ‘पुत्र पर विश्वास करने से इनकार करता है’
  alternative: जो पुत्र पर विश्वास नहीं करता
  rationale: विश्वास और अवज्ञा के बीच मूल पाठ का तनाव सुरक्षित रखा गया है। केवल ‘विश्वास नहीं करता’ कहने से क्रिया का आज्ञाभंग-संबंधी पहलू दब सकता था।
- issue: अनन्त जीवन और परमेश्वर के क्रोध का कालगत स्वरूप
  choice: अनन्त जीवन का वर्तमान अधिकार और क्रोध का वर्तमान में बने रहना
  alternative: दोनों को केवल भविष्य की अवस्थाओं के रूप में प्रस्तुत करना
  rationale: ἔχει और μένει दोनों वर्तमान निर्देशार्थक रूप हैं, जबकि οὐκ ὄψεται भविष्य की ओर संकेत करता है। अनुवाद इस वर्तमान-भविष्य तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘पुत्र’, ‘अनन्त जीवन’ और ‘परमेश्वर का क्रोध’ जैसे स्थापित बाइबिलीय पद मूल की धर्मवैचारिक गहनता बनाए रखते हैं।
