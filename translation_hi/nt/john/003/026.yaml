source:
  edition: SBLGNT
  text: καὶ ἦλθον πρὸς τὸν Ἰωάννην καὶ εἶπαν αὐτῷ· Ῥαββί, ὃς ἦν μετὰ σοῦ πέραν τοῦ Ἰορδάνου, ᾧ σὺ μεμαρτύρηκας, ἴδε οὗτος βαπτίζει καὶ πάντες ἔρχονται πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/026.yaml
  text: And they came to John and said to him[a], “Rabbi, the one who was with you beyond the Jordan, to whom you have borne witness—look, he is baptizing[b], and everyone is going to him.”
translation:
  language: hi
  text: और वे यूहन्ना के पास आए और उससे कहा, “रब्बी, जो व्यक्ति यरदन के पार आपके साथ था और जिसके विषय में आपने गवाही दी है[a]—देखिए, वही[b] बपतिस्मा दे रहा है, और सब लोग उसके पास जा रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके पक्ष में आपने गवाही दी है।” यूनानी में संबंधवाचक सर्वनाम संप्रदान कारक में है; यहाँ इसका अर्थ उसके विषय में या उसके पक्ष में दी गई गवाही हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अधिक शाब्दिक रूप से “यह व्यक्ति” है। यह संकेतात्मक शब्द वक्ताओं का विशेष, और संभवतः शिकायत-भरा, जोर व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον πρὸς τὸν Ἰωάννην
  choice: वे यूहन्ना के पास आए
  rationale: आगमन का सामान्य अर्थ और यूहन्ना की ओर बढ़ने का कथात्मक दृष्टिकोण सहज हिन्दी में सुरक्षित रहता है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यहूदी परिवेश और मूल संबोधन को बनाए रखने के लिए प्रचलित लिप्यंतरण रखा गया है; ‘गुरु’ अर्थ-स्पष्टीकरण होता।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार
  rationale: भौगोलिक अभिव्यक्ति का स्वाभाविक और निकट हिन्दी रूप।
- source_word: ᾧ σὺ μεμαρτύρηκας
  choice: जिसके विषय में आपने गवाही दी है
  rationale: हिन्दी में यह सबसे स्वाभाविक रूप से बताता है कि यूहन्ना की गवाही उस व्यक्ति के विषय में थी। पूर्णकाल की वर्तमान प्रासंगिकता ‘दी है’ से बनी रहती है; यूनानी संप्रदान कारक की वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: ἴδε
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले उद्गार का आधुनिक, आदरसूचक और स्वाभाविक रूप।
- source_word: οὗτος
  choice: वही
  rationale: सिर्फ ‘वह’ की अपेक्षा ‘वही’ वक्ताओं के संकेतात्मक और संभवतः शिकायत-भरे जोर को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βαπτίζει
  choice: बपतिस्मा दे रहा है
  rationale: वर्तमान में जारी गतिविधि को हिन्दी के अपूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: πάντες ἔρχονται πρὸς αὐτόν
  choice: सब लोग उसके पास जा रहे हैं
  rationale: यह शिकायत में प्रयुक्त आलंकारिक सामान्यीकरण है; ‘सब लोग’ हिन्दी में उसका बल बनाए रखता है, जबकि ‘जा रहे हैं’ वक्ताओं के दृष्टिकोण से गति को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: यूहन्ना के लेखन में μαρτυρέω की साक्ष्य-संबंधी भाषा
  choice: गवाही दी है
  alternative: साक्षी दी है / प्रमाण दिया है
  rationale: ‘गवाही देना’ आधुनिक हिन्दी में स्पष्ट है और यूहन्ना के सुसमाचार में बार-बार आने वाले गवाही के विषयगत सूत्र को बनाए रखता है, बिना उसके आशय को किसी विशेष धार्मिक व्याख्या तक सीमित किए।
- issue: ᾧ के संप्रदान कारक का संबंध
  choice: जिसके विषय में आपने गवाही दी है
  alternative: जिसे आपने गवाही दी है
  rationale: संदर्भ में विषय-संबंधी अर्थ अधिक स्वाभाविक है, पर यूनानी रूप अपने आप यह पूर्णतः तय नहीं करता कि गवाही उस व्यक्ति को संबोधित थी या उसके विषय में थी; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। कथन में यूहन्ना के लिए तीसरे पुरुष में ‘उससे’ और सीधे संबोधन में आदरसूचक ‘आपके/आपने/देखिए’ रखा गया है। ‘रब्बी’ और ‘बपतिस्मा’ जैसे स्थापित बाइबलीय शब्द यहूदी तथा कथात्मक संदर्भ को सुरक्षित रखते हैं।
