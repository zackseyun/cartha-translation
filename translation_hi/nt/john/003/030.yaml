translation:
  language: hi
  text: उसका बढ़ना अवश्य है, पर मेरा घटना भी अवश्य है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक: “उस व्यक्ति को बढ़ना अवश्य है, पर मुझे कम होना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνον
  choice: उसका
  rationale: यूनानी संकेतवाचक सर्वनाम संदर्भ में यीशु की ओर संकेत करता है। हिन्दी की तुलनात्मक रचना में संबंधकारक ‘उसका’ स्वाभाविक है और मूल के ‘उस व्यक्ति’ जैसे संकेत को बनाए रखता है; आदरसूचक ‘उनका’ जोड़ना मूल में निहित नहीं है।
- source_word: δεῖ
  choice: अवश्य है
  rationale: यह आवश्यकता या अनिवार्यता व्यक्त करता है। ‘अवश्य है’ उसके बल को बनाए रखता है, पर यह अलग से तय नहीं करता कि आवश्यकता व्यावहारिक है या स्पष्ट ईश्वरीय आदेश।
- source_word: αὐξάνειν
  choice: बढ़ना
  rationale: यह निरंतर बढ़ने, अधिक प्रमुख होने या प्रभाव में आगे आने का व्यापक भाव रखता है। ‘बढ़ना’ सरल है और केवल संख्या-वृद्धि तक अर्थ को सीमित नहीं करता।
- source_word: ἐμὲ
  choice: मेरा
  rationale: यह पहले सर्वनाम के समान infinitive का तार्किक कर्ता है। हिन्दी की समानांतर रचना ‘उसका…मेरा…’ में संबंधकारक रूप सबसे स्वाभाविक है।
- source_word: δὲ … δὲ
  choice: और
  rationale: दोनों खंडों में δὲ संतुलित विरोध स्थापित करता है। हिन्दी में ‘उसका बढ़ना और मेरा घटना’ स्वाभाविक समांतरता रखते हुए निहित विरोध स्पष्ट करता है; ‘परन्तु’ भी संभव है।
- source_word: ἐλαττοῦσθαι
  choice: घटना
  rationale: इसका अर्थ कम होना या छोटा पड़ना है। ‘घटना’ ‘बढ़ना’ के साथ सटीक और स्मरणीय विरोधी समानांतर बनाता है।
theological_decisions:
- issue: δεῖ द्वारा व्यक्त आवश्यकता का स्वरूप
  choice: ‘अवश्य है’ द्वारा वास्तविक आवश्यकता को व्यक्त करना, बिना उसके प्रकार को अधिक स्पष्ट किए
  alternative: इसे केवल व्यावहारिक अनिवार्यता अथवा स्पष्ट ईश्वरीय विधान के रूप में खोलकर कहना
  rationale: संदर्भ उद्धार-इतिहास में यीशु की बढ़ती प्रमुखता और यूहन्ना की घटती भूमिका की ओर संकेत कर सकता है, किंतु पद स्वयं आवश्यकता के तंत्र को स्पष्ट नहीं करता। अनुवाद इस धर्मवैज्ञानिक भार और अस्पष्टता दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘बढ़ना/घटना’ मूल की समानांतर, सूक्तिपरक संरचना को सहज हिन्दी में सुरक्षित रखते हैं। मुख्य पाठ में [a] चिह्न सम्मिलित है।
