id: JHN.3.4
reference: John 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ⸀ὁ Νικόδημος· Πῶς δύναται ἄνθρωπος γεννηθῆναι γέρων ὤν; μὴ δύναται εἰς τὴν κοιλίαν τῆς μητρὸς αὐτοῦ δεύτερον εἰσελθεῖν καὶ γεννηθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/004.yaml
  text: Nicodemus said to him[a], “How can a man be born when he is old? He cannot enter his mother’s womb a second time and be born[b], can he?”
translation:
  language: hi
  text: नीकुदेमुस ने उससे कहा, “जब कोई मनुष्य[a] बूढ़ा हो, तो वह कैसे जन्म ले सकता है? वह अपनी माँ के गर्भ में दूसरी बार[b] प्रवेश करके जन्म तो नहीं ले सकता?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘मनुष्य’ के लिए पुल्लिंग एकवचन रूप है, जिसका प्रयोग यहाँ सामान्य अर्थ में हुआ है; अर्थ ‘कोई व्यक्ति’ भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में स्पष्ट रूप से ‘दूसरी बार’ है; नीकुदेमुस यीशु की बात को शाब्दिक अर्थ में समझ रहा है।
    reason: cross_reference
lexical_decisions:
- source_word: λέγει πρὸς αὐτὸν
  choice: उससे कहा
  rationale: यूनानी में वर्तमान काल है, पर यह यूहन्ना की कथा-शैली में प्रयुक्त ऐतिहासिक वर्तमान है; हिन्दी कथा में सामान्य भूतकाल स्वाभाविक है।
- source_word: Νικόδημος
  choice: नीकुदेमुस
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: Πῶς δύναται
  choice: कैसे ... सकता है
  rationale: यह सम्भावना के विषय में प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: कोई मनुष्य
  rationale: यहाँ पुल्लिंग एकवचन शब्द सामान्य प्रतिनिधिक अर्थ में है; ‘कोई मनुष्य’ उसी सामान्य अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: γεννηθῆναι
  choice: जन्म ले सकता है
  rationale: इस प्रसंग में γεννάω का कर्मवाच्य जन्म पाने या जन्म लेने को सूचित करता है; यहाँ अपने-आप ‘फिर से’ जोड़ना उचित नहीं।
- source_word: γέρων ὤν
  choice: जब ... बूढ़ा हो
  rationale: कृदन्तीय पदबंध को समय या परिस्थिति बताने वाले स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: μὴ δύναται
  choice: जन्म तो नहीं ले सकता?
  rationale: μή ऐसे प्रश्न का संकेत देता है जिसमें नकारात्मक उत्तर अपेक्षित है; ‘तो नहीं ... सकता?’ हिन्दी में नीकुदेमुस की अविश्वसनीयता और अपेक्षित नकार को सहजता से व्यक्त करता है।
- source_word: κοιλίαν
  choice: गर्भ
  rationale: ‘माँ’ के साथ इस संदर्भ में κοιλία स्पष्ट रूप से गर्भ को सूचित करता है।
- source_word: δεύτερον
  choice: दूसरी बार
  rationale: यह शब्द स्पष्ट रूप से ‘दूसरी बार’ कहता है और नीकुदेमुस की शाब्दिक समझ को बनाए रखता है।
- source_word: εἰσελθεῖν καὶ γεννηθῆναι
  choice: प्रवेश करके जन्म ... लेना
  rationale: दोनों क्रियाओं को स्पष्ट रखा गया है, जिससे नीकुदेमुस के प्रश्न का सजीव तर्क सुरक्षित रहता है।
theological_decisions:
- issue: सामान्य अर्थ वाले पुल्लिंग ἄνθρωπος का अनुवाद
  choice: कोई मनुष्य
  alternative: कोई व्यक्ति
  rationale: यूनानी में व्याकरणिक रूप पुल्लिंग एकवचन है, पर उसका आशय सामान्य है। ‘कोई मनुष्य’ प्रतिनिधिक पुल्लिंग और सामान्य अर्थ दोनों को बनाए रखता है।
- issue: पद 3 के ‘ऊपर से/फिर से’ वाले अर्थ को इस पद में लाना या न लाना
  choice: जन्म ... दूसरी बार
  alternative: फिर से जन्म लेना
  rationale: इस पद में δεύτερον स्पष्टतः ‘दूसरी बार’ है। यह नीकुदेमुस की शाब्दिक समझ दिखाता है; पिछले पद के ἄνωθεν की अर्थगत अस्पष्टता को यहाँ γεννηθῆναι में मिला देना कथात्मक तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जन्म तो नहीं ले सकता?’ नकारात्मक उत्तर की अपेक्षा वाले यूनानी प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
