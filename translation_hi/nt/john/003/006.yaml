id: JHN.3.6
reference: John 3:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ γεγεννημένον ἐκ τῆς σαρκὸς σάρξ ἐστιν, καὶ τὸ γεγεννημένον ἐκ τοῦ πνεύματος πνεῦμά ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/006.yaml
  text: What is born of the flesh is flesh[b][a], and what is born of the Spirit is spirit.
translation:
  language: hi
  text: जो देह से जन्मा है, वह देह है[a]; और जो पवित्र आत्मा से जन्मा है, वह आत्मा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो देह से जन्मा है, वह मानवीय स्वभाव का है।” यूनानी शब्द “देह” कुछ संदर्भों में पतित या पापी मानवीय स्वभाव का अर्थ दे सकता है, पर यहाँ मुख्य विरोध पवित्र आत्मा से होने वाले जन्म के साथ है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो पवित्र आत्मा से जन्मा है, वह आत्मिक है।” यूनानी में शाब्दिक रूप से “वह आत्मा है” लिखा है, जो “देह” के साथ गुणात्मक विरोध को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γεγεννημένον
  choice: जो ... जन्मा है
  rationale: नपुंसकलिंग एकवचन कृदंत यहाँ किसी खास व्यक्ति के बजाय एक सामान्य श्रेणी बताता है। यह हिंदी प्रयोग उस सार्वभौमिक कथन को स्वाभाविक ढंग से रखता है।
- source_word: ἐκ
  choice: से
  rationale: जन्म के संदर्भ में यह स्रोत या उद्गम बताता है; हिंदी में “से जन्मा” स्वाभाविक और स्पष्ट है।
- source_word: σάρξ / σαρκὸς
  choice: देह
  rationale: यहाँ मुख्य विरोध प्राकृतिक मानवीय जन्म और पवित्र आत्मा से जन्म के बीच है। “देह” यूनानी शब्द की ठोस और धर्मवैचारिक व्यापकता बचाता है, जबकि “पापी स्वभाव” अनावश्यक रूप से अर्थ को नैतिक पतन तक सीमित कर देगा।
- source_word: πνεύματος
  choice: पवित्र आत्मा
  rationale: निकटवर्ती प्रसंग में सप्रत्यय रूप जन्म के दिव्य स्रोत, अर्थात पवित्र आत्मा, की ओर संकेत करता है। हिंदी में “पवित्र” जोड़ने से स्रोत और परिणामी “आत्मा” का भेद स्पष्ट होता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: विधेय में संज्ञा बिना प्रत्यय के है और गुणात्मक अर्थ रख सकती है। “आत्मा” मूल संज्ञात्मक समानांतर को बचाता है; “आत्मिक” अधिक व्याख्यात्मक विकल्प है।
- source_word: ἐστιν
  choice: है
  rationale: सरल संयोजक क्रिया को बनाए रखकर वचन की सूत्रात्मक और परिभाषात्मक रचना सुरक्षित रखी गई है।
theological_decisions:
- issue: पहले खंड में σάρξ का अर्थ
  choice: प्राकृतिक मानवीय क्षेत्र के अर्थ में “देह”
  alternative: “मानवीय स्वभाव” या “पापी स्वभाव”
  rationale: यद्यपि σάρξ कुछ संदर्भों में पतित या पापी मानवीय स्वभाव का संकेत दे सकता है, यहाँ प्रमुख विरोध प्राकृतिक जन्म और आत्मा से जन्म का है। “देह” मूल पाठ की व्यापकता और धर्मवैचारिक तनाव को बनाए रखता है।
- issue: दूसरे खंड में πνεῦμα का आशय
  choice: परिणाम के गुणात्मक स्वरूप के लिए “आत्मा”
  alternative: “आत्मिक” या स्रोत के समान “पवित्र आत्मा”
  rationale: 'विधेय संज्ञा का सप्रत्यय न होना गुणात्मक अर्थ की गुंजाइश देता है: आत्मा से जन्मा हुआ आत्मिक क्षेत्र या स्वभाव का है। “आत्मा” मूल की संज्ञात्मक समानता को बचाता है और जन्मे हुए को स्वयं पवित्र आत्मा के साथ एकरूप नहीं ठहराता।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। “देह” तथा “आत्मा” की समानांतर रचना मूल यूनानी के सूत्रात्मक विरोध को सुरक्षित रखती है। स्रोत के लिए “पवित्र आत्मा” और परिणाम के लिए “आत्मा” कहकर हिंदी में वह भेद स्पष्ट किया गया है जिसे अंग्रेज़ी में बड़े और छोटे अक्षर से दिखाया जा सकता है।
