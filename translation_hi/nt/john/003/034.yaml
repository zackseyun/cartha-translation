reference: John 3:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃν γὰρ ἀπέστειλεν ὁ θεὸς τὰ ῥήματα τοῦ θεοῦ λαλεῖ, οὐ γὰρ ἐκ μέτρου ⸀δίδωσιν τὸ πνεῦμα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/034.yaml
  text: For the one whom God sent speaks the words of God[a], for he gives the Spirit without measure.
translation:
  language: hi
  text: क्योंकि जिसे परमेश्वर ने भेजा, वह परमेश्वर के वचन बोलता है; क्योंकि परमेश्वर आत्मा को नाप-नापकर नहीं देता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जिसे परमेश्वर ने भेजा, वह आत्मा को नाप-नापकर नहीं देता।” यूनानी में “देता है” का कर्ता व्यक्त नहीं किया गया है।
    reason: ‘देता है’ का अव्यक्त कर्ता परमेश्वर भी समझा जा सकता है और परमेश्वर द्वारा भेजा गया जन भी।
lexical_decisions:
- source_word: ὃν
  choice: जिसे
  rationale: सम्बन्धवाचक सर्वनाम का कर्मकारक रूप स्वाभाविक हिन्दी में “जिसे” है; आगे “वह” जोड़ने से उसके व्यक्तिवाचक आशय और वाक्य की स्पष्टता बनी रहती है।
- source_word: ἀπέστειλεν
  choice: भेजा है
  rationale: यूनानी अओरिस्ट यहाँ परमेश्वर द्वारा भेजे जाने के सम्पन्न कार्य को बताता है। हिन्दी में “भेजा है” वर्तमान प्रसंग से उसका सम्बन्ध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ῥήματα τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: यह बहुवचन पद परमेश्वर द्वारा बोले गए शब्दों या कथनों को दर्शाता है। “वचन” गरिमापूर्ण, प्रचलित और सामान्य पाठक के लिए बोधगम्य है।
- source_word: λαλεῖ
  choice: बोलता है
  rationale: यह क्रिया बोलने की निरन्तर या सामान्य क्रिया को सीधे और स्वाभाविक रूप में व्यक्त करती है।
- source_word: οὐ ... ἐκ μέτρου
  choice: नाप-नापकर नहीं
  rationale: यह हिन्दी मुहावरा किसी सीमित या निर्धारित मात्रा में देने के निषेध को स्वाभाविक रूप से व्यक्त करता और मूल के ‘माप’ रूपक को बनाए रखता है।
- source_word: δίδωσιν
  choice: देता
  rationale: वर्तमानकालिक कथन के लिए “देता” सीधा और स्वाभाविक अनुवाद है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: यूहन्ना के इस प्रसंग में संकेत परमेश्वर के आत्मा की ओर है। मूल में केवल “आत्मा” है, इसलिए अनुवाद अनावश्यक विस्तार किए बिना यही रूप रखता है।
theological_decisions:
- issue: δίδωσιν (‘देता है’) का अव्यक्त कर्ता
  choice: मुख्य पाठ में परमेश्वर को आत्मा देने वाला स्पष्ट किया गया है।
  alternative: परमेश्वर द्वारा भेजा गया जन, अर्थात पुत्र, आत्मा देता है।
  rationale: पिछले खंड का स्पष्ट कर्ता परमेश्वर है, और विचार का प्रवाह इस अर्थ के अनुकूल है कि परमेश्वर अपने भेजे हुए जन को आत्मा असीमित रूप से देता है, इसलिए वह परमेश्वर के वचन बोलता है। फिर भी यूनानी क्रिया में कर्ता व्यक्त नहीं है और भेजे हुए जन को कर्ता मानना व्याकरणतः सम्भव है; इस कारण वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “नाप-नापकर नहीं” सामान्य हिन्दी में सीमित मात्रा में न देने का अर्थ देता है और मूल यूनानी के माप-संबंधी रूपक को भी बनाए रखता है।
