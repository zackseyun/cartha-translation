source:
  edition: SBLGNT
  text: εἰ τὰ ἐπίγεια εἶπον ὑμῖν καὶ οὐ πιστεύετε, πῶς ἐὰν εἴπω ὑμῖν τὰ ἐπουράνια πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/012.yaml
  text: If I told you about earthly things and you do not believe[b][a], how will you believe if I tell you about heavenly things?
translation:
  language: hi
  text: यदि मैंने तुमसे पृथ्वी की बातें कहीं और तुम विश्वास नहीं करते, तो यदि मैं तुमसे स्वर्ग की बातें कहूँ, तो तुम कैसे विश्वास करोगे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἐπίγεια
  choice: पृथ्वी की बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। यह सहज हिन्दी में व्यापक अर्थ बनाए रखता है और स्वर्ग की बातें के साथ मूल विरोध को स्पष्ट करता है; इसका अर्थ केवल सांसारिक विषयों तक सीमित नहीं किया गया।
- source_word: εἶπον
  choice: मैंने ... कहीं
  rationale: λέγω का एओरिस्ट रूप यीशु की पहले कही बातों की ओर संकेत करता है। हिन्दी में बातें कहीं, ὑμῖν के साथ स्वाभाविक है।
- source_word: οὐ πιστεύετε
  choice: तुम विश्वास नहीं करते
  rationale: वर्तमानकालीन क्रिया को वर्तमान प्रतिक्रिया या दशा के रूप में रखा गया है। विश्वास करना यूहन्ना के प्रसंग और πιστεύω के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πῶς ... πιστεύσετε
  choice: तुम कैसे विश्वास करोगे
  rationale: भविष्यकाल πιστεύσετε को बनाए रखते हुए आलंकारिक प्रश्न की शक्ति सुरक्षित रखी गई है; इसे समर्थता बताने वाले कैसे कर सकते हो के रूप में नहीं समझाया गया।
- source_word: ἐὰν εἴπω
  choice: यदि मैं ... कहूँ
  rationale: ἐὰν के साथ एओरिस्ट सब्जंक्टिव भविष्य की शर्त व्यक्त करता है। यदि ... कहूँ आधुनिक हिन्दी में इसकी संभाव्यता और शर्त दोनों को सहजता से दर्शाता है।
- source_word: τὰ ἐπουράνια
  choice: स्वर्ग की बातें
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग बहुवचन विशेषण को व्यापक रखा गया है। यह τὰ ἐπίγεια के समानांतर है और स्वर्ग से संबंधित वास्तविकताओं को किसी संकीर्ण व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: पृथ्वी की बातें और स्वर्ग की बातें के बीच विरोध का आशय
  choice: दोनों श्रेणियों को सीधे और व्यापक रूप में प्रस्तुत करना
  alternative: पृथ्वी की बातों को केवल सांसारिक दृष्टांत या पृथ्वी पर होने वाली घटनाएँ, और स्वर्ग की बातों को केवल गहरे ईश्वरीय रहस्य मानना
  rationale: मूल पाठ प्रकाशन की दो श्रेणियों में विरोध रखता है, पर उनके सटीक विषय को परिभाषित नहीं करता। व्यापक शब्दावली मूल की अस्पष्टता और धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट। तुम एकवचन निकुदेमुस के संबोधन के अनुरूप है। पृथ्वी की बातें और स्वर्ग की बातें समानांतर रखकर यूनानी विरोध सुरक्षित किया गया है।
