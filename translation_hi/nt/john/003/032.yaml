  text: What he has seen and heard[a], this he testifies to[b], and no one receives his testimony.
translation:
  language: hi
  text: जो उसने देखा और सुना है, उसकी वह गवाही देता है, और कोई भी उसकी गवाही स्वीकार नहीं करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह एक प्रबल सामान्य कथन है; अगले पद में उस व्यक्ति की बात आती है जो उसकी गवाही स्वीकार करता है।
    reason: cross_reference
lexical_decisions:
- source_word: ὃ ... τοῦτο
  choice: जो ... उसी की
  rationale: सम्बन्धवाचक सर्वनाम और फिर संकेतवाचक सर्वनाम की यूनानी पुनरुक्त संरचना को स्वाभाविक हिन्दी में ‘जो ... उसी की’ से रखा गया है; इसका संकेत देखी-सुनी बातों की विषयवस्तु की ओर है।
- source_word: ἑώρακεν καὶ ἤκουσεν
  choice: देखा और सुना है
  rationale: यह सहज आधुनिक हिन्दी है और देखने-सुनने के अनुभव की वर्तमान प्रासंगिकता व्यक्त करती है। यूनानी में पहले क्रियापद का काल पूर्ण और दूसरे का सामान्य भूत है, पर हिन्दी में उस भेद को स्पष्ट करने से वाक्य अस्वाभाविक हो जाता।
- source_word: μαρτυρεῖ
  choice: गवाही देता है
  rationale: यह कानूनी साक्ष्य से जुड़ी अर्थछाया को बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: μαρτυρίαν
  choice: गवाही
  rationale: μαρτυρεῖ के साथ समान शब्द-परिवार का संबंध बनाए रखने के लिए दोनों स्थानों पर ‘गवाही’ रखा गया है।
- source_word: οὐδεὶς
  choice: कोई भी ... नहीं
  rationale: यह यूनानी के प्रबल सार्वभौमिक निषेध को बिना नरम किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λαμβάνει
  choice: स्वीकार करता
  rationale: यहाँ बात किसी गवाही को केवल प्राप्त करने की नहीं, उसे मान लेने की है; ‘स्वीकार करता’ इस प्रसंग में स्वाभाविक और अर्थानुकूल है।
theological_decisions:
- issue: ‘कोई भी उसकी गवाही स्वीकार नहीं करता’—सार्वभौमिक निषेध का दायरा
  choice: कथन को उसकी प्रबल और व्यापक भाषा में ज्यों का त्यों रखा गया है।
  alternative: ‘बहुत कम लोग उसकी गवाही स्वीकार करते हैं।’
  rationale: यूनानी पाठ स्पष्ट रूप से ‘कोई नहीं’ कहता है। अगले पद में गवाही स्वीकार करने वाले का उल्लेख होने पर भी इस पद की अलंकारिक या सामान्यीकृत तीव्रता को अनुवाद में नरम करके तनाव दूर नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गवाही देता है/गवाही’ से यूहन्ना के साक्ष्य-संबंधी शब्द-सम्बन्ध को सुरक्षित रखा गया है।
