  text: μὴ θαυμάσῃς ὅτι εἶπόν σοι Δεῖ ὑμᾶς γεννηθῆναι ἄνωθεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/007.yaml
  text: Do not be amazed that I told you[b][a], ‘You must be born from above.’
translation:
  language: hi
  text: इस बात से चकित मत हो कि मैंने तुमसे[b] कहा, “तुम सबको ऊपर से[a] जन्म लेना आवश्यक है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “फिर से” अथवा “नए सिरे से।” यूनानी शब्द ἄνωθεν का अर्थ “ऊपर से” और “फिर से/नए सिरे से” दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “मैंने तुमसे कहा” वाला ‘तुम’ एकवचन है, लेकिन “तुम सबको…जन्म लेना आवश्यक है” में ‘तुम’ बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ θαυμάσῃς
  choice: चकित मत हो
  rationale: μή के साथ aorist subjunctive यहाँ निषेध व्यक्त करता है। ‘चकित मत हो’ आधुनिक, स्वाभाविक हिन्दी है और θαυμάζω के आश्चर्य या विस्मय के भाव को बनाए रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ ὅτι यीशु द्वारा कही गई बात की विषय-वस्तु प्रस्तुत करता है; इसलिए ‘कि’ उपयुक्त है, न कि कारण बताने वाला ‘क्योंकि’।
- source_word: εἶπόν σοι
  choice: मैंने तुमसे कहा
  rationale: यह वाक्यांश निकुदेमुस को किए गए एकवचन संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। एकवचन और आगे आने वाले बहुवचन के अंतर को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: Δεῖ
  choice: आवश्यक है
  rationale: Δεῖ आवश्यकता या अनिवार्यता व्यक्त करता है। ‘आवश्यक है’ उसके बल को बनाए रखते हुए वर्तमान मानक हिन्दी में सहज है।
- source_word: ὑμᾶς
  choice: तुम सबको
  rationale: ὑμᾶς बहुवचन है। हिन्दी में ‘तुम सबको’ मुख्य पाठ में ही इस संख्या-भेद को स्पष्ट करता है और पहले आए एकवचन σοι से उसका अंतर दिखाता है।
- source_word: γεννηθῆναι
  choice: जन्म लेना
  rationale: यूहन्ना 3 के प्रसंग में γεννάω का निष्क्रिय infinitive जन्म पाने या जन्म लेने का अर्थ देता है। ‘जन्म लेना’ हिन्दी में स्वाभाविक है और प्रसंग की जन्म-सम्बन्धी उपमा को सुरक्षित रखता है।
- source_word: ἄνωθεν
  choice: ऊपर से
  rationale: ἄνωθεν का अर्थ ‘ऊपर से’ और ‘फिर से/नए सिरे से’ दोनों हो सकता है। यूहन्ना के प्रयोग और परमेश्वर से उत्पन्न होने के भाव को देखते हुए मुख्य पाठ में ‘ऊपर से’ रखा गया है, जबकि वास्तविक द्विअर्थता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: नए जन्म के कथन में ἄνωθεν का अर्थ
  choice: ऊपर से
  alternative: फिर से; नए सिरे से
  rationale: यूहन्ना 3 में यह शब्द जानबूझकर एक से अधिक अर्थ जगा सकता है। व्यापक यूहन्नाई प्रयोग स्वर्गीय या परमेश्वर-प्रदत्त उद्गम के अर्थ ‘ऊपर से’ का समर्थन करता है, पर निकुदेमुस की समझ से जुड़ा ‘फिर से’ अर्थ भी महत्त्वपूर्ण है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तुम सबको’ से यूनानी बहुवचन को मुख्य पाठ में प्रत्यक्ष किया गया है। उद्धरण के भीतर हिन्दी के स्वाभाविक वाक्य-विन्यास का प्रयोग हुआ है, और ἄνωθεν की अर्थगत बहुलता पादटिप्पणी में संरक्षित है।
