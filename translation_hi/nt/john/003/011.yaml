id: JHN.3.11
reference: John 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν ἀμὴν λέγω σοι ὅτι ὃ οἴδαμεν λαλοῦμεν καὶ ὃ ἑωράκαμεν μαρτυροῦμεν, καὶ τὴν μαρτυρίαν ἡμῶν οὐ λαμβάνετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/011.yaml
  text: Truly[a], truly, I tell you, we speak what we know and testify to what we have seen[c][b], and you do not receive our testimony.
translation:
  language: hi
  text: 'मैं तुमसे सच-सच कहता हूँ[a]: हम जो जानते हैं, वही कहते हैं, और जो हमने देखा है, उसकी गवाही देते हैं[b]; और तुम लोग हमारी गवाही ग्रहण नहीं करते[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आमीन, आमीन, मैं तुमसे कहता हूँ।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “हम” और “हमारी” में ठीक किन्हें सम्मिलित किया गया है, इस पर मतभेद है।
    reason: alternative_reading
  - marker: c
    text: “ग्रहण नहीं करते” का अनुवाद “स्वीकार नहीं करते” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव की गंभीरता और प्रबल पुष्टि को बनाए रखते हुए इसे स्वाभाविक, सुबोध हिन्दी में व्यक्त करता है।
- source_word: λέγω σοι
  choice: मैं तुमसे ... कहता हूँ
  rationale: एकवचन संबोधन और गंभीर कथन—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὃ οἴδαμεν λαλοῦμεν
  choice: हम जो जानते हैं, वही कहते हैं
  rationale: सम्बन्धवाचक रचना और बहुवचन क्रियाओं को स्पष्ट तथा सहज हिन्दी में बनाए रखता है; ‘वही’ ज्ञात विषय और कथन के सीधे सम्बन्ध को उभारता है।
- source_word: ὃ ἑωράκαμεν μαρτυροῦμεν
  choice: जो हमने देखा है, उसकी गवाही देते हैं
  rationale: ἑωράκαμεν के पूर्णकालिक भाव को ‘देखा है’ से और μαρτυροῦμεν के साक्ष्यगत अर्थ को ‘गवाही देते हैं’ से व्यक्त करता है।
- source_word: τὴν μαρτυρίαν ἡμῶν
  choice: हमारी गवाही
  rationale: क्रिया ‘गवाही देते हैं’ के साथ मूल की शब्दगत कड़ी बनाए रखता है और किसी विशिष्ट समूह की व्याख्या नहीं जोड़ता।
- source_word: οὐ λαμβάνετε
  choice: तुम लोग ... ग्रहण नहीं करते
  rationale: बहुवचन संबोधन को ‘तुम लोग’ से स्पष्ट किया गया है। ‘ग्रहण’ यूहन्ना में मिलने वाले स्वीकार करने अथवा अपनाने के व्यापक भाव को बनाए रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों संयोजकों को सीधे रूप में रखा गया है और अंतिम καί में ऐसा विरोधसूचक भाव नहीं जोड़ा गया जो मूल में स्पष्ट नहीं है।
theological_decisions:
- issue: ‘हम’ और ‘हमारी’ का आशय
  choice: बहुवचन को बिना किसी व्याख्यात्मक संकुचन के ‘हम’ और ‘हमारी’ रखा गया है।
  alternative: इसे केवल यीशु, यीशु और उनके शिष्यों, अलंकारिक बहुवचन, अथवा व्यापक स्वर्गीय साक्ष्य के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ बहुवचन का प्रयोग करता है, पर उसमें सम्मिलित व्यक्तियों की ठीक पहचान विवादित है; अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: एकवचन से बहुवचन संबोधन का परिवर्तन
  choice: σοι को ‘तुमसे’ और λαμβάνετε को ‘तुम लोग ... करते’ के रूप में व्यक्त किया गया है।
  alternative: दोनों को अस्पष्ट ‘तुम’ से अनूदित करना।
  rationale: इससे निकुदेमुस को किए गए आरम्भिक एकवचन संबोधन और बाद के बहुवचन संबोधन के बीच मूल पाठ का परिवर्तन सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक-पाठ योग्य शैली अपनाई गई है। ‘सच-सच’ परिचित और सुबोध है; ‘गवाही’ तथा ‘ग्रहण’ यूहन्ना के साक्ष्य और स्वीकार के प्रमुख शब्द-सम्बन्धों को बनाए रखते हैं। विराम-चिह्न वाक्य के दो मुख्य कथनों को स्पष्ट करते हैं।
