source:
  edition: SBLGNT
  text: ⸀ἀπεκρίθη Ἰησοῦς· Ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/005.yaml
  text: Jesus answered[a], “Truly, truly, I say to you, unless someone is born of water and the Spirit[b], he is not able to enter the kingdom of God.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “मैं तुमसे सच-सच कहता हूँ, यदि कोई जल और आत्मा[a] से जन्म न ले[b], तो वह परमेश्वर के राज्य में प्रवेश नहीं कर सकता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘आत्मा’ से पवित्र आत्मा का आशय सम्भवतः है। यूनानी πνεύματος के रूप से यह निर्णायक रूप से निश्चित नहीं होता; इसे सामान्य अर्थ में ‘आत्मा’ भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: '‘जल और आत्मा से जन्म लेने’ को अलग-अलग प्रकार से समझा गया है: शुद्धिकरण और नवीकरण के चित्र के रूप में, शारीरिक जन्म और आत्मिक जन्म के संकेत के रूप में, या बपतिस्मा के संदर्भ के रूप में। मुख्य पाठ यूनानी शब्दावली को बनाए रखता है और इनमें से किसी एक व्याख्या को निर्णायक नहीं बनाता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में प्रत्युत्तर देने के अर्थ को स्वाभाविक और मानक हिन्दी में व्यक्त करता है।
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहराव की गंभीरता और बल को बनाए रखते हुए आधुनिक हिन्दी में सूत्रवाक्य का अर्थ स्पष्ट करता है।
- source_word: λέγω σοι
  choice: मैं तुमसे ... कहता हूँ
  rationale: यूनानी के एकवचन सम्बोधन और कथन की प्रत्यक्ष, गंभीर शैली को सुरक्षित रखता है।
- source_word: ἐὰν μή τις
  choice: जब तक कोई ... न
  rationale: अनिश्चित और सर्वसामान्य व्यक्ति का बोध कराता है तथा हिन्दी में शर्त को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γεννηθῇ
  choice: जन्म न ले
  rationale: कर्मवाच्य जन्म की धारणा को हिन्दी के स्वाभाविक मुहावरे में देता है; पद 5 में अनुपस्थित ἄνωθεν के कारण ‘फिर से’ या ‘ऊपर से’ नहीं जोड़ा गया।
- source_word: ἐξ ὕδατος καὶ πνεύματος
  choice: जल और आत्मा से
  rationale: ἐξ के स्रोत-संबंध और संयुक्त यूनानी अभिव्यक्ति को निकटता से रखता है, बिना मुख्य पाठ में उसकी विवादित व्याख्या तय किए।
- source_word: οὐ δύναται εἰσελθεῖν
  choice: प्रवेश नहीं कर सकता
  rationale: असमर्थता और प्रवेश—दोनों अर्थों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: βασιλεία के पारम्परिक और व्यापक अर्थ को बनाए रखता है, उसे केवल शासन या केवल स्थान तक सीमित नहीं करता।
theological_decisions:
- issue: πνεύματος का अभिप्राय
  choice: मुख्य पाठ में ‘आत्मा’, जिसका सम्भावित अभिप्राय पवित्र आत्मा है
  alternative: सामान्य अर्थ में ‘आत्मा’
  rationale: यूहन्ना के संदर्भ में पवित्र आत्मा सम्भावित है, पर यूनानी में संज्ञा के लेख का अभाव और बड़े-छोटे अक्षर का मूलतः निर्णायक न होना कुछ अस्पष्टता छोड़ता है। हिन्दी में ‘आत्मा’ स्वाभाविक है और टिप्पणी विकल्प बताती है।
- issue: ‘जल और आत्मा’ का संबंध और अर्थ
  choice: यूनानी की संयुक्त अभिव्यक्ति को ज्यों का त्यों अर्थ-संगत रूप में बनाए रखना
  alternative: जल को शारीरिक जन्म और आत्मा को आत्मिक जन्म मानना; अथवा जल को विशेष रूप से बपतिस्मा मानना
  rationale: मुख्य पाठ किसी एक साम्प्रदायिक या संस्कार-संबंधी व्याख्या को आरोपित नहीं करता; शुद्धिकरण और नवीकरण सहित प्रमुख समझों को टिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सच-सच’ दोहरे Ἀμὴν का बल व्यक्त करता है; ‘तुमसे’ मूल के एकवचन सम्बोधन को बनाए रखता है। ‘जल’ बाइबलीय गरिमा के अनुरूप है, जबकि वाक्य-विन्यास आधुनिक हिन्दी का है।
