source:
  edition: SBLGNT
  text: αὐτοὶ ὑμεῖς ⸀μοι μαρτυρεῖτε ὅτι ⸀εἶπον· Οὐκ εἰμὶ ἐγὼ ὁ χριστός, ἀλλ’ ὅτι Ἀπεσταλμένος εἰμὶ ἔμπροσθεν ἐκείνου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/028.yaml
  text: You yourselves bear me witness that I said[a], ‘I am not the Messiah[b], but I have been sent ahead of him.’
translation:
  language: hi
  text: तुम स्वयं इस बात की गवाही देते हो कि मैंने कहा था, “मैं मसीह[a] नहीं हूँ, बल्कि मैं उसके आगे भेजा गया हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।”
    reason: ὁ χριστός के लिए लिप्यंतरित वैकल्पिक रूप।
  - marker: b
    text: या, “मैं उसके आगे भेजा गया था।”
    reason: यूनानी रचना पहले भेजे जाने और उसके वर्तमान परिणाम पर बल दे सकती है; प्रसंग के अनुसार भूतकालीन रूप भी सम्भव है।
lexical_decisions:
- source_word: αὐτοὶ ὑμεῖς
  choice: तुम स्वयं
  rationale: दोनों सर्वनाम मिलकर श्रोताओं पर बल देते हैं; ‘तुम स्वयं’ इस जोर को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: μοι μαρτυρεῖτε
  choice: मेरे गवाह हो
  rationale: यह हिन्दी में स्वाभाविक ढंग से व्यक्त करता है कि श्रोता यूहन्ना के पहले कहे हुए कथन की गवाही दे सकते हैं; साथ ही यूहन्ना के सुसमाचार की साक्ष्य-संबंधी भाषा बनी रहती है।
- source_word: εἶπον
  choice: मैंने कहा था
  rationale: अओरिस्ट यहाँ यूहन्ना के पहले दिए गए स्पष्ट कथन की ओर संकेत करता है; हिन्दी का पूर्ण भूतकाल प्रसंग में यह पूर्वता साफ करता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द अपेक्षित अभिषिक्त जन की उपाधि है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित और अर्थपूर्ण रूप है।
- source_word: Ἀπεσταλμένος εἰμὶ
  choice: मैं ... भेजा गया हूँ
  rationale: यह रचना पहले भेजे जाने से उत्पन्न वर्तमान स्थिति या नियुक्त भूमिका को व्यक्त करती है; ‘भेजा गया हूँ’ पूर्णता और वर्तमान प्रासंगिकता दोनों को स्वाभाविक रूप से रखता है।
- source_word: ἔμπροσθεν ἐκείνου
  choice: उसके आगे
  rationale: यह उस आनेवाले व्यक्ति से पहले भेजे जाने और अग्रदूत की भूमिका का संकेत देता है, बिना पाठ से अधिक अर्थ जोड़े।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त; अभिषिक्त जन
  rationale: संदर्भ में यूहन्ना अपेक्षित अभिषिक्त व्यक्ति होने से इनकार करता है। ‘मसीह’ उपाधि का स्थापित हिन्दी रूप है; इसे केवल व्यक्तिगत नाम की तरह नहीं बनाया गया।
- issue: Ἀπεσταλμένος εἰμὶ में यूहन्ना के भेजे जाने का कालगत बल
  choice: मैं उसके आगे भेजा गया हूँ
  alternative: मैं उसके आगे भेजा जाता हूँ; मैं उसके आगे भेजा गया था
  rationale: चुना हुआ रूप पूर्व में घटे भेजे जाने और उससे बनी वर्तमान नियुक्त स्थिति, दोनों को खुला रखता है। यह यूहन्ना की अधीन और अग्रगामी भूमिका बताता है, पर भेजनेवाले की पहचान जैसी कोई अतिरिक्त बात नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम स्वयं’ मूल के जोर को, ‘मेरे गवाह हो’ साक्ष्य की भाषा को, और ‘उसके आगे’ यूहन्ना की अग्रदूत-संबंधी स्थिति को स्पष्ट रखता है। उद्धरण-चिह्न हिन्दी प्रकाशन-शैली के अनुसार लगाए गए हैं।
