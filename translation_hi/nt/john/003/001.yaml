base_translation:
  language: en
  yaml_path: translation/nt/john/003/001.yaml
  text: There was a man from the Pharisees named Nicodemus[a], a ruler of the Jews.
translation:
  language: hi
  text: फरीसियों में से एक आदमी था, जिसका नाम नीकुदेमुस था; वह यहूदियों[a] का एक शासक था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया के लोगों का एक शासक।” यूनानी शब्द का अर्थ यहूदी लोग सामान्य रूप से, या कुछ प्रसंगों में अधिक विशेष रूप से यहूदिया के लोग अथवा यहूदी अधिकारी, हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: था
  rationale: δέ यहाँ कथा को आगे बढ़ाने वाला हल्का संयोजक है; हिन्दी में अलग से ‘अब’ या ‘और’ जोड़ना आवश्यक नहीं, और अस्तित्वसूचक ἦν को स्वाभाविक वाक्य-विन्यास में ‘था’ से व्यक्त किया गया है।
- source_word: ἄνθρωπος
  choice: एक व्यक्ति
  rationale: संदर्भ में एक विशिष्ट पुरुष का उल्लेख है; ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और अगले पुरुषवाचक वाक्य से संदर्भ स्पष्ट रहता है।
- source_word: ἐκ τῶν Φαρισαίων
  choice: फरीसियों में से
  rationale: ἐκ समूह के भीतर से संबंध या सदस्यता बताता है; ‘में से’ इस अर्थ को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: Νικόδημος ὄνομα αὐτῷ
  choice: जिसका नाम नीकुदेमुस था
  rationale: यूनानी नामकरण-वाक्यांश का अर्थ सीधे और सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: ἄρχων
  choice: एक अगुआ
  rationale: ἄρχων अधिकार या नेतृत्व का पद रखने वाले व्यक्ति को दर्शाता है। ‘अगुआ’ पर्याप्त व्यापक है और पाठ में स्पष्ट न किए गए किसी विशिष्ट परिषद-पद को आरोपित नहीं करता।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों का
  rationale: यहाँ पदबंध यहूदी समुदाय अथवा उसके नेतृत्व पर अधिकार का संकेत देता है; व्यापक अर्थ मुख्य पाठ में रखा गया है और सम्भव क्षेत्रीय अथवा प्राधिकारी-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαίων का अर्थ
  choice: यहूदियों का
  alternative: यहूदिया के लोगों का; यहूदी अधिकारियों में से
  rationale: शब्द जातीय-धार्मिक समुदाय, यहूदिया के निवासियों, या कुछ प्रसंगों में यहूदी अधिकारियों की ओर संकेत कर सकता है। फरीसी और अगुआ के रूप में नीकुदेमुस का परिचय नेतृत्व-संदर्भ सुझाता है, पर मूल शब्द की व्यापकता को मुख्य पाठ में बनाए रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। यूनानी वाक्य को हिन्दी की सहजता के लिए दो वाक्यों में बाँटा गया है। पादटिप्पणी-चिह्न संबंधित विवादित पदबंध के बाद रखा गया है।
