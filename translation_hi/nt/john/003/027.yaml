  yaml_path: translation/nt/john/003/027.yaml
  text: John answered and said[a], “A man is not able to receive even one thing unless it has been given to him from heaven.”
translation:
  language: hi
  text: यूहन्ना ने उत्तर देकर कहा, “कोई मनुष्य[a] एक भी वस्तु प्राप्त नहीं कर सकता, जब तक कि वह उसे स्वर्ग से न दी गई हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मनुष्य” का अर्थ सामान्य रूप से कोई भी व्यक्ति है, केवल पुरुष नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰωάννης καὶ εἶπεν
  choice: यूहन्ना ने उत्तर देकर कहा
  rationale: यह रूप यूनानी के ‘उत्तर दिया और कहा’ वाले कथात्मक सूत्र के दोनों अंगों को बनाए रखता है, पर आधुनिक हिन्दी में अधिक स्वाभाविक है।
- source_word: Οὐ δύναται
  choice: नहीं कर सकता
  rationale: यह δύναμαι में व्यक्त सामर्थ्य अथवा असमर्थता को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ एकवचन संज्ञा का प्रयोग सामान्य और प्रतिनिधिक अर्थ में है; ‘मनुष्य’ स्त्री और पुरुष दोनों को समेटते हुए स्रोत की व्यापकता बनाए रखता है।
- source_word: λαμβάνειν
  choice: प्राप्त करना
  rationale: संदर्भ में आशय किसी वस्तु, स्थान या भूमिका को हथिया लेने के बजाय उसे दिए जाने पर पाने से है।
- source_word: οὐδὲ ἓν
  choice: एक भी चीज़
  rationale: यह यूनानी अभिव्यक्ति की प्रबल नकारात्मकता और न्यूनतम सीमा—‘एक भी’—को स्पष्ट रखता है।
- source_word: ἐὰν μὴ
  choice: जब तक ... न
  rationale: यह यूनानी अपवादसूचक शर्त को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ᾖ δεδομένον αὐτῷ
  choice: वह उसे ... दी गई हो
  rationale: पूर्ण निष्क्रिय क्रियारूप पहले दिए जाने से बनी वर्तमान स्थिति को व्यक्त करता है; हिन्दी का ‘दी गई हो’ उस भाव को सुरक्षित रखता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: स्रोत में प्रयुक्त दैवी उद्गम की शाब्दिक अभिव्यक्ति रखी गई है; इसे व्याख्यात्मक रूप से ‘परमेश्वर से’ नहीं बनाया गया।
theological_decisions:
- issue: यूहन्ना के कथन में स्वर्ग से मिलने वाली वस्तु का दायरा
  choice: अनुवाद में ‘एक भी चीज़’ रखकर कथन की व्यापक भाषा सुरक्षित रखी गई है।
  alternative: इसे केवल सेवकाई, अधिकार या प्रतिष्ठा तक सीमित कर देना; अथवा इससे सर्वव्यापी नियतिवाद का स्पष्ट सिद्धान्त निकालना।
  rationale: तात्कालिक प्रसंग यूहन्ना और यीशु की सेवकाई तथा प्रतिष्ठा से जुड़ा है, पर पद की भाषा अधिक व्यापक है। अनुवाद न तो उसके प्रसंगगत प्रयोग को मिटाता है, न उससे किसी विशिष्ट नियतिवादी व्यवस्था को जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उत्तर देकर कहा’ स्रोत के दोहरे कथात्मक सूत्र को हिन्दी की स्वाभाविक अभिव्यक्ति में बनाए रखता है।
