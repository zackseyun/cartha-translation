  text: ἀπεκρίθη Νικόδημος καὶ εἶπεν αὐτῷ· Πῶς δύναται ταῦτα γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/003/009.yaml
  text: Nicodemus answered and said to him[a], “How can these things happen?”
translation:
  language: hi
  text: नीकुदेमुस ने उसे उत्तर दिया, “ये बातें कैसे हो सकती हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में ἀποκρίνομαι का सामान्य अर्थ ‘उत्तर देना’ है; यह स्वाभाविक और सटीक हिन्दी है।
- source_word: Νικόδημος
  choice: नीकुदेमुस
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: εἶπεν αὐτῷ
  choice: उसे … दिया
  rationale: ग्रीक के सर्वनाम αὐτῷ को ‘उसे’ के रूप में रखा गया है और εἶπεν को हिन्दी के स्वाभाविक संयुक्त संवाद-सूत्र ‘उत्तर दिया’ में समाहित किया गया है; ‘यीशु’ नाम जोड़कर निहित संदर्भ को स्पष्ट नहीं किया गया।
- source_word: Πῶς
  choice: कैसे
  rationale: यह रीति या संभावना पूछने वाला सामान्य प्रश्नवाचक क्रियाविशेषण है।
- source_word: δύναται
  choice: हो सकती हैं
  rationale: δύναμαι की संभावना/सामर्थ्य की शक्ति को आधुनिक हिन्दी में ‘सकना’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक का बहुवचन बनाए रखते हुए यह यीशु द्वारा अभी कही गई बातों की ओर संकेत करता है।
- source_word: γενέσθαι
  choice: हो
  rationale: γίνομαι यहाँ किसी बात के घटित या अस्तित्व में आने की संभावना व्यक्त करता है; ‘हो सकती हैं’ हिन्दी में ‘कैसे घटित हो सकती हैं/कैसे संभव हैं’ दोनों की सहज गुंजाइश रखता है।
theological_decisions:
- issue: नए जन्म से संबंधित नीकुदेमुस के प्रश्न में γενέσθαι का अर्थ
  choice: ये बातें कैसे हो सकती हैं?
  alternative: ये बातें कैसे घटित हो सकती हैं? / ये बातें कैसे संभव हैं?
  rationale: ‘हो सकती हैं’ स्वाभाविक हिन्दी में घटना और संभावना, दोनों अर्थ-छायाओं को खुला रखता है तथा प्रश्न में निहित रहस्य को किसी विशेष धर्मवैज्ञानिक व्याख्या से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ग्रीक के अपेक्षाकृत पुनरुक्त संवाद-सूत्र ‘उत्तर दिया और उससे कहा’ को हिन्दी के स्वाभाविक ‘उसे उत्तर दिया’ में संक्षिप्त किया गया है, बिना कथ्य बदले।
