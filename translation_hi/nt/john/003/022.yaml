  text: Μετὰ ταῦτα ἦλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὴν Ἰουδαίαν γῆν, καὶ ἐκεῖ διέτριβεν μετ’ αὐτῶν καὶ ἐβάπτιζεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/022.yaml
  text: After these things[a], Jesus and his disciples went into the land of Judea[c][b], and there he was spending time with them and baptizing.
translation:
  language: hi
  text: इन बातों के बाद यीशु और उसके शिष्य यहूदिया प्रदेश में गए। वहाँ वह उनके साथ कुछ समय रहा और बपतिस्मा देता रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूहन्ना 4:2 बाद में स्पष्ट करता है कि यीशु स्वयं बपतिस्मा नहीं दे रहे थे, बल्कि उसके शिष्य बपतिस्मा दे रहे थे।
    reason: cross_reference
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: बहुवचन संकेतवाचक अभिव्यक्ति और यूहन्ना के कथात्मक क्रम को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἦλθεν
  choice: गए
  rationale: यद्यपि यूनानी क्रिया का मूल अर्थ ‘आया’ है, उल्लिखित गंतव्य की ओर पिछले स्थान से गति के संदर्भ में हिन्दी में ‘गए’ स्वाभाविक है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: सम्बन्धसूचक यूनानी रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: εἰς τὴν Ἰουδαίαν γῆν
  choice: यहूदिया प्रदेश में
  rationale: γῆ यहाँ भूमि, देश या क्षेत्र का बोध करा सकता है; ‘प्रदेश’ भौगोलिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और केवल नगर यरूशलेम से व्यापक क्षेत्र को सूचित करता है।
- source_word: διέτριβεν
  choice: कुछ समय रहा
  rationale: अपूर्णकालिक क्रिया वहाँ ठहरने या समय बिताने की जारी अवस्था बताती है; यह रूप अवधि के भाव को सहजता से व्यक्त करता है।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ
  rationale: यह सर्वनाम निकटतम बहुवचन संज्ञा, शिष्यों, की ओर संकेत करता है।
- source_word: ἐβάπτιζεν
  choice: बपतिस्मा देता रहा
  rationale: ‘बपतिस्मा’ मान्य धार्मिक पद है और किसी विशिष्ट रीति को अनावश्यक रूप से निर्धारित नहीं करता; ‘देता रहा’ अपूर्णकाल की जारी क्रिया दर्शाता है।
theological_decisions:
- issue: यूहन्ना 4:2 के प्रकाश में बपतिस्मा देने वाली क्रिया का कर्ता
  choice: 'इस पद में यीशु को व्याकरणिक कर्ता बनाए रखा गया है: ‘वह ... बपतिस्मा देता रहा।’'
  alternative: मुख्य पाठ में क्रिया का कर्ता शिष्यों को बना देना या वाक्य को कर्मवाच्य कर देना।
  rationale: एकवचन ἐβάπτιζεν का स्वाभाविक व्याकरणिक कर्ता यीशु है। यूहन्ना 4:2 बाद में स्पष्ट करता है कि वास्तविक रूप से बपतिस्मा शिष्य देते थे; इसलिए इस पद की अभिव्यक्ति बदले बिना टिप्पणी में स्पष्टीकरण देना मूल पाठ का तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यहूदिया प्रदेश’ मूल के भौगोलिक संकेत को सामान्य पाठक के लिए स्पष्ट करता है। सभी क्रियाएँ हिन्दी कथन-प्रवाह के अनुकूल हैं, जबकि यूनानी अपूर्णकाल का जारी भाव भी सुरक्षित है।
