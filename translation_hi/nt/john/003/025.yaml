  yaml_path: translation/nt/john/003/025.yaml
  text: Then a dispute arose between John's disciples and a Jew about purification[a].
translation:
  language: hi
  text: तब यूहन्ना के चेलों और एक यहूदी के बीच शुद्धिकरण[a] के विषय में विवाद उठ खड़ा हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धि” या “अनुष्ठानिक शुद्धिकरण।” यूनानी शब्द सामान्य रूप से शुद्ध करने को दर्शा सकता है, पर इस प्रसंग में संभवतः धार्मिक शुद्धि का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο
  choice: उठ खड़ा हुआ
  rationale: यहाँ क्रिया किसी घटना के उत्पन्न होने को व्यक्त करती है। ‘विवाद उठ खड़ा हुआ’ स्वाभाविक हिन्दी है और आरम्भ होने का भाव बनाए रखता है।
- source_word: οὖν
  choice: तब
  rationale: यह पद कथा की प्रगति और पिछले प्रसंग से हल्का संबंध दिखाता है; ‘तब’ अनावश्यक रूप से कठोर निष्कर्ष व्यक्त किए बिना प्रवाह बनाए रखता है।
- source_word: ζήτησις
  choice: विवाद
  rationale: यह शब्द चर्चा, बहस या विवाद को सूचित कर सकता है। प्रसंग में मतभेदपूर्ण बातचीत का भाव होने के कारण ‘विवाद’ उपयुक्त है।
- source_word: ἐκ τῶν μαθητῶν Ἰωάννου ... μετὰ Ἰουδαίου
  choice: यूहन्ना के चेलों और एक यहूदी के बीच
  rationale: यूनानी रचना शाब्दिक रूप से यूहन्ना के चेलों की ओर से/उनमें से उत्पन्न विवाद बताती है, जो एक यहूदी के साथ था। हिन्दी में ‘के बीच’ दोनों पक्षों को स्वाभाविक रूप से व्यक्त करता है और एकवचन Ἰουδαίου को सुरक्षित रखता है।
- source_word: περὶ καθαρισμοῦ
  choice: शुद्धिकरण के विषय में
  rationale: καθαρισμός सामान्य शुद्ध करने या धार्मिक-विधिक शुद्धि, दोनों का बोध करा सकता है। ‘शुद्धिकरण’ इस व्यापकता और प्रसंगगत धार्मिक अर्थ को बिना अधिक स्पष्ट किए बनाए रखता है।
theological_decisions:
- issue: क्या καθαρισμός को स्पष्ट रूप से धार्मिक-विधिक अर्थ में अनूदित किया जाए
  choice: शुद्धिकरण
  alternative: शुद्धि; धार्मिक-विधि के अनुसार शुद्धिकरण
  rationale: निकटवर्ती यूहन्नाई प्रसंग धार्मिक शुद्धि की ओर संकेत करता है, पर यह पद विवाद का सटीक दायरा नहीं बताता। इसलिए मुख्य पाठ में व्यापक पद रखा गया है और संभावित विधिक अर्थ पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चेले’ साधारण पाठकों के लिए स्वाभाविक है; वाक्य-विन्यास मूल के पक्षों, एकवचन ‘एक यहूदी’ और καθαρισμός की अर्थगत व्यापकता को सुरक्षित रखता है।
