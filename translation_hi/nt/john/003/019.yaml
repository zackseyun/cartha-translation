id: JHN.3.19
reference: John 3:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὕτη δέ ἐστιν ἡ κρίσις ὅτι τὸ φῶς ἐλήλυθεν εἰς τὸν κόσμον καὶ ἠγάπησαν οἱ ἄνθρωποι μᾶλλον τὸ σκότος ἢ τὸ φῶς, ἦν γὰρ ⸂αὐτῶν πονηρὰ⸃ τὰ ἔργα.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/019.yaml
  text: 'And this is the judgment: that the light has come into the world[a], and people loved the darkness rather than the light, because their works were evil.'
translation:
  language: hi
  text: 'और न्याय यह है: ज्योति संसार में आ चुकी है, पर लोगों ने ज्योति की अपेक्षा अंधकार से अधिक प्रेम किया, क्योंकि उनके काम बुरे थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρίσις
  choice: न्याय
  rationale: यह शब्द यहाँ न्यायिक परख और उसके प्रतिकूल परिणाम—दोनों की संभावना रखता है। ‘न्याय’ इस व्यापक अर्थ को बनाए रखता है; ‘दण्डाज्ञा’ अर्थ को समय से पहले केवल दोषसिद्धि तक सीमित कर देती।
- source_word: τὸ φῶς
  choice: ज्योति
  rationale: यूहन्ना के स्थापित प्रकाश-रूपक को बनाए रखने के लिए ‘ज्योति’ चुना गया है; मुख्य पाठ में इसे सीधे ‘यीशु’ कहकर रूपक की व्याख्या नहीं की गई।
- source_word: ἐλήλυθεν
  choice: आ चुकी है
  rationale: यूनानी पूर्णकाल ज्योति के आने और उसके वर्तमान प्रभाव को व्यक्त करता है; ‘आ चुकी है’ इस पक्ष को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: κόσμον
  choice: संसार
  rationale: ‘संसार’ यूहन्ना के प्रयोग की व्यापकता को बनाए रखता है, जिसमें जगत और उसमें रहने वाली मानवता दोनों की अर्थ-छाया उपस्थित हो सकती है।
- source_word: οἱ ἄνθρωποι
  choice: लोगों
  rationale: यहाँ बहुवचन संज्ञा समस्त मनुष्यों को सामान्य रूप से सूचित करती है, केवल पुरुषों को नहीं। ‘लोगों’ आधुनिक हिन्दी में इसका स्वाभाविक और सही समावेशी अनुवाद है।
- source_word: ἠγάπησαν ... μᾶλλον ... ἢ
  choice: की अपेक्षा ... से अधिक प्रेम किया
  rationale: यह रचना प्रेम और तुलनात्मक पसंद, दोनों को सुरक्षित रखती है; केवल ‘चुना’ या ‘पसन्द किया’ मूल क्रिया की नैतिक और भावनात्मक शक्ति घटा देता।
- source_word: τὸ σκότος
  choice: अंधकार
  rationale: ‘ज्योति’ के विपरीत यूहन्ना के प्रतीकात्मक विरोध को अक्षुण्ण रखता है।
- source_word: πονηρὰ τὰ ἔργα
  choice: काम बुरे थे
  rationale: ‘काम’ ἔργα का सहज हिन्दी रूप है और ‘बुरे’ πονηρά की नैतिक गुणवत्ता को स्पष्ट तथा सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘ज्योति’ का संकेत
  choice: मुख्य पाठ में ‘ज्योति’ रूपक को यथावत रखा गया।
  alternative: इसे स्पष्ट रूप से ‘यीशु’ या मसीही उपाधि के रूप में लिखना।
  rationale: निकटवर्ती प्रसंग ज्योति को पुत्र के प्रकाशन से जोड़ता है, पर यूनानी पाठ स्वयं रूपक का प्रयोग करता है। अनुवाद में रूपक बनाए रखने से यूहन्ना की साहित्यिक और धर्मवैचारिक बनावट सुरक्षित रहती है।
- issue: κρίσις का अर्थ-क्षेत्र
  choice: ‘न्याय’
  alternative: ‘दोषसिद्धि’ अथवा ‘दण्डाज्ञा’
  rationale: इस वाक्य में शब्द न्याय की वास्तविकता या आधार का परिचय देता है। व्यापक पद चुनने से न्यायिक परख और उसके परिणाम के बीच मूल पाठ का तनाव बना रहता है।
- issue: οἱ ἄνθρωποι की सामान्य मानव-सूचक शक्ति
  choice: ‘लोगों’
  alternative: ‘मनुष्यों’ या केवल पुरुष-सूचक ‘पुरुषों’
  rationale: प्रसंग मानवता की सामान्य प्रतिक्रिया की बात करता है। ‘लोगों’ से लिंग-संबंधी गलत सीमांकन किए बिना मूल आशय स्वाभाविक हिन्दी में व्यक्त होता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘ज्योति’ और ‘अंधकार’ को यूहन्ना के प्रमुख रूपकों के अनुरूप रखा गया है। ‘पर’ यूनानी καί के प्रसंगगत विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है।
