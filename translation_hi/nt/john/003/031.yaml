  text: Ὁ ἄνωθεν ἐρχόμενος ἐπάνω πάντων ἐστίν. ὁ ὢν ἐκ τῆς γῆς ἐκ τῆς γῆς ἐστιν καὶ ἐκ τῆς γῆς λαλεῖ· ὁ ἐκ τοῦ οὐρανοῦ ἐρχόμενος ἐπάνω πάντων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/031.yaml
  text: The one who comes from above is above all[a]. The one who is from the earth is from the earth and speaks from the earth[b]. The one who comes from heaven is above all.
translation:
  language: hi
  text: जो ऊपर से आता है, वह सबके ऊपर है[a]। जो पृथ्वी से है, वह पृथ्वी से है और पृथ्वी से बोलता है[b]। जो स्वर्ग से आता है, वह सबके ऊपर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले वाक्यांश में “ऊपर से” के स्थान पर “स्वर्ग से” भी समझा जा सकता है। यूनानी ἄνωθεν ऊपर से होने वाले उद्गम को दर्शाता है, जिसे आगे के “स्वर्ग से” द्वारा स्पष्ट किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी की बातें बोलता है।” यूनानी में “पृथ्वी से” की पुनरावृत्ति है; यह उद्गम, क्षेत्र या विषय का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄνωθεν
  choice: ऊपर से
  rationale: यहाँ यह शब्द पुनः आने का नहीं, ऊपर से होने वाले उद्गम का बोध कराता है। “ऊपर से” पृथ्वी के साथ विरोध बनाए रखता है, जबकि आगे “स्वर्ग से” उसका आशय स्पष्ट करता है।
- source_word: ἐρχόμενος
  choice: जो ... आता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत का स्वाभाविक हिन्दी रूप है और उसके वर्णनात्मक भाव को बनाए रखता है।
- source_word: ἐπάνω πάντων
  choice: सबके ऊपर
  rationale: यह वाक्यांश स्थान-संबंधी रूपक के द्वारा सर्वोच्चता व्यक्त करता है। “सबके ऊपर” व्यक्ति और वस्तु—दोनों की सम्भावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ὁ ὢν ἐκ τῆς γῆς
  choice: जो पृथ्वी से है
  rationale: यह पृथ्वीगत उद्गम पर बल देता है और स्वर्गीय उद्गम के साथ मूल पाठ का विरोध सुरक्षित रखता है।
- source_word: γῆ
  choice: पृथ्वी
  rationale: यहाँ शब्द स्वर्ग के विपरीत पार्थिव क्षेत्र को दर्शाता है; इसलिए “भूमि” या “देश” की अपेक्षा “पृथ्वी” उपयुक्त है।
- source_word: ἐκ τῆς γῆς ἐστιν
  choice: वह पृथ्वी से है
  rationale: मूल यूनानी की जानबूझकर की गई पुनरावृत्ति को बनाए रखा गया है, ताकि पार्थिव उद्गम और स्वभाव पर उसका बल सुनाई दे।
- source_word: ἐκ τῆς γῆς λαλεῖ
  choice: पृथ्वी से बोलता है
  rationale: यह अपेक्षाकृत शाब्दिक रूप ἐκ की पुनरावृत्ति बचाता है और इस बात को खुला रखता है कि आशय स्रोत, क्षेत्र अथवा विषय से है।
- source_word: οὐρανός
  choice: स्वर्ग
  rationale: यूहन्ना के इस प्रसंग में यह केवल भौतिक आकाश नहीं, बल्कि स्वर्गीय क्षेत्र को दर्शाता है।
theological_decisions:
- issue: पद में “ऊपर से” और “स्वर्ग से” का परस्पर सम्बन्ध
  choice: पहले ἄνωθεν का अनुवाद “ऊपर से” और बाद में ἐκ τοῦ οὐρανοῦ का “स्वर्ग से” किया गया है।
  alternative: दोनों का अनुवाद “स्वर्ग से” करना।
  rationale: मूल पाठ दो निकट सम्बन्धित, पर अलग अभिव्यक्तियाँ रखता है। यह चयन यूहन्ना की शब्दावली और अलंकारिक समानता को बनाए रखता है तथा दूसरी अभिव्यक्ति को पहली का आशय स्पष्ट करने देता है।
- issue: पृथ्वी से सम्बन्धित भाषा की पुनरावृत्ति
  choice: “पृथ्वी से ... पृथ्वी से ... पृथ्वी से” की पुनरावृत्ति सुरक्षित रखी गई है।
  alternative: इसे समेटकर “पार्थिव व्यक्ति पार्थिव रीति से बोलता है” कहना।
  rationale: पुनरावृत्ति पृथ्वीगत और स्वर्गीय उद्गम के विरोध पर विशेष बल देती है। इसे बनाए रखने से किसी एक व्याख्यात्मक अर्थ को पाठ में आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। मूल पाठ की असामान्य किंतु अर्थपूर्ण त्रिस्तरीय पुनरावृत्ति को सहज बनाने के लिए हटाया नहीं गया। “सबके ऊपर” सर्वोच्चता के भाव और मूल की व्यापकता दोनों को सुरक्षित रखता है।
