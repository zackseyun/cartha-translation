id: JHN.3.17
reference: John 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ ἀπέστειλεν ὁ θεὸς τὸν ⸀υἱὸν εἰς τὸν κόσμον ἵνα κρίνῃ τὸν κόσμον, ἀλλ’ ἵνα σωθῇ ὁ κόσμος δι’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/017.yaml
  text: For God did not send the Son into the world so that he might judge the world[a], but so that the world might be saved through him.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने पुत्र को संसार में इसलिए नहीं भेजा कि वह संसार का न्याय करे[a], बल्कि इसलिए कि संसार उसके द्वारा उद्धार पाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कि वह संसार को दोषी ठहराए।’ यूनानी क्रिया का मूल अर्थ ‘न्याय करना’ है, पर इस प्रसंग में इसका अर्थ अधिक संकुचित भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण देता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है, और οὐ क्रिया का निषेध करता है।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह ἀποστέλλω का सीधा और स्वाभाविक अर्थ है तथा यूहन्ना में परमेश्वर द्वारा पुत्र को भेजे जाने की धारणा को बिना अतिरिक्त अर्थ जोड़े बनाए रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: सप्रत्यय θεός यहाँ विशिष्ट रूप से परमेश्वर को दर्शाता है; आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ उपयुक्त और स्पष्ट है।
- source_word: τὸν υἱὸν
  choice: पुत्र
  rationale: मूल पाठ में स्पष्ट संबंधवाचक ‘उसका’ नहीं, बल्कि ‘पुत्र’ है। हिन्दी में ‘पुत्र’ पदवीगत अर्थ को बनाए रखता है और संदर्भ से परमेश्वर के साथ संबंध स्पष्ट है।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: εἰς गति और प्रवेश का भाव देता है; ‘संसार में भेजा’ स्वाभाविक हिन्दी है और इस भाव को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἵνα κρίνῃ τὸν κόσμον
  choice: इसलिए ... कि वह संसार का न्याय करे
  rationale: ἵνα उद्देश्य व्यक्त करता है। κρίνω का मूल अर्थ ‘न्याय करना’ है, जो ‘दोषी ठहराना’ से व्यापक है; इसलिए मुख्य पाठ में व्यापक अर्थ सुरक्षित रखा गया है।
- source_word: ἀλλ’ ἵνα
  choice: बल्कि इसलिए कि
  rationale: यह दोनों उद्देश्य-वाक्यों के बीच प्रबल विरोध और समानांतर रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σωθῇ
  choice: उद्धार पाए
  rationale: यह σῴζω के कर्मवाच्य रूप को व्यक्त करता है और बचाए जाने तथा उद्धार की व्यापक धार्मिक अवधारणा बनाए रखता है।
- source_word: ὁ κόσμος
  choice: संसार
  rationale: एक ही यूनानी शब्द की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है और इसे केवल किसी संकुचित समूह तक सीमित नहीं किया गया।
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम को दर्शाता है; ‘उसके द्वारा’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: σωθῇ के विपरीत κρίνῃ का अर्थ
  choice: न्याय करे
  alternative: दोषी ठहराए
  rationale: κρίνω अपने मूल अर्थ में ‘न्याय करना’ है, यद्यपि प्रसंग में ‘दोषी ठहराना’ अभिप्रेत हो सकता है। व्यापक शब्द को मुख्य पाठ में रखने से मूल की अर्थगत गुंजाइश और धार्मिक तनाव सुरक्षित रहते हैं; संकुचित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुत्र,’ ‘न्याय,’ और ‘उद्धार’ जैसे परिचित बाइबलीय शब्द मूल की पदवीगत तथा धार्मिक व्यापकता को बनाए रखते हैं।
