id: JHN.3.8
reference: John 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ πνεῦμα ὅπου θέλει πνεῖ, καὶ τὴν φωνὴν αὐτοῦ ἀκούεις, ἀλλ’ οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει· οὕτως ἐστὶν πᾶς ὁ γεγεννημένος ἐκ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/008.yaml
  text: The wind blows where it wishes[a], and you hear its sound, but you do not know where it comes from and where it goes[b]. So it is with everyone who has been born of the Spirit.
translation:
  language: hi
  text: हवा[a] जिधर चाहती है, उधर बहती है। तुम उसकी आवाज़[b] सुनते हो, लेकिन यह नहीं जानते कि वह कहाँ से आती है और कहाँ जाती है। ऐसा ही हर उस व्यक्ति के साथ है जिसका जन्म आत्मा से हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द pneuma का अर्थ ‘हवा’ या ‘आत्मा’ हो सकता है। यीशु ने पद के दोनों भागों में यही एक शब्द प्रयोग किया है, जिससे ऐसी शब्दक्रीड़ा बनती है जिसे हिन्दी में पूरी तरह बनाए रखना संभव नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ध्वनि’; यूनानी शब्द का अर्थ ‘आवाज़’, ‘ध्वनि’ या ‘वाणी’ हो सकता है, पर यहाँ वह हवा से उत्पन्न सुनाई देने वाले प्रभाव को बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα (पहला प्रयोग)
  choice: हवा
  rationale: πνεῖ (‘बहती है’) और उसकी सुनाई देने वाली φωνή के साथ प्रयुक्त होने के कारण यहाँ मौसम संबंधी अर्थ ‘हवा’ सबसे स्वाभाविक है।
- source_word: ὅπου θέλει πνεῖ
  choice: जिधर चाहती है, उधर बहती है
  rationale: यह सहज आधुनिक हिन्दी है और θέλει में निहित इच्छा तथा यूनानी वाक्य के मानवीकरण को बनाए रखती है।
- source_word: φωνήν
  choice: आवाज़
  rationale: हवा के सुनाई देने वाले प्रभाव के लिए ‘आवाज़’ सामान्य हिन्दी है; यूनानी शब्द का अर्थ ‘ध्वनि’ या ‘वाणी’ भी हो सकता है।
- source_word: οὐκ οἶδας πόθεν ἔρχεται καὶ ποῦ ὑπάγει
  choice: यह नहीं जानते कि वह कहाँ से आती है और कहाँ जाती है
  rationale: यह πόθεν/ποῦ और ἔρχεται/ὑπάγει की समानांतर रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οὕτως ἐστὶν
  choice: ऐसा ही ... के साथ है
  rationale: यह उपमा को उसके आत्मिक अनुप्रयोग से जोड़ने वाली तुलना को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: πᾶς ὁ γεγεννημένος
  choice: हर उस व्यक्ति ... जिसका जन्म ... हुआ है
  rationale: यह सामान्य और समावेशी अर्थ देता है तथा सिद्ध क्रिया-रूप में निहित, पहले घटित जन्म से बनी वर्तमान स्थिति को व्यक्त करता है।
- source_word: ἐκ τοῦ πνεύματος (अंतिम प्रयोग)
  choice: आत्मा से
  rationale: यूहन्ना 3 के नए जन्म के संदर्भ में यहाँ πνεῦμα परमेश्वर के आत्मा को सूचित करता है, और ἐκ के स्रोत या उद्गम के भाव को ‘से’ स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: एक ही पद में πνεῦμα के दोहरे अर्थ का अनुवाद
  choice: पहले प्रयोग को ‘हवा’ और अंतिम प्रयोग को ‘आत्मा’ किया गया है।
  alternative: दोनों प्रयोगों को ‘आत्मा’ या दोनों को ‘हवा’ करना; अथवा पहले प्रयोग को ‘आत्मा’ रखकर ‘हवा’ को पादटिप्पणी में देना।
  rationale: यूनानी में एक ही शब्द जानबूझकर प्राकृतिक हवा और आत्मा—दोनों अर्थों को जोड़ता है। आरंभ में ‘बहती है’ और सुनाई देने वाली आवाज़ ‘हवा’ का संकेत देती हैं, जबकि अंत में नया जन्म ‘आत्मा’ से है। हिन्दी में एक ही स्वाभाविक शब्द से दोनों अर्थ व्यक्त नहीं होते, इसलिए मुख्य पाठ अर्थों को अलग करता है और पादटिप्पणी शब्दक्रीड़ा को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ एकवचन संबोधन को दर्शाता है, जैसा यूनानी ἀκούεις और οἶδας में है। ‘हर उस व्यक्ति’ सामान्य अर्थ को स्पष्ट करता है और अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
