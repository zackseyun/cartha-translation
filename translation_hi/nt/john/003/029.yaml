id: JHN.3.29
reference: John 3:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων τὴν νύμφην νυμφίος ἐστίν· ὁ δὲ φίλος τοῦ νυμφίου ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ, χαρᾷ χαίρει διὰ τὴν φωνὴν τοῦ νυμφίου. αὕτη οὖν ἡ χαρὰ ἡ ἐμὴ πεπλήρωται.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/029.yaml
  text: The one who has the bride is the bridegroom[a]. But the friend of the bridegroom, who stands and hears him, rejoices greatly because of the bridegroom’s voice[c][b]. Therefore this joy of mine has been made complete.
translation:
  language: hi
  text: जिसके पास दुल्हन है, वही दूल्हा है। लेकिन दूल्हे का मित्र[a], जो खड़ा रहता है और उसे सुनता है, दूल्हे की आवाज़ सुनकर बहुत आनन्दित होता है[b]। इसलिए मेरा यह आनन्द पूरा हो गया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘दूल्हे का मित्र’; कुछ संस्कृतियों में यह भूमिका ‘बेस्ट मैन’ जैसी हो सकती है, पर यूनानी में शाब्दिक रूप से ‘दूल्हे का मित्र’ ही है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, ‘आनन्द से आनन्दित होता है’—यह यूनानी में बहुत अधिक आनन्द पर बल देने वाली अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘पूर्ण हो गया है’ या ‘अपनी भरपूरी तक पहुँच गया है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων τὴν νύμφην
  choice: दुल्हन जिस की है
  rationale: यह वाक्यांश स्वामित्व/सम्बन्ध का रूपक बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; νύμφη को विवाह-चित्र के कारण ‘दुल्हन’ रखा गया है।
- source_word: νυμφίος
  choice: दूल्हा
  rationale: आधुनिक मानक हिन्दी में विवाह के पुरुष पात्र के लिए यह स्पष्ट और सहज शब्द है तथा पद में इसकी पुनरावृत्ति सुरक्षित रहती है।
- source_word: φίλος τοῦ νυμφίου
  choice: दूल्हे का मित्र
  rationale: यूनानी पाठ शाब्दिक रूप से ‘दूल्हे का मित्र’ कहता है। ‘सहबाला’ या अंग्रेज़ी-सांस्कृतिक ‘बेस्ट मैन’ किसी विशिष्ट रीति को पाठ में जोड़ देते।
- source_word: ὁ ἑστηκὼς καὶ ἀκούων αὐτοῦ
  choice: जो खड़ा होकर उसकी सुनता है
  rationale: सिद्ध कृदन्त की वर्तमान-प्रासंगिक खड़ी अवस्था और ἀκούω के सम्बन्धकारक सर्वनाम को निकटता से व्यक्त करता है; अगले वाक्यांश से स्पष्ट है कि वह दूल्हे की आवाज़ सुनता है।
- source_word: χαρᾷ χαίρει
  choice: बहुत आनन्दित होता है
  rationale: सजातीय संज्ञा और क्रिया की यूनानी बलाघातपूर्ण अभिव्यक्ति को लकड़ीले ‘आनन्द से आनन्दित’ के बजाय स्वाभाविक हिन्दी में तीव्रता सहित व्यक्त किया गया है।
- source_word: διὰ τὴν φωνὴν τοῦ νυμφίου
  choice: दूल्हे की आवाज़ सुनकर
  rationale: διά + कर्मकारक का कारणार्थक भाव सहज हिन्दी में व्यक्त होता है; ‘आवाज़’ को स्पष्ट रखा गया है।
- source_word: ἡ χαρὰ ἡ ἐμὴ
  choice: मेरा यह आनन्द
  rationale: संकेतवाचक और निजवाचक बल दोनों को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: πεπλήρωται
  choice: अब पूरा हो गया है
  rationale: सिद्ध कर्मवाच्य का परिणामी भाव—आनन्द का पूर्ण अवस्था तक पहुँचना—व्यक्त करता है। ‘अब’ यूनानी सिद्ध काल की वर्तमान परिणति को हिन्दी में स्वाभाविक बनाता है, समय का नया दावा नहीं जोड़ता।
theological_decisions:
- issue: विवाह-रूपक और यूहन्ना की भूमिका
  choice: दुल्हन, दूल्हे और दूल्हे के मित्र की छवि को बिना व्याख्यात्मक पहचान जोड़े सुरक्षित रखा गया है।
  alternative: दुल्हन को स्पष्टतः कलीसिया/परमेश्वर की प्रजा कहना, अथवा मित्र को ‘सहबाला’ कहना।
  rationale: इस पद में दुल्हन की पहचान स्पष्ट नहीं की गई और φίλος केवल ‘मित्र’ कहता है; इसलिए अनुवाद बाद की कलीसियाई व्याख्या या किसी विशेष विवाह-रीति को मुख्य पाठ में नहीं रखता।
- issue: πεπλήρωται में पूर्णता या पूर्ति
  choice: पूरा हो गया है
  alternative: पूरा किया गया है; परिपूर्ण हो गया है; पूरा हुआ है
  rationale: यह चयन सिद्ध कर्मवाच्य की पूर्ण हुई और वर्तमान में बनी अवस्था को सहज हिन्दी में व्यक्त करता है, बिना इसे भविष्यवाणी की ‘पूर्ति’ तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘दुल्हन/दूल्हा’ संस्कृतनिष्ठ विकल्पों की अपेक्षा अधिक प्रचलित हैं। वाक्यरचना रूपक की औपचारिक समानता और स्वाभाविक हिन्दी के बीच संतुलन रखती है।
