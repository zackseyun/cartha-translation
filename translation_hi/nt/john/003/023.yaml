source:
  edition: SBLGNT
  text: ἦν δὲ καὶ ⸀ὁ Ἰωάννης βαπτίζων ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ, ὅτι ὕδατα πολλὰ ἦν ἐκεῖ, καὶ παρεγίνοντο καὶ ἐβαπτίζοντο·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/023.yaml
  text: John also was baptizing at Aenon near Salim[a], because there were many waters there[b], and people were coming and being baptized.
translation:
  language: hi
  text: यूहन्ना भी शालेम के पास ऐनोन में बपतिस्मा दे रहा था[a], क्योंकि वहाँ बहुत पानी था[b]; और लोग आते और बपतिस्मा लेते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बपतिस्मा देना’ के लिए प्रयुक्त यूनानी क्रिया का अनुवाद ‘डुबाना’ भी किया जा सकता है। यहाँ प्रचलित धार्मिक शब्द ‘बपतिस्मा’ रखा गया है; यह शब्द अपने-आप में बपतिस्मा देने की विधि का निर्णय नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “वहाँ बहुत-से जल थे।” इसका आशय यह भी हो सकता है कि वहाँ पानी बहुतायत में था या कई जल-स्रोत थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ καὶ ὁ Ἰωάννης βαπτίζων
  choice: यूहन्ना भी ... बपतिस्मा दे रहा था
  rationale: δέ को प्रसंग में हल्के संबंधसूचक के रूप में समझा गया है और अलग शब्द से व्यक्त नहीं किया गया; καί का अर्थ ‘भी’ से स्पष्ट है। ἦν के साथ वर्तमान कृदंत βαπτίζων अतीत में चल रही क्रिया बताता है, जिसे ‘दे रहा था’ से व्यक्त किया गया है।
- source_word: ἐν Αἰνὼν ἐγγὺς τοῦ Σαλείμ
  choice: शालेम के पास ऐनोन में
  rationale: स्थान-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है। दोनों स्थान-नामों का लिप्यंतरण किया गया है।
- source_word: ὅτι ὕδατα πολλὰ ἦν ἐκεῖ
  choice: क्योंकि वहाँ बहुत पानी था
  rationale: ὅτι यहाँ कारण बताता है। यूनानी में ‘बहुत-से जल’ बहुवचन है, पर आधुनिक हिन्दी में ‘बहुत पानी’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: παρεγίνοντο
  choice: लोग आते ... थे
  rationale: अपूर्ण भूतकाल बार-बार या लगातार आने की क्रिया बताता है। यूनानी में कर्ता अंतर्निहित है; हिन्दी में स्पष्टता के लिए ‘लोग’ जोड़ा गया है।
- source_word: ἐβαπτίζοντο
  choice: बपतिस्मा लेते थे
  rationale: यूनानी अपूर्ण भूतकाल का कर्मवाच्य लगातार या बार-बार बपतिस्मा पाए जाने को दर्शाता है। ‘बपतिस्मा लेते थे’ आधुनिक हिन्दी में इसका स्वाभाविक धार्मिक प्रयोग है और क्रिया के जारी रहने का भाव बनाए रखता है।
theological_decisions:
- issue: βαπτίζω का अनुवाद
  choice: बपतिस्मा देना / बपतिस्मा लेना
  alternative: डुबाना / डुबकी दिलाना
  rationale: ‘बपतिस्मा’ हिन्दी मसीही प्रयोग में स्थापित धार्मिक शब्द है। मुख्य पाठ में इसे रखने से किसी विशेष विधि के पक्ष में अनावश्यक सांप्रदायिक निष्कर्ष नहीं निकाला जाता; ‘डुबाना’ संबंधी शब्दार्थ-संभावना पाद-टिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में ‘भी’ से प्रसंगगत समानांतर गतिविधि व्यक्त होती है। अर्धविराम कारणवाचक उपवाक्य के बाद अगली जारी क्रिया को स्पष्ट रूप से अलग करता है।
