id: JHN.3.13
reference: John 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς ἀναβέβηκεν εἰς τὸν οὐρανὸν εἰ μὴ ὁ ἐκ τοῦ οὐρανοῦ καταβάς, ὁ υἱὸς τοῦ ⸀ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/013.yaml
  text: And no one has ascended into heaven except the one who descended from heaven—the Son of Man[a][b].
translation:
  language: hi
  text: और कोई स्वर्ग में नहीं चढ़ा, सिवाय उसके जो स्वर्ग से उतरा—मनुष्य का पुत्र।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो स्वर्ग से नीचे आया।’
    reason: lexical_alternative
  - marker: b
    text: ‘मनुष्य का पुत्र’ यीशु द्वारा अपने लिए प्रयुक्त विशिष्ट पदवी है और दानिय्येल 7:13–14 की प्रतिध्वनि करती है।
    reason: cross_reference
lexical_decisions:
- source_word: οὐδεὶς
  choice: कोई ... नहीं
  rationale: यह स्वाभाविक आधुनिक हिन्दी में व्यापक निषेध व्यक्त करता है और लिंग-विशेष का अनावश्यक संकेत नहीं देता।
- source_word: ἀναβέβηκεν
  choice: नहीं चढ़ा
  rationale: यूनानी पूर्ण काल में पूरी हुई क्रिया की वर्तमान प्रासंगिकता है। हिन्दी का सामान्य पूर्णतामूलक रूप प्रसंग में इसे स्वाभाविक ढंग से व्यक्त करता है; ‘चढ़ चुका है’ अनावश्यक बल जोड़ सकता है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग में
  rationale: εἰς की गमन-दिशा को ‘में’ व्यक्त करता है और हिन्दी में ‘स्वर्ग में चढ़ना’ स्वाभाविक है।
- source_word: εἰ μὴ
  choice: सिवाय उसके
  rationale: निषेध के बाद एकमात्र अपवाद को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἐκ τοῦ οὐρανοῦ καταβάς
  choice: जो स्वर्ग से उतरा
  rationale: संज्ञार्थक कृदन्त वाक्यांश का अर्थ सुरक्षित रहता है और ‘चढ़ा/उतरा’ का मूल विरोध भी बना रहता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह सुसमाचारों में यीशु की विशिष्ट आत्म-पदवी का प्रचलित हिन्दी रूप है और दानिय्येल 7 की अंतर्पाठीय प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: ‘मनुष्य का पुत्र’ का मसीह-विषयक आशय
  choice: इसे मान्य पदवी ‘मनुष्य का पुत्र’ के रूप में रखा गया है।
  alternative: ‘मानव जन’ अथवा केवल सामान्य मनुष्य के अर्थ वाला रूप
  rationale: यूनानी अभिव्यक्ति में सामान्य मानवीय मुहावरे और दानिय्येल 7 से जुड़ी पदवी—दोनों की प्रतिध्वनि संभव है। पारंपरिक पदवी इस तनाव को व्याख्यात्मक रूप से समाप्त नहीं करती।
- issue: आरोहण और अवरोहण का कालगत तथा मसीह-विषयक बल
  choice: ‘नहीं चढ़ा ... उतरा’ द्वारा स्वर्गीय उद्गम और अद्वितीय पहुँच के कथन को सीधे रखा गया है।
  alternative: व्याख्यात्मक विस्तार, जैसे ‘स्वर्ग से पृथ्वी पर आया’ या ‘अपने अधिकार से स्वर्ग गया’
  rationale: मूल पाठ प्रबल दावा करता है, पर उसके तात्त्विक निहितार्थों को खोलकर नहीं बताता; इसलिए अनुवाद भी विस्तार नहीं जोड़ता।
- issue: 'पाठांतर: ‘जो स्वर्ग में है’'
  choice: SBLGNT के मुख्य पाठ के अनुसार यह अतिरिक्त वाक्यांश मुख्य अनुवाद में नहीं रखा गया।
  alternative: ‘मनुष्य का पुत्र, जो स्वर्ग में है’
  rationale: कुछ पांडुलिपियों में ὁ ὢν ἐν τῷ οὐρανῷ मिलता है, पर प्रदत्त आलोचनात्मक मूलपाठ में यह नहीं है; इस पद के प्रकाशन-पाठ को उसी आधार पर रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चढ़ा/उतरा’ का समानांतर मूल यूनानी विरोध को स्पष्ट करता है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a], [b] सम्मिलित हैं।
