source:
  edition: SBLGNT
  text: πᾶς γὰρ ὁ φαῦλα πράσσων μισεῖ τὸ φῶς καὶ οὐκ ἔρχεται πρὸς τὸ φῶς, ἵνα μὴ ἐλεγχθῇ τὰ ἔργα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/003/020.yaml
  text: For everyone who practices evil hates the light and does not come to the light[b][a], lest his works be exposed.
translation:
  language: hi
  text: क्योंकि जो कोई बुरे काम करता रहता है, वह ज्योति से घृणा करता है और ज्योति के पास नहीं आता, ताकि उसके काम उजागर न हो जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके कामों का दोष सामने न आ जाए” अथवा “उसके कामों में दोष न दिखाया जाए”; यूनानी क्रिया में बुराई को उजागर करने, दोष दिखाने, या गलत ठहराने के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ὁ
  choice: क्योंकि जो कोई
  rationale: γάρ के व्याख्यात्मक संबंध को ‘क्योंकि’ से और articular participle की सर्वसमावेशी, सामान्य अभिव्यक्ति को ‘जो कोई’ से स्वाभाविक हिन्दी में रखा गया है।
- source_word: φαῦλα πράσσων
  choice: बुरे काम करता रहता है
  rationale: φαῦλα यहाँ नैतिक बुराई दर्शाता है, और वर्तमान कृदंत πράσσων चरित्रगत अथवा जारी आचरण का भाव देता है; ‘करता रहता है’ उस पहलू को सहज हिन्दी में व्यक्त करता है।
- source_word: μισεῖ τὸ φῶς
  choice: ज्योति से घृणा करता है
  rationale: μισεῖ की प्रबल विरोधात्मक शक्ति ‘घृणा करता है’ से बनी रहती है। ‘ज्योति’ यूहन्ना के प्रकाश-संबंधी रूपक और उसके धर्मवैज्ञानिक भार को सुरक्षित रखती है।
- source_word: οὐκ ἔρχεται πρὸς τὸ φῶς
  choice: ज्योति के पास नहीं आता
  rationale: मूल के गति-संबंधी रूपक को बिना व्याख्यात्मक विस्तार के स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: ἵνα μὴ ἐλεγχθῇ
  choice: ताकि ... प्रकट न हो जाएँ
  rationale: ἵνα μή के नकारात्मक प्रयोजन अथवा बचाव के भाव को ‘ताकि ... न’ से व्यक्त किया गया है। प्रकाश के प्रसंग में ἐλέγχω का ‘उजागर/प्रकट करना’ अर्थ सबसे उपयुक्त है।
- source_word: τὰ ἔργα αὐτοῦ
  choice: उसके काम
  rationale: ἔργα को ‘काम’ कहना सामान्य आधुनिक हिन्दी में स्वाभाविक है और αὐτοῦ के एकवचन सामान्य-संदर्भ को ‘उसके’ से सुरक्षित रखता है।
theological_decisions:
- issue: सामान्य कथन में एकवचन पुल्लिंग रूप
  choice: उसके काम
  alternative: उनके काम
  rationale: यूनानी पाठ एकवचन सामान्य व्यक्ति (ὁ ... πράσσων ... αὐτοῦ) की बात करता है। हिन्दी में ‘जो कोई ... उसके’ उसी संख्या और प्रतिनिधिक सामान्यता को सहज रूप से बनाए रखता है।
- issue: ἐλεγχθῇ का प्रकाश के संबंध में अर्थ
  choice: प्रकट न हो जाएँ
  alternative: दोष सिद्ध न हो जाए / डाँट न पड़े
  rationale: इस प्रसंग में प्रकाश कामों को सामने लाता है; इसलिए प्रकटीकरण मुख्य भाव है। फिर भी क्रिया में गलत ठहराने या दोष दिखाने की छाया संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। यूहन्ना के केंद्रीय रूपक के कारण ‘प्रकाश’ के बजाय पारंपरिक किंतु अब भी बोधगम्य ‘ज्योति’ चुना गया है। वर्तमान कृदंत का चरित्रगत भाव ‘करता रहता है’ से व्यक्त हुआ है।
