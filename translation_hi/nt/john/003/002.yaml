id: JHN.3.2
reference: John 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτος ἦλθεν πρὸς αὐτὸν νυκτὸς καὶ εἶπεν αὐτῷ· Ῥαββί, οἴδαμεν ὅτι ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος· οὐδεὶς γὰρ ⸂δύναται ταῦτα τὰ σημεῖα⸃ ποιεῖν ἃ σὺ ποιεῖς, ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/003/002.yaml
  text: This man came to him by night and said to him[a], “Rabbi, we know that you have come from God as a teacher[c][b], for no one is able to do these signs that you do unless God is with him.”
translation:
  language: hi
  text: वह रात को[a] यीशु के पास आया और उनसे कहा, “रब्बी, हम जानते हैं कि आप परमेश्वर की ओर से एक शिक्षक के रूप में आए हैं, क्योंकि यदि परमेश्वर उसके साथ न हो, तो कोई भी ये चिन्ह नहीं कर सकता जो आप करते हैं[b][c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रात में।” यूहन्ना के सुसमाचार में रात और अंधकार कभी-कभी प्रतीकात्मक अर्थ भी रखते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “ये चमत्कारी चिन्ह।” यूनानी शब्द σημεῖα को यूहन्ना में “चिन्ह” अनूदित किया गया है, ताकि यह अर्थ बना रहे कि ये कार्य अपने से परे संकेत करते हैं।
    reason: lexical_alternative
  - marker: c
    text: मूल यूनानी में “यदि परमेश्वर उसके साथ न हो” है; निकुदेमुस सीधे यीशु को संबोधित करने के बाद यहाँ तीसरे पुरुष में बात करता है।
    reason: source_texture
lexical_decisions:
- source_word: οὗτος
  choice: वह
  rationale: यह सर्वनाम पिछले पद में परिचित कराए गए नीकुदेमुस की ओर संकेत करता है। हिन्दी कथात्मक शैली में “वह” स्वाभाविक है; “यह व्यक्ति” अनावश्यक रूप से भारी लगेगा।
- source_word: ἦλθεν πρὸς αὐτὸν
  choice: यीशु के पास आया
  rationale: संदर्भ से αὐτόν का संकेत यीशु की ओर है। स्वतंत्र पद में संदर्भ स्पष्ट रखने के लिए नाम का प्रयोग स्वाभाविक है।
- source_word: νυκτός
  choice: रात को
  rationale: समयवाचक संबंधकारक का सहज आधुनिक हिन्दी रूप “रात को” है। यूहन्ना में रात और अंधकार की संभावित प्रतीकात्मक प्रतिध्वनि को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यह यहूदी संबोधन ग्रीक पाठ में भी लिप्यंतरित रूप में है; “रब्बी” ऐतिहासिक परिवेश और संबोधन की विशिष्टता बनाए रखता है।
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: मूल का प्रथम पुरुष बहुवचन ज्यों का त्यों रखा गया है; इसे “मैं जानता हूँ” करके एकवचन नहीं बनाया गया।
- source_word: ἀπὸ θεοῦ ἐλήλυθας διδάσκαλος
  choice: आप परमेश्वर की ओर से शिक्षक होकर आए हैं
  rationale: यह वाक्यांश परमेश्वर से उद्गम और शिक्षक की भूमिका दोनों व्यक्त करता है। “भेजे गए हैं” नहीं कहा गया, क्योंकि यहाँ भेजने का विशिष्ट क्रियापद नहीं है।
- source_word: ταῦτα τὰ σημεῖα
  choice: ये चिन्ह
  rationale: यूहन्ना में σημεῖα ऐसे आश्चर्यकर्म हैं जो अपने से परे यीशु की पहचान और कार्य की ओर संकेत करते हैं; “चिन्ह” इस अर्थ-भार को “चमत्कार” से अधिक अच्छी तरह सुरक्षित रखता है।
- source_word: ποιεῖν ἃ σὺ ποιεῖς
  choice: ये चिन्ह, जो आप करते हैं, नहीं कर सकता
  rationale: ποιέω की पुनरावृत्ति को हिन्दी में “करते/कर सकता” द्वारा यथासंभव बनाए रखा गया है।
- source_word: ἐὰν μὴ ᾖ ὁ θεὸς μετ’ αὐτοῦ
  choice: यदि परमेश्वर उसके साथ न हो
  rationale: मूल में सीधे “आप” से बात करने के बाद तीसरे पुरुष “उसके” का प्रयोग है। इस बदलाव को सहज बनाए रखते हुए मिटाया नहीं गया।
theological_decisions:
- issue: यूहन्ना के प्रसंग में σημεῖα का अनुवाद
  choice: चिन्ह
  alternative: चमत्कार / चमत्कारी चिन्ह
  rationale: “चिन्ह” इन कार्यों के आश्चर्यपूर्ण होने को नकारे बिना उनके संकेतात्मक, मसीह-प्रकाशक कार्य को सुरक्षित रखता है।
- issue: दूसरे पुरुष से तीसरे पुरुष में बदलाव
  choice: यदि परमेश्वर उसके साथ न हो
  alternative: यदि परमेश्वर आपके साथ न हो
  rationale: ग्रीक पाठ में निकुदेमुस “आप” से “उसके” की ओर बदलता है। इसे सामान्य बनाकर हटाने के बजाय मूल की औपचारिक अथवा कहावत-सदृश अभिव्यक्ति बनाए रखी गई है।
- issue: ἀπὸ θεοῦ ἐλήλυθας में औपचारिक भेजे जाने का भाव
  choice: परमेश्वर की ओर से ... आए हैं
  alternative: परमेश्वर ने आपको भेजा है
  rationale: मूल पाठ परमेश्वर से आने की बात कहता है, पर इस पद में “भेजना” क्रिया का प्रयोग नहीं करता; अतः उससे अधिक निश्चित धर्मवैज्ञानिक दावा नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यीशु के लिए आदरसूचक “आप/उनसे” प्रयोग किया गया है। वाक्य की औपचारिकता निकुदेमुस की विनम्र संबोधन-शैली के अनुरूप है, जबकि अनावश्यक संस्कृतनिष्ठ शब्दावली से बचा गया है।
