    issue: Role expression with होकर
    rationale: “शिक्षक होकर आए हैं” is understandable, but in modern Hindi it can ambiguously suggest a prior change of status. “एक शिक्षक के रूप में आए हैं” more directly expresses διδάσκαλος as the role in which Jesus has come from God.
  - severity: low
    issue: Conditional clause placement
    rationale: Placing “यदि परमेश्वर उसके साथ न हो” before the main assertion makes the Hindi sentence smoother while retaining the source's third-person wording and conditional meaning.
