  source_fidelity: The draft accurately preserves the night setting, the plural “we know,” the Johannine term “signs,” and the notable shift from direct address to the third person in “unless God is with him.” “परमेश्वर की ओर से” appropriately renders ἀπὸ θεοῦ without importing “sent.”
