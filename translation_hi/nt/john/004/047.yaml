language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτος ἀκούσας ὅτι Ἰησοῦς ἥκει ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν ἀπῆλθεν πρὸς αὐτὸν καὶ ⸀ἠρώτα ἵνα καταβῇ καὶ ἰάσηται αὐτοῦ τὸν υἱόν, ἤμελλεν γὰρ ἀποθνῄσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/047.yaml
  text: When this man heard that Jesus had come from Judea into Galilee[a], he went to him and asked him to come down and heal his son[b], for he was about to die.
translation:
  language: hi
  text: जब उस व्यक्ति ने सुना कि यीशु यहूदिया से गलील आ गए हैं, तो वह उनके पास गया और उनसे अनुरोध करता रहा कि वे नीचे आएँ और उसके बेटे को चंगा करें, क्योंकि उसका बेटा मरने पर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: उस व्यक्ति
  rationale: यह संकेतवाचक सर्वनाम पिछले पद के राजकीय अधिकारी की ओर लौटता है; हिन्दी में ‘उस व्यक्ति’ संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἀκούσας
  choice: जब ... ने सुना
  rationale: अओरिस्ट कृदन्त का कालसूचक संबंध सहज हिन्दी में ‘जब ... सुना’ से व्यक्त होता है।
- source_word: ἥκει
  choice: आ गए हैं
  rationale: ἥκω आने के परिणामस्वरूप उपस्थित होने का भाव देता है; सुनी हुई खबर के भीतर पूर्ण आगमन को ‘आ गए हैं’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: यहूदिया से गलील
  rationale: ‘से’ प्रस्थान-बिंदु और गंतव्य दोनों को स्पष्ट करता है; हिन्दी में ‘गलील में’ जोड़ना अनावश्यक है, क्योंकि ‘आ गए’ गंतव्य को सहज रूप से दर्शाता है।
- source_word: ἀπῆλθεν πρὸς αὐτόν
  choice: वह उनके पास गया
  rationale: यह एक स्थान से यीशु के पास जाने की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠρώτα
  choice: विनती करता रहा
  rationale: अपूर्ण भूतकाल चलती या बार-बार की गई प्रार्थना का संकेत दे सकता है। प्रसंग की तात्कालिकता में ‘विनती’ ἐρωτάω के आग्रहपूर्ण प्रयोग को व्यक्त करती है, जबकि ‘करता रहा’ उसके पक्ष को बनाए रखता है।
- source_word: ἵνα καταβῇ
  choice: कि वे नीचे चलकर
  rationale: ἵνα को अनुरोध की विषय-वस्तु बताने वाले ‘कि’ से और καταβαίνω के स्थलाकृतिक नीचे जाने को ‘नीचे चलकर’ से व्यक्त किया गया है।
- source_word: ἰάσηται
  choice: चंगा कर दें
  rationale: शारीरिक आरोग्य के इस प्रसंग में ‘चंगा करना’ स्पष्ट, प्रतिष्ठित और बाइबिलीय हिन्दी में प्रचलित है; ‘दें’ विनती के अनुरूप स्वाभाविकता जोड़ता है।
- source_word: αὐτοῦ τὸν υἱόν
  choice: उसके बेटे को
  rationale: सम्बन्धकारक और कर्मकारक संरचना का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: ἤμελλεν γὰρ ἀποθνῄσκειν
  choice: क्योंकि वह मरने पर था
  rationale: μέλλω और क्रियार्थक रूप निकट भविष्य अथवा आसन्न मृत्यु दर्शाते हैं; ‘मरने पर था’ उस तात्कालिकता को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘वह मरने पर था’ में ‘वह’ का संदर्भ
  choice: अधिकारी का बेटा
  alternative: यीशु या अधिकारी
  rationale: निकटतम व्याकरणिक संदर्भ ‘उसका बेटा’ है और कथा की बीमारी तथा आरोग्य की स्थिति भी उसी को संदर्भित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन ‘वे/उनके’ यीशु के लिए प्रयोग हुआ है। भाषा सरल और गरिमापूर्ण रखी गई है। यूनानी अपूर्ण भूतकाल की संभावित निरंतरता मुख्य पाठ में ‘विनती करता रहा’ से व्यक्त की गई है, और ‘नीचे’ मूल की स्थलाकृतिक दिशा को सुरक्षित रखता है।
