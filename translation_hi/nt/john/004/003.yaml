  text: वह यहूदिया को छोड़कर फिर गलील चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: छोड़कर
  rationale: यहाँ ἀφίημι किसी स्थान को पीछे छोड़ने के अर्थ में है। ‘यहूदिया को छोड़कर’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी सकर्मक रचना को भी दर्शाता है।
- source_word: τὴν Ἰουδαίαν
  choice: यहूदिया
  rationale: यह सुसमाचार के भौगोलिक प्रदेश का प्रचलित और स्पष्ट हिन्दी नाम है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: ἀπέρχομαι यहाँ एक स्थान से दूसरे स्थान की ओर जाने को व्यक्त करता है। ‘चला गया’ सहज हिन्दी है और प्रसंग के गतिशील भाव को बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν में पुनः जाने या लौटने दोनों का भाव हो सकता है। ‘फिर’ मूल की इस व्यापकता को बनाए रखता है और हिन्दी पाठक के लिए स्वाभाविक है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील
  rationale: εἰς गंतव्य की ओर गति बताता है। हिन्दी में ‘गलील चला गया’ स्वाभाविक रूप से ‘गलील को/में गया’ का अर्थ देता है, इसलिए अतिरिक्त परसर्ग आवश्यक नहीं है।
