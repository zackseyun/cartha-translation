id: JHN.4.27
reference: John 4:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐπὶ τούτῳ ἦλθαν οἱ μαθηταὶ αὐτοῦ, καὶ ⸀ἐθαύμαζον ὅτι μετὰ γυναικὸς ἐλάλει· οὐδεὶς μέντοι εἶπεν· Τί ζητεῖς; ἢ τί λαλεῖς μετ’ αὐτῆς;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/027.yaml
  text: And at this point his disciples came[a], and they were amazed that he was speaking with a woman. Yet no one said, “What are you seeking?” or[b], “Why are you speaking with her?”
translation:
  language: hi
  text: उसी समय उसके चेले आ गए। वे इस बात से चकित थे कि वह एक स्त्री से बात कर रहा था। फिर भी किसी ने नहीं कहा, “क्या चाहिए?[a]” या, “आप उससे क्यों बात कर रहे हैं?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम क्या खोजते हो?”
    reason: ζητεῖς के अधिक शाब्दिक अर्थ और प्रश्न की सम्भावित अर्थ-छाया को सुरक्षित रखने के लिए।
  - marker: b
    text: शाब्दिक रूप से, “आप उससे क्या बात कर रहे हैं?” आशय है, “आप उससे क्यों बात कर रहे हैं?”
    reason: यूनानी τί के शाब्दिक ‘क्या’ और प्रसंगगत ‘क्यों’ के बीच अंतर स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ἐπὶ τούτῳ
  choice: उसी समय
  rationale: यह पदबंध यहाँ स्थान नहीं, कथा में उसी क्षण को सूचित करता है। ‘उसी समय’ आधुनिक हिन्दी में स्वाभाविक है और घटनाओं की निकटता बनाए रखता है।
- source_word: ἐθαύμαζον
  choice: वे इस बात से चकित थे
  rationale: अपूर्ण भूतकाल उनकी बनी हुई आश्चर्य की प्रतिक्रिया को व्यक्त करता है; ‘चकित थे’ इसे केवल क्षणिक घटना बनाकर प्रस्तुत नहीं करता।
- source_word: μετὰ γυναικὸς
  choice: एक स्त्री से
  rationale: गुणवाचक संज्ञा के साथ उपपद नहीं है, इसलिए अनिश्चित अर्थ ‘एक स्त्री’ उपयुक्त है। प्रसंग स्त्री का संकेत करता है, पत्नी का नहीं।
- source_word: ἐλάλει
  choice: बात कर रहा था
  rationale: अपूर्ण भूतकाल चल रही बातचीत दर्शाता है। ‘बात कर रहा था’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μέντοι
  choice: फिर भी
  rationale: चेलों के चकित होने और उनके प्रश्न न करने के बीच रियायती विरोध स्पष्ट करता है।
- source_word: Τί ζητεῖς;
  choice: क्या चाहिए?
  rationale: ζητέω का मूल अर्थ ‘खोजना’ है, पर कर्म के अनुल्लेख और इस संवाद में प्रश्न का स्वाभाविक आशय ‘क्या चाहिए?’ हो सकता है। यह हिन्दी में कर्ता के लिंग और प्रश्न किससे कहा जाता, दोनों को अनावश्यक रूप से निश्चित भी नहीं करता; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: τί λαλεῖς μετ’ αὐτῆς;
  choice: आप उससे क्यों बात कर रहे हैं?
  rationale: यूनानी में τί शाब्दिक रूप से ‘क्या’ है, किंतु μετά के साथ यहाँ प्रश्न का स्वाभाविक व्यावहारिक बल ‘क्यों’ है। अधिक शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यीशु का एक स्त्री से बात करना और चेलों की सामाजिक प्रतिक्रिया
  choice: मुख्य पाठ केवल चेलों के चकित होने को बताता है और उसके कारण की व्याख्या नहीं जोड़ता।
  alternative: पद में ही यहूदी-सामरी संबंधों या पुरुष-स्त्री सामाजिक प्रथा का स्पष्ट उल्लेख जोड़ना।
  rationale: यूनानी पाठ आश्चर्य का कारण विस्तार से नहीं बताता। सामाजिक पृष्ठभूमि महत्त्वपूर्ण हो सकती है, पर उसे मुख्य पाठ में जोड़ना मूल की संयमित अभिव्यक्ति से आगे जाना होगा।
- issue: Τί ζητεῖς; में प्रश्न के संबोधित व्यक्ति की पहचान
  choice: ‘क्या चाहिए?’ द्वारा संबोधित व्यक्ति का लिंग और पहचान खुली रखी गई है।
  alternative: इसे स्पष्टतः स्त्री से पूछा गया प्रश्न या स्पष्टतः यीशु से पूछा गया प्रश्न बनाना।
  rationale: यूनानी में संबोधन या सर्वनाम नहीं है। हिन्दी में लिंगसूचक क्रिया जोड़ने से वह अस्पष्टता मिट जाती, इसलिए स्वाभाविक किंतु लिंग-निरपेक्ष रूप चुना गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेले’ सामान्य बाइबलीय हिन्दी में परिचित है। संवाद में ‘आप’ यीशु के प्रति स्वाभाविक सम्मान व्यक्त करता है; पहले प्रश्न में कर्ता-विहीन ‘क्या चाहिए?’ मूल की संबोधन-संबंधी अस्पष्टता बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित वाक्यांशों के साथ दिए गए हैं।
