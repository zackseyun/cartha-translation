  text: λέγει αὐτῷ ὁ Ἰησοῦς· Πορεύου· ὁ υἱός σου ζῇ. ⸀ἐπίστευσεν ὁ ἄνθρωπος τῷ λόγῳ ⸀ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς καὶ ἐπορεύετο.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/050.yaml
  text: Jesus said to him[a], “Go; your son lives.” The man believed the word that Jesus spoke to him and went on his way.
translation:
  language: hi
  text: यीशु ने उससे कहा, “जाओ; तुम्हारा बेटा जीवित है।” उस मनुष्य ने उस बात पर विश्वास किया जो यीशु ने उससे कही थी, और वह चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πορεύου
  choice: जाओ
  rationale: वर्तमान मध्यवाच्य आज्ञार्थक यहाँ लौट जाने की सीधी आज्ञा है; ‘जाओ’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὁ υἱός σου
  choice: तुम्हारा बेटा
  rationale: υἱός विशेष रूप से पुत्र को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘बेटा’ स्वाभाविक है और स्रोत में व्यक्त लिंग को बनाए रखता है।
- source_word: ζῇ
  choice: जीवित है
  rationale: वर्तमानकालीन कथन को भविष्यवाणी न बनाते हुए यह स्पष्ट करता है कि बेटा अभी जीवित है; ‘जीता है’ की अपेक्षा हिन्दी में अधिक स्वाभाविक है।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: πιστεύω यहाँ व्यक्ति द्वारा यीशु की कही बात को सत्य मानने या उस पर भरोसा करने को व्यक्त करता है; ‘विश्वास किया’ शब्द-समूह की संगति और प्रसंग की खुली धार्मिक अर्थवत्ता बनाए रखता है।
- source_word: ὁ ἄνθρωπος
  choice: उस मनुष्य ने
  rationale: इस पद में यूनानी पाठ पहले प्रयुक्त राजकीय अधिकारी की उपाधि दोहराने के बजाय सामान्य ἄνθρωπος कहता है; अनुवाद उसी बदलाव को सुरक्षित रखता है।
- source_word: τῷ λόγῳ ὃν εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: यीशु की कही हुई बात पर
  rationale: λόγος यहाँ बोले गए कथन को सूचित करता है। हिन्दी में ‘कही हुई बात’ संबंधवाचक उपवाक्य का अर्थ स्वाभाविक और संक्षिप्त रूप से देता है।
- source_word: ἐπορεύετο
  choice: चल पड़ा
  rationale: अपूर्ण भूतकाल उस व्यक्ति के आज्ञा मानकर यात्रा पर निकलने या आगे बढ़ने को दर्शाता है; ‘चल पड़ा’ हिन्दी कथा-शैली में इस आरंभित गति को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के कथन के प्रति प्रतिक्रिया में πιστεύω का अनुवाद
  choice: विश्वास किया
  alternative: भरोसा किया
  rationale: पद यह तय नहीं करता कि यह प्रतिक्रिया पूर्ण उद्धारकारी विश्वास है या यीशु की प्रतिज्ञा पर व्यावहारिक भरोसा। ‘विश्वास किया’ यूहन्ना में πιστεύω की शब्दगत संगति रखता है, जबकि पादटिप्पणी प्रसंगानुकूल ‘भरोसा किया’ को सामने रखती है और धार्मिक तनाव को अनिर्णीत रहने देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। यीशु का कथन संक्षिप्त रखा गया है और यूनानी पाठ के ‘मनुष्य’ को ‘अधिकारी’ में नहीं बदला गया।
