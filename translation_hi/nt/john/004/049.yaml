  text: λέγει πρὸς αὐτὸν ὁ βασιλικός· Κύριε, κατάβηθι πρὶν ἀποθανεῖν τὸ παιδίον μου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/049.yaml
  text: The royal official said to him[a], “Lord, come down before my child dies.”
translation:
  language: hi
  text: राजकीय अधिकारी ने उससे कहा, “प्रभु[a], मेरे बच्चे के मरने से पहले नीचे चलिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी शब्द κύριε एक आदरसूचक संबोधन है, जिसका अर्थ “प्रभु” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ βασιλικός
  choice: राजकीय अधिकारी
  rationale: यह पद राजा या राजदरबार से जुड़े व्यक्ति को सूचित करता है। ‘राजकीय अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक रूप से कुलीन सामाजिक वर्ग का अर्थ नहीं जोड़ता।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριε सम्मानसूचक संबोधन है और ‘महोदय’ भी हो सकता है, पर यूहन्ना में ‘प्रभु’ की गहरी अर्थ-प्रतिध्वनि संभव है; इसलिए मुख्य पाठ में इसे रखा और वैकल्पिक अर्थ टिप्पणी में दिया गया है।
- source_word: κατάβηθι
  choice: नीचे चलिए
  rationale: आज्ञार्थक क्रिया स्थान की ऊँचाई से नीचे जाने का बोध बनाए रखती है। सम्मानसूचक ‘चलिए’ संबोधन और हिन्दी प्रयोग के अनुकूल है।
- source_word: πρὶν ἀποθανεῖν
  choice: मरने से पहले
  rationale: πρίν और infinitive पूर्वकालिक सीमा व्यक्त करते हैं; हिन्दी में यह संक्षिप्त और स्वाभाविक रूप है।
- source_word: τὸ παιδίον μου
  choice: मेरे बच्चे
  rationale: παιδίον का अर्थ बच्चा या छोटा बच्चा है। ‘बच्चे’ लिंग को अनावश्यक रूप से निश्चित किए बिना यूनानी शब्द का दायरा बनाए रखता है।
- source_word: λέγει πρὸς αὐτόν
  choice: ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-शैली में भूतकाल से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: तात्कालिक संदर्भ में यह केवल आदरसूचक संबोधन हो सकता है, पर यूहन्ना के वर्णन में ‘प्रभु’ की व्यापक अर्थ-परत भी संभव है। मुख्य पाठ उस तनाव को बनाए रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण संवाद के लिए ‘चलिए’ का प्रयोग। वाक्य को सहज रखा गया है, जबकि ‘नीचे’ मूल के स्थलाकृतिक संकेत को सुरक्षित रखता है।
