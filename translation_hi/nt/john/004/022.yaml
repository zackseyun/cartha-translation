id: JHN.4.22
reference: John 4:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμεῖς προσκυνεῖτε ὃ οὐκ οἴδατε, ἡμεῖς προσκυνοῦμεν ὃ οἴδαμεν, ὅτι ἡ σωτηρία ἐκ τῶν Ἰουδαίων ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/022.yaml
  text: You worship what you do not know; we worship what we know[a], because salvation is from the Jews.
translation:
  language: hi
  text: तुम जिसकी आराधना करते हो, उसे नहीं जानते; हम जिसकी आराधना करते हैं, उसे जानते हैं, क्योंकि उद्धार यहूदियों[a] में से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदी लोगों”; यूहन्ना में कुछ प्रसंगों में इस शब्द का अर्थ “यहूदिया के लोग” हो सकता है, पर यहाँ आराधना और उद्धार-इतिहास के विषय में सामरियों के साथ तुलना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκυνεῖτε / προσκυνοῦμεν
  choice: आराधना करते हो / आराधना करते हैं
  rationale: यहाँ क्रिया धार्मिक उपासना को व्यक्त करती है; ‘आराधना करना’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा केवल शारीरिक दण्डवत या सम्मान का अर्थ नहीं देता।
- source_word: ὃ
  choice: जिसकी ... उसे
  rationale: यूनानी में नपुंसकलिंग सम्बन्धवाचक सर्वनाम है। हिन्दी में शाब्दिक ‘जिस वस्तु की’ अस्वाभाविक होगा; ‘जिसकी ... उसे’ स्वाभाविक रहते हुए उपास्य की पहचान को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: οἴδατε / οἴδαμεν
  choice: नहीं जानते / जानते हैं
  rationale: ‘जानना’ यूनानी के सीधे ज्ञान-संबंधी विरोध को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: σωτηρία
  choice: उद्धार
  rationale: इस यूहन्नाई प्रसंग में यह परमेश्वर के बचाने वाले कार्य के लिए प्रचलित, उपयुक्त और व्यापक हिन्दी शब्द है।
- source_word: ἐκ
  choice: में से
  rationale: ἐκ स्रोत या उद्गम दर्शाता है। ‘में से’ इस बात को बनाए रखता है कि उद्धार का ऐतिहासिक उद्गम यहूदी लोगों के बीच से है, बिना ‘के द्वारा’ जैसी साधनवाचक व्याख्या जोड़े।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों
  rationale: यहाँ सामरियों के साथ आराधना और उद्धार-इतिहास का विरोध है, इसलिए आशय यहूदी लोगों से है; ‘यहूदिया-निवासी’ इस प्रसंग में अत्यधिक संकीर्ण होगा।
theological_decisions:
- issue: ‘उद्धार यहूदियों में से है’ का अर्थ
  choice: वाक्य को उद्धार के ऐतिहासिक उद्गम और यहूदी लोगों के माध्यम से उसके वाचा-संबंधी प्रकट होने के कथन के रूप में रखा गया है।
  alternative: इसे केवल मसीह के यहूदी मूल तक सीमित करना, या जातीय श्रेष्ठता का कथन मानना।
  rationale: मूल पाठ स्रोत को व्यक्त करता है, श्रेष्ठता को नहीं। संक्षिप्त अनुवाद मसीह के यहूदी मूल और यहूदी प्रकाशन की व्यापक भूमिका—दोनों सम्भावनाओं को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन में प्रसंगानुसार बहुवचन ‘तुम’; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। ‘जिसकी ... उसे’ हिन्दी की स्वाभाविक संरचना है, जबकि पद का तीखा विरोध और मूल की अर्थगत अनिर्धारितता बनी रहती है।
