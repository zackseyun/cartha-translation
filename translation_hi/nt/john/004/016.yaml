- source_word: καὶ
  choice: और
  rationale: दो आज्ञाओं को जोड़ने वाला साधारण समुच्चयबोधक।
- source_word: ἐλθὲ
  choice: आ
  rationale: यूनानी क्रिया का सीधा अर्थ ‘आ’ है; ‘वापस आ’ प्रसंग से समझा जा सकता है, पर मूल में ‘वापस’ स्पष्ट नहीं है।
- source_word: ἐνθάδε
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का स्वाभाविक हिन्दी समानार्थक।
