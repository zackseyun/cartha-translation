source:
  edition: SBLGNT
  text: Ὡς οὖν ἔγνω ὁ ⸀Ἰησοῦς ὅτι ἤκουσαν οἱ Φαρισαῖοι ὅτι Ἰησοῦς πλείονας μαθητὰς ποιεῖ καὶ βαπτίζει ἢ Ἰωάννης—
base_translation:
  language: en
  yaml_path: translation/nt/john/004/001.yaml
  text: Therefore[a], when Jesus knew that the Pharisees had heard that Jesus was making and baptizing more disciples than John—
translation:
  language: hi
  text: इसलिए, जब यीशु को पता चला कि फ़रीसियों ने सुन लिया था कि यीशु यूहन्ना से अधिक चेले बना रहा था और बपतिस्मा दे रहा था[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु यूहन्ना की अपेक्षा चेले बनाने और बपतिस्मा देने, दोनों में अधिक कार्य कर रहा था।” यूनानी में तुलना केवल ‘चेलों’ की संख्या पर नहीं, बल्कि इन दोनों संयुक्त कार्यों पर भी लागू हो सकती है।
    reason: तुलना के दायरे से जुड़ा शाब्दिक विकल्प
lexical_decisions:
- source_word: Ὡς οὖν
  choice: इसलिए जब
  rationale: Ὡς समयसूचक उपवाक्य आरम्भ करता है और οὖν निष्कर्ष अथवा कथानक की प्रगति दिखाता है; यह चयन दोनों कार्यों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔγνω
  choice: को पता चला
  rationale: यहाँ γινώσκω का एओरिस्ट रूप किसी बात से अवगत होने का भाव देता है; ‘को पता चला’ आधुनिक हिन्दी में स्वाभाविक है और केवल अमूर्त ज्ञान का अर्थ नहीं देता।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसियों
  rationale: समूह के नाम का मानक हिन्दी रूप; परसर्गयुक्त बहुवचन के अनुसार तिर्यक रूप प्रयुक्त है।
- source_word: ἤκουσαν
  choice: ने सुन लिया है
  rationale: यह रूप यीशु के अवगत होने से पहले फ़रीसियों तक समाचार पहुँच चुकने का क्रम स्पष्ट करता है।
- source_word: πλείονας μαθητὰς
  choice: अधिक चेले
  rationale: तुलनात्मक विशेषण और संज्ञा का सीधा, प्रचलित हिन्दी रूप।
- source_word: ποιεῖ
  choice: बना रहा है
  rationale: μαθητάς के साथ ποιέω का अर्थ ‘चेले बनाना’ है; यह यूनानी के निकट और हिन्दी में स्पष्ट है।
- source_word: βαπτίζει
  choice: बपतिस्मा दे रहा है
  rationale: नए नियम के हिन्दी प्रयोग में βαπτίζω का मानक और व्यापक रूप से समझा जाने वाला अनुवाद।
- source_word: ἢ Ἰωάννης
  choice: यूहन्ना से
  rationale: ἤ के तुलनात्मक प्रयोग को हिन्दी के स्वाभाविक ‘से’ द्वारा व्यक्त किया गया है।
theological_decisions:
- issue: क्या यीशु स्वयं बपतिस्मा दे रहा था
  choice: 'पद 4:1 की सतही शब्दावली को ज्यों का त्यों रखा गया है: ‘यीशु ... बपतिस्मा दे रहा है।’'
  alternative: अगले पद की सूचना पहले से जोड़कर कहना कि यीशु के चेले बपतिस्मा दे रहे थे।
  rationale: पद 4:2 स्वयं स्पष्ट करता है कि यीशु व्यक्तिगत रूप से बपतिस्मा नहीं देता था। इस पद में वह स्पष्टीकरण पहले से जोड़ना कथानक के तनाव को समय से पहले मिटा देता।
- issue: πλείονας की तुलना का दायरा
  choice: मुख्य पाठ में ऐसी स्वाभाविक रचना रखी गई है जिसमें ‘अधिक’ सीधे ‘चेले’ के साथ आता है।
  alternative: तुलना को चेला बनाने और बपतिस्मा देने की संयुक्त गतिविधि पर लागू समझना।
  rationale: यूनानी वाक्य-विन्यास तुलना के दायरे में कुछ अस्पष्टता रहने देता है; वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘चेले’ और ‘बपतिस्मा’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। अंत का दीर्घ डैश मूल वाक्य के अगले पद में जारी रहने को दर्शाता है।
