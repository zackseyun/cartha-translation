source:
  edition: SBLGNT
  text: αὐτὸς ⸀γὰρ Ἰησοῦς ἐμαρτύρησεν ὅτι προφήτης ἐν τῇ ἰδίᾳ πατρίδι τιμὴν οὐκ ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/044.yaml
  text: For Jesus himself testified that a prophet has no honor in his own homeland[a].
translation:
  language: hi
  text: क्योंकि यीशु ने स्वयं गवाही दी थी कि भविष्यद्वक्ता को अपने ही देश[a] में आदर नहीं मिलता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने ही मूल स्थान’ अथवा ‘अपने ही गृह-प्रदेश’। यूनानी शब्द πατρίς किसी व्यक्ति के देश, मूल स्थान या गृह-प्रदेश को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन से इस पद का व्याख्यात्मक संबंध दिखाता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτὸς ... Ἰησοῦς
  choice: यीशु ने स्वयं
  rationale: αὐτός के बलाघात को ‘स्वयं’ से सुरक्षित रखा गया है और हिन्दी वाक्य-विन्यास स्वाभाविक है।
- source_word: ἐμαρτύρησεν
  choice: गवाही दी थी
  rationale: यह यूहन्ना में महत्त्वपूर्ण साक्ष्य-सम्बन्धी भाषा को बनाए रखता है; पूर्वकालिक ‘थी’ प्रसंग में इस पहले दिए गए कथन को सहज रूप से दर्शाता है।
- source_word: ὅτι
  choice: कि
  rationale: यह यीशु की गवाही की विषय-वस्तु का परिचय देता है।
- source_word: προφήτης
  choice: भविष्यद्वक्ता
  rationale: अनिश्चित, कहावत-सदृश अर्थ हिन्दी में बिना किसी निर्धारक के स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐν τῇ ἰδίᾳ πατρίδι
  choice: अपने ही देश में
  rationale: ‘अपने ही’ ἰδίᾳ के बल को व्यक्त करता है; ‘देश’ πατρίς के व्यापक अर्थ को सरल आधुनिक हिन्दी में रखता है, जबकि पादटिप्पणी अन्य सम्भव अर्थ बताती है।
- source_word: τιμὴν οὐκ ἔχει
  choice: आदर नहीं मिलता
  rationale: शाब्दिक ‘आदर नहीं रखता’ हिन्दी में अस्वाभाविक है; ‘आदर नहीं मिलता’ मूल भाव और τιμή के संज्ञात्मक अर्थ को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना के कथानक में ‘अपने ही देश’ का संकेत और दायरा
  choice: कहावत का सीधा अनुवाद किया गया है और भौगोलिक संकेत को अनिर्णीत रखा गया है।
  alternative: इसे विशेष रूप से यहूदिया, गलील या नासरत मानना।
  rationale: पद स्वयं उस स्थान की स्पष्ट पहचान नहीं करता; इसलिए अनुवाद व्याख्यात्मक तनाव बनाए रखता है और किसी एक सामंजस्यकारी निष्कर्ष को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘गवाही’ से यूहन्ना की साक्ष्य-भाषा तथा ‘भविष्यद्वक्ता’ से पारंपरिक बाइबलीय पदावली सुरक्षित रखी गई है।
