  yaml_path: translation/nt/john/004/043.yaml
  text: After the two days[a], he departed from there for Galilee.
translation:
  language: hi
  text: उन दो दिनों के बाद वह वहाँ से निकलकर गलील चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ τὰς δύο ἡμέρας
  choice: उन दो दिनों के बाद
  rationale: μετά के साथ कर्मकारक समयगत क्रम, अर्थात् ‘के बाद,’ व्यक्त करता है। निश्चित उपपद τὰς पिछले पदों में बताए गए दो दिनों की ओर संकेत करता है। δέ हल्का कथात्मक संयोजक है, जिसे स्वाभाविक हिन्दी में अलग शब्द दिए बिना व्यक्त किया गया है।
- source_word: ἐξῆλθεν
  choice: निकलकर … चला गया
  rationale: ἐξέρχομαι यहाँ पहले स्थान से प्रस्थान करने की यात्रा-संबंधी क्रिया है। संयुक्त हिन्दी अभिव्यक्ति प्रस्थान और आगे की गति—दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: स्थानवाचक क्रियाविशेषण पहले बताए गए स्थान से प्रस्थान को सूचित करता है; ‘वहाँ से’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील चला गया
  rationale: εἰς गंतव्य की ओर गति बताता है। हिन्दी में ‘गलील चला गया’ बिना अनावश्यक परसर्ग के गंतव्य को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
