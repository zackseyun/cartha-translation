  text: Ἔρχεται γυνὴ ἐκ τῆς Σαμαρείας ἀντλῆσαι ὕδωρ. λέγει αὐτῇ ὁ Ἰησοῦς· Δός μοι πεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/007.yaml
  text: A woman from Samaria came to draw water. Jesus said to her[a], “Give me a drink.”
translation:
  language: hi
  text: सामरिया से एक स्त्री पानी भरने आई। यीशु ने उससे कहा[a], “मुझे पीने के लिए पानी दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “आती है … कहते हैं”; यूनानी कथा-वर्णन में यहाँ ऐतिहासिक वर्तमान काल का प्रयोग हुआ है।
    reason: यूनानी की कथात्मक वर्तमान क्रियाओं ἔρχεται और λέγει के अधिक शाब्दिक विकल्प को दर्ज करना।
lexical_decisions:
- source_word: Ἔρχεται
  choice: आई
  rationale: यूनानी वर्तमान रूप यहाँ कथा में ऐतिहासिक वर्तमान है; हिन्दी में भूतकाल ‘आई’ घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: संदर्भ में यह किसी अज्ञात स्त्री को सूचित करता है, पत्नी को नहीं।
- source_word: ἐκ τῆς Σαμαρείας
  choice: सामरिया से
  rationale: ἐκ स्थान या उद्गम को व्यक्त करता है। यह अनुवाद मूल वाक्य की संरचना बचाता है और इसी पद में सीधे ‘सामरी स्त्री’ नहीं जोड़ता।
- source_word: ἀντλῆσαι ὕδωρ
  choice: पानी भरने
  rationale: उद्देश्यसूचक अनंत क्रिया का स्वाभाविक हिन्दी रूप; कुएँ जैसे स्रोत से पानी निकालने या लेने के सामान्य भाव को व्यक्त करता है।
- source_word: λέγει αὐτῇ
  choice: उससे कहा
  rationale: λέγει भी कथात्मक ऐतिहासिक वर्तमान है; हिन्दी में भूतकाल कथा-प्रवाह के लिए स्वाभाविक है।
- source_word: Δός μοι πεῖν
  choice: मुझे पीने के लिए पानी दे
  rationale: आज्ञार्थक क्रिया और अनंत क्रिया मिलकर पीने के लिए कुछ देने का सीधा अनुरोध व्यक्त करती हैं। हिन्दी में यह स्पष्ट और स्वाभाविक है तथा संदर्भ से निहित ‘पानी’ को सामने रखता है।
theological_decisions:
- issue: ‘सामरिया’ का संदर्भ
  choice: ‘सामरिया से’ कहकर स्त्री के आने के स्थान या क्षेत्र को व्यक्त किया गया है।
  alternative: ‘एक सामरी स्त्री’ या ‘सामरिया नगर से’
  rationale: यूनानी पाठ इस पद में उसे विशेषण के रूप में सीधे ‘सामरी’ नहीं कहता और न ही निश्चित रूप से ‘सामरिया नगर’ कहता है। इसलिए अनुवाद मूल की भौगोलिक अभिव्यक्ति और उसकी सीमा को बनाए रखता है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘पानी भरने’ सामान्य बोलचाल में सहज है। यीशु के लिए मुख्य पाठ में आदरसूचक हिन्दी प्रयोग के अनुरूप ‘कहा’ रखा गया है।
