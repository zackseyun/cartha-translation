- source_word: τροφὰς
  choice: भोजन
  rationale: बहुवचन τροφάς यहाँ खाने की वस्तुओं या रसद के सामूहिक अर्थ में है; ‘भोजन’ सामान्य और सहज हिन्दी समतुल्य है।
- source_word: ἀγοράσωσιν
  choice: खरीदने
  rationale: ἵνα के साथ यह इच्छित उद्देश्य की क्रिया है; ‘खरीदने के लिए’ उसका सीधा और सामान्य हिन्दी रूप है।
