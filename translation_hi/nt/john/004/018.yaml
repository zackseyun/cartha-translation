base_translation:
  language: en
  yaml_path: translation/nt/john/004/018.yaml
  text: For you have had five husbands[a], and the man you now have is not your husband; this you have said truly.
translation:
  language: hi
  text: क्योंकि तुम्हारे पाँच पति रहे हैं[a], और जिसके साथ तुम अब हो, वह तुम्हारा पति नहीं है; तुमने यह सच कहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तुम्हारे पाँच पुरुष रहे हैं, और जिस पुरुष के साथ तुम अब हो, वह तुम्हारा पुरुष/पति नहीं है।” यूनानी शब्द ἀνήρ का अर्थ “पुरुष” या “पति” हो सकता है; यहाँ संदर्भ “पति” के अर्थ का समर्थन करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πέντε γὰρ ἄνδρας ἔσχες
  choice: क्योंकि तुम्हारे पाँच पति हो चुके हैं
  rationale: γάρ का व्याख्यात्मक कारण-संबंध ‘क्योंकि’ से व्यक्त होता है। संदर्भ में ἄνδρας का अर्थ ‘पति’ है, और ἔσχες स्त्री के पिछले वैवाहिक इतिहास को बताता है; ‘हो चुके हैं’ उस अतीत और उसकी वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ νῦν ὃν ἔχεις
  choice: और जिसके साथ तुम अब हो
  rationale: शाब्दिक ‘जिसे तुम रखती हो’ आधुनिक हिन्दी में स्वामित्व या रखैलपन का अनावश्यक संकेत दे सकता है। यहाँ ἔχω संबंध/संगति को सूचित करता है, इसलिए ‘जिसके साथ तुम अब हो’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: οὐκ ἔστιν σου ἀνήρ
  choice: वह तुम्हारा पति नहीं है
  rationale: σου के साथ ἀνήρ यहाँ वैवाहिक संबंध व्यक्त करता है। ‘तुम्हारा पति नहीं है’ पिछले ‘पति’ से स्पष्ट विरोध बनाए रखता है।
- source_word: τοῦτο ἀληθὲς εἴρηκας
  choice: यह तुमने सच कहा है
  rationale: यह रूप demonstrative τοῦτο, perfect εἴρηκας और adverbial अर्थ वाले ἀληθές को निकटता से सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: दोनों स्थानों पर ἀνήρ का अर्थ
  choice: पहले ‘पति’ और दूसरे में भी ‘पति’
  alternative: ‘पुरुष/आदमी’ अथवा अधिक शाब्दिक ‘पाँच पुरुष’ और ‘तुम्हारा पुरुष’
  rationale: वार्तालाप का निकट संदर्भ स्त्री के वैवाहिक इतिहास और उसके वर्तमान गैर-वैवाहिक संबंध को सामने रखता है। फिर भी यूनानी शब्द की मूल द्विअर्थकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज है। ‘जिसके साथ तुम अब हो’ संबंध का आशय स्पष्ट करता है और हिन्दी में ‘जिसे तुम रखती हो’ से पैदा होने वाले अवांछित अर्थ से बचता है। अर्धविराम यूनानी वाक्य के प्रवाह और अंतिम पुष्टि को बनाए रखता है।
