base_translation:
  language: en
  yaml_path: translation/nt/john/004/032.yaml
  text: But he said to them[a], “I have food to eat that you do not know.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “मेरे पास खाने के लिए ऐसा भोजन है जिसे तुम नहीं जानते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह कथा में हल्का विरोध और आगे का विकास दिखाता है; शिष्यों की बात के उत्तर में आधुनिक हिन्दी का ‘पर’ स्वाभाविक है।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: λέγω और अप्रत्यक्ष कर्म का सीधा, स्वाभाविक तथा कथात्मक हिन्दी रूप।
- source_word: Ἐγὼ
  choice: मेरे पास
  rationale: यूनानी में स्पष्ट सर्वनाम कर्ता पर बल देता है; हिन्दी के स्वाभाविक अधिकारवाची वाक्य-विन्यास में ‘मेरे पास’ उस वैषम्य को पर्याप्त रूप से व्यक्त करता है।
- source_word: βρῶσιν
  choice: भोजन
  rationale: यहाँ शब्द खाने की क्रिया नहीं, खाने की वस्तु को सूचित करता है; ‘भोजन’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: ἔχω φαγεῖν
  choice: मेरे पास खाने के लिए ... है
  rationale: यह संरचना खाने के लिए भोजन उपलब्ध होने या उसके अधिकार में होने का भाव देती है; हिन्दी में यह रूप अर्थ और स्वाभाविकता दोनों रखता है।
- source_word: ἣν
  choice: जिसके बारे में
  rationale: सम्बन्धवाचक सर्वनाम का पूर्वपद ‘भोजन’ है; हिन्दी में ‘जिसके बारे में ... नहीं जानते’ इस अर्थ को स्वाभाविक ढंग से जोड़ता है।
- source_word: ὑμεῖς οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: स्पष्ट ὑμεῖς यीशु और शिष्यों के बीच वैषम्य रखता है; ‘तुम’ सामान्य बहुवचन सम्बोधन है और ‘नहीं जानते’ οὐκ οἴδατε का सीधा अर्थ देता है।
theological_decisions:
- issue: यीशु के ‘भोजन’ का रूपकात्मक अर्थ
  choice: मुख्य पाठ में ‘भोजन’ को बनाए रखना और रूपक को यहीं न खोलना
  alternative: ‘मेरे पास ऐसी आत्मिक तृप्ति है...’ जैसे व्याख्यात्मक रूप में अर्थ स्पष्ट करना
  rationale: अगला प्रसंग इस भोजन को पिता की इच्छा पूरी करने से जोड़ता है, पर इस पद में शिष्यों की गलतफहमी जानबूझकर बनी रहती है। व्याख्या जोड़ने से कथात्मक तनाव समय से पहले मिट जाएगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘खाना’ की अपेक्षा संज्ञा के रूप में ‘भोजन’ रूपक और मूल शब्द βρῶσις को अधिक स्पष्ट रखता है, जबकि ‘खाने के लिए’ वाक्य को सहज बनाता है।
