base_translation:
  language: en
  yaml_path: translation/nt/john/004/005.yaml
  text: So he came to a town of Samaria called Sychar[b][a], near the piece of land that Jacob had given to Joseph his son.
translation:
  language: hi
  text: तब वह सामरिया के सूखार नामक एक नगर[a] में आया, जो उस भूमि[b] के पास था जिसे याकूब ने अपने पुत्र यूसुफ को दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कस्बा।” यूनानी शब्द πόλις प्रसंग के अनुसार नगर या कस्बा, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “खेत” अथवा “भूमि का टुकड़ा।” यूनानी शब्द χωρίον खेत, संपत्ति या भूमि के किसी हिस्से को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται
  choice: आया
  rationale: वर्णन में यह ऐतिहासिक वर्तमान है; आधुनिक हिन्दी में सामान्य भूतकाल घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष और आगे बढ़ते घटनाक्रम, दोनों का संबंध दिखाता है।
- source_word: πόλιν
  choice: नगर
  rationale: πόλις नगर या कस्बे को सूचित कर सकता है; ‘नगर’ गरिमापूर्ण और सामान्य हिन्दी है, जबकि विकल्प को पादटिप्पणी में रखा गया है।
- source_word: τῆς Σαμαρείας
  choice: सामरिया के
  rationale: सम्बन्धकारक पद उस नगर को सामरिया क्षेत्र से जोड़ता है; हिन्दी में ‘सामरिया के ... नगर’ स्वाभाविक है।
- source_word: λεγομένην Συχὰρ
  choice: सूखार नामक
  rationale: यह नगर के नाम की पहचान कराने वाले यूनानी कृदन्त का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: πλησίον
  choice: के पास
  rationale: स्थानिक निकटता को सरल और स्पष्ट रूप में व्यक्त करता है।
- source_word: χωρίου
  choice: भूमि
  rationale: χωρίον भूमि के किसी हिस्से, खेत या संपत्ति को सूचित कर सकता है; ‘भूमि’ अर्थ को अनावश्यक रूप से केवल खेती के खेत तक सीमित नहीं करती।
- source_word: ὃ ἔδωκεν Ἰακὼβ
  choice: जिसे याकूब ने ... दिया था
  rationale: मुख्य आगमन से पहले की पृष्ठभूमि घटना होने के कारण हिन्दी का पूर्ण भूतकाल उपयुक्त है।
- source_word: τῷ Ἰωσὴφ τῷ υἱῷ αὐτοῦ
  choice: अपने पुत्र यूसुफ को
  rationale: यह प्राप्तकर्ता और उसके याकूब से पुत्र-संबंध, दोनों को सहज आधुनिक हिन्दी में स्पष्ट रखता है।
