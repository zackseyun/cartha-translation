source:
  edition: SBLGNT
  text: λέγει οὖν αὐτῷ ἡ γυνὴ ἡ Σαμαρῖτις· Πῶς σὺ Ἰουδαῖος ὢν παρ’ ἐμοῦ πεῖν αἰτεῖς ⸂γυναικὸς Σαμαρίτιδος οὔσης⸃; οὐ γὰρ συγχρῶνται Ἰουδαῖοι Σαμαρίταις.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/009.yaml
  text: So the Samaritan woman said to him[a], “How is it that you, being a Jew, ask for a drink from me, a Samaritan woman?” (For Jews do not associate with Samaritans.)
translation:
  language: hi
  text: तब उस सामरी स्त्री ने उससे कहा, “तुम यहूदी होकर मुझसे पीने के लिए कैसे माँगते हो, जबकि मैं सामरी स्त्री हूँ?” (क्योंकि यहूदी सामरियों से मेल-जोल नहीं रखते।)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यहूदी सामरियों से कोई व्यवहार नहीं रखते।” इसका अधिक विशिष्ट अर्थ यह भी हो सकता है कि वे पीने के बरतनों जैसी वस्तुओं का साझा उपयोग नहीं करते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει οὖν
  choice: तब ... ने कहा
  rationale: οὖν यहाँ कथा को आगे बढ़ाता है और पिछले प्रसंग से प्रतिक्रिया जोड़ता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से यह संबंध व्यक्त करता है।
- source_word: ἡ γυνὴ ἡ Σαμαρῖτις
  choice: उस सामरी स्त्री
  rationale: दोहराया हुआ लेख एक विशिष्ट, पहले से उल्लिखित स्त्री की ओर संकेत करता है; ‘उस सामरी स्त्री’ हिन्दी में सहज और स्पष्ट है।
- source_word: Πῶς
  choice: कैसे
  rationale: यह सामाजिक रीति के उल्लंघन पर आश्चर्य और अविश्वास व्यक्त करता है; प्रश्न की स्वाभाविक हिन्दी संरचना इस भाव को बनाए रखती है।
- source_word: Ἰουδαῖος
  choice: यहूदी
  rationale: यहाँ सामरियों के विपरीत एक जातीय-धार्मिक समुदाय की पहचान अभिप्रेत है, केवल यहूदिया प्रदेश का निवासी नहीं।
- source_word: ὢν
  choice: होकर
  rationale: कृदंत वक्ता के आश्चर्य की पृष्ठभूमि देता है; ‘होकर’ कारण या विरोध के संबंध को आवश्यकता से अधिक निश्चित किए बिना ग्रीक संरचना का भाव रखता है।
- source_word: παρ’ ἐμοῦ πεῖν αἰτεῖς
  choice: मुझ ... से पीने के लिए पानी ... माँगते हो
  rationale: αἰτεῖς के साथ πεῖν पीने की माँग व्यक्त करता है। प्रसंग में कुएँ से पानी माँगा जा रहा है, इसलिए ‘पानी’ हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: γυναικὸς Σαμαρίτιδος οὔσης
  choice: मुझ सामरी स्त्री से
  rationale: संबंधवाचक स्वतंत्र रचना उसकी स्त्री और सामरी होने की पहचान को आश्चर्य के आधार के रूप में प्रस्तुत करती है; हिन्दी में इसे ‘मुझ’ के साथ विशेषणवत् रखना सहज है।
- source_word: συγχρῶνται
  choice: मेल-जोल नहीं रखते
  rationale: क्रिया सामान्य सामाजिक व्यवहार या लेन-देन को सूचित कर सकती है। ‘मेल-जोल नहीं रखते’ व्यापक सामाजिक दूरी को स्पष्ट करता है, जबकि वस्तुएँ साझा न करने का अधिक विशिष्ट अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: यूहन्ना में Ἰουδαῖος का अर्थ
  choice: यहूदी
  alternative: यहूदिया का निवासी
  rationale: इस पद में यहूदियों और सामरियों का विरोध सामाजिक-धार्मिक समुदायों के रूप में है, मात्र दो क्षेत्रों के निवासियों के रूप में नहीं।
- issue: συγχρῶνται का अर्थ-क्षेत्र
  choice: सामान्य सामाजिक मेल-जोल न रखना
  alternative: साझे में वस्तुओं, विशेषकर पीने के बरतनों, का उपयोग न करना अथवा कोई व्यवहार न रखना
  rationale: व्याख्यात्मक वाक्य व्यापक सामुदायिक दूरी बता सकता है, पर तत्काल प्रसंग में पानी और पात्र के कारण साझा उपयोग का संकरा अर्थ भी संभव है; उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘सामरी’ तथा ‘यहूदी’ प्रचलित बाइबलीय सामुदायिक नामों के रूप में रखे गए हैं। पाद-टिप्पणी-चिह्न व्याख्यात्मक कोष्ठक के बाद दिया गया है और συγχρῶνται की वास्तविक अर्थगत व्यापकता सुरक्षित रखी गई है।
