language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν ὁ Ἰησοῦς πρὸς αὐτόν· Ἐὰν μὴ σημεῖα καὶ τέρατα ἴδητε, οὐ μὴ πιστεύσητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/048.yaml
  text: So Jesus said to him[a], “Unless you see signs and wonders, you will certainly not believe.”
translation:
  language: hi
  text: इसलिए यीशु ने उससे कहा[a], “जब तक तुम लोग चिह्न और अद्भुत घटनाएँ न देखो, तब तक तुम हरगिज़ विश्वास नहीं करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देखो’ और ‘विश्वास नहीं करोगे’ के लिए यूनानी क्रियाएँ बहुवचन हैं। इसलिए यीशु का कथन संभवतः केवल उस अधिकारी तक सीमित न होकर एक व्यापक समूह को भी संबोधित करता है।
    reason: यूनानी बहुवचन क्रियाओं और संबोधन के संभावित व्यापक दायरे को स्पष्ट करता है।
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथन का तार्किक और कथात्मक संबंध दिखाता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πρὸς αὐτόν
  choice: उससे
  rationale: वचन की भूमिका में एक पुरुष से सीधे कहने का स्वाभाविक हिन्दी रूप।
- source_word: Ἐὰν μὴ
  choice: जब तक ... न ... तब तक
  rationale: यूनानी नकारात्मक शर्त को सहज और स्पष्ट हिन्दी संरचना में व्यक्त करता है।
- source_word: σημεῖα
  choice: चिह्न
  rationale: यूहन्ना में यह शब्द ऐसे असाधारण कार्यों के लिए आता है जो अपने से परे किसी अर्थ या पहचान की ओर संकेत करते हैं; इसलिए केवल ‘चमत्कार’ कहना इसकी अर्थ-छाया घटा सकता है।
- source_word: τέρατα
  choice: अद्भुत काम
  rationale: असाधारण और विस्मय उत्पन्न करने वाली घटनाओं का साधारण आधुनिक हिन्दी में बोध कराता है तथा ‘चिह्न’ से भिन्नता बनाए रखता है।
- source_word: ἴδητε
  choice: तुम लोग ... देखो
  rationale: क्रिया द्वितीय पुरुष बहुवचन है; ‘तुम लोग’ उसके वचन को हिन्दी में स्पष्ट रूप से सुरक्षित रखता है।
- source_word: οὐ μὴ πιστεύσητε
  choice: तुम हरगिज़ विश्वास नहीं करोगे
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘हरगिज़ नहीं’ व्यक्त करता है, जबकि भविष्य-सदृश परिणाम भी बना रहता है।
- source_word: πιστεύσητε
  choice: विश्वास करोगे
  rationale: यूहन्ना में πιστεύω के सामान्य और धर्मवैचारिक रूप से कम आरोपित हिन्दी समतुल्य के रूप में ‘विश्वास करना’ उपयुक्त है।
theological_decisions:
- issue: सम्बोधन की संख्या और कथन का दायरा
  choice: भूमिका में एक व्यक्ति के लिए ‘उससे’, पर यीशु के कथन में बहुवचन ‘तुम लोग’
  alternative: पूरे कथन को केवल अधिकारी से एकवचन में कहना, या बहुवचन को अस्पष्ट ‘तुम’ से व्यक्त करना
  rationale: πρὸς αὐτόν एक व्यक्ति को लक्षित करता है, जबकि ἴδητε और πιστεύσητε दोनों बहुवचन हैं। हिन्दी में संख्या स्पष्ट करनी पड़ती है; ‘तुम लोग’ मूल के व्यापक दायरे को बिना किसी विशेष समूह की पहचान जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, स्पष्ट और गरिमापूर्ण। ‘तुम लोग’ बहुवचन को खुलकर व्यक्त करता है; ‘आप लोग’ की सम्मानसूचकता मूल यूनानी में नहीं है। ‘चिह्न और अद्भुत काम’ यूहन्नाई पदावली के अर्थगत भेद को सुलभ हिन्दी में बनाए रखता है।
