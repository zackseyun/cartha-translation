  text: Ἐκ δὲ τῆς πόλεως ἐκείνης πολλοὶ ἐπίστευσαν εἰς αὐτὸν τῶν Σαμαριτῶν διὰ τὸν λόγον τῆς γυναικὸς μαρτυρούσης ὅτι Εἶπέν μοι πάντα ⸀ἃ ἐποίησα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/039.yaml
  text: And many of the Samaritans from that town believed in him because of the word of the woman who was testifying, “He told me everything I did.”
translation:
  language: hi
  text: और उस नगर के बहुत-से सामरियों ने उस पर विश्वास किया, क्योंकि उस स्त्री ने गवाही देते हुए कहा था[a], “उसने मुझे वह सब बताया जो मैंने किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस स्त्री की बात के कारण।” यूनानी शब्द λόγος का अर्थ “बात,” “संदेश,” या “वृत्तांत” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκ δὲ τῆς πόλεως ἐκείνης
  choice: और उस नगर के
  rationale: ἐκ स्रोत या संबंध को दर्शाता है; हिन्दी में “उस नगर के” स्वाभाविक रूप से वहाँ के निवासियों का बोध कराता है। δέ को हल्के संयोजक “और” से व्यक्त किया गया है।
- source_word: πολλοὶ ... τῶν Σαμαριτῶν
  choice: बहुत-से सामरियों
  rationale: यह अंश सामरियों में से बहुतों का बोध कराता है; “बहुत-से सामरियों” आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ἐπίστευσαν εἰς αὐτόν
  choice: उस पर विश्वास किया
  rationale: πιστεύω εἰς व्यक्ति की ओर निर्देशित विश्वास को व्यक्त करता है। “उस पर विश्वास किया” इस संबंधपरक अर्थ को बिना अतिरिक्त धर्मवैज्ञानिक विस्तार के बनाए रखता है।
- source_word: διὰ τὸν λόγον τῆς γυναικός
  choice: क्योंकि उस स्त्री ने यह गवाही दी थी
  rationale: διά कारण बताता है और λόγος यहाँ स्त्री के कथन या संदेश को सूचित करता है। अगले participle μαρτυρούσης के साथ मिलाकर यह हिन्दी में स्वाभाविक वाक्य बनता है; λόγος की lexical व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: μαρτυρούσης
  choice: गवाही दी थी
  rationale: वर्तमान participle स्त्री के साक्ष्य देने को चित्रित करता है। प्रसंगगत पूर्वकाल के कारण हिन्दी में “गवाही दी थी” सहज है, यद्यपि इससे यूनानी की जारी क्रिया का पहलू कुछ सामान्यीकृत होता है।
- source_word: Εἶπέν μοι
  choice: उसने मुझे ... बता दिया
  rationale: λέγω + अप्रत्यक्ष कर्म का प्रसंगानुकूल हिन्दी रूप “मुझे बता दिया” है; इससे सूचना के संप्रेषण का अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: πάντα ἃ ἐποίησα
  choice: वह सब ... जो मैंने किया है
  rationale: πάντα ἃ की व्यापकता “वह सब ... जो” से बनी रहती है। हिन्दी का पूर्ण पक्ष “किया है” स्त्री के अब तक के जीवन के कामों और वर्तमान कथन के बीच स्वाभाविक संबंध व्यक्त करता है, बिना यह मानने के कि यीशु ने उसके जीवन की हर छोटी घटना शब्दशः गिनाई।
theological_decisions:
- issue: यूहन्ना में πιστεύω εἰς का स्वरूप
  choice: उस पर विश्वास किया
  alternative: उसमें विश्वास किया / उस पर भरोसा रखा
  rationale: पाठ यीशु की ओर निर्देशित वास्तविक विश्वास बताता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक श्रेणी को स्पष्ट नहीं करता। चुना हुआ रूप संबंधपरक बल को बनाए रखता है और अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- issue: स्त्री के कथन πάντα ἃ ἐποίησα की व्यापकता
  choice: वह सब बता दिया जो मैंने किया है
  alternative: मेरे सारे काम बता दिए
  rationale: मूल कथन की जोरदार व्यापकता को सुरक्षित रखा गया है। इसे अतिशयोक्ति मानकर हल्का नहीं किया गया और न ही ऐसा व्याख्यात्मक जोड़ किया गया कि यीशु ने उसके जीवन की प्रत्येक घटना का विवरण दिया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। “सामरियों” सामान्य पाठक के लिए परिचित सामुदायिक नाम है। मुख्य पाठ में λόγος और μαρτυρούσης को एक स्वाभाविक कारणवाचक उपवाक्य में संयोजित किया गया है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
