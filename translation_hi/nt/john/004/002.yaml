  yaml_path: translation/nt/john/004/002.yaml
  text: although Jesus himself was not baptizing[a], but his disciples were—
translation:
  language: hi
  text: हालाँकि यीशु स्वयं बपतिस्मा नहीं दे रहे थे, बल्कि उनके चेले दे रहे थे—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίτοιγε
  choice: हालाँकि
  rationale: यह पिछले कथन के संबंध में रियायती स्पष्टीकरण प्रस्तुत करता है; ‘हालाँकि’ आधुनिक हिन्दी में इसके भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰησοῦς αὐτὸς
  choice: यीशु स्वयं
  rationale: ‘स्वयं’ αὐτός के बलाघात को बनाए रखता है और स्पष्ट करता है कि यीशु व्यक्तिगत रूप से यह कार्य नहीं कर रहे थे।
- source_word: οὐκ ἐβάπτιζεν
  choice: बपतिस्मा नहीं दे रहे थे
  rationale: अपूर्ण भूतकाल चल रही या प्रचलित क्रिया का संकेत दे सकता है; यह हिन्दी रूप उस पक्ष को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह यीशु और उनके चेलों के बीच कर्ता का स्पष्ट सुधारात्मक विरोध दिखाता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उनके चेले दे रहे थे
  rationale: यूनानी में क्रिया दूसरी बार लुप्त है; हिन्दी में ‘दे रहे थे’ जोड़ने से आशय स्पष्ट और स्वाभाविक रहता है।
theological_decisions:
- issue: यीशु की सेवा में बपतिस्मा कौन दे रहा था
  choice: यीशु स्वयं व्यक्तिगत रूप से बपतिस्मा नहीं दे रहे थे; उनके चेले दे रहे थे।
  alternative: ‘यीशु ने बपतिस्मा नहीं दिया, बल्कि उनके चेलों ने दिया।’
  rationale: मुख्य पाठ में यूनानी अपूर्ण भूतकाल की संभावित निरंतर या प्रचलित क्रिया को रखा गया है और इससे आगे कोई धार्मिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। पद पिछले और अगले वाक्य से जुड़ा हुआ कोष्ठकीय स्पष्टीकरण है, इसलिए अंत में दीर्घ डैश रखा गया है।
