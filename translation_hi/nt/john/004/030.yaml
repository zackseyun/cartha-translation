lexical_decisions:
- source_word: ἐξῆλθον
  choice: निकलकर
  rationale: अओरिस्ट क्रिया नगर के भीतर से बाहर निकलने की पूर्ण घटना बताती है; संयुक्त क्रिया में ‘निकलकर’ अगली जारी क्रिया से इसका स्वाभाविक संबंध बनाए रखता है।
- source_word: ἐκ τῆς πόλεως
  choice: नगर से
  rationale: ἐκ भीतर से बाहर की गति व्यक्त करता है, जिसे हिन्दी में अपादान ‘से’ स्वाभाविक रूप से प्रकट करता है। πόλις के लिए ‘नगर’ मानक, व्यापक और गरिमापूर्ण शब्द है।
- source_word: ἤρχοντο
  choice: आ रहे थे
  rationale: इम्परफेक्ट रूप भूतकाल में जारी गति को व्यक्त करता है; ‘आ रहे थे’ इस अपूर्णतापरक पक्ष को बनाए रखता है।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: πρός और कर्मकारक किसी व्यक्ति की ओर गति दिखाते हैं; ‘उसके पास’ हिन्दी में गंतव्य और निकट आने, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
