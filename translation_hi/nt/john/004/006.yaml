  yaml_path: translation/nt/john/004/006.yaml
  text: Jacob’s well was there[a]. So Jesus, wearied from the journey, was sitting there by the well[c][b]. It was about the sixth hour.
translation:
  language: hi
  text: वहाँ याकूब का कुआँ[a] था। तब यीशु, यात्रा से थके हुए, कुएँ के पास वैसे ही[b] बैठे थे। लगभग छठा घंटा[c] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सोता’; यूनानी शब्द πηγή सोते या कुएँ, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यों’; सम्भवतः भाव है, ‘जिस दशा में थे, उसी दशा में’ अथवा ‘इस प्रकार’।
    reason: lexical_alternative
  - marker: c
    text: यदि यहूदी दिन के घंटों की गणना मानी जाए, तो यह लगभग दोपहर का समय था। एक अन्य मत इसे रोमी गणना के अनुसार लगभग शाम छह बजे मानता है।
    reason: interpretive_alternative
lexical_decisions:
- source_word: πηγή
  choice: कुआँ
  rationale: इस शब्द का अर्थ ‘सोता’ भी हो सकता है, पर पानी भरने के इस स्थान और आगे के प्रसंग में ‘कुआँ’ सबसे स्वाभाविक है। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: κεκοπιακὼς
  choice: थके हुए
  rationale: पूर्ण कृदंत यात्रा के परिश्रम से उत्पन्न और उस समय बनी हुई थकान की दशा व्यक्त करता है; ‘थके हुए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐκ τῆς ὁδοιπορίας
  choice: यात्रा से
  rationale: ἐκ यहाँ थकान के कारण या स्रोत को व्यक्त करता है; संक्षिप्त हिन्दी वाक्यांश यही संबंध बनाए रखता है।
- source_word: ἐκαθέζετο
  choice: बैठे थे
  rationale: अपूर्ण भूतकाल उस समय जारी वर्णनात्मक स्थिति को दर्शाता है; ‘बैठे थे’ इसे ‘बैठ गए’ की अपेक्षा अधिक स्पष्टता से रखता है।
- source_word: οὕτως
  choice: वैसे ही
  rationale: यह कठिन क्रियाविशेषण बैठने की रीति अथवा यीशु की तत्कालीन दशा की ओर संकेत कर सकता है। ‘वैसे ही’ अस्पष्टता को पूरी तरह सुलझाए बिना उसका संकेत बनाए रखता है।
- source_word: ἐπὶ τῇ πηγῇ
  choice: कुएँ के पास
  rationale: ἐπί के साथ संप्रदान कारक यहाँ स्थान-संबंधी है; ‘के पास’ किसी व्यक्ति के कुएँ के निकट बैठे होने की स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: ὥρα ἦν ὡς ἕκτη
  choice: लगभग छठा घंटा था
  rationale: ‘छठा घंटा’ मूल समय-अभिव्यक्ति को बनाए रखता है और ὡς का अनुमानसूचक भाव ‘लगभग’ से व्यक्त होता है; आधुनिक घड़ी का निश्चित समय मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: δὲ / οὖν
  choice: वहाँ … था / इसलिए
  rationale: δὲ का हल्का कथात्मक संक्रमण हिन्दी में अलग संयोजक जोड़े बिना स्वाभाविक रूप से व्यक्त है; οὖν को प्रसंगगत परिणति दिखाने के लिए ‘इसलिए’ कहा गया है।
theological_decisions:
- issue: ‘छठे घंटे’ का आधुनिक समय
  choice: मुख्य पाठ में ‘लगभग छठा घंटा’ बनाए रखा गया है।
  alternative: यहूदी दिन-गणना के अनुसार लगभग दोपहर; रोमी समय-गणना की परिकल्पना के अनुसार लगभग शाम छह बजे।
  rationale: यूनानी पाठ आधुनिक घड़ी का समतुल्य या अपनाई गई गणना-पद्धति स्पष्ट नहीं करता। शाब्दिक समय-सूचना बनाए रखने से यूहन्ना की कालक्रम-संबंधी वास्तविक व्याख्यात्मक अनिश्चितता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कुआँ’, ‘थके हुए’ और ‘बैठे थे’ सामान्य पाठक के लिए स्वाभाविक हैं; ‘छठा घंटा’ मूल पाठ की कालगत अस्पष्टता बचाता है, जिसकी व्याख्या पादटिप्पणी में दी गई है।
