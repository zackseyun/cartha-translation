source:
  edition: SBLGNT
  text: λέγει αὐτοῖς ὁ Ἰησοῦς· Ἐμὸν βρῶμά ἐστιν ἵνα ⸀ποιήσω τὸ θέλημα τοῦ πέμψαντός με καὶ τελειώσω αὐτοῦ τὸ ἔργον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/034.yaml
  text: Jesus said to them[b][a], “My food is to do the will of him who sent me and to complete his work.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “मेरा भोजन यह है कि जिसने मुझे भेजा है, उसकी इच्छा पूरी करूँ और उसका काम पूरा करूँ।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका काम समाप्त करूँ।”
    reason: lexical_alternative
  - marker: b
    text: “जिसने मुझे भेजा है” से प्रसंग में पिता का संकेत मिलता है, यद्यपि यहाँ यूनानी पाठ में यह पदवी स्पष्ट रूप से नहीं दी गई है।
    reason: cross_reference
lexical_decisions:
- source_word: λέγει αὐτοῖς ὁ Ἰησοῦς
  choice: यीशु ने उनसे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी की सहज कथाशैली में भूतकाल अधिक स्वाभाविक है।
- source_word: Ἐμὸν βρῶμά ἐστιν
  choice: मेरा भोजन यह है
  rationale: ‘भोजन’ के ठोस रूपक को बनाए रखा गया है, क्योंकि निकटवर्ती प्रसंग में शिष्य वास्तविक खाने की बात कर रहे हैं।
- source_word: ἵνα ποιήσω τὸ θέλημα
  choice: कि ... उसकी इच्छा पूरी करूँ
  rationale: ἵνα के आशय को स्वाभाविक हिन्दी में ‘यह है कि’ से व्यक्त किया गया है। ‘इच्छा पूरी करना’ हिन्दी में आज्ञाकारी क्रियान्वयन का सहज अर्थ देता है।
- source_word: τοῦ πέμψαντός με
  choice: जिसने मुझे भेजा है
  rationale: संज्ञीकृत कृदंत को संबंधवाचक उपवाक्य से व्यक्त किया गया है; मूल पाठ की तरह व्यक्ति का पदनाम स्पष्ट नहीं जोड़ा गया।
- source_word: τελειώσω
  choice: पूरा करूँ
  rationale: τελειόω किसी काम को उसके अपेक्षित अंत तक पहुँचाने को दर्शाता है; ‘पूरा करूँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἔργον
  choice: काम
  rationale: ἔργον के लिए ‘काम’ सामान्य, सहज और यहाँ सौंपे गए कार्य या मिशन के अर्थ के अनुकूल है।
theological_decisions:
- issue: ‘जिसने मुझे भेजा है’ का संदर्भ
  choice: मूल पाठ के अनुरूप केवल ‘जिसने मुझे भेजा है’ रखा गया है।
  alternative: ‘पिता, जिसने मुझे भेजा है’ या ‘परमेश्वर, जिसने मुझे भेजा है’।
  rationale: यूहन्ना के व्यापक प्रसंग में संकेत पिता की ओर है, लेकिन इस पद के यूनानी पाठ में ‘पिता’ या ‘परमेश्वर’ शीर्षक स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: τελειώσω में पूर्णता या समापन का भाव
  choice: ‘उसका काम पूरा करूँ’
  alternative: ‘उसका काम समाप्त करूँ’
  rationale: ‘पूरा करना’ केवल रुक जाने की अपेक्षा काम को उसके लक्ष्य तक पहुँचाने का व्यापक भाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। भोजन का मूल रूपक और भेजने वाले की अप्रकट पहचान दोनों सुरक्षित रखे गए हैं।
