  text: ἔδει δὲ αὐτὸν διέρχεσθαι διὰ τῆς Σαμαρείας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/004.yaml
  text: He had to pass through Samaria[a].
translation:
  language: hi
  text: उसे सामरिया से होकर जाना ही था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लिए सामरिया से होकर जाना आवश्यक था।” यूनानी पाठ आवश्यकता व्यक्त करता है, पर यह स्पष्ट नहीं करता कि उसका ठीक आधार क्या था।
    reason: शाब्दिक विकल्प और निहित अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἔδει
  choice: जाना ही था
  rationale: अपूर्ण भूतकालीन रूप अतीत की कथा में आवश्यकता व्यक्त करता है। ‘ही था’ स्वाभाविक आधुनिक हिन्दी में आवश्यकता का बल बनाए रखता है, पर उसके आधार को नहीं बताता।
- source_word: δὲ
  choice: अलग से अनूदित नहीं
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, प्रबल विरोधसूचक नहीं। हिन्दी में अलग संयोजक जोड़ने से अनावश्यक बल आता, इसलिए वाक्य-क्रम से इसका कार्य व्यक्त किया गया है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यूनानी में यह infinitive का accusative subject है; हिन्दी की ‘उसे ... जाना था’ रचना इसी संरचना और स्वाभाविक मुहावरे—दोनों के निकट है।
- source_word: διέρχεσθαι
  choice: से होकर जाना
  rationale: διά के साथ यह क्रिया किसी क्षेत्र के भीतर से होकर जाने को दर्शाती है।
- source_word: διὰ τῆς Σαμαρείας
  choice: सामरिया से होकर
  rationale: सम्बन्धकारक के साथ διά किसी स्थान के आर-पार या उसके भीतर से गति बताता है; ‘सामरिया’ के साथ ‘से होकर’ इसे साफ़ और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἔδει में आवश्यकता का आधार
  choice: वास्तविक आवश्यकता को ‘जाना ही था’ से व्यक्त किया गया, पर उसका कारण अनिर्धारित रखा गया।
  alternative: इसे केवल भौगोलिक सुविधा अथवा स्पष्ट ईश्वरीय अनिवार्यता के रूप में समझाना।
  rationale: इस पद में यूनानी पाठ आवश्यकता बताता है, लेकिन यह स्पष्ट नहीं करता कि वह भौगोलिक थी, परिस्थितिजन्य थी, या यीशु के ईश्वरीय मिशन से जुड़ी थी। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘उसे ... जाना ही था’ हिन्दी में स्वाभाविक है और मूल की आवश्यकता को बनाए रखता है।
