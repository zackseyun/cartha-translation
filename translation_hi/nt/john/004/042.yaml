  text: τῇ τε γυναικὶ ἔλεγον ὅτι Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν· αὐτοὶ γὰρ ἀκηκόαμεν, καὶ οἴδαμεν ὅτι οὗτός ἐστιν ἀληθῶς ὁ σωτὴρ τοῦ ⸀κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/042.yaml
  text: And they were saying to the woman[a], “We no longer believe because of your word, for we ourselves have heard[b], and we know that this one truly is the Savior of the world.”
translation:
  language: hi
  text: और वे उस स्त्री से कह रहे थे, “अब हमारा विश्वास केवल तुम्हारी कही बात[a] पर आधारित नहीं है, क्योंकि हमने स्वयं सुना है और हम जानते हैं कि यही[b] सचमुच संसार का उद्धारकर्ता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक औपचारिक रूप में, “तुम्हारी वाणी के कारण।” यूनानी शब्द स्त्री की मौखिक गवाही या कही हुई बात को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “यह व्यक्ति।” यूनानी संकेतवाचक शब्द साधारण “वह” की अपेक्षा अधिक बलयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ τε γυναικὶ ἔλεγον
  choice: और वे उस स्त्री से कह रहे थे
  rationale: दत्तिव τῇ γυναικὶ को संबोधित व्यक्ति के रूप में ‘उस स्त्री से’ और अपूर्णकाल ἔλεγον को जारी या बार-बार कही जा रही बात के रूप में ‘कह रहे थे’ से व्यक्त किया गया है। τε का हल्का संयोजक बल ‘और’ में समाहित है।
- source_word: Οὐκέτι διὰ τὴν σὴν λαλιὰν πιστεύομεν
  choice: अब हम तुम्हारी कही बात के कारण विश्वास नहीं करते
  rationale: Οὐκέτι पूर्व आधार की समाप्ति बताता है। λαλιά यहाँ स्त्री की मौखिक गवाही की कही हुई बात को दर्शाता है; ‘तुम्हारी कही बात’ आधुनिक हिन्दी में स्वाभाविक है और ‘वाणी’ की अपेक्षा आशय को अधिक स्पष्ट करता है।
- source_word: αὐτοὶ γὰρ ἀκηκόαμεν
  choice: क्योंकि हमने स्वयं सुन लिया है
  rationale: αὐτοὶ का बल ‘स्वयं’ से सुरक्षित है। ἀκηκόαμεν के पूर्णकाल को ‘सुन लिया है’ द्वारा ऐसी पूर्ण घटना के रूप में व्यक्त किया गया है जिसका वर्तमान परिणाम बना हुआ है।
- source_word: καὶ οἴδαμεν
  choice: और हम जानते हैं
  rationale: οἴδαμεν रूपतः पूर्णकालीन होते हुए भी वर्तमान स्थिति ‘जानते हैं’ व्यक्त करता है।
- source_word: οὗτός ἐστιν ἀληθῶς
  choice: यही सचमुच ... है
  rationale: बलयुक्त संकेतवाचक οὗτος को ‘यही’ से और ἀληθῶς की पुष्टि को गरिमापूर्ण तथा सहज ‘सचमुच’ से व्यक्त किया गया है।
- source_word: ὁ σωτὴρ τοῦ κόσμου
  choice: संसार का उद्धारकर्ता
  rationale: σωτήρ के स्थापित मसीही अर्थ को ‘उद्धारकर्ता’ सुरक्षित रखता है। κόσμος का सीधा अनुवाद ‘संसार’ है; ‘सारे संसार’ या ‘सब लोगों’ जोड़कर उसके दायरे की व्याख्या नहीं की गई।
theological_decisions:
- issue: सामरी लोगों की स्वीकारोक्ति में ‘संसार’ का दायरा
  choice: संसार का उद्धारकर्ता
  alternative: सब लोगों का उद्धारकर्ता; संसार में से चुने हुओं का उद्धारकर्ता
  rationale: मूल पाठ व्यापक स्वीकारोक्ति करता है, पर यहाँ उसके दायरे का कोई बाद का धर्मसैद्धान्तिक स्पष्टीकरण नहीं देता। इसलिए न तो अर्थ को किसी समूह तक सीमित किया गया और न ‘सब लोगों’ जोड़कर उसे विस्तृत व्याख्या में बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उद्धारकर्ता’ बाइबलीय-धार्मिक पद है, पर सामान्य हिन्दी पाठकों के लिए भी परिचित है। मुख्य वाक्य में यूनानी अपूर्णकाल, पूर्णकाल और बलयुक्त सर्वनाम के महत्त्वपूर्ण पक्षों को यथासंभव स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
