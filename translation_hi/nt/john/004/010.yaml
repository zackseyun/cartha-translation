source:
  edition: SBLGNT
  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Εἰ ᾔδεις τὴν δωρεὰν τοῦ θεοῦ καὶ τίς ἐστιν ὁ λέγων σοι· Δός μοι πεῖν, σὺ ἂν ᾔτησας αὐτὸν καὶ ἔδωκεν ἄν σοι ὕδωρ ζῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/010.yaml
  text: Jesus answered and said to her[a], “If you knew the gift of God, and who it is who says to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”
translation:
  language: hi
  text: यीशु ने उत्तर में उससे कहा, “यदि तुम परमेश्वर का वरदान जानतीं, और यह भी जानतीं कि तुमसे यह कहनेवाला कौन है, ‘मुझे पीने को दो,’ तो तुम उससे माँगतीं, और वह तुम्हें जीवन का जल[a] देता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहता जल” अथवा “ताज़ा जल।” यह वाक्यांश बहते हुए जल के लिए प्रयुक्त हो सकता है, पर “जीवन का जल” यहाँ निहित दोहरे अर्थ को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ
  choice: यीशु ने उसे उत्तर दिया
  rationale: हिन्दी में ‘उत्तर देकर उससे कहा’ यूनानी कथन-द्वय को अधिक शाब्दिक रूप से दिखाता, पर अनावश्यक रूप से भारी लगता है। ‘उत्तर दिया’ स्वाभाविक ढंग से प्रतिक्रिया और कथन दोनों व्यक्त करता है।
- source_word: τὴν δωρεὰν τοῦ θεοῦ
  choice: परमेश्वर के वरदान
  rationale: ‘वरदान’ δωρεά के स्वतंत्र रूप से दिए गए उपहार का भाव रखता है; संबंधकारक ‘परमेश्वर के’ यूनानी रचना की वास्तविक व्यापकता बनाए रखता है और स्रोत को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: τίς ἐστιν ὁ λέγων σοι
  choice: यह भी कि वह कौन है जो तुझसे कह रहा है
  rationale: यह पहचान पर यूनानी के बल को बनाए रखता है और वर्तमान कृदंत λέγων को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Δός μοι πεῖν
  choice: मुझे पीने को दे
  rationale: आज्ञार्थक क्रिया और पीने के अनन्त रूप का संक्षिप्त, स्वाभाविक हिन्दी रूप; ‘कुछ’ जोड़ने की आवश्यकता नहीं है।
- source_word: ᾔτησας ... ἔδωκεν ἄν
  choice: तू उससे माँगती, और वह तुझे ... देता
  rationale: यूनानी की अवास्तविक शर्त को हिन्दी में संदर्भानुकूल अपूर्ण भूतकालीन रूपों से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ὕδωρ ζῶν
  choice: जीवन का जल
  rationale: यह परिचित और अर्थगर्भित हिन्दी अभिव्यक्ति शारीरिक जल तथा यीशु के गहरे संकेत, दोनों की गुंजाइश बनाए रखती है; बहता या ताज़ा जल सामान्य लौकिक अर्थ हो सकता है।
theological_decisions:
- issue: ὕδωρ ζῶν के भौतिक और प्रतीकात्मक दोनों अर्थों को बनाए रखना
  choice: जीवन का जल
  alternative: बहता जल / ताज़ा जल
  rationale: संदर्भ में स्त्री इसे कुएँ के जल के स्तर पर समझ सकती है, जबकि यीशु गहरी आत्मिक वास्तविकता की ओर संकेत करते हैं। मुख्य पाठ में ‘जीवन का जल’ इस तनाव को समय से पहले समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। वार्तालाप की ऐतिहासिक-सामाजिक निकटता को व्यक्त करने के लिए एकवचन ‘तू/तुझसे/तुझे’ रखा गया है; इसे अनादर सूचित करने के लिए नहीं चुना गया।
