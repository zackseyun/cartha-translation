    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο
  choice: यह
  rationale: यह संकेतवाचक सर्वनाम अभी-अभी वर्णित अधिकारी के पुत्र की चंगाई की ओर संकेत करता है।
- source_word: δὲ πάλιν
  choice: फिर
  rationale: δέ का हल्का संयोजक बल और πάλιν का पुनरावृत्ति-सूचक अर्थ स्वाभाविक हिन्दी में संक्षेप से ‘फिर’ द्वारा व्यक्त होता है।
- source_word: δεύτερον
  choice: दूसरा
  rationale: यह क्रमवाचक विशेषण इस कार्य को गलील में किए गए चिह्नों की क्रमबद्धता में रखता है।
- source_word: σημεῖον
  choice: चिह्न
  rationale: यूहन्ना में यह शब्द केवल सामर्थ्यपूर्ण आश्चर्यकर्म नहीं, बल्कि उससे प्रकट होने वाले अर्थ और पहचान पर भी बल देता है।
- source_word: ἐποίησεν
  choice: किया
  rationale: σημεῖον के साथ ποιέω का सीधा और स्वाभाविक हिन्दी रूप ‘चिह्न ... किया’ है।
- source_word: ἐλθὼν
  choice: आने के बाद
  rationale: अओरिस्ट कृदन्त का प्रसंगानुकूल कालगत संबंध मुख्य क्रिया से पहले का है।
- source_word: ἐκ τῆς Ἰουδαίας εἰς τὴν Γαλιλαίαν
  choice: यहूदिया से गलील में
  rationale: यह अनुवाद आरंभ-बिंदु और गलील के भीतर की ओर गति—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: यूहन्ना में σημεῖον की शब्दावली
  choice: चिह्न
  alternative: चमत्कार
  rationale: ‘चिह्न’ इस कार्य की सामर्थ्य के साथ उसके प्रकाशनात्मक और संकेतकारी अर्थ को भी बनाए रखता है, जबकि ‘चमत्कार’ मुख्यतः असाधारण सामर्थ्य पर बल दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘चिह्न’ को यूहन्ना की प्रमुख साहित्यिक-धर्मवैचारिक शब्दावली बनाए रखने के लिए चुना गया है।
