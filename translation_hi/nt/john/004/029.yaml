id: JHN.4.29
reference: John 4:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Δεῦτε ἴδετε ἄνθρωπον ὃς εἶπέ μοι πάντα ⸀ὅσα ἐποίησα· μήτι οὗτός ἐστιν ὁ χριστός;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/029.yaml
  text: Come[a], see a man who told me everything I have done. Could this be the Messiah?
translation:
  language: hi
  text: “आओ, एक आदमी को देखो, जिसने मुझे वह सब बता दिया जो मैंने किया है। कहीं यही मसीह तो नहीं है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या यह मसीह हो सकता है?”
    reason: μήτι से आरम्भ प्रश्न की संकोचपूर्ण, संभावनासूचक शक्ति का वैकल्पिक स्वाभाविक अनुवाद।
lexical_decisions:
- source_word: Δεῦτε ἴδετε
  choice: आओ, ... देखो
  rationale: दोनों आज्ञार्थक क्रियाओं को स्वाभाविक हिन्दी निमंत्रण के रूप में रखा गया है; इससे बुलावे और स्वयं आकर देखने—दोनों का भाव बना रहता है।
- source_word: ἄνθρωπον
  choice: एक आदमी
  rationale: यहाँ शब्द एक पुरुष व्यक्ति, यीशु, की ओर संकेत करता है; ‘एक आदमी’ स्रोत के लिंग और एकवचन को स्पष्ट रूप से दर्शाता है।
- source_word: ὃς εἶπέ μοι
  choice: जिसने मुझे ... बता दिया
  rationale: इस प्रसंग में λέγω के साथ अप्रत्यक्ष कर्म का स्वाभाविक हिन्दी रूप ‘मुझे बता दिया’ है।
- source_word: πάντα ὅσα ἐποίησα
  choice: वह सब ... जो मैंने किया है
  rationale: πάντα ὅσα की व्यापकता को ‘वह सब ... जो’ व्यक्त करता है, और हिन्दी का पूर्णकाल स्त्री के अब तक के जीवन के कामों को वर्तमान गवाही से जोड़ता है।
- source_word: μήτι
  choice: कहीं ... तो नहीं है?
  rationale: यह हिन्दी प्रश्नरचना संदेह, सावधानी और श्रोताओं को विचार करने का निमंत्रण व्यक्त करती है; स्त्री की बात को न तो सपाट दावा बनाती है, न कठोर नकारात्मक प्रश्न।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ χριστός एक पहचानी हुई यहूदी उपाधि है; ‘मसीह’ उस पदवी और प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पद में शब्द निजी नाम की तरह नहीं, अपेक्षित अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ यहूदी मसीहाई संदर्भ को बनाए रखता है।
- issue: μήτι वाले प्रश्न की अनिश्चितता
  choice: कहीं यही मसीह तो नहीं है?
  alternative: क्या यह मसीह हो सकता है?
  rationale: मुख्य पाठ का रूप स्रोत में निहित संकोचपूर्ण प्रश्न को स्वाभाविक हिन्दी में रखता है और स्त्री की बात को निश्चित घोषणा नहीं बनाता।
translation_notes:
  register: आधुनिक, बोलचाल में सहज किंतु गरिमापूर्ण हिन्दी। प्रत्यक्ष कथन की तात्कालिकता बनाए रखी गई है; ‘देखो’ का अर्थ केवल दृष्टि डालना नहीं, आकर उस व्यक्ति से मिलकर विचार करना भी है।
