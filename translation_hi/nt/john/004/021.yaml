base_translation:
  language: en
  yaml_path: translation/nt/john/004/021.yaml
  text: Jesus said to her[a], “Believe me, woman[c][b], an hour is coming when neither on this mountain nor in Jerusalem will you worship the Father.”
translation:
  language: hi
  text: 'यीशु ने उससे कहा, “महिला[b], मेरी बात पर विश्वास करो[a]: वह घड़ी आ रही है[c] जब तुम लोग न तो इस पहाड़ पर और न ही यरूशलेम में पिता की आराधना करोगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझ पर भरोसा रखो।” यूनानी क्रिया किसी की बात को सच मानने या उस व्यक्ति पर भरोसा रखने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में “महिला” के लिए प्रयुक्त यूनानी संबोधन आदरपूर्ण था, रूखा या अपमानजनक नहीं।
    reason: cultural_note
  - marker: c
    text: या, “समय आ रहा है।” यहाँ यूनानी में ‘घड़ी’ के साथ निश्चित उपपद नहीं है, फिर भी यूहन्ना इस शब्द को प्रायः परमेश्वर की योजना के निर्णायक समय के विषयगत संकेत के रूप में प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστευέ μοι
  choice: मेरी बात पर विश्वास करो
  rationale: यहाँ वर्तमानकालीन आज्ञार्थक क्रिया और सम्प्रदान सर्वनाम आने वाले कथन को सच मानने की सीधी अपील करते हैं। ‘मेरी बात पर विश्वास करो’ आधुनिक हिन्दी में स्वाभाविक है और πιστεύω के ‘विश्वास’ वाले शब्द-संबंध को बनाए रखता है; ‘मुझ पर भरोसा रखो’ सम्भव है, पर व्यक्तिगत निर्भरता पर कुछ अधिक बल देता है।
- source_word: γύναι
  choice: हे नारी
  rationale: सम्बोधन γύναι का मूल अर्थ ‘नारी/स्त्री’ है और इस प्रसंग में यह आदरपूर्ण है। ‘हे नारी’ स्रोत की सीधी सम्बोधन-शैली को बिना ‘बहन’ जैसे अतिरिक्त संबंध जोड़े सुरक्षित रखता है।
- source_word: ἔρχεται ὥρα
  choice: एक घड़ी आ रही है
  rationale: ὥρα के साथ उपपद नहीं है, इसलिए ‘एक घड़ी’ यूनानी रूप को दर्शाता है। ‘घड़ी’ यूहन्ना में निर्णायक समय के बार-बार आने वाले विषयगत शब्द को सुरक्षित रखती है; सामान्य ‘समय’ अधिक व्याख्यात्मक होता।
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: इस पहाड़ पर
  rationale: स्थल-संदर्भ में ἐν का स्वाभाविक हिन्दी रूप ‘पर’ है और यहाँ चर्चा में आए सामरी पवित्र पहाड़ की ओर संकेत है।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: नगर के लिए हिन्दी में ‘में’ स्वाभाविक है; यूनानी बहुवचन-रूप स्थान-नाम का प्रचलित रूप है और हिन्दी नाम को बहुवचन बनाने की आवश्यकता नहीं।
- source_word: προσκυνήσετε
  choice: तुम लोग ... आराधना करोगे
  rationale: क्रिया भविष्यकाल, द्वितीय पुरुष बहुवचन है। ‘तुम लोग’ बहुवचन को स्पष्ट करता है और ‘आराधना करना’ यूहन्ना 4 के धार्मिक संदर्भ में προσκυνέω का स्वाभाविक व्यापक अर्थ देता है।
- source_word: τῷ πατρί
  choice: पिता की
  rationale: यूहन्ना के संदर्भ में यह परमेश्वर के लिए व्यक्तिगत पदवी ‘पिता’ है। हिन्दी में ‘आराधना करना’ के साथ सम्बन्धकारक ‘की’ स्वाभाविक वाक्य-विन्यास है।
- source_word: οὔτε ... οὔτε
  choice: न तो ... और न ही
  rationale: यह हिन्दी का स्वाभाविक सहसम्बन्धी निषेध है और सामरी पहाड़ तथा यरूशलेम—दोनों उपासना-स्थलों के निषेधात्मक विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: γύναι सम्बोधन का स्वर
  choice: मुख्य पाठ में ‘हे नारी’ रखकर उसके आदरपूर्ण सांस्कृतिक स्वर को पादटिप्पणी में स्पष्ट किया गया
  alternative: बहन; हे प्रिय नारी; महोदया
  rationale: मूल शब्द असम्मानजनक नहीं है, किन्तु उसे नरम बनाने के लिए संबंध या स्नेहसूचक शब्द जोड़ना स्रोत से अधिक अर्थ जोड़ देता।
- issue: यूहन्ना में ὥρα का विषयगत प्रयोग
  choice: ‘समय’ के बजाय ‘घड़ी’ रखा गया
  alternative: वह समय आ रहा है
  rationale: ‘घड़ी’ परमेश्वर की योजना में आने वाले निर्णायक अवसर से जुड़ी यूहन्ना की विषयगत भाषा और उसके निहित धर्मवैज्ञानिक तनाव को बिना समझाए सुरक्षित रखती है।
- issue: आराधना करने वालों की संख्या
  choice: बहुवचन को ‘तुम लोग’ से स्पष्ट किया गया
  alternative: तुम
  rationale: προσκυνήσετε स्पष्ट रूप से द्वितीय पुरुष बहुवचन है। यीशु का कथन केवल उस स्त्री के निजी व्यवहार तक सीमित नहीं, यद्यपि सम्बोधन उससे एकवचन में है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे नारी’ सामान्य बातचीत की अपेक्षा कुछ औपचारिक है, पर मूल के सीधे सम्बोधन और आदरपूर्ण स्वर को बनाए रखता है। ‘एक घड़ी आ रही है’ जानबूझकर यूहन्ना की विषयगत शब्दावली को सुरक्षित रखता है।
