source:
  edition: SBLGNT
  text: οἱ πατέρες ἡμῶν ἐν τῷ ὄρει τούτῳ προσεκύνησαν· καὶ ὑμεῖς λέγετε ὅτι ἐν Ἱεροσολύμοις ἐστὶν ὁ τόπος ὅπου ⸂προσκυνεῖν δεῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/020.yaml
  text: Our fathers worshiped on this mountain[b][a], and you say that in Jerusalem is the place where one must worship.
translation:
  language: hi
  text: “हमारे पूर्वजों ने इस पहाड़ पर उपासना की,[a] और तुम कहते हो कि यरूशलेम में वह स्थान है जहाँ उपासना करना आवश्यक है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे पुरखों ने इस पहाड़ पर उपासना की।”
    reason: ‘पूर्वजों’ के लिए अधिक परंपरागत/बोलचाल का वैकल्पिक वंश-सूचक रूप।
  - marker: b
    text: या, “जहाँ उपासना करना ज़रूरी है।”
    reason: δεῖ की निर्वैयक्तिक आवश्यकता को बनाए रखने वाला स्वाभाविक वैकल्पिक हिन्दी रूप।
lexical_decisions:
- source_word: οἱ πατέρες ἡμῶν
  choice: हमारे पुरखों
  rationale: ‘पुरखों’ से सामुदायिक वंश-परंपरा का भाव स्वाभाविक आधुनिक हिन्दी में बना रहता है। यह यूनानी के शाब्दिक पुरुषवाची रूप को अत्यधिक संकीर्ण किए बिना उसके ऐतिहासिक प्रतिनिधि अर्थ को व्यक्त करता है।
- source_word: ἐν τῷ ὄρει τούτῳ
  choice: इस पहाड़ पर
  rationale: पहाड़ को उपासना के स्थान के रूप में बताते समय हिन्दी में ‘पर’ स्वाभाविक स्थानवाचक प्रयोग है।
- source_word: προσεκύνησαν
  choice: उपासना की थी
  rationale: इस प्रसंग में προσκυνέω का धार्मिक अर्थ प्रमुख है; भूतकालीन कार्य को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘की थी’ रखा गया है।
- source_word: ὑμεῖς
  choice: तुम लोग
  rationale: स्पष्ट यूनानी सर्वनाम का सामूहिक और विरोधसूचक बल बनाए रखता है, पर ‘तुम यहूदी’ जैसी संदर्भ से जोड़ी गई पहचान नहीं डालता।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: यह स्थाननाम के साथ स्वाभाविक आधुनिक हिन्दी प्रयोग है।
- source_word: ὁ τόπος
  choice: वह स्थान
  rationale: निश्चित स्थान का संकेत स्पष्ट करता है और हिन्दी वाक्य को स्वाभाविक बनाता है; ‘सही स्थान’ कहकर निहित विशिष्टता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: ὅπου
  choice: जहाँ
  rationale: स्थानसूचक संबंधवाचक उपवाक्य का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: προσκυνεῖν δεῖ
  choice: जहाँ उपासना करना आवश्यक है
  rationale: δεῖ की निर्वैयक्तिक आवश्यकता और मानकात्मक बल को बनाए रखता है, बिना इसे किसी एक व्यक्ति को दी गई आज्ञा बनाने के।
- source_word: καὶ
  choice: और
  rationale: मूल के समुच्चयबोधक रूप को बनाए रखा गया है; ‘हमारे पुरखों’ और ‘तुम लोग’ से विरोध पहले ही स्पष्ट है।
theological_decisions:
- issue: सामरी और यहूदी उपासना के बीच विरोध को मूल से अधिक स्पष्ट करना
  choice: ‘हमारे पुरखों ... और तुम लोग कहते हो’ में विरोध को निहित रखा गया
  alternative: ‘हम सामरियों के पुरखों ... पर तुम यहूदी कहते हो’
  rationale: इस पद में यूनानी पाठ समुदायों के नाम नहीं लेता; विरोध सर्वनामों और प्रसंग से सामने आता है। समुदायों के नाम जोड़ना मूल कथन से आगे जाना होता।
- issue: προσκυνεῖν δεῖ में निर्वैयक्तिक आवश्यकता
  choice: ‘जहाँ उपासना करना आवश्यक है’
  alternative: ‘जहाँ लोगों को उपासना करनी चाहिए’
  rationale: चुना हुआ रूप किसी विशिष्ट व्यक्ति को संबोधित किए बिना उपासना के मान्य स्थान के विषय में सामान्य आवश्यकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरखों’ से वक्ता की सामुदायिक वंश-परंपरा का जीवंत भाव आता है, जबकि पादटिप्पणी में अधिक तटस्थ ‘पूर्वजों’ दिया गया है। ‘उपासना’ धार्मिक प्रसंग के लिए व्यापक और संप्रदाय-निरपेक्ष शब्द है।
