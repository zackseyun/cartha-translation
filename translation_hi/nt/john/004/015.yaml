reference: John 4:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει πρὸς αὐτὸν ἡ γυνή· Κύριε, δός μοι τοῦτο τὸ ὕδωρ, ἵνα μὴ διψῶ μηδὲ ⸀διέρχωμαι ἐνθάδε ἀντλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/015.yaml
  text: The woman said to him[a], “Lord, give me this water, so that I may not be thirsty or come here to draw.”
translation:
  language: hi
  text: स्त्री ने उससे कहा, “प्रभु[a], मुझे यह पानी दीजिए, ताकि मुझे प्यास न लगे और मैं यहाँ पानी भरने न आऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय, मुझे यह पानी दीजिए...”
    reason: यूनानी κύριε यहाँ आदरसूचक ‘महोदय’ के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: λέγει
  choice: ने ... कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में सामान्य भूतकाल अधिक स्वाभाविक है और वही कथात्मक कार्य बनाए रखता है।
- source_word: γυνή
  choice: स्त्री
  rationale: संदर्भ में यह सामरी स्त्री है; इसलिए ‘स्त्री’ सटीक और स्वाभाविक है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह संबोधन आदरसूचक ‘महोदय’ भी हो सकता है, किंतु ‘प्रभु’ यूहन्ना के वृत्तांत में शब्द की संभावित गहरी अर्थ-छाया को सुरक्षित रखता है; दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: δός μοι
  choice: मुझे ... दीजिए
  rationale: आदरसूचक संबोधन के अनुरूप ‘दीजिए’ सीधा, स्वाभाविक और विनम्र हिन्दी रूप है।
- source_word: τοῦτο τὸ ὕδωρ
  choice: यह पानी
  rationale: मूल में केवल ‘यह पानी’ है; इस पद में ‘जीवन का’ या ‘जीवित’ जोड़ना उचित नहीं होगा।
- source_word: ἵνα μὴ διψῶ
  choice: ताकि मुझे प्यास न लगे
  rationale: यह उद्देश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और संभावनार्थक भाव को निश्चयात्मक प्रतिज्ञा में नहीं बदलता।
- source_word: μηδὲ διέρχωμαι ἐνθάδε
  choice: और ... यहाँ न आना पड़े
  rationale: नकारात्मक उद्देश्य से जुड़े दूसरे परिणाम और बार-बार यहाँ आने की व्यावहारिक विवशता को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀντλεῖν
  choice: पानी भरने के लिए
  rationale: कुएँ के संदर्भ में क्रिया का स्वाभाविक हिन्दी अर्थ ‘पानी भरना’ है; ‘पानी’ क्रिया में निहित कर्म को स्पष्ट करता है, नई सूचना नहीं जोड़ता।
theological_decisions:
- issue: सामरी स्त्री के संबोधन में κύριος का अर्थ
  choice: प्रभु
  alternative: महोदय
  rationale: तत्काल संवाद में यह सम्मानसूचक संबोधन हो सकता है, जबकि यूहन्ना के व्यापक कथानक में इसका गहरा संकेत भी संभव है। मुख्य पाठ और पादटिप्पणी दोनों अर्थ-स्तरों को बिना निर्णायक रूप से सुलझाए सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पानी भरने’ का प्रयोग कुएँ से पानी निकालने के लिए प्रचलित हिन्दी मुहावरा है; ‘आना पड़े’ निरंतर व्यावहारिक आवश्यकता का स्वाभाविक बोध कराता है।
