  text: λέγει αὐτῷ ἡ γυνή· Οἶδα ὅτι Μεσσίας ἔρχεται, ὁ λεγόμενος χριστός· ὅταν ἔλθῃ ἐκεῖνος, ἀναγγελεῖ ἡμῖν ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/025.yaml
  text: The woman said to him[a], “I know that Messiah is coming” (the one called Messiah). “When he comes, he will tell us all things.”
translation:
  language: hi
  text: स्त्री ने उससे कहा, “मैं जानती हूँ कि मसीहा आने वाला है (जिसे मसीह कहा जाता है)।[a] जब वह आएगा, तो वह हमें सब कुछ बता देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में: “मसीहा, जिसे मसीह कहा जाता है।” यहाँ यूहन्ना सामी पद “मसीहा” को उसके यूनानी समतुल्य “मसीह” से समझाता है; दोनों का अर्थ “अभिषिक्त” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथावर्णन में सामान्य भूतकाल अधिक स्वाभाविक है।
- source_word: γυνή
  choice: स्त्री
  rationale: संदर्भ में यह सामरी स्त्री है; ‘स्त्री’ स्पष्ट, गरिमापूर्ण और स्वाभाविक है।
- source_word: Οἶδα
  choice: मैं जानती हूँ
  rationale: वक्ता स्त्री है, इसलिए हिन्दी में स्त्रीलिंग रूप आवश्यक है; यह यूनानी का सीधा अर्थ देता है।
- source_word: Μεσσίας
  choice: मसीहा
  rationale: यह सामी मूल का पद है और यहूदी-सामरी मसीहाई संदर्भ को सुरक्षित रखता है।
- source_word: ἔρχεται
  choice: आनेवाला है
  rationale: वर्तमान काल का भाव यहाँ निकट अथवा अपेक्षित भविष्य का है; हिन्दी में यह अभिव्यक्ति उसी प्रत्याशा को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ὁ λεγόμενος χριστός
  choice: जिसे ख्रीस्त कहा जाता है
  rationale: मूल पाठ Μεσσίας की व्याख्या यूनानी समतुल्य χριστός से करता है। ‘ख्रीस्त’ अलग रूप में रखने से द्विभाषी व्याख्यात्मक संरचना दिखाई देती है, जबकि मुख्य पद ‘मसीहा’ रहता है।
- source_word: ὅταν ἔλθῃ ἐκεῖνος
  choice: जब वह आएगा
  rationale: यह भविष्य की अपेक्षित घटना व्यक्त करता है। बलाघाती ἐκεῖνος को हिन्दी का ‘वह’ स्वाभाविक रूप से दर्शाता है।
- source_word: ἀναγγελεῖ ἡμῖν ἅπαντα
  choice: वह हमें सब बातें बता देगा
  rationale: ἀναγγελεῖ का प्रसंगगत अर्थ बातों को स्पष्ट करके बताना है; ‘सब बातें’ ἅπαντα की व्यापकता रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: Μεσσίας और χριστός के बीच व्याख्यात्मक संबंध
  choice: मुख्य पद के लिए ‘मसीहा’ और कोष्ठकीय व्याख्या में ‘ख्रीस्त’
  alternative: दोनों को ‘मसीहा’ कहना
  rationale: दोनों को एक ही हिन्दी शब्द से देने पर मूल की वह विशेषता मिट जाती है जिसमें सामी पद Μεσσίας को यूनानी χριστός द्वारा समझाया गया है। अलग प्रचलित रूप और पादटिप्पणी इस संबंध को बिना अतिरिक्त धर्मवैचारिक अर्थ जोड़े सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘आनेवाला’ को एक शब्द के रूप में और भविष्य के लिए ‘आएगा’ रखा गया है। कोष्ठकीय वाक्यांश तथा पादटिप्पणी मूल की भाषाई व्याख्या को स्पष्ट रखते हैं।
