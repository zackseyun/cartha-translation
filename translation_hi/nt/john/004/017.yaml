base_translation:
  language: en
  yaml_path: translation/nt/john/004/017.yaml
  text: 'The woman answered and said to him[a], “I do not have a husband.” Jesus said to her[b], “You have spoken well: ‘I do not have a husband.’”'
translation:
  language: hi
  text: स्त्री ने उत्तर में उससे कहा, “मेरा कोई पति नहीं है।” यीशु ने उससे कहा, “तुमने ठीक कहा कि ‘मेरा कोई पति नहीं है।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεκρίθη ἡ γυνὴ καὶ εἶπεν
  choice: स्त्री ने उत्तर दिया
  rationale: यूनानी में उत्तर देने और कहने की संयुक्त कथन-शैली है। हिन्दी में ‘उत्तर दिया’ दोनों का अर्थ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है; ‘उत्तर देकर कहा’ अधिक शब्दशः होता, पर यहाँ अनावश्यक रूप से भारी लगता।
- source_word: Οὐκ ἔχω ἄνδρα
  choice: मेरा पति नहीं है
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ हो सकता है, लेकिन अगले पद में वैवाहिक इतिहास के स्पष्ट संदर्भ के कारण यहाँ ‘पति’ उपयुक्त है। ‘मेरा पति नहीं है’ आधुनिक हिन्दी में स्वाभाविक है और वर्तमान स्थिति को स्पष्ट करता है।
- source_word: λέγει αὐτῇ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान λέγει को स्वाभाविक हिन्दी कथा-शैली में भूतकाल ‘कहा’ से व्यक्त किया गया है।
- source_word: Καλῶς εἶπας
  choice: तुमने ठीक कहा
  rationale: καλῶς यहाँ स्त्री के कथन की सत्यता या यथार्थता की पुष्टि करता है। ‘ठीक कहा’ सहज हिन्दी है और ‘अच्छा कहा’ की संभावित प्रशंसात्मक अस्पष्टता से बचता है।
- source_word: ὅτι Ἄνδρα οὐκ ἔχω
  choice: ‘मेरा पति नहीं है।’
  rationale: ὅτι यहाँ पहले कथन की विषय-वस्तु प्रस्तुत करता है। हिन्दी में प्रत्यक्ष उद्धरण द्वारा यीशु की पुनरुक्ति को स्पष्ट और स्वाभाविक रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀνήρ का संदर्भगत अर्थ
  choice: पति
  alternative: पुरुष
  rationale: यद्यपि शब्द में दोनों अर्थ संभव हैं, यूहन्ना 4:18 का निकट संदर्भ वैवाहिक संबंधों की चर्चा को स्पष्ट करता है। ‘पति’ अर्थ को व्यक्त करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बोलचाल में सहज। यूनानी की पुनरुक्ति को रखा गया है, जबकि ‘उत्तर दिया और कहा’ को हिन्दी की स्वाभाविक कथा-शैली के अनुसार संक्षिप्त किया गया है।
