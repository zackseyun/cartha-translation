- source_word: Ἐγώ εἰμι
  choice: मैं हूँ
  rationale: यूनानी में स्पष्टतः ‘मैं हूँ’ है; ‘वही’ या ‘मसीह’ जोड़ने से संदर्भ में निहित पहचान मुख्य पाठ में अधिक स्पष्ट हो जाती। यह रूप मूल की संक्षिप्तता और संभावित धार्मिक अनुगूँज बनाए रखता है।
- source_word: ὁ λαλῶν σοι
  choice: जो तुमसे बोल रहा हूँ
  rationale: संज्ञात्मक वर्तमान कृदन्त को हिन्दी में स्वाभाविक संबंधवाचक उपवाक्य से व्यक्त किया गया है। कर्ता स्वयं यीशु हैं, इसलिए हिन्दी में प्रथम पुरुष ‘बोल रहा हूँ’ आवश्यक है।
theological_decisions:
- issue: क्या मसीही पहचान को मुख्य पाठ में स्पष्ट किया जाए
  choice: ‘मैं हूँ’ को यथावत रखा गया
  alternative: ‘मैं वही हूँ’ अथवा ‘मैं ही मसीह हूँ’
  rationale: पिछले पद से स्पष्ट है कि यीशु अपने को अपेक्षित मसीह बता रहे हैं, किन्तु इस पद के यूनानी पाठ में पूरक पद स्पष्ट रूप से नहीं है। इसलिए मूल की संक्षिप्तता और अर्थगत तनाव सुरक्षित रखा गया है।
