  text: ἀπεκρίθη Ἰησοῦς καὶ εἶπεν αὐτῇ· Πᾶς ὁ πίνων ἐκ τοῦ ὕδατος τούτου διψήσει πάλιν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/013.yaml
  text: Jesus answered and said to her[a], “Everyone who drinks from this water will be thirsty again.”
translation:
  language: hi
  text: यीशु ने उसे उत्तर देकर कहा, “जो कोई इस पानी में से पीता है, उसे फिर प्यास लगेगी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “वह फिर प्यासा होगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη … καὶ εἶπεν
  choice: उत्तर देकर कहा
  rationale: यह स्वाभाविक हिन्दी में यूनानी के दोनों वाचिक क्रियापदों—‘उत्तर दिया’ और ‘कहा’—को बनाए रखता है, बिना अभिव्यक्ति को अनावश्यक रूप से बोझिल किए।
- source_word: αὐτῇ
  choice: उसे
  rationale: यह दत्तिव रूप सामरी स्त्री की ओर संकेत करता है; हिन्दी में ‘उसे’ स्पष्ट और स्वाभाविक है।
- source_word: Πᾶς ὁ πίνων
  choice: जो कोई … पीता है
  rationale: यह वर्तमान कृदन्त की सामान्य और सार्वभौमिक व्याप्ति को सहज, लिंग-समावेशी हिन्दी में व्यक्त करता है।
- source_word: ἐκ τοῦ ὕδατος τούτου
  choice: इस पानी में से
  rationale: यह निकट संकेतवाचक ‘इस’ और स्रोत-बोधक ἐκ दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: διψήσει πάλιν
  choice: उसे फिर प्यास लगेगी
  rationale: यह भविष्यकाल और पुनरावृत्ति दोनों को आधुनिक, मुहावरेदार तथा लिंग-निरपेक्ष हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀπεκρίθη … καὶ εἶπεν की दोहरी कथन-अभिव्यक्ति
  choice: दोनों क्रियाओं को ‘उत्तर देकर कहा’ में बनाए रखना
  alternative: केवल ‘उत्तर दिया’ या ‘कहा’
  rationale: यूहन्ना की यूनानी कथन-शैली में दोनों क्रियाएँ स्पष्ट हैं। हिन्दी कृदन्तीय रचना स्रोत की बनावट को सुरक्षित रखते हुए स्वाभाविक रहती है।
- issue: Πᾶς ὁ πίνων का व्याकरणिक पुल्लिंग
  choice: लिंग-समावेशी ‘जो कोई … पीता है’
  alternative: ‘हर पुरुष जो पीता है’
  rationale: यूनानी अभिव्यक्ति पुरुषों तक सीमित नहीं, बल्कि सामान्य रूप से हर पीने वाले व्यक्ति को सम्मिलित करती है।
- issue: διψήσει का निरूपण
  choice: ‘उसे फिर प्यास लगेगी’
  alternative: ‘वह फिर प्यासा होगा’
  rationale: चुनी हुई अभिव्यक्ति अर्थ को यथावत रखती है, सामान्य हिन्दी में अधिक स्वाभाविक है और अनावश्यक रूप से पुल्लिंग नहीं बनाती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उत्तर देकर कहा’ स्रोत की दोहरी वाचिक अभिव्यक्ति को स्वाभाविक रूप में रखता है; ‘उसे प्यास लगेगी’ सामान्य पाठक के लिए स्पष्ट और मुहावरेदार है।
