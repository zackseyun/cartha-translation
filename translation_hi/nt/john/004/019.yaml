  text: λέγει αὐτῷ ἡ γυνή· Κύριε, θεωρῶ ὅτι προφήτης εἶ σύ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/019.yaml
  text: The woman said to him[a], “Lord, I see that you are a prophet.”
translation:
  language: hi
  text: स्त्री ने उससे कहा, “प्रभु[a], मैं समझती हूँ कि आप एक भविष्यद्वक्ता हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε सम्मानसूचक सम्बोधन भी हो सकता है और इसका अर्थ “प्रभु” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है।
- source_word: αὐτῷ
  choice: उससे
  rationale: सम्बोधन की दिशा बताने वाले सम्प्रदान का स्वाभाविक हिन्दी रूप।
- source_word: ἡ γυνή
  choice: स्त्री
  rationale: सन्दर्भ में यह सामरी स्त्री है; यहाँ अर्थ ‘पत्नी’ नहीं है।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριε का सामान्य और धर्मवैचारिक रूप से परिचित हिन्दी रूप ‘प्रभु’ है; इस प्रसंग में सम्मानसूचक ‘महोदय’ का अर्थ भी सम्भव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: θεωρῶ
  choice: मैं समझती हूँ
  rationale: यहाँ θεωρέω यीशु की बात से प्राप्त पहचान या बोध व्यक्त करता है; ‘समझती हूँ’ आधुनिक हिन्दी में स्वाभाविक है और केवल दृश्य देखने तक सीमित नहीं करता।
- source_word: ὅτι
  choice: कि
  rationale: स्त्री के बोध की विषय-वस्तु प्रस्तुत करने वाला स्वाभाविक संयोजक।
- source_word: προφήτης
  choice: एक भविष्यद्वक्ता
  rationale: अनिर्दिष्ट विधेय संज्ञा यह बताती है कि वह यीशु को एक भविष्यद्वक्ता मानती है, अनिवार्यतः व्यवस्थाविवरण 18 के विशिष्ट ‘उस भविष्यद्वक्ता’ के रूप में नहीं।
- source_word: σύ
  choice: आप
  rationale: सम्मानसूचक सम्बोधन के अनुरूप ‘आप’ स्वाभाविक है; यूनानी में स्पष्ट सर्वनाम कुछ बल देता है, पर हिन्दी वाक्य में अलग बल-चिह्न आवश्यक नहीं।
theological_decisions:
- issue: यीशु के लिए सम्बोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: तात्कालिक प्रसंग में यह सम्मानसूचक सम्बोधन हो सकता है और अभी पूर्ण मसीही स्वीकारोक्ति को अनिवार्य नहीं करता। मुख्य पाठ में पारम्परिक ‘प्रभु’ रखा गया है और वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। स्त्री की ओर से सम्मान दिखाने के लिए ‘आप’ रखा गया है। ‘मैं समझती हूँ’ प्रत्यक्ष देखने के बजाय पहचान और निष्कर्ष के भाव को व्यक्त करता है।
