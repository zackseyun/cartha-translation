  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐχ ὑμεῖς λέγετε ὅτι Ἔτι τετράμηνός ἐστιν καὶ ὁ θερισμὸς ἔρχεται; ἰδοὺ λέγω ὑμῖν, ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν καὶ θεάσασθε τὰς χώρας ὅτι λευκαί εἰσιν πρὸς θερισμόν· ἤδη
base_translation:
  language: en
  yaml_path: translation/nt/john/004/035.yaml
  text: 'Do you not say[a], ‘There are still four months, and then the harvest comes’? Look, I tell you: lift up your eyes and see the fields, that they are white for harvest already.'
translation:
  language: hi
  text: 'क्या तुम नहीं कहते, ‘अभी चार महीने हैं, तब कटनी आएगी’? देखो, मैं तुमसे कहता हूँ: अपनी आँखें उठाकर खेतों को देखो; वे कटनी के लिए पहले ही सफेद हैं[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे कटनी के लिए पक चुके हैं।’ यूनानी में शाब्दिक रूप से ‘सफेद’ है, जो खेतों का दृश्यात्मक चित्र बनाए रखते हुए कटनी के लिए उनकी तैयारी का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχ ὑμεῖς λέγετε
  choice: क्या तुम नहीं कहते
  rationale: नकारात्मक प्रश्न और बहुवचन संबोधन को स्वाभाविक हिन्दी में रखा गया है। अलग से ‘तुम स्वयं’ जोड़ने पर यूनानी सर्वनाम का बल हिन्दी में आवश्यकता से अधिक प्रबल हो जाता।
- source_word: Ἔτι τετράμηνός ἐστιν
  choice: अभी चार महीने हैं
  rationale: यह कटनी से पहले बची अवधि बताने वाला मुहावरा है। हिन्दी में यह संक्षिप्त रूप स्वाभाविक है और अगले खंड ‘तब कटनी आएगी’ से समय-संबंध स्पष्ट हो जाता है।
- source_word: ὁ θερισμὸς ἔρχεται
  choice: तब कटनी आएगी
  rationale: ‘कटनी’ कृषि-संदर्भ और आगे आने वाले रूपक दोनों को बनाए रखती है। हिन्दी में कथन को स्वाभाविक बनाने के लिए ‘तब’ प्रयुक्त है; यह यूनानी καί के कालक्रमिक संबंध को व्यक्त करता है।
- source_word: ἰδοὺ λέγω ὑμῖν
  choice: देखो, मैं तुमसे कहता हूँ
  rationale: ‘देखो’ ध्यान आकर्षित करने वाले ἰδού का आधुनिक और गरिमापूर्ण रूप है; पूरा वाक्यांश यीशु के कथन पर बल बनाए रखता है।
- source_word: ἐπάρατε τοὺς ὀφθαλμοὺς ὑμῶν
  choice: अपनी आँखें उठाकर
  rationale: यूनानी की दृश्यात्मक देह-भाषा को सुरक्षित रखा गया है, केवल सामान्य ‘ऊपर देखो’ में समतल नहीं किया गया।
- source_word: θεάσασθε τὰς χώρας
  choice: खेतों को देखो
  rationale: θεάσασθε ध्यानपूर्वक देखने का आह्वान है और कटनी के संदर्भ में χώρας का अर्थ खेती के ‘खेत’ है, न कि सामान्य प्रदेश।
- source_word: λευκαί εἰσιν
  choice: सफेद हैं
  rationale: मूल पाठ की प्रत्यक्ष दृश्य-छवि को रखा गया है। ‘पक गए हैं’ अर्थ को स्पष्ट करता, पर यूनानी के रंग-संबंधी रूपक को हटा देता।
- source_word: πρὸς θερισμόν
  choice: कटनी के लिए
  rationale: यह संक्षिप्त पद मूल के उद्देश्य अथवा तैयारी के भाव को बनाए रखता है, बिना मुख्य पाठ में ‘तैयार’ जोड़कर रूपक की व्याख्या किए।
- source_word: ἤδη
  choice: पहले ही
  rationale: ἤδη कथित चार महीने की प्रतीक्षा के विपरीत वर्तमान तत्परता पर बल देता है। ‘पहले ही’ हिन्दी में उस विरोध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: कटनी को मुख्य पाठ में शाब्दिक कृषि-चित्र के रूप में रखना या लोगों के मिशन-संबंधी संग्रह के रूप में स्पष्ट करना
  choice: कृषि-चित्र और उसकी रूपकात्मक खुली अर्थवत्ता को बनाए रखा गया है।
  alternative: ‘लोग इकट्ठे किए जाने के लिए तैयार हैं’ जैसा व्याख्यात्मक अनुवाद।
  rationale: संदर्भ में कथन का आध्यात्मिक और मिशन-संबंधी संकेत है, पर यूनानी पाठ स्वयं खेत और कटनी की भाषा बोलता है। अनुवाद उस संकेत को स्पष्ट सिद्धांत-वाक्य में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संबोधन रखा गया है। ‘कटनी’ ग्रामीण और बाइबिलीय कृषि-संदर्भ में स्पष्ट है; ‘फसल की कटाई’ की अपेक्षा यह बार-बार आने वाले θερισμός के रूपक को अधिक संक्षेप में बनाए रखती है। विराम-चिह्न दो कथनों के विरोध और दृश्य आह्वान को स्पष्ट करते हैं।
