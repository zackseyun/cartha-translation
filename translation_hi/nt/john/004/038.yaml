source:
  edition: SBLGNT
  text: ἐγὼ ἀπέστειλα ὑμᾶς θερίζειν ὃ οὐχ ὑμεῖς κεκοπιάκατε· ἄλλοι κεκοπιάκασιν, καὶ ὑμεῖς εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/038.yaml
  text: I sent you to reap what you have not labored for[a]; others have labored[b], and you have entered into their labor.
translation:
  language: hi
  text: मैंने तुम्हें उस फसल की कटनी करने[a] के लिए भेजा, जिसके लिए तुमने परिश्रम नहीं किया है। दूसरों ने परिश्रम किया है, और तुम उनके परिश्रम में शामिल हो गए हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसकी कटनी करने’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘तुम उनके परिश्रम में प्रवेश कर चुके हो।’ या, ‘तुम उनके काम में सहभागी हो गए हो’ अथवा ‘तुम्हें उनके परिश्रम का फल मिला है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέστειλα
  choice: भेजा
  rationale: साधारण भूतकाल इस प्रसंग में यीशु द्वारा दिए गए पूरे किए जा चुके कार्यादेश को स्वाभाविक रूप से व्यक्त करता है; ‘नियुक्त किया’ की अपेक्षा ‘भेजा’ मूल क्रिया के अर्थ को अधिक सीधे रखता है।
- source_word: θερίζειν
  choice: फसल काटने
  rationale: यह कृषि-रूपक को बनाए रखता है और आधुनिक हिन्दी में अकेले ‘काटने’ की तुलना में आशय को स्पष्ट तथा स्वाभाविक बनाता है।
- source_word: ὃ
  choice: वह फसल ... जिसके लिए
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम यहाँ कर्म के रूप में प्रयुक्त है। हिन्दी में ‘वह फसल ... जिसके लिए’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κεκοπιάκατε
  choice: तुमने परिश्रम नहीं किया
  rationale: ‘परिश्रम करना’ कठिन और सतत श्रम का भाव व्यक्त करता है। पूर्णकाल की वर्तमान-संबद्धता को हिन्दी वाक्य-संदर्भ पर्याप्त रूप से प्रकट करता है।
- source_word: ἄλλοι
  choice: दूसरों
  rationale: यह संक्षिप्त और स्वाभाविक है तथा मूल पाठ की तरह उन लोगों की पहचान को अनिर्दिष्ट रखता है।
- source_word: κεκοπιάκασιν
  choice: परिश्रम किया है
  rationale: पूर्णकाल को ‘किया है’ द्वारा व्यक्त किया गया है, जिससे पहले किए गए श्रम की वर्तमान प्रासंगिकता बनी रहती है और पहले प्रयोग के साथ शब्द-संगति भी रहती है।
- source_word: εἰς τὸν κόπον αὐτῶν εἰσεληλύθατε
  choice: तुम उनके परिश्रम में शामिल हो गए हो
  rationale: शाब्दिक ‘उनके परिश्रम में प्रवेश कर चुके हो’ हिन्दी में अस्वाभाविक है। ‘शामिल हो गए हो’ उनके पहले से चल रहे या फलदायी श्रम में शिष्यों के आ मिलने का भाव देता है, बिना इसे केवल श्रम के फल तक सीमित किए।
- source_word: ἐγὼ ... ὑμεῖς
  choice: मैंने ... तुम्हें/तुम
  rationale: हिन्दी में व्यक्त सर्वनाम मूल यूनानी के स्पष्ट कर्ता और श्रोताओं को बनाए रखते हैं; कृत्रिम अतिरिक्त बल नहीं जोड़ा गया।
- source_word: κόπον
  choice: परिश्रम
  rationale: यह κοπιάω और κόπος के शब्दगत संबंध को दोनों स्थानों पर ‘परिश्रम’ के माध्यम से बनाए रखता है।
theological_decisions:
- issue: फसल के रूपक में ‘दूसरों’ की पहचान
  choice: ‘दूसरों’ को अनिर्दिष्ट रखा गया है।
  alternative: इसे विशेष रूप से भविष्यद्वक्ताओं, यूहन्ना बपतिस्मा देने वाले, यीशु, या पहले के अन्य गवाहों के रूप में पहचानना।
  rationale: यह पद स्वयं ‘दूसरों’ की पहचान स्पष्ट नहीं करता। अनुवाद इस व्यापकता और व्याख्यात्मक तनाव को बनाए रखता है।
- issue: शिष्यों का दूसरों के परिश्रम में प्रवेश
  choice: ‘उनके परिश्रम में शामिल हो गए हो’
  alternative: ‘उनके परिश्रम का फल तुम्हें मिला है’
  rationale: वैकल्पिक वाक्य अर्थ को केवल परिणाम या लाभ तक सीमित कर सकता है, जबकि यूनानी पाठ स्वयं उनके ‘परिश्रम’ में प्रवेश करने की बात कहता है। मुख्य पाठ सहभागिता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और बोलचाल में समझ आने वाला रूप अपनाया गया है। ‘फसल काटना’ कृषि-रूपक को स्पष्ट रखता है, जबकि ‘परिश्रम में शामिल होना’ अत्यधिक शाब्दिक और अस्वाभाविक हिन्दी से बचते हुए मूल भाव तथा उसकी व्याख्यात्मक खुली जगह को सुरक्षित रखता है।
