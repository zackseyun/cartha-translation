  text: ὡς οὖν ἦλθον πρὸς αὐτὸν οἱ Σαμαρῖται, ἠρώτων αὐτὸν μεῖναι παρ’ αὐτοῖς· καὶ ἔμεινεν ἐκεῖ δύο ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/040.yaml
  text: So when the Samaritans came to him[a], they asked him to stay with them, and he stayed there two days.
translation:
  language: hi
  text: इसलिए जब सामरी लोग उसके पास आए, तो वे उससे अनुरोध करते रहे[a] कि वह उनके यहाँ ठहरे; और वह वहाँ दो दिन रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने उससे अनुरोध किया।” यूनानी अपूर्ण काल से अनुरोध के जारी रहने या बार-बार किए जाने का संकेत मिल सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς οὖν
  choice: इसलिए जब
  rationale: ὡς के कालवाचक अर्थ और οὖν के प्रसंग-संबंधी निष्कर्षात्मक/क्रमिक बल—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἦλθον πρὸς αὐτὸν
  choice: उसके पास आए
  rationale: πρός के साथ व्यक्ति की ओर आकर उसके निकट पहुँचने का सीधा और स्वाभाविक अनुवाद।
- source_word: οἱ Σαμαρῖται
  choice: सामरी लोग
  rationale: जातीय समुदाय का स्पष्ट, तटस्थ और आधुनिक हिन्दी में सहज पद।
- source_word: ἠρώτων
  choice: अनुरोध करते रहे
  rationale: अपूर्ण काल की जारी या बार-बार की गई विनती का पक्ष सुरक्षित रखता है; केवल ‘अनुरोध किया’ से अधिक पक्ष-संवेदी है।
- source_word: μεῖναι παρ’ αὐτοῖς
  choice: कि वह उनके यहाँ ठहरे
  rationale: μένω के ‘ठहरना’ और παρά के उनके साथ/उनके स्थान पर रहने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ ἔμεινεν ἐκεῖ
  choice: और वह वहाँ ... रहा
  rationale: ἐκεῖ को स्पष्ट रूप से ‘वहाँ’ और μένω को प्रसंगानुकूल ‘रहा’ से व्यक्त करता है।
- source_word: δύο ἡμέρας
  choice: दो दिन
  rationale: अवधि सूचक कर्मकारक का सीधा और स्वाभाविक हिन्दी रूप।
