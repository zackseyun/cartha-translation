source:
  edition: SBLGNT
  text: ἀλλὰ ἔρχεται ὥρα καὶ νῦν ἐστιν, ὅτε οἱ ἀληθινοὶ προσκυνηταὶ προσκυνήσουσιν τῷ πατρὶ ἐν πνεύματι καὶ ἀληθείᾳ, καὶ γὰρ ὁ πατὴρ τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/023.yaml
  text: But an hour is coming[a], and is now here, when the true worshipers will worship the Father in spirit and truth; for the Father indeed seeks such people to worship him.
translation:
  language: hi
  text: लेकिन वह समय आ रहा है, और अब आ पहुँचा है, जब सच्चे उपासक आत्मा[a] और सच्चाई में पिता की उपासना करेंगे; क्योंकि पिता भी ऐसे लोगों को खोजता है जो उसकी उपासना करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र आत्मा में”; यूनानी पद का अर्थ पवित्र आत्मा से सामर्थ्य पाकर की गई उपासना, मनुष्य की आत्मा में की गई उपासना, या आत्मिक वास्तविकता से युक्त उपासना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: पिछले पदों में उपासना के स्थान पर हुई चर्चा से स्पष्ट विरोध दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔρχεται ὥρα
  choice: वह समय आ रहा है
  rationale: यूहन्ना में ὥρα का विशेष काल-सूचक भाव बनाए रखते हुए हिन्दी में 'समय' अधिक सहज है; प्रसंग में निर्दिष्ट आगामी समय होने के कारण 'वह' स्वाभाविक है।
- source_word: καὶ νῦν ἐστιν
  choice: बल्कि अब आ पहुँचा है
  rationale: अपेक्षित समय के वर्तमान में आरम्भ हो जाने का साकार भाव स्पष्ट करता है; καί यहाँ पहले कथन को और तीखा करता है।
- source_word: οἱ ἀληθινοὶ προσκυνηταὶ
  choice: सच्चे उपासक
  rationale: ἀληθινοί के वास्तविक और प्रामाणिक होने के यूहन्नाई भाव को बिना किसी साम्प्रदायिक सीमा के व्यक्त करता है।
- source_word: προσκυνήσουσιν τῷ πατρὶ
  choice: पिता की उपासना करेंगे
  rationale: भविष्यकाल और पिता की ओर निर्देशित उपासना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν πνεύματι καὶ ἀληθείᾳ
  choice: आत्मा और सच्चाई में
  rationale: ἐν दोनों संज्ञाओं पर लागू है। 'आत्मा' मूल यूनानी की अस्पष्टता को बनाए रखता है, जबकि 'सच्चाई' ἀλήθεια को संज्ञा के रूप में सुरक्षित रखती है।
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: कारणसूचक सम्बन्ध स्पष्ट करता है; अगले 'ऐसे ही' में καί का बल स्वाभाविक रूप से व्यक्त होता है।
- source_word: τοιούτους ζητεῖ τοὺς προσκυνοῦντας αὐτόν
  choice: ऐसे ही उपासकों को खोजता है जो उसकी उपासना करें
  rationale: τοιούτους की प्रकार-सूचक और बलात्मक शक्ति तथा वर्तमान ζητεῖ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐν πνεύματι का आशय
  choice: मुख्य पाठ में 'आत्मा में', बिना यह निश्चित किए कि आशय पवित्र आत्मा है या मनुष्य की आत्मा।
  alternative: पवित्र आत्मा में; आत्मिक रीति से
  rationale: अनुच्छेदविहीन यूनानी पद पवित्र आत्मा द्वारा समर्थित उपासना, मनुष्य की आत्मा में उपासना, अथवा आत्मिक वास्तविकता से युक्त उपासना का संकेत दे सकता है। अनुवाद इस सार्थक अस्पष्टता को नहीं सुलझाता।
- issue: '''सच्चे उपासक'' का दायरा'
  choice: वास्तविक या प्रामाणिक उपासकों के गुणात्मक अर्थ में।
  alternative: वास्तविक उपासक; खरे उपासक
  rationale: यह स्थान-आधारित उपासना के विपरीत परमेश्वर की वास्तविकता के अनुरूप उपासना का यूहन्नाई भेद बनाए रखता है, पर किसी सम्प्रदाय विशेष का अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण धार्मिक गद्य। 'समय' सामान्य पाठक के लिए 'घड़ी' से अधिक स्पष्ट है। वाक्य की व्याख्यात्मक गति और मूल का भविष्य-वर्तमान तनाव बनाए रखा गया है।
