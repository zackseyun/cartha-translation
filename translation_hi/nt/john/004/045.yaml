- source_word: ἦλθεν εἰς τὴν Γαλιλαίαν
  choice: वह गलील में आया
  rationale: εἰς क्षेत्र में प्रवेश की दिशा बताता है; हिन्दी में ‘गलील में आया’ स्वाभाविक रूप से यही अर्थ देता है।
- source_word: ἐδέξαντο αὐτὸν
  choice: उसका स्वागत किया
  rationale: δέχομαι यहाँ अनुकूल सामाजिक ग्रहण को व्यक्त करता है; ‘स्वागत किया’ संदर्भानुकूल है, जबकि ‘ग्रहण किया’ भी संभव है।
- source_word: οἱ Γαλιλαῖοι
  choice: गलीलवासियों
  rationale: यह गलील के लोगों के लिए संक्षिप्त, स्पष्ट और आधुनिक हिन्दी पद है।
- source_word: πάντα ἑωρακότες ὅσα
  choice: क्योंकि उन्होंने वह सब देखा था जो
  rationale: पूर्ण कृदन्त पूर्व में देखी गई घटनाओं की वर्तमान प्रसंग में प्रासंगिकता देता है; यहाँ उसका कारणात्मक संबंध हिन्दी में स्पष्ट और स्वाभाविक किया गया है।
- source_word: ἐποίησεν
  choice: उसने ... किया था
  rationale: ‘किया था’ स्वागत से पहले पर्व के समय किए गए कार्यों का कालक्रम स्पष्ट करता है।
- source_word: ἐν Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: स्थानवाचक वाक्यांश का मानक हिन्दी रूप।
- source_word: ἐν τῇ ἑορτῇ
  choice: पर्व के समय
  rationale: ἑορτή धार्मिक उत्सव को दर्शाता है; ‘पर्व के समय’ उसका अवसर और समय दोनों सहज रूप से व्यक्त करता है।
- source_word: καὶ αὐτοὶ γὰρ
  choice: वे भी
  rationale: γάρ का कारणात्मक अर्थ पिछले ‘क्योंकि’ वाले खंड में समाहित है और αὐτοὶ καί का समावेशी बल ‘वे भी’ में सुरक्षित है।
- source_word: ἦλθον εἰς τὴν ἑορτήν
  choice: उस पर्व में गए थे
  rationale: यह यरूशलेम के पर्व में उनकी पूर्व उपस्थिति बताता है; भूतपूर्ण रूप घटनाक्रम स्पष्ट करता है।
