base_translation:
  language: en
  yaml_path: translation/nt/john/004/045.yaml
  text: So when he came into Galilee[a], the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast[b], for they too had gone to the feast.
translation:
  language: hi
  text: इसलिए जब वह गलील में आया, तो गलीलवासियों ने उसका स्वागत किया[a]। उन्होंने वह सब देखा था जो उसने यरूशलेम में पर्व[b] के समय किया था, क्योंकि वे भी उस पर्व में गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसे ग्रहण किया।’ यूनानी क्रिया का अर्थ ‘ग्रहण करना’ या ‘स्वागत करना’ हो सकता है; यहाँ संदर्भ अनुकूल स्वागत की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उत्सव।’ यूनानी शब्द धार्मिक पर्व या उत्सव के लिए प्रयुक्त होता है। आसपास के संदर्भ में संभवतः यरूशलेम में मनाया जाने वाला वह पर्व अभिप्रेत है जिसमें लोग यात्रा करके जाते थे।
    reason: cultural_note
lexical_decisions:
- source_word: ὅτε οὖν
