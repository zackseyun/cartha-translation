source:
  edition: SBLGNT
  text: ὃς δ’ ἂν πίῃ ἐκ τοῦ ὕδατος οὗ ἐγὼ δώσω αὐτῷ, οὐ μὴ ⸀διψήσει εἰς τὸν αἰῶνα, ἀλλὰ τὸ ὕδωρ ὃ δώσω αὐτῷ γενήσεται ἐν αὐτῷ πηγὴ ὕδατος ἁλλομένου εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/014.yaml
  text: But whoever drinks from the water that I will give him will never thirst forever; rather, the water that I will give him will become in him a spring of water welling up to eternal life.
translation:
  language: hi
  text: पर जो कोई उस पानी में से पीता है जो मैं उसे दूँगा, वह फिर कभी प्यासा नहीं होगा; बल्कि जो पानी मैं उसे दूँगा, वह उसके भीतर अनन्त जीवन की ओर उमड़ते हुए पानी का एक सोता बन जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μὴ διψήσει εἰς τὸν αἰῶνα
  choice: वह सदा तक कभी प्यासा न होगा
  rationale: οὐ μή की प्रबल निषेधात्मकता और εἰς τὸν αἰῶνα के कालगत बल, दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: πηγὴ ὕδατος
  choice: पानी का ऐसा सोता
  rationale: πηγή यहाँ भीतर से निकलते जीवंत जलस्रोत या सोते को दर्शाता है; ‘सोता’ साधारण पाठक के लिए स्वाभाविक है।
- source_word: ἁλλομένου
  choice: उमड़ता रहेगा
  rationale: क्रिया के उछलने, फूटने या प्रबलता से ऊपर आने के गतिशील भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς के लक्ष्य अथवा परिणति-सूचक खुलेपन को बनाए रखता है, बिना उसे केवल ‘देने वाला’ या ‘पहुँचाने वाला’ अर्थ तक सीमित किए।
theological_decisions:
- issue: प्यास फिर कभी न लगने के कथन की प्रबलता
  choice: सदा तक कभी प्यासा न होगा
  alternative: फिर कभी प्यासा न होगा
  rationale: मूल में οὐ μή के साथ εἰς τὸν αἰῶνα भी स्पष्ट है; इसलिए निषेध और कालगत बल दोनों सुरक्षित रखे गए हैं।
- issue: सोते और अनन्त जीवन का संबंध
  choice: अनन्त जीवन के लिए उमड़ता रहेगा
  alternative: अनन्त जीवन देने के लिए उमड़ता रहेगा
  rationale: मूल εἰς लक्ष्य, दिशा या परिणति बता सकता है; ‘देने के लिए’ कहना कारणात्मक अर्थ को मूल से अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सामान्य पाठक के लिए सहज शैली। ‘परन्तु’ और ‘बल्कि’ से यूनानी δέ तथा ἀλλά का विरोधात्मक संबंध रखा गया है; ‘उमड़ता रहेगा’ सतत, जीवंत गति को स्वाभाविक रूप से व्यक्त करता है।
