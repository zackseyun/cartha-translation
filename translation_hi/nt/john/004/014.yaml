revisions:
- from: परन्तु जो कोई उस पानी में से पिएगा जो मैं उसे दूँगा, वह सदा तक कभी प्यासा न होगा; बल्कि जो पानी मैं उसे दूँगा, वह उसके भीतर पानी का ऐसा सोता बन जाएगा जो अनन्त जीवन के लिए उमड़ता रहेगा।
  to: पर जो कोई उस पानी में से पीता है जो मैं उसे दूँगा, वह फिर कभी प्यासा नहीं होगा; बल्कि जो पानी मैं उसे दूँगा, वह उसके भीतर अनन्त जीवन की ओर उमड़ते हुए पानी का एक सोता बन जाएगा।
  rationale: The revision retains the source’s generic construction, strong permanent denial of thirst, inner-spring imagery, and the dynamic participle ἁλλομένου. It replaces an unnatural Hindi expression with idiomatic modern usage and renders εἰς ζωὴν αἰώνιον directionally rather than as a narrowly purposive phrase.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T21:50:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the contrast, the water given by Jesus, the emphatic permanent negation of thirst, and the water becoming an inner spring. However, “सदा तक कभी” is not idiomatic Hindi, and “अनन्त जीवन के लिए” somewhat weakens εἰς, which here more naturally denotes movement/direction toward eternal life.
  naturalness: “वह सदा तक कभी प्यासा न होगा” is grammatically understandable but awkward and redundant in modern standard Hindi. “फिर कभी प्यासा नहीं होगा” is idiomatic and preserves the emphatic sense in context. Recasting the final participial phrase also gives a more natural Hindi sentence.
  terminology: “सोता” is an appropriate, accessible rendering of πηγή. “अनन्त जीवन” suitably renders ζωὴ αἰώνιος. “अनन्त जीवन की ओर” preserves the directional/resultative openness of εἰς without adding a more specific causal sense.
  issues:
  - severity: medium
    issue: Awkward emphatic negation
    rationale: “सदा तक कभी प्यासा न होगा” combines temporal and negative adverbs in a way that is unnatural in contemporary Hindi. “फिर कभी प्यासा नहीं होगा” communicates οὐ μὴ … εἰς τὸν αἰῶνα naturally and clearly.
  - severity: low
    issue: Directional force of εἰς ζωὴν αἰώνιον
    rationale: “अनन्त जीवन के लिए” is possible, but can sound purposive. “अनन्त जीवन की ओर” more directly retains the source phrase’s directional/resultative sense.
  revised_text: पर जो कोई उस पानी में से पीता है जो मैं उसे दूँगा, वह फिर कभी प्यासा नहीं होगा; बल्कि जो पानी मैं उसे दूँगा, वह उसके भीतर अनन्त जीवन की ओर उमड़ते हुए पानी का एक सोता बन जाएगा।
  revised_footnotes: []
  revision_rationale: The revision retains the source’s generic construction, strong permanent denial of thirst, inner-spring imagery, and the dynamic participle ἁλλομένου. It replaces an unnatural Hindi expression with idiomatic modern usage and renders εἰς ζωὴν αἰώνιον directionally rather than as a narrowly purposive phrase.
