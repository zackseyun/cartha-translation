  text: तब वह स्त्री अपना पानी का घड़ा छोड़कर नगर में गई और लोगों से कहती है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑδρία
  choice: पानी का घड़ा
  rationale: यह पानी रखने या भरने के पात्र को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πόλις
  choice: नगर
  rationale: यूनानी शब्द बस्ती/नगर को दर्शाता है; संदर्भ में ‘नगर’ संक्षिप्त और प्रतिष्ठित रूप है।
- source_word: ἄνθρωποι
  choice: लोग
  rationale: बहुवचन का सामान्य, समावेशी अर्थ यहाँ ‘लोग’ से स्वाभाविक रूप में आता है।
- source_word: λέγει
  choice: कहती है
  rationale: स्रोत में ऐतिहासिक वर्तमान काल है; हिन्दी में वर्तमान काल रखकर कथन की जीवंतता और मूल की कालगत विशेषता सुरक्षित की गई है।
theological_decisions:
- issue: ऐतिहासिक वर्तमान λέγει का अनुवाद
  choice: कहती है
  alternative: कहा
  rationale: यह कोई सिद्धान्तगत व्याख्या नहीं जोड़ता और मूल पाठ के वर्तमान काल को यथासंभव प्रत्यक्ष रूप से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘वहीं’ से घड़ा पीछे छोड़ देने का आशय स्पष्ट होता है, बिना कोई अतिरिक्त कारण बताए।
