id: JHN.4.36
reference: John 4:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ὁ θερίζων μισθὸν λαμβάνει καὶ συνάγει καρπὸν εἰς ζωὴν αἰώνιον, ⸀ἵνα ὁ σπείρων ὁμοῦ χαίρῃ καὶ ὁ θερίζων.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/036.yaml
  text: The one who reaps is receiving wages and gathering fruit for eternal life[b][a], so that the one who sows and the one who reaps may rejoice together.
translation:
  language: hi
  text: जो काटता है, वह मजदूरी[a] पाता और अनन्त जीवन के लिए[b] फल बटोरता है, ताकि बोनेवाला और काटनेवाला दोनों मिलकर आनन्द मनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिफल।” यूनानी शब्द काम की मजदूरी अथवा मिलने वाले प्रतिफल—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अनन्त जीवन की ओर” अथवा “अनन्त जीवन में।” यह वाक्यांश लक्ष्य, दिशा या परिणाम व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ θερίζων
  choice: जो काटता है
  rationale: यह विशेषणवत् प्रयुक्त वर्तमान कृदन्त है। यह रूप कटनी के रूपक और चल रही क्रिया—दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: μισθὸν
  choice: मजदूरी
  rationale: शब्द का अर्थ मजदूरी, वेतन या प्रतिफल हो सकता है। ‘मजदूरी’ खेत में काम करने की ठोस छवि बनाए रखती है; ‘प्रतिफल’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: λαμβάνει
  choice: पाता है
  rationale: वर्तमानकालीन क्रिया को स्वाभाविक हिन्दी में सामान्य वर्तमान से व्यक्त किया गया है। ‘पा रहा है’ सम्भव है, पर यहाँ संयुक्त वाक्य में ‘पाता और…बटोरता है’ अधिक सहज है।
- source_word: συνάγει
  choice: बटोरता है
  rationale: यह इकट्ठा करने की क्रिया बताता है। ‘बटोरता है’ कटनी के प्रसंग में स्वाभाविक है और θερίζων से भिन्न क्रिया को स्पष्ट रखता है।
- source_word: καρπὸν
  choice: फल
  rationale: ‘फल’ मूल रूपक की व्यापकता को सुरक्षित रखता है; ‘फसल’ कहने से काटने और बटोरे जाने वाले फल के बीच का भेद धुँधला पड़ सकता है।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς लक्ष्य, दिशा या परिणाम व्यक्त कर सकता है। ‘के लिए’ स्वाभाविक हिन्दी है, जबकि ‘अनन्त जीवन तक/में’ को पादटिप्पणी में सम्भावित अर्थ के रूप में रखा गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम की ध्वनि को बिना अनावश्यक रूप से निश्चित किए व्यक्त करता है।
- source_word: ὁ σπείρων
  choice: बोनेवाला
  rationale: यह विशेषणवत् प्रयुक्त वर्तमान कृदन्त है। हिन्दी में प्रचलित संज्ञात्मक रूप समानान्तरता और स्पष्टता देता है।
- source_word: ὁμοῦ
  choice: दोनों मिलकर
  rationale: ‘मिलकर’ साझा आनन्द को स्वाभाविक रूप से व्यक्त करता है; ‘दोनों’ जोड़ने से बोनेवाले और काटनेवाले की सहभागिता स्पष्ट होती है।
- source_word: χαίρῃ
  choice: आनन्द मनाएँ
  rationale: ἵνα के बाद के वर्तमान संभावनार्थक रूप को ‘मनाएँ’ व्यक्त करता है और उत्सवपूर्ण अर्थ बनाए रखता है।
theological_decisions:
- issue: εἰς ζωὴν αἰώνιον का सम्बन्ध और अर्थ
  choice: ‘अनन्त जीवन के लिए’—फल बटोरने के लक्ष्य या परिणाम के रूप में
  alternative: ‘अनन्त जीवन तक/में’—दिशा या परिणति पर अधिक बल
  rationale: यूनानी पूर्वसर्ग लक्ष्य और परिणाम दोनों की गुंजाइश रखता है। मुख्य पाठ में सहज, व्यापक अभिव्यक्ति रखी गई है और वैकल्पिक सूक्ष्मता पादटिप्पणी में दी गई है।
- issue: वर्तमानकालीन क्रियाओं की प्रगतिशीलता
  choice: 'स्वाभाविक हिन्दी सामान्य वर्तमान: ‘पाता और…बटोरता है’'
  alternative: ‘पा रहा और…बटोर रहा है’ द्वारा तत्काल चल रही क्रिया पर स्पष्ट बल
  rationale: यूनानी वर्तमान चल रही या वर्तमानतः सत्य क्रिया व्यक्त कर सकता है। हिन्दी सामान्य वर्तमान यहाँ उसी अर्थ को सहजता से वहन करता है; प्रगतिशील रूप अनावश्यक रूप से कालगत बल बढ़ा सकता है।
- issue: मुख्य पाठ में ‘अभी से/पहले ही’ जोड़ना
  choice: कोई अतिरिक्त कालवाचक क्रियाविशेषण नहीं जोड़ा
  alternative: प्रसंग के आधार पर ‘अभी से’ या ‘पहले ही’ जोड़ना
  rationale: इस पद के उपलब्ध यूनानी पाठ में उसके लिए अलग शब्द नहीं है। प्रसंग वर्तमान कटनी की ओर संकेत करता है, पर अनुवाद में अप्रकट तत्व जोड़ना आवश्यक नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कृषि-रूपक को ‘काटता’, ‘मजदूरी’, ‘फल’ और ‘बटोरता’ द्वारा सुरक्षित रखा गया है। ‘बोनेवाला’ और ‘काटनेवाला’ सामान्य हिन्दी के स्वाभाविक संज्ञात्मक रूप हैं।
