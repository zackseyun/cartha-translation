source:
  edition: SBLGNT
  text: ἔγνω οὖν ὁ πατὴρ ⸀ὅτι ἐκείνῃ τῇ ὥρᾳ ἐν ᾗ εἶπεν αὐτῷ ὁ ⸀Ἰησοῦς· Ὁ υἱός σου ζῇ, καὶ ἐπίστευσεν αὐτὸς καὶ ἡ οἰκία αὐτοῦ ὅλη.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/053.yaml
  text: So the father knew that it was at that hour when Jesus said to him[a], “Your son lives,” and he himself believed[b], and his whole household.
translation:
  language: hi
  text: इसलिए पिता जान गया कि वही घड़ी थी जब यीशु ने उससे कहा था, “तुम्हारा बेटा जीवित है।” और उसने स्वयं विश्वास किया[a], और उसके पूरे घराने ने भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “विश्वास किया” का अर्थ विशेष रूप से यीशु के वचन पर विश्वास करना भी हो सकता है, या यीशु में अधिक पूर्ण रूप से विश्वास करना; यूनानी पाठ इसका दायरा स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔγνω
  choice: जान गया
  rationale: यहाँ अओरिस्ट क्रिया पिता के उस पहचान लेने को व्यक्त करती है कि सेवकों द्वारा बताई गई घड़ी यीशु के वचन की घड़ी ही थी।
- source_word: οὖν
  choice: तब
  rationale: यह पिछले पद में सेवकों की सूचना से निकलने वाले निष्कर्ष और कथा की अगली प्रगति, दोनों को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ἐκείνῃ τῇ ὥρᾳ
  choice: ठीक उसी घड़ी
  rationale: विशिष्ट समय के मेल को स्पष्ट करता है; 'ठीक' सन्दर्भ में पहचाने गए सटीक सामंजस्य को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: Ὁ υἱός σου ζῇ
  choice: तुम्हारा बेटा जीवित है
  rationale: वर्तमान काल ζῇ को वर्तमान जीवित अवस्था के कथन के रूप में व्यक्त करता है; हिन्दी में यह 'तुम्हारा बेटा जीता है' से अधिक स्वाभाविक है।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: πιστεύω का सामान्य और धर्मवैज्ञानिक रूप से खुला अनुवाद है; यह विश्वास के सटीक दायरे को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: αὐτὸς
  choice: उसने स्वयं
  rationale: स्पष्ट सर्वनाम के बल को बनाए रखता है और पिता के अपने विश्वास को उसके घराने की प्रतिक्रिया से अलग उभारता है।
- source_word: ἡ οἰκία αὐτοῦ ὅλη
  choice: उसके सारे घराने ने भी
  rationale: οἰκία यहाँ भवन नहीं, घराने के लोगों को दर्शाता है; 'सारे' ὅλη की समग्रता और 'भी' संयुक्त कर्ता की हिन्दी अभिव्यक्ति स्पष्ट करता है।
theological_decisions:
- issue: पिता के विश्वास का आशय
  choice: मुख्य पाठ केवल यह कहता है कि उसने विश्वास किया।
  alternative: उसने केवल यीशु के चंगाई के वचन पर विश्वास किया, अथवा इस क्षण यीशु में अधिक पूर्ण विश्वास पाया।
  rationale: यूहन्ना में πιστεύω का गहरा धर्मवैज्ञानिक अर्थ हो सकता है, पर इस पद में विश्वास का पूरा दायरा स्पष्ट नहीं किया गया; इसलिए अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। 'जीवित है' स्वाभाविक हिन्दी होने के कारण अलग शाब्दिक-विकल्प टिप्पणी आवश्यक नहीं मानी गई। मुख्य पाठ में [a] चिह्न विश्वास की वास्तविक अर्थगत अस्पष्टता पर लगाया गया है।
