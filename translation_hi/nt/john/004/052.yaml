  text: ἐπύθετο οὖν ⸂τὴν ὥραν παρ’ αὐτῶν⸃ ἐν ᾗ κομψότερον ἔσχεν· ⸂εἶπαν οὖν⸃ αὐτῷ ὅτι ⸀Ἐχθὲς ὥραν ἑβδόμην ἀφῆκεν αὐτὸν ὁ πυρετός.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/052.yaml
  text: So he asked them the hour in which he got better. Then they said to him[a], “Yesterday at the seventh hour the fever left him.”
translation:
  language: hi
  text: इसलिए उसने उनसे उस घड़ी के बारे में पूछा जब उसकी हालत सुधरने लगी थी। उन्होंने उससे कहा,[a] “कल सातवीं घड़ी में उसका बुखार उतर गया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यदि समय सूर्योदय से गिना जाए, तो ‘सातवीं घड़ी’ का अर्थ लगभग दोपहर एक बजे हो सकता है; कुछ लोग यूहन्ना की समय-गणना को अलग ढंग से समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπύθετο οὖν
  choice: इसलिए उसने ... पूछा
  rationale: ἐπύθετο का अर्थ पूछना या जानकारी लेना है, और οὖν पिछले कथन से निष्कर्षात्मक कथात्मक संबंध जोड़ता है।
- source_word: τὴν ὥραν παρ’ αὐτῶν
  choice: उनसे पूछा कि ... किस घड़ी
  rationale: παρ’ αὐτῶν सूचना के स्रोत को व्यक्त करता है; हिंदी में ‘उनसे पूछा’ स्वाभाविक है। ὥρα को ‘घड़ी’ रखकर आगे के समय-सूचक उत्तर से संबंध बनाए रखा गया है।
- source_word: ἐν ᾗ κομψότερον ἔσχεν
  choice: वह किस घड़ी से ठीक होने लगा था
  rationale: कोमψότερον ἔσχεν स्वास्थ्य की स्थिति सुधरने को दर्शाता है। ‘ठीक होने लगा’ सुधार के आरंभ का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἶπαν οὖν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: उत्तर देने की अगली कथात्मक क्रिया को सरल और स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: Ἐχθὲς ὥραν ἑβδόμην
  choice: कल सातवीं घड़ी में
  rationale: मूल पाठ समय-गणना की पद्धति निर्दिष्ट नहीं करता; इसलिए आधुनिक समय में बदलने के बजाय शाब्दिक समय-सूचक अभिव्यक्ति रखी गई है।
- source_word: ἀφῆκεν αὐτὸν ὁ πυρετός
  choice: उसका बुखार उतर गया था
  rationale: यद्यपि यूनानी संरचना शाब्दिक रूप से ‘बुखार ने उसे छोड़ दिया’ है, हिंदी में बीमारी के समाप्त होने के लिए ‘बुखार उतर गया’ सर्वाधिक स्वाभाविक और अर्थ-संगत है।
theological_decisions:
- issue: ‘सातवीं घड़ी’ की समय-गणना
  choice: मुख्य पाठ में ‘सातवीं घड़ी’ को बिना आधुनिक समय में बदले रखा गया है।
  alternative: यदि सूर्योदय से गिना जाए तो लगभग दोपहर एक बजे; कुछ लोग यूहन्ना की समय-गणना को अलग ढंग से समझते हैं।
  rationale: मूल पद स्वयं समय-गणना की प्रणाली नहीं बताता। शाब्दिक अभिव्यक्ति पाठ की वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘घड़ी’ बाइबिलीय समय-सूचक पद को सुरक्षित रखती है, जबकि ‘बुखार उतर गया’ सामान्य पाठक के लिए स्वाभाविक हिंदी है।
