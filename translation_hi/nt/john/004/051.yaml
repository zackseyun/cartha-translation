source:
  edition: SBLGNT
  text: ἤδη δὲ αὐτοῦ καταβαίνοντος οἱ δοῦλοι αὐτοῦ ⸀ὑπήντησαν ⸀αὐτῷ λέγοντες ὅτι ὁ παῖς ⸀αὐτοῦ ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/051.yaml
  text: And while he was already going down[a], his servants met him, saying that his child was alive.
translation:
  language: hi
  text: जब वह पहले ही नीचे उतर रहा था, तो उसके दास उससे मिले और कहने लगे, “आपका बच्चा जीवित है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपका पुत्र।” यूनानी शब्द पाइस का अर्थ “बच्चा,” “लड़का,” या कुछ संदर्भों में “दास” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤδη
  choice: रास्ते में ही
  rationale: ἤδη बताता है कि भेंट होने तक उतरने की यात्रा आरंभ हो चुकी थी। हिंदी में ‘उतरते हुए रास्ते में ही’ इस प्रगतिशील क्रिया और समय-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है; ‘तब’ प्रसंग को आगे बढ़ाता है, बिना किसी प्रबल विरोध का भाव जोड़े।
- source_word: καταβαίνοντος
  choice: उतरते हुए
  rationale: वर्तमान कृदंत वाली संबंधवाचक रचना समकालीन और जारी क्रिया दिखाती है। काना से कफरनहूम की ओर भौगोलिक उतराई के लिए ‘उतरते हुए’ स्वाभाविक है।
- source_word: δοῦλοι
  choice: दास
  rationale: यह घर के मुखिया के अधिकाराधीन बंधुआ घरेलू जनों को सूचित करता है। ‘दास’ मूल सामाजिक वास्तविकता को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से रखता है।
- source_word: ὑπήντησαν αὐτῷ
  choice: उससे आ मिले
  rationale: क्रिया में किसी से मिलने, प्रायः उसकी ओर जाकर मिलने, का भाव है। ‘आ मिले’ उस दिशा-सूचक भाव को सहज हिंदी में बनाए रखता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: कृदंत भेंट के साथ घटने वाली कथन-क्रिया को व्यक्त करता है; हिंदी कथानक में ‘और कहने लगे’ इसका स्वाभाविक रूप है।
- source_word: παῖς
  choice: बच्चा
  rationale: παῖς का अर्थ बच्चा, लड़का अथवा कुछ संदर्भों में दास हो सकता है। इस प्रसंग में पारिवारिक संदर्भ स्पष्ट है, पर शब्द स्वयं ‘पुत्र’ जितना विशिष्ट नहीं; इसलिए ‘बच्चा’ उसकी व्यापकता बचाता है।
- source_word: ζῇ
  choice: जीवित है
  rationale: वर्तमान काल का सीधा अर्थ ‘जीवित है’ है। प्रत्यक्ष कथन के रूप में हिंदी में वर्तमान काल बनाए रखना स्वाभाविक और मूल के अधिक निकट है; ‘ठीक हो गया’ अनावश्यक व्याख्या जोड़ता।
theological_decisions:
- issue: चंगाई के वृत्तांत में παῖς का संदर्भ
  choice: आपका बच्चा
  alternative: आपका पुत्र; आपका दास
  rationale: यूहन्ना 4 का व्यापक प्रसंग अधिकारी के पुत्र की ओर संकेत करता है, किंतु इस पद में प्रयुक्त παῖς अपने आप में अधिक व्यापक है। मुख्य पाठ में ‘बच्चा’ मूल शब्द की अनिश्चितता को यथासंभव सुरक्षित रखता है, और पादटिप्पणी ‘पुत्र’ की संदर्भगत संभावना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज कथात्मक हिंदी। अधिकारी के प्रति उसके दासों के संबोधन में सम्मानसूचक ‘आपका’ रखा गया है। ‘दास’ प्राचीन घरेलू सामाजिक संबंध को नरम किए बिना व्यक्त करता है।
