source:
  edition: SBLGNT
  text: λέγει αὐτῷ ⸂ἡ γυνή⸃· Κύριε, οὔτε ἄντλημα ἔχεις καὶ τὸ φρέαρ ἐστὶν βαθύ· πόθεν οὖν ἔχεις τὸ ὕδωρ τὸ ζῶν;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/011.yaml
  text: The woman said to him[a], “Lord, you have neither a bucket nor is the well deep[b]. So where do you get the living water?”
translation:
  language: hi
  text: स्त्री ने उससे कहा, “महोदय[a], आपके पास पानी खींचने का कोई पात्र भी नहीं है, और कुआँ गहरा है। तो फिर आपको यह जीवित जल[b] कहाँ से मिलता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु।” यूनानी शब्द κύριε सम्मानपूर्वक संबोधित करने के लिए प्रयुक्त हो सकता है और प्रसंग के अनुसार उसका अर्थ “महोदय” या “प्रभु” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “बहता हुआ जल,” अर्थात ठहरे हुए पानी के विपरीत ताज़ा, बहता पानी। “जीवित जल” यीशु के कथन में निहित गहरे अर्थ को भी बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει αὐτῷ ἡ γυνή
  choice: स्त्री ने उससे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी की कथात्मक शैली में सामान्य भूतकाल अधिक स्वाभाविक है। ἡ γυνή यहाँ कुएँ पर उपस्थित स्त्री को दर्शाता है।
- source_word: Κύριε
  choice: महोदय
  rationale: इस संवाद के चरण में यह सम्मानसूचक संबोधन है। ‘महोदय’ स्त्री की ओर से यीशु को प्रभु के रूप में पहचान लेने का भाव अनावश्यक रूप से नहीं जोड़ता; ‘प्रभु’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: οὔτε ἄντλημα ἔχεις
  choice: आपके पास पानी खींचने का कोई बरतन भी नहीं है
  rationale: ἄντλημα पानी निकालने के साधन या पात्र को दर्शाता है। ‘पानी खींचने का बरतन’ दृश्य को सामान्य पाठक के लिए स्पष्ट करता है, जबकि οὔτε का बल ‘भी नहीं’ से व्यक्त होता है।
- source_word: τὸ φρέαρ ἐστὶν βαθύ
  choice: कुआँ गहरा है
  rationale: φρέαρ इस प्रसंग में कुआँ है और βαθύ का सीधा अर्थ ‘गहरा’ है; ‘बहुत’ जोड़ना मूल से अधिक कहना होता।
- source_word: πόθεν οὖν ἔχεις
  choice: तो फिर … आपके पास कहाँ से आया?
  rationale: πόθεν स्रोत पूछता है और οὖν पिछले कथन से निष्कर्ष जोड़ता है। हिन्दी में यह रूप स्वाभाविक ढंग से पूछता है कि ऐसा जल उसे कहाँ से प्राप्त हुआ।
- source_word: τὸ ὕδωρ τὸ ζῶν
  choice: वह जीवित जल
  rationale: ‘जीवित जल’ यूनानी अभिव्यक्ति को बनाए रखता है और यूहन्ना के वर्णन में उसके साधारण अर्थ ‘बहता हुआ ताज़ा जल’ तथा गहरे अर्थ—दोनों की गुंजाइश सुरक्षित रखता है।
theological_decisions:
- issue: स्त्री द्वारा यीशु को κύριε कहकर संबोधित करना
  choice: महोदय
  alternative: प्रभु
  rationale: κύριε सम्मानसूचक ‘महोदय’ और उपाधि ‘प्रभु’ दोनों हो सकता है। इस आरम्भिक वार्तालाप में सम्मानसूचक अर्थ अधिक स्वाभाविक है, पर दूसरे अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ὕδωρ τὸ ζῶν का दोहरा अर्थ
  choice: जीवित जल
  alternative: बहता हुआ जल
  rationale: सामान्य यूनानी प्रयोग में यह ताज़े, बहते पानी को सूचित कर सकता है, जबकि यीशु के कथन में इसका गहरा धार्मिक अर्थ भी है। मुख्य पाठ में शब्दशः अभिव्यक्ति दोनों स्तरों के तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और कथात्मक हिन्दी में रखी गई है। ‘बरतन’ सामान्य पाठक के लिए सहज है; ‘महोदय’ औपचारिक होते हुए भी इस सम्मानसूचक संवाद के अनुकूल है।
