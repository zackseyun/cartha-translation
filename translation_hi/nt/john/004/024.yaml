  yaml_path: translation/nt/john/004/024.yaml
  text: God is spirit[b][a], and those who worship him must worship in spirit and truth.
translation:
  language: hi
  text: परमेश्वर आत्मा है[b], और जो उसकी आराधना करते हैं, उन्हें आत्मा और सच्चाई में[a] आराधना करनी ही चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा और सच्चाई में।” यूनानी पदबंध को अधिक विशिष्ट अर्थ में भी समझा जा सकता है, पर मुख्य पाठ उसकी व्यापकता बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: “परमेश्वर आत्मा है” परमेश्वर के स्वभाव को व्यक्त करता है; इसका अर्थ केवल यह नहीं कि परमेश्वर आत्मिक प्राणियों में से एक आत्मा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα
  choice: आत्मा
  rationale: यहाँ वचन परमेश्वर के स्वभाव का गुणात्मक वर्णन करता है; इसका अर्थ यह नहीं कि परमेश्वर अनेक आत्मिक प्राणियों में से एक है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: सविभक्त पदबंध में ὁ θεός कर्ता है; आधुनिक मानक हिन्दी में दिव्य संदर्भ के लिए ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τοὺς προσκυνοῦντας αὐτόν
  choice: जो उसकी आराधना करते हैं
  rationale: लेखयुक्त वर्तमान कृदन्त आराधना करने वालों के वर्ग को दर्शाता है; यह रूप सामान्य और सतत भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: मूल यूनानी में संज्ञा लेखरहित है और ‘सच्चाई’ के साथ जुड़ी है। यह अनुवाद वाक्य की व्यापकता बनाए रखता है, बिना इसे केवल मानवीय मनोभाव या स्पष्टतः केवल पवित्र आत्मा तक सीमित किए।
- source_word: ἀληθείᾳ
  choice: सच्चाई
  rationale: यूहन्ना के प्रयोग में यह तथ्यात्मक सत्य के साथ प्रकट वास्तविकता का भाव भी रख सकता है; ‘सच्चाई’ सामान्य पाठक के लिए सहज है और वाक्य में स्वाभाविक बैठती है।
- source_word: δεῖ προσκυνεῖν
  choice: आराधना करनी चाहिए
  rationale: δεῖ आवश्यकता व्यक्त करता है। हिन्दी में ‘करनी चाहिए’ आवश्यक कर्तव्य का स्वाभाविक रूप है; इसे केवल वैकल्पिक सलाह नहीं समझना चाहिए।
theological_decisions:
- issue: ‘परमेश्वर आत्मा है’ का अर्थ
  choice: परमेश्वर के स्वभाव के विषय में गुणात्मक कथन
  alternative: परमेश्वर एक आत्मा है
  rationale: πνεῦμα लेखरहित विधेय संज्ञा है और ὁ θεός कर्ता है। इसलिए कथन परमेश्वर को आत्माओं की किसी श्रेणी का केवल एक सदस्य बताने के बजाय उसके स्वभाव को व्यक्त करता है।
- issue: ‘आत्मा और सच्चाई में’ का अर्थ
  choice: ऐसी आराधना जिसका स्वरूप आत्मिक और सच्चाई के अनुरूप हो, जबकि पदबंध की व्यापकता बनी रहे
  alternative: पवित्र आत्मा और सच्चाई में; अथवा केवल सच्चे मन से
  rationale: πνεύματι और ἀληθείᾳ दोनों लेखरहित हैं। संदर्भ पवित्र आत्मा से संबंध की संभावना को नकारता नहीं, पर मूल पदबंध उस अर्थ को स्पष्टतः सीमित भी नहीं करता; इसी तरह इसे मात्र ईमानदार भावना तक घटाना भी संकीर्ण होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण धार्मिक शैली। ‘आराधना’ प्रसंगानुकूल और व्यापक रूप से समझा जाने वाला शब्द है। मुख्य पाठ मूल की संक्षिप्तता तथा ‘आत्मा’ संबंधी वास्तविक व्याख्यात्मक अस्पष्टता को सुरक्षित रखता है।
