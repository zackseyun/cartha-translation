  text: καὶ πολλῷ πλείους ἐπίστευσαν διὰ τὸν λόγον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/john/004/041.yaml
  text: And many more believed because of his word[b][a],
translation:
  language: hi
  text: और उसके वचन के कारण और भी बहुत-से लोगों ने विश्वास किया।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं अधिक लोगों ने विश्वास किया।” यूनानी में तुलनात्मक अभिव्यक्ति को विशेष रूप से प्रबल किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके संदेश के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλῷ πλείους
  choice: और भी बहुत-से लोग
  rationale: πολλῷ तुलनात्मक πλείους को प्रबल करता है। यह अनुवाद पिछले पद की तुलना में विश्वास करनेवालों की बड़ी बढ़ोतरी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπίστευσαν
  choice: विश्वास किया
  rationale: यह aorist active indicative का सीधा और प्रसंगानुकूल अनुवाद है। मूल में कोई स्पष्ट कर्म नहीं है, इसलिए ‘उस पर विश्वास किया’ जोड़कर अर्थ को अनावश्यक रूप से नहीं खोला गया।
- source_word: διὰ τὸν λόγον αὐτοῦ
  choice: उसके वचन के कारण
  rationale: Accusative के साथ διά यहाँ कारण बताता है। αὐτοῦ का संकेत निकटवर्ती प्रसंग में यीशु की ओर है।
- source_word: λόγον
  choice: वचन
  rationale: यहाँ λόγος यीशु द्वारा कही गई बात या संदेश को सूचित करता है। ‘वचन’ यूहन्ना के शब्द-प्रयोग की प्रतिध्वनि बनाए रखता है, जबकि पादटिप्पणी में सहज विकल्प ‘संदेश’ दिया गया है।
theological_decisions:
- issue: उद्धार-संबंधी कथा में πιστεύω का अनुवाद
  choice: विश्वास किया
  alternative: उस पर विश्वास किया / विश्वास में आए
  rationale: यूनानी वाक्य केवल ‘विश्वास किया’ कहता है और इस पद में विश्वास का कर्म स्पष्ट नहीं करता। संक्षिप्त रूप मूल की अभिव्यक्ति और उसकी धर्मवैचारिक खुली जगह को सुरक्षित रखता है; संदर्भ से पाठक समझ सकता है कि बात यीशु पर विश्वास की है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली। ‘बहुत-से’ तुलना की वृद्धि को स्पष्ट करता है; ‘वचन’ यूहन्ना की शब्दावली से संबंध बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
