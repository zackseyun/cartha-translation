    rationale: The note should say ‘या, अधिक व्याख्यात्मक रूप में’ and identify the main wording as the more literal rendering. This maintains the intended lexical distinction and accurately reflects the Greek.
  - severity: low
    issue: The phrase ‘पानी को दाखरस बनाया था’ is slightly less idiomatic than necessary.
    rationale: ‘पानी को दाखरस बना दिया था’ remains close to ἐποίησεν τὸ ὕδωρ οἶνον while reading naturally in modern Hindi.
