source:
  edition: SBLGNT
  text: Ἦλθεν οὖν ⸀πάλιν εἰς τὴν Κανὰ τῆς Γαλιλαίας, ὅπου ἐποίησεν τὸ ὕδωρ οἶνον. καὶ ἦν τις βασιλικὸς οὗ ὁ υἱὸς ἠσθένει ἐν Καφαρναούμ.
base_translation:
  language: en
  yaml_path: translation/nt/john/004/046.yaml
  text: So he came again to Cana of Galilee[a], where he had made the water wine[b]. And there was a certain royal official whose son was sick in Capernaum.
translation:
  language: hi
  text: तब वह फिर गलील के काना में आया, जहाँ उसने पानी को दाखरस बना दिया था।[a] वहाँ एक राजकीय अधिकारी[b] था, जिसका बेटा कफरनहूम में बीमार था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “जहाँ उसने पानी को दाखरस में बदल दिया था।” यूनानी में अधिक शाब्दिक रूप से, “जहाँ उसने पानी को दाखरस बना दिया था।”
    reason: lexical_alternative
  - marker: b
    text: या “राजा का अधिकारी,” “दरबारी,” अथवा “कुलीन व्यक्ति।” यूनानी शब्द ऐसे व्यक्ति को दर्शाता है जिसका किसी राजा या राजदरबार से संबंध हो।
    reason: alternative_reading
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक संबंध और परिणामसूचक आगे बढ़ाव को बनाए रखता है; हिन्दी में स्वाभाविक है।
- source_word: πάλιν
  choice: फिर
  rationale: यीशु के काना में दोबारा आने का सीधा और स्वाभाविक संकेत।
- source_word: Κανὰ τῆς Γαλιλαίας
  choice: गलील के काना नगर
  rationale: क्षेत्र-संबंधी यूनानी संबंधकारक को स्वाभाविक हिन्दी में व्यक्त करता है; ‘नगर’ स्थान की पहचान स्पष्ट करता है।
- source_word: ἐποίησεν τὸ ὕδωρ οἶνον
  choice: उसने पानी को दाखरस बनाया था
  rationale: यूनानी की अपेक्षाकृत शाब्दिक रचना ‘पानी को दाखरस बनाया’ को बनाए रखता है और पूर्व घटना के लिए ‘था’ का प्रयोग करता है।
- source_word: τις βασιλικὸς
  choice: एक राजकीय अधिकारी
  rationale: अनाम विशिष्ट व्यक्ति को ‘एक’ से प्रस्तुत करता है और βασιλικός का राजदरबार अथवा शासक की सेवा से संबंध दिखाता है, बिना उसके निश्चित पद या कुलीन सामाजिक दर्जे का दावा किए।
- source_word: υἱὸς
  choice: बेटा
  rationale: मूल पाठ पुत्र को स्पष्ट रूप से पुरुष संतान बताता है; ‘बेटा’ आधुनिक और सहज हिन्दी है।
- source_word: ἠσθένει
  choice: बीमार था
  rationale: संदर्भ में शारीरिक रोग का स्वाभाविक और स्पष्ट अनुवाद।
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: हिन्दी बाइबल परंपरा में प्रचलित स्थान-नाम का लिप्यंतरण।
theological_decisions:
- issue: βασιλικός का अनुवाद करते समय हेरोदेस अन्तिपास के दरबार या व्यक्ति के ठीक पद के विषय में अनिश्चितता
  choice: राजकीय अधिकारी
  alternative: राजा का अधिकारी; दरबारी; कुलीन व्यक्ति
  rationale: मूल शब्द किसी राजा या राजदरबार से संबंध बताता है, पर व्यक्ति का निश्चित पद, कुलीन वंश या सेवा का स्वरूप नहीं बताता। चुना हुआ अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य-विन्यास मूल कथात्मक क्रम के निकट रखा गया है। ‘दाखरस’ बाइबिलीय संदर्भ में परिचित और स्पष्ट है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री का क्रम असंगत था; हिन्दी मसौदे में [a] को पानी-दाखरस वाक्यांश और [b] को राजकीय अधिकारी के साथ अर्थानुसार जोड़ा गया है।
