source:
  edition: SBLGNT
  text: μὴ σὺ μείζων εἶ τοῦ πατρὸς ἡμῶν Ἰακώβ, ὃς ἔδωκεν ἡμῖν τὸ φρέαρ καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν καὶ οἱ υἱοὶ αὐτοῦ καὶ τὰ θρέμματα αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/john/004/012.yaml
  text: Are you greater than our father Jacob[a], who gave us the well and drank from it himself, as did his sons and his livestock?
translation:
  language: hi
  text: क्या तुम हमारे पिता याकूब से भी बड़े हो[a]? उन्होंने हमें यह कुआँ दिया था और स्वयं इसमें से पिया था; उनके बेटों और उनके पशुधन ने भी इसमें से पिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक स्पष्ट रूप में: “क्या तुम निश्चय ही हमारे पिता याकूब से बड़े तो नहीं हो?” यूनानी में μή से आरम्भ यह प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है।'
    reason: मूल यूनानी प्रश्न में निहित अपेक्षित नकारात्मक उत्तर को स्पष्ट करना।
lexical_decisions:
- source_word: μὴ σὺ
  choice: क्या तुम ... हो
  rationale: μή से आरम्भ हुआ प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है। हिन्दी में प्रश्नवाचक रचना के साथ पाद-टिप्पणी इस आलंकारिक बल को स्वाभाविक ढंग से बनाए रखती है; ‘तुम’ पर संदर्भगत बल भी बना रहता है।
- source_word: μείζων
  choice: से भी बड़े
  rationale: यहाँ तुलना शारीरिक आकार की नहीं, महत्ता या प्रतिष्ठा की है। ‘से भी बड़े’ आधुनिक हिन्दी में इस चुनौती को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: हमारे पिता याकूब
  rationale: यह मूल के पारिवारिक और सम्मानसूचक पूर्वज-संबंध को सीधे बनाए रखता है और सामरी स्त्री के साझा पैतृक दावे को नहीं मिटाता।
- source_word: ἔδωκεν ἡμῖν
  choice: उन्होंने हमें ... दिया था
  rationale: ऐतिहासिक भूतकाल को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘दिया था’ उपयुक्त है; याकूब के प्रति सामान्य सम्मान के कारण बहुवचन आदरसूचक क्रिया रखी गई है।
- source_word: τὸ φρέαρ
  choice: यह कुआँ
  rationale: φρέαρ यहाँ पानी निकालने के कुएँ को सूचित करता है, झरने को नहीं। प्रसंग में उपस्थित कुएँ के लिए ‘यह कुआँ’ स्वाभाविक है।
- source_word: καὶ αὐτὸς ἐξ αὐτοῦ ἔπιεν
  choice: और स्वयं इसमें से पिया था
  rationale: ‘स्वयं’ αὐτός के बल को सुरक्षित रखता है और ‘इसमें से’ कुएँ की ओर स्पष्ट संकेत करता है।
- source_word: οἱ υἱοὶ αὐτοῦ
  choice: उनके बेटों
  rationale: υἱοί यहाँ विशेष रूप से पुत्रों को दर्शाता है, इसलिए व्यापक ‘बच्चों’ के बजाय ‘बेटों’ को रखा गया है।
- source_word: τὰ θρέμματα αὐτοῦ
  choice: उनके पालतू पशुओं
  rationale: θρέμματα पाले हुए घरेलू पशुओं का व्यापक समूह है। ‘पालतू पशु’ इसे केवल गाय-बैल तक सीमित किए बिना स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: μή से आरम्भ प्रश्न का आलंकारिक बल
  choice: मुख्य पाठ में स्वाभाविक प्रश्न, और पाद-टिप्पणी में अपेक्षित नकारात्मक उत्तर स्पष्ट किया गया
  alternative: “निश्चय ही तुम हमारे पिता याकूब से बड़े नहीं हो—क्या हो?”
  rationale: मूल यूनानी में वक्ता ‘नहीं’ उत्तर की अपेक्षा करती है, पर कथन को सपाट निषेध बना देना प्रश्न की चुनौती और तनाव को कम कर देता। मुख्य पाठ प्रश्न को बनाए रखता है और पाद-टिप्पणी उसके निहित बल को बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘हमारे पिता याकूब’ मूल के पैतृक सम्मान और सामरी विरासत के दावे को बनाए रखता है। लम्बे यूनानी प्रश्न को हिन्दी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है, पर सभी संबंध और आलंकारिक चुनौती सुरक्षित हैं।
