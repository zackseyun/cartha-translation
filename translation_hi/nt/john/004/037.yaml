  text: ἐν γὰρ τούτῳ ὁ λόγος ⸀ἐστὶν ἀληθινὸς ὅτι Ἄλλος ἐστὶν ὁ σπείρων καὶ ἄλλος ὁ θερίζων·
base_translation:
  language: en
  yaml_path: translation/nt/john/004/037.yaml
  text: 'For in this the saying is true: one is the one sowing[c][b][a], and another the one reaping.'
translation:
  language: hi
  text: 'क्योंकि इस मामले में यह कहावत सच है: “एक बोता है और दूसरा काटता है।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “एक बोनेवाला है और दूसरा काटनेवाला है।” ‘कहावत’ के लिए ‘कथन’ या ‘बात’ भी संभव है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν γὰρ τούτῳ
  choice: क्योंकि इस बात में
  rationale: γάρ पिछले कथन का आधार बताता है, और ἐν τούτῳ वर्तमान प्रसंग की ओर संकेत करता है। यह रूप हिन्दी में उस संबंध को स्वाभाविक ढंग से बनाए रखता है।
- source_word: ὁ λόγος
  choice: यह कहावत
  rationale: यहाँ λόγος किसी प्रसिद्ध उक्ति या सामान्य कथन को सूचित करता है, न कि यूहन्ना के विशेष धर्मवैज्ञानिक अर्थ में ‘वचन’ को। आगे दिया गया कृषि-संबंधी वाक्य कहावत जैसा है।
- source_word: ἀληθινός
  choice: सच
  rationale: यह उक्ति की सत्यता या इस प्रसंग में उसके सही सिद्ध होने को व्यक्त करता है। ‘सच’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἄλλος ... καὶ ἄλλος
  choice: कोई और ... कोई और
  rationale: यह दो भिन्न कर्ताओं के विरोध को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: ὁ σπείρων
  choice: बोनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त के कार्यकर्ता-अर्थ को संक्षिप्त, स्वाभाविक और कहावत-सुलभ हिन्दी में व्यक्त करता है।
- source_word: ὁ θερίζων
  choice: काटनेवाला
  rationale: फसल काटने वाले व्यक्ति को सामान्य और सहज हिन्दी में व्यक्त करता है तथा ‘बोनेवाला’ के साथ समानांतरता बनाए रखता है।
theological_decisions:
- issue: कृषि-संबंधी कहावत के पात्रों की पहचान
  choice: बोनेवाले और काटनेवाले को सामान्य रूप में रखा गया है।
  alternative: अनुवाद में ही बोनेवाले को भविष्यद्वक्ताओं, यूहन्ना बपतिस्मा देने वाले या यीशु से, और काटनेवाले को चेलों से जोड़ना।
  rationale: यूनानी पद स्वयं इन पात्रों की पहचान नहीं करता। उनकी विशेष प्रयुक्ति प्रसंग से समझी जानी है; इसलिए अनुवाद किसी एक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कहावत की संक्षिप्त समानांतर संरचना को बनाए रखने वाला रूप। ‘काटनेवाला’ प्रसंग में फसल काटने का अर्थ देता है; उद्धरण-चिह्न कहावत की विषयवस्तु स्पष्ट करते हैं।
