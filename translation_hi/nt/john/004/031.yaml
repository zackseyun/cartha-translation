  yaml_path: translation/nt/john/004/031.yaml
  text: Meanwhile, the disciples were urging him, saying, “Rabbi, eat.”
translation:
  language: hi
  text: 'इसी बीच[a] चेले उनसे आग्रह कर रहे थे[b]: “रब्बी[c], खाइए।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस बीच।”
    reason: lexical_alternative
  - marker: b
    text: मूल क्रिया का अनुवाद “निवेदन कर रहे थे” या “बार-बार कह रहे थे” भी हो सकता है; यहाँ चेले यीशु से भोजन करने का आग्रह कर रहे हैं।
    reason: lexical_alternative
  - marker: c
    text: “रब्बी” यहूदी परंपरा में आदर का संबोधन है; इसका अर्थ “गुरु” भी है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν τῷ μεταξὺ
  choice: इसी बीच
  rationale: यह पदबंध बीच के समय को दर्शाता है। आधुनिक हिन्दी में ‘इसी बीच’ स्वाभाविक है और प्रसंग के घटनाक्रम को स्पष्ट रखता है।
- source_word: ἠρώτων
  choice: आग्रह कर रहे थे
  rationale: ἐρωτάω का मूल भाव पूछने या निवेदन करने का है; अपूर्ण भूतकाल यहाँ चल रहे अथवा बार-बार किए जा रहे निवेदन को दिखाता है। भोजन करने के अनुरोध के प्रसंग में ‘आग्रह कर रहे थे’ उसका बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτὸν
  choice: उनसे
  rationale: सर्वनाम यीशु की ओर संकेत करता है। हिन्दी के सम्मानसूचक व्यवहार में ‘उनसे’ उपयुक्त है और ‘आग्रह करना’ के साथ स्वाभाविक कारक-रचना बनाता है।
- source_word: οἱ μαθηταὶ
  choice: चेले
  rationale: यह प्रसंग में पहले से पहचाने गए यीशु के शिष्यों का समूह है। ‘चेले’ सामान्य आधुनिक हिन्दी में सहज और समझने योग्य है।
- source_word: λέγοντες
  choice: प्रत्यक्ष कथन द्वारा व्यक्त
  rationale: यूनानी कृदन्त निवेदन की कही हुई सामग्री प्रस्तुत करता है। हिन्दी में ‘कहते हुए’ जोड़ना यहाँ अनावश्यक रूप से भारी होता; उद्धरण सीधे उसी कार्य को करता है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यह यीशु को संबोधित करने की यहूदी उपाधि है। लिप्यंतरण इसे केवल ‘गुरु’ में समतल किए बिना यूहन्ना के सांस्कृतिक और कथात्मक रंग को बनाए रखता है।
- source_word: φάγε
  choice: खाइए
  rationale: यह एकवचन आज्ञार्थक रूप है। यीशु के प्रति सम्मानसूचक संबोधन को बनाए रखते हुए ‘खाइए’ सीधा और स्वाभाविक हिन्दी निवेदन है।
