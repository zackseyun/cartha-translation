    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ बिना बारंबारता का भाव जोड़े तर्क को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: यूनानी में सर्वनाम स्पष्ट रूप से आया है और यीशु पर हल्का बल देता है।
- source_word: μαρτυρῶ
  choice: गवाही देता हूँ
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और μαρτυρέω के साक्ष्य तथा न्यायिक संदर्भ से जुड़े अर्थ को बनाए रखता है।
- source_word: περὶ ἐμαυτοῦ
  choice: अपने विषय में स्वयं
  rationale: περί के साथ संबंधकारक का सीधा अर्थ ‘के विषय में’ है; ‘स्वयं’ स्पष्ट ἐμαυτοῦ के आत्मवाचक बल को व्यक्त करता है, बिना ‘अपने पक्ष में’ जैसा अतिरिक्त न्यायिक अर्थ जोड़े।
- source_word: ἡ μαρτυρία μου
  choice: मेरी गवाही
  rationale: यह क्रिया ‘गवाही देता हूँ’ के साथ मूल यूनानी की शब्दगत संगति बनाए रखता है और हिन्दी में सहज है।
- source_word: οὐκ ἔστιν ἀληθής
  choice: सच्ची नहीं है
  rationale: ἀληθής का सीधा अर्थ ‘सच्ची’ है। यह यूहन्ना 8:14 के साथ उत्पन्न व्याख्यात्मक तनाव को किसी संकुचित कानूनी अर्थ द्वारा समाप्त नहीं करता।
theological_decisions:
- issue: यीशु के इस कथन का अर्थ कि उनकी गवाही ‘सच्ची नहीं है’
  choice: मुख्य पाठ में ‘मेरी गवाही सच्ची नहीं है’ रखा गया है।
  alternative: ‘मेरी गवाही मान्य नहीं है।’
  rationale: यूनानी ἀληθής का सीधा अर्थ ‘सच्ची’ है। संदर्भ में गवाही की कानूनी मान्यता का भाव संभव है, पर उसे मुख्य पाठ में रखकर मूल कथन के धार्मिक और व्याख्यात्मक तनाव को चुपचाप हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गवाही’ न्यायिक-साक्ष्य संबंधी स्वर को बनाए रखती है; ‘सच्ची’ मूल पाठ की वास्तविक अस्पष्टता और तनाव को सुरक्षित रखती है।
