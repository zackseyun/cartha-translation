  rationale: Removed “स्वयं” to make the Hindi idiomatic and to avoid assigning it a potentially misleading adverbial emphasis. The explicit “मैं” continues to represent ἐγώ, while “अपने विषय में” accurately renders περὶ ἐμαυτοῦ. All other wording and the lexical-alternative footnote are retained.
