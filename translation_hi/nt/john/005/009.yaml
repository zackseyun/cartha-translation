id: JHN.5.9
reference: John 5:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εὐθέως ἐγένετο ὑγιὴς ὁ ἄνθρωπος καὶ ἦρε τὸν κράβαττον αὐτοῦ καὶ περιεπάτει. Ἦν δὲ σάββατον ἐν ἐκείνῃ τῇ ἡμέρᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/009.yaml
  text: And immediately the man became well[a], and he picked up his mat and began to walk[c][b]. Now that day was a Sabbath.
translation:
  language: hi
  text: और वह आदमी तुरन्त चंगा हो गया। उसने अपनी चटाई[a] उठा ली और चलने लगा[b]। उस दिन सब्त[c] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिछौना।” यूनानी शब्द κράβαττον साधारण चटाई, पतला बिछौना या उठाकर ले जाया जा सकने वाला सोने का गद्दा दर्शाता है, न कि आवश्यक रूप से कोई बड़ा पलंग।
    reason: lexical_alternative
  - marker: b
    text: या, “चल रहा था।” यूनानी अपूर्ण भूतकालीन रूप जारी क्रिया पर बल दे सकता है; इस प्रसंग में इसे चंगा होने के बाद चलना आरम्भ करने के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “वह दिन सब्त का दिन था।” यूनानी का शाब्दिक क्रम है, “उस दिन सब्त था।”
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह चंगाई के तत्काल घटित होने को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγένετο ὑγιὴς
  choice: चंगा हो गया
  rationale: यूनानी पद का अर्थ है कि उसकी दशा बदलकर स्वस्थ हो गई। ‘चंगा हो गया’ प्रसंगानुकूल, सहज और सक्रिय कर्तृत्व को अनावश्यक रूप से स्पष्ट किए बिना मूल रचना को सुरक्षित रखता है।
- source_word: ὁ ἄνθρωπος
  choice: वह आदमी
  rationale: यह कथा में पहले से उल्लिखित विशिष्ट पुरुष को सूचित करता है।
- source_word: ἦρε
  choice: उठा ली
  rationale: यहाँ क्रिया का अर्थ पड़ी हुई चटाई को उठाकर साथ लेना है; हिन्दी में ‘उठा ली’ स्वाभाविक है।
- source_word: κράβαττον
  choice: चटाई
  rationale: यह शब्द साधारण, उठाकर ले जाए जा सकने वाले बिछौने या सोने की चटाई को दर्शाता है, न कि आवश्यक रूप से फर्नीचर वाली खाट या पलंग को।
- source_word: περιεπάτει
  choice: चलने लगा
  rationale: अपूर्ण भूतकालीन रूप जारी क्रिया को व्यक्त कर सकता है; चंगाई के इस प्रसंग में ‘चलने लगा’ उसकी बहाल हुई क्षमता के आरम्भ को स्वाभाविक ढंग से व्यक्त करता है, जबकि वैकल्पिक पक्ष को पादटिप्पणी में रखा गया है।
- source_word: Ἦν δὲ
  choice: था
  rationale: δέ यहाँ प्रबल विरोध के बजाय कथात्मक स्पष्टीकरण की ओर मोड़ लाता है। अलग वाक्य में ‘उस दिन…था’ हिन्दी में यह कार्य सहज रूप से करता है।
- source_word: σάββατον
  choice: सब्त
  rationale: यह यहूदी विश्राम-दिन का प्रचलित बाइबलीय नाम है। हिन्दी में उपपद न होने के कारण यूनानी के अनिश्चित और निश्चित रूप का भेद सीधे व्यक्त नहीं किया जा सकता।
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह यूनानी कालवाचक पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: कथात्मक प्रसंग में σάββατον का रूप
  choice: उस दिन सब्त था
  alternative: वह दिन सब्त का दिन था
  rationale: मूल यूनानी में σάββατον के साथ उपपद नहीं है और यह आगे आने वाले विवाद की पृष्ठभूमि बताने वाला कालवाचक कथन है। चुना हुआ रूप किसी अतिरिक्त धर्मवैधानिक अर्थ को जोड़े बिना मूल की संक्षिप्तता बनाए रखता है।
- issue: चंगाई में कर्तृत्व की अभिव्यक्ति
  choice: चंगा हो गया
  alternative: चंगा कर दिया गया
  rationale: ἐγένετο ὑγιὴς व्याकरणतः ‘स्वस्थ हो गया’ की दशा-परिवर्तन वाली रचना है। कर्मवाच्य रूप किसी कर्ता को मूल की अपेक्षा अधिक स्पष्ट कर देता, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चंगा’ और ‘सब्त’ सामान्य हिन्दी बाइबल-पाठकों के लिए परिचित शब्द हैं। छोटे वाक्यों से चंगाई की तात्कालिकता और उसके बाद सब्त-संबंधी कथात्मक मोड़ स्पष्ट होता है।
