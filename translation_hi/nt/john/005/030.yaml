  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ δύναμαι ἐγὼ ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν· καθὼς ἀκούω κρίνω, καὶ ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν, ὅτι οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν ἀλλὰ τὸ θέλημα τοῦ πέμψαντός ⸀με.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/030.yaml
  text: I am not able to do anything from myself. Just as I hear[a], I judge, and my judgment is just, because I do not seek my own will, but the will of the one who sent me.
translation:
  language: hi
  text: “मैं अपनी ओर से[a] कुछ भी नहीं कर सकता। जैसा मैं सुनता हूँ, वैसा ही न्याय करता हूँ; और मेरा न्याय न्यायपूर्ण है, क्योंकि मैं अपनी इच्छा नहीं, बल्कि उसकी इच्छा चाहता हूँ जिसने मुझे भेजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपने आप से कुछ भी नहीं कर सकता।” यूनानी पदबंध कार्य के स्रोत और स्वतंत्र रूप से कार्य न करने—दोनों भाव व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐ δύναμαι ἐγὼ
  choice: मैं ... नहीं कर सकता
  rationale: δύναμαι की नकारात्मक सामर्थ्य और ἐγώ के स्पष्ट कर्ता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ποιεῖν ἀπ’ ἐμαυτοῦ οὐδέν
  choice: अपनी ओर से कुछ भी ... नहीं कर सकता
  rationale: ‘अपनी ओर से’ ἀπ’ ἐμαυτοῦ में निहित स्रोत तथा स्वतंत्र रूप से कार्य करने—दोनों भावों को ‘अकेले’ जैसे भ्रामक अर्थ के बिना व्यक्त करता है। नकार के साथ ‘कुछ भी नहीं’ स्वाभाविक हिन्दी है।
- source_word: καθὼς ἀκούω κρίνω
  choice: जैसा मैं सुनता हूँ, वैसा ही न्याय करता हूँ
  rationale: καθὼς के अनुरूपता-सूचक बल को ‘जैसा...वैसा ही’ से और ἀκούω तथा κρίνω के सामान्य वर्तमान भाव को सरल वर्तमान काल से सुरक्षित रखा गया है।
- source_word: ἡ κρίσις ἡ ἐμὴ δικαία ἐστίν
  choice: मेरा न्याय न्यायपूर्ण है
  rationale: κρίνω और κρίσις का न्यायिक संबंध बना रहता है; δικαία के लिए ‘न्यायपूर्ण’ इस प्रसंग में निष्पक्ष और उचित न्याय का स्वाभाविक हिन्दी बोध देता है।
- source_word: οὐ ζητῶ τὸ θέλημα τὸ ἐμὸν
  choice: मैं अपनी इच्छा नहीं ... चाहता हूँ
  rationale: ζητῶ यहाँ लक्ष्य या अभिलाषा की ओर उन्मुख होने का भाव रखता है। ‘चाहता हूँ’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘अपनी’ यूनानी के बलयुक्त स्वामित्व को बनाए रखता है।
- source_word: ἀλλὰ τὸ θέλημα τοῦ πέμψαντός με
  choice: बल्कि अपने भेजनेवाले की इच्छा चाहता हूँ
  rationale: प्रत्यक्ष कृदन्तीय वर्णन को बनाए रखा गया है; मूल में जहाँ ‘पिता’ शब्द नहीं है, वहाँ उसे जोड़ा नहीं गया। ‘बल्कि’ ἀλλά के स्पष्ट विरोध को व्यक्त करता है।
theological_decisions:
- issue: ἀπ’ ἐμαυτοῦ में पुत्र के कार्य और भेजनेवाले के बीच संबंध
  choice: ‘अपनी ओर से’—अर्थात स्वतंत्र स्रोत बनकर कार्य न करना
  alternative: ‘अपने आप से’ या ‘अकेले’
  rationale: 'यह रूप मूल की वास्तविक धर्मवैचारिक कसावट बनाए रखता है: कथन को न तो निरपेक्ष अक्षमता की व्याख्या में बदलता है, न पिता से अलग अकेलेपन के अर्थ में।'
- issue: δικαία के न्यायिक अर्थ की अभिव्यक्ति
  choice: न्यायपूर्ण
  alternative: धर्मी; सही
  rationale: κρίσις के साथ ‘न्यायपूर्ण’ न्याय की उचितता और निष्पक्षता को स्पष्ट करता है, बिना नैतिक धार्मिकता के व्यापक अर्थ को अनावश्यक रूप से आरोपित किए।
- issue: ζητῶ के साथ इच्छा का लक्ष्य
  choice: ‘इच्छा चाहता हूँ’
  alternative: ‘इच्छा पूरी करना चाहता हूँ’ या ‘इच्छा का अनुसरण करता हूँ’
  rationale: मुख्य पाठ में ‘पूरी करना’ जोड़ने से बचते हुए लक्ष्य/अभिलाषा का भाव रखा गया है। हिन्दी में थोड़ी औपचारिकता मूल की संक्षिप्त धर्मवैचारिक अभिव्यक्ति को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘भेजनेवाले’ यूहन्ना की संबंधसूचक शैली को बनाए रखता है। ‘न्याय करता हूँ/मेरा न्याय’ की पुनरावृत्ति मूल के κρίνω/κρίσις संबंध को जानबूझकर सुरक्षित रखती है।
