- from: पर मैं मनुष्य से गवाही नहीं लेता; बल्कि मैं ये बातें इसलिए कहता हूँ कि तुम उद्धार पाओ।
  to: पर मैं किसी मनुष्य से गवाही प्राप्त नहीं करता; बल्कि मैं ये बातें इसलिए कहता हूँ ताकि तुम उद्धार पाओ।
  rationale: A minimal revision improves the source-oriented sense of receiving testimony and makes the purpose clause more explicit. The contrast, plural demonstrative, generic singular human source, and non-sectarian salvific language are retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:48:07Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the adversative movement, the plural force of ταῦτα ('ये बातें'), and the purposive sense of ἵνα with the broad salvific sense of σωθῆτε. However, 'गवाही लेना' can naturally suggest eliciting or taking a witness statement, whereas λαμβάνω τὴν μαρτυρίαν here denotes receiving testimony as its source or basis. 'गवाही प्राप्त करता' more directly conveys the Greek expression without importing 'accept.'
  naturalness: The revised wording is modern, clear, and suitable for dignified public reading. 'ताकि' makes the purpose relation immediately transparent, and 'किसी मनुष्य से' is idiomatic Hindi under negation while retaining the Greek singular generic reference.
  terminology: ‘गवाही’ appropriately retains the evidentiary/juridical sense of μαρτυρία, and ‘उद्धार पाओ’ preserves the broad theological force and passive-result sense of σωθῆτε without doctrinal expansion.
  issues:
  - severity: low
    issue: ‘मनुष्य से गवाही नहीं लेता’ may be heard as taking or soliciting a person’s statement.
    rationale: In this context Jesus denies receiving testimony from a human source. Replacing ‘लेता’ with ‘प्राप्त करता’ better represents λαμβάνω while remaining natural and not implying assent or endorsement.
  - severity: low
    issue: The purpose clause is less direct with ‘इसलिए ... कि’.
    rationale: It is grammatical, but ‘ताकि’ more plainly marks ἵνα as purpose in contemporary standard Hindi.
  revised_text: पर मैं किसी मनुष्य से गवाही प्राप्त नहीं करता; बल्कि मैं ये बातें इसलिए कहता हूँ ताकि तुम उद्धार पाओ।
  revised_footnotes: []
  revision_rationale: A minimal revision improves the source-oriented sense of receiving testimony and makes the purpose clause more explicit. The contrast, plural demonstrative, generic singular human source, and non-sectarian salvific language are retained.
