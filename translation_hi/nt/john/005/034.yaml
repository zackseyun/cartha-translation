id: JHN.5.34
reference: John 5:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ οὐ παρὰ ἀνθρώπου τὴν μαρτυρίαν λαμβάνω, ἀλλὰ ταῦτα λέγω ἵνα ὑμεῖς σωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/034.yaml
  text: But I do not receive testimony from man; rather, I say these things so that you may be saved.
translation:
  language: hi
  text: पर मैं किसी मनुष्य से गवाही प्राप्त नहीं करता; बल्कि मैं ये बातें इसलिए कहता हूँ ताकि तुम उद्धार पाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: मनुष्य से
  rationale: παρά के साथ संबंधकारक स्रोत को दर्शाता है। एकवचन ἀνθρώπου यहाँ किसी विशेष पुरुष की अपेक्षा मानवीय स्रोत को सामान्य रूप से सूचित करता है; ‘मनुष्य से’ यूनानी रूप और संदर्भ के विरोध—मानवीय गवाही—दोनों को बनाए रखता है।
- source_word: μαρτυρίαν
  choice: गवाही
  rationale: μαρτυρία गवाही या साक्ष्य को दर्शाता है। ‘गवाही’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग की प्रमाणात्मक छाया बनाए रखती है।
- source_word: λαμβάνω
  choice: लेता
  rationale: वर्तमानकालीन λαμβάνω का सीधा और स्वाभाविक हिन्दी समतुल्य ‘लेता’ है। ‘स्वीकार करता’ सम्भव है, पर उससे कथन में सत्य मान लेने का भाव अधिक उभर सकता है, जबकि मूल क्रिया गवाही प्राप्त करने या ग्रहण करने की व्यापक धारणा रखती है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक को ‘ये बातें’ के रूप में प्रस्तुत करने से बहुवचन और कथित विषयों का संकेत दोनों स्पष्ट रहते हैं।
- source_word: λέγω
  choice: कहता हूँ
  rationale: वर्तमान निर्देशार्थक λέγω का स्वाभाविक हिन्दी अनुवाद ‘कहता हूँ’ है।
- source_word: ἵνα ὑμεῖς σωθῆτε
  choice: कि तुम उद्धार पाओ
  rationale: ἵνα उद्देश्य बताता है और σωθῆτε अओरिस्ट कर्मवाच्य संभावनार्थक है। ‘कि तुम उद्धार पाओ’ हिन्दी में उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है और उद्धार के व्यापक धर्मवैज्ञानिक अर्थ को किसी विशेष सिद्धान्त तक सीमित नहीं करता।
- source_word: δὲ ... ἀλλὰ
  choice: पर ... बल्कि
  rationale: यह विरोधात्मक संरचना पहले मानवीय गवाही पर निर्भरता का निषेध और फिर इन बातों को कहने का उद्देश्य सामने रखती है। ‘पर ... बल्कि’ इस प्रगति को साफ़ और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘तुम उद्धार पाओ’ का प्रसंगगत अर्थ
  choice: उद्धार की व्यापक भाषा को बनाए रखा गया है, उसे शारीरिक बचाव या उद्धार के किसी विशिष्ट धर्मसैद्धान्तिक प्रतिमान तक सीमित नहीं किया गया।
  alternative: तुम बचाए जाओ / तुम मुक्ति पाओ
  rationale: σῴζω यहाँ धर्मवैज्ञानिक भार रखता है, पर पद यह नहीं बताता कि उद्धार की प्रक्रिया को किस विशिष्ट सिद्धान्त के अनुसार समझाया जाए। ‘उद्धार पाओ’ व्यापक अर्थ और कर्मवाच्य भाव को हिन्दी के स्वाभाविक मुहावरे में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘मनुष्य से गवाही’ मूल की स्रोत-संरचना को बनाए रखता है, जबकि ‘ये बातें इसलिए कहता हूँ’ उद्देश्य-वाक्य को सहज हिन्दी क्रम देता है।
