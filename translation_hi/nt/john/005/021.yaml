language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ὁ πατὴρ ἐγείρει τοὺς νεκροὺς καὶ ζῳοποιεῖ, οὕτως καὶ ὁ υἱὸς οὓς θέλει ζῳοποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/021.yaml
  text: For just as the Father raises the dead and gives life[b][a], so also the Son gives life to whom he wishes.
translation:
  language: hi
  text: क्योंकि जैसे पिता मरे हुओं को उठाता और जीवित करता है, वैसे ही पुत्र भी जिन्हें चाहता है, उन्हें जीवित करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक अर्थ को ‘क्योंकि’ और ὥσπερ की तुलना को ‘जैसे’ से स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूहन्ना के संदर्भ में यह परमेश्वर के लिए प्रयुक्त संबंधपरक उपाधि है।
- source_word: ἐγείρει τοὺς νεκρούς
  choice: मरे हुओं को उठाता
  rationale: पुनरुत्थान के संदर्भ में ἐγείρω का मानक और स्पष्ट हिन्दी रूप ‘उठाता’ है; τοὺς νεκρούς को सामूहिक रूप से ‘मरे हुओं’ कहा गया है।
- source_word: ζῳοποιεῖ
  choice: जीवित करता है
  rationale: दोनों प्रयोगों में एक ही अभिव्यक्ति रखकर यूनानी पुनरावृत्ति और जीवन प्रदान करने की क्रिया को सुरक्षित रखा गया है।
- source_word: οὕτως καὶ
  choice: वैसे ही ... भी
  rationale: पिता और पुत्र के कार्यों के बीच स्पष्ट समानांतर तुलना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ υἱὸς
  choice: पुत्र
  rationale: संदर्भ में यह यीशु के लिए संबंधपरक मसीही उपाधि है और ‘पिता’ के समानांतर है।
- source_word: οὓς θέλει
  choice: जिन्हें चाहता है
  rationale: θέλω की इच्छाशक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘इच्छा करता है’ की अपेक्षा कम कृत्रिम और ‘चाहे’ की अपेक्षा अधिक स्पष्ट है।
theological_decisions:
- issue: जीवन देने में पिता-पुत्र का समानांतर
  choice: पिता और पुत्र दोनों के लिए ‘जीवित करता है’ का समान शब्दांकन
  alternative: पुत्र के कार्य को अपेक्षाकृत कमजोर या भिन्न शब्दों में व्यक्त करना
  rationale: यूनानी पाठ जानबूझकर पिता के जीवनदायी कार्य और पुत्र के जीवनदायी कार्य को समानांतर रखता है; अनुवाद इस दावे को न घटाता है, न उसमें अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़ता है।
- issue: θέλει में पुत्र की इच्छा
  choice: ‘जिन्हें चाहता है’
  alternative: ‘जिन्हें वह इच्छा करता है’ या ‘जिन्हें वह ठहराता है’
  rationale: मुख्य पाठ में वास्तविक इच्छा और चयन का भाव सुरक्षित है, पर ‘ठहराता है’ जैसी अधिक विशिष्ट धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘मरे हुओं’ सामान्य पाठक के लिए बोधगम्य है, और ‘जीवित करता है’ दोनों ζῳοποιεῖ का सुसंगत अनुवाद है।
