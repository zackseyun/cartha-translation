id: JHN.5.18
reference: John 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο οὖν μᾶλλον ἐζήτουν αὐτὸν οἱ Ἰουδαῖοι ἀποκτεῖναι ὅτι οὐ μόνον ἔλυε τὸ σάββατον, ἀλλὰ καὶ πατέρα ἴδιον ἔλεγε τὸν θεόν, ἴσον ἑαυτὸν ποιῶν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/018.yaml
  text: For this reason[a], therefore, the Jews were seeking all the more to kill him, because he was not only breaking the Sabbath, but was also calling God his own Father[b], making himself equal with God.
translation:
  language: hi
  text: इसी कारण यहूदी[a] उसे मार डालने के लिए और भी अधिक प्रयत्न कर रहे थे, क्योंकि वह न केवल सब्त का उल्लंघन करता था, बल्कि परमेश्वर को अपना पिता भी कहता था और इस प्रकार अपने आपको परमेश्वर के बराबर कर रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूहन्ना के सुसमाचार में “यहूदी” शब्द प्रसंग के अनुसार प्रायः विशेष रूप से यीशु के यहूदी विरोधियों या कुछ यहूदी अधिकारियों को दर्शाता है, न कि बिना भेद के प्रत्येक यहूदी व्यक्ति को।
    reason: cultural_note
  - marker: b
    text: या, “इस प्रकार अपने आपको परमेश्वर के बराबर ठहरा रहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο οὖν
  choice: इसी कारण
  rationale: दोनों यूनानी पद पिछले प्रसंग से निष्कर्षात्मक संबंध जोड़ते हैं। आधुनिक हिन्दी में ‘इसी कारण’ उस संयुक्त बल को स्वाभाविक ढंग से व्यक्त करता है; ‘इसलिए, इसी कारण’ अनावश्यक रूप से दोहरावपूर्ण होता।
- source_word: μᾶλλον
  choice: और भी अधिक
  rationale: यह तुलनात्मक तीव्रता को बनाए रखता है और बताता है कि यीशु को मार डालने का उनका प्रयत्न पहले से बढ़ गया था।
- source_word: ἐζήτουν ... ἀποκτεῖναι
  choice: मार डालने के लिए ... प्रयत्न कर रहे थे
  rationale: अपूर्ण भूतकाल ongoing प्रयास को दर्शाता है। ‘मार डालना’ ἀποκτεῖναι की स्पष्ट शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: मुख्य पाठ यूनानी अभिव्यक्ति को संकुचित करके ‘यहूदी अगुए’ नहीं बनाता। प्रसंग में इसके अधिक सीमित संभावित संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἔλυε τὸ σάββατον
  choice: सब्त का उल्लंघन करता था
  rationale: यहाँ λύω सब्त के नियम को भंग करने के अर्थ में प्रयुक्त है। ‘उल्लंघन’ आरोप का भाव स्पष्ट करता है, बिना यह निर्णय किए कि आरोप उचित था।
- source_word: πατέρα ἴδιον ἔλεγε τὸν θεόν
  choice: परमेश्वर को अपना पिता भी कहता था
  rationale: ‘अपना’ ἴδιον के विशेष और बलपूर्ण संबंध को सुरक्षित रखता है, जबकि वाक्य आधुनिक हिन्दी में सहज रहता है।
- source_word: ἴσον ἑαυτὸν ποιῶν τῷ θεῷ
  choice: इस प्रकार अपने आपको परमेश्वर के बराबर कर रहा था
  rationale: यह participial clause को पिछले दावे के परिणाम अथवा निहितार्थ के रूप में जोड़ता है और परमेश्वर के साथ समानता के प्रबल मसीही अर्थ को कम नहीं करता।
theological_decisions:
- issue: परमेश्वर के साथ समानता वाले कथन की मसीही शक्ति
  choice: अपने आपको परमेश्वर के बराबर कर रहा था
  alternative: परमेश्वर के बराबर होने का दावा कर रहा था
  rationale: मुख्य पाठ ποιῶν की ‘करना/बनाना’ भाषा और स्पष्ट समानता दोनों को बनाए रखता है। ‘दावा कर रहा था’ अर्थ की व्याख्या तो करता है, पर यूनानी क्रिया को अधिक व्याख्यात्मक बना देता है।
- issue: यूहन्ना के सुसमाचार में ‘यहूदी’ का संदर्भ
  choice: मुख्य पाठ में ‘यहूदी’, पादटिप्पणी में प्रसंगगत स्पष्टीकरण
  alternative: यहूदी अगुए
  rationale: οἱ Ἰουδαῖοι का शब्दगत रूप सुरक्षित रहता है, जबकि पादटिप्पणी यह अनुचित सामान्यीकरण रोकती है कि हर यहूदी व्यक्ति अभिप्रेत है।
- issue: सब्त के उल्लंघन के कथन का दृष्टिकोण
  choice: आरोप को बिना नरम किए सीधे रखा गया
  alternative: उनके विचार में सब्त का उल्लंघन करता था
  rationale: मूल वाक्य में ‘उनके विचार में’ स्पष्ट रूप से नहीं है। उसे जोड़ने से कथन की कथात्मक तीक्ष्णता घटती और एक व्याख्यात्मक समाधान पाठ में आ जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सब्त’, ‘परमेश्वर’ और ‘पिता’ जैसे स्थापित बाइबलीय शब्द सुरक्षित हैं। यूनानी वाक्य की कारणात्मक प्रगति और अपूर्ण भूतकाल की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया है।
