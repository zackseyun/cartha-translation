id: JHN.5.24
reference: John 5:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων τῷ πέμψαντί με ἔχει ζωὴν αἰώνιον, καὶ εἰς κρίσιν οὐκ ἔρχεται ἀλλὰ μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/024.yaml
  text: Truly[a], truly, I say to you, whoever hears my word and believes him who sent me has eternal life, and does not come into judgment[b], but has passed from death into life.
translation:
  language: hi
  text: 'मैं तुमसे सच-सच कहता हूँ: जो मेरा वचन सुनता और मेरे भेजनेवाले पर विश्वास करता है, उसके पास अनन्त जीवन है। वह न्याय[a] के अधीन नहीं आता, बल्कि मृत्यु से जीवन में पार हो चुका है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दण्डादेश में।” यूनानी κρίσις का अर्थ सामान्य रूप से “न्याय” हो सकता है, और इस संदर्भ में प्रतिकूल न्याय भी।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी पूर्ण काल की क्रिया ऐसी पूरी हो चुकी गति बताती है जिसका परिणाम बना हुआ है: वह मृत्यु से जीवन में “पार हो चुका है।”'
    reason: verbal_aspect
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: दोहरे आमेन की गंभीर, जोरदार पुष्टि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ τὸν λόγον μου ἀκούων καὶ πιστεύων
  choice: जो मेरा वचन सुनता और ... विश्वास करता है
  rationale: दोनों वर्तमान कृदन्तों के सामान्य और चरित्रगत अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τῷ πέμψαντί με
  choice: मेरे भेजनेवाले पर
  rationale: πιστεύω के सम्प्रदान कारक के साथ विश्वास या भरोसा रखने का भाव है; हिन्दी में ‘पर विश्वास करना’ स्वाभाविक है।
- source_word: ἔχει ζωὴν αἰώνιον
  choice: उसके पास अनन्त जीवन है
  rationale: वर्तमान काल द्वारा व्यक्त अभी के अधिकार या प्राप्ति को स्पष्ट रखता है।
- source_word: εἰς κρίσιν οὐκ ἔρχεται
  choice: वह न्याय में नहीं आता
  rationale: κρίσις के व्यापक अर्थ ‘न्याय’ को बनाए रखता है और ‘दण्डादेश’ कहकर प्रतिकूल परिणाम को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μεταβέβηκεν ἐκ τοῦ θανάτου εἰς τὴν ζωήν
  choice: मृत्यु से निकलकर जीवन में प्रवेश कर चुका है
  rationale: पूर्ण काल की पूरी हो चुकी और वर्तमान में प्रभावी अवस्था तथा दोनों दिशासूचक पूर्वसर्गों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उद्धार के संदर्भ में κρίσις का अर्थ
  choice: न्याय
  alternative: दण्डादेश
  rationale: संदर्भ प्रतिकूल न्याय की ओर संकेत कर सकता है, पर संज्ञा स्वयं अधिक व्यापक है; ‘न्याय’ मूल पाठ की अर्थगत गुंजाइश बनाए रखता है।
- issue: ἔχει और μεταβέβηκεν का कालगत बल
  choice: अनन्त जीवन की वर्तमान प्राप्ति और मृत्यु से जीवन में पूरी हो चुकी, स्थायी परिणति वाली गति
  alternative: केवल भविष्य में मिलने वाला जीवन या केवल भविष्य का छुटकारा
  rationale: वर्तमान ἔχει और पूर्णकालिक μεταβέβηκεν वर्तमान वास्तविकता तथा पूरी हुई घटना के बने रहने वाले परिणाम को व्यक्त करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वचन’ यूहन्ना के लेखन की शब्दगत प्रतिध्वनि सुरक्षित रखता है; ‘प्रवेश कर चुका है’ पूर्ण काल और εἰς की दिशात्मकता को स्पष्ट करता है।
