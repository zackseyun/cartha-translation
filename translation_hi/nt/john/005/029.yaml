id: JHN.5.29
reference: John 5:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκπορεύσονται οἱ τὰ ἀγαθὰ ποιήσαντες εἰς ἀνάστασιν ζωῆς, οἱ ⸀δὲ τὰ φαῦλα πράξαντες εἰς ἀνάστασιν κρίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/029.yaml
  text: and will come out—those who have done good to the resurrection of life[a], but those who have done evil to the resurrection of judgment.
translation:
  language: hi
  text: और वे बाहर निकल आएँगे—जिन्होंने भलाई की है, वे जीवन के पुनरुत्थान के लिए, पर जिन्होंने बुराई की है, वे न्याय के पुनरुत्थान[a] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोषी ठहराए जाने का पुनरुत्थान।” यूनानी में “न्याय” है, जिसका अर्थ अधिक व्यापक है; “दोषी ठहराया जाना” कुछ अनुवादों में पाया जाने वाला अधिक संकीर्ण अर्थ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύσονται
  choice: बाहर निकल आएँगे
  rationale: पद 28–29 में कब्रों से बाहर आने का प्रसंग है। ‘बाहर निकल आएँगे’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया की दिशा को स्पष्ट रखता है।
- source_word: τὰ ἀγαθὰ ποιήσαντες
  choice: जिन्होंने भलाई की है
  rationale: संज्ञा की तरह प्रयुक्त बहुवचन विशेषण τὰ ἀγαθὰ और ποιέω के कृदन्त का संक्षिप्त तथा स्वाभाविक अर्थ देता है; अलग-अलग कामों की सूची नहीं बनाता।
- source_word: ἀνάστασιν ζωῆς
  choice: जीवन के पुनरुत्थान
  rationale: मूल यूनानी के संबंधकारक विन्यास और अगले वाक्यांश के साथ समानांतरता को सुरक्षित रखता है। ‘जीवन पाने के लिए जी उठना’ अधिक व्याख्यात्मक होता।
- source_word: τὰ φαῦλα πράξαντες
  choice: जिन्होंने बुराई की है
  rationale: φαῦλα इस न्याय-संदर्भ में नैतिक बुराई को व्यक्त करता है। हिन्दी में ‘बुराई की है’ स्वाभाविक है; πράσσω और ποιέω के बीच सूक्ष्म शब्दभेद को कृत्रिम भाषा द्वारा बढ़ाना उचित नहीं।
- source_word: ἀνάστασιν κρίσεως
  choice: न्याय के पुनरुत्थान
  rationale: κρίσις का मूल और व्यापक अर्थ ‘न्याय/न्यायिक निर्णय’ है। यह अनुवाद उसे सीधे ‘दोषी ठहराया जाना’ बनाकर संकीर्ण नहीं करता और पहले वाक्यांश के समानांतर रूप को बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: दो समूहों और उनके परिणामों के बीच स्पष्ट विरोध व्यक्त करता है।
theological_decisions:
- issue: क्या κρίσεως का अनुवाद व्यापक ‘न्याय’ हो या संकीर्ण ‘दोषी ठहराया जाना’
  choice: न्याय
  alternative: दोषी ठहराया जाना
  rationale: κρίσις अपने आप में केवल दोषसिद्धि को अनिवार्य नहीं करता। ‘न्याय’ मूल शब्द की व्यापकता और पद में उपस्थित धर्मवैचारिक तनाव को सुरक्षित रखता है, जबकि संदर्भ परिणाम की गंभीरता स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। समानांतर वाक्य-विन्यास मूल के दो समूहों और दो परिणामों को उभारता है; ‘न्याय’ को जानबूझकर अधिक संकीर्ण धर्मवैचारिक शब्द से नहीं बदला गया।
