  text: I do not receive glory from men[b][a],
translation:
  language: hi
  text: मैं मनुष्यों[b] से महिमा[a] प्राप्त नहीं करता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘महिमा’ के लिए ‘आदर’ या ‘प्रशंसा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
