    reason: lexical_alternative
lexical_decisions:
- source_word: δόξαν
  choice: महिमा
  rationale: ‘महिमा’ यूहन्ना के सुसमाचार में δόξα के व्यापक शब्दगत संबंध को बनाए रखती है। इस प्रसंग में इसका अर्थ दूसरों से मिलनेवाला आदर, प्रशंसा या प्रतिष्ठा भी हो सकता है।
- source_word: παρὰ ἀνθρώπων
  choice: मनुष्यों से
  rationale: παρά के साथ संबंधकारक स्रोत को व्यक्त करता है, इसलिए ‘से’ उपयुक्त है। ἀνθρώπων यहाँ सामान्य रूप से मानवों को सूचित कर सकता है; ‘मनुष्यों’ मूल की व्यापकता और औपचारिक गरिमा दोनों बनाए रखता है।
- source_word: οὐ λαμβάνω
  choice: ग्रहण नहीं करता
  rationale: λαμβάνω का सीधा अर्थ ‘लेना’ या ‘ग्रहण करना’ है। ‘ग्रहण नहीं करता’ वर्तमानकालीन कथन को स्वाभाविक हिन्दी में रखता है और मुख्य पाठ में ‘खोजता’ जैसी व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: मानवीय स्वीकृति के विषय में यीशु के कथन का आशय
  choice: 'मुख्य पाठ को निकट और खुला रखा गया है: यीशु मनुष्यों से महिमा ग्रहण नहीं करते।'
  alternative: इसे विस्तार देकर कहना कि यीशु अपनी सेवकाई या पहचान की पुष्टि के लिए मानवीय प्रशंसा न तो खोजते हैं, न उस पर निर्भर रहते हैं।
  rationale: संदर्भ मानवीय प्रशंसा पर निर्भरता या उससे मिलनेवाली पुष्टि के निषेध की ओर संकेत करता है, पर यूनानी पाठ में ‘खोजना’ या ‘निर्भर रहना’ स्पष्ट रूप से नहीं है। इसलिए अनुवाद उस व्याख्या को मुख्य पाठ में नहीं जोड़ता और कथन के तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सुबोध रूप अपनाया गया है। ‘महिमा’ यूहन्ना की प्रमुख शब्दावली को बनाए रखती है, जबकि पादटिप्पणी प्रसंगानुकूल सामान्य अर्थ स्पष्ट करती है।
