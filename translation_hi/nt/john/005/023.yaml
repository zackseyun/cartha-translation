source:
  edition: SBLGNT
  text: ἵνα πάντες τιμῶσι τὸν υἱὸν καθὼς τιμῶσι τὸν πατέρα. ὁ μὴ τιμῶν τὸν υἱὸν οὐ τιμᾷ τὸν πατέρα τὸν πέμψαντα αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/023.yaml
  text: so that all may honor the Son just as they honor the Father. The one who does not honor the Son does not honor the Father who sent him.
translation:
  language: hi
  text: ताकि सभी पुत्र का आदर करें, ठीक वैसे ही जैसे वे पिता का आदर करते हैं। जो पुत्र का आदर नहीं करता, वह उस पिता का भी आदर नहीं करता जिसने उसे भेजा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा लक्षित परिणाम का बोध कराता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से इसकी प्रयोजनात्मक शक्ति बनाए रखता है।
- source_word: πάντες
  choice: सभी
  rationale: बहुवचन ‘सब’ अथवा ‘सभी लोग’ को सूचित करता है। यहाँ ‘सभी’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: τιμῶσι / τιμῶν / τιμᾷ
  choice: आदर करें / आदर करता
  rationale: τιμάω उचित सम्मान और मान देने को व्यक्त करता है। ‘आदर करना’ हिन्दी में सहज है और पूरे पद में यूनानी क्रिया की पुनरावृत्ति को बनाए रखता है।
- source_word: τὸν υἱὸν
  choice: पुत्र
  rationale: यूहन्ना के प्रसंग में यह यीशु के लिए संबंधपरक और मसीही उपाधि है; देवनागरी में ‘पुत्र’ का रूप ही पर्याप्त रूप से स्पष्ट है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह तुलना में प्रबल अनुरूपता दिखाता है। ‘ठीक वैसे ही जैसे’ पुत्र और पिता को दिए जाने वाले आदर के बीच मजबूत समानता को बिना कमजोर किए व्यक्त करता है।
- source_word: τὸν πατέρα
  choice: पिता
  rationale: प्रसंग में यह परमेश्वर के लिए व्यक्तिगत संबंधपरक पद है। ‘पिता’ सीधा और प्रतिष्ठित हिन्दी रूप है।
- source_word: ὁ μὴ τιμῶν
  choice: जो ... आदर नहीं करता
  rationale: संज्ञात्मक कृदन्त एक सामान्य व्यक्ति को सूचित करता है। हिन्दी का संबंधवाचक विन्यास इसके सार्वत्रिक, कथनात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν πέμψαντα αὐτόν
  choice: उस पिता ... जिसने उसे भेजा है
  rationale: कृदन्त पद ‘पिता’ का विशेषण है। हिन्दी संबंधवाचक उपवाक्य प्रेषक के रूप में पिता की पहचान साफ और सहज रखता है।
- source_word: πέμψαντα
  choice: भेजा है
  rationale: πέμπω का सामान्य अर्थ ‘भेजना’ है। ‘नियुक्त किया’ या ‘अधिकार देकर भेजा’ कहना स्रोत से अधिक विशिष्ट अर्थ जोड़ देता।
theological_decisions:
- issue: पुत्र और पिता का आदर करने के बीच तुलना की शक्ति
  choice: καθὼς का अनुवाद ‘ठीक वैसे ही जैसे’ किया गया है।
  alternative: केवल ‘जैसे’
  rationale: यूनानी पाठ आदर में मजबूत अनुरूपता व्यक्त करता है। चुना हुआ रूप इस दावे को कमजोर नहीं करता और साथ ही पद में बाद की धर्मसैद्धान्तिक शब्दावली नहीं जोड़ता।
- issue: पिता को भेजने वाले के रूप में पहचानना
  choice: ‘उस पिता का भी ... जिसने उसे भेजा है’
  alternative: ‘उसे भेजने वाले पिता का’
  rationale: दोनों सम्भव हैं, पर संबंधवाचक उपवाक्य यूनानी कृदन्त का संबंध ‘पिता’ से स्पष्ट रखता है और आधुनिक हिन्दी में अधिक सहज है।
- issue: ग्रीक वर्तमान और भूतकालिक कृदन्त का हिन्दी रूप
  choice: आदर के लिए सामान्य वर्तमान और भेजने के लिए पूर्ण वर्तमान ‘भेजा है’
  alternative: ‘जिसने उसे भेजा’
  rationale: ‘आदर करता’ कथन के सामान्य और निरंतर सत्य को बनाए रखता है। ‘भेजा है’ पूर्व में घटित भेजने की क्रिया के वर्तमान संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘आदर’ की पुनरावृत्ति जानबूझकर सुरक्षित है ताकि मूल की समानांतर संरचना और बल बने रहें।
