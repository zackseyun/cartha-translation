base_translation:
  language: en
  yaml_path: translation/nt/john/005/001.yaml
  text: After these things[a], there was a feast of the Jews[b], and Jesus went up to Jerusalem.
translation:
  language: hi
  text: इन बातों के बाद यहूदियों[b] का एक पर्व[a] था, और यीशु यरूशलेम को ऊपर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धार्मिक उत्सव’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘यहूदियों’ से आशय यहूदी लोगों और उनके एक पर्व से है; यूहन्ना के कुछ अन्य प्रसंगों में यही यूनानी शब्द ‘यहूदिया के निवासी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह अनुवाद बहुवचन ταῦτα को बनाए रखता है और यूहन्ना के कथात्मक संक्रमण को अनावश्यक रूप से सरल नहीं करता।
- source_word: ἦν
  choice: था
  rationale: हिन्दी में ‘एक पर्व था’ स्वाभाविक रूप से पर्व के होने का परिचय देता है और यूनानी अपूर्णकाल का उपयुक्त कथात्मक रूप है।
- source_word: ἑορτὴ
  choice: पर्व
  rationale: ἑορτή धार्मिक उत्सव या पर्व को दर्शाता है। आधुनिक हिन्दी में ‘पर्व’ संक्षिप्त, गरिमापूर्ण और इस यहूदी धार्मिक प्रसंग के लिए स्वाभाविक है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों का
  rationale: इस प्रसंग में संबंधकारक पद उस पर्व को यहूदी लोगों द्वारा मनाया जाने वाला पर्व बताता है; यहाँ क्षेत्रीय ‘यहूदिया-निवासी’ अर्थ की अपेक्षा जातीय-धार्मिक अर्थ अधिक उपयुक्त है।
- source_word: ἀνέβη
  choice: गए
  rationale: ἀναβαίνω का शाब्दिक अर्थ ‘ऊपर जाना’ है और यरूशलेम की यात्रा के लिए यह प्रचलित तीर्थयात्रा-भाषा भी है। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी ‘गए’ रखी गई है, जबकि दिशा-संबंधी सूक्ष्मता पादटिप्पणी में सुरक्षित है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का मानक हिन्दी रूप।
theological_decisions:
- issue: यूहन्ना में Ἰουδαίων का अभिप्राय
  choice: यहूदियों
  alternative: यहूदिया के लोगों का
  rationale: यहाँ शब्द ‘पर्व’ को विशेषित करता है और एक यहूदी धार्मिक आयोजन का संकेत देता है, न कि मुख्यतः यहूदिया क्षेत्र के निवासियों का। पादटिप्पणी व्यापक यूहन्नाई प्रयोग की संभावित भिन्नता को स्वीकार करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘इन बातों के बाद’ स्रोत के बहुवचन संक्रमण को बनाए रखता है। ‘पर्व’ धार्मिक संदर्भ को स्पष्ट करता है, और ‘यरूशलेम गए’ हिन्दी में स्वाभाविक है; ἀνέβη की ‘ऊपर जाने’ वाली सूक्ष्मता पादटिप्पणी में दी गई है।
