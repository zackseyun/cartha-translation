  text: ἄλλος ἐστὶν ὁ μαρτυρῶν περὶ ἐμοῦ, καὶ οἶδα ὅτι ἀληθής ἐστιν ἡ μαρτυρία ἣν μαρτυρεῖ περὶ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/032.yaml
  text: There is another who testifies about me[a], and I know that the testimony which he testifies about me is true.
translation:
  language: hi
  text: एक और है जो मेरे विषय में गवाही देता है,[a] और मैं जानता हूँ कि मेरे विषय में जो गवाही वह देता है, वह सच्ची है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मेरे विषय में साक्ष्य देता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: एक और
  rationale: यह पद किसी दूसरे गवाह की ओर संकेत करता है और पिछले संदर्भ में यीशु की अपनी गवाही से भेद बनाए रखता है। ‘एक और’ स्वाभाविक हिन्दी है तथा व्यक्ति की पहचान तय नहीं करता।
- source_word: ὁ μαρτυρῶν
  choice: जो ... गवाही देता है
  rationale: संज्ञात्मक वर्तमान कृदंत का सतत क्रियात्मक भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: सम्बन्ध या विषयवस्तु का अर्थ स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: यूनानी क्रिया का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: ἀληθής
  choice: सच्ची
  rationale: यहाँ विशेषण गवाही की सत्यता बताता है; ‘सच्ची’ स्वाभाविक है और ‘वैध’ जैसे अधिक व्याख्यात्मक अर्थ से बचता है।
- source_word: ἡ μαρτυρία
  choice: गवाही
  rationale: न्यायिक-साक्ष्य वाले प्रसंग के अनुकूल है और सम्बद्ध क्रिया के साथ शब्दगत कड़ी बनाए रखता है।
- source_word: ἣν μαρτυρεῖ
  choice: जो गवाही वह देता है
  rationale: सम्बन्धवाचक उपवाक्य और संज्ञा-क्रिया की यूहन्नाई पुनरावृत्ति दोनों को स्पष्ट, पठनीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ‘एक और’ (ἄλλος) की पहचान
  choice: अनुवाद में व्यक्ति की पहचान बताए बिना ‘एक और’ रखा गया है।
  alternative: इसे यूहन्ना बपतिस्मा देनेवाला, पिता, अथवा कानूनी अर्थ में किसी अन्य गवाह के रूप में स्पष्ट करना।
  rationale: इस पद में उस व्यक्ति की पहचान प्रत्यक्ष रूप से नहीं दी गई है। अतः अनुवाद मूल पाठ की अस्पष्टता और व्यापक प्रसंग में उपस्थित व्याख्यात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘गवाही देता है’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी में ‘साक्षी देता है’ वैकल्पिक बाइबलीय अभिव्यक्ति के रूप में दी गई है।
