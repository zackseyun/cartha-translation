id: JHN.5.20
reference: John 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ γὰρ πατὴρ φιλεῖ τὸν υἱὸν καὶ πάντα δείκνυσιν αὐτῷ ἃ αὐτὸς ποιεῖ, καὶ μείζονα τούτων δείξει αὐτῷ ἔργα, ἵνα ὑμεῖς θαυμάζητε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/020.yaml
  text: For the Father loves the Son and shows him all that he himself is doing; and he will show him greater works than these[a], so that you may marvel.
translation:
  language: hi
  text: क्योंकि पिता पुत्र से प्रेम करता है और जो कुछ वह स्वयं करता है, वह सब उसे दिखाता है; और वह उसे इनसे भी बड़े काम दिखाएगा, ताकि तुम अचम्भित हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिससे तुम अचम्भित हो जाओगे।” यूनानी में यहाँ प्रयुक्त रचना उद्देश्य व्यक्त कर सकती है और इस संदर्भ में यीशु के श्रोताओं के परिणामी अचम्भे का संकेत भी दे सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: φιλεῖ
  choice: प्रेम करता है
  rationale: यह स्वाभाविक और गरिमापूर्ण हिन्दी है। यूहन्ना में φιλέω और ἀγαπάω के अर्थ परस्पर आ सकते हैं; इसलिए इसे कमतर या केवल स्नेहसूचक प्रेम नहीं बनाया गया।
- source_word: δείκνυσιν / δείξει
  choice: दिखाता है / दिखाएगा
  rationale: प्रत्यक्ष अर्थ और वर्तमान-भविष्य के समान धातुगत संबंध को बनाए रखता है।
- source_word: πάντα ἃ αὐτὸς ποιεῖ
  choice: जो कुछ वह स्वयं करता है, वह सब
  rationale: πάντα की व्यापकता और αὐτός के बलाघात—पिता स्वयं जो करता है—दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: μείζονα τούτων ... ἔργα
  choice: इनसे भी बड़े काम
  rationale: यूहन्ना में ἔργα के लिए ‘काम’ सहज है और यीशु के अर्थपूर्ण कार्यों की ओर संकेत को बनाए रखता है; ‘भी’ हिन्दी में तुलना को स्पष्ट करता है।
- source_word: ἵνα ὑμεῖς θαυμάζητε
  choice: ताकि तुम अचम्भा करो
  rationale: ἵνα और संभावनार्थक क्रिया की उद्देश्य/परिणाम-संबंधी खुली अर्थछाया को यथासंभव बनाए रखता है; बहुवचन श्रोताओं को संबोधित है।
theological_decisions:
- issue: φιλέω द्वारा पिता के पुत्र-प्रेम का स्वरूप
  choice: ‘प्रेम करता है’—किसी कमतर प्रेम का संकेत दिए बिना
  alternative: ‘स्नेह रखता है’
  rationale: विशेष शब्द चुनकर पिता और पुत्र के संबंध में ऐसा स्तरभेद आरोपित नहीं किया गया जिसकी इस पद में आवश्यकता नहीं है।
- issue: ἵνα ὑμεῖς θαυμάζητε का उद्देश्य अथवा परिणाम
  choice: ‘ताकि तुम अचम्भा करो’
  alternative: ‘जिससे तुम अचम्भित हो जाओगे’
  rationale: मुख्य अनुवाद यूनानी उद्देश्यसूचक रचना को रखता है, जबकि संदर्भ में परिणामी आश्चर्य की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, पर गरिमापूर्ण। ‘पिता’ और ‘पुत्र’ संबंधवाचक धर्मवैचारिक पदों के रूप में रखे गए हैं।
