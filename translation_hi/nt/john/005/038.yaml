id: JHN.5.38
reference: John 5:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὸν λόγον αὐτοῦ οὐκ ἔχετε ⸂ἐν ὑμῖν μένοντα⸃, ὅτι ὃν ἀπέστειλεν ἐκεῖνος τούτῳ ὑμεῖς οὐ πιστεύετε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/038.yaml
  text: And you do not have his word abiding in you[a], because you do not believe the one whom he sent.
translation:
  language: hi
  text: और उसका वचन तुममें बना नहीं रहता, क्योंकि जिसे उसने भेजा, उस पर तुम विश्वास नहीं करते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον
  choice: वचन
  rationale: यहाँ λόγος परमेश्वर के प्रकट किए हुए वचन को दर्शाता है। ‘वचन’ यूहन्ना की शब्दावली की प्रतिध्वनि बनाए रखता है और ‘बात’ या ‘संदेश’ की तुलना में मूल शब्द के अधिक निकट है।
- source_word: ἔχετε … μένοντα
  choice: तुममें बना नहीं रहता
  rationale: यह रूप λόγον की निरंतर उपस्थिति के अभाव को स्वाभाविक हिन्दी में व्यक्त करता है। इससे μένω की स्थायित्व और निरंतरता की भावना बनी रहती है, बिना यह अर्थ जोड़े कि सुनने वाले सक्रिय रूप से वचन को रहने नहीं देते।
- source_word: ὅτι
  choice: क्योंकि
  rationale: 'ὅτι यहाँ कारण बताता है: भेजे हुए जन पर उनका अविश्वास इस बात का कारण या प्रमाण है कि उसका वचन उनमें बना नहीं रहता।'
- source_word: ὃν ἀπέστειλεν ἐκεῖνος
  choice: जिसे उसने भेजा है
  rationale: यह वाक्यांश यीशु को पिता द्वारा भेजे गए जन के रूप में व्यक्त करता है। सन्दर्भ में ‘उसने’ का संकेत पिता की ओर स्पष्ट है और ‘उस व्यक्ति ने’ जैसी अस्वाभाविक अभिव्यक्ति से बचता है।
- source_word: τούτῳ … πιστεύετε
  choice: उस पर तुम विश्वास नहीं करते
  rationale: सम्प्रदान कारक τούτῳ को ‘उस पर’ कहना हिन्दी में πιστεύω के व्यक्तिगत लक्ष्य और मूल में उसके बलाघात को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: पिता के वचन के भीतर बने रहने और भेजे हुए जन पर विश्वास के बीच सम्बन्ध
  choice: 'पद के कारणात्मक कथन को यथावत रखा गया है: वे पिता द्वारा भेजे गए जन पर विश्वास नहीं करते, इसलिए उसका वचन उनमें बना नहीं रहता।'
  alternative: इसे विशेष रूप से केवल पवित्रशास्त्र को मन में न रखने, या किसी निश्चित मत के अनुसार पुनर्जन्म अथवा अन्तर्वास के कथन के रूप में समझा जा सकता है।
  rationale: अनुवाद किसी विशिष्ट साम्प्रदायिक व्याख्या को आरोपित नहीं करता और ‘बना नहीं रहता’ के द्वारा यूहन्ना-साहित्य में μένω से जुड़ा धार्मिक तनाव सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वचन’ बाइबिलीय शब्दावली और यूहन्ना के साहित्यिक सन्दर्भ को सुरक्षित रखता है; वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्पष्ट है।
