    issue: ‘जिसे उसने भेजा है’ uses a present-perfect form for ἀπέστειλεν.
    rationale: The Greek uses an aorist (“sent”). Hindi ‘जिसे उसने भेजा’ more directly preserves that verbal reference while remaining natural.
  revised_text: और उसका वचन तुममें बना नहीं रहता, क्योंकि जिसे उसने भेजा, उस पर तुम विश्वास नहीं करते।
