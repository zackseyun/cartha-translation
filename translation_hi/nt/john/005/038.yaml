review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies God as the referent of αὐτοῦ/ἐκεῖνος and Jesus as the one sent. However, the Greek aorist ἀπέστειλεν is most directly represented by the simple past ‘भेजा,’ rather than the present-perfect ‘भेजा है.’ The causal relation introduced by ὅτι is retained correctly.
  naturalness: The wording is generally clear and modern. Moving ‘तुम’ after the relative clause yields a slightly smoother Hindi sentence without changing its emphasis. ‘तुममें बना नहीं रहता’ is a natural rendering of the word’s continuing presence in the hearers.
  terminology: ‘वचन’ is appropriate for λόγος in this Johannine context. ‘उस पर विश्वास नहीं करते’ is idiomatic modern Hindi for the personal object of πιστεύετε and does not force a doctrinal interpretation.
  issues:
