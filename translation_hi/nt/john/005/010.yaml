id: JHN.5.10
reference: John 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔλεγον οὖν οἱ Ἰουδαῖοι τῷ τεθεραπευμένῳ· Σάββατόν ἐστιν, ⸀καὶ οὐκ ἔξεστίν σοι ἆραι τὸν ⸀κράβαττον.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/010.yaml
  text: So the Jews were saying to the man who had been healed[a], “It is the Sabbath[c][b], and it is not lawful for you to carry your mat.”
translation:
  language: hi
  text: इसलिए यहूदी लोग[a] उस मनुष्य से, जिसे चंगा किया गया था, कह रहे थे, “आज सब्त का दिन है; तुम्हें अपनी चटाई[c] ले जाने[b] की अनुमति नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद सन्दर्भ के अनुसार सम्भवतः “यहूदी अगुओं” या “यहूदिया के लोगों” की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या “उठाने” अथवा “उठाकर ले जाने।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ प्रयुक्त शब्द उठाकर ले जाई जा सकने वाली सोने की चटाई या बिछावन के लिए है, आवश्यक नहीं कि वह पूरा पलंग हो।
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकालीन क्रिया बातचीत के जारी रहने या दोहराए जाने का संकेत देती है; ‘कह रहे थे’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले घटनाक्रम से इस प्रतिक्रिया को जोड़ता है और कथात्मक परिणाम का भाव व्यक्त करता है।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी लोग
  rationale: यूनानी पद का सीधा अर्थ रखा गया है; इसी पद में निहित सम्भावित संकुचित संदर्भ को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: τῷ τεθεραπευμένῳ
  choice: उस मनुष्य से, जिसे चंगा किया गया था
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त पूरी हो चुकी चंगाई और उसके वर्तमान परिणाम को व्यक्त करता है; प्रसंग से पुरुष व्यक्ति स्पष्ट है।
- source_word: Σάββατόν ἐστιν
  choice: आज सब्त का दिन है
  rationale: यह समय-संबंधी कथन का स्वाभाविक आधुनिक हिन्दी रूप है; ‘आज’ हिन्दी में कथन को सहज बनाता है और प्रसंग से स्पष्ट समय को व्यक्त करता है।
- source_word: οὐκ ἔξεστίν σοι
  choice: तुम्हें ... की अनुमति नहीं है
  rationale: ἔξεστιν किसी कार्य के अनुमत या वैध होने को बताता है। यह रूप कानूनी-धार्मिक भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἆραι
  choice: ले जाने
  rationale: αἴρω का अर्थ ‘उठाना’ या ‘उठाकर ले जाना’ हो सकता है; यहाँ सब्त के दिन वस्तु ढोने पर आपत्ति है, इसलिए ‘ले जाने’ से प्रसंगगत आशय स्पष्ट रहता है और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: κράβαττον
  choice: चटाई
  rationale: यह उठाकर ले जाई जा सकने वाली सोने की बिछावन या खाट-जैसी वस्तु को दर्शाता है; ‘चटाई’ आधुनिक हिन्दी में स्पष्ट है और बड़े पलंग का भ्रामक बोध नहीं कराती।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का संदर्भ
  choice: यहूदी लोग
  alternative: यहूदी अगुए; यहूदिया के लोग
  rationale: तत्काल पद वक्ताओं को स्पष्ट रूप से अगुए नहीं कहता। इसलिए मूल अभिव्यक्ति की व्यापकता मुख्य पाठ में रखी गई है, जबकि यूहन्ना में इसके सम्भावित संकुचित प्रयोग पाद-टिप्पणी में बताए गए हैं।
- issue: सब्त संबंधी निषेध का स्वरूप
  choice: अनुमति नहीं है
  alternative: व्यवस्था के अनुसार उचित नहीं है
  rationale: मूल में निषेध को अनुमति या वैधता की भाषा में रखा गया है, पर किसी विशेष व्याख्यात्मक परम्परा या व्यवस्था-स्रोत का नाम नहीं लिया गया; इसलिए अनिर्दिष्ट कानूनी-धार्मिक भाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चंगा किया गया था’ धार्मिक हिन्दी में परिचित है और यूनानी कर्मवाच्य को सुरक्षित रखता है। विरामचिह्नों और वाक्य-विन्यास से कथात्मक प्रवाह तथा वक्ताओं की आपत्ति स्पष्ट की गई है।
