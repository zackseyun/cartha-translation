  text: εἰ γὰρ ἐπιστεύετε Μωϋσεῖ, ἐπιστεύετε ἂν ἐμοί, περὶ γὰρ ἐμοῦ ἐκεῖνος ἔγραψεν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/046.yaml
  text: For if you believed Moses[a], you would believe me[b], for he wrote about me.
translation:
  language: hi
  text: क्योंकि यदि तुम मूसा पर विश्वास करते, तो मुझ पर विश्वास करते, क्योंकि उसी ने मेरे विषय में लिखा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले कथन का कारण बताता है और εἰ शर्त प्रस्तुत करता है; इसलिए दोनों संबंध स्पष्ट रखे गए हैं।
- source_word: ἐπιστεύετε Μωϋσεῖ
  choice: तुम मूसा पर विश्वास करते
  rationale: πιστεύω के साथ दत्तिव Μωϋσεῖ व्यक्ति पर विश्वास करने का भाव देता है। हिन्दी में ‘मूसा पर विश्वास करना’ स्वाभाविक है और अगले खंड के समान यूनानी क्रिया को भी समान रूप में रखता है।
- source_word: ἐπιστεύετε ἂν ἐμοί
  choice: तो मुझ पर भी विश्वास करते
  rationale: अपूर्ण भूतकाल के साथ ἄν तथ्य-विपरीत परिणाम व्यक्त करता है। हिन्दी की ‘यदि…तो…करते’ रचना इसे स्वाभाविक रूप से व्यक्त करती है; ‘भी’ मूसा और यीशु पर विश्वास के तर्कगत संबंध को स्पष्ट करता है, बिना ‘में विश्वास’ जैसी अतिरिक्त व्याख्या जोड़े।
- source_word: περὶ γὰρ ἐμοῦ
  choice: क्योंकि … मेरे विषय में
  rationale: περί के साथ संबंधकारक का अर्थ ‘के विषय में/बारे में’ है। ‘मेरे विषय में’ गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी है।
- source_word: ἐκεῖνος
  choice: उसने
  rationale: ἐκεῖνος मूसा की ओर संकेत करने वाला बलयुक्त सर्वनाम है। हिन्दी में ‘उसने’ उस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἔγραψεν
  choice: लिखा था
  rationale: यूनानी अओरिस्ट लेखन की पूर्ण ऐतिहासिक क्रिया बताता है। हिन्दी में ‘लिखा था’ वर्तमान संवाद से पहले मूसा के लिखने को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मूसा की लिखी बातों की यीशु के विषय में गवाही
  choice: क्योंकि उसने मेरे विषय में लिखा था
  alternative: क्योंकि उसी ने मेरे विषय में लिखा था
  rationale: अनुवाद यह दावा सुरक्षित रखता है कि मूसा का लेखन यीशु के विषय में है, पर किसी विशेष पद या विस्तृत मसीही व्याख्या को पाठ में नहीं जोड़ता। ‘उसी ने’ ἐκεῖνος का अधिक बलयुक्त विकल्प है, किन्तु संदर्भ में ‘उसने’ अधिक स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। दोनों ἐπιστεύετε के लिए ‘विश्वास करते’ रखकर मूल की शाब्दिक कड़ी सुरक्षित की गई है।
