  yaml_path: translation/nt/john/005/027.yaml
  text: And he gave him authority to execute judgment[a], because he is the Son of Man.
translation:
  language: hi
  text: और उसने उसे न्याय करने का अधिकार दिया, क्योंकि वह मनुष्य का पुत्र[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह मनुष्य का एक पुत्र है,” अर्थात् क्योंकि वह मानव है। मुख्य पाठ यूहन्ना में इसके संभवतः उपाधि के रूप में प्रयोग को बनाए रखता है।
    reason: 'वैकल्पिक अर्थ: यूनानी में ‘पुत्र’ के पहले निश्चित उपपद नहीं है, इसलिए इस पदबंध को सामान्य मानवता के अर्थ में भी समझा जा सकता है।'
lexical_decisions:
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह शब्द केवल सामर्थ्य नहीं, बल्कि सौंपे गए वैध अधिकार या अधिकार-क्षेत्र को व्यक्त करता है; यहाँ पिता द्वारा पुत्र को न्यायिक अधिकार दिए जाने की बात है।
- source_word: ἔδωκεν
  choice: दिया
  rationale: δίδωμι के अओरिस्ट रूप का सीधा और स्वाभाविक हिन्दी अनुवाद ‘दिया’ है।
- source_word: αὐτῷ
  choice: उसे
  rationale: यह सम्प्रदान कारक सर्वनाम प्रसंग में पुत्र की ओर संकेत करता है।
- source_word: κρίσιν ποιεῖν
  choice: न्याय करने
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘न्याय करना’ है और यहाँ न्यायिक निर्णय देने तथा उसे कार्यान्वित करने का भाव है। ‘न्याय करने’ से यह अर्थ स्वाभाविक हिन्दी में बना रहता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι अधिकार दिए जाने का कारण बताता है, इसलिए कारणवाचक ‘क्योंकि’ उपयुक्त है।
- source_word: υἱὸς ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यद्यपि यहाँ υἱός के पहले निश्चित उपपद नहीं है, यूहन्ना के प्रसंग में यह यीशु की परिचित उपाधि के रूप में प्रयुक्त होने की अधिक संभावना रखता है और दानिय्येल 7 की पृष्ठभूमि को भी प्रतिध्वनित करता है।
- source_word: ἐστίν
  choice: है
  rationale: यह साधारण वर्तमानकालीन संयोजक क्रिया है; इसे विस्तार देने की आवश्यकता नहीं है।
theological_decisions:
- issue: υἱὸς ἀνθρώπου को मसीही उपाधि माना जाए या सामान्य मानवीय अभिव्यक्ति
  choice: मुख्य पाठ में उपाधि के रूप में ‘मनुष्य का पुत्र’
  alternative: ‘एक मनुष्य-पुत्र,’ अर्थात् वह मानव है या मानव स्वभाव में सहभागी है
  rationale: यूहन्ना के सुसमाचार में यह अभिव्यक्ति यीशु की स्थापित आत्म-उपाधि है और न्याय के अधिकार के प्रसंग में दानिय्येल 7 की ओर संकेत कर सकती है। फिर भी यूनानी में उपपद के अभाव के कारण सामान्य मानवता का भाव व्याकरणतः संभव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘न्याय करने का अधिकार’ न्यायिक भाव को स्पष्ट करता है, जबकि ‘मनुष्य का पुत्र’ पारंपरिक और अंतरपाठीय रूप से पहचान योग्य उपाधि को सुरक्षित रखता है।
