  text: ⸂ὃς δὲ⸃ ἀπεκρίθη αὐτοῖς· Ὁ ποιήσας με ὑγιῆ ἐκεῖνός μοι εἶπεν Ἆρον τὸν κράβαττόν σου καὶ περιπάτει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/011.yaml
  text: But he answered them[a], “The one who made me well—that one said to me[b], ‘Pick up your mat and walk.’”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “जिसने मुझे चंगा किया, उसी ने मुझसे कहा, ‘अपनी चटाई[a] उठाओ और चलो।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिछौना”; यूनानी शब्द सोने की साधारण चटाई या हल्के बिछौने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह कथात्मक संवाद में प्रयुक्त सामान्य उत्तर-सूचक क्रिया का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Ὁ ποιήσας με ὑγιῆ
  choice: जिसने मुझे चंगा किया
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत और स्वास्थ्य बहाल करने के अर्थ को सहज हिन्दी में व्यक्त करता है; प्रसंग शारीरिक चंगाई का है।
- source_word: ἐκεῖνός
  choice: उसी ने
  rationale: यूनानी संकेतवाचक सर्वनाम के बलाघात को बनाए रखता है और चंगा करने वाले व्यक्ति पर स्पष्ट जोर देता है।
- source_word: Ἆρον
  choice: उठाओ
  rationale: यह ठोस कार्य की आज्ञा है; ‘उठाओ’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: κράβαττόν
  choice: चटाई
  rationale: यह शब्द साधारण सोने की चटाई या बिछौने को दर्शाता है, आधुनिक अर्थ के बड़े पलंग को नहीं।
- source_word: περιπάτει
  choice: चलो
  rationale: चंगाई के इस आदेश में वर्तमान आज्ञार्थक का सहज हिन्दी रूप ‘चलो’ है; ‘चलते रहो’ यहाँ अनावश्यक रूप से प्रगतिशील अर्थ को प्रमुख कर देगा।
- source_word: δὲ
  choice: पर
  rationale: पिछले कथन के उत्तर में हल्के विरोध या प्रत्युत्तर को स्वाभाविक ढंग से दर्शाता है।
theological_decisions:
- issue: चंगाई के वर्णन का संभावित व्यापक धार्मिक अर्थ
  choice: मुझे चंगा किया
  alternative: मुझे सम्पूर्ण किया
  rationale: तात्कालिक प्रसंग शारीरिक आरोग्यता का है। ‘सम्पूर्ण किया’ मूल पाठ में अनिवार्य न होने वाला व्यापक आध्यात्मिक अर्थ जोड़ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसी ने’ मूल यूनानी के बलाघात को स्वाभाविक हिन्दी में सुरक्षित रखता है।
