  text: ἀλλὰ ἔγνωκα ὑμᾶς ὅτι τὴν ἀγάπην τοῦ θεοῦ οὐκ ἔχετε ἐν ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/042.yaml
  text: 'But I know you: you do not have the love of God in yourselves.'
translation:
  language: hi
  text: 'पर मैं तुम्हें जानता हूँ: तुम्हारे भीतर परमेश्वर का प्रेम नहीं है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप में: “तुम्हारे भीतर परमेश्वर के प्रति प्रेम नहीं है।” यूनानी वाक्यांश का व्यापक अर्थ “परमेश्वर से आने वाला प्रेम” या “परमेश्वर का अपना प्रेम” भी हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले कथन से स्पष्ट और प्रबल विरोध दिखाता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἔγνωκα
  choice: मैं जानता हूँ
  rationale: पूर्णकालिक रूप यहाँ स्थिर, प्राप्त ज्ञान व्यक्त करता है; हिन्दी का वर्तमानकाल इस भाव को सहजता से व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह बहुवचन प्रत्यक्ष कर्म है; प्रसंग में यीशु अपने विरोधियों के समूह को संबोधित कर रहे हैं।
- source_word: ὅτι
  choice: ':'
  rationale: आगे का उपवाक्य बताता है कि यीशु उनके विषय में क्या जानते हैं; हिन्दी में द्विबिंदु इस आशय को स्वाभाविक ढंग से जोड़ता है।
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: परमेश्वर का प्रेम
  rationale: यह रूप यूनानी संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है—यह परमेश्वर के प्रति प्रेम अथवा परमेश्वर से आने वाला/उनका प्रेम हो सकता है।
- source_word: οὐκ ἔχετε
  choice: नहीं है
  rationale: ἔχω का मूल अर्थ ‘रखना/पास होना’ है, पर ‘भीतर ... नहीं है’ हिन्दी में उपस्थित न होने की निरंतर अवस्था अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ἑαυτοῖς
  choice: तुम्हारे भीतर
  rationale: यह आत्मिक या आंतरिक उपस्थिति का भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है; बहुवचन संबोधन ‘तुम्हारे’ में बना रहता है।
theological_decisions:
- issue: ‘परमेश्वर का प्रेम’ में संबंधकारक का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर का प्रेम’ रखकर अस्पष्टता सुरक्षित रखी गई।
  alternative: ‘परमेश्वर के प्रति प्रेम’; अथवा ‘परमेश्वर से मिलने वाला/परमेश्वर का अपना प्रेम’
  rationale: τοῦ θεοῦ को वस्तुगत संबंधकारक मानने पर अर्थ परमेश्वर के प्रति प्रेम है, जबकि उद्गम या कर्तृवाचक संबंधकारक मानने पर परमेश्वर से आने वाला या उनका प्रेम हो सकता है। प्रसंग पहले अर्थ का समर्थन करता है, पर व्याकरण स्वयं उसे अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘परमेश्वर’ सामान्य बाइबलीय शब्दावली के अनुरूप है। संबोधन बहुवचन ‘तुम’ रूप में रखा गया है; मुख्य पाठ संक्षिप्त है और स्रोत की संबंधकारकीय अस्पष्टता को नहीं सुलझाता।
