  text: ἐκεῖνος ἦν ὁ λύχνος ὁ καιόμενος καὶ φαίνων, ὑμεῖς δὲ ἠθελήσατε ἀγαλλιαθῆναι πρὸς ὥραν ἐν τῷ φωτὶ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/035.yaml
  text: He was the lamp that was burning and shining[a], and you were willing to rejoice for a time in his light.
translation:
  language: hi
  text: वह जलता और चमकता हुआ दीपक था, और तुमने थोड़े समय के लिए उसके प्रकाश में आनन्दित होना चाहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖνος
  choice: वह
  rationale: यह संकेतवाचक सर्वनाम प्रसंग में यूहन्ना की ओर बलपूर्वक संकेत करता है; ‘वह’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λύχνος
  choice: दीपक
  rationale: यह किसी अमूर्त प्रकाश नहीं, बल्कि जलने वाले दीपक को दर्शाता है और यूहन्ना को स्वयं ‘ज्योति’ कहने से बचाता है।
- source_word: καιόμενος
  choice: जलता हुआ
  rationale: वर्तमान कृदन्त दीपक के लगातार जलते रहने की अवस्था व्यक्त करता है।
- source_word: φαίνων
  choice: चमकता हुआ
  rationale: यहाँ अर्थ प्रकाश फैलाने का है; ‘चमकता’ ‘जलता’ के साथ सहज और स्पष्ट है।
- source_word: ἠθελήσατε
  choice: चाहते थे
  rationale: यह उनकी इच्छा या तत्परता व्यक्त करता है; हिन्दी में ‘चाहते थे’ स्वाभाविक है और स्थायी प्रतिबद्धता का अर्थ नहीं जोड़ता।
- source_word: ἀγαλλιαθῆναι
  choice: आनन्द मनाना
  rationale: क्रिया प्रबल आनन्द या उल्लास व्यक्त करती है; यह पद सामान्य पाठक के लिए सुबोध और गरिमापूर्ण है।
- source_word: πρὸς ὥραν
  choice: कुछ समय तक
  rationale: यह मुहावरा सीमित अवधि को बताता है, आवश्यक रूप से एक शाब्दिक घंटे को नहीं।
- source_word: ἐν τῷ φωτὶ αὐτοῦ
  choice: उसके प्रकाश में
  rationale: ‘में’ मूल रूपक को बनाए रखता है कि वे यूहन्ना के प्रकाश के दायरे में आनन्दित हुए।
theological_decisions:
- issue: यूहन्ना और यीशु के विषय में प्रकाश-रूपक का भेद
  choice: यूहन्ना को ‘दीपक’ कहा गया है, ‘ज्योति’ या स्वयं ‘प्रकाश’ नहीं।
  alternative: वह प्रकाश था।
  rationale: मूल में λύχνος है, φῶς नहीं। यह यूहन्ना को प्रकाश देने वाला साक्षी दिखाता है, पर उसे परम ज्योति के समान नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘कुछ समय तक’ मुहावरे का अर्थ मुख्य पाठ में स्पष्ट करता है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं है।
