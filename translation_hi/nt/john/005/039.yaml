  text: Ἐραυνᾶτε τὰς γραφάς, ὅτι ὑμεῖς δοκεῖτε ἐν αὐταῖς ζωὴν αἰώνιον ἔχειν· καὶ ἐκεῖναί εἰσιν αἱ μαρτυροῦσαι περὶ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/john/005/039.yaml
  text: You search the Scriptures because you think that in them you have eternal life[a]; and these are the ones that testify about me.
translation:
  language: hi
  text: तुम पवित्र शास्त्रों में खोज करते हो, क्योंकि तुम समझते हो कि उनमें तुम्हें अनन्त जीवन प्राप्त है[a]; और यही वे शास्त्र हैं जो मेरे विषय में गवाही देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र शास्त्रों में खोज करो,” यदि Ἐραυνᾶτε को विधानवाचक के बजाय आज्ञार्थक माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐραυνᾶτε
  choice: तुम ... खोज करते हो
  rationale: यह रूप विधानवाचक और आज्ञार्थक दोनों हो सकता है। निकटवर्ती संदर्भ में यीशु उनके वर्तमान व्यवहार का वर्णन करते जान पड़ते हैं, इसलिए मुख्य पाठ में विधानवाचक अर्थ रखा गया है; आज्ञार्थक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: τὰς γραφάς
  choice: पवित्र शास्त्रों
  rationale: यूहन्ना के संदर्भ में यह इस्राएल के मान्य पवित्र लेखों को सूचित करता है। हिंदी में बहुवचन ‘पवित्र शास्त्रों’ मूल के बहुवचन और धार्मिक आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: 'यहाँ ὅτι को कारणसूचक मानना वाक्य के तर्क के अनुकूल है: वे इस कारण शास्त्रों में खोज करते हैं कि उनमें अनन्त जीवन पाने का विश्वास रखते हैं।'
- source_word: δοκεῖτε
  choice: तुम समझते हो
  rationale: यह उनके विश्वास या धारणा को व्यक्त करता है। ‘समझते हो’ सहज आधुनिक हिंदी है और बिना अनावश्यक तीखेपन के आलोचनात्मक स्वर बनाए रखता है।
- source_word: ἐν αὐταῖς
  choice: उनमें
  rationale: पूर्वसर्ग ἐν का स्थानसूचक भाव सीधे रखा गया है और सर्वनाम का संदर्भ पवित्र शास्त्रों से है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह यूहन्ना-साहित्य का प्रमुख पद है और हिंदी बाइबलीय प्रयोग में स्पष्ट तथा स्थापित है।
- source_word: ἐκεῖναί
  choice: यही वे शास्त्र
  rationale: स्त्रीलिंग बहुवचन संकेतवाचक पद पीछे आए ‘शास्त्रों’ की ओर लौटता है और बल देता है। हिंदी में संज्ञा दोहराकर संदर्भ स्पष्ट किया गया तथा ‘यही’ से उसका बल सुरक्षित रखा गया है।
- source_word: αἱ μαρτυροῦσαι
  choice: जो ... गवाही देते हैं
  rationale: μαρτυρέω यूहन्ना में महत्त्वपूर्ण साक्ष्य-संबंधी क्रिया है। ‘गवाही देना’ उसका स्वाभाविक हिंदी समतुल्य है और न्यायिक-साक्ष्य का भाव भी रखता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: यह περί के ‘के बारे में/के विषय में’ अर्थ को dignified और स्पष्ट आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: 'Ἐραυνᾶτε का भाव: विधानवाचक या आज्ञार्थक'
  choice: 'विधानवाचक: ‘तुम पवित्र शास्त्रों में खोज करते हो’'
  alternative: 'आज्ञार्थक: ‘पवित्र शास्त्रों में खोज करो’'
  rationale: यूनानी रूप दोनों अर्थों की अनुमति देता है। अगले कारणसूचक खंड और आगे के प्रसंग में यीशु अपने विरोधियों के वर्तमान शास्त्र-अध्ययन की अपर्याप्तता उजागर करते हैं, इसलिए विधानवाचक अर्थ मुख्य पाठ में अधिक संभावित है। वास्तविक व्याकरणिक अस्पष्टता को मिटाने के बजाय वैकल्पिक आज्ञार्थक अर्थ पादटिप्पणी में दिया गया है।
- issue: अनन्त जीवन और पवित्र शास्त्रों का संबंध
  choice: ‘उनमें तुम्हें अनन्त जीवन मिलता है’ को उनकी धारणा के रूप में δοκεῖτε के अधीन रखा गया है
  alternative: इसे यह प्रत्यक्ष दावा मानना कि शास्त्र स्वयं स्वतंत्र रूप से अनन्त जीवन प्रदान करते हैं
  rationale: वाक्य उनके विचार का वर्णन करता है और फिर शास्त्रों की मसीह-विषयक गवाही की ओर ध्यान दिलाता है। अनुवाद इस तनाव को बनाए रखता है और उससे आगे कोई संप्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘पवित्र शास्त्र’, ‘अनन्त जीवन’ और ‘गवाही देना’ जैसे परिचित बाइबलीय पद बनाए गए हैं। मूल यूनानी की वास्तविक क्रियाभाव-संबंधी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
