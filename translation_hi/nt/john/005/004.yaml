  yaml_path: translation/nt/john/005/004.yaml
  text: For an angel would go down into the pool from time to time and stir up the water. Therefore, the first one to step in after the stirring of the water would become well from whatever disease afflicted him.
translation:
  language: hi
  text: क्योंकि समय-समय पर एक स्वर्गदूत उस कुण्ड में उतरता था और पानी को हिला देता था। तब पानी के हिलने के बाद जो कोई सबसे पहले उसमें उतरता, वह जिस भी रोग से ग्रस्त होता था, उससे चंगा हो जाता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद (और पद 3 का उत्तरार्ध) सबसे प्राचीन यूनानी पपीरसों—जैसे तीसरी शताब्दी के पपीरस 66 और पपीरस 75—तथा चौथी शताब्दी की प्रमुख पांडुलिपियों सीनैटिकस और वैटिकनस में नहीं मिलता। यह बाइजैन्टाइन बहुसंख्यक पाठ-परंपरा और प्रारंभिक लैटिन तथा सीरियाई अनुवादों में मिलता है। अनेक विद्वान इसे यह समझाने के लिए जोड़ा गया एक आरंभिक प्रतिलिपिकार का स्पष्टीकरण मानते हैं कि अशक्त लोग कुण्ड के पास क्यों इकट्ठे होते थे।
    reason: textual_critical
lexical_decisions:
- source_word: κατὰ καιρὸν
  choice: समय-समय पर
  rationale: यह पदबंध किसी निश्चित ऋतु के बजाय बीच-बीच में होने वाली घटना को दर्शाता है।
- source_word: κατέβαινεν
  choice: उतरता ... था
  rationale: अपूर्ण भूतकाल यहाँ अतीत में बार-बार या प्रथागत रूप से होने वाली क्रिया व्यक्त करता है।
- source_word: ἐτάρασσεν
  choice: हिला देता था
  rationale: पानी के विक्षुब्ध या आंदोलित किए जाने का सहज और स्पष्ट हिन्दी रूप।
- source_word: ὁ ... πρῶτος ἐμβὰς
  choice: जो कोई सबसे पहले उसमें उतरता
  rationale: ग्रीक कृदंत को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है; संदर्भ में कुण्ड में प्रवेश निहित है।
- source_word: ὑγιὴς ἐγίνετο
  choice: चंगा हो जाता था
  rationale: अपूर्ण भूतकाल के प्रथागत पक्ष को बनाए रखते हुए रोग से स्वस्थ होने का सहज बाइबलीय हिन्दी रूप।
- source_word: ᾧ δήποτε κατείχετο νοσήματι
  choice: वह जिस किसी रोग से ग्रस्त होता
  rationale: κατέχω के शाब्दिक 'पकड़े रखना' को रोग के साथ उसके मुहावरेदार अर्थ 'ग्रस्त होना' में प्रस्तुत किया गया है, और δήποτε की व्यापकता सुरक्षित है।
theological_decisions:
- issue: पाठालोचनात्मक स्थिति
  choice: दिए गए बाइजैन्टाइन स्रोत के अनुसार पद को मुख्य पाठ में अनूदित किया और उसकी पांडुलिपीय स्थिति को पादटिप्पणी में स्पष्ट किया।
  alternative: पद को मुख्य पाठ से हटाना या कोष्ठकों में रखना।
  rationale: निर्दिष्ट मूल-पाठ संस्करण में यह पद उपस्थित है; फिर भी अत्यंत प्राचीन यूनानी साक्ष्यों में इसकी अनुपस्थिति पाठकों के लिए महत्वपूर्ण है और उसे छिपाया नहीं जाना चाहिए।
- issue: स्वर्गदूत और चंगाई के कथन की वाचिक प्रस्तुति
  choice: ग्रीक पाठ के कथन को सीधे अनूदित किया।
  alternative: इसे केवल लोगों की मान्यता बताने के लिए 'कहा जाता था' या 'लोग मानते थे' जोड़ना।
  rationale: मूल यूनानी में ऐसा कोई स्पष्ट सीमांकन नहीं है; व्याख्यात्मक दूरी जोड़ना पाठ की अस्पष्टता और तनाव को अनुचित रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। 'कुण्ड', 'स्वर्गदूत' और 'चंगा' सामान्य बाइबलीय शब्दावली के रूप में रखे गए हैं; वाक्य-रचना प्रथागत भूतकाल को सहज हिन्दी में व्यक्त करती है।
