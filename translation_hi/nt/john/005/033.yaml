translation:
  language: hi
  text: तुमने यूहन्ना के पास भेजा है, और उसने सत्य की गवाही दी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम लोगों ने
  rationale: मूल में कर्ता-सर्वनाम स्पष्ट रूप से आया है और संबोधन बहुवचन है। ‘तुम लोगों ने’ बहुवचन तथा हल्के बल—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπεστάλκατε
  choice: लोगों को भेजा है
  rationale: पूर्णकालिक क्रिया पूर्व में किए गए भेजने के कार्य को वर्तमान प्रसंग से जोड़ती है। हिन्दी में ‘भेजा है’ इसे स्वाभाविक रूप से व्यक्त करता है; ‘लोगों को’ भेजे गए व्यक्तियों को स्पष्ट करने के लिए प्रसंगानुकूल पूरक है।
- source_word: πρὸς Ἰωάννην
  choice: यूहन्ना के पास
  rationale: किसी व्यक्ति की ओर भेजने के अर्थ में πρός का स्वाभाविक हिन्दी रूप ‘के पास’ है। मूल की तरह केवल ‘यूहन्ना’ नाम रखा गया है।
- source_word: μεμαρτύρηκε
  choice: गवाही दी है
  rationale: यूनानी पूर्णकाल बीती हुई गवाही की वर्तमान प्रासंगिकता बनाए रखता है। ‘गवाही दी है’ आधुनिक हिन्दी में स्पष्ट है और साक्ष्य संबंधी भाव भी सुरक्षित रखता है।
- source_word: τῇ ἀληθείᾳ
  choice: सत्य की
  rationale: ‘सत्य की गवाही देना’ स्वाभाविक हिन्दी प्रयोग है और निश्चित पदबंध ‘सत्य’ की यूहन्नाई प्रतिध्वनि को बिना विस्तार दिए बनाए रखता है।
theological_decisions:
- issue: यूहन्ना के लेखन में ‘सत्य’ का अर्थ
  choice: सत्य
  alternative: सच्चाई
  rationale: निश्चित उपपद सहित ἀλήθεια यहाँ सामान्य सत्यता से अधिक व्यापक धार्मिक अर्थ भी रख सकता है। ‘सत्य’ उस संभावित गहराई को सुरक्षित रखता है, पर उसका अर्थ किसी एक धर्मसैद्धांतिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। बहुवचन संबोधन तथा मूल के दोनों पूर्णकालिक क्रियारूपों की वर्तमान प्रासंगिकता को बनाए रखा गया है।
