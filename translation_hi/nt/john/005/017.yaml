- from: परन्तु उसने उन्हें उत्तर दिया, “मेरा पिता अब तक काम करता आ रहा है, और मैं भी काम कर रहा हूँ।”
  to: पर उसने उन्हें उत्तर दिया, “मेरे पिता अब तक काम कर रहे हैं[a], और मैं भी काम कर रहा हूँ।”
  rationale: The revision preserves the Greek contrastive response, the temporal scope of ‘until now,’ and the unsoftened parallel between the Father’s work and Jesus’ work. It uses idiomatic respectful Hindi and matches the progressive aspect in both coordinated clauses, while the footnote transparently records the equally possible simple-present rendering.
