  yaml_path: translation/nt/john/005/017.yaml
  text: But he answered them[a], “My Father is working until now, and I also am working.”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “मेरे पिता अब तक काम कर रहे हैं[a], और मैं भी काम कर रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पिता अब तक काम करते हैं, और मैं भी काम करता हूँ।” यूनानी वर्तमान काल का अनुवाद साधारण वर्तमान या जारी क्रिया के रूप में किया जा सकता है; यहाँ जारी क्रिया का रूप चुना गया है, ताकि कार्य के निरंतर होने का भाव स्पष्ट रहे।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले आरोप के प्रति यीशु के उत्तर में हल्का विरोध दर्शाता है; ‘परन्तु’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀπεκρίνατο αὐτοῖς
  choice: उसने उन्हें उत्तर दिया
  rationale: मध्यवाच्य रूप और सम्प्रदान कारक का सीधा, स्वाभाविक हिन्दी अनुवाद। संदर्भ से कर्ता यीशु स्पष्ट है।
- source_word: Ὁ πατήρ μου
  choice: मेरा पिता
  rationale: मूल के व्यक्तिगत संबंध और ‘पिता’ के ईश्वरीय संदर्भ को बनाए रखता है; हिन्दी में अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἕως ἄρτι
  choice: अब तक
  rationale: यह वाक्यांश अतीत से वर्तमान क्षण तक जारी अवस्था या क्रिया को सूचित करता है; ‘अब तक’ इसका संक्षिप्त और स्वाभाविक समतुल्य है।
- source_word: ἐργάζεται
  choice: काम करता आ रहा है
  rationale: वर्तमान काल को ἕως ἄρτι के साथ पढ़ने पर जारी क्रिया का भाव उभरता है। यह हिन्दी रूप पिता के काम के अब तक निरन्तर होने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κἀγὼ
  choice: और मैं भी
  rationale: κἀγώ में संयोजन और समावेशी बल दोनों हैं; ‘और मैं भी’ यीशु के काम को पिता के काम के समानांतर रखता है।
- source_word: ἐργάζομαι
  choice: काम कर रहा हूँ
  rationale: वर्तमान काल की जारी क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पिता तथा यीशु के काम के जानबूझकर रखे गए समानांतर को बनाए रखता है।
theological_decisions:
- issue: सब्त के संदर्भ में यीशु के काम और पिता के काम का संबंध
  choice: पिता की अब तक जारी सक्रियता और यीशु की वर्तमान सक्रियता को सीधे तथा समानांतर रूप में रखना।
  alternative: ‘मेरा पिता अब तक काम करता है, और मैं भी काम करता हूँ।’
  rationale: यूनानी पाठ पिता और यीशु की सक्रियता के बीच सशक्त समानांतर प्रस्तुत करता है। अनुवाद इसे न तो नरम करता है, न इसमें सब्त, ईश्वरीय अधिकार या समानता के विषय में पद से बाहर की व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘काम’ सामान्य और व्यापक है तथा ἐργάζομαι की अस्पष्टता को बनाए रखता है। हिन्दी में काल-पक्ष की स्वाभाविकता के लिए पहले खंड में ‘करता आ रहा है’ और दूसरे में ‘कर रहा हूँ’ रखा गया है।
