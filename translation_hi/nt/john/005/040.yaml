  text: Yet you are not willing to come to me so that you may have life[a][b].
translation:
  language: hi
  text: फिर भी तुम मेरे पास आना नहीं चाहते, ताकि तुम्हें जीवन मिले।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम मेरे पास आना नहीं चाहते, ताकि तुम्हें जीवन मिले।” यूनानी संयोजक का सीधा अनुवाद “और” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूहन्ना के सुसमाचार में “जीवन” शब्द अक्सर परमेश्वर से प्राप्त जीवन, अर्थात् अनन्त जीवन, का व्यापक भाव रखता है; फिर भी यहाँ “अनन्त” शब्द स्पष्ट रूप से नहीं आया है।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ
  choice: फिर भी
  rationale: καί का सामान्य अर्थ ‘और’ है, पर यहाँ पिछले कथन के साथ विरोध का भाव है। ‘फिर भी’ उस संदर्भगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: οὐ θέλετε
  choice: तुम ... नहीं चाहते
  rationale: θέλω इच्छा या चाह को व्यक्त करता है। ‘नहीं चाहते’ आधुनिक हिन्दी में स्वाभाविक है और ‘इनकार करते हो’ की अपेक्षा कम व्याख्यात्मक रहते हुए इच्छाशक्ति के भाव को बनाए रखता है।
- source_word: ἐλθεῖν πρός με
  choice: मेरे पास आना
  rationale: ἐλθεῖν और πρός के इस प्रयोग का सहज अर्थ ‘मेरे पास आना’ है। यूहन्ना में इसका विश्वास से गहरा संबंध हो सकता है, पर मूल रूपक को ‘मुझ पर विश्वास करना’ कहकर व्याख्यायित नहीं किया गया।
- source_word: ἵνα
  choice: ताकि
  rationale: ἵνα यहाँ उद्देश्य बताता है। ‘ताकि’ स्पष्ट, संक्षिप्त और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: ζωὴν
  choice: जीवन
  rationale: ζωή का सीधा अर्थ ‘जीवन’ है। यूहन्ना में इसमें परमेश्वर से मिलने वाले अनन्त जीवन की गूँज है, पर इस पद में αἰώνιος नहीं है, इसलिए मुख्य पाठ में ‘अनन्त’ नहीं जोड़ा गया।
- source_word: ἔχητε
  choice: तुम्हें ... मिले
  rationale: ἵνα के बाद आया वर्तमान संभावनार्थक क्रियारूप उद्देश्य को व्यक्त करता है। हिन्दी में ‘ताकि तुम्हें जीवन मिले’ अर्थ को स्वाभाविक रूप से पहुँचाता है; अधिक रूपगत ‘ताकि तुम जीवन रखो’ असहज होता।
theological_decisions:
- issue: ζωὴν का अनुवाद ‘जीवन’ किया जाए या ‘अनन्त जीवन’
  choice: जीवन
  alternative: अनन्त जीवन
  rationale: यूहन्ना के सुसमाचार में ‘जीवन’ प्रायः उद्धार और परमेश्वर से मिलने वाले अनन्त जीवन का गहरा अर्थ रखता है, पर यहाँ ‘अनन्त’ शब्द स्पष्टतः नहीं है। इसलिए मुख्य पाठ मूल की शब्दगत सीमा बनाए रखता है।
- issue: ‘मेरे पास आना’ को मुख्य पाठ में विश्वास करने के अर्थ में खोलना
  choice: मेरे पास आना
  alternative: मुझ पर विश्वास करना / विश्वास के साथ मेरे पास आना
  rationale: संदर्भ में यीशु के पास आना विश्वास से संबंधित है, फिर भी स्रोत पाठ आने की ठोस छवि का प्रयोग करता है। उसी छवि को सुरक्षित रखने से यूहन्ना की अभिव्यक्ति और उसकी अर्थगत गहराई बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। ‘तुम’ बहुवचन श्रोताओं को संबोधित करता है। मुख्य पाठ में यूहन्ना की ‘मेरे पास आना’ और ‘जीवन’ संबंधी मूल छवियाँ बिना व्याख्यात्मक विस्तार के सुरक्षित रखी गई हैं।
