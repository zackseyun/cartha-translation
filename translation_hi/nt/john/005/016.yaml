source:
  edition: SBLGNT
  text: καὶ διὰ τοῦτο ἐδίωκον ⸂οἱ Ἰουδαῖοι τὸν Ἰησοῦν⸃ ὅτι ταῦτα ἐποίει ἐν σαββάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/016.yaml
  text: And because of this the Jews were persecuting Jesus[a], because he was doing these things on the Sabbath.
translation:
  language: hi
  text: और इसी कारण यहूदी यीशु को सताते थे[a], क्योंकि वह सब्त के दिन ये काम कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदिया के लोग’; अथवा संदर्भ के अनुसार, ‘यहूदी अगुवे।’ यूहन्ना के सुसमाचार में यह शब्द प्रायः यीशु का विरोध करने वाले किसी विशेष समूह के लिए प्रयुक्त होता है, न कि बिना किसी भेद के हर यहूदी व्यक्ति के लिए।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पदबंध पिछली घटना को विरोध का कारण बताता है। ‘इसी कारण’ हिन्दी में इसके कारणात्मक बल को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐδίωκον
  choice: सताते थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली विरोधी कार्रवाई को दर्शाता है। ‘सताते थे’ शत्रुतापूर्ण उत्पीड़न का भाव रखता है, पर पद 18 में आने वाली हत्या की मंशा को समय से पहले नहीं जोड़ता।
- source_word: οἱ Ἰουδαῖοι
  choice: यहूदी
  rationale: यह यूनानी पद का सीधा जातीय-धार्मिक अनुवाद है। मुख्य पाठ में इसे ‘यहूदी अगुवे’ करके संदर्भ को अनावश्यक रूप से संकरा नहीं किया गया; संदर्भगत सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: ταῦτα
  choice: ये काम
  rationale: बहुवचन संकेतवाचक शब्द ठीक पहले वर्णित कार्यों की ओर लौटता है। ‘ये काम’ आधुनिक हिन्दी में स्वाभाविक रहते हुए बहुवचन संदर्भ को बनाए रखता है।
- source_word: ἐποίει
  choice: कर रहा था
  rationale: अपूर्ण भूतकाल की जारी क्रिया को ‘कर रहा था’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν σαββάτῳ
  choice: सब्त के दिन
  rationale: यह हिन्दी में सब्त के समय किए गए कार्य को बताने का स्वाभाविक ढंग है और कथानक के संदर्भ के अनुकूल है।
theological_decisions:
- issue: यूहन्ना में οἱ Ἰουδαῖοι का अभिप्रेत समूह
  choice: मुख्य पाठ में ‘यहूदी’
  alternative: ‘यहूदिया के लोग’ या, संदर्भानुसार, ‘यहूदी अगुवे’
  rationale: मूल यूनानी की वास्तविक व्यापकता बनाए रखने के लिए मुख्य पाठ सीधा अनुवाद रखता है। फिर भी यूहन्ना में यह पद कई बार यीशु का विरोध करने वाले एक विशेष समूह को सूचित करता है; इसलिए पादटिप्पणी इसे सभी यहूदी लोगों पर लागू करने से रोकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सताते थे’ और ‘कर रहा था’ यूनानी अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया को हिन्दी में स्वाभाविक रूप से व्यक्त करते हैं।
