base_translation:
  language: en
  yaml_path: translation/nt/john/005/012.yaml
  text: So they asked him[a], “Who is the man who said to you, ‘Pick it up and walk’?”
translation:
  language: hi
  text: इसलिए उन्होंने उससे पूछा, “वह आदमी कौन है जिसने तुमसे कहा, ‘इसे उठा लो[a] और चलो’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से ‘उठा लो और चलो’ है। ‘इसे’ पिछले प्रसंग से समझा जाता है और उस चटाई या बिछौने को बताता है जिस पर वह आदमी लेटा था।
    reason: मूल में निहित कर्म को हिन्दी में स्पष्ट करने के लिए
lexical_decisions:
- source_word: ἠρώτησαν
  choice: उन्होंने … पूछा
  rationale: यह ἐρωτάω का भूतकालीन बहुवचन रूप है। ‘पूछा’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में अनावश्यक रूप से शत्रुता का भाव नहीं जोड़ता।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकले परिणाम या कथा के तार्किक क्रम को दिखाता है। यहाँ ‘इसलिए’ उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτόν
  choice: उससे
  rationale: यह कर्मकारक एकवचन सर्वनाम चंगा हुए व्यक्ति की ओर संकेत करता है। हिन्दी में ‘पूछना’ के साथ ‘उससे’ स्वाभाविक रचना है।
- source_word: Τίς ἐστιν ὁ ἄνθρωπος
  choice: वह आदमी कौन है
  rationale: प्रश्न एक निश्चित पुरुष के बारे में है; ‘वह आदमी कौन है’ मूल की पहचान पूछने वाली सीधी रचना को सहज हिन्दी में रखता है।
- source_word: ὁ εἰπών σοι
  choice: जिसने तुमसे कहा
  rationale: आर्टिक्युलर एओरिस्ट कृदंत उस आदमी की पहचान उसके पहले कहे वचन से कराता है। ‘जिसने तुमसे कहा’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: Ἆρον
  choice: इसे उठा लो
  rationale: यह αἴρω का आदेशवाचक रूप है। मूल यूनानी में वस्तु कही नहीं गई, पर पिछले प्रसंग की चटाई/बिछौना अभिप्रेत है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘इसे’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
- source_word: καὶ περιπάτει
  choice: और चलो
  rationale: περιπατέω का वर्तमान आदेशवाचक रूप है। ‘और चलो’ आदेश का स्वाभाविक अर्थ देता है, बिना क्रिया-पक्ष से आवश्यकता से अधिक अर्थ निकाले।
