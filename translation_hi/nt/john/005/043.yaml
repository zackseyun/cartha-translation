  text: ἐγὼ ἐλήλυθα ἐν τῷ ὀνόματι τοῦ πατρός μου καὶ οὐ λαμβάνετέ με· ἐὰν ἄλλος ἔλθῃ ἐν τῷ ὀνόματι τῷ ἰδίῳ, ἐκεῖνον λήμψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/043.yaml
  text: I have come in my Father's name[a], and you do not receive me. If another comes in his own name[b], you will receive him.
translation:
  language: hi
  text: मैं अपने पिता के नाम से आया हूँ[a], और तुम मुझे ग्रहण नहीं करते। यदि कोई दूसरा अपने ही नाम से आए[b], तो तुम उसे ग्रहण करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अपने पिता के अधिकार से।” यूनानी मुहावरा “नाम से” किसी के प्रतिनिधि के रूप में या उसके अधिकार से आने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, “अपने ही अधिकार से।” यह वाक्यांश यीशु के अपने पिता के नाम से आने के ठीक विपरीत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλήλυθα
  choice: आया हूँ
  rationale: यूनानी पूर्णकाल पहले हुए आगमन के वर्तमान परिणाम को व्यक्त करता है; ‘आया हूँ’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ὀνόματι τοῦ πατρός μου
  choice: अपने पिता के नाम से
  rationale: यह यूनानी मुहावरा प्रतिनिधित्व और अधिकार का भाव रख सकता है। ‘नाम से’ मूल रूपक और आगे आने वाले विरोधी समानांतर को सुरक्षित रखता है।
- source_word: λαμβάνετέ με
  choice: मुझे ग्रहण नहीं करते
  rationale: यहाँ λαμβάνω का अर्थ शारीरिक रूप से पकड़ना नहीं, बल्कि यीशु को स्वीकार करना है। ‘ग्रहण करना’ स्वागत और स्वीकृति—दोनों भावों के लिए जगह रखता है।
- source_word: ἄλλος
  choice: कोई दूसरा
  rationale: यह यीशु के विपरीत किसी अन्य व्यक्ति को सूचित करता है, पर उसकी पहचान या भूमिका को अधिक विशिष्ट नहीं बनाता।
- source_word: ἐν τῷ ὀνόματι τῷ ἰδίῳ
  choice: अपने ही नाम से
  rationale: ‘ही’ पिता के नाम से आने और अपने नाम से आने के तीखे विरोध को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना ‘अधिकार’ को मुख्य पाठ में अनिवार्य अर्थ बनाने के।
- source_word: ἐκεῖνον λήμψεσθε
  choice: तुम उसे ग्रहण करोगे
  rationale: पहले आए λαμβάνω के समान शब्द को दोहराने से पद का व्यंग्यपूर्ण और अलंकारिक विरोध बना रहता है।
- source_word: πατρός μου
  choice: अपने पिता
  rationale: हिन्दी में कर्ता ‘मैं’ के साथ ‘अपने पिता’ स्वाभाविक स्वत्वबोधक रूप है। संदर्भ में पिता परमेश्वर हैं; देवनागरी में अंग्रेज़ी जैसी capitalization-भिन्नता उपलब्ध नहीं है।
theological_decisions:
- issue: क्या ‘मेरे पिता’ से परमेश्वर पिता का आशय मुख्य पाठ में स्पष्ट किया जाए
  choice: संदर्भानुकूल ‘अपने पिता’ रखा गया और ‘परमेश्वर’ नहीं जोड़ा गया।
  alternative: ‘अपने पिता परमेश्वर’
  rationale: यूहन्ना के संदर्भ में संकेत स्पष्ट है, पर यूनानी पाठ में इस पद पर θεός नहीं है; उसे जोड़ना मूल से अधिक स्पष्टता थोपता।
- issue: क्या ‘नाम से’ को मुख्य पाठ में अधिकार की भाषा से खोला जाए
  choice: दोनों खंडों में ‘नाम से’ का समानांतर मुहावरा बनाए रखा गया।
  alternative: ‘अपने पिता के अधिकार से’ / ‘अपने ही अधिकार से’
  rationale: अधिकार और प्रतिनिधित्व निहित हैं, लेकिन वही एकमात्र अर्थ नहीं। मूल मुहावरे और साहित्यिक समानांतर को बनाए रखने से वास्तविक अर्थ-विस्तार और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: ἐὰν के शर्तीय वाक्य का हिन्दी रूप
  choice: ‘यदि ... आए, तो ... ग्रहण करोगे’
  alternative: ‘अगर ... आएगा, तो ... ग्रहण करोगे’
  rationale: यूनानी में शर्त संभाव्य रूप में है; मानक हिन्दी का ‘यदि ... आए’ इसे भविष्य की निश्चित भविष्यवाणी बनाए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष संबोधन रखा गया है। ‘स्वीकार’ की तुलना में ‘ग्रहण’ यूहन्ना की शब्दावली की व्यापकता और दोनों खंडों की पुनरावृत्ति को बेहतर बनाए रखता है।
