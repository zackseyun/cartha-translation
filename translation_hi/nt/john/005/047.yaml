  edition: SBLGNT
  text: εἰ δὲ τοῖς ἐκείνου γράμμασιν οὐ πιστεύετε, πῶς τοῖς ἐμοῖς ῥήμασιν πιστεύσετε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/047.yaml
  text: But if you do not believe his writings[a], how will you believe my words?
translation:
  language: hi
  text: पर यदि तुम उसकी लिखी हुई बातों पर विश्वास नहीं करते,[a] तो मेरी बातों पर कैसे विश्वास करोगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मूसा की लिखी हुई बातें। यूनानी शब्द का अर्थ ‘पत्र’ या ‘लिखित बातें/रचनाएँ’ हो सकता है; यहाँ प्रसंग में मूसा की लिखी हुई बातों का उल्लेख है।
    reason: शब्दार्थ की वैकल्पिक संभावना और सर्वनाम का प्रसंगगत संदर्भ स्पष्ट करना।
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: शर्त के साथ पिछले कथन से विरोधात्मक संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοῖς ἐκείνου γράμμασιν
  choice: उसके लिखे हुए पर
  rationale: γράμμασιν यहाँ मूसा द्वारा लिखी गई बातों को सूचित करता है। यह अनुवाद ‘अक्षरों’ या निजी ‘पत्रों’ का भ्रामक अर्थ टालते हुए मूल की व्यापकता बनाए रखता है।
- source_word: οὐ πιστεύετε
  choice: विश्वास नहीं करते
  rationale: यहाँ πιστεύω का आशय लिखित गवाही को सत्य और विश्वसनीय मानना है; सामान्य वर्तमान काल उपयुक्त है।
- source_word: πῶς ... πιστεύσετε
  choice: कैसे विश्वास करोगे
  rationale: प्रश्नवाचक πῶς और भविष्यकालीन πιστεύσετε दोनों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῖς ἐμοῖς ῥήμασιν
  choice: मेरी बातों पर
  rationale: ῥήμασιν बोले गए कथनों को दर्शाता है; ‘बातों’ से मूसा के लिखे हुए और यीशु के बोले हुए वचनों का अंतर सहज हिन्दी में बना रहता है।
theological_decisions:
- issue: ἐκείνου (‘उसके’) का संदर्भ
  choice: सर्वनाम ‘उसके’ को बनाए रखते हुए इसे प्रसंगानुसार मूसा का संदर्भ माना गया
  alternative: मुख्य पाठ में सीधे ‘मूसा के लिखे हुए’ कहना
  rationale: यूहन्ना 5:45–46 में मूसा स्पष्ट रूप से उल्लिखित है। सर्वनाम बनाए रखना यूनानी पाठ की संबद्धता और शैली को सुरक्षित रखता है, जबकि पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: πιστεύω का अर्थ
  choice: दोनों स्थानों पर ‘विश्वास करना’
  alternative: ‘भरोसा करना’ या ‘सत्य मानना’
  rationale: इस प्रसंग में मूसा की लिखित गवाही और यीशु की बातों को सत्य मानने पर बल है। एक ही हिन्दी क्रिया दोनों खंडों की अलंकारिक समानता बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उसके लिखे हुए’ मूल की व्यापकता बनाए रखता है; ‘मेरी बातों’ से लिखित और कथित वचनों का स्वाभाविक विरोध उभरता है।
