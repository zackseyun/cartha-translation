id: JHN.5.14
reference: John 5:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μετὰ ταῦτα εὑρίσκει αὐτὸν ὁ Ἰησοῦς ἐν τῷ ἱερῷ καὶ εἶπεν αὐτῷ· Ἴδε ὑγιὴς γέγονας· μηκέτι ἁμάρτανε, ἵνα μὴ χεῖρόν ⸂σοί τι⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/014.yaml
  text: After these things Jesus found him in the temple and said to him[a], “See, you have become well. Sin no more[c][b], so that something worse may not happen to you.”
translation:
  language: hi
  text: इन बातों के बाद यीशु ने उसे मंदिर में पाया और उससे कहा, “देखो, तुम स्वस्थ हो गए हो।[a] अब से पाप मत करना, ताकि तुम्हारे साथ इससे भी बुरा कुछ न हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति का भाव है कि वह स्वस्थ हो चुका है और अब स्वस्थ अवस्था में है।
    reason: lexical_alternative
  - marker: b
    text: यह चेतावनी स्पष्ट नहीं करती कि उसकी पिछली बीमारी किसी विशेष पाप के कारण हुई थी या नहीं, और न ही यह तय करती है कि “इससे भी बुरा” सांसारिक दुःख, अंतिम न्याय, या दोनों को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: बहुवचन संकेतवाचक को बनाए रखते हुए यूहन्ना की कथात्मक क्रमबद्धता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὑρίσκει
  choice: पाया
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथा-शैली में पूर्ण भूतकाल अधिक स्वाभाविक है और घटना का अर्थ नहीं बदलता।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर में
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित कर सकता है; संक्षिप्त ‘मंदिर’ मूल की व्यापकता को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: Ἴδε
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार को सहज, वर्तमान और गैर-पुरातन हिन्दी में व्यक्त करता है।
- source_word: ὑγιὴς γέγονας
  choice: तुम स्वस्थ हो गए हो
  rationale: पूर्णकालिक क्रिया से व्यक्त परिवर्तन और उसके वर्तमान परिणाम—अब स्वस्थ अवस्था में होना—दोनों को सुरक्षित रखता है।
- source_word: μηκέτι ἁμάρτανε
  choice: अब से पाप मत करना
  rationale: μηκέτι के आगे से किसी काम को न करने के भाव को स्पष्ट करता है; वर्तमान आज्ञार्थक के आधार पर यह दावा नहीं करता कि वह व्यक्ति लगातार पाप कर ही रहा था।
- source_word: ἵνα μὴ χεῖρόν σοί τι γένηται
  choice: ताकि तुम्हारे साथ इससे भी बुरा कुछ न हो
  rationale: निषेधात्मक उद्देश्य या अपेक्षित परिणाम और ‘कुछ बुरातर’ होने की संभावना को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: यीशु की चेतावनी में पाप और दुःख का संबंध
  choice: चेतावनी को सीधे रखा गया है, पर यह नहीं जोड़ा गया कि उस व्यक्ति की पिछली बीमारी किसी विशेष पाप का प्रत्यक्ष दण्ड थी; ‘इससे भी बुरा’ का स्वरूप भी अनिर्धारित रखा गया है।
  alternative: पिछली बीमारी को निश्चित रूप से किसी विशेष पाप का दण्ड मानना, या ‘बुरा’ को केवल सांसारिक दुःख अथवा केवल अंतिम न्याय तक सीमित करना।
  rationale: यूनानी पाठ भविष्य में पाप करने के विरुद्ध चेतावनी और किसी अधिक बुरी घटना की संभावना बताता है, लेकिन पिछली बीमारी का सटीक कारण या भावी परिणाम का स्वरूप स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘देखो’ तथा ‘अब से पाप मत करना’ प्रत्यक्ष वाणी की गंभीरता रखते हैं, जबकि अनावश्यक पुरातनता से बचते हैं।
