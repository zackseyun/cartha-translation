source:
  edition: SBLGNT
  text: μὴ θαυμάζετε τοῦτο, ὅτι ἔρχεται ὥρα ἐν ᾗ πάντες οἱ ἐν τοῖς μνημείοις ⸀ἀκούσουσιν τῆς φωνῆς αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/john/005/028.yaml
  text: Do not marvel at this[a], because an hour is coming in which all who are in the tombs will hear his voice
translation:
  language: hi
  text: इस पर अचम्भा मत करो, क्योंकि एक समय आ रहा है, जब वे सब जो कब्रों में हैं, उसकी आवाज़ सुनेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ θαυμάζετε
  choice: अचम्भा मत करो
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। ‘अचम्भा मत करो’ θαυμάζω की विस्मय-सूचक शक्ति को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: τοῦτο
  choice: इस पर
  rationale: यह संकेतवाचक शब्द पिछली बात की ओर लौटता है। हिन्दी में ‘इस पर’ क्रिया ‘अचम्भा करना’ के साथ अधिक स्वाभाविक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ कारणात्मक सम्बन्ध को स्पष्ट रखता है।
- source_word: ἔρχεται ὥρα
  choice: वह घड़ी आ रही है
  rationale: ‘घड़ी’ ὥρα को अक्षरशः रखते हुए यूहन्ना में इसके विशेष अर्थ-भार को सुरक्षित रखती है। हिन्दी में भावी निर्णायक समय का उल्लेख ‘वह घड़ी’ से स्वाभाविक है, यद्यपि यूनानी में संज्ञा अनिश्चित है।
- source_word: ἐν ᾗ
  choice: जब
  rationale: शाब्दिक ‘जिसमें’ की अपेक्षा समयवाचक पूर्वपद के साथ ‘जब’ आधुनिक हिन्दी में अधिक स्वाभाविक है और अर्थ पूरा रखता है।
- source_word: πάντες οἱ ἐν τοῖς μνημείοις
  choice: वे सब जो कब्रों में हैं
  rationale: πάντες οἱ का व्यक्तिवाचक बल ‘वे सब जो’ से आता है। μνημεῖον यहाँ दफनाने के स्थान को दर्शाता है; ‘कब्रों’ साधारण हिन्दी में ठोस चित्र स्पष्ट रखता है।
- source_word: ἀκούσουσιν
  choice: सुनेंगे
  rationale: भविष्यकालीन सक्रिय रूप का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: τῆς φωνῆς αὐτοῦ
  choice: उसकी आवाज़
  rationale: φωνή व्यक्तिगत वाणी के प्रसंग में ‘आवाज़’ है; αὐτοῦ का संदर्भ यीशु से है, पर अनुवाद मूल की तरह सर्वनाम बनाए रखता है।
theological_decisions:
- issue: कब्रों में पड़े सब लोगों द्वारा उसकी आवाज़ सुनने में निहित पुनरुत्थान-संकेत
  choice: कब्रों का ठोस चित्र और सर्वसमावेशी ‘वे सब’ ज्यों का त्यों रखा गया है, बिना पुनरुत्थान की व्याख्या पद में जोड़ने के।
  alternative: ‘सभी मरे हुए’ कहकर निहित अर्थ को स्पष्ट करना।
  rationale: मूल पाठ दफनाने के स्थानों में मौजूद लोगों की बात करता है और अगले पद की ओर तनाव बनाए रखता है; अनुवाद को सिद्धान्तगत विस्तार नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘अचम्भा’ ऊँचे किंतु प्रचलित भाव को रखता है, जबकि वाक्य-विन्यास सहज हिन्दी में है।
