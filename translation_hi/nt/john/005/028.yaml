review_pass:
  verdict: revise
  source_fidelity: The rendering accurately conveys the prohibition, the causal clause, the future hearing, and the inclusive reference to those in burial places. However, ‘वह घड़ी’ introduces definiteness not present in the anarthrous Greek ὥρα. ‘एक समय’ preserves the indefinite sense in idiomatic modern Hindi.
  naturalness: ‘इस पर अचम्भा मत करो’ and the remainder are clear and suitable for public reading. ‘एक समय आ रहा है, जब ...’ is more natural Hindi than an indefinite ‘एक घड़ी आ रही है.’
  terminology: ‘कब्रों’ appropriately conveys μνημεῖα in this context, and ‘उसकी आवाज़’ correctly retains the Greek pronoun without supplying its antecedent. No theological expansion is introduced.
  issues:
  - severity: low
    issue: ‘वह घड़ी’ is definite.
    rationale: Greek ἔρχεται ὥρα has no article. The Hindi demonstrative ‘वह’ can imply a particular, previously identified hour. Replacing it with ‘एक समय’ maintains the source’s indefiniteness while remaining idiomatic.
  revised_text: इस पर अचम्भा मत करो, क्योंकि एक समय आ रहा है, जब वे सब जो कब्रों में हैं, उसकी आवाज़ सुनेंगे।
