revisions:
- from: इस पर अचम्भा मत करो, क्योंकि वह घड़ी आ रही है जब वे सब जो कब्रों में हैं, उसकी आवाज़ सुनेंगे।
  to: इस पर अचम्भा मत करो, क्योंकि एक समय आ रहा है, जब वे सब जो कब्रों में हैं, उसकी आवाज़ सुनेंगे।
  rationale: Only the unwarranted definiteness of ‘वह घड़ी’ has been removed. ‘समय’ is used for natural modern Hindi while retaining the future decisive temporal reference of ὥρα; the burial image, scope (‘वे सब’), and unexpanded resurrection implication remain intact.
  reviewer_model: gpt-5.6-terra
