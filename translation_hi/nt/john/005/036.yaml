id: JHN.5.36
reference: John 5:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔχω τὴν μαρτυρίαν ⸀μείζω τοῦ Ἰωάννου, τὰ γὰρ ἔργα ἃ ⸀δέδωκέν μοι ὁ πατὴρ ἵνα τελειώσω αὐτά, αὐτὰ τὰ ἔργα ⸀ἃ ποιῶ, μαρτυρεῖ περὶ ἐμοῦ ὅτι ὁ πατήρ με ἀπέσταλκεν,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/036.yaml
  text: But I have testimony greater than John's[a], for the works that the Father has given me to complete—these very works that I am doing—testify about me that the Father has sent me.
translation:
  language: hi
  text: पर मेरे पास यूहन्ना की गवाही से भी बड़ी गवाही है[a], क्योंकि जो कार्य पिता ने मुझे पूरा करने के लिए दिए हैं—वे ही कार्य जिन्हें मैं कर रहा हूँ—मेरे विषय में गवाही देते हैं कि पिता ने मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पास यूहन्ना से भी बड़ी गवाही है।”
    reason: यूनानी सम्बन्धकारक पद संक्षिप्त है; उसमें ‘यूहन्ना की गवाही’ निहित समझी जा सकती है, जबकि अधिक शाब्दिक हिन्दी तुलना को ‘यूहन्ना से’ रखती है।
lexical_decisions:
- source_word: μαρτυρίαν
  choice: गवाही
  rationale: ‘गवाही’ न्यायिक और प्रमाण-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है तथा यूहन्ना के सुसमाचार में इस शब्द की प्रमुख अवधारणा को बनाए रखती है।
- source_word: μείζω τοῦ Ἰωάννου
  choice: यूहन्ना की गवाही से भी बड़ी
  rationale: सम्बन्धकारक पद में निहित ‘गवाही’ को हिन्दी में स्पष्ट किया गया है। ‘बड़ी’ तुलनात्मक श्रेष्ठता को रखता है और ‘भी’ तुलना को स्वाभाविक बनाता है। अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἔργα
  choice: कार्य
  rationale: ‘कार्य’ यीशु के पिता-प्रदत्त कामों को गरिमापूर्ण और व्यापक रूप में व्यक्त करता है; इसे केवल चमत्कारों तक सीमित नहीं करता।
- source_word: δέδωκέν μοι
  choice: मुझे ... दिए हैं
  rationale: पूर्णकालिक क्रिया के पूर्ण हुए दान और उसके वर्तमान परिणाम, दोनों को ‘दिए हैं’ से व्यक्त किया गया है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: मूल में किसी स्पष्ट अधिकारवाचक सर्वनाम के बिना प्रयुक्त इस विशिष्ट सम्बोधन को ‘पिता’ के रूप में रखा गया है।
- source_word: ἵνα τελειώσω αὐτά
  choice: पूरा करने के लिए
  rationale: यह उद्देश्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा सौंपे गए कार्यों को उनकी निर्धारित पूर्णता तक पहुँचाने का भाव बनाए रखता है।
- source_word: αὐτὰ τὰ ἔργα
  choice: वे ही कार्य
  rationale: दोहराए गए αὐτά के बलाघात को ‘ही’ द्वारा व्यक्त किया गया है।
- source_word: ἃ ποιῶ
  choice: जिन्हें मैं कर रहा हूँ
  rationale: वर्तमान में जारी क्रिया को हिन्दी के प्रगतिशील रूप से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: μαρτυρεῖ περὶ ἐμοῦ
  choice: मेरे विषय में गवाही देते हैं
  rationale: यह यीशु के विषय में प्रमाण देने के न्यायिक भाव को बनाए रखता है। हिन्दी में बहुवचन ‘कार्य’ के अनुसार क्रिया बहुवचन में है।
- source_word: ἀπέσταλκεν
  choice: भेजा है
  rationale: यह भेजे जाने की पूर्ण घटना और उसके बने हुए महत्व को हिन्दी के पूर्ण वर्तमान रूप में व्यक्त करता है।
theological_decisions:
- issue: यीशु की पुष्टि करने वाली गवाही का स्वरूप
  choice: पिता द्वारा दिए गए कार्य यीशु के विषय में यूहन्ना की गवाही से भी बड़ी गवाही देते हैं और प्रमाणित करते हैं कि पिता ने उन्हें भेजा है।
  alternative: ‘कार्यों’ को केवल अधिकार सिद्ध करने वाले चमत्कारों के अर्थ में सीमित करना।
  rationale: मूल पाठ व्यापक शब्द ἔργα का प्रयोग करता है और स्वयं कहता है कि ये कार्य पिता के भेजने की गवाही देते हैं। इसलिए अनुवाद इस शब्द को केवल चमत्कारों तक सीमित नहीं करता।
- issue: ὁ πατήρ का यीशु से सम्बन्ध
  choice: पिता
  alternative: परमेश्वर; मेरे पिता
  rationale: यूनानी पाठ में निश्चित पद के साथ ‘पिता’ है, पर यहाँ न तो ‘परमेश्वर’ शब्द है, न स्पष्ट ‘मेरे’। ‘पिता’ मूल की मसीह-संबंधी अभिव्यक्ति को बिना कुछ जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। वाक्य में दीर्घ विराम-चिह्न मूल के बलाघातपूर्ण पुनरुक्ति-विन्यास को दिखाते हैं। ‘कार्य’ को जानबूझकर व्यापक रखा गया है, ताकि अर्थ केवल चमत्कारों तक सीमित न हो।
