lexical_decisions:
- source_word: ἰαθεὶς
  choice: जो मनुष्य चंगा हुआ था
  rationale: निश्चयवाचक लेख के साथ यह कर्मवाच्य कृदन्त संज्ञा का कार्य करता है। हिन्दी में ‘मनुष्य’ जोड़ने से पुल्लिंग एकवचन व्यक्ति का संकेत स्वाभाविक रूप से स्पष्ट होता है, और ‘चंगा हुआ था’ पूर्व में घटित चंगाई तथा कर्मवाच्य भाव को बनाए रखता है।
- source_word: οὐκ ᾔδει
  choice: नहीं जानता था
  rationale: संदर्भ में यह οἶδα का सहज और सीधा हिन्दी रूप है।
- source_word: τίς ἐστιν
  choice: वह कौन था
  rationale: यह यीशु की व्यक्तिगत पहचान की ओर संकेत करता है; परोक्ष कथन में यह रूप स्वाभाविक हिन्दी है।
- source_word: ἐξένευσεν
  choice: चुपचाप निकल गए थे
  rationale: ἐκνεύω यहाँ ध्यान आकर्षित किए बिना हट जाने या निकल जाने का भाव देता है। यह रूप उस सूक्ष्मता और मुख्य क्रिया से पहले घटित कार्य, दोनों को व्यक्त करता है।
- source_word: ὄχλου ὄντος
  choice: वहाँ भीड़ होने के कारण
  rationale: यह संबंधकारक स्वतंत्र पदबंध परिस्थिति या कारण दोनों का भाव दे सकता है। हिन्दी रूप संदर्भ में स्वाभाविक कारणात्मक संबंध व्यक्त करता है।
- source_word: ἐν τῷ τόπῳ
  choice: वहाँ
  rationale: शाब्दिक ‘उस स्थान में’ की अपेक्षा ‘वहाँ’ आधुनिक हिन्दी में अधिक स्वाभाविक है और स्थानवाचक अर्थ को पर्याप्त रूप से बनाए रखता है।
