source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ὁ πατὴρ κρίνει οὐδένα, ἀλλὰ τὴν κρίσιν πᾶσαν δέδωκεν τῷ υἱῷ,
base_translation:
  language: en
  yaml_path: translation/nt/john/005/022.yaml
  text: For the Father judges no one, but has given all judgment to the Son,
translation:
  language: hi
  text: क्योंकि पिता किसी का न्याय नहीं करता, बल्कि उसने न्याय करने का सारा कार्य पुत्र को दे दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण देता है। हिन्दी में ‘क्योंकि’ γάρ की व्याख्यात्मक शक्ति को स्वाभाविक रूप से व्यक्त करता है; οὐδέ की नकारात्मक व्यापकता आगे ‘किसी का ... नहीं’ में समाहित है।
- source_word: ὁ πατὴρ
  choice: पिता
  rationale: यूहन्ना के संदर्भ में यह परमेश्वर के लिए पुत्र के संबंध में प्रयुक्त उपाधि है; ‘पिता’ इसे संक्षिप्त और गरिमापूर्ण रूप में रखता है।
- source_word: κρίνει οὐδένα
  choice: किसी का न्याय नहीं करता
  rationale: वर्तमान काल सामान्य सत्य व्यक्त करता है। ‘न्याय करता’ अर्थ को केवल दंडादेश तक सीमित नहीं करता और κρίσιν के साथ शब्दगत संबंध बनाए रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिता के न्याय न करने और पुत्र को न्याय सौंपने के बीच प्रबल विरोध दर्शाता है।
- source_word: τὴν κρίσιν πᾶσαν
  choice: न्याय करने का पूरा काम
  rationale: यह κρίσις को न्याय करने की क्रिया या कार्य के रूप में और πᾶσαν को उसकी संपूर्णता के रूप में स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल अंतिम दंड या निर्णय तक सीमित किए।
- source_word: δέδωκεν
  choice: सौंप दिया है
  rationale: यूनानी पूर्णकाल बीते हुए कार्य और उसके वर्तमान स्थायी परिणाम को दर्शाता है। ‘सौंप दिया है’ इस स्थायी हस्तांतरण को सहज हिन्दी में व्यक्त करता है; यद्यपि इसमें केवल ‘दिया है’ की अपेक्षा दायित्व सौंपने की हल्की व्याख्यात्मक छाया है।
- source_word: τῷ υἱῷ
  choice: पुत्र को
  rationale: मूल में कोई स्वत्ववाचक सर्वनाम नहीं है। ‘पुत्र’ यूहन्ना में मसीह-संबंधी उपाधि तथा पिता-पुत्र संबंध को बनाए रखता है।
theological_decisions:
- issue: पिता के न्याय और पुत्र के न्याय का संबंध
  choice: 'कथन को सीधे रखा गया है: पिता किसी का न्याय नहीं करता, बल्कि न्याय करने का पूरा काम पुत्र को सौंप चुका है।'
  alternative: ‘पिता पुत्र से स्वतंत्र होकर किसी का न्याय नहीं करता’ जोड़ना, या इसे केवल अंतिम युगांतकारी न्याय तक सीमित करना।
  rationale: मूल पाठ में ऐसे सामंजस्यकारी विशेषण नहीं हैं। अनुवाद कथन के वास्तविक धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: ‘पुत्र’ की मसीह-संबंधी उपाधि
  choice: ‘पुत्र’ को उपाधि के रूप में रखा गया है।
  alternative: ‘उसके पुत्र’ कहना।
  rationale: यूनानी में ‘उसके’ नहीं है, और निश्चित पदबंध यूहन्ना में पिता के संबंध में ‘पुत्र’ की विशिष्ट पहचान को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘न्याय करने का पूरा काम’ शाब्दिक ‘समस्त न्याय’ की तुलना में अधिक स्वाभाविक है और न्याय की क्रिया/भूमिका को स्पष्ट करता है।
