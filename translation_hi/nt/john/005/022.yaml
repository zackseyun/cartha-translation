review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the explanatory γάρ, the comprehensive negation, the present general statement that the Father judges no one, the strong contrast, and the perfect-result force of δέδωκεν. However, “न्याय करने का पूरा काम” is somewhat paraphrastic for τὴν κρίσιν πᾶσαν, and “सौंप दिया है” adds an entrusting nuance beyond the direct sense of ‘has given.’
  naturalness: The sentence is clear and idiomatic modern Hindi. “सारा कार्य” is more dignified for public scripture reading than “पूरा काम,” while remaining natural.
  terminology: “पिता” and “पुत्र” appropriately preserve the Johannine titular language without supplying an absent possessive. “न्याय” preserves the lexical and conceptual connection between κρίνει and κρίσις.
  issues:
  - severity: low
    issue: ‘न्याय करने का पूरा काम’ is a loose rendering of τὴν κρίσιν πᾶσαν.
    rationale: ‘काम’ is more colloquial and can make the phrase sound like an assigned job rather than preserving the comprehensive ‘all judgment.’ ‘न्याय करने का सारा कार्य’ is closer and maintains an elevated public-reading register.
  - severity: low
    issue: ‘सौंप दिया है’ is mildly interpretive for δέδωκεν.
    rationale: The Greek directly says ‘has given.’ ‘दे दिया है’ preserves the perfect aspect without adding the nuance of entrustment.
  revised_text: क्योंकि पिता किसी का न्याय नहीं करता, बल्कि उसने न्याय करने का सारा कार्य पुत्र को दे दिया है।
