reference: John 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῦτον ἰδὼν ὁ Ἰησοῦς κατακείμενον, καὶ γνοὺς ὅτι πολὺν ἤδη χρόνον ἔχει, λέγει αὐτῷ· Θέλεις ὑγιὴς γενέσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/006.yaml
  text: When Jesus saw this man lying there[a], and knew that he had already been there a long time, he said to him, “Do you want to become well?”
translation:
  language: hi
  text: जब यीशु ने इस मनुष्य को वहाँ पड़ा देखा और जान लिया कि वह बहुत समय से इस दशा में है,[a] तो उससे कहा, “क्या तुम स्वस्थ होना चाहते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह वहाँ बहुत समय से पड़ा है।”
    reason: मूल यूनानी में यह स्पष्ट नहीं है कि बहुत समय उसकी इस दशा को हुआ था या वह वहाँ पड़ा था।
lexical_decisions:
- source_word: τοῦτον
  choice: इस मनुष्य को
  rationale: संकेतवाचक सर्वनाम प्रसंग में उसी विशेष रोगी की ओर संकेत करता है; हिन्दी में ‘इस मनुष्य को’ स्पष्ट और स्वाभाविक है।
- source_word: ἰδὼν
  choice: जब यीशु ने ... देखा
  rationale: मुख्य क्रिया से पहले आए भूतकालिक कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: κατακείμενον
  choice: वहाँ पड़ा
  rationale: यह मनुष्य की लेटी हुई अवस्था बताता है; प्रसंग के स्थानगत भाव को ‘वहाँ’ स्वाभाविक रूप से प्रकट करता है।
- source_word: γνοὺς
  choice: जान लिया
  rationale: यह यीशु की जानकारी को व्यक्त करता है, पर यह नहीं बताता कि जानकारी किस माध्यम से मिली।
- source_word: πολὺν ἤδη χρόνον ἔχει
  choice: उसे इस दशा में बहुत समय हो चुका है
  rationale: यूनानी अभिव्यक्ति में अवधि का संबंध स्पष्ट रूप से नहीं बताया गया। प्रसंग के अनुसार रोगग्रस्त दशा मुख्य अर्थ है, जबकि वहाँ पड़े रहने की अवधि भी सम्भव है और पादटिप्पणी में दी गई है।
- source_word: λέγει αὐτῷ
  choice: तो उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथात्मक शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Θέλεις
  choice: क्या तुम ... चाहते हो
  rationale: यह इच्छा अथवा तत्परता पूछता है; ‘चाहते हो’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: ὑγιὴς γενέσθαι
  choice: स्वस्थ होना
  rationale: विशेषण और γίνομαι का संयोजन रोग से स्वास्थ्य की नई अवस्था में आने का भाव देता है; हिन्दी में ‘स्वस्थ होना’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: γνοὺς में यीशु के ज्ञान का स्वरूप
  choice: केवल यह कहना कि यीशु ने जान लिया
  alternative: ज्ञान को अलौकिक बताना अथवा यह कहना कि उन्हें किसी से पता चला
  rationale: पद ज्ञान के साधन का उल्लेख नहीं करता; इसलिए अनुवाद न तो अलौकिक माध्यम जोड़ता है, न सामान्य सूचना-प्राप्ति।
- issue: πολὺν ἤδη χρόνον ἔχει में अवधि का संदर्भ
  choice: मुख्य पाठ में रोगग्रस्त दशा की अवधि
  alternative: उस स्थान पर पड़े रहने की अवधि
  rationale: यूनानी में अवधि का पूरक अनुक्त है। निकटवर्ती और व्यापक प्रसंग रोग की दीर्घ अवधि का समर्थन करता है, पर स्थानगत अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चंगा’ की अपेक्षा ‘स्वस्थ’ चुना गया है ताकि ὑγιής का सामान्य स्वास्थ्य-संबंधी अर्थ स्पष्ट रहे और अनावश्यक सांप्रदायिक रंग न आए।
