base_translation:
  language: en
  yaml_path: translation/nt/john/005/002.yaml
  text: There is in Jerusalem[a], by the Sheep Gate, a pool called Bethesda in Hebrew[c][b], having five porticoes.
translation:
  language: hi
  text: यरूशलेम में भेड़-द्वार के पास[a] एक कुण्ड है, जिसे इब्रानी[c] में बेथेस्दा[b] कहा जाता है; उसके पाँच बरामदे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का शाब्दिक अर्थ लगभग ‘भेड़-स्थान पर/निकट’ है। सम्भवतः यहाँ भेड़-द्वार का क्षेत्र अभिप्रेत है (नहेमायाह 3:1; 12:39 से तुलना करें), यद्यपि मूल पाठ में ‘द्वार’ शब्द स्पष्ट रूप से नहीं है।
    reason: cross_reference
  - marker: b
    text: कुछ पाण्डुलिपियों में ‘बेथेस्दा’ के स्थान पर ‘बेथज़ाथा’ या ‘बेथसैदा’ है।
    reason: textual_variant
  - marker: c
    text: या ‘अरामी में’; यूहन्ना का ‘इब्रानी’ शब्द कई बार शास्त्रीय इब्रानी तक सीमित न रहकर यहूदिया की स्थानीय सामी भाषा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔστιν δὲ
