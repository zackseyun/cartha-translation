  rationale: वर्तमान काल ἔστιν को वर्तमान काल में रखा गया है। δέ यहाँ हल्का संयोजक है, इसलिए हिन्दी में अलग शब्द जोड़ना आवश्यक नहीं है।
- source_word: ἐν τοῖς Ἱεροσολύμοις
  choice: यरूशलेम में
  rationale: यूनानी में नाम का रूप बहुवचनात्मक है, पर हिन्दी में नगर का प्रचलित एकवचन नाम स्वाभाविक है।
- source_word: ἐπὶ τῇ προβατικῇ
  choice: भेड़-द्वार के पास
  rationale: वाक्यांश में संज्ञा लुप्त है। यरूशलेम की स्थलाकृति और नहेमायाह 3:1; 12:39 की तुलना से भेड़-द्वार अभिप्रेत होना सम्भावित है; इसकी व्याख्यात्मक प्रकृति पादटिप्पणी में बताई गई है।
- source_word: κολυμβήθρα
  choice: कुण्ड
  rationale: यह जल-संचय या स्नान के लिए बने पूल को दर्शाने वाला सामान्य शब्द है; इस प्रसंग में ‘कुण्ड’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: ἡ ἐπιλεγομένη
  choice: जिसे … कहा जाता है
  rationale: यह कृदन्त कुण्ड के नाम का परिचय देता है; हिन्दी में यह रचना स्वाभाविक ढंग से वही अर्थ व्यक्त करती है।
- source_word: Ἑβραϊστὶ
  choice: इब्रानी में
  rationale: मुख्य पाठ स्रोत के स्पष्ट शब्द ‘इब्रानी’ को बनाए रखता है। यूहन्ना के प्रयोग में इससे स्थानीय अरामी भाषा भी अभिप्रेत हो सकती है; यह सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: Βηθεσδά
  choice: बेथेस्दा
  rationale: दिए गए SBLGNT पाठ के Βηθεσδά का हिन्दी लिप्यन्तरण किया गया है; अन्य पाण्डुलिपीय पाठ पादटिप्पणी में दिए गए हैं।
- source_word: πέντε στοὰς ἔχουσα
  choice: उसके पाँच बरामदे हैं
  rationale: στοά छत वाले बरामदे या स्तम्भयुक्त मंडप को दर्शाता है। हिन्दी में ‘बरामदे’ सामान्य पाठक के लिए सहज है, और सम्बन्धवाचक कृदन्त को स्वाभाविक स्वतंत्र उपवाक्य में व्यक्त किया गया है।
