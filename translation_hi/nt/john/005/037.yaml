lexical_decisions:
- source_word: ὁ πέμψας με πατὴρ
  choice: पिता, जिसने मुझे भेजा है
  rationale: विशेषणात्मक कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में प्रस्तुत किया गया है; इससे पिता की पहचान कराने वाला बल बना रहता है।
- source_word: ἐκεῖνος
  choice: उसी ने
  rationale: संकेतवाचक सर्वनाम के बल को स्वाभाविक हिन्दी में ‘उसी’ द्वारा सुरक्षित रखा गया है; ‘वही’ भी संभव है, पर ‘उसी ने’ कर्ता पर स्पष्ट बल देता है।
- source_word: μεμαρτύρηκεν
  choice: गवाही दी है
  rationale: पूर्णकालीन रूप को हिन्दी के पूर्ण पक्ष से व्यक्त किया गया है, जिससे दी जा चुकी और अब भी प्रासंगिक गवाही का भाव बना रहता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: यह περί के संबंधसूचक अर्थ को स्पष्ट, गरिमापूर्ण और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὔτε ... οὔτε
  choice: न तो ... न
  rationale: यूनानी सहसंबंधी निषेध का स्वाभाविक हिन्दी समतुल्य है।
- source_word: φωνὴν αὐτοῦ
  choice: उसकी आवाज़
  rationale: सुनने के संदर्भ में φωνή का सीधा और सामान्य अर्थ ‘आवाज़’ है।
- source_word: πώποτε ἀκηκόατε
  choice: कभी ... सुनी है
  rationale: निषेध के साथ πώποτε का ‘कभी भी’ अर्थ तथा पूर्णकाल का वर्तमान तक प्रासंगिक अनुभव हिन्दी में सुरक्षित है।
- source_word: εἶδος αὐτοῦ
  choice: उसका स्वरूप
  rationale: ‘स्वरूप’ दृश्य रूप या दिखाई देने वाली आकृति—दोनों की अर्थ-व्याप्ति को बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἑωράκατε
  choice: देखा है
  rationale: पूर्णकालीन रूप को हिन्दी के पूर्ण पक्ष से व्यक्त कर समानांतर संरचना बनाए रखी गई है।
theological_decisions:
- issue: पिता के लिए प्रयुक्त बलात्मक ἐκεῖνος
  choice: ‘उसी ने’ के द्वारा बल को मुख्य पाठ में बनाए रखना
  alternative: ‘वही’ अथवा केवल ‘उसने’
  rationale: यह पिता को स्वयं यीशु के विषय में गवाही देने वाले के रूप में उभारता है, पर पाठ से आगे कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ता।
- issue: εἶδος αὐτοῦ का अर्थ
  choice: ‘उसका स्वरूप’
  alternative: ‘उसका रूप’ या ‘उसकी आकृति’
  rationale: ‘स्वरूप’ दृश्य रूप और प्रकट रूप के बीच मूल पाठ की अर्थगत खुलावट को बनाए रखता है; ‘आकृति’ अपेक्षाकृत अधिक भौतिक और संकीर्ण हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ἐκεῖνος का बल ‘उसी ने’ से व्यक्त किया गया है। पद के अंत की अल्पविराम-संरचना अगले पद से वाक्य के जारी रहने को दिखाती है।
