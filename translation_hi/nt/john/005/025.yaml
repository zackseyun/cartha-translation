source:
  edition: SBLGNT
  text: Ἀμὴν ἀμὴν λέγω ὑμῖν ὅτι ἔρχεται ὥρα καὶ νῦν ἐστιν ὅτε οἱ νεκροὶ ⸀ἀκούσουσιν τῆς φωνῆς τοῦ υἱοῦ τοῦ θεοῦ καὶ οἱ ἀκούσαντες ⸀ζήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/025.yaml
  text: Truly[a], truly, I say to you that an hour is coming, and now is, when the dead will hear the voice of the Son of God[d][c][b], and those who hear will live.
translation:
  language: hi
  text: मैं तुमसे सच-सच[a] कहता हूँ कि एक घड़ी[b] आ रही है, और अब है, जब मरे हुए[c] परमेश्वर के पुत्र की आवाज़ सुनेंगे; और जिन्होंने सुना है[d], वे जीवित होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुसार: “आमीन, आमीन, मैं तुमसे कहता हूँ।”'
    reason: lexical_alternative
  - marker: b
    text: “घड़ी” का अर्थ व्यापक रूप से “समय” भी समझा जा सकता है, पर यूनानी में विशेष रूप से “घड़ी” शब्द है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “मरे हुए” में वर्तमान आत्मिक अर्थ भी हो सकता है—क्योंकि घड़ी “अब है”—और साथ ही आसपास का प्रसंग भावी शारीरिक पुनरुत्थान की ओर भी संकेत करता है।
    reason: cross_reference
  - marker: d
    text: यूनानी रूप का अनुवाद संदर्भानुसार “जो सुनेंगे” या “जो सुन लेंगे” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν ἀμὴν
  choice: सच-सच
  rationale: यीशु के कथन की गंभीर पुष्टि और यूनानी की दोहरी पुनरावृत्ति को स्वाभाविक, स्पष्ट हिन्दी में बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और यूहन्ना की गंभीर कथन-शैली दोनों सुरक्षित रहते हैं।
- source_word: ἔρχεται ὥρα
  choice: एक घड़ी आ रही है
  rationale: अनिश्चित रूप और यूहन्ना में ὥρα के विशेष महत्व को बनाए रखने के लिए सामान्यीकृत ‘समय’ के बजाय ‘घड़ी’ रखा गया है।
- source_word: καὶ νῦν ἐστιν
  choice: और वह अभी है
  rationale: आने वाली और साथ ही वर्तमान घड़ी के बीच मूल पाठ के जानबूझकर रखे गए तनाव को बिना समझाकर सुलझाए सुरक्षित रखता है।
- source_word: οἱ νεκροὶ
  choice: मरे हुए
  rationale: यह अभिव्यक्ति शारीरिक मृत्यु और वर्तमान आत्मिक अर्थ—दोनों संभावित संकेतों को खुला रखती है।
- source_word: ἀκούσουσιν τῆς φωνῆς
  choice: आवाज़ सुनेंगे
  rationale: व्यक्तिगत वक्ता के संदर्भ में φωνή के लिए ‘आवाज़’ स्वाभाविक है; ‘सुनेंगे’ क्रिया में आज्ञापालन का अर्थ अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: τοῦ υἱοῦ τοῦ θεοῦ
  choice: परमेश्वर के पुत्र की
  rationale: मूल यूनानी के पूर्ण मसीही पदनाम को स्पष्ट और पारंपरिक हिन्दी में सुरक्षित रखता है।
- source_word: οἱ ἀκούσαντες
  choice: जो सुनेंगे
  rationale: यूनानी में कृदन्त भूतकालिक रूप का है, पर भविष्य-उन्मुख कथन में हिन्दी का यह रूप सहज है और सुनने तथा जीवित होने के संबंध को स्पष्ट रखता है।
- source_word: ζήσουσιν
  choice: जीवित होंगे
  rationale: ζάω का सीधा अर्थ सुरक्षित रहता है; ‘जी उठेंगे’ कहने से शारीरिक पुनरुत्थान का अर्थ मूल पद की अपेक्षा अधिक निश्चित हो जाता।
theological_decisions:
- issue: ‘मरे हुए’ का आशय
  choice: ‘मरे हुए’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘आत्मिक रूप से मरे हुए’ या ‘शारीरिक रूप से मृत लोग’
  rationale: ‘और वह अभी है’ वर्तमान जीवनदान की ओर संकेत कर सकता है, जबकि निकटवर्ती प्रसंग भावी शारीरिक पुनरुत्थान की भी चर्चा करता है। अनुवाद इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
- issue: ‘परमेश्वर का पुत्र’ मसीही पदनाम
  choice: पूर्ण पदनाम ‘परमेश्वर का पुत्र’ रखा गया है।
  alternative: ‘परमेश्वर का बेटा’ या कोई व्याख्यात्मक विस्तार
  rationale: यह यूनानी पदनाम को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है तथा पाठ से बाहर की धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
- issue: ζήσουσιν में जीवन का स्वरूप
  choice: ‘जीवित होंगे’
  alternative: ‘जी उठेंगे’
  rationale: ‘जीवित होंगे’ वर्तमान आत्मिक जीवनदान और पुनरुत्थान की अनुगूँज दोनों के लिए स्थान रखता है; ‘जी उठेंगे’ केवल शारीरिक पुनरुत्थान को अधिक स्पष्ट रूप से निर्धारित कर देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर यीशु के गंभीर घोषणात्मक लहजे के अनुरूप गरिमापूर्ण रखी गई है। ‘सच-सच’, ‘घड़ी’, और ‘परमेश्वर का पुत्र’ जैसे पद यूहन्ना की विशिष्ट शैली तथा मूल पाठ की पुनरावृत्ति और धर्मवैचारिक गहराई को सुरक्षित रखते हैं।
