base_translation:
  language: en
  yaml_path: translation/nt/john/005/045.yaml
  text: 'Do not think that I will accuse you before the Father[a]; there is one who accuses you: Moses[b], in whom you have put your hope.'
translation:
  language: hi
  text: यह मत सोचो कि मैं पिता के सामने तुम पर आरोप लगाऊँगा[a]। तुम पर आरोप लगानेवाला तो मूसा है[b], जिस पर तुमने अपनी आशा रखी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह मत समझो कि मैं पिता के सामने तुम पर अभियोग लगाऊँगा।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मूसा—जिस पर उन्होंने, विशेषकर व्यवस्था के मध्यस्थ और साक्षी के रूप में, भरोसा रखा था—तुम पर आरोप लगानेवाला ठहरेगा।
    reason: cross_reference
lexical_decisions:
- source_word: μὴ δοκεῖτε
  choice: यह मत सोचो
  rationale: निषेधात्मक वर्तमान आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; चेतावनी की प्रत्यक्षता बनी रहती है।
- source_word: κατηγορήσω
  choice: मैं ... आरोप लगाऊँगा
  rationale: κατηγορέω का न्यायिक अर्थ आरोप लगाना है; ‘दोषी ठहराना’ कहने से मूल से अधिक अर्थ जुड़ जाता।
- source_word: πρὸς τὸν πατέρα
  choice: पिता के सामने
  rationale: आरोप के प्रसंग में πρός न्यायालय-सदृश उपस्थिति को व्यक्त करता है; साथ ही यूहन्ना में प्रयुक्त ‘पिता’ की उपाधि सुरक्षित रहती है।
- source_word: ἔστιν ὁ κατηγορῶν ὑμῶν
  choice: तुम पर आरोप लगानेवाला तो ... है
  rationale: यह स्वाभाविक हिन्दी में दूसरे आरोप लगानेवाले को यीशु के विपरीत प्रस्तुत करता है और वर्तमान कृदन्त की जारी भूमिका को बनाए रखता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी रूप।
- source_word: εἰς ὃν
  choice: जिस पर
  rationale: ἐλπίζω के साथ εἰς किसी पर आशा टिकाने का भाव देता है; हिन्दी में ‘जिस पर’ स्वाभाविक है और मूसा की लिखी बातों को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ता।
- source_word: ἠλπίκατε
  choice: तुमने अपनी आशा रखी है
  rationale: पूर्णकाल बीते हुए भरोसे और उसके वर्तमान स्थायी परिणाम, दोनों को व्यक्त करता है।
theological_decisions:
- issue: यीशु के कथन में न्यायिक आरोप का बल
  choice: ‘आरोप लगाना’ रखा गया है।
  alternative: ‘दोषी ठहराना’
  rationale: κατηγορέω आरोप लगाने को दर्शाता है, अंतिम न्याय या दंडादेश को नहीं; इसलिए अधिक प्रबल न्यायिक निष्कर्ष नहीं जोड़ा गया।
- issue: मूसा पर रखी गई आशा का आशय
  choice: मुख्य पाठ में सीधे ‘मूसा ... जिस पर तुमने अपनी आशा रखी है’ कहा गया है।
  alternative: ‘मूसा की व्यवस्था पर’ या ‘मूसा के लेखों पर’
  rationale: निकटवर्ती संदर्भ मूसा के लेखों से संबंध बताता है, पर यूनानी पाठ यहाँ स्वयं मूसा को प्रत्यक्ष संदर्भ बनाता है; उस अस्पष्टता को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध अभिव्यक्ति। ‘तुम’ मूल के बहुवचन ὑμεῖς/ὑμῶν के सामूहिक संबोधन को स्वाभाविक रूप से व्यक्त करता है। ‘लगानेवाला’ की संयुक्त वर्तनी अपनाई गई है।
