source:
  edition: SBLGNT
  text: πῶς δύνασθε ὑμεῖς πιστεῦσαι, δόξαν παρ’ ἀλλήλων λαμβάνοντες, καὶ τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ οὐ ζητεῖτε;
base_translation:
  language: en
  yaml_path: translation/nt/john/005/044.yaml
  text: How are you able to believe[c][b][a], receiving glory from one another and not seeking the glory that is from the only God?
translation:
  language: hi
  text: तुम कैसे विश्वास कर सकते हो[b], जबकि तुम एक-दूसरे से महिमा[a] पाते हो और उस महिमा की खोज नहीं करते जो एकमात्र परमेश्वर[c] से मिलती है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों जगह ‘महिमा’ के स्थान पर ‘सम्मान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम विश्वास करने में कैसे समर्थ हो?’
    reason: lexical_alternative
  - marker: c
    text: या, ‘एक और केवल एक परमेश्वर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς δύνασθε ... πιστεῦσαι
  choice: तुम कैसे विश्वास कर सकते हो
  rationale: यह स्वाभाविक हिन्दी में सामर्थ्य या संभावना पर उठाए गए यूनानी आलंकारिक प्रश्न को व्यक्त करता है। इससे यह तनाव बना रहता है कि प्रश्न ढंग के विषय में है या वास्तविक क्षमता के विषय में।
- source_word: ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है। प्रसंग में हिन्दी का ‘तुम’ पर्याप्त है; ‘तुम स्वयं’ अनावश्यक रूप से अधिक जोर देता।
- source_word: δόξαν
  choice: महिमा
  rationale: यूहन्ना में δόξα का अर्थ महिमा, आदर या प्रतिष्ठा हो सकता है। दोनों प्रयोगों में ‘महिमा’ रखने से मनुष्यों से मिलने वाली और परमेश्वर से मिलने वाली δόξα के बीच जानबूझकर किया गया समानांतर विरोध सुरक्षित रहता है।
- source_word: παρ’ ἀλλήλων
  choice: एक-दूसरे से
  rationale: यह पारस्परिक मानवीय स्रोत को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λαμβάνοντες
  choice: पाते हो
  rationale: यह λαμβάνω के ग्रहण करने के व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है और ‘स्वीकार करते हो’ जैसी अतिरिक्त अनुमोदन-सूचक छाया नहीं जोड़ता।
- source_word: καὶ ... οὐ ζητεῖτε
  choice: और ... खोज नहीं करते
  rationale: यह यूनानी समन्वय और लगातार बने हुए व्यवहार को स्पष्ट रखता है। ‘जबकि’ मुख्य प्रश्न के साथ परिस्थितिजन्य और विरोधात्मक संबंध को स्वाभाविक हिन्दी में दिखाता है।
- source_word: τὴν δόξαν τὴν παρὰ τοῦ μόνου θεοῦ
  choice: उस महिमा ... जो एकमात्र परमेश्वर से मिलती है
  rationale: संबंधवाचक रचना यूनानी विशेषणात्मक वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करती है; ‘मिलती है’ स्रोत का भाव स्पष्ट करता है।
- source_word: μόνου θεοῦ
  choice: एकमात्र परमेश्वर
  rationale: यह μόνος की विशिष्टता और एकेश्वरवादी बल को संक्षेप में सुरक्षित रखता है, बिना उससे आगे कोई सिद्धान्तगत अर्थ जोड़ने के।
theological_decisions:
- issue: यूहन्ना के प्रसंग में πιστεῦσαι का अनुवाद
  choice: विश्वास कर सकते हो
  alternative: भरोसा कर सकते हो
  rationale: ‘विश्वास’ πιστεύω का मानक और पर्याप्त व्यापक हिन्दी अनुवाद है। यह मानसिक स्वीकृति और व्यक्तिगत भरोसे के बीच के अर्थगत तनाव को किसी एक ओर सीमित नहीं करता।
- issue: दोनों खंडों में δόξα की एकरूपता
  choice: दोनों स्थानों पर ‘महिमा’
  alternative: दोनों स्थानों पर ‘सम्मान’
  rationale: एक ही शब्द रखने से मानवीय स्रोत और दैवी स्रोत की δόξα के बीच यूनानी पाठ का समानांतर विरोध बना रहता है। ‘सम्मान’ प्रसंगानुकूल विकल्प है और इसलिए पाद-टिप्पणी में दिया गया है।
- issue: τοῦ μόνου θεοῦ का अर्थ
  choice: एकमात्र परमेश्वर
  alternative: अकेले परमेश्वर
  rationale: मुख्य पाठ परमेश्वर की अद्वितीयता को सीधे व्यक्त करता है। वैकल्पिक रूप स्रोत की विशिष्टता पर जोर दे सकता है, पर मुख्य अनुवाद अधिक स्वाभाविक और औपचारिक रूप से निकट है।
- issue: δύνασθε वाले आलंकारिक प्रश्न का बल
  choice: कैसे विश्वास कर सकते हो
  alternative: विश्वास करने में कैसे समर्थ हो
  rationale: मुख्य पाठ आधुनिक हिन्दी में स्वाभाविक रहते हुए क्षमता का भाव रखता है। अधिक शाब्दिक विकल्प उस क्षमता-सूचक बल को स्पष्ट करता है, पर हिन्दी में कुछ भारी है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जबकि’ यूनानी कृदन्तीय परिस्थिति को पठनीय बनाता है; मुख्य शब्दों की पुनरावृत्ति और आलंकारिक प्रश्न का तनाव सुरक्षित रखा गया है।
