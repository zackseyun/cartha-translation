source:
  edition: SBLGNT
  text: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ⸀ἔλεγεν αὐτοῖς· Ἀμὴν ἀμὴν λέγω ὑμῖν, οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδὲν ⸀ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα· ἃ γὰρ ἂν ἐκεῖνος ποιῇ, ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/019.yaml
  text: So Jesus answered and said to them[a], “Truly, truly, I say to you, the Son is not able to do anything from himself unless he sees the Father doing it; for whatever that one does[b], these things the Son also does likewise.”
translation:
  language: hi
  text: इसलिए यीशु ने उन्हें उत्तर दिया और कहा, “मैं तुमसे सच-सच कहता हूँ, पुत्र अपने-आप कुछ भी नहीं कर सकता, यदि वह पिता को कुछ करते न देखे[a]; क्योंकि पिता जो कुछ करते हैं, पुत्र भी वही काम उसी प्रकार करता है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “पुत्र स्वयं से कुछ भी करने में समर्थ नहीं है, जब तक कि वह पिता को कुछ करते न देखे।”
    reason: lexical_alternative
  - marker: b
    text: “वही काम” और “उसी प्रकार” पिता के कार्यों और पुत्र के कार्यों के बीच पाठ में व्यक्त अनुरूपता को दर्शाते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: Ἀπεκρίνατο οὖν ὁ Ἰησοῦς καὶ ἔλεγεν αὐτοῖς
  choice: इसलिए यीशु ने उन्हें उत्तर दिया
  rationale: οὖν के परिणामसूचक/संयोजक बल को ‘इसलिए’ व्यक्त करता है। उत्तर देने और कहने की संयुक्त यूनानी अभिव्यक्ति को स्वाभाविक हिन्दी कथन में संक्षिप्त किया गया है; अपूर्णकाल ἔλεγεν यहाँ भाषण आरम्भ कराने वाली कथात्मक भूमिका निभाता है।
- source_word: Ἀμὴν ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच-सच कहता हूँ
  rationale: ‘सच-सच’ दोहराव के गंभीर और बलपूर्ण स्वर को रखते हुए सामान्य हिन्दी पाठक के लिए ‘आमीन, आमीन’ से अधिक स्पष्ट है।
- source_word: οὐ δύναται ὁ υἱὸς ποιεῖν ἀφ’ ἑαυτοῦ οὐδέν
  choice: पुत्र अपने-आप कुछ नहीं कर सकता
  rationale: οὐ δύναται की सामर्थ्य-संबंधी अभिव्यक्ति ‘नहीं कर सकता’ में सुरक्षित है और ἀφ’ ἑαυτοῦ को ‘अपने-आप’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐὰν μή τι βλέπῃ τὸν πατέρα ποιοῦντα
  choice: बल्कि केवल वही करता है जो वह पिता को करते देखता है
  rationale: ἐὰν μή की अपवादात्मक सीमा को सहज हिन्दी में ‘बल्कि केवल वही’ द्वारा व्यक्त किया गया है। यह यूनानी वाक्य-संबंध का अर्थ रखता है, यद्यपि हिन्दी में निहित ‘करना’ को स्पष्ट करने के लिए वाक्य थोड़ा पुनर्गठित है।
- source_word: ἃ γὰρ ἂν ἐκεῖνος ποιῇ
  choice: क्योंकि जो कुछ पिता करते हैं
  rationale: ἃ ... ἂν सामान्य और व्यापक अर्थ देता है, इसलिए ‘जो कुछ’ उपयुक्त है। ἐκεῖνος का संकेत स्पष्टता के लिए ‘पिता’ के रूप में दिया गया है; हिन्दी में ‘वह’ अस्पष्ट हो सकता था।
- source_word: ταῦτα καὶ ὁ υἱὸς ὁμοίως ποιεῖ
  choice: पुत्र भी उसी प्रकार करता है
  rationale: ‘भी’ καί को और ‘उसी प्रकार’ ὁμοίως को व्यक्त करता है तथा पिता और पुत्र के कार्यों की सटीक अनुरूपता बनाए रखता है।
theological_decisions:
- issue: पुत्र की असमर्थता और पिता पर निर्भरता का कथन
  choice: पुत्र अपने-आप कुछ नहीं कर सकता
  alternative: पुत्र स्वयं से कुछ भी करने में समर्थ नहीं है
  rationale: अनुवाद कार्य में पुत्र की पिता से अविभाज्य निर्भरता को बनाए रखता है, पर पाठ से आगे बढ़कर इसे सत्ता या स्वभाव की हीनता नहीं बताता।
- issue: ‘पुत्र’ और ‘पिता’ का शीर्षकीय प्रयोग
  choice: पुत्र / पिता
  alternative: बेटा / पिता
  rationale: यहाँ दोनों शब्द यीशु और परमेश्वर के विशिष्ट संबंधसूचक शीर्षक हैं। ‘पुत्र’ आधुनिक धार्मिक हिन्दी में गरिमापूर्ण और स्पष्ट है।
- issue: पिता और पुत्र के कार्यों की अनुरूपता
  choice: जो कुछ पिता करते हैं, पुत्र भी उसी प्रकार करता है
  alternative: पिता जो भी करते हैं, वही पुत्र भी करता है
  rationale: ‘उसी प्रकार’ ὁμοίως को स्पष्ट रूप से सुरक्षित रखता है और पाठ में व्यक्त पूर्ण कार्यगत अनुरूपता को न घटाता है, न उससे आगे कोई तात्त्विक निष्कर्ष जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘सच-सच’, ‘अपने-आप’ और ‘उसी प्रकार’ स्वाभाविक हिन्दी के साथ यूनानी पाठ का बल और संबंध सुरक्षित रखते हैं।
