  text: The man went away and reported to the Jews that Jesus was the one who had made him well[a].
translation:
  language: hi
  text: वह आदमी वहाँ से चला गया और यहूदियों[a] को बताया कि यीशु ही उसे चंगा करनेवाला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदी अगुवों” अथवा “यहूदिया के निवासियों”; अर्थ इस बात पर निर्भर है कि इस संदर्भ में यूहन्ना द्वारा प्रयुक्त “यहूदी” शब्द को कैसे समझा जाए।
    reason: मूल पद τοῖς Ἰουδαίοις की संदर्भगत सीमा अस्पष्ट है और उसे मुख्य पाठ में अनावश्यक रूप से संकुचित नहीं किया गया है।
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: वहाँ से चला गया
  rationale: क्रिया दृश्य से उसके चले जाने को बताती है; ‘वहाँ से चला गया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ ἄνθρωπος
  choice: वह आदमी
  rationale: संदर्भ में पहले से उल्लिखित चंगा किया गया पुरुष है; ‘वह आदमी’ कथात्मक हिन्दी में स्पष्ट और सहज है।
- source_word: ἀνήγγειλεν
  choice: बताया
  rationale: ἀναγγέλλω यहाँ सूचना पहुँचाने के अर्थ में है। ‘बताया’ न तो अनावश्यक रूप से औपचारिक है, न सार्वजनिक घोषणा का अतिरिक्त भाव जोड़ता है।
- source_word: τοῖς Ἰουδαίοις
  choice: यहूदियों
  rationale: मुख्य पाठ यूनानी के व्यापक पद को बनाए रखता है। यूहन्ना में इसके संभावित संदर्भगत अर्थ—यहूदी अगुवे अथवा यहूदिया के लोग—पादटिप्पणी में दिए गए हैं।
- source_word: ὅτι
  choice: कि
  rationale: यह बताई गई बात की विषयवस्तु का परिचय देने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम का प्रचलित मानक हिन्दी रूप।
- source_word: ἐστιν
  choice: था
  rationale: यूनानी में वर्तमान काल ‘है’ है, पर भूतकालीन कथन ‘बताया’ के बाद हिन्दी के अप्रत्यक्ष कथन में ‘था’ स्वाभाविक काल-सामंजस्य देता है और पहचान का अर्थ नहीं बदलता।
- source_word: ὁ ποιήσας
  choice: वह व्यक्ति ... जिसने ... किया था
  rationale: संज्ञीकृत भूतकालिक कृदंत यीशु को पहले हो चुके कार्य के कर्ता के रूप में पहचानता है; हिन्दी रचना उस पूर्ववर्ती कार्य को स्पष्ट करती है।
- source_word: αὐτὸν ὑγιῆ
  choice: उसे स्वस्थ किया था
  rationale: ὑγιής शारीरिक स्वास्थ्य या भला-चंगा होने को दर्शाता है। ‘स्वस्थ किया’ स्वाभाविक है और व्यापक आध्यात्मिक ‘सम्पूर्ण’ होने का अनावश्यक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: यूहन्ना के सुसमाचार में ‘यहूदियों’ का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’ रखा गया है और संदर्भगत विकल्प पादटिप्पणी में दिए गए हैं।
  alternative: यहूदी अगुवों; यहूदिया के लोगों
  rationale: τοῖς Ἰουδαίοις को मुख्य पाठ में किसी एक संकुचित समूह के रूप में निश्चित करना मूल की वास्तविक संदर्भगत अस्पष्टता को मिटा देगा।
- issue: यीशु की पहचान व्यक्त करने में ἐστιν का काल
  choice: अप्रत्यक्ष कथन में स्वाभाविक हिन्दी के अनुसार ‘था’
  alternative: है
  rationale: यूनानी का वर्तमान ‘है’ अधिक रूपपरक विकल्प है, पर ‘बताया ... था’ हिन्दी में काल-सामंजस्य रखता है और यह अर्थ बनाए रखता है कि उस आदमी ने यीशु को अपने स्वस्थ होने का कर्ता बताया।
