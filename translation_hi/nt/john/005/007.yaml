id: JHN.5.7
reference: John 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη αὐτῷ ὁ ἀσθενῶν· Κύριε, ἄνθρωπον οὐκ ἔχω ἵνα ὅταν ταραχθῇ τὸ ὕδωρ βάλῃ με εἰς τὴν κολυμβήθραν· ἐν ᾧ δὲ ἔρχομαι ἐγὼ ἄλλος πρὸ ἐμοῦ καταβαίνει.
base_translation:
  language: en
  yaml_path: translation/nt/john/005/007.yaml
  text: The sick man answered him, “Lord, I have no one to put me into the pool when the water is stirred up; but while I am coming, another goes down before me.”
translation:
  language: hi
  text: उस बीमार व्यक्ति ने उसे उत्तर दिया, “प्रभु, मेरे पास कोई नहीं है जो पानी के हिलाए जाने पर मुझे कुण्ड में उतार दे। जब तक मैं पहुँचता हूँ, कोई दूसरा मुझसे पहले उतर जाता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀσθενῶν
  choice: उस बीमार व्यक्ति
  rationale: वर्तमान कृदन्त उस व्यक्ति की बीमारी की दशा बताता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्बोधन का अर्थ ‘प्रभु/स्वामी’ हो सकता है। प्रसंग में विनम्र सम्बोधन की सम्भावना रहते हुए भी ‘प्रभु’ मूल शब्द की गरिमा और यूहन्ना में उसकी सम्भावित गूँज को सुरक्षित रखता है।
- source_word: βάλῃ με εἰς τὴν κολυμβήθραν
  choice: मुझे कुण्ड में उतार दे
  rationale: शाब्दिक अर्थ ‘मुझे ... में डाल दे’ है, पर अशक्त व्यक्ति को जलकुण्ड में पहुँचाने के प्रसंग में ‘उतार दे’ स्वाभाविक हिन्दी है और अगले καταβαίνει से भी मेल रखता है।
- source_word: ταραχθῇ τὸ ὕδωρ
  choice: पानी के हिलाए जाने पर
  rationale: कर्मवाच्य रूप को बनाए रखता है और पानी को कौन हिलाता है, यह पाठ में अनिर्दिष्ट रहने देता है।
- source_word: ἐν ᾧ δὲ ἔρχομαι ἐγώ
  choice: जब तक मैं पहुँचता हूँ
  rationale: उस व्यक्ति की धीमी कोशिश और इस बीच दूसरे के पहले पहुँच जाने का आशय सहज हिन्दी में व्यक्त होता है।
- source_word: καταβαίνει
  choice: उतर जाता है
  rationale: मूल की वर्तमानकालीन, बार-बार घटने वाली क्रिया को हिन्दी के सामान्य वर्तमान में व्यक्त करता है।
theological_decisions:
- issue: Κύριε का सम्बोधन
  choice: प्रभु
  alternative: महोदय / श्रीमान
  rationale: यूनानी शब्द आदरसूचक ‘महोदय’ और अधिक अर्थपूर्ण ‘प्रभु’ दोनों हो सकता है। ‘प्रभु’ को चुनना यूहन्ना के कथानक में सम्भावित धार्मिक गूँज को न मिटाते हुए वास्तविक सम्बोधन को सुरक्षित रखता है; इससे वक्ता के पूर्ण विश्वास की घोषणा अनिवार्य नहीं होती।
- issue: पानी को हिलाने वाले कर्ता की पहचान
  choice: कर्मवाच्य—‘पानी के हिलाए जाने पर’
  alternative: जब स्वर्गदूत पानी हिलाता है
  rationale: इस पद के SBLGNT पाठ में पानी हिलाने वाले का उल्लेख नहीं है। किसी स्वर्गदूत को जोड़ना बाद की पाठ-परम्परा से सामग्री आयात करना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, मौखिक संवाद के अनुकूल और गरिमापूर्ण है। ‘कुण्ड’ बेथज़था के जलाशय के लिए संक्षिप्त और प्रचलित बाइबलीय शब्द है।
