base_translation:
  language: en
  yaml_path: translation/nt/john/005/008.yaml
  text: Jesus says to him[a], “Get up, pick up your mat, and walk.”
translation:
  language: hi
  text: यीशु उससे कहते हैं, “उठो, अपनी चटाई उठाओ और चलो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी वर्तमान काल के ऐतिहासिक वर्तमान को बनाए रखा गया है; यूहन्ना की कथाशैली में यह स्वाभाविक विशेषता है और हिन्दी में भी सहज है।
- source_word: αὐτῷ
  choice: उससे
  rationale: दत्तिव परोक्ष कर्म का स्वाभाविक हिन्दी रूप; संदर्भ से व्यक्ति स्पष्ट है।
- source_word: Ἔγειρε
  choice: उठो
  rationale: आज्ञार्थक क्रिया तत्काल उठने को कहती है। ‘उठो’ आधुनिक हिन्दी में स्वाभाविक है और ‘खड़े हो जाओ’ की अपेक्षा अर्थ को अनावश्यक रूप से संकीर्ण नहीं करती।
- source_word: ἆρον
  choice: उठाओ
  rationale: यहाँ αἴρω का अर्थ किसी वस्तु को उठाकर ले जाने के लिए लेना है; ‘उठाओ’ संक्षिप्त और स्वाभाविक है।
- source_word: κράβαττόν
  choice: चटाई
  rationale: यह शब्द हल्के, साधारण सोने के बिछौने या पटिए को दर्शाता है, आधुनिक भारी पलंग को नहीं। संदर्भ में उसे उठाकर ले जाया जा सकता है, इसलिए ‘चटाई’ उपयुक्त है।
- source_word: περιπάτει
  choice: चलो
  rationale: यहाँ शारीरिक रूप से चलना अभिप्रेत है। साधारण आज्ञार्थक ‘चलो’ पर्याप्त है; निरंतरता जोड़ना पक्ष को जरूरत से अधिक स्पष्ट करेगा।
theological_decisions:
- issue: चंगाई के संदर्भ में यीशु की आज्ञा का स्वरूप
  choice: 'तीनों आज्ञाओं को सीधे शारीरिक आदेशों के रूप में रखा गया है: उठो, चटाई उठाओ और चलो।'
  alternative: ‘उठो और चंगे हो जाओ’ जैसी व्याख्यात्मक वृद्धि।
  rationale: यूनानी पाठ उठने, बिछौना उठाने और चलने की आज्ञा देता है; चंगाई संदर्भ से स्पष्ट है, पर इस पद में उसे अलग शब्दों में नहीं कहा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण कथात्मक शैली। यूनानी ऐतिहासिक वर्तमान को ‘कहते हैं’ से सुरक्षित रखा गया है। ‘चटाई’ साधारण, उठाकर ले जाने योग्य सोने के बिछौने का भाव देती है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं समझी गई।
