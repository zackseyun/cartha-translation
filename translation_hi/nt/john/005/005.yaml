  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; हिन्दी में प्रसंग का प्रवाह बिना किसी कृत्रिम ‘अब’ या प्रबल विरोधसूचक शब्द के स्वाभाविक रूप से व्यक्त होता है।
- source_word: τις ἄνθρωπος
  choice: एक मनुष्य
  rationale: यह अनिश्चित रूप से एक पुरुष व्यक्ति का परिचय देता है; ‘एक मनुष्य’ गरिमापूर्ण और सहज है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह पिछले प्रसंग में वर्णित स्थान पर उस मनुष्य की उपस्थिति बताता है।
- source_word: τριάκοντα ὀκτὼ ἔτη
  choice: अड़तीस वर्ष से
  rationale: कालावधि को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है और जारी दशा का भाव बनाए रखता है।
- source_word: ἔχων ἐν τῇ ἀσθενείᾳ αὐτοῦ
  choice: अपनी बीमारी में पड़ा था
  rationale: शाब्दिक ‘अपनी बीमारी में था’ हिन्दी में अस्वाभाविक है। ‘पड़ा था’ दीर्घकालीन शारीरिक दशा को सहज रूप से व्यक्त करता है, पर बीमारी का कोई विशिष्ट प्रकार नहीं जोड़ता।
