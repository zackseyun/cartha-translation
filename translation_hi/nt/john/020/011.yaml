lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले दृश्य से मरियम की ओर हल्का कथात्मक मोड़ और विरोध दर्शाता है।
- source_word: εἱστήκει
  choice: खड़ी ... थी
  rationale: क्रिया का काल उस समय जारी अवस्था को व्यक्त करता है, इसलिए हिन्दी में अपूर्ण भूतकाल स्वाभाविक है।
- source_word: πρὸς τῷ μνημείῳ ἔξω
  choice: कब्र के बाहर
  rationale: यह मरियम का स्थान कब्र के बाहर बताता है और आगे भीतर देखने के साथ स्थानिक विरोध बनाए रखता है।
- source_word: μνημεῖον
  choice: कब्र
  rationale: यहाँ शब्द शव रखे जाने वाले कब्र-स्थान को दर्शाता है; आधुनिक हिन्दी में ‘कब्र’ सटीक और सहज है।
- source_word: κλαίουσα / ἔκλαιεν
  choice: रो रही थी / रोते-रोते
  rationale: दोनों रूप लगातार रोने की क्रिया बताते हैं; हिन्दी में यह पुनरुक्ति प्रवाह और जारी क्रिया दोनों को स्वाभाविक ढंग से रखती है।
- source_word: παρέκυψεν
  choice: झुककर ... देखने लगी
  rationale: क्रिया में भीतर देखने के लिए शरीर झुकाने का भाव शामिल है; यह चयन गति और देखने के उद्देश्य दोनों को स्पष्ट करता है।
- source_word: εἰς τὸ μνημεῖον
  choice: कब्र के भीतर
  rationale: εἰς कब्र के अंदर की ओर देखने की दिशा बताता है।
