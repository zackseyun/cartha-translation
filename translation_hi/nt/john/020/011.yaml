review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Mary’s location, ongoing weeping, and her action of bending to look into the tomb. However, “देखने लगी” normally adds an ingressive sense (“began to look”) that is not expressed by the Greek aorist παρέκυψεν. Replacing it with “झाँकी” preserves the completed narrative action and the sense of bending/looking in.
  naturalness: “कब्र के बाहर खड़ी रो रही थी” is natural modern Hindi. “जब वह रो रही थी, तब वह झुककर कब्र के भीतर झाँकी” is clear, dignified, and avoids the unintended ‘began’ nuance.
  terminology: “मरियम,” “कब्र,” and “रो रही थी” are appropriate and consistent with a modern, broadly understandable Hindi biblical register. “झाँकी” naturally conveys looking into something, while “झुककर” retains the bodily movement inherent in παρέκυψεν.
  issues:
  - severity: medium
    issue: “देखने लगी” introduces an ingressive nuance.
    rationale: The expression commonly means that she started to look. παρέκυψεν is an aorist describing her bending/looking action, without specifically stating that she began it.
  - severity: low
    issue: The footnote’s proposed alternative repeats the draft’s ingressive wording.
    rationale: The alternative should not perpetuate the same unnecessary ‘began to look’ nuance; it can instead give a genuine, equally faithful alternative.
  revised_text: परन्तु मरियम कब्र के बाहर खड़ी रो रही थी। जब वह रो रही थी, तब वह झुककर कब्र के भीतर झाँकी।[a]
