source:
  edition: SBLGNT
  text: ταῦτα δὲ γέγραπται ἵνα ⸀πιστεύητε ὅτι Ἰησοῦς ἐστιν ὁ χριστὸς ὁ υἱὸς τοῦ θεοῦ, καὶ ἵνα πιστεύοντες ζωὴν ἔχητε ἐν τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/031.yaml
  text: But these have been written so that you may believe that Jesus is the Messiah[a], the Son of God[b], and so that by believing you may have life in his name.
translation:
  language: hi
  text: परन्तु ये बातें इसलिए लिखी गई हैं कि तुम विश्वास करो[a] कि यीशु मसीह है और परमेश्वर का पुत्र है, और ताकि विश्वास करते हुए तुम उसके नाम में जीवन पाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में यहाँ ऐसा यूनानी क्रियारूप है जिसका अर्थ ‘तुम विश्वास करने लगो’ हो सकता है; अन्य पांडुलिपियाँ ‘तुम विश्वास करते रहो’ का संकेत देने वाले रूप का समर्थन करती हैं। मुख्य पाठ का ‘विश्वास करो’ दोनों संभावनाओं को खुला रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: ταῦτα δὲ
  choice: परन्तु ये बातें
  rationale: ‘ये बातें’ निकटवर्ती लिखित चिन्हों और वृत्तांत की ओर संकेत करता है; ‘परन्तु’ पिछले कथन से हल्का विरोध और विचार का मोड़ व्यक्त करता है।
- source_word: γέγραπται
  choice: लिखी गई हैं
  rationale: यूनानी पूर्णकाल कर्मवाच्य उस लेखन को दर्शाता है जो पूरा हो चुका है और जिसका परिणाम वर्तमान में बना हुआ है। हिंदी का यह रूप उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα πιστεύητε
  choice: इसलिए ... कि तुम विश्वास करो
  rationale: यह उद्देश्य बताता है। ‘विश्वास करो’ हिंदी में इतना व्यापक है कि मुद्रित वर्तमान रूप के निरंतर विश्वास और पाठांतर के आरंभिक विश्वास—दोनों को अनावश्यक रूप से तय नहीं करता।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यह यीशु की उपाधि है। ‘मसीह’ आधुनिक हिंदी के बाइबलीय प्रयोग में अभिषिक्त उद्धारकर्ता-राजा की उपाधि को व्यक्त करता है, केवल व्यक्तिगत नाम को नहीं।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: मूल मसीह-संबंधी उपाधि को बिना विस्तार या शिथिलीकरण के सुरक्षित रखा गया है।
- source_word: πιστεύοντες
  choice: विश्वास करते हुए
  rationale: कृदंत को क्रियाविशेषणात्मक रूप में रखा गया है। इससे विश्वास और जीवन पाने का संबंध बना रहता है, पर साधन और साथ-साथ घटित परिस्थिति के बीच की संभावित सूक्ष्मता को कठोरता से तय नहीं किया जाता।
- source_word: ζωὴν ἔχητε
  choice: जीवन पाओ
  rationale: मूल में केवल ‘जीवन’ है, ‘अनन्त’ विशेषण नहीं; इसलिए संदर्भगत गहराई को बनाए रखते हुए कोई अतिरिक्त शब्द नहीं जोड़ा गया।
- source_word: ἐν τῷ ὀνόματι αὐτοῦ
  choice: उसके नाम में
  rationale: यह मूल के निकट है और ‘नाम’ में निहित व्यक्ति, अधिकार और सामर्थ्य के व्यापक भाव को किसी एक व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस पद में Χριστός यीशु की मसीही पहचान बताने वाली उपाधि है। ‘मसीह’ हिंदी में उसके अभिषिक्त होने और यहूदी मसीही संदर्भ को ‘ख्रीष्ट’ की अपेक्षा अधिक स्पष्ट रूप से बनाए रखता है।
- issue: πιστεύητε का पाठांतर और पक्षगत अर्थ
  choice: विश्वास करो
  alternative: विश्वास करते रहो / विश्वास करने लगो
  rationale: SBLGNT में वर्तमान विधिलिंग πιστεύητε है, जो निरंतर विश्वास का संकेत दे सकता है; कुछ पांडुलिपियों में अओरिस्ट πιστεύσητε है, जो विश्वास करने लगने की ओर अधिक स्वाभाविक संकेत कर सकता है। मुख्य पाठ व्यापक रखा गया है और अंतर पादटिप्पणी में दिया गया है।
- issue: ‘नाम में’ का अर्थ-संबंध
  choice: उसके नाम में
  alternative: उसके नाम के द्वारा
  rationale: ‘के द्वारा’ साधन का अर्थ अधिक निश्चित कर देता। ‘नाम में’ मूल की अभिव्यक्ति और उसकी धर्मवैचारिक व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की दोनों उद्देश्य-धाराएँ स्पष्ट हैं। ‘मसीह’, ‘परमेश्वर का पुत्र’ और ‘उसके नाम में’ जैसे प्रमुख धर्मवैचारिक पद मूल के निकट रखे गए हैं, जबकि पाठांतर और पक्षगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
