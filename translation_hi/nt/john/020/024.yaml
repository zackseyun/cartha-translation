id: JHN.20.24
reference: John 20:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Θωμᾶς δὲ εἷς ἐκ τῶν δώδεκα, ὁ λεγόμενος Δίδυμος, οὐκ ἦν μετ’ αὐτῶν ὅτε ⸀ἦλθεν Ἰησοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/024.yaml
  text: Thomas[a], one of the Twelve, the one called Didymus, was not with them when Jesus came.
translation:
  language: hi
  text: थोमा, जो बारहों में से एक था और दिदुमुस[a] कहलाता था, उस समय उनके साथ नहीं था जब यीशु आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी ‘दिदुमुस’ का अर्थ ‘जुड़वाँ’ है।
    reason: नाम के शाब्दिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: δὲ
  choice: अलग संयोजक शब्द नहीं; प्रसंगगत बदलाव वाक्य-क्रम से व्यक्त
  rationale: यहाँ δέ हल्का कथात्मक परिवर्तन दिखाता है, प्रबल विरोध नहीं। हिन्दी में ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ और ‘लेकिन’ जोड़ने से अपेक्षा से अधिक विरोध उत्पन्न हो सकता है।
- source_word: εἷς ἐκ τῶν δώδεκα
  choice: बारहों में से एक
  rationale: यह स्थापित प्रेरित-समूह के एक सदस्य के रूप में थोमा की पहचान कराता है; हिन्दी में ‘बारहों’ इसी सामूहिक पदवी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ λεγόμενος Δίδυμος
  choice: दिदुमुस कहलाता था
  rationale: Δίδυμος यहाँ थोमा की प्रचलित यूनानी उपाधि/नाम है। मुख्य पाठ में पारंपरिक रूप ‘दिदुमुस’ रखा गया है और उसका अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: οὐκ ἦν μετ’ αὐτῶν
  choice: उस समय उनके साथ नहीं था
  rationale: अपूर्ण भूतकाल और μετά के भाव को सहज हिन्दी में व्यक्त करता है; ‘उस समय’ उसकी उस अवसर पर अनुपस्थिति स्पष्ट करता है।
- source_word: ὅτε ἦλθεν Ἰησοῦς
  choice: जब यीशु आए
  rationale: ἔρχομαι का सीधा अर्थ ‘आना’ है। ‘आए’ आधुनिक सम्मानसूचक हिन्दी के अनुरूप है और मूल कथन में कोई अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: Δίδυμος का अनुवाद या लिप्यंतरण
  choice: मुख्य पाठ में ‘दिदुमुस’, अर्थ पाद-टिप्पणी में ‘जुड़वाँ’
  alternative: मुख्य पाठ में ‘जुड़वाँ कहलाता था’
  rationale: यह doctrinally विवादित शब्द नहीं है, पर स्रोत इसे नाम/उपाधि के रूप में प्रस्तुत करता है। लिप्यंतरण पाठकीय पहचान बनाए रखता है, जबकि पाद-टिप्पणी उसका वास्तविक शाब्दिक अर्थ पारदर्शी बनाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बारहों’ स्थापित समूह को संक्षेप में व्यक्त करता है, और यीशु के लिए सम्मानसूचक बहुवचन ‘आए’ प्रयोग किया गया है।
