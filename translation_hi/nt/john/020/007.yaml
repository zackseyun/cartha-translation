source:
  edition: SBLGNT
  text: καὶ τὸ σουδάριον, ὃ ἦν ἐπὶ τῆς κεφαλῆς αὐτοῦ, οὐ μετὰ τῶν ὀθονίων κείμενον ἀλλὰ χωρὶς ἐντετυλιγμένον εἰς ἕνα τόπον·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/007.yaml
  text: and the face cloth[a], which had been on his head, was not lying with the linen cloths but folded up separately in one place.
translation:
  language: hi
  text: और वह सिर का कपड़ा[a] भी, जो उसके सिर पर था, सन के कपड़ों के साथ पड़ा हुआ नहीं था, बल्कि अलग, एक स्थान पर लिपटा हुआ[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चेहरे का कपड़ा।”
    reason: शब्दार्थ का वैकल्पिक अनुवाद (σουδάριον)।
  - marker: b
    text: या “तह किया हुआ” या “लपेटा हुआ।”
    reason: शब्दार्थ के वैकल्पिक अनुवाद (ἐντετυλιγμένον)।
lexical_decisions:
- source_word: σουδάριον
  choice: सिर का कपड़ा
  rationale: दफ़न के इस संदर्भ में यह यीशु के सिर या चेहरे पर रखा कपड़ा है। अगला वाक्यांश स्पष्टतः सिर का उल्लेख करता है, इसलिए यह सहज और स्रोत-संगत है।
- source_word: ἐπὶ τῆς κεφαλῆς αὐτοῦ
  choice: उसके सिर पर
  rationale: पूर्वसर्गीय वाक्यांश का सीधा अनुवाद है और कपड़े के ठीक किस ढंग से रखे होने को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὀθονίων
  choice: मलमल की पट्टियाँ
  rationale: बहुवचन उन सन के महीन कपड़ों या पट्टियों को सूचित करता है जिनका दफ़न में उपयोग हुआ था; हिंदी बाइबलीय संदर्भ में यह स्पष्ट और स्वाभाविक है।
- source_word: κείμενον
  choice: पड़ा
  rationale: भौतिक रूप से किसी स्थान पर पड़े होने की स्थिति को सहज हिंदी में व्यक्त करता है।
- source_word: χωρὶς
  choice: उनसे अलग
  rationale: दूसरे दफ़न-वस्त्रों से स्थानिक अलगाव को स्पष्ट करता है और यूनानी विरोध को बनाए रखता है।
- source_word: ἐντετυλιγμένον
  choice: लपेटकर रखा हुआ
  rationale: पूर्ण निष्क्रिय कृदंत कपड़े की लिपटी या तह की हुई अवस्था बताता है। 'लपेटकर' मूल शब्द के अर्थ-क्षेत्र को 'तह किया हुआ' से अधिक सावधानी से बनाए रखता है।
- source_word: εἰς ἕνα τόπον
  choice: एक जगह
  rationale: एक अलग निश्चित स्थान का सीधा और स्वाभाविक संकेत देता है।
- source_word: καὶ
  choice: और ... भी
  rationale: पिछले पद के वर्णन को आगे बढ़ाता है; हिंदी में 'भी' उस दूसरे कपड़े को वर्णन में जोड़ने का संबंध स्पष्ट करता है।
theological_decisions:
- issue: क्या कपड़ों की व्यवस्था वर्णन से आगे कोई प्रतीकात्मक या प्रमाणात्मक दावा करती है
  choice: कपड़े की अलग स्थिति और दशा का केवल दृश्य वर्णन
  alternative: तह या व्यवस्था को पुनरुत्थान की सुव्यवस्था का प्रतीक अथवा घटना के किसी विशिष्ट पुनर्निर्माण का प्रमाण मानना
  rationale: यूनानी पाठ स्थान और अवस्था का वर्णन करता है, पर स्वयं कोई प्रतीकात्मक या धर्मवैज्ञानिक निष्कर्ष व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। दफ़न-वस्त्रों का वर्णन प्रत्यक्ष रखा गया है और कपड़े की दशा से कोई अतिरिक्त प्रतीकात्मक निष्कर्ष नहीं निकाला गया।
