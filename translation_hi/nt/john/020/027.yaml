base_translation:
  language: en
  yaml_path: translation/nt/john/020/027.yaml
  text: Then he said to Thomas[a], “Bring your finger here and see my hands, and bring your hand and put it into my side, and do not become unbelieving, but believing.”
translation:
  language: hi
  text: फिर उसने थोमा से कहा, “अपनी उँगली यहाँ लाकर मेरे हाथों को देख, और अपना हाथ लाकर मेरे पार्श्व में डाल; अविश्वासी न बन, बल्कि विश्वासी बन।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निष्ठाहीन न बन, बल्कि निष्ठावान बन।” यूनानी विशेषणों के ये अर्थ भी हो सकते हैं, पर यहाँ मुख्य बात जी उठे यीशु पर थोमा का विश्वास है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶτα
  choice: फिर
  rationale: यह कथा में अगली घटना का क्रम दिखाता है; ‘फिर’ स्वाभाविक और संक्षिप्त है।
- source_word: λέγει
  choice: उसने ... कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-शैली में सामान्य भूतकाल अधिक स्वाभाविक है।
- source_word: Φέρε ... φέρε
  choice: लाकर ... लाकर
  rationale: दोनों आज्ञाओं में φέρε की पुनरावृत्ति बनाए रखी गई है और अंग को यीशु की ओर लाने की गति व्यक्त होती है।
- source_word: δάκτυλόν σου ὧδε
  choice: अपनी उँगली यहाँ
  rationale: ὧδε का स्थानसूचक बल ‘यहाँ’ से सीधे व्यक्त होता है।
- source_word: ἴδε τὰς χεῖράς μου
  choice: मेरे हाथों को देख
  rationale: आज्ञार्थक ἴδε और बहुवचन χεῖρας का सीधा, स्वाभाविक अनुवाद है।
- source_word: βάλε εἰς τὴν πλευράν μου
  choice: मेरी पसली में डाल
  rationale: βάλε की स्पष्ट आज्ञा और εἰς की भीतर की ओर गति ‘में डाल’ से व्यक्त होती है; πλευρά के लिए प्रसंगानुकूल प्रचलित हिन्दी ‘पसली’ चुना गया है।
- source_word: μὴ γίνου
  choice: नहीं ... बन
  rationale: γίνομαι के परिवर्तन अथवा अवस्था में आने के भाव को स्थिर ‘मत हो’ के बजाय ‘नहीं ... बन’ सुरक्षित रखता है।
- source_word: ἄπιστος ... πιστός
  choice: अविश्वासी ... विश्वासी
  rationale: थोमा द्वारा जी उठे यीशु पर विश्वास करने के तात्कालिक प्रसंग में यह युग्म स्पष्ट है और यूनानी विशेषणों का समानांतर विरोध बनाए रखता है।
theological_decisions:
- issue: ἄπιστος / πιστός के विरोध का अर्थ
  choice: अविश्वासी / विश्वासी
  alternative: विश्वासहीन / विश्वासयोग्य
  rationale: तात्कालिक प्रसंग थोमा के पुनरुत्थान के साक्ष्य पर विश्वास न करने से जुड़ा है, इसलिए विश्वास करने वाला अर्थ प्रमुख है। फिर भी यूनानी विशेषण निष्ठाहीन/विश्वासयोग्य का अर्थ भी ले सकते हैं; इसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। यीशु का थोमा को एकवचन संबोधन निकट और सीधा रखने के लिए ‘अपनी/देख/डाल/बन’ प्रयुक्त हुआ है। पादटिप्पणी-चिह्न पूरे उद्धरण के बाद रखा गया है क्योंकि वह अंतिम विरोधी पद-युग्म की वैकल्पिक व्याख्या बताता है।
