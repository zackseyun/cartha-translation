id: JHN.20.21
reference: John 20:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν οὖν αὐτοῖς ⸂ὁ Ἰησοῦς⸃ πάλιν· Εἰρήνη ὑμῖν· καθὼς ἀπέσταλκέν με ὁ πατήρ, κἀγὼ πέμπω ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/021.yaml
  text: So Jesus said to them again[a], “Peace to you. As the Father has sent me, even so I am sending you.”
translation:
  language: hi
  text: तब यीशु ने उनसे फिर कहा, “तुम्हें शांति मिले[a]। जैसे पिता ने मुझे भेजा है, वैसे ही मैं भी तुम्हें भेजता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परंपरागत रूप में, “तुम्हारे साथ शांति हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: तब
  rationale: यह पिछले दृश्य से कथा की आगे की गति और हल्के निष्कर्षात्मक संबंध को व्यक्त करता है; यहाँ ‘तब’ स्वाभाविक हिन्दी है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पिछले पद में यीशु द्वारा दिए गए अभिवादन की पुनरावृत्ति स्पष्ट करता है।
- source_word: Εἰρήνη ὑμῖν
  choice: तुम्हें शांति मिले
  rationale: यूनानी का शब्दशः भाव ‘तुम्हें शांति’ है। हिन्दी में ‘मिले’ जोड़ने से यह संक्षिप्त, स्वाभाविक अभिवादन बनता है, जबकि मूल की शांति-कामना सुरक्षित रहती है।
- source_word: καθὼς
  choice: जैसे
  rationale: यह पिता द्वारा यीशु को भेजे जाने और यीशु द्वारा शिष्यों को भेजे जाने के बीच तुलना आरम्भ करता है।
- source_word: ἀπέσταλκέν
  choice: भेजा है
  rationale: पूर्णकाल किसी पूरे हुए कार्य की वर्तमान प्रासंगिकता दिखाता है; ‘भेजा है’ हिन्दी में इसे अच्छी तरह व्यक्त करता है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: मूल में स्पष्ट स्वामित्वसूचक ‘मेरे’ नहीं है। ‘पिता’ यूहन्ना की विशिष्ट भाषा और मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: κἀγὼ
  choice: वैसे ही मैं भी
  rationale: यह ‘जैसे’ से आरम्भ हुई तुलना का समकक्ष भाग व्यक्त करता है और ‘मैं’ पर निहित बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πέμπω
  choice: भेजता हूँ
  rationale: वर्तमानकाल यहाँ आदेशात्मक प्रेषण की तत्काल घोषणा है। ‘भेजता हूँ’ हिन्दी में औपचारिक नियुक्ति और वर्तमान क्रिया—दोनों के लिए स्वाभाविक है।
theological_decisions:
- issue: पिता द्वारा यीशु को भेजे जाने और यीशु द्वारा शिष्यों को भेजे जाने का संबंध
  choice: “जैसे पिता ने मुझे भेजा है, वैसे ही मैं भी तुम्हें भेजता हूँ”
  alternative: “जिस प्रकार पिता ने मुझे भेजा है, उसी प्रकार मैं तुम्हें भेजता हूँ”
  rationale: अनुवाद दोनों प्रेषणों के बीच मूल में उपस्थित समानता को बनाए रखता है, पर अधिकार, रीति या पद की पूर्ण समानता जैसी अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘तुम’ बहुवचन शिष्यों को संबोधित करता है; वाक्य में अनावश्यक धर्मवैज्ञानिक विस्तार से बचते हुए मूल की मिशन-संबंधी तुलना सुरक्षित रखी गई है।
