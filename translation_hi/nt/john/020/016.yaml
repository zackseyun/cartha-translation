base_translation:
  language: en
  yaml_path: translation/nt/john/020/016.yaml
  text: Jesus says to her[a], “Mary.” Turning, she says to him in Hebrew, “Rabboni!” (which means, “Teacher”).
translation:
  language: hi
  text: यीशु उससे कहते हैं, “मरियम!” वह मुड़कर उनसे इब्रानी में[a] कहती है, “रब्बूनी!” (जिसका अर्थ है, “गुरु”)।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अरामी में।” यूहन्ना का “इब्रानी में” कहना यहूदिया की सामी बोली के लिए अधिक व्यापक अर्थ में भी हो सकता है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: λέγει
  choice: कहते हैं
  rationale: यूहन्ना की सजीव ऐतिहासिक-वर्तमान शैली को बनाए रखने के लिए वर्तमान काल रखा गया है; यीशु के लिए आदरसूचक बहुवचन स्वाभाविक हिन्दी है।
- source_word: αὐτῇ
  choice: उससे
  rationale: सम्बन्धवाचक चतुर्थी को स्वाभाविक हिन्दी में ‘उससे’ व्यक्त किया गया है।
- source_word: Μαριάμ
  choice: मरियम
  rationale: इस बाइबिलीय नाम का प्रचलित और सहज हिन्दी रूप।
- source_word: στραφεῖσα
  choice: मुड़कर
  rationale: अओरिस्ट कृदन्त की पूर्ववर्ती क्रिया को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκείνη
  choice: वह
  rationale: सन्दर्भ में संकेतवाचक सर्वनाम को स्वाभाविक हिन्दी कर्ता-सर्वनाम के रूप में दिया गया है।
- source_word: Ἑβραϊστί
  choice: इब्रानी में
  rationale: मुख्य पाठ यूनानी शब्द के प्रत्यक्ष अर्थ को बनाए रखता है; ‘अरामी में’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: Ραββουνι
  choice: रब्बूनी
  rationale: मूल सम्बोधन का ध्वन्यन्तरण रखा गया है, क्योंकि सुसमाचार स्वयं तुरन्त उसका अर्थ बताता है।
- source_word: ὃ λέγεται Διδάσκαλε
  choice: जिसका अर्थ है, “गुरु”
  rationale: यह वाक्यांश मूल सम्बोधन की व्याख्या करता है। ‘गुरु’ हिन्दी में Διδάσκαλε का संक्षिप्त, प्रतिष्ठित और सन्दर्भानुकूल रूप है।
theological_decisions:
- issue: यूहन्ना के वर्णन में Ἑβραϊστί का अर्थ
  choice: इब्रानी में
  alternative: अरामी में
  rationale: मूल यूनानी की अभिव्यक्ति को मुख्य पाठ में रखा गया है। चूँकि यूहन्ना का शब्द यहूदिया की अरामी सामी बोली को भी सूचित कर सकता है, इस सम्भावना को बिना निर्णायक बनाए पादटिप्पणी में दिया गया है।
