source:
  edition: SBLGNT
  text: ἔλεγον οὖν αὐτῷ οἱ ἄλλοι μαθηταί· Ἑωράκαμεν τὸν κύριον. ὁ δὲ εἶπεν αὐτοῖς· Ἐὰν μὴ ἴδω ἐν ταῖς χερσὶν αὐτοῦ τὸν τύπον τῶν ἥλων καὶ βάλω τὸν δάκτυλόν μου εἰς τὸν τύπον τῶν ἥλων καὶ βάλω ⸂μου τὴν χεῖρα⸃ εἰς τὴν πλευρὰν αὐτοῦ, οὐ μὴ πιστεύσω.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/025.yaml
  text: So the other disciples were telling him[a], “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and put my finger into the mark of the nails, and put my hand into his side, I will certainly not believe.”
translation:
  language: hi
  text: तब बाकी चेले उससे कहते रहे, “हमने प्रभु को देखा है।” पर उसने उनसे कहा, “जब तक मैं उसके हाथों में कीलों के निशान न देख लूँ, कीलों के निशान में अपनी उँगली न डालूँ और उसके पहलू में अपना हाथ न डालूँ, तब तक मैं बिल्कुल विश्वास नहीं करूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं कभी विश्वास नहीं करूँगा।” यूनानी में यहाँ बहुत जोरदार नकार का प्रयोग हुआ है।
    reason: οὐ μὴ की प्रबल नकारात्मकता का एक अधिक निरपेक्ष हिन्दी विकल्प देना, जबकि मुख्य पाठ शर्त-सापेक्ष अर्थ को स्पष्ट रखता है।
lexical_decisions:
- source_word: ἔλεγον
  choice: कहते रहे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार की गई क्रिया को व्यक्त करता है; साधारण ‘कहा’ की अपेक्षा प्रसंग का आग्रह अधिक स्पष्ट होता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछली घटना से कथा की परिणति और आगे बढ़ने का संबंध बनाए रखता है।
- source_word: οἱ ἄλλοι μαθηταί
  choice: दूसरे चेले
  rationale: थोमा के विपरीत शेष शिष्यों का सीधा और स्वाभाविक उल्लेख है। ‘चेले’ आधुनिक सामान्य पाठक के लिए सहज है।
- source_word: Ἑωράκαμεν
  choice: हमने ... देखा है
  rationale: पूर्णकाल में बीती हुई घटना का वर्तमान महत्व निहित है, जिसे हिन्दी का ‘देखा है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: κύριον
  choice: प्रभु
  rationale: यहाँ जी उठे यीशु के लिए उपाधि है; केवल ‘गुरु’ या ‘स्वामी’ कहने से उसका मसीही भार घट सकता है।
- source_word: Ἐὰν μὴ ἴδω
  choice: जब तक ... न देख लूँ
  rationale: नकारात्मक शर्त को स्वाभाविक हिन्दी में व्यक्त करता है और आगे के ‘तब तक’ के साथ शर्त की पूरी संरचना बनाए रखता है।
- source_word: ἐν ταῖς χερσὶν αὐτοῦ
  choice: उसके हाथों में
  rationale: शरीर में स्थित घाव या निशान के लिए ἐν का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: τύπον
  choice: निशान
  rationale: कीलों से बने दिखाई देने वाले चिह्न को स्पष्ट आधुनिक भाषा में व्यक्त करता है; ‘छाप’ यहाँ कम स्वाभाविक होती।
- source_word: ἥλων
  choice: कीलों के
  rationale: निशान और उसे उत्पन्न करने वाली कीलों का संबंध संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: βάλω
  choice: डालूँ
  rationale: उँगली या हाथ को किसी घाव अथवा खुले स्थान के भीतर ले जाने की गति के लिए स्वाभाविक हिन्दी क्रिया है।
- source_word: τὸν δάκτυλόν μου εἰς
  choice: अपनी उँगली ... में
  rationale: εἰς की भीतर की ओर गति को बनाए रखता है; हिन्दी में कर्ता के अपने अंग के लिए ‘अपनी’ स्वाभाविक है।
- source_word: μου τὴν χεῖρα
  choice: अपना हाथ
  rationale: मूल में व्यक्त स्वामित्व को स्पष्ट रखता है और हिन्दी में कर्ता से संबंध के कारण ‘अपना’ उचित है।
- source_word: πλευράν
  choice: पहलू
  rationale: धड़ के पार्श्व भाग और वहाँ के घाव का संकेत देता है; ‘बगल’ से काँख का भ्रामक अर्थ निकल सकता है और ‘पार्श्व’ सामान्य पाठक के लिए अधिक औपचारिक है।
- source_word: οὐ μὴ πιστεύσω
  choice: मैं बिल्कुल विश्वास नहीं करूँगा
  rationale: दोहरा यूनानी नकार दृढ़ अस्वीकार व्यक्त करता है। ‘बिल्कुल ... नहीं’ आधुनिक हिन्दी में उसका जोर बनाए रखता है, पर शर्त के भीतर इसे निरपेक्ष और सदा के लिए ‘कभी नहीं’ नहीं बनाता।
theological_decisions:
- issue: थोमा के अस्वीकार में οὐ μὴ πιστεύσω का बल
  choice: मैं बिल्कुल विश्वास नहीं करूँगा
  alternative: मैं कभी विश्वास नहीं करूँगा
  rationale: मूल यूनानी में अत्यंत जोरदार नकार है, पर पूरा कथन पहले रखी गई शर्त से बँधा है। मुख्य पाठ दृढ़ता को बचाता है, बिना यह जोड़ने के कि थोमा का अविश्वास हर परिस्थिति में सदा के लिए अंतिम था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल के निकट रखी गई है। ‘कहते रहे’ जारी आग्रह को, ‘देखा है’ पूर्णकाल के वर्तमान महत्व को, और ‘बिल्कुल विश्वास नहीं करूँगा’ मूल के जोरदार नकार को व्यक्त करता है। ‘पहलू’ को ‘बगल’ की संभावित शारीरिक अस्पष्टता और ‘पार्श्व’ की अत्यधिक औपचारिकता से बचने के लिए चुना गया है।
