id: JHN.20.15
reference: John 20:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει ⸀αὐτῇ Ἰησοῦς· Γύναι, τί κλαίεις; τίνα ζητεῖς; ἐκείνη δοκοῦσα ὅτι ὁ κηπουρός ἐστιν λέγει αὐτῷ· Κύριε, εἰ σὺ ἐβάστασας αὐτόν, εἰπέ μοι ποῦ ἔθηκας αὐτόν, κἀγὼ αὐτὸν ἀρῶ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/015.yaml
  text: Jesus says to her[a], “Woman, why are you weeping? Whom are you seeking?” She, supposing that he was the gardener, says to him, “Sir, if you carried him away, tell me where you put him, and I will take him away.”
translation:
  language: hi
  text: यीशु उससे कहते हैं, “हे स्त्री, तुम क्यों रो रही हो? किसे ढूँढ़ रही हो?” वह उन्हें माली समझकर उनसे कहती है, “महोदय[a], यदि आप ही उसे उठाकर ले गए हैं, तो मुझे बता दीजिए कि आपने उसे कहाँ रखा है; मैं उसे ले जाऊँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अनुवाद ‘प्रभु’ भी हो सकता है; यहाँ मरियम यीशु को माली समझकर सम्भवतः आदर से ‘महोदय’ कह रही है।
    reason: κύριε के विनम्र संबोधन और ‘प्रभु’ शीर्षक—दोनों सम्भव अर्थों को पारदर्शी रखना।
lexical_decisions:
- source_word: Γύναι
  choice: हे स्त्री
  rationale: यह संबोधन यूनानी में आदरपूर्ण है, अपमानजनक नहीं। ‘हे स्त्री’ मूल संबोधन की सीधाई को बनाए रखता है और यूहन्ना में इसके दोहराव को भी सुरक्षित रखता है।
- source_word: τί κλαίεις
  choice: तुम क्यों रो रही हो
  rationale: κλαίω का अर्थ रोना या विलाप करना है; यहाँ सहज आधुनिक हिन्दी में ‘रो रही हो’ दृश्य की भावनात्मक गंभीरता व्यक्त करता है।
- source_word: τίνα ζητεῖς
  choice: किसे ढूँढ़ रही हो
  rationale: ζητέω यहाँ किसी व्यक्ति को खोजने के अर्थ में है। ‘किसे’ व्यक्तिगत कर्म को और ‘ढूँढ़ रही हो’ स्वाभाविक हिन्दी को बनाए रखता है।
- source_word: δοκοῦσα
  choice: समझकर
  rationale: यह मरियम की गलत धारणा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, बिना उसकी निश्चितता को आवश्यकता से अधिक बढ़ाए।
- source_word: ὁ κηπουρός
  choice: माली
  rationale: κηπουρός का सीधा और सामान्य हिन्दी अर्थ ‘माली’ है।
- source_word: Κύριε
  choice: महोदय
  rationale: मरियम यीशु को माली समझ रही है, इसलिए यहाँ यह शब्द विनम्र संबोधन है। ‘महोदय’ आदर को व्यक्त करता है, जबकि मूल शब्द का शाब्दिक धार्मिक रूप फुटनोट में सुरक्षित है।
- source_word: εἰ σὺ ἐβάστασας αὐτόν
  choice: यदि आप ही उसे उठाकर ले गए हैं
  rationale: βαστάζω शव को उठाकर ले जाने की भौतिक क्रिया व्यक्त कर सकता है। ‘आप ही’ यूनानी के स्पष्ट σὺ पर पड़े बल को दर्शाता है।
- source_word: ποῦ ἔθηκας αὐτόν
  choice: आपने उसे कहाँ रखा है
  rationale: τίθημι का सामान्य अर्थ रखना, धरना या लिटाना है; ‘कहाँ रखा है’ आधुनिक हिन्दी में सहज है और मूल अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: κἀγὼ αὐτὸν ἀρῶ
  choice: मैं उसे ले जाऊँगी
  rationale: αἴρω यहाँ शव को वहाँ से ले जाने के अर्थ में है। भविष्यकाल और मरियम का संकल्प दोनों सुरक्षित हैं।
theological_decisions:
- issue: यीशु को पहचानने से पहले मरियम द्वारा κύριε का प्रयोग
  choice: महोदय
  alternative: प्रभु
  rationale: κύριε सामान्यतः ‘प्रभु’ हो सकता है, पर इस प्रसंग में मरियम सामने वाले को माली मानती है। इसलिए विनम्र संबोधन ‘महोदय’ अधिक संभावित है; मूल शब्द की दूसरी सम्भावना फुटनोट में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक वर्तमान (‘कहते हैं’, ‘कहती है’) को मूल यूनानी कथन-शैली के अनुरूप रखा गया है। यीशु के लिए आदरसूचक बहुवचन और मरियम के संबोधन में ‘आप’ स्वाभाविक हिन्दी सम्मान-प्रयोग के कारण अपनाए गए हैं।
