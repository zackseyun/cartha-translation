  text: Thomas answered and said to him[a], “My Lord and my God!”
translation:
  language: hi
  text: थोमा ने उसे उत्तर दिया और कहा, “मेरे प्रभु और मेरे परमेश्वर!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक वैकल्पिक, किंतु कम संभावित समझ यह है कि थोमा ने विस्मय में कहा, “मेरे प्रभु और मेरे परमेश्वर!” पर यूनानी पाठ कहता है कि उसने यह ‘उसे’ कहा; इसलिए ये शब्द यीशु को किया गया सीधा संबोधन हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह ἀποκρίνομαι के सामान्य कथात्मक अर्थ ‘उत्तर देना’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Θωμᾶς
  choice: थोमा
  rationale: यूनानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: εἶπεν αὐτῷ
  choice: उसे ... दिया
  rationale: ‘उत्तर दिया’ की हिन्दी संरचना में αὐτῷ का स्पष्ट अर्थ ‘उसे’ सुरक्षित रहता है; इससे यह भी स्पष्ट है कि कथन उसी व्यक्ति को संबोधित था।
- source_word: Ὁ κύριός μου
  choice: मेरे प्रभु
  rationale: κύριος की श्रद्धापूर्ण और धर्मवैज्ञानिक गंभीरता को ‘प्रभु’ सुरक्षित रखता है; μου को ‘मेरे’ के रूप में बनाए रखा गया है।
- source_word: ὁ θεός μου
  choice: मेरे परमेश्वर
  rationale: θεός के लिए प्रतिष्ठित और सहज हिन्दी ‘परमेश्वर’ चुना गया है, और व्यक्तिगत स्वीकारोक्ति को ‘मेरे’ से सुरक्षित रखा गया है।
- source_word: καὶ
  choice: और
  rationale: दोनों संबोधनों को जोड़ने वाली यूनानी समानांतर संरचना सीधे सुरक्षित रहती है।
theological_decisions:
- issue: क्या थोमा के शब्द यीशु को किया गया सीधा संबोधन हैं या परमेश्वर के प्रति अलग विस्मयादिबोधक उद्गार
  choice: 'यीशु को सीधा संबोधन: “मेरे प्रभु और मेरे परमेश्वर!”'
  alternative: इसे यीशु की पहचान बताए बिना परमेश्वर के प्रति उद्गार मानना
  rationale: यूनानी पाठ में αὐτῷ (‘उसे’) स्पष्ट रूप से बताता है कि थोमा ने ये शब्द उसी से कहे। लेखयुक्त कर्ताकार रूप यहाँ संबोधन का काम करते हैं। अनुवाद इस प्रत्यक्ष अर्थ को बनाए रखता है, न उसे कमजोर करता है और न उससे आगे कोई व्याख्यात्मक विस्तार जोड़ता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘उत्तर दिया’ स्वाभाविक हिन्दी में εἶπεν को भी समाहित करता है, जबकि ‘उसे’ मूल पाठ के प्रत्यक्ष संबोधन को स्पष्ट रखता है।
