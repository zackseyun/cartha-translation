source:
  edition: SBLGNT
  text: καὶ λέγουσιν αὐτῇ ἐκεῖνοι· Γύναι, τί κλαίεις; λέγει αὐτοῖς ὅτι Ἦραν τὸν κύριόν μου, καὶ οὐκ οἶδα ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/013.yaml
  text: And they said to her[a], “Woman, why are you weeping?” She said to them, “They have taken away my Lord[b], and I do not know where they have put him.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “नारी, तुम क्यों रो रही हो?” उसने उनसे कहा, “वे मेरे प्रभु[a] को उठा ले गए हैं, और मैं नहीं जानती कि उन्होंने उन्हें कहाँ रखा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे स्वामी।” यूनानी शब्द क्यूरियोस सम्मानसूचक उपाधि भी हो सकता है; इस अनुवाद में सामान्यतः इसका अनुवाद “प्रभु” किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Γύναι
  choice: हे स्त्री
  rationale: सम्बोधन का सम्मानपूर्ण और सीधा रूप है। हिंदी में “हे स्त्री” यूहन्ना की शैली और मूल की प्रत्यक्षता बनाए रखता है, यद्यपि इसका आधुनिक बोलचाल में प्रयोग कम है।
- source_word: τί κλαίεις
  choice: तुम क्यों रो रही हो?
  rationale: τί का शाब्दिक अर्थ “क्या” है, पर इस यूनानी मुहावरे का स्वाभाविक हिंदी अर्थ कारण पूछना है; वर्तमान काल चल रही क्रिया को व्यक्त करता है।
- source_word: Ἦραν
  choice: उठा ले गए हैं
  rationale: यह कब्र से देह हटा ले जाने के पूर्ण हो चुके कार्य और उसके वर्तमान परिणाम—देह का वहाँ न होना—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τὸν κύριόν μου
  choice: मेरे प्रभु
  rationale: κύριος की श्रद्धापूर्ण तथा संभावित मसीही धर्मवैचारिक गूँज को बनाए रखता है; इसे केवल सामाजिक पद “स्वामी” तक सीमित नहीं करता।
- source_word: οὐκ οἶδα
  choice: मैं नहीं जानती
  rationale: οἶδα रूप की वर्तमान अवस्था को व्यक्त करता है। वक्ता मरियम है, इसलिए हिंदी में स्त्रीलिंग आवश्यक है।
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: उन्होंने उन्हें कहाँ रखा है
  rationale: τίθημι का यहाँ सामान्य अर्थ “रखना” है। आदरसूचक बहुवचन सर्वनाम यीशु के प्रति हिंदी में स्वाभाविक सम्मान व्यक्त करता है, और पूर्ण वर्तमान हाल की क्रिया के बने हुए परिणाम को दिखाता है।
- source_word: ἐκεῖνοι / αὐτοῖς
  choice: उन्होंने / उनसे
  rationale: संदर्भ में पहले उल्लिखित स्वर्गदूत स्पष्ट हैं; हिंदी में प्रदर्शनवाचक “वे लोग” दोहराना अनावश्यक और भारी होता।
theological_decisions:
- issue: मरियम के कथन में κύριος का अनुवाद
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: यूहन्ना के संदर्भ में यह शब्द सम्मानपूर्ण सम्बोधन और मसीही धर्मवैचारिक अर्थ—दोनों की संभावना रखता है। “प्रभु” इस खुलेपन को सुरक्षित रखता है।
- issue: Γύναι के सम्बोधन का स्वर
  choice: हे स्त्री
  alternative: महिला / प्रिय स्त्री
  rationale: मूल सम्बोधन सम्मानपूर्ण है, रूखा नहीं; फिर भी उसमें “प्रिय” जैसी अतिरिक्त भावुकता नहीं है। “हे स्त्री” मूल की सीधाई को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। कथन में स्त्री वक्ता के कारण “जानती” और यीशु के लिए आदरसूचक “उन्हें” रखा गया है। “हे स्त्री” बोलचाल की अपेक्षा अधिक शास्त्रीय है, पर मूल के सम्मानपूर्ण प्रत्यक्ष सम्बोधन तथा यूहन्ना-संबंधी संगति को सुरक्षित रखता है।
