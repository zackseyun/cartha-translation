source:
  edition: SBLGNT
  text: ἔρχεται ⸀Μαριὰμ ἡ Μαγδαληνὴ ⸀ἀγγέλλουσα τοῖς μαθηταῖς ὅτι ⸀Ἑώρακα τὸν κύριον καὶ ταῦτα εἶπεν αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/018.yaml
  text: Mary Magdalene came announcing to the disciples[a], “I have seen the Lord,” and that he had said these things to her.
translation:
  language: hi
  text: मरियम मगदलीनी चेलों के पास आई और उन्हें यह समाचार दिया, “मैंने प्रभु को देखा है, और उन्होंने मुझसे ये बातें कही थीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: आई
  rationale: यह ऐतिहासिक वर्तमान है; हिन्दी कथा-प्रवाह में सामान्य भूतकाल स्वाभाविक है और चेलों की ओर आने की गति को व्यक्त करता है।
- source_word: Μαριὰμ ἡ Μαγδαληνὴ
  choice: मरियम मगदलीनी
  rationale: नाम और उपाधि के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित तथा सहज रूप।
- source_word: ἀγγέλλουσα
  choice: उन्हें यह समाचार दिया
  rationale: कृदन्त मुख्य क्रिया के साथ-साथ संदेश पहुँचाने की क्रिया बताता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है और घोषणा/सूचना देने का भाव बनाए रखता है।
- source_word: τοῖς μαθηταῖς
  choice: चेलों के पास
  rationale: μαθητής के लिए ‘चेला’ सामान्य और सुबोध हिन्दी बाइबलीय शब्द है; सम्बन्धवाचक ‘उसके’ मूल में स्पष्ट नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के आरम्भ के रूप में
  rationale: ὅτι संदेश की विषयवस्तु प्रस्तुत करता है; हिन्दी में उद्धरण-चिह्न प्रत्यक्ष कथन को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: Ἑώρακα
  choice: मैंने ... देखा है
  rationale: यूनानी पूर्णकाल बीती हुई दृष्टि और उसकी वर्तमान प्रासंगिकता दोनों रखता है; हिन्दी का ‘देखा है’ इसे अच्छी तरह व्यक्त करता है।
- source_word: τὸν κύριον
  choice: प्रभु को
  rationale: κύριος की मसीही उपाधि और पुनरुत्थान-संदर्भ का धर्मवैचारिक भार ‘प्रभु’ में सुरक्षित रहता है।
- source_word: καὶ ταῦτα εἶπεν αὐτῇ
  choice: और यह भी कि उन्होंने उससे ये बातें कही थीं
  rationale: मुख्य पाठ में इसे मरियम द्वारा दिए गए समाचार की दूसरी विषयवस्तु माना गया है। ‘कही थीं’ यीशु के पहले कहने और मरियम के बाद में समाचार देने का काल-सम्बन्ध स्पष्ट करता है; ‘ये बातें’ ταῦτα को बनाए रखता है।
theological_decisions:
- issue: पुनरुत्थान के संदर्भ में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ यह यीशु की मान्य उपाधि है; ‘प्रभु’ उसके मसीही महत्व को बिना घटाए सुरक्षित रखता है।
- issue: καὶ ταῦτα εἶπεν αὐτῇ का मरियम के समाचार से सम्बन्ध
  choice: 'इसे मरियम के समाचार का भाग माना गया: ‘और यह भी कि उन्होंने उससे ये बातें कही थीं’'
  alternative: 'इसे कथावाचक की अलग टिप्पणी माना जाए: ‘और उन्होंने उससे ये बातें कहीं’'
  rationale: दूसरा ὅτι स्पष्ट रूप से नहीं है, इसलिए यूनानी वाक्य दोनों विश्लेषण की अनुमति देता है। मुख्य पाठ में समाचार की निरन्तर विषयवस्तु वाला पाठ स्वाभाविक है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘चेला’ और ‘प्रभु’ परिचित बाइबलीय शब्द हैं। सम्मानसूचक एकवचन ‘उन्होंने/उनसे’ यीशु के लिए स्वाभाविक हिन्दी प्रयोग है; मूल की अस्पष्टता को सिद्धान्तगत रूप से हल नहीं किया गया, बल्कि पादटिप्पणी में रखा गया है।
