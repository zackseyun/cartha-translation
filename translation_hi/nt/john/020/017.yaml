  text: λέγει ⸀αὐτῇ Ἰησοῦς· Μή μου ἅπτου, οὔπω γὰρ ἀναβέβηκα πρὸς τὸν ⸀πατέρα· πορεύου δὲ πρὸς τοὺς ἀδελφούς μου καὶ εἰπὲ αὐτοῖς· Ἀναβαίνω πρὸς τὸν πατέρα μου καὶ πατέρα ὑμῶν καὶ θεόν μου καὶ θεὸν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/017.yaml
  text: Jesus said to her[a], “Do not cling to me, for I have not yet ascended to the Father. But go to my brothers and tell them, ‘I am ascending to my Father and your Father[b], and my God and your God.’”
translation:
  language: hi
  text: यीशु ने उससे कहा, “मुझसे लिपटी मत रहो[a], क्योंकि मैं अभी तक ऊपर पिता के पास नहीं गया हूँ। पर मेरे भाइयों[b] के पास जाओ और उनसे कहो, ‘मैं ऊपर अपने पिता और तुम्हारे पिता, और अपने परमेश्वर और तुम्हारे परमेश्वर के पास जा रहा हूँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे मत छूओ” अथवा “मुझे पकड़े मत रहो।” यूनानी अभिव्यक्ति का आशय संभवतः केवल छूने के बजाय लिपटे रहने या लगातार पकड़े रहने से है।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” यूनानी के पुल्लिंग बहुवचन शब्द का अनुवाद है। यहाँ यह यीशु के शिष्यों को सूचित करता है और संभव है कि इसका आशय केवल पुरुषों से अधिक व्यापक प्रतिनिधि समूह हो।
    reason: cultural_note
lexical_decisions:
- source_word: ἅπτου
  choice: लिपटी मत रहो
  rationale: μή के साथ वर्तमानकालीन आज्ञार्थक रूप इस संदर्भ में जारी क्रिया को रोकने का भाव दे सकता है। ‘लिपटी मत रहो’ केवल छूने के बजाय लगातार पकड़े रहने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὔπω γὰρ ἀναβέβηκα
  choice: क्योंकि मैं अब तक ... ऊपर नहीं गया हूँ
  rationale: यह अनुवाद οὔπω और पूर्णकाल के भाव को बनाए रखता है तथा यूहन्ना में पिता के पास जाने के लिए ἀναβαίνω के ऊर्ध्वगमन-संबंधी अर्थ को स्पष्ट करता है।
- source_word: πρὸς τὸν πατέρα
  choice: पिता के पास
  rationale: इस पहले वाक्यांश में यूनानी पाठ में संबंधसूचक μου नहीं है; इसलिए ‘मेरे पिता’ जोड़ने के बजाय ‘पिता’ रखा गया है।
- source_word: πορεύου
  choice: जाओ
  rationale: गति की इस आज्ञा के लिए ‘जाओ’ सहज, वर्तमान और सटीक हिन्दी है।
- source_word: ἀδελφούς
  choice: भाइयों
  rationale: पुल्लिंग बहुवचन यूनानी संज्ञा को औपचारिक रूप से निकट ‘भाइयों’ से व्यक्त किया गया है; संदर्भगत विस्तार पादटिप्पणी में बताया गया है।
- source_word: εἰπὲ αὐτοῖς
  choice: उनसे कहो
  rationale: यह हिन्दी में उक्त आदेश का स्वाभाविक और अर्थ-सटीक रूप है।
- source_word: Ἀναβαίνω
  choice: ऊपर जा रहा हूँ
  rationale: वर्तमानकाल की गतिशीलता और निकट भविष्य में पिता के पास आरोहण—दोनों को यह अभिव्यक्ति सहज हिन्दी में बनाए रखती है।
- source_word: πατέρα μου καὶ πατέρα ὑμῶν
  choice: अपने पिता और तुम्हारे पिता
  rationale: यह यीशु और शिष्यों के संबंधों को साथ-साथ रखते हुए यूनानी की जानबूझकर की गई समानांतर रचना को सुरक्षित रखता है।
- source_word: θεόν μου καὶ θεὸν ὑμῶν
  choice: अपने परमेश्वर और तुम्हारे परमेश्वर
  rationale: सीधा अनुवाद मूल की समानांतर रचना और ‘मेरे परमेश्वर’ की धर्मवैज्ञानिक तीक्ष्णता को बिना नरम किए बनाए रखता है।
theological_decisions:
- issue: Μή μου ἅπτου का अर्थ
  choice: जारी रूप से लिपटे रहने या पकड़े रहने की मनाही
  alternative: मुझे मत छूओ
  rationale: यूनानी क्रिया-रूप और प्रसंग जारी क्रिया रोकने के अर्थ का समर्थन करते हैं। फिर भी अन्य संभव अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
- issue: पहले वाक्यांश में πατέρα का अनुवाद
  choice: पिता
  alternative: मेरे पिता
  rationale: स्रोत पाठ के इस स्थान पर μου नहीं है। बाद की उक्ति स्वयं ‘अपने पिता और तुम्हारे पिता’ का संबंधगत भेद स्पष्ट करती है।
- issue: ‘अपने परमेश्वर और तुम्हारे परमेश्वर’ का मसीह-विज्ञान संबंधी निहितार्थ
  choice: वाक्यांश का सीधा अनुवाद
  alternative: ऐसी व्याख्यात्मक पुनर्रचना जो ‘अपने परमेश्वर’ के कथन को नरम करे
  rationale: पाठ के धर्मवैज्ञानिक तनाव को किसी मतगत स्पष्टीकरण द्वारा घटाए बिना उसी रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘लिपटी मत रहो’ स्त्री संबोधन और जारी क्रिया—दोनों को स्पष्ट करता है। ‘ऊपर जाना’ सरल भाषा में ἀναβαίνω की पुनरावृत्ति बनाए रखता है; भारी पारिभाषिक शब्द ‘स्वर्गारोहण’ नहीं जोड़ा गया, क्योंकि स्रोत वाक्य में ‘स्वर्ग’ स्पष्ट रूप से नहीं है।
