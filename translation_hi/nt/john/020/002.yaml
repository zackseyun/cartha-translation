  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τρέχει οὖν καὶ ἔρχεται πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητὴν ὃν ἐφίλει ὁ Ἰησοῦς, καὶ λέγει αὐτοῖς· Ἦραν τὸν κύριον ἐκ τοῦ μνημείου, καὶ οὐκ οἴδαμεν ποῦ ἔθηκαν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/002.yaml
  text: So she runs and comes to Simon Peter and to the other disciple[a], whom Jesus loved, and says to them, “They have taken the Lord out of the tomb[b], and we do not know where they have laid him.”
translation:
  language: hi
  text: इसलिए वह दौड़कर शमौन पतरस और उस दूसरे शिष्य के पास आती है, जिससे यीशु प्रेम करते थे[a], और उनसे कहती है, “वे प्रभु को कब्र से निकाल ले गए हैं, और हम नहीं जानते कि उन्होंने उन्हें कहाँ रखा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ प्रेम के लिए φιλέω क्रिया है, जो स्नेह पर बल दे सकती है; अनुवाद यह भी हो सकता है: “जिसके प्रति यीशु स्नेह रखते थे।”'
    reason: lexical_alternative
  - marker: b
    text: मरियम “हम नहीं जानते” कहती है; यूनानी में प्रथम पुरुष बहुवचन ही है। इसमें उसके साथ अन्य स्त्रियाँ शामिल थीं या नहीं, यह बात इस पद में स्पष्ट नहीं की गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: τρέχει ... καὶ ἔρχεται
  choice: दौड़कर ... आती है
  rationale: दोनों ऐतिहासिक वर्तमानों की जीवंतता रखते हुए हिन्दी में स्वाभाविक संयुक्त क्रिया-विन्यास अपनाया गया है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पद की घटना के परिणामस्वरूप मरियम की प्रतिक्रिया को दर्शाता है; ‘इसलिए’ इस निष्कर्षात्मक संबंध को स्पष्ट रखता है।
- source_word: πρὸς Σίμωνα Πέτρον καὶ πρὸς τὸν ἄλλον μαθητήν
  choice: शमौन पतरस और उस दूसरे शिष्य के पास
  rationale: πρός की गमन-दिशा को स्वाभाविक हिन्दी ‘के पास’ से और ἄλλον के निश्चित संदर्भ को ‘उस दूसरे’ से व्यक्त किया गया है।
- source_word: ὃν ἐφίλει ὁ Ἰησοῦς
  choice: जिससे यीशु प्रेम रखते थे
  rationale: φιλέω के स्नेहपूर्ण प्रेम को ‘प्रेम रखते थे’ व्यक्त करता है और अपूर्णकालीन क्रिया का जारी संबंध भी सहज हिन्दी में बना रहता है।
- source_word: λέγει αὐτοῖς
  choice: उनसे कहती है
  rationale: ऐतिहासिक वर्तमान को बनाए रखा गया है और αὐτοῖς का स्वाभाविक हिन्दी रूप ‘उनसे’ लिया गया है।
- source_word: Ἦραν τὸν κύριον ἐκ τοῦ μνημείου
  choice: वे प्रभु को कब्र में से उठा ले गए हैं
  rationale: Ἦραν का अर्थ यहाँ हटाकर ले जाना है; वर्तमान परिणति—कब्र का खाली होना—हिन्दी पूर्ण वर्तमान से व्यक्त होती है। μνημεῖον को प्रसंगानुसार ‘कब्र’ कहा गया है।
- source_word: οὐκ οἴδαμεν
  choice: हम नहीं जानते
  rationale: यूनानी का प्रथम पुरुष बहुवचन ज्यों का त्यों रखा गया है; इसे ‘मैं’ करके संभावित ऐतिहासिक तनाव को नहीं सुलझाया गया।
- source_word: ποῦ ἔθηκαν αὐτόν
  choice: उन्होंने उन्हें कहाँ रखा है
  rationale: τίθημι के सामान्य स्थानसूचक अर्थ को ‘रखा’ से व्यक्त किया गया है। यीशु के लिए आदरसूचक बहुवचन आधुनिक मानक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: पुनरुत्थान-वृत्तांत के इस संदर्भ में κύριος यीशु के लिए श्रद्धापूर्ण उपाधि है; ‘प्रभु’ उसका प्रचलित और उपयुक्त हिन्दी रूप है।
- issue: οἴδαμεν का प्रथम पुरुष बहुवचन
  choice: हम नहीं जानते
  alternative: मैं नहीं जानती
  rationale: मूल पाठ स्पष्ट रूप से बहुवचन कहता है। मरियम के साथ अन्य स्त्रियों की उपस्थिति मानकर या न मानकर पाठ को समरस करने के बजाय उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: φιλέω में व्यक्त संबंध
  choice: प्रेम रखते थे
  alternative: स्नेह रखते थे
  rationale: ‘प्रेम’ अर्थ की पूरी गरिमा बनाए रखता है, जबकि पाद-टिप्पणी बताती है कि यहाँ प्रयुक्त क्रिया स्नेह पर विशेष बल दे सकती है; इससे ἀγαπάω और φιλέω के बीच कोई कठोर धर्मवैज्ञानिक भेद आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। यूनानी ऐतिहासिक वर्तमानों को ‘आती है’ और ‘कहती है’ द्वारा सुरक्षित रखा गया है। यीशु के लिए आदरसूचक ‘उन्हें’ प्रयुक्त है।
