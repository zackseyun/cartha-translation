lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: यह कहने के बाद
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया को दर्शाता है; यह रूप आधुनिक हिन्दी में स्वाभाविक ढंग से उसी समय-क्रम को व्यक्त करता है।
- source_word: ἐνεφύσησεν
  choice: उन पर फूँका
  rationale: क्रिया का अर्थ किसी पर या किसी में साँस फूँकना हो सकता है। मुख्य पाठ में ‘उन पर फूँका’ प्रसंग में स्वाभाविक है और दिशा को आवश्यकता से अधिक निश्चित नहीं करता; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: λέγει αὐτοῖς
  choice: उनसे कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथा-शैली में भूतकाल अधिक स्वाभाविक है और अर्थ में कोई हानि नहीं होती।
- source_word: Λάβετε
  choice: ग्रहण करो
  rationale: आज्ञार्थक रूप यहाँ दिए जा रहे आत्मा को पाने या स्वीकार करने का भाव रखता है; ‘ग्रहण करो’ वर्तमान हिन्दी बाइबलीय गद्य में गरिमापूर्ण और स्पष्ट है।
- source_word: πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: यूहन्ना के प्रसंग में यह परमेश्वर के पवित्र आत्मा का निर्देश करता है। यूनानी में उपपद न होने के कारण हिन्दी में अनावश्यक ‘उस’ या ‘एक’ नहीं जोड़ा गया।
theological_decisions:
- issue: πνεῦμα ἅγιον को व्यक्तिगत दिव्य आत्मा या किसी अनिश्चित पवित्र शक्ति के रूप में समझना
  choice: पवित्र आत्मा
  alternative: एक पवित्र आत्मा / पवित्र शक्ति
  rationale: यूहन्ना के सुसमाचार और व्यापक नए नियम के प्रयोग में यह पद यहाँ दिव्य पवित्र आत्मा को सबसे स्वाभाविक रूप से सूचित करता है; हिन्दी में ‘पवित्र आत्मा’ मूल की अनिर्दिष्टता को किसी अतिरिक्त उपपद से बढ़ाए बिना यह पहचान बनाए रखता है।
- issue: ἐνεφύσησεν में सृष्टि और नई सृष्टि की प्रतिध्वनि
  choice: मुख्य पाठ में ‘उन पर फूँका’, संकेत को पादटिप्पणी में स्पष्ट किया
  alternative: उनमें साँस फूँकी
  rationale: उत्पत्ति 2:7 और यहेजकेल 37 की यूनानी भाषा से संभावित प्रतिध्वनि वास्तविक है, किंतु मुख्य पाठ में ‘उनमें’ कहना दिशा और धर्मवैज्ञानिक संकेत को मूल से अधिक निश्चित कर सकता है।
- issue: ऐतिहासिक वर्तमान λέγει का कथात्मक काल
  choice: कहा
  alternative: कहता है
  rationale: यह शैलीगत निर्णय है। हिन्दी कथा में भूतकाल स्वाभाविक है और यूनानी ऐतिहासिक वर्तमान को सिद्धान्तगत महत्त्व दिए बिना आशय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘फूँका’ सामान्य पाठक के लिए स्पष्ट है; ‘ग्रहण करो’ आदेश की गंभीरता और दान को पाने का भाव बनाए रखता है।
