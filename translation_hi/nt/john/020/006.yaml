lexical_decisions:
- source_word: ἔρχεται
  choice: वहाँ पहुँचा
  rationale: यूनानी में ऐतिहासिक वर्तमान है; हिन्दी कथा-प्रवाह में भूतकाल अधिक स्वाभाविक है। संदर्भ के अनुसार क्रिया यहाँ पहुँचने का भाव रखती है।
- source_word: οὖν
  choice: तब
  rationale: यह पिछले पद से कथा की अगली घटना की ओर बढ़ाता है; ‘तब’ आधुनिक हिन्दी में सहज है।
- source_word: καὶ Σίμων Πέτρος
  choice: शमौन पतरस भी
  rationale: καί का योगात्मक भाव स्पष्ट करता है कि दूसरे चेले के बाद शमौन पतरस भी पहुँचा।
- source_word: ἀκολουθῶν αὐτῷ
  choice: जो उसके पीछे आ रहा था
  rationale: वर्तमान कृदन्त मुख्य घटना के साथ चल रही क्रिया बताता है; यह हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: εἰσῆλθεν εἰς τὸ μνημεῖον
  choice: कब्र के भीतर गया
  rationale: εἰς भीतर की ओर गति को स्पष्ट करता है; ‘कब्र’ इस दफ़न-स्थान के लिए सामान्य और सुबोध शब्द है।
- source_word: θεωρεῖ
  choice: वह देखता है
  rationale: यूनानी का ऐतिहासिक वर्तमान दृश्य को सजीव बनाता है; हिन्दी में वर्तमान बनाए रखने से वही आकस्मिक निकटता उभरती है।
- source_word: τὰ ὀθόνια
  choice: मलमल की पट्टियाँ
  rationale: ὀθόνια छोटे सन-वस्त्रों या पट्टियों को सूचित करता है। ‘मलमल की पट्टियाँ’ कपड़े और बहुवचन दोनों को स्पष्ट रखते हुए हिन्दी बाइबिलीय संदर्भ में परिचित है।
- source_word: κείμενα
  choice: पड़ी हैं
  rationale: यह वस्तुओं के वहाँ स्थित या पड़े होने की अवस्था बताता है; हिन्दी में ‘पड़ी हैं’ सहज और दृश्यात्मक है।
