id: JHN.20.8
reference: John 20:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε οὖν εἰσῆλθεν καὶ ὁ ἄλλος μαθητὴς ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον, καὶ εἶδεν καὶ ἐπίστευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/john/020/008.yaml
  text: Then the other disciple[a], who had arrived at the tomb first, also went in[b], and he saw and believed.
translation:
  language: hi
  text: तब वह दूसरा शिष्य भी, जो कब्र पर पहले पहुँचा था, भीतर गया[a]; उसने देखा और विश्वास किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रवेश किया।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ केवल ‘विश्वास किया’ कहता है और यह स्पष्ट नहीं करता कि उसने किस बात पर विश्वास किया। इसका अर्थ यीशु के जी उठने पर विश्वास करना, सामने पड़े प्रमाण को मानना, या पहले दी गई सूचना को सच मानना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε οὖν
  choice: तब
  rationale: यह पदबंध कथा की अगली घटना को हल्के निष्कर्षात्मक भाव के साथ प्रस्तुत करता है। हिन्दी में ‘तब’ क्रम और प्रसंगगत परिणाम—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰσῆλθεν
  choice: भीतर गया
  rationale: क्रिया का अर्थ किसी स्थान में प्रवेश करना है। ‘भीतर गया’ वर्तमान हिन्दी की कथा-शैली में स्वाभाविक है और कब्र के अंदर जाने की ठोस गति को स्पष्ट रखता है।
- source_word: ὁ ἄλλος μαθητής
  choice: वह दूसरा शिष्य
  rationale: यूहन्ना के वृत्तांत में μαθητής के लिए ‘शिष्य’ प्रचलित, सटीक और गरिमापूर्ण शब्द है। संकेतवाचक ‘वह’ पहचाने जा चुके व्यक्ति की ओर स्वाभाविक रूप से लौटता है।
- source_word: ὁ ἐλθὼν πρῶτος εἰς τὸ μνημεῖον
  choice: जो कब्र पर पहले पहुँचा था
  rationale: कृदन्त पदबंध मुख्य क्रिया से पहले घट चुकी क्रिया बताता है। ‘पहुँचा था’ उस पूर्वता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μνημεῖον
  choice: कब्र
  rationale: इस प्रसंग में शब्द यीशु के दफनाने के स्थान को दर्शाता है। ‘कब्र’ सामान्य आधुनिक हिन्दी में स्पष्ट और ठोस है; ‘समाधि’ यहाँ अनचाहे सांस्कृतिक अर्थ जगा सकती है।
- source_word: καὶ εἶδεν
  choice: उसने देखा
  rationale: ‘देखा’ εἶδεν का सीधा और स्वाभाविक रूप है। हिन्दी में कर्ता ‘उसने’ दोहराने से लंबे संबंधवाचक उपवाक्य के बाद आशय स्पष्ट रहता है।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: मूल यूनानी में विश्वास की विषय-वस्तु नहीं बताई गई है। ‘विश्वास किया’ उसी संक्षिप्तता और खुलेपन को बनाए रखता है।
theological_decisions:
- issue: शिष्य ने किस बात पर विश्वास किया
  choice: क्रिया को निरपेक्ष रूप में ‘विश्वास किया’ रखा गया है, बिना यह बताए कि उसने क्या माना।
  alternative: ‘विश्वास किया कि यीशु जी उठे हैं,’ ‘मरियम की बात पर विश्वास किया,’ या ‘विश्वास में आया।’
  rationale: यूनानी पाठ विश्वास की विषय-वस्तु स्पष्ट नहीं करता। विशेषकर अगले पद के प्रकाश में अलग-अलग अर्थ संभव हैं; किसी एक को मुख्य पाठ में जोड़ना मूल की कथात्मक और धर्मवैचारिक खिंचाव को समय से पहले समाप्त कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, स्वाभाविक और गरिमापूर्ण कथा-भाषा अपनाई गई है। ‘शिष्य’ स्थापित बाइबलीय शब्दावली को बनाए रखता है, जबकि ‘कब्र’ सामान्य पाठक के लिए स्पष्ट है। अर्धविराम यूनानी के क्रम—भीतर जाना, फिर देखना और विश्वास करना—को पठनीय ढंग से दिखाता है।
