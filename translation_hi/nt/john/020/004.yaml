lexical_decisions:
- source_word: ἔτρεχον
  choice: दौड़ रहे थे
  rationale: अपूर्ण भूतकाल चल रही पिछली क्रिया को दिखाता है; हिंदी का अपूर्ण पक्ष इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है; प्रसंग में स्पष्ट विरोध नहीं है, इसलिए ‘और’ अनावश्यक विरोधाभास जोड़े बिना कथन को आगे बढ़ाता है।
- source_word: οἱ δύο ὁμοῦ
  choice: वे दोनों साथ-साथ
  rationale: ‘दोनों’ स्पष्ट संख्या और ‘साथ-साथ’ संयुक्त रूप से दौड़ने का भाव सहज आधुनिक हिंदी में बनाए रखते हैं।
- source_word: ὁ ἄλλος μαθητής
  choice: दूसरा शिष्य
  rationale: यह पद तत्काल प्रसंग में पतरस से भिन्न उस अन्य शिष्य को सूचित करता है; ‘शिष्य’ सुसमाचार की प्रचलित और उचित शब्दावली है।
- source_word: προέδραμεν τάχιον τοῦ Πέτρου
  choice: पतरस से तेज़ दौड़कर उससे आगे निकल गया
  rationale: यह अनुवाद तुलना (‘पतरस से तेज़’) और संयुक्त क्रिया के आगे दौड़ निकलने के अर्थ—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἦλθεν πρῶτος εἰς τὸ μνημεῖον
  choice: कब्र पर पहले पहुँचा
  rationale: ‘पहले पहुँचा’ πρῶτος सहित आगमन का स्वाभाविक हिंदी रूप है। अगले पद से स्पष्ट है कि वह अभी भीतर नहीं गया था, इसलिए εἰς का अनुवाद ‘कब्र पर’ किया गया है, ‘कब्र के भीतर’ नहीं।
