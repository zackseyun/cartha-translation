  text: ἄν τινων ἀφῆτε τὰς ἁμαρτίας ⸀ἀφέωνται αὐτοῖς· ἄν τινων κρατῆτε κεκράτηνται.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/023.yaml
  text: If you forgive the sins of any[a], they have been forgiven them; if you retain them[b], they have been retained.
translation:
  language: hi
  text: यदि तुम किसी के पाप क्षमा करो, तो उसके पाप क्षमा किए जा चुके हैं[a]; यदि तुम उन्हें रोके रखो, तो वे रोके रखे जा चुके हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘क्षमा किए जा चुके हैं’ पूर्ण निष्क्रिय रूप है, जो पूरी हो चुकी क्रिया और उसके बने हुए परिणाम पर बल दे सकता है।
    reason: grammatical_note
  - marker: b
    text: “उन्हें” और “वे” पापों की ओर संकेत करते हैं। यूनानी में यहाँ भी पूर्ण निष्क्रिय रूप है। “रोके रखना” का अर्थ पापों को क्षमा न करना है, पर अनुवाद मूल रूपक को बनाए रखता है।
    reason: clarity
lexical_decisions:
- source_word: ἄν τινων
  choice: यदि तुम किन्हीं के
  rationale: ἄν के साथ संभावनार्थक क्रिया अनिश्चित शर्त प्रस्तुत करती है। ‘यदि’ शर्त को और ‘किन्हीं के’ अनिश्चित व्यक्तियों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀφῆτε
  choice: क्षमा करो
  rationale: पापों के प्रसंग में ἀφίημι का सामान्य अर्थ ‘क्षमा करना’ है; ‘छोड़ देना’ यहाँ अत्यधिक व्यापक होता।
- source_word: τὰς ἁμαρτίας
  choice: पाप
  rationale: हिन्दी में इस संबंधवाचक रचना में बिना निश्चित उपपद के ‘पाप’ स्वाभाविक है और यूनानी कर्म का अर्थ स्पष्ट रखता है।
- source_word: ἀφέωνται
  choice: क्षमा किए जा चुके हैं
  rationale: पूर्ण निष्क्रिय रूप संपन्न क्रिया और उसके वर्तमान परिणाम दोनों को व्यक्त करता है। यह अनुवाद निष्क्रियता तथा परिणामात्मक पक्ष को सुरक्षित रखता है।
- source_word: αὐτοῖς
  choice: उनके पाप
  rationale: यूनानी दत्तिवाचक सर्वनाम उन व्यक्तियों की ओर संकेत करता है जिनके पाप विचाराधीन हैं। हिन्दी में दूसरे खंड में ‘उनके पाप’ दोहराने से कर्ता और लाभार्थी का संबंध अस्पष्ट नहीं रहता।
- source_word: κρατῆτε
  choice: उन्हें रोके रखो
  rationale: κρατέω यहाँ क्षमा करने के विपरीत पापों को थामे या रोके रखने का भाव देता है। ‘रोके रखो’ आधुनिक हिन्दी में ‘प्रतिधारित करो’ से अधिक सहज है।
- source_word: κεκράτηνται
  choice: वे रोके रखे जा चुके हैं
  rationale: पूर्ण निष्क्रिय रूप को पहले परिणामात्मक निष्क्रिय खंड के समानांतर रखा गया है; ‘वे’ का संदर्भ पापों से है।
theological_decisions:
- issue: क्या अनुवाद यह बताए कि शिष्यों की कार्रवाई स्वयं क्षमा को प्रभावी करती है, या वह परमेश्वर की पूर्व/दैवी कार्रवाई के अनुरूप है?
  choice: 'दोनों परिणाम-वाक्यों को पूर्ण निष्क्रिय रूप में रखा गया है: ‘क्षमा किए जा चुके हैं’ और ‘रोके रखे जा चुके हैं’।'
  alternative: ‘परमेश्वर ने उन्हें क्षमा कर दिया है/रोक रखा है’ कहना, या केवल ‘क्षमा हो जाते हैं/रहते हैं’ कहना।
  rationale: यूनानी में कर्ता स्पष्ट नहीं किया गया है। निष्क्रिय और परिणामात्मक अभिव्यक्ति दैवी कर्ता की संभावना को खुला रखती है, पर उसे पाठ में जोड़ती नहीं; इससे शिष्यों की कार्रवाई और दैवी क्षमा के संबंध का वास्तविक धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्रतिधारित’ जैसे कृत्रिम धार्मिक शब्द से बचकर ‘रोके रखो’ चुना गया है। समानांतर पूर्ण निष्क्रिय रचना मूल के पक्ष और धर्मवैचारिक अनिर्णय को सुरक्षित रखती है।
