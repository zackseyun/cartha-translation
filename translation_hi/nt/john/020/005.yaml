  text: And stooping to look in[a], he sees the linen cloths lying there, yet he did not enter.
translation:
  language: hi
  text: और झुककर भीतर देखने पर वह वहाँ पड़े हुए सन के कपड़े देखता है, फिर भी वह भीतर नहीं गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρακύψας
  choice: झुककर भीतर देखते हुए
  rationale: यह भूतकालिक कृदन्त कब्र के मुहाने पर शरीर झुकाने और भीतर देखने—दोनों भावों को व्यक्त करता है।
- source_word: βλέπει
  choice: देखता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखकर यूहन्ना के वर्णन की सजीवता सुरक्षित रखी गई है।
- source_word: κείμενα
  choice: वहाँ पड़े
  rationale: केῖμαι से बने कृदन्त का अर्थ कपड़ों का पड़े होना है; ‘वहाँ’ हिन्दी में स्थान-संबंध को स्वाभाविक बनाता है, यद्यपि यूनानी में यह शब्द स्पष्ट रूप से नहीं है।
- source_word: τὰ ὀθόνια
  choice: मलमल के कपड़े
  rationale: ὀθόνια दफ़न से जुड़े महीन सन के कपड़ों को सूचित करता है; प्रसंग दफ़न का उपयोग पहले ही स्पष्ट करता है।
- source_word: οὐ μέντοι
  choice: फिर भी … नहीं
  rationale: यह देखने और भीतर न जाने के बीच हल्का विरोध स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰσῆλθεν
  choice: भीतर नहीं गया
  rationale: अओरिस्ट क्रिया प्रवेश करने की घटना बताती है; ‘भीतर नहीं गया’ आधुनिक हिन्दी में स्वाभाविक और कब्र के प्रसंग में स्पष्ट है।
