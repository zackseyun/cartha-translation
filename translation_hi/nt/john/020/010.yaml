- source_word: πρὸς αὑτούς
  choice: अपने ठहरने की जगह
  rationale: शाब्दिक अर्थ ‘अपने पास/अपने यहाँ’ है, पर प्रसंग में आशय उस स्थान से है जहाँ वे रह या ठहर रहे थे। एकवचन ‘जगह’ यूनानी की अस्पष्टता बनाए रखता है और अलग-अलग घरों की अनावश्यक धारणा नहीं जोड़ता।
- source_word: οἱ μαθηταί
  choice: वे शिष्य
  rationale: ‘शिष्य’ यीशु के अनुयायियों के लिए स्थापित और सहज पद है; ‘वे’ पिछले प्रसंग में उल्लिखित दोनों शिष्यों की ओर संकेत करता है।
