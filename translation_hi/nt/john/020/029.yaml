source:
  edition: SBLGNT
  text: λέγει αὐτῷ ὁ Ἰησοῦς· Ὅτι ἑώρακάς με πεπίστευκας; μακάριοι οἱ μὴ ἰδόντες καὶ πιστεύσαντες.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/029.yaml
  text: Jesus said to him, “Because you have seen me, you have believed? Blessed are those who have not seen and yet have believed.”
translation:
  language: hi
  text: यीशु ने उससे कहा, “क्या तूने इसलिए विश्वास किया कि तूने मुझे देखा है?[a] धन्य हैं वे जिन्होंने नहीं देखा, फिर भी विश्वास किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने इसलिए विश्वास किया कि तूने मुझे देखा है।” यूनानी वाक्य को प्रश्न या कथन—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐτῷ ὁ Ἰησοῦς
  choice: यीशु ने उससे कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-प्रवाह में स्वाभाविक भूतकाल से व्यक्त किया गया है; αὐτῷ को ‘उससे’ के रूप में बनाए रखा गया है।
- source_word: Ὅτι ἑώρακάς με πεπίστευκας;
  choice: क्या तूने इसलिए विश्वास किया कि तूने मुझे देखा है?
  rationale: ὅτι को कारणसूचक माना गया है। प्रश्नवाचक रचना हिन्दी में वाक्य का सम्बन्ध स्पष्ट करती है और यूनानी पूर्णकालों की वर्तमान प्रासंगिकता को ‘देखा है’ तथा प्रसंगानुकूल ‘विश्वास किया’ से व्यक्त करती है।
- source_word: μακάριοι
  choice: धन्य हैं
  rationale: यह आशीष-वचन की प्रचलित, गरिमापूर्ण अभिव्यक्ति है और केवल मनोभावगत ‘खुश’ से अधिक उपयुक्त है।
- source_word: οἱ μὴ ἰδόντες
  choice: वे जिन्होंने नहीं देखा
  rationale: संज्ञात्मक कृदन्त का सहज हिन्दी रूप है; यह उन लोगों को दर्शाता है जिनका विश्वास प्रत्यक्ष देखने पर आधारित नहीं है।
- source_word: καὶ πιστεύσαντες
  choice: फिर भी विश्वास किया
  rationale: καί का मूल अर्थ ‘और’ है, पर न देखने और विश्वास करने के बीच निहित विरोध को आधुनिक हिन्दी में ‘फिर भी’ स्वाभाविक रूप से सामने लाता है।
theological_decisions:
- issue: यीशु के पहले वाक्य का प्रश्नवाचक या कथनात्मक स्वर
  choice: 'प्रश्न: ‘क्या तूने इसलिए विश्वास किया कि तूने मुझे देखा है?’'
  alternative: 'कथन: ‘तूने इसलिए विश्वास किया कि तूने मुझे देखा है।’'
  rationale: SBLGNT की विराम-व्यवस्था और प्रसंग प्रश्नवाचक पाठ का समर्थन करते हैं, पर प्राचीन यूनानी पांडुलिपियों की विराम-अनिश्चितता के कारण कथनात्मक पाठ भी सम्भव है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: न देखने और विश्वास करने का सम्बन्ध
  choice: ‘फिर भी’ द्वारा निहित विरोध व्यक्त किया
  alternative: ‘और विश्वास किया’
  rationale: यूनानी καί स्पष्ट रूप से विरोधसूचक शब्द नहीं है, लेकिन वाक्य में ‘नहीं देखा’ और ‘विश्वास किया’ का विरोध निहित है। ‘फिर भी’ उसे स्वाभाविक हिन्दी में व्यक्त करता है, कोई अलग धर्मसिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यीशु का थोमा से सीधा, एकवचन सम्बोधन बनाए रखने के लिए ‘तू’ प्रयुक्त है; यह प्रसंग में निकटता दर्शाता है, अनादर नहीं।
