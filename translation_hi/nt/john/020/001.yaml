id: JHN.20.1
reference: John 20:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῇ δὲ μιᾷ τῶν σαββάτων Μαρία ἡ Μαγδαληνὴ ἔρχεται πρωῒ σκοτίας ἔτι οὔσης εἰς τὸ μνημεῖον, καὶ βλέπει τὸν λίθον ἠρμένον ἐκ τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/001.yaml
  text: On the first day of the week[a], Mary Magdalene comes to the tomb early, while it was still dark, and sees the stone having been taken away from the tomb.
translation:
  language: hi
  text: सप्ताह के पहले दिन[a], मरियम मगदलीनी बहुत सुबह, जब अभी अँधेरा ही था, कब्र पर आती है और देखती है कि पत्थर कब्र से हटा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “सब्तों में से एक दिन”; यह एक मुहावरा है जिसका अर्थ “सप्ताह का पहला दिन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τῇ δὲ μιᾷ τῶν σαββάτων
  choice: सप्ताह के पहले दिन
  rationale: यह यूनानी मुहावरा शब्दशः ‘सब्तों में से एक/पहले दिन’ जैसा है, पर उस समय के प्रयोग में सप्ताह के पहले दिन को सूचित करता है। δέ को अलग शब्द से व्यक्त न करके हिंदी वाक्य के स्वाभाविक प्रवाह में समाहित किया गया है।
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: मरियम मगदलीनी
  rationale: व्यक्तिनाम और उपाधि का हिंदी में प्रचलित तथा पहचाने जाने योग्य लिप्यंतरण।
- source_word: ἔρχεται
  choice: आती है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखता है और वर्णन में तात्कालिकता देता है।
- source_word: πρωῒ
  choice: बहुत सुबह
  rationale: आरंभिक समय को सहज हिंदी में व्यक्त करता है; ‘भोर में’ नहीं कहा गया, क्योंकि अगला वाक्यांश स्पष्ट करता है कि अभी अँधेरा था।
- source_word: σκοτίας ἔτι οὔσης
  choice: जब अभी अँधेरा ही था
  rationale: यूनानी संबंधवाचक स्वतंत्र रचना को स्वाभाविक कालवाचक हिंदी उपवाक्य में व्यक्त किया गया है; ‘अभी’ और ‘ही’ अँधेरा बने रहने पर बल देते हैं।
- source_word: εἰς τὸ μνημεῖον
  choice: कब्र पर
  rationale: यहाँ μνημεῖον दफनाने की कब्र को सूचित करता है। गमन के साथ हिंदी में ‘कब्र पर आना’ स्वाभाविक है।
- source_word: βλέπει
  choice: देखती है
  rationale: यूनानी ऐतिहासिक वर्तमान को सुरक्षित रखते हुए सीधा और सहज अनुवाद।
- source_word: τὸν λίθον ἠρμένον
  choice: पत्थर … हटा हुआ है
  rationale: पूर्ण निष्क्रिय कृदंत किसी पूरी हो चुकी क्रिया के वर्तमान परिणाम—पत्थर का पहले से हटे होना—को व्यक्त करता है; यह हिंदी रूप कर्ता की पहचान जोड़े बिना उस परिणामी अवस्था को बनाए रखता है।
- source_word: ἐκ τοῦ μνημείου
  choice: कब्र से
  rationale: ἐκ अलग किए जाने या दूर हटाए जाने का भाव देता है। ‘मुहाने से’ नहीं जोड़ा गया, क्योंकि वह संदर्भ से संभव है पर मूल में स्पष्ट नहीं।
theological_decisions:
- issue: पुनरुत्थान-वृत्तांत में कथात्मक काल
  choice: ऐतिहासिक वर्तमान को ‘आती है’ और ‘देखती है’ के रूप में बनाए रखा गया
  alternative: सहज हिंदी कथा के लिए ‘आई’ और ‘देखा’ जैसे सामान्य भूतकाल का प्रयोग
  rationale: मूल यूनानी की कथात्मक तात्कालिकता को हिंदी में समझने योग्य ढंग से सुरक्षित रखा गया है, बिना कोई अतिरिक्त धर्मवैचारिक अर्थ जोड़े।
- issue: पत्थर हटाने वाले कर्ता की पहचान
  choice: ‘हटा हुआ है’ कहकर कर्ता को अव्यक्त रखा गया
  alternative: ‘हटा दिया गया है’ या किसी कर्ता को स्पष्ट करना
  rationale: मूल में निष्क्रिय रूप है और इस पद में पत्थर हटाने वाले की पहचान नहीं बताई गई; इसलिए उस अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘कब्र’, ‘बहुत सुबह’ और ‘हटा हुआ’ सामान्य पाठकों के लिए स्पष्ट हैं; ऐतिहासिक वर्तमान मूल की जीवंतता बनाए रखता है।
