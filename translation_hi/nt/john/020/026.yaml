revisions:
- from: आठ दिन बाद उसके चेले फिर घर के भीतर थे, और थोमा उनके साथ था। द्वार बंद होने पर भी यीशु आकर उनके बीच खड़े हो गए और बोले, “तुम्हें शांति मिले।”
  to: आठ दिन बाद उसके चेले फिर भीतर थे, और थोमा उनके साथ था। द्वार बंद थे, फिर भी यीशु आए और उनके बीच में खड़े होकर बोले, “तुम्हें शांति मिले।”
  rationale: The revision removes the unsupported addition ‘घर’ and renders the independent historical present ἔρχεται with an independent Hindi verb. ‘फिर भी’ preserves the concessive force conveyed by the closed-door circumstance without asserting that यीशु द्वारों के आर-पार आए थे.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T23:55:19Z'
review_pass:
  verdict: revise
  source_fidelity: ‘घर के भीतर’ adds ‘house/home,’ which is not stated by ἔσω (‘inside/within’). The remaining clauses convey the disciples’ presence, Thomas’s presence, the closed doors as a circumstance, Jesus’ appearance in the middle, and the greeting accurately. The revision removes the added location and more directly represents the historical present without requiring an unnatural Hindi tense mixture.
  naturalness: The revised Hindi is idiomatic, clear, and suitably dignified for modern standard Hindi. ‘भीतर’ is natural without supplying an unspecified building, and ‘बीच में खड़े होकर बोले’ flows smoothly.
  terminology: ‘चेले,’ ‘यीशु,’ ‘थोमा,’ and ‘शांति’ are appropriate and consistent biblical Hindi terminology. ‘तुम्हें शांति मिले’ appropriately communicates the greeting Εἰρήνη ὑμῖν without importing a doctrinal explanation of how Jesus entered.
  issues:
  - severity: medium
    issue: ‘घर के भीतर’ specifies a house/home.
    rationale: The Greek says only that the disciples were ‘inside’ (ἔσω); no noun for house or home occurs. Adding ‘घर’ narrows an intentionally unspecified location.
  - severity: low
    issue: ‘आकर’ subordinates Jesus’ coming to the following action.
    rationale: ἔρχεται is an independent historical-present verb. Rendering it as ‘यीशु आए’ more directly retains its narrative force while remaining natural Hindi.
  revised_text: आठ दिन बाद उसके चेले फिर भीतर थे, और थोमा उनके साथ था। द्वार बंद थे, फिर भी यीशु आए और उनके बीच में खड़े होकर बोले, “तुम्हें शांति मिले।”
  revised_footnotes: []
