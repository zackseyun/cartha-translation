source:
  edition: SBLGNT
  text: Καὶ μεθ’ ἡμέρας ὀκτὼ πάλιν ἦσαν ἔσω οἱ μαθηταὶ αὐτοῦ καὶ Θωμᾶς μετ’ αὐτῶν. ἔρχεται ὁ Ἰησοῦς τῶν θυρῶν κεκλεισμένων, καὶ ἔστη εἰς τὸ μέσον καὶ εἶπεν· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/026.yaml
  text: And after eight days, his disciples were inside again, and Thomas was with them. Jesus comes, though the doors had been shut, and stood in the midst and said, “Peace to you.”
translation:
  language: hi
  text: आठ दिन बाद उसके चेले फिर भीतर थे, और थोमा उनके साथ था। द्वार बंद थे, फिर भी यीशु आए और उनके बीच में खड़े होकर बोले, “तुम्हें शांति मिले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας ὀκτώ
  choice: आठ दिन बाद
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप; प्राचीन समावेशी गणना की सम्भावना को अनावश्यक व्याख्या से नहीं बाँधता।
- source_word: ἔσω
  choice: घर के भीतर
  rationale: शाब्दिक अर्थ ‘भीतर’ है; प्रसंग में शिष्यों का किसी बंद स्थान के अंदर होना अभिप्रेत है। ‘घर’ हिन्दी में वाक्य को स्वाभाविक बनाता है, यद्यपि यूनानी में भवन का संज्ञा-पद स्पष्ट नहीं है।
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: द्वार बंद होने पर भी
  rationale: सम्बन्धकारक निरपेक्ष रचना परिस्थिति बताती है। ‘पर भी’ प्रसंग का विरोधाभासी भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना प्रवेश की रीति समझाए।
- source_word: ἔρχεται
  choice: आकर
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा-प्रवाह में स्वाभाविक रूप दिया गया है; इसके बाद के भूतकालीन क्रियापदों से संगति रहती है।
- source_word: εἰς τὸ μέσον
  choice: उनके बीच
  rationale: अर्थ ‘बीच में’ है; व्यक्तियों के समूह के लिए ‘उनके बीच’ सहज और स्पष्ट है।
- source_word: Εἰρήνη ὑμῖν
  choice: तुम्हें शांति मिले
  rationale: यह सामी अभिवादन का अर्थपूर्ण और वर्तमान हिन्दी में गरिमापूर्ण रूप है।
theological_decisions:
- issue: बंद द्वारों के रहते यीशु के आने की रीति
  choice: द्वार बंद होने पर भी यीशु आकर
  alternative: यीशु बंद द्वारों से होकर आए
  rationale: मूल पाठ केवल बंद द्वारों की परिस्थिति बताता है; वह स्पष्ट रूप से यह नहीं कहता कि यीशु द्वारों के आर-पार हुए। अनुवाद उस अस्पष्टता को बनाए रखता है।
- issue: ἔρχεται का ऐतिहासिक वर्तमान
  choice: आकर ... खड़े हो गए और बोले
  alternative: यीशु आते हैं ... खड़े हुए और कहा
  rationale: यूनानी में जीवंत ऐतिहासिक वर्तमान है, पर हिन्दी में कालों का ऐसा मिश्रण अस्वाभाविक लगेगा। कथा की जीवंतता खोए बिना स्वाभाविक भूतकालीन प्रवाह अपनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। ‘चेले’ सामान्य पाठक के लिए परिचित बाइबलीय शब्द है। किसी सांप्रदायिक व्याख्या या प्रवेश की अलौकिक रीति को पाठ में नहीं जोड़ा गया है।
