review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the explanatory γάρ, the unfinished temporal sense of οὐδέπω, Scripture in the singular, and the active resurrection expression ἀναστῆναι. However, ‘उसका’ can grammatically be read as referring to ‘पवित्रशास्त्र,’ whereas αὐτόν refers to Jesus. The referent should be made explicit in Hindi.
  naturalness: The sentence is generally fluent and suitably dignified. ‘पवित्रशास्त्र की यह बात’ naturally introduces the content clause, but the possessive construction ‘उसका ... जी उठना’ creates avoidable ambiguity.
  terminology: ‘पवित्रशास्त्र,’ ‘मरे हुओं में से,’ and ‘जी उठना’ are appropriate modern Hindi biblical terms. ‘जी उठना था’ preserves the active Greek verb and the necessity expressed by δεῖ without introducing a passive agency.
  issues:
  - severity: medium
    issue: Ambiguous antecedent of ‘उसका’
    rationale: In ‘पवित्रशास्त्र की यह बात ... कि उसका ... जी उठना,’ ‘उसका’ may formally point back to ‘पवित्रशास्त्र.’ The Greek pronoun αὐτόν refers to Jesus. Repeating ‘यीशु’ is a safe Hindi clarification from the immediate narrative context and prevents an unintended reading.
  revised_text: क्योंकि वे अब तक पवित्रशास्त्र की यह बात नहीं समझे थे कि यीशु को मरे हुओं में से जी उठना था।
  revised_footnotes: []
