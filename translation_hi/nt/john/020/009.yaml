- from: क्योंकि वे अब तक पवित्रशास्त्र की यह बात नहीं समझे थे कि उसका मरे हुओं में से जी उठना आवश्यक है।
  to: क्योंकि वे अब तक पवित्रशास्त्र की यह बात नहीं समझे थे कि यीशु को मरे हुओं में से जी उठना था।
  rationale: ‘यीशु को’ replaces the ambiguous ‘उसका’ while retaining the content of αὐτόν in idiomatic Hindi. ‘जी उठना था’ keeps the active resurrection wording and communicates the necessity of δεῖ within the past narrative setting. No footnote is required, since the active expression is clear in the main text.
  reviewer_model: gpt-5.6-terra
