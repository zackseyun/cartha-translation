base_translation:
  language: en
  yaml_path: translation/nt/john/020/009.yaml
  text: For they did not yet understand the Scripture[a], that he had to rise from the dead.
translation:
  language: hi
  text: क्योंकि वे अब तक पवित्रशास्त्र की यह बात नहीं समझे थे कि यीशु को मरे हुओं में से जी उठना था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδέπω
  choice: अब तक ... नहीं
  rationale: यह स्वाभाविक हिन्दी में उस समय तक समझ न आने का कालगत भाव व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाला संबंध स्पष्ट करता है।
- source_word: ᾔδεισαν
  choice: समझे थे
  rationale: यहाँ बात पवित्रशास्त्र के अस्तित्व को जानने की नहीं, उसके आशय को समझने की है।
- source_word: τὴν γραφὴν
  choice: पवित्रशास्त्र की यह बात
  rationale: एकवचन γραφή को बनाए रखते हुए ὅτι से आने वाली विषय-वस्तु के साथ स्वाभाविक हिन्दी संबंध बनाता है; इससे किसी एक उद्धरण या समग्र शास्त्रीय साक्ष्य के बीच मूल की संभावित अस्पष्टता बनी रहती है।
- source_word: ὅτι
  choice: कि
  rationale: जिस बात को वे नहीं समझे थे, उसकी विषय-वस्तु आरंभ करता है।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह दैवी आवश्यकता का दृढ़ भाव रखता है; अप्रत्यक्ष कथन में वर्तमान रूप मूल यूनानी के वर्तमान δεῖ को भी निकटता से दर्शाता है।
- source_word: αὐτὸν
  choice: उसका
  rationale: हिन्दी की संज्ञात्मक क्रिया-रचना ‘उसका ... जी उठना’ में infinitive clause के कर्ता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: बहुवचन νεκρῶν का अर्थ स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀναστῆναι
  choice: जी उठना
  rationale: सक्रिय infinitive को सक्रिय हिन्दी अभिव्यक्ति में रखता है और अनावश्यक रूप से कर्मवाच्य या बाहरी कर्ता नहीं जोड़ता।
theological_decisions:
- issue: पुनरुत्थान की अभिव्यक्ति और कर्तृत्व
  choice: उसका मरे हुओं में से जी उठना
  alternative: उसे मरे हुओं में से जिलाया जाना
  rationale: मूल में ἀναστῆναι सक्रिय infinitive है। इसलिए मुख्य पाठ में सक्रिय अभिव्यक्ति रखी गई है; कर्मवाच्य विकल्प अन्य प्रसंगों में धर्मवैज्ञानिक रूप से संभव है, पर यहाँ उसे थोपने से मूल की विशिष्ट अभिव्यक्ति बदल जाएगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘पवित्रशास्त्र की यह बात’ एकवचन γραφή और उसके बाद आने वाले content clause दोनों को स्वाभाविक हिन्दी में जोड़ता है। किसी पादटिप्पणी की आवश्यकता नहीं रखी गई, क्योंकि सक्रिय यूनानी क्रिया मुख्य पाठ में सीधे और स्पष्ट रूप से सुरक्षित है।
