  text: ⸀ταῦτα εἰποῦσα ἐστράφη εἰς τὰ ὀπίσω, καὶ θεωρεῖ τὸν Ἰησοῦν ἑστῶτα, καὶ οὐκ ᾔδει ὅτι Ἰησοῦς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/014.yaml
  text: After saying these things[a], she turned around and saw Jesus standing there, and she did not know that it was Jesus.
translation:
  language: hi
  text: ये बातें कहकर वह पीछे मुड़ी और उसने यीशु को खड़े देखा, और वह नहीं जानती थी कि वे यीशु हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पहचान नहीं पाई कि वे यीशु हैं।” यूनानी में शाब्दिक अर्थ है, “वह नहीं जानती थी कि वे यीशु हैं,” जो उनकी पहचान न जान पाने को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα εἰποῦσα
  choice: ये बातें कहकर
  rationale: बहुवचन संकेतवाचक ταῦτα को ‘ये बातें’ से सुरक्षित रखा गया है; अओरिस्ट कृदंत εἰποῦσα को स्वाभाविक हिन्दी में पूर्वकालिक क्रिया ‘कहकर’ के रूप में व्यक्त किया गया है।
- source_word: ἐστράφη εἰς τὰ ὀπίσω
  choice: वह पीछे मुड़ी
  rationale: यूनानी मुहावरा अपने पीछे की ओर मुड़ने को दर्शाता है; ‘पीछे मुड़ी’ आधुनिक हिन्दी में सहज और दृश्य के अनुरूप है।
- source_word: θεωρεῖ
  choice: उसने ... देखा
  rationale: कथात्मक ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है; यहाँ क्रिया वास्तविक दृष्टि-बोध बताती है।
- source_word: ἑστῶτα
  choice: वहाँ खड़े
  rationale: पूर्णकालिक कृदंत यीशु की खड़ी हुई अवस्था का वर्णन करता है; ‘वहाँ’ हिन्दी में दृश्य को स्वाभाविक बनाता है, बिना अनावश्यक दूरी निर्धारित किए।
- source_word: οὐκ ᾔδει
  choice: वह नहीं जानती थी
  rationale: οἶδα के मूल ‘जानना’ अर्थ को मुख्य पाठ में रखा गया है; ‘पहचानना’ प्रसंगानुकूल व्याख्यात्मक विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: ὅτι Ἰησοῦς ἐστιν
  choice: कि वे यीशु हैं
  rationale: पहचान बताने वाले यूनानी उपवाक्य को सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है। यीशु के लिए आदरसूचक बहुवचन ‘वे/हैं’ आधुनिक मानक हिन्दी के अनुरूप है।
theological_decisions:
- issue: जी उठे यीशु की पहचान
  choice: वह नहीं जानती थी कि वे यीशु हैं
  alternative: वह पहचान नहीं पाई कि वे यीशु हैं
  rationale: पद मरियम की पहचान-संबंधी अनभिज्ञता बताता है, पर उसका कारण नहीं बताता। मुख्य पाठ यूनानी के ‘जानना’ को बनाए रखता है और अधिक व्याख्यात्मक ‘पहचानना’ को विकल्प के रूप में देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथा का प्रवाह स्वाभाविक बनाने के लिए ऐतिहासिक वर्तमान को हिन्दी भूतकाल में व्यक्त किया गया है और यीशु के लिए प्रचलित आदरसूचक बहुवचन का प्रयोग हुआ है।
