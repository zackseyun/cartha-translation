id: JHN.20.19
reference: John 20:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὔσης οὖν ὀψίας τῇ ἡμέρᾳ ἐκείνῃ τῇ ⸀μιᾷ σαββάτων, καὶ τῶν θυρῶν κεκλεισμένων ὅπου ἦσαν οἱ ⸀μαθηταὶ διὰ τὸν φόβον τῶν Ἰουδαίων, ἦλθεν ὁ Ἰησοῦς καὶ ἔστη εἰς τὸ μέσον, καὶ λέγει αὐτοῖς· Εἰρήνη ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/019.yaml
  text: So when it was evening on that day[a], the first day of the week, and the doors had been locked where the disciples were because of fear of the Jews, Jesus came and stood in the midst of them and said to them[b], “Peace to you.”
translation:
  language: hi
  text: उसी दिन, अर्थात सप्ताह के पहले दिन, शाम को, चेले जहाँ थे वहाँ के दरवाज़े यहूदियों[a] के डर से बंद किए हुए थे। तब यीशु आए, उनके बीच खड़े हुए और उनसे कहा, “तुम्हें शांति मिले।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग के अनुसार इसका अर्थ “यहूदी अगुवों” या “यहूदिया के निवासियों” से भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी में शाब्दिक रूप से: “तुम्हें शांति।” इसे “तुम्हारे साथ शांति हो” भी कहा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὔσης ... ὀψίας
  choice: शाम को
  rationale: यह संबंधकारक निरपेक्ष रचना समय की पृष्ठभूमि बताती है; ‘शाम को’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οὖν
  choice: तब
  rationale: यह पिछले वृत्तांत से हल्का कथात्मक संबंध दिखाता है; ‘तब’ अनावश्यक कठोर निष्कर्ष का भाव दिए बिना उस संबंध को बनाए रखता है।
- source_word: τῇ ἡμέρᾳ ἐκείνῃ τῇ μιᾷ σαββάτων
  choice: उसी दिन, यानी सप्ताह के पहले दिन
  rationale: ‘उसी दिन’ पिछले प्रसंग से स्पष्ट संबंध रखता है और ‘यानी’ बताता है कि वह सप्ताह का पहला दिन था।
- source_word: τῶν θυρῶν κεκλεισμένων
  choice: दरवाज़ों पर ... ताले लगे थे
  rationale: पूर्ण कृदंत पहले की गई सुरक्षा-कार्रवाई से बनी हुई अवस्था व्यक्त करता है। भय के प्रसंग में यह हिन्दी अभिव्यक्ति केवल ‘बंद थे’ की अपेक्षा उस सुरक्षा-भाव को अधिक स्पष्ट करती है।
- source_word: ὅπου ἦσαν οἱ μαθηταὶ
  choice: जिस जगह चेले थे वहाँ के
  rationale: मूल पाठ केवल उनका स्थान बताता है; ‘ठहरे’ या ‘इकट्ठे हुए’ जैसी अतिरिक्त धारणाएँ नहीं जोड़ी गईं।
- source_word: μαθηταὶ
  choice: चेले
  rationale: μαθητής के शिक्षार्थी और अनुयायी-संबंध को व्यक्त करने वाला प्रचलित, सहज बाइबिलीय हिन्दी शब्द।
- source_word: διὰ τὸν φόβον
  choice: के डर से
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है; ‘के डर से’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: τῶν Ἰουδαίων
  choice: यहूदियों
  rationale: मुख्य पाठ यूनानी शब्द के सामान्य अर्थ को बनाए रखता है और उसके संभावित संदर्भगत अर्थों को पाद-टिप्पणी में देता है, ताकि अर्थ को अनुचित रूप से संकीर्ण न किया जाए।
- source_word: ἦλθεν ὁ Ἰησοῦς
  choice: यीशु आए
  rationale: साधारण कथात्मक क्रिया को आधुनिक हिन्दी में यीशु के लिए स्वाभाविक आदरसूचक रूप में रखा गया है।
- source_word: ἔστη εἰς τὸ μέσον
  choice: उनके बीच खड़े हुए
  rationale: मूल की स्थानगत छवि को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: λέγει αὐτοῖς
  choice: उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली के स्वाभाविक भूतकाल में व्यक्त किया गया है।
- source_word: Εἰρήνη ὑμῖν
  choice: तुम्हें शांति मिले
  rationale: शाब्दिक ‘तुम्हें शांति’ में निहित अभिवादन और मंगलकामना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूहन्ना में τῶν Ἰουδαίων का संदर्भ
  choice: मुख्य पाठ में ‘यहूदियों’, साथ में संदर्भगत विकल्पों की पाद-टिप्पणी
  alternative: ‘यहूदी अगुवों’ या ‘यहूदिया के लोगों’
  rationale: यूनानी पाठ स्वयं यहाँ ‘अगुवों’ को स्पष्ट नहीं करता। फिर भी यूहन्ना में यह शब्द प्रसंग के अनुसार विशेषकर विरोधी यहूदी अधिकारियों या यहूदिया के लोगों की ओर संकेत कर सकता है। मुख्य पाठ की व्यापकता और पाद-टिप्पणी की स्पष्टता दोनों बनाए रखी गई हैं।
- issue: यीशु के अभिवादन Εἰρήνη ὑμῖν का रूप
  choice: ‘तुम्हें शांति मिले’
  alternative: शाब्दिक ‘तुम्हें शांति’ या ‘तुम्हारे साथ शांति हो’
  rationale: मूल वाक्य में क्रिया नहीं है और वह अभिवादन तथा मंगलकामना दोनों का भाव रखता है। हिन्दी में ‘मिले’ जोड़ना उसी भाव को सहज बनाता है, बिना उसे किसी विशिष्ट धर्मशास्त्रीय सूत्र में बदलने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। वाक्य को पठनीय रखने के लिए समय और स्थान की यूनानी कृदंत-रचनाओं को स्वाभाविक हिन्दी उपवाक्यों में ढाला गया है। यीशु के लिए प्रचलित आदरसूचक बहुवचन क्रियारूप प्रयुक्त हैं।
