base_translation:
  language: en
  yaml_path: translation/nt/john/020/030.yaml
  text: Jesus did many other signs in the presence of the disciples[a], which are not written in this book.
translation:
  language: hi
  text: यीशु ने चेलों के सामने और भी बहुत-से चिन्ह[a] किए, जो इस पुस्तक में नहीं लिखे गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चमत्कार’; यूनानी में ‘चिन्ह’—ऐसे कार्य जो अपने से परे इस बात की ओर संकेत करते हैं कि यीशु कौन हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολλὰ μὲν οὖν καὶ ἄλλα
  choice: इसलिए ... और भी बहुत-से
  rationale: οὖν का निष्कर्षात्मक/संयोजक बल ‘इसलिए’ से व्यक्त किया गया है; πολλά और ἄλλα को स्वाभाविक हिन्दी में ‘और भी बहुत-से’ कहा गया है। μέν अगले पद के δέ-सदृश विरोध की भूमिका बनाता है, जिसे हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: σημεῖα
  choice: चिन्ह
  rationale: यूहन्ना में यह शब्द चमत्कारी कार्यों के साथ-साथ उनके संकेतार्थ को भी उभारता है—वे यीशु की पहचान और कार्य की ओर संकेत करते हैं।
- source_word: ἐποίησεν
  choice: किए
  rationale: ποιέω के सामान्य अर्थ को सहज हिन्दी में व्यक्त करता है; ‘दिखाए’ या ‘कर दिखाए’ स्रोत में निहित प्रदर्शन का अनावश्यक भाव जोड़ते।
- source_word: ἐνώπιον τῶν μαθητῶν
  choice: चेलों के सामने
  rationale: यह बताता है कि चेले इन चिन्हों के प्रत्यक्ष साक्षी थे। यूनानी में स्वत्ववाचक सर्वनाम नहीं है, इसलिए ‘अपने चेलों’ के बजाय ‘चेलों’ रखा गया है।
- source_word: ἃ οὐκ ἔστιν γεγραμμένα
  choice: जो ... नहीं लिखे गए हैं
  rationale: परिफ्रास्टिक पूर्ण निष्क्रिय रचना के वर्तमान परिणाम और निष्क्रिय भाव, दोनों को बनाए रखता है।
- source_word: ἐν τῷ βιβλίῳ τούτῳ
  choice: इस पुस्तक में
  rationale: βιβλίον के लिए ‘पुस्तक’ आधुनिक पाठक के लिए स्वाभाविक है और यहाँ लिखित सुसमाचार-ग्रंथ को ठीक रूप से दर्शाता है।
theological_decisions:
- issue: यूहन्ना में σημεῖα का अर्थ
  choice: ‘चिन्ह’
  alternative: ‘चमत्कार’
  rationale: ‘चिन्ह’ चमत्कारी स्वरूप को नकारे बिना इस बात को सुरक्षित रखता है कि ये कार्य अपने से परे यीशु की पहचान और मिशन की ओर संकेत करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘चेला’ व्यापक बाइबलीय प्रयोग के अनुरूप है। पद 31 के साथ निष्कर्षात्मक संबंध दिखाने के लिए आरम्भ में ‘इसलिए’ रखा गया है, जो οὖν का अनुवाद है, न कि कालवाचक ‘अब’।
