lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकल पड़े
  rationale: यह क्रिया किसी स्थान से प्रस्थान करने को व्यक्त करती है। ‘निकल पड़े’ आधुनिक हिन्दी में स्वाभाविक है और आगे की यात्रा आरम्भ होने का भाव बनाए रखती है। यद्यपि यूनानी क्रिया एकवचन में है, संयुक्त कर्ता के साथ हिन्दी में बहुवचन आवश्यक है।
- source_word: οὖν
  choice: इस पर
  rationale: यह पिछले पद में मिली सूचना के फलस्वरूप हुई कार्रवाई को जोड़ता है। ‘इस पर’ कथात्मक प्रवाह और परिणाम—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ Πέτρος
  choice: पतरस
  rationale: यह नाम हिन्दी बाइबल परम्परा में प्रचलित और सामान्य पाठकों के लिए परिचित रूप में दिया गया है।
- source_word: ὁ ἄλλος μαθητής
  choice: वह दूसरा चेला
  rationale: ‘वह दूसरा’ पहले से संदर्भित विशिष्ट चेले की ओर संकेत करता है। सुसमाचार की भाषा में μαθητής के लिए ‘चेला’ सहज और व्यापक रूप से समझा जाने वाला शब्द है।
- source_word: ἤρχοντο
  choice: जा रहे थे
  rationale: अपूर्ण भूतकाल की यह क्रिया उस समय जारी गति को दिखाती है। ‘जा रहे थे’ उसके प्रगतिशील पक्ष को स्पष्ट रखता है; केवल ‘गए’ भी सम्भव है, पर उसमें यह पक्ष कम स्पष्ट होगा।
- source_word: εἰς τὸ μνημεῖον
  choice: कब्र की ओर
  rationale: यहाँ μνημεῖον यीशु की दफ़न-कब्र है। ‘कब्र की ओर’ गन्तव्य की दिशा बताता है और कब्र के भीतर प्रवेश का अर्थ नहीं जोड़ता, जो बाद के पदों में होता है।
