  text: καὶ θεωρεῖ δύο ἀγγέλους ἐν λευκοῖς καθεζομένους, ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν, ὅπου ἔκειτο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/012.yaml
  text: and she sees two angels in white sitting[a], one at the head and one at the feet[b], where the body of Jesus had been lying.
translation:
  language: hi
  text: और वह सफेद वस्त्र पहने दो स्वर्गदूतों को बैठे हुए देखती है[a]—एक सिरहाने और दूसरा पैताने, जहाँ यीशु का शरीर रखा हुआ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सफेद में।” इसका अर्थ “सफेद वस्त्र पहने” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पड़ा हुआ था।” यूनानी क्रिया उस स्थान पर शरीर के पड़े या रखे होने की अवस्था बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θεωρεῖ
  choice: देखती है
  rationale: यूनानी का ऐतिहासिक वर्तमान दृश्य को सजीव बनाता है; हिन्दी में वर्तमान काल स्वाभाविक है। प्रसंग से कर्ता मरियम है, इसलिए स्त्रीलिंग क्रिया रखी गई है।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: खाली कब्र और सफेद वस्त्रों के प्रसंग में यह शब्द स्पष्टतः स्वर्गीय दूतों को सूचित करता है, केवल मानवीय संदेशवाहकों को नहीं।
- source_word: ἐν λευκοῖς
  choice: सफेद वस्त्र पहने
  rationale: यूनानी का शाब्दिक अर्थ ‘सफेद में’ है और वस्त्र निहित हैं। आधुनिक हिन्दी में ‘सफेद वस्त्र पहने’ स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: καθεζομένους
  choice: बैठे हुए
  rationale: कृदन्त दोनों स्वर्गदूतों की मुद्रा बताता है; ‘बैठे हुए’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἕνα πρὸς τῇ κεφαλῇ καὶ ἕνα πρὸς τοῖς ποσίν
  choice: एक सिरहाने और दूसरा पैताने
  rationale: πρός के साथ सम्प्रदान यहाँ निकट स्थिति व्यक्त करता है। ‘सिरहाने’ और ‘पैताने’ उस स्थान के दोनों सिरों को सहज हिन्दी में बताते हैं जहाँ शरीर रखा था।
- source_word: ὅπου
  choice: जहाँ
  rationale: यह यूनानी सम्बन्धवाचक क्रियाविशेषण का संक्षिप्त और सीधा अनुवाद है।
- source_word: ἔκειτο
  choice: रखा हुआ था
  rationale: κεῖμαι यहाँ शरीर के पड़े या रखे होने की पूर्व अवस्था बताता है। ‘रखा हुआ था’ दफनाए गए शरीर के प्रसंग में स्वाभाविक है, जबकि ‘पड़ा था’ अधिक शाब्दिक विकल्प है।
- source_word: σῶμα τοῦ Ἰησοῦ
  choice: यीशु का शरीर
  rationale: ‘शरीर’ मानक और आदरपूर्ण पद है; सम्बन्धकारक रचना हिन्दी में स्वाभाविक रूप से ‘यीशु का’ की गई है।
theological_decisions:
- issue: ἀγγέλους का स्वरूप
  choice: स्वर्गदूत
  alternative: दूत
  rationale: यद्यपि ἄγγελος का सामान्य अर्थ ‘दूत’ हो सकता है, खाली कब्र और सफेद वस्त्रों का निकट प्रसंग स्वर्गीय प्राणियों की ओर संकेत करता है।
- issue: ἔκειτο का कालगत और अवस्थागत बल
  choice: रखा हुआ था
  alternative: पड़ा था
  rationale: अपूर्ण भूतकाल उस पूर्ववर्ती निरंतर अवस्था को व्यक्त करता है जिसमें यीशु का शरीर उस स्थान पर था। हिन्दी का ‘था’ प्रसंग में यह पूर्व अवस्था पर्याप्त रूप से प्रकट करता है, बिना पुनरुत्थान के बाद भी शरीर वहाँ होने का अर्थ दिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘सिरहाने’ और ‘पैताने’ स्थानगत सम्बन्ध को सामान्य पाठकों के लिए संक्षेप और स्पष्टता से व्यक्त करते हैं।
