id: JHN.20.20
reference: John 20:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τοῦτο εἰπὼν ⸀ἔδειξεν τὰς χεῖρας καὶ τὴν πλευρὰν ⸀αὐτοῖς. ἐχάρησαν οὖν οἱ μαθηταὶ ἰδόντες τὸν κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/john/020/020.yaml
  text: And after saying this, he showed them his hands and his side. Then the disciples rejoiced when they saw the Lord.
translation:
  language: hi
  text: यह कहने के बाद उसने उन्हें अपने हाथ और अपना पार्श्व दिखाए। तब चेले प्रभु को देखकर आनन्दित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο εἰπὼν
  choice: यह कहने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है; यह हिन्दी में स्वाभाविक रूप से समय-क्रम स्पष्ट करता है।
- source_word: ἔδειξεν
  choice: दिखाई
  rationale: δείκνυμι का सीधा अर्थ देखने के लिए प्रस्तुत करना या दिखाना है। संयुक्त कर्म के निकट स्त्रीलिंग ‘बगल’ के अनुसार ‘दिखाई’ स्वाभाविक है।
- source_word: τὰς χεῖρας καὶ τὴν πλευράν
  choice: अपने हाथ और अपनी बगल
  rationale: यूनानी में निश्चित उपपद है, पर हिन्दी में शरीर के अपने अंगों के लिए निजवाचक ‘अपने/अपनी’ स्वाभाविक है। πλευρά के लिए ‘बगल’ शरीर के पार्श्व भाग को सहजता से व्यक्त करती है और घाव का उल्लेख जोड़े बिना प्रसंग बनाए रखती है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान कारक को हिन्दी क्रिया ‘दिखाना’ के अप्रत्यक्ष कर्म के रूप में व्यक्त किया गया है।
- source_word: ἐχάρησαν
  choice: आनन्दित हुए
  rationale: χαίρω यहाँ प्रसन्न या आनन्दित होने को बताता है; ‘आनन्दित हुए’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है तथा क्रिया की प्रबलता बनाए रखता है।
- source_word: οὖν
  choice: तब
  rationale: यह कथानक में परिणाम और अगली प्रतिक्रिया को जोड़ता है; ‘तब’ हिन्दी में सहज क्रम सूचित करता है।
- source_word: οἱ μαθηταί
  choice: चेले
  rationale: ‘चेले’ μαθητής के लिए सामान्य, सुबोध और स्थापित हिन्दी बाइबलीय शब्द है।
- source_word: ἰδόντες
  choice: देखकर
  rationale: अओरिस्ट कृदन्त उनके आनन्द का अवसर/कारण बताता है; हिन्दी का पूर्वकालिक कृदन्त अर्थ को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: पुनरुत्थान-दर्शन के इस प्रसंग में κύριος केवल सम्मानसूचक सम्बोधन नहीं, बल्कि मसीही उपाधि का भार भी रखता है; ‘प्रभु’ दोनों पहलुओं को सुरक्षित रखता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ शिष्य पुनर्जीवित यीशु को पहचानते हैं और κύριος यूहन्ना में मसीही उपाधि के रूप में भी कार्य करता है। ‘प्रभु’ उस धार्मिक-मसीही भार को बनाए रखता है, जबकि ‘स्वामी’ केवल मानवीय सम्बन्ध का आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य-क्रम मूल यूनानी के घटनाक्रम और परिणाम को बनाए रखता है; कोई व्याख्यात्मक विस्तार नहीं जोड़ा गया है।
