id: 2JN.1.9
reference: 2 John 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πᾶς ὁ ⸀προάγων καὶ μὴ μένων ἐν τῇ διδαχῇ τοῦ Χριστοῦ θεὸν οὐκ ἔχει· ὁ μένων ἐν τῇ ⸀διδαχῇ, οὗτος καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/009.yaml
  text: Everyone who goes on ahead and does not remain in the teaching of Messiah does not have God[a]. The one who remains in the teaching[b], this one has both the Father and the Son.
translation:
  language: hi
  text: हर वह व्यक्ति जो आगे निकल जाता है और मसीह की शिक्षा में बना नहीं रहता, उसके पास परमेश्वर नहीं है।[a] जो उस शिक्षा में बना रहता है,[b] उसी के पास पिता और पुत्र दोनों हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आगे निकल जाता है” का अर्थ “बहुत आगे चला जाता है” भी हो सकता है; कुछ पांडुलिपियों में इसके बदले “उल्लंघन करता है” पाठ है।
    reason: textual_variant
  - marker: b
    text: “मसीह की शिक्षा” का अर्थ मसीह द्वारा दी गई शिक्षा या मसीह के विषय में शिक्षा—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶς ὁ προάγων
  choice: हर वह व्यक्ति जो आगे निकल जाता है
  rationale: πᾶς के साथ संज्ञात्मक कृदंत का सामान्य अर्थ ‘हर वह व्यक्ति जो...’ है। ‘आगे निकल जाता है’ आगे बढ़ने के रूपक को बनाए रखता है और इसे मुख्य पाठ में ‘सीमा लाँघता है’ के रूप में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: μὴ μένων
  choice: बना नहीं रहता
  rationale: यह यूहन्ना-साहित्य में μένω के ‘बने रहने’ के प्रमुख भाव को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν τῇ διδαχῇ τοῦ Χριστοῦ
  choice: मसीह की शिक्षा में
  rationale: ‘शिक्षा’ आधुनिक और सुबोध है; ‘मसीह की’ यूनानी संबंधकारक की संक्षिप्तता बनाए रखता है, जिसका आशय मसीह द्वारा दी गई शिक्षा अथवा मसीह के विषय में शिक्षा—दोनों हो सकता है।
- source_word: θεὸν οὐκ ἔχει
  choice: उसके पास परमेश्वर नहीं है
  rationale: यूनानी की कठोर और सीधी अभिव्यक्ति को सुरक्षित रखा गया है; इसे ‘परमेश्वर के साथ संगति नहीं’ कहकर व्याख्यात्मक विस्तार नहीं दिया गया।
- source_word: ὁ μένων ἐν τῇ διδαχῇ
  choice: जो उस शिक्षा में बना रहता है
  rationale: पहले खंड के साथ समानांतरता बनाए रखी गई है। ‘उस’ से पहले उल्लिखित शिक्षा का स्वाभाविक संकेत मिलता है।
- source_word: οὗτος
  choice: उसी
  rationale: οὗτος के बलाघात को स्वाभाविक हिन्दी में ‘उसी’ द्वारा व्यक्त किया गया है।
- source_word: καὶ τὸν πατέρα καὶ τὸν υἱὸν ἔχει
  choice: उसी के पास पिता और पुत्र दोनों हैं
  rationale: καὶ...καὶ का अर्थ ‘दोनों...और’ से व्यक्त होता है और ‘पिता’ तथा ‘पुत्र’ की स्पष्ट व्यक्तिगत उपाधियाँ बनी रहती हैं।
theological_decisions:
- issue: प्रोआगोन (προάγων) का अर्थ
  choice: आगे निकल जाता है
  alternative: बहुत आगे चला जाता है; सीमा लाँघता है; कुछ पांडुलिपियों के अनुसार अपराध करता है
  rationale: SBLGNT में προάγων है, παραβαίνων नहीं। चुना हुआ अनुवाद सच्ची शिक्षा से आगे निकलने के रूपक को सुरक्षित रखता है, जबकि संभावित नकारात्मक अर्थ और पाठांतर को पादटिप्पणी में रखा गया है।
- issue: ‘मसीह की शिक्षा’ में संबंधकारक का अर्थ
  choice: मसीह की शिक्षा
  alternative: मसीह द्वारा दी गई शिक्षा; मसीह के विषय में शिक्षा
  rationale: यूनानी τοῦ Χριστοῦ दोनों अर्थ-संबंधों की अनुमति देता है। मुख्य पाठ जानबूझकर इस वास्तविक अस्पष्टता को खुला रखता है।
- issue: Χριστός की उपाधि
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; आधुनिक मानक हिन्दी में ‘मसीह’ स्वाभाविक और व्यापक रूप से बोधगम्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘बना रहता है’ द्वारा यूहन्ना-साहित्य की प्रमुख शब्दावली और दोनों खंडों की समानांतरता सुरक्षित रखी गई है। पादटिप्पणी-चिह्न संबंधित कथनों के ठीक बाद रखे गए हैं।
