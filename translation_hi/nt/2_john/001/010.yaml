  text: εἴ τις ἔρχεται πρὸς ὑμᾶς καὶ ταύτην τὴν διδαχὴν οὐ φέρει, μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν καὶ χαίρειν αὐτῷ μὴ λέγετε·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/010.yaml
  text: If anyone comes to you and does not bring this teaching, do not receive him into your house, and do not say a greeting to him.
translation:
  language: hi
  text: यदि कोई तुम्हारे पास आता है और यह शिक्षा नहीं लाता,[b] तो उसे अपने घर में स्वीकार न करो और उसका अभिवादन न करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “उसे ‘नमस्कार’ न कहो।”
    reason: lexical_alternative
  - marker: b
    text: संदर्भ में यह चेतावनी ऐसे व्यक्ति के विषय में है जो “यह शिक्षा” लेकर नहीं आता—संभवतः कोई भ्रमणशील शिक्षक, जिसका संदेश आसपास के पदों में बताए गए प्रेरितों के अंगीकार से हट गया है।
    reason: cross_reference
lexical_decisions:
- source_word: εἴ τις
  choice: यदि कोई
  rationale: यह अनिश्चित शर्त एक सामान्य सम्भावना व्यक्त करती है; ‘यदि कोई’ स्वाभाविक हिन्दी है।
- source_word: ἔρχεται πρὸς ὑμᾶς
  choice: तुम्हारे पास आता है
  rationale: यह सम्बोधित लोगों की ओर आने का सीधा अर्थ रखता है और कलीसियाई संदर्भ को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ता।
- source_word: ταύτην τὴν διδαχήν
  choice: यह शिक्षा
  rationale: ‘शिक्षा’ διδαχή के अर्थ को स्पष्ट, आधुनिक और गैर-तकनीकी ढंग से व्यक्त करती है; संकेतवाचक ‘यह’ भी सुरक्षित रहता है।
- source_word: οὐ φέρει
  choice: नहीं लाता
  rationale: φέρω का मूल रूपक सुरक्षित रहता है और हिन्दी में किसी शिक्षा को ‘लाना’ स्वाभाविक है।
- source_word: μὴ λαμβάνετε αὐτὸν εἰς οἰκίαν
  choice: उसे अपने घर में स्वीकार न करो
  rationale: λαμβάνω के ग्रहण/स्वागत के भाव और εἰς οἰκίαν के आतिथ्य-संदर्भ को साथ रखते हुए वाक्य स्वाभाविक बनाया गया है।
- source_word: χαίρειν αὐτῷ μὴ λέγετε
  choice: न उसे नमस्कार कहो
  rationale: यूनानी का शाब्दिक ढाँचा ‘उसे अभिवादन न कहो’ है; ‘नमस्कार कहो’ आधुनिक हिन्दी में समझने योग्य रहते हुए λέγετε और अभिवादन-विषयक χαίρειν दोनों को दर्शाता है।
theological_decisions:
- issue: निषेध का दायरा
  choice: मुख्य पाठ घर में स्वीकार करने और नमस्कार कहने के ठोस निषेध को ज्यों का त्यों रखता है।
  alternative: इसे हर प्रकार के सामाजिक सम्पर्क पर पूर्ण रोक मानना, या केवल कलीसिया में आधिकारिक शिक्षक के रूप में ठहराने तक सीमित करना।
  rationale: आसपास का संदर्भ भटकी हुई शिक्षा लाने वाले व्यक्ति, सम्भवतः भ्रमणशील शिक्षक, से जुड़ा है; फिर भी यूनानी पाठ इन दो व्याख्यात्मक सीमाओं में से किसी को स्पष्ट रूप से नहीं चुनता।
- issue: αὐτόν का लिंग और वचन
  choice: उसे
  alternative: उनको
  rationale: ‘उसे’ यूनानी के एकवचन को सुरक्षित रखता है। हिन्दी में यह कर्मरूप अपने आप पुरुष या स्त्री लिंग निर्धारित नहीं करता, इसलिए स्रोत से अधिक लिंग-विशिष्टता नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बहुवचन सम्बोधन के लिए ‘तुम्हारे/करो’ चुना गया है। ‘नमस्कार कहो’ यूनानी अभिव्यक्ति की संरचना बचाता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
