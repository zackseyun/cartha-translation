  text: διὰ τὴν ἀλήθειαν τὴν μένουσαν ἐν ἡμῖν, καὶ μεθ’ ἡμῶν ἔσται εἰς τὸν αἰῶνα·
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/002.yaml
  text: because of the truth that remains in us and will be with us forever[a].
translation:
  language: hi
  text: उस सत्य के कारण, जो हममें बना रहता है[a] और सदा हमारे साथ रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो हममें वास करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ
  choice: के कारण
  rationale: यहाँ कर्मकारक के साथ διά प्रेम के आधार या कारण को व्यक्त करता है; ‘के कारण’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀλήθειαν
  choice: सत्य
  rationale: शब्द को बिना व्याख्यात्मक विस्तार के सरल रूप में रखा गया है, ताकि यूहन्नाई प्रयोग की व्यापक धार्मिक अर्थ-छाया बनी रहे।
- source_word: τὴν μένουσαν
  choice: जो ... बना रहता है
  rationale: वर्तमान कृदन्त निरन्तर बने रहने का भाव देता है। ‘बना रहता है’ वर्तमान हिन्दी में सहज है और स्थायित्व का भाव सुरक्षित रखता है।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: ἐν का सीधा अर्थ ‘हममें’ है; यह सत्य की भीतरी उपस्थिति को व्यक्त करता है, जबकि ‘हमारे बीच’ भी सम्भव अर्थ है।
- source_word: καὶ μεθ’ ἡμῶν ἔσται
  choice: और ... हमारे साथ रहेगा
  rationale: μετά सम्बन्धसूचक रूप के साथ ‘साथ’ और ἔσται भविष्यकाल ‘रहेगा/होगा’ व्यक्त करता है। हिन्दी में ‘हमारे साथ रहेगा’ स्वाभाविक है और निरन्तरता को अनावश्यक रूप से अलग से नहीं जोड़ता।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह मुहावरा अनन्त अवधि को व्यक्त करता है; ‘सदा’ संक्षिप्त, dignified और सहज हिन्दी रूप है।
theological_decisions:
- issue: ‘सत्य’ का यूहन्नाई धार्मिक आशय
  choice: केवल ‘सत्य’ रखा गया है; इसे सुसमाचार, मसीह या सच्ची शिक्षा के रूप में स्पष्ट नहीं किया गया।
  alternative: ‘सुसमाचार का सत्य’ या ‘सच्ची शिक्षा’
  rationale: यूनानी संज्ञा स्वयं अर्थ को इतना सीमित नहीं करती। सरल ‘सत्य’ मूल की व्यापकता और धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बना रहता है’ को मुख्य पाठ में और अधिक धार्मिक-शैली वाले ‘वास करता है’ को वैकल्पिक पाद-टिप्पणी में रखा गया है।
