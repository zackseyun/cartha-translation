id: 2JN.1.5
reference: 2 John 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ νῦν ἐρωτῶ σε, κυρία, οὐχ ὡς ἐντολὴν ⸂καινὴν γράφων σοι⸃ ἀλλὰ ἣν εἴχομεν ἀπ’ ἀρχῆς, ἵνα ἀγαπῶμεν ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/005.yaml
  text: 'And now I ask you[a], lady, not as though I were writing to you a new commandment, but the one we have had from the beginning: that we love one another.'
translation:
  language: hi
  text: 'और अब, हे महिला[a], मैं आपसे निवेदन करता हूँ: ऐसा नहीं कि मैं आपको कोई नई आज्ञा लिख रहा हूँ, बल्कि वही आज्ञा जो हमारे पास आरम्भ से है—कि हम एक-दूसरे से प्रेम करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: सम्भव है कि ‘महिला’ से रूपक के रूप में कलीसिया अभिप्रेत हो; कुछ लोग ‘कुरिया’ को स्त्री का नाम भी मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρωτῶ
  choice: मैं आपसे विनती करता हूँ
  rationale: यहाँ ἐρωτάω निवेदन करने के अर्थ में है। ‘विनती करता हूँ’ पत्र की नम्र आग्रहपूर्ण ध्वनि को स्वाभाविक हिन्दी में व्यक्त करता है, पर इसे कठोर आदेश नहीं बनाता।
- source_word: κυρία
  choice: हे महिला
  rationale: κυρία का सम्बोधन रूप शाब्दिक रूप से ‘महिला/स्वामिनी’ है। ‘हे महिला’ व्यक्ति, कलीसिया के रूपक या सम्भावित नाम—इन व्याख्याओं में से किसी एक को मुख्य पाठ में निश्चित नहीं करता।
- source_word: ἐντολὴν καινὴν
  choice: कोई नई आज्ञा
  rationale: ‘नई आज्ञा’ यूहन्ना-साहित्य की परिचित शब्दावली और उसके अन्तर्पाठीय संकेत को बनाए रखती है। नकारात्मक वाक्य में ‘कोई’ हिन्दी को स्वाभाविक बनाता है।
- source_word: γράφων σοι
  choice: मैं आपको ... लिख रहा हूँ
  rationale: वर्तमान कृदन्त को ὡς के साथ हिन्दी की स्वाभाविक तुलनात्मक रचना ‘मानो मैं ... लिख रहा हूँ’ में व्यक्त किया गया है।
- source_word: ἣν εἴχομεν
  choice: वही जो ... हमारे पास है
  rationale: यूनानी अपूर्णकाल का आशय आरम्भ से चली आ रही और वर्तमान तक बनी हुई प्राप्ति है; हिन्दी में ‘हमारे पास है’ इस निरन्तरता को सहज रूप से व्यक्त करता है।
- source_word: ἀπ’ ἀρχῆς
  choice: आरम्भ से
  rationale: यह यूहन्ना-साहित्य का मानक पदबंध है और साहित्यिक-धर्मवैचारिक निरन्तरता बनाए रखता है।
- source_word: ἵνα ἀγαπῶμεν ἀλλήλους
  choice: कि हम एक-दूसरे से प्रेम रखें
  rationale: ἵνα सहित विधिलिङ्ग यहाँ आज्ञा की विषयवस्तु और आग्रहपूर्ण भाव दोनों प्रकट करता है। ‘प्रेम रखें’ आधुनिक हिन्दी में स्थायी पारस्परिक प्रेम का स्वाभाविक कथन है।
theological_decisions:
- issue: κυρία का सन्दर्भ
  choice: मुख्य पाठ में ‘महिला’ रखकर सन्दर्भ को अनिश्चित रहने देना
  alternative: इसे स्थानीय कलीसिया का रूपक मानना, या Κυρία को ‘कुरिया’ नाम मानना
  rationale: यूनानी शब्द स्वयं ‘महिला/स्वामिनी’ कहता है और सन्दर्भ व्यक्ति, रूपकात्मक कलीसिया या सम्भावित नाम हो सकता है। अनुवाद किसी एक व्याख्या को पाठ पर आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और पत्रात्मक रखी गई है। ‘आपसे/आपको’ आदरसूचक एकवचन सम्बोधन है। वाक्य की ‘ऐसा नहीं, बल्कि’ रचना यूनानी οὐχ ὡς ... ἀλλά के विरोध को स्पष्ट रखती है।
