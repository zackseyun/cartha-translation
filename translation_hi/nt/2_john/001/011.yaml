  yaml_path: translation/nt/2_john/001/011.yaml
  text: For the one who says to him[a], “Greetings,” shares in his evil works.
translation:
  language: hi
  text: क्योंकि जो उसे “नमस्कार” कहता है,[a] वह उसके बुरे कामों में सहभागी होता है।
  philosophy: optimal-equivalence
  footnotes:
