lexical_decisions:
- source_word: ὁ λέγων
  choice: जो ... कहता है
  rationale: लेख के साथ वर्तमान कृदन्त यहाँ सामान्य रूप से किसी भी ऐसे व्यक्ति को दर्शाता है जो यह कार्य करता है। हिंदी में ‘जो ... कहता है’ इस सामान्य और सतत भाव को स्वाभाविक ढंग से रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले पद में दिए निषेध का कारण बताता है; ‘क्योंकि’ हिंदी में इसके व्याख्यात्मक संबंध को स्पष्ट और संक्षिप्त रखता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: सर्वनाम पिछले पद में वर्णित व्यक्ति की ओर संकेत करता है। ‘उससे ... कहना’ हिंदी में संबोधन की स्वाभाविक रचना है और संदर्भ को अनावश्यक रूप से नहीं खोलता।
- source_word: χαίρειν
  choice: “नमस्कार”
  rationale: λέγων के साथ यह क्रिया का साधारण अर्थ ‘आनन्दित होना’ नहीं, बल्कि प्रचलित अभिवादन-सूत्र है। ‘नमस्कार’ आधुनिक हिंदी में एक स्वाभाविक और गरिमापूर्ण अभिवादन है; संदर्भगत स्वागत या अनुमोदन की संभावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: κοινωνεῖ
  choice: सहभागी होता है
  rationale: दत्तिव के साथ यह किसी कार्य में भागीदारी या हिस्सेदारी को व्यक्त करता है। ‘सहभागी होता है’ नैतिक संलिप्तता का भाव रखता है, पर किसी संकीर्ण सांप्रदायिक अर्थ को नहीं जोड़ता।
- source_word: τοῖς ἔργοις αὐτοῦ τοῖς πονηροῖς
  choice: उसके बुरे कामों में
  rationale: यह पदबंध उस व्यक्ति के उन कामों को बताता है जिन्हें πονηρός नैतिक रूप से बुरा ठहराता है। ‘बुरे काम’ सामान्य आधुनिक हिंदी में स्पष्ट है और ἔργα के निकट रहता है।
theological_decisions:
- issue: क्या अभिवादन केवल सामान्य शिष्टाचार है या स्वागत/समर्थन के द्वारा बुरे कामों में सहभागिता
  choice: मुख्य पाठ अभिवादन की मूल शब्दावली और उससे जुड़ी सहभागिता दोनों को यथावत रखता है; पादटिप्पणी बताती है कि प्रसंग में इसका आशय स्वागत या अनुमोदन तक पहुँच सकता है।
  alternative: इसे हर परिस्थिति में किसी भी प्रकार के विनम्र अभिवादन पर पूर्ण प्रतिबंध मानना।
  rationale: χαίρειν अपने आप में प्रचलित अभिवादन-सूत्र है, जबकि κοινωνεῖ और पद 10 का निकट प्रसंग झूठे शिक्षक को ग्रहण करने और उसके काम को समर्थन देने से जुड़ी संलिप्तता दर्शाते हैं। अनुवाद इस तनाव को व्याख्यात्मक विस्तार द्वारा समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘नमस्कार’ उद्धरण-चिह्नों में रखकर अभिवादन-सूत्र का रूप दिखाया गया है। ‘सहभागी होता है’ नैतिक संलिप्तता को स्पष्ट करता है, बिना अतिरिक्त धर्मसिद्धान्त जोड़े।
