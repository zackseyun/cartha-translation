  text: Ὁ πρεσβύτερος ἐκλεκτῇ κυρίᾳ καὶ τοῖς τέκνοις αὐτῆς, οὓς ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ, καὶ οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες οἱ ἐγνωκότες τὴν ἀλήθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/001.yaml
  text: The elder[a], to the chosen lady and her children, whom I love in truth—and not I alone[b], but also all who have come to know the truth—
translation:
  language: hi
  text: प्राचीन[a] की ओर से चुनी हुई महिला[b] और उसके बच्चों को, जिनसे मैं सत्य में[c] प्रेम करता हूँ—और केवल मैं ही नहीं, बल्कि वे सभी भी जो सत्य को जान चुके हैं—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अगुआ”। यहाँ यह शब्द आयु, प्रतिष्ठा, या मान्य कलीसियाई नेतृत्व की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “चुनी हुई स्त्री।” कुछ लोग “महिला” को स्थानीय कलीसिया के रूपक के रूप में समझते हैं, और कुछ इसे “कुरिया” नाम मानते हैं।
    reason: alternative_reading
  - marker: c
    text: या “सच्चे मन से”; यह वाक्यांश यूहन्नाई अर्थ में “सत्य में” होने का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: प्राचीन
  rationale: पत्र के आरंभ में यह लेखक की स्व-पहचान है और आयु के साथ मान्य नेतृत्व या पद का अर्थ भी रख सकती है। ‘प्राचीन’ इस बाइबिलीय उपाधि को संक्षेप में रखते हुए अस्पष्टता बचाता है।
- source_word: ἐκλεκτῇ κυρίᾳ
  choice: चुनी हुई महिला
  rationale: ‘चुनी हुई’ ἐκλεκτῇ का स्वाभाविक अर्थ देता है और ‘महिला’ κυρίᾳ को सम्मानपूर्वक व्यक्त करता है। यह किसी वास्तविक स्त्री और कलीसिया के मानवीकरण—दोनों संभावनाओं को खुला रखता है।
- source_word: τοῖς τέκνοις αὐτῆς
  choice: उसकी संतानों
  rationale: τέκνα लिंग-निरपेक्ष रूप से बच्चों या संतानों को दर्शाता है। ‘संतानों’ वास्तविक परिवार तथा मंडली के सदस्यों, दोनों अर्थों में संभव है।
- source_word: ἀγαπῶ
  choice: प्रेम करता हूँ
  rationale: यह ἀγαπάω का सीधा और प्रचलित हिन्दी समतुल्य है; मूल में कोई तीव्रतासूचक शब्द नहीं है।
- source_word: ἐν ἀληθείᾳ
  choice: सत्य में
  rationale: यह वाक्यांश प्रेम की सच्चाई और यूहन्नाई अर्थ में सत्य के क्षेत्र—दोनों संकेतों को बनाए रखता है।
- source_word: οὐκ ἐγὼ μόνος ἀλλὰ καὶ πάντες
  choice: और केवल मैं ही नहीं, बल्कि वे सभी भी
  rationale: यह यूनानी विरोध और लेखक पर दिए गए बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οἱ ἐγνωκότες τὴν ἀλήθειαν
  choice: जिन्होंने सत्य को जान लिया है
  rationale: पूर्णकालिक कृदंत पहले सत्य को जानने और उससे उत्पन्न वर्तमान अवस्था का संकेत देता है; ‘जान लिया है’ उस पक्ष को सामान्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐκλεκτῇ κυρίᾳ की पहचान
  choice: मुख्य पाठ में ‘चुनी हुई महिला’ रखा गया है।
  alternative: यह किसी विशिष्ट मसीही स्त्री, किसी स्थानीय कलीसिया के मानवीकरण, अथवा ‘कुरिया’ नामक स्त्री को सूचित कर सकता है।
  rationale: यूनानी पाठ इन संभावनाओं का निर्णायक समाधान नहीं करता। सामान्य संज्ञा का अर्थ मुख्य पाठ में और अन्य संभावनाएँ पादटिप्पणी में रखने से वास्तविक अस्पष्टता बनी रहती है।
- issue: ἐν ἀληθείᾳ का अर्थ
  choice: ‘सत्य में’
  alternative: ‘सच्चे मन से’ या ‘सचमुच’
  rationale: ‘सत्य में’ प्रेम की निष्कपटता तथा यूहन्नाई साहित्य में ‘सत्य’ के गहरे धार्मिक अर्थ, दोनों को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पत्रात्मक शैली रखी गई है। पद अगले वाक्यांश की ओर बढ़ते हुए यूनानी की तरह डैश पर समाप्त होता है। ‘महिला’ सम्मानसूचक है, जबकि ‘संतान’ वास्तविक और रूपकात्मक दोनों पाठों के लिए उपयुक्त है।
