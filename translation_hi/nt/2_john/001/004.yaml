source:
  edition: SBLGNT
  text: Ἐχάρην λίαν ὅτι εὕρηκα ἐκ τῶν τέκνων σου περιπατοῦντας ἐν ἀληθείᾳ, καθὼς ἐντολὴν ἐλάβομεν παρὰ τοῦ πατρός.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/004.yaml
  text: I rejoiced greatly that I have found some of your children walking in the truth[b][a], just as we received a commandment from the Father.
translation:
  language: hi
  text: मुझे बहुत आनन्द हुआ कि मैंने तुम्हारे बच्चों में से कुछ को[a] सत्य के मार्ग पर चलते हुए[b] पाया है, जैसा कि हमें पिता से आज्ञा मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारे बच्चों में से”; यूनानी अभिव्यक्ति किसी अंश की ओर संकेत करती है, आवश्यक रूप से सभी की ओर नहीं।
    reason: lexical_alternative
  - marker: b
    text: या, “सत्य के अनुसार जीवन जीते हुए।” यहाँ “चलना” जीवन और आचरण का रूपक है; बात केवल सच्चे मन की नहीं, बल्कि सत्य के अनुरूप जीवन की भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐχάρην λίαν
  choice: मुझे बहुत आनन्द हुआ
  rationale: क्रिया के भूतकालीन, पूर्ण प्रत्युत्तर और λίαν की तीव्रता को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εὕρηκα
  choice: मैंने ... पाया है
  rationale: यूनानी पूर्णकाल खोज के वर्तमान परिणाम को सूचित कर सकता है; हिन्दी का ‘पाया है’ इस पक्ष को सुरक्षित रखता है।
- source_word: ἐκ τῶν τέκνων σου
  choice: तुम्हारे बच्चों में से कुछ को
  rationale: 'ἐκ के अंशवाचक भाव को स्पष्ट करता है: कथन आवश्यक रूप से सभी बच्चों के विषय में नहीं है। ‘बच्चे’ τέκνα की लिंग-समावेशी व्यापकता बनाए रखता है।'
- source_word: περιπατοῦντας
  choice: चलते हुए
  rationale: यूहन्नाई नैतिक रूपक ‘चलना’ को बनाए रखता है, केवल ‘जीवन जीना’ कहकर उसकी चित्रात्मकता नहीं मिटाता।
- source_word: ἐν ἀληθείᾳ
  choice: सत्य में
  rationale: वाक्यांश को केवल व्यक्तिगत ईमानदारी तक सीमित न करके सत्य के क्षेत्र अथवा उसके अनुरूप जीवन—दोनों से जुड़ी सम्भावना बनाए रखता है।
- source_word: καθὼς
  choice: जैसा कि
  rationale: उनके आचरण और पिता से मिली आज्ञा के बीच अनुरूपता को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ἐντολὴν ἐλάβομεν
  choice: हमें ... आज्ञा मिली थी
  rationale: ἐντολή के नैतिक और वाचा-संबंधी भार के लिए ‘आज्ञा’ उपयुक्त है; बहुवचन ‘हमें’ और भूतकाल को सुरक्षित रखा गया है।
- source_word: παρὰ τοῦ πατρός
  choice: पिता से
  rationale: मूल पाठ के संक्षिप्त पद ‘पिता’ को बिना ‘परमेश्वर’ जोड़कर प्रस्तुत करता है।
theological_decisions:
- issue: ‘पिता’ का अभिप्राय
  choice: केवल ‘पिता’
  alternative: ‘परमेश्वर पिता’
  rationale: यूनानी पाठ केवल ‘पिता’ कहता है। यूहन्नाई सन्दर्भ में अभिप्राय स्पष्ट है, पर अनुवाद में अनुपस्थित शब्द जोड़ना उचित नहीं।
- issue: ‘तुम्हारे बच्चों’ का विस्तार
  choice: ‘तुम्हारे बच्चों में से कुछ’
  alternative: ‘तुम्हारे बच्चे’
  rationale: अंशवाचक ἐκ बताता है कि लेखक ने उनमें से कुछ को पाया; पाठ यह दावा नहीं करता कि सभी ऐसे थे।
- issue: ‘सत्य में चलना’ का अर्थ
  choice: रूपक और सम्भावित धार्मिक-नैतिक अर्थ को खुला रखना
  alternative: केवल ‘ईमानदारी से रहना’ या केवल ‘प्रकट सिद्धान्त को मानना’
  rationale: वाक्यांश में जीवन-आचरण और सत्य के अनुरूपता दोनों का भाव हो सकता है; किसी एक संकुचित व्याख्या को पाठ पर नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए एकवचन ‘तुम्हारे’ मूल के σου के अनुरूप रखा गया है। भाषा सरल और गरिमापूर्ण है, तथा यूहन्नाई ‘चलने’ के रूपक और ‘पिता’ की संक्षिप्त उपाधि को सुरक्षित रखती है।
