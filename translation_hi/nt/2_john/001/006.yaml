language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ αὕτη ἐστὶν ἡ ἀγάπη, ἵνα περιπατῶμεν κατὰ τὰς ἐντολὰς αὐτοῦ· αὕτη ⸂ἡ ἐντολή ἐστιν⸃, καθὼς ἠκούσατε ἀπ’ ἀρχῆς, ἵνα ἐν αὐτῇ περιπατῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/006.yaml
  text: 'And this is love: that we walk according to his commandments. This is the commandment[a], just as you heard from the beginning, that you should walk in it.'
translation:
  language: hi
  text: और प्रेम यह है कि हम उसकी आज्ञाओं के अनुसार चलें। यह आज्ञा है[a]—जैसा तुमने आरम्भ से सुना है—कि तुम उसमें चलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि तुम प्रेम में चलो”; “उसमें” का संकेत “आज्ञा” के बजाय “प्रेम” की ओर भी हो सकता है।
    reason: मूल यूनानी में स्त्रीलिंग एकवचन सर्वनाम का पूर्वपद ‘आज्ञा’ अथवा ‘प्रेम’ हो सकता है; वास्तविक अस्पष्टता को सुरक्षित रखना आवश्यक है।
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: यह ἀγάπη का स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी रूप है तथा यूहन्ना-साहित्य में इसके शब्द-संबंध को बनाए रखता है।
- source_word: ἵνα περιπατῶμεν
  choice: कि हम ... चलें
  rationale: यहाँ ἵνα प्रेम के व्यावहारिक अर्थ या विषय को स्पष्ट करता है; यह रूप उस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: περιπατέω
  choice: चलना
  rationale: नैतिक जीवन के लिए प्रयुक्त यूहन्नाई रूपक को सुरक्षित रखने हेतु इसे केवल ‘जीना’ नहीं किया गया; दोनों प्रयोगों में दोहराव भी बना रहता है।
- source_word: κατὰ τὰς ἐντολὰς αὐτοῦ
  choice: उसकी आज्ञाओं के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ और बहुवचन ‘आज्ञाओं’ दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐντολάς / ἐντολή
  choice: आज्ञाओं / आज्ञा
  rationale: मूल पाठ में बहुवचन से एकवचन की ओर परिवर्तन को बनाए रखा गया है।
- source_word: καθὼς ἠκούσατε ἀπ’ ἀρχῆς
  choice: जैसा तुमने आरम्भ से सुना है
  rationale: यूहन्नाई अभिव्यक्ति ‘आरम्भ से’ को सुरक्षित रखते हुए यूनानी अओरिस्ट को स्वाभाविक हिन्दी पूर्ण रूप में प्रस्तुत किया गया है।
- source_word: ἵνα ἐν αὐτῇ περιπατῆτε
  choice: कि तुम उसमें चलते रहो
  rationale: स्त्रीलिंग एकवचन सर्वनाम की अनिर्णीत संदर्भ-संभावना और ‘चलने’ के रूपक को बनाए रखता है; ‘चलते रहो’ जीवन-आचरण की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अन्तिम खण्ड में αὐτῇ (‘उसमें’) का संदर्भ
  choice: मुख्य पाठ में निकटतम स्त्रीलिंग एकवचन संज्ञा ‘आज्ञा’ की ओर संकेत
  alternative: 'यह आरम्भिक खण्ड के ‘प्रेम’ की ओर संकेत कर सकता है: ‘कि तुम प्रेम में चलते रहो।’'
  rationale: व्याकरण की दृष्टि से निकटतम पूर्वपद ἐντολή (‘आज्ञा’) है, पर ἀγάπη (‘प्रेम’) भी स्त्रीलिंग एकवचन है और विचार की दृष्टि से प्रबल सम्भावना रखता है। इसलिए मुख्य पाठ में अस्पष्ट सर्वनाम रखा गया और दूसरी सम्भावना पादटिप्पणी में दी गई।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘चलना’ नैतिक जीवन के बाइबलीय रूपक को बनाए रखता है। ‘तुम’ बहुवचन श्रोताओं को स्वाभाविक आधुनिक हिन्दी में संबोधित करता है।
