    reason: textual_variant
lexical_decisions:
- source_word: βλέπετε ἑαυτούς
  choice: अपने विषय में सावधान रहो
  rationale: वर्तमानकालिक बहुवचन आज्ञा लगातार सतर्क रहने का आग्रह करती है। यह स्वाभाविक हिन्दी में संबोधित पाठकों को स्वयं पर ध्यान रखने की चेतावनी देती है।
- source_word: ἵνα μὴ ἀπολέσητε
  choice: ताकि ... तुम खो न दो
  rationale: ἵνα के साथ निषेधात्मक संभावनार्थक रूप उस परिणाम को बताता है जिससे बचना है; यहाँ ἀπόλλυμι का अर्थ किए गए परिश्रम के फल को खो देना है।
- source_word: ἃ εἰργασάμεθα
  choice: जिसके लिए हमने परिश्रम किया है
  rationale: स्रोत पाठ का प्रथम पुरुष बहुवचन εἰργασάμεθα रखा गया है। पूर्णकाल पूर्व परिश्रम और उसके अब भी प्रासंगिक फल की ओर संकेत करता है।
- source_word: μισθὸν πλήρη
  choice: पूरा प्रतिफल
  rationale: इस उपदेशात्मक संदर्भ में μισθός के लिए ‘प्रतिफल’ स्वाभाविक है और πλήρη उसकी पूर्णता पर बल देता है।
- source_word: ἀπολάβητε
  choice: पाओ
  rationale: यहाँ क्रिया प्रतिफल प्राप्त करने को व्यक्त करती है; ‘पाओ’ स्पष्ट और सहज हिन्दी है, जबकि ‘वापस पाओ’ संदर्भ से अधिक अर्थ जोड़ सकता है।
theological_decisions:
- issue: εἰργασάμεθα का कर्ता और पाठांतर
  choice: हमने परिश्रम किया है
  alternative: तुमने परिश्रम किया है
  rationale: दिए गए SBLGNT पाठ में प्रथम पुरुष बहुवचन है, इसलिए मुख्य पाठ में प्रेरित सेवकों का परिश्रम रखा गया है। द्वितीय पुरुष वाला प्रसिद्ध पाठांतर पाठकों के अपने परिश्रम पर बल देता है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने विषय में सावधान रहो’ चेतावनी की शक्ति और आत्म-सतर्कता दोनों को व्यक्त करता है।
