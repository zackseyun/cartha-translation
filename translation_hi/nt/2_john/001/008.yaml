  text: Watch yourselves[a], so that you may not lose what we have worked for, but may receive a full reward.
translation:
  language: hi
  text: अपनी चौकसी करते रहो, ताकि तुम वह न खो दो जो हमने परिश्रम से किया है, बल्कि पूरा प्रतिफल पाओ।[a]
