  text: The children of your chosen sister greet you.
translation:
  language: hi
  text: तुम्हारी चुनी हुई बहन के बच्चे तुम्हें नमस्कार कहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεταί
  choice: नमस्कार कहते हैं
  rationale: यूनानी अभिवादन-सूचक क्रिया का स्वाभाविक आधुनिक हिन्दी रूप; एकवचन क्रिया नपुंसक बहुवचन कर्ता के साथ यूनानी व्याकरण के अनुरूप है, जबकि हिन्दी में अर्थानुसार बहुवचन रखा गया है।
- source_word: τὰ τέκνα
  choice: बच्चे
  rationale: τέκνα का सामान्य और सहज हिन्दी समतुल्य, जो पुत्र-पुत्रियों दोनों को समेटता है।
- source_word: τῆς ἀδελφῆς σου
  choice: तुम्हारी बहन के
  rationale: सम्बन्धकारक रचना और एकवचन अनौपचारिक सम्बोधन का सीधा निरूपण।
- source_word: τῆς ἐκλεκτῆς
  choice: चुनी हुई
  rationale: ἐκλεκτή का मूल अर्थ सुरक्षित रहता है और विशेषण को 'बहन' से जोड़ता है, बिना यह तय किए कि अभिव्यक्ति शाब्दिक स्त्री के लिए है या किसी मण्डली के लिए।
theological_decisions:
- issue: '''चुनी हुई बहन'' की पहचान'
  choice: वाक्यांश को यथावत् सम्बन्धसूचक रूप में रखा गया
  alternative: इसे स्पष्ट रूप से किसी स्थानीय मण्डली अथवा वास्तविक बहन के रूप में पहचानना
  rationale: मूल पाठ दोनों व्याख्याओं की सम्भावना खुली रखता है; अनुवाद उस वास्तविक अस्पष्टता को नहीं सुलझाता।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। 'नमस्कार कहते हैं' साधारण पाठक के लिए स्वाभाविक है; मूल की संक्षिप्तता और पारिवारिक भाषा सुरक्षित रखी गई है।
