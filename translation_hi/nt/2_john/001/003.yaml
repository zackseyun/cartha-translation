- from: परमेश्वर पिता और पिता के पुत्र, यीशु मसीह से अनुग्रह, दया और शान्ति सत्य और प्रेम में हमारे साथ रहेगी।
  to: परमेश्वर पिता की ओर से और यीशु मसीह की ओर से, जो पिता के पुत्र हैं, अनुग्रह, दया और शांति सत्य और प्रेम में हमारे साथ रहेंगे।
  rationale: The revision corrects Hindi plural agreement and makes the Greek’s two parallel source expressions explicit. The relative clause identifies यीशु मसीह as ‘the Father’s Son,’ preserving the appositional force of τοῦ υἱοῦ τοῦ πατρός. The future-indicative sense is retained with ‘रहेंगे,’ and the final qualifying phrase ‘सत्य और प्रेम में’ remains in place.
