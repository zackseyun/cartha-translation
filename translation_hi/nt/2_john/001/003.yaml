id: 2JN.1.3
reference: 2 John 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔσται μεθ’ ἡμῶν χάρις ἔλεος εἰρήνη παρὰ θεοῦ πατρός, καὶ ⸀παρὰ Ἰησοῦ Χριστοῦ τοῦ υἱοῦ τοῦ πατρός, ἐν ἀληθείᾳ καὶ ἀγάπῃ.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/003.yaml
  text: Grace[a], mercy, and peace will be with us from God the Father and from Jesus the Messiah, the Father's Son[b], in truth and love.
translation:
  language: hi
  text: परमेश्वर पिता की ओर से और यीशु मसीह की ओर से, जो पिता के पुत्र हैं, अनुग्रह, दया और शांति सत्य और प्रेम में हमारे साथ रहेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσται
  choice: रहेगी
  rationale: यह εἰμί का भविष्यत् सूचक रूप है; संयुक्त कर्ता के अंतिम निकटवर्ती स्त्रीलिंग संज्ञा ‘शान्ति’ के अनुरूप स्वाभाविक हिन्दी में ‘रहेगी’ रखा गया है। यह आशीर्वचन के भाव को बनाए रखते हुए मूल के कथनात्मक भविष्यकाल को व्यक्त करता है।
- source_word: μεθ’ ἡμῶν
  choice: हमारे साथ
  rationale: सम्बन्धकारक के साथ μετά का सामान्य अर्थ ‘साथ’ है; पत्र के अभिवादन में यही सहज और सीधा है।
- source_word: χάρις ἔλεος εἰρήνη
  choice: अनुग्रह, दया और शान्ति
  rationale: तीनों संज्ञाओं का क्रम और आशीर्वचन-सूत्र सुरक्षित रखा गया है। ‘अनुग्रह’ χάρις का प्रतिष्ठित और अर्थपूर्ण हिन्दी प्रतिरूप है।
- source_word: παρὰ θεοῦ πατρός
  choice: परमेश्वर पिता से
  rationale: सम्बन्धकारक के साथ παρά स्रोत दर्शाता है, इसलिए ‘से’। मूल में ‘हमारे’ नहीं है, अतः नहीं जोड़ा गया।
- source_word: παρὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह से
  rationale: दूसरा παρά भी स्रोत बताता है। Χριστός को मात्र लिप्यन्तरित करने के बजाय उसके पदवीगत अर्थ के अनुसार ‘मसीह’ रखा गया है, जो आधुनिक हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाता है।
- source_word: τοῦ υἱοῦ τοῦ πατρός
  choice: पिता के पुत्र
  rationale: यह पद यीशु मसीह की समानाधिकरण पहचान करता है। ‘पिता के पुत्र’ यूनानी सम्बन्धकारक संरचना को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν ἀληθείᾳ καὶ ἀγάπῃ
  choice: सत्य और प्रेम में
  rationale: ἐν का सीधा प्रतिरूप ‘में’ है। दोनों संज्ञाएँ बिना उपपद के गुणात्मक रूप में हैं, इसलिए कोई अतिरिक्त निर्धारक नहीं जोड़ा गया।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός यीशु की पदवी है। ‘मसीह’ पदवी का अर्थ-संकेत बनाए रखता है और हिन्दी बाइबलीय भाषा में स्वाभाविक है।
- issue: τοῦ υἱοῦ τοῦ πατρός का यीशु से सम्बन्ध
  choice: 'यीशु मसीह की समानाधिकरण पहचान: ‘पिता के पुत्र, यीशु मसीह’'
  alternative: 'यीशु मसीह के बाद अपेक्षाकृत ढीला वर्णन: ‘जो पिता का पुत्र है’'
  rationale: यूनानी वाक्यांश निकट समानाधिकरण में यीशु मसीह को पिता के पुत्र के रूप में पहचानता है। हिन्दी क्रम को सहज बनाने के लिए वर्णन को नाम से पहले रखा गया, बिना कोई अतिरिक्त धर्मवैज्ञानिक भाषा जोड़े।
- issue: ἔσται का वाक्य-भाव
  choice: 'कथनात्मक भविष्य: ‘रहेगी’'
  alternative: 'कामनात्मक आशीर्वचन: ‘रहे’'
  rationale: रूप भविष्यत् निर्देशार्थक है, न कि आज्ञार्थक या इच्छार्थक। इसलिए मूल की आश्वस्त कथनात्मक शक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘परमेश्वर पिता’ तथा ‘पिता के पुत्र’ मूल की निकटता और मसीही पहचान को बिना अतिरिक्त व्याख्या के व्यक्त करते हैं। वाक्यक्रम हिन्दी की स्वाभाविकता के लिए समायोजित है, जबकि दोनों स्रोत-वाक्यांश (‘से’) और अंतिम ‘सत्य और प्रेम में’ सुरक्षित हैं।
