  text: Πολλὰ ἔχων ὑμῖν γράφειν οὐκ ἐβουλήθην διὰ χάρτου καὶ μέλανος, ἀλλὰ ἐλπίζω ⸀γενέσθαι πρὸς ὑμᾶς καὶ στόμα πρὸς στόμα λαλῆσαι, ἵνα ἡ χαρὰ ⸀ὑμῶν ⸂πεπληρωμένη ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/012.yaml
  text: Though I have many things to write to you[a], I did not want to do so with paper and ink. Instead, I hope to come to you and speak face to face, so that your joy may be made complete.
translation:
  language: hi
  text: तुम्हें लिखने के लिए मेरे पास बहुत-सी बातें हैं, फिर भी मैं उन्हें कागज़ और स्याही से नहीं लिखना चाहता था। इसके बजाय, मुझे आशा है कि मैं तुम्हारे पास आऊँगा और आमने-सामने बात करूँगा, ताकि तुम्हारा आनंद[a] पूरा हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाण्डुलिपियों में “तुम्हारा आनंद” के स्थान पर “हमारा आनंद” है।
    reason: textual_variant
lexical_decisions:
- source_word: Πολλὰ ἔχων ὑμῖν γράφειν
  choice: तुम्हें लिखने के लिए मेरे पास बहुत-सी बातें हैं, फिर भी
  rationale: कृदन्तीय रचना के concessive भाव को स्वाभाविक हिन्दी में ‘फिर भी’ से व्यक्त किया गया है; Πολλά की बहुवचनता ‘बहुत-सी बातें’ में बनी रहती है।
- source_word: οὐκ ἐβουλήθην
  choice: मैं उन्हें ... नहीं लिखना चाहता था
  rationale: βούλομαι इच्छा या संकल्प दर्शाता है। सन्दर्भ में निहित लेखन-क्रिया को दोहराने से हिन्दी स्पष्ट और स्वाभाविक रहती है।
- source_word: διὰ χάρτου καὶ μέλανος
  choice: कागज़ और स्याही से
  rationale: διά के साधनवाचक अर्थ को ‘से’ व्यक्त करता है; ‘कागज़’ सामान्य पाठक के लिए स्वाभाविक है और χάρτου का पर्याप्त प्रतिनिधित्व करता है।
- source_word: ἀλλὰ ἐλπίζω γενέσθαι πρὸς ὑμᾶς
  choice: इसके बजाय, मुझे आशा है कि मैं तुम्हारे पास आऊँगा
  rationale: वाक्य का विरोधात्मक मोड़ और πρός का दिशात्मक भाव दोनों सुरक्षित हैं; γενέσθαι का प्रसंगगत अर्थ मिलने के लिए आने से है।
- source_word: στόμα πρὸς στόμα λαλῆσαι
  choice: आमने-सामने बात करूँगा
  rationale: शाब्दिक ‘मुँह से मुँह’ आधुनिक हिन्दी में भ्रामक होगा; यह प्रचलित मुहावरा प्रत्यक्ष व्यक्तिगत बातचीत का अर्थ ठीक व्यक्त करता है।
- source_word: ἵνα ἡ χαρὰ ὑμῶν πεπληρωμένη ᾖ
  choice: ताकि तुम्हारा आनन्द पूरा हो जाए
  rationale: ἵνα के उद्देश्य/परिणाम को ‘ताकि’ और पूर्णता की परिणामी अवस्था को ‘पूरा हो जाए’ से व्यक्त किया गया है। मुख्य पाठ के ὑμῶν को ‘तुम्हारा’ रखा गया है।
theological_decisions:
- issue: आनन्द किसका है—सर्वनाम का पाठभेद
  choice: तुम्हारा आनन्द
  alternative: हमारा आनन्द
  rationale: प्रदत्त SBLGNT पाठ में ὑμῶν (‘तुम्हारा’) है, इसलिए वही मुख्य पाठ में रखा गया। कुछ पाण्डुलिपियों का ἡμῶν (‘हमारा’) अर्थ की दृष्टि से महत्त्वपूर्ण है, अतः उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण पत्रात्मक रूप। एकवचन/बहुवचन में अस्पष्ट यूनानी ὑμεῖς के लिए पत्र के सामुदायिक सम्बोधन के अनुरूप प्रचलित ‘तुम’ रूप रखा गया है। ‘आनन्द’ बोधगम्य और धर्मग्रन्थीय गरिमा वाला शब्द है। पादटिप्पणी-चिह्न को सम्बन्धित पाठखंड के तुरन्त बाद रखा गया है।
