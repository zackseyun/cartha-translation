source:
  edition: SBLGNT
  text: ὅτι πολλοὶ πλάνοι ⸀ἐξῆλθον εἰς τὸν κόσμον, οἱ μὴ ὁμολογοῦντες Ἰησοῦν Χριστὸν ἐρχόμενον ἐν σαρκί· οὗτός ἐστιν ὁ πλάνος καὶ ὁ ἀντίχριστος.
base_translation:
  language: en
  yaml_path: translation/nt/2_john/001/007.yaml
  text: For many deceivers have gone out into the world[a], those who do not confess Jesus the Messiah coming in the flesh[b]. This is the deceiver and the antichrist.
translation:
  language: hi
  text: क्योंकि बहुत-से बहकाने वाले संसार में निकल पड़े हैं—वे जो यीशु मसीह के देह में आने का अंगीकार नहीं करते।[a] ऐसा व्यक्ति बहकाने वाला और मसीह-विरोधी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन यूनानी पांडुलिपियों में, “कि यीशु मसीह देह में आया है।” मुख्य पाठ में “देह में आने” का वर्तमान कृदंत है।
    reason: पाठांतर
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πολλοὶ πλάνοι
  choice: बहुत-से भरमाने वाले
  rationale: πλάνοι ऐसे लोगों को बताता है जो दूसरों को भटकाते हैं, केवल स्वयं भ्रमित लोगों को नहीं। ‘भरमाने वाले’ इस सक्रिय अर्थ को स्पष्ट रखता है।
- source_word: ἐξῆλθον εἰς τὸν κόσμον
  choice: संसार में निकल पड़े हैं
  rationale: यह उनके सार्वजनिक रूप से फैल जाने को व्यक्त करता है और κόσμος में अनावश्यक रूप से ‘व्यवस्था’ का अर्थ नहीं जोड़ता।
- source_word: οἱ μὴ ὁμολογοῦντες
  choice: वे जो यह अंगीकार नहीं करते
  rationale: संज्ञात्मक कृदंत को ‘वे जो’ से और ὁμολογέω के सार्वजनिक स्वीकार के भाव को ‘अंगीकार’ से व्यक्त किया गया है।
- source_word: Ἰησοῦν Χριστόν
  choice: यीशु मसीह
  rationale: यहाँ Χριστός यीशु की मसीही पहचान को सामने रखने वाली उपाधि है; हिन्दी में ‘यीशु मसीह’ स्थापित और स्वाभाविक रूप है।
- source_word: ἐρχόμενον ἐν σαρκί
  choice: देह में आ रहा है
  rationale: वर्तमान कृदंत के ‘आने’ वाले रूप को बनाए रखा गया है और ἐν σαρκί को वास्तविक देहधारण के अर्थ में ‘देह में’ कहा गया है।
- source_word: οὗτός ἐστιν
  choice: ऐसा व्यक्ति ही
  rationale: एकवचन संकेतवाचक यहाँ पहले बताए गए वर्ग के प्रत्येक ऐसे व्यक्ति को अलग करके चिन्हित करता है; यह हिन्दी में अर्थ को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ὁ πλάνος
  choice: भरमाने वाला
  rationale: पहले आए πλάνοι के साथ शब्दगत संगति रखी गई है।
- source_word: ὁ ἀντίχριστος
  choice: मसीह-विरोधी
  rationale: यह ἀντίχριστος का अर्थपूर्ण और प्रचलित हिन्दी धार्मिक रूप है, जो मसीह के विरोध का भाव स्पष्ट करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: संदर्भ में यह यीशु की उपाधि और पहचान के अंगीकार पर बल देता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय भाषा में सुबोध है।
- issue: ἐρχόμενον ἐν σαρκί का काल और पक्ष
  choice: देह में आ रहा है
  alternative: देह में आया है
  rationale: यूनानी पाठ वर्तमान कृदंत ‘आ रहा’ कहता है। मुख्य पाठ उसी वास्तविक अस्पष्टता और तनाव को बचाता है; पूर्ण भूतकाल वाला प्रचलित अर्थ पादटिप्पणी में दिया गया है।
- issue: σάρξ का अर्थ
  choice: देह
  alternative: पापी स्वभाव
  rationale: इस मसीह-संबंधी संदर्भ में σάρξ वास्तविक मानवीय शारीरिक अस्तित्व को बताता है, नैतिक भ्रष्टता को नहीं।
- issue: οὗτός का संदर्भ
  choice: ऐसा व्यक्ति ही
  alternative: यही
  rationale: बहुवचन वर्णन के बाद एकवचन संकेतवाचक किसी भी ऐसे व्यक्ति को उस प्रकार का प्रतिनिधि ठहराता है; अनुवाद इसे अनावश्यक रूप से केवल किसी एक ऐतिहासिक व्यक्ति तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘अंगीकार’, ‘देह’ और ‘मसीह-विरोधी’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं, पर वाक्य-विन्यास को स्वाभाविक बनाया गया है।
