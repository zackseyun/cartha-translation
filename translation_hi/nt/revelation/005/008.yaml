id: REV.5.8
reference: Revelation 5:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅτε ἔλαβεν τὸ βιβλίον, τὰ τέσσαρα ζῷα καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἔπεσαν ἐνώπιον τοῦ ἀρνίου, ἔχοντες ἕκαστος κιθάραν καὶ φιάλας χρυσᾶς γεμούσας θυμιαμάτων, αἵ εἰσιν ⸀αἱ προσευχαὶ τῶν ἁγίων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/008.yaml
  text: And when he took the scroll[a], the four living creatures and the twenty-four elders fell down before the Lamb, each holding a harp and golden bowls full of incense[b], which are the prayers of the saints.
translation:
  language: hi
  text: जब उसने वह लपेटा हुआ ग्रंथ लिया, तो चारों जीवित प्राणी और चौबीस प्राचीन मेम्ने के सामने गिर पड़े। उनमें से हर एक के हाथ में एक वीणा[a] और धूप से भरे सोने के कटोरे थे। ये पवित्र जनों[b] की प्रार्थनाएँ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तार वाला वाद्य।”
    reason: lexical_alternative
  - marker: b
    text: या, “संतों की प्रार्थनाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλίον
  choice: लपेटा हुआ ग्रंथ
  rationale: प्रकाशितवाक्य के दृश्य में यह आधुनिक जिल्दबंद पुस्तक के बजाय लपेटे जाने वाले लिखित ग्रंथ को दर्शाता है; यह पदबंध प्राचीन रूप और ग्रंथ होने के भाव—दोनों को स्पष्ट करता है।
- source_word: ζῷα
  choice: जीवित प्राणी
  rationale: यह सिंहासन के आसपास के स्वर्गीय प्राणियों के लिए है; ‘पशु’ अनचाहा नकारात्मक या केवल जंतु-संबंधी भाव दे सकता है।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: प्रकाशितवाक्य के चौबीस प्रतिष्ठित स्वर्गीय प्राचीनों के लिए प्रचलित बाइबलीय पद रखा गया है; इससे किसी बाद के कलीसियाई पदनाम को आरोपित नहीं किया जाता।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह स्थान और श्रद्धापूर्ण उपस्थिति—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀρνίου
  choice: मेम्ने
  rationale: प्रकाशितवाक्य में यह मसीह के लिए प्रयुक्त स्थापित प्रतीकात्मक उपाधि है और बलिदानी अनुगूँज को बनाए रखती है।
- source_word: ἔχοντες ἕκαστος
  choice: उनमें से हर एक के पास
  rationale: यह ἕκαστος की वितरणात्मक शक्ति को बनाए रखता है और हिन्दी में स्वाभाविक रूप से बताता है कि हर एक ये वस्तुएँ लिए हुए था।
- source_word: κιθάραν
  choice: वीणा
  rationale: κιθάρα एक तार वाला वाद्य था; ‘वीणा’ हिन्दी में समझ में आने वाला पारंपरिक समतुल्य है, जबकि अधिक सामान्य विकल्प पादटिप्पणी में दिया गया है।
- source_word: φιάλας χρυσᾶς
  choice: सोने के कटोरे
  rationale: φιάλη चौड़े या उथले पात्र को दर्शाता है; ‘कटोरे’ आधुनिक पाठक के लिए स्पष्ट है और ‘शीशियों’ जैसे भ्रामक रूप से बचता है।
- source_word: γεμούσας θυμιαμάτων
  choice: धूप से भरे
  rationale: यह बहुवचन θυμιαμάτων को हिन्दी में स्वाभाविक सामूहिक संज्ञा ‘धूप’ से व्यक्त करता है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: यह परमेश्वर के लिए अलग किए गए लोगों का अर्थ सीधे व्यक्त करता है और ‘संत’ शब्द से जुड़ी बाद की संकीर्ण धारणा को मुख्य पाठ में अनावश्यक रूप से नहीं लाता।
theological_decisions:
- issue: धूप से भरे सोने के कटोरों और प्रार्थनाओं की प्रतीकात्मक पहचान
  choice: ‘ये पवित्र जनों की प्रार्थनाएँ हैं’ के रूप में सीधी समतामूलक पहचान
  alternative: ‘ये पवित्र जनों की प्रार्थनाओं का प्रतीक हैं’
  rationale: यूनानी αἵ εἰσιν सीधी पहचान करता है। प्रकाशितवाक्य की प्रतीकात्मक भाषा को व्याख्यात्मक ‘प्रतीक हैं’ जोड़कर कमजोर नहीं किया गया। स्त्रीलिंग बहुवचन αἵ का व्याकरणिक पूर्वपद φιάλας (‘कटोरे’) है; हिन्दी ‘ये’ इस दृश्यात्मक संबंध को खुला रखता है।
- issue: ἅγιοι का अर्थ
  choice: पवित्र जन
  alternative: संत
  rationale: ‘पवित्र जन’ परमेश्वर के पवित्र किए हुए लोगों के व्यापक अर्थ को सुरक्षित रखता है, किसी विशिष्ट बाद की संत-घोषणा संबंधी धारणा को आयात नहीं करता; प्रचलित विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लपेटा हुआ ग्रंथ’ प्राचीन पुस्तक-रूप को स्पष्ट करता है; ‘प्राचीन’ प्रकाशितवाक्य की स्थापित धार्मिक शब्दावली बनाए रखता है। यूनानी के सीधे प्रतीकात्मक कथन को व्याख्यात्मक रूप से नहीं बदला गया। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी [a] का चिह्न ‘scroll’ के बाद था, जबकि उसकी सामग्री κιθάρα के विकल्प से संबंधित थी; हिन्दी में चिह्न को अर्थानुसार ‘वीणा’ के बाद रखा गया है।
