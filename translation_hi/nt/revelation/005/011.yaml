  rationale: ὁράω का सामान्य और संदर्भानुकूल अर्थ; यह दर्शन में यूहन्ना की दृष्टि की अगली अवस्था बताता है। ‘मैंने नज़र उठाई’ भी प्रसंगगत रूप से संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
