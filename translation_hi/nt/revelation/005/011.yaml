  rationale: एकवचन φωνή को सामूहिक ध्वनि/स्वर के रूप में रखते हुए स्वाभाविक हिन्दी दी गई है; ‘आवाज़’ व्यक्तिगतता और सामूहिक उद्घोष दोनों को सम्भव रहने देती है।
