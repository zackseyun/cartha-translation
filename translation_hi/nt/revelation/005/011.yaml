- source_word: ἦν ὁ ἀριθμὸς αὐτῶν
  choice: उनकी संख्या ... थी
  rationale: मूल की स्पष्ट संख्या-वाचक अभिव्यक्ति को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: μυριάδες μυριάδων
  choice: लाखों-करोड़ों
  rationale: μυριάς मूलतः दस हज़ार और विस्तारतः अत्यन्त विशाल संख्या दर्शाता है। आधुनिक हिन्दी में ‘लाखों-करोड़ों’ उसी अपार बहुलता को सहजता से व्यक्त करता है; अधिक रूपगत विकल्प पादटिप्पणी में दिया गया है।
