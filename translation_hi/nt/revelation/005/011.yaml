  text: और मैंने देखा, और सिंहासन, जीवित प्राणियों और प्राचीनों के चारों ओर बहुत-से स्वर्गदूतों की आवाज़ सुनी। उनकी संख्या दस हज़ारों के दस हज़ार और हज़ारों के हज़ार थी[a]।
  philosophy: optimal-equivalence
  footnotes:
