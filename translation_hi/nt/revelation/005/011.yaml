  rationale: मुख्य पाठ में अपार समूह का आशय प्राकृतिक आधुनिक हिन्दी में दिया गया है, जबकि मूल की संख्यात्मक संरचना पादटिप्पणी में सुरक्षित है; इसे सटीक गणना या पूर्णतः अगणनीय संख्या के रूप में निर्णीत नहीं किया गया।
