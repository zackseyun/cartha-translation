source:
  edition: SBLGNT
  text: καὶ εἷς ἐκ τῶν πρεσβυτέρων λέγει μοι· Μὴ κλαῖε· ἰδοὺ ἐνίκησεν ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα, ἡ ῥίζα Δαυίδ, ⸀ἀνοῖξαι τὸ βιβλίον καὶ τὰς ἑπτὰ σφραγῖδας αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/005.yaml
  text: And one of the elders says to me[a], “Do not weep. Behold, the Lion from the tribe of Judah, the Root of David, has conquered[c][b], to open the scroll and its seven seals.”
translation:
  language: hi
  text: तब प्राचीनों में से एक मुझसे कहता है, “मत रो। देख, यहूदा के गोत्र का सिंह, दाऊद की जड़, विजयी हुआ है[a], ताकि वह उस लिपटे हुए लेख और उसकी सातों मुहरों को खोल सके[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जय पाई है” अथवा “विजय प्राप्त की है।” यूनानी क्रिया प्रकाशितवाक्य में विजय पाने का एक प्रमुख शब्द है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, “उस लिपटे हुए लेख और उसकी सातों मुहरों को खोलने के लिए।” यूनानी अनंत क्रिया प्रयोजन या परिणाम, दोनों का भाव दे सकती है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: πρεσβυτέρων
  choice: प्राचीनों
  rationale: प्रकाशितवाक्य में यह केवल आयु का वर्णन नहीं, बल्कि स्वर्गीय समूह की मान्य उपाधि है; ‘प्राचीन’ हिंदी बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी का कथात्मक वर्तमान काल दृश्य की तात्कालिकता बनाए रखता है।
- source_word: Μὴ κλαῖε
  choice: मत रो
  rationale: यह आधुनिक हिंदी में स्वाभाविक, सीधा और प्रसंग के गंभीर भाव के अनुकूल है।
- source_word: ἰδοὺ
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाले यूनानी सूचक का सहज आधुनिक हिंदी रूप है।
- source_word: ἐνίκησεν
  choice: विजयी हुआ है
  rationale: νικάω के विजय-अर्थ और प्रकाशितवाक्य में इसकी प्रमुख आवर्ती भूमिका को बनाए रखता है; ‘जय पाई है’ भी संभव है।
- source_word: ὁ λέων ὁ ἐκ τῆς φυλῆς Ἰούδα
  choice: यहूदा के गोत्र का सिंह
  rationale: यह अभिव्यक्ति मसीही उपाधि तथा यहूदा से संबंध/उद्गम दोनों को स्वाभाविक हिंदी में सुरक्षित रखती है।
- source_word: ἡ ῥίζα Δαυίδ
  choice: दाऊद की जड़
  rationale: यशायाह-संबंधी मसीही बिंब को बिना व्याख्यात्मक विस्तार के अक्षुण्ण रखता है।
- source_word: ἀνοῖξαι
  choice: ताकि वह ... खोल सके
  rationale: यह अनंत क्रिया को विजय के परिणाम अथवा उससे प्राप्त सामर्थ्य/अधिकार के रूप में समझने योग्य हिंदी देता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: τὸ βιβλίον
  choice: पुस्तक-लपेटा
  rationale: प्रसंग में लिखित वस्तु आधुनिक जिल्द वाली पुस्तक नहीं, लपेटा हुआ लेख है; यह हिंदी रूप उसी ऐतिहासिक वस्तु को स्पष्ट करता है।
- source_word: σφραγῖδας
  choice: मुहरों
  rationale: लपेटे को बंद रखने वाली σφραγίς के लिए प्रचलित और स्पष्ट हिंदी शब्द है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: सर्वनाम पुस्तक-लपेटे की ओर संकेत करता है; हिंदी में यही स्वाभाविक संबंधकारक रूप है।
theological_decisions:
- issue: यीशु पर लागू राजकीय-मसीही उपाधियाँ
  choice: 'दोनों उपाधियाँ सीधे रखी गईं: ‘यहूदा के गोत्र का सिंह, दाऊद की जड़’।'
  alternative: उपाधियों को व्याख्यात्मक भावार्थ में बदलना।
  rationale: मूल पाठ इस्राएल के धर्मग्रंथों से जुड़ी दोनों मसीही पहचानों को साथ रखता है; उन्हें ज्यों का त्यों रखना पाठ की मसीह-संबंधी शक्ति बचाता है।
- issue: ἐνίκησεν के बाद ἀνοῖξαι का संबंध
  choice: ‘विजयी हुआ है, ताकि वह ... खोल सके’।
  alternative: ‘... खोलने के लिए विजयी हुआ है’।
  rationale: यूनानी अनंत क्रिया प्रयोजन, परिणाम या योग्यता-संबंधी अर्थ दे सकती है। मुख्य पाठ स्वाभाविक हिंदी में विजय और खोलने की क्षमता का संबंध व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में देकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘प्राचीन’, ‘गोत्र’, ‘मुहर’ और मसीही उपाधियाँ बाइबलीय अंतर्पाठ को बनाए रखती हैं; ‘देख’ अनावश्यक पुरातनता से बचाता है।
