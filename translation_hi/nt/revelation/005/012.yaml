  text: λέγοντες φωνῇ μεγάλῃ· Ἄξιόν ἐστιν τὸ ἀρνίον τὸ ἐσφαγμένον λαβεῖν τὴν δύναμιν ⸀καὶ πλοῦτον καὶ σοφίαν καὶ ἰσχὺν καὶ τιμὴν καὶ δόξαν καὶ εὐλογίαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/012.yaml
  text: saying with a loud voice[c][b][a], “Worthy is the Lamb who was slain to receive power and wealth and wisdom and might and honor and glory and blessing.”
translation:
  language: hi
  text: वे ऊँचे स्वर से कह रहे थे, “वह मेमना, जिसका वध किया गया था,[a] सामर्थ्य, धन-संपत्ति,[b] बुद्धि, शक्ति,[c] आदर, महिमा और आशीष पाने के योग्य है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसे मार डाला गया था।” यूनानी शब्द अधिक प्रखर ढंग से हिंसक वध को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “धन।”
    reason: lexical_alternative
  - marker: c
    text: या “बल।” यहाँ “शक्ति” को पहले आए “सामर्थ्य” से भेद बनाए रखने के लिए चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: कह रहे थे
  rationale: वर्तमान कृदंत पिछले पद की स्वर्गीय भीड़ से जुड़ा है; हिन्दी में अपूर्ण क्रिया इसकी जारी सामूहिक उद्घोषणा को स्वाभाविक रूप से व्यक्त करती है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से
  rationale: यह μεγάλῃ की तीव्रता और φωνῇ की ठोस वाणी-छवि दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: Ἄξιόν ἐστιν
  choice: योग्य है
  rationale: दावे को स्पष्ट और गरिमापूर्ण रखता है; हिन्दी वाक्य-विन्यास में विधेय को अंत में रखना स्वाभाविक है।
- source_word: τὸ ἀρνίον
  choice: वह मेमना
  rationale: प्रकाशितवाक्य में यह मसीह के लिए प्रयुक्त विशिष्ट उपाधि है; ‘वह’ इसकी निश्चितता दिखाता है।
- source_word: τὸ ἐσφαγμένον
  choice: जिसका वध किया गया था
  rationale: पूर्ण कर्मवाच्य कृदंत हिंसक मृत्यु और उसके स्थायी परिणाम की पृष्ठभूमि रखता है, जबकि ‘वध’ उपासना के गरिमापूर्ण प्रसंग में स्वाभाविक है।
- source_word: λαβεῖν
  choice: पाने
  rationale: यहाँ मेमने को सात गुणों/सम्मानों की अर्पणा या प्रदान किया जाना अभिप्रेत है; ‘पाना’ आधुनिक हिन्दी में ‘ग्रहण करना’ से अधिक सहज है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: δύναμις के लिए प्रचलित अर्थ देते हुए इसे बाद के ἰσχύς से अलग रखता है।
- source_word: πλοῦτον
  choice: धन-संपत्ति
  rationale: भौतिक संसाधनों और प्रचुरता का व्यापक अर्थ स्पष्ट करता है; केवल ‘धन’ की अपेक्षा अर्थ अधिक पूर्ण है।
- source_word: σοφίαν
  choice: बुद्धि
  rationale: सातगुनी स्तुति में σοφία का सीधा, सामान्य और सुबोध हिन्दी समतुल्य है।
- source_word: ἰσχὺν
  choice: शक्ति
  rationale: बल और प्रबलता का भाव देता है तथा पहले आए δύναμις के ‘सामर्थ्य’ से शब्दगत भेद बनाए रखता है।
- source_word: τιμὴν
  choice: आदर
  rationale: प्रदत्त सम्मान और श्रद्धा के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δόξαν
  choice: महिमा
  rationale: उपासना-संदर्भ में δόξα का स्थापित और अर्थपूर्ण हिन्दी रूप है।
- source_word: εὐλογίαν
  choice: स्तुति
  rationale: इस स्वर्गीय उद्घोषणा में εὐλογία का अर्थ प्रशंसापूर्ण वंदना है; ‘स्तुति’ हिन्दी पाठक के लिए स्वाभाविक है।
theological_decisions:
- issue: मसीह-संबंधी उपाधि ἀρνίον
  choice: वह मेमना
  alternative: मेमना
  rationale: संदर्भ में यह मारे गए और महिमान्वित यीशु की पहचानी हुई उपाधि है। हिन्दी में बड़े अक्षरों का भेद नहीं होता, इसलिए निश्चितता ‘वह’ से प्रकट की गई है, बिना अतिरिक्त सिद्धान्त जोड़े।
- issue: बलिदानी मृत्यु की भाषा
  choice: जिसका वध किया गया था
  alternative: जिसे मार डाला गया था
  rationale: यह σφάζω की हिंसक/बलिदानी ध्वनि को सुरक्षित रखते हुए उपासना के ऊँचे और गरिमापूर्ण स्वर के अनुकूल है; प्रायश्चित की किसी विशिष्ट व्याख्या को इसमें नहीं जोड़ा गया।
- issue: λαβεῖν का अर्थ
  choice: पाने
  alternative: लेने
  rationale: स्तुतिगान में सूचीबद्ध वस्तुएँ मेमने को अर्पित या प्रदान की जाती हैं; ‘पाने’ से यह भाव आता है, जबकि यूनानी क्रिया में संभावित ‘लेने’ का अर्थ पादटिप्पणी योग्य स्तर का अस्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और उपासना-संगत रूप अपनाया गया है। सात पदों की लय और पुनरुक्त ‘और’ सुरक्षित रखी गई है। ‘सामर्थ्य’ और ‘शक्ति’ से δύναμις तथा ἰσχύς का शब्दगत भेद व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के तुरंत बाद दिए गए हैं।
