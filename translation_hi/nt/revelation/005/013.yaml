id: REV.5.13
reference: Revelation 5:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πᾶν κτίσμα ὃ ἐν τῷ οὐρανῷ καὶ ἐπὶ τῆς γῆς καὶ ὑποκάτω τῆς γῆς καὶ ἐπὶ τῆς ⸀θαλάσσης, καὶ τὰ ἐν αὐτοῖς ⸀πάντα, ἤκουσα λέγοντας· Τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃ καὶ τῷ ἀρνίῳ ἡ εὐλογία καὶ ἡ τιμὴ καὶ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/013.yaml
  text: And I heard every creature in heaven and on the earth and under the earth and on the sea[a], and all that is in them, saying[b], “To the one seated on the throne and to the Lamb be blessing and honor and glory and dominion forever and ever.”
translation:
  language: hi
  text: और मैंने स्वर्ग में, पृथ्वी पर, पृथ्वी के नीचे और समुद्र में रहने वाले हर प्राणी को—और इन सबमें जो कुछ है उसे भी—यह कहते सुना, “सिंहासन पर विराजमान जन और मेम्ने को स्तुति, आदर, महिमा और प्रभुता युगानुयुग[b] होती रहे!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: शाब्दिक रूप से, “युगों के युगों तक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν κτίσμα
  choice: हर प्राणी
  rationale: κτίσμα किसी सृजे हुए प्राणी या वस्तु को सूचित कर सकता है; यहाँ बोलकर आराधना करने के संदर्भ में ‘हर प्राणी’ स्वाभाविक है और πᾶν का एक-एक को समेटने वाला भाव रखता है।
- source_word: ὃ ἐν τῷ οὐρανῷ ... καὶ τὰ ἐν αὐτοῖς πάντα
  choice: स्वर्ग में, पृथ्वी पर, पृथ्वी के नीचे और समुद्र में रहने वाले ... हाँ, जो कुछ इन सबमें है
  rationale: यह क्रम समूची सृष्टि को समेटता है। हिंदी में समुद्री जीवों के लिए ‘समुद्र में’ स्वाभाविक है; ‘इन सबमें’ सभी बताए गए क्षेत्रों की ओर सामूहिक रूप से संकेत करता है।
- source_word: ἤκουσα λέγοντας
  choice: यह कहते सुना
  rationale: यूनानी कृदंत सामूहिक कर्ता के बोलने को दर्शाता है; हिंदी में यह रचना स्पष्ट और स्वाभाविक है।
- source_word: Τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: जो सिंहासन पर विराजमान है
  rationale: ‘विराजमान’ सिंहासन के संदर्भ में वर्तमान बैठी हुई अवस्था को गरिमापूर्ण और सहज हिंदी में व्यक्त करता है।
- source_word: τῷ ἀρνίῳ
  choice: मेम्ना
  rationale: प्रकाशितवाक्य में ἀρνίον का स्थापित मसीही शीर्षक और बलिदानी बिंब ‘मेम्ना’ से सुरक्षित रहता है।
- source_word: ἡ εὐλογία
  choice: स्तुति
  rationale: इस आराधनात्मक प्रसंग में εὐλογία परमेश्वर और मेम्ने के लिए उच्चारित प्रशंसात्मक आशीर्वचन है; हिंदी में ‘स्तुति’ उसका सबसे स्वाभाविक भाव देता है, जबकि ‘आशीष’ यहाँ भ्रामक लग सकता है।
- source_word: ἡ τιμή
  choice: आदर
  rationale: दिया जाने वाला सम्मान व्यक्त करने के लिए ‘आदर’ सरल और वर्तमान हिंदी है।
- source_word: ἡ δόξα
  choice: महिमा
  rationale: आराधना के प्रसंग में δόξα का स्थापित और अर्थानुकूल प्रतिशब्द ‘महिमा’ है।
- source_word: τὸ κράτος
  choice: प्रभुता
  rationale: κράτος प्रकट सामर्थ्य और शासकीय अधिकार का बोध देता है; राजकीय स्तुति में ‘प्रभुता’ इस आयाम को सामान्य ‘शक्ति’ से अधिक स्पष्ट रखती है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह यूनानी मुहावरा अनंत अवधि बताता है; ‘युगानुयुग’ संक्षिप्त, गरिमापूर्ण और हिंदी पाठकों के लिए परिचित है।
theological_decisions:
- issue: परमेश्वर और मेम्ने को संयुक्त स्तुति
  choice: एक ही स्तुतिपरक उद्घोष को सिंहासन पर विराजमान जन और मेम्ने, दोनों को संयुक्त रूप से संबोधित रखा गया है।
  alternative: दोनों के लिए अलग-अलग क्रिया या स्तुति-वाक्य जोड़ना।
  rationale: यूनानी पाठ दोनों को समानांतर रूप में रखकर एक ही चार पदों वाली स्तुति अर्पित करता है। हिंदी में ‘उनकी’ से यह संयुक्त संबोधन स्पष्ट होता है, बिना किसी अतिरिक्त सिद्धांतात्मक व्याख्या के।
- issue: κτίσμα का संदर्भ
  choice: हर प्राणी
  alternative: समूची सृष्टि; हर सृजी हुई वस्तु
  rationale: दृश्य में सभी लोकों के निवासी सुनाई देने योग्य स्तुति बोलते हैं; इसलिए ‘हर प्राणी’ व्यक्तिगत और वाचिक पक्ष के साथ सार्वभौमिक विस्तार को भी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और आराधनात्मक गरिमा वाली रखी गई है। ‘विराजमान’, ‘मेम्ना’, ‘महिमा’, ‘प्रभुता’ और ‘युगानुयुग’ बाइबलीय संदर्भ में परिचित हैं, पर वाक्य-रचना वर्तमान मानक हिंदी की है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न उनके वास्तविक शब्दगत स्थानों पर लगाए गए हैं।
