  yaml_path: translation/nt/revelation/005/014.yaml
  text: And the four living creatures were saying[a], “Amen.” And the elders fell down and worshiped.
translation:
  language: hi
  text: और वे चार जीवित प्राणी कह रहे थे, “आमीन।” और प्राचीन गिर पड़े और उन्होंने आराधना की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियाँ “आराधना की” के बाद एक स्पष्ट कर्म जोड़ती हैं, जैसे “उसकी, जो युगानुयुग जीवित है” या “उसकी।” मुख्य पाठ SBLGNT के संक्षिप्त पाठ का अनुसरण करता है, जिसमें आराधना किसकी की गई, यह प्रसंग से समझा जाता है।
    reason: textual_variant
lexical_decisions:
- source_word: ζῷα
  choice: जीवित प्राणी
  rationale: प्रकाशितवाक्य में यह सिंहासन के चारों ओर के स्वर्गीय प्राणियों का पदनाम है; यह अनुवाद यहेजकेल के दर्शन से संबंध भी बनाए रखता है और इन्हें सामान्य पशु नहीं बताता।
- source_word: ἔλεγον
  choice: कहते जा रहे थे
  rationale: अपूर्ण भूतकाल चलती या दोहराई जाती क्रिया का संकेत देता है; यह पदबंध उस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἀμήν
  choice: आमीन
  rationale: यह आराधना में प्रयुक्त स्वीकृति और पुष्टि का परिचित उद्गार है; लिप्यंतरण उसके धार्मिक स्वरूप को सुरक्षित रखता है।
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: यहाँ यह आयु का सामान्य वर्णन नहीं, बल्कि स्वर्गीय सभा के एक विशिष्ट समूह का पदनाम है।
- source_word: ἔπεσαν
  choice: गिरकर
  rationale: आराधना के प्रसंग में यह भूमि पर झुकने या दण्डवत होने की शारीरिक क्रिया को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: सिंहासन-कक्ष के इस प्रसंग में क्रिया केवल प्रणाम नहीं, आराधनापूर्ण श्रद्धा व्यक्त करती है।
theological_decisions:
- issue: आराधना का कर्म मूल पाठ में अनुक्त है
  choice: “आराधना की” कहकर कर्म को अनुक्त रखा गया
  alternative: “उसकी आराधना की,” “परमेश्वर की आराधना की,” अथवा “जो युगानुयुग जीवित है उसकी आराधना की”
  rationale: SBLGNT में προσεκύνησαν के साथ कोई स्पष्ट कर्म नहीं है। हिन्दी में भी कर्म को प्रसंग से समझा जा सकता है; उसे जोड़ने से दूसरी पाठ-परंपराओं या व्याख्या की भाषा मुख्य पाठ में आ जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज आराधनात्मक स्वर रखा गया है। “चारों,” “कहते जा रहे थे,” और “गिरकर आराधना की” सामान्य पाठक के लिए स्पष्ट हैं; “प्राचीन” को प्रकाशितवाक्य के विशिष्ट स्वर्गीय समूह के पारंपरिक पदनाम के रूप में रखा गया है।
