  yaml_path: translation/nt/revelation/005/007.yaml
  text: And he came and took it from the right hand of the one seated on the throne.
translation:
  language: hi
  text: और वह आया और सिंहासन पर बैठे हुए व्यक्ति के दाहिने हाथ से उसे ले लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθεν
  choice: आया
  rationale: ἔρχομαι के भूतकालिक रूप को दर्शन के घटनाक्रम में सरल और स्वाभाविक ढंग से व्यक्त करता है। ‘पास आया’ संभव है, पर मूल क्रिया में निहित न होने वाली व्याख्यात्मक बारीकी जोड़ सकता है।
- source_word: εἴληφεν
  choice: ले लिया
  rationale: λαμβάνω का पूर्णकालिक रूप यहाँ दर्शन के क्रम में पूरी हुई क्रिया बताता है। हिन्दी में ‘ले लिया’ इस प्रत्यक्ष और निर्णायक क्रिया को स्वाभाविक रूप से व्यक्त करता है; ‘प्राप्त किया’ अपेक्षाकृत निष्क्रिय लगेगा।
- source_word: ἐκ
  choice: से
  rationale: स्रोत या स्थान से किसी वस्तु को लेने का सामान्य हिन्दी संबंधबोधक रूप है।
- source_word: τῆς δεξιᾶς
  choice: दाहिने हाथ
  rationale: इस संरचना में δεξιά का संकेत दाहिने हाथ की ओर है, केवल दाहिनी ओर की ओर नहीं; इससे दर्शन का ठोस बिंब बना रहता है।
- source_word: τοῦ καθημένου
  choice: बैठे हुए के
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत को यह वाक्यांश स्वाभाविक हिन्दी में व्यक्त करता है और मेम्ने तथा सिंहासन पर विराजमान व्यक्ति का भेद बनाए रखता है।
- source_word: ἐπὶ τοῦ θρόνου
  choice: सिंहासन पर
  rationale: ἐπί का स्थानवाचक अर्थ आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त होता है।
theological_decisions:
- issue: εἴληφεν का अंतर्निहित कर्म
  choice: ‘उसे’ जोड़ा गया, जिसका संकेत पिछले संदर्भ के पुस्तक-लपेटे की ओर है।
  alternative: 'कर्म को अनकहा छोड़ना: ‘...दाहिने हाथ से ले लिया।’'
  rationale: यूनानी में कर्म निकटवर्ती संदर्भ से स्पष्ट होने के कारण अनकहा है। हिन्दी में ‘उसे’ जोड़ने से नई सूचना जोड़े बिना संदर्भ स्पष्ट और वाक्य स्वाभाविक बनता है।
- issue: सिंहासन पर बैठे पात्र का वर्णन
  choice: ‘सिंहासन पर बैठे हुए’
  alternative: ‘जो सिंहासन पर बैठा था’ अथवा ‘सिंहासन पर विराजमान’
  rationale: यह मूल के कृदंतात्मक वर्णन को निकटता से रखता है, मेम्ने से इस पात्र का भेद बनाए रखता है, और ऐसी अतिरिक्त उपाधि या धर्मवैज्ञानिक पहचान नहीं जोड़ता जो इस पद में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘विराजमान’ जैसे अधिक संस्कृतनिष्ठ शब्द के बजाय ‘बैठे हुए’ चुना गया है, जबकि ‘सिंहासन’ दर्शन की राजकीय छवि को बनाए रखता है।
