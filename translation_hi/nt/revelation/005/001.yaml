source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐπὶ τὴν δεξιὰν τοῦ καθημένου ἐπὶ τοῦ θρόνου βιβλίον γεγραμμένον ἔσωθεν καὶ ⸀ὄπισθεν, κατεσφραγισμένον σφραγῖσιν ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/001.yaml
  text: And I saw in the right hand of the one seated on the throne a scroll written within and on the back[b][a], sealed with seven seals.
translation:
  language: hi
  text: फिर मैंने सिंहासन पर विराजमान व्यक्ति के दाहिने हाथ में एक स्क्रॉल[a] देखा, जो भीतर और उसकी पिछली ओर[b] लिखा हुआ था और सात मुहरों से मुहरबंद था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक पुस्तक।” यहाँ यूनानी शब्द βιβλίον से संभवतः आज की जिल्दबंद पुस्तक नहीं, बल्कि एक स्क्रॉल अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “भीतर और पीछे की ओर।” कुछ अनुवाद दूसरे वाक्यांश को अधिक सामान्य रूप से “बाहर की ओर” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: साधारण भूतकालीन कथन के रूप में यह स्वाभाविक और स्रोत के अनुरूप है।
- source_word: ἐπὶ τὴν δεξιὰν
  choice: दाहिने हाथ में
  rationale: यद्यपि ἐπί का मूल स्थानगत अर्थ ‘पर’ हो सकता है, इस प्रसंग में वस्तु का हाथ में होना या अधिकार में होना स्वाभाविक हिन्दी चित्र प्रस्तुत करता है।
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: सिंहासन पर विराजमान व्यक्ति
  rationale: यह वर्णनात्मक कृदन्त को बनाए रखता है, उस व्यक्ति की पहचान को नाम देकर स्पष्ट नहीं करता, और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: βιβλίον
  choice: पुस्तक-लपेटा
  rationale: पहली शताब्दी के भौतिक संदर्भ में यह संभवतः कोडेक्स नहीं, लपेटी जाने वाली लिखित सामग्री थी। ‘पुस्तक-लपेटा’ सामान्य ‘पुस्तक’ की अपेक्षा उस रूप को स्पष्ट करता है; विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: γεγραμμένον
  choice: लिखा हुआ था
  rationale: पूर्ण निष्क्रिय कृदन्त उस वस्तु की लिखित अवस्था बताता है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: ἔσωθεν καὶ ὄπισθεν
  choice: भीतर और पीछे की ओर
  rationale: यह यूनानी के स्थानगत शब्दों को निकटता से रखता है और ‘बाहर’ कहकर अर्थ को अनावश्यक रूप से सामान्यीकृत नहीं करता।
- source_word: κατεσφραγισμένον
  choice: मुहरबंद था
  rationale: पूर्ण निष्क्रिय रूप से प्राप्त, बनी हुई अवस्था को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σφραγῖσιν ἑπτά
  choice: सात मुहरों से
  rationale: करणवाचक दत्तिव को हिन्दी में ‘से’ द्वारा स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: सिंहासन पर बैठे व्यक्ति की पहचान
  choice: सिंहासन पर विराजमान व्यक्ति
  alternative: सिंहासन पर विराजमान परमेश्वर
  rationale: यूनानी पाठ यहाँ उस व्यक्ति का वर्णन करता है, स्पष्ट रूप से उसका नाम नहीं देता। अनुवाद साहित्यिक प्रस्तुति और निहित धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘विराजमान’ प्रकाशन के राजसी दृश्य के अनुरूप है। ‘पुस्तक-लपेटा’ अपेक्षाकृत कम प्रचलित है, इसलिए उसके साथ पाद-टिप्पणी दी गई है।
