  text: καὶ εἶδον ἄγγελον ἰσχυρὸν κηρύσσοντα ἐν φωνῇ μεγάλῃ· Τίς ⸀ἄξιος ἀνοῖξαι τὸ βιβλίον καὶ λῦσαι τὰς σφραγῖδας αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/002.yaml
  text: And I saw a mighty angel proclaiming with a loud voice[a], “Who is worthy to open the scroll and break its seals?”
translation:
  language: hi
  text: और मैंने एक शक्तिशाली स्वर्गदूत को ऊँचे स्वर में घोषणा करते हुए देखा, “इस लिपटे हुए ग्रंथ को खोलने और इसकी मुहरें तोड़ने के योग्य कौन है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελον ἰσχυρόν
  choice: एक शक्तिशाली स्वर्गदूत
  rationale: ἰσχυρός सामर्थ्य और शक्ति का बोध कराता है। ‘शक्तिशाली’ आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: κηρύσσοντα
  choice: घोषणा करते
  rationale: κηρύσσω सार्वजनिक और अधिकारपूर्ण ढंग से उद्घोषणा करने को दर्शाता है; यहाँ ‘प्रचार करते’ की अपेक्षा ‘घोषणा करते’ दृश्य के अनुकूल है।
- source_word: ἐν φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: यह यूनानी मुहावरा प्रबल और सबको सुनाई देने वाली वाणी का संकेत देता है। ‘ऊँची आवाज़ में’ सहज आधुनिक हिन्दी है।
- source_word: Τίς ἄξιος
  choice: योग्य कौन है
  rationale: ἄξιος किसी गंभीर कार्य को करने की योग्यता और पात्रता व्यक्त करता है। ‘योग्य’ इस अर्थ और प्रसंग के धार्मिक भार दोनों को बनाए रखता है।
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: इस लपेटे हुए ग्रंथ को खोलने
  rationale: βιβλίον सामान्यतः किसी लिखित सामग्री को दर्शा सकता है, पर अनेक मुहरों वाला दृश्य लपेटे हुए ग्रंथ के अनुरूप है। यह हिन्दी में वस्तु के प्राचीन रूप को स्पष्ट करता है।
- source_word: λῦσαι τὰς σφραγῖδας αὐτοῦ
  choice: उसकी मुहरें तोड़ने
  rationale: λύω का मूल भाव खोलना, ढीला करना या मुक्त करना है। मुहरों के संदर्भ में ‘तोड़ने’ से उन्हें हटाकर ग्रंथ खोलने की ठोस क्रिया स्वाभाविक रूप से व्यक्त होती है।
theological_decisions:
- issue: सिंहासन-कक्ष के दर्शन में βιβλίον का रूप
  choice: लपेटा हुआ ग्रंथ
  alternative: पुस्तक या लिखित दस्तावेज़
  rationale: पहली सदी के परिवेश और अनेक मुहरों वाली वस्तु की छवि लपेटे हुए ग्रंथ से सबसे स्वाभाविक रूप से मेल खाती है। यह ऐतिहासिक-शाब्दिक निर्णय है, कोई संप्रदायगत व्याख्या नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फिर मैंने’ दर्शन के क्रम को स्वाभाविक हिन्दी में जोड़ता है; ‘यह’ घोषणा के प्रत्यक्ष कथन की ओर संकेत करता है।
