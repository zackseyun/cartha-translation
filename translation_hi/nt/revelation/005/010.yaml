id: REV.5.10
reference: Revelation 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐποίησας αὐτοὺς τῷ θεῷ ἡμῶν ⸀βασιλείαν καὶ ἱερεῖς, καὶ ⸀βασιλεύουσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/010.yaml
  text: and you made them a kingdom and priests to our God[b][a], and they reign on the earth.
translation:
  language: hi
  text: और तूने उन्हें हमारे परमेश्वर के लिए एक राज्य[a] और याजक बनाया, और वे पृथ्वी पर राज्य करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “एक राज्य और याजक” के स्थान पर “राजा और याजक” है।
    reason: textual_variant
  - marker: b
    text: कुछ पांडुलिपियों में “राज्य करते हैं” के स्थान पर “राज्य करेंगे” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐποίησας
  choice: तूने … बनाया
  rationale: अओरिस्ट क्रिया को पूर्ण भूतकाल के स्वाभाविक हिन्दी रूप में रखा गया है; संबोधन एकवचन है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह पिछले पद में छुड़ाए गए लोगों की ओर संकेत करने वाला बहुवचन कर्मवाचक सर्वनाम है।
- source_word: τῷ θεῷ ἡμῶν
  choice: हमारे परमेश्वर के लिए
  rationale: सम्प्रदान कारक यहाँ उद्देश्य अथवा समर्पण का भाव देता है; ‘के लिए’ वर्तमान हिन्दी में स्वाभाविक है और सम्बन्ध को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: βασιλείαν
  choice: एक राज्य
  rationale: मूल पाठ में एकवचन संज्ञा है और छुड़ाए गए लोगों को सामूहिक रूप से राज्य बनाए जाने का भाव है।
- source_word: ἱερεῖς
  choice: याजक
  rationale: यह ἱερεύς का मानक धार्मिक हिन्दी प्रतिरूप है और निर्गमन 19:6 तथा प्रकाशितवाक्य 1:6 की प्रतिध्वनि बनाए रखता है।
- source_word: βασιλεύουσιν
  choice: राज्य करते हैं
  rationale: दिए गए SBLGNT पाठ का रूप वर्तमानकाल, कर्तृवाच्य, निर्देशार्थक, तृतीय पुरुष बहुवचन है; इसलिए इसे वर्तमानकाल में अनूदित किया गया है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: ἐπί के साथ सम्बन्धकारक का सीधा स्थानवाचक अर्थ ‘पर’ है; ‘पृथ्वी के ऊपर शासन’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: 'छुड़ाए गए लोगों की पहचान: βασιλείαν'
  choice: एक राज्य
  alternative: राजा
  rationale: प्रस्तुत आलोचनात्मक यूनानी पाठ βασιλείαν (‘राज्य’) पढ़ता है, βασιλεῖς (‘राजा’) नहीं। पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: संतों के राज्य करने का समय
  choice: राज्य करते हैं
  alternative: राज्य करेंगे
  rationale: प्रस्तुत यूनानी रूप βασιλεύουσιν वर्तमानकाल है। भविष्यकालीन पाठांतर को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में दिया गया है, जिससे युगांत-विषयक प्रश्न को अनुवाद द्वारा पहले से तय न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘तू’ प्रत्यक्ष स्तुतिगान में एकवचन संबोधन को सुरक्षित रखता है। ‘एक राज्य और याजक बनाया’ यूनानी की सामूहिक और याजकीय दोहरी पहचान को बिना साम्प्रदायिक व्याख्या जोड़े व्यक्त करता है।
