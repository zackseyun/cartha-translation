  edition: SBLGNT
  text: καὶ οὐδεὶς ἐδύνατο ἐν τῷ ⸀οὐρανῷ ⸂οὐδὲ ἐπὶ τῆς γῆς οὐδὲ⸃ ὑποκάτω τῆς γῆς ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/003.yaml
  text: And no one in heaven or on the earth or under the earth was able to open the scroll or to look at it[a].
translation:
  language: hi
  text: और स्वर्ग में, पृथ्वी पर, या पृथ्वी के नीचे पुस्तक को खोलने या उसे देखने में कोई भी समर्थ न था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδεὶς
  choice: कोई भी ... न था
  rationale: सार्वभौमिक निषेध को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐδύνατο
  choice: समर्थ न था
  rationale: अपूर्णकालीन δύναμαι की भूतकालीन असमर्थता को स्पष्ट रखता है।
- source_word: ἐν τῷ οὐρανῷ ... ἐπὶ τῆς γῆς ... ὑποκάτω τῆς γῆς
  choice: स्वर्ग में, पृथ्वी पर, या पृथ्वी के नीचे
  rationale: मूल पाठ की त्रिस्तरीय ब्रह्मांडीय संरचना और सार्वभौमिक दायरे को बनाए रखता है।
- source_word: ἀνοῖξαι
  choice: खोलने
  rationale: क्रिया का सीधा और संदर्भानुकूल अनुवाद।
- source_word: τὸ βιβλίον
  choice: उस लपेटे हुए पत्र
  rationale: दर्शन के प्राचीन संदर्भ में βιβλίον एक स्क्रोल को दर्शाता है; यह हिन्दी पद वस्तु के रूप को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: οὔτε βλέπειν αὐτό
  choice: या उसे देखने
  rationale: οὔτε से जुड़े दूसरे infinitive का निषेध सुरक्षित रहता है; 'भी' या 'यहाँ तक कि' जोड़कर अनकहे उत्कर्ष को आरोपित नहीं किया गया।
theological_decisions:
- issue: खोलने में असमर्थ लोगों का ब्रह्मांडीय दायरा
  choice: स्वर्ग, पृथ्वी और पृथ्वी के नीचे—तीनों स्थानों को स्पष्ट रूप से बनाए रखना
  alternative: कहीं भी या सारी सृष्टि में
  rationale: मूल की सर्वव्यापकता त्रिस्तरीय स्थानिक चित्र द्वारा व्यक्त होती है; सामान्यीकरण से प्रकाशितवाक्य की दर्शनात्मक छवि मंद पड़ती।
- issue: βλέπειν का आशय
  choice: उसे देखने
  alternative: उसकी जाँच करने / उसमें झाँकने
  rationale: मूल क्रिया व्यापक है; अधिक विशिष्ट हिन्दी विकल्प संदर्भ का अर्थ पहले ही तय कर देते।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। 'लपेटा हुआ पत्र' संस्कृतनिष्ठ 'पत्रकुंडली' तथा अंग्रेज़ी-आधारित 'स्क्रोल' की तुलना में सामान्य पाठक के लिए अधिक स्पष्ट है।
