source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν ᾠδὴν καινὴν λέγοντες· Ἄξιος εἶ λαβεῖν τὸ βιβλίον καὶ ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ, ὅτι ἐσφάγης καὶ ἠγόρασας τῷ ⸀θεῷ ἐν τῷ αἵματί σου ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/009.yaml
  text: And they sing a new song[a], saying, “You are worthy to take the scroll and to open its seals, because you were slain[c][b], and by your blood you purchased for God people from every tribe and language and people and nation,”
translation:
  language: hi
  text: 'और वे एक नया गीत गाते हैं और कहते हैं,


    “आप उस पुस्तक को लेने

    और उसकी मुहरें खोलने के योग्य हैं,

    क्योंकि आपका वध किया गया था,

    और आपने परमेश्वर के लिए[a] अपने लहू से[b]

    हर गोत्र, भाषा, लोग और राष्ट्र में से[c] लोगों[d] को मोल लिया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को।” यूनानी सम्प्रदान कारक का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने लहू के द्वारा।”
    reason: lexical_alternative
  - marker: c
    text: यह चार-खंडीय अभिव्यक्ति मोल लिए गए लोगों के विश्वव्यापी विस्तार पर बल देती है।
    reason: cultural_note
  - marker: d
    text: मूल यूनानी में “लोगों” शब्द व्यक्त नहीं है; वाक्य में कर्म निहित है।
    reason: textual_transparency
lexical_decisions:
- source_word: ᾄδουσιν
  choice: गाते हुए कहते हैं
  rationale: वर्तमानकालीन क्रिया को प्रकाशितवाक्य की सजीव कथन-शैली में रखा गया है; ‘गाते हुए कहते हैं’ गीत के शब्दों को स्वाभाविक हिंदी में प्रस्तुत करता है।
- source_word: ᾠδὴν καινὴν
  choice: एक नया गीत
  rationale: यह सीधा, स्वाभाविक अनुवाद है और बाइबिल में ‘नए गीत’ की अभिव्यक्ति को बनाए रखता है।
- source_word: Ἄξιος εἶ
  choice: आप ... योग्य हैं
  rationale: सम्मानसूचक एकवचन संबोधन आधुनिक हिंदी में स्वाभाविक है और मूल की सीधी स्तुति को बनाए रखता है।
- source_word: τὸ βιβλίον
  choice: पुस्तक-लपेट
  rationale: यहाँ मुहरबंद, लपेटी हुई लिखित सामग्री अभिप्रेत है; ‘पुस्तक-लपेट’ प्राचीन वस्तु को आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: ἀνοῖξαι τὰς σφραγῖδας αὐτοῦ
  choice: उसकी मुहरें खोलने
  rationale: मूल यूनानी में ‘मुहरें खोलना’ है; ‘मुहरें तोड़ना’ संभव अर्थ है, पर वह कुछ अधिक व्याख्यात्मक होता।
- source_word: ἐσφάγης
  choice: आपका वध किया गया था
  rationale: ‘वध’ क्रिया की हिंसक और बलिदान-संबंधी छाया को बनाए रखता है; केवल ‘मार डाला गया’ अपेक्षाकृत सामान्य होता।
- source_word: ἠγόρασας
  choice: मोल लिया है
  rationale: यह क्रिया के मूल क्रय-संबंधी अर्थ को सुरक्षित रखता है; ‘छुड़ा लिया’ अधिक धर्मवैज्ञानिक व्याख्या जोड़ सकता था।
- source_word: τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: सम्प्रदान कारक यहाँ उन लोगों को परमेश्वर के लिए प्राप्त किए जाने का भाव देता है; ‘परमेश्वर को’ भी व्याकरणतः संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: ἐν τῷ αἵματί σου
  choice: अपने लहू से
  rationale: यहाँ ἐν साधन का भाव व्यक्त करता है; ‘अपने लहू से’ आधुनिक हिंदी में स्वाभाविक रहते हुए उसी साधन को स्पष्ट करता है।
- source_word: ἐκ πάσης φυλῆς καὶ γλώσσης καὶ λαοῦ καὶ ἔθνους
  choice: हर गोत्र, भाषा, जनसमुदाय और राष्ट्र में से
  rationale: चारों श्रेणियों और ἐκ के ‘में से’ भाव को बनाए रखा गया है। ‘जनसमुदाय’ λαός को ‘राष्ट्र’ से अलग और आधुनिक हिंदी में बोधगम्य रखता है।
theological_decisions:
- issue: ἠγόρασας का प्रत्यक्ष कर्म मूल यूनानी वाक्य में व्यक्त नहीं है
  choice: अर्थ-स्पष्टता के लिए ‘लोगों’ जोड़ा गया और इसकी सूचना पाद-टिप्पणी में दी गई
  alternative: कर्म को अव्यक्त रखते हुए ‘हर ... में से मोल लिया’ कहना
  rationale: हिंदी में कर्म को पूरी तरह छोड़ना अस्वाभाविक और अस्पष्ट होता। निकटवर्ती संदर्भ मानव समुदाय को निहित कर्म के रूप में स्पष्ट करता है, फिर भी पाद-टिप्पणी मूल की व्याकरणिक स्थिति बताती है।
- issue: ἐν τῷ αἵματί σου में प्रायश्चित-संबंधी भाषा
  choice: ठोस अभिव्यक्ति ‘अपने लहू से’ बनाए रखी गई
  alternative: ‘अपनी मृत्यु के द्वारा’
  rationale: मूल पाठ स्पष्ट रूप से मेम्ने के लहू को मोल लेने का साधन बताता है। इसे सामान्यीकृत करके केवल ‘मृत्यु’ कहना मूल की बलिदान-संबंधी छवि को कम कर देता।
- issue: ईश्वरीय संबोधन का हिंदी सर्वनाम
  choice: सम्मानसूचक ‘आप’
  alternative: परंपरागत निकट एकवचन ‘तू’
  rationale: ‘आप’ आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठकों के लिए स्वाभाविक है; इससे मूल के एकवचन संबोधन का आशय नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक पंक्ति-विन्यास गीत का स्वर उभारता है। ‘पुस्तक-लपेट’, ‘वध’, ‘लहू’ और ‘मोल लिया’ जैसे शब्द मूल की ठोस छवियों और धर्मवैज्ञानिक तनाव को बिना विस्तृत व्याख्या जोड़े सुरक्षित रखते हैं।
