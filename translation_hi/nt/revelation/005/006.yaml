source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐν μέσῳ τοῦ θρόνου καὶ τῶν τεσσάρων ζῴων καὶ ἐν μέσῳ τῶν πρεσβυτέρων ἀρνίον ⸀ἑστηκὸς ὡς ἐσφαγμένον, ⸀ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά, ⸀οἵ εἰσιν τὰ ἑπτὰ πνεύματα τοῦ θεοῦ, ⸀ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/006.yaml
  text: And I saw[a], in the midst of the throne and of the four living creatures, and in the midst of the elders, a Lamb standing as though it had been slain, having seven horns and seven eyes[b], which are the seven Spirits of God sent out into all the earth.
translation:
  language: hi
  text: फिर मैंने सिंहासन और चारों जीवित प्राणियों के बीच में, और प्राचीनों के बीच में, एक मेमने को खड़ा हुआ देखा, मानो उसका वध किया गया हो[a]। उसके सात सींग और सात आँखें थीं, जो परमेश्वर की सात आत्माएँ हैं[b], जिन्हें सारी पृथ्वी में भेजा गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक अक्षरशः: “वध किया हुआ-सा” या “मानो बलि चढ़ाया गया हो।”'
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर की सात आत्माएँ” पद को मूल रूप में रखा गया है; कुछ इसे पवित्र आत्मा की सात गुनी परिपूर्णता का प्रतीक मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν μέσῳ ... καὶ ... ἐν μέσῳ
  choice: के बीच में ... और ... के बीच में
  rationale: यूनानी की दोहराई गई स्थान-सूचक रचना को बनाए रखता है और दर्शन में मेमने की स्थिति को अनावश्यक रूप से सरल नहीं करता।
- source_word: ζῴων
  choice: जीवित प्राणियों
  rationale: यहाँ साधारण पशु नहीं, बल्कि सिंहासन के पास के स्वर्गीय प्राणी अभिप्रेत हैं; इसलिए यह पद संदर्भानुकूल और स्पष्ट है।
- source_word: πρεσβυτέρων
  choice: प्राचीनों
  rationale: प्रकाशितवाक्य में यह एक पहचाने हुए स्वर्गीय समूह की उपाधि है; ‘प्राचीन’ हिन्दी बाइबलीय प्रयोग में गरिमापूर्ण और सुबोध है।
- source_word: ἀρνίον
  choice: मेमना
  rationale: यह बलिदान और मसीही प्रतीक-चित्र को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἑστηκὸς
  choice: खड़ा
  rationale: पूर्ण कृदन्त मेमने की वर्तमान खड़ी अवस्था दिखाता है; हिन्दी में ‘खड़ा देखा’ इस दृश्य को सहज रूप से व्यक्त करता है।
- source_word: ὡς ἐσφαγμένον
  choice: मानो उसका वध किया गया हो
  rationale: ‘मानो’ तुलना अथवा दिखाई देने की दशा को और ‘वध किया गया हो’ हिंसक-बलिदानी मृत्यु तथा उसके बने हुए चिह्न को व्यक्त करता है।
- source_word: ἔχων κέρατα ἑπτὰ καὶ ὀφθαλμοὺς ἑπτά
  choice: उसके सात सींग और सात आँखें थीं
  rationale: हिन्दी में स्वाभाविक वर्णन देते हुए दोनों प्रतीकात्मक अंगों को बिना व्याख्यात्मक रूपांतरण के अक्षरशः रखता है।
- source_word: οἵ εἰσιν
  choice: ये ... हैं
  rationale: निकटतम पूर्वपद ‘सात आँखें’ के साथ पहचान को स्पष्ट रखता है और यूनानी संबंधवाचक उपवाक्य का अर्थ सहज हिन्दी में देता है।
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: परमेश्वर की सात आत्माएँ
  rationale: विवादित और धर्मवैज्ञानिक रूप से गहन बहुवचन को किसी एक व्याख्या, जैसे ‘सात गुना आत्मा’, में बदले बिना मूल रूप में सुरक्षित रखता है।
- source_word: ἀπεσταλμένοι εἰς πᾶσαν τὴν γῆν
  choice: जिन्हें सारी पृथ्वी में भेजा गया है
  rationale: निष्क्रिय बहुवचन और विश्वव्यापी क्षेत्र दोनों को स्पष्ट, वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘जो परमेश्वर की सात आत्माएँ हैं’ का पूर्वपद
  choice: इस पहचान को निकटतम पद ‘सात आँखें’ से जोड़ा गया है।
  alternative: इसे सींगों और आँखों दोनों से अधिक ढीले रूप में जोड़ना।
  rationale: व्याकरण और जकर्याह की आँखों वाली पृष्ठभूमि के अनुसार ‘सात आँखें’ अधिक स्वाभाविक पूर्वपद है; अनुवाद पाठ से आगे कोई प्रतीकात्मक व्याख्या नहीं जोड़ता।
- issue: ‘परमेश्वर की सात आत्माएँ’ का अर्थ
  choice: बहुवचन पद को ज्यों का त्यों रखा गया है।
  alternative: ‘परमेश्वर का सात गुना आत्मा’ या ‘परमेश्वर का आत्मा अपनी सात गुनी परिपूर्णता में’।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘सात आत्माएँ’ कहता है। इसे सीधे पवित्र आत्मा की सात गुनी परिपूर्णता कह देना वास्तविक व्याख्यात्मक तनाव को समाप्त कर देगा, इसलिए संभावित त्रिएकार्थ का न निषेध किया गया है, न उसे पाठ में आरोपित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। प्रकाशितवाक्य की प्रतीकात्मक छवियाँ—मेमना, सात सींग, सात आँखें और सात आत्माएँ—व्याख्यात्मक सरलीकरण के बिना सुरक्षित रखी गई हैं।
