  text: καὶ ⸀ἐγὼ ἔκλαιον πολὺ ὅτι οὐδεὶς ἄξιος εὑρέθη ἀνοῖξαι τὸ βιβλίον οὔτε βλέπειν αὐτό·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/005/004.yaml
  text: And I was weeping greatly because no one was found worthy to open the scroll or to look into it.
translation:
  language: hi
  text: और मैं बहुत रो रहा था, क्योंकि उस पुस्तक[a] को खोलने या उसे देखने[b] के योग्य कोई भी नहीं पाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस स्क्रॉल को।” यूनानी शब्द βιβλίον का अर्थ “पुस्तक” या “स्क्रॉल” हो सकता है; इस संदर्भ में स्क्रॉल अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ केवल उसे देखना हो सकता है; संदर्भ में उसकी विषय-वस्तु को देखने का भाव भी संभव है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: καὶ ἐγώ
  choice: और मैं
  rationale: καί कथा को आगे जोड़ता है और व्यक्त ἐγώ यूहन्ना पर हल्का बल देता है; ‘और मैं’ दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἔκλαιον πολὺ
  choice: बहुत रो रहा था
  rationale: ἔκλαιον का अपूर्णकाल अतीत में जारी क्रिया दिखाता है और πολὺ उसकी तीव्रता बढ़ाता है; यह हिन्दी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह यूहन्ना के रोने का कारण प्रस्तुत करता है।
- source_word: οὐδεὶς ἄξιος εὑρέθη
  choice: योग्य कोई नहीं पाया गया
  rationale: यह यूनानी के निषेध, ἄξιος की गरिमा और εὑρέθη के कर्मवाच्य को सुरक्षित रखता है।
- source_word: ἀνοῖξαι τὸ βιβλίον
  choice: उस पुस्तक को खोलने
  rationale: ἀνοῖξαι का सीधा अर्थ ‘खोलना’ है। βιβλίον पुस्तक या लपेटी हुई पुस्तक, दोनों का बोध करा सकता है; मुख्य पाठ में सहज हिन्दी ‘पुस्तक’ रखी गई है और सांस्कृतिक रूप का संकेत पादटिप्पणी में है।
- source_word: οὔτε βλέπειν αὐτό
  choice: या उसे देखने
  rationale: βλέπειν αὐτό का निकटतम और जानबूझकर अस्पष्ट हिन्दी रूप ‘उसे देखने’ है; यह केवल बाहर से देखने और उसकी सामग्री देखने, दोनों संभावनाओं को समय से पहले तय नहीं करता।
theological_decisions:
- issue: स्वर्गीय सिंहासन-कक्ष में ἄξιος का आशय
  choice: ‘योग्य’
  alternative: ‘सक्षम’ या ‘उपयुक्त’
  rationale: यह केवल कार्य-कौशल नहीं, बल्कि परमेश्वर के उद्देश्य को पूरा करने की गरिमा और पात्रता का भार बनाए रखता है, बिना पाठ का विस्तार किए।
- issue: प्रकाशितवाक्य 5 में βιβλίον का रूप
  choice: मुख्य पाठ में ‘पुस्तक’, पादटिप्पणी में ‘लपेटा हुआ ग्रंथ’
  alternative: मुख्य पाठ में ‘लपेटा हुआ ग्रंथ’
  rationale: βιβλίον का सामान्य अर्थ ‘पुस्तक’ है, जबकि दृश्य की प्राचीन वस्तु सम्भवतः लपेटी हुई पुस्तक है। मुख्य पाठ और पादटिप्पणी मिलकर शब्दार्थ तथा सांस्कृतिक चित्र दोनों बचाते हैं।
- issue: βλέπειν αὐτό की सीमा
  choice: ‘उसे देखने’
  alternative: ‘उसके भीतर देखने’ या ‘उसकी विषय-वस्तु देखने’
  rationale: यूनानी में ‘भीतर’ स्पष्ट नहीं है। सरल रूप मूल की वास्तविक अस्पष्टता को बनाए रखता है और सन्दर्भ से सम्भव गहरे आशय को पादटिप्पणी में बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। अपूर्णकाल को ‘रो रहा था’ से, तीव्रता को ‘बहुत’ से और कर्मवाच्य को ‘पाया गया’ से सुरक्षित रखा गया है।
