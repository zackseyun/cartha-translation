base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/003.yaml
  text: saying[a], “Do not harm the earth or the sea or the trees until we have sealed the servants of our God on their foreheads.”
translation:
  language: hi
  text: यह कहते हुए, “पृथ्वी, समुद्र या पेड़ों को हानि न पहुँचाओ, जब तक कि हम हमारे परमेश्वर के दासों[a] के माथों पर मुहर न लगा दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों।” यूनानी शब्द दूलोस उन लोगों को सूचित कर सकता है जो किसी स्वामी के अधिकार में और उससे बँधे होते हैं; “दासों” उस भाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत को स्वाभाविक हिन्दी में रखते हुए पिछले पद की क्रिया से इसका संबंध बनाए रखता है।
- source_word: ἀδικήσητε
  choice: कोई हानि न पहुँचाना
  rationale: पृथ्वी, समुद्र और पेड़ इसके कर्म हैं, इसलिए यहाँ नैतिक अन्याय नहीं बल्कि भौतिक क्षति का अर्थ प्रमुख है।
- source_word: γῆν
  choice: पृथ्वी
  rationale: ‘पृथ्वी, समुद्र और पेड़’ की व्यापक प्रलय-दृश्य वाली त्रयी में ‘पृथ्वी’ उपयुक्त है; केवल किसी स्थानीय ‘भूमि’ तक अर्थ सीमित नहीं किया गया।
- source_word: θάλασσαν
  choice: समुद्र
  rationale: मूल शब्द का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: δένδρα
  choice: पेड़ों
  rationale: सामान्य आधुनिक हिन्दी में बहुवचन का सीधा अनुवाद।
- source_word: ἄχρι
  choice: जब तक … तब तक
  rationale: 'निषेध की समय-सीमा स्पष्ट करता है: मुहर लगाने का काम पूरा होने तक हानि रोकी जानी है।'
- source_word: σφραγίσωμεν
  choice: हम … मुहर न लगा दें
  rationale: अओरिस्ट सब्जंक्टिव की पूर्ण घटना को हिन्दी के ‘जब तक … न … दें’ विन्यास से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: δούλους
  choice: दासों
  rationale: ‘दास’ स्वामी से बँधे होने और उसके अधिकार में होने की धारणा को ‘सेवक’ से अधिक स्पष्ट रूप से बनाए रखता है; यहाँ मुहर परमेश्वर से संबंध और अपनत्व को चिह्नित करती है।
- source_word: τοῦ θεοῦ ἡμῶν
  choice: अपने परमेश्वर के
  rationale: वक्ता-समूह के ‘हमारे परमेश्वर’ संबंध को स्वाभाविक हिन्दी में ‘हम अपने परमेश्वर के…’ से व्यक्त किया गया है।
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: उनके माथों पर
  rationale: मुहर के स्थान को सटीक और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रकाशितवाक्य के स्वामित्व और संबंध के प्रसंग में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: इस दृश्य में मुहर लगाए जाने वाले लोग परमेश्वर के अधिकार और उससे संबंध रखने वाले हैं। ‘दास’ मूल शब्द के बँधे स्वामित्व का बल बचाता है, जबकि ‘सेवक’ अधिक कोमल और कार्य-केंद्रित विकल्प है; विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आज्ञा के निषेध को ‘हानि न पहुँचाना’ और समय-सीमा को ‘जब तक…तब तक’ से स्पष्ट किया गया है। ‘दास’ जानबूझकर मूल के स्वामित्व-संबंधी बल को सुरक्षित रखता है, और ‘सेवक’ पादटिप्पणी में दिया गया है।
