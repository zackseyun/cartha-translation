  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτό εἰσιν ἐνώπιον τοῦ θρόνου τοῦ θεοῦ, καὶ λατρεύουσιν αὐτῷ ἡμέρας καὶ νυκτὸς ἐν τῷ ναῷ αὐτοῦ, καὶ ὁ καθήμενος ἐπὶ ⸂τοῦ θρόνου⸃ σκηνώσει ἐπ’ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/015.yaml
  text: For this reason they are before the throne of God[a], and they serve him day and night in his temple, and the one seated on the throne will spread his tent over them.
translation:
  language: hi
  text: इसी कारण वे परमेश्वर के सिंहासन के सामने हैं और उसके मन्दिर में दिन-रात उसकी सेवा करते हैं; और जो सिंहासन पर विराजमान है, वह उनके ऊपर अपना तम्बू तानेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके ऊपर निवास करेगा” अथवा “उन्हें अपनी छाया में रखेगा।” यूनानी क्रिया तम्बू या निवास-स्थान की छवि से जुड़ी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτό
  choice: इसी कारण
  rationale: यह पद पिछले कथन के कारणात्मक निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह सिंहासन के सम्मुख और उसकी उपस्थिति में होने के स्थानिक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: λατρεύουσιν
  choice: सेवा करते हैं
  rationale: मन्दिर के संदर्भ में यह परमेश्वर को दी जाने वाली उपासना-संबंधी पवित्र सेवा का व्यापक अर्थ बनाए रखता है।
- source_word: ἡμέρας καὶ νυκτὸς
  choice: दिन-रात
  rationale: मूल की सतत सेवा वाली स्पष्ट और स्वाभाविक अभिव्यक्ति सुरक्षित रहती है।
- source_word: ναῷ
  choice: मन्दिर
  rationale: यह ναός के पवित्रस्थान/मन्दिर वाले अर्थ को सामान्य पाठक के लिए परिचित शब्द में व्यक्त करता है।
- source_word: ὁ καθήμενος ἐπὶ τοῦ θρόνου
  choice: जो सिंहासन पर विराजमान है
  rationale: ‘विराजमान’ राजकीय गरिमा और निरंतर आसनस्थ होने के भाव को स्वाभाविक, सम्मानपूर्ण हिन्दी में रखता है।
- source_word: σκηνώσει ἐπ’ αὐτούς
  choice: उनके ऊपर अपना तम्बू तानेगा
  rationale: यह σκηνόω की तम्बू/निवास की छवि और ἐπί के ‘ऊपर’ भाव को बनाए रखते हुए सुरक्षादायक दिव्य उपस्थिति का संकेत देता है।
theological_decisions:
- issue: σκηνώσει में दिव्य उपस्थिति और तम्बू की छवि
  choice: उनके ऊपर अपना तम्बू तानेगा
  alternative: उनके ऊपर निवास करेगा; उन्हें अपनी छाया में रखेगा
  rationale: मुख्य पाठ तम्बू और परमेश्वर की सुरक्षादायक उपस्थिति की वाचा-संबंधी छवि को सुरक्षित रखता है, पर किसी अतिरिक्त सिद्धान्तगत निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप; ‘मन्दिर’, ‘सेवा’ और ‘तम्बू तानेगा’ जैसे परिचित शब्दों से मूल की उपासना तथा निवास की छवि सुरक्षित रखी गई है।
