source:
  edition: SBLGNT
  text: καὶ κράζουσι φωνῇ μεγάλῃ λέγοντες· Ἡ σωτηρία τῷ θεῷ ἡμῶν τῷ καθημένῳ ἐπὶ τῷ θρόνῳ καὶ τῷ ἀρνίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/010.yaml
  text: And they cry out with a loud voice[a], saying, “Salvation belongs to our God, who sits on the throne, and to the Lamb!”
translation:
  language: hi
  text: और वे ऊँचे स्वर में पुकारते हैं, “उद्धार हमारे परमेश्वर का है, जो सिंहासन पर विराजमान है, और मेम्ने का भी!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κράζουσι
  choice: पुकारकर कहते हैं
  rationale: वर्तमानकालीन क्रिया दृश्य की सजीव और निरंतर क्रिया को व्यक्त करती है। ‘पुकारकर’ κράζω की प्रबलता बनाए रखता है, और ‘कहते हैं’ सहभागी λέγοντες द्वारा कथन की विषयवस्तु का स्वाभाविक परिचय देता है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: रीति/साधन सूचक दत्तिव का यह स्वाभाविक आधुनिक हिन्दी रूप है और आवाज़ की छवि को बनाए रखता है।
- source_word: Ἡ σωτηρία
  choice: उद्धार ... का है
  rationale: मूल यूनानी में यह क्रियारहित जयघोष है। हिन्दी में ‘का है’ दत्तिव द्वारा किए गए श्रेयारोपण को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है, बिना इसे केवल विजय तक सीमित किए।
- source_word: τῷ θεῷ ἡμῶν
  choice: हमारे परमेश्वर का
  rationale: यह दत्तिव उद्धार का श्रेय हमारे परमेश्वर को देता है। हिन्दी संबंधकारक निर्माण उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: जो सिंहासन पर विराजमान है
  rationale: यह सहभागी पद ‘हमारे परमेश्वर’ का समानाधिकरणात्मक वर्णन है। ‘विराजमान’ राजकीय-सिंहासन के प्रसंग में गरिमापूर्ण और सहज है।
- source_word: τῷ ἀρνίῳ
  choice: मेम्ने का भी
  rationale: ἀρνίον प्रकाशितवाक्य में यीशु की स्थापित उपाधि है। ‘मेम्ना’ बलिदानी और मसीही बिंब को सुरक्षित रखता है; ‘भी’ संयुक्त श्रेयारोपण को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: उद्धार का परमेश्वर और मेम्ने से संबंध
  choice: उद्धार का श्रेय संयुक्त रूप से हमारे परमेश्वर और मेम्ने को दिया गया है।
  alternative: 'अधिक शब्दशः: ‘उद्धार हमारे परमेश्वर को ... और मेम्ने को!’'
  rationale: यूनानी दत्तिव रचना उद्धार को परमेश्वर और मेम्ने दोनों से संयुक्त रूप से जोड़ती है, पर उसका कोई अधिक संकीर्ण धर्मवैज्ञानिक अर्थ निर्धारित नहीं करती। हिन्दी ‘का है ... और ... का भी’ इस उच्च मसीह-विषयक और उपासना-संबंधी बल को स्वाभाविक रूप से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सार्वजनिक उपासना योग्य, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परमेश्वर’, ‘सिंहासन’, ‘विराजमान’ और ‘मेम्ना’ प्रकाशितवाक्य की राजकीय तथा बलिदानी छवियों को बनाए रखते हैं।
