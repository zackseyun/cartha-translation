id: REV.7.12
reference: Revelation 7:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγοντες· Ἀμήν· ἡ εὐλογία καὶ ἡ δόξα καὶ ἡ σοφία καὶ ἡ εὐχαριστία καὶ ἡ τιμὴ καὶ ἡ δύναμις καὶ ἡ ἰσχὺς τῷ θεῷ ἡμῶν εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/012.yaml
  text: saying[a], “Amen! The blessing and the glory and the wisdom and the thanksgiving and the honor and the power and the might be to our God forever and ever. Amen.”
translation:
  language: hi
  text: वे कह रहे थे, “आमीन! आशीष और महिमा और बुद्धि और धन्यवाद और आदर और सामर्थ्य और बल हमारे परमेश्वर को युगानुयुग[a] प्राप्त हों। आमीन!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “युगों के युगों तक।”'
    reason: मूल यूनानी कालवाचक मुहावरे का अधिक शब्दशः रूप बताने के लिए।
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान सक्रिय कृदंत बहुवचन है, जो जयघोष की विषय-वस्तु का परिचय देता है। आधुनिक हिन्दी में स्वतंत्र पद के आरम्भ पर ‘वे कह रहे थे’ स्वाभाविक है और जारी वाणी का भाव बनाए रखता है।
- source_word: Ἀμήν / ἀμήν
  choice: आमीन
  rationale: आराधना और स्तुतिगान के प्रसंग में प्रचलित लिप्यंतरण रखा गया है; दोनों बार इसका प्रयोग स्तुतिगान को आरम्भ और समाप्त करता है।
- source_word: ἡ εὐλογία
  choice: आशीष
  rationale: ईश्वर को समर्पित सात अंगों वाले स्तुतिगान में εὐλογία का मूल अर्थ बनाए रखता है; इसे केवल ‘स्तुति’ कहने से अर्थ कुछ संकुचित हो जाता।
- source_word: ἡ δόξα
  choice: महिमा
  rationale: स्तुतिगान के प्रसंग में δόξα का मानक और स्वाभाविक हिन्दी पर्याय।
- source_word: ἡ σοφία
  choice: बुद्धि
  rationale: σοφία के संज्ञानात्मक और ईश्वरीय गुण के भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡ εὐχαριστία
  choice: धन्यवाद
  rationale: संज्ञा रूप और आराधना में कृतज्ञता व्यक्त करने का भाव सुरक्षित रहता है।
- source_word: ἡ τιμή
  choice: आदर
  rationale: यहाँ आर्थिक मूल्य नहीं, बल्कि परमेश्वर को दिया जाने वाला सम्मान अभिप्रेत है।
- source_word: ἡ δύναμις
  choice: सामर्थ्य
  rationale: क्षमता और प्रभावकारी शक्ति का भाव व्यक्त करता है तथा निकटार्थी ἰσχύς से भेद बनाए रखता है।
- source_word: ἡ ἰσχύς
  choice: बल
  rationale: दृढ़ शक्ति का भाव देता है और δύναμις के साथ प्रयुक्त दो निकटार्थी शब्दों की आलंकारिक पूर्णता को सुरक्षित रखता है।
- source_word: τῷ θεῷ ἡμῶν
  choice: हमारे परमेश्वर के हों
  rationale: यूनानी में क्रियाहीन सम्प्रदान कारक द्वारा अर्पण या संबंध व्यक्त हुआ है। हिन्दी में ‘के हों’ जोड़कर वाक्य पूरा किया गया है, पर इसे किसी अधिक विशिष्ट स्वामित्व-सिद्धांत में नहीं बदला गया।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: अनन्त अवधि बताने वाली यूनानी अभिव्यक्ति का संक्षिप्त, प्रतिष्ठित और सहज हिन्दी रूप।
theological_decisions:
- issue: क्रियाहीन स्तुतिगान में निहित क्रिया की पूर्ति
  choice: हमारे परमेश्वर के ... हों
  alternative: हमारे परमेश्वर को ... मिलते रहें
  rationale: मूल यूनानी में स्पष्ट क्रिया नहीं है। ‘हों’ आराधनापूर्ण अर्पण और संबंध दोनों की गुंजाइश रखता है; ‘मिलते रहें’ बुद्धि, सामर्थ्य और बल के विषय में यह अनचाहा अर्थ दे सकता है कि परमेश्वर में ये पहले से नहीं हैं।
- issue: δύναμις और ἰσχύς में भेद
  choice: सामर्थ्य ... बल
  alternative: शक्ति ... सामर्थ्य
  rationale: दोनों निकटार्थी शब्दों को अलग हिन्दी शब्दों से प्रस्तुत किया गया है, ताकि स्तुतिगान की सात अंगों वाली संरचना और अर्थ की प्रचुरता बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक आराधना में सहज सुनाई देने वाली रखी गई है। यूनानी में प्रत्येक संज्ञा के साथ आए निश्चित उपपद का हिन्दी में पृथक रूप नहीं है; बार-बार आए καί को ‘और’ के रूप में बनाए रखकर सात अंगों वाले जयघोष की लय सुरक्षित की गई है।
