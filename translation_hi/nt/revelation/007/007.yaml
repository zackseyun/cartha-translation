source:
  edition: SBLGNT
  text: ἐκ φυλῆς Συμεὼν δώδεκα χιλιάδες, ἐκ φυλῆς Λευὶ δώδεκα χιλιάδες, ἐκ φυλῆς Ἰσσαχὰρ δώδεκα χιλιάδες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/007.yaml
  text: from the tribe of Simeon[a], twelve thousand; from the tribe of Levi, twelve thousand; from the tribe of Issachar, twelve thousand.
translation:
  language: hi
  text: शिमोन के गोत्र से[a] बारह हज़ार; लेवी के गोत्र से बारह हज़ार; इस्साकार के गोत्र से बारह हज़ार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शिमोन के गोत्र में से ... लेवी के गोत्र में से ... इस्साकार के गोत्र में से।’
    reason: ἐκ के स्रोत/उद्गम सूचक अर्थ का अधिक शाब्दिक हिन्दी विकल्प।
lexical_decisions:
- source_word: ἐκ
  choice: से
  rationale: यह स्रोत या उद्गम को स्वाभाविक हिन्दी में व्यक्त करता है और सूची की दोहराई गई संरचना को बनाए रखता है।
- source_word: φυλῆς
  choice: गोत्र
  rationale: इस्राएल के वंशगत जनजातीय विभाग के लिए ‘गोत्र’ प्रचलित और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: Συμεὼν
  choice: शिमोन
  rationale: नाम को मानक हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
- source_word: δώδεκα χιλιάδες
  choice: बारह हज़ार
  rationale: मूल की संख्या को साहित्यिक प्रवाह के अनुरूप शब्दों में रखा गया है।
- source_word: Λευὶ
  choice: लेवी
  rationale: यूनानी पाठ में लेवी स्पष्ट रूप से सूचीबद्ध है; इसलिए बिना व्याख्यात्मक विस्तार के मानक नाम रखा गया है।
- source_word: Ἰσσαχὰρ
  choice: इस्साकार
  rationale: नाम को मानक हिन्दी बाइबलीय वर्तनी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: गोत्रों की सूची की दोहरावपूर्ण वाक्य-संरचना
  choice: हर गोत्र के साथ ‘के गोत्र से बारह हज़ार’ की संरचना दोहराई गई है।
  alternative: ‘शिमोन, लेवी और इस्साकार के गोत्रों से बारह-बारह हज़ार’ कहकर संक्षिप्त करना।
  rationale: यूनानी पाठ प्रत्येक गोत्र के लिए सूत्र को दोहराता है। यह लय प्रकाशन-साहित्य की औपचारिक गणना का अंग है और इसे बनाए रखना स्रोत के अधिक निकट है।
- issue: गोत्रों की गणना में लेवी का समावेश
  choice: मुख्य पाठ में लेवी का नाम बिना किसी व्याख्यात्मक जोड़ के रखा गया है।
  alternative: लेवी के असामान्य समावेश की व्याख्या मुख्य पाठ में जोड़ना।
  rationale: पद केवल लेवी को सूची में रखता है; कोई स्पष्टीकरण जोड़ना स्रोत से परे व्याख्या आरोपित करेगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। अर्धविरामों और दोहराव द्वारा मूल सूची की औपचारिक लय सुरक्षित रखी गई है।
