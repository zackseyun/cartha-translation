id: REV.7.8
reference: Revelation 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐκ φυλῆς Ζαβουλὼν δώδεκα χιλιάδες, ἐκ φυλῆς Ἰωσὴφ δώδεκα χιλιάδες, ἐκ φυλῆς Βενιαμὶν δώδεκα χιλιάδες ⸀ἐσφραγισμένοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/008.yaml
  text: from the tribe of Zebulun[a], twelve thousand; from the tribe of Joseph, twelve thousand; from the tribe of Benjamin, twelve thousand, having been sealed.
translation:
  language: hi
  text: जबूलून के गोत्र में से बारह हज़ार; यूसुफ के गोत्र में से बारह हज़ार; बिन्यामीन के गोत्र में से बारह हज़ार—जिन पर मुहर लगाई गई थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ φυλῆς
  choice: के गोत्र में से
  rationale: यह पदबंध किसी इस्राएली गोत्र से उद्भव या संबंध बताता है। ‘के गोत्र में से’ आधुनिक हिंदी में स्वाभाविक है और सूची में दोहराए गए यूनानी सूत्र को बनाए रखता है।
- source_word: Ζαβουλών
  choice: जबूलून
  rationale: इस गोत्रनाम का प्रचलित हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: δώδεκα χιλιάδες
  choice: बारह हज़ार
  rationale: यूनानी संख्या का सीधा और स्पष्ट अनुवाद सूची की संरचना और गणना को सुरक्षित रखता है।
- source_word: Ἰωσήφ
  choice: यूसुफ
  rationale: मूल पाठ में नाम ‘यूसुफ’ ही है; इसे किसी अन्य गोत्रनाम से बदलकर संभावित वंशावली संबंध की व्याख्या नहीं की गई।
- source_word: Βενιαμίν
  choice: बिन्यामीन
  rationale: इस नाम का मानक और व्यापक रूप से पहचाना जाने वाला हिंदी बाइबलीय रूप अपनाया गया है।
- source_word: ἐσφραγισμένοι
  choice: जिन पर मुहर लगाई गई थी
  rationale: यह पूर्णकालिक कर्मवाच्य कृदंत है। चुना गया रूप मुहर लगाए जाने की पूर्ण क्रिया, उसके परिणामी भाव और कर्मवाच्य बल को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम कृदंत ἐσφραγισμένοι का संबंध और बल
  choice: इसे अंत में सारांशात्मक उपवाक्य ‘जिन पर मुहर लगाई गई थी’ के रूप में रखा गया है, जो सूचीबद्ध लोगों पर लागू होता है।
  alternative: ‘मुहरबंद’ या ‘मुहर लगाए हुए’
  rationale: यूनानी में कृदंत सूची के अंत में आकर गिनाए गए समूहों का सार प्रस्तुत करता है। हिंदी में संबंधवाचक बहुवचन रूप उसके व्यापक संदर्भ और कर्मवाच्य पूर्णता को स्पष्ट करता है, पर मुहर के स्वरूप या धार्मिक अर्थ को अतिरिक्त रूप से परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-सुलभ रखी गई है। अर्धविरामों से यूनानी की आवर्ती संरचना सुरक्षित रहती है, जबकि अंतिम डैश सारांशात्मक कृदंत को स्पष्ट रूप से जोड़ता है।
