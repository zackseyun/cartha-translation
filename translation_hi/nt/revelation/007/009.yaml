source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ ὄχλος πολύς, ὃν ἀριθμῆσαι ⸀αὐτὸν οὐδεὶς ἐδύνατο, ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν, ⸀ἑστῶτες ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου, περιβεβλημένους στολὰς λευκάς, καὶ ⸀φοίνικες ἐν ταῖς χερσὶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/009.yaml
  text: After these things I looked[a], and behold, a great multitude that no one was able to count, from every nation and tribe and people and language, standing before the throne and before the Lamb, clothed in white robes, with palm branches in their hands.
translation:
  language: hi
  text: इन बातों के बाद मैंने देखा, और देखो, एक बड़ी भीड़ थी, जिसे कोई गिन नहीं सकता था—हर राष्ट्र, कुल, जाति और भाषा में से आए हुए लोग—जो सिंहासन के सामने और मेम्ने के सामने खड़े थे, सफेद वस्त्र पहने हुए थे और जिनके हाथों में खजूर की डालियाँ थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह बहुवचन ταῦτα और प्रकाशितवाक्य में दर्शनों के क्रम—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: εἶδον, καὶ ἰδοὺ
  choice: मैंने देखा, और देखो
  rationale: ‘देखा’ εἶδον का सीधा अर्थ देता है और ‘देखो’ ἰδού की ध्यान आकर्षित करने वाली शक्ति को बनाए रखता है।
- source_word: ὄχλος πολύς
  choice: एक बड़ी भीड़
  rationale: यह साधारण आधुनिक हिन्दी में विशाल जनसमूह का भाव स्पष्ट करता है और दृश्य की भव्यता बनाए रखता है।
- source_word: ὃν ἀριθμῆσαι αὐτὸν οὐδεὶς ἐδύνατο
  choice: जिसे कोई गिन नहीं सकता था
  rationale: यह यूनानी वाक्यांश में निहित असमर्थता को सहज और सटीक हिन्दी में व्यक्त करता है।
- source_word: ἐκ παντὸς ἔθνους καὶ φυλῶν καὶ λαῶν καὶ γλωσσῶν
  choice: हर राष्ट्र और कुलों और जातियों और भाषाओं में से
  rationale: यह ἔθνους के एकवचन और उसके बाद आए बहुवचन φυλῶν, λαῶν और γλωσσῶν के वास्तविक व्याकरणिक बदलाव को जानबूझकर सुरक्षित रखता है।
- source_word: ἑστῶτες
  choice: वे ... खड़े थे
  rationale: हिन्दी में स्पष्ट कर्ता सहित यह कृदन्त का स्वाभाविक रूपान्तरण है और भीड़ के बहुवचन सदस्यों को सूचित करता है।
- source_word: ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τοῦ ἀρνίου
  choice: सिंहासन के सामने और मेम्ने के सामने
  rationale: ‘सामने’ की पुनरावृत्ति यूनानी में ἐνώπιον की पुनरावृत्ति और वाक्य की गंभीर लय को बनाए रखती है।
- source_word: περιβεβλημένους στολὰς λευκάς
  choice: सफेद वस्त्र पहने हुए थे
  rationale: στολή के लिए ‘वस्त्र’ स्पष्ट, गरिमापूर्ण और व्यापक हिन्दी शब्द है; पूरा पदबंध परिधान की अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φοίνικες ἐν ταῖς χερσὶν αὐτῶν
  choice: उनके हाथों में खजूर की डालियाँ थीं
  rationale: यहाँ φοίνικες खजूर के वृक्षों के बजाय उनकी डालियों को सूचित करता है; वाक्य विन्यास मूल चित्र को बिना अतिरिक्त क्रिया आरोपित किए रखता है।
theological_decisions:
- issue: मसीह-संबंधी उपाधि के रूप में ἀρνίον का अनुवाद
  choice: मेम्ना
  alternative: छोटा मेम्ना
  rationale: यद्यपि रूप की उत्पत्ति लघुतासूचक है, प्रकाशितवाक्य में ἀρνίον एक स्थापित मसीह-संबंधी उपाधि है। ‘मेम्ना’ उस धार्मिक भार को रखता है और अनावश्यक रूप से आकार या आयु पर बल नहीं देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। यूनानी के एकवचन ‘राष्ट्र’ से बहुवचन ‘कुलों, जातियों और भाषाओं’ की ओर असामान्य लेकिन वास्तविक शिफ्ट को सहज बनाने के बजाय मुख्य पाठ में संरक्षित किया गया है।
