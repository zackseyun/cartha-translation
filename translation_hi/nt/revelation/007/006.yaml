base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/006.yaml
  text: from the tribe of Asher[a], twelve thousand; from the tribe of Naphtali, twelve thousand; from the tribe of Manasseh, twelve thousand;
translation:
  language: hi
  text: आशेर के गोत्र में से बारह हज़ार[a]; नप्ताली के गोत्र में से बारह हज़ार; मनश्शे के गोत्र में से बारह हज़ार;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अथवा, संदर्भ को अधिक स्पष्ट करते हुए: ‘आशेर के गोत्र में से बारह हज़ार लोगों पर मुहर लगाई गई’ (और आगे के गोत्रों के लिए भी इसी प्रकार)। इस पद के यूनानी पाठ में स्वयं क्रिया दोहराई नहीं गई है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκ
  choice: में से
  rationale: यह संबंधबोधक स्रोत अथवा समूह में से चुने जाने का भाव प्रकट करता है; इस वंश-सूची में ‘गोत्र में से’ स्वाभाविक और सटीक है।
- source_word: φυλῆς
  choice: गोत्र
  rationale: इस्राएल के वंशगत जनसमूह के संदर्भ में φυλή के लिए आधुनिक हिन्दी में मानक और सटीक शब्द ‘गोत्र’ है।
- source_word: Ἀσὴρ
  choice: आशेर
  rationale: इब्रानी बाइबिलीय नाम के प्रचलित हिन्दी रूप का प्रयोग किया गया है।
- source_word: δώδεκα χιλιάδες
  choice: बारह हज़ार
  rationale: मूल में संख्या सीधे दी गई है; पद में अनुपस्थित ‘मुहर लगाई गई’ जैसी क्रिया मुख्य पाठ में नहीं जोड़ी गई।
- source_word: Νεφθαλὶμ
  choice: नप्ताली
  rationale: नाम का प्रचलित हिन्दी बाइबिलीय रूप अपनाया गया है।
- source_word: Μανασσῆ
  choice: मनश्शे
  rationale: नाम का प्रचलित हिन्दी बाइबिलीय रूप अपनाया गया है।
theological_decisions:
- issue: क्या आसपास के संदर्भ से निहित ‘मुहर लगाई गई’ क्रिया को मुख्य पाठ में जोड़ा जाए
  choice: मुख्य पाठ में क्रिया न जोड़कर मूल यूनानी की क्रियारहित गणना-सूची बनाए रखी गई है।
  alternative: ‘आशेर के गोत्र में से बारह हज़ार पर मुहर लगाई गई’ और इसी प्रकार आगे के गोत्रों के लिए भी।
  rationale: मुहर लगाए जाने का विचार पिछले संदर्भ से स्पष्ट है, पर इस पद के यूनानी पाठ में क्रिया दोहराई नहीं गई। संक्षिप्त सूची-रूप मूल की अभिव्यक्ति और उसकी निहितता दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची के रूप में संक्षिप्त रखी गई है। नामों के लिए प्रचलित हिन्दी बाइबिलीय रूप लिए गए हैं; ‘में से’ समूह के भीतर से संख्या लिए जाने का स्वाभाविक भाव देता है।
