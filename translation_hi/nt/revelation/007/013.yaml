review_pass:
  verdict: revise
  source_fidelity: Draft accurately conveys the elder, the group clothed in white robes, and both questions. However, it omits the explicit verb ἀπεκρίθη ('answered/responded'). Although this verb can introduce speech without an immediately preceding question, it should be represented in an optimal-equivalence translation.
  naturalness: The Hindi is clear, modern, and appropriately dignified. ‘प्राचीनों में से एक’ is an established Revelation-register expression, and ‘सफ़ेद चोगे’ naturally conveys robes. ‘उत्तर देकर मुझसे कहा’ is idiomatic enough in this narrative setting and preserves the Greek discourse verb.
  terminology: ‘प्राचीनों’ suitably renders πρεσβυτέρων in this apocalyptic context. ‘सफ़ेद चोगे’ preserves the distinctive garment imagery of στολαὶ λευκαί without adding interpretation. No theological terminology requires change.
  issues:
  - severity: medium
    issue: The translation omits ἀπεκρίθη.
    rationale: The Greek explicitly says that one elder ‘answered’ before the speech participle λέγων. Rendering only ‘ने मुझसे कहा’ loses this source element. ‘उत्तर देकर मुझसे कहा’ retains it without implying a specific unrecorded question.
  revised_text: तब प्राचीनों में से एक ने उत्तर देकर मुझसे कहा, “ये लोग, जो सफ़ेद चोगे पहने हुए हैं—कौन हैं, और कहाँ से आए हैं?”
  revised_footnotes: []
