id: REV.7.13
reference: Revelation 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἀπεκρίθη εἷς ἐκ τῶν πρεσβυτέρων λέγων μοι· Οὗτοι οἱ περιβεβλημένοι τὰς στολὰς τὰς λευκὰς τίνες εἰσὶν καὶ πόθεν ἦλθον;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/013.yaml
  text: Then one of the elders answered[a], saying to me, “These who are clothed in the white robes—who are they, and where have they come from?”
translation:
  language: hi
  text: तब प्राचीनों में से एक ने उत्तर देकर मुझसे कहा, “ये लोग, जो सफ़ेद चोगे पहने हुए हैं—कौन हैं, और कहाँ से आए हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: तब
  rationale: दर्शन के वर्णन में आगे बढ़ते घटनाक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπεκρίθη ... λέγων μοι
  choice: ने मुझसे कहा
  rationale: यूनानी में ‘उत्तर देकर मुझसे कहा’ जैसा मुहावरा है; तत्काल कोई प्रश्न न होने के कारण हिन्दी में शाब्दिक ‘उत्तर दिया’ अस्वाभाविक लगेगा। ‘मुझसे कहा’ कथन और संबोधित व्यक्ति दोनों को सुरक्षित रखता है।
- source_word: εἷς ἐκ τῶν πρεσβυτέρων
  choice: प्राचीनों में से एक
  rationale: समूह में से एक सदस्य के अंशवाची अर्थ को स्पष्ट और प्रचलित बाइबलीय हिन्दी में रखता है।
- source_word: Οὗτοι οἱ περιβεβλημένοι
  choice: ये लोग, जो ... पहने हुए हैं
  rationale: संकेतवाचक सर्वनाम और पूर्ण कृदंत से व्यक्त वर्तमान अवस्था को सहज हिन्दी में बनाए रखता है।
- source_word: τὰς στολὰς τὰς λευκάς
  choice: सफ़ेद चोगे
  rationale: στολή लंबे, विशिष्ट बाहरी वस्त्र को दर्शाता है; ‘चोगे’ प्रकाशितवाक्य की वस्त्र-छवि को सामान्य ‘कपड़ों’ से अधिक स्पष्ट रखता है।
- source_word: τίνες εἰσὶν
  choice: कौन हैं
  rationale: समूह की पहचान पूछने का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πόθεν ἦλθον
  choice: कहाँ से आए हैं
  rationale: πόθεν के उद्गम-संबंधी अर्थ और बीती हुई आगमन-क्रिया के वर्तमान दृश्य से संबंध को स्वाभाविक हिन्दी पूर्ण भूत रूप में व्यक्त करता है।
theological_decisions:
- issue: ἀπεκρίθη का कथात्मक प्रयोग
  choice: ने मुझसे कहा
  alternative: ने उत्तर देकर मुझसे कहा
  rationale: यूनानी ‘उत्तर देना’ बिना तत्काल प्रश्न के भी कथन आरम्भ करने के अर्थ में आ सकता है। हिन्दी में ‘उत्तर’ जोड़ने से ऐसे प्रश्न का आभास होगा जो पाठ में नहीं है; इसलिए अर्थगत कथन को चुना गया, किसी व्याख्यात्मक संबंध को नहीं।
- issue: ἦλθον का काल-पक्ष
  choice: कहाँ से आए हैं
  alternative: कहाँ से आए
  rationale: यूनानी एओरिस्ट बीती घटना बताता है, जबकि हिन्दी का ‘आए हैं’ उस आगमन के वर्तमान दृश्य में प्रासंगिक परिणाम को सहज रूप से व्यक्त करता है। यह शैलीगत चयन है, सिद्धान्तगत नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘प्राचीन’ प्रकाशितवाक्य में πρεσβύτερος के लिए पारंपरिक और संदर्भानुकूल पद है। नुक़्ते सहित ‘सफ़ेद’ सामान्य आधुनिक वर्तनी के अनुसार रखा गया है।
