source:
  edition: SBLGNT
  text: καὶ ⸀εἴρηκα αὐτῷ· Κύριέ μου, σὺ οἶδας. καὶ εἶπέν μοι· Οὗτοί εἰσιν οἱ ἐρχόμενοι ἐκ τῆς θλίψεως τῆς μεγάλης, καὶ ἔπλυναν τὰς στολὰς αὐτῶν καὶ ἐλεύκαναν ⸀αὐτὰς ἐν τῷ αἵματι τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/014.yaml
  text: And I said to him[a], “My lord, you know.” And he said to me, “These are the ones coming out of the great tribulation[b]. They washed their robes and made them white in the blood of the Lamb.”
translation:
  language: hi
  text: 'और मैंने उससे कहा, “मेरे स्वामी, आप ही जानते हैं।”


    उसने मुझसे कहा, “ये वे लोग हैं जो उस महाक्लेश[a] से निकलकर आ रहे हैं। इन्होंने अपने वस्त्र धोए और उन्हें मेम्ने के लहू में[b] उजला कर दिया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस बड़े दुःख” अथवा “उस बड़े संकट।” यूनानी शब्द का अर्थ दबाव, दुःख-कष्ट या क्लेश हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “मेम्ने के लहू में” वाक्यांश को जानबूझकर इसी रूप में रखा गया है। यूनानी का अर्थ साधन के रूप में “मेम्ने के लहू से” भी समझा जा सकता है, पर यहाँ का शब्दांकन प्रकाशितवाक्य में वस्त्रों को लहू में उजला किए जाने के विरोधाभासी बिंब को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκα
  choice: मैंने ... कहा
  rationale: रूप पूर्णकालिक है, पर यूहन्ना की संवादात्मक कथा में यह साधारण भूतकाल की तरह प्रयुक्त हो सकता है; आधुनिक हिन्दी में यही स्वाभाविक है।
- source_word: Κύριέ μου
  choice: मेरे स्वामी
  rationale: यूहन्ना यहाँ परमेश्वर या मसीह को नहीं, एक स्वर्गीय प्राचीन को संबोधित करता है। यह आदर बनाए रखता है, पर संबोधित व्यक्ति की पहचान को अधिक नहीं ठहराता।
- source_word: σὺ οἶδας
  choice: आप ही जानते हैं
  rationale: ‘आप’ आदरपूर्ण संबोधन है और ‘ही’ स्पष्ट सर्वनाम के हल्के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐρχόμενοι
  choice: जो ... निकलकर आ रहे हैं
  rationale: वर्तमान कृदन्त की जारी अथवा चरित्रगत क्रिया को बनाए रखा गया है; इसे साधारण भूतकाल नहीं बनाया गया।
- source_word: ἐκ τῆς θλίψεως τῆς μεγάλης
  choice: उस महाक्लेश से
  rationale: निश्चित पदबंध और θλῖψις के क्लेश/संकट के अर्थ को संक्षेप तथा पहचानने योग्य रूप में रखा गया है, बिना किसी विशिष्ट अंतकालीन प्रणाली को आरोपित किए।
- source_word: ἔπλυναν
  choice: धोए
  rationale: एओरिस्ट क्रिया को पूर्ण, समग्र क्रिया के रूप में साधारण भूतकाल से व्यक्त किया गया है।
- source_word: στολάς
  choice: वस्त्र
  rationale: στολή लंबे या गरिमापूर्ण परिधान को सूचित करता है; ‘वस्त्र’ आधुनिक हिन्दी में स्वाभाविक है और प्रकाशितवाक्य के परिधान-बिंब को बनाए रखता है।
- source_word: ἐλεύκαναν
  choice: उजला किया
  rationale: क्रिया के ‘सफेद/उजला कर देना’ वाले सकर्मक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐν τῷ αἵματι
  choice: लहू में
  rationale: ἐν को ‘में’ से व्यक्त कर लहू में वस्त्र उजले किए जाने का जानबूझकर चौंकाने वाला और विरोधाभासी बिंब सुरक्षित रखा गया है; साधनार्थक ‘से’ की संभावना पादटिप्पणी में दी गई है।
- source_word: τοῦ ἀρνίου
  choice: मेम्ने के
  rationale: प्रकाशितवाक्य में यह यीशु के लिए प्रयुक्त मसीही उपाधि है; ‘मेम्ना’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: प्राचीन को संबोधित करते समय κύριος का अनुवाद
  choice: मेरे स्वामी
  alternative: हे प्रभु; महोदय
  rationale: संदर्भ में संबोधित व्यक्ति स्वर्गीय प्राचीन है, न कि स्पष्ट रूप से परमेश्वर या मसीह। ‘मेरे स्वामी’ श्रद्धापूर्ण है, पर उसकी पहचान को अनावश्यक रूप से ईश्वरीय नहीं बनाता।
- issue: ‘महाक्लेश’ की व्याख्या
  choice: उस महाक्लेश
  alternative: उस बड़े दुःख; उस बड़े संकट
  rationale: पदबंध का शाब्दिक-प्रासंगिक अर्थ रखा गया है और यह तय नहीं किया गया कि इससे केवल कोई विशिष्ट अंतकालीन अवधि, सामान्य विश्वासगत पीड़ा, या दोनों अभिप्रेत हैं।
- issue: लहू द्वारा शुद्धि का बिंब
  choice: मेम्ने के लहू में
  alternative: मेम्ने के लहू से
  rationale: ‘में’ यूनानी पदबंध और प्रकाशितवाक्य के विरोधाभासी बिंब को अधिक सीधे सुरक्षित रखता है, जबकि साधनार्थक अर्थ की संभावना पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘आप’ और ‘मेरे स्वामी’ स्वर्गीय प्राचीन के प्रति आदर व्यक्त करते हैं। ‘महाक्लेश’ परिचित धार्मिक पद है, पर उसके संभावित सामान्य अर्थ पादटिप्पणी में दिए गए हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनके विषयों में असंगति थी; अर्थ के अनुसार [a] को ‘महाक्लेश’ और [b] को ‘लहू में’ के साथ रखा गया है।
