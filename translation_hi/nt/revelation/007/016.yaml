- source_word: ἐπ’ αὐτούς
  choice: उन पर
  rationale: ἐπί के प्रभाव/दिशा संबंध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἥλιος
  choice: सूर्य
  rationale: सीधा और गरिमापूर्ण आधुनिक हिन्दी पर्याय।
- source_word: πᾶν καῦμα
