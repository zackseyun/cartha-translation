  rationale: ‘भूखे होंगे’ के समानांतर सहज हिन्दी अभिव्यक्ति, जो भविष्यकाल और शारीरिक प्यास की ठोस छवि बनाए रखती है।
- source_word: οὐδὲ
  choice: न … न
  rationale: क्रमिक नकारात्मक उपवाक्यों को हिन्दी में स्पष्ट और लयात्मक ढंग से जोड़ता है।
- source_word: οὐδὲ μὴ πέσῃ
