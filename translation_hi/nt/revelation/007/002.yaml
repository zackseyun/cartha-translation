id: REV.7.2
reference: Revelation 7:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶδον ἄλλον ἄγγελον ἀναβαίνοντα ἀπὸ ἀνατολῆς ἡλίου, ἔχοντα σφραγῖδα θεοῦ ζῶντος, καὶ ἔκραξεν φωνῇ μεγάλῃ τοῖς τέσσαρσιν ἀγγέλοις οἷς ἐδόθη αὐτοῖς ἀδικῆσαι τὴν γῆν καὶ τὴν θάλασσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/002.yaml
  text: And I saw another angel coming up from the east[a], having the seal of the living God, and he cried out with a loud voice to the four angels to whom it had been given to harm the earth and the sea,
translation:
  language: hi
  text: और मैंने एक और स्वर्गदूत को पूर्व दिशा से[a] ऊपर आते देखा। उसके पास जीवित परमेश्वर की मुहर थी। उसने उन चार स्वर्गदूतों को ऊँची आवाज़ में पुकारा, जिन्हें पृथ्वी और समुद्र को हानि पहुँचाने की अनुमति दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “सूर्य के उदय की ओर से।”
    reason: मूल यूनानी की अधिक शाब्दिक और बिंबात्मक अभिव्यक्ति को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: एक और स्वर्गदूत
  rationale: ἄλλον पहले बताए गए स्वर्गदूतों से भिन्न एक अतिरिक्त स्वर्गदूत को दर्शाता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀναβαίνοντα
  choice: ऊपर आते
  rationale: यह कृदंत ऊपर की ओर गति व्यक्त करता है; दर्शन देखने वाले की दृष्टि से ‘ऊपर आते’ सहज हिन्दी है।
- source_word: ἀπὸ ἀνατολῆς ἡλίου
  choice: पूर्व दिशा से
  rationale: वाक्यांश का शाब्दिक अर्थ ‘सूर्य के उदय की ओर से’ है, पर यहाँ वह दिशा अर्थात पूर्व बताता है; मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: ἔχοντα σφραγῖδα
  choice: उसके पास ... मुहर थी
  rationale: ἔχω का सामान्य अर्थ ‘पास होना/रखना’ है। यह अनुवाद मुहर के कार्य को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: θεοῦ ζῶντος
  choice: जीवित परमेश्वर की
  rationale: यह प्रचलित बाइबलीय अभिव्यक्ति यूनानी संबंधकारक और विशेषण का बल बनाए रखती है।
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में पुकारा
  rationale: κράζω प्रबल पुकार को और φωνῇ μεγάλῃ उसकी ऊँची ध्वनि को व्यक्त करता है; चुना हुआ रूप वर्तमान हिन्दी में स्वाभाविक है।
- source_word: τοῖς τέσσαρσιν ἀγγέλοις
  choice: उन चार स्वर्गदूतों को
  rationale: निश्चित उपपद और संख्या को हिन्दी में संदर्भसूचक ‘उन चार’ से सहज रूप में व्यक्त किया गया है।
- source_word: οἷς ἐδόθη αὐτοῖς
  choice: जिन्हें ... अधिकार दिया गया था
  rationale: शाब्दिक बनावट ‘जिन्हें ... दिया गया था’ है; हिन्दी में क्रिया के निहित आशय को स्पष्ट करने के लिए ‘अधिकार’ जोड़ा गया है, पर देने वाले का नाम पाठ से बाहर जाकर नहीं बताया गया।
- source_word: ἀδικῆσαι
  choice: हानि पहुँचाने
  rationale: इस सृष्टि-संबंधी संदर्भ में ἀδικέω अन्याय करने की अपेक्षा नुकसान या हानि पहुँचाने का अर्थ देता है।
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: पृथ्वी और समुद्र
  rationale: प्रकाशितवाक्य के व्यापक सृष्टिगत दृश्य में γῆ के लिए ‘पृथ्वी’ उपयुक्त है और θάλασσα का सीधा रूप ‘समुद्र’ है।
theological_decisions:
- issue: ἐδόθη में प्रदत्त अनुमति या अधिकार का स्वरूप
  choice: ‘अधिकार दिया गया था’
  alternative: ‘जिन्हें पृथ्वी और समुद्र को हानि पहुँचाना दिया गया था’ अथवा ‘जिन्हें अनुमति दी गई थी’
  rationale: यूनानी निष्क्रिय क्रिया प्रदत्त सामर्थ्य/अनुमति का संकेत देती है, जबकि देने वाले को स्पष्ट नहीं करती। ‘अधिकार’ हिन्दी में वाक्य को स्वाभाविक बनाता है और प्रतिनिधिक अधिकार का भाव रखता है, पर उसके स्रोत को अनुवाद में नहीं जोड़ता।
- issue: ἀπὸ ἀνατολῆς ἡλίου का दिशात्मक और बिंबात्मक अर्थ
  choice: मुख्य पाठ में ‘पूर्व दिशा से’
  alternative: ‘सूर्य के उदय की ओर से’
  rationale: मुख्य पाठ सामान्य पाठक के लिए दिशात्मक अर्थ स्पष्ट करता है; पादटिप्पणी मूल सूर्य-उदय के बिंब को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। लंबे यूनानी वाक्य को तीन हिन्दी वाक्यों में बाँटा गया है ताकि अर्थ-संबंध स्पष्ट रहे। ‘मुहर’, ‘जीवित परमेश्वर’ और ‘पृथ्वी और समुद्र’ जैसे प्रमुख बाइबलीय बिंब यथावत रखे गए हैं।
