id: REV.7.17
reference: Revelation 7:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι τὸ ἀρνίον τὸ ἀνὰ μέσον τοῦ θρόνου ⸀ποιμανεῖ αὐτούς, καὶ ⸀ὁδηγήσει αὐτοὺς ἐπὶ ζωῆς πηγὰς ὑδάτων· καὶ ἐξαλείψει ὁ θεὸς πᾶν δάκρυον ἐκ τῶν ὀφθαλμῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/017.yaml
  text: because the Lamb in the midst of the throne will shepherd them[a], and he will guide them to springs of the water of life[c][b], and God will wipe away every tear from their eyes.
translation:
  language: hi
  text: क्योंकि सिंहासन के बीच में[a] जो मेमना है, वह उनकी चरवाही करेगा और उन्हें जीवन के जल के सोतों तक ले जाएगा[b][c]; और परमेश्वर उनकी आँखों से हर आँसू पोंछ देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सिंहासन के मध्य में।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी अगुवाई करेगा।’
    reason: lexical_alternative
  - marker: c
    text: या ‘जीवित जल के सोतों तक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρνίον
  choice: मेमना
  rationale: प्रकाशितवाक्य में यह मसीह के लिए प्रयुक्त स्थापित प्रतीकात्मक उपाधि है। ‘मेमना’ बलिदान और मसीहाई अर्थ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνὰ μέσον τοῦ θρόνου
  choice: सिंहासन के बीच में
  rationale: यह सिंहासन के संबंध में मेमने की केंद्रीय स्थिति को दर्शाता है और यूनानी की सजीव स्थान-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: ποιμανεῖ
  choice: उनकी चरवाही करेगा
  rationale: क्रिया का मूल अर्थ चरवाहे की तरह देखभाल और अगुवाई करना है। यह उस अर्थपूर्ण विरोधाभास को सुरक्षित रखता है कि मेमना स्वयं चरवाहे का कार्य करता है।
- source_word: ὁδηγήσει
  choice: उन्हें ... तक ले जाएगा
  rationale: आधुनिक हिन्दी में यह गंतव्य की ओर मार्गदर्शन करने का स्वाभाविक ढंग है। ‘अगुवाई करेगा’ भी संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: ἐπὶ ζωῆς πηγὰς ὑδάτων
  choice: जीवन के जल के सोतों तक
  rationale: ζωῆς को स्वाभाविक रूप से ‘जल’ से संबद्ध मानते हुए ‘जीवन का जल’ रखा गया है; πηγαί के प्राकृतिक जल-स्रोत वाले बिंब के लिए ‘सोते’ चुना गया है।
- source_word: ἐξαλείψει
  choice: पोंछ देगा
  rationale: सांत्वना के इस प्रसंग में यह क्रिया आँसू हटाने की कोमल और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: πᾶν δάκρυον
  choice: हर आँसू
  rationale: एकवचन के साथ πᾶν की समग्रता और व्यक्तिगत मार्मिकता दोनों को व्यक्त करता है।
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: उनकी आँखों से
  rationale: यह यूनानी संबंध का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: मेमने का चरवाहा होना
  choice: ‘मेमना ... उनकी चरवाही करेगा’ के विरोधाभासी बिंब को यथावत रखा गया
  alternative: ‘मेमना ... उनकी देखभाल करेगा’ या ‘उन पर शासन करेगा’
  rationale: पद जानबूझकर मेमने को चरवाहे की भूमिका में दिखाता है। सामान्यीकृत अनुवाद इस विशिष्ट मसीही और प्रकाशनात्मक बिंब को मंद कर देता।
- issue: अंतिम उपवाक्य में कर्ता
  choice: ‘परमेश्वर’ को स्पष्ट और अलग कर्ता रखा गया
  alternative: मेमने को ही निहित कर्ता मानकर वाक्य जारी रखना
  rationale: यूनानी पाठ ὁ θεός को ἐξαλείψει का स्पष्ट कर्ता बनाता है; इसलिए दृश्य में मेमने और परमेश्वर के उल्लेखों को मिलाया नहीं गया।
- issue: ζωῆς का संबंध
  choice: ‘जीवन’ को ‘जल’ से संबद्ध करते हुए ‘जीवन के जल के सोते’
  alternative: ‘जीवित जल के सोते’
  rationale: यूनानी संबंध-विभक्ति एक से अधिक अर्थ-संभावना देती है। मुख्य पाठ में ‘जीवन का जल’ वाला प्रकाशनात्मक प्रयोग रखा गया, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चरवाही करेगा’ जानबूझकर थोड़ा सजीव रूपक है, क्योंकि मूल पाठ मेमने और चरवाहे के अर्थपूर्ण बिंब को एक साथ रखता है।
