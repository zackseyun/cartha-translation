id: REV.7.1
reference: Revelation 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Μετὰ τοῦτο εἶδον τέσσαρας ἀγγέλους ἑστῶτας ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς, κρατοῦντας τοὺς τέσσαρας ἀνέμους τῆς γῆς, ἵνα μὴ πνέῃ ἄνεμος ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ ⸀πᾶν δένδρον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/001.yaml
  text: After this I saw four angels standing at the four corners of the earth[b][a], holding back the four winds of the earth so that no wind might blow on the earth or on the sea or on any tree.
translation:
  language: hi
  text: इसके बाद मैंने चार स्वर्गदूतों को पृथ्वी के चारों कोनों पर खड़े देखा[a]। वे पृथ्वी की चारों हवाओं को रोके हुए थे, ताकि पृथ्वी पर, समुद्र पर या किसी भी पेड़ पर कोई हवा न चले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पृथ्वी के चारों कोने’ पृथ्वी के दूर-दूर के छोरों या चारों दिशाओं के लिए प्रचलित अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: Μετὰ τοῦτο
  choice: इसके बाद
  rationale: यह दर्शन के क्रम को बताने वाला स्वाभाविक आधुनिक हिन्दी वाक्यांश है; यूनानी एकवचन τοῦτο के अनुरूप है।
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: दर्शन में हुई प्रत्यक्ष अनुभूति का सीधा और पर्याप्त अनुवाद है।
- source_word: τέσσαρας ἀγγέλους
  choice: चार स्वर्गदूतों
  rationale: संख्या और संज्ञा का सीधा अनुवाद; हिन्दी बाइबलीय प्रयोग में ‘स्वर्गदूत’ स्पष्ट और प्रतिष्ठित है।
- source_word: ἑστῶτας
  choice: खड़े
  rationale: पूर्णकालिक कृदंत यहाँ खड़े होने की अवस्था बताता है; ‘तैनात’ अनावश्यक रूप से अधिक व्याख्यात्मक होता।
- source_word: ἐπὶ τὰς τέσσαρας γωνίας τῆς γῆς
  choice: पृथ्वी के चारों कोनों पर
  rationale: मूल की दृश्यात्मक और पारंपरिक अभिव्यक्ति सुरक्षित रखी गई है; व्यापक ब्रह्मांडीय संदर्भ में γῆ के लिए ‘पृथ्वी’ उपयुक्त है।
- source_word: κρατοῦντας
  choice: रोके हुए
  rationale: आगे के उद्देश्य-वाक्य से स्पष्ट है कि हवाओं को बहने से रोका जा रहा है; यह κρατέω के संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς τέσσαρας ἀνέμους τῆς γῆς
  choice: पृथ्वी की चारों हवाओं
  rationale: चार दिशाओं से आने वाली हवाओं की प्रकाशितवाक्यीय छवि को सीधे बनाए रखता है।
- source_word: ἵνα μὴ πνέῃ ἄνεμος
  choice: ताकि ... कोई हवा न चले
  rationale: ἵνα और विधिलिंग के उद्देश्यभाव तथा हवा के पूर्ण निषेध को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῆς γῆς μήτε ἐπὶ τῆς θαλάσσης μήτε ἐπὶ πᾶν δένδρον
  choice: पृथ्वी पर, समुद्र पर या किसी भी पेड़ पर
  rationale: तीनों निषेधात्मक क्षेत्रों को समानांतर रूप में रखा गया है; πᾶν δένδρον का वितरणात्मक अर्थ ‘किसी भी पेड़’ से स्पष्ट होता है।
theological_decisions:
- issue: दर्शन में γῆ का विस्तार
  choice: हर स्थान पर ‘पृथ्वी’
  alternative: ‘भूमि’ या ‘देश’
  rationale: चार कोनों, चार हवाओं, पृथ्वी, समुद्र और प्रत्येक पेड़ की संयुक्त छवि विश्वव्यापी अथवा ब्रह्मांडीय विस्तार सुझाती है; ‘भूमि’ इसे अनावश्यक रूप से सीमित कर सकती है।
- issue: ‘पृथ्वी के चारों कोनों’ की ब्रह्मांड-विषयक भाषा
  choice: मूल रूपक को ज्यों का त्यों रखा
  alternative: ‘पृथ्वी की चारों दिशाओं/छोरों पर’
  rationale: यह पारंपरिक दर्शनात्मक अभिव्यक्ति है। इसे सुरक्षित रखने से मूल की छवि बनी रहती है, जबकि पादटिप्पणी इसका मुहावरेदार आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को हिन्दी में स्पष्टता के लिए दो भागों में बाँटा गया है। ‘चारों कोनों’ और ‘चारों हवाओं’ से मूल की सममिति तथा दर्शनात्मक चित्र सुरक्षित रहता है।
