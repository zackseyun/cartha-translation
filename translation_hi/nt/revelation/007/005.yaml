  yaml_path: translation/nt/revelation/007/005.yaml
  text: from the tribe of Judah[a], twelve thousand were sealed; from the tribe of Reuben, twelve thousand; from the tribe of Gad, twelve thousand.
translation:
  language: hi
  text: यहूदा के गोत्र में से बारह हज़ार लोगों पर मुहर लगाई गई थी;[a] रूबेन के गोत्र में से बारह हज़ार; गाद के गोत्र में से बारह हज़ार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “यहूदा के गोत्र में से बारह हज़ार, जिन पर मुहर लगाई गई थी।” यूनानी में पहली गोत्र-संख्या के बाद निष्क्रिय पूर्ण कृदंत “मुहर लगाए गए” आया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ
  choice: में से
  rationale: यह स्रोत या समूह के भीतर से चयन को स्वाभाविक हिन्दी में व्यक्त करता है और प्रत्येक गोत्र के साथ दोहराए गए यूनानी सूत्र को बनाए रखता है।
- source_word: φυλῆς
  choice: गोत्र
  rationale: इस्राएल की वंशगत जनजातीय संरचना के लिए आधुनिक हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ सटीक और परिचित है।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: इस गोत्र और पूर्वज के नाम का मानक हिन्दी रूप।
- source_word: δώδεκα χιλιάδες
  choice: बारह हज़ार
  rationale: संख्या का सीधा और स्वाभाविक हिन्दी रूप; ‘लोग’ जोड़ना आवश्यक नहीं है।
- source_word: ἐσφραγισμένοι
  choice: पर मुहर लगाई गई
  rationale: निष्क्रिय कृदंत का स्वाभाविक हिन्दी रूप, जो गिने गए लोगों को वर्णित करता है; हिन्दी में बहुवचन समूह के साथ भी ‘गई’ का प्रयोग ‘मुहर’ के अनुसार है।
- source_word: Ῥουβὴν
  choice: रूबेन
  rationale: नाम का प्रचलित मानक हिन्दी रूप।
- source_word: Γὰδ
  choice: गाद
  rationale: नाम का प्रचलित मानक हिन्दी रूप।
theological_decisions:
- issue: गोत्रों की गणना में ἐσφραγισμένοι का रूप और दायरा
  choice: पहले खंड में इसे स्पष्ट निष्क्रिय क्रिया ‘पर मुहर लगाई गई’ के रूप में रखा गया है और अगले समानांतर खंडों में क्रिया को दोहराया नहीं गया।
  alternative: ‘बारह हज़ार, जिन पर मुहर लगी थी’ अथवा प्रत्येक गोत्र के बाद ‘पर मुहर लगाई गई’ दोहराना।
  rationale: यूनानी पाठ में कृदंत पहली संख्या के बाद आता है, पर सूची के गिने हुए लोगों का वर्णन करता है। चुना गया रूप हिन्दी में स्पष्ट है और बाद के खंडों की मूल पाठ वाली लोपयुक्त समानांतरता भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची की लय के अनुरूप रखी गई है। ‘में से’ सामान्य पाठक के लिए स्वाभाविक है, जबकि अर्धविराम समानांतर गोत्रीय गणना को स्पष्ट करते हैं।
