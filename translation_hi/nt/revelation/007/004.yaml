    text: या, “इस्राएल की सन्तानों के।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है, जो पुल्लिंग वंशावली-संबंधी भाषा को बनाए रखता है।
    reason: lexical_alternative
