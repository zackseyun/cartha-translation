id: REV.7.4
reference: Revelation 7:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα τὸν ἀριθμὸν τῶν ἐσφραγισμένων, ⸀ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, ⸀ἐσφραγισμένοι ἐκ πάσης φυλῆς υἱῶν Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/004.yaml
  text: 'And I heard the number of those who had been sealed: one hundred forty-four thousand[a], sealed from every tribe of the sons of Israel.'
translation:
  language: hi
  text: 'और मैंने मुहर पाए हुए लोगों की संख्या सुनी: एक लाख चवालीस हज़ार—इस्राएल के पुत्रों के हर गोत्र में से मुहर पाए हुए लोग।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की सन्तानों के।” यूनानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है, जो पुल्लिंग वंशावली-संबंधी भाषा को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: मैंने ... सुनी
  rationale: ἀκούω के अओरिस्ट कथात्मक रूप को स्वाभाविक हिन्दी में ‘मैंने ... सुनी’ किया गया है; कर्म ‘संख्या’ स्त्रीलिंग है।
- source_word: ἀριθμὸν
  choice: संख्या
  rationale: यह गिने हुए समूह की कुल संख्या को बताता है; ‘संख्या’ आधुनिक मानक हिन्दी में सहज और सटीक है।
- source_word: τῶν ἐσφραγισμένων / ἐσφραγισμένοι
  choice: उन पर मुहर लगाए गए लोगों / जिन पर ... मुहर लगाई गई थी
  rationale: पूर्ण निष्क्रिय कृदन्त पहले हो चुकी मुहर लगाने की क्रिया और उसके बने हुए परिणाम को व्यक्त करता है। हिन्दी में दोहराव को रखते हुए निष्क्रिय अभिव्यक्ति स्वाभाविक बनाई गई है।
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: एक लाख चवालीस हज़ार
  rationale: 144,000 का सामान्य और स्पष्ट हिन्दी संख्या-रूप।
- source_word: ἐκ
  choice: में से
  rationale: यह स्रोत अथवा समूह में से चुने जाने का भाव देता है; इस वाक्य-विन्यास में ‘में से’ स्वाभाविक है।
- source_word: πάσης φυλῆς
  choice: हर गोत्र
  rationale: एकवचन πᾶς के साथ यह वितरणात्मक अर्थ देता है—प्रत्येक गोत्र में से।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: मूल यूनानी के स्पष्ट पुल्लिंग और वंशावली-संबंधी शब्द-प्रयोग को सुरक्षित रखता है; ‘सन्तानों’ का अधिक समावेशी विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: गोत्र-सूची के प्रसंग में υἱῶν Ἰσραήλ का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तानों
  rationale: यूनानी पाठ में पुल्लिंग υἱῶν है और प्रसंग वंश तथा गोत्रों का है। ‘पुत्रों’ मूल शब्दावली को बिना किसी विशिष्ट अन्तकालीन व्याख्या को आरोपित किए सुरक्षित रखता है; पारंपरिक सामूहिक अर्थ के लिए विकल्प पादटिप्पणी में है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘मुहर लगाई गई थी’ पूर्ण निष्क्रिय भाव को स्वाभाविक ढंग से व्यक्त करता है; ‘गोत्र’ बाइबलीय वंश-संदर्भ के लिए प्रचलित और सटीक है।
