revisions:
- from: 'और मैंने उन पर मुहर लगाए गए लोगों की संख्या सुनी: एक लाख चवालीस हज़ार, जिन पर इस्राएल के पुत्रों के हर गोत्र में से मुहर लगाई गई थी।[a]'
  to: 'और मैंने मुहर पाए हुए लोगों की संख्या सुनी: एक लाख चवालीस हज़ार—इस्राएल के पुत्रों के हर गोत्र में से मुहर पाए हुए लोग।[a]'
  rationale: Revision clarifies that the 144,000 sealed people come from every tribe of the sons of Israel, rather than suggesting that the sealing itself is performed ‘from’ tribes. It also preserves the Greek’s repeated sealing terminology in natural Hindi and retains the gender-specific genealogical wording with a clearly anchored lexical alternative.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:48:07Z'
review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the verse''s principal elements: hearing the number, 144,000, sealing, distributive reference to every tribe, and ‘sons of Israel.’ However, the word order and relative clause make ‘हर गोत्र’ appear to modify the act of sealing (‘जिन पर ... हर गोत्र में से मुहर लगाई गई थी’) rather than the sealed persons’ origin. The Greek states that the sealed persons are from every tribe. The first perfect passive participle is also more idiomatically and precisely expressed as ‘मुहर पाए हुए’ rather than the cumbersome ‘उन पर मुहर लगाए गए लोग.’'
  naturalness: The present Hindi is understandable but syntactically heavy and somewhat awkward, especially ‘जिन पर इस्राएल के पुत्रों के हर गोत्र में से मुहर लगाई गई थी।’ A compact appositional construction is natural, retains the Greek repetition, and clearly attaches ‘हर गोत्र में से’ to the group.
  terminology: '‘मुहर पाए हुए,’ ‘संख्या,’ ‘गोत्र,’ and ‘इस्राएल के पुत्र’ are appropriate modern standard Hindi biblical terms. The alternative footnote should use the same genitive construction as the main text: ‘इस्राएल की सन्तानों के।’'
  issues:
  - severity: medium
    issue: The phrase ‘इस्राएल के पुत्रों के हर गोत्र में से’ is placed inside a passive relative clause about the sealing action.
    rationale: 'This creates an unnatural and potentially misleading sense that sealing was performed from each tribe, whereas ἐκ πάσης φυλῆς modifies the sealed group: they are sealed persons from every tribe.'
  - severity: low
    issue: ‘उन पर मुहर लगाए गए लोगों’ is unnecessarily periphrastic.
    rationale: ‘मुहर पाए हुए लोगों’ is idiomatic Hindi and conveys the resulting state of the perfect passive participle without weakening the meaning.
  - severity: low
    issue: The footnote alternative is not grammatically parallel to the main expression.
    rationale: For ‘sons of Israel,’ the Hindi alternative should be ‘इस्राएल की सन्तानों के,’ not merely ‘इस्राएल की सन्तानों।’
  revised_text: 'और मैंने मुहर पाए हुए लोगों की संख्या सुनी: एक लाख चवालीस हज़ार—इस्राएल के पुत्रों के हर गोत्र में से मुहर पाए हुए लोग।[a]'
  revised_footnotes:
