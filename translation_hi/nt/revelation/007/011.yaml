id: REV.7.11
reference: Revelation 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πάντες οἱ ἄγγελοι εἱστήκεισαν κύκλῳ τοῦ θρόνου καὶ τῶν πρεσβυτέρων καὶ τῶν τεσσάρων ζῴων, καὶ ἔπεσαν ἐνώπιον τοῦ θρόνου ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/007/011.yaml
  text: And all the angels were standing around the throne and the elders and the four living creatures[a], and they fell before the throne on their faces and worshiped God,
translation:
  language: hi
  text: और सभी स्वर्गदूत सिंहासन, प्राचीनों और चार जीवित प्राणियों[a] के चारों ओर खड़े थे। और वे सिंहासन के सामने मुँह के बल गिर पड़े और परमेश्वर की आराधना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चार जीवित सत्ताएँ।’
    reason: ζῷα के लिए एक सम्भव व्यापक शाब्दिक विकल्प; मुख्य पाठ का ‘जीवित प्राणी’ अधिक स्वाभाविक हिन्दी है।
lexical_decisions:
- source_word: πάντες οἱ ἄγγελοι
  choice: सभी स्वर्गदूत
  rationale: πάντες सहित निश्चित बहुवचन का सीधा और स्वाभाविक हिन्दी रूप; प्रकाशितवाक्य के संदर्भ में ἄγγελοι के लिए ‘स्वर्गदूत’ मानक और स्पष्ट है।
- source_word: εἱστήκεισαν
  choice: खड़े थे
  rationale: इस रूप का स्थितिवाचक भाव जारी मुद्रा को व्यक्त करता है; ‘खड़े थे’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से रखता है।
- source_word: κύκλῳ
  choice: के चारों ओर
  rationale: सम्बन्धकारक के साथ κύκλῳ स्थानगत घेरा व्यक्त करता है; ‘के चारों ओर’ स्पष्ट और सहज है।
- source_word: τοῦ θρόνου
  choice: सिंहासन
  rationale: राजकीय और स्वर्गीय बिंब को बनाए रखने वाला स्थापित हिन्दी समतुल्य।
- source_word: τῶν πρεσβυτέρων
  choice: प्राचीनों
  rationale: प्रकाशितवाक्य में पहचाने जाने वाले इस स्वर्गीय समूह के लिए ‘प्राचीन’ प्रतिष्ठित बाइबलीय पद है और केवल अधिक आयु के लोगों का अर्थ आरोपित नहीं करता।
- source_word: τῶν τεσσάρων ζῴων
  choice: उन चार जीवित प्राणियों
  rationale: ζῷα को ‘पशु’ कहना भ्रामक होगा। ‘जीवित प्राणी’ उनके सजीव स्वरूप और प्रकाशनात्मक बिंब को बिना अतिरिक्त पहचान जोड़े सुरक्षित रखता है; ‘उन’ पूर्ववर्णित समूह की ओर संकेत को स्वाभाविक बनाता है।
- source_word: ἔπεσαν
  choice: गिर पड़े
  rationale: अपूर्ण नहीं बल्कि घटित क्रिया और दंडवत मुद्रा का आरम्भ व्यक्त करता है; आगे ‘मुँह के बल’ से शारीरिक विनम्रता स्पष्ट होती है।
- source_word: ἐνώπιον τοῦ θρόνου
  choice: सिंहासन के सामने
  rationale: यहाँ ἐνώπιον स्थानगत अर्थ में है; ‘के सामने’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: मुँह के बल
  rationale: शाब्दिक ‘अपने चेहरों पर’ की अपेक्षा हिन्दी का यह स्वाभाविक मुहावरा पूर्ण दंडवत मुद्रा को ठीक व्यक्त करता है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: कर्ता पहले ही मुँह के बल गिरे हैं और कर्म परमेश्वर है, इसलिए यहाँ क्रिया केवल प्रणाम नहीं बल्कि आराधना व्यक्त करती है।
- source_word: τῷ θεῷ
  choice: परमेश्वर की
  rationale: προσκυνέω के दत्तिव कर्म को हिन्दी में ‘की आराधना की’ संरचना से स्वाभाविक रूप दिया गया है।
theological_decisions:
- issue: सिंहासन-कक्ष के ζῷα का नामकरण
  choice: जीवित प्राणी
  alternative: जीवित प्राणीगण / चार प्राणी / चार जीव
  rationale: यह रूप उन्हें साधारण पशु नहीं बनाता और न उनकी कोई अतिरिक्त धर्मवैज्ञानिक पहचान निर्धारित करता है; मूल के व्यापक सजीव-प्राणी अर्थ तथा प्रकाशनात्मक तनाव को बनाए रखता है।
- issue: परमेश्वर के संदर्भ में προσκυνέω का बल
  choice: परमेश्वर की आराधना की
  alternative: परमेश्वर के सामने दंडवत किया
  rationale: पिछला वाक्यांश शारीरिक दंडवत को पहले ही स्पष्ट करता है। परमेश्वर को लक्ष्य बनाकर प्रयुक्त προσκυνέω यहाँ आराधना का पूर्ण भाव रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। यूनानी वाक्य के दो मुख्य घटनाक्रमों को पठनीयता हेतु दो वाक्यों में रखा गया है। ‘तब’ क्रम को स्पष्ट करता है, नया कारणात्मक अर्थ नहीं जोड़ता। हर फुटनोट चिह्न मुख्य पाठ में उपस्थित है।
