  yaml_path: translation/nt/revelation/002/028.yaml
  text: just as I also have received from my Father[a], and I will give him the morning star.
translation:
  language: hi
  text: जैसे मैंने भी अपने पिता से प्राप्त किया है, और मैं उसे भोर का तारा[a] दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सुबह का तारा।’ यह वाक्यांश मसीहाई राजत्व-संबंधी बिंब की ओर संकेत कर सकता है और प्रकाशितवाक्य 22:16 से भी संबंधित हो सकता है, जहाँ यीशु अपने आपको ‘चमकता हुआ भोर का तारा’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς κἀγὼ
  choice: ठीक वैसे ही जैसे मैंने भी
  rationale: ὡς तुलना और अनुरूपता प्रकट करता है, जबकि κἀγὼ में ‘मैं भी’ का योगात्मक बल है। यह रूप पिछले पद में दिए अधिकार के वादे से संबंध बनाए रखता है।
- source_word: εἴληφα
  choice: प्राप्त किया है
  rationale: पूर्णकाल किसी पूरी हुई प्राप्ति के वर्तमान परिणाम को दर्शाता है; ‘प्राप्त किया है’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παρὰ τοῦ πατρός μου
  choice: अपने पिता से
  rationale: सम्बन्धित वाक्य का कर्ता ‘मैं’ है, इसलिए आधुनिक हिन्दी में ‘अपने पिता से’ स्वाभाविक है और παρά के स्रोत-सूचक अर्थ तथा मूल के पुत्र-पिता संबंध को सुरक्षित रखता है।
- source_word: καὶ δώσω αὐτῷ
  choice: और मैं उसे ... दूँगा
  rationale: भविष्यकाल और एकवचन सम्प्रदान को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसे’ पिछले प्रसंग के विजयी जन की ओर संकेत करता है।
- source_word: τὸν ἀστέρα τὸν πρωϊνόν
  choice: भोर का तारा
  rationale: यह πρωϊνός की प्रातः/भोर-संबंधी छवि को सहज आधुनिक हिन्दी में रखता है और रूपक की व्याख्या मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: ‘भोर का तारा’ की पहचान और अर्थ
  choice: मुख्य पाठ में रूपक को ‘भोर का तारा’ के रूप में अपरिभाषित रखना
  alternative: इसे मसीही राजकीय विजय, स्वयं मसीह, या आनेवाली महिमा के प्रतिफल के रूप में स्पष्ट कर देना
  rationale: पद स्वयं इस प्रतीक को परिभाषित नहीं करता। प्रकाशितवाक्य 22:16 से मसीह-संबंधी प्रतिध्वनि संभव है, पर उसे मुख्य पाठ में निर्णायक बनाना मूल की बहुअर्थकता को सीमित कर देगा।
- issue: ‘अपने पिता से’ में मसीह और पिता का संबंध
  choice: प्राप्ति और पुत्र-पिता संबंध को बिना व्याख्यात्मक विस्तार के सीधे व्यक्त करना
  alternative: ‘पिता से मिला हुआ अधिकार’ या उद्धार-व्यवस्था संबंधी स्पष्टीकरण जोड़ना
  rationale: मूल पाठ स्रोत और संबंध बताता है, पर यहाँ उस संबंध का सिद्धान्तगत विवरण नहीं देता; अतः अनुवाद को उतना ही कहना चाहिए जितना पाठ कहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पूर्ववर्ती वाक्य से व्याकरणिक रूप से जुड़ा है; फिर भी दिए गए स्वतंत्र पद में अर्थ-स्पष्टता के लिए तुलना वाले खंड के बाद पूर्ण विराम रखा गया है।
