lexical_decisions:
- source_word: ὑπομονὴν
  choice: धीरज
  rationale: यह शब्द परीक्षा या कठिनाई में दृढ़तापूर्वक टिके रहने का भाव व्यक्त करता है। ‘धीरज’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है तथा केवल निष्क्रिय प्रतीक्षा का अर्थ नहीं थोपता।
- source_word: ἔχεις
  choice: तुममें ... है
  rationale: वर्तमान दशा की सीधी प्रशंसा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐβάστασας
  choice: तुमने ... सब कुछ सहा है
  rationale: βαστάζω यहाँ बोझ या कठिनाई उठाने और सहते रहने के अर्थ में है। ‘सहा है’ प्रसंगानुकूल है; ‘सब कुछ’ हिन्दी में क्रिया को स्वाभाविक बनाता है, पर किसी विशेष प्रकार के कष्ट को निर्धारित नहीं करता।
- source_word: διὰ τὸ ὄνομά μου
  choice: मेरे नाम के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण अथवा निमित्त का भाव दे सकता है। ‘मेरे नाम के कारण’ यीशु के नाम से संबंध के कारण कठिनाई सहने का अर्थ स्पष्ट करता है; प्रयोजनसूचक विकल्प पादटिप्पणी में रखा गया है।
- source_word: οὐ κεκοπίακες
  choice: तुम थके नहीं हो
  rationale: κοπιάω यहाँ श्रम करने और थकने—दोनों अर्थों की संभावना रखता है। प्रसंग और पूर्णकाल के अनुसार यह अनवरत थककर हार न मानने की वर्तमान परिणति बताता है; संक्षिप्त हिन्दी मूल की कुछ अर्थगत खुली जगह बनाए रखती है।
theological_decisions:
- issue: धीरज और कठिनाई सहने की प्रशंसा का आशय
  choice: पद को यीशु के नाम के कारण कठिनाई सहते हुए टिके रहने की सामान्य प्रशंसा के रूप में रखा गया है।
  alternative: अंतिम वाक्यांश को विशेष रूप से सेवाकार्य के परिश्रम से न थकने के अर्थ में समझा जा सकता है।
  rationale: मूल पाठ किसी खास प्रकार के उत्पीड़न, सेवा या प्रतिफल का उल्लेख नहीं करता; इसलिए अनुवाद उस सीमा से आगे नहीं जाता।
- issue: διὰ τὸ ὄνομά μου में कारण और प्रयोजन
  choice: मुख्य पाठ में ‘मेरे नाम के कारण’।
  alternative: ‘मेरे नाम के लिए’ अथवा ‘मेरे नाम की खातिर’।
  rationale: διά + कर्मकारक कारण या प्रयोजन व्यक्त कर सकता है। प्रसंग में कारण स्वाभाविक है, किंतु प्रयोजनसूचक अर्थ भी संभव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संबोधनपरक रूप अपनाया गया है। ग्रीक के समन्वयात्मक वाक्य-विन्यास को यथासंभव बनाए रखते हुए अस्वाभाविक शब्दशः अनुवाद से बचा गया है।
