  yaml_path: translation/nt/revelation/002/021.yaml
  text: And I gave her time to repent[a], but she is not willing to repent of her sexual immorality.
translation:
  language: hi
  text: मैंने उसे मन फिराने के लिए समय दिया, पर वह उसकी यौन अनैतिकता से मन फिराना नहीं चाहती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκα
  choice: मैंने ... दिया
  rationale: अओरिस्ट क्रिया को प्रसंग में पूर्ण हो चुके अवसर-प्रदान के रूप में साधारण भूतकाल से व्यक्त किया गया है।
- source_word: χρόνον
  choice: समय
  rationale: यह किसी दी गई अवधि को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: ἵνα μετανοήσῃ
  choice: मन फिराने का
  rationale: ἵνα के प्रयोजनार्थ को हिंदी के स्वाभाविक ‘समय दिया’ विन्यास में रखा गया है।
- source_word: οὐ θέλει
  choice: नहीं चाहती
  rationale: यह उसकी अनिच्छा को व्यक्त करता है, पर ‘साफ़ इनकार करती है’ जैसी अधिक प्रबल व्याख्या नहीं जोड़ता।
- source_word: μετανοῆσαι
  choice: मन फिराना
  rationale: पहले प्रयोग की पुनरावृत्ति यूनानी पाठ के बलाघात को बनाए रखती है।
- source_word: ἐκ τῆς πορνείας αὐτῆς
  choice: अपने यौन अनैतिकता के कामों से
  rationale: ἐκ के ‘से/में से बाहर’ भाव को बनाए रखते हुए πορνεία की यौन-संबंधी विशिष्टता स्पष्ट की गई है; ‘कामों’ हिंदी में इस अमूर्त पदबंध को सहज बनाता है।
theological_decisions:
- issue: प्रकाशितवाक्य की प्रतीकात्मक डाँट में πορνεία का अर्थ
  choice: यौन अनैतिकता के काम
  alternative: व्यभिचार; वेश्यागमन; अनैतिकता
  rationale: मुख्य पाठ ठोस शाब्दिक अर्थ रखता है, जबकि निकटवर्ती संदर्भ संभावित मूर्तिपूजक या रूपकात्मक अर्थछाया को स्वयं वहन करने देता है। इससे किसी एक प्रतीकात्मक व्याख्या को पाठ पर थोपा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘मन फिराना’ बाइबिलीय अर्थ को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य है। कोई पाद-टिप्पणी आवश्यक नहीं, क्योंकि ἐκ का भाव मुख्य पाठ में ‘से’ द्वारा सुरक्षित है।
