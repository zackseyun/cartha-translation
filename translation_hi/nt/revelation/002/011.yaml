id: REV.2.11
reference: Revelation 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. ὁ νικῶν οὐ μὴ ἀδικηθῇ ἐκ τοῦ θανάτου τοῦ δευτέρου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/011.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches[b]. The one who conquers will certainly not be harmed by the second death.
translation:
  language: hi
  text: जिसके कान हों, वह सुन ले कि आत्मा कलीसियाओं से क्या कहता है। जो जय पाता है, उसे दूसरी मृत्यु से किसी भी प्रकार हानि नहीं पहुँचेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हों
  rationale: यूनानी में ‘कान’ एकवचन है, पर आधुनिक स्वाभाविक हिन्दी में यह स्थापित प्रतिनिधिक अभिव्यक्ति बहुवचन ‘कान’ के साथ अधिक सहज है; अर्थ हर सुनने में समर्थ व्यक्ति से है।
- source_word: ἀκουσάτω
  choice: वह सुन ले
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया के आग्रहपूर्ण और उपदेशात्मक बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रकाशितवाक्य 2–3 की आवर्ती उक्ति में यह परमेश्वर के आत्मा को सूचित करता है; हिन्दी में सम्मानसूचक अर्थ संदर्भ से स्पष्ट रहता है।
- source_word: ταῖς ἐκκλησίαις
  choice: कलीसियाओं से
  rationale: यहाँ ἐκκλησίαις उन स्थानीय विश्वास-समुदायों को सूचित करता है जिन्हें संदेश दिए गए हैं; ‘कलीसिया’ हिन्दी बाइबलीय प्रयोग में प्रचलित और स्पष्ट है।
- source_word: ὁ νικῶν
  choice: जो जय पाता है
  rationale: वर्तमान कृदन्त निरंतर या चरित्रगत विजय को व्यक्त करता है। ‘जय पाता है’ हिन्दी में स्वाभाविक है और प्रकाशितवाक्य की विजय-संबंधी छवि बनाए रखता है।
- source_word: οὐ μὴ
  choice: किसी भी प्रकार ... नहीं
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को बिना पुरातन भाषा के स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀδικηθῇ
  choice: हानि नहीं पहुँचेगी
  rationale: निष्क्रिय ἀδικέω यहाँ अन्याय किए जाने से अधिक वास्तविक क्षति या हानि उठाने का भाव रखता है।
- source_word: ἐκ τοῦ θανάτου τοῦ δευτέρου
  choice: दूसरी मृत्यु से
  rationale: ἐκ स्रोत या कारण-सदृश संबंध दर्शाता है; हिन्दी का ‘से’ इस वास्तविक अस्पष्टता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: τοῦ θανάτου τοῦ δευτέρου
  choice: दूसरी मृत्यु
  rationale: प्रकाशितवाक्य की धर्मवैचारिक रूप से महत्त्वपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्रेत
  choice: कलीसियाओं से बोलने वाला परमेश्वर का आत्मा
  alternative: सामान्य अर्थ में भविष्यद्वाणी का आत्मा
  rationale: प्रकाशितवाक्य की आवर्ती संदेश-उक्ति में आत्मा दैवी वक्ता के रूप में सामने आता है; अनुवाद इससे आगे कोई व्याख्यात्मक उपाधि नहीं जोड़ता।
- issue: प्रतिनिधिक एकवचन का हिन्दी रूप
  choice: ‘जिसके कान हों, वह सुन ले’
  alternative: ‘जिसका कान हो, वह सुने’
  rationale: मूल का प्रतिनिधिक व्यक्तिगत संबोधन बना रहता है, जबकि हिन्दी में स्वाभाविक मुहावरा अपनाया गया है; यह किसी विशेष लिंग तक अर्थ सीमित नहीं करता।
- issue: ‘दूसरी मृत्यु’ का अर्थ
  choice: अभिव्यक्ति को ज्यों का त्यों सुरक्षित रखना
  alternative: इसे अंतिम न्याय या अनन्त दण्ड के रूप में स्पष्ट करके लिखना
  rationale: इस पद में स्वयं व्याख्यात्मक विस्तार नहीं है और प्रकाशितवाक्य आगे इस अभिव्यक्ति को स्पष्ट करता है; इसलिए यहाँ धर्मसैद्धान्तिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘कलीसिया’, ‘आत्मा’, ‘जय’ और ‘दूसरी मृत्यु’ जैसे परिचित बाइबलीय पदों को रखा गया है, पर वाक्य-विन्यास सहज और वर्तमान हिन्दी का है।
