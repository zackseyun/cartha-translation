id: REV.2.7
reference: Revelation 2:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω αὐτῷ φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, ὅ ἐστιν ἐν τῷ παραδείσῳ τοῦ ⸀θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/007.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give to eat from the tree of life, which is in the paradise of God.
translation:
  language: hi
  text: जिसके कान हों, वह सुन ले कि आत्मा कलीसियाओं से क्या कहता है। जो जय पाता है[a], उसे मैं जीवन के वृक्ष से खाने दूँगा, जो परमेश्वर के स्वर्गोद्यान में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो विजय पाता है।”
    reason: νικάω का यह समानार्थी अनुवाद विजय के भाव को अधिक प्रत्यक्ष शब्दावली में व्यक्त करता है।
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हों
  rationale: यूनानी में ‘कान’ एकवचन है, पर यह एक रूढ़ उपदेशात्मक कथन है। स्वाभाविक आधुनिक हिन्दी में ‘जिसके कान हों’ उसी प्रतिनिधिक और मुहावरेदार अर्थ को स्पष्ट रखता है।
- source_word: ἀκουσάτω
  choice: वह सुन ले
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया के आग्रहपूर्ण भाव को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रकाशितवाक्य 2–3 के बार-बार आने वाले सूत्र में इसका संकेत पवित्र आत्मा की ओर है। ‘आत्मा’ मूल पाठ की संक्षिप्तता बनाए रखता है और हिन्दी में अक्षर के बड़े-छोटे रूप से भेद न दिखा पाने के बावजूद संदर्भ से आशय स्पष्ट है।
- source_word: λέγει ταῖς ἐκκλησίαις
  choice: कलीसियाओं से क्या कहता है
  rationale: वर्तमान काल और बहुवचन दोनों सुरक्षित हैं। ‘कलीसिया’ आधुनिक हिन्दी मसीही प्रयोग में ἐκκλησία का स्थापित और संदर्भानुकूल रूप है।
- source_word: τῷ νικῶντι
  choice: जो जय पाता है
  rationale: वर्तमान कृदन्त की निरंतर/विशेषतामूलक शक्ति और प्रकाशितवाक्य की विजय-छवि को बनाए रखता है। ‘विजय पाता है’ समानार्थी विकल्प के रूप में पादटिप्पणी में दिया गया है।
- source_word: δώσω αὐτῷ φαγεῖν
  choice: उसे मैं ... खाने दूँगा
  rationale: दाता, प्राप्तकर्ता और खाने की अनुमति/वरदान—तीनों को स्वाभाविक हिन्दी में व्यक्त करता है; मूल में न आए ‘फल’ को पाठ में नहीं जोड़ा गया।
- source_word: ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: जीवन के वृक्ष से
  rationale: ἐκ के स्रोत-बोध को ‘से’ द्वारा और उत्पत्ति तथा प्रकाशितवाक्य से जुड़ी स्थापित अभिव्यक्ति को ‘जीवन के वृक्ष’ द्वारा सुरक्षित रखा गया है।
- source_word: παραδείσῳ
  choice: स्वर्गोद्यान
  rationale: παράδεισος के उद्यान और स्वर्गिक निवास—दोनों अर्थ-संकेतों को ‘स्वर्गोद्यान’ एक साथ रखता है; केवल ‘बगीचा’ या ‘स्वर्ग’ कहने से इनमें से एक पहलू दब सकता था।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: यूनानी संबंधकारक का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: τὸ πνεῦμα का अभिप्रेत संदर्भ
  choice: आत्मा, संदर्भतः पवित्र आत्मा
  alternative: कोई सामान्य आत्मा
  rationale: सात कलीसियाओं को दिए संदेशों में दोहराया गया यह सूत्र दिव्य वाणी का परिचय देता है। फिर भी मूल में केवल πνεῦμα होने के कारण मुख्य पाठ में ‘पवित्र’ नहीं जोड़ा गया।
- issue: νικάω की विजय-छवि
  choice: जय पाता है
  alternative: विजय पाता है / पार पाता है
  rationale: ‘जय पाना’ संघर्ष और विजय की उस छवि को बनाए रखता है जो प्रकाशितवाक्य में बार-बार आती है। ‘पार पाना’ संभव है, पर विजय का बिंब कुछ कम प्रत्यक्ष करता है।
- issue: प्रतिनिधिक एकवचन का हिन्दी रूप
  choice: जिसके कान हों, वह
  alternative: जिस किसी के कान हों, वह
  rationale: यह संबोधन हर सुनने वाले व्यक्ति पर लागू है। हिन्दी का ‘जिसके ... वह’ प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक रूप से लिंग जोड़ने के।
- issue: जीवन के वृक्ष से खाने का आशय
  choice: खाने की वस्तु को स्पष्ट किए बिना मूल वाक्य रखा गया
  alternative: जीवन के वृक्ष का फल खाने दूँगा
  rationale: संदर्भ में फल समझा जा सकता है, पर यूनानी पाठ में ‘फल’ शब्द नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं समझा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘कलीसिया’, ‘जीवन का वृक्ष’ और ‘जय पाना’ परिचित बाइबलीय पदावली हैं; ‘स्वर्गोद्यान’ παράδεισος के उद्यान तथा स्वर्गिक दोनों संकेतों को संक्षेप में सुरक्षित रखता है।
