  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Σμύρνῃ ἐκκλησίας γράψον· Τάδε λέγει ὁ πρῶτος καὶ ὁ ἔσχατος, ὃς ἐγένετο νεκρὸς καὶ ἔζησεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/008.yaml
  text: 'And to the angel of the church in Smyrna write: These things says the First and the Last[b][a], who became dead and lived again:'
translation:
  language: hi
  text: 'स्मुरना की कलीसिया के दूत[a] को लिख: “ये बातें वह कहता है जो प्रथम और अंतिम है, जो मर गया था और फिर जीवित हो गया:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्गदूत’। यूनानी शब्द का अर्थ ‘संदेशवाहक’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: दूत
  rationale: ‘दूत’ यूनानी शब्द की ‘स्वर्गदूत’ और ‘संदेशवाहक’ दोनों संभावनाओं को कुछ हद तक खुला रखता है; प्रकाशितवाक्य के स्वर्गीय संदर्भ को ध्यान में रखते हुए पादटिप्पणी में ‘स्वर्गदूत’ दिया गया है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: यहाँ शब्द मसीही विश्वासियों के स्थानीय समुदाय को दर्शाता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘कलीसिया’ इसका परिचित और विशिष्ट रूप है।
- source_word: Τάδε λέγει
  choice: वह यह कहता है
  rationale: यह अनुवाद यूनानी भविष्यद्वाणी-संदेश सूत्र को स्वाभाविक हिन्दी में रखता है और वर्तमान काल ‘कहता है’ को बनाए रखता है।
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: जो प्रथम और अंतिम है
  rationale: इसे वक्ता की उपाधि के रूप में रखा गया है; ‘प्रथम’ और ‘अंतिम’ मूल की औपचारिक तथा गंभीर शैली को व्यक्त करते हैं।
- source_word: ἐγένετο νεκρὸς
  choice: जो मर गया था
  rationale: यूनानी में मृत्यु की अवस्था में प्रवेश करने का घटनात्मक भाव है; ‘मर गया था’ हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔζησεν
  choice: फिर जीवित हो गया
  rationale: मृत्यु के बाद जीवन में आने का विरोधाभास और पुनर्जीवन का संदर्भ हिन्दी में स्पष्ट होता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
theological_decisions:
- issue: मसीह की उपाधि और मृत्यु के बाद जीवन
  choice: ‘जो प्रथम और अंतिम है, जो मर गया था और फिर जीवित हो गया’
  alternative: ‘प्रथम और अंतिम, जो मृत हो गया और जीवित हुआ’
  rationale: चुना हुआ रूप यीशु की उपाधि, वास्तविक मृत्यु और पुनर्जीवन—तीनों को सीधे सुरक्षित रखता है। यह ऊँची मसीह-विषयक पहचान को न घटाता है, न उसमें पाठ से बाहर की व्याख्या जोड़ता है।
- issue: ἀγγέλῳ की पहचान
  choice: मुख्य पाठ में ‘दूत’, पादटिप्पणी में ‘स्वर्गदूत’
  alternative: मुख्य पाठ में ‘स्वर्गदूत’ या ‘संदेशवाहक’
  rationale: यूनानी शब्द दोनों अर्थ दे सकता है। प्रकाशितवाक्य का संदर्भ ‘स्वर्गदूत’ के पक्ष में है, पर कलीसिया से उसका संबंध ठीक किस प्रकार का है, यह अस्पष्ट है; इसलिए हिन्दी के व्यापक ‘दूत’ से अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘यह लिख’ एकवचन आज्ञा और प्रकाशितवाक्य की गंभीर संबोधन-शैली को बनाए रखता है। आरंभिक उद्धरण-चिह्न अगले पदों में जारी रहने वाले संदेश को दर्शाता है।
