  source_fidelity: 'The Hindi accurately represents all principal elements of the Greek: Christ''s knowledge of the community''s works, strenuous labor, and endurance; its refusal to tolerate evil persons; its testing of self-designated apostles; their lack of apostolic status; and their being found false. The two Hindi sentences preserve the coordinate structure without material loss or interpretive expansion.'
  naturalness: The wording is clear, idiomatic modern standard Hindi, with an appropriately elevated biblical register. “कठिन परिश्रम,” “धीरज,” “बुरे लोगों को सहन नहीं कर सकते,” and “अपने आपको प्रेरित कहते हैं” are natural. The repeated “मैं यह भी जानता हूँ” improves Hindi readability and does not add meaning.
  terminology: “प्रेरित” is the established Hindi biblical rendering for ἀπόστολοι and correctly retains the title without validating the claimants’ claim. “बुरे लोगों” appropriately renders the substantival masculine plural without artificially restricting the referent by gender. “उन्हें झूठा पाया” suitably conveys the source’s predicate ψευδεῖς while retaining its concise characterization.
