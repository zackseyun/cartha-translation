id: REV.2.2
reference: Revelation 2:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἶδα τὰ ἔργα σου, καὶ τὸν ⸀κόπον καὶ τὴν ὑπομονήν σου, καὶ ὅτι οὐ δύνῃ βαστάσαι κακούς, καὶ ἐπείρασας τοὺς λέγοντας ἑαυτοὺς ⸀ἀποστόλους, καὶ οὐκ εἰσίν, καὶ εὗρες αὐτοὺς ψευδεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/002.yaml
  text: I know your works[a], your labor, and your endurance, and that you cannot tolerate evil people. You tested those who call themselves apostles and are not[b], and you found them to be false.
translation:
  language: hi
  text: मैं तुम्हारे कामों, तुम्हारे कठिन परिश्रम और तुम्हारे धीरज को जानता हूँ। मैं यह भी जानता हूँ कि तुम बुरे लोगों को सहन नहीं कर सकते। तुमने उन लोगों को परखा जो अपने आपको प्रेरित कहते हैं, पर हैं नहीं, और तुमने उन्हें झूठा पाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: मैं ... जानता हूँ
  rationale: वर्तमान ज्ञान और व्यक्तिगत मूल्यांकन की सीधी अभिव्यक्ति; हिन्दी में स्वाभाविक और गरिमापूर्ण।
- source_word: τὰ ἔργα σου
  choice: तुम्हारे कामों
  rationale: ἔργα के व्यापक अर्थ—कर्म, कार्य और गतिविधियाँ—को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν κόπον
  choice: तुम्हारे कठिन परिश्रम
  rationale: κόπος में श्रम की कठिनता और थकाने वाले प्रयास का भाव है; केवल ‘परिश्रम’ की अपेक्षा ‘कठिन परिश्रम’ इसे अधिक स्पष्ट करता है।
- source_word: τὴν ὑπομονήν σου
  choice: तुम्हारे धीरज
  rationale: ὑπομονή दबाव में टिके रहने और दृढ़ सहनशीलता का बोध कराता है; ‘धीरज’ सरल और प्रचलित हिन्दी है।
- source_word: οὐ δύνῃ βαστάσαι
  choice: सहन नहीं कर सकते
  rationale: शाब्दिक ‘उठा/झेल नहीं सकते’ की बजाय प्रसंग में बुरे लोगों को बरदाश्त न करने का अर्थ स्वाभाविक ढंग से देता है।
- source_word: κακούς
  choice: बुरे लोगों
  rationale: पुल्लिंग बहुवचन विशेषण यहाँ व्यक्तियों के लिए संज्ञात्मक रूप में है; ‘लोगों’ अनावश्यक लैंगिक सीमांकन से बचता है।
- source_word: ἐπείρασας
  choice: परखा
  rationale: दावों की जाँच करके उनकी वास्तविकता निर्धारित करने के अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: λέγοντας ἑαυτοὺς ἀποστόλους
  choice: जो अपने आपको प्रेरित कहते हैं
  rationale: ἑαυτούς की आत्म-दावे वाली प्रतिवर्ती शक्ति को बनाए रखता है।
- source_word: ἀποστόλους
  choice: प्रेरित
  rationale: कलीसियाई प्रसंग में यह सामान्य संदेशवाहकों से अधिक विशिष्ट, अधिकार का दावा करने वाले प्रेषितों की उपाधि है; हिन्दी बाइबिलीय प्रयोग में ‘प्रेरित’ स्थापित है।
- source_word: ψευδεῖς
  choice: झूठा
  rationale: विधेय विशेषण के रूप में दावेदारों के असत्य/नकली सिद्ध होने का भाव देता है; ‘झूठे’ भी संभव है, पर ‘उन्हें झूठा पाया’ सामूहिक कर्म के साथ स्वाभाविक है।
theological_decisions:
- issue: ἀποστόλους की हैसियत
  choice: ‘प्रेरित’ के रूप में विशिष्ट कलीसियाई उपाधि
  alternative: ‘संदेशवाहक’
  rationale: सन्दर्भ में स्वयं को अधिकारयुक्त प्रेरित बताने वाले लोगों की जाँच है। ‘प्रेरित’ सम्भावित तकनीकी अर्थ को सुरक्षित रखता है, पर उनके दावे को सत्य नहीं मानता।
- issue: κακούς का लैंगिक निरूपण
  choice: ‘बुरे लोगों’
  alternative: ‘बुरे पुरुषों’
  rationale: यूनानी व्याकरणिक रूप पुल्लिंग है, पर यहाँ आशय सामान्यतः बुरे व्यक्तियों से है; हिन्दी में ‘लोग’ अभिप्रेत दायरे को ठीक रखता है।
- issue: ψευδεῖς में आरोप की प्रकृति
  choice: ‘उन्हें झूठा पाया’
  alternative: ‘उन्हें झूठे दावेदार पाया’ / ‘उन्हें झूठ बोलने वाला पाया’
  rationale: मूल में केवल विधेय विशेषण ‘झूठे/असत्य’ है। अनुवाद यह अस्पष्टता बनाए रखता है कि मुख्य बल उनके व्यक्ति, दावे या दोनों की असत्यता पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक बहुवचन के बजाय मूल के एकवचन सामुदायिक ‘तुम’ को बनाए रखते हुए। वाक्य-विन्यास स्पष्ट करने के लिए दूसरे खंड में ‘मैं यह भी जानता हूँ’ दोहराया गया है; अर्थ में कुछ नहीं जोड़ा गया। ‘प्रेरित’ स्थापित बाइबिलीय शब्द है और सामान्य पाठक के लिए पर्याप्त रूप से परिचित है।
