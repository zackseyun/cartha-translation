source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ ⸀τῆς ἐν Θυατείροις ἐκκλησίας γράψον· Τάδε λέγει ὁ υἱὸς τοῦ θεοῦ, ὁ ἔχων τοὺς ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός, καὶ οἱ πόδες αὐτοῦ ὅμοιοι χαλκολιβάνῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/018.yaml
  text: 'And to the angel of the church in Thyatira write: These things says the Son of God[a], the one who has his eyes like a flame of fire[b], and his feet like burnished bronze:'
translation:
  language: hi
  text: '“थुआतीरा की कलीसिया के दूत[a] को लिख: परमेश्वर का पुत्र यह कहता है—जिसकी आँखें आग की ज्वाला के समान हैं और जिसके पाँव चमकते काँसे[b] के समान हैं:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्गदूत”; यूनानी शब्द का अर्थ “संदेशवाहक” भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ प्रयुक्त यूनानी शब्द दुर्लभ है। इसका सटीक अर्थ अनिश्चित है; संभवतः यह किसी परिष्कृत, चमकती हुई धातु या मिश्रधातु को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: दूत
  rationale: ‘दूत’ यूनानी शब्द की ‘स्वर्गदूत’ और ‘संदेशवाहक’—दोनों संभावनाओं को हिन्दी में कुछ हद तक खुला रखता है; प्रकाशितवाक्य के संबोधन-सूत्र में इसका सटीक अभिप्राय विवादित है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: प्रकाशितवाक्य में यह किसी सामान्य सभा के बजाय स्थानीय मसीही समुदाय को सूचित करता है; ‘कलीसिया’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और पहचाना हुआ शब्द है।
- source_word: Τάδε λέγει
  choice: यह कहता है
  rationale: यह भविष्यद्वक्तापरक उद्घोषणा-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘ये बातें’ जैसे असहज शाब्दिक रूप पर जोर दिए।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: मूल के स्पष्ट मसीही उपाधि-वाक्य को सीधे और पूर्ण रूप में सुरक्षित रखता है।
- source_word: ὀφθαλμοὺς αὐτοῦ ὡς φλόγα πυρός
  choice: जिसकी आँखें आग की ज्वाला के समान हैं
  rationale: मूल उपमा और प्रलय-साहित्य की तीव्र दृश्यात्मकता को निकटता से बनाए रखता है।
- source_word: χαλκολιβάνῳ
  choice: चमकाई हुई काँसे जैसी धातु
  rationale: यह अत्यंत दुर्लभ और अनिश्चित धातु-संज्ञा है। यह चयन काँसे से समानता का पारंपरिक संकेत देता है, पर इसे निश्चित रूप से काँसा कहकर अनिश्चितता नहीं मिटाता।
theological_decisions:
- issue: वक्ता की मसीही आत्म-पहचान
  choice: परमेश्वर का पुत्र
  alternative: कोई कार्यात्मक या नरम किया हुआ संबोधन
  rationale: यूनानी पाठ स्पष्ट रूप से ‘परमेश्वर का पुत्र’ कहता है; अनुवाद इस उपाधि को बिना व्याख्यात्मक विस्तार या संकोचन के रखता है।
- issue: ἀγγέλῳ का अभिप्राय
  choice: दूत
  alternative: स्वर्गदूत अथवा संदेशवाहक
  rationale: ‘दूत’ दोनों अर्थों की वास्तविक संभावना को मुख्य पाठ में खुला रखता है, और पादटिप्पणी पाठक को इस अस्पष्टता से अवगत कराती है।
- issue: χαλκολίβανον की धातु की पहचान
  choice: चमकाई हुई काँसे जैसी धातु
  alternative: चमकाया हुआ काँसा; परिष्कृत चमकीली धातु या मिश्रधातु
  rationale: शब्द का सटीक धातुवैज्ञानिक अभिप्राय अनिश्चित है; इसलिए अनुवाद चमक और काँसे-सदृश स्वरूप को रखता है, पर पदार्थ की पहचान को सिद्ध तथ्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली। ‘दूत’ से मूल की अर्थगत अस्पष्टता बची रहती है। धातु-वर्णन में दुर्लभ यूनानी शब्द की अनिश्चितता मुख्य पाठ और पादटिप्पणी दोनों में स्पष्ट की गई है। प्रत्यक्ष वचन के अंत में द्विबिंदु रखा गया है क्योंकि अगले पदों में वक्तव्य जारी रहता है।
