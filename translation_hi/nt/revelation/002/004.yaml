  text: 'But I have this against you: you have abandoned your first love[a].'
translation:
  language: hi
  text: 'पर मुझे तुम्हारे विरुद्ध यह शिकायत है: तुमने अपने पहले प्रेम को छोड़ दिया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमने अपने पहले प्रेम को त्याग दिया है।” यह वाक्यांश उस प्रेम की ओर संकेत कर सकता है जो उनमें आरम्भ में था—चाहे प्रभु के प्रति, एक-दूसरे के प्रति, या दोनों के प्रति।
    reason: शब्दार्थ का विकल्प और संदर्भगत अस्पष्टता
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले पदों की प्रशंसा के साथ स्पष्ट विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔχω κατὰ σοῦ
  choice: मुझे तुम्हारे विरुद्ध यह कहना है
  rationale: यह यूनानी मुहावरे में निहित शिकायत या आरोप के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: ':'
  rationale: द्विबिंदु आगे शिकायत की विषय-वस्तु प्रस्तुत करता है और ‘क्योंकि’ कहकर कारण का अर्थ थोपने से बचता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: यह ἀγάπη का मानक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: τὴν πρώτην
  choice: पहले
  rationale: यह ‘प्रथम/आरम्भिक’ भाव को बनाए रखते हुए यह तय नहीं करता कि प्रेम का लक्ष्य प्रभु था, परस्पर विश्वासी थे, या दोनों।
- source_word: ἀφῆκες
  choice: छोड़ दिया है
  rationale: यह पीछे छोड़ देने या त्याग देने के अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है; इसकी सम्भव अधिक प्रबल छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘अपने पहले प्रेम’ का आशय
  choice: 'वाक्यांश को संक्षिप्त और खुला रखा गया है: ‘अपने पहले प्रेम’।'
  alternative: ‘वह प्रेम जो तुम्हें आरम्भ में मुझसे था’ अथवा ‘तुम्हारा आरम्भिक पारस्परिक प्रेम’।
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि प्रेम मुख्यतः मसीह के प्रति है, एक-दूसरे के प्रति है, या दोनों के प्रति; अनुवाद इस धर्मवैचारिक तनाव को नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में रखा गया है, क्योंकि यह कलीसिया-समुदाय को संबोधित है। भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध है।
