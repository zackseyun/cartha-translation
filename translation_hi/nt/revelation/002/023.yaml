  text: καὶ τὰ τέκνα αὐτῆς ἀποκτενῶ ἐν θανάτῳ· καὶ γνώσονται πᾶσαι αἱ ἐκκλησίαι ὅτι ἐγώ εἰμι ὁ ἐραυνῶν νεφροὺς καὶ καρδίας, καὶ δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/023.yaml
  text: And I will kill her children with death[a], and all the churches will know that I am the one who searches hearts and minds[b], and I will give to each of you according to your works.
translation:
  language: hi
  text: और मैं उसके बच्चों को मृत्यु से मार डालूँगा[a], और सभी कलीसियाएँ जान लेंगी कि मन और हृदय को जाँचने वाला मैं ही हूँ[b], और मैं तुम में से हर एक को तुम्हारे कामों के अनुसार दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महामारी से”; यूनानी में शाब्दिक रूप से “मृत्यु से” है। यह न्याय की तीव्रता व्यक्त कर सकता है या पुराने नियम की न्याय-संबंधी भाषा की प्रतिध्वनि हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “गुर्दों और हृदयों को”; यह बाइबलीय मुहावरा मनुष्य के भीतर के विचारों, उद्देश्यों और इच्छाओं को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: τέκνα
  choice: बच्चों
  rationale: यह सीधा और स्वाभाविक अर्थ है तथा जैविक संतान या उसके अनुयायियों—दोनों संभावनाओं को खुला रखता है।
- source_word: ἀποκτενῶ ἐν θανάτῳ
  choice: मौत से मार डालूँगा
  rationale: यूनानी की असामान्य और प्रबल अभिव्यक्ति ‘मृत्यु से मारूँगा’ तथा पुराने नियम-सदृश न्याय-भाषा को बनाए रखता है; ‘महामारी से’ संभव व्याख्या है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἐκκλησίαι
  choice: कलीसियाएँ
  rationale: प्रकाशितवाक्य में संबोधित मसीही समुदायों के लिए हिन्दी बाइबलीय प्रयोग में स्थापित और संदर्भानुकूल शब्द।
- source_word: ὁ ἐραυνῶν
  choice: जाँचने वाला
  rationale: निरंतर भेदने वाली जाँच और न्यायिक परख का भाव व्यक्त करता है।
- source_word: νεφροὺς καὶ καρδίας
  choice: मन और हृदय
  rationale: शाब्दिक ‘गुर्दों और हृदयों’ का आशय मनुष्य के छिपे विचारों, उद्देश्यों और इच्छाओं सहित भीतरी व्यक्तित्व से है; हिन्दी में ‘मन और हृदय’ इसे स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: δώσω ὑμῖν ἑκάστῳ κατὰ τὰ ἔργα ὑμῶν
  choice: मैं तुममें से हर एक को उसके कामों के अनुसार दूँगा
  rationale: ‘दूँगा’ मूल क्रिया के निकट रहता है, जबकि ‘कामों के अनुसार’ न्यायोचित प्रतिफल का भाव संदर्भ से स्पष्ट करता है।
theological_decisions:
- issue: भीतरी मनुष्य को जाँचने वाले वक्ता की पहचान
  choice: ‘जाँचने वाला मैं ही हूँ’ के रूप में प्रबल प्रथम-पुरुष आत्मपहचान बनाए रखी गई है।
  alternative: इसे केवल सामान्य जानकारी या निरीक्षण के रूप में हल्का करना।
  rationale: यूनानी पाठ पुनरुत्थित यीशु की भीतरी मनुष्य को जानने और न्याय करने की विशेषाधिकारपूर्ण सामर्थ्य को प्रबलता से प्रस्तुत करता है।
- issue: ‘उसके बच्चों’ का आशय
  choice: मुख्य पाठ में वाक्यांश को जैविक या आलंकारिक—दोनों अर्थों के लिए खुला रखा गया है।
  alternative: स्पष्ट रूप से जैविक संतान या अनुयायी कहना।
  rationale: संदर्भ अनुयायियों की ओर संकेत कर सकता है, पर यूनानी शब्द स्वयं किसी एक अर्थ को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, स्पष्ट और बाइबलीय गरिमा वाला स्वर रखा गया है। ‘मौत से मार डालूँगा’ जानबूझकर असामान्य है ताकि मूल यूनानी की तीव्रता और अस्पष्टता न मिटे; आवश्यक स्पष्टीकरण पादटिप्पणी में दिया गया है।
