id: REV.2.12
reference: Revelation 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Περγάμῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὴν ῥομφαίαν τὴν δίστομον τὴν ὀξεῖαν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/012.yaml
  text: 'And to the angel of the church in Pergamum write: These things says the one who has the sharp, double-edged sword:[a]'
translation:
  language: hi
  text: '“और पिरगमुन की कलीसिया के दूत को लिख: ‘ये बातें वह कहता है जिसके पास तेज़, दोधारी तलवार है[a]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “स्वर्गदूत” या “संदेशवाहक” हो सकता है। यहाँ यह स्पष्ट नहीं है कि अभिप्राय किसी स्वर्गीय प्राणी से है या कलीसिया के किसी मानवीय प्रतिनिधि से।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: स्वर्गदूत
  rationale: ἄγγελος का अर्थ स्वर्गीय दूत या मानवीय संदेशवाहक हो सकता है। मुख्य पाठ में प्रचलित ‘स्वर्गदूत’ रखा गया है, जबकि संदर्भित व्यक्ति की पहचान को पादटिप्पणी में खुला रखा गया है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: प्रकाशितवाक्य के मसीही संदर्भ में यह स्थानीय मसीही समुदाय को सूचित करता है; ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में स्वाभाविक और स्पष्ट है।
- source_word: γράψον
  choice: लिख
  rationale: एकवचन आज्ञार्थक रूप का सीधा और संक्षिप्त अनुवाद।
- source_word: Τάδε λέγει
  choice: ये बातें वह कहता है
  rationale: औपचारिक घोषणात्मक सूत्र को यूनानी संरचना के निकट रखते हुए हिंदी में बोधगम्य बनाया गया है।
- source_word: ὁ ἔχων
  choice: जिसके पास … है
  rationale: विशेषणात्मक कृदंत का स्वाभाविक हिंदी संबंधवाचक रूप, जो वक्ता की उपाधि-सदृश पहचान बनाए रखता है।
- source_word: ῥομφαίαν
  choice: तलवार
  rationale: शब्द बड़ी या भारी तलवार का संकेत दे सकता है, पर यहाँ सामान्य ‘तलवार’ पर्याप्त है और अनावश्यक विशिष्टता से बचाता है।
- source_word: δίστομον
  choice: दोनों ओर धार वाली
  rationale: शाब्दिक अर्थ ‘दो-मुँही’ है; तलवार के लिए यह स्वाभाविक हिंदी मुहावरा दोनों धारों को स्पष्ट करता है।
- source_word: ὀξεῖαν
  choice: तेज़
  rationale: तलवार की धार की तीक्ष्णता के लिए सहज आधुनिक हिंदी शब्द।
- source_word: Περγάμῳ
  choice: पिरगमुन
  rationale: यूनानी स्थान-नाम Πέργαμος का हिंदी बाइबलीय परंपरा में परिचित रूप।
theological_decisions:
- issue: कलीसिया के ‘स्वर्गदूत’ की पहचान
  choice: मुख्य पाठ में ‘स्वर्गदूत’ रखकर उसकी पहचान अनिर्धारित छोड़ी गई है।
  alternative: संदेशवाहक; कलीसिया का मानवीय प्रतिनिधि या अगुवा
  rationale: ἄγγελος दोनों अर्थों की अनुमति देता है और यह पद स्वयं तय नहीं करता कि संदर्भ स्वर्गीय प्राणी का है या मनुष्य का; इसलिए पादटिप्पणी वास्तविक व्याख्यात्मक तनाव सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संबोधन में एकवचन आज्ञार्थक ‘लिख’ मूल पाठ की सीधाई बनाए रखता है; ‘ये बातें वह कहता है’ प्रकाशितवाक्य 2–3 के आवर्ती औपचारिक सूत्र को सुरक्षित करता है।
