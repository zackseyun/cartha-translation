id: REV.2.24
reference: Revelation 2:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμῖν δὲ λέγω τοῖς λοιποῖς τοῖς ἐν Θυατείροις, ὅσοι οὐκ ἔχουσιν τὴν διδαχὴν ταύτην, οἵτινες οὐκ ἔγνωσαν τὰ βαθέα τοῦ Σατανᾶ, ὡς λέγουσιν, οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/024.yaml
  text: 'But to the rest of you in Thyatira I say: all who do not hold this teaching[a], who have not known the deep things of Satan, as they call them—I am not laying any other burden on you.'
translation:
  language: hi
  text: पर थुआतीरा में तुममें से बाकी लोगों से मैं कहता हूँ—उन सभी से जो इस शिक्षा को नहीं मानते और जिन्होंने ‘शैतान की गहरी बातें’ नहीं जानीं, जैसा कि वे उन्हें कहते हैं—मैं तुम पर कोई और बोझ नहीं डालता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς λοιποῖς
  choice: तुममें से ... बाकी लोगों
  rationale: यह कलीसिया के उन शेष सदस्यों को अलग दिखाता है जो उक्त शिक्षा से नहीं जुड़े थे; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐν Θυατείροις
  choice: थुआतीरा के
  rationale: स्थान-नाम का मानक देवनागरी लिप्यंतरण किया गया है और संबंध को स्वाभाविक हिंदी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: ἔχουσιν τὴν διδαχὴν ταύτην
  choice: इस शिक्षा को ... मानते
  rationale: यहाँ ἔχω केवल शिक्षा को पास रखने नहीं, बल्कि उसे अपनाने या उससे सहमत होने का भाव देता है; ‘मानते’ इस आशय को सहज हिंदी में व्यक्त करता है।
- source_word: οἵτινες οὐκ ἔγνωσαν
  choice: जिन्होंने ... नहीं जानीं
  rationale: यह अनुवाद उस ज्ञान या अनुभव में सहभागी न होने का भाव बनाए रखता है, बिना यह तय किए कि बात केवल बौद्धिक जानकारी की है या व्यावहारिक अनुभव की।
- source_word: τὰ βαθέα τοῦ Σατανᾶ
  choice: ‘शैतान की गहरी बातें’
  rationale: शाब्दिक चित्र और गहन आध्यात्मिक अंतर्दृष्टि के संभावित दावे पर व्यंग्य—दोनों सुरक्षित रहते हैं। उद्धरण-चिह्न इसे कथित पदनाम के रूप में सुनने में सहायता करते हैं।
- source_word: ὡς λέγουσιν
  choice: जैसा वे उन्हें कहते हैं
  rationale: यूनानी की रिपोर्टात्मक और कुछ अस्पष्ट अभिव्यक्ति को बनाए रखता है; यह निश्चित नहीं करता कि यह झूठे शिक्षकों का अपना दावा है या लेखक का व्यंग्यपूर्ण प्रत्युत्तर।
- source_word: οὐ βάλλω ἐφ’ ὑμᾶς ἄλλο βάρος
  choice: मैं तुम पर कोई और बोझ नहीं डालता
  rationale: आरोपित दायित्व के रूपक को स्वाभाविक आधुनिक हिंदी में अक्षुण्ण रखता है।
theological_decisions:
- issue: ‘शैतान की गहरी बातें, जैसा वे उन्हें कहते हैं’ का आशय और वक्ता
  choice: इसे एक कथित या व्यंग्यपूर्ण पदनाम के रूप में अनूदित किया गया है, पर यह तय नहीं किया गया कि पूरा पद झूठे शिक्षकों का अपना दावा है या यूहन्ना का प्रत्युत्तर।
  alternative: स्पष्ट कर देना कि झूठे शिक्षक केवल ‘गहरी बातें’ कहते थे और यूहन्ना ने उन्हें शैतान से जोड़ा; अथवा यह कहना कि वे स्वयं उन्हें ‘शैतान की गहरी बातें’ कहते थे।
  rationale: यूनानी वाक्य संक्षिप्त और विवादात्मक है तथा दोनों प्रकार की समझ की गुंजाइश देता है। अनुवाद को इस वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज। संबोधन के लिए बहुवचन ‘तुम’ रखा गया है। वाक्य की मध्यवर्ती व्याख्यात्मक संरचना को डैश से स्पष्ट किया गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि वैकल्पिक अर्थ को मुख्य पाठ की कथित अभिव्यक्ति में पर्याप्त रूप से सुरक्षित रखा गया है।
