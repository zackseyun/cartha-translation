  text: μετανόησον οὖν· εἰ δὲ μή, ἔρχομαί σοι ταχύ, καὶ πολεμήσω μετ’ αὐτῶν ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/016.yaml
  text: Therefore repent[a]. But if not, I am coming to you quickly[b], and I will make war against them with the sword of my mouth.
translation:
  language: hi
  text: इसलिए पश्चाताप करो। लेकिन यदि नहीं, तो मैं शीघ्र तुम्हारे पास आ रहा हूँ, और अपने मुँह की तलवार[b] से उनके विरुद्ध[a] युद्ध करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, ‘उनके साथ।’ लेकिन ‘युद्ध करूँगा’ के साथ यहाँ अर्थ विरोधात्मक है: ‘उनके विरुद्ध।’'
    reason: lexical_alternative
  - marker: b
    text: ‘मुँह की तलवार’ प्रकाशितवाक्य की न्याय-संबंधी छवि है; इसे केवल ‘वचन’ कहकर सपाट नहीं किया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: μετανόησον
  choice: पश्चाताप करो
  rationale: एक निर्णायक नैतिक और आत्मिक परिवर्तन की आज्ञा है। ‘पश्चाताप करो’ आधुनिक हिन्दी में इसका संक्षिप्त और प्रचलित समतुल्य है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले पदों की डाँट से निकलने वाले निष्कर्ष को स्पष्ट करता है और यूनानी के तार्किक संबंध को बनाए रखता है।
- source_word: εἰ δὲ μή
  choice: पर यदि नहीं
  rationale: शर्त और तीखे विरोध—दोनों को स्पष्ट रखते हुए चेतावनी की संक्षिप्तता बनाए रखता है।
- source_word: ἔρχομαί σοι
  choice: मैं ... तुम्हारे पास आ रहा हूँ
  rationale: वर्तमान काल के निकट-भविष्यसूचक बल को बनाए रखता है। यहाँ अपने-आप ‘तुम्हारे विरुद्ध’ नहीं जोड़ा गया, क्योंकि विरोधी कार्रवाई अगली उपवाक्य में ‘उनके विरुद्ध’ स्पष्ट है।
- source_word: ταχύ
  choice: शीघ्र
  rationale: यह समय की निकटता अथवा कार्रवाई की तेजी—दोनों का संकेत दे सकता है; ‘शीघ्र’ इस अर्थ-विस्तार को पर्याप्त रूप से खुला रखता है।
- source_word: πολεμήσω μετ’ αὐτῶν
  choice: उनके विरुद्ध युद्ध करूँगा
  rationale: πολεμέω के युद्धात्मक बल को बनाए रखता है। यद्यपि μετά के साथ सामान्य अर्थ ‘साथ’ हो सकता है, युद्ध के इस प्रसंग में संबंध विरोधात्मक है।
- source_word: ἐν τῇ ῥομφαίᾳ τοῦ στόματός μου
  choice: अपने मुँह की तलवार से
  rationale: ἐν को साधनवाचक ‘से’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है और प्रकाशितवाक्य की सजीव न्याय-संबंधी छवि को बिना सपाट व्याख्या में बदले सुरक्षित रखा गया है।
theological_decisions:
- issue: कलीसिया को संबोधन और दोषियों पर लक्षित न्याय
  choice: मसीह ‘तुम्हारे पास’ आता है, पर युद्ध ‘उनके विरुद्ध’ करता है।
  alternative: पूरी कलीसिया के विरुद्ध बिना भेद के आना, अथवा केवल झूठे शिक्षकों के पास आना
  rationale: यूनानी पाठ एकवचन संबोधन σοι और बहुवचन αὐτῶν के बीच भेद रखता है। अनुवाद सामूहिक चेतावनी और लक्षित न्याय के इस तनाव को बनाए रखता है।
- issue: न्याय के साधन की प्रकाशितवाक्यीय छवि
  choice: ‘अपने मुँह की तलवार’ को ज्यों का त्यों बनाए रखना
  alternative: ‘अपने वचन से’ या ‘अपनी वाणी की शक्ति से’
  rationale: स्रोत पाठ की सजीव प्रतीकात्मक छवि को केवल उसकी संभावित व्याख्या से बदलना साहित्यिक और धर्मवैज्ञानिक बल को घटा देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पश्चाताप’, ‘युद्ध’ और ‘मुँह की तलवार’ जैसे शब्द मूल पाठ की नैतिक गंभीरता और प्रकाशितवाक्यीय imagery को बनाए रखते हैं; वाक्यरचना साधारण हिन्दी पाठक के लिए स्वाभाविक है।
