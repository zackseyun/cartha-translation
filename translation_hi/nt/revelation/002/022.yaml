source:
  edition: SBLGNT
  text: ἰδοὺ βάλλω αὐτὴν εἰς κλίνην, καὶ τοὺς μοιχεύοντας μετ’ αὐτῆς εἰς θλῖψιν μεγάλην, ἐὰν μὴ ⸀μετανοήσωσιν ἐκ τῶν ἔργων αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/022.yaml
  text: Look[a], I am throwing her onto a bed, and those who commit adultery with her into great affliction[b], unless they repent of her works.
translation:
  language: hi
  text: देखो, मैं उसे बिस्तर पर डाल रहा हूँ[a], और जो उसके साथ व्यभिचार करते हैं, उन्हें घोर क्लेश में डाल रहा हूँ[b]—यदि वे उसके कामों से मन न फिराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रोग-शय्या पर।’ यूनानी में शाब्दिक रूप से ‘बिस्तर पर’ है; इस न्यायसूचक संदर्भ में अनेक लोग इसे दुःख या बीमारी की शय्या समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘बड़े संकट में।’ यहाँ यह वाक्यांश अत्यंत कष्ट या विपत्ति का बोध कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक, स्वाभाविक और गरिमापूर्ण है।
- source_word: βάλλω
  choice: मैं ... डाल रहा हूँ
  rationale: वर्तमान काल की सजीव और आसन्न न्यायसूचक शक्ति को बनाए रखने के लिए प्रगतिशील रूप चुना गया है; अगले खंड में हिन्दी की स्वाभाविकता के अनुसार ‘डालूँगा’ से लुप्त क्रिया स्पष्ट की गई है।
- source_word: αὐτὴν εἰς κλίνην
  choice: उसे बिस्तर पर
  rationale: κλίνη का मूल अर्थ ‘बिस्तर’ या ‘पलंग’ है। मूल पाठ स्वयं बीमारी स्पष्ट नहीं करता, इसलिए ‘रोग-शय्या’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: τοὺς μοιχεύοντας μετ’ αὐτῆς
  choice: जो उसके साथ व्यभिचार करते हैं
  rationale: यह क्रियात्मक रूप μοιχεύω के सीधे अर्थ ‘व्यभिचार करना’ को सुरक्षित रखता है और उसके संभावित प्रतीकात्मक आशय को समय से पहले नहीं खोलता।
- source_word: εἰς θλῖψιν μεγάλην
  choice: घोर क्लेश में
  rationale: θλῖψις दबाव, दुःख या क्लेश का बोध कराता है और μεγάλην उसकी तीव्रता बताता है। ‘घोर क्लेश’ हिन्दी में गंभीर पीड़ा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐὰν μὴ μετανοήσωσιν
  choice: यदि वे ... मन न फिराएँ
  rationale: शर्त को मूल की नकारात्मक संरचना के निकट रखते हुए आधुनिक हिन्दी में स्वाभाविक रूप दिया गया है। ‘मन फिराना’ पश्चात्ताप के साथ दिशा बदलने का भाव व्यक्त करता है।
- source_word: ἐκ τῶν ἔργων αὐτῆς
  choice: उसके कामों से
  rationale: ἐκ अलग होने या हटने का भाव देता है; ‘कामों से मन फिराएँ’ इस बात को स्पष्ट रखता है कि उन्हें उसके कार्यों से विमुख होना है।
theological_decisions:
- issue: क्या κλίνη को मुख्य पाठ में स्पष्टतः ‘रोग-शय्या’ कहा जाए
  choice: मुख्य पाठ में शाब्दिक ‘बिस्तर’ रखा गया
  alternative: रोग-शय्या
  rationale: संदर्भ न्याय और दुःख की ओर संकेत करता है, पर κλίνη अपने आप में बीमारी को अनिवार्य नहीं करता। इसलिए व्याख्यात्मक विकल्प पाद-टिप्पणी में रखा गया है।
- issue: क्या μοιχεύοντας को शारीरिक व्यभिचार, आत्मिक अविश्वास, या दोनों के रूप में स्पष्ट किया जाए
  choice: सीधा शब्द ‘व्यभिचार करते हैं’ रखा गया
  alternative: उसके साथ अनैतिक संबंध रखते हैं; उसके साथ आत्मिक विश्वासघात करते हैं
  rationale: मूल क्रिया सीधे व्यभिचार को व्यक्त करती है। प्रकाशितवाक्य के प्रतीकात्मक संदर्भ में व्यापक आत्मिक आशय संभव है, पर अनुवाद उस तनाव को बिना सीमित किए सुरक्षित रखता है।
- issue: पश्चात्ताप का संबंध किसके कामों से है
  choice: ‘उसके कामों से’ स्त्री के कामों की ओर संकेत करता है
  alternative: ‘अपने कामों से’—कुछ पाठ-परंपराओं में मिलने वाला पाठ
  rationale: दिए गए SBLGNT पाठ में αὐτῆς, अर्थात ‘उसके/उस स्त्री के’, है; इसलिए उसी को अनूदित किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘देखो’, ‘बिस्तर’, ‘व्यभिचार’, ‘घोर क्लेश’ और ‘मन फिराना’ परिचित बाइबलीय अर्थों को सहज हिन्दी के साथ संतुलित करते हैं। डैश अंतिम शर्त को दोनों न्यायसूचक खंडों से स्पष्टतः जोड़ता है।
