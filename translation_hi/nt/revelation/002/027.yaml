lexical_decisions:
- source_word: ποιμανεῖ
  choice: चरवाही करेगा
  rationale: यह क्रिया मूलतः चरवाहे के काम को व्यक्त करती है, पर भजन 2 की पृष्ठभूमि में राजकीय शासन का भाव भी रखती है। ‘चरवाही करेगा’ मूल रूपक और देखभाल तथा अधिकार के बीच तनाव को बनाए रखता है।
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: लोहे की छड़ी से
  rationale: ῥάβδος छड़ी, दंड या राजदंड का अर्थ दे सकता है। ‘लोहे की छड़ी’ स्वाभाविक हिन्दी में भजन 2 की कठोर राजकीय शक्ति की छवि सुरक्षित रखती है।
- source_word: ὡς
  choice: जैसे
  rationale: यह तुलना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ σκεύη τὰ κεραμικὰ
  choice: मिट्टी के बरतन
  rationale: यह सामान्य पाठक के लिए सहज है और मिट्टी से बने पात्रों की नाजुकता को स्पष्ट रखता है।
- source_word: συντρίβεται
  choice: चकनाचूर किए जाते हैं
  rationale: यह हिंसक रूप से तोड़े जाने का सशक्त भाव देता है। यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ एकवचन क्रिया सामान्य है; हिन्दी में स्वाभाविक बहुवचन प्रयोग किया गया है।
- source_word: καὶ
  choice: और
  rationale: पिछले पद की प्रतिज्ञा से संबंध बनाए रखने के लिए संयोजक को रखा गया है।
theological_decisions:
- issue: ποιμανεῖ और लोहे की छड़ी की छवि द्वारा भजन 2:9 का राजकीय-मसीही संकेत
  choice: मुख्य पाठ में ‘चरवाही करेगा’ रखकर चरवाहे का रूपक सुरक्षित किया गया है, जबकि राजकीय शासन का भाव संदर्भ और पादटिप्पणी में बना रहता है।
  alternative: ‘उन पर शासन करेगा’ कहकर राजकीय प्रभुत्व को सीधे सामने रखना।
  rationale: यूनानी पाठ सामान्य ‘शासन करना’ वाली क्रिया के बजाय ποιμαίνω का प्रयोग करता है। अतः अनुवाद को देखभाल और न्यायपूर्ण राजकीय अधिकार के बीच उपस्थित अर्थगत-धर्मवैज्ञानिक तनाव को मिटाना नहीं चाहिए।
