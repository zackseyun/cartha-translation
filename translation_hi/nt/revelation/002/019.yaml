id: REV.2.19
reference: Revelation 2:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, καὶ τὴν ⸂ἀγάπην καὶ τὴν πίστιν⸃ καὶ τὴν διακονίαν καὶ τὴν ὑπομονήν σου, καὶ τὰ ἔργα σου τὰ ἔσχατα πλείονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/019.yaml
  text: I know your works[a], your love and faith and service and endurance, and that your last works are more than the first.
translation:
  language: hi
  text: मैं तुम्हारे कामों, तुम्हारे प्रेम, विश्वास[a], सेवा और धीरज को जानता हूँ; और यह भी कि तुम्हारे बाद के काम पहले के कामों से अधिक हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता।” यहाँ यूनानी शब्द का अर्थ “विश्वास” या “विश्वासयोग्यता,” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά
  choice: मैं ... जानता हूँ
  rationale: οἶδα यहाँ वर्तमान स्थिति का बोध कराता है; प्रकाशितवाक्य में कलीसियाओं को संबोधित बार-बार आने वाले सूत्र के लिए यह स्वाभाविक हिन्दी है।
- source_word: ἔργα
  choice: कामों
  rationale: ἔργα ठोस कार्यों या आचरण को दर्शाता है। 'काम' सामान्य आधुनिक हिन्दी में सहज है और पद में इसकी पुनरावृत्ति भी बनाए रखता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη यहाँ मसीही सद्गुण के रूप में सक्रिय प्रेम को दर्शाता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις का सामान्य अर्थ 'विश्वास' है, पर इस सद्गुण-सूची में 'विश्वासयोग्यता' भी संभव है; इसलिए विकल्प को पादटिप्पणी में रखा गया है।
- source_word: διακονίαν
  choice: सेवा
  rationale: διακονία यहाँ व्यावहारिक सेवा को दर्शाता है; 'सेवा' सहज है और किसी औपचारिक पद का अनावश्यक संकेत नहीं देता।
- source_word: ὑπομονήν
  choice: धीरज
  rationale: ὑπομονή दबाव में दृढ़ बने रहने को दर्शाता है। 'धीरज' वर्तमान हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τὰ ἔργα σου τὰ ἔσχατα
  choice: तुम्हारे बाद के काम
  rationale: ἔσχατα यहाँ समयगत तुलना में पहले के कामों के विपरीत बाद के कामों को सूचित करता है; 'बाद के' हिन्दी में 'अन्तिम' की अपेक्षा आशय अधिक स्पष्ट करता है।
- source_word: πλείονα τῶν πρώτων
  choice: पहले के कामों से अधिक हैं
  rationale: πλείονα संख्या, मात्रा या विस्तार में अधिक होने का तुलनात्मक भाव रखता है। यह अनुवाद उस तुलना को बनाए रखता है, बिना यह तय किए कि श्रेष्ठता केवल गुणवत्ता की है।
theological_decisions:
- issue: सद्गुण-सूची में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: संदर्भ में यह शब्द परमेश्वर/मसीह पर विश्वास या आचरण में विश्वासयोग्यता—दोनों का बोध करा सकता है। मुख्य पाठ में सामान्य अर्थ 'विश्वास' रखा गया है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। सूची की समानांतर संरचना और ἔργα की पुनरावृत्ति बनाए रखी गई है।
