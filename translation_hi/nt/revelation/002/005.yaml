id: REV.2.5
reference: Revelation 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πόθεν ⸀πέπτωκας, καὶ μετανόησον καὶ τὰ πρῶτα ἔργα ποίησον· εἰ δὲ μή, ἔρχομαί ⸀σοι, καὶ κινήσω τὴν λυχνίαν σου ἐκ τοῦ τόπου αὐτῆς, ἐὰν μὴ μετανοήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/005.yaml
  text: Therefore remember from where you have fallen[a], and repent, and do the works you did at first. But if not, I am coming to you, and I will remove your lampstand from its place[b], unless you repent.
translation:
  language: hi
  text: इसलिए याद कर कि तू कहाँ से गिरा है[a]; मन फिरा, और वे काम कर जो तूने पहले किए थे। यदि नहीं, तो मैं तेरे पास आ रहा हूँ और तेरे दीवट को उसके स्थान से हटा दूँगा[b]—यदि तू मन न फिराए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू कितनी ऊँचाई से गिरा है।” यूनानी में शाब्दिक रूप से “तू कहाँ से गिरा है” है; कुछ लोग इसमें ऊँचाई का निहित रूपक देखते हैं।
    reason: lexical_alternative
  - marker: b
    text: प्रकाशितवाक्य 1:20 में “दीवट” कलीसिया का प्रतीक है।
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: याद कर
  rationale: वर्तमान काल की आज्ञा निरंतर स्मरण का भाव रखती है; ‘याद कर’ आधुनिक हिन्दी में स्वाभाविक और सीधी आज्ञा है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उलाहने से निकलने वाले निष्कर्ष और इस आज्ञा के तार्किक संबंध को स्पष्ट रखता है।
- source_word: πόθεν πέπτωκας
  choice: तू कहाँ से गिरा है
  rationale: यूनानी के शाब्दिक ‘कहाँ से’ और पूर्णकाल से व्यक्त वर्तमान परिणाम को बनाए रखता है; ‘कितनी ऊँचाई से’ को मुख्य पाठ में जोड़कर रूपक का अर्थ निर्धारित नहीं करता।
- source_word: μετανόησον / μετανοήσῃς
  choice: मन फिरा / मन न फिराए
  rationale: ‘मन फिराना’ नैतिक और आत्मिक परिवर्तन की स्थापित, समझने योग्य हिन्दी अभिव्यक्ति है और दोनों रूपों में एक ही मूल शब्द का संबंध बनाए रखती है।
- source_word: τὰ πρῶτα ἔργα ποίησον
  choice: वे काम कर जो तूने पहले किए थे
  rationale: πρῶτα के काल-संबंधी अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना कामों के स्वरूप को अतिरिक्त रूप से परिभाषित किए।
- source_word: εἰ δὲ μή
  choice: यदि नहीं
  rationale: यूनानी चेतावनी की संक्षिप्त और अचानक शर्त को बनाए रखता है।
- source_word: ἔρχομαί σοι
  choice: मैं तेरे पास आ रहा हूँ
  rationale: वर्तमान रूप की सजीव निकटता बनाए रखता है; ‘तेरे विरुद्ध’ जैसा अर्थ नहीं जोड़ता, जो यूनानी में स्पष्ट नहीं है।
- source_word: κινήσω
  choice: हटा दूँगा
  rationale: स्थान से चलाने का भाव यहाँ परिणामतः हटाने का है; यह न्याय-संदर्भ में स्पष्ट रहते हुए अगले वाक्यांश के साथ स्वाभाविक हिन्दी देता है।
- source_word: τὴν λυχνίαν σου
  choice: तेरे दीवट को
  rationale: λυχνία दीप रखने के आधार को दर्शाता है, स्वयं दीप को नहीं; ‘दीवट’ प्रकाशितवाक्य की प्रतीकात्मक छवि को संक्षिप्त रूप से सुरक्षित रखता है।
- source_word: ἐκ τοῦ τόπου αὐτῆς
  choice: उसके स्थान से
  rationale: स्थान से हटाने की ठोस छवि को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: दीवट हटाए जाने की चेतावनी का स्वरूप
  choice: कलीसिया के दीवट को उसके स्थान से हटाने की प्रतीकात्मक छवि को ज्यों का त्यों रखना
  alternative: इसे केवल सामूहिक गवाही की हानि, कलीसिया के अस्तित्व या दर्जे पर न्याय, अथवा व्यक्तिगत उद्धार की हानि के रूप में स्पष्ट कर देना
  rationale: प्रकाशितवाक्य 1:20 में दीवट कलीसियाओं के प्रतीक हैं, पर यह पद चेतावनी के व्यवस्थित धर्मवैज्ञानिक परिणाम को और अधिक निर्दिष्ट नहीं करता। इसलिए अनुवाद प्रतीक और उसके तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। एकवचन संबोधन के लिए ‘तू/तेरे’ रखा गया है, क्योंकि वचन इफिसुस की कलीसिया के दूत को सीधे संबोधित करता है और निकटवर्ती आज्ञाओं की एकवचनता बनाए रखता है। ‘दीवट’ बाइबिलीय प्रतीक को सुरक्षित रखता है; फुटनोट उसका संदर्भ स्पष्ट करता है।
