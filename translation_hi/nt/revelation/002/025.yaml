  text: Nevertheless[a], hold fast what you have until I come.
translation:
  language: hi
  text: फिर भी[a], जो तुम्हारे पास है, उसे मेरे आने तक दृढ़ता से थामे रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल जो तुम्हारे पास है, उसे मेरे आने तक दृढ़ता से थामे रहो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पिछले कथन के बाद अपवाद या सीमित करने वाला विरोधसूचक भाव लाता है। ‘फिर भी’ स्वाभाविक आधुनिक हिन्दी में इस भाव को व्यक्त करता है; ‘केवल’ की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: ὃ ἔχετε
  choice: जो तुम्हारे पास है
  rationale: नपुंसकलिंग सम्बन्धवाचक पद और ἔχετε मिलकर मण्डली के पास वर्तमान में जो कुछ है, उसका सामान्य संकेत देते हैं। यह हिन्दी में सहज और पर्याप्त रूप से व्यापक है।
- source_word: κρατήσατε
  choice: दृढ़ता से थामे रहो
  rationale: आज्ञार्थक क्रिया किसी वस्तु को मजबूती से पकड़े और बनाए रखने का आग्रह करती है। ‘दृढ़ता से थामे रहो’ उस सतत निष्ठा और आदेशात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄχρι οὗ ἂν
  choice: तक
  rationale: यह वक्ता के आने तक की भावी समय-सीमा बताता है; हिन्दी में ‘तक’ इसे संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: ἥξω
  choice: मेरे आने
  rationale: क्रिया आने या पहुँचने को व्यक्त करती है। ‘मेरे आने तक’ यीशु के आगमन का भाव बनाए रखता है, पर उसके स्वरूप या समय को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: क्या यीशु का कथन विशेष रूप से उनके अंतिम युगान्तकारी आगमन की ओर संकेत करता है या इस मण्डली के न्याय/निरीक्षण हेतु आने की ओर
  choice: ‘मेरे आने तक’—आगमन के प्रकार या समय को निर्दिष्ट किए बिना
  alternative: ‘जब तक मैं न्याय करने न आऊँ’ अथवा ‘मेरे अंतिम आगमन तक’
  rationale: यूनानी पाठ यहाँ आगमन के स्वरूप को स्पष्ट रूप से परिभाषित नहीं करता। अतः अनुवाद उस धर्मवैचारिक तनाव और अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और आज्ञार्थक रूप अपनाया गया है। बहुवचन सम्बोधन के लिए ‘तुम्हारे/थामे रहो’ रखा गया है, जो मण्डली को सामूहिक रूप से सम्बोधित करता है।
