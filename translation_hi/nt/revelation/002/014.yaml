source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὀλίγα, ὅτι ἔχεις ἐκεῖ κρατοῦντας τὴν διδαχὴν Βαλαάμ, ὃς ⸂ἐδίδασκεν τῷ⸃ Βαλὰκ βαλεῖν σκάνδαλον ἐνώπιον τῶν υἱῶν Ἰσραήλ, ⸀φαγεῖν εἰδωλόθυτα καὶ πορνεῦσαι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/014.yaml
  text: 'But I have a few things against you: you have there some who hold to the teaching of Balaam[a], who taught Balak to put a stumbling block before the sons of Israel, to eat food sacrificed to idols and to commit sexual immorality.'
translation:
  language: hi
  text: 'परन्तु मेरे पास तुम्हारे विरुद्ध कुछ बातें हैं: तुम्हारे यहाँ कुछ लोग हैं जो बिलाम की शिक्षा को मानते हैं, जिसने बालाक को सिखाया था कि वह इस्राएल के पुत्रों[a] के सामने ठोकर का पत्थर रखे, जिससे वे मूर्तियों को चढ़ाया हुआ भोजन खाएँ और यौन अनैतिकता करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल की सन्तान’ अथवा ‘इस्राएली।’ यूनानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγα
  choice: कुछ बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘कुछ बातें’ स्वाभाविक हिन्दी में निहित आशय स्पष्ट करता है।
- source_word: κρατοῦντας τὴν διδαχὴν
  choice: शिक्षा को थामे हुए
  rationale: κρατέω यहाँ किसी शिक्षा से दृढ़तापूर्वक जुड़े रहने को दर्शाता है; ‘थामे हुए’ मूल रूपक और निरंतर आसक्ति दोनों को बनाए रखता है।
- source_word: Βαλαάμ / Βαλὰκ
  choice: बिलाम / बालाक
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं।
- source_word: ἐδίδασκεν τῷ Βαλὰκ
  choice: बालाक को सिखाया था
  rationale: अपूर्ण भूतकाल पूर्वकालीन और प्रसंगगत शिक्षण को व्यक्त करता है; हिन्दी में ‘सिखाया था’ स्वाभाविक है और कथन को अनावश्यक रूप से लंबा नहीं करता।
- source_word: βαλεῖν σκάνδαλον
  choice: ठोकर का कारण रखे
  rationale: यह मूल रूपक को सुरक्षित रखता है और नैतिक अथवा आत्मिक पतन के प्रलोभन का संकेत देता है।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी पाठ के स्पष्ट पुल्लिंग ‘पुत्रों’ को औपचारिक रूप से बनाए रखा गया है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: φαγεῖν εἰδωλόθυτα
  choice: मूर्तियों को बलि चढ़ाया हुआ भोजन खाएँ
  rationale: εἰδωλόθυτα का उपासना-संबंधी अर्थ आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त होता है।
- source_word: πορνεῦσαι
  choice: व्यभिचार करें
  rationale: यह πορνεύω के अवैध यौन आचरण संबंधी नैतिक अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
theological_decisions:
- issue: τῶν υἱῶν Ἰσραήλ का लिंग-सटीक अथवा लिंग-निरपेक्ष अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तान; इस्राएली
  rationale: मूल पाठ में पुल्लिंग बहुवचन ‘पुत्र’ है। इसे मुख्य पाठ में सुरक्षित रखते हुए अधिक स्वाभाविक सामूहिक अर्थ पादटिप्पणी में बताया गया है।
- issue: σκάνδαλον के रूपक को बनाए रखना या उसका अर्थ खोलकर कहना
  choice: ठोकर का कारण
  alternative: फंदा; पाप में फँसाने का कारण
  rationale: मूल रूपक हिन्दी में समझ में आता है और उसे अधिक व्याख्यात्मक अर्थ में सीमित करने से बचाता है।
- issue: φαγεῖν और πορνεῦσαι का आशयात्मक संबंध
  choice: ताकि वे ... खाएँ और ... करें
  alternative: अर्थात मूर्तियों को बलि चढ़ाया हुआ भोजन खाना और व्यभिचार करना
  rationale: दोनों infinitives उस ठोकर के अभिप्रेत परिणाम या विषय को बताते हैं। ‘ताकि’ यह संबंध स्वाभाविक हिन्दी में व्यक्त करता है, पर इसे आज्ञा या स्वतंत्र आरोप के रूप में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘ठोकर का कारण’ जैसे बाइबलीय रूपक को बनाए रखा गया है, जबकि वाक्य-विन्यास को हिन्दी की स्वाभाविक प्रवाहशीलता के अनुरूप किया गया है।
