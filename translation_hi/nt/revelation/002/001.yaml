language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τῷ ἀγγέλῳ ⸀τῆς ἐν Ἐφέσῳ ἐκκλησίας γράψον· Τάδε λέγει ὁ κρατῶν τοὺς ἑπτὰ ἀστέρας ἐν τῇ δεξιᾷ αὐτοῦ, ὁ περιπατῶν ἐν μέσῳ τῶν ἑπτὰ λυχνιῶν τῶν χρυσῶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/001.yaml
  text: 'To the angel of the church in Ephesus write: These things says the one who holds the seven stars in his right hand[a], who walks among the seven golden lampstands:'
translation:
  language: hi
  text: 'इफिसुस की कलीसिया के स्वर्गदूत[a] को लिख: “जो अपने दाहिने हाथ में सात तारे थामे हुए है और सोने के सात दीपदानों के बीच चलता है, वह यह कहता है:”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संदेशवाहक।”
    reason: यूनानी ἄγγελος स्वर्गीय दूत या मानवीय संदेशवाहक, दोनों को सूचित कर सकता है।
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: स्वर्गदूत
  rationale: यह शब्द स्वर्गीय दूत या मानवीय संदेशवाहक, दोनों के लिए प्रयुक्त हो सकता है। प्रकाशितवाक्य के दर्शनात्मक संदर्भ में ‘स्वर्गदूत’ स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: यहाँ मसीही विश्वासियों के स्थानीय समुदाय के लिए आधुनिक हिन्दी में प्रचलित और स्पष्ट शब्द है।
- source_word: γράψον
  choice: लिख
  rationale: यूहन्ना को दिया गया सीधा, एकवचन आदेश सरल आज्ञार्थक रूप में व्यक्त किया गया है।
- source_word: Τάδε λέγει
  choice: वह यह कहता है
  rationale: यह भविष्यसूचक घोषणा का गंभीर सूत्र है; हिन्दी में स्वाभाविक रहते हुए इसके औपचारिक स्वर को बनाए रखता है।
- source_word: κρατῶν
  choice: थामे हुए है
  rationale: यह दृढ़ पकड़ और अधिकार का भाव देता है, बिना अर्थ को अनावश्यक रूप से बढ़ाए।
- source_word: δεξιᾷ
  choice: दाहिने हाथ
  rationale: मूल ठोस बिंब को सीधे बनाए रखता है।
- source_word: περιπατῶν
  choice: चलता है
  rationale: दीपदानों के बीच सक्रिय रूप से चलने का दृश्य स्पष्ट और सहज हिन्दी में व्यक्त होता है।
- source_word: ἐν μέσῳ
  choice: के बीच
  rationale: स्थान और निकट उपस्थिति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λυχνιῶν
  choice: दीपदानों
  rationale: यह दीप रखने के आधार को दर्शाता है, स्वयं दीप को नहीं; प्रकाशितवाक्य 1 की प्रतीकात्मक छवि से भी संगति रखता है।
- source_word: χρυσῶν
  choice: सोने के
  rationale: वस्तु के स्वर्ण से बने होने का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘कलीसिया के ἀγγέλῳ’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में ‘स्वर्गदूत’
  alternative: ‘संदेशवाहक’
  rationale: यूनानी शब्द दोनों अर्थों की अनुमति देता है। प्रकाशितवाक्य की दर्शनात्मक और स्वर्गीय पृष्ठभूमि ‘स्वर्गदूत’ के पक्ष में है, पर विवादित मानवीय अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कलीसिया,’ ‘दीपदान’ और ‘दाहिने हाथ’ जैसे प्रचलित बाइबलीय शब्दों को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक रखा गया है।
