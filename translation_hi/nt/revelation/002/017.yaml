id: REV.2.17
reference: Revelation 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις. τῷ νικῶντι δώσω ⸀αὐτῷ τοῦ μάννα τοῦ κεκρυμμένου, καὶ δώσω αὐτῷ ψῆφον λευκήν, καὶ ἐπὶ τὴν ψῆφον ὄνομα καινὸν γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/017.yaml
  text: The one who has an ear[a], let him hear what the Spirit says to the churches. To the one who conquers I will give some of the hidden manna, and I will give him a white stone, and a new name written on it[c][b], which no one knows except the one who receives it.
translation:
  language: hi
  text: जिसके कान हो, वह सुन ले कि आत्मा कलीसियाओं से क्या कहता है। जो जय पाता है[a], उसे मैं छिपाए हुए मन्ना में से कुछ दूँगा। मैं उसे एक सफेद पत्थर[b] भी दूँगा, जिस पर एक नया नाम लिखा होगा, जिसे पाने वाले के सिवा कोई नहीं जानता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो विजय पाता है” अथवा “जो बाधाओं पर विजय पाता है।”
    reason: lexical_alternative
  - marker: b
    text: “सफेद पत्थर” मतदान की गोटी, निर्दोष ठहराए जाने के चिह्न, या प्रवेश के संकेत की ओर इशारा कर सकता है; मूल पाठ यह निश्चित नहीं करता कि इनमें से कौन-सी पृष्ठभूमि अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हो
  rationale: यूनानी के एकवचन मुहावरे को निकटता से रखते हुए स्वाभाविक हिन्दी उपदेशात्मक शैली अपनाई गई है।
- source_word: ἀκουσάτω
  choice: वह सुन ले
  rationale: आज्ञार्थक भाव को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: मूल में केवल ‘आत्मा’ है; संदर्भ दिव्य आत्मा की ओर संकेत करता है, पर ‘पवित्र’ शब्द मूल में नहीं जोड़ा गया।
- source_word: ταῖς ἐκκλησίαις
  choice: कलीसियाओं से
  rationale: प्रकाशितवाक्य में संबोधित स्थानीय विश्वास-समुदायों के लिए प्रचलित और संदर्भानुकूल शब्द है; λέγει के साथ हिन्दी में ‘से कहता है’ स्वाभाविक है।
- source_word: τῷ νικῶντι
  choice: जो जय पाता है
  rationale: νικάω के विजय और दृढ़तापूर्वक बाधाओं पर पार पाने के भाव को प्राकृतिक हिन्दी में रखता है।
- source_word: τοῦ μάννα τοῦ κεκρυμμένου
  choice: छिपाए हुए मन्ना में से कुछ
  rationale: संबंधकारक रूप पदार्थ में से एक अंश दिए जाने का भाव दे सकता है; पूर्ण कृदंत मन्ना के छिपाकर रखे होने की स्थिति दर्शाता है।
- source_word: ψῆφον λευκήν
  choice: एक सफेद पत्थर
  rationale: ψῆφος के संभावित सांस्कृतिक उपयोगों में से किसी एक को निश्चित किए बिना ठोस वस्तु का न्यूनतम और स्पष्ट अनुवाद किया गया है।
- source_word: ἐπὶ τὴν ψῆφον
  choice: उस पत्थर पर
  rationale: यहाँ ἐπί लेख के पत्थर की सतह पर होने का स्थान-संबंध बताता है।
- source_word: ὄνομα καινὸν γεγραμμένον
  choice: एक नया नाम लिखा होगा
  rationale: καινός की नई गुणवत्ता अथवा पहचान और γεγραμμένον की लिखे हुए रहने की परिणामी अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ ὁ λαμβάνων
  choice: जिसे पानेवाले के सिवा कोई नहीं जानता
  rationale: संबंधवाचक उपवाक्य ‘नाम’ से जुड़ा है; मूल में प्राप्त वस्तु दोहराई नहीं गई, इसलिए हिन्दी भी अनावश्यक रूप से उसे निश्चित नहीं करती।
theological_decisions:
- issue: τῷ νικῶντι में विजय अथवा पार पाने का भाव
  choice: जो जय पाता है
  alternative: जो विजय पाता है; जो बाधाओं पर पार पाता है
  rationale: मुख्य पाठ νικάω के विजय-भाव को बनाए रखता है, जबकि पादटिप्पणी उसका व्यापक अर्थ बताती है और किसी विशिष्ट धार्मिक व्याख्या को आरोपित नहीं करती।
- issue: ψῆφος λευκή का प्रतीकात्मक अर्थ
  choice: एक सफेद पत्थर
  alternative: निर्दोष ठहराए जाने का चिह्न; प्रवेश-चिह्न; मतदान की गोटी
  rationale: मूल पद स्वयं प्रतीक की सांस्कृतिक पृष्ठभूमि स्पष्ट नहीं करता; इसलिए मुख्य पाठ तटस्थ रहता है और संभावनाएँ पादटिप्पणी में दी जाती हैं।
- issue: नाम को केवल प्राप्त करनेवाले द्वारा जानना
  choice: जिसे पानेवाले के सिवा कोई नहीं जानता
  alternative: जिसे उस पत्थर को पानेवाले के सिवा कोई नहीं जानता
  rationale: यूनानी में λαμβάνων का कर्म व्यक्त नहीं है। संक्षिप्त हिन्दी उस वास्तविक अस्पष्टता को कठोरता से हल नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कलीसिया’ और ‘मन्ना’ जैसे स्थापित बाइबिलीय शब्द बनाए गए हैं। वाक्य-संरचना हिन्दी की स्वाभाविक लय के अनुसार है, पर मूल के एकवचन संबोधन, प्रतीकात्मक अनिश्चितता और प्राप्त वस्तु संबंधी सूक्ष्म अस्पष्टता को सुरक्षित रखा गया है।
