id: REV.2.13
reference: Revelation 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Οἶδα ποῦ κατοικεῖς, ὅπου ὁ θρόνος τοῦ Σατανᾶ, καὶ κρατεῖς τὸ ὄνομά μου, καὶ οὐκ ἠρνήσω τὴν πίστιν μου ⸀καὶ ἐν ταῖς ⸀ἡμέραις Ἀντιπᾶς, ὁ μάρτυς μου, ὁ πιστός ⸀μου, ὃς ἀπεκτάνθη παρ’ ὑμῖν, ὅπου ὁ Σατανᾶς κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/013.yaml
  text: I know where you live—where Satan’s throne is[a]. Yet you hold fast my name, and you did not deny faith in me, even in the days of Antipas, my witness, my faithful one, who was killed among you[b], where Satan lives.
translation:
  language: hi
  text: मैं जानता हूँ कि तुम कहाँ रहते हो—वहाँ, जहाँ शैतान का सिंहासन है। फिर भी तुम मेरे नाम को दृढ़ता से थामे हुए हो और तुमने मुझ पर अपने विश्वास को नहीं नकारा,[a] यहाँ तक कि उन दिनों में भी जब अन्तिपास, मेरा साक्षी,[b] मेरा विश्वासयोग्य जन, तुम्हारे बीच मार डाला गया—वहाँ, जहाँ शैतान रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मेरे विश्वास से’; इसका अर्थ ‘मुझ पर विश्वास’ या ‘मेरी विश्वासयोग्यता’ भी समझा जा सकता है। यूनानी वाक्यांश संक्षिप्त है और एकाधिक अर्थ संभव बनाता है।
    reason: alternative_reading
  - marker: b
    text: या ‘मेरा शहीद’। यूनानी शब्द का अर्थ ‘साक्षी’ है, और दुःख सहने या मृत्यु के संदर्भ में यह ‘शहीद’ का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδα
  choice: मैं जानता हूँ
  rationale: यूनानी पूर्णकाल का यहाँ वर्तमान अर्थ है; यह सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: κατοικεῖς
  choice: तुम कहाँ रहते हो
  rationale: κατοικέω किसी स्थान में रहने को व्यक्त करता है; आधुनिक हिन्दी में ‘रहते हो’ स्वाभाविक है।
- source_word: ὅπου ὁ θρόνος τοῦ Σατανᾶ
  choice: वहाँ, जहाँ शैतान का सिंहासन है
  rationale: मूल की प्रलय-साहित्य संबंधी तीखी छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: κρατεῖς τὸ ὄνομά μου
  choice: तुम मेरे नाम को दृढ़ता से थामे हुए हो
  rationale: κρατέω दृढ़तापूर्वक पकड़े रहने या निष्ठा बनाए रखने का भाव देता है; ‘नाम’ को मूल के अनुरूप यथावत रखा गया है।
- source_word: οὐκ ἠρνήσω τὴν πίστιν μου
  choice: तुमने मुझ पर अपने विश्वास से इनकार नहीं किया
  rationale: संदर्भ में यह स्वाभाविक हिन्दी है और यीशु पर विश्वास न त्यागने का अर्थ व्यक्त करती है; μου की अन्य संभावित व्याख्याएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐν ταῖς ἡμέραις Ἀντιπᾶς
  choice: उन दिनों में भी जब अन्तिपास
  rationale: खंडित शाब्दिक हिन्दी से बचते हुए काल-सूचक वाक्यांश को स्पष्ट और स्वाभाविक बनाया गया है।
- source_word: ὁ μάρτυς μου
  choice: मेरा साक्षी
  rationale: μάρτυς का मूल अर्थ ‘साक्षी’ है; मृत्यु के संदर्भ में ‘शहीद’ का संभावित भाव पादटिप्पणी में दिया गया है।
- source_word: ὁ πιστός μου
  choice: मेरा विश्वासयोग्य जन
  rationale: विशेषण की स्वतंत्र समानाधिकरणीय संरचना बनाए रखता है और इसे पिछले संज्ञा-पद में विलीन नहीं करता।
- source_word: ἀπεκτάνθη παρ’ ὑμῖν
  choice: तुम्हारे बीच मार डाला गया
  rationale: निष्क्रिय क्रिया और παρά के स्थान/समुदाय-सूचक अर्थ को व्यक्त करता है, बिना यह संकेत दिए कि कलीसिया ने स्वयं उसे मारा।
theological_decisions:
- issue: τὴν πίστιν μου का अर्थ
  choice: मुख्य पाठ में ‘मुझ पर अपने विश्वास’
  alternative: ‘मेरे विश्वास’ अथवा ‘मेरी विश्वासयोग्यता’
  rationale: संदर्भ में वस्तुगत संबंध—मसीह पर विश्वास—सबसे स्वाभाविक है, पर यूनानी का संक्षिप्त संबंधकारक वाक्यांश एकाधिक अर्थ दे सकता है; इसलिए विकल्प पादटिप्पणी में रखे गए हैं।
- issue: मृत्यु के संदर्भ में μάρτυς
  choice: मुख्य पाठ में ‘साक्षी’
  alternative: ‘शहीद’
  rationale: ‘साक्षी’ मूल शब्दार्थ को सुरक्षित रखता है; अन्तिपास की हत्या के संदर्भ में विकसित ‘शहीद’ अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सहज शैली। ‘तुम’ मूल के एकवचन संबोधन के अनुरूप है। प्रलय-साहित्य की छवियाँ और मूल की धार्मिक अस्पष्टताएँ बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखी गई हैं।
