  yaml_path: translation/nt/revelation/002/029.yaml
  text: The one who has an ear, let him hear what the Spirit says to the churches.
translation:
  language: hi
  text: जिसके कान हों, वह सुन ले कि आत्मा कलीसियाओं से क्या कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हों
  rationale: यूनानी में शाब्दिक रूप से एकवचन ‘जिसके एक कान हो’ है, पर हिंदी में ‘जिसके कान हों’ स्वाभाविक, कहावत-जैसी अभिव्यक्ति है और सुनने तथा ग्रहण करने की क्षमता का भाव बनाए रखती है।
- source_word: ἀκουσάτω
  choice: वह सुन ले
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया का गंभीर आह्वान हिंदी में स्वाभाविक रूप से व्यक्त होता है; यह केवल ध्वनि सुनने नहीं, ध्यान देकर ग्रहण करने का संकेत भी बनाए रखता है।
- source_word: τί
  choice: क्या
  rationale: यह आत्मा के कथन की विषयवस्तु प्रस्तुत करता है; ‘क्या’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रकाशितवाक्य 2–3 के आवर्ती सूत्र में यह परमेश्वर के आत्मा का सूचक है। हिंदी में सम्मानसूचक संदर्भ से पहचान स्पष्ट रहती है, बिना मूल पाठ में व्याख्यात्मक शब्द जोड़ने के।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमानकालीन क्रिया को सामान्य और स्वाभाविक हिंदी में व्यक्त करता है तथा आत्मा के निरंतर प्रासंगिक कथन का भाव रहने देता है।
- source_word: ταῖς ἐκκλησίαις
  choice: कलीसियाओं से
  rationale: ἐκκλησία यहाँ प्रकाशितवाक्य 2–3 में संबोधित मसीही समुदायों को दर्शाता है। ‘कलीसिया’ हिंदी बाइबलीय प्रयोग में स्थापित शब्द है; ‘से’ कहना हिंदी में किसी संबोधित समूह से बोलने का स्वाभाविक रूप है।
theological_decisions:
- issue: ‘आत्मा’ का संदर्भ
  choice: कलीसियाओं से बोलने वाला परमेश्वर का आत्मा
  alternative: मानवीय आत्मा अथवा केवल यीशु के संदेश का रूपक
  rationale: प्रकाशितवाक्य 2–3 का आवर्ती समापन-सूत्र आत्मा को सभी कलीसियाओं को संबोधित करने वाले दिव्य वक्ता के रूप में प्रस्तुत करता है। अनुवाद ‘पवित्र’ जैसा व्याख्यात्मक शब्द जोड़े बिना ‘आत्मा’ रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘जिसके कान हों’ हिंदी की स्वाभाविक बहुवचन अभिव्यक्ति है, यद्यपि यूनानी में ‘कान’ एकवचन है। ‘वह सुन ले’ पद के गंभीर आज्ञार्थक स्वर को बनाए रखता है।
