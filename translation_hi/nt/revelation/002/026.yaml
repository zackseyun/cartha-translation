  yaml_path: translation/nt/revelation/002/026.yaml
  text: And to the one who conquers and keeps my works until the end[a], I will give authority over the nations[c][b],
translation:
  language: hi
  text: और जो विजय पाता है[a] और मेरे कामों[b] को अंत तक थामे रहता है, उसे[c] मैं राष्ट्रों पर अधिकार दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो विजयी होता है’ अथवा ‘जो जय पाता है।’
    reason: lexical_alternative
  - marker: b
    text: ‘मेरे कामों’ का अर्थ यीशु के अपने काम, उसके उद्देश्यों या आदर्श के अनुरूप काम, अथवा उसके द्वारा अपेक्षित काम हो सकता है; यूनानी इनके संबंध को अधिक स्पष्ट नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में यहाँ एकवचन पुल्लिंग रूप हैं—‘जो ... उसे’; उनका प्रयोग प्रतिनिधिक अर्थ में हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ νικῶν
  choice: जो विजय पाता है
  rationale: लेखयुक्त वर्तमान कृदंत उस व्यक्ति को दर्शाता है जिसकी पहचान निरंतर विजय पाने से होती है। ‘विजय पाता है’ प्रकाशितवाक्य की संघर्ष-संबंधी छवि को बनाए रखता है।
- source_word: ὁ τηρῶν
  choice: निभाता रहता है
  rationale: τηρέω में थामे रखने, पालन करने और बनाए रखने का भाव है। ‘निभाता रहता है’ हिन्दी में स्वाभाविक है और लगातार विश्वासयोग्य आचरण का भाव देता है, बिना इसे केवल आज्ञापालन तक सीमित किए।
- source_word: ἄχρι τέλους
  choice: अंत तक
  rationale: यह सीधा कालवाचक पद है, जो अंतिम बिंदु तक दृढ़ बने रहने को व्यक्त करता है।
- source_word: τὰ ἔργα μου
  choice: मेरे कामों
  rationale: स्वामित्व-संबंध को ‘मेरे’ के द्वारा यथावत रखा गया है; इसे ‘मेरी आज्ञाएँ’ या ‘मेरे लिए किए गए काम’ बनाकर संबंध को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- source_word: δώσω αὐτῷ
  choice: उसे मैं ... दूँगा
  rationale: भविष्यकालीन क्रिया और एकवचन परोक्ष कर्म दोनों स्पष्ट रखे गए हैं। हिन्दी का ‘उसे’ स्वाभाविक रूप से प्रतिनिधिक एकवचन व्यक्त करता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ शब्द शासन करने का प्रदत्त अधिकार बताता है; ‘शक्ति’ की अपेक्षा ‘अधिकार’ अधिक सटीक है।
- source_word: ἐπὶ τῶν ἐθνῶν
  choice: राष्ट्रों पर
  rationale: ἐπί के साथ संबंध शासन-अधिकार का है, और ἔθνη यहाँ संसार के राष्ट्रों या जनसमूहों को सूचित करता है।
theological_decisions:
- issue: ‘मेरे कामों’ का संबंध
  choice: ‘मेरे कामों’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘मेरी आज्ञाओं का पालन’ या ‘मेरे लिए काम’
  rationale: यूनानी संबंध यह स्पष्ट नहीं करता कि ये यीशु द्वारा किए गए, उससे संबंधित, उसके अनुरूप, या उसके द्वारा अपेक्षित काम हैं। अनुवाद इस अर्थगत और धर्मवैचारिक तनाव को खुला रखता है।
- issue: प्रतिनिधिक एकवचन पुल्लिंग
  choice: स्वाभाविक हिन्दी प्रतिनिधिक एकवचन ‘जो ... उसे’
  alternative: स्पष्ट पुल्लिंग रूप जोड़ना
  rationale: यूनानी में कृदंत और सर्वनाम पुल्लिंग एकवचन हैं, पर प्रयोग प्रतिनिधिक है। हिन्दी में ‘जो’ और ‘उसे’ लिंग-निरपेक्ष रूप से उसी एकवचन संरचना को स्वाभाविक ढंग से रखते हैं; ‘पुरुष’ जोड़ना पुरुष-मात्र का अर्थ पैदा कर सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निभाता रहता है’ निरंतरता और विश्वासयोग्य पालन दोनों व्यक्त करता है, जबकि ‘मेरे कामों’ की मूल अस्पष्टता को बनाए रखता है।
