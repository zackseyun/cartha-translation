id: REV.2.9
reference: Revelation 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἶδά ⸀σου τὴν θλῖψιν καὶ τὴν πτωχείαν, ἀλλὰ πλούσιος εἶ, καὶ τὴν βλασφημίαν ἐκ τῶν λεγόντων Ἰουδαίους εἶναι ἑαυτούς, καὶ οὐκ εἰσίν, ἀλλὰ συναγωγὴ τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/009.yaml
  text: I know your affliction and your poverty—but you are rich—and the slander of those who say that they are Jews and are not[b][a], but are a synagogue of Satan.
translation:
  language: hi
  text: मैं तुम्हारे क्लेश और तुम्हारी गरीबी को जानता हूँ—फिर भी तुम धनी हो—और उन लोगों की निन्दा[a] को भी, जो अपने आपको यहूदी कहते हैं, पर हैं नहीं, बल्कि शैतान का आराधनालय[b] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निन्दा’ के लिए प्रयुक्त यूनानी शब्द का अनुवाद ‘अपमानजनक बातें’ या कुछ प्रसंगों में ‘ईशनिन्दा’ भी हो सकता है। यहाँ इसका आशय विश्वासियों के विरुद्ध कही गई शत्रुतापूर्ण, बदनाम करने वाली बातें हैं।
    reason: lexical_alternative
  - marker: b
    text: ‘आराधनालय’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘सभा’ या ‘एकत्र समुदाय’ भी हो सकता है। यहाँ शब्द को शाब्दिक रूप से रखा गया है, जबकि उसका प्रयोग एक तीखे विवादात्मक कथन में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θλῖψιν
  choice: क्लेश
  rationale: यह शब्द दबाव, दुःख और उत्पीड़न को व्यक्त करता है। ‘क्लेश’ संक्षिप्त और गरिमापूर्ण है तथा यहाँ किसी विशेष अन्त-समय संबंधी तकनीकी अर्थ को अनिवार्य नहीं बनाता।
- source_word: πτωχείαν
  choice: गरीबी
  rationale: यह सामान्य और स्पष्ट हिन्दी शब्द मूल के आर्थिक अभाव के अर्थ को सीधे व्यक्त करता है, बिना उसकी मात्रा बढ़ाए।
- source_word: πλούσιος
  choice: धनी
  rationale: भौतिक गरीबी के साथ मूल पाठ के तीखे विरोधाभास को बनाए रखता है और धन के स्वरूप को ‘आत्मिक’ जोड़कर स्पष्ट नहीं करता।
- source_word: βλασφημίαν
  choice: निन्दा
  rationale: इस प्रसंग में आशय विश्वासियों के विरुद्ध अपमानजनक या बदनाम करने वाली वाणी से है। ‘निन्दा’ हिन्दी में यह अर्थ स्वाभाविक रूप से दे सकती है, जबकि ‘ईशनिन्दा’ अनुचित रूप से केवल परमेश्वर-विरोधी वाणी का संकेत देगी।
- source_word: ἐκ τῶν λεγόντων
  choice: उन लोगों की ... जो ... कहते हैं
  rationale: ἐκ यहाँ निन्दा के स्रोत को बताता है। हिन्दी में संबंधसूचक ‘उन लोगों की निन्दा’ स्वाभाविक ढंग से उन्हीं को उस वाणी का स्रोत ठहराता है।
- source_word: Ἰουδαίους εἶναι ἑαυτούς
  choice: अपने आपको यहूदी कहते हैं
  rationale: यह मूल के आत्म-संबंधी बल को स्वाभाविक हिन्दी में सुरक्षित रखता है और ‘सच्चे यहूदी’ जैसा अनुपस्थित विशेषण नहीं जोड़ता।
- source_word: συναγωγὴ
  choice: सभा
  rationale: συναγωγή का अर्थ सभा या एकत्र समुदाय हो सकता है। हिन्दी में ‘सभा’ मूल अर्थ को स्पष्ट रखती है; ऐतिहासिक रूप से विशिष्ट ‘आराधनालय’ कहने पर किसी भवन का अर्थ जरूरत से अधिक प्रमुख हो सकता है।
- source_word: τοῦ Σατανᾶ
  choice: शैतान की
  rationale: संबंधकारक की तीखी और सीधी अभिव्यक्ति को बिना नरम किए सुरक्षित रखता है।
theological_decisions:
- issue: ‘जो अपने आपको यहूदी कहते हैं, पर हैं नहीं’ का विवादात्मक कथन
  choice: ‘यहूदी’ को अक्षरशः रखा गया और मूल विरोध को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया।
  alternative: ‘जो अपने आपको परमेश्वर के लोग कहते हैं’ अथवा ‘जो अपने आपको सच्चे यहूदी कहते हैं’
  rationale: Ἰουδαίους स्पष्ट रूप से ‘यहूदी’ कहता है। जातीय पहचान के विषय में कोई अतिरिक्त निष्कर्ष जोड़ना या ‘सच्चे’ जैसा विशेषण लगाना मूल की धर्मवैचारिक तनातनी को समय से पहले सुलझा देगा।
- issue: ‘तुम धनी हो’ में धन का स्वरूप
  choice: ‘आत्मिक रूप से’ जैसे स्पष्टीकरण के बिना ‘तुम धनी हो’ रखा गया।
  alternative: ‘तुम आत्मिक रूप से धनी हो’
  rationale: संदर्भ गैर-भौतिक समृद्धि का संकेत देता है, पर यूनानी विशेषण को किसी योग्यता से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘क्लेश’, ‘धनी’, ‘निन्दा’ और ‘सभा’ सामान्य पाठक के लिए समझने योग्य हैं तथा मूल पाठ की संक्षिप्तता, विरोधाभास और कठोर विवादात्मक स्वर को बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
