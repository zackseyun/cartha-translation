  text: So you also have those who hold to the teaching of the Nicolaitans likewise[a].
translation:
  language: hi
  text: इस प्रकार तुम्हारे यहाँ भी ऐसे लोग हैं, जो नीकुलाइयों की शिक्षा को उसी तरह थामे हुए हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी प्रकार तुम्हारे यहाँ भी ऐसे लोग हैं, जो नीकुलाइयों की शिक्षा को थामे हुए हैं।” यूनानी ‘उसी तरह’ का संबंध शिक्षा को थामे रहने से भी हो सकता है और पिछले पद में बताए लोगों के साथ व्यापक तुलना से भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले पद की स्थिति से तुलना और वर्तमान निष्कर्ष—दोनों का संकेत देता है।
- source_word: ἔχεις καὶ σὺ
  choice: तुम्हारे यहाँ भी ... लोग हैं
  rationale: शाब्दिक अर्थ ‘तुम भी रखते हो’ है, पर संदर्भ में कलीसिया के बीच ऐसे लोगों की उपस्थिति अभिप्रेत है; यह हिंदी में स्वाभाविक रहते हुए ‘भी’ का तुलनात्मक बल बचाता है।
- source_word: κρατοῦντας
  choice: थामे हुए हैं
  rationale: यह किसी शिक्षा को दृढ़ता से पकड़े रहने या उसका पालन करने का भाव रखता है; ‘थामे हुए’ मूल क्रिया की सजीवता बनाए रखता है।
- source_word: τὴν διδαχὴν
  choice: शिक्षा
  rationale: ‘शिक्षा’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है तथा अनावश्यक रूप से पारिभाषिक ‘सिद्धांत’ से बचती है।
- source_word: Νικολαϊτῶν
  choice: नीकुलइयों
  rationale: समूह के यूनानी नाम का हिंदी लिप्यंतरण है; संबंधसूचक रूप वाक्य में स्वाभाविक है।
- source_word: ὁμοίως
  choice: उसी तरह
  rationale: यह पिछले पद से समानता अथवा शिक्षा को समान रीति से थामने—दोनों संभावित संबंधों को व्यक्त कर सकता है; इसकी अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ὁμοίως का वाक्य में संबंध
  choice: मुख्य पाठ में आरंभिक ‘इसी प्रकार’ द्वारा व्यापक तुलना व्यक्त की गई है और पादटिप्पणी में अंतिम क्रियाविशेषण की संभावित भूमिका बताई गई है।
  alternative: ‘तुम्हारे यहाँ भी ऐसे लोग हैं, जो उसी तरह नीकुलइयों की शिक्षा को थामे हुए हैं।’
  rationale: यूनानी में οὕτως और वाक्यांत के ὁμοίως दोनों तुलनात्मक संकेत देते हैं। हिंदी में दोनों को अलग-अलग स्पष्ट रूप से रखने पर वाक्य बोझिल और अर्थ कृत्रिम रूप से निश्चित हो सकता है; पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘तुम्हारे यहाँ’ सामुदायिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है; ‘थामे हुए’ मूल क्रिया के बल को बनाए रखता है।
