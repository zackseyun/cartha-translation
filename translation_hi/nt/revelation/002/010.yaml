id: REV.2.10
reference: Revelation 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀μηδὲν φοβοῦ ἃ μέλλεις ⸀πάσχειν. ⸀ἰδοὺ μέλλει ⸀βάλλειν ὁ διάβολος ἐξ ὑμῶν εἰς φυλακὴν ἵνα πειρασθῆτε, καὶ ⸀ἕξετε θλῖψιν ἡμερῶν δέκα. γίνου πιστὸς ἄχρι θανάτου, καὶ δώσω σοι τὸν στέφανον τῆς ζωῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/010.yaml
  text: Do not fear what you are about to suffer[a]. Look, the devil is about to throw some of you into prison so that you may be tested, and you will have tribulation for ten days. Be faithful until death[c][b], and I will give you the crown of life.
translation:
  language: hi
  text: जो कुछ तुझे सहना पड़ने वाला है, उससे मत डर। देख, शैतान तुम में से कुछ को जेल में डालने वाला है, ताकि तुम परखे जाओ[a], और तुम्हें दस दिन तक क्लेश होगा। मृत्यु तक विश्वासयोग्य रह[b], और मैं तुझे जीवन का मुकुट[c] दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘ताकि तुम्हारी परीक्षा हो’ या ‘ताकि तुम्हें प्रलोभन में डाला जाए’ भी हो सकता है; यूनानी क्रिया प्रसंग के अनुसार परखे जाने, परीक्षा होने या प्रलोभन में डाले जाने को दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘मृत्यु तक’ का अर्थ ‘मृत्यु की हद तक’ भी हो सकता है—अर्थात यदि निष्ठावान रहने के लिए मृत्यु सहनी पड़े, तब भी।
    reason: alternative_reading
  - marker: c
    text: ‘मुकुट’ के लिए प्रयुक्त यूनानी शब्द स्तेफानोस विजेता को दी जाने वाली माला या पुरस्कार को दर्शाता है, राजकीय ताज को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: μηδὲν φοβοῦ
  choice: मत डर
  rationale: निषेधात्मक आज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘किसी बात से भयभीत न हो’ की अपेक्षा अधिक सीधा है।
- source_word: ἃ μέλλεις πάσχειν
  choice: जो कुछ तुझे सहना है
  rationale: μέλλω की निकट भविष्य की भावना और πάσχω के दुःख सहने के अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἰδοὺ
  choice: देख
  rationale: आगे कही जाने वाली बात की ओर ध्यान खींचने वाले उद्गार का संक्षिप्त और वर्तमान हिन्दी रूप।
- source_word: μέλλει βάλλειν
  choice: डालने वाला है
  rationale: आसन्न कार्रवाई को व्यक्त करता है; जेल के साथ ‘डालना’ हिन्दी का स्वाभाविक प्रयोग है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: यहाँ शब्द व्यक्तिगत अलौकिक विरोधी की प्रचलित उपाधि के रूप में प्रयुक्त है।
- source_word: ἐξ ὑμῶν
  choice: तुम में से कुछ को
  rationale: समूह में से एक हिस्से को चुने जाने का अर्थ स्पष्ट और सहज रूप से व्यक्त होता है।
- source_word: εἰς φυλακήν
  choice: जेल में
  rationale: φυλακή यहाँ कारावास को दर्शाता है; ‘जेल’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἵνα πειρασθῆτε
  choice: ताकि तुम परखे जाओ
  rationale: πειράζω के परीक्षा, आज़माइश और प्रलोभन के अर्थ-क्षेत्र में यहाँ उत्पीड़न द्वारा परखे जाने का भाव प्रसंगानुकूल है, जबकि अन्य संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ἕξετε θλῖψιν
  choice: तुम्हें क्लेश होगा
  rationale: θλῖψις की गंभीर पीड़ा और दबाव की भावना को ‘क्लेश’ संक्षेप में बनाए रखता है।
- source_word: ἡμερῶν δέκα
  choice: दस दिन तक
  rationale: कालावधि सूचक संबंधकारक का हिन्दी में स्वाभाविक रूप।
- source_word: γίνου πιστός
  choice: विश्वासयोग्य रह
  rationale: आज्ञा में निष्ठा की अवस्था में बने रहने का भाव है; ‘रह’ उस निरंतरता को स्पष्ट करता है।
- source_word: ἄχρι θανάτου
  choice: मृत्यु तक
  rationale: यूनानी पद का सीधा रूप, जो जीवन के अंत तक निष्ठा और मृत्यु का सामना करने तक निष्ठा—दोनों संभावनाएँ खुली रखता है।
- source_word: τὸν στέφανον τῆς ζωῆς
  choice: जीवन का मुकुट
  rationale: रूपक और संबंधकारक की वास्तविक अस्पष्टता को बनाए रखता है; στέφανος की सांस्कृतिक विशेषता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: उत्पीड़न के प्रसंग में πειρασθῆτε का अर्थ
  choice: परखे जाओ
  alternative: तुम्हारी परीक्षा हो; तुम प्रलोभन में डाले जाओ
  rationale: कारावास और क्लेश का प्रसंग विश्वास की परख की ओर संकेत करता है, पर क्रिया के प्रलोभन संबंधी संभावित अर्थ को पादटिप्पणी में बनाए रखा गया है।
- issue: ἄχρι θανάτου का बल
  choice: मृत्यु तक
  alternative: मृत्यु की हद तक; चाहे मृत्यु ही क्यों न सहनी पड़े
  rationale: सीधा अनुवाद आजीवन निष्ठा और संभावित शहादत दोनों को समाहित करता है, बिना अर्थ को केवल एक विकल्प तक सीमित किए।
- issue: στέφανος का रूपक
  choice: मुकुट
  alternative: विजय-माला; पुरस्कार की माला
  rationale: ‘जीवन का मुकुट’ हिन्दी बाइबलीय भाषा में सुबोध रूपक है; इसे राजकीय ताज समझने से रोकने के लिए सांस्कृतिक विवरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सीधा रूप अपनाया गया है। मूल पाठ के एकवचन सम्बोधन (‘तुझे’, ‘रह’) और समुदाय के लिए बहुवचन (‘तुम में से’, ‘तुम परखे जाओ’) का परिवर्तन सुरक्षित रखा गया है। ‘क्लेश’, ‘विश्वासयोग्य’ और ‘जीवन का मुकुट’ जैसे पद प्रकाशना की गंभीर धार्मिक शैली बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
