  rationale: καὶ ἐγώ का साझा रुख दर्शाने वाला स्वाभाविक हिन्दी रूप है।
- source_word: μισῶ
  choice: घृणा करता हूँ
  rationale: पहले आए μισεῖς के समान शब्दावली रखकर मूल की पुनरावृत्ति और तीव्रता सुरक्षित रखता है।
theological_decisions:
- issue: घृणा का विषय
  choice: घृणा का प्रत्यक्ष विषय नीकुलाइयों के काम हैं, स्वयं वे लोग नहीं।
  alternative: ढीला अनुवाद लोगों से घृणा का अर्थ दे सकता था।
  rationale: τὰ ἔργα प्रत्यक्ष कर्म है; अनुवाद मूल पाठ की सीमा बनाए रखता है।
- issue: वक्ता का कलीसिया के रुख से सामंजस्य
  choice: ‘जिनसे मैं भी घृणा करता हूँ’
  alternative: ‘जिनसे मुझे भी घृणा है’
  rationale: यह जी उठे यीशु और संबोधित समुदाय के समान रुख को सीधे व्यक्त करता है तथा μισέω की क्रियात्मक पुनरावृत्ति बनाए रखता है।
