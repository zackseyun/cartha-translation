id: REV.2.20
reference: Revelation 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ ἔχω κατὰ σοῦ ὅτι ἀφεῖς τὴν ⸀γυναῖκα Ἰεζάβελ, ἡ ⸀λέγουσα ἑαυτὴν προφῆτιν, καὶ διδάσκει καὶ πλανᾷ τοὺς ἐμοὺς δούλους πορνεῦσαι καὶ φαγεῖν εἰδωλόθυτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/002/020.yaml
  text: 'But I have this against you: you tolerate the woman Jezebel[c][b][a], who calls herself a prophetess and teaches and deceives my servants to commit sexual immorality and to eat food sacrificed to idols.'
translation:
  language: hi
  text: लेकिन मुझे तुम्हारे विरुद्ध यह शिकायत है कि तुम उस स्त्री ईज़ेबेल[a] को सहन करते हो, जो अपने आपको भविष्यवक्त्री[b] कहती है और मेरे दासों को सिखाती और बहकाती[c] है कि वे यौन अनैतिकता करें और मूर्तियों को बलि चढ़ाया हुआ भोजन खाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “उस स्त्री ईज़ेबेल” के स्थान पर “तुम्हारी पत्नी ईज़ेबेल” है।
    reason: textual_variant
  - marker: b
    text: या “जो अपने आपको भविष्यवक्त्री होने का दावा करती है।”
    reason: lexical_alternative
  - marker: c
    text: या “भटका देती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: लेकिन
  rationale: यह पिछले संदर्भ की प्रशंसा के साथ स्पष्ट विरोध प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔχω κατὰ σοῦ
  choice: मुझे तुम्हारे विरुद्ध यह कहना है
  rationale: यूनानी मुहावरे का आरोप या शिकायत वाला भाव सहज हिन्दी में व्यक्त होता है।
- source_word: ἀφεῖς
  choice: सहन करते हो
  rationale: यह किसी हानिकारक आचरण को चलते रहने देने की दोषपूर्ण अनुमति दर्शाता है।
- source_word: τὴν γυναῖκα Ἰεζάβελ
  choice: उस स्त्री ईज़ेबेल
  rationale: प्रमाणित पाठ के 'स्त्री ईज़ेबेल' को बनाए रखता है और पाठांतर 'तुम्हारी पत्नी' को मुख्य पाठ में नहीं लाता।
- source_word: ἡ λέγουσα ἑαυτὴν προφῆτιν
  choice: जो अपने आपको भविष्यवक्त्री कहती है
  rationale: स्त्रीलिंग संज्ञा और स्वयं घोषित पहचान, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: διδάσκει καὶ πλανᾷ
  choice: शिक्षा देकर बहकाती है
  rationale: 'दोनों वर्तमान क्रियाओं को स्वाभाविक हिन्दी संबंध में रखता है: उसकी शिक्षा उसके भटकाने का साधन है, जबकि दोनों क्रियात्मक तत्व बने रहते हैं।'
- source_word: τοὺς ἐμοὺς δούλους
  choice: मेरे दासों
  rationale: स्वामित्व और मसीह से बँधे होने का बल सुरक्षित रखता है; 'सेवकों' की अपेक्षा δοῦλος का अधिक पारदर्शी अनुवाद है।
- source_word: πορνεῦσαι
  choice: व्यभिचार करें
  rationale: यहाँ अनैतिक यौन आचरण का संक्षिप्त और प्रचलित बाइबलीय हिन्दी रूप है, यद्यपि इसका अर्थ केवल वैवाहिक बेवफाई तक सीमित नहीं समझा जाना चाहिए।
- source_word: φαγεῖν εἰδωλόθυτα
  choice: मूर्तियों को बलि चढ़ाया हुआ भोजन खाएँ
  rationale: मूर्तिपूजक बलि से जुड़े भोजन का अर्थ स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईज़ेबेल की पहचान
  choice: नाम/उपाधि 'ईज़ेबेल' को बिना व्याख्यात्मक निर्णय के बनाए रखा गया है।
  alternative: इसे वास्तविक व्यक्तिगत नाम या पुराने नियम की ईज़ेबेल की ओर संकेत करने वाला प्रतीकात्मक नाम मानना।
  rationale: यह पद स्वयं यह तय नहीं करता कि नाम शाब्दिक है या प्रतीकात्मक; अनुवाद इस अस्पष्टता को सुरक्षित रखता है।
- issue: δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: '''मेरे'' के साथ यह शब्द मसीह के अधिकार और उनसे बँधे संबंध पर बल देता है; इसलिए अधिक कठोर परंतु स्रोत-सन्निकट ''दास'' चुना गया है।'
- issue: πορνεῦσαι का अर्थ-क्षेत्र
  choice: व्यभिचार करें
  alternative: यौन अनैतिकता करें
  rationale: प्रचलित और गरिमापूर्ण हिन्दी के लिए 'व्यभिचार' चुना गया है, पर इसे केवल विवाहित व्यक्ति के परस्त्री/परपुरुष संबंध तक सीमित करने का अभिप्राय नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और आरोपात्मक लहजा रखा गया है। 'भविष्यवक्त्री' स्त्रीलिंग रूप को स्पष्ट करता है; 'दास' स्रोत के स्वामित्व-संबंधी बल को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदांश के तुरंत बाद दिए गए हैं।
