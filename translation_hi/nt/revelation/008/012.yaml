id: REV.8.12
reference: Revelation 8:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ τέταρτος ἄγγελος ἐσάλπισεν· καὶ ἐπλήγη τὸ τρίτον τοῦ ἡλίου καὶ τὸ τρίτον τῆς σελήνης καὶ τὸ τρίτον τῶν ἀστέρων, ἵνα σκοτισθῇ τὸ τρίτον αὐτῶν καὶ ⸂ἡ ἡμέρα μὴ φάνῃ τὸ τρίτον αὐτῆς⸃, καὶ ἡ νὺξ ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/012.yaml
  text: And the fourth angel sounded the trumpet[a], and a third of the sun and a third of the moon and a third of the stars was struck, so that a third of them was darkened, and the day did not shine for a third of it, and the night likewise.
translation:
  language: hi
  text: और चौथे स्वर्गदूत ने तुरही फूँकी; तब सूर्य के एक तिहाई, चाँद के एक तिहाई और तारों के एक तिहाई भाग पर प्रहार किया गया, ताकि उनका एक तिहाई भाग अंधकारमय हो जाए और दिन अपने एक तिहाई भाग तक प्रकाश न दे[a], और रात भी वैसे ही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि दिन अपने एक तिहाई भाग तक प्रकाश न दे सके।” यूनानी रचना में यहाँ ‘ताकि’ के बाद प्रयोजन-सदृश भाव अधिक स्पष्ट माना जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: यह क्रिया तुरही बजाने या फूँकने को व्यक्त करती है। आधुनिक हिन्दी में ‘तुरही फूँकी’ स्वाभाविक और स्पष्ट है।
- source_word: ἐπλήγη
  choice: पर प्रहार हुआ
  rationale: यूनानी निष्क्रिय रूप प्रहार किए जाने का अर्थ देता है। यह चयन न्याय की तीव्र छवि और निष्क्रिय वाच्य दोनों बनाए रखता है।
- source_word: τὸ τρίτον
  choice: एक तिहाई भाग
  rationale: यह मात्रा को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है; पुनरावृत्ति मूल पाठ के क्रम और बल को सुरक्षित रखती है।
- source_word: ἥλιος / σελήνη / ἀστέρες
  choice: सूर्य / चाँद / तारे
  rationale: ये आकाशीय पिंडों के सीधे अर्थ हैं। ‘चाँद’ सामान्य आधुनिक हिन्दी में सहज है और गरिमापूर्ण संदर्भ में भी उपयुक्त है।
- source_word: ἵνα
  choice: ताकि
  rationale: ἵνα प्रयोजन या परिणाम दोनों की छाया रख सकता है। ‘ताकि’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी संभाव्य भाव को सुरक्षित रखती है।
- source_word: σκοτισθῇ
  choice: अँधेरा हो जाए
  rationale: निष्क्रिय संभाव्य रूप को ‘हो जाए’ से स्वाभाविक हिन्दी में व्यक्त किया गया है; इससे बाहरी रूप से घटित अँधेरा होने का भाव बना रहता है।
- source_word: αὐτῶν
  choice: उनका
  rationale: बहुवचन सर्वनाम सामूहिक रूप से सूर्य, चाँद और तारों की ओर संकेत करता है।
- source_word: ἡ ἡμέρα μὴ φάνῃ
  choice: दिन ... प्रकाश न दे
  rationale: φαίνω यहाँ ब्रह्मांडीय अंधकार के संदर्भ में चमकने या प्रकाश देने का अर्थ रखता है। ‘प्रकाश न दे’ हिन्दी में ‘दिन’ के साथ स्पष्ट और स्वाभाविक है।
- source_word: τὸ τρίτον αὐτῆς
  choice: अपने एक तिहाई भाग तक
  rationale: यह दिन के प्रभावित अंश या अवधि को व्यक्त करता है और यूनानी वाक्यांश की संभावित व्यापकता को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: ἡ νὺξ ὁμοίως
  choice: और रात भी वैसे ही
  rationale: यह संक्षिप्त रूप से बताता है कि वही सीमा रात पर भी लागू होती है।
theological_decisions:
- issue: ब्रह्मांडीय न्याय की छवि का स्वरूप
  choice: आकाशीय पिंडों के अँधेरा होने का वर्णन सीधे प्रकाशितवाक्यीय न्याय की भाषा में रखा गया है।
  alternative: इसे केवल शाब्दिक खगोलीय घटना अथवा केवल प्रतीकात्मक राजनीतिक-ब्रह्मांडीय चित्र के रूप में स्पष्ट करना।
  rationale: पद स्वयं यह निर्धारित नहीं करता कि दृश्य शाब्दिक है, प्रतीकात्मक है, या दोनों; इसलिए अनुवाद इस तनाव को खुला रखता है।
- issue: ἵνα के बाद प्रयोजन और परिणाम का संबंध
  choice: मुख्य पाठ में ‘ताकि ... प्रकाश न दे’ रखा गया है।
  alternative: ‘जिससे ... प्रकाश नहीं दिया’ जैसे केवल घटित परिणाम पर बल देने वाला अनुवाद।
  rationale: यूनानी ἵνα और संभाव्य क्रिया प्रयोजन-सदृश या परिणाम-सदृश दोनों छायाएँ रख सकते हैं। मुख्य पाठ और पादटिप्पणी मिलकर इस अस्पष्टता को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘एक तिहाई भाग’ की पुनरावृत्ति मूल की लय और सीमित न्याय के बल को बनाए रखती है।
