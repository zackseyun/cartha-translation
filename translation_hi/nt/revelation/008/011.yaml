source:
  edition: SBLGNT
  text: καὶ τὸ ὄνομα τοῦ ἀστέρος λέγεται· ⸀ὁ Ἄψινθος. καὶ ἐγένετο τὸ τρίτον τῶν ὑδάτων εἰς ἄψινθον, καὶ πολλοὶ τῶν ἀνθρώπων ἀπέθανον ἐκ τῶν ὑδάτων, ὅτι ἐπικράνθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/011.yaml
  text: And the name of the star is called Wormwood[a]. And a third of the waters became wormwood, and many of the people died from the waters[b], because they had been made bitter.
translation:
  language: hi
  text: और उस तारे का नाम नागदौना[a] कहलाता है। जल का एक तिहाई भाग नागदौना बन गया, और बहुत-से लोग उस जल के कारण मर गए[b], क्योंकि वह कड़वा बना दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात एक अत्यंत कड़वा पौधा; यूनानी शब्द Ἄψινθος/ἄψινθον तारे के नाम और जल के नागदौना बनने—दोनों के लिए दोहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक स्पष्ट रूप में: “क्योंकि जल कड़वा बना दिया गया था।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ὄνομα
  choice: नाम
  rationale: तारे की संज्ञा के लिए सीधा और स्वाभाविक हिन्दी शब्द।
- source_word: ἀστέρος
  choice: तारे
  rationale: प्रकाशितवाक्य की आकाशीय और प्रतीकात्मक छवि को सीधे बनाए रखता है।
- source_word: λέγεται
  choice: कहलाता है
  rationale: वर्तमान कर्मवाच्य का स्वाभाविक हिन्दी रूप; यूनानी अभिव्यक्ति के अर्थ को बिना अनावश्यक विस्तार के रखता है।
- source_word: Ἄψινθος / ἄψινθον
  choice: नागदौना / नागदौना
  rationale: यह कड़वे Artemisia पौधे के लिए प्रचलित हिन्दी नाम है। तारे के नाम और जल में आए परिवर्तन के लिए एक ही शब्द रखकर मूल की जानबूझकर की गई पुनरावृत्ति और कड़वाहट का संबंध सुरक्षित रहता है।
- source_word: ἐγένετο ... εἰς
  choice: हो गया
  rationale: यहाँ परिवर्तन या परिणति व्यक्त होती है; सरल हिन्दी में ‘हो गया’ उसी बल को बनाए रखता है।
- source_word: τὸ τρίτον τῶν ὑδάτων
  choice: जल का एक तिहाई भाग
  rationale: भागवाचक अभिव्यक्ति और मात्रा दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: बहुत-से लोग
  rationale: ἄνθρωποι का समावेशी मानवीय अर्थ देता है; हिन्दी में अधिक भारी ‘मनुष्यों में से बहुत-से’ की अपेक्षा सहज है।
- source_word: ἀπέθανον ἐκ τῶν ὑδάτων
  choice: उस जल के कारण मर गए
  rationale: ἐκ के कारण/स्रोत संबंध को स्पष्ट करता है, पर ‘पीने’ जैसी मूल में अनकही क्रिया नहीं जोड़ता।
- source_word: ὅτι ἐπικράνθησαν
  choice: क्योंकि वह कड़वा कर दिया गया था
  rationale: कर्मवाच्य और परिणामी अवस्था को सुरक्षित रखता है। एकवचन सामूहिक ‘जल’ के अनुरूप हिन्दी में एकवचन सर्वनाम स्वाभाविक है।
theological_decisions:
- issue: ἐπικράνθησαν का संदर्भ
  choice: 'यह क्रिया जल की ओर संकेत करती है: जल कड़वा कर दिया गया था।'
  alternative: लोग कड़वे, विक्षुब्ध या रोगग्रस्त हो गए थे।
  rationale: निकटतम बहुवचन पूर्वपद τῶν ὑδάτων है और प्रसंग में मृत्यु का कारण जल का कड़वा होना है। हिन्दी में सामूहिक ‘जल’ एकवचन होने से ‘वह’ प्रयोग किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘पानी’ के बजाय ‘जल’ प्रकाशितवाक्य की औपचारिक शैली के अनुरूप है। ‘नागदौना’ मूल पौधे की ठोस छवि और दोनों occurrences का शब्द-संबंध बनाए रखता है; फुटनोट उसकी कड़वाहट स्पष्ट करता है।
