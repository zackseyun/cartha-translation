  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἴληφεν ὁ ἄγγελος τὸν λιβανωτόν, καὶ ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου, καὶ ἔβαλεν εἰς τὴν γῆν· καὶ ἐγένοντο βρονταὶ καὶ φωναὶ καὶ ἀστραπαὶ καὶ σεισμός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/005.yaml
  text: And the angel took the censer[a], and filled it with fire from the altar, and threw it onto the earth; and there came peals of thunder and sounds and flashes of lightning and an earthquake.
translation:
  language: hi
  text: और स्वर्गदूत ने धूपदान लिया, उसे वेदी की आग से भर दिया और उसे पृथ्वी पर फेंक दिया। तब गर्जनाएँ, ध्वनियाँ[a], बिजली की चमकें और भूकंप हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आवाज़ें।” यूनानी शब्द का अर्थ बोलती हुई आवाज़ें या ध्वनियाँ/शोर हो सकता है; ईश्वर के प्रकट होने के ऐसे प्रसंग में दोनों अर्थ संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴληφεν
  choice: लिया
  rationale: यूनानी पूर्णकाल यहाँ कथात्मक क्रम में है; स्वाभाविक आधुनिक हिन्दी में सामान्य भूतकाल उचित है।
- source_word: λιβανωτόν
  choice: धूपदान
  rationale: इस आराधनात्मक संदर्भ में यह धूप जलाने और अंगारे रखने का पात्र है; ‘धूपदान’ संक्षिप्त और प्रचलित हिन्दी शब्द है।
- source_word: ἐγέμισεν αὐτὸν ἐκ τοῦ πυρὸς τοῦ θυσιαστηρίου
  choice: उसे वेदी की आग से भरकर
  rationale: यह पात्र को वेदी से ली गई आग से भरने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और आग के स्रोत के रूप में वेदी को स्पष्ट रखता है।
- source_word: θυσιαστηρίου
  choice: वेदी
  rationale: मंदिर और बलिदान-संबंधी चित्रण में यह मानक हिन्दी समतुल्य है।
- source_word: ἔβαλεν εἰς τὴν γῆν
  choice: पृथ्वी पर फेंक दिया
  rationale: ‘फेंक दिया’ क्रिया की तीव्रता रखता है; प्रकाशितवाक्य के विश्वव्यापी न्याय-दृश्य में γῆ के लिए ‘पृथ्वी’ उपयुक्त है।
- source_word: ἐγένοντο
  choice: तब ... हुआ
  rationale: घटनाओं के अचानक प्रकट होने और कथात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βρονταὶ
  choice: गरजें
  rationale: बहुवचन बार-बार होने वाली मेघगर्जनाओं को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: φωναὶ
  choice: ध्वनियाँ
  rationale: φωνή का अर्थ आवाज़ें या व्यापक रूप से ध्वनियाँ हो सकता है। यहाँ वक्ता निर्दिष्ट नहीं हैं, इसलिए ‘ध्वनियाँ’ अनावश्यक रूप से वाणी मान लेने से बचता है।
- source_word: ἀστραπαὶ
  choice: बिजलियाँ
  rationale: बहुवचन दृश्य घटना को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: σεισμός
  choice: भूकंप
  rationale: एकवचन σεισμός का सीधा और मानक हिन्दी समतुल्य है।
theological_decisions:
- issue: न्याय के प्रलय-दृश्य में γῆ का अर्थ
  choice: पृथ्वी
  alternative: भूमि / धरती
  rationale: प्रकाशितवाक्य के व्यापक और ब्रह्मांडीय न्याय-चित्रण में ‘पृथ्वी’ उपयुक्त है; ‘भूमि’ इसे अनावश्यक रूप से स्थानीय बना सकती है।
- issue: ईश-प्रकाश संबंधी सूत्र में φωναί का अर्थ
  choice: ध्वनियाँ
  alternative: आवाज़ें
  rationale: किसी वक्ता की पहचान नहीं दी गई है। ‘ध्वनियाँ’ श्रव्य घटना को रखता है, जबकि ‘आवाज़ें’ की वास्तविक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘धूपदान’, ‘वेदी’ और ‘पृथ्वी’ जैसे स्थापित बाइबलीय शब्द संदर्भ की आराधनात्मक और प्रलय-दृष्टि संबंधी गंभीरता बनाए रखते हैं।
