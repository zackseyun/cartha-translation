id: REV.8.4
reference: Revelation 8:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀνέβη ὁ καπνὸς τῶν θυμιαμάτων ταῖς προσευχαῖς τῶν ἁγίων ἐκ χειρὸς τοῦ ἀγγέλου ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/004.yaml
  text: And the smoke of the incense went up with the prayers of the saints from the hand of the angel before God[a][b].
translation:
  language: hi
  text: और धूप का धुआँ पवित्र जनों की प्रार्थनाओं के साथ स्वर्गदूत के हाथ से परमेश्वर के सामने ऊपर उठा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपर चढ़ा।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “पवित्र जनों की प्रार्थनाओं के साथ”; यह शब्दावली धूप के धुएँ को प्रार्थनाओं से जोड़ती है, पर इस पद में दोनों को स्पष्ट रूप से एक ही नहीं बताती।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβη
  choice: ऊपर उठा
  rationale: यह ἀναβαίνω के ऊपर की ओर जाने के ठोस दृश्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καπνὸς
  choice: धुआँ
  rationale: सामान्य शाब्दिक अर्थ दृश्य की प्रत्यक्ष छवि को बनाए रखता है।
- source_word: θυμιαμάτων
  choice: धूप का
  rationale: θυμίαμα यहाँ आराधना में जलाई जाने वाली सुगंधित धूप है; हिन्दी में एकवचन द्रव्यवाचक रूप स्वाभाविक है।
- source_word: ταῖς προσευχαῖς
  choice: प्रार्थनाओं के साथ
  rationale: सम्बन्धसूचक दत्तिव को इस प्रकार व्यक्त किया गया है कि धूप के धुएँ और प्रार्थनाओं का सम्बन्ध बना रहे, पर उनकी पहचान एक न ठहराई जाए।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों की
  rationale: यह परमेश्वर के लिए अलग किए गए लोगों का व्यापक बाइबिलीय अर्थ देता है और आधुनिक हिन्दी में ‘संतों’ के सम्भावित सीमित या बाद के पारिभाषिक अर्थ से बचता है।
- source_word: ἐκ χειρὸς τοῦ ἀγγέλου
  choice: स्वर्गदूत के हाथ से
  rationale: यूनानी संरचना और दर्शन की सजीव छवि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में उठने या प्रस्तुत होने के अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: धूप और प्रार्थनाओं का सम्बन्ध
  choice: ‘धूप का धुआँ पवित्र जनों की प्रार्थनाओं के साथ ... ऊपर उठा’
  alternative: धूप का धुआँ, अर्थात पवित्र जनों की प्रार्थनाएँ, ऊपर उठा; अथवा धुआँ प्रार्थनाओं के लिए उठा
  rationale: यूनानी पाठ धुएँ और प्रार्थनाओं को जोड़ता है, पर इस पद में दोनों को स्पष्टतः एक नहीं ठहराता। अनुवाद उस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: τῶν ἁγίων का आशय
  choice: पवित्र जन
  alternative: संत
  rationale: सन्दर्भ में यह परमेश्वर के समस्त पवित्र लोगों के लिए है; ‘पवित्र जन’ किसी बाद की संप्रदायगत या औपचारिक संत-श्रेणी का संकेत दिए बिना व्यापक अर्थ सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धूप’, ‘स्वर्गदूत’ और ‘परमेश्वर’ परिचित बाइबिलीय शब्द हैं; वाक्यक्रम मूल दृश्य और सम्बन्ध की अस्पष्टता दोनों को सुरक्षित रखता है।
