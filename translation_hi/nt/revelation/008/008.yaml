  yaml_path: translation/nt/revelation/008/008.yaml
  text: And the second angel sounded the trumpet[a], and something like a great mountain burning with fire was thrown into the sea, and a third of the sea became blood.
translation:
  language: hi
  text: दूसरे स्वर्गदूत ने तुरही फूँकी। तब आग से जलते हुए एक बड़े पहाड़ जैसी कोई वस्तु[a] समुद्र में फेंक दी गई, और समुद्र का एक-तिहाई भाग लहू बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो आग से जलता हुआ एक बड़ा पहाड़”; यूनानी पाठ समानता प्रकट करता है, अनिवार्यतः यह नहीं कि वह सचमुच पहाड़ ही था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: क्रिया σαλπίζω का अर्थ तुरही बजाना या फूँकना है। हिन्दी में निहित वाद्य को स्पष्ट करके “तुरही फूँकी” कहना स्वाभाविक और प्रसंगानुकूल है।
- source_word: ὡς
  choice: जैसी कोई वस्तु
  rationale: ὡς समानता प्रकट करता है, अनिवार्यतः वस्तु की पहचान नहीं। यह प्रयोग दर्शन के वर्णन को किसी वास्तविक पहाड़, उल्का या प्रतीक के रूप में निश्चित नहीं करता।
- source_word: ὄρος μέγα
  choice: एक बड़ा पहाड़
  rationale: यह संज्ञा-विशेषण पद का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: πυρὶ καιόμενον
  choice: आग से जलते हुए
  rationale: यह आग के साथ जलने की सजीव छवि को बनाए रखता है और वस्तु की प्रकृति के विषय में अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐβλήθη
  choice: फेंक दी गई
  rationale: भूतकालीन कर्मवाच्य रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; “पटक दी गई” जैसी अतिरिक्त तीव्रता नहीं जोड़ता।
- source_word: εἰς τὴν θάλασσαν
  choice: समुद्र में
  rationale: θάλασσα का सामान्य और सीधा अर्थ “समुद्र” है; गति और गंतव्य को हिन्दी में “में फेंक दी गई” स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ τρίτον τῆς θαλάσσης
  choice: समुद्र का एक-तिहाई भाग
  rationale: यह अंशवाचक अभिव्यक्ति का स्पष्ट आधुनिक हिन्दी रूप है और प्रकाशितवाक्य में बार-बार आने वाले एक-तिहाई के परिमाण को सुरक्षित रखता है।
- source_word: αἷμα
  choice: लहू
  rationale: αἷμα का सीधा अर्थ रक्त है। “लहू” सामान्य पाठकों के लिए सुबोध होने के साथ बाइबलीय कथन की गरिमा और सजीवता बनाए रखता है।
theological_decisions:
- issue: पहाड़ जैसी वस्तु की प्रकृति
  choice: तुलना को सुरक्षित रखते हुए वस्तु को केवल “एक बड़े पहाड़ जैसी कोई वस्तु” कहा गया है।
  alternative: इसे वास्तविक पहाड़, उल्का-सदृश पिंड या न्याय का निश्चित प्रतीक कहना।
  rationale: मूल पाठ का ὡς केवल समानता सूचित करता है। अनुवाद को यह तय नहीं करना चाहिए कि दर्शन शाब्दिक है, प्रतीकात्मक है, या दोनों।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शनात्मक शैली रखी गई है। “तुरही फूँकी,” “बड़ा पहाड़,” और “एक-तिहाई भाग” जैसे पद सामान्य पाठक के लिए स्पष्ट हैं; तुलना की मूल अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
