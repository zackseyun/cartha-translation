id: REV.8.3
reference: Revelation 8:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος ἦλθεν καὶ ἐστάθη ἐπὶ τοῦ θυσιαστηρίου ἔχων λιβανωτὸν χρυσοῦν, καὶ ἐδόθη αὐτῷ θυμιάματα πολλὰ ἵνα ⸀δώσει ταῖς προσευχαῖς τῶν ἁγίων πάντων ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν τὸ ἐνώπιον τοῦ θρόνου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/003.yaml
  text: And another angel came and stood at the altar[a], holding a golden censer[b], and much incense was given to him so that he might offer it with the prayers of all the saints on the golden altar before the throne.
translation:
  language: hi
  text: फिर एक और स्वर्गदूत आया और वेदी के पास खड़ा हो गया। उसके हाथ में सोने का धूपदान[a] था। उसे बहुत धूप दी गई, ताकि वह उसे सभी पवित्र जनों की प्रार्थनाओं के साथ[b] उस सोने की वेदी पर अर्पित करे, जो सिंहासन के सामने थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “सोने का धूप जलाने वाला पात्र।”
    reason: λιβανωτός के लिए वर्णनात्मक शाब्दिक विकल्प।
  - marker: b
    text: शाब्दिक रूप से, “ताकि वह उसे सभी पवित्र जनों की प्रार्थनाओं को दे।” इस प्रसंग में भाव यह है कि धूप उनकी प्रार्थनाओं के साथ अर्पित की जाती है या उनमें जोड़ी जाती है।
    reason: मूल यूनानी के संप्रदान कारक संबंध की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: एक और स्वर्गदूत
  rationale: ἄλλος क्रम में एक अतिरिक्त स्वर्गदूत को सूचित करता है; ‘एक और स्वर्गदूत’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐστάθη ἐπὶ τοῦ θυσιαστηρίου
  choice: वेदी के पास खड़ा हो गया
  rationale: ἐπί + संबंधकारक यहाँ वेदी के निकट स्थिति को दर्शाता है, न कि उसके ऊपर खड़े होने को। ‘खड़ा हो गया’ अओरिस्ट की आरंभात्मक छाया को भी व्यक्त करता है।
- source_word: λιβανωτὸν χρυσοῦν
  choice: सोने का धूपदान
  rationale: λιβανωτός धूप जलाने के पात्र को सूचित करता है। ‘धूपदान’ संक्षिप्त, प्रचलित और प्रसंगानुकूल है; χρυσοῦν को ‘सोने का’ से व्यक्त किया गया है।
- source_word: ἐδόθη αὐτῷ θυμιάματα πολλὰ
  choice: उसे बहुत धूप दी गई
  rationale: यह अनुवाद मूल के कर्मवाच्य को बनाए रखता है। θυμιάματα बहुवचन होने पर भी इस प्रसंग में धूप-सामग्री को सामूहिक रूप से दर्शाता है, जिसके लिए हिन्दी में ‘बहुत धूप’ स्वाभाविक है।
- source_word: ἵνα δώσει
  choice: ताकि वह उसे … अर्पित करे
  rationale: ἵνα उद्देश्य व्यक्त करता है। यद्यपि δώσει का मूल अर्थ ‘दे’ है, धूप और वेदी के उपासना-संबंधी प्रसंग में ‘अर्पित करे’ अपेक्षित क्रिया को स्वाभाविक रूप से व्यक्त करता है। ‘उसे’ का संदर्भ पहले उल्लिखित धूप से है।
- source_word: ταῖς προσευχαῖς τῶν ἁγίων πάντων
  choice: सभी पवित्र जनों की प्रार्थनाओं के साथ
  rationale: मूल का संप्रदान कारक संबंध संक्षिप्त और कुछ अस्पष्ट है। ‘के साथ’ धूप और प्रार्थनाओं के साथ प्रस्तुत होने का प्रसंगगत अर्थ देता है, जबकि शाब्दिक संरचना को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἅγιοι
  choice: पवित्र जन
  rationale: प्रकाशितवाक्य में ἅγιοι परमेश्वर के लिए अलग किए गए लोगों को दर्शाता है। ‘पवित्र जन’ आधुनिक हिन्दी में स्पष्ट है और किसी विशिष्ट कलीसियाई उपाधि का अनावश्यक संकेत नहीं देता।
- source_word: ἐπὶ τὸ θυσιαστήριον τὸ χρυσοῦν
  choice: उस सोने की वेदी पर
  rationale: यहाँ ἐπί + कर्मकारक अर्पण की दिशा और वेदी पर रखे जाने को दर्शाता है; ‘वेदी पर’ इस क्रियात्मक संबंध को ठीक व्यक्त करता है।
- source_word: τὸ ἐνώπιον τοῦ θρόνου
  choice: जो सिंहासन के सामने थी
  rationale: ἐνώπιον स्थान-संबंधी अर्थ में ‘सामने’ है। संबंधवाचक वाक्य हिन्दी में यह स्पष्ट करता है कि वर्णन सोने की वेदी का है।
theological_decisions:
- issue: पवित्र जनों की प्रार्थनाओं से धूप का संबंध
  choice: धूप को सभी पवित्र जनों की प्रार्थनाओं के साथ अर्पित किया जाता है।
  alternative: अधिक शाब्दिक रूप में, धूप ‘सभी पवित्र जनों की प्रार्थनाओं को’ दी जाती है।
  rationale: ταῖς προσευχαῖς का संप्रदान कारक व्याकरण की दृष्टि से संक्षिप्त और असामान्य है। मंदिर और धूप की निकटवर्ती छवि धूप के प्रार्थनाओं के साथ अर्पित होने का समर्थन करती है, पर शाब्दिक विकल्प को पाद-टिप्पणी में रखकर वास्तविक अस्पष्टता सुरक्षित की गई है; इससे स्वर्गदूत की मध्यस्थता के विषय में कोई विकसित सिद्धांत पाठ में आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धूपदान’, ‘वेदी’, ‘पवित्र जन’ और ‘सिंहासन’ जैसे परिचित बाइबिलीय शब्द बनाए गए हैं। छोटे वाक्यों से जटिल यूनानी संरचना को सामान्य हिन्दी पाठक के लिए स्पष्ट किया गया है, बिना मंदिर-संबंधी दृश्य या धर्मवैचारिक तनाव को मिटाए।
