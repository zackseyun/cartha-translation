id: REV.8.7
reference: Revelation 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ πρῶτος ἐσάλπισεν· καὶ ἐγένετο χάλαζα καὶ πῦρ μεμιγμένα ἐν αἵματι, καὶ ἐβλήθη εἰς τὴν γῆν· καὶ τὸ τρίτον τῆς γῆς κατεκάη, καὶ τὸ τρίτον τῶν δένδρων κατεκάη, καὶ πᾶς χόρτος χλωρὸς κατεκάη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/007.yaml
  text: And the first sounded his trumpet[a], and there came hail and fire mixed with blood, and it was thrown onto the earth. And a third of the earth was burned up, and a third of the trees was burned up[b], and all the green grass was burned up.
translation:
  language: hi
  text: पहले ने तुरही फूँकी। तब ओले और आग प्रकट हुए, जो रक्त से मिले हुए थे, और यह सब पृथ्वी[a] पर फेंक दिया गया। पृथ्वी का एक-तिहाई भाग जलकर भस्म हो गया, पेड़ों में से एक-तिहाई जलकर भस्म हो गया, और सारी हरी घास जलकर भस्म हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भूमि’; यूनानी शब्द γῆ के दोनों अर्थ हो सकते हैं, पर यहाँ व्यापक प्रकाशनात्मक संदर्भ ‘पृथ्वी’ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: पहले ने
  rationale: मूल यूनानी में ‘स्वर्गदूत’ संज्ञा व्यक्त नहीं है, यद्यपि पिछले संदर्भ से वह समझी जाती है। इसलिए मूल की संक्षिप्त और संकेतात्मक अभिव्यक्ति बनाए रखी गई है।
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: यह क्रिया तुरही बजाने को व्यक्त करती है। हिन्दी में ‘तुरही फूँकी’ स्वाभाविक है और निकटवर्ती संदर्भ से तुरही का उल्लेख स्पष्ट है।
- source_word: ἐγένετο
  choice: उत्पन्न हुए
  rationale: यहाँ क्रिया एक नई विनाशकारी घटना के प्रकट होने या घटित होने का परिचय देती है; ‘उत्पन्न हुए’ उस घटनात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: χάλαζα καὶ πῦρ
  choice: ओले और आग
  rationale: दोनों विनाशकारी तत्वों की सजीव छवि को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखा गया है।
- source_word: μεμιγμένα ἐν αἵματι
  choice: लहू से मिले हुए थे
  rationale: यह मिश्रित अवस्था को दर्शाता है। ‘लहू से मिले हुए’ आधुनिक हिन्दी में स्पष्ट है और प्रकाशनात्मक दृश्य की तीव्रता बनाए रखता है।
- source_word: ἐβλήθη εἰς τὴν γῆν
  choice: यह सब पृथ्वी पर फेंक दिया गया
  rationale: यूनानी में क्रिया एकवचन कर्मवाच्य है, जो ओलों और आग की पूरी घटना को सामूहिक इकाई मानती है। ‘यह सब’ हिन्दी में उस सामूहिक एकवचन भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ τρίτον τῆς γῆς
  choice: पृथ्वी का एक-तिहाई भाग
  rationale: भागसूचक यूनानी पद का स्वाभाविक हिन्दी रूप है; ‘भाग’ जोड़ने से अनुपात स्पष्ट रहता है।
- source_word: κατεκάη
  choice: जलकर भस्म हो गया
  rationale: κατακαίω साधारण जलने से अधिक, आग से पूरी तरह नष्ट होने का प्रबल भाव रखता है। ‘जलकर भस्म’ उस तीव्रता को व्यक्त करता है।
- source_word: τὸ τρίτον τῶν δένδρων
  choice: पेड़ों का एक-तिहाई भाग
  rationale: भागसूचक अभिव्यक्ति का स्पष्ट और सहज हिन्दी समतुल्य है तथा पद में दोहराए गए न्याय-प्रतिरूप को बनाए रखता है।
- source_word: πᾶς χόρτος χλωρός
  choice: सारी हरी घास
  rationale: χόρτος यहाँ घास या छोटी हरी वनस्पति को दर्शा सकता है; ‘हरी घास’ ठोस दृश्य को बनाए रखती है और सामान्य पाठक के लिए सहज है।
theological_decisions:
- issue: प्रकाशनात्मक न्याय में γῆ का विस्तार
  choice: पृथ्वी
  alternative: भूमि
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘भूमि’ दोनों हो सकता है। तुरही-वाले न्यायों के व्यापक, सृष्टि-संबंधी संदर्भ में ‘पृथ्वी’ मुख्य पाठ के लिए अधिक उपयुक्त है, पर वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। मूल यूनानी की संकेतात्मक ‘पहले ने’ अभिव्यक्ति को ‘पहले स्वर्गदूत ने’ बनाकर स्पष्ट नहीं किया गया, ताकि मूल से अतिरिक्त संज्ञा न जोड़ी जाए। सर्वनाशकारी दृश्य की पुनरावृत्ति और लय को बनाए रखने के लिए ‘जलकर भस्म हो गया’ दोहराया गया है।
