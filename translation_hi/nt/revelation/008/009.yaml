base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/009.yaml
  text: And a third of the creatures in the sea—the ones that have living souls—died[a], and a third of the ships were destroyed.
translation:
  language: hi
  text: और समुद्र के प्राणधारी जीवों में से एक तिहाई मर गया[a], और जहाज़ों में से एक तिहाई नष्ट हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “जिनमें जीवन था” या “जीवित प्राणी।” यूनानी में शाब्दिक रूप से: “प्राण/जीवन रखनेवाले।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανε
  choice: मर गए
  rationale: ἀποθνῄσκω का सीधा अर्थ मृत्यु होना है; बहुवचन हिन्दी कर्ता के साथ ‘मर गए’ स्वाभाविक है।
- source_word: τὸ τρίτον
  choice: एक तिहाई
  rationale: यह यूनानी अंशवाचक अभिव्यक्ति का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: κτισμάτων
  choice: जीवों
  rationale: κτίσμα का व्यापक अर्थ ‘सृजी हुई वस्तु/प्राणी’ हो सकता है, पर समुद्र में स्थित और ψυχάς रखनेवाले संदर्भ में यहाँ सजीव समुद्री जीव अभिप्रेत हैं।
- source_word: τῶν ἐν τῇ θαλάσσῃ
  choice: समुद्र में रहनेवाले
  rationale: यह स्थानसूचक वाक्यांश को सहज हिन्दी विशेषणीय रूप में व्यक्त करता है।
- source_word: τὰ ἔχοντα ψυχάς
  choice: प्राणधारी
  rationale: यह ‘जिनमें प्राण/जीवन है’ का संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी रूप है; ψυχή को यहाँ तकनीकी मानव-आत्मा के अर्थ में सीमित नहीं करता।
- source_word: ψυχάς
  choice: प्राण
  rationale: इस प्रसंग में ψυχή सजीवता अथवा जीवन को सूचित करता है। ‘प्राण’ इसकी शाब्दिक उपस्थिति बनाए रखता है और समुद्री जीवों के संदर्भ में ‘आत्माएँ’ से अधिक स्वाभाविक है।
- source_word: πλοίων
  choice: जहाज़ों
  rationale: πλοῖον के लिए आधुनिक मानक हिन्दी में ‘जहाज़’ स्पष्ट और सामान्य शब्द है।
- source_word: διεφθάρησαν
  choice: नष्ट हो गए
  rationale: यहाँ διαφθείρω का कर्मवाच्य रूप भौतिक विनाश बताता है, नैतिक भ्रष्टता नहीं।
theological_decisions:
- issue: समुद्री जीवों के विषय में ψυχάς का अनुवाद
  choice: मुख्य पाठ में ‘प्राणधारी’
  alternative: ‘जिनमें जीवन था’; ‘जीवित प्राणी’; ‘आत्माएँ रखनेवाले’
  rationale: पद समुद्री जीवों के बारे में तकनीकी आत्मा-विज्ञान का दावा नहीं कर रहा। ‘प्राणधारी’ मूल शब्द की जीवन-संबंधी शक्ति को सुरक्षित रखते हुए हिन्दी में अनावश्यक दार्शनिक अर्थ आरोपित नहीं करता; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘प्राणधारी जीव’ में हल्की औपचारिकता मूल के τὰ ἔχοντα ψυχάς को सुनाई देती रहने देती है।
