reference: Revelation 8:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἄγγελος ἐσάλπισεν· καὶ ἔπεσεν ἐκ τοῦ οὐρανοῦ ἀστὴρ μέγας καιόμενος ὡς λαμπάς, καὶ ἔπεσεν ἐπὶ τὸ τρίτον τῶν ποταμῶν καὶ ἐπὶ τὰς πηγὰς τῶν ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/010.yaml
  text: And the third angel sounded his trumpet[a], and a great star fell from heaven, burning like a torch[c][b], and it fell on a third of the rivers and on the springs of the waters.
translation:
  language: hi
  text: और तीसरे स्वर्गदूत ने तुरही फूँकी, और आकाश[a] से एक बड़ा तारा[c] गिरा, जो मशाल[b] की तरह जल रहा था; और वह नदियों के एक तिहाई हिस्से और जल के सोतों पर गिरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग से।” यूनानी शब्द का अर्थ “आकाश” या “स्वर्ग” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दीपक।” यूनानी शब्द मशाल या दीपक को सूचित कर सकता है; यहाँ प्रज्वलित होकर गिरते तारे के बिंब में “मशाल” अधिक स्वाभाविक है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “तारे” के बिंब की कोई निश्चित व्याख्या नहीं की गई है। इसे स्वर्गदूतीय प्राणी, उल्का-जैसी वस्तु या किसी प्रतीकात्मक शक्ति के रूप में समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: σαλπίζω का अर्थ तुरही बजाना या फूँकना है। आधुनिक हिन्दी में “तुरही फूँकी” स्वाभाविक और स्पष्ट है।
- source_word: ἀστὴρ μέγας
  choice: एक बड़ा तारा
  rationale: यह संज्ञा-विशेषण पदबंध का सीधा अनुवाद है और तारे के प्रभावशाली आकार या स्वरूप को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: आकाश से
  rationale: οὐρανός का अर्थ प्रसंग के अनुसार आकाश या स्वर्ग हो सकता है। यहाँ गिरते हुए तारे का दृश्यगत स्थान “आकाश” से स्वाभाविक रूप से व्यक्त होता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: καιόμενος ὡς λαμπάς
  choice: मशाल के समान जल रहा था
  rationale: καιόμενος निरंतर जलने की अवस्था बताता है और λαμπάς प्रायः मशाल को सूचित करता है। यह वाक्यांश उपमा को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἔπεσεν ... καὶ ἔπεσεν
  choice: गिरा ... वह ... गिरा
  rationale: मूल यूनानी में क्रिया की पुनरावृत्ति पहले आकाश से नीचे आने और फिर जलस्रोतों पर पड़ने पर बल देती है; हिन्दी में इसे बनाए रखा गया है।
- source_word: ἐπὶ τὸ τρίτον τῶν ποταμῶν
  choice: नदियों के एक तिहाई भाग ... पर
  rationale: τὸ τρίτον प्रकाशितवाक्य के इस क्रम में एक-तिहाई मात्रा को दर्शाता है। “एक तिहाई भाग” सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: πηγὰς τῶν ὑδάτων
  choice: जल के सोतों
  rationale: πηγή प्राकृतिक जलस्रोत या सोते को दर्शाता है। “जल के सोते” मूल के संबंधकारक पदबंध को निकटता से रखते हुए सहज हिन्दी देता है।
theological_decisions:
- issue: गिरते हुए तारे का अभिप्राय
  choice: इसे बिना प्रतीकात्मक पहचान निर्धारित किए “एक बड़ा तारा” कहा गया है।
  alternative: इसे कोई स्वर्गदूतीय प्राणी, उल्का-जैसी वस्तु, शासक या प्रतीकात्मक शक्ति समझना।
  rationale: पद स्वयं इस आकृति को तारा कहता है, पर उसका अभिप्राय स्पष्ट नहीं करता। शाब्दिक बिंब बनाए रखने से वास्तविक व्याख्यात्मक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दो बार प्रयुक्त “गिरा” क्रिया को बल और लय बनाए रखने के लिए दोहराया गया है। “स्रोतों” की अपेक्षा “सोतों” का चयन प्राकृतिक जल-उद्गम के अर्थ को अधिक स्पष्ट करता है।
