translation:
  language: hi
  text: और मैंने उन सात स्वर्गदूतों को देखा, जो परमेश्वर के सामने खड़े हैं[a], और उन्हें सात तुरहियाँ दी गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर के सामने खड़े हुए हैं” अथवा “जो परमेश्वर के सामने खड़े रहे हैं”; यूनानी का पूर्ण काल का क्रिया-रूप उनके खड़े होने से उत्पन्न, अब तक बनी हुई अवस्था पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: दर्शन-वर्णन में ὁράω का अओरिस्ट स्वाभाविक रूप से पूर्ण घटना ‘मैंने देखा’ व्यक्त करता है; अधिक पुरातन या कमजोर विकल्पों से बचा गया है।
- source_word: τοὺς ἑπτὰ ἀγγέλους
  choice: उन सात स्वर्गदूतों को
  rationale: लेख सहित संख्या एक निश्चित और पहचाने हुए समूह की ओर संकेत करती है; हिन्दी में ‘उन सात’ इस निश्चितता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: स्वर्गीय सिंहासन-कक्ष के प्रसंग में यहाँ मानवीय संदेशवाहक नहीं, अलौकिक दूत अभिप्रेत हैं।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह स्थान और उपस्थिति, दोनों से जुड़ा अर्थ संक्षिप्त तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἑστήκασιν
  choice: खड़े हैं
  rationale: ἵστημι का परिपूर्ण काल पूर्व में ग्रहण की गई और अब भी बनी हुई अवस्था पर बल देता है; हिन्दी में ‘खड़े हैं’ इस वर्तमान, जारी अवस्था को सहजता से बताता है।
- source_word: ἐδόθησαν αὐτοῖς
  choice: उन्हें ... दी गईं
  rationale: कर्मवाच्य प्रयोग देने वाले को अनकहा छोड़ता है, ठीक यूनानी पाठ की तरह; ‘उन्होंने पाईं’ कहने से दृष्टिकोण बदल जाता।
- source_word: σάλπιγγες
  choice: तुरहियाँ
  rationale: प्रकाशितवाक्य के न्याय-संबंधी और महादर्शी प्रसंग में σάλπιγξ के लिए ‘तुरही’ प्रतिष्ठित, स्पष्ट और प्रसंगानुकूल शब्द है।
theological_decisions:
- issue: सात स्वर्गदूतों की पहचान और पद
  choice: ‘उन सात स्वर्गदूतों’ के रूप में सीधा अनुवाद, बिना उनका पद या श्रेणी निर्धारित किए
  alternative: ‘सात प्रधान स्वर्गदूत’ अथवा बाद की परंपरा के विशिष्ट सात स्वर्गदूत
  rationale: यूनानी पाठ निश्चित सात स्वर्गदूतों का उल्लेख करता है, पर ἀρχάγγελοι शब्द नहीं प्रयोग करता और न उनका पद स्पष्ट करता है; इसलिए बाद की परंपराओं को पाठ में नहीं जोड़ा गया।
- issue: ἑστήκασιν के परिपूर्ण काल का अर्थ
  choice: मुख्य पाठ में ‘खड़े हैं’, और जारी अवस्था का संकेत पाद-टिप्पणी में
  alternative: ‘खड़े हुए हैं’ या ‘खड़े रहे हैं’
  rationale: परिपूर्ण रूप वर्तमान में बनी हुई अवस्था को व्यक्त करता है। हिन्दी का सहज ‘खड़े हैं’ इस भाव को पर्याप्त रूप से संप्रेषित करता है, जबकि पाद-टिप्पणी मूल रूप की सूक्ष्मता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘स्वर्गदूत’, ‘परमेश्वर’ और ‘तुरही’ परिचित बाइबिलीय शब्दावली हैं। वाक्य में यूनानी के दो समन्वित खंडों को बनाए रखा गया है और देने वाले को अनिर्दिष्ट छोड़ा गया है।
