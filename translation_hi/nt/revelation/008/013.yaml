id: REV.8.13
reference: Revelation 8:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἤκουσα ἑνὸς ἀετοῦ πετομένου ἐν μεσουρανήματι λέγοντος φωνῇ μεγάλῃ· Οὐαὶ οὐαὶ οὐαὶ ⸂τοὺς κατοικοῦντας⸃ ἐπὶ τῆς γῆς ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος τῶν τριῶν ἀγγέλων τῶν μελλόντων σαλπίζειν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/013.yaml
  text: And I saw[a], and I heard one eagle flying in midheaven, saying with a loud voice, “Woe, woe, woe to those who dwell on the earth[b], because of the remaining trumpet-blasts of the three angels who are about to sound!”
translation:
  language: hi
  text: फिर मैंने एक उकाब[a] को आकाश के बीचोंबीच[b] उड़ते देखा और उसे ऊँची आवाज़ में यह कहते सुना, “पृथ्वी पर रहने वालों पर हाय, हाय, हाय! उन तीन स्वर्गदूतों की तुरहियों की शेष ध्वनियों के कारण, जो तुरही फूँकने वाले हैं!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “एक उकाब” के बदले “एक स्वर्गदूत” है।
    reason: textual_variant
  - marker: b
    text: या “ऊँचे आकाश में”; यूनानी शब्द सिर के ऊपर खुले आकाश के मध्य या सर्वोच्च भाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀετοῦ
  choice: उकाब
  rationale: यह शब्द सामान्यतः बड़े शिकारी पक्षी ‘eagle’ को दर्शाता है। यहाँ मुर्दाखोर पक्षी का कोई स्पष्ट संदर्भ नहीं है, इसलिए ‘गिद्ध’ के बजाय ‘उकाब’ चुना गया है।
- source_word: μεσουρανήματι
  choice: आकाश के मध्यभाग में
  rationale: यह आकाश के खुले, ऊँचे मध्य क्षेत्र को दर्शाता है। यह अभिव्यक्ति दर्शन के ब्रह्मांडीय भाव को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: यह सार्वजनिक और प्रबल घोषणा का स्वाभाविक हिन्दी रूप है।
- source_word: Οὐαὶ οὐαὶ οὐαὶ
  choice: हाय, हाय, हाय
  rationale: भविष्यवाणी की तीव्रता और तीन बार की गई मूल पुनरावृत्ति को ज्यों का त्यों रखा गया है।
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहनेवालों
  rationale: यह प्रकाशितवाक्य में बार-बार आनेवाली अभिव्यक्ति की निरंतरता और उसके विशेष वैचारिक भार को बनाए रखता है।
- source_word: ἐκ τῶν λοιπῶν φωνῶν τῆς σάλπιγγος
  choice: उनकी तुरहियों की बाकी ध्वनियाँ ... के कारण
  rationale: ἐκ को प्रसंगानुसार कारणसूचक माना गया है। φωναί का मूल अर्थ ‘ध्वनियाँ’ है; बहुवचन ‘तुरहियों’ से तीन स्वर्गदूतों के क्रमिक तुरही फूँकने का आशय स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: τῶν τριῶν ἀγγέλων
  choice: वे तीन स्वर्गदूत
  rationale: दर्शन के इस प्रसंग में ἄγγελοι के लिए मानक हिन्दी बाइबलीय शब्द ‘स्वर्गदूत’ उपयुक्त है।
- source_word: τῶν μελλόντων σαλπίζειν
  choice: अब तुरही फूँकने वाले हैं
  rationale: μέλλω और infinitive आसन्न घटना को व्यक्त करते हैं; ‘अब ... वाले हैं’ उस निकटता को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: उड़ते हुए उद्घोषक का पाठांतर
  choice: एक उकाब
  alternative: एक स्वर्गदूत
  rationale: मुख्य पाठ दिए गए SBLGNT के ἀετοῦ (‘उकाब’) का अनुसरण करता है। कुछ पांडुलिपियों में ‘स्वर्गदूत’ है, इसलिए पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और श्रवणयोग्य रखी गई है। ‘उकाब’, ‘स्वर्गदूत’ और ‘तुरही’ प्रकाशितवाक्य की दर्शनात्मक तथा भविष्यवाणीपरक शैली के अनुरूप हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अर्थतः गलत स्थानों पर दिखाई देते हैं; हिन्दी मुख्य पाठ में [a] को ‘उकाब’ और [b] को ‘आकाश के मध्यभाग’ के बाद रखा गया है।
