id: REV.8.1
reference: Revelation 8:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ⸀ὅταν ἤνοιξεν τὴν σφραγῖδα τὴν ἑβδόμην, ἐγένετο σιγὴ ἐν τῷ οὐρανῷ ὡς ἡμιώριον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/001.yaml
  text: And when he opened the seventh seal[b][a], there was silence in heaven for about half an hour.
translation:
  language: hi
  text: और जब उसने सातवीं मुहर खोली[a], तो स्वर्ग में लगभग आधे घंटे तक सन्नाटा छा गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सातवीं मुहर तोड़ी।” यूनानी में शाब्दिक रूप से “सातवीं मुहर खोली” है।
    reason: lexical_alternative
  - marker: b
    text: या, “तो स्वर्ग में लगभग आधे घंटे तक मौन रहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यहाँ एक बार होने वाली कथात्मक घटना का समय बताया गया है; इसलिए ‘जब’ स्वाभाविक है, जबकि ‘जब कभी’ पुनरावृत्ति का अनुचित भाव दे सकता है।
- source_word: ἤνοιξεν
  choice: खोली
  rationale: ἀνοίγω का सीधा अर्थ ‘खोलना’ है। ‘तोड़कर खोली’ संदर्भानुकूल संभव है, पर मूल क्रिया से अधिक व्याख्यात्मक है।
- source_word: σφραγῖδα τὴν ἑβδόμην
  choice: सातवीं मुहर
  rationale: σφραγίς के लिए स्थापित और स्पष्ट हिन्दी शब्द ‘मुहर’ है; क्रमवाचक विशेषण का सीधा अनुवाद ‘सातवीं’ है।
- source_word: ἐγένετο σιγὴ
  choice: सन्नाटा छा गया
  rationale: यह अभिव्यक्ति मौन के आरम्भ होने का भाव स्वाभाविक हिन्दी में व्यक्त करती है और दृश्य की गंभीर नाटकीयता बनाए रखती है। अधिक औपचारिक विकल्प ‘मौन हो गया’ है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: यहाँ οὐρανός आकाश नहीं, स्वर्गीय लोक को सूचित करता है।
- source_word: ὡς ἡμιώριον
  choice: लगभग आधे घंटे तक
  rationale: ὡς समय की अनुमानित अवधि बताता है; ‘लगभग’ अनुमान और ‘तक’ अवधि को स्वाभाविक हिन्दी में व्यक्त करते हैं।
theological_decisions:
- issue: ἤνοιξεν के निहित कर्ता का संदर्भ
  choice: ‘उसने’ रखा गया है, जिससे कर्ता पूर्ववर्ती संदर्भ से समझा जाता है।
  alternative: ‘मेम्ने ने’ कहकर कर्ता को स्पष्ट करना।
  rationale: यूनानी पाठ में कर्ता का नाम इस पद में दोहराया नहीं गया है। ‘उसने’ मूल की वाक्यगत निरंतरता और अंतर्निहित संदर्भ को बनाए रखता है, बिना पद में अतिरिक्त स्पष्टता जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सन्नाटा छा गया’ ἐγένετο σιγὴ के आरम्भगत तथा नाटकीय भाव को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक औपचारिक विकल्प पाद-टिप्पणी में दिया गया है।
