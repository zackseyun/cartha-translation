  text: Καὶ οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ σάλπιγγας ἡτοίμασαν ⸀αὑτοὺς ἵνα σαλπίσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/008/006.yaml
  text: And the seven angels who had the seven trumpets prepared themselves to sound them[a].
translation:
  language: hi
  text: और जिन सात स्वर्गदूतों के पास सात तुरहियाँ थीं, उन्होंने उन्हें फूँकने के लिए अपने आपको तैयार किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελοι
  choice: स्वर्गदूतों
  rationale: प्रकाशितवाक्य के इस स्वर्गीय और प्रलय-दर्शी प्रसंग में यह शब्द मानव संदेशवाहकों के बजाय स्वर्गीय प्राणियों को सूचित करता है।
- source_word: ἔχοντες
  choice: जिनके पास ... थीं
  rationale: वर्तमान कृदंत को सहज हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है; इससे सात तुरहियों का उनके अधिकार में होना स्पष्ट रहता है।
- source_word: σάλπιγγας
  choice: तुरहियाँ
  rationale: ‘तुरही’ इस वाद्य और प्रकाशितवाक्य में उसके घोषणात्मक तथा न्याय-संबंधी बिंब के लिए प्रचलित, स्वाभाविक हिन्दी शब्द है।
- source_word: ἡτοίμασαν αὑτοὺς
  choice: अपने आपको तैयार किया
  rationale: क्रिया और निजवाचक सर्वनाम दोनों को स्पष्ट रूप से व्यक्त करते हुए स्वर्गदूतों की आत्म-तैयारी सुरक्षित रखी गई है।
- source_word: ἵνα σαλπίσωσιν
  choice: उन्हें फूँकने के लिए
  rationale: ἵνα के प्रयोजन-बोध को ‘के लिए’ से स्वाभाविक हिन्दी में व्यक्त किया गया है। σαλπίζω का अर्थ तुरही बजाने या फूँककर उसकी ध्वनि निकालने से है; निकटवर्ती बहुवचन ‘तुरहियाँ’ के संदर्भ में ‘उन्हें’ स्पष्ट और सहज है।
theological_decisions:
- issue: प्रलय-दर्शी प्रसंग में ἄγγελοι की प्रकृति
  choice: स्वर्गीय स्वर्गदूत
  alternative: मानव संदेशवाहक
  rationale: प्रकाशितवाक्य 8 का स्वर्गीय दृश्य और सात तुरहियों का उन्हें सौंपा जाना स्वर्गीय प्राणियों के अर्थ का दृढ़ समर्थन करता है; अनुवाद इससे आगे कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘तुरहियाँ फूँकना’ हिन्दी में वाद्य को ध्वनित करने की स्वाभाविक अभिव्यक्ति है, इसलिए अंग्रेज़ी परामर्श-पाठ की वैकल्पिक शब्दावली वाली पादटिप्पणी आवश्यक नहीं मानी गई।
