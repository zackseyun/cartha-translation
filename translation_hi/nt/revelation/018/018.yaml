source:
  edition: SBLGNT
  text: καὶ ⸀ἔκραξαν βλέποντες τὸν καπνὸν τῆς πυρώσεως αὐτῆς λέγοντες· Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/018.yaml
  text: And they cried out as they saw the smoke of her burning[a], saying, “What city is like the great city?”
translation:
  language: hi
  text: और उसके जलने का धुआँ देखकर वे पुकार उठे, “उस महान नगरी के समान कौन-सी नगरी है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से, “कौन उस महान नगरी के समान?” तुलना को स्पष्ट करने के लिए “नगरी” और “है” जोड़े गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξαν
  choice: पुकार उठे
  rationale: क्रिया ऊँची और भावपूर्ण पुकार को व्यक्त करती है; ‘पुकार उठे’ अचानक फूट पड़े विलाप का स्वाभाविक हिन्दी रूप है।
- source_word: βλέποντες
  choice: देखकर
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ-साथ होने वाली क्रिया बताता है; हिन्दी में ‘देखकर’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν καπνὸν τῆς πυρώσεως αὐτῆς
  choice: उसके जलने का धुआँ
  rationale: यह πύρωσις के जलने/दहन के भाव और नगर के स्त्रीरूप चित्रण की ओर संकेत करने वाले αὐτῆς, दोनों को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: Τίς ὁμοία τῇ πόλει τῇ μεγάλῃ;
  choice: उस महान नगरी के समान कौन-सी नगरी है?
  rationale: यूनानी प्रश्न में तुलना का कर्ता और योजक क्रिया व्यक्त नहीं हैं। प्रसंग के आधार पर ‘नगरी’ और ‘है’ जोड़ने से हिन्दी में अर्थ स्पष्ट और आलंकारिक प्रश्न स्वाभाविक रहता है।
- source_word: τῇ πόλει τῇ μεγάλῃ
  choice: उस महान नगरी
  rationale: निश्चित पदबंध प्रसंग में पहले से पहचानी गई नगरी की ओर संकेत करता है। ‘नगरी’ स्त्रीलिंग चित्रण को बनाए रखने में भी सहायक है।
theological_decisions:
- issue: बाबुल/नगरी का स्त्रीरूप चित्रण
  choice: ‘नगरी’ और ‘उसके’ द्वारा मूल चित्रण को बनाए रखना
  alternative: ‘नगर’ का प्रयोग करना
  rationale: प्रकाशितवाक्य में बाबुल को स्त्री और नगरी, दोनों रूपों में चित्रित किया गया है। स्त्रीलिंग ‘नगरी’ इस साहित्यिक-धर्मवैचारिक संबंध को बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के सुरक्षित रखती है।
- issue: तुलनात्मक प्रश्न में यूनानी दीर्घवृत्तता
  choice: स्पष्ट हिन्दी के लिए ‘कौन-सी नगरी है?’
  alternative: ‘कौन उस महान नगरी के समान?’
  rationale: मूल में कर्ता-संज्ञा और योजक क्रिया अनुक्त हैं। हिन्दी में उन्हें पूरा करना अर्थ को नहीं बदलता, जबकि मूल की संक्षिप्तता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुकार उठे’ विलाप की तीव्रता व्यक्त करता है, जबकि ‘महान नगरी’ प्रकाशितवाक्य की स्थापित साहित्यिक छवि को बनाए रखता है।
