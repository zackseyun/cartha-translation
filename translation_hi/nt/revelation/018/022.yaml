id: REV.18.22
reference: Revelation 18:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ φωνὴ κιθαρῳδῶν καὶ μουσικῶν καὶ αὐλητῶν καὶ σαλπιστῶν οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι, καὶ πᾶς τεχνίτης πάσης τέχνης οὐ μὴ εὑρεθῇ ἐν σοὶ ἔτι, καὶ φωνὴ μύλου οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/022.yaml
  text: And the sound of harpists and musicians and flute players and trumpeters will never be heard in you again[a], and no craftsman of any craft will ever be found in you again, and the sound of a mill will never be heard in you again[b],
translation:
  language: hi
  text: और वीणा बजानेवालों, संगीतकारों, बाँसुरी बजानेवालों और तुरही फूँकनेवालों की ध्वनि तुझमें फिर कभी सुनाई न देगी[a]। किसी भी शिल्प का कोई कारीगर तुझमें फिर कभी नहीं मिलेगा, और चक्की की आवाज़ तुझमें फिर कभी सुनाई न देगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पिपहरी बजानेवालों’। यूनानी शब्द αὐλός नामक एक प्राचीन फूँक-वाद्य के बजानेवालों के लिए है; वह वाद्य आधुनिक बाँसुरी के ठीक समान नहीं था।
    reason: lexical_alternative
  - marker: b
    text: या ‘चक्की के पाट की आवाज़’। यूनानी शब्द चक्की अथवा पीसने के उपकरण को अधिक विशिष्ट रूप से सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: ध्वनि / आवाज़
  rationale: यहाँ शब्द बोली हुई वाणी नहीं, सुनाई देनेवाली ध्वनि को दर्शाता है। संगीत के लिए ‘ध्वनि’ और चक्की के लिए स्वाभाविक हिन्दी ‘आवाज़’ रखी गई है; यूनानी की पुनरावृत्ति अर्थ की दृष्टि से बनी रहती है।
- source_word: κιθαρῳδῶν
  choice: वीणा बजानेवालों
  rationale: शब्द किथारा से जुड़े वादकों को दर्शाता है। प्राचीन किथारा आधुनिक वीणा के समान नहीं थी, फिर भी ‘वीणा’ हिन्दी बाइबलीय शैली में सुबोध निकटतम सांस्कृतिक समतुल्य है।
- source_word: μουσικῶν
  choice: संगीतकारों
  rationale: यह संगीत से जुड़े कलाकारों का व्यापक वर्ग है; ‘संगीतकार’ सूची में स्वाभाविक और व्यापक है।
- source_word: αὐλητῶν
  choice: बाँसुरी बजानेवालों
  rationale: αὐλός बजानेवालों के लिए यह आम पाठक को तुरंत समझ आनेवाला रूप है, जबकि पादटिप्पणी स्पष्ट करती है कि प्राचीन वाद्य आधुनिक बाँसुरी के ठीक समान नहीं था।
- source_word: σαλπιστῶν
  choice: तुरही फूँकनेवालों
  rationale: यह तुरही बजानेवालों का स्पष्ट और स्वाभाविक हिन्दी वर्णन है।
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: फिर कभी सुनाई न देगी
  rationale: οὐ μή की प्रबल निषेधात्मकता और ἔτι से व्यक्त अंतिम समाप्ति—दोनों को ‘फिर कभी ... न’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν σοὶ
  choice: तुझमें
  rationale: बाबुल को मानवीकृत नगर के रूप में सीधे एकवचन संबोधन देनेवाले यूनानी रूप को सुरक्षित रखता है।
- source_word: πᾶς τεχνίτης πάσης τέχνης
  choice: किसी भी कला का कोई कारीगर
  rationale: यह व्यापक अभिव्यक्ति हर प्रकार के कुशल शिल्पी को समेटती है और मूल की ‘हर/किसी भी’ व्यापकता बनाए रखती है।
- source_word: εὑρεθῇ
  choice: मिलेगा
  rationale: निषेध और ‘फिर कभी’ के साथ यह पूर्ण अनुपस्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μύλου
  choice: चक्की
  rationale: यह पीसने की चक्की अथवा उसकी व्यवस्था को सूचित कर सकता है। ‘चक्की की आवाज़’ दैनिक पीसने के काम की ठोस छवि को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: बाबुल के न्याय की छवि
  choice: उत्सवपूर्ण संगीत, कुशल श्रम और दैनिक पीसने की गतिविधि के पूर्णतः समाप्त हो जाने की तीन ठोस घोषणाओं के रूप में पद प्रस्तुत किया गया है।
  alternative: इन वस्तुओं को प्रतीकात्मक अर्थ से रहित केवल सजावटी विवरण मानना।
  rationale: बार-बार आनेवाला οὐ μή ... ἔτι पूर्ण और अपरिवर्तनीय उजाड़ को बल देता है। अनुवाद ठोस चित्रों को बनाए रखता है, पर उनका अत्यधिक रूपकात्मक अर्थ निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। बाबुल के लिए मूल का सीधा एकवचन संबोधन ‘तुझमें’ सुरक्षित है। सूची की लय और ‘फिर कभी’ की तीनfold अंतिमता बनाए रखी गई है; ‘बजानेवालों’ का संयुक्त लेखन मानक हिन्दी वर्तनी के अनुरूप है।
