    issue: ‘बढ़िया मलमल’ for βύσσινον
    rationale: ‘मलमल’ is muslin, whereas βύσσινον refers to fine linen. The proposed wording narrows and can alter the textile reference.
  - severity: low
    issue: ‘लाल रंग’ for κόκκινον
    rationale: The Greek denotes scarlet/crimson-like red. ‘चटकीले लाल’ more clearly preserves the vivid scarlet sense without using an unnecessarily obscure term.
  - severity: low
    issue: Clothing-list syntax
    rationale: In ‘बढ़िया मलमल, बैंगनी और लाल रंग के वस्त्र,’ ‘वस्त्र’ is syntactically most immediately tied to the final color phrase. A revised coordinated list is clearer.
