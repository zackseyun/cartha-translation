id: REV.18.16
reference: Revelation 18:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἡ περιβεβλημένη βύσσινον καὶ πορφυροῦν καὶ κόκκινον καὶ ⸀κεχρυσωμένη χρυσίῳ καὶ λίθῳ τιμίῳ καὶ ⸀μαργαρίτῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/016.yaml
  text: saying[a], “Woe, woe, the great city, clothed in fine linen and purple and scarlet, and adorned with gold and precious stones and pearls,”
translation:
  language: hi
  text: वे कह रहे थे, “हाय, हाय! वह महान नगरी, जो महीन लिनन तथा बैंगनी और चटकीले लाल वस्त्र पहने हुए थी और सोने, बहुमूल्य पत्थरों और मोतियों से सजी हुई थी!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान सक्रिय कृदन्त पिछले पद के बहुवचन कर्ताओं की चल रही वाणी का परिचय देता है; हिन्दी में स्पष्ट और स्वाभाविक संबंध के लिए कर्ता सहित यह रूप उपयुक्त है।
- source_word: Οὐαὶ οὐαί
  choice: हाय, हाय!
  rationale: यह दोहराया हुआ विस्मयादिबोधक शोक और आसन्न न्याय—दोनों का भाव रखता है। आधुनिक हिन्दी में ‘हाय’ विलाप की तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ πόλις ἡ μεγάλη
  choice: वह महान नगरी
  rationale: दोहराए गए यूनानी लेख से चिह्नित प्रसिद्ध/पहले से निर्दिष्ट नगरी और विशेषण के बल को सहज हिन्दी में रखा गया है।
- source_word: περιβεβλημένη
  choice: वस्त्र पहने थी
  rationale: पूर्ण कृदन्त नगरी की विद्यमान सुसज्जित अवस्था बताता है; रंग-सूचक पदों के साथ ‘वस्त्र’ जोड़ना हिन्दी में अर्थ को स्वाभाविक और स्पष्ट बनाता है।
- source_word: βύσσινον
  choice: बढ़िया मलमल
  rationale: यह महँगे, महीन लिनन का द्योतक है; ‘बढ़िया मलमल’ विलासिता और कपड़े की महीनता दोनों व्यक्त करता है।
- source_word: πορφυροῦν
  choice: बैंगनी
  rationale: धन और राजसी वैभव से जुड़े रंग को सीधे सुरक्षित रखता है।
- source_word: κόκκινον
  choice: लाल रंग
  rationale: चमकीले स्कारलेट रंग का सामान्य आधुनिक हिन्दी रूप; वस्त्रों की वैभवपूर्ण रंग-सूची में स्वाभाविक है।
- source_word: κεχρυσωμένη
  choice: सजी थी
  rationale: क्रिया सोने से मढ़े होने का भाव दे सकती है, पर आगे सोना, बहुमूल्य पत्थर और मोती एक साथ आते हैं; इसलिए व्यापक अलंकरण व्यक्त करने वाला ‘सजी थी’ अधिक उपयुक्त है।
- source_word: χρυσίῳ
  choice: सोने
  rationale: अलंकरण की सामग्री को सीधा और स्वाभाविक रूप से व्यक्त करता है।
- source_word: λίθῳ τιμίῳ
  choice: बहुमूल्य पत्थरों
  rationale: यूनानी एकवचन यहाँ पदार्थ/वर्ग का सामूहिक बोध करा सकता है; हिन्दी की वैभव-सूची में बहुवचन अधिक स्वाभाविक है।
- source_word: μαργαρίτῃ
  choice: मोतियों
  rationale: यूनानी एकवचन को सामूहिक अर्थ में समझते हुए हिन्दी में स्वाभाविक बहुवचन रखा गया है।
theological_decisions:
- issue: बाबुल के पतन पर विलाप और न्याय का संयुक्त स्वर
  choice: οὐαί को ‘हाय’ के रूप में रखकर तीव्र विलाप व्यक्त करना
  alternative: ‘धिक्कार’ या ‘सन्ताप’ जैसे रूपों से न्याय के पक्ष को अधिक प्रत्यक्ष करना
  rationale: वक्ताओं की प्रतिक्रिया यहाँ विलापात्मक है, जबकि व्यापक प्रसंग इसे न्याय की घोषणा बनाता है। ‘हाय, हाय!’ शोक को स्वाभाविक हिन्दी में रखता है और प्रसंग न्याय का आयाम बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। नगरी का मानवीकरण बनाए रखने के लिए ‘वस्त्र पहने थी’ और ‘सजी थी’ प्रयुक्त हैं। पद पिछले वाक्य से जुड़ा है, इसलिए आरम्भ में ‘वे कह रहे थे’ रखा गया है।
