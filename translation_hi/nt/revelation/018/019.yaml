source:
  edition: SBLGNT
  text: καὶ ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν καὶ ⸀ἔκραξαν κλαίοντες καὶ ⸀πενθοῦντες λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, ἐν ᾗ ἐπλούτησαν πάντες οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ ἐκ τῆς τιμιότητος αὐτῆς, ὅτι μιᾷ ὥρᾳ ἠρημώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/019.yaml
  text: And they threw dust on their heads and cried out[a], weeping and mourning, saying, “Woe, woe, the great city, in which all who had ships on the sea became rich from her wealth[b], because in one hour she has been laid waste.”
translation:
  language: hi
  text: और उन्होंने अपने सिरों पर धूल डाली और ऊँचे स्वर से पुकारते हुए, रोते और विलाप करते हुए, कहा, “हाय, हाय, वह महान नगर! उसके कीमती वैभव[a] से समुद्र में जहाज़ रखने वाले सब लोग धनी हो गए थे; क्योंकि एक ही घड़ी में वह उजाड़ दिया गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘समृद्धि/धन’, ‘महँगी विलासिता’, ‘भव्यता’ या ‘बहुमूल्यता’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλον χοῦν ἐπὶ τὰς κεφαλὰς αὐτῶν
  choice: उन्होंने अपने सिरों पर धूल डाली
  rationale: यह शोक की पारंपरिक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और मूल बिंब को बनाए रखता है।
- source_word: ἔκραξαν κλαίοντες καὶ πενθοῦντες
  choice: रोते और विलाप करते हुए ऊँचे स्वर से पुकारकर कहा
  rationale: ἔκραξαν की तीव्र, ऊँची पुकार तथा κλαίοντες और πενθοῦντες के अलग-अलग शोकभावों को स्पष्ट रखता है।
- source_word: Οὐαὶ οὐαί
  choice: हाय! हाय!
  rationale: हिन्दी में यह शोकपूर्ण पुकार स्वाभाविक है और दोहराव मूल की तीव्रता बनाए रखता है; इसके न्यायसूचक भविष्यवाणीगत आयाम को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἡ πόλις ἡ μεγάλη
  choice: वह महान नगर
  rationale: यूनानी विशेषणयुक्त पदबंध का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἐν ᾗ ἐπλούτησαν
  choice: जिसकी ... से ... धनी हो गए
  rationale: शाब्दिक ‘जिसमें’ की अपेक्षा यहाँ नगर की बहुमूल्य समृद्धि को धनार्जन का स्रोत बताने वाला संबंध हिन्दी में अधिक स्पष्ट और स्वाभाविक है।
- source_word: οἱ ἔχοντες τὰ πλοῖα ἐν τῇ θαλάσσῃ
  choice: वे सब ... जिनके जहाज़ समुद्र में चलते थे
  rationale: ἔχοντες को ‘जिनके जहाज़’ से व्यक्त करते हुए समुद्री व्यापार का आशय स्पष्ट करता है, बिना केवल कानूनी स्वामित्व पर बल दिए।
- source_word: ἐκ τῆς τιμιότητος αὐτῆς
  choice: उसकी बहुमूल्य समृद्धि
  rationale: τιμιότης में निहित मूल्यवानता, महँगी भव्यता और आर्थिक समृद्धि के संयुक्त भाव को यथासंभव सुरक्षित रखता है।
- source_word: μιᾷ ὥρᾳ
  choice: एक ही घड़ी में
  rationale: अचानक और बहुत थोड़े समय में हुए विनाश पर मूल के बल को बनाए रखता है।
- source_word: ἠρημώθη
  choice: वह उजाड़ दिया गया
  rationale: यूनानी निष्क्रिय रूप और विनाश के परिणामी उजाड़पन, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: Οὐαὶ οὐαί में शोक और न्याय-घोषणा का संयुक्त स्वर
  choice: हाय! हाय!
  alternative: धिक्कार! धिक्कार!
  rationale: ‘हाय’ हिन्दी में वास्तविक विलाप के संदर्भ में अधिक स्वाभाविक है, जबकि पादटिप्पणी बताती है कि यूनानी पुकार भविष्यवाणीगत न्याय या विपत्ति की घोषणा भी हो सकती है; इस प्रकार किसी एक आयाम से दूसरे को दबाया नहीं गया।
- issue: नगर के स्त्रीलिंग यूनानी सर्वनाम का हिन्दी में निरूपण
  choice: व्याकरणानुसार पुल्लिंग ‘वह/उसकी’
  alternative: स्त्रीरूप ‘वह/उसकी ... उजाड़ दी गई’ द्वारा नगर का मानवीकरण
  rationale: आधुनिक हिन्दी में ‘नगर’ पुल्लिंग है। मूल का व्यक्तिकरण संदर्भ से बना रहता है, पर अस्वाभाविक लिंग-सामंजस्य नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज प्रकाशन-रजिस्टर अपनाया गया है। ‘घड़ी’ अपोकैलिप्टिक अचानकपन को बनाए रखती है; ‘ऊँचे स्वर से पुकारकर’ विलाप की तीव्रता स्पष्ट करता है। मुख्य पाठ में [a] पादटिप्पणी-चिह्न सम्मिलित है।
