id: REV.18.20
reference: Revelation 18:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εὐφραίνου ἐπ’ αὐτῇ, οὐρανέ, καὶ οἱ ἅγιοι καὶ οἱ ἀπόστολοι καὶ οἱ προφῆται, ὅτι ἔκρινεν ὁ θεὸς τὸ κρίμα ὑμῶν ἐξ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/020.yaml
  text: Rejoice over her[a], O heaven, and you saints and apostles and prophets, because God has judged your judgment from her.
translation:
  language: hi
  text: हे स्वर्ग, उस पर आनन्द मना! और हे पवित्र लोगो, प्रेरितो और भविष्यद्वक्ताओ, तुम भी आनन्द मनाओ, क्योंकि परमेश्वर ने उसके विरुद्ध तुम्हारे पक्ष में न्याय किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश बहुत संक्षिप्त है; शाब्दिक रूप से, “परमेश्वर ने उससे तुम्हारे न्याय का न्याय किया।” भाव यह भी हो सकता है, “परमेश्वर ने तुम्हारे कारण उसका न्याय किया” या “परमेश्वर ने उससे तुम्हारा बदला लिया।”
    reason: मूल की संक्षिप्त और कुछ हद तक अस्पष्ट न्यायिक अभिव्यक्ति तथा उसके प्रमुख सम्भव अर्थ सुरक्षित रखना।
lexical_decisions:
- source_word: Εὐφραίνου ἐπ’ αὐτῇ
  choice: उस पर आनन्द मना
  rationale: आज्ञार्थक संबोधन और ἐπί के अवसर/विषय संबंधी भाव को संक्षेप में रखता है; संदर्भ में आनन्द का अवसर उस स्त्रीरूपी नगर का पतन है, पर ‘पतन’ शब्द मूल में यहाँ स्पष्टतः नहीं है।
- source_word: οὐρανέ
  choice: हे स्वर्ग
  rationale: एकवचन संबोधन और स्वर्ग के मानवीकरण को सुरक्षित रखता है।
- source_word: οἱ ἅγιοι
  choice: पवित्र लोगो
  rationale: यहाँ शब्द परमेश्वर के पवित्र लोगों को सूचित करता है। आधुनिक हिन्दी में संबोधन के रूप में यह ‘सन्तो’ की अपेक्षा अधिक स्पष्ट और कम सम्प्रदाय-विशिष्ट है।
- source_word: οἱ ἀπόστολοι
  choice: प्रेरितो
  rationale: भविष्यद्वक्ताओं के साथ प्रयुक्त होने पर तकनीकी अर्थ ‘प्रेरित’ सबसे उपयुक्त है।
- source_word: οἱ προφῆται
  choice: भविष्यद्वक्ताओ
  rationale: προφῆται का प्रचलित और प्रसंगानुकूल हिन्दी रूप।
- source_word: ὅτι ἔκρινεν ὁ θεὸς
  choice: क्योंकि परमेश्वर ने … न्याय किया है
  rationale: ὅτι आज्ञा का कारण बताता है और ἔκρινεν परमेश्वर के पूर्ण हो चुके न्यायिक कार्य को व्यक्त करता है। ‘किया है’ वर्तमान प्रसंग में उसके परिणाम की प्रासंगिकता बनाए रखता है।
- source_word: τὸ κρίμα ὑμῶν ἐξ αὐτῆς
  choice: उसके विरुद्ध तुम्हारे पक्ष में न्याय किया है
  rationale: यूनानी अभिव्यक्ति अत्यन्त संक्षिप्त है। यह हिन्दी परमेश्वर द्वारा उसके विरुद्ध सम्बोधित लोगों का पक्ष न्यायपूर्वक सिद्ध किए जाने का सम्भावित भाव स्वाभाविक ढंग से देती है, जबकि पादटिप्पणी शाब्दिक संक्षिप्तता और अन्य सम्भव अर्थ सुरक्षित रखती है।
theological_decisions:
- issue: बाबुल के विरुद्ध परमेश्वर के न्याय को पवित्र लोगों के पक्ष में कितना स्पष्ट किया जाए
  choice: उसके विरुद्ध तुम्हारे पक्ष में न्याय किया है
  alternative: उससे तुम्हारा न्याय लिया है; उसने तुम्हारा बदला उससे लिया है; शाब्दिक रूप से, ‘उससे तुम्हारे न्याय का न्याय किया’
  rationale: κρίνω/κρίμα न्यायिक शब्दावली है, प्रतिशोध का स्पष्ट क्रियापद नहीं। मुख्य पाठ में स्वाभाविक हिन्दी के लिए पक्ष-सिद्धि का भाव व्यक्त किया गया है, पर ‘बदला लिया’ नहीं रखा गया; मूल की असामान्य संक्षिप्तता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘हे’ से प्रत्यक्ष संबोधन बनाए रखा गया है। यूनानी में केवल ‘स्वर्ग’ के साथ एकवचन आज्ञार्थक क्रिया है; शेष समूहों को उसी आह्वान में सम्मिलित समझते हुए हिन्दी में स्पष्टता के लिए ‘तुम भी आनन्द मनाओ’ जोड़ा गया है।
