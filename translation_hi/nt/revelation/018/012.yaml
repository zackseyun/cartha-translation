id: REV.18.12
reference: Revelation 18:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γόμον χρυσοῦ καὶ ἀργύρου καὶ λίθου τιμίου καὶ ⸀μαργαριτῶν καὶ βυσσίνου καὶ ⸀πορφύρας καὶ σιρικοῦ καὶ κοκκίνου, καὶ πᾶν ξύλον θύϊνον καὶ πᾶν σκεῦος ἐλεφάντινον καὶ πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου καὶ χαλκοῦ καὶ σιδήρου καὶ μαρμάρου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/012.yaml
  text: cargo of gold and silver and precious stones and pearls and fine linen and purple cloth and silk and scarlet cloth[a], and every kind of citron wood and every kind of ivory vessel and every kind of vessel made from very precious wood and bronze and iron and marble,
translation:
  language: hi
  text: सोने, चाँदी, बहुमूल्य रत्नों, मोतियों, महीन लिनन, बैंजनी कपड़े, रेशम और गहरे लाल कपड़े का माल; और हर प्रकार की सुगंधित कीमती लकड़ी[a], हाथीदाँत की हर प्रकार की वस्तु, और अत्यन्त बहुमूल्य लकड़ी, काँसे, लोहे और संगमरमर से बनी हर प्रकार की वस्तु;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द किसी महँगी सुगंधित लकड़ी को दर्शाता है; परम्परागत रूप से इसे ‘थूइन लकड़ी’ या ‘सिट्रन लकड़ी’ कहा गया है।
    reason: मूल शब्द की सटीक वनस्पति-पहचान अनिश्चित है और परम्परागत नाम सामान्य पाठक के लिए अस्पष्ट हो सकते हैं।
lexical_decisions:
- source_word: γόμον
  choice: माल
  rationale: यह जहाज़ पर लदे व्यापारिक माल का सामूहिक बोध कराता है; हिन्दी में ‘माल’ इस सूची और पिछले पद से जारी वाक्य-संबंध के लिए स्वाभाविक है।
- source_word: λίθου τιμίου
  choice: बहुमूल्य रत्नों
  rationale: यूनानी में एकवचन रूप पदार्थ/वर्ग के सामूहिक अर्थ में है; हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: μαργαριτῶν
  choice: मोतियों
  rationale: मूल का स्पष्ट बहुवचन अर्थ सुरक्षित रखा गया है।
- source_word: βυσσίνου
  choice: महीन मलमल
  rationale: यह उच्च कोटि के महीन लिनन-वस्त्र को दर्शाता है; ‘महीन मलमल’ सामान्य हिन्दी पाठक के लिए स्वाभाविक और विलासिता-सूचक है।
- source_word: πορφύρας
  choice: बैंजनी कपड़े
  rationale: शब्द रंग, रंगे कपड़े या वस्त्र का संकेत दे सकता है; व्यापारिक सूची में ‘कपड़े’ जोड़ने से वस्तु स्पष्ट होती है, जबकि मूल की अर्थ-सीमा बनी रहती है।
- source_word: σιρικοῦ
  choice: रेशम
  rationale: पूर्व से जुड़े रेशम अथवा रेशमी वस्तुओं के लिए स्वाभाविक हिन्दी शब्द।
- source_word: κοκκίνου
  choice: लाल रंग के कपड़े
  rationale: शब्द गहरे लाल/स्कारलेट रंग की सामग्री को दर्शाता है; व्यापारिक संदर्भ में कपड़ा अभिप्रेत है।
- source_word: πᾶν ξύλον θύϊνον
  choice: हर प्रकार की सुगंधित कीमती लकड़ी
  rationale: θύϊνος किसी महँगी सुगंधित लकड़ी को दर्शाता है, पर उसकी सटीक वनस्पति-पहचान अनिश्चित है; वर्णनात्मक अनुवाद अनावश्यक निश्चितता से बचता है।
- source_word: πᾶν σκεῦος ἐλεφάντινον
  choice: हाथीदाँत की हर प्रकार की वस्तु
  rationale: σκεῦος का अर्थ पात्र से अधिक व्यापक होकर वस्तु या सामान भी हो सकता है; ‘वस्तु’ विलास-सामग्री की सूची में उपयुक्त है।
- source_word: πᾶν σκεῦος ἐκ ξύλου τιμιωτάτου
  choice: अत्यन्त बहुमूल्य लकड़ी ... से बनी हर प्रकार की वस्तु
  rationale: τιμιωτάτου के अतिशय मूल्यबोध को ‘अत्यन्त बहुमूल्य’ व्यक्त करता है और ἐκ को ‘से बनी’ स्वाभाविक रूप से दर्शाता है।
- source_word: χαλκοῦ
  choice: काँसे
  rationale: χαλκός ताँबे या काँसे को सूचित कर सकता है; प्राचीन निर्मित विलास-वस्तुओं के संदर्भ में काँसा उपयुक्त है।
- source_word: σιδήρου
  choice: लोहे
  rationale: मानक और प्रत्यक्ष अर्थ।
- source_word: μαρμάρου
  choice: संगमरमर
  rationale: मानक और प्रत्यक्ष अर्थ।
