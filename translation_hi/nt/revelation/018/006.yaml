base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/006.yaml
  text: Pay her back as she herself has paid back[a], and repay her double according to her works; in the cup that she mixed[b], mix a double portion for her.
translation:
  language: hi
  text: उसने जैसा बदला चुकाया है, वैसा ही उसे भी चुकाओ; उसके कर्मों के अनुसार उसे दुगुना बदला दो। जिस प्याले में उसने पेय मिलाया था, उसमें उसके लिए दुगुनी मात्रा मिलाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी अभिव्यक्ति संक्षिप्त और बहुत प्रबल है; इसका अधिक शाब्दिक अर्थ ‘उसके लिए दुगुनी चीज़ें दुगुनी करो’ भी समझा जा सकता है, जो तीव्र किए गए बदले पर बल देता है। प्याले में पेय मिलाने का बिंब संभवतः न्याय के लिए तैयार किए गए पेय की ओर संकेत करता है।
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: ἀπόδοτε αὐτῇ ὡς καὶ αὐτὴ ἀπέδωκεν
  choice: उसने जैसा बदला चुकाया है, वैसा ही उसे भी चुकाओ
  rationale: ἀποδίδωμι की पुनरावृत्ति प्रतिफल अथवा प्रतिशोधात्मक बदले का भाव रखती है; ‘उसे भी’ αὐτή के बल और प्रत्युत्तरात्मक समानता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διπλώσατε τὰ διπλᾶ
  choice: उसे दुगुना बदला दो
  rationale: यूनानी पदबंध संक्षिप्त और अलंकारिक रूप से प्रबल है। यह चयन उसकी दुगुनी प्रतिपूर्ति की तीव्रता बचाता है, पर हिन्दी में अस्वाभाविक ‘दुगुनी वस्तुओं को दुगुना करो’ से बचता है।
- source_word: κατὰ τὰ ἔργα αὐτῆς
  choice: उसके कामों के अनुसार
  rationale: ἔργα का सीधा अर्थ ‘काम/कर्म’ है। ‘कामों’ सामान्य आधुनिक हिन्दी में स्पष्ट है और न्यायानुसार प्रतिफल का भाव रखता है।
- source_word: ἐν τῷ ποτηρίῳ ᾧ ἐκέρασεν
  choice: जिस प्याले में उसने मिलाकर तैयार किया था
  rationale: κεράννυμι पेय को मिलाने या मिश्रित करके तैयार करने को दर्शाता है। संयुक्त अभिव्यक्ति हिन्दी पाठक के लिए क्रिया और बिंब दोनों स्पष्ट करती है।
- source_word: κεράσατε αὐτῇ διπλοῦν
  choice: उसी में उसके लिए दुगुना मिलाओ
  rationale: मूल में ‘मिलाने’ की क्रिया फिर आती है और प्याले के भीतर दुगुनी मात्रा का चित्र प्रस्तुत करती है; अनावश्यक रूप से ‘हिस्सा’ जोड़ने के बजाय संक्षिप्तता और मूल की पुनरावृत्ति रखी गई है।
theological_decisions:
- issue: दुगुने बदले का स्वरूप
  choice: दुगुने न्यायिक प्रतिफल के प्रलय-साहित्यिक बिंब को यथावत रखना
  alternative: ‘दुगुना’ को कठोर गणितीय दंड-विधान मानना, या उसे केवल सामान्य न्याय के रूप में नरम कर देना
  rationale: पद तीव्र और अनुपातपूर्ण दंड की भाषा बोलता है, पर यह स्वयं स्पष्ट नहीं करता कि दुगुना गणितीय रूप से अक्षरशः है या अलंकारिक बलाघात। अनुवाद इस तनाव को खुला रखता है।
- issue: प्याले का आशय
  choice: प्याले और मिश्रित पेय के बिंब को बनाए रखना
  alternative: सीधे ‘न्याय का दंड’ कहकर बिंब का अर्थ निर्धारित कर देना
  rationale: संदर्भ में प्याला न्याय का बिंब हो सकता है, किंतु मूल पद स्वयं ‘न्याय’ शब्द नहीं जोड़ता; इसलिए मुख्य पाठ में प्रतीक को व्याख्यात्मक पद से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बदला चुकाना’, ‘कामों के अनुसार’ और ‘प्याला’ न्यायिक तथा प्रकाशन-साहित्य के प्रतीकात्मक स्वर को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
