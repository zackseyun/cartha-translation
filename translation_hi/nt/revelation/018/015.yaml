id: REV.18.15
reference: Revelation 18:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ ἔμποροι τούτων, οἱ πλουτήσαντες ἀπ’ αὐτῆς, ἀπὸ μακρόθεν στήσονται διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς κλαίοντες καὶ πενθοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/015.yaml
  text: The merchants of these things[a], who became rich from her, will stand far off because of the fear of her torment, weeping and mourning,
translation:
  language: hi
  text: इन वस्तुओं के व्यापारी[a], जो उससे धनी हो गए थे, उसकी यातना के भय से दूर खड़े रहेंगे, रोते और शोक करते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इन मालों के’ अथवा ‘इन व्यापारिक वस्तुओं के’; यह वाक्यांश आस-पास के प्रसंग में गिनाई गई विलास-वस्तुओं की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: व्यापारी
  rationale: यह शब्द वाणिज्य में लगे लोगों को दर्शाता है; आर्थिक न्याय के इस प्रसंग में ‘व्यापारी’ स्वाभाविक और सटीक है।
- source_word: τούτων
  choice: इन वस्तुओं के
  rationale: सम्बन्धकारक संकेतवाचक पद निकटवर्ती प्रसंग में गिनाई गई विलास-वस्तुओं की ओर लौटता है; यह अनुवाद उस संदर्भ को बनाए रखता है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: πλουτήσαντες
  choice: जो उससे धनी हो गए थे
  rationale: अोरिस्ट कृदन्त व्यापारियों के बाबुल से पहले ही धनवान हो जाने को दर्शाता है; ‘हो गए थे’ उस पूर्ववर्ती परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπ’ αὐτῆς
  choice: उससे
  rationale: ἀπό स्रोत को सूचित करता है; ‘उससे’ स्पष्ट करता है कि उनकी समृद्धि का स्रोत वह स्त्रीरूप नगर था।
- source_word: ἀπὸ μακρόθεν στήσονται
  choice: दूर खड़े होकर
  rationale: यूनानी वाक्यांश जानबूझकर दूरी बनाए रखने का दृश्य प्रस्तुत करता है। हिन्दी की संयुक्त क्रिया आगामी रोने और शोक मनाने की क्रियाओं से स्वाभाविक रूप से जुड़ती है।
- source_word: διὰ τὸν φόβον
  choice: के भय से
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; ‘के भय से’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: βασανισμοῦ
  choice: यातना
  rationale: प्रकाशितवाक्य में यह शब्द न्याय से जुड़ी कठोर पीड़ा दर्शाता है; ‘यातना’ उसकी तीव्रता बनाए रखती है, पर पाठ से आगे बढ़कर कोई विस्तृत सिद्धान्त नहीं जोड़ती।
- source_word: κλαίοντες
  choice: रोएँगे
  rationale: यह कृदन्त रोने की प्रत्यक्ष क्रिया बताता है; भविष्यकालीन मुख्य क्रिया के अधीन हिन्दी में इसे ‘रोएँगे’ कहना स्पष्ट और स्वाभाविक है।
- source_word: πενθοῦντες
  choice: शोक मनाएँगे
  rationale: यह हानि पर मातम या शोक को दर्शाता है और ‘रोएँगे’ से अर्थगत भेद बनाए रखता है।
theological_decisions:
- issue: प्रकाशितवाक्य की न्याय-संबंधी भाषा में βασανισμός का स्वरूप
  choice: ‘यातना’ के रूप में अनुवाद किया गया है, ताकि कठोर दण्डात्मक पीड़ा की गंभीरता बनी रहे।
  alternative: ‘दण्ड’ या ‘कष्ट’
  rationale: तात्कालिक प्रसंग बाबुल के न्याय का है और प्रकाशितवाक्य में यह संज्ञा गंभीर पीड़ा के लिए आती है। ‘यातना’ पाठ की तीव्रता को न तो नरम करती है, न अंतिम दण्ड के बारे में उससे अधिक कोई सिद्धान्त जोड़ती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग ‘उससे/उसकी’ प्रतीकात्मक नगर बाबुल के स्त्रीरूप संदर्भ को बनाए रखता है।
