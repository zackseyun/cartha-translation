source:
  edition: SBLGNT
  text: Καὶ ἦρεν εἷς ἄγγελος ἰσχυρὸς λίθον ὡς ⸀μύλινον μέγαν, καὶ ἔβαλεν εἰς τὴν θάλασσαν λέγων· Οὕτως ὁρμήματι βληθήσεται Βαβυλὼν ἡ μεγάλη πόλις, καὶ οὐ μὴ εὑρεθῇ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/021.yaml
  text: And one mighty angel lifted up a stone like a great millstone and threw it into the sea[a], saying, “So will Babylon the great city be thrown down with violence, and it will never be found again.”
translation:
  language: hi
  text: तब एक शक्तिशाली स्वर्गदूत ने बड़ी चक्की के पाट जैसा एक पत्थर उठाकर समुद्र में फेंक दिया और कहा, “इसी तरह महान नगरी बाबेल बड़े वेग से फेंक दी जाएगी[a], और वह फिर कभी नहीं पाई जाएगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़े झटके से,” “प्रचंड बल से,” अथवा “हिंसापूर्वक।” यूनानी शब्द अचानक और बलपूर्ण गति का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦρεν
  choice: उठाकर
  rationale: यह क्रिया प्रतीकात्मक कार्य की तैयारी में पत्थर उठाने को व्यक्त करती है; ‘उठाकर’ स्वाभाविक हिन्दी में अगली क्रिया से जुड़ती है।
- source_word: εἷς ἄγγελος ἰσχυρὸς
  choice: एक सामर्थी स्वर्गदूत
  rationale: εἷς की एकवचन विशिष्टता और ἰσχυρός की शक्ति—दोनों सुरक्षित रहते हैं; ‘सामर्थी’ प्रकाशितवाक्य की गरिमापूर्ण शैली के अनुकूल है।
- source_word: λίθον ὡς μύλινον μέγαν
  choice: बड़ी चक्की के पाट जैसे एक पत्थर
  rationale: ὡς के तुलनात्मक भाव को बनाए रखते हुए पत्थर को सीधे चक्की का पाट नहीं ठहराया गया; ‘चक्की का पाट’ आधुनिक हिन्दी में भारी millstone की स्पष्ट छवि देता है।
- source_word: ἔβαλεν εἰς τὴν θάλασσαν
  choice: समुद्र में फेंक दिया
  rationale: फेंकने की जानबूझकर और बलपूर्वक की गई क्रिया को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οὕτως
  choice: इसी तरह
  rationale: स्वर्गदूत के प्रतीकात्मक कार्य और उसके द्वारा बताई गई बाबेल की दशा के बीच स्पष्ट तुलना रखता है।
- source_word: ὁρμήματι
  choice: बड़े वेग से
  rationale: यह शब्द आकस्मिक, प्रचंड और बलपूर्ण गति का बोध देता है; ‘बड़े वेग से’ उस गतिशील छवि को सुरक्षित रखता है और ‘हिंसा’ जैसे संभावित रूप से संकुचित अर्थ से बचता है।
- source_word: βληθήσεται
  choice: गिरा दी जाएगी
  rationale: भविष्यत् कर्मवाच्य और विनाशकारी अधोगति व्यक्त होती है, साथ ही पहले पत्थर फेंके जाने की क्रिया की प्रतिध्वनि बनी रहती है।
- source_word: Βαβυλὼν ἡ μεγάλη πόλις
  choice: महान नगरी बाबेल
  rationale: बाबेल को महान नगरी के रूप में प्रस्तुत करने वाली अपोसिशनल पहचान को स्वाभाविक हिन्दी क्रम में रखता है।
- source_word: οὐ μὴ εὑρεθῇ ἔτι
  choice: फिर कभी उसका पता नहीं मिलेगा
  rationale: οὐ μή की प्रबल निषेधात्मकता और ἔτι के ‘फिर/आगे’ भाव को मुहावरेदार हिन्दी में अंतिमता के साथ व्यक्त करता है।
theological_decisions:
- issue: बाबेल के विनाश की छवि का स्वरूप
  choice: न्याय को प्रचंड और अंतिम रूप में व्यक्त किया गया, पर बाबेल को केवल शाब्दिक या केवल प्रतीकात्मक नहीं ठहराया गया।
  alternative: बाबेल को ऐतिहासिक नगर, परमेश्वर-विरोधी विश्व-व्यवस्था, या संयुक्त प्रलय-संबंधी प्रतीक के रूप में स्पष्ट करना।
  rationale: पद स्वयं प्रतीकात्मक क्रिया और विनाश की घोषणा प्रस्तुत करता है, पर बाबेल के संकेतार्थ को यहाँ निर्णायक रूप से नहीं खोलता; इसलिए अनुवाद उस धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्गदूत,’ ‘चक्की का पाट,’ ‘बड़े वेग से’ और ‘पता नहीं मिलेगा’ ठोस चित्र, प्रचंडता तथा अंतिमता को स्वाभाविक ढंग से व्यक्त करते हैं।
