  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ φῶς λύχνου οὐ μὴ φάνῃ ἐν σοὶ ἔτι, καὶ φωνὴ νυμφίου καὶ νύμφης οὐ μὴ ἀκουσθῇ ἐν σοὶ ἔτι· ὅτι οἱ ἔμποροί σου ἦσαν οἱ μεγιστᾶνες τῆς γῆς, ὅτι ἐν τῇ φαρμακείᾳ σου ἐπλανήθησαν πάντα τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/023.yaml
  text: And the light of a lamp will never shine in you again[a], and the voice of bridegroom and bride will never be heard in you again; for your merchants were the great ones of the earth[b], because by your sorcery all the nations were led astray.
translation:
  language: hi
  text: और फिर कभी तुझमें दीपक का प्रकाश नहीं चमकेगा, और फिर कभी तुझमें दूल्हे और दुल्हन की आवाज़ नहीं सुनाई देगी; क्योंकि तेरे व्यापारी पृथ्वी के प्रमुख लोग थे[a], क्योंकि तेरे जादू-टोने से सारे राष्ट्र भरमाए गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पृथ्वी के प्रभावशाली लोग’। यूनानी शब्द बहुत प्रतिष्ठित या शक्तिशाली लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘तेरी जादुई कलाओं से’ अथवा ‘तेरे टोने-टोटकों से’। यूनानी शब्द जादू-टोने और उससे जुड़े छल को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φῶς λύχνου
  choice: दीपक का प्रकाश
  rationale: यह यूनानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; ‘दीपक’ बाइबलीय संदर्भ में λύχνος को ठीक व्यक्त करता है।
- source_word: οὐ μὴ φάνῃ ... ἔτι
  choice: फिर कभी ... नहीं चमकेगा
  rationale: οὐ μή की प्रबल नकारात्मकता और ἔτι से व्यक्त स्थायी समाप्ति को सहज हिन्दी में दर्शाता है।
- source_word: ἐν σοὶ
  choice: तुझमें
  rationale: बाबुल को मानवीकृत नगर के रूप में सीधे संबोधित करने वाली द्वितीय पुरुष शैली सुरक्षित रहती है।
- source_word: φωνὴ νυμφίου καὶ νύμφης
  choice: दूल्हे और दुल्हन की आवाज़
  rationale: φωνή के सामान्य अर्थ ‘आवाज़’ को रखता है और विवाह के आनंदपूर्ण जीवन के समाप्त हो जाने की छवि स्पष्ट करता है।
- source_word: οὐ μὴ ἀκουσθῇ ... ἔτι
  choice: फिर कभी ... नहीं सुनाई देगी
  rationale: यूनानी कर्मवाच्य और emphatic negation दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: οἱ ἔμποροί σου
  choice: तेरे व्यापारी
  rationale: ἔμποροι के व्यापारिक अर्थ और बाबुल को किए गए सीधे संबोधन को बनाए रखता है।
- source_word: οἱ μεγιστᾶνες τῆς γῆς
  choice: पृथ्वी के बड़े-बड़े लोग
  rationale: μεγιστᾶνες में निहित प्रतिष्ठा और प्रभाव को सामान्य पाठक के लिए समझने योग्य ढंग से व्यक्त करता है, बिना उन्हें केवल कुलीन या शासक ठहराए।
- source_word: ἐν τῇ φαρμακείᾳ σου
  choice: तेरे जादू-टोने से
  rationale: φαρμακεία के जादुई अथवा तांत्रिक क्रियाओं वाले अर्थ को स्पष्ट करता है और इसे आधुनिक औषधियों तक सीमित नहीं करता।
- source_word: ἐπλανήθησαν
  choice: भटका दिए गए थे
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखते हुए छल और पथभ्रष्ट किए जाने, दोनों की अर्थ-छाया बनाए रखता है।
- source_word: πάντα τὰ ἔθνη
  choice: सारे राष्ट्र
  rationale: प्रकाशितवाक्य में संसार के सामूहिक लोगों या राष्ट्रों का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: अपोकैलिप्टिक न्याय के संदर्भ में φαρμακεία का अर्थ
  choice: जादू-टोना
  alternative: जादुई कलाएँ; तंत्र-मंत्र
  rationale: यह शब्द जादुई क्रियाओं, मंत्रों और उनसे जुड़े छल को सूचित कर सकता है। ‘जादू-टोना’ इसका व्यापक धार्मिक-नैतिक अर्थ रखता है और इसे केवल औषधि या नशीले पदार्थों से नहीं जोड़ता।
- issue: दोहराए गए οὐ μή वाक्यांशों का बल
  choice: फिर कभी ... नहीं
  alternative: अब और ... नहीं; निश्चय ही ... नहीं
  rationale: यह रूप न्याय की निश्चितता और अपरिवर्तनीय अंतिमता को सहज आधुनिक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। बाबुल के मानवीकरण को बनाए रखने के लिए ‘तुझमें’ और ‘तेरे’ का प्रयोग किया गया है। काव्यात्मक पुनरावृत्ति ‘फिर कभी’ दोनों न्याय-वाक्यों में सुरक्षित है।
