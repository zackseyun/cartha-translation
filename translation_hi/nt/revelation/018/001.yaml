- from: इन बातों के बाद मैंने एक और स्वर्गदूत को स्वर्ग से उतरते देखा। उसे बड़ा अधिकार प्राप्त था, और उसके तेज से पृथ्वी प्रकाशित हो गई।
  to: इन बातों के बाद मैंने एक और स्वर्गदूत को स्वर्ग से उतरते देखा। उसके पास बड़ा अधिकार था, और उसकी महिमा से पृथ्वी प्रकाशित हो गई।
