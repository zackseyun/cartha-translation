id: REV.18.1
reference: Revelation 18:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον ἄλλον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα ἐξουσίαν μεγάλην, καὶ ἡ γῆ ἐφωτίσθη ἐκ τῆς δόξης αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/001.yaml
  text: After these things I saw another angel coming down out of heaven[a], having great authority[b], and the earth was illuminated by his glory.
translation:
  language: hi
  text: इन बातों के बाद मैंने एक और स्वर्गदूत को स्वर्ग से उतरते देखा। उसके पास बड़ा अधिकार था, और उसकी महिमा से पृथ्वी प्रकाशित हो गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह दर्शन के क्रम को दर्शाने वाला सामान्य वाक्यांश है। यह ταῦτα के बहुवचन को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: ὁράω के सरल भूतकालीन अर्थ को बिना अतिरिक्त भाव जोड़े व्यक्त करता है।
- source_word: ἄλλον ἄγγελον
  choice: एक और स्वर्गदूत
  rationale: ἄλλον दर्शन-क्रम में एक अन्य स्वर्गदूत को सूचित करता है; हिन्दी में यह सहज और सटीक है।
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से उतरते
  rationale: वर्तमान कृदन्त की मुख्य क्रिया के साथ समकालिकता और ἐκ के स्रोत-बोध को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔχοντα ἐξουσίαν μεγάλην
  choice: उसे बड़ा अधिकार प्राप्त था
  rationale: ἐξουσία को केवल सामर्थ्य नहीं, बल्कि अधिकार या प्रदत्त प्रभुत्व के रूप में व्यक्त करता है। 'प्राप्त था' देवदूत की सृष्ट प्रकृति से संगत है, पर यूनानी पाठ से आगे यह नहीं बताता कि अधिकार किसने दिया।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: इस वैश्विक प्रकाश-चित्र में γῆ का व्यापक, ब्रह्मांडीय अर्थ स्थानीय 'भूमि' से अधिक उपयुक्त है।
- source_word: ἐφωτίσθη
  choice: प्रकाशित हो गई
  rationale: φωτίζω के निष्क्रिय अर्थ को गरिमापूर्ण किंतु सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐκ τῆς δόξης αὐτοῦ
  choice: उसके तेज से
  rationale: ἐκ को प्रकाश के स्रोत या कारण के रूप में व्यक्त करता है। यहाँ 'तेज' दृश्य दीप्ति के संदर्भ में δόξα का स्वाभाविक हिन्दी रूप है, जबकि स्वर्गदूत को मिलने वाली असाधारण महिमा को कम नहीं करता।
theological_decisions:
- issue: स्वर्गदूत के अधिकार और दीप्ति का स्वरूप
  choice: पाठ स्वर्गदूत को बड़ा अधिकार और ऐसा तेज देता है जिससे पृथ्वी प्रकाशित होती है, पर उसे ईश्वर के रूप में नहीं पहचानता।
  alternative: उसके तेज की असाधारण व्यापकता के कारण इस स्वर्गदूत को किसी दिव्य प्रकटीकरण के रूप में पढ़ा जा सकता है।
  rationale: अनुवाद अधिकार और तेज की प्रबल भाषा को यथावत रखता है, किंतु स्वर्गदूत की पहचान या दिव्यता के विषय में मूल यूनानी से आगे कोई निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और वाचनयोग्य शैली। 'स्वर्गदूत', 'अधिकार', 'तेज' और 'प्रकाशित' सामान्य बाइबलीय शब्दावली हैं, पर भाषा अनावश्यक रूप से संस्कृतनिष्ठ नहीं है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि 'स्वर्ग से उतरते' और 'उसके तेज से' यूनानी के अर्थ को स्वाभाविक हिन्दी में पर्याप्त रूप से समेटते हैं।
