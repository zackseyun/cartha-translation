  text: क्योंकि उसके पाप स्वर्ग तक ढेर हो गए हैं[a], और परमेश्वर ने उसके अन्यायपूर्ण कामों को स्मरण किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
