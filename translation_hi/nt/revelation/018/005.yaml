    text: या, “उसके पाप जुड़कर स्वर्ग तक पहुँच गए हैं”; यूनानी क्रिया का शाब्दिक अर्थ “चिपकना/जुड़ना” है और यहाँ पापों के बहुत बड़े संचय का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ “स्मरण किया” का न्यायिक आशय है: परमेश्वर ने उसके अन्यायपूर्ण कामों को अनदेखा नहीं किया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद की आज्ञा का कारण बताता है और यूनानी संयोजक का कारणवाचक बल स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐκολλήθησαν
  choice: ढेर लग गया है
  rationale: मूल क्रिया का शाब्दिक अर्थ जुड़ने या चिपकने का है; पापों और ‘स्वर्ग तक’ के साथ यहाँ विशाल संचय का चित्र है। यह हिन्दी में उस रूपक को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἁμαρτίαι
  choice: पापों
  rationale: ἁμαρτία का मानक और प्रसंगानुकूल हिन्दी प्रतिरूप।
- source_word: ἄχρι τοῦ οὐρανοῦ
  choice: स्वर्ग तक
  rationale: यह विस्तार की सीमा को सीधे व्यक्त करता है और मूल की ऊर्ध्व दिशा वाली छवि तथा प्रकाशन की धार्मिक शैली को बनाए रखता है।
- source_word: ἐμνημόνευσεν
  choice: स्मरण किया है
  rationale: मूल क्रिया ‘स्मरण करना’ है। पूर्णतासूचक हिन्दी रूप वर्तमान न्यायिक परिणाम का संकेत देता है, पर अनुवाद में सीधे ‘दण्ड दिया’ नहीं जोड़ता।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: बाइबलीय हिन्दी में θεός के लिए स्वाभाविक, प्रतिष्ठित और स्पष्ट पद।
- source_word: ἀδικήματα
  choice: अधर्म के कामों
  rationale: यह किए गए अन्यायपूर्ण या गलत कार्यों को दर्शाता है और पहले आए ‘पापों’ से यूनानी शब्दावली का भेद बनाए रखता है।
theological_decisions:
- issue: ἁμαρτίαι और ἀδικήματα के बीच भेद
  choice: ‘पापों’ और ‘अधर्म के कामों’ के रूप में दो अलग पद
  alternative: दोनों को ‘पाप’ अथवा ‘अधर्म’ कहना
  rationale: यूनानी पाठ दो संबंधित किंतु भिन्न शब्दों का प्रयोग करता है। अलग हिन्दी पद मूल की आलंकारिक पूर्णता बनाए रखते हैं, बिना कृत्रिम रूप से कठोर धर्मवैज्ञानिक भेद गढ़े।
- issue: परमेश्वर के स्मरण का न्यायिक बल
  choice: ‘स्मरण किया है’
  alternative: ‘लेखा माँगा है’ अथवा ‘न्याय के लिए सामने लाया है’
  rationale: प्रसंग में परमेश्वर का स्मरण न्यायिक कार्रवाई की ओर संकेत करता है, पर मूल क्रिया स्वयं ‘स्मरण करना’ है। सीधा अनुवाद उस निहितार्थ और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
