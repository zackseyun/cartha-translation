base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/024.yaml
  text: And in her was found the blood of prophets and saints[c][b][a], and of all who have been slaughtered on the earth.
translation:
  language: hi
  text: और उसमें भविष्यद्वक्ताओं और पवित्र जनों[a] का लहू, और पृथ्वी पर वध किए गए सब लोगों का लहू पाया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र लोग” अथवा “परमेश्वर के पवित्र लोग।”
    reason: lexical_alternative
  - marker: b
    text: “वध” के लिए प्रयुक्त यूनानी क्रिया सामान्य रूप से मार डालने से अधिक प्रबल है और हिंसापूर्वक काट डाले जाने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ
  choice: उसमें
  rationale: स्त्रीलिंग सर्वनाम का संकेत बाबेल की ओर है, जिसे संदर्भ में स्त्री और नगर के रूप में चित्रित किया गया है। हिंदी में ‘उसमें’ स्वाभाविक है; संदर्भित स्त्री-रूप को स्पष्ट करने के लिए अलग टिप्पणी आवश्यक नहीं।
- source_word: αἷμα
  choice: लहू
  rationale: यह αἷμα का प्रत्यक्ष और गरिमापूर्ण हिंदी रूप है तथा संदर्भ में रक्तपात और दोष का भाव बनाए रखता है।
- source_word: προφητῶν
  choice: भविष्यद्वक्ताओं
  rationale: प्रकाशितवाक्य के धार्मिक संदर्भ में προφήτης के लिए यह प्रचलित और स्पष्ट पद है।
- source_word: ἁγίων
  choice: पवित्र जनों
  rationale: यह परमेश्वर के लिए अलग किए गए लोगों का अर्थ सीधे व्यक्त करता है और आधुनिक पाठकों के लिए ‘संतों’ की अपेक्षा कम संप्रदाय-विशिष्ट है।
- source_word: εὑρέθη
  choice: पाया गया
  rationale: अओरिस्ट कर्मवाच्य को सीधे व्यक्त करता है और दोष के प्रकट होने का न्यायिक भाव सुरक्षित रखता है।
- source_word: πάντων τῶν ἐσφαγμένων
  choice: उन सबका भी, जिनका ... वध किया गया था
  rationale: σφάζω सामान्य हत्या से अधिक हिंसक वध का संकेत देता है। हिंदी में ‘वध किया गया था’ पूर्ण हो चुकी क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: प्रकाशितवाक्य के व्यापक प्रलयदर्शी संदर्भ में γῆ के वैश्विक अर्थ को बनाए रखता है।
theological_decisions:
- issue: बाबेल के दोष का विस्तार
  choice: वचन के व्यापक आरोप को ज्यों का त्यों रखा गया है कि पृथ्वी पर वध किए गए सब लोगों का लहू उसमें पाया गया।
  alternative: इसे केवल धर्मियों के रक्तपात के लिए अतिशयोक्तिपूर्ण या प्रतिनिधिक भाषा मानना।
  rationale: यूनानी पाठ आरोप की व्यापकता को सीमित नहीं करता; इसलिए अनुवाद यह तय नहीं करता कि दर्शन का प्रतीक इतिहास पर किस प्रकार लागू होता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। वाक्य की दोहरी संरचना और व्यापक न्यायिक आरोप सुरक्षित रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
