id: REV.18.7
reference: Revelation 18:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅσα ἐδόξασεν αὑτὴν καὶ ἐστρηνίασεν, τοσοῦτον δότε αὐτῇ βασανισμὸν καὶ πένθος. ὅτι ἐν τῇ καρδίᾳ αὐτῆς λέγει ὅτι Κάθημαι βασίλισσα, καὶ χήρα οὐκ εἰμί, καὶ πένθος οὐ μὴ ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/007.yaml
  text: As much as she glorified herself and lived in luxury[a], give her that much torment and mourning. For she says in her heart, ‘I sit as a queen, and I am not a widow[b], and I will certainly never see mourning.’
translation:
  language: hi
  text: जितना उसने अपने आप को महिमान्वित किया और विलासिता में जीवन बिताया[a], उतनी ही उसे यातना और शोक दो। क्योंकि वह अपने मन में कहती है, ‘मैं रानी बनकर बैठी हूँ; मैं विधवा नहीं हूँ, और मैं शोक कभी भी नहीं देखूँगी[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोग-विलास में डूबी रही’ अथवा ‘मनमाने भोग में जीवन बिताया।’ यूनानी क्रिया विलासी, उच्छृंखल या आत्मलिप्त जीवन का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘कभी भी नहीं देखूँगी’ में यूनानी का अत्यंत प्रबल निषेध है, जो उसके इस दृढ़ दावे को व्यक्त करता है कि शोक उस पर कभी नहीं आएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα ... τοσοῦτον
  choice: जितना ... उतनी ही
  rationale: यूनानी की सहसंबंधी आनुपातिक रचना को स्वाभाविक हिन्दी में बनाए रखता है और प्रतिफल की समान मात्रा व्यक्त करता है।
- source_word: ἐδόξασεν αὑτὴν
  choice: उसने अपने आपको महिमा दी
  rationale: प्रतिवाचक भाव और बाबेल के आत्म-महिमामंडन को स्पष्ट रखता है; ‘सम्मान दिया’ मूल के महिमा-विषयक बल को कम कर देता।
- source_word: ἐστρηνίασεν
  choice: विलासिता में जीवन बिताया
  rationale: भोग-विलास और आत्मलिप्त ऐश्वर्य का व्यापक अर्थ देता है, पर पद में अनावश्यक रूप से केवल कामुक अर्थ नहीं जोड़ता।
- source_word: δότε αὐτῇ
  choice: उसे ... दो
  rationale: आज्ञार्थक और न्यायिक स्वर को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βασανισμὸν
  choice: यातना
  rationale: न्याय के अंतर्गत गंभीर पीड़ा को व्यक्त करता है, बिना इसे केवल शारीरिक उत्पीड़न तक सीमित किए।
- source_word: πένθος
  choice: शोक
  rationale: हानि और न्याय के प्रत्युत्तर में मातम या दुःख का भाव देता है तथा पद में दोनों बार एक ही शब्द रखता है।
- source_word: ἐν τῇ καρδίᾳ αὐτῆς λέγει
  choice: वह अपने मन में कहती है
  rationale: आंतरिक आत्मविश्वास और आत्म-संवाद के मुहावरे को आधुनिक हिन्दी में स्वाभाविक रूप देता है।
- source_word: Κάθημαι βασίλισσα
  choice: मैं रानी बनकर बैठी हूँ
  rationale: राजसी आसन और सुरक्षित सत्ता की वर्तमान मुद्रा को बनाए रखता है; केवल ‘मैं रानी हूँ’ बैठने की छवि खो देता।
- source_word: χήρα οὐκ εἰμί
  choice: मैं विधवा नहीं हूँ
  rationale: मूल कथन का सीधा अनुवाद है और हानि अथवा असहायता से सुरक्षित होने के दावे को बनाए रखता है।
- source_word: οὐ μὴ ἴδω
  choice: मैं शोक कभी नहीं देखूँगी
  rationale: ‘कभी नहीं’ यूनानी के प्रबल निषेध को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी उसके विशेष जोर को स्पष्ट करती है।
theological_decisions:
- issue: बाबेल का स्त्री, रानी और विधवा के रूप में मानवीकरण
  choice: पूरे पद में स्त्रीलिंग मानवीकरण को बनाए रखा गया है।
  alternative: इसे केवल निर्जीव नगर या आर्थिक व्यवस्था के रूप में व्यक्त करना।
  rationale: यूनानी पाठ लगातार स्त्रीलिंग रूप और रानी-विधवा की छवियाँ रखता है; ये उसके घमंड, कथित सुरक्षा और आगामी न्याय की साहित्यिक तथा धर्मवैचारिक शक्ति के लिए केंद्रीय हैं।
- issue: βασανισμός में न्याय की भाषा
  choice: मुख्य पाठ में ‘यातना’ रखा गया है।
  alternative: ‘पीड़ा’ या ‘यंत्रणा’।
  rationale: यह बाबेल की आत्म-महिमा और विलासिता के अनुपात में गंभीर न्याय को व्यक्त करता है, पर न्याय के किसी ऐसे विशिष्ट साधन को नहीं जोड़ता जिसका मूल पाठ उल्लेख नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए बोधगम्य शैली। ‘अपने मन में’ स्वाभाविक हिन्दी मुहावरा है, जबकि ‘रानी बनकर बैठी हूँ’ मूल की राजसिंहासन-सदृश मुद्रा को सुरक्षित रखता है।
