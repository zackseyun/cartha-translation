source:
  edition: SBLGNT
  text: καὶ ἔκραξεν ⸀ἐν ἰσχυρᾷ φωνῇ λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, καὶ ἐγένετο κατοικητήριον ⸀δαιμονίων καὶ φυλακὴ παντὸς πνεύματος ἀκαθάρτου καὶ φυλακὴ παντὸς ὀρνέου ἀκαθάρτου ⸂καὶ φυλακὴ παντὸς θηρίου ἀκαθάρτου⸃ καὶ μεμισημένου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/002.yaml
  text: And he cried out with a mighty voice[a], saying, “Fallen, fallen is Babylon the great! She has become a dwelling place of demons, a prison of every unclean spirit, a prison of every unclean bird[b], and a prison of every unclean and hated beast.”
translation:
  language: hi
  text: और उसने ऊँचे स्वर में पुकारकर कहा, “गिर पड़ी, गिर पड़ी महान बाबेल! वह दुष्टात्माओं का निवासस्थान और हर अशुद्ध आत्मा का कारागार[a], हर अशुद्ध पक्षी का कारागार, और हर अशुद्ध और घृणित पशु का कारागार बन गई है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर अशुद्ध आत्मा का अड्डा ... हर अशुद्ध पक्षी का अड्डा ... हर अशुद्ध और घृणित पशु का अड्डा।” यूनानी शब्द का अर्थ किसी के रखे या पहरे में रखे जाने की जगह, अथवा ऐसा ठिकाना भी हो सकता है जहाँ कोई रहता या बार-बार आता हो।
    reason: lexical_alternative
  - marker: b
    text: कुछ प्राचीन हस्तलिपियों में “और हर अशुद्ध और घृणित पशु का कारागार” नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: ἔκραξεν ἐν ἰσχυρᾷ φωνῇ
  choice: शक्तिशाली आवाज़ में पुकारकर कहा
  rationale: यह अभिव्यक्ति ऊँची और प्रभावशाली पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है और प्रकाशितवाक्य की गरिमामय शैली बनाए रखती है।
- source_word: Ἔπεσεν, ἔπεσεν
  choice: गिर पड़ी, गिर पड़ी
  rationale: दोहराव को ज्यों का त्यों रखते हुए स्त्रीलिंग क्रिया बाबेल के लिए स्वाभाविक हिन्दी देती है और भविष्यदर्शी न्याय-घोषणा की लय बनाए रखती है।
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: महान बाबेल
  rationale: यह यूनानी पदवी-सदृश विशेषण का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: ἐγένετο κατοικητήριον δαιμονίων
  choice: दुष्टात्माओं का निवास ... बन गई है
  rationale: ἐγένετο की परिणामी अवस्था को ‘बन गई है’ व्यक्त करता है; δαιμόνια के लिए ‘दुष्टात्माएँ’ सामान्य पाठक के लिए स्पष्ट है और अलौकिक दुष्ट सत्ताओं का अर्थ बनाए रखता है।
- source_word: φυλακή
  choice: अड्डा
  rationale: इस प्रसंग में φυλακή किसी ऐसी जगह का बोध करा सकता है जहाँ ये प्राणी रखे जाते, बसे रहते या बार-बार आते हैं। ‘अड्डा’ उजाड़ और अशुद्ध शक्तियों से भरे स्थान का स्वाभाविक हिन्दी चित्र देता है; ‘कारागार’ वाला संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: παντὸς πνεύματος ἀκαθάρτου
  choice: हर अशुद्ध आत्मा
  rationale: यह मूल के एकवचन-वितरणात्मक ढाँचे और बाइबलीय शुद्धता-अशुद्धता की शब्दावली को बनाए रखता है।
- source_word: παντὸς ὀρνέου ἀκαθάρτου
  choice: हर अशुद्ध पक्षी
  rationale: ὄρνεον का सीधा अर्थ ‘पक्षी’ है; मूल में निहित न होने के कारण किसी विशेष शवभक्षी पक्षी को नहीं जोड़ा गया।
- source_word: παντὸς θηρίου ἀκαθάρτου καὶ μεμισημένου
  choice: हर अशुद्ध और घृणित जंगली पशु
  rationale: θηρίον यहाँ पक्षियों के साथ सामान्य पशु-संज्ञा है, प्रकाशितवाक्य के विशिष्ट ‘पशु’ की उपाधि नहीं। ‘घृणित’ μεμισημένου के घृणा का पात्र होने का भाव स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: क्या θηρίου को प्रकाशितवाक्य के प्रतीकात्मक ‘पशु’ की उपाधि माना जाए
  choice: सामान्य अर्थ में ‘जंगली पशु’
  alternative: विशिष्ट प्रतीकात्मक उपाधि ‘पशु’
  rationale: यह शब्द παντός के अधीन अशुद्ध आत्मा और अशुद्ध पक्षी की सूची में आता है, इसलिए यहाँ सामान्य प्राणी का अर्थ अधिक संगत है। उपाधि मानना पाठ में अनावश्यक धर्मवैज्ञानिक पहचान जोड़ देगा।
- issue: न्याय-दृश्य में φυλακή का अर्थ
  choice: अड्डा
  alternative: कारागार / बंदीगृह
  rationale: शब्द में पहरे, रखे जाने या आवास/ठिकाने की अर्थ-सीमा है। प्रसंग उजाड़ बाबेल को अशुद्ध प्राणियों के बसेरे के रूप में चित्रित करता है; फिर भी बंदीकरण का अर्थ संभव है और पादटिप्पणी में रखा गया है।
- issue: δαιμονίων और πνεύματος ἀκαθάρτου के बीच शब्दगत भेद
  choice: क्रमशः ‘दुष्टात्माओं’ और ‘अशुद्ध आत्मा’
  alternative: दोनों को एक ही हिन्दी पद से व्यक्त करना
  rationale: अलग हिन्दी पद मूल की अलग संज्ञाओं को दृश्यमान रखते हैं, यद्यपि प्रसंग में उनके अर्थ-क्षेत्र एक-दूसरे से मिल सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय भविष्यदर्शी लय और सामान्य पाठक के लिए स्पष्ट शब्दावली। ‘गिर पड़ी’ का दोहराव मूल की घोषणात्मक तीव्रता रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
