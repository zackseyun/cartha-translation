id: REV.18.10
reference: Revelation 18:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπὸ μακρόθεν ἑστηκότες διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς λέγοντες· Οὐαὶ οὐαί, ἡ πόλις ἡ μεγάλη, Βαβυλὼν ἡ πόλις ἡ ἰσχυρά, ὅτι μιᾷ ὥρᾳ ἦλθεν ἡ κρίσις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/010.yaml
  text: standing far off because of the fear of her torment[a], saying, ‘Woe, woe, the great city, Babylon[b], the strong city! For in one hour your judgment has come.’
translation:
  language: hi
  text: वे उसकी यातना के डर से दूर खड़े होकर कहेंगे, “हाय! हाय! हे महान नगरी, बाबुल, हे शक्तिशाली नगरी! क्योंकि एक ही घड़ी में तेरा न्याय आ पहुँचा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ μακρόθεν ἑστηκότες
  choice: दूर खड़े होकर
  rationale: यह पदबंध उनकी दूरी और स्थिर खड़े रहने की अवस्था, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διὰ τὸν φόβον τοῦ βασανισμοῦ αὐτῆς
  choice: उसकी यातना के डर से
  rationale: διά के कारणसूचक अर्थ और βασανισμός की तीव्र पीड़ा का अर्थ स्पष्ट और संक्षिप्त रूप से सुरक्षित रहता है।
- source_word: Οὐαὶ οὐαί
  choice: हाय! हाय!
  rationale: हिन्दी में यह विस्मयादिबोधक शोक और आसन्न विनाश की घोषणा, दोनों का भार वहन कर सकता है।
- source_word: ἡ πόλις ἡ μεγάλη
  choice: हे महान नगरी
  rationale: सम्बोधन को स्पष्ट करते हुए विशेषण की गरिमा और नगर की प्रमुखता सुरक्षित रखी गई है।
- source_word: Βαβυλὼν
  choice: बाबुल
  rationale: यह बाइबलीय हिन्दी में स्थापित नाम-रूप है।
- source_word: ἡ πόλις ἡ ἰσχυρά
  choice: हे शक्तिशाली नगरी
  rationale: ἰσχυρά की शक्ति और सामर्थ्य का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: μιᾷ ὥρᾳ
  choice: एक ही घड़ी में
  rationale: ‘ही’ घटना की आकस्मिकता और अत्यल्प समय में घटित होने पर बल देता है।
- source_word: ἦλθεν ἡ κρίσις σου
  choice: तेरा न्याय आ पहुँचा है
  rationale: ἦλθεν के पूर्ण आगमन और वर्तमान परिणाम को हिन्दी के पूर्ण वर्तमान रूप से व्यक्त किया गया है; κρίσις को उसके न्यायिक और दण्डात्मक तनाव सहित ‘न्याय’ रखा गया है।
theological_decisions:
- issue: οὐαί में शोक और विनाश-घोषणा का संयुक्त भाव
  choice: हाय! हाय!
  alternative: धिक्कार! धिक्कार!
  rationale: ‘हाय’ विलाप को स्वाभाविक रखता है और सन्दर्भ में विपत्ति की घोषणा भी संप्रेषित करता है; ‘धिक्कार’ नैतिक निन्दा को आवश्यकता से अधिक प्रमुख कर सकता है।
- issue: κρίσις का अर्थ
  choice: न्याय
  alternative: दण्ड
  rationale: ‘न्याय’ यूनानी शब्द की न्यायिक व्यापकता को सुरक्षित रखता है, जबकि ‘दण्ड’ केवल परिणाम को स्पष्ट करके अर्थ को संकरा कर देता।
- issue: ἦλθεν का कालगत प्रभाव
  choice: आ पहुँचा है
  alternative: आ पहुँचा
  rationale: पूर्ण वर्तमान हिन्दी में अभी-अभी घटे न्याय और उसके वर्तमान प्रभाव को स्वाभाविक रूप से दिखाता है, बिना यूनानी एओरिस्ट को कोई अतिरिक्त सिद्धान्तगत अर्थ दिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, श्रव्य और सर्वसुलभ शैली। ‘नगरी’ प्रकाशना की काव्यात्मक-भविष्यद्वाणी शैली के अनुकूल है, जबकि वाक्य-विन्यास आधुनिक रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
