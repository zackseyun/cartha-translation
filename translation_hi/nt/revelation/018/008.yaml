revisions:
- from: इस कारण एक ही दिन में उस पर विपत्तियाँ आ पड़ेंगी—मृत्यु, शोक और अकाल—और वह आग में पूरी तरह जला दी जाएगी; क्योंकि उसका न्याय करनेवाला प्रभु परमेश्वर सामर्थी है।
  to: इस कारण एक ही दिन में उस पर विपत्तियाँ आ पड़ेंगी—मृत्यु, शोक और अकाल—और वह आग में पूरी तरह जला दी जाएगी; क्योंकि प्रभु परमेश्वर, जिसने उसका न्याय किया है, सामर्थी है।
  rationale: Only the final participial clause is revised, so that the aorist force of κρίνας is conveyed clearly and naturally in Hindi. No footnotes are required by the source or draft.
