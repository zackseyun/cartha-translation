id: REV.18.8
reference: Revelation 18:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο ἐν μιᾷ ἡμέρᾳ ἥξουσιν αἱ πληγαὶ αὐτῆς, θάνατος καὶ πένθος καὶ λιμός, καὶ ἐν πυρὶ κατακαυθήσεται· ὅτι ἰσχυρὸς κύριος ὁ θεὸς ὁ κρίνας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/008.yaml
  text: 'For this reason, in one day her plagues will come: death and mourning and famine, and she will be burned up with fire; because strong is the Lord God who judged her.'
translation:
  language: hi
  text: इस कारण एक ही दिन में उस पर विपत्तियाँ आ पड़ेंगी—मृत्यु, शोक और अकाल—और वह आग में पूरी तरह जला दी जाएगी; क्योंकि प्रभु परमेश्वर, जिसने उसका न्याय किया है, सामर्थी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: एक ही दिन में
  rationale: ग्रीक की आकस्मिकता और अत्यल्प अवधि पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἱ πληγαὶ αὐτῆς
  choice: उस पर विपत्तियाँ
  rationale: यहाँ πληγαί दैवी दंडस्वरूप आनेवाली विपत्तियों को सूचित करता है; हिन्दी में संबंधवाचक संरचना की अपेक्षा ‘उस पर’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: θάνατος καὶ πένθος καὶ λιμός
  choice: मृत्यु, शोक और अकाल
  rationale: तीनों संज्ञाओं को उनके सामान्य, प्रत्यक्ष अर्थ में रखा गया है और सूची की लय सुरक्षित है।
- source_word: ἐν πυρὶ κατακαυθήσεται
  choice: आग में पूरी तरह जला दी जाएगी
  rationale: κατακαίω के तीव्र अर्थ और भविष्यत् कर्मवाच्य—पूर्ण रूप से जलाए जाने—दोनों को व्यक्त करता है।
- source_word: ἰσχυρός
  choice: सामर्थी
  rationale: ‘बलवान’ भी संभव है, पर प्रभु परमेश्वर के न्याय को कार्यान्वित करने की शक्ति के संदर्भ में ‘सामर्थी’ अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: ὁ κρίνας αὐτήν
  choice: उसका न्याय करनेवाला
  rationale: ग्रीक के विशेषणात्मक कृदंत को सुरक्षित रखता है; अतीतकालिक कृदंत का पक्ष हिन्दी में इस वाक्यांश के भीतर स्वाभाविक रूप से व्यक्त होता है, बिना न्याय और दंड के काल-संबंध को अनावश्यक रूप से कठोर बनाने के।
theological_decisions:
- issue: ὅτι का कारणवाचक संबंध
  choice: क्योंकि
  alternative: इसलिए कि / निश्चय ही
  rationale: 'ὅτι यहाँ विपत्तियों और दहन का आधार बताता है: न्याय करनेवाला प्रभु परमेश्वर सामर्थी है।'
- issue: न्याय का कर्ता और सामर्थ्य
  choice: उसका न्याय करनेवाला प्रभु परमेश्वर सामर्थी है
  alternative: प्रभु परमेश्वर, जिसने उसका न्याय किया है, बलवान है
  rationale: ग्रीक पदक्रम की हर विशेषता को कृत्रिम रूप से नकल किए बिना ‘प्रभु परमेश्वर’ को न्याय का कर्ता और ‘सामर्थी’ को विधेय स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज। स्त्रीलिंग सर्वनाम प्रकाशितवाक्य 18 में नगर-रूपिणी बाबुल के संदर्भ को बनाए रखता है। विरामचिह्न सूची और परिणाम को स्पष्ट करते हैं।
