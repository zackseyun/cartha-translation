review_pass:
  verdict: revise
  source_fidelity: 'Draft closely represents the Greek: the disasters, their threefold specification, burning by fire, and the causal statement are retained. However, ὁ κρίνας is an aorist participle and explicitly identifies the Lord God as the one who judged her; the present-like Hindi phrase “उसका न्याय करनेवाला” weakens that completed action.'
  naturalness: The Hindi is fluent, modern, and appropriately elevated. “एक ही दिन में,” the dash-delimited list, and “आग में पूरी तरह जला दी जाएगी” read naturally.
  terminology: “विपत्तियाँ,” “मृत्यु, शोक और अकाल,” “प्रभु परमेश्वर,” and “सामर्थी” are suitable and consistent. Rendering the participle with “जिसने उसका न्याय किया है” supplies the required completed judicial sense in idiomatic Hindi.
  issues:
  - severity: medium
    issue: ὁ κρίνας αὐτήν is rendered without its completed-action force.
    rationale: The Greek aorist participle κρίνας means “the one who judged her,” not merely “the one judging her.” In this context the completed judgment grounds the announced calamities. Hindi should make this aspect explicit without overinterpreting its precise temporal relationship.
  revised_text: इस कारण एक ही दिन में उस पर विपत्तियाँ आ पड़ेंगी—मृत्यु, शोक और अकाल—और वह आग में पूरी तरह जला दी जाएगी; क्योंकि प्रभु परमेश्वर, जिसने उसका न्याय किया है, सामर्थी है।
  revised_footnotes: []
  revision_rationale: Only the final participial clause is revised, so that the aorist force of κρίνας is conveyed clearly and naturally in Hindi. No footnotes are required by the source or draft.
