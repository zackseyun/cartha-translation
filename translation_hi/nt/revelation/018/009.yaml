  text: Καὶ κλαύσουσιν καὶ κόψονται ἐπ’ αὐτὴν οἱ βασιλεῖς τῆς γῆς οἱ μετ’ αὐτῆς πορνεύσαντες καὶ στρηνιάσαντες, ὅταν βλέπωσιν τὸν καπνὸν τῆς πυρώσεως αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/009.yaml
  text: And the kings of the earth who committed sexual immorality and lived in luxury with her will weep and mourn over her when they see the smoke of her burning[b][a],
translation:
  language: hi
  text: और पृथ्वी के वे राजा, जिन्होंने उसके साथ व्यभिचार[b] किया और उसके साथ विलासिता में रहे, उसके जलने का धुआँ देखकर उसके लिए रोएँगे और विलाप करेंगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छाती पीटेंगे”; यूनानी क्रिया प्रकट रूप से मातम करने की भाव-भंगिमा जगा सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “व्यभिचार” प्रकाशितवाक्य में बार-बार आने वाली उस रूपकात्मक छवि का भाग हो सकता है जो मूर्तिपूजक और भ्रष्ट गठबंधन को दर्शाती है; फिर भी मूल यूनानी की यौन छवि बनी रहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κλαύσουσιν
  choice: रोएँगे
  rationale: यह शब्द सुनाई देने वाले रोने और शोक व्यक्त करने का भाव रखता है; ‘रोएँगे’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: κόψονται
  choice: विलाप करेंगे
  rationale: इस शोक-संबंधी प्रयोग में क्रिया का आशय सार्वजनिक या प्रकट रूप से मातम करना है। मुख्य पाठ अर्थ स्पष्ट करता है, जबकि शारीरिक भाव-भंगिमा फुटनोट में दी गई है।
- source_word: ἐπ’ αὐτὴν
  choice: उसके लिए
  rationale: शोक की क्रियाओं के साथ यह पदबंध उस व्यक्ति या वस्तु को सूचित करता है जिसके लिए मातम किया जाता है।
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: पृथ्वी के वे राजा
  rationale: प्रकाशितवाक्य के व्यापक, विश्वव्यापी संदर्भ में ‘पृथ्वी’ उपयुक्त है; ‘वे’ आगे आने वाले संबंधवाचक उपवाक्य को स्वाभाविक बनाता है।
- source_word: μετ’ αὐτῆς
  choice: उसके साथ
  rationale: यह बाबुल के साथ सहभागिता या संबंध को सीधे व्यक्त करता है और व्यभिचार की रूपकात्मक छवि को बनाए रखता है।
- source_word: πορνεύσαντες
  choice: व्यभिचार किया
  rationale: ‘व्यभिचार’ यूनानी की यौन छवि को सुरक्षित रखता है, साथ ही प्रकाशितवाक्य में उसके मूर्तिपूजक और भ्रष्ट गठबंधनों वाले रूपकात्मक अर्थ की संभावना को खुला छोड़ता है।
- source_word: στρηνιάσαντες
  choice: विलासिता का जीवन जिया था
  rationale: क्रिया आत्मलिप्त, भोगमय ऐश्वर्य में रहने का भाव देती है। यह हिन्दी में स्पष्ट है और बाबुल से जुड़े आर्थिक-नैतिक पतन को व्यक्त करती है।
- source_word: ὅταν βλέπωσιν
  choice: जब ... देखेंगे
  rationale: भविष्य में घटने वाली परिस्थिति को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸν καπνὸν
  choice: धुआँ
  rationale: मूल संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: τῆς πυρώσεως αὐτῆς
  choice: उसके जलने का
  rationale: जलाए जाने या आग में भस्म होने की प्रक्रिया को बिना निकटवर्ती पदों की अतिरिक्त भाषा आयात किए व्यक्त करता है।
theological_decisions:
- issue: बाबुल के साथ ‘व्यभिचार’ की प्रकृति
  choice: मुख्य पाठ में यौन-नैतिक शब्द ‘व्यभिचार’ बनाए रखा गया है और उसके रूपकात्मक अर्थ की सूचना फुटनोट में दी गई है।
  alternative: इसे केवल ‘भ्रष्ट संबंध रखा’ या ‘विश्वासघात किया’ कहना।
  rationale: प्रकाशितवाक्य में यह छवि मूर्तिपूजा और भ्रष्ट राजनीतिक-आर्थिक गठबंधन की ओर संकेत कर सकती है, पर मूल की यौन छवि को अमूर्त अनुवाद से मिटाना उचित नहीं होगा।
- issue: κόψονται में शोक की अभिव्यक्ति
  choice: ‘विलाप करेंगे’
  alternative: ‘छाती पीटेंगे’
  rationale: यूनानी मुहावरे का मुख्य आशय प्रकट शोक है। ‘विलाप करेंगे’ अर्थ को स्पष्ट रखता है, जबकि अधिक चित्रात्मक विकल्प फुटनोट में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सर्वसुलभ शैली रखी गई है। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार समायोजित है, और मूल की दोहरी शोक-अभिव्यक्ति ‘रोएँगे और विलाप करेंगे’ के रूप में सुरक्षित है।
