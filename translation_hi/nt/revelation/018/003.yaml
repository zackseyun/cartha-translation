id: REV.18.3
reference: Revelation 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς ⸀πέπτωκαν πάντα τὰ ἔθνη, καὶ οἱ βασιλεῖς τῆς γῆς μετ’ αὐτῆς ἐπόρνευσαν, καὶ οἱ ἔμποροι τῆς γῆς ἐκ τῆς δυνάμεως τοῦ στρήνους αὐτῆς ἐπλούτησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/003.yaml
  text: For all the nations have drunk from the wine of the wrath of her sexual immorality[a], and the kings of the earth committed sexual immorality with her[c][b], and the merchants of the earth grew rich from the power of her luxury.
translation:
  language: hi
  text: क्योंकि उसके व्यभिचार के उग्र आवेग[a] की मदिरा के कारण सभी राष्ट्र गिर पड़े हैं[b]; पृथ्वी के राजाओं ने उसके साथ व्यभिचार किया है[c], और पृथ्वी के व्यापारी उसकी बेहिसाब विलासिता के बल पर धनी हो गए हैं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ “क्रोध” भी हो सकता है, या रूपक के संदर्भ में “तीव्र आवेग/वासना” भी। संबंधकारकों की श्रृंखला को एक ही निश्चित अर्थ तक सीमित नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: कुछ यूनानी हस्तलिपियों में “सभी राष्ट्रों ने उसके व्यभिचार के उग्र आवेग की मदिरा पी है” पढ़ा जाता है। यहाँ दिए गए SBLGNT पाठ में “गिर पड़े हैं” है।
    reason: textual_variant
  - marker: c
    text: यहाँ “व्यभिचार” संभवतः भ्रष्ट, मूर्तिपूजक और शोषणकारी गठजोड़ का रूपक है; अनुवाद यूनानी पाठ की यौन छवि को बनाए रखता है।
    reason: alternative_reading
  - marker: d
    text: “बेहिसाब विलासिता” का यूनानी शब्द आत्मलिप्त, उच्छृंखल और अहंकारी ऐश्वर्य को सूचित करता है, केवल भौतिक सुख-सुविधा को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह बाबुल के पतन की पिछली घोषणा का कारण प्रस्तुत करता है और यूनानी के कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκ τοῦ οἴνου
  choice: मदिरा के कारण
  rationale: ἐκ स्रोत अथवा कारण दर्शाता है। चुने हुए पाठ πέπτωκαν (‘गिर पड़े हैं’) के साथ ‘के कारण’ हिन्दी में स्वाभाविक है और मदिरा के विनाशकारी प्रभाव का रूपक बनाए रखता है।
- source_word: θυμοῦ
  choice: प्रकोप
  rationale: θυμός तीव्र आवेग, उन्माद या क्रोध को सूचित कर सकता है। ‘प्रकोप’ प्रकाशितवाक्य के न्यायपूर्ण और विनाशकारी संदर्भ को बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: πορνείας / ἐπόρνευσαν
  choice: व्यभिचार / व्यभिचार किया
  rationale: यह स्पष्ट और प्रतिष्ठित आधुनिक हिन्दी है, संज्ञा और क्रिया का संबंध बनाए रखती है, और भ्रष्ट तथा मूर्तिपूजक गठजोड़ के यौन रूपक को व्याख्या द्वारा समाप्त नहीं करती।
- source_word: πέπτωκαν
  choice: गिर पड़े हैं
  rationale: प्रदत्त SBLGNT पाठ में यह πίπτω का पूर्णकालिक रूप है। अनुवाद घटना और उसके वर्तमान परिणाम दोनों को व्यक्त करता है; ‘पी चुके हैं’ वाला महत्त्वपूर्ण पाठांतर पादटिप्पणी में रखा गया है।
- source_word: πάντα τὰ ἔθνη
  choice: सभी राष्ट्र
  rationale: यह सामूहिक रूप से बाबुल के प्रभाव में आए राष्ट्रों को दर्शाता है; यहाँ यहूदी-विरोधी अर्थ में ‘गैर-यहूदी’ अभिप्रेत नहीं है।
- source_word: ἔμποροι
  choice: व्यापारी
  rationale: अध्याय के आर्थिक और व्यापारिक संदर्भ में यह सीधा और स्वाभाविक हिन्दी शब्द है।
- source_word: ἐκ τῆς δυνάμεως
  choice: के बल पर
  rationale: यह δύναμις के सामर्थ्य अथवा प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है और केवल ‘धन से’ कहकर अर्थ को सीमित नहीं करता।
- source_word: στρήνους
  choice: बेहिसाब विलासिता
  rationale: στρῆνος साधारण सुख-सुविधा नहीं, बल्कि अहंकारी, उच्छृंखल और आत्मलिप्त ऐश्वर्य है। ‘बेहिसाब’ इस अतिरेक को संक्षेप में स्पष्ट करता है।
- source_word: ἐπλούτησαν
  choice: धनी हो गए हैं
  rationale: यह व्यापारियों की प्राप्त आर्थिक समृद्धि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πορνεία/πορνεύω को प्रत्यक्ष यौन भाषा में रखा जाए या ‘मूर्तिपूजा’ जैसे व्याख्यात्मक शब्द में बदला जाए
  choice: मुख्य पाठ में ‘व्यभिचार’ की छवि बनाए रखी गई है
  alternative: मूर्तिपूजा; आत्मिक विश्वासघात; भ्रष्ट गठजोड़
  rationale: प्रकाशितवाक्य जानबूझकर यौन अनैतिकता की छवि से धार्मिक, राजनीतिक और आर्थिक विश्वासघात को चित्रित करता है। प्रत्यक्ष छवि रखने से रूपक की व्यापकता और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: πέπτωκαν और व्यापक पाठपरंपरा के πέπωκαν के बीच पाठभेद
  choice: प्रदत्त SBLGNT के πέπτωκαν के अनुसार ‘गिर पड़े हैं’
  alternative: ‘पी चुके हैं,’ यदि πέπωκαν पाठ ग्रहण किया जाए
  rationale: मूल स्रोत के रूप में दिए गए संस्करण को मुख्य पाठ में प्राथमिकता दी गई है; निकट और प्राचीन पाठांतर को पादटिप्पणी में पारदर्शी ढंग से बताया गया है।
- issue: θυμός को ‘क्रोध’ माना जाए या ‘उन्माद/तीव्र वासना’
  choice: ‘प्रकोप’
  alternative: ‘उन्माद’ अथवा ‘तीव्र वासना’
  rationale: यह प्रकाशितवाक्य के न्याय और विनाश के स्वर से मेल खाता है, पर यूनानी संबंधकारकों की बहुअर्थकता को पादटिप्पणी में सुरक्षित रखा गया है।
