id: REV.18.4
reference: Revelation 18:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ἄλλην φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· ⸀Ἐξέλθατε, ⸂ὁ λαός μου, ἐξ αὐτῆς⸃, ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς, καὶ ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/004.yaml
  text: And I heard another voice from heaven saying[a], “Come out of her, my people, so that you may not share in her sins[b], and so that you may not receive any of her plagues.”
translation:
  language: hi
  text: और मैंने स्वर्ग से एक और आवाज़ को यह कहते सुना, “हे मेरे लोगो, उसमें से निकल आओ[a], ताकि तुम उसके पापों[b] में सहभागी न हो और उसकी विपत्तियों में से कोई तुम पर न आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसमें से निकल जाओ।” यूनानी आज्ञा का अनुवाद प्रसंग के अनुसार “निकल आओ” या “निकल जाओ” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ बाबुल को एक स्त्री के रूप में चित्रित किया गया है; “उसके पाप” उसी मानवीकरण को आगे बढ़ाता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλην φωνὴν
  choice: एक और आवाज़
  rationale: यह पहले से भिन्न एक अतिरिक्त आवाज़ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: इस प्रसंग में οὐρανός आकाश नहीं, स्वर्गीय लोक को सूचित करता है।
- source_word: Ἐξέλθατε
  choice: निकल आओ
  rationale: बहुवचन आज्ञार्थक क्रिया बाबुल को छोड़ने का सीधा आह्वान है। हिन्दी में बुलाने वाले स्वर के साथ ‘निकल आओ’ स्वाभाविक है; ‘निकल जाओ’ भी सम्भव है।
- source_word: ὁ λαός μου
  choice: हे मेरे लोगो
  rationale: सम्बोधन का बल स्पष्ट करता है और वाचा-सम्बन्धी ‘मेरे लोग’ की अभिव्यक्ति बनाए रखता है।
- source_word: ἐξ αὐτῆς
  choice: उसमें से
  rationale: बाबुल स्त्री और नगर दोनों के रूप में चित्रित है। हिन्दी का ‘उसमें से’ नगर के भीतर से निकलने का अर्थ स्वाभाविक रूप से देता है, जबकि स्त्रीलिंग मानवीकरण को अलग टिप्पणी में स्पष्ट किया गया है।
- source_word: ἵνα μὴ συγκοινωνήσητε ταῖς ἁμαρτίαις αὐτῆς
  choice: ताकि तुम उसके पापों में सहभागी न हो
  rationale: सहभागिता और नैतिक संलिप्तता दोनों का भाव बनाए रखता है।
- source_word: ἐκ τῶν πληγῶν αὐτῆς ἵνα μὴ λάβητε
  choice: उसकी विपत्तियों में से कोई विपत्ति तुम पर न आए
  rationale: ἐκ का अंशसूचक भाव ‘में से कोई’ द्वारा और न्याय को झेलने का अर्थ स्वाभाविक हिन्दी ‘तुम पर न आए’ द्वारा व्यक्त होता है।
- source_word: πληγῶν
  choice: विपत्तियों
  rationale: प्रकाशितवाक्य में यह ईश्वरीय न्याय के रूप में आने वाली मारों/महामारियों को दर्शाता है; ‘विपत्तियाँ’ हिन्दी में पर्याप्त व्यापक और स्वाभाविक है।
theological_decisions:
- issue: αὐτῆς में बाबुल का स्त्रीलिंग मानवीकरण
  choice: मुख्य पाठ में स्वाभाविक हिन्दी सर्वनाम ‘उसके/उसकी’ रखा और पादटिप्पणी में स्त्री के रूप में बाबुल के चित्रण को स्पष्ट किया।
  alternative: हर स्थान पर ‘उस स्त्री के’ कहना या निर्जीव ‘उस नगर के’ से मानवीकरण को दबाना।
  rationale: मूल पाठ बाबुल को स्त्री और नगर दोनों के रूप में प्रस्तुत करता है। हिन्दी सर्वनाम व्याकरणतः अंग्रेज़ी की तरह लिंग प्रकट नहीं करते, इसलिए टिप्पणी साहित्यिक बिम्ब को सुरक्षित रखती है।
- issue: दो ἵνα खंडों का सम्बन्ध
  choice: पहले के लिए ‘ताकि’ और दूसरे समन्वित परिणाम/चेतावनी के लिए ‘और ... न आए’ रखा।
  alternative: दोनों बार ‘ताकि’ दोहराना या दोनों को ‘कहीं ऐसा न हो’ से अनूदित करना।
  rationale: दोनों निषेधात्मक उद्देश्य/चेतावनी खंडों की समानता बनी रहती है, पर हिन्दी में अनावश्यक पुनरुक्ति से बचा जाता है।
- issue: विपत्तियों को ‘पाना’ या उनका भाग भुगतना
  choice: ‘कोई विपत्ति तुम पर न आए’
  alternative: ‘तुम उसकी विपत्तियों में से न पाओ’ अथवा ‘तुम्हें उसकी विपत्तियाँ न मिलें।’
  rationale: यह निर्णय के भोगी बनने का भाव स्वाभाविक हिन्दी में देता है और ‘में से’ द्वारा यूनानी ἐκ की अंशसूचक अस्पष्टता भी बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘हे मेरे लोगो’ में स्पष्ट सम्बोधन रखा गया है। ‘सहभागी’ धार्मिक-साहित्यिक प्रसंग के अनुकूल है, जबकि वाक्य-विन्यास बोलचाल से अत्यधिक दूर नहीं जाता।
