source:
  edition: SBLGNT
  text: καὶ ἡ ὀπώρα ⸂σου τῆς ἐπιθυμίας τῆς ψυχῆς⸃ ἀπῆλθεν ἀπὸ σοῦ, καὶ πάντα τὰ λιπαρὰ καὶ τὰ λαμπρὰ ἀπώλετο ἀπὸ σοῦ, καὶ ⸀οὐκέτι ⸂οὐ μὴ αὐτὰ εὑρήσουσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/014.yaml
  text: And the fruit of your soul’s desire has gone away from you[a], and all the rich and splendid things have perished from you[b], and they will never be found again.
translation:
  language: hi
  text: तेरे प्राण की लालसा का फल तुझसे चला गया है[a]। सारी विलासपूर्ण और भव्य वस्तुएँ तुझसे लुप्त हो गई हैं, और वे फिर कभी नहीं मिलेंगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पका हुआ” या “ऋतु के अंतिम फल”।
    reason: lexical_alternative
  - marker: b
    text: या, “वे उन्हें फिर कभी नहीं पाएँगे”; यूनानी में कर्ता अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὀπώρα
  choice: पका फल
  rationale: यह शब्द विशेष रूप से पके हुए या ऋतु के अंतिम फल को सूचित कर सकता है। ‘पका फल’ व्यापारिक वस्तुओं के संदर्भ और मूल रूपक—दोनों को बनाए रखता है।
- source_word: σου τῆς ἐπιθυμίας τῆς ψυχῆς
  choice: जिसकी तेरे प्राण को लालसा थी
  rationale: यह स्वाभाविक हिन्दी में यूनानी संबंधकारक पदबंध का अर्थ व्यक्त करता है और ψυχή की भीतरी, तीव्र अभिलाषा को ‘प्राण’ द्वारा सुरक्षित रखता है।
- source_word: ἀπῆλθεν ἀπὸ σοῦ
  choice: तुझसे दूर चला गया है
  rationale: यह अलग हो जाने और वर्तमान में उसके खो चुके होने, दोनों भावों को व्यक्त करता है।
- source_word: πάντα τὰ λιπαρὰ
  choice: भोग-विलास की सारी वस्तुएँ
  rationale: संदर्भ में λιπαρά केवल चिकने या स्वादिष्ट खाद्य पदार्थ नहीं, बल्कि समृद्ध और विलासपूर्ण वस्तुओं को व्यापक रूप से सूचित करता है।
- source_word: τὰ λαμπρὰ
  choice: भव्य वस्तुएँ
  rationale: यहाँ शब्द का आशय चमकीली या दिखावटी भव्यता से है; ‘भव्य’ आधुनिक हिन्दी में उस वैभव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπώλετο ἀπὸ σοῦ
  choice: तुझसे लुप्त हो गई हैं
  rationale: मध्य/अकर्मक प्रयोग नष्ट या खो जाने का अर्थ देता है। ‘लुप्त’ अपरिवर्तनीय हानि के विलापपूर्ण स्वर के अनुकूल है।
- source_word: οὐκέτι οὐ μὴ
  choice: फिर कभी नहीं
  rationale: संयुक्त निषेध अत्यन्त प्रबल और अंतिम है; ‘फिर कभी नहीं’ हिन्दी में उसी निश्चित अंतिमता को स्पष्ट करता है।
- source_word: αὐτὰ εὑρήσουσιν
  choice: वे ... नहीं मिलेंगी
  rationale: यूनानी क्रिया का कर्ता व्यक्त नहीं है और तीसरा पुरुष बहुवचन अनिश्चित अर्थ में हो सकता है। हिन्दी का निष्क्रिय-सदृश ‘नहीं मिलेंगी’ कोई अतिरिक्त कर्ता जोड़े बिना वस्तुओं के फिर प्राप्त न होने को व्यक्त करता है।
theological_decisions:
- issue: εὑρήσουσιν का अप्रकट कर्ता
  choice: अनिश्चित भाव को ‘वे फिर कभी नहीं मिलेंगी’ के रूप में प्रस्तुत किया
  alternative: ‘लोग उन्हें फिर कभी नहीं पाएँगे’
  rationale: यूनानी में स्पष्ट कर्ता नहीं दिया गया है। निष्क्रिय-सदृश हिन्दी मूल की अनिश्चितता और हानि की अंतिमता बनाए रखती है तथा ‘लोग’ जैसा कर्ता नहीं जोड़ती।
translation_notes:
  register: सम्बोधित बाबुल के लिए एकवचन निकट सम्बोधन ‘तेरे/तुझसे’ रखा गया है। भाषा आधुनिक, गरिमापूर्ण और विलाप के काव्यात्मक स्वर के अनुरूप है; ‘प्राण’ मूल के ψυχή को बनाए रखता है।
