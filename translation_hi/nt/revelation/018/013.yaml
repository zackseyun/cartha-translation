    rationale: Although the commercial context concerns enslaved persons, the source text says “bodies,” followed by “human souls.” The draft turns the source wording into an interpretation and converts the second coordinate phrase into an explanatory gloss.
  - severity: medium
    issue: Footnote a is anchored after “भेड़ें.”
    rationale: The note concerns ἄμωμον, rendered “सुगंधित मसाला,” and must be attached there.
