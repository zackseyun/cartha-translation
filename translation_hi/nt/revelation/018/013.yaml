id: REV.18.13
reference: Revelation 18:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κιννάμωμον ⸂καὶ ἄμωμον⸃ καὶ θυμιάματα καὶ μύρον καὶ λίβανον καὶ οἶνον καὶ ἔλαιον καὶ σεμίδαλιν καὶ σῖτον καὶ ⸂κτήνη καὶ πρόβατα⸃, καὶ ἵππων καὶ ῥεδῶν καὶ σωμάτων, καὶ ψυχὰς ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/013.yaml
  text: and cinnamon and spice and incense and perfume and frankincense and wine and olive oil and fine flour and wheat and cattle and sheep[a], and horses and chariots and servants, that is[b], human souls.
translation:
  language: hi
  text: और दालचीनी, सुगंधित मसाला[a], धूप, इत्र, लोबान, दाखमधु, जैतून का तेल, मैदा, गेहूँ, मवेशी, भेड़ें, घोड़े, गाड़ियाँ, शरीर[b]—अर्थात् मनुष्यों के प्राण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अमोमुम”, एक महँगा सुगंधित मसाला।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “शरीर”; व्यापार की इस सूची में आशय दास बनाकर बेचे जाने वाले मनुष्यों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κιννάμωμον
  choice: दालचीनी
  rationale: यह आयातित सुगंधित वस्तु दालचीनी को सूचित करती है; आधुनिक हिन्दी में यही स्पष्ट और प्रचलित नाम है।
- source_word: ἄμωμον
  choice: सुगंधित मसाला
  rationale: इस महँगे सुगंधित पौधे या मसाले की सटीक वनस्पति-पहचान अनिश्चित और सामान्य पाठक के लिए अपरिचित है; इसलिए अर्थ स्पष्ट किया गया है और वैकल्पिक नाम पादटिप्पणी में रखा गया है।
- source_word: θυμιάματα
  choice: धूप
  rationale: व्यापारिक सूची में यह जलाए जाने वाले सुगंधित पदार्थ को दर्शाता है, न कि उसे चढ़ाने की क्रिया को।
- source_word: μύρον
  choice: इत्र
  rationale: यह महँगे सुगंधित लेप या तेल को दर्शाता है; 'इत्र' आधुनिक हिन्दी में सूची के संदर्भ में स्वाभाविक है।
- source_word: λίβανον
  choice: लोबान
  rationale: यह सामान्य धूप से अलग, विशेष रूप से फ्रैंकिन्सेन्स नामक सुगंधित राल है, जिसका स्थापित हिन्दी नाम 'लोबान' है।
- source_word: οἶνον
  choice: दाखमधु
  rationale: यह अंगूर से बने मद्य को दर्शाता है; 'दाखमधु' गरिमापूर्ण और स्पष्ट बाइबलीय हिन्दी है।
- source_word: ἔλαιον
  choice: जैतून का तेल
  rationale: संदर्भ में तेल से आशय जैतून के तेल से है; इसे स्पष्ट करने से आधुनिक पाठक के लिए अनावश्यक अस्पष्टता दूर होती है।
- source_word: σεμίδαλιν
  choice: मैदा
  rationale: यह बारीक, उच्च कोटि के आटे को दर्शाता है; 'मैदा' साधारण आधुनिक हिन्दी में इसका स्वाभाविक वस्तुगत समतुल्य है।
- source_word: σῖτον
  choice: गेहूँ
  rationale: यद्यपि शब्द कभी व्यापक रूप से अनाज को सूचित कर सकता है, इस व्यापारिक सूची में गेहूँ सबसे संभावित विशिष्ट अर्थ है।
- source_word: κτήνη
  choice: मवेशी
  rationale: यह बड़े पालतू पशुओं को दर्शाता है और इसके बाद आए 'भेड़ें' से उचित भेद बनाए रखता है।
- source_word: πρόβατα
  choice: भेड़ें
  rationale: शब्द सीधे भेड़ों को सूचित करता है।
- source_word: ἵππων
  choice: घोड़े
  rationale: यह बहुवचन संज्ञा स्पष्ट रूप से घोड़ों को दर्शाती है।
- source_word: ῥεδῶν
  choice: रथ
  rationale: यह चार पहियों वाले वाहनों को दर्शाता है; रोमी विलास-वाणिज्य के संदर्भ में सवारी-रथ अभिप्रेत हैं, और 'रथ' सामान्य हिन्दी पाठक के लिए सहज है।
- source_word: σωμάτων
  choice: दास
  rationale: शाब्दिक अर्थ 'शरीर' है, पर व्यापारिक सूची में मनुष्यों को संपत्ति की तरह बेचे जाने—अर्थात् दासों—का संकेत है; शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ψυχὰς ἀνθρώπων
  choice: मनुष्यों के प्राण
  rationale: शाब्दिक अभिव्यक्ति को बनाए रखने से सूची का चरम और मनुष्यों के वस्तुकरण की निंदा उभरती है; इसे केवल 'मनुष्य' कहने से मूल की तीक्ष्णता घटती।
theological_decisions:
- issue: σωμάτων καὶ ψυχὰς ἀνθρώπων का संबंध
  choice: दास—अर्थात् मनुष्यों के प्राण
  alternative: शरीर और मनुष्यों के प्राण
  rationale: व्यापारिक संदर्भ में σωμάτων दासों के लिए प्रयुक्त है, जबकि अगला वाक्यांश उनके पूर्ण मानवीय व्यक्तित्व को सामने लाकर वस्तुकरण की भयावहता उजागर करता है। डैश व्याख्यात्मक और चरमोत्कर्ष संबंध दिखाता है, पर शाब्दिक 'शरीर' पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज व्यापारिक सूची। वस्तुओं के नाम सामान्य पाठक के लिए परिचित रखे गए हैं। अंतिम पदबंध में मूल यूनानी की तीक्ष्णता और दास-व्यापार द्वारा मनुष्यों के वस्तुकरण का प्रभाव सुरक्षित रखा गया है।
