  naturalness: The commodity list is fluent modern Hindi. “गाड़ियाँ” is a natural broad rendering for the Roman vehicles intended here. “शरीर—अर्थात् मनुष्यों के प्राण” is deliberately stark, as is the Greek, while the note supplies the contextual sense.
  terminology: दालचीनी, सुगंधित मसाला, धूप, इत्र, लोबान, दाखमधु, जैतून का तेल, मैदा, गेहूँ, मवेशी, and भेड़ें are suitable. The footnote anchor for ἄμωμον should immediately follow “सुगंधित मसाला,” rather than incorrectly following “भेड़ें.”
