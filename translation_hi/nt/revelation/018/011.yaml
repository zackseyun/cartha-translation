id: REV.18.11
reference: Revelation 18:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ οἱ ἔμποροι τῆς γῆς ⸂κλαίουσιν καὶ πενθοῦσιν⸃ ἐπ’ ⸀αὐτήν, ὅτι τὸν γόμον αὐτῶν οὐδεὶς ἀγοράζει οὐκέτι,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/018/011.yaml
  text: And the merchants of the earth weep and mourn over her[a], because no one buys their cargo anymore[b],
translation:
  language: hi
  text: और पृथ्वी[a] के व्यापारी उसके लिए रोते और विलाप करते हैं, क्योंकि अब कोई उनका माल[b] नहीं खरीदता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देश के’ अथवा ‘भूमि के’। यूनानी शब्द का अर्थ ‘पृथ्वी’ और ‘भूमि/देश’ दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लदा हुआ माल’। यूनानी शब्द विशेष रूप से जहाज़ के पूरे लदान या व्यापारिक माल को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔμποροι
  choice: व्यापारी
  rationale: यह व्यापार में लगे लोगों के लिए आधुनिक मानक हिन्दी का स्वाभाविक और सटीक शब्द है।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: γῆ का अर्थ ‘पृथ्वी’ या ‘देश/भूमि’ हो सकता है; प्रकाशितवाक्य के व्यापक न्याय-संदर्भ में ‘पृथ्वी’ वैश्विक विस्तार को बनाए रखता है।
- source_word: κλαίουσιν καὶ πενθοῦσιν
  choice: रोते और विलाप करते हैं
  rationale: दोनों क्रियाओं को अलग रखते हुए शोक की तीव्रता और यूनानी पदबंध की आलंकारिक पुनरुक्ति सुरक्षित रखी गई है।
- source_word: ἐπ’ αὐτήν
  choice: उसके लिए
  rationale: विलाप के संदर्भ में यह बाबुल को स्त्रीरूप में प्रस्तुत करने वाले संकेत को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: γόμον
  choice: माल
  rationale: γόμος जहाज़ पर लदे माल अथवा व्यापारिक वस्तुओं को सूचित करता है; ‘माल’ सामान्य पाठक के लिए स्वाभाविक है और व्यापार-संदर्भ में उपयुक्त है।
- source_word: οὐδεὶς ἀγοράζει οὐκέτι
  choice: अब कोई ... नहीं खरीदता
  rationale: यह वर्तमान काल और οὐκέτι में निहित खरीद बंद हो जाने की बात को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτῶν
  choice: उनका
  rationale: सम्बन्धकारक सर्वनाम व्यापारियों के माल पर उनका अधिकार दिखाता है।
theological_decisions:
- issue: बाबुल का स्त्रीरूप व्यक्तिकरण
  choice: ‘उसके लिए’ द्वारा स्त्रीरूप में चित्रित बाबुल का व्यक्तिगत संकेत बनाए रखा गया है।
  alternative: नगर या व्यवस्था मानकर ‘उसके कारण’ अथवा निर्जीव ‘उस वस्तु के लिए’ कहना।
  rationale: प्रकाशितवाक्य बाबुल को स्त्री और नगर के रूप में व्यक्त करता है; अनुवाद इस प्रतीक को किसी एक व्याख्यात्मक पहचान में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘रोते और विलाप करते हैं’ मूल की दो समानार्थी किंतु अलग क्रियाओं को बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
