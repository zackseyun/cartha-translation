translation:
  language: hi
  text: क्योंकि एक ही घड़ी में इतनी बड़ी धन-संपत्ति नष्ट कर दी गई। और हर जहाज़ का कप्तान, हर वह व्यक्ति जो किसी स्थान की ओर समुद्री यात्रा करता है[a], नाविक और वे सभी जो समुद्र पर काम करते हैं, दूर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर वह व्यक्ति जो समुद्र में कहीं भी यात्रा करता है,” अथवा “हर वह व्यक्ति जो किसी बंदरगाह की ओर जाता है।” यूनानी वाक्यांश एक मुहावरेदार अभिव्यक्ति है और सामान्य रूप से समुद्री मार्ग से विभिन्न गंतव्यों की यात्रा करने वालों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले विलाप का कारण या स्पष्टीकरण प्रस्तुत करता है और हिन्दी में स्वाभाविक संबंध बनाता है।
- source_word: μιᾷ ὥρᾳ
  choice: एक ही घड़ी में
  rationale: समय की दत्तिविभक्ति और विनाश की आकस्मिकता को बनाए रखता है; ‘घड़ी’ प्रकाशन की ऊँची, किंतु समझने योग्य शैली के अनुकूल है।
- source_word: ἠρημώθη
  choice: उजाड़ दी गई
  rationale: क्रिया के निष्क्रिय रूप तथा उजाड़ या नष्ट कर दिए जाने के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ τοσοῦτος πλοῦτος
  choice: इतनी बड़ी धन-संपत्ति
  rationale: τοσοῦτος की परिमाणसूचक तीव्रता और πλοῦτος के आर्थिक अर्थ, दोनों को व्यक्त करता है।
- source_word: πᾶς κυβερνήτης
  choice: हर जहाज़ का कप्तान
  rationale: समुद्री संदर्भ में जहाज़ चलाने या उसका नेतृत्व करने वाले व्यक्ति को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: πᾶς ὁ ἐπὶ τόπον πλέων
  choice: हर वह व्यक्ति जो किसी स्थान की ओर समुद्री यात्रा करता है
  rationale: यूनानी वाक्यांश की गंतव्य-संबंधी अस्पष्टता को सुरक्षित रखता है और उसे केवल यात्री, व्यापारी या किसी विशेष वर्ग तक सीमित नहीं करता।
- source_word: ναῦται
  choice: नाविक
  rationale: आधुनिक हिन्दी में समुद्री कर्मियों के लिए स्पष्ट और सामान्य शब्द है।
- source_word: ὅσοι τὴν θάλασσαν ἐργάζονται
  choice: वे सभी जो समुद्र पर काम करते हैं
  rationale: नाविकों से व्यापक उस समूह को बनाए रखता है जिसका श्रम या व्यवसाय समुद्र से जुड़ा है, बिना इसे केवल जीविका कमाने तक सीमित किए।
- source_word: ἀπὸ μακρόθεν ἔστησαν
  choice: दूर खड़े हो गए
  rationale: स्थानिक दूरी और कथात्मक अओरिस्ट क्रिया, दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बाबुल पर विलाप करने वाले समुद्री समूहों का दायरा
  choice: जहाज़ के कप्तान, गंतव्य की ओर समुद्री यात्रा करने वाले, नाविक और समुद्र पर काम करने वाले लोगों को अलग-अलग समूहों के रूप में रखा गया है।
  alternative: पूरी सूची को ‘सभी समुद्री यात्री’ या ‘सभी समुद्री व्यवसायी’ कहकर एक ही वर्ग में मिला देना।
  rationale: यूनानी पाठ कई समन्वित समूह गिनाता है। उनका भेद बनाए रखने से व्यापक आर्थिक प्रभाव की आलंकारिक शक्ति सुरक्षित रहती है और पाठ में निहित न होने वाली पहचान नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘एक ही घड़ी’ प्रकाशन की साहित्यिक शैली और अचानक घटित न्याय के भाव को बनाए रखता है। मुख्य पाठ में [a] चिह्न संबंधित अस्पष्ट यूनानी वाक्यांश के तुरंत बाद दिया गया है।
