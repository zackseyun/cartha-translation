  text: καὶ οἱ κατοικοῦντες ἐπὶ τῆς γῆς χαίρουσιν ἐπ’ αὐτοῖς καὶ ⸀εὐφραίνονται, καὶ δῶρα ⸀πέμψουσιν ἀλλήλοις, ὅτι οὗτοι οἱ δύο προφῆται ἐβασάνισαν τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/010.yaml
  text: And those who dwell on the earth rejoice over them and celebrate[a], and they will send gifts to one another[b], because these two prophets tormented those who dwell on the earth.
translation:
  language: hi
  text: और पृथ्वी पर रहनेवाले[a] उनके कारण आनन्दित होते हैं और खुशियाँ मनाते हैं[b]। वे एक-दूसरे को उपहार भेजेंगे, क्योंकि इन दोनों भविष्यद्वक्ताओं ने पृथ्वी पर रहनेवालों को यातना दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी के निवासी।” प्रकाशितवाक्य में यह अभिव्यक्ति प्रायः परमेश्वर के विरुद्ध खड़े संसार के लोगों के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उल्लास मनाते हैं” या “मौज-मस्ती करते हैं।” यूनानी क्रिया उत्सवपूर्ण प्रसन्नता पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς / τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहनेवाले / पृथ्वी पर रहनेवालों
  rationale: यह यूनानी कृदन्तीय अभिव्यक्ति पद में दो बार आती है। हिन्दी में समान रूप से दोहराने पर इसकी शाब्दिक क्रियात्मकता और प्रकाशितवाक्य में इसका आवर्ती महत्व दोनों बने रहते हैं।
- source_word: χαίρουσιν ἐπ’ αὐτοῖς
  choice: उनके मारे जाने पर आनन्दित होते हैं
  rationale: ἐπ’ αὐτοῖς का आशय प्रसंग में उन दोनों गवाहों की मृत्यु पर होने वाले आनन्द से है। हिन्दी में केवल ‘उन पर आनन्दित’ अस्वाभाविक है; प्रसंगगत कारण स्पष्ट करने वाला यह रूप सहज है, जबकि पादटिप्पणी अधिक शाब्दिक रूप बताती है।
- source_word: εὐφραίνονται
  choice: खुशियाँ मनाते हैं
  rationale: यह χαίρουσιν के साथ उत्सवी प्रसन्नता व्यक्त करता है। ‘खुशियाँ मनाते हैं’ आधुनिक और स्वाभाविक है तथा पहले क्रियापद ‘आनन्दित होते हैं’ से आवश्यक भेद रखता है।
- source_word: δῶρα πέμψουσιν ἀλλήλοις
  choice: वे एक-दूसरे को उपहार भेजेंगे
  rationale: ‘उपहार’ δῶρα का सामान्य अर्थ है और ‘भेजेंगे’ यूनानी भविष्यत्काल को सुरक्षित रखता है।
- source_word: οὗτοι οἱ δύο προφῆται
  choice: इन दोनों भविष्यद्वक्ताओं
  rationale: संकेतवाचक और संख्या सहित संज्ञा-समूह का सीधा तथा स्वाभाविक हिन्दी रूप।
- source_word: ἐβασάνισαν
  choice: यातना दी थी
  rationale: यह βασανίζω की तीव्रता को बनाए रखता है और ‘परेशान किया’ जैसे नरम विकल्प से बचता है।
theological_decisions:
- issue: प्रकाशितवाक्य में पृथ्वी पर रहनेवालों के लिए प्रयुक्त आवर्ती अभिव्यक्ति
  choice: पृथ्वी पर रहनेवाले
  alternative: पृथ्वी के निवासी
  rationale: चुना हुआ रूप यूनानी की क्रियात्मक अभिव्यक्ति को बनाए रखता है और उसे केवल भौगोलिक पहचान या खुली धर्मवैचारिक व्याख्या में सीमित नहीं करता।
- issue: दो भविष्यद्वक्ताओं के प्रभाव की तीव्रता
  choice: यातना दी थी
  alternative: सताया था / दुःख पहुँचाया था
  rationale: मूल क्रिया तीव्र पीड़ा या यातना का बोध कराती है। इसे नरम करना संसार की प्रतिक्रिया के लिए पद में दिए गए कारण की शक्ति घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वर्तमानकाल (‘आनन्दित होते हैं’, ‘खुशियाँ मनाते हैं’) और भविष्यत्काल (‘भेजेंगे’) का अंतर मूल के अनुसार सुरक्षित है; आरम्भ और अन्त में आने वाली आवर्ती अभिव्यक्ति का अनुवाद भी समान रखा गया है।
