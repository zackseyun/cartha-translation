source:
  edition: SBLGNT
  text: Καὶ μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ πνεῦμα ζωῆς ἐκ τοῦ θεοῦ εἰσῆλθεν ⸂ἐν αὐτοῖς⸃, καὶ ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν, καὶ φόβος μέγας ⸀ἐπέπεσεν ἐπὶ τοὺς θεωροῦντας αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/011.yaml
  text: And after the three and a half days[a], a breath of life from God entered into them, and they stood on their feet, and great fear fell on those watching them.
translation:
  language: hi
  text: और उन साढ़े तीन दिनों के बाद, परमेश्वर की ओर से जीवन का श्वास[a] उनमें प्रवेश कर गया, और वे अपने पैरों पर खड़े हो गए; और उन्हें देखते रहने वालों पर बड़ा भय छा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवन की आत्मा”; संभवतः “परमेश्वर की ओर से जीवन की आत्मा।” यूनानी शब्द πνεῦμα का अर्थ श्वास, आत्मा या, संदर्भ के अनुसार, पवित्र आत्मा हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὰς τρεῖς ἡμέρας καὶ ἥμισυ
  choice: उन साढ़े तीन दिनों के बाद
  rationale: μετά और कर्मकारक कालगत उत्तरवर्तिता व्यक्त करते हैं। निश्चित पदबंध को ‘उन ... दिनों’ से दर्शाया गया है, और हिन्दी में ‘साढ़े तीन’ स्वाभाविक रूप से ‘तीन और आधे’ का अर्थ देता है।
- source_word: πνεῦμα ζωῆς
  choice: जीवन का श्वास
  rationale: πνεῦμα के अर्थ-क्षेत्र में श्वास, आत्मा और पवित्र आत्मा शामिल हो सकते हैं। पुनर्जीवन के इस दृश्य और यहेजकेल 37 की प्रतिध्वनि को देखते हुए ‘श्वास’ मुख्य पाठ में स्वाभाविक है, जबकि मूल की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: ἐκ स्रोत या उद्गम बताता है। ‘परमेश्वर की ओर से’ आधुनिक हिन्दी में स्वाभाविक है और जीवनदायी श्वास के दिव्य स्रोत को स्पष्ट रखता है।
- source_word: εἰσῆλθεν ἐν αὐτοῖς
  choice: उनमें प्रवेश कर गया
  rationale: εἰσέρχομαι भीतर जाने या प्रवेश करने को बताता है। ‘उनमें प्रवेश कर गया’ आंतरिक प्रवेश का अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔστησαν ἐπὶ τοὺς πόδας αὐτῶν
  choice: वे अपने पैरों पर खड़े हो गए
  rationale: यहाँ ἵστημι अकर्मक अर्थ में है। ‘अपने पैरों पर खड़े हो गए’ पुनर्जीवन की घटना और परिणामी अवस्था दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: φόβος μέγας
  choice: बड़ा भय
  rationale: यह पदबंध μέγας की तीव्रता को बिना ‘आतंक’ जैसी अधिक व्याख्यात्मक भाषा अपनाए सीधे बनाए रखता है।
- source_word: ἐπέπεσεν ἐπὶ
  choice: पर ... छा गया
  rationale: शाब्दिक ‘पर गिर पड़ा’ हिन्दी में भय के साथ अस्वाभाविक है। ‘पर ... छा गया’ उसी आकस्मिक और प्रबल प्रभाव को वर्तमान, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοὺς θεωροῦντας αὐτούς
  choice: उन्हें देखते रहनेवालों
  rationale: वर्तमान कृदंत लगातार या ध्यानपूर्वक देखने का भाव देता है। ‘देखते रहनेवालों’ उस जारी क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: क्या πνεῦμα ζωῆς को जीवनदायी श्वास माना जाए या स्पष्ट रूप से आत्मा/पवित्र आत्मा के रूप में पहचाना जाए
  choice: जीवन का श्वास
  alternative: जीवन की आत्मा; संभवतः परमेश्वर का जीवनदायी आत्मा
  rationale: यूनानी पाठ इसका स्रोत परमेश्वर को बताता है, पर इसे स्पष्टतः पवित्र आत्मा नहीं कहता। मुख्य पाठ में ‘श्वास’ पुनर्जीवन की भविष्यद्वक्तापरक छवि को दर्शाता है; पादटिप्पणी अन्य वैध अर्थों को रखकर धर्मवैज्ञानिक तनाव को अनसुलझा रहने देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सहज शैली। ‘साढ़े तीन’, ‘अपने पैरों पर खड़े हो गए’ और ‘भय छा गया’ स्वाभाविक हिन्दी प्रयोग हैं। πνεῦμα की अर्थगत अस्पष्टता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
