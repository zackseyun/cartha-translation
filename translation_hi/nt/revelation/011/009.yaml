source:
  edition: SBLGNT
  text: καὶ βλέπουσιν ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν τὸ πτῶμα αὐτῶν ἡμέρας τρεῖς ⸀καὶ ἥμισυ, καὶ τὰ πτώματα αὐτῶν οὐκ ⸀ἀφίουσιν τεθῆναι εἰς μνῆμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/009.yaml
  text: And some from the peoples and tribes and languages and nations look at their dead bodies for three and a half days[a], and they do not allow them to be laid in a tomb.
translation:
  language: hi
  text: और जनसमूहों, गोत्रों, भाषाओं और राष्ट्रों में से कुछ लोग साढ़े तीन दिन तक उनका शव[a] देखते हैं, और वे उनके शवों को कब्र में रखे जाने की अनुमति नहीं देते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ पहले ‘उनका शव’ (एकवचन) और फिर ‘उनके शव’ (बहुवचन) कहता है। एकवचन संभवतः दोनों गवाहों को एक संयुक्त साक्षी के रूप में प्रस्तुत करता है, जिसके बाद उनके अलग-अलग शवों की बात होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπουσιν
  choice: देखते हैं
  rationale: वर्तमान काल की प्रत्यक्ष दृश्य क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है; संदर्भ से उसका जारी रहना स्पष्ट है।
- source_word: ἐκ τῶν λαῶν καὶ φυλῶν καὶ γλωσσῶν καὶ ἐθνῶν
  choice: जनसमूहों, गोत्रों, भाषाओं और राष्ट्रों में से कुछ लोग
  rationale: ἐκ की अंशवाचकता को ‘में से कुछ लोग’ स्पष्ट करता है और यह नहीं कहता कि इन सभी समूहों का प्रत्येक व्यक्ति देखता है।
- source_word: λαῶν
  choice: जनसमूहों
  rationale: बहुवचन सामूहिक समूहों का भेद बनाए रखता है और ἐθνῶν के लिए प्रयुक्त ‘राष्ट्रों’ से अलग अर्थ देता है।
- source_word: φυλῶν
  choice: गोत्रों
  rationale: प्रकाशितवाक्य की जातीय-सामुदायिक सूचियों में ‘गोत्र’ उपयुक्त और परिचित शब्द है।
- source_word: γλωσσῶν
  choice: भाषाओं
  rationale: यहाँ शब्द भाषाई समुदायों को दर्शाता है; आधुनिक हिन्दी में ‘भाषाएँ’ स्वाभाविक है।
- source_word: ἐθνῶν
  choice: राष्ट्रों
  rationale: प्रकाशितवाक्य की सूत्रात्मक सूची में यह व्यापक राष्ट्रीय अथवा जातीय समूहों का स्वाभाविक अनुवाद है।
- source_word: τὸ πτῶμα αὐτῶν
  choice: उनका शव
  rationale: दो गवाहों के संदर्भ के बावजूद यूनानी के प्रथम उल्लेख में एकवचन πτῶμα है; इसे सामूहिक एकवचन के रूप में सुरक्षित रखा गया है।
- source_word: ἡμέρας τρεῖς καὶ ἥμισυ
  choice: साढ़े तीन दिन तक
  rationale: अवधि-सूचक कर्मकारक का स्वाभाविक हिन्दी रूप है और निश्चित अपोकैलिप्टिक अवधि बनाए रखता है।
- source_word: τὰ πτώματα αὐτῶν
  choice: उनके शवों
  rationale: दूसरे उल्लेख में यूनानी बहुवचन है; हिन्दी में भी बहुवचन रखकर मूल का एकवचन-बहुवचन परिवर्तन सुरक्षित किया गया है।
- source_word: οὐκ ἀφίουσιν
  choice: अनुमति नहीं देते
  rationale: इस संदर्भ में ἀφίημι का अर्थ अनुमति देना है, न कि छोड़ना या क्षमा करना।
- source_word: τεθῆναι εἰς μνῆμα
  choice: कब्र में रखे जाने
  rationale: यह सामान्य ‘दफन किए जाने’ की अपेक्षा शवों को समाधि-स्थान में रखे जाने की मूल छवि को अधिक निकटता से व्यक्त करता है।
theological_decisions:
- issue: पहले खंड में एकवचन πτῶμα और दूसरे में बहुवचन πτώματα
  choice: पहले ‘उनका शव’ और फिर ‘उनके शवों’
  alternative: हिन्दी शैली को सहज बनाने के लिए दोनों स्थानों पर ‘उनके शव’ कहना
  rationale: मूल पाठ स्वयं एकवचन से बहुवचन की ओर बदलता है। पहला रूप दोनों गवाहों को एक संयुक्त साक्षी के रूप में प्रस्तुत कर सकता है, जबकि दूसरा उनके अलग-अलग शवों की ओर संकेत करता है; अनुवाद इस संभावित अर्थ और तनाव को मिटाता नहीं है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘में से कुछ लोग’ अंशवाचक अर्थ स्पष्ट करता है। मूल के असामान्य किंतु संभवतः अर्थपूर्ण एकवचन-बहुवचन परिवर्तन को मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित रखा गया है।
