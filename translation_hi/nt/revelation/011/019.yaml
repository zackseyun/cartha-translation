id: REV.11.19
reference: Revelation 11:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἠνοίγη ὁ ναὸς τοῦ θεοῦ ⸀ὁ ἐν τῷ οὐρανῷ, καὶ ὤφθη ἡ κιβωτὸς τῆς διαθήκης ⸀αὐτοῦ ἐν τῷ ναῷ αὐτοῦ· καὶ ἐγένοντο ἀστραπαὶ καὶ φωναὶ καὶ βρονταὶ ⸂καὶ σεισμὸς⸃ καὶ χάλαζα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/019.yaml
  text: And the temple of God in heaven was opened[a], and the ark of his covenant was seen in his temple[c][b]; and there were flashes of lightning and voices and peals of thunder and an earthquake and great hail.
translation:
  language: hi
  text: और स्वर्ग में परमेश्वर का मंदिर[a] खोला गया, और उसके मंदिर में उसकी वाचा का संदूक[b] दिखाई दिया। और बिजलियाँ चमकीं, आवाज़ें[c] हुईं, गर्जनाएँ हुईं, भूकंप आया और बड़े-बड़े ओले गिरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान”; यूनानी ναός सामान्यतः मंदिर के पवित्र भीतरी भाग या परमेश्वर के निवासस्थान पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसकी वाचा का संदूक”; यूनानी पाठ में “उसकी” स्पष्ट रूप से है।
    reason: lexical_clarification
  - marker: c
    text: या “ध्वनियाँ” अथवा “गड़गड़ाहटें”; प्रकाशितवाक्य में यह अभिव्यक्ति दैवी महिमा और न्याय के दृश्यों में बार-बार आती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: मंदिर
  rationale: यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है। यूनानी शब्द विशेष रूप से पवित्रस्थान या भीतरी पवित्र भाग का संकेत दे सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὁ ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: 'यह ναός को विशेषित करने वाले स्थानवाचक पद का स्वाभाविक हिन्दी रूप है: परमेश्वर का वह मंदिर जो स्वर्ग में है।'
- source_word: ἠνοίγη
  choice: खोला गया
  rationale: कर्मवाच्य रूप यूनानी अओरिस्ट पैसिव को सुरक्षित रखता है और कर्ता को स्पष्ट किए बिना निहित दैवी क्रिया की गुंजाइश बनाए रखता है।
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: यह हिन्दी में स्वाभाविक रहते हुए इस बात को खुला रखता है कि संदूक प्रकट हुआ या मंदिर खुलने पर दृष्टिगोचर हुआ।
- source_word: κιβωτὸς τῆς διαθήκης αὐτοῦ
  choice: उसकी वाचा का संदूक
  rationale: αὐτοῦ को ‘उसकी’ के रूप में स्पष्ट रखा गया है और διαθήκη के लिए प्रचलित बाइबिलीय शब्द ‘वाचा’ लिया गया है।
- source_word: ἐν τῷ ναῷ αὐτοῦ
  choice: उसके मंदिर में
  rationale: दोहराए गए ναός के लिए वही शब्द रखा गया है और αὐτοῦ का स्वामित्व भी सुरक्षित है।
- source_word: ἐγένοντο
  choice: हुईं / गरजे / आया / गिरे
  rationale: यूनानी में एक ही क्रिया पूरी सूची पर लागू होती है; हिन्दी में प्रत्येक घटना के अनुरूप स्वाभाविक क्रियाओं से घटनाओं के घटित होने का भाव व्यक्त किया गया है।
- source_word: ἀστραπαὶ
  choice: बिजलियाँ चमकीं
  rationale: बहुवचन का प्रभाव बनाए रखते हुए यह आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: φωναὶ
  choice: आवाज़ें
  rationale: शाब्दिक अर्थ और प्रकाशितवाक्य की आवर्ती ईश्वर-प्रकटन संबंधी शब्दावली को सुरक्षित रखता है; ‘ध्वनियाँ’ या ‘गड़गड़ाहटें’ की संभावना पादटिप्पणी में दी गई है।
- source_word: βρονταὶ
  choice: बादल गरजे
  rationale: बहुवचन गर्जनों को सामान्य और सजीव आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σεισμὸς
  choice: भूकंप आया
  rationale: σεισμός का मानक और प्रसंगानुकूल हिन्दी रूप।
- source_word: χάλαζα μεγάλη
  choice: बड़े-बड़े ओले गिरे
  rationale: विशेषण μεγάλη की तीव्रता और ओलावृष्टि की घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्वर्गीय ναός का स्वरूप
  choice: मुख्य पाठ में ‘मंदिर’
  alternative: ‘पवित्रस्थान’
  rationale: ‘मंदिर’ सामान्य पाठक के लिए स्पष्ट है और स्वर्गीय संरचना के बारे में अनावश्यक रूप से संकीर्ण दावा नहीं करता; फिर भी ναός के भीतरी पवित्रस्थान वाले अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: φωναὶ का ईश्वर-प्रकटन संबंधी अर्थ
  choice: मुख्य पाठ में ‘आवाज़ें’
  alternative: ‘ध्वनियाँ’ या ‘गड़गड़ाहटें’
  rationale: ‘आवाज़ें’ यूनानी शब्द और प्रकाशितवाक्य की विशिष्ट आवर्ती अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी मौसम-संबंधी या व्यापक ध्वनि-अर्थ की संभावना बताती है।
- issue: वाचा के संदूक का संबंध
  choice: ‘उसकी वाचा का संदूक’
  alternative: ‘वाचा का संदूक’
  rationale: यूनानी αὐτοῦ स्पष्ट रूप से उपस्थित है और वाचा को परमेश्वर की वाचा के रूप में चिह्नित करता है; इसे हटाना मूल पाठ की सूचना को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। घटनाओं की यूनानी संज्ञा-सूची को हिन्दी में मुहावरेदार क्रियात्मक क्रम में व्यक्त किया गया है। ‘वाचा’, ‘मंदिर’ और ‘संदूक’ जैसे परिचित बाइबिलीय पद बनाए रखे गए हैं; वास्तविक lexical ambiguity पादटिप्पणियों में सुरक्षित है।
