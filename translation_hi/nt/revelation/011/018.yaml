id: REV.11.18
reference: Revelation 11:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὰ ἔθνη ὠργίσθησαν, καὶ ἦλθεν ἡ ὀργή σου καὶ ὁ καιρὸς τῶν νεκρῶν κριθῆναι καὶ δοῦναι τὸν μισθὸν τοῖς δούλοις σου τοῖς προφήταις καὶ τοῖς ἁγίοις καὶ τοῖς φοβουμένοις τὸ ὄνομά σου, ⸂τοὺς μικροὺς καὶ τοὺς μεγάλους⸃, καὶ διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/018.yaml
  text: And the nations became angry[a], and your wrath came, and the time for the dead to be judged, and to give the reward to your servants—the prophets, the saints, and those who fear your name[b], the small and the great—and to destroy those who destroy the earth.
translation:
  language: hi
  text: और राष्ट्र क्रोधित हुए, और तेरा प्रकोप आ पहुँचा, और वह समय भी आ पहुँचा कि मरे हुओं का न्याय किया जाए, और तेरे सेवकों[a]—भविष्यद्वक्ताओं, पवित्र जनों और तेरे नाम का भय मानने वालों, छोटे और बड़े सभी को—प्रतिफल दिया जाए, और पृथ्वी को नष्ट करने वालों को नष्ट किया जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे दासों।” यूनानी शब्द का अर्थ संदर्भ के अनुसार सेवक या दास हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “पृथ्वी को नष्ट करने वालों” का अनुवाद “भूमि को बरबाद या भ्रष्ट करने वालों” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἔθνη
  choice: राष्ट्र
  rationale: यहाँ संसार के सामूहिक राष्ट्र अभिप्रेत हैं; ‘गैर-यहूदी’ कहना अनावश्यक रूप से जातीय विरोध को प्रमुख बनाता।
- source_word: ὠργίσθησαν / ἡ ὀργή σου
  choice: क्रोधित हुए / तेरा प्रकोप
  rationale: दोनों सजातीय यूनानी शब्दों के संबंध को भावगत रूप से रखा गया है, जबकि ईश्वरीय न्याय के संदर्भ में ‘प्रकोप’ अधिक उपयुक्त और गरिमापूर्ण है।
- source_word: ὁ καιρός
  choice: वह समय
  rationale: निश्चित निर्णायक अवसर का भाव लेख और संदर्भ से स्पष्ट होता है; ‘वह समय’ स्वाभाविक हिंदी है।
- source_word: τῶν νεκρῶν κριθῆναι
  choice: मरे हुओं का न्याय किया जाए
  rationale: न्यायिक निष्क्रिय क्रिया और उसके व्यापक विषय को सीधे तथा स्पष्ट रूप में व्यक्त करता है।
- source_word: τὸν μισθόν
  choice: प्रतिफल
  rationale: दैवी पुरस्कार या बदले का भाव रखता है, बिना इसे मजदूरी जैसे लेन-देन तक सीमित किए।
- source_word: τοῖς δούλοις σου
  choice: तेरे सेवकों
  rationale: इस सम्मानसूचक संदर्भ में परमेश्वर की सेवा और उससे संबंध प्रमुख है; ‘दासों’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों
  rationale: परमेश्वर के लिए अलग किए गए लोगों का अर्थ स्पष्ट करता है और आधुनिक हिंदी में स्वाभाविक है।
- source_word: τοῖς φοβουμένοις τὸ ὄνομά σου
  choice: तेरे नाम का भय माननेवालों
  rationale: मूल बाइबिलीय मुहावरे और श्रद्धापूर्ण भय, दोनों को व्याख्यात्मक रूप से नरम किए बिना रखता है।
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: छोटे और बड़े सभी को
  rationale: सामाजिक प्रतिष्ठा या स्तर की पूरी परिधि को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: διαφθεῖραι τοὺς διαφθείροντας τὴν γῆν
  choice: पृथ्वी को नष्ट करनेवालों को नष्ट किया जाए
  rationale: एक ही यूनानी धातु की जानबूझकर की गई पुनरावृत्ति को बनाए रखता है; विश्वव्यापी न्याय के संदर्भ में γῆ के लिए ‘पृथ्वी’ चुना गया है।
theological_decisions:
- issue: δοῦλος द्वारा परमेश्वर के लोगों का संबोधन
  choice: सेवकों
  alternative: दासों
  rationale: यहाँ पुरस्कार पानेवाले परमेश्वर के मान्य लोगों की पहचान प्रमुख है, न कि उनकी बंधुआ स्थिति; फिर भी अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: γῆ का दायरा
  choice: पृथ्वी
  alternative: भूमि
  rationale: प्रकाशितवाक्य के व्यापक अंतकालीन न्याय के संदर्भ में ‘पृथ्वी’ अधिक उपयुक्त है, यद्यपि यूनानी शब्द ‘भूमि’ भी हो सकता है।
- issue: सूची की वाक्यरचना
  choice: ‘सेवकों’ के अंतर्गत भविष्यद्वक्ताओं, पवित्र जनों और नाम का भय माननेवालों को रखा गया
  alternative: इन समूहों को ‘सेवकों’ के समानांतर अलग-अलग वर्ग मानना
  rationale: यूनानी कारकों और संयोजकों में कुछ वाक्यरचनात्मक खुलापन है। हिंदी विराम-चिह्न सूची को सेवकों का विस्तार मानने की स्वाभाविक संभावना दिखाते हैं, पर समूहों के बीच कठोर धर्मवैज्ञानिक भेद स्थापित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। लंबे यूनानी वाक्य को एक ही प्रवाह में रखा गया है, पर डैश से पुरस्कार पानेवाले समूहों की सूची स्पष्ट की गई है। ‘आ पहुँचा’ निर्णायक समय के आगमन को स्वाभाविक हिंदी में व्यक्त करता है।
