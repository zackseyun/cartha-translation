  text: λέγοντες· Εὐχαριστοῦμέν σοι, κύριε, ὁ θεός, ὁ παντοκράτωρ, ὁ ὢν καὶ ὁ ἦν, ὅτι εἴληφας τὴν δύναμίν σου τὴν μεγάλην καὶ ἐβασίλευσας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/017.yaml
  text: saying[a], “We give thanks to you, Lord God Almighty, who is and who was[b], because you have taken your great power and begun to reign.”
translation:
  language: hi
  text: वे यह कह रहे थे, “हे सर्वशक्तिमान प्रभु परमेश्वर, जो हैं और जो थे,[a] हम आपका धन्यवाद करते हैं, क्योंकि आपने अपनी महान सामर्थ्य को ग्रहण किया है और राज्य करना आरम्भ कर दिया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में यहाँ “और जो आनेवाले हैं” भी मिलता है, और प्रकाशितवाक्य के अन्य पदों में भी यह पदबंध आता है; पर इस पद के यूनानी पाठ में ये शब्द नहीं हैं।
    reason: textual_variant
  - marker: b
    text: या “राज्य किया है” अथवा “राजत्व ग्रहण किया है।” यूनानी क्रिया राजकीय शासन के आरम्भ या उसके प्रयोग पर बल दे सकती है; यहाँ यह परमेश्वर के शासन के निर्णायक रूप से प्रकट होने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: वे कह रहे थे
  rationale: वर्तमान सक्रिय कृदन्त पिछले पद के प्राचीनों की क्रिया से इस वाणी को जोड़ता है; हिन्दी में पूर्ण उपवाक्य स्वाभाविक और स्पष्ट है।
- source_word: Εὐχαριστοῦμέν σοι
  choice: हम आपका धन्यवाद करते हैं
  rationale: यह अर्थ को सीधे व्यक्त करता है और स्वर्गीय आराधना के गरिमापूर्ण स्वर को बनाए रखता है।
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: हे सर्वशक्तिमान प्रभु परमेश्वर
  rationale: सम्बोधन और तीनों ईश्वरीय पदवियों को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: जो हैं और जो थे
  rationale: यूनानी पाठ के वर्तमान और भूतकाल को बनाए रखा गया है तथा यहाँ अनुपस्थित ‘जो आनेवाले हैं’ नहीं जोड़ा गया। परमेश्वर के लिए आदरसूचक बहुवचन हिन्दी में स्वाभाविक है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: धन्यवाद का कारण बताने वाला कारणवाचक अर्थ संदर्भ में स्पष्ट है।
- source_word: εἴληφας τὴν δύναμίν σου τὴν μεγάλην
  choice: आपने अपनी महान सामर्थ्य धारण की
  rationale: पूर्णकालीन क्रिया को सम्पन्न और वर्तमान-प्रभाव वाली कार्रवाई के रूप में रखा गया है; ‘धारण की’ उस सामर्थ्य को शासन में निर्णायक रूप से ग्रहण करने का भाव देती है, न कि पहले उसके अभाव का।
- source_word: ἐβασίλευσας
  choice: राज्य करना आरम्भ कर दिया है
  rationale: संदर्भ में क्रिया के आरम्भसूचक सम्भावित बल को व्यक्त करता है और परमेश्वर की राजसत्ता के सार्वजनिक, निर्णायक प्रकटीकरण पर ध्यान रखता है।
theological_decisions:
- issue: ईश्वरीय पदवी में ‘जो आनेवाले हैं’ का अभाव
  choice: जो हैं और जो थे
  alternative: जो हैं, जो थे और जो आनेवाले हैं
  rationale: SBLGNT में इस पद पर केवल ὁ ὢν καὶ ὁ ἦν है; प्रकाशित पाठ दूसरे पदों के सूत्र से सामंजस्य बैठाने के लिए शब्द नहीं जोड़ता।
- issue: ἐβασίλευσας और परमेश्वर के राज्य का आरम्भ
  choice: राज्य करना आरम्भ कर दिया है
  alternative: राज्य किया है / राजा हो गए हैं
  rationale: यह पाठ परमेश्वर की पहले से विद्यमान सार्वभौमिक प्रभुता का निषेध किए बिना उनके शासन के निर्णायक और प्रकट क्रियान्वयन का उत्सव मनाता है; विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण आराधनात्मक स्वर रखा गया है। परमेश्वर के सम्बोधन में ‘आप’ और आदरसूचक बहुवचन क्रियाएँ प्रयुक्त हैं। वाक्य विन्यास हिन्दी में स्वाभाविक है, जबकि यूनानी काल-सूत्र और βασιλεύω की अर्थगत सम्भावना पादटिप्पणी सहित सुरक्षित रखी गई है।
