  text: Οὗτοί εἰσιν αἱ δύο ἐλαῖαι καὶ αἱ δύο λυχνίαι αἱ ἐνώπιον τοῦ κυρίου τῆς γῆς ⸀ἑστῶτες.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/004.yaml
  text: These are the two olive trees and the two lampstands standing before the Lord of the earth[a][b].
translation:
  language: hi
  text: ये ही दो जैतून के पेड़ और दो दीपदान हैं, जो पृथ्वी के प्रभु के सामने खड़े हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह जकर्याह 4 की ओर संकेत है, जहाँ जैतून के पेड़ और दीपदान परमेश्वर द्वारा नियुक्त और उसकी आत्मा से सामर्थ्य पाए सेवकों के प्रतीक हैं।
    reason: cross_reference
  - marker: b
    text: या, “जो पृथ्वी के प्रभु के सामने खड़े रहते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτοί
  choice: ये ही
  rationale: पुल्लिंग बहुवचन संकेतवाचक सर्वनाम पहले बताए गए दो गवाहों की ओर लौटता है। ‘ये ही’ पहचान के बल को स्वाभाविक हिन्दी में व्यक्त करता है, पर मुख्य पाठ में ‘गवाह’ शब्द नहीं जोड़ता।
- source_word: ἐλαῖαι
  choice: जैतून के पेड़
  rationale: यहाँ प्रकाशितवाक्यात्मक बिंब और जकर्याह 4 की अनुगूँज के कारण पेड़ों का अर्थ अभिप्रेत है, न कि केवल जैतून के फलों का।
- source_word: λυχνίαι
  choice: दीपदान
  rationale: शब्द दीप रखने वाले आधार को दर्शाता है, स्वयं दीप को नहीं; प्रकाशितवाक्य में यह एक महत्त्वपूर्ण और बार-बार आने वाला बिंब है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह किसी की उपस्थिति में स्थित होने का भाव देता है; ‘के सामने’ संक्षिप्त, स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का श्रद्धापूर्ण पदनाम यहाँ ‘प्रभु’ है, जो संदर्भ की धर्मवैचारिक गंभीरता को बनाए रखता है।
- source_word: γῆς
  choice: पृथ्वी
  rationale: प्रकाशितवाक्य के वैश्विक संदर्भ में ‘पृथ्वी’ ‘देश’ या ‘भूमि’ से अधिक उपयुक्त है और सार्वभौम प्रभुता का भाव बनाए रखता है।
- source_word: ἑστῶτες
  choice: खड़े हैं
  rationale: पूर्णकालिक कृदंत वर्तमान स्थिर अवस्था को व्यक्त करता है। ‘खड़े हैं’ आधुनिक हिन्दी में स्वाभाविक है और व्यक्तिवाचक संबंधवाक्य की सम्भावना को भी सामने रखता है।
theological_decisions:
- issue: जकर्याह 4 के बिंब से संबंध और दो गवाहों की पहचान
  choice: ‘दो जैतून के पेड़ और दो दीपदान’ रूपक को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है।
  alternative: ‘ये दोनों गवाह उन दो जैतून के पेड़ों और दो दीपदानों के समान हैं’ जैसी व्याख्यात्मक उपमा।
  rationale: यूनानी पाठ उन्हें प्रकाशितवाक्यात्मक बिंबों द्वारा पहचानता है, केवल समानता नहीं बताता। सीधा रूपक अंतरपाठीय अनुगूँज और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: ἑστῶτες का व्याकरणिक संबंध
  choice: ‘जो ... खड़े हैं’ को दोनों व्यक्तियों/गवाहों से संबंधित स्वाभाविक संबंधवाक्य के रूप में प्रस्तुत किया गया है।
  alternative: कृदंत को निकटवर्ती ‘दीपदान’ के साथ अधिक प्रत्यक्ष रूप से जोड़ते हुए ‘पृथ्वी के प्रभु के सामने खड़े दो दीपदान’ समझना।
  rationale: मूल में पुल्लिंग बहुवचन कृदंत पहले उल्लिखित पुरुष गवाहों की ओर संकेत कर सकता है, जबकि वाक्य-संरचना बिंबों के साथ संबंध भी बनाए रखती है। मुख्य पाठ सहज अर्थ देता है और पादटिप्पणी वैकल्पिक संरचना दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबिलीय गद्य। ‘जैतून के पेड़’, ‘दीपदान’, ‘प्रभु’ और ‘पृथ्वी’ जैसे परिचित पद मूल बिंब और अंतरपाठीय संबंध बनाए रखते हैं।
