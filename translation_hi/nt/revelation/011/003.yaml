id: REV.11.3
reference: Revelation 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ δώσω τοῖς δυσὶν μάρτυσίν μου, καὶ προφητεύσουσιν ἡμέρας χιλίας διακοσίας ἑξήκοντα, ⸀περιβεβλημένοι σάκκους.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/003.yaml
  text: And I will grant to my two witnesses[a], and they will prophesy for one thousand two hundred sixty days[b], clothed in sackcloth.
translation:
  language: hi
  text: और मैं अपने दो गवाहों को दूँगा[a], और वे टाट[b] ओढ़े हुए एक हज़ार दो सौ साठ दिन तक भविष्यवाणी करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और मैं अपने दो गवाहों को दूँगा।” यूनानी पाठ यह नहीं बताता कि क्या दिया जाएगा; संदर्भ में संभवतः भविष्यवाणी करने का सामर्थ्य, अधिकार या नियुक्ति अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: टाट शोक, पश्चात्ताप और भविष्यसूचक विलाप से जुड़ा हुआ था।
    reason: cultural_note
lexical_decisions:
- source_word: δώσω
  choice: सामर्थ्य दूँगा
  rationale: मूल अर्थ ‘दूँगा’ है, पर कर्म व्यक्त नहीं किया गया। अगले उपवाक्य में भविष्यवाणी करने का कार्य इस दिए जाने के आशय की ओर संकेत करता है। ‘सामर्थ्य’ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी मूल की अपूर्णता और व्यापक सम्भावना सुरक्षित रखती है।
- source_word: τοῖς δυσὶν μάρτυσίν μου
  choice: अपने दो गवाहों को
  rationale: यह स्वाभाविक हिन्दी में स्वामित्व और संख्या दोनों को स्पष्ट रखता है; ‘गवाह’ μάρτυς के साक्ष्य देने वाले अर्थ को बनाए रखता है।
- source_word: προφητεύσουσιν
  choice: भविष्यवाणी करेंगे
  rationale: προφητεύω का स्थापित और सीधा हिन्दी समतुल्य है, जो भविष्यसूचक घोषणा के अर्थ को खुला रखता है।
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: एक हज़ार दो सौ साठ दिन तक
  rationale: कालावधि बताने वाले कर्मकारक का स्वाभाविक हिन्दी रूप ‘दिन तक’ है।
- source_word: περιβεβλημένοι
  choice: ओढ़े हुए
  rationale: पूर्ण कृदन्त वस्त्र धारण किए रहने की अवस्था दर्शाता है। ‘ओढ़े हुए’ टाट के संदर्भ में स्वाभाविक और चित्रात्मक है।
- source_word: σάκκους
  choice: टाट
  rationale: यह खुरदरे शोक-वस्त्र की पारंपरिक बाइबलीय छवि को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: δώσω का अनुक्त कर्म
  choice: मुख्य पाठ में ‘सामर्थ्य दूँगा’ कहकर निहित अर्थ व्यक्त किया गया है और पादटिप्पणी में शाब्दिक रूप दिया गया है।
  alternative: ‘मैं अपने दो गवाहों को दूँगा’ अथवा ‘मैं अपने दो गवाहों को अधिकार दूँगा।’
  rationale: यूनानी पाठ यह नहीं बताता कि क्या दिया जाएगा। अगला कथन उनके भविष्यवाणी करने को बताता है, इसलिए सामर्थ्य या दायित्व निहित हो सकता है; ‘सामर्थ्य’ ‘अधिकार’ की अपेक्षा कुछ कम संस्थागत है। पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: टाट का प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में ‘टाट’ की छवि को बिना व्याख्या के बनाए रखा गया है।
  alternative: ‘शोक के वस्त्र पहने हुए।’
  rationale: टाट शोक, पश्चात्ताप और भविष्यसूचक विलाप से जुड़ा है, पर पद इनमें से किसी एक अर्थ को स्पष्ट नहीं करता; अतः व्याख्या पादटिप्पणी में है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘अपने दो गवाहों’, ‘एक हज़ार दो सौ साठ दिन तक’ और ‘टाट ओढ़े हुए’ जैसे रूप सामान्य पाठक के लिए स्वाभाविक हैं; पादटिप्पणियाँ मूल की व्याकरणिक अस्पष्टता और सांस्कृतिक पृष्ठभूमि बनाए रखती हैं।
