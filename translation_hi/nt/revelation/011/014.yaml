source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ δευτέρα ἀπῆλθεν· ⸂ἰδοὺ ἡ οὐαὶ ἡ τρίτη⸃ ἔρχεται ταχύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/014.yaml
  text: The second woe has passed; behold[a], the third woe is coming quickly.
translation:
  language: hi
  text: दूसरी विपत्ति बीत गई। देखो, तीसरी विपत्ति शीघ्र[a] आ रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जल्द”; अथवा, “तेजी से।” यूनानी शब्द समय की निकटता या घटना की तीव्रता—दोनों पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐαί
  choice: विपत्ति
  rationale: यहाँ οὐαί एक क्रमांकित, आनेवाली विनाशकारी घटना के लिए संज्ञा के रूप में प्रयुक्त है। ‘विपत्ति’ विलाप और संकट के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है तथा ‘न्याय-दण्ड’ जैसे अधिक व्याख्यात्मक शब्द से बचती है।
- source_word: δευτέρα
  choice: दूसरी
  rationale: क्रमवाचक विशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀπῆλθεν
  choice: बीत गई
  rationale: शाब्दिक अर्थ ‘चली गई’ है, पर घटनाक्रम में उस विपत्ति के समाप्त हो जाने का भाव है; ‘बीत गई’ हिन्दी में स्वाभाविक रूप से यही पूर्णता व्यक्त करता है।
- source_word: ἰδού
  choice: देखो
  rationale: यह श्रोता का ध्यान तत्काल आगे की घोषणा पर खींचने वाला सूचक है। ‘देखो’ गम्भीर भविष्यद्वाणी-संबंधी स्वर बनाए रखते हुए आधुनिक पाठक के लिए सहज है।
- source_word: τρίτη
  choice: तीसरी
  rationale: क्रमवाचक विशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἔρχεται
  choice: आ रही है
  rationale: यूनानी वर्तमान काल की सजीवता और आगमन की आसन्न गति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘आनेवाली है’ की अपेक्षा मूल के वर्तमान रूप के अधिक निकट है।
- source_word: ταχύ
  choice: शीघ्र
  rationale: ταχύ समय की निकटता (‘जल्द’) अथवा गति/अचानकपन (‘तेजी से’) पर बल दे सकता है। ‘शीघ्र’ संक्षिप्त और गरिमापूर्ण है तथा दोनों अर्थच्छायाओं के लिए कुछ खुलापन बनाए रखता है।
theological_decisions:
- issue: अंत-समय संबंधी प्रसंग में ταχύ का अर्थ
  choice: शीघ्र
  alternative: जल्द; तेजी से
  rationale: मूल शब्द आगमन की समयगत निकटता या उसके तीव्र/अचानक घटित होने—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘शीघ्र’ इस तनाव को पूरी तरह किसी एक दिशा में तय नहीं करता, और पादटिप्पणी दोनों सम्भावनाएँ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और भविष्यद्वाणी-संबंधी शैली। ‘विपत्ति’ सामान्य पाठक के लिए बोधगम्य है और प्रकाशितवाक्य में क्रमांकित οὐαί की गंभीरता बनाए रखती है।
