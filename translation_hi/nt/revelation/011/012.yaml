  text: καὶ ⸀ἤκουσαν ⸂φωνῆς μεγάλης⸃ ἐκ τοῦ οὐρανοῦ ⸀λεγούσης αὐτοῖς· ⸀Ἀνάβατε ὧδε, καὶ ἀνέβησαν εἰς τὸν οὐρανὸν ἐν τῇ νεφέλῃ, καὶ ἐθεώρησαν αὐτοὺς οἱ ἐχθροὶ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/012.yaml
  text: And they heard a loud voice from heaven saying to them, “Come up here,” and they went up to heaven in the cloud, and their enemies watched them.
translation:
  language: hi
  text: और उन्होंने स्वर्ग से आती हुई एक ऊँची आवाज़ सुनी, जो उनसे कह रही थी, “यहाँ ऊपर आओ।” तब वे बादल में होकर स्वर्ग में चढ़ गए,[a] और उनके शत्रु उन्हें देखते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “एक बादल में होकर” भी हो सकता है। यूनानी में “उस बादल में” है; यह ईश्वरीय उपस्थिति और प्रतिष्ठित किए जाने से जुड़े बाइबलीय दृश्यों की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσαν
  choice: उन्होंने…सुनी
  rationale: ἀκούω का अओरिस्ट रूप यहाँ स्वर्गीय आवाज़ सुनने की घटना बताता है, न कि ध्यान लगाकर सुनते रहने की क्रिया।
- source_word: φωνῆς μεγάλης
  choice: एक ऊँची आवाज़
  rationale: μεγάλης यहाँ आवाज़ की प्रबलता या ऊँचे स्वर को व्यक्त करता है; आधुनिक हिन्दी में ‘ऊँची आवाज़’ स्वाभाविक और स्पष्ट है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से आती हुई
  rationale: प्रकाशितवाक्य के इस दर्शनात्मक और ईश्वरीय वाणी वाले प्रसंग में οὐρανός का अर्थ ‘स्वर्ग’ है। ‘आती हुई’ हिन्दी में स्रोत-संबंध को सहज बनाता है।
- source_word: λεγούσης αὐτοῖς
  choice: जो उनसे कह रही थी
  rationale: स्त्रीलिंग कृदन्त λεγούσης ‘आवाज़’ को विशेषित करता है और αὐτοῖς को ‘उनसे’ के रूप में स्पष्ट रखा गया है।
- source_word: Ἀνάβατε ὧδε
  choice: यहाँ ऊपर आओ
  rationale: बहुवचन अओरिस्ट आज्ञार्थक ऊपर आने का सीधा आह्वान है; ὧδε को ‘यहाँ’ से सुरक्षित रखा गया है।
- source_word: ἀνέβησαν εἰς τὸν οὐρανὸν
  choice: वे…स्वर्ग पर चढ़ गए
  rationale: ἀναβαίνω की ऊपर चढ़ने की गति और εἰς के लक्ष्य, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ νεφέλῃ
  choice: बादल में होकर
  rationale: यूनानी में निश्चित उपपद है, पर हिन्दी में ‘बादल’ बिना ‘उस’ के भी स्वाभाविक है। ‘में होकर’ आरोहण के माध्यम या परिवेश की वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: ἐθεώρησαν
  choice: देखते रहे
  rationale: θεωρέω केवल क्षणिक रूप से देखने के बजाय ध्यानपूर्वक निहारने या घटना को देखते रहने का भाव दे सकता है।
- source_word: οἱ ἐχθροὶ αὐτῶν
  choice: उनके शत्रु
  rationale: यूनानी संबंधवाचक पदबंध का सीधा, स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ἐν τῇ νεφέλῃ में बादल और संभावित ईश्वरीय उपस्थिति का संकेत
  choice: मुख्य पाठ में ‘बादल में होकर’
  alternative: ‘एक बादल में होकर’ या ‘उस बादल में होकर’
  rationale: मूल का निश्चित उपपद किसी पहचाने हुए बाइबलीय बादल—ईश्वरीय उपस्थिति और निर्दोष सिद्ध किए जाने—की प्रतिध्वनि हो सकता है, किंतु हिन्दी में ‘उस बादल’ कहना संदर्भ से अधिक निश्चितता जोड़ देगा। मुख्य पाठ स्वाभाविक रहते हुए संकेत को खुला रखता है और पादटिप्पणी विकल्प समझाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँची आवाज़’, ‘यहाँ ऊपर आओ’ और ‘देखते रहे’ सामान्य पाठक के लिए स्वाभाविक हैं। ‘बादल में होकर’ मूल की संभावित बाइबलीय प्रतिध्वनि को किसी एक व्याख्या में सीमित नहीं करता।
