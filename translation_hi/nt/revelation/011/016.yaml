id: REV.11.16
reference: Revelation 11:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ οἱ εἴκοσι τέσσαρες πρεσβύτεροι οἱ ἐνώπιον τοῦ ⸂θεοῦ καθήμενοι⸃ ἐπὶ τοὺς θρόνους αὐτῶν ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν καὶ προσεκύνησαν τῷ θεῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/016.yaml
  text: And the twenty-four elders, who were seated before God on their thrones, fell on their faces and worshiped God,
translation:
  language: hi
  text: और वे चौबीस प्राचीन, जो परमेश्वर के सामने अपने-अपने सिंहासनों पर बैठे थे, मुँह के बल गिर पड़े और परमेश्वर की आराधना की,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: प्रकाशितवाक्य में यह शब्द स्वर्गीय परिषद के उन विशिष्ट सदस्यों के लिए प्रयुक्त है जिन्हें हिन्दी बाइबल परंपरा में स्वाभाविक रूप से ‘प्राचीन’ कहा जाता है; यहाँ इसका अर्थ केवल वृद्ध पुरुष नहीं है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह परमेश्वर की उपस्थिति में उनकी स्थानगत और संबंधगत स्थिति दर्शाता है; ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: καθήμενοι
  choice: बैठे थे
  rationale: वर्तमान कृदंत उनकी उस समय जारी बैठी हुई अवस्था बताता है; हिन्दी कथन में ‘बैठे थे’ इसे सहज रूप से व्यक्त करता है।
- source_word: ἐπὶ τοὺς θρόνους αὐτῶν
  choice: अपने-अपने सिंहासनों पर
  rationale: बहुवचन व्यक्तियों और उनके सिंहासनों का वितरणात्मक संबंध हिन्दी में ‘अपने-अपने’ से स्पष्ट और स्वाभाविक होता है, बिना मूल भाव को बढ़ाए।
- source_word: ἔπεσαν ἐπὶ τὰ πρόσωπα αὐτῶν
  choice: मुँह के बल गिर पड़े
  rationale: यह पूर्ण दण्डवत की सजीव शारीरिक मुद्रा व्यक्त करता है और हिन्दी में ‘मुँह के बल गिर पड़े’ स्वाभाविक मुहावरा है।
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: कर्म का लक्ष्य परमेश्वर है और प्रसंग स्वर्गीय सिंहासन-कक्ष का है, इसलिए यहाँ धार्मिक उपासना का अर्थ प्रमुख है।
- source_word: θεῷ / θεοῦ
  choice: परमेश्वर
  rationale: θεός के लिए प्रतिष्ठित, गरिमापूर्ण और सामान्य आधुनिक हिन्दी समतुल्य।
- source_word: οἱ εἴκοσι τέσσαρες
  choice: वे चौबीस
  rationale: निश्चित पद पहले से पहचाने गए समूह की ओर संकेत करता है; हिन्दी में ‘वे चौबीस प्राचीन’ इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: स्वर्गीय आराधना के दृश्य में προσκυνέω का अर्थ
  choice: आराधना की
  alternative: दण्डवत किया / झुककर सम्मान किया
  rationale: चूँकि क्रिया स्पष्ट रूप से परमेश्वर की ओर निर्देशित है और दृश्य स्वर्गीय सिंहासन-कक्ष का है, ‘आराधना की’ उसके धार्मिक अर्थ को ठीक प्रकार व्यक्त करता है; शारीरिक दण्डवत की मुद्रा पिछली क्रिया में पहले ही स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण बाइबिलीय शैली। ‘प्राचीन’, ‘सिंहासन’ और ‘आराधना’ परिचित धार्मिक शब्द हैं। यूनानी वाक्य के प्रवाह और अंतिम अल्पविराम को बनाए रखा गया है, क्योंकि पद अगले कथन से जुड़ता है।
