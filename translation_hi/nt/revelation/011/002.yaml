source:
  edition: SBLGNT
  text: καὶ τὴν αὐλὴν τὴν ἔξωθεν τοῦ ναοῦ ἔκβαλε ⸀ἔξωθεν, καὶ μὴ αὐτὴν μετρήσῃς, ὅτι ἐδόθη τοῖς ἔθνεσιν, καὶ τὴν πόλιν τὴν ἁγίαν πατήσουσιν μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/002.yaml
  text: But leave out the court outside the temple[a], and do not measure it, because it has been given to the nations[b], and they will trample the holy city for forty-two months.
translation:
  language: hi
  text: परन्तु पवित्रस्थान के बाहर वाले आँगन को छोड़ दे[a] और उसे मत नाप, क्योंकि वह राष्ट्रों को दे दिया गया है[b], और वे पवित्र नगर को बयालीस महीने तक पैरों तले रौंदेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर के बाहर वाला आँगन।” यूनानी शब्द ναός का अर्थ अधिक विशेष रूप से “पवित्रस्थान” भी हो सकता है। “छोड़ दे” में यूनानी के उस भाव को व्यक्त किया गया है कि आँगन को मापने से बाहर रखा जाए।
    reason: ναός का व्यापक विकल्प और ἔκβαλε ἔξωθεν का सन्दर्भानुकूल बहिष्करण-भाव सुरक्षित रखना
  - marker: b
    text: या, “वह गैर-यहूदियों को दे दिया गया है।”
    reason: ἔθνεσιν का वैकल्पिक जातीय-धार्मिक अर्थ
lexical_decisions:
- source_word: αὐλή
  choice: आँगन
  rationale: मन्दिर-परिसर के प्रांगण के लिए सहज और स्पष्ट हिन्दी शब्द।
- source_word: ἔξωθεν τοῦ ναοῦ
  choice: पवित्रस्थान के बाहर वाला
  rationale: यह पदबंध आँगन को पवित्रस्थान से बाहर स्थित बताता है; ναός के अपेक्षाकृत संकुचित अर्थ को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: ναός
  choice: पवित्रस्थान
  rationale: यहाँ बाहरी आँगन से विरोध होने के कारण यह शब्द पूरे मन्दिर-परिसर की अपेक्षा उसके भीतरी पवित्रस्थान को अधिक स्वाभाविक रूप से दर्शाता है।
- source_word: ἔκβαλε ἔξωθεν
  choice: छोड़ दे
  rationale: सन्दर्भ में आशय आँगन को माप से बाहर रखने का है; शाब्दिक 'बाहर फेंक दे' हिन्दी में भ्रामक होगा।
- source_word: μὴ αὐτὴν μετρήσῃς
  choice: उसे मत नाप
  rationale: द्वितीय पुरुष एकवचन निषेधाज्ञा को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: ἐδόθη
  choice: दे दिया गया है
  rationale: कर्मवाच्य को बनाए रखते हुए अघोषित कर्ता को स्पष्ट नहीं किया गया; हिन्दी में परिणामी अवस्था भी स्वाभाविक रूप से व्यक्त होती है।
- source_word: τοῖς ἔθνεσιν
  choice: राष्ट्रों को
  rationale: ἔθνη का व्यापक सामूहिक अर्थ सुरक्षित रहता है; 'गैर-यहूदियों' का सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: πόλιν τὴν ἁγίαν
  choice: पवित्र नगर
  rationale: मूल पदबंध का प्रचलित और गरिमापूर्ण अनुवाद, बिना मुख्य पाठ में नगर की पहचान जोड़ने के।
- source_word: πατήσουσιν
  choice: पैरों तले रौंदेंगे
  rationale: क्रिया में निहित शत्रुतापूर्ण अपमान और प्रभुत्व की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μῆνας τεσσεράκοντα δύο
  choice: बयालीस महीने तक
  rationale: कालावधि सूचक कर्मकारक को हिन्दी में 'तक' के द्वारा सहज रूप से व्यक्त किया गया है।
theological_decisions:
- issue: प्रकाशितवाक्य के मन्दिर-चित्रण में ναός की विशिष्टता
  choice: मुख्य पाठ में 'पवित्रस्थान'
  alternative: मन्दिर
  rationale: बाहरी आँगन के साथ स्थानिक विरोध को देखते हुए 'पवित्रस्थान' संकुचित अर्थ को अधिक स्पष्ट रखता है; पूरे मन्दिर का अर्थ भी सम्भव होने से उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἔθνεσιν का अर्थ
  choice: राष्ट्रों को
  alternative: गैर-यहूदियों को
  rationale: यूनानी शब्द राष्ट्रों को सामान्य रूप से अथवा यहूदियों से भिन्न जातियों को सूचित कर सकता है। मुख्य पाठ व्यापक अर्थ रखता है और जातीय-धार्मिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐδόθη में अघोषित कर्ता
  choice: कर्मवाच्य बनाए रखा गया
  alternative: परमेश्वर ने दे दिया है
  rationale: मूल पाठ देने वाले का नाम नहीं बताता; सम्भावित ईश्वरीय कर्तृत्व को अनुवाद में स्पष्ट जोड़ना व्याख्यात्मक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। आज्ञा का एकवचन रूप रखा गया है। 'पैरों तले रौंदेंगे' भविष्यवाणी की तीव्रता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
