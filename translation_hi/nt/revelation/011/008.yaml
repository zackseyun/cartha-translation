id: REV.11.8
reference: Revelation 11:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὸ πτῶμα αὐτῶν ἐπὶ τῆς πλατείας τῆς πόλεως τῆς μεγάλης, ἥτις καλεῖται πνευματικῶς Σόδομα καὶ Αἴγυπτος, ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/008.yaml
  text: And their dead bodies lie in the street of the great city[a], which is spiritually called Sodom and Egypt[c][b], where also their Lord was crucified.
translation:
  language: hi
  text: और उनका शव[a] बड़े नगर की चौड़ी सड़क[b] पर पड़ा रहेगा, जिसे आत्मिक रूप से[c] सदोम और मिस्र कहा जाता है—वहीं उनके प्रभु को भी क्रूस पर चढ़ाया गया था।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘शव’ एकवचन है, यद्यपि यह दोनों गवाहों की ओर संकेत करता है; कुछ अनुवादों में इसे बहुवचन, ‘उनके शव,’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: या ‘सार्वजनिक चौक में’।
    reason: lexical_alternative
  - marker: c
    text: या ‘लाक्षणिक रूप से’ अथवा ‘प्रतीकात्मक रूप से’।
    reason: lexical_alternative
  - marker: d
    text: ‘जहाँ उनके प्रभु को भी क्रूस पर चढ़ाया गया था’ यरूशलेम की ओर संकेत करता है, पर मूल पाठ प्रतीकात्मक पदनाम ‘बड़ा नगर’ को बनाए रखता है।
    reason: cross_reference
lexical_decisions:
- source_word: τὸ πτῶμα αὐτῶν
  choice: उनका शव
  rationale: πτῶμα मृत देह या शव को सूचित करता है। यूनानी में संज्ञा एकवचन है, यद्यपि αὐτῶν बहुवचन है और दो गवाहों की ओर संकेत करता है; इसलिए सामूहिक एकवचन को बनाए रखा गया है।
- source_word: ἐπὶ τῆς πλατείας
  choice: चौड़ी सड़क पर
  rationale: πλατεῖα नगर की चौड़ी सड़क या सार्वजनिक चौक हो सकता है। 'चौड़ी सड़क' शब्द की मूल छवि को रखता है और प्रसंग में स्वाभाविक है; 'सार्वजनिक चौक' को पादटिप्पणी में रखा गया है।
- source_word: τῆς πόλεως τῆς μεγάλης
  choice: उस बड़े नगर
  rationale: प्रकाशितवाक्य में 'बड़ा नगर' एक महत्त्वपूर्ण प्रतीकात्मक पदनाम है; अनुवाद उसकी पहचान को मुख्य पाठ में स्पष्ट करके प्रतीकात्मक तनाव को समाप्त नहीं करता।
- source_word: πνευματικῶς
  choice: आत्मिक रीति से
  rationale: यह यूनानी क्रियाविशेषण का सीधा अर्थ रखता है और नगर के नामों की आत्मिक अथवा प्रतीकात्मक प्रकृति को व्यक्त करता है। अधिक व्याख्यात्मक 'लाक्षणिक रूप से' पादटिप्पणी में दिया गया है।
- source_word: Σόδομα καὶ Αἴγυπτος
  choice: सदोम और मिस्र
  rationale: इन स्थान-नामों को प्रचलित हिन्दी बाइबलीय रूपों में दिया गया है, बिना उनके प्रतीकात्मक आशयों को मुख्य पाठ में खोलकर बताने के।
- source_word: ὅπου καὶ ὁ κύριος αὐτῶν ἐσταυρώθη
  choice: वहीं उनके प्रभु को भी क्रूस पर चढ़ाया गया था
  rationale: ὅπου का स्थान-संबंध 'वहीं' से और καί का योगात्मक बल 'भी' से व्यक्त होता है। κύριος के लिए धर्मवैज्ञानिक रूप से महत्त्वपूर्ण 'प्रभु' तथा ἐσταυρώθη के लिए मानक कर्मवाच्य प्रयोग किया गया है।
theological_decisions:
- issue: दो गवाहों के लिए एकवचन πτῶμα
  choice: '''उनका शव'' कहकर सामूहिक एकवचन बनाए रखना'
  alternative: '''उनके शव'''
  rationale: मूल पाठ दो व्यक्तियों की ओर संकेत करने वाले बहुवचन सर्वनाम के साथ एकवचन संज्ञा रखता है। हिन्दी में यह कुछ असामान्य होते हुए भी समझ में आता है और दोनों गवाहों को एक इकाई के रूप में प्रस्तुत करने वाली वाक्पद्धति को सुरक्षित रखता है।
- issue: πνευματικῶς का अर्थ
  choice: '''आत्मिक रीति से'''
  alternative: '''लाक्षणिक रूप से'' या ''प्रतीकात्मक रूप से'''
  rationale: सीधा शब्दार्थ मुख्य पाठ में रखा गया है, ताकि आत्मिक और प्रतीकात्मक अर्थों के बीच की वास्तविक व्यापकता को चुपचाप सीमित न किया जाए।
- issue: '''बड़े नगर'' की पहचान'
  choice: मुख्य पाठ में पहचान को अप्रकट रखना
  alternative: इसे स्पष्ट रूप से 'यरूशलेम' कहना
  rationale: प्रभु के क्रूस पर चढ़ाए जाने का उल्लेख यरूशलेम की ओर संकेत करता है, पर मूल पाठ नगर को 'बड़ा नगर' कहता और सदोम तथा मिस्र के प्रतीकात्मक नाम देता है। इसलिए व्याख्यात्मक पहचान केवल पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। 'शव', 'बड़ा नगर', 'आत्मिक रीति से' और 'प्रभु' मूल की गंभीर एवं प्रकाशनात्मक शैली को बनाए रखते हैं। दीर्घ वाक्य को डैश से हल्का विभाजन दिया गया है, बिना मूल संबंधों को बदले।
