id: REV.11.5
reference: Revelation 11:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἴ τις αὐτοὺς θέλει ἀδικῆσαι, πῦρ ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν καὶ κατεσθίει τοὺς ἐχθροὺς αὐτῶν· καὶ εἴ τις ⸂θελήσῃ αὐτοὺς⸃ ἀδικῆσαι, οὕτως δεῖ αὐτὸν ἀποκτανθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/005.yaml
  text: And if anyone wants to harm them[a], fire comes out of their mouth and devours their enemies; and if anyone should want to harm them, in this way he must be killed.
translation:
  language: hi
  text: और यदि कोई उन्हें हानि पहुँचाना चाहता है, तो उनके मुँह[a] से आग निकलती है और उनके शत्रुओं को भस्म कर देती है; और यदि कोई उन्हें हानि पहुँचाना चाहे, तो उसे इसी प्रकार मार डाला जाना ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके मुँहों से।’ यूनानी में शब्दशः एकवचन ‘उनके मुँह से’ है, जबकि स्वामीसूचक शब्द ‘उनके’ बहुवचन है।
    reason: मूल यूनानी में एकवचन संज्ञा और बहुवचन स्वामी के असामान्य मेल को स्पष्ट करना।
lexical_decisions:
- source_word: ἀδικῆσαι
  choice: हानि पहुँचाना
  rationale: इस प्रलयदर्शी प्रसंग में यह क्रिया दोनों गवाहों के विरुद्ध शत्रुतापूर्ण कार्रवाई को व्यक्त करती है। ‘हानि पहुँचाना’ स्वाभाविक है और किसी विशिष्ट आक्रमण-विधि को नहीं जोड़ता।
- source_word: πῦρ
  choice: आग
  rationale: मूल पाठ की सजीव और ठोस छवि को बिना रूपकात्मक व्याख्या जोड़े यथावत रखा गया है।
- source_word: ἐκπορεύεται ἐκ τοῦ στόματος αὐτῶν
  choice: उनके मुँह से आग निकलती है
  rationale: यह यूनानी के एकवचन ‘मुँह’ और बहुवचन स्वामी को निकटता से दर्शाता है। हिंदी में यह अभिव्यक्ति स्वाभाविक भी है; संभावित बहुवचन अर्थ पादटिप्पणी में बताया गया है।
- source_word: κατεσθίει
  choice: भस्म कर देती है
  rationale: आग के कर्ता होने पर ‘भस्म कर देना’ विनाशकारी अर्थ को सजीव और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐχθροὺς
  choice: शत्रुओं
  rationale: यह विरोधी और वैरी लोगों के लिए स्पष्ट, मानक और गरिमापूर्ण हिंदी शब्द है।
- source_word: θέλει / θελήσῃ
  choice: चाहता है / चाहे
  rationale: पहली वर्तमान सूचक क्रिया को ‘चाहता है’ और दूसरी संभावनार्थक सब्जंक्टिव को ‘चाहे’ देकर दोनों शर्तवाचक कथनों का सूक्ष्म अंतर रखा गया है।
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पहले बताई गई मृत्यु की रीति की ओर स्पष्ट रूप से संकेत करता है।
- source_word: δεῖ
  choice: मारा जाना ही है
  rationale: ‘ही है’ अनिवार्यता को स्वाभाविक हिंदी में व्यक्त करता है, बिना उसके स्रोत को अतिरिक्त रूप से ‘ईश्वरीय’ कहे।
- source_word: ἀποκτανθῆναι
  choice: मारा जाना
  rationale: यह यूनानी के कर्मवाच्य भाव को सीधे, आधुनिक और गैर-पुरातन हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: मुँह से निकलने वाली आग को शाब्दिक छवि के रूप में रखना या उसका अर्थ खोलकर बताना
  choice: मुख्य पाठ में ‘उनके मुँह से आग निकलती है’ की छवि को ज्यों का त्यों रखा गया है।
  alternative: इसे न्याय घोषित करने वाले वचन या उनसे निकलने वाले विनाशकारी न्याय के रूप में व्याख्यायित करना।
  rationale: प्रकाशितवाक्य की छवि प्रतीकात्मक हो सकती है, पर मूल यूनानी उसे आग के रूप में प्रस्तुत करता है। अनुवाद में यह तय नहीं किया गया कि उसे शाब्दिक माना जाए या प्रतीकात्मक।
- issue: δεῖ में व्यक्त अनिवार्यता का स्वरूप
  choice: ‘मारा जाना ही है’ द्वारा अनिवार्यता व्यक्त की गई है।
  alternative: ‘निश्चित रूप से मारा जाएगा’ कहकर इसे केवल भविष्यवाणी या निश्चित परिणाम के रूप में प्रस्तुत करना।
  rationale: δεῖ आवश्यकता या अनिवार्यता व्यक्त करता है। चुना गया रूप उस बल को रखता है, पर यह नहीं जोड़ता कि अनिवार्यता का सटीक धर्मवैज्ञानिक आधार क्या है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भस्म कर देती है’ आग के प्रसंग में ‘खा जाती है’ की अपेक्षा अधिक स्वाभाविक है, फिर भी κατεσθίει की तीव्र विनाशकारी शक्ति बनाए रखती है। अर्धविराम दोनों समानांतर शर्तवाचक कथनों को स्पष्ट रूप से अलग करता है।
