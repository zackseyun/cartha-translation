id: REV.11.13
reference: Revelation 11:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐν ἐκείνῃ τῇ ⸀ὥρᾳ ἐγένετο σεισμὸς μέγας, καὶ τὸ δέκατον τῆς πόλεως ἔπεσεν, καὶ ἀπεκτάνθησαν ἐν τῷ σεισμῷ ὀνόματα ἀνθρώπων χιλιάδες ἑπτά, καὶ οἱ λοιποὶ ἔμφοβοι ἐγένοντο καὶ ἔδωκαν δόξαν τῷ θεῷ τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/013.yaml
  text: And in that hour there was a great earthquake[a], and a tenth of the city fell, and seven thousand people were killed in the earthquake, and the rest became terrified and gave glory to the God of heaven.
translation:
  language: hi
  text: और उसी घड़ी एक बड़ा भूकंप आया, और नगर का दसवाँ भाग गिर पड़ा। उस भूकंप में सात हज़ार लोग[a] मारे गए। शेष लोग बहुत डर गए और उन्होंने स्वर्ग के परमेश्वर की महिमा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मनुष्यों के नाम—सात हज़ार”; यह गिने गए व्यक्तियों के लिए प्रयुक्त अभिव्यक्ति है।
    reason: मूल की उल्लेखनीय मुहावरेदार अभिव्यक्ति को सुरक्षित करना।
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह अभिव्यक्ति मूल की सजीव तात्कालिकता को बनाए रखती है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐγένετο σεισμὸς μέγας
  choice: एक बड़ा भूकंप आया
  rationale: हिन्दी में भूकंप के घटित होने के लिए ‘आया’ सहज है; ‘बड़ा’ μέγας का सीधा और कम व्याख्यात्मक रूप है।
- source_word: τὸ δέκατον τῆς πόλεως
  choice: नगर का दसवाँ भाग
  rationale: यह अंशवाचक यूनानी संरचना और उसकी संख्यात्मक विशिष्टता को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἔπεσεν
  choice: गिर पड़ा
  rationale: यह मूल क्रिया ‘गिरा’ को बनाए रखता है और ‘ढह गया’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ता।
- source_word: ἀπεκτάνθησαν
  choice: मारे गए
  rationale: यह कर्मवाच्य अर्थ को वर्तमान, स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ὀνόματα ἀνθρώπων
  choice: लोग
  rationale: शाब्दिक ‘मनुष्यों के नाम’ यहाँ गिने हुए व्यक्तियों के लिए प्रयुक्त मुहावरा है; मुख्य पाठ में अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: χιλιάδες ἑπτά
  choice: सात हज़ार
  rationale: यह हिन्दी की मानक संख्यात्मक अभिव्यक्ति है।
- source_word: οἱ λοιποὶ
  choice: शेष लोग
  rationale: यह ‘बाकी बचे हुए’ का सीधा अर्थ देता है और ‘जीवित बचे लोग’ जैसी प्रसंगाधारित व्याख्या को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ἔμφοβοι ἐγένοντο
  choice: बहुत डर गए
  rationale: यह भय की तीव्रता और भयभीत हो जाने के आरंभिक भाव, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔδωκαν δόξαν
  choice: महिमा की
  rationale: हिन्दी बाइबलीय प्रयोग में यह मूल मुहावरे ‘महिमा दी’ का स्वाभाविक अर्थ व्यक्त करता है, बिना प्रतिक्रिया की आत्मिक प्रकृति तय किए।
- source_word: τῷ θεῷ τοῦ οὐρανοῦ
  choice: स्वर्ग के परमेश्वर की
  rationale: यह संबंधकारक उपाधि को सुरक्षित रखता है और स्थापित, सुबोध हिन्दी प्रयोग है।
theological_decisions:
- issue: क्या शेष लोगों की प्रतिक्रिया को स्पष्ट पश्चाताप या उद्धारकारी विश्वास माना जाए
  choice: ‘बहुत डर गए और उन्होंने स्वर्ग के परमेश्वर की महिमा की’ के रूप में तटस्थ प्रस्तुति
  alternative: इसे सच्चा पश्चाताप कहना, या केवल भयवश परमेश्वर की शक्ति स्वीकार करना
  rationale: यूनानी पाठ भय और परमेश्वर को महिमा देने की बात कहता है, पर प्रतिक्रिया की भीतरी आत्मिक गुणवत्ता स्पष्ट नहीं करता; इसलिए अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्यों को हिन्दी की स्वाभाविक पठनीयता के लिए विभाजित किया गया है, जबकि मूल का घटनाक्रम और संबंध सुरक्षित है।
