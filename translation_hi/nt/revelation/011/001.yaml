  text: Καὶ ἐδόθη μοι κάλαμος ὅμοιος ῥάβδῳ, λέγων· ⸀Ἔγειρε καὶ μέτρησον τὸν ναὸν τοῦ θεοῦ καὶ τὸ θυσιαστήριον καὶ τοὺς προσκυνοῦντας ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/001.yaml
  text: And I was given a reed like a rod[a], saying, “Rise and measure the temple of God and the altar and those who worship in it.”
translation:
  language: hi
  text: और मुझे छड़ी के समान एक सरकंडा दिया गया। कहा गया, “उठो और परमेश्वर के मंदिर[a], वेदी और उसमें आराधना करने वालों को नापो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के पवित्रस्थान”; यूनानी शब्द ναός पूरे मंदिर-परिसर के बजाय विशेष रूप से मंदिर के भीतरी पवित्रस्थान को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη μοι
  choice: मुझे ... दिया गया
  rationale: यूनानी कर्मवाच्य को बनाए रखता है और देनेवाले की पहचान नहीं जोड़ता।
- source_word: κάλαμος
  choice: सरकंडा
  rationale: शब्द का मूल अर्थ ‘सरकंडा’ है; मापने के आदेश से उसका प्रयोजन स्पष्ट होता है, इसलिए मुख्य पाठ में पहले से ‘नापने की छड़ी’ नहीं कहा गया।
- source_word: ὅμοιος ῥάβδῳ
  choice: छड़ी के समान
  rationale: तुलना को सीधे व्यक्त करता है और सरकंडे तथा छड़ी को अलग-अलग बनाए रखता है।
- source_word: λέγων
  choice: यह कहते हुए
  rationale: यूनानी कृदन्त की कुछ असामान्य और अस्पष्ट रचना को यथासंभव सुरक्षित रखता है; वक्ता के रूप में किसी स्वर्गदूत या वाणी को नहीं जोड़ता।
- source_word: Ἔγειρε
  choice: उठो
  rationale: आज्ञार्थक रूप का संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी रूप।
- source_word: μέτρησον
  choice: नापो
  rationale: माप लेने की प्रत्यक्ष आज्ञा का सामान्य हिन्दी रूप।
- source_word: ναὸν τοῦ θεοῦ
  choice: परमेश्वर के मंदिर
  rationale: ναός का सहज हिन्दी अनुवाद; उसके अधिक विशिष्ट अर्थ ‘पवित्रस्थान’ को पादटिप्पणी में रखा गया है।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: θυσιαστήριον का मानक हिन्दी रूप; पाठ यह निर्धारित नहीं करता कि कौन-सी वेदी अभिप्रेत है।
- source_word: τοὺς προσκυνοῦντας
  choice: आराधना करनेवालों
  rationale: कृदन्त की क्रियात्मकता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: सर्वनाम का सबसे स्वाभाविक संबंध मंदिर से है और स्थानगत अर्थ स्पष्ट रहता है।
theological_decisions:
- issue: प्रकाशितवाक्य के दर्शन में ναός का आशय
  choice: परमेश्वर का मंदिर
  alternative: परमेश्वर का पवित्रस्थान
  rationale: पद स्वयं यह तय नहीं करता कि यह पृथ्वी का वास्तविक मंदिर, स्वर्गीय पवित्रस्थान या परमेश्वर के लोगों का प्रतीक है; इसलिए मुख्य पाठ किसी एक युगान्त-विषयक व्याख्या को नहीं थोपता।
- issue: λέγων में निहित वक्ता की पहचान
  choice: वक्ता को अनिर्दिष्ट रखना
  alternative: ‘एक स्वर्गदूत ने कहा’ या ‘एक वाणी ने कहा’
  rationale: यूनानी पाठ वक्ता को स्पष्ट रूप से नहीं पहचानता; किसी स्वर्गदूत या वाणी को जोड़ना मूल से आगे की व्याख्या होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यह कहते हुए’ हिन्दी में कुछ असामान्य जान पड़ सकता है, पर यह मूल यूनानी की आकस्मिक रचना और वक्ता की अस्पष्टता को बिना अतिरिक्त पात्र जोड़े सुरक्षित रखता है।
