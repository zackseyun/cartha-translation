language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτοι ἔχουσιν ⸂τὴν ἐξουσίαν κλεῖσαι τὸν οὐρανόν⸃, ἵνα μὴ ὑετὸς βρέχῃ τὰς ἡμέρας τῆς προφητείας αὐτῶν, καὶ ἐξουσίαν ἔχουσιν ἐπὶ τῶν ὑδάτων στρέφειν αὐτὰ εἰς αἷμα καὶ πατάξαι τὴν γῆν ⸂ἐν πάσῃ πληγῇ ὁσάκις ἐὰν θελήσωσιν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/006.yaml
  text: These have the authority to shut the sky so that no rain may fall during the days of their prophecy[a], and they have authority over the waters to turn them into blood and to strike the earth with every plague as often as they wish.
translation:
  language: hi
  text: इनके पास आकाश को बन्द कर देने का अधिकार है, ताकि इनके भविष्यवाणी करने के दिनों में वर्षा न हो[a]। और इनके पास जलराशियों को लहू में बदलने और जब-जब चाहें, पृथ्वी पर हर विपत्ति लाने का अधिकार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग को बन्द कर देने का अधिकार है।” यूनानी शब्द οὐρανός का अर्थ ‘स्वर्ग’ या ‘आकाश’ दोनों हो सकता है; यहाँ वर्षा का सन्दर्भ होने के कारण ‘आकाश’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: इन्हें
  rationale: सन्दर्भ के दो गवाहों की ओर संकेत करता है; यूनानी में इस पद पर संख्या दोबारा नहीं दी गई, इसलिए ‘इन दोनों’ नहीं जोड़ा गया।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि प्रदान किए गए अधिकार या कार्यक्षेत्र को व्यक्त करता है।
- source_word: κλεῖσαι τὸν οὐρανόν
  choice: आकाश को बन्द कर देने
  rationale: वर्षा रोकने के निकट सन्दर्भ में οὐρανός का स्वाभाविक अर्थ ‘आकाश’ है; ‘स्वर्ग’ सम्भव वैकल्पिक अर्थ है।
- source_word: ἵνα μὴ ὑετὸς βρέχῃ
  choice: ताकि ... वर्षा न हो
  rationale: उद्देश्य/परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना यूनानी संज्ञा और क्रिया की अनावश्यक पुनरावृत्ति के।
- source_word: τὰς ἡμέρας τῆς προφητείας αὐτῶν
  choice: इनके भविष्यवाणी करने के दिनों में
  rationale: सम्बन्धकारक पदबंध को समयावधि के अर्थ में स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: ἐπὶ τῶν ὑδάτων
  choice: जलराशियों पर
  rationale: बहुवचन ὑδάτων तथा अधिकार के कार्यक्षेत्र—दोनों को हिन्दी में बनाए रखता है।
- source_word: στρέφειν αὐτὰ εἰς αἷμα
  choice: उन्हें लहू में बदल दें
  rationale: रूपान्तरण की प्रत्यक्ष छवि को बनाए रखने वाला सहज अनुवाद है।
- source_word: πατάξαι τὴν γῆν ἐν πάσῃ πληγῇ
  choice: पृथ्वी पर हर प्रकार की महामारी लाएँ
  rationale: πατάσσω और करणवाचक ἐν का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; πληγή यहाँ दैवी विपत्ति/महामारी के अर्थ में है, न कि केवल शारीरिक घाव।
- source_word: ὁσάκις ἐὰν θελήσωσιν
  choice: जब-जब चाहें
  rationale: बार-बार सम्भव होने और उनकी इच्छा पर निर्भरता—दोनों को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: दो गवाहों के कार्यों में एलिय्याह और मूसा से जुड़ी संकेतात्मक छवियाँ
  choice: चमत्कारी कार्यों को प्रत्यक्ष अपोकैलिप्टिक भाषा में रखा गया है।
  alternative: अनुवाद में ही इन कार्यों को केवल प्रतीकात्मक घोषित करना।
  rationale: मूल पाठ यह निर्धारित नहीं करता कि इन कार्यों को केवल शाब्दिक, केवल प्रतीकात्मक, या दोनों रूपों में समझा जाए; अनुवाद इस तनाव को खुला रखता है।
- issue: गवाहों के अधिकार का स्वरूप
  choice: ἐξουσία को ‘अधिकार’ कहा गया है।
  alternative: ‘शक्ति’ या ‘सामर्थ्य’।
  rationale: ‘अधिकार’ सौंपे गए कार्यक्षेत्र का भाव बनाए रखता है और इसे मात्र अंतर्निहित क्षमता में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘बन्द’, ‘वर्षा’, ‘भविष्यवाणी’, ‘जलराशियाँ’ और ‘पृथ्वी’ जैसे शब्द प्रकाशन-योग्य बाइबलीय रजिस्टर बनाए रखते हैं।
