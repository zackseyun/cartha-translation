id: REV.11.7
reference: Revelation 11:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὅταν τελέσωσιν τὴν μαρτυρίαν αὐτῶν, τὸ θηρίον τὸ ἀναβαῖνον ἐκ τῆς ἀβύσσου ποιήσει μετ’ αὐτῶν πόλεμον καὶ νικήσει αὐτοὺς καὶ ἀποκτενεῖ αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/007.yaml
  text: And when they finish their testimony[a], the beast that comes up out of the abyss will make war with them and conquer them and kill them.
translation:
  language: hi
  text: और जब वे अपनी गवाही पूरी कर लेंगे, तब वह पशु, जो अथाह गर्त से ऊपर आता है, उनके साथ युद्ध करेगा[a], उन पर विजय पाएगा और उन्हें मार डालेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विरुद्ध युद्ध करेगा।”
    reason: ποιήσει μετ’ αὐτῶν πόλεμον में μετά का शाब्दिक रूप ‘साथ’ है, जबकि मुहावरे का संदर्भगत अर्थ ‘विरुद्ध’ है।
lexical_decisions:
- source_word: τελέσωσιν
  choice: पूरी कर लेंगे
  rationale: ὅταν के साथ अओरिस्ट सबजंक्टिव भावी परिस्थिति व्यक्त करता है। ‘पूरी कर लेंगे’ सहज हिन्दी में गवाही के पूर्ण होने का अर्थ सुरक्षित रखता है।
- source_word: μαρτυρίαν
  choice: गवाही
  rationale: ‘गवाही’ आधुनिक हिन्दी में साक्ष्य देने और अपने विश्वास की घोषणा—दोनों से जुड़ा अर्थ स्वाभाविक रूप से व्यक्त करती है।
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य के प्रतीकात्मक संदर्भ में यह θηρίον का स्पष्ट और प्रचलित हिन्दी समतुल्य है; ‘जंगली पशु’ यहाँ अनावश्यक रूप से भारी होगा।
- source_word: ἀναβαῖνον
  choice: ऊपर आता है
  rationale: वर्तमान कृदंत को संबंधवाचक उपवाक्य के रूप में रखा गया है, जिससे यूनानी का सजीव वर्तमान भाव और स्वाभाविक हिन्दी दोनों बने रहते हैं।
- source_word: ἀβύσσου
  choice: अथाह गर्त
  rationale: यह ἄβυσσος की गहराई और अगाधता को निकटता से व्यक्त करता है, बिना ‘तलहीन कुण्ड’ जैसी अधिक व्याख्यात्मक शब्दावली थोपे।
- source_word: ποιήσει μετ’ αὐτῶν πόλεμον
  choice: उनके साथ युद्ध करेगा
  rationale: यह μετά के ‘साथ’ वाले रूप को सुरक्षित रखता है। आगे ‘विजय पाएगा’ और ‘मार डालेगा’ से विरोध का आशय स्पष्ट हो जाता है; अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: νικήσει
  choice: उन पर विजय पाएगा
  rationale: यह प्रकाशितवाक्य में νικάω के संघर्ष और विजय संबंधी अर्थ को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀποκτενεῖ
  choice: उन्हें मार डालेगा
  rationale: यह क्रिया के प्रत्यक्ष और घातक अर्थ को स्पष्ट, सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ποιήσει μετ’ αὐτῶν πόλεμον में विरोधी संबंध का अनुवाद
  choice: उनके साथ युद्ध करेगा
  alternative: उनके विरुद्ध युद्ध करेगा
  rationale: यूनानी में μετά + संबंधकारक का शाब्दिक भाव ‘उनके साथ’ है। अगले दो क्रियापद शत्रुतापूर्ण संबंध स्पष्ट करते हैं। मुख्य पाठ स्रोत की संरचना रखता है और पादटिप्पणी स्पष्ट अर्थगत विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की भविष्यकालीन क्रमबद्धता और प्रकाशितवाक्य की संघर्षपूर्ण प्रतीकात्मक छवि सुरक्षित है। पादटिप्पणी का संकेत उसी युद्ध-वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
