id: REV.11.15
reference: Revelation 11:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἄγγελος ἐσάλπισεν· καὶ ἐγένοντο φωναὶ μεγάλαι ἐν τῷ οὐρανῷ ⸀λέγοντες· Ἐγένετο ἡ βασιλεία τοῦ κόσμου τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ, καὶ βασιλεύσει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/011/015.yaml
  text: And the seventh angel sounded his trumpet[a], and there were loud voices in heaven, saying, “The kingdom of the world has become that of our Lord and of his Messiah[c][b], and he will reign forever and ever.”
translation:
  language: hi
  text: 'और सातवें स्वर्गदूत ने तुरही फूँकी। तब स्वर्ग में ऊँची आवाज़ें सुनाई दीं: “संसार का राज्य[a] हमारे प्रभु और उसके मसीह[b] का हो गया है, और वह युगों-युगों तक[c] राज्य करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘संसार के राज्य’ या ‘इस संसार का राज्य’ है। SBLGNT के पाठ में एकवचन ‘संसार का राज्य’ है।
    reason: textual_variant
  - marker: b
    text: या ‘उसके ख्रीस्त का।’ यूनानी Χριστός यहाँ एक उपाधि है, इसलिए मुख्य पाठ में ‘मसीह’ किया गया है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से ‘युगों के युगों तक’ है; यह कभी समाप्त न होने वाली अवधि का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: क्रिया σαλπίζω का अर्थ तुरही बजाना या फूँकना है। हिन्दी में ‘तुरही फूँकी’ स्वाभाविक है और क्रिया में निहित वाद्य को स्पष्ट करता है।
- source_word: φωναὶ μεγάλαι
  choice: ऊँचे स्वर
  rationale: λέγοντες के कारण यहाँ समझ में आने वाले बोलने वाले स्वर अभिप्रेत हैं। ‘ऊँचे स्वर’ μεγάλαι की ध्वनि-तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: प्रकाशितवाक्य के इस प्रसंग में οὐρανός आकाश नहीं, स्वर्गीय लोक को दर्शाता है।
- source_word: Ἐγένετο ἡ βασιλεία τοῦ κόσμου
  choice: संसार का राज्य ... का हो गया है
  rationale: SBLGNT में βασιλεία एकवचन है। ‘हो गया है’ घोषणा में निहित पूर्ण हो चुकी वर्तमान स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ κυρίου ἡμῶν καὶ τοῦ χριστοῦ αὐτοῦ
  choice: हमारे प्रभु और उसके मसीह का
  rationale: दोनों संबंधकारक पद राज्य के अधिकार या स्वामित्व को बताते हैं। Χριστός यहाँ उपाधि है, इसलिए ‘मसीह’ उपयुक्त है।
- source_word: καὶ βασιλεύσει
  choice: और वह ... राज्य करेगा
  rationale: यूनानी क्रिया एकवचन है। एकवचन ‘वह’ उसी रूप को बनाए रखता है और उसके पूर्वपद को यूनानी से अधिक स्पष्ट करके धर्मवैचारिक तनाव को समाप्त नहीं करता।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह यूनानी मुहावरा अनन्त अवधि बताता है। ‘युगानुयुग’ गरिमापूर्ण, संक्षिप्त और हिन्दी बाइबिलीय प्रयोग में सुबोध समतुल्य है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός परमेश्वर से संबंधित एक उपाधि के रूप में प्रयुक्त है (‘उसका मसीह’), इसलिए अर्थसूचक ‘मसीह’ नाम-जैसे लिप्यंतरण से अधिक उपयुक्त है।
- issue: βασιλεύσει का कर्ता
  choice: वह राज्य करेगा
  alternative: वे राज्य करेंगे / प्रभु और उसका मसीह राज्य करेंगे
  rationale: यूनानी भविष्यकालीन क्रिया एकवचन है। अनुवाद एकवचन को सुरक्षित रखता है और यह तय नहीं करता कि संक्षिप्त घोषणा में कर्ता का सटीक पूर्वपद कौन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक वाचन के अनुकूल रखी गई है। ‘ऊँचे स्वर गूँज उठे’ मूल के ‘बड़े स्वर हुए’ का स्वाभाविक हिन्दी रूप है। ‘वह’ के एकवचन से यूनानी व्याकरण सुरक्षित रहता है और उसके संकेत को अनावश्यक रूप से नहीं सुलझाया गया है।
