id: REV.19.16
reference: Revelation 19:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔχει ἐπὶ τὸ ἱμάτιον καὶ ἐπὶ τὸν μηρὸν αὐτοῦ ὄνομα γεγραμμένον· Βασιλεὺς βασιλέων καὶ κύριος κυρίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/016.yaml
  text: 'And he has a name written on his robe and on his thigh: King of kings and Lord of lords[a].'
translation:
  language: hi
  text: 'और उसके वस्त्र पर और उसकी जाँघ पर यह नाम लिखा है: “राजाओं का राजा और प्रभुओं का प्रभु।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχει
  choice: है
  rationale: वर्तमान काल के दर्शनात्मक, सजीव वर्णन को साधारण वर्तमान से रखा गया है; हिंदी वाक्य में ‘नाम लिखा है’ स्वाभाविक रूप से उसके पास/उस पर होने का भाव व्यक्त करता है।
- source_word: ἐπὶ τὸ ἱμάτιον
  choice: उसके वस्त्र पर
  rationale: ἱμάτιον के लिए ‘वस्त्र’ सहज और पर्याप्त व्यापक है। संदर्भ और समानांतर ‘उसकी जाँघ’ के आधार पर संबंधसूचक ‘उसके’ स्पष्ट किया गया है।
- source_word: ἐπὶ τὸν μηρὸν αὐτοῦ
  choice: उसकी जाँघ पर
  rationale: μηρός का सीधा अर्थ ‘जाँघ’ है। दूसरे स्थान को बिना व्याख्यात्मक सामंजस्य के यथावत रखा गया है।
- source_word: ὄνομα γεγραμμένον
  choice: यह नाम लिखा है
  rationale: γεγραμμένον की पूर्ण निष्पन्न अवस्था को ‘लिखा है’ स्वाभाविक ढंग से व्यक्त करता है। हिंदी में आगे आने वाले नाम को प्रस्तुत करने के लिए ‘यह’ जोड़ा गया है, पर ‘अंकित’ जैसी अधिक विशिष्ट धारणा नहीं जोड़ी गई।
- source_word: Βασιλεὺς βασιλέων
  choice: राजाओं का राजा
  rationale: संबंधकारक से बने सर्वोच्चता-सूचक राजकीय पद को शाब्दिक और प्रचलित रूप में सुरक्षित रखा गया है।
- source_word: κύριος κυρίων
  choice: प्रभुओं का प्रभु
  rationale: κύριος के पदवीगत अर्थ के लिए ‘प्रभु’ रखा गया है और समान संबंधकारक संरचना को सुरक्षित रखा गया है।
theological_decisions:
- issue: पदवी को व्याख्यात्मक सर्वोच्चता-सूचक वाक्यांश में बदलना या मूल राजकीय रूप बनाए रखना
  choice: “राजाओं का राजा और प्रभुओं का प्रभु”
  alternative: “सर्वोच्च राजा और सर्वोच्च प्रभु”
  rationale: मूल यूनानी स्पष्ट नाम/पदवी देता है। शाब्दिक संरचना उसकी राजकीय और मसीह-संबंधी शक्ति को बिना अतिरिक्त व्याख्या के बनाए रखती है।
- issue: ‘वस्त्र पर और जाँघ पर’ के दो स्थानों का संबंध
  choice: दोनों स्थानों को अलग-अलग और सीधे अनूदित किया गया है।
  alternative: “उसके वस्त्र पर, अर्थात् जाँघ को ढकने वाले भाग पर”
  rationale: मूल पाठ में ἐπί वाले दो समानांतर पदबंध हैं। उनका दृश्यात्मक संबंध अस्पष्ट है, इसलिए अनुवाद उसे समझाकर या मिलाकर निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य-पाठक-सुलभ रूप। ‘पर’ वर्तमान हिंदी में स्वाभाविक है; ‘ऊपर’ अनावश्यक रूप से स्थानिक बल बढ़ाता। उद्धरण-चिह्न लिखे हुए नाम/पदवी को स्पष्ट करते हैं।
