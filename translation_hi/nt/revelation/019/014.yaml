  text: καὶ τὰ στρατεύματα ⸀τὰ ἐν τῷ οὐρανῷ ἠκολούθει αὐτῷ ἐφ’ ἵπποις λευκοῖς, ἐνδεδυμένοι βύσσινον λευκὸν καθαρόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/014.yaml
  text: And the armies in heaven were following him on white horses[a], clothed in fine linen, white and clean.
translation:
  language: hi
  text: और स्वर्ग में[a] जो सेनाएँ थीं, वे सफेद घोड़ों पर सवार होकर उसके पीछे-पीछे चल रही थीं; वे महीन सन के, सफेद और स्वच्छ वस्त्र पहने हुए थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वर्ग की सेनाएँ।’ यूनानी में शाब्दिक रूप से, ‘वे सेनाएँ जो स्वर्ग में हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατεύματα
  choice: सेनाएँ
  rationale: बहुवचन संज्ञा संगठित सैन्य दलों को दर्शाती है; दर्शन के युद्ध-संदर्भ में ‘सेनाएँ’ स्वाभाविक और सीधा हिन्दी पर्याय है।
- source_word: τὰ ἐν τῷ οὐρανῷ
  choice: स्वर्ग में जो ... थीं
  rationale: यह पदबंध मूलतः स्थान बताता है। इस रचना से सेनाओं का स्वर्ग में होना स्पष्ट होता है, बिना उन्हें व्याख्यात्मक रूप से ‘स्वर्गीय’ कहकर उनकी प्रकृति निर्धारित किए।
- source_word: ἠκολούθει αὐτῷ
  choice: उसके पीछे-पीछे चल रही थीं
  rationale: अपूर्ण भूतकाल दर्शन में जारी क्रिया को व्यक्त करता है; ‘चल रही थीं’ उस निरंतरता को बनाए रखता है। ‘पीछे-पीछे’ ἀκολουθέω के अनुसरण के भाव को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: ἐφ’ ἵπποις λευκοῖς
  choice: सफेद घोड़ों पर सवार होकर
  rationale: पदबंध घुड़सवार साथ चलने का चित्र देता है। केवल ‘घोड़ों पर’ की अपेक्षा ‘सवार होकर’ आधुनिक हिन्दी में अधिक सहज है और अर्थ को स्पष्ट करता है।
- source_word: ἐνδεδυμένοι
  choice: वस्त्र पहन रखे थे
  rationale: कृदंत उनकी वस्त्रधारी अवस्था बताता है; ‘पहन रखे थे’ परिणामी और जारी अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: βύσσινον
  choice: महीन मलमल के वस्त्र
  rationale: βύσσινον मूल्यवान, उत्तम कोटि के महीन सन-वस्त्र का संकेत करता है। ‘महीन मलमल’ सामान्य पाठक के लिए स्वाभाविक कपड़ा-संज्ञा है, और ‘वस्त्र’ जोड़ने से हिन्दी वाक्य पूरा और स्पष्ट बनता है।
- source_word: λευκὸν καθαρόν
  choice: सफेद और स्वच्छ
  rationale: 'दोनों विशेषणों को अलग रखा गया है: पहला रंग और दूसरा स्वच्छता बताता है। ‘शुद्ध’ कहने से संभावित धार्मिक व्याख्या अधिक प्रबल हो सकती थी।'
theological_decisions:
- issue: स्वर्ग में स्थित सेनाओं की पहचान
  choice: उन्हें केवल ‘स्वर्ग में जो सेनाएँ थीं’ कहा गया है
  alternative: ‘स्वर्गीय सेनाएँ’ कहकर, या उन्हें स्वर्गदूत अथवा महिमाप्राप्त पवित्र लोग बताकर उनकी पहचान निश्चित करना
  rationale: यूनानी पाठ उनका स्थान और पहनावा बताता है, पर इस पद में यह स्पष्ट नहीं करता कि वे स्वर्गदूत हैं, पवित्र लोग हैं, या दोनों। अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दर्शन की ऊँची शैली बनाए रखते हुए पुराने या अत्यधिक संस्कृतनिष्ठ पदों से बचा गया है। मूल यूनानी का स्थानवाचक बल और अपूर्ण भूतकाल की जारी क्रिया सुरक्षित रखी गई है।
