id: REV.19.11
reference: Revelation 19:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον τὸν οὐρανὸν ἠνεῳγμένον, καὶ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ⸂πιστὸς καλούμενος⸃ καὶ ἀληθινός, καὶ ἐν δικαιοσύνῃ κρίνει καὶ πολεμεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/011.yaml
  text: And I saw heaven opened[a], and behold, a white horse, and the one sitting on it is called Faithful and True, and in righteousness he judges and wages war.
translation:
  language: hi
  text: और मैंने स्वर्ग को खुला हुआ देखा, और देखो, एक सफेद घोड़ा था। उस पर बैठा हुआ “विश्वासयोग्य और सच्चा” कहलाता है। वह धार्मिकता के साथ[a] न्याय करता और युद्ध करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय के साथ।”
    reason: δικαιοσύνη यहाँ ‘धार्मिकता’ के साथ-साथ न्याय/न्यायसंगतता का अर्थ भी दे सकता है।
lexical_decisions:
- source_word: ἠνεῳγμένον
  choice: खुला हुआ
  rationale: पूर्णकालिक कर्मवाच्य कृदंत स्वर्ग के खोले जा चुके और अब खुले होने की अवस्था बताता है; ‘खुला हुआ’ इस परिणामकारी भाव को स्वाभाविक हिंदी में रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह प्रकाशन-साहित्य की दृश्यात्मक तीव्रता और ध्यान आकर्षित करने वाले बल को बनाए रखता है।
- source_word: ἵππος λευκός
  choice: एक सफेद घोड़ा
  rationale: यूनानी संज्ञा-पदबंध का सीधा और स्वाभाविक हिंदी रूप।
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: उस पर बैठा हुआ
  rationale: कृदंतीय रचना के निकट रहता है और ‘सवार’ जैसा थोड़ा अधिक व्याख्यात्मक शब्द जोड़ने से बचता है।
- source_word: πιστὸς καλούμενος καὶ ἀληθινός
  choice: “विश्वासयोग्य और सच्चा” कहलाता है
  rationale: καλούμενος नामकरण का भाव देता है और दोनों विशेषण प्रसंग में उपाधियों के रूप में कार्य करते हैं। उद्धरण-चिह्न हिंदी में उनके उपाधि-सदृश प्रयोग को स्पष्ट करते हैं।
- source_word: πιστός
  choice: विश्वासयोग्य
  rationale: यह भरोसेमंद और निष्ठावान होने के अर्थ-क्षेत्र को समेटता है तथा इस उपाधि के लिए प्रतिष्ठित और समझने योग्य हिंदी है।
- source_word: ἀληθινός
  choice: सच्चा
  rationale: यह ‘विश्वासयोग्य’ के साथ स्वाभाविक उपाधि-युग्म बनाता है और सत्यता तथा वास्तविकता के भाव को बनाए रखता है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता से
  rationale: यह पदबंध न्याय और युद्ध करने के ढंग को व्यक्त करता है। ‘धार्मिकता’ δικαιοσύνη का मुख्य धर्मवैचारिक अर्थ बनाए रखता है, जबकि न्यायसंगत ढंग का संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: κρίνει
  choice: न्याय करता है
  rationale: साधारण वर्तमानकालीन क्रिया को बिना अतिरिक्त अर्थ जोड़े स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πολεμεῖ
  choice: युद्ध लड़ता है
  rationale: क्रिया की सैनिक शक्ति को स्पष्ट और प्रचलित आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: घोड़े पर बैठे व्यक्ति की उपाधियों की प्रस्तुति
  choice: πιστός और ἀληθινός को “विश्वासयोग्य और सच्चा” उपाधियों के रूप में प्रस्तुत किया गया है।
  alternative: इन्हें केवल वर्णनात्मक विशेषण मानकर ‘विश्वासयोग्य और सच्चा’ पढ़ा जा सकता है।
  rationale: प्रकाशितवाक्य के निकटवर्ती साहित्यिक संदर्भ में ये उस व्यक्ति की नाम-सदृश मसीही उपाधियाँ हैं; उद्धरण-चिह्न इसे दिखाते हैं, पर यूनानी से बाहर कोई पहचान नहीं जोड़ते।
- issue: δικαιοσύνη का अनुवाद
  choice: मुख्य पाठ में ‘धार्मिकता’ रखा गया है।
  alternative: ‘न्यायपूर्वक’ या ‘न्यायसंगत ढंग से’।
  rationale: शब्द धार्मिकता और न्याय—दोनों से जुड़ा अर्थ रख सकता है। मुख्य पाठ व्यापक धर्मवैचारिक अर्थ को बचाता है और पादटिप्पणी न्याय के इस प्रसंग में उसके न्यायसंगत ढंग को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, दृश्यात्मक और सामान्य पाठक के लिए सहज शैली रखी गई है। ‘देखो’ मूल की आकस्मिक दृश्यात्मकता बनाए रखता है; वाक्य-विभाजन हिंदी की पठनीयता के लिए किया गया है।
