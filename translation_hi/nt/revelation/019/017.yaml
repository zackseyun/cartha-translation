source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἕνα ἄγγελον ἑστῶτα ἐν τῷ ἡλίῳ, καὶ ⸀ἔκραξεν φωνῇ μεγάλῃ λέγων πᾶσι τοῖς ὀρνέοις τοῖς πετομένοις ἐν μεσουρανήματι· Δεῦτε συνάχθητε εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/017.yaml
  text: And I saw one angel standing in the sun[a], and he cried out with a loud voice, saying to all the birds flying in midheaven, “Come, gather for the great supper of God,”
translation:
  language: hi
  text: और मैंने एक स्वर्गदूत को सूर्य में खड़ा देखा। उसने ऊँचे स्वर में पुकारकर आकाश के मध्य में[a] उड़ने वाले सभी पक्षियों से कहा, “आओ, परमेश्वर के महान भोज के लिए इकट्ठे हो जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश के बीचोंबीच” अथवा “ऊँचे आकाश में।” यूनानी शब्द μεσουράνημα प्रकाशितवाक्य में प्रयुक्त एक विशिष्ट अपोकैलिप्टिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνα ἄγγελον
  choice: एक स्वर्गदूत
  rationale: ‘एक’ यूनानी अंक ἕνα को बनाए रखता है और हिन्दी में स्वाभाविक भी है।
- source_word: ἑστῶτα ἐν τῷ ἡλίῳ
  choice: सूर्य में खड़ा
  rationale: ἐν के सीधे स्थानवाचक अर्थ और प्रकाशन-साहित्य की प्रखर छवि को बिना ‘सामने’ या ‘ऊपर’ जैसी व्याख्या जोड़े सुरक्षित रखा गया है।
- source_word: ἔκραξεν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर में पुकारकर
  rationale: यह κράζω की प्रबल पुकार और φωνῇ μεγάλῃ के साधन/ढंग को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πᾶσι τοῖς ὀρνέοις
  choice: सभी पक्षियों से
  rationale: ὄρνεον सामान्यतः ‘पक्षी’ है; ‘मांसभक्षी पक्षी’ कहना अगले पद के संदर्भ को इस संज्ञा में समय से पहले जोड़ देता।
- source_word: τοῖς πετομένοις ἐν μεσουρανήματι
  choice: आकाश के मध्य में उड़ने वाले
  rationale: μεσουράνημα के विशिष्ट प्रकाशन-साहित्यिक स्थानबोध को समझने योग्य हिन्दी में रखा गया है; वैकल्पिक अभिव्यक्तियाँ पादटिप्पणी में दी गई हैं।
- source_word: Δεῦτε
  choice: आओ
  rationale: प्रत्यक्ष बुलावे की आज्ञा को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: συνάχθητε
  choice: इकट्ठे हो जाओ
  rationale: आज्ञार्थक रूप को हिन्दी की स्वाभाविक सामूहिक आज्ञा के रूप में प्रस्तुत किया गया है।
- source_word: εἰς τὸ δεῖπνον τὸ μέγα τοῦ θεοῦ
  choice: परमेश्वर के महान भोज के लिए
  rationale: ‘भोज’ δεῖπνον के मुख्य सामूहिक भोजन के भाव को व्यक्त करता है, और संबंधकारक τοῦ θεοῦ को स्पष्ट रखता है।
theological_decisions:
- issue: प्रकाशन-साहित्य की स्थानवाचक छवि
  choice: सूर्य में खड़ा
  alternative: सूर्य के सामने खड़ा
  rationale: मूल पाठ की जानबूझकर चौंकाने वाली छवि को नरम या व्याख्यायित करने के बजाय यथावत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्यरचना मूल दर्शन की क्रमिकता को बनाए रखते हुए हिन्दी में स्वाभाविक बनाई गई है; अपोकैलिप्टिक छवि और μεσουράνημα की विशिष्टता को समतल नहीं किया गया।
