id: REV.19.8
reference: Revelation 19:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῇ ἵνα περιβάληται βύσσινον ⸀λαμπρὸν καθαρόν, τὸ γὰρ βύσσινον τὰ δικαιώματα τῶν ἁγίων ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/008.yaml
  text: And it was given to her to clothe herself with fine linen[a], bright and clean, for the fine linen is the righteous deeds of the saints.
translation:
  language: hi
  text: और उसे चमकदार और स्वच्छ महीन मलमल का वस्त्र पहनने के लिए दिया गया, क्योंकि यह महीन मलमल पवित्र जनों के धर्मी कामों का प्रतीक है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी कार्य।” यूनानी शब्द दूसरे संदर्भों में “धर्मी अपेक्षाएँ” या “न्यायपूर्ण निर्णय” भी दर्शा सकता है, पर यहाँ पवित्र जनों के धर्मी काम सबसे स्वाभाविक अर्थ है।
    reason: δικαιώματα की अर्थ-सीमा और इस संदर्भ में उसके वैकल्पिक अनुवाद को दर्ज करना।
lexical_decisions:
- source_word: ἐδόθη αὐτῇ
  choice: उसे ... दी गई
  rationale: अज्ञात कर्ता वाले कर्मवाच्य को बनाए रखा गया है; परमेश्वर को स्पष्ट कर्ता बनाकर मूल से अधिक नहीं कहा गया। स्त्रीलिंग क्रिया ‘दी गई’ का संबंध ‘महीन मलमल’ से स्वाभाविक रूप से बैठता है।
- source_word: ἵνα περιβάληται
  choice: पहनने को
  rationale: 'मध्यवाच्य का आत्म-संबंधी भाव स्वाभाविक हिन्दी में व्यक्त होता है: वह स्वयं उस वस्त्र को पहने।'
- source_word: βύσσινον
  choice: महीन मलमल
  rationale: यह उत्तम और बहुमूल्य महीन लिनन को दर्शाता है; ‘महीन मलमल’ आधुनिक हिन्दी में बोधगम्य और प्रकाशितवाक्य के वस्त्र-बिंब के अनुकूल है।
- source_word: λαμπρὸν καθαρόν
  choice: चमकदार और स्वच्छ
  rationale: दोनों दृश्य विशेषताओं को अलग-अलग रखा गया है। ‘स्वच्छ’ वस्त्र की दशा बताता है और अनावश्यक रूप से अमूर्त नैतिक अर्थ नहीं जोड़ता।
- source_word: τὸ γὰρ βύσσινον
  choice: क्योंकि वह महीन मलमल
  rationale: γάρ के व्याख्यात्मक संबंध को ‘क्योंकि’ से और यूनानी की स्पष्ट पुनरावृत्ति को ‘महीन मलमल’ दोहराकर सुरक्षित रखा गया है।
- source_word: δικαιώματα
  choice: धर्म के काम
  rationale: इस बहुवचन का संदर्भ यहाँ पवित्र जनों के धर्मानुकूल कर्मों से है। यह चयन ‘धर्मी काम’ की तुलना में अधिक सहज हिन्दी है, जबकि शब्द की वैकल्पिक छाया पादटिप्पणी में दी गई है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों के
  rationale: नए नियम में यह परमेश्वर के पवित्र लोगों के लिए सामूहिक पद है। ‘पवित्र जन’ सामान्य पाठक के लिए स्पष्ट है और किसी विशेष धार्मिक पदवी का आभास कम देता है।
theological_decisions:
- issue: वस्त्र और पवित्र जनों के δικαιώματα का संबंध
  choice: महीन मलमल पवित्र जनों के धर्म के कामों का प्रतीक है।
  alternative: यह पवित्र जनों से संबंधित धार्मिक अपेक्षाओं, उनके धर्मी ठहराए जाने, या उनके पक्ष में हुए न्यायपूर्ण निर्णयों को दर्शाता है।
  rationale: तात्कालिक प्रतीकात्मक संदर्भ और बहुवचन रूप कर्मों की ओर सबसे स्वाभाविक संकेत करते हैं। साथ ही, पहले खंड में वस्त्र का ‘दिया जाना’ और दूसरे में उसका उनके काम होना—दोनों को साथ रखकर अनुग्रह और मानवीय आचरण के बीच पाठ में उपस्थित तनाव को हल किए बिना सुरक्षित रखा गया है।
- issue: ἐδόθη में देने वाले की पहचान
  choice: देने वाले को स्पष्ट नहीं किया गया।
  alternative: ‘परमेश्वर ने उसे दिया।’
  rationale: यह संभवतः दैवी कर्मवाच्य है, पर यूनानी पाठ कर्ता का नाम नहीं बताता; इसलिए अनुवाद भी वही संयम रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘महीन मलमल’ वस्त्र-बिंब को स्पष्ट करता है; ‘पवित्र जन’ पारंपरिक अर्थ को बिना सम्प्रदायगत पदवी बनाए व्यक्त करता है।
