base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/004.yaml
  text: And the twenty-four elders and the four living creatures fell down and worshiped God[a], the one seated on the throne, saying, “Amen! Hallelujah!”
translation:
  language: hi
  text: और चौबीस प्राचीन और चार जीवित प्राणी गिर पड़े और सिंहासन पर विराजमान परमेश्वर की आराधना की, और कहा, “आमीन! हल्लेलूयाह![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, “यहोवा की स्तुति करो!”; शाब्दिक रूप से, “याह की स्तुति करो!” यह एक इब्रानी उपासना-उद्घोष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσαν
  choice: मुँह के बल गिर पड़े
  rationale: आराधना के प्रसंग में πίπτω दंडवत होने की शारीरिक मुद्रा दर्शाता है; यह स्वाभाविक हिन्दी में उस भाव को स्पष्ट करता है।
- source_word: οἱ πρεσβύτεροι οἱ εἴκοσι τέσσαρες
  choice: चौबीसों प्राचीन
  rationale: प्रकाशितवाक्य में πρεσβύτεροι के लिए ‘प्राचीन’ प्रतिष्ठित और संक्षिप्त बाइबलीय पद है; ‘चौबीसों’ पूरे समूह को सूचित करता है।
- source_word: τὰ τέσσαρα ζῷα
  choice: चारों जीवित प्राणी
  rationale: ζῷα यहाँ सिंहासन-कक्ष के विशिष्ट सजीव प्राणियों को दर्शाता है, सामान्य पशुओं को नहीं।
- source_word: προσεκύνησαν
  choice: आराधना करते हुए
  rationale: परमेश्वर कर्म का स्पष्ट लक्ष्य हैं, इसलिए क्रिया यहाँ केवल प्रणाम नहीं, धार्मिक आराधना व्यक्त करती है।
- source_word: τῷ θεῷ τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: सिंहासन पर विराजमान परमेश्वर की
  rationale: यह हिन्दी में सहज रूप से परमेश्वर की पहचान सिंहासन पर बैठे हुए जन के रूप में सुरक्षित रखता है; ‘विराजमान’ गरिमापूर्ण किंतु बोधगम्य है।
- source_word: λέγοντες
  choice: बोले
  rationale: हिन्दी में संयुक्त क्रिया-विन्यास ‘आराधना करते हुए बोले’ यूनानी कृदंत का स्वाभाविक प्रतिनिधित्व करता है।
- source_word: Ἀμήν
  choice: आमीन
  rationale: स्थिर उपासना-संबंधी उद्घोष को हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: Ἁλληλουϊά
  choice: हल्लेलूयाह
  rationale: यूनानी में अंतर्निहित इब्रानी उपासना-उद्घोष का प्रचलित हिन्दी लिप्यंतरण उसके धार्मिक और सामूहिक स्वरूप को सुरक्षित रखता है; अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: यूनानी पाठ में लिप्यंतरित इब्रानी उद्घोष Ἁλληλουϊά का अनुवाद
  choice: हल्लेलूयाह
  alternative: यहोवा की स्तुति करो! / याह की स्तुति करो!
  rationale: यहाँ शब्द एक स्थापित उपासना-उद्घोष के रूप में प्रयुक्त है। लिप्यंतरण उसके धार्मिक स्वरूप को बचाता है, जबकि पादटिप्पणी मूल अर्थ और दिव्य नाम के संक्षिप्त रूप को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘प्राचीन’, ‘जीवित प्राणी’, ‘आमीन’ और ‘हल्लेलूयाह’ जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य-विन्यास को स्वाभाविक हिन्दी के लिए पुनर्गठित किया गया है।
