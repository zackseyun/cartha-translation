source:
  edition: SBLGNT
  text: καὶ δεύτερον ⸀εἴρηκαν· Ἁλληλουϊά· καὶ ὁ καπνὸς αὐτῆς ἀναβαίνει εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/003.yaml
  text: And a second time they said[a], “Hallelujah!” And her smoke goes up forever and ever.
translation:
  language: hi
  text: और उन्होंने दूसरी बार कहा, “हल्लेलूयाह!” और उसका धुआँ युगानुयुग उठता रहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः यूनानी: “युगों के युगों तक,” अर्थात कभी समाप्त न होने वाली अवधि।'
    reason: lexical_alternative
lexical_decisions:
- source_word: δεύτερον
  choice: दूसरी बार
  rationale: यह क्रियाविशेषणीय प्रयोग पुनरावृत्ति के साथ क्रम को भी स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἴρηκαν
  choice: उन्होंने ... कहा
  rationale: λέγω के पूर्णकाल रूप को हिन्दी कथन-शैली में सहज भूतकाल से व्यक्त किया गया है; ‘पुकार उठे’ जैसी अभिव्यक्ति मूल क्रिया में निहित न होने वाली तीव्रता जोड़ती।
- source_word: Ἁλληλουϊά
  choice: हल्लेलूयाह
  rationale: इस पहचाने जाने वाले आराधनात्मक उद्गार का लिप्यंतरण प्रकाशित हिन्दी बाइबल-भाषा में स्वाभाविक है और यहाँ प्रयुक्त विशिष्ट उपासना-सूत्र को बनाए रखता है।
- source_word: ὁ καπνὸς αὐτῆς
  choice: उसका धुआँ
  rationale: αὐτῆς का संकेत संदर्भ में स्त्री/नगर के रूप में चित्रित बाबुल की ओर है। हिन्दी का ‘उसका’ इस संबंध को सहजता से व्यक्त करता है, यद्यपि उसमें स्वामी का व्याकरणिक लिंग प्रत्यक्ष नहीं होता।
- source_word: ἀναβαίνει
  choice: उठता रहता है
  rationale: वर्तमान काल की जारी रहने वाली, सजीव क्रिया को व्यक्त करता है और धुएँ के ऊपर उठने का स्वाभाविक हिन्दी चित्र देता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह संक्षिप्त, गरिमापूर्ण और परिचित हिन्दी मुहावरा संदर्भ में अनंत अवधि का भाव देता है; अधिक शब्दशः रूप पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων द्वारा व्यक्त अवधि
  choice: युगानुयुग
  alternative: युगों के युगों तक
  rationale: न्याय के इस अंतिम दृश्य में यूनानी मुहावरा स्वाभाविक रूप से अंतहीन अवधि व्यक्त करता है। मुख्य पाठ उसका प्रचलित हिन्दी समतुल्य रखता है और शब्दशः संरचना पारदर्शिता के लिए पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वाक्य की आराधनात्मक तथा प्रकाशन-साहित्य संबंधी लय बनाए रखी गई है। पाद-टिप्पणी का चिह्न उसी पदांश के बाद रखा गया है जिसकी वह व्याख्या करती है।
