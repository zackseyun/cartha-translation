id: REV.19.15
reference: Revelation 19:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ στόματος αὐτοῦ ἐκπορεύεται ⸀ῥομφαία ὀξεῖα, ἵνα ἐν αὐτῇ πατάξῃ τὰ ἔθνη, καὶ αὐτὸς ποιμανεῖ αὐτοὺς ἐν ῥάβδῳ σιδηρᾷ· καὶ αὐτὸς πατεῖ τὴν ληνὸν τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς τοῦ θεοῦ τοῦ παντοκράτορος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/015.yaml
  text: And from his mouth comes a sharp sword[a], so that with it he may strike the nations, and he himself will shepherd them with an iron rod[b]; and he himself treads the winepress of the wine of the fury of the wrath of God the Almighty.
translation:
  language: hi
  text: और उसके मुँह से एक तेज़ तलवार निकलती है, ताकि वह उस तलवार से राष्ट्रों पर प्रहार करे; और वह स्वयं लोहे की छड़ी से उनकी चरवाही करेगा[a]। और वह स्वयं सर्वशक्तिमान परमेश्वर के क्रोध के प्रकोप के दाखरस का कोल्हू रौंदता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोहे की छड़ी से उन पर शासन करेगा।” यूनानी क्रिया का शाब्दिक अर्थ “चरवाही करना” है; यहाँ भजन 2 की राजकीय प्रतिध्वनि भी सुनाई देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύεται
  choice: निकलती है
  rationale: वर्तमानकालीन सजीव चित्र को स्वाभाविक हिन्दी में रखता है और मुँह से तलवार के बाहर आने का भाव स्पष्ट करता है।
- source_word: ῥομφαία ὀξεῖα
  choice: एक तेज़ तलवार
  rationale: ῥομφαία बड़ी तलवार को सूचित कर सकता है, पर अधिक विशिष्ट हथियार-नाम अनावश्यक व्याख्या जोड़ता; ‘तेज़ तलवार’ स्पष्ट और स्वाभाविक है।
- source_word: ἵνα ἐν αὐτῇ πατάξῃ
  choice: ताकि वह उससे ... प्रहार करे
  rationale: ἵνα उद्देश्य व्यक्त करता है और ἐν αὐτῇ यहाँ साधनसूचक है। ‘प्रहार करे’ πατάξῃ को ‘मार गिराए’ जैसी अतिरिक्त परिणति जोड़े बिना व्यक्त करता है।
- source_word: τὰ ἔθνη
  choice: राष्ट्रों
  rationale: प्रकाशितवाक्य के इस संदर्भ में सामूहिक जातियों/राष्ट्रों का बोध है; ‘राष्ट्रों’ यह व्यापक अर्थ बनाए रखता है।
- source_word: ποιμανεῖ
  choice: चरवाही करेगा
  rationale: क्रिया का मूल अर्थ चरवाहे की तरह देखभाल या अगुवाई करना है। राजकीय और न्यायिक संदर्भ के बावजूद रूपक को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: लोहे के राजदंड से
  rationale: ῥάβδος यहाँ शासन-अधिकार के दंड को दर्शाता है; ‘राजदंड’ हिन्दी में राजकीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि साधनसूचक ἐν को ‘से’ दर्शाता है।
- source_word: πατεῖ
  choice: रौंदता है
  rationale: वर्तमानकाल की सजीवता तथा अंगूर कुचलने और न्याय—दोनों की प्रबल छवि सुरक्षित रहती है।
- source_word: τὴν ληνὸν
  choice: रसकुंड
  rationale: ληνός अंगूर कुचलकर रस निकालने के कुंड को दर्शाता है; ‘रसकुंड’ संक्षिप्त और चित्रात्मक हिन्दी है।
- source_word: τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς
  choice: प्रचंड क्रोध की मदिरा
  rationale: θυμός और ὀργή की संयुक्त तीव्रता को हिन्दी में स्वाभाविक परंतु बलपूर्ण ढंग से व्यक्त करता है; शाब्दिक दोहराव हिन्दी में अस्पष्ट और कृत्रिम होता।
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: सर्वशक्तिमान परमेश्वर के
  rationale: παντοκράτωρ को प्रचलित और गरिमापूर्ण ईश्वरीय उपाधि ‘सर्वशक्तिमान’ से व्यक्त किया गया है।
theological_decisions:
- issue: न्याय के संदर्भ और भजन 2 की प्रतिध्वनि में ποιμανεῖ का अर्थ
  choice: चरवाही करेगा
  alternative: शासन करेगा
  rationale: यूनानी क्रिया चरवाहे का रूपक बनाए रखती है, जबकि इस प्रसंग में उसमें राजकीय शासन और न्याय का भाव भी है। मुख्य पाठ रूपक और उसके धार्मिक तनाव को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- issue: θυμοῦ τῆς ὀργῆς की दोहरी क्रोध-अभिव्यक्ति
  choice: प्रचंड क्रोध
  alternative: क्रोध की उग्रता
  rationale: दो निकटार्थक शब्द न्याय की तीव्रता बढ़ाते हैं। सहज हिन्दी में ‘प्रचंड क्रोध’ दोनों के संयुक्त बल को सुरक्षित रखता है, यद्यपि यूनानी की संज्ञा-पर-संज्ञा संरचना को हूबहू नहीं दोहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सजीव और सामान्य पाठकों के लिए सुबोध रूप। न्याय की प्रबल प्रतीकात्मक भाषा बनाए रखी गई है। ‘वह स्वयं’ की पुनरावृत्ति यूनानी αὐτὸς के बल को दर्शाती है।
