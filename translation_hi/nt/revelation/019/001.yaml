source:
  edition: SBLGNT
  text: Μετὰ ταῦτα ἤκουσα ὡς φωνὴν μεγάλην ὄχλου πολλοῦ ἐν τῷ οὐρανῷ λεγόντων· Ἁλληλουϊά· ἡ σωτηρία καὶ ἡ ⸂δόξα καὶ ἡ δύναμις⸃ τοῦ θεοῦ ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/001.yaml
  text: After these things I heard what seemed to be the loud voice of a great multitude in heaven[a], saying, “Hallelujah! Salvation and glory and power belong to our God,”
translation:
  language: hi
  text: इन बातों के बाद मैंने स्वर्ग में मानो एक बड़ी भीड़ की ऊँची आवाज़ सुनी; वे कह रहे थे, “हल्लेलूयाह![a] उद्धार, महिमा और सामर्थ्य हमारे परमेश्वर के हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् “याह की स्तुति करो,” या “प्रभु की स्तुति करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: यह प्रकाशितवाक्य में दर्शनों के क्रम को बताने वाला प्रचलित पदबंध है; बहुवचन ταῦτα को भी बनाए रखता है।
- source_word: ἤκουσα
  choice: मैंने ... सुनी
  rationale: ἀκούω के सामान्य भूतकालीन कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὡς
  choice: मानो
  rationale: यहाँ ὡς ध्वनि की ठीक-ठीक पहचान के बजाय उससे समानता या सुनने वाले की अनुभूति को दर्शाता है; “मानो” इस अनिश्चितता को बनाए रखता है।
- source_word: φωνὴν μεγάλην
  choice: ऊँची आवाज़
  rationale: φωνή के साथ μεγάλη ध्वनि की प्रबलता या ऊँचेपन को सूचित करता है; “ऊँची आवाज़” सहज आधुनिक हिन्दी है।
- source_word: ὄχλου πολλοῦ
  choice: एक बड़ी भीड़ की
  rationale: ὄχλος जनसमूह या भीड़ और πολύς उसके बड़े आकार को व्यक्त करता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: इस दर्शन में οὐρανός आकाश के बजाय स्वर्गीय लोक को सूचित करता है।
- source_word: λεγόντων
  choice: जो कह रही थी
  rationale: वर्तमान कृदंत भीड़ के उद्घोष का विषय प्रस्तुत करता है; हिन्दी में “भीड़” के व्याकरणिक लिंग और वचन के अनुरूप यह रूप स्वाभाविक है।
- source_word: Ἁλληλουϊά
  choice: हल्लेलूयाह
  rationale: यूनानी पाठ में आए इब्रानी उपासना-उद्घोष का प्रचलित लिप्यंतरण इसके आराधनात्मक और अंतरपाठीय स्वरूप को सुरक्षित रखता है; अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἡ σωτηρία
  choice: उद्धार
  rationale: यहाँ σωτηρία परमेश्वर से संबंधित बचाने वाले छुटकारे को दर्शाता है; “उद्धार” उपासना-संदर्भ में स्पष्ट और प्रचलित है।
- source_word: ἡ δόξα
  choice: महिमा
  rationale: आराधना और स्तुतिगान के संदर्भ में δόξα का स्वाभाविक और व्यापक हिन्दी समतुल्य है।
- source_word: ἡ δύναμις
  choice: सामर्थ्य
  rationale: यहाँ δύναμις परमेश्वर की शक्ति को सूचित करता है; “सामर्थ्य” स्तुतिगान के गरिमापूर्ण स्वर के अनुकूल है।
- source_word: τοῦ θεοῦ ἡμῶν
  choice: हमारे परमेश्वर के हैं
  rationale: यूनानी संबंधकारक यहाँ स्वामित्व अथवा गुणारोपण व्यक्त करता है; हिन्दी में “के हैं” इसे स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: स्वर्गीय उद्घोष Ἁλληλουϊά का अनुवाद
  choice: हल्लेलूयाह
  alternative: याह की स्तुति करो / प्रभु की स्तुति करो
  rationale: लिप्यंतरण इस इब्रानी-मूल उपासना-उद्घोष की पहचानी हुई आराधनात्मक ध्वनि और अंतरपाठीय संबंध को बनाए रखता है। पादटिप्पणी उसका शाब्दिक अर्थ बताती है, बिना मुख्य पाठ में किसी एक विस्तृत रूप को अनिवार्य किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। “मानो” दर्शनीय वर्णन की वास्तविक तुलना और उसकी अनिश्चितता को सुरक्षित रखता है। पादटिप्पणी-चिह्न को “हल्लेलूयाह” के बाद रखा गया है, क्योंकि टिप्पणी उसी शब्द की व्याख्या करती है।
