id: REV.19.6
reference: Revelation 19:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ὡς φωνὴν ὄχλου πολλοῦ καὶ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῶν ἰσχυρῶν, ⸀λεγόντων· Ἁλληλουϊά, ὅτι ἐβασίλευσεν κύριος, ὁ ⸀θεός, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/006.yaml
  text: And I heard what seemed to be the voice of a great multitude[a], and like the voice of many waters, and like the voice of mighty thunders, saying, “Hallelujah! For the Lord God, the Almighty[b], reigns.”
translation:
  language: hi
  text: और मैंने सुना, मानो एक विशाल जनसमूह की आवाज़, बहुत से जल की ध्वनि, और प्रचण्ड गर्जनों की ध्वनि हो; वे कह रहे थे, “हल्लेलूयाह! क्योंकि प्रभु परमेश्वर, सर्वशक्तिमान, राज्य करता है।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राज्य करने लगा है,” “राज्य कर चुका है,” अथवा “राजा बन गया है”; यूनानी क्रिया परमेश्वर के शासन के निर्णायक रूप से प्रकट होने का उत्सव सूचित कर सकती है। कुछ हस्तलिपियों में “प्रभु हमारा परमेश्वर, सर्वशक्तिमान” पढ़ा जाता है; यहाँ के मुद्रित यूनानी पाठ में “हमारा” नहीं है।
    reason: lexical_alternative; textual_variant
lexical_decisions:
- source_word: ἤκουσα
  choice: मैंने ... सुनी
  rationale: ἀκούω का अओरिस्ट कथात्मक क्रम में सीधे सुने जाने की घटना बताता है।
- source_word: ὡς
  choice: की-सी / जैसी
  rationale: तीनों प्रयोग तुलना सूचित करते हैं; हिन्दी में स्वाभाविक विविधता रखते हुए दर्शन की उपमा-प्रधान शैली सुरक्षित की गई है।
- source_word: φωνή
  choice: आवाज़ / ध्वनि
  rationale: शब्द आवाज़ अथवा ध्वनि दोनों अर्थ दे सकता है। जनसमूह के लिए ‘आवाज़’ और जल व गर्जन की तुलना में ‘ध्वनि’ स्वाभाविक है, जबकि आगे ‘कह रहे थे’ व्यक्तिगत उद्घोष को स्पष्ट करता है।
- source_word: ὄχλου πολλοῦ
  choice: एक विशाल जनसमूह
  rationale: बहुत बड़ी एकत्रित भीड़ का ऊँचा, प्रकाशन-साहित्य के अनुरूप वर्णन।
- source_word: ὑδάτων πολλῶν
  choice: बहुत-से जल
  rationale: मूल के बहुवचन और बाइबलीय प्रतिध्वनि को सुरक्षित रखा गया है; ‘गर्जना’ हिन्दी में उस प्रबल श्रव्य बिंब को स्वाभाविक बनाती है।
- source_word: βροντῶν ἰσχυρῶν
  choice: शक्तिशाली बादलों की गड़गड़ाहट
  rationale: ἰσχυρός की शक्ति और βροντή की प्रचंड ध्वनि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λεγόντων
  choice: वे कह रहे थे
  rationale: बहुवचन कृदंत का कर्ता जनसमूह से संबद्ध है; हिन्दी में स्पष्ट और स्वाभाविक वाक्य बनाया गया है।
- source_word: Ἁλληλουϊά
  choice: हल्लेलूयाह
  rationale: नए नियम में आए स्थापित उपासना-संबंधी उद्गार का लिप्यंतरण।
- source_word: ὅτι
  choice: क्योंकि
  rationale: उद्गार का कारण प्रस्तुत करता है।
- source_word: κύριος, ὁ θεός, ὁ παντοκράτωρ
  choice: प्रभु, हमारे सर्वशक्तिमान परमेश्वर
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी उपासना-वाक्य अपनाया गया है, पर SBLGNT के अधिक शाब्दिक रूप और ‘हमारे’ वाले पाठांतर को पादटिप्पणी में पारदर्शी ढंग से बताया गया है।
- source_word: ἐβασίλευσεν
  choice: राज्य करता है
  rationale: अओरिस्ट यहाँ परमेश्वर के शासन की निर्णायक विजयपूर्ण अभिव्यक्ति का उत्सव मनाता है; वर्तमान हिन्दी रूप इसे स्वाभाविक रखता है, जबकि संभावित कालगत अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ἐβασίλευσεν और परमेश्वर के शासन का कालगत आशय
  choice: राज्य करता है
  alternative: राज्य करने लगा है / उसने राज्य किया है / राजा बन गया है
  rationale: मुख्य पाठ किसी ऐसी धारणा को नहीं जोड़ता कि परमेश्वर पहले सार्वभौम नहीं था। साथ ही अओरिस्ट की निर्णायक अथवा आरंभसूचक छाया को पादटिप्पणी में खुला रखा गया है।
- issue: θεός के साथ ‘हमारे’ और यूनानी पदबंध का पाठ-संबंध
  choice: प्रभु, हमारे सर्वशक्तिमान परमेश्वर
  alternative: प्रभु, परमेश्वर, सर्वशक्तिमान / प्रभु, वह परमेश्वर, सर्वशक्तिमान
  rationale: दूसरी पठन-परंपरा में ἡμῶν (‘हमारे’) मिलता है, जबकि दिए गए SBLGNT पाठ में यह नहीं है। मुख्य पाठ पठनीय उपासना-भाषा रखता है और पादटिप्पणी मूल मुद्रित पाठ को स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, श्रव्य और उपासना-संगत शैली रखी गई है। दोहराई गई उपमाओं की लय को बनाए रखते हुए अस्वाभाविक शब्दशः संरचना से बचा गया है।
