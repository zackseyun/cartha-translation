reference: Revelation 19:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα φάγητε σάρκας βασιλέων καὶ σάρκας χιλιάρχων καὶ σάρκας ἰσχυρῶν καὶ σάρκας ἵππων καὶ τῶν καθημένων ἐπ’ ⸀αὐτῶν, καὶ σάρκας πάντων ἐλευθέρων τε καὶ δούλων καὶ μικρῶν ⸀καὶ μεγάλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/018.yaml
  text: so that you may eat the flesh of kings[a], the flesh of commanders, the flesh of the mighty, the flesh of horses and of those who sit on them, and the flesh of all, both free and servant, and small and great.
translation:
  language: hi
  text: ताकि तुम राजाओं का मांस, सेनापतियों का मांस, बलवानों का मांस, घोड़ों का और उन पर बैठे लोगों का मांस, और सभी का मांस—स्वतंत्रों और दासों का, छोटे और बड़े का—खाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα φάγητε
  choice: ताकि तुम ... खाओ
  rationale: ἵνα के उद्देश्यसूचक बल और उसके साथ प्रयुक्त द्वितीय पुरुष बहुवचन अओरिस्ट सब्जंक्टिव को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: σάρκας
  choice: मांस
  rationale: यहाँ युद्ध और न्याय के दृश्य में शारीरिक देह का वास्तविक मांस अभिप्रेत है। यूनानी पाठ की आलंकारिक पुनरावृत्ति को हिन्दी में भी यथासंभव बनाए रखा गया है।
- source_word: βασιλέων
  choice: राजाओं का
  rationale: विशिष्ट रूप से राजाओं को सूचित करता है; अधिक सामान्य ‘शासकों’ की अपेक्षा यह स्रोत के निकट है।
- source_word: χιλιάρχων
  choice: सेनापतियों का
  rationale: यह सैन्य अधिकारियों के लिए प्रयुक्त पद है। ‘सेनापति’ आधुनिक पाठक के लिए स्पष्ट है और सैन्य अर्थ बनाए रखता है, यद्यपि यूनानी पद ऐतिहासिक रूप से हज़ार सैनिकों के अधिकारी को सूचित कर सकता है।
- source_word: ἰσχυρῶν
  choice: बलवानों का
  rationale: विशेषण यहाँ संज्ञा के रूप में शक्तिशाली या सामर्थी लोगों के लिए प्रयुक्त है। ‘बलवान’ संक्षिप्त है और युद्ध-दृश्य के अनुकूल है।
- source_word: ἵππων
  choice: घोड़ों का
  rationale: युद्ध-दृश्य में घोड़ों का सीधा, वास्तविक उल्लेख है।
- source_word: τῶν καθημένων ἐπ’ αὐτῶν
  choice: उन पर बैठे लोगों का
  rationale: कृदन्तीय वाक्यांश को निकटता से व्यक्त करता है और केवल ‘सवारों’ कहकर चित्र को संक्षिप्त नहीं करता।
- source_word: πάντων
  choice: सबका
  rationale: आगे दिए गए सामाजिक और प्रतिष्ठागत सभी वर्गों को समेटने वाली समग्रता व्यक्त करता है।
- source_word: ἐλευθέρων τε καὶ δούλων
  choice: स्वतंत्रों और दासों का
  rationale: यह स्वतंत्र और बंधनाधीन सामाजिक स्थितियों का स्पष्ट विरोध है; इसलिए δοῦλος के लिए ‘दास’ उपयुक्त है।
- source_word: μικρῶν καὶ μεγάλων
  choice: छोटों और बड़ों का
  rationale: सभी पदों और प्रतिष्ठाओं को समेटने वाले पारंपरिक युग्म को सुरक्षित रखता है।
theological_decisions:
- issue: सामाजिक-स्थिति के विरोध में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ἐλεύθερος के साथ विरोध में यहाँ बंधनाधीन स्थिति प्रमुख है। ‘सेवक’ उस बल को कम कर सकता है, जबकि ‘दास’ स्रोत का सामाजिक अर्थ स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और दृश्य की कठोरता के अनुरूप भाषा रखी गई है। ‘मांस’ की पुनरावृत्ति यूनानी पाठ की गंभीर, संचयी लय को बनाए रखती है। पादटिप्पणी-चिह्न को उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
