id: REV.19.2
reference: Revelation 19:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις αὐτοῦ· ὅτι ἔκρινεν τὴν πόρνην τὴν μεγάλην ἥτις ⸀ἔφθειρεν τὴν γῆν ἐν τῇ πορνείᾳ αὐτῆς, καὶ ἐξεδίκησεν τὸ αἷμα τῶν δούλων αὐτοῦ ἐκ χειρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/002.yaml
  text: because his judgments are true and just; because he judged the great prostitute who corrupted the earth with her sexual immorality[a], and he avenged the blood of his servants from her hand.
translation:
  language: hi
  text: क्योंकि उसके निर्णय सच्चे और न्यायपूर्ण हैं; क्योंकि उसने उस बड़ी वेश्या का न्याय किया, जो अपने व्यभिचार से पृथ्वी को भ्रष्ट करती थी, और उसने उसके हाथ से अपने दासों[a] के लहू का प्रतिशोध लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सेवकों’। यूनानी शब्द δοῦλος किसी स्वामी के अधिकार में रहने वाले ‘दास’ या उसकी सेवा करने वाले ‘सेवक’ के लिए प्रयुक्त हो सकता है।
    reason: δοῦλος की अर्थ-सीमा और हिन्दी में उपलब्ध दोनों स्वाभाविक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: सत्य और न्यायपूर्ण
  rationale: दोनों विशेषण परमेश्वर के न्यायिक निर्णयों की वास्तविक सत्यता और नैतिक उचितता व्यक्त करते हैं; आधुनिक हिन्दी में यह युग्म स्वाभाविक और स्पष्ट है।
- source_word: αἱ κρίσεις αὐτοῦ
  choice: उसके न्याय के निर्णय
  rationale: κρίσεις के न्यायिक अर्थ को स्पष्ट रखते हुए केवल सामान्य ‘फैसले’ की अपेक्षा परमेश्वर के न्याय-कार्यों का भाव सुरक्षित किया गया है।
- source_word: ἔκρινεν
  choice: न्याय किया
  rationale: κρίνω का व्यापक न्यायिक अर्थ रखा गया है; संदर्भ में दण्डित करना निहित है, पर उसे अनावश्यक रूप से मुख्य पाठ में सीमित नहीं किया गया।
- source_word: τὴν πόρνην τὴν μεγάλην
  choice: उस बड़ी वेश्या
  rationale: πόρνη का सीधा, आधुनिक और रूपक की तीव्रता बनाए रखने वाला हिन्दी पर्याय है।
- source_word: ἔφθειρεν
  choice: भ्रष्ट किया था
  rationale: φθείρω में नाश और भ्रष्टता दोनों की अर्थ-सीमा है; यहाँ व्यभिचार साधन के रूप में आया है, इसलिए नैतिक और आत्मिक भ्रष्टता संदर्भ के अनुकूल है। ‘था’ मुख्य न्याय-कार्य से पहले की क्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: τὴν γῆν
  choice: पृथ्वी
  rationale: प्रकाशितवाक्य के व्यापक वैश्विक संदर्भ में γῆ का सामान्य अर्थ ‘पृथ्वी’ उपयुक्त है।
- source_word: ἐν τῇ πορνείᾳ αὐτῆς
  choice: अपने व्यभिचार से
  rationale: πορνεία की यौन अनैतिकता और प्रकाशितवाक्य में उसकी रूपकात्मक बेवफाई—दोनों की संभावना ‘व्यभिचार’ में बनी रहती है।
- source_word: ἐξεδίκησεν
  choice: बदला लिया
  rationale: क्रिया अपराध के लिए न्यायपूर्ण प्रतिशोध लेने को व्यक्त करती है; यह हिन्दी में संक्षिप्त और प्रचलित है।
- source_word: τὸ αἷμα τῶν δούλων αὐτοῦ
  choice: अपने दासों के लहू
  rationale: ‘दास’ δοῦλος में निहित स्वामी से बँधे होने और उसके अधिकार में होने के प्रबल भाव को सुरक्षित रखता है; ‘लहू’ बलिदानी मृत्यु और रक्तपात के बाइबलीय मुहावरे को बनाए रखता है।
- source_word: ἐκ χειρὸς αὐτῆς
  choice: उसके हाथ से
  rationale: मूल का सजीव बाइबलीय मुहावरा सुरक्षित है और यहाँ वेश्या की दोषी कर्तृता को सूचित करता है।
theological_decisions:
- issue: δοῦλοι द्वारा परमेश्वर के लोगों का वर्णन
  choice: दासों
  alternative: सेवकों
  rationale: ‘दास’ स्वामित्व और पूर्ण संबंध-बद्धता का मूल यूनानी भाव अधिक स्पष्ट रखता है। हिन्दी में ‘दास’ की धार्मिक-बाइबलीय गरिमा भी है; फिर भी ‘सेवक’ अर्थ-संभव है, इसलिए उसे पाद-टिप्पणी में दिया गया है।
- issue: πορνεία का शाब्दिक और रूपकात्मक तनाव
  choice: व्यभिचार
  alternative: यौन अनैतिकता
  rationale: ‘व्यभिचार’ यौन पाप का अर्थ देता है और मूर्तिपूजक अथवा आत्मिक बेवफाई के रूपक को भी खुला रखता है; पाठ किसी एक स्तर तक सीमित नहीं किया गया।
- issue: ἔφθειρεν का अर्थ
  choice: भ्रष्ट किया
  alternative: नाश किया
  rationale: व्यभिचार के माध्यम से की गई क्रिया के कारण ‘भ्रष्ट किया’ अधिक संगत है, जबकि φθείρω में उपस्थित विनाशकारी परिणाम को संदर्भ से बाहर नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘बड़ी वेश्या’, ‘व्यभिचार’, ‘दासों के लहू’ और ‘उसके हाथ से’ जैसे प्रबल बाइबलीय चित्रों को नरम नहीं किया गया। वाक्य का आरम्भ ‘क्योंकि’ से मूल पाठ और पिछले पद से उसका संबंध बनाए रखता है।
