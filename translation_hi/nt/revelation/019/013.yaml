  text: καὶ περιβεβλημένος ἱμάτιον ⸀βεβαμμένον αἵματι, καὶ ⸀κέκληται τὸ ὄνομα αὐτοῦ ὁ Λόγος τοῦ Θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/013.yaml
  text: And he is clothed in a robe dipped in blood[a], and his name is called the Word of God.
translation:
  language: hi
  text: और वह लहू में डुबोया हुआ वस्त्र पहने हुए है[a], और उसका नाम “परमेश्वर का वचन” कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लहू से सना हुआ।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “डुबोया हुआ” या “रँगा हुआ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβεβλημένος
  choice: पहने हुए है
  rationale: पूर्णकालिक कृदंत उसकी वर्तमान अवस्था बताता है; यह हिन्दी में स्वाभाविक रूप से उस स्थायी दृश्य-अवस्था को व्यक्त करता है।
- source_word: ἱμάτιον
  choice: वस्त्र
  rationale: यह सामान्य बाहरी परिधान का शब्द है। ‘वस्त्र’ गरिमापूर्ण और स्वाभाविक है तथा ‘चोगा’ जैसे अधिक विशिष्ट अर्थ को नहीं थोपता।
- source_word: βεβαμμένον αἵματι
  choice: लहू में डुबोया हुआ
  rationale: βάπτω का मूल भाव डुबोने या रंगने का है। यह अनुवाद यूनानी की प्रबल छवि को बनाए रखता है; ‘लहू से सना हुआ’ सम्भव अर्थ के रूप में पादटिप्पणी में दिया गया है।
- source_word: κέκληται
  choice: कहलाता है
  rationale: καλέω का पूर्णकालिक कर्मवाच्य यहाँ दिए गए नाम या उपाधि की वर्तमान मान्यता व्यक्त करता है; ‘कहलाता है’ सहज हिन्दी है।
- source_word: τὸ ὄνομα αὐτοῦ
  choice: उसका नाम
  rationale: यूनानी संबंधसूचक रचना का स्वाभाविक हिन्दी रूप।
- source_word: ὁ Λόγος τοῦ Θεοῦ
  choice: परमेश्वर का वचन
  rationale: λόγος यहाँ सवार की व्यक्तिगत उपाधि है, केवल संदेश नहीं। ‘वचन’ हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए परिचित है।
theological_decisions:
- issue: मसीह-संबंधी उपाधि λόγος
  choice: परमेश्वर का वचन
  alternative: परमेश्वर का संदेश
  rationale: संदर्भ में ὁ Λόγος τοῦ Θεοῦ सवार के व्यक्तिगत नाम या उपाधि के रूप में आता है। ‘वचन’ इस उपाधिगत और मसीह-संबंधी भार को बनाए रखता है, जबकि ‘संदेश’ इसे अमूर्त कथन बना सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘लहू’ प्रकाशितवाक्य की तीव्र दृश्यात्मक और बाइबलीय शैली के अनुकूल है। मुख्य पाठ में आवश्यक पादटिप्पणी चिह्न [a] रखा गया है।
