id: REV.19.12
reference: Revelation 19:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δὲ ὀφθαλμοὶ ⸀αὐτοῦ φλὸξ πυρός, καὶ ἐπὶ τὴν κεφαλὴν αὐτοῦ διαδήματα πολλά, ⸀ἔχων ὄνομα γεγραμμένον ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/012.yaml
  text: His eyes were a flame of fire, and on his head were many crowns, and he had a name written that no one knows except himself.
translation:
  language: hi
  text: उसकी आँखें आग की ज्वाला थीं, और उसके सिर पर बहुत से राजमुकुट थे। वह एक लिखा हुआ नाम धारण किए हुए था, जिसे केवल वह स्वयं जानता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ... ὀφθαλμοὶ αὐτοῦ
  choice: उसकी आँखें
  rationale: सम्बन्धवाचक यूनानी रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: δὲ
  choice: —
  rationale: यहाँ यह वर्णन को आगे बढ़ाने वाला हल्का संयोजक है; हिन्दी में अलग शब्द देने की आवश्यकता नहीं।
- source_word: φλὸξ πυρός
  choice: आग की ज्वाला
  rationale: मूल में स्पष्ट उपमासूचक शब्द नहीं है; इसलिए रूपक की तीव्रता को बिना ‘जैसी’ जोड़े सुरक्षित रखा गया है।
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: उसके सिर पर
  rationale: स्थानसूचक अर्थ का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: διαδήματα πολλά
  choice: बहुत-से राजमुकुट
  rationale: διάδημα विशेष रूप से राजसत्ता के मुकुट को दर्शाता है; ‘राजमुकुट’ आधुनिक पाठक के लिए स्पष्ट और ‘डायडेम’ से अधिक सहज है।
- source_word: ἔχων ὄνομα γεγραμμένον
  choice: वह एक लिखा हुआ नाम धारण किए हुए था
  rationale: ‘धारण किए हुए’ कृदन्त की निरंतर वर्णनात्मक शक्ति बनाए रखता है और नाम कहाँ लिखा था, यह मूल से आगे बढ़कर निश्चित नहीं करता।
- source_word: ὃ οὐδεὶς οἶδεν εἰ μὴ αὐτός
  choice: जिसे स्वयं उसके सिवा कोई नहीं जानता
  rationale: अपवाद और कर्ता पर बल दोनों सुरक्षित रहते हैं; οἶδεν का वर्तमान अर्थ ‘जानता’ से व्यक्त किया गया है।
theological_decisions:
- issue: लिखे हुए नाम को जानने वाले की विशिष्टता
  choice: नाम को उस सवार के सिवा कोई नहीं जानता
  alternative: इसे केवल नाम की व्यापक अगम्यता पर बल देने वाला कथन समझना
  rationale: यूनानी पाठ स्पष्टतः ‘स्वयं उसके सिवा’ कहता है। अनुवाद इस विशिष्टता को बनाए रखता है, पर उसके धर्मवैज्ञानिक निहितार्थों की अतिरिक्त व्याख्या नहीं करता।
- issue: आँखों और आग की ज्वाला का सम्बन्ध
  choice: 'प्रत्यक्ष रूपक: ‘आँखें आग की ज्वाला थीं’'
  alternative: 'उपमा: ‘आँखें आग की ज्वाला जैसी थीं’'
  rationale: मूल यूनानी खंड में ‘जैसी’ के लिए कोई स्पष्ट उपमासूचक पद नहीं है; इसलिए वास्तविक अस्पष्टता को रूपक के रूप में रहने दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘राजमुकुट’ राजकीय अर्थ को स्पष्ट करता है। वाक्य में दर्शन-वर्णन के लिए भूतकाल रखा गया है, जबकि नाम के ज्ञान के विषय में यूनानी वर्तमान बल के अनुरूप ‘जानता’ रखा गया है।
