- from: उसकी आँखें आग की ज्वाला थीं, और उसके सिर पर बहुत-से राजमुकुट थे। वह एक लिखा हुआ नाम धारण किए हुए था, जिसे स्वयं उसके सिवा कोई नहीं जानता।
  to: उसकी आँखें आग की ज्वाला थीं, और उसके सिर पर बहुत से राजमुकुट थे। वह एक लिखा हुआ नाम धारण किए हुए था, जिसे केवल वह स्वयं जानता है।
  rationale: The revision retains the draft’s faithful metaphor, royal-crown terminology, and restraint concerning the location of the written name. It replaces only the awkward exception-clause wording with an idiomatic Hindi expression that preserves the Greek emphasis that the rider alone knows the name, and standardizes spacing in ‘बहुत से.’
