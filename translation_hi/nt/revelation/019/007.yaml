source:
  edition: SBLGNT
  text: χαίρωμεν καὶ ⸀ἀγαλλιῶμεν, καὶ ⸀δώσομεν τὴν δόξαν αὐτῷ, ὅτι ἦλθεν ὁ γάμος τοῦ ἀρνίου, καὶ ἡ γυνὴ αὐτοῦ ἡτοίμασεν ἑαυτήν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/007.yaml
  text: Let us rejoice and exult[a], and let us give glory to him, because the marriage of the Lamb has come[b], and his bride has made herself ready.
translation:
  language: hi
  text: आओ, हम आनन्दित हों और उल्लास मनाएँ, और उसे महिमा दें[a], क्योंकि मेम्ने का विवाह आ पहुँचा है, और उसकी दुल्हन[b] ने अपने आपको तैयार कर लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम उसे महिमा देंगे।” यूनानी क्रिया भविष्यत्काल में है, यद्यपि यहाँ वह सम्भवतः “आनन्दित हों” और “उल्लास मनाएँ” के समान आग्रह का भाव रखती है।
    reason: alternative_reading
  - marker: b
    text: या, “उसकी पत्नी।” यूनानी γυνή का अर्थ “स्त्री,” “पत्नी,” या विवाह के प्रसंग में “दुल्हन” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χαίρωμεν
  choice: आओ, हम आनन्दित हों
  rationale: प्रथम पुरुष बहुवचन संभावनार्थक रूप यहाँ सामूहिक आग्रह व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀγαλλιῶμεν
  choice: उल्लास मनाएँ
  rationale: यह पहले क्रिया-पद से अधिक प्रबल, उमंग-भरे आनन्द को व्यक्त करता है और दोनों यूनानी क्रियाओं का भेद बनाए रखता है।
- source_word: δώσομεν τὴν δόξαν αὐτῷ
  choice: उसे महिमा दें
  rationale: रूप भविष्यत्काल का है, पर इस उपासना-संबंधी आग्रह-क्रम में इसे पिछले दो आग्रहात्मक क्रिया-पदों के समान सामूहिक आह्वान के रूप में प्रस्तुत किया गया है।
- source_word: ἦλθεν
  choice: आ पहुँचा है
  rationale: यह पूर्ण हो चुके आगमन और उसकी वर्तमान प्रासंगिकता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ γάμος τοῦ ἀρνίου
  choice: मेम्ने का विवाह
  rationale: γάμος विवाह, विवाहोत्सव या विवाह-भोज का बोध करा सकता है; यहाँ ‘विवाह’ निकटतम है और अगले पद में स्पष्ट भोज को समय से पहले नहीं जोड़ता।
- source_word: ἡ γυνὴ αὐτοῦ
  choice: उसकी दुल्हन
  rationale: γυνή का अर्थ स्त्री, पत्नी या विवाह-प्रसंग में दुल्हन हो सकता है; आसन्न विवाह और तैयारी के संदर्भ में ‘दुल्हन’ सर्वाधिक स्वाभाविक है।
- source_word: ἡτοίμασεν ἑαυτήν
  choice: अपने आपको तैयार कर लिया है
  rationale: यह यूनानी के आत्मवाचक भाव को स्पष्ट रखता है और वैवाहिक तैयारी के संदर्भ में सहज हिन्दी है।
theological_decisions:
- issue: विवाह-रूपक में γυνὴ αὐτοῦ का अर्थ
  choice: उसकी दुल्हन
  alternative: उसकी पत्नी
  rationale: दृश्य विवाह के आगमन और उसकी तैयारी पर केंद्रित है, इसलिए ‘दुल्हन’ प्रसंगानुकूल है; फिर भी ‘पत्नी’ यूनानी शब्द का वास्तविक वैकल्पिक अर्थ है और टिप्पणी में सुरक्षित रखा गया है।
- issue: आग्रहात्मक क्रम में δώσομεν का बल
  choice: उसे महिमा दें
  alternative: हम उसे महिमा देंगे
  rationale: भविष्यत्कालीन रूप होते हुए भी यह आनन्दित होने और उल्लास मनाने के सामूहिक आह्वान के साथ एक ही क्रम में आता है; इसलिए मुख्य पाठ में आग्रहात्मक अर्थ रखा गया है और शाब्दिक भविष्यत्काल टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना के योग्य रखी गई है। ‘आनन्दित हों’ और ‘उल्लास मनाएँ’ साथ रखकर समानार्थी यूनानी क्रियाओं की बढ़ती तीव्रता बचाई गई है; ‘मेम्ना’ प्रकाशितवाक्य के मसीह-संबंधी शीर्षक के रूप में प्रयुक्त है।
