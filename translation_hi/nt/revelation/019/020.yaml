id: REV.19.20
reference: Revelation 19:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπιάσθη τὸ θηρίον καὶ ⸂μετ’ αὐτοῦ ὁ⸃ ψευδοπροφήτης ὁ ποιήσας τὰ σημεῖα ἐνώπιον αὐτοῦ, ἐν οἷς ἐπλάνησεν τοὺς λαβόντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ· ζῶντες ἐβλήθησαν οἱ δύο εἰς τὴν λίμνην τοῦ πυρὸς ⸂τῆς καιομένης⸃ ἐν θείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/020.yaml
  text: And the beast was captured[a], and with it the false prophet who had performed the signs in its presence, by which he deceived those who had received the mark of the beast and those who worshiped its image[b]. The two of them were thrown alive into the lake of fire that burns with sulfur.
translation:
  language: hi
  text: और वह पशु पकड़ लिया गया, और उसके साथ वह झूठा भविष्यद्वक्ता भी, जिसने उसके सामने वे चिन्ह दिखाए थे जिनके द्वारा उसने उन लोगों को भरमाया था जिन्होंने पशु की छाप ली थी और जो उसकी मूर्ति की आराधना करते थे। वे दोनों जीवित ही उस आग की झील में डाल दिए गए जो गंधक से जलती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιάσθη
  choice: पकड़ लिया गया
  rationale: यह πιάζω के भूतकालिक कर्मवाच्य का स्वाभाविक हिन्दी रूप है और पकड़े या धर लिए जाने की घटना को व्यक्त करता है।
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य की स्थापित प्रतीकात्मक छवि को बनाए रखते हुए यह θηρίον का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: हिन्दी में ‘पशु’ पुल्लिंग है, इसलिए ‘उसके’ व्याकरणतः स्वाभाविक है; इससे यूनानी के संदर्भ में कोई अतिरिक्त व्यक्तिकरण आवश्यक नहीं होता।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यद्वक्ता
  rationale: यौगिक संज्ञा का सीधा, परिचित और अर्थ-सटीक अनुवाद।
- source_word: ὁ ποιήσας τὰ σημεῖα
  choice: जिसने ... वे चिन्ह दिखाए थे
  rationale: अपूर्ण भूतकाल से पहले संपन्न क्रिया को ‘दिखाए थे’ व्यक्त करता है; सन्दर्भ में चिन्हों को प्रकट या प्रदर्शित करना स्वाभाविक हिन्दी है।
- source_word: σημεῖα
  choice: चिन्ह
  rationale: यह केवल चमत्कारिकता नहीं, बल्कि संकेतात्मक अर्थ को भी सुरक्षित रखता है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: ἐνώπιον का सीधा और सहज हिन्दी रूप, जिसका संदर्भ पशु है।
- source_word: ἐν οἷς
  choice: जिनके द्वारा
  rationale: चिन्हों को भरमाने के साधन के रूप में स्पष्ट करते हुए यूनानी के करणार्थक भाव को व्यक्त करता है।
- source_word: ἐπλάνησεν
  choice: भरमाया
  rationale: πλανάω के धोखा देने और मार्ग से भटकाने, दोनों भावों को सहज हिन्दी में समेटता है।
- source_word: τοὺς λαβόντας
  choice: जिन्होंने ... छाप ली थी
  rationale: निर्णय के दृश्य से पहले छाप ग्रहण किए जाने का भाव ‘ली थी’ से स्पष्ट होता है।
- source_word: χάραγμα
  choice: छाप
  rationale: यह अंकित पहचान, मुहर या चिह्न के अर्थ को व्यक्त करता है और प्रकाशितवाक्य के प्रसंग में स्वाभाविक है।
- source_word: προσκυνοῦντας
  choice: आराधना करते थे
  rationale: प्रसंग में यह केवल झुकने के बजाय धार्मिक भक्ति या उपासना को दर्शाता है।
- source_word: ζῶντες
  choice: जीवित ही
  rationale: दोनों के जीवित अवस्था में फेंके जाने पर यूनानी के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λίμνην τοῦ πυρὸς ... ἐν θείῳ
  choice: आग की झील ... जो गंधक से जलती है
  rationale: न्याय की ठोस प्रकाशनात्मक छवि को बिना सिद्धान्तगत विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: पशु के लिए सर्वनाम
  choice: हिन्दी व्याकरण के अनुसार ‘उसके/उसकी’
  alternative: निर्जीवता दिखाने के लिए अस्वाभाविक सर्वनाम या बार-बार ‘पशु’ कहना
  rationale: यूनानी θηρίον नपुंसकलिंग है, पर हिन्दी ‘पशु’ पुल्लिंग है। हिन्दी का व्याकरणिक सर्वनाम किसी अतिरिक्त व्यक्तिवादी व्याख्या को अनिवार्य नहीं करता।
- issue: अन्तिम न्याय की छवि
  choice: ‘आग की झील ... जो गंधक से जलती है’ को ठोस रूप में बनाए रखना
  alternative: इसे ‘नरक’ या किसी विस्तृत सिद्धान्तगत व्याख्या से बदलना
  rationale: पद में दी गई प्रकाशनात्मक छवि को ज्यों का त्यों रखा गया है और बाद की धर्मवैज्ञानिक अवधारणाएँ नहीं जोड़ी गईं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। वाक्य-संरचना मूल के क्रम और सम्बन्धों को पर्याप्त निकटता से रखती है, पर हिन्दी में स्वाभाविक प्रवाह के लिए ‘भी’ और ‘ही’ का प्रयोग किया गया है।
