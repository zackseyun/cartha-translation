id: REV.19.5
reference: Revelation 19:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν λέγουσα· Αἰνεῖτε ⸂τῷ θεῷ⸃ ἡμῶν, πάντες οἱ δοῦλοι αὐτοῦ, ⸀καὶ οἱ φοβούμενοι αὐτόν, οἱ μικροὶ καὶ οἱ μεγάλοι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/005.yaml
  text: And a voice came from the throne[a], saying, “Praise our God, all his servants, and those who fear him[b], the small and the great.”
translation:
  language: hi
  text: और सिंहासन से एक आवाज़ निकली और बोली, “हमारे परमेश्वर की स्तुति करो—तुम सब जो उसके दास हो और जो उसका भय मानते हो, छोटे और बड़े।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνὴ ἀπὸ τοῦ θρόνου ἐξῆλθεν
  choice: सिंहासन से एक आवाज़ निकली
  rationale: यह अभिव्यक्ति आवाज़ के स्रोत और ἐξέρχομαι के निकलने के भाव को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: Αἰνεῖτε τῷ θεῷ ἡμῶν
  choice: हमारे परमेश्वर की स्तुति करो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और प्रचलित हिन्दी रूप है; सम्बन्धकारक रचना हिन्दी में स्तुति के लक्ष्य को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: πάντες οἱ δοῦλοι αὐτοῦ
  choice: तुम सब जो उसके दास हो
  rationale: दास, δοῦλοι में निहित स्वामित्व और पूर्ण अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है और हिन्दी बाइबलीय शैली में बोधगम्य है।
- source_word: οἱ φοβούμενοι αὐτόν
  choice: जो उसका भय मानते हो
  rationale: यह परमेश्वर के प्रति श्रद्धापूर्ण भय के बाइबलीय मुहावरे को केवल ‘आदर’ में सीमित किए बिना सुरक्षित रखता है।
- source_word: οἱ μικροὶ καὶ οἱ μεγάλοι
  choice: छोटे और बड़े
  rationale: यह यूनानी युग्म की संक्षिप्तता बनाए रखता है और निम्न तथा उच्च हैसियत वाले सभी लोगों को समेटता है।
theological_decisions:
- issue: δοῦλοι का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: इस स्वर्गीय उपासना के प्रसंग में यह शब्द परमेश्वर से सम्बन्धित होने, उसकी अधीनता और निष्ठा का प्रबल भाव रखता है; ‘दास’ उस तनाव को सुरक्षित रखता है।
- issue: परमेश्वर का भय मानने का अर्थ
  choice: उसका भय मानते हो
  alternative: उसका श्रद्धापूर्वक आदर करते हो
  rationale: मुख्य पाठ में ‘भय’ रखने से श्रद्धा, विस्मय और जवाबदेह निष्ठा का व्यापक बाइबलीय अर्थ बना रहता है; इसे केवल आदर तक सीमित नहीं किया गया।
- issue: अन्तिम पदबंध का सम्बन्ध
  choice: दासों और भय मानने वालों को एक संयुक्त सम्बोधन के रूप में रखना
  alternative: ‘छोटे और बड़े’ को केवल भय मानने वालों का स्पष्टीकरण मानना
  rationale: यूनानी वाक्य-विन्यास में सम्बन्ध कुछ हद तक खुला है। हिन्दी विराम और संयुक्त सम्बोधन सभी वर्णनों को परमेश्वर की स्तुति के लिए बुलाए गए समुदाय पर लागू रहने देते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज बाइबलीय शैली। ‘आवाज़ निकली’ स्रोत-चित्र को बनाए रखता है, और उद्धरण में ‘तुम’ जोड़ने से बहुवचन आज्ञा तथा सम्बोधन हिन्दी में स्पष्ट और स्वाभाविक होता है।
