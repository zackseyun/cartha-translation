reference: Revelation 19:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶδον τὸ θηρίον καὶ τοὺς βασιλεῖς τῆς γῆς καὶ τὰ στρατεύματα αὐτῶν συνηγμένα ποιῆσαι ⸀τὸν πόλεμον μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου καὶ μετὰ τοῦ στρατεύματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/019.yaml
  text: And I saw the beast and the kings of the earth and their armies gathered to make war against the one seated on the horse and against his army[a][b].
translation:
  language: hi
  text: और मैंने उस पशु, पृथ्वी के राजाओं और उनकी सेनाओं को घोड़े पर बैठे हुए जन और उसकी सेना के विरुद्ध युद्ध करने के लिए इकट्ठे हुए देखा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एकत्र हुए।’
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से ‘के साथ युद्ध करने’; प्रसंग में भाव शत्रुतापूर्ण है: ‘के विरुद्ध युद्ध करने।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य में यह एक विशिष्ट और भयावह प्रतीकात्मक प्राणी के लिए प्रयुक्त पद है; ‘पशु’ इस स्थापित अर्थ को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: βασιλεῖς τῆς γῆς
  choice: पृथ्वी के राजा
  rationale: प्रकाशितवाक्य के विश्वव्यापी प्रलय-दर्शी संदर्भ में γῆ का अर्थ यहाँ केवल किसी स्थानीय ‘देश’ के बजाय ‘पृथ्वी’ अधिक उपयुक्त है।
- source_word: στρατεύματα αὐτῶν
  choice: उनकी सेनाएँ
  rationale: बहुवचन στρατεύματα और युद्ध के प्रसंग के अनुसार ‘सेनाएँ’ स्वाभाविक सैन्य अभिव्यक्ति है।
- source_word: συνηγμένα
  choice: इकट्ठा हुआ
  rationale: पूर्ण निष्क्रिय कृदन्त उस समूह की ऐसी अवस्था बताता है जिसमें उसे एकत्र किया जा चुका है; हिन्दी में संयुक्त कर्म-समूह के अंतिम निकटवर्ती पद ‘सेनाओं’ के साथ ‘इकट्ठा हुआ’ सामूहिक रूप से पढ़ा जाता है।
- source_word: ποιῆσαι τὸν πόλεμον
  choice: युद्ध करने के लिए
  rationale: यह युद्ध छेड़ने या लड़ने का प्रचलित यूनानी मुहावरा है; ‘युद्ध करने’ से उसका अर्थ आधुनिक हिन्दी में स्पष्ट रहते हुए संरचना भी पर्याप्त निकट रहती है।
- source_word: μετὰ τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: घोड़े पर बैठे हुए जन के विरुद्ध
  rationale: यद्यपि μετά + संबंधकारक सामान्यतः ‘के साथ’ होता है, युद्ध के प्रसंग में इसका भाव विरोधी है। कृदन्तीय वर्णन को किसी स्पष्ट मसीही उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: μετὰ τοῦ στρατεύματος αὐτοῦ
  choice: उसकी सेना के विरुद्ध
  rationale: दूसरे μετά-वाक्यांश में भी युद्ध का संदर्भ विरोध का अर्थ देता है; एकवचन στρατεύματος को सामूहिक ‘सेना’ रखा गया है।
theological_decisions:
- issue: घोड़े पर बैठे हुए जन की पहचान
  choice: वर्णनात्मक अभिव्यक्ति को यथावत रखा गया
  alternative: ‘मसीह’ अथवा किसी अन्य स्पष्ट मसीही उपाधि का प्रयोग
  rationale: निकटवर्ती साहित्यिक संदर्भ सवार की पहचान स्पष्ट करता है, पर इस पद में यूनानी पाठ केवल कृदन्तीय वर्णन देता है। उसी को बनाए रखने से पाठ में अनुपस्थित उपाधि नहीं जोड़ी जाती।
- issue: μετά का संबंधपरक अर्थ
  choice: ‘के विरुद्ध’
  alternative: शाब्दिक ‘के साथ’
  rationale: ποιῆσαι τὸν πόλεμον के युद्धात्मक संदर्भ में सहभागिता नहीं, शत्रुतापूर्ण विरोध अभिप्रेत है; पादटिप्पणी मूल संरचना को दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण प्रकाशन-शैली। ‘फिर मैंने’ दृष्टान्त-क्रम को स्वाभाविक बनाता है। ‘जन’ का प्रयोग तो किया गया है ताकि τοῦ καθημένου का वर्णनात्मक, व्यक्तिवाचक स्वरूप बना रहे और उसे केवल ‘सवार’ कहकर संक्षिप्त न किया जाए। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
