  text: And the rest were killed by the sword of the one seated on the horse[a], the sword that came out from his mouth[b], and all the birds were filled from their flesh.
translation:
  language: hi
  text: और शेष लोग उस तलवार से मार डाले गए[a] जो घोड़े पर बैठे हुए की थी और उसके मुँह से निकली थी[b]; और सभी पक्षी उनके मांस से तृप्त हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वध कर दिए गए।’
    reason: lexical_alternative
  - marker: b
    text: मुँह से निकलने वाली ‘तलवार’ प्रलय-दर्शी चित्रभाषा है; प्रकाशितवाक्य 19:15 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: οἱ λοιποὶ
  choice: शेष लोग
  rationale: यह पद पिछले प्रसंग में पशु और झूठे भविष्यद्वक्ता से अलग बचे हुए लोगों को सामूहिक रूप से सूचित करता है; ‘शेष लोग’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀπεκτάνθησαν
  choice: मार डाले गए
  rationale: ἀποκτείνω के एओरिस्ट कर्मवाच्य को स्पष्ट आधुनिक हिन्दी में कर्मवाच्य रूप में रखा गया है।
- source_word: ἐν τῇ ῥομφαίᾳ
  choice: तलवार से
  rationale: ἐν और करणवाचक रूप यहाँ साधन सूचित करते हैं; ‘तलवार से’ हिन्दी में स्वाभाविक रूप से instrumentality व्यक्त करता और ठोस बिंब बनाए रखता है।
- source_word: τοῦ καθημένου ἐπὶ τοῦ ἵππου
  choice: उस घोड़े पर बैठे हुए की
  rationale: कृदन्तीय यूनानी रचना को निकटता से रखते हुए सवार की पहचान को अनावश्यक रूप से विस्तृत नहीं किया गया।
- source_word: τῇ ἐξελθούσῃ ἐκ τοῦ στόματος αὐτοῦ
  choice: उस तलवार से, जो उसके मुँह से निकली थी
  rationale: स्त्रीलिंग कृदन्त ‘तलवार’ को विशेषित करता है; हिन्दी में संज्ञा को दोहराने से संबंध स्पष्ट और प्रकाशन का दृश्यात्मक बिंब सुरक्षित रहता है।
- source_word: πάντα τὰ ὄρνεα
  choice: सभी पक्षियों
  rationale: ὄρνεα का सामान्य अर्थ ‘पक्षी’ है। संदर्भ मांसभक्षी पक्षियों का संकेत देता है, पर मूल शब्द में ‘शिकारी’ या ‘गिद्ध’ जोड़ा नहीं गया।
- source_word: ἐχορτάσθησαν
  choice: पेट भर लिया
  rationale: χορτάζω तृप्त होकर खाने का भाव देता है। शाब्दिक ‘भर गए’ की अपेक्षा ‘पेट भर लिया’ वर्तमान हिन्दी में अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ τῶν σαρκῶν αὐτῶν
  choice: उनका मांस खाकर
  rationale: ἐκ स्रोत को सूचित करता है, जबकि σάρξ यहाँ वास्तविक देह-मांस है। ‘मांस खाकर पेट भर लिया’ स्रोत और भोजन दोनों का अर्थ सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सवार के मुँह से निकलने वाली तलवार का स्वरूप
  choice: मुख्य पाठ में ठोस प्रलय-दर्शी बिंब ‘तलवार…जो उसके मुँह से निकली थी’ बनाए रखा गया।
  alternative: तलवार को सीधे उसके वचन अथवा न्याय के रूप में समझाकर अनुवाद करना।
  rationale: मूल पद प्रतीक की व्याख्या नहीं करता। अतः अनुवाद उसके बिंब और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है; संक्षिप्त टिप्पणी केवल उसके प्रलय-दर्शी स्वरूप और समानांतर पद की ओर संकेत करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मार डाले गए’ कर्मवाच्य को बनाए रखता है; ‘पेट भर लिया’ χορτάζω को मुहावरेदार ढंग से व्यक्त करता है। डैश द्वारा दोहराए गए ‘तलवार’ पदबंध को स्पष्ट किया गया है, और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
