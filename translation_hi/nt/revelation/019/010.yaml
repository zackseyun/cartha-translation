id: REV.19.10
reference: Revelation 19:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ προσκυνῆσαι αὐτῷ. καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ· τῷ θεῷ προσκύνησον· ἡ γὰρ ⸀μαρτυρία Ἰησοῦ ἐστιν τὸ πνεῦμα τῆς προφητείας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/010.yaml
  text: And I fell before his feet to worship him[a]. But he says to me, “See that you do not! I am a fellow servant with you and with your brothers who hold the testimony of Jesus. Worship God[c][b], for the testimony of Jesus is the spirit of prophecy.”
translation:
  language: hi
  text: और मैं उसकी आराधना करने के लिए उसके पैरों के सामने गिर पड़ा। पर उसने मुझसे कहा, “सावधान! ऐसा मत करो! मैं तुम्हारा और तुम्हारे उन भाइयों[b] के साथ सह-दास[c] हूँ, जिनके पास यीशु की गवाही है। परमेश्वर की आराधना करो! क्योंकि यीशु की गवाही[a] भविष्यवाणी की आत्मा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यीशु की गवाही’ का अर्थ ‘यीशु के विषय में गवाही’ या ‘यीशु की अपनी गवाही’ हो सकता है। यही अस्पष्टता इस पद में पहले आए इसी वाक्यांश पर भी लागू होती है।
    reason: alternative_reading
  - marker: b
    text: ‘भाइयों’ से यहाँ प्रतिनिधिक रूप से ‘भाइयों और बहनों,’ अर्थात संगी विश्वासियों, का बोध हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘सह-सेवक।’ यूनानी शब्द साझा दासत्व या सेवा की स्थिति बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔπεσα ἔμπροσθεν τῶν ποδῶν αὐτοῦ
  choice: उसके पैरों के सामने गिर पड़ा
  rationale: यह अनुवाद शारीरिक मुद्रा और ἔμπροσθεν (‘सामने’) दोनों को बनाए रखता है; केवल ‘पैरों पर’ कहना अपेक्षाकृत कम स्पष्ट होता।
- source_word: προσκυνῆσαι αὐτῷ / προσκύνησον
  choice: उसकी आराधना करने के लिए / परमेश्वर की आराधना करो
  rationale: स्वर्गदूत इस कार्य को अस्वीकार करके उसे परमेश्वर की ओर निर्देशित करता है, इसलिए यहाँ केवल ‘दण्डवत करना’ नहीं, बल्कि धार्मिक आराधना अभिप्रेत है।
- source_word: Ὅρα μή
  choice: सावधान! ऐसा मत करो!
  rationale: यह संक्षिप्त और तीखा निषेध है। आधुनिक हिन्दी में यह रूप यूनानी की चेतावनी और आकस्मिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σύνδουλος
  choice: सह-दास
  rationale: यह शब्द साझा दासत्व और परमेश्वर के अधीन समान स्थिति पर बल देता है। ‘सह-सेवक’ अधिक सहज विकल्प है, पर दासत्व की शक्ति को कुछ कम कर देता है।
- source_word: ἀδελφῶν σου
  choice: तुम्हारे उन भाइयों
  rationale: यूनानी में पुल्लिंग बहुवचन ‘भाइयों’ है; इसे मुख्य पाठ में बनाए रखा गया है, जबकि प्रसंग में इसके प्रतिनिधिक रूप से सभी संगी विश्वासियों को समेटने की संभावना पादटिप्पणी में दी गई है।
- source_word: τῶν ἐχόντων τὴν μαρτυρίαν Ἰησοῦ
  choice: जो यीशु की गवाही रखते हैं
  rationale: ἔχω का सीधा अर्थ ‘रखना/पास होना’ है। यह रूप ‘यीशु की गवाही’ में निहित संबंध की अस्पष्टता को बिना सुलझाए बनाए रखता है।
- source_word: μαρτυρία Ἰησοῦ
  choice: यीशु की गवाही
  rationale: Ἰησοῦ संबंधकारक का अर्थ ‘यीशु के विषय में गवाही’ अथवा ‘यीशु द्वारा दी गई गवाही’ हो सकता है। शाब्दिक हिन्दी दोनों संभावनाओं को खुला रखती है।
- source_word: πνεῦμα τῆς προφητείας
  choice: भविष्यवाणी की आत्मा
  rationale: πνεῦμα धर्मवैज्ञानिक भार वाला शब्द है; ‘सार’ कहने से उसका अर्थ समय से पहले सीमित हो जाता। औपचारिक रूप मूल की अर्थगत गुंजाइश बनाए रखता है।
theological_decisions:
- issue: ‘यीशु की गवाही’ में संबंधकारक का अर्थ
  choice: मुख्य पाठ में अस्पष्ट ‘यीशु की गवाही’ बनाए रखना
  alternative: ‘यीशु के विषय में गवाही’ अथवा ‘यीशु की अपनी गवाही’
  rationale: यूनानी संबंधकारक वास्तव में वस्तुगत या कर्तृगत दोनों अर्थ दे सकता है। स्रोत किसी एक को अनिवार्य नहीं करता, इसलिए मुख्य पाठ में तनाव सुरक्षित रखा गया है और दोनों संभावनाएँ पादटिप्पणी में स्पष्ट की गई हैं।
- issue: σύνδουλος का अनुवाद
  choice: सह-दास
  alternative: सह-सेवक
  rationale: स्वर्गदूत स्वयं को आराधना के योग्य नहीं, बल्कि यूहन्ना और अन्य विश्वासियों के साथ परमेश्वर के अधीन बताता है। अतः साझा अधीनता और दासत्व का प्रबल अर्थ बनाए रखा गया है।
- issue: ‘भविष्यवाणी की आत्मा’ की पहचान
  choice: वाक्यांश को औपचारिक और खुला रखना
  alternative: ‘भविष्यवाणी का सार’
  rationale: πνεῦμα को केवल ‘सार’ मानना या किसी विशिष्ट धर्मवैज्ञानिक पहचान तक सीमित करना स्रोत से अधिक व्याख्या जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘सह-दास’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर मूल के साझा अधीन दासत्व को संक्षेप में सुरक्षित रखता है। तीखे निषेध को स्वाभाविक हिन्दी में ‘सावधान! ऐसा मत करो!’ कहा गया है।
