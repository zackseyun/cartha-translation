  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Γράψον· Μακάριοι οἱ εἰς τὸ δεῖπνον τοῦ γάμου τοῦ ἀρνίου κεκλημένοι. καὶ λέγει μοι· Οὗτοι οἱ λόγοι ἀληθινοὶ τοῦ θεοῦ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/019/009.yaml
  text: 'And he says to me[a], “Write: Blessed are those who have been invited to the wedding supper of the Lamb.” And he says to me[c][b], “These are the true words of God.”'
translation:
  language: hi
  text: 'और वह मुझसे कहता है, “लिखो: धन्य हैं वे जिन्हें मेम्ने के विवाह-भोज में बुलाया गया है[a]।” और वह मुझसे कहता है, “ये परमेश्वर के सत्य वचन हैं[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिन्हें मेम्ने के विवाह-भोज में आमंत्रित किया गया है।”
    reason: lexical_alternative
  - marker: b
    text: “सत्य” का अर्थ यहाँ “विश्वसनीय” भी हो सकता है; ये वचन सचमुच परमेश्वर के हैं और उन पर भरोसा किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γράψον
  choice: लिखो
  rationale: एकवचन आज्ञार्थक रूप की सीधी और स्वाभाविक हिन्दी; मूल में निहित न होने वाला कर्म नहीं जोड़ा गया।
- source_word: Μακάριοι
  choice: धन्य
  rationale: प्रकाशितवाक्य और नए नियम के धन्य-वचनों की गंभीर, धर्मवैचारिक भाषा को बनाए रखता है; ‘सुखी’ की अपेक्षा केवल मनोदशा का बोध नहीं कराता।
- source_word: οἱ εἰς τὸ δεῖπνον ... κεκλημένοι
  choice: वे जिन्हें ... भोज में बुलाया गया है
  rationale: पूर्ण निष्क्रिय कृदन्त उन लोगों की वर्तमान स्थिति बताता है जिन्हें बुलावा मिला है। भोज के प्रसंग में ‘बुलाया गया’ स्वाभाविक है और ‘आमंत्रित’ की तुलना में καλέω की व्यापक अर्थ-छाया भी बचाता है।
- source_word: δεῖπνον
  choice: भोज
  rationale: यह मुख्य या उत्सवी भोजन को दर्शाता है। हिन्दी में ‘विवाह-भोज’ स्वाभाविक है और ‘रात्रि-भोज’ से अधिक उपयुक्त रूप से उत्सव का भाव देता है।
- source_word: γάμου
  choice: विवाह
  rationale: γάμος विवाह अथवा विवाह-उत्सव को सूचित कर सकता है; δεῖπνον के साथ ‘विवाह-भोज’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: τοῦ ἀρνίου
  choice: मेम्ने के
  rationale: प्रकाशितवाक्य में ἀρνίον के स्थापित मसीही प्रतीक और बलिदानी अनुगूँज को बनाए रखता है।
- source_word: Οὗτοι οἱ λόγοι
  choice: ये ... वचन हैं
  rationale: संकेतवाचक सर्वनाम और संज्ञा को हिन्दी की स्वाभाविक विधेयात्मक रचना में प्रस्तुत किया गया है।
- source_word: ἀληθινοὶ
  choice: सत्य
  rationale: मूल विशेषण संदेश की सत्यता और विश्वसनीयता दोनों की पुष्टि करता है; ‘सत्य’ सर्वाधिक सीधा हिन्दी समतुल्य है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक का सीधा अनुवाद है; ‘परमेश्वर की ओर से’ कहने पर स्रोत का अर्थ अधिक स्पष्ट रूप से आरोपित हो जाता।
theological_decisions:
- issue: अंतकालीन भोज के प्रसंग में κεκλημένοι का अनुवाद
  choice: बुलाया गया
  alternative: आमंत्रित किया गया
  rationale: भोज के प्रसंग में दोनों सम्भव हैं। ‘बुलाया गया’ καλέω के शाब्दिक और व्यापक अर्थ को सुरक्षित रखता है, पर प्रभावशाली बुलाहट जैसी किसी विशिष्ट धर्मसैद्धांतिक व्याख्या को अनिवार्य नहीं करता; ‘आमंत्रित’ को पादटिप्पणी में रखा गया है।
- issue: δεῖπνον τοῦ γάμου में γάμου का अनुवाद
  choice: विवाह-भोज
  alternative: विवाह का भोज
  rationale: ‘विवाह-भोज’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है तथा विवाहोत्सव के भोजन की छवि स्पष्ट रखता है।
- issue: ἀληθινοὶ τοῦ θεοῦ में सत्यता और स्रोत का सम्बन्ध
  choice: परमेश्वर के सत्य वचन
  alternative: परमेश्वर की ओर से आए विश्वसनीय वचन
  rationale: चुना हुआ रूप यूनानी सम्बन्धकारक और ἀληθινοί की सीधी संरचना को बनाए रखता है। वैकल्पिक रूप स्रोत और विश्वसनीयता को व्याख्यात्मक ढंग से अधिक स्पष्ट करता, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। वर्तमानकालीन ‘कहता है’ से यूनानी ऐतिहासिक वर्तमान सुरक्षित है। ‘मेम्ना’, ‘धन्य’ और ‘वचन’ प्रकाशितवाक्य की स्थापित प्रतीकात्मक तथा शास्त्रीय भाषा को बनाए रखते हैं; अनावश्यक संस्कृतनिष्ठता से बचा गया है।
