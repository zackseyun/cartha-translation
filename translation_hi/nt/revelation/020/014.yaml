id: REV.20.14
reference: Revelation 20:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός. οὗτος ὁ ⸂θάνατος ὁ δεύτερός⸃ ἐστιν, ἡ λίμνη τοῦ πυρός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/014.yaml
  text: And Death and Hades were thrown into the lake of fire. This is the second death[a], the lake of fire.
translation:
  language: hi
  text: और मृत्यु और अधोलोक[a] आग की झील में फेंक दिए गए। यही दूसरी मृत्यु है—आग की झील।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘हेडीस’; इसका अर्थ मृतकों का लोक भी हो सकता है। यहाँ यह ‘आग की झील’ से अलग है, इसलिए ‘नरक’ अनुवाद भ्रामक हो सकता है; कुछ अनुवाद ‘कब्र’ भी कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: θάνατος
  choice: मृत्यु
  rationale: पहले वाक्यांश में ‘मृत्यु’ को अधोलोक के साथ मानवीकृत सत्ता के रूप में रखा गया है; दूसरे वाक्यांश में यही शब्द ‘दूसरी मृत्यु’ नामक न्याय की अवस्था को दर्शाता है। देवनागरी में बड़े अक्षरों का भेद न होने पर भी संदर्भ यह अंतर स्पष्ट करता है।
- source_word: ᾅδης
  choice: अधोलोक
  rationale: ‘अधोलोक’ मृतकों के लोक के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है। यह यहाँ आग की झील से अलग है, इसलिए ‘नरक’ कहना दोनों को अनुचित रूप से एक कर देता। यूनानी नाम और अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἐβλήθησαν
  choice: फेंक दिए गए
  rationale: बहुवचन कर्मवाच्य का स्वाभाविक आधुनिक हिन्दी रूप, जो बलपूर्वक डाल दिए जाने का भाव बनाए रखता है।
- source_word: λίμνη τοῦ πυρός
  choice: आग की झील
  rationale: सम्बन्धकारक पदबंध का सीधा और प्रचलित रूप, जो प्रकाशितवाक्य की प्रतीकात्मक छवि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: οὗτος
  choice: यही
  rationale: निर्देशक सर्वनाम और समतुल्यता पर बल को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θάνατος ὁ δεύτερος
  choice: दूसरी मृत्यु
  rationale: विशेषणयुक्त पद का स्वाभाविक हिन्दी रूप और प्रकाशितवाक्य की विशिष्ट अभिव्यक्ति को ज्यों का त्यों रखता है।
- source_word: ἡ λίμνη τοῦ πυρός
  choice: आग की झील
  rationale: यूनानी पाठ की पुनरावृत्ति को बनाए रखने के लिए वही पद दूसरी बार भी दोहराया गया है।
theological_decisions:
- issue: अन्तिम न्याय के प्रसंग में ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: हेडीस; कब्र; नरक
  rationale: पद में अधोलोक को आग की झील में फेंका जाता है, अतः दोनों अलग हैं। ‘नरक’ इस भेद को मिटा सकता है, जबकि केवल ‘कब्र’ अर्थ को अत्यधिक भौतिक बना सकती है। ‘अधोलोक’ भेद और मूल की व्यापकता को बेहतर बनाए रखता है।
- issue: θάνατος का मानवीकरण
  choice: दोनों स्थानों पर ‘मृत्यु’, जिसका साहित्यिक कार्य संदर्भ से स्पष्ट है
  alternative: पहले स्थान पर किसी व्याख्यात्मक उपाधि द्वारा मानवीकरण स्पष्ट करना
  rationale: हिन्दी लिपि में अंग्रेज़ी जैसे बड़े और छोटे अक्षरों का भेद नहीं है। कोई अतिरिक्त उपाधि जोड़ना मूल से आगे जाता; पहले वाक्य में अधोलोक के साथ फेंके जाने की क्रिया स्वयं मानवीकरण व्यक्त करती है।
- issue: दूसरी मृत्यु और आग की झील का सम्बन्ध
  choice: ‘यही दूसरी मृत्यु है—आग की झील’
  alternative: ‘इसका अर्थ दूसरी मृत्यु है’
  rationale: मूल का समतुल्यतासूचक कथन रखा गया है। डैश पुनरुक्त ‘आग की झील’ को व्याख्यात्मक समानाधिकरण के रूप में स्पष्ट करता है, पर उसके धर्मवैज्ञानिक स्वरूप को आगे परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और मृत्यु और अधोलोक’ में दोहरे ‘और’ को जानबूझकर रखा गया है, क्योंकि यह यूनानी καὶ ... καὶ की समन्वयी संरचना और दोनों मानवीकृत सत्ताओं की जोड़ी को दर्शाता है।
