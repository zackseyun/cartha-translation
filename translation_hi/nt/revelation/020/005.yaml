  edition: SBLGNT
  text: ⸀οἱ λοιποὶ τῶν νεκρῶν οὐκ ἔζησαν ἄχρι τελεσθῇ τὰ χίλια ἔτη. αὕτη ἡ ἀνάστασις ἡ πρώτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/005.yaml
  text: The rest of the dead did not come to life until the thousand years were finished[a]. This is the first resurrection.
translation:
  language: hi
  text: मरे हुओं में से बाकी लोग हज़ार वर्ष पूरे होने तक जीवित नहीं हुए[a]। यह पहला पुनरुत्थान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवित नहीं रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν νεκρῶν
  choice: बाकी मरे हुए लोग
  rationale: यह पदबंध पिछले पद में बताए गए जीवित होकर राज्य करने वालों के विपरीत शेष मृत लोगों को सूचित करता है। यह हिंदी में स्वाभाविक है और उस विरोध को बनाए रखता है।
- source_word: οὐκ ἔζησαν
  choice: जीवित नहीं हुए
  rationale: ζάω का अओरिस्ट यहाँ पुनरुत्थान के संदर्भ में जीवित होने की घटना बताता है। यह चयन हिंदी में स्पष्ट रहते हुए ‘जीए नहीं’ की संभावित शाब्दिक छाया को पादटिप्पणी में सुरक्षित रखता है।
- source_word: ἄχρι τελεσθῇ
  choice: जब तक ... पूरे न हो गए
  rationale: ἄχρι समय की अंतिम सीमा बताता है और τελεσθῇ अवधि के पूर्ण होने को। यह हिंदी रचना उस पूर्णतासूचक अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τὰ χίλια ἔτη
  choice: वे हज़ार वर्ष
  rationale: निश्चित उपपद पहले से उल्लिखित विशिष्ट हज़ार वर्षों की ओर संकेत करता है; ‘वे’ उस संदर्भगत निश्चितता को हिंदी में दर्शाता है।
- source_word: αὕτη ἡ ἀνάστασις ἡ πρώτη
  choice: यह पहला पुनरुत्थान है
  rationale: यह सीधा और प्रचलित हिंदी रूप है, जो संकेतवाचक शब्द का संदर्भ व्यापक ही रहने देता है और किसी विशिष्ट सहस्राब्दीवादी व्याख्या को नहीं जोड़ता।
theological_decisions:
- issue: ‘यह पहला पुनरुत्थान है’ में ‘यह’ का संदर्भ
  choice: संकेत को मूल पाठ की तरह अनिर्दिष्ट रखा गया है।
  alternative: इसे केवल पद 4 के शहीदों, सभी धर्मियों, अथवा किसी आत्मिक पुनरुत्थान के लिए स्पष्ट रूप से सीमित करना।
  rationale: यूनानी पाठ केवल ‘यह पहला पुनरुत्थान है’ कहता है। किसी खास अंत-समय संबंधी व्यवस्था को अनुवाद में जोड़ना पाठ की वास्तविक व्याख्यात्मक खिंचाव को मिटा देगा।
- issue: ἔζησαν का आशय
  choice: ‘जीवित नहीं हुए’
  alternative: ‘जीवित नहीं रहे/जीए नहीं’ अथवा इसे स्पष्ट रूप से आत्मिक जीवन कहना।
  rationale: निकट संदर्भ में मृत्यु, पुनरुत्थान और राज्य करने की भाषा के कारण जीवित होने का घटनात्मक अर्थ उपयुक्त है, पर अनुवाद इसके स्वरूप पर पाठ से अधिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पुनरुत्थान’ स्थापित बाइबलीय शब्दावली है; वाक्य विन्यास मूल की संक्षिप्तता और धर्मवैचारिक अस्पष्टता को बनाए रखता है।
