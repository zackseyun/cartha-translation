  text: And if anyone was not found written in the book of life[b][a], he was thrown into the lake of fire.
translation:
  language: hi
  text: और जिसका नाम जीवन की पुस्तक[b] में लिखा हुआ न पाया गया, उसे आग की झील में फेंक दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “जीवन के स्क्रॉल में।” यूनानी शब्द का अर्थ ‘पुस्तक’ या ‘स्क्रॉल’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: जिसका
  rationale: सशर्त अनिश्चित अभिव्यक्ति को ‘जिसका ... न पाया गया’ की स्वाभाविक हिन्दी रचना में व्यक्त किया गया है; यह किसी भी व्यक्ति पर लागू होने वाला खुला आशय बनाए रखती है।
- source_word: οὐχ εὑρέθη
  choice: न पाया गया
  rationale: एओरिस्ट कर्मवाच्य का सीधा और स्वाभाविक हिन्दी रूप, जो न्यायिक जाँच में अभिलेख न मिलने का भाव सुरक्षित रखता है।
- source_word: ἐν τῇ βίβλῳ τῆς ζωῆς
  choice: जीवन की पुस्तक में
  rationale: βίβλος के लिए ‘पुस्तक’ स्पष्ट, प्रचलित और इस प्रकाशन-साहित्यिक प्रसंग में स्वाभाविक है; ‘पुस्तक-पत्र’ या ‘लपेटा हुआ ग्रंथ’ अनावश्यक रूप से असहज होंगे।
- source_word: γεγραμμένος
  choice: लिखा हुआ
  rationale: पूर्ण कर्मवाच्य कृदंत की परिणामी अवस्था को ‘लिखा हुआ’ सीधे व्यक्त करता है और ‘पाया गया’ के साथ स्वाभाविक बैठता है।
- source_word: ἐβλήθη
  choice: फेंक दिया गया
  rationale: एओरिस्ट कर्मवाच्य की बलपूर्वक डालने की क्रिया को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है; ‘डाल दिया गया’ की तुलना में मूल क्रिया का बल अधिक सुरक्षित है।
- source_word: εἰς τὴν λίμνην τοῦ πυρός
  choice: आग की झील में
  rationale: मूल रूपक का सीधा और स्थापित हिन्दी रूप; न्याय के स्वरूप की कोई अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: τις ... γεγραμμένος / ἐβλήθη
  choice: जिसका ... उसे
  rationale: हिन्दी के सम्बन्धवाचक-सहसम्बन्धवाचक ढाँचे से अनिश्चित एकवचन व्यक्ति का उल्लेख स्वाभाविक और लिंग-निरपेक्ष ढंग से होता है, जबकि संख्या एकवचन ही रहती है।
theological_decisions:
- issue: अनिश्चित एकवचन व्यक्ति और व्याकरणिक लिंग
  choice: जिसका ... उसे
  alternative: यदि कोई ... वह
  rationale: यूनानी में अनिश्चित एकवचन के साथ पुल्लिंग एकवचन रूप है, पर हिन्दी में ‘जिसका ... उसे’ किसी पुरुष-विशेष का अर्थ आरोपित किए बिना उसी प्रतिनिधिक एकवचन को स्वाभाविक रूप से सुरक्षित रखता है।
- issue: अन्तिम न्याय की छवि
  choice: आग की झील
  alternative: अग्नि की झील
  rationale: मूल प्रकाशन-साहित्यिक छवि को बिना किसी सम्प्रदायगत व्याख्या के ज्यों का त्यों रखा गया है; ‘आग’ सामान्य आधुनिक पाठक के लिए अधिक सहज है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। सम्बन्धवाचक रचना मूल की शर्त को स्वाभाविक बनाती है। अंग्रेज़ी फुटनोट [a] की आवश्यकता हिन्दी में नहीं है, क्योंकि ‘उसे’ अनिश्चित एकवचन व्यक्ति को बिना लिंग बताए स्पष्ट रूप से व्यक्त करता है; इसलिए केवल प्रयुक्त फुटनोट [b] मुख्य पाठ में अंकित है।
