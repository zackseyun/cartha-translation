id: REV.20.4
reference: Revelation 20:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνους, καὶ ἐκάθισαν ἐπ’ αὐτούς, καὶ κρίμα ἐδόθη αὐτοῖς, καὶ τὰς ψυχὰς τῶν πεπελεκισμένων διὰ τὴν μαρτυρίαν Ἰησοῦ καὶ διὰ τὸν λόγον τοῦ θεοῦ, καὶ οἵτινες οὐ προσεκύνησαν τὸ θηρίον οὐδὲ τὴν εἰκόνα αὐτοῦ καὶ οὐκ ἔλαβον τὸ χάραγμα ἐπὶ τὸ μέτωπον καὶ ἐπὶ τὴν χεῖρα αὐτῶν· καὶ ἔζησαν καὶ ἐβασίλευσαν μετὰ τοῦ χριστοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/004.yaml
  text: And I saw thrones[a], and they sat on them, and judgment was given to them, and the souls of those who had been beheaded because of the testimony of Jesus and because of the word of God, and those who had not worshiped the beast or its image and had not received the mark on their forehead and on their hand[b]; and they came to life and reigned with the Messiah for a thousand years.
translation:
  language: hi
  text: और मैंने सिंहासनों को देखा, और वे उन पर बैठे, और उन्हें न्याय दिया गया। मैंने उन लोगों की आत्माओं को भी देखा जिनका सिर यीशु की गवाही[a] और परमेश्वर के वचन के कारण काट दिया गया था, और जिन्होंने न उस पशु की न उसकी प्रतिमा की आराधना की थी, और न अपने माथे और हाथ पर उसकी छाप ली थी। वे जीवित हो उठे और मसीह[b] के साथ एक हज़ार वर्ष तक राज्य करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के विषय में उनकी गवाही।” यूनानी पदबंध “यीशु की गवाही” का अर्थ यीशु द्वारा दी गई गवाही या यीशु के विषय में दी गई गवाही, दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “ख्रीस्त के साथ।” यूनानी पद Χριστός का अनुवाद यहाँ “मसीह” किया गया है, क्योंकि यह एक पदवी के रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θρόνους
  choice: सिंहासन
  rationale: यह मूल शब्द का सीधा, ठोस और प्रकाशितवाक्य की राजकीय छवि के अनुरूप अनुवाद है।
- source_word: ἐκάθισαν ἐπ’ αὐτούς
  choice: वे उन पर बैठे हुए थे
  rationale: यूनानी में कर्ता निहित और अनिर्दिष्ट है। ‘वे’ किसी विशेष समूह—जैसे शहीदों, पवित्र लोगों या स्वर्गीय प्राणियों—की पहचान जोड़े बिना इस अस्पष्टता को बनाए रखता है।
- source_word: κρίμα ἐδόθη αὐτοῖς
  choice: न्याय उन्हें सौंपा गया
  rationale: κρίμα न्याय, निर्णय या न्यायिक अधिकार का भाव दे सकता है। यह अभिव्यक्ति ‘न्याय करने का अधिकार’ जैसी व्याख्यात्मक वृद्धि किए बिना न्यायिक भाव और मूल की कर्मवाच्य रचना बनाए रखती है।
- source_word: ψυχὰς
  choice: आत्माओं
  rationale: दर्शनात्मक और प्रलय-साहित्यिक संदर्भ में ‘आत्माओं’ से मूल बिंब सुरक्षित रहता है; ‘लोगों’ से मृत्यु और बाद में जीवित होने के बीच की साहित्यिक धार कुंद हो जाती।
- source_word: πεπελεκισμένων
  choice: जिनके सिर ... काटे गए थे
  rationale: यह पूर्ण कर्मवाच्य कृदंत कुल्हाड़ी से सिर काटकर मृत्युदंड दिए जाने को सूचित करता है। स्वाभाविक हिन्दी में ‘सिर काटे गए थे’ पर्याप्त रूप से सटीक है।
- source_word: διὰ τὴν μαρτυρίαν Ἰησοῦ
  choice: यीशु की गवाही
  rationale: '‘यीशु की’ मूल संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है: यह यीशु द्वारा दी गई गवाही अथवा यीशु के विषय में दी गई गवाही हो सकती है।'
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन के कारण
  rationale: διά के साथ द्वितीया यहाँ कारण व्यक्त करती है; ‘परमेश्वर का वचन’ परिचित और सीधा धार्मिक पद है।
- source_word: προσεκύνησαν
  choice: आराधना की थी
  rationale: संदर्भ में क्रिया केवल शारीरिक रूप से झुकने की नहीं, धार्मिक उपासना की है। पूर्णतासूचक हिन्दी रूप उनके जीवित होने से पहले किए गए इनकार को स्पष्ट करता है।
- source_word: θηρίον
  choice: पशु
  rationale: यह प्रकाशितवाक्य में स्थापित प्रलय-साहित्यिक पद और मूल शब्द का सीधा अर्थ है।
- source_word: εἰκόνα
  choice: मूर्ति
  rationale: इस संदर्भ में आराधना के लिए बनाई गई beast की प्रतिमा अभिप्रेत है; ‘मूर्ति’ आधुनिक हिन्दी में स्वाभाविक और ठोस है, जबकि इसे स्वतंत्र रूप से ‘देवता’ नहीं बनाता।
- source_word: χάραγμα
  choice: छाप
  rationale: ‘छाप’ किसी अंकित चिह्न या मुहर का स्वाभाविक हिन्दी पद है और प्रकाशितवाक्य के संदर्भ में स्पष्ट है।
- source_word: ἔζησαν
  choice: जीवित हो उठे
  rationale: यह संदर्भ में घटना-सूचक बल व्यक्त करता है, पर पुनरुत्थान की प्रकृति के बारे में पद से अधिक सिद्धान्तगत विवरण नहीं जोड़ता।
- source_word: χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ नाम से अधिक पदवी के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त राजा होने का शीर्षकीय अर्थ बनाए रखता है।
- source_word: χίλια ἔτη
  choice: एक हज़ार वर्ष
  rationale: संख्या और समयावधि का सीधा अनुवाद है; इसे प्रतीकात्मक या अक्षरशः बताने वाली कोई व्याख्या पाठ में नहीं जोड़ी गई।
theological_decisions:
- issue: ἐκάθισαν के कर्ता और न्याय पानेवालों की पहचान
  choice: अनिर्दिष्ट सर्वनाम ‘वे’ और ‘उन्हें’ रखा गया
  alternative: उन्हें शहीद, सभी पवित्र लोग या स्वर्गीय सभा के सदस्य बताना
  rationale: यूनानी पाठ कर्ता की स्पष्ट पहचान नहीं करता। किसी समूह का नाम जोड़ना पद की वास्तविक व्याख्यात्मक खुली जगह को समाप्त कर देता।
- issue: ‘यीशु की गवाही’ का संबंधकारक अर्थ
  choice: मुख्य पाठ में ‘यीशु की गवाही’
  alternative: ‘यीशु के विषय में उनकी गवाही’ अथवा ‘यीशु द्वारा दी गई गवाही’
  rationale: Ἰησοῦ संबंधकारक कर्तृवाचक या कर्मवाचक दोनों समझा जा सकता है। मुख्य पाठ अस्पष्टता रखता है और पादटिप्पणी प्रमुख वैकल्पिक अर्थ बताती है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द पदवी की तरह काम करता है, इसलिए उसके शीर्षकीय अर्थ को व्यक्त करने वाला ‘मसीह’ उपयुक्त है।
- issue: ἔζησαν का आशय
  choice: ‘जीवित हो उठे’
  alternative: ‘जीए’ अथवा ‘फिर जीवित हुए’
  rationale: संदर्भ में यह मृत्यु के बाद जीवन में आने की घटना बताता है। ‘फिर’ न जोड़ने से पाठ जितना कहता है उससे अधिक कालक्रमिक या सिद्धान्तगत विशिष्टता नहीं आती।
- issue: हज़ार वर्षों की प्रकृति
  choice: सिर्फ ‘एक हज़ार वर्ष’ का सीधा अनुवाद
  alternative: इसे स्पष्टतः अक्षरशः या प्रतीकात्मक अवधि कहना
  rationale: यह पद अवधि बताता है, पर उसकी व्याख्यात्मक प्रकृति निर्धारित नहीं करता; इसलिए किसी सहस्राब्दीवादी मत को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, स्पष्ट और दर्शनात्मक शैली रखी गई है। अनिर्दिष्ट ‘वे’ जानबूझकर रखा गया है, यद्यपि सामान्य गद्य में इसका पूर्वपद अपेक्षित होता, क्योंकि मूल यूनानी भी कर्ता की पहचान खुली छोड़ता है। ‘हज़ार’ में मानक नुक्ता-रहित देवनागरी रूप और ‘माथे और हाथ’ में मूल के दोनों स्थान सुरक्षित रखे गए हैं।
