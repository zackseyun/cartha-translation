source:
  edition: SBLGNT
  text: καὶ ὁ διάβολος ὁ πλανῶν αὐτοὺς ἐβλήθη εἰς τὴν λίμνην τοῦ πυρὸς καὶ θείου, ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης, καὶ βασανισθήσονται ἡμέρας καὶ νυκτὸς εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/010.yaml
  text: And the devil[a], who was deceiving them, was thrown into the lake of fire and sulfur, where also the beast and the false prophet are[b], and they will be tormented day and night forever and ever.
translation:
  language: hi
  text: और वह शैतान, जो उन्हें भरमा रहा था, आग और गंधक की झील में फेंक दिया गया, जहाँ वह पशु और झूठा भविष्यद्वक्ता भी हैं; और उन्हें दिन-रात सदा-सर्वदा[a] यातना दी जाती रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “युगों के युगों तक”; यह यूनानी मुहावरा समाप्तिहीन अवधि पर बल देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: διάβολος
  choice: शैतान
  rationale: प्रकाशितवाक्य में यह एक सामान्य विशेषण नहीं, बल्कि शैतान के लिए स्थापित व्यक्तिगत पदनाम है। आधुनिक हिन्दी में “शैतान” स्पष्ट और प्रचलित है।
- source_word: ὁ πλανῶν αὐτοὺς
  choice: जो उन्हें भरमा रहा था
  rationale: वर्तमान कृदंत उसकी जारी गतिविधि बताता है। कथा के भूतकालीन क्रम में “भरमा रहा था” इस निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐβλήθη
  choice: फेंक दिया गया
  rationale: कर्मवाच्य रूप न्याय के प्रसंग में बलपूर्वक डाल दिए जाने का भाव रखता है; “फेंक दिया गया” आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: λίμνην τοῦ πυρὸς καὶ θείου
  choice: आग और गंधक की झील
  rationale: यह यूनानी पदबंध की प्रत्यक्ष छवि को सुरक्षित रखता है। θεῖον का सामान्य आधुनिक हिन्दी समतुल्य “गंधक” है।
- source_word: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης
  choice: जहाँ वह पशु और झूठा भविष्यद्वक्ता भी हैं
  rationale: यूनानी में क्रिया व्यक्त नहीं है। हिन्दी में वाक्य पूरा करने के लिए वर्तमानकालीन “हैं” जोड़ा गया है, जो पिछले प्रसंग से उनकी निरंतर उपस्थिति को सबसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: θηρίον
  choice: वह पशु
  rationale: प्रकाशितवाक्य की स्थापित सर्वनाश-संबंधी आकृति के लिए “पशु” सीधा समतुल्य है; “वह” यूनानी निश्चित उपपद के संदर्भगत बल को व्यक्त करता है।
- source_word: ψευδοπροφήτης
  choice: झूठा भविष्यद्वक्ता
  rationale: यह पद का सीधा और हिन्दी बाइबिलीय प्रयोग में समझने योग्य समतुल्य है।
- source_word: βασανισθήσονται
  choice: यातना सहते रहेंगे
  rationale: यह भविष्यकालीन कर्मवाच्य अर्थ और लगातार कठोर पीड़ा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यातना की विधि को अतिरिक्त रूप से निर्दिष्ट किए।
- source_word: ἡμέρας καὶ νυκτός
  choice: दिन-रात
  rationale: यह निरंतरता बताने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह यूनानी के प्रबल कालवाची मुहावरे का संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी समतुल्य है; पादटिप्पणी अधिक शब्दशः रूप देती है।
theological_decisions:
- issue: εἰς τοὺς αἰῶνας τῶν αἰώνων द्वारा व्यक्त अंतिम दंड की अवधि
  choice: युगानुयुग
  alternative: युगों के युगों तक
  rationale: मुख्य पाठ यूनानी मुहावरे की अत्यंत दीर्घ, समाप्तिहीन अवधि की शक्ति को कम किए बिना स्वाभाविक हिन्दी देता है। पादटिप्पणी उसका अधिक शब्दशः रूप सुरक्षित रखती है और व्यापक धर्मसैद्धांतिक विवाद को इस पद से आगे जाकर हल नहीं करती।
- issue: ὅπου καὶ τὸ θηρίον καὶ ὁ ψευδοπροφήτης में निहित क्रिया
  choice: जहाँ वह पशु और झूठा भविष्यद्वक्ता भी हैं
  alternative: जहाँ वह पशु और झूठा भविष्यद्वक्ता भी थे
  rationale: यूनानी में क्रिया अनुपस्थित है, पर हिन्दी में वाक्य की पूर्णता के लिए उसकी पूर्ति आवश्यक है। वर्तमानकाल “हैं” निकटवर्ती प्रसंग में उनकी जारी उपस्थिति के अनुकूल है और केवल बीते हुए समय का अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। “शैतान,” “पशु,” और “झूठा भविष्यद्वक्ता” प्रकाशितवाक्य की स्थापित पारिभाषिक संगति बनाए रखते हैं। वाक्य की गंभीर न्यायात्मक लय बचाने के लिए दोनों खंडों को अर्धविराम से जोड़ा गया है।
