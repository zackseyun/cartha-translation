id: REV.20.11
reference: Revelation 20:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ⸂ἐπ’ αὐτοῦ⸃, οὗ ἀπὸ ⸀τοῦ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/011.yaml
  text: And I saw a great white throne and the one seated on it[a], from whose presence the earth and heaven fled, and no place was found for them.
translation:
  language: hi
  text: फिर मैंने एक महान श्वेत सिंहासन और उस पर बैठे हुए को देखा, जिसके सामने से पृथ्वी और आकाश भाग गए, और उनके लिए कोई स्थान नहीं मिला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θρόνον μέγαν λευκὸν
  choice: एक महान श्वेत सिंहासन
  rationale: ‘महान’ μέγαν की विशालता और महिमा दोनों को व्यक्त करता है; ‘श्वेत सिंहासन’ प्रकाशितवाक्य की गरिमापूर्ण प्रतीकात्मक भाषा बनाए रखता है।
- source_word: τὸν καθήμενον ἐπ’ αὐτοῦ
  choice: उस पर बैठे हुए को
  rationale: यूनानी वर्णनात्मक पदबंध को स्वाभाविक हिन्दी में रखा गया है और सिंहासन पर विराजमान व्यक्ति की पहचान को उससे अधिक स्पष्ट नहीं किया गया जितना पद स्वयं करता है।
- source_word: ἀπὸ τοῦ προσώπου
  choice: जिनके मुख के सामने से
  rationale: πρόσωπον के मूल अर्थ ‘मुख’ और ἀπό के ‘से’ को सुरक्षित रखते हुए यह हिन्दी में किसी के सम्मुख से भागने का आशय भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔφυγεν
  choice: भाग गए
  rationale: क्रिया की सजीव, व्यक्तिकृत छवि को बनाए रखता है; ‘लुप्त हो गए’ जैसा अर्थानुवाद नहीं करता।
- source_word: ἡ γῆ καὶ ὁ οὐρανός
  choice: पृथ्वी और आकाश
  rationale: सृष्टि के दोनों क्षेत्रों का स्वाभाविक हिन्दी रूप है। यहाँ एकवचन οὐρανός के लिए ‘आकाश’ सरल और सटीक है।
- source_word: τόπος οὐχ εὑρέθη αὐτοῖς
  choice: उनके लिए कोई स्थान नहीं मिला
  rationale: यूनानी के कर्मवाच्य विन्यास और गंभीर लहजे को बनाए रखता है; ‘उनके’ का संकेत पृथ्वी और आकाश की ओर है।
theological_decisions:
- issue: सिंहासन पर बैठे हुए की पहचान
  choice: पहचान को निहित रखते हुए ‘उस पर बैठे हुए को’
  alternative: उन्हें स्पष्ट रूप से परमेश्वर, पिता, मसीह या दिव्य न्यायी कहना
  rationale: इस पद में सिंहासन पर बैठे व्यक्ति का नाम नहीं दिया गया है; वर्णनात्मक अभिव्यक्ति पाठ की धार्मिक अस्पष्टता और तनाव को सुरक्षित रखती है।
- issue: पृथ्वी और आकाश के भागने का स्वरूप
  choice: व्यक्तिकृत क्रिया ‘भाग गए’ को बनाए रखना
  alternative: ‘लुप्त हो गए’ या ‘नष्ट हो गए’
  rationale: पद φεύγω द्वारा भागने की छवि देता है और यहाँ विनाश की प्रक्रिया या तत्त्वमीमांसा को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और अपेक्षाकृत औपचारिक शैली। ‘फिर मैंने’ दर्शन-क्रम में Καί को स्वाभाविक रूप से व्यक्त करता है। ‘मुख के सामने से’ जानबूझकर मूल चित्रात्मकता को सुरक्षित रखता है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
