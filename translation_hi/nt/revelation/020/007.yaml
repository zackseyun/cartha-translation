source:
  edition: SBLGNT
  text: Καὶ ὅταν τελεσθῇ τὰ χίλια ἔτη, λυθήσεται ὁ Σατανᾶς ἐκ τῆς φυλακῆς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/007.yaml
  text: And when the thousand years are completed, Satan will be released from his prison,
translation:
  language: hi
  text: और जब वे हज़ार वर्ष पूरे हो जाएँगे, तब शैतान उसके कारागार से रिहा किया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: उपवाक्य में संभाव्य रूप τελεσθῇ के साथ यह भविष्य में अपेक्षित समय को सूचित करता है; ‘जब’ बिना अतिरिक्त व्याख्या जोड़े इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τελεσθῇ
  choice: पूरे हो जाएँगे
  rationale: τελέω का यह कर्मवाच्य रूप निश्चित अवधि की पूर्णता बताता है। हिन्दी में ‘पूरे हो जाएँगे’ परिणाम और कर्मवाच्य भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: τὰ χίλια ἔτη
  choice: वे हज़ार वर्ष
  rationale: मूल पाठ का निश्चित उपपद पहले बताए गए हज़ार वर्षों की ओर संकेत करता है; ‘वे’ इस संदर्भगत निश्चितता को स्पष्ट करता है।
- source_word: λυθήσεται
  choice: छोड़ दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य को स्पष्ट रखते हुए यह बंधन से मुक्त किए जाने का अर्थ देता है, पर ‘आज़ाद’ जैसे संभावित सकारात्मक भाव से बचता है।
- source_word: Σατανᾶς
  choice: शैतान
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में प्रचलित और सामान्य पाठकों के लिए सहज नामरूप है।
- source_word: ἐκ τῆς φυλακῆς αὐτοῦ
  choice: अपनी कैद से
  rationale: φυλακή यहाँ बंदी अवस्था या कारावास को सूचित करता है। हिन्दी में कर्ता की ओर लौटते αὐτοῦ के लिए ‘अपनी’ स्वाभाविक है, और ‘कैद’ स्थान तथा बंदी अवस्था की वास्तविक संदर्भगत धारणा को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: हज़ार वर्षों का स्वरूप
  choice: ‘वे हज़ार वर्ष’ के रूप में सीधा अनुवाद, बिना यह तय किए कि अवधि अक्षरशः है या प्रतीकात्मक।
  alternative: इसे स्पष्टतः अक्षरशः हज़ार-वर्षीय राज्य या प्रतीकात्मक दीर्घ अवधि बताना।
  rationale: यह पद एक निश्चित अवधि का उल्लेख करता है, पर स्वयं विभिन्न सहस्राब्दी-संबंधी मतों का निर्णय नहीं करता; अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ यूनानी में अलग शब्द के रूप में नहीं है, पर ‘जब…तब’ हिन्दी की स्वाभाविक सहसंबंधी रचना है और कोई नया कालक्रम नहीं जोड़ती।
