id: REV.20.6
reference: Revelation 20:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μακάριος καὶ ἅγιος ὁ ἔχων μέρος ἐν τῇ ἀναστάσει τῇ πρώτῃ· ἐπὶ τούτων ὁ δεύτερος θάνατος οὐκ ἔχει ἐξουσίαν, ἀλλ’ ἔσονται ἱερεῖς τοῦ θεοῦ καὶ τοῦ χριστοῦ, καὶ βασιλεύσουσιν μετ’ αὐτοῦ ⸀χίλια ἔτη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/006.yaml
  text: Blessed and holy is the one who has a share in the first resurrection. Over these the second death has no authority[a], but they will be priests of God and of Messiah, and they will reign with him for a thousand years.
translation:
  language: hi
  text: धन्य और पवित्र है वह, जिसका पहले पुनरुत्थान में भाग है। ऐसे लोगों पर दूसरी मृत्यु का कोई अधिकार नहीं है; बल्कि वे परमेश्वर और मसीह[a] के याजक होंगे और उसके साथ एक हज़ार वर्ष तक राज्य करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीष्ट’। यूनानी Χριστός यहाँ एक उपाधि है, इसलिए मुख्य पाठ में ‘मसीह’ रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह आशीर्वचन की मानक बाइबलीय अभिव्यक्ति है और केवल मनोभावगत ‘सुखी’ की अपेक्षा परमेश्वर की अनुग्रहपूर्ण स्वीकृति का भाव बेहतर रखती है।
- source_word: ἅγιος
  choice: पवित्र
  rationale: यह परमेश्वर के लिए अलग किए जाने और पवित्र स्थिति—दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἔχων μέρος
  choice: वह, जिसका … में भाग है
  rationale: कर्ता के प्रतिनिधिक एकवचन को बनाए रखते हुए सहभागिता का अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: ἐν τῇ ἀναστάσει τῇ πρώτῃ
  choice: पहले पुनरुत्थान में
  rationale: मूल के क्रमसूचक विशेषण और पारिभाषिक ‘पुनरुत्थान’ को सीधे बनाए रखता है।
- source_word: ἐπὶ τούτων
  choice: ऐसे लोगों पर
  rationale: यह पीछे बताए गए सहभागी लोगों की ओर स्पष्ट संकेत करता है और ἐπί के अधिकार-क्षेत्र संबंधी भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: का कोई अधिकार नहीं है
  rationale: ἐξουσία यहाँ मात्र सामर्थ्य नहीं, बल्कि अधिकार या प्रभुत्व को सूचित करता है।
- source_word: ἱερεῖς
  choice: याजक
  rationale: मूल के धार्मिक-सेवकीय पदनाम और उसके बाइबलीय अर्थ को सुरक्षित रखता है।
- source_word: τοῦ θεοῦ καὶ τοῦ χριστοῦ
  choice: परमेश्वर और मसीह के
  rationale: दोनों संबंधकारक पदों को समानांतर रखता है और Χριστός के उपाधिगत अर्थ को ‘मसीह’ से व्यक्त करता है।
- source_word: βασιλεύσουσιν
  choice: राज्य करेंगे
  rationale: राजकीय शासन में सहभागिता को आधुनिक, प्रतिष्ठित और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: χίλια ἔτη
  choice: एक हज़ार वर्ष तक
  rationale: स्पष्ट कालावधि को बिना किसी विशिष्ट सहस्राब्दीवादी व्याख्या को जोड़े व्यक्त करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός परमेश्वर के साथ संबंधकारक संरचना में उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसका उपाधिगत और हिन्दी में सुबोध रूप बनाए रखता है।
- issue: हज़ार वर्षों की अवधि
  choice: एक हज़ार वर्ष तक
  alternative: हज़ार वर्ष
  rationale: मूल में कही गई अवधि को स्पष्ट रखा गया है, पर उससे संबंधित व्यापक अंतकालीन मतों में से किसी एक को अनुवाद में नहीं जोड़ा गया।
- issue: एकवचन से बहुवचन की ओर परिवर्तन
  choice: ‘वह’ के बाद ‘ऐसे लोगों… वे’
  alternative: पूरे वाक्य में एकवचन रखना
  rationale: यूनानी पाठ पहले प्रतिनिधिक एकवचन ὁ ἔχων और फिर बहुवचन τούτων/ἔσονται/βασιλεύσουσιν प्रयोग करता है; हिन्दी में यही अर्थ स्पष्ट रखने के लिए बहुवचन को खुलकर व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध बाइबलीय रजिस्टर अपनाया गया है। ‘पुनरुत्थान’, ‘याजक’ और ‘राज्य करेंगे’ जैसे स्थापित धर्मग्रंथीय शब्द मूल की विशिष्ट छवियों को सुरक्षित रखते हैं; वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
