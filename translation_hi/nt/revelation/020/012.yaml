id: REV.20.12
reference: Revelation 20:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστιν τῆς ζωῆς· καὶ ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/012.yaml
  text: And I saw the dead[a], the great and the small, standing before the throne, and books were opened. And another book was opened, which is the book of life. And the dead were judged from what had been written in the books[b], according to their works.
translation:
  language: hi
  text: और मैंने मरे हुओं को—बड़े और छोटे—सिंहासन के सामने खड़े देखा। पुस्तकें[a] खोली गईं, और एक और पुस्तक खोली गई, जो जीवन की पुस्तक है। और मरे हुओं का न्याय पुस्तकों में लिखी बातों के आधार पर, उनके कामों के अनुसार किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पुस्तकें’ का अनुवाद ‘लपेटे हुए लिखित पत्र (स्क्रॉल)’ भी किया जा सकता है, क्योंकि प्राचीन काल में लिखित सामग्री प्रायः इसी रूप में होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: νεκρούς / νεκροὶ
  choice: मरे हुओं
  rationale: यह विशेषण संज्ञा के रूप में मृत व्यक्तियों के समूह को दर्शाता है। ‘मरे हुओं’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का गंभीर स्वर बनाए रखता है।
- source_word: μεγάλους καὶ τοὺς μικρούς
  choice: बड़े और छोटे
  rationale: यह पद हर सामाजिक स्तर और हैसियत के लोगों को समेटने वाला युग्म है। शाब्दिक रूप बनाए रखने से उसका व्यापक आशय और गंभीरता दोनों सुरक्षित रहते हैं।
- source_word: ἑστῶτας
  choice: खड़े
  rationale: सिद्ध वर्तमान अवस्था को दर्शाने वाले कृदंत का स्वाभाविक हिन्दी रूप ‘खड़े’ है।
- source_word: ἐνώπιον τοῦ θρόνου
  choice: सिंहासन के सामने
  rationale: यह सीधा अर्थ देता है और θρόνος में स्पष्ट रूप से निहित न होने वाली ‘न्याय-आसन’ की व्याख्या नहीं जोड़ता।
- source_word: βιβλία
  choice: पुस्तकें
  rationale: βιβλίον लिखित ग्रंथ या अभिलेख के माध्यम को दर्शा सकता है। ‘पुस्तकें’ व्यापक, प्रचलित और प्रसंगानुकूल हिन्दी है; प्राचीन माध्यम की संभावना पाद-टिप्पणी में दी गई है।
- source_word: ἠνοίχθησαν / ἠνοίχθη
  choice: खोली गईं / खोली गई
  rationale: निष्क्रिय क्रिया का सीधा और स्वाभाविक अनुवाद है; ‘मुहर खोली गई’ कहना मूल क्रिया से अधिक विशिष्ट होता।
- source_word: ἄλλο βιβλίον
  choice: एक और पुस्तक
  rationale: यह पहले उल्लिखित पुस्तकों से अलग एक अतिरिक्त पुस्तक का परिचय देता है।
- source_word: ὅ ἐστιν τῆς ζωῆς
  choice: अर्थात् जीवन की पुस्तक
  rationale: यूनानी में ‘पुस्तक’ पद अध्याहृत है; हिन्दी में स्पष्टता के लिए उसे दोहराया गया है। ‘अर्थात्’ संबंध की पहचान स्पष्ट करता है।
- source_word: ἐκρίθησαν
  choice: न्याय ... किया गया
  rationale: κρίνω यहाँ न्यायिक निर्णय की प्रक्रिया बताता है। यह अनुवाद दोषसिद्धि या दंड का परिणाम पहले से मान नहीं लेता।
- source_word: ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις
  choice: पुस्तकों में लिखी बातों के आधार पर
  rationale: ἐκ यहाँ न्याय के आधार या स्रोत को व्यक्त करता है। यह रूप पूर्ण कृदंत में निहित पहले से लिखे जा चुके अभिलेख का भाव स्वाभाविक हिन्दी में देता है।
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: उनके कामों के अनुसार
  rationale: ἔργα व्यक्तियों के किए हुए कार्यों को व्यापक रूप से दर्शाता है। ‘कामों’ सामान्य पाठक के लिए सहज है और ‘कर्म’ से जुड़ी संभावित गैर-बाइबिलीय दार्शनिक ध्वनियों से बचता है।
theological_decisions:
- issue: कामों के अनुसार न्याय
  choice: ‘उनके कामों के अनुसार’ को बिना नरम किए स्पष्ट रखा गया है।
  alternative: ‘उन्होंने जो किया था, उसके अनुसार’
  rationale: पद स्पष्ट रूप से बताता है कि न्याय उनके कामों के अनुसार हुआ। अनुवाद इस कथन को किसी व्यापक धर्मवैज्ञानिक समन्वय द्वारा समझाता या सीमित नहीं करता और मूल पाठ का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-रचना दर्शन के क्रम को बनाए रखती है। ‘बड़े और छोटे’ मूल की संक्षिप्त व्यापकता को सुरक्षित रखता है, और ‘न्याय किया गया’ बिना निर्णय का परिणाम पहले से तय किए न्यायिक भाव व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान और उसकी टिप्पणी परस्पर असंगत थे; इसलिए स्रोत-साक्ष्य के आधार पर केवल प्रासंगिक सांस्कृतिक पाद-टिप्पणी रखी गई है।
