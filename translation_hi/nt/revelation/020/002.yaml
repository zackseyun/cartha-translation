source:
  edition: SBLGNT
  text: καὶ ἐκράτησεν τὸν δράκοντα, ⸂ὁ ὄφις ὁ ἀρχαῖος⸃, ὅς ἐστιν Διάβολος καὶ ὁ ⸀Σατανᾶς, καὶ ἔδησεν αὐτὸν χίλια ἔτη,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/002.yaml
  text: And he seized the dragon—that ancient serpent[a], who is the Devil and Satan—and bound him for a thousand years,
translation:
  language: hi
  text: और उसने उस ड्रैगन को—अर्थात् उस प्राचीन साँप को, जो इबलीस और शैतान है—पकड़ लिया और उसे एक हज़ार वर्ष के लिए बाँध दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκράτησεν
  choice: पकड़ लिया
  rationale: यहाँ क्रिया बलपूर्वक पकड़ने या अपने वश में करने की निर्णायक कार्रवाई बताती है; ‘पकड़ लिया’ सहज और सजीव हिन्दी है।
- source_word: δράκοντα
  choice: अजगर
  rationale: प्रकाशितवाक्य की प्रतीकात्मक छवि और पुस्तक के भीतर शब्दगत निरंतरता बनाए रखने वाला प्रचलित हिन्दी रूप।
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: उस प्राचीन साँप
  rationale: यह अजगर की समानाधिकरणीय पहचान है। ‘उस’ पहले से पहचाने जाने वाले साँप की ओर संकेत करता है, जबकि ‘प्राचीन’ ἀρχαῖος का सीधा अर्थ रखता है।
- source_word: Διάβολος
  choice: इबलीस
  rationale: Διάβολος के लिए हिन्दी बाइबलीय परंपरा में पहचाना जाने वाला पद; इसे Σατανᾶς से अलग रखते हुए पहचान की पूरी शृंखला सुरक्षित रहती है।
- source_word: Σατανᾶς
  choice: शैतान
  rationale: व्यक्तिगत नाम/उपाधि का हिन्दी में मानक लिप्यंतरण।
- source_word: ἔδησεν
  choice: बाँध दिया
  rationale: δέω की ठोस बाँधने वाली छवि को बनाए रखता है और रोकने के स्वरूप की अतिरिक्त व्याख्या नहीं करता।
- source_word: χίλια ἔτη
  choice: एक हज़ार वर्ष के लिए
  rationale: कालावधि-सूचक कर्मकारक को स्वाभाविक हिन्दी में ‘के लिए’ से व्यक्त किया गया है; संख्या को न कम किया गया है, न उसकी व्याख्या की गई है।
theological_decisions:
- issue: हज़ार वर्ष का स्वरूप
  choice: ‘एक हज़ार वर्ष’ का सीधा अनुवाद, बिना यह तय किए कि अवधि शाब्दिक है या प्रतीकात्मक।
  alternative: इसे शाब्दिक सहस्राब्दी अथवा प्रतीकात्मक काल के रूप में स्पष्ट करना।
  rationale: मूल पाठ अवधि बताता है, लेकिन उसकी व्याख्यात्मक प्रकृति यहाँ निश्चित नहीं करता; अनुवाद इस धार्मिक-व्याख्यात्मक तनाव को खुला रखता है।
- issue: अजगर की पहचान
  choice: अजगर, प्राचीन साँप, शैतान और इबलीस—पहचान की पूरी शृंखला बनाए रखना।
  alternative: इन उपाधियों को किसी एक सरल लेबल में मिला देना।
  rationale: पद स्वयं इन सभी पदों द्वारा एक ही सत्ता की स्पष्ट पहचान करता है; किसी पद को हटाने या समेटने से मूल की बलाघातपूर्ण शृंखला घट जाएगी।
- issue: Διάβολος और Σατανᾶς का क्रम
  choice: ‘शैतान और इबलीस’
  alternative: ‘इबलीस और शैतान’
  rationale: मूल यूनानी में क्रम Διάβολος καὶ ὁ Σατανᾶς है, पर आधुनिक हिन्दी में ‘शैतान और इबलीस’ अधिक स्वाभाविक और व्यापक रूप से पहचानी जाने वाली युग्म-अभिव्यक्ति है; दोनों अलग पद स्पष्टतः सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। समानाधिकरणीय पहचान को ‘अर्थात’ और दीर्घ विराम-चिह्नों से स्पष्ट किया गया है। ‘एक हज़ार वर्ष’ को व्याख्यात्मक मिलेनियम-शब्दावली में बदले बिना रखा गया है।
