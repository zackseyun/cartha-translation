source:
  edition: SBLGNT
  text: καὶ ἔβαλεν αὐτὸν εἰς τὴν ἄβυσσον, καὶ ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ, ἵνα μὴ ⸀πλανήσῃ ἔτι τὰ ἔθνη, ἄχρι τελεσθῇ τὰ χίλια ἔτη· ⸀μετὰ ταῦτα δεῖ ⸂λυθῆναι αὐτὸν⸃ μικρὸν χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/003.yaml
  text: And he threw him into the abyss[a], and shut it and sealed it over him, so that he might no longer deceive the nations until the thousand years were finished[c][b]. After these things he must be released for a short time.
translation:
  language: hi
  text: और उसने उसे अथाह कुंड[a] में फेंक दिया, उसे भीतर बंद कर दिया और उसके ऊपर मुहर लगा दी, ताकि वह उन हज़ार वर्षों के पूरे होने तक राष्ट्रों को अब और न भरमाए[b]। इसके बाद उसका थोड़े समय के लिए छोड़ा जाना आवश्यक है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अथाह गड्ढे”।
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों को अब और न भटकाए”।
    reason: lexical_alternative
  - marker: c
    text: या “उसे थोड़े समय के लिए मुक्त किया जाना आवश्यक है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: फेंक दिया
  rationale: βάλλω की सजीव और बलपूर्वक क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄβυσσον
  choice: अथाह कुंड
  rationale: प्रकाशितवाक्य के प्रलयदर्शी स्थान-संज्ञक अर्थ को स्पष्ट और परिचित हिन्दी में रखता है; वैकल्पिक संक्षिप्त शब्द फुटनोट में दिया गया है।
- source_word: ἔκλεισεν καὶ ἐσφράγισεν ἐπάνω αὐτοῦ
  choice: उसे बंद करके उसके ऊपर मुहर लगा दी
  rationale: बंद करने और मुहर लगाने की दोनों अलग क्रियाएँ तथा बंदी के ऊपर सुरक्षित किए जाने का स्थानिक भाव बनाए रखता है।
- source_word: ἵνα μὴ πλανήσῃ ἔτι τὰ ἔθνη
  choice: ताकि वह ... राष्ट्रों को फिर न भरमाए
  rationale: πλανάω के धोखा देने/भटका देने के अर्थ को ‘भरमाए’ स्वाभाविक रूप में व्यक्त करता है; ἔτι का प्रसंगगत अर्थ ‘फिर न’ से आता है।
- source_word: ἄχρι τελεσθῇ τὰ χίλια ἔτη
  choice: उन हज़ार वर्षों के पूरे होने तक
  rationale: τελεσθῇ की पूर्णता और ἄχρι की समय-सीमा को स्पष्ट रखता है।
- source_word: δεῖ λυθῆναι αὐτὸν μικρὸν χρόνον
  choice: उसका थोड़े समय के लिए छोड़ा जाना आवश्यक है
  rationale: δεῖ की आवश्यकता और λυθῆναι के कर्मवाच्य को बिना कर्ता जोड़कर सुरक्षित रखता है।
theological_decisions:
- issue: हज़ार वर्षों का स्वरूप
  choice: ‘हज़ार वर्षों’ का सीधा अनुवाद
  alternative: इसे शाब्दिक सहस्राब्दी या प्रतीकात्मक दीर्घ अवधि के रूप में स्पष्ट करना
  rationale: मूल पाठ अवधि की व्याख्या नहीं करता; अनुवाद सहस्राब्दी-संबंधी मतभेद को खुला रखता है।
- issue: δεῖ में निहित आवश्यकता
  choice: ‘आवश्यक है’
  alternative: इसे स्पष्टतः ईश्वरीय आदेश या केवल कथात्मक अनिवार्यता कहना
  rationale: यूनानी शब्द आवश्यकता व्यक्त करता है, पर इस पद में उसके आधार को स्पष्ट नहीं करता।
- issue: λυθῆναι का अव्यक्त कर्ता
  choice: कर्मवाच्य ‘छोड़ा जाना’ बनाए रखना
  alternative: ‘परमेश्वर/स्वर्गदूत उसे छोड़ेगा’ जैसा कर्ता जोड़ना
  rationale: मूल में छोड़ने वाला कर्ता व्यक्त नहीं है; उसे जोड़ना अनावश्यक व्याख्या होगी।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कथात्मक शैली। ‘राष्ट्रों’ से τὰ ἔθνη का सामान्य प्रकाशन-संबंधी अर्थ रखा गया है। मुख्य वाक्य की क्रियात्मक तीव्रता बनाए रखते हुए अंतिम कर्मवाच्य में मूल की अस्पष्टता सुरक्षित है।
