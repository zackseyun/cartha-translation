id: REV.20.1
reference: Revelation 20:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄγγελον καταβαίνοντα ἐκ τοῦ οὐρανοῦ, ἔχοντα τὴν κλεῖν τῆς ἀβύσσου καὶ ἅλυσιν μεγάλην ἐπὶ τὴν χεῖρα αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/001.yaml
  text: And I saw an angel coming down from heaven[a], holding the key to the abyss and a great chain in his hand.
translation:
  language: hi
  text: और मैंने एक स्वर्गदूत को स्वर्ग से उतरते देखा, जो अथाह गर्त[a] की कुंजी और एक बड़ी जंजीर हाथ में लिए हुए था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अगाध कुण्ड।’ यूनानी में ‘अथाह गहराई/गर्त’ का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह यूहन्ना के दर्शन-वर्णन की क्रमबद्ध, संयोजक शैली को बनाए रखता है और ‘तब’ जैसी अतिरिक्त कालगत व्याख्या नहीं जोड़ता।
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: दर्शन के वर्णन में ὁράω के अओरिस्ट रूप का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἄγγελον
  choice: एक स्वर्गदूत
  rationale: इस प्रकाशितवाक्यीय संदर्भ में यह शब्द किसी सामान्य संदेशवाहक नहीं, बल्कि स्वर्गीय प्राणी को सूचित करता है।
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से उतरते
  rationale: वर्तमान कृदंत की चल रही गति और ἐκ की स्रोत-दिशा, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἔχοντα
  choice: लिए हुए था
  rationale: कुंजी और जंजीर को अपने पास/हाथ में रखने की दृश्यात्मक क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν κλεῖν τῆς ἀβύσσου
  choice: अथाह गर्त की कुंजी
  rationale: ‘की कुंजी’ यूनानी संबंधकारक को स्वाभाविक हिन्दी में रखता है; ‘अथाह गर्त’ ἄβυσσος की गहरी, अधोलोक-सदृश जगह की छवि को बिना ‘तलहीन’ होने का अतिरिक्त दावा किए व्यक्त करता है।
- source_word: ἅλυσιν μεγάλην
  choice: एक बड़ी जंजीर
  rationale: ἅλυσις का सामान्य अर्थ ‘जंजीर’ है और μεγάλην उसके बड़े आकार या प्रभाव को दर्शाता है।
- source_word: ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: हाथ में
  rationale: शाब्दिक ‘हाथ पर’ की अपेक्षा इस प्रसंग में वस्तुओं को धारण करने का स्वाभाविक आधुनिक हिन्दी प्रयोग।
theological_decisions:
- issue: प्रकाशितवाक्यीय संदर्भ में ἄβυσσος का अनुवाद
  choice: अथाह गर्त
  alternative: तलहीन कुण्ड
  rationale: ‘अथाह गर्त’ मूल शब्द की अगाध गहराई और प्रकाशितवाक्यीय छवि को सुरक्षित रखता है, पर ‘तलहीन’ कहकर यूनानी से अधिक विशिष्ट भौतिक विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी वाक्य की संयोजक गति बनाए रखने के लिए आरम्भ में ‘और’ रखा गया है; कृदंतों को हिन्दी में स्पष्ट, प्रवाही संबंधवाचक उपवाक्य के रूप में व्यक्त किया गया है।
