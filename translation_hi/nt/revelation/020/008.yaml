id: REV.20.8
reference: Revelation 20:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξελεύσεται πλανῆσαι τὰ ἔθνη τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς, τὸν Γὼγ ⸀καὶ Μαγώγ, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον, ὧν ὁ ἀριθμὸς ⸀αὐτῶν ὡς ἡ ἄμμος τῆς θαλάσσης.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/008.yaml
  text: and he will go out to deceive the nations at the four corners of the earth—Gog and Magog—and to gather them for war[c][b][a], whose number is like the sand of the sea.
translation:
  language: hi
  text: और वह पृथ्वी के चारों कोनों में रहने वाली जातियों—गोग और मागोग[c]—को धोखा देने[a] और युद्ध[b] के लिए इकट्ठा करने निकलेगा। उनकी संख्या समुद्र की रेत के समान होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भटकाने।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘लड़ाई।’ यूनानी शब्द का अर्थ ‘युद्ध’ या ‘लड़ाई’ हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘गोग और मागोग’ से यहेजकेल 38–39 की प्रतिध्वनि सुनाई देती है; यहाँ ये नाम अंतिम विद्रोह के लिए इकट्ठी जातियों के प्रतीकात्मक अथवा प्रतिरूपात्मक नाम हो सकते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελεύσεται
  choice: निकलेगा
  rationale: भविष्यकालीन क्रिया में बाहर निकलकर उद्देश्य पूरा करने की गति निहित है; पिछले पद से इसका कर्ता शैतान समझा जाता है।
- source_word: πλανῆσαι
  choice: भरमाने
  rationale: यह πλανάω के ‘धोखा देना/भटका देना’ दोनों अर्थ-क्षेत्रों को स्वाभाविक हिन्दी में समेटता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τὰ ἔθνη
  choice: जातियों
  rationale: प्रकाशितवाक्य के इस वैश्विक संदर्भ में ἔθνη सामूहिक राष्ट्रों/जनसमुदायों को सूचित करता है, न कि अनिवार्य रूप से केवल गैर-यहूदियों को।
- source_word: τὰ ἐν ταῖς τέσσαρσι γωνίαις τῆς γῆς
  choice: पृथ्वी के चारों कोनों में रहनेवाली
  rationale: यह संसार के दूर-दूर तक फैले छोरों का पारंपरिक बिंब है; ‘रहनेवाली’ हिन्दी में स्थान-संबंध को स्पष्ट और सहज बनाता है।
- source_word: τὸν Γὼγ καὶ Μαγώγ
  choice: गोग और मागोग
  rationale: नामों को लिप्यंतरित करके जातियों के समानाधिकरण रूप में रखा गया है, ताकि यहेजकेल 38–39 की प्रतिध्वनि बनी रहे और उनके सटीक प्रतीकात्मक अथवा भूजातीय संदर्भ का निर्णय अनुवाद में न थोपा जाए।
- source_word: συναγαγεῖν
  choice: इकट्ठा करने
  rationale: उद्देश्यसूचक infinitive को सरल और प्रत्यक्ष हिन्दी में व्यक्त करता है तथा अंतिम संघर्ष के लिए एकत्र करने का भाव बनाए रखता है।
- source_word: εἰς τὸν πόλεμον
  choice: युद्ध के लिए
  rationale: πόλεμος ‘युद्ध’ या ‘लड़ाई’ दोनों हो सकता है; ‘युद्ध’ व्यापक अर्थ को सुरक्षित रखता है, जबकि विकल्प पादटिप्पणी में है।
- source_word: ὧν ὁ ἀριθμὸς αὐτῶν
  choice: उनकी संख्या
  rationale: ग्रीक संबंधवाचक रचना का सहज हिन्दी रूप, जिसका संदर्भ इकट्ठी की गई जातियों से है।
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: समुद्र की रेत के समान
  rationale: असंख्यता के परिचित बाइबलीय उपमान और उसके अंतर्पाठीय संबंध को बनाए रखता है।
theological_decisions:
- issue: ‘निकलेगा’ का अंतर्निहित कर्ता
  choice: कर्ता को ‘वह’ रखा गया है, जिसका संदर्भ पिछले पद का शैतान है।
  alternative: इस पद में स्पष्ट रूप से ‘शैतान’ जोड़ना।
  rationale: ग्रीक में कर्ता इस पद में दोहराया नहीं गया; ‘वह’ संदर्भगत निरंतरता बनाए रखता है और अनावश्यक स्पष्टकारी विस्तार से बचता है।
- issue: ‘गोग और मागोग’ का संबंध
  choice: इन्हें पृथ्वी की जातियों का समानाधिकरणात्मक नामांकन रखा गया है।
  alternative: इन्हें केवल दो अलग व्यक्तियों, विशिष्ट आधुनिक राष्ट्रों, अथवा पूर्णतः प्रतीकात्मक नामों के रूप में स्पष्ट करना।
  rationale: ग्रीक वाक्य यहेजकेल 38–39 की प्रतिध्वनि करता है, पर यहाँ नामों के अंतिम अपोकैलिप्टिक संदर्भ को संकीर्ण रूप से परिभाषित नहीं करता; अनुवाद उस तनाव को खुला रखता है।
- issue: πόλεμος की व्याप्ति
  choice: ‘युद्ध’
  alternative: ‘लड़ाई’ अथवा ‘निर्णायक युद्ध’
  rationale: मूल शब्द युद्ध और लड़ाई दोनों अर्थ दे सकता है; ‘युद्ध’ पाठ से अधिक विशिष्ट अंतिम-निर्णायक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘रहनेवाली जातियों’ स्थान-संबंध को स्वाभाविक बनाता है; ‘निकलेगा’ गति और उद्देश्य दोनों को संक्षेप में रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
