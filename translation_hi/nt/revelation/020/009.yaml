  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀνέβησαν ἐπὶ τὸ πλάτος τῆς γῆς, καὶ ⸀ἐκύκλευσαν τὴν παρεμβολὴν τῶν ἁγίων καὶ τὴν πόλιν τὴν ἠγαπημένην. καὶ κατέβη πῦρ ⸂ἐκ τοῦ οὐρανοῦ⸃ καὶ κατέφαγεν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/009.yaml
  text: And they came up over the breadth of the earth and surrounded the camp of the saints and the beloved city[c][b][a]. And fire came down from heaven and consumed them.
translation:
  language: hi
  text: और वे पृथ्वी के विस्तृत फैलाव पर चढ़ आए[a] और पवित्र जनों की छावनी तथा प्रिय नगर[c] को चारों ओर से घेर लिया[b]। और स्वर्ग से आग उतरी और उसने उन्हें भस्म कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पृथ्वी की चौड़ाई पर।” यह अभिव्यक्ति एक विशाल विस्तार की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: या “चारों ओर घेरा डाल लिया।”
    reason: lexical_alternative
  - marker: c
    text: पाठ “प्रिय नगर” की स्पष्ट पहचान नहीं बताता। इसे प्रायः यरूशलेम या अधिक व्यापक अर्थ में परमेश्वर के नगर के रूप में समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνέβησαν
  choice: चढ़ आए
  rationale: क्रिया में ऊपर आने या आगे चढ़ आने का भाव है। यह रूप सैन्य अग्रगमन की छवि को बनाए रखता है, पर किसी विशेष भूगोल को निश्चित नहीं करता।
- source_word: ἐπὶ τὸ πλάτος τῆς γῆς
  choice: पृथ्वी के विस्तृत फैलाव पर
  rationale: πλάτος का मूल भाव चौड़ाई अथवा विस्तृत फैलाव है। यह अनुवाद 'मैदान' जैसा स्रोत में अनुपस्थित भू-आकृतिक अर्थ जोड़े बिना विशाल विस्तार की छवि व्यक्त करता है।
- source_word: ἐκύκλευσαν
  choice: चारों ओर से घेर लिया
  rationale: क्रिया का अर्थ घेरा डालना या चारों ओर से घेरना है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: παρεμβολὴν
  choice: छावनी
  rationale: यह शब्द शिविर, विशेषतः सैन्य छावनी, को सूचित करता है। 'छावनी' संक्षिप्त है और प्रसंग की सामरिक छवि बनाए रखता है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: ἅγιοι का अर्थ पवित्र लोग है। 'पवित्र जन' आधुनिक हिन्दी में समझने योग्य है और किसी विशिष्ट कलीसियाई पदवी को अनावश्यक रूप से नहीं जोड़ता।
- source_word: τὴν πόλιν τὴν ἠγαπημένην
  choice: प्रिय नगर
  rationale: यह निष्पादित कर्मवाच्य कृदंत उस नगर के प्रेम का पात्र होने का भाव देता है। 'प्रिय नगर' कर्ता को जोड़े बिना संक्षिप्त और स्वाभाविक रूप से वही भाव रखता है।
- source_word: κατέβη πῦρ ἐκ τοῦ οὐρανοῦ
  choice: आकाश से आग उतरी
  rationale: यह मूल वाक्य की दिशा और दृश्यात्मकता को सीधे तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: κατέφαγεν αὐτούς
  choice: उसने उन्हें भस्म कर दिया
  rationale: आग के साथ κατεσθίω पूर्णतः निगलने या नष्ट करने का बोध देता है। हिन्दी में 'भस्म कर दिया' आग द्वारा सम्पूर्ण विनाश का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: '''प्रिय नगर'' का संदर्भ'
  choice: मुख्य पाठ में केवल 'प्रिय नगर' रखा गया है।
  alternative: यरूशलेम; अथवा परमेश्वर के लोगों/नगर का व्यापक अंतकालीन प्रतीक
  rationale: यूनानी पाठ इस पद में नगर का नाम नहीं बताता। किसी एक पहचान को मुख्य पाठ में रख देना उस व्याख्यात्मक तनाव को समय से पहले समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। वाक्य में युद्ध और न्याय की दृश्यात्मकता सुरक्षित है। सभी पादटिप्पणी-चिह्न सम्बद्ध पदांश के तुरंत बाद लगाए गए हैं।
