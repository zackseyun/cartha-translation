id: REV.20.13
reference: Revelation 20:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/020/013.yaml
  text: And the sea gave up the dead who were in it[a], and Death and Hades gave up the dead who were in them, and each one was judged according to their deeds.
translation:
  language: hi
  text: और समुद्र ने उन मृतकों को सौंप दिया जो उसमें थे, और मृत्यु और अधोलोक[a] ने उन मृतकों को सौंप दिया जो उनमें थे, और हर एक का न्याय उसके कामों के अनुसार किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ᾅδης (हेडेस) है, अर्थात मृतकों का लोक; यह उन यूनानी शब्दों से अलग है जिनका अनुवाद प्रायः ‘नरक’ किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔδωκεν / ἔδωκαν
  choice: सौंप दिया
  rationale: यहाँ δίδωμι का आशय मृतकों को न्याय के लिए प्रस्तुत कर देना है। ‘सौंप दिया’ इस प्रसंग में स्वाभाविक है और केवल ‘दे दिया’ से अधिक स्पष्ट है।
- source_word: ἡ θάλασσα
  choice: समुद्र
  rationale: θάλασσα का सामान्य और सीधा हिन्दी रूप; यूनानी निश्चितता को हिन्दी में प्रसंग स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς νεκρούς
  choice: मरे हुओं
  rationale: विशेषण के संज्ञात्मक प्रयोग को सहज आधुनिक हिन्दी में व्यक्त करता है। ‘मृतकों’ भी संभव है, पर ‘मरे हुओं’ आम पाठक के लिए अधिक प्रत्यक्ष है।
- source_word: τοὺς ἐν αὐτῇ / τοὺς ἐν αὐτοῖς
  choice: जो उसमें थे / जो उनमें थे
  rationale: स्थान-संबंधी यूनानी पदबंधों की पहचानकारी शक्ति को स्पष्ट सापेक्ष उपवाक्यों द्वारा सुरक्षित रखा गया है। बहुवचन ‘उनमें’ मृत्यु और अधोलोक दोनों की ओर संकेत करता है।
- source_word: ὁ θάνατος
  choice: मृत्यु
  rationale: मूल में मृत्यु को अधोलोक के साथ मानवीकृत सत्ता की तरह प्रस्तुत किया गया है। हिन्दी में शब्द स्वयं इस काव्यात्मक मानवीकरण को वहन कर सकता है।
- source_word: ὁ ᾅδης
  choice: अधोलोक
  rationale: ᾅδης को ‘नरक’ कहना γέεννα तथा अंतिम दंड से अनुचित रूप से मिला सकता है। ‘अधोलोक’ मृतकों के लोक/क्षेत्र का अर्थ देता है और संदर्भगत भेद बनाए रखता है।
- source_word: ἐκρίθησαν ἕκαστος
  choice: हर एक का न्याय ... किया गया
  rationale: बहुवचन क्रिया और वितरणसूचक एकवचन ἕκαστος का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और व्यक्तिगत न्याय पर बल बना रहता है।
- source_word: κατὰ τὰ ἔργα αὐτῶν
  choice: उसके कामों के अनुसार
  rationale: ἔργα के लिए ‘कामों’ ने मूल की व्यापकता तथा बार-बार आने वाली बाइबलीय अभिव्यक्ति को बनाए रखा है। वितरणसूचक ‘हर एक’ के अनुरूप हिन्दी में ‘उसके’ स्वाभाविक है।
theological_decisions:
- issue: अंतिम न्याय के संदर्भ में ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: हेडेस; मृतकों का लोक; नरक
  rationale: ‘अधोलोक’ मृतकों के क्षेत्र का भाव देता है और निकटवर्ती ‘आग की झील’ अथवा γέεννα से इसे नहीं मिलाता। पादटिप्पणी मूल यूनानी शब्द और ‘नरक’ से उसका भेद स्पष्ट करती है।
- issue: θάνατος का मानवीकरण
  choice: मृत्यु
  alternative: मौत
  rationale: ‘मृत्यु’ गरिमामय आधुनिक मानक हिन्दी है और अधोलोक के साथ मृतकों को सौंपने वाली मानवीकृत सत्ता का चित्र सुरक्षित रखती है, बिना अतिरिक्त धर्मसैद्धांतिक दावा किए।
- issue: न्याय का आधार बताने वाला κατὰ τὰ ἔργα
  choice: कामों के अनुसार
  alternative: कर्मों के अनुसार; किए हुए कामों के आधार पर
  rationale: ‘काम’ मूल ἔργον की व्यापकता रखता है। ‘कर्म’ हिन्दी में विशिष्ट धार्मिक-दार्शनिक धारणाएँ जगा सकता है, जबकि ‘आधार पर’ यूनानी संबंध को आवश्यकता से अधिक कारणात्मक बना सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमामय वाक्य-विन्यास। सर्वनाश संबंधी मानवीकरण को बनाए रखा गया है। अर्धविराम और अलग अंतिम वाक्य तीन समांतर घटनाओं तथा व्यक्तिगत न्याय को स्पष्ट करते हैं।
