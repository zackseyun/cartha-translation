id: REV.13.18
reference: Revelation 13:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὧδε ἡ σοφία ἐστίν· ὁ ἔχων νοῦν ψηφισάτω τὸν ἀριθμὸν τοῦ θηρίου, ἀριθμὸς γὰρ ἀνθρώπου ἐστίν· καὶ ὁ ἀριθμὸς ⸀αὐτοῦ ⸂ἑξακόσιοι ἑξήκοντα ἕξ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/018.yaml
  text: 'Here is wisdom: let the one who has understanding calculate the number of the beast[a], for it is the number of a man[b], and its number is six hundred sixty-six.'
translation:
  language: hi
  text: 'बुद्धि इसी में है: जिसे समझ हो, वह उस पशु की संख्या की गणना करे, क्योंकि वह मनुष्य की संख्या है[a]; और उसकी संख्या छह सौ छियासठ है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “यह एक मनुष्य की संख्या है”; अन्य सम्भावना, “यह एक मानवीय संख्या है।”
    reason: alternative_reading
  - marker: b
    text: कुछ पांडुलिपियों में 666 के स्थान पर 616 है।
    reason: textual_variant
lexical_decisions:
- source_word: ὧδε ἡ σοφία ἐστίν
  choice: बुद्धि इसी में है
  rationale: यह अभिव्यक्ति ὧδε के संकेतात्मक बल और σοφία के अर्थ को स्वाभाविक आधुनिक हिन्दी में रखती है, बिना पाठ में ‘आवश्यकता’ जैसा अतिरिक्त विचार जोड़े।
- source_word: ὁ ἔχων νοῦν
  choice: जिसे समझ हो
  rationale: यह एकवचन संबंधवाचक अभिव्यक्ति νοῦς को केवल मानसिक शक्ति नहीं, बल्कि विवेकपूर्ण समझ के अर्थ में व्यक्त करती है।
- source_word: ψηφισάτω
  choice: गणना करे
  rationale: आज्ञार्थक क्रिया संख्या का हिसाब लगाने या गणना करने का निर्देश देती है; ‘गणना करे’ आधुनिक, स्पष्ट और प्रसंगानुकूल है।
- source_word: τὸν ἀριθμὸν τοῦ θηρίου
  choice: उस पशु की संख्या
  rationale: ἀριθμός के लिए ‘संख्या’ सटीक है और θηρίον के लिए प्रकाशितवाक्य के प्रतीकात्मक संदर्भ में प्रचलित ‘पशु’ रखा गया है।
- source_word: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν
  choice: क्योंकि वह मनुष्य की संख्या है
  rationale: 'अनिर्दिष्ट संबंधकारक ἀνθρώπου की संक्षिप्तता और अस्पष्टता को यथासंभव बनाए रखता है: इसका संकेत किसी मनुष्य, मनुष्यजाति, या मानवीय संख्या की ओर समझा जा सकता है।'
- source_word: αὐτοῦ
  choice: उसकी
  rationale: सर्वनाम का स्वाभाविक पूर्वपद ‘पशु’ है; हिन्दी में ‘उसकी’ व्याकरणिक और प्रसंगगत दोनों रूप से स्पष्ट है।
- source_word: ἑξακόσιοι ἑξήκοντα ἕξ
  choice: छह सौ छियासठ
  rationale: यूनानी संख्या का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ἀριθμὸς γὰρ ἀνθρώπου ἐστίν में ἀνθρώπου का आशय
  choice: मुख्य पाठ में ‘मनुष्य की संख्या’
  alternative: ‘एक मनुष्य की संख्या’ अथवा ‘मानवीय संख्या’
  rationale: यूनानी संबंधकारक यह निश्चित नहीं करता कि अभिप्राय किसी खास मनुष्य से है, सामान्य मानवता से, या दिव्य के विपरीत किसी मानवीय संख्या से। मुख्य पाठ संक्षिप्त अस्पष्टता बनाए रखता है और पादटिप्पणी प्रमुख विकल्प देती है।
- issue: संख्या का पाठभेद
  choice: मुख्य पाठ में 666
  alternative: '616'
  rationale: SBLGNT के मुख्य पाठ और प्रबल पांडुलिपीय प्रमाण के अनुसार 666 रखा गया है; 616 प्राचीन और उल्लेखनीय पाठभेद होने के कारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बुद्धि इसी में है’ मूल की संक्षिप्त उद्घोषणा को बनाए रखता है; ‘समझ’ और ‘गणना’ विवेक तथा संख्यात्मक हिसाब—दोनों को स्पष्ट करते हैं। पादटिप्पणी-चिह्न उसी पदांश और संख्या के बाद रखे गए हैं जिनसे वे संबंधित हैं।
