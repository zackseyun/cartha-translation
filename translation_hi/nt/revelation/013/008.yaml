id: REV.13.8
reference: Revelation 13:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσκυνήσουσιν ⸀αὐτὸν πάντες οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ⸀οὗ οὐ γέγραπται τὸ ὄνομα ⸀αὐτοῦ ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου τοῦ ἐσφαγμένου ἀπὸ καταβολῆς κόσμου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/008.yaml
  text: And all who dwell on the earth will worship him—everyone whose name has not been written in the book of life of the Lamb who was slain from the foundation of the world[a].
translation:
  language: hi
  text: और पृथ्वी पर रहने वाले सभी लोग उसकी आराधना करेंगे—हर वह व्यक्ति जिसका नाम उस मेम्ने की जीवन की पुस्तक में नहीं लिखा गया है, जो संसार की नींव डाले जाने के समय से वध किया गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर वह व्यक्ति जिसका नाम संसार की नींव डाले जाने के समय से उस मेम्ने की जीवन की पुस्तक में नहीं लिखा गया है, जो वध किया गया है।” यूनानी में “संसार की नींव डाले जाने के समय से” को या तो “वध किया गया है” से या “नहीं लिखा गया है” से जोड़ा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: προσκυνήσουσιν
  choice: आराधना करेंगे
  rationale: प्रकाशितवाक्य में यह क्रिया धार्मिक उपासना और भक्तिपूर्ण दंडवत के अर्थ में आती है; यहाँ पशु की आराधना का भाव स्पष्ट है।
- source_word: κατοικοῦντες ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहने वाले
  rationale: यह प्रकाशितवाक्य की बार-बार आने वाली अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में रखते हुए उसके शाब्दिक रूप को भी सुरक्षित रखता है।
- source_word: οὗ οὐ γέγραπται τὸ ὄνομα αὐτοῦ
  choice: हर वह व्यक्ति जिसका नाम ... नहीं लिखा गया है
  rationale: यूनानी में एकवचन सम्बन्धवाचक रचना प्रत्येक व्यक्ति के नाम पर ध्यान देती है; हिन्दी में यह रूप स्वाभाविक और स्पष्ट है। पूर्णकालिक γέγραπται पूर्व लेखन से बनी वर्तमान स्थिति को व्यक्त करता है, जिसे ‘नहीं लिखा गया है’ सुरक्षित रखता है।
- source_word: βιβλίῳ τῆς ζωῆς
  choice: जीवन की पुस्तक
  rationale: यह बाइबलीय प्रतिमा का प्रचलित, स्पष्ट और अर्थपूर्ण हिन्दी रूप है।
- source_word: τοῦ ἀρνίου
  choice: मेम्ने की
  rationale: ἀρνίον प्रकाशितवाक्य में मसीह-संबंधी उपाधि है; ‘मेम्ना’ बलिदान और मसीही प्रतिमा को सुरक्षित रखता है।
- source_word: τοῦ ἐσφαγμένου
  choice: जो ... वध किया गया है
  rationale: σφάζω हिंसक और बलिदानी मृत्यु का संकेत देता है। ‘वध किया गया’ इस गंभीरता को ‘मार डाला गया’ से अधिक प्रत्यक्ष रूप में सुरक्षित रखता है।
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: संसार की नींव डाले जाने के समय से
  rationale: यह ἀπό के आरंभ-बिंदु और καταβολή κόσμου की सृष्टि-संबंधी बाइबलीय अभिव्यक्ति को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘संसार की नींव डाले जाने के समय से’ का वाक्यगत संबंध
  choice: मुख्य पाठ में इसे ‘वध किया गया है’ से जोड़ा गया है।
  alternative: 'इसे नाम के लिखे जाने से जोड़ा जा सकता है: ‘हर वह व्यक्ति जिसका नाम संसार की नींव डाले जाने के समय से उस मेम्ने की जीवन की पुस्तक में नहीं लिखा गया है, जो वध किया गया है।’'
  rationale: यूनानी शब्दक्रम में कालसूचक पदबंध ठीक पहले आए ‘वध किए गए’ कृदंत से स्वाभाविक रूप से जुड़ सकता है; परन्तु प्रकाशितवाक्य 17:8 का समानांतर इसे नाम लिखे जाने से जोड़ने का मजबूत आधार देता है। वास्तविक व्याकरणिक और धर्मवैज्ञानिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘आराधना’, ‘जीवन की पुस्तक’ और ‘मेम्ना’ प्रकाशितवाक्य की धार्मिक तथा प्रतीकात्मक शब्दावली को बनाए रखते हैं।
