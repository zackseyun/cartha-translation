  rationale: यह पृथ्वी के लोगों में उत्पन्न विस्मय को व्यक्त करता है, बिना उसे प्रशंसा या भय के रूप में सीमित किए।
- source_word: ὅλη ἡ γῆ
  choice: सारी पृथ्वी
  rationale: प्रकाशितवाक्य के व्यापक प्रलयदर्शी संदर्भ में γῆ के लिए ‘पृथ्वी’ अधिक सम्भावित है, यद्यपि ‘देश/भूमि’ भी भाषिक रूप से सम्भव है।
- source_word: ὀπίσω τοῦ θηρίου
  choice: उस पशु के पीछे हो ली
  rationale: दिशात्मक ‘पीछे’ और निष्ठापूर्वक अनुसरण—दोनों भावों को स्वाभाविक हिन्दी मुहावरे में रखता है।
- source_word: θηρίου
  choice: पशु
  rationale: प्रकाशितवाक्य की प्रलयदर्शी छवि में θηρίον का मानक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: पशु के सिर की प्रतीत होने वाली मृत्यु और पुनःस्थापना का स्वरूप
  choice: दृश्य में प्राणघातक वध जैसा दिखाई देने और घाव के ठीक होने को व्यक्त किया गया है, पर घटना की प्रकृति निश्चित नहीं की गई।
  alternative: इसे वास्तविक मृत्यु और पुनरुत्थान, साम्राज्य या शासक की प्रतीकात्मक पुनःस्थापना, अथवा छलपूर्ण अभिनय के रूप में स्पष्ट करना।
  rationale: ὡς (‘मानो’) तुलना अथवा प्रतीति को बनाए रखता है। पद स्वयं यह तय नहीं करता कि घटना शाब्दिक, प्रतीकात्मक या छलपूर्ण है; अतः अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘पशु’ प्रलयदर्शी प्रतीक को बनाए रखता है; ‘अचम्भित होकर … पीछे हो ली’ विस्मय और अनुसरण को एक स्वाभाविक वाक्य-प्रवाह में जोड़ता है।
