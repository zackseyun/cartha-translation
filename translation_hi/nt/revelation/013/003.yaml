  choice: उसका प्राणघातक घाव
  rationale: यूनानी संबंधवाचक रचना को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करते हुए घाव के मरणकारी स्वरूप को बनाए रखता है।
- source_word: ἐθεραπεύθη
  choice: ठीक हो गया
  rationale: निष्क्रिय θεραπεύω का अर्थ घाव के चंगा अथवा ठीक हो जाने से है; सामान्य आधुनिक हिन्दी में ‘ठीक हो गया’ सहज है।
- source_word: ἐθαυμάσθη
