  text: और उसके सिरों में से एक ऐसा था, मानो उसका वध करके उसे मृत्यु तक पहुँचा दिया गया हो[a], पर उसका प्राणघातक घाव चंगा हो गया। और सारी पृथ्वी विस्मित होकर उस पशु के पीछे हो ली[b]।
  philosophy: optimal-equivalence
