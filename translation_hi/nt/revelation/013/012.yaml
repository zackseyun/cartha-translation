id: REV.13.12
reference: Revelation 13:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὴν ἐξουσίαν τοῦ πρώτου θηρίου πᾶσαν ποιεῖ ἐνώπιον αὐτοῦ. καὶ ⸀ποιεῖ τὴν γῆν καὶ τοὺς ἐν αὐτῇ κατοικοῦντας ἵνα ⸀προσκυνήσουσιν τὸ θηρίον τὸ πρῶτον, οὗ ἐθεραπεύθη ἡ πληγὴ τοῦ θανάτου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/012.yaml
  text: And it exercises all the authority of the first beast in its presence[a]. And it causes the earth and those who dwell on it to worship the first beast[b], whose mortal wound was healed.
translation:
  language: hi
  text: और वह पहले पशु का सारा अधिकार उसकी उपस्थिति में[a] काम में लाता है। वह पृथ्वी और उस पर रहने वालों से उस पहले पशु की आराधना करवाता है, जिसका प्राणघातक घाव[b] ठीक हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने।” यह वाक्यांश बता सकता है कि दूसरा पशु पहले पशु की निगाह में या ठीक उसके सामने कार्य करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी मृत्यु का घाव”; अर्थात ऐसा घाव जो मृत्यु लाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह शब्द केवल सामर्थ्य नहीं, बल्कि अधिकार के प्रयोग या अधिकार-क्षेत्र को दर्शाता है।
- source_word: πᾶσαν
  choice: सारा
  rationale: यह पहले पशु के अधिकार की संपूर्णता पर बल देता है और हिन्दी में स्वाभाविक है।
- source_word: ποιεῖ τὴν ἐξουσίαν
  choice: अधिकार ... काम में लाता है
  rationale: यूनानी मुहावरे का आशय अधिकार का प्रयोग करना है; यह हिन्दी में सहज रहते हुए क्रियाशीलता को व्यक्त करता है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसकी उपस्थिति में
  rationale: यह पहले पशु के सामने अथवा उसकी निगाह में कार्य करने का भाव रखता है; स्थानगत और संबंधपरक दोनों संभावनाएँ बनी रहती हैं।
- source_word: ποιεῖ ... ἵνα προσκυνήσουσιν
  choice: से ... आराधना करवाता है
  rationale: यह कारक रचना दर्शाती है कि दूसरा पशु आराधना को घटित कराता है, पर इस पद में बल-प्रयोग की ठीक मात्रा निर्दिष्ट नहीं है।
- source_word: τὴν γῆν
  choice: पृथ्वी
  rationale: प्रकाशितवाक्य के व्यापक, संसार-संबंधी संदर्भ में यह उपयुक्त और प्रचलित अनुवाद है।
- source_word: τοὺς ἐν αὐτῇ κατοικοῦντας
  choice: उस पर रहने वालों
  rationale: यह मूल की क्रियात्मक अभिव्यक्ति और प्रकाशितवाक्य में पृथ्वी पर रहने वालों की आवर्ती छवि को बनाए रखता है।
- source_word: προσκυνήσουσιν
  choice: आराधना
  rationale: संदर्भ में यह झुककर धार्मिक भक्ति और निष्ठा प्रकट करने को दर्शाता है; ‘आराधना’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: θηρίον τὸ πρῶτον
  choice: पहला पशु
  rationale: यह निकटवर्ती संदर्भ में इस पशु को दूसरे पशु से स्पष्ट रूप से अलग करता है।
- source_word: ἐθεραπεύθη
  choice: ठीक हो गया था
  rationale: निष्क्रिय रूप चंगा या ठीक किए जाने को व्यक्त करता है; हिन्दी में घाव के साथ यह सरल और स्वाभाविक है।
- source_word: ἡ πληγὴ τοῦ θανάτου αὐτοῦ
  choice: उसका प्राणघातक घाव
  rationale: शाब्दिक ‘उसकी मृत्यु का घाव’ एक ऐसा घाव सूचित करता है जो मृत्यु लाता है; ‘प्राणघातक घाव’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दूसरे पशु द्वारा पृथ्वी के निवासियों से आराधना कराने की शक्ति
  choice: से ... आराधना करवाता है
  alternative: आराधना करने के लिए विवश करता है
  rationale: यूनानी कारक रचना बताती है कि दूसरा पशु आराधना को घटित कराता है, पर इस पद में यह स्पष्ट नहीं करती कि वह केवल प्रभाव डालता है या प्रत्यक्ष बल प्रयोग करता है। इसलिए अधिक प्रबल ‘विवश करता है’ को मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पशु,’ ‘अधिकार,’ और ‘आराधना’ जैसे प्रमुख प्रकाशितवाक्यीय शब्दों को औपचारिक धार्मिक अर्थ के साथ बनाए रखा गया है; अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
