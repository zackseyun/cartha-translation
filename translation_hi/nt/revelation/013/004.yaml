reference: Revelation 13:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ προσεκύνησαν τῷ δράκοντι ⸂ὅτι ἔδωκεν⸃ τὴν ἐξουσίαν τῷ θηρίῳ, καὶ προσεκύνησαν τῷ θηρίῳ λέγοντες· Τίς ὅμοιος τῷ θηρίῳ, καὶ τίς ⸀δύναται πολεμῆσαι μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/004.yaml
  text: And they worshiped the dragon because he had given authority to the beast[a], and they worshiped the beast, saying, “Who is like the beast[c][b], and who is able to make war with it?”
translation:
  language: hi
  text: और उन्होंने उस अजगर की आराधना की, क्योंकि उसने उस पशु को अधिकार दिया था; और उन्होंने उस पशु की आराधना की और कहा, “उस पशु के समान कौन है?[a][c] और कौन उससे युद्ध कर सकता है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पशु की बराबरी कौन कर सकता है?”
    reason: lexical_alternative
  - marker: b
    text: या, “कौन उसके विरुद्ध युद्ध छेड़ सकता है?”
    reason: lexical_alternative
  - marker: c
    text: यह जयघोष संभवतः पुराने नियम में परमेश्वर की अनुपमता के विषय में कही गई भाषा की प्रतिध्वनि है (उदाहरण के लिए, निर्गमन 15:11; भजन 35:10); यहाँ वही भाषा निंदात्मक ढंग से पशु पर लागू की गई है।
    reason: cross_reference
lexical_decisions:
- source_word: προσεκύνησαν
  choice: आराधना की
  rationale: प्रकाशितवाक्य के संदर्भ में यह क्रिया केवल झुकने या सम्मान देने की नहीं, बल्कि धार्मिक उपासना की ओर संकेत करती है; इसलिए ‘आराधना की’ मूर्तिपूजक भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: δράκοντι
  choice: अजगर
  rationale: प्रकाशितवाक्य की प्रतीकात्मक भाषा में δράκων का प्रचलित सीधा हिन्दी रूप ‘अजगर’ है; यहाँ प्रतीक की व्याख्या किए बिना उसे यथावत रखा गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह शब्द अजगर की आराधना किए जाने का कारण बताता है—उसने पशु को अधिकार दिया था।
- source_word: ἔδωκεν
  choice: दिया था
  rationale: ग्रीक एओरिस्ट पूर्व घटना को बताता है; हिन्दी में ‘दिया था’ आराधना से पहले अधिकार दिए जाने का क्रम सहज रूप से स्पष्ट करता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ आशय केवल सामर्थ्य नहीं, बल्कि सौंपे गए शासनाधिकार से है; ‘अधिकार’ इस अर्थ को सुरक्षित रखता है।
- source_word: θηρίῳ
  choice: पशु
  rationale: प्रकाशितवाक्य की अपोकैलिप्टिक छवि में θηρίον का सीधा और स्थापित हिन्दी रूप ‘पशु’ है।
- source_word: λέγοντες
  choice: कहते हुए
  rationale: यह कृदंत आराधना करने वालों के साथ-साथ बोले गए शब्दों का परिचय देता है; ‘आराधना करते हुए कहा’ हिन्दी में स्वाभाविक है।
- source_word: Τίς ὅμοιος τῷ θηρίῳ
  choice: कौन उस पशु के समान है?
  rationale: यह अनुवाद मूल अलंकारिक प्रश्न और परमेश्वर की अनुपमता वाली बाइबिलीय भाषा की संभावित प्रतिध्वनि, दोनों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: δύναται
  choice: कर सकता है
  rationale: यह क्षमता या सामर्थ्य व्यक्त करता है; आधुनिक हिन्दी में ‘कर सकता है’ स्वाभाविक और स्पष्ट है।
- source_word: πολεμῆσαι μετ’ αὐτοῦ
  choice: उससे युद्ध कर सकता है
  rationale: πολεμέω का अर्थ साधारण लड़ाई से अधिक संगठित युद्ध करना है; μετά के साथ यहाँ विरोधी मुठभेड़ का भाव है, जिसे ‘उससे युद्ध करना’ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पशु के लिए सर्वनाम का रूप
  choice: ‘उससे’ का प्रयोग, जो हिन्दी में ‘पशु’ के व्याकरणिक रूप के अनुरूप है और अनावश्यक व्यक्तिकरण नहीं करता
  alternative: ‘उसके विरुद्ध’ या ऐसा पुरुषवाचक रूप जो पशु को स्पष्ट रूप से व्यक्ति बनाए
  rationale: ग्रीक में θηρίον नपुंसकलिंग है और αὐτοῦ उसी को संदर्भित करता है। हिन्दी ‘पशु’ व्याकरणतः पुल्लिंग है, इसलिए अंग्रेज़ी के ‘it/him’ का भेद हूबहू व्यक्त नहीं किया जा सकता; ‘उससे’ स्वाभाविक रहते हुए निजी या मानवीय व्यक्तित्व का अतिरिक्त दावा नहीं जोड़ता।
- issue: परमेश्वर की अनुपमता वाली भाषा की प्रतिध्वनि
  choice: मुख्य पाठ में ‘कौन उस पशु के समान है?’ को बिना व्याख्यात्मक विस्तार के रखना
  alternative: वाक्य में ही स्पष्ट करना कि यह परमेश्वर के लिए प्रयुक्त भाषा की निंदात्मक नकल है
  rationale: यह प्रश्न संभवतः निर्गमन 15:11 और भजन 35:10 जैसी भाषा की प्रतिध्वनि है। मूल पाठ इस संबंध को स्पष्ट नहीं करता, इसलिए तनाव और संकेत को मुख्य पाठ में सुरक्षित रखकर टिप्पणी पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आराधना’, ‘अधिकार’ और ‘युद्ध’ संदर्भ की धार्मिक तथा राजनीतिक गंभीरता बनाए रखते हैं। दूसरी बार ‘भी’ हिन्दी में पुनरुक्ति को सहज बनाता है और अजगर के साथ पशु की आराधना के जोड़ को व्यक्त करता है।
