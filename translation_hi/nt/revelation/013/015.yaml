source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτῷ ⸂δοῦναι πνεῦμα⸃ τῇ εἰκόνι τοῦ θηρίου, ἵνα καὶ λαλήσῃ ἡ εἰκὼν τοῦ θηρίου καὶ ποιήσῃ ⸀ἵνα ὅσοι ἐὰν μὴ προσκυνήσωσιν τῇ εἰκόνι τοῦ θηρίου ἀποκτανθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/015.yaml
  text: And it was given to him to give breath to the image of the beast[b][a], so that the image of the beast might even speak and cause those who would not worship the image of the beast to be killed.
translation:
  language: hi
  text: और उसे पशु की मूर्ति को साँस देने की सामर्थ्य दी गई[a], ताकि पशु की मूर्ति बोल भी सके और ऐसा कराए[b] कि जितने लोग पशु की मूर्ति की आराधना न करें, वे मार डाले जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पशु की मूर्ति को आत्मा दे’ अथवा ‘पशु की मूर्ति को जीवन दे’।
    reason: lexical_alternative
  - marker: b
    text: या ‘और यह संभव करे कि जितने लोग पशु की मूर्ति की आराधना न करें, वे मार डाले जाएँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: उसे यह सामर्थ्य दिया गया
  rationale: यूनानी कर्मवाच्य में देने वाला अनिर्दिष्ट है; हिन्दी में स्वाभाविकता के लिए ‘सामर्थ्य’ जोड़ा गया है, पर देने वाले की पहचान नहीं की गई।
- source_word: δοῦναι πνεῦμα
  choice: साँस डाले
  rationale: πνεῦμα का अर्थ ‘साँस’, ‘आत्मा’ या ‘जीवन’ हो सकता है। बोलने लगने वाली मूर्ति के प्रसंग में ‘साँस’ ठोस और स्वाभाविक है तथा अनावश्यक रूप से किसी निजी आत्मा का संकेत नहीं देता।
- source_word: εἰκών
  choice: मूर्ति
  rationale: पशु की उपासना के संदर्भ में ‘मूर्ति’ आधुनिक हिन्दी में धार्मिक प्रतिरूप का स्वाभाविक शब्द है; यह उसे केवल ‘प्रतिमा’ या किसी खास भौतिक आकार तक सीमित नहीं करता।
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य की प्रतीकात्मक भाषा में प्रचलित और स्रोत के अनुरूप शब्द।
- source_word: ἵνα καὶ λαλήσῃ
  choice: ताकि ... बोल भी सके
  rationale: ἵνα उद्देश्य/परिणाम व्यक्त करता है और καί यहाँ मूर्ति के बोलने की चौंकाने वाली अतिरिक्त क्षमता पर बल देता है।
- source_word: ποιήσῃ ἵνα
  choice: और ऐसा कराए कि
  rationale: यूनानी की कारणवाचक संरचना को स्वाभाविक हिन्दी में रखा गया है, बिना यह स्पष्ट किए कि हत्या प्रत्यक्ष रूप से कौन करता है।
- source_word: ὅσοι ἐὰν μὴ προσκυνήσωσιν
  choice: जितने लोग ... आराधना न करें
  rationale: अनिश्चित संबंधवाचक संरचना की व्यापकता बनी रहती है और हिन्दी में वाक्य स्वाभाविक रहता है।
- source_word: προσκυνήσωσιν
  choice: आराधना करें
  rationale: इस प्रसंग में क्रिया धार्मिक उपासना को व्यक्त करती है, केवल झुककर सम्मान देने को नहीं।
- source_word: ἀποκτανθῶσιν
  choice: मार डाले जाएँ
  rationale: यूनानी कर्मवाच्य सुरक्षित है और आधुनिक हिन्दी में मृत्यु-दंड/हत्या का स्पष्ट भाव व्यक्त होता है।
theological_decisions:
- issue: मूर्ति को दिए जाने वाले πνεῦμα का अर्थ
  choice: साँस
  alternative: आत्मा; जीवन
  rationale: ‘साँस’ मूर्ति के बोलने के लिए सजीव किए जाने की छवि बनाए रखता है, पर यह दावा नहीं करता कि उसे वास्तविक दिव्य जीवन या कोई व्यक्तिगत आत्मा मिली।
- issue: ἐδόθη में देने वाले की पहचान
  choice: देने वाले को अनिर्दिष्ट रखा गया
  alternative: परमेश्वर या अजगर/शैतान को स्पष्ट रूप से देने वाला बताना
  rationale: यूनानी पाठ देने वाले का नाम नहीं बताता; अनुवाद इस धर्मवैचारिक तनाव और अप्रकट कर्ता को सुरक्षित रखता है।
- issue: हत्या कराने की एजेंसी
  choice: ‘ऐसा कराए’ के द्वारा कारणवाचकता रखी गई, पर वास्तविक हत्यारे को अनिर्दिष्ट छोड़ा गया
  alternative: मूर्ति स्वयं लोगों को मार डालती है
  rationale: ποιήσῃ ἵνα परिणाम घटित कराने का भाव देता है, जबकि ἀποκτανθῶσιν कर्मवाच्य है; इसलिए प्रत्यक्ष हत्यारे की पहचान जोड़ना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उसे’ से संदर्भगत पात्र की पहचान पाठक पर छोड़ी गई है; ‘पशु’, ‘मूर्ति’ और ‘आराधना’ प्रकाशितवाक्य की धार्मिक-प्रतीकात्मक शैली के अनुरूप हैं।
