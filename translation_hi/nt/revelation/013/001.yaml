id: REV.13.1
reference: Revelation 13:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἐκ τῆς θαλάσσης θηρίον ἀναβαῖνον, ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά, καὶ ἐπὶ τῶν κεράτων αὐτοῦ δέκα διαδήματα, καὶ ἐπὶ τὰς κεφαλὰς αὐτοῦ ⸀ὀνόματα βλασφημίας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/001.yaml
  text: And I saw a beast coming up out of the sea[a], having ten horns and seven heads, and on its horns ten crowns[b], and on its heads names of blasphemy.
translation:
  language: hi
  text: और मैंने समुद्र में से एक पशु को ऊपर आते देखा। उसके दस सींग और सात सिर थे। उसके सींगों पर दस मुकुट[a] थे, और उसके सिरों पर ईशनिंदा के नाम[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक विशिष्ट अर्थ: ‘दस राजमुकुट’ या ‘दस किरीट’।'
    reason: lexical_alternative
  - marker: b
    text: या, ‘ईशनिंदापूर्ण नाम’।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: साधारण भूतकालीन कथन; यूनानी पाठ में न तो ‘दृष्टि में’ और न ‘नज़र उठाकर’ जैसी अतिरिक्त बात है।
- source_word: ἐκ τῆς θαλάσσης
  choice: समुद्र में से
  rationale: ἐκ भीतर से बाहर आने का सजीव भाव देता है; ‘समुद्र में से’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य की प्रतीकात्मक छवि को बिना उसकी व्याख्यात्मक पहचान तय किए अक्षुण्ण रखता है।
- source_word: ἀναβαῖνον
  choice: ऊपर आते
  rationale: वर्तमान कृदंत समुद्र से उभरने की जारी क्रिया दिखाता है; ‘ऊपर आते’ दृश्य को सहज हिन्दी में रखता है।
- source_word: ἔχον κέρατα δέκα καὶ κεφαλὰς ἑπτά
  choice: उसके दस सींग और सात सिर थे
  rationale: शाब्दिक ‘रखता हुआ’ की अपेक्षा हिन्दी का स्वाभाविक अधिकार-सूचक वाक्य विन्यास अपनाया गया है, जबकि संख्या और प्रतीक ज्यों के त्यों हैं।
- source_word: διαδήματα
  choice: मुकुट
  rationale: διάδημα विशेषतः राजसत्ता का चिह्न, यानी राजमुकुट/किरीट है। सामान्य पाठक के लिए ‘मुकुट’ सहज है; अधिक विशिष्ट अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ὀνόματα βλασφημίας
  choice: ईशनिंदा के नाम
  rationale: सम्बन्धकारक रचना को निकटता से सुरक्षित रखता है और यह अस्पष्टता नहीं मिटाता कि नाम स्वयं निंदात्मक थे अथवा ईशनिंदा व्यक्त करते थे।
- source_word: ἐπὶ τὰς κεφαλὰς αὐτοῦ
  choice: उसके सिरों पर ... लिखे थे
  rationale: ἐπί का स्थानवाचक अर्थ ‘पर’ है। हिन्दी में नामों के किसी सतह पर होने का स्वाभाविक आशय स्पष्ट करने के लिए ‘लिखे थे’ जोड़ा गया है, बिना नामों की सामग्री की व्याख्या किए।
theological_decisions:
- issue: प्रतीकात्मक प्रलयदर्शी चित्रण
  choice: ‘पशु’, ‘सींग’, ‘सिर’ और ‘मुकुट’ को चित्रात्मक रूप में ही रखा गया है।
  alternative: मुख्य पाठ में पशु को किसी राज्य, साम्राज्य, शासक या शैतानी प्रतिनिधि के रूप में पहचानना।
  rationale: पद स्वयं प्रतीक प्रस्तुत करता है, उसकी ऐतिहासिक या युगांत-संबंधी पहचान तय नहीं करता; अनुवाद को यह तनाव बनाए रखना चाहिए।
- issue: διάδηματα का राजकीय आशय
  choice: मुख्य पाठ में ‘मुकुट’, पाद-टिप्पणी में ‘राजमुकुट’।
  alternative: मुख्य पाठ में ‘किरीट’ या ‘राजमुकुट’।
  rationale: ‘मुकुट’ सर्वसुलभ आधुनिक हिन्दी है, जबकि पाद-टिप्पणी इस यूनानी शब्द की विशिष्ट राजकीय छाया सुरक्षित रखती है।
- issue: ὀνόματα βλασφημίας की सम्बन्धकारक रचना
  choice: ‘ईशनिंदा के नाम’।
  alternative: ‘ईशनिंदापूर्ण नाम’ या ‘निंदात्मक नाम’।
  rationale: निकटतर रचना यह खुलापन बनाए रखती है कि ये ईशनिंदा से जुड़े नाम हैं; अधिक प्रवाहपूर्ण विशेषणात्मक रूप पाद-टिप्पणी में उपलब्ध है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप। लंबे यूनानी सहभागी वाक्य को तीन छोटे हिन्दी वाक्यों में बाँटा गया है ताकि दृश्य स्पष्ट रहे। ‘दरिंदा’ अधिक उग्र और ‘जानवर’ अधिक बोलचाल का होता; इसलिए ‘पशु’ चुना गया। सभी प्रतीक बिना सांप्रदायिक या युगांत-संबंधी व्याख्या जोड़े रखे गए हैं।
