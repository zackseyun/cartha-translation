id: REV.13.16
reference: Revelation 13:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ποιεῖ πάντας, τοὺς μικροὺς καὶ τοὺς μεγάλους, καὶ τοὺς πλουσίους καὶ τοὺς πτωχούς, καὶ τοὺς ἐλευθέρους καὶ τοὺς δούλους, ἵνα ⸀δῶσιν αὐτοῖς ⸀χάραγμα ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς ἢ ἐπὶ τὸ μέτωπον αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/016.yaml
  text: And it causes everyone—the small and the great[a], and the rich and the poor, and the free and the servants—to be given a mark on their right hand or on their forehead,
translation:
  language: hi
  text: और वह सभी लोगों—छोटे और बड़े, धनी और निर्धन, स्वतंत्र और दास—के दाहिने हाथ या माथे पर एक चिह्न लगवाता है[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “ताकि वे उन्हें एक चिह्न दें।” यूनानी वाक्यरचना में चिह्न देने वाले कर्ता का स्पष्ट उल्लेख नहीं है; मुख्य पाठ अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
    reason: कठिन यूनानी वाक्यरचना और अधिक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: ποιεῖ
  choice: लगवाता है
  rationale: यहाँ ποιέω के साथ ἵνα और संभावनार्थक क्रिया कारणवाचक अर्थ देते हैं। हिंदी का ‘लगवाता है’ पशु की प्रभावी भूमिका को स्वाभाविक ढंग से व्यक्त करता है, पर ‘विवश करता है’ की तरह बलपूर्वक बाध्यता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: πάντας
  choice: सभी लोगों
  rationale: इसके बाद दी गई परस्पर-विरोधी सामाजिक श्रेणियाँ समस्त संबंधित लोगों को समेटती हैं। ‘सभी लोगों’ से यह व्यापकता स्पष्ट और सहज रहती है।
- source_word: τοὺς μικροὺς καὶ τοὺς μεγάλους
  choice: छोटे और बड़े
  rationale: यह सामाजिक पद या महत्त्व के सभी स्तरों को समेटने वाला युग्म है। शाब्दिक और लयात्मक रूप बनाए रखते हुए हिंदी में भी इसका आशय समझ में आता है।
- source_word: τοὺς πλουσίους καὶ τοὺς πτωχούς
  choice: धनी और निर्धन
  rationale: यह आर्थिक स्थिति का सीधा विरोधी युग्म है; ‘धनी और निर्धन’ आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी है।
- source_word: τοὺς ἐλευθέρους καὶ τοὺς δούλους
  choice: स्वतंत्र और दास
  rationale: ‘स्वतंत्र’ के साथ विरोध में δοῦλος कानूनी और सामाजिक पराधीनता को प्रमुख बनाता है, इसलिए ‘सेवक’ के बजाय ‘दास’ अधिक सटीक है।
- source_word: ἵνα δῶσιν αὐτοῖς χάραγμα
  choice: एक चिह्न लगवाता है
  rationale: यूनानी में शब्दशः ‘ताकि वे उन्हें एक चिह्न दें’ है, पर कर्ता अनिर्दिष्ट है और हिंदी में वह रूप असहज तथा संदिग्ध होगा। कारणवाचक ‘लगवाता है’ घटना और पशु की भूमिका दोनों को स्वाभाविक रूप में व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: χάραγμα
  choice: चिह्न
  rationale: χάραγμα किसी पहचानसूचक अंकन, छाप या निशान को दर्शाता है। ‘चिह्न’ प्रकाशितवाक्य के संदर्भ में व्यापक और मानक हिंदी विकल्प है।
- source_word: ἐπὶ τῆς χειρὸς αὐτῶν τῆς δεξιᾶς
  choice: उनके दाहिने हाथ पर
  rationale: एकवचन ‘हाथ’ सामूहिक ‘उनके’ के साथ वितरणात्मक अर्थ देता है और यूनानी एकवचन के निकट रहते हुए हिंदी में स्वाभाविक है।
- source_word: ἢ ἐπὶ τὸ μέτωπον αὐτῶν
  choice: या माथे पर
  rationale: ‘माथे’ को पहले आए ‘उनके’ के अधीन समझना हिंदी में सहज है; इससे अनावश्यक पुनरावृत्ति से बचते हुए स्थान का विकल्प स्पष्ट रहता है।
theological_decisions:
- issue: स्वतंत्र लोगों के विरोध में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: तत्काल संदर्भ स्वतंत्र और पराधीन सामाजिक स्थिति का विरोध प्रस्तुत करता है। इसलिए ‘दास’ बंधित स्थिति को स्पष्ट रखता है और सामान्य सेवा का अर्थ आरोपित नहीं करता।
- issue: कठिन वाक्यांश ἵνα δῶσιν αὐτοῖς χάραγμα को व्यक्त करना
  choice: एक चिह्न लगवाता है
  alternative: ताकि वे उन्हें एक चिह्न दें
  rationale: मुख्य पाठ में स्वाभाविक हिंदी के साथ कारणवाचक संबंध और चिह्न लगाए जाने की घटना व्यक्त की गई है। यूनानी में बहुवचन कर्ता स्पष्ट नहीं है; इसलिए उसकी अस्पष्टता को किसी निश्चित मानवीय या संस्थागत कर्ता से नहीं भरा गया। अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है। विरोधी युग्मों की प्रकाशनात्मक लय बनाए रखने के लिए em dash का प्रयोग किया गया है। ‘लगवाता है’ कारणवाचकता को स्पष्ट करता है, जबकि ‘विवश करता है’ जैसे अधिक बलपूर्ण अर्थ से बचता है। पद अगले वाक्यांश में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
