source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο θηρίον ἀναβαῖνον ἐκ τῆς γῆς, καὶ εἶχεν κέρατα δύο ὅμοια ἀρνίῳ, καὶ ἐλάλει ὡς δράκων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/011.yaml
  text: And I saw another beast coming up out of the earth[a], and it had two horns like a lamb, and it was speaking like a dragon.
translation:
  language: hi
  text: फिर मैंने एक और पशु को पृथ्वी[a] से निकलते हुए देखा। उसके मेम्ने जैसे दो सींग थे, और वह अजगर के समान बोलता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि’। यूनानी शब्द γῆ का अर्थ ‘पृथ्वी’ या ‘भूमि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο θηρίον
  choice: एक और पशु
  rationale: प्रकाशितवाक्य की दर्शनात्मक भाषा में θηρίον विरोधी पाशविक सत्ता के लिए स्थापित शब्द है; ‘पशु’ उस प्रतीकात्मक और अंतर्पाठीय बल को बनाए रखता है।
- source_word: ἀναβαῖνον ἐκ τῆς γῆς
  choice: पृथ्वी में से ऊपर आते
  rationale: वर्तमान कृदंत उभरने की चलती हुई दृश्यात्मक क्रिया व्यक्त करता है। ‘पृथ्वी में से ऊपर आते’ स्वाभाविक हिन्दी में इस गति को बनाए रखता है; γῆ का ‘भूमि’ अर्थ पादटिप्पणी में दिया गया है।
- source_word: κέρατα δύο ὅμοια ἀρνίῳ
  choice: दो सींग मेम्ने के सींगों जैसे
  rationale: ὅμοια व्याकरणतः बहुवचन ‘सींगों’ से संबंधित है। हिन्दी में ‘मेम्ने के सींगों जैसे’ तुलना को स्पष्ट रखता और मेम्ने की छवि से संभावित संकेत भी बनाए रखता है।
- source_word: ἐλάλει ὡς δράκων
  choice: अजगर के समान बोलता था
  rationale: अपूर्ण काल निरंतर अथवा चरित्रगत बोलने का वर्णन करता है। ‘बोलता था’ हिन्दी में इस वर्णनात्मक पक्ष को स्वाभाविक रूप से व्यक्त करता है, और ‘के समान’ तुलना को पहचान में बदले बिना सुरक्षित रखता है।
theological_decisions:
- issue: ἀρνίον का अनुवाद और प्रकाशितवाक्य के ‘मेम्ने’ की छवि से उसका संभावित संबंध
  choice: मेम्ना
  alternative: छोटा मेम्ना
  rationale: ‘मेम्ना’ प्रकाशितवाक्य में प्रचलित प्रतीकात्मक संबंध को बनाए रखता है, पर इस पशु को वास्तविक मेम्ने के समान ठहराता नहीं। ‘छोटा मेम्ना’ हिन्दी में अनावश्यक रूप से आकार या आयु पर बल देता।
- issue: γῆ का अर्थ
  choice: पृथ्वी
  alternative: भूमि
  rationale: दोनों अर्थ शब्दार्थ की दृष्टि से संभव हैं। समुद्र से निकले पहले पशु के साथ व्यापक दर्शनात्मक विरोध को देखते हुए ‘पृथ्वी’ मुख्य पाठ में उपयुक्त है, जबकि ‘भूमि’ को पादटिप्पणी में रखकर वास्तविक अस्पष्टता सुरक्षित की गई है।
- issue: मेम्ने-जैसे सींग और अजगर-जैसी वाणी के बीच संबंध
  choice: विरोध को ‘पर’ से स्पष्ट करना
  alternative: दोनों उपवाक्यों को केवल ‘और’ से जोड़ना
  rationale: मूल में दोनों बार καί है, किंतु दृश्य में बाहरी मेम्ना-सदृशता और अजगर-सदृश वाणी का स्पष्ट वैचारिक विरोध है। हिन्दी का ‘पर’ इस निहित विरोध को स्वाभाविक रूप से व्यक्त करता है, बिना उसकी धार्मिक पहचान का अतिरिक्त निर्णय किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और दर्शनात्मक वर्णन। ‘पशु’, ‘मेम्ना’ और ‘अजगर’ प्रकाशितवाक्य की प्रतीकात्मक शब्दावली को सुसंगत रखते हैं।
