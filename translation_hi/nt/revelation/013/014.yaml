language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πλανᾷ ⸀τοὺς κατοικοῦντας ἐπὶ τῆς γῆς διὰ τὰ σημεῖα ἃ ἐδόθη αὐτῷ ποιῆσαι ἐνώπιον τοῦ θηρίου, λέγων τοῖς κατοικοῦσιν ἐπὶ τῆς γῆς ποιῆσαι εἰκόνα τῷ θηρίῳ, ⸂ὃς ἔχει⸃ τὴν πληγὴν ⸂τῆς μαχαίρης καὶ ἔζησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/014.yaml
  text: And it deceives those who dwell on the earth because of the signs that it was given to perform in the presence of the beast[c][b][a], telling those who dwell on the earth to make an image for the beast that had the wound of the sword and yet lived.
translation:
  language: hi
  text: और वह पृथ्वी पर रहने वालों को उन चिन्हों के द्वारा भटकाता है[a], जिन्हें उसे उस पशु के सामने करने की अनुमति दी गई थी, और पृथ्वी पर रहने वालों से कहता है कि वे उस पशु के लिए एक प्रतिमा बनाएँ[b], जिसे तलवार का घाव लगा था, फिर भी वह जीवित रहा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पृथ्वी पर रहने वालों को धोखा देता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “उस पशु की एक प्रतिमा बनाएँ”; यूनानी में अधिक शाब्दिक रूप से “उस पशु के लिए एक प्रतिमा” है।
    reason: lexical_alternative
  - marker: c
    text: या, “जिसे तलवार का घाव लगा था और जो फिर जीवित हो गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλανᾷ
  choice: भटकाता है
  rationale: यह वर्तमान काल के सक्रिय क्रिया-रूप का स्वाभाविक हिन्दी अनुवाद है और छल देकर गलत राह पर ले जाने का भाव रखता है; ‘धोखा देता है’ भी सम्भव है।
- source_word: κατοικοῦντας / κατοικοῦσιν ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहनेवालों
  rationale: प्रकाशितवाक्य में बार-बार आनेवाली इस अभिव्यक्ति का शाब्दिक और विषयगत स्वरूप बनाए रखता है।
- source_word: διὰ τὰ σημεῖα
  choice: उन चिन्हों के द्वारा
  rationale: διά के कारण अथवा साधन दोनों से जुड़े अर्थ में यहाँ साधन का भाव प्रमुख है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: σημεῖα
  choice: चिन्हों
  rationale: मूल संज्ञा का सीधा अर्थ ‘चिन्ह’ है; ‘चमत्कारी’ जोड़ना मूल में निहित व्याख्या से अधिक होता।
- source_word: ἐδόθη αὐτῷ ποιῆσαι
  choice: जिन्हें उसे ... दिखाने की अनुमति दी गई थी
  rationale: निष्क्रिय वाक्य-रचना को रखते हुए अधिकार देनेवाले को स्पष्ट नहीं किया गया। ‘दिखाने’ से चिन्ह करने/प्रदर्शित करने का स्वाभाविक हिन्दी भाव आता है।
- source_word: ἐνώπιον τοῦ θηρίου
  choice: उस पशु के सामने
  rationale: स्थान और उपस्थिति दोनों का अर्थ संक्षेप और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: λέγων
  choice: कहता है
  rationale: सहभागी क्रिया को हिन्दी में मुख्य क्रिया के रूप में देना अधिक सहज है और ‘आज्ञा देता है’ जैसा अतिरिक्त बल नहीं जोड़ता।
- source_word: ποιῆσαι εἰκόνα τῷ θηρίῳ
  choice: उस पशु के लिए एक प्रतिमा बनाएँ
  rationale: सम्प्रदान कारक τῷ θηρίῳ को ‘के लिए’ से व्यक्त किया गया है; यह ‘पशु की प्रतिमा’ की सम्भावित व्याख्या को अनिवार्य नहीं बनाता।
- source_word: εἰκόνα
  choice: प्रतिमा
  rationale: उपासना-संबंधी प्रतिनिधि रूप के सन्दर्भ में ‘प्रतिमा’ आधुनिक हिन्दी में स्वाभाविक है, यद्यपि ‘छवि’ भी सम्भव है।
- source_word: ὃς ἔχει τὴν πληγὴν τῆς μαχαίρης
  choice: जिसे तलवार का घाव लगा था
  rationale: यूनानी में ‘घाव रखता है’ वर्तमान रूप है, पर पूर्व घटना का वर्णन हिन्दी में इस प्रकार स्वाभाविक है और पशु को घाव प्राप्त होने का आशय स्पष्ट करता है।
- source_word: μάχαιρα
  choice: तलवार
  rationale: यह प्रकाशितवाक्य के सन्दर्भ में मानक और पर्याप्त रूप से सटीक अनुवाद है।
- source_word: καὶ ἔζησεν
  choice: फिर भी वह जीवित रहा
  rationale: घाव के बावजूद जीवित रहने का प्रसंगगत विरोधाभास व्यक्त करता है और ‘जी उठा’ की अपेक्षा पुनरुत्थान का अधिक प्रबल दावा नहीं करता।
theological_decisions:
- issue: ἐδόθη में निहित कर्ता
  choice: ‘अनुमति दी गई थी’ कहकर देनेवाले को अनिर्दिष्ट रखा गया।
  alternative: ‘परमेश्वर ने उसे सामर्थ्य दी थी’ अथवा ‘उसे अधिकार मिला था।’
  rationale: प्रकाशितवाक्य की निष्क्रिय रचना परम अनुमति का संकेत दे सकती है, पर मूल पाठ देनेवाले का स्पष्ट नाम नहीं लेता; अनुवाद उसी तनाव को बनाए रखता है।
- issue: ἔζησεν और घाव के बाद पशु की दशा
  choice: ‘फिर भी वह जीवित रहा।’
  alternative: ‘वह फिर जीवित हो गया’ अथवा ‘वह जी उठा।’
  rationale: मूल घटना जीवन बने रहने या जीवन लौटने—दोनों की ओर संकेत कर सकती है; चुना हुआ रूप पुनरुत्थान की विशिष्ट व्याख्या थोपे बिना आश्चर्यजनक जीवन को व्यक्त करता है।
- issue: εἰκών का पशु से सम्बन्ध
  choice: ‘पशु के लिए एक प्रतिमा।’
  alternative: ‘पशु की एक प्रतिमा।’
  rationale: यूनानी में सम्बन्ध सम्प्रदान कारक से है, न कि सीधे सम्बन्धकारक से; ‘के लिए’ समर्पण/सन्दर्भ का भाव सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। ‘पशु’, ‘चिन्ह’ और ‘प्रतिमा’ जैसे परिचित बाइबलीय शब्द सामान्य पाठक के लिए बोधगम्य हैं। दोहराई गई यूनानी अभिव्यक्ति के अनुरूप ‘पृथ्वी पर रहनेवालों’ दोनों बार रखा गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
