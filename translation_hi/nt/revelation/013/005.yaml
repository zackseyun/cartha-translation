id: REV.13.5
reference: Revelation 13:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐδόθη αὐτῷ στόμα λαλοῦν μεγάλα καὶ ⸀βλασφημίας, καὶ ἐδόθη αὐτῷ ⸀ἐξουσία ποιῆσαι μῆνας ⸀τεσσεράκοντα δύο.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/005.yaml
  text: And a mouth was given to him[a], speaking great things and blasphemies[b], and authority was given to him to act for forty-two months.
translation:
  language: hi
  text: और उसे एक ऐसा मुँह दिया गया, जो बड़ी-बड़ी बातें[a] और ईशनिन्दाएँ बोलता था; और उसे बयालीस महीने तक कार्य करने[b] का अधिकार दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में “बड़ी-बड़ी बातें” से सम्भवतः घमण्ड भरी या डींग मारने वाली बातें अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों और अनुवादों में अर्थ है, “उसे बयालीस महीने तक बने रहने का अधिकार दिया गया।”
    reason: textual_variant
lexical_decisions:
- source_word: ἐδόθη
  choice: दिया गया
  rationale: कर्मवाच्य रूप यह दिखाता है कि पशु इसे अपने आप नहीं रखता, बल्कि उसे दिया जाता है। पद में दोहराए गए इसी रूप को बनाए रखा गया है।
- source_word: στόμα
  choice: मुँह
  rationale: शाब्दिक और स्वाभाविक अनुवाद प्रकाशितवाक्य की सजीव प्रतीकात्मक छवि को बनाए रखता है।
- source_word: λαλοῦν
  choice: बोलता था
  rationale: वर्तमान कृदन्त στόμα का वर्णन करता है। हिन्दी में सम्बन्धवाचक उपवाक्य द्वारा इसे स्वाभाविक रूप दिया गया है।
- source_word: μεγάλα
  choice: बड़ी-बड़ी बातें
  rationale: यह यूनानी के व्यापक अर्थ को बनाए रखता है; प्रसंग में घमण्ड और डींग का भाव है, पर मूल शब्द स्वयं स्पष्ट रूप से ‘डींगें’ नहीं कहता।
- source_word: βλασφημίας
  choice: ईशनिन्दाएँ
  rationale: बहुवचन और परमेश्वर-विरोधी धार्मिक अपराध, दोनों को संक्षिप्त तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि दिए गए अधिकार या अनुमति का भाव व्यक्त करता है और ἐδόθη के साथ ठीक बैठता है।
- source_word: ποιῆσαι
  choice: कार्य करने
  rationale: ποιέω का अर्थ व्यापक है। अवधि के साथ ‘कार्य करने’ का प्रयोग स्वाभाविक है और ‘बने रहने’ वाले पाठान्तर को मुख्य पाठ में नहीं मिलाता।
- source_word: μῆνας τεσσεράκοντα δύο
  choice: बयालीस महीने तक
  rationale: कालावधि बताने वाले कर्मकारक को हिन्दी में ‘तक’ से स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: μεγάλα में पशु की वाणी का स्वरूप
  choice: बड़ी-बड़ी बातें
  alternative: डींगें; घमण्ड भरी बातें
  rationale: प्रसंग अहंकारी और परमेश्वर-विरोधी वाणी की ओर संकेत करता है, पर अनुवाद में मूल विशेषण की व्यापकता को बनाए रखा गया है।
- issue: कालावधि के साथ ποιῆσαι का अर्थ
  choice: बयालीस महीने तक कार्य करने
  alternative: बयालीस महीने तक बना रहने/जारी रहने
  rationale: मुख्य पाठ SBLGNT के ποιῆσαι का अनुसरण करता है। परिचित वैकल्पिक पाठ-परम्परा को मुख्य पाठ में लेने के बजाय पादटिप्पणी में रखा गया है।
- issue: बार-बार आए ἐδόθη का निहित कर्ता
  choice: कर्त्ता को अनकहा रखते हुए ‘दिया गया’
  alternative: परमेश्वर ने दिया; अनुमति दी गई
  rationale: यूनानी पाठ देने वाले का नाम नहीं बताता। कर्मवाच्य को बनाए रखने से सम्भावित दैवी अनुमति का संकेत रहता है, पर उसे स्पष्ट कथन में नहीं बदला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘एक ऐसा मुँह’ सर्वनाश-साहित्य की सजीव छवि बनाए रखता है; ‘ईशनिन्दाएँ’ धार्मिक अर्थ को स्पष्ट करता है; और दोनों कर्मवाच्य क्रियाओं से मूल की पुनरावृत्ति सुरक्षित रहती है।
