id: REV.13.6
reference: Revelation 13:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἤνοιξε τὸ στόμα αὐτοῦ εἰς ⸀βλασφημίας πρὸς τὸν θεόν, βλασφημῆσαι τὸ ὄνομα αὐτοῦ καὶ τὴν σκηνὴν αὐτοῦ, τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/006.yaml
  text: And it opened its mouth in blasphemies against God[a], to blaspheme his name and his dwelling[b], those dwelling in heaven.
translation:
  language: hi
  text: और उसने परमेश्वर के विरुद्ध निन्दा की बातें कहने के लिए अपना मुँह खोला—उसके नाम और उसके निवास[b] की, अर्थात् स्वर्ग में निवास करनेवालों की, निन्दा करने के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “उसके नाम, उसके निवास और स्वर्ग में निवास करनेवालों की निन्दा करने के लिए,” अर्थात् अन्तिम पदबंध ‘निन्दा करने’ का तीसरा कर्म है, न कि ‘उसके निवास’ की व्याख्या।'
    reason: alternative_reading
  - marker: b
    text: “निवास” का अनुवाद “तम्बू” या “पवित्र तम्बू” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε τὸ στόμα αὐτοῦ
  choice: उसने … अपना मुँह खोला
  rationale: यूनानी मुहावरे की सजीवता और कर्ता के रूप में पशु का संकेत बनाए रखता है; हिन्दी में ‘अपना’ स्वाभाविक है।
- source_word: εἰς βλασφημίας
  choice: निन्दा की बातें कहने के लिए
  rationale: बहुवचन βλασφημίας को स्वाभाविक आधुनिक हिन्दी में अनेक निन्दात्मक कथनों के रूप में व्यक्त करता है; केवल अमूर्त ‘निन्दा’ तक सीमित नहीं करता।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर के विरुद्ध
  rationale: शत्रुतापूर्ण वाणी के प्रसंग में πρός का विरोधात्मक अर्थ स्पष्ट करता है।
- source_word: βλασφημῆσαι
  choice: निन्दा करने के लिए
  rationale: उद्देश्य/परिणाम सूचित करनेवाले अनन्त क्रियारूप को सीधे और पारदर्शी ढंग से व्यक्त करता है।
- source_word: τὸ ὄνομα αὐτοῦ
  choice: उसके नाम
  rationale: ‘नाम’ को अक्षरशः रखकर परमेश्वर की पहचान और सम्मान से जुड़ी बाइबलीय अर्थ-समृद्धि सुरक्षित रखी गई है।
- source_word: τὴν σκηνὴν αὐτοῦ
  choice: उसके निवास
  rationale: σκηνή के ‘तम्बू/मिलापवाला तम्बू/निवास’ अर्थों में से ‘निवास’ आधुनिक पाठक के लिए स्पष्ट है और अनावश्यक रीति-संबंधी अर्थ आरोपित नहीं करता।
- source_word: τοὺς ἐν τῷ οὐρανῷ σκηνοῦντας
  choice: स्वर्ग में निवास करनेवालों
  rationale: वर्तमान कृदन्त का स्थायी निवास-संबंधी भाव रखता है और σκηνή तथा σκηνοῦντας के शब्दगत संबंध को ‘निवास’ की पुनरावृत्ति से दर्शाता है।
theological_decisions:
- issue: ‘उसके निवास’ और ‘स्वर्ग में निवास करनेवालों’ का पारस्परिक संबंध
  choice: अन्तिम पदबंध को ‘उसके निवास’ का व्याख्यात्मक समानाधिकरण मानते हुए अल्पविरामों से सीधे रखा गया है।
  alternative: 'इसे ‘नाम’ और ‘निवास’ के साथ निन्दा का तीसरा समानान्तर कर्म माना जा सकता है: ‘उसके नाम, उसके निवास और स्वर्ग में निवास करनेवालों की निन्दा करने के लिए।’'
  rationale: यूनानी व्याकरण दोनों पाठों की अनुमति देता है। समानाधिकरण वाला पाठ σκηνή और σκηνοῦντας के निकट शब्दगत संबंध को बनाए रखता है, जबकि वैकल्पिक समन्वित पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निन्दा की बातें’ बहुवचन यूनानी संज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है। समानाधिकरण की असामान्य संरचना को जानबूझकर कुछ प्रत्यक्ष रखा गया है, ताकि मूल की व्याकरणिक अस्पष्टता मिट न जाए।
