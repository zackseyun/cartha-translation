- from: और उसने परमेश्वर के विरुद्ध निन्दा की बातें कहने के लिए अपना मुँह खोला—उसके नाम और उसके निवास[b], स्वर्ग में निवास करनेवालों, की निन्दा करने के लिए।[a]
  to: और उसने परमेश्वर के विरुद्ध निन्दा की बातें कहने के लिए अपना मुँह खोला—उसके नाम और उसके निवास[b] की, अर्थात् स्वर्ग में निवास करनेवालों की, निन्दा करने के लिए।[a]
  rationale: The revision repairs the Hindi grammar of the chosen appositional reading by explicitly marking both ‘his dwelling’ and the explanatory phrase ‘those dwelling in heaven’ as objects of ‘blaspheme.’ It retains the source/audit trail’s preferred appositional construal and preserves the coordinate construal in footnote a. Footnote b is narrowed to lexical alternatives that do not import the more specific ‘Tent of Meeting’ concept.
