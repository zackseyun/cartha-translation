  yaml_path: translation/nt/revelation/013/017.yaml
  text: so that no one can buy or sell unless he has the mark[b][a], the name of the beast or the number of its name.
translation:
  language: hi
  text: ताकि कोई भी न तो खरीद सके, न बेच सके, जब तक कि उसके पास वह चिह्न[a], उस पशु का नाम या उसके नाम की संख्या न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यरचना में यह भी संभव है कि “उस पशु का नाम या उसके नाम की संख्या” उस चिह्न की पहचान बताए, न कि तीन अलग-अलग वस्तुओं की सूची हो।
    reason: वाक्यरचनात्मक अस्पष्टता
lexical_decisions:
- source_word: ἵνα μή τις δύνηται
  choice: ताकि कोई भी ... न सके
  rationale: ἵνα यहाँ उद्देश्य या परिणाम व्यक्त करता है, μή τις का अर्थ ‘कोई भी नहीं’ है, और δύνηται सामर्थ्य या संभावना बताता है। यह हिंदी रचना स्वाभाविक रहते हुए उसी बल को बनाए रखती है।
- source_word: ἀγοράσαι ἢ πωλῆσαι
  choice: खरीद या बेच
  rationale: दोनों क्रियाएँ सामान्य व्यापारिक लेन-देन को दर्शाती हैं; यह सीधा और सहज हिंदी समतुल्य है।
- source_word: εἰ μὴ ὁ ἔχων
  choice: जब तक कि उसके पास ... न हो
  rationale: εἰ μή एकमात्र अपवाद प्रस्तुत करता है और ὁ ἔχων का अर्थ ‘वह जिसके पास है’ है। हिंदी में यह रचना लिंग-निरपेक्ष, स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: τὸ χάραγμα
  choice: वह चिह्न
  rationale: χάραγμα किसी अंकित, उकेरे या लगाए गए निशान को दर्शाता है। ‘चिह्न’ आधुनिक हिंदी में व्यापक रूप से समझा जाने वाला और प्रसंगानुकूल शब्द है।
- source_word: τὸ ὄνομα τοῦ θηρίου
  choice: पशु का नाम
  rationale: यह संबंधकारक पदबंध का सीधा अनुवाद है और अगले पदबंध के साथ समानांतरता बनाए रखता है।
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य में यह सर्वनाश-संबंधी प्रतीकात्मक विरोधी का पदनाम है; ‘पशु’ हिंदी में स्थापित और संदर्भानुकूल अनुवाद है।
- source_word: ἢ τὸν ἀριθμὸν τοῦ ὀνόματος αὐτοῦ
  choice: या उसके नाम की संख्या
  rationale: αὐτοῦ निकटवर्ती ‘पशु’ की ओर संकेत करता है। हिंदी ‘उसके’ यूनानी के संबंध को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से उसके व्यक्तित्व के प्रश्न का निर्णय नहीं करता।
theological_decisions:
- issue: ὁ ἔχων की पुल्लिंग एकवचन व्याकरणिक रूपरेखा
  choice: जब तक कि उसके पास ... न हो
  alternative: सिवाय उस व्यक्ति के जिसके पास ... हो
  rationale: यूनानी पद व्याकरणतः पुल्लिंग एकवचन है, पर इसका प्रयोग सामान्यतः किसी भी व्यक्ति के लिए हुआ है। हिंदी की चुनी हुई रचना इस सामान्य अर्थ को बिना लिंग आयात किए ठीक प्रकार व्यक्त करती है।
- issue: चिह्न, नाम और संख्या के बीच वाक्यरचनात्मक संबंध
  choice: 'अल्पविराम के साथ क्रम: ‘वह चिह्न, पशु का नाम या उसके नाम की संख्या’'
  alternative: ‘वह चिह्न, अर्थात् पशु का नाम या उसके नाम की संख्या’
  rationale: 'यूनानी पाठ में पद क्रम से आते हैं, पर उनका संबंध कुछ अस्पष्ट है: वे तीन पहचान-साधन हो सकते हैं, अथवा नाम/संख्या चिह्न को स्पष्ट कर सकते हैं। मुख्य पाठ स्पष्ट व्याख्यात्मक ‘अर्थात्’ जोड़कर इस तनाव को समाप्त नहीं करता; टिप्पणी वैकल्पिक समझ सुरक्षित रखती है।'
- issue: αὐτοῦ का संदर्भ और व्यक्तिकरण
  choice: उसके नाम की संख्या
  alternative: पशु के नाम की संख्या
  rationale: ‘उसके’ मूल सर्वनाम-संबंध को बनाए रखता है। हिंदी में यह रूप अंग्रेज़ी के ‘his/its’ जैसा व्याकरणिक लिंग-विकल्प थोपे बिना पशु की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खरीद या बेच’ सामान्य पाठक के लिए स्पष्ट है; ‘चिह्न’ सर्वनाश-संबंधी प्रसंग की गंभीरता बनाए रखता है। वाक्य मूल के उद्देश्य/परिणाम और आर्थिक निषेध दोनों को संक्षेप में व्यक्त करता है।
