id: REV.13.2
reference: Revelation 13:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ εἶδον ἦν ὅμοιον παρδάλει, καὶ οἱ πόδες αὐτοῦ ὡς ἄρκου, καὶ τὸ στόμα αὐτοῦ ὡς στόμα λέοντος. καὶ ἔδωκεν αὐτῷ ὁ δράκων τὴν δύναμιν αὐτοῦ καὶ τὸν θρόνον αὐτοῦ καὶ ἐξουσίαν μεγάλην.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/002.yaml
  text: And the beast that I saw was like a leopard[a], and its feet were like a bear's, and its mouth was like a lion's mouth. And the dragon gave it his power and his throne and great authority.
translation:
  language: hi
  text: और जो पशु मैंने देखा था, वह चीते के समान था[a]; उसके पाँव भालू के पाँवों जैसे थे और उसका मुँह सिंह के मुँह जैसा था। और अजगर ने उसे अपनी सामर्थ्य, अपना सिंहासन और अपना बहुत बड़ा अधिकार दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: चीते, भालू और सिंह का यह चित्रण दानिय्येल 7 में पशुओं के दर्शनों की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य में यह एक प्रतीकात्मक, विकराल सत्ता के लिए प्रयुक्त सर्वनामिक शब्द है। ‘पशु’ आधुनिक हिन्दी में स्वाभाविक है और ‘जानवर’ की अपेक्षा अधिक गरिमापूर्ण तथा पारंपरिक प्रतीकात्मक बल रखता है।
- source_word: ὅμοιον παρδάλει
  choice: चीते के समान
  rationale: ὅμοιος के साथ सम्प्रदान कारक समानता व्यक्त करता है। ‘चीते के समान’ दर्शनात्मक तुलना को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: πόδες ... ὡς ἄρκου
  choice: पाँव भालू के पाँवों जैसे
  rationale: ग्रीक में πούς का सामान्य अर्थ ‘पाँव’ है; ‘पंजे’ कहना अनावश्यक विशिष्टता जोड़ता। हिन्दी में तुलना स्पष्ट करने के लिए लुप्त पद ‘पाँवों’ की पूर्ति की गई है।
- source_word: στόμα ... ὡς στόμα λέοντος
  choice: मुँह ... सिंह के मुँह जैसा
  rationale: ग्रीक में στόμα की पुनरावृत्ति स्पष्ट है; उसे हिन्दी में भी रखा गया है ताकि चित्रात्मकता और वाक्य-संतुलन बना रहे।
- source_word: δράκων
  choice: अजगर
  rationale: प्रकाशितवाक्य के दर्शनात्मक पात्र के लिए ‘अजगर’ स्थापित हिन्दी बाइबलीय पद है और विशाल सर्पाकार प्राणी का भाव व्यक्त करता है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यहाँ δύναμις कार्यकारी शक्ति या क्षमता बताता है। ‘सामर्थ्य’ इसे ἐξουσία (‘अधिकार’) से स्पष्ट रूप से अलग रखता है।
- source_word: θρόνον
  choice: सिंहासन
  rationale: θρόνος का सीधा अर्थ ‘सिंहासन’ है और इसमें राजकीय शासन का भाव निहित है।
- source_word: ἐξουσίαν μεγάλην
  choice: बड़ा अधिकार
  rationale: ἐξουσία शासन करने के अधिकार या प्रत्यायोजित सत्ता को व्यक्त करता है। ‘बड़ा अधिकार’ मूल की विशेषण-संज्ञा संरचना को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔδωκεν
  choice: दे दिया
  rationale: δίδωμι का सीधा अर्थ ‘देना’ है। संयुक्त क्रिया ‘दे दिया’ हिन्दी में पूर्ण घटना को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: αὐτοῦ
  choice: अपनी / अपना
  rationale: अजगर से संबंधित तीनों वस्तुओं के लिए हिन्दी का निजवाचक ‘अपना’ स्वाभाविक रूप से उसी कर्ता की ओर संकेत करता है और पशु तथा अजगर के संदर्भों को स्पष्ट रखता है।
theological_decisions:
- issue: अजगर और पशु के बीच संबंध
  choice: अजगर अपनी सामर्थ्य, सिंहासन और अधिकार पशु को देता है; इससे अधिक संबंध की व्याख्या नहीं जोड़ी गई।
  alternative: अजगर को स्पष्ट रूप से शैतान कह देना या पशु की राजनीतिक पहचान बताना।
  rationale: इस पद में केवल दिए जाने का संबंध व्यक्त है। अन्य पदों की पहचान या कोई विशिष्ट धर्मवैज्ञानिक व्याख्या मुख्य पाठ में लाना मूल से आगे जाना होता।
- issue: दानिय्येल 7 की मिश्रित पशु-छवि
  choice: चीते, भालू और सिंह की तुलनाएँ सीधे रखी गई हैं और संभावित संकेत को पादटिप्पणी में बताया गया है।
  alternative: मुख्य पाठ में दानिय्येल 7 का स्पष्ट उल्लेख या प्रतीकों की व्याख्या जोड़ना।
  rationale: मूल यूनानी पाठ छवियाँ प्रस्तुत करता है, पर इस पद में उनका अर्थ नहीं खोलता; इसलिए उसकी व्याख्यात्मक खुली प्रकृति सुरक्षित रखी गई है।
- issue: δύναμις और ἐξουσία का भेद
  choice: क्रमशः ‘सामर्थ्य’ और ‘अधिकार’।
  alternative: दोनों को ‘शक्ति’ या ‘सत्ता’ कहना।
  rationale: अलग हिन्दी शब्द मूल के कार्यकारी शक्ति और शासनाधिकार के अर्थभेद को बनाए रखते हैं, बिना उसे अतिरंजित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दर्शनात्मक शैली रखी गई है। ‘के समान’ और ‘जैसा’ का संयोजन अनावश्यक एकरसता से बचते हुए मूल की तीन तुलनाएँ स्पष्ट करता है। ‘पशु’ और ‘अजगर’ प्रतीकात्मक बाइबलीय शब्दावली को बनाए रखते हैं।
