id: REV.13.7
reference: Revelation 13:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτῷ ποιῆσαι πόλεμον μετὰ τῶν ἁγίων καὶ νικῆσαι αὐτούς, καὶ ἐδόθη αὐτῷ ἐξουσία ἐπὶ πᾶσαν φυλὴν καὶ λαὸν καὶ γλῶσσαν καὶ ἔθνος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/007.yaml
  text: And it was given to him to make war against the saints and to conquer them[c][b][a], and authority was given to him over every tribe and people and language and nation.
translation:
  language: hi
  text: और उसे पवित्र लोगों के विरुद्ध[a] युद्ध करने और उन पर विजय पाने[b] दिया गया, और उसे हर गोत्र, जनसमुदाय, भाषा[c] और राष्ट्र पर अधिकार दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पवित्र लोगों के साथ’; पर युद्ध के इस मुहावरे में अर्थ ‘पवित्र लोगों के विरुद्ध’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन पर काबू पाने’ अथवा ‘उन्हें पराजित करने’।
    reason: lexical_alternative
  - marker: c
    text: मूल शब्द का शाब्दिक अर्थ ‘जीभ’ भी है; यहाँ उससे आशय ‘भाषा’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδόθη αὐτῷ
  choice: उसे ... दिया गया
  rationale: दोनों स्थानों पर कर्मवाच्य रखा गया है, ताकि देने वाले की पहचान अनकही रहे और मूल पाठ का संयम तथा धर्मवैचारिक तनाव बना रहे।
- source_word: ποιῆσαι πόλεμον μετὰ τῶν ἁγίων
  choice: पवित्र लोगों के विरुद्ध युद्ध करने
  rationale: युद्ध के साथ प्रयुक्त μετά यहाँ साथ होने के बजाय शत्रुतापूर्ण मुठभेड़ का भाव देता है। ‘पवित्र लोग’ सामान्य पाठक के लिए स्वाभाविक है और ἅγιοι को परमेश्वर के लोगों के रूप में व्यक्त करता है।
- source_word: νικῆσαι αὐτούς
  choice: उन पर विजय पाने
  rationale: ‘विजय पाना’ प्रकाशितवाक्य में νικάω के बार-बार आने वाले विजय-विषय को बनाए रखता है; ‘पराजित करना’ भी संभव है, पर उससे क्रिया कुछ अधिक निर्णायक हो सकती है।
- source_word: ἐξουσία
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि दिया गया शासनाधिकार या अधिकार-क्षेत्र व्यक्त करता है।
- source_word: φυλή
  choice: गोत्र
  rationale: चारहरे सामूहिक सूत्र में यह वंश या कुल पर आधारित समुदाय को संक्षेप और परिचित ढंग से व्यक्त करता है।
- source_word: λαός
  choice: जनसमुदाय
  rationale: सूची में ‘लोग’ कहने से संख्या-संबंधी असहजता हो सकती है; ‘जनसमुदाय’ एक विशिष्ट सामूहिक जनसमूह का भाव स्पष्ट करता है।
- source_word: γλῶσσα
  choice: भाषा
  rationale: मूल शब्द का शाब्दिक अर्थ ‘जीभ’ हो सकता है, किंतु इस जातीय-भाषायी सूची में उसका आशय बोली जाने वाली भाषा है।
- source_word: ἔθνος
  choice: राष्ट्र
  rationale: इस चारहरे सूत्र में यह व्यापक जातीय या राष्ट्रीय समुदाय का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: दो बार आए अनाम कर्मवाच्य ἐδόθη
  choice: ‘उसे ... दिया गया’ कहकर देने वाले को अनाम रखा गया है।
  alternative: ‘परमेश्वर ने उसे अनुमति दी’ या ‘उसे अनुमति मिली।’
  rationale: मूल यूनानी पाठ देने वाले का नाम नहीं बताता। अनाम कर्मवाच्य बनाए रखने से दैवी प्रभुता और बुराई को मिले सीमित अवसर के बीच का तनाव व्याख्या द्वारा पहले से हल नहीं किया जाता।
- issue: पवित्र लोगों पर पशु की विजय का स्वरूप
  choice: ‘उन पर विजय पाने’ का सीधा कथन रखा गया है।
  alternative: इसे केवल बाहरी या अस्थायी विजय बताने वाला स्पष्टीकरण मुख्य पाठ में जोड़ना।
  rationale: इस पद में विजय की सीमा या प्रकृति स्पष्ट नहीं की गई; अतः प्रकाशितवाक्य के व्यापक धर्मविज्ञान से कोई व्याख्यात्मक योग यहाँ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र लोगों’ को पारंपरिक लेकिन आज कम सहज ‘संतों’ पर प्राथमिकता दी गई है। समानांतर दोनों खंडों में ‘दिया गया’ रखकर यूनानी की पुनरावृत्ति और अनाम कर्मवाच्य सुरक्षित हैं।
