source:
  edition: SBLGNT
  text: καὶ ποιεῖ σημεῖα μεγάλα, ⸂ἵνα καὶ πῦρ ποιῇ⸃ ἐκ τοῦ οὐρανοῦ ⸂καταβαίνειν εἰς⸃ τὴν γῆν ἐνώπιον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/013.yaml
  text: And it performs great signs[b][a], even causing fire to come down from heaven to the earth before people.
translation:
  language: hi
  text: और वह बड़े-बड़े चिन्ह[a] दिखाता है; यहाँ तक कि लोगों के सामने[b] स्वर्ग से पृथ्वी पर आग भी उतरवा देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़े-बड़े चमत्कार” अथवा “बड़े-बड़े अद्भुत काम”; यूनानी में “चिन्ह”।
    reason: lexical_alternative
  - marker: b
    text: या “लोगों की दृष्टि के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιεῖ σημεῖα μεγάλα
  choice: बड़े-बड़े चिन्ह दिखाता है
  rationale: ‘चिन्ह’ σημεῖα के संकेतात्मक और संभावित रूप से भरमाने वाले आशय को बनाए रखता है। हिंदी में चिन्ह ‘दिखाना’ सार्वजनिक रूप से अद्भुत कार्य करने का स्वाभाविक प्रयोग है; ‘बड़े-बड़े’ महान और प्रभावशाली कार्यों का भाव देता है।
- source_word: ἵνα καὶ πῦρ ποιῇ ... καταβαίνειν
  choice: यहाँ तक कि ... आग भी उतारता है
  rationale: यह स्वाभाविक हिंदी में καὶ की उत्कर्षसूचक शक्ति तथा आग को नीचे आने देने/कराने का कारक भाव व्यक्त करता है, बिना उसकी कार्यविधि तय किए।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: आकाश से
  rationale: यहाँ आग के दृश्य रूप से ऊपर से पृथ्वी पर उतरने की दिशा प्रमुख है। ‘आकाश’ οὐρανός का स्वाभाविक हिंदी अर्थ है और प्रसंग में किसी निश्चित दिव्य स्रोत का अनावश्यक निष्कर्ष नहीं जोड़ता।
- source_word: εἰς τὴν γῆν
  choice: पृथ्वी पर
  rationale: यह गति के लक्ष्य को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐνώπιον τῶν ἀνθρώπων
  choice: लोगों के सामने
  rationale: यह सार्वजनिक दृश्यता का भाव बनाए रखता है और ἀνθρώπων को लिंग-समावेशी सामान्य अर्थ में व्यक्त करता है।
theological_decisions:
- issue: चिन्हों की प्रकृति
  choice: पद को प्रत्यक्ष रूप से दिखाए गए बड़े चिन्हों का वर्णन करने दिया गया है, उनकी अलौकिकता या यांत्रिक विधि को निश्चित किए बिना।
  alternative: ‘बड़े चमत्कार’ कहकर उनकी अलौकिक प्रकृति पर अधिक बल देना, अथवा उन्हें केवल छल या भ्रम बताना।
  rationale: मूल पाठ चिन्हों के प्रदर्शन और लोगों के सामने आग उतरने की घटना बताता है, पर इस पद में उनकी वास्तविक कार्यविधि का निर्णय नहीं करता।
- issue: οὐρανός का अर्थ
  choice: ‘आकाश’
  alternative: ‘स्वर्ग’
  rationale: दोनों अर्थ संभव हैं। यहाँ पृथ्वी की ओर आग उतरने का दृश्य-स्थानिक वर्णन ‘आकाश’ से सहज बनता है और पशु के चिन्ह को सचमुच स्वर्गीय मान लेने से बचाता है; वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह’ पिछले संदर्भ के प्राणी के लिए है। ‘बड़े-बड़े’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘चिन्ह’ प्रकाशितवाक्य की संकेतात्मक शब्दावली को सुरक्षित रखता है।
