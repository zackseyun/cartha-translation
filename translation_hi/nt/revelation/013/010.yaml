source:
  edition: SBLGNT
  text: εἴ τις ⸂εἰς αἰχμαλωσίαν, εἰς αἰχμαλωσίαν⸃ ὑπάγει· εἴ τις ἐν μαχαίρῃ ⸀ἀποκτανθῆναι αὐτὸν ἐν μαχαίρῃ ἀποκτανθῆναι. ὧδέ ἐστιν ἡ ὑπομονὴ καὶ ἡ πίστις τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/013/010.yaml
  text: If anyone is for captivity[a], into captivity he goes; if anyone is to be killed with the sword, with the sword he must be killed[c][b]. Here is the endurance and the faith of the saints.
translation:
  language: hi
  text: यदि कोई कैद में जानेवाला है, तो वह कैद में जाएगा[a]; यदि कोई तलवार से मारा जानेवाला है, तो उसे तलवार से मारा जाना है[b]। इसी में पवित्र जनों का धीरज और विश्वास है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि कोई कैद में जाता है, तो वह कैद में जाता है।” इस पंक्ति को आदेश के बजाय ठहराई हुई नियति का कथन भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: 'कुछ हस्तलिपियों या पाठ-रूपों में यह वाक्यांश भिन्न है; उनमें यह अर्थ भी मिलता है: “यदि कोई तलवार से मारता है, तो उसे तलवार से मारा जाना है।” यहाँ दिए गए मूल पाठ को मुख्य पाठ में रखा गया है, पर यह पाठांतर अर्थ की दृष्टि से महत्त्वपूर्ण है।'
    reason: textual_variant
  - marker: c
    text: या, “पवित्र जनों की विश्वासयोग्यता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ τις
  choice: यदि कोई
  rationale: यह सामान्य और अनिश्चित शर्त को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς αἰχμαλωσίαν ... ὑπάγει
  choice: कैद में जाने के लिए ठहराया गया है ... कैद में जाएगा
  rationale: पहले पदबंध की संक्षिप्त, नियति-सूचक बनावट और दूसरे में ὑπάγει की गतिशीलता को स्पष्ट हिन्दी में रखते हुए मूल पुनरावृत्ति को यथासंभव बचाया गया है।
- source_word: αἰχμαλωσία
  choice: कैद
  rationale: यह पकड़े जाकर बंधन में डाले जाने का व्यापक अर्थ देता है और ‘कारावास’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἐν μαχαίρῃ
  choice: तलवार से
  rationale: करणवाचक अर्थ को सहज हिन्दी में व्यक्त करता है और न्याय-संबंधी बाइबलीय स्वर बनाए रखता है।
- source_word: ἀποκτανθῆναι
  choice: मारा जाना
  rationale: निष्क्रिय क्रिया का अर्थ स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में रखता है।
- source_word: αὐτὸν ... ἀποκτανθῆναι
  choice: उसे ... मारा जाना ही है
  rationale: मूल की असहज सर्वनामयुक्त रचना को सुबोध हिन्दी में बदलते हुए निष्क्रियता और अनिवार्यता को सुरक्षित रखता है।
- source_word: ὧδέ ἐστιν
  choice: इसी में ... है
  rationale: यह पहले वर्णित परिस्थिति की ओर संकेत करके ध्यान खींचता है और हिन्दी में स्वाभाविक है।
- source_word: ὑπομονή
  choice: धीरज
  rationale: दुःख और दबाव के बीच टिके रहने की दृढ़ता को संक्षेप में व्यक्त करता है।
- source_word: πίστις
  choice: विश्वास
  rationale: मूल शब्द का सामान्य धार्मिक अर्थ रखता है; संदर्भगत ‘विश्वासयोग्यता’ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों का
  rationale: यह परमेश्वर के लिए अलग किए गए लोगों का सामूहिक अर्थ देता है और आधुनिक हिन्दी में ‘संतों’ से कम संप्रदाय-विशिष्ट सुनाई देता है।
theological_decisions:
- issue: 'पहली दो धाराओं का अर्थ: ठहराई हुई नियति या आदेश'
  choice: न्यायिक/ठहराई हुई नियति का वर्णन
  alternative: हिंसा का प्रतिरोध न करने का आदेश; अथवा कैद करने और मारने वालों पर प्रतिशोध का सिद्धांत
  rationale: प्रस्तुत यूनानी पाठ संक्षिप्त और कठिन है, पर इस रूप में वह सबसे स्वाभाविक ढंग से ठहराए हुए परिणाम का कथन प्रतीत होता है। अनिश्चितता को पादटिप्पणी में रखा गया है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: मुख्य पाठ में व्यापक और पारंपरिक अर्थ रखा गया है, जबकि सताव में स्थिर बने रहने के संदर्भ से संभव नैतिक गुण को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की कहावत-जैसी गंभीरता, पुनरावृत्ति और नियति-संबंधी तनाव सुरक्षित रखे गए हैं; किसी विशिष्ट अहिंसावादी या प्रतिशोधवादी व्याख्या को मुख्य पाठ में नहीं थोपा गया।
