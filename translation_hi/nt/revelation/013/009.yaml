  yaml_path: translation/nt/revelation/013/009.yaml
  text: If anyone has an ear[a], let him hear.
translation:
  language: hi
  text: यदि किसी के कान हों, तो वह सुन ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴ τις
  choice: यदि किसी के
  rationale: शर्तसूचक Εἴ और अनिश्चित τις को स्वाभाविक हिन्दी में अलग-अलग कठोरता से रखने के बजाय संयुक्त वाक्यांश में व्यक्त किया गया है; इससे मूल का खुला, सार्वत्रिक आह्वान बना रहता है।
- source_word: ἔχει οὖς
  choice: कान हों
  rationale: यूनानी में ‘कान’ एकवचन है, पर हिन्दी में इस लोकोक्तिपरक अभिव्यक्ति के लिए बहुवचन अधिक स्वाभाविक है और सुनकर ध्यान देने की क्षमता का वही अर्थ देता है।
- source_word: ἀκουσάτω
  choice: वह सुन ले
  rationale: तीसरे पुरुष के आदेश को स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है। ‘सुन’ मूल क्रिया और बाइबलीय आह्वान को बनाए रखता है, जबकि ‘समझ ले’ जैसी व्याख्यात्मक वृद्धि से बचता है।
theological_decisions:
- issue: सुनने के आह्वान का मुहावरेदार आशय
  choice: वह सुन ले
  alternative: वह ध्यान दे / वह समझ ले
  rationale: मूल पाठ सुनने की क्रिया के माध्यम से ग्रहणशील ध्यान और प्रत्युत्तर का आह्वान करता है। अनुवाद में ‘सुन’ रखने से साहित्यिक और धर्मवैचारिक प्रतिध्वनि सुरक्षित रहती है तथा आशय को केवल बौद्धिक समझ तक सीमित नहीं किया जाता।
- issue: यूनानी एकवचन और हिन्दी में सामान्य संदर्भ
  choice: किसी के कान हों, तो वह
  alternative: जिसके कान हों, वह
  rationale: ‘यदि’ मूल की स्पष्ट शर्तसूचक रचना को बनाए रखता है। हिन्दी का ‘वह’ लिंग-निरपेक्ष सामान्य सर्वनाम है और यूनानी के एकवचन, सामान्य संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: संक्षिप्त, गंभीर और सूत्रात्मक आधुनिक मानक हिन्दी। ‘यदि’ मूल की शर्तसूचक बनावट को, और ‘सुन ले’ भविष्यद्वक्ताई/प्रकाशितवाक्यीय आह्वान की संक्षिप्त शक्ति को बनाए रखता है।
