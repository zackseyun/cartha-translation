source:
  edition: SBLGNT
  text: καὶ ἔλαβον τὸ ⸀βιβλαρίδιον ἐκ τῆς χειρὸς τοῦ ἀγγέλου καὶ κατέφαγον αὐτό, καὶ ἦν ἐν τῷ στόματί μου ὡς μέλι γλυκύ· καὶ ὅτε ἔφαγον αὐτό, ἐπικράνθη ἡ κοιλία μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/010.yaml
  text: And I took the little scroll from the hand of the angel and ate it, and in my mouth it was sweet like honey; and when I had eaten it, my stomach was made bitter.
translation:
  language: hi
  text: और मैंने उस स्वर्गदूत के हाथ से वह छोटी पुस्तक[a] लेकर खा ली। वह मेरे मुँह में शहद जैसी मीठी लगी; पर जब मैं उसे खा चुका था, तो मेरा पेट कड़वा हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छोटा पुस्तक-रोल।” यूनानी शब्द लघुतासूचक है और किसी छोटे लिखित दस्तावेज़ को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरा पेट कड़वा कर दिया गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: βιβλαρίδιον
  choice: छोटी पुस्तक
  rationale: यह यूनानी शब्द लघुतासूचक है और किसी छोटे लिखित दस्तावेज़ को दर्शाता है। हिंदी में ‘छोटी पुस्तक’ स्वाभाविक और स्पष्ट है; प्राचीन भौतिक रूप पर बल देने वाला ‘छोटा पुस्तक-रोल’ कम सहज होता।
- source_word: ἐκ τῆς χειρὸς τοῦ ἀγγέλου
  choice: उस स्वर्गदूत के हाथ से
  rationale: यह मूल पदबंध के सजीव चित्र को सीधे और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: κατέφαγον
  choice: खा ली
  rationale: यूनानी क्रिया में कभी-कभी तीव्रता हो सकती है, पर यहाँ सामान्य ‘खा ली’ प्रतीकात्मक कार्य को बिना अतिशयोक्ति के व्यक्त करती है।
- source_word: ὡς μέλι γλυκύ
  choice: शहद जैसी मीठी
  rationale: यह तुलना को स्पष्ट, बोलचाल से ऊपर किंतु वर्तमान हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτε ἔφαγον αὐτό
  choice: जब मैं उसे खा चुका
  rationale: यह कथानक का क्रम स्पष्ट करता है—खाने के बाद पेट कड़वा हुआ—बिना यूनानी काल-रूप में अतिरिक्त अर्थ जोड़ने के।
- source_word: ἐπικράνθη
  choice: कड़वा हो गया
  rationale: मध्य/कर्मवाच्य रूप यहाँ अवस्था-परिवर्तन को व्यक्त करता है; ‘कड़वा हो गया’ हिंदी में ‘कड़वा कर दिया गया’ से अधिक स्वाभाविक है और किसी अनिर्दिष्ट कर्ता को अनावश्यक रूप से नहीं जोड़ता।
- source_word: κοιλία
  choice: पेट
  rationale: ‘पेट’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक शारीरिक अर्थ देता है; ‘उदर’ अधिक साहित्यिक है।
theological_decisions:
- issue: छोटी पुस्तक को खाने का प्रतीकात्मक कार्य
  choice: मिठास और कड़वाहट के चित्र को बिना व्याख्यात्मक विस्तार के यथावत प्रस्तुत किया गया।
  alternative: मिठास को आनंद और कड़वाहट को न्याय या दुःख के रूप में अनुवाद में ही स्पष्ट करना।
  rationale: यह पद स्वयं प्रतीक के सभी धार्मिक निहितार्थों की व्याख्या नहीं करता; इसलिए अनुवाद उसकी वास्तविक प्रतीकात्मक अस्पष्टता और तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘छोटी पुस्तक’ सहजता के लिए मुख्य पाठ में है, जबकि प्राचीन पुस्तक-रोल की सम्भावना पादटिप्पणी में सुरक्षित है।
