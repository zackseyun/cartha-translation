id: REV.10.6
reference: Revelation 10:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀ὤμοσεν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, ὃς ἔκτισεν τὸν οὐρανὸν καὶ τὰ ἐν αὐτῷ καὶ τὴν γῆν καὶ τὰ ἐν αὐτῇ καὶ τὴν θάλασσαν καὶ τὰ ἐν αὐτῇ, ὅτι χρόνος οὐκέτι ἔσται·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/006.yaml
  text: and swore by the one who lives forever and ever[a], who created heaven and the things in it, and the earth and the things on it, and the sea and the things in it, that there will no longer be any delay.
translation:
  language: hi
  text: और उसने उसकी शपथ खाई जो युगानुयुग जीवित रहता है, जिसने आकाश और उसमें की वस्तुओं को, पृथ्वी और उसमें की वस्तुओं को, और समुद्र और उसमें की वस्तुओं को सृजा है—कि अब कोई देर नहीं होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “अब समय नहीं रहेगा।” यहाँ संदर्भ में χρόνος का अर्थ सम्भवतः “देर” या “प्रतीक्षा की अवधि” है—अर्थात परमेश्वर की निर्णायक कार्रवाई से पहले की प्रतीक्षा समाप्त हो गई है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὤμοσεν
  choice: शपथ खाई
  rationale: ὀμνύω के भूतकालिक रूप का स्वाभाविक और गंभीर हिन्दी अनुवाद; यह शपथ लेने की क्रिया को स्पष्ट करता है।
- source_word: τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: उसकी ... जो युगानुयुग जीवित रहता है
  rationale: सम्प्रदान कारक शपथ के साक्षी/आधार को व्यक्त करता है। ‘युगानुयुग’ अनन्त अवधि वाले यूनानी मुहावरे का संक्षिप्त, गरिमापूर्ण हिन्दी रूप है।
- source_word: ἔκτισεν
  choice: सृजा है
  rationale: κτίζω का सृष्टि-संदर्भ में अर्थ ‘सृजन करना’ है; ‘सृजा’ सृष्टिकर्ता संबंधी भाषा को बनाए रखता है।
- source_word: τὸν οὐρανὸν
  choice: आकाश
  rationale: यहाँ οὐρανός सृष्टि की व्यापक त्रयी—आकाश, पृथ्वी और समुद्र—का पहला क्षेत्र है। ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक है और केवल परमधाम का अर्थ आरोपित नहीं करता।
- source_word: τὰ ἐν αὐτῷ / τὰ ἐν αὐτῇ
  choice: उसमें/उस पर की वस्तुओं
  rationale: मूल की तीन बार दोहराई गई संरचना को बनाए रखा गया है। पृथ्वी के लिए ‘उस पर’ हिन्दी में अधिक स्वाभाविक है, जबकि आकाश और समुद्र के लिए ‘उसमें’ उपयुक्त है।
- source_word: γῆν
  choice: पृथ्वी
  rationale: आकाश-पृथ्वी-समुद्र की सार्वभौमिक सृष्टि-त्रयी में γῆ का अर्थ स्थानीय ‘भूमि’ नहीं, पूरी पृथ्वी है।
- source_word: θάλασσαν
  choice: समुद्र
  rationale: एकवचन θάλασσα का सीधा और संदर्भानुकूल हिन्दी समतुल्य।
- source_word: ὅτι
  choice: कि
  rationale: शपथ लेने की क्रिया के बाद ὅτι शपथ की विषय-वस्तु प्रस्तुत करता है।
- source_word: χρόνος οὐκέτι ἔσται
  choice: अब और देर नहीं होगी
  rationale: अगले पद में परमेश्वर की योजना की पूर्ति के संदर्भ के कारण χρόνος यहाँ बीतते समय के अंत से अधिक विलम्ब या प्रतीक्षा-अवधि को सूचित करता है। पाठ की शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: शपथ में χρόνος का अर्थ
  choice: ‘अब और देर नहीं होगी’—परमेश्वर की निर्णायक कार्रवाई से पहले की प्रतीक्षा अब समाप्त होगी
  alternative: ‘अब समय नहीं रहेगा’
  rationale: निकट संदर्भ, विशेषकर अगले पद में परमेश्वर के रहस्य की पूर्ति, ‘विलम्ब’ के अर्थ का समर्थन करता है। फिर भी यूनानी शब्द का सामान्य अर्थ ‘समय’ है, इसलिए अधिक शाब्दिक पाठ पादटिप्पणी में दिया गया है ताकि वास्तविक अर्थगत तनाव बना रहे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। मूल की आकाश-पृथ्वी-समुद्र वाली त्रिस्तरीय पुनरावृत्ति सुरक्षित रखी गई है। ‘युगानुयुग’ बाइबलीय गरिमा रखते हुए सामान्य पाठक के लिए बोधगम्य है; ‘अब और देर नहीं होगी’ संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
