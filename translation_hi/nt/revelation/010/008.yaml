id: REV.10.8
reference: Revelation 10:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἡ φωνὴ ἣν ἤκουσα ἐκ τοῦ οὐρανοῦ, πάλιν ⸀λαλοῦσαν μετ’ ἐμοῦ καὶ ⸀λέγουσαν· Ὕπαγε λάβε τὸ ⸀βιβλίον τὸ ἠνεῳγμένον ἐν τῇ χειρὶ τοῦ ἀγγέλου τοῦ ἑστῶτος ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/008.yaml
  text: And the voice that I heard from heaven spoke to me again and said[a], “Go[b], take the scroll that is opened in the hand of the angel who is standing on the sea and on the land.”
translation:
  language: hi
  text: और जो आवाज़ मैंने स्वर्ग से सुनी थी, वह फिर मुझसे बोली, “जाओ, उस खुले हुए पुस्तक-पत्र को ले लो[a] जो उस स्वर्गदूत के हाथ में है, जो समुद्र और धरती[b] पर खड़ा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छोटा पुस्तक-पत्र”; आसपास के पदों में लघुसूचक शब्द आया है, पर इस पद के यूनानी पाठ में सामान्य शब्द βιβλίον है।
    reason: alternative_reading
  - marker: b
    text: या, “पृथ्वी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: φωνὴ
  choice: आवाज़
  rationale: यहाँ स्वर्ग से बोलने वाली वाणी अभिप्रेत है; आधुनिक सामान्य हिन्दी में ‘आवाज़’ स्वाभाविक और स्पष्ट है।
- source_word: πάλιν
  choice: फिर
  rationale: यह स्वर्गीय आवाज़ द्वारा दोबारा संबोधित किए जाने को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: λαλοῦσαν μετ’ ἐμοῦ καὶ λέγουσαν
  choice: उसने फिर मुझसे कहा
  rationale: दो समानार्थी कृदंतों को हिन्दी की स्वाभाविक अभिव्यक्ति में समेटता है; ‘मुझसे’ μετά के संबंधपरक भाव को बनाए रखता है।
- source_word: Ὕπαγε λάβε
  choice: जाओ ... ले लो
  rationale: दोनों आज्ञार्थक क्रियाओं को सीधी, वर्तमान हिन्दी की आज्ञा के रूप में रखा गया है।
- source_word: βιβλίον
  choice: पुस्तक-पत्र
  rationale: दृश्य में codex नहीं बल्कि लिखित scroll अभिप्रेत है; ‘पुस्तक-पत्र’ इसे ‘पुस्तक’ से अलग रखते हुए लिखित लपेटे जाने वाले पत्र का भाव देता है। पद में लघुसूचक रूप नहीं है।
- source_word: ἠνεῳγμένον
  choice: खुले हुए
  rationale: पूर्ण निष्क्रिय कृदंत पूर्व में खोले जाने से बनी वर्तमान खुली अवस्था व्यक्त करता है।
- source_word: ἐν τῇ χειρὶ
  choice: हाथ में
  rationale: ἐν की स्थानवाचकता को सीधे सुरक्षित रखता है; ‘हाथ से’ जोड़ना स्रोत से अधिक स्पष्ट करना होता।
- source_word: ἀγγέλου
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य के दर्शनात्मक संदर्भ में यह स्वर्गीय दूत है।
- source_word: ἑστῶτος
  choice: खड़ा है
  rationale: कृदंत द्वारा व्यक्त स्थायी खड़ी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς
  choice: समुद्र और धरती पर
  rationale: दृश्य में समुद्र और उसके स्थलीय प्रतिरूप का स्थानिक विरोध है; ‘धरती’ आधुनिक हिन्दी में ‘भूमि’ और व्यापक ‘पृथ्वी’ दोनों की संभाव्यता को पर्याप्त रूप से खुला रखती है।
theological_decisions:
- issue: γῆ का प्रकाशनात्मक चित्र में अर्थ
  choice: धरती
  alternative: भूमि; पृथ्वी
  rationale: दूत की मुद्रा के तत्काल दृश्य में समुद्र के विपरीत ठोस धरातल अभिप्रेत है। ‘धरती’ स्वाभाविक है और अनावश्यक ब्रह्मांड-विषयक निष्कर्ष नहीं थोपती।
- issue: βιβλίον और आसपास के लघुसूचक रूप का संबंध
  choice: पुस्तक-पत्र
  alternative: छोटा पुस्तक-पत्र; पुस्तक
  rationale: इस पद में βιβλίον है, लघुसूचक βιβλαρίδιον नहीं। इसलिए मुख्य पाठ में ‘छोटा’ जोड़कर आसपास के पदों से सामंजस्य नहीं बैठाया गया; विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य-विन्यास को हिन्दी के अनुरूप रखा गया है और दर्शन की स्थानिक छवि तथा मूल की अर्थगत संभाव्यताएँ सुरक्षित रखी गई हैं।
