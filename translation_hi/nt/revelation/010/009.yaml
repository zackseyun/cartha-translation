source:
  edition: SBLGNT
  text: καὶ ⸀ἀπῆλθα πρὸς τὸν ἄγγελον λέγων αὐτῷ δοῦναί μοι τὸ ⸀βιβλαρίδιον. καὶ λέγει μοι· Λάβε καὶ κατάφαγε αὐτό, καὶ πικρανεῖ σου τὴν κοιλίαν, ἀλλ’ ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/009.yaml
  text: So I went to the angel[a], telling him to give me the little scroll. And he says to me, “Take and eat it, and it will make your stomach bitter[c][b], but in your mouth it will be sweet like honey.”
translation:
  language: hi
  text: तब मैं उस स्वर्गदूत के पास गया और उससे कहा कि वह मुझे वह छोटी पुस्तक[a] दे। वह मुझसे कहता है[b], “इसे लो और खा जाओ। यह तुम्हारे पेट[c] में कड़वाहट भर देगी, लेकिन तुम्हारे मुँह में यह शहद के समान मीठी होगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छोटा स्क्रॉल।’ यूनानी शब्द βιβλαρίδιον लघु रूप है और छोटी पुस्तक या छोटे स्क्रॉल को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसने मुझसे कहा।’ यूनानी में सजीवता के लिए ऐतिहासिक वर्तमान काल (‘कहता है’) आया है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उदर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθα πρὸς τὸν ἄγγελον
  choice: मैं उस स्वर्गदूत के पास गया
  rationale: ἀπῆλθα यहाँ यूहन्ना की स्वर्गदूत की ओर गति बताता है; ‘के पास गया’ आधुनिक हिन्दी में स्वाभाविक है और πρὸς को स्पष्ट रखता है।
- source_word: λέγων αὐτῷ δοῦναί μοι
  choice: उससे कहा कि वह मुझे ... दे
  rationale: यह सहभागी कृदन्त और infinitive से व्यक्त कथन-विषय को स्वाभाविक हिन्दी में रखता है, बिना इसे अनावश्यक रूप से विनम्र निवेदन बना देने के।
- source_word: βιβλαρίδιον
  choice: छोटी पुस्तक
  rationale: लघु रूप किसी छोटी पुस्तक या छोटे लपेटे हुए पत्र को सूचित कर सकता है। हिन्दी में ‘छोटी पुस्तक’ सहज है; वैकल्पिक भौतिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: λέγει μοι
  choice: वह मुझसे कहता है
  rationale: ग्रीक का ऐतिहासिक वर्तमान कथा में सजीवता लाता है; हिन्दी वर्तमान काल उसे सुरक्षित रख सकता है।
- source_word: Λάβε καὶ κατάφαγε αὐτό
  choice: इसे लो और खा जाओ
  rationale: ‘लो’ आज्ञा को सीधा रखता है और ‘खा जाओ’ κατάφαγε की पूर्ण अथवा तीव्र क्रिया का स्वाभाविक हिन्दी रूप है।
- source_word: πικρανεῖ σου τὴν κοιλίαν
  choice: यह तुम्हारे पेट को कड़वा कर देगी
  rationale: πικραίνω कारणात्मक अर्थ देता है और खाने के प्रसंग में κοιλία का ठोस शारीरिक अर्थ ‘पेट’ स्पष्ट है।
- source_word: ἐν τῷ στόματί σου ἔσται γλυκὺ ὡς μέλι
  choice: तुम्हारे मुँह में यह शहद जैसी मीठी लगेगी
  rationale: यह स्थान और उपमा दोनों को बनाए रखते हुए आधुनिक हिन्दी में स्वाद के अनुभव को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: छोटी पुस्तक को खाने की प्रतीकात्मक क्रिया
  choice: ‘इसे लो और खा जाओ’ के ठोस प्रतीकात्मक आदेश को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे परमेश्वर का संदेश आत्मसात करने के अर्थ में स्पष्ट करके अनुवाद करना।
  rationale: मूल पद प्रतीक की व्याख्या नहीं करता; अनुवाद में उसे समझा देने से पाठ की प्रतीकात्मक और धर्मवैचारिक खुलावट घट जाएगी।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्वर्गदूत’, ‘छोटी पुस्तक’, ‘खा जाओ’ और ‘पेट’ सामान्य पाठक के लिए स्पष्ट हैं। ग्रीक ऐतिहासिक वर्तमान को जानबूझकर सुरक्षित रखा गया है; सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
