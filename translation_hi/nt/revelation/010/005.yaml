source:
  edition: SBLGNT
  text: καὶ ὁ ἄγγελος, ὃν εἶδον ἑστῶτα ἐπὶ τῆς θαλάσσης καὶ ἐπὶ τῆς γῆς, ἦρεν τὴν χεῖρα αὐτοῦ τὴν δεξιὰν εἰς τὸν οὐρανόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/005.yaml
  text: And the angel whom I saw standing on the sea and on the land raised his right hand to heaven[b][a],
translation:
  language: hi
  text: तब जिस स्वर्गदूत को मैंने समुद्र और धरती पर खड़े देखा था, उसने अपना दाहिना हाथ स्वर्ग की ओर उठाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य के इस संदर्भ में यह एक स्वर्गीय प्राणी है; इसलिए सामान्य ‘दूत’ की अपेक्षा ‘स्वर्गदूत’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: ἑστῶτα
  choice: खड़े
  rationale: पूर्णकालिक कृदंत यहाँ वर्तमान अवस्था या मुद्रा बताता है; हिंदी में ‘खड़े’ इसका सहज रूप है।
- source_word: ἐπὶ τῆς θαλάσσης
  choice: समुद्र पर
  rationale: ἐπί के साथ संबंधकारक का ‘पर’ अर्थ दृश्य की असाधारण और सजीव छवि को बनाए रखता है।
- source_word: ἐπὶ τῆς γῆς
  choice: धरती पर
  rationale: γῆ यहाँ समुद्र के विपरीत ठोस भूभाग को दर्शाता है। ‘धरती’ आधुनिक हिंदी में स्वाभाविक है और इस संदर्भ में ‘भूमि’ तथा व्यापक ‘पृथ्वी’—दोनों अर्थ-संभावनाओं को पर्याप्त रूप से खुला रखता है।
- source_word: ἦρεν
  choice: उठाया
  rationale: αἴρω का सीधा अर्थ ‘उठाना’ है और शपथ की मुद्रा के संदर्भ में यही स्वाभाविक हिंदी प्रयोग है।
- source_word: τὴν χεῖρα αὐτοῦ τὴν δεξιὰν
  choice: अपना दाहिना हाथ
  rationale: यह यूनानी पदबंध हाथ को स्पष्ट रूप से दाहिना बताता है; ‘अपना’ हिंदी में कर्ता से संबंध को सहज ढंग से व्यक्त करता है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: εἰς यहाँ दिशा सूचित करता है। ‘स्वर्ग की ओर’ हिंदी में स्वाभाविक है और अगले पद की शपथ-संबंधी धार्मिक गंभीरता को बनाए रखता है।
theological_decisions:
- issue: समुद्र के विपरीत γῆ का अर्थ
  choice: धरती
  alternative: भूमि / पृथ्वी
  rationale: दृश्य में समुद्र और ठोस भूभाग का स्थानिक विरोध है। ‘धरती’ इस विरोध को स्पष्ट रखते हुए शब्द के व्यापक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: οὐρανός का अनुवाद
  choice: स्वर्ग
  alternative: आकाश
  rationale: अगले पद में सनातन सृष्टिकर्ता की शपथ के कारण यहाँ केवल भौतिक आकाश का संकेत नहीं है; ‘स्वर्ग’ मूल की धार्मिक गंभीरता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी καί को कथानक की स्वाभाविक हिंदी निरंतरता के लिए ‘तब’ कहा गया है। संबंधवाचक खंड में हिंदी की स्वाभाविक शब्द-व्यवस्था अपनाई गई है।
