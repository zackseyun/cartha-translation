id: REV.10.11
reference: Revelation 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ λέγουσίν μοι· Δεῖ σε πάλιν προφητεῦσαι ἐπὶ λαοῖς ⸀καὶ ἔθνεσιν καὶ γλώσσαις καὶ βασιλεῦσιν πολλοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/011.yaml
  text: And they say to me, “You must prophesy again about many peoples and nations and languages and kings.”
translation:
  language: hi
  text: और वे मुझसे कहते हैं, “तुम्हें फिर से जनसमूहों, राष्ट्रों, भाषाओं और बहुत-से राजाओं के विषय में भविष्यवाणी करनी होगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγουσίν
  choice: वे ... कहते हैं
  rationale: यूनानी क्रिया बहुवचन और वर्तमान काल में है; कर्ता को अनिश्चित रखते हुए दोनों विशेषताएँ सुरक्षित रखी गई हैं।
- source_word: Δεῖ σε
  choice: तुम्हें ... करनी होगी
  rationale: यह आवश्यक दायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάλιν προφητεῦσαι
  choice: फिर से ... भविष्यवाणी करनी
  rationale: πάλιν की पुनरावृत्ति और προφητεύω के भविष्यद्वाणी-संबंधी अर्थ को सीधे बनाए रखता है।
- source_word: ἐπὶ
  choice: के विषय में
  rationale: यहाँ ἐπί भविष्यवाणी के विषय या दायरे को सूचित कर सकता है; यह अनुवाद अनावश्यक रूप से विरोधात्मक अर्थ नहीं जोड़ता।
- source_word: λαοῖς
  choice: जनसमूहों
  rationale: बहुवचन λαοί को ἔθνη से अलग रखते हुए विभिन्न peoples का अर्थ देता है।
- source_word: ἔθνεσιν
  choice: राष्ट्रों
  rationale: सूची में राजनीतिक-सामुदायिक समूहों का स्वाभाविक हिन्दी रूप, जो जनसमूहों से पर्याप्त रूप से भिन्न है।
- source_word: γλώσσαις
  choice: भाषाओं
  rationale: प्रकाशितवाक्य की इस सूची में शब्द भाषाई समुदायों को उनकी भाषाओं द्वारा दर्शाता है; हिन्दी में शाब्दिक और स्वाभाविक रूप।
- source_word: βασιλεῦσιν πολλοῖς
  choice: बहुत-से ... राजाओं
  rationale: πολλοῖς सूची के अनेक सदस्यों के व्यापक दायरे से जुड़ता है; हिन्दी में आरंभ में रखकर पूरी समन्वित सूची पर इसका स्वाभाविक प्रभाव रखा गया है।
theological_decisions:
- issue: ἐπί का संबंध—‘के विषय में’ या ‘के विरुद्ध’
  choice: के विषय में
  alternative: के विरुद्ध
  rationale: संदर्भ यूहन्ना की नवीकृत भविष्यद्वाणी की सेवकाई और उसके व्यापक विषय-दायरे पर बल देता है। यूनानी पदबंध विरोधात्मक अर्थ की संभावना को पूर्णतः असंभव नहीं बनाता, पर यहाँ उसे स्पष्ट रूप से आरोपित करना आवश्यक नहीं है।
- issue: बहुवचन वक्ताओं की पहचान
  choice: वे
  alternative: उसने
  rationale: पाठ में λέγουσίν स्पष्ट रूप से बहुवचन है, इसलिए किसी एक स्वर्गदूत या स्वर के रूप में पहचान को चुपचाप निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में वर्तमानकालीन कथन और अनिश्चित बहुवचन कर्ता सुरक्षित रखे गए हैं। ‘जनसमूहों’ और ‘राष्ट्रों’ से λαοί तथा ἔθνη का भेद यथासंभव स्पष्ट रखा गया है; शैली सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है।
