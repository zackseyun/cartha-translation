id: REV.10.3
reference: Revelation 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔκραξεν φωνῇ μεγάλῃ ὥσπερ λέων μυκᾶται. καὶ ὅτε ἔκραξεν, ἐλάλησαν αἱ ἑπτὰ βρονταὶ τὰς ἑαυτῶν φωνάς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/003.yaml
  text: And he cried out with a loud voice[a], just as a lion roars. And when he cried out, the seven thunders spoke with their own voices.
translation:
  language: hi
  text: और उसने ऊँची आवाज़ में पुकारा, जैसे सिंह दहाड़ता है। जब उसने पुकारा, तब सातों गर्जन अपनी-अपनी आवाज़ों में बोले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अभिव्यक्ति है, “सातों गर्जनों ने अपनी ही आवाज़ें बोलीं।” यूनानी में गर्जनों को बोलते हुए दिखाने वाला सजीव मानवीकरण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκραξεν
  choice: पुकारा
  rationale: क्रिया एक प्रबल और ऊँची पुकार को व्यक्त करती है। ‘पुकारा’ स्वाभाविक हिन्दी है और अनावश्यक रूप से दुःख या भय का भाव नहीं जोड़ती।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: यह दत्तिव पदबंध बोलने के ढंग को बताता है। संज्ञा ‘आवाज़’ को बनाए रखना यूनानी की ठोस अभिव्यक्ति के अनुरूप है।
- source_word: ὥσπερ λέων μυκᾶται
  choice: जैसे सिंह दहाड़ता है
  rationale: तुलना और सिंह की विशिष्ट ध्वनि दोनों को सहज, गरिमापूर्ण हिन्दी में सुरक्षित रखा गया है।
- source_word: ὅτε
  choice: जब ... तब
  rationale: कालसूचक सम्बन्ध को स्पष्ट रखता है, बिना यह कहे कि गर्जनों का बोलना पुकार समाप्त होने के बाद ही हुआ।
- source_word: αἱ ἑπτὰ βρονταὶ
  choice: सातों गर्जन
  rationale: निश्चित लेख और संख्या से दर्शाए गए परिचित दर्शनात्मक सन्दर्भ को ‘सातों’ व्यक्त करता है। ‘गर्जन’ मूल के व्यक्तिकृत रूप को बनाए रखता है।
- source_word: ἐλάλησαν ... τὰς ἑαυτῶν φωνάς
  choice: अपनी-अपनी आवाज़ों में बोले
  rationale: ‘बोले’ गर्जनों के मानवीकरण को सुरक्षित रखता है; ‘अपनी-अपनी’ आत्मवाचक बल और प्रत्येक गर्जन की अपनी आवाज़ होने का भाव व्यक्त करता है। ‘में’ हिन्दी में स्वाभाविकता देता है, यद्यपि यूनानी अधिक असामान्य और शाब्दिक है।
theological_decisions:
- issue: सात गर्जनों का मानवीकरण
  choice: ‘सातों गर्जन ... बोले’ के रूप में मानवीकरण बनाए रखा गया है।
  alternative: ‘सातों गर्जन गूँज उठे’
  rationale: यूनानी पाठ गर्जनों के लिए स्पष्ट रूप से बोलने की क्रिया और आवाज़ों का उल्लेख करता है। केवल ‘गूँज उठे’ कहना इस दर्शनात्मक मानवीकरण को सामान्य ध्वनि में बदल देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘सिंह’ और ‘गर्जन’ दर्शनात्मक तथा साहित्यिक स्वर बनाए रखते हैं; असामान्य यूनानी वाक्यांश की सजीवता मुख्य पाठ और पादटिप्पणी दोनों में सुरक्षित है।
