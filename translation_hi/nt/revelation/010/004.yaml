id: REV.10.4
reference: Revelation 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅτε ἐλάλησαν αἱ ἑπτὰ βρονταί, ἤμελλον γράφειν· καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ λέγουσαν· Σφράγισον ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί, καὶ μὴ αὐτὰ γράψῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/004.yaml
  text: And when the seven thunders spoke[a], I was about to write; and I heard a voice from heaven saying, “Seal up what the seven thunders spoke, and do not write them.”
translation:
  language: hi
  text: और जब वे सातों गर्जन बोल चुके, तब मैं लिखने ही वाला था; तब मैंने स्वर्ग से एक आवाज़ को यह कहते सुना, “जो बातें उन सातों गर्जनों ने कही थीं, उन पर मुहर लगा दे और उन्हें मत लिख।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλάλησαν
  choice: बोल चुके / कही हैं
  rationale: λαλέω का सामान्य अर्थ ‘बोलना’ या ‘कहना’ है। पहले खंड में पूर्ण हुई क्रिया को स्वाभाविक हिन्दी में ‘बोल चुके’ और कथन-विषय के साथ ‘कही हैं’ से व्यक्त किया गया है।
- source_word: αἱ ἑπτὰ βρονταί
  choice: वे सातों गर्जन
  rationale: βροντή का अर्थ गर्जन/मेघगर्जन है। ‘सातों गर्जन’ यूनानी के व्यक्तिकृत प्रलय-दर्शी बिंब को बनाए रखता है, क्योंकि वे बोलने वाले कर्ता हैं।
- source_word: ἤμελλον γράφειν
  choice: मैं लिखने ही वाला था
  rationale: μέλλω और infinitive निकट भविष्य या आसन्न क्रिया बताते हैं; ‘लिखने ही वाला था’ रुकावट से ठीक पहले की स्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φωνὴν ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से एक आवाज़
  rationale: यह स्वर्गीय स्रोत को बनाए रखता है और वक्ता की पहचान के विषय में मूल पाठ से अधिक नहीं कहता।
- source_word: Σφράγισον
  choice: मुहर लगा दे
  rationale: आज्ञार्थक रूप निर्णायक आदेश देता है। हिन्दी में ‘बातों पर मुहर लगा दे’ उन्हें गुप्त और अप्रकाशित रखने के आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἃ ἐλάλησαν αἱ ἑπτὰ βρονταί
  choice: जो बातें उन सातों गर्जनों ने कही हैं
  rationale: नपुंसकलिंग बहुवचन ἃ कथनों की विषय-वस्तु को सूचित करता है। ‘जो बातें’ इस बहुवचन को स्पष्ट रखते हुए हिन्दी में सहज है।
- source_word: μὴ αὐτὰ γράψῃς
  choice: उन्हें मत लिख
  rationale: αὐτά व्याकरणतः बहुवचन है और ‘जो बातें’ की ओर संकेत करता है। ‘उन्हें’ मूल संख्या को बनाए रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: स्वर्ग से आने वाली आवाज़ की पहचान
  choice: स्वर्ग से एक आवाज़
  alternative: स्वर्ग से परमेश्वर की आवाज़
  rationale: मूल पाठ केवल आवाज़ के स्वर्ग से आने की बात कहता है; वक्ता को परमेश्वर के रूप में स्पष्टतः पहचानता नहीं। इसलिए पहचान अनिर्दिष्ट रखी गई है।
- issue: सात गर्जनों का व्यक्तिकरण
  choice: सातों गर्जन बोलते और बातें कहते हैं
  alternative: सात बार गर्जना हुई
  rationale: यूनानी पाठ गर्जनों को बोलने वाले कर्ताओं के रूप में प्रस्तुत करता है। इसे सामान्य प्राकृतिक गर्जना बनाना प्रलय-दर्शी बिंब को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘वे सातों गर्जन’ प्रकाशितवाक्य की व्यक्तिकृत प्रतीकात्मक भाषा को सुरक्षित रखता है। ‘जो बातें...उन्हें’ यूनानी बहुवचन को हिन्दी में स्वाभाविक रूप से व्यक्त करता है, इसलिए पादटिप्पणी आवश्यक नहीं है।
