id: REV.10.7
reference: Revelation 10:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλ’ ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου, ὅταν μέλλῃ σαλπίζειν, καὶ ἐτελέσθη τὸ μυστήριον τοῦ θεοῦ, ὡς εὐηγγέλισεν τοὺς ⸂ἑαυτοῦ δούλους⸃ τοὺς προφήτας.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/010/007.yaml
  text: but in the days of the voice of the seventh angel[a], when he is about to sound the trumpet, then the mystery of God is fulfilled, just as he proclaimed the good news to his own servants, the prophets.
translation:
  language: hi
  text: परन्तु सातवें स्वर्गदूत की ध्वनि के दिनों में, जब वह तुरही फूँकने ही वाला होगा, तब परमेश्वर का रहस्य पूरा हो जाएगा[b], ठीक वैसे ही जैसे उसने अपने दासों[a]—भविष्यद्वक्ताओं—को शुभ समाचार सुनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सेवकों’। यूनानी शब्द का अर्थ ‘दास’ या ‘सेवक’ हो सकता है; यहाँ यह उनके परमेश्वर के अपने होने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से ‘पूरा हुआ’; आने वाली तुरही के संदर्भ में इसका भाव ‘पूरा हो जाएगा’ है।
    reason: grammatical_tense
lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: यह पिछले कथन के विपरीत अगली बात रखता है और प्रकाशन की गरिमापूर्ण शैली के अनुकूल है।
- source_word: ἐν ταῖς ἡμέραις τῆς φωνῆς τοῦ ἑβδόμου ἀγγέλου
  choice: सातवें स्वर्गदूत की ध्वनि के दिनों में
  rationale: ‘ध्वनि’ φωνή के सामान्य अर्थ को बनाए रखती है और उसे समय से पहले केवल तुरही की क्रिया में सीमित नहीं करती; ‘दिनों में’ मूल के बहुवचन और सर्वनाश-साहित्य की शैली को सुरक्षित रखता है।
- source_word: ὅταν μέλλῃ σαλπίζειν
  choice: जब वह तुरही फूँकने ही वाला होगा
  rationale: μέλλῃ + infinitive निकट भविष्य या आसन्न क्रिया बताता है; हिन्दी में ‘ही वाला होगा’ यह अर्थ स्वाभाविक रूप से व्यक्त करता है। σαλπίζειν में निहित तुरही को हिन्दी में स्पष्ट करना आवश्यक है।
- source_word: καὶ ἐτελέσθη
  choice: तब ... पूरा हो जाएगा
  rationale: τελέω यहाँ परमेश्वर की योजना को उसके लक्ष्य तक पहुँचाने का भाव देता है। भविष्याभिमुख काल-वाक्य के कारण हिन्दी में भविष्यकाल स्वाभाविक है, जबकि यूनानी के भूतकालीन रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὸ μυστήριον τοῦ θεοῦ
  choice: परमेश्वर का रहस्य
  rationale: ‘रहस्य’ बाइबलीय धर्मवैचारिक शब्द को बनाए रखता है और उसे किसी एक विस्तृत व्याख्या तक सीमित नहीं करता।
- source_word: ὡς εὐηγγέλισεν
  choice: ठीक वैसे ही जैसे उसने ... शुभ समाचार सुनाया था
  rationale: εὐαγγελίζω के शुभ समाचार घोषित करने के भाव को क्रियात्मक और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τοὺς ἑαυτοῦ δούλους
  choice: अपने दासों
  rationale: ‘दास’ δοῦλος में निहित स्वामित्व और पूर्ण समर्पण को सुरक्षित रखता है; ἑαυτοῦ का बल ‘अपने’ से व्यक्त होता है। आधुनिक पाठकों के लिए ‘सेवकों’ का विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοὺς προφήτας
  choice: भविष्यद्वक्ताओं
  rationale: यह ‘दासों’ की समानाधिकरण पहचान है; डैश से स्पष्ट किया गया है कि वही दास भविष्यद्वक्ता हैं।
theological_decisions:
- issue: परमेश्वर के भविष्यद्वक्ताओं के लिए δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ἑαυτοῦ परमेश्वर से उनके संबंध और उसके अधिकार पर बल देता है। ‘दास’ इस बंधन और समर्पण को बनाए रखता है, पर हिन्दी में संभव अधिक सौम्य अर्थ ‘सेवक’ पादटिप्पणी में सुरक्षित है।
- issue: ἐτελέσθη का काल और अर्थ
  choice: पूरा हो जाएगा
  alternative: पूरा हुआ
  rationale: यूनानी में क्रिया aorist passive है, पर वह सातवें स्वर्गदूत की आने वाली तुरही से जुड़े काल-वाक्य में आती है। हिन्दी भविष्यकाल संदर्भगत अर्थ स्पष्ट करता है; शाब्दिक कालरूप को पादटिप्पणी में रखकर भविष्यवाणी की निश्चितता और व्याकरणिक तनाव दोनों सुरक्षित किए गए हैं।
- issue: परमेश्वर के रहस्य की प्रकृति
  choice: रहस्य
  alternative: गुप्त योजना
  rationale: ‘रहस्य’ मूल धर्मवैचारिक पद को बनाए रखता है और पाठ से आगे बढ़कर किसी विशिष्ट अंत-समय प्रणाली को इसमें नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सर्वनाश-साहित्य के अनुरूप रखी गई है। ‘ध्वनि के दिनों में’ जानबूझकर कुछ औपचारिक है, क्योंकि यह मूल की विशिष्ट अभिव्यक्ति और सातवीं तुरही की अवधि—दोनों को खुला रखता है।
