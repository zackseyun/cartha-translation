  yaml_path: translation/nt/revelation/010/001.yaml
  text: And I saw another mighty angel coming down from heaven[a], clothed with a cloud, with the rainbow over his head, and his face was like the sun[b], and his feet like pillars of fire.
translation:
  language: hi
  text: फिर मैंने एक और शक्तिशाली स्वर्गदूत को स्वर्ग से उतरते देखा। वह बादल ओढ़े हुए था, उसके सिर के ऊपर इंद्रधनुष[a] था, उसका मुख सूर्य के समान था और उसके पैर आग के खंभों के समान थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभामंडल।” यूनानी शब्द का सामान्य अर्थ “इंद्रधनुष” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον ἰσχυρὸν
  choice: एक और शक्तिशाली स्वर्गदूत
  rationale: दर्शन और स्वर्ग से उतरने के संदर्भ में ἄγγελος के लिए ‘स्वर्गदूत’ स्वाभाविक है; ἰσχυρός असाधारण सामर्थ्य बताता है, जिसे सहज आधुनिक हिन्दी में ‘शक्तिशाली’ व्यक्त करता है।
- source_word: καταβαίνοντα ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से उतरते
  rationale: यह अभिव्यक्ति स्वर्ग से नीचे की ओर होने वाली सजीव गति को सीधे और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: περιβεβλημένον νεφέλην
  choice: बादल ओढ़े हुए
  rationale: περιβάλλω यहाँ वस्त्र धारण करने अथवा किसी वस्तु से घिरे होने का चित्र देता है। ‘बादल ओढ़े हुए’ उस रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡ ἶρις
  choice: इंद्रधनुष
  rationale: ἶρις का सामान्य अर्थ ‘इंद्रधनुष’ है और प्रकाशितवाक्य 4:3 की दृश्यावली भी इसी अर्थ का समर्थन करती है; संभावित ‘प्रभामंडल’ अर्थ को पादटिप्पणी में रखा गया है।
- source_word: ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: उसके सिर के ऊपर
  rationale: ἐπί के साथ कर्मकारक यहाँ सिर के ऊपर स्थित होने का चित्र देता है।
- source_word: τὸ πρόσωπον αὐτοῦ ὡς ὁ ἥλιος
  choice: उसका मुख सूर्य के समान था
  rationale: ‘मुख’ गरिमापूर्ण किंतु सामान्य हिन्दी है और ὡς की स्पष्ट उपमा को सुरक्षित रखता है।
- source_word: οἱ πόδες αὐτοῦ ὡς στῦλοι πυρός
  choice: उसके पैर आग के खंभों के समान थे
  rationale: πούς के लिए ‘पैर’ सहज आधुनिक हिन्दी है; ‘आग के खंभे’ στῦλοι πυρός की जननात्मक और दृश्यात्मक संरचना को बनाए रखता है।
theological_decisions:
- issue: शक्तिशाली स्वर्गदूत की पहचान
  choice: उसे केवल ‘एक और शक्तिशाली स्वर्गदूत’ कहा गया है।
  alternative: उसे सृजित स्वर्गदूत अथवा मसीह के प्रकट रूप के रूप में स्पष्टतः पहचानना।
  rationale: यूनानी पाठ उस आकृति को ἄλλον ἄγγελον ἰσχυρόν ही कहता है। उसकी पहचान को लेकर मतभेद है, इसलिए अनुवाद उस प्रश्न का निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘फिर मैंने’ Καὶ εἶδον को कथानक की अगली दृष्टि के रूप में स्वाभाविक हिन्दी देता है। छोटे वाक्यों और स्पष्ट उपमाओं से मूल की प्रभावशाली अपोकैलिप्टिक छवि सुरक्षित रहती है।
