lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: पूर्ववर्ती कथा से इस वाक्य को जोड़ने वाला सामान्य संयोजक।
- source_word: ἐστάθη
  choice: वह खड़ा हो गया
  rationale: ἵστημι का अरिस्ट, रूपतः कर्मवाच्य किंतु यहाँ अकर्मक अर्थ में प्रयुक्त है। तृतीय पुरुष एकवचन पाठ और निकट संदर्भ के अजगर को ध्यान में रखते हुए स्पष्ट सर्वनाम सहित यह स्वाभाविक हिन्दी रूप है।
- source_word: ἐπὶ
  choice: पर
  rationale: यहाँ कर्मकारक के साथ खड़े होने के परिणामी स्थान को व्यक्त करता है; हिन्दी में ‘पर’ सहज और सटीक है।
- source_word: τὴν ἄμμον
  choice: रेत
  rationale: ἄμμος का सीधा अर्थ ‘रेत’ है; ‘किनारा’ कहने से मूल की भौतिक छवि बदल जाती।
- source_word: τῆς θαλάσσης
  choice: समुद्र की
  rationale: सम्बन्धकारक पद ‘रेत’ को विशेषित करता है; ‘समुद्र की रेत’ मूल संरचना और दृश्यात्मकता दोनों को बनाए रखता है।
theological_decisions:
- issue: कर्ता की पहचान और क्रिया का पाठांतर
  choice: 'मुख्य पाठ में तृतीय पुरुष: ‘वह ... खड़ा हो गया,’ जो मुद्रित SBLGNT के ἐστάθη का अनुसरण करता है और संदर्भ में सम्भवतः अजगर की ओर संकेत करता है।'
  alternative: 'प्रथम पुरुष पाठ: ‘मैं समुद्र की रेत पर खड़ा हो गया।’'
  rationale: कर्ता को मुख्य पाठ में ‘अजगर’ कहकर स्पष्ट नहीं किया गया, ताकि यूनानी के सर्वनामरहित रूप से आगे न बढ़ें। महत्वपूर्ण प्रथम पुरुष पाठांतर को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज कथात्मक शैली। ‘समुद्र की रेत’ मूल बिंब को सुरक्षित रखता है; ‘खड़ा हो गया’ अरिस्ट की घटनात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
