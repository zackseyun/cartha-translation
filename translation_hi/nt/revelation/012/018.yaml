  text: और वह समुद्र की रेत पर खड़ा हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “और मैं समुद्र की रेत पर खड़ा हो गया।”
