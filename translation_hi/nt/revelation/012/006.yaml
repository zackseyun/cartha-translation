reference: Revelation 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἔφυγεν εἰς τὴν ἔρημον, ὅπου ἔχει ἐκεῖ τόπον ἡτοιμασμένον ⸀ἀπὸ τοῦ θεοῦ, ἵνα ἐκεῖ ⸀τρέφωσιν αὐτὴν ἡμέρας χιλίας διακοσίας ἑξήκοντα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/006.yaml
  text: And the woman fled into the wilderness[a], where she has there a place prepared by God, so that there they might nourish her for one thousand two hundred sixty days.
translation:
  language: hi
  text: और वह स्त्री निर्जन प्रदेश में भाग गई, जहाँ परमेश्वर ने उसके लिए एक स्थान तैयार किया हुआ है, ताकि वहाँ वे एक हज़ार दो सौ साठ दिनों तक उसका पालन-पोषण करें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि एक हज़ार दो सौ साठ दिनों तक वहाँ उसका पालन-पोषण किया जाए।” यूनानी में तृतीय पुरुष बहुवचन की क्रिया का कर्ता नहीं बताया गया है; शाब्दिक अर्थ है, “ताकि वहाँ वे उसका पालन-पोषण करें।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἔφυγεν
  choice: भाग गई
  rationale: अओरिस्ट क्रिया तत्काल पलायन को व्यक्त करती है; ‘भाग गई’ सहज और सजीव हिन्दी है।
- source_word: ἔρημον
  choice: निर्जन प्रदेश
  rationale: यह शब्द उजाड़ या एकांत भूभाग को सूचित कर सकता है; ‘निर्जन प्रदेश’ रेतीले मरुस्थल का अनावश्यक विशेषीकरण नहीं करता।
- source_word: τόπον
  choice: एक स्थान
  rationale: τόπος का सामान्य और स्वाभाविक अर्थ ‘स्थान’ है; अनिश्चितता बनाए रखने के लिए ‘एक’ रखा गया है।
- source_word: ἡτοιμασμένον ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर की ओर से तैयार किया हुआ
  rationale: पूर्ण निष्क्रिय कृदन्त पहले से की गई तैयारी दर्शाता है और ἀπό यहाँ कर्ता/स्रोत को सूचित करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अपेक्षित परिणाम का भाव स्वाभाविक आधुनिक हिन्दी में सुरक्षित रहता है।
- source_word: τρέφωσιν αὐτὴν
  choice: वे उसका पालन-पोषण करें
  rationale: मूल में अनिर्दिष्ट कर्ता के साथ तृतीय पुरुष बहुवचन सक्रिय क्रिया है। ‘वे’ उस अनिर्दिष्ट सक्रिय कर्ता को बनाए रखता है; ‘पालन-पोषण’ निरंतर आहार और देखभाल दोनों का भाव देता है।
- source_word: ἡμέρας χιλίας διακοσίας ἑξήκοντα
  choice: एक हज़ार दो सौ साठ दिनों तक
  rationale: कालावधि-वाचक कर्मकारक को हिन्दी में ‘दिनों तक’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔχει ἐκεῖ
  choice: जहाँ उसके लिए ... एक स्थान है
  rationale: ἐκεῖ का स्थानीय भाव ‘जहाँ’ और आगे के ‘वहाँ’ से स्पष्ट है; हिन्दी में कृत्रिम पुनरुक्ति से बचते हुए स्थान-संबंध सुरक्षित रखा गया है।
theological_decisions:
- issue: τρέφωσιν का अनिर्दिष्ट कर्ता
  choice: सक्रिय बहुवचन ‘वे उसका पालन-पोषण करें’ बनाए रखा गया।
  alternative: ‘वहाँ उसका पालन-पोषण किया जाए’ अथवा ‘परमेश्वर वहाँ उसका पालन-पोषण करे।’
  rationale: यूनानी पाठ कर्ता का नाम नहीं बताता। ‘परमेश्वर’ जोड़ना पाठ से आगे जाना होगा, जबकि निष्क्रिय रूप सक्रिय बहुवचन की वास्तविक अस्पष्टता मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘निर्जन प्रदेश’ व्यापक बाइबिलीय अर्थ बनाए रखता है और ‘वे’ मूल पाठ के अनिर्दिष्ट कर्ता को बिना व्याख्यात्मक जोड़ के सुरक्षित रखता है।
