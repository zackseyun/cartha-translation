id: REV.12.12
reference: Revelation 12:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο εὐφραίνεσθε, ⸀οἱ οὐρανοὶ καὶ οἱ ἐν αὐτοῖς σκηνοῦντες. οὐαὶ ⸂τὴν γῆν καὶ τὴν θάλασσαν⸃, ὅτι κατέβη ὁ διάβολος πρὸς ὑμᾶς, ἔχων θυμὸν μέγαν, εἰδὼς ὅτι ὀλίγον καιρὸν ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/012.yaml
  text: Therefore rejoice[a], O heavens, and you who dwell in them. Woe to the earth and the sea, because the devil has come down to you with great fury[c][b], knowing that he has only a little time.
translation:
  language: hi
  text: इसलिए, हे आकाशो और उनमें निवास करनेवालो, आनन्द मनाओ! परन्तु धरती[a] और समुद्र पर हाय! क्योंकि शैतान प्रचण्ड क्रोध[b] के साथ तुम्हारे पास उतर आया है; वह जानता है कि उसके पास थोड़ा ही समय है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूमि और समुद्र।” यूनानी शब्द γῆ का अर्थ “धरती” या “भूमि,” दोनों हो सकता है; यहाँ प्रसंग के व्यापक ब्रह्माण्डीय स्वरूप के कारण “धरती” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “बड़ा रोष लिए हुए।”
    reason: lexical_alternative
  - marker: c
    text: अक्षरशः, “उसके पास थोड़ा समय है।”
    reason: literal_rendering
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले प्रसंग में स्वर्गीय विजय के आधार पर निकले निष्कर्ष को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εὐφραίνεσθε
  choice: आनन्द मनाओ
  rationale: यह आज्ञार्थक बल और उल्लासपूर्ण प्रतिक्रिया, दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: οἱ οὐρανοὶ
  choice: हे आकाशो
  rationale: यूनानी में कर्ताकारक पद यहाँ सीधे सम्बोधन के रूप में प्रयुक्त है; ‘हे आकाशो’ इस काव्यात्मक सम्बोधन और बहुवचन को स्पष्ट रखता है।
- source_word: οἱ ἐν αὐτοῖς σκηνοῦντες
  choice: उनमें निवास करनेवालो
  rationale: σκηνόω का मूल सम्बन्ध डेरा डालने से है, पर यहाँ उसका अर्थ निवास करना है। यह चयन सम्बोधन को बनाए रखते हुए अस्पष्ट शब्दशः अनुवाद से बचता है।
- source_word: οὐαὶ
  choice: पर ... पर हाय
  rationale: ‘हाय’ भविष्यसूचक संकट और न्याय की उद्घोषणा को व्यक्त करता है; ‘पर’ स्वर्ग के आनन्द और धरती-समुद्र के संकट के बीच तीखा विरोध दिखाता है।
- source_word: τὴν γῆν καὶ τὴν θάλασσαν
  choice: धरती और समुद्र
  rationale: γῆ का अर्थ ‘धरती’ या ‘भूमि’ हो सकता है। प्रकाशितवाक्य के व्यापक ब्रह्माण्डीय प्रसंग और समुद्र के साथ इसके युग्म को देखते हुए ‘धरती’ उपयुक्त है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: κατέβη
  choice: उतर आया है
  rationale: यह पूर्ण हुई हाल की क्रिया और उसके वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ διάβολος
  choice: शैतान
  rationale: इस प्रसंग में διάβολος परमेश्वर के विरोधी का स्थापित पदनाम है; ‘शैतान’ साधारण आधुनिक हिन्दी में सर्वाधिक स्पष्ट और पहचाना हुआ रूप है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: यह पृथ्वी के क्षेत्र की ओर उसके उतरने को व्यक्त करता है, बिना πρός में शत्रुता का ऐसा अर्थ जोड़ने के जिसे अगला वाक्यांश पहले ही स्पष्ट करता है।
- source_word: ἔχων θυμὸν μέγαν
  choice: प्रचण्ड क्रोध के साथ
  rationale: यह θυμός की तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: εἰδὼς
  choice: वह जानता है कि
  rationale: यूनानी कृदन्त का कारणसूचक अथवा व्याख्यात्मक सम्बन्ध हिन्दी में स्वतंत्र उपवाक्य से अधिक स्पष्ट और सहज बनता है।
- source_word: ὀλίγον καιρὸν ἔχει
  choice: उसके पास थोड़ा ही समय है
  rationale: यह मूल शब्दक्रम के निकट रहते हुए शेष अवधि की संक्षिप्तता पर बल देता है; ‘ही’ सीमित समय का आशय स्पष्ट करता है।
theological_decisions:
- issue: ‘तुम्हारे पास’ में ‘तुम्हारे’ का सन्दर्भ
  choice: सम्बोधन धरती और समुद्र की ओर मुड़ता है; इसलिए ‘तुम्हारे’ का सम्बन्ध उनसे, अर्थात् उनके द्वारा दर्शाए गए पार्थिव क्षेत्र से है।
  alternative: ‘तुम्हारे’ को आकाशों और उनमें रहनेवालों के निरन्तर सम्बोधन के रूप में समझना।
  rationale: निकटतम कथन ‘धरती और समुद्र पर हाय’ है, और शैतान का नीचे उतरना उसी संकट का कारण बताया गया है। अनुवाद इस नाटकीय विरोध को रखता है, पर ‘निवासियों’ जैसे अतिरिक्त व्याख्यात्मक शब्द नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे आकाशो’ तथा ‘हाय’ प्रकाशितवाक्य की ऊँची भविष्यसूचक शैली बनाए रखते हैं, जबकि शेष वाक्यरचना सामान्य पाठक के लिए सहज है। पादटिप्पणी-चिह्न सम्बन्धित शब्दों के ठीक पास रखे गए हैं।
