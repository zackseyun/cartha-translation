source:
  edition: SBLGNT
  text: Καὶ σημεῖον μέγα ὤφθη ἐν τῷ οὐρανῷ, γυνὴ περιβεβλημένη τὸν ἥλιον, καὶ ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς, καὶ ἐπὶ τῆς κεφαλῆς αὐτῆς στέφανος ἀστέρων δώδεκα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/001.yaml
  text: 'And a great sign appeared in heaven: a woman clothed with the sun[a], and the moon under her feet, and on her head a crown of twelve stars,'
translation:
  language: hi
  text: 'और स्वर्ग में एक महान चिन्ह दिखाई दिया: एक स्त्री सूर्य को ओढ़े हुए थी, और चंद्रमा उसके पैरों के नीचे था, और उसके सिर पर बारह तारों का एक मुकुट[a] था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माला” अथवा “विजय-मुकुट”; यूनानी शब्द στέφανος है, जो राजमुकुट के लिए प्रयुक्त διάδημα से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον μέγα
  choice: एक महान चिन्ह
  rationale: ‘चिन्ह’ प्रकाशितवाक्य के प्रतीकात्मक दर्शन का भाव बनाए रखता है; ‘महान’ उसके आकार और महत्त्व, दोनों की संभावना को सुरक्षित रखता है।
- source_word: ὤφθη ἐν τῷ οὐρανῷ
  choice: स्वर्ग में ... दिखाई दिया
  rationale: ὤφθη का निष्क्रिय दृश्य-बोध ‘दिखाई दिया’ से स्वाभाविक हिन्दी में व्यक्त होता है, और οὐρανός को इस दर्शन-संदर्भ में ‘स्वर्ग’ कहना उपयुक्त है।
- source_word: γυνὴ περιβεβλημένη τὸν ἥλιον
  choice: एक स्त्री सूर्य को ओढ़े हुए थी
  rationale: परिपूर्ण कृदंत περιβεβλημένη स्त्री की विद्यमान वेशभूषा या आवेष्टन बताता है। ‘ओढ़े हुए’ हिन्दी में काव्यात्मक दृश्य को सहजता से व्यक्त करता है, बिना उसके प्रतीक का अर्थ तय किए।
- source_word: ἡ σελήνη ὑποκάτω τῶν ποδῶν αὐτῆς
  choice: चंद्रमा उसके पैरों के नीचे था
  rationale: यह मूल स्थानिक चित्र को स्पष्ट और स्वाभाविक हिन्दी में ज्यों का त्यों रखता है।
- source_word: στέφανος ἀστέρων δώδεκα
  choice: बारह तारों का मुकुट
  rationale: ‘मुकुट’ सामान्य पाठक के लिए स्पष्ट है; στέφανος के पुष्पहार अथवा विजय-मुकुट वाले विशेष अर्थ और διάδημα से उसके भेद को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: स्त्री की प्रतीकात्मक पहचान
  choice: अनुवाद स्त्री की पहचान निर्धारित नहीं करता और केवल दर्शन का वर्णन करता है।
  alternative: इस्राएल, मरियम, परमेश्वर की प्रजा, या कलीसिया के रूप में स्पष्ट पहचान देना।
  rationale: इस पद में स्त्री की पहचान स्पष्ट रूप से नहीं बताई गई है; किसी एक पहचान को मुख्य पाठ में जोड़ना मूल से आगे जाकर धार्मिक व्याख्या थोपना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, दृश्यात्मक और सामान्य पाठक के लिए सहज शैली। यूनानी वाक्य की दर्शनात्मक गति को रखते हुए हिन्दी में स्पष्टता के लिए सीमित रूप से ‘था/थी’ जोड़ा गया है।
