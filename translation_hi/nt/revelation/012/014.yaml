id: REV.12.14
reference: Revelation 12:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐδόθησαν τῇ γυναικὶ ⸀αἱ δύο πτέρυγες τοῦ ἀετοῦ τοῦ μεγάλου, ἵνα πέτηται εἰς τὴν ἔρημον εἰς τὸν τόπον αὐτῆς, ⸂ὅπου τρέφεται⸃ ἐκεῖ καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ ἀπὸ προσώπου τοῦ ὄφεως.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/014.yaml
  text: And the woman was given the two wings of the great eagle, so that she might fly into the wilderness to her place, where she is nourished there for a time and times and half a time, away from the presence of the serpent.
translation:
  language: hi
  text: और उस स्त्री को उस बड़े उकाब के दो पंख दिए गए, ताकि वह उड़कर निर्जन प्रदेश में अपने स्थान पर चली जाए; वहाँ सर्प से दूर उसका पालन-पोषण एक समय, और समयों, और आधे समय तक किया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀετοῦ
  choice: उकाब
  rationale: प्रकाशितवाक्य की ऊँची और प्रतीकात्मक शैली के लिए ‘उकाब’ उपयुक्त है और बड़े शिकारी गरुड़वंशी पक्षी का सामान्य बाइबलीय बोध देता है।
- source_word: ἔρημον
  choice: निर्जन प्रदेश
  rationale: यह शब्द केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि निर्जन या उजाड़ क्षेत्र को सूचित कर सकता है।
- source_word: τρέφεται
  choice: उसका पालन-पोषण ... किया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य का अर्थ सुरक्षित रहता है; पालन करने वाले की पहचान पाठ में अनकही ही रखी गई है।
- source_word: ἀπὸ προσώπου τοῦ ὄφεως
  choice: साँप से दूर
  rationale: मुहावरे का स्वाभाविक हिन्दी रूप, जो साँप की पहुँच या उपस्थिति से सुरक्षित दूरी का भाव रखता है।
theological_decisions:
- issue: καιρὸν καὶ καιροὺς καὶ ἥμισυ καιροῦ की काल-अभिव्यक्ति
  choice: एक समय, और समयों, और आधे समय तक
  alternative: साढ़े तीन वर्ष तक
  rationale: मूल की प्रतीकात्मक और जानबूझकर अस्पष्ट काल-अभिव्यक्ति को किसी निश्चित गणना में नहीं बदला गया।
- issue: स्त्री का पालन करने वाला
  choice: कर्मवाच्य रखा गया
  alternative: परमेश्वर उसका पालन-पोषण करता है
  rationale: संदर्भ में कर्ता का अनुमान संभव है, पर इस पद के यूनानी पाठ में उसका स्पष्ट नाम नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज वाक्य-विन्यास। ‘वहाँ’ को अलग से दोहराने के बजाय ‘जहाँ’ में स्थान-बोध स्वाभाविक रूप से समाहित किया गया है।
