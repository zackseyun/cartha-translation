id: REV.12.11
reference: Revelation 12:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ἐνίκησαν αὐτὸν διὰ τὸ αἷμα τοῦ ἀρνίου καὶ διὰ τὸν λόγον τῆς μαρτυρίας αὐτῶν, καὶ οὐκ ἠγάπησαν τὴν ψυχὴν αὐτῶν ἄχρι θανάτου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/011.yaml
  text: And they conquered him by the blood of the Lamb and by the word of their testimony[b][a], and they did not love their life even unto death.
translation:
  language: hi
  text: और उन्होंने मेम्ने के लहू के द्वारा और अपनी गवाही के वचन के द्वारा उस पर विजय पाई,[a] और उन्होंने मृत्यु तक भी अपने प्राण को प्रिय नहीं माना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे पराजित किया।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने प्राण से प्रेम नहीं किया”; यूनानी शब्द का अर्थ ‘जीवन,’ ‘स्वयं’ या ‘प्राण’ हो सकता है। यहाँ आशय है कि उन्होंने मृत्यु के सामने भी अपने जीवन को प्रिय नहीं माना।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνίκησαν
  choice: विजय पाई
  rationale: यह यूनानी क्रिया के ‘जीतना/पराजित करना’ अर्थ और प्रकाशितवाक्य की संघर्ष-छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: διὰ τὸ αἷμα
  choice: लहू के कारण
  rationale: यहाँ διά के साथ कर्मकारक को कारण के रूप में लेना व्याकरणतः स्वाभाविक है; निकटवर्ती समान रचना ‘अपनी गवाही के वचन के कारण’ के साथ भी संगति रहती है। ‘के द्वारा’ भी संभव है, पर वह साधन के अर्थ को अधिक स्पष्ट रूप से चुनता है।
- source_word: ἀρνίου
  choice: मेम्ने
  rationale: प्रकाशितवाक्य में यह मसीह-संबंधी उपाधि और बलिदान की छवि है; ‘मेम्ना’ स्थापित और समझने योग्य बाइबलीय पद है।
- source_word: λόγον τῆς μαρτυρίας αὐτῶν
  choice: अपनी गवाही के वचन
  rationale: यह λόγος और μαρτυρία दोनों को व्यक्त करता है तथा उनके बोले हुए साक्ष्य/संदेश की धारणा को सुरक्षित रखता है।
- source_word: οὐκ ἠγάπησαν
  choice: प्रिय न जाना
  rationale: हिन्दी मुहावरे में जीवन को इतना प्रिय न मानने का अर्थ स्वाभाविक ढंग से व्यक्त होता है, जबकि मूल क्रिया ‘प्रेम करना’ का भाव बना रहता है।
- source_word: τὴν ψυχὴν αὐτῶν
  choice: अपने प्राण
  rationale: मृत्यु के प्रसंग में ψυχή का आशय उनका सांसारिक जीवन है। ‘प्राण’ हिन्दी में जीवन के इस अर्थ को व्यक्त करता है, पर ‘आत्मा’ जैसी शरीर-आत्मा द्वैत की अनावश्यक धारणा नहीं जोड़ता।
- source_word: ἄχρι θανάτου
  choice: मृत्यु तक भी
  rationale: यह सीमा और चरम परिणाम—मरने तक—दोनों को संक्षेप और गंभीरता से व्यक्त करता है।
theological_decisions:
- issue: मेम्ने के लहू के संबंध में διά का अर्थ
  choice: ‘के कारण’ के रूप में कारणात्मक अनुवाद
  alternative: ‘के द्वारा’ के रूप में साधनात्मक अनुवाद
  rationale: διά के साथ कर्मकारक सामान्यतः कारण या आधार व्यक्त करता है। अनुवाद विजय को मेम्ने के लहू पर आधारित रखता है, पर पाठ से आगे बढ़कर प्रायश्चित्त की कोई विशिष्ट व्याख्या नहीं जोड़ता।
- issue: शहादत के संदर्भ में ψυχή
  choice: ‘प्राण’ अर्थात जीवन
  alternative: ‘आत्मा’
  rationale: संदर्भ मृत्यु का सामना करते हुए जीवन त्यागने की तत्परता का है। ‘आत्मा’ कहना ऐसा शरीर-आत्मा भेद सुझा सकता है जिसकी इस पद में आवश्यकता नहीं है।
- issue: विश्वासियों की विजय का स्वरूप
  choice: ‘उस पर विजय पाई’
  alternative: ‘उस पर जयवंत हुए’
  rationale: वाक्य शैतान पर उनकी वास्तविक विजय कहता है, जिसका आधार मेम्ने का लहू और उनकी गवाही है; अनुवाद यह तनाव बनाए रखता है और विजय को केवल नैतिक साहस में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, सार्वजनिक-पाठ योग्य रजिस्टर अपनाया गया है। ‘मेम्ना,’ ‘लहू,’ ‘गवाही’ और ‘प्राण’ बाइबलीय गरिमा रखते हुए सामान्य पाठकों के लिए बोधगम्य हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
