id: REV.12.15
reference: Revelation 12:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ὄφις ἐκ τοῦ στόματος αὐτοῦ ὀπίσω τῆς γυναικὸς ὕδωρ ὡς ποταμόν, ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/015.yaml
  text: And the serpent hurled water like a river out of his mouth after the woman[b][a], so that he might cause her to be swept away by the river.
translation:
  language: hi
  text: और साँप ने अपने मुँह से स्त्री के पीछे[a] नदी जैसा पानी फेंक दिया, ताकि वह उसे नदी की धारा में बहा दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्त्री का पीछा करते हुए।” यूनानी पद का अर्थ स्थानगत रूप से “पीछे” या किसी का पीछा करने की दिशा में “पीछे-पीछे” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “ताकि वह उसे नदी द्वारा बहाई हुई बना दे।” भाव यह है कि साँप का उद्देश्य उसे नदी की धारा में बहा देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔβαλεν
  choice: उगल दिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘फेंकना/डालना’ है, पर मुँह से बड़ी मात्रा में पानी निकालने के इस दृश्य में ‘उगल दिया’ स्वाभाविक और सजीव हिन्दी है तथा आक्रमण की तीव्रता बनाए रखता है।
- source_word: ὁ ὄφις
  choice: साँप
  rationale: ὄφις का सीधा अर्थ साँप/सर्प है। ‘साँप’ आधुनिक सामान्य हिन्दी में सहज है और प्रकाशितवाक्य के प्रतीकात्मक पात्र को बिना व्याख्यात्मक विस्तार के प्रस्तुत करता है।
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: अपने मुँह से
  rationale: प्रतिवाचक ‘अपने’ हिन्दी में कर्ता साँप से संबंध स्पष्ट करता है और यूनानी वाक्यांश का स्वाभाविक रूप देता है।
- source_word: ὀπίσω τῆς γυναικός
  choice: स्त्री के पीछे
  rationale: ὀπίσω + संबंधकारक स्थानगत ‘पीछे’ और पीछा करने की दिशा, दोनों संकेत दे सकता है। ‘के पीछे’ मूल अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है; आक्रमण का संदर्भ दिशात्मक अर्थ भी ग्रहण करने देता है।
- source_word: ὕδωρ ὡς ποταμόν
  choice: नदी जैसा पानी
  rationale: यह ὡς द्वारा व्यक्त उपमा और ποταμός की नदी-छवि को बनाए रखता है; ‘बाढ़’ कहने से अनावश्यक व्याख्या जुड़ती।
- source_word: ἵνα αὐτὴν ποταμοφόρητον ποιήσῃ
  choice: ताकि वह उसे नदी की धारा में बहा ले जाए
  rationale: दुर्लभ ποταμοφόρητος का अर्थ नदी द्वारा बहाया/ले जाया गया है और ποιέω इसे कारक बनाता है। हिन्दी वाक्य नदी के पानी को निकटतम कर्ता मानकर उद्देश्य को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘डुबाकर मारना’ जोड़ने के।
theological_decisions:
- issue: साँप के आक्रमण की प्रतीकात्मक, प्रलयदर्शी छवि
  choice: पानी और नदी की छवि को मुख्य पाठ में ज्यों का त्यों रखा गया है।
  alternative: पानी को सेनाओं, सताव, झूठ या अराजकता के रूप में सीधे व्याख्यायित करना।
  rationale: अनुवाद को प्रतीक का अर्थ किसी एक व्याख्यात्मक परंपरा के अनुसार निर्धारित नहीं करना चाहिए।
- issue: अंतिम उद्देश्य-वाक्य में कर्ता का संदर्भ
  choice: ‘वह’ को निकटवर्ती नदी-जैसे पानी के रूप में पढ़ने योग्य रखा गया है।
  alternative: ‘वह’ को साँप मानकर ‘ताकि वह स्त्री को नदी से बहवा दे’ कहना।
  rationale: यूनानी ποιήσῃ का व्याकरणिक कर्ता साँप है, पर कारक संरचना का परिणाम स्त्री का नदी द्वारा बहाया जाना है। हिन्दी में चुना रूप दृश्य को सहज बनाता है; पादटिप्पणी अधिक शाब्दिक कारक अभिव्यक्ति देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘स्त्री’, ‘मुँह’, ‘नदी की धारा’ जैसे परिचित शब्द रखे गए हैं; प्रतीकात्मक छवि की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
