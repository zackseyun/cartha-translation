  yaml_path: translation/nt/revelation/012/008.yaml
  text: But he was not strong enough[a], nor was any place found for them any longer in heaven.
translation:
  language: hi
  text: पर वह प्रबल न हो सका[a], और स्वर्ग में उनके लिए अब कोई स्थान न मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह विजयी न हुआ।” यूनानी क्रिया का अर्थ बलवान होना, समर्थ होना या प्रबल होना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: पर
  rationale: पिछले पद में वर्णित युद्ध के परिणाम के साथ विरोधात्मक संबंध दिखाने के लिए प्रसंगानुसार ‘पर’ स्वाभाविक है।
- source_word: οὐκ ἴσχυσεν
  choice: वह प्रबल न हो सका
  rationale: ἰσχύω में बलवान होने, समर्थ होने या प्रबल होने का अर्थ हो सकता है। युद्ध के प्रसंग में यह चयन सामर्थ्य और विजय—दोनों की अर्थ-छाया बनाए रखता है; एकवचन ‘वह’ पिछले पद के अजगर को सूचित करता है।
- source_word: οὐδὲ
  choice: और ... कोई ... न
  rationale: पहले निषेध के साथ जुड़ी दूसरी नकारात्मक बात को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τόπος
  choice: स्थान
  rationale: स्वर्गीय क्षेत्र में जगह या ठिकाने के सीधे अर्थ को व्यक्त करता है।
- source_word: εὑρέθη
  choice: न मिला
  rationale: यूनानी अओरिस्ट कर्मवाच्य ‘पाया गया’ को हिन्दी के स्वाभाविक परिणामसूचक कर्मवाच्य ‘न मिला’ से व्यक्त किया गया है।
- source_word: αὐτῶν
  choice: उनके लिए
  rationale: यह अजगर और उसके दूतों को सामूहिक रूप से संदर्भित करता है और इस रचना में स्वाभाविक हिन्दी है।
- source_word: ἔτι
  choice: फिर
  rationale: नकारात्मक संदर्भ में अब आगे स्थान न रहने का भाव देता है; ‘फिर कोई स्थान न मिला’ हिन्दी में ‘अब और नहीं’ का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: यहाँ οὐρανός दृश्य आकाश नहीं, स्वर्गीय क्षेत्र को सूचित करता है।
theological_decisions:
- issue: ἴσχυσεν के एकवचन कर्ता का संदर्भ
  choice: ‘वह’—पिछले पद का अजगर
  alternative: ‘वे प्रबल न हो सके’—अजगर और उसके दूत सामूहिक रूप से
  rationale: यूनानी क्रिया एकवचन है और पिछले पद के एकवचन कर्ता ‘अजगर’ को आगे बढ़ाती है, जबकि दूसरे खंड में αὐτῶν बहुवचन रूप से अजगर और उसके दूतों को समेटता है।
- issue: οὐκ ἴσχυσεν में सामर्थ्य और विजय की अर्थ-छाया
  choice: ‘प्रबल न हो सका’
  alternative: ‘विजयी न हुआ’
  rationale: चुना हुआ अनुवाद युद्ध में सफल न होने का अर्थ देता है, पर क्रिया को केवल विजय के परिणाम तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘प्रबल न हो सका’ युद्ध-संदर्भ में स्वाभाविक रहते हुए मूल क्रिया की अर्थगत व्यापकता बनाए रखता है।
