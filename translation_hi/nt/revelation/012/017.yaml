id: REV.12.17
reference: Revelation 12:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὠργίσθη ὁ δράκων ἐπὶ τῇ γυναικί, καὶ ἀπῆλθεν ποιῆσαι πόλεμον μετὰ τῶν λοιπῶν τοῦ σπέρματος αὐτῆς, τῶν τηρούντων τὰς ἐντολὰς τοῦ θεοῦ καὶ ἐχόντων τὴν μαρτυρίαν Ἰησοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/017.yaml
  text: And the dragon became enraged with the woman[a], and went away to make war with the rest of her offspring, those who keep the commandments of God and hold to the testimony of Jesus.
translation:
  language: hi
  text: और अजगर स्त्री पर क्रोध से भर उठा और उसकी बाकी संतान के विरुद्ध युद्ध करने चला गया—जो परमेश्वर की आज्ञाओं का पालन करते हैं और यीशु की गवाही[a] को थामे रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के विषय में गवाही”; अथवा, “यीशु द्वारा दी गई गवाही।” यूनानी संबंधकारक को एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὠργίσθη
  choice: क्रोध से भर उठा
  rationale: यह रूप क्रोध उत्पन्न होने और उसकी तीव्रता, दोनों को व्यक्त करता है; प्रकाशितवाक्य के संघर्षपूर्ण संदर्भ में केवल ‘क्रोधित था’ की अपेक्षा अधिक सटीक और स्वाभाविक है।
- source_word: δράκων
  choice: अजगर
  rationale: प्रकाशितवाक्य की प्रतीकात्मक छवि के लिए प्रचलित और स्पष्ट हिन्दी शब्द है तथा अध्याय में पहले से पहचाने गए पात्र को बनाए रखता है।
- source_word: γυναικί
  choice: स्त्री
  rationale: γυνή का सीधा अनुवाद है; निश्चितता संदर्भ से स्पष्ट है कि यह वही स्त्री है जिसका पहले उल्लेख हुआ है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: ἀπέρχομαι की कथात्मक गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना गंतव्य या उद्देश्य में अतिरिक्त अर्थ जोड़े।
- source_word: ποιῆσαι πόλεμον
  choice: युद्ध करने
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और खुले संघर्ष का भाव बनाए रखता है।
- source_word: μετὰ τῶν λοιπῶν
  choice: शेष ... के विरुद्ध
  rationale: μετά संबंधसूचक रूप के साथ शाब्दिक रूप से ‘साथ’ है, पर ‘युद्ध करना’ के साथ यहाँ विरोधी पक्ष सूचित होता है; हिन्दी में ‘के विरुद्ध युद्ध करना’ स्पष्ट और स्वाभाविक है।
- source_word: τοῦ σπέρματος αὐτῆς
  choice: उसकी शेष संतान
  rationale: σπέρμα के वंश अथवा संतान-संबंधी अर्थ को व्यक्त करता है; ‘बीज’ की अनावश्यक शाब्दिकता और ‘वंशजों’ की अपेक्षाकृत औपचारिक ध्वनि से बचता है।
- source_word: τηρούντων
  choice: पालन करते हैं
  rationale: आज्ञाओं के संदर्भ में τηρέω का आशय विश्वासयोग्य रीति से मानना और आचरण करना है; ‘पालन करना’ इसका मानक, सहज हिन्दी रूप है।
- source_word: τὰς ἐντολὰς
  choice: आज्ञाओं
  rationale: ἐντολή के अधिकारपूर्ण धार्मिक अर्थ और बाइबलीय अनुगूंज को सुरक्षित रखता है।
- source_word: ἐχόντων
  choice: थामे रहते हैं
  rationale: ἔχω का मूल अर्थ ‘रखना/पास होना’ है; यहाँ यह गवाही से स्थिर जुड़ाव को दर्शाता है। ‘थामे रहते हैं’ उस निरंतर निष्ठा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: यीशु की गवाही
  rationale: 'यह हिन्दी संबंधवाचक रचना यूनानी संबंधकारक की वास्तविक अस्पष्टता को बनाए रखती है: गवाही यीशु के विषय में भी समझी जा सकती है और यीशु द्वारा दी गई गवाही भी।'
theological_decisions:
- issue: τὴν μαρτυρίαν Ἰησοῦ में संबंधकारक का अर्थ
  choice: यीशु की गवाही
  alternative: यीशु के विषय में गवाही; अथवा यीशु द्वारा दी गई गवाही
  rationale: यूनानी संबंधकारक को वस्तुवाचक या कर्तृवाचक दोनों रूपों में समझा जा सकता है। मुख्य पाठ में ‘यीशु की गवाही’ दोनों संभावनाओं को खुला रखता है और पाद-टिप्पणी उन्हें स्पष्ट करती है, इसलिए किसी एक धर्मवैज्ञानिक व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘अजगर’, ‘आज्ञाओं का पालन’ और ‘गवाही’ जैसे स्थापित बाइबलीय शब्द सुरक्षित हैं। वाक्य में दीर्घ व्याख्यात्मक संबंध को स्पष्ट करने के लिए डैश और ‘उनके विरुद्ध’ की पुनरावृत्ति प्रयुक्त हुई है।
