  yaml_path: translation/nt/revelation/012/005.yaml
  text: And she gave birth to a son, a male child, who is about to shepherd all the nations with an iron rod; and her child was snatched up to God and to his throne.
translation:
  language: hi
  text: और उसने एक पुत्र—एक नर बालक—को जन्म दिया, जो लोहे के राजदंड से सब राष्ट्रों की चरवाही करने वाला है;[a] और उसके बच्चे को झपटकर परमेश्वर के पास और उसके सिंहासन के पास उठा लिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो लोहे के राजदंड से सब राष्ट्रों पर शासन करेगा।” यूनानी क्रिया का शाब्दिक अर्थ “चरवाही करना” है, पर यहाँ यह भजन 2 की प्रतिध्वनि है और राजकीय अधिकार का भाव रखती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: जन्म दिया
  rationale: τίκτω की ठोस प्रसव-छवि को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: υἱόν, ἄρσεν
  choice: एक पुत्र, एक नर बालक
  rationale: यूनानी में प्रयुक्त दोनों पदों और उनके जानबूझकर दिए गए बल को बनाए रखता है।
- source_word: μέλλει ποιμαίνειν
  choice: चरवाही करनेवाला है
  rationale: μέλλει के भावी अथवा नियत कार्य के अर्थ को हिन्दी में स्वाभाविक रूप से व्यक्त करता है, बिना उसे केवल निकट भविष्य तक सीमित किए।
- source_word: ποιμαίνειν
  choice: चरवाही करने
  rationale: ποιμαίνω के मूल चरवाहा-रूपक को सुरक्षित रखता है; भजन 2 की पृष्ठभूमि में इसमें राजकीय शासन का भाव भी निहित है।
- source_word: πάντα τὰ ἔθνη
  choice: सब राष्ट्रों
  rationale: संसार के राष्ट्रों के व्यापक अर्थ और भजन 2 की प्रतिध्वनि को स्पष्ट रखता है।
- source_word: ἐν ῥάβδῳ σιδηρᾷ
  choice: लोहे के राजदंड से
  rationale: ῥάβδος के दंड और राजकीय अधिकार—दोनों भावों को संदर्भानुकूल हिन्दी में व्यक्त करता है।
- source_word: ἡρπάσθη
  choice: झपटकर ... उठा लिया गया
  rationale: ἁρπάζω में निहित अचानक और बलपूर्वक हटा लिए जाने के भाव को, ऊपर परमेश्वर की ओर गति सहित, बनाए रखता है।
- source_word: τὸ τέκνον αὐτῆς
  choice: उसका बच्चा
  rationale: υἱός से τέκνον की यूनानी शब्द-विविधता को हिन्दी में भी दर्शाता है।
- source_word: πρὸς τὸν θεὸν καὶ πρὸς τὸν θρόνον αὐτοῦ
  choice: परमेश्वर और उसके सिंहासन के पास
  rationale: दोनों गंतव्यों की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है; दोहराया हुआ संबंधबोधक हिन्दी में आवश्यक नहीं है।
theological_decisions:
- issue: ποιμαίνειν ... ἐν ῥάβδῳ σιδηρᾷ में भजन 2 का मसीही संकेत
  choice: मुख्य पाठ में चरवाही का रूपक रखा गया और राजकीय अर्थ पादटिप्पणी में दिया गया।
  alternative: लोहे के राजदंड से सब राष्ट्रों पर शासन करेगा
  rationale: यूनानी क्रिया का मूल अर्थ ‘चरवाही करना’ है, जबकि भजन 2 के संकेत के कारण इसमें राजकीय अधिकार भी समाहित है; मुख्य पाठ मूल रूपक को सुरक्षित रखता है।
- issue: μέλλει का भाव
  choice: करनेवाला है
  alternative: करने ही वाला है; करेगा; चरवाही करने के लिए नियत है
  rationale: प्रकाशितवाक्य के इस संदर्भ में μέλλει भावी अथवा नियत कार्य सूचित कर सकता है। ‘करनेवाला है’ इस तनाव को स्वाभाविक हिन्दी में रखता है और अनिवार्य निकटता नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘नर बालक’ मूल की बलाघाती पुनरुक्ति को बनाए रखता है; ‘राजदंड’ लौह-दंड की राजकीय भूमिका स्पष्ट करता है।
