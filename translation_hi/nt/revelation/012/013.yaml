  text: Καὶ ὅτε εἶδεν ὁ δράκων ὅτι ἐβλήθη εἰς τὴν γῆν, ἐδίωξεν τὴν γυναῖκα ἥτις ἔτεκεν τὸν ἄρσενα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/013.yaml
  text: And when the dragon saw that he had been thrown down to the earth[b][a], he pursued the woman who had given birth to the male child.
translation:
  language: hi
  text: जब अजगर ने देखा कि उसे पृथ्वी पर फेंक दिया गया था, तो उसने उस स्त्री का पीछा किया[a], जिसने नर बालक[b] को जन्म दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्त्री को सताया।’ यूनानी क्रिया का अर्थ ‘पीछा करना’ या ‘सताना’ हो सकता है; यहाँ संभवतः शत्रुतापूर्ण पीछा और सताव—दोनों भाव शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘नर को।’ स्वाभाविक हिन्दी के लिए ‘बालक’ जोड़ा गया है; आसपास के प्रसंग की भाषा से तुलना करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: δράκων
  choice: अजगर
  rationale: प्रकाशितवाक्य की प्रतीकात्मक भाषा में यह विशाल सर्पाकार दैत्य को दर्शाता है। ‘अजगर’ प्रचलित हिन्दी बाइबलीय पद है और इसे ‘साँप’ बनाकर अन्य पदों से समरूप नहीं किया गया।
- source_word: ἐβλήθη
  choice: फेंक दिया गया है
  rationale: यह बलपूर्वक निष्कासन का कर्मवाच्य भाव बनाए रखता है; ‘देखा कि’ के बाद हिन्दी में पूर्ण अवस्था स्वाभाविक है।
- source_word: εἰς τὴν γῆν
  choice: पृथ्वी पर
  rationale: इस ब्रह्मांडीय प्रसंग में γῆ का अर्थ ‘पृथ्वी’ है, ‘देश’ या ‘भूमि’ नहीं; ‘फेंक दिया गया’ के साथ ‘पर’ स्वाभाविक हिन्दी है।
- source_word: ἐδίωξεν
  choice: पीछा किया
  rationale: διώκω यहाँ शत्रुतापूर्ण पीछा और सताव—दोनों अर्थ दे सकता है। मुख्य पाठ ठोस कथात्मक क्रिया रखता है और पादटिप्पणी दूसरा अर्थ बताती है।
- source_word: γυναῖκα
  choice: स्त्री
  rationale: मूल का सीधा और गरिमापूर्ण अनुवाद; उसकी प्रतीकात्मक पहचान को पाठ में निर्धारित नहीं किया गया।
- source_word: ἥτις
  choice: जिसने
  rationale: सम्बन्धवाचक उपवाक्य के लिए स्वाभाविक आधुनिक हिन्दी।
- source_word: ἔτεκεν
  choice: जन्म दिया था
  rationale: τίκτω का जन्म देने का अर्थ स्पष्ट रखता है और पीछा किए जाने से पहले की घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν ἄρσενα
  choice: नर बालक
  rationale: मूल में संज्ञा के रूप में प्रयुक्त ‘नर’ है। हिन्दी में ‘बालक’ जोड़ने से अर्थ स्वाभाविक बनता है, जबकि पुरुष-लिंग पर मूल का विशेष बल भी बना रहता है।
theological_decisions:
- issue: स्त्री और बालक की प्रतीकात्मक पहचान
  choice: मुख्य पाठ में केवल ‘स्त्री’ और ‘नर बालक’ की मूल प्रतीकात्मक छवियाँ रखी गई हैं।
  alternative: स्त्री को मरियम, इस्राएल या परमेश्वर की प्रजा/कलीसिया के रूप में, और बालक की पहचान को व्याख्यात्मक रूप से स्पष्ट करना।
  rationale: यह पद प्रकाशनात्मक प्रतीकवाद का भाग है और स्त्री के संकेतार्थ पर विभिन्न मान्य व्याख्याएँ हैं। अनुवाद को उस प्रश्न का निर्णय नहीं करना चाहिए जिसे मूल पाठ यहाँ स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘अजगर’ और ‘नर बालक’ प्रकाशितवाक्य की विशिष्ट प्रतीकात्मक शब्दावली को बनाए रखते हैं; अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
