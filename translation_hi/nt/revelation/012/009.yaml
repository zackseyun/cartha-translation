id: REV.12.9
reference: Revelation 12:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐβλήθη ὁ δράκων ὁ μέγας, ὁ ὄφις ὁ ἀρχαῖος, ὁ καλούμενος Διάβολος καὶ ⸀ὁ Σατανᾶς, ὁ πλανῶν τὴν οἰκουμένην ὅλην— ἐβλήθη εἰς τὴν γῆν, καὶ οἱ ἄγγελοι αὐτοῦ μετ’ αὐτοῦ ἐβλήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/009.yaml
  text: And the great dragon was thrown down—the ancient serpent[a], the one called the Devil and Satan, who deceives the whole world. He was thrown down to the earth[b], and his angels were thrown down with him.
translation:
  language: hi
  text: और वह बड़ा अजगर नीचे फेंक दिया गया—वही प्राचीन साँप[a], जिसे इब्लीस और शैतान कहा जाता है, जो सारे संसार[b] को भटकाता है। उसे पृथ्वी पर फेंक दिया गया, और उसके स्वर्गदूत भी उसके साथ फेंक दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्राचीन साँप” उत्पत्ति 3 के साँप की छवि की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: या, “पूरी बसी हुई दुनिया को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλήθη / ἐβλήθησαν
  choice: नीचे फेंक दिया गया / फेंक दिए गए
  rationale: निष्क्रिय क्रिया यहाँ बलपूर्वक नीचे निकाले जाने का भाव देती है। पहली घटना में ‘नीचे’ स्पष्ट किया गया है और दोहराव बनाए रखने के लिए आगे भी ‘फेंक’ क्रिया रखी गई है।
- source_word: δράκων ὁ μέγας
  choice: वह बड़ा अजगर
  rationale: ‘अजगर’ आधुनिक हिन्दी में प्रकाशितवाक्य के प्रतीकात्मक विशाल सर्पाकार प्राणी के लिए स्वाभाविक और परिचित शब्द है।
- source_word: ὁ ὄφις ὁ ἀρχαῖος
  choice: वही प्राचीन साँप
  rationale: ‘साँप’ सामान्य पाठक के लिए स्वाभाविक है; ‘प्राचीन’ मूल के पुराने समय से संबंध को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है। ‘वही’ समानाधिकरण द्वारा अजगर की पहचान स्पष्ट करता है।
- source_word: ὁ καλούμενος
  choice: जो … कहलाता है
  rationale: यह कृदन्त उस प्राणी को प्रचलित नामों से पहचानता है; हिन्दी में संबंधवाचक उपवाक्य सहज है।
- source_word: Διάβολος
  choice: इब्लीस
  rationale: इस प्रसंग में यह केवल ‘निन्दक’ का सामान्य अर्थ नहीं, बल्कि एक मान्य नाम/उपाधि है; ‘इब्लीस’ हिन्दी बाइबलीय प्रयोग में परिचित रूप है।
- source_word: Σατανᾶς
  choice: शैतान
  rationale: नाम/उपाधि का हिन्दी में प्रचलित रूप रखा गया है।
- source_word: ὁ πλανῶν
  choice: भटकाता है
  rationale: यह πλανάω के ‘मार्ग से भटकाना/बहकाना’ भाव को सुरक्षित रखता है और केवल बौद्धिक छल तक अर्थ को सीमित नहीं करता।
- source_word: τὴν οἰκουμένην ὅλην
  choice: सारे संसार को
  rationale: यह सर्वव्यापी अपोकैलिप्टिक दायरे को सहज हिन्दी में व्यक्त करता है; ‘पूरी बसी हुई दुनिया’ को पादटिप्पणी में अधिक शाब्दिक विकल्प के रूप में दिया गया है।
- source_word: εἰς τὴν γῆν
  choice: पृथ्वी पर
  rationale: यहाँ स्वर्ग से पृथ्वी के क्षेत्र में निष्कासन का विरोध स्पष्ट है; इसलिए ‘भूमि’ की अपेक्षा ‘पृथ्वी’ उचित है।
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: उसके स्वर्गदूत
  rationale: अपोकैलिप्टिक प्रसंग में ये अलौकिक प्राणी हैं, इसलिए सामान्य ‘दूतों’ के बजाय ‘स्वर्गदूत’ स्पष्ट और उपयुक्त है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: संग-साथ का सरल और सटीक हिन्दी रूप।
theological_decisions:
- issue: Διάβολος और Σατανᾶς को समानाधिकरण में प्रस्तुत करना
  choice: जो इब्लीस और शैतान कहलाता है
  alternative: जो निन्दक और विरोधी कहलाता है
  rationale: मूल पाठ इन दोनों को अजगर की पहचानी हुई उपाधियों/नामों के रूप में रखता है। प्रचलित हिन्दी रूप संदर्भगत पहचान सुरक्षित रखते हैं और इनके व्युत्पत्तिगत अर्थों को मुख्य पाठ में थोपते नहीं हैं।
- issue: οἰκουμένη का दायरा
  choice: सारे संसार को
  alternative: पूरी बसी हुई दुनिया को
  rationale: मुख्य पाठ का व्यापक रूप इस दर्शन के सार्वभौमिक दायरे के अनुकूल है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ὁ πλανῶν में छल और भटकाव का संबंध
  choice: भटकाता है
  alternative: धोखा देता है
  rationale: ‘भटकाता है’ मूल क्रिया के दिशा से हटाने वाले भाव को बनाए रखता है और छल के भाव को नकारता भी नहीं; इस प्रकार अर्थ को केवल असत्य सूचना देने तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल यूनानी की बार-बार आने वाली ‘फेंक दिया गया’ क्रिया को हिन्दी में भी दोहराया गया है। अंग्रेज़ी परामर्श पाठ में पादटिप्पणी-चिह्न विषय से उलटे जुड़े दिखाई देते थे; हिन्दी मसौदे में उत्पत्ति 3 का संकेत ‘प्राचीन साँप’ पर और οἰκουμένη का शाब्दिक विकल्प ‘सारे संसार’ पर लगाया गया है।
