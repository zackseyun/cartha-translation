lexical_decisions:
- source_word: ἐν γαστρὶ ἔχουσα
  choice: वह गर्भवती थी
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘गर्भ में लिए हुए’ है; ‘गर्भवती थी’ आधुनिक हिन्दी में इसका स्वाभाविक और सटीक रूप है।
- source_word: κράζει
  choice: पुकार रही थी
  rationale: वर्तमानकालीन क्रिया दर्शन के दृश्य को सजीव बनाती है; हिन्दी में अपूर्ण भूतकाल प्रसंग के वर्णन के साथ स्वाभाविक रहते हुए निरंतर पुकारने का भाव व्यक्त करता है।
- source_word: ὠδίνουσα
  choice: प्रसव-पीड़ा से तड़पती हुई
  rationale: यह कृदन्त प्रसव के समय होने वाली पीड़ा को स्पष्ट करता है; यह रूप पीड़ा की तीव्रता को बनाए रखता है।
- source_word: βασανιζομένη
  choice: घोर यातना सहती हुई
  rationale: निष्क्रिय कृदन्त अत्यन्त कष्ट या यातना का बोध कराता है; ‘घोर यातना सहती हुई’ प्रसव के संदर्भ में इसकी तीव्रता बनाए रखता है।
- source_word: τεκεῖν
  choice: जन्म देने की
  rationale: अनन्त क्रिया प्रसव से जुड़े कष्ट का लक्ष्य अथवा परिस्थिति बताती है; ‘जन्म देने की’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: यूनानी में बार-बार आए संयोजकों के संचयी प्रभाव को हिन्दी वाक्य-रचना में यथासंभव सुरक्षित रखा गया है।
theological_decisions:
- issue: दर्शन में स्त्री की पीड़ा की तीव्रता और प्रकृति
  choice: βασανιζομένη को प्रबल रूप में ‘घोर यातना सहती हुई’ अनूदित किया गया और स्त्री की पहचान की व्याख्या नहीं की गई।
  alternative: ‘व्याकुल थी’ या ‘पीड़ा में थी’ जैसे अपेक्षाकृत मृदु अनुवाद।
  rationale: पद स्त्री के कष्ट का सजीव और तीव्र वर्णन करता है, पर स्वयं उसकी प्रतीकात्मक पहचान या पीड़ा का धर्मवैज्ञानिक अर्थ नहीं बताता। इसलिए तीव्रता सुरक्षित रखी गई है, बिना किसी विशेष व्याख्यात्मक ढाँचे को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और दृश्यात्मक रूप अपनाया गया है। प्रसव की पीड़ा के लिए सामान्यतः समझ में आने वाली शब्दावली रखी गई है और मूल की तीव्रता को मृदु नहीं किया गया।
