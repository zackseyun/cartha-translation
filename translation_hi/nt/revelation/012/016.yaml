  edition: SBLGNT
  text: καὶ ἐβοήθησεν ἡ γῆ τῇ γυναικί, καὶ ἤνοιξεν ἡ γῆ τὸ στόμα αὐτῆς καὶ κατέπιεν τὸν ποταμὸν ὃν ἔβαλεν ὁ δράκων ἐκ τοῦ στόματος αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/016.yaml
  text: And the earth helped the woman[b][a], and the earth opened its mouth and swallowed the river that the dragon had thrown from his mouth.
translation:
  language: hi
  text: और पृथ्वी ने उस स्त्री की सहायता की[a]। पृथ्वी ने अपना मुँह खोला और उस नदी को निगल लिया, जिसे अजगर ने अपने मुँह से फेंका था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि ने उस स्त्री की सहायता की।” यूनानी शब्द γῆ का अर्थ “पृथ्वी,” “भूमि” या “धरती” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसे अजगर ने अपने मुँह से निकाला था” अथवा “अपने मुँह से बाहर भेजा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβοήθησεν
  choice: सहायता की
  rationale: βοηθέω का सीधा अर्थ सहायता करना या मदद को आना है। ‘सहायता की’ आधुनिक, गरिमापूर्ण और कथात्मक संदर्भ में स्वाभाविक है।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: γῆ के अर्थ पृथ्वी, भूमि या धरती हो सकते हैं। इस ब्रह्मांडीय प्रकाशनात्मक दृश्य में ‘पृथ्वी’ उपयुक्त है और पद में दोहराए गए कर्ता को स्पष्ट रखता है।
- source_word: τῇ γυναικί
  choice: उस स्त्री
  rationale: संदर्भ में पहले से उपस्थित विशिष्ट प्रतीकात्मक स्त्री के लिए सव्याख्यात्मक विस्तार किए बिना निश्चितता को व्यक्त करता है।
- source_word: ἤνοιξεν ... τὸ στόμα αὐτῆς
  choice: अपना मुँह खोला
  rationale: यूनानी में γῆ स्त्रीलिंग है, पर हिंदी में ‘पृथ्वी ने अपना मुँह’ स्वाभाविक रूप से उसी कर्ता की ओर संकेत करता और मानवीकरण बनाए रखता है।
- source_word: κατέπιεν
  choice: निगल लिया
  rationale: καταπίνω का सीधा अर्थ निगलना है। ‘निगल लिया’ पूर्ण हुई घटना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τὸν ποταμόν
  choice: उस नदी
  rationale: ποταμός का सामान्य अर्थ नदी है। ‘बाढ़’ या ‘धारा’ कहना संदर्भ की व्याख्या को मूल संज्ञा पर आरोपित कर सकता है।
- source_word: ὃν ἔβαλεν
  choice: जिसे ... निकाला था
  rationale: βάλλω मूलतः फेंकने या डालने का व्यापक अर्थ रखता है; मुँह से नदी के निकलने के इस संदर्भ में ‘निकाला था’ सहज हिंदी है, जबकि बलपूर्ण ‘उगल दिया था’ भी संभव है और पादटिप्पणी में रखा गया है।
- source_word: ὁ δράκων
  choice: अजगर
  rationale: δράκων के लिए प्रकाशितवाक्य की प्रतीकात्मक आकृति को सुरक्षित रखने वाला प्रचलित हिंदी बाइबलीय पद है।
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: अपने मुँह से
  rationale: पूर्वसर्गीय वाक्यांश का संक्षिप्त और स्वाभाविक हिंदी रूप, जिसमें अजगर ही क्रिया का कर्ता बना रहता है।
theological_decisions:
- issue: प्रकाशनात्मक चित्र में पृथ्वी का मानवीकरण
  choice: पृथ्वी को सहायता करते, मुँह खोलते और निगलते हुए चित्रित करने वाली भाषा को ज्यों का त्यों बनाए रखा गया है।
  alternative: पृथ्वी को किसी जनसमूह, भूभाग या परमेश्वर द्वारा किए गए बचाव के साधन के रूप में स्पष्ट करना।
  rationale: मूल पाठ प्रतीक का अर्थ स्वयं नहीं खोलता; इसलिए अनुवाद को उसकी सजीव छवि और धर्मवैचारिक तनाव को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘पृथ्वी’ और ‘नदी’ मूल प्रकाशनात्मक बिंब को बनाए रखते हैं; प्रतीक की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
