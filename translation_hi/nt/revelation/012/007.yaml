source:
  edition: SBLGNT
  text: Καὶ ἐγένετο πόλεμος ἐν τῷ οὐρανῷ, ὁ Μιχαὴλ καὶ οἱ ἄγγελοι αὐτοῦ ⸀τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος. καὶ ὁ δράκων ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/007.yaml
  text: 'And war broke out in heaven: Michael and his angels fought against the dragon[a]. And the dragon and his angels fought back[c][b],'
translation:
  language: hi
  text: 'और स्वर्ग में युद्ध छिड़ गया: मीकाएल और उसके स्वर्गदूतों ने अजगर से युद्ध किया। और अजगर और उसके स्वर्गदूतों ने युद्ध किया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγένετο πόλεμος
  choice: युद्ध छिड़ गया
  rationale: γίνομαι के साथ πόλεμος यहाँ युद्ध के आरम्भ या घटित होने का बोध देता है। ‘युद्ध छिड़ गया’ स्वाभाविक आधुनिक हिन्दी में इस आरम्भिक भाव को व्यक्त करता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: इस प्रकाशन-साहित्यिक संदर्भ में οὐρανός दृश्य आकाश से अधिक स्वर्गीय लोक को सूचित करता है।
- source_word: Μιχαὴλ
  choice: मीकाएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है; पद में उसकी पदवी या पहचान नहीं जोड़ी गई।
- source_word: οἱ ἄγγελοι αὐτοῦ
  choice: उसके स्वर्गदूत
  rationale: सम्बन्धसूचक सर्वनाम को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है। ‘स्वर्गदूत’ सामान्य पाठक के लिए प्रचलित और सुस्पष्ट पद है।
- source_word: τοῦ πολεμῆσαι μετὰ τοῦ δράκοντος
  choice: उस अजगर से युद्ध किया
  rationale: सानुच्छेद क्रियार्थक संज्ञा की संक्षिप्त यूनानी रचना को हिन्दी में पूर्ण क्रिया से व्यक्त किया गया है। युद्ध के संदर्भ में μετά का विरोधात्मक सम्बन्ध ‘से’ द्वारा स्वाभाविक रूप से प्रकट होता है।
- source_word: δράκοντος / δράκων
  choice: अजगर
  rationale: δράκων के प्रकाशन-साहित्यिक, विशाल सर्पाकार दैत्य के बिम्ब के लिए ‘अजगर’ हिन्दी बाइबल-परम्परा में परिचित है। इसे साधारण साँप नहीं बनाया गया।
- source_word: ἐπολέμησεν καὶ οἱ ἄγγελοι αὐτοῦ
  choice: अपने स्वर्गदूतों के साथ युद्ध किया
  rationale: यूनानी में एकवचन क्रिया के बाद ‘और उसके स्वर्गदूत’ की संक्षिप्त, कुछ असममित रचना है। हिन्दी में सहभागिता स्पष्ट करने के लिए ‘अपने स्वर्गदूतों के साथ’ रखा गया है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
theological_decisions:
- issue: मीकाएल की पहचान और पदवी
  choice: केवल ‘मीकाएल’ नाम रखा गया है।
  alternative: ‘प्रधान स्वर्गदूत मीकाएल’ कहना या उसे किसी मसीही पहचान से जोड़ना।
  rationale: यह पद केवल नाम देता है; उसकी पदवी या मसीह से पहचान इस पद में व्यक्त नहीं है। इसलिए कोई साम्प्रदायिक व्याख्या नहीं जोड़ी गई।
- issue: अजगर और उसके स्वर्गदूतों की भूमिका
  choice: उन्हें विरोधी पक्ष के रूप में युद्ध करते हुए प्रस्तुत किया गया है, बिना उनके स्वभाव या उद्गम की अतिरिक्त व्याख्या के।
  alternative: इस पद में ही अजगर को शैतान कहना या स्वर्गदूतों को गिरे हुए स्वर्गदूत कहना।
  rationale: निकटवर्ती प्रसंग आगे पहचान स्पष्ट करता है, पर इस पद के शब्दों में वह विस्तार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘युद्ध छिड़ गया’ आरम्भिक घटना-बोध देता है। ‘मीकाएल’ और ‘अजगर’ परिचित हिन्दी बाइबलीय रूप हैं। मुख्य पाठ में यूनानी की संक्षिप्त रचना को स्वाभाविक हिन्दी बनाया गया है और उसका अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
