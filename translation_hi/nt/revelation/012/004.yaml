id: REV.12.4
reference: Revelation 12:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡ οὐρὰ αὐτοῦ σύρει τὸ τρίτον τῶν ἀστέρων τοῦ οὐρανοῦ, καὶ ἔβαλεν αὐτοὺς εἰς τὴν γῆν. καὶ ὁ δράκων ἕστηκεν ἐνώπιον τῆς γυναικὸς τῆς μελλούσης τεκεῖν, ἵνα ὅταν τέκῃ τὸ τέκνον αὐτῆς καταφάγῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/004.yaml
  text: And his tail sweeps away a third of the stars of heaven and threw them to the earth. And the dragon stood before the woman who was about to give birth, so that when she gave birth, he might devour her child.
translation:
  language: hi
  text: उसकी पूँछ आकाश के तारों के एक तिहाई भाग को घसीटती हुई ले गई और उन्हें पृथ्वी पर फेंक दिया। वह अजगर उस स्त्री के सामने खड़ा हो गया जो बच्चे को जन्म देने वाली थी, ताकि जब वह बच्चे को जन्म दे, तो वह उसके बच्चे को निगल जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύρει
  choice: घसीटती हुई ले गई
  rationale: मूल क्रिया में खींचने/घसीटने का भाव है। वर्तमान-काल रूप दृश्य को सजीव बनाता है, पर अगली भूतकालीन क्रिया के साथ हिंदी में स्वाभाविक कथात्मक प्रवाह के लिए संयुक्त भूतकालीन अभिव्यक्ति चुनी गई।
- source_word: τὸ τρίτον τῶν ἀστέρων
  choice: तारों के एक तिहाई भाग
  rationale: यह तारों के कुल समूह के एक-तिहाई अंश को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: δράκων
  choice: अजगर
  rationale: प्रकाशितवाक्य के विशाल, भयावह सर्पाकार प्राणी के लिए प्रचलित बाइबलीय हिंदी शब्द; इसे आधुनिक काल्पनिक अर्थ वाले उधारशब्द से नहीं बदला गया।
- source_word: καταφάγῃ
  choice: निगल जाए
  rationale: क्रिया का तीव्र अर्थ पूरी तरह खा जाने या निगल जाने का है; प्रसंग में 'निगल जाए' सजीव और स्वाभाविक है।
theological_decisions:
- issue: तारों की पहचान
  choice: केवल 'तारे' कहा गया; उनकी पहचान की व्याख्या नहीं जोड़ी गई।
  alternative: तारों को स्वर्गदूत या किसी अन्य सत्ता के रूप में स्पष्ट करना।
  rationale: इस पद में प्रतीक की पहचान स्वयं स्पष्ट नहीं की गई है; अनुवाद को उस वास्तविक अस्पष्टता को बनाए रखना चाहिए।
- issue: σύρει और ἔβαλεν के कालों का अंतर
  choice: दोनों को स्वाभाविक हिंदी कथात्मक भूतकाल में जोड़ा गया।
  alternative: ‘घसीटती है ... फेंक दिया’ जैसा असामान्य काल-अंतर बनाए रखना।
  rationale: यूनानी पाठ में वर्तमान और भूतकाल का अचानक मेल है, पर हिंदी में उसका शाब्दिक अनुकरण भ्रमकारी और अस्वाभाविक होता; घटनाक्रम बदले बिना कथात्मक अर्थ सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। प्रतीकात्मक भाषा को बिना अतिरिक्त व्याख्या के बनाए रखा गया है।
