  yaml_path: translation/nt/revelation/012/003.yaml
  text: And another sign appeared in heaven[a], and behold, a great red dragon, having seven heads and ten horns, and on his heads seven diadems[b],
translation:
  language: hi
  text: स्वर्ग में एक और चिन्ह दिखाई दिया, और देखो, एक विशाल अग्नि-सा लाल अजगर था, जिसके सात सिर और दस सींग थे, और उसके सिरों पर सात राजमुकुट[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ विशेष रूप से राजकीय सिरबंद या राजमुकुट है; यह विजेता को दी जाने वाली पुष्पमाला से भिन्न शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: दर्शन-वर्णन में यह कर्मवाच्य रूप स्वाभाविक रूप से किसी वस्तु के प्रकट होकर दिखाई देने को व्यक्त करता है।
- source_word: ἄλλο σημεῖον
  choice: एक और चिन्ह
  rationale: प्रकाशितवाक्य में σημεῖον प्रतीकात्मक दर्शनीय चिन्ह को बताता है; ‘चिन्ह’ स्पष्ट और प्रचलित है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: οὐρανός का अर्थ आकाश भी हो सकता है, पर इस अपोकैलिप्टिक दर्शन के ब्रह्मांडीय संदर्भ में ‘स्वर्ग’ अधिक उपयुक्त है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह अचानक ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: δράκων μέγας πυρρός
  choice: एक विशाल अग्नि-सा लाल अजगर
  rationale: ‘विशाल’ आकार और भयावहता व्यक्त करता है; ‘अग्नि-सा लाल’ πυρρός के ज्वाला-जैसे लाल रंग को बिना प्रतीकात्मक व्याख्या जोड़े सुरक्षित रखता है।
- source_word: κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: सात सिर और दस सींग
  rationale: दर्शनीय बिंबों का सीधा अनुवाद किया गया है; उनके प्रतीकात्मक अर्थ को अनुवाद में नहीं खोला गया।
- source_word: διαδήματα
  choice: राजमुकुट
  rationale: διάδημα राजसत्ता-सूचक मुकुट या राजकीय सिरबंद है और στέφανος से भिन्न है; साधारण पाठक के लिए ‘राजमुकुट’ इस भेद को ‘मुकुट’ से अधिक स्पष्ट करता है।
theological_decisions:
- issue: πυρρός में रंग और अग्नि-संबंधी बिंब
  choice: अग्नि-सा लाल
  alternative: लाल
  rationale: यह शब्द केवल सामान्य लाल रंग नहीं, ज्वाला-जैसे लाल रंग का संकेत देता है; चुना हुआ रूप उसकी सजीवता बनाए रखता है।
- issue: οὐρανός का स्थानगत अर्थ
  choice: स्वर्ग
  alternative: आकाश
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं, किंतु प्रकाशितवाक्य के स्वर्गीय दर्शन में ‘स्वर्ग’ अधिक संभावित है; अनुवाद इससे आगे कोई स्थान-सिद्धांत नहीं जोड़ता।
- issue: διάδημα और सामान्य मुकुट का भेद
  choice: राजमुकुट
  alternative: मुकुट
  rationale: राजकीय अधिकार का संकेत देने वाला विशिष्ट शब्द चुना गया है, जबकि उसके दावे की वैधता या धार्मिक अर्थ की व्याख्या नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य की वर्णनात्मक गति को हिन्दी में स्वाभाविक बनाने के लिए ‘जिसके… थे’ का प्रयोग किया गया है। ‘देखो’ दर्शन की आकस्मिकता और जोर को बनाए रखता है।
