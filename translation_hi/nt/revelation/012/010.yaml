id: REV.12.10
reference: Revelation 12:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνὴν μεγάλην ἐν τῷ οὐρανῷ λέγουσαν· Ἄρτι ἐγένετο ἡ σωτηρία καὶ ἡ δύναμις καὶ ἡ βασιλεία τοῦ θεοῦ ἡμῶν καὶ ἡ ἐξουσία τοῦ χριστοῦ αὐτοῦ, ὅτι ἐβλήθη ὁ ⸀κατήγωρ τῶν ἀδελφῶν ἡμῶν, ὁ κατηγορῶν ⸀αὐτοὺς ἐνώπιον τοῦ θεοῦ ἡμῶν ἡμέρας καὶ νυκτός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/012/010.yaml
  text: And I heard a loud voice in heaven saying[a], “Now have come the salvation and the power and the kingdom of our God, and the authority of his Messiah, because the accuser of our brothers has been thrown down[b], the one who accuses them before our God day and night.”
translation:
  language: hi
  text: 'और मैंने स्वर्ग में एक ऊँची आवाज़ सुनी, जो कह रही थी: “अब हमारे परमेश्वर का उद्धार, सामर्थ्य और राज्य तथा उसके मसीह[a] का अधिकार आ पहुँचे हैं, क्योंकि हमारे भाइयों[b] पर आरोप लगानेवाला नीचे फेंक दिया गया है—वही जो दिन-रात हमारे परमेश्वर के सामने उन पर आरोप लगाता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ख्रीस्त।” यूनानी Χριστός (ख्रिस्तोस) यहाँ एक उपाधि है, जिसका अर्थ परमेश्वर का अभिषिक्त व्यक्ति है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “भाइयों” से सभी सहविश्वासी अभिप्रेत हो सकते हैं, जिनमें स्त्रियाँ भी सम्मिलित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: φωνὴν μεγάλην
  choice: एक ऊँची आवाज़
  rationale: यह पदबंध आवाज़ की तीव्रता बताता है; आधुनिक हिन्दी में ‘ऊँची आवाज़’ स्वाभाविक है।
- source_word: Ἄρτι ἐγένετο
  choice: अब ... आ पहुँचा है
  rationale: Ἄρτι निर्णायक वर्तमान क्षण और ἐγένετο घटना के घटित होने या आ जाने को व्यक्त करता है। हिन्दी में संयुक्त सूची के बाद एकवचन ‘आ पहुँचा है’ यूनानी के एकवचन क्रियापद और पूरी घोषणा को एक समग्र घटना मानने—दोनों को बनाए रखता है।
- source_word: ἡ σωτηρία
  choice: उद्धार
  rationale: यह परमेश्वर द्वारा दी गई निर्णायक मुक्ति के लिए प्रचलित, स्पष्ट और सन्दर्भानुकूल शब्द है।
- source_word: ἡ δύναμις
  choice: सामर्थ्य
  rationale: यह परमेश्वर की प्रभावकारी शक्ति को व्यक्त करता है और आगे आए ἐξουσία ‘अधिकार’ से भेद बनाए रखता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ ἡμῶν
  choice: हमारे परमेश्वर का ... राज्य
  rationale: βασιλεία में राजकीय शासन और राज्य दोनों का भाव है; ‘राज्य’ प्रकाशितवाक्य की राजकीय और अपोकैलिप्टिक भाषा को सहज हिन्दी में बनाए रखता है।
- source_word: ἡ ἐξουσία
  choice: अधिकार
  rationale: यह केवल शक्ति नहीं, बल्कि शासन करने के वैध अधिकार को व्यक्त करता है।
- source_word: τοῦ χριστοῦ αὐτοῦ
  choice: उसके मसीह
  rationale: Χριστός यहाँ परमेश्वर के अभिषिक्त शासक की उपाधि है; ‘मसीह’ उसके अर्थ और यहूदी-मसीही पृष्ठभूमि को सुरक्षित रखता है।
- source_word: ὁ κατήγωρ
  choice: दोष लगानेवाला
  rationale: दुर्लभ संज्ञा का आशय आरोप लगानेवाला है; यह हिन्दी रूप न्यायिक भाव को स्पष्ट और सहज रखता है।
- source_word: ἐβλήθη
  choice: नीचे फेंक दिया गया है
  rationale: निष्क्रिय क्रिया बलपूर्वक नीचे गिराए या निकाल दिए जाने का चित्र देती है और अध्याय के निकटवर्ती सन्दर्भ से मेल खाती है।
- source_word: ὁ κατηγορῶν αὐτοὺς
  choice: वही जो ... उन पर दोष लगाता है
  rationale: वर्तमान कृदन्त आरोप लगानेवाले की पहचानी हुई, निरन्तर गतिविधि बताता है; ‘वही जो’ उसके व्याख्यात्मक सम्बन्ध को स्पष्ट करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द व्यक्तिगत नाम की तरह नहीं, परमेश्वर के अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उपाधि का अर्थ अधिक सीधे व्यक्त करता है।
- issue: ἀδελφῶν का लैंगिक दायरा
  choice: भाइयों
  alternative: भाइयों और बहनों
  rationale: मुख्य पाठ यूनानी पुल्लिंग बहुवचन के औपचारिक रूप को रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यह विश्वासी समुदाय की स्त्रियों को भी सम्मिलित कर सकता है।
- issue: ἐγένετο और संयुक्त कर्ता की वचन-संगति
  choice: आ पहुँचा है
  alternative: आ पहुँचे हैं
  rationale: यूनानी क्रिया एकवचन है, यद्यपि उसके बाद कई संज्ञाएँ आती हैं। हिन्दी एकवचन पूरी सूची को एक संयुक्त, निर्णायक वास्तविकता के रूप में प्रस्तुत करते हुए स्रोत की व्याकरणिक विशेषता को बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। ‘सामर्थ्य’ और ‘अधिकार’ के बीच स्रोत का अर्थभेद सुरक्षित है। अलंकारिक सूची और आरोप लगानेवाले की न्यायिक छवि को यथासम्भव बनाए रखा गया है।
