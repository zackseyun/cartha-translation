id: REV.4.6
reference: Revelation 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐνώπιον τοῦ θρόνου ὡς θάλασσα ὑαλίνη ὁμοία κρυστάλλῳ. Καὶ ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου τέσσαρα ζῷα γέμοντα ὀφθαλμῶν ἔμπροσθεν καὶ ὄπισθεν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/006.yaml
  text: And before the throne was something like a sea of glass[a], like crystal. And in the midst of the throne and around the throne were four living creatures[c][b], full of eyes in front and behind.
translation:
  language: hi
  text: और सिंहासन के सामने मानो काँच का समुद्र था[a], जो स्फटिक के समान था। और सिंहासन के बीच में और सिंहासन के चारों ओर चार जीवित प्राणी[b][c] थे, जो आगे और पीछे आँखों से भरे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “काँच-जैसा समुद्र।” यूनानी में तुलना है: “मानो काँच का समुद्र।”'
    reason: lexical_alternative
  - marker: b
    text: या “चार जीवित जन।” यहाँ का यूनानी शब्द प्रकाशितवाक्य में आगे आने वाले विरोधी “पशुओं” के लिए प्रयुक्त शब्द नहीं है।
    reason: lexical_alternative
  - marker: c
    text: “सिंहासन के बीच में और सिंहासन के चारों ओर” स्थान की दृष्टि से कठिन वाक्यांश है। यह संभवतः दर्शन के परिप्रेक्ष्य को दर्शाता है, इसलिए इसे मूल के निकट रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह सिंहासन के साथ स्थान-संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὡς
  choice: मानो
  rationale: यह प्रत्यक्ष समानता नहीं, बल्कि दर्शन में दिखाई देने वाली तुलना या सादृश्य को बनाए रखता है।
- source_word: θάλασσα ὑαλίνη
  choice: काँच का समुद्र
  rationale: यह मूल संज्ञा-विशेषण चित्र को स्पष्ट और संक्षिप्त रूप में रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὁμοία κρυστάλλῳ
  choice: जो स्फटिक के समान था
  rationale: यह दूसरी तुलना को स्पष्ट रखता है और काँच के समुद्र की स्फटिक-सदृश प्रकृति बताता है।
- source_word: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου
  choice: सिंहासन के बीच में और सिंहासन के चारों ओर
  rationale: मूल यूनानी का स्थान-संबंध कठिन है; यह अनुवाद उसे किसी एक ज्यामितीय व्याख्या में समतल किए बिना निकटता से सुरक्षित रखता है।
- source_word: ζῷα
  choice: जीवित प्राणी
  rationale: यह सजीव स्वर्गीय प्राणियों का अर्थ देता है और प्रकाशितवाक्य में आगे आने वाले विरोधी ‘पशु’ से अनावश्यक भ्रम नहीं पैदा करता।
- source_word: γέμοντα ὀφθαλμῶν
  choice: आँखों से भरे हुए
  rationale: यह मूल अभिव्यक्ति का निकट और हिन्दी में बोधगम्य रूप है।
- source_word: ἔμπροσθεν καὶ ὄπισθεν
  choice: आगे और पीछे
  rationale: यह प्राणियों की आँखों के स्थान को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: स्वर्गीय सिंहासन-दर्शन में ζῷα का अनुवाद
  choice: जीवित प्राणी
  alternative: जीवित जन; पशु
  rationale: ‘जीवित प्राणी’ यहेजकेल-सदृश सिंहासन-दर्शन के सजीव प्राणियों को व्यक्त करता है और बाद के विरोधी पशुओं का भाव यहाँ आरोपित नहीं करता।
- issue: ἐν μέσῳ τοῦ θρόνου καὶ κύκλῳ τοῦ θρόνου में स्थान-संबंधी तनाव
  choice: ‘सिंहासन के बीच में और सिंहासन के चारों ओर’ को बनाए रखना
  alternative: ‘सिंहासन के केंद्र के चारों ओर’ कहकर स्थान-चित्र को सरल बनाना
  rationale: यूनानी वाक्यांश दर्शनात्मक दृष्टिकोण से कठिन है। किसी निश्चित स्थान-व्यवस्था को आरोपित करने के बजाय मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। ‘मानो’ दर्शन की तुलनात्मक प्रकृति को और ‘स्फटिक’ दृश्य की चमक व पारदर्शिता को सुरक्षित रखता है। कठिन स्थान-वर्णन को जानबूझकर सरल नहीं किया गया।
