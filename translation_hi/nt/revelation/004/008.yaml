source:
  edition: SBLGNT
  text: καὶ τὰ τέσσαρα ζῷα, ἓν ⸂καθ’ ἓν⸃ ⸀αὐτῶν ⸀ἔχων ἀνὰ πτέρυγας ἕξ, κυκλόθεν καὶ ἔσωθεν γέμουσιν ὀφθαλμῶν· καὶ ἀνάπαυσιν οὐκ ἔχουσιν ἡμέρας καὶ νυκτὸς λέγοντες· Ἅγιος ἅγιος ἅγιος κύριος, ὁ θεός, ὁ παντοκράτωρ, ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/008.yaml
  text: 'And the four living creatures[a], each one of them having six wings, are full of eyes all around and within; and they have no rest day and night, saying: “Holy, holy, holy is the Lord God, the Almighty, who was and who is and who is coming.”'
translation:
  language: hi
  text: 'और चारों जीवित प्राणियों में से हर एक के छह पंख हैं। वे चारों ओर और भीतर आँखों से भरे हुए हैं; और वे दिन-रात यह कहते हुए विश्राम नहीं लेते: “पवित्र, पवित्र, पवित्र है प्रभु परमेश्वर, सर्वशक्तिमान, जो था, जो है और जो आ रहा है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक परंपरागत रूप में, “जो था, जो है और जो आने वाला है।”
    reason: ὁ ἐρχόμενος के गतिशील वर्तमान-कृदंत रूप और उसके प्रचलित भविष्यवाचक अनुवाद—दोनों को सामने रखना।
lexical_decisions:
- source_word: ζῷα
  choice: जीवित प्राणी
  rationale: यहाँ शब्द स्वर्गीय सजीव प्राणियों के लिए है, साधारण पशुओं के लिए नहीं। ‘जीवित प्राणी’ दर्शनीय चित्र और अर्थ-भेद दोनों बनाए रखता है।
- source_word: ἓν καθ’ ἓν αὐτῶν
  choice: उनमें से हर एक
  rationale: यह वितरणात्मक अभिव्यक्ति चारों में से प्रत्येक प्राणी पर अलग-अलग बल देती है।
- source_word: ἔχων ἀνὰ πτέρυγας ἕξ
  choice: हर एक के छह पंख हैं
  rationale: यूनानी वाक्यांश बताता है कि प्रत्येक प्राणी के अपने छह पंख हैं; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: κυκλόθεν καὶ ἔσωθεν
  choice: चारों ओर और भीतर
  rationale: दोनों स्थानवाचक पक्षों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: γέμουσιν ὀφθαλμῶν
  choice: आँखों से भरे हैं
  rationale: γέμω के मूल अर्थ ‘से भरा होना’ और प्रकाशन के सजीव दर्शनीय चित्र को सीधे व्यक्त करता है।
- source_word: ἀνάπαυσιν οὐκ ἔχουσιν
  choice: विश्राम नहीं लेते
  rationale: ‘विश्राम’ मूल संज्ञा का सीधा अर्थ रखता है और वाणी के केवल न रुकने तक अर्थ को सीमित नहीं करता।
- source_word: ἡμέρας καὶ νυκτός
  choice: दिन-रात
  rationale: निरंतरता व्यक्त करने वाला संक्षिप्त और स्वाभाविक आधुनिक हिंदी प्रयोग है।
- source_word: λέγοντες
  choice: कहते रहते हैं
  rationale: पूर्ववर्ती ‘विश्राम नहीं लेते’ के साथ चल रही निरंतर उद्घोषणा को हिंदी में स्वाभाविक रूप से व्यक्त करता है, बिना ‘चिल्लाते’ जैसी अतिरिक्त तीव्रता जोड़े।
- source_word: Ἅγιος ἅγιος ἅγιος
  choice: पवित्र, पवित्र, पवित्र
  rationale: आराधनात्मक और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण तिहरी पुनरावृत्ति यथावत रखी गई है।
- source_word: κύριος, ὁ θεός
  choice: प्रभु परमेश्वर
  rationale: दोनों ईश्वरीय पदवियों का प्रतिष्ठित, स्वाभाविक और स्पष्ट हिंदी रूप।
- source_word: ὁ παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: यह सर्वाधिकार और समस्त सामर्थ्य रखने वाले परमेश्वर की उपाधि का प्रचलित तथा अर्थपूर्ण हिंदी समतुल्य है।
- source_word: ὁ ἐρχόμενος
  choice: जो आ रहा है
  rationale: वर्तमान कृदंत की गतिशील और आगमनशील धारणा को सुरक्षित रखता है, उसे केवल सामान्य भविष्यवाचक कथन में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय काल-सूत्र ὁ ἦν καὶ ὁ ὢν καὶ ὁ ἐρχόμενος का अनुवाद
  choice: जो था, जो है और जो आ रहा है
  alternative: जो था, जो है और जो आने वाला है
  rationale: अंतिम पद यूनानी में वर्तमान कृदंत है। ‘जो आ रहा है’ उसके गतिशील पक्ष और प्रकाशन में आगमन की निकटता को अधिक सीधे रखता है; अधिक परंपरागत भविष्यवाचक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। प्रकाशन के दर्शनीय बिंब, तिहरी पुनरावृत्ति और ईश्वरीय उपाधियाँ बिना व्याख्यात्मक विस्तार के सुरक्षित हैं।
