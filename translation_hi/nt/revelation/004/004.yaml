id: REV.4.4
reference: Revelation 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κυκλόθεν τοῦ θρόνου ⸀θρόνοι εἴκοσι τέσσαρες, καὶ ἐπὶ τοὺς ⸀θρόνους εἴκοσι τέσσαρας πρεσβυτέρους καθημένους περιβεβλημένους ⸀ἐν ἱματίοις λευκοῖς, καὶ ἐπὶ τὰς κεφαλὰς αὐτῶν στεφάνους χρυσοῦς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/004.yaml
  text: And around the throne were twenty-four thrones[a], and on the thrones were seated twenty-four elders, clothed in white garments, and on their heads were golden crowns.
translation:
  language: hi
  text: और सिंहासन के चारों ओर चौबीस सिंहासन थे। उन सिंहासनों पर चौबीस प्राचीन बैठे हुए थे; वे श्वेत वस्त्र पहने हुए थे, और उनके सिरों पर सोने के मुकुट[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोने की विजय-मालाएँ”; यूनानी शब्द सम्मान या विजय के पुरस्कार के रूप में दी जाने वाली माला अथवा मुकुट को भी दर्शा सकता है, केवल राजकीय किरीट को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: κυκλόθεν
  choice: चारों ओर
  rationale: यह सिंहासन को घेरे हुए स्थानिक व्यवस्था को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: θρόνοι
  choice: सिंहासन
  rationale: मूल यूनानी में केंद्रीय सिंहासन और आसपास के चौबीस आसनों के लिए एक ही शब्द θρόνος आया है; इसलिए राजकीय और न्यायिक बिंब तथा शब्दगत संबंध बनाए रखा गया है।
- source_word: εἴκοσι τέσσαρες
  choice: चौबीस
  rationale: संख्या का मानक हिन्दी रूप।
- source_word: πρεσβυτέρους
  choice: प्राचीन
  rationale: प्रकाशितवाक्य में यह एक विशिष्ट समूह की पदवी है। ‘प्राचीन’ स्थापित बाइबलीय पद है और उनकी पहचान के विषय में कोई अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: καθημένους
  choice: बैठे हुए थे
  rationale: कृदंत रचना को दर्शन-वर्णन के अनुरूप स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है।
- source_word: περιβεβλημένους ἐν ἱματίοις λευκοῖς
  choice: श्वेत वस्त्र पहने हुए थे
  rationale: यह उनके वस्त्रधारी होने की स्थायी दृश्य-अवस्था को व्यक्त करता है; ‘वस्त्र’ ἱμάτια को किसी विशेष प्रकार के चोगे तक सीमित नहीं करता।
- source_word: στεφάνους χρυσοῦς
  choice: सोने के मुकुट
  rationale: यह स्पष्ट, स्वाभाविक हिन्दी है। στέφανος में सम्मान या विजय की माला का भाव भी हो सकता है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: आसपास के चौबीस θρόνοι का स्वरूप
  choice: ‘सिंहासन’ रखा गया है।
  alternative: ‘आसन’ या ‘बैठने के स्थान’
  rationale: यूनानी पाठ केंद्रीय सिंहासन और चौबीस अन्य सिंहासनों के लिए वही शब्द दोहराता है। इसे बनाए रखने से राजकीय/न्यायिक बिंब सुरक्षित रहता है, पर केंद्रीय सिंहासन और अन्य सिंहासनों की समान प्रभुता का निष्कर्ष नहीं जोड़ा जाता।
- issue: चौबीस प्राचीनों की पहचान
  choice: केवल ‘प्राचीन’ कहा गया है।
  alternative: कलीसिया के प्रतिनिधि, स्वर्गदूत प्राणी, अथवा इस्राएल और प्रेरितों के प्रतिनिधि
  rationale: पद उन्हें πρεσβύτεροι कहता है, लेकिन उनकी पहचान स्पष्ट नहीं करता; इसलिए किसी विशेष धर्मवैज्ञानिक व्याख्या को पाठ में नहीं जोड़ा गया।
- issue: στεφάνους का आशय
  choice: मुख्य पाठ में ‘मुकुट’, पाद-टिप्पणी में ‘विजय-मालाएँ’ का विकल्प
  alternative: मुख्य पाठ में केवल ‘विजय-मालाएँ’
  rationale: सिंहासन-कक्ष के दृश्य में ‘मुकुट’ सहज है, जबकि पाद-टिप्पणी यूनानी शब्द के सम्मान अथवा विजय से जुड़े संभावित अर्थ को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘श्वेत वस्त्र’ ऊँचे किंतु सहज रजिस्टर को बनाए रखता है। लंबे यूनानी कृदंत-क्रम को पठनीय हिन्दी के लिए दो वाक्यों में बाँटा गया है, बिना दृश्य के संबंधों को बदले। पाद-टिप्पणी का चिह्न संबंधित शब्द ‘मुकुट’ पर रखा गया है।
