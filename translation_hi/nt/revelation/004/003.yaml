id: REV.4.3
reference: Revelation 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ ὁ καθήμενος⸃ ὅμοιος ὁράσει λίθῳ ἰάσπιδι καὶ σαρδίῳ, καὶ ἶρις κυκλόθεν τοῦ θρόνου ⸂ὅμοιος ὁράσει σμαραγδίνῳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/003.yaml
  text: And the one seated there was in appearance like jasper and sardius stone[b][a], and around the throne was a rainbow in appearance like emerald.
translation:
  language: hi
  text: और जो उस पर बैठा था, वह देखने में यशब और लाल अकीक[a] के समान था। सिंहासन के चारों ओर एक इंद्रधनुष[b] था, जो देखने में पन्ने के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सरदियुस”; यह लाल अकीक (कार्नेलियन) रत्न का पारंपरिक नाम है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रभामंडल”; यूनानी शब्द इंद्रधनुष-जैसी, चारों ओर फैली दीप्ति को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ καθήμενος
  choice: जो उस पर बैठा था
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदंत सिंहासन पर विराजमान व्यक्ति की ओर संकेत करता है। पिछले पद के सिंहासन को ‘उस पर’ से स्वाभाविक रूप से ग्रहण किया गया है; बैठने की जारी अवस्था भी बनी रहती है।
- source_word: ὅμοιος ὁράσει
  choice: देखने में ... के समान
  rationale: ὁράσει रूप-रंग या दृश्य स्वरूप के क्षेत्र को बताता है। यह अनुवाद वास्तविक पदार्थ की पहचान करने के बजाय दर्शनीय समानता को सुरक्षित रखता है।
- source_word: λίθῳ ἰάσπιδι
  choice: यशब
  rationale: ‘यशब’ ἴασπις का प्रचलित हिन्दी रत्न-नाम है और दर्शन में वर्णित बहुमूल्य पत्थर को सूचित करता है। वाक्य में ‘लाल अकीक’ के साथ होने से रत्न होने का अर्थ स्पष्ट रहता है।
- source_word: σαρδίῳ
  choice: लाल अकीक
  rationale: σαρδίον सामान्यतः लाल-भूरे कार्नेलियन रत्न को सूचित करता है। ‘लाल अकीक’ आधुनिक हिन्दी पाठक के लिए पारदर्शी है; पारंपरिक लिप्यंतरण ‘सरदियुस’ को पादटिप्पणी में रखा गया है।
- source_word: ἶρις
  choice: मेघधनुष
  rationale: इस दर्शनीय प्रसंग में ἶρις का प्राथमिक अर्थ इंद्रधनुष-जैसी दीप्ति है। ‘मेघधनुष’ गरिमापूर्ण और सहज हिन्दी है; चारों ओर फैली प्रभा की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: κυκλόθεν τοῦ θρόνου
  choice: सिंहासन के चारों ओर
  rationale: κυκλόθεν सिंहासन को चारों तरफ से घेरे हुए स्थान या विस्तार को व्यक्त करता है।
- source_word: ὅμοιος ὁράσει σμαραγδίνῳ
  choice: जो देखने में पन्ने के समान था
  rationale: यह पुनः दृश्य समानता बताता है, न कि यह कि मेघधनुष सचमुच पन्ने से बना था। ‘पन्ना’ σμαράγδινος का स्वाभाविक आधुनिक हिन्दी समतुल्य है।
theological_decisions:
- issue: सिंहासन पर बैठे हुए के स्वरूप का उपमा द्वारा वर्णन
  choice: दोनों स्थानों पर दृश्य समानता की भाषा—‘देखने में ... के समान’—बनाए रखना
  alternative: बैठे हुए को रत्नों से बना हुआ या रत्नों के रंग का स्पष्ट रूप से कहना
  rationale: यूनानी पाठ ὅμοιος ὁράσει के द्वारा दर्शनीय समानता बताता है। इसे पदार्थ, निश्चित रंग या प्रकाश के किसी एक अर्थ में बदलना दर्शन की जानबूझकर रखी गई अप्रत्यक्षता और दिव्य अतीन्द्रियता को अनावश्यक रूप से सीमित करेगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘विराजमान’ के बजाय ‘बैठा था’ मूल कृदंत के निकट और सामान्य पाठक के लिए स्पष्ट है। ‘लाल अकीक’ अपारदर्शी पारंपरिक नाम की अपेक्षा पहचाने जाने योग्य है, जबकि पादटिप्पणी पारंपरिक विकल्प सुरक्षित रखती है।
