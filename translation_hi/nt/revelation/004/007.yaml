source:
  edition: SBLGNT
  text: καὶ τὸ ζῷον τὸ πρῶτον ὅμοιον λέοντι, καὶ τὸ δεύτερον ζῷον ὅμοιον μόσχῳ, καὶ τὸ τρίτον ζῷον ⸀ἔχων ⸂τὸ πρόσωπον ὡς⸃ ἀνθρώπου, καὶ τὸ τέταρτον ζῷον ὅμοιον ἀετῷ πετομένῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/007.yaml
  text: And the first living creature was like a lion, and the second living creature like a calf, and the third living creature had a face like a man, and the fourth living creature was like an eagle in flight.
translation:
  language: hi
  text: और पहला जीवित प्राणी सिंह के समान था, दूसरा जीवित प्राणी बछड़े के समान, तीसरे जीवित प्राणी का मनुष्य-जैसा चेहरा था,[a] और चौथा जीवित प्राणी उड़ते हुए उकाब के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानवीय चेहरा।” यूनानी में शाब्दिक रूप से “मनुष्य के समान चेहरा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζῷον
  choice: जीवित प्राणी
  rationale: यह सिंहासन-कक्ष के सजीव प्राणियों के लिए स्वाभाविक है और प्रकाशितवाक्य में आगे आने वाले विरोधी ‘पशु’ (θηρίον) से भेद बनाए रखता है।
- source_word: ὅμοιον
  choice: के समान
  rationale: यह पहचान नहीं, समानता व्यक्त करता है; सभी संबंधित उपवाक्यों में समानता का भाव सुरक्षित रखा गया है।
- source_word: λέοντι
  choice: सिंह
  rationale: ὅμοιον के बाद प्रयुक्त पशु-संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: μόσχῳ
  choice: बछड़ा
  rationale: μόσχος सामान्यतः बछड़े या कम उम्र के गोवंश को दर्शाता है; ‘बछड़ा’ आयु-संबंधी भाव को ‘बैल’ से अधिक स्पष्ट रूप से बनाए रखता है।
- source_word: ἔχων τὸ πρόσωπον ὡς ἀνθρώπου
  choice: का चेहरा मनुष्य के चेहरे जैसा था
  rationale: कृदंत को पठनीय हिन्दी में सीमित क्रिया से व्यक्त किया गया है। ὡς की तुलनात्मक शक्ति बनाए रखते हुए अस्पष्ट या अस्वाभाविक ‘मनुष्य जैसा चेहरा’ से बचने के लिए तुलना को स्पष्ट किया गया है।
- source_word: ἀετῷ πετομένῳ
  choice: उड़ते हुए उकाब
  rationale: πετομένῳ को सीधे वर्तमान क्रियात्मक वर्णन के रूप में रखा गया है; ‘उकाब’ बाइबलीय और आधुनिक मानक हिन्दी में eagle का उपयुक्त शब्द है।
theological_decisions:
- issue: तीसरे जीवित प्राणी के चेहरे में ἀνθρώπου का निरूपण
  choice: मनुष्य के चेहरे जैसा
  alternative: मानवीय चेहरा
  rationale: ἀνθρώπου सामान्य मानव को सूचित कर सकता है, पर मूल में संज्ञा और ὡς द्वारा स्पष्ट तुलना है। चुना हुआ रूप तुलना को सुरक्षित रखता है और किसी विशेष लिंग-संबंधी धार्मिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। समन्वित वाक्य-विन्यास मूल यूनानी की चार क्रमिक छवियों को बनाए रखता है; दोहराव को इतना रखा गया है कि दर्शन की लय और प्रत्येक जीवित प्राणी की अलग पहचान स्पष्ट रहे।
