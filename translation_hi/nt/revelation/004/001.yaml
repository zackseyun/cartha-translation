source:
  edition: SBLGNT
  text: Μετὰ ταῦτα εἶδον, καὶ ἰδοὺ θύρα ἠνεῳγμένη ἐν τῷ οὐρανῷ, καὶ ἡ φωνὴ ἡ πρώτη ἣν ἤκουσα ὡς σάλπιγγος λαλούσης μετ’ ἐμοῦ, λέγων· Ἀνάβα ὧδε, καὶ δείξω σοι ἃ δεῖ γενέσθαι. μετὰ ταῦτα
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/001.yaml
  text: After these things I looked[a], and behold, a door standing open in heaven, and the first voice that I had heard, like a trumpet speaking with me, said, “Come up here[c][b], and I will show you what must take place after these things.”
translation:
  language: hi
  text: इन बातों के बाद मैंने देखा[a], और देखो, स्वर्ग में एक द्वार खुला हुआ था। और वह पहली आवाज़[b], जिसे मैंने तुरही के समान मेरे साथ बोलते सुना था[c], बोली, “यहाँ ऊपर आओ, और मैं तुम्हें वे बातें दिखाऊँगा जिनका इन बातों के बाद होना अवश्य है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार अनुवाद हो सकता है: “इसके बाद ... इसके बाद।” यूनानी में बहुवचन पदबंध “इन बातों के बाद” पद के आरंभ और अंत, दोनों जगह दोहराया गया है।'
    reason: lexical_alternative
  - marker: b
    text: “पहली आवाज़” संभवतः उस आवाज़ की ओर संकेत करती है जिसे यूहन्ना ने पहले सुना था (देखें प्रकाशितवाक्य 1:10)।
    reason: cross_reference
  - marker: c
    text: या “मुझसे बोलते सुना था।” यूनानी में अधिक शाब्दिक अर्थ “मेरे साथ बोलते” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ ταῦτα
  choice: इन बातों के बाद
  rationale: दोनों स्थानों पर यूनानी बहुवचन पदबंध को इसी रूप में दोहराया गया है, ताकि उसकी शब्दगत पुनरावृत्ति और काल-सूचकता बनी रहे।
- source_word: εἶδον
  choice: मैंने देखा
  rationale: यह ὁράω का सीधा और स्वाभाविक हिन्दी रूप है; इसके बाद आने वाला ‘देखो’ दृश्य की ओर अचानक ध्यान खींचता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: दर्शन में अचानक सामने आए दृश्य की ओर ध्यान दिलाने वाले उद्गार को सरल किंतु गरिमापूर्ण हिन्दी में रखा गया है।
- source_word: θύρα ἠνεῳγμένη
  choice: एक द्वार खुला हुआ था
  rationale: पूर्ण निष्क्रिय कृदंत पहले खोले जाने के परिणामस्वरूप बनी वर्तमान खुली अवस्था को व्यक्त करता है; ‘खुला हुआ था’ हिन्दी में उस अवस्था को स्वाभाविक रूप से बताता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: प्रकाशितवाक्य के इस दर्शन में आशय आकाश से नहीं, स्वर्गीय लोक से है।
- source_word: ἡ φωνὴ ἡ πρώτη
  choice: वह पहली आवाज़
  rationale: प्रथम होने का विशेषण सुरक्षित रखा गया है और ‘वह’ पिछली सुनी हुई आवाज़ की ओर संकेत करने में सहायक है, बिना उस संबंध को निर्णायक रूप से समझाए।
- source_word: ὡς σάλπιγγος
  choice: तुरही के समान
  rationale: यह समानता है, पहचान नहीं; ‘के समान’ इस भेद को स्पष्ट रखता है और दर्शनीय शैली के अनुकूल है।
- source_word: λαλούσης μετ’ ἐμοῦ
  choice: अपने साथ बोलते सुना था
  rationale: μετά के ‘साथ’ वाले अर्थ को सुरक्षित रखा गया है। हिन्दी में ‘अपने साथ बोलते’ प्रसंगानुसार बोधगम्य है, जबकि अधिक मुहावरेदार ‘मुझसे बोलते’ वैकल्पिक पाठ के रूप में पादटिप्पणी में दिया गया है।
- source_word: Ἀνάβα ὧδε
  choice: यहाँ ऊपर आओ
  rationale: वक्ता के स्वर्गीय स्थान की ओर ऊपर आने के आदेश को आधुनिक, स्वाभाविक और सम्मानसूचक हिन्दी में व्यक्त किया गया है।
- source_word: ἃ δεῖ γενέσθαι
  choice: वे बातें ... जिनका ... होना अवश्य है
  rationale: δεῖ की आवश्यकता या अनिवार्यता को ‘अवश्य’ से व्यक्त किया गया है, केवल भावी घटना के रूप में नहीं।
theological_decisions:
- issue: दोहराए गए μετὰ ταῦτα का काल-संबंध
  choice: आरंभ और अंत दोनों में ‘इन बातों के बाद’
  alternative: ‘इसके बाद’ या ‘फिर’
  rationale: यूनानी पाठ दोनों स्थानों पर एक ही बहुवचन पदबंध दोहराता है। उसी पुनरावृत्ति को बनाए रखने से साहित्यिक, दर्शनीय या उद्धार-ऐतिहासिक क्रम में से किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं किया जाता।
- issue: ‘पहली आवाज़’ की पहचान
  choice: मूल विशेषण को रखते हुए ‘वह पहली आवाज़’
  alternative: ‘वही आवाज़ जिसे मैंने पहले सुना था’
  rationale: संभावना है कि यह प्रकाशितवाक्य 1:10 की आवाज़ की ओर संकेत करती है, पर अधिक व्याख्यात्मक रूप मूल की ‘पहली आवाज़’ संरचना को मिटा देता। पादटिप्पणी संबंध बताती है, मुख्य पाठ उसे सिद्ध मानकर नहीं चलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण दर्शनीय शैली रखी गई है। ‘द्वार’, ‘स्वर्ग’ और ‘तुरही’ जैसे प्रचलित बाइबलीय शब्द सामान्य पाठक के लिए बोधगम्य हैं। संबोधन में आधुनिक सम्मानसूचक बहुवचन ‘आओ/तुम्हें’ अपनाया गया है; इससे यूनानी एकवचन आदेश का संबोधित व्यक्ति नहीं बदलता। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के तुरंत बाद रखे गए हैं।
