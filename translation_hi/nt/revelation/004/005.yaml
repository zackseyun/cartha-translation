  text: καὶ ἐκ τοῦ θρόνου ἐκπορεύονται ἀστραπαὶ καὶ φωναὶ καὶ βρονταί· καὶ ἑπτὰ λαμπάδες πυρὸς καιόμεναι ἐνώπιον τοῦ θρόνου, ⸀ἅ εἰσιν ⸀τὰ ἑπτὰ πνεύματα τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/005.yaml
  text: And from the throne come flashes of lightning and sounds and peals of thunder[a]; and before the throne were seven lamps of fire burning[c][b], which are the seven spirits of God.
translation:
  language: hi
  text: और सिंहासन से बिजली की चमकें, ध्वनियाँ और गर्जनाएँ निकलती हैं[a]; और सिंहासन के सामने आग की सात मशालें जल रही हैं[b]—ये परमेश्वर की सात आत्माएँ हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आवाज़ें’।
    reason: lexical_alternative
  - marker: b
    text: या ‘आग के सात दीपक जल रहे हैं’।
    reason: lexical_alternative
  - marker: c
    text: बहुत-से लोग ‘परमेश्वर की सात आत्माएँ’ को एक ही पवित्र आत्मा की परिपूर्णता का प्रतीक मानते हैं; यूनानी पाठ में शब्दशः ‘सात आत्माएँ’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκπορεύονται
  choice: निकलती हैं
  rationale: ἐκ के साथ यह वर्तमानकालीन क्रिया सिंहासन से इन घटनाओं के निकलने को व्यक्त करती है; हिन्दी में ‘निकलती हैं’ स्वाभाविक और सटीक है।
- source_word: ἀστραπαὶ
  choice: बिजलियाँ
  rationale: बहुवचन रूप बार-बार चमकती बिजली की घटनाओं को दर्शाता है; ‘बिजलियाँ’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: φωναὶ
  choice: ध्वनियाँ
  rationale: φωνή का अर्थ ‘आवाज़ें’ या सामान्यतः ‘ध्वनियाँ’ हो सकता है। बिजली और गर्जनाओं के इस क्रम में ‘ध्वनियाँ’ व्यक्ति-वाणी का संकेत दिए बिना व्यापक अर्थ बनाए रखता है।
- source_word: βρονταί
  choice: बादलों की गर्जनाएँ
  rationale: बहुवचन βρονταί बार-बार होने वाली गरज को व्यक्त करता है; यह पदबंध हिन्दी में स्पष्ट करता है कि यहाँ मेघगर्जन अभिप्रेत है।
- source_word: λαμπάδες πυρὸς
  choice: आग की सात मशालें
  rationale: λαμπάς प्रायः जलती मशाल को दर्शाता है और πυρός का संबंध ‘आग की’ के रूप में प्रत्यक्ष रखा गया है। ‘मशालें’ दृश्य की ज्वलंतता और शब्द के सामान्य यूनानी अर्थ को सुरक्षित रखता है।
- source_word: καιόμεναι
  choice: जल रही थीं
  rationale: वर्तमान कृदंत निरंतर जलने की अवस्था बताता है; मुख्य दृश्य-वर्णन के हिन्दी काल-सामंजस्य में ‘जल रही थीं’ स्वाभाविक है।
- source_word: ἐνώπιον τοῦ θρόνου
  choice: सिंहासन के सामने
  rationale: यह स्थान-सूचक वाक्यांश का सीधा, सहज हिन्दी रूप है।
- source_word: ἅ εἰσιν
  choice: ये ... हैं
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम पूर्वोक्त सात मशालों की प्रतीकात्मक पहचान कराता है; हिन्दी में ‘ये ... हैं’ अधिक स्वाभाविक है।
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: परमेश्वर की सात आत्माएँ
  rationale: यूनानी पाठ में ‘सात’ और ‘आत्माएँ’ दोनों स्पष्ट रूप से बहुवचन अर्थ देते हैं; अनुवाद इसी रूप को बनाए रखता है।
theological_decisions:
- issue: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ की व्याख्या
  choice: मुख्य पाठ में ‘परमेश्वर की सात आत्माएँ’
  alternative: ‘परमेश्वर का सातगुना आत्मा’ अथवा एक पवित्र आत्मा की पूर्णता का प्रतीक
  rationale: यूनानी पाठ स्पष्टतः बहुवचन ‘सात आत्माएँ’ कहता है। एकवचन या ‘सातगुना’ करना व्याख्या को अनुवाद में मिला देगा; इसलिए मुख्य पाठ मूल की धार्मिक और प्रतीकात्मक तनावपूर्णता बनाए रखता है और प्रचलित वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘ध्वनियाँ’ मूल की शब्दार्थगत अस्पष्टता बनाए रखता है, जबकि ‘मशालें’ λαμπάδες का सामान्य दृश्यात्मक अर्थ देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
