id: REV.4.11
reference: Revelation 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἄξιος εἶ, ὁ κύριος καὶ ὁ θεὸς ⸀ἡμῶν, λαβεῖν τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν, ὅτι σὺ ἔκτισας ⸀τὰ πάντα, καὶ διὰ τὸ θέλημά σου ἦσαν καὶ ἐκτίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/011.yaml
  text: You are worthy[a], our Lord and God, to receive the glory and the honor and the power, because you created all things[b], and by your will they existed and were created.
translation:
  language: hi
  text: हे हमारे प्रभु और परमेश्वर, आप महिमा, आदर और सामर्थ्य पाने के योग्य हैं,[a] क्योंकि आपने सभी वस्तुओं की सृष्टि की, और आपकी इच्छा के कारण वे अस्तित्व में थीं और सृजी गईं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक क्रम: “योग्य हैं आप, हे हमारे प्रभु और परमेश्वर।” यूनानी वाक्य में “योग्य” पहले आया है और इस पर विशेष बल है।'
    reason: word_order_emphasis
  - marker: b
    text: या, “आपकी इच्छा से वे अस्तित्व में थीं और सृजी गईं।” यूनानी पदबंध को मुख्यतः कारण (“के कारण”) अथवा साधन के भाव में (“से”) समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄξιος εἶ
  choice: आप ... पाने के योग्य हैं
  rationale: यह विधेय विशेषण और सहायक क्रिया का स्वाभाविक आधुनिक हिन्दी रूप है। यूनानी में आरम्भ में आए Ἄξιος का बल पादटिप्पणी में बताया गया है।
- source_word: ὁ κύριος καὶ ὁ θεὸς ἡμῶν
  choice: हे हमारे प्रभु और परमेश्वर
  rationale: सन्दर्भ में लेखयुक्त संज्ञाएँ प्रत्यक्ष सम्बोधन का कार्य करती हैं। ‘हे’ उपासना के गरिमापूर्ण सम्बोधन को हिन्दी में स्पष्ट करता है और ἡμῶν को दोनों उपाधियों से जोड़ता है।
- source_word: λαβεῖν
  choice: पाने
  rationale: ἄξιος के साथ यह उस वस्तु को बताता है जिसे पाने का पात्र सम्बोधित व्यक्ति है। ‘पाने’ यहाँ ‘लेने’ से अधिक स्वाभाविक है और उपासना-सन्दर्भ के अनुकूल है।
- source_word: τὴν δόξαν καὶ τὴν τιμὴν καὶ τὴν δύναμιν
  choice: महिमा, आदर और सामर्थ्य
  rationale: तीनों उपासना-संबंधी संज्ञाओं को अलग रखा गया है। ‘सामर्थ्य’ δύναμις की गरिमापूर्ण और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: ὅτι σὺ ἔκτισας τὰ πάντα
  choice: क्योंकि आपने सभी वस्तुओं की सृष्टि की
  rationale: ὅτι कारण प्रस्तुत करता है और κτίζω सृष्टि करने को व्यक्त करता है। ‘सभी वस्तुओं’ से τὰ πάντα का सर्वसमावेशी आशय बना रहता है।
- source_word: διὰ τὸ θέλημά σου
  choice: आपकी इच्छा के कारण ही
  rationale: διά के साथ कर्मकारक यहाँ मुख्यतः कारण या आधार व्यक्त करता है। ‘के कारण’ इस अर्थ को सीधे रखता है; ‘ही’ सृष्टि के अस्तित्व का आधार परमेश्वर की इच्छा होने पर वाक्यगत बल देता है, बिना साधनात्मक अर्थ को मुख्य पाठ में थोपे।
- source_word: ἦσαν καὶ ἐκτίσθησαν
  choice: वे अस्तित्व में थीं और सृजी गईं
  rationale: 'दोनों यूनानी क्रियाओं को अलग रखा गया है: ἦσαν अस्तित्व की स्थिति और ἐκτίσθησαν सृजन की घटना व्यक्त करता है। हिन्दी में क्रम की असामान्यता भी मूल पाठ की धर्मवैचारिक कसावट को बिना समतल किए बनी रहती है।'
theological_decisions:
- issue: परमेश्वर की उपाधियों का सम्बोधनात्मक रूप
  choice: हे हमारे प्रभु और परमेश्वर
  alternative: हमारे प्रभु और परमेश्वर
  rationale: सिंहासन पर विराजमान व्यक्ति को सीधे सम्बोधित किया जा रहा है। ‘हे’ इस कार्य को स्पष्ट करता है, पर पाठ से आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: διὰ τὸ θέλημά σου में परमेश्वर की इच्छा और सृष्टि का सम्बन्ध
  choice: आपकी इच्छा के कारण ही
  alternative: आपकी इच्छा से
  rationale: διά + कर्मकारक का सामान्य कारणात्मक अर्थ सुरक्षित रखा गया है। वैकल्पिक ‘से’ कारण अथवा साधन दोनों समझा जा सकता है; पादटिप्पणी उस वास्तविक अस्पष्टता को बनाए रखती है।
- issue: ἦσαν καὶ ἐκτίσθησαν की दोहरी अभिव्यक्ति
  choice: अस्तित्व में थीं और सृजी गईं
  alternative: अस्तित्व में आईं और सृजी गईं
  rationale: मुख्य पाठ ἦσαν और ἐκτίσθησαν को एक ही आरम्भिक घटना में विलीन नहीं करता। इससे अस्तित्व और सृजन के सम्बन्ध की मूल पाठ में उपस्थित तनावपूर्ण अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर प्रकाशना के स्वर्गीय उपासना-दृश्य के अनुरूप गरिमापूर्ण रखी गई है। ‘महिमा, आदर और सामर्थ्य’ की त्रयी में लय और प्रत्येक पद की पृथकता सुरक्षित है।
