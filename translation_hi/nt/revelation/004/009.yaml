id: REV.4.9
reference: Revelation 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀δώσουσιν τὰ ζῷα δόξαν καὶ τιμὴν καὶ εὐχαριστίαν τῷ καθημένῳ ἐπὶ ⸂τῷ θρόνῳ⸃, τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/009.yaml
  text: And whenever the living creatures give glory and honor and thanksgiving to the one seated on the throne[a], to the one who lives forever and ever,
translation:
  language: hi
  text: और जब-जब वे जीवित प्राणी सिंहासन पर विराजमान को—जो सदा-सर्वदा जीवित है[a]—महिमा, आदर और धन्यवाद देंगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: ‘युगों के युगों तक।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब-जब
  rationale: ὅταν यहाँ अनिश्चित अथवा बार-बार होनेवाले अवसरों को व्यक्त करता है। ‘जब-जब’ इस पुनरावृत्त भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: δώσουσιν
  choice: देंगे
  rationale: δίδωμι का सीधा अर्थ ‘देना’ है। ‘अर्पित करेंगे’ उपासना का भाव स्पष्ट करता, पर स्रोत के साधारण क्रियापद से अधिक व्याख्यात्मक होता।
- source_word: τὰ ζῷα
  choice: वे जीवित प्राणी
  rationale: ζῷα सिंहासन के आसपास के उन सजीव प्राणियों की ओर संकेत करता है जिनका पहले वर्णन हुआ है। ‘वे’ यूनानी निश्चित पद और पूर्वसंदर्भ को दर्शाता है; इस पद में संख्या ‘चार’ न होने के कारण उसे नहीं जोड़ा गया।
- source_word: δόξαν
  choice: महिमा
  rationale: स्तुतिपरक संदर्भ में δόξα का सीधा और प्रचलित हिन्दी समतुल्य ‘महिमा’ है।
- source_word: τιμήν
  choice: आदर
  rationale: τιμή के लिए ‘आदर’ स्वाभाविक आधुनिक हिन्दी है और ‘महिमा’ तथा ‘धन्यवाद’ के साथ स्पष्ट त्रिक बनाता है।
- source_word: εὐχαριστίαν
  choice: धन्यवाद
  rationale: यह व्यक्त किए गए आभार को दर्शाता है और यूनानी संज्ञा का सीधा, सहज समतुल्य है।
- source_word: τῷ καθημένῳ ἐπὶ τῷ θρόνῳ
  choice: सिंहासन पर विराजमान उस जन को
  rationale: ‘विराजमान’ बैठने की स्थायी, राजसी मुद्रा को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘उस जन को’ कृदंत पद को व्यक्ति-सूचक बनाता है।
- source_word: τῷ ζῶντι
  choice: जो ... जीवित रहता है
  rationale: वर्तमान कृदंत को क्रियात्मक रूप में रखा गया है और इसे उसी सिंहासनासीन व्यक्ति का समानाधिकरणात्मक वर्णन बनाया गया है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: सदा-सर्वदा
  rationale: यह यूनानी मुहावरा अनंत काल को व्यक्त करता है। ‘सदा-सर्वदा’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और स्वाभाविक है; अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सिंहासन पर विराजमान दिव्य व्यक्ति की पहचान में स्रोत से अधिक स्पष्टता न जोड़ना
  choice: सिंहासन पर विराजमान उस जन को—जो सदा-सर्वदा जीवित रहता है—
  alternative: सिंहासन पर बैठे परमेश्वर को, जो सदा-सर्वदा जीवित रहता है
  rationale: यूनानी पाठ यहाँ ‘परमेश्वर’ शब्द नहीं जोड़ता, बल्कि सिंहासनासीन और अनंतकाल तक जीवित रहनेवाले के रूप में संदर्भित करता है। चुना हुआ रूप उसी समानाधिकरणात्मक संरचना और संदर्भगत पहचान को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जब-जब’ पुनरावृत्ति को, ‘विराजमान’ सिंहासन-कक्ष की राजसी छवि को, और डैश समानाधिकरणात्मक वर्णन को स्पष्ट करते हैं। पद अगले वाक्यांश में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
