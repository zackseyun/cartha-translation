lexical_decisions:
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह क्रियाविशेषण घटना के तत्काल घटने और दर्शन में अचानक हुए संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγενόμην
  choice: मैं ... आ गया
  rationale: γίνομαι का यह रूप किसी अवस्था में प्रवेश को सूचित करता है; ‘आ गया’ केवल स्थिर ‘था’ की अपेक्षा उस संक्रमण को अधिक स्पष्ट रखता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: 'यह संक्षिप्त रूप यूनानी की अस्पष्टता को बनाए रखता है: इसका आशय पवित्र आत्मा के प्रभाव में होना अथवा आत्मिक/दर्शनात्मक अवस्था में होना हो सकता है।'
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह दर्शन की अगली वस्तु की ओर ध्यान खींचने वाला स्वाभाविक किन्तु गरिमापूर्ण हिन्दी संकेत है।
- source_word: θρόνος
  choice: एक सिंहासन
  rationale: सिंहासन का यहाँ पहली बार परिचय कराया गया है; हिन्दी में ‘एक’ इस परिचय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔκειτο
  choice: रखा हुआ था
  rationale: κεῖμαι यहाँ किसी वस्तु के स्थापित या स्थित होने का बोध देता है; सिंहासन के लिए ‘रखा हुआ था’ हिन्दी में अर्थपूर्ण है और मूल की अपूर्णकालिक स्थिति को बनाए रखता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: प्रकाशितवाक्य के स्वर्गीय दर्शन के संदर्भ में οὐρανός का आशय आकाश नहीं, स्वर्ग है।
- source_word: καθήμενος
  choice: कोई बैठा था
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त सिंहासन पर बैठे व्यक्ति का परिचय देता है, पर उसकी पहचान इस पद में स्पष्ट नहीं करता; ‘कोई’ उसी अनिर्दिष्टता को बनाए रखता है।
theological_decisions:
- issue: ἐν πνεύματι पवित्र आत्मा का संकेत है या सामान्य आत्मिक/दर्शनात्मक अवस्था का
  choice: आत्मा में
  alternative: आत्मिक अवस्था में
  rationale: यूनानी पदबंध में उपपद नहीं है और प्रकाशितवाक्य में यह भविष्यदर्शी अनुभव का सूत्र भी है। मुख्य पाठ का संक्षिप्त ‘आत्मा में’ दोनों संभावनाओं को खुला रखता है; पादटिप्पणी उन्हें स्पष्ट करती है।
- issue: सिंहासन पर बैठे व्यक्ति की पहचान
  choice: कोई बैठा था
  alternative: एक जन बैठा था
  rationale: मूल पाठ इस स्थान पर व्यक्ति का नाम या स्पष्ट पहचान नहीं देता। अनुवाद उस पहचान को अनुमान से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और दर्शनात्मक शैली रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक संकेत को बचाता है; ‘आत्मा में आ गया’ संक्रमण को व्यक्त करते हुए जानबूझकर व्याख्यात्मक अस्पष्टता बनाए रखता है।
