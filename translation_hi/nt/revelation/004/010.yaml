source:
  edition: SBLGNT
  text: πεσοῦνται οἱ εἴκοσι τέσσαρες πρεσβύτεροι ἐνώπιον τοῦ καθημένου ἐπὶ τοῦ θρόνου, καὶ προσκυνήσουσιν τῷ ζῶντι εἰς τοὺς αἰῶνας τῶν αἰώνων, καὶ βαλοῦσιν τοὺς στεφάνους αὐτῶν ἐνώπιον τοῦ θρόνου, λέγοντες·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/004/010.yaml
  text: 'the twenty-four elders will fall down before the one seated on the throne[a], and they will worship the one who lives forever and ever, and they will cast their crowns before the throne[b], saying:'
translation:
  language: hi
  text: 'वे चौबीस प्राचीन सिंहासन पर विराजमान जन के सामने गिर पड़ेंगे और युगानुयुग[a] जीवित रहनेवाले की आराधना करेंगे। वे अपने मुकुटों[b] को सिंहासन के सामने डाल देंगे और कहेंगे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “युगों के युगों तक।”'
    reason: lexical_alternative
  - marker: b
    text: “मुकुट” के लिए प्रयुक्त यूनानी शब्द सम्मान के चिह्न के रूप में दी जानेवाली विजय-माला को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεσοῦνται
  choice: गिर पड़ेंगे
  rationale: यह शारीरिक रूप से झुककर गिरने की क्रिया और आराधना-संदर्भ में उसके आदरपूर्ण भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ εἴκοσι τέσσαρες πρεσβύτεροι
  choice: वे चौबीस प्राचीन
  rationale: प्रकाशितवाक्य के स्वर्गीय दरबार के संदर्भ में ‘प्राचीन’ πρεσβύτεροι का प्रचलित, सुबोध और गैर-तकनीकी हिन्दी रूप है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: दोनों स्थानों पर यह निकट उपस्थिति और सम्मुख होने का भाव संक्षेप तथा स्वाभाविकता से देता है।
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: सिंहासन पर विराजमान जन
  rationale: मूल के विशेषणवत कृदंत को आदरपूर्ण संज्ञात्मक अभिव्यक्ति में रखते हुए निरंतर सिंहासनासीन दशा को व्यक्त करता है; किसी विशिष्ट त्रिएक व्यक्तित्व का नाम पाठ में नहीं जोड़ा गया।
- source_word: προσκυνήσουσιν
  choice: आराधना करेंगे
  rationale: ईश्वरीय संदर्भ में यह केवल प्रणाम की शारीरिक मुद्रा नहीं, धार्मिक उपासना को दर्शाता है।
- source_word: τῷ ζῶντι
  choice: जीवित रहनेवाले
  rationale: संज्ञात्मक कृदंत परमेश्वर की जीवित और स्थायी पहचान पर बल देता है; हिन्दी में यह आगे आनेवाली कालवाचक अभिव्यक्ति के साथ स्वाभाविक है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनंत अवधि का स्वाभाविक और गरिमापूर्ण हिन्दी मुहावरा है; अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: βαλοῦσιν
  choice: डाल देंगे
  rationale: यह βάλλω की सक्रिय और दृश्य क्रिया को स्वाभाविक हिन्दी में बनाए रखता है; ‘रख देंगे’ की अपेक्षा अधिक सजीव है, किंतु ‘फेंक देंगे’ के संभावित अनादरपूर्ण भाव से बचता है।
- source_word: τοὺς στεφάνους αὐτῶν
  choice: अपने मुकुट
  rationale: राजकीय और सम्मानसूचक दृश्य में ‘मुकुट’ सबसे स्वाभाविक है; στέφανος के विजय-माला संबंधी ऐतिहासिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: λέγοντες
  choice: 'और कहेंगे:'
  rationale: कृदंत आगामी वचन का परिचय देता है; हिन्दी में समन्वित भविष्यकाल और द्विबिंदु प्रवाह को स्पष्ट रखते हैं।
theological_decisions:
- issue: सिंहासन पर विराजमान और सदा जीवित रहनेवाले का संदर्भ
  choice: 'वर्णनात्मक उपाधियों को बनाए रखना: ‘सिंहासन पर विराजमान जन’ और ‘युगानुयुग जीवित रहनेवाले’।'
  alternative: अनुवाद में स्पष्ट रूप से ‘परमेश्वर पिता’ कहना।
  rationale: व्यापक संदर्भ सिंहासनासीन परमेश्वर की ओर संकेत करता है, पर इस पद का यूनानी पाठ नाम न देकर वर्णनात्मक उपाधियाँ प्रयोग करता है। इसलिए अनुवाद पाठ से आगे बढ़कर त्रिएक व्यक्तित्व को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सुबोध, गरिमापूर्ण और आराधनात्मक शैली रखी गई है। ‘विराजमान जन’ आदर बनाए रखते हुए मूल की वर्णनात्मक अस्पष्टता को सुरक्षित रखता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न उनके वास्तविक संबंधित पदों के तुरंत बाद रखे गए हैं।
