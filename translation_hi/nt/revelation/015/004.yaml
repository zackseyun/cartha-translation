id: REV.15.4
reference: Revelation 15:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς οὐ μὴ ⸀φοβηθῇ, κύριε, καὶ ⸀δοξάσει τὸ ὄνομά σου, ὅτι μόνος ⸀ὅσιος; ὅτι πάντα τὰ ἔθνη ἥξουσιν καὶ προσκυνήσουσιν ἐνώπιόν σου, ὅτι τὰ δικαιώματά σου ἐφανερώθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/004.yaml
  text: Who will not fear[a], Lord, and glorify your name? For you alone are holy. For all the nations will come and worship before you, because your righteous acts have been revealed.
translation:
  language: hi
  text: हे प्रभु, कौन आपका भय न मानेगा और आपके नाम की महिमा न करेगा? क्योंकि केवल आप ही पवित्र हैं। सभी राष्ट्र आकर आपके सामने आराधना करेंगे, क्योंकि आपके न्यायपूर्ण कार्य[a] प्रकट हो गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायपूर्ण निर्णय”; यूनानी शब्द न्यायिक निर्णयों या विधियों के लिए भी प्रयुक्त हो सकता है, पर यहाँ संभवतः परमेश्वर के उन न्यायपूर्ण कामों की ओर संकेत है जो अब प्रकट हो गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς οὐ μὴ φοβηθῇ
  choice: कौन आपका भय न मानेगा
  rationale: οὐ μή वाले आलंकारिक प्रश्न की प्रबलता बनी रहती है और अपेक्षित उत्तर ‘कोई नहीं’ है; भविष्य का भाव भी सुरक्षित है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: κύριος के संबोधन रूप को स्वाभाविक और गरिमापूर्ण हिन्दी संबोधन में व्यक्त किया गया है।
- source_word: δοξάσει τὸ ὄνομά σου
  choice: आपके नाम की महिमा न करेगा
  rationale: यह परमेश्वर के नाम अर्थात् उनके प्रकट चरित्र और प्रतिष्ठा को महिमा देने की बाइबिलीय अभिव्यक्ति को बनाए रखता है; प्रश्न के संयुक्त नकार को हिन्दी में स्पष्ट करने के लिए ‘न’ दोहराया गया है।
- source_word: μόνος ὅσιος
  choice: केवल आप ही पवित्र हैं
  rationale: दिव्य स्तुति के प्रसंग में ὅσιος की नैतिक और धार्मिक पवित्रता को ‘पवित्र’ सबसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάντα τὰ ἔθνη
  choice: सभी राष्ट्र
  rationale: ἔθνη के सामूहिक जातीय और राष्ट्रीय विस्तार को बनाए रखता है और यहाँ इसे केवल गैर-यहूदियों तक सीमित नहीं करता।
- source_word: ἥξουσιν
  choice: आकर
  rationale: आने की भविष्यकालीन क्रिया को अगले भविष्यकालीन क्रियापद के साथ स्वाभाविक हिन्दी संयुक्त रचना में रखा गया है।
- source_word: προσκυνήσουσιν ἐνώπιόν σου
  choice: आपके सामने आराधना करेंगे
  rationale: स्वर्गीय उपासना के प्रसंग में προσκυνέω का धार्मिक अर्थ ‘आराधना’ उपयुक्त है, जबकि ἐνώπιόν σου को स्पष्ट रूप से ‘आपके सामने’ रखा गया है।
- source_word: τὰ δικαιώματά σου
  choice: आपके न्यायपूर्ण कार्य
  rationale: δικαίωμα के व्यापक अर्थ—धर्मी कार्य, न्यायिक निर्णय या विधान—में से प्रसंगानुसार परमेश्वर के प्रकट न्यायकारी कामों को चुना गया है, पर वैकल्पिक न्यायिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ἐφανερώθησαν
  choice: प्रकट हो गए हैं
  rationale: अतीत में पूर्ण हुई और वर्तमान में प्रभावी अभिव्यक्ति को स्वाभाविक हिन्दी पूर्ण पक्ष में व्यक्त करता है।
theological_decisions:
- issue: दिव्य स्तुति में ὅσιος का अर्थ
  choice: पवित्र
  alternative: विश्वासयोग्य; भक्तिमय
  rationale: यहाँ परमेश्वर की अद्वितीय नैतिक और धार्मिक पवित्रता की स्तुति है; ‘पवित्र’ अर्थ को किसी एक संकीर्ण गुण तक सीमित नहीं करता।
- issue: न्याय के प्रलय-दर्शी प्रसंग में δικαιώματα का अर्थ
  choice: न्यायपूर्ण कार्य
  alternative: न्यायपूर्ण निर्णय; विधियाँ
  rationale: राष्ट्रों के सामने परमेश्वर के न्याय के प्रकट होने की बात है। ‘न्यायपूर्ण कार्य’ अर्थ की व्यापकता बनाए रखता है, जबकि न्यायिक अर्थ को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण उपासना-प्रधान स्वर रखा गया है। आदरसूचक ‘आप’ और ‘हे प्रभु’ सामान्य पाठक के लिए स्वाभाविक हैं। पाद-टिप्पणी चिह्न उसी पदबंध के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
