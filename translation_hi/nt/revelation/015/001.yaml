language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον ἄλλο σημεῖον ἐν τῷ οὐρανῷ μέγα καὶ θαυμαστόν, ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ τὰς ἐσχάτας, ὅτι ἐν αὐταῖς ἐτελέσθη ὁ θυμὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/001.yaml
  text: 'And I saw another sign in heaven[a], great and marvelous: seven angels having seven last plagues[b], because in them the wrath of God was finished.'
translation:
  language: hi
  text: 'और मैंने स्वर्ग में एक और चिन्ह देखा, जो महान और अद्भुत था: सात स्वर्गदूत, जिनके पास सात अंतिम विपत्तियाँ थीं, क्योंकि इनमें परमेश्वर का क्रोध पूरा हो गया।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σημεῖον
  choice: चिन्ह
  rationale: प्रकाशितवाक्य में दिखाई देने वाली प्रतीकात्मक घटना के लिए यह स्वाभाविक और पारंपरिक हिन्दी शब्द है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: इस दर्शन का संदर्भ केवल आकाश नहीं, बल्कि स्वर्गीय क्षेत्र है।
- source_word: μέγα καὶ θαυμαστόν
  choice: महान और अद्भुत
  rationale: यह युग्म चिन्ह की भव्यता और विस्मयकारी प्रकृति, दोनों को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀγγέλους ἑπτὰ ἔχοντας πληγὰς ἑπτὰ
  choice: सात स्वर्गदूत, जिनके पास सात ... विपत्तियाँ थीं
  rationale: सम्बन्धवाचक उपवाक्य यूनानी कृदन्त की भावना रखते हुए हिन्दी में अधिक सहज है।
- source_word: πληγὰς
  choice: विपत्तियाँ
  rationale: न्याय के प्रसंग में यह शब्द दैवी प्रहारों अथवा व्यापक विनाशकारी दण्डों को स्वाभाविक ढंग से व्यक्त करता है; ‘महामारियाँ’ अर्थ को रोगों तक सीमित कर सकता है।
- source_word: τὰς ἐσχάτας
  choice: अंतिम
  rationale: यह क्रम और समापन, दोनों की सीधी अभिव्यक्ति है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह इन विपत्तियों के अंतिम होने का कारण स्पष्ट करने वाले यूनानी कारणसूचक संयोजक को दर्शाता है।
- source_word: ἐν αὐταῖς
  choice: उन्हीं में
  rationale: ‘में’ मूल पूर्वसर्ग को बनाए रखता है और ‘ही’ इन सात अंतिम विपत्तियों पर स्वाभाविक बल देता है।
- source_word: ἐτελέσθη
  choice: पूरा हुआ
  rationale: यह निष्क्रिय क्रिया परमेश्वर के प्रकोप के अपने पूर्ण निष्पादन या परिणति तक पहुँचने का भाव रखती है, बिना पद से आगे कोई सिद्धान्त जोड़ने के।
- source_word: ὁ θυμὸς τοῦ θεοῦ
  choice: परमेश्वर का प्रकोप
  rationale: ‘प्रकोप’ तीव्र दैवी क्रोध और न्याय की गंभीरता को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रकाशितवाक्य के न्याय-संबंधी θυμός का अनुवाद
  choice: परमेश्वर का प्रकोप
  alternative: परमेश्वर का क्रोध
  rationale: ‘प्रकोप’ तीव्रता और न्यायिक दण्ड के प्रसंग को बनाए रखता है, जबकि इसे अनियंत्रित मानवीय आवेश के रूप में प्रस्तुत नहीं करता।
- issue: ἐτελέσθη का समापनात्मक भाव
  choice: पूरा हुआ
  alternative: समाप्त हुआ
  rationale: ‘पूरा हुआ’ केवल रुक जाने के बजाय पूर्ण निष्पादन का भाव भी रखता है; फिर भी यह इससे आगे यह दावा नहीं करता कि हर प्रकार का दैवी न्याय इसी क्षण सर्वथा समाप्त हो गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण है। यूनानी वाक्य की दृष्टि-रचना और कारणसूचक संबंध सुरक्षित रखे गए हैं; भारी शाब्दिक संरचना के स्थान पर स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य अपनाया गया है।
