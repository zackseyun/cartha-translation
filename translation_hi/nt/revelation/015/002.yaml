id: REV.15.2
reference: Revelation 15:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον ὡς θάλασσαν ὑαλίνην μεμιγμένην πυρί, καὶ τοὺς νικῶντας ἐκ τοῦ θηρίου καὶ ἐκ τῆς εἰκόνος αὐτοῦ καὶ ἐκ τοῦ ἀριθμοῦ τοῦ ὀνόματος αὐτοῦ ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην, ἔχοντας κιθάρας τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/002.yaml
  text: And I saw what appeared to be a sea of glass mixed with fire[a], and those who were victorious over the beast and over its image and over the number of its name, standing on the sea of glass[b], holding harps of God.
translation:
  language: hi
  text: और मैंने मानो आग से मिला-जुला काँच का एक समुद्र और उन लोगों को देखा जिन्होंने उस पशु पर, उसकी मूर्ति पर और उसके नाम की संख्या पर विजय पाई थी[a]। वे काँच के उस समुद्र पर खड़े थे और परमेश्वर की वीणाएँ[b] लिए हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जो उस पशु, उसकी मूर्ति और उसके नाम की संख्या से निकलकर विजयी हुए थे।” यूनानी रचना पशु पर विजय पाने अथवा उसकी सत्ता से निकल आने—दोनों भावों की ओर संकेत कर सकती है।'
    reason: alternative_reading
  - marker: b
    text: 'या: “परमेश्वर से मिली वीणाएँ” या “परमेश्वर के लिए वीणाएँ।” यूनानी संबंधकारक स्वामित्व, स्रोत या समर्पण का भाव व्यक्त कर सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς θάλασσαν ὑαλίνην
  choice: मानो ... काँच का एक समुद्र
  rationale: ὡς दर्शन में दिखाई देने वाली वस्तु की तुलना या आभास व्यक्त करता है। “मानो” उस अनिश्चित दृश्यात्मकता को बनाए रखता है, और “काँच का समुद्र” प्रकाशितवाक्य की प्रभावशाली छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: μεμιγμένην πυρί
  choice: आग से मिला हुआ
  rationale: पूर्ण कृदंत समुद्र की दिखाई देने वाली मिश्रित अवस्था बताता है। यह अनोखी छवि को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: τοὺς νικῶντας
  choice: जिन्होंने ... विजय पाई थी
  rationale: νικάω यहाँ विरोधी शक्तियों पर जय पाने का भाव रखता है। हिन्दी में “विजय पाई थी” प्रसंग के विजय-विषय को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐκ τοῦ θηρίου ... ἐκ τῆς εἰκόνος ... ἐκ τοῦ ἀριθμοῦ
  choice: उस पशु पर, उसकी मूर्ति पर और उसके नाम की संख्या पर
  rationale: νικῶντας के साथ “पर ... विजय” स्वाभाविक हिन्दी है और तीनों तत्वों को समानांतर रखती है। ἐκ के मूल ‘से/में से’ भाव को संभावित विकल्प के रूप में पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἑστῶτας ἐπὶ τὴν θάλασσαν τὴν ὑαλίνην
  choice: काँच के उस समुद्र पर खड़े थे
  rationale: ἐπί के बल और दर्शन की चमत्कारिक छवि को “पर” बनाए रखता है; “किनारे” कहना अनावश्यक रूप से अर्थ को सीमित करता।
- source_word: κιθάρας τοῦ θεοῦ
  choice: परमेश्वर की वीणाएँ
  rationale: κιθάρα के लिए हिन्दी बाइबलीय और सामान्यतः समझा जाने वाला तारवाद्य-शब्द “वीणा” उपयुक्त है। संबंधकारक को “परमेश्वर की” रखकर स्वामित्व, स्रोत या समर्पण की अस्पष्टता को मुख्य पाठ में अधिक नहीं खोला गया; विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: νικῶντας के बाद बार-बार आए ἐκ से विजेताओं और पशु के बीच संबंध
  choice: पशु, उसकी मूर्ति और उसके नाम की संख्या पर विजय
  alternative: उनकी सत्ता या प्रभाव से विजयी होकर निकलना
  rationale: प्रकाशितवाक्य में νικάω का विजय-विषय और हिन्दी का स्वाभाविक प्रयोग “पर विजय पाना” मुख्य पाठ का समर्थन करते हैं। फिर भी ἐκ का ‘से बाहर/से निकलकर’ भाव वास्तविक भाषिक संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: κιθάρας τοῦ θεοῦ में संबंधकारक का अर्थ
  choice: परमेश्वर की वीणाएँ
  alternative: परमेश्वर से मिली या परमेश्वर के लिए समर्पित वीणाएँ
  rationale: पाठ यह निश्चित नहीं करता कि संबंधकारक स्वामित्व, स्रोत या समर्पण बताता है। औपचारिक हिन्दी मुख्य पाठ में इस तनाव को बनाए रखती है और पादटिप्पणी संभावनाएँ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज रूप अपनाया गया है। लंबे यूनानी वाक्य को स्पष्टता के लिए तीन छोटे वाक्यों में बाँटा गया, जबकि दृश्य और सहभागी कृदंतों का संबंध बनाए रखा गया है। “पशु,” “मूर्ति,” “नाम की संख्या,” और “वीणाएँ” जैसी प्रकाशितवाक्य की प्रमुख छवियाँ बिना सांप्रदायिक व्याख्या के सुरक्षित हैं।
