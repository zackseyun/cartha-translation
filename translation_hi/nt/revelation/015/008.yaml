id: REV.15.8
reference: Revelation 15:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγεμίσθη ὁ ναὸς καπνοῦ ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ, καὶ οὐδεὶς ἐδύνατο εἰσελθεῖν εἰς τὸν ναὸν ἄχρι τελεσθῶσιν αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/008.yaml
  text: And the sanctuary was filled with smoke from the glory of God and from his power[a], and no one was able to enter the sanctuary until the seven plagues of the seven angels were finished.
translation:
  language: hi
  text: और पवित्रस्थान[a] परमेश्वर की महिमा और उसके सामर्थ्य से उत्पन्न धुएँ से भर गया। जब तक सात स्वर्गदूतों की सात विपत्तियाँ पूरी न हो गईं, तब तक कोई भी पवित्रस्थान में प्रवेश नहीं कर सका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मंदिर’; यूनानी शब्द ναός प्रायः पूरे मंदिर-परिसर के बजाय उसके भीतरी पवित्रस्थान को अधिक विशेष रूप से दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸς
  choice: पवित्रस्थान
  rationale: ναός यहाँ व्यापक मन्दिर-परिसर के बजाय परमेश्वर के भीतरी पवित्र निवास को सूचित करता है; ‘पवित्रस्थान’ इस विशिष्ट अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγεμίσθη
  choice: भर गया
  rationale: यह यूनानी अओरिस्ट कर्मवाच्य का स्वाभाविक हिन्दी रूप है और घटना के पूर्ण होने को व्यक्त करता है।
- source_word: καπνοῦ
  choice: धुएँ से
  rationale: γεμίζω के साथ प्रयुक्त सम्बन्धकारक को हिन्दी में ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है; ईश-प्रकाशन के प्रसंग में ‘धुआँ’ उपयुक्त अर्थ है।
- source_word: ἐκ τῆς δόξης τοῦ θεοῦ καὶ ἐκ τῆς δυνάμεως αὐτοῦ
  choice: परमेश्वर की महिमा और उसके सामर्थ्य से निकले
  rationale: ἐκ स्रोत को दर्शाता है। ‘से निकले’ यह स्पष्ट करता है कि धुएँ का स्रोत परमेश्वर की महिमा और उसका सामर्थ्य है, बिना चित्रात्मकता को मिटाए।
- source_word: οὐδεὶς ἐδύνατο εἰσελθεῖν
  choice: कोई भी ... प्रवेश नहीं कर सका
  rationale: यह निरन्तर असमर्थता को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἄχρι τελεσθῶσιν
  choice: जब तक ... पूरी न हो गईं
  rationale: यह समय-सीमा तथा कर्मवाच्य/परिणामात्मक भाव को हिन्दी की स्वाभाविक ‘जब तक ... तब तक’ रचना में रखता है।
- source_word: αἱ ἑπτὰ πληγαὶ τῶν ἑπτὰ ἀγγέλων
  choice: सातों स्वर्गदूतों की सातों विपत्तियाँ
  rationale: ‘विपत्तियाँ’ प्रकाशितवाक्य में दैवी न्याय के प्रहारों के लिए स्वाभाविक हिन्दी है; ‘की’ इन विपत्तियों का सात स्वर्गदूतों से सम्बन्ध बनाए रखता है। ‘सातों’ प्रत्येक पूरे समूह पर बल देता है।
theological_decisions:
- issue: स्वर्गीय उपासना के दर्शन में ναός का अनुवाद
  choice: पवित्रस्थान
  alternative: मन्दिर
  rationale: ‘पवित्रस्थान’ परमेश्वर के भीतरी पवित्र निवास की ओर संकेत करता है और पूरे मन्दिर-परिसर का अनावश्यक बोध नहीं कराता। ‘मन्दिर’ सम्भव विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: धुएँ का परमेश्वर की महिमा और सामर्थ्य से सम्बन्ध
  choice: महिमा और सामर्थ्य से निकला धुआँ
  alternative: महिमा और सामर्थ्य के कारण हुआ धुआँ
  rationale: ἐκ मुख्यतः स्रोत/उद्गम दर्शाता है; ‘से निकला’ इस चित्र को सुरक्षित रखता है और कारणात्मक व्याख्या को थोपता नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘पवित्रस्थान’, ‘सामर्थ्य’ और ‘विपत्तियाँ’ प्रकाशितवाक्य की गंभीर तथा उपासनात्मक शैली के अनुकूल हैं।
