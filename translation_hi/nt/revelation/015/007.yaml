id: REV.15.7
reference: Revelation 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἓν ἐκ τῶν τεσσάρων ζῴων ἔδωκεν τοῖς ἑπτὰ ἀγγέλοις ἑπτὰ φιάλας χρυσᾶς γεμούσας τοῦ θυμοῦ τοῦ θεοῦ τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/007.yaml
  text: And one of the four living creatures gave to the seven angels seven golden bowls full of the wrath of God[b][a], who lives forever and ever.
translation:
  language: hi
  text: और उन चार जीवित प्राणियों में से एक ने उन सात स्वर्गदूतों को सोने के सात कटोरे[a] दिए, जो उस परमेश्वर के क्रोध से भरे थे जो युगानुयुग जीवित है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सोने के सात उथले पात्र’; यूनानी शब्द कटोरे जैसे चौड़े पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘युगों के युगों तक।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἓν ἐκ τῶν τεσσάρων ζῴων
  choice: उन चारों जीवित प्राणियों में से एक
  rationale: ζῷον यहाँ सिंहासन के पास के सजीव प्राणियों को दर्शाता है; ‘जीवित प्राणी’ इसे प्रकाशितवाक्य के θηρίον अर्थात् ‘पशु’ से स्पष्ट रूप से अलग रखता है।
- source_word: ἔδωκεν
  choice: दिए
  rationale: δίδωμι के सामान्य अर्थ ‘देना’ को स्वाभाविक हिन्दी में रखा गया है।
- source_word: τοῖς ἑπτὰ ἀγγέλοις
  choice: उन सात स्वर्गदूतों को
  rationale: इस स्वर्गीय दर्शन के संदर्भ में ἄγγελος का प्रचलित और स्पष्ट हिन्दी रूप ‘स्वर्गदूत’ है।
- source_word: ἑπτὰ φιάλας χρυσᾶς
  choice: सोने के सात कटोरे
  rationale: φιάλη एक चौड़े, कटोरे जैसे पात्र को दर्शाता है; ‘कटोरे’ आधुनिक हिन्दी में स्पष्ट है, और χρυσᾶς को ‘सोने के’ कहना उनकी सामग्री को सहज रूप से व्यक्त करता है।
- source_word: γεμούσας τοῦ θυμοῦ τοῦ θεοῦ
  choice: परमेश्वर के प्रकोप से भरे हुए
  rationale: γέμω के साथ संबंधकारक पूर्णता व्यक्त करता है। यहाँ θυμός न्याय के संदर्भ में तीव्र दैवी रोष है; ‘प्रकोप’ उसकी गंभीरता और न्यायात्मक शक्ति बनाए रखता है।
- source_word: τοῦ ζῶντος εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग जीवित रहने वाले
  rationale: यह वाक्यांश परमेश्वर को निरंतर जीवित रहने वाला बताता है। ‘युगानुयुग’ αἰῶνας τῶν αἰώνων की सामी-यूनानी तीव्र अभिव्यक्ति को गरिमापूर्ण और बोधगम्य हिन्दी में रखता है।
theological_decisions:
- issue: दैवी θυμός का अनुवाद
  choice: परमेश्वर का प्रकोप
  alternative: परमेश्वर का क्रोध / परमेश्वर का कोप
  rationale: ‘प्रकोप’ अंतिम न्याय की तीव्रता को बनाए रखता है, पर इसे केवल क्षणिक मानवीय भावावेग के रूप में प्रस्तुत नहीं करता।
- issue: τοῦ ζῶντος और अनंतकालिक वाक्यांश का संबंध
  choice: युगानुयुग जीवित रहने वाले परमेश्वर
  alternative: जीवित परमेश्वर का प्रकोप, युगानुयुग
  rationale: व्याकरण की दृष्टि से εἰς τοὺς αἰῶνας τῶν αἰώνων निकटवर्ती τοῦ ζῶντος के साथ मिलकर परमेश्वर के अनंत जीवन को बताता है। हिन्दी में विशेषणात्मक पदबंध इस संबंध को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार बदला गया है, जबकि कटोरों का परमेश्वर के प्रकोप से भरा होना और परमेश्वर का युगानुयुग जीवित रहना स्पष्ट रखा गया है।
