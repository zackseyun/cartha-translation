revisions:
- from: तब उन चारों जीवित प्राणियों में से एक ने उन सात स्वर्गदूतों को सोने के सात कटोरे[a] दिए, जो युगानुयुग जीवित रहने वाले परमेश्वर के प्रकोप से भरे हुए थे।
  to: और उन चार जीवित प्राणियों में से एक ने उन सात स्वर्गदूतों को सोने के सात कटोरे[a] दिए, जो उस परमेश्वर के क्रोध से भरे थे जो युगानुयुग जीवित है[b]।
  rationale: The revision removes an unsupported temporal connective, uses «क्रोध» for the direct judicial force of θυμός, and clarifies that eternal life describes परमेश्वर rather than the bowls. It also restores the literal-idiom footnote corresponding to the English audit trail.
  reviewer_model: gpt-5.6-terra
