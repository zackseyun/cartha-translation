id: REV.15.3
reference: Revelation 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ᾄδουσιν τὴν ᾠδὴν Μωϋσέως τοῦ δούλου τοῦ θεοῦ καὶ τὴν ᾠδὴν τοῦ ἀρνίου λέγοντες· Μεγάλα καὶ θαυμαστὰ τὰ ἔργα σου, κύριε, ὁ θεός, ὁ παντοκράτωρ· δίκαιαι καὶ ἀληθιναὶ αἱ ὁδοί σου, ὁ βασιλεὺς τῶν ⸀αἰώνων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/003.yaml
  text: 'And they sing the song of Moses[a], the servant of God, and the song of the Lamb, saying: “Great and marvelous are your works, Lord God, the Almighty; righteous and true are your ways, O King of the ages.”'
translation:
  language: hi
  text: 'और वे परमेश्वर के दास मूसा का गीत और मेम्ने का गीत गाते हैं और कहते हैं:


    “आपके कार्य महान और अद्भुत हैं,

    हे प्रभु परमेश्वर, सर्वशक्तिमान;


    आपके मार्ग न्यायपूर्ण और सच्चे हैं,

    हे युगों के राजा।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “युगों के राजा” के स्थान पर “जातियों के राजा” है।
    reason: textual_variant
lexical_decisions:
- source_word: ᾄδουσιν
  choice: गाते हैं
  rationale: वर्तमानकालीन बहुवचन क्रिया को दर्शन-वर्णन के सजीव वर्तमान काल में स्वाभाविक रूप से रखा गया है।
- source_word: ᾠδὴν
  choice: गीत
  rationale: यह सामान्य और सीधा अर्थ है; ‘भजन’ कहने से मूल में अनिवार्य निहित न होने वाला उपासना-संबंधी रंग जुड़ सकता है।
- source_word: δούλου
  choice: दास
  rationale: ‘दास’ परमेश्वर से संबंध, अधीनता और सौंपे गए दायित्व को व्यक्त करता है तथा δοῦλος की प्रबलता को ‘सेवक’ की अपेक्षा अधिक निकटता से बनाए रखता है।
- source_word: ἀρνίου
  choice: मेम्ने
  rationale: प्रकाशितवाक्य में यह मसीह-संबंधी उपाधि है; ‘मेम्ना’ बलिदानी और मसीही बिंब सुरक्षित रखता है।
- source_word: Μεγάλα καὶ θαυμαστὰ
  choice: महान और अद्भुत
  rationale: दोनों विशेषण परमेश्वर के कार्यों की महानता और विस्मय उत्पन्न करने वाली प्रकृति को गरिमापूर्ण, सहज हिन्दी में व्यक्त करते हैं।
- source_word: ἔργα
  choice: कार्य
  rationale: ‘कार्य’ परमेश्वर के किए हुए कामों के लिए सीधा और गरिमापूर्ण विकल्प है।
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: हे प्रभु परमेश्वर, सर्वशक्तिमान
  rationale: सम्बोधन और तीनों तत्व—प्रभु, परमेश्वर और सर्वशक्तिमान—को स्वाभाविक हिन्दी क्रम में सुरक्षित रखा गया है।
- source_word: δίκαιαι καὶ ἀληθιναὶ
  choice: न्यायपूर्ण और सच्चे
  rationale: मार्गों के संदर्भ में ‘न्यायपूर्ण’ δίκαιαι की नैतिक और न्याय-संबंधी धारणा को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘सच्चे’ ἀληθιναί की सत्यता और विश्वसनीयता बनाए रखता है।
- source_word: βασιλεὺς τῶν αἰώνων
  choice: युगों के राजा
  rationale: प्रदत्त SBLGNT पाठ के αἰώνων का सीधा अनुवाद है और काल-युगों पर परमेश्वर के शासन की अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: मूसा की उपाधि में δοῦλος का अनुवाद
  choice: परमेश्वर का दास
  alternative: परमेश्वर का सेवक
  rationale: ‘दास’ परमेश्वर के अधिकार के अधीन होने और उसी से संबंधित होने की मूल अभिव्यक्ति को बिना नरम किए सुरक्षित रखता है; हिन्दी बाइबलीय प्रयोग में यह सम्मानसूचक संदर्भ में भी समझने योग्य है।
- issue: पद के अंत में राजा की उपाधि का पाठांतर
  choice: युगों के राजा
  alternative: जातियों के राजा
  rationale: मुख्य पाठ प्रदत्त SBLGNT के αἰώνων का अनुसरण करता है। महत्वपूर्ण पांडुलिपीय पाठांतर ‘जातियों’ को पाद-टिप्पणी में रखा गया है, ताकि मूल-पाठ की अनिश्चितता छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक स्तुति-शैली रखी गई है। ‘आपके’ का प्रयोग आदरसूचक प्रत्यक्ष सम्बोधन के लिए किया गया है। पंक्ति-विन्यास गीत की समानांतर संरचना को स्पष्ट करता है।
