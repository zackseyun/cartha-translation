lexical_decisions:
- source_word: Καὶ μετὰ ταῦτα
  choice: और इन बातों के बाद
  rationale: यह प्रकाशन-साहित्य में घटनाक्रम आगे बढ़ाने वाला सूत्र है। ‘इन बातों’ से ταῦτα के बहुवचन को और आरम्भिक ‘और’ से यूहन्ना की संयोजक कथन-शैली को सुरक्षित रखा गया है।
- source_word: εἶδον
  choice: मैंने देखा
  rationale: यह दर्शन में हुई प्रत्यक्ष अनुभूति को व्यक्त करता है; ‘मैंने देखा’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἠνοίγη
  choice: खोल दिया गया
  rationale: यूनानी क्रिया कर्मवाच्य है और मन्दिर के खोले जाने की घटना बताती है। हिन्दी में ‘खोल दिया गया’ इस पूर्ण घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ναὸς
  choice: मन्दिर
  rationale: ναός विशेष रूप से मन्दिर के पवित्र भीतरी भाग का संकेत दे सकता है, पर ‘मन्दिर’ सामान्य पाठक के लिए परिचित है और प्रकाशितवाक्य में इसकी शब्दावली के अनुरूप है; ‘पवित्रस्थान’ सम्भव विकल्प है।
- source_word: τῆς σκηνῆς
  choice: तम्बू का
  rationale: σκηνή यहाँ इस्राएल के जंगल-कालीन उपासना-तम्बू की पृष्ठभूमि जगाता है। ‘तम्बू’ आधुनिक हिन्दी में बोधगम्य रहते हुए उस बाइबलीय चित्र को बनाए रखता है।
- source_word: τοῦ μαρτυρίου
  choice: गवाही के
  rationale: मारτύριον परमेश्वर की वाचा-संबंधी गवाही को सूचित करता है। ‘गवाही के तम्बू’ मूल के संबंधकारक पदबंध और पुराने नियम की उपासना-संबंधी भाषा को सुरक्षित रखता है।
- source_word: ἐν τῷ οὐρανῷ
  choice: स्वर्ग में
  rationale: यह मन्दिर को पृथ्वी पर नहीं, स्वर्गीय क्षेत्र में स्थित बताता है; ‘स्वर्ग में’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: स्वर्गीय पवित्रस्थान की उपासना-संबंधी छवि
  choice: ‘स्वर्ग में गवाही के तम्बू का मन्दिर’ के रूप में संयुक्त पदबंध को बनाए रखा गया है।
  alternative: ‘स्वर्गीय पवित्रस्थान’ अथवा ‘स्वर्ग में मन्दिर, अर्थात् गवाही का तम्बू’
  rationale: यूनानी पाठ में एक के बाद एक संबंधकारक पद पुराने नियम के तम्बू और प्रकाशितवाक्य के स्वर्गीय मन्दिर—दोनों की छवियाँ एक साथ रखते हैं। सरल व्याख्यात्मक रूप देने से यह तनाव और अंतर्पाठीय गूँज घट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरम्भ और मध्य में ‘और’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि यह मूल यूनानी की क्रमिक, संयोजक दर्शन-कथा शैली को प्रतिबिम्बित करती है। ‘मन्दिर’ और ‘तम्बू’ दोनों को बनाए रखकर मूल की असामान्य किन्तु अर्थपूर्ण उपासना-संबंधी छवि को सरल करके मिटाया नहीं गया।
