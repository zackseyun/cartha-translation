  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξῆλθον οἱ ἑπτὰ ἄγγελοι οἱ ἔχοντες τὰς ἑπτὰ πληγὰς ἐκ τοῦ ναοῦ, ⸀ἐνδεδυμένοι ⸀λίνον καθαρὸν λαμπρὸν καὶ περιεζωσμένοι περὶ τὰ στήθη ζώνας χρυσᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/015/006.yaml
  text: And the seven angels who had the seven plagues came out from the sanctuary[a], clothed in clean, bright linen[c][b], and wrapped around the chest with golden sashes.
translation:
  language: hi
  text: और वे सात स्वर्गदूत, जिनके पास वे सात विपत्तियाँ थीं, पवित्रस्थान[a] से बाहर निकले। वे स्वच्छ और चमकदार लिनन के वस्त्र पहने हुए थे और उनकी छातियों के चारों ओर सोने के पटुके बँधे हुए थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन्दिर”; यहाँ यूनानी शब्द ναός है, जो प्रायः पूरे मन्दिर-परिसर के बजाय उसके भीतरी पवित्रस्थान को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “वे अपनी छातियों के चारों ओर सोने के पटुके बाँधे हुए थे।”
    reason: translation_clarity
lexical_decisions:
- source_word: ἐξῆλθον
  choice: बाहर निकले
  rationale: क्रिया बाहर की ओर गति बताती है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: ἄγγελοι
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य के स्वर्गीय दर्शन में यहाँ अलौकिक दूत अभिप्रेत हैं।
- source_word: πληγάς
  choice: महामारियाँ
  rationale: इस पुस्तक में यह शब्द परमेश्वर की ओर से आने वाली विनाशकारी विपत्तियों के लिए प्रयुक्त होता है; हिन्दी बाइबलीय प्रयोग में ‘महामारियाँ’ परिचित है।
- source_word: ναοῦ
  choice: पवित्रस्थान
  rationale: ναός पूरे मन्दिर-परिसर की अपेक्षा उसके भीतरी पवित्र भाग को अधिक विशिष्ट रूप से दर्शाता है।
- source_word: ἐνδεδυμένοι
  choice: पहने हुए थे
  rationale: पूर्ण कृदन्त स्वर्गदूतों की वस्त्रधारी अवस्था बताता है; यह वर्तमान हिन्दी में सहज है।
- source_word: λίνον
  choice: मलमल
  rationale: यह सन से बने लिनन-वस्त्र को दर्शाता है; ‘मलमल’ हिन्दी पाठक के लिए हलके, उत्तम वस्त्र का स्वाभाविक नाम है, जबकि ‘सन का वस्त्र’ अधिक शाब्दिक विकल्प है।
- source_word: καθαρὸν λαμπρὸν
  choice: स्वच्छ और चमकदार
  rationale: दोनों विशेषणों को अलग रखते हुए καθαρός की स्वच्छता और λαμπρός की दीप्ति सुरक्षित रखी गई है।
- source_word: περιεζωσμένοι περὶ τὰ στήθη
  choice: उनकी छातियों पर ... बँधे थे
  rationale: वाक्यांश छाती के चारों ओर बाँधे होने की अवस्था बताता है; हिन्दी में ‘छातियों पर ... बँधे’ चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ζώνας χρυσᾶς
  choice: सोने के पटुके
  rationale: ζώνη कमरबन्द, पटुका या चौड़ी पट्टी हो सकती है; छाती पर बाँधे जाने के कारण ‘पटुके’ ‘पेटियों’ से अधिक उपयुक्त है।
theological_decisions:
- issue: स्वर्गीय मन्दिर के प्रसंग में ναός का अनुवाद
  choice: पवित्रस्थान
  alternative: मन्दिर
  rationale: ‘पवित्रस्थान’ भीतरी पवित्र धाम का विशिष्ट अर्थ बनाए रखता है और उसे पूरे मन्दिर-परिसर के अर्थ में समतल नहीं करता।
- issue: καθαρός में भौतिक अथवा नैतिक शुद्धता
  choice: स्वच्छ
  alternative: शुद्ध
  rationale: मूल शब्द दोनों अर्थ दे सकता है। वस्त्र-वर्णन में ‘स्वच्छ’ सीधा अर्थ देता है, जबकि ‘शुद्ध’ की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। दो वाक्यों में विभाजन से लम्बी यूनानी संरचना स्पष्ट होती है। ‘पवित्रस्थान’, ‘स्वर्गदूत’ और ‘पटुके’ बाइबलीय दृश्य की गंभीरता बनाए रखते हैं; वास्तविक शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
