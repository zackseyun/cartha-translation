  text: Καὶ ὅτε ἤνοιξεν τὴν ⸂σφραγῖδα τὴν δευτέραν⸃, ἤκουσα τοῦ δευτέρου ζῴου λέγοντος· Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/003.yaml
  text: And when he opened the second seal[a], I heard the second living creature saying, “Come.”
translation:
  language: hi
  text: और जब उसने दूसरी मुहर[a] खोली, तो मैंने दूसरे जीवित प्राणी को यह कहते सुना, “आ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जा!” कुछ लोग इसे सामने आने के बुलावे के बजाय घुड़सवार को दिया गया आदेश समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: पूर्ववर्ती घटना से कथात्मक प्रवाह जोड़ने वाला सामान्य संयोजक।
- source_word: ὅτε
  choice: जब
  rationale: यह अगली घटना का समय बताने वाला संयोजक है; ‘जब’ स्वाभाविक और मूल के निकट है।
- source_word: ἤνοιξεν
  choice: उसने ... खोली
  rationale: ἀνοίγω का सीधा अर्थ ‘खोलना’ है; ‘मुहर तोड़ी’ कहना मूल क्रिया से अधिक व्याख्यात्मक होता।
- source_word: σφραγῖδα τὴν δευτέραν
  choice: दूसरी मुहर
  rationale: यूनानी पदबंध का स्वाभाविक हिन्दी रूप, जिसमें क्रमसूचक बल सुरक्षित रहता है।
- source_word: ἤκουσα
  choice: मैंने ... सुना
  rationale: कथात्मक प्रसंग में ἀκούω का सरल और सीधा अनुवाद।
- source_word: τοῦ δευτέρου ζῴου
  choice: दूसरे जीवित प्राणी को
  rationale: प्रकाशितवाक्य में ζῷον सिंहासन के पास के विशिष्ट सजीव प्राणियों के लिए है; ‘जीवित प्राणी’ इसे साधारण पशु समझे जाने से बचाता है।
- source_word: λέγοντος
  choice: यह कहते
  rationale: श्रवण-क्रिया पर निर्भर वर्तमान कृदन्त को सहज हिन्दी संरचना में व्यक्त करता है।
- source_word: Ἔρχου
  choice: आ!
  rationale: ἔρχομαι की द्वितीय पुरुष एकवचन आज्ञा का सबसे सीधा हिन्दी रूप; संबोधित व्यक्ति पुरुषवाचक है या नहीं, यह स्पष्ट किए बिना ‘आ’ मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: मुहर खोले जाने के सूत्र में Ἔρχου का अर्थ और संबोधन
  choice: आ!
  alternative: जा!
  rationale: यूनानी आज्ञा का सामान्य शाब्दिक अर्थ ‘आ’ है। प्रसंग में आदेश किसे दिया गया है—आगे आने के लिए किसी को बुलाया गया है या घुड़सवार को जाने का आदेश है—इस पर मतभेद है; इसलिए मुख्य पाठ में मूल अर्थ और पादटिप्पणी में प्रसंगगत विकल्प रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली। ‘जीवित प्राणी’ प्रकाशितवाक्य के सिंहासन-दृश्य की पारिभाषिक निरंतरता बनाए रखता है।
