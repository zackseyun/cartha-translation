source:
  edition: SBLGNT
  text: ὅτι ἦλθεν ἡ ἡμέρα ἡ μεγάλη τῆς ὀργῆς ⸀αὐτῶν, καὶ τίς δύναται σταθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/017.yaml
  text: because the great day of their wrath has come[a], and who is able to stand?
translation:
  language: hi
  text: क्योंकि उनके क्रोध का वह महान दिन आ पहुँचा है[a], और कौन खड़ा रह सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ व्याख्यात्मक अनुवादों में ‘उसका क्रोध’ मिलता है; पर यूनानी पाठ में ‘उनका क्रोध’ है, जो सिंहासन पर विराजमान व्यक्ति और मेम्ने, दोनों की ओर संकेत करता है।
    reason: यूनानी बहुवचन सर्वनाम αὐτῶν को स्पष्ट करना और एकवचन करने वाली व्याख्यात्मक प्रस्तुति से उसका भेद दिखाना।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद में बताए गए भय का कारण प्रस्तुत करता है; आधुनिक हिन्दी में स्पष्ट और स्वाभाविक कारणसूचक संयोजक।
- source_word: ἦλθεν
  choice: आ पहुँचा है
  rationale: अओरिस्ट क्रिया यहाँ उस घटना के घटित हो जाने और उसके वर्तमान निर्णायक परिणाम को व्यक्त करती है; ‘आ पहुँचा है’ उस आसन्न-से अब उपस्थित हुए दिन की गंभीरता बनाए रखता है।
- source_word: ἡ ἡμέρα ἡ μεγάλη
  choice: महान दिन
  rationale: विशेषण की गंभीर, युगांतकारी शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῆς ὀργῆς
  choice: प्रकोप
  rationale: न्याय के संदर्भ में यह साधारण क्रोध से अधिक प्रबल और दण्डात्मक भाव व्यक्त करता है।
- source_word: αὐτῶν
  choice: उनके
  rationale: यूनानी बहुवचन सर्वनाम को सुरक्षित रखता है, जो पिछले पद में सिंहासन पर विराजमान और मेम्ने—दोनों—की ओर संकेत करता है।
- source_word: τίς δύναται σταθῆναι
  choice: कौन खड़ा रह सकता है?
  rationale: अलंकारिक प्रश्न को सहज किन्तु गरिमापूर्ण हिन्दी में प्रस्तुत करता है; ‘खड़ा रहना’ न्याय का सामना करके टिके रहने का निहित भाव भी रखता है।
theological_decisions:
- issue: ‘प्रकोप’ के साथ बहुवचन सर्वनाम, जो सिंहासन पर विराजमान और मेम्ने की ओर संकेत करता है
  choice: ‘उनके प्रकोप’ को बनाए रखा
  alternative: ‘उसके प्रकोप’ द्वारा एकवचन दैवी कर्तृत्व के अनुरूप करना
  rationale: यूनानी पाठ स्पष्ट रूप से αὐτῶν (‘उनके’) पढ़ता है। इसे एकवचन में बदलने के बजाय पाठ की व्याकरणिक और धर्मवैचारिक तनावपूर्ण अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज और गरिमापूर्ण रखी गई है। ‘प्रकोप’ न्याय-संबंधी गंभीरता व्यक्त करता है, और ‘खड़ा रह सकता है’ मूल रूपक तथा अलंकारिक प्रश्न दोनों को बनाए रखता है।
