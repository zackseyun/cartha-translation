source:
  edition: SBLGNT
  text: καὶ ἐξῆλθεν ἄλλος ἵππος πυρρός, καὶ τῷ καθημένῳ ἐπ’ αὐτὸν ἐδόθη αὐτῷ λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς ⸀καὶ ἵνα ἀλλήλους ⸀σφάξουσιν, καὶ ἐδόθη αὐτῷ μάχαιρα μεγάλη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/004.yaml
  text: And another horse came out[a], fiery red; and to the one sitting on it, it was given to take peace from the earth, so that they would slaughter one another[c][b], and a great sword was given to him.
translation:
  language: hi
  text: एक और घोड़ा निकला, जो अग्नि-सा लाल था[a]। उस पर बैठे हुए को यह दिया गया कि वह पृथ्वी[b] से शांति छीन ले, ताकि लोग एक-दूसरे का वध करें[c]; और उसे एक बड़ी तलवार दी गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लाल घोड़ा।” यूनानी विशेषण πυρρός विशेष रूप से आग-जैसे लाल रंग का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या “देश” अथवा “भूमि।” यूनानी γῆ के ये अर्थ भी हो सकते हैं; यहाँ प्रकाशितवाक्य के व्यापक विश्वव्यापी संदर्भ के कारण “पृथ्वी” रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ अनूदित “वध करें” वाला यूनानी क्रिया-शब्द साधारण “मार डालें” से अधिक प्रबल है और हिंसक रक्तपात का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος
  choice: एक और
  rationale: दर्शन के क्रम में यह पिछले घोड़े से भिन्न अगले घोड़े को सूचित करता है; आधुनिक हिन्दी में ‘एक और’ स्वाभाविक है।
- source_word: ἵππος πυρρός
  choice: घोड़ा, जो आग के समान लाल था
  rationale: πυρρός केवल सामान्य लाल रंग नहीं, बल्कि आग-जैसे लाल रंग का बोध कराता है; इस वर्णन से मूल की सजीव छवि बनी रहती है।
- source_word: τῷ καθημένῳ ἐπ’ αὐτὸν
  choice: उस पर बैठे हुए को
  rationale: मूल के कृदन्तीय वाक्यांश को बनाए रखा गया है और अधिक व्याख्यात्मक ‘सवार’ नहीं जोड़ा गया।
- source_word: ἐδόθη αὐτῷ
  choice: उसे यह दिया गया
  rationale: निष्क्रिय प्रयोग मूल की शैली और अनकहे दाता को बनाए रखता है; ‘अधिकार’ या ‘सामर्थ्य’ जैसा शब्द नहीं जोड़ा गया।
- source_word: λαβεῖν τὴν εἰρήνην ἐκ τῆς γῆς
  choice: पृथ्वी पर से शान्ति उठा ले
  rationale: ‘उठा लेना’ λαμβάνω और ἐκ के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है। प्रकाशित पाठ में व्यापक अपोकलिप्टिक सन्दर्भ के अनुरूप γῆ के लिए ‘पृथ्वी’ चुना गया है।
- source_word: ἵνα ἀλλήλους σφάξουσιν
  choice: ताकि लोग एक-दूसरे का वध करें
  rationale: ἵνα उद्देश्य अथवा परिणाम की सम्भावित छाया बनाए रखता है। σφάζω साधारण ‘मारना’ से अधिक हिंसक है, इसलिए ‘वध करना’ चुना गया। हिन्दी में कर्ता स्पष्ट करने के लिए ‘लोग’ निहित बहुवचन से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: μάχαιρα μεγάλη
  choice: एक बड़ी तलवार
  rationale: μάχαιρα तलवार या बड़े छुरे का बोध करा सकता है; इस दर्शन की युद्ध-संबंधी छवि में ‘तलवार’ स्पष्ट और स्वाभाविक है, और μεγάλη को ‘बड़ी’ से व्यक्त किया गया है।
theological_decisions:
- issue: दोनों ἐδόθη खण्डों में दैवी निष्क्रिय प्रयोग
  choice: ‘यह दिया गया’ और ‘दी गई’ के निष्क्रिय रूप बनाए रखना, दाता का नाम न लेना
  alternative: ‘परमेश्वर ने उसे दिया’ अथवा ‘उसे अधिकार दिया गया’
  rationale: प्रकाशितवाक्य में यह निष्क्रिय शैली परमेश्वर की सार्वभौम अनुमति का संकेत दे सकती है, पर मूल यहाँ दाता को स्पष्ट नहीं करता। निष्क्रिय रूप इस धार्मिक तनाव और साहित्यिक पुनरावृत्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘शान्ति उठा ले’ और दोहराए गए निष्क्रिय रूप मूल की संरचना तथा प्रकाशितवाक्य की शैली को यथासम्भव सुरक्षित रखते हैं।
