id: REV.6.14
reference: Revelation 6:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ οὐρανὸς ἀπεχωρίσθη ὡς βιβλίον ἑλισσόμενον, καὶ πᾶν ὄρος καὶ νῆσος ἐκ τῶν τόπων αὐτῶν ἐκινήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/014.yaml
  text: And the sky vanished like a scroll being rolled up[c][b][a], and every mountain and island was moved from its place.
translation:
  language: hi
  text: और आकाश हट गया[a], जैसे कोई पुस्तक[b] लपेटी जा रही हो; और हर पहाड़ और हर द्वीप अपने-अपने स्थानों से हटा दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “अलग हो गया” या “पीछे हट गया” भी हो सकता है; यूनानी क्रिया अलग होने अथवा हट जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पुस्तक” से लपेटकर रखी जाने वाली प्राचीन लिखित कुण्डली अभिप्रेत है, न कि आधुनिक जिल्दबंद पुस्तक।
    reason: cultural_note
lexical_decisions:
- source_word: οὐρανὸς
  choice: आकाश
  rationale: इस प्रलय-दर्शी दृश्य में पृथ्वी के ऊपर दिखाई देने वाला आकाश अभिप्रेत है; ‘स्वर्ग’ कहने से परमेश्वर के निवास के विषय में अनावश्यक धार्मिक अर्थ जुड़ सकता है।
- source_word: ἀπεχωρίσθη
  choice: हट गया
  rationale: यह क्रिया अलग होने, हटने या पीछे चले जाने का भाव दे सकती है। ‘हट गया’ दृश्य की गति को स्वाभाविक हिन्दी में व्यक्त करता है और पूर्ण विनाश का अर्थ आरोपित नहीं करता।
- source_word: βιβλίον
  choice: पुस्तक-कुण्डली
  rationale: पहली शताब्दी में यहाँ आधुनिक जिल्दबंद पुस्तक नहीं, लपेटकर रखी जाने वाली लिखित कुण्डली अभिप्रेत है।
- source_word: ἑλισσόμενον
  choice: लपेटी जा रही हो
  rationale: वर्तमान कृदन्त लपेटे जाने की चलती हुई क्रिया दिखाता है; यह हिन्दी रूप उस दृश्यात्मक उपमा को बनाए रखता है।
- source_word: πᾶν ὄρος καὶ νῆσος
  choice: हर पहाड़ और हर द्वीप
  rationale: एकवचन संज्ञाओं के साथ πᾶν का वितरणात्मक बल है; हिन्दी में दोनों पदों के साथ ‘हर’ दोहराने से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: ἐκ τῶν τόπων αὐτῶν
  choice: अपने-अपने स्थान से
  rationale: यूनानी में शाब्दिक रूप से ‘उनके स्थानों से’ है। हिन्दी का ‘अपने-अपने’ प्रत्येक पहाड़ और द्वीप के अपने स्थान से हटने का वितरणात्मक भाव स्पष्ट करता है।
- source_word: ἐκινήθησαν
  choice: हटा दिए गए
  rationale: यह निष्क्रिय क्रिया यहाँ केवल कांपने के बजाय अपने स्थान से विस्थापित किए जाने को बताती है, जैसा कि अगले वाक्यांश से स्पष्ट है।
theological_decisions:
- issue: प्रलय-दर्शी ब्रह्मांडीय चित्र में οὐρανός का अर्थ
  choice: ‘आकाश’
  alternative: ‘स्वर्ग’
  rationale: दृश्य में दिखाई देने वाले आकाश का ब्रह्मांडीय परिवर्तन सामने है। ‘आकाश’ मूल बिंब को रखता है और परमेश्वर के निवास के बदलने का सिद्धान्त अनावश्यक रूप से नहीं जोड़ता।
- issue: आकाश के साथ होने वाली क्रिया का स्वरूप
  choice: ‘हट गया’
  alternative: ‘अलग हो गया’ या ‘लुप्त हो गया’
  rationale: ἀπεχωρίσθη अलग होने या हट जाने का अर्थ दे सकता है। ‘हट गया’ इस अर्थ-सीमा को पर्याप्त रूप से खुला रखता है और इसे न तो निश्चित रूप से फटने, न ही अस्तित्व मिट जाने के रूप में तय करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दृश्यात्मक रखी गई है। ‘पुस्तक-कुण्डली’ अपेक्षाकृत कम प्रचलित किंतु अर्थ-स्पष्ट सांस्कृतिक पद है, इसलिए संक्षिप्त पाद-टिप्पणी दी गई है। ‘अपने-अपने स्थान से’ स्वाभाविक हिन्दी में यूनानी बहुवचन का वितरणात्मक अर्थ व्यक्त करता है।
