  terminology: ‘आकाश,’ ‘पुस्तक,’ ‘पहाड़,’ and ‘द्वीप’ are appropriate in register. The cultural footnote adequately specifies that βιβλίον here denotes an ancient scroll. No doctrinally loaded terminology is introduced.
