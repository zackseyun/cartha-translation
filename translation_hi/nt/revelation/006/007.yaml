id: REV.6.7
reference: Revelation 6:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν τετάρτην, ἤκουσα ⸀φωνὴν τοῦ τετάρτου ζῴου λέγοντος· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/007.yaml
  text: And when he opened the fourth seal[a], I heard the voice of the fourth living creature saying, “Come.”
translation:
  language: hi
  text: और जब उसने चौथी मुहर खोली, तो मैंने चौथे जीवित प्राणी की आवाज़ सुनी, जो कह रही थी, “आ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “आगे बढ़!” यूनानी में अधिक शाब्दिक रूप से “आ!” है, लेकिन इस विषय में मतभेद है कि यह आज्ञा यूहन्ना को दी गई है या घुड़सवार को।
    reason: alternative_reading
lexical_decisions:
- source_word: ἤνοιξεν
  choice: खोली
  rationale: ἀνοίγω के सामान्य अर्थ ‘खोलना’ को व्यक्त करता है और पुस्तक की मुहर खोले जाने के प्रकाशन-वाक्यांश में स्वाभाविक है।
- source_word: σφραγῖδα
  choice: मुहर
  rationale: प्रकाशितवाक्य 6 में यह पुस्तक पर लगी उस मुहर को दर्शाता है जिसे खोला जाता है; आधुनिक हिन्दी में ‘मुहर’ सटीक और प्रचलित शब्द है।
- source_word: τετάρτην / τετάρτου
  choice: चौथी / चौथे
  rationale: दोनों क्रमवाचक रूपों का लिंग और कारक के अनुसार स्वाभाविक हिन्दी रूप रखा गया है।
- source_word: φωνὴν
  choice: आवाज़
  rationale: यहाँ φωνή का अर्थ बोलती हुई आवाज़ है; संबंधवाचक पद ‘चौथे जीवित प्राणी की’ उसे निश्चित करता है।
- source_word: ζῴου
  choice: जीवित प्राणी
  rationale: प्रकाशितवाक्य में ζῷον सिंहासन के पास के सजीव प्राणियों के लिए प्रयुक्त है; ‘जीवित प्राणी’ इसे साधारण पशु और θηρίον से अलग रखता है।
- source_word: λέγοντος
  choice: यह कहते
  rationale: वर्तमान कृदंत को ‘आवाज़ को यह कहते सुना’ के रूप में देना हिन्दी में अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: Ἔρχου
  choice: आ!
  rationale: एकवचन वर्तमान आज्ञार्थक का सीधा अर्थ ‘आ’ है। इससे सम्बोधित व्यक्ति की पहचान जोड़े बिना यूनानी पाठ की संक्षिप्त आज्ञा बनी रहती है।
theological_decisions:
- issue: Ἔρχου की आज्ञा किससे कही गई है
  choice: केवल “आ!” रखा गया है; सम्बोधित व्यक्ति निर्दिष्ट नहीं किया गया।
  alternative: इसे यूहन्ना से कही आज्ञा मानना, या घुड़सवार को ‘आगे निकल’ कहना।
  rationale: यूनानी पाठ आज्ञा का सम्बोधित व्यक्ति स्पष्ट नहीं करता। अनुवाद में उसे जोड़ना कथात्मक और धर्मवैचारिक अस्पष्टता को अनावश्यक रूप से सुलझा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जीवित प्राणी’ प्रकाशितवाक्य की स्थापित वैचारिक भिन्नता बनाए रखता है। मुख्य पाठ में संक्षिप्त ‘आ!’ मूल आज्ञा की तीव्रता और अस्पष्टता दोनों को सुरक्षित रखता है।
