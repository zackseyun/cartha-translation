id: REV.6.11
reference: Revelation 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐδόθη αὐτοῖς ἑκάστῳ στολὴ λευκή, καὶ ἐρρέθη αὐτοῖς ἵνα ⸀ἀναπαύσονται ἔτι χρόνον ⸀μικρόν, ἕως ⸀πληρωθῶσιν καὶ οἱ σύνδουλοι αὐτῶν καὶ οἱ ἀδελφοὶ ⸀αὐτῶν οἱ μέλλοντες ⸀ἀποκτέννεσθαι ὡς καὶ αὐτοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/011.yaml
  text: And a white robe was given to each of them[a], and they were told that they should rest a little longer, until their fellow servants and their brothers, who are about to be killed just as they were[c][b], should also be completed.
translation:
  language: hi
  text: और उनमें से हर एक को सफ़ेद चोग़ा दिया गया, और उनसे कहा गया कि वे थोड़ी देर और विश्राम करें, जब तक कि उनके संगी दास और उनके भाई[b], जो उन्हीं की तरह मारे जाने वाले हैं, भी पूर्ण न हो जाएँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूर्ण न हो जाएँ” का अनुवाद “पूर्ण किए जाएँ” या “उनकी पूरी संख्या न हो जाए” भी हो सकता है। यूनानी पाठ केवल “पूर्ण किए जाएँ/पूर्ण हों” कहता है; उसमें “संख्या” शब्द नहीं है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “भाई” व्यापक रूप से साथी विश्वासियों के लिए प्रयुक्त हो सकता है, जिनमें स्त्रियाँ भी सम्मिलित हों; यूनानी में पुल्लिंग बहुवचन शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στολὴ λευκή
  choice: एक सफ़ेद चोग़ा
  rationale: στολή लंबे बाहरी वस्त्र या चोग़े को दर्शाता है; ‘चोग़ा’ सामान्य पाठक के लिए स्पष्ट है और λευκή का सीधा अर्थ ‘सफ़ेद’ है।
- source_word: ἑκάστῳ
  choice: उनमें से हर एक को
  rationale: एकवचन वितरणात्मक भाव को स्वाभाविक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: ἐρρέθη αὐτοῖς
  choice: उनसे कहा गया
  rationale: यूनानी कर्मवाच्य को बिना कर्ता जोड़े हिन्दी में सुरक्षित रखता है।
- source_word: ἀναπαύσονται ἔτι χρόνον μικρόν
  choice: वे थोड़े समय और विश्राम करें
  rationale: ἀναπαύω के ‘विश्राम करने’ के अर्थ तथा ἔτι χρόνον μικρόν की अतिरिक्त अल्प अवधि—दोनों को बनाए रखता है।
- source_word: πληρωθῶσιν
  choice: पूरे न हो जाएँ
  rationale: यह πληρόω के कर्मवाच्य ‘पूरा किया जाना/पूरा होना’ को सामान्य रखता है और मूल में अनुपस्थित ‘संख्या’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: σύνδουλοι
  choice: संगी दास
  rationale: σύνδουλος एक ही स्वामी के अधीन सह-दास को दर्शाता है; ‘संगी दास’ उस साझा दासत्व-संबंध को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: ἀδελφοὶ
  choice: भाई
  rationale: मूल का पुल्लिंग बहुवचन रूप सुरक्षित है; व्यापक विश्वासी समुदाय की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: οἱ μέλλοντες ἀποκτέννεσθαι
  choice: जिन्हें ... मार डाला जाना है
  rationale: μέλλω के भावी/आसन्न भाव को रखता है, पर ‘नियति में ठहराए गए’ जैसा अधिक प्रबल निर्धारणवादी अर्थ नहीं जोड़ता।
- source_word: ὡς καὶ αὐτοί
  choice: उन्हीं की तरह
  rationale: तुलना वेदी के नीचे की उन आत्माओं से है जिन्हें पहले मार डाला गया था; हिन्दी में यह संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: πληρωθῶσιν का व्यक्तियों के विषय में अर्थ
  choice: ‘पूरे न हो जाएँ’—समूह के पूरा होने का सामान्य भाव
  alternative: ‘उनकी पूरी संख्या न हो जाए’ अथवा ‘पूरे न किए जाएँ’
  rationale: यूनानी पाठ में ‘संख्या’ शब्द नहीं है। सामान्य अभिव्यक्ति मूल की वास्तविक अस्पष्टता बचाती है, जबकि सन्दर्भ में संख्या पूरी होने का अर्थ सम्भव रहता है।
- issue: ἀδελφοί का सम्भावित मिश्रित-लिंग सन्दर्भ
  choice: मुख्य पाठ में ‘भाई’
  alternative: ‘भाई-बहन’ अथवा ‘विश्वासी भाई-बहन’
  rationale: मूल का व्याकरणिक पुल्लिंग रूप रखा गया है; आरम्भिक मसीही प्रयोग में व्यापक समावेश की सम्भावना पादटिप्पणी में दी गई है।
- issue: σύνδουλοι में दासत्व का रूपक
  choice: ‘संगी दास’
  alternative: ‘संगी सेवक’ अथवा ‘सहकर्मी सेवक’
  rationale: यह शब्द समान स्वामी के अधीन दास होने का सम्बन्ध व्यक्त करता है; ‘सेवक’ उस सामाजिक और स्वामित्व-संबंधी बल को कम कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध कथात्मक रूप। कर्मवाच्य और पाठ की अस्पष्टता सुरक्षित रखी गई है। ‘सफ़ेद’ और ‘चोग़ा’ सामान्य आधुनिक वर्तनी तथा सहज शब्दावली के अनुसार हैं।
