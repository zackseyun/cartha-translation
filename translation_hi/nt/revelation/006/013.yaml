  yaml_path: translation/nt/revelation/006/013.yaml
  text: and the stars of heaven fell to the earth[a], as a fig tree drops its unripe figs when shaken by a strong wind,
translation:
  language: hi
  text: और आकाश के तारे पृथ्वी पर गिर पड़े, जैसे तेज़ हवा से हिलने पर अंजीर का पेड़ अपने कच्चे अंजीर[a] गिरा देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अधपके अंजीर,” “हरे अंजीर” अथवा “बेमौसम के अंजीर”; यूनानी शब्द उन अपरिपक्व अंजीरों को दर्शाता है जो पकने से पहले झड़ जाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀστέρες
  choice: तारे
  rationale: यह शब्द सामान्यतः ‘तारों’ को दर्शाता है। प्रकाशन की प्रतीकात्मक भाषा में इनका संकेतार्थ हो सकता है, पर अनुवाद स्वयं उस संकेतार्थ को निश्चित नहीं करता।
- source_word: τοῦ οὐρανοῦ
  choice: आकाश के
  rationale: οὐρανός का अर्थ ‘आकाश’ या ‘स्वर्ग’ हो सकता है। यहाँ तारों के दृश्य और स्वाभाविक हिन्दी प्रयोग के कारण ‘आकाश’ उपयुक्त है, जबकि ब्रह्मांडीय चित्र बना रहता है।
- source_word: ἔπεσαν εἰς τὴν γῆν
  choice: पृथ्वी पर गिर पड़े
  rationale: यह गति और नाटकीय पतन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पृथ्वी’ व्यापक ब्रह्मांडीय परिप्रेक्ष्य बनाए रखती है।
- source_word: συκῆ
  choice: अंजीर का पेड़
  rationale: यह संज्ञा का मानक और आम पाठकों के लिए स्पष्ट हिन्दी रूप है।
- source_word: βάλλει
  choice: गिरा देता है
  rationale: क्रिया का मूल अर्थ ‘फेंकना’ है, पर पेड़ से फल झड़ने के संदर्भ में ‘गिरा देता है’ स्वाभाविक है और हवा के प्रभाव को भी व्यक्त करता है।
- source_word: ὀλύνθους
  choice: कच्चे अंजीर
  rationale: यह शब्द ऐसे अपरिपक्व अंजीरों को सूचित करता है जो पकने से पहले झड़ जाते हैं। ‘कच्चे अंजीर’ आधुनिक हिन्दी में सबसे स्पष्ट और सहज है।
- source_word: ὑπὸ ἀνέμου μεγάλου
  choice: तेज़ हवा से
  rationale: μέγας हवा की प्रबलता बताता है; ‘तेज़ हवा’ वर्तमान हिन्दी में ‘बड़ी हवा’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: σειομένη
  choice: हिलने पर
  rationale: वर्तमान कर्मवाच्य कृदन्त अंजीर के पेड़ की परिस्थिति बताता है। ‘हिलने पर’ संक्षिप्त और स्वाभाविक है तथा हवा को कर्ता मानकर अनावश्यक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: आकाश के तारों का पृथ्वी पर गिरना—प्रकाशन-साहित्य का चित्र
  choice: ‘आकाश के तारे पृथ्वी पर गिर पड़े’ के दृश्य को बिना व्याख्यात्मक पहचान जोड़े बनाए रखा गया है।
  alternative: ‘तारों’ को स्वर्गदूतों, शासकों या अन्य प्रतीकात्मक व्यक्तियों के रूप में अनूदित करना।
  rationale: मूल पाठ दृश्य प्रस्तुत करता है, पर इस पद में उसका प्रतीकात्मक अर्थ स्पष्ट नहीं करता। शाब्दिक चित्र को बनाए रखना वास्तविक व्याख्यात्मक और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आकाश के तारे’ और ‘पृथ्वी’ प्रकाशन की ब्रह्मांडीय शैली बनाए रखते हैं, जबकि ‘तेज़ हवा,’ ‘हिलने पर’ और ‘गिरा देता है’ सहज वर्तमान हिन्दी हैं।
