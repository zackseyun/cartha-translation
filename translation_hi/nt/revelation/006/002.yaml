reference: Revelation 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος λευκός, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων τόξον, καὶ ἐδόθη αὐτῷ στέφανος, καὶ ἐξῆλθεν νικῶν καὶ ἵνα νικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/002.yaml
  text: And I looked[a], and behold, a white horse, and the one sitting on it had a bow, and a crown was given to him[b], and he went out conquering and to conquer.
translation:
  language: hi
  text: और मैंने देखा—देखो, एक सफेद घोड़ा था! उस पर बैठे हुए व्यक्ति[b] के पास एक धनुष था। उसे एक मुकुट दिया गया[a], और वह जीतता हुआ निकला और जीतने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसे विजेता की माला दी गई।’ यूनानी शब्द στέφανος प्रायः राजकीय मुकुट के बजाय विजय से जुड़ी माला या मुकुट के लिए आता है।
    reason: lexical_alternative
  - marker: b
    text: पाठ सफेद घोड़े पर बैठे व्यक्ति की पहचान नहीं बताता। उसकी पहचान के विषय में अलग-अलग व्याख्याएँ हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: εἶδον
  choice: मैंने देखा
  rationale: ὁράω के इस रूप का सीधा और स्वाभाविक हिन्दी अर्थ; दर्शन के क्रम में दृश्य अनुभव को स्पष्ट रखता है।
- source_word: ἰδοὺ
  choice: एक सफेद घोड़ा!
  rationale: ἰδού के आकस्मिक ध्यानाकर्षण और विस्मय को हिन्दी में अलग उद्गारात्मक वाक्य द्वारा व्यक्त किया गया है; शाब्दिक ‘देखो’ यहाँ कम स्वाभाविक होता।
- source_word: ἵππος λευκός
  choice: एक सफेद घोड़ा
  rationale: दर्शन में पहली बार प्रस्तुत अनिश्चित संज्ञा-समूह का सीधा अनुवाद।
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: उस पर बैठे हुए व्यक्ति
  rationale: मूल के कृदन्तीय वर्णन को बनाए रखता है और सवार की पहचान नहीं जोड़ता।
- source_word: ἔχων τόξον
  choice: के पास एक धनुष था
  rationale: ἔχω का स्वाभाविक हिन्दी रूप; τόξον को सामान्यतः ‘धनुष’ कहा गया है।
- source_word: ἐδόθη αὐτῷ στέφανος
  choice: उसे एक मुकुट दिया गया
  rationale: कर्मवाच्य को सुरक्षित रखता है और στέφανος के लिए व्यापक, परिचित शब्द चुनता है; विजय-माला का संभव अर्थ पादटिप्पणी में है।
- source_word: ἐξῆλθεν
  choice: वह ... निकला
  rationale: दृश्य में बाहर जाने/निकलने की गति का स्वाभाविक हिन्दी वर्णन।
- source_word: νικῶν
  choice: विजय प्राप्त करता हुआ
  rationale: वर्तमान कृदन्त की साथ-साथ चल रही क्रिया को दर्शाता है और νικάω के विजय पाने/जीतने के अर्थ को रखता है।
- source_word: ἵνα νικήσῃ
  choice: ताकि विजय प्राप्त करे
  rationale: ἵνα और संभावनार्थक क्रिया की प्रयोजन-सूचक शक्ति को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: सफेद घोड़े पर बैठे व्यक्ति की पहचान
  choice: अनुवाद में उसकी पहचान अनिर्दिष्ट रखी गई है।
  alternative: मसीह या मसीह-सदृश व्यक्ति; विजेता शासक या साम्राज्य; मसीह-विरोधी या छलपूर्ण विजेता
  rationale: यूनानी पाठ उस व्यक्ति के रूप और कार्य का वर्णन करता है, पर उसकी पहचान नहीं बताता; इसलिए किसी विवादित व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ἰδού की जीवंतता उद्गारात्मक वाक्य से व्यक्त हुई है। छोटे वाक्यों से बार-बार आए καί की दृश्यात्मक गति बनी रहती है, जबकि अन्तिम प्रयोजन-वाक्य को ‘ताकि’ द्वारा स्पष्ट किया गया है।
