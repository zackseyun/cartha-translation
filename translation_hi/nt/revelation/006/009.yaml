id: REV.6.9
reference: Revelation 6:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξεν τὴν πέμπτην σφραγῖδα, εἶδον ὑποκάτω τοῦ θυσιαστηρίου τὰς ψυχὰς τῶν ἐσφαγμένων διὰ τὸν λόγον τοῦ θεοῦ καὶ διὰ τὴν ⸀μαρτυρίαν ἣν εἶχον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/009.yaml
  text: And when he opened the fifth seal[b][a], I saw under the altar the souls of those who had been slaughtered because of the word of God and because of the testimony they had.
translation:
  language: hi
  text: और जब उसने पाँचवीं मुहर खोली, तो मैंने वेदी के नीचे उन लोगों की आत्माओं को देखा जिनका वध[a] परमेश्वर के वचन के कारण और उस गवाही[b] के कारण किया गया था जो उनके पास थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जिन्हें मार डाला गया था।’ यूनानी क्रिया हिंसक वध को व्यक्त करती है और यहाँ वेदी के कारण उसमें बलिदान की अनुगूँज भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘साक्षी।’ यूनानी शब्द दी गई गवाही अथवा प्रस्तुत किए गए साक्ष्य—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξεν
  choice: खोली
  rationale: मुहर खोलने के प्रकाशितवाक्य के क्रम में ἀνοίγω का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: σφραγῖδα
  choice: मुहर
  rationale: सर्वनाश-संबंधी दर्शन की इस छवि में σφραγίς का प्रचलित और स्पष्ट हिन्दी अनुवाद।
- source_word: ὑποκάτω τοῦ θυσιαστηρίου
  choice: वेदी के नीचे
  rationale: स्थान-संबंधी अर्थ और बलिदान की उपासना-संबंधी छवि दोनों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ψυχὰς
  choice: आत्माओं
  rationale: दर्शन में मृत लोगों को वेदी के नीचे देखे जाने की विशिष्ट छवि को बनाए रखता है; ‘जीवन’ या ‘व्यक्ति’ इस दृश्य की विशिष्टता को कम कर देते।
- source_word: ἐσφαγμένων
  choice: जिनका वध किया गया था
  rationale: σφάζω की हिंसक तथा संभावित बलिदानी अनुगूँज को सामान्य ‘मार डाला गया’ की अपेक्षा अधिक अच्छी तरह व्यक्त करता है।
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है; ‘के कारण’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: μαρτυρίαν
  choice: गवाही
  rationale: μαρτυρία के साक्ष्य अथवा दिए गए गवाह के अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἣν εἶχον
  choice: जो उनके पास थी
  rationale: ἔχω के सीधे अर्थ को सुरक्षित रखता है और यह व्याख्यात्मक विस्तार नहीं करता कि उन्होंने गवाही दी, थामे रखी या उस पर दृढ़ रहे।
theological_decisions:
- issue: दर्शन में ψυχὰς का स्वरूप
  choice: मुख्य पाठ में ‘आत्माओं’
  alternative: ‘प्राणों’ या ‘व्यक्तियों’
  rationale: यह यूहन्ना के दर्शन की छवि को बनाए रखता है, पर इससे मनुष्य के स्वरूप के बारे में दृश्य से आगे कोई सिद्धान्त निर्धारित नहीं किया जाता।
- issue: ἐσφαγμένων की तीव्रता और बलिदानी अनुगूँज
  choice: ‘वध किया गया था’
  alternative: ‘मार डाला गया था’
  rationale: वेदी के संदर्भ में σφάζω की प्रबल, हिंसक और संभावित बलिदानी छाया को सुरक्षित रखना उचित है, जबकि ‘बलि चढ़ाया गया’ अर्थ को आवश्यकता से अधिक निश्चित कर देता।
- issue: μαρτυρία और ἣν εἶχον का संबंध
  choice: ‘उस गवाही के कारण ... जो उनके पास थी’
  alternative: ‘उस गवाही के कारण जो उन्होंने दी थी’
  rationale: यूनानी पाठ केवल यह कहता है कि गवाही उनके पास थी; ‘उन्होंने दी थी’ संभावित आशय है, पर मुख्य पाठ में उसे अनिवार्य बनाना उचित नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य ने यूनानी की कारण-सूचक समानांतर रचना—‘वचन के कारण’ और ‘गवाही के कारण’—को बनाए रखा है। ‘आत्माओं’ और ‘वेदी’ से दर्शन की पारंपरिक छवि सुरक्षित रहती है, जबकि पादटिप्पणियाँ वास्तविक शब्दार्थगत विकल्प बताती हैं।
