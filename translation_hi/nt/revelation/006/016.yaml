id: REV.6.16
reference: Revelation 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγουσιν τοῖς ὄρεσιν καὶ ταῖς πέτραις· Πέσετε ἐφ’ ἡμᾶς καὶ κρύψατε ἡμᾶς ἀπὸ προσώπου τοῦ καθημένου ἐπὶ τοῦ θρόνου καὶ ἀπὸ τῆς ὀργῆς τοῦ ἀρνίου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/016.yaml
  text: and they say to the mountains and to the rocks[a], “Fall on us and hide us from the face of the One seated on the throne and from the wrath of the Lamb,”
translation:
  language: hi
  text: और वे पहाड़ों और चट्टानों से कहते हैं, “हम पर गिर पड़ो और हमें सिंहासन पर बैठे हुए की उपस्थिति[a] से और मेम्ने के क्रोध से छिपा लो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “सिंहासन पर बैठे हुए के मुख से।”
    reason: यूनानी πρόσωπον का शाब्दिक अर्थ ‘मुख’ है; इस प्रसंग में ‘उपस्थिति’ आधुनिक हिन्दी में अभिप्रेत अर्थ को अधिक स्वाभाविक रूप से व्यक्त करता है।
lexical_decisions:
- source_word: λέγουσιν
  choice: कहते हैं
  rationale: वर्तमानकालीन क्रिया को प्रकाशन की सजीव कथन-शैली में वर्तमान काल से व्यक्त किया गया है।
- source_word: ὄρεσιν καὶ πέτραις
  choice: पहाड़ों और चट्टानों
  rationale: ὄρος के सामान्य अर्थ ‘पहाड़’ और πέτρα के शैल-पिंड/चट्टान वाले अर्थ को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: Πέσετε ἐφ’ ἡμᾶς
  choice: हम पर गिर पड़ो
  rationale: बहुवचन आदेश की तात्कालिकता और तीव्रता को ‘गिर पड़ो’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κρύψατε ἡμᾶς
  choice: हमें ... छिपा लो
  rationale: आदेशात्मक भाव को सरल, प्रचलित हिन्दी में रखता है; ‘लो’ संकट में की गई तीव्र विनती को भी व्यक्त करता है।
- source_word: ἀπὸ προσώπου
  choice: के मुख से
  rationale: πρόσωπον के मूर्त और व्यक्तिगत ‘मुख’ वाले बिंब को मुख्य पाठ में बनाए रखा गया है; प्रसंगगत ‘उपस्थिति’ को पादटिप्पणी में दिया गया है।
- source_word: τοῦ καθημένου ἐπὶ τοῦ θρόνου
  choice: सिंहासन पर विराजमान जन
  rationale: संज्ञात्मक कृदंत और निरंतर राजकीय आसन को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ὀργῆς
  choice: प्रकोप
  rationale: न्याय-संबंधी तीव्र क्रोध को आधुनिक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοῦ ἀρνίου
  choice: मेम्ने
  rationale: प्रकाशितवाक्य में स्थापित मसीही उपाधि तथा बलिदानी नम्रता और न्यायकारी अधिकार के विरोधाभास को सुरक्षित रखता है।
theological_decisions:
- issue: सर्वनाशकारी न्याय के दो समन्वित संदर्भ
  choice: ‘सिंहासन पर विराजमान जन’ और ‘मेम्ने’ दोनों को अलग किंतु समन्वित भय और न्याय के स्रोतों के रूप में बनाए रखा गया है।
  alternative: दोनों को केवल परमेश्वर के एक सामान्य उल्लेख में मिला देना, अथवा ‘मेम्ने के प्रकोप’ को नरम कर देना।
  rationale: यूनानी पाठ ἀπό के साथ दो समन्वित पद देता है। अनुवाद उस तनाव को सुरक्षित रखता है जिसमें बलिदान से जुड़ा मेम्ना अंतिम न्याय के प्रकोप का धारक भी है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण प्रकाशनात्मक शैली। ‘विराजमान जन’ राजकीय बिंब को बनाए रखता है, और ‘प्रकोप’ न्याय की तीव्रता को सामान्य ‘क्रोध’ से अधिक स्पष्ट करता है।
