source:
  edition: SBLGNT
  text: Καὶ εἶδον ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην, καὶ σεισμὸς μέγας ἐγένετο, καὶ ὁ ἥλιος ⸂ἐγένετο μέλας⸃ ὡς σάκκος τρίχινος, καὶ ἡ σελήνη ὅλη ἐγένετο ὡς αἷμα,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/012.yaml
  text: And I saw when he opened the sixth seal[a], and there was a great earthquake, and the sun became black like sackcloth made of hair, and the whole moon became like blood,
translation:
  language: hi
  text: और मैंने देखा कि जब उसने छठी मुहर खोली, तो एक बड़ा भूकंप आया। सूर्य बालों से बने टाट[a] के समान काला हो गया, और पूरा चन्द्रमा लहू के समान हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बालों से बने खुरदरे टाट”; यहाँ ऐसे मोटे टाट का उल्लेख है जो प्रायः पशुओं के बालों से बनाया जाता था और शोक से जुड़ा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: मैंने देखा
  rationale: प्रकाशितवाक्य में यह दर्शन में देखी गई अगली घटना का स्वाभाविक परिचय है।
- source_word: ὅτε ἤνοιξεν τὴν σφραγῖδα τὴν ἕκτην
  choice: जब उसने छठी मुहर खोली
  rationale: कालसूचक ὅτε और मुहर खोलने की स्थापित छवि को सीधे तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σεισμὸς μέγας ἐγένετο
  choice: एक बड़ा भूकंप आया
  rationale: σεισμός के सामान्य अर्थ 'भूकंप' और ἐγένετο के घटनात्मक भाव को सहज आधुनिक हिन्दी में रखता है।
- source_word: ὁ ἥλιος ἐγένετο μέλας
  choice: सूर्य ... काला हो गया
  rationale: μέλας का विशिष्ट अर्थ 'काला' है; केवल 'अँधेरा' कहना इसके रंग-बोध को कमजोर कर देता।
- source_word: ὡς σάκκος τρίχινος
  choice: बालों से बने टाट के समान
  rationale: σάκκος मोटे टाट और τρίχινος बालों से बनी सामग्री को दर्शाता है; हिन्दी पाठक के लिए सामग्री का वर्णन स्पष्ट रखा गया है।
- source_word: ἡ σελήνη ὅλη
  choice: पूरा चन्द्रमा
  rationale: ὅλη के जोर को स्पष्ट रूप से बनाए रखता है कि समूचा चन्द्रमा ऐसा दिखाई दिया।
- source_word: ἐγένετο ὡς αἷμα
  choice: लहू के समान हो गया
  rationale: ὡς उपमा को चिह्नित करता है; अनुवाद यह नहीं कहता कि चन्द्रमा सचमुच लहू बन गया।
theological_decisions:
- issue: ब्रह्मांडीय चिह्नों का स्वरूप
  choice: दृश्य को उसकी प्रलय-साहित्यिक उपमाओं सहित सीधे प्रस्तुत करना
  alternative: इसे केवल शाब्दिक खगोलीय आपदा या केवल प्रतीकात्मक राजनीतिक उथल-पुथल के रूप में स्पष्ट करना
  rationale: यूनानी पाठ इन चिह्नों की व्यापक व्याख्या तय नहीं करता। इसलिए अनुवाद दृश्य की सजीवता और उसके अर्थ की वास्तविक खुली गुंजाइश दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। छोटे वाक्यों से दृश्य की गति और स्पष्टता बनी रहती है; 'लहू' बाइबिलीय गरिमा रखता है और सामान्य पाठक के लिए भी बोधगम्य है।
