id: REV.6.6
reference: Revelation 6:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἤκουσα ⸀ὡς φωνὴν ἐν μέσῳ τῶν τεσσάρων ζῴων λέγουσαν· Χοῖνιξ σίτου δηναρίου, καὶ τρεῖς χοίνικες ⸀κριθῶν δηναρίου· καὶ τὸ ἔλαιον καὶ τὸν οἶνον μὴ ἀδικήσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/006.yaml
  text: And I heard what seemed to be a voice in the midst of the four living creatures[a], saying, “A quart of wheat for a denarius, and three quarts of barley for a denarius[c][b]; and do not harm the oil and the wine.”
translation:
  language: hi
  text: और मैंने चारों जीवित प्राणियों के बीच मानो एक आवाज़ सुनी, जो कह रही थी, “एक दीनार में एक लीटर गेहूँ[a][b], और एक दीनार में तीन लीटर जौ; पर तेल और दाखरस को हानि न पहुँचाना[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी खोइनिक्स सूखी वस्तुओं का एक माप था, जो लगभग एक लीटर के बराबर था और प्रायः एक व्यक्ति के एक दिन के अनाज की मात्रा माना जाता था।
    reason: cultural_note
  - marker: b
    text: एक दीनार सामान्यतः एक मजदूर की एक दिन की मजदूरी थी; यहाँ बताई गई कीमतें भीषण अभाव को दर्शाती हैं।
    reason: cultural_note
  - marker: c
    text: या, “तेल और दाखरस को नुकसान न पहुँचाना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς φωνὴν
  choice: मानो एक आवाज़
  rationale: ὡς यहाँ सुनी गई ध्वनि को आवाज़ के समान बताता है और वक्ता की पहचान निश्चित नहीं करता; ‘मानो एक आवाज़’ इस अनुभूति और अस्पष्टता दोनों को बनाए रखता है।
- source_word: ἐν μέσῳ τῶν τεσσάρων ζῴων
  choice: चारों जीवित प्राणियों के बीच
  rationale: ἐν μέσῳ स्थान की दृष्टि से ‘बीच’ या ‘मध्य में’ है। ζῷα को ‘जीवित प्राणी’ कहना प्रकाशितवाक्य के सिंहासन के पास के प्राणियों को बाद में आने वाले विरोधी ‘पशुओं’ से अलग रखता है।
- source_word: Χοῖνιξ
  choice: एक लीटर
  rationale: χοῖνιξ लगभग एक लीटर का सूखा माप था। आधुनिक पाठक के लिए निकटतम सुबोध परिमाण मुख्य पाठ में दिया गया है, जबकि उसकी ऐतिहासिक प्रकृति पादटिप्पणी में स्पष्ट की गई है।
- source_word: σίτου
  choice: गेहूँ
  rationale: जौ के साथ स्पष्ट विरोध को बनाए रखते हुए σῖτος का प्रसंगानुकूल अर्थ ‘गेहूँ’ है।
- source_word: δηναρίου
  choice: एक दीनार में
  rationale: यह कीमत बताने वाला संबंधकारक है। हिंदी में ‘एक दीनार में’ वस्तु की अत्यधिक कीमत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τρεῖς χοίνικες κριθῶν
  choice: तीन लीटर जौ
  rationale: माप को पहले खंड के अनुरूप रखा गया है और κριθαί का अर्थ ‘जौ’ किया गया है।
- source_word: μὴ ἀδικήσῃς
  choice: हानि न पहुँचाना
  rationale: ἀδικέω का अर्थ अन्याय करना, हानि पहुँचाना या नुकसान करना हो सकता है। वस्तुओं के इस प्रसंग में ‘हानि न पहुँचाना’ व्यापक अर्थ और निषेधात्मक बल दोनों रखता है।
- source_word: τὸ ἔλαιον καὶ τὸν οἶνον
  choice: तेल और दाखमधु
  rationale: ‘तेल’ ἔλαιον का संक्षिप्त और पारंपरिक अनुवाद है, जो सामान्यतः जैतून का तेल था; ‘दाखमधु’ οἶνος को गरिमापूर्ण और स्पष्ट हिंदी में व्यक्त करता है।
theological_decisions:
- issue: सिंहासन-दर्शन में ζῴων का अनुवाद
  choice: जीवित प्राणी
  alternative: पशु
  rationale: ‘पशु’ प्रकाशितवाक्य में बाद के विरोधी पशुओं से अनचाहा संबंध पैदा कर सकता है; ‘जीवित प्राणी’ इन सिंहासन-संबंधी प्राणियों के लिए अधिक स्पष्ट है।
- issue: प्राचीन माप और मुद्रा को प्रस्तुत करने की रीति
  choice: χοῖνιξ के लिए निकट आधुनिक माप, पर δηνάριον के लिए ऐतिहासिक मुद्रा ‘दीनार’
  alternative: दोनों को लिप्यंतरित करना या दोनों को आधुनिक इकाइयों में बदलना
  rationale: लगभग एक लीटर पाठक को मात्रा समझाता है, जबकि ‘दीनार’ को बनाए रखने से प्राचीन मजदूरी और कीमत का ऐतिहासिक संदर्भ नष्ट नहीं होता।
- issue: तेल और दाखमधु की रक्षा का आशय
  choice: आदेश को बिना व्याख्यात्मक विस्तार के रखना
  alternative: इसे विलास-वस्तुओं, फसलों या किसी खास वर्ग की रक्षा के रूप में स्पष्ट करना
  rationale: मूल पाठ इन वस्तुओं को हानि न पहुँचाने का आदेश देता है, पर उसका कारण नहीं बताता; अनुवाद किसी एक प्रतीकात्मक या सामाजिक व्याख्या को थोपता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मानो’ दर्शन की अनिश्चित श्रव्य अनुभूति को बनाए रखता है। ‘दाखमधु’ सामान्य बोलचाल से कुछ ऊँचा, पर बाइबिलीय प्रसंग में समझ आने वाला शब्द है; वाक्य की आर्थिक घोषणा को संक्षिप्त और मौखिक रूप से प्रभावी रखा गया है।
