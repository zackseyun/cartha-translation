id: REV.6.5
reference: Revelation 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὅτε ἤνοιξε τὴν σφραγῖδα τὴν τρίτην, ἤκουσα τοῦ τρίτου ζῴου λέγοντος· Ἔρχου. καὶ ⸀εἶδον, καὶ ἰδοὺ ἵππος μέλας, καὶ ὁ καθήμενος ἐπ’ αὐτὸν ἔχων ζυγὸν ἐν τῇ χειρὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/005.yaml
  text: And when he opened the third seal[a], I heard the third living creature saying, “Come.” And I looked, and behold, a black horse[b], and the one sitting on it had a pair of scales in his hand.
translation:
  language: hi
  text: जब उसने तीसरी मुहर खोली, तो मैंने तीसरे जीवित प्राणी को कहते सुना, “आ!”[a] तब मैंने देखा, और देखो, एक काला घोड़ा था। उस पर बैठे हुए व्यक्ति के हाथ में एक तराजू[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आ” की आज्ञा यूहन्ना को दी गई हो सकती है, या यह घोड़े और उसके सवार को आगे आने का बुलावा हो सकती है। मूल पाठ में सम्बोधित पात्र स्पष्ट नहीं है।
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द का अर्थ “जुआ” भी हो सकता है, पर यहाँ अगले पद के संदर्भ में इसका अर्थ तौलने का तराजू जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνοιξε
  choice: खोली
  rationale: मुहर को खोलने के लिए स्वाभाविक हिन्दी प्रयोग; यूनानी क्रिया का सीधा अर्थ सुरक्षित रहता है।
- source_word: σφραγῖδα τὴν τρίτην
  choice: तीसरी मुहर
  rationale: क्रम और दर्शन के प्रमुख प्रतीक—दोनों को सीधे रूप में बनाए रखता है।
- source_word: ζῴου
  choice: जीवित प्राणी
  rationale: प्रकाशितवाक्य के सिंहासन-कक्ष के प्राणियों के लिए उपयुक्त है और इसे साधारण पशु समझे जाने से बचाता है।
- source_word: Ἔρχου
  choice: आ!
  rationale: एकवचन आज्ञार्थक की संक्षिप्त और प्रबल अभिव्यक्ति है; सम्बोधित व्यक्ति या प्राणी को मूल पाठ की तरह अनिर्दिष्ट रखती है।
- source_word: εἶδον … ἰδοὺ
  choice: मैंने देखा, और देखो
  rationale: दर्शन के क्रम और ἰδού की ध्यान आकर्षित करने वाली जीवंत शक्ति—दोनों को सुरक्षित रखता है।
- source_word: ἵππος μέλας
  choice: एक काला घोड़ा
  rationale: दर्शन के प्रतीकात्मक रंग को बिना व्याख्यात्मक विस्तार के शाब्दिक रूप में रखता है।
- source_word: ὁ καθήμενος ἐπ’ αὐτὸν
  choice: उस पर बैठे हुए व्यक्ति
  rationale: यूनानी कृदन्तीय अभिव्यक्ति को निकटता से दर्शाता है और केवल ‘सवार’ कहकर उसे अनावश्यक रूप से संक्षिप्त नहीं करता।
- source_word: ζυγὸν
  choice: एक तराजू
  rationale: अगले पद में अन्न को नापकर दिए जाने के संदर्भ में यहाँ तौलने का तराजू सर्वाधिक स्वाभाविक अर्थ है।
- source_word: ἐν τῇ χειρὶ αὐτοῦ
  choice: उसके हाथ में
  rationale: मूल पूर्वसर्गीय वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: Ἔρχου की आज्ञा किसे दी गई है
  choice: केवल “आ!” रखा गया है और सम्बोधित पात्र को अनिर्दिष्ट छोड़ा गया है।
  alternative: इसे यूहन्ना के लिए “इधर आ” या घोड़े और उसके सवार को बाहर आने का बुलावा समझा जा सकता है।
  rationale: यूनानी पाठ में सम्बोधित पात्र स्पष्ट नहीं है; अनुवाद किसी एक व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- issue: ζυγός का संदर्भगत अर्थ
  choice: तराजू
  alternative: जुआ
  rationale: शब्द के दोनों अर्थ संभव हैं, पर अगले पद में भोजन की तौल और कीमत का उल्लेख तराजू के अर्थ का प्रबल समर्थन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुकूल रूप अपनाया गया है। “देखो” से प्रकाशन-साहित्य की आकस्मिक दृश्यात्मकता बनी रहती है। आज्ञा “आ!” को संक्षिप्त रखा गया है ताकि मूल की शक्ति और अस्पष्ट सम्बोधन दोनों सुरक्षित रहें।
