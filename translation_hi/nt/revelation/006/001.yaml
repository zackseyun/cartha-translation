id: REV.6.1
reference: Revelation 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ὅτε ἤνοιξεν τὸ ἀρνίον μίαν ἐκ τῶν ἑπτὰ σφραγίδων, καὶ ἤκουσα ἑνὸς ἐκ τῶν τεσσάρων ζῴων λέγοντος ὡς φωνῇ βροντῆς· ⸀Ἔρχου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/001.yaml
  text: And I saw when the Lamb opened one of the seven seals[a], and I heard one of the four living creatures saying with a voice like thunder, “Come.”
translation:
  language: hi
  text: और मैंने देखा, जब मेमने ने सात मुहरों में से एक मुहर खोली, तब मैंने चार जीवित प्राणियों में से एक को गरज के समान आवाज़ में कहते हुए सुना, “आ!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आगे बढ़!”—यदि यह आज्ञा यूहन्ना के बजाय घुड़सवार को दी गई समझी जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀρνίον
  choice: मेमना
  rationale: प्रकाशितवाक्य में यह यीशु के लिए प्रयुक्त मसीही उपाधि है। ‘मेमना’ स्वाभाविक और स्थापित हिन्दी रूप है; लघुता का अनावश्यक भाव नहीं जोड़ा गया।
- source_word: μίαν ἐκ τῶν ἑπτὰ σφραγίδων
  choice: सात मुहरों में से एक
  rationale: यह अंशवाचक अभिव्यक्ति है; हिन्दी में यह सहज रूप एक मुहर को सात के समूह में से बताता है।
- source_word: ζῴων
  choice: जीवित प्राणियों
  rationale: यह सिंहासन के पास के अलौकिक प्राणियों को सूचित करता है, साधारण पशुओं को नहीं। ‘जीवित प्राणी’ अर्थ को स्पष्ट रखते हुए प्रचलित बाइबलीय भाषा से मेल खाता है।
- source_word: ὡς φωνῇ βροντῆς
  choice: गरज जैसी आवाज़ में
  rationale: यह आवाज़ की तुलना बादल की गरज से करता है और हिन्दी में उपमा को स्वाभाविक ढंग से बनाए रखता है।
- source_word: Ἔρχου
  choice: आ
  rationale: यूनानी आज्ञार्थक का सबसे सीधा अर्थ ‘आ’ है। संबोधित व्यक्ति स्पष्ट नहीं है, इसलिए मुख्य पाठ में उसकी पहचान नहीं जोड़ी गई।
- source_word: ὅτε
  choice: कि ... जब
  rationale: यूनानी संयोजक उस समय को सूचित करता है जब मेमने ने मुहर खोली; हिन्दी वाक्य-विन्यास में ‘देखा कि ...’ द्वारा यह संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: εἶδον
  choice: मैंने देखा
  rationale: मूल के सरल आख्यानात्मक क्रियारूप का सीधा अनुवाद है; ‘दृष्टि उठाई’ जैसी अतिरिक्त क्रिया नहीं जोड़ी गई।
- source_word: ἤκουσα
  choice: मैंने ... सुना
  rationale: ἀκούω के आख्यानात्मक भूतकाल का मानक और स्वाभाविक हिन्दी रूप है।
- source_word: λέγοντος
  choice: कहते
  rationale: कृदंत का सरल अर्थ बनाए रखता है और बोलने के ढंग को मूल से अधिक तीव्र नहीं बनाता।
theological_decisions:
- issue: Ἔρχου आज्ञा का संबोधित व्यक्ति और आशय
  choice: मुख्य पाठ में ‘आ!’ रखा गया और संबोधित व्यक्ति को अनिर्दिष्ट छोड़ा गया।
  alternative: यदि आज्ञा यूहन्ना के बजाय घुड़सवार को दी गई समझी जाए, तो ‘आगे निकल!’ अनुवाद संभव है।
  rationale: यूनानी में संबोधित व्यक्ति स्पष्ट नहीं है और क्रिया का सीधा अर्थ ‘आ’ है। मुख्य पाठ मूल की अस्पष्टता बनाए रखता है; वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आख्यान-शैली रखी गई है। ‘मेमना’, ‘मुहर’ और ‘जीवित प्राणी’ जैसे परिचित बाइबलीय पद बरकरार हैं। वाक्य में प्रवाह के लिए आरंभिक Καί को ‘फिर’ किया गया है।
