source:
  edition: SBLGNT
  text: καὶ οἱ βασιλεῖς τῆς γῆς καὶ οἱ μεγιστᾶνες καὶ οἱ χιλίαρχοι καὶ οἱ πλούσιοι καὶ οἱ ἰσχυροὶ καὶ πᾶς δοῦλος καὶ ἐλεύθερος ἔκρυψαν ἑαυτοὺς εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/015.yaml
  text: And the kings of the earth[a], and the great men, and the commanders, and the rich, and the strong, and every servant and free person[b], hid themselves in the caves and among the rocks of the mountains.
translation:
  language: hi
  text: और पृथ्वी के राजा, प्रमुख लोग, सेनापति, धनी, सामर्थी, और हर दास और स्वतंत्र व्यक्ति[a] पहाड़ों की गुफाओं और चट्टानों के बीच जा छिपे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर दास और स्वतंत्र”; यूनानी में दोनों शब्द पुल्लिंग एकवचन में हैं, पर यह युग्म प्रतिनिधिक अर्थ में सभी दास और स्वतंत्र लोगों को समेटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βασιλεῖς τῆς γῆς
  choice: पृथ्वी के राजा
  rationale: प्रकाशितवाक्य के विश्वव्यापी न्याय-संदर्भ में γῆ के लिए ‘पृथ्वी’ उपयुक्त है और पुस्तक में बार-बार आने वाले प्रयोग के अनुरूप है।
- source_word: μεγιστᾶνες
  choice: बड़े अधिकारी
  rationale: यह शब्द ऊँचे पद और सामाजिक प्रमुखता वाले लोगों को दर्शाता है। ‘बड़े अधिकारी’ आधुनिक हिन्दी में स्वाभाविक है और ‘कुलीन’ की वंशानुगत अभिजात्यता का अनावश्यक संकेत नहीं देता।
- source_word: χιλίαρχοι
  choice: सेनापति
  rationale: शाब्दिक रूप से यह एक हजार सैनिकों के अधिकारी को सूचित कर सकता है; ‘सेनापति’ सैन्य नेतृत्व को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: πλούσιοι
  choice: धनी
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का संक्षिप्त और प्रचलित हिन्दी रूप।
- source_word: ἰσχυροὶ
  choice: सामर्थी
  rationale: यह शारीरिक या सामाजिक शक्ति—दोनों का संकेत दे सकता है; ‘सामर्थी’ इस अर्थ-विस्तार को ‘बलवान’ की अपेक्षा अधिक खुला रखता है।
- source_word: πᾶς δοῦλος καὶ ἐλεύθερος
  choice: हर दास और स्वतंत्र व्यक्ति
  rationale: दास और स्वतंत्र का स्पष्ट सामाजिक विरोध δοῦλος के लिए ‘दास’ की माँग करता है। पुल्लिंग एकवचन युग्म यहाँ प्रतिनिधिक है, इसलिए ‘स्वतंत्र व्यक्ति’ समावेशी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔκρυψαν ἑαυτοὺς
  choice: जा छिपे
  rationale: εἰς के दिशात्मक भाव और आत्मवाचक क्रिया को हिन्दी की स्वाभाविक संयुक्त क्रिया ‘जा छिपे’ में व्यक्त किया गया है।
- source_word: εἰς τὰ σπήλαια καὶ εἰς τὰς πέτρας τῶν ὀρέων
  choice: पहाड़ों की गुफाओं और चट्टानों के बीच
  rationale: यह रूप गुफाओं के भीतर और पर्वतीय चट्टानों की ओट में छिपने का दृश्य सहज हिन्दी में प्रस्तुत करता है; ‘चट्टानों में’ की अस्वाभाविकता से बचता है।
theological_decisions:
- issue: δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: ἐλεύθερος के साथ प्रत्यक्ष विरोध में बंधी हुई सामाजिक स्थिति प्रमुख है; इसलिए ‘दास’ अर्थ को अधिक ठीक रूप से सुरक्षित रखता है।
- issue: πᾶς δοῦλος καὶ ἐλεύθερος में लिंग और प्रतिनिधिक बल
  choice: हर दास और स्वतंत्र व्यक्ति
  alternative: हर दास और स्वतंत्र पुरुष
  rationale: यूनानी पुल्लिंग एकवचन युग्म सामाजिक श्रेणियों का प्रतिनिधिक सूत्र है; ‘व्यक्ति’ उसके व्यापक आशय को बिना पुरुष-मात्र तक सीमित किए व्यक्त करता है।
- issue: ἰσχυροὶ में शक्ति का प्रकार
  choice: सामर्थी
  alternative: बलवान
  rationale: संदर्भ सामाजिक और शारीरिक दोनों प्रकार की शक्ति की संभावना खुली रखता है; ‘सामर्थी’ इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की गंभीर लय बनाए रखने के लिए संक्षिप्त सामाजिक पदनाम चुने गए हैं। मुख्य पाठ का [a] चिह्न ‘स्वतंत्र व्यक्ति’ पर रखा गया है, जहाँ प्रतिनिधिक लिंग संबंधी स्पष्टीकरण सबसे उपयोगी है।
