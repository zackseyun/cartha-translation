id: REV.6.10
reference: Revelation 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔκραξαν φωνῇ μεγάλῃ λέγοντες· Ἕως πότε, ὁ δεσπότης ὁ ἅγιος καὶ ἀληθινός, οὐ κρίνεις καὶ ἐκδικεῖς τὸ αἷμα ἡμῶν ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς;
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/010.yaml
  text: And they cried out with a loud voice[a], saying, “How long, Master, holy and true[b], will you refrain from judging and avenging our blood on those who dwell on the earth?”
translation:
  language: hi
  text: और उन्होंने ऊँचे स्वर से पुकारकर कहा, “हे पवित्र और सच्चे स्वामी, कब तक तू न्याय नहीं करेगा और पृथ्वी पर रहने वालों से हमारे खून का बदला नहीं लेगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκραξαν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से पुकारकर कहा
  rationale: यह स्वाभाविक हिन्दी में पुकार की तीव्रता और φωνῇ μεγάλῃ के ऊँचे स्वर—दोनों को व्यक्त करता है।
- source_word: Ἕως πότε
  choice: कब तक
  rationale: विलंबित ईश्वरीय कार्रवाई के विषय में विलापपूर्ण प्रश्न का सहज और सटीक हिन्दी रूप।
- source_word: δεσπότης
  choice: स्वामी
  rationale: ‘स्वामी’ अधिकार और अधिपत्य का भाव रखता है तथा सामान्यतः κύριος के लिए प्रयुक्त ‘प्रभु’ से शब्दगत भेद बनाए रखता है।
- source_word: ἅγιος καὶ ἀληθινός
  choice: पवित्र और सच्चे
  rationale: दोनों संबोधनात्मक विशेषणों को सीधे और स्वाभाविक रूप में सुरक्षित रखता है; ‘सच्चे’ में वास्तविकता और विश्वासयोग्यता दोनों की गुंजाइश है।
- source_word: οὐ κρίνεις καὶ ἐκδικεῖς
  choice: तू न्याय नहीं करेगा और ... बदला नहीं लेगा
  rationale: वर्तमान काल के यूनानी प्रश्न का प्रसंगगत आशय विलंबित भावी कार्रवाई की गुहार है। हिन्दी का यह रूप उस अपेक्षा और शिकायत को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ αἷμα ἡμῶν
  choice: हमारे खून
  rationale: हिंसक मृत्यु के बाइबलीय रूपक को स्पष्ट किए बिना ज्यों का त्यों बनाए रखता है।
- source_word: ἐκ τῶν κατοικούντων ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहने वालों से
  rationale: ἐκ को प्रतिशोध के लक्ष्य/स्रोत के रूप में दर्शाता है और प्रकाशितवाक्य में बार-बार आने वाले ‘पृथ्वी पर रहने वालों’ पदबंध को सुरक्षित रखता है।
theological_decisions:
- issue: δεσπότης के लिए ईश्वरीय संबोधन
  choice: स्वामी
  alternative: सर्वाधिकार-संपन्न प्रभु; प्रभु
  rationale: ‘स्वामी’ पूर्ण अधिकार का भाव व्यक्त करता है और इसे κύριος के सामान्य अनुवाद ‘प्रभु’ में विलीन नहीं करता।
- issue: शहीदों की न्याय और प्रतिशोध की पुकार
  choice: न्याय ... और हमारे खून का बदला
  alternative: न्याय ... और हमारे खून का प्रतिकार
  rationale: पाठ में न्यायिक दंड और रक्तपात के प्रतिशोध की कठोरता को नरम किए बिना रखा गया है; इसे निजी प्रतिशोध के बजाय स्वामी से की गई न्याय की याचना के रूप में प्रस्तुत किया गया है।
- issue: ἐκ के संबंध का अनुवाद
  choice: पृथ्वी पर रहने वालों से
  alternative: पृथ्वी पर रहने वालों के विरुद्ध
  rationale: ‘से ... बदला लेना’ स्वाभाविक हिन्दी है और यूनानी पदबंध के लक्ष्य/स्रोत संबंध को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दिव्य संबोधन में एकवचन ‘तू’ बाइबलीय प्रार्थना की निकटता और प्रत्यक्षता रखता है; ‘आप’ की विनम्र बहुवचन-संगति से बचकर यूनानी एकवचन को स्पष्ट रखा गया है।
