language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸂εἶδον, καὶ⸃ ἰδοὺ ἵππος χλωρός, καὶ ὁ καθήμενος ἐπάνω αὐτοῦ ὄνομα αὐτῷ ὁ Θάνατος, καὶ ὁ ᾅδης ἠκολούθει ⸂μετ’ αὐτοῦ⸃, καὶ ἐδόθη ⸀αὐτοῖς ἐξουσία ἐπὶ τὸ τέταρτον τῆς γῆς, ἀποκτεῖναι ἐν ῥομφαίᾳ καὶ ἐν λιμῷ καὶ ἐν θανάτῳ καὶ ὑπὸ τῶν θηρίων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/006/008.yaml
  text: And I looked, and behold, a pale green horse, and the name of the one seated on it was Death, and Hades was following with him. And authority was given to them over a fourth of the earth, to kill with sword and with famine and with pestilence and by the wild beasts of the earth.
translation:
  language: hi
  text: फिर मैंने देखा, और देखो, एक पीले-हरे रंग का घोड़ा था[a]। उस पर बैठे व्यक्ति का नाम मृत्यु था, और अधोलोक उसके साथ चला आ रहा था। उन्हें पृथ्वी के एक-चौथाई भाग पर अधिकार दिया गया कि वे तलवार से, अकाल से, महामारी[b] से और पृथ्वी के जंगली पशुओं के द्वारा लोगों को मार डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फीके रंग का घोड़ा।” यूनानी शब्द χλωρός का शाब्दिक अर्थ हरा अथवा पीले-हरे रंग का है; इस संदर्भ में यह रोगग्रस्त या शव-जैसी फीकी रंगत का संकेत भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मृत्यु।” पुराने नियम की न्याय-सूचियों की प्रतिध्वनि में इस शब्द का अर्थ “महामारी” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: χλωρός
  choice: मुरझाए हरे रंग का
  rationale: χλωρός हरे अथवा हरापन लिए पीले, रोगी-जैसे रंग को व्यक्त कर सकता है। यह चयन मूल रंग-बोध और प्रसंग के शव-जैसे भयावह पीलापन—दोनों को बनाए रखता है।
- source_word: ὁ καθήμενος ἐπάνω αὐτοῦ
  choice: उस पर बैठे हुए का
  rationale: यूनानी कृदन्तीय अभिव्यक्ति को निकटता से रखते हुए यह आधुनिक हिन्दी में स्वाभाविक है और केवल ‘सवार’ कहने की अपेक्षा मूल की संरचना को अधिक स्पष्ट रखती है।
- source_word: ὄνομα αὐτῷ ὁ Θάνατος
  choice: उस पर बैठे हुए का नाम मृत्यु था
  rationale: यह नामकरण की यूनानी अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: Θάνατος
  choice: मृत्यु
  rationale: यहाँ मृत्यु घोड़े पर बैठे व्यक्ति का व्यक्तिरूप नाम है; हिन्दी में संदर्भ स्वयं इस मानवीकरण को स्पष्ट करता है।
- source_word: ᾅδης
  choice: अधोलोक
  rationale: यह मृतकों के लोक को सूचित करता है, अंतिम दण्ड-स्थान के किसी विशिष्ट धार्मिक अर्थ को नहीं थोपता, और ‘मृत्यु’ से इसकी भिन्नता बनाए रखता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ-साथ
  rationale: μετά के ‘साथ’ अर्थ को सुरक्षित रखते हुए ἠκολούθει के पीछा करते आने के भाव के साथ सहज हिन्दी बनती है।
- source_word: ἐδόθη αὐτοῖς ἐξουσία
  choice: उन्हें ... अधिकार दिया गया
  rationale: ἐξουσία प्रदत्त अधिकार या अधिकार-क्षेत्र दर्शाता है। कर्मवाच्य मूल पाठ के अप्रकट कर्ता को अप्रकट ही रखता है।
- source_word: ἐπὶ τὸ τέταρτον τῆς γῆς
  choice: पृथ्वी के चौथाई भाग पर
  rationale: यह अनुपात और व्यापक भौगोलिक दायरे को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀποκτεῖναι
  choice: लोगों को मार डालें
  rationale: ‘मार डालना’ क्रिया का सीधा अर्थ देता है; ‘लोगों को’ हिन्दी में अपेक्षित कर्म को स्पष्ट करता है, यद्यपि यूनानी में वह अंतर्निहित है।
- source_word: ἐν ῥομφαίᾳ
  choice: तलवार ... के द्वारा
  rationale: ῥομφαία यहाँ मृत्यु के साधन के रूप में तलवार को दर्शाता है।
- source_word: ἐν λιμῷ
  choice: अकाल
  rationale: λιμός व्यापक खाद्य-अभाव अर्थात अकाल को दर्शाता है, केवल व्यक्तिगत भूख को नहीं।
- source_word: ἐν θανάτῳ
  choice: महामारी
  rationale: यहेजकेल 14 जैसे न्याय-सूची वाले पुराने नियम के संदर्भ में θάνατος महामारी या मरी का मुहावरेदार संकेत हो सकता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὑπὸ τῶν θηρίων τῆς γῆς
  choice: पृथ्वी के जंगली पशुओं के द्वारा
  rationale: यह ὑπό के कर्तृ/साधन भाव और θηρία के हिंसक जंगली पशुओं के अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; कब्र; नरक
  rationale: पद में व्यक्तिरूप ‘मृत्यु’ और उसके साथ आने वाले मृतकों के लोक में भेद है। ‘नरक’ अंतिम दण्ड की ऐसी धारणा जोड़ सकता है जिसे यह शब्द अपने आप अनिवार्य नहीं करता।
- issue: न्याय-सूची में ἐν θανάτῳ का अर्थ
  choice: महामारी
  alternative: मृत्यु
  rationale: पुराने नियम की न्याय-सूचियों की प्रतिध्वनि में ‘मृत्यु’ महामारी/मरी के लिए प्रयुक्त हो सकती है। ‘महामारी’ सूची को अर्थपूर्ण बनाती है, जबकि शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ ने ἰδού की दृश्यात्मक तत्परता बनाए रखी है। ‘अधोलोक’ को ‘नरक’ पर प्राथमिकता दी गई है ताकि पाठ में निहित अर्थ से अधिक धर्मसैद्धान्तिक विशिष्टता न जोड़ी जाए।
