  verdict: revise
  source_fidelity: The draft accurately preserves the adversative, the literal metonymy ‘a few names,’ the future promise of walking with Christ, and the explicit statement that they are worthy. ‘श्वेत वस्त्रों में’ is a legitimate contextual expansion of the elliptical Greek ἐν λευκοῖς, and its footnote properly preserves the underlying concision.
  naturalness: ‘अपने वस्त्र अशुद्ध नहीं किए हैं’ lacks the expected object case marker and is somewhat awkward in modern standard Hindi. ‘अपने वस्त्रों को अशुद्ध नहीं किया है’ is grammatically complete and idiomatic while retaining the purity/defilement imagery. ‘सार्दिस में तुम्हारे पास’ is more natural than ‘सार्दिस में तुम्हारे यहाँ’ for the direct-address construction.
  terminology: ‘वस्त्र,’ ‘श्वेत,’ and ‘योग्य’ fit the elevated but accessible register of प्रकाशितवाक्य. ‘अशुद्ध’ appropriately conveys defilement without forcing a narrowly visual sense; the alternative ‘मैले’ in the note supplies the more concrete clothing image.
  issues:
