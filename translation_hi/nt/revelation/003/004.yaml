    issue: Object marking and verbal agreement in the clause about garments
    rationale: In standard Hindi, ‘वस्त्र’ should be marked as the object (‘वस्त्रों को’) in this transitive perfect construction. With the object marked by को, singular ‘किया है’ is the normal agreement form.
  - severity: low
    issue: Direct-address locative phrasing
    rationale: ‘तुम्हारे पास’ is more idiomatic than ‘तुम्हारे यहाँ’ for ἔχεις (‘you have’) while retaining the location ‘सार्दिस में.’
