  text: ἀλλὰ ⸂ἔχεις ὀλίγα⸃ ὀνόματα ἐν Σάρδεσιν ἃ οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν, καὶ περιπατήσουσιν μετ’ ἐμοῦ ἐν λευκοῖς, ὅτι ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/004.yaml
  text: But you have a few names in Sardis who have not soiled their garments[a], and they will walk with me in white[c][b], because they are worthy.
translation:
  language: hi
  text: पर सार्दिस में तुम्हारे पास कुछ नाम[a] ऐसे हैं, जिन्होंने अपने वस्त्रों को अशुद्ध नहीं किया है। वे श्वेत वस्त्रों में[c] मेरे साथ चलेंगे, क्योंकि वे योग्य हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘कुछ लोग।’ यूनानी में शब्दशः ‘कुछ नाम’ है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में संक्षेप से केवल ‘श्वेत में’ है; आशय संभवतः ‘श्वेत वस्त्रों में’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: पिछली फटकार के विपरीत एक स्पष्ट विरोध दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἔχεις ὀλίγα ὀνόματα ἐν Σάρδεσιν
  choice: सार्दिस में तुम्हारे यहाँ कुछ नाम
  rationale: द्वितीय पुरुष एकवचन का सीधा संबोधन बनाए रखते हुए यूनानी के असामान्य रूपक ‘कुछ नाम’ को सुरक्षित रखता है; इसका आशय कुछ व्यक्तियों से है।
- source_word: οὐκ ἐμόλυναν τὰ ἱμάτια αὐτῶν
  choice: जिन्होंने अपने वस्त्र अशुद्ध नहीं किए हैं
  rationale: μολύνω के अशुद्ध/मलिन करने के भाव और प्रकाशितवाक्य की प्रतीकात्मक वस्त्र-छवि दोनों को गरिमापूर्ण, सुबोध हिन्दी में रखता है।
- source_word: περιπατήσουσιν μετ’ ἐμοῦ
  choice: वे मेरे साथ चलेंगे
  rationale: भविष्यकाल और साथ चलने की सजीव छवि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ἐν λευκοῖς
  choice: श्वेत वस्त्रों में
  rationale: यूनानी में विशेषण संक्षिप्त रूप से प्रयुक्त है और प्रसंग वस्त्रों का है; हिन्दी में निहित संज्ञा जोड़ने से अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: ὅτι ἄξιοί εἰσιν
  choice: क्योंकि वे योग्य हैं
  rationale: कारणसूचक ὅτι और ἄξιος के सीधे कथन को किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के बिना सुरक्षित रखता है।
theological_decisions:
- issue: ὀνόματα को ‘नाम’ या ‘लोग’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘कुछ नाम’
  alternative: ‘कुछ लोग’
  rationale: ‘नाम’ मूल का जानबूझकर चुना हुआ और प्रभावशाली लक्षणालंकार हो सकता है, जो समझौता कर चुकी कलीसिया के भीतर पहचाने गए व्यक्तियों को उभारता है; पादटिप्पणी इसका सामान्य अर्थ स्पष्ट करती है।
- issue: μολύνω की नैतिक और शुद्धता-संबंधी वस्त्र-छवि
  choice: ‘अपने वस्त्र अशुद्ध नहीं किए हैं’
  alternative: ‘अपने वस्त्र मैले नहीं किए हैं’
  rationale: ‘अशुद्ध’ नैतिक और शुद्धता-संबंधी दोनों संभावित छायाओं को बनाए रखता है, जबकि ‘मैले’ दृश्य वस्त्र-छवि को अधिक प्रत्यक्ष करता है।
- issue: ἄξιοί εἰσιν और योग्यता का धर्मवैज्ञानिक आशय
  choice: ‘वे योग्य हैं’ को सीधे बनाए रखना
  alternative: ‘वे इसके योग्य हैं’
  rationale: मूल कथन को न तो नरम किया गया है, न उससे उद्धार के व्यापक सिद्धांत के बारे में कोई अतिरिक्त निष्कर्ष जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सुबोध किंतु गरिमापूर्ण पंजीकरण अपनाया गया है। ‘नाम’, ‘वस्त्र’, ‘चलेंगे’ और ‘योग्य’ मूल की प्रमुख छवियों तथा धर्मवैज्ञानिक तनाव को बनाए रखते हैं।
