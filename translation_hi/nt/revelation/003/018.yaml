language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: συμβουλεύω σοι ἀγοράσαι ⸂παρ’ ἐμοῦ χρυσίον⸃ πεπυρωμένον ἐκ πυρὸς ἵνα πλουτήσῃς, καὶ ἱμάτια λευκὰ ἵνα περιβάλῃ καὶ μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου, καὶ κολλούριον ⸀ἐγχρῖσαι τοὺς ὀφθαλμούς σου ἵνα βλέπῃς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/018.yaml
  text: I counsel you to buy from me gold refined by fire so that you may become rich[a], and white garments so that you may clothe yourself and the shame of your nakedness may not be exposed[c][b], and eye salve to anoint your eyes so that you may see.
translation:
  language: hi
  text: मैं तुम्हें यह सलाह देता हूँ कि मुझसे आग में तपाया हुआ सोना[a], सफेद वस्त्र[b], और आँखों का मरहम[c] खरीदो, ताकि तुम धनी हो जाओ; सफेद वस्त्र पहन सको और तुम्हारे नंगेपन की लज्जा उजागर न हो; तथा मरहम अपनी आँखों पर लगाकर देख सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आग से शुद्ध किया हुआ’ अथवा ‘आग में परखा हुआ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सफेद कपड़े’; कुछ संदर्भों में अधिक विशिष्ट रूप से ‘सफेद चोगे’।
    reason: lexical_alternative
  - marker: c
    text: यह शब्द आँखों पर लगाई जाने वाली एक औषधीय तैयारी को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: συμβουλεύω σοι
  choice: मैं तुम्हें सलाह देता हूँ
  rationale: वर्तमान काल के प्रथम पुरुष कथन और संबोधित व्यक्ति, दोनों को स्पष्ट रखता है। ‘सलाह देता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और अधिकारपूर्ण परामर्श का भाव बनाए रखता है।
- source_word: ἀγοράσαι παρ’ ἐμοῦ
  choice: तुम मुझसे ... खरीदो
  rationale: παρά के संबंधकारक प्रयोग को स्रोत के अर्थ ‘मुझसे’ के रूप में सीधे व्यक्त किया गया है और खरीदने के रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: χρυσίον πεπυρωμένον ἐκ πυρός
  choice: आग में तपाया हुआ सोना
  rationale: पूर्ण निष्क्रिय कृदंत सोने की उस दशा को बताता है जो आग की प्रक्रिया से गुज़र चुका है। ‘तपाया हुआ’ शोधन और परखे जाने, दोनों संभावित अर्थछायाओं को जगह देता है।
- source_word: ἵνα πλουτήσῃς
  choice: ताकि धनी हो जाओ
  rationale: ‘हो जाओ’ धनवान अवस्था में आने के संभावित आरंभिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἱμάτια λευκά
  choice: सफेद वस्त्र
  rationale: ἱμάτια वस्त्रों के लिए व्यापक शब्द है; ‘वस्त्र’ गरिमापूर्ण है और अर्थ को विशेष रूप से ‘चोगे’ तक सीमित नहीं करता।
- source_word: ἵνα περιβάλῃ
  choice: ताकि उन्हें पहन लो
  rationale: मध्यम वाच्य के व्यक्तिगत ग्रहण के भाव को हिन्दी के स्वाभाविक ‘पहन लो’ से व्यक्त किया गया है।
- source_word: μὴ φανερωθῇ ἡ αἰσχύνη τῆς γυμνότητός σου
  choice: तुम्हारे नंगेपन की लज्जा प्रकट न हो
  rationale: निष्क्रिय क्रिया और संबंधकारक रचना को निकटता से सुरक्षित रखते हुए हिन्दी में सहज वाक्य बनाया गया है।
- source_word: κολλούριον
  choice: आँखों का मरहम
  rationale: यह आँखों पर लगाई जाने वाली औषधीय तैयारी है। ‘आँखों का मरहम’ सामान्य पाठक के लिए स्पष्ट है और अत्यधिक तकनीकी शब्दावली से बचता है।
- source_word: ἐγχρῖσαι τοὺς ὀφθαλμούς σου
  choice: उसे अपनी आँखों पर लगाओ
  rationale: क्रिया का मूल आशय मलकर या लेप करके लगाने का है। ‘लगाओ’ चिकित्सा-संदर्भ में स्वाभाविक है और अनावश्यक संस्कारगत अर्थ नहीं जोड़ता।
- source_word: ἵνα βλέπῃς
  choice: ताकि ... देख सको
  rationale: उद्देश्यसूचक ἵνα को ‘ताकि’ और देखने की समर्थता/परिणाम को स्वाभाविक हिन्दी ‘देख सको’ से व्यक्त किया गया है।
theological_decisions:
- issue: सोने, सफेद वस्त्रों और आँखों के मरहम का प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में तीनों बिंबों को उनके प्रत्यक्ष रूप में रखा गया है।
  alternative: अनुवाद में ही सोने को आत्मिक धन, वस्त्रों को धार्मिकता या शुद्धता और मरहम को आत्मिक दृष्टि बताना।
  rationale: इस पद का यूनानी पाठ इन प्रतीकों के आत्मिक संदर्भों को यहीं स्पष्ट रूप से नहीं खोलता। प्रत्यक्ष बिंब सुरक्षित रखने से पाठ की व्याख्यात्मक व्यापकता और धर्मवैचारिक तनाव बने रहते हैं।
- issue: ἐγχρῖσαι में अभिषेक-संबंधी संभावित अर्थछाया
  choice: चिकित्सकीय संदर्भ के अनुरूप ‘आँखों पर लगाओ’ रखा गया है।
  alternative: ‘आँखों का अभिषेक करो’ कहना।
  rationale: इस संदर्भ में क्रिया मरहम लगाने को बताती है। ‘अभिषेक’ हिन्दी में औपचारिक धार्मिक क्रिया का अतिरिक्त संकेत दे सकता है, जिसे पाठ यहाँ अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। समानांतर तीन वस्तुओं के लिए ‘खरीदो’ दोहराया गया है, क्योंकि यूनानी में पहले आया क्रियारूप आगे की वस्तुओं पर भी लागू होता है; हिन्दी में यह पुनरावृत्ति संबंध को स्पष्ट करती है।
