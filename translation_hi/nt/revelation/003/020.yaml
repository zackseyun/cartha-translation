  text: ἰδοὺ ἕστηκα ἐπὶ τὴν θύραν καὶ κρούω· ἐάν τις ἀκούσῃ τῆς φωνῆς μου καὶ ἀνοίξῃ τὴν θύραν, ⸀καὶ εἰσελεύσομαι πρὸς αὐτὸν καὶ δειπνήσω μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/020.yaml
  text: Look[a], I stand at the door and knock. If anyone hears my voice and opens the door, I will come in to him and dine with him[c][b], and he with me.
translation:
  language: hi
  text: देखो[a], मैं द्वार पर खड़ा हूँ और खटखटा रहा हूँ। यदि कोई मेरी आवाज़ सुने और द्वार खोले, तो मैं उसके पास भीतर प्रवेश करूँगा[b] और उसके साथ भोजन करूँगा[c], और वह मेरे साथ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, मैं द्वार पर आ खड़ा हुआ हूँ और खटखटा रहा हूँ।” यूनानी में ‘खड़ा हूँ’ के लिए पूर्णकालिक रूप वर्तमान में बनी हुई स्थिति का बोध देता है, जबकि ‘खटखटा रहा हूँ’ जारी क्रिया को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप के निकट: “मैं उसके पास प्रवेश करूँगा।” ‘उसके पास भीतर प्रवेश करूँगा’ केवल किसी स्थान में प्रवेश नहीं, बल्कि व्यक्ति की ओर संबंधपरक गमन को भी व्यक्त करता है।'
    reason: lexical_alternative
  - marker: c
    text: साथ भोजन करने की छवि घनिष्ठ, पारस्परिक संगति व्यक्त करती है। व्याख्याकारों में मतभेद है कि यह विशेष रूप से प्रभु-भोज, मन-परिवर्तन, या पुनःस्थापित संगति की ओर संकेत करती है; स्वयं पाठ इसका स्पष्ट निर्णय नहीं करता।
    reason: cross_reference
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; आधुनिक हिन्दी में ‘देखो’ तत्कालता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕστηκα
  choice: मैं ... खड़ा
  rationale: पूर्णकालिक रूप यहाँ वर्तमान स्थिति का बोध देता है; ‘खड़ा’ उस जारी अवस्था को व्यक्त करता है।
- source_word: ἐπὶ τὴν θύραν
  choice: द्वार पर
  rationale: इस प्रसंग में स्थान-संबंध को व्यक्त करने वाला स्वाभाविक और गरिमापूर्ण हिन्दी प्रयोग।
- source_word: κρούω
  choice: खटखटा रहा हूँ
  rationale: वर्तमान काल की जारी क्रिया को स्पष्ट करता है और ἕστηκα की वर्तमान अवस्था के साथ स्वाभाविक बैठता है।
- source_word: ἐάν τις
  choice: यदि कोई
  rationale: अनिश्चित और समावेशी शर्त को बिना लैंगिक सीमा के व्यक्त करता है।
- source_word: ἀκούσῃ τῆς φωνῆς μου
  choice: मेरी आवाज़ सुने
  rationale: φωνή का सीधा अर्थ ‘आवाज़’ है; यह सुनने की शर्त को सहज आधुनिक हिन्दी में रखता है।
- source_word: ἀνοίξῃ τὴν θύραν
  choice: द्वार खोले
  rationale: शर्तवाचक उपवाक्य में मूल क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: καὶ εἰσελεύσομαι πρὸς αὐτόν
  choice: तो मैं उसके पास भीतर आऊँगा
  rationale: ‘भीतर आऊँगा’ प्रवेश को और ‘उसके पास’ πρὸς αὐτόν की व्यक्तिगत, संबंधपरक दिशा को सुरक्षित रखता है। ‘तो’ हिन्दी में शर्त के परिणाम को स्पष्ट करता है।
- source_word: δειπνήσω
  choice: भोजन करूँगा
  rationale: मुख्य अथवा संध्याकालीन भोजन के भाव को सांस्कृतिक रूप से अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετ’ αὐτοῦ καὶ αὐτὸς μετ’ ἐμοῦ
  choice: उसके साथ ... और वह मेरे साथ
  rationale: मूल की दीर्घवृत्तात्मक और परस्परता पर बल देने वाली रचना को बनाए रखता है; दूसरी बार क्रिया जोड़कर पाठ को अनावश्यक रूप से नहीं भरता।
theological_decisions:
- issue: भोजन की रूपकात्मक और पारस्परिक संगति
  choice: व्यक्तिगत सहभोज की छवि को सीधे रखा गया है—‘उसके साथ भोजन करूँगा, और वह मेरे साथ।’
  alternative: इसे विशेष रूप से प्रभु-भोज, मन-परिवर्तन, या किसी विश्वासी अथवा कलीसिया के साथ पुनःस्थापित संगति के रूप में स्पष्ट करना।
  rationale: पद घनिष्ठ पारस्परिक संगति व्यक्त करता है, पर भोजन की छवि का संकेत किस विशेष धार्मिक घटना की ओर है, यह स्वयं पाठ स्पष्ट नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘द्वार’ प्रकाशन-शैली की गरिमा बनाए रखता है, जबकि ‘खटखटा रहा हूँ’ जारी क्रिया को स्वाभाविक ढंग से व्यक्त करता है। सर्वनाम के पुल्लिंग रूप से बचते हुए ‘कोई/उसके/वह’ द्वारा समावेशिता और मूल की अनिश्चितता सुरक्षित रखी गई है।
