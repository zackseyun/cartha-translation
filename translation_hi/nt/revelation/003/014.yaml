id: REV.3.14
reference: Revelation 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Λαοδικείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ Ἀμήν, ὁ μάρτυς ὁ πιστὸς ⸀καὶ ἀληθινός, ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/014.yaml
  text: 'And write to the angel of the church in Laodicea: These things says the Amen[a], the faithful and true witness[b], the beginning of the creation of God.'
translation:
  language: hi
  text: '“और लौदीकिया की कलीसिया के स्वर्गदूत[a] को लिख: ये बातें आमीन—विश्वासयोग्य और सच्चा गवाह, परमेश्वर की सृष्टि का आरम्भ[b]—कहता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेशवाहक।” यूनानी शब्द का अर्थ स्वर्गदूत या मानवीय संदेशवाहक—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर की सृष्टि का उद्गम/स्रोत,” अथवा “परमेश्वर की सृष्टि पर शासक।” यूनानी शब्द ἀρχή का अर्थ “आरम्भ,” “उद्गम” या “शासक” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य में सात कलीसियाओं को संबोधित करने वाले बार-बार आने वाले सूत्र में यह प्रचलित और स्वाभाविक अर्थ है; फिर भी यूनानी शब्द मानवीय संदेशवाहक के लिए भी प्रयुक्त हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: Τάδε λέγει
  choice: ये बातें ... कहता है
  rationale: यह भविष्यद्वाणी-संबंधी घोषणा-सूत्र को निकटता से रखते हुए हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ὁ Ἀμήν
  choice: आमीन
  rationale: यहाँ ‘आमीन’ एक विशिष्ट उपाधि है; इसका लिप्यंतरण निश्चितता और सत्य से जुड़ी इसकी इब्रानी तथा आराधनात्मक प्रतिध्वनि बनाए रखता है।
- source_word: μάρτυς
  choice: गवाह
  rationale: यह सामान्य आधुनिक हिन्दी में स्वाभाविक है और साक्ष्य देने वाले व्यक्ति का अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह उपाधि में निष्ठा और भरोसेमंदी—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀληθινός
  choice: सच्चा
  rationale: ‘विश्वासयोग्य’ के साथ यह स्वाभाविक युग्म बनाता है और वास्तविक तथा सत्य होने का भाव बनाए रखता है।
- source_word: ἀρχὴ
  choice: आरम्भ
  rationale: यह सबसे सीधा शाब्दिक अर्थ है और ‘उद्गम’ या ‘शासक’ चुनकर विवादित मसीह-संबंधी वाक्यांश का अर्थ पहले से निर्धारित नहीं करता।
- source_word: κτίσεως τοῦ θεοῦ
  choice: परमेश्वर की सृष्टि
  rationale: यह संबंधकारक रचना का सीधा, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: मसीह की उपाधि में ἡ ἀρχὴ τῆς κτίσεως τοῦ θεοῦ का अर्थ
  choice: परमेश्वर की सृष्टि का आरम्भ
  alternative: परमेश्वर की सृष्टि का उद्गम/स्रोत; परमेश्वर की सृष्टि पर शासक
  rationale: ἀρχή के अर्थ-क्षेत्र में आरम्भ, उद्गम और शासन/प्रधानता के भाव आ सकते हैं। मुख्य पाठ सबसे प्रत्यक्ष अर्थ रखता है, जबकि पादटिप्पणी अन्य संभव अर्थ देकर वास्तविक भाषिक अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘कलीसिया’ और ‘आमीन’ जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं। उपाधियों को डैश के बीच रखकर लम्बे यूनानी कर्ता-वाक्यांश को हिन्दी में स्पष्ट किया गया है।
