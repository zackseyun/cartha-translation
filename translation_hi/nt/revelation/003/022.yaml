id: REV.3.22
reference: Revelation 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/022.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: hi
  text: जिसके कान हों, वह सुने कि आत्मा कलीसियाओं से क्या कहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में शाब्दिक रूप से: ‘जिसका एक कान हो, वह सुने।’ यहाँ ‘आत्मा’ से आशय पवित्र आत्मा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हों
  rationale: यूनानी में शब्दशः एकवचन ‘जिसके एक कान हो’ है, पर हिन्दी में ‘जिसके कान हों’ सुनने की क्षमता और तत्परता का वही मुहावरेदार अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀκουσάτω
  choice: वह सुने
  rationale: तीसरे पुरुष एकवचन की आज्ञार्थक क्रिया को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τί
  choice: क्या
  rationale: आत्मा के कथन की विषय-वस्तु का परिचय देने वाला स्वाभाविक हिन्दी रूप।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रकाशितवाक्य 2–3 के आवर्ती कथन में संदर्भ पवित्र आत्मा का है; हिन्दी में आदरसूचक बड़े अक्षर की व्यवस्था न होने के कारण ‘आत्मा’ संदर्भानुसार पर्याप्त है।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमानकालीन कथन को सीधी और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ταῖς ἐκκλησίαις
  choice: कलीसियाओं से
  rationale: सम्प्रदान कारक प्राप्तकर्ताओं को सूचित करता है। हिन्दी में ‘कलीसियाओं से कहता है’ इस वाक्य-संरचना में स्वाभाविक है और प्रकाशितवाक्य 2–3 की स्थानीय मण्डलियों को दर्शाता है।
theological_decisions:
- issue: एकवचन प्रतिनिधिक अभिव्यक्ति
  choice: जिसके कान हों, वह सुने
  alternative: जिसका कान हो, वह सुने
  rationale: ‘वह’ यूनानी के प्रतिनिधिक एकवचन को बनाए रखता है, जबकि बहुवचन ‘कान’ हिन्दी का स्वाभाविक मुहावरा है और किसी विशेष लिंग को अनावश्यक रूप से सामने नहीं लाता।
- issue: τὸ πνεῦμα का संदर्भ
  choice: आत्मा
  alternative: पवित्र आत्मा
  rationale: संदर्भ में वक्ता पवित्र आत्मा है, पर मूल पाठ में विशेषण ‘पवित्र’ नहीं है। इसलिए मुख्य पाठ में केवल ‘आत्मा’ रखकर संदर्भगत पहचान को बिना अतिरिक्त शब्द जोड़े सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘कलीसिया’ प्रकाशितवाक्य के पारंपरिक और संदर्भानुकूल धार्मिक शब्द के रूप में रखा गया है; वाक्य की संक्षिप्त चेतावनीपूर्ण लय सुरक्षित है।
