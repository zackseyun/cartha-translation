base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/021.yaml
  text: The one who conquers—I will grant him to sit with me on my throne[b][a], just as I also conquered and sat down with my Father on his throne.
translation:
  language: hi
  text: जो विजय पाता है, उसे मैं अपने साथ अपने सिंहासन पर बैठने का अधिकार दूँगा[a], जैसे मैंने भी विजय पाई और अपने पिता के साथ उनके सिंहासन पर बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘उसे’ प्रतिनिधिक एकवचन है; यह प्रतिज्ञा हर उस व्यक्ति के लिए है जो विजय पाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: जो विजय पाता है
  rationale: वर्तमान कृदन्त यहाँ संज्ञा के रूप में प्रतिनिधिक एकवचन है। यह रूप स्वाभाविक हिन्दी में है और प्रकाशितवाक्य में बार-बार आने वाले विजय-भाव को बनाए रखता है।
- source_word: δώσω αὐτῷ καθίσαι
  choice: उसे ... बैठने का अधिकार दूँगा
  rationale: δίδωμι के साथ infinitive किसी को अवसर या विशेषाधिकार दिए जाने का भाव रखता है; ‘अधिकार दूँगा’ इस मुहावरेदार अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετ’ ἐμοῦ ἐν τῷ θρόνῳ μου
  choice: अपने साथ अपने सिंहासन पर
  rationale: μετά सहभागिता बताता है, जबकि सिंहासन के संदर्भ में ἐν का स्वाभाविक हिन्दी रूप ‘पर’ है।
- source_word: ὡς κἀγὼ ἐνίκησα
  choice: जैसे मैंने भी विजय पाई
  rationale: ὡς की तुलना और κἀγώ के अतिरिक्तताबोधक ‘भी’ को बनाए रखते हुए νικάω को पहली बार की तरह विजय-संबंधी भाषा में रखा गया है।
- source_word: ἐκάθισα μετὰ τοῦ πατρός μου ἐν τῷ θρόνῳ αὐτοῦ
  choice: अपने पिता के साथ उनके सिंहासन पर बैठ गया
  rationale: पूर्ण हुई सिंहासनारूढ़ क्रिया को ‘बैठ गया’ व्यक्त करता है। सम्मानसूचक आधुनिक हिन्दी के अनुसार पिता के लिए ‘उनके’ रखा गया है।
theological_decisions:
- issue: विजय पाने वाले के लिए प्रतिनिधिक पुल्लिंग एकवचन
  choice: मुख्य पाठ में ‘जो विजय पाता है, उसे’ और स्पष्टीकरण हेतु पादटिप्पणी
  alternative: ‘जो लोग विजय पाते हैं, उन्हें’ अथवा लिंग-निरपेक्ष बहुवचन
  rationale: यूनानी पाठ का कृदन्त और सर्वनाम पुल्लिंग एकवचन में हैं, पर प्रतिज्ञा हर उस व्यक्ति के लिए प्रतिनिधिक रूप से कही गई है जो विजय पाता है। हिन्दी में स्रोत का एकवचन सुरक्षित रखा गया है और उसके व्यापक आशय को पादटिप्पणी में स्पष्ट किया गया है।
- issue: विश्वासी का मसीह के सिंहासन पर और मसीह का पिता के सिंहासन पर बैठना
  choice: दोनों समानान्तर कथनों को बिना व्याख्यात्मक नरमी या विस्तार के सीधे प्रस्तुत करना
  alternative: सहभागिता को मुख्य पाठ में केवल प्रतीकात्मक बताना अथवा तात्त्विक भेदों की व्याख्या जोड़ना
  rationale: पद स्वयं विजय पाने वाले की मसीह के साथ सहभागिता और मसीह की पिता के साथ सिंहासन-सहभागिता के बीच प्रबल तुलना करता है। अनुवाद इस तनाव और बल को सुरक्षित रखता है, पर कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और मौखिक रूप से स्पष्ट शैली अपनाई गई है। ‘विजय पाता है/विजय पाई’ द्वारा यूनानी νικάω की पुनरावृत्ति सुरक्षित है। ‘सिंहासन पर’ हिन्दी की स्वाभाविक अभिव्यक्ति है; ‘अपने पिता ... उनके’ सम्मानसूचक प्रयोग है।
