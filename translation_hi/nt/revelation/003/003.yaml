reference: Revelation 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μνημόνευε οὖν πῶς εἴληφας καὶ ἤκουσας καὶ τήρει, καὶ μετανόησον· ἐὰν οὖν μὴ γρηγορήσῃς, ⸀ἥξω ὡς κλέπτης, καὶ οὐ μὴ ⸀γνῷς ποίαν ὥραν ἥξω ἐπὶ σέ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/003.yaml
  text: Therefore remember how you have received and heard[a]; keep it, and repent. So if you do not stay awake, I will come like a thief[c][b], and you will certainly not know at what hour I will come upon you.
translation:
  language: hi
  text: इसलिए याद रख कि तूने किस प्रकार प्राप्त किया है और सुना है[a]; उसे थामे रह और मन फिरा। इसलिए यदि तू जागता नहीं रहेगा[b], तो मैं चोर की तरह आऊँगा[c], और तुझे बिलकुल पता नहीं चलेगा कि मैं किस घड़ी तुझ पर आऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याद रख कि तूने क्या प्राप्त किया है और सुना है।” यूनानी पाठ में शाब्दिक रूप से “किस प्रकार” है; इससे ग्रहण करने की रीति पर बल हो सकता है, यद्यपि कुछ लोग इसे प्राप्त संदेश के संदर्भ में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: “जागता नहीं रहेगा” का अनुवाद “सतर्क नहीं रहेगा” या “पहरा नहीं देगा” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “मैं चोर की तरह आऊँगा” अचानक और अनपेक्षित आगमन की भाषा है। यह पद स्वयं स्पष्ट नहीं करता कि यहाँ अंतिम न्याय की बात है या अधिक निकट किसी अनुशासनात्मक कार्रवाई की।
    reason: cross_reference
lexical_decisions:
- source_word: μνημόνευε
  choice: याद कर
  rationale: वर्तमान काल की आज्ञा निरंतर स्मरण रखने का भाव देती है; ‘याद कर’ स्वाभाविक और सीधा है।
- source_word: πῶς
  choice: किस प्रकार
  rationale: यह रीति या ढंग की ओर संकेत करने वाले यूनानी क्रिया-विशेषण को बनाए रखता है और उसे केवल संदेश की विषयवस्तु मानकर सीमित नहीं करता।
- source_word: εἴληφας καὶ ἤκουσας
  choice: ग्रहण किया और सुना था
  rationale: ‘ग्रहण किया’ संदेश को स्वीकार करने का भाव रखता है, जबकि ‘सुना था’ पहले हुए सुनने के कार्य को व्यक्त करता है; हिन्दी में कालों का स्वाभाविक संयोजन रखा गया है।
- source_word: τήρει
  choice: उसे थामे रख
  rationale: यह आज्ञा प्राप्त और सुनी हुई बात को सुरक्षित रखने, उससे जुड़े रहने और उसके अनुसार चलने के व्यापक भाव को बिना केवल ‘आज्ञापालन’ तक सीमित किए व्यक्त करती है। ‘उसे’ स्पष्टता के लिए जोड़ा गया है।
- source_word: μετανόησον
  choice: मन फिरा
  rationale: यह पाप से मुड़ने और जीवन की दिशा बदलने की नये नियम की पुकार को सरल, प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: γρηγορήσῃς
  choice: जागता न रहे
  rationale: यह जागते और सतर्क रहने के मूल रूपक को बनाए रखता है और आगे आने वाले चोर के चित्र से स्वाभाविक रूप से जुड़ता है।
- source_word: ἥξω ὡς κλέπτης
  choice: मैं चोर के समान आऊँगा
  rationale: यह उपमा आगमन की अचानकता और अनपेक्षितता को बनाए रखती है।
- source_word: οὐ μὴ γνῷς
  choice: तुझे कदापि पता न चलेगा
  rationale: ‘कदापि ... न’ यूनानी की प्रबल निषेधात्मक संरचना को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ποίαν ὥραν
  choice: किस घड़ी
  rationale: ‘घड़ी’ यूनानी की विशिष्ट समय-संज्ञा और प्रकाशन-साहित्य की गंभीर शैली को बनाए रखती है।
- source_word: ἐπὶ σέ
  choice: तुझ पर आ पड़ूँगा
  rationale: यह संबोधित व्यक्ति की ओर आने के साथ चेतावनी और आकस्मिक आ पड़ने का भाव रखता है, पर आगमन को केवल अंतिम न्याय या स्थानीय अनुशासन के रूप में निर्धारित नहीं करता।
theological_decisions:
- issue: πῶς εἴληφας καὶ ἤκουσας में स्मरण की विषयवस्तु
  choice: ‘याद कर कि तूने किस प्रकार ग्रहण किया और सुना था’
  alternative: ‘याद कर कि तूने क्या ग्रहण किया और सुना था’
  rationale: मूल पाठ में πῶς अर्थात् ‘किस प्रकार’ है, जो ग्रहण करने और सुनने की रीति पर बल दे सकता है। कुछ लोग इसे संदेश की विषयवस्तु के अर्थ में समझते हैं; मुख्य पाठ मूल की वास्तविक अस्पष्टता को बनाए रखता है।
- issue: ‘मैं चोर के समान आऊँगा’ चेतावनी का स्वरूप
  choice: अचानक और अनपेक्षित आगमन की चेतावनी को बिना अधिक निर्धारण के रखा गया
  alternative: इसे स्पष्ट रूप से अंतिम आगमन अथवा किसी निकट ऐतिहासिक दंड से जोड़ना
  rationale: यह पद स्वयं नहीं बताता कि संकेत अंतिम न्याय, निकट दंड या अनुशासनात्मक आगमन की ओर है; इसलिए अनुवाद किसी एक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: एकवचन संबोधन के कारण ‘तू’ रूप रखा गया है, जैसा यूनानी पाठ में है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है; ‘मन फिरा’, ‘किस घड़ी’ और ‘चोर के समान’ जैसे पद बाइबलीय गंभीरता रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
