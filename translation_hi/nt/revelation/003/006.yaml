  text: The one who has an ear[a], let him hear what the Spirit says to the churches.
translation:
  language: hi
  text: जिसके कान[a] हों, वह सुन ले कि आत्मा कलीसियाओं को क्या कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘कान’ एकवचन है: ‘जिसके पास कान हो, वह सुन ले।’ यह हर व्यक्ति के लिए सामान्य आह्वान है; स्वाभाविक हिन्दी में ‘कान’ बहुवचन रखा गया है।'
    reason: मूल के एकवचन और स्वाभाविक हिन्दी मुहावरे के बीच अंतर स्पष्ट करना।
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हों
  rationale: यूनानी में शाब्दिक रूप से एकवचन ‘जिसके पास कान हो’ है। स्वाभाविक आधुनिक हिन्दी में यह कहावत-सदृश आह्वान ‘जिसके कान हों’ के रूप में स्पष्ट और सहज है; संख्या में हुए इस भाषिक समायोजन को पादटिप्पणी में बताया गया है।
- source_word: ἀκουσάτω
  choice: वह सुन ले
  rationale: तीसरे पुरुष एकवचन की आज्ञार्थक क्रिया का यह स्वाभाविक हिन्दी रूप है। यह केवल ध्वनि सुनने के बजाय ध्यान देकर ग्रहण करने के आह्वान की शक्ति बनाए रखता है, बिना ‘अवश्य’ जोड़कर बल बढ़ाए।
- source_word: τί
  choice: क्या
  rationale: यह आत्मा के कथन की विषय-वस्तु का परिचय देता है और हिन्दी में इसका सीधा, स्वाभाविक समतुल्य ‘क्या’ है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रकाशितवाक्य 2–3 के बार-बार आने वाले इस कथन में प्रसंग पवित्र आत्मा की ओर संकेत करता है। हिन्दी में बड़े अक्षर से भेद दिखाना संभव नहीं; इसलिए मूल के अनुरूप ‘आत्मा’ रखा गया है और ‘पवित्र’ शब्द पाठ में नहीं जोड़ा गया।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमानकालीन क्रिया का यह सामान्य और स्वाभाविक हिन्दी रूप है, जो इस दोहराए जाने वाले कथन के निरंतर अथवा सामान्य भाव को बनाए रखता है।
- source_word: ταῖς ἐκκλησίαις
  choice: कलीसियाओं से
  rationale: λέγει के साथ यूनानी संप्रदान बहुवचन उन समुदायों को दर्शाता है जिन्हें आत्मा संबोधित करता है। हिन्दी में ‘कलीसियाओं से कहता है’ स्वाभाविक है और प्रकाशितवाक्य की सात कलीसियाओं के स्थापित पारिभाषिक संदर्भ को बनाए रखता है।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्रेत संदर्भ
  choice: प्रसंगतः पवित्र आत्मा
  alternative: कोई आत्मा अथवा सामान्य आत्मिक सत्ता
  rationale: प्रकाशितवाक्य 2–3 के प्रत्येक संदेश के अंत में आने वाला यह सूत्र भविष्यद्वाणी के संदेश के द्वारा कलीसियाओं से बोलने वाले आत्मा को दर्शाता है। फिर भी अनुवाद में मूल के केवल ‘आत्मा’ शब्द को रखकर व्याख्यात्मक ‘पवित्र’ नहीं जोड़ा गया।
- issue: आह्वान में प्रतिनिधिक एकवचन
  choice: वह सुन ले
  alternative: वे सुन लें
  rationale: यूनानी कृदंत और आज्ञार्थक क्रिया दोनों एकवचन हैं और किसी भी सुनने वाले व्यक्ति को सामान्य रूप से संबोधित करते हैं। हिन्दी में ‘वह सुन ले’ इस प्रतिनिधिक एकवचन को सुरक्षित रखता है; इसका आशय केवल पुरुषों तक सीमित नहीं है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘जिसके कान हों, वह सुन ले’ सामान्य हिन्दी में तुरंत समझ आने वाला आह्वान है। ‘कलीसिया’ प्रकाशितवाक्य के ऐतिहासिक और सामुदायिक संदर्भ में प्रचलित हिन्दी बाइबलीय शब्दावली बनाए रखता है।
