  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι ἐτήρησας τὸν λόγον τῆς ὑπομονῆς μου, κἀγώ σε τηρήσω ἐκ τῆς ὥρας τοῦ πειρασμοῦ τῆς μελλούσης ἔρχεσθαι ἐπὶ τῆς οἰκουμένης ὅλης, πειράσαι τοὺς κατοικοῦντας ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/010.yaml
  text: Because you have kept my word of endurance[a], I also will keep you from the hour of testing that is about to come upon the whole inhabited world[b], to test those who dwell on the earth.
translation:
  language: hi
  text: क्योंकि तुमने मेरे धीरज के वचन[a] का पालन किया है, इसलिए मैं भी तुम्हें परीक्षा की उस घड़ी से बचाए रखूँगा[b], जो पृथ्वी पर रहने वालों को परखने के लिए सारे बसे हुए संसार पर आने वाली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे धीरज के विषय में वचन” अथवा “धीरज रखने के लिए मेरा संदेश।” यूनानी वाक्यांश को इन निकट-संबंधित अर्थों में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उस परीक्षा की घड़ी में तुम्हें सुरक्षित रखूँगा” अथवा “तुम्हें उस परीक्षा की घड़ी से बाहर रखूँगा।” यूनानी में शाब्दिक भाव “से बचाए रखना” है; यह अपने आप यह तय नहीं करता कि यह सुरक्षा किस प्रकार होगी।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐτήρησας
  choice: तुमने ... को माना है
  rationale: यहाँ τηρέω आज्ञापालन और निष्ठापूर्वक पालन का भाव रखता है। पूर्ण वर्तमान हिंदी में पहले किए गए कार्य की वर्तमान प्रासंगिकता व्यक्त होती है; आगे के τηρήσω से अर्थगत संबंध भी बना रहता है।
- source_word: τὸν λόγον τῆς ὑπομονῆς μου
  choice: मेरे धीरज के वचन
  rationale: यह निकट-शाब्दिक रूप यूनानी संबंधकारक की वास्तविक अस्पष्टता बनाए रखता है—यह यीशु के धीरज से संबंधित वचन, धीरज की विशेषता वाला वचन, या धीरज रखने को कहने वाला संदेश हो सकता है।
- source_word: κἀγώ
  choice: इसलिए मैं भी
  rationale: ‘मैं भी’ विश्वासियों के मानने और मसीह के बचाए रखने के बीच पारस्परिक बल व्यक्त करता है; ‘इसलिए’ हिंदी में वाक्य का कारण-परिणाम संबंध स्वाभाविक बनाता है।
- source_word: τηρήσω ἐκ
  choice: तुम्हें ... से बचाए रखूँगा
  rationale: यह τηρέω और ἐκ के संरक्षण तथा ‘से’ के भाव को स्वाभाविक हिंदी में रखता है, पर अपने आप यह तय नहीं करता कि संरक्षण परीक्षा से बाहर रखकर होगा या उसके बीच सुरक्षित रखकर।
- source_word: ὥρας
  choice: घड़ी
  rationale: ‘घड़ी’ प्रकाशन की अपोकैलिप्टिक समय-संबंधी भाषा को बनाए रखती है, यद्यपि आशय समयावधि भी हो सकता है।
- source_word: πειρασμοῦ
  choice: परीक्षा
  rationale: इस संदर्भ में व्यापक वैश्विक परख का भाव है; ‘परीक्षा’ नैतिक प्रलोभन तक अर्थ को सीमित नहीं करती।
- source_word: τῆς μελλούσης ἔρχεσθαι
  choice: आने वाली है
  rationale: यह μέλλω के भावी और निकटागत आशय को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐπὶ τῆς οἰκουμένης ὅλης
  choice: सारे बसे हुए संसार पर
  rationale: οἰκουμένη के ‘आबाद/बसे हुए संसार’ के विशिष्ट अर्थ को ‘संसार’ मात्र की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: πειράσαι
  choice: परखने के लिए
  rationale: उद्देश्यसूचक infinitive को स्पष्ट करता है और πειρασμός के साथ अर्थगत पुनरावृत्ति बनाए रखता है।
- source_word: τοὺς κατοικοῦντας ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहने वालों
  rationale: प्रकाशितवाक्य में बार-बार आने वाली इस अभिव्यक्ति के क्रियात्मक रूप और धार्मिक प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: अंत-समय के संदर्भ में τηρήσω ἐκ का अर्थ
  choice: तुम्हें परीक्षा की उस घड़ी से बचाए रखूँगा
  alternative: उस परीक्षा की घड़ी में तुम्हें सुरक्षित रखूँगा; तुम्हें उस परीक्षा की घड़ी से बाहर रखूँगा
  rationale: मुख्य पाठ संरक्षण और ‘से’ के भाव को रखता है, पर यह निर्णय नहीं करता कि प्रतिज्ञा का अर्थ पहले हटा लेना, परीक्षा के बीच रक्षा करना, या उसके प्रभाव से बचाना है।
- issue: ‘धीरज के वचन’ में संबंधकारक का अर्थ
  choice: मेरे धीरज के वचन
  alternative: मेरे धीरज के विषय में वचन; धीरज रखने के लिए मेरा संदेश
  rationale: यूनानी संबंधकारक अनेक निकट-संबंधित अर्थों की अनुमति देता है; मुख्य पाठ किसी एक धार्मिक व्याख्या को निर्णायक नहीं बनाता।
