source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα— ἰδοὺ δέδωκα ἐνώπιόν σου θύραν ἠνεῳγμένην, ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν— ὅτι μικρὰν ἔχεις δύναμιν, καὶ ἐτήρησάς μου τὸν λόγον, καὶ οὐκ ἠρνήσω τὸ ὄνομά μου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/008.yaml
  text: I know your works. Look[a], I have set before you an open door, which no one is able to shut, because you have little strength, and you have kept my word, and have not denied my name.
translation:
  language: hi
  text: मैं तुम्हारे कामों को जानता हूँ। देखो, मैंने तुम्हारे सामने एक खुला हुआ द्वार रखा है[a], जिसे कोई बन्द नहीं कर सकता, क्योंकि तुम्हारी सामर्थ्य थोड़ी है, और तुमने मेरे वचन का पालन किया है और मेरे नाम का इनकार नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक खुला द्वार।” यूनानी कृदन्त स्पष्ट करता है कि द्वार खोला जा चुका है और खुला हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἶδά σου τὰ ἔργα
  choice: मैं तुम्हारे कामों को जानता हूँ
  rationale: οἶδα रूप में पूर्णकालिक होते हुए भी वर्तमान अर्थ रखता है। ‘कामों’ से ἔργα का ठोस बहुवचन और प्रकाशितवाक्य में बार-बार आने वाला सूत्र सुरक्षित रहता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक, सहज और गरिमापूर्ण हिन्दी है।
- source_word: δέδωκα ἐνώπιόν σου
  choice: मैंने तुम्हारे सामने ... रखा है
  rationale: θύραν के साथ यह प्रयोग द्वार को सामने रखे जाने का भाव देता है। ‘रखा है’ यूनानी पूर्णकाल की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: θύραν ἠνεῳγμένην
  choice: एक खुला हुआ द्वार
  rationale: ‘खुला हुआ’ पूर्ण कर्मवाचक कृदन्त की उस स्पष्ट धारणा को बनाए रखता है कि द्वार खोला जा चुका है और अब खुला है।
- source_word: ἣν οὐδεὶς δύναται κλεῖσαι αὐτήν
  choice: जिसे कोई बन्द नहीं कर सकता
  rationale: यह δύναται की सामर्थ्य-असमर्थता और κλεῖσαι के द्वार बन्द करने के सामान्य अर्थ को सहज हिन्दी में रखता है।
- source_word: ὅτι μικρὰν ἔχεις δύναμιν
  choice: यद्यपि तुम्हारी सामर्थ्य थोड़ी है
  rationale: 'यहाँ ὅτι को परिस्थिति-स्वीकारक अर्थ में समझना संभव है: उनकी क्षमता सीमित होने पर भी वे विश्वासयोग्य रहे। यह हिन्दी में आगे के καί खण्डों से संबंध को स्पष्ट और स्वाभाविक बनाता है।'
- source_word: ἐτήρησάς μου τὸν λόγον
  choice: तुमने मेरे वचन का पालन किया है
  rationale: τηρέω में संभालकर रखने और मानने दोनों का भाव हो सकता है। इस संदर्भ में ‘पालन किया’ निष्ठापूर्ण आज्ञाकारिता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वचन’ λόγος को अनावश्यक रूप से नहीं खोलता।
- source_word: οὐκ ἠρνήσω τὸ ὄνομά μου
  choice: मेरे नाम से इनकार नहीं किया
  rationale: ‘नाम से इनकार’ ἀρνέομαι और ὄνομα की प्रतिनिधिक निष्ठा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ‘खुले हुए द्वार’ की छवि का अर्थ
  choice: छवि को शाब्दिक रूप में ‘एक खुला हुआ द्वार’ रखा गया है।
  alternative: इसे सुसमाचार प्रचार का अवसर, उद्धार/राज्य में प्रवेश, या सामान्य ईश्वरीय अवसर बताना।
  rationale: पद स्वयं इस रूपक का एक निश्चित अर्थ नहीं बताता; इसलिए अनुवाद मिशन, उद्धार या संरक्षण में से किसी एक व्याख्या को आरोपित नहीं करता।
- issue: ὅτι का संबंध और छोटी सामर्थ्य का भाव
  choice: इसे concessive रूप में ‘यद्यपि ... फिर भी’ व्यक्त किया गया है।
  alternative: कारणवाचक ‘क्योंकि तुम्हारी सामर्थ्य थोड़ी है’ या ‘क्योंकि तुम्हारे पास थोड़ी सामर्थ्य है’।
  rationale: ὅτι सामान्यतः कारणवाचक हो सकता है, पर यहाँ सीमित सामर्थ्य के बावजूद वचन पालन और नाम न नकारने का संबंध प्रबल है। हिन्दी में ‘यद्यपि ... फिर भी’ उस संभावित संबंध को स्पष्ट करता है; कारणवाचक पाठ भी सम्भव है।
- issue: पूर्णकालिक रूपों की वर्तमान प्रासंगिकता
  choice: ‘रखा है’, ‘पालन किया है’, और ‘इनकार नहीं किया’ जैसे रूप लिए गए हैं।
  alternative: 'केवल सामान्य भूतकाल: ‘रखा’, ‘पालन किया’, ‘इनकार नहीं किया’।'
  rationale: इनसे सम्पन्न कार्यों की वर्तमान प्रासंगिकता स्वाभाविक हिन्दी में बनी रहती है, बिना कालरूप को कृत्रिम बनाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण एकवचन ‘तुम’ और सामान्य पाठक के लिए सहज वाक्य-विन्यास अपनाया गया है। ‘सामर्थ्य’, ‘वचन’ और ‘इनकार’ बाइबलीय गरिमा रखते हुए भी वर्तमान हिन्दी में बोधगम्य हैं।
