revisions:
- from: जाग जा और जो कुछ बाकी रह गया है और मरने ही वाला था, उसे मज़बूत कर, क्योंकि मैंने तेरे कामों को अपने परमेश्वर की दृष्टि में पूरा नहीं पाया है।
  to: जागते रह और जो कुछ बाकी है उसे मज़बूत कर, जो मरने ही वाला था, क्योंकि मैंने तेरे कामों को अपने परमेश्वर की दृष्टि में पूरा नहीं पाया है।
  rationale: The revision restores the ongoing watchfulness expressed by the present imperative and clarifies that the things remaining were on the point of dying. It retains the source's unspecified reference for “what remains,” the singular direct address, and the evaluative sense of works not found completed before God.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:47:12Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the principal clauses, including the incompleteness of the works before Christ's God. However, γίνου γρηγορῶν is a present imperative calling for ongoing watchfulness, for which “जाग जा” is somewhat punctual and weaker than “जागते रह.” The relative clause ἃ ἔμελλον ἀποθανεῖν modifies “what remains”; the revision makes this relationship clearer without identifying what those remaining things are.
  naturalness: The revision uses a more natural ongoing exhortation and avoids the potentially awkward coordination in “जो कुछ बाकी रह गया है और मरने ही वाला था.” The direct singular address and serious register are retained.
  terminology: “मज़बूत कर,” “कामों,” “पूरा,” and “अपने परमेश्वर की दृष्टि में” suitably communicate στήρισον, ἔργα, πεπληρωμένα, and ἐνώπιον τοῦ θεοῦ μου. No doctrinally loaded interpretation is introduced.
  issues:
  - severity: medium
    issue: Aspect of γίνου γρηγορῶν
    rationale: “जाग जा” can suggest a single moment of awakening, whereas the Greek present imperative expresses being or remaining watchful. “जागते रह” more directly preserves the ongoing force.
  - severity: low
    issue: Attachment of the clause about impending death
    rationale: In the draft, “और मरने ही वाला था” is coordinated within the noun phrase and is less clearly related to the remaining things. Recasting it as a relative clause preserves the source syntax and improves Hindi flow.
  revised_text: जागते रह और जो कुछ बाकी है उसे मज़बूत कर, जो मरने ही वाला था, क्योंकि मैंने तेरे कामों को अपने परमेश्वर की दृष्टि में पूरा नहीं पाया है।
  revised_footnotes: []
  revision_rationale: The revision restores the ongoing watchfulness expressed by the present imperative and clarifies that the things remaining were on the point of dying. It retains the source's unspecified reference for “what remains,” the singular direct address, and the evaluative sense of works not found completed before God.
