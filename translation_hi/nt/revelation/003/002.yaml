id: REV.3.2
reference: Revelation 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γίνου γρηγορῶν, καὶ στήρισον τὰ λοιπὰ ἃ ⸂ἔμελλον ἀποθανεῖν⸃, οὐ γὰρ εὕρηκά σου ⸀τὰ ἔργα πεπληρωμένα ἐνώπιον τοῦ θεοῦ μου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/002.yaml
  text: Wake up, and strengthen what remains, which was about to die, for I have not found your works completed in the sight of my God.
translation:
  language: hi
  text: जागते रह और जो कुछ बाकी है उसे मज़बूत कर, जो मरने ही वाला था, क्योंकि मैंने तेरे कामों को अपने परमेश्वर की दृष्टि में पूरा नहीं पाया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γίνου γρηγορῶν
  choice: जाग जा
  rationale: यह अभिव्यक्ति निरंतर सतर्क होने की आज्ञा देती है; प्रसंग में आत्मिक निष्क्रियता से जागने का स्वाभाविक और सीधा भाव उपयुक्त है।
- source_word: στήρισον
  choice: मज़बूत कर
  rationale: क्रिया का अर्थ बची हुई वस्तुओं को स्थिर, दृढ़ या समर्थ करना है; ‘मज़बूत कर’ आधुनिक और सुबोध हिन्दी है।
- source_word: τὰ λοιπὰ
  choice: जो कुछ बाकी रह गया है
  rationale: नपुंसकलिंग बहुवचन का व्यापक भाव बनाए रखा गया है और यह तय नहीं किया गया कि शेष चीज़ें विशेष रूप से लोग हैं, काम हैं या आत्मिक गुण।
- source_word: ἔμελλον ἀποθανεῖν
  choice: मरने ही वाला था
  rationale: μέλλω के आसन्नता-बोध और अपूर्णकाल की स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πεπληρωμένα
  choice: पूरा
  rationale: पूर्ण कृदंत यहाँ कामों के परमेश्वर के मानदंड तक पूर्ण या संपन्न पाए जाने का भाव देता है।
- source_word: ἐνώπιον τοῦ θεοῦ μου
  choice: अपने परमेश्वर की दृष्टि में
  rationale: ‘सामने’ के मूल्यांकनात्मक भाव को हिन्दी की स्थापित और सहज अभिव्यक्ति ‘दृष्टि में’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘जो कुछ बाकी रह गया है’ की पहचान
  choice: व्यापक और अनिर्दिष्ट रखा गया
  alternative: इसे स्पष्ट रूप से बचे हुए लोगों, कामों या गुणों के रूप में अनूदित करना
  rationale: यूनानी τὰ λοιπὰ इन संभावनाओं में से किसी एक को स्पष्ट रूप से निर्धारित नहीं करता; इसलिए मूल की अर्थगत खुली जगह सुरक्षित रखी गई है।
- issue: कामों का ‘पूरा’ न पाया जाना
  choice: ‘पूरा नहीं पाया’
  alternative: ‘निर्दोष नहीं पाया’ या ‘पर्याप्त नहीं पाया’
  rationale: πεπληρωμένα का मूल पूर्णता/संपन्नता का भाव है; नैतिक निर्दोषता या पर्याप्तता जोड़ना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गंभीर और गरिमापूर्ण संबोधन रखा गया है। एकवचन ‘तू/तेरे’ मूल के एकवचन संबोधन और प्रकाशितवाक्य के पत्र-संदर्भ की तीखी, निकटवर्ती वाणी को दर्शाता है।
