source:
  edition: SBLGNT
  text: ἰδοὺ ⸀διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ, τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι, καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται— ἰδοὺ ποιήσω αὐτοὺς ἵνα ⸂ἥξουσιν καὶ προσκυνήσουσιν⸃ ἐνώπιον τῶν ποδῶν σου, καὶ γνῶσιν ὅτι ⸀ἐγὼ ἠγάπησά σε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/009.yaml
  text: Look[a], I am giving some from the synagogue of Satan—those who call themselves Jews and are not, but are lying—look, I will make them come and bow down before your feet[b], and they will know that I have loved you.
translation:
  language: hi
  text: देखो, मैं शैतान के आराधनालय में से कुछ लोगों को तुम्हें दे रहा हूँ[a]—जो अपने आपको यहूदी कहते हैं, पर हैं नहीं, बल्कि झूठ बोलते हैं। देखो, मैं ऐसा करूँगा कि वे आएँ और तुम्हारे पाँवों के सामने झुकें[b], और जान लें कि मैंने तुमसे प्रेम किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘तुम्हें’ स्पष्ट रूप से नहीं है। शाब्दिक रूप से, “मैं शैतान के आराधनालय में से दे रहा हूँ।” संभवतः आशय है कि उस समूह में से कुछ लोग आएँगे।
    reason: lexical_alternative
  - marker: b
    text: या “आएँ और दण्डवत् करें” अथवा “आएँ और आराधना करें।” यूनानी क्रिया का अर्थ झुकना, दण्डवत् करना, या आराधना करना हो सकता है; यहाँ “झुकें” से विश्वासियों को ईश्वरीय आराधना दिए जाने का अर्थ निकालने से बचा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: देख
  rationale: ध्यान आकर्षित करने वाले उद्गार को आधुनिक और स्वाभाविक हिन्दी में रखा गया है; दोनों occurrences को समान रूप से अनूदित किया गया है।
- source_word: διδῶ ἐκ τῆς συναγωγῆς τοῦ Σατανᾶ
  choice: मैं शैतान की आराधनालय में से कुछ लोगों को दे रहा हूँ
  rationale: वर्तमान काल ‘दे रहा हूँ’ और ἐκ का ‘में से’ अर्थ सुरक्षित है। यूनानी में कर्म स्पष्ट नहीं है, इसलिए सहज हिन्दी हेतु ‘कुछ लोगों को’ जोड़ा गया है, जिससे पूरे समूह के बजाय उसमें से लोगों का भाव प्रकट होता है।
- source_word: συναγωγῆς
  choice: आराधनालय
  rationale: यहूदी सामुदायिक और धार्मिक सभा-स्थान के संदर्भ में आधुनिक हिन्दी का परिचित शब्द चुना गया है।
- source_word: τῶν λεγόντων ἑαυτοὺς Ἰουδαίους εἶναι
  choice: जो अपने आपको यहूदी कहते हैं
  rationale: प्रतिबिंबवाचक रचना और पहचान के दावे को बिना अतिरिक्त व्याख्या के स्वाभाविक हिन्दी में रखा गया है।
- source_word: καὶ οὐκ εἰσὶν ἀλλὰ ψεύδονται
  choice: पर हैं नहीं, बल्कि झूठ बोलते हैं
  rationale: मूल के तीखे विरोध और वर्तमान क्रिया को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: ποιήσω αὐτοὺς ἵνα ἥξουσιν καὶ προσκυνήσουσιν
  choice: मैं ऐसा करूँगा कि वे आकर ... झुकेंगे
  rationale: ποιήσω की कारणवाचक शक्ति और आने तथा दण्डवत्/झुकने की भावी क्रियाएँ सुरक्षित हैं। ‘झुकेंगे’ यहाँ देहगत अधीनता या सम्मान का संकेत देता है।
- source_word: ἐνώπιον τῶν ποδῶν σου
  choice: तेरे पाँवों के सामने
  rationale: ἐνώπιον के ‘सामने’ भाव को निकटता से रखा गया है और एकवचन संबोधन के लिए ‘तेरे’ प्रयोग किया गया है।
- source_word: γνῶσιν ὅτι ἐγὼ ἠγάπησά σε
  choice: जान लेंगे कि मैंने तुझसे प्रेम किया है
  rationale: परिणामी ज्ञान और ἠγάπησα के भूतकालिक पक्ष को स्वाभाविक हिन्दी पूर्ण रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ‘जो अपने आपको यहूदी कहते हैं, पर हैं नहीं’ का आशय
  choice: पाठ के धर्मवैचारिक और वाचागत निर्णय को ज्यों का त्यों रखा गया है, बिना जातीय पहचान के विषय में अतिरिक्त दावा जोड़े।
  alternative: इसे स्पष्ट रूप से ‘सच्चे परमेश्वर के लोग नहीं’ कहना, या उनकी जातीय यहूदी पहचान का खुला निषेध करना।
  rationale: मूल पाठ तीखा निर्णय देता है, पर उसका सटीक आधार नहीं खोलता। अनुवाद को यह तनाव बनाए रखना चाहिए और यहूदी-विरोधी विस्तार नहीं जोड़ना चाहिए।
- issue: πισκυνέω का विश्वासियों के पाँवों के सामने प्रयोग
  choice: ‘झुकेंगे’
  alternative: ‘आराधना करेंगे’ या ‘दण्डवत् करेंगे’
  rationale: क्रिया आराधना अथवा भूमि पर झुककर सम्मान/अधीनता दिखाने दोनों अर्थों में आ सकती है। यहाँ ‘तेरे पाँवों के सामने’ होने के कारण ‘झुकेंगे’ देहगत भाव बनाए रखता है, पर विश्वासियों को ईश्वरीय आराधना मिलने का अनावश्यक अर्थ नहीं देता।
- issue: एकवचन संबोधन
  choice: ‘तेरे/तुझसे’
  alternative: सम्मानसूचक ‘आपके/आपसे’
  rationale: मूल में संबोधन एकवचन है और प्रकाशितवाक्य के पत्रीय, प्रत्यक्ष संबोधन की निकटता तथा गंभीरता को पारंपरिक किन्तु बोधगम्य हिन्दी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देख’ मूल के दोहरे ध्यानाकर्षक उद्गार को बनाए रखता है। ‘आराधनालय’ संदर्भगत यहूदी सभा-स्थान को व्यक्त करता है; पद की कटुता को न नरम किया गया है, न उसके बाहर बढ़ाया गया है।
