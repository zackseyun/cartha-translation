  source_fidelity: The explicit ‘मैं’ appropriately reflects emphatic ἐγώ. However, ‘जिन-जिन से’ adds a distributive nuance (‘each and every one’) that is not required by the indefinite relative construction ὅσους ἐὰν. ‘जिनसे भी’ more directly preserves the sense ‘those/whomever I love.’ The two imperatives and the inferential ‘इसलिए’ are retained.
  naturalness: ‘मैं जिनसे भी प्रेम करता हूँ’ is idiomatic modern standard Hindi. ‘उत्साही बनो’ is a more natural, direct imperative than the inchoative ‘उत्साही हो जाओ’ while retaining the force of ζήλευε. The dignified register remains accessible.
  terminology: ‘प्रेम करता हूँ,’ ‘डाँटता,’ ‘अनुशासित करता हूँ,’ and ‘मन फिराओ’ suitably convey φιλέω, ἐλέγχω, παιδεύω, and μετανόησον. The note on ‘अनुशासित’ properly prevents a punitive-only reading. No doctrinally restrictive distinction is introduced.
