  yaml_path: translation/nt/revelation/003/019.yaml
  text: Those whom I love[a], I rebuke and discipline[c][b]. Therefore be zealous and repent.
translation:
  language: hi
  text: मैं जिनसे भी प्रेम करता हूँ[a], उन्हें डाँटता और अनुशासित करता हूँ[b]। इसलिए उत्साही बनो[c] और मन फिराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, ‘जिस किसी से भी मैं प्रेम करता हूँ।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘अनुशासित करना’ केवल दण्ड देना नहीं, बल्कि सुधार के लिए प्रशिक्षण देना भी है।
    reason: cultural_note
  - marker: c
    text: या, ‘पूरी लगन दिखाओ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγὼ
  choice: मैं
  rationale: स्पष्ट सर्वनाम यूनानी में बल देता है; हिन्दी में वाक्य के आरम्भ का ‘मैं’ इस बल को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘जहाँ तक मेरी बात है’ अनावश्यक रूप से भारी होता।
- source_word: ὅσους ἐὰν
  choice: जिन-जिन से
  rationale: यह अनिश्चित सम्बन्धवाचक भाव ‘जितनों से भी/जिस किसी से’ व्यक्त करता है। ‘जिन-जिन से’ आधुनिक हिन्दी में व्यापक और अनिश्चित समूह का भाव सहजता से रखता है।
- source_word: φιλῶ
  choice: प्रेम करता हूँ
  rationale: φιλέω यहाँ वास्तविक प्रेम और आत्मीय लगाव बताता है। ‘प्रेम’ उसके पूरे सम्बन्धपरक बल को बनाए रखता है; इसे केवल ‘स्नेह रखता हूँ’ कहने से भाव कुछ हल्का पड़ सकता है।
- source_word: ἐλέγχω
  choice: डाँटता
  rationale: इस प्रसंग में शब्द दोष पर ध्यान दिलाकर सुधार की ओर ले जाने वाली भर्त्सना बताता है। ‘डाँटता’ सामान्य आधुनिक हिन्दी में स्पष्ट है और ‘दोष सिद्ध करता’ की अपेक्षा प्रसंगानुकूल है।
- source_word: παιδεύω
  choice: अनुशासित करता हूँ
  rationale: शब्द में सुधारात्मक प्रशिक्षण और ताड़ना दोनों समाए हैं। ‘अनुशासित करता हूँ’ केवल दण्ड का अर्थ थोपे बिना इस व्यापक भाव को बनाए रखता है।
- source_word: ζήλευε
  choice: उत्साही हो जाओ
  rationale: आज्ञा जोशीली तत्परता और गंभीर लगन की मांग करती है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और आदेश की तीव्रता को व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: 'यह पिछले कथन से निकलने वाला निष्कर्ष दिखाता है: प्रेम से मिलने वाली डाँट और अनुशासन के प्रत्युत्तर में उत्साह और मन-फिराव होना चाहिए।'
- source_word: μετανόησον
  choice: मन फिराओ
  rationale: μετανοέω नैतिक और आत्मिक दिशा बदलने का आह्वान है। ‘मन फिराओ’ प्रचलित, संक्षिप्त और केवल बौद्धिक मत-परिवर्तन से अधिक व्यापक है।
theological_decisions:
- issue: ईश्वरीय सुधार के सम्बन्ध में φιλῶ का स्वरूप
  choice: ‘प्रेम करता हूँ’—सुधार को वास्तविक प्रेम में आधारित रखा गया है
  alternative: ‘स्नेह रखता हूँ’
  rationale: पद डाँट और अनुशासन को सच्चे प्रेम से जोड़ता है। ‘प्रेम’ इस धर्मवैचारिक तनाव को बनाए रखता है और φιλέω तथा ἀγαπάω के बीच कोई कृत्रिम तकनीकी भेद नहीं थोपता।
- issue: παιδεύω का आशय
  choice: ‘अनुशासित करता हूँ’—सुधारात्मक और प्रशिक्षणात्मक कार्य
  alternative: ‘दण्ड देता हूँ’ या केवल ‘सिखाता हूँ’
  rationale: मूल शब्द केवल दण्ड अथवा केवल शिक्षा तक सीमित नहीं है। चुना हुआ रूप दोनों पहलुओं को खुला रखता है, और पादटिप्पणी उसके सुधारात्मक उद्देश्य को स्पष्ट करती है।
- issue: ζήλευε और μετανόησον के आदेशों का सम्बन्ध
  choice: 'दो अलग लेकिन जुड़े आदेश: उत्साही होना और मन फिराना'
  alternative: दोनों को मिलाकर ‘उत्साह से पश्चाताप करो’
  rationale: यूनानी में καί से जुड़े दो स्वतंत्र आज्ञार्थक रूप हैं। उन्हें अलग रखने से पाठ की संरचना और सम्भावित अर्थ-व्याप्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अनुशासित’ अर्थ की व्यापकता के कारण अपेक्षाकृत औपचारिक शब्द है, पर पादटिप्पणी उसे स्पष्ट करती है। आज्ञाएँ प्रत्यक्ष और संक्षिप्त हैं; किसी सम्प्रदाय-विशेष की पारिभाषिक व्याख्या नहीं जोड़ी गई।
