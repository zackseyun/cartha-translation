base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/016.yaml
  text: So[a], because you are lukewarm, and neither hot nor cold, I am about to vomit you out of my mouth.
translation:
  language: hi
  text: इसलिए, क्योंकि तुम गुनगुने हो—न तो गरम, न ठंडे—मैं तुम्हें अपने मुँह से उगल देने ही वाला हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मैं तुम्हें अपने मुँह से वमन करने ही वाला हूँ।’ यूनानी क्रिया का अधिक शाब्दिक अर्थ ‘वमन करना’ है; इसका बिंब ‘थूकने’ से अधिक तीखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम का परिचय देता है; ‘इसलिए’ आधुनिक हिन्दी में इसके निष्कर्षात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आने वाले न्याय का कारण बताता है; ‘क्योंकि’ कारण-संबंध को स्पष्ट रखता है।
- source_word: χλιαρός
  choice: गुनगुने
  rationale: तापमान के बिंब के लिए यह सहज और सटीक आधुनिक हिन्दी शब्द है।
- source_word: οὔτε ζεστὸς οὔτε ψυχρός
  choice: न तो गरम, न ठंडे
  rationale: यूनानी के समांतर विरोध को बिना रूपक की व्याख्या किए सीधे बनाए रखता है।
- source_word: μέλλω
  choice: करने ही वाला हूँ
  rationale: ‘ही वाला हूँ’ आसन्न कार्रवाई और चेतावनी की तात्कालिकता को व्यक्त करता है।
- source_word: ἐμέσαι
  choice: उलटी करके बाहर निकालने
  rationale: यूनानी क्रिया का मूल अर्थ उलटी करना है। यह चयन जानबूझकर प्रयुक्त तीखे और घृणाजनक बिंब को ‘थूकने’ जैसे नरम अनुवाद से कम नहीं करता।
- source_word: ἐκ τοῦ στόματός μου
  choice: अपने मुँह से ... बाहर
  rationale: निष्कासन की दिशा और सजीव शारीरिक छवि दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἐμέσαι में न्याय के बिंब की तीव्रता
  choice: तीखे बिंब को ‘उलटी करके बाहर निकालने’ के रूप में बनाए रखा गया।
  alternative: ‘उगल देने’ या ‘थूक देने’
  rationale: पद में अस्वीकार किए जाने का जानबूझकर चौंकाने वाला चित्र है; उसे नरम करना चेतावनी के आलंकारिक और धर्मवैचारिक बल को घटा देता।
- issue: μέλλω का कालगत बल
  choice: आसन्नता दर्शाने के लिए ‘करने ही वाला हूँ’।
  alternative: ‘करूँगा’ या ‘करने जा रहा हूँ’
  rationale: यूनानी पाठ केवल सामान्य भविष्य नहीं, बल्कि निकट आते कार्य का भाव देता है; यह अनुवाद चेतावनी की तात्कालिकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उलटी करके बाहर निकालने’ की अभिव्यक्ति जानबूझकर सजीव है, क्योंकि मूल यूनानी कोमल या शिष्टोक्तिपूर्ण नहीं है। संबोधन में ‘तुम’ के अनुरूप विशेषण बहुवचन/आदर-संगत रूप ‘गुनगुने’, ‘गरम’, ‘ठंडे’ में रखे गए हैं।
