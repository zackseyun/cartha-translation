id: REV.3.12
reference: Revelation 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ νικῶν ποιήσω αὐτὸν στῦλον ἐν τῷ ναῷ τοῦ θεοῦ μου, καὶ ἔξω οὐ μὴ ἐξέλθῃ ἔτι, καὶ γράψω ἐπ’ αὐτὸν τὸ ὄνομα τοῦ θεοῦ μου καὶ τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου, τῆς καινῆς Ἰερουσαλήμ, ἡ ⸀καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου, καὶ τὸ ὄνομά μου τὸ καινόν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/012.yaml
  text: The one who conquers—I will make him a pillar in the temple of my God[a], and he will never go out from it anymore. And I will write on him the name of my God, and the name of the city of my God, the new Jerusalem, which comes down out of heaven from my God[c][b], and my own new name.
translation:
  language: hi
  text: जो जय पाता है[a], उसे मैं अपने परमेश्वर के मंदिर में एक स्तंभ बनाऊँगा, और वह फिर कभी बाहर नहीं निकलेगा[b]। मैं उस पर अपने परमेश्वर का नाम, और अपने परमेश्वर के नगर, नए यरूशलेम, का नाम—जो स्वर्ग में से मेरे परमेश्वर की ओर से उतरती है—और अपना वह नया नाम भी[c] लिखूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो विजय प्राप्त करता है।” प्रकाशितवाक्य में यूनानी क्रिया νικάω विश्वासयोग्य बने रहकर जय पाने के लिए बार-बार प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में निषेध अत्यन्त प्रबल है: “वह निश्चय ही फिर कभी बाहर नहीं निकलेगा।”'
    reason: lexical_alternative
  - marker: c
    text: मूल यूनानी में “अपना नया नाम” पर विशेष जोर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: जो जय पाता है
  rationale: वर्तमान कृदन्त को प्रतिनिधिक और निरन्तर अर्थ वाले वाक्यांश से व्यक्त किया गया है। ‘जय पाता है’ प्रकाशितवाक्य में बार-बार आने वाले νικάω के विजय/विश्वासयोग्य बने रहने के भाव को बनाए रखता है।
- source_word: ποιήσω αὐτὸν στῦλον
  choice: उसे ... एक खम्भा बनाऊँगा
  rationale: ποιέω के साथ विधेयात्मक στῦλον का सीधा अर्थ रखा गया है; स्थायित्व और सम्मान की स्थापत्य-छवि को रूपान्तरित नहीं किया गया।
- source_word: ἐν τῷ ναῷ τοῦ θεοῦ μου
  choice: अपने परमेश्वर के मन्दिर में
  rationale: ναός पवित्र मन्दिर/मन्दिर-स्थान को सूचित करता है। सामान्य हिन्दी में ‘मन्दिर’ स्पष्ट है और ‘अपने परमेश्वर’ वक्ता के ‘मेरे परमेश्वर’ सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔξω οὐ μὴ ἐξέλθῃ ἔτι
  choice: वह फिर कभी बाहर नहीं निकलेगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति और ἔτι की अंतिमता को ‘फिर कभी ... नहीं’ से व्यक्त किया गया है। बाहर निकलने का स्थान पिछले ‘मन्दिर’ से स्वतः समझ में आता है।
- source_word: γράψω ἐπ’ αὐτὸν
  choice: मैं उस पर ... लिखूँगा
  rationale: ἐπί के साथ γράφω का चिह्नित करने अथवा अंकित करने का अर्थ सीधे और सहज हिन्दी में रखा गया है।
- source_word: τὸ ὄνομα τοῦ θεοῦ μου
  choice: अपने परमेश्वर का नाम
  rationale: ‘नाम’ की पहचान, स्वामित्व और सम्बन्ध से जुड़ी बाइबलीय अर्थ-समृद्धि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: τὸ ὄνομα τῆς πόλεως τοῦ θεοῦ μου
  choice: अपने परमेश्वर के नगर का नाम
  rationale: मूल के समानान्तर ‘नाम’ वाले विन्यास को बनाए रखा गया है।
- source_word: τῆς καινῆς Ἰερουσαλήμ
  choice: नए यरूशलेम
  rationale: καινῆς को विशेषण के रूप में ‘नए’ से व्यक्त किया गया है और यरूशलेम का परिचित हिन्दी रूप रखा गया है।
- source_word: ἡ καταβαίνουσα ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ μου
  choice: जो मेरे परमेश्वर के पास से स्वर्ग में से उतरता है
  rationale: वर्तमान कृदन्त का वर्णनात्मक भाव ‘जो ... उतरता है’ से रखा गया है। ἀπό के स्रोत को ‘मेरे परमेश्वर के पास से’ और ἐκ के भीतर से निकलने वाले उद्गम को ‘स्वर्ग में से’ कहकर दोनों पूर्वसर्गों का भेद यथासम्भव सुरक्षित रखा गया है।
- source_word: τὸ ὄνομά μου τὸ καινόν
  choice: अपना वह नया नाम भी
  rationale: ‘वह’ पुनरुक्त लेख के जोर को स्वाभाविक हिन्दी में उभारता है, जबकि ‘भी’ तीन नामों की समानान्तर सूची को स्पष्ट करता है; नाम के विषय में कोई अनुमान नहीं जोड़ा गया।
theological_decisions:
- issue: प्रतिज्ञा-सूत्र में पुल्लिंग एकवचन
  choice: ‘जो ... पाता है, उसे ... वह’ के एकवचन रूप
  alternative: ‘जो लोग ... उन्हें ... वे’
  rationale: यूनानी में पुल्लिंग एकवचन कृदन्त, सर्वनाम और क्रिया हैं। हिन्दी एकवचन प्रतिनिधिक अर्थ को बनाए रखते हुए मूल व्याकरण के निकट रहता है।
- issue: महिमित यीशु के कथन में ‘मेरे परमेश्वर’ की पुनरावृत्ति
  choice: चारों occurrences को ‘अपने/मेरे परमेश्वर’ के रूप में सुरक्षित रखना
  alternative: शैलीगत सहजता के लिए कुछ पुनरावृत्तियाँ हटाना
  rationale: मूल में θεοῦ μου चार बार स्पष्ट और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण ढंग से आता है। हिन्दी में कर्ता ‘मैं’ के साथ सम्बन्धवाचक ‘अपने’ तथा खण्ड के भीतर ‘मेरे’ वही सम्बन्ध व्यक्त करते हैं; किसी पुनरावृत्ति को हटाया नहीं गया।
- issue: अन्तिम नाम-वाक्यांश का जोर
  choice: ‘अपना वह नया नाम भी’
  alternative: ‘अपना नया नाम’
  rationale: यह τὸ ὄνομά μου τὸ καινόν की बलाघाती संरचना को दर्शाता है, पर उस नए नाम की पहचान के विषय में पाठ से बाहर कोई निष्कर्ष नहीं देता।
- issue: नया यरूशलेम परमेश्वर और स्वर्ग से आता है
  choice: दोनों स्रोत-सूचक पदों को अलग-अलग बनाए रखना
  alternative: केवल ‘स्वर्ग से उतरता है’
  rationale: ἐκ τοῦ οὐρανοῦ और ἀπὸ τοῦ θεοῦ μου दोनों को रखना पाठ की ब्रह्माण्डीय और परमेश्वर-सम्बन्धी भाषा को बिना समतल किए सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खम्भा’, ‘मन्दिर’ और ‘नाम’ जैसी मुख्य प्रतीकात्मक संज्ञाएँ शाब्दिक रखी गई हैं। ‘अपने परमेश्वर’ हिन्दी में प्रथम पुरुष कर्ता के साथ स्वाभाविक सम्बन्धवाचक रूप है; जहाँ कर्ता बदलता है वहाँ ‘मेरे परमेश्वर’ रखा गया है।
