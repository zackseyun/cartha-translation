id: REV.3.15
reference: Revelation 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἶδά σου τὰ ἔργα, ὅτι οὔτε ψυχρὸς εἶ οὔτε ζεστός. ὄφελον ψυχρὸς ἦς ἢ ζεστός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/015.yaml
  text: 'I know your works: you are neither cold nor hot[a]. I wish that you were cold or hot.'
translation:
  language: hi
  text: 'मैं तुम्हारे कामों को जानता हूँ: तुम न तो ठंडे हो, न गर्म। काश, तुम ठंडे या गर्म होते!'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδά
  choice: मैं ... जानता हूँ
  rationale: οἶδα यहाँ वर्तमानकालिक स्थिति-बोध व्यक्त करता है; यह रूप सीधे और मूल्यांकनात्मक कथन को स्वाभाविक हिन्दी में रखता है।
- source_word: σου τὰ ἔργα
  choice: तुम्हारे कामों को
  rationale: ἔργα के नैतिक और व्यवहारगत अर्थ को बनाए रखते हुए ‘काम’ आधुनिक सामान्य हिन्दी में ‘कार्यों’ से अधिक सहज है।
- source_word: ψυχρὸς
  choice: ठंडे
  rationale: मूल तापमान-रूपक को बिना उसकी आध्यात्मिक व्याख्या तय किए अक्षरशः बनाए रखता है।
- source_word: ζεστός
  choice: गर्म
  rationale: ψυχρός के साथ मूल तापमान-विरोध को स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘उत्साही’ कहना रूपक की व्याख्या कर देता।
- source_word: ὄφελον
  choice: काश
  rationale: वर्तमान वास्तविकता के विपरीत प्रबल इच्छा को संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἢ
  choice: या
  rationale: दो विकल्पों के बीच मूल के सरल विकल्प-संबंध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘ठंडे’ और ‘गर्म’ तापमान-रूपक का अर्थ
  choice: मुख्य पाठ में रूपक को अक्षरशः रखा गया है और उसका सांकेतिक अर्थ नहीं खोला गया।
  alternative: ‘ठंडा’ को आत्मिक उदासीनता/अविश्वास और ‘गर्म’ को आत्मिक उत्साह मानना; अथवा दोनों को अलग-अलग ढंग से लाभकारी तापमान मानना।
  rationale: यह पद स्वयं रूपक का अर्थ स्पष्ट नहीं करता। इसलिए किसी एक व्याख्या को अनुवाद में आरोपित करने के बजाय मूल की अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तुम’ मूल के एकवचन रूपों को दर्शाता है। भाषा सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अंतिम वाक्य में विस्मयादिबोधक चिह्न ὄφελον की प्रबल कामना व्यक्त करता है।
