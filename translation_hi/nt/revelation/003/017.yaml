source:
  edition: SBLGNT
  text: ὅτι λέγεις ⸀ὅτι Πλούσιός εἰμι καὶ πεπλούτηκα καὶ ⸀οὐδὲν χρείαν ἔχω, καὶ οὐκ οἶδας ὅτι σὺ εἶ ὁ ταλαίπωρος ⸀καὶ ἐλεεινὸς καὶ πτωχὸς καὶ τυφλὸς καὶ γυμνός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/017.yaml
  text: because you say[a], ‘I am rich, and I have become wealthy[b], and I have need of nothing,’ and you do not know that you are wretched and pitiable and poor and blind and naked.
translation:
  language: hi
  text: क्योंकि तुम कहते हो, ‘मैं धनी हूँ, धनी बन गया हूँ और मुझे किसी चीज़ की आवश्यकता नहीं है,’ और तुम नहीं जानते कि दयनीय, दया के योग्य, निर्धन, अंधे और नंगे तुम ही हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι λέγεις ὅτι
  choice: क्योंकि तुम कहते हो
  rationale: पहला ὅτι प्रसंग में कारण बताता है और दूसरा कथन की विषयवस्तु आरम्भ करता है; हिन्दी में प्रत्यक्ष उद्धरण स्वाभाविक है।
- source_word: Πλούσιός εἰμι
  choice: मैं धनी हूँ
  rationale: धन-संपन्न होने के सीधे दावे को बनाए रखता है और आगे आने वाली निर्धनता के साथ विरोध स्पष्ट रहने देता है।
- source_word: πεπλούτηκα
  choice: मैंने धन अर्जित कर लिया है
  rationale: पूर्ण काल से व्यक्त धन प्राप्त करने की प्रक्रिया और उसकी वर्तमान परिणति—दोनों को हिन्दी में प्रकट करता है।
- source_word: οὐδὲν χρείαν ἔχω
  choice: मुझे किसी चीज़ की आवश्यकता नहीं है
  rationale: यूनानी मुहावरे का स्पष्ट और स्वाभाविक आधुनिक हिन्दी रूप, जिसमें οὐδέν की व्यापक निषेधात्मकता बनी रहती है।
- source_word: οὐκ οἶδας
  choice: तुम नहीं जानते
  rationale: ज्ञान-संबंधी क्रिया को बिना व्याख्यात्मक विस्तार के सीधे बनाए रखता है।
- source_word: σὺ εἶ ὁ ταλαίπωρος
  choice: दयनीय ... तुम ही हो
  rationale: σὺ के बल और विशेषण के साथ आए निश्चित उपपद की नुकीली, व्यक्तिगत पहचान को हिन्दी के ‘तुम ही हो’ से स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἐλεεινός
  choice: तरस खाने योग्य
  rationale: ऐसे व्यक्ति का भाव देता है जिस पर दया की जानी चाहिए और इसे ταλαίπωρος के ‘दयनीय’ से अलग रखता है।
- source_word: πτωχὸς καὶ τυφλὸς καὶ γυμνός
  choice: निर्धन, अंधे और नंगे
  rationale: मूल के ठोस रूपकों को किसी आध्यात्मिक व्याख्यात्मक विशेषण के बिना सुरक्षित रखता है।
theological_decisions:
- issue: धन और अभाव के विरोध को स्पष्टतः आध्यात्मिक बताना या मूल रूपकों को खुला रखना
  choice: धनी, निर्धन, अंधे और नंगे जैसे शब्दों को बिना ‘आत्मिक रूप से’ जोड़े रखा गया।
  alternative: ‘आत्मिक रूप से धनी/निर्धन’ जैसे व्याख्यात्मक पद जोड़ना।
  rationale: मूल पाठ स्वयं विडंबना और रूपकात्मक तनाव उत्पन्न करता है; ‘आत्मिक रूप से’ जोड़ना अनुवाद में व्याख्या आयात करता।
- issue: ὁ ταλαίπωρος और बलयुक्त σὺ की नुकीली पहचान
  choice: विशेषणों के बाद ‘तुम ही हो’ रखा गया।
  alternative: साधारण ‘तुम दयनीय ... हो’ या कृत्रिम ‘वह दयनीय व्यक्ति तुम हो’।
  rationale: यह हिन्दी में स्वाभाविक रहते हुए यूनानी कथन की विशेष बलाघातयुक्त पहचान को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए सहज। ‘धनी/निर्धन’ का चयन आर्थिक और रूपकात्मक दोनों अर्थों को खुला रखता है। विशेषणों की श्रृंखला मूल की संचयी कठोरता बनाए रखती है।
