id: REV.3.7
reference: Revelation 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Φιλαδελφείᾳ ἐκκλησίας γράψον· Τάδε λέγει ὁ ἅγιος, ὁ ἀληθινός, ὁ ἔχων τὴν κλεῖν ⸀Δαυίδ, ὁ ἀνοίγων καὶ οὐδεὶς κλείσει, ⸂καὶ κλείων⸃ καὶ οὐδεὶς ⸀ἀνοίγει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/007.yaml
  text: 'And write to the angel of the church in Philadelphia: These things says the Holy One[a], the True One, the one who has the key of David, who opens and no one will shut[b], and who shuts and no one opens:'
translation:
  language: hi
  text: '“फिलादेल्फिया की कलीसिया के दूत[a] को लिखो:


    ‘ये बातें वह कहता है जो पवित्र है, जो सच्चा है, जिसके पास दाऊद की कुंजी[b] है, जो खोलता है और कोई बंद नहीं करेगा, और जो बंद करता है और कोई नहीं खोलता:’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सन्देशवाहक।” यूनानी ἀγγέλῳ का अर्थ स्वर्गदूत या मानवीय सन्देशवाहक, दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “दाऊद की कुंजी” सम्भवतः यशायाह 22:22 की ओर संकेत करती है; यह खोलने और बंद करने के राजकीय अधिकार की छवि है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: दूत
  rationale: ‘दूत’ यूनानी शब्द की ‘स्वर्गदूत’ और ‘संदेशवाहक’—दोनों सम्भावनाओं को हिन्दी में कुछ हद तक खुला रखता है; प्रकाशितवाक्य की सात कलीसियाओं के सन्दर्भ में किसी एक पहचान को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: यहाँ शब्द फिलदिलफिया के मसीही समुदाय को सूचित करता है। ‘कलीसिया’ आधुनिक हिन्दी मसीही प्रयोग में स्वाभाविक और स्पष्ट है।
- source_word: Τάδε λέγει
  choice: ये बातें वह कहता है
  rationale: यह अनुवाद τάδε के संकेतात्मक बल और भविष्यद्वक्ताओं जैसी गम्भीर उद्घोषणा-शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ ἅγιος
  choice: जो पवित्र है
  rationale: लेखयुक्त विशेषण यहाँ वक्ता की उपाधि के रूप में प्रयुक्त है। सम्बन्धवाचक वाक्य हिन्दी में स्वाभाविक रहते हुए उसके उपाधिसूचक अर्थ को बनाए रखता है।
- source_word: ὁ ἀληθινός
  choice: जो सच्चा है
  rationale: ‘सच्चा’ सत्यनिष्ठ होने के साथ असली, वास्तविक और प्रामाणिक होने की अर्थ-छाया भी रख सकता है; इस प्रकार यूनानी शब्द की व्यापकता को केवल ‘सत्य बोलने वाला’ तक सीमित नहीं करता।
- source_word: κλεῖν Δαυίδ
  choice: दाऊद की कुंजी
  rationale: यह सीधा सम्बन्धकारक अनुवाद यशायाह 22:22 की राजकीय अधिकार वाली छवि को व्याख्यात्मक विस्तार से बदले बिना सुरक्षित रखता है।
- source_word: ἀνοίγων
  choice: जो खोलता है
  rationale: वर्तमान कृदन्त को स्वाभाविक हिन्दी सम्बन्धवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: κλείσει
  choice: बन्द नहीं करेगा
  rationale: यूनानी भविष्यकाल को भविष्यकाल ही रखा गया है, जिससे यह भाव प्रकट होता है कि उसके खोले हुए को कोई बन्द नहीं कर सकेगा, बिना ‘सकेगा’ जोड़कर सामर्थ्य के अर्थ को मूल से अधिक स्पष्ट किए।
- source_word: κλείων
  choice: जो बन्द करता है
  rationale: वर्तमान कृदन्त को पिछले समानान्तर पद की तरह सम्बन्धवाचक उपवाक्य में अनूदित किया गया है।
- source_word: ἀνοίγει
  choice: नहीं खोलता
  rationale: 'यूनानी वर्तमानकाल को सुरक्षित रखा गया है; इस प्रकार मूल का असममित कालक्रम बना रहता है: वह खोलता है और कोई बन्द नहीं करेगा; वह बन्द करता है और कोई नहीं खोलता।'
theological_decisions:
- issue: ὁ ἅγιος और ὁ ἀληθινός की मसीह-संबंधी उपाधियाँ
  choice: 'इन्हें पुनरुत्थित यीशु की उपाधिसूचक विशेषताओं के रूप में अनूदित किया गया: “जो पवित्र है, जो सच्चा है।”'
  alternative: इन्हें सामान्य वर्णन की तरह “पवित्र और सच्चा व्यक्ति” कहना।
  rationale: सन्देश का वक्ता मसीह है और लेखयुक्त विशेषण गम्भीर उपाधियों के रूप में कार्य करते हैं। अनुवाद इस उच्च मसीह-विज्ञान को बनाए रखता है, पर मूल से आगे कोई सिद्धान्तगत विस्तार नहीं जोड़ता।
- issue: “दाऊद की कुंजी” में यशायाह-संबंधी संकेत
  choice: मुख्य पाठ में ‘दाऊद की कुंजी’ की बाइबलीय छवि को ज्यों का त्यों रखा गया।
  alternative: इसे व्याख्यात्मक रूप से ‘दाऊद के राज्य पर अधिकार’ कहना।
  rationale: यह वाक्यांश सम्भवतः यशायाह 22:22 की ओर संकेत करता है और राजकीय अधिकार व्यक्त करता है, पर अनुवाद को छवि के स्थान पर उसकी व्याख्या नहीं रखनी चाहिए।
translation_notes:
  register: भाषा आधुनिक, गम्भीर और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘कलीसिया’ और ‘दाऊद’ जैसे प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। यूनानी पाठ के वर्तमान–भविष्य–वर्तमान कालभेद को जानबूझकर समतल नहीं किया गया।
