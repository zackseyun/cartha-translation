id: REV.3.5
reference: Revelation 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ νικῶν ⸀οὕτως περιβαλεῖται ἐν ἱματίοις λευκοῖς, καὶ οὐ μὴ ἐξαλείψω τὸ ὄνομα αὐτοῦ ἐκ τῆς βίβλου τῆς ζωῆς, καὶ ὁμολογήσω τὸ ὄνομα αὐτοῦ ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/005.yaml
  text: The one who conquers will thus be clothed in white garments[a], and I will certainly not erase his name from the book of life[d][c][b], and I will confess his name before my Father and before his angels.
translation:
  language: hi
  text: जो विजयी होता है[a], उसे इसी प्रकार सफेद वस्त्र पहनाए जाएँगे, और मैं उसका नाम जीवन की पुस्तक[c] में से कभी भी नहीं मिटाऊँगा[b]। और मैं अपने पिता के सामने और उसके स्वर्गदूतों के सामने उसका नाम स्वीकार करूँगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो जय पाता है।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ अत्यन्त प्रबल निषेध है; इसका अनुवाद “मैं उसका नाम जीवन की पुस्तक में से किसी भी रीति से नहीं मिटाऊँगा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात परमेश्वर से संबंध रखने वाले और जीवन पाने वाले लोगों का स्वर्गीय लेखा।
    reason: cultural_note
  - marker: d
    text: 'अर्थात मैं खुले रूप से उसे अपना मानूँगा। तुलना करें: मत्ती 10:32।'
    reason: cross_reference
lexical_decisions:
- source_word: ὁ νικῶν
  choice: जो विजयी होता है
  rationale: वर्तमान कृदन्त यहाँ संज्ञा के रूप में प्रयुक्त है और लगातार बने रहने वाली पहचान को व्यक्त करता है। ‘विजयी होता है’ प्रकाशितवाक्य में विजय के प्रमुख भाव को बनाए रखता है।
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह शब्द पिछले पद में कही गई बात से इस प्रतिज्ञा का संबंध दिखाता है; इसलिए इसे अनूदित किया गया है, छोड़ा नहीं गया।
- source_word: περιβαλεῖται ἐν ἱματίοις λευκοῖς
  choice: उसे इसी प्रकार सफेद वस्त्र पहनाए जाएँगे
  rationale: क्रिया के मध्य/कर्मवाच्य रूप को प्रसंग में प्रतिज्ञा और प्रदान किए जाने वाले सम्मान के रूप में स्वाभाविक हिन्दी कर्मवाच्य से व्यक्त किया गया है। ἱμάτια का सामान्य अर्थ ‘वस्त्र’ है; ‘चोगे’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ा गया।
- source_word: οὐ μὴ ἐξαλείψω
  choice: मैं ... निश्चय ही कभी नहीं मिटाऊँगा
  rationale: οὐ μή के साथ भविष्यकाल अत्यन्त प्रबल निषेध व्यक्त करता है। ‘निश्चय ही कभी नहीं’ उस बल को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐκ τῆς βίβλου τῆς ζωῆς
  choice: जीवन की पुस्तक में से
  rationale: ‘जीवन की पुस्तक’ स्थापित और स्पष्ट बाइबलीय पदबंध है। ‘में से’ यूनानी ἐκ के निष्कासन-संबंधी भाव को बनाए रखता है।
- source_word: ὁμολογήσω τὸ ὄνομα αὐτοῦ
  choice: उसका नाम स्वीकार करूँगा
  rationale: ὁμολογέω यहाँ किसी को सार्वजनिक रूप से अपना मानने या स्वीकार करने का भाव देता है। यह हिन्दी में ‘नाम का अंगीकार करूँगा’ की अपेक्षा अधिक स्वाभाविक है और केवल नाम बोल देने तक अर्थ को सीमित नहीं करता।
- source_word: ἐνώπιον τοῦ πατρός μου καὶ ἐνώπιον τῶν ἀγγέλων αὐτοῦ
  choice: अपने पिता और उसके स्वर्गदूतों के सामने
  rationale: दोनों बार आए ἐνώπιον का अर्थ ‘के सामने’ से व्यक्त होता है। निकटतम व्याकरणिक संदर्भ के अनुसार ‘उसके’ का संबंध पिता से रखा गया है।
theological_decisions:
- issue: जीवन की पुस्तक से नाम न मिटाने की प्रतिज्ञा और उद्धार में बने रहने या उससे गिरने का प्रश्न
  choice: वचन को विजयी व्यक्ति के लिए मसीह की प्रबल प्रतिज्ञा के रूप में सीधे अनूदित किया गया है।
  alternative: इसे या तो संतों के अनिवार्य रूप से अंत तक बने रहने की निर्णायक शिक्षा, या उद्धार खो सकने की निर्णायक चेतावनी के रूप में स्पष्ट करना।
  rationale: यह पद स्वयं प्रतिज्ञा की भाषा बोलता है, पर व्यापक धर्मवैज्ञानिक विवाद का निष्कर्ष स्पष्ट रूप से नहीं देता। अनुवाद प्रतिज्ञा का बल बनाए रखता है और तनाव को कृत्रिम रूप से हल नहीं करता।
- issue: ὁ νικῶν और αὐτοῦ की पुल्लिंग एकवचन रचना
  choice: प्रतिनिधिक एकवचन को ‘जो ... होता है’ और ‘उसका नाम’ से रखा गया है।
  alternative: बहुवचन या पूर्णतः लिंग-निरपेक्ष पुनर्रचना।
  rationale: हिन्दी का यह वाक्य स्रोत की एकवचन संरचना और उसके सामान्य, प्रतिनिधिक आशय—हर ऐसे व्यक्ति—दोनों को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज रखी गई है। ‘सफेद वस्त्र’, ‘जीवन की पुस्तक’ और ‘स्वर्गदूत’ जैसे परिचित बाइबलीय पदबंध बनाए गए हैं। दो स्वतंत्र ‘और’ यूनानी वाक्य की क्रमिक प्रतिज्ञाओं को बिना अनावश्यक विरोधसूचक शब्द जोड़े प्रस्तुत करते हैं।
