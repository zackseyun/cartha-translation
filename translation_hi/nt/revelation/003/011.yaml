base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/011.yaml
  text: I am coming soon[a]; hold fast what you have[b], so that no one may take your crown.
translation:
  language: hi
  text: मैं शीघ्र आ रहा हूँ[a]। जो कुछ तुम्हारे पास है, उसे दृढ़ता से थामे रहो, ताकि कोई तुम्हारा मुकुट[b] न ले ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तेजी से आ रहा हूँ।” यूनानी क्रियाविशेषण समय की निकटता या कार्य की तीव्रता—दोनों में से किसी पर बल दे सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द विजय या सम्मान में मिलने वाले मुकुट अथवा माला का संकेत करता है; यह विशेष रूप से राजकीय किरीट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχομαι
  choice: मैं ... आ रहा हूँ
  rationale: वर्तमानकालीन रूप यहाँ निकट भविष्य में होने वाले आगमन का भाव रखता है। हिंदी में ‘आ रहा हूँ’ आसन्न आगमन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ταχύ
  choice: शीघ्र
  rationale: यह क्रियाविशेषण समय की निकटता (‘जल्द’) अथवा कार्य की तीव्रता (‘तेजी से’) जता सकता है। ‘शीघ्र’ मुख्य पाठ में दोनों अर्थों के बीच कुछ खुलापन बनाए रखता है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: κράτει
  choice: दृढ़ता से थामे रहो
  rationale: आज्ञार्थक क्रिया किसी वस्तु को मजबूती से पकड़े रखने और उसमें बने रहने का आग्रह करती है। यह हिंदी अभिव्यक्ति दृढ़ता और निरंतरता दोनों दर्शाती है।
- source_word: ὃ ἔχεις
  choice: जो कुछ तुम्हारे पास है
  rationale: मूल पाठ की तरह वस्तु को अनिर्दिष्ट रखा गया है, ताकि उसका आशय संदर्भ से समझा जाए और अनावश्यक व्याख्या न जोड़ी जाए।
- source_word: ἵνα μηδεὶς λάβῃ
  choice: ताकि कोई ... न ले ले
  rationale: यह अनचाहे परिणाम को रोकने वाला प्रयोजन-वाक्य है। ‘न ले ले’ स्वाभाविक हिंदी में चेतावनी का भाव व्यक्त करता है।
- source_word: τὸν στέφανόν σου
  choice: तुम्हारा मुकुट
  rationale: στέφανος विजय या सम्मान में मिलने वाले मुकुट अथवा माला को दर्शाता है, राजकीय किरीट को अनिवार्यतः नहीं। पठनीय मुख्य पाठ में ‘मुकुट’ रखा गया है और विशेष अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: मसीह के आगमन के संबंध में ταχύ का अर्थ
  choice: शीघ्र
  alternative: जल्द; तेजी से
  rationale: मूल यूनानी शब्द समय की निकटता या क्रिया की तीव्रता पर बल दे सकता है। मुख्य पाठ में स्वाभाविक और अपेक्षाकृत खुला ‘शीघ्र’ रखा गया है, जबकि अर्थगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दूसरे पुरुष एकवचन ‘तुम’ मूल पाठ के एकवचन रूपों को सुरक्षित रखता है। मुख्य पाठ में στέφανος के लिए प्रचलित ‘मुकुट’ प्रयुक्त है; इसके विजय-सम्मान संबंधी विशेष अर्थ को lexical decision में दर्ज किया गया है।
