id: REV.3.1
reference: Revelation 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ τῷ ἀγγέλῳ τῆς ἐν Σάρδεσιν ἐκκλησίας γράψον· Τάδε λέγει ὁ ἔχων τὰ ἑπτὰ πνεύματα τοῦ θεοῦ καὶ τοὺς ἑπτὰ ἀστέρας· Οἶδά σου τὰ ἔργα, ὅτι ὄνομα ἔχεις ὅτι ζῇς, καὶ νεκρὸς εἶ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/001.yaml
  text: 'And write to the angel of the church in Sardis: These things says the one who has the seven spirits of God and the seven stars: I know your works[a]; you have a name that you are alive[d][c][b], but you are dead.'
translation:
  language: hi
  text: '“और सरदीस की कलीसिया के स्वर्गदूत[a] को लिख: ‘ये बातें वह कहता है, जिसके पास परमेश्वर की सात आत्माएँ[b] और सात तारे हैं: मैं तेरे कामों को जानता हूँ; तेरी ख्याति है कि तू जीवित है[c], पर तू मरा हुआ है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेशवाहक।” यूनानी शब्द का अर्थ स्वर्गदूत या संदेशवाहक, दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “परमेश्वर की सात आत्माएँ” मूल का शाब्दिक बहुवचन है। यह पवित्र आत्मा की परिपूर्णता का प्रतीक हो सकता है; कुछ लोग इसे सात स्वर्गीय आत्माएँ समझते हैं।
    reason: alternative_reading
  - marker: c
    text: अधिक शाब्दिक रूप में, “तेरा नाम है कि तू जीवित है।” यहाँ “नाम” का अर्थ ख्याति या प्रतिष्ठा है।
    reason: lexical_clarification
lexical_decisions:
- source_word: ἀγγέλῳ
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य के दर्शनात्मक संदर्भ और बार-बार आने वाले संबोधन-सूत्र में यह स्वाभाविक मुख्य अर्थ है; ‘संदेशवाहक’ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: सरदीस के मसीही समुदाय के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित और स्पष्ट शब्द।
- source_word: Τάδε λέγει
  choice: ये बातें वह कहता है
  rationale: यूनानी बहुवचन संकेतवाचक और भविष्यद्वक्ताई घोषणा की औपचारिक लय दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ὁ ἔχων
  choice: जिसके पास ... हैं
  rationale: वर्तमान कृदन्त का स्वाभाविक हिन्दी संबंधवाचक रूप, जो अधिकार या धारण करने का भाव बनाए रखता है।
- source_word: τὰ ἑπτὰ πνεύματα τοῦ θεοῦ
  choice: परमेश्वर की सात आत्माएँ
  rationale: यूनानी के बहुवचन को व्याख्यात्मक रूप से ‘सातगुना आत्मा’ में बदले बिना अक्षुण्ण रखता है।
- source_word: τοὺς ἑπτὰ ἀστέρας
  choice: सात तारे
  rationale: मूल का सीधा और स्पष्ट अनुवाद; प्रतीक का अर्थ इस पद में जोड़ना आवश्यक नहीं।
- source_word: Οἶδά σου τὰ ἔργα
  choice: मैं तेरे कामों को जानता हूँ
  rationale: मूल के मूल्यांकन-सूत्र को निकटता से रखता है और प्रकाशितवाक्य में ‘कामों’ की शब्द-संगति बनाए रखता है।
- source_word: ὄνομα ἔχεις ὅτι ζῇς
  choice: तेरा नाम है कि तू जीवित है
  rationale: ‘नाम’ के मूल रूपक को सुरक्षित रखता है; इसका आशय प्रतिष्ठा या ख्याति है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: νεκρὸς εἶ
  choice: तू मरा हुआ है
  rationale: मूल के कठोर और प्रत्यक्ष विरोध को बिना नरम किए व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर की सात आत्माएँ’ का अभिप्राय
  choice: मुख्य पाठ में बहुवचन ‘परमेश्वर की सात आत्माएँ’ रखा गया।
  alternative: परमेश्वर का सातगुना आत्मा; परमेश्वर के सामने के सात स्वर्गीय आत्मिक प्राणी
  rationale: यूनानी पाठ बहुवचन है और प्रतीक की पहचान विवादित है; अनुवाद को पवित्र आत्मा की परिपूर्णता अथवा सात स्वर्गीय आत्माओं में से किसी एक अर्थ को निर्णायक नहीं बनाना चाहिए।
- issue: संबोधन में ‘स्वर्गदूत’ का संदर्भ
  choice: मुख्य पाठ में ‘स्वर्गदूत’ रखा गया।
  alternative: संदेशवाहक; कलीसिया का मानवीय प्रतिनिधि
  rationale: ἄγγελος का यह सामान्य अर्थ प्रकाशितवाक्य के दर्शनात्मक परिवेश में स्वाभाविक है, जबकि संदर्भ की पहचान खुली रखने हेतु दूसरा अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। एकवचन संबोधन में ‘तू/तेरे’ मूल के निकट और प्रकाशितवाक्य की सीधी, अधिकारपूर्ण वाणी के अनुकूल है। ‘कलीसिया’ हिन्दी मसीही पाठ-परंपरा का परिचित शब्द है। भविष्यद्वक्ताई सूत्र तथा जीवन-मृत्यु का तीखा विरोध सुरक्षित रखा गया है।
