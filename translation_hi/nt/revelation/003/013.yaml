id: REV.3.13
reference: Revelation 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἔχων οὖς ἀκουσάτω τί τὸ πνεῦμα λέγει ταῖς ἐκκλησίαις.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/003/013.yaml
  text: The one who has an ear[b][a], let him hear what the Spirit says to the churches.
translation:
  language: hi
  text: जिसके कान हों, वह सुने कि आत्मा कलीसियाओं से क्या कहता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἔχων οὖς
  choice: जिसके कान हों
  rationale: यूनानी में शाब्दिक रूप से एकवचन ‘जिसके एक कान हो’ है, पर आधुनिक हिन्दी में ‘जिसके कान हों’ इस लोकोक्तिपरक आह्वान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀκουσάτω
  choice: वह सुने
  rationale: तीसरे पुरुष की आज्ञार्थक क्रिया है। ‘वह सुने’ सुनने के साथ ध्यान देने और मानने के आह्वान को भी खुला रखता है।
- source_word: τί
  choice: क्या
  rationale: आत्मा द्वारा कही जा रही बात की विषयवस्तु को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: प्रकाशितवाक्य के इस बार-बार आने वाले सूत्र में संदर्भ पवित्र आत्मा की ओर है; हिन्दी में ‘आत्मा’ इस पारंपरिक और प्रसंगानुकूल संकेत को बनाए रखता है।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमानकालीन वाणी को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταῖς ἐκκλησίαις
  choice: कलीसियाओं से
  rationale: सम्प्रदान कारक संबोधित समुदायों को दर्शाता है। ‘कलीसिया’ प्रकाशितवाक्य के सात स्थानीय मसीही समुदायों के लिए प्रचलित और प्रसंगानुकूल शब्द है।
theological_decisions:
- issue: ‘आत्मा’ का संदर्भ
  choice: कलीसियाओं से बोलने वाला पवित्र आत्मा
  alternative: मानवीय आत्मा अथवा निर्वैयक्तिक भविष्यद्वाणी की आत्मा
  rationale: प्रकाशितवाक्य में कलीसियाओं को दिए गए इस आवर्ती उपदेश-सूत्र का निकटतम और सर्वाधिक संभावित संदर्भ पवित्र आत्मा है; अनुवाद इससे आगे कोई सम्प्रदायगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। शाब्दिक एकवचन ‘कान’ के बदले स्वाभाविक हिन्दी मुहावरे ‘कान हों’ का प्रयोग किया गया है; अर्थ और लोकोक्तिपरक बल सुरक्षित हैं।
