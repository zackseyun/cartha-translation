id: REV.14.8
reference: Revelation 14:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ⸂δεύτερος ἄγγελος⸃ ἠκολούθησεν λέγων· Ἔπεσεν, ⸀ἔπεσεν Βαβυλὼν ἡ μεγάλη, ⸀ἣ ἐκ τοῦ οἴνου τοῦ θυμοῦ τῆς πορνείας αὐτῆς πεπότικεν πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/008.yaml
  text: And another[a], a second angel, followed, saying, “Fallen, fallen is Babylon the great[c][b], she who has made all the nations drink from the wine of the passion of her sexual immorality.”
translation:
  language: hi
  text: और एक और, दूसरा स्वर्गदूत उसके पीछे आया और कहने लगा, “गिर पड़ा, गिर पड़ा वह महान बाबुल[a], जिसने सब राष्ट्रों को अपने व्यभिचार के उग्र आवेग की मदिरा पिलाई है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाबुल’ यहाँ एक नगर को स्त्री के रूप में चित्रित करता है; आगे का ‘व्यभिचार’ उसके भ्रष्टकारी, मूर्तिपूजक और विश्वासघाती प्रभाव का रूपक हो सकता है, पर मूल पाठ इसे इनमें से केवल एक अर्थ तक सीमित नहीं करता।
    reason: cultural_note
  - marker: b
    text: ‘उग्र आवेग’ के स्थान पर ‘उसके व्यभिचार के क्रोध की मदिरा’ भी सम्भव है। यूनानी θυμός तीव्र आवेग, उग्रता या क्रोध व्यक्त कर सकता है। यूनानी में शाब्दिक रूप से कहा गया है कि उसने सब राष्ट्रों को यह मदिरा ‘पिलाई है’; भाव में उन्हें मतवाला करना भी निहित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος … δεύτερος ἄγγελος
  choice: एक और, अर्थात् दूसरा स्वर्गदूत
  rationale: मूल यूनानी में ‘एक और’ और ‘दूसरा’ दोनों हैं। ‘अर्थात्’ हिन्दी में उनके समानाधिकरण संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: ἠκολούθησεν
  choice: उसके पीछे आया
  rationale: यह दर्शन में पिछले स्वर्गदूत के बाद आने का क्रम व्यक्त करता है; हिन्दी में केवल ‘पीछे चला’ अनावश्यक रूप से यात्रा का भाव दे सकता है।
- source_word: λέγων
  choice: कहने लगा
  rationale: यह कृदन्त को स्वाभाविक हिन्दी में मुख्य क्रिया से जोड़ता है और स्वर्गदूत की उद्घोषणा आरम्भ होने का भाव देता है।
- source_word: Ἔπεσεν, ἔπεσεν
  choice: गिर पड़ा, गिर पड़ा
  rationale: दोहराव और भविष्यसूचक न्याय-घोषणा का जोर सुरक्षित रहता है; पुल्लिंग रूप ‘बाबुल’ नाम के प्रचलित हिन्दी व्याकरणिक व्यवहार के अनुरूप है।
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: वह महान बाबुल
  rationale: विशेषण के उपाधि-सदृश बल को बनाए रखते हुए पदक्रम को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἣ
  choice: जिसने
  rationale: सम्बन्धवाचक सर्वनाम बाबुल को व्यक्तिरूप में आगे की क्रिया से जोड़ता है; हिन्दी में अलग स्त्रीलिंग सर्वनाम थोपना अस्वाभाविक होता।
- source_word: ἐκ τοῦ οἴνου
  choice: मदिरा पिलाई
  rationale: ποτίζω के पिलाने वाले कारक अर्थ में पेय-स्रोत का भाव हिन्दी वाक्य में अंतर्निहित है; ‘मदिरा में से’ अत्यधिक शब्दशः और अस्वाभाविक होता।
- source_word: τοῦ θυμοῦ
  choice: उन्मत्त वासना
  rationale: θυμός की तीव्र आवेग, उग्रता और क्रोध की अर्थ-सीमा को इस प्रसंग में पोρνεία से जुड़े मदहोश करने वाले प्रबल आवेग के रूप में व्यक्त करता है, बिना इसे केवल ‘क्रोध’ तक सीमित किए।
- source_word: τῆς πορνείας αὐτῆς
  choice: अपने व्यभिचार की
  rationale: ‘व्यभिचार’ आधुनिक हिन्दी में यौन अनैतिकता के साथ आध्यात्मिक बेवफाई का रूपक भी वहन कर सकता है; मूल पाठ की व्यापक और रूपकात्मक गुंजाइश सुरक्षित रहती है।
- source_word: πεπότικεν
  choice: पिलाई है
  rationale: परिपूर्ण काल के पूर्ण हो चुके और वर्तमान प्रभाव वाले कारक अर्थ को सुरक्षित रखता है।
- source_word: πάντα τὰ ἔθνη
  choice: सब राष्ट्रों को
  rationale: ἔθνη यहाँ व्यापक रूप से राष्ट्रों अथवा जातियों को सूचित करता है; इसे केवल गैर-यहूदियों तक सीमित नहीं किया गया।
theological_decisions:
- issue: बाबुल के πορνεία का रूपकात्मक बल
  choice: मुख्य पाठ में ‘व्यभिचार’ रखा गया है।
  alternative: मूर्तिपूजा, आध्यात्मिक बेवफाई, वेश्यावृत्ति
  rationale: यह यौन बिंब को बनाए रखता है और उसे केवल मूर्तिपूजा, राजनीति या वाचा-भंग में से किसी एक अर्थ तक सीमित नहीं करता।
- issue: ‘τοῦ θυμοῦ τῆς πορνείας’ में θυμός का अर्थ
  choice: ‘उन्मत्त वासना’
  alternative: ‘क्रोध’ अथवा ‘उग्रता’
  rationale: इस विन्यास में शब्द बाबुल के व्यभिचार से जुड़ा है और तीव्र आवेग या उग्र जुनून का अर्थ दे सकता है; फिर भी क्रोध वाला पाठार्थ संभव है और पादटिप्पणी में सुरक्षित है।
- issue: बाबुल का व्यक्तिरूप
  choice: सम्बन्धवाचक ‘जिसने’ द्वारा व्यक्तिरूप को बनाए रखा गया।
  alternative: नगर को निर्जीव मानकर ‘जिसने’ के बजाय वर्णनात्मक पुनर्रचना
  rationale: मूल का स्त्रीलिंग सम्बन्धवाचक रूप बाबुल को स्त्री/नगर के रूप में व्यक्त करता है, पर हिन्दी में कृत्रिम स्त्रीलिंग सर्वनाम जोड़े बिना यह भाव संप्रेषित होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और उद्घोषणात्मक रखी गई है। ‘गिर पड़ा, गिर पड़ा’ मूल के जोरदार दोहराव को सुरक्षित रखता है। ‘मदिरा’, ‘व्यभिचार’ और ‘उन्मत्त वासना’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि प्रकाशन-ग्रंथ की प्रतीकात्मक और धार्मिक तनावपूर्ण भाषा को सपाट व्याख्या में नहीं बदलते।
