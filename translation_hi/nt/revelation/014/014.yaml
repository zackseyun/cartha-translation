source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ νεφέλη λευκή, καὶ ἐπὶ τὴν νεφέλην καθήμενον ὅμοιον ⸀υἱὸν ἀνθρώπου, ἔχων ἐπὶ τῆς κεφαλῆς αὐτοῦ στέφανον χρυσοῦν καὶ ἐν τῇ χειρὶ αὐτοῦ δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/014.yaml
  text: And I looked[a], and behold, a white cloud, and seated on the cloud was one like a son of man[b], having on his head a golden crown and in his hand a sharp sickle.
translation:
  language: hi
  text: और मैंने देखा, और देखो, एक सफेद बादल था, और उस बादल पर मनुष्य के पुत्र के समान कोई बैठा था[a]। उसके सिर पर सोने का मुकुट था[b] और उसके हाथ में एक तेज़ हँसिया थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्य के पुत्र” को यहाँ उपाधि के रूप में भी समझा जा सकता है। यह वाक्यांश दानिय्येल 7:13 की प्रतिध्वनि है और प्रायः मसीही उपाधि के रूप में समझा जाता है; पर यहाँ यूनानी में “पुत्र” से पहले निश्चित उपपद नहीं है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “मुकुट” के लिए यूनानी शब्द स्तेफ़ानोस है, जो प्रायः राजकीय मुकुट के बजाय विजेता को दी जाने वाली माला को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह यूहन्ना के दर्शन-वर्णन में अचानक ध्यान आकर्षित करने वाली जीवंत पुकार को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: νεφέλη λευκή
  choice: एक सफेद बादल
  rationale: ‘सफेद’ λευκή का सीधा अर्थ देता है और प्रकाशितवाक्य में उसके प्रतीकात्मक अर्थ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἐπὶ τὴν νεφέλην καθήμενον
  choice: उस बादल पर ... बैठा था
  rationale: यह बैठी हुई अवस्था बताने वाले कृदंत का सहज हिन्दी रूप है और दर्शन के दृश्य को स्पष्ट रखता है।
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: कोई मनुष्य के पुत्र के समान
  rationale: यह ὅμοιον की समानता और υἱὸν ἀνθρώπου की शब्दावली दोनों को बनाए रखता है। हिन्दी में उपपदों का अभाव होने के कारण यूनानी के अनिश्चित भाव को ‘कोई’ से व्यक्त किया गया है, जबकि दानिय्येल 7:13 की प्रतिध्वनि भी बनी रहती है।
- source_word: στέφανον χρυσοῦν
  choice: सोने का मुकुट
  rationale: यह सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है। στέφανος के विजय-माला वाले विशेष भाव को पादटिप्पणी में बताया गया है।
- source_word: δρέπανον ὀξύ
  choice: एक तेज़ हँसिया
  rationale: यह कटनी के औज़ार और आगे आने वाले फसल-कटाई के बिंब को स्पष्ट, प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या υἱὸν ἀνθρώπου को स्पष्ट मसीही उपाधि के रूप में अनुवाद किया जाए
  choice: मुख्य पाठ में ‘कोई मनुष्य के पुत्र के समान’ रखा गया
  alternative: ‘मनुष्य के पुत्र’ जैसा कोई
  rationale: यूनानी में υἱὸν से पहले निश्चित उपपद नहीं है, इसलिए मुख्य पाठ में इसे निश्चित उपाधि बनाकर अर्थ को अधिक स्पष्ट नहीं किया गया। फिर भी यह वाक्यांश दानिय्येल 7:13 की प्रबल प्रतिध्वनि है और संदर्भ में प्रायः मसीह के लिए समझा जाता है; इस कारण वैकल्पिक उपाधिपरक समझ पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दर्शन-साहित्य के अनुरूप रखी गई है। ‘देखो’ से मूल की आकस्मिकता, ‘सफेद बादल’ से सीधा दृश्य-बिंब, और ‘तेज़ हँसिया’ से कटनी का प्रसंग सुरक्षित रहता है। सर्वनामों की पुनरावृत्ति मूल की संरचना को पर्याप्त रूप से दर्शाती है, पर वाक्य हिन्दी में स्वाभाविक बने रहते हैं।
