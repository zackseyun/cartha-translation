  text: These are the ones who have not defiled themselves with women[a], for they are virgins. These are the ones who follow the Lamb wherever he goes. These were purchased from among mankind as firstfruits to God and to the Lamb[b],
translation:
  language: hi
  text: ये वे हैं जो स्त्रियों के साथ अशुद्ध नहीं हुए हैं[a], क्योंकि वे कुँवारे हैं। ये वे हैं जो मेम्ने का अनुसरण करते हैं, वह जहाँ कहीं भी जाता है। इन्हें मनुष्यों में से परमेश्वर और मेम्ने के लिए पहली उपज के रूप में मोल लिया गया है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभव है कि यह चित्र केवल यौन-संयम का शाब्दिक कथन न होकर आत्मिक शुद्धता या मूर्तिपूजा से होने वाली अशुद्धता से बचे रहने का संकेत हो।
    reason: alternative_reading
  - marker: b
    text: ‘मनुष्यों में से’ का अर्थ समस्त मानव समुदाय में से है, केवल पुरुषों में से नहीं।
    reason: lexical_alternative
