  rationale: यह पुरुष-वाचक बहुवचन है और सीधे यौन-असंभोग की ठोस छवि बनाए रखता है; इसे केवल ‘पवित्र’ कहने से संभावित प्रतीकात्मक अर्थ मुख्य पाठ में आरोपित हो जाता।
- source_word: ἀκολουθοῦντες
