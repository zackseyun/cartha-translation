id: REV.14.12
reference: Revelation 14:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὧδε ἡ ὑπομονὴ τῶν ἁγίων ἐστίν, οἱ τηροῦντες τὰς ἐντολὰς τοῦ θεοῦ καὶ τὴν πίστιν Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/012.yaml
  text: Here is the endurance of the saints[a], those who keep the commandments of God and the faith of Jesus.
translation:
  language: hi
  text: यहीं पवित्र जनों का धीरज दिखाई देता है—वे परमेश्वर की आज्ञाओं और यीशु के विश्वास[a] का पालन करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘यीशु पर विश्वास’ भी हो सकता है; एक अन्य सम्भावना है, ‘यीशु की विश्वासयोग्यता।’ यूनानी वाक्यांश के एक से अधिक अर्थ सम्भव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὧδε
  choice: यहीं
  rationale: यह संकेतवाचक क्रियाविशेषण अभी-अभी वर्णित परिस्थिति की ओर संकेत करता है; ‘यहीं’ उसके आलंकारिक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ὑπομονὴ
  choice: धीरज
  rationale: यह शब्द परीक्षा और दबाव के बीच दृढ़ बने रहने का भाव व्यक्त करता है। ‘धीरज’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और परिचित है।
- source_word: ἁγίων
  choice: पवित्र जनों
  rationale: यह परमेश्वर के लिए अलग किए गए लोगों का सामूहिक पद है। ‘पवित्र जन’ सामान्य पाठक के लिए स्पष्ट है और ‘संतों’ से जुड़ी संभावित संस्थागत धारणाओं से बचता है।
- source_word: τηροῦντες
  choice: पालन करते … थामे रहते हैं
  rationale: एक ही यूनानी कृदंत आज्ञाओं और विश्वास दोनों पर लागू है। स्वाभाविक हिन्दी में आज्ञाओं के साथ ‘पालन करना’ और विश्वास के साथ ‘थामे रहना’ उसी निष्ठापूर्ण संरक्षण और आचरण के भाव को व्यक्त करते हैं।
- source_word: ἐντολὰς
  choice: आज्ञाओं
  rationale: ‘आज्ञाएँ’ दैवी आदेशों का भार और बाइबलीय अनुगूँज बनाए रखता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: मुख्य पाठ में सामान्य और व्यापक अर्थ वाला ‘विश्वास’ रखा गया है; ‘विश्वासयोग्यता’ को व्याख्यात्मक विकल्प के रूप में पाद-टिप्पणी में दिया गया है।
- source_word: Ἰησοῦ
  choice: यीशु के
  rationale: सम्बन्धकारक Ἰησοῦ का निकटतम हिन्दी रूप ‘यीशु के’ है। यह मुख्य पाठ में यूनानी की संरचना और उसकी वास्तविक अर्थगत अस्पष्टता को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: τὴν πίστιν Ἰησοῦ का अर्थ
  choice: यीशु के विश्वास
  alternative: यीशु पर विश्वास; अथवा यीशु की विश्वासयोग्यता
  rationale: यूनानी सम्बन्धकारक वस्तुगत हो सकता है—यीशु पर किया गया विश्वास—या कर्तृगत/सम्बन्धपरक हो सकता है—यीशु का विश्वास अथवा उनकी विश्वासयोग्यता। मुख्य पाठ निकट संरचना रखता है और अधिक स्पष्ट व्याख्याएँ पाद-टिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘दिखाई देता है’ यूनानी के संकेतात्मक कथन को स्वाभाविक हिन्दी में व्यक्त करता है। डैश के बाद पवित्र जनों की पहचान बताने वाला समानाधिकरण रखा गया है।
