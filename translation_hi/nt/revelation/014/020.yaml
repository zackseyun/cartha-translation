  text: καὶ ἐπατήθη ἡ ληνὸς ἔξωθεν τῆς πόλεως, καὶ ἐξῆλθεν αἷμα ἐκ τῆς ληνοῦ ἄχρι τῶν χαλινῶν τῶν ἵππων ἀπὸ σταδίων χιλίων ἑξακοσίων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/020.yaml
  text: And the winepress was trodden outside the city[b][a], and blood came out from the winepress up to the horses’ bridles for one thousand six hundred stadia.
translation:
  language: hi
  text: और अंगूर रौंदने का कुंड नगर के बाहर रौंदा गया, और उस कुंड से रक्त निकला[b]—घोड़ों की लगामों तक, एक हज़ार छह सौ स्तादियों की दूरी तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, “कुंड से रक्त बह निकला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπατήθη
  choice: रौंदा गया
  rationale: πατέω के कर्मवाच्य रूप का सीधा अर्थ सुरक्षित रखता है और अंगूर रौंदने के कुंड की छवि को बनाए रखता है।
- source_word: ληνός / ληνοῦ
  choice: दाखरस का कुंड
  rationale: अंगूर रौंदकर रस निकालने के स्थान के लिए प्रचलित और संक्षिप्त हिन्दी पद; न्याय की फसल वाली मूल छवि सुरक्षित रहती है।
- source_word: ἔξωθεν τῆς πόλεως
  choice: नगर के बाहर
  rationale: स्थान-सूचक यूनानी वाक्यांश का स्वाभाविक और निकट हिन्दी रूप।
- source_word: ἐξῆλθεν αἷμα
  choice: लहू निकला
  rationale: ἐξέρχομαι के सामान्य अर्थ ‘निकलना’ को बनाए रखता है; ‘बह निकला’ प्रसंगानुकूल है, पर प्रवाह का भाव कुछ अधिक स्पष्ट करके जोड़ता है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: ἄχρι τῶν χαλινῶν τῶν ἵππων
  choice: घोड़ों की लगामों की ऊँचाई तक
  rationale: ἄχρι द्वारा बताई गई सीमा को दृश्य और स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ लगामें लहू की ऊँचाई का मान देती हैं।
- source_word: ἀπὸ σταδίων χιλίων ἑξακοσίων
  choice: एक हज़ार छह सौ स्तादियों की दूरी तक
  rationale: प्राचीन माप को मूल रूप में रखते हुए ἀπό के साथ व्यक्त स्थानिक विस्तार को सहज हिन्दी में प्रस्तुत करता है; आधुनिक दूरी पाद-टिप्पणी में दी गई है।
theological_decisions:
- issue: प्रलय-दर्शन की रक्त, घोड़ों की लगामों और विशाल दूरी वाली तीखी छवि को ज्यों का त्यों रखना या उसकी व्याख्या करके नरम करना
  choice: ठोस और अतिरंजित-सी प्रलय-दर्शी छवि को बिना व्याख्यात्मक नरमी के बनाए रखना
  alternative: इसे अत्यन्त व्यापक न्याय का प्रतीक बताकर भावानुवाद करना
  rationale: मूल पाठ स्वयं छवि का अर्थ नहीं खोलता। अनुवाद में उसकी प्रतीकात्मक शक्ति और धर्मवैचारिक तनाव को पाठक के लिए खुला रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य अपनाया गया है। ‘दाखरस का कुंड’ स्थापित धार्मिक शब्दावली और सामान्य बोध के बीच संतुलन रखता है। डैश के बाद समानांतर ‘...तक’ पद मूल के ऊँचाई और दूरी—दोनों विस्तारों को बिना अनावश्यक व्याख्या के स्पष्ट करते हैं।
