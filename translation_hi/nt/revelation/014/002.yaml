source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνὴν ἐκ τοῦ οὐρανοῦ ὡς φωνὴν ὑδάτων πολλῶν καὶ ὡς φωνὴν βροντῆς μεγάλης, καὶ ἡ φωνὴ ἣν ἤκουσα ὡς κιθαρῳδῶν κιθαριζόντων ἐν ταῖς κιθάραις αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/002.yaml
  text: And I heard a sound from heaven like the sound of many waters and like the sound of loud thunder[c][b][a], and the sound that I heard was like harpists playing on their harps.
translation:
  language: hi
  text: और मैंने स्वर्ग से एक ध्वनि सुनी, जो बहुत-से जल की ध्वनि और प्रचंड गर्जना की ध्वनि जैसी थी; और जो ध्वनि मैंने सुनी, वह ऐसी थी जैसे वीणा बजानेवाले अपनी वीणाएँ बजा रहे हों।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ध्वनि’ के प्रत्येक स्थान पर ‘आवाज़’ या ‘वाणी’ भी अनुवाद किया जा सकता है; यूनानी शब्द φωνή संदर्भ के अनुसार इनमें से किसी अर्थ में आ सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बहुत-से जल’ एक विशाल, प्रबल गर्जना का बाइबलीय बिंब है; तुलना करें, यहेजकेल 43:2।
    reason: cross_reference
  - marker: c
    text: यहाँ ‘वीणा’ के लिए प्रयुक्त यूनानी κιθάρα एक प्राचीन तारवाला वाद्य था, जो आधुनिक हार्प की अपेक्षा लायर के अधिक निकट था।
    reason: cultural_note
lexical_decisions:
- source_word: φωνή
  choice: ध्वनि
  rationale: तीनों प्रयोग जल, गर्जन और वाद्य-संगीत से तुलना किए गए श्रव्य प्रभाव को बताते हैं। ‘ध्वनि’ गैर-वाचिक आशय को स्वाभाविक रूप से व्यक्त करती है, जबकि यूनानी शब्द में ‘आवाज़/वाणी’ की संभावना भी बनी रहती है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से आती हुई
  rationale: यहाँ οὐρανός प्रकाशितवाक्य के संदर्भ में केवल आकाश नहीं, स्वर्गीय लोक को सूचित करता है; ‘आती हुई’ हिन्दी में स्रोत-संबंध को सहज बनाता है।
- source_word: ὡς
  choice: जैसी
  rationale: यह पद में बार-बार आने वाली उपमाओं को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑδάτων πολλῶν
  choice: बहुत-से जल
  rationale: यह रूप मूल के बहुवचन और बाइबलीय बिंब को सुरक्षित रखता है, बिना उसे ‘उमड़ती लहरों’ जैसे अधिक व्याख्यात्मक रूप में बदलने के।
- source_word: βροντῆς μεγάλης
  choice: बड़ी गर्जन
  rationale: μέγας गर्जन की प्रबलता और विशाल प्रभाव बताता है। ‘बड़ी गर्जन’ मूल रूपक के निकट रहते हुए समझने योग्य है।
- source_word: κιθαρῳδῶν
  choice: वीणा बजानेवालों
  rationale: संदर्भ में अगला कृदंत वाद्य बजाने की क्रिया स्पष्ट करता है। हिन्दी बाइबल-परंपरा और सामान्य बोध में ‘वीणा बजानेवाले’ संक्षिप्त और पहचाना जाने वाला रूप है।
- source_word: κιθαριζόντων
  choice: बजाने
  rationale: यह वाद्य बजाने की प्रत्यक्ष क्रिया को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ἐν ταῖς κιθάραις αὐτῶν
  choice: अपनी वीणाएँ बजाने
  rationale: हिन्दी में वाद्य के साथ ‘बजाना’ स्वाभाविक प्रयोग है; αὐτῶν का आशय ‘अपनी’ से स्पष्ट होता है।
theological_decisions:
- issue: स्वर्गीय श्रव्य घटना का स्वरूप
  choice: φωνή को पूरे पद में ‘ध्वनि’ कहना
  alternative: हर स्थान पर ‘आवाज़’ या ‘वाणी’ कहना; अथवा अलग-अलग स्थानों पर ‘आवाज़’ और ‘ध्वनि’ मिलाकर कहना
  rationale: जल, गर्जन और वाद्य-संगीत से तुलना गैर-वाचिक श्रव्य प्रभाव पर बल देती है। ‘ध्वनि’ किसी अनिर्दिष्ट वक्ता को जोड़ने से बचती है, जबकि पाद-टिप्पणी यूनानी शब्द की ‘आवाज़/वाणी’ वाली वास्तविक अर्थ-संभावना सुरक्षित रखती है।
- issue: ‘बहुत-से जल’ के बिंब की व्याख्या
  choice: बिंब को शाब्दिक रूप में बनाए रखना
  alternative: ‘प्रचंड जलराशि’ या ‘उमड़ते जल’ कहकर उसकी गर्जना को स्पष्ट करना
  rationale: शाब्दिक बिंब यहेजकेल 43:2 जैसे बाइबलीय समानांतरों की प्रतिध्वनि बनाए रखता है और पाठ की काव्यात्मक अस्पष्टता को अनावश्यक रूप से नहीं खोलता।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और श्रव्य बिंबों की पुनरावृत्ति को सुरक्षित रखने वाली है। ‘बहुत-से जल’ जानबूझकर कुछ औपचारिक रखा गया है ताकि मूल का बाइबलीय बिंब बना रहे। पाद-टिप्पणी चिह्न [a] और [b] मुख्य पाठ में उपस्थित हैं।
