  text: Καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ τοῦ ἐν τῷ οὐρανῷ, ἔχων καὶ αὐτὸς δρέπανον ὀξύ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/017.yaml
  text: And another angel came out from the temple in heaven[a], also having a sharp sickle.
translation:
  language: hi
  text: फिर एक और स्वर्गदूत स्वर्ग में स्थित मंदिर[a] से बाहर निकला। उसके पास भी एक तेज़ धार वाला हँसिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग में स्थित पवित्रस्थान’। यूनानी शब्द ναός विशेष रूप से मंदिर के भीतरी पवित्र भाग या पवित्रस्थान को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: एक और स्वर्गदूत
  rationale: ἄλλος क्रम में उसी प्रकार के एक अन्य स्वर्गदूत को दर्शाता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐξῆλθεν
  choice: बाहर निकला
  rationale: ἐξέρχομαι भीतर से बाहर आने की गति व्यक्त करता है; ‘बाहर निकला’ आधुनिक हिन्दी का सहज प्रयोग है।
- source_word: ναοῦ
  choice: मंदिर
  rationale: ναός मंदिर, और अधिक विशिष्ट अर्थ में उसके पवित्रस्थान, को सूचित कर सकता है। मुख्य पाठ में परिचित शब्द ‘मंदिर’ रखा गया है और अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῦ ἐν τῷ οὐρανῷ
  choice: स्वर्ग में स्थित
  rationale: यह विशेषणात्मक पदबंध मंदिर का स्थान स्वर्ग में बताता है; ‘स्थित’ जोड़ने से हिन्दी में संबंध स्पष्ट और स्वाभाविक होता है।
- source_word: ἔχων καὶ αὐτὸς
  choice: उसके पास भी ... था
  rationale: यह रचना इस बात पर बल देती है कि पिछले पात्र की तरह इस स्वर्गदूत के पास भी हँसिया था; हिन्दी में स्वतंत्र वाक्य इस अर्थ को सहजता से व्यक्त करता है।
- source_word: δρέπανον
  choice: हँसिया
  rationale: δρέπανον कटाई में प्रयुक्त मुड़ी हुई धार वाला औज़ार है; ‘हँसिया’ इसका सामान्य और सटीक हिन्दी नाम है।
- source_word: ὀξύ
  choice: तेज़
  rationale: ὀξύ हँसिए की धार को पैना बताता है; औज़ार की धार के लिए ‘तेज़’ स्वाभाविक आधुनिक हिन्दी है।
theological_decisions:
- issue: स्वर्गीय मंदिर की छवि का स्वरूप
  choice: ναός का सीधा अनुवाद ‘मंदिर’ किया गया है, बिना किसी व्याख्यात्मक विस्तार के।
  alternative: ‘पवित्रस्थान’ कहना, जिससे भीतरी पवित्र भाग पर अधिक बल पड़े; या इसे प्रतीकात्मक स्वर्गीय निवास के रूप में व्याख्यायित करना।
  rationale: प्रकाशितवाक्य की स्वर्गीय मंदिर-छवि को जैसा कहा गया है वैसा ही बनाए रखना उचित है। इससे यह अनिर्णीत रहता है कि चित्र वास्तु-संबंधी, प्रतीकात्मक या उपासना-संबंधी है, और पाठ में कोई विशिष्ट धर्मवैज्ञानिक योजना नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी कृदंत को हिन्दी में दूसरे वाक्य के रूप में प्रस्तुत किया गया है, जिससे ‘भी’ का तुलनात्मक बल स्पष्ट रहता है।
