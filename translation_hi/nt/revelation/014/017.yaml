    issue: “तेज़ हँसिया” does not explicitly identify sharpness as a quality of the sickle’s blade.
    rationale: ὀξύ means “sharp” here. “तेज़ धार वाला हँसिया” is natural Hindi and more precisely expresses the intended image without adding interpretation.
