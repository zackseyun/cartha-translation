id: REV.14.15
reference: Revelation 14:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἄλλος ἄγγελος ἐξῆλθεν ἐκ τοῦ ναοῦ κράζων ἐν φωνῇ μεγάλῃ τῷ καθημένῳ ἐπὶ τῆς νεφέλης· Πέμψον τὸ δρέπανόν σου καὶ θέρισον, ὅτι ἦλθεν ἡ ὥρα θερίσαι, ὅτι ἐξηράνθη ὁ θερισμὸς τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/015.yaml
  text: And another angel came out from the sanctuary, crying out with a loud voice to the one seated on the cloud, “Send your sickle and reap, because the hour to reap has come, because the harvest of the earth is ripe.”
translation:
  language: hi
  text: तब एक और स्वर्गदूत पवित्रस्थान से बाहर निकला और बादल पर बैठे हुए को ऊँचे स्वर में पुकारकर कहा, “अपना हँसिया चला और कटनी कर, क्योंकि कटनी करने का समय आ गया है, क्योंकि पृथ्वी की फसल सूख गई है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ναός
  choice: पवित्रस्थान
  rationale: यह शब्द प्रकाशितवाक्य में मंदिर के भीतरी पवित्रस्थान को सूचित करता है; इसलिए सामान्य ‘मंदिर’ की अपेक्षा ‘पवित्रस्थान’ अधिक सटीक है।
- source_word: Πέμψον τὸ δρέπανόν σου
  choice: अपना हँसिया चला
  rationale: शाब्दिक अर्थ ‘अपना हँसिया भेज/लगा’ है; कटनी के प्रसंग में आधुनिक स्वाभाविक हिन्दी में ‘हँसिया चला’ उसी क्रियात्मक भाव को स्पष्ट करता है।
- source_word: θέρισον / θερίσαι
  choice: कटनी कर / कटनी करने
  rationale: दोनों रूपों में मूल की शब्द-पुनरावृत्ति यथासंभव बनाए रखी गई है।
- source_word: ἐξηράνθη
  choice: पक चुकी है
  rationale: मूलतः ‘सूख गई’ का भाव रखता है, पर फसल के संदर्भ में कटाई के लिए पूरी तरह तैयार हो जाने को दर्शाता है; ‘पक चुकी है’ हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: पृथ्वी की फसल की प्रतीकात्मक पहचान
  choice: इसे केवल ‘पृथ्वी की फसल’ के रूप में रखा गया
  alternative: इसे स्पष्टतः दुष्टों का न्याय या धर्मियों का संग्रह बताना
  rationale: यह पद स्वयं फसल की पहचान स्पष्ट नहीं करता; अनुवाद में प्रतीक की वास्तविक अस्पष्टता बनाए रखी गई है।
- issue: बादल पर बैठे हुए की पहचान
  choice: ‘बादल पर बैठे हुए’
  alternative: नाम जोड़कर ‘मनुष्य का पुत्र’ या ‘मसीह’ कहना
  rationale: निकटवर्ती संदर्भ पहचान का संकेत देता है, पर इस पद में संज्ञा दोहराई नहीं गई; अतः मूल अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। आज्ञार्थक एकवचन ‘कर’ मूल यूनानी एकवचन आदेश के अनुरूप है।
