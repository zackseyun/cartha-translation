id: REV.14.19
reference: Revelation 14:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ ἄγγελος τὸ δρέπανον αὐτοῦ εἰς τὴν γῆν, καὶ ἐτρύγησεν τὴν ἄμπελον τῆς γῆς, καὶ ἔβαλεν εἰς τὴν ληνὸν τοῦ θυμοῦ τοῦ θεοῦ τὸν μέγαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/019.yaml
  text: And the angel swung his sickle over the earth, and harvested the vine of the earth, and threw it into the great winepress of the wrath of God.
translation:
  language: hi
  text: तब उस स्वर्गदूत ने अपनी दराँती पृथ्वी पर चलाई और पृथ्वी की दाखलता की फसल काटी, और उसे परमेश्वर के प्रकोप के बड़े रसकुंड में डाल दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔβαλεν ... τὸ δρέπανον ... εἰς τὴν γῆν
  choice: अपनी दराँती पृथ्वी पर चलाई
  rationale: शाब्दिक ‘दराँती पृथ्वी में डाली’ आधुनिक हिन्दी में भ्रामक हो सकता है; प्रसंग में काटने के लिए दराँती चलाने की क्रिया है। ‘पृथ्वी पर’ εἰς τὴν γῆν के लक्ष्य-भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐτρύγησεν
  choice: फसल काटी
  rationale: क्रिया अंगूर की फसल एकत्र करने को सूचित करती है; हिन्दी में दाखलता के साथ ‘फसल काटी’ स्पष्ट और सहज है।
- source_word: τὴν ἄμπελον τῆς γῆς
  choice: पृथ्वी की दाखलता
  rationale: ἄμπελος का मूल अर्थ अंगूर की बेल अथवा दाखलता है। एकवचन और प्रतीकात्मक चित्र को बनाए रखने के लिए ‘दाखलता’ चुना गया है।
- source_word: τὴν ληνὸν ... τὸν μέγαν
  choice: बड़े रसकुंड में
  rationale: ληνός अंगूर रौंदने या दबाने का कुंड है। ‘रसकुंड’ संक्षिप्त रूप से उसी प्राचीन चित्र को व्यक्त करता है और μέγαν को ‘बड़े’ से सुरक्षित रखता है।
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: परमेश्वर के प्रकोप के
  rationale: θυμός यहाँ दैवी न्याय के तीव्र क्रोध को दर्शाता है; ‘प्रकोप’ गरिमापूर्ण, प्रचलित और प्रसंगानुकूल है।
theological_decisions:
- issue: दाखलता और रसकुंड की न्याय-संबंधी प्रतीकात्मकता
  choice: प्रतीकों को बिना व्याख्यात्मक विस्तार के यथावत रखा गया
  alternative: दाखलता को सीधे ‘दुष्ट लोग’ और रसकुंड को ‘दंड’ कहना
  rationale: मूल पाठ प्रकाशनात्मक बिंब के माध्यम से बोलता है; पहचान या परिणाम को गद्य में स्पष्ट कर देना पाठ की वास्तविक प्रतीकात्मकता और तनाव को सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध है। ‘दराँती’, ‘दाखलता’, ‘प्रकोप’ और ‘रसकुंड’ मूल कृषि तथा न्याय-बिंब को बनाए रखते हैं। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
