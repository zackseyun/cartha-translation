  text: καὶ ᾄδουσιν ⸀ὡς ᾠδὴν καινὴν ἐνώπιον τοῦ θρόνου καὶ ἐνώπιον τῶν τεσσάρων ζῴων καὶ τῶν πρεσβυτέρων· καὶ οὐδεὶς ἐδύνατο μαθεῖν τὴν ᾠδὴν εἰ μὴ αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες, οἱ ἠγορασμένοι ἀπὸ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/003.yaml
  text: And they are singing what seemed to be a new song before the throne and before the four living creatures and the elders[a]. And no one was able to learn the song except the one hundred forty-four thousand[b], those who had been purchased from the earth.
translation:
  language: hi
  text: और वे सिंहासन के सामने, और उन चार जीवित प्राणियों और प्राचीनों के सामने, मानो एक नया गीत गा रहे हैं[a]। उस गीत को उन एक लाख चवालीस हज़ार[b] के सिवा कोई नहीं सीख सका, जिन्हें पृथ्वी से खरीदा गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक नए गीत के समान” या “मानो नया गीत।” यूनानी में यहाँ दर्शन में दिखाई या सुनाई पड़ने की प्रतीति व्यक्त करने वाली भाषा है।
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी से मोल देकर छुड़ाए गए।” यूनानी क्रिया का शाब्दिक अर्थ “मोल लेना” या “खरीदना” है।
    reason: alternative_reading
lexical_decisions:
- source_word: ᾄδουσιν
  choice: गा रहे थे
  rationale: यूनानी वर्तमान काल प्रकाशन के दर्शन-वर्णन का सजीव वर्तमान है; हिंदी में चल रहे दृश्य के स्वाभाविक वर्णन हेतु अपूर्ण भूतकाल चुना गया।
- source_word: ὡς ᾠδὴν καινὴν
  choice: ऐसा ... मानो कोई नया गीत हो
  rationale: ὡς की दृश्यात्मक/प्रतीयमान भाषा को सुरक्षित रखते हुए स्वाभाविक हिंदी में व्यक्त करता है और यह निर्णीत नहीं करता कि गीत वास्तव में नया था या केवल वैसा सुनाई दिया।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: उपस्थिति और स्थान—दोनों भावों को संक्षिप्त, सहज हिंदी में रखता है।
- source_word: τῶν τεσσάρων ζῴων
  choice: उन चार जीवित प्राणियों
  rationale: प्रकाशन में सिंहासन के पास के विशिष्ट स्वर्गीय प्राणियों के लिए ζῷον का संदर्भानुकूल और गरिमापूर्ण रूप।
- source_word: τῶν πρεσβυτέρων
  choice: प्राचीनों
  rationale: प्रकाशन के स्वर्गीय दरबार में एक पहचाने हुए समूह के पदनाम को दर्शाता है; केवल आयु बताने वाले 'बुज़ुर्गों' से अधिक उपयुक्त।
- source_word: οὐδεὶς ἐδύνατο μαθεῖν
  choice: कोई नहीं सीख सका
  rationale: क्षमता के अपूर्णकालीन भाव और μαθεῖν के मूल अर्थ 'सीखना' को स्वाभाविक हिंदी में रखता है।
- source_word: αἱ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: उन एक लाख चवालीस हज़ार
  rationale: संख्या को आधुनिक हिंदी की प्रचलित भारतीय संख्या-पद्धति में स्पष्ट रूप से व्यक्त करता है और निश्चित समूह का संकेत 'उन' से रखता है।
- source_word: οἱ ἠγορασμένοι ἀπὸ τῆς γῆς
  choice: जिन्हें पृथ्वी पर से मोल लिया गया था
  rationale: ἀγοράζω के क्रय-संबंधी मूल रूपक को बनाए रखता है; ἀπό का स्रोत/अलग किए जाने का भाव 'पर से' द्वारा व्यक्त होता है।
theological_decisions:
- issue: दर्शन-वर्णन में ὡς का बल
  choice: ऐसा ... मानो कोई नया गीत हो
  alternative: एक नया गीत / नए गीत के समान
  rationale: यह अनुवाद दृश्य में अनुभव या प्रतीति का भाव रखता है, पर गीत के वास्तविक स्वरूप के विषय में अनावश्यक धर्मवैज्ञानिक निष्कर्ष नहीं देता।
- issue: ἠγορασμένοι का अनुवाद
  choice: मोल लिया गया
  alternative: छुड़ाया गया / मोल देकर छुड़ाया गया
  rationale: मुख्य पाठ में बाज़ार/क्रय का प्रत्यक्ष रूपक सुरक्षित रखा गया है; 'छुड़ाया गया' संदर्भानुकूल धर्मवैज्ञानिक अर्थ हो सकता है, पर वह मूल क्रिया के शाब्दिक केंद्र से अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दर्शनात्मक ὡς की अस्पष्टता और ἀγοράζω के क्रय-रूपक को जानबूझकर सुरक्षित रखा गया है।
