id: REV.14.7
reference: Revelation 14:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγων ἐν φωνῇ μεγάλῃ· Φοβήθητε τὸν ⸀θεὸν καὶ δότε αὐτῷ δόξαν, ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ, καὶ προσκυνήσατε ⸂τῷ ποιήσαντι⸃ τὸν οὐρανὸν καὶ τὴν γῆν ⸀καὶ θάλασσαν καὶ πηγὰς ὑδάτων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/007.yaml
  text: saying with a loud voice[a], “Fear God and give him glory, because the hour of his judgment has come[b], and worship the one who made heaven and earth and sea and springs of waters.”
translation:
  language: hi
  text: वह ऊँची आवाज़ में कह रहा था, “परमेश्वर का भय मानो[a] और उसकी महिमा करो, क्योंकि उसके न्याय की घड़ी आ पहुँची है। उसकी आराधना करो, जिसने आकाश, पृथ्वी, समुद्र और जल के सोते[b] बनाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के प्रति श्रद्धापूर्ण भय रखो।” यूनानी क्रिया श्रद्धा से भरे भय और न्याय के सामने होने वाले भय—दोनों का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “जलों के सोते” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: वह ऊँची आवाज़ में कह रहा था
  rationale: वर्तमान कृदंत का पिछले प्रसंग से संबंध बनाए रखते हुए हिन्दी में स्वाभाविक वर्णन दिया गया है; ἐν φωνῇ μεγάλῃ का बल भी सुरक्षित है।
- source_word: Φοβήθητε τὸν θεὸν
  choice: परमेश्वर का भय मानो
  rationale: यह प्रचलित हिन्दी बाइबलीय अभिव्यक्ति श्रद्धापूर्ण भय और आने वाले न्याय के सामने भय—दोनों अर्थों का तनाव बनाए रखती है।
- source_word: δότε αὐτῷ δόξαν
  choice: उसकी महिमा करो
  rationale: हिन्दी में स्वाभाविक और गरिमापूर्ण रूप से परमेश्वर को महिमा देने का भाव व्यक्त करता है।
- source_word: ὅτι ἦλθεν ἡ ὥρα τῆς κρίσεως αὐτοῦ
  choice: क्योंकि उसके न्याय की घड़ी आ पहुँची है
  rationale: ὅτι का कारणसूचक अर्थ, ὥρα की ‘घड़ी’ और पूर्ण हो चुके आगमन की तात्कालिकता सुरक्षित रखी गई है।
- source_word: προσκυνήσατε τῷ ποιήσαντι
  choice: उसकी आराधना करो, जिसने ... बनाए
  rationale: प्रकाशितवाक्य के धार्मिक संदर्भ में προσκυνέω के लिए ‘आराधना’ उपयुक्त है; कृदंत को स्वाभाविक सम्बन्धवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: τὸν οὐρανὸν καὶ τὴν γῆν καὶ θάλασσαν
  choice: आकाश, पृथ्वी, समुद्र
  rationale: सृष्टि-वर्णन की परिचित और गरिमापूर्ण शब्दावली को बनाए रखता है।
- source_word: πηγὰς ὑδάτων
  choice: जल के सोते
  rationale: πηγάς के बहुवचन और जल-स्रोत के ठोस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Φοβήθητε में भय और श्रद्धा का संबंध
  choice: परमेश्वर का भय मानो
  alternative: परमेश्वर का आदर करो
  rationale: न्याय, महिमा और आराधना के संदर्भ में यूनानी क्रिया श्रद्धापूर्ण भय तथा न्यायाधीश के सामने भय दोनों को समेट सकती है; ‘आदर’ इस तनाव को अनावश्यक रूप से नरम कर देता।
- issue: τῆς κρίσεως αὐτοῦ में सम्बन्ध
  choice: उसके न्याय की घड़ी
  alternative: उसके द्वारा न्याय किए जाने की घड़ी
  rationale: संक्षिप्त रूप यूनानी संबंधकारक की वास्तविक व्यापकता बनाए रखता है—यह परमेश्वर का न्याय है, बिना उसके व्याकरणिक संबंध को अत्यधिक स्पष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। ‘भय मानो,’ ‘महिमा करो’ और ‘आराधना करो’ जैसे परिचित धार्मिक पदों को रखा गया है, पर वाक्य-विन्यास सहज बनाया गया है।
