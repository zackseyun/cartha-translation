id: REV.14.9
reference: Revelation 14:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἄλλος ἄγγελος τρίτος ἠκολούθησεν αὐτοῖς λέγων ἐν φωνῇ μεγάλῃ· Εἴ τις προσκυνεῖ τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ λαμβάνει χάραγμα ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/009.yaml
  text: And another angel[a], a third, followed them, saying with a loud voice, “If anyone worships the beast and its image[b], and receives a mark on his forehead or on his hand,”
translation:
  language: hi
  text: और एक और स्वर्गदूत—तीसरा—उनके पीछे आया और ऊँचे स्वर में कहा, “यदि कोई उस पशु और उसकी मूर्ति की आराधना करता है[a] और अपने माथे या हाथ पर एक छाप ग्रहण करता है[b],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस पशु और उसकी मूर्ति के आगे दंडवत होता है।” यूनानी क्रिया शारीरिक रूप से झुकने का अर्थ दे सकती है, पर यहाँ उसमें उपासना और निष्ठा का भाव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “उसके माथे पर या उसके हाथ पर।” एकवचन सर्वनाम “यदि कोई” में बताए गए किसी भी व्यक्ति के लिए सामान्य रूप से प्रयुक्त हुआ है।
    reason: cultural_note
lexical_decisions:
- source_word: ἄλλος ἄγγελος τρίτος
  choice: एक और स्वर्गदूत, जो तीसरा था
  rationale: यह अनुवाद ἄλλος (‘एक और’) और τρίτος (‘तीसरा’) दोनों को बनाए रखता है तथा दर्शन में स्वर्गदूतों के क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἠκολούθησεν αὐτοῖς
  choice: उनके पीछे आया
  rationale: यहाँ क्रिया कथात्मक क्रम बताती है; ‘उनके पीछे आया’ हिन्दी में स्वाभाविक है और पहले के स्वर्गदूतों के बाद उसके आने का भाव सुरक्षित रखता है।
- source_word: λέγων ἐν φωνῇ μεγάλῃ
  choice: ऊँचे स्वर में कहने लगा
  rationale: यह सार्वजनिक और जोरदार घोषणा का भाव देता है और मुख्य क्रिया के साथ यूनानी कृदंत को सहज हिन्दी कथन में व्यक्त करता है।
- source_word: Εἴ τις
  choice: यदि कोई
  rationale: यह अनिश्चित शर्त को सामान्य और सर्वसमावेशी चेतावनी के रूप में व्यक्त करता है।
- source_word: προσκυνεῖ
  choice: आराधना करता है
  rationale: इस संदर्भ में क्रिया केवल दंडवत होने की शारीरिक मुद्रा नहीं, बल्कि पशु के प्रति धार्मिक भक्ति और निष्ठा दर्शाती है।
- source_word: τὸ θηρίον
  choice: उस पशु
  rationale: ‘पशु’ प्रकाशितवाक्य में θηρίον के लिए स्थापित और प्रसंगानुकूल अपोकैलिप्टिक पद है; ‘उस’ से पूर्वोक्त विशिष्ट पशु का संकेत मिलता है।
- source_word: τὴν εἰκόνα αὐτοῦ
  choice: उसकी मूर्ति
  rationale: εἰκών यहाँ पशु की उपासना के लिए बनाई गई प्रतिमा/मूर्ति को दर्शाता है; ‘मूर्ति’ धार्मिक संदर्भ में ‘छवि’ से अधिक स्वाभाविक और स्पष्ट है।
- source_word: λαμβάνει χάραγμα
  choice: एक छाप लेता है
  rationale: λαμβάνει ग्रहण करने का भाव रखता है और χάραγμα पहचानसूचक अंकित निशान है; ‘एक छाप लेता है’ मूल की अनिश्चितता और सक्रिय स्वीकृति दोनों को बनाए रखता है।
- source_word: ἐπὶ τοῦ μετώπου αὐτοῦ ἢ ἐπὶ τὴν χεῖρα αὐτοῦ
  choice: अपने माथे या अपने हाथ पर
  rationale: ‘अपने’ हिन्दी में कर्ता ‘कोई’ की ओर स्वाभाविक रूप से लौटता है, एकवचन संदर्भ बनाए रखता है और दोनों स्थानों—माथा तथा हाथ—को स्पष्ट करता है।
theological_decisions:
- issue: पशु के संबंध में προσκυνέω का धार्मिक अर्थ
  choice: आराधना करता है
  alternative: उसके आगे दंडवत होता है
  rationale: प्रकाशितवाक्य के इस प्रसंग में यह कार्य मूर्ति के सामने झुकने से बढ़कर उपासनात्मक निष्ठा व्यक्त करता है; ‘आराधना’ इस गंभीर धार्मिक अर्थ को सुरक्षित रखती है।
- issue: τις के साथ एकवचन αὐτοῦ
  choice: अपने माथे या अपने हाथ पर
  alternative: उसके माथे या उसके हाथ पर
  rationale: ‘अपने’ हिन्दी में अनिश्चित एकवचन व्यक्ति की ओर स्पष्ट रूप से संकेत करता है, किसी विशेष लिंग को अनावश्यक रूप से आरोपित नहीं करता और यूनानी के एकवचन को बहुवचन में नहीं बदलता।
- issue: εἰκών का संदर्भगत अर्थ
  choice: मूर्ति
  alternative: प्रतिमा; स्वरूप
  rationale: यहाँ εἰκών उस पशु की उपासना से जुड़ी दृश्य प्रतिमा है। ‘मूर्ति’ मूर्तिपूजक संदर्भ को स्पष्ट करती है, पर पाठ से आगे बढ़कर उसके पदार्थ या रूप का निर्धारण नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को अल्पविराम पर खुला छोड़ा गया है, क्योंकि यूनानी में शर्त का परिणाम अगले पद में आता है। ‘आराधना’ धार्मिक निष्ठा को और ‘छाप’ χάραγμα के अंकित पहचान-चिह्न को व्यक्त करती है।
