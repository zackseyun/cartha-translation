id: REV.14.10
reference: Revelation 14:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ αὐτὸς πίεται ἐκ τοῦ οἴνου τοῦ θυμοῦ τοῦ θεοῦ τοῦ κεκερασμένου ἀκράτου ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ, καὶ βασανισθήσεται ἐν πυρὶ καὶ θείῳ ἐνώπιον ⸂ἀγγέλων ἁγίων⸃ καὶ ἐνώπιον τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/010.yaml
  text: he also will drink from the wine of God's wrath[a], mixed undiluted in the cup of his anger[b], and he will be tormented with fire and sulfur before the holy angels and before the Lamb.
translation:
  language: hi
  text: वह भी परमेश्वर के प्रकोप की मदिरा में से पिएगा, जो उसके क्रोध के प्याले में बिना पानी मिलाए तैयार की गई है,[a] और उसे पवित्र स्वर्गदूतों के सामने और मेम्ने के सामने आग और गंधक में यातना दी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “मिलाई गई, फिर भी बिना पानी मिलाए।” यूनानी अभिव्यक्ति तैयार या मिलाई गई मदिरा और बिना पानी मिलाए रखी गई मदिरा—दोनों विचारों को जोड़ती है और न्याय की पूरी तीव्रता पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸς
  choice: वह भी
  rationale: καί के योगात्मक बल और αὐτός द्वारा पिछले पद में बताए गए व्यक्ति पर दिए गए बल—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: πίεται ἐκ τοῦ οἴνου
  choice: मदिरा में से पिएगा
  rationale: भविष्यकाल को स्पष्ट रखता है और ἐκ के स्रोत-संबंधी अर्थ को ‘में से’ द्वारा सुरक्षित रखता है।
- source_word: τοῦ θυμοῦ τοῦ θεοῦ
  choice: परमेश्वर के प्रकोप की
  rationale: न्याय के प्रसंग में θυμός तीव्र रोष को दर्शाता है। ‘प्रकोप’ स्वाभाविक है और आगे आने वाले ὀργή के लिए ‘क्रोध’ से आवश्यक भेद बनाए रखता है।
- source_word: τοῦ κεκερασμένου ἀκράτου
  choice: बिना पानी मिलाए तैयार की गई है
  rationale: κεράννυμι के तैयार/मिश्रित किए जाने और ἄκρατος के बिना पतला किए, पूरी तीव्रता वाले होने—दोनों भावों को प्राचीन मदिरा-प्रथा के संदर्भ में बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ποτηρίῳ τῆς ὀργῆς αὐτοῦ
  choice: उसके क्रोध के प्याले में
  rationale: ἐν का सामान्य स्थानवाचक अर्थ ‘में’ सुरक्षित रहता है; ‘क्रोध’ ὀργή को व्यक्त करते हुए θυμός के लिए चुने गए ‘प्रकोप’ से भेद रखता है।
- source_word: βασανισθήσεται
  choice: यातना पाएगा
  rationale: भविष्य कर्मवाच्य और दंडात्मक पीड़ा, दोनों को संक्षिप्त तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν πυρὶ καὶ θείῳ
  choice: आग और गंधक से
  rationale: θείον का आधुनिक, सटीक अर्थ ‘गंधक’ है; ‘से’ यहाँ यातना के माध्यम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐνώπιον ἀγγέλων ἁγίων καὶ ἐνώπιον τοῦ ἀρνίου
  choice: पवित्र स्वर्गदूतों और मेम्ने के सामने
  rationale: दोहराए गए ἐνώπιον का संबंध दोनों समूहों से स्पष्ट है; हिन्दी में एक बार ‘सामने’ कहना सहज है और अर्थ को नहीं बदलता।
theological_decisions:
- issue: एक ही पद में θυμός और ὀργή का भेद
  choice: θυμός के लिए ‘प्रकोप’ और ὀργή के लिए ‘क्रोध’
  alternative: दोनों के लिए ‘क्रोध’ या ‘प्रकोप’
  rationale: मूल पाठ निकट संदर्भ में दो संबंधित, किंतु अलग शब्दों का प्रयोग करता है। अलग हिन्दी शब्द उस अलंकारिक तनाव को सुरक्षित रखते हैं, बिना उनके अर्थों के बीच अत्यधिक कठोर भेद स्थापित किए।
- issue: τοῦ κεκερασμένου ἀκράτου का दिखने में विरोधाभासी संयोजन
  choice: मुख्य पाठ में ‘बिना पानी मिलाए तैयार की गई’ और पादटिप्पणी में अधिक शाब्दिक तनाव
  alternative: ‘बिना मिलावट के मिलाई गई’
  rationale: प्राचीन काल में मदिरा सामान्यतः पानी के साथ मिलाकर परोसी जाती थी। यहाँ न्याय की मदिरा तैयार है, पर पतली नहीं की गई; चुना हुआ पाठ पूर्ण तीव्रता का भाव स्पष्ट करता है और पादटिप्पणी मूल अभिव्यक्ति की असामान्यता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर और सर्वसुलभ रखी गई है। ‘मदिरा’, ‘प्रकोप’, ‘क्रोध’, ‘यातना’ और ‘गंधक’ प्रकाशित धार्मिक गद्य के लिए गरिमापूर्ण हैं, पर अनावश्यक रूप से पुरातन नहीं। ‘मेम्ना’ प्रकाशित हिन्दी बाइबिल परंपरा में प्रकाशितवाक्य के मसीही उपनाम के रूप में परिचित है।
