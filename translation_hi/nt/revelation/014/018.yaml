id: REV.14.18
reference: Revelation 14:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἄλλος ⸀ἄγγελος ἐκ τοῦ θυσιαστηρίου, ⸀ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός, καὶ ἐφώνησεν ⸀φωνῇ μεγάλῃ τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ λέγων· Πέμψον σου τὸ δρέπανον τὸ ὀξὺ καὶ τρύγησον τοὺς βότρυας τῆς ἀμπέλου τῆς γῆς, ὅτι ἤκμασαν αἱ σταφυλαὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/018.yaml
  text: And another angel came out from the altar[a], the one who has authority over the fire, and he called out with a loud voice to the one who had the sharp sickle, saying, “Send out your sharp sickle and gather the clusters of the vine of the earth[b], because its grapes are ripe.”
translation:
  language: hi
  text: एक और स्वर्गदूत वेदी से निकला, जिसे आग पर अधिकार था। उसने उस स्वर्गदूत को, जिसके पास धारदार हँसिया था, ऊँची आवाज़ में पुकारकर कहा, “अपना धारदार हँसिया चला[a] और पृथ्वी की दाखलता के गुच्छों को काट ले, क्योंकि उसके अंगूर पक चुके हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपना धारदार हँसिया भेज।” कटनी के प्रसंग में इसका अर्थ हँसिया चलाना या लगाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλος ἄγγελος
  choice: एक और स्वर्गदूत
  rationale: प्रकाशितवाक्य के दर्शनात्मक संदर्भ में ἄγγελος स्वर्गीय प्राणी को सूचित करता है; ‘एक और’ क्रमिक वर्णन को बनाए रखता है।
- source_word: ἐκ τοῦ θυσιαστηρίου
  choice: वेदी के पास से निकला
  rationale: ἐκ सामान्यतः स्रोत या भीतर से निकलने का भाव देता है, पर वेदी जैसी ठोस वस्तु के साथ हिन्दी में ‘वेदी के पास से’ स्वाभाविक है और दर्शन के स्थान-संबंध को व्यक्त करता है।
- source_word: ὁ ἔχων ἐξουσίαν ἐπὶ τοῦ πυρός
  choice: उसे आग पर अधिकार था
  rationale: यह वर्णन उसी स्वर्गदूत की पहचान बताता है; ‘अधिकार’ ἐξουσία का धार्मिक रूप से तटस्थ और सटीक प्रतिरूप है।
- source_word: ἐφώνησεν φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में पुकारकर कहा
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और φωνῇ μεγάλῃ की स्पष्टता बनाए रखता है।
- source_word: τῷ ἔχοντι τὸ δρέπανον τὸ ὀξὺ
  choice: तेज़ हँसिया लिए हुए स्वर्गदूत को
  rationale: संदर्भ में संबोधित व्यक्ति 14:17 का स्वर्गदूत है; हिन्दी में केवल ‘तेज़ हँसिया लिए हुए को’ अस्पष्ट लगता, इसलिए संदर्भगत संज्ञा दोहराई गई है।
- source_word: Πέμψον σου τὸ δρέπανον τὸ ὀξὺ
  choice: अपना तेज़ हँसिया चला
  rationale: πέμπω का मूल अर्थ ‘भेजना’ है, किंतु कटनी के उपकरण के साथ हिन्दी का स्वाभाविक क्रियापद ‘चलाना’ है; मूल शाब्दिक चित्र को पादटिप्पणी में दिया गया है।
- source_word: τρύγησον τοὺς βότρυας
  choice: गुच्छे काटकर इकट्ठे कर
  rationale: τρυγάω अंगूरों की कटनी अथवा उन्हें बटोरने को दर्शाता है। हँसिए की छवि और गुच्छों को एकत्र करने की क्रिया दोनों स्पष्ट रखने के लिए संयुक्त अभिव्यक्ति चुनी गई है।
- source_word: τῆς ἀμπέλου τῆς γῆς
  choice: पृथ्वी की दाखलता
  rationale: दोनों संबंधकारकों की सर्वनामी संरचना और रहस्योद्घाटनात्मक रूपक को बिना व्याख्यात्मक पहचान जोड़े सुरक्षित रखा गया है।
- source_word: ἤκμασαν αἱ σταφυλαὶ αὐτῆς
  choice: उसके अंगूर पक चुके हैं
  rationale: ἤκμασαν परिपक्व अवस्था तक पहुँचने को बताता है; ‘पक चुके हैं’ हिन्दी में पूर्णता और कटनी की तत्परता स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘पृथ्वी की दाखलता’ के रहस्योद्घाटनात्मक रूपक की पहचान
  choice: रूपक को मुख्य पाठ में ज्यों का त्यों रखा गया है।
  alternative: इसे पृथ्वी के दुष्ट लोगों अथवा न्याय के पात्र मानवसमुदाय के रूप में स्पष्ट करना।
  rationale: आस-पास का प्रसंग न्याय की ओर संकेत करता है, पर इस पद में दाखलता के अभिप्राय की स्पष्ट पहचान नहीं दी गई। अनुवाद को वह पहचान जोड़कर धर्मवैचारिक तनाव समाप्त नहीं करना चाहिए।
- issue: आग पर अधिकार का स्वरूप
  choice: केवल ‘आग पर अधिकार’ कहा गया है।
  alternative: इसे वेदी की आग, न्याय की आग या नरक की आग के रूप में निर्दिष्ट करना।
  rationale: यूनानी पाठ केवल τὸ πῦρ कहता है; आग की विशिष्ट धर्मवैचारिक पहचान जोड़ना पाठ से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दाखलता’ बाइबलीय हिन्दी में परिचित है और ‘अंगूर की बेल’ की तुलना में संक्षिप्त रूप से मूल रूपक को बनाए रखती है। वाक्य-विन्यास को हिन्दी की स्वाभाविक लय के लिए छोटे वाक्यों में बाँटा गया है।
