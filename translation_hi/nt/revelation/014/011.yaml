id: REV.14.11
reference: Revelation 14:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁ καπνὸς τοῦ βασανισμοῦ αὐτῶν εἰς αἰῶνας αἰώνων ἀναβαίνει, καὶ οὐκ ἔχουσιν ἀνάπαυσιν ἡμέρας καὶ νυκτός, οἱ προσκυνοῦντες τὸ θηρίον καὶ τὴν εἰκόνα αὐτοῦ, καὶ εἴ τις λαμβάνει τὸ χάραγμα τοῦ ὀνόματος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/011.yaml
  text: And the smoke of their torment goes up forever and ever[a], and they have no rest day and night, those who worship the beast and its image[b], and whoever receives the mark of its name.
translation:
  language: hi
  text: और उनकी यातना का धुआँ युगानुयुग[a] ऊपर उठता रहता है, और जो उस पशु और उसकी प्रतिमा की आराधना करते हैं, उन्हें दिन-रात विश्राम नहीं मिलता; और यदि कोई उसके नाम की छाप ग्रहण करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “युगों के युगों तक।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य अचानक “और यदि कोई उसके नाम की छाप ग्रहण करता है” पर समाप्त होता है। संभवतः यह न्याय के अधीन लोगों के वर्णन को आगे बढ़ाता है; कुछ अनुवाद इसे सहज बनाकर “और जो कोई … ग्रहण करता है” कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: καπνὸς
  choice: धुआँ
  rationale: यह ठोस प्रकाशितवाक्यीय बिंब का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: βασανισμοῦ
  choice: यातना
  rationale: न्याय के प्रसंग में पीड़ादायक दंड का अर्थ व्यक्त करता है, पर उसकी विधि को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: εἰς αἰῶνας αἰώνων
  choice: युगानुयुग
  rationale: प्रकाशितवाक्य में प्रबल और निरंतर अवधि व्यक्त करने वाले यूनानी मुहावरे का संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी रूप; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἀναβαίνει
  choice: ऊपर उठता रहता है
  rationale: वर्तमान काल के चलते रहने वाले जीवंत दृश्य को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀνάπαυσιν
  choice: चैन
  rationale: इस संदर्भ में विश्राम अथवा राहत न मिलने का स्वाभाविक हिन्दी कथन है।
- source_word: ἡμέρας καὶ νυκτός
  choice: दिन-रात
  rationale: निरंतरता व्यक्त करने वाला संक्षिप्त और मुहावरेदार हिन्दी रूप है।
- source_word: προσκυνοῦντες
  choice: आराधना करते हैं
  rationale: प्रकाशितवाक्य में धार्मिक निष्ठा सहित उपासना का आशय व्यक्त करता है।
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य के प्रतीकात्मक प्राणी के लिए सीधा और परंपरागत हिन्दी समतुल्य है।
- source_word: εἰκόνα
  choice: प्रतिमा
  rationale: पूजा के संदर्भ में εἰκών के दृश्य प्रतिनिधित्व का स्वाभाविक हिन्दी रूप है, बिना उसे केवल मूर्ति या समानता तक सीमित किए।
- source_word: εἴ τις λαμβάνει
  choice: यदि कोई ... ग्रहण करता है
  rationale: बहुवचन कृदंत से एकवचन अनिश्चित शर्त की ओर यूनानी वाक्य के आकस्मिक बदलाव को चिकना किए बिना सुरक्षित रखता है।
- source_word: χάραγμα
  choice: छाप
  rationale: पहचानसूचक अंकन के अर्थ को व्यक्त करता है और प्रकाशितवाक्य के प्रसंग में स्वाभाविक है।
- source_word: τοῦ ὀνόματος αὐτοῦ
  choice: उसके नाम की
  rationale: संबंधकारक यूनानी संरचना को निकटता से सुरक्षित रखता है और पशु को सूचित करने वाला सर्वनाम स्पष्ट रहता है।
theological_decisions:
- issue: εἰς αἰῶνας αἰώνων द्वारा व्यक्त न्याय की अवधि
  choice: युगानुयुग
  alternative: युगों के युगों तक
  rationale: यह प्रकाशितवाक्य के अत्यंत प्रबल कालवाची मुहावरे की निरंतर अवधि को व्यक्त करता है; अधिक रूपात्मक विकल्प पादटिप्पणी में रखकर शब्दरचना भी पारदर्शी की गई है, बिना किसी संप्रदायगत व्यवस्था को पाठ पर आरोपित किए।
- issue: अंतिम खंड का संबंध और वाक्य-विन्यास
  choice: और यदि कोई उसके नाम की छाप ग्रहण करता है
  alternative: और जो कोई उसके नाम की छाप ग्रहण करता है
  rationale: मूल यूनानी में बहुवचन कृदंत से εἴ τις वाले एकवचन अनिश्चित शर्तीय खंड की ओर अचानक बदलाव है। मुख्य पाठ इस तनाव और अधूरेपन को बचाता है; पादटिप्पणी बताती है कि इसे सामान्यतः उसी न्यायाधीन समूह के वर्णन का विस्तार समझा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय शैली अपनाई गई है। “ऊपर उठता रहता है” निरंतर वर्तमान क्रिया को, “दिन-रात” अबाध अवधि को, और अंतिम “यदि कोई” मूल के आकस्मिक वाक्य-विन्यास को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
