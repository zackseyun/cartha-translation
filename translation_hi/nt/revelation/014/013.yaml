source:
  edition: SBLGNT
  text: Καὶ ἤκουσα φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης· Γράψον· Μακάριοι οἱ νεκροὶ οἱ ἐν κυρίῳ ἀποθνῄσκοντες ἀπ’ ἄρτι. ⸂ναί, λέγει⸃ τὸ πνεῦμα, ἵνα ⸀ἀναπαήσονται ἐκ τῶν κόπων αὐτῶν, τὰ ⸀γὰρ ἔργα αὐτῶν ἀκολουθεῖ μετ’ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/013.yaml
  text: 'And I heard a voice from heaven saying[a], “Write: Blessed are the dead who die in the Lord from now on.” “Yes,” says the Spirit, “so that they may rest from their labors[b], for their deeds follow with them.”'
translation:
  language: hi
  text: 'और मैंने स्वर्ग से एक आवाज़ सुनी, जो कह रही थी, “लिख: धन्य हैं वे मरे हुए जो अब से प्रभु में मरते हैं।” “हाँ,” आत्मा कहती है, “ताकि वे अपने परिश्रमों से विश्राम पाएँ, क्योंकि उनके काम उनके साथ-साथ चलते हैं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φωνῆς ἐκ τοῦ οὐρανοῦ λεγούσης
  choice: स्वर्ग से एक आवाज़ को यह कहते
  rationale: φωνή के लिए सहज हिन्दी ‘आवाज़’ और ἐκ τοῦ οὐρανοῦ के लिए ‘स्वर्ग से’ रखा गया है; कृदन्त λεγούσης को ‘यह कहते’ से व्यक्त किया गया है।
- source_word: Γράψον
  choice: लिख
  rationale: एकवचन आज्ञार्थक रूप की प्रत्यक्षता बनाए रखी गई है; यूनानी में अनुपस्थित कर्म नहीं जोड़ा गया।
- source_word: Μακάριοι
  choice: धन्य
  rationale: धन्य-वचन की गंभीर और पारंपरिक बाइबलीय शैली को आधुनिक हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: οἱ νεκροὶ
  choice: वे मृतक
  rationale: विशेषण के संज्ञात्मक प्रयोग को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐν κυρίῳ ἀποθνῄσκοντες
  choice: जो प्रभु में मरते हैं
  rationale: वर्तमान कृदन्त की चरित्रसूचक शक्ति को सामान्य वर्तमान काल से व्यक्त किया गया है; ‘प्रभु में’ को व्याख्यात्मक विस्तार के बिना रखा गया है।
- source_word: ἀπ’ ἄρτι
  choice: अब से
  rationale: समय के आरंभ-बिंदु को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ναί, λέγει τὸ πνεῦμα
  choice: आत्मा कहता है, ‘हाँ’
  rationale: ναί की पुष्टि और τὸ πνεῦμα के स्पष्ट कर्ता दोनों सुरक्षित हैं; हिन्दी वाक्यक्रम स्वाभाविक रखा गया है।
- source_word: ἵνα ἀναπαήσονται
  choice: ताकि वे ... विश्राम पाएँ
  rationale: ἵνα की प्रयोजन/परिणाम संबंधी शक्ति को ‘ताकि’ से तथा विश्राम की भावी परिणति को स्वाभाविक हिन्दी विधिलिंग से व्यक्त किया गया है।
- source_word: ἐκ τῶν κόπων αὐτῶν
  choice: अपने परिश्रमों से
  rationale: κόπος में निहित श्रम, थकावट और कठिन प्रयास का भाव ‘परिश्रमों’ से पर्याप्त रूप से व्यक्त होता है।
- source_word: τὰ γὰρ ἔργα αὐτῶν
  choice: क्योंकि उनके काम
  rationale: ἔργα का व्यापक अर्थ ‘काम’ से सुरक्षित रहता है; इसे केवल नैतिक ‘कर्मों’ या पुण्य के तकनीकी अर्थ तक सीमित नहीं किया गया।
- source_word: ἀκολουθεῖ μετ’ αὐτῶν
  choice: उनके साथ-साथ चलते हैं
  rationale: μετά को स्पष्ट रूप से ‘साथ-साथ’ में बनाए रखा गया है और ἀκολουθέω का अनुगमन-संबंधी चित्र भी सुरक्षित है।
theological_decisions:
- issue: ‘प्रभु में’ और मृतकों का संबंध
  choice: ‘जो प्रभु में मरते हैं’
  alternative: ‘जो प्रभु के विश्वासयोग्य बने रहकर मरते हैं’ या ‘जो प्रभु के अपने होकर मरते हैं’
  rationale: ἐν κυρίῳ को अपेक्षाकृत शाब्दिक रखा गया है, ताकि प्रभु से एकता, संबंध और उसके अपने होने जैसे संभावित अर्थों में से किसी एक को अनावश्यक रूप से निश्चित न किया जाए।
- issue: ἵνα ἀναπαήσονται का बल
  choice: ‘ताकि वे ... विश्राम पाएँ’
  alternative: ‘जिससे वे ... विश्राम पाएँगे’ या ‘अर्थात वे ... विश्राम पाएँगे’
  rationale: रचना में प्रयोजन और परिणाम दोनों की छाया हो सकती है। ‘ताकि’ इस तनाव को पर्याप्त रूप से बनाए रखता है और यूनानी भविष्यकाल को हिन्दी के स्वाभाविक प्रयोग में कठोरता से नहीं थोपता।
- issue: मृतकों के कामों का उनके साथ संबंध
  choice: ‘उनके काम उनके साथ-साथ चलते हैं’
  alternative: ‘उनके काम उनके पीछे आते हैं’
  rationale: पाठ कामों के साथ होने की बात कहता है, पर यह स्पष्ट नहीं करता कि वे उद्धार का पुण्याधार हैं या केवल साक्षी। अनुवाद कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘धन्य’, ‘प्रभु’ और ‘आत्मा’ जैसे स्थापित बाइबलीय पद संरक्षित हैं। स्रोत-पाठ में ऐसा कोई आवश्यक पाठांतर नहीं पाया गया जिसके लिए प्रकाशन-पाठ में पादटिप्पणी अनिवार्य हो।
