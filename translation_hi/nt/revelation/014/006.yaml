source:
  edition: SBLGNT
  text: Καὶ εἶδον ⸀ἄλλον ἄγγελον πετόμενον ἐν μεσουρανήματι, ἔχοντα εὐαγγέλιον αἰώνιον εὐαγγελίσαι ⸀ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς καὶ ἐπὶ πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/006.yaml
  text: And I saw another angel flying in midheaven[a], having an eternal gospel to proclaim to those who dwell on the earth, and to every nation and tribe and language and people[b],
translation:
  language: hi
  text: फिर मैंने एक और स्वर्गदूत को आकाश के बीचोंबीच[a] उड़ते देखा, जिसके पास पृथ्वी पर रहनेवालों[b] और हर राष्ट्र, कुल, भाषा और लोगों को सुनाने के लिए एक अनन्त सुसमाचार था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश के मध्य में” अथवा “मध्य आकाश में”; यूनानी में यह एक विशिष्ट प्रलयदर्शी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पृथ्वी पर बैठे हुओं को”; यहाँ यह पृथ्वी के निवासियों के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλον ἄγγελον
  choice: एक और स्वर्गदूत
  rationale: ἄλλον कथा-क्रम में उसी प्रकार के एक अन्य स्वर्गदूत का संकेत करता है; प्रकाशितवाक्य के संदर्भ में ἄγγελος के लिए ‘स्वर्गदूत’ स्वाभाविक है।
- source_word: πετόμενον
  choice: उड़ते
  rationale: वर्तमान कृदन्त स्वर्गदूत को उड़ान की अवस्था में दिखाता है।
- source_word: ἐν μεσουρανήματι
  choice: आकाश के बीचोंबीच
  rationale: यह विशिष्ट प्रलयदर्शी पद आकाश के मध्य अथवा ऊँचे खुले आकाश का चित्र देता है; सहज हिन्दी में चित्रात्मकता बनाए रखी गई है।
- source_word: ἔχοντα
  choice: उसके पास ... था
  rationale: ἔχοντα स्वर्गदूत के पास संदेश होने को बताता है; हिन्दी में यह ‘रखे हुए’ की अपेक्षा अधिक स्वाभाविक और कम व्याख्यात्मक है।
- source_word: εὐαγγέλιον αἰώνιον
  choice: एक अनन्त सुसमाचार
  rationale: विशेषणरहित यूनानी पद की अनिश्चितता ‘एक’ से सुरक्षित रहती है; ‘सुसमाचार’ इसके पारिभाषिक और धर्मवैचारिक अनुनाद को बनाए रखता है।
- source_word: εὐαγγελίσαι
  choice: सुनाने के लिए
  rationale: अपरिमित क्रिया उद्देश्य व्यक्त करती है। ‘सुनाने’ से सुसमाचार शब्द की अनावश्यक पुनरावृत्ति टलती है और सार्वजनिक घोषणा का भाव आता है।
- source_word: ἐπὶ τοὺς καθημένους ἐπὶ τῆς γῆς
  choice: पृथ्वी पर रहनेवालों को
  rationale: καθημένους का शाब्दिक अर्थ ‘बैठे हुओं’ है, पर यहाँ यह पृथ्वी के निवासियों के लिए प्रयुक्त अभिव्यक्ति है; मुख्य पाठ में अर्थ स्पष्ट रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: πᾶν ἔθνος καὶ φυλὴν καὶ γλῶσσαν καὶ λαόν
  choice: हर राष्ट्र, कुल, भाषा और जाति
  rationale: चार अंगों वाली सार्वभौमिक सूची का संचयी लयात्मक प्रभाव रखा गया है; φυλή के लिए ‘कुल’ और λαός के लिए ‘जाति’ उनके भेद को यथासंभव व्यक्त करते हैं।
theological_decisions:
- issue: εὐαγγέλιον αἰώνιον को पारंपरिक धार्मिक पद से अनुवाद करना या सामान्य ‘शुभ समाचार’ कहना
  choice: एक अनन्त सुसमाचार
  alternative: अनन्त शुभ समाचार
  rationale: ‘सुसमाचार’ यूनानी पद के धर्मग्रंथीय अनुनाद को बनाए रखता है, जबकि ‘एक’ मूल के अनिर्दिष्ट रूप को अनावश्यक रूप से निश्चित नहीं बनाता।
- issue: τοὺς καθημένους ἐπὶ τῆς γῆς में मुद्रा का शाब्दिक चित्र या संदर्भगत निवास-अर्थ
  choice: पृथ्वी पर रहनेवालों को
  alternative: पृथ्वी पर बैठे हुओं को
  rationale: प्रकाशितवाक्य में यह पृथ्वी के निवासियों के लिए एक पुनरावर्ती अभिव्यक्ति है। शाब्दिक मुद्रा मुख्य अर्थ को भ्रमित कर सकती है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य का आरम्भ ‘फिर’ से किया गया है ताकि Καί की कथात्मक भूमिका स्वाभाविक हिन्दी में आए। सार्वभौमिक सूची को अपोज़िशन के रूप में डैश के भीतर रखा गया है; पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
