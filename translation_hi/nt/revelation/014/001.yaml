id: REV.14.1
reference: Revelation 14:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον, καὶ ἰδοὺ τὸ ἀρνίον ⸀ἑστὸς ἐπὶ τὸ ὄρος Σιών, καὶ μετ’ ⸀αὐτοῦ ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες ἔχουσαι τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ γεγραμμένον ἐπὶ τῶν μετώπων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/001.yaml
  text: Then I looked[a], and behold, the Lamb was standing on Mount Zion, and with him were one hundred forty-four thousand who had his name and his Father's name written on their foreheads.
translation:
  language: hi
  text: फिर मैंने देखा, और देखो, मेमना सिय्योन पर्वत पर खड़ा था। उसके साथ एक लाख चवालीस हज़ार लोग थे, जिनके माथों पर उसका नाम[a] और उसके पिता का नाम लिखा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों में केवल यह है: “उनके माथों पर उसके पिता का नाम लिखा हुआ था।”'
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ εἶδον
  choice: फिर मैंने देखा
  rationale: दर्शन के क्रम को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; καί की कथात्मक भूमिका और εἶδον का प्रत्यक्ष अर्थ दोनों सुरक्षित रहते हैं।
- source_word: ἰδοὺ
  choice: और देखो
  rationale: प्रकाशितवाक्य की ध्यान आकर्षित करने वाली, ऊँची किंतु सुबोध शैली को बनाए रखता है।
- source_word: τὸ ἀρνίον
  choice: मेमना
  rationale: प्रकाशितवाक्य में मसीह के लिए प्रयुक्त स्थापित प्रतीकात्मक उपाधि को बिना किसी अतिरिक्त व्याख्यात्मक विशेषण के प्रस्तुत करता है।
- source_word: ἑστὸς
  choice: खड़ा था
  rationale: पूर्णकालिक कृदंत से व्यक्त स्थायी अवस्था या परिणामी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τὸ ὄρος Σιών
  choice: सिय्योन पर्वत पर
  rationale: स्थान-संबंध को सीधे व्यक्त करता है और Σιών के प्रचलित हिन्दी बाइबलीय नाम-रूप को रखता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ ... थे
  rationale: अगले संख्यावाचक पद के साथ निहित विधेय को हिन्दी में स्पष्ट और सहज बनाता है।
- source_word: ἑκατὸν τεσσεράκοντα τέσσαρες χιλιάδες
  choice: एक लाख चवालीस हज़ार लोग
  rationale: ठीक संख्या को हिन्दी की सामान्य संख्या-पद्धति में देता है; ‘लोग’ जोड़ने से व्यक्तियों का संकेत स्वाभाविक रूप से स्पष्ट होता है।
- source_word: ἔχουσαι ... γεγραμμένον
  choice: जिनके ... लिखा हुआ था
  rationale: कृदंत संरचना को सहज संबंधवाचक उपवाक्य में बदलते हुए नामों के पहले से लिखे होने की परिणामी अवस्था बनाए रखता है।
- source_word: τὸ ὄνομα αὐτοῦ καὶ τὸ ὄνομα τοῦ πατρὸς αὐτοῦ
  choice: उसका नाम और उसके पिता का नाम
  rationale: मेमने और उसके पिता के दोनों नामों को समन्वित किंतु अलग पदों के रूप में सुरक्षित रखता है।
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: उनके माथों पर
  rationale: स्थान-संबंधी प्रतीकात्मक चित्र को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τὸ ἀρνίον की पहचान
  choice: केवल ‘मेमना’ उपाधि रखी गई है।
  alternative: ‘बलिदान का मेमना’ या स्पष्ट रूप से ‘मसीह’
  rationale: संदर्भ में यह मसीह की उपाधि है, पर पद में न दिए गए धर्मवैज्ञानिक वर्णन को जोड़ना उचित नहीं होगा।
- issue: मेमने और पिता के नामों का संबंध
  choice: ‘उसका नाम और उसके पिता का नाम’ के रूप में दोनों को अलग किंतु साथ रखा गया है।
  alternative: ‘उसका नाम, अर्थात उसके पिता का नाम’
  rationale: यूनानी पाठ दो समन्वित पद देता है, स्पष्ट समानाधिकरण नहीं; इसलिए अनुवाद उस तनाव को हल नहीं करता।
- issue: माथे पर लिखे नाम संबंधी पाठांतर
  choice: मुख्य पाठ में SBLGNT के अनुसार मेमने का नाम और उसके पिता का नाम दोनों रखे गए हैं।
  alternative: केवल उसके पिता का नाम
  rationale: कुछ पांडुलिपियाँ मेमने के अपने नाम का उल्लेख छोड़ देती हैं; अर्थपूर्ण पाठांतर को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली रखी गई है। ‘देखो’ से मूल का ध्यानाकर्षक स्वर, ‘खड़ा था’ से स्थायी अवस्था, और ‘सिय्योन पर्वत’ से प्रचलित बाइबलीय स्थान-नाम सुरक्षित रहता है।
