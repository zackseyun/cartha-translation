source:
  edition: SBLGNT
  text: καὶ ἔβαλεν ὁ καθήμενος ἐπὶ ⸂τῆς νεφέλης⸃ τὸ δρέπανον αὐτοῦ ἐπὶ τὴν γῆν, καὶ ἐθερίσθη ἡ γῆ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/014/016.yaml
  text: And the one seated on the cloud cast his sickle upon the earth[c][b][a], and the earth was harvested.
translation:
  language: hi
  text: और बादल पर बैठे हुए व्यक्ति[c] ने अपना हँसिया पृथ्वी पर चलाया[a], और पृथ्वी की कटनी की गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने अपना हँसिया पृथ्वी पर डाल दिया।” यूनानी क्रिया का शाब्दिक अर्थ “फेंका/डाला” है, पर कटनी के इस प्रसंग में आशय हँसिया चलाकर काटने से है।
    reason: lexical_alternative
  - marker: b
    text: या, “पृथ्वी की कटाई की गई।”
    reason: lexical_alternative
  - marker: c
    text: पिछले प्रसंग के आधार पर बादल पर बैठे हुए व्यक्ति की पहचान प्रायः मनुष्य के पुत्र के रूप में की जाती है, पर यह पद स्वयं केवल “बादल पर बैठे हुए व्यक्ति” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔβαλεν
  choice: चलाया
  rationale: βάλλω का मूल अर्थ ‘फेंकना/डालना’ है, पर हँसिए और कटनी के प्रसंग में ‘हँसिया चलाया’ स्वाभाविक हिन्दी में काटने की क्रिया आरम्भ करने का अर्थ देता है और कृषि-बिंब बनाए रखता है।
- source_word: ὁ καθήμενος ἐπὶ τῆς νεφέλης
  choice: जो बादल पर बैठा था
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत का वर्णनात्मक अनुवाद है; यह व्यक्ति की पहचान को पद से बाहर जाकर निश्चित नहीं करता।
- source_word: νεφέλης
  choice: बादल
  rationale: यूनानी निश्चित पद और पिछले पद के संदर्भ के कारण यह पहले बताए गए बादल की ओर संकेत करता है; हिन्दी में ‘बादल पर’ पर्याप्त और स्वाभाविक है।
- source_word: δρέπανον
  choice: हँसिया
  rationale: कटनी के इस औज़ार के लिए प्रचलित, स्पष्ट हिन्दी शब्द है और कृषि तथा न्याय का बिंब सुरक्षित रखता है।
- source_word: ἐπὶ τὴν γῆν
  choice: पृथ्वी पर
  rationale: ἐπί के साथ कर्मकारक यहाँ पृथ्वी की ओर निर्देशित क्रिया बताता है। ‘पृथ्वी पर’ मूल की स्थान-दिशा संबंधी खुली अर्थ-सीमा बनाए रखता है।
- source_word: ἐθερίσθη
  choice: कटनी हो गई
  rationale: θερίζω के अओरिस्ट कर्मवाच्य को स्वाभाविक हिन्दी में व्यक्त करता है। यह ‘काटी गई’ के वैकल्पिक, अधिक शाब्दिक रूप को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: प्रकाशितवाक्य के वैश्विक और प्रलय-दर्शी प्रसंग में ‘देश/भूमि’ की अपेक्षा ‘पृथ्वी’ अधिक उपयुक्त है; पद में γῆ की पुनरावृत्ति भी रखी गई है।
theological_decisions:
- issue: बादल पर बैठे काटनेवाले की पहचान
  choice: मुख्य पाठ में केवल वर्णनात्मक रूप—‘जो बादल पर बैठा था’—रखा गया।
  alternative: पिछले संदर्भ के आधार पर उसे मनुष्य का पुत्र/मसीह स्पष्ट रूप से कहना; अथवा उसे स्वर्गदूत प्रतिनिधि मानना।
  rationale: इस पद का यूनानी पाठ स्वयं उस व्यक्ति की पहचान केवल बादल पर बैठे हुए व्यक्ति के रूप में करता है। इसलिए अनुवाद व्याख्यात्मक पहचान को मुख्य पाठ में नहीं जोड़ता और धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हँसिया चलाया’ हिन्दी के कृषि-प्रयोग में स्वाभाविक है, जबकि पाद-टिप्पणी यूनानी क्रिया का अधिक शाब्दिक विकल्प देती है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
