id: REV.9.1
reference: Revelation 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἄγγελος ἐσάλπισεν· καὶ εἶδον ἀστέρα ἐκ τοῦ οὐρανοῦ πεπτωκότα εἰς τὴν γῆν, καὶ ἐδόθη αὐτῷ ἡ κλεὶς τοῦ φρέατος τῆς ἀβύσσου·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/001.yaml
  text: And the fifth angel sounded the trumpet[a], and I saw a star that had fallen from heaven to the earth[c][b], and the key to the shaft of the abyss was given to him.
translation:
  language: hi
  text: और पाँचवें स्वर्गदूत ने तुरही फूँकी, और मैंने एक तारा देखा,[b] जो स्वर्ग से पृथ्वी पर गिर चुका था;[a] और उसे अथाह गहराई के कूप की चाबी दी गई।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक संक्षेप में, “स्वर्ग से पृथ्वी पर गिरा हुआ एक तारा।” यूनानी पूर्णकालिक कृदंत संभवतः बताता है कि यूहन्ना के उसे देखने से पहले उसका गिरना हो चुका था।
    reason: lexical_alternative
  - marker: b
    text: ‘तारा’ किसी व्यक्तिगत प्राणी का प्रतीक हो सकता है, क्योंकि आगे कहा गया है कि चाबी ‘उसे’ दी गई।
    reason: alternative_reading
  - marker: c
    text: 'पारंपरिक अनुवाद: “अथाह कुण्ड की चाबी” या “तलहीन कुण्ड की चाबी।” यहाँ ‘कूप’ अथाह गहराई तक जाने वाले मुख या मार्ग को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: क्रिया σαλπίζω तुरही बजाने या फूँकने को व्यक्त करती है; आधुनिक हिन्दी में ‘तुरही फूँकी’ स्वाभाविक है और निहित वाद्य को स्पष्ट रखती है।
- source_word: ἀστέρα
  choice: एक तारा
  rationale: ἀστήρ का सीधा अर्थ ‘तारा’ है। संभावित प्रतीकात्मक व्यक्तिगत सत्ता की व्याख्या मुख्य पाठ में आरोपित नहीं की गई।
- source_word: πεπτωκότα
  choice: गिर चुका था
  rationale: पूर्णकालिक कृदंत पहले पूरी हो चुकी क्रिया और उसकी बनी हुई अवस्था दर्शाता है; यह अनुवाद स्पष्ट करता है कि यूहन्ना के देखने से पहले तारा गिर चुका था।
- source_word: ἐκ τοῦ οὐρανοῦ ... εἰς τὴν γῆν
  choice: आकाश से पृथ्वी पर
  rationale: दृश्य में ऊपर के लोक से पृथ्वी तक गिरने का स्थानिक विरोध सुरक्षित रहता है। हिन्दी में ‘आकाश से पृथ्वी पर’ स्वाभाविक और स्पष्ट है।
- source_word: ἐδόθη αὐτῷ
  choice: उसे ... दी गई
  rationale: यूनानी कर्मवाच्य में देने वाला अनकहा है। हिन्दी कर्मवाच्य उसी संयम और संभावित दैवी अनुमति के संकेत को बिना एजेंट जोड़े सुरक्षित रखता है।
- source_word: ἡ κλεὶς
  choice: चाबी
  rationale: κλείς का सामान्य और स्वाभाविक हिन्दी समतुल्य ‘चाबी’ है; निश्चितता संबंधसूचक वाक्यांश से स्पष्ट है।
- source_word: τοῦ φρέατος
  choice: कूप की
  rationale: φρέαρ कुएँ, गड्ढे या नीचे जाने वाले कूप को सूचित कर सकता है। ‘कूप’ अथाह गहराई तक पहुँचने वाले मुख/मार्ग को स्वयं गहराई से अलग रखता है।
- source_word: τῆς ἀβύσσου
  choice: अथाह गहराई के
  rationale: ἄβυσσος असीम अथवा अथाह गहराई को दर्शाता है। यह हिन्दी रूप अर्थ को समझने योग्य रखते हुए ‘तलहीन कुआँ’ जैसी अधिक व्याख्यात्मक पारंपरिक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: ‘तारे’ की पहचान किसी स्वर्गदूत या शैतान के रूप में करना
  choice: मुख्य पाठ में ‘तारा’ ही रखा गया और पहचान अनिर्धारित छोड़ी गई।
  alternative: ‘स्वर्गदूत’, ‘दुष्ट आत्मिक प्राणी’ या ‘शैतान’ लिखना।
  rationale: पद तारे की छवि प्रस्तुत करता है और फिर उसके लिए व्यक्तिगत सर्वनाम का प्रयोग करता है, पर उसकी स्पष्ट पहचान नहीं बताता। अनुवाद इस प्रतीकात्मक तनाव को सुरक्षित रखता है।
- issue: कुंजी देने वाले को परमेश्वर के रूप में स्पष्ट करना
  choice: कर्मवाच्य ‘उसे ... दी गई’ रखा गया।
  alternative: ‘परमेश्वर ने उसे ... दी।’
  rationale: यूनानी पाठ देने वाले को नहीं बताता। परमेश्वर की संप्रभु अनुमति संभव है, पर उसे स्पष्ट कर्ता बनाना अनुवाद से आगे की व्याख्या होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वर्गदूत’, ‘तुरही’, ‘पृथ्वी’ और ‘चाबी’ परिचित शब्द हैं; ‘अथाह गहराई का कूप’ यूनानी संबंध को अपेक्षाकृत स्पष्ट रूप में सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
