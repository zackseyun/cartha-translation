lexical_decisions:
- source_word: λέγοντα
  choice: उसने ... कहा
  rationale: यूनानी वर्तमान कृदंत पिछली आयत में सुनाई देने वाली आवाज़ की वाणी को आगे बढ़ाता है। स्वतंत्र हिंदी वाक्य को स्वाभाविक बनाने के लिए संदर्भगत कर्ता ‘उसने’ रखा गया है, जबकि बोलने वाले की पहचान में कुछ नहीं जोड़ा गया।
- source_word: τῷ ἕκτῳ ἀγγέλῳ
  choice: छठे स्वर्गदूत से
  rationale: सम्प्रदान कारक उस स्वर्गदूत को दर्शाता है जिससे बात कही गई; हिंदी में ‘से कहा’ स्वाभाविक प्रयोग है।
- source_word: ὁ ἔχων τὴν σάλπιγγα
  choice: तुरही लिए हुए
  rationale: यह पदबंध संबोधित छठे स्वर्गदूत की पहचान करता है। ‘लिए हुए’ उसके पास तुरही होने का अर्थ संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Λῦσον
  choice: खोल दो
  rationale: λύω का आदेशात्मक रूप बंधन हटाने का निर्देश देता है। स्वर्गदूतों के बाँधे होने के संदर्भ में ‘खोल दो’ आधुनिक हिंदी में स्पष्ट है।
- source_word: τοὺς τέσσαρας ἀγγέλους
  choice: उन चार स्वर्गदूतों को
  rationale: निश्चित प्रत्यक्ष कर्म और संख्या को सीधे व्यक्त किया गया है; ‘उन’ पहले से निर्दिष्ट समूह की ओर संकेत करता है।
- source_word: τοὺς δεδεμένους
  choice: जो ... बाँधकर रखे गए हैं
  rationale: पूर्णकालिक कर्मवाच्य कृदंत पूर्व में बाँधे जाने से उत्पन्न वर्तमान बंधी अवस्था पर बल देता है। यह हिंदी अभिव्यक्ति दोनों पक्षों को बनाए रखती है।
- source_word: ἐπὶ τῷ ποταμῷ
  choice: नदी ... के पास
  rationale: सम्प्रदान के साथ ἐπί यहाँ स्थान-संबंध दर्शाता है। ‘के पास’ नदी के निकट या उसके क्षेत्र में बँधे होने को स्वाभाविक हिंदी में व्यक्त करता है, बिना उन्हें नदी के ऊपर मानने के।
- source_word: τῷ μεγάλῳ Εὐφράτῃ
  choice: महान नदी फ़रात
  rationale: विशेषण, सामान्य संज्ञा और नाम की यूनानी संरचना को हिंदी के स्वाभाविक क्रम में रखा गया है।
theological_decisions:
- issue: चार स्वर्गदूतों की पहचान और नैतिक स्थिति
  choice: केवल ‘चार स्वर्गदूत’
  alternative: ‘चार पतित स्वर्गदूत’ या ‘न्याय के लिए ठहराए गए चार स्वर्गदूत’
  rationale: आयत उन्हें केवल फ़रात के पास बँधे हुए स्वर्गदूत कहती है। उनकी नैतिक स्थिति या नियुक्त उद्देश्य जोड़ना पाठ से आगे जाकर व्याख्या करना होगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फ़रात’ हिंदी में प्रचलित बाइबलीय नाम है। वाक्य को हिंदी में स्वतंत्र और सुबोध बनाने के लिए संदर्भगत ‘उसने’ जोड़ा गया है; इससे वक्ता की कोई अतिरिक्त पहचान निर्धारित नहीं होती।
