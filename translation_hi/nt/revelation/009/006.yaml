id: REV.9.6
reference: Revelation 9:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐν ταῖς ἡμέραις ἐκείναις ζητήσουσιν οἱ ἄνθρωποι τὸν θάνατον καὶ οὐ μὴ εὑρήσουσιν αὐτόν, καὶ ἐπιθυμήσουσιν ἀποθανεῖν καὶ ⸀φεύγει ⸂ὁ θάνατος ἀπ’ αὐτῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/006.yaml
  text: And in those days people will seek death and will certainly not find it[a], and they will long to die, but death flees from them.
translation:
  language: hi
  text: और उन दिनों में लोग मृत्यु को खोजेंगे और उसे किसी भी तरह नहीं पाएँगे। वे मरने की लालसा करेंगे, लेकिन मृत्यु उनसे दूर भागेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों में
  rationale: यह यूनानी कालवाचक पद का सीधा और स्वाभाविक हिन्दी रूप है तथा संकेतसूचक भाव को बनाए रखता है।
- source_word: οἱ ἄνθρωποι
  choice: मनुष्य
  rationale: यहाँ बहुवचन पद सामान्य रूप से मानवजाति के लोगों को सूचित करता है, केवल पुरुषों को नहीं। हिन्दी में ‘मनुष्य’ इस व्यापक अर्थ को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ζητήσουσιν τὸν θάνατον
  choice: मृत्यु को खोजेंगे
  rationale: यह जान-बूझकर और व्याकुल होकर मृत्यु पाने के प्रयास को व्यक्त करता है तथा मूल के कर्म-संबंध को स्पष्ट रखता है।
- source_word: οὐ μὴ εὑρήσουσιν αὐτόν
  choice: उसे किसी भी तरह नहीं पाएँगे
  rationale: οὐ μή के प्रबल निषेध को सहज आधुनिक हिन्दी में व्यक्त किया गया है; ‘उसे’ का संकेत मृत्यु की ओर है।
- source_word: ἐπιθυμήσουσιν ἀποθανεῖν
  choice: मरने की लालसा करेंगे
  rationale: ἐπιθυμέω की तीव्र इच्छा को ‘लालसा’ व्यक्त करती है और वाक्य का गंभीर स्वर बनाए रखती है।
- source_word: φεύγει ὁ θάνατος ἀπ’ αὐτῶν
  choice: मृत्यु उनसे दूर भागेगी
  rationale: मूल में मृत्यु कर्ता के रूप में सजीव चित्रित है। ‘दूर भागेगी’ इस मानवीकरण और उनसे अलग होते जाने की दिशा दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: न्याय के प्रसंग में मृत्यु का मानवीकरण
  choice: मृत्यु उनसे दूर भागेगी
  alternative: वे मर नहीं पाएँगे
  rationale: यूनानी पाठ मृत्यु को φεύγει का कर्ता बनाता है। सीधे मानवीकरण को बनाए रखना प्रकाशितवाक्य की दर्शनात्मक छवि और उसके तनाव को सुरक्षित रखता है; केवल परिणाम बताने वाली व्याख्यात्मक पुनर्रचना से इसे सपाट नहीं किया गया।
- issue: οἱ ἄνθρωποι का व्यापक मानवीय संदर्भ
  choice: मनुष्य
  alternative: पुरुष
  rationale: इस संदर्भ में ἄνθρωποι सामान्यतः सभी मानवों के लिए प्रयुक्त है। ‘मनुष्य’ आधुनिक हिन्दी में उसी व्यापक संदर्भ को व्यक्त करता है और अनावश्यक रूप से अर्थ को केवल पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘किसी भी तरह नहीं’ प्रबल निषेध को सामान्य पाठक के लिए स्पष्ट करता है, जबकि ‘मृत्यु उनसे दूर भागेगी’ मूल की नाटकीय मानवीकृत छवि को बनाए रखता है।
