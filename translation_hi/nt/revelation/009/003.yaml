id: REV.9.3
reference: Revelation 9:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκ τοῦ καπνοῦ ἐξῆλθον ἀκρίδες εἰς τὴν γῆν, καὶ ἐδόθη αὐταῖς ἐξουσία ὡς ἔχουσιν ἐξουσίαν οἱ σκορπίοι τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/003.yaml
  text: And out of the smoke came locusts onto the earth[a], and authority was given to them, as the scorpions of the earth have authority.
translation:
  language: hi
  text: और उस धुएँ में से टिड्डियाँ निकलकर पृथ्वी पर आ गईं, और उन्हें अधिकार[a] दिया गया, जैसा अधिकार पृथ्वी के बिच्छुओं के पास होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शक्ति।” यूनानी शब्द अधिकार, हक या सामर्थ्य का बोध करा सकता है; यहाँ कर्मवाच्य “दिया गया” के साथ “अधिकार” प्रदत्त अनुमति को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκ τοῦ καπνοῦ
  choice: उस धुएँ में से
  rationale: ἐκ भीतर से बाहर आने की गति दिखाता है; ‘में से’ इस उभरने के दृश्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξῆλθον
  choice: निकलकर ... आ गईं
  rationale: क्रिया बाहर निकलने की गति व्यक्त करती है; ‘आ गईं’ के साथ यह टिड्डियों के धुएँ से निकलकर पृथ्वी पर पहुँचने को स्पष्ट और स्वाभाविक बनाती है।
- source_word: ἀκρίδες
  choice: टिड्डियाँ
  rationale: बाइबलीय और प्रलय-साहित्य के संदर्भ में ἀκρίς का सामान्य और सटीक अर्थ विनाशकारी झुंड वाली टिड्डी है।
- source_word: εἰς τὴν γῆν
  choice: पृथ्वी पर
  rationale: εἰς यहाँ गति और गंतव्य बताता है; प्रकाशितवाक्य के व्यापक संदर्भ में γῆ के लिए ‘पृथ्वी’ उपयुक्त है।
- source_word: ἐδόθη αὐταῖς ἐξουσία
  choice: उन्हें अधिकार दिया गया
  rationale: ‘अधिकार’ प्रदत्त अनुमति या अधिकृत क्षमता को व्यक्त करता है। कर्मवाच्य यूनानी संरचना को बनाए रखते हुए देने वाले की पहचान स्पष्ट नहीं की गई है।
- source_word: ὡς ἔχουσιν ἐξουσίαν
  choice: जैसा अधिकार ... के पास होता है
  rationale: ὡς की तुलना और ἐξουσία की पुनरावृत्ति दोनों सुरक्षित रखी गई हैं।
- source_word: οἱ σκορπίοι τῆς γῆς
  choice: पृथ्वी के बिच्छू
  rationale: सम्बन्धकारक पदबंध का सीधा अनुवाद मूल की पृथ्वी-संबंधी अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: टिड्डियों को दी गई क्षमता का स्वरूप
  choice: ἐξουσία का अनुवाद ‘अधिकार’ किया गया और ‘दिया गया’ कर्मवाच्य रखा गया।
  alternative: ‘शक्ति’ या ‘सामर्थ्य’ कहना, अथवा देने वाले को अनुवाद में स्पष्ट कर देना।
  rationale: मूल पाठ प्रदत्त या सीमित अनुमति का संकेत देता है, पर देने वाले का स्पष्ट नाम नहीं लेता। यह अनुवाद उसी धर्मवैज्ञानिक संयम और अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पृथ्वी’ प्रकाशितवाक्य की व्यापक साहित्यिक शैली के अनुकूल है, और ‘जैसा अधिकार ... के पास होता है’ मूल में ‘अधिकार’ की पुनरावृत्ति को स्पष्ट रूप से सुरक्षित रखता है।
