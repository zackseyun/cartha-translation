  terminology: ‘टिड्डियाँ,’ ‘पृथ्वी,’ ‘बिच्छू,’ and especially ‘अधिकार’ are accurate and suitable in this apocalyptic context. ‘अधिकार’ preserves the sense of granted authority/permission better than an unrestricted ‘शक्ति.’ The footnote responsibly records the lexical alternative and explains the passive construction without specifying the implicit giver.
