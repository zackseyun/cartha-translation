source:
  edition: SBLGNT
  text: ἀπὸ τῶν τριῶν πληγῶν τούτων ἀπεκτάνθησαν τὸ τρίτον τῶν ἀνθρώπων, ⸀ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/018.yaml
  text: By these three plagues a third of mankind was killed—by the fire and the smoke and the sulfur coming out of their mouths[a][b].
translation:
  language: hi
  text: इन तीन विपत्तियों से—उनके मुँहों से निकलते हुए आग, धुएँ और गन्धक से—मनुष्यों में से एक तिहाई मार डाला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ τῶν τριῶν πληγῶν τούτων
  choice: इन तीन विपत्तियों से
  rationale: यहाँ ἀπό कारण अथवा साधन बताता है। ‘से’ स्वाभाविक हिन्दी में दोनों अर्थों को समेटता है, और τούτων को ‘इन’ से स्पष्ट रखा गया है।
- source_word: ἀπεκτάνθησαν
  choice: मार डाला गया
  rationale: यूनानी क्रिया भूतकालिक कर्मवाच्य है। ‘मनुष्यों का एक तिहाई’ के साथ एकवचन कर्मवाच्य हिन्दी में स्वाभाविक है।
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: मनुष्यों का एक तिहाई
  rationale: τὸ τρίτον अंशवाचक रूप में एक-तिहाई जनसंख्या दर्शाता है; ἀνθρώπων सामान्यतः सभी मनुष्यों के लिए है, केवल पुरुषों के लिए नहीं।
- source_word: ἐκ τοῦ πυρὸς καὶ τοῦ καπνοῦ καὶ τοῦ θείου
  choice: आग, धुएँ और गन्धक से
  rationale: ἐκ यहाँ उन घातक तत्वों के स्रोत और साधन को दर्शाता है। आधुनिक मानक हिन्दी में θεῖον के लिए ‘गन्धक’ स्पष्ट और प्रचलित शब्द है।
- source_word: τοῦ ἐκπορευομένου ἐκ τῶν στομάτων αὐτῶν
  choice: उनके मुँहों से निकलनेवाली
  rationale: वर्तमान कृदन्त निरन्तर बाहर आने का सजीव दृश्य प्रस्तुत करता है। स्त्रीलिंग ‘निकलनेवाली’ तीनों निकटवर्ती संज्ञाओं को सामूहिक रूप से विशेषित करती है।
theological_decisions:
- issue: ἀνθρώπων का दायरा
  choice: मनुष्यों
  alternative: मानवजाति
  rationale: मूल शब्द सामान्य मानव समुदाय को सूचित करता है, न कि केवल पुरुषों को। ‘मनुष्यों’ से यह व्यापक अर्थ बना रहता है और अनावश्यक व्याख्यात्मक विस्तार नहीं होता।
- issue: तीन विपत्तियों और आग, धुएँ तथा गन्धक का सम्बन्ध
  choice: ‘अर्थात’ द्वारा समानाधिकरण स्पष्ट किया गया
  alternative: दो अलग ‘से’ वाक्यांश बिना संयोजक के रखना
  rationale: मूल में दूसरा ἐκ-वाक्यांश बताता है कि तीन विपत्तियाँ आग, धुआँ और गन्धक हैं। ‘अर्थात’ हिन्दी में इस सम्बन्ध को स्पष्ट करता है, बिना इनके प्रतीकात्मक अर्थ का निर्णय किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप रखा गया है। ‘विपत्तियाँ’ प्रकाशितवाक्य की न्याय-संबंधी भाषा के अनुकूल है; विराम-चिह्नों से मूल वाक्य की व्याख्यात्मक पुनरुक्ति स्पष्ट की गई है।
