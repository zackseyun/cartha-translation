language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὕτως εἶδον τοὺς ἵππους ἐν τῇ ὁράσει καὶ τοὺς καθημένους ἐπ’ αὐτῶν, ἔχοντας θώρακας πυρίνους καὶ ὑακινθίνους καὶ θειώδεις· καὶ αἱ κεφαλαὶ τῶν ἵππων ὡς κεφαλαὶ λεόντων, καὶ ἐκ τῶν στομάτων αὐτῶν ἐκπορεύεται πῦρ καὶ καπνὸς καὶ θεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/017.yaml
  text: And this is how I saw the horses in the vision, and those sitting on them[a]—they had breastplates fiery red and hyacinth-blue and sulfur-yellow; and the heads of the horses were like lions’ heads[b], and out of their mouths come fire and smoke and sulfur.
translation:
  language: hi
  text: 'और मैंने दर्शन में घोड़ों को और उन पर बैठे लोगों को इस प्रकार देखा: वे अग्निमय, नीलमणि-वर्ण और गन्धकमय कवच पहने हुए थे; घोड़ों के सिर सिंहों के सिरों के समान थे, और उनके मुँहों से आग, धुआँ और गन्धक निकलते हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: इस रूप में
  rationale: यह दर्शन में दिखाई पड़े दृश्य के ढंग या स्वरूप का परिचय देता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए संकेतवाचक बल बनाए रखता है।
- source_word: ἐν τῇ ὁράσει
  choice: दर्शन में
  rationale: प्रकाशितवाक्य के संदर्भ में यह साधारण दृश्य नहीं, दर्शनीय अनुभव को सूचित करता है।
- source_word: τοὺς καθημένους ἐπ’ αὐτῶν
  choice: उन पर बैठे हुओं
  rationale: मूल के कृदन्तीय वाक्यांश को बनाए रखता है और 'सवारों' की अपेक्षा संरचना के अधिक निकट है।
- source_word: θώρακας
  choice: कवच
  rationale: यह धड़ की रक्षात्मक युद्ध-सज्जा का सहज और प्रचलित हिन्दी पद है।
- source_word: πυρίνους
  choice: अग्नि जैसे
  rationale: शब्द में अग्निमय, अग्नि-सदृश या अग्नि के रंग का भाव हो सकता है; केवल 'लाल' कहकर अर्थ को रंग तक सीमित नहीं किया गया।
- source_word: ὑακινθίνους
  choice: नीलमणि के रंग के
  rationale: ὑάκινθος से संबद्ध गहरे नीले या नील-बैंगनी रंग का संकेत देता है; हिन्दी पाठक के लिए बोधगम्य रूप चुना गया।
- source_word: θειώδεις
  choice: गन्धक जैसे
  rationale: गन्धक से बने, गन्धक-सदृश या उसके रंग वाले होने की संभावित व्यापकता को केवल 'पीले' तक सीमित किए बिना व्यक्त करता है।
- source_word: ὡς κεφαλαὶ λεόντων
  choice: सिंहों के सिरों के समान
  rationale: ὡς की स्पष्ट उपमा और बहुवचन दोनों सुरक्षित रहते हैं।
- source_word: ἐκπορεύεται
  choice: निकलते हैं
  rationale: मूल के वर्तमान काल को बनाए रखा गया है; आग, धुआँ और गन्धक की संयुक्त सूची के साथ हिन्दी में बहुवचन स्वाभाविक है।
- source_word: θεῖον
  choice: गन्धक
  rationale: यह θεῖον का स्पष्ट आधुनिक हिन्दी पर्याय है।
theological_decisions:
- issue: कवचों के तीन विशेषणों को पदार्थ, गुण या रंग के रूप में समझना
  choice: अग्नि जैसे, नीलमणि के रंग के और गन्धक जैसे
  alternative: अग्नि-लाल, गहरा नीला और गन्धक-पीला
  rationale: दृश्य-संदर्भ में रंग का भाव प्रबल है, पर πυρίνους और θειώδεις को निश्चित रंगों तक सीमित करना मूल की वास्तविक अर्थ-व्याप्ति को घटा सकता है। इसलिए केवल मध्य विशेषण में स्पष्ट रंग-संबंध और अन्य दो में व्यापक उपमा रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और कुछ हद तक मूल-संरचना-संवेदी शैली। 'कवच' और 'गन्धक' सामान्य पाठक के लिए परिचित हैं। वर्तमान काल 'निकलते हैं' को यूनानी ἐκπορεύεται के नाटकीय वर्तमान के अनुरूप रखा गया है।
