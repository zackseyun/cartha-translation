id: REV.9.12
reference: Revelation 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἡ οὐαὶ ἡ μία ἀπῆλθεν· ἰδοὺ ἔρχεται ἔτι δύο οὐαὶ μετὰ ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/012.yaml
  text: The first woe has passed[a]. Behold[b], two woes are still coming after these things.
translation:
  language: hi
  text: पहला हाय[a] बीत चुका है। देखो,[b] इसके बाद अभी दो और हाय आने वाले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘एक हाय’; प्रसंग में अर्थ तीन हायों में से पहला है।
    reason: lexical_alternative
  - marker: b
    text: ‘देखो’ आगे आने वाली बात की ओर गंभीरता से ध्यान खींचने वाला उद्गार है।
    reason: discourse_marker
lexical_decisions:
- source_word: οὐαί
  choice: हाय
  rationale: यह प्रकाशितवाक्य में आने वाली विपत्ति और न्याय की गंभीर घोषणा है। ‘हाय’ उसके भविष्यसूचक उद्गार और बार-बार दोहराए गए सूत्र—दोनों को बनाए रखता है।
- source_word: ἡ μία
  choice: पहला
  rationale: यूनानी में शाब्दिक रूप से ‘एक’ है, पर प्रसंग में यह पहले घोषित तीन ‘हाय’ में से पहले को दर्शाता है; इसलिए सहज हिन्दी में ‘पहला’ स्पष्ट है।
- source_word: ἀπῆλθεν
  choice: बीत चुका है
  rationale: क्रिया यहाँ पहले हाय के समाप्त हो जाने को बताती है। ‘बीत चुका है’ स्थानिक अर्थ के बजाय समय और घटना की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἰδού
  choice: देखो
  rationale: यह आगे कही जाने वाली बात की ओर तत्काल और गंभीर ध्यान खींचता है तथा भविष्यसूचक शैली को बनाए रखता है।
- source_word: ἔρχεται
  choice: आने वाले हैं
  rationale: यूनानी में बहुवचन कर्ता के साथ क्रिया एकवचन रूप में है, पर अर्थ दो आने वाले हायों का है। हिन्दी में बहुवचन प्रयोग स्वाभाविक और आवश्यक है।
- source_word: ἔτι
  choice: अभी ... और
  rationale: यह बताता है कि पहले हाय के बाद दो अतिरिक्त हाय शेष हैं; ‘अभी दो और’ आधुनिक हिन्दी में इस भाव को स्पष्ट और सहज रूप से रखता है।
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह दर्शन में घटनाओं का क्रम दिखाता है। ‘इसके बाद’ यूनानी बहुवचन ‘इन बातों के बाद’ का स्वाभाविक हिन्दी समतुल्य है।
theological_decisions:
- issue: तीन हायों का भविष्यसूचक क्रम
  choice: पहले घोषित हाय के पूरा हो जाने और दो अन्य हायों के आगे आने को स्पष्ट क्रम के रूप में रखा गया है।
  alternative: ‘हाय’ को केवल ‘विपत्ति’ या ‘दण्ड’ कहकर दोहराए गए भविष्यसूचक सूत्र को सामान्य घटना-सूचक शब्द बना देना।
  rationale: मूल पाठ यूहन्ना के दर्शन में हायों की गिनी हुई शृंखला पर बल देता है। ‘हाय’ और ‘पहला’ उस साहित्यिक तथा धर्मवैचारिक तनाव को बनाए रखते हैं, बिना इन न्यायों के स्वरूप के बारे में अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाय’ भविष्यसूचक-प्रकाशनात्मक गंभीरता को सुरक्षित रखता है, जबकि ‘बीत चुका है’ और ‘अभी दो और ... आने वाले हैं’ सामान्य पाठक के लिए स्वाभाविक हैं।
