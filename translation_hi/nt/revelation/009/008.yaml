  text: καὶ εἶχον τρίχας ὡς τρίχας γυναικῶν, καὶ οἱ ὀδόντες αὐτῶν ὡς λεόντων ἦσαν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/008.yaml
  text: And they had hair like women’s hair[a], and their teeth were like lions’ teeth,
translation:
  language: hi
  text: और उनके बाल स्त्रियों के बालों जैसे थे, और उनके दाँत सिंहों के दाँतों जैसे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶχον τρίχας
  choice: उनके बाल ... थे
  rationale: यूनानी में शाब्दिक रूप से ‘वे बाल रखते थे’ है, पर वर्णनात्मक प्रसंग में आधुनिक हिन्दी का स्वाभाविक रूप ‘उनके बाल ... थे’ अर्थ को स्पष्ट और सहज रखता है।
- source_word: ὡς τρίχας γυναικῶν
  choice: स्त्रियों के बालों जैसे
  rationale: ὡς तुलना व्यक्त करता है। ‘स्त्रियों के बालों जैसे’ मूल के बहुवचन और उपमा को बिना अतिरिक्त व्याख्या के स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ ὀδόντες αὐτῶν
  choice: उनके दाँत
  rationale: यूनानी संज्ञा और संबंधवाचक सर्वनाम का हिन्दी में स्वाभाविक अधिकारसूचक रूप ‘उनके दाँत’ है।
- source_word: ὡς λεόντων
  choice: सिंहों के दाँतों जैसे
  rationale: तुलना का संबंध ‘दाँत’ से है; हिन्दी में निहित संज्ञा को दोहराने से अर्थ स्पष्ट रहता है और ‘दाँत सिंहों जैसे थे’ की संभावित असहजता दूर होती है।
- source_word: ἦσαν
  choice: थे
  rationale: वर्णनात्मक अपूर्ण भूतकाल के लिए सामान्य हिन्दी भूतकाल ‘थे’ उपयुक्त है।
theological_decisions:
- issue: प्रकाशितवाक्य के दर्शन में उपमात्मक चित्रण का स्वरूप
  choice: उपमाओं को सीधे बनाए रखा गया है और उनका प्रतीकात्मक अर्थ अनुवाद में नहीं समझाया गया।
  alternative: चित्रों की कथित प्रतीकात्मक व्याख्या को पद के भीतर जोड़ना।
  rationale: यूनानी पाठ केवल ‘स्त्रियों के बालों जैसे’ और ‘सिंहों के दाँतों जैसे’ कहता है; वह इनका अर्थ नहीं खोलता। इसलिए अनुवाद मूल की अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और दर्शन-वर्णन के अनुरूप। ‘महिलाओं’ की अपेक्षा ‘स्त्रियों’ और ‘शेरों’ की अपेक्षा ‘सिंहों’ को बाइबिलीय काव्यात्मक गरिमा तथा स्रोत की चित्रात्मकता के लिए चुना गया है।
