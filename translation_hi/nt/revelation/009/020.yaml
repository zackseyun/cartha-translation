id: REV.9.20
reference: Revelation 9:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ οἱ λοιποὶ τῶν ἀνθρώπων, οἳ οὐκ ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις, ⸀οὐδὲ μετενόησαν ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν, ἵνα μὴ ⸀προσκυνήσουσιν τὰ δαιμόνια καὶ τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα, ἃ οὔτε βλέπειν ⸀δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/020.yaml
  text: And the rest of humanity[a], who were not killed by these plagues, did not even repent of the works of their hands, so as not to worship demons and the idols of gold and silver and bronze and stone and wood[c][b], which can neither see nor hear nor walk.
translation:
  language: hi
  text: और शेष मनुष्य[a], जो इन विपत्तियों में मारे नहीं गए थे, उन्होंने अपने हाथों के कामों से मन तक नहीं फिराया[b], ताकि वे दुष्टात्माओं और सोने, चाँदी, काँसे, पत्थर और लकड़ी की मूर्तियों की आराधना न करें[c]—जो न देख सकती हैं, न सुन सकती हैं और न चल सकती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मानवजाति के बाकी लोग; यहाँ यूनानी शब्द सभी मनुष्यों के लिए सामान्य रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “अपने हाथों के कामों से मन नहीं फिराया”; यहाँ विशेष रूप से उन वस्तुओं का संकेत है जिन्हें उन्होंने बनाया और जिनकी पूजा की।
    reason: lexical_alternative
  - marker: c
    text: या, “जिससे वे दुष्टात्माओं और मूर्तियों की आराधना करना छोड़ दें।” यूनानी उपवाक्य उद्देश्य या अभिप्रेत परिणाम व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ λοιποὶ τῶν ἀνθρώπων
  choice: बाकी मनुष्य
  rationale: यह पद उन शेष मानवों को सामूहिक रूप से सूचित करता है जो विपत्तियों में नहीं मारे गए; ἀνθρώπων यहाँ स्त्री-पुरुष सभी के लिए सामान्य शब्द है।
- source_word: ἀπεκτάνθησαν ἐν ταῖς πληγαῖς ταύταις
  choice: इन विपत्तियों से नहीं मारे गए थे
  rationale: अओरिस्ट कर्मवाच्य का सीधा अर्थ रखा गया है; ἐν को यहाँ साधन/परिस्थिति के स्वाभाविक हिन्दी रूप ‘से’ में व्यक्त किया गया है।
- source_word: οὐδὲ μετενόησαν
  choice: उन्होंने ... भी मन नहीं फिराया
  rationale: ‘मन फिराना’ μετανοέω के लिए प्रचलित बाइबलीय हिन्दी है और οὐδέ की बलात्मक निरंतरता ‘भी ... नहीं’ से सुरक्षित रहती है।
- source_word: ἐκ τῶν ἔργων τῶν χειρῶν αὐτῶν
  choice: अपने हाथों के कामों से
  rationale: ἐκ की ‘से/से हटकर’ दिशा और हाथों के कामों की मूर्तिमय छवि दोनों को औपचारिक रूप से बनाए रखता है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं
  rationale: नए नियम के संदर्भ में यह विरोधी अलौकिक आत्मिक प्राणियों का बोध कराता है; आधुनिक हिन्दी में ‘दुष्टात्माएँ’ स्पष्ट और स्वाभाविक है।
- source_word: τὰ εἴδωλα τὰ χρυσᾶ καὶ τὰ ἀργυρᾶ καὶ τὰ χαλκᾶ καὶ τὰ λίθινα καὶ τὰ ξύλινα
  choice: सोने, चाँदी, काँसे, पत्थर और लकड़ी की मूर्तियों
  rationale: सामग्री की संचयी सूची और धार्मिक प्रतिमाओं का निंदात्मक आशय स्पष्ट रखा गया है।
- source_word: ἃ οὔτε βλέπειν δύνανται οὔτε ἀκούειν οὔτε περιπατεῖν
  choice: जो न देख सकती हैं, न सुन सकती हैं और न चल सकती हैं
  rationale: मूर्तियों की असमर्थता पर किए गए त्रिस्तरीय व्यंग्य तथा περιπατεῖν के शाब्दिक ‘चलना’ को सुरक्षित रखा गया है।
theological_decisions:
- issue: ἵνα μὴ προσκυνήσουσιν में उद्देश्य अथवा अभिप्रेत परिणाम
  choice: ताकि वे ... आराधना न करें
  alternative: जिससे वे ... की आराधना करना छोड़ दें
  rationale: ἵνα μή की उद्देश्य/अभिप्रेत-परिणाम संबंधी अस्पष्टता को ‘ताकि ... न करें’ बनाए रखता है और मन फिराने को मूर्तिपूजा से मुड़ने से जोड़ता है, बिना इसे किसी विशिष्ट धर्मवैज्ञानिक सिद्धांत में सीमित किए।
- issue: ἀνθρώπων का समावेशी मानवीय अर्थ
  choice: मनुष्य
  alternative: मानवजाति के बाकी लोग
  rationale: यहाँ यूनानी शब्द केवल पुरुषों के लिए नहीं, सामान्यतः मानवों के लिए है; हिन्दी ‘मनुष्य’ इसी सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- issue: ‘हाथों के कामों’ का संदर्भ
  choice: ठोस मुहावरे को मुख्य पाठ में बनाए रखा
  alternative: अपने बनाए और पूजे हुए कामों से
  rationale: वाक्य आगे मूर्तियों को स्पष्ट करता है; इसलिए मुख्य पाठ मूल बिंब रखता है और पादटिप्पणी उसके विशेष संदर्भ को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल रूप। ‘विपत्तियाँ’, ‘मन फिराना’ और ‘आराधना’ परिचित बाइबलीय शब्दावली हैं, जबकि वाक्यरचना साधारण पाठकों के लिए स्पष्ट रखी गई है। सभी पादटिप्पणी-चिह्न संबंधित मुख्य-पाठ स्थानों पर दिए गए हैं।
