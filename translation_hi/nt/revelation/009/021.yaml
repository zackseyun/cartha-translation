id: REV.9.21
reference: Revelation 9:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐ μετενόησαν ἐκ τῶν φόνων αὐτῶν οὔτε ἐκ τῶν ⸀φαρμάκων αὐτῶν οὔτε ἐκ τῆς πορνείας αὐτῶν οὔτε ἐκ τῶν κλεμμάτων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/021.yaml
  text: And they did not repent of their murders[a], or of their sorceries, or of their sexual immorality, or of their thefts.
translation:
  language: hi
  text: और उन्होंने न अपनी हत्याओं से, न अपने जादू-टोने[a] से, न अपनी यौन अनैतिकता से और न अपनी चोरियों से मन फिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जादुई क्रियाएँ,’ ‘टोना-टोटका’; यूनानी शब्द औषधि-मिश्रणों या विष देने से भी जुड़ा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετενόησαν
  choice: मन फिराया
  rationale: नैतिक संदर्भ में यह केवल विचार बदलने नहीं, बल्कि पाप से पश्चाताप करके मुड़ने को व्यक्त करता है; ‘से’ के साथ ‘मन फिराना’ स्वाभाविक हिन्दी है।
- source_word: φόνων
  choice: हत्याओं
  rationale: φόνος यहाँ नैतिक-अपराधिक अर्थ में जानबूझकर की गई हत्याओं को सूचित करता है; ‘हत्याएँ’ सामान्य ‘मार डालने’ से अधिक सटीक है।
- source_word: φαρμάκων
  choice: जादू-टोने
  rationale: प्रकाशितवाक्य के अपोकैलिप्टिक और नैतिक संदर्भ में इसका प्रमुख आशय तांत्रिक या जादुई क्रियाएँ है। औषधि-मिश्रण अथवा विष से जुड़े व्यापक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: πορνείας
  choice: यौन अनैतिकता
  rationale: πορνεία का अर्थ-क्षेत्र व्यापक है; यह केवल व्यभिचार के संकरे अर्थ तक सीमित नहीं। ‘यौन अनैतिकता’ आधुनिक और व्यापक हिन्दी अभिव्यक्ति है।
- source_word: κλεμμάτων
  choice: चोरियों
  rationale: किसी चोरी की वस्तु अथवा चोरी के कृत्य को सूचित करने वाला यह बहुवचन, इस दुर्गुण-सूची में स्वाभाविक रूप से ‘चोरियों’ से व्यक्त होता है।
- source_word: οὔτε ... οὔτε ... οὔτε
  choice: न ... न ... न ... और न
  rationale: दोहराया गया निषेध हिन्दी में प्रत्येक पाप को अलग-अलग बल देता है और यूनानी सूची की संरचना को सहज ढंग से बनाए रखता है।
- source_word: ἐκ
  choice: से
  rationale: μετανοέω के साथ यह उन पापों से मुड़ने या उन्हें छोड़ने का भाव देता है; ‘मन फिराना’ के साथ ‘से’ स्वाभाविक हिन्दी प्रयोग है।
theological_decisions:
- issue: अपोकैलिप्टिक दुर्गुण-सूची में φαρμάκων का अर्थ-क्षेत्र
  choice: जादू-टोने
  alternative: जादुई क्रियाएँ; टोना-टोटका; विष देना या औषधि-मिश्रणों का दुरुपयोग
  rationale: प्रकाशितवाक्य में सजातीय शब्द प्रायः जादुई या तांत्रिक अभ्यास और उसके छलपूर्ण प्रभाव को व्यक्त करते हैं। मुख्य पाठ में इसी संभावित अर्थ को रखा गया है, जबकि शब्द के औषधि या विष से जुड़े ऐतिहासिक अर्थ को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यौन अनैतिकता’ व्यापक नैतिक अर्थ को सुरक्षित रखती है, और दोहराया गया ‘न’ मूल सूची के प्रत्येक अंग पर बल देता है।
