id: REV.9.4
reference: Revelation 9:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐρρέθη αὐταῖς ἵνα μὴ ⸀ἀδικήσουσιν τὸν χόρτον τῆς γῆς οὐδὲ πᾶν χλωρὸν οὐδὲ πᾶν δένδρον, εἰ μὴ τοὺς ἀνθρώπους οἵτινες οὐκ ἔχουσι τὴν σφραγῖδα τοῦ θεοῦ ἐπὶ τῶν ⸀μετώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/004.yaml
  text: And they were told not to harm the grass of the earth[a], or any green thing, or any tree, but only the people who do not have the seal of God on their foreheads.
translation:
  language: hi
  text: और उन्हें कहा गया कि वे पृथ्वी की घास, किसी भी हरी वस्तु या किसी भी पेड़ को हानि न पहुँचाएँ, सिवाय उन लोगों के जिनके माथे पर परमेश्वर की मुहर नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρρέθη αὐταῖς
  choice: उन्हें कहा गया
  rationale: कर्मवाच्य और निहित वक्ता को सुरक्षित रखता है; इसे स्पष्ट रूप से ‘आज्ञा दी गई’ कहकर बल नहीं बढ़ाता। स्त्रीलिंग बहुवचन सर्वनाम का हिन्दी में स्वाभाविक संदर्भ ‘उन्हें’ से व्यक्त होता है।
- source_word: ἵνα μὴ ἀδικήσουσιν
  choice: कि वे … हानि न पहुँचाएँ
  rationale: इस न्याय-दर्शन के संदर्भ में ἀδικέω का आशय नुकसान पहुँचाना है; हिन्दी में यह स्वाभाविक और अर्थानुकूल है।
- source_word: τὸν χόρτον τῆς γῆς
  choice: पृथ्वी की घास
  rationale: χόρτος को ‘घास’ और सम्बन्धकारक को सहज हिन्दी में ‘पृथ्वी की’ के रूप में रखा गया है।
- source_word: οὐδὲ πᾶν χλωρόν
  choice: किसी भी हरी वस्तु
  rationale: विशेषण के संज्ञावाचक प्रयोग ‘हर हरी वस्तु’ की व्यापकता को बनाए रखता है और अर्थ को केवल ‘पौधे’ तक सीमित नहीं करता।
- source_word: οὐδὲ πᾶν δένδρον
  choice: या किसी भी पेड़
  rationale: δένδρον का सीधा, आधुनिक हिन्दी समतुल्य ‘पेड़’ है।
- source_word: εἰ μὴ
  choice: बल्कि केवल
  rationale: यहाँ पदबंध हानि पहुँचाने के एकमात्र अनुमत लक्ष्य का अपवाद प्रस्तुत करता है; ‘बल्कि केवल’ इस विरोध और सीमा को स्पष्ट करता है।
- source_word: τοὺς ἀνθρώπους
  choice: उन लोगों को
  rationale: ἄνθρωποι सामान्य मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं; ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἵτινες οὐκ ἔχουσι
  choice: जिनके … नहीं है
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी स्वामित्व-रचना में व्यक्त किया गया है।
- source_word: τὴν σφραγῖδα τοῦ θεοῦ
  choice: परमेश्वर की मुहर
  rationale: σφραγίς की प्रकाशन-साहित्य में स्वामित्व और सुरक्षा से जुड़ी प्रमुख छवि ‘मुहर’ से बनी रहती है।
- source_word: ἐπὶ τῶν μετώπων
  choice: माथों पर
  rationale: बहुवचन μετώπων को उसके बहुवचन मानवीय संदर्भ के अनुरूप ‘माथों पर’ कहा गया है।
theological_decisions:
- issue: ἀνθρώπους का दायरा
  choice: सामान्य मानव समुदाय—‘लोग’
  alternative: केवल पुरुष—‘पुरुष’
  rationale: संदर्भ वनस्पति और परमेश्वर की मुहर पाए अथवा न पाए मनुष्यों के बीच भेद करता है; लिंग-विशेष की कोई सीमा नहीं लगाता।
- issue: कर्मवाच्य निर्देश का बल और वक्ता
  choice: अधिकारपूर्ण निर्देश, पर वक्ता अनिर्दिष्ट
  alternative: स्पष्ट रूप से परमेश्वर की आज्ञा
  rationale: ἐρρέθη में वक्ता निहित है। संदर्भ में अंतिम अधिकार परमेश्वर का हो सकता है, पर अनुवाद यूनानी पाठ में न दिए गए कर्ता को स्पष्ट नहीं करता।
- issue: मुहर का अर्थ
  choice: ‘परमेश्वर की मुहर’ की प्रतीकात्मक भाषा को यथावत रखना
  alternative: व्याख्यात्मक रूप से ‘परमेश्वर के स्वामित्व/सुरक्षा का चिह्न’ कहना
  rationale: पाठ स्वयं ‘मुहर’ कहता है; उसके स्वामित्व और सुरक्षा संबंधी धार्मिक निहितार्थों को अनुवाद में किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘हरी वस्तु’ मूल के व्यापक संज्ञावाचक विशेषण को बचाती है। वाक्य में निषेध के तीन वनस्पति-संबंधी पदों और मानव अपवाद का क्रम मूल के अनुसार रखा गया है।
