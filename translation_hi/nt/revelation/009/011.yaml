id: REV.9.11
reference: Revelation 9:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἔχουσιν ἐπ’ αὐτῶν βασιλέα τὸν⸃ ἄγγελον τῆς ἀβύσσου· ὄνομα αὐτῷ Ἑβραϊστὶ Ἀβαδδών ⸂καὶ ἐν⸃ τῇ Ἑλληνικῇ ὄνομα ἔχει Ἀπολλύων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/011.yaml
  text: They have over them as king the angel of the abyss[a]. His name in Hebrew is Abaddon[c][b], and in Greek he has the name Apollyon.
translation:
  language: hi
  text: उनके ऊपर राजा के रूप में अथाह गड्ढे का स्वर्गदूत है। उसका नाम इब्रानी में अबद्दोन[a] और यूनानी में अपुल्लियोन[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अबद्दोन” इब्रानी नाम है, जिसका संबंध “विनाश” से है।
    reason: lexical_alternative
  - marker: b
    text: “अपुल्लियोन” यूनानी नाम है, जिसका अर्थ “नाश करने वाला” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχουσιν ἐπ’ αὐτῶν βασιλέα
  choice: उनके ऊपर राजा है
  rationale: यह वाक्य टिड्डियों जैसे प्राणियों के ऊपर अधिकार रखने वाले राजा को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; βασιλέα की ठोस राजकीय छवि के लिए ‘राजा’ रखा गया है।
- source_word: τὸν ἄγγελον τῆς ἀβύσσου
  choice: अथाह गड्ढे का दूत
  rationale: ἄγγελος के लिए प्रकाशितवाक्य के संदर्भ में ‘दूत’ स्वाभाविक है। ἄβυσσος की गहराई और बंदीस्थान-सदृश छवि को सामान्य पाठक के लिए ‘अथाह गड्ढा’ व्यक्त करता है।
- source_word: Ἑβραϊστὶ
  choice: इब्रानी में
  rationale: यह भाषा-सूचक क्रियाविशेषण का संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: Ἀβαδδών
  choice: अबद्दोन
  rationale: यहाँ यह व्यक्तिनाम के रूप में प्रयुक्त है, इसलिए अर्थानुवाद के बजाय लिप्यंतरण किया गया है; विनाश से इसका संबंध पादटिप्पणी में दिया गया है।
- source_word: καὶ ἐν τῇ Ἑλληνικῇ
  choice: और यूनानी में
  rationale: यह इब्रानी और यूनानी नामों के बीच मूल पाठ का स्पष्ट विरोध बनाए रखता है।
- source_word: Ἀπολλύων
  choice: अपुल्लियोन
  rationale: यह नाम के रूप में आया है, इसलिए लिप्यंतरित किया गया है; ‘नाश करने वाला’ अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: Ἀβαδδών और Ἀπολλύων का अनुवाद किया जाए या लिप्यंतरण
  choice: मुख्य पाठ में दोनों को व्यक्तिनाम मानकर ‘अबद्दोन’ और ‘अपुल्लियोन’ लिखा गया है।
  alternative: इनका अर्थ क्रमशः ‘विनाश’ और ‘नाश करने वाला’ मुख्य पाठ में दिया जा सकता है।
  rationale: दोनों रूप इस पद में दूत के नाम हैं। नामों को बनाए रखना मूल की भाषा-संबंधी संरचना को सुरक्षित रखता है, जबकि उनके अर्थ पादटिप्पणियों में स्पष्ट होते हैं।
- issue: ἀβύσσου का चित्रात्मक अर्थ
  choice: अथाह गड्ढा
  alternative: अथाह कुंड; अगाध स्थान
  rationale: यह चयन सामान्य आधुनिक हिन्दी में मूल की अत्यंत गहरी अधोलोक-सदृश जगह की छवि देता है, बिना उसे किसी विशिष्ट दार्शनिक या सांप्रदायिक अवधारणा से बराबर ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। मूल की राजकीय छवि और इब्रानी-यूनानी नामों का अंतर सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
