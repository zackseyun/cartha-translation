id: REV.9.2
reference: Revelation 9:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἤνοιξεν τὸ φρέαρ τῆς ἀβύσσου, καὶ ἀνέβη καπνὸς ἐκ τοῦ φρέατος ὡς καπνὸς καμίνου ⸀μεγάλης, καὶ ⸀ἐσκοτώθη ὁ ἥλιος καὶ ὁ ἀὴρ ἐκ τοῦ καπνοῦ τοῦ φρέατος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/002.yaml
  text: And he opened the shaft of the abyss[a], and smoke went up from the shaft like the smoke of a great furnace, and the sun and the air were darkened by the smoke from the shaft.
translation:
  language: hi
  text: और उसने अथाह गहराई के कुएँ[a] को खोला। उस कुएँ से धुआँ ऊपर उठा, मानो किसी बड़ी भट्ठी का धुआँ हो। उस कुएँ के धुएँ से सूर्य और वायु अन्धकारमय हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘अथाह गहराई के गड्ढे’; परम्परागत अनुवाद: ‘अथाह कुण्ड।’'
    reason: φρέαρ के लिए ‘कुआँ’ या ‘गड्ढा’ दोनों सम्भव हैं; परम्परागत पदावली भी पाठक की जानकारी के लिए दी गई है।
lexical_decisions:
- source_word: ἤνοιξεν
  choice: खोला
  rationale: ἀνοίγω का सीधा और स्वाभाविक हिन्दी समतुल्य; खोलने के तरीके के बारे में अनावश्यक विवरण नहीं जोड़ता।
- source_word: φρέαρ
  choice: कुआँ
  rationale: φρέαρ कुएँ, गड्ढे या नीचे जाने वाले मुख को दर्शा सकता है। यहाँ ‘कुआँ’ अथाह गहराई तक पहुँचने वाले ऊर्ध्वाधर खुले मार्ग की छवि बनाए रखता है और उसे स्वयं ἄβυσσος से अलग रखता है।
- source_word: ἀβύσσου
  choice: अथाह गहराई
  rationale: ἄβυσσος की अगाध, अथाह गहराई को स्वाभाविक हिन्दी में व्यक्त करता है और परम्परागत किन्तु अधिक व्याख्यात्मक ‘अथाह कुण्ड’ से बचता है।
- source_word: ἀνέβη
  choice: ऊपर उठा
  rationale: धुएँ की ऊपर की ओर गति को सहज हिन्दी में स्पष्ट करता है।
- source_word: καπνὸς
  choice: धुआँ
  rationale: सीधा मानक समतुल्य; पूरे पद में एकरूपता से प्रयुक्त।
- source_word: ὡς καπνὸς καμίνου μεγάλης
  choice: मानो किसी बड़ी भट्ठी का धुआँ हो
  rationale: ὡς की उपमा और κάμινος μεγάλης की विशाल भट्ठी की छवि को प्राकृतिक हिन्दी में बनाए रखता है।
- source_word: ἐσκοτώθη
  choice: अन्धकारमय हो गए
  rationale: निष्क्रिय/परिणामसूचक अर्थ को बनाए रखता है और संयुक्त कर्ता ‘सूर्य और वायु’ के साथ स्वाभाविक बहुवचन देता है।
- source_word: ὁ ἥλιος
  choice: सूर्य
  rationale: सीधा और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: ὁ ἀὴρ
  choice: वायु
  rationale: ἀήρ का सीधा वातावरण-संबंधी अर्थ; ‘आकाश’ कहने से दृश्य क्षेत्र बदल सकता था।
- source_word: ἐκ τοῦ καπνοῦ τοῦ φρέατος
  choice: उस कुएँ के धुएँ से
  rationale: ἐκ के स्रोत और कारण दोनों को संक्षेप तथा स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रकाशितवाक्य के स्थान-सूचक रूपक को परम्परागत व्याख्या आरोपित किए बिना प्रस्तुत करना
  choice: ‘अथाह गहराई के कुएँ’ द्वारा φρέαρ और ἄβυσσος को अलग रखा गया है।
  alternative: ‘अथाह कुण्ड’ या ‘अथाह गहराई का गड्ढा’
  rationale: मूल यूनानी में φρέαρ प्रवेश-मुख/कुआँ है और ἄβυσσος वह अथाह गहराई है जिससे वह जुड़ा है। दोनों को एक ही ‘कुण्ड’ में मिला देने से मूल छवि का भेद मिट सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘वायु’ मूल के वातावरण-संबंधी अर्थ को रखता है; ‘अन्धकारमय’ इस दर्शनात्मक प्रसंग के अनुरूप औपचारिक किन्तु परिचित शब्द है।
