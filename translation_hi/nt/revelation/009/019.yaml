id: REV.9.19
reference: Revelation 9:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ γὰρ ἐξουσία τῶν ἵππων ἐν τῷ στόματι αὐτῶν ἐστιν καὶ ἐν ταῖς οὐραῖς αὐτῶν· αἱ γὰρ οὐραὶ αὐτῶν ὅμοιαι ⸀ὄφεσιν, ἔχουσαι κεφαλάς, καὶ ἐν αὐταῖς ἀδικοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/019.yaml
  text: For the power of the horses is in their mouths and in their tails[a]; for their tails are like serpents, having heads[b], and with them they do harm.
translation:
  language: hi
  text: क्योंकि घोड़ों की सामर्थ्य उनके मुँह और उनकी पूँछों में है; क्योंकि उनकी पूँछें साँपों के समान हैं, जिनके सिर हैं, और उन्हीं से वे हानि पहुँचाती हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξουσία
  choice: सामर्थ्य
  rationale: यहाँ शब्द घोड़ों की हानि पहुँचाने की प्रभावी क्षमता बताता है, न कि मुख्यतः सौंपा गया अधिकार।
- source_word: στόματι
  choice: मुँह
  rationale: यूनानी में एकवचन का वितरणात्मक प्रयोग है; हिन्दी में ‘उनके मुँह’ बहुवचन घोड़ों के प्रत्येक मुँह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐραῖς / οὐραὶ
  choice: पूँछों / पूँछें
  rationale: बहुवचन को बनाए रखा गया है क्योंकि यह दर्शनीय चित्र का महत्त्वपूर्ण अंग है।
- source_word: ὅμοιαι ὄφεσιν
  choice: साँपों के समान
  rationale: यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है तथा सर्पाकार चित्र को बिना व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ἔχουσαι κεφαλάς
  choice: उनके सिर हैं
  rationale: यह स्पष्ट करता है कि पूँछों के सिर हैं और यूनानी कृदन्त के वर्णनात्मक क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀδικοῦσιν
  choice: हानि पहुँचाती हैं
  rationale: प्रकाशितवाक्य के इस प्रसंग में क्रिया शारीरिक क्षति या हानि करने का बोध देती है, न कि अमूर्त अन्याय का।
- source_word: ἐν αὐταῖς
  choice: उन्हीं से
  rationale: ἐν यहाँ साधन का बोध देता है; स्त्रीलिंग ‘उन्हीं’ का निकटतम संदर्भ पूँछें हैं, जबकि उनके सिर उस हानिकारक साधन का हिस्सा हैं।
- source_word: γὰρ
  choice: क्योंकि
  rationale: दोनों प्रयोग व्याख्यात्मक हैं; ‘क्योंकि’ हिन्दी में उनके तार्किक संबंध को स्पष्ट और स्वाभाविक रखता है।
theological_decisions:
- issue: घोड़ों की पूँछों और सिरों का प्रलयदर्शी चित्र
  choice: चित्र को सीधे वर्णित करना, बिना सांकेतिक अर्थ निर्धारित किए
  alternative: पूँछों को झूठी शिक्षा या दुष्टात्मिक कार्य का प्रतीक मानकर अनुवाद में स्पष्ट करना
  rationale: यूनानी पाठ केवल दर्शन का चित्र प्रस्तुत करता है; किसी विशिष्ट रूपकात्मक व्याख्या को अनुवाद में जोड़ना उचित नहीं।
- issue: ἐν αὐταῖς का व्याकरणिक संदर्भ
  choice: इसे पूँछों की ओर संकेत करते हुए ‘उन्हीं से’ कहना
  alternative: इसे सिरों की ओर संकेत करते हुए ‘उन सिरों से’ कहना
  rationale: स्त्रीलिंग बहुवचन αὐταῖς का व्याकरणिक पूर्वपद οὐραὶ ‘पूँछें’ है; फिर भी सिर उन्हीं पूँछों पर स्थित हानि पहुँचाने वाले अंग हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट रखी गई है। ‘सामर्थ्य’, ‘के समान’ और ‘हानि पहुँचाती हैं’ औपचारिकता तथा सहजता के बीच संतुलन रखते हैं। यूनानी पाठ में कोई ऐसी वास्तविक पाठगत या अर्थगत अस्पष्टता नहीं मिली जिसके लिए प्रकाशन-पादटिप्पणी आवश्यक हो।
