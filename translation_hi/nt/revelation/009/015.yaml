source:
  edition: SBLGNT
  text: καὶ ἐλύθησαν οἱ τέσσαρες ἄγγελοι οἱ ἡτοιμασμένοι εἰς τὴν ὥραν ⸀καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν, ἵνα ἀποκτείνωσιν τὸ τρίτον τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/015.yaml
  text: And the four angels who had been prepared for the hour and day and month and year were released[b][a], so that they might kill a third of humanity.
translation:
  language: hi
  text: और उन चार स्वर्गदूतों को मुक्त किया गया, जो उस घड़ी, दिन, महीने और वर्ष के लिए तैयार किए गए थे,[a] ताकि वे मनुष्यों में से एक तिहाई को मार डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी घड़ी, दिन, महीने और वर्ष के लिए।” यूनानी वाक्यांश परमेश्वर द्वारा ठीक-ठीक नियुक्त समय पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλύθησαν
  choice: खोल दिया गया
  rationale: यह λύω का अओरिस्ट कर्मवाच्य रूप है। पिछले पद में स्वर्गदूत बँधे हुए हैं, इसलिए ‘खोल दिया गया’ बंधन से मुक्त किए जाने का भाव स्वाभाविक रूप से व्यक्त करता है और कर्मवाच्य को बनाए रखता है।
- source_word: ἄγγελοι
  choice: स्वर्गदूतों
  rationale: प्रकाशितवाक्य के दर्शनीय और अलौकिक संदर्भ में यह शब्द मानवीय संदेशवाहकों के बजाय अलौकिक प्राणियों को सूचित करता है।
- source_word: ἡτοιμασμένοι
  choice: तैयार किए गए थे
  rationale: पूर्ण कर्मवाच्य कृदंत पहले पूरी की गई तैयारी और उससे बनी वर्तमान तत्परता को दर्शाता है; यह हिंदी प्रयोग उस पूर्व तैयारी को स्पष्ट रखता है।
- source_word: εἰς τὴν ὥραν καὶ ἡμέραν καὶ μῆνα καὶ ἐνιαυτόν
  choice: उस घड़ी, दिन, महीने और वर्ष के लिए
  rationale: समय-सूचकों का क्रम ज्यों का त्यों रखा गया है। आरंभिक निश्चित उपपद पूरे क्रम पर लागू होता है; ‘उस’ एक निश्चित, नियुक्त समय का संकेत देता है, पर वाक्यांश को किसी गणनात्मक कालावधि में नहीं बदलता।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἀποκτείνωσιν
  choice: मार डालें
  rationale: ἵνα के अधीन अओरिस्ट संभावनार्थक क्रिया अभिप्रेत कार्रवाई बताती है। ‘मार डालें’ स्पष्ट और समकालीन है तथा मृत्यु कराने का अर्थ असंदिग्ध रखता है।
- source_word: τὸ τρίτον τῶν ἀνθρώπων
  choice: मनुष्यों के एक तिहाई भाग को
  rationale: τὸ τρίτον अंशवाचक रूप में ‘एक तिहाई’ है और ἀνθρώπων सामान्यतः सभी मानवों को सूचित करता है, केवल पुरुषों को नहीं। ‘मनुष्यों’ हिंदी में इस व्यापक मानवीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘घड़ी, दिन, महीने और वर्ष’ वाले समय-वाक्यांश का आशय
  choice: शब्दक्रम को बनाए रखते हुए इसे एक निश्चित नियुक्त समय के रूप में प्रस्तुत किया गया है।
  alternative: इसे कुल मिलाकर एक वर्ष, एक महीना, एक दिन और एक घड़ी की अवधि माना जा सकता है।
  rationale: यूनानी में एक ही निश्चित उपपद के अधीन समय-सूचकों का संचय सटीक नियुक्ति पर बल देता प्रतीत होता है। अनुवाद किसी विशेष प्रलयकालीन गणना को निर्णायक बनाए बिना मूल की अस्पष्टता और तनाव को सुरक्षित रखता है।
- issue: ἀνθρώπων का व्यापक मानवीय संदर्भ
  choice: मनुष्यों
  alternative: मानवजाति
  rationale: यह शब्द यहाँ सामान्य मानव समुदाय को सूचित करता है, न कि केवल पुरुषों को। ‘मनुष्यों’ अंशवाचक रचना के साथ सहज है और मूल के सामूहिक दायरे को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘स्वर्गदूत’, ‘एक तिहाई’ और ‘मार डालें’ जैसे परिचित बाइबलीय तथा समकालीन पद चुने गए हैं। मुख्य पाठ में पादटिप्पणी चिह्न [a] संबंधित समय-वाक्यांश के तुरंत बाद रखा गया है।
