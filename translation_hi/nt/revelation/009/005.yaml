source:
  edition: SBLGNT
  text: καὶ ἐδόθη ⸀αὐτοῖς ἵνα μὴ ἀποκτείνωσιν αὐτούς, ἀλλ’ ἵνα ⸀βασανισθήσονται μῆνας πέντε· καὶ ὁ βασανισμὸς αὐτῶν ὡς βασανισμὸς σκορπίου, ὅταν παίσῃ ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/005.yaml
  text: And it was given to them that they should not kill them[a], but that they should be tormented for five months[b]; and their torment was like the torment of a scorpion when it strikes a man.
translation:
  language: hi
  text: और उन्हें यह दिया गया कि वे उन लोगों को मार न डालें, बल्कि वे लोग पाँच महीने तक यातना सहें। उनसे होनेवाली यातना वैसी थी, जैसी बिच्छू के किसी मनुष्य[b] को डंक मारने[a] पर होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मारता है” या “प्रहार करता है”; बिच्छू के संदर्भ में इसका आशय “डंक मारता है” है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात किसी व्यक्ति को; यहाँ “मनुष्य” सामान्य अर्थ में है।
    reason: lexical_clarification
lexical_decisions:
- source_word: ἐδόθη αὐτοῖς
  choice: उन्हें यह अधिकार दिया गया
  rationale: यह भाववाच्य रचना देनेवाले का नाम स्पष्ट नहीं करती और प्रकाशितवाक्य की ईश्वरीय अनुमति वाली शैली को बनाए रखती है। हिंदी में केवल ‘यह दिया गया’ अस्वाभाविक होता, इसलिए प्रसंग में निहित अधिकार को स्पष्ट किया गया है।
- source_word: ἵνα μὴ ἀποκτείνωσιν αὐτούς
  choice: कि वे उन लोगों को मार न डालें
  rationale: निषेध तथा उद्देश्य/निर्धारण दोनों का भाव स्वाभाविक हिंदी में व्यक्त होता है; ‘उन लोगों’ से कर्मवाचक सर्वनाम का संदर्भ स्पष्ट रहता है।
- source_word: ἀλλ’ ἵνα βασανισθήσονται μῆνας πέντε
  choice: बल्कि वे लोग पाँच महीने तक यातना सहें
  rationale: असामान्य ἵνα के बाद भविष्यत् कर्मवाच्य रूप का आशय बनाए रखते हुए पीड़ित लोगों को हिंदी में स्पष्ट किया गया है। ‘पाँच महीने तक’ अवधि के कर्मकारक को व्यक्त करता है।
- source_word: βασανισθήσονται / βασανισμός
  choice: यातना सहें / यातना
  rationale: एक ही βασαν- शब्द-समूह की पुनरावृत्ति बनाए रखी गई है। ‘यातना’ तीव्र पीड़ा व्यक्त करती है, पर न्यायिक अत्याचार का अनावश्यक विशिष्ट अर्थ नहीं जोड़ती।
- source_word: ὁ βασανισμὸς αὐτῶν
  choice: उनसे होनेवाली यातना
  rationale: αὐτῶν के संबंध को संदर्भानुसार टिड्डी-सदृश प्राणियों द्वारा पहुँचाई जानेवाली यातना के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: ὡς βασανισμὸς σκορπίου
  choice: वैसी थी, जैसी बिच्छू ... पर होती है
  rationale: तुलना को सहज हिंदी वाक्य-विन्यास में रखा गया है और बिच्छू से होनेवाली पीड़ा का आशय सुरक्षित है।
- source_word: ὅταν παίσῃ
  choice: डंक मारने पर
  rationale: παίω का मूल अर्थ ‘मारना/प्रहार करना’ है, किंतु बिच्छू के संदर्भ में हिंदी का स्वाभाविक और सटीक प्रयोग ‘डंक मारना’ है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἄνθρωπον
  choice: किसी मनुष्य को
  rationale: एकवचन सामान्य मानवीय संदर्भ को बनाए रखता है; यहाँ ‘मनुष्य’ लिंग-समावेशी अर्थ में प्रयुक्त है।
theological_decisions:
- issue: प्रलयदर्शी न्याय में ईश्वरीय भाववाच्य
  choice: देनेवाले का नाम बताए बिना ‘उन्हें यह अधिकार दिया गया’
  alternative: परमेश्वर ने उन्हें अधिकार दिया / उन्हें अनुमति दी गई
  rationale: मूल पाठ देनेवाले को स्पष्ट नहीं करता। परमेश्वर का नाम जोड़ना पाठ से आगे की व्याख्या होती; भाववाच्य रूप ईश्वरीय प्रभुता और माध्यमों द्वारा न्याय के बीच का तनाव सुरक्षित रखता है।
- issue: यातना सहनेवालों और पहुँचानेवालों का संबंध
  choice: पीड़ितों के लिए ‘वे लोग ... यातना सहें’ और साधनों के लिए ‘उनसे होनेवाली यातना’
  alternative: सर्वनामों को बिना स्पष्ट किए ‘वे ... उनकी यातना’
  rationale: यूनानी सर्वनामों का संबंध प्रसंग से खुलता है, पर हिंदी में अस्पष्ट सर्वनाम गलत अर्थ दे सकते हैं। यह चयन मूल भूमिकाओं को बदले बिना उन्हें पठनीय बनाता है।
- issue: सामान्य अर्थ वाला ἄνθρωπον
  choice: किसी मनुष्य को
  alternative: किसी व्यक्ति को / किसी आदमी को
  rationale: ‘मनुष्य’ मूल के एकवचन सामान्य मानवीय अर्थ को औपचारिक और समावेशी ढंग से व्यक्त करता है; इसे केवल पुरुष तक सीमित नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। प्रलयदर्शी भाववाच्य सुरक्षित रखा गया, जबकि हिंदी में संदर्भित समूहों को पहचानने योग्य बनाने के लिए सर्वनामों को सीमित रूप से स्पष्ट किया गया है।
