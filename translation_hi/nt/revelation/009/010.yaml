id: REV.9.10
reference: Revelation 9:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔχουσιν οὐρὰς ὁμοίας σκορπίοις καὶ κέντρα, καὶ ἐν ταῖς οὐραῖς αὐτῶν ⸂ἡ ἐξουσία αὐτῶν⸃ ἀδικῆσαι τοὺς ἀνθρώπους μῆνας πέντε.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/010.yaml
  text: And they have tails like scorpions[a], and stingers; and in their tails is their power to harm people for five months.
translation:
  language: hi
  text: उनकी पूँछें बिच्छुओं जैसी हैं और उनमें डंक हैं; और उनकी पूँछों में मनुष्यों को पाँच महीने तक हानि पहुँचाने की शक्ति है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐρὰς
  choice: पूँछें
  rationale: दर्शन के शारीरिक बिंब को सीधे और बहुवचन में व्यक्त करता है।
- source_word: ὁμοίας σκορπίοις
  choice: बिच्छुओं जैसी
  rationale: ὅμοιος के साथ दत्तिव द्वारा व्यक्त समानता को स्वाभाविक हिंदी में रखता है और समानता को अनावश्यक रूप से केवल पूँछों तक सीमित नहीं करता।
- source_word: κέντρα
  choice: डंक
  rationale: बिच्छू के बिंब में κέντρον का ठोस, चुभाने वाला अर्थ उपयुक्त है; हिंदी में 'डंक' स्वाभाविक है।
- source_word: ἐξουσία
  choice: शक्ति
  rationale: यहाँ हानि पहुँचाने की प्रभावी क्षमता प्रमुख है; 'अधिकार' न्यायिक या औपचारिक अर्थ को जरूरत से अधिक उभार सकता है।
- source_word: ἀδικῆσαι
  choice: हानि पहुँचाने
  rationale: इस विपत्ति-संबंधी प्रसंग में क्रिया शारीरिक कष्ट या नुकसान पहुँचाने को दर्शाती है, न कि केवल नैतिक अन्याय करने को।
- source_word: τοὺς ἀνθρώπους
  choice: मनुष्यों
  rationale: यहाँ ἄνθρωποι सामान्य रूप से मानव जाति के लोगों को सूचित करता है; 'मनुष्यों' आधुनिक हिंदी में समावेशी और सटीक है।
- source_word: μῆνας πέντε
  choice: पाँच महीने तक
  rationale: अवधि बताने वाले कर्मकारक को हिंदी में स्वाभाविक रूप से 'तक' के साथ व्यक्त किया गया है।
theological_decisions:
- issue: प्रकाशितवाक्य की विपत्ति-छवि में ἐξουσία का अर्थ
  choice: '''शक्ति'''
  alternative: '''अधिकार'''
  rationale: वाक्य पूँछों के द्वारा हानि पहुँचाने की सक्रिय क्षमता पर बल देता है। 'शक्ति' इस अर्थ को स्पष्ट करता है, फिर भी दर्शन के व्यापक संदर्भ में उसके अनुमत या प्रदत्त होने की संभावना को नकारता नहीं।
- issue: τοὺς ἀνθρώπους का लिंग-संबंधी निर्वचन
  choice: '''मनुष्यों'''
  alternative: '''पुरुषों'' या ''लोगों'''
  rationale: ἄνθρωπος यहाँ सामान्य मानव-संदर्भ में प्रयुक्त है। 'मनुष्यों' से स्त्री-पुरुष दोनों स्पष्ट रूप से सम्मिलित रहते हैं और यूनानी के आशय को आधुनिक हिंदी में ठीक व्यक्त किया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिंदी में रखी गई है। यूनानी वर्तमानकालीन वर्णन को स्वाभाविक हिंदी आख्यान-शैली में भूतकाल से व्यक्त किया गया है। 'उनमें डंक थे' निकटतम पूर्वपद 'पूँछें' की ओर संकेत करता है और बिच्छू-सदृश दृश्य को स्पष्ट रखता है।
