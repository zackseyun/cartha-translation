reference: Revelation 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶχον θώρακας ὡς θώρακας σιδηροῦς, καὶ ἡ φωνὴ τῶν πτερύγων αὐτῶν ὡς φωνὴ ἁρμάτων ἵππων πολλῶν τρεχόντων εἰς πόλεμον·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/009.yaml
  text: And they had breastplates like iron breastplates[a], and the sound of their wings was like the sound of many chariots with horses rushing into battle.
translation:
  language: hi
  text: और उनके पास लोहे के कवचों जैसे कवच थे, और उनके पंखों की आवाज़ युद्ध की ओर दौड़ते बहुत-से घोड़ों के रथों की आवाज़ जैसी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “बहुत-से दौड़ते घोड़ों के रथों की आवाज़ जैसी, जो युद्ध की ओर जा रहे हों।”'
    reason: यूनानी में ‘रथों’, ‘घोड़ों’, ‘बहुत-से’ और ‘दौड़ते’ संबंधकारक रूपों में हैं; ‘दौड़ते’ व्याकरणतः ‘घोड़ों’ से संबद्ध है। टिप्पणी इस संरचना को दिखाती है।
lexical_decisions:
- source_word: θώρακας
  choice: कवच
  rationale: यह शब्द धड़, विशेषकर छाती की रक्षा करने वाले शरीर-कवच को दर्शाता है। आधुनिक हिन्दी में ‘कवच’ स्वाभाविक और गरिमापूर्ण है; प्रसंग इसे सामान्य सुरक्षा के बजाय पहने जाने वाले युद्ध-कवच के रूप में स्पष्ट करता है।
- source_word: ὡς θώρακας σιδηροῦς
  choice: लोहे के कवचों जैसे
  rationale: ὡς की स्पष्ट उपमा को ‘जैसे’ से बनाए रखा गया है और σιδηροῦς को ‘लोहे के’ के रूप में व्यक्त किया गया है।
- source_word: φωνὴ
  choice: आवाज़
  rationale: यहाँ शब्द वाणी नहीं, पंखों और रथों से उत्पन्न सुनाई देने वाली ध्वनि को दर्शाता है; सामान्य आधुनिक हिन्दी में ‘आवाज़’ सबसे स्वाभाविक है।
- source_word: πτερύγων
  choice: पंखों
  rationale: πτέρυξ का सीधा अर्थ ‘पंख’ है; संबंधकारक रचना को ‘उनके पंखों की आवाज़’ कहा गया है।
- source_word: ἁρμάτων ἵππων πολλῶν
  choice: बहुत-से घोड़ों वाले रथों
  rationale: इससे रथ और घोड़े दोनों स्पष्ट रहते हैं तथा यूनानी संबंधकारक शृंखला का सहज हिन्दी रूप मिलता है। ‘बहुत-से’ को निकटवर्ती ἵππων के साथ रखा गया है।
- source_word: τρεχόντων
  choice: दौड़ते हुए
  rationale: पुल्लिंग संबंधकारक बहुवचन कृदंत व्याकरणतः ἵππων से मेल खाता है; ‘दौड़ते हुए’ उसकी तीव्र गति को बिना अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: εἰς πόλεμον
  choice: युद्ध में
  rationale: गतिशील युद्ध-दृश्य में इसका स्वाभाविक अर्थ युद्ध में प्रवेश करने या उसकी ओर बढ़ने का है; ‘युद्ध में’ संक्षिप्त और मुहावरेदार है।
theological_decisions:
- issue: यूहन्ना के दर्शन में चित्रण का स्वरूप
  choice: ὡς से व्यक्त उपमाओं को सीधे दृष्टिगत चित्रण के रूप में रखा गया है और टिड्डियों की किसी विशिष्ट ऐतिहासिक, यांत्रिक या दुष्टात्मिक पहचान को अनुवाद में नहीं जोड़ा गया।
  alternative: चित्र को किसी शाब्दिक सैन्य यंत्र, दुष्टात्मिक सेना या निश्चित ऐतिहासिक शक्ति की व्याख्या के रूप में प्रस्तुत करना।
  rationale: पद स्वयं तुलना करता है, पहचान निर्धारित नहीं करता। अनुवाद को प्रकाशन-साहित्य की वास्तविक अस्पष्टता और व्याख्यात्मक तनाव बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और श्रव्य रूप अपनाया गया है। दोहराई गई उपमा को जानबूझकर बनाए रखा गया है। ‘वक्ष-कवच’ की अपेक्षा ‘कवच’ सामान्य पाठक के लिए अधिक स्वाभाविक है, जबकि प्रसंग शरीर पर पहने जाने वाले युद्ध-कवच का अर्थ स्पष्ट करता है।
