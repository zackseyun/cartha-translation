id: REV.9.13
reference: Revelation 9:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἄγγελος ἐσάλπισεν· καὶ ἤκουσα φωνὴν μίαν ἐκ ⸀τῶν κεράτων τοῦ θυσιαστηρίου τοῦ χρυσοῦ τοῦ ἐνώπιον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/009/013.yaml
  text: And the sixth angel blew his trumpet[a], and I heard one voice from the horns of the golden altar that is before God,
translation:
  language: hi
  text: और छठे स्वर्गदूत ने तुरही फूँकी, और मैंने परमेश्वर के सामने स्थित सोने की वेदी के सींगों में से एक आवाज़[a] सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही आवाज़।” यूनानी में आवाज़ के एक होने पर बल है।
    reason: φωνὴν μίαν में संख्या पर दिए गए बल को हिन्दी में अधिक स्पष्ट रूप से व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἐσάλπισεν
  choice: तुरही फूँकी
  rationale: क्रिया σαλπίζω का अर्थ तुरही बजाना या फूँकना है। हिन्दी में निहित वाद्य को स्पष्ट करके ‘तुरही फूँकी’ कहना स्वाभाविक है और प्रकाशितवाक्य की तुरही-श्रृंखला से मेल खाता है।
- source_word: φωνὴν μίαν
  choice: एक आवाज़
  rationale: यह पदबंध आवाज़ की एकता या एक होने पर बल देता है। ‘एक आवाज़’ वक्ता की पहचान बताए बिना यूनानी की अस्पष्टता बनाए रखता है; अधिक स्पष्ट बल वाला विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐκ τῶν κεράτων
  choice: सींगों में से
  rationale: ἐκ स्रोत को दर्शाता है, और κέρατα वेदी के सींग-जैसे उभार हैं। ‘सींगों में से’ आवाज़ के स्रोत और उपासना-स्थान की छवि दोनों को सुरक्षित रखता है।
- source_word: θυσιαστηρίου τοῦ χρυσοῦ
  choice: सोने की वेदी
  rationale: यह हिन्दी में स्वाभाविक ढंग से वेदी की सामग्री अथवा स्वर्णिम स्वरूप को व्यक्त करता है और निश्चित संदर्भ को बनाए रखता है।
- source_word: τοῦ ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने स्थित
  rationale: ἐνώπιον स्थान या उपस्थिति का भाव देता है। ‘सामने स्थित’ वेदी की स्थिति स्पष्ट करता है, बिना कोई अतिरिक्त व्याख्या जोड़े।
- source_word: ἄγγελος
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य के दर्शनात्मक संदर्भ में यह मानवीय संदेशवाहक नहीं, बल्कि स्वर्गीय प्राणी को दर्शाता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘स्वर्गदूत’ स्पष्ट और परिचित है।
theological_decisions:
- issue: आवाज़ की पहचान
  choice: केवल ‘एक आवाज़’ कहा गया है; वक्ता की पहचान नहीं जोड़ी गई।
  alternative: इसे परमेश्वर की आवाज़, किसी स्वर्गदूत की आवाज़, या वेदी से संबद्ध किसी व्यक्तिकृत आवाज़ के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ केवल इतना कहता है कि यूहन्ना ने सोने की वेदी के सींगों में से एक आवाज़ सुनी। अनुवाद को इस अस्पष्टता को बनाए रखना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्वर्गदूत’, ‘तुरही’, ‘वेदी’ और ‘सींग’ जैसे स्थापित बाइबलीय शब्द दर्शन के उपासना-स्थान संबंधी बिंब को सुरक्षित रखते हैं।
