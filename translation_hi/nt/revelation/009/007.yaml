  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘टिड्डियों का रूप’ सामूहिक दृश्य प्रभाव को व्यक्त करता है। छोटे वाक्यों और स्पष्ट तुलना-सूचकों से जटिल दर्शनात्मक चित्र सामान्य पाठकों के लिए सुबोध रहता है।
