  text: और टिड्डियों का रूप युद्ध के लिए तैयार घोड़ों के समान था। उनके सिरों पर मानो सोने के समान मुकुट[a] थे, और उनके चेहरे मनुष्यों के चेहरों जैसे थे[b]।
