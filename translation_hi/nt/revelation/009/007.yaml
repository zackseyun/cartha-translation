lexical_decisions:
- source_word: ὁμοιώματα
  choice: रूप
  rationale: यह शब्द दृश्य रूप, आकृति या समानता को सूचित करता है। यहाँ ‘रूप’ दर्शन में दिखाई देने वाली समग्र आकृति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि आगे के तुलना-सूचक शब्द वास्तविक पहचान का दावा नहीं करते।
- source_word: ἀκρίδων
  choice: टिड्डियों
  rationale: ἀκρίς का सामान्य और संदर्भानुकूल अर्थ ‘टिड्डी’ है; बहुवचन को हिन्दी में ‘टिड्डियों’ से व्यक्त किया गया है।
- source_word: ὅμοια ἵπποις ἡτοιμασμένοις εἰς πόλεμον
  choice: युद्ध के लिए तैयार घोड़ों के समान
  rationale: ὅμοια की तुलना और perfect passive participle ἡτοιμασμένοις से व्यक्त तैयारी की बनी हुई अवस्था, दोनों सुरक्षित रखे गए हैं।
- source_word: ὡς στέφανοι
  choice: दिखाई देने वाले मुकुट
  rationale: ὡς वास्तविक पहचान के बजाय दृश्य समानता बताता है। ‘दिखाई देने वाले’ उस दर्शनात्मक अनिश्चितता को सहज हिन्दी में बनाए रखता है।
- source_word: στέφανοι
  choice: मुकुट
  rationale: στέφανος मुकुट या सम्मान तथा विजय से जुड़ी पुष्पमाला/विजय-माला हो सकता है। मुख्य पाठ में व्यापक और सुबोध ‘मुकुट’ रखा गया है तथा वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὅμοιοι χρυσῷ
  choice: सोने के समान
  rationale: यह संरचना सोने से समानता बताती है, अनिवार्य रूप से यह नहीं कि मुकुट सोने के बने थे। ‘सोने के समान’ इस भेद को सुरक्षित रखता है।
- source_word: πρόσωπα ἀνθρώπων
  choice: मनुष्यों के चेहरे
  rationale: πρόσωπα का ठोस अर्थ ‘चेहरे’ है और ἀνθρώπων यहाँ सामान्य मानवजाति का बोध कराता है, केवल पुरुषों का नहीं।
theological_decisions:
- issue: प्रकाशितवाक्य के दर्शन में बार-बार आने वाली उपमा-सूचक भाषा
  choice: ‘के समान’, ‘दिखाई देने वाले’ और ‘जैसे’ के द्वारा सभी प्रमुख तुलनाओं को बनाए रखना
  alternative: दृश्य वस्तुओं को सीधे घोड़े, सोने के मुकुट और मानव चेहरे कहना
  rationale: ὅμοια और ὡς बार-बार दृश्य समानता व्यक्त करते हैं। अनुवाद इस दर्शनात्मक भाषा को वास्तविक वस्तुगत पहचान में नहीं बदलता और मूल की रहस्यमयता तथा तनाव को सुरक्षित रखता है।
