id: REV.1.1
reference: Revelation 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀποκάλυψις Ἰησοῦ Χριστοῦ, ἣν ἔδωκεν αὐτῷ ὁ θεὸς δεῖξαι τοῖς δούλοις αὐτοῦ, ἃ δεῖ γενέσθαι ἐν τάχει, καὶ ἐσήμανεν ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ τῷ δούλῳ αὐτοῦ Ἰωάννῃ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/001.yaml
  text: The revelation of Jesus the Messiah[a], which God gave him to show his servants what must happen soon, and he made it known by sending it through his angel to his servant John[d][c][b],
translation:
  language: hi
  text: यीशु मसीह का प्रकाशन[a], जिसे परमेश्वर ने उसे इसलिए दिया कि वह अपने दासों को वे बातें दिखाए जो शीघ्र ही[b] घटित होनी हैं। और उसने इसे अपने स्वर्गदूत के द्वारा अपने दास यूहन्ना के पास भेजकर प्रकट किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु मसीह की ओर से प्रकाशन” अथवा “यीशु मसीह के विषय में प्रकाशन।” यूनानी संबंधकारक के एक से अधिक अर्थ हो सकते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “तेज़ी से।” इस वाक्यांश का अर्थ यह हो सकता है कि ये बातें जल्द होंगी, अथवा यह कि आरंभ होने पर वे तेज़ी से घटित होंगी।
    reason: lexical_alternative
  - marker: c
    text: इस क्रिया का अनुवाद “ज्ञात कराया” या “संकेतों द्वारा बताया” भी हो सकता है; दूसरे रूप में पुस्तक के प्रतीकात्मक स्वरूप की अर्थछाया उभरती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκάλυψις
  choice: प्रकाशन
  rationale: यह किसी छिपी बात को खोलने या प्रकट करने का अर्थ देता है और हिन्दी बाइबलीय भाषा में स्वाभाविक तथा परिचित है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह का
  rationale: Χριστός को उपाधि के रूप में ‘मसीह’ रखा गया है। हिन्दी का ‘का’ यूनानी संबंधकारक की व्यापकता को काफी हद तक बनाए रखता है—प्रकाशन यीशु से, यीशु का, अथवा यीशु के विषय में समझा जा सकता है।
- source_word: ἣν ἔδωκεν αὐτῷ ὁ θεὸς
  choice: जिसे परमेश्वर ने उसे ... दिया
  rationale: सर्वनाम को बनाए रखते हुए परमेश्वर और यीशु के बीच पाठ में उपस्थित भेद सुरक्षित रखा गया है।
- source_word: δεῖξαι
  choice: दिखाए
  rationale: दर्शनात्मक प्रसंग में यह सरल और प्रत्यक्ष अर्थ है तथा उद्देश्यसूचक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῖς δούλοις αὐτοῦ / τῷ δούλῳ αὐτοῦ
  choice: अपने दासों / अपने दास
  rationale: ‘दास’ स्वामी से संबंध और उसके अधिकार में होने की धारणा को ‘सेवक’ से अधिक सुरक्षित रखता है, जबकि आधुनिक हिन्दी के गरिमापूर्ण धार्मिक गद्य में ‘गुलाम’ से अधिक उपयुक्त है।
- source_word: ἃ δεῖ γενέσθαι
  choice: वे बातें ... जो ... घटित होनी हैं
  rationale: नपुंसकलिंग बहुवचन और δεῖ की आवश्यकता—दोनों को सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: मुख्य पाठ में निकट समय का अर्थ स्वाभाविक है; ‘तेज़ी से’ का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐσήμανεν
  choice: प्रकट किया
  rationale: मुख्य पाठ में संप्रेषण का स्पष्ट और स्वाभाविक अर्थ दिया गया है; संकेतों द्वारा बताने की संभावित अर्थछाया पादटिप्पणी में रखी गई है।
- source_word: ἀποστείλας διὰ τοῦ ἀγγέλου αὐτοῦ
  choice: इसे अपने स्वर्गदूत के द्वारा ... भेजकर
  rationale: कृदंत को साधन बताने वाले रूप में और διά को मध्यस्थता के अर्थ में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τῷ δούλῳ αὐτοῦ Ἰωάννῃ
  choice: अपने दास यूहन्ना के पास
  rationale: सम्प्रदान को प्राप्तकर्ता के रूप में व्यक्त किया गया है और पहले प्रयुक्त δοῦλος के अनुवाद से संगति रखी गई है।
theological_decisions:
- issue: Ἀποκάλυψις Ἰησοῦ Χριστοῦ में संबंधकारक का अर्थ
  choice: ‘यीशु मसीह का प्रकाशन’—अर्थ को खुला रखा गया
  alternative: ‘यीशु मसीह की ओर से प्रकाशन’ अथवा ‘यीशु मसीह के विषय में प्रकाशन’
  rationale: यूनानी संबंधकारक स्रोत, संबंध या विषय की ओर संकेत कर सकता है। अगला उपवाक्य बताता है कि परमेश्वर ने यह यीशु को दिया, पर आरंभिक पदबंध को केवल एक अर्थ तक सीमित करना उचित नहीं।
- issue: δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; गुलाम
  rationale: यह चयन स्वामी के अधिकार में होने और उससे संबंधित होने की प्रबल धारणा को बनाए रखता है, बिना अनावश्यक रूप से आधुनिक सामाजिक संदर्भ आरोपित किए।
- issue: ἐσήμανεν की संकेतात्मक अर्थछाया
  choice: मुख्य पाठ में ‘प्रकट किया’, पादटिप्पणी में ‘संकेतों द्वारा बताया’
  alternative: मुख्य पाठ में ‘संकेतों द्वारा बताया’
  rationale: क्रिया सामान्यतः ‘ज्ञात कराया’ भी दर्शा सकती है और संकेतों से संप्रेषण की ओर भी इशारा कर सकती है। मुख्य पाठ को स्वाभाविक रखते हुए प्रतीकात्मक अर्थछाया को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ गद्य अपनाया गया है। पारंपरिक किन्तु आज भी समझ में आने वाले ‘प्रकाशन’, ‘मसीह’, ‘दास’ और ‘स्वर्गदूत’ रखे गए हैं। वाक्य-विन्यास मूल के संबंधों को सुरक्षित रखते हुए हिन्दी में सहज बनाया गया है।
