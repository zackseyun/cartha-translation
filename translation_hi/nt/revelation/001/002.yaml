source:
  edition: SBLGNT
  text: ὃς ἐμαρτύρησεν τὸν λόγον τοῦ θεοῦ καὶ τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ, ὅσα εἶδεν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/002.yaml
  text: who testified to the word of God and to the testimony of Jesus the Messiah[a], all that he saw.
translation:
  language: hi
  text: जिसने परमेश्वर के वचन और यीशु मसीह की गवाही[a], और उस सब की गवाही दी जो उसने देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यीशु मसीह की ओर से दी गई गवाही’ या ‘यीशु मसीह के विषय में गवाही।’ यूनानी वाक्यांश के दोनों अर्थ हो सकते हैं।
    reason: मूल यूनानी संबंधकारक की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐμαρτύρησεν
  choice: गवाही दी
  rationale: यह सहज आधुनिक हिन्दी में साक्षी के रूप में पुष्टि करने का भाव व्यक्त करता है और μαρτυρίαν के साथ मूल के संज्ञा-क्रिया संबंध को भी बनाए रखता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: ‘वचन’ परमेश्वर से प्राप्त और प्रकट किए गए संदेश के अर्थ को रखता है तथा स्थापित बाइबलीय अभिव्यक्ति भी है।
- source_word: τὴν μαρτυρίαν Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह की गवाही
  rationale: यह औपचारिक रूप से यूनानी संबंधकारक के निकट है और इस अस्पष्टता को बनाए रखता है कि गवाही यीशु की ओर से है या यीशु के विषय में। Χριστός को यहाँ सक्रिय उपाधि के रूप में ‘मसीह’ किया गया है।
- source_word: ὅσα εἶδεν
  choice: उस सब की, जो उसने देखा था
  rationale: ‘उस सब’ ὅσα की व्यापकता व्यक्त करता है; ‘देखा था’ पूर्वकालीन दर्शन को स्वाभाविक हिन्दी में दर्शाता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में संबंधकारक की अस्पष्टता
  choice: यीशु मसीह की गवाही
  alternative: यीशु मसीह की ओर से दी गई गवाही; यीशु मसीह के विषय में गवाही
  rationale: यूनानी पाठ यह निश्चित नहीं करता कि यीशु गवाही देने वाले हैं या गवाही का विषय। मुख्य पाठ की हिन्दी रचना दोनों अर्थों को खुला रखती है और पादटिप्पणी उन्हें स्पष्ट करती है।
- issue: Χριστοῦ का उपाधि के रूप में अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: इस संदर्भ में Χριστός की उपाधिगत शक्ति सक्रिय है; ‘मसीह’ आधुनिक हिन्दी में अर्थपूर्ण और प्रचलित रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से जुड़ा संबंधवाचक उपवाक्य है, इसलिए आरम्भ में ‘जिसने’ रखा गया है। डैश ὅσα εἶδεν को पहले कथन की व्याख्यात्मक समष्टि के रूप में स्पष्ट करता है।
