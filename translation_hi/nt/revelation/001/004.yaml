  text: Ἰωάννης ταῖς ἑπτὰ ἐκκλησίαις ταῖς ἐν τῇ Ἀσίᾳ· χάρις ὑμῖν καὶ εἰρήνη ⸀ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, καὶ ἀπὸ τῶν ἑπτὰ πνευμάτων ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/004.yaml
  text: 'John, to the seven churches in Asia: Grace to you and peace from him who is, and who was, and who is coming, and from the seven spirits who are before his throne,'
translation:
  language: hi
  text: 'यूहन्ना की ओर से एशिया में स्थित सात कलीसियाओं को:


    जो है, जो था और जो आ रहा है[a], उसकी ओर से, और उन सात आत्माओं की ओर से भी, जो उसके सिंहासन के सामने हैं[b], तुम्हें अनुग्रह और शांति मिले,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक परंपरागत रूप से: “जो है, जो था और जो आनेवाला है।”'
    reason: lexical_alternative
  - marker: b
    text: “सात आत्माएँ” पवित्र आत्मा की पूर्णता का प्रतीक हो सकती हैं, या सात स्वर्गीय आत्माओं को सूचित कर सकती हैं; यूनानी पाठ में बहुवचन “सात आत्माएँ” ही है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: व्यक्तिनाम का हिन्दी बाइबल परंपरा में प्रचलित और सहज रूप।
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: सात कलीसियाओं को
  rationale: प्रकाशितवाक्य के मसीही पत्र-संदर्भ में ἐκκλησία के लिए ‘कलीसिया’ स्थापित हिन्दी पद है; बहुवचन और सम्प्रदान कारक दोनों सुरक्षित हैं।
- source_word: ἐν τῇ Ἀσίᾳ
  choice: एशिया की
  rationale: यहाँ Ἀσία रोमी प्रांत को सूचित करता है। ‘एशिया की सात कलीसियाएँ’ स्वाभाविक हिन्दी है और मूल का संक्षिप्त भौगोलिक नाम बनाए रखता है।
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: तुम्हें ... अनुग्रह और शांति मिले
  rationale: पत्रीय आशीर्वचन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ὑμῖν को स्पष्ट बनाए रखता है। ‘मिले’ हिन्दी में अभिप्रेत आशीर्वचन का भाव प्रकट करता है।
- source_word: ἀπὸ ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: उसकी ओर से ... जो है, जो था और जो आ रहा है
  rationale: मूल यूनानी की जानबूझकर असामान्य व्याकरणिक रचना को अत्यधिक सहज बनाकर उसका उपाधिस्वरूप बल नहीं मिटाया गया। ὁ ἐρχόμενος का वर्तमान कृदन्तीय भाव ‘जो आ रहा है’ में सुरक्षित है।
- source_word: τῶν ἑπτὰ πνευμάτων
  choice: उन सात आत्माओं
  rationale: मूल का स्पष्ट बहुवचन बनाए रखा गया है; इसे मुख्य पाठ में ‘सातगुना आत्मा’ कहना विवादित प्रतीकात्मक व्याख्या को अनुवाद में शामिल कर देता।
- source_word: ἃ ἐνώπιον τοῦ θρόνου αὐτοῦ
  choice: जो उसके सिंहासन के सामने हैं
  rationale: आत्मिक सत्ताओं के लिए हिन्दी में ‘जो’ स्वाभाविक है और ἐνώπιον का स्थान-संबंधी अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: ‘जो है, जो था और जो आ रहा है’ की पहचान और अभिव्यक्ति
  choice: इसे परमेश्वर की गंभीर दिव्य उपाधि के रूप में व्यक्तिगत एकवचन ‘उसकी ... जो’ से प्रस्तुत किया गया।
  alternative: ‘जो है, जो था और जो आनेवाला है’
  rationale: दोनों सम्भव हैं, पर ‘जो आ रहा है’ ὁ ἐρχόμενος की वर्तमान कृदन्तीय और गतिशील शक्ति को अधिक सीधे व्यक्त करता है। विराम-चिह्न पुनरावृत्त उपवाक्यों की गंभीरता दिखाते हैं।
- issue: ‘सात आत्माओं’ की पहचान
  choice: मुख्य पाठ में शाब्दिक बहुवचन ‘सात आत्माओं’ रखा गया।
  alternative: पवित्र आत्मा की पूर्णता का प्रतीक; अथवा परमेश्वर के सिंहासन के सामने सात स्वर्गीय आत्माएँ
  rationale: मूल पाठ स्वयं पहचान को निर्णायक रूप से स्पष्ट नहीं करता। इसलिए अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पत्रीय शैली अपनाई गई है। ‘कलीसिया’, ‘अनुग्रह’ और ‘सिंहासन’ जैसे व्यापक रूप से पहचाने जाने वाले बाइबलीय पद रखे गए हैं। वाक्य का अंतिम अल्पविराम इसलिए बना है क्योंकि पद 4 अगले पद में आगे चलता है।
