language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ μυστήριον τῶν ἑπτὰ ἀστέρων ⸀οὓς εἶδες ἐπὶ τῆς δεξιᾶς μου, καὶ τὰς ἑπτὰ λυχνίας τὰς χρυσᾶς· οἱ ἑπτὰ ἀστέρες ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν εἰσίν, καὶ αἱ λυχνίαι αἱ ἑπτὰ ἑπτὰ ἐκκλησίαι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/020.yaml
  text: 'As for the mystery of the seven stars that you saw in my right hand[a], and the seven golden lampstands: the seven stars are the angels of the seven churches, and the seven lampstands are the seven churches.'
translation:
  language: hi
  text: 'उन सात तारों का रहस्य, जिन्हें तुमने मेरे दाहिने हाथ में देखा था, और उन सात स्वर्ण दीवटों का रहस्य यह है: वे सात तारे सात कलीसियाओं के स्वर्गदूत[a] हैं, और वे सात दीवट सात कलीसियाएँ हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सात कलीसियाओं के संदेशवाहक।” यूनानी शब्द स्वर्गदूत या मानवीय संदेशवाहक, दोनों के लिए प्रयुक्त हो सकता है।
    reason: वैकल्पिक अर्थ; मूल यूनानी में अभिप्राय अस्पष्ट है।
lexical_decisions:
- source_word: μυστήριον
  choice: रहस्य
  rationale: यह प्रकाशितवाक्य की दर्शनात्मक और धर्मवैज्ञानिक शब्दावली को बनाए रखता है; संदर्भ में दर्शन का प्रकट किया गया अर्थ अभिप्रेत है, पर ‘रहस्य’ मूल शब्द की गूँज को सुरक्षित रखता है।
- source_word: ἀστέρων / ἀστέρες
  choice: तारे
  rationale: दर्शन के प्रतीक का सीधा और स्वाभाविक अनुवाद है, जिसकी पहचान आगे स्पष्ट की गई है।
- source_word: οὓς εἶδες
  choice: जिन्हें तुमने ... देखा था
  rationale: सापेक्ष उपवाक्य को स्वाभाविक आधुनिक हिन्दी में रखते हुए तारों से उसका संबंध स्पष्ट करता है।
- source_word: ἐπὶ τῆς δεξιᾶς μου
  choice: मेरे दाहिने हाथ में
  rationale: यूनानी पूर्वसर्ग के सम्भव अर्थों में से यह निकटवर्ती दर्शनात्मक संदर्भ और हिन्दी मुहावरे के अनुरूप है।
- source_word: λυχνίας
  choice: दीवट
  rationale: यह दीप रखने के आधार को दर्शाता है, स्वयं दीप को नहीं, और प्रकाशितवाक्य की ठोस प्रतीकात्मक छवि बनाए रखता है।
- source_word: χρυσᾶς
  choice: सोने के
  rationale: स्वाभाविक आधुनिक हिन्दी में वस्तु की स्वर्णमय प्रकृति स्पष्ट करता है।
- source_word: ἄγγελοι
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य में अलौकिक अर्थ सामान्य है, फिर भी यूनानी शब्द मानवीय संदेशवाहकों को भी सूचित कर सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐκκλησιῶν / ἐκκλησίαι
  choice: कलीसियाओं / कलीसियाएँ
  rationale: यह प्रकाशितवाक्य में संबोधित मसीही समुदायों के लिए प्रचलित और संदर्भानुकूल हिन्दी पद है।
- source_word: τὸ μυστήριον ... καὶ ...
  choice: '... का रहस्य, और ... का रहस्य यह है:'
  rationale: यूनानी वाक्य पहले विषय प्रस्तुत करके फिर उसकी व्याख्या देता है। हिन्दी में ‘रहस्य’ की पुनरावृत्ति दोनों प्रतीकों को स्पष्ट रूप से एक ही व्याख्यात्मक संरचना में जोड़ती है।
theological_decisions:
- issue: ἄγγελοι τῶν ἑπτὰ ἐκκλησιῶν का अभिप्राय
  choice: सात कलीसियाओं के स्वर्गदूत
  alternative: सात कलीसियाओं के संदेशवाहक
  rationale: ἄγγελος स्वर्गीय दूत या मानवीय संदेशवाहक, दोनों को सूचित कर सकता है। प्रकाशितवाक्य में स्वर्गीय प्राणी वाला अर्थ सामान्य होने के कारण मुख्य पाठ में ‘स्वर्गदूत’ रखा गया है, पर पाठ स्वयं मानवीय अभिप्राय को निर्णायक रूप से अस्वीकार नहीं करता; इसलिए वह पादटिप्पणी में सुरक्षित है।
