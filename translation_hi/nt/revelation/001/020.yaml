  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘दीवट’ तथा ‘कलीसिया’ परिचित बाइबलीय शब्द हैं और इस दर्शन की विशिष्ट छवि तथा सामुदायिक संदर्भ को सुरक्षित रखते हैं।
