source:
  edition: SBLGNT
  text: καὶ ἐποίησεν ἡμᾶς βασιλείαν, ἱερεῖς τῷ θεῷ καὶ πατρὶ αὐτοῦ— αὐτῷ ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας ⸂τῶν αἰώνων⸃· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/006.yaml
  text: and made us a kingdom[a], priests to his God and Father—to him be the glory and the dominion forever and ever[b]. Amen.
translation:
  language: hi
  text: और उसने हमें एक राज्य बनाया, अर्थात् उसके परमेश्वर और पिता के लिए याजक—उसी की महिमा और प्रभुता युगानुयुग रहे। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησεν
  choice: बनाया
  rationale: यूनानी एओरिस्ट क्रिया को प्रसंगानुसार सामान्य भूतकाल में रखा गया है; इससे कार्य का कथन स्पष्ट रहता है और उसके जारी परिणाम को अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: βασιλείαν
  choice: एक राज्य
  rationale: यह एकवचन संज्ञा ‘राज्य’ या ‘राजकीय क्षेत्र’ को व्यक्त करती है, ‘राजाओं’ को नहीं। इससे निर्गमन 19:6 की संभावित प्रतिध्वनि और समुदाय की सामूहिक पहचान बनी रहती है।
- source_word: ἱερεῖς
  choice: याजक
  rationale: यह बहुवचन में समुदाय के सदस्यों की याजकीय पहचान बताता है। हिन्दी में ‘याजक’ का रूप संख्या के अनुसार अपरिवर्तित रह सकता है और धार्मिक-सांस्कृतिक अर्थ को ठीक रखता है।
- source_word: τῷ θεῷ καὶ πατρὶ αὐτοῦ
  choice: अपने परमेश्वर और पिता के लिए
  rationale: सम्बन्धवाचक αὐτοῦ का सम्बन्ध दोनों संज्ञाओं—‘परमेश्वर’ और ‘पिता’—से रखा गया है। ‘अपने’ निकटवर्ती कर्ता यीशु मसीह की ओर संकेत करता है, और ‘के लिए’ दत्तिव के सेवा एवं समर्पण के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτῷ
  choice: उसी की
  rationale: स्तुतिवाचक वाक्य में दत्तिव को हिन्दी के स्वाभाविक सम्बन्धसूचक ढाँचे में व्यक्त किया गया है; ‘उसी’ बल देकर यीशु की ओर लौटता है।
- source_word: δόξα
  choice: महिमा
  rationale: स्तुतिवाचक प्रसंग में यह मानक, स्पष्ट और गरिमापूर्ण हिन्दी पद है।
- source_word: κράτος
  choice: प्रभुता
  rationale: यह केवल सामान्य सामर्थ्य नहीं, बल्कि प्रभावी सार्वभौम शासन-शक्ति का भाव व्यक्त करता है; ‘प्रभुता’ उस स्तुतिवाचक अर्थ को संक्षेप में रखता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनन्त अवधि बताने वाले यूनानी मुहावरे का स्वाभाविक और पारंपरिक हिन्दी समतुल्य है। अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: ἀμήν
  choice: आमीन
  rationale: इसे प्रचलित उपासना-संबंधी स्वीकृतिवाचक रूप में रखा गया है।
theological_decisions:
- issue: ‘अपने परमेश्वर और पिता’ का सम्बन्ध
  choice: यह पद यीशु मसीह के परमेश्वर और पिता की ओर संकेत करता है।
  alternative: इसे समतल करके केवल ‘परमेश्वर पिता’ कहा जा सकता था।
  rationale: निकटवर्ती प्रसंग में कर्ता यीशु मसीह हैं। ‘अपने परमेश्वर और पिता’ मूल पाठ के सम्बन्धात्मक और मसीह-संबंधी तनाव को बिना नरम किए सुरक्षित रखता है।
- issue: समुदाय की पहचान का स्वरूप
  choice: मुख्य पाठ में ‘एक राज्य, ... याजक’ रखा गया है।
  alternative: ‘राजा और याजक’—जो कुछ बाद की पाण्डुलिपियों और पारंपरिक अनुवादों में मिलता है।
  rationale: प्रदत्त यूनानी पाठ βασιλείαν, ἱερεῖς पढ़ता है। इसलिए अनुवाद समुदाय की सामूहिक पहचान ‘एक राज्य’ और उसकी याजकीय पहचान दोनों को रखता है, न कि पाठांतर को मुख्य पाठ में लाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, उपासनात्मक और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘एक राज्य, ... याजक’ की कुछ असामान्य लेकिन मूल-पाठ-संगत संरचना को व्याख्यात्मक विस्तार से नहीं बदला गया।
