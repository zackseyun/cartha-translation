id: REV.1.7
reference: Revelation 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχεται μετὰ τῶν νεφελῶν, καὶ ὄψεται αὐτὸν πᾶς ὀφθαλμὸς καὶ οἵτινες αὐτὸν ἐξεκέντησαν, καὶ κόψονται ἐπ’ αὐτὸν πᾶσαι αἱ φυλαὶ τῆς γῆς. ναί, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/007.yaml
  text: Look[a], he is coming with the clouds, and every eye will see him, even those who pierced him, and all the tribes of the earth will mourn over him. Yes, amen.
translation:
  language: hi
  text: देखो, वह बादलों के साथ आ रहा है। हर आँख उसे देखेगी—वे भी जिन्होंने उसे बेधा था—और पृथ्वी के सभी गोत्र उसके लिए विलाप करेंगे।[a] हाँ, आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देश के सभी गोत्र उसके लिए विलाप करेंगे।” यह वाक्य जकर्याह 12:10-12 की प्रतिध्वनि हो सकता है, जहाँ “देश” संदर्भ के अनुसार संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह शब्द ध्यान आकर्षित करने वाला सजीव आह्वान है; ‘देखो’ आधुनिक और स्वाभाविक हिंदी में उसका बल बनाए रखता है।
- source_word: ἔρχεται
  choice: आ रहा है
  rationale: ग्रीक वर्तमान काल में भावी और आसन्न घटना की सजीवता है; हिंदी का वर्तमान प्रगतिशील रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετὰ τῶν νεφελῶν
  choice: बादलों के साथ
  rationale: दानिय्येल 7:13 की ओर संकेत करने वाली ठोस छवि और ग्रीक के निश्चित रूप को बनाए रखता है।
- source_word: πᾶς ὀφθαλμὸς
  choice: हर आँख
  rationale: ग्रीक की ठोस, एकवचन-वितरणात्मक अभिव्यक्ति को ‘हर व्यक्ति’ जैसे सामान्यीकरण के बिना सुरक्षित रखता है।
- source_word: οἵτινες αὐτὸν ἐξεκέντησαν
  choice: वे भी जिन्होंने उसे बेधा था
  rationale: ‘वे भी’ इस समूह को ‘हर आँख’ में सम्मिलित करता है; ‘बेधा’ जकर्याह 12:10 और यूहन्ना 19:37 से शब्दगत संबंध बनाए रखता है।
- source_word: κόψονται ἐπ’ αὐτὸν
  choice: उसके कारण विलाप करेंगे
  rationale: κόπτω यहाँ शोक-विलाप का सूचक है। ἐπ’ αὐτόν कारण, अवसर अथवा उसके विषय में शोक का भाव दे सकता है; ‘उसके कारण’ हिंदी में स्वाभाविक रहते हुए इस संबंध को अनावश्यक रूप से नहीं खोलता।
- source_word: πᾶσαι αἱ φυλαὶ τῆς γῆς
  choice: पृथ्वी के सभी गोत्र
  rationale: φυλαί के विशिष्ट अर्थ ‘गोत्र’ को बनाए रखता है। सार्वभौमिक संदर्भ में γῆ के लिए ‘पृथ्वी’ मुख्य पाठ में उपयुक्त है, जबकि ‘देश’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: ναί, ἀμήν
  choice: हाँ, आमीन
  rationale: दोहरी दृढ़ पुष्टि को बनाए रखता है; ‘आमीन’ हिंदी बाइबलीय और आराधनात्मक प्रयोग में परिचित है।
theological_decisions:
- issue: πᾶσαι αἱ φυλαὶ τῆς γῆς में τῆς γῆς का भौगोलिक विस्तार
  choice: मुख्य पाठ में ‘पृथ्वी के सभी गोत्र’
  alternative: ‘देश के सभी गोत्र’
  rationale: ‘हर आँख’ और प्रकाशितवाक्य के व्यापक दृश्य के कारण मुख्य पाठ में ‘पृथ्वी’ उपयुक्त है। फिर भी जकर्याह 12:10-12 की प्रतिध्वनि के कारण ‘देश’ वास्तविक भाषिक और संदर्भगत संभावना है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ἐπ’ αὐτὸν में विलाप का संबंध
  choice: ‘उसके कारण विलाप करेंगे’
  alternative: ‘उसके लिए विलाप करेंगे’ या ‘उसे लेकर विलाप करेंगे’
  rationale: ग्रीक वाक्यांश कारण अथवा शोक के केंद्र दोनों का भाव दे सकता है। ‘उसके कारण’ इस अस्पष्टता को काफी हद तक खुला रखता है और यह तय नहीं करता कि विलाप पश्चाताप, भय या शोक में से विशेषतः कौन-सा है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और श्रवणयोग्य शैली। ‘देखो’, ‘हर आँख’, ‘बेधा’, ‘गोत्र’ और ‘आमीन’ मूल की ठोस तथा अंतरपाठीय भाषा को बनाए रखते हैं। विराम-चिह्नों से वाक्य का घोषणात्मक और गंभीर प्रवाह स्पष्ट किया गया है।
