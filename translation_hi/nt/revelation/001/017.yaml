    issue: Spatial phrasing ‘उसके पैरों पर’ is potentially imprecise.
    rationale: πρὸς τοὺς πόδας αὐτοῦ idiomatically depicts falling at/before his feet. In Hindi, ‘पैरों पर गिर पड़ा’ can imply landing on the feet; ‘पैरों के पास ... गिर पड़ा’ conveys the intended posture more naturally.
  - severity: low
    issue: ‘मरे हुए के समान’ is somewhat awkward and leaves the comparison’s referent less immediate.
    rationale: ὡς νεκρός compares John’s condition to that of a dead person. ‘मानो मरा हुआ’ is concise, natural, and preserves the simile without stating that he died.
