  verdict: revise
  source_fidelity: 'The draft accurately represents the sequence and all principal elements of the Greek: John sees him, falls at his feet in an explicit comparison to death, receives the right hand placed on him, and hears the singular command not to fear followed by the titular self-identification. The wording ‘पैरों पर’ can suggest falling onto his feet rather than falling before/at them, and ‘मरे हुए के समान’ is grammatically less direct than the Greek simile applied to John.'
  naturalness: ‘उसके पैरों के पास मानो मरा हुआ गिर पड़ा’ is more idiomatic modern Hindi and clearly conveys that John fell in the presence of the figure, as if dead. The solemn but accessible register is retained.
  terminology: ‘दाहिना हाथ,’ ‘मत डर,’ and ‘प्रथम और अन्तिम’ appropriately preserve the explicit hand, singular reassurance, and titular force. ‘प्रथम और अन्तिम’ is preferable here to the more colloquial ‘पहला और आखिरी.’
  issues:
