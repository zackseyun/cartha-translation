id: REV.1.17
reference: Revelation 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὅτε εἶδον αὐτόν, ἔπεσα πρὸς τοὺς πόδας αὐτοῦ ὡς νεκρός· καὶ ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμὲ λέγων· Μὴ φοβοῦ· ἐγώ εἰμι ὁ πρῶτος καὶ ὁ ἔσχατος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/017.yaml
  text: And when I saw him[a], I fell at his feet like a dead man. And he placed his right hand on me, saying, “Do not fear[b]. I am the First and the Last,”
translation:
  language: hi
  text: और जब मैंने उसे देखा, तो मैं उसके पैरों के पास मानो मरा हुआ[a] गिर पड़ा। तब उसने अपना दाहिना हाथ मुझ पर रखा और कहा, “मत डर[b]। मैं प्रथम और अन्तिम हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक मृत व्यक्ति के समान।”
    reason: lexical_alternative
  - marker: b
    text: या, “भयभीत मत हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: और जब
  rationale: ‘और’ कथा के पिछले प्रवाह से सम्बन्ध बनाए रखता है और ‘जब’ समय-सूचक ὅτε को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἶδον αὐτόν
  choice: मैंने उसे देखा
  rationale: यह साधारण प्रत्यक्ष देखने का स्पष्ट और स्वाभाविक अनुवाद है।
- source_word: ἔπεσα πρὸς τοὺς πόδας αὐτοῦ
  choice: मैं उसके पैरों पर ... गिर पड़ा
  rationale: यह यूहन्ना के उसके सामने, उसके पैरों की ओर गिरने को सहज हिन्दी में व्यक्त करता है; ‘गिर पड़ा’ आकस्मिक और पूर्ण क्रिया का भाव रखता है।
- source_word: ὡς νεκρός
  choice: मरे हुए के समान
  rationale: ὡς की स्पष्ट उपमा को बनाए रखता है और यह नहीं कहता कि यूहन्ना सचमुच मर गया था।
- source_word: ἔθηκεν τὴν δεξιὰν αὐτοῦ ἐπ’ ἐμέ
  choice: उसने अपना दाहिना हाथ मुझ पर रखा
  rationale: क्रिया और स्पष्ट ‘दाहिना हाथ’ दोनों को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λέγων
  choice: और कहा
  rationale: यद्यपि यूनानी में वर्तमान कृदन्त है, हिन्दी में साथ-साथ हुई क्रिया को ‘और कहा’ अधिक सहजता से व्यक्त करता है।
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: निषेधात्मक आज्ञा का सीधा, वर्तमान और सामान्य हिन्दी रूप है; इसका स्वर आश्वस्त करने वाला है।
- source_word: ἐγώ εἰμι
  choice: मैं ... हूँ
  rationale: स्पष्ट प्रथम-पुरुष आत्मपरिचय को सुरक्षित रखता है और उसके बाद आने वाली उपाधियों से स्वाभाविक रूप से जुड़ता है।
- source_word: ὁ πρῶτος καὶ ὁ ἔσχατος
  choice: प्रथम और अन्तिम
  rationale: दोनों विशेषण यहाँ संज्ञात्मक उपाधियों के रूप में प्रयुक्त हैं। हिन्दी में अक्षर-आधारित capitalization न होने के कारण उनका उपाधिगत स्वरूप वाक्य और शब्द-चयन से स्पष्ट होता है।
theological_decisions:
- issue: ὁ πρῶτος καὶ ὁ ἔσχατος का उपाधि के रूप में अनुवाद
  choice: प्रथम और अन्तिम
  alternative: पहला और आखिरी
  rationale: ‘प्रथम और अन्तिम’ मूल के अर्थ को सीधे रखता है और आत्मप्रकाशन की गरिमा तथा यशायाह की प्रतिध्वनि को बनाए रखता है, बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
- issue: ἐγώ εἰμι का बल
  choice: मैं ... हूँ
  alternative: मैं ही हूँ
  rationale: स्पष्ट सर्वनाम और क्रिया से आत्मपरिचय का बल बना रहता है। ‘ही’ जोड़ने से ऐसा विशेष व्यतिरेकी बल आ सकता है जो इस स्थान पर मूल पाठ में अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। ‘पैरों’ और ‘मत डर’ जैसे सामान्य शब्द पाठ को साधारण पाठक के लिए सुलभ रखते हैं, जबकि ‘प्रथम और अन्तिम’ उपाधि की गंभीरता बनाए रखता है।
