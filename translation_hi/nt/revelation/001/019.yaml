lexical_decisions:
- source_word: γράψον
  choice: लिखो
  rationale: द्वितीय पुरुष एकवचन की आज्ञा को सरल और स्वाभाविक रूप में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले दर्शन और आदेश से निकलने वाले निष्कर्ष या संबंध को स्पष्ट रखता है।
- source_word: ἃ εἶδες
  choice: जो कुछ तुमने देखा है
  rationale: पहले देखे जा चुके दर्शन की विषयवस्तु को वर्तमान लेखन-आदेश से जोड़ता है।
- source_word: ἃ εἰσὶν
  choice: जो कुछ अभी है
  rationale: वर्तमान वास्तविकताओं का भाव देता है; ‘अभी’ हिन्दी में कालगत भेद को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: μέλλει γίνεσθαι
  choice: होने वाला है
  rationale: μέλλω और infinitive में निहित आसन्नता या अपेक्षित घटना का भाव रखता है, पर अनावश्यक रूप से नियति का अर्थ नहीं जोड़ता।
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: हिन्दी में स्वाभाविक कालगत अभिव्यक्ति है और इन वर्तमान बातों के बाद की घटनाओं की ओर संकेत करती है।
theological_decisions:
- issue: प्रकाशितवाक्य के संदर्भ में μέλλει का कालगत बल
  choice: ‘होने वाला है’ कहकर आसन्नता का भाव बनाए रखा गया है।
  alternative: ‘होगा’ कहकर साधारण भविष्य व्यक्त किया जा सकता है।
  rationale: यूनानी रचना प्रायः घटित होने जा रही बात का भाव रखती है। मुख्य पाठ में इसे बनाए रखना व्यापक युगांत-विषयक विवाद को तय किए बिना पाठ की कालगत तनावपूर्णता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। समानांतर तीन खंडों को ‘जो कुछ’ से रखा गया है, जबकि हिन्दी की स्वाभाविकता के लिए अंतिम संयुक्त कर्म के बाद ‘उसे लिखो’ रखा गया है।
