  text: καὶ ὁ ζῶν— καὶ ἐγενόμην νεκρὸς καὶ ἰδοὺ ζῶν εἰμι εἰς τοὺς αἰῶνας τῶν ⸀αἰώνων— καὶ ἔχω τὰς κλεῖς τοῦ θανάτου καὶ τοῦ ᾅδου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/018.yaml
  text: and the Living One—I became dead[a], and behold[c][b], I am alive forever and ever—and I have the keys of death and of Hades.
translation:
  language: hi
  text: और मैं वह हूँ जो जीवित है। मैं मृत हो गया था,[a] और देखो, मैं युगानुयुग जीवित हूँ;[b] और मृत्यु तथा अधोलोक की चाबियाँ मेरे पास हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक सहज रूप में, “मैं मर गया था”; यूनानी में शाब्दिक भाव “मैं मृत हो गया था” है, जो मृत्यु की अवस्था में प्रवेश पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “युगों के युगों तक”; यह कभी समाप्त न होने वाली अवधि का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: “अधोलोक” से आशय मृतकों का लोक है, विशेष रूप से अंतिम दण्ड का नरक नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ζῶν
  choice: जीवित जन
  rationale: निश्चित उपपद के साथ वर्तमान कृदंत यहाँ संज्ञा और उपाधि के रूप में प्रयुक्त है। ‘जीवित जन’ इसके उपाधिसूचक बल को बनाए रखता है और इसे केवल ‘जो जीवित है’ जैसे साधारण वर्णन में नहीं बदलता।
- source_word: ἐγενόμην νεκρός
  choice: मैं मृत हो गया था
  rationale: γίνομαι के साथ विशेषण मृत्यु की अवस्था में प्रवेश को व्यक्त करता है। यह सरल ‘मैं मरा हुआ था’ की अपेक्षा मृत्यु की ओर हुए परिवर्तन को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह यूनानी विस्मयादिबोधक का ध्यान आकर्षित करने वाला सजीव बल स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ζῶν εἰμι
  choice: मैं ... जीवित हूँ
  rationale: कृदंत और εἰμί से व्यक्त वर्तमान जीवित अवस्था का स्वाभाविक हिन्दी रूप है और पहले कही गई मृत्यु के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनन्त अवधि के बलयुक्त यूनानी मुहावरे का संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी समतुल्य है।
- source_word: κλεῖς
  choice: चाबियाँ
  rationale: मूल चित्र को सीधे रखता है; प्रसंग में चाबियाँ अधिकार और नियंत्रण का संकेत देती हैं। आधुनिक पाठकों के लिए यह ‘कुंजियाँ’ से अधिक सहज है।
- source_word: τοῦ θανάτου
  choice: मृत्यु की
  rationale: संबंधकारक का सीधा अनुवाद है। इसे व्यक्तिवाचक बनाकर ऐसी व्याख्या नहीं जोड़ी गई जिसकी यूनानी पाठ में आवश्यकता नहीं है।
- source_word: τοῦ ᾅδου
  choice: अधोलोक की
  rationale: यह मृतकों के लोक को दर्शाता है और इसे केवल कब्र या अंतिम दण्ड के नरक के साथ एकरूप नहीं करता।
theological_decisions:
- issue: मृत्यु और ᾅδης के बीच संबंध
  choice: मृत्यु तथा अधोलोक
  alternative: मृत्यु तथा नरक / मृत्यु तथा कब्र
  rationale: पाठ दोनों को संबद्ध किंतु अलग वास्तविकताओं के रूप में रखता है। ‘अधोलोक’ ᾅδης को अंतिम दण्ड के ‘नरक’ या केवल भौतिक ‘कब्र’ तक सीमित किए बिना इस भेद को बनाए रखता है।
- issue: ἐγενόμην νεκρός में मृत्यु की ओर संक्रमण
  choice: मैं मृत हो गया था
  alternative: मैं मरा हुआ था
  rationale: चुना हुआ रूप देहधारण या मृत्यु के विषय में कोई अतिरिक्त सिद्धान्त जोड़े बिना क्रिया में निहित अवस्था-परिवर्तन को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जीवित जन’ उपाधि का बल सुरक्षित करता है; ‘चाबियाँ’ सामान्य आधुनिक शब्दावली है। ‘पर’ मृत्यु और वर्तमान जीवन के तीखे विरोध को स्वाभाविक हिन्दी में उभारता है, जबकि अर्थगत संबंध मूल पाठ के अनुरूप रहता है।
