id: REV.1.11
reference: Revelation 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λεγούσης· Ὃ βλέπεις γράψον εἰς βιβλίον καὶ πέμψον ταῖς ἑπτὰ ἐκκλησίαις, εἰς Ἔφεσον καὶ εἰς Σμύρναν καὶ εἰς Πέργαμον καὶ εἰς Θυάτειρα καὶ εἰς Σάρδεις καὶ εἰς Φιλαδέλφειαν καὶ εἰς Λαοδίκειαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/011.yaml
  text: 'saying[a], “What you see[b], write in a book and send it to the seven churches: to Ephesus and to Smyrna and to Pergamum and to Thyatira and to Sardis and to Philadelphia and to Laodicea.”'
translation:
  language: hi
  text: वह कह रही थी, “जो कुछ तुम देखते हो, उसे एक पुस्तक[a] में लिखो और सातों कलीसियाओं के पास भेज दो—इफिसुस, स्मुरना, पिरगमुन[b], थुआतीरा, सरदीस, फिलदेलफिया और लौदीकिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लपेटी जाने वाली पुस्तक (कुंडली) में”; यूनानी βιβλίον पुस्तक, कुंडली या लिखित दस्तावेज़ को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: पिरगमुन का पारंपरिक रूप “पिरगमुस” भी मिलता है।
    reason: alternative_transliteration
lexical_decisions:
- source_word: λεγούσης
  choice: वह कह रही थी
  rationale: यह स्त्रीलिंग संबंधकारक वर्तमान कृदन्त पिछले पद में वर्णित ‘आवाज़’ के वर्णन को आगे बढ़ाता है। हिंदी में ‘वह कह रही थी’ उद्धरण का स्वाभाविक परिचय देता है और स्त्रीलिंग के द्वारा आवाज़ से संबंध बनाए रखता है।
- source_word: Ὃ βλέπεις
  choice: जो कुछ तुम देखते हो
  rationale: यह व्यापक दर्शनीय विषय को स्वाभाविक हिंदी में व्यक्त करता है; ‘जो कुछ’ दर्शन की समस्त सामग्री को समेटता है, बिना उसे अनावश्यक रूप से सीमित किए।
- source_word: γράψον
  choice: लिखो
  rationale: γράψον का सीधा आज्ञार्थक अर्थ ‘लिखो’ है; यह ‘दर्ज करो’ की अपेक्षा अधिक निकट और सहज है।
- source_word: εἰς βιβλίον
  choice: एक पुस्तक में
  rationale: βιβλίον पुस्तक, ग्रंथ-पत्र या लपेटी जाने वाली पुस्तक को सूचित कर सकता है। मुख्य पाठ में आधुनिक और सुबोध ‘पुस्तक’ रखा गया है तथा भौतिक स्वरूप की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: πέμψον
  choice: भेज दो
  rationale: यह अओरिस्ट आज्ञार्थक की पूर्ण और सीधी आज्ञा को सहज हिंदी में व्यक्त करता है। जिसे भेजना है, वह लिखी हुई सामग्री अथवा पुस्तक प्रसंग से स्पष्ट है।
- source_word: ταῖς ἑπτὰ ἐκκλησίαις
  choice: सातों कलीसियाओं के पास
  rationale: यहाँ ἐκκλησίαις निश्चित मसीही समुदायों को दर्शाता है। ‘कलीसिया’ प्रचलित और गैर-सांप्रदायिक बाइबलीय शब्द है; ‘सातों’ निश्चित सात समुदायों पर बल देता है।
- source_word: εἰς Ἔφεσον ... εἰς Λαοδίκειαν
  choice: इफिसुस, स्मुरना, पिरगमुन, थुआतीरा, सरदीस, फिलदेलफिया और लौदीकिया
  rationale: नगरों की पूरी सूची को क्रम सहित रखा गया है। हिंदी में डैश के बाद सूची देना बार-बार ‘को’ दोहराने की अपेक्षा स्वाभाविक है, जबकि प्रत्येक अलग गंतव्य का अर्थ स्पष्ट रहता है।
- source_word: Πέργαμον
  choice: पिरगमुन
  rationale: यह यूनानी स्थान-नाम का हिंदी बाइबल परंपरा में प्रचलित रूप है। वैकल्पिक पारंपरिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: प्रकाशितवाक्य 1:11 में ἐκκλησίαις का स्वरूप
  choice: कलीसियाओं
  alternative: सभाओं
  rationale: यह शब्द उन ठोस मसीही समुदायों को सूचित करता है जिन्हें यूहन्ना के द्वारा संदेश भेजा जाना है। ‘कलीसिया’ इस संदर्भ को स्पष्ट करता है, पर किसी संप्रदाय-विशेष की शासन-पद्धति नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण की आज्ञाएँ सीधी हैं; नगरों की सूची डैश के बाद दी गई है ताकि यूनानी की वितरक संरचना का अर्थ बना रहे और हिंदी बोझिल न हो।
