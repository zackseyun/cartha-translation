id: REV.1.5
reference: Revelation 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀπὸ Ἰησοῦ Χριστοῦ, ὁ μάρτυς ὁ πιστός, ὁ πρωτότοκος τῶν νεκρῶν καὶ ὁ ἄρχων τῶν βασιλέων τῆς γῆς. Τῷ ἀγαπῶντι ἡμᾶς καὶ ⸀λύσαντι ἡμᾶς ⸀ἐκ τῶν ἁμαρτιῶν ἡμῶν ἐν τῷ αἵματι αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/005.yaml
  text: and from Jesus the Messiah[a], the faithful witness, the firstborn of the dead, and the ruler of the kings of the earth[b]. To him who loves us and freed us from our sins by his blood—
translation:
  language: hi
  text: और यीशु मसीह की ओर से, जो विश्वासयोग्य गवाह, मरे हुओं में से पहलौठा और पृथ्वी के राजाओं का शासक है। उसी को, जो हमसे प्रेम करता है और जिसने अपने लहू के द्वारा हमें हमारे पापों से छुड़ाया[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में ‘जिसने अपने लहू में हमें हमारे पापों से धो दिया’ पाठ मिलता है, ‘जिसने हमें हमारे पापों से छुड़ाया’ के स्थान पर।
    reason: textual_variant
lexical_decisions:
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: हिन्दी में ‘मसीह’ Χριστός के पदवीगत अर्थ को स्वाभाविक और प्रचलित ढंग से व्यक्त करता है; इसे उपनाम की तरह नहीं लिया गया।
- source_word: ὁ μάρτυς ὁ πιστός
  choice: विश्वासयोग्य गवाह
  rationale: μάρτυς यहाँ गवाही देनेवाले को दर्शाता है, अनिवार्यतः प्राण देनेवाले शहीद को नहीं; πιστός उसकी निष्ठा और भरोसेमंदी दोनों को समेटता है।
- source_word: ὁ πρωτότοκος τῶν νεκρῶν
  choice: मरे हुओं में पहलौठा
  rationale: यह अभिव्यक्ति πρωτότοκος की बाइबिलीय रूपक-शक्ति और मृतकों के बीच उसकी प्रधानता को बनाए रखती है, बिना अर्थ को व्याख्यात्मक रूप से बढ़ाए।
- source_word: ὁ ἄρχων τῶν βασιλέων τῆς γῆς
  choice: पृथ्वी के राजाओं का शासक
  rationale: ‘शासक’ अधिकार का स्पष्ट बोध कराता है और γῆ को प्रकाशितवाक्य के व्यापक परिप्रेक्ष्य में ‘पृथ्वी’ कहना उचित है।
- source_word: Τῷ ἀγαπῶντι ἡμᾶς
  choice: वह जो हमसे प्रेम करता है
  rationale: वर्तमान कृदंत निरंतर प्रेम को सूचित करता है; हिन्दी का वर्तमान काल इसे सहज रूप में व्यक्त करता है।
- source_word: λύσαντι ἡμᾶς ἐκ τῶν ἁμαρτιῶν ἡμῶν
  choice: जिसने हमें हमारे पापों से छुड़ाया
  rationale: λύω का मूल भाव खोलने, मुक्त करने या छुड़ाने का है; ‘पापों से छुड़ाया’ हिन्दी में स्वाभाविक रहते हुए मुक्ति की छवि बनाए रखता है।
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: अपने लहू के द्वारा
  rationale: ἐν यहाँ साधन का बोध देता है; ‘के द्वारा’ इस संबंध को स्पष्ट करता है और ‘लहू’ बलिदान-संबंधी बाइबिलीय भाषा को बनाए रखता है।
theological_decisions:
- issue: ‘प्रेम करता है’ के बाद आनेवाले कृदंत का पाठांतर
  choice: λύσαντι—‘छुड़ाया’
  alternative: λούσαντι—‘धोया’
  rationale: SBLGNT का पाठ λύσαντι है, इसलिए मुख्य पाठ में मुक्ति का अर्थ रखा गया है; प्रसिद्ध और अर्थपूर्ण λούσαντι पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: Χριστός का मसीही पदवी के रूप में अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός पदवी है। हिन्दी में ‘मसीह’ उसका स्थापित, अर्थवाही और सामान्यतः बोधगम्य रूप है।
- issue: πρωτότοκος τῶν νεκρῶν में संबंध का स्वरूप
  choice: मरे हुओं में पहलौठा
  alternative: मरे हुओं में से पहलौठा
  rationale: जननात्मक बहुवचन को अत्यधिक निश्चित किए बिना ‘में’ समूह-संबंध और प्रधानता दोनों के लिए स्थान देता है; ‘में से’ पुनरुत्थान से निकलने की दिशा को अधिक स्पष्ट करता, पर स्रोत की संरचना से कुछ अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘विश्वासयोग्य’, ‘पहलौठा’ और ‘लहू’ जैसे स्थापित बाइबिलीय शब्द अर्थ-सटीकता और साहित्यिक निरंतरता के लिए रखे गए हैं। पद वाक्य के अगले अंश की ओर बढ़ते हुए दीर्घ डैश पर समाप्त होता है।
