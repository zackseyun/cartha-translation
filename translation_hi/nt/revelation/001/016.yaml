id: REV.1.16
reference: Revelation 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔχων ἐν τῇ δεξιᾷ ⸂χειρὶ αὐτοῦ⸃ ἀστέρας ἑπτά, καὶ ἐκ τοῦ στόματος αὐτοῦ ῥομφαία δίστομος ὀξεῖα ἐκπορευομένη, καὶ ἡ ὄψις αὐτοῦ ὡς ὁ ἥλιος φαίνει ἐν τῇ δυνάμει αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/016.yaml
  text: And he had seven stars in his right hand[a], and from his mouth came a sharp two-edged sword[b], and his appearance was like the sun shining in its strength.
translation:
  language: hi
  text: और उसके दाहिने हाथ में सात तारे थे। उसके मुँह से एक तेज़ दोधारी तलवार निकल रही थी[a], और उसका स्वरूप ऐसा था जैसे सूर्य अपनी पूरी शक्ति से चमकता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक तेज़ तलवार जिसकी दोनों ओर धार थी।”
    reason: ‘दोधारी’ यूनानी δίστομος का मुहावरेदार अर्थ है; वैकल्पिक रूप उसी छवि को अधिक स्पष्ट करता है।
  - marker: b
    text: अधिक शाब्दिक रूप से, “अपनी शक्ति में चमकता है।” अर्थात सूर्य अपनी पूरी प्रखरता से चमक रहा है।
    reason: ἐν τῇ δυνάμει αὐτοῦ का अधिक शाब्दिक रूप कुछ अस्वाभाविक हिन्दी देता है; पादटिप्पणी मूल अभिव्यक्ति और उसके प्रसंगगत अर्थ दोनों को सुरक्षित रखती है।
lexical_decisions:
- source_word: ἔχων
  choice: थे
  rationale: सहभागी रूप को दर्शन के चलते हुए वर्णन के अनुरूप स्वाभाविक हिन्दी में सीमित क्रिया के रूप में रखा गया है।
- source_word: ἐν τῇ δεξιᾷ χειρὶ αὐτοῦ
  choice: उसके दाहिने हाथ में
  rationale: यूनानी पाठ में ‘हाथ’ स्पष्ट है; हिन्दी में भी इसे बनाए रखना स्वाभाविक और सटीक है।
- source_word: ἀστέρας ἑπτά
  choice: सात तारे
  rationale: यह सीधा और मुहावरेदार हिन्दी रूप है।
- source_word: ῥομφαία
  choice: तलवार
  rationale: यह शब्द बड़ी तलवार का बोध करा सकता है, पर यहाँ ‘तलवार’ स्पष्ट और पर्याप्त है; उसके गुण आगे के विशेषणों से व्यक्त होते हैं।
- source_word: δίστομος
  choice: दोधारी
  rationale: शाब्दिक अर्थ ‘दो मुँह वाली’ है, पर हथियार के लिए स्वाभाविक अर्थ ‘दो धार वाली’ है; ‘दोधारी’ संक्षिप्त और प्रचलित हिन्दी है।
- source_word: ὀξεῖα
  choice: तेज़
  rationale: यह तलवार की धार की तीक्ष्णता को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκπορευομένη
  choice: निकल रही थी
  rationale: वर्तमान सहभागी रूप के निरंतर दृश्यात्मक भाव को बनाए रखते हुए यह बताता है कि तलवार उसके मुँह से बाहर आ रही थी।
- source_word: ἡ ὄψις αὐτοῦ
  choice: उसका स्वरूप
  rationale: ὄψις पूरे दिखाई देने वाले रूप या दृश्य प्रभाव को सूचित कर सकता है; ‘चेहरा’ कहना अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: ὡς ὁ ἥλιος φαίνει
  choice: ऐसा था जैसे सूर्य ... चमकता है
  rationale: तुलना और चमकने की वर्तमान, सजीव छवि दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ἐν τῇ δυνάμει αὐτοῦ
  choice: अपनी पूरी शक्ति से
  rationale: सूर्य के संदर्भ में δύναμις उसकी प्रबल चमक या पूर्ण तीव्रता का बोध कराता है। ‘पूरी शक्ति से’ अर्थ को सहज हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मुँह से निकलती तलवार की प्रतीकात्मक छवि
  choice: दर्शन की प्रतीकात्मक छवि को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: इसे स्पष्ट रूप से मसीह के न्याय करने वाले वचन के रूप में समझाकर अनुवाद करना।
  rationale: पद स्वयं प्रतीक का अर्थ नहीं खोलता। अनुवाद में न्याय या परमेश्वर के वचन की व्याख्या जोड़ने से पाठ की रहस्यात्मकता और धर्मवैचारिक तनाव समय से पहले समाप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वरूप’ से दृश्य का विस्तार बना रहता है और ‘निकल रही थी’ दर्शन की गतिशीलता को व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिन्दी मसौदे में तलवार वाली टिप्पणी [a] तलवार के बाद और सूर्य की शक्ति वाली टिप्पणी [b] संबंधित वाक्यांश के बाद रखी गई है।
