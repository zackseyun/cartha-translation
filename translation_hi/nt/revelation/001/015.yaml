  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पाँव’, ‘भट्ठी’, ‘तपाया’ और ‘आवाज़’ प्रचलित शब्द हैं; ‘बहुत-से जलों’ का कुछ ऊँचा बाइबलीय मुहावरा मूल की व्यापक और जानबूझकर अनिर्दिष्ट जल-छवि को सुरक्षित रखने के लिए रखा गया है।
