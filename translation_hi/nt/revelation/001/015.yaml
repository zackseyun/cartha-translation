lexical_decisions:
- source_word: πόδες
  choice: पाँव
  rationale: πούς का सामान्य और सीधा अर्थ ‘पाँव’ है; दर्शन के शारीरिक वर्णन में यही स्वाभाविक आधुनिक हिन्दी है।
- source_word: ὅμοιοι
  choice: के समान थे
  rationale: ὅμοιος समानता व्यक्त करता है; हिन्दी में ‘के समान थे’ उपमा और निहित क्रिया दोनों को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: χαλκολιβάνῳ
  choice: दमकता काँसा
  rationale: यह एक अत्यंत दुर्लभ धातु-संबंधी शब्द है, जिसका ठीक अभिप्राय अनिश्चित है। ‘दमकता काँसा’ किसी निश्चित मिश्रधातु का अनावश्यक दावा किए बिना चमकीली, तपाई हुई धातु की छवि व्यक्त करता है।
- source_word: ὡς ἐν καμίνῳ πεπυρωμένης
  choice: जो मानो भट्ठी में तपाया गया हो
  rationale: κάμινος धातु तपाने की भट्ठी को और πυρόομαι आग में तपने, दहकने या शुद्ध किए जाने को व्यक्त कर सकता है। ‘मानो’ ὡς की तुलनात्मक शक्ति बनाए रखता है, जबकि ‘तपाया गया’ आग और धातु दोनों की छवि को समेटता है।
- source_word: φωνή
  choice: आवाज़
  rationale: पहला φωνή उस व्यक्ति की अपनी आवाज़ को बताता है; ‘आवाज़’ आधुनिक हिन्दी में स्वाभाविक और निजी स्वर का स्पष्ट सूचक है।
- source_word: ὡς φωνὴ ὑδάτων πολλῶν
  choice: बहुत-से जलों की ध्वनि के समान
  rationale: दूसरे φωνή के लिए ‘ध्वनि’ श्रव्य तुलना को स्पष्ट करता है। ‘बहुत-से जलों’ को बनाए रखने से बाइबलीय बहुवचन छवि सुरक्षित रहती है और इसे समुद्र, झरनों या लहरों जैसे किसी एक दृश्य तक सीमित नहीं किया जाता।
theological_decisions:
- issue: अंतिम उपमा में दोहराए गए φωνή का अनुवाद
  choice: उसकी आवाज़ बहुत-से जलों की ध्वनि के समान थी
  alternative: उसकी आवाज़ बहुत-से जलों की आवाज़ के समान थी
  rationale: ‘आवाज़ … ध्वनि’ आधुनिक हिन्दी में पुनरुक्ति घटाते हुए महिमा और प्रचंडता की श्रव्य छवि बनाए रखता है। अधिक शब्दशः विकल्प को पाद-टिप्पणी में रखा गया है, ताकि मूल की पुनरावृत्ति छिपे नहीं।
- issue: χαλκολίβανον की अनिश्चित धात्विक पहचान
  choice: दमकता काँसा
  alternative: उत्तम पीतल / चमकाया हुआ काँसा / कोई चमकीली मिश्रधातु
  rationale: यह पद मसीह की दीप्तिमान और प्रभावशाली दर्शनीय छवि प्रस्तुत करता है, पर दुर्लभ यूनानी शब्द किसी निश्चित धातु की पहचान सुनिश्चित नहीं करता। इसलिए मुख्य पाठ पठनीय छवि देता है और अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
