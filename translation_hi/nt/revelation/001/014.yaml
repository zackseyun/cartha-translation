  text: ἡ δὲ κεφαλὴ αὐτοῦ καὶ αἱ τρίχες λευκαὶ ὡς ἔριον λευκόν, ὡς χιών, καὶ οἱ ὀφθαλμοὶ αὐτοῦ ὡς φλὸξ πυρός,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/014.yaml
  text: His head and hair were white[a], like white wool, like snow, and his eyes were like a flame of fire[b],
translation:
  language: hi
  text: उसका सिर और उसके बाल सफ़ेद थे[a]—सफ़ेद ऊन के समान, बर्फ़ के समान—और उसकी आँखें आग की ज्वाला जैसी थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका सिर और उसके बाल सफ़ेद ऊन और बर्फ़ के समान सफ़ेद थे।”
    reason: यूनानी वाक्य-विन्यास में ‘सफ़ेद’ को सिर और बाल दोनों के साथ समझने तथा उपमाओं से जोड़ने की गुंजाइश स्पष्ट करने के लिए।
  - marker: b
    text: यह चित्र दानिय्येल 7:9 की प्रतिध्वनि है और इस वर्णन के दर्शनात्मक स्वरूप पर बल देता है।
    reason: पाठ की प्रमुख पुराना नियम-संबंधी प्रतिध्वनि बताने के लिए।
lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: यह हल्का संयोजक वर्णन को आगे बढ़ाता है; हिन्दी में वाक्य का प्रवाह इसकी भूमिका स्वाभाविक रूप से निभाता है, इसलिए कृत्रिम ‘अब’ नहीं जोड़ा गया।
- source_word: κεφαλὴ
  choice: सिर
  rationale: दृष्टि-वर्णन में प्रयुक्त सामान्य शारीरिक शब्द का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τρίχες
  choice: बाल
  rationale: बहुवचन अर्थ को हिन्दी के स्वाभाविक सामूहिक संज्ञा-रूप ‘बाल’ से व्यक्त किया गया।
- source_word: λευκαὶ
  choice: सफ़ेद
  rationale: मूल रंग-सूचक अर्थ को बिना ‘चमकीले’ जैसी व्याख्यात्मक वृद्धि के सुरक्षित रखा गया।
- source_word: ὡς ἔριον λευκόν
  choice: सफ़ेद ऊन जैसे
  rationale: विशेषण λευκόν का ἔριον से संबंध स्पष्ट रखते हुए उपमा को स्वाभाविक हिन्दी में व्यक्त किया गया।
- source_word: ὡς χιών
  choice: बर्फ़ जैसे
  rationale: श्वेतता की दूसरी संचयी उपमा को ज्यों का त्यों बनाए रखा गया।
- source_word: ὀφθαλμοὶ
  choice: आँखें
  rationale: सामान्य और सहज हिन्दी शारीरिक शब्द।
- source_word: ὡς φλὸξ πυρός
  choice: आग की ज्वाला जैसी
  rationale: यूनानी संबंध-वाचक रचना और प्रकाशितवाक्य की सजीव छवि दोनों को निकटता से बनाए रखता है।
theological_decisions:
- issue: महिमित मनुष्य के पुत्र का प्रतीकात्मक वर्णन
  choice: उपमाओं को मुख्य पाठ में बिना व्याख्यात्मक विस्तार के यथावत रखा गया।
  alternative: ‘पवित्रता’, ‘अनन्तता’ या ‘न्याय’ जैसे प्रतीकात्मक अर्थों को अनुवाद में स्पष्ट रूप से जोड़ना।
  rationale: पद स्वयं दर्शनात्मक चित्र प्रस्तुत करता है, उसका धर्मवैचारिक अर्थ यहाँ सीधे नहीं समझाता; इसलिए अस्पष्टता और प्रतीकात्मक तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और दर्शनात्मक रजिस्टर रखा गया है। ‘सफ़ेद’, ‘ऊन’, ‘बर्फ़’ और ‘आग की ज्वाला’ सामान्य पाठकों के लिए स्पष्ट हैं; डैश संचयी उपमाओं को पठनीय बनाते हैं।
