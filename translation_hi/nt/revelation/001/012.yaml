lexical_decisions:
- source_word: ἐπέστρεψα
  choice: मैं मुड़ा
  rationale: क्रिया यहाँ शरीर को दूसरी ओर मोड़ने के भौतिक अर्थ में है। ‘मैं मुड़ा’ सहज और मूल के अनुरूप है; ‘मैं पीछे मुड़ा’ अनावश्यक रूप से दिशा जोड़ता।
- source_word: βλέπειν
  choice: देखने के लिए
  rationale: यह पूरक क्रियारूप मुड़ने का उद्देश्य बताता है। हिन्दी में ‘देखने के लिए’ स्वाभाविक है और आवाज़ के स्रोत की ओर देखने का आशय संदर्भ से स्पष्ट रहता है।
- source_word: φωνὴν
  choice: आवाज़
  rationale: बोलने के संदर्भ में φωνή का अर्थ ‘आवाज़’ है। हिन्दी में ‘वाणी’ की अपेक्षा ‘आवाज़’ अधिक सामान्य और ठोस है।
- source_word: ἐλάλει μετ’ ἐμοῦ
  choice: मेरे साथ बोल रही थी
  rationale: अपूर्ण काल जारी क्रिया को व्यक्त करता है, इसलिए ‘बोल रही थी’। μετά सहित वाक्यांश का निकट रूप ‘मेरे साथ’ है; बोलने का कर्ता आवाज़ होने के कारण स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: ἐπιστρέψας
  choice: मुड़ने पर
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया और समयक्रम दिखाता है। ‘मुड़ने पर’ संक्षिप्त, प्रवाहपूर्ण और सटीक है।
- source_word: εἶδον
  choice: मैंने ... देखे
  rationale: साधारण भूतकालीन दृष्टि-क्रिया को हिन्दी में सकर्मक पूर्ण रूप से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἑπτὰ λυχνίας χρυσᾶς
  choice: सोने के सात दीपदान
  rationale: λυχνία दीप नहीं बल्कि दीप रखने का आधार है, इसलिए ‘दीपदान’। χρυσᾶς सामग्री सूचित कर सकता है; ‘सोने के’ हिन्दी में ‘सुनहरे’ की अपेक्षा वास्तविक पदार्थ का अर्थ अधिक स्पष्ट रखता है।
theological_decisions:
- issue: प्रकाशितवाक्य के प्रतीकात्मक संदर्भ में λυχνίας का अनुवाद
  choice: दीपदान
  alternative: दीप / दीवट
  rationale: वस्तु को ठोस और दीप से अलग रखना आवश्यक है, क्योंकि 1:20 में इन्हीं सात दीपदानों की प्रतीकात्मक पहचान दी जाती है। ‘दीप’ इस भेद को मिटा देता; ‘दीवट’ सही होते हुए भी आधुनिक सामान्य हिन्दी में कम प्रचलित है।
- issue: ‘आवाज़ को देखने’ की असामान्य अभिव्यक्ति
  choice: 'मूल रूपक को बनाए रखा गया: ‘आवाज़ ... उसे देखने के लिए’'
  alternative: आवाज़ के स्रोत को देखने के लिए
  rationale: यूनानी पाठ जानबूझकर ‘आवाज़ को देखने’ कहता है। ‘स्रोत’ जोड़ना अर्थ को सहज बनाता, पर मूल की प्रभावशाली असामान्यता को चुपचाप स्पष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘आवाज़ को देखने’ की मूल असामान्यता सुरक्षित रखी गई है। ‘दीपदान’ सामान्य पाठक के लिए समझने योग्य है और आगे की प्रतीकात्मक व्याख्या में शब्द-संगति बनाए रखता है।
