id: REV.1.9
reference: Revelation 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγὼ Ἰωάννης, ὁ ἀδελφὸς ὑμῶν καὶ ⸀συγκοινωνὸς ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ ⸀ἐν Ἰησοῦ, ἐγενόμην ἐν τῇ νήσῳ τῇ καλουμένῃ Πάτμῳ διὰ τὸν λόγον τοῦ θεοῦ ⸀καὶ τὴν μαρτυρίαν ⸀Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/009.yaml
  text: I[a], John, your brother and fellow participant in the tribulation and kingdom and endurance in Jesus, was on the island called Patmos because of the word of God and the testimony of Jesus.
translation:
  language: hi
  text: मैं, यूहन्ना, तुम्हारा भाई और यीशु में क्लेश, राज्य और धीरज में तुम्हारा सहभागी, परमेश्वर के वचन और यीशु की गवाही[a] के कारण पतमुस कहलाने वाले द्वीप पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के विषय में गवाही।” यूनानी सम्बन्धकारक का अर्थ यीशु द्वारा दी गई गवाही या यीशु के विषय में दी गई गवाही—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: συγκοινωνός
  choice: सहभागी
  rationale: यह शब्द किसी बात में साझा भागीदारी को व्यक्त करता है। ‘सहभागी’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा यूहन्ना की अपने पाठकों के साथ साझी स्थिति को स्पष्ट करता है।
- source_word: ἐν τῇ θλίψει καὶ βασιλείᾳ καὶ ὑπομονῇ
  choice: क्लेश, राज्य और धीरज में
  rationale: तीनों संज्ञाओं को समान रूप से भागीदारी के क्षेत्र के रूप में रखा गया है। ‘क्लेश’ प्रकाशन-साहित्य के गंभीर संदर्भ को बनाए रखता है और ‘धीरज’ ὑπομονή की स्थिर सहनशीलता को संक्षेप में व्यक्त करता है।
- source_word: ἐν Ἰησοῦ
  choice: यीशु में
  rationale: यह संक्षिप्त वाक्यांश पहले आए तीनों तत्वों को यीशु से संबंधित क्षेत्र में रखता है। विस्तार करके अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἐγενόμην ἐν τῇ νήσῳ
  choice: द्वीप पर था
  rationale: यहाँ γίνομαι स्थान में होने को मुहावरेदार ढंग से व्यक्त करता है। ‘था’ आगमन के किसी ऐसे ढंग का संकेत नहीं देता जिसका मूल पाठ में उल्लेख नहीं है।
- source_word: τῇ καλουμένῃ Πάτμῳ
  choice: पतमुस कहलाने वाले
  rationale: यह καλουμένῃ का स्वाभाविक हिन्दी रूप है और द्वीप के नाम को स्पष्ट रूप से प्रस्तुत करता है।
- source_word: διὰ τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन ... के कारण
  rationale: कर्ता कारक के साथ διά यहाँ कारण बताता है। ‘के कारण’ यह खुला रखता है कि संबंध प्रचार, निष्ठा या उससे उत्पन्न सताव से था।
- source_word: τὴν μαρτυρίαν Ἰησοῦ
  choice: यीशु की गवाही
  rationale: 'सम्बन्धकारक Ἰησοῦ की वास्तविक अस्पष्टता को हिन्दी का ‘यीशु की गवाही’ बनाए रख सकता है: यह यीशु द्वारा दी गई अथवा यीशु के विषय में दी गई गवाही हो सकती है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।'
- source_word: ἀδελφὸς ὑμῶν
  choice: तुम्हारा भाई
  rationale: यूहन्ना अपने पाठकों के साथ पारिवारिक आत्मीयता और एकजुटता व्यक्त करता है। एकवचन आत्म-संदर्भ होने के कारण ‘तुम्हारा भाई’ सीधा और स्वाभाविक है।
theological_decisions:
- issue: μαρτυρίαν Ἰησοῦ में सम्बन्धकारक की अस्पष्टता
  choice: मुख्य पाठ में ‘यीशु की गवाही’
  alternative: ‘यीशु के विषय में गवाही’
  rationale: यूनानी पदबंध यह निश्चित नहीं करता कि गवाही यीशु द्वारा दी गई है या यीशु के विषय में है। मुख्य पाठ में स्वाभाविक रूप से अस्पष्ट अभिव्यक्ति रखी गई है और दूसरा संभव अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कलीसियाई पाठ के अनुकूल शैली। ‘क्लेश’, ‘राज्य’, ‘धीरज’ और ‘गवाही’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर वाक्य-विन्यास को आधुनिक पाठक के लिए स्वाभाविक बनाया गया है।
