id: REV.1.8
reference: Revelation 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγώ εἰμι τὸ Ἄλφα καὶ τὸ Ὦ, λέγει κύριος, ὁ θεός, ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος, ὁ παντοκράτωρ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/008.yaml
  text: “I am the Alpha and the Omega,” says the Lord God[a], “the one who is and who was and who is coming, the Almighty.”
translation:
  language: hi
  text: “मैं अल्फ़ा और ओमेगा हूँ,” प्रभु परमेश्वर कहते हैं, “जो है, जो था और जो आ रहा है[a]—सर्वशक्तिमान।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो है, जो था और जो आनेवाला है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: मैं ... हूँ
  rationale: बलयुक्त सर्वनाम और क्रिया को स्वाभाविक हिन्दी आत्म-घोषणा में व्यक्त करता है; अलग से ‘मैं ही’ जोड़ना यहाँ अनावश्यक रूप से विशिष्टता बढ़ा सकता है।
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: अल्फ़ा और ओमेगा
  rationale: यूनानी अक्षरों के नाम बनाए रखता है, जिससे उनका प्रतीकात्मक और प्रलय-साहित्यिक अर्थ सुरक्षित रहता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: वर्तमानकालीन उद्धरण-सूत्र का सहज, सम्मानसूचक हिन्दी रूप।
- source_word: κύριος, ὁ θεός
  choice: प्रभु परमेश्वर
  rationale: दोनों संलग्न ईश्वरीय उपाधियों को प्रचलित और गरिमापूर्ण बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: ὁ ὢν καὶ ὁ ἦν καὶ ὁ ἐρχόμενος
  choice: जो है, जो था और जो आ रहा है
  rationale: त्रिपदीय संरचना बनाए रखता है और वर्तमान कृदंत ἐρχόμενος की गतिशीलता को ‘आ रहा है’ से सीधे व्यक्त करता है।
- source_word: ὁ παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: दैवी सामर्थ्य और सार्वभौम प्रभुता के लिए हिन्दी में स्थापित, स्वाभाविक और गरिमापूर्ण पद।
theological_decisions:
- issue: परमेश्वर के शाश्वत अस्तित्व और भावी आगमन से जुड़ी आत्म-पहचान
  choice: जो है, जो था और जो आ रहा है
  alternative: जो है, जो था और जो आनेवाला है
  rationale: ‘आ रहा है’ यूनानी वर्तमान कृदंत की सक्रिय, जारी आगमन-भावना को अधिक सीधे सुरक्षित रखता है। ‘आनेवाला है’ भी वैध और परिचित अर्थ है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठकों के लिए सहज, परन्तु ईश्वरीय आत्म-घोषणा के अनुरूप गंभीर और गरिमापूर्ण। ‘अल्फ़ा और ओमेगा’ को लिप्यंतरित रूप में रखा गया है।
