source:
  edition: SBLGNT
  text: καὶ ἐν μέσῳ ⸀τῶν λυχνιῶν ὅμοιον ⸀υἱὸν ἀνθρώπου, ἐνδεδυμένον ποδήρη καὶ περιεζωσμένον πρὸς τοῖς μαστοῖς ζώνην χρυσᾶν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/013.yaml
  text: and in the midst of the lampstands[a], one like a son of man, clothed in a robe reaching to the feet and girded across the chest with a golden sash.
translation:
  language: hi
  text: और दीपदानों के बीच मनुष्य-पुत्र के समान एक व्यक्ति था[a], जो पैरों तक का वस्त्र पहने हुए था और छाती पर स्वर्णिम पटुका बाँधे हुए था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के पुत्र के समान कोई,” जहाँ “मनुष्य का पुत्र” को एक निश्चित उपाधि के रूप में समझा जाता है। यूनानी पदबंध दानिय्येल 7:13 की प्रतिध्वनि करता है और यहाँ महिमान्वित यीशु पर लागू होता है।
    reason: वैकल्पिक निश्चित-उपाधिपरक समझ और दानिय्येल 7:13 के संकेत को स्पष्ट करना।
lexical_decisions:
- source_word: ἐν μέσῳ
  choice: के बीच
  rationale: यह स्थान-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और दर्शाता है कि वह आकृति दीपदानों के मध्य उपस्थित थी।
- source_word: λυχνιῶν
  choice: दीपदानों
  rationale: λυχνία दीप रखने के आधार या दीपदान को दर्शाता है, स्वयं दीप को नहीं; प्रकाशितवाक्य के निकटवर्ती प्रतीक-विवरण में यह भेद महत्त्वपूर्ण है।
- source_word: ὅμοιον υἱὸν ἀνθρώπου
  choice: मनुष्य के पुत्र के समान कोई
  rationale: यह दानिय्येल 7:13 की प्रतिध्वनि बनाए रखता है, पर यूनानी में पदबंध के आगे निश्चित उपपद न होने के कारण इसे मुख्य पाठ में स्पष्ट रूप से स्थिर उपाधि नहीं बनाता। हिन्दी में ‘कोई’ ὅμοιον के नपुंसकलिंगी रूप से निहित ‘कोई/एक आकृति’ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐνδεδυμένον
  choice: पहने हुए था
  rationale: पूर्ण कृदन्त से व्यक्त स्थायी दृश्य-अवस्था—आकृति का उस वस्त्र में सुसज्जित दिखाई देना—को सहज हिन्दी में व्यक्त करता है।
- source_word: ποδήρη
  choice: पैरों तक पहुँचने वाला वस्त्र
  rationale: यह शब्दशः पैरों तक पहुँचने वाले परिधान का बोध देता है; यह अनुवाद किसी विशेष पुरोहितीय या राजकीय पोशाक को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: περιεζωσμένον
  choice: बाँधे हुए था
  rationale: कमरबंद या पटुका लपेटकर बाँधने की वस्त्र-छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρὸς τοῖς μαστοῖς
  choice: छाती पर
  rationale: यह पटुके की ऊँची स्थिति को स्पष्ट और सहज हिन्दी में बताता है, बिना अस्वाभाविक शारीरिक अभिव्यक्ति के।
- source_word: ζώνην χρυσᾶν
  choice: सोने का पटुका
  rationale: ζώνη के चौड़े बंध या कमरपट्टे के अर्थ को ‘पटुका’ गरिमापूर्ण ढंग से व्यक्त करता है और छाती पर बाँधे जाने के वर्णन से मेल खाता है।
theological_decisions:
- issue: ὅμοιον υἱὸν ἀνθρώπου का मसीह-संबंधी बल
  choice: मुख्य पाठ में ‘मनुष्य के पुत्र के समान कोई’ रखा गया है।
  alternative: ‘मनुष्य के पुत्र’ के समान कोई, जहाँ ‘मनुष्य का पुत्र’ एक निश्चित मसीह-संबंधी उपाधि के रूप में समझा जाए।
  rationale: यह यूनानी की अनिश्चित व्याकरणिक बनावट और दानिय्येल 7:13 की स्पष्ट प्रतिध्वनि, दोनों को सुरक्षित रखता है। साथ ही पादटिप्पणी बताती है कि दर्शन में यह वाक्यांश महिमान्वित यीशु पर लागू है, पर मुख्य पाठ में उपाधि का अर्थ जबरन निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और दर्शन-वर्णन के अनुरूप रखी गई है। ‘दीपदान’, ‘पटुका’ और ‘मनुष्य के पुत्र के समान’ जैसे पद बाइबलीय प्रतीकात्मकता बनाए रखते हुए सामान्य पाठक के लिए समझने योग्य हैं।
