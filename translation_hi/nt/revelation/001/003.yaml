id: REV.1.3
reference: Revelation 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μακάριος ὁ ἀναγινώσκων καὶ οἱ ἀκούοντες τοὺς λόγους τῆς προφητείας καὶ τηροῦντες τὰ ἐν αὐτῇ γεγραμμένα, ὁ γὰρ καιρὸς ἐγγύς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/003.yaml
  text: Blessed is the one who reads aloud[a], and those who hear the words of this prophecy and keep what is written in it[b], for the time is near.
translation:
  language: hi
  text: धन्य है वह जो इस भविष्यवाणी के वचनों को पढ़कर सुनाता है[a], और धन्य हैं वे जो इन वचनों को सुनते और उसमें लिखी बातों का पालन करते हैं, क्योंकि समय निकट है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पढ़ता है”; यूनानी में सम्भवतः सभा के सामने सार्वजनिक रूप से पढ़ने वाले व्यक्ति का संकेत है, इसलिए मुख्य पाठ में “पढ़कर सुनाता है” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या “नियत समय निकट है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह नए नियम की आशीर्वचन-शैली और परमेश्वर की कृपा में मिली स्थिति को व्यक्त करता है; केवल भावनात्मक प्रसन्नता तक अर्थ को सीमित नहीं करता।
- source_word: ὁ ἀναγινώσκων
  choice: वह जो ... ऊँचे स्वर में पढ़ता है
  rationale: एकवचन पाठक और बहुवचन श्रोताओं का मेल सभा में सार्वजनिक पाठ की ओर संकेत करता है। ‘ऊँचे स्वर में’ संभावित मौखिक संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οἱ ἀκούοντες
  choice: वे जो उन्हें सुनते
  rationale: ‘सुनते’ बोले गए पाठ को ग्रहण करने का सीधा अर्थ रखता है और सार्वजनिक वाचन के संदर्भ से स्वाभाविक रूप से जुड़ता है।
- source_word: τοὺς λόγους τῆς προφητείας
  choice: इस भविष्यवाणी के वचनों
  rationale: λόγους का ठोस बहुवचन ‘वचनों’ से सुरक्षित रहता है; ‘इस’ वर्तमान पुस्तक में दी गई भविष्यवाणी की संदर्भगत पहचान स्पष्ट करता है।
- source_word: τηροῦντες
  choice: पालन करते हैं
  rationale: यह लिखी बातों को विश्वासपूर्वक मानने और उनके अनुसार चलने का भाव स्वाभाविक आधुनिक हिन्दी में देता है; मात्र सुरक्षित रखने का भौतिक अर्थ नहीं देता।
- source_word: τὰ ἐν αὐτῇ γεγραμμένα
  choice: उसमें लिखी बातों
  rationale: नपुंसकलिंग बहुवचन का सहज हिन्दी रूप है। ‘उसमें’ का संदर्भ निकटतम स्त्रीलिंग संज्ञा ‘भविष्यवाणी’ से है।
- source_word: ὁ γὰρ καιρὸς
  choice: क्योंकि समय
  rationale: καιρός निर्णायक अथवा नियत समय का अर्थ रख सकता है, पर ‘समय’ उस संभावित अर्थ को बिना अनावश्यक व्याख्यात्मक संकीर्णता के खुला रखता है।
- source_word: ἐγγύς
  choice: निकट है
  rationale: यह आधुनिक, स्पष्ट हिन्दी है और मूल में व्यक्त कालगत निकटता को बिना किसी विशेष अंत-कालीन योजना को आरोपित किए सुरक्षित रखता है।
theological_decisions:
- issue: एकवचन पाठक और बहुवचन श्रोताओं से संकेतित सार्वजनिक वाचन
  choice: ‘ऊँचे स्वर में पढ़ता है’ द्वारा संभावित सभागत सार्वजनिक पाठ को स्पष्ट करना
  alternative: केवल ‘पढ़ता है’, बिना मौखिक वाचन को स्पष्ट किए
  rationale: व्याकरणिक संरचना एक पाठक और अनेक सुनने वालों को अलग करती है, इसलिए सार्वजनिक वाचन प्रबल संभावना है; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: μακάριος का एकवचन रूप और सुनने तथा पालन करने वालों का संयुक्त बहुवचन समूह
  choice: हिन्दी की स्वाभाविकता हेतु ‘धन्य हैं’ को दूसरे समूह के सामने दोहराना
  alternative: एक ही ‘धन्य है’ को असंगत संख्या के साथ दोनों समूहों पर लागू करना
  rationale: यूनानी में विधेय विशेषण आरम्भ में एकवचन है, फिर बहुवचन सहभागी आते हैं। हिन्दी में संख्या-सामंजस्य हेतु दोहराव आवश्यक है और दोनों समूहों पर एक ही आशीष लागू रहने देता है।
- issue: καιρός ἐγγύς का अंत-काल संबंधी बल
  choice: ‘समय निकट है’
  alternative: ‘नियत समय निकट है’
  rationale: मूल पाठ निकटता घोषित करता है, पर पूर्ति की समय-सारणी या विशिष्ट अंत-कालीन व्यवस्था नहीं बताता। सरल अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘भविष्यवाणी’, ‘वचन’, ‘धन्य’ और ‘पालन’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। सार्वजनिक वाचन की सम्भावना मुख्य पाठ में व्यक्त है, जबकि अधिक सामान्य विकल्प पादटिप्पणी में सुरक्षित है।
