  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘प्रभु’, ‘आत्मा’, ‘तुरही’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। हिन्दी में ‘प्रभु के दिन’ साप्ताहिक और अन्तकालीन दोनों अर्थों में सुनाई दे सकता है, इसलिए मूल यूनानी की संरचनात्मक भिन्नता पादटिप्पणी में दी गई है।
