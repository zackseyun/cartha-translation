  text: ἐγενόμην ἐν πνεύματι ἐν τῇ κυριακῇ ἡμέρᾳ, καὶ ἤκουσα ⸂ὀπίσω μου φωνὴν⸃ μεγάλην ὡς σάλπιγγος
base_translation:
  language: en
  yaml_path: translation/nt/revelation/001/010.yaml
  text: I came to be in the Spirit on the Lord’s day[a], and I heard behind me a loud voice like a trumpet[b],
translation:
  language: hi
  text: प्रभु के दिन[a] मैं आत्मा में था[b], और मैंने अपने पीछे तुरही जैसी एक ज़ोरदार आवाज़ सुनी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, कम सम्भावना से, “प्रभु का दिन” अन्तकालीन अर्थ में। यहाँ यूनानी में κυριακῇ ἡμέρᾳ, अर्थात् “प्रभु का दिन/प्रभु से संबंधित दिन,” है; यह अन्तकालीन “प्रभु के दिन” के लिए प्रयुक्त अधिक सामान्य यूनानी अभिव्यक्ति नहीं है।
    reason: alternative_reading
  - marker: b
    text: या, “आत्मिक रूप से।” यह पदबंध पवित्र आत्मा के भविष्यदर्शी प्रभाव में होने का संकेत दे सकता है; पाठ स्पष्ट रूप से यह नहीं कहता कि यूहन्ना समाधि में था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγενόμην
  choice: मैं ... था
  rationale: हिन्दी में अवस्था में आने के भाव को अक्षरशः ‘मैं हो गया’ कहना यहाँ अस्वाभाविक और भ्रामक हो सकता है। ‘मैं आत्मा में था’ वर्तमान, सहज हिन्दी में उस अवस्था को व्यक्त करता है, जबकि पादटिप्पणी वाक्यांश की सम्भावित अर्थ-सीमा स्पष्ट करती है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: यह यूनानी पूर्वसर्गीय पदबंध को निकटता से रखता है और प्रकाशितवाक्य के भविष्यदर्शी संदर्भ में पवित्र आत्मा की सम्भावित ओर संकेत करता है, पर ‘समाधि’ जैसी अधिक व्याख्यात्मक भाषा नहीं जोड़ता।
- source_word: ἐν τῇ κυριακῇ ἡμέρᾳ
  choice: प्रभु के दिन
  rationale: κυριακός का अर्थ ‘प्रभु से संबंधित/प्रभु का’ है। हिन्दी का ‘प्रभु के दिन’ स्वाभाविक है, यद्यपि यह अन्तकालीन ‘प्रभु के दिन’ जैसा भी सुनाई दे सकता है; इसलिए मूल यूनानी की भिन्न रचना को पादटिप्पणी में बताया गया है।
- source_word: ἤκουσα
  choice: मैंने ... सुनी
  rationale: यह साधारण श्रवण-बोध को व्यक्त करता है; मूल पाठ ध्यान लगाकर सुनने की अतिरिक्त धारणा नहीं देता।
- source_word: ὀπίσω μου
  choice: अपने पीछे
  rationale: यहाँ स्थानवाचक अर्थ प्रसंग के अनुकूल है और हिन्दी में सहज है।
- source_word: φωνὴν μεγάλην
  choice: एक ऊँची आवाज़
  rationale: φωνή के साथ μεγάλη यहाँ आवाज़ की प्रबलता या ऊँचाई बताता है। ‘ऊँची आवाज़’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὡς σάλπιγγος
  choice: तुरही जैसी
  rationale: यह आवाज़ की तुलना तुरही से करता है। ‘तुरही की ध्वनि जैसी’ स्पष्टतर होता, पर मूल में अलग से ‘ध्वनि’ या ‘नाद’ शब्द नहीं है।
theological_decisions:
- issue: ἐν πνεύματι को पवित्र आत्मा के प्रभाव, मनुष्य की आत्मिक अवस्था, या समाधि के रूप में समझना
  choice: आत्मा में
  alternative: आत्मिक अवस्था में; समाधि में
  rationale: प्रकाशितवाक्य के दर्शनीय सूत्रों में पवित्र आत्मा का संदर्भ सम्भावित है, इसलिए ‘आत्मा’ रखा गया है; पर यूनानी पाठ स्पष्टतः ‘समाधि’ नहीं कहता। पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: κυριακῇ ἡμέρᾳ साप्ताहिक प्रभु-दिवस है या अन्तकालीन प्रभु का दिन
  choice: प्रभु के दिन
  alternative: प्रभु के आने के दिन; प्रभु-दिवस पर
  rationale: विशेषण κυριακός का सीधा भाव ‘प्रभु का/प्रभु से संबंधित’ है। मुख्य पाठ उससे आगे दिन की पहचान निश्चित नहीं करता; पादटिप्पणी बताती है कि अन्तकालीन ‘प्रभु का दिन’ के लिए प्रयुक्त सामान्य यूनानी अभिव्यक्ति इससे भिन्न है।
