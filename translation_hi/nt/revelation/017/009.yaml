source:
  edition: SBLGNT
  text: Ὧδε ὁ νοῦς ὁ ἔχων σοφίαν. αἱ ἑπτὰ κεφαλαὶ ἑπτὰ ὄρη εἰσίν, ὅπου ἡ γυνὴ κάθηται ἐπ’ αὐτῶν. καὶ βασιλεῖς ⸂ἑπτά εἰσιν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/009.yaml
  text: 'Here is the mind that has wisdom: the seven heads are seven mountains on which the woman sits[a], and they are seven kings.'
translation:
  language: hi
  text: 'यहाँ वह बुद्धि है जिसमें ज्ञान है: वे सात सिर सात पहाड़ हैं, जिन पर वह स्त्री बैठी है[a], और वे सात राजा हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सात पहाड़ियाँ।’ यूनानी शब्द पहाड़ों या पहाड़ियों के लिए प्रयुक्त हो सकता है; ‘पहाड़’ अधिक सीधा अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὧδε
  choice: यहाँ ... आवश्यकता है
  rationale: यह व्याख्यात्मक उद्घोषणा का संकेत देता है। हिन्दी में आगे आने वाले वाक्यांश के साथ यह रूप स्वाभाविक है और पाठक से विवेक की अपेक्षा व्यक्त करता है।
- source_word: ὁ νοῦς ὁ ἔχων σοφίαν
  choice: उस बुद्धि ... जिसमें ज्ञान हो
  rationale: νοῦς को ‘बुद्धि’ और σοφία को ‘ज्ञान’ देकर दोनों पदों का भेद यथासंभव रखा गया है; पूरा वाक्यांश प्रतीकों को समझने के लिए अपेक्षित विवेक को दर्शाता है।
- source_word: αἱ ἑπτὰ κεφαλαὶ
  choice: वे सात सिर
  rationale: प्रतीकात्मक शब्द को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है।
- source_word: ἑπτὰ ὄρη
  choice: सात पहाड़
  rationale: ὄρη का सीधा और सामान्य हिन्दी रूप ‘पहाड़’ है। यह किसी विशेष नगर के ‘सात टीलों’ की व्याख्या को मुख्य पाठ में नहीं थोपता।
- source_word: ὅπου ... κάθηται ἐπ’ αὐτῶν
  choice: जिन पर ... बैठी है
  rationale: यूनानी की स्थानवाचक अभिव्यक्ति और ἐπί के अर्थ को स्वाभाविक हिन्दी संबंधवाचक रचना में व्यक्त किया गया है, बिना असहज पुनरुक्ति के।
- source_word: ἡ γυνὴ
  choice: वह स्त्री
  rationale: पहले से वर्णित प्रतीकात्मक पात्र को निश्चित रूप में बनाए रखता है।
- source_word: καὶ βασιλεῖς ἑπτά εἰσιν
  choice: और वे सात राजा हैं
  rationale: निहित कर्ता को ‘वे’ से स्पष्ट करके सात सिरों की राजाओं से दूसरी प्रतीकात्मक पहचान सुरक्षित रखी गई है।
theological_decisions:
- issue: सात सिरों की प्रतीकात्मक पहचान
  choice: सात सिरों को सात पहाड़ और सात राजा कहा गया है, पर उनके ऐतिहासिक संदर्भ की पहचान खुली रखी गई है।
  alternative: ‘सात पहाड़’ को रोम के सात टीलों तथा ‘सात राजाओं’ को विशिष्ट सम्राटों या राज्यों के रूप में स्पष्ट करना।
  rationale: पद स्वयं प्रतीकात्मक समानताएँ बताता है, पर यह निश्चित नहीं करता कि उनका ऐतिहासिक संकेत केवल रोम, सम्राटों, राज्यों या किसी व्यापक प्रकाशनात्मक योजना की ओर है। अनुवाद इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘यहाँ उस बुद्धि की आवश्यकता है’ शाब्दिक यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘जिसमें ज्ञान हो’ मूल की आंतरिक संरचना को बनाए रखता है।
