id: REV.17.16
reference: Revelation 17:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες καὶ τὸ θηρίον, οὗτοι μισήσουσι τὴν πόρνην, καὶ ἠρημωμένην ποιήσουσιν αὐτὴν καὶ ⸀γυμνήν, καὶ τὰς σάρκας αὐτῆς φάγονται, καὶ αὐτὴν κατακαύσουσιν ἐν πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/016.yaml
  text: And the ten horns that you saw[a], and the beast—these will hate the prostitute, and they will make her desolate and naked, and they will eat her flesh[b], and they will burn her up with fire.
translation:
  language: hi
  text: और वे दस सींग जो तुमने देखे, और वह पशु—ये वेश्या से घृणा करेंगे। वे उसे उजाड़ देंगे और नंगी[a] कर देंगे, उसका मांस[b] खा जाएँगे, और उसे आग में पूरी तरह जला देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूरी तरह निर्वस्त्र।” यूनानी शब्द का सीधा अर्थ “नंगी” है; यहाँ सार्वजनिक अपमान और सबके सामने अनावृत कर दिए जाने का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “मांस” मूल पाठ का शाब्दिक शब्द है। प्रकाशन-साहित्य के इस प्रतीकात्मक दृश्य में यह अभिव्यक्ति पूर्ण और हिंसक विनाश को चित्रित करती है।
    reason: cultural_note
lexical_decisions:
- source_word: κέρατα
  choice: सींग
  rationale: मूल यूनानी में व्याख्या के बजाय प्रकाशन-साहित्य का प्रतीक स्वयं प्रयुक्त है; इसलिए प्रतीकात्मक बिंब को अक्षुण्ण रखा गया है।
- source_word: θηρίον
  choice: पशु
  rationale: यह θηρίον का स्वाभाविक और प्रचलित हिन्दी बाइबलीय प्रतिशब्द है तथा उसके भयावह प्रतीकात्मक बल को बनाए रखता है।
- source_word: πόρνην
  choice: वेश्या
  rationale: आधुनिक मानक हिन्दी में स्पष्ट, सीधा और गरिमापूर्ण प्रतिशब्द; अनावश्यक रूप से गाली-सदृश शब्द से बचा गया है।
- source_word: μισήσουσι
  choice: घृणा करेंगे
  rationale: भविष्यकाल और तीव्र विरोध को स्वाभाविक हिन्दी में सीधे व्यक्त करता है।
- source_word: ἠρημωμένην ποιήσουσιν
  choice: उजाड़ ... कर देंगे
  rationale: कारणवाचक और परिणामसूचक निर्माण को बनाए रखते हुए न्याय और विनाश के बाइबलीय भाव को व्यक्त करता है।
- source_word: γυμνήν
  choice: नंगी
  rationale: यूनानी विशेषण का सीधा अर्थ रखा गया है; सार्वजनिक अपमान और अनावृत किए जाने का निहित भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: σάρκας
  choice: मांस
  rationale: हिन्दी में ‘मांस’ स्वाभाविक रूप से समूहवाचक है और यूनानी के हिंसक, शारीरिक बिंब को बिना नरम किए सुरक्षित रखता है।
- source_word: φάγονται
  choice: खा जाएँगे
  rationale: ἐσθίω के सीधे अर्थ ‘खाना’ को रखा गया है; ‘खा जाएँगे’ इस संदर्भ में पूर्ण विनाश की तीव्रता भी स्वाभाविक ढंग से दर्शाता है।
- source_word: κατακαύσουσιν ἐν πυρί
  choice: आग में पूरी तरह जला देंगे
  rationale: κατακαίω में निहित पूर्णतः जला देने की तीव्रता को स्पष्ट करता है और ἐν πυρί को ‘आग में’ के रूप में निकटता से प्रस्तुत करता है।
- source_word: οὗτοι
  choice: ये
  rationale: दस सींगों और पशु की ओर लौटने वाले बलाघाती बहुवचन सर्वनाम को दृश्यमान रखा गया है।
theological_decisions:
- issue: ‘दस सींग ... और पशु’ के बाद बहुवचन क्रियाओं का संबंध
  choice: 'संयुक्त कर्ता के बाद बलाघाती बहुवचन ‘ये’ रखा गया है: ‘और वे दस सींग ... और वह पशु—ये ... करेंगे।’'
  alternative: वाक्य को सरल बनाकर ‘दस सींग और पशु ... करेंगे’ कहना, या पशु को सींगों का समानाधिकरण मानना।
  rationale: यूनानी में नपुंसकलिंग बहुवचन बिंब और एकवचन θηρίον को पुल्लिंग बहुवचन οὗτοι तथा बहुवचन क्रियाएँ फिर से ग्रहण करती हैं। हिन्दी में पठनीय रहते हुए इस असामान्य बलाघात को सुरक्षित रखा गया है।
- issue: वेश्या के विनाश की प्रतीकात्मक प्रकृति
  choice: मुख्य पाठ में प्रकाशन-साहित्य के रूपक—नंगा करना, मांस खाना और आग में जलाना—को यथावत रखा गया है।
  alternative: वेश्या को सीधे किसी नगर, सत्ता या व्यवस्था के रूप में अनूदित करना।
  rationale: पद स्वयं प्रतीकात्मक न्याय-दृश्य प्रस्तुत करता है; अनुवाद में प्रतीक की व्याख्या थोपने या हिंसक भाषा को नरम करने के बजाय मूल तनाव बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। प्रतीकात्मक शब्दावली को व्याख्यात्मक रूप से बदलने के बजाय मूल बिंबों के साथ रखा गया है। विरामचिह्नों द्वारा संयुक्त कर्ता और बलाघाती ‘ये’ को पठनीय बनाया गया है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के तुरंत बाद दिए गए हैं।
