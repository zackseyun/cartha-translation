- source_word: ἔπεσαν
  choice: गिर चुके हैं
  rationale: πίπτω के शाब्दिक ‘गिरना’ को बनाए रखते हुए पूर्ण हो चुके पतन और उसकी वर्तमान प्रासंगिकता व्यक्त होती है।
- source_word: ὁ εἷς ἔστιν
  choice: एक अभी है
  rationale: यूनानी की संक्षिप्त अभिव्यक्ति ‘एक है’ को सुरक्षित रखा गया है; ‘अभी’ क्रम में उसकी वर्तमान स्थिति स्पष्ट करता है, बिना ‘राज कर रहा है’ जैसा अर्थ जोड़ने के।
- source_word: ὁ ἄλλος οὔπω ἦλθεν
  choice: दूसरा अभी तक नहीं आया
  rationale: यह अगले राजा को क्रम में अलग करता है; ‘अभी तक नहीं आया’ हिन्दी में अपेक्षित आगमन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅταν ἔλθῃ
  choice: जब वह आएगा
  rationale: ὅταν और संभावनार्थक क्रिया भविष्य की घटना को दर्शाते हैं; पुल्लिंग ‘वह’ का संदर्भ प्रसंग के राजा से है।
- source_word: ὀλίγον
  choice: थोड़े समय तक
  rationale: क्रियाविशेषणीय प्रयोग अल्प अवधि बताता है; यह मूल के ὀλίγον को बिना अनावश्यक ‘केवल’ जोड़े सीधे व्यक्त करता है।
- source_word: αὐτὸν δεῖ μεῖναι
  choice: उसका ... बने रहना आवश्यक है
  rationale: यह यूनानी की अवैयक्तिक अनिवार्यता ‘उसके लिए बने रहना आवश्यक है’ को निकटता से दर्शाता है और δεῖ की आवश्यकता को ‘होगा’ की संभावित भविष्यसूचक अस्पष्टता से अलग रखता है।
theological_decisions:
- issue: सात राजाओं के प्रतीक की व्याख्यात्मक विशिष्टता
  choice: मुख्य पाठ में संक्षिप्त ‘पाँच’, ‘एक’ और ‘दूसरा’ रखा गया है; फुटनोट में प्रसंगानुसार ‘राजा’ स्पष्ट किया गया है।
