  rationale: निकटवर्ती प्रसंग इन्हें राजा बताता है, पर इस पद की जानबूझकर संक्षिप्त भाषा और विवादित ऐतिहासिक पहचान को अनिर्णीत रखना उचित है।
- issue: δεῖ में निहित अनिवार्यता
  choice: ‘आवश्यक है’
  alternative: ‘उसे ... रहना होगा’
  rationale: ‘आवश्यक है’ दैवी अथवा नियत अनिवार्यता की सम्भावना को सुरक्षित रखता है, पर उसके स्वरूप की अतिरिक्त व्याख्या नहीं करता।
