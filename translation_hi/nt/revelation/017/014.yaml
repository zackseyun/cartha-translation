id: REV.17.14
reference: Revelation 17:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗτοι μετὰ τοῦ ἀρνίου πολεμήσουσιν, καὶ τὸ ἀρνίον νικήσει αὐτούς, ὅτι κύριος κυρίων ἐστὶν καὶ βασιλεὺς βασιλέων, καὶ οἱ μετ’ αὐτοῦ κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/014.yaml
  text: These will make war against the Lamb[a], and the Lamb will conquer them, because he is Lord of lords and King of kings, and those with him are called and chosen and faithful.
translation:
  language: hi
  text: ये मेम्ने के विरुद्ध युद्ध करेंगे[a], और मेम्ना उन पर विजय पाएगा, क्योंकि वह प्रभुओं का प्रभु और राजाओं का राजा है; और जो उसके साथ हैं, वे बुलाए हुए, चुने हुए और विश्वासयोग्य हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “मेम्ने के साथ युद्ध करेंगे”; इस संदर्भ में अर्थ है कि वे उसके विरुद्ध युद्ध करेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ये
  rationale: यह संकेतवाचक सर्वनाम पिछले संदर्भ के राजाओं की ओर संकेत करता है; ‘ये’ उस संकेतात्मक बल को बनाए रखता है।
- source_word: μετὰ τοῦ ἀρνίου
  choice: मेम्ने के विरुद्ध
  rationale: μετά सामान्यतः ‘साथ’ का अर्थ देता है, पर πολεμέω के युद्ध-संदर्भ में इसका भाव विरोधी है; ‘विरुद्ध’ हिंदी में आशय स्पष्ट करता है।
- source_word: ἀρνίον
  choice: मेम्ना
  rationale: प्रकाशितवाक्य में यह मसीह के लिए प्रयुक्त विशिष्ट प्रतीकात्मक उपाधि है; ‘मेम्ना’ स्वाभाविक और प्रचलित हिंदी रूप है।
- source_word: πολεμήσουσιν
  choice: युद्ध करेंगे
  rationale: यह भविष्यकालीन व्यापक सैन्य संघर्ष को व्यक्त करता है और दर्शनात्मक प्रसंग की गरिमा बनाए रखता है।
- source_word: νικήσει
  choice: विजय पाएगा
  rationale: νικάω प्रकाशितवाक्य का प्रमुख विषयगत क्रियापद है; ‘विजय पाएगा’ युद्ध-संदर्भ में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह मेम्ने की विजय का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में कारण-संबंध स्पष्ट करता है।
- source_word: κύριος κυρίων
  choice: प्रभुओं का प्रभु
  rationale: यह सर्वोच्च प्रभुता दर्शाने वाली सामी शैली की उपाधि को निकटता से सुरक्षित रखता है।
- source_word: βασιλεὺς βασιλέων
  choice: राजाओं का राजा
  rationale: यह सर्वोच्च राजकीय अधिकार व्यक्त करने वाली पारंपरिक उपाधि को सुरक्षित रखता है।
- source_word: οἱ μετ’ αὐτοῦ
  choice: जो उसके साथ हैं
  rationale: यह मेम्ने के साथ रहने वालों का स्वाभाविक और स्पष्ट हिंदी वर्णन है।
- source_word: κλητοὶ
  choice: बुलाए हुए
  rationale: यह κλητός के बुलाहट-संबंधी अर्थ को बनाए रखता है, बिना यह तय किए कि बल निमंत्रण पर है या प्रभावी आह्वान पर।
- source_word: ἐκλεκτοὶ
  choice: चुने हुए
  rationale: यह अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है और बाद की धर्मवैज्ञानिक प्रणाली को पाठ में नहीं जोड़ता।
- source_word: πιστοί
  choice: विश्वासयोग्य
  rationale: इस त्रिक में यह दृढ़ निष्ठा और भरोसेमंदी दोनों को व्यक्त करता है; केवल ‘विश्वासी’ कहना अर्थ को विश्वास करने तक सीमित कर सकता है।
theological_decisions:
- issue: मेम्ने की उपाधि और विजय की भाषा
  choice: ‘मेम्ना’ और ‘विजय पाएगा’
  alternative: ‘मेम्ना ... पराजित करेगा’ अथवा ‘विजयी होगा’
  rationale: यह प्रकाशितवाक्य की विशिष्ट मसीही उपाधि और νικάω के आवर्ती विषय को सुरक्षित रखता है, बिना पाठ से परे कोई सिद्धांत जोड़े।
- issue: κλητοὶ καὶ ἐκλεκτοὶ καὶ πιστοί का अनुवाद
  choice: ‘बुलाए हुए, चुने हुए और विश्वासयोग्य’
  alternative: ‘बुलाए गए, निर्वाचित और निष्ठावान’
  rationale: तीनों विशेषणों को पृथक रखते हुए बुलाहट और चुनाव से जुड़ी धर्मवैज्ञानिक बहसों का समाधान अनुवाद में नहीं थोपा गया है।
- issue: अंतिम पदबंध का वाक्यगत संबंध
  choice: ‘जो उसके साथ हैं, वे बुलाए हुए, चुने हुए और विश्वासयोग्य हैं’
  alternative: इसे विजय की संयुक्त कर्ता-सूची के रूप में स्पष्ट करना
  rationale: यूनानी वाक्यांश संक्षिप्त है और स्पष्ट क्रिया नहीं दोहराता। हिंदी में पहचानसूचक कथन दिया गया है, पर साथियों की विजय में भूमिका को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, दर्शनात्मक शैली रखी गई है। प्रचलित बाइबिलीय उपाधियों ‘मेम्ना’, ‘प्रभुओं का प्रभु’ और ‘राजाओं का राजा’ को बनाए रखते हुए वाक्यरचना साधारण पाठक के लिए स्पष्ट रखी गई है।
