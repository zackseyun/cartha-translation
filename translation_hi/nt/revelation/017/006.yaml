reference: Revelation 17:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶδον τὴν γυναῖκα μεθύουσαν ἐκ τοῦ αἵματος τῶν ἁγίων ⸀καὶ ἐκ τοῦ αἵματος τῶν μαρτύρων Ἰησοῦ. Καὶ ἐθαύμασα ἰδὼν αὐτὴν θαῦμα μέγα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/006.yaml
  text: And I saw the woman drunk with the blood of the saints and with the blood of the martyrs of Jesus. And seeing her[a], I marveled greatly.
translation:
  language: hi
  text: और मैंने उस स्त्री को पवित्र जनों के लहू और यीशु के गवाहों[a] के लहू से मतवाली देखा। उसे देखकर मैं बहुत चकित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु के शहीदों।” यूनानी शब्द का अर्थ “गवाह” या “शहीद” हो सकता है; यहाँ उनके लहू का उल्लेख होने के कारण “शहीद” का अर्थ विशेष रूप से उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεθύουσαν ἐκ τοῦ αἵματος
  choice: लहू से मतवाली
  rationale: यह स्वाभाविक हिन्दी में नशे की दशा और रक्तपात की चौंकाने वाली मूल छवि, दोनों को बनाए रखता है। यहाँ ἐκ को μεθύουσαν के साथ मिलाकर साधन/कारण के अर्थ में ‘से’ कहा गया है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों
  rationale: प्रकाशितवाक्य में यह पद परमेश्वर के लिए अलग किए गए लोगों को सूचित करता है। ‘पवित्र जन’ आधुनिक पाठक के लिए स्पष्ट है और किसी विशेष संस्थागत उपाधि का संकेत नहीं देता।
- source_word: τῶν μαρτύρων Ἰησοῦ
  choice: यीशु के गवाहों
  rationale: μάρτυς का मूल अर्थ ‘गवाह’ है, जबकि लहू का उल्लेख स्पष्ट करता है कि इन गवाहों ने मृत्यु तक गवाही दी। ‘यीशु के’ यूनानी संबंधकारक की संक्षिप्तता और उसकी संभावित अर्थ-व्याप्ति को बनाए रखता है।
- source_word: ἐθαύμασα ... θαῦμα μέγα
  choice: मैं बहुत चकित हुआ
  rationale: सजातीय कर्म θαῦμα μέγα क्रिया की तीव्रता बढ़ाता है; ‘बहुत चकित हुआ’ इसे सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἰδὼν αὐτὴν
  choice: उसे देखकर
  rationale: कृदन्त की कालगत परिस्थिति को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है और मूल की वाक्य-गति बनाए रखता है।
theological_decisions:
- issue: उत्पीड़न और रक्तपात के संदर्भ में μαρτύρων का अर्थ
  choice: मुख्य पाठ में ‘गवाहों’
  alternative: ‘शहीदों’
  rationale: ‘गवाह’ शब्द का मूल अर्थ और प्रकाशितवाक्य में गवाही का विषय सुरक्षित रहता है; साथ ही लहू का निकट संदर्भ शहादत का भाव प्रबल करता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: Ἰησοῦ संबंधकारक का अर्थ
  choice: ‘यीशु के’
  alternative: ‘यीशु की गवाही देनेवाले’
  rationale: संक्षिप्त संबंधकारक को स्पष्ट व्याख्या में बदलने के बजाय उसकी वास्तविक अर्थगत खुलावट—यीशु से संबंध अथवा यीशु के विषय में गवाही—बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली अपनाई गई है। ‘लहू’ ने दृश्य की तीव्र बाइबिलीय छवि को बनाए रखा है, और ‘मतवाली’ स्त्रीलिंग कर्ता के अनुरूप स्वाभाविक है। पादटिप्पणी-चिह्न उसी पद के बाद रखा गया है जिससे उसका lexical alternative संबंधित है।
