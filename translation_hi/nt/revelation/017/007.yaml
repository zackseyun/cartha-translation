id: REV.17.7
reference: Revelation 17:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι ὁ ἄγγελος· Διὰ τί ἐθαύμασας; ἐγὼ ἐρῶ σοι τὸ μυστήριον τῆς γυναικὸς καὶ τοῦ θηρίου τοῦ βαστάζοντος αὐτήν, τοῦ ἔχοντος τὰς ἑπτὰ κεφαλὰς καὶ τὰ δέκα κέρατα·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/007.yaml
  text: And the angel said to me[a], “Why did you marvel? I will tell you the mystery of the woman and of the beast that carries her, which has the seven heads and the ten horns.”
translation:
  language: hi
  text: और स्वर्गदूत ने मुझसे कहा, “तुम क्यों चकित हुए? मैं तुम्हें उस स्त्री और उस पशु का रहस्य बताऊँगा, जो उसे उठाए हुए है और जिसके सात सिर और दस सींग हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαύμασας
  choice: चकित हुए
  rationale: यहाँ क्रिया आश्चर्य और विस्मय की प्रतिक्रिया व्यक्त करती है। ‘चकित हुए’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल जिज्ञासा तक सीमित नहीं करती।
- source_word: μυστήριον
  choice: रहस्य
  rationale: यह शब्द उस छिपी हुई वास्तविकता के लिए है जिसे अब प्रकट किया जाना है; ‘रहस्य’ प्रकाशितवाक्य की अपोकैलिप्टिक भाषा के अनुरूप है।
- source_word: γυναικός
  choice: स्त्री
  rationale: सन्दर्भ में प्रतीकात्मक स्त्री की बात है, पत्नी के संबंध की नहीं; इसलिए ‘स्त्री’ उपयुक्त है।
- source_word: θηρίου
  choice: पशु
  rationale: प्रकाशितवाक्य में यह एक विशिष्ट अपोकैलिप्टिक प्रतीक है। ‘पशु’ पुस्तक के प्रचलित हिन्दी शब्द-संबंध और भयावह प्रतीकात्मकता को बनाए रखता है।
- source_word: βαστάζοντος
  choice: उठाए हुए
  rationale: क्रिया का अर्थ उठाना, लिए रहना या सहारा देना हो सकता है। ‘उठाए हुए’ दृश्य को स्पष्ट रखते हुए यह अनावश्यक रूप से नहीं बताता कि स्त्री किस प्रकार उस पर स्थित है।
- source_word: ἔχοντος
  choice: जिसके … हैं
  rationale: यह संबंधवाचक रचना आधुनिक हिन्दी में स्वाभाविक है और साफ करती है कि सात सिर और दस सींग पशु के हैं।
- source_word: κεφαλάς
  choice: सिर
  rationale: दर्शन की शारीरिक और प्रतीकात्मक छवि को सीधे रूप में सुरक्षित रखा गया है।
- source_word: κέρατα
  choice: सींग
  rationale: अपोकैलिप्टिक प्रतीक की मूल छवि को ज्यों का त्यों बनाए रखा गया है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: प्रश्नवाचक यूनानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ἐρῶ σοι
  choice: मैं तुम्हें … बताऊँगा
  rationale: भविष्यकालीन कथन स्वर्गदूत द्वारा आगे दी जाने वाली व्याख्या का सीधा परिचय देता है।
theological_decisions:
- issue: ‘जिसके सात सिर और दस सींग हैं’ का संबंध किससे है
  choice: विवरण को पशु से जोड़ा गया है।
  alternative: वाक्य को अधिक ढीला रखकर स्त्री, पशु या संयुक्त रहस्य के साथ संबंध अस्पष्ट छोड़ा जा सकता था।
  rationale: यूनानी में τοῦ βαστάζοντος और τοῦ ἔχοντος का व्याकरणिक रूप θηρίου के अनुरूप है, γυναικός के नहीं। इसलिए हिन्दी में भी स्पष्ट किया गया है कि स्त्री को उठाने वाला और सात सिर तथा दस सींग रखने वाला पशु है।
- issue: ‘रहस्य’ एक है या दो
  choice: ‘उस स्त्री और … उस पशु का रहस्य’ कहकर एक संयुक्त रहस्य रखा गया है।
  alternative: ‘स्त्री का रहस्य और पशु का रहस्य’ कहना दो अलग रहस्यों का आभास दे सकता था।
  rationale: यूनानी में μυστήριον एकवचन है और उसके बाद स्त्री तथा पशु दोनों संबंधसूचक पदों से जुड़े हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चकित’, ‘रहस्य’, ‘पशु’, ‘सिर’ और ‘सींग’ प्रकाशितवाक्य की ऊँची प्रतीकात्मक शैली को बनाए रखते हैं, जबकि वाक्य-विन्यास सहज हिन्दी का है।
