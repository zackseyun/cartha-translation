id: REV.17.5
reference: Revelation 17:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὸ μέτωπον αὐτῆς ὄνομα γεγραμμένον, μυστήριον, Βαβυλὼν ἡ μεγάλη, ἡ μήτηρ τῶν πορνῶν καὶ τῶν βδελυγμάτων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/005.yaml
  text: 'And on her forehead a name was written: Mystery[a], Babylon the Great, the mother of prostitutes and of the abominations of the earth.'
translation:
  language: hi
  text: 'और उसके माथे पर एक नाम लिखा था: “रहस्य[a], महान बाबेल, पृथ्वी की वेश्याओं और घिनौनी वस्तुओं की माता।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “एक नाम लिखा था—एक रहस्य: महान बाबेल, पृथ्वी की वेश्याओं और घिनौनी वस्तुओं की माता।” इस तरह “रहस्य” को स्वयं लिखे हुए नाम का भाग नहीं, बल्कि उस नाम के प्रतीकात्मक अर्थ का परिचायक माना जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ τὸ μέτωπον αὐτῆς
  choice: उसके माथे पर
  rationale: ἐπί के स्थानवाचक अर्थ और माथे पर लिखे नाम की छवि को स्वाभाविक आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: ὄνομα γεγραμμένον
  choice: एक नाम लिखा था
  rationale: 'पूर्ण निष्क्रिय कृदंत के परिणामसूचक भाव को सहज हिन्दी में व्यक्त करता है: नाम पहले लिखा जा चुका था और दिखाई दे रहा था।'
- source_word: μυστήριον
  choice: रहस्य
  rationale: संदर्भ में इसे लिखे हुए नाम/उपाधि का भाग माना गया है। ‘रहस्य’ सर्वमान्य बाइबिलीय और आधुनिक हिन्दी शब्द है; वैकल्पिक विराम-व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: महान बाबेल
  rationale: Βαβυλών के पारंपरिक हिन्दी नाम ‘बाबेल’ को बनाए रखते हुए ἡ μεγάλη को स्वाभाविक उपाधि ‘महान’ के रूप में रखा गया है।
- source_word: ἡ μήτηρ
  choice: माता
  rationale: उपाधि के गंभीर, प्रतीकात्मक स्वर के लिए ‘माता’ स्वाभाविक और गरिमापूर्ण है।
- source_word: τῶν πορνῶν
  choice: वेश्याओं की
  rationale: πόρνη के ठोस अर्थ को सीधे व्यक्त करता है; व्यापक और व्याख्यात्मक ‘व्यभिचारिणियों’ की अपेक्षा पेशागत/यौन बिंब को अधिक ठीक रखता है।
- source_word: τῶν βδελυγμάτων
  choice: घिनौनी वस्तुओं की
  rationale: βδέλυγμα के लिए समझने योग्य आधुनिक हिन्दी है और मूर्तिपूजक तथा नैतिक रूप से घृणित वस्तुओं/कृत्यों की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: τῆς γῆς
  choice: पृथ्वी की
  rationale: प्रकाशितवाक्य के विश्वव्यापी प्रलयदर्शी संदर्भ में γῆ का ‘पृथ्वी’ अर्थ उपयुक्त है; हिन्दी वाक्य-रचना में यह दोनों समन्वित पदों से संबद्ध समझा जाता है।
theological_decisions:
- issue: क्या μυστήριον लिखे हुए नाम का भाग है या आगे आने वाले नाम के प्रतीकात्मक अर्थ का परिचायक?
  choice: 'इसे नाम का भाग मानकर प्रस्तुत किया गया है: “रहस्य, महान बाबेल...”'
  alternative: 'इसे वर्णनात्मक परिचायक माना जा सकता है: “एक नाम लिखा था—एक रहस्य: महान बाबेल...”'
  rationale: यूनानी मूल में विराम-चिह्न निर्णायक नहीं हैं और दोनों संरचनाएँ संभव हैं। मुख्य पाठ निकटवर्ती नाम-सूची के अंग के रूप में μυστήριον को ग्रहण करता है, जबकि वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। उद्धरण-चिह्न माथे पर लिखे पूरे नाम/शीर्षक की सीमा स्पष्ट करते हैं। ‘वेश्याओं’ मूल बिंब की स्पष्टता बनाए रखता है, जबकि ‘घिनौनी वस्तुओं’ से βδελυγμάτων का व्यापक धार्मिक और नैतिक आशय सुरक्षित रहता है।
