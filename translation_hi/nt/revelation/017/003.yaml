id: REV.17.3
reference: Revelation 17:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με εἰς ἔρημον ἐν πνεύματι. καὶ εἶδον γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον, ⸀γέμοντα ὀνόματα βλασφημίας, ⸀ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/003.yaml
  text: And he carried me away in the Spirit into a wilderness. And I saw a woman sitting on a scarlet beast[a], full of blasphemous names, having seven heads and ten horns.
translation:
  language: hi
  text: और वह मुझे आत्मा में[a] एक निर्जन स्थान में ले गया। और मैंने एक स्त्री को लाल रंग के एक पशु पर बैठी हुई देखा। वह पशु निन्दात्मक नामों से भरा हुआ था और उसके सात सिर और दस सींग थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मिक दशा में।” यूनानी पदबंध किसी आत्मिक अवस्था या आत्मा द्वारा ले जाए जाने—दोनों का बोध करा सकता है; प्रकाशितवाक्य में यह प्रायः एक दर्शनीय अनुभव का परिचय देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: ले गया
  rationale: यह क्रिया एक स्थान से दूसरे स्थान तक ले जाए जाने को व्यक्त करती है; हिन्दी में ‘ले गया’ स्वाभाविक है और दर्शनीय अनुभव के प्रसंग में परिवहन का भाव बनाए रखता है।
- source_word: εἰς ἔρημον
  choice: एक सुनसान प्रदेश में
  rationale: ἔρημος निर्जन, उजाड़ या वन्य स्थान को सूचित कर सकता है। ‘सुनसान प्रदेश’ रेतीले मरुस्थल का अनावश्यक अर्थ थोपे बिना अनिश्चित रूप को भी दर्शाता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: प्रकाशितवाक्य में यह पदबंध प्रायः भविष्यदर्शी अनुभव का परिचय देता है। ‘आत्मा’ का प्रयोग पवित्र आत्मा की सम्भावित भूमिका को बनाए रखता है, जबकि पादटिप्पणी वैकल्पिक अर्थ को सुरक्षित रखती है।
- source_word: γυναῖκα καθημένην ἐπὶ θηρίον κόκκινον
  choice: एक स्त्री को लाल रंग के एक पशु पर बैठे
  rationale: यह रूप स्त्री की पशु के ऊपर बैठी हुई स्थिति को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है। κόκκινον के लिए ‘लाल रंग का’ सामान्य पाठक के लिए स्पष्ट है और चटख लाल रंग के मूल भाव को रखता है।
- source_word: γέμοντα ὀνόματα βλασφημίας
  choice: परमेश्वर की निन्दा करनेवाले नामों से भरा हुआ
  rationale: γέμοντα का अर्थ ‘भरा हुआ’ है। βλασφημία के धार्मिक आशय को आधुनिक हिन्दी में स्पष्ट करने के लिए ‘परमेश्वर की निन्दा करनेवाले’ कहा गया है, बिना यह मानने के कि नाम केवल सतह पर लिखे या ढके हुए थे।
- source_word: ἔχων κεφαλὰς ἑπτὰ καὶ κέρατα δέκα
  choice: उसके सात सिर और दस सींग थे
  rationale: ग्रीक कृदन्त का स्वाभाविक हिन्दी वाक्य में रूपान्तरण किया गया है; प्रतीकात्मक संख्याएँ और अंग ज्यों के त्यों रखे गए हैं।
theological_decisions:
- issue: ἐν πνεύματι का अर्थ
  choice: ‘आत्मा में’—भविष्यदर्शी अनुभव में आत्मा की सम्भावित भूमिका
  alternative: ‘आत्मिक दशा में’ या ‘अपने आत्मा में’
  rationale: यूनानी में बड़े-छोटे अक्षरों से पवित्र आत्मा और मानवीय आत्मा का भेद नहीं दिखता। प्रकाशितवाक्य का प्रयोग पवित्र आत्मा की भूमिका की ओर संकेत करता है, पर अस्पष्टता को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सुनसान प्रदेश’ सामान्य पाठक के लिए बोधगम्य है और ἔρημος को केवल रेतीला मरुस्थल मानने से बचाता है। मुख्य पाठ में पादटिप्पणी चिह्न [a] उपस्थित है।
