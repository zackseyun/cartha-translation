id: REV.17.8
reference: Revelation 17:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ θηρίον ὃ εἶδες ἦν καὶ οὐκ ἔστιν, καὶ μέλλει ἀναβαίνειν ἐκ τῆς ἀβύσσου, καὶ εἰς ἀπώλειαν ⸀ὑπάγει· καὶ ⸀θαυμασθήσονται οἱ κατοικοῦντες ἐπὶ τῆς γῆς, ὧν οὐ γέγραπται ⸂τὸ ὄνομα⸃ ἐπὶ τὸ βιβλίον τῆς ζωῆς ἀπὸ καταβολῆς κόσμου, βλεπόντων ⸂τὸ θηρίον ὅτι ἦν⸃ καὶ οὐκ ἔστιν καὶ παρέσται.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/008.yaml
  text: The beast that you saw was[a], and is not, and is about to come up out of the abyss and go to destruction. And those who dwell on the earth, whose name has not been written in the book of life from the foundation of the world, will marvel when they see the beast[c][b], because it was and is not and will be present.
translation:
  language: hi
  text: जिस पशु को तूने देखा, वह था और नहीं है, और वह अथाह गहराई से ऊपर आने को है और विनाश की ओर जाता है। पृथ्वी के निवासी—जिनका नाम जगत की नींव डाले जाने से जीवन की पुस्तक में नहीं लिखा गया है—उस पशु को देखकर चकित होंगे, क्योंकि वह था, नहीं है, और उपस्थित होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उस पशु को देखकर चकित होंगे कि वह था, नहीं है, और आएगा (या, प्रकट होगा)।” यूनानी में यहाँ “क्योंकि” और “कि”, तथा “उपस्थित होगा”, “आएगा” या “प्रकट होगा”—इन अर्थों की सम्भावना है।'
    reason: alternative_reading
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य के प्रतीकात्मक और भयावह प्राणी के लिए प्रचलित बाइबलीय शब्द; केवल ‘जानवर’ की अपेक्षा अधिक गरिमापूर्ण और संदर्भानुकूल।
- source_word: ἦν καὶ οὐκ ἔστιν
  choice: था और अब नहीं है
  rationale: मूल के तीखे काल-विरोध को बनाए रखता है; हिन्दी में ‘अब’ वर्तमान अभाव को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: μέλλει ἀναβαίνειν
  choice: ऊपर आनेवाला है
  rationale: μέλλει की आसन्न या निश्चित भावी क्रिया और ἀναβαίνειν की ऊपर की दिशा, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἄβυσσος
  choice: अथाह कुंड
  rationale: प्रकाशितवाक्य के अधोलोक-सदृश गहन स्थान का अर्थ स्पष्ट करता है और ‘पाताल’ जैसी अतिरिक्त धार्मिक अवधारणा आरोपित नहीं करता।
- source_word: εἰς ἀπώλειαν ὑπάγει
  choice: विनाश में चला जाएगा
  rationale: अंतिम नाश की ओर गति को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: θαυμασθήσονται
  choice: चकित होंगे
  rationale: यहाँ विस्मय या अचंभे का भाव है; हिन्दी में सहज और प्रसंगानुकूल।
- source_word: οἱ κατοικοῦντες ἐπὶ τῆς γῆς
  choice: पृथ्वी के निवासी
  rationale: प्रकाशितवाक्य में बार-बार आनेवाली सामूहिक पदावली का संक्षिप्त और औपचारिक रूप।
- source_word: ὧν οὐ γέγραπται τὸ ὄνομα
  choice: जिनका नाम ... नहीं लिखा गया है
  rationale: मूल के एकवचन ‘नाम’ को बनाए रखता है, जबकि सम्बन्धवाचक रचना हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ τὸ βιβλίον τῆς ζωῆς
  choice: जीवन की पुस्तक में
  rationale: नाम लिखे जाने के लिए हिन्दी मुहावरे में ‘पुस्तक में’ स्वाभाविक है, यद्यपि यूनानी में शाब्दिक रूप से ‘पुस्तक पर’ है।
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: जगत की नींव डाले जाने के समय से
  rationale: सृष्टि के आरम्भ से चली आ रही कालावधि को स्पष्ट करता है और मूल के ‘नींव डालने’ वाले रूपक को बनाए रखता है।
- source_word: βλεπόντων
  choice: देखकर
  rationale: समकालिक या कारण-सन्निकट कृदन्त को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅτι ἦν καὶ οὐκ ἔστιν καὶ παρέσται
  choice: क्योंकि वह था, अब नहीं है, और उपस्थित होगा
  rationale: ὅτι को कारणसूचक माना गया है और παρέσται के ‘उपस्थित होने’ के मूल अर्थ को ‘आएगा’ में सीमित नहीं किया गया।
theological_decisions:
- issue: ‘जगत की नींव डाले जाने के समय से’ का सम्बन्ध
  choice: इसे नाम के जीवन की पुस्तक में न लिखे जाने से जोड़ा गया है।
  alternative: इसे किसी व्यापक पूर्वनियति-सिद्धान्त की व्याख्या के रूप में विस्तार देना।
  rationale: यूनानी वाक्यक्रम में यह पद सीधे लिखे जाने और जीवन की पुस्तक के बाद आता है; अनुवाद इसी व्याकरणिक सम्बन्ध को रखता है, उससे आगे कोई सिद्धान्त आरोपित नहीं करता।
- issue: παρέσται का अर्थ
  choice: उपस्थित होगा
  alternative: आएगा / प्रकट होगा
  rationale: यह πάρειμι का भविष्यकाल है और उपस्थिति या आगमन दोनों का संकेत दे सकता है। ‘उपस्थित होगा’ ‘नहीं है’ के साथ अस्तित्वगत विरोध को सुरक्षित रखता है।
- issue: ὅτι का वाक्यगत कार्य
  choice: कारणसूचक ‘क्योंकि’
  alternative: विषयसूचक ‘कि’
  rationale: दोनों सम्भव हैं। मुख्य पाठ में लोगों के चकित होने का कारण व्यक्त किया गया है; वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय रूप अपनाया गया है। दर्शन के सीधे सम्बोधन में ‘तूने’ रखा गया है, जो बाइबलीय भविष्यदर्शी संवाद में स्वाभाविक है। वाक्य के लंबे सम्बन्धवाचक अंश को डैश से अलग करके स्पष्टता बढ़ाई गई है; मूल की कालगत और धर्मवैचारिक तनावपूर्ण भाषा को सरल व्याख्या में नहीं बदला गया।
