source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Τὰ ὕδατα ἃ εἶδες, οὗ ἡ πόρνη κάθηται, λαοὶ καὶ ὄχλοι εἰσὶν καὶ ἔθνη καὶ γλῶσσαι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/015.yaml
  text: And he says to me, “The waters that you saw, where the prostitute sits, are peoples and crowds and nations and languages.”
translation:
  language: hi
  text: और वह मुझसे कहता है, “जो जल तुमने देखे, जिन पर वह वेश्या बैठी है, वे लोग, भीड़ें, राष्ट्र और भाषाएँ हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕδατα
  choice: जल
  rationale: बहुवचन अर्थ को संदर्भगत रूप से ‘जो जल’ में स्वाभाविक हिन्दी के साथ रखा गया है; यह प्रकाशितवाक्य के प्रतीकात्मक दृश्य को बनाए रखता है।
- source_word: ἡ πόρνη
  choice: वह वेश्या
  rationale: स्त्रीलिंग निश्चित पद और पूर्व उल्लिखित पात्र को स्पष्ट तथा सीधे रूप में व्यक्त करता है।
- source_word: λαοὶ καὶ ὄχλοι
  choice: लोगों, भीड़ों
  rationale: 'दोनों अलग यूनानी संज्ञाओं का भेद रखा गया है: λαοί जनसमुदाय/लोग और ὄχλοι भीड़ें।'
- source_word: ἔθνη καὶ γλῶσσαι
  choice: राष्ट्रों और भाषाओं
  rationale: ἔθνη के सामूहिक राजनीतिक-जातीय अर्थ और γλῶσσαι के भाषाई समूह-सूचक अर्थ को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: εἰσίν
  choice: को दर्शाते हैं
  rationale: प्रतीक की व्याख्या के प्रसंग में शाब्दिक ‘हैं’ का आशय स्पष्ट करता है, बिना प्रतीक और उसके अभिप्राय की पहचान को बदलने के।
theological_decisions:
- issue: जल और मानव समूहों के बीच प्रतीकात्मक पहचान
  choice: ‘वे ... को दर्शाते हैं’
  alternative: ‘वे ... हैं’
  rationale: यह दर्शन के प्रतीक की स्वर्गदूत द्वारा की जा रही व्याख्या को स्वाभाविक हिन्दी में स्पष्ट करता है; किसी विशेष ऐतिहासिक या संप्रदायगत पहचान को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। वर्तमानकाल ‘कहता है’ यूनानी λέγει के कथात्मक वर्तमान को बनाए रखता है।
