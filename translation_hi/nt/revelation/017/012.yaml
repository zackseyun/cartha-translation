source:
  edition: SBLGNT
  text: καὶ τὰ δέκα κέρατα ἃ εἶδες δέκα βασιλεῖς εἰσιν, οἵτινες βασιλείαν οὔπω ἔλαβον, ἀλλὰ ἐξουσίαν ὡς βασιλεῖς μίαν ὥραν λαμβάνουσιν μετὰ τοῦ θηρίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/012.yaml
  text: And the ten horns that you saw are ten kings[a], who have not yet received a kingdom, but they receive authority as kings for one hour with the beast.
translation:
  language: hi
  text: और जो दस सींग तुमने देखे, वे दस राजा हैं। उन्हें अभी तक राज्य नहीं मिला है, पर वे उस पशु के साथ एक घंटे[a] के लिए राजाओं के रूप में अधिकार प्राप्त करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “थोड़े समय के लिए।” प्रलय-संबंधी प्रतीकात्मक चित्रण में “एक घंटा” संभवतः एक छोटी, सीमित अवधि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κέρατα
  choice: सींग
  rationale: प्रकाशितवाक्य की प्रतीकात्मक छवि को बनाए रखने के लिए इसका शाब्दिक अनुवाद किया गया है; अगले वाक्यांश में इन्हें राजाओं के रूप में पहचाना गया है।
- source_word: βασιλεῖς
  choice: राजा
  rationale: यह मूल शब्द का सामान्य और सीधा अर्थ है; प्रतीकात्मक शासक या शक्तियाँ अभिप्रेत हो सकती हैं, पर मुख्य पाठ उस व्याख्या को आरोपित नहीं करता।
- source_word: βασιλείαν
  choice: राज्य
  rationale: यहाँ यह उस राज्य या शासन-क्षेत्र को दर्शाता है जो उन्हें अभी नहीं मिला; इसे बाद के ἐξουσίαν से अलग रखा गया है।
- source_word: οὔπω ἔλαβον
  choice: अभी तक ... नहीं मिला है
  rationale: हिंदी में यह स्वाभाविक रूप से उस वर्तमान स्थिति को व्यक्त करता है जिसमें राज्य की प्राप्ति अभी बाकी है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह प्रदान की गई शासन-सत्ता को व्यक्त करता है और इसे 'राज्य' से अलग बनाए रखता है।
- source_word: ὡς βασιλεῖς
  choice: राजाओं के समान
  rationale: यह उनकी भूमिका या हैसियत की तुलना को स्पष्ट रखता है और यूनानी ὡς की संभावित तुलनात्मक बारीकी को सुरक्षित रखता है।
- source_word: μίαν ὥραν
  choice: एक घंटे के लिए
  rationale: प्रलयदर्शी अभिव्यक्ति को शाब्दिक रूप में सुरक्षित रखा गया है; अल्प अवधि का संभावित भाव पादटिप्पणी में दिया गया है।
- source_word: λαμβάνουσιν
  choice: पाते हैं
  rationale: यूनानी वर्तमान काल की जीवंत शैली को बनाए रखते हुए इसे स्वाभाविक हिंदी वर्तमान काल में रखा गया है।
- source_word: μετὰ τοῦ θηρίου
  choice: उस पशु के साथ
  rationale: यह पशु के साथ संगति या संयुक्त भूमिका को सीधे व्यक्त करता है; 'उस' पूर्वप्रसंग में पहचाने गए पशु की ओर संकेत करता है।
- source_word: θηρίου
  choice: पशु
  rationale: प्रकाशितवाक्य की स्थापित प्रतीकात्मक छवि को बनाए रखने वाला सीधा और स्वाभाविक हिंदी शब्द है।
theological_decisions:
- issue: दस राजाओं को शाब्दिक सम्राट मानना या प्रतीकात्मक शासक/शक्तियाँ
  choice: मुख्य पाठ में ‘दस राजा’ रखा गया है।
  alternative: दस प्रतीकात्मक शासक, राज्य या राजनीतिक शक्तियाँ
  rationale: यूनानी पाठ स्पष्टतः ‘दस राजा’ कहता है, जबकि साहित्यिक संदर्भ प्रतीकात्मक है; अनुवाद इस तनाव को व्याख्यात्मक विस्तार से हल नहीं करता।
- issue: μίαν ὥραν को ठीक एक घंटा मानना या थोड़ी, सीमित अवधि
  choice: मुख्य पाठ में ‘एक घंटे के लिए’ रखा गया है।
  alternative: थोड़े समय के लिए
  rationale: मूल अभिव्यक्ति शाब्दिक रूप से ‘एक घंटा’ है, पर प्रलयदर्शी चित्रण में यह संक्षिप्त और सीमित अवधि सूचित कर सकती है; यह संभावना पादटिप्पणी में सुरक्षित है।
- issue: ὡς βασιλεῖς में वास्तविक राजकीय हैसियत या तुलनात्मक भूमिका
  choice: ‘राजाओं के समान’
  alternative: ‘राजाओं के रूप में’
  rationale: ὡς तुलना या भूमिका दोनों व्यक्त कर सकता है। ‘राजाओं के समान’ मूल की संभावित तुलनात्मक बारीकी को सुरक्षित रखता है, बिना यह तय किए कि उन्हें पूर्ण राजकीय पद मिला है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘सींग,’ ‘राजा,’ ‘राज्य,’ ‘अधिकार’ और ‘पशु’ जैसे अलग-अलग मूल पदों तथा प्रतीकात्मक छवियों को स्पष्ट रूप से सुरक्षित रखा गया है।
