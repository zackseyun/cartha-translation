id: REV.17.17
reference: Revelation 17:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ γὰρ θεὸς ἔδωκεν εἰς τὰς καρδίας αὐτῶν ποιῆσαι τὴν γνώμην αὐτοῦ, καὶ ποιῆσαι ⸂μίαν γνώμην⸃ καὶ δοῦναι τὴν βασιλείαν αὐτῶν τῷ θηρίῳ, ἄχρι ⸀τελεσθήσονται οἱ λόγοι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/017.yaml
  text: For God put it into their hearts to carry out his purpose[a], and to act with one purpose and to give their kingdom to the beast[b], until the words of God are fulfilled.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने उनके हृदयों में यह बात डाल दी कि वे उसके उद्देश्य को पूरा करें, एक ही उद्देश्य से काम करें और अपना राज्य उस पशु को दे दें, जब तक कि परमेश्वर के वचन पूरे न हो जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκεν εἰς τὰς καρδίας αὐτῶν
  choice: उनके हृदयों में यह बात डाल दी
  rationale: यह यूनानी मुहावरा भीतरी प्रेरणा या प्रवृत्ति उत्पन्न करने को व्यक्त करता है। हिन्दी में यह स्वाभाविक है और हृदय का रूपक बनाए रखता है।
- source_word: ποιῆσαι τὴν γνώμην αὐτοῦ
  choice: उसके उद्देश्य को पूरा करें
  rationale: यहाँ γνώμη से परमेश्वर का उद्देश्य या अभिप्राय व्यक्त होता है; ‘पूरा करें’ ποιῆσαι के कार्यान्वयन के भाव को स्पष्ट करता है।
- source_word: ποιῆσαι μίαν γνώμην
  choice: एक ही उद्देश्य से काम करें
  rationale: शाब्दिक रचना ‘एक उद्देश्य करना’ हिन्दी में अस्वाभाविक है। चुना हुआ अनुवाद राजाओं के एकमत व्यावहारिक संकल्प को व्यक्त करता है, बिना उसे केवल मानसिक सहमति तक सीमित किए।
- source_word: δοῦναι τὴν βασιλείαν αὐτῶν
  choice: अपना राज्य ... दे दें
  rationale: मूल के एकवचन βασιλεία तथा बहुवचन कर्ताओं की साझा सत्ता को ‘अपना राज्य’ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῷ θηρίῳ
  choice: उस पशु को
  rationale: प्रकाशितवाक्य की प्रतीकात्मक शब्दावली में θηρίον के लिए ‘पशु’ सुसंगत और स्पष्ट है; निश्चित लेख को ‘उस’ से दर्शाया गया है।
- source_word: ἄχρι τελεσθήσονται οἱ λόγοι τοῦ θεοῦ
  choice: जब तक कि परमेश्वर के वचन पूरे न हो जाएँ
  rationale: τελέω का भाव यहाँ पूर्ण होने या चरितार्थ होने का है। ‘वचन पूरे होना’ भविष्यसूचक सन्दर्भ में स्वाभाविक है और λόγοι की व्यापकता बनाए रखता है।
theological_decisions:
- issue: राजाओं के कार्यों में परमेश्वर की प्रभुता और मानवीय कर्तृत्व
  choice: परमेश्वर के हृदयों में बात डालने और राजाओं के स्वयं कार्य करने—दोनों को स्पष्ट रखा गया है।
  alternative: परमेश्वर की भूमिका को केवल ‘अनुमति देने’ के रूप में कमजोर करना, अथवा मूल से आगे जाकर कठोर नियतिवादी भाषा जोड़ना।
  rationale: मूल पाठ परमेश्वर की प्रेरक क्रिया और शासकों के वास्तविक, एकीकृत कार्य दोनों कहता है। अनुवाद इस धर्मवैचारिक तनाव को हल किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और भविष्यसूचक शैली के अनुकूल रूप। ‘हृदयों में यह बात डाल दी’ सामान्य पाठक के लिए बोधगम्य मुहावरा है; समानांतर क्रियाएँ ‘पूरा करें, ... काम करें और ... दे दें’ स्पष्ट रखी गई हैं।
