id: REV.17.11
reference: Revelation 17:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὸ θηρίον ὃ ἦν καὶ οὐκ ἔστιν. καὶ ⸀αὐτὸς ὄγδοός ἐστιν καὶ ἐκ τῶν ἑπτά ἐστιν, καὶ εἰς ἀπώλειαν ὑπάγει.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/011.yaml
  text: And the beast that was and is not is itself an eighth and is from the seven[b][a], and it goes to destruction.
translation:
  language: hi
  text: और वह पशु, जो था और अब नहीं है, स्वयं आठवाँ है[a] और उन सातों में से है[b], और वह विनाश की ओर जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वयं आठवाँ राजा है।” संदर्भ से “राजा” संज्ञा समझी जा सकती है, पर यूनानी पाठ में वह यहाँ लिखी नहीं है।
    reason: alternative_reading
  - marker: b
    text: या, “उन सातों में से एक है।” यूनानी का अधिक शाब्दिक अर्थ “उन सातों में से/उन सातों से” है, जो उद्गम, सदस्यता या निकट संबंध सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θηρίον
  choice: पशु
  rationale: प्रकाशितवाक्य के दर्शनात्मक संदर्भ में यह परमेश्वर-विरोधी भयावह सत्ता का स्थापित प्रतीक है। ‘पशु’ स्वाभाविक हिन्दी में उस प्रतीकात्मक बल को बनाए रखता है।
- source_word: ὃ ἦν καὶ οὐκ ἔστιν
  choice: जो था और अब नहीं है
  rationale: यह यूनानी की तीखी समानांतर अभिव्यक्ति को बनाए रखता है; हिन्दी में कालगत अर्थ स्पष्ट करने के लिए ‘अब’ स्वाभाविक रूप से जोड़ा गया है, बिना ‘फिर जीवित नहीं’ जैसी अतिरिक्त व्याख्या किए।
- source_word: αὐτὸς
  choice: स्वयं
  rationale: यह बलाघात को बनाए रखता है और पशु को अनावश्यक रूप से पुरुष-व्यक्ति के रूप में निर्दिष्ट नहीं करता।
- source_word: ὄγδοός
  choice: आठवाँ
  rationale: यूनानी में कोई संज्ञा स्पष्ट रूप से नहीं दी गई है। ‘आठवाँ’ संदर्भगत रिक्तता बनाए रखता है; ‘राजा’ को मुख्य पाठ में जोड़ना व्याख्यात्मक होता।
- source_word: ἐκ τῶν ἑπτά
  choice: उन सातों में से
  rationale: यह हिन्दी में स्वाभाविक है और सातों से उद्गम, सदस्यता या निकट संबंध की सम्भावना को खुला रखता है; टिप्पणी अधिक विशिष्ट अर्थ ‘सातों में से एक’ बताती है।
- source_word: εἰς ἀπώλειαν
  choice: विनाश की ओर
  rationale: यह अंतिम नाश या सर्वनाश की गंभीरता को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπάγει
  choice: जाता है
  rationale: साधारण वर्तमान काल यूनानी की सजीव अभिव्यक्ति को बिना अतिरिक्त पक्षगत अर्थ जोड़े बनाए रखता है।
theological_decisions:
- issue: क्या निहित संज्ञा को ‘आठवाँ राजा’ कहकर स्पष्ट किया जाए
  choice: मुख्य पाठ में केवल ‘आठवाँ’ रखा गया है।
  alternative: आठवाँ राजा
  rationale: निकटवर्ती संदर्भ राजाओं का है, इसलिए ‘राजा’ सम्भावित पूर्ति है; पर यूनानी में βασιλεύς यहाँ नहीं है। पाठ की संक्षिप्तता और प्रतीकात्मक अस्पष्टता बनाए रखने हेतु इसे टिप्पणी में रखा गया है।
- issue: ἐκ τῶν ἑπτά को ‘सातों में से एक’ के रूप में अधिक स्पष्ट करना
  choice: ‘उन सातों में से’
  alternative: उन सातों में से एक / उन सातों से निकला हुआ
  rationale: यूनानी पदबंध सातों से उत्पत्ति, सदस्यता या निकट संबंध सूचित कर सकता है। मुख्य पाठ किसी एक व्याख्या को अंतिम नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। वाक्य की दर्शनात्मक संक्षिप्तता और दो मुख्य अस्पष्टताएँ—‘आठवाँ’ के साथ निहित संज्ञा तथा सातों से संबंध—सुरक्षित रखी गई हैं।
