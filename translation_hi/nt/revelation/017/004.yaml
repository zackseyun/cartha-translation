id: REV.17.4
reference: Revelation 17:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡ γυνὴ ἦν περιβεβλημένη πορφυροῦν καὶ κόκκινον, ⸀καὶ κεχρυσωμένη ⸀χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις, ἔχουσα ποτήριον χρυσοῦν ἐν τῇ χειρὶ αὐτῆς γέμον βδελυγμάτων καὶ τὰ ἀκάθαρτα τῆς πορνείας αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/004.yaml
  text: And the woman was clothed in purple and scarlet[a], and adorned with gold and precious stones and pearls, holding in her hand a golden cup full of abominations and the unclean things of her sexual immorality.
translation:
  language: hi
  text: और वह स्त्री बैंगनी और किरमिज़ी रंग के वस्त्र पहने हुए थी और सोने, बहुमूल्य पत्थरों और मोतियों से सजी हुई थी। उसके हाथ में सोने का एक प्याला था, जो घृणित वस्तुओं और उसकी यौन अनैतिकता[a] की अशुद्ध वस्तुओं से भरा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वेश्यावृत्ति” अथवा “व्यभिचार”; प्रकाशितवाक्य में यूनानी शब्द का अर्थ शाब्दिक और रूपकात्मक, दोनों हो सकता है।
    reason: πορνεία के सम्भव अर्थों और दर्शन की जानबूझकर रखी गई द्विअर्थी प्रतीकात्मकता को सुरक्षित करना।
lexical_decisions:
- source_word: περιβεβλημένη
  choice: वस्त्र पहने हुए थी
  rationale: ἦν के साथ पूर्ण कृदंत स्त्री की परिणामी अवस्था बताता है; यह प्रयोग उस स्थायी दृश्यावस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πορφυροῦν καὶ κόκκινον
  choice: बैंगनी और गहरे लाल रंग के वस्त्र
  rationale: दोनों विशेषण वस्त्र के निहित भाव के साथ प्रयुक्त हैं। ‘बैंगनी’ वैभव और राजसी रंग को तथा ‘गहरा लाल’ κόκκινον के चमकीले स्कारलेट रंग को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κεχρυσωμένη
  choice: सजी हुई थी
  rationale: यह सोने आदि से अलंकृत होने की अवस्था बताता है; ‘सजी हुई’ यांत्रिक ‘मढ़ी हुई’ की अपेक्षा आभूषणात्मक संदर्भ में अधिक स्वाभाविक है।
- source_word: χρυσίῳ καὶ λίθῳ τιμίῳ καὶ μαργαρίταις
  choice: सोने, बहुमूल्य पत्थरों और मोतियों से
  rationale: साधनवाचक रूपों को ‘से’ द्वारा व्यक्त किया गया है। λίθῳ τιμίῳ रूप में एकवचन है, पर सूची में जातिवाचक अर्थ होने के कारण हिन्दी में बहुवचन स्वाभाविक है।
- source_word: ποτήριον χρυσοῦν
  choice: सोने का एक प्याला
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और पात्र की सामग्री को स्पष्ट रखता है।
- source_word: γέμον
  choice: भरा हुआ था
  rationale: वर्तमान कृदंत प्याले की अवस्था बताता है; हिन्दी में परिणामसूचक वर्णन के रूप में यह सहज है।
- source_word: βδελυγμάτων
  choice: घृणित वस्तुओं
  rationale: यह βδέλυγμα की तीव्र धार्मिक-नैतिक घृणा को बनाए रखता है और केवल सामान्य अप्रियता तक अर्थ को हल्का नहीं करता।
- source_word: τὰ ἀκάθαρτα
  choice: अशुद्ध वस्तुओं
  rationale: नपुंसकलिंग बहुवचन संज्ञीकृत विशेषण को सीधे व्यक्त करता है और नैतिक तथा धार्मिक अशुद्धता की गुंजाइश बनाए रखता है।
- source_word: πορνείας
  choice: व्यभिचार
  rationale: प्रकाशितवाक्य के प्रतीकात्मक संदर्भ में यह यौन अनैतिकता और परमेश्वर-विरोधी बेवफाई, दोनों की प्रतिध्वनि रख सकता है; पादटिप्पणी अन्य सम्भव अर्थ स्पष्ट करती है।
theological_decisions:
- issue: प्रतीकात्मक दर्शन में πορνεία का अर्थ
  choice: व्यभिचार
  alternative: वेश्यावृत्ति; यौन अनैतिकता
  rationale: ‘व्यभिचार’ हिन्दी बाइबलीय और सामान्य प्रयोग में यौन पाप तथा रूपकात्मक बेवफाई दोनों का संकेत दे सकता है। इसे केवल वाणिज्यिक वेश्यावृत्ति या केवल शाब्दिक यौन आचरण तक सीमित नहीं किया गया; वास्तविक अर्थ-विस्तार पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। दृश्य की भव्यता और नैतिक अशुद्धता के तीखे विरोध को बनाए रखने के लिए वाक्य को दो स्वाभाविक हिन्दी वाक्यों में रखा गया है।
