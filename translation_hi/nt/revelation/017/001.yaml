id: REV.17.1
reference: Revelation 17:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὸ κρίμα τῆς πόρνης τῆς μεγάλης τῆς καθημένης ἐπὶ ⸀ὑδάτων πολλῶν,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/001.yaml
  text: Then one of the seven angels who had the seven bowls came and spoke with me[a], saying, “Come[b], I will show you the judgment of the great prostitute who sits on many waters,”
translation:
  language: hi
  text: फिर उन सात स्वर्गदूतों में से, जिनके पास सात कटोरे थे, एक आया और मुझसे बोला, “इधर आओ। मैं तुम्हें उस बड़ी वेश्या[b] पर होने वाला न्याय[a] दिखाऊँगा, जो बहुत-से जलों पर बैठी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दण्डादेश” अथवा “दण्ड”।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत रूप: “महावेश्या”।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: फिर
  rationale: यहाँ संयोजक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘फिर’ इस क्रमिक प्रगति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἦλθεν
  choice: आया
  rationale: ἔρχομαι का सामान्य कथात्मक अर्थ ‘आया’ है।
- source_word: εἷς ἐκ τῶν ἑπτὰ ἀγγέλων
  choice: उन सात स्वर्गदूतों में से ... एक
  rationale: अंशसूचक यूनानी रचना को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: τῶν ἐχόντων τὰς ἑπτὰ φιάλας
  choice: जिनके पास सात कटोरे थे
  rationale: यह सहभागी पदबंध उन स्वर्गदूतों की पहचान करता है; प्रकाशितवाक्य के पात्र-संबंधी बिंब में φιάλας के लिए ‘कटोरे’ सटीक और प्रचलित है।
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: मुझसे बोला
  rationale: शाब्दिक दोहराव ‘मेरे साथ बोलते हुए कहा’ हिन्दी में अस्वाभाविक होता; ‘मुझसे बोला’ संवाद और वचन-परिचय दोनों को संक्षेप में व्यक्त करता है।
- source_word: Δεῦρο
  choice: इधर आओ
  rationale: यह निकट आने का बुलावा है; ‘इधर आओ’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δείξω σοι
  choice: मैं तुम्हें ... दिखाऊँगा
  rationale: भविष्यत् सूचक क्रिया का सीधा हिन्दी रूप रखा गया है।
- source_word: τὸ κρίμα
  choice: न्याय
  rationale: κρίμα न्यायिक निर्णय, दण्डादेश या उसके परिणाम को सूचित कर सकता है; ‘न्याय’ इसकी व्यापकता बनाए रखता है।
- source_word: τῆς πόρνης τῆς μεγάλης
  choice: उस बड़ी वेश्या
  rationale: πόρνη का सीधा, वर्तमान और गरिमापूर्ण हिन्दी समतुल्य ‘वेश्या’ है; ‘बड़ी’ मूल विशेषण की प्रबलता को बनाए रखता है।
- source_word: τῆς καθημένης ἐπὶ ὑδάτων πολλῶν
  choice: जो बहुत-से जलों पर बैठी है
  rationale: प्रतीकात्मक चित्र को आगे आने वाली व्याख्या से पहले स्पष्ट किए बिना, मूल के ‘बैठी है’ और ‘जलों पर’ को संरक्षित किया गया है।
theological_decisions:
- issue: बाबुल के लिए πόρνη का रूपक
  choice: बड़ी वेश्या
  alternative: महावेश्या
  rationale: यह अनुवाद भविष्यद्वक्ताओं की यौन-आधारित विश्वासघात और भ्रष्टता की रूपक-परंपरा की तीव्रता बनाए रखता है, पर बाबुल की पहचान को किसी विशेष मतानुसार निर्धारित नहीं करता।
- issue: सर्वनाश-संबंधी प्रसंग में κρίμα
  choice: पर होने वाला न्याय
  alternative: दण्डादेश या दण्ड
  rationale: ‘न्याय’ निर्णय और उसके दण्डात्मक परिणाम—दोनों की सम्भावना खुली रखता है। हिन्दी में ‘पर होने वाला’ यह स्पष्ट करता है कि स्त्री न्याय के अधीन है, बिना अर्थ को केवल दण्ड तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘कटोरे’, ‘वेश्या’ और ‘बहुत-से जलों’ द्वारा प्रकाशितवाक्य के ठोस प्रतीकों को बनाए रखा गया है; अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
