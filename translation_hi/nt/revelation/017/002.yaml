source:
  edition: SBLGNT
  text: μεθ’ ἧς ἐπόρνευσαν οἱ βασιλεῖς τῆς γῆς, καὶ ἐμεθύσθησαν οἱ κατοικοῦντες τὴν γῆν ἐκ τοῦ οἴνου τῆς πορνείας αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/002.yaml
  text: with whom the kings of the earth committed sexual immorality[d][c][b][a], and those who dwell on the earth became drunk from the wine of her sexual immorality.
translation:
  language: hi
  text: जिसके साथ पृथ्वी के राजाओं ने व्यभिचार किया, और पृथ्वी पर रहने वाले उसके व्यभिचार की मदिरा से मतवाले हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “व्यभिचार” संभवतः भ्रष्ट, मूर्तिपूजक या विश्वासघाती गठबंधन का प्रतीक है, पर यौन रूपक का प्रभाव भी बना रहता है।
    reason: cultural_note
lexical_decisions:
- source_word: μεθ’ ἧς
  choice: जिसके साथ
  rationale: स्त्री की ओर संकेत करने वाले यूनानी संबंधवाचक विन्यास को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἐπόρνευσαν
  choice: व्यभिचार किया
  rationale: यौन रूपक की तीव्रता को बनाए रखता है और प्रकाशितवाक्य में मूर्तिपूजक, राजनीतिक अथवा विश्वासघाती गठबंधन की प्रतीकात्मक संभावना को समय से पहले सीमित नहीं करता।
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: पृथ्वी के राजा
  rationale: प्रकाशितवाक्य में बार-बार आने वाली व्यापक विश्व-संबंधी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ἐμεθύσθησαν
  choice: मतवाले हो गए
  rationale: क्रिया से उत्पन्न अवस्था को सहज और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: οἱ κατοικοῦντες τὴν γῆν
  choice: पृथ्वी पर रहने वाले
  rationale: संज्ञात्मक संक्षेप के बजाय मूल के क्रियात्मक वाक्यांश को बनाए रखता है।
- source_word: ἐκ τοῦ οἴνου
  choice: मदिरा से
  rationale: ἐκ के स्रोत अथवा कारण के भाव को हिंदी के स्वाभाविक करण-चिह्न ‘से’ द्वारा व्यक्त करता है।
- source_word: τῆς πορνείας αὐτῆς
  choice: उसकी व्यभिचार की मदिरा
  rationale: संज्ञा और पूर्ववर्ती सजातीय क्रिया के बीच संबंध बनाए रखते हुए मूल के यौन और प्रतीकात्मक रूपक को सुरक्षित रखता है।
theological_decisions:
- issue: πορνεύω/πορνεία को मुख्य पाठ में सीधे मूर्तिपूजा अथवा राजनीतिक-धार्मिक विश्वासघात के रूप में खोलना
  choice: मुख्य पाठ में ‘व्यभिचार’ का यौन रूपक बनाए रखना
  alternative: ‘आत्मिक व्यभिचार’ या ‘मूर्तिपूजक गठबंधन’ कहना
  rationale: मूल पाठ जानबूझकर यौन भाषा के माध्यम से धार्मिक और राजनीतिक भ्रष्टता का संकेत देता है; रूपक को बनाए रखने से उसकी वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और प्रकाशन-योग्य शैली। ‘मतवाले’ रूपक के अनुकूल और सामान्य पाठकों के लिए बोधगम्य है।
