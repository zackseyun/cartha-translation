  text: καὶ ἡ γυνὴ ἣν εἶδες ἔστιν ἡ πόλις ἡ μεγάλη ἡ ἔχουσα βασιλείαν ἐπὶ τῶν βασιλέων τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/018.yaml
  text: And the woman whom you saw is the great city that has dominion over the kings of the earth[a].
translation:
  language: hi
  text: और जिस स्त्री को तुमने देखा, वह महान नगर है, जिसका पृथ्वी के राजाओं पर शासन है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका पृथ्वी के राजाओं पर राज्य है।” यूनानी अभिव्यक्ति का शाब्दिक अर्थ “राज्य रखने वाली” है; इसे राजसत्ता या प्रभुत्व रखने के अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυνή
  choice: स्त्री
  rationale: दर्शन में दिखाई गई प्रतीकात्मक स्त्री के लिए यह स्वाभाविक और कम व्याख्यात्मक हिंदी शब्द है।
- source_word: ἣν εἶδες
  choice: जिस स्त्री को तुमने देखा
  rationale: संबंधवाचक उपवाक्य स्त्री की स्पष्ट पहचान करता है और हिंदी में स्वाभाविक है।
- source_word: πόλις ἡ μεγάλη
  choice: वह महान नगर
  rationale: πόλις का सामान्य अर्थ ‘नगर’ है; निश्चितता को ‘वह’ से व्यक्त किया गया है और प्रतीकात्मक पहचान को बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: ἔχουσα βασιλείαν
  choice: जिसका ... पर शासन है
  rationale: शाब्दिक रूप से ‘राज्य/राजसत्ता रखने वाला’; संदर्भ में राजाओं पर विद्यमान शासकीय अधिकार का भाव है।
- source_word: βασιλεία
  choice: शासन
  rationale: यहाँ शब्द राज्य-क्षेत्र की अपेक्षा राजसत्ता या प्रभुत्व को सूचित करता है; ‘शासन’ सहज हिंदी में उस अर्थ को व्यक्त करता है।
- source_word: ἐπὶ τῶν βασιλέων
  choice: राजाओं पर
  rationale: संबंध यहाँ अधिकार और प्रभुत्व का है, जिसे ‘पर’ स्पष्ट रूप से व्यक्त करता है।
- source_word: τῆς γῆς
  choice: पृथ्वी के
  rationale: प्रकाशितवाक्य के व्यापक सर्वपृथ्वीगत संदर्भ को बनाए रखता है और इसे किसी विशेष भूभाग तक सीमित नहीं करता।
theological_decisions:
- issue: स्त्री और नगर के बीच पहचान का स्वरूप
  choice: ‘वह वह महान नगर है’ के रूप में सीधी प्रतीकात्मक पहचान
  alternative: ‘वह उस महान नगर का प्रतीक है’
  rationale: यूनानी पाठ में साधारण संयोजक क्रिया ἔστιν (‘है’) है। सीधी पहचान बनाए रखने से पाठ के प्रतीकात्मक तनाव को व्याख्यात्मक परिभाषा द्वारा नरम नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और पाठ-सन्निकट शैली। ‘स्त्री’, ‘महान नगर’ और ‘पृथ्वी के राजा’ जैसे परिचित बाइबलीय पद रखे गए हैं; ‘शासन’ βασιλεία के प्रसंगगत राजकीय अधिकार को सहज रूप से व्यक्त करता है।
