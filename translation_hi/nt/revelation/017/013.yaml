  text: οὗτοι μίαν ⸂γνώμην ἔχουσιν⸃, καὶ τὴν δύναμιν ⸀καὶ ἐξουσίαν αὐτῶν τῷ θηρίῳ διδόασιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/017/013.yaml
  text: These are of one mind[a], and they give their power and authority to the beast.
translation:
  language: hi
  text: ये एकमत हैं[a], और अपनी सामर्थ्य और अधिकार उस पशु को देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनका एक ही उद्देश्य है।” यूनानी वाक्यांश का शाब्दिक अर्थ है, “वे एक ही मत रखते हैं”; यह उनके साझा संकल्प या उद्देश्य का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗτοι
  choice: ये
  rationale: यह संकेतवाचक सर्वनाम पिछले पद में बताए गए दस राजाओं की ओर संकेत करता है; ‘ये’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: μίαν γνώμην ἔχουσιν
  choice: एक ही मन के हैं
  rationale: यह यूनानी मुहावरे की छवि को बनाए रखता है और साझा विचार, संकल्प या उद्देश्य की व्यापक अर्थ-सीमा को खुला छोड़ता है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यह प्रभावी शक्ति या सामर्थ्य को व्यक्त करता है और अगले शब्द ‘अधिकार’ से भेद बनाए रखता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह शासन करने के अधिकार या अधिकारिता का भाव देता है और δύναμις से संबंधित, पर भिन्न, धारणा को सुरक्षित रखता है।
- source_word: τὴν δύναμιν καὶ ἐξουσίαν αὐτῶν
  choice: अपनी सामर्थ्य और अधिकार
  rationale: दोनों संज्ञाओं को बनाए रखकर वास्तविक क्षमता और शासनाधिकार के बीच का भेद सुरक्षित रखा गया है; हिन्दी में साझा संबंधसूचक ‘अपनी’ स्वाभाविक है।
- source_word: τῷ θηρίῳ
  choice: उस पशु को
  rationale: ‘पशु’ प्रकाशितवाक्य में θηρίον के लिए स्थापित और सुसंगत हिन्दी पद है; ‘उस’ संदर्भित विशिष्ट पात्र को स्पष्ट करता है।
- source_word: διδόασιν
  choice: देते हैं
  rationale: वर्तमानकालीन रूप का सीधा और स्वाभाविक हिन्दी प्रतिरूप, बिना अनावश्यक अर्थ-विस्तार के।
theological_decisions:
- issue: μίαν γνώμην ἔχουσιν का राजनीतिक-प्रलयदर्शी संदर्भ में अनुवाद
  choice: एक ही मन के हैं
  alternative: उनका एक ही उद्देश्य है
  rationale: मूल वाक्यांश साझा मत, संकल्प या उद्देश्य बता सकता है। ‘एक ही मन के हैं’ मूल मुहावरे को सुरक्षित रखते हुए अर्थ को किसी एक संभावना तक सीमित नहीं करता।
- issue: δύναμις और ἐξουσία के बीच भेद
  choice: सामर्थ्य और अधिकार
  alternative: शक्ति और शासनाधिकार
  rationale: दो अलग शब्द रखने से प्रभावी क्षमता और शासन करने के अधिकार को एक ही धारणा में मिला देने से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘एक ही मन के हैं’ जानबूझकर मूल मुहावरे और उसकी अर्थगत व्यापकता को बनाए रखता है।
