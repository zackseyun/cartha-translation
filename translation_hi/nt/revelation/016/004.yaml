source:
  edition: SBLGNT
  text: Καὶ ὁ τρίτος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τοὺς ποταμοὺς ⸀καὶ τὰς πηγὰς τῶν ὑδάτων· καὶ ἐγένετο αἷμα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/004.yaml
  text: And the third poured out his bowl into the rivers and the springs of water[a], and it became blood.
translation:
  language: hi
  text: और तीसरे ने अपना कटोरा नदियों और पानी के सोतों में उँडेल दिया, और पानी लहू बन गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τρίτος
  choice: तीसरे ने
  rationale: यूनानी में केवल निश्चित पदवाचक क्रमसूचक ‘तीसरा’ है; निकट संदर्भ से कर्ता समझ में आता है। हिन्दी में ‘तीसरे ने’ इस लोप को स्वाभाविक रूप से बनाए रखता है और ‘स्वर्गदूत’ नहीं जोड़ता।
- source_word: ἐξέχεεν
  choice: उँडेल दिया
  rationale: ἐκχέω का सामान्य अर्थ किसी द्रव को ‘उँडेलना’ है। ‘उँडेल दिया’ कटोरे से की गई पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φιάλην
  choice: कटोरा
  rationale: φιάλη चौड़े, उथले पात्र को दर्शाता है; आधुनिक हिन्दी में ‘कटोरा’ स्पष्ट और सटीक है।
- source_word: εἰς τοὺς ποταμούς
  choice: नदियों ... में
  rationale: εἰς के साथ कर्मकारक यहाँ भीतर की ओर उँडेलने का भाव देता है; हिन्दी में ‘नदियों में’ इसका सहज रूप है।
- source_word: πηγὰς τῶν ὑδάτων
  choice: पानी के सोतों
  rationale: πηγή का अर्थ सोता, झरना या जलस्रोत हो सकता है। ‘पानी के सोते’ मूल संबंध-रचना को रखते हुए सामान्य और गरिमापूर्ण हिन्दी है।
- source_word: ἐγένετο αἷμα
  choice: वे लहू बन गए
  rationale: क्रिया यूनानी में एकवचन है, पर संदर्भ में नदियाँ और पानी के सोते सामूहिक रूप से लक्षित हैं। हिन्दी में बहुवचन ‘वे ... बन गए’ रूपांतरण को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἐγένετο का निहित कर्ता
  choice: नदियाँ और पानी के सोते लहू बन गए
  alternative: पानी लहू बन गया
  rationale: निकटतम उल्लिखित वस्तुएँ नदियाँ और पानी के सोते हैं। बहुवचन सर्वनाम उनके सामूहिक रूपांतरण को स्पष्ट करता है; यह व्याकरणिक स्पष्टता है, कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘तीसरे’ में मूल यूनानी का संज्ञा-लोप सुरक्षित रखा गया है। ‘लहू’ प्रकाशितवाक्य की गम्भीर बाइबलीय शैली के अनुकूल है, जबकि वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
