id: REV.16.10
reference: Revelation 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ πέμπτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν θρόνον τοῦ θηρίου· καὶ ἐγένετο ἡ βασιλεία αὐτοῦ ἐσκοτωμένη, καὶ ἐμασῶντο τὰς γλώσσας αὐτῶν ἐκ τοῦ πόνου,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/010.yaml
  text: And the fifth poured out his bowl on the throne of the beast[a], and its kingdom became darkened, and they were gnawing their tongues because of the pain[b],
translation:
  language: hi
  text: फिर पाँचवें ने अपना कटोरा उस पशु के सिंहासन पर उंडेल दिया। उसका राज्य अंधकारमय हो गया[a], और वे पीड़ा के कारण अपनी जीभें चबाते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंधकार में डूब गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πέμπτος
  choice: पाँचवें
  rationale: यूनानी पाठ में केवल निश्चित पद के साथ क्रमवाचक विशेषण है; संदर्भ से दूत समझा जाता है, पर यहाँ उसे स्पष्ट रूप से जोड़ना आवश्यक नहीं।
- source_word: ἐξέχεεν
  choice: उंडेल दिया
  rationale: कटोरे की सामग्री को बाहर डालने की क्रिया के लिए यह स्वाभाविक और सटीक हिन्दी है।
- source_word: φιάλην
  choice: कटोरा
  rationale: यह चौड़े, उथले पात्र का सामान्य आधुनिक हिन्दी पर्याय है और प्रकाशितवाक्य के कटोरा-दंडों की छवि बनाए रखता है।
- source_word: ἐπὶ τὸν θρόνον τοῦ θηρίου
  choice: उस पशु के सिंहासन पर
  rationale: ἐπί के स्थानगत अर्थ और प्रकाशितवाक्य में θηρίον की स्थापित पशु-छवि को सीधे व्यक्त करता है।
- source_word: ἡ βασιλεία αὐτοῦ
  choice: उसका राज्य
  rationale: हिन्दी में ‘पशु’ पुल्लिंग है, इसलिए ‘उसका’ स्वाभाविक व्याकरणिक रूप है; ‘राज्य’ उसके शासन-क्षेत्र और प्रभुत्व दोनों को समेट सकता है।
- source_word: ἐσκοτωμένη
  choice: अंधकारमय हो गया
  rationale: यह परिणामस्वरूप उत्पन्न अंधकार की अवस्था को व्यक्त करता है और यूनानी निष्क्रिय कृदंत की मूल बात को बिना अतिरिक्त चित्रात्मक विस्तार के बनाए रखता है।
- source_word: ἐμασῶντο τὰς γλώσσας αὐτῶν
  choice: वे अपनी जीभें चबाने लगे
  rationale: अपूर्ण काल की जारी क्रिया को ‘लगे’ से व्यक्त किया गया है; बहुवचन ‘जीभें’ मूल पाठ के रूप का अनुसरण करता है।
- source_word: ἐκ τοῦ πόνου
  choice: पीड़ा के मारे
  rationale: ἐκ के कारणसूचक अर्थ को सहज आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: पशु के लिए सर्वनाम और राज्य का संबंध
  choice: उसका राज्य
  alternative: उस पशु का राज्य
  rationale: यूनानी में θηρίον नपुंसकलिंग है, पर हिन्दी में ‘पशु’ पुल्लिंग होने से ‘उसका’ व्याकरणसंगत है। इससे पशु को अनावश्यक रूप से मानवीकृत करने का कोई अतिरिक्त दावा नहीं किया जाता।
- issue: अंधकार के न्याय की अभिव्यक्ति
  choice: अंधकारमय हो गया
  alternative: अंधकार में डूब गया
  rationale: मुख्य पाठ यूनानी के परिणामसूचक निष्क्रिय भाव को अपेक्षाकृत औपचारिक ढंग से रखता है; अधिक चित्रात्मक, पर सम्भव, विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पाँचवें’ में संदर्भ से दूत निहित है, पर मूल पद में न होने के कारण ‘दूत’ नहीं जोड़ा गया।
