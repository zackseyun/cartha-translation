source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀τέταρτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἥλιον· καὶ ἐδόθη αὐτῷ καυματίσαι ⸂τοὺς ἀνθρώπους ἐν πυρί⸃.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/008.yaml
  text: And the fourth poured out his bowl on the sun[a], and it was given to it to scorch the people with fire.
translation:
  language: hi
  text: और चौथे ने अपना कटोरा सूर्य पर उँडेल दिया; और उसे यह दिया गया कि वह लोगों को आग से झुलसा दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ τέταρτος
  choice: चौथे ने
  rationale: सविशेषण पद यहाँ संज्ञा की तरह प्रयुक्त है और क्रम के चौथे स्वर्गदूत की ओर संकेत करता है; पर मूल में ‘स्वर्गदूत’ दोहराया नहीं गया है।
- source_word: ἐξέχεεν
  choice: उँडेल दिया
  rationale: कटोरे की विपत्ति के प्रसंग में यह स्वाभाविक हिन्दी है और क्रिया की पूर्णता व्यक्त करती है।
- source_word: φιάλην
  choice: कटोरा
  rationale: चौड़े पात्र के लिए सहज आधुनिक हिन्दी शब्द, जो प्रकाशितवाक्य की न्याय-संबंधी छवि के अनुकूल है।
- source_word: ἐπὶ τὸν ἥλιον
  choice: सूर्य पर
  rationale: ἐπί के साथ कर्मकारक यहाँ उँडेले जाने के लक्ष्य को सूचित करता है।
- source_word: ἐδόθη αὐτῷ
  choice: सूर्य को यह दिया गया
  rationale: निष्क्रिय वाक्य-रचना देने वाले को अनकहा रखती है। सर्वनाम का सबसे स्वाभाविक पूर्वपद सूर्य है; स्पष्ट हिन्दी के लिए संज्ञा दोहराई गई है, बिना ‘सामर्थ्य’ जैसे अनुपस्थित शब्द को जोड़े।
- source_word: καυματίσαι
  choice: झुलसा दे
  rationale: तीव्र ताप से जलाने या झुलसाने का सटीक और स्वाभाविक हिन्दी रूप।
- source_word: τοὺς ἀνθρώπους
  choice: लोगों को
  rationale: यह शब्द यहाँ समस्त मनुष्यों के लिए सामान्य अर्थ में है, केवल पुरुषों के लिए नहीं।
- source_word: ἐν πυρί
  choice: आग से
  rationale: साधन या रीति का स्वाभाविक हिन्दी रूप, साथ ही अग्नि की मूल छवि सुरक्षित रहती है।
theological_decisions:
- issue: ἐδόθη में निहित दैवी कर्ता
  choice: ‘दिया गया’ के निष्क्रिय रूप को बनाए रखा गया और देने वाले का नाम नहीं जोड़ा गया।
  alternative: ‘परमेश्वर ने सामर्थ्य दिया’ या ‘अनुमति दी गई’
  rationale: प्रकाशितवाक्य में ऐसा निष्क्रिय प्रयोग दैवी अनुमति या अधिकार का संकेत दे सकता है, पर इस वाक्य में कर्ता प्रत्यक्ष रूप से नहीं बताया गया।
- issue: αὐτῷ का संदर्भ
  choice: इसे सूर्य का संदर्भ माना गया।
  alternative: चौथा स्वर्गदूत या कोई अनिर्दिष्ट कर्ता
  rationale: निकटतम व्याकरणिक पूर्वपद सूर्य है और लोगों को झुलसाने की क्रिया भी सूर्य के साथ स्वाभाविक रूप से जुड़ती है।
- issue: ἀνθρώπους का सामान्य मानवीय अर्थ
  choice: ‘लोगों’
  alternative: ‘मनुष्यों’ या ‘पुरुषों’
  rationale: स्रोत शब्द यहाँ लिंग-विशेष नहीं, बल्कि सामान्य मानव समूह को सूचित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमामय और सामान्य पाठक के लिए सहज रखी गई है। ‘चौथे’ मूल की संक्षिप्तता बनाए रखता है; संदर्भ से स्वर्गदूत समझा जाता है। ‘सूर्य को यह दिया गया’ कुछ असामान्य किंतु जानबूझकर स्रोत के दैवी निष्क्रिय प्रयोग और अधिकार दिए जाने की भाषा को सुरक्षित रखता है।
