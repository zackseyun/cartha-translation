language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰσὶν γὰρ πνεύματα δαιμονίων ποιοῦντα σημεῖα, ἃ ἐκπορεύεται ἐπὶ τοὺς βασιλεῖς τῆς οἰκουμένης ὅλης, συναγαγεῖν αὐτοὺς εἰς τὸν πόλεμον τῆς ⸀ἡμέρας τῆς μεγάλης τοῦ θεοῦ τοῦ παντοκράτορος—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/014.yaml
  text: For they are spirits of demons[a], performing signs, which go out to the kings of the whole world[b], to gather them for the battle of the great day of God the Almighty—
translation:
  language: hi
  text: क्योंकि वे दुष्ट आत्माएँ[a] हैं, जो चिन्ह दिखाती हैं और सारे संसार[b] के राजाओं के पास निकलकर जाती हैं, ताकि उन्हें सर्वशक्तिमान परमेश्वर के महान दिन के युद्ध के लिए इकट्ठा करें—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “दुष्टात्माओं की आत्माएँ।”
    reason: lexical_alternative
  - marker: b
    text: या “सारे बसे हुए संसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα δαιμονίων
  choice: दुष्टात्माओं की आत्माएँ
  rationale: यह पदबंध संबंधवाचक संरचना को बनाए रखता है और δαιμονίων को बिना अनावश्यक व्याख्या के प्रस्तुत करता है। अधिक स्वाभाविक विकल्प ‘दुष्ट आत्माएँ’ है, जिसे पादटिप्पणी में दिया गया है।
- source_word: ποιοῦντα σημεῖα
  choice: चिन्ह दिखाती हैं
  rationale: यह σημεῖα को ‘चिन्ह’ के रूप में सुरक्षित रखता है और उनके वास्तविक स्वरूप या क्रियाविधि को चमत्कार अथवा छल कहकर पहले से निर्धारित नहीं करता।
- source_word: ἃ ἐκπορεύεται
  choice: वे ... निकलकर जाती हैं
  rationale: यूनानी क्रिया रूप की संख्या-संबंधी अनियमितता के बजाय बहुवचन आशय को स्पष्ट किया गया है; इसका कर्ता पहले उल्लिखित आत्माएँ हैं।
- source_word: ἐπὶ τοὺς βασιλεῖς
  choice: राजाओं के पास
  rationale: गति-सूचक संदर्भ में ἐπί यहाँ राजाओं की ओर जाने का भाव देता है, न कि अनिवार्य रूप से उनके विरुद्ध जाने का।
- source_word: τῆς οἰκουμένης ὅλης
  choice: सारे संसार
  rationale: यह वैश्विक मानवीय-राजनीतिक क्षेत्र का सहज हिन्दी रूप है; अधिक शाब्दिक ‘सारे बसे हुए संसार’ पादटिप्पणी में सुरक्षित है।
- source_word: συναγαγεῖν
  choice: इकट्ठा करें
  rationale: 'अनन्त क्रिया उद्देश्य बताती है: आत्माएँ राजाओं के पास उन्हें एकत्र करने के लिए जाती हैं।'
- source_word: εἰς τὸν πόλεμον
  choice: युद्ध के लिए
  rationale: εἰς का प्रयोजनात्मक बल स्वाभाविक हिन्दी में ‘के लिए’ से व्यक्त होता है।
- source_word: τῆς ἡμέρας τῆς μεγάλης
  choice: उस महान दिन के
  rationale: ‘उस’ से विशिष्ट महत्त्वपूर्ण न्याय-दिवस का संदर्भ स्वाभाविक हिन्दी में स्पष्ट होता है, जबकि ‘महान दिन’ की गंभीर अपोकैलिप्टिक अभिव्यक्ति बनी रहती है।
- source_word: τοῦ θεοῦ τοῦ παντοκράτορος
  choice: सर्वशक्तिमान परमेश्वर
  rationale: παντοκράτωρ के प्रतिष्ठित ईश्वरीय शीर्षक को सामान्य, गरिमापूर्ण हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: आत्माओं द्वारा किए गए चिन्हों का स्वरूप
  choice: उन्हें सीधे ‘चिन्ह’ कहा गया है, और पाठ के अनुसार उनका संबंध दुष्टात्माओं से रखा गया है।
  alternative: उन्हें केवल छल-कपट या उसी अर्थ में अलौकिक चमत्कार कहना जिसमें परमेश्वर के कार्यों को कहा जाता है।
  rationale: σημεῖα उनकी क्रियाविधि तय नहीं करता; इसलिए अनुवाद इस तनाव को खुला रखता है कि वे वास्तविक अलौकिक कार्य, भ्रामक चिन्ह, या दोनों हो सकते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे यूनानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है, पर अंतिम दीर्घ विराम-चिह्न से अगले पद के साथ मूल प्रवाह बनाए रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
