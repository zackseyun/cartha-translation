source:
  edition: SBLGNT
  text: καὶ ἐβλασφήμησαν τὸν θεὸν τοῦ οὐρανοῦ ἐκ τῶν πόνων αὐτῶν καὶ ἐκ τῶν ἑλκῶν αὐτῶν, καὶ οὐ μετενόησαν ἐκ τῶν ἔργων αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/011.yaml
  text: And they blasphemed the God of heaven because of their pains and their sores[c][b][a], and they did not repent of their deeds.
translation:
  language: hi
  text: और उन्होंने अपनी पीड़ाओं और अपने घावों[b] के कारण स्वर्ग के परमेश्वर की निन्दा की[a], और अपने कामों से मन नहीं फिराया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग के परमेश्वर को बुरा-भला कहा।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने नासूरों के कारण।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपने कामों से पश्चात्ताप नहीं किया।” मूल में कामों ‘से’ फिरने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐβλασφήμησαν
  choice: निन्दा की
  rationale: यह पद परमेश्वर के विरुद्ध अपमानजनक और अनादरपूर्ण वचन बोलने को दर्शाता है। ‘निन्दा की’ आधुनिक हिन्दी में स्पष्ट है और परमेश्वर की ओर लक्षित धार्मिक अर्थ को बनाए रखता है।
- source_word: τὸν θεὸν τοῦ οὐρανοῦ
  choice: स्वर्ग के परमेश्वर
  rationale: यह यूनानी पदबंध का सीधा और स्वाभाविक अनुवाद है तथा प्रकाशितवाक्य की गंभीर उपाधि को सुरक्षित रखता है।
- source_word: ἐκ τῶν πόνων αὐτῶν
  choice: अपनी पीड़ाओं के कारण
  rationale: इस प्रसंग में ἐκ कारण सूचित करता है। πόνος श्रम नहीं, बल्कि तीव्र शारीरिक पीड़ा को व्यक्त करता है।
- source_word: ἑλκῶν
  choice: घावों
  rationale: ἕλκος घाव, फोड़ा या नासूर के लिए प्रयुक्त हो सकता है। ‘घाव’ सहज और व्यापक है तथा मूल से अधिक विशिष्ट चिकित्सकीय अर्थ नहीं जोड़ता।
- source_word: μετενόησαν
  choice: मन नहीं फिराया
  rationale: यह केवल विचार बदलने के बजाय नैतिक और आत्मिक रूप से लौटने का भाव व्यक्त करता है, जो प्रकाशितवाक्य में μετανοέω के प्रयोग के अनुकूल है।
- source_word: ἐκ τῶν ἔργων αὐτῶν
  choice: अपने कामों से
  rationale: ἐκ यहाँ उन कामों से हटने या फिरने का भाव रखता है। ‘अपने कामों से मन नहीं फिराया’ यूनानी संरचना और आशय दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: बार-बार आए ἐκ का अर्थ
  choice: पहले दो प्रयोगों में कारण—‘पीड़ाओं और घावों के कारण’—और अंतिम प्रयोग में अलग होने या फिरने का भाव—‘कामों से मन नहीं फिराया।’
  alternative: सभी प्रयोगों को शाब्दिक रूप से ‘से’ कहना, अथवा अंतिम वाक्यांश को ‘अपने कामों पर पश्चात्ताप नहीं किया’ कहना।
  rationale: प्रसंग में उनकी पीड़ा परमेश्वर की निन्दा का अवसर बनती है, पर वे अपने कामों से नहीं फिरते। अलग-अलग हिन्दी प्रयोग यूनानी पूर्वसर्ग के प्रसंगानुसार स्वाभाविक अर्थों को दर्शाते हैं और किसी अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष को नहीं जोड़ते।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर पर सहज रखी गई है। ‘स्वर्ग के परमेश्वर’ बाइबलीय उपाधि की गरिमा बनाए रखता है; ‘मन फिराना’ धार्मिक प्रसंग में परिचित होने के साथ मूल के दिशा-परिवर्तन के भाव को भी व्यक्त करता है।
