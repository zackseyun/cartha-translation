id: REV.16.3
reference: Revelation 16:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ ⸀δεύτερος ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν θάλασσαν· καὶ ἐγένετο αἷμα ὡς νεκροῦ, καὶ πᾶσα ψυχὴ ⸀ζωῆς ἀπέθανεν ⸀τὰ ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/003.yaml
  text: And the second poured out his bowl into the sea[a], and it became blood like that of a dead man, and every living creature in the sea died.
translation:
  language: hi
  text: और दूसरे ने अपना कटोरा समुद्र में उंडेल दिया। तब समुद्र लहू बन गया—मरे हुए मनुष्य के लहू जैसा[a]—और समुद्र का हर जीवित प्राणी मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाश के लहू जैसा”; यूनानी में शाब्दिक अर्थ है, “मरे हुए व्यक्ति के जैसा लहू।”
    reason: ὡς νεκροῦ में तुलना संक्षिप्त है; पादटिप्पणी उसका अधिक शाब्दिक रूप और स्वाभाविक वैकल्पिक अनुवाद देती है।
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: दूसरे ने
  rationale: मूल पाठ में विशेषण संज्ञा के रूप में प्रयुक्त है और निकटवर्ती संदर्भ से दूसरे स्वर्गदूत की ओर संकेत करता है; पर इस पद में ‘स्वर्गदूत’ शब्द व्यक्त नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: ἐξέχεεν
  choice: उंडेल दिया
  rationale: कटोरे की सामग्री को पूरी तरह बाहर डालने की क्रिया और न्याय के दृश्य—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φιάλην
  choice: कटोरा
  rationale: φιάλη चौड़े, उथले पात्र को दर्शाता है; आधुनिक हिन्दी में ‘कटोरा’ पारंपरिक ‘शीशी’ से अधिक सटीक है।
- source_word: εἰς τὴν θάλασσαν
  choice: समुद्र में
  rationale: εἰς यहाँ सामग्री को समुद्र में उंडेलने की दिशा दर्शाता है।
- source_word: ἐγένετο αἷμα
  choice: समुद्र लहू बन गया
  rationale: γίνομαι और विधेय संज्ञा का सीधा अर्थ सुरक्षित रखा गया है; इसे केवल ‘लहू जैसा दिखाई दिया’ कहकर हल्का नहीं किया गया।
- source_word: ὡς νεκροῦ
  choice: मरे हुए मनुष्य के लहू जैसा
  rationale: νεκροῦ एकवचन में मृत व्यक्ति को सूचित करता है और निहित संज्ञा ‘लहू’ को हिन्दी में स्पष्ट करना आवश्यक है।
- source_word: πᾶσα ψυχὴ ζωῆς
  choice: हर जीवित प्राणी
  rationale: यह सामी-प्रभावित अभिव्यक्ति जीवधारी को दर्शाती है; ‘जीवित प्राणी’ आधुनिक हिन्दी में ‘जीवित प्राण’ या ‘आत्मा’ से अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: ἀπέθανεν
  choice: मर गया
  rationale: सरल क्रिया मूल यूनानी के सीधे अर्थ को बिना विस्तार के व्यक्त करती है।
- source_word: τὰ ἐν τῇ θαλάσσῃ
  choice: समुद्र का
  rationale: समुद्र में स्थित जीवधारियों की सीमा को हिन्दी में संक्षेप और स्वाभाविक ढंग से ‘समुद्र का हर जीवित प्राणी’ कहा गया है।
theological_decisions:
- issue: महामारी के दृश्य में समुद्र का लहू बनना
  choice: दर्शन में समुद्र को वास्तव में लहू बनते हुए व्यक्त किया गया है।
  alternative: ‘समुद्र लहू जैसा दिखाई देने लगा’ कहना।
  rationale: यूनानी पाठ ‘लहू बन गया’ कहता है और फिर उस लहू की तुलना मृत व्यक्ति के लहू से करता है। अनुवाद न्याय की तीव्रता और दर्शनीय तनाव को कम नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दूसरे’ में संदर्भगत स्वर्गदूत को निहित रहने दिया गया है, और डैश से लहू की भयावह तुलना स्पष्ट की गई है।
