id: REV.16.12
reference: Revelation 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὁ ἕκτος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ποταμὸν τὸν μέγαν ⸀τὸν Εὐφράτην· καὶ ἐξηράνθη τὸ ὕδωρ αὐτοῦ, ἵνα ἑτοιμασθῇ ἡ ὁδὸς τῶν βασιλέων τῶν ἀπὸ ἀνατολῆς ἡλίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/012.yaml
  text: And the sixth poured out his bowl on the great river Euphrates[a], and its water was dried up, so that the way of the kings from the rising of the sun might be prepared.
translation:
  language: hi
  text: और छठे ने अपना कटोरा महान नदी, फरात पर उँडेल दिया। उसका जल सूख गया, ताकि सूर्योदय की ओर से आनेवाले राजाओं का मार्ग तैयार हो जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक सरल रूप में, “पूर्व से।” शाब्दिक रूप से, “सूर्योदय की ओर से।”
    reason: ‘ἀπὸ ἀνατολῆς ἡλίου’ का सामान्य अर्थ ‘पूर्व से’ है, जबकि मुख्य पाठ मूल की सजीव शाब्दिक छवि को बनाए रखता है।
lexical_decisions:
- source_word: ὁ ἕκτος
  choice: छठे ने
  rationale: मूल यूनानी में केवल निश्चित पदवाचक क्रमसूचक शब्द है; संदर्भ से पात्र स्पष्ट है। इसलिए ‘स्वर्गदूत’ जोड़कर निहित अर्थ को मुख्य पाठ में स्पष्ट नहीं किया गया।
- source_word: ἐξέχεεν
  choice: उँडेल दिया
  rationale: यह कटोरे की वस्तु को किसी पर डालने की क्रिया को स्वाभाविक और सजीव हिन्दी में व्यक्त करता है तथा न्याय के कटोरों की आवर्ती छवि बनाए रखता है।
- source_word: φιάλην
  choice: कटोरा
  rationale: φιάλη चौड़े पात्र को सूचित करता है; आधुनिक हिन्दी में ‘कटोरा’ सहज और उपयुक्त है, जबकि ‘शीशी’ भ्रामक होगी।
- source_word: ἐπὶ τὸν ποταμὸν τὸν μέγαν τὸν Εὐφράτην
  choice: महान नदी फरात पर
  rationale: यह नदी के वर्णन और नाम की समानाधिकरण संरचना को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐξηράνθη τὸ ὕδωρ αὐτοῦ
  choice: उसका जल सूख गया
  rationale: अर्थ और परिणामी अवस्था दोनों स्पष्ट रहते हैं। हिन्दी में यह प्रयोग यूनानी निष्क्रिय रूप की अपेक्षा अधिक स्वाभाविक है, बिना कर्ता जोड़े।
- source_word: ἵνα ἑτοιμασθῇ
  choice: ताकि … तैयार हो जाए
  rationale: यह ἵνα के प्रयोजनार्थक बल को और निष्क्रिय भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡ ὁδὸς τῶν βασιλέων
  choice: राजाओं का मार्ग
  rationale: यह संबंधकारक संरचना को बनाए रखता है और ‘मार्ग’ के भौतिक तथा प्रतीकात्मक दोनों संभावित अर्थों को खुला छोड़ता है।
- source_word: τῶν ἀπὸ ἀνατολῆς ἡλίου
  choice: सूर्य के उदय की ओर से आनेवाले
  rationale: यह यूनानी मुहावरे की दृश्यात्मकता को सुरक्षित रखता है; ‘पूर्व से’ अधिक संक्षिप्त विकल्प है, जिसे पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या ‘छठे’ को स्पष्ट करके ‘छठे स्वर्गदूत’ लिखा जाए
  choice: केवल ‘छठे’ रखा गया।
  alternative: छठे स्वर्गदूत ने
  rationale: आस-पास के संदर्भ में पात्र स्वर्गदूत है, पर इस पद के यूनानी पाठ में संज्ञा दुहराई नहीं गई। अनुवाद मूल की लोपयुक्त अभिव्यक्ति बनाए रखता है।
- issue: फरात के सूखने और राजाओं के आने का प्रतीकात्मक अर्थ
  choice: दृश्य को बिना व्याख्यात्मक विस्तार के सीधे अनूदित किया गया।
  alternative: इसे आक्रमण या अंतिम युद्ध के लिए एकत्र होने की स्पष्ट व्याख्या के रूप में प्रस्तुत करना
  rationale: यह पद अपने प्रतीकों का पूरा अर्थ स्वयं नहीं बताता; इसलिए अनुवाद किसी विशिष्ट अंत-कालीन व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘जल’ और ‘मार्ग’ प्रकाशन-साहित्य के गंभीर स्वर के अनुकूल हैं; वाक्यरचना मूल के क्रम और उद्देश्य-संबंध को यथासंभव बनाए रखती है।
