  edition: SBLGNT
  text: καὶ ἤκουσα τοῦ θυσιαστηρίου λέγοντος· Ναί, κύριε, ὁ θεός, ὁ παντοκράτωρ, ἀληθιναὶ καὶ δίκαιαι αἱ κρίσεις σου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/007.yaml
  text: And I heard the altar saying[a], “Yes, Lord God, the Almighty, true and just are your judgments.”
translation:
  language: hi
  text: और मैंने वेदी को यह कहते सुना[a], “हाँ, हे प्रभु परमेश्वर, सर्वशक्तिमान, तेरे न्याय-निर्णय सच्चे और न्यायपूर्ण हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने वेदी की ओर से यह कहते सुना।” यूनानी रचना सुनी गई बात का स्रोत बता सकती है, यद्यपि शब्दावली सबसे स्वाभाविक रूप से वेदी को बोलते हुए दिखाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤκουσα
  choice: मैंने ... सुना
  rationale: ἀκούω के अओरिस्ट रूप को सामान्य भूतकाल में प्रस्तुत किया गया है; इससे सुनने की घटना व्यक्त होती है, बिना जानबूझकर ध्यान से सुनने का अतिरिक्त भाव जोड़े।
- source_word: τοῦ θυσιαστηρίου λέγοντος
  choice: वेदी को यह कहते
  rationale: संबंधकारक रचना सुनाई देने के स्रोत को सूचित कर सकती है, पर λέγοντος के साथ सबसे स्वाभाविक अर्थ वेदी का मानवीकरण करके उसे बोलते हुए दिखाना है।
- source_word: Ναί
  choice: हाँ
  rationale: यह प्रबल सहमति और प्रत्युत्तर का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: κύριε, ὁ θεός, ὁ παντοκράτωρ
  choice: हे प्रभु परमेश्वर, सर्वशक्तिमान
  rationale: सम्बोधन में आए तीनों दैवी पदों को सुरक्षित रखा गया है। 'हे' हिन्दी में प्रत्यक्ष सम्बोधन स्पष्ट करता है, और 'सर्वशक्तिमान' παντοκράτωρ का प्रतिष्ठित तथा सहज रूप है।
- source_word: ἀληθιναὶ καὶ δίκαιαι
  choice: सच्चे और न्यायपूर्ण
  rationale: 'दोनों विशेषणों को अलग रखा गया है: ἀληθιναί न्यायों की सत्यता/विश्वसनीयता और δίκαιαι उनकी न्यायसंगतता व्यक्त करता है।'
- source_word: αἱ κρίσεις σου
  choice: तेरे न्याय
  rationale: κρίσεις यहाँ न्यायिक निर्णयों अथवा न्याय के कार्यों को सूचित करता है। 'न्याय' हिन्दी में संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: वेदी का वक्ता के रूप में मानवीकरण
  choice: “मैंने वेदी को यह कहते सुना”
  alternative: “मैंने वेदी से यह कहते सुना” अथवा “मैंने वेदी से एक आवाज़ सुनी”
  rationale: यूनानी पाठ में वेदी के साथ बोलने वाला कृदन्त है। वेदी को बोलते हुए रखना प्रकाशितवाक्य की सजीव दर्शनीय भाषा बचाता है और पाठ में अनुपस्थित 'आवाज़' नहीं जोड़ता।
- issue: प्रत्यक्ष सम्बोधन में दैवी उपाधियाँ
  choice: “हे प्रभु परमेश्वर, सर्वशक्तिमान”
  alternative: “हे प्रभु, हे सर्वशक्तिमान परमेश्वर”
  rationale: κύριε, ὁ θεός और ὁ παντοκράτωρ—तीनों तत्व सुरक्षित रखे गए हैं, पर हिन्दी में सहज सम्बोधन-क्रम अपनाया गया है।
- issue: ἀληθιναί और δίκαιαι का भेद
  choice: “सच्चे और न्यायपूर्ण”
  alternative: “सत्य और धर्मी”
  rationale: यह रूप परमेश्वर के न्यायों की वास्तविक सत्यता और उनकी न्यायसंगतता दोनों को स्पष्ट रखता है, बिना किसी एक अवधारणा में दोनों को मिला देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। परमेश्वर के लिए एकवचन निकट/परंपरागत सम्बोधन 'तेरे' रखा गया है; वेदी का मानवीकरण और मूल के दैवी पद सुरक्षित हैं।
