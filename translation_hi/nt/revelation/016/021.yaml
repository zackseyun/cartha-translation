id: REV.16.21
reference: Revelation 16:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ χάλαζα μεγάλη ὡς ταλαντιαία καταβαίνει ἐκ τοῦ οὐρανοῦ ἐπὶ τοὺς ἀνθρώπους· καὶ ἐβλασφήμησαν οἱ ἄνθρωποι τὸν θεὸν ἐκ τῆς πληγῆς τῆς χαλάζης, ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/021.yaml
  text: And great hail[a], about a talent in weight, comes down from heaven upon the people; and the people blasphemed God because of the plague of the hail[b], because its plague is exceedingly severe.
translation:
  language: hi
  text: और आकाश से मनुष्यों पर लगभग एक तोड़े के भार के बड़े-बड़े ओले[a] गिरते हैं। ओलों की इस विपत्ति के कारण मनुष्यों ने परमेश्वर की निन्दा की, क्योंकि यह विपत्ति अत्यन्त भयंकर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक टैलेंट के भार जैसे।” प्राचीन टैलेंट का भार स्थान और काल के अनुसार अलग था; यहाँ आशय प्रत्येक ओले के असाधारण भारी होने से है।
    reason: प्राचीन भार-माप और यूनानी ὡς द्वारा व्यक्त तुलना को स्पष्ट करना
lexical_decisions:
- source_word: χάλαζα μεγάλη
  choice: बड़े-बड़े ओले
  rationale: यूनानी में सामूहिक एकवचन है, पर स्वाभाविक हिन्दी में इस प्रसंग के अलग-अलग विशाल ओलों को बहुवचन में व्यक्त करना अधिक स्पष्ट है।
- source_word: ὡς ταλαντιαία
  choice: लगभग एक तोड़े के भार के
  rationale: ὡς तुलना अथवा अनुमान व्यक्त करता है, इसलिए ‘लगभग’ रखा गया है; ‘तोड़ा’ बाइबलीय भार-माप टैलेंट के लिए प्रचलित हिन्दी रूप है।
- source_word: καταβαίνει
  choice: गिरते हैं
  rationale: वर्तमान काल की सजीवता बनाए रखी गई है; ओलों के लिए ‘गिरते हैं’ स्वाभाविक हिन्दी है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: आकाश से
  rationale: ओलों के गिरने के तात्कालिक वायुमण्डलीय अर्थ में ‘आकाश’ स्वाभाविक है, जबकि प्रकाशितवाक्य के न्याय-संबंधी ऊर्ध्व स्रोत का भाव भी बना रहता है।
- source_word: ἐπὶ τοὺς ἀνθρώπους
  choice: मनुष्यों पर
  rationale: ἄνθρωποι सभी मानव व्यक्तियों के लिए सामान्य शब्द है; ‘मनुष्यों’ से लिंग-समावेशी और सटीक अर्थ मिलता है।
- source_word: ἐβλασφήμησαν
  choice: निन्दा की
  rationale: परमेश्वर के विरुद्ध अपमानजनक वाणी के लिए ‘निन्दा की’ आधुनिक, गंभीर और धर्मशास्त्रीय रूप से उपयुक्त पद है।
- source_word: ἐκ τῆς πληγῆς τῆς χαλάζης
  choice: ओलों की इस विपत्ति के कारण
  rationale: ἐκ यहाँ कारण बताता है और πληγή प्रकाशितवाक्य में दैवी प्रहार/विपत्ति को सूचित करता है; ‘विपत्ति’ हिन्दी में महामारी तक सीमित हुए बिना अर्थ पहुँचाती है।
- source_word: ὅτι μεγάλη ἐστὶν ἡ πληγὴ αὐτῆς σφόδρα
  choice: क्योंकि यह विपत्ति अत्यन्त भयंकर थी
  rationale: μεγάλη ... σφόδρα की तीव्रता को स्वाभाविक हिन्दी में व्यक्त किया गया है। कथात्मक प्रवाह में ‘थी’ सहज है, यद्यपि यूनानी में वर्तमान काल है।
theological_decisions:
- issue: 'οὐρανός का अर्थ: आकाश या स्वर्ग'
  choice: आकाश से
  alternative: स्वर्ग से
  rationale: ओलों के गिरने के प्रत्यक्ष दृश्य में ‘आकाश’ प्राथमिक प्राकृतिक अर्थ देता है। फिर भी ‘स्वर्ग से’ सम्भव है और न्याय के दैवी स्रोत पर अधिक बल देता; मूल शब्द दोनों अर्थ ग्रहण कर सकता है।
- issue: πληγή को किस प्रकार व्यक्त किया जाए
  choice: विपत्ति
  alternative: महामारी / प्रहार
  rationale: प्रकाशितवाक्य में यह दैवी दण्ड से आई घोर आपदा है। ‘विपत्ति’ प्रसंग के व्यापक अर्थ को रखती है और आधुनिक हिन्दी में ‘महामारी’ से उत्पन्न रोग-विशेष की अनचाही धारणा से बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सरल। ‘बड़े-बड़े ओले’ और ‘गिरते हैं’ स्वाभाविक हिन्दी देते हैं; ‘तोड़ा’ को पादटिप्पणी में टैलेंट से स्पष्ट किया गया है। मुख्य पाठ में एकमात्र पादटिप्पणी-सूचक [a] उपस्थित है।
