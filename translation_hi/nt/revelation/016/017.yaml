source:
  edition: SBLGNT
  text: Καὶ ὁ ἕβδομος ἐξέχεεν τὴν φιάλην αὐτοῦ ἐπὶ τὸν ἀέρα— καὶ ἐξῆλθεν φωνὴ μεγάλη ⸀ἐκ τοῦ ⸀ναοῦ ἀπὸ τοῦ θρόνου λέγουσα· Γέγονεν—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/017.yaml
  text: And the seventh poured out his bowl into the air[a], and a loud voice came out from the sanctuary, from the throne, saying[b], “It has come to pass.”
translation:
  language: hi
  text: और सातवें ने अपना कटोरा हवा में उँडेल दिया, और पवित्रस्थान में से, सिंहासन की ओर से, एक ऊँची आवाज़ निकली, जो कह रही थी, “हो गया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरा हो गया है।”
    reason: Γέγονεν के समापनसूचक अर्थ को व्यक्त करने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ὁ ἕβδομος
  choice: सातवें
  rationale: यूनानी में केवल निश्चित पदवाचक क्रमसूचक शब्द है; संदर्भ से सातवाँ स्वर्गदूत समझ में आता है, पर मुख्य पाठ में ‘स्वर्गदूत’ जोड़कर मूल की लोप-रचना को नहीं भरा गया।
- source_word: ἐξέχεεν
  choice: उँडेल दिया
  rationale: कटोरे की सामग्री को बाहर डालने की क्रिया के लिए यह स्वाभाविक हिन्दी है और पूर्ण क्रिया को स्पष्ट करती है।
- source_word: φιάλην
  choice: कटोरा
  rationale: φιάλη चौड़े, उथले पात्र को सूचित करता है; ‘कटोरा’ आधुनिक हिन्दी में स्वाभाविक है और ‘शीशी’ जैसे भ्रामक अर्थ से बचता है।
- source_word: ἐπὶ τὸν ἀέρα
  choice: हवा में
  rationale: गति-सूचक प्रसंग में ἐπί + कर्मकारक का स्वाभाविक हिन्दी रूप, लक्ष्य-क्षेत्र को दर्शाता है।
- source_word: ἐξῆλθεν φωνὴ μεγάλη
  choice: एक ऊँची आवाज़ निकली
  rationale: φωνὴ μεγάλη का स्वाभाविक अर्थ तेज़/ऊँची आवाज़ है; ‘निकली’ ἐξῆλθεν की बाहर आने की गति को बनाए रखता है।
- source_word: ἐκ τοῦ ναοῦ
  choice: पवित्रस्थान में से
  rationale: ναός व्यापक मन्दिर-परिसर के बजाय विशेषतः भीतरी पवित्रस्थान को सूचित करता है।
- source_word: ἀπὸ τοῦ θρόνου
  choice: सिंहासन की ओर से
  rationale: यह वाणी के स्रोत को सिंहासन से जोड़ता है और ‘पवित्रस्थान में से’ के साथ मूल के दोहरे स्रोत-वर्णन को बनाए रखता है।
- source_word: λέγουσα
  choice: जो कह रही थी
  rationale: स्त्रीलिंग कृदन्त φωνή से मेल खाता है; हिन्दी में सम्बन्धवाचक उपवाक्य से उसका सम्बन्ध स्पष्ट और स्वाभाविक रहता है।
- source_word: Γέγονεν
  choice: पूरा हो चुका है
  rationale: γίνομαι के पूर्णकालिक, परिणामसूचक बल को व्यक्त करता है और इस चरम घोषणा में स्वाभाविक है; इसे केवल ‘हो गया’ कहने की अपेक्षा सम्पन्नता की वर्तमान परिणति अधिक स्पष्ट होती है।
theological_decisions:
- issue: प्रकाशितवाक्य के स्वर्गीय मन्दिर-दृश्य में ναός का अनुवाद
  choice: पवित्रस्थान
  alternative: मन्दिर
  rationale: 'यह शब्द-आधारित निर्णय है: ναός भीतरी पवित्रस्थान पर केन्द्रित है, जबकि ‘मन्दिर’ पूरे परिसर का व्यापक बोध करा सकता है।'
- issue: Γέγονεν की पूर्णकालिक और समापनसूचक घोषणा
  choice: पूरा हो चुका है
  alternative: यह घटित हो चुका है / हो गया
  rationale: चुना हुआ रूप पूर्ण हुई घटना और उसकी बनी हुई परिणति दोनों को व्यक्त करता है, बिना यह जोड़े कि ठीक कौन-सी वस्तु पूरी हुई है। परिचित संक्षिप्त विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। मूल की ‘सातवें’ वाली लोप-रचना रखी गई है; ‘पवित्रस्थान’ और ‘सिंहासन’ के दोहरे स्रोत-वर्णन को मिलाया नहीं गया।
