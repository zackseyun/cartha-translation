source:
  edition: SBLGNT
  text: καὶ ἐγένετο ἡ πόλις ἡ μεγάλη εἰς τρία μέρη, καὶ αἱ πόλεις τῶν ἐθνῶν ἔπεσαν· καὶ Βαβυλὼν ἡ μεγάλη ἐμνήσθη ἐνώπιον τοῦ θεοῦ δοῦναι αὐτῇ τὸ ποτήριον τοῦ οἴνου τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/019.yaml
  text: And the great city was split into three parts[a], and the cities of the nations fell. And Babylon the great was remembered before God, to give her the cup of the wine of the fury of his wrath.
translation:
  language: hi
  text: और वह महान नगर तीन भागों में बँट गया, और राष्ट्रों के नगर गिर पड़े। और महान बाबेल परमेश्वर के सामने स्मरण में आई[a], ताकि वह उसे अपने क्रोध के प्रकोप की मदिरा का प्याला दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “परमेश्वर के सामने उसका स्मरण हुआ।” यह बाइबिलीय मुहावरा यहाँ न्याय के लिए परमेश्वर के ध्यान में आने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο ... εἰς τρία μέρη
  choice: तीन भागों में बँट गया
  rationale: 'यह परिणामसूचक रचना है: नगर तीन भागों में हो गया। ‘बँट गया’ स्वाभाविक हिन्दी में विभाजन का आशय स्पष्ट करता है।'
- source_word: ἡ πόλις ἡ μεγάλη
  choice: वह महान नगर
  rationale: निश्चित उपपद को ‘वह’ से व्यक्त करते हुए प्रकाशितवाक्य में पहले से उल्लिखित प्रतीकात्मक नगर की ओर संकेत बनाए रखा गया है।
- source_word: αἱ πόλεις τῶν ἐθνῶν
  choice: राष्ट्रों के नगर
  rationale: ἔθνη के वैश्विक अर्थ को ‘राष्ट्र’ व्यक्त करता है और अनावश्यक रूप से केवल गैर-यहूदियों तक सीमित नहीं करता।
- source_word: ἔπεσαν
  choice: गिर पड़े
  rationale: मूल के सजीव विनाश-दृश्य को बनाए रखता है; ‘ढह गए’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: Βαβυλὼν ἡ μεγάλη
  choice: महान बाबेल
  rationale: पारंपरिक बाइबिलीय नाम ‘बाबेल’ रखते हुए विशेषण का बल सुरक्षित रखा गया है।
- source_word: ἐμνήσθη ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने स्मरण किया गया
  rationale: दैवी न्याय के लिए ध्यान में आने वाले बाइबिलीय मुहावरे को समझाकर सपाट किए बिना मूल के निकट रखा गया है।
- source_word: δοῦναι αὐτῇ
  choice: ताकि वह उसे ... दे
  rationale: अनन्त क्रिया के प्रयोजन/परिणाम संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और कर्ता परमेश्वर को स्पष्ट करता है।
- source_word: τὸ ποτήριον τοῦ οἴνου
  choice: मदिरा का प्याला
  rationale: न्याय में दिए गए भाग के बाइबिलीय रूपक ‘प्याला’ और मदिरा की छवि दोनों सुरक्षित हैं।
- source_word: τοῦ θυμοῦ τῆς ὀργῆς αὐτοῦ
  choice: अपने प्रचण्ड क्रोध की
  rationale: संबंधित दोनों यूनानी संज्ञाओं की तीव्रता को स्वाभाविक हिन्दी में ‘प्रचण्ड क्रोध’ द्वारा व्यक्त किया गया है; कृत्रिम ‘कोप के रोष’ से बचा गया है।
theological_decisions:
- issue: ἐμνήσθη ἐνώπιον τοῦ θεοῦ में न्याय-संबंधी स्मरण
  choice: परमेश्वर के सामने स्मरण किया गया
  alternative: परमेश्वर ने उसे न्याय के लिए याद किया
  rationale: चुना गया पाठ मूल के निष्क्रिय बाइबिलीय मुहावरे और उसके धार्मिक तनाव को बनाए रखता है; पादटिप्पणी संदर्भगत न्यायार्थ बताती है, पर मुख्य पाठ में उसे आरोपित नहीं करती।
- issue: θυμός और ὀργή की संयुक्त तीव्रता
  choice: प्रचण्ड क्रोध
  alternative: कोप के रोष
  rationale: यूनानी में दो निकटार्थक न्याय-शब्द तीव्रता बढ़ाते हैं। हिन्दी में संज्ञा-विशेषण संयोजन उसी बल को स्वाभाविक ढंग से देता है, यद्यपि शब्दभेद को औपचारिक रूप से पुनरुत्पादित नहीं करता।
- issue: Babylon के लिए स्त्रीलिंग सर्वनाम αὐτῇ
  choice: उसे
  alternative: उस स्त्री को
  rationale: नगर का मानवीकरण मूल में व्याकरणिक और प्रतीकात्मक है; हिन्दी का लिंग-निरपेक्ष ‘उसे’ अनावश्यक व्याख्या जोड़े बिना संदर्भ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘महान नगर’, ‘राष्ट्रों के नगर’, ‘मदिरा’ और ‘प्याला’ से प्रकाशितवाक्य की प्रतीकात्मक तथा बाइबिलीय छवियाँ सुरक्षित रखी गई हैं।
