  yaml_path: translation/nt/revelation/016/016.yaml
  text: And he gathered them to the place that in Hebrew is called Armageddon[a][b].
translation:
  language: hi
  text: और उसने[a] उन्हें उस स्थान पर इकट्ठा किया, जो इब्रानी में[b] हर-मगिदोन कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी क्रिया एकवचन है: ‘उसने इकट्ठा किया।’ कर्ता की पहचान स्पष्ट नहीं है; पिछले संदर्भ (पद 13–14) में अशुद्ध आत्माएँ राजाओं को इकट्ठा करने जाती हैं, इसलिए संदर्भ के आधार पर ‘उन्होंने इकट्ठा किया’ भी समझा गया है।'
    reason: मूल पाठ में एकवचन क्रिया और संदर्भ में संभावित बहुवचन कर्ता के बीच की वास्तविक अस्पष्टता को सुरक्षित रखना।
  - marker: b
    text: या ‘इब्रानी/अरामी भाषा में।’ प्रकाशितवाक्य में ‘इब्रानी में’ सामी नाम-रूप को दर्शा सकता है; इससे इब्रानी और अरामी के बीच कठोर भेद करना आवश्यक नहीं है।
    reason: Ἑβραϊστὶ की भाषायी व्याप्ति का वैकल्पिक अर्थ बताना।
lexical_decisions:
- source_word: συνήγαγεν
  choice: उसने … इकट्ठा किया
  rationale: यूनानी क्रिया एकवचन है, इसलिए हिंदी में एकवचन कर्ता को बनाए रखा गया है। कर्ता का स्पष्ट नाम पाठ में नहीं है; इस अस्पष्टता और पिछले पदों के बहुवचन अशुद्ध आत्माओं से संभावित संबंध को पादटिप्पणी में रखा गया है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह कर्मकारक बहुवचन सर्वनाम है और संदर्भ में इकट्ठे किए जा रहे राजाओं की ओर संकेत करता है।
- source_word: τὸν τόπον
  choice: उस स्थान
  rationale: τόπος का स्वाभाविक और गरिमापूर्ण हिंदी अनुवाद ‘स्थान’ है; निश्चितता को ‘उस’ से व्यक्त किया गया है।
- source_word: τὸν καλούμενον
  choice: कहलाता है
  rationale: यह कर्मवाच्य कृदंत ‘स्थान’ का विशेषण है; हिंदी में ‘कहलाता है’ इसका स्वाभाविक वर्तमानकालीन रूप है।
- source_word: Ἑβραϊστὶ
  choice: इब्रानी में
  rationale: यह प्रकाशितवाक्य में प्रयुक्त पद का पारदर्शी अनुवाद है। इसका आशय व्यापक रूप से इब्रानी/अरामी सामी नाम-रूप भी हो सकता है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: Ἁρμαγεδών
  choice: हर-मगिदोन
  rationale: यूनानी नाम का हिंदी में प्रचलित बाइबलीय लिप्यंतरण चुना गया है; योजक चिह्न संभावित सामी नाम-रचना को भी पठनीय बनाता है।
theological_decisions:
- issue: इकट्ठा करने वाला कर्ता
  choice: उसने उन्हें इकट्ठा किया
  alternative: उन्होंने उन्हें इकट्ठा किया / किसी ने उन्हें इकट्ठा किया
  rationale: मूल यूनानी क्रिया व्याकरणतः एकवचन है, इसलिए मुख्य पाठ में उसे बहुवचन नहीं बनाया गया। फिर भी एकवचन कर्ता की पहचान स्पष्ट नहीं है, जबकि पद 13–14 में अशुद्ध आत्माएँ राजाओं को इकट्ठा करने निकलती हैं; पादटिप्पणी इस साहित्यिक और धर्मवैचारिक तनाव को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। ‘इकट्ठा किया,’ ‘स्थान’ और ‘कहलाता है’ सामान्य पाठकों के लिए स्पष्ट हैं। मूल यूनानी के एकवचन को मुख्य पाठ में रखा गया है और संदर्भगत बहुवचन संभावना को पादटिप्पणी में सुरक्षित किया गया है।
