language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκαυματίσθησαν οἱ ἄνθρωποι καῦμα μέγα· καὶ ⸀ἐβλασφήμησαν τὸ ὄνομα τοῦ θεοῦ τοῦ ἔχοντος ⸀τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας, καὶ οὐ μετενόησαν δοῦναι αὐτῷ δόξαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/009.yaml
  text: And the people were scorched with great heat[a], and they blasphemed the name of God, who has authority over these plagues[b], and they did not repent to give him glory.
translation:
  language: hi
  text: और लोग प्रचंड गर्मी से झुलस गए, और उन्होंने परमेश्वर के नाम की निन्दा की, जिसका इन विपत्तियों पर अधिकार है, और उन्होंने मन नहीं फिराया कि उसे महिमा दें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκαυματίσθησαν
  choice: झुलस गए
  rationale: यह क्रिया तीव्र ताप से जलने या झुलसने का भाव देती है। ‘झुलस गए’ आधुनिक हिन्दी में स्वाभाविक है और पूर्णतः भस्म होने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: οἱ ἄνθρωποι
  choice: लोग
  rationale: यहाँ पुल्लिंग बहुवचन सामान्य मानव-समुदाय को सूचित करता है, केवल पुरुषों को नहीं; इसलिए ‘लोग’ समावेशी और स्वाभाविक है।
- source_word: καῦμα μέγα
  choice: प्रचंड गरमी
  rationale: μέγα यहाँ ताप की तीव्रता बताता है। ‘प्रचंड गरमी’ मूल अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करती है।
- source_word: ἐβλασφήμησαν
  choice: निन्दा की
  rationale: परमेश्वर के नाम के संबंध में यह क्रिया अनादरपूर्ण और ईशनिन्दात्मक वाणी को दर्शाती है। ‘निन्दा की’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: परमेश्वर के नाम
  rationale: यह मूल बाइबलीय मुहावरे को बनाए रखता है, जिसमें ‘नाम’ परमेश्वर की प्रकट पहचान और सम्मान का प्रतिनिधित्व करता है।
- source_word: τοῦ ἔχοντος τὴν ἐξουσίαν ἐπὶ τὰς πληγὰς ταύτας
  choice: जिसका इन विपत्तियों पर अधिकार है
  rationale: वर्तमान कृदन्त ἔχοντος और ἐξουσία के अधिकार-सूचक अर्थ को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: πληγὰς
  choice: विपत्तियों
  rationale: प्रकाशितवाक्य के न्याय-संदर्भ में πληγή दैवी दण्ड की विपत्तियों को सूचित करता है और निर्गमन की विपत्तियों की प्रतिध्वनि भी बनाए रखता है।
- source_word: οὐ μετενόησαν
  choice: मन नहीं फिराया
  rationale: यह नैतिक और आत्मिक पश्चात्ताप को व्यक्त करने वाला प्रचलित, अर्थपूर्ण हिन्दी मुहावरा है; केवल विचार बदलने तक अर्थ को सीमित नहीं करता।
- source_word: δοῦναι αὐτῷ δόξαν
  choice: कि उसे महिमा दें
  rationale: यह infinitive को पश्चात्ताप के अपेक्षित परिणाम या उद्देश्य के रूप में व्यक्त करता और ‘महिमा देना’ वाला बाइबलीय मुहावरा बनाए रखता है।
theological_decisions:
- issue: οἱ ἄνθρωποι का दायरा
  choice: 'सामान्य मानव-संदर्भ: ‘लोग’'
  alternative: ‘पुरुष’ या ‘मनुष्य’
  rationale: संदर्भ में न्याय के अधीन सामान्य लोग हैं, केवल पुरुष नहीं। ‘लोग’ इस व्यापक दायरे को बिना लैंगिक भ्रम के व्यक्त करता है।
- issue: इन विपत्तियों पर परमेश्वर का अधिकार
  choice: परमेश्वर को इन विपत्तियों पर अधिकार रखने वाला कहा गया है
  alternative: परमेश्वर को केवल विपत्तियों से संबद्ध बताना
  rationale: मूल पाठ स्पष्ट रूप से परमेश्वर के ἐξουσία रखने की बात कहता है। अनुवाद इस दावे को न नरम करता है, न उससे आगे कोई अतिरिक्त सिद्धान्त जोड़ता है।
- issue: पश्चात्ताप और महिमा देने का संबंध
  choice: ‘मन नहीं फिराया कि उसे महिमा दें’
  alternative: ‘उन्होंने मन नहीं फिराया और उसे महिमा नहीं दी’
  rationale: δοῦναι infinitive पश्चात्ताप से संबद्ध उद्देश्य, परिणाम या विषय की कुछ व्याकरणिक लचक रखता है। चुना हुआ रूप मूल संरचना और उसके तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। ‘प्रचंड गरमी’, ‘झुलस गए’, ‘निन्दा’, ‘अधिकार’ और ‘मन फिराना’ मूल के अर्थ तथा प्रकाशितवाक्य के न्यायपूर्ण, गंभीर स्वर को बनाए रखते हैं। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
