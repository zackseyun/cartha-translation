id: REV.16.1
reference: Revelation 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤκουσα ⸂μεγάλης φωνῆς⸃ ἐκ τοῦ ναοῦ λεγούσης τοῖς ἑπτὰ ἀγγέλοις· Ὑπάγετε καὶ ⸀ἐκχέετε τὰς ἑπτὰ φιάλας τοῦ θυμοῦ τοῦ θεοῦ εἰς τὴν γῆν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/001.yaml
  text: And I heard a loud voice from the sanctuary saying to the seven angels[b][a], “Go and pour out the seven bowls of the wrath of God onto the earth.”
translation:
  language: hi
  text: और मैंने पवित्रस्थान[a] में से एक ऊँची आवाज़ सुनी, जो सात स्वर्गदूतों से कह रही थी, “जाओ और परमेश्वर के प्रकोप के सात कटोरे[b] पृथ्वी पर उँडेल दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मन्दिर”; यूनानी शब्द ναός प्रायः पूरे मन्दिर-परिसर के बजाय उसके भीतरी पवित्रस्थान को अधिक विशेष रूप से दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द φιάλας का अर्थ चौड़े या उथले “कटोरे” है; कुछ पुराने अनुवादों में इसके लिए “प्याले” या “शीशियाँ” मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μεγάλης φωνῆς
  choice: एक ऊँची आवाज़
  rationale: φωνή के साथ μέγας आवाज़ की तीव्रता को व्यक्त करता है; आधुनिक हिन्दी में ‘ऊँची आवाज़’ स्वाभाविक और स्पष्ट है।
- source_word: ναοῦ
  choice: पवित्रस्थान
  rationale: ναός सामान्यतः पूरे मन्दिर-परिसर के बजाय उसके भीतरी पवित्र भाग को सूचित करता है; प्रकाशितवाक्य के स्वर्गीय दृश्य में ‘पवित्रस्थान’ इस विशिष्टता को बनाए रखता है।
- source_word: λεγούσης
  choice: जो ... कह रही थी
  rationale: वर्तमान कृदन्त φωνῆς से सम्बद्ध है; हिन्दी का सम्बन्धवाचक उपवाक्य अर्थ और दृश्य की जीवंतता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ὑπάγετε
  choice: जाओ
  rationale: यह स्वर्गदूतों को जाकर कार्य करने की सीधी आज्ञा है; ‘जाओ’ इसका सहज हिन्दी रूप है।
- source_word: ἐκχέετε
  choice: उँडेल दो
  rationale: यह पात्र की सामग्री को बाहर डाल देने की क्रिया और आज्ञा की पूर्णता, दोनों को सजीव रूप से व्यक्त करता है।
- source_word: φιάλας
  choice: कटोरे
  rationale: φιάλη चौड़े, अपेक्षाकृत उथले पात्र को दर्शाता है; ‘कटोरे’ आधुनिक हिन्दी में ‘शीशियों’ की अपेक्षा अधिक सटीक है।
- source_word: θυμοῦ τοῦ θεοῦ
  choice: परमेश्वर के प्रकोप से भरे
  rationale: ‘प्रकोप’ न्याय से सम्बद्ध तीव्र दिव्य क्रोध की गंभीरता रखता है। ‘से भरे’ सम्बन्धवाचक प्रयोग को स्वाभाविक हिन्दी में स्पष्ट करता है और निकटवर्ती प्रसंग में कटोरों के प्रकोप से भरे होने के अनुरूप है।
- source_word: εἰς τὴν γῆν
  choice: पृथ्वी पर
  rationale: ἐκχέω के साथ εἰς यहाँ किसी सतह या क्षेत्र की ओर गति बताता है; विश्वव्यापी न्याय के प्रसंग में ‘पृथ्वी पर’ स्वाभाविक है।
theological_decisions:
- issue: स्वर्गीय दृश्य में ναός का अनुवाद
  choice: पवित्रस्थान
  alternative: मन्दिर
  rationale: ‘पवित्रस्थान’ भीतरी पवित्र भाग की सम्भावित विशिष्टता बनाए रखता है, जबकि पादटिप्पणी व्यापक अर्थ ‘मन्दिर’ को भी सामने रखती है।
- issue: θυμός τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का प्रकोप
  alternative: परमेश्वर का क्रोध
  rationale: ‘प्रकोप’ दिव्य न्याय की गंभीर और तीव्र अभिव्यक्ति को व्यक्त करता है, बिना पाठ से परे कोई सिद्धान्त जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘सातों’, ‘उँडेल दो’ और सम्बन्धवाचक वाक्य-विन्यास सामान्य पाठक के लिए सहज हैं; साथ ही सर्वनाश-साहित्य की गंभीरता बनी रहती है।
