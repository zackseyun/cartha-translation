  text: καὶ ἤκουσα τοῦ ἀγγέλου τῶν ὑδάτων λέγοντος· Δίκαιος εἶ, ὁ ὢν καὶ ὁ ἦν, ⸀ὁ ὅσιος, ὅτι ταῦτα ἔκρινας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/005.yaml
  text: And I heard the angel of the waters saying[a], “Righteous are you, the one who is and who was, the Holy One[c][b], because you have judged these things.”
translation:
  language: hi
  text: फिर मैंने जलों के स्वर्गदूत[c] को यह कहते सुना[a], “तू धर्मी है—जो है और जो था, हे पवित्र—क्योंकि तूने इन बातों का न्याय किया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हस्तलिपियों में अधिक विस्तृत उपाधि मिलती है, जैसे ‘जो है, जो था और जो आनेवाला है’; सम्भवतः यह प्रकाशितवाक्य में अन्यत्र आए समान कथनों के अनुरूप किया गया था। यहाँ अपनाए गए यूनानी पाठ में है: ‘जो है और जो था, हे पवित्र।’'
    reason: textual_variant
  - marker: b
    text: या, ‘तू न्यायी है।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘जलों पर नियुक्त स्वर्गदूत।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ ἀγγέλου τῶν ὑδάτων
  choice: जलों के स्वर्गदूत
  rationale: सम्बन्धकारक रचना का निकट और स्वाभाविक अनुवाद है। सन्दर्भ में यह जलों से सम्बद्ध या उन पर नियुक्त स्वर्गदूत हो सकता है, पर मुख्य पाठ यूनानी की अस्पष्टता बनाए रखता है।
- source_word: Δίκαιος
  choice: धर्मी
  rationale: यहाँ शब्द परमेश्वर के चरित्र और उसके न्याय की नैतिक सत्यता बताता है। ‘धर्मी’ उपासना-प्रधान लहजे को बनाए रखता है; ‘न्यायी’ सम्भव विकल्प है।
- source_word: ὁ ὢν καὶ ὁ ἦν
  choice: जो है और जो था
  rationale: प्रकाशितवाक्य में प्रयुक्त इस विशिष्ट ईश्वरीय उपाधि को निकटता से रखा गया है और अनावश्यक रूप से भविष्यसूचक पद नहीं जोड़ा गया।
- source_word: ὁ ὅσιος
  choice: हे पवित्र जन
  rationale: ὅσιος नैतिक और वाचा-संबंधी पवित्रता का बोध देता है। सम्बोधन के रूप में ‘हे पवित्र जन’ आधुनिक हिन्दी में स्पष्ट है और इसे पिछले ईश्वरीय विशेषणों से अलग उपाधि के रूप में बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह परमेश्वर को धर्मी कहने का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध को साफ व्यक्त करता है।
- source_word: ταῦτα
  choice: इन बातों
  rationale: यूनानी में सामान्य संकेतवाचक पद है। सन्दर्भ न्याय के कार्यों का है, फिर भी ‘इन न्यायों’ कहने के बजाय मूल की व्यापकता रखी गई है।
- source_word: ἔκρινας
  choice: तूने ... न्याय किया है
  rationale: अओरिस्ट क्रिया को ऐसे पूर्ण कार्य के रूप में व्यक्त किया गया है जिसका वर्तमान उद्घोष में महत्त्व है। ‘न्याय किया’ भी सम्भव है।
theological_decisions:
- issue: ईश्वरीय उपाधि में अपेक्षित भविष्यसूचक अंश का न होना
  choice: जो है और जो था, हे पवित्र जन
  alternative: जो है, जो था और जो आनेवाला है
  rationale: SBLGNT में ὁ ὢν καὶ ὁ ἦν, ὁ ὅσιος है; इसलिए अन्य पदों के अधिक परिचित सूत्र से सामंजस्य बैठाकर ‘जो आनेवाला है’ नहीं जोड़ा गया। पाठभेद को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ὁ ὅσιος का वाक्यगत सम्बन्ध
  choice: इसे सम्बोधनात्मक ईश्वरीय उपाधि ‘हे पवित्र जन’ के रूप में रखा गया
  alternative: ‘पवित्र जन’ को ‘जो है और जो था’ के साथ एक नामसूची की तरह पढ़ना
  rationale: यूनानी रूप नामसूचक उपाधि है और विराम-चिह्न व्याख्यात्मक हैं। हिन्दी में सम्बोधन से स्तुतिपरक वाक्य स्वाभाविक बनता है, जबकि मूल की विशिष्ट उपाधि बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और उपासना-संगत शैली। ‘तू’ का प्रयोग परमेश्वर के प्रति निकट, पारम्परिक एकवचन सम्बोधन के रूप में है, अपमानसूचक अर्थ में नहीं। ‘जलों’ बहुवचन मूल τῶν ὑδάτων को दर्शाता है।
