source:
  edition: SBLGNT
  text: Καὶ ἀπῆλθεν ὁ πρῶτος καὶ ἐξέχεεν τὴν φιάλην αὐτοῦ εἰς τὴν γῆν· καὶ ἐγένετο ἕλκος κακὸν καὶ πονηρὸν ἐπὶ τοὺς ἀνθρώπους τοὺς ἔχοντας τὸ χάραγμα τοῦ θηρίου καὶ τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/002.yaml
  text: And the first went and poured out his bowl onto the earth[a], and a harmful and grievous sore came upon the people who had the mark of the beast and who worshiped its image.
translation:
  language: hi
  text: पहला गया और उसने अपना कटोरा पृथ्वी पर उँडेल दिया। तब जिन लोगों पर पशु की छाप थी और जो उसकी मूर्ति की आराधना करते थे, उन पर एक हानिकारक और पीड़ादायक घाव हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक घिनौना और भयंकर घाव।” यूनानी में दो प्रबल विशेषण, κακόν और πονηρόν, इस विपत्ति की भयावहता पर जोर देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ πρῶτος
  choice: पहले ने
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण को उसी तरह रखा गया है; प्रसंग से इसका संकेत सात स्वर्गदूतों में से पहले की ओर है, पर ‘स्वर्गदूत’ शब्द पाठ में नहीं जोड़ा गया।
- source_word: ἐξέχεεν τὴν φιάλην αὐτοῦ
  choice: अपना कटोरा ... उँडेल दिया
  rationale: φιάλη के लिए ‘कटोरा’ प्रकाशितवाक्य के संदर्भ में सहज और स्पष्ट है; ἐκχέω की पूर्ण क्रिया को ‘उँडेल दिया’ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἰς τὴν γῆν
  choice: पृथ्वी पर
  rationale: εἰς यहाँ कटोरे की सामग्री के लक्ष्य की ओर संकेत करता है। ‘पृथ्वी पर’ हिंदी में स्वाभाविक है और γῆ के व्यापक अर्थ को बनाए रखता है।
- source_word: ἕλκος
  choice: घाव
  rationale: ἕλκος किसी फोड़ेदार या नासूरी घाव को दर्शाता है। ‘घाव’ सामान्य पाठक के लिए स्पष्ट है और ‘फोड़ा’ जैसी अनावश्यक चिकित्सकीय विशिष्टता नहीं जोड़ता।
- source_word: κακὸν καὶ πονηρὸν
  choice: बुरा और पीड़ादायक
  rationale: दोनों प्रबल विशेषणों को अलग-अलग रखकर विपत्ति की तीव्रता बचाई गई है। ‘पीड़ादायक’ πονηρός के इस प्रसंगगत हानिकारक और कष्टकर भाव को व्यक्त करता है, जबकि नैतिक बुराई का अर्थ थोपता नहीं।
- source_word: τὸ χάραγμα τοῦ θηρίου
  choice: पशु की छाप
  rationale: χάραγμα के लिए ‘छाप’ स्पष्ट और प्रकाशितवाक्य की पहचान-संबंधी भाषा के अनुरूप है; θηρίον का सहज हिंदी रूप ‘पशु’ है।
- source_word: τοὺς προσκυνοῦντας τῇ εἰκόνι αὐτοῦ
  choice: जो उसकी मूर्ति की आराधना करते थे
  rationale: προσκυνέω यहाँ धार्मिक नमन या उपासना को दर्शाता है, इसलिए ‘आराधना करते थे’ उपयुक्त है। αὐτοῦ का निकटतम संदर्भ पशु है।
theological_decisions:
- issue: κακὸν καὶ πονηρὸν के दोहरे विशेषणों का अर्थ
  choice: बुरा और पीड़ादायक घाव
  alternative: घिनौना और भयंकर घाव; बुरा और दुष्ट घाव
  rationale: मूल पाठ विपत्ति की गंभीरता बढ़ाने के लिए दो निकटार्थी नकारात्मक विशेषण जोड़ता है। चुना हुआ रूप दोनों को बनाए रखता है और घाव को नैतिक रूप से ‘दुष्ट’ बताने की अपेक्षा उसके कष्टकारी स्वरूप पर बल देता है; वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
- issue: दंड पाने वालों की सीमा
  choice: जिन लोगों पर पशु की छाप थी और जो उसकी मूर्ति की आराधना करते थे
  alternative: सामान्य रूप से सभी लोग
  rationale: पाठ दो सहभागी विशेषणों द्वारा दंड पाने वालों को पशु की छाप रखने और उसकी मूर्ति की आराधना करने वाले लोगों तक स्पष्ट रूप से सीमित करता है।
- issue: ὁ πρῶτος में निहित कर्ता
  choice: पहले ने
  alternative: पहले स्वर्गदूत ने
  rationale: प्रसंग में कर्ता पहला स्वर्गदूत है, पर मूल वाक्य में संज्ञा दोहराई नहीं गई। संक्षिप्त रूप मूल की अभिव्यक्ति और प्रसंगगत संकेत दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। ‘पहले ने’ मूल की संक्षिप्तता बचाता है; ‘कटोरा’, ‘छाप’ और ‘आराधना’ प्रकाशितवाक्य की प्रमुख छवियों को स्पष्ट रखते हैं। फुटनोट चिह्न [a] मुख्य पाठ में उपस्थित है।
