  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἰδοὺ ἔρχομαι ὡς κλέπτης. μακάριος ὁ γρηγορῶν καὶ τηρῶν τὰ ἱμάτια αὐτοῦ, ἵνα μὴ γυμνὸς περιπατῇ καὶ βλέπωσιν τὴν ἀσχημοσύνην αὐτοῦ—
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/015.yaml
  text: Behold[a], I am coming like a thief. Blessed is the one who stays awake and keeps his garments[b], so that he may not walk about naked and they see his shame—
translation:
  language: hi
  text: “देखो, मैं चोर के समान आ रहा हूँ। धन्य है वह जो जागता रहता है और अपने वस्त्र सँभालकर रखता है, ताकि वह नंगा न फिरे और लोग उसकी लज्जा न देखें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले उद्गार की शक्ति बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक तथा गंभीर है।
- source_word: ἔρχομαι
  choice: मैं ... आ रहा हूँ
  rationale: वर्तमान काल की सजीवता और निकट/भावी आगमन का भाव हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὡς κλέπτης
  choice: चोर के समान
  rationale: आगमन के अनपेक्षित होने की उपमा को बनाए रखता है, बिना किसी नैतिक समानता को आरोपित किए।
- source_word: μακάριος
  choice: धन्य
  rationale: धन्य-वचन की धार्मिक और गंभीर ध्वनि को बनाए रखता है; केवल मनोवैज्ञानिक प्रसन्नता तक अर्थ को सीमित नहीं करता।
- source_word: ὁ γρηγορῶν
  choice: वह जो जागता रहता
  rationale: शाब्दिक जागते रहने और रूपकात्मक चौकसी, दोनों के लिए जगह छोड़ता है।
- source_word: τηρῶν τὰ ἱμάτια αὐτοῦ
  choice: अपने वस्त्र सँभालकर रखता है
  rationale: τηρέω के रखने, सुरक्षित रखने और रक्षा करने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है तथा वस्त्रों की ठोस और संभावित प्रतीकात्मक छवि बनाए रखता है।
- source_word: γυμνὸς περιπατῇ
  choice: नंगा न फिरे
  rationale: चलते-फिरते उजागर होने की ठोस छवि को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: βλέπωσιν
  choice: लोग ... देखें
  rationale: यूनानी के अनिर्दिष्ट तृतीय-पुरुष बहुवचन को हिन्दी में स्वाभाविक अनिर्दिष्ट कर्ता से व्यक्त करता है।
- source_word: τὴν ἀσχημοσύνην αὐτοῦ
  choice: उसकी लज्जाजनक दशा
  rationale: लज्जा और अनुचित शारीरिक अनावरण दोनों की अर्थ-छाया को व्यक्त करता है, बिना केवल ‘नंगापन’ दोहराए।
theological_decisions:
- issue: प्रकाशितवाक्य के संदर्भ में वस्त्र और नग्नता का रूपकात्मक अर्थ
  choice: मुख्य पाठ में ‘वस्त्र’, ‘नंगा’ और ‘लज्जाजनक दशा’ की ठोस छवि को बनाए रखना
  alternative: वस्त्रों को नैतिक तत्परता/धर्मी कर्म और नग्नता को अंतिम अपमान के रूप में स्पष्ट करके अनुवाद करना
  rationale: संदर्भ में प्रतीकात्मक अर्थ संभव है, पर यूनानी पाठ स्वयं उसकी स्पष्ट व्याख्या नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
- issue: ὁ γρηγορῶν का प्रतिनिधिक एकवचन
  choice: ‘वह जो’ के साथ एकवचन संरचना रखना
  alternative: बहुवचन ‘वे जो’ द्वारा लिंग-तटस्थ पुनर्रचना
  rationale: यूनानी में कृदंत व्याकरणिक रूप से पुल्लिंग एकवचन है और प्रतिनिधिक अर्थ रखता है; हिन्दी में यह संरचना स्वाभाविक रूप से सुरक्षित रहती है।
- issue: वाक्य के अंत का पाठीय प्रवाह
  choice: स्वतंत्र पद के रूप में पूर्णविराम देना
  alternative: स्रोत में दिखाई गई दीर्घ विराम-रेखा को ज्यों का त्यों रखना
  rationale: यूनानी पांडुलिपीय पाठ में आधुनिक विराम-चिह्न मूल रचना का अंग नहीं हैं; हिन्दी में पद को पूर्ण वाक्य के रूप में प्रस्तुत करना पठनीय है और अर्थ नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, सहज और प्रकाशनयोग्य धार्मिक गद्य। ‘देखो’ उद्गार को वर्तमान भाषा में बोधगम्य रखता है; ‘वस्त्र’ ऊँचे किंतु सामान्य रजिस्टर में है। प्रतीकात्मक अर्थ को मुख्य पाठ में नहीं खोला गया है।
