  text: ὅτι αἷμα ἁγίων καὶ προφητῶν ἐξέχεαν, καὶ αἷμα αὐτοῖς ⸀δέδωκας πιεῖν· ἄξιοί εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/006.yaml
  text: because they poured out the blood of saints and prophets[a], and you have given them blood to drink[b]; they are worthy.
translation:
  language: hi
  text: क्योंकि उन्होंने पवित्र जनों और भविष्यद्वक्ताओं का खून बहाया[a], और तुमने उन्हें खून पीने को दिया है; वे इसके योग्य हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी क्रिया का शाब्दिक अर्थ ‘उँडेलना’ है। यह आसपास के प्रसंग में दण्ड के कटोरे उँडेले जाने की प्रतिध्वनि भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: ‘वे इसके योग्य हैं’ का अर्थ है कि वे इस दण्ड के पात्र हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद में स्वर्गदूत की घोषणा का कारण बताता है; आधुनिक हिन्दी में स्पष्ट कारणसूचक शब्द।
- source_word: αἷμα
  choice: खून
  rationale: दोनों स्थानों पर एक ही प्रत्यक्ष शब्द रखकर प्रतिफलात्मक न्याय की पुनरुक्ति सुरक्षित की गई है; सामान्य आधुनिक हिन्दी में ‘खून बहाना’ और ‘खून पीना’ स्वाभाविक हैं।
- source_word: ἁγίων
  choice: पवित्र जनों
  rationale: यह प्रकाशितवाक्य में परमेश्वर के पवित्र लोगों को सूचित करता है और बाद की किसी औपचारिक संत-श्रेणी का अर्थ आरोपित नहीं करता।
- source_word: προφητῶν
  choice: भविष्यद्वक्ताओं
  rationale: मूल शब्द का सीधा और प्रचलित हिन्दी प्रतिरूप।
- source_word: ἐξέχεαν
  choice: बहाया
  rationale: खून के साथ हिन्दी का स्वाभाविक प्रयोग है; पादटिप्पणी मूल क्रिया के शाब्दिक ‘उँडेलना’ और आसपास के कटोरा-दण्डों से उसकी प्रतिध्वनि बताती है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: अपराधियों की ओर संकेत करने वाले सम्प्रदान कारक का स्वाभाविक हिन्दी रूप।
- source_word: δέδωκας
  choice: तूने ... दिया है
  rationale: पूर्णकालीन यूनानी क्रिया के पूरे हुए और वर्तमान प्रभाव रखने वाले भाव को हिन्दी के पूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: πιεῖν
  choice: पीने को
  rationale: ‘दिया है’ की प्रयोजनसूचक infinitive रचना का सहज हिन्दी रूप।
- source_word: ἄξιοί εἰσιν
  choice: वे इसी योग्य हैं
  rationale: मूल का गंभीर न्यायिक मूल्यांकन बनाए रखा गया है; ‘इसी’ निकटवर्ती दण्ड की ओर संकेत करता है, पर ‘वे इसके पात्र हैं’ जैसी अधिक व्याख्यात्मक भाषा मुख्य पाठ में नहीं लाई गई।
theological_decisions:
- issue: प्रतिफलात्मक न्याय की भाषा
  choice: ‘तूने उन्हें खून पीने को दिया है; वे इसी योग्य हैं’ की कठोर और आनुपातिक न्याय-भाषा बनाए रखी गई।
  alternative: ‘तूने उन्हें बदले में खून पीने को दिया; वे इसी दण्ड के पात्र हैं।’
  rationale: मूल पाठ न्याय को बिना नरम किए प्रस्तुत करता है। साथ ही ‘बदले में’ जैसे स्पष्टकारी शब्द मूल में नहीं हैं, इसलिए उन्हें मुख्य पाठ में नहीं जोड़ा गया।
- issue: ἅγιοι का अभिप्राय
  choice: ‘पवित्र जनों’ द्वारा परमेश्वर के पवित्र लोगों का व्यापक बाइबलीय अर्थ।
  alternative: ‘संतों’
  rationale: ‘पवित्र जन’ आधुनिक पाठक के लिए अर्थ स्पष्ट करता है और किसी बाद की कलीसियाई पदवी या औपचारिक संत-श्रेणी का संकेत देने से बचता है।
- issue: ἄξιοί εἰσιν का मूल्यांकन
  choice: ‘वे इसी योग्य हैं’
  alternative: ‘वे इस दण्ड के पात्र हैं’ अथवा ‘वे इसी के लायक हैं।’
  rationale: ‘योग्य’ मूल के औपचारिक मूल्यांकन और उसकी संक्षिप्तता को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ प्रशंसा नहीं, दण्ड के योग्य होना अभिप्रेत है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर को संबोधन में प्रसंगानुकूल एकवचन ‘तू’ रखा गया है। ‘खून’ की पुनरावृत्ति और न्याय की तीव्रता सुरक्षित हैं; अस्पष्ट मूल्यांकन को पादटिप्पणी में समझाया गया है।
