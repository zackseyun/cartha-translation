id: REV.16.13
reference: Revelation 16:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶδον ἐκ τοῦ στόματος τοῦ δράκοντος καὶ ἐκ τοῦ στόματος τοῦ θηρίου καὶ ἐκ τοῦ στόματος τοῦ ψευδοπροφήτου πνεύματα ⸂τρία ἀκάθαρτα⸃ ὡς βάτραχοι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/013.yaml
  text: And I saw three unclean spirits like frogs coming out of the mouth of the dragon[a], out of the mouth of the beast, and out of the mouth of the false prophet.
translation:
  language: hi
  text: और मैंने अजगर के मुँह से, उस पशु के मुँह से और झूठे भविष्यद्वक्ता के मुँह से तीन अशुद्ध आत्माओं को निकलते देखा, जो मेंढकों जैसी थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, मूल यूनानी के शब्द-क्रम के अधिक निकट: ‘और मैंने अजगर के मुँह से, उस पशु के मुँह से और झूठे भविष्यद्वक्ता के मुँह से मेंढकों जैसी तीन अशुद्ध आत्माएँ देखीं।’'
    reason: यूनानी में तीनों स्रोत-वाक्यांश ‘तीन अशुद्ध आत्माएँ’ से पहले आते हैं; मुख्य पाठ स्वाभाविक हिन्दी के लिए ‘निकलते’ द्वारा निहित गति को स्पष्ट करता है।
lexical_decisions:
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: दर्शन-वर्णन में अओरिस्ट क्रिया का स्वाभाविक हिन्दी कथात्मक रूप; ‘देखा’ प्रत्यक्ष दृश्य अनुभव को स्पष्ट रखता है।
- source_word: ἐκ ... τοῦ στόματος
  choice: के मुँह से ... निकलते
  rationale: ἐκ स्रोत अथवा भीतर से बाहर आने का भाव व्यक्त करता है। हिन्दी में ‘मुँह से निकलते’ निहित गति को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: δράκοντος
  choice: अजगर
  rationale: प्रकाशितवाक्य में δράκων के लिए स्थापित बाइबलीय हिन्दी शब्द, जो प्रतीकात्मक विशाल सर्पाकार प्राणी की छवि बनाए रखता है।
- source_word: θηρίου
  choice: उस पशु
  rationale: θηρίον के अपोकैलिप्टिक प्रतीक को बनाए रखने के लिए ‘पशु’; निश्चित पद और पूर्व-संदर्भ को ‘उस’ से व्यक्त किया गया है।
- source_word: ψευδοπροφήτου
  choice: झूठे भविष्यद्वक्ता
  rationale: यौगिक संज्ञा का सीधा और प्रचलित हिन्दी समतुल्य; शीर्षक-सदृश भूमिका भी बनी रहती है।
- source_word: πνεύματα
  choice: आत्माओं
  rationale: यहाँ शब्द आत्मिक सत्ताओं को सूचित करता है; ‘आत्माएँ’ मानक और प्रसंगानुकूल हिन्दी है।
- source_word: τρία ἀκάθαρτα
  choice: तीन अशुद्ध
  rationale: ἀκάθαρτα के धार्मिक और नैतिक दोनों अर्थ-संकेतों को ‘अशुद्ध’ बनाए रखता है; संख्या और विशेषण को हिन्दी के स्वाभाविक क्रम में रखा गया है।
- source_word: ὡς βάτραχοι
  choice: जो मेंढकों जैसी थीं
  rationale: ὡς तुलना दर्शाता है, पहचान नहीं। यह रूप स्पष्ट करता है कि आत्माएँ मेंढक नहीं, उनके जैसी दिखाई देती थीं।
theological_decisions:
- issue: πνεύματα ἀκάθαρτα की अपोकैलिप्टिक प्रकृति
  choice: ‘तीन अशुद्ध आत्माएँ’ कहा गया है, बिना उन्हें इसी पद में स्पष्टतः दुष्टात्माएँ बताने के।
  alternative: ‘मेंढकों जैसी तीन दुष्टात्माएँ’
  rationale: यूनानी पाठ इस पद में ‘अशुद्ध आत्माएँ’ कहता है; अगले पद की व्याख्या को यहाँ पहले से जोड़ना उचित नहीं। इससे मूल की धार्मिक तनावपूर्णता और क्रम सुरक्षित रहता है।
- issue: ὡς βάτραχοι में तुलना का स्वरूप
  choice: ‘मेंढकों जैसी थीं’
  alternative: ‘मेंढक थीं’
  rationale: ὡς उपमा का चिह्न है; अनुवाद को आत्माओं और मेंढकों के बीच पूर्ण पहचान स्थापित नहीं करनी चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अजगर’, ‘पशु’, ‘झूठा भविष्यद्वक्ता’ और ‘अशुद्ध आत्माएँ’ प्रकाशितवाक्य की स्थापित प्रतीकात्मक शब्दावली को बनाए रखते हैं। मुख्य वाक्य में यूनानी के अग्रस्थ स्रोत-वाक्यांश यथासंभव सुरक्षित हैं, जबकि ‘निकलते’ जोड़कर हिन्दी में संबंध स्पष्ट किया गया है।
