lexical_decisions:
- source_word: πᾶσα
  choice: हर एक
  rationale: एकवचन νῆσος के साथ πᾶσα का वितरणात्मक भाव है; ‘हर एक’ प्रत्येक द्वीप पर अलग-अलग बल देता है।
- source_word: νῆσος
  choice: द्वीप
  rationale: यह शब्द सीधे ‘द्वीप’ को सूचित करता है।
- source_word: ἔφυγεν
  choice: भाग गया
  rationale: φεύγω का मूल अर्थ ‘भागना’ है। यह अनुवाद प्रकाशितवाक्य के सजीव मानवीकरण को बनाए रखता है; प्रसंग में परिणाम लुप्त हो जाना है।
- source_word: ὄρη
  choice: पहाड़ों
  rationale: बहुवचन ὄρη के लिए आधुनिक सामान्य हिन्दी में ‘पहाड़’ स्वाभाविक है।
- source_word: οὐχ εὑρέθησαν
  choice: का कहीं पता न चला
  rationale: शाब्दिक भाव ‘नहीं पाए गए’ है। हिन्दी का यह स्वाभाविक निष्क्रिय-अर्थक प्रयोग उनके न मिल पाने को व्यक्त करता है, बिना यह जोड़े कि उन्हें खोजने की क्षमता नहीं थी।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों समुच्चयबोधकों को रखकर मूल की संचयी, समानाधिकरण शैली सुरक्षित रहती है।
