  choice: ‘द्वीप भाग गया’ कहकर सजीव, ठोस चित्र को बनाए रखा गया है
  alternative: ‘द्वीप लुप्त हो गया’ या ‘गायब हो गया’
  rationale: यूनानी पाठ मानवीकरण के साथ ठोस प्रलयकारी चित्र प्रस्तुत करता है। अनुवाद को यह तय नहीं करना चाहिए कि उसका अभिप्राय शाब्दिक है या प्रतीकात्मक।
translation_notes:
