revisions:
- from: तब बिजली चमकी, अनेक ध्वनियाँ और गरजें सुनाई दीं, और एक बड़ा भूकम्प आया। जब से पृथ्वी पर मनुष्य अस्तित्व में आए थे, तब से ऐसा भूकम्प कभी नहीं आया था—वह इतना बड़ा था।[a]
  to: और बिजलियाँ चमकीं, ध्वनियाँ और गरजनाएँ हुईं, और एक बड़ा भूकम्प आया। जब से मनुष्य पृथ्वी पर आए हैं, तब से ऐसा बड़ा भूकम्प कभी नहीं आया था—इतना बड़ा भूकम्प।
  rationale: The revision removes unsupported «अनेक» and the unsupported textual-variant note, uses coordination rather than an added temporal sequence, represents the plural lightning flashes explicitly, and preserves the source’s final emphatic repetition of “earthquake.” «मनुष्य» naturally denotes humanity inclusively in modern standard Hindi, while «ध्वनियाँ» leaves φωναὶ appropriately ambiguous.
