id: REV.16.18
reference: Revelation 16:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγένοντο ἀστραπαὶ καὶ ⸂φωναὶ καὶ βρονταί⸃, καὶ σεισμὸς ⸀ἐγένετο μέγας, οἷος οὐκ ἐγένετο ἀφ’ οὗ ⸂ἄνθρωποι ἐγένοντο⸃ ἐπὶ τῆς γῆς τηλικοῦτος σεισμὸς οὕτω μέγας,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/016/018.yaml
  text: And there were flashes of lightning and sounds and peals of thunder, and there was a great earthquake, such as had not happened since men came to be on the earth—so great was that earthquake.
translation:
  language: hi
  text: और बिजलियाँ चमकीं, ध्वनियाँ और गरजनाएँ हुईं, और एक बड़ा भूकम्प आया। जब से मनुष्य पृथ्वी पर आए हैं, तब से ऐसा बड़ा भूकम्प कभी नहीं आया था—इतना बड़ा भूकम्प।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀστραπαὶ
  choice: बिजली चमकी
  rationale: बहुवचन का आशय बार-बार चमकने वाली बिजली है; हिन्दी में सामूहिक एकवचन के साथ यह स्वाभाविक अभिव्यक्ति है।
- source_word: φωναὶ
  choice: अनेक ध्वनियाँ
  rationale: φωνή यहाँ ‘आवाज़ें’ या ‘ध्वनियाँ’ हो सकता है। ‘ध्वनियाँ’ गैर-व्यक्तिगत श्रव्य घटनाओं के लिए उपयुक्त है और वाणी होने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: βρονταί
  choice: गरजें
  rationale: बहुवचन रूप बार-बार होने वाली गर्जना को दर्शाता है; ‘गरजें’ संक्षिप्त और स्वाभाविक है।
- source_word: σεισμὸς μέγας
  choice: एक बड़ा भूकम्प
  rationale: यह मानक, स्पष्ट अनुवाद है और μέγας की तीव्रता को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: οἷος οὐκ ἐγένετο
  choice: ऐसा भूकम्प कभी नहीं आया था
  rationale: तुलनात्मक वाक्यांश भूकम्प की अभूतपूर्व प्रबलता बताता है; हिन्दी में यह स्वाभाविक भूतकालीन अभिव्यक्ति है।
- source_word: ἀφ’ οὗ
  choice: जब से … तब से
  rationale: मूल के कालवाचक अर्थ को स्पष्ट और सहज हिन्दी संरचना में व्यक्त करता है।
- source_word: ἄνθρωποι ἐγένοντο ἐπὶ τῆς γῆς
  choice: पृथ्वी पर मनुष्य अस्तित्व में आए थे
  rationale: ἄνθρωποι समस्त मानवजाति को सूचित करता है, न कि केवल पुरुषों को; ‘अस्तित्व में आए’ ἐγένοντο के अर्थ को निकटता से रखता है।
- source_word: τηλικοῦτος σεισμὸς οὕτω μέγας
  choice: वह इतना बड़ा था
  rationale: मूल की पुनरुक्त, उत्कट समाप्ति को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἄνθρωποι का सार्वभौमिक मानवीय संदर्भ
  choice: मनुष्य
  alternative: लोग / मानवजाति
  rationale: इस ऐतिहासिक तुलना में यूनानी बहुवचन पूरी मानवता को समावेशी रूप से सूचित करता है। हिन्दी ‘मनुष्य’ मूल के मानवीय संदर्भ को गरिमापूर्ण ढंग से रखता है और पुरुष-मात्र का अर्थ नहीं देता।
- issue: φωναὶ का स्वरूप
  choice: ध्वनियाँ
  alternative: आवाज़ें / वाणियाँ
  rationale: संदर्भ में यह आकाशीय या वातावरणीय ध्वनियों का उल्लेख हो सकता है। ‘ध्वनियाँ’ वास्तविक अस्पष्टता बनाए रखता है और इन्हें निश्चित रूप से बोली हुई वाणी नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण अपोकैलिप्टिक शैली रखी गई है। वाक्य सहज पठनीय है, पर मूल की पुनरुक्त तीव्रता और अभूतपूर्व भूकम्प पर बल सुरक्षित है।
