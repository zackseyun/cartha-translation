  text: Κἀγὼ Ἰωάννης ὁ ἀκούων καὶ βλέπων ταῦτα. καὶ ὅτε ἤκουσα καὶ ἔβλεψα, ἔπεσα προσκυνῆσαι ἔμπροσθεν τῶν ποδῶν τοῦ ἀγγέλου τοῦ δεικνύοντός μοι ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/008.yaml
  text: And I[a], John, am the one hearing and seeing these things. And when I heard and saw, I fell down to worship before the feet of the angel who was showing me these things.
translation:
  language: hi
  text: और मैं, यूहन्ना, वही हूँ जो ये बातें सुन और देख रहा हूँ। और जब मैंने सुना और देखा, तो मैं उस स्वर्गदूत के चरणों के सामने उसकी आराधना[a] करने के लिए गिर पड़ा, जो मुझे ये बातें दिखा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने दण्डवत् करने के लिए।” यूनानी क्रिया भूमि पर झुककर प्रणाम करने या श्रद्धा प्रकट करने का भाव भी दे सकती है; यहाँ अगली आयत में मिलने वाली फटकार और प्रकाशितवाक्य में इसके सामान्य प्रयोग के कारण मुख्य पाठ में “आराधना” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ
  choice: और मैं
  rationale: संयोजक καί और बलयुक्त प्रथम पुरुष ἐγώ—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ ἀκούων καὶ βλέπων
  choice: वही हूँ जो ... सुन और देख रहा है
  rationale: वर्तमान कृदन्तों और उनके विशेष बलयुक्त, संज्ञात्मक प्रयोग को वर्तमान अपूर्णतामूलक अभिव्यक्ति में सुरक्षित रखता है।
- source_word: ταῦτα
  choice: ये बातें
  rationale: बहुवचन संकेतवाचक को बनाए रखता है और पहले वर्णित दर्शनों तथा प्रकाशनों की ओर स्वाभाविक ढंग से संकेत करता है।
- source_word: ὅτε
  choice: जब
  rationale: कालसूचक सम्बन्ध को बिना उसे 'इसके बाद' बनाकर अधिक व्याख्यायित किए व्यक्त करता है।
- source_word: ἤκουσα καὶ ἔβλεψα
  choice: मैंने सुना और देखा
  rationale: दोनों अनिर्दिष्ट भूतकालिक क्रियाओं को सीधे पूर्ण भूतकाल में प्रस्तुत करता है।
- source_word: ἔπεσα
  choice: गिर पड़ा
  rationale: शारीरिक क्रिया की आकस्मिकता और पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσκυνῆσαι
  choice: दण्डवत् करके उसकी आराधना करने के लिए
  rationale: क्रिया में निहित भूमि पर झुकने की बाहरी मुद्रा और इस प्रसंग में उसके आराधनात्मक आशय—दोनों को व्यक्त करता है; अगली आयत की फटकार के कारण इसे केवल आदरसूचक प्रणाम तक सीमित नहीं किया गया।
- source_word: ἔμπροσθεν τῶν ποδῶν
  choice: चरणों के सामने
  rationale: ἔμπροσθεν और स्पष्ट बहुवचन 'पाँव/चरणों' दोनों को सुरक्षित रखता है; गरिमापूर्ण हिन्दी में 'चरण' प्रसंगानुकूल है।
- source_word: τοῦ ἀγγέλου
  choice: उस स्वर्गदूत
  rationale: प्रकाशितवाक्य के प्रसंग में यह स्वर्गीय प्राणी है, इसलिए सामान्य 'दूत' की अपेक्षा 'स्वर्गदूत' स्पष्ट और स्थापित हिन्दी पद है।
- source_word: τοῦ δεικνύοντός μοι ταῦτα
  choice: जो मुझे ये बातें दिखा रहा था
  rationale: वर्तमान कृदन्त की जारी भूमिका को हिन्दी के अपूर्ण भूतकाल द्वारा व्यक्त करता है।
theological_decisions:
- issue: स्वर्गदूत की ओर निर्देशित προσκυνέω का स्वरूप
  choice: मुख्य पाठ में 'दण्डवत् करके उसकी आराधना करने' रखा गया है।
  alternative: '''उसके सामने दण्डवत् करने'' या ''उसे श्रद्धांजलि देने''।'
  rationale: προσκυνέω दण्डवत् प्रणाम या श्रद्धांजलि भी सूचित कर सकता है, पर प्रकाशितवाक्य में इसका प्रायः आराधनात्मक बल है और अगली आयत की फटकार इस कार्य को अनुचित दिखाती है। अनुवाद को इस तनाव को पहले ही नरम करके समाप्त नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'वही हूँ जो' यूनानी के बलयुक्त संज्ञात्मक कृदन्त को दर्शाता है। 'चरण' और 'दण्डवत्' औपचारिक हैं, पर धार्मिक-वर्णनात्मक प्रसंग में प्रचलित और बोधगम्य हैं।
