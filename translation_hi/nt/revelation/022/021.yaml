  text: The grace of the Lord Jesus be with all[a].
translation:
  language: hi
  text: प्रभु यीशु का अनुग्रह सबके साथ रहे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “प्रभु यीशु का अनुग्रह सब पवित्र लोगों के साथ रहे,” और कुछ में, “तुम सबके साथ रहे।”
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: नए नियम के आशीर्वचन में यह परमेश्वर की कृपापूर्ण भलाई और उद्धारकारी कृपा, दोनों की अर्थच्छाया को संक्षेप में बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यीशु की उपाधि के रूप में κύριος का स्थापित, स्वाभाविक और मसीह-संबंधी अर्थ सुरक्षित रखता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिगत नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: μετὰ
  choice: के साथ रहे
  rationale: यूनानी वाक्य में क्रिया निहित है; हिन्दी आशीर्वचन को स्वाभाविक और स्पष्ट बनाने के लिए ‘रहे’ जोड़ा गया है।
- source_word: πάντων
  choice: सबके
  rationale: मूल पाठ का शब्द व्यापक और किसी स्पष्ट संज्ञा से सीमित नहीं है; ‘सबके’ उसी अनिर्दिष्ट व्यापकता को बनाए रखता है।
theological_decisions:
- issue: आशीर्वचन पाने वालों को स्पष्ट रूप से निर्दिष्ट करना या न करना
  choice: ‘सबके साथ’ कहकर संदर्भित समूह को अनिर्दिष्ट रखना
  alternative: ‘तुम सबके साथ’ अथवा ‘सब पवित्र लोगों के साथ’
  rationale: SBLGNT में केवल πάντων (‘सबके’) है। ‘तुम’ जोड़ना अर्थ को अधिक निश्चित कर देगा, जबकि ‘पवित्र लोग’ एक अन्य पाठांतर पर आधारित है; इसलिए मुख्य पाठ की व्यापकता और वास्तविक पाठगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आशीर्वचन। ‘अनुग्रह’ बाइबलीय संदर्भ में परिचित है और ‘सबके’ मूल पाठ की जानबूझकर अनिर्दिष्ट व्यापकता को बनाए रखता है।
