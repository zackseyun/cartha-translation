  text: and they will see his face[b][a], and his name will be on their foreheads.
translation:
  language: hi
  text: और वे उसका मुख देखेंगे[a][b], और उसका नाम उनके माथों पर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसका मुख निहारेंगे।”
    reason: lexical_alternative
  - marker: b
    text: एकवचन सर्वनाम “उसका” परमेश्वर के लिए हो सकता है, या निकटवर्ती संदर्भ में परमेश्वर और मेम्ने के संयुक्त दिव्य शासन को प्रतिबिम्बित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὄψονται
  choice: देखेंगे
  rationale: यह ὁράω का भविष्यकालीन रूप है और यहाँ सीधा अर्थ ‘देखेंगे’ स्वाभाविक, स्पष्ट और आधुनिक हिन्दी में उपयुक्त है। ‘निहारेंगे’ सम्भव है, पर उसमें कुछ अधिक भावात्मक और साहित्यिक रंग आता है।
- source_word: πρόσωπον
  choice: मुख
  rationale: यहाँ मूल अर्थ ‘चेहरा/मुख’ है। ‘मुख’ गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी है तथा ‘उपस्थिति’ जैसे व्याख्यात्मक विस्तार से बचता है।
- source_word: ὄνομα
  choice: नाम
  rationale: मूल शब्द का सीधा अनुवाद रखा गया है। पहचान, स्वामित्व या चरित्र के सम्भावित संकेतों को मुख्य पाठ में जोड़कर स्पष्ट नहीं किया गया।
- source_word: ἐπὶ τῶν μετώπων αὐτῶν
  choice: उनके माथों पर
  rationale: ἐπί के स्थान-सूचक अर्थ और μετώπων के बहुवचन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: दोनों स्थानों पर यूनानी की समन्वयात्मक, जोड़ने वाली संरचना सुरक्षित रखी गई है।
- source_word: αὐτοῦ
  choice: उसका
  rationale: एकवचन सर्वनाम को किसी स्पष्ट संज्ञा से बदलने के बजाय सर्वनाम के रूप में रखा गया है, जिससे मूल पाठ में उसके संदर्भ की खुली हुई सम्भावना बनी रहती है।
theological_decisions:
- issue: ‘उसका मुख’ और ‘उसका नाम’ में ‘उसका’ किसके लिए है
  choice: मुख्य पाठ में एकवचन सर्वनाम ‘उसका’ बनाए रखा गया।
  alternative: ‘परमेश्वर का’, अथवा निकटवर्ती संदर्भ में परमेश्वर और मेम्ने के संयुक्त दिव्य शासन की ओर संकेत
  rationale: निकटवर्ती संदर्भ में परमेश्वर और मेम्ना घनिष्ठ रूप से साथ आते हैं, जबकि यूनानी पाठ यहाँ एकवचन सर्वनाम रखता है। किसी एक संदर्भ को स्पष्ट करके मूल की धर्मवैचारिक गहनता और तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मुख’ सामान्य ‘चेहरा’ की अपेक्षा थोड़ा अधिक साहित्यिक है, पर इस दृश्य के पवित्र और प्रत्यक्ष दर्शन के भाव के अनुरूप रहते हुए आज भी आसानी से समझा जाता है।
