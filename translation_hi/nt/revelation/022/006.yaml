  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वचन,’ ‘प्रभु,’ ‘स्वर्गदूत’ और ‘दास’ जैसे परिचित बाइबलीय शब्द मूल की धार्मिक और संबंधपरक गहराई को बनाए रखते हैं।
