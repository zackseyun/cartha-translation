  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ⸀εἶπέν μοι· Οὗτοι οἱ λόγοι πιστοὶ καὶ ἀληθινοί, καὶ ⸀ὁ κύριος, ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν, ἀπέστειλεν τὸν ἄγγελον αὐτοῦ δεῖξαι τοῖς δούλοις αὐτοῦ ἃ δεῖ γενέσθαι ἐν τάχει·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/006.yaml
  text: And he said to me[a], “These words are trustworthy and true, and the Lord, the God of the spirits of the prophets[b], sent his angel to show his servants what must happen soon.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “ये वचन भरोसेमंद और सच्चे हैं, और प्रभु, भविष्यवक्ताओं की आत्माओं के परमेश्वर ने, अपने दासों[a] को वे बातें दिखाने के लिए अपना स्वर्गदूत भेजा जो शीघ्र ही अवश्य होनेवाली हैं।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दासों” के लिए “सेवकों” या “बंधुआ सेवकों” का अनुवाद भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “शीघ्र ही” का अनुवाद “तेजी से” भी हो सकता है। यूनानी वाक्यांश समय की निकटता या घटनाओं के तेजी से घटने—दोनों में से किसी पर बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὶ
  choice: भरोसेमंद
  rationale: वचनों के संबंध में यह उनकी विश्वसनीयता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀληθινοί
  choice: सच्चे
  rationale: πιστοὶ के साथ मिलकर यह वचनों की सत्यता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यहाँ यह परमेश्वर के लिए प्रयुक्त उपाधि है; ‘प्रभु’ हिन्दी बाइबलीय प्रयोग और प्रसंग दोनों के अनुकूल है।
- source_word: ὁ θεὸς τῶν πνευμάτων τῶν προφητῶν
  choice: जो भविष्यवक्ताओं की आत्माओं का परमेश्वर है
  rationale: यह यूनानी संबंधकारक संरचना को बनाए रखता है और इसे ‘प्रेरणा देने वाला परमेश्वर’ जैसी व्याख्यात्मक पुनर्रचना में नहीं बदलता।
- source_word: ἄγγελον
  choice: स्वर्गदूत
  rationale: प्रकाशितवाक्य के दर्शनीय प्रसंग में ἄγγελος एक स्वर्गीय दूत को सूचित करता है; ‘स्वर्गदूत’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: δούλοις
  choice: दासों
  rationale: ‘दास’ परमेश्वर से संबंध, अधीनता और उसके अधिकार में होने के भाव को ‘सेवकों’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है, जबकि आधुनिक हिन्दी में बोधगम्य भी है।
- source_word: δεῖξαι
  choice: दिखाए
  rationale: यह δείκνυμι का सीधा अर्थ है और दर्शनीय प्रसंग में स्वाभाविक है।
- source_word: ἃ δεῖ γενέσθαι
  choice: क्या-क्या होना अवश्य है
  rationale: यह घटनाओं की बहुलता तथा δεῖ में निहित अनिवार्यता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: मुख्य पाठ में समय की निकटता को व्यक्त करता है, पर वैकल्पिक ‘तेजी से’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Καὶ εἶπέν μοι
  choice: और उसने मुझसे कहा
  rationale: यह सामान्य संयोजक καί और कथन-परिचय का सीधा रूप है; वक्ता की पहचान वहाँ स्पष्ट नहीं की गई जहाँ यूनानी केवल सर्वनाम-सूचित कर्ता देता है।
theological_decisions:
- issue: अंतकाल-संबंधी प्रसंग में ἐν τάχει का अर्थ
  choice: शीघ्र ही
  alternative: तेजी से
  rationale: वाक्यांश समय की निकटता या घटनाओं के घटने की तीव्रता, दोनों का संकेत दे सकता है। प्रकाशितवाक्य के निकट संदर्भ में आसन्नता प्रमुख लगती है, पर वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- issue: परमेश्वर के लोगों के लिए δοῦλοι का बल
  choice: दासों
  alternative: सेवकों
  rationale: यह शब्द परमेश्वर के स्वामित्व और मनुष्यों की उसके प्रति अधीनता को प्रकट करता है। ‘दास’ उस बल को बनाए रखता है, यद्यपि ‘सेवक’ अधिक पारंपरिक विकल्प है।
- issue: τῶν πνευμάτων τῶν προφητῶν में संबंध
  choice: भविष्यवक्ताओं की आत्माओं का परमेश्वर
  alternative: भविष्यवक्ताओं को प्रेरित करने वाला परमेश्वर
  rationale: मूल की संबंधकारक अभिव्यक्ति को बनाए रखने से परमेश्वर और भविष्यवक्ताओं की आत्माओं के बीच संबंध की वास्तविक अस्पष्टता सुरक्षित रहती है; व्याख्यात्मक विकल्प को मुख्य पाठ में नहीं थोपा गया।
