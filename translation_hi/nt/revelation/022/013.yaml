base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/013.yaml
  text: I am the Alpha and the Omega[a], the first and the last, the beginning and the end.
translation:
  language: hi
  text: मैं अल्फ़ा और ओमेगा हूँ—पहला और अंतिम, आदि और अंत[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूल और लक्ष्य।”
    reason: ἀρχή और τέλος के क्रमशः ‘origin’ और ‘goal’ वाले सम्भावित अर्थ को दर्शाने के लिए; मुख्य पाठ में समानान्तर ‘आदि और अंत’ रखा गया है।
lexical_decisions:
- source_word: ἐγὼ
  choice: मैं ही
  rationale: यूनानी में स्पष्ट सर्वनाम ἐγώ बल देता है; हिन्दी में ‘मैं ही’ इस गंभीर आत्म-घोषणा के बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ Ἄλφα
  choice: अल्फ़ा
  rationale: यूनानी वर्णमाला के पहले अक्षर का नाम और प्रकाशितवाक्य का स्थापित प्रतीकात्मक पदनाम होने के कारण इसे लिप्यंतरित किया गया है।
- source_word: τὸ Ὦ
  choice: ओमेगा
  rationale: यूनानी वर्णमाला के अन्तिम अक्षर का नाम और स्थापित प्रतीकात्मक पदनाम होने के कारण इसे लिप्यंतरित किया गया है।
- source_word: ὁ πρῶτος
  choice: पहला
  rationale: विशेषण यहाँ संज्ञात्मक पदनाम के रूप में है; ‘पहला’ इसका सीधा और स्वाभाविक हिन्दी प्रतिरूप है।
- source_word: ὁ ἔσχατος
  choice: अन्तिम
  rationale: ‘पहला’ के समानान्तर संज्ञात्मक पदनाम के रूप में ‘अन्तिम’ सटीक और प्रतिष्ठित हिन्दी है।
- source_word: ἡ ἀρχὴ
  choice: आदि
  rationale: ἀρχή के ‘आरम्भ’ अर्थ को संक्षिप्त पदनाम के रूप में व्यक्त करता है और ‘अन्त’ के साथ औपचारिक समानान्तरता बनाए रखता है; ‘मूल’ का सम्भावित अर्थ यहाँ आरोपित नहीं किया गया।
- source_word: τὸ τέλος
  choice: अन्त
  rationale: τέλος का यहाँ युग्मित और व्यापक अर्थ ‘अन्त’ स्वाभाविक रूप से व्यक्त करता है; ‘लक्ष्य’ की सम्भावित अर्थच्छाया को मुख्य पाठ में निर्णायक नहीं बनाया गया।
theological_decisions:
- issue: तीन समानान्तर आत्म-पदनामों में व्यापक सर्वोच्चता और अनन्तता के दावे को बिना अतिव्याख्या के प्रस्तुत करना
  choice: मैं ही अल्फ़ा और ओमेगा हूँ—पहला और अन्तिम, आदि और अन्त।
  alternative: मैं अल्फ़ा और ओमेगा, प्रथम और अन्तिम, मूल और लक्ष्य हूँ।
  rationale: मूल पाठ तीन पद-युग्मों को समानान्तर रखता है। चुना हुआ रूप उनकी लय और व्यापकता को बनाए रखता है, पर ἀρχή और τέλος को क्रमशः ‘मूल’ और ‘लक्ष्य’ मानकर किसी एक दार्शनिक व्याख्या को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और घोषणात्मक शैली। ‘अल्फ़ा’ और ‘ओमेगा’ स्थापित यूनानी अक्षर-नामों के रूप में रखे गए हैं। ‘आदि और अन्त’ सामान्य पाठक के लिए परिचित रहते हुए मूल की पदात्मक समानान्तरता बनाए रखता है।
