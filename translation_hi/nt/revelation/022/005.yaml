source:
  edition: SBLGNT
  text: καὶ νὺξ οὐκ ἔσται ⸀ἔτι, καὶ ⸂οὐκ ἔχουσιν χρείαν⸃ ⸀φωτὸς λύχνου καὶ ⸀φῶς ἡλίου, ὅτι κύριος ὁ θεὸς φωτίσει ⸀ἐπ’ αὐτούς, καὶ βασιλεύσουσιν εἰς τοὺς αἰῶνας τῶν αἰώνων.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/005.yaml
  text: And night will be no more[a], and they will have no need of lamplight or sunlight, because the Lord God will shine on them[b], and they will reign forever and ever.
translation:
  language: hi
  text: और रात फिर कभी नहीं होगी, और उन्हें न दीपक के प्रकाश की, न सूर्य के प्रकाश की आवश्यकता होगी, क्योंकि प्रभु परमेश्वर उन पर प्रकाश डालेगा; और वे सदा-सर्वदा राज्य करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “युगों के युगों तक,” अर्थात कभी समाप्त न होने वाली अवधि।
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ οὐκ ἔσται ἔτι
  choice: फिर रात नहीं होगी
  rationale: यह स्वाभाविक आधुनिक हिन्दी में रात के आगे कभी न होने का भाव व्यक्त करता है और यूनानी ἔτι की पुनरावृत्ति-निषेध भावना को ‘फिर’ से दर्शाता है।
- source_word: οὐκ ἔχουσιν χρείαν
  choice: उन्हें ... आवश्यकता होगी
  rationale: यूनानी क्रिया वर्तमान काल में है, पर पूरा दृश्य भविष्य की पूर्ण अवस्था का वर्णन करता है; इसलिए आसपास की भविष्यकालीन क्रियाओं के अनुरूप हिन्दी में भविष्यकाल स्वाभाविक है। निषेध ‘न तो ... न ...’ में व्यक्त है।
- source_word: φωτὸς λύχνου
  choice: दीपक के प्रकाश
  rationale: यह संबंधकारक पदबंध का सीधा और सामान्य हिन्दी रूप है तथा कृत्रिम संयुक्त शब्द से बचता है।
- source_word: φῶς ἡλίου
  choice: सूर्य के प्रकाश
  rationale: यह यूनानी पदबंध का स्पष्ट, स्वाभाविक और दीपक के प्रकाश के समानांतर रूप है।
- source_word: κύριος ὁ θεός
  choice: प्रभु परमेश्वर
  rationale: यह κύριος और θεός दोनों को अलग-अलग दर्शाने वाला प्रतिष्ठित, संप्रदाय-निरपेक्ष बाइबलीय हिन्दी रूप है।
- source_word: φωτίσει ἐπ’ αὐτούς
  choice: उन पर प्रकाश डालेगा
  rationale: यह φωτίζω के प्रकाश देने और ἐπί के दिशात्मक ‘उन पर’—दोनों भावों को बनाए रखता है।
- source_word: βασιλεύσουσιν
  choice: राज्य करेंगे
  rationale: यह क्रिया के ‘राज करना’ अर्थ को स्वाभाविक हिन्दी में रखता है, बिना कर्ताओं को संज्ञा रूप में ‘राजा’ कहकर अधिक स्पष्ट किए।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: सदा-सर्वदा
  rationale: यह अनंत अवधि सूचित करने वाले यूनानी मुहावरे का प्रचलित, गरिमापूर्ण और सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: भविष्य-दर्शन में οὐκ ἔχουσιν χρείαν का काल
  choice: ‘आवश्यकता होगी’ को निषेध के साथ भविष्यकाल में प्रस्तुत किया गया है।
  alternative: 'अधिक रूपात्मक अनुवाद: ‘आवश्यकता नहीं है।’'
  rationale: यूनानी में ἔχουσιν वर्तमान है, किंतु निकटवर्ती ἔσται, φωτίσει और βασιλεύσουσιν भविष्यकाल में हैं। हिन्दी भविष्यकाल दृश्य की कालगत एकता बनाए रखता है, जबकि अर्थ में वास्तविक परिवर्तन नहीं करता।
- issue: φωτίσει ἐπ’ αὐτούς में प्रकाश की दिशा
  choice: ‘उन पर प्रकाश डालेगा।’
  alternative: ‘उन्हें प्रकाश देगा।’
  rationale: चुना हुआ रूप ἐπί के दिशात्मक चित्र को सुरक्षित रखता है और परमेश्वर को प्रकाश के स्रोत के रूप में प्रस्तुत करता है, बिना अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘दीपक के प्रकाश’ और ‘सूर्य के प्रकाश’ का समानांतर विन्यास मूल पाठ की संरचना को स्पष्ट करता है। अर्धविराम अंतिम परिणाम—अनंत राज्य—को प्रकाश संबंधी कथन से सहज रूप से अलग करता है।
