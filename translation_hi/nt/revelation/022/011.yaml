id: REV.22.11
reference: Revelation 22:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ἀδικῶν ἀδικησάτω ἔτι, καὶ ὁ ῥυπαρὸς ⸀ῥυπαρευθήτω ἔτι, καὶ ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι, καὶ ὁ ἅγιος ἁγιασθήτω ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/011.yaml
  text: Let the one who does wrong still do wrong, and the filthy still be made filthy, and the righteous still practice righteousness, and the holy still be made holy.
translation:
  language: hi
  text: जो अन्याय करता है, वह अब भी अन्याय करता रहे; और जो मलिन है, वह अब भी मलिन किया जाए[a]; और जो धर्मी है, वह अब भी धार्मिकता का आचरण करता रहे[b]; और जो पवित्र है, वह अब भी पवित्र किया जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मलिन है, वह अब भी मलिन बना रहे।” यूनानी क्रिया निष्क्रिय है—शाब्दिक रूप से “मलिन किया जाए”—पर इसे अवस्था में बने रहने के अर्थ में भी व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय का आचरण करता रहे।” δικαιοσύνη का अर्थ “धार्मिकता” या “न्याय” हो सकता है; यहाँ “धार्मिकता” निकटवर्ती “धर्मी” के साथ संबंध बनाए रखती है।
    reason: lexical_alternative
  - marker: c
    text: या, “पवित्र ठहराया जाए।” यूनानी क्रिया का अर्थ “पवित्र किया जाए” या “पवित्र ठहराया जाए” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἀδικῶν … ἀδικησάτω ἔτι
  choice: जो अन्याय करता है, वह अब भी अन्याय करता रहे
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत को स्वाभाविक सामान्य व्यक्ति-वाचक उपवाक्य से व्यक्त किया गया है। तृतीय-पुरुष आज्ञार्थक रूप और ἔτι की निरंतरता को ‘करता रहे’ तथा ‘अब भी’ से सुरक्षित रखा गया है।
- source_word: ὁ ῥυπαρὸς … ῥυπαρευθήτω ἔτι
  choice: जो मलिन है, वह अब भी मलिन किया जाए
  rationale: ῥυπαρός की नैतिक और अशुद्धता-संबंधी छाया के लिए ‘मलिन’ चुना गया है। निष्क्रिय आज्ञार्थक ῥυπαρευθήτω को जानबूझकर निष्क्रिय रखा गया है, यद्यपि हिंदी में यह वाक्य तीखा और असामान्य सुनाई देता है।
- source_word: ὁ δίκαιος δικαιοσύνην ποιησάτω ἔτι
  choice: जो धर्मी है, वह अब भी धार्मिकता करता रहे
  rationale: δίκαιος और δικαιοσύνη के शब्दगत संबंध को ‘धर्मी/धार्मिकता’ से बनाए रखा गया है। ποιέω का सीधा ‘करना’ यहाँ मूल की ठोस नैतिक क्रिया और समानांतर रचना को सुरक्षित रखता है।
- source_word: ὁ ἅγιος ἁγιασθήτω ἔτι
  choice: जो पवित्र है, वह अब भी पवित्र किया जाए
  rationale: ἅγιος और ἁγιάζω के संबंध को एक ही हिंदी मूल ‘पवित्र’ से व्यक्त किया गया है तथा निष्क्रिय आज्ञार्थक को ‘किया जाए’ से स्पष्ट रखा गया है।
- source_word: ἔτι
  choice: अब भी
  rationale: चारों खंडों में यह जारी रहने या बने रहने की धारणा देता है; हिंदी में ‘अब भी’ उस पुनरावृत्त बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: अंतिम नैतिक स्थिरता के प्रसंग में आज्ञार्थक क्रियाएँ
  choice: 'चारों क्रियाओं को आज्ञार्थक रूप में रखना: ‘करता रहे/किया जाए’'
  alternative: 'इन्हें भविष्यवाणी की तरह देना: ‘करता रहेगा/किया जाएगा’'
  rationale: यूनानी रूप तृतीय-पुरुष आज्ञार्थक हैं। प्रसंग में उनका स्वर गंभीर और न्यायिक हो सकता है, पर अनुवाद उन्हें केवल भविष्यवाणी बनाकर मूल की व्याकरणिक तथा धर्मवैचारिक तन्यता को समाप्त नहीं करता।
- issue: ῥυπαρευθήτω और ἁγιασθήτω का वाच्य
  choice: 'निष्क्रिय वाच्य सुरक्षित रखना: ‘मलिन किया जाए’ और ‘पवित्र किया जाए’'
  alternative: ‘मलिन बना रहे’ और ‘पवित्र बना रहे’
  rationale: दोनों यूनानी क्रियाएँ निष्क्रिय हैं। कर्ता को अनकहा छोड़ना मूल की वास्तविक अस्पष्टता और धर्मवैचारिक तनाव को बनाए रखता है।
- issue: δικαιοσύνη का नैतिक अर्थक्षेत्र
  choice: ‘धार्मिकता’
  alternative: ‘न्याय’
  rationale: इस विरोधात्मक नैतिक समानांतरता में ‘धार्मिकता’ δίκαιος के साथ शब्दगत संबंध बनाए रखती है; फिर भी ‘न्याय’ अर्थक्षेत्र में संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, संक्षिप्त और न्यायिक लहजा रखा गया है। चार समानांतर खंडों में ‘जो … है/करता है, वह अब भी …’ की रचना मूल की पुनरावृत्ति को सुनाई देती है। ‘मलिन किया जाए’ और ‘पवित्र किया जाए’ सामान्य हिंदी से कुछ अधिक औपचारिक हैं, पर मूल के निष्क्रिय वाच्य और निहित कर्ता की अस्पष्टता को सुरक्षित रखने के लिए आवश्यक हैं।
