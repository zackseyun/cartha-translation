  register: भाषा आधुनिक मानक हिन्दी में, सहज पर गरिमापूर्ण रखी गई है। ‘मुहर लगाना’, ‘भविष्यवाणी’, ‘वचन’ और ‘निकट’ मूल के प्रमुख बिंबों तथा धार्मिक अर्थ-तनाव को सुरक्षित रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में अर्थ-संबंधित स्थानों पर दिए गए हैं।
