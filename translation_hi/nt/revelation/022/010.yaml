source:
  edition: SBLGNT
  text: Καὶ λέγει μοι· Μὴ σφραγίσῃς τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου, ὁ καιρὸς γὰρ ἐγγύς ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/010.yaml
  text: And he says to me[a], “Do not seal up the words of the prophecy of this book[c][b], for the time is near.”
translation:
  language: hi
  text: और वह मुझसे कहता है, “इस पुस्तक की भविष्यवाणी के वचनों को मुहरबंद मत करना[a][b], क्योंकि समय निकट है[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् इन्हें बंद या गुप्त मत रखना। ‘मुहरबंद करना’ भविष्यसूचक प्रकाशन को लोगों से रोके रखने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: दानिय्येल 12:4 से तुलना करें, जहाँ भविष्यवाणी पर मुहर लगाने की आज्ञा है; यहाँ आज्ञा उसके विपरीत है।
    reason: cross_reference
  - marker: c
    text: या “क्योंकि नियत समय निकट है।” यूनानी καιρός किसी निर्णायक या निर्धारित समय को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει μοι
  choice: वह मुझसे कहता है
  rationale: यूनानी में वर्तमान काल का कथात्मक प्रयोग है; हिन्दी में वर्तमान काल रखने से मूल की सजीवता बनी रहती है। आरंभ का Καί प्रवाह में ‘फिर’ के रूप में स्वाभाविक है।
- source_word: Μὴ σφραγίσῃς
  choice: मुहर मत लगाना
  rationale: σφραγίζω का मूल बिंब ‘मुहर लगाना’ है और इस भविष्यसूचक संदर्भ में प्रकाशन को बंद या गुप्त रखने का भाव भी देता है। मुख्य पाठ में बिंब सुरक्षित रखा गया है।
- source_word: τοὺς λόγους
  choice: वचनों
  rationale: बहुवचन λόγους को सामूहिक ‘संदेश’ में बदलने के बजाय बहुवचन रूप में रखा गया है। ‘वचन’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में सुबोध है।
- source_word: τῆς προφητείας τοῦ βιβλίου τούτου
  choice: इस पुस्तक की भविष्यवाणी के
  rationale: 'दोनों संबंधकारक पदों को स्वाभाविक हिन्दी क्रम में रखा गया है: वचन उस भविष्यवाणी के हैं जो इस पुस्तक में/इस पुस्तक की है। βιβλίον के लिए आधुनिक और सहज ‘पुस्तक’ चुना गया है।'
- source_word: ὁ καιρὸς
  choice: वह समय
  rationale: καιρός किसी निर्णायक या नियत समय का संकेत दे सकता है। मुख्य पाठ में संक्षिप्त ‘वह समय’ मूल की संदर्भगत निश्चितता रखता है, जबकि ‘नियत समय’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἐγγύς ἐστιν
  choice: निकट है
  rationale: यह स्पष्ट, समकालीन हिन्दी है और मूल के निकटता-दावे को बिना नरम किए व्यक्त करती है।
theological_decisions:
- issue: प्रकाशितवाक्य के अंतकालीन संदर्भ में समय की निकटता
  choice: क्योंकि वह समय निकट है
  alternative: क्योंकि नियत समय निकट है
  rationale: अनुवाद निकटता के दावे को ज्यों का त्यों रखता है और किसी विशिष्ट अंतकालीन समय-सारणी द्वारा उसकी व्याख्या नहीं करता। καιρός में ‘नियत/निर्णायक समय’ का भाव सम्भव है, पर उसे मुख्य पाठ में अनिवार्य नहीं बनाया गया।
- issue: भविष्यवाणी को मुहरबंद न करने का आदेश
  choice: मुहर मत लगाना
  alternative: गुप्त मत रखना
  rationale: ‘मुहर’ का भविष्यसूचक बिंब और दानिय्येल से अंतर्पाठीय संबंध सुरक्षित रखा गया है; उसके आशय ‘गुप्त मत रखना’ को पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में प्रतिस्थापित नहीं।
