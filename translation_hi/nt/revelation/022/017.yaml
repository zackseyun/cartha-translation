id: REV.22.17
reference: Revelation 22:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὸ πνεῦμα καὶ ἡ νύμφη λέγουσιν· Ἔρχου· καὶ ὁ ἀκούων εἰπάτω· Ἔρχου· καὶ ὁ διψῶν ἐρχέσθω, ὁ θέλων λαβέτω ὕδωρ ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/017.yaml
  text: And the Spirit and the bride say[a], “Come.” And let the one who hears say, “Come.” And let the one who is thirsty come[c][b]; let the one who desires take the water of life freely.
translation:
  language: hi
  text: और आत्मा और दुल्हन कहते हैं, “आओ।” और जो सुनता है, वह कहे, “आओ।” और जो प्यासा है, वह आए; जो चाहे, वह जीवन का जल मुफ़्त में ले।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिना कीमत” अथवा “उपहार के रूप में।”
    reason: lexical_alternative
  - marker: b
    text: पहली दो पुकारें, “आओ,” सामान्यतः प्रभु के आने की प्रार्थना समझी जाती हैं; इसके बाद प्यासे व्यक्ति को आने और जो चाहे उसे जीवन का जल लेने का निमंत्रण दिया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: संदर्भ में यह पवित्र आत्मा को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘आत्मा’ स्वाभाविक है, और पद स्वयं विशेषण ‘पवित्र’ नहीं जोड़ता।
- source_word: ἡ νύμφη
  choice: दुल्हन
  rationale: प्रकाशितवाक्य की वैवाहिक प्रतीक-छवि को बिना उसकी व्याख्या किए बनाए रखता है।
- source_word: λέγουσιν
  choice: कहते हैं
  rationale: ग्रीक वर्तमान काल की सतत और सजीव घोषणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἔρχου
  choice: आओ
  rationale: द्वितीय पुरुष एकवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; संबोधित व्यक्ति को पाठ में अनिर्दिष्ट रखा गया है।
- source_word: ὁ ἀκούων
  choice: जो सुनता है
  rationale: वर्तमान कृदंत के सामान्य, प्रतिनिधिक अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: εἰπάτω
  choice: वह कहे
  rationale: तृतीय पुरुष आज्ञार्थक की प्रेरणात्मक शक्ति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ διψῶν
  choice: जो प्यासा है
  rationale: शाब्दिक प्यास की छवि और उसकी आध्यात्मिक अनुगूँज दोनों को बिना विस्तार के बनाए रखता है।
- source_word: ἐρχέσθω
  choice: वह आए
  rationale: तृतीय पुरुष आज्ञार्थक निमंत्रण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ θέλων
  choice: जो इच्छा रखता है
  rationale: θέλω की इच्छा/चाह के अर्थ को व्यक्त करता है और ऐसा कोई कर्म नहीं जोड़ता जो ग्रीक में स्पष्ट नहीं है।
- source_word: λαβέτω
  choice: ले
  rationale: λαμβάνω के ‘लेना/ग्रहण करना’ अर्थ और जल लेने की मूर्त छवि को बनाए रखता है।
- source_word: ὕδωρ ζωῆς
  choice: जीवन का जल
  rationale: सम्बन्धकारक संरचना का सीधा रूप है और ‘जीवित जल’ जैसी अलग अर्थच्छाया से बचता है।
- source_word: δωρεάν
  choice: मुफ़्त में
  rationale: यह स्पष्ट करता है कि जल बिना कीमत के मिलता है; वैकल्पिक ‘उपहार के रूप में’ की अर्थच्छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: “आओ” का संबोधन किससे है
  choice: पहले दोनों “आओ” का संबोधित व्यक्ति मुख्य पाठ में अनिर्दिष्ट रखा गया है; इसके बाद प्यासे व्यक्ति को आने का निमंत्रण स्पष्ट है।
  alternative: दोनों आरम्भिक पुकारों को स्पष्ट रूप से प्रभु यीशु के आने की प्रार्थना बताना, या सभी पुकारों को प्यासे व्यक्ति का निमंत्रण मानना।
  rationale: ग्रीक में पहले दो स्थानों पर समान द्वितीय पुरुष आज्ञार्थक है, फिर प्यासे और इच्छुक व्यक्ति के लिए तृतीय पुरुष आज्ञार्थक आते हैं। अनिर्दिष्टता बनाए रखने से साहित्यिक और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
- issue: “दुल्हन” का प्रतीकात्मक आशय
  choice: मुख्य पाठ में प्रतीक ‘दुल्हन’ को ज्यों का त्यों रखा गया है।
  alternative: ‘कलीसिया,’ ‘परमेश्वर के लोग,’ या ‘नई यरूशलेम’ लिखना।
  rationale: प्रकाशितवाक्य में ये अर्थ परस्पर जुड़े हैं, पर अनुवाद में किसी एक व्याख्या को चुनना मूल प्रतीक की बहुस्तरीयता घटा देगा।
- issue: जीवन का जल किस प्रकार दिया जाता है
  choice: δωρεάν को ‘मुफ़्त में’ कहा गया है।
  alternative: ‘बिना कीमत’ या ‘उपहार के रूप में।’
  rationale: ये सभी δωρεάν की निःशुल्कता व्यक्त करते हैं; मुख्य पाठ का रूप साधारण पाठक के लिए सीधा है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और श्रवणयोग्य रूप अपनाया गया है। समानांतर वाक्य-रचना तथा बार-बार आने वाले ‘आओ’ को सुरक्षित रखा गया है। ‘दुल्हन’ प्रतीक को व्याख्यात्मक विस्तार के बिना रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
