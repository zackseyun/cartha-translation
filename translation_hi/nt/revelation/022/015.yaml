  text: ἔξω οἱ κύνες καὶ οἱ φάρμακοι καὶ οἱ πόρνοι καὶ οἱ φονεῖς καὶ οἱ εἰδωλολάτραι καὶ πᾶς φιλῶν καὶ ποιῶν ψεῦδος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/015.yaml
  text: Outside are the dogs and the sorcerers and the sexually immoral and the murderers and the idolaters[b][a], and everyone who loves and practices falsehood.
translation:
  language: hi
  text: बाहर हैं कुत्ते[b], जादू-टोना करनेवाले, यौन अनैतिक लोग, हत्यारे, मूर्तिपूजक, और हर वह व्यक्ति जो असत्य से प्रेम करता और उसका अभ्यास करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: यहाँ ‘कुत्ते’ सम्भवतः बहिष्कार और नैतिक अशुद्धता का रूपक है; कुछ व्याख्याकार इसे अधिक विशिष्ट अर्थ में लेते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἔξω
  choice: बाहर ... है
  rationale: वाक्य के आरम्भ में रखकर नगर से बहिष्कृत होने पर यूनानी पाठ जैसा बल बनाए रखा गया है; हिन्दी में अंतिम ‘है’ स्वाभाविक वाक्य-विन्यास देता है।
- source_word: κύνες
  choice: कुत्ते
  rationale: मूल का सजीव रूपक ज्यों का त्यों रखा गया है; किसी विवादित विशिष्ट पहचान को मुख्य पाठ में नहीं थोपा गया।
- source_word: φάρμακοι
  choice: टोना-टोटका करनेवाले
  rationale: यहाँ आशय जादू-टोने के अभ्यासियों से है। यह आधुनिक सामान्य हिन्दी में स्पष्ट है और औषधि अथवा विष से जुड़ा भ्रामक अर्थ नहीं देता।
- source_word: πόρνοι
  choice: यौन-अनैतिकता करनेवाले
  rationale: यह व्यापक यौन अनैतिकता को व्यक्त करता है और अर्थ को किसी एक प्रकार के यौन पाप तक सीमित नहीं करता।
- source_word: φονεῖς
  choice: हत्यारे
  rationale: हत्या करनेवालों के लिए सीधा, संक्षिप्त और स्वाभाविक हिन्दी शब्द।
- source_word: εἰδωλολάτραι
  choice: मूर्तिपूजक
  rationale: मूल की संक्षिप्त दोष-सूची की शैली बनाए रखते हुए प्रतिमाओं की उपासना करनेवालों का मानक हिन्दी रूप।
- source_word: πᾶς φιλῶν καὶ ποιῶν ψεῦδος
  choice: हर वह व्यक्ति ... जो झूठ से प्रेम करता और उसे आचरण में लाता है
  rationale: πᾶς तथा वर्तमान कृदंतों को व्यक्ति के अभ्यस्त लगाव और व्यवहार के रूप में व्यक्त किया गया है। ‘आचरण में लाता’ ποιῶν को केवल बोलने तक सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: ψεῦδος
  choice: झूठ
  rationale: एकवचन संज्ञा का सीधा और सामान्य हिन्दी रूप; यहाँ यह किसी एक कथन के साथ-साथ असत्य की व्यापक श्रेणी भी सूचित कर सकता है।
theological_decisions:
- issue: क्या ‘कुत्ते’ को मुख्य पाठ में किसी विशिष्ट समूह के रूप में समझाकर लिखा जाए?
  choice: मुख्य पाठ में शाब्दिक रूपक ‘कुत्ते’ बनाए रखा गया।
  alternative: अशुद्ध लोग; निर्लज्ज लोग; पुरुष वेश्याएँ
  rationale: κύνες एक ठोस और तीखा रूपक है। उसका विशिष्ट संदर्भ विवादित है, इसलिए व्याख्यात्मक पहचान को पाठ में डालना प्रकाशितवाक्य की प्रतीकात्मक भाषा और वास्तविक अस्पष्टता को घटा देता।
- issue: ψεῦδος को ‘झूठ’ या व्यापक ‘असत्य’ कैसे व्यक्त किया जाए?
  choice: मुख्य पाठ में ‘झूठ’, और टिप्पणी में उसके व्यापक अर्थ की सूचना।
  alternative: असत्य; एक झूठ
  rationale: ‘झूठ’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी एकवचन को बनाए रखता है, जबकि प्रसंग में यह असत्य से व्यापक प्रेम और उसके अभ्यास को भी समेट सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का dignified किंतु सामान्य-पाठक-सुलभ रूप अपनाया गया है। दोष-सूची की संक्षिप्त लय रखी गई है। ‘टोना-टोटका करनेवाले’ सामान्य हिन्दी में ‘जादूगर’ से अधिक स्पष्ट रूप से निषिद्ध जादुई अभ्यास बताता है; ‘यौन-अनैतिकता’ व्यापक अर्थ सुरक्षित रखता है। सभी टिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
