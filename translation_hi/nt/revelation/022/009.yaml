language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει μοι· Ὅρα μή· σύνδουλός σού εἰμι καὶ τῶν ἀδελφῶν σου τῶν προφητῶν καὶ τῶν τηρούντων τοὺς λόγους τοῦ βιβλίου τούτου· τῷ θεῷ προσκύνησον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/009.yaml
  text: And he says to me[a], “Do not do that! I am a fellow servant with you and with your brothers the prophets, and with those who keep the words of this book[c][b]. Worship God.”
translation:
  language: hi
  text: तब वह मुझसे कहता है, “ऐसा मत करो![a] मैं तुम्हारा और तुम्हारे उन भाइयों का, जो भविष्यद्वक्ता हैं, तथा इस पुस्तक के वचनों का पालन करने वालों का सह-दास हूँ। परमेश्वर की आराधना करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में निषेध बहुत संक्षिप्त और आकस्मिक है, जिसका निकट अर्थ है, “सावधान—ऐसा न हो।” यहाँ आशय है, “ऐसा मत करो,” अर्थात स्वर्गदूत की आराधना मत करो। तुलना करें प्रकाशितवाक्य 19:10।
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: Ὅρα μή
  choice: ऐसा मत करो!
  rationale: यह यूनानी मुहावरा प्रसंग में यूहन्ना द्वारा स्वर्गदूत की आराधना करने के प्रयास पर अचानक लगाई गई रोक है। निहित क्रिया को स्पष्ट करने से हिन्दी स्वाभाविक रहती है।
- source_word: σύνδουλός
  choice: सह-दास
  rationale: यह शब्द एक ही स्वामी के अधीन साझा दासत्व को व्यक्त करता है। ‘सह-दास’ स्वर्गदूत और यूहन्ना, दोनों की परमेश्वर के अधीन स्थिति को ‘सह-सेवक’ से अधिक स्पष्ट रखता है।
- source_word: ἀδελφῶν σου τῶν προφητῶν
  choice: तुम्हारे भाई भविष्यद्वक्ताओं
  rationale: यह रचना ‘तुम्हारे भाइयों’ को ‘भविष्यद्वक्ताओं’ के रूप में पहचानती है; हिन्दी में बिना अतिरिक्त व्याख्या के यही सम्बन्ध स्वाभाविक ढंग से व्यक्त होता है।
- source_word: τηρούντων
  choice: मानने वालों
  rationale: τηρέω यहाँ पुस्तक की बातों को निष्ठापूर्वक संजोने और उनके अनुसार चलने का भाव रखता है। ‘मानना’ हिन्दी में केवल सुरक्षित रखने की अपेक्षा इस व्यापक पालनार्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λόγους τοῦ βιβλίου τούτου
  choice: इस पुस्तक की बातों
  rationale: λόγοι पुस्तक की कथित/लिखित विषयवस्तु को सूचित करता है। ‘बातों’ आधुनिक हिन्दी में ‘शब्दों’ की तुलना में इस अर्थ में अधिक स्वाभाविक है, बिना इसे एकवचन ‘संदेश’ बनाकर सीमित किए।
- source_word: τῷ θεῷ προσκύνησον
  choice: परमेश्वर की आराधना करो
  rationale: प्रकाशितवाक्य में προσκυνέω आराधनापूर्ण दण्डवत या उपासना को दर्शाता है। यहाँ अनुचित स्वर्गदूत-आराधना के विपरीत उचित परमेश्वर-आराधना अभिप्रेत है।
theological_decisions:
- issue: σύνδουλος में दासत्व-सूचक भाषा
  choice: ‘सह-दास’ रखा गया।
  alternative: ‘सह-सेवक’
  rationale: वचन का मुख्य बल यह है कि स्वर्गदूत स्वयं आराधना का पात्र नहीं, बल्कि यूहन्ना और अन्य विश्वासयोग्य जनों की तरह परमेश्वर के अधीन है। ‘सह-दास’ इस अधीनता को स्पष्ट रखता है।
- issue: Ὅρα μή में निहित क्रिया
  choice: प्रसंगानुसार ‘ऐसा मत करो!’ कहा गया।
  alternative: ‘देखो, मत’ या केवल ‘मत करो’
  rationale: यूनानी वाक्यांश संक्षिप्त और आकस्मिक निषेध है; पिछली क्रिया से स्पष्ट है कि स्वर्गदूत यूहन्ना को अपनी आराधना करने से रोक रहा है। निहित संकेत स्पष्ट करना अर्थ जोड़ना नहीं, बल्कि स्वाभाविक हिन्दी में उसे प्रकट करना है।
- issue: τηρέω का अर्थ-क्षेत्र
  choice: ‘मानने वालों’ द्वारा निष्ठापूर्ण ग्रहण और पालन दोनों का भाव रखा गया।
  alternative: ‘पालन करने वालों’ या ‘सुरक्षित रखने वालों’
  rationale: मूल क्रिया में रखना, संभालना और पालन करना—इन अर्थों का तनाव है। ‘मानना’ हिन्दी में इन्हें पर्याप्त रूप से खुला रखता है और इसे केवल बाहरी आज्ञापालन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सीधा कथन रखा गया है। ‘सह-दास’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर मूल के साझा दासत्व और परमेश्वर के अधीन होने के बल को सुरक्षित रखता है। वर्तमानकाल ‘कहता है’ यूनानी λέγει के कथात्मक वर्तमान को दर्शाता है।
