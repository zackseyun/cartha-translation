id: REV.22.19
reference: Revelation 22:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ἀφέλῃ ἀπὸ τῶν λόγων τοῦ βιβλίου τῆς προφητείας ταύτης, ⸀ἀφελεῖ ὁ θεὸς τὸ μέρος αὐτοῦ ἀπὸ τοῦ ξύλου τῆς ζωῆς καὶ ἐκ τῆς πόλεως τῆς ἁγίας, τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/019.yaml
  text: and if anyone takes away from the words of the book of this prophecy[a], God will take away his share from the tree of life and from the holy city, which are written in this book.
translation:
  language: hi
  text: और यदि कोई इस भविष्यवाणी की पुस्तक के वचनों में से कुछ हटा दे, तो परमेश्वर जीवन के वृक्ष और पवित्र नगर—जिनका वर्णन इस पुस्तक में है—में से उसका भाग हटा देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέλῃ / ἀφελεῖ
  choice: निकाल दे / निकाल देगा
  rationale: दोनों यूनानी क्रियाओं की जानबूझकर रखी गई समानता और प्रतिफलात्मक चेतावनी को हिन्दी में एक ही क्रिया से सुरक्षित रखा गया है।
- source_word: λόγων
  choice: वचनों
  rationale: यह भविष्यवाणी की मौखिक/लिखित सामग्री को दर्शाता है; ‘वचन’ इस गंभीर साहित्यिक संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: βιβλίου
  choice: पुस्तक
  rationale: आधुनिक हिन्दी में सहज है और प्रकाशितवाक्य के लिखित ग्रंथ को स्पष्ट रूप से व्यक्त करता है।
- source_word: προφητείας
  choice: भविष्यवाणी
  rationale: मूल के साहित्यिक और धार्मिक पदनाम को बिना विस्तार के बनाए रखता है।
- source_word: μέρος
  choice: भाग
  rationale: किसी वस्तु या वरदान में मिलने वाली हिस्सेदारी का भाव संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: ξύλου τῆς ζωῆς
  choice: जीवन का वृक्ष
  rationale: प्रकाशितवाक्य 22 के निकटवर्ती संदर्भ और बाइबलीय पदनाम के अनुरूप है।
- source_word: πόλεως τῆς ἁγίας
  choice: पवित्र नगर
  rationale: निश्चित और प्रचलित बाइबलीय पदनाम को सुरक्षित रखता है।
- source_word: τῶν γεγραμμένων ἐν τῷ βιβλίῳ τούτῳ
  choice: उनमें से, जिनके विषय में इस पुस्तक में लिखा है
  rationale: पुल्लिंग बहुवचन कृदन्त का संबंध ‘जीवन के वृक्ष’ और ‘पवित्र नगर’ दोनों से होने की सम्भावना को स्पष्ट रखते हुए पूर्ण कर्मवाच्य का भाव व्यक्त करता है।
theological_decisions:
- issue: ‘जीवन का वृक्ष’ बनाम उत्तरकालीन ‘जीवन की पुस्तक’ पाठांतर
  choice: जीवन का वृक्ष
  alternative: जीवन की पुस्तक
  rationale: SBLGNT में ξύλου τῆς ζωῆς है; यह प्रकाशितवाक्य 22 के निकटवर्ती संदर्भ से भी मेल खाता है। प्रसिद्ध वैकल्पिक पाठ को पाद-टिप्पणी में रखा गया है।
- issue: अंतिम कृदन्तीय वाक्यांश का संबंध
  choice: जीवन के वृक्ष और पवित्र नगर दोनों से
  alternative: केवल पवित्र नगर से, अथवा पुस्तक में लिखी सभी वस्तुओं से व्यापक संबंध
  rationale: यूनानी τῶν γεγραμμένων का पुल्लिंग बहुवचन रूप निकटवर्ती दोनों पुल्लिंग संज्ञापदों को साथ लेकर चल सकता है; हिन्दी में ‘उनमें से’ इस संबंध को स्वाभाविक रूप से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। मूल की शर्त, चेतावनी और ‘निकालने’ की प्रतिफलात्मक समानता बनाए रखी गई है।
