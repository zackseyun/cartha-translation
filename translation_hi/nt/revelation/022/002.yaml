id: REV.22.2
reference: Revelation 22:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν μέσῳ τῆς πλατείας αὐτῆς· καὶ τοῦ ποταμοῦ ἐντεῦθεν καὶ ἐκεῖθεν ξύλον ζωῆς ποιοῦν καρποὺς δώδεκα, κατὰ μῆνα ἕκαστον ⸀ἀποδιδοῦν τὸν καρπὸν αὐτοῦ, καὶ τὰ φύλλα τοῦ ξύλου εἰς θεραπείαν τῶν ἐθνῶν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/002.yaml
  text: in the middle of its street[a], and on this side and on that side of the river, was the tree of life, bearing twelve fruits, yielding its fruit each month[c][b]. And the leaves of the tree are for the healing of the nations.
translation:
  language: hi
  text: उसके चौक के बीच में,[a] और नदी के इस पार और उस पार, जीवन का वृक्ष था, जो बारह फल देता और हर महीने अपना फल उपजाता था।[b][c] उस वृक्ष के पत्ते राष्ट्रों के चंगे होने के लिए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चौक’ का अनुवाद ‘चौड़ी सड़क’ भी किया जा सकता है। यूनानी शब्द दोनों अर्थों में प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बारह फल’ का अर्थ बारह प्रकार के फल या फलने का पूरा, भरपूर चक्र भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह चित्र उत्पत्ति 2:9 के जीवन के वृक्ष और यहेजकेल 47:12 के हर महीने फलने वाले वृक्षों की याद दिलाता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐν μέσῳ τῆς πλατείας αὐτῆς
  choice: उसके चौक के बीच में
  rationale: πλατεῖα चौड़ी सार्वजनिक सड़क या चौक को सूचित कर सकता है। यहाँ ‘चौक’ नगर के सार्वजनिक खुले स्थान का स्वाभाविक हिन्दी बोध देता है; ‘उसके’ αὐτῆς को बनाए रखता है।
- source_word: ἐντεῦθεν καὶ ἐκεῖθεν
  choice: इस पार और उस पार
  rationale: यह यूनानी के द्विपक्षीय स्थान-संबंध को सहज हिन्दी में बनाए रखता है, बिना दृश्य की असामान्य भौगोलिक रचना को स्पष्ट करने की कोशिश किए।
- source_word: ξύλον ζωῆς
  choice: जीवन का वृक्ष
  rationale: ξύλον यहाँ उत्पत्ति और प्रकाशितवाक्य की पृष्ठभूमि में ‘वृक्ष’ है; प्रसिद्ध अदन-संबंधी प्रतिरूप के कारण हिन्दी में निश्चित अभिप्राय स्वाभाविक है।
- source_word: ποιοῦν καρποὺς δώδεκα
  choice: बारह फल देता
  rationale: ποιοῦν καρπούς का अर्थ फल उत्पन्न करना है। मूल में ‘प्रकार’ नहीं है, इसलिए ‘बारह फल’ वास्तविक अस्पष्टता को सुरक्षित रखता है।
- source_word: κατὰ μῆνα ἕκαστον ἀποδιδοῦν τὸν καρπὸν αὐτοῦ
  choice: हर महीने अपना फल उपजाता था
  rationale: यह मासिक नियमितता और फल देने के कृषि-संबंधी भाव, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ φύλλα τοῦ ξύλου
  choice: उस वृक्ष के पत्ते
  rationale: सीधा और स्पष्ट वनस्पति-संबंधी अनुवाद।
- source_word: εἰς θεραπείαν τῶν ἐθνῶν
  choice: राष्ट्रों के चंगे होने के लिए
  rationale: εἰς उद्देश्य को और θεραπεία उपचार/चंगाई को व्यक्त करता है; ἔθνη का व्यापक अर्थ यहाँ राष्ट्र है, केवल गैर-यहूदी नहीं।
theological_decisions:
- issue: वृक्ष, चौक और नदी के बीच संकुचित तथा तनावपूर्ण स्थान-वर्णन
  choice: एकवचन ‘जीवन का वृक्ष’ रखते हुए उसे चौक और नदी के दोनों पार से संबंधित बताया गया है।
  alternative: बहुवचन ‘जीवन के वृक्ष’ करना, या दृश्य को अधिक स्पष्ट भौगोलिक क्रम में पुनर्गठित करना।
  rationale: यूनानी पाठ एकवचन ξύλον रखता है और दर्शन का स्थान-वर्णन जानबूझकर संकुचित है। एकवचन अदन की अंतर्पाठीय प्रतिध्वनि और मूल की प्रतीकात्मक अस्पष्टता दोनों को सुरक्षित रखता है।
- issue: ‘बारह फल’ का आशय
  choice: ‘बारह फल’
  alternative: ‘बारह प्रकार के फल’ या ‘बारह फसलें’
  rationale: καρποὺς δώδεκα शाब्दिक रूप से ‘बारह फल’ कहता है। प्रकारों या वार्षिक फसलों का भाव संभव है, पर उसे मुख्य पाठ में निश्चित करना मूल से अधिक स्पष्टता जोड़ता।
- issue: θεραπεία का स्वरूप
  choice: ‘चंगे होने के लिए’
  alternative: ‘स्वास्थ्य के लिए’ या ‘आरोग्य के लिए’
  rationale: ‘चंगे होने’ से उपचार और पुनर्स्थापन का लक्ष्य व्यक्त होता है, पर यह नहीं बताया जाता कि राष्ट्र किस प्रकार या किस अवस्था से चंगे होते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘चंगा होना’ सामान्य बाइबलीय हिन्दी में परिचित है और θεραπεία के उपचारात्मक भाव को स्पष्ट रखता है। काव्यात्मक दर्शन की असामान्य स्थान-रचना को सरल बनाकर समाप्त नहीं किया गया।
