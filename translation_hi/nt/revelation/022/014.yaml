source:
  edition: SBLGNT
  text: Μακάριοι οἱ ⸂πλύνοντες τὰς στολὰς αὐτῶν⸃, ἵνα ἔσται ἡ ἐξουσία αὐτῶν ἐπὶ τὸ ξύλον τῆς ζωῆς καὶ τοῖς πυλῶσιν εἰσέλθωσιν εἰς τὴν πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/014.yaml
  text: Blessed are those who wash their robes[c][b][a], so that they may have the right to the tree of life and may enter the city by the gates.
translation:
  language: hi
  text: धन्य हैं वे जो अपने वस्त्र धोते हैं,[a][b] ताकि उन्हें जीवन के वृक्ष तक पहुँचने का अधिकार मिले और वे फाटकों से होकर नगर में प्रवेश करें।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “जो अपने वस्त्र धोते हैं” के स्थान पर “धन्य हैं वे जो उसकी आज्ञाओं का पालन करते हैं” या “उसकी आज्ञाओं को मानते हैं” है।
    reason: textual_variant
  - marker: b
    text: वस्त्र धोने का यह बिंब प्रकाशितवाक्य 7:14 की प्रतिध्वनि है, जहाँ वस्त्र मेम्ने के लहू में धोए और उजले किए गए हैं।
    reason: cross_reference
  - marker: c
    text: या, “फाटकों के द्वारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: धन्य हैं
  rationale: यह आशीर्वचन की पारंपरिक और स्वाभाविक हिन्दी अभिव्यक्ति है तथा केवल भावनात्मक सुख के बजाय परमेश्वर से मिलने वाली अनुगृहीत स्थिति का भार बनाए रखती है।
- source_word: πλύνοντες
  choice: जो ... धोते हैं
  rationale: वर्तमान कृदंत उन लोगों की पहचान या विशेषता बताता है जो अपने वस्त्र धोते हैं; हिन्दी का सामान्य वर्तमान काल इस अर्थ को सहज रूप में व्यक्त करता है।
- source_word: στολάς
  choice: वस्त्र
  rationale: ‘वस्त्र’ आधुनिक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द है, जो प्रकाशितवाक्य के प्रतीकात्मक परिधान-बिंब को बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम के संबंध को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἔσται ἡ ἐξουσία αὐτῶν
  choice: उन्हें ... अधिकार मिले
  rationale: शाब्दिक भविष्यकालीन रचना हिन्दी में असहज होती; ‘अधिकार मिले’ ἵνα-वाक्य के उद्देश्य/परिणाम और वैध पहुँच के भाव को सहजता से व्यक्त करता है।
- source_word: ἐπὶ τὸ ξύλον τῆς ζωῆς
  choice: जीवन के वृक्ष पर
  rationale: ἐξουσία के साथ ἐπί यहाँ वृक्ष के फल तक वैध पहुँच या अधिकार बताता है। ‘पर अधिकार’ हिन्दी में स्वाभाविक है और शासन करने का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: τοῖς πυλῶσιν
  choice: फाटकों से होकर
  rationale: करण/मार्गसूचक बहुवचन दत्तिव को हिन्दी में ‘से होकर’ स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: εἰσέλθωσιν εἰς τὴν πόλιν
  choice: नगर में प्रवेश करें
  rationale: यह ἵνα के अधीन संभाव्य प्रवेश को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पहले उपवाक्य का पाठांतर
  choice: SBLGNT के पाठ ‘जो अपने वस्त्र धोते हैं’ को मुख्य पाठ में रखा गया।
  alternative: कुछ पांडुलिपियों में ‘जो उसकी आज्ञाओं को मानते/पूरा करते हैं’ है।
  rationale: प्रदत्त मूल यूनानी पाठ πλύνοντες τὰς στολὰς αὐτῶν का यही सीधा अनुवाद है। प्रमुख वैकल्पिक पाठ को उसके पारंपरिक और धर्मवैचारिक महत्त्व के कारण पादटिप्पणी में सुरक्षित रखा गया है।
- issue: वस्त्र धोने और जीवन तक पहुँच का संबंध
  choice: पद में व्यक्त संबंध को यथावत रखा गया, पर धोने की धर्मवैचारिक क्रियाविधि मुख्य पाठ में नहीं जोड़ी गई।
  alternative: इसे स्पष्टतः मनुष्य का पुण्य-कर्म कहना, या मुख्य पाठ में जोड़ना कि वस्त्र मेम्ने के लहू में धोए गए हैं।
  rationale: यह पद पात्रों को वस्त्र धोने वालों के रूप में पहचानता है और उनके अधिकार तथा प्रवेश का परिणाम बताता है। प्रकाशितवाक्य 7:14 से संबंध उपयोगी है, पर उसे मुख्य पाठ में जोड़ना इस पद से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ स्तर रखा गया है। ‘धन्य’, ‘जीवन का वृक्ष’ और ‘नगर में प्रवेश’ जैसे परिचित बाइबलीय पदबंध सुरक्षित हैं; मुख्य पाठ में किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ी गई।
