source:
  edition: SBLGNT
  text: Ἐγὼ Ἰησοῦς ἔπεμψα τὸν ἄγγελόν μου μαρτυρῆσαι ὑμῖν ταῦτα ἐπὶ ταῖς ἐκκλησίαις. ἐγώ εἰμι ἡ ῥίζα καὶ τὸ γένος Δαυίδ, ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/016.yaml
  text: I[a], Jesus, have sent my angel to testify to you these things for the churches[b]. I am the root and the descendant of David, the bright morning star.
translation:
  language: hi
  text: “मैं, यीशु, ने अपना स्वर्गदूत भेजा है कि वह तुम्हें कलीसियाओं के लिए[a] इन बातों की गवाही दे। मैं दाऊद की जड़ और दाऊद का वंशज[b], भोर का चमकता हुआ तारा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कलीसियाओं में,” अथवा “कलीसियाओं के विषय में।” यूनानी पदबंध ἐπὶ ταῖς ἐκκλησίαις एक से अधिक अर्थछटाएँ रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाऊद की संतान।”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐγὼ Ἰησοῦς
  choice: मैं, यीशु,
  rationale: स्पष्ट सर्वनाम आत्म-पहचान पर बल देता है; हिन्दी में नाम को समानाधिकरण के रूप में रखना स्वाभाविक है और यहाँ अनावश्यक ‘हूँ’ नहीं जोड़ता।
- source_word: ἔπεμψα
  choice: ने ... भेजा है
  rationale: यूनानी एओरिस्ट पूर्ण हुई और वर्तमान प्रसंग में प्रासंगिक क्रिया बताता है; हिन्दी का पूर्ण पक्ष इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν ἄγγελόν μου
  choice: अपना दूत
  rationale: प्रकाशितवाक्य के दर्शन-संबंधी संदर्भ में ἄγγελος स्वर्गदूत को सूचित करता है; ‘दूत’ प्रचलित, गरिमापूर्ण और अर्थतः उपयुक्त है।
- source_word: μαρτυρῆσαι ὑμῖν ταῦτα
  choice: कि वह ... इन बातों की गवाही तुम्हें दे
  rationale: उद्देश्यसूचक infinitive और ὑμῖν के संप्रदान अर्थ को स्पष्ट हिन्दी वाक्य-विन्यास में रखा गया है; ταῦτα का बहुवचन भी सुरक्षित है।
- source_word: ἐπὶ ταῖς ἐκκλησίαις
  choice: कलीसियाओं के लिए
  rationale: ἐπί + dative यहाँ संदर्भ, क्षेत्र या अभिप्रेत समुदाय का भाव दे सकता है। मुख्य पाठ में ‘के लिए’ स्वाभाविक है, जबकि अन्य संभव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἡ ῥίζα
  choice: जड़
  rationale: रूपक को शाब्दिक रूप से सुरक्षित रखा गया है, जिससे स्रोत अथवा पूर्ववर्तिता का मसीही बिंब बना रहता है।
- source_word: τὸ γένος Δαυίδ
  choice: दाऊद का ... वंशज
  rationale: γένος यहाँ दाऊद की वंश-परंपरा से उत्पन्न व्यक्ति को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὁ ἀστὴρ ὁ λαμπρός, ὁ πρωϊνός
  choice: भोर का चमकता हुआ तारा
  rationale: पुनरुक्त articles से जुड़े दोनों विशेषणों को स्वाभाविक हिन्दी पदबंध में रखा गया है और सजीव उपाधि सुरक्षित है।
theological_decisions:
- issue: दाऊद से संबंधित मसीही आत्म-पहचान
  choice: दाऊद की जड़ और उसका वंशज
  alternative: दाऊद का मूल और उसकी संतान
  rationale: यीशु को दाऊद से पूर्ववर्ती स्रोत-सदृश ‘जड़’ और साथ ही दाऊद का वंशज कहने का अंतर्निहित तनाव बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है।
- issue: ‘भोर का तारा’ मसीही उपाधि
  choice: भोर का चमकता हुआ तारा
  alternative: चमकीला भोर का तारा
  rationale: इसे यीशु की प्रत्यक्ष आत्म-उपाधि के रूप में रखा गया है और पाठ से बाहर की कोई सैद्धांतिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘कलीसिया’ और ‘दूत’ जैसे व्यापक बाइबलीय शब्द रखे गए हैं। प्रथम वाक्य में हिन्दी की स्वाभाविक शब्द-व्यवस्था के कारण उद्देश्यवाचक उपवाक्य प्रयोग हुआ है; यूनानी पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
