id: REV.22.3
reference: Revelation 22:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πᾶν κατάθεμα οὐκ ἔσται ἔτι. καὶ ὁ θρόνος τοῦ θεοῦ καὶ τοῦ ἀρνίου ἐν αὐτῇ ἔσται, καὶ οἱ δοῦλοι αὐτοῦ λατρεύσουσιν αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/003.yaml
  text: And there will no longer be any curse[a]. And the throne of God and of the Lamb will be in it, and his servants will worship him[d][c][b],
translation:
  language: hi
  text: फिर कोई शापित वस्तु न रहेगी[a]। परमेश्वर और मेम्ने का सिंहासन उस नगर में होगा, और उसके दास[b] उसकी उपासना करेंगे[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘फिर कोई शाप न रहेगा।’
    reason: lexical_alternative
  - marker: b
    text: या ‘सेवक’; यूनानी शब्द स्वामी के अधीन और उसके अधिकार में रहने वाले दासों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘पवित्र सेवा करेंगे।’
    reason: lexical_alternative
  - marker: d
    text: 'यूनानी में एकवचन भाषा है: ‘परमेश्वर और मेम्ने का सिंहासन’ ... ‘उसके दास उसकी उपासना करेंगे।’ इससे परमेश्वर और मेम्ने के बीच भेद और उनका साझा शासन—दोनों बने रहते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: πᾶν κατάθεμα
  choice: कोई शापित वस्तु
  rationale: κατάθεμα यहाँ उस वस्तु को सूचित कर सकता है जो शाप के अधीन हो। नपुंसकलिंग एकवचन πᾶν के व्यापक भाव को ‘कोई ... वस्तु’ स्वाभाविक हिन्दी में व्यक्त करता है और ठोस अर्थ को सुरक्षित रखता है। ‘कोई शाप’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: οὐκ ἔσται ἔτι
  choice: फिर ... न रहेगी
  rationale: यह भविष्यकालीन अस्तित्व-वाचक कथन ἔτι के ‘अब और नहीं’ भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ θρόνος
  choice: सिंहासन
  rationale: मानक अर्थ है; मूल यूनानी के एकवचन को बनाए रखा गया है।
- source_word: τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: परमेश्वर और मेम्ने का
  rationale: दोनों संबंधवाचक पद स्पष्ट रखे गए हैं। प्रकाशितवाक्य में ἀρνίον की स्थापित बलिदानी और मसीही छवि के लिए ‘मेम्ना’ उपयुक्त है।
- source_word: ἐν αὐτῇ
  choice: उस नगर में
  rationale: स्त्रीलिंग एकवचन सर्वनाम का पूर्वपद पवित्र नगर है। हिन्दी में संदर्भ को स्पष्ट करना केवल सर्वनाम रखने से अधिक स्वाभाविक है और स्थानवाचक अर्थ को सुरक्षित रखता है।
- source_word: δοῦλοι
  choice: दास
  rationale: δοῦλοι स्वामित्व और पूर्ण अधीनता का भाव रखता है। ‘दास’ हिन्दी में यह बल बनाए रखता है, जबकि ‘सेवक’ अपेक्षाकृत हल्का विकल्प है।
- source_word: λατρεύσουσιν
  choice: उपासना करेंगे
  rationale: λατρεύω प्रायः परमेश्वर को दी जाने वाली धार्मिक या पवित्र सेवा बताता है। सिंहासन-संबंधी इस प्रसंग में ‘उपासना’ धार्मिक अर्थ को स्पष्ट रूप से व्यक्त करती है; ‘सेवा करेंगे’ भी संभव है।
- source_word: αὐτοῦ ... αὐτῷ
  choice: उसके ... उसकी
  rationale: मूल पाठ के एकवचन सर्वनामों को बनाए रखा गया है, यद्यपि उनसे पहले ‘परमेश्वर और मेम्ना’ दोनों आते हैं। इससे पाठ की वास्तविक व्याकरणिक और धर्मवैचारिक कसावट सुरक्षित रहती है।
theological_decisions:
- issue: एकवचन ‘सिंहासन’ के साथ ‘परमेश्वर और मेम्ने’ तथा उसके बाद एकवचन सर्वनाम
  choice: ‘सिंहासन ... उसके दास उसकी उपासना करेंगे’ के रूप में सभी एकवचन बनाए रखना
  alternative: 'स्पष्टता के लिए बहुवचन करना: ‘उनके दास उनकी उपासना करेंगे’, अथवा सर्वनामों से बचने के लिए व्याख्यात्मक पुनर्लेखन करना'
  rationale: यूनानी पाठ परमेश्वर और मेम्ने के बीच भेद भी रखता है और एक सिंहासन तथा एकवचन सर्वनामों द्वारा उनके साझा शासन को भी सामने रखता है। अनुवाद इस तनाव को किसी बाद की धर्मवैचारिक सूत्रबद्धता से हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उस नगर में’ पिछले संदर्भ के पूर्वपद को स्पष्ट करता है। ‘दास’ और ‘उपासना’ मूल शब्दों के स्वामित्व तथा पवित्र सेवा के बल को बनाए रखते हैं।
