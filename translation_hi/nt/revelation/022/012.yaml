  text: Ἰδοὺ ἔρχομαι ταχύ, καὶ ὁ μισθός μου μετ’ ἐμοῦ, ἀποδοῦναι ἑκάστῳ ὡς τὸ ἔργον ⸀ἐστὶν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/012.yaml
  text: Behold[a], I am coming soon, and my reward is with me, to repay each one according to what his work is.
translation:
  language: hi
  text: “देखो, मैं शीघ्र[a] आ रहा हूँ, और मेरा प्रतिफल मेरे साथ है, ताकि हर एक को उसके काम के अनुसार दूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तेज़ी से आ रहा हूँ।” यूनानी शब्द ταχύ निकटता (“शीघ्र”) या आने की तीव्रता अथवा अचानकपन पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह भविष्यद्वाणी और प्रकाशन-साहित्य में ध्यान आकर्षित करने वाले उद्गार की गंभीरता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔρχομαι
  choice: मैं ... आ रहा हूँ
  rationale: वर्तमान काल का रूप प्रसंग में निकट भविष्य की ओर संकेत करता है; हिन्दी का वर्तमान प्रगतिशील रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ταχύ
  choice: शीघ्र
  rationale: यह निकटता (‘जल्द’) और तीव्रता अथवा अचानकपन (‘जल्दी’) दोनों की सम्भावना को खुला रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὁ μισθός μου
  choice: मेरा प्रतिफल
  rationale: μισθός के पुरस्कार, मजदूरी अथवा बदले में मिलने वाले फल के अर्थ को न्याय के इस प्रसंग में गरिमापूर्ण और गैर-व्यावसायिक ढंग से व्यक्त करता है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ है
  rationale: यूनानी के क्रियारहित उपवाक्य में निहित योजक क्रिया को हिन्दी में स्पष्ट किया गया है।
- source_word: ἀποδοῦναι
  choice: ताकि ... दूँ
  rationale: यह उद्देश्यसूचक अनन्त क्रिया है और संदर्भ में कर्मों के अनुरूप प्रतिदान देने का भाव रखती है; ‘दूँ’ स्वाभाविक हिन्दी है, जबकि ‘प्रतिफल’ पहले ही प्रतिदान का अर्थ स्पष्ट करता है।
- source_word: ἑκάστῳ
  choice: हर एक को
  rationale: वितरणात्मक एकवचन और व्यक्तिगत उत्तरदायित्व को स्पष्ट रूप से बनाए रखता है।
- source_word: ὡς τὸ ἔργον ἐστὶν αὐτοῦ
  choice: उसके काम के अनुसार
  rationale: मूल के एकवचन ἔργον और कर्म को प्रतिदान का मानदंड बताने वाले ὡς का अर्थ स्वाभाविक हिन्दी में सुरक्षित है; ‘उसने जो किया है’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: ἑκάστῳ ... αὐτοῦ में लिंग और प्रतिनिधिक प्रयोग
  choice: हर एक को उसके काम के अनुसार
  alternative: हर व्यक्ति को उसके कामों के अनुसार
  rationale: ‘हर एक ... उसके’ यूनानी एकवचन रूप को हिन्दी में स्वाभाविक रूप से रखता है और उसे केवल पुरुषों तक सीमित नहीं करता।
- issue: कर्मों के अनुसार प्रतिदान का स्वरूप
  choice: मेरा प्रतिफल ... हर एक को उसके काम के अनुसार दूँ
  alternative: मेरा बदला ... हर एक को उसके कर्मों के अनुसार चुकाऊँ
  rationale: पद में उपस्थित व्यक्तिगत प्रतिदान और कर्म के मानदंड को बनाए रखा गया है, पर इससे उद्धार के आधार के विषय में कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘देखो’ प्रकाशन-साहित्य के उद्गार को बनाए रखता है; ‘शीघ्र’ औपचारिक होते हुए भी प्रचलित है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में सम्मिलित है।
