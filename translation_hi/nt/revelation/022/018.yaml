source:
  edition: SBLGNT
  text: Μαρτυρῶ ἐγὼ παντὶ τῷ ἀκούοντι τοὺς λόγους τῆς προφητείας τοῦ βιβλίου τούτου· ἐάν τις ἐπιθῇ ἐπ’ αὐτά, ⸀ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν τὰς πληγὰς τὰς γεγραμμένας ἐν τῷ βιβλίῳ τούτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/018.yaml
  text: 'I testify to everyone who hears the words of the prophecy of this book: if anyone adds to them[b][a], God will add to him the plagues that are written in this book.'
translation:
  language: hi
  text: 'मैं हर उस व्यक्ति को, जो इस पुस्तक[a] की भविष्यवाणी के वचनों को सुनता है, यह गवाही देता हूँ: यदि कोई उनमें कुछ जोड़ता है, तो परमेश्वर उस पर वे विपत्तियाँ लगा देगा जो इस पुस्तक में लिखी हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पुस्तक’ के स्थान पर ‘ग्रंथ-पट’ भी हो सकता है; यूनानी βιβλίον प्राचीन लेखन के भौतिक रूप, अर्थात् स्क्रॉल, को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μαρτυρῶ
  choice: साक्षी देता हूँ
  rationale: यह यूनानी क्रिया गवाही या साक्ष्य देने की भाषा है। यह अनुवाद उसकी गंभीर साक्ष्यात्मक शक्ति बनाए रखता है और उसे केवल ‘चेतावनी देता हूँ’ तक सीमित नहीं करता।
- source_word: παντὶ τῷ ἀκούοντι
  choice: हर उस व्यक्ति के सामने ... जो ... सुनता है
  rationale: समस्त सुनने वालों को संबोधित करने वाली दत्तिवीय कृदन्त रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। ‘के सामने’ साक्षी देने की क्रिया के साथ मुहावरेदार है।
- source_word: τοὺς λόγους τῆς προφητείας
  choice: भविष्यवाणी के वचनों
  rationale: ‘वचन’ लिखित भविष्यवाणी की शब्दगत विषयवस्तु को गरिमापूर्ण और सुबोध ढंग से व्यक्त करता है; ‘भविष्यवाणी’ पाठ की भविष्यसूचक श्रेणी को सुरक्षित रखती है।
- source_word: τοῦ βιβλίου τούτου / ἐν τῷ βιβλίῳ τούτῳ
  choice: इस पुस्तक / इस पुस्तक में
  rationale: βιβλίον के लिए ‘पुस्तक’ आधुनिक पाठक के लिए स्वाभाविक है और पद में दोनों occurrences को एकरूप रखता है; प्राचीन भौतिक रूप ‘लपेटा हुआ ग्रंथ’ हो सकता था, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἐάν τις ἐπιθῇ ἐπ’ αὐτά
  choice: यदि कोई उनमें कुछ जोड़ता है
  rationale: ἐπιτίθημι यहाँ ‘में जोड़ना’ दर्शाता है। हिन्दी में सकर्मक अर्थ स्पष्ट करने के लिए निहित वस्तु ‘कुछ’ जोड़ी गई है।
- source_word: ἐπιθήσει ὁ θεὸς ἐπ’ αὐτὸν
  choice: परमेश्वर उस पर ... जोड़ देगा
  rationale: पहले उपवाक्य की उसी यूनानी क्रिया का ‘जोड़ना’ द्वारा पुनरावर्तन जानबूझकर बनी शब्दगत समरूपता—मनुष्य जोड़ता है, परमेश्वर उस पर जोड़ देगा—को सुरक्षित रखता है।
- source_word: τὰς πληγὰς
  choice: वे विपत्तियाँ
  rationale: प्रकाशितवाक्य में πληγαί दैवी न्याय की विपत्तियों के लिए प्रयुक्त है; ‘विपत्तियाँ’ स्वाभाविक हिन्दी में पुस्तक के आंतरिक संदर्भ को बनाए रखता है।
- source_word: τὰς γεγραμμένας
  choice: जो ... लिखी हैं
  rationale: पूर्ण निष्क्रिय कृदन्त उस स्थायी स्थिति को दर्शाता है कि ये विपत्तियाँ पुस्तक में लिखी हुई हैं; हिन्दी में ‘लिखी हैं’ सहज है।
theological_decisions:
- issue: 'कथन का स्वरूप: साक्ष्य या केवल चेतावनी'
  choice: आरम्भ को ‘साक्षी देता हूँ’ के रूप में अनूदित किया गया है; चेतावनी का बल आगे के न्याय-वचन से उभरता है।
  alternative: ‘चेतावनी देता हूँ’
  rationale: यूनानी μαρτυρῶ मूलतः साक्ष्य देने की भाषा है। इसे केवल चेतावनी में बदलना मूल की न्यायिक/गंभीर साक्ष्यात्मक छटा को घटा देता।
- issue: दोनों उपवाक्यों में ‘जोड़ने’ की समरूपता
  choice: मनुष्य के कार्य और परमेश्वर की प्रतिक्रिया, दोनों के लिए ‘जोड़ना’ रखा गया है।
  alternative: दूसरे उपवाक्य में ‘डाल देगा’ या ‘भोगने देगा’
  rationale: मूल पाठ दोनों स्थानों पर ἐπιτίθημι की पुनरावृत्ति से न्याय की माप-संगति प्रकट करता है। अलग क्रिया अधिक सहज हो सकती थी, पर मूल की आलंकारिक समरूपता मिटा देती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक साक्ष्य और न्याय की शैली रखी गई है। ‘साक्षी देता हूँ’ तथा दो बार ‘जोड़ना’ कुछ औपचारिक लग सकते हैं, पर वे यूनानी की साक्ष्यात्मक भाषा और जानबूझकर की गई शब्द-पुनरावृत्ति को सुरक्षित रखते हैं। पादटिप्पणी का चिह्न मुख्य पाठ में ‘पुस्तक[a]’ के साथ उपस्थित है।
