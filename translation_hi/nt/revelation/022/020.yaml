  text: The one who testifies to these things says[a], “Yes, I am coming soon.” Amen. Come, Lord Jesus.
translation:
  language: hi
  text: जो इन बातों की गवाही देता है, वह कहता है, “हाँ, मैं शीघ्र आ रहा हूँ।”[a] आमीन। आइए, प्रभु यीशु!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं तेज़ी से आ रहा हूँ।” यूनानी क्रियाविशेषण समय की निकटता या आगमन अथवा कार्य की तीव्रता—दोनों में से किसी पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγει
  choice: कहता है
  rationale: वर्तमानकालीन कथन-परिचय को सहज और सीधी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὁ μαρτυρῶν
  choice: जो ... गवाही देता है
  rationale: संज्ञात्मक वर्तमान कृदंत की पहचानकारी और निरंतर गवाही की छाया बनाए रखता है; ‘गवाही’ μαρτυρέω के साक्ष्य-संबंधी अर्थ को स्पष्ट रखती है।
- source_word: ταῦτα
  choice: इन बातों
  rationale: बहुवचन संकेतवाचक प्रकाशितवाक्य में अभी कही गई बातों की ओर संकेत करता है।
- source_word: Ναί
  choice: हाँ
  rationale: सीधी सकारात्मक पुष्टि को बिना अतिरिक्त व्याख्यात्मक गंभीरता जोड़े व्यक्त करता है।
- source_word: ἔρχομαι
  choice: मैं ... आ रहा हूँ
  rationale: भविष्योन्मुख वर्तमान रूप को स्वाभाविक हिन्दी में व्यक्त करता है और आगमन की प्रत्याशा बनाए रखता है।
- source_word: ταχύ
  choice: शीघ्र
  rationale: ‘शीघ्र’ समय की निकटता और आगमन की तीव्रता—दोनों अर्थ-छायाओं के लिए हिन्दी में अपेक्षाकृत खुला है; वैकल्पिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: Ἀμήν
  choice: आमीन
  rationale: प्रार्थनापूर्ण सहमति का पारंपरिक और व्यापक रूप से पहचाना जाने वाला रूप सुरक्षित रखता है।
- source_word: ἔρχου
  choice: आ
  rationale: द्वितीय पुरुष एकवचन आज्ञार्थक की संक्षिप्तता, निकट संबोधन और प्रार्थनात्मक आग्रह को बनाए रखता है।
- source_word: κύριε
  choice: प्रभु
  rationale: यीशु के लिए प्रत्यक्ष संबोधन में स्थापित नये नियम का सम्मानसूचक पद है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिनाम का मानक हिन्दी रूप।
theological_decisions:
- issue: मसीह के आगमन के वचन में ταχύ का अर्थ
  choice: शीघ्र
  alternative: जल्दी / तेज़ी से
  rationale: यूनानी क्रियाविशेषण समय की निकटता अथवा आगमन/कार्य की तीव्रता बता सकता है। ‘शीघ्र’ मुख्य पाठ में दोनों के प्रति कुछ खुलापन रखता है, और पादटिप्पणी वास्तविक अर्थगत तनाव को स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘आ, प्रभु यीशु!’ में एकवचन प्रत्यक्ष संबोधन मूल की संक्षिप्तता और प्रार्थनात्मक उत्कंठा को सुरक्षित रखता है।
