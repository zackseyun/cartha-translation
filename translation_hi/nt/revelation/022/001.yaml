source:
  edition: SBLGNT
  text: Καὶ ἔδειξέν μοι ⸀ποταμὸν ὕδατος ζωῆς λαμπρὸν ὡς κρύσταλλον, ἐκπορευόμενον ἐκ τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
base_translation:
  language: en
  yaml_path: translation/nt/revelation/022/001.yaml
  text: And he showed me a river of the water of life[a], bright as crystal[b], flowing out from the throne of God and of the Lamb.
translation:
  language: hi
  text: और उसने मुझे जीवन के जल की एक नदी दिखाई, जो स्फटिक के समान चमकीली थी और परमेश्वर तथा मेम्ने के सिंहासन से बह रही थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδειξέν μοι
  choice: उसने मुझे ... दिखाई
  rationale: दृष्टि-वर्णन में δείκνυμι का सामान्य अर्थ ‘दिखाना’ है; दत्तिव μοι को ‘मुझे’ के रूप में सीधे रखा गया है।
- source_word: ποταμὸν ὕδατος ζωῆς
  choice: जीवन के जल की एक नदी
  rationale: यह रूप यूनानी संबंधकारक-श्रृंखला को स्वाभाविक हिन्दी में सुरक्षित रखता है और इसे व्याख्यात्मक रूप से केवल ‘जीवन देने वाला जल’ नहीं बनाता। अनिश्चित ποταμόν के लिए ‘एक नदी’ उपयुक्त है।
- source_word: λαμπρὸν ὡς κρύσταλλον
  choice: स्फटिक के समान चमकीली
  rationale: λαμπρός मुख्यतः चमक या दीप्ति बताता है, इसलिए ‘चमकीली’ चुना गया; ὡς की स्पष्ट उपमा को ‘के समान’ से रखा गया है। ‘स्फटिक’ गरिमापूर्ण और समझने योग्य ढंग से κρύσταλλον की चमकदार पारदर्शी वस्तु की छवि व्यक्त करता है।
- source_word: ἐκπορευόμενον ἐκ
  choice: से बह रही थी
  rationale: नदी के संदर्भ में ἐκπορευόμενον का स्वाभाविक हिन्दी रूप ‘बह रही’ है; ‘से’ उसके स्रोत को व्यक्त करता है।
- source_word: τοῦ θρόνου τοῦ θεοῦ καὶ τοῦ ἀρνίου
  choice: परमेश्वर तथा मेम्ने के सिंहासन
  rationale: एकवचन ‘सिंहासन’ और उससे जुड़े दोनों संबंधकारकों को बनाए रखा गया है। प्रकाशितवाक्य में ἀρνίον की उपाधिगत और बलिदानी छवि के लिए ‘मेम्ना’ सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर और मेम्ने से संबद्ध एकवचन सिंहासन
  choice: परमेश्वर तथा मेम्ने के सिंहासन से
  alternative: परमेश्वर और मेम्ने के सिंहासनों से
  rationale: यूनानी पाठ में ‘सिंहासन’ एकवचन है और उसके साथ परमेश्वर तथा मेम्ने—दोनों के संबंधकारक जुड़े हैं। अनुवाद इस साझा-सिंहासन की छवि को बिना अतिरिक्त व्याख्या के बनाए रखता है; बहुवचन मूल पाठ के विरुद्ध होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण दृष्टि-वर्णन। वाक्य-विन्यास हिन्दी के अनुसार स्वाभाविक रखा गया है, जबकि जीवन के जल, स्फटिक, मेम्ने और एकवचन सिंहासन की मूल प्रतीकात्मक भाषा सुरक्षित है।
