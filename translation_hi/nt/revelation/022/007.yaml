  yaml_path: translation/nt/revelation/022/007.yaml
  text: And behold[a], I am coming soon[b]. Blessed is the one who keeps the words of the prophecy of this book.
translation:
  language: hi
  text: और देखो, मैं शीघ्र[a] आ रहा हूँ। धन्य है वह जो इस पुस्तक[b] की भविष्यवाणी के वचनों का पालन करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेजी से।” यूनानी शब्द समय की निकटता (“शीघ्र”) अथवा आने की तीव्रता या अचानकता पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस पत्र की।” प्राचीन काल में ऐसी पुस्तक प्रायः लिपटे हुए पत्र के रूप में होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ध्यान आकर्षित करने वाली आज्ञा का बल बनाए रखता है और प्रकाशन-साहित्य की गंभीरता के अनुकूल है।
- source_word: ἔρχομαι
  choice: मैं आ रहा हूँ
  rationale: वर्तमान काल के रूप और प्रसंग में उसके भावी आगमन-संबंधी बल—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταχύ
  choice: शीघ्र
  rationale: प्रसंग में समय की निकटता प्रमुख है। ‘शीघ्र’ गरिमापूर्ण और सहज है तथा कुछ हद तक तेज गति का भाव भी रहने देता है; स्पष्ट वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: μακάριος
  choice: धन्य
  rationale: आशीर्वचन की धार्मिक और युगांत-संबंधी गंभीरता बनाए रखता है; ‘सुखी’ केवल भावनात्मक दशा का संकेत दे सकता है।
- source_word: ὁ τηρῶν
  choice: वह, जो … पालन करता है
  rationale: यह सामान्य रूप से किसी भी ऐसे व्यक्ति को सूचित करता है जो लिखे हुए वचनों को मानता और उनके अनुसार चलता है। ‘पालन करता है’ हिन्दी में स्वाभाविक है और केवल बौद्धिक सहमति से अधिक अर्थ रखता है।
- source_word: τοὺς λόγους
  choice: वचनों
  rationale: बहुवचन को बनाए रखता है और प्रकाशन के कथनों के लिए स्वाभाविक बाइबिलीय हिन्दी प्रदान करता है; ‘संदेश’ बहुवचन की ठोस अभिव्यक्ति को समेट देता।
- source_word: τῆς προφητείας
  choice: भविष्यवाणी
  rationale: मूल के स्थापित भविष्यसूचक वर्ग और संबंधसूचक रचना ‘भविष्यवाणी के वचन’ को सुरक्षित रखता है।
- source_word: τοῦ βιβλίου τούτου
  choice: इस पुस्तक
  rationale: आधुनिक पाठक के लिए यह सबसे सहज आत्म-संदर्भ है; प्राचीन भौतिक रूप ‘लपेटी हुई पुस्तक’ होने की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: ‘मैं शीघ्र आ रहा हूँ’ के वक्ता की पहचान
  choice: मूल पाठ की तरह केवल प्रथम पुरुष में कथन रखा गया है; वक्ता का नाम नहीं जोड़ा गया।
  alternative: पद में वक्ता को स्पष्ट रूप से ‘यीशु’ कहना।
  rationale: यूनानी पाठ यहाँ कोई व्यक्तिवाचक नाम नहीं देता। साहित्यिक प्रसंग को वक्ता की पहचान करने देना अनावश्यक व्याख्यात्मक जोड़ से बचाता है।
- issue: τηρέω में सुरक्षित रखने और आज्ञापालन का संबंध
  choice: ‘पालन करता है’ चुना गया है।
  alternative: ‘सुरक्षित रखता है’ या ‘थामे रखता है।’
  rationale: यहाँ भविष्यवाणी के वचनों के प्रति अपेक्षित निष्ठावान प्रतिक्रिया प्रसंगतः केवल उनकी भौतिक सुरक्षा से अधिक है। फिर भी अनुवाद में किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ ध्यान आकर्षित करने वाले ἰδοὺ का स्वाभाविक रूप है। पादटिप्पणी-चिह्न स्रोतार्थ के अनुसार संबंधित शब्दों पर लगाए गए हैं: [a] ‘शीघ्र’ के बाद और [b] ‘पुस्तक’ के बाद।'
