id: REV.21.3
reference: Revelation 21:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἤκουσα φωνῆς μεγάλης ἐκ τοῦ ⸀θρόνου λεγούσης· Ἰδοὺ ἡ σκηνὴ τοῦ θεοῦ μετὰ τῶν ἀνθρώπων, καὶ σκηνώσει μετ’ αὐτῶν, καὶ αὐτοὶ ⸀λαοὶ αὐτοῦ ἔσονται, καὶ αὐτὸς ὁ θεὸς ⸂μετ’ αὐτῶν ἔσται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/003.yaml
  text: And I heard a loud voice from the throne saying[a], “Behold, the dwelling place of God is with humanity, and he will dwell with them, and they will be his peoples[d][c][b], and God himself will be with them.”
translation:
  language: hi
  text: और मैंने सिंहासन से एक प्रबल आवाज़ सुनी, जो कह रही थी, “देखो, परमेश्वर का निवासस्थान[a] मनुष्यों के साथ है। वह उनके साथ निवास करेगा[b], और वे उसकी प्रजाएँ[c] होंगे, और परमेश्वर स्वयं उनके साथ होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर का तंबू।” यूनानी शब्द σκηνή तंबू, विशेषकर पवित्र निवास-तंबू, की छवि जगाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया “निवासस्थान/तंबू” वाले शब्द से संबंधित है; अधिक शाब्दिक रूप में, “वह उनके साथ अपना तंबू लगाएगा।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ में “प्रजाएँ” बहुवचन में है, न कि पारंपरिक एकवचन “प्रजा।”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνῆς μεγάλης
  choice: एक ऊँची आवाज़
  rationale: φωνή के साथ μέγας आवाज़ की तीव्रता या प्रबलता बताता है; आधुनिक हिन्दी में “ऊँची आवाज़” स्वाभाविक है।
- source_word: ἐκ τοῦ θρόνου
  choice: सिंहासन से आती हुई
  rationale: ἐκ स्रोत को सूचित करता है। इस रूप में हिन्दी वाक्य स्वाभाविक रहता है और प्रकाशितवाक्य की सिंहासन-संबंधी छवि सुरक्षित रहती है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाली उद्घोषणा है; “देखो” आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: ἡ σκηνὴ τοῦ θεοῦ
  choice: परमेश्वर का निवासस्थान
  rationale: σκηνή का मूल अर्थ तंबू या निवास-तंबू है, पर यहाँ परमेश्वर के मनुष्यों के बीच निवास पर बल है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और तंबू की छवि पादटिप्पणी में सुरक्षित है।
- source_word: μετὰ τῶν ἀνθρώπων
  choice: मनुष्यों के बीच
  rationale: ἄνθρωποι यहाँ समस्त मानवों को सामान्य रूप से सूचित करता है; “मनुष्यों” आधुनिक हिन्दी में समावेशी और स्रोत-संगत है।
- source_word: σκηνώσει
  choice: निवास करेगा
  rationale: σκηνόω का अर्थ निवास करना या तंबू लगाना है। “निवास करेगा” स्पष्ट है, जबकि संज्ञा के साथ इसका शब्द-संबंध पादटिप्पणी में बताया गया है।
- source_word: λαοὶ αὐτοῦ
  choice: उसकी प्रजाएँ
  rationale: SBLGNT में λαοί बहुवचन है। हिन्दी का बहुवचन “प्रजाएँ” इस असामान्य किंतु अर्थपूर्ण बहुलता को एकवचन में समतल नहीं करता।
- source_word: αὐτὸς ὁ θεός
  choice: परमेश्वर स्वयं
  rationale: αὐτός के बलाघात को “स्वयं” स्पष्ट रूप से व्यक्त करता है और परमेश्वर की प्रत्यक्ष उपस्थिति पर बल बनाए रखता है।
- source_word: μετ’ αὐτῶν ἔσται
  choice: उनके साथ होगा
  rationale: यह सरल भविष्यकालीन उपस्थिति-सूत्र है; हिन्दी में यह स्वाभाविक और अर्थनिष्ठ है।
theological_decisions:
- issue: λαοί का बहुवचन बनाम पारंपरिक एकवचन
  choice: वे उसकी प्रजाएँ होंगे
  alternative: वे उसकी प्रजा होंगे / वे उसके लोग होंगे
  rationale: आलोचनात्मक यूनानी पाठ में λαοί बहुवचन है। “प्रजाएँ” विभिन्न जनसमुदायों की बहुलता को बनाए रखता है और पाठ में उपस्थित तनाव को एकवचन बनाकर समाप्त नहीं करता।
- issue: σκηνή और σκηνόω में निवास-तंबू की छवि
  choice: निवासस्थान … निवास करेगा
  alternative: तंबू … अपना तंबू लगाएगा
  rationale: मुख्य पाठ सामान्य पाठक के लिए सहज रखा गया है, पर संज्ञा और क्रिया की साझा तंबू-संबंधी छवि तथा परमेश्वर की वाचा-संबंधी उपस्थिति पादटिप्पणियों में स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण उद्घोषणात्मक शैली अपनाई गई है। वाक्य सामान्य पाठक के लिए स्पष्ट है; असामान्य यूनानी बहुवचन तथा निवास-तंबू की अंतर्पाठीय छवि को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
