reference: Revelation 21:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἦλθεν εἷς ἐκ τῶν ἑπτὰ ἀγγέλων τῶν ἐχόντων τὰς ἑπτὰ φιάλας, ⸂τῶν γεμόντων⸃ τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων, καὶ ἐλάλησεν μετ’ ἐμοῦ λέγων· Δεῦρο, δείξω σοι τὴν ⸂νύμφην τὴν γυναῖκα⸃ τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/009.yaml
  text: Then one of the seven angels who had the seven bowls full of the seven last plagues came and spoke with me[a], saying, “Come, I will show you the bride[b], the wife of the Lamb.”
translation:
  language: hi
  text: फिर उन सात स्वर्गदूतों में से एक आया, जिनके पास सात कटोरे थे जो अंतिम सात विपत्तियों से भरे हुए थे, और उसने मेरे साथ बात की और कहा, “इधर आओ, मैं तुम्हें दुल्हन, मेम्ने की पत्नी, दिखाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: फिर
  rationale: कथा की अगली घटना का स्वाभाविक संकेत देता है और यूनानी संयोजक की क्रमवाचक शक्ति बनाए रखता है।
- source_word: τὰς ἑπτὰ φιάλας
  choice: वे सात कटोरे
  rationale: φιάλη चौड़े, उथले पात्र का बोध कराता है; आधुनिक हिन्दी में ‘कटोरे’ पारंपरिक ‘शीशियों’ से अधिक सटीक है।
- source_word: τῶν γεμόντων τῶν ἑπτὰ πληγῶν τῶν ἐσχάτων
  choice: जो अंतिम सात विपत्तियों से भरे हुए थे
  rationale: γεμόντων की ‘भरे हुए’ अवस्था, πληγῶν की न्यायकारी ‘विपत्तियाँ’, और ἐσχάτων का क्रमगत अर्थ ‘अंतिम’ स्पष्ट रूप से सुरक्षित हैं।
- source_word: ἐλάλησεν μετ’ ἐμοῦ λέγων
  choice: उसने मुझसे कहा
  rationale: हिन्दी में संवाद आरम्भ करने का स्वाभाविक रूप; μετά के सहचर्य भाव को शब्दशः ‘मेरे साथ बात की’ कहना यहाँ अनावश्यक रूप से असहज होगा।
- source_word: Δεῦρο
  choice: इधर आओ
  rationale: आमंत्रण और वक्ता की ओर आने की दिशा, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: δείξω σοι
  choice: मैं तुम्हें ... दिखाऊँगा
  rationale: भविष्यकालीन कथन को सीधे और स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: τὴν νύμφην τὴν γυναῖκα τοῦ ἀρνίου
  choice: दुल्हन, अर्थात मेम्ने की पत्नी
  rationale: νύμφη और γυνή दोनों वैवाहिक पदों को बनाए रखते हुए ‘अर्थात’ उनके समानाधिकरण संबंध को हिन्दी में स्पष्ट करता है।
- source_word: τοῦ ἀρνίου
  choice: मेम्ने की
  rationale: प्रकाशितवाक्य में ἀρνίον के स्थापित मसीही उपाधि-संबंधी अर्थ को ‘मेम्ना’ सुरक्षित रखता है।
theological_decisions:
- issue: νύμφην और γυναῖκα का संबंध
  choice: दोनों को ‘दुल्हन, अर्थात ... पत्नी’ के रूप में स्पष्ट रखना
  alternative: केवल ‘मेम्ने की दुल्हन’ या ‘दुल्हन-पत्नी’
  rationale: यूनानी पाठ में दोनों संज्ञाएँ समानाधिकरण में हैं; दोनों को रखना वैवाहिक प्रतीक की पूर्णता बनाए रखता है, जबकि ‘अर्थात’ हिन्दी पाठक के लिए उनके संबंध को सहज बनाता है।
- issue: ἀρνίον का मसीही उपाधि के रूप में अनुवाद
  choice: मेम्ना
  alternative: भेड़ का बच्चा
  rationale: ‘मेम्ना’ हिन्दी बाइबलीय भाषा में समझ में आने वाली, गरिमापूर्ण उपाधि है और पाठ में उपस्थित प्रतीक से आगे कोई सांप्रदायिक व्याख्या नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक प्रवाह सरल रखा गया है, पर प्रकाशितवाक्य की गरिमापूर्ण और प्रतीकात्मक भाषा सुरक्षित है। ‘जिनके पास’ स्वामित्व/धारण का सहज रूप है और ‘अर्थात’ समानाधिकरण को स्पष्ट करता है।
