base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/014.yaml
  text: And the wall of the city had twelve foundations[a], and on them were the twelve names of the twelve apostles of the Lamb.
translation:
  language: hi
  text: और नगर की दीवार की बारह नींवें थीं, और उन पर मेमने के बारह प्रेरितों के बारह नाम थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τεῖχος
  choice: दीवार
  rationale: यह शब्द विशेष रूप से नगर की दीवार को दर्शाता है; ‘दीवार’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: πόλεως
  choice: नगर की
  rationale: सम्बन्धवाचक रूप को सहज हिन्दी में ‘नगर की’ से व्यक्त किया गया है।
- source_word: ἔχων
  choice: की ... थीं
  rationale: यूनानी वर्तमान कृदन्त का अर्थ हिन्दी में स्वाभाविक वर्णनात्मक वाक्य के रूप में व्यक्त किया गया है।
- source_word: θεμελίους δώδεκα
  choice: बारह नींवें
  rationale: θεμέλιος का अर्थ ‘नींव’ या ‘नींव का पत्थर’ हो सकता है। मुख्य पाठ में अधिक सीधा अर्थ रखा गया है और दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐπ’ αὐτῶν
  choice: उन पर
  rationale: यह नींवों पर स्थित होने का भाव संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: δώδεκα ὀνόματα
  choice: बारह नाम
  rationale: मूल पाठ केवल ‘नाम’ कहता है; ‘अंकित नाम’ जैसी अतिरिक्त सूचना नहीं जोड़ी गई।
- source_word: ἀποστόλων
  choice: प्रेरितों
  rationale: नए नियम में इस विशिष्ट भूमिका के लिए ‘प्रेरित’ प्रचलित और अर्थ-सटीक हिन्दी शब्द है।
- source_word: τοῦ ἀρνίου
  choice: मेम्ने के
  rationale: प्रकाशितवाक्य में यह मसीह-संबंधी प्रमुख उपाधि है; ‘मेम्ना’ इसकी बाइबलीय प्रतिध्वनि बनाए रखता है।
theological_decisions:
- issue: मसीह-संबंधी उपाधि ἀρνίον
  choice: मेम्ने
  alternative: मेमने / भेड़ के बच्चे
  rationale: ‘मेम्ना’ प्रकाशितवाक्य की स्थापित मसीह-संबंधी उपाधि और बलिदानात्मक बिंब को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प मुख्य पाठ में नहीं रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘नगर’, ‘नींवें’, ‘प्रेरित’ और ‘मेम्ना’ जैसे परिचित बाइबलीय शब्द मूल के वास्तु और धर्मवैचारिक बिंबों को बनाए रखते हैं।
