id: REV.21.21
reference: Revelation 21:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οἱ δώδεκα πυλῶνες δώδεκα μαργαρῖται, ἀνὰ εἷς ἕκαστος τῶν πυλώνων ἦν ἐξ ἑνὸς μαργαρίτου· καὶ ἡ πλατεῖα τῆς πόλεως χρυσίον καθαρὸν ὡς ὕαλος διαυγής.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/021.yaml
  text: And the twelve gates were twelve pearls; each one of the gates was from a single pearl. And the street of the city was pure gold[a], like transparent glass.
translation:
  language: hi
  text: और वे बारह फाटक बारह मोती थे; हर एक फाटक एक ही मोती से बना था। और नगर की चौड़ी सड़क[a] शुद्ध सोने की थी, पारदर्शी काँच के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नगर का चौक’; πλατεῖα का अर्थ चौड़ी सड़क, खुला सार्वजनिक मार्ग या चौक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πυλῶνες
  choice: फाटक
  rationale: यहाँ नए यरूशलेम की वास्तुकला में बड़े प्रवेश-द्वार अभिप्रेत हैं; ‘फाटक’ स्वाभाविक और चित्रात्मक हिन्दी है।
- source_word: μαργαρῖται / μαργαρίτου
  choice: मोती / मोती
  rationale: शब्द सीधे ‘मोती’ को दर्शाता है; बहुवचन और फिर एकवचन को बनाए रखा गया है।
- source_word: ἀνὰ εἷς ἕκαστος
  choice: हर एक
  rationale: यह पदबंध प्रत्येक फाटक के अलग-अलग एक मोती से होने पर बल देता है; ‘हर एक’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: ἐξ ἑνὸς μαργαρίτου
  choice: एक ही मोती से बना था
  rationale: ἐξ सामग्री या स्रोत सूचित करता है और ἑνός एकत्व पर बल देता है; हिन्दी में ‘एक ही मोती से बना था’ अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: πλατεῖα
  choice: चौड़ी सड़क
  rationale: स्त्रीलिंग विशेषण से संज्ञीकृत यह शब्द सामान्यतः चौड़ी सड़क या सार्वजनिक खुला मार्ग दर्शाता है। ‘चौड़ी सड़क’ मूल शब्द की अंतर्निहित चौड़ाई को बनाए रखता है; ‘नगर का चौक’ भी संभव है।
- source_word: χρυσίον καθαρὸν
  choice: शुद्ध सोना
  rationale: यह पद सोने की निर्मलता या शुद्धता बताता है; ‘शुद्ध सोना’ मानक और सहज हिन्दी है।
- source_word: ὡς ὕαλος διαυγής
  choice: पारदर्शी काँच के समान
  rationale: διαυγής आर-पार दिखाई देने जैसी स्पष्टता व्यक्त करता है; यह अनुवाद दर्शन के असाधारण बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: πλατεῖα में नगर के मार्ग या खुले सार्वजनिक स्थान का बिंब
  choice: ‘चौड़ी सड़क’ के रूप में अनुवाद
  alternative: ‘नगर का चौक’ या केवल ‘सड़क’
  rationale: यह मुख्यतः शब्दार्थ और दृश्य-बिंब का प्रश्न है, doctrinal निर्धारण नहीं। ‘चौड़ी सड़क’ यूनानी शब्द की सामान्य मार्ग-संबंधी धारणा और उसकी चौड़ाई दोनों को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘फाटक’, ‘शुद्ध सोना’ और ‘पारदर्शी काँच’ दर्शन की वास्तुशिल्पीय तथा विलक्षण छवि को स्पष्ट रखते हैं।
