  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξαλείψει πᾶν δάκρυον ⸀ἐκ τῶν ὀφθαλμῶν αὐτῶν, καὶ ὁ θάνατος οὐκ ἔσται ἔτι· οὔτε πένθος οὔτε κραυγὴ οὔτε πόνος οὐκ ἔσται ⸀ἔτι. τὰ πρῶτα ἀπῆλθαν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/004.yaml
  text: And he will wipe away every tear from their eyes[a], and death will be no more; neither mourning nor crying nor pain will be any more[c][b]. The former things have passed away.
translation:
  language: hi
  text: और वह उनकी आँखों से हर आँसू पोंछ देगा[a]। मृत्यु फिर नहीं रहेगी; न शोक, न रोना[b], न पीड़ा फिर कभी होंगे। पुरानी बातें बीत गई हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “सारे आँसू।” यूनानी में एकवचन का भाव वितरणात्मक है: “हर आँसू।”'
    reason: lexical_alternative
  - marker: b
    text: या, “चीख-पुकार।” यूनानी शब्द रोने की आवाज़, पुकार या ऊँची चीख को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “पहली बातें बीत गई हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξαλείψει
  choice: पोंछ देगा
  rationale: आँसुओं के संदर्भ में ἐξαλείφω का स्वाभाविक और व्यक्तिगत भाव ‘पोंछ देना’ है; ‘मिटा देना’ यहाँ कम स्वाभाविक और अधिक अमूर्त होता।
- source_word: πᾶν δάκρυον
  choice: हर आँसू
  rationale: एकवचन के साथ πᾶν का वितरणात्मक बल है—एक-एक आँसू। ‘हर आँसू’ इसे सहज हिन्दी में बनाए रखता है।
- source_word: ἐκ τῶν ὀφθαλμῶν αὐτῶν
  choice: उनकी आँखों से
  rationale: ἐκ द्वारा व्यक्त हटाए जाने के भाव का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὁ θάνατος
  choice: मृत्यु
  rationale: मूल में निश्चित उपपद के बावजूद यहाँ हिन्दी में अमूर्त संज्ञा ‘मृत्यु’ स्वाभाविक है और मृत्यु के पूर्ण अंत को व्यक्त करती है।
- source_word: οὐκ ἔσται ἔτι
  choice: फिर नहीं रहेगी / फिर रहेगी
  rationale: दोनों प्रयोगों में ἔτι के ‘अब आगे कभी नहीं’ वाले निर्णायक भाव को ‘फिर’ से व्यक्त किया गया है। दूसरे वाक्य में ‘न ... फिर रहेगी’ पूरी सूची पर लागू होता है।
- source_word: πένθος
  choice: शोक
  rationale: यह मृत्यु या गहरी हानि से जुड़े मातम और दुःख को दर्शाता है; ‘शोक’ आधुनिक मानक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: κραυγή
  choice: रोना
  rationale: κραυγή पुकार या ऊँची आवाज़ में रोने को दर्शा सकता है। सांत्वना के इस प्रसंग में ‘रोना’ स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: πόνος
  choice: पीड़ा
  rationale: यह दर्द, कष्ट या श्रम को दर्शा सकता है; इस दुःख-सूची में ‘पीड़ा’ शारीरिक और भावनात्मक कष्ट दोनों के लिए उपयुक्त है।
- source_word: τὰ πρῶτα
  choice: पुरानी बातें
  rationale: यह पहले की व्यवस्था या पूर्व दशा की बात करता है। ‘पुरानी बातें’ सामान्य हिन्दी में सहज है और पुरानी सृष्टि की अवस्थाओं को अनावश्यक रूप से स्पष्ट किए बिना संकेतित करता है।
- source_word: ἀπῆλθαν
  choice: बीत गई हैं
  rationale: अओरिस्ट क्रिया पूर्ण हो चुके प्रस्थान को बताती है। ‘बीत गई हैं’ दर्शन में घोषित पूर्ण परिवर्तन और उसके वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पोंछ देगा’ का कर्ता इस पद में स्पष्ट संज्ञा के रूप में नहीं, पिछले संदर्भ से निहित है।
  choice: ‘वह ... पोंछ देगा’
  alternative: ‘परमेश्वर ... पोंछ देगा’
  rationale: यूनानी क्रिया में तृतीय पुरुष एकवचन कर्ता निहित है और उसका संदर्भ प्रकाशितवाक्य 21:3 से मिलता है। ‘वह’ मूल की संदर्भगत एकता बनाए रखता है और पद में ‘परमेश्वर’ नाम नहीं जोड़ता।
- issue: नई सृष्टि में मृत्यु, शोक, रोना और पीड़ा के अंत का विस्तार।
  choice: 'पूर्ण और निर्णायक भाषा: ‘मृत्यु फिर नहीं रहेगी’ तथा ‘न ... फिर रहेगी।’'
  alternative: ‘मृत्यु कम हो जाएगी’ या दुःख के अंत को सीमित करने वाली कोई व्याख्या
  rationale: यूनानी पाठ इन वास्तविकताओं की केवल कमी नहीं, उनके सर्वथा समाप्त होने की घोषणा करता है; अनुवाद उसी पूर्ण भविष्यगत निर्णायकता को रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सांत्वनापूर्ण शैली रखी गई है। समानांतर नकारात्मक सूची की लय बचाने के लिए ‘न शोक, न रोना, न पीड़ा’ प्रयोग किया गया है। सर्वनाम ‘वह’ को संदर्भ पर निर्भर रहने दिया गया है, जैसे मूल यूनानी में।
