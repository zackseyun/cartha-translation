source:
  edition: SBLGNT
  text: Καὶ εἶπεν ὁ καθήμενος ἐπὶ τῷ θρόνῳ· Ἰδοὺ ⸂καινὰ ποιῶ πάντα⸃. καὶ ⸀λέγει· Γράψον, ὅτι οὗτοι οἱ λόγοι ⸂πιστοὶ καὶ ἀληθινοί⸃ εἰσιν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/005.yaml
  text: And the one seated on the throne said[a], “Behold, I am making all things new.” And he said, “Write[b], because these words are trustworthy and true.”
translation:
  language: hi
  text: और जो सिंहासन पर विराजमान था, उसने कहा, “देखो, मैं सब कुछ नया कर रहा हूँ।” फिर उसने कहा, “लिखो, क्योंकि ये वचन विश्वसनीय और सच्चे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ καθήμενος ἐπὶ τῷ θρόνῳ
  choice: जो सिंहासन पर विराजमान था
  rationale: वर्तमान कृदंत के वर्णनात्मक भाव और राजासन के गौरवपूर्ण प्रसंग को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘विराजमान’ अधिकार और आसन की छवि बनाए रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का सीधा और आधुनिक हिन्दी रूप, जो कथन की गंभीरता भी बनाए रखता है।
- source_word: καινὰ ποιῶ πάντα
  choice: मैं सब कुछ नया कर रहा हूँ
  rationale: ποιῶ के वर्तमान, सक्रिय भाव को ‘कर रहा हूँ’ से और πάντα के व्यापक दायरे को ‘सब कुछ’ से व्यक्त किया गया है; यह न तो पूर्ण प्रतिस्थापन और न केवल मरम्मत का अर्थ थोपता है।
- source_word: Γράψον
  choice: लिखो
  rationale: यूनानी के सीधे आज्ञार्थक रूप को बिना कोई अप्रकट कर्म जोड़े सुरक्षित रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ लिखने की आज्ञा का कारण प्रस्तुत करता है, इसलिए कारणसूचक ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
- source_word: οὗτοι οἱ λόγοι
  choice: ये वचन
  rationale: प्रकाशित कथनों के लिए ‘वचन’ गरिमापूर्ण और हिन्दी बाइबलीय प्रयोग में सुबोध है, फिर भी अर्थ को किसी एक प्रकार के कथन तक सीमित नहीं करता।
- source_word: πιστοὶ καὶ ἀληθινοί
  choice: विश्वसनीय और सच्चे
  rationale: πιστοί का प्रसंगानुकूल अर्थ भरोसे के योग्य और ἀληθινοί का सीधा अर्थ सत्य होना है; दोनों विशेषताओं का भेद बनाए रखा गया है।
theological_decisions:
- issue: καινὰ ποιῶ πάντα में अंतिम नवीनीकरण का स्वरूप और विस्तार
  choice: मैं सब कुछ नया कर रहा हूँ
  alternative: मैं सारी वस्तुओं को नया करता हूँ
  rationale: चुना हुआ रूप वर्तमान क्रिया और व्यापक दायरे को स्वाभाविक हिन्दी में रखता है, पर यह निर्णय नहीं करता कि बात सृष्टि के प्रतिस्थापन की है या उसके रूपांतरण की।
- issue: सिंहासन पर बैठे वक्ता का परिचय
  choice: जो सिंहासन पर विराजमान था
  alternative: जो सिंहासन पर बैठा था
  rationale: पाठ में दी गई सिंहासन की छवि और अधिकार को बनाए रखता है, पर वक्ता के बारे में कोई अतिरिक्त धर्मसैद्धांतिक पहचान नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए सुबोध किंतु प्रकाशितवाक्य के सिंहासन-दृश्य के अनुरूप गरिमापूर्ण रखी गई है। ‘विराजमान’ अपेक्षाकृत ऊँचा शब्द है, पर इस राजकीय प्रसंग में स्वाभाविक है।
