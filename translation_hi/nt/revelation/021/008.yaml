id: REV.21.8
reference: Revelation 21:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῖς δὲ δειλοῖς καὶ ⸀ἀπίστοις καὶ ἐβδελυγμένοις καὶ φονεῦσι καὶ πόρνοις καὶ φαρμάκοις καὶ εἰδωλολάτραις καὶ πᾶσι τοῖς ψευδέσιν τὸ μέρος αὐτῶν ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ, ὅ ἐστιν ὁ θάνατος ὁ δεύτερος.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/008.yaml
  text: But for the cowardly and unbelieving and detestable and murderers and sexually immoral and sorcerers and idolaters and all liars[a], their portion will be in the lake burning with fire and sulfur[c][b], which is the second death.
translation:
  language: hi
  text: परन्तु कायरों, अविश्वासियों[a], घृणित लोगों, हत्यारों, यौन अनैतिकता में लगे लोगों, जादू-टोना करने वालों, मूर्तिपूजकों और सभी झूठ बोलने वालों का भाग उस झील में होगा जो आग और गन्धक से जलती रहती है। यही दूसरी मृत्यु है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विश्वासहीन’ अथवा ‘अविश्वस्त’।
    reason: ग्रीक ἀπίστοις का अर्थ ‘अविश्वासी’ के साथ-साथ ‘विश्वासहीन’ या ‘अविश्वस्त’ भी हो सकता है।
lexical_decisions:
- source_word: δειλοῖς
  choice: कायरों
  rationale: यह शब्द केवल भयभीत होने के बजाय नैतिक रूप से निन्दनीय कायरता व्यक्त करता है।
- source_word: ἀπίστοις
  choice: अविश्वासियों
  rationale: इस न्याय-सूची में इसका सबसे सीधा अर्थ विश्वास न करने वाले हैं; ‘विश्वासघाती’ अर्थ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: ἐβδελυγμένοις
  choice: घिनौने लोगों
  rationale: पूर्ण कृदन्त ऐसे लोगों को दर्शाता है जो घृणित या दूषित बातों से पहचाने जाते हैं; यह हिन्दी में स्वाभाविक और प्रबल है।
- source_word: φονεῦσι
  choice: हत्यारों
  rationale: यह सामान्यतः जान लेने वाले किसी भी व्यक्ति के बजाय हत्या करने वालों को सूचित करता है।
- source_word: πόρνοις
  choice: यौन अनैतिकता करने वालों
  rationale: यह व्यापक यौन अनैतिक आचरण करने वालों की श्रेणी बताता है और संकीर्ण या पुरातन शब्दावली से बचता है।
- source_word: φαρμάκοις
  choice: जादू-टोना करने वालों
  rationale: प्रकाशितवाक्य के सन्दर्भ में यह जादुई या तान्त्रिक क्रियाओं के अभ्यासियों को दर्शाता है, औषधि बनाने वालों को नहीं।
- source_word: εἰδωλολάτραις
  choice: मूर्तिपूजकों
  rationale: यह मूर्तियों की उपासना करने वालों का सीधा और प्रचलित हिन्दी पद है।
- source_word: πᾶσι τοῖς ψευδέσιν
  choice: सभी झूठों
  rationale: विशेषण यहाँ संज्ञा के रूप में झूठे व्यक्तियों को दर्शाता है; संक्षिप्त हिन्दी सूची में यह अर्थ स्पष्ट रहता है।
- source_word: τὸ μέρος αὐτῶν
  choice: उनका भाग ... होगा
  rationale: μέρος आवंटित हिस्से या नियति को दर्शाता है; भविष्यकाल हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: ἐν τῇ λίμνῃ τῇ καιομένῃ πυρὶ καὶ θείῳ
  choice: उस झील में ... जो आग और गन्धक से जलती रहती है
  rationale: कृदन्त झील को निरन्तर जलती हुई बताता है; θείον का आधुनिक और प्रत्यक्ष हिन्दी अर्थ ‘गन्धक’ है।
- source_word: ὅ ἐστιν ὁ θάνατος ὁ δεύτερος
  choice: यही दूसरी मृत्यु है
  rationale: सम्बन्धवाचक कथन पिछली झील की पूरी छवि की पहचान दूसरी मृत्यु के रूप में कराता है; हिन्दी में ‘यही’ उसका व्याख्यात्मक बल स्वाभाविक रूप से देता है।
theological_decisions:
- issue: न्याय-सूची में ἄπιστος का अर्थ
  choice: अविश्वासी
  alternative: विश्वासघाती / विश्वास न रखने वाले
  rationale: सन्दर्भ में विश्वास न करने का अर्थ सर्वाधिक सीधा है, पर शब्द विश्वासहीनता या विश्वासघात भी व्यक्त कर सकता है; इस अर्थगत और धर्मवैचारिक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ὅ का पूर्वगामी
  choice: ‘यही दूसरी मृत्यु है’ से आग और गन्धक से जलती झील की पूरी छवि की पहचान
  alternative: व्याकरणिक रूप से केवल झील को ‘दूसरी मृत्यु’ कहना
  rationale: नपुंसकलिंग ὅ स्त्रीलिंग λίμνη से सीधा लिंग-सामंजस्य नहीं रखता, इसलिए यह पिछले पूरे कथन या दृश्य की ओर संकेत कर सकता है; हिन्दी में ‘यही’ अनावश्यक रूप से पूर्वगामी को सीमित नहीं करता।
- issue: θείῳ की प्रस्तुति
  choice: गन्धक
  alternative: पुरानी धार्मिक शब्दावली में ‘ब्रिमस्टोन’ के तुल्य पारम्परिक पद
  rationale: मूल संज्ञा का सीधा अर्थ गन्धक है और आधुनिक हिन्दी में यही स्पष्ट तथा सहज है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और मौखिक पठन के अनुकूल शैली। मूल की संचयी दोष-सूची को अल्पविरामों से रखा गया है; अत्यधिक कृत्रिम ‘और’ की पुनरावृत्ति से बचते हुए अन्तिम पद से पहले ‘और’ रखा गया है। ‘परन्तु’ पिछले सन्दर्भ के विरोध को बनाए रखता है।
