  revision_rationale: The revision corrects the personal reference of πᾶσι τοῖς ψευδέσιν, smooths one awkward Hindi phrase, and refines the ἀπίστοις footnote so that its alternatives remain lexically possible without over-interpreting the term. The source’s ambiguity and the verse’s formal, cumulative register are retained.
