review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek vice list, the allotted ‘portion,’ the lake burning with fire and sulfur, and its identification as the second death. However, ‘सभी झूठों’ denotes lies rather than persons who lie, and therefore does not faithfully render the substantival plural τοῖς ψευδέσιν.
  naturalness: The sentence is generally clear and suitable for modern standard Hindi. ‘यौन अनैतिकता में लगे लोगों’ is more idiomatic than ‘यौन अनैतिकता करने वालों,’ while retaining the broad category of πόρνοις.
  terminology: ‘कायरों,’ ‘अविश्वासियों,’ ‘हत्यारों,’ ‘जादू-टोना करने वालों,’ ‘मूर्तिपूजकों,’ and ‘गन्धक’ are appropriate. The footnote should offer ‘विश्वासहीन’/‘अविश्वस्त’ rather than ‘विश्वासघाती,’ which can imply a more specific betrayal than the Greek requires.
  issues:
  - severity: high
    issue: ‘सभी झूठों’ is not a personal designation in Hindi.
    rationale: In ordinary Hindi, झूठ is ‘a lie’; the Greek τοῖς ψευδέσιν refers to false persons/liars. ‘सभी झूठ बोलने वालों’ clearly preserves the referent.
  - severity: medium
    issue: The footnote’s ‘विश्वासघातियों’ over-specifies the alternative sense of ἀπίστοις.
    rationale: ἀπίστος may mean unbelieving, faithless, or unfaithful, but ‘विश्वासघाती’ commonly suggests betrayal/treachery. ‘विश्वासहीन’ or ‘अविश्वस्त’ better preserves the lexical ambiguity without adding that implication.
  - severity: low
    issue: ‘यौन अनैतिकता करने वालों’ is somewhat cumbersome.
    rationale: ‘यौन अनैतिकता में लगे लोगों’ is natural modern Hindi and retains the broad, nontechnical scope of πόρνοις.
  revised_text: परन्तु कायरों, अविश्वासियों[a], घृणित लोगों, हत्यारों, यौन अनैतिकता में लगे लोगों, जादू-टोना करने वालों, मूर्तिपूजकों और सभी झूठ बोलने वालों का भाग उस झील में होगा जो आग और गन्धक से जलती रहती है। यही दूसरी मृत्यु है।
