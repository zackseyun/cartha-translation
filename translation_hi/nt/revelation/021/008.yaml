- from: परन्तु कायरों, अविश्वासियों[a], घिनौने लोगों, हत्यारों, यौन अनैतिकता करने वालों, जादू-टोना करने वालों, मूर्तिपूजकों और सभी झूठों का भाग उस झील में होगा जो आग और गन्धक से जलती रहती है। यही दूसरी मृत्यु है।
