  yaml_path: translation/nt/revelation/021/015.yaml
  text: And the one speaking with me had a golden measuring rod[a], so that he might measure the city and its gates and its wall.
translation:
  language: hi
  text: और जो मुझसे बात कर रहा था, उसके पास एक सोने की नापने वाली छड़[a] थी, ताकि वह उस नगर, उसके फाटकों और उसकी दीवार को नापे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोने का नापने वाला सरकंडा।” यूनानी शब्द κάλαμος का शाब्दिक अर्थ “सरकंडा” है; यहाँ यह नापने के लिए इस्तेमाल होने वाले उपकरण को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λαλῶν μετ’ ἐμοῦ
  choice: जो मुझसे बात कर रहा था
  rationale: वर्तमान कृदन्त के चलते हुए वर्णनात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और मूल में न आए ‘स्वर्गदूत’ को नहीं जोड़ता।
- source_word: εἶχεν
  choice: उसके पास ... थी
  rationale: ἔχω के अपूर्णकाल का सीधा और स्वाभाविक अर्थ रखता है; ‘हाथ में लिए था’ जैसा अतिरिक्त संकेत नहीं जोड़ता।
- source_word: μέτρον κάλαμον χρυσοῦν
  choice: नापने की एक सोने की छड़
  rationale: κάλαμος का शाब्दिक अर्थ सरकंडा है, पर यहाँ वह नापने के उपकरण के रूप में प्रयुक्त है; ‘छड़’ आधुनिक पाठक को उसका कार्य स्पष्ट बताती है, जबकि पादटिप्पणी शाब्दिक चित्र सुरक्षित रखती है।
- source_word: ἵνα μετρήσῃ
  choice: ताकि वह ... नापे
  rationale: ἵνα और संभावनार्थक क्रिया से व्यक्त उद्देश्य को स्पष्ट और सहज हिन्दी में सुरक्षित रखता है।
- source_word: τὴν πόλιν
  choice: उस नगर
  rationale: संदर्भ में पहले से निर्दिष्ट नगर की ओर संकेत को ‘उस’ से स्वाभाविक रूप में व्यक्त किया गया है; मूल संज्ञा में ‘नया यरूशलेम’ स्पष्टतः नहीं जोड़ा गया।
- source_word: τοὺς πυλῶνας αὐτῆς
  choice: उसके फाटकों
  rationale: πυλών के बड़े द्वार अथवा प्रवेश-द्वार के अर्थ के लिए ‘फाटक’ वास्तु-संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: τὸ τεῖχος αὐτῆς
  choice: उसकी शहरपनाह
  rationale: τεῖχος नगर को घेरने वाली रक्षात्मक दीवार है; ‘शहरपनाह’ साधारण ‘दीवार’ की अपेक्षा इस वास्तु-अर्थ को सटीक रूप से व्यक्त करती है।
theological_decisions:
- issue: बोलने वाले की पहचान स्पष्टतः स्वर्गदूत के रूप में की जाए या नहीं
  choice: मूल के अनुसार ‘जो मुझसे बात कर रहा था’ रखा गया है।
  alternative: ‘जो स्वर्गदूत मुझसे बात कर रहा था’
  rationale: व्यापक संदर्भ उस व्यक्ति को स्वर्गदूत बताता है, पर इस पद में ‘स्वर्गदूत’ संज्ञा नहीं है। अतः मूल की अभिव्यक्ति और उसकी निहितता को बिना विस्तार दिए सुरक्षित रखा गया है।
