  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οἱ πυλῶνες αὐτῆς οὐ μὴ κλεισθῶσιν ἡμέρας, νὺξ γὰρ οὐκ ἔσται ἐκεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/025.yaml
  text: And its gates will never be shut by day—for there will be no night there—[a][b]
translation:
  language: hi
  text: और उसके फाटक दिन में कभी बन्द नहीं किए जाएँगे, क्योंकि वहाँ रात होगी ही नहीं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “उसके फाटक दिन में निश्चय ही कभी बन्द नहीं किए जाएँगे।” यूनानी में निषेध पर विशेष बल है।'
    reason: lexical_alternative
  - marker: b
    text: फाटक बन्द न किए जाने का कारण यह बताया गया है कि वहाँ रात होगी ही नहीं।
    reason: cross_reference
lexical_decisions:
- source_word: πυλῶνες
  choice: फाटक
  rationale: नगर के संदर्भ में यह शब्द नगर के प्रवेश-द्वारों या द्वार-परिसरों को दर्शाता है; आधुनिक हिन्दी में ‘फाटक’ स्वाभाविक और दृश्यात्मक है।
- source_word: οὐ μὴ κλεισθῶσιν
  choice: कभी बन्द नहीं किए जाएँगे
  rationale: οὐ μή के साथ aorist subjunctive भविष्य के विषय में प्रबल निषेध व्यक्त करता है; ‘कभी ... नहीं’ उस बल को सहज हिन्दी में प्रकट करता है।
- source_word: ἡμέρας
  choice: दिन में
  rationale: यहाँ संबंधकारक का प्रयोग कालवाचक क्रियाविशेषण के रूप में हुआ है और आगे ‘रात’ के साथ स्पष्ट विरोध बनाता है।
- source_word: νὺξ γὰρ οὐκ ἔσται ἐκεῖ
  choice: क्योंकि वहाँ रात होगी ही नहीं
  rationale: ‘क्योंकि’ γάρ के कारणसूचक अर्थ को और ‘होगी ही नहीं’ रात के न होने के अस्तित्ववाचक तथा दृढ़ भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले वर्णन से पद को जोड़ने वाला सामान्य संयोजक है।
- source_word: αὐτῆς
  choice: उसके
  rationale: स्त्रीलिंग यूनानी सर्वनाम व्याकरणिक रूप से नगर के लिए है; हिन्दी में ‘उसके’ स्वाभाविक है और अनावश्यक व्यक्तिकरण नहीं जोड़ता।
theological_decisions:
- issue: नई यरूशलेम के व्यक्तिकरण की मात्रा
  choice: ‘उसके फाटक’
  alternative: ‘उस स्त्री के फाटक’ या दुल्हन-संबंधी व्यक्तिकरण को स्पष्ट करना
  rationale: यूनानी स्त्रीलिंग सर्वनाम नगर के व्याकरणिक लिंग से मेल खाता है। इस उपवाक्य में मुख्य बल नगर के सदा खुले रहने और वहाँ रात न होने पर है; इसलिए हिन्दी में स्वाभाविक सर्वनाम रखा गया है, बिना दुल्हन की छवि को यहाँ अनावश्यक रूप से उभारने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। ‘बन्द’ सामान्य प्रचलित वर्तनी है; वाक्य की कारणसूचक संरचना γάρ को स्पष्ट रखती है।
