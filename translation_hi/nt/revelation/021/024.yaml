id: REV.21.24
reference: Revelation 21:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ περιπατήσουσιν τὰ ἔθνη διὰ τοῦ φωτὸς αὐτῆς· καὶ οἱ βασιλεῖς τῆς γῆς φέρουσιν ⸂τὴν δόξαν αὐτῶν⸃ εἰς αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/024.yaml
  text: And the nations will walk by its light[c][b][a], and the kings of the earth will bring their glory into it.
translation:
  language: hi
  text: और जातियाँ उसके प्रकाश के सहारे[a] चलेंगी, और पृथ्वी के राजा अपनी महिमा[b] उसमें ले आएँगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके प्रकाश में।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपना वैभव” अथवा “अपना सम्मान।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से “लाते हैं”; संदर्भ इसे भविष्य के अर्थ में समझने की अनुमति देता है।
    reason: source_form
lexical_decisions:
- source_word: περιπατήσουσιν
  choice: चलेंगी
  rationale: यह क्रिया यहाँ प्रकाश में चलने की सजीव, ठोस छवि प्रस्तुत करती है; इसलिए रूपक को सामान्यीकृत करके ‘जीएँगी’ नहीं किया गया।
- source_word: τὰ ἔθνη
  choice: जातियाँ
  rationale: यह सामूहिक जातीय-राजनीतिक समूहों को सूचित करता है और इस दर्शन की भविष्यद्वाणी-संबंधी पृष्ठभूमि के अनुकूल है।
- source_word: διὰ τοῦ φωτὸς αὐτῆς
  choice: उसके प्रकाश के सहारे
  rationale: διά के साथ संबंधकारक यहाँ साधन का भाव दे सकता है। ‘के सहारे’ स्वाभाविक हिन्दी में बताता है कि नगर का प्रकाश उनके चलने का माध्यम है, जबकि ‘प्रकाश में’ भी संभव है।
- source_word: οἱ βασιλεῖς τῆς γῆς
  choice: पृथ्वी के राजा
  rationale: प्रकाशितवाक्य में यह सांसारिक शासकों के लिए प्रयुक्त मानक प्रलयदर्शी अभिव्यक्ति है।
- source_word: φέρουσιν
  choice: ले आएँगे
  rationale: यूनानी में वर्तमानकालीन रूप है, पर भविष्यकालीन दर्शन और पहले खंड के भविष्यकाल के संदर्भ में हिन्दी में भविष्यकाल स्वाभाविक है। मूल रूप को पाद-टिप्पणी में बताया गया है।
- source_word: τὴν δόξαν αὐτῶν
  choice: अपनी महिमा
  rationale: ‘महिमा’ δόξα की बाइबिलीय और भविष्यद्वाणी-संबंधी प्रतिध्वनि बनाए रखती है; यहाँ वैभव और सम्मान के अर्थ भी निहित हो सकते हैं।
- source_word: εἰς αὐτήν
  choice: उसमें
  rationale: εἰς का स्थानगत भाव ‘में’ से व्यक्त होता है। सर्वनाम निकट संदर्भ में नगर को सूचित करता है; हिन्दी में ‘उसमें’ स्वाभाविक है और अनावश्यक रूप से व्यक्तिकरण को प्रबल नहीं करता।
theological_decisions:
- issue: नई यरूशलेम के लिए स्त्रीलिंग यूनानी सर्वनाम का संदर्भ और व्यक्तिकरण
  choice: सर्वनाम को ‘उसके/उसमें’ के रूप में नगर के लिए लिया गया है।
  alternative: नगर को दुल्हन के रूप में प्रमुखता देते हुए अधिक स्पष्ट व्यक्तिकृत भाषा का प्रयोग करना।
  rationale: अध्याय में नई यरूशलेम दुल्हन के रूप में व्यक्तिकृत है, पर इस वाक्य की निकटवर्ती छवि नगर और स्थान की है। हिन्दी सर्वनाम स्वाभाविक रूप से दोनों संभावनाओं पर अनावश्यक निर्णय नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चलेंगी’ दर्शन की ठोस छवि को बनाए रखता है, और ‘महिमा’ बाइबिलीय प्रतिध्वनि को सुरक्षित रखती है।
