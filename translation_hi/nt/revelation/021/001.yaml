  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶδον οὐρανὸν καινὸν καὶ γῆν καινήν· ὁ γὰρ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ ἀπῆλθαν, καὶ ἡ θάλασσα οὐκ ἔστιν ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/001.yaml
  text: And I saw a new heaven and a new earth[a], for the first heaven and the first earth had passed away[b], and the sea is no more.
translation:
  language: hi
  text: और मैंने एक नया आकाश और एक नई पृथ्वी देखी, क्योंकि पहला आकाश और पहली पृथ्वी[a] लुप्त हो चुके थे, और समुद्र अब नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहला आकाश और पहली पृथ्वी’ का अनुवाद ‘पूर्ववर्ती आकाश और पूर्ववर्ती पृथ्वी’ भी हो सकता है। यूनानी में शब्दशः ‘पहला’ है, जो नए क्रम की तुलना में पहले के क्रम को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘समुद्र’ को शाब्दिक अर्थ में समझा जा सकता है; फिर भी प्रकाशितवाक्य में यह अराजकता, खतरे या अलगाव से जुड़े भाव भी जगा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: εἶδον
  choice: मैंने ... देखा/देखी
  rationale: ὁράω के अओरिस्ट रूप को सरल भूतकाल में रखना दर्शन-वर्णन की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति है। संयुक्त कर्म में निकटतम स्त्रीलिंग संज्ञा ‘पृथ्वी’ के अनुसार क्रिया ‘देखी’ रखी गई है।
- source_word: οὐρανὸν καινὸν καὶ γῆν καινήν
  choice: एक नया आकाश और एक नई पृथ्वी
  rationale: καινός को ‘नया’ कहना गुण या प्रकार की नवीनता को खुला रखता है और यह तय नहीं करता कि पुरानी सृष्टि बदली गई है या पूरी तरह प्रतिस्थापित। इस विश्वव्यापी दर्शन में οὐρανός और γῆ के लिए ‘आकाश’ और ‘पृथ्वी’ स्वाभाविक युग्म है।
- source_word: ὁ πρῶτος οὐρανὸς καὶ ἡ πρώτη γῆ
  choice: पहला आकाश और पहली पृथ्वी
  rationale: πρῶτος का सीधा अर्थ ‘पहला’ है। यह नए क्रम के विपरीत पहले के सृष्टि-क्रम को सूचित कर सकता है; उस संभावना को पाद-टिप्पणी में रखा गया है।
- source_word: ἀπῆλθαν
  choice: जा चुके थे
  rationale: ἀπέρχομαι के मूल भाव ‘चले जाना’ को स्वाभाविक हिन्दी में व्यक्त करता है। पूर्ण भूतकाल यह स्पष्ट करता है कि यूहन्ना के दर्शन के समय पहले वाला आकाश और पृथ्वी जा चुके थे, जबकि यह अनावश्यक रूप से विनाश या रूपांतरण में से किसी एक को निश्चित नहीं करता।
- source_word: ἡ θάλασσα
  choice: समुद्र
  rationale: θάλασσα का सीधा और सामान्य हिन्दी अर्थ ‘समुद्र’ है। संभावित प्रतीकात्मक अर्थ को मुख्य पाठ में नहीं जोड़ा गया है।
- source_word: οὐκ ἔστιν ἔτι
  choice: अब नहीं है
  rationale: यह ἔστιν के वर्तमानकाल और ἔτι के ‘अब और नहीं’ वाले भाव को संक्षिप्त, स्पष्ट हिन्दी में बनाए रखता है।
theological_decisions:
- issue: नए आकाश और नई पृथ्वी का स्वरूप
  choice: ‘नया’ रखा गया है और प्रतिस्थापन अथवा रूपांतरण में से किसी को निश्चित नहीं किया गया।
  alternative: इसे पूरी तरह दूसरी सृष्टि या वर्तमान सृष्टि का नवीकरण बताना।
  rationale: καινός नवीनता बताता है, पर यह पद स्वयं उस नवीनता की प्रक्रिया या तत्त्वमीमांसीय प्रकृति निर्धारित नहीं करता।
- issue: ‘समुद्र अब नहीं है’ का आशय
  choice: मुख्य पाठ में ठोस चित्र ‘समुद्र’ को ज्यों का त्यों रखा गया है।
  alternative: इसे केवल समुद्र का शाब्दिक अभाव अथवा केवल अराजकता, संकट या अलगाव के अंत के रूप में स्पष्ट करना।
  rationale: प्रकाशितवाक्य में समुद्र प्रतीकात्मक संबंध रख सकता है, फिर भी पद का शब्दांकन किसी एक व्याख्या को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फिर मैंने’ दर्शन की कथा-श्रृंखला को आगे बढ़ाता है। यूनानी के वर्तमानकाल को ध्यान में रखते हुए अंतिम खंड में ‘अब नहीं है’ रखा गया है, भले ही उससे पहले पूर्ण भूतकाल आया है। दोनों पाद-टिप्पणी चिह्न संबंधित वाक्यांशों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
