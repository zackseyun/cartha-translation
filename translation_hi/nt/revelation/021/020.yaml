  rationale: सहज हिन्दी में बैंगनी अमेथिस्ट के लिए प्रचलित नाम, यद्यपि आधुनिक खनिज-विज्ञान में 'नीलम' अधिक व्यापक/भिन्न भी हो सकता है।
