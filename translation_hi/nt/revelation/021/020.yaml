- source_word: βήρυλλος
  choice: बेरिल
  rationale: इस रत्न का मानक आधुनिक नाम।
- source_word: τοπάζιον
  choice: पुखराज
  rationale: हिन्दी में टोपाज़ के लिए व्यापक और सहज रत्न-नाम।
- source_word: χρυσόπρασος
  choice: क्रिसोप्रेज़
  rationale: स्थापित रत्न-नाम का हिन्दी लिप्यंतरण; व्युत्पत्तिपरक अनुवाद अस्पष्ट होगा।
- source_word: ὑάκινθος
  choice: जैसिन्थ
  rationale: यहाँ फूल नहीं बल्कि रत्न अभिप्रेत है; पारंपरिक रत्न-नाम अर्थभेद बनाए रखता है।
- source_word: ἀμέθυστος
