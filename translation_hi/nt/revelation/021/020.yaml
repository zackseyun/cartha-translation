  yaml_path: translation/nt/revelation/021/020.yaml
  text: the fifth[a], sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, topaz; the tenth[b], chrysoprase; the eleventh, jacinth; the twelfth, amethyst.
translation:
  language: hi
  text: पाँचवीं नींव सारदोनिक्स की, छठी सारदियुस[a] की, सातवीं क्रिसोलाइट की, आठवीं बेरिल की, नौवीं टोपाज़ की, दसवीं क्रिसोप्रेज़ की, ग्यारहवीं जैसिन्थ[b] की और बारहवीं अमेथिस्ट (जमुनिया) की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सारदियुस’ को ‘कार्नेलियन’ भी कहा जा सकता है; इन प्राचीन रत्नों की सटीक पहचान अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: ‘जैसिन्थ’ को ‘हायसिन्थ’ भी लिखा जा सकता है; यूनानी शब्द यहाँ फूल नहीं, एक रत्न को दर्शाता है।
    reason: lexical_alternative
