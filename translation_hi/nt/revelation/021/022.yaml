id: REV.21.22
reference: Revelation 21:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ναὸν οὐκ εἶδον ἐν αὐτῇ, ὁ γὰρ κύριος, ὁ θεός, ὁ παντοκράτωρ, ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/022.yaml
  text: And I saw no temple in it[a], for the Lord God, the Almighty[b], is its temple, and the Lamb.
translation:
  language: hi
  text: मैंने उस नगर में कोई मंदिर[a] नहीं देखा, क्योंकि सर्वशक्तिमान प्रभु परमेश्वर उसका मंदिर है, और मेम्ना भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान।’ यूनानी शब्द ναός विशेष रूप से मंदिर के भीतरी पवित्र भवन या गर्भगृह के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ναὸν / ναὸς
  choice: मन्दिर
  rationale: यह शब्द विशेष रूप से मन्दिर के पवित्र भवन या गर्भगृह का बोध करा सकता है। यहाँ ‘मन्दिर’ सामान्य पाठक के लिए स्वाभाविक है और भौतिक मन्दिर के न होने तथा परमेश्वर और मेम्ने के स्वयं नगर का मन्दिर होने के बीच का विरोध स्पष्ट रखता है।
- source_word: οὐκ εἶδον
  choice: मैंने ... कोई ... नहीं देखा
  rationale: अओरिस्ट क्रिया और निषेध का सीधा, स्वाभाविक हिन्दी रूप; यह मन्दिर के पूर्ण अभाव पर बल बनाए रखता है।
- source_word: ἐν αὐτῇ
  choice: उस नगर में
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ नगर है। हिन्दी में संदर्भ को स्पष्ट करने के लिए संज्ञा दोहराना स्वाभाविक है और इससे यूनानी व्याकरणिक लिंग पर अनावश्यक बल नहीं पड़ता।
- source_word: κύριος, ὁ θεός
  choice: प्रभु परमेश्वर
  rationale: दोनों ईश्वरीय पदवियों का प्रचलित, सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: ὁ παντοκράτωρ
  choice: सर्वशक्तिमान
  rationale: प्रकाशितवाक्य में παντοκράτωρ के लिए स्थापित हिन्दी पद, जो सर्वसामर्थ्य और सार्वभौम प्रभुता व्यक्त करता है।
- source_word: ναὸς αὐτῆς ἐστιν
  choice: उसका मन्दिर है
  rationale: एकवचन ἐστιν और एकवचन विधेय ‘मन्दिर’ को निकटता से प्रतिबिम्बित करता है; ‘उसका’ नगर की ओर संकेत करता है।
- source_word: καὶ τὸ ἀρνίον
  choice: और मेम्ना भी
  rationale: καί से जोड़े गए मेम्ने को उसी विधेय में सम्मिलित करते हुए हिन्दी में अर्थ स्पष्ट करता है, पर वाक्य को बहुवचन क्रिया में बदलकर यूनानी की असामान्य एकवचन रचना को मिटाता नहीं।
theological_decisions:
- issue: ναὸς αὐτῆς ἐστιν, καὶ τὸ ἀρνίον में परमेश्वर और मेम्ने का सम्बन्ध
  choice: सर्वशक्तिमान प्रभु परमेश्वर नगर का मन्दिर है, और मेम्ना भी उसी कथन में सम्मिलित है।
  alternative: ‘सर्वशक्तिमान प्रभु परमेश्वर और मेम्ना उसके मन्दिर हैं’ कहकर स्पष्ट बहुवचन संयुक्त कर्ता बनाया जाए।
  rationale: यूनानी में ἐστιν एकवचन है और ‘मेम्ना’ καί के साथ बाद में जुड़ता है। ‘और मेम्ना भी’ दोनों को मन्दिर के रूप में ग्रहण करने देता है, साथ ही मूल वाक्य की व्याकरणिक असमानता और धर्मवैज्ञानिक तनाव को अनावश्यक रूप से समतल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘उस नगर’ से सर्वनाम का संदर्भ स्पष्ट किया गया है। ‘मेम्ना’ प्रकाशितवाक्य की स्थापित प्रतीकात्मक शब्दावली को बनाए रखता है।
