  yaml_path: translation/nt/revelation/021/007.yaml
  text: The one who overcomes will inherit these things[a], and I will be his God[b], and he will be my son.
translation:
  language: hi
  text: जो जय पाता है, वह इन सबको विरासत में पाएगा[a]; और मैं उसका परमेश्वर होऊँगा, और वह मेरा पुत्र होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो विजय पाता है।” प्रकाशितवाक्य में यूनानी क्रिया νικάω विश्वासयोग्य बने रहते हुए विजय पाने के लिए बार-बार प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “वह मेरा पुत्र होगा।” यहाँ पुल्लिंग शब्द संभवतः प्रतिनिधिक अर्थ रखता है, फिर भी अनुवाद मूल पाठ की पुत्रत्व-संबंधी भाषा को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ νικῶν
  choice: जो जय पाता है
  rationale: वर्तमानकालिक कृदंत उस व्यक्ति को दर्शाता है जिसकी पहचान विश्वासयोग्य रीति से विजय पाने में है। यह प्रकाशितवाक्य में बार-बार आने वाले νικάω के विजय-भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κληρονομήσει
  choice: वारिस होगा
  rationale: यह विरासत पाने के साथ-साथ अगले पिता-पुत्र संबंध के पारिवारिक और वाचागत भाव को भी सुरक्षित रखता है।
- source_word: ταῦτα
  choice: इन सबका
  rationale: बहुवचन संकेतवाचक का आशय पिछले दर्शन में बताई गई बातों से है। ‘इन सबका’ हिन्दी में स्वाभाविक है और सामूहिक संदर्भ स्पष्ट करता है।
- source_word: ἔσομαι αὐτῷ θεὸς
  choice: मैं उसका परमेश्वर होऊँगा
  rationale: यह संबंधसूचक वाचा-सूत्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτὸς ἔσται μοι υἱός
  choice: वह मेरा पुत्र होगा
  rationale: यह पिता-पुत्र के व्यक्तिगत संबंध और विरासत/दत्तकत्व की छवि को बनाए रखता है; अनिश्चित अर्थ जोड़ना आवश्यक नहीं है।
- source_word: υἱός
  choice: पुत्र
  rationale: यूनानी का स्पष्ट पुल्लिंग और पुत्रत्व की महत्त्वपूर्ण छवि सुरक्षित रहती है; यहाँ यह प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
theological_decisions:
- issue: विजयी व्यक्ति के लिए सामान्य प्रतिज्ञा में लिंगसूचक पुत्रत्व की भाषा
  choice: मुख्य पाठ में ‘पुत्र’ बनाए रखना
  alternative: संतान
  rationale: υἱός स्पष्टतः ‘पुत्र’ है और विरासत तथा पिता-पुत्र संबंध की छवि अर्थपूर्ण है। प्रतिनिधिक व्यापकता को पादटिप्पणी में स्पष्ट करना बेहतर है, न कि मुख्य पाठ को लिंग-निरपेक्ष बनाकर स्रोत की छवि मिटाना।
- issue: वाचा-सूत्र की प्रतिध्वनि
  choice: ‘मैं उसका परमेश्वर होऊँगा, और वह मेरा पुत्र होगा’
  alternative: ‘मैं उसके लिए परमेश्वर होऊँगा, और वह मेरे लिए पुत्र होगा’
  rationale: चुना गया रूप यूनानी के संबंधात्मक भाव और वाचागत प्रतिध्वनि को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘जय पाता है’ प्रकाशितवाक्य की आवर्ती विजय-भाषा के अनुकूल है; ‘वारिस होगा’ विरासत और पुत्रत्व के परस्पर संबंध को बनाए रखता है।
