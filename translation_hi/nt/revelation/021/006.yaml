id: REV.21.6
reference: Revelation 21:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπέν μοι· ⸂Γέγοναν. ἐγὼ⸃ τὸ Ἄλφα καὶ τὸ Ὦ, ἡ ἀρχὴ καὶ τὸ τέλος. ἐγὼ τῷ διψῶντι δώσω ἐκ τῆς πηγῆς τοῦ ὕδατος τῆς ζωῆς δωρεάν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/006.yaml
  text: And he said to me[a], “It is done. I am the Alpha and the Omega, the beginning and the end[b]. To the one who is thirsty I will give from the spring of the water of life freely.”
translation:
  language: hi
  text: और उसने मुझसे कहा, “ये बातें पूरी हो चुकी हैं।[a] मैं अल्फ़ा और ओमेगा, आरम्भ और अन्त हूँ। जो प्यासा है, उसे मैं जीवन के जल के सोते से बिना मूल्य पीने को दूँगा।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे पूरी हो चुकी हैं” या “ये बातें घटित हो चुकी हैं।” यूनानी क्रिया बहुवचन में है। परम्परागत अनुवाद है, “पूरा हो गया है।”
    reason: alternative_reading
  - marker: b
    text: या “मुफ़्त में” अथवा “उपहार के रूप में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Γέγοναν
  choice: ये बातें पूरी हो चुकी हैं
  rationale: यूनानी क्रिया पूर्णकाल में बहुवचन है। ‘ये बातें’ निहित बहुवचन कर्ता को स्वाभाविक हिन्दी में स्पष्ट करता है और नई सृष्टि से जुड़ी घोषित बातों के पूरा हो जाने का भाव रखता है।
- source_word: τὸ Ἄλφα καὶ τὸ Ὦ
  choice: अल्फ़ा और ओमेगा
  rationale: प्रकाशितवाक्य में स्थापित प्रतीकात्मक उपाधि के रूप में यूनानी अक्षरों के नाम बनाए रखे गए हैं; अगला पदबंध उनका आशय बताता है।
- source_word: ἡ ἀρχὴ καὶ τὸ τέλος
  choice: आरम्भ और अन्त
  rationale: यह युग्म स्रोत के कालगत और लक्ष्यगत दोनों संकेतों को अनावश्यक व्याख्या किए बिना सुरक्षित रखता है।
- source_word: τῷ διψῶντι
  choice: जो प्यासा है, उसे
  rationale: वर्तमान कृदन्त के व्यक्तिवाचक, एकवचन अर्थ को सहज और समावेशी हिन्दी में व्यक्त करता है।
- source_word: δώσω
  choice: पीने को दूँगा
  rationale: ‘दूँगा’ भविष्यकालीन प्रतिज्ञा को बनाए रखता है; प्यास और जल के प्रसंग में ‘पीने को’ हिन्दी वाक्य को स्वाभाविक बनाता है, जबकि यूनानी में दी जाने वाली वस्तु अगले संबंधसूचक पदबंध से समझी जाती है।
- source_word: ἐκ τῆς πηγῆς
  choice: सोते से
  rationale: πηγή के प्राकृतिक जलस्रोत वाले बिंब के लिए ‘सोता’ स्पष्ट और बाइबिलीय हिन्दी में परिचित है।
- source_word: τοῦ ὕδατος τῆς ζωῆς
  choice: जीवन के जल के
  rationale: संबंधसूचक रचना और स्थापित बाइबिलीय बिंब दोनों को बनाए रखता है।
- source_word: δωρεάν
  choice: बिना मूल्य
  rationale: यह क्रियाविशेषण के उस अर्थ को स्पष्ट करता है कि वरदान पाने वाले से कोई मूल्य नहीं लिया जाता।
theological_decisions:
- issue: Γέγοναν में बहुवचन को व्यक्त करना
  choice: ये बातें पूरी हो चुकी हैं
  alternative: पूरा हो गया है
  rationale: बहुवचन क्रिया को बनाए रखने से अनेक घोषित वास्तविकताओं की पूर्ति का संकेत सुरक्षित रहता है और पारम्परिक एकवचन सूत्र के द्वारा मूल की व्याकरणिक अस्पष्टता नहीं मिटती।
- issue: अल्फ़ा और ओमेगा की उपाधि
  choice: अल्फ़ा और ओमेगा
  alternative: पहला और आख़िरी अक्षर
  rationale: यूनानी अक्षरों के नाम रखने से प्रकाशितवाक्य की प्रतीकात्मक और अन्तरपाठीय प्रतिध्वनि सुरक्षित रहती है; ‘आरम्भ और अन्त’ उसका आशय साथ ही स्पष्ट करता है।
- issue: δωρεάν में अनुग्रहपूर्ण, मूल्यरहित देने का भाव
  choice: बिना मूल्य
  alternative: मुफ़्त में; उपहार के रूप में
  rationale: यह प्राप्तकर्ता के लिए मूल्य न होने का अर्थ स्पष्ट करता है, बिना इस पर अतिरिक्त सिद्धान्त आरोपित किए कि उपहार किस प्रकार प्रदान होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ये बातें पूरी हो चुकी हैं’ यूनानी बहुवचन को स्वाभाविक हिन्दी में दर्शाता है। ‘सोता’ जीवनदायी जलस्रोत के ठोस बिंब को बनाए रखता है, और ‘पीने को’ प्यास के प्रसंग में हिन्दी की स्वाभाविक पूरक अभिव्यक्ति है।
