id: REV.21.2
reference: Revelation 21:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὴν πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καινὴν εἶδον καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ, ἡτοιμασμένην ὡς νύμφην κεκοσμημένην τῷ ἀνδρὶ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/002.yaml
  text: And I saw the holy city[a], new Jerusalem, coming down out of heaven from God[c][b], prepared like a bride adorned for her husband.
translation:
  language: hi
  text: और मैंने पवित्र नगर, नई यरूशलेम को परमेश्वर की ओर से स्वर्ग से उतरती हुई देखा। वह उस दुल्हन के समान तैयार थी जो अपने पति के लिए सजी हुई हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόλιν τὴν ἁγίαν
  choice: पवित्र नगर
  rationale: यह ठोस नगरीय बिंब और ἁγίαν के धार्मिक अर्थ, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἰερουσαλὴμ καινὴν
  choice: नई यरूशलेम
  rationale: यरूशलेम नाम का प्रचलित हिन्दी रूप है और καινήν का वर्णनात्मक अर्थ ‘नई’ से स्पष्ट होता है।
- source_word: εἶδον
  choice: मैंने ... देखा
  rationale: ὁράω के अओरिस्ट का सीधा और स्वाभाविक अनुवाद है; किसी अतिरिक्त क्रिया की आवश्यकता नहीं।
- source_word: καταβαίνουσαν
  choice: उतरते
  rationale: καταβαίνω की नीचे की ओर गति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर के पास से स्वर्ग में से
  rationale: ἀπό द्वारा परमेश्वर को उद्गम और ἐκ द्वारा स्वर्ग के भीतर से बाहर की गति—दोनों को अलग-अलग बनाए रखता है।
- source_word: ἡτοιμασμένην
  choice: तैयार थी
  rationale: पूर्ण कर्मवाच्य कृदन्त नगर की पूरी हो चुकी तैयारी की वर्तमान अवस्था दर्शाता है।
- source_word: ὡς νύμφην
  choice: दुल्हन के समान
  rationale: ὡς यहाँ उपमा प्रस्तुत करता है; ‘के समान’ तुलना को स्पष्ट रखता है।
- source_word: κεκοσμημένην
  choice: सजी हुई
  rationale: विवाह-संबंधी अलंकरण का अर्थ स्वाभाविक, गरिमापूर्ण और आम हिन्दी में देता है।
- source_word: τῷ ἀνδρὶ αὐτῆς
  choice: अपने पति के लिए
  rationale: दुल्हन के प्रसंग में ἀνήρ का संदर्भगत अर्थ ‘पति’ है; ‘दूल्हा’ लिखना स्रोत से अधिक विशिष्ट होता।
theological_decisions:
- issue: ‘नई यरूशलेम’ को औपचारिक अंतकालीन उपाधि मानना या वर्णनात्मक पदबंध
  choice: ‘नई यरूशलेम’ को वर्णनात्मक पदबंध के रूप में रखा
  alternative: इसे विशेष औपचारिक उपाधि की तरह प्रस्तुत करना
  rationale: यूनानी में καινήν, Ἰερουσαλήμ का विशेषण है; हिन्दी में देवनागरी अक्षरों से अंग्रेज़ी जैसी capitalization-भिन्नता संभव नहीं, इसलिए बिना अतिरिक्त व्याख्या के स्वाभाविक पदबंध रखा गया।
- issue: दुल्हन के बिंब की कलीसियाई पहचान स्पष्ट करना
  choice: केवल स्रोत में उपस्थित उपमा रखी
  alternative: ‘कलीसिया, अर्थात मेम्ने की दुल्हन’ जोड़ना
  rationale: इस पद में नगर की तुलना सजी हुई दुल्हन से की गई है; प्रतीक की पहचान जोड़ना अनुवाद के भीतर व्याख्या आयात करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘स्वर्ग में से’ ने ἐκ की भीतर से बाहर आने की दिशा को और ‘परमेश्वर के पास से’ ने ἀπό के उद्गम को सुरक्षित रखा है। अलग-अलग स्त्रीलिंग क्रिया-रूपों से नगर और दुल्हन की संगति स्पष्ट रहती है।
