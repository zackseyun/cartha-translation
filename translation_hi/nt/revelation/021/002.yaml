revisions:
- from: और मैंने पवित्र नगर, नई यरूशलेम को परमेश्वर के पास से स्वर्ग में से उतरते देखा। वह अपने पति के लिए सजी हुई दुल्हन के समान तैयार थी।
  to: और मैंने पवित्र नगर, नई यरूशलेम को परमेश्वर की ओर से स्वर्ग से उतरती हुई देखा। वह उस दुल्हन के समान तैयार थी जो अपने पति के लिए सजी हुई हो।
  rationale: The revision replaces the added locative sense of “परमेश्वर के पास से” with “परमेश्वर की ओर से,” retains both divine and heavenly source expressions, and improves the feminine participial construction. The bridal simile remains a simile and receives no ecclesiological expansion.
  reviewer_model: gpt-5.6-terra
