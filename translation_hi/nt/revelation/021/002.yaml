review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the holy city, new Jerusalem, its descent, and the bridal comparison. However, “परमेश्वर के पास से” means ‘from near/beside God’ and adds a spatial nuance not expressed by ἀπὸ τοῦ θεοῦ (‘from God’). The two source expressions should be rendered without this addition and in a clearer relationship.
  naturalness: The revised wording is natural modern standard Hindi while retaining the elevated visionary register. “उतरती हुई” agrees naturally with the appositional feminine name “यरूशलेम,” and the relative clause clearly locates the bridal adornment with the bride.
  terminology: “पवित्र नगर,” “नई यरूशलेम,” “स्वर्ग,” “परमेश्वर,” “दुल्हन,” and “पति” are appropriate and consistent. “पति” accurately represents ἀνήρ in this bridal context without introducing the more specific ‘दूल्हा.’
  issues:
  - severity: medium
    issue: “परमेश्वर के पास से” for ἀπὸ τοῦ θεοῦ
    rationale: '‘पास से’ conveys departure from God’s vicinity/presence, whereas the Greek simply marks God as source: ‘from God.’ “परमेश्वर की ओर से” preserves the source relationship without adding the locative implication.'
  - severity: low
    issue: Participial phrasing for the descending city
    rationale: “उतरते देखा” is understandable, but “उतरती हुई देखा” more clearly reflects the feminine singular participle as referring to “यरूशलेम” and reads more smoothly in Hindi.
  revised_text: और मैंने पवित्र नगर, नई यरूशलेम को परमेश्वर की ओर से स्वर्ग से उतरती हुई देखा। वह उस दुल्हन के समान तैयार थी जो अपने पति के लिए सजी हुई हो।
  revised_footnotes: []
  revision_rationale: The revision replaces the added locative sense of “परमेश्वर के पास से” with “परमेश्वर की ओर से,” retains both divine and heavenly source expressions, and improves the feminine participial construction. The bridal simile remains a simile and receives no ecclesiological expansion.
