source:
  edition: SBLGNT
  text: ⸀οἱ θεμέλιοι τοῦ τείχους τῆς πόλεως παντὶ λίθῳ τιμίῳ κεκοσμημένοι· ὁ θεμέλιος ὁ πρῶτος ἴασπις, ὁ δεύτερος σάπφιρος, ὁ τρίτος χαλκηδών, ὁ τέταρτος σμάραγδος,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/019.yaml
  text: 'The foundations of the wall of the city were adorned with every kind of precious stone: the first foundation was jasper[a], the second sapphire, the third chalcedony, the fourth emerald[b],'
translation:
  language: hi
  text: नगर की दीवार की नींवें हर प्रकार के बहुमूल्य पत्थर से सजाई गई थीं:[a] पहली नींव यशब की, दूसरी नीलम की, तीसरी कैल्सेडनी की और चौथी पन्ने की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर बहुमूल्य पत्थर से।” यूनानी वाक्यांश का वितरणात्मक अर्थ लिया जा सकता है, इसलिए मुख्य पाठ में “हर प्रकार के बहुमूल्य पत्थर” है।
    reason: lexical_alternative
  - marker: b
    text: “कैल्सेडनी” यूनानी शब्द का पारंपरिक रूप है; कुछ प्राचीन रत्नों की सटीक पहचान अनिश्चित है।
    reason: cultural_note
lexical_decisions:
- source_word: θεμέλιοι
  choice: नींवें
  rationale: बहुवचन संज्ञा नगर की दीवार की अनेक नींवों या आधार-स्तरों को दर्शाती है; हिंदी में ‘नींवें’ स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: τεῖχος
  choice: दीवार
  rationale: यह यूनानी शब्द का सामान्य और संदर्भानुकूल अर्थ है; ‘किलेबंदी की दीवार’ अनावश्यक विस्तार होगा।
- source_word: πόλεως
  choice: नगर
  rationale: प्रकाशितवाक्य के महान युगांतकारी नगर के लिए ‘नगर’ गरिमापूर्ण और आधुनिक मानक हिंदी में सहज है।
- source_word: παντὶ λίθῳ τιμίῳ
  choice: हर प्रकार के बहुमूल्य पत्थर से
  rationale: वितरणात्मक भाव को स्वाभाविक हिंदी में व्यक्त करता है, जबकि शाब्दिक विकल्प ‘हर बहुमूल्य पत्थर से’ भी संभव है।
- source_word: κεκοσμημένοι
  choice: सजाई गई थीं
  rationale: पूर्ण निष्क्रिय कृदंत नींवों की पूर्ण होकर बनी हुई सुसज्जित अवस्था बताता है; यह हिंदी रूप निष्क्रियता और परिणामगत अवस्था दोनों बनाए रखता है।
- source_word: ὁ θεμέλιος ὁ πρῶτος
  choice: पहली नींव
  rationale: क्रम से प्रत्येक एकवचन नींव का परिचय देता है; ‘नींव का पहला पत्थर’ अधिक व्याख्यात्मक होता।
- source_word: ἴασπις
  choice: यशब
  rationale: इस रत्न के लिए हिंदी बाइबलीय परंपरा में प्रचलित नाम है; प्राचीन रत्न की सटीक आधुनिक पहचान निश्चित नहीं है।
- source_word: σάπφιρος
  choice: नीलम
  rationale: प्रचलित और सहज हिंदी रत्न-नाम है।
- source_word: χαλκηδών
  choice: कैल्सेडनी
  rationale: प्राचीन रत्न की सटीक पहचान अनिश्चित होने के कारण पारंपरिक नाम का लिप्यंतरण किया गया है।
- source_word: σμάραγδος
  choice: पन्ना
  rationale: इस यूनानी रत्न-नाम का स्थापित और सर्वसुलभ हिंदी समकक्ष है।
theological_decisions:
- issue: सर्वनाश-दर्शन की रत्न-सूची का अनुवाद
  choice: रत्नों के नाम सीधे वर्णन के रूप में देना, बिना प्रतीकात्मक अर्थ जोड़े
  alternative: रत्नों को इस्राएल के गोत्रों, प्रेरितों या महायाजकीय वस्त्रों से जोड़कर मुख्य पाठ में अर्थ खोलना
  rationale: पद स्वयं इन रत्नों का प्रतीकात्मक अर्थ नहीं बताता; इसलिए अनुवाद चित्रात्मकता को बनाए रखता है और किसी विशिष्ट धर्मवैज्ञानिक योजना को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। ‘नगर’, ‘नींवें’ और ‘बहुमूल्य’ सामान्य पाठक के लिए स्पष्ट रहते हुए दृश्य की ऊँची शैली बनाए रखते हैं। प्रत्येक पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
