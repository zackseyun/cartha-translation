source:
  edition: SBLGNT
  text: καὶ ἐμέτρησεν τὸ τεῖχος αὐτῆς ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν, μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/017.yaml
  text: And he measured its wall[a], 144 cubits by human measure, which is also an angel’s measure.
translation:
  language: hi
  text: 'और उसने नगर की दीवार नापी: 144 हाथ—मनुष्य का माप, जो स्वर्गदूत का भी माप है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनुष्य के माप के अनुसार, अर्थात् स्वर्गदूत के माप के अनुसार।” यूनानी वाक्यांश इस बात पर बल दे सकता है कि स्वर्गदूत ने मनुष्यों की माप-इकाई का उपयोग किया, या कि यहाँ मनुष्य और स्वर्गदूत का माप एक-दूसरे के अनुरूप है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐμέτρησεν
  choice: नापी
  rationale: μετρέω के सामान्य अर्थ ‘मापना’ को स्वाभाविक हिन्दी में व्यक्त करता है; स्त्रीलिंग क्रिया का संबंध ‘शहरपनाह’ से है।
- source_word: τεῖχος
  choice: शहरपनाह
  rationale: यह नगर की घेरनेवाली रक्षात्मक दीवार को दर्शाता है; ‘शहरपनाह’ साधारण ‘दीवार’ से अधिक सटीक है और प्रकाशितवाक्य के नगर-वर्णन में उपयुक्त है।
- source_word: αὐτῆς
  choice: उसकी
  rationale: सर्वनाम का संकेत नगर की ओर है; हिन्दी में ‘उसकी शहरपनाह’ संदर्भ को सहज रूप से बनाए रखता है।
- source_word: ἑκατὸν τεσσεράκοντα τεσσάρων πηχῶν
  choice: 144 हाथ
  rationale: πηχύς प्राचीन लंबाई की इकाई ‘हाथ’ है; संख्या को अंकों में रखना पठनीय है और मूल माप को आधुनिक इकाई में अनुमानतः बदलने से बचाता है।
- source_word: μέτρον ἀνθρώπου
  choice: मनुष्य के माप के अनुसार
  rationale: ἀνθρώπου को सामान्य मानव-संदर्भ में ‘मनुष्य’ कहना लिंग-विशिष्ट अर्थ थोपे बिना संक्षिप्त यूनानी वाक्यांश को स्वाभाविक हिन्दी देता है।
- source_word: ὅ ἐστιν ἀγγέλου
  choice: जो स्वर्गदूत का भी माप है
  rationale: यूनानी में ‘माप’ लुप्त है; हिन्दी में उसे दोहराना स्पष्टता देता है। ‘भी’ मानव और स्वर्गदूतीय माप के बीच यहाँ व्यक्त संगति को सामने लाता है।
theological_decisions:
- issue: μέτρον ἀνθρώπου, ὅ ἐστιν ἀγγέλου की व्याख्या
  choice: मुख्य पाठ में इसे मनुष्य के माप और स्वर्गदूत के माप की यहाँ की संगति के रूप में रखा गया है।
  alternative: इसे ‘एक मनुष्य के माप के अनुसार, अर्थात् उस स्वर्गदूत के माप के अनुसार’ भी समझा जा सकता है, जहाँ स्वर्गदूत द्वारा प्रयुक्त मानवीय इकाई पर बल हो।
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ व्याकरणिक संबंध को बनाए रखता है, जबकि पादटिप्पणी संभावित बलों को बिना किसी एक व्याख्या को सिद्धांततः निर्णायक बनाए दर्शाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज गद्य। ‘शहरपनाह’ नगर की रक्षात्मक दीवार के लिए सटीक है; ‘हाथ’ पारंपरिक प्राचीन माप को सुरक्षित रखता है। मुख्य पाठ में संक्षिप्त मूल संरचना रखी गई है और वास्तविक व्याख्यात्मक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
