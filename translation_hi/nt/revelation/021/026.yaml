  text: καὶ οἴσουσιν τὴν δόξαν καὶ τὴν τιμὴν τῶν ἐθνῶν εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/026.yaml
  text: and they will bring the glory and the honor of the nations into it[a].
translation:
  language: hi
  text: और वे राष्ट्रों की महिमा और सम्मान उस नगर में लाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह संयोजक पिछले पद से वाक्य को जोड़ता है; हिंदी में ‘और’ इसका स्वाभाविक समतुल्य है।
- source_word: οἴσουσιν
  choice: वे ... लाएँगे
  rationale: φέρω के भविष्यत् सक्रिय रूप का संदर्भगत अर्थ बाहर से नगर के भीतर कुछ लाना है; ‘लाएँगे’ इसे स्वाभाविक और ठोस रूप में व्यक्त करता है।
- source_word: τὴν δόξαν
  choice: महिमा
  rationale: ‘महिमा’ δόξα के सम्मानसूचक और वैभवपूर्ण दोनों आयामों को बनाए रखती है तथा प्रकाशितवाक्य की बाइबिलीय शब्दावली के अनुकूल है।
- source_word: τὴν τιμὴν
  choice: सम्मान
  rationale: δόξα के साथ युग्म में τιμή का मूल भाव आदर और प्रतिष्ठा है; ‘सम्मान’ इसे धन या संपत्ति तक सीमित नहीं करता।
- source_word: τῶν ἐθνῶν
  choice: राष्ट्रों की
  rationale: ἔθνη यहाँ व्यापक जनसमूहों अथवा राष्ट्रों को सूचित करता है; ‘गैर-यहूदी’ कहना अनावश्यक रूप से यहूदी–गैर-यहूदी भेद को प्रमुख बना देता।
- source_word: εἰς αὐτήν
  choice: उस नगर में
  rationale: स्त्रीलिंग सर्वनाम αὐτήν का पूर्वपद नगर है। हिंदी में अस्पष्ट ‘उसमें’ की अपेक्षा ‘उस नगर में’ अधिक स्पष्ट और स्वाभाविक है; इससे यूनानी व्याकरणिक लिंग को कृत्रिम व्यक्तिवाचक स्त्री-संदर्भ में बदलने से भी बचा जाता है।
theological_decisions:
- issue: αὐτήν का संदर्भ और नगर का स्त्री-व्यक्तिकरण
  choice: ‘उस नगर में’
  alternative: ‘उसमें’ या व्यक्तिकृत अर्थ में ‘उसके भीतर’
  rationale: यूनानी सर्वनाम स्त्रीलिंग है क्योंकि πόλις स्त्रीलिंग संज्ञा है, और निकटवर्ती संदर्भ में नगर को दुल्हन के रूप में भी चित्रित किया गया है। हिंदी में ‘उस नगर में’ संदर्भ स्पष्ट रखता है, पर व्याकरणिक लिंग से आवश्यकता से अधिक व्यक्तिकरण नहीं निकालता।
- issue: राष्ट्रों की ‘महिमा और सम्मान’ का आशय
  choice: वाक्यांश को व्यापक अर्थ में ‘महिमा और सम्मान’ ही रखा गया है।
  alternative: राष्ट्रों की संपत्ति; उनका सांस्कृतिक वैभव; अथवा राष्ट्रों द्वारा दिया गया सम्मान
  rationale: यूनानी पदबंध अर्थ की दृष्टि से व्यापक है। संदर्भ इसे केवल भौतिक संपदा, सांस्कृतिक उपलब्धियों या चढ़ावे में से किसी एक तक सीमित नहीं करता; इसलिए अनुवाद किसी विशिष्ट अंतकालीन व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘उस नगर’ जोड़कर सर्वनाम का संदर्भ स्पष्ट किया गया है। ‘महिमा और सम्मान’ परिचित बाइबिलीय शब्दावली रखते हुए मूल की अर्थगत व्यापकता सुरक्षित रखता है।
