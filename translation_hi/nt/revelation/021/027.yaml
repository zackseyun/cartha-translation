id: REV.21.27
reference: Revelation 21:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ εἰσέλθῃ εἰς αὐτὴν πᾶν κοινὸν καὶ ⸀ποιῶν βδέλυγμα καὶ ψεῦδος, εἰ μὴ οἱ γεγραμμένοι ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/027.yaml
  text: And nothing unclean will ever enter it[a], nor anyone who does what is detestable or false[b], but only those written in the Lamb’s book of life.
translation:
  language: hi
  text: और कोई भी अशुद्ध वस्तु उसमें कभी भी प्रवेश नहीं करेगी[a], न कोई ऐसा व्यक्ति जो घृणित काम या झूठ करता है[b]; केवल वे ही उसमें प्रवेश करेंगे जो मेम्ने की जीवन-पुस्तक में लिखे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या ‘कोई भी अपवित्र वस्तु’ अथवा ‘कोई भी दूषित वस्तु’; यूनानी: πᾶν κοινόν।'
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘घृणित काम और झूठ करता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μὴ εἰσέλθῃ
  choice: कभी प्रवेश नहीं करेगी
  rationale: οὐ μή के साथ aorist subjunctive प्रबल निषेध व्यक्त करता है; ‘कभी प्रवेश नहीं करेगी’ भावी प्रवेश के पूर्ण निषेध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: αὐτὴν
  choice: उसमें
  rationale: सर्वनाम का संदर्भ नई यरूशलेम नगरी से है; हिन्दी में नगरी के लिए ‘उसमें’ स्वाभाविक है और अनावश्यक मानवीकरण से बचता है।
- source_word: πᾶν κοινὸν
  choice: कोई भी अशुद्ध वस्तु
  rationale: नपुंसकलिंग एकवचन πᾶν व्यापक अर्थ में ‘कुछ भी/कोई भी वस्तु’ है। यहूदी शुद्धता-संदर्भ में κοινός का अर्थ सामान्यतः अशुद्ध, अपवित्र या दूषित है; मुख्य पाठ में ‘अशुद्ध’ सबसे स्पष्ट है।
- source_word: ποιῶν βδέλυγμα καὶ ψεῦδος
  choice: जो घृणित काम या झूठ करता है
  rationale: Substantival participle व्यक्ति को उसके आचरण से पहचानता है। βδέλυγμα के नैतिक-धार्मिक घृणा-बोध को ‘घृणित काम’ और ψεῦδος को ‘झूठ’ व्यक्त करता है। यूनानी का शाब्दिक ‘घृणित वस्तु और झूठ करता है’ हिन्दी में अस्वाभाविक है; सूचीगत अर्थ को स्वाभाविक बनाने के लिए ‘या’ रखा गया है, जबकि पादटिप्पणी शाब्दिक संयोजन बताती है।
- source_word: εἰ μὴ
  choice: केवल ... ही
  rationale: यह निषेध के एकमात्र अपवाद को प्रस्तुत करता है; ‘केवल ... ही’ हिन्दी में सीमा और विरोध दोनों स्पष्ट करता है।
- source_word: οἱ γεγραμμένοι
  choice: जो ... लिखे हुए हैं
  rationale: Perfect passive participle पहले से लिखे जाने के फलस्वरूप बनी वर्तमान स्थिति को दर्शाता है। ‘नाम’ मूल में स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἐν τῷ βιβλίῳ τῆς ζωῆς τοῦ ἀρνίου
  choice: मेम्ने की जीवन की पुस्तक में
  rationale: ‘जीवन की पुस्तक’ स्थापित और अर्थ-सटीक पद है। Genitive τοῦ ἀρνίου को मेम्ने से पुस्तक के संबंध/अधिकार के रूप में ‘मेम्ने की’ से व्यक्त किया गया है और मसीह-संबंधी उपाधि सुरक्षित रखी गई है।
theological_decisions:
- issue: नई यरूशलेम से निष्कासन का दायरा
  choice: पद अशुद्ध वस्तु और घृणित काम या झूठ करने वाले व्यक्ति—दोनों का प्रवेश निषिद्ध बताता है।
  alternative: पहले खंड को केवल अवैयक्तिक अशुद्धता और दूसरे को अलग से व्यक्तियों के विषय में समझना।
  rationale: यूनानी पाठ नपुंसकलिंग πᾶν κοινόν और व्यक्ति-सूचक substantival participle ποιῶν—दोनों रखता है; अनुवाद इस द्विविधता को मिलाए बिना बनाए रखता है।
- issue: οἱ γεγραμμένοι में निहित लेखन का विषय
  choice: ‘जो ... लिखे हुए हैं’ कहकर मूल की संक्षिप्तता बनाए रखना।
  alternative: ‘जिनके नाम ... लिखे हैं।’
  rationale: पुस्तक का बिंब नामों का संकेत देता है, पर इस पद में ‘नाम’ शब्द नहीं है; इसलिए समानांतर पदों की भाषा यहाँ नहीं जोड़ी गई।
- issue: βδέλυγμα καὶ ψεῦδος का संबंध
  choice: स्वाभाविक हिन्दी में अलग-अलग निषिद्ध आचरणों के रूप में ‘घृणित काम या झूठ’ कहना।
  alternative: अधिक शाब्दिक ‘घृणित काम और झूठ करता है।’
  rationale: καί मूल में दोनों कर्मों को जोड़ता है, पर निषेधात्मक हिन्दी सूची में ‘या’ प्रत्येक श्रेणी को स्वतंत्र रूप से समेटता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मेम्ना’ प्रकाशितवाक्य की प्रमुख मसीह-संबंधी उपाधि के रूप में रखा गया है। मुख्य वाक्य में निषेध और अपवाद को स्पष्ट करने के लिए अर्धविराम तथा दूसरे खंड में ‘उसमें ... प्रवेश करेंगे’ की स्वाभाविक पूर्ति की गई है।
