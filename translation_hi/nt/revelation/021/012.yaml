- source_word: φυλῶν
  choice: गोत्रों
  rationale: इस्राएल की पारंपरिक जनजातीय इकाइयों के लिए मानक हिन्दी बाइबलीय शब्द।
- source_word: υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी के स्पष्ट पुरुषवाचक पारिवारिक पद 'पुत्रों' को मुख्य पाठ में सुरक्षित रखा गया है।
