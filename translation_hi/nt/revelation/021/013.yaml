  yaml_path: translation/nt/revelation/021/013.yaml
  text: On the east[a], three gates; and on the north, three gates; and on the south, three gates; and on the west, three gates.
translation:
  language: hi
  text: पूर्व की ओर[a] तीन फाटक, और उत्तर की ओर तीन फाटक, और दक्षिण की ओर तीन फाटक, और पश्चिम की ओर तीन फाटक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “पूर्व से ... उत्तर से ... दक्षिण से ... पश्चिम से”; यहाँ भाव नगर की उन दिशाओं या ओरों का है जहाँ फाटक स्थित थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ ἀνατολῆς
  choice: पूर्व दिशा में
  rationale: यहाँ ἀπό के साथ दिशासूचक संज्ञा नगर की उस दिशा या ओर को बताती है जहाँ फाटक स्थित हैं। हिन्दी में ‘पूर्व दिशा में’ स्थान का भाव स्वाभाविक रूप से देता है; शाब्दिक ‘पूर्व से’ गति या उद्गम का भ्रामक संकेत दे सकता है।
- source_word: πυλῶνες
  choice: फाटक
  rationale: πυλών किसी बड़े फाटक या प्रवेश-द्वार को सूचित कर सकता है। नगर की दीवार के संदर्भ में ‘फाटक’ स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τρεῖς
  choice: तीन
  rationale: मूल के निश्चित संख्यावाचक अर्थ को सीधे रखा गया है और चारों दिशाओं के लिए इसकी पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: ἀπὸ βορρᾶ / ἀπὸ νότου / ἀπὸ δυσμῶν
  choice: उत्तर दिशा में / दक्षिण दिशा में / पश्चिम दिशा में
  rationale: चारों वाक्यांशों को समान ढंग से प्रस्तुत किया गया है, ताकि स्थान और मूल की सममित संरचना दोनों स्पष्ट रहें।
- source_word: καὶ ... καὶ ... καὶ ...
  choice: सूची में क्रमबद्ध संयोजन
  rationale: हिन्दी की स्वाभाविक सूची-रचना के अनुसार अंतिम पद से पहले ‘और’ रखा गया है; प्रत्येक दिशा और तीन फाटकों की मापी हुई समरूपता फिर भी अक्षुण्ण रहती है।
theological_decisions:
- issue: नए यरूशलेम के फाटकों का स्थानिक वर्णन
  choice: चारों दिशाओं में तीन-तीन फाटकों का सीधा वास्तु-वर्णन
  alternative: इस्राएल के गोत्रों की छावनी या यहेजकेल के मन्दिर-नगर से प्रतीकात्मक संबंध को अनुवाद में स्पष्ट करना
  rationale: पद स्वयं केवल दिशाओं के अनुसार फाटकों की गणना करता है। व्यापक शास्त्रीय प्रतीक-संबंध संभव हैं, पर उन्हें मुख्य पाठ में जोड़ना व्याख्या को अनुवाद में मिला देना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और दृश्यात्मक शैली। ‘दिशा में’ स्थान को स्पष्ट करता है; ‘फाटक’ सामान्य पाठक के लिए सहज है। आरम्भ में ‘थे’ देकर हिन्दी वाक्य को स्वाभाविक बनाया गया है, जबकि शेष समांतर खंडों में उसका लोप संक्षिप्त और लयात्मक है।
