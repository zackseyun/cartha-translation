id: REV.21.16
reference: Revelation 21:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις τετράγωνος κεῖται, καὶ τὸ μῆκος αὐτῆς ⸀ὅσον τὸ πλάτος. καὶ ἐμέτρησεν τὴν πόλιν τῷ καλάμῳ ἐπὶ ⸀σταδίους δώδεκα ⸀χιλιάδων· τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/016.yaml
  text: 'And the city lies foursquare[a], and its length is as great as its width. And he measured the city with the measuring rod: twelve thousand stadia[c][b]. Its length and width and height are equal.'
translation:
  language: hi
  text: 'और नगर चौकोर आकार में स्थित है, और उसकी लंबाई उसकी चौड़ाई के बराबर है। उसने नापने की छड़ी[a] से नगर को नापा: बारह हज़ार स्टेडिया[b]। उसकी लंबाई, चौड़ाई और ऊँचाई तीनों बराबर हैं।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सरकंडे से’। यूनानी शब्द का अर्थ ‘सरकंडा’ भी हो सकता है, पर यहाँ वह नापने के उपकरण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: स्टेडियन दूरी की एक प्राचीन इकाई थी। बारह हज़ार स्टेडिया लगभग 2,220 किलोमीटर होते हैं, यद्यपि यह अनुमान स्टेडियन की मानी गई लंबाई पर निर्भर करता है।
    reason: cultural_note
  - marker: c
    text: या, व्याख्यात्मक रूप से, ‘नगर एक पूर्ण घन है।’ यूनानी पाठ सीधे यही कहता है कि उसकी लंबाई, चौड़ाई और ऊँचाई बराबर हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: τετράγωνος
  choice: चौकोर
  rationale: यह शब्द नगर के चार समान भुजाओं वाले, वर्गाकार विन्यास को बताता है। ‘चौकोर’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: κεῖται
  choice: बसा हुआ है
  rationale: यहाँ क्रिया नगर की स्थिति या विन्यास को व्यक्त करती है। ‘बसा हुआ है’ नगर के लिए स्वाभाविक हिन्दी है और वर्तमानकालीन वर्णन को बनाए रखता है।
- source_word: τὸ μῆκος αὐτῆς ὅσον τὸ πλάτος
  choice: उसकी लंबाई उसकी चौड़ाई के बराबर है
  rationale: ὅσον दोनों आयामों के विस्तार की समानता दर्शाता है; ‘बराबर’ इसे स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐμέτρησεν
  choice: उसने ... नापा
  rationale: साधारण भूतकालीन कथन; निकटवर्ती प्रसंग से कर्ता स्वर्गदूत है, पर मूल की तरह सर्वनाम रखा गया है।
- source_word: τῷ καλάμῳ
  choice: नापने की छड़ी
  rationale: κάλαμος मूलतः सरकंडे या उससे बनी छड़ी को कह सकता है, पर यहाँ वह मापने का उपकरण है; चयन उसके कार्य को स्पष्ट करता है।
- source_word: ἐπὶ σταδίους δώδεκα χιλιάδων
  choice: बारह हज़ार स्टेडिया
  rationale: वाक्यांश माप का परिणाम बताता है। प्राचीन इकाई को मुख्य पाठ में सुरक्षित रखा गया है और ἐπί को सहज हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: τὸ μῆκος καὶ τὸ πλάτος καὶ τὸ ὕψος αὐτῆς ἴσα ἐστίν
  choice: उसकी लंबाई, चौड़ाई और ऊँचाई बराबर हैं
  rationale: मूल यूनानी तीनों आयामों की समानता सीधे कहता है; हिन्दी अनुवाद उसी कथन को बनाए रखता है।
theological_decisions:
- issue: प्राचीन माप-इकाई को रखना या आधुनिक इकाई में बदलना
  choice: मुख्य पाठ में ‘बारह हज़ार स्टेडिया’ रखना
  alternative: लगभग 2,220 किलोमीटर
  rationale: यूनानी पाठ प्राचीन इकाई देता है। आधुनिक समतुल्य अनुमानित है और स्टेडियन की मानी गई लंबाई पर निर्भर करता है, इसलिए उसे पादटिप्पणी में रखना अधिक उचित है।
- issue: समान तीन आयामों को किस प्रकार व्यक्त करना
  choice: लंबाई, चौड़ाई और ऊँचाई को बराबर कहना
  alternative: नगर एक पूर्ण घन है
  rationale: घनाकार रूप इसका स्वाभाविक ज्यामितीय निष्कर्ष है, पर यूनानी पाठ ‘घन’ शब्द का प्रयोग नहीं करता; वह तीनों आयामों की समानता सीधे बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘चौकोर’, ‘नापने की छड़ी’ और ‘बराबर’ सहज हिन्दी हैं; प्राचीन इकाई ‘स्टेडिया’ को मूल-पाठ की सांस्कृतिक दूरी सुरक्षित रखने के लिए रखा गया है।
