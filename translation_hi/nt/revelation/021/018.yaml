lexical_decisions:
- source_word: ἐνδώμησις
  choice: बनावट
  rationale: यह शब्द निर्मित वस्तु की बनावट, संरचना या निर्माण-सामग्री का बोध करा सकता है। ‘बनावट’ मूल की अर्थगत व्यापकता को बनाए रखता है और अगले विधेय ‘यशब की थी’ के साथ स्वाभाविक है।
- source_word: τεῖχος
  choice: शहरपनाह
  rationale: संदर्भ नगर को घेरने वाली दीवार का है; ‘शहरपनाह’ साधारण ‘दीवार’ की अपेक्षा इसे स्पष्ट करता है और प्रकाशना के गरिमामय वर्णन के अनुकूल है।
- source_word: ἴασπις
  choice: यशब
  rationale: प्राचीन रत्ननाम के लिए प्रचलित बाइबलीय हिन्दी रूप अपनाया गया है; उस प्राचीन पत्थर की आधुनिक खनिजीय पहचान पूरी तरह निश्चित नहीं है।
- source_word: χρυσίον καθαρόν
  choice: शुद्ध सोना
  rationale: यहाँ सोने की सामग्री और उसकी निर्मलता/परिशुद्धता का वर्णन है; ‘शुद्ध सोना’ स्वाभाविक और सटीक है।
- source_word: ὅμοιον
  choice: के समान
  rationale: यह विशेषण स्पष्ट तुलना प्रस्तुत करता है; ‘के समान’ हिन्दी के गरिमामय गद्य में स्वाभाविक है।
- source_word: ὕαλῳ καθαρῷ
  choice: शुद्ध काँच
  rationale: मूल में καθαρός दोनों बार आया है, इसलिए ‘शुद्ध’ की पुनरावृत्ति सुरक्षित रखी गई है। इस प्रसंग में अभिप्राय काँच-जैसी निर्मल, संभवतः पारदर्शी चमक से है।
