language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔχουσαν τὴν δόξαν τοῦ θεοῦ· ὁ φωστὴρ αὐτῆς ὅμοιος λίθῳ τιμιωτάτῳ, ὡς λίθῳ ἰάσπιδι κρυσταλλίζοντι·
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/011.yaml
  text: having the glory of God[a]; its radiance was like a most precious stone, like a jasper stone[b], clear as crystal.
translation:
  language: hi
  text: उसमें परमेश्वर की महिमा थी। उसकी ज्योति एक अत्यन्त बहुमूल्य पत्थर के समान थी—यशब पत्थर के समान, जो स्फटिक के समान पारदर्शी था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχουσαν
  choice: उसमें ... थी
  rationale: स्त्रीलिंग कर्मकारक वर्तमान कृदन्त पिछले पद की ‘नगरी’ का वर्णन करता है। हिन्दी में स्वतंत्र वर्णनात्मक वाक्य स्वाभाविक है और ‘having’ का भाव सुरक्षित रखता है।
- source_word: τὴν δόξαν τοῦ θεοῦ
  choice: परमेश्वर की महिमा
  rationale: ‘महिमा’ δόξα के धार्मिक और दृश्य दोनों आयामों को बनाए रखती है; केवल ‘वैभव’ या ‘तेज’ कहना अर्थ को संकरा कर सकता है।
- source_word: ὁ φωστὴρ αὐτῆς
  choice: उसकी चमक
  rationale: φωστήρ यहाँ नगरी से निकलने वाले दृश्य प्रकाश या दीप्ति को सूचित करता है। ‘चमक’ सामान्य आधुनिक हिन्दी में सहज है और किसी अलग प्रकाश-पिंड का अनावश्यक संकेत नहीं देती।
- source_word: λίθῳ τιμιωτάτῳ
  choice: एक अत्यन्त बहुमूल्य रत्न
  rationale: τιμιωτάτῳ की उत्कृष्टतम तीव्रता ‘अत्यन्त बहुमूल्य’ से व्यक्त होती है। इस संदर्भ में λίθος के लिए ‘रत्न’ प्राकृतिक हिन्दी है।
- source_word: ὡς λίθῳ ἰάσπιδι
  choice: ऐसे यशब पत्थर के समान
  rationale: λίθος की पुनरावृत्ति को ‘पत्थर’ से बनाए रखा गया है और ἴασπις के पारंपरिक हिन्दी नाम ‘यशब’ का प्रयोग किया गया है।
- source_word: κρυσταλλίζοντι
  choice: जो स्फटिक-सा चमक रहा हो
  rationale: यह वर्तमान कृदन्त स्फटिक-जैसे गुण को व्यक्त करता है, जो पारदर्शिता, उज्ज्वलता या झिलमिलाहट हो सकता है। ‘चमक रहा हो’ तुलना के दृश्य प्रभाव को स्वाभाविक हिन्दी में रखता है, बिना केवल पारदर्शिता निश्चित किए।
theological_decisions:
- issue: δόξα τοῦ θεοῦ का प्रकाशन-साहित्य संबंधी अर्थ
  choice: परमेश्वर की महिमा
  alternative: परमेश्वर का वैभव
  rationale: यह पद केवल नगरी की सुंदरता नहीं, उसमें प्रकट परमेश्वर की उपस्थिति और महिमा बताता है। ‘महिमा’ इस धार्मिक भार को सुरक्षित रखती है।
- issue: φωστήρ को परमेश्वर की महिमा के साथ एक ही वस्तु मानना या नगरी की दृश्य दीप्ति समझना
  choice: 'अलग वर्णनात्मक खंड: ‘उसकी चमक’'
  alternative: ‘उसका प्रकाश’
  rationale: यूनानी पाठ में नया कर्ता ὁ φωστήρ αὐτῆς है। अनुवाद उस संबंध को खुला रखता है और यह स्पष्ट नहीं करता कि चमक स्वयं महिमा है या उससे उत्पन्न प्रभाव।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘यशब’ बाइबलीय रत्न-नाम के रूप में रखा गया है; ‘स्फटिक-सा’ κρυσταλλίζοντι की सजीव तुलना को व्यक्त करता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ स्रोत की अर्थ-सीमा को पर्याप्त रूप से बनाए रखता है।
