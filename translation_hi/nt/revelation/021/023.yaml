id: REV.21.23
reference: Revelation 21:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἡ πόλις οὐ χρείαν ἔχει τοῦ ἡλίου οὐδὲ τῆς σελήνης, ἵνα φαίνωσιν αὐτῇ, ἡ γὰρ δόξα τοῦ θεοῦ ἐφώτισεν αὐτήν, καὶ ὁ λύχνος αὐτῆς τὸ ἀρνίον.
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/023.yaml
  text: And the city has no need of the sun or of the moon to shine on it[a], for the glory of God gave it light, and its lamp is the Lamb.
translation:
  language: hi
  text: और उस नगर को सूर्य या चन्द्रमा की आवश्यकता नहीं है कि वे उस पर चमकें[a], क्योंकि परमेश्वर की महिमा ने उसे प्रकाश दिया, और उसका दीपक मेम्ना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कि वे उसे प्रकाश दें।’ यूनानी में शाब्दिक रूप से, ‘कि वे उसके लिए/उस पर चमकें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πόλις
  choice: नगर
  rationale: नई यरूशलेम के संदर्भ में ‘नगर’ सीधा, स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी शब्द है।
- source_word: οὐ χρείαν ἔχει
  choice: की आवश्यकता नहीं
  rationale: यूनानी मुहावरे का अर्थ स्वाभाविक हिन्दी में ठीक तरह व्यक्त करता है और अभाव की बात को स्पष्ट रखता है।
- source_word: τοῦ ἡλίου οὐδὲ τῆς σελήνης
  choice: सूर्य या चन्द्रमा की
  rationale: दोनों खगोलीय प्रकाश-स्रोतों को οὐδέ के नकारात्मक समन्वय के अनुसार ‘या’ से जोड़ा गया है।
- source_word: ἵνα φαίνωσιν αὐτῇ
  choice: कि वे उस पर चमकें
  rationale: φαίνω का खगोलीय पिंडों के साथ ठोस अर्थ ‘चमकना’ है; αὐτῇ को ‘उस पर’ कहना स्वाभाविक है और बाद के ἐφώτισεν से शब्दार्थगत भेद बनाए रखता है।
- source_word: δόξα
  choice: महिमा
  rationale: यह प्रचलित, धर्मवैचारिक रूप से सार्थक और प्रकाशितवाक्य की शैली के अनुरूप पद है; इसे केवल ‘चमक’ बनाकर रूपक को संकुचित नहीं किया गया।
- source_word: ἐφώτισεν
  choice: प्रकाशित किया
  rationale: यह नगर को रोशनी देने के ठोस अर्थ को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा पहले आए ‘चमकें’ से भेद रखता है।
- source_word: λύχνος
  choice: दीपक
  rationale: λύχνος का अर्थ प्रकाश या दीवट नहीं, बल्कि दीपक है; इसलिए मूल बिंब ठीक बना रहता है।
- source_word: ἀρνίον
  choice: मेम्ना
  rationale: प्रकाशितवाक्य में यह यीशु के लिए प्रयुक्त विशिष्ट मसीही पदवी है; ‘मेम्ना’ हिन्दी बाइबलीय प्रयोग में पहचाना जाता है।
theological_decisions:
- issue: ‘उसका दीपक मेम्ना है’ में रूपकात्मक संबंध
  choice: रूपक को सीधे ‘उसका दीपक मेम्ना है’ के रूप में रखा गया।
  alternative: ‘मेम्ना उसका प्रकाश है’ या ‘मेम्ना उसे प्रकाश देता है।’
  rationale: यूनानी पाठ λύχνος अर्थात ‘दीपक’ कहता है, सामान्य ‘प्रकाश’ नहीं। इससे परमेश्वर की महिमा द्वारा प्रकाशित करने और मेम्ने के नगर का दीपक होने के बीच मूल बिंब और तनाव सुरक्षित रहता है।
- issue: ईश्वरीय प्रकाश का अंतकालीन बिंब
  choice: केवल पाठ के दावे को अनूदित किया गया कि नगर को सूर्य या चन्द्रमा की आवश्यकता नहीं, क्योंकि परमेश्वर की महिमा उसे प्रकाशित करती है और मेम्ना उसका दीपक है।
  alternative: यह व्याख्या जोड़ना कि परमेश्वर सभी सृजित प्रकाश-स्रोतों का स्थान लेता है।
  rationale: मूल पद ऐसी विस्तृत धर्मवैचारिक व्याख्या नहीं देता; अतः अनुवाद में कोई सांप्रदायिक या अनुमानात्मक विस्तार नहीं जोड़ा गया।
- issue: ἐφώτισεν का कालगत रूप
  choice: ‘ने ... प्रकाशित किया’ द्वारा यूनानी एओरिस्ट को पूर्ण क्रिया के रूप में रखा गया।
  alternative: ‘प्रकाशित करती है’ या ‘प्रकाशित कर रही है।’
  rationale: वर्णित दर्शन में यूनानी क्रिया एओरिस्ट है। हिन्दी भूतपूर्ण अभिव्यक्ति उसका औपचारिक संकेत बचाती है, जबकि उसका स्थायी परिणाम संदर्भ से स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘नगर’, ‘महिमा’, ‘दीपक’ और ‘मेम्ना’ मूल के प्रकाश-संबंधी बिंब तथा प्रकाशितवाक्य की गंभीर शैली को बनाए रखते हैं। ‘चन्द्रमा’ का मानक वर्तनी-रूप प्रयुक्त है।
