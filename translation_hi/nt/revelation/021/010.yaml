source:
  edition: SBLGNT
  text: καὶ ἀπήνεγκέν με ἐν πνεύματι ἐπὶ ὄρος μέγα καὶ ὑψηλόν, καὶ ἔδειξέν μοι τὴν ⸀πόλιν τὴν ἁγίαν Ἰερουσαλὴμ καταβαίνουσαν ἐκ τοῦ οὐρανοῦ ἀπὸ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/revelation/021/010.yaml
  text: And he carried me away in the Spirit onto a great and high mountain[a], and showed me the holy city, Jerusalem, coming down out of heaven from God,
translation:
  language: hi
  text: और वह मुझे आत्मा में[a] एक बड़े और ऊँचे पहाड़ पर ले गया, और उसने मुझे पवित्र नगर यरूशलेम दिखाया, जो स्वर्ग से, परमेश्वर की ओर से, उतर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्मिक अवस्था में।” यूनानी पदबंध भविष्यदर्शी अवस्था को सूचित कर सकता है; प्रकाशितवाक्य में यह प्रायः भविष्यदर्शी दर्शन का परिचय देता है और पवित्र आत्मा की सक्रियता का संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπήνεγκέν
  choice: ले गया
  rationale: यह क्रिया दर्शन के भीतर एक स्थान से दूसरे स्थान तक पहुँचाए जाने को व्यक्त करती है। हिंदी में ‘ले गया’ स्वाभाविक है और प्रसंग में निहित स्थानांतरण को स्पष्ट रखता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: यूनानी पदबंध भविष्यदर्शी दर्शन की अवस्था अथवा पवित्र आत्मा की सक्रियता—दोनों की ओर संकेत कर सकता है। ‘आत्मा में’ मूल की संक्षिप्तता और अस्पष्टता को बनाए रखता है।
- source_word: ἐπὶ ὄρος μέγα καὶ ὑψηλόν
  choice: एक बड़े और ऊँचे पहाड़ पर
  rationale: ἐπί के साथ यहाँ गति का लक्ष्य व्यक्त होता है। ‘पर’ हिंदी में गंतव्य और स्थिति दोनों के लिए स्वाभाविक है; μέγα और ὑψηλόν के दोनों अलग विशेषण सुरक्षित रखे गए हैं।
- source_word: ἔδειξέν μοι
  choice: उसने मुझे ... दिखाया
  rationale: दείκνυμι का सीधा और स्वाभाविक हिंदी रूप ‘दिखाया’ है; इसमें मूल से अधिक प्रकाशन-संबंधी अर्थ नहीं जोड़ा गया।
- source_word: τὴν πόλιν τὴν ἁγίαν
  choice: पवित्र नगर
  rationale: हिंदी बाइबलीय भाषा में πόλις के लिए ‘नगर’ और ἅγιος के लिए ‘पवित्र’ प्रतिष्ठित, गरिमापूर्ण तथा सहज विकल्प हैं।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिंदी रूप अपनाया गया है।
- source_word: καταβαίνουσαν
  choice: उतर रहा था
  rationale: वर्तमान कृदंत नगर को उतरने की प्रक्रिया में दिखाता है। ‘उतर रहा था’ मुख्य कथन के भूतकालीन दृष्टिकोण के साथ स्वाभाविक हिंदी देता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: ἐκ स्रोत अथवा भीतर से बाहर आने का भाव देता है। हिंदी में ‘स्वर्ग से उतरना’ स्वाभाविक है और इस गति को पर्याप्त रूप से व्यक्त करता है।
- source_word: ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर के पास से
  rationale: ἀπό स्रोत को चिह्नित करता है। ‘परमेश्वर के पास से’ इसे निकटवर्ती ‘स्वर्ग से’ से अलग रखते हुए व्यक्तिगत स्रोत का भाव स्पष्ट करता है, बिना ‘उपस्थिति’ जैसा अतिरिक्त संज्ञात्मक तत्व जोड़े।
theological_decisions:
- issue: दर्शन-सूत्र ἐν πνεύματι में πνεῦμα का अभिप्राय
  choice: ‘आत्मा में’, मुख्य पाठ में अर्थ को खुला रखते हुए
  alternative: ‘पवित्र आत्मा में’ अथवा ‘आत्मिक अवस्था में’
  rationale: प्रकाशितवाक्य में यह पदबंध भविष्यदर्शी अनुभव का बार-बार आने वाला सूत्र है और संभवतः पवित्र आत्मा की सक्रियता बताता है; फिर भी यूनानी में विशेषण ‘पवित्र’ नहीं है। इसलिए मुख्य पाठ मूल की धर्मवैचारिक तन्यता को सुरक्षित रखता है और पादटिप्पणी संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण बाइबलीय शैली रखी गई है। ‘नगर’, ‘यरूशलेम’, ‘स्वर्ग’ और ‘परमेश्वर’ जैसे व्यापक रूप से समझे जाने वाले पद चुने गए हैं। वाक्य की दो समन्वित क्रियाएँ मूल यूनानी संरचना के अनुरूप रखी गई हैं।
