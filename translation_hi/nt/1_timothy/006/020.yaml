reference: 1 Timothy 6:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὦ Τιμόθεε, τὴν παραθήκην φύλαξον, ἐκτρεπόμενος τὰς βεβήλους κενοφωνίας καὶ ἀντιθέσεις τῆς ψευδωνύμου γνώσεως,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/020.yaml
  text: O Timothy[a], guard the deposit entrusted to you[b], turning away from the profane empty talk and contradictions of what is falsely called knowledge.
translation:
  language: hi
  text: हे तीमुथियुस, तुम्हें सौंपी गई धरोहर की रक्षा करो। अपवित्र खोखली बातों और उस ज्ञान के विरोधाभासों[a] से मुँह मोड़ लो, जिसे झूठे ढंग से “ज्ञान” कहा जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस ज्ञान के विरोधों से।”
    reason: lexical_alternative
  - marker: b
    text: या, “तथाकथित ज्ञान के विरोधाभासों से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ Τιμόθεε
  choice: हे तीमुथियुस
  rationale: ‘हे’ यूनानी संबोधन की गंभीरता और सीधे आह्वान को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: παραθήκην
  choice: तुम्हें सौंपी गई धरोहर
  rationale: यह शब्द सुरक्षित रखने के लिए सौंपी गई वस्तु को दर्शाता है। ‘धरोहर’ रूपक को बनाए रखता है और ‘तुम्हें सौंपी गई’ उसके निहित भाव को स्पष्ट करता है।
- source_word: φύλαξον
  choice: रक्षा करो
  rationale: यह सतर्कता से सुरक्षित रखने की आज्ञा देता है; ‘रक्षा करो’ सामान्य ‘रखो’ की अपेक्षा इस बल को बेहतर व्यक्त करता है।
- source_word: ἐκτρεπόμενος
  choice: से मुँह मोड़ लो
  rationale: यह किसी बात से हटने या उसे टालने का चित्र प्रस्तुत करता है और मुख्य आज्ञा के साथ स्वाभाविक हिन्दी में आता है।
- source_word: βεβήλους
  choice: अपवित्र
  rationale: यह पवित्र के विपरीत, धर्मविरुद्ध या अशुद्ध चरित्र वाली बातों का बोध कराता है।
- source_word: κενοφωνίας
  choice: खोखली बातें
  rationale: यौगिक शब्द अर्थहीन या सारहीन वाणी को दर्शाता है; ‘खोखली बातें’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀντιθέσεις
  choice: विरोधाभास
  rationale: शब्द विरोधी कथनों या प्रतिपक्षों का संकेत दे सकता है। प्रसंग में ‘विरोधाभास’ विवादात्मक बल को व्यक्त करता है, जबकि व्यापक विकल्प ‘विरोध’ पादटिप्पणी में सुरक्षित है।
- source_word: τῆς ψευδωνύμου γνώσεως
  choice: उस ज्ञान के... जिसे झूठा ही “ज्ञान” कहा जाता है
  rationale: ψευδώνυμος उस नाम को झूठा ठहराता है। यह रूप स्पष्ट करता है कि लेखक ऐसी शिक्षा के लिए ‘ज्ञान’ नाम को वैध नहीं मानता, बिना उसकी विशिष्ट विषयवस्तु तय किए।
theological_decisions:
- issue: प्रसंग में παραθήκη का स्वरूप
  choice: ‘तुम्हें सौंपी गई धरोहर’ कहकर इसकी विषयवस्तु को अनिर्दिष्ट रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘सुसमाचार का संदेश’, ‘प्रेरितों की शिक्षा’ या ‘सेवा का दायित्व’ कहना।
  rationale: प्रसंग संभवतः प्रेरितिक संदेश की ओर संकेत करता है, पर इस पद में संज्ञा स्वयं उसकी विषयवस्तु को सीमित नहीं करती। इसलिए अनुवाद रूपक और मूल अस्पष्टता दोनों को बनाए रखता है।
- issue: ἀντιθέσεις का अर्थ
  choice: मुख्य पाठ में ‘विरोधाभासों’।
  alternative: ‘विरोधों’ या ‘प्रतिपक्षों’।
  rationale: यह शब्द परस्पर विरोधी दावों अथवा विरोधों—दोनों का अर्थ दे सकता है। मुख्य पाठ प्रसंगानुकूल ‘विरोधाभास’ लेता है, लेकिन व्यापक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधे संबोधन और गरिमापूर्ण आज्ञार्थक शैली के साथ रखी गई है। ‘धरोहर’, ‘खोखली बातें’ और ‘मुँह मोड़ लो’ सामान्य पाठक के लिए सुबोध हैं; उद्धरण-चिह्न ‘ज्ञान’ नाम की असत्यता पर मूल के बल को दिखाते हैं।
