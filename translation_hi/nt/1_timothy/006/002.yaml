source:
  edition: SBLGNT
  text: οἱ δὲ πιστοὺς ἔχοντες δεσπότας μὴ καταφρονείτωσαν, ὅτι ἀδελφοί εἰσιν· ἀλλὰ μᾶλλον δουλευέτωσαν, ὅτι πιστοί εἰσιν καὶ ἀγαπητοὶ οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι. Ταῦτα δίδασκε καὶ παρακάλει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/002.yaml
  text: And those who have believing masters must not despise them because they are brothers[a]; rather, they must serve them all the more, because those who partake of the benefit are believers and beloved[b]. Teach and urge these things.
translation:
  language: hi
  text: और जिनके स्वामी विश्वासी हैं, वे उनका तिरस्कार न करें क्योंकि वे भाई हैं[a]; बल्कि उनकी और भी अधिक सेवा करें, क्योंकि इस भलाई का लाभ पानेवाले विश्वासी और प्रिय हैं[b]। इन बातों की शिक्षा दे और इनके पालन के लिए प्रोत्साहित कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई-बहन”; यूनानी में “भाई”।
    reason: lexical_alternative
  - marker: b
    text: “इस भलाई का लाभ पानेवाले” वाला वाक्यांश कठिन है। संभवतः इसका संकेत उन विश्वासी स्वामियों की ओर है जिन्हें दासों की सेवा का लाभ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πιστοὺς
  choice: विश्वासी
  rationale: यहाँ विशेषण उन स्वामियों को बताता है जो मसीह में विश्वास रखते हैं, न कि केवल भरोसेमंद हैं।
- source_word: δεσπότας
  choice: स्वामी
  rationale: दासता-आधारित घरेलू संदर्भ में यह स्वामित्व और अधिकार रखनेवाले व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘स्वामी’ स्वाभाविक और सटीक है।
- source_word: καταφρονείτωσαν
  choice: तिरस्कार न करें
  rationale: यह क्रिया किसी को तुच्छ समझने या उसके प्रति अवमानना रखने का प्रबल निषेध व्यक्त करती है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है और यहाँ सहविश्वासियों के पारिवारिक संबंध को व्यक्त करता है; समावेशी अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: μᾶλλον δουλευέτωσαν
  choice: बल्कि उनकी और भी अधिक सेवा करें
  rationale: δουλεύω दास की हैसियत में सेवा करने को दर्शाता है। संदर्भ में सामाजिक स्थिति स्पष्ट है, इसलिए ‘सेवा करें’ स्वाभाविक है और ‘और भी अधिक’ μᾶλλον को बनाए रखता है।
- source_word: πιστοί
  choice: विश्वासी
  rationale: यहाँ भी अर्थ मसीह पर विश्वास करनेवाले लोग हैं, न कि केवल निष्ठावान व्यक्ति।
- source_word: ἀγαπητοὶ
  choice: प्रिय
  rationale: यह सहविश्वासियों के प्रति प्रेम और आत्मीयता का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι
  choice: इस भलाई का लाभ पानेवाले
  rationale: संक्षिप्त और कठिन यूनानी वाक्यांश को इस प्रकार रखा गया है कि लाभ पाने का भाव स्पष्ट हो, पर ‘भलाई’ को केवल सेवा कहकर अर्थ अत्यधिक सीमित न किया जाए।
- source_word: Ταῦτα δίδασκε καὶ παρακάλει
  choice: इन बातों की शिक्षा दे और इनके लिए आग्रह कर
  rationale: दोनों वर्तमान आज्ञार्थक क्रियाओं की शिक्षात्मक और प्रोत्साहनात्मक शक्ति को स्पष्ट, आधुनिक हिन्दी में रखा गया है।
theological_decisions:
- issue: मिश्रित कलीसियाई संदर्भ में ἀδελφοί का अनुवाद
  choice: भाई
  alternative: भाई-बहन
  rationale: मूल के व्याकरणिक पुल्लिंग रूप को मुख्य पाठ में सुरक्षित रखा गया है, जबकि सहविश्वासियों को समावेशी रूप से सूचित करने की संभावना पादटिप्पणी में स्पष्ट है।
- issue: दासता के संदर्भ की सामाजिक शब्दावली
  choice: स्वामी ... सेवा करें
  alternative: मालिक ... दास की तरह काम करें
  rationale: मूल में δεσπότης अधिकार और स्वामित्व रखनेवाले को दर्शाता है, जबकि δουλεύω दास की दशा में सेवा को। चुनी हुई हिन्दी सामाजिक वास्तविकता को बनाए रखते हुए अस्वाभाविक अभिव्यक्ति से बचती है।
- issue: οἱ τῆς εὐεργεσίας ἀντιλαμβανόμενοι के लाभार्थी
  choice: लाभ पानेवाले विश्वासी स्वामी हैं
  alternative: विश्वासी दास भलाई में लगे हुए हैं; अथवा दोनों पक्ष लाभ में सहभागी हैं
  rationale: निकटतम संदर्भ और वाक्य-संरचना के अनुसार विश्वासी स्वामी दासों की सेवा से लाभ पानेवाले प्रतीत होते हैं। फिर भी यूनानी वाक्यांश कठिन और विवादित है, इसलिए मुख्य पाठ अपेक्षाकृत खुला है और पादटिप्पणी में कठिनाई बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण, सहज और शिक्षात्मक शैली रखी गई है। ‘तिरस्कार’, ‘विश्वासी’ और ‘आग्रह’ जैसे परिचित धार्मिक-साहित्यिक शब्द गरिमा बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
