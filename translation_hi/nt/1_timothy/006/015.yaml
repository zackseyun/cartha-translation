source:
  edition: SBLGNT
  text: ἣν καιροῖς ἰδίοις δείξει ὁ μακάριος καὶ μόνος δυνάστης, ὁ βασιλεὺς τῶν βασιλευόντων καὶ κύριος τῶν κυριευόντων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/015.yaml
  text: which he will display in his own times—the blessed and only Sovereign[a], the King of those who reign and Lord of those who rule[b],
translation:
  language: hi
  text: जिसे वह अपने ही समयों में प्रकट करेगा—वही धन्य और एकमात्र अधिपति, राज करनेवालों का राजा और शासन करनेवालों का प्रभु है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पारंपरिक अनुवाद: “राजाओं का राजा और प्रभुओं का प्रभु।” यूनानी में कृदन्तों का प्रयोग हुआ है; शाब्दिक अर्थ है, “राज करनेवालों का राजा और शासन करनेवालों का प्रभु।”'
    reason: alternative_reading
lexical_decisions:
- source_word: ἣν
  choice: जिसे
  rationale: स्त्रीलिंग एकवचन सम्बन्धवाचक सर्वनाम पिछले पद के ἐπιφάνειαν (‘प्रकट होना/आगमन’) की ओर संकेत करता है; हिन्दी में ‘जिसे’ इस कर्म-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καιροῖς ἰδίοις
  choice: अपने ठहराए हुए समयों पर
  rationale: καιρός उपयुक्त या नियुक्त समय को दर्शाता है और यूनानी बहुवचन को ‘समयों’ में रखा गया है। ‘ठहराए हुए’ भाव को स्पष्ट करता है, जबकि समय ठहरानेवाले की पहचान संदर्भ पर छोड़ी गई है।
- source_word: δείξει
  choice: प्रकट करेगा
  rationale: δείκνυμι का अर्थ दिखाना या खुले रूप में सामने लाना है; आगमन के संदर्भ में ‘प्रकट करेगा’ आधुनिक हिन्दी में सहज और ठोस है।
- source_word: ὁ μακάριος
  choice: वह धन्य
  rationale: यह विशेषण यहाँ संज्ञात्मक दैवी उपाधि के रूप में प्रयुक्त है; ‘धन्य’ उसकी गरिमापूर्ण और प्रचलित अभिव्यक्ति है।
- source_word: μόνος δυνάστης
  choice: एकमात्र प्रभुसत्ताधारी
  rationale: δυνάστης शासन की सर्वोच्च शक्ति रखनेवाले को दर्शाता है। ‘प्रभुसत्ताधारी’ गरिमापूर्ण ढंग से सार्वभौम शासन का भाव देता है और केवल सामान्य ‘शासक’ से अधिक सटीक है।
- source_word: βασιλεὺς τῶν βασιλευόντων
  choice: राज करनेवालों का राजा
  rationale: βασιλευόντων संज्ञा नहीं बल्कि कृदन्त है; अतः यह अनुवाद ‘राजाओं का राजा’ की पारंपरिक अभिव्यक्ति के बजाय यूनानी के क्रियात्मक बल को सुरक्षित रखता है।
- source_word: κύριος τῶν κυριευόντων
  choice: शासन करनेवालों का प्रभु
  rationale: κύριος को उपाधि के रूप में ‘प्रभु’ और κυριευόντων के क्रियात्मक अर्थ को ‘शासन करनेवालों’ से व्यक्त किया गया है।
theological_decisions:
- issue: आगमन को प्रकट करनेवाले का संदर्भ
  choice: कर्ता को केवल ‘वह’ कहा गया है और आगे की दैवी उपाधियों से पहचाने जाने दिया गया है।
  alternative: संदर्भ के आधार पर उसे स्पष्ट रूप से परमेश्वर पिता कहना।
  rationale: यूनानी पाठ इस पद में उचित नाम नहीं देता, बल्कि कर्ता का वर्णन उपाधियों से करता है। इसलिए अनुवाद त्रिएकता-संबंधी पहचान को पाठ में अतिरिक्त रूप से स्पष्ट किए बिना मूल की प्रस्तुति और तनाव को बनाए रखता है।
- issue: पारंपरिक उपाधि बनाम यूनानी कृदन्त
  choice: ‘राज करनेवालों का राजा और शासन करनेवालों का प्रभु’
  alternative: ‘राजाओं का राजा और प्रभुओं का प्रभु’
  rationale: मूल में दोनों आश्रित पद कृदन्त हैं। मुख्य पाठ में उनका क्रियात्मक बल रखा गया है और पारंपरिक रूप को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली। ‘प्रभुसत्ताधारी’ सर्वोच्च शासकीय अधिकार को व्यक्त करता है। पद वाक्य के बीच से आरम्भ होता है, इसलिए आरम्भिक ‘जिसे’ द्वारा पिछले पद के ‘प्रकट होने’ से संबंध बनाए रखा गया है।
