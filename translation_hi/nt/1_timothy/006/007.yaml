source:
  edition: SBLGNT
  text: οὐδὲν γὰρ εἰσηνέγκαμεν εἰς τὸν κόσμον, ⸀ὅτι οὐδὲ ἐξενεγκεῖν τι δυνάμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/007.yaml
  text: For we brought nothing into the world[a], and we are not able to carry anything out.
translation:
  language: hi
  text: क्योंकि हम संसार में कुछ भी लेकर नहीं आए[a], और न ही हम संसार से कुछ भी ले जा सकते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “क्योंकि हम संसार में कुछ भी लेकर नहीं आए, क्योंकि/और न ही हम संसार से कुछ भी ले जा सकते हैं।” यूनानी संयोजक शब्द का अर्थ कारणवाचक “क्योंकि” हो सकता है, या वह पहले के समानांतर दूसरे कथन का परिचय दे सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: कुछ भी नहीं
  rationale: यह नकारात्मक अनिश्चित सर्वनाम εἰσηνέγκαμεν का कर्म है; हिंदी में ‘कुछ भी ... नहीं’ पूर्ण निषेध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछली बात का आधार या स्पष्टीकरण देता है; आधुनिक हिंदी में ‘क्योंकि’ इसका संबंध स्पष्ट रखता है।
- source_word: εἰσηνέγκαμεν
  choice: लेकर ... आए
  rationale: εἰσφέρω का अर्थ ‘अंदर लाना’ है; संसार में जन्म के द्वारा प्रवेश के संदर्भ में ‘लेकर आए’ स्वाभाविक और चित्रात्मक है।
- source_word: εἰς τὸν κόσμον
  choice: संसार में
  rationale: κόσμος यहाँ उस मानव-जगत को दर्शाता है जिसमें व्यक्ति जन्म लेता है; ‘संसार’ गरिमापूर्ण और सामान्य हिंदी शब्द है।
- source_word: ὅτι
  choice: और
  rationale: यहाँ इसे संतुलित दूसरी उक्ति का परिचय देने वाला मानकर ‘और’ किया गया है; संभावित कारणार्थक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οὐδὲ
  choice: और न
  rationale: दूसरे खंड के निषेध और पहले खंड से उसके समानांतर संबंध, दोनों को व्यक्त करता है।
- source_word: ἐξενεγκεῖν
  choice: यहाँ से ... ले जा
  rationale: ἐκφέρω का मूल अर्थ ‘बाहर ले जाना’ है; ‘यहाँ से’ संसार से प्रस्थान का संदर्भ सहज रूप में स्पष्ट करता है।
- source_word: τι
  choice: कुछ
  rationale: निषेध के अधीन अनिश्चित सर्वनाम का स्वाभाविक हिंदी रूप ‘कुछ’ है।
- source_word: δυνάμεθα
  choice: सकते हैं
  rationale: δύναμαι की सामर्थ्य-संबंधी धारणा को हिंदी की सामान्य क्रिया ‘सकना’ ठीक और संक्षिप्त रूप में व्यक्त करती है।
theological_decisions:
- issue: ὅτι से आरंभ होने वाले दूसरे खंड का संबंध
  choice: 'इसे पहले कथन के समानांतर समन्वयी कथन के रूप में प्रस्तुत किया गया: ‘और न हम यहाँ से कुछ ले जा सकते हैं।’'
  alternative: 'कारणवाचक: ‘क्योंकि हम यहाँ से कुछ भी नहीं ले जा सकते।’'
  rationale: ὅτι कारणवाचक हो सकता है, पर प्रसंग में दोनों कथन एक संतुलित लोकोक्तिपरक जोड़ी भी बनाते हैं। मुख्य पाठ में प्रवाह और संतुलन रखा गया है, जबकि वास्तविक भाषिक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘संसार में ... लेकर आए’ और ‘यहाँ से ... ले जा सकते हैं’ जन्म और मृत्यु से जुड़ी मूल रूपकात्मक समानता को सामान्य पाठक के लिए स्वाभाविक बनाते हैं।
