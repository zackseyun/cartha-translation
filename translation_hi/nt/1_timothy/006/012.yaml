id: 1TI.6.12
reference: 1 Timothy 6:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀγωνίζου τὸν καλὸν ἀγῶνα τῆς πίστεως, ἐπιλαβοῦ τῆς αἰωνίου ζωῆς, εἰς ἣν ἐκλήθης καὶ ὡμολόγησας τὴν καλὴν ὁμολογίαν ἐνώπιον πολλῶν μαρτύρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/012.yaml
  text: Fight the good fight of the faith[b][a]; take hold of the eternal life to which you were called and about which you made the good confession before many witnesses.
translation:
  language: hi
  text: विश्वास की उत्तम लड़ाई लड़ो[a]; अनन्त जीवन को थाम लो, जिसके लिए तुम्हें बुलाया गया था, और तुमने बहुत-से गवाहों के सामने उत्तम अंगीकार किया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास के लिए उत्तम लड़ाई लड़ो।” यूनानी पद का अर्थ विश्वास से चिह्नित लड़ाई या मसीही विश्वास के लिए संघर्ष—दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: 'वैकल्पिक रूप से, अंतिम खंड को अनन्त जीवन से जोड़कर समझा जा सकता है: “और जिसके विषय में तुमने बहुत-से गवाहों के सामने उत्तम अंगीकार किया था।” यूनानी में अंगीकार की विषयवस्तु स्पष्ट रूप से नहीं बताई गई है, यद्यपि वह अनन्त जीवन की बुलाहट से निकटता से जुड़ा हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγωνίζου τὸν καλὸν ἀγῶνα
  choice: उत्तम लड़ाई लड़ो
  rationale: सजातीय क्रिया और संज्ञा के बल को हिन्दी में दोहराव द्वारा रखा गया है। वर्तमान आज्ञार्थक रूप निरन्तर और सक्रिय संघर्ष का भाव देता है; ‘उत्तम’ καλός के अच्छे, योग्य और श्रेष्ठ होने के मूल्यांकन को व्यक्त करता है।
- source_word: τῆς πίστεως
  choice: विश्वास की
  rationale: सम्बन्धकारक पद को निकटता से रखा गया है। सन्दर्भ में यह मसीही विश्वास को सूचित कर सकता है, पर हिन्दी वाक्यांश व्यक्तिगत विश्वास से चिह्नित संघर्ष का अर्थ भी खुला रखता है।
- source_word: ἐπιλαβοῦ
  choice: थाम लो
  rationale: अपूर्ण नहीं बल्कि निर्णायक आज्ञा का भाव है—किसी वस्तु को दृढ़ता से पकड़ लेना। ‘थाम लो’ स्वाभाविक हिन्दी में इस रूपक को बनाए रखता है।
- source_word: τῆς αἰωνίου ζωῆς
  choice: अनन्त जीवन को
  rationale: यह उस विशिष्ट जीवन को सूचित करता है जो बुलाहट का लक्ष्य है। हिन्दी में कर्मचिह्न ‘को’ निश्चित सन्दर्भ को पर्याप्त रूप से व्यक्त करता है।
- source_word: εἰς ἣν ἐκλήθης
  choice: जिसके लिए तुम बुलाए गए थे
  rationale: εἰς लक्ष्य की ओर संकेत करता है; ‘जिसके लिए’ बुलाहट और अनन्त जीवन के लक्ष्यगत सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है। कर्मवाच्य मूल के ईश्वरीय बुलावे को बिना कर्ता जोड़े सुरक्षित रखता है।
- source_word: τὴν καλὴν ὁμολογίαν
  choice: उत्तम अंगीकार
  rationale: ὁμολογία सार्वजनिक स्वीकार या घोषणा है। ‘अंगीकार’ धार्मिक सन्दर्भ में परिचित और गरिमापूर्ण है; ‘उत्तम’ पहले καλός के साथ समानान्तरता बनाए रखता है।
- source_word: ἐνώπιον πολλῶν μαρτύρων
  choice: बहुत-से गवाहों के सामने
  rationale: यह सार्वजनिक उपस्थिति को सीधे और स्वाभाविक ढंग से व्यक्त करता है। यहाँ μάρτυρες का अर्थ गवाह है, शहीद नहीं।
- source_word: καί
  choice: और
  rationale: मूल यूनानी केवल समन्वय करता है और अंगीकार की विषयवस्तु को स्पष्ट रूप से नहीं बताता। इसलिए हिन्दी में ‘और’ रखा गया है, ताकि अनन्त जीवन से सम्बन्ध सम्भव रहे पर अनिवार्य न बनाया जाए।
theological_decisions:
- issue: τῆς πίστεως का अर्थ
  choice: मुख्य पाठ में ‘विश्वास की’
  alternative: ‘विश्वास के लिए’ या ‘मसीही विश्वास की रक्षा में’
  rationale: लेख और पास्टोरल पत्रियों का प्रयोग वस्तुगत ‘मसीही विश्वास’ का समर्थन कर सकता है, जबकि सम्बन्धकारक रचना विश्वास से चिह्नित या विश्वास के द्वारा लड़ी जाने वाली लड़ाई भी बता सकती है। मुख्य पाठ मूल की संक्षिप्तता और अस्पष्टता को बनाए रखता है; पादटिप्पणी दोनों सम्भावनाएँ बताती है।
- issue: अंगीकार का अनन्त जीवन/बुलाहट से सम्बन्ध
  choice: ‘और ... उत्तम अंगीकार किया था’—समन्वयी पाठ
  alternative: ‘जिसके विषय में तुमने ... उत्तम अंगीकार किया था’
  rationale: यूनानी में अंगीकार की विषयवस्तु स्पष्ट रूप से नहीं कही गई। निकट क्रम के कारण उसे अनन्त जीवन अथवा बुलाहट से जोड़ना सम्भव है, पर मुख्य पाठ में ऐसा सम्बन्ध जोड़ना अस्पष्टता को सुलझा देता। इसलिए निकटतर समन्वयी रचना चुनी गई और वैकल्पिक सम्बन्ध पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक-पाठ योग्य रूप। ‘लड़ाई लड़ो’ मूल के शब्दालंकार को बचाता है; ‘थाम लो’ सहज है; ‘अंगीकार’ धार्मिक सन्दर्भ में सटीक रहते हुए अत्यधिक सम्प्रदायगत नहीं है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
