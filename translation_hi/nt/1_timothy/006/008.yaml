  text: ἔχοντες δὲ διατροφὰς καὶ σκεπάσματα, τούτοις ἀρκεσθησόμεθα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/008.yaml
  text: But if we have food and covering[a], we will be content with these.
translation:
  language: hi
  text: पर यदि हमारे पास भोजन और ढकने के साधन हों[a], तो हम इन्हीं से संतुष्ट रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वस्त्र’। यूनानी शब्द का अर्थ अधिक व्यापक रूप से ढकने वाली चीज़ें हो सकता है, जिसमें संभवतः आश्रय भी शामिल है।
    reason: शब्द के वैकल्पिक और व्यापक अर्थ-क्षेत्र को स्पष्ट करना।
lexical_decisions:
- source_word: ἔχοντες
  choice: यदि हमारे पास ... हो
  rationale: यह क्रियाविशेषणीय कृदन्त मुख्य क्रिया की परिस्थिति बताता है। हिन्दी में सशर्त वाक्य इसे स्वाभाविक ढंग से व्यक्त करता है और इसे निश्चित कारण के अर्थ में सीमित नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन के साथ हल्का विरोध या विचार का अगला मोड़ दिखाता है; ‘पर’ उस संबंध को सहज रूप में व्यक्त करता है।
- source_word: διατροφὰς
  choice: भोजन
  rationale: यह शब्द जीवन-निर्वाह के साधन, विशेषकर खाने-पीने की सामग्री, को सूचित करता है। यहाँ ‘भोजन’ सरल और सटीक है।
- source_word: σκεπάσματα
  choice: तन ढकने को
  rationale: यूनानी शब्द ढकने वाली वस्तुओं को सूचित करता है। यह हिन्दी अभिव्यक्ति मुख्यतः वस्त्र का स्वाभाविक बोध कराती है, जबकि पादटिप्पणी शब्द की संभावित व्यापकता—आश्रय सहित—सुरक्षित रखती है।
- source_word: τούτοις
  choice: इन्हीं में
  rationale: संकेतवाचक सर्वनाम ठीक पहले बताई गई मूल आवश्यकताओं की ओर लौटता है; ‘इन्हीं’ उसका बल बनाए रखता है।
- source_word: ἀρκεσθησόμεθα
  choice: संतुष्ट रहेंगे
  rationale: भविष्यकालीन रूप पर्याप्त मानने या संतुष्ट रहने का अर्थ देता है। ‘संतुष्ट रहेंगे’ भविष्य सूचक कथन को बनाए रखता है; इसे आज्ञा या आग्रह में नहीं बदलता।
theological_decisions:
- issue: σκεπάσματα का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘तन ढकने को’, साथ में व्यापक अर्थ बताने वाली पादटिप्पणी
  alternative: केवल ‘वस्त्र’ अथवा केवल ‘आश्रय’
  rationale: संदर्भ मूल आवश्यकताओं में संतोष की बात करता है। यूनानी शब्द को केवल वस्त्र या केवल आवास तक सीमित करना अनावश्यक अर्थ-निर्धारण होगा; पादटिप्पणी वास्तविक शाब्दिक व्यापकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सहज शैली रखी गई है। ‘इन्हीं’ मूल आवश्यकताओं पर बल देता है, और भविष्यकालीन ‘रहेंगे’ यूनानी क्रियारूप को सुरक्षित रखता है।
