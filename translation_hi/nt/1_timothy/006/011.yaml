id: 1TI.6.11
reference: 1 Timothy 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σὺ δέ, ὦ ἄνθρωπε ⸀θεοῦ, ταῦτα φεῦγε· δίωκε δὲ δικαιοσύνην, εὐσέβειαν, πίστιν, ἀγάπην, ὑπομονήν, ⸀πραϋπαθίαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/011.yaml
  text: But you[a], man of God, flee these things; but pursue righteousness, godliness, faith, love, steadfastness[c][b], gentleness.
translation:
  language: hi
  text: परन्तु हे परमेश्वर के जन, तुम इन बातों से भागो; और धार्मिकता[a], भक्ति, विश्वास[b], प्रेम, धीरज और नम्रता[c] का पीछा करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।”
    reason: lexical_alternative
  - marker: b
    text: या “विश्वासयोग्यता” अथवा “भरोसा।”
    reason: lexical_alternative
  - marker: c
    text: यह दुर्लभ यूनानी शब्द “दीनता,” “सहनशीलता,” या “धैर्यपूर्ण नम्रता” भी अनूदित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Σὺ δέ
  choice: परन्तु ... तुम
  rationale: δέ के प्रबल विरोध और Σὺ की बलाघाती दूसरी-पुरुष एकवचनता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὦ ἄνθρωπε θεοῦ
  choice: हे परमेश्वर के जन
  rationale: तीमुथियुस को किए गए सीधे, एकवचन सम्बोधन और बाइबलीय उपाधि को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ταῦτα φεῦγε
  choice: इन बातों से भागो
  rationale: ταῦτα का पूर्ववर्ती बुराइयों की ओर संकेत और φεῦγε की सतत, तात्कालिक दूरी बनाने की प्रबल आज्ञा दोनों बनाए रखता है।
- source_word: δίωκε δὲ
  choice: और ... का पीछा करो
  rationale: हिन्दी में दूसरे विरोधी आदेश को स्वाभाविक रूप से जोड़ते हुए δίωκε की सक्रिय और प्रबल खोज को व्यक्त करता है; पहले आदेश के साथ वैचारिक विरोध स्पष्ट है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: नैतिक और सम्बन्धपरक सही आचरण का स्थापित बाइबलीय पद; ‘न्याय’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: परमेश्वर के प्रति श्रद्धा से आकार पाए जीवन को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: πίστις का सामान्य और स्थापित अर्थ; सद्गुण-सूची में ‘विश्वासयोग्यता’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: स्पष्ट, स्वाभाविक और स्थापित समतुल्य।
- source_word: ὑπομονήν
  choice: धीरज
  rationale: कठिनाई में टिके रहने और सहनशील दृढ़ता की धारणा को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πραϋπαθίαν
  choice: नम्रता
  rationale: दुर्लभ यूनानी पद के कोमलता और संयमित सहनशीलता वाले अर्थ के लिए पठनीय मुख्य-पाठ विकल्प; अधिक विशिष्ट सम्भावनाएँ पादटिप्पणी में हैं।
theological_decisions:
- issue: ὦ ἄνθρωπε θεοῦ में सम्बोधन
  choice: परमेश्वर के जन
  alternative: परमेश्वर के मनुष्य
  rationale: यह तीमुथियुस के लिए एकवचन प्रत्यक्ष सम्बोधन और पहचानी हुई बाइबलीय उपाधि है। ‘जन’ हिन्दी में स्वाभाविक है और सम्बोधन को सामूहिक नहीं बनाता।
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: सद्गुण-सूची में नैतिक सहीपन प्रमुख है, पर न्याय का अर्थक्षेत्र वास्तविक है और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: सद्गुण-सूची में πίστις
  choice: विश्वास
  alternative: विश्वासयोग्यता या भरोसा
  rationale: विश्वास सामान्य अर्थ है, किन्तु इस प्रसंग में चरित्रगत विश्वसनीयता भी सम्भव है; पाठ उस सम्भावना को निर्णायक रूप से बन्द नहीं करता।
- issue: दुर्लभ पद πραϋπαθία
  choice: नम्रता
  alternative: दीनता, सहनशीलता, या धैर्यपूर्ण नम्रता
  rationale: मुख्य पाठ में सरलता आवश्यक है, जबकि पादटिप्पणी इस दुर्लभ शब्द की कोमलता और धैर्यपूर्ण संयम की संयुक्त छाया को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष और गरिमापूर्ण आज्ञार्थक शैली। ‘भागो’ और ‘पीछा करो’ के समानान्तर प्रबल क्रियापद मूल पाठ की नैतिक तात्कालिकता रखते हैं। सभी वैकल्पिक अर्थ मुख्य पाठ के संकेतकों से संबद्ध पादटिप्पणियों में सुरक्षित हैं।
