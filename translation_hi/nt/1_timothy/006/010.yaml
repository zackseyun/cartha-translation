id: 1TI.6.10
reference: 1 Timothy 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ῥίζα γὰρ πάντων τῶν κακῶν ἐστιν ἡ φιλαργυρία, ἧς τινες ὀρεγόμενοι ἀπεπλανήθησαν ἀπὸ τῆς πίστεως καὶ ἑαυτοὺς περιέπειραν ὀδύναις πολλαῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/010.yaml
  text: For the love of money is a root of all kinds of evils[a]; by craving it[c][b], some have wandered away from the faith and pierced themselves with many pains.
translation:
  language: hi
  text: क्योंकि धन का प्रेम हर प्रकार की बुराइयों की एक जड़ है[a]। इसी की लालसा करते हुए कुछ लोग विश्वास से भटक गए हैं[b] और उन्होंने अपने आपको अनेक पीड़ाओं से बेध डाला है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, पारम्परिक अनुवाद: “धन का प्रेम सारी बुराई की जड़ है।” यूनानी वाक्य अधिक स्वाभाविक रूप से “हर प्रकार की बुराइयों की एक जड़” का अर्थ दे सकता है; इससे यह नहीं कहा जाता कि हर बुराई का केवल एक ही कारण है।'
    reason: alternative_reading
  - marker: b
    text: या, “विश्वास के मार्ग से भटक गए हैं।” यहाँ “विश्वास” से सम्भवतः मसीही विश्वास—अर्थात् विश्वास की स्वीकार की गई शिक्षा—अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने आपको अनेक व्यथाओं से छलनी कर लिया है” अथवा “अनेक शोकों से बेध लिया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζα
  choice: एक जड़
  rationale: ῥίζα यहाँ क्रिया से पहले अनिश्चित विधेय संज्ञा है; इसलिए ‘एक जड़’ स्वाभाविक है और इसे हर बुराई का एकमात्र मूल कारण नहीं बनाता।
- source_word: πάντων τῶν κακῶν
  choice: हर प्रकार की बुराइयों की
  rationale: बहुवचन κακῶν के व्यापक और प्रकार-वितरक भाव को आधुनिक हिन्दी में व्यक्त करता है, बिना इस दावे को निरपेक्ष बनाए कि प्रत्येक बुराई केवल इसी कारण से आती है।
- source_word: φιλαργυρία
  choice: धन का प्रेम
  rationale: यूनानी शब्द का आशय धन या चाँदी से प्रेम है। ‘धन का प्रेम’ पारदर्शी है और व्यापक ‘लोभ’ की अपेक्षा मूल शब्द की छवि बनाए रखता है।
- source_word: ἧς ... ὀρεγόμενοι
  choice: इसी की लालसा करते हुए
  rationale: स्त्रीलिंग सम्बन्धवाचक सर्वनाम φιλαργυρία की ओर लौटता है। ‘इसी’ उस व्याकरणिक सम्बन्ध को बनाए रखता है, जबकि ‘लालसा’ ὀρέγομαι की प्रबल इच्छा को व्यक्त करती है।
- source_word: ἀπεπλανήθησαν ἀπὸ τῆς πίστεως
  choice: विश्वास से भटक गए हैं
  rationale: यह पद पहले की स्थिति से दूर भटकने की गति व्यक्त करता है। सन्दर्भ में ‘विश्वास’ मसीही विश्वास-परम्परा की ओर संकेत कर सकता है, जबकि हिन्दी अभिव्यक्ति मूल में उपस्थित अर्थगत तनाव को खुला रखती है।
- source_word: περιέπειραν
  choice: अपने आपको ... बेध डाला है
  rationale: क्रिया का सजीव अर्थ आर-पार बेधना या छेदना है। यह रूप आत्म-प्रेरित हानि की तीव्र छवि को सुरक्षित रखता है।
- source_word: ὀδύναις πολλαῖς
  choice: अनेक पीड़ाओं से
  rationale: ὀδύνη तीव्र पीड़ा, व्यथा या शोक को समेट सकता है। ‘पीड़ाओं’ में शारीरिक और भीतरी, दोनों प्रकार के कष्ट की गुंजाइश रहती है।
theological_decisions:
- issue: धन के प्रेम और बुराई के बीच दावे का विस्तार
  choice: धन का प्रेम हर प्रकार की बुराइयों की एक जड़ है।
  alternative: धन का प्रेम सारी बुराई की जड़ है।
  rationale: ῥίζα के साथ उपपद नहीं है और κακῶν बहुवचन है। चुना गया रूप धन के प्रेम को अनेक प्रकार की बुराइयों का स्रोत बताता है, पर उसे हर बुराई का अकेला कारण घोषित नहीं करता।
- issue: τῆς πίστεως का आशय
  choice: विश्वास से
  alternative: मसीही विश्वास से / अपने विश्वास से
  rationale: पत्रियों के सन्दर्भ में निश्चित पद τῆς πίστεως सम्भवतः मसीही विश्वास को वस्तुगत रूप में दर्शाता है। फिर भी केवल ‘विश्वास’ हिन्दी में मूल पद के सम्भावित व्यक्तिगत विश्वास-भाव को पूरी तरह बन्द नहीं करता; टिप्पणी प्रमुख सन्दर्भगत अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘धन का प्रेम’, ‘एक जड़’, ‘भटक गए’ और ‘बेध डाला’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल की नैतिक गंभीरता और सजीव रूपक को बनाए रखते हैं। वाक्य-रचना स्वाभाविक हिन्दी के लिए दो वाक्यों में रखी गई है।
