  text: Τοῖς πλουσίοις ἐν τῷ νῦν αἰῶνι παράγγελλε μὴ ὑψηλοφρονεῖν μηδὲ ἠλπικέναι ἐπὶ πλούτου ἀδηλότητι, ἀλλ’ ⸀ἐπὶ ⸀θεῷ τῷ παρέχοντι ἡμῖν πάντα πλουσίως εἰς ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/017.yaml
  text: Command those who are rich in the present age not to be arrogant[a], nor to set their hope on the uncertainty of riches, but on God[b], who richly provides us with everything for enjoyment.
translation:
  language: hi
  text: इस वर्तमान युग[a] में जो धनवान हैं, उन्हें आज्ञा दो कि वे घमण्ड न करें और न अनिश्चित धन पर अपनी आशा रखें, बल्कि परमेश्वर पर रखें, जो हमारे आनन्द के लिए हमें सब कुछ भरपूर मात्रा में देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस वर्तमान संसार में।’ यूनानी शब्द का अर्थ ‘युग’ हो सकता है और विस्तार से वर्तमान संसार-व्यवस्था भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῖς πλουσίοις
  choice: जो धनवान हैं
  rationale: संज्ञा के रूप में प्रयुक्त सविभक्ति विशेषण को स्वाभाविक हिन्दी में व्यक्त करता है और लोगों को केवल एक वर्ग-सूचक नाम से पुकारने से बचता है।
- source_word: ἐν τῷ νῦν αἰῶνι
  choice: इस वर्तमान युग में
  rationale: αἰών के कालगत और पौलुसीय युग-संबंधी भाव को सुरक्षित रखता है; इसे केवल भौतिक संसार तक सीमित नहीं करता।
- source_word: παράγγελλε
  choice: आज्ञा दो
  rationale: वर्तमान काल के इस आज्ञार्थक क्रिया-रूप की अधिकारपूर्ण शक्ति को स्पष्ट रूप से व्यक्त करता है।
- source_word: μὴ ὑψηλοφρονεῖν
  choice: घमण्ड न करें
  rationale: ऊँचा समझने या अभिमानी होने के नैतिक भाव को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: μηδὲ ἠλπικέναι
  choice: न ... अपनी आशा रखें
  rationale: पूर्ण क्रिया-रूप में निहित स्थिर या टिकाई हुई आशा के भाव को सहज हिन्दी में प्रकट करता है।
- source_word: ἐπὶ πλούτου ἀδηλότητι
  choice: धन की अनिश्चितता पर
  rationale: धन को अविश्वसनीय और अस्थिर आधार बताने वाली यूनानी रचना को यथासंभव निकटता से सुरक्षित रखता है।
- source_word: ἀλλ’ ἐπὶ θεῷ
  choice: बल्कि परमेश्वर पर रखें
  rationale: पहले प्रयुक्त ἐπί के समानान्तर आशा के वास्तविक आधार को स्पष्ट करता है; हिन्दी में आवश्यक क्रिया को दोहराने से वाक्य स्वाभाविक बनता है।
- source_word: τῷ παρέχοντι ἡμῖν
  choice: जो ... हमें ... देता है
  rationale: परमेश्वर का वर्णन करने वाले कृदन्त को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: मूल पाठ के व्यापक दायरे को बिना उसे केवल आवश्यकताओं तक सीमित किए सुरक्षित रखता है।
- source_word: πλουσίως
  choice: भरपूर
  rationale: प्रचुर और उदार प्रावधान का भाव सहज हिन्दी में देता है तथा पद के धन-संबंधी शब्द-क्षेत्र से संबंध बनाए रखता है।
- source_word: εἰς ἀπόλαυσιν
  choice: हमारे आनन्द के लिए
  rationale: प्रयोजन या परिणाम के भाव को स्पष्ट करता है; 'हमारे' पहले के ἡμῖν के संदर्भ को स्वाभाविक हिन्दी में आगे बढ़ाता है।
theological_decisions:
- issue: नैतिक और युगान्त-संबंधी संदर्भ में αἰών का अर्थ
  choice: युग
  alternative: संसार या वर्तमान विश्व-व्यवस्था
  rationale: '''युग'' पौलुस के कालगत और युगान्त-संबंधी विरोध को सुरक्षित रखता है और कथन को केवल भौतिक संसार के विषय में समझने से बचाता है।'
- issue: πάντα में परमेश्वर के प्रावधान का दायरा
  choice: सब कुछ
  alternative: सभी आवश्यक वस्तुएँ
  rationale: मूल पाठ व्यापक है और प्रावधान को केवल अनिवार्य आवश्यकताओं तक सीमित नहीं करता। साथ ही अनुवाद इसमें समृद्धि-संबंधी कोई अतिरिक्त दावा नहीं जोड़ता।
- issue: धन के विषय में चेतावनी का लक्ष्य
  choice: धन की अनिश्चितता पर आशा न रखना
  alternative: धन रखना ही निषिद्ध है
  rationale: पद धन के स्वामित्व को सीधे निषिद्ध नहीं करता, बल्कि घमण्ड और धन पर टिकाई गई आशा को निषिद्ध करता है; इसी तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘आज्ञा दो’ मूल क्रिया की अधिकारपूर्ण शक्ति को बनाए रखता है; ‘भरपूर देता है’ सामान्य पाठक के लिए स्वाभाविक रहते हुए परमेश्वर की उदार व्यवस्था को व्यक्त करता है।
