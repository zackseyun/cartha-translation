  yaml_path: translation/nt/1_timothy/006/019.yaml
  text: storing up for themselves a good foundation for the future[a], so that they may take hold of the life that is truly life.
translation:
  language: hi
  text: भविष्य के लिए अपने लिए एक अच्छी नींव जमा करते हुए, ताकि वे उस जीवन को थाम लें जो सचमुच जीवन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποθησαυρίζοντας
  choice: धन जमा करते हुए
  rationale: वर्तमान कृदंत पिछले पद के उपदेश को आगे बढ़ाता है। यह चयन संचय और खजाने की छवि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἑαυτοῖς
  choice: अपने लिए
  rationale: आत्मवाचक संप्रदान कारक कर्ताओं के लाभ को दर्शाता है; ‘अपने लिए’ इसका सहज हिन्दी रूप है।
- source_word: θεμέλιον καλὸν
  choice: एक अच्छी नींव
  rationale: ‘नींव’ निर्माण-रूपक को सुरक्षित रखता है और ‘अच्छी’ καλόν के अच्छे, योग्य अथवा सुदृढ़ होने के भाव को व्यापक रूप से व्यक्त करता है।
- source_word: εἰς τὸ μέλλον
  choice: आनेवाले समय के वास्ते
  rationale: यह अभिव्यक्ति भविष्य में आनेवाली बात की ओर संकेत करती है, पर यूनानी पाठ से अधिक स्पष्ट रूप में ‘आनेवाला युग’ नहीं जोड़ती।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य बताने वाले इस संयोजक का यह स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἐπιλάβωνται
  choice: वे ... थाम लें
  rationale: यह चयन पकड़ने या दृढ़ता से ग्रहण करने की सजीव छवि बनाए रखता है और इसे केवल ‘प्राप्त करें’ के अर्थ तक सीमित नहीं करता।
- source_word: τῆς ὄντως ζωῆς
  choice: उस जीवन को ... जो सचमुच जीवन है
  rationale: यह जीवन संज्ञा को स्पष्ट रखते हुए ὄντως के ‘वास्तव में/सचमुच’ वाले गुणात्मक बल और निहित विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: εἰς τὸ μέλλον को विशेष रूप से युगांत-संबंधी रूप देना या नहीं
  choice: आनेवाले समय के वास्ते
  alternative: आनेवाले युग के लिए
  rationale: संदर्भ में भावी और अनंत वास्तविकताओं की प्रतिध्वनि है, पर यूनानी वाक्यांश स्वयं ‘युग’ नहीं कहता; इसलिए अनिर्दिष्ट भावी दृष्टि सुरक्षित रखी गई है।
- issue: τῆς ὄντως ζωῆς में वास्तविक जीवन के विरोध को कैसे व्यक्त किया जाए
  choice: उस जीवन को ... जो सचमुच जीवन है
  alternative: सच्चे जीवन को
  rationale: चुना हुआ रूप ζωή को स्पष्ट रूप से व्यक्त करता है और धन पर आधारित प्रतीत होने वाले जीवन तथा वास्तविक जीवन के बीच निहित तनाव को सरल किए बिना बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘धन जमा’ और ‘नींव’ से मूल के मिश्रित खजाना तथा निर्माण रूपक जानबूझकर सुरक्षित हैं।
