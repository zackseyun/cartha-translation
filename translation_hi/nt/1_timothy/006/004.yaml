- source_word: ὑπόνοιαι πονηραί
  choice: बुरी शंकाएँ
  rationale: यह ὑπόνοιαι के संदेह और πονηραί के नैतिक रूप से बुरे गुण—दोनों को सीधे व्यक्त करता है।
