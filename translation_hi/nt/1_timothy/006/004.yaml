  text: वह घमंड से फूल गया है[a] और कुछ भी नहीं समझता; बल्कि वह विवादों और शब्दों की बहसों का रोगी है[b]। इन्हीं से ईर्ष्या, कलह, निंदा[c] और बुरी शंकाएँ पैदा होती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह अभिमानी हो गया है।” यूनानी में शब्दशः घमंड से सूजने या फूलने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “शब्दों पर होने वाले झगड़े” या “शब्द-विवाद।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ “निंदा” का अर्थ लोगों के विरुद्ध अपमानजनक या बदनाम करने वाली बातें हैं; दूसरे संदर्भों में इसी यूनानी शब्द का अर्थ “ईशनिंदा” हो सकता है।
