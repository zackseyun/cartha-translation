  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप रखा गया है। ‘भक्ति’ को बाहरी धार्मिकता तक सीमित न मानकर परमेश्वरमुखी जीवन के अर्थ में चुना गया है; ‘सन्तोष’ सामान्य पाठक के लिए ‘आत्मनिर्भरता’ से अधिक सन्दर्भानुकूल है।
