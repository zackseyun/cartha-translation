source:
  edition: SBLGNT
  text: οἱ δὲ βουλόμενοι πλουτεῖν ἐμπίπτουσιν εἰς πειρασμὸν καὶ παγίδα καὶ ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς, αἵτινες βυθίζουσι τοὺς ἀνθρώπους εἰς ὄλεθρον καὶ ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/009.yaml
  text: But those who want to be rich fall into temptation[a], a snare, and many foolish and harmful desires[c][b], which plunge people into ruin and destruction.
translation:
  language: hi
  text: पर जो धनवान होना चाहते हैं,[a] वे प्रलोभन, एक फंदे[b] और बहुत-सी मूर्खतापूर्ण और हानिकारक लालसाओं में पड़ते हैं, जो लोगों को विनाश और बरबादी में डुबो देती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धनी बनना चाहते हैं।” यूनानी में धनवान बनने की इच्छा का भाव भी हो सकता है, न कि केवल धनवान होने की अवस्था का।
    reason: lexical_alternative
  - marker: b
    text: या, “जाल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ βουλόμενοι πλουτεῖν
  choice: पर जो धनवान होना चाहते हैं
  rationale: यह वाक्यांश धन पाने या धनवान बनने की स्थिर इच्छा को व्यक्त करता है; सहज आधुनिक हिन्दी में यह भाव स्पष्ट रहता है।
- source_word: ἐμπίπτουσιν εἰς πειρασμὸν
  choice: परीक्षा में पड़ते हैं
  rationale: इस चेतावनी के संदर्भ में πειρασμός पाप की ओर खींचने वाली परीक्षा को दर्शाता है; ‘में पड़ते हैं’ मूल रूपक को बनाए रखता है।
- source_word: παγίδα
  choice: फंदे
  rationale: ‘फंदा’ पकड़ने वाले जाल के रूपक और उसके नैतिक आशय दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐπιθυμίας πολλὰς ἀνοήτους καὶ βλαβεράς
  choice: बहुत-सी मूर्खतापूर्ण और हानिकारक लालसाओं
  rationale: ‘लालसाएँ’ तीव्र इच्छाओं का भाव देती हैं; विशेषण उनकी विवेकहीनता और हानि पहुँचाने वाली प्रकृति को सीधे व्यक्त करते हैं।
- source_word: βυθίζουσι τοὺς ἀνθρώπους
  choice: लोगों को ... डुबो देती हैं
  rationale: ‘डुबो देती हैं’ मूल के सशक्त, कारक जल-रूपक को सुरक्षित रखता है; ἄνθρωποι यहाँ सामान्यतः मनुष्यों के लिए है।
- source_word: ὄλεθρον καὶ ἀπώλειαν
  choice: विनाश और बरबादी
  rationale: दो निकटार्थी पदों को अलग हिन्दी शब्दों से प्रस्तुत करके उनकी संयुक्त तीव्रता रखी गई है, बिना किसी एक विशिष्ट धर्मवैज्ञानिक परिणाम को अनिवार्य ठहराए।
theological_decisions:
- issue: क्या ὄλεθρον καὶ ἀπώλειαν को विशेष रूप से अनन्त दण्ड का संकेत मानकर अनुवाद किया जाए
  choice: ‘विनाश और बरबादी’—परिणाम की गंभीरता बनाए रखते हुए उसकी अवधि या अंतिम धर्मवैज्ञानिक प्रकृति निर्दिष्ट नहीं की गई
  alternative: ‘सर्वनाश और नरक’ जैसे शब्दों से अंतिम दण्ड को स्पष्ट करना
  rationale: यूनानी पद घोर विनाश को व्यक्त करते हैं, पर इस पद में अपने आप केवल अनन्त दण्ड को निश्चित नहीं करते; इसलिए मूल की व्यापकता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गंभीर और सार्वजनिक पाठ के योग्य है। ‘लोगों’ से यूनानी के सामान्य मानव-संदर्भ को व्यक्त किया गया है। सूची में हिन्दी की स्वाभाविक कारक-रचना अपनाई गई है।
