translation:
  language: hi
  text: वे भलाई करें, भले कामों में धनी बनें, उदार हों और बाँटने के लिए तत्पर रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοεργεῖν
  choice: भलाई करें
  rationale: यह सरल और स्वाभाविक क्रियात्मक अभिव्यक्ति है, जो भला करने के आदेश को बिना अनावश्यक संज्ञाकरण के व्यक्त करती है।
- source_word: πλουτεῖν
  choice: धनी बनें
  rationale: यह धन-संबंधी रूपक को बनाए रखता है और निकटवर्ती संदर्भ में भौतिक धन के साथ जानबूझकर किए गए विरोध को स्पष्ट रहने देता है।
- source_word: ἐν ἔργοις καλοῖς
  choice: भले कामों में
  rationale: यह उस क्षेत्र को बताता है जिसमें उन्हें धनी होना है; आधुनिक हिन्दी में यह सहज और सामान्य पाठकों के लिए स्पष्ट है।
- source_word: εὐμεταδότους
  choice: उदार हों
  rationale: यह अपनी संपत्ति देने या दूसरों के साथ बाँटने की तत्परता को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κοινωνικούς
  choice: बाँटने के लिए तत्पर रहें
  rationale: यह दूसरों के साथ अपनी वस्तुएँ साझा करने की प्रवृत्ति और इच्छा को व्यक्त करता है तथा आधुनिक हिन्दी में संभावित रूप से अस्पष्ट ‘सहभागी’ से अधिक स्पष्ट है।
- source_word: εὐμεταδότους εἶναι, κοινωνικούς
  choice: उदार हों और बाँटने के लिए तत्पर रहें
  rationale: 'दोनों निकटवर्ती पर अलग बलों को बनाए रखा गया है: पहला देने में उदारता पर, दूसरा साझा करने की तत्पर प्रवृत्ति पर बल देता है।'
