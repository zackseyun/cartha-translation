  text: मैं तुम्हें उस परमेश्वर के सामने, जो सबको जीवन देता है[a], और मसीह यीशु के सामने यह गंभीर आज्ञा देता हूँ—जिसने पुन्तियुस पिलातुस के सामने[b] उस उत्तम अंगीकार की गवाही दी[c]—
