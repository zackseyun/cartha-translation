lexical_decisions:
- source_word: παραγγέλλω
  choice: मैं तुम्हें … यह गंभीर आज्ञा देता हूँ
  rationale: क्रिया एक औपचारिक और गंभीर आदेश प्रकट करती है। ‘गंभीर आज्ञा देता हूँ’ आधुनिक हिन्दी में उस भार को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐνώπιον
  choice: के सामने
  rationale: यह परमेश्वर और मसीह यीशु की उपस्थिति में दिए जा रहे गंभीर आदेश का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ζῳογονοῦντος τὰ πάντα
  choice: जो सबको जीवन देता है
  rationale: यह सरल हिन्दी यूनानी कृदंत के व्यापक जीवनदायी अर्थ को रखती है; ‘जीवित रखता है’ की सम्भावना पादटिप्पणी में दी गई है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: ‘मसीह’ Χριστός के अभिषिक्त राजा वाले उपाधिगत अर्थ को हिन्दी में स्पष्ट और प्रचलित रूप से व्यक्त करता है।
- source_word: μαρτυρήσαντος
  choice: गवाही दी
  rationale: यह न्यायिक और सार्वजनिक साक्ष्य के भाव को बनाए रखता है।
- source_word: ἐπὶ Ποντίου Πιλάτου
  choice: पुन्तियुस पीलातुस के सामने
  rationale: मुकदमे के प्रसंग में यह सम्भवतः पीलातुस की उपस्थिति में दी गई गवाही को दर्शाता है; कालगत अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τὴν καλὴν ὁμολογίαν
  choice: उत्तम अंगीकार
  rationale: ‘अंगीकार’ सार्वजनिक स्वीकृति/घोषणा का धार्मिक और सामान्य दोनों भाव रखता है, और ‘उत्तम’ καλὴν को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: ζῳογονοῦντος का अर्थ
  choice: जो सबको जीवन देता है
  alternative: जो सबको जीवित रखता है; जो सबको जिलाता है
  rationale: यूनानी शब्द जीवन प्रदान करने और जीवन सुरक्षित रखने, दोनों पर बल दे सकता है। मुख्य पाठ व्यापक जीवनदायी भाव रखता है और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: यहाँ Χριστός की उपाधिगत शक्ति बनी हुई है; ‘मसीह’ उसका अर्थ हिन्दी पाठक के लिए अधिक स्पष्ट रखता है।
- issue: ἐπὶ Ποντίου Πιλάτου का सम्बन्ध
  choice: पुन्तियुस पीलातुस के सामने
  alternative: पुन्तियुस पीलातुस के समय में; पुन्तियुस पीलातुस के अधीन
  rationale: वाक्य और मुकदमे का ज्ञात प्रसंग ‘सामने’ का समर्थन करते हैं, पर यूनानी पूर्वसर्ग काल या शासनाधीनता भी व्यक्त कर सकता है।
- issue: μαρτυρήσαντος और ὁμολογίαν का सम्बन्ध
  choice: उत्तम अंगीकार की गवाही दी
  alternative: उत्तम अंगीकार किया
  rationale: मुख्य पाठ ‘गवाही देना’ और ‘अंगीकार’ दोनों शब्दगत तत्वों को बनाए रखता है। अधिक संक्षिप्त वैकल्पिक हिन्दी सम्भव है, पर उसमें μαρτυρέω का साक्ष्य-भाव कम स्पष्ट होता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘गंभीर आज्ञा’ मूल क्रिया की औपचारिकता व्यक्त करती है। पद का वाक्य अगले पद में जारी रहता है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
