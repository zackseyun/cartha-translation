  text: ὁ μόνος ἔχων ἀθανασίαν, φῶς οἰκῶν ἀπρόσιτον, ὃν εἶδεν οὐδεὶς ἀνθρώπων οὐδὲ ἰδεῖν δύναται· ᾧ τιμὴ καὶ κράτος αἰώνιον· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/016.yaml
  text: who alone has immortality[a], dwelling in unapproachable light, whom no one among men has seen nor is able to see. To him be honor and eternal dominion[b]. Amen.
translation:
  language: hi
  text: केवल उसी के पास अमरता है; वह अगम्य ज्योति में निवास करता है। उसे मनुष्यों में से किसी ने नहीं देखा, और न कोई उसे देख सकता है।[a] उसी का आदर और अनन्त प्रभुत्व हो।[b] आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी मानव ने उसे नहीं देखा और न कोई उसे देख सकता है।”
    reason: lexical_alternative
  - marker: b
    text: व्यापक प्रसंग में कुछ लोग इस वर्णन और स्तुति को अधिक सीधे प्रभु यीशु मसीह से सम्बन्धित समझते हैं; फिर भी किसी मनुष्य द्वारा उसे न देखे जाने और न देख सकने की भाषा सबसे स्वाभाविक रूप से परमेश्वर की ओर संकेत करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ μόνος ἔχων ἀθανασίαν
  choice: केवल वही अमर है
  rationale: शाब्दिक रूप ‘केवल वही अमरता रखता है’ हिन्दी में अस्वाभाविक है। यह रूप μόνος की विशिष्टता और ἔχων ἀθανασίαν के इस दावे—कि अमरता उसी की अपनी विशेषता है—को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φῶς οἰκῶν ἀπρόσιτον
  choice: अगम्य ज्योति में निवास करता है
  rationale: ‘अगम्य’ ἀπρόσιτον के निकट है और बताता है कि उस ज्योति तक पहुँचा नहीं जा सकता; ‘ज्योति’ तथा ‘निवास करता है’ गरिमापूर्ण और परिचित धार्मिक हिन्दी हैं।
- source_word: οὐδεὶς ἀνθρώπων
  choice: मनुष्यों में से किसी ने नहीं
  rationale: यह ἀνθρώπων की अंशवाचक संबंध-कारक रचना को स्पष्ट रूप से बनाए रखता है और समस्त मानवजाति को समाविष्ट करता है।
- source_word: οὐδὲ ἰδεῖν δύναται
  choice: और न कोई देख सकता है
  rationale: δύναται में निहित असमर्थता को स्पष्ट रखता है और हिन्दी में स्वाभाविक है।
- source_word: τιμὴ καὶ κράτος αἰώνιον
  choice: आदर और अनन्त प्रभुत्व
  rationale: ‘आदर’ τιμή का सीधा अर्थ देता है; स्तुतिवाचक प्रसंग में ‘प्रभुत्व’ κράτος को केवल सामर्थ्य नहीं, बल्कि प्रभावी शासकीय अधिकार के रूप में व्यक्त करता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: हिन्दी मसीही प्रयोग में प्रचलित मानक लिप्यंतरण।
theological_decisions:
- issue: सम्बन्धवाचक वर्णन और स्तुति किसके लिए हैं
  choice: मुख्य पाठ में सर्वनामों को ऐसा रखा गया है कि पूर्ववर्ती प्रसंग में वर्णित परमेश्वर की ओर स्वाभाविक संकेत बना रहे
  alternative: व्यापक वाक्य के निकटवर्ती उल्लेख के कारण कुछ पाठक इसे प्रभु यीशु मसीह से अधिक सीधे जोड़ते हैं
  rationale: किसी मनुष्य द्वारा न देखे जाने और न देख सकने की भाषा परमेश्वर की ओर सबसे स्वाभाविक संकेत करती है; फिर भी यूनानी वाक्य के व्यापक सन्दर्भ में उपस्थित वैकल्पिक सम्बन्ध को पादटिप्पणी में सुरक्षित रखा गया है, न कि मुख्य पाठ में निर्णायक रूप से मिटाया गया है।
- issue: ἀνθρώπων का प्रतिनिधिक अर्थ
  choice: मनुष्यों में से किसी ने नहीं
  alternative: किसी मानव ने नहीं / किसी मनुष्य ने नहीं
  rationale: यह यूनानी अंशवाचक रचना को बनाए रखते हुए स्पष्ट करता है कि कथन सभी मनुष्यों के विषय में है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अगम्य ज्योति’, ‘निवास’ और ‘अनन्त प्रभुत्व’ जैसे पद धार्मिक ऊँचाई बनाए रखते हैं, पर वाक्य-संरचना साधारण पाठक के लिए स्पष्ट है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘immortality’ के बाद था, जबकि उसकी टिप्पणी देखने वाले मनुष्यों की अभिव्यक्ति से सम्बन्धित थी; हिन्दी प्रारूप में चिह्न को अर्थानुसार सही स्थान पर रखा गया है।
