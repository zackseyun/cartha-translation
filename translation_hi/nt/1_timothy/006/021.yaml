lexical_decisions:
- source_word: ἥν
  choice: जिसका
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम पिछले पद के ‘झूठे नाम का ज्ञान’ की ओर संकेत करता है; हिंदी में ‘जिसका दावा करके’ उस संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐπαγγελλόμενοι
  choice: दावा करके
  rationale: इस मध्यमवाच्य कृदन्त का अर्थ यहाँ वादा करना नहीं, बल्कि उस कथित ज्ञान को अपना बताना या उसका दावा करना है।
- source_word: περὶ τὴν πίστιν
  choice: विश्वास के विषय में
  rationale: περί के संबंधसूचक अर्थ को स्पष्ट रखता है और यह नहीं बताता कि वे विश्वास से पूर्णतः बाहर हो गए।
- source_word: ἠστόχησαν
  choice: लक्ष्य से भटक गए हैं
  rationale: ἀστοχέω में निहित लक्ष्य चूकने की छवि को सहज आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: Ἡ χάρις
  choice: अनुग्रह
  rationale: पौलुस के पत्रात्मक आशीर्वचन में χάρις के लिए प्रचलित, गरिमापूर्ण और धर्मवैज्ञानिक रूप से उपयुक्त शब्द।
- source_word: μεθ’ ὑμῶν
  choice: तुम सबके साथ रहे
  rationale: ὑμῶν बहुवचन है; ‘तुम सबके’ इसे हिंदी में स्पष्ट करता है, और सूत्रवाक्य की स्वाभाविक पूर्णता के लिए ‘रहे’ जोड़ा गया है।
theological_decisions:
- issue: τὴν πίστιν का आशय
  choice: मुख्य पाठ में ‘विश्वास’ रखा गया है, जो संदर्भ में मसीही विश्वास की शिक्षा और अंगीकार की ओर संकेत कर सकता है।
  alternative: व्यक्तिगत भरोसा या विश्वास
  rationale: पासबानी पत्रों और झूठे ज्ञान के निकट संदर्भ में सामूहिक मसीही विश्वास अधिक संभावित है; फिर भी हिंदी शब्द ‘विश्वास’ मूल की संभावित व्यापकता को पूरी तरह बंद नहीं करता।
- issue: अंतिम आशीर्वचन के श्रोता
  choice: बहुवचन को ‘तुम सबके’ द्वारा स्पष्ट रखा गया है।
  alternative: केवल तीमुथियुस को संबोधित एकवचन
  rationale: यूनानी ὑμῶν स्पष्ट रूप से बहुवचन है और संभवतः पत्र से जुड़ी व्यापक विश्वासी मंडली को भी सम्मिलित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण पत्रात्मक शैली। ‘दावा करके’ सामान्य पाठक के लिए सहज है, जबकि ‘लक्ष्य से भटक गए’ मूल क्रिया की रूपकात्मक शक्ति बनाए रखता है। मुख्य पाठ में बहुवचन ‘तुम सबके’ स्पष्ट किया गया है।
