source:
  edition: SBLGNT
  text: Ὅσοι εἰσὶν ὑπὸ ζυγὸν δοῦλοι, τοὺς ἰδίους δεσπότας πάσης τιμῆς ἀξίους ἡγείσθωσαν, ἵνα μὴ τὸ ὄνομα τοῦ θεοῦ καὶ ἡ διδασκαλία βλασφημῆται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/001.yaml
  text: All who are servants under a yoke should regard their own masters as worthy of all honor[c][b][a], so that the name of God and the teaching may not be slandered.
translation:
  language: hi
  text: जुए के अधीन रहने वाले सभी दास[a] अपने स्वामियों को हर प्रकार के सम्मान के योग्य मानें, ताकि परमेश्वर के नाम और शिक्षा[b] की निन्दा न हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सेवक’ या ‘बंधुआ सेवक’; यूनानी δοῦλοι। ‘जुए के अधीन’ वाक्यांश बंधन की अवस्था को स्पष्ट करता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘सिद्धान्त’।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अपमानजनक बातें न कही जाएँ’; परमेश्वर के नाम के संदर्भ में, ‘ईशनिन्दा न हो’।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοῦλοι
  choice: दासता के जुए के नीचे हैं
  rationale: δοῦλοι को ὑπὸ ζυγόν के साथ व्यक्त करते हुए बंधन की वास्तविक अवस्था स्पष्ट की गई है। हिंदी में केवल ‘दास’ की तुलना में यह संयुक्त अभिव्यक्ति मूल रूपक और सामाजिक स्थिति दोनों को स्वाभाविक ढंग से सामने लाती है।
- source_word: ὑπὸ ζυγὸν
  choice: जुए के नीचे
  rationale: मूल यूनानी के अधीनता-सूचक रूपक को बनाए रखता है; ‘जुआ’ हिंदी बाइबिलीय और सामान्य साहित्यिक प्रयोग में समझने योग्य है।
- source_word: τοὺς ἰδίους δεσπότας
  choice: अपने-अपने स्वामियों को
  rationale: ἰδίους की निजी/संबंधित स्वामियों की भावना ‘अपने-अपने’ से स्पष्ट होती है, और δεσπότας के घरेलू अधिकार-संबंध के लिए ‘स्वामी’ स्वाभाविक है।
- source_word: πάσης τιμῆς ἀξίους
  choice: पूरे सम्मान के योग्य
  rationale: πάσης की व्यापकता और ἀξίους की मूल्यांकन-संबंधी भावना को सरल, आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἡγείσθωσαν
  choice: समझें
  rationale: वर्तमान आज्ञार्थक का निरंतर मानने/आंकने का भाव संक्षिप्त और स्वाभाविक हिंदी में देता है।
- source_word: τὸ ὄνομα τοῦ θεοῦ
  choice: परमेश्वर के नाम
  rationale: मूल की प्रचलित बाइबिलीय अभिव्यक्ति को सीधे सुरक्षित रखता है।
- source_word: ἡ διδασκαλία
  choice: शिक्षा
  rationale: διδασκαλία के लिए सहज आधुनिक हिंदी; ‘सिद्धान्त’ की अपेक्षा कम तकनीकी है और यहाँ मसीही संदेश/शिक्षण के व्यापक अर्थ को बनाए रखता है।
- source_word: βλασφημῆται
  choice: निन्दा न हो
  rationale: निष्क्रिय रूप और परमेश्वर के नाम तथा शिक्षा—दोनों के विरुद्ध अपमानजनक कथन का अर्थ हिंदी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: Ὅσοι εἰσὶν
  choice: जितने लोग ... हैं
  rationale: ὅσοι की समावेशी व्यापकता को औपचारिक किंतु सुबोध हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: δοῦλοι और ὑπὸ ζυγόν का सामाजिक रूप से संवेदनशील चित्रण
  choice: दासता के जुए के नीचे
  alternative: सेवक; दास; बंधुआ सेवक
  rationale: पाठ जिस बंधनकारी सामाजिक अवस्था को मानकर चलता है उसे न तो नरम किया गया है, न उसका समर्थन जोड़ा गया है। ‘दासता’ और ‘जुआ’ साथ मिलकर मूल की कठोर वास्तविकता स्पष्ट रखते हैं।
- issue: διδασκαλία का अनुवाद
  choice: शिक्षा
  alternative: सिद्धान्त
  rationale: यहाँ शब्द मसीही शिक्षण की सार्वजनिक प्रतिष्ठा से संबंधित है। ‘शिक्षा’ अर्थ को सुरक्षित रखते हुए बाद की तकनीकी धर्मवैज्ञानिक ध्वनि अनावश्यक रूप से नहीं जोड़ता।
- issue: βλασφημῆται का अनुवाद
  choice: निन्दा न हो
  alternative: ईशनिन्दा न हो; बदनामी न हो
  rationale: एक ही क्रिया परमेश्वर के नाम और शिक्षा दोनों पर लागू है। ‘निन्दा’ दोनों के साथ स्वाभाविक है, जबकि ‘ईशनिन्दा’ शिक्षा के साथ संकीर्ण और ‘बदनामी’ मूल की अपमानजनक वाणी की तीव्रता में कमजोर हो सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘जितने लोग’ और ‘योग्य समझें’ मूल की आज्ञार्थक तथा मूल्यांकन-संबंधी संरचना के निकट हैं। फुटनोट चिह्न मुख्य पाठ में संबंधित अंतिम कथन के बाद क्रम से दिए गए हैं।
