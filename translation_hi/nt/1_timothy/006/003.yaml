- from: यदि कोई अलग शिक्षा देता है और खरी बातों को—अर्थात हमारे प्रभु यीशु मसीह की बातों को—तथा उस शिक्षा को नहीं मानता जो भक्ति के अनुरूप है,
  to: यदि कोई भिन्न शिक्षा देता है और हमारे प्रभु यीशु मसीह के हितकारी वचनों तथा उस शिक्षा को स्वीकार नहीं करता जो भक्ति के अनुरूप है,
  rationale: The revision retains the Greek syntax and the open-ended comma while rendering ὑγιαίνουσι λόγοις with a more fitting modern-Hindi expression. It also expresses τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ directly as “हमारे प्रभु यीशु मसीह के … वचनों,” without narrowing the words to recorded quotations or adding an interpretive connector.
