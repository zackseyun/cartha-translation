id: 1TI.6.3
reference: 1 Timothy 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἴ τις ἑτεροδιδασκαλεῖ καὶ μὴ προσέρχεται ὑγιαίνουσι λόγοις, τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, καὶ τῇ κατ’ εὐσέβειαν διδασκαλίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/003.yaml
  text: If anyone teaches a different doctrine and does not agree with sound words[a], those of our Lord Jesus the Messiah, and with the teaching that accords with godliness[b],
translation:
  language: hi
  text: यदि कोई भिन्न शिक्षा देता है और हमारे प्रभु यीशु मसीह के हितकारी वचनों तथा उस शिक्षा को स्वीकार नहीं करता जो भक्ति के अनुरूप है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑτεροδιδασκαλεῖ
  choice: अलग शिक्षा देता है
  rationale: यह क्रिया स्वीकृत शिक्षा से भिन्न बात सिखाने को दर्शाती है। ‘अलग शिक्षा’ मूल के भिन्नता-बोध को रखती है और ‘झूठी’ जैसा स्पष्ट मूल्यांकन नहीं जोड़ती।
- source_word: προσέρχεται
  choice: मानता
  rationale: दत्तिव के साथ यहाँ इसका भाव किसी शिक्षा को स्वीकार करने या उससे सहमत होने का है। ‘मानता’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: ὑγιαίνουσι λόγοις
  choice: खरी बातों
  rationale: ὑγιαίνω का रूपक सिद्ध और हितकर शिक्षा की स्वस्थता बताता है। ‘खरी’ हिन्दी में सत्य, दोषरहित और विश्वसनीय होने का भाव देती है, जबकि λόγοις के ‘बातों/वचनों’ अर्थ को भी बनाए रखा गया है।
- source_word: τοῖς τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: अर्थात हमारे प्रभु यीशु मसीह की बातों
  rationale: यूनानी पदबंध पिछली ‘खरी बातों’ की पहचान प्रभु यीशु मसीह से संबंधित या उनसे निकली बातों के रूप में करता है। ‘अर्थात’ इस समानाधिकरण को हिन्दी में स्पष्ट करता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: हिन्दी बाइबलीय प्रयोग में ‘मसीह’ Χριστός के अभिषिक्त/मसीहाई पदनाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατ’ εὐσέβειαν
  choice: जो भक्ति के अनुरूप है
  rationale: κατά यहाँ अनुरूपता या सामंजस्य व्यक्त करता है। यह अनुवाद शिक्षा और परमेश्वर-केंद्रित जीवन के संबंध को रखता है, बिना यह निश्चित किए कि शिक्षा भक्ति उत्पन्न करती है।
- source_word: διδασκαλίᾳ
  choice: शिक्षा
  rationale: यहाँ शब्द सिखाई जाने वाली विषयवस्तु को दर्शाता है; ‘शिक्षा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: εὐσέβειαν
  choice: भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धापूर्ण, समर्पित जीवन को दर्शाता है। ‘भक्ति’ सामान्य आधुनिक हिन्दी में सुबोध है और केवल बाहरी धार्मिकता तक सीमित नहीं है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट / यीशु अभिषिक्त
  rationale: ‘मसीह’ हिन्दी में स्थापित पदनाम है और Χριστός की मसीहाई उपाधि को बनाए रखता है; इसे केवल निजी नाम मानकर अस्पष्ट नहीं किया गया।
- issue: κατ’ εὐσέβειαν में शिक्षा और भक्ति का संबंध
  choice: भक्ति के अनुरूप
  alternative: भक्ति की ओर ले जाने वाली
  rationale: मूल में κατά मुख्यतः अनुरूपता व्यक्त करता है। कारणात्मक अर्थ संभव संदर्भगत निष्कर्ष हो सकता है, पर उसे मुख्य पाठ में जोड़ना मूल से अधिक विशिष्ट होता।
- issue: प्रभु यीशु मसीह की ‘बातों’ का संबंध
  choice: खरी बातों की व्याख्या के रूप में ‘अर्थात’
  alternative: हमारे प्रभु यीशु मसीह से संबंधित खरी बातें
  rationale: यूनानी लेखयुक्त पदबंध समानाधिकरण के रूप में पढ़ा जा सकता है; अनुवाद इसे स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि संबंध को केवल प्रत्यक्ष उद्धरणों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप। वाक्य अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है। ‘खरी बातें’ मूल के स्वास्थ्य-रूपक का शाब्दिक पुनरुत्पादन नहीं करती, पर हिन्दी में doctrinal soundness का स्वाभाविक अर्थ देती है; ‘भक्ति’ को परमेश्वर-केंद्रित जीवन के व्यापक अर्थ में लिया गया है।
