id: 1TI.6.5
reference: 1 Timothy 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διαπαρατριβαὶ διεφθαρμένων ἀνθρώπων τὸν νοῦν καὶ ἀπεστερημένων τῆς ἀληθείας, νομιζόντων πορισμὸν εἶναι τὴν ⸀εὐσέβειαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/005.yaml
  text: constant friction among people whose minds are corrupted and who have been deprived of the truth[b][a], imagining that godliness is a means of gain.
translation:
  language: hi
  text: और ऐसे लोगों के बीच लगातार टकराव होते हैं[a], जिनकी बुद्धि भ्रष्ट हो चुकी है और जो सत्य से वंचित हो चुके हैं। वे समझते हैं कि ईश्वर-भक्ति लाभ कमाने का साधन है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लगातार झगड़े” अथवा “निरंतर रगड़-झगड़।” यूनानी शब्द में बार-बार एक-दूसरे से रगड़ खाने की छवि है।
    reason: lexical_alternative
  - marker: b
    text: या, “ईश्वर-भक्ति लाभ है” अथवा “लाभ का स्रोत है।” आशय यह है कि वे भक्ति को अपने फायदे के लिए इस्तेमाल करने की वस्तु मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαπαρατριβαὶ
  choice: लगातार टकराव
  rationale: यह दुर्लभ यूनानी संज्ञा बार-बार एक-दूसरे से रगड़ खाने की छवि के द्वारा निरंतर विवाद या घर्षण को व्यक्त करती है। ‘लगातार टकराव’ आधुनिक हिन्दी में स्वाभाविक है और उस निरंतर पारस्परिक संघर्ष को बनाए रखता है।
- source_word: διεφθαρμένων
  choice: भ्रष्ट हो चुकी है
  rationale: पूर्णकालिक कर्मवाच्य कृदंत भ्रष्ट किए जाने से उत्पन्न स्थायी दशा बताता है। यह रूप नैतिक और बौद्धिक बिगाड़ को व्यक्त करता है, पर अर्थ को ‘पूर्णतः दुष्ट’ जैसे अधिक तीखे शब्दों से नहीं बढ़ाता।
- source_word: τὸν νοῦν
  choice: बुद्धि
  rationale: νοῦς यहाँ सोचने-समझने की नैतिक-बौद्धिक क्षमता को दर्शाता है। ‘बुद्धि’ हिन्दी में संक्षिप्त और सहज है; सम्बन्धवाचक रचना ‘जिनकी बुद्धि’ यूनानी के प्रत्येक व्यक्ति पर लागू एकवचन भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀπεστερημένων
  choice: वंचित हो चुके हैं
  rationale: पूर्णकालिक कर्मवाच्य कृदंत ऐसी हानि के परिणामस्वरूप बनी हुई दशा को बताता है। ‘वंचित हो चुके हैं’ उस निष्क्रियता और वर्तमान परिणाम दोनों को बनाए रखता है, बिना किसी अनकहे कर्ता की पहचान किए।
- source_word: τῆς ἀληθείας
  choice: सत्य
  rationale: सन्दर्भ में यह निश्चित सत्य की ओर संकेत करता है। हिन्दी में ‘सत्य से वंचित’ स्वाभाविक रूप से निश्चित अर्थ देता है; अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: νομιζόντων
  choice: समझते हैं
  rationale: यह कृदंत उनकी गलत धारणा बताता है। हिन्दी में ‘समझते हैं’ सहज है और सन्दर्भ स्वयं उस धारणा के भ्रमपूर्ण होने को स्पष्ट करता है।
- source_word: πορισμὸν
  choice: लाभ कमाने का साधन
  rationale: πορισμός लाभ, कमाई या उसे प्राप्त करने के साधन को व्यक्त कर सकता है। यह चुनाव ईश्वर-भक्ति को स्वार्थपूर्ण लाभ के लिए इस्तेमाल करने का भाव स्पष्ट करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εὐσέβειαν
  choice: ईश्वर-भक्ति
  rationale: इस पत्र में εὐσέβεια परमेश्वर की ओर उन्मुख श्रद्धापूर्ण जीवन को दर्शाता है। ‘ईश्वर-भक्ति’ सामान्य आधुनिक हिन्दी में स्पष्ट है और इसे केवल बाहरी धार्मिक रीति तक सीमित नहीं करता।
theological_decisions:
- issue: क्या εὐσέβεια को सच्ची भक्ति के रूप में रखा जाए या केवल बाहरी धर्म के रूप में
  choice: ईश्वर-भक्ति
  alternative: धर्म या धार्मिकता
  rationale: यूनानी शब्द अपने आप में सकारात्मक है; दोष ईश्वर-भक्ति में नहीं, बल्कि उसे लाभ का साधन मानने वाले लोगों की दृष्टि में है। इसलिए अनुवाद शब्द को नकारात्मक नहीं बनाता।
- issue: διεφθαρμένων की नैतिक तीव्रता
  choice: जिनकी बुद्धि भ्रष्ट हो चुकी है
  alternative: जो बुद्धि से दुष्ट या पतित हैं
  rationale: पद कठोर नैतिक निर्णय देता है, किन्तु ‘भ्रष्ट’ मूल के बल को पर्याप्त रूप से व्यक्त करता है और बाद की किसी विशिष्ट धर्मवैज्ञानिक धारणा को पाठ में नहीं जोड़ता।
- issue: सत्य से वंचित होने में कर्ता की पहचान
  choice: जो सत्य से वंचित हो चुके हैं
  alternative: जिनसे सत्य छीन लिया गया है
  rationale: यूनानी कर्मवाच्य है, पर वंचित करने वाले की पहचान नहीं करता। हिन्दी रूप उसी अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लगातार टकराव’ दुर्लभ यूनानी शब्द की घर्षण-संबंधी छवि को अत्यधिक शाब्दिक हुए बिना व्यक्त करता है। ‘ईश्वर-भक्ति’ धार्मिक शब्दावली में परिचित है, जबकि ‘लाभ कमाने का साधन’ इस पद में निहित स्वार्थपूर्ण उपयोग को स्पष्ट करता है।
