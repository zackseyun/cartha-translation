source:
  edition: SBLGNT
  text: τηρῆσαί σε τὴν ἐντολὴν ἄσπιλον ἀνεπίλημπτον μέχρι τῆς ἐπιφανείας τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/006/014.yaml
  text: that you keep the commandment unstained and above reproach until the appearing of our Lord Jesus the Messiah[c][b][a],
translation:
  language: hi
  text: कि तुम हमारे प्रभु यीशु मसीह के प्रकट होने तक इस आज्ञा को निष्कलंक और निर्दोष रखो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीष्ट” या “यीशु क्राइस्ट।” यूनानी उपाधि Χριστός का अर्थ “मसीह” है, पर यह परंपरागत रूप से नाम-जैसे “ख्रीष्ट/क्राइस्ट” के रूप में भी प्रयुक्त होती है।
    reason: alternative_reading
  - marker: b
    text: “निष्कलंक” और “निर्दोष” सीधे “आज्ञा” का वर्णन कर सकते हैं; संक्षिप्त यूनानी वाक्यरचना में इन्हें तीमुथियुस के आज्ञा-पालन के ढंग से भी संबंधित समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τηρῆσαί
  choice: बनाए रखो
  rationale: यह क्रिया पिछली आयत में दी गई गंभीर आज्ञा पर निर्भर है और आज्ञा का विश्वासयोग्यता से पालन करते रहने का भाव देती है। विशेषणों के साथ ‘निष्कलंक और अनिन्दनीय बनाए रखो’ स्वाभाविक हिन्दी है।
- source_word: τὴν ἐντολὴν
  choice: इस आज्ञा को
  rationale: निश्चित एकवचन संज्ञा प्रसंग में अभी दिए गए निर्देश की ओर संकेत करती है। हिन्दी में ‘इस’ उस प्रसंगगत निश्चितता को सहज रूप से व्यक्त करता है।
- source_word: ἄσπιλον
  choice: निष्कलंक
  rationale: शब्द का मूल भाव दाग या कलंक से रहित होना है। ‘निष्कलंक’ संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में बोधगम्य है।
- source_word: ἀνεπίλημπτον
  choice: अनिन्दनीय
  rationale: अर्थ है ऐसा जिस पर उचित रूप से दोष न लगाया जा सके। ‘अनिन्दनीय’ इस भाव को संक्षेप में व्यक्त करता है और ‘निष्कलंक’ से अलग उसकी प्रतिष्ठागत छाया बनाए रखता है।
- source_word: μέχρι τῆς ἐπιφανείας
  choice: प्रकट होने तक
  rationale: μέχρι समय की सीमा बताता है और ἐπιφάνεια यहाँ भविष्य में यीशु के दृश्य प्रकट होने को सूचित करता है। ‘फिर से’ नहीं जोड़ा गया, क्योंकि वह यूनानी संज्ञा में स्पष्ट नहीं है।
- source_word: τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह के
  rationale: κύριος को मसीही उपाधि ‘प्रभु’ और Χριστός को उसके उपाधिगत अर्थ में ‘मसीह’ किया गया है। हिन्दी में ‘यीशु मसीह’ स्वाभाविक है; यूनानी लेख का अलग हिन्दी लेख जोड़ना आवश्यक नहीं।
theological_decisions:
- issue: ἄσπιλον और ἀνεπίλημπτον का संबंध
  choice: मुख्य पाठ में दोनों विशेषण ‘आज्ञा’ के साथ रखे गए हैं
  alternative: इन्हें तीमुथियुस द्वारा आज्ञा के पालन करने के ढंग या उसकी व्यक्तिगत दशा से संबंधित समझना
  rationale: यूनानी में दोनों विशेषण कर्मकारक एकवचन स्त्रीलिंग में ἐντολήν के अनुरूप हैं, पर संक्षिप्त रचना इस बात को खुला छोड़ती है कि आज्ञा स्वयं वर्णित है या उसे निष्कलंक ढंग से निभाना। मुख्य हिन्दी वाक्य व्याकरणिक संबंध रखता है और पादटिप्पणी व्यापक अर्थ-संभावना बताती है।
- issue: Ἰησοῦ Χριστοῦ में Χριστός का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट / यीशु क्राइस्ट
  rationale: इस गंभीर अंतकालीन अभिव्यक्ति में Χριστός की उपाधिगत शक्ति सुनाई देती है। ‘मसीह’ आधुनिक हिन्दी में अर्थपूर्ण और प्रचलित रूप है तथा किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु साधारण पाठक के लिए सुबोध रखी गई है। ‘इस आज्ञा’ प्रसंगगत निश्चितता व्यक्त करता है; ‘प्रकट होने’ में मूल से अतिरिक्त ‘फिर से’ नहीं जोड़ा गया।
