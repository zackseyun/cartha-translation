source:
  edition: SBLGNT
  text: Τὸ δὲ πνεῦμα ῥητῶς λέγει ὅτι ἐν ὑστέροις καιροῖς ἀποστήσονταί τινες τῆς πίστεως, προσέχοντες πνεύμασι πλάνοις καὶ διδασκαλίαις δαιμονίων
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/001.yaml
  text: The Spirit explicitly says that in later times some will depart from the faith[a], paying attention to deceitful spirits and teachings of demons[c][b],
translation:
  language: hi
  text: और आत्मा स्पष्ट रूप से कहता है कि आनेवाले समयों[b] में कुछ लोग भरमाने वाली आत्माओं[a] और दुष्टात्माओं की शिक्षाओं पर ध्यान देते हुए विश्वास से दूर हो जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धोखा देने वाली आत्माएँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “अंतिम समयों में।”
    reason: lexical_alternative
  - marker: c
    text: या, “विश्वास से फिर जाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ ... πνεῦμα
  choice: आत्मा
  rationale: सवर्ण पद और पौलुस के संदर्भ में इसका संकेत सबसे स्वाभाविक रूप से पवित्र आत्मा की ओर है। फिर भी मूल यूनानी में विशेषण ‘पवित्र’ नहीं है, इसलिए ‘आत्मा’ मूल की अभिव्यक्ति को निकटता से रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन से हल्का संक्रमण या विरोध दिखाता है; ‘परन्तु’ संबंध को स्पष्ट रखता है, बिना किसी कालसूचक ‘अब’ को जोड़ने के।
- source_word: ῥητῶς
  choice: स्पष्ट रूप से
  rationale: यह क्रिया-विशेषण किसी बात के साफ़ और असंदिग्ध ढंग से कहे जाने को व्यक्त करता है।
- source_word: ἐν ὑστέροις καιροῖς
  choice: बाद के समयों में
  rationale: वाक्यांश लेखक के वर्तमान के बाद आने वाले कालों को दर्शाता है; इसे केवल अंतिम युग की तकनीकी संज्ञा नहीं बनाया गया।
- source_word: ἀποστήσονταί
  choice: दूर हो जाएँगे
  rationale: क्रिया अलग हो जाने, हट जाने या विमुख होने को व्यक्त करती है। यह चयन भाव को रखता है, पर किसी व्यवस्थित धर्मवैज्ञानिक निष्कर्ष को नहीं जोड़ता।
- source_word: τῆς πίστεως
  choice: विश्वास से
  rationale: संदर्भ में यह मसीही विश्वास की विषयवस्तु की ओर संकेत कर सकता है, जबकि हिन्दी ‘विश्वास’ मूल शब्द की व्यक्तिगत भरोसे और स्वीकृत विश्वास—दोनों की अर्थ-सीमा को खुला रखता है।
- source_word: προσέχοντες
  choice: पर ध्यान देते हुए
  rationale: कृदंत बताता है कि वे किन बातों की ओर लगे रहने या उन्हें मानने के साथ विश्वास से दूर होंगे।
- source_word: πνεύμασι πλάνοις
  choice: भरमाने वाली आत्माओं
  rationale: πλάνος का सक्रिय अर्थ दूसरों को भटका या भरमा देने वाला है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: διδασκαλίαις δαιμονίων
  choice: दुष्टात्माओं की शिक्षाओं
  rationale: षष्ठी को स्रोत या संबंध के रूप में खुला रखा गया है—ऐसी शिक्षाएँ जो दुष्टात्माओं से आती हैं या उनसे संबद्ध हैं।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्रेत संदर्भ
  choice: संदर्भतः पवित्र आत्मा, पाठ में ‘आत्मा’
  alternative: ‘पवित्र आत्मा’ को स्पष्ट रूप से लिखना; कोई भविष्यद्वक्ता आत्मा; मनुष्य की आत्मा
  rationale: लेख के साथ प्रयोग और भविष्यसूचक कथन पौलुस के संदर्भ में पवित्र आत्मा को सबसे संभावित बनाते हैं। किंतु मूल में ‘पवित्र’ विशेषण नहीं होने के कारण मुख्य पाठ स्रोत की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- issue: ‘विश्वास’ का आशय
  choice: प्रमुखतः मसीही विश्वास की विषयवस्तु, पर हिन्दी अभिव्यक्ति में अर्थ-सीमा खुली
  alternative: व्यक्तिगत भरोसा; विश्वासयोग्यता
  rationale: लेखयुक्त τῆς πίστεως और झूठी शिक्षा का संदर्भ वस्तुगत अर्थ का समर्थन करते हैं, फिर भी अनुवाद किसी विशेष मत की धर्मत्याग-संबंधी व्याख्या नहीं थोपता।
- issue: दुष्टात्माओं और शिक्षाओं के बीच संबंध
  choice: ‘दुष्टात्माओं की शिक्षाएँ’
  alternative: दुष्टात्माओं द्वारा दी गई शिक्षाएँ; दुष्टात्मिक शिक्षाएँ
  rationale: सरल षष्ठी मूल की स्रोत अथवा संबंध-संबंधी गुंजाइश बचाती है और अनावश्यक रूप से सटीक कारण नहीं ठहराती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘स्पष्ट रूप से’, ‘बाद के समयों’ और ‘पर ध्यान देते हुए’ सामान्य पाठक के लिए बोधगम्य हैं। सभी पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं; अंग्रेज़ी परामर्श-पाठ में चिह्नों के स्थान और पादटिप्पणियों की विषयवस्तु के बीच जो असंगति थी, उसे स्रोत-पदों के अनुसार ठीक किया गया है।
