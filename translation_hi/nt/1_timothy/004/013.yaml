lexical_decisions:
- source_word: ἕως ἔρχομαι
  choice: जब तक मैं न आऊँ
  rationale: यह स्वाभाविक हिन्दी कालवाचक रचना है और पौलुस के आने तक तीमुथियुस की जिम्मेदारी की अवधि व्यक्त करती है। हिन्दी में ‘जब तक…न’ का प्रयोग यहाँ यूनानी अर्थ को बिना वास्तविक निषेध जोड़े स्वाभाविक रूप से प्रकट करता है।
- source_word: πρόσεχε
  choice: मन लगाए रहो
  rationale: आज्ञार्थक क्रिया यहाँ केवल क्षणिक ध्यान नहीं, बल्कि निरंतर समर्पित ध्यान और कार्यशीलता की मांग करती है।
- source_word: τῇ ἀναγνώσει
  choice: सभा में पढ़कर सुनाने
  rationale: ἀνάγνωσις का मूल अर्थ ‘पढ़ना/पाठ’ है; इस सेवकाई-संबंधी संदर्भ में यह सभा के सामने सार्वजनिक पाठ को सूचित करता है। ‘पवित्रशास्त्र’ को मुख्य पाठ में नहीं जोड़ा गया, क्योंकि यूनानी में कर्म स्पष्ट नहीं है।
- source_word: τῇ παρακλήσει
  choice: प्रोत्साहन देने
  rationale: παράκλησις में प्रोत्साहन, आग्रह और नसीहत का अर्थक्षेत्र है। यहाँ ‘प्रोत्साहन देने’ पासबानी सेवा के सकारात्मक और प्रेरक पक्ष को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῇ διδασκαλίᾳ
  choice: शिक्षा देने
  rationale: यहाँ διδασκαλία शिक्षण के कार्य अथवा विषय को दर्शाता है। ‘शिक्षा देने’ आधुनिक पाठक के लिए स्पष्ट है और ‘सिद्धांत’ की अपेक्षाकृत संकीर्ण व्यवस्थित-धर्मवैज्ञानिक ध्वनि से बचता है।
theological_decisions:
- issue: क्या ἀνάγνωσις को मुख्य पाठ में स्पष्ट रूप से पवित्रशास्त्र का पाठ कहा जाए
  choice: सभा में पढ़कर सुनाने
  alternative: पवित्रशास्त्र पढ़कर सुनाने; पढ़ने
  rationale: कलीसियाई सेवा का संदर्भ सभा में पवित्रशास्त्र के सार्वजनिक पाठ की प्रबल संभावना दिखाता है, पर यूनानी पाठ में ‘पवित्रशास्त्र’ स्पष्टतः नहीं है। इसलिए मुख्य पाठ सार्वजनिक/सामुदायिक परिस्थिति व्यक्त करता है, जबकि कर्म की अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सभा में पढ़कर सुनाने’ से सार्वजनिक मौखिक पाठ स्वाभाविक हिन्दी में व्यक्त होता है; ‘मन लगाए रहो’ निरंतर समर्पण का भाव देता है।
