id: 1TI.4.7
reference: 1 Timothy 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοὺς δὲ βεβήλους καὶ γραώδεις μύθους παραιτοῦ. γύμναζε δὲ σεαυτὸν πρὸς εὐσέβειαν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/007.yaml
  text: But reject profane and old-womanish myths[a], and train yourself for godliness.
translation:
  language: hi
  text: पर अपवित्र और बूढ़ी स्त्रियों की-सी मिथक-कथाओं[a] को अस्वीकार करो; इसके बजाय ईश्वर-भक्ति के लिए स्वयं को प्रशिक्षित करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “बूढ़ी स्त्रियों की विशेषता वाली मिथक-कथाएँ।” यूनानी में यह एक तिरस्कारपूर्ण अभिव्यक्ति है; भावार्थ हो सकता है, “बुढ़ियों की कहानियाँ।”'
    reason: शाब्दिक अर्थ, सांस्कृतिक रूप से चिह्नित तिरस्कार और मुहावरेदार विकल्प को दर्ज करना।
lexical_decisions:
- source_word: βεβήλους
  choice: अपवित्र
  rationale: यह शब्द पवित्र के विपरीत सांसारिक या धर्मविरुद्ध वस्तु का बोध कराता है; ‘अपवित्र’ उस विरोध को संक्षेप में बनाए रखता है।
- source_word: γραώδεις
  choice: बूढ़ी स्त्रियों की-सी
  rationale: यूनानी विशेषण का शाब्दिक अर्थ ‘बूढ़ी स्त्रियों की विशेषता वाले’ है और इसमें तिरस्कार का भाव है। यह रूप उस सांस्कृतिक रूप से चिह्नित तीखेपन को मिटाए बिना हिंदी में अर्थ स्पष्ट करता है।
- source_word: μύθους
  choice: मिथक-कथाओं
  rationale: यहाँ शब्द गढ़ी हुई या अटकलबाज़ी पर आधारित कथाओं को सूचित करता है। ‘मिथक-कथाएँ’ आधुनिक हिंदी में अर्थ स्पष्ट रखते हुए केवल साहित्यिक ‘दंतकथाओं’ से व्यापक है।
- source_word: παραιτοῦ
  choice: अस्वीकार करो
  rationale: मध्यवाच्य आज्ञार्थक रूप ऐसी बातों को नकारने या उनसे कोई संबंध न रखने की सशक्त आज्ञा देता है; ‘अस्वीकार करो’ संक्षिप्त और स्वाभाविक है।
- source_word: γύμναζε
  choice: प्रशिक्षित करो
  rationale: क्रिया शारीरिक या क्रीड़ा-प्रशिक्षण का रूपक जगाती है; ‘प्रशिक्षित करो’ उसे आधुनिक हिंदी में सहजता से बनाए रखता है।
- source_word: σεαυτόν
  choice: स्वयं को
  rationale: आत्मवाचक सर्वनाम सीधे तीमुथियुस को अपने ही प्रशिक्षण का कर्म बताता है।
- source_word: πρὸς εὐσέβειαν
  choice: ईश्वर-भक्ति के लिए
  rationale: πρός यहाँ लक्ष्य व्यक्त करता है और εὐσέβεια परमेश्वर के प्रति श्रद्धा से आकार पाए जीवन को सूचित करती है; ‘ईश्वर-भक्ति’ केवल कर्मकांड की अपेक्षा इस दिशा को अधिक स्पष्ट करती है।
- source_word: δὲ … δὲ
  choice: पर … इसके बजाय
  rationale: पहला δέ पिछले संदर्भ से विरोध और दूसरा नकारात्मक आज्ञा के सामने सकारात्मक विकल्प रखता है; हिंदी में यह संबंध ‘पर … इसके बजाय’ से स्वाभाविक रूप में प्रकट होता है।
theological_decisions:
- issue: γραώδεις μύθους के तिरस्कारपूर्ण और लिंग-चिह्नित रूपक का अनुवाद
  choice: मुख्य पाठ में ‘बूढ़ी स्त्रियों की-सी मिथक-कथाएँ’ रखकर विशिष्ट यूनानी बिंब और उसका तीखापन बनाए रखना
  alternative: ‘मूर्खतापूर्ण मिथक-कथाएँ’ या ‘बुढ़ियों की कहानियाँ’
  rationale: ‘मूर्खतापूर्ण’ मूल के विशिष्ट बिंब को मिटा देता है, जबकि ‘बुढ़ियों की कहानियाँ’ हिंदी में अधिक कठोर और बोलचाल का लग सकता है। चुना हुआ रूप मूल अर्थ को पारदर्शी रखता है और पादटिप्पणी इसके तिरस्कारपूर्ण प्रयोग को स्पष्ट करती है।
- issue: εὐσέβεια का अर्थ
  choice: ईश्वर-भक्ति
  alternative: भक्ति; धर्मपरायणता
  rationale: यह शब्द पास्तरी पत्रियों में श्रद्धापूर्ण, परमेश्वर-केंद्रित जीवन का संकेत देता है। ‘ईश्वर-भक्ति’ लक्ष्य को स्पष्ट करता है, पर किसी विशेष संप्रदायगत साधना को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का स्पष्ट, गरिमापूर्ण और आज्ञार्थक रूप अपनाया गया है। ‘मिथक-कथाएँ’ सामान्य पाठक के लिए बोधगम्य है, और ‘स्वयं को प्रशिक्षित करो’ मूल के क्रीड़ा-प्रशिक्षण रूपक को बनाए रखता है।
