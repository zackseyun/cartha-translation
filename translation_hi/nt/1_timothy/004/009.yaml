  text: The saying is trustworthy and worthy of full acceptance,[a]
translation:
  language: hi
  text: यह बात भरोसे के योग्य और पूरी तरह स्वीकार किए जाने योग्य है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह वचन भरोसे के योग्य है” अथवा “यह कथन भरोसे के योग्य है।”
    reason: λόγος के लिए ‘बात’, ‘वचन’ और ‘कथन’ संभव अर्थ हैं; मुख्य पाठ में प्रसंगानुकूल और स्वाभाविक ‘बात’ चुना गया है।
lexical_decisions:
- source_word: πιστὸς
  choice: भरोसे के योग्य
  rationale: इस सूत्र में विशेषण कथन को विश्वसनीय और विश्वास किए जाने योग्य बताता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὁ λόγος
  choice: यह बात
  rationale: यहाँ λόγος किसी विशिष्ट कथन को सूचित करता है। ‘यह बात’ सहज हिन्दी है और ‘वचन’ से उत्पन्न हो सकने वाले व्यापक धर्मवैचारिक अर्थ को नहीं थोपती।
- source_word: πάσης
  choice: पूरी तरह
  rationale: πάσης ἀποδοχῆς का आशय संपूर्ण स्वीकार है; क्रियात्मक हिन्दी संरचना में ‘पूरी तरह’ इस संपूर्णता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποδοχῆς
  choice: स्वीकार किए जाने
  rationale: ἀποδοχή यहाँ ग्रहण या स्वीकार को दर्शाता है; ‘स्वीकार किए जाने’ स्पष्ट और वर्तमान हिन्दी के अनुरूप है।
- source_word: ἄξιος
  choice: योग्य
  rationale: ἄξιος के साथ संबंधवाचक अर्थ ‘के योग्य’ है; दोहराए गए ‘योग्य’ से यूनानी वाक्य के समानांतर मूल्यांकन सुरक्षित रहता है।
