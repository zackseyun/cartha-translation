  text: ἁγιάζεται γὰρ διὰ λόγου θεοῦ καὶ ἐντεύξεως.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/005.yaml
  text: for it is sanctified through the word of God and prayer[a][b].
translation:
  language: hi
  text: क्योंकि वह परमेश्वर के वचन और प्रार्थना[a] के द्वारा पवित्र किया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विनती’ अथवा ‘निवेदन’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁγιάζεται
  choice: पवित्र किया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य अर्थ को बनाए रखता है और संदर्भ में पिछले पद में बताई गई भोजन-वस्तु की ओर संकेत करता है। यह अभिव्यक्ति धार्मिक अर्थ को सुरक्षित रखती है, पर नैतिक शुद्धि या उद्धार का अतिरिक्त दावा नहीं जोड़ती।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताने वाला स्वाभाविक आधुनिक हिन्दी संयोजक है।
- source_word: διὰ
  choice: के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम बताता है; ‘के द्वारा’ इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: λόγου θεοῦ
  choice: परमेश्वर के वचन
  rationale: मूल सम्बन्धवाचक संरचना का सीधा और परिचित अनुवाद है। यह खुला रखता है कि यहाँ शास्त्रीय घोषणा, सृष्टि के विषय में परमेश्वर का कथन, या उसकी व्यापक अनुमति अभिप्रेत है।
- source_word: ἐντεύξεως
  choice: प्रार्थना
  rationale: शब्द में विनती या निवेदन का भाव हो सकता है, पर भोजन को धन्यवाद के साथ ग्रहण करने के संदर्भ में ‘प्रार्थना’ सबसे स्वाभाविक व्यापक शब्द है; अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: संदर्भ में पवित्र किए जाने का दायरा
  choice: कथन भोजन के परमेश्वर के वचन और प्रार्थना द्वारा पवित्र किए जाने के विषय में है; अनुवाद स्वयं इस पवित्रीकरण की धर्मवैज्ञानिक प्रक्रिया को अधिक विशिष्ट नहीं बनाता।
  alternative: इसे नैतिक शुद्धि, उद्धार, या किसी विशेष संस्कार-सिद्धान्त के अर्थ में स्पष्ट किया जा सकता था।
  rationale: 1 तीमुथियुस 4:3-4 का निकट संदर्भ धन्यवाद के साथ भोजन ग्रहण करने का है। ‘पवित्र किया जाता है’ मूल के धार्मिक तनाव को बनाए रखता है, जबकि संदर्भ से परे कोई साम्प्रदायिक या उद्धार-संबंधी निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘वह’ पिछले पद में उल्लिखित ग्रहण की जाने वाली वस्तु को संदर्भ से ग्रहण करता है; मूल यूनानी में कर्ता इस पद में दोहराया नहीं गया है।
