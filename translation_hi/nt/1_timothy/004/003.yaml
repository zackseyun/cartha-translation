translation:
  language: hi
  text: जो विवाह करने से रोकते हैं और खाद्य पदार्थों से दूर रहने का आदेश देते हैं[a]—ऐसे खाद्य पदार्थों को परमेश्वर ने इसलिए सृजा कि सत्य को जान चुके विश्वासी उन्हें धन्यवाद के साथ ग्रहण करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी का रूप अधिक शाब्दिक ढंग से: ‘विवाह करने से रोकते हुए और खाद्य पदार्थों से दूर रहना [ठहराते हुए]।’ दूसरे infinitive के साथ आदेश देने का भाव संक्षिप्त रूप में निहित है; मुख्य पाठ उसे स्पष्ट करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλυόντων γαμεῖν
  choice: विवाह करने से रोकते हैं
  rationale: κωλύω के साथ infinitive निषेध या रोक को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और ‘विवाह’ को संस्था के रूप में प्रतिबंधित करने से अधिक सीधे मूल के ‘विवाह करना’ को बनाए रखता है।
- source_word: ἀπέχεσθαι βρωμάτων
  choice: कुछ भोजनों से दूर रहने का आदेश देते हैं
  rationale: शाब्दिक रूप में वाक्यांश ‘भोजनों से दूर रहना’ है, पर समानांतर संदर्भ में झूठे शिक्षक इसका आदेश देते हैं। ‘कुछ’ हिन्दी में संदर्भगत अर्थ स्पष्ट करता है कि सभी भोजन नहीं, भोजन की कुछ वस्तुएँ निषिद्ध की जा रही थीं।
- source_word: ἃ ὁ θεὸς ἔκτισεν
  choice: उन भोजनों से, जिन्हें परमेश्वर ने ... सृजा
  rationale: κτίζω की सृष्टि-संबंधी धार्मिक ध्वनि को ‘सृजा’ सुरक्षित रखता है; relative pronoun का पूर्वपद स्पष्ट करने के लिए ‘उन भोजनों’ को दोहराया गया है।
- source_word: εἰς μετάλημψιν
  choice: इसलिए सृजा कि ... ग्रहण करें
  rationale: εἰς उद्देश्य दर्शाता है और μετάλημψις यहाँ भोजन में भाग लेने अथवा उसे स्वीकार करके खाने का भाव रखता है; ‘ग्रहण करें’ गरिमापूर्ण और सहज है।
- source_word: μετὰ εὐχαριστίας
  choice: धन्यवाद के साथ
  rationale: यह परमेश्वर के प्रति कृतज्ञ धन्यवाद के साथ भोजन ग्रहण करने का सीधा और प्रचलित हिन्दी रूप है।
- source_word: τοῖς πιστοῖς
  choice: विश्वासी
  rationale: संदर्भ में πιστοῖς का अर्थ विश्वास करने वाले लोग है; ‘विश्वासी’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और संक्षिप्त है।
- source_word: ἐπεγνωκόσι τὴν ἀλήθειαν
  choice: सत्य को जान चुके
  rationale: perfect participle उस वर्तमान अवस्था को व्यक्त करता है जो सत्य को जान लेने से बनी है; ‘जान चुके’ इस परिणामी पक्ष को सुरक्षित रखता है।
theological_decisions:
- issue: क्या τοῖς πιστοῖς καὶ ἐπεγνωκόσι τὴν ἀλήθειαν एक समूह का वर्णन करता है या दो समूहों का
  choice: 'एक ही समूह: सत्य को जान चुके विश्वासी'
  alternative: 'दो समूह: विश्वासी और सत्य को जान चुके लोग'
  rationale: साझे article के अंतर्गत जुड़े हुए दोनों वर्णन सबसे स्वाभाविक रूप से एक ही समूह को दो पहलुओं से बताते हैं।
- issue: ἀπέχεσθαι पर निषेधात्मक बल कैसे समझा जाए
  choice: झूठे शिक्षक कुछ भोजनों से दूर रहने का आदेश देते हैं
  alternative: 'अधिक शाब्दिक: ‘विवाह करने और भोजनों से दूर रहने से रोकते हैं’'
  rationale: ग्रीक में κωλυόντων सीधे γαμεῖν के साथ जुड़ता है; ἀπέχεσθαι को उसी तरह κωλυόντων पर निर्भर करने से संदर्भ के विपरीत अर्थ बनता है। अतः असममित, पर अभिप्रेत, आदेशात्मक संबंध मुख्य पाठ में स्पष्ट किया गया है और रूपगत कठिनाई पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘सृजा,’ ‘ग्रहण करें,’ और ‘विश्वासी’ बाइबलीय गरिमा रखते हुए भी वर्तमान हिन्दी में बोधगम्य हैं।
