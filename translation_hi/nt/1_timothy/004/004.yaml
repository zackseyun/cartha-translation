base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/004.yaml
  text: For every creation of God is good[a], and nothing is to be rejected if it is received with thanksgiving[b],
translation:
  language: hi
  text: क्योंकि परमेश्वर की बनाई हुई हर वस्तु अच्छी है[a], और यदि उसे धन्यवाद के साथ ग्रहण किया जाए, तो कुछ भी त्याज्य नहीं है[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का हर प्राणी अच्छा है।” यूनानी κτίσμα का अर्थ “प्राणी” या अधिक व्यापक रूप से “बनाई हुई वस्तु” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “धन्यवाद के साथ ग्रहण की जाने वाली कोई भी वस्तु त्याज्य नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का आधार या कारण बताता है; ‘क्योंकि’ हिन्दी में उसके व्याख्यात्मक-कारणात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πᾶν κτίσμα θεοῦ
  choice: परमेश्वर की बनाई हुई हर वस्तु
  rationale: एकवचन के साथ πᾶν का वितरणात्मक अर्थ ‘हर’ है। κτίσμα किसी सृजी हुई वस्तु या प्राणी को सूचित कर सकता है; मुख्य पाठ में ‘बनाई हुई हर वस्तु’ प्रसंग के भोजन-संबंधी दायरे को समेटते हुए यूनानी की व्यापकता बनाए रखता है।
- source_word: καλόν
  choice: अच्छी
  rationale: ‘अच्छी’ सृष्टि की भलाई और उपयुक्तता को सीधे व्यक्त करता है तथा बाइबिल की सृष्टि-विषयक भाषा से स्वाभाविक सामंजस्य रखता है।
- source_word: οὐδὲν ἀπόβλητον
  choice: कुछ भी त्याज्य नहीं है
  rationale: ἀπόβλητον का अर्थ अस्वीकार या फेंक देने योग्य है। ‘त्याज्य नहीं’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल हिन्दी है।
- source_word: μετὰ εὐχαριστίας
  choice: धन्यवाद के साथ
  rationale: यह अभिव्यक्ति कृतज्ञता के सामान्य भाव से अधिक स्पष्ट रूप से धन्यवाद देने की क्रिया और उसके धार्मिक संदर्भ को बनाए रखती है।
- source_word: λαμβανόμενον
  choice: यदि उसे ... ग्रहण किया जाए
  rationale: वर्तमान कर्मवाच्य कृदन्त को हिन्दी में शर्तसूचक उपवाक्य के रूप में व्यक्त करने से वाक्य स्वाभाविक बनता है और धन्यवाद के साथ ग्रहण किए जाने की परिस्थिति स्पष्ट रहती है।
theological_decisions:
- issue: भोजन-संबंधी प्रसंग में κτίσμα का दायरा
  choice: ‘परमेश्वर की बनाई हुई हर वस्तु’ के रूप में व्यापक रखा गया है।
  alternative: ‘परमेश्वर का हर प्राणी’ या प्रसंगानुसार संकुचित ‘हर भोजन’।
  rationale: निकटवर्ती प्रसंग भोजन और तपस्वी निषेधों से संबंधित है, फिर भी यूनानी शब्दावली केवल भोजन तक सीमित नहीं है। व्यापक अनुवाद पौलुस के सृष्टि-आधारित तर्क को बिना संकुचित किए सुरक्षित रखता है।
- issue: λαμβανόμενον का परिस्थितिजन्य या शर्तसूचक बल
  choice: ‘यदि उसे धन्यवाद के साथ ग्रहण किया जाए’।
  alternative: ‘जब उसे धन्यवाद के साथ ग्रहण किया जाए’ या ‘धन्यवाद के साथ ग्रहण की जाने वाली’।
  rationale: ‘यदि’ कृदन्त में निहित परिस्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, पर उससे आगे कोई अतिरिक्त धर्मवैचारिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘ग्रहण’ और ‘त्याज्य’ औपचारिक हैं, पर सामान्य धार्मिक हिन्दी में सुबोध हैं। मुख्य पाठ κτίσμα की व्यापकता और कृदन्त की संभावित शर्तसूचकता को सुरक्षित रखता है।
