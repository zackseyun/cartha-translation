id: 1TI.4.16
reference: 1 Timothy 4:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔπεχε σεαυτῷ καὶ τῇ διδασκαλίᾳ· ἐπίμενε αὐτοῖς· τοῦτο γὰρ ποιῶν καὶ σεαυτὸν σώσεις καὶ τοὺς ἀκούοντάς σου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/016.yaml
  text: Pay close attention to yourself and to the teaching[a]; persist in these things[b]. For by doing this you will save both yourself and those who listen to you.
translation:
  language: hi
  text: स्वयं पर और अपनी शिक्षा पर पूरा ध्यान दो; इन बातों में निरन्तर लगे रहो[a]। क्योंकि ऐसा करने से तुम अपने आप को भी और तुम्हारी बात सुननेवालों को भी बचाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इनमें बने रहो” अथवा “इनमें दृढ़ बने रहो।”
    reason: मूल क्रिया लगातार बने रहने और धीरज से लगे रहने, दोनों का भाव दे सकती है।
  - marker: b
    text: या, “सुरक्षित रखोगे” अथवा “उद्धार करोगे।” यूनानी क्रिया सन्दर्भ के अनुसार बचाने, सुरक्षित रखने या उद्धार करने का अर्थ दे सकती है।
    reason: अर्थ की वास्तविक व्यापकता और धार्मिक तनाव को बनाए रखने के लिए।
lexical_decisions:
- source_word: ἔπεχε
  choice: पूरा ध्यान दो
  rationale: यह आज्ञा क्षणिक नहीं, बल्कि लगातार और सावधानी से ध्यान रखने का भाव देती है। ‘पूरा ध्यान दो’ आधुनिक हिन्दी में स्वाभाविक है और इस बल को बनाए रखता है।
- source_word: σεαυτῷ
  choice: स्वयं पर
  rationale: सम्बन्धवाचक रूप यहाँ उस व्यक्ति को बताता है जिस पर ध्यान दिया जाना है। ‘स्वयं पर’ संक्षिप्त और स्पष्ट है।
- source_word: τῇ διδασκαλίᾳ
  choice: अपनी शिक्षा पर
  rationale: διδασκαλία शिक्षा देने के कार्य या उसकी विषय-वस्तु, दोनों का संकेत कर सकता है। ‘शिक्षा’ इस सम्भावित व्यापकता को ‘सिद्धान्त’ की अपेक्षा अधिक सहज रूप में बनाए रखती है।
- source_word: ἐπίμενε
  choice: निरन्तर लगे रहो
  rationale: क्रिया दृढ़ता से जारी रहने का आदेश देती है। यह रूप निरन्तरता और लगन दोनों व्यक्त करता है।
- source_word: αὐτοῖς
  choice: इन बातों में
  rationale: सर्वनाम का स्वाभाविक संकेत स्वयं और शिक्षा पर ध्यान देने से जुड़ी पिछली बातों की ओर है। ‘इन बातों में’ हिन्दी में सन्दर्भ को स्पष्ट रखता है।
- source_word: τοῦτο γὰρ ποιῶν
  choice: क्योंकि ऐसा करने से
  rationale: कृदन्तीय रचना यहाँ साधन या परिणाम तक पहुँचाने वाली क्रिया का भाव देती है; यह हिन्दी रूप उस सम्बन्ध को सहजता से व्यक्त करता है।
- source_word: σώσεις
  choice: बचाओगे
  rationale: σῴζω का मूल अर्थ बचाना या उद्धार करना है। ‘बचाओगे’ इसके व्यापक अर्थ को बनाए रखता है और इसे केवल सांसारिक सुरक्षा या केवल अन्तिम उद्धार तक सीमित नहीं करता।
- source_word: τοὺς ἀκούοντάς σου
  choice: तुम्हारी बात सुननेवालों को
  rationale: वर्तमान कृदन्त उन लोगों को दर्शाता है जो तीमुथियुस की शिक्षा सुनते हैं। ‘तुम्हारी बात सुननेवाले’ आधुनिक हिन्दी में स्वाभाविक है और जारी सुनने का भाव रखता है।
theological_decisions:
- issue: पासबानी की इस चेतावनी में σώσεις का आशय
  choice: मुख्य पाठ में ‘बचाओगे’ रखा गया है और उसके अर्थ को जानबूझकर व्यापक छोड़ा गया है।
  alternative: ‘सुरक्षित रखोगे’ व्यावहारिक या आत्मिक संरक्षण पर बल दे सकता है; ‘उद्धार करोगे’ अन्तिम उद्धार का अधिक स्पष्ट धार्मिक अर्थ दे सकता है।
  rationale: पद तीमुथियुस के जीवन और शिक्षा में बने रहने को उसके और उसके सुननेवालों के बचाए जाने से जोड़ता है। मूल पाठ न तो आत्म-अर्जित उद्धार सिखाने की व्याख्या करता है, न यहाँ अर्थ को केवल अस्थायी सुरक्षा तक सीमित करता है। इसलिए अनुवाद उसी धार्मिक तनाव और व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरसूचक नहीं बल्कि मूल के एकवचन निकट सम्बोधन ‘तुम’ के साथ रखी गई है। शैली सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है; ‘शिक्षा’ तथा ‘बचाओगे’ जैसे शब्द अनावश्यक पारिभाषिक संकीर्णता से बचते हैं।
