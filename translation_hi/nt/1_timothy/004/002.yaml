lexical_decisions:
- source_word: ἐν
  choice: के द्वारा
  rationale: यहाँ ἐν पिछले कथन के संबंध में साधन या माध्यम व्यक्त करता है; इसलिए ‘के द्वारा’ स्वाभाविक और अर्थानुकूल है।
- source_word: ὑποκρίσει
  choice: पाखंड
  rationale: ὑπόκρισις दिखावे और कपटपूर्ण आचरण को सूचित करता है; ‘पाखंड’ आधुनिक हिन्दी में इसका सीधा और संदर्भानुकूल रूप है।
- source_word: ψευδολόγων
  choice: झूठ बोलनेवालों के
  rationale: यह संबंधकारक बहुवचन ὑποκρίσει से जुड़कर ‘झूठ बोलनेवालों का पाखंड’ अर्थ देता है। यह रूप चरित्रगत झूठ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κεκαυστηριασμένων
  choice: मानो दाग दिया गया है
  rationale: पूर्ण निष्क्रिय कृदंत जलाकर दागने या दग्ध करने की परिणामी दशा का बिंब रखता है। ‘मानो दाग दिया गया है’ रूपक को बनाए रखता है और केवल संवेदनहीनता का अर्थ थोपने से बचता है।
- source_word: τὴν ἰδίαν συνείδησιν
  choice: जिनका अपना विवेक
  rationale: ‘अपना’ ἰδίαν के निजवाचक बल को और ‘विवेक’ συνείδησις के नैतिक आत्मबोध को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी एकवचन को हिन्दी में वितरणात्मक एकवचन के रूप में रखा गया है।
theological_decisions:
- issue: κεκαυστηριασμένων के रूपक का आशय
  choice: ‘मानो दाग दिया गया है’ कहकर जलाकर दागने का बिंब और उससे उत्पन्न दशा दोनों खुले रखे गए हैं।
  alternative: ‘सुन्न हो गया है’ या ‘दग्ध कर दिया गया है’
  rationale: मूल रूपक किसी चिह्नित विवेक अथवा दग्ध होकर असंवेदनशील हुए विवेक—दोनों की ओर संकेत कर सकता है। अनुवाद इसे अपरिवर्तनीय आत्मिक पतन के निश्चित सिद्धांत में नहीं बदलता।
