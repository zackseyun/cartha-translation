reference: 1 Timothy 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μηδείς σου τῆς νεότητος καταφρονείτω, ἀλλὰ τύπος γίνου τῶν πιστῶν ἐν λόγῳ, ἐν ἀναστροφῇ, ἐν ⸀ἀγάπῃ, ἐν πίστει, ἐν ἁγνείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/012.yaml
  text: Let no one look down on your youth[a], but be an example for the believers in speech, in conduct, in love, in faith, in purity.
translation:
  language: hi
  text: तुम्हारी युवावस्था को कोई तुच्छ न समझे, बल्कि वाणी में, आचरण में, प्रेम में, विश्वास[a] में और शुद्धता में विश्वासियों के लिए एक उदाहरण बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासयोग्यता में।” यहाँ यूनानी शब्द का अर्थ विश्वास या विश्वासयोग्यता, दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μηδείς
  choice: कोई भी ... न
  rationale: वर्तमानकालीन निषेधात्मक आज्ञा को स्वाभाविक हिन्दी में ‘कोई भी ... न’ से व्यक्त किया गया है।
- source_word: τῆς νεότητος
  choice: तुम्हारी कम उम्र
  rationale: νεότης यहाँ युवावस्था अथवा कम आयु को दर्शाता है; ‘कम उम्र’ आधुनिक हिन्दी में प्रसंग का सामाजिक आशय स्पष्ट करता है।
- source_word: καταφρονείτω
  choice: तुच्छ न समझे
  rationale: καταφρονέω का अर्थ किसी को नीचा या महत्वहीन समझना है; ‘तुच्छ समझना’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: τύπος γίνου
  choice: एक उदाहरण बनो
  rationale: τύπος अनुकरण योग्य नमूने को और γίνου उस रूप में होने या बनने की आज्ञा को व्यक्त करता है।
- source_word: τῶν πιστῶν
  choice: विश्वासियों के लिए
  rationale: सम्बन्धकारक यहाँ उस समुदाय को बताता है जिसके सामने तीमुथियुस को उदाहरण होना है।
- source_word: ἐν λόγῳ
  choice: बोलने में
  rationale: λόγος इस सद्गुण-सूची में बोलने के ढंग को सूचित करता है; यह चयन सामान्य पाठक के लिए ‘वचन में’ से अधिक स्पष्ट है।
- source_word: ἐν ἀναστροφῇ
  choice: चाल-चलन में
  rationale: ἀναστροφή व्यक्ति के आचरण अथवा जीवन-व्यवहार को दर्शाता है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: ἀγάπη के सामान्य और व्यापक अर्थ को सीधे बनाए रखा गया है।
- source_word: ἐν πίστει
  choice: विश्वास में
  rationale: πίστις यहाँ परमेश्वर पर विश्वास या विश्वसनीयता—दोनों में से किसी का बोध करा सकता है; मुख्य पाठ में व्यापक सामान्य अर्थ ‘विश्वास’ रखा गया है।
- source_word: ἐν ἁγνείᾳ
  choice: शुद्धता में
  rationale: ἁγνεία नैतिक, और सम्भवतः यौन, शुद्धता को दर्शाता है; व्यापक शब्द ‘शुद्धता’ अनावश्यक संकुचन से बचता है।
theological_decisions:
- issue: सद्गुण-सूची में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: इस प्रसंग में πίστις आन्तरिक विश्वास अथवा व्यवहारगत विश्वासयोग्यता, दोनों को व्यक्त कर सकता है। मुख्य पाठ किसी एक अर्थ को निर्णायक रूप से नहीं थोपता और दूसरे को पाद-टिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण उपदेशात्मक रूप रखा गया है। समानान्तर यूनानी ἐν-वाक्यांशों को बार-बार ‘में’ कहकर सूची की लय और बल सुरक्षित रखा गया है।
