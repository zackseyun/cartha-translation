lexical_decisions:
- source_word: Παράγγελλε
  choice: आज्ञा देते रहो
  rationale: वर्तमानकालीन आज्ञार्थक क्रिया निरंतर authoritative निर्देश देने का भाव रखती है। ‘आज्ञा देते रहो’ इसकी प्रबलता और जारी रहने वाले कार्य—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταῦτα
  choice: इन बातों
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक शब्द पहले कही गई शिक्षाओं और निर्देशों की ओर संकेत करता है; हिन्दी में ‘इन बातों’ इसका स्वाभाविक बहुवचन रूप है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों आज्ञार्थक क्रियाओं को जोड़ने वाला सामान्य समुच्चयबोधक है।
- source_word: δίδασκε
  choice: इन्हें सिखाते रहो
  rationale: वर्तमानकालीन आज्ञार्थक निरंतर शिक्षण का संकेत देता है। ‘इन्हें’ का संदर्भ ‘इन बातों’ से है, और ‘सिखाते रहो’ जारी रहने वाले कार्य को स्पष्ट करता है।
theological_decisions:
- issue: παράγγελλω में निहित सेवकाई का अधिकार
  choice: ‘आज्ञा देते रहो’ द्वारा निर्देश की अधिकारपूर्ण शक्ति बनाए रखी गई है।
  alternative: ‘इन बातों का निर्देश देते रहो’
  rationale: यूनानी क्रिया केवल सलाह देने से अधिक प्रबल है। यह अनुवाद उसी निर्देशात्मक अधिकार को व्यक्त करता है, पर पाठ से आगे बढ़कर किसी विशेष कलीसियाई पद-सिद्धांत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली। दोनों वर्तमानकालीन आज्ञार्थकों की निरंतरता को ‘देते रहो’ और ‘सिखाते रहो’ से व्यक्त किया गया है।
