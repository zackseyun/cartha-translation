source:
  edition: SBLGNT
  text: μὴ ἀμέλει τοῦ ἐν σοὶ χαρίσματος, ὃ ἐδόθη σοι διὰ προφητείας μετὰ ἐπιθέσεως τῶν χειρῶν τοῦ πρεσβυτερίου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/014.yaml
  text: Do not neglect the gift that is in you[b][a], which was given to you through prophecy with the laying on of the hands of the eldership.
translation:
  language: hi
  text: अपने भीतर के उस वरदान की उपेक्षा न करो जो तुम्हें भविष्यवाणी के द्वारा[a], प्राचीनों के समूह द्वारा हाथ रखे जाने के साथ दिया गया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भविष्यसूचक वाणी के द्वारा”; यह वाक्यांश उस भविष्यवाणी का संकेत कर सकता है जो वरदान दिए जाने के अवसर पर हुई थी या उसके दिए जाने का माध्यम थी।
    reason: lexical_alternative
  - marker: b
    text: “प्राचीनों का समूह” प्राचीनों के सामूहिक निकाय को दर्शाता है; अनुवाद “प्राचीनों की परिषद” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἀμέλει
  choice: उपेक्षा न करो
  rationale: μή के साथ वर्तमान आज्ञार्थक निरंतर असावधानी या उपेक्षा से रोकता है; यह हिंदी में स्वाभाविक और गरिमापूर्ण निषेध है।
- source_word: τοῦ ἐν σοὶ χαρίσματος
  choice: अपने भीतर के वरदान
  rationale: यह χάρισμα को ‘वरदान’ और ἐν σοὶ को ‘अपने भीतर’ के रूप में व्यक्त करता है; केवल ‘अपने वरदान’ कहने से मूल का अंतर्निवास-संबंध मिट सकता था।
- source_word: ἐδόθη σοι
  choice: तुम्हें ... दिया गया था
  rationale: कर्मवाच्य रूप को बनाए रखता है और दाता को स्पष्ट नहीं करता, क्योंकि यूनानी में भी वह निहित है।
- source_word: διὰ προφητείας
  choice: भविष्यवाणी के द्वारा
  rationale: διά के साधनात्मक भाव को सुरक्षित रखता है, पर यह तय नहीं करता कि भविष्यवाणी वरदान देने का माध्यम थी या उस अवसर की भविष्यसूचक वाणी।
- source_word: μετὰ ἐπιθέσεως τῶν χειρῶν
  choice: हाथ रखने के साथ
  rationale: हाथ रखे जाने की प्रचलित बाइबलीय क्रिया को स्वाभाविक हिंदी में व्यक्त करता है और μετά के साथ होने के भाव को बनाए रखता है।
- source_word: τοῦ πρεσβυτερίου
  choice: प्राचीनों के समूह के
  rationale: यह किसी एक प्राचीन के बजाय सामूहिक निकाय को दर्शाता है और बाद की किसी विशिष्ट कलीसियाई शासन-पद्धति की शब्दावली आरोपित नहीं करता।
theological_decisions:
- issue: χάρισμα की प्रकृति को कितना स्पष्ट किया जाए
  choice: वरदान
  alternative: आत्मिक वरदान
  rationale: संदर्भ सेवकाई से जुड़े अनुग्रह-वरदान की ओर संकेत कर सकता है, पर मूल में ‘आत्मिक’ विशेषण नहीं है; इसलिए व्यापक शब्द रखा गया।
- issue: διὰ προφητείας में भविष्यवाणी की भूमिका
  choice: भविष्यवाणी के द्वारा
  alternative: भविष्यसूचक वाणी के द्वारा
  rationale: मूल वाक्यांश माध्यम या संबद्ध भविष्यसूचक घोषणा—दोनों की गुंजाइश रख सकता है; मुख्य पाठ में उसकी अस्पष्टता सुरक्षित रखी गई है।
- issue: πρεσβυτέριον की कलीसियाई संरचना
  choice: प्राचीनों का समूह
  alternative: प्राचीनों की परिषद
  rationale: सामूहिक नेतृत्व स्पष्ट होता है, किंतु बाद की औपचारिक या संप्रदायगत संस्था का अनावश्यक संकेत नहीं जुड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, मध्यम औपचारिक और सार्वजनिक पाठ के योग्य। ‘वरदान’, ‘भविष्यवाणी’ और ‘प्राचीन’ परिचित बाइबलीय शब्द हैं; वाक्य-रचना को स्पष्ट रखते हुए यूनानी पाठ की साधनात्मक और कलीसियाई अस्पष्टताएँ सुरक्षित रखी गई हैं।
