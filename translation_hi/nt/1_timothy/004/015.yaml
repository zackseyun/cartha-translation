  choice: इन बातों
  rationale: बहुवचन संकेतवाचक पद पिछली आज्ञाओं की ओर लौटता है; ‘इन बातों’ स्वाभाविक और पर्याप्त रूप से निकट अनुवाद है।
- source_word: μελέτα
