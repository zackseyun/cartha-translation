  choice: पूर्व निर्देशों के पालन में उसकी व्यापक और प्रत्यक्ष उन्नति
  alternative: केवल आत्मिक परिपक्वता अथवा केवल सेवकाई की कुशलता
  rationale: प्रसंग में शिक्षा, चाल-चलन और समर्पण शामिल हैं। इसलिए ‘उन्नति’ को किसी एक धर्मवैचारिक अर्थ तक सीमित नहीं किया गया।
