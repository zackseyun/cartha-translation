- source_word: ἐν τούτοις ἴσθι
  choice: इन्हीं में लगे रहो
  rationale: यूनानी का शाब्दिक अर्थ ‘इन्हीं में रहो’ है और भाव गहरी, निरंतर संलग्नता का है। ‘लगे रहो’ आधुनिक हिन्दी में स्वाभाविक है; ‘इन्हीं’ पूर्ण समर्पित संलग्नता पर बल देता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का स्वाभाविक हिन्दी संकेत।
- source_word: σου
  choice: तुम्हारी
  rationale: ‘उन्नति’ के साथ सीधा संबंधवाचक रूप।
- source_word: προκοπή
  choice: उन्नति
  rationale: यह शब्द आगे बढ़ने या प्रगति करने को दर्शाता है। ‘उन्नति’ आत्मिक परिपक्वता और सेवकाई की क्षमता—दोनों की सम्भावना खुली रखता है।
- source_word: φανερὰ ᾖ
  choice: प्रकट हो
  rationale: इससे उन्नति का खुले रूप से दिखाई देना व्यक्त होता है; हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: πᾶσιν
  choice: सब पर
  rationale: दत्तिव बहुवचन उन सभी लोगों को दर्शाता है जिनके सामने तीमुथियुस की उन्नति स्पष्ट होनी है। ‘सब पर प्रकट हो’ हिन्दी का स्वाभाविक प्रयोग है।
theological_decisions:
