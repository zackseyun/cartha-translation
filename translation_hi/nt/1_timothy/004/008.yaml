id: 1TI.4.8
reference: 1 Timothy 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ γὰρ σωματικὴ γυμνασία πρὸς ὀλίγον ἐστὶν ὠφέλιμος, ἡ δὲ εὐσέβεια πρὸς πάντα ὠφέλιμός ἐστιν, ἐπαγγελίαν ἔχουσα ζωῆς τῆς νῦν καὶ τῆς μελλούσης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/008.yaml
  text: For bodily training is beneficial for a little while[a], but godliness is beneficial for all things[c][b], since it holds promise for the present life and the coming one.
translation:
  language: hi
  text: क्योंकि शारीरिक प्रशिक्षण[a] थोड़े समय तक[b] लाभदायक है, पर ईश्वर-भक्ति हर बात में लाभदायक है, क्योंकि उसमें वर्तमान जीवन और आनेवाले जीवन की प्रतिज्ञा निहित है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शरीर का अभ्यास’ अथवा ‘शारीरिक व्यायाम’।
    reason: lexical_alternative
  - marker: b
    text: या ‘थोड़ी मात्रा में’; यूनानी पद सीमित समय या सीमित परिमाण—दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘वर्तमान और आनेवाले जीवन की प्रतिज्ञा रखती हुई।’
    reason: lexical_alternative
lexical_decisions:
- source_word: σωματικὴ γυμνασία
  choice: शारीरिक प्रशिक्षण
  rationale: यह प्रयोग शरीर से संबंधित अभ्यास और अनुशासन—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और इसे केवल खेल-कूद तक सीमित नहीं करता।
- source_word: πρὸς ὀλίγον
  choice: थोड़े समय तक
  rationale: यहाँ वर्तमान शारीरिक लाभ और ईश्वर-भक्ति के वर्तमान तथा भावी लाभ के बीच विरोध होने के कारण काल-संबंधी अर्थ प्रसंगानुकूल है; फिर भी यूनानी पद में सीमित मात्रा का अर्थ भी संभव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ὠφέλιμος
  choice: लाभदायक
  rationale: दोनों उपवाक्यों में एक ही शब्द रखकर मूल की समानांतर रचना सुरक्षित की गई है; यह सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: εὐσέβεια
  choice: ईश्वर-भक्ति
  rationale: यह शब्द श्रद्धापूर्ण, ईश्वर-केंद्रित जीवन को सूचित करता है। ‘ईश्वर-भक्ति’ सामान्य पाठक के लिए स्पष्ट है और केवल बाहरी धार्मिक रीति का संकेत नहीं देती।
- source_word: πρὸς πάντα
  choice: हर बात में
  rationale: यह मूल की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है और ईश्वर-भक्ति की सर्वांगीण उपयोगिता बनाए रखता है।
- source_word: ἐπαγγελίαν ἔχουσα
  choice: उसमें … प्रतिज्ञा निहित है
  rationale: स्त्रीलिंग कृदन्त ईश्वर-भक्ति से जुड़ा है। यह हिन्दी अभिव्यक्ति उस संबंध और व्याख्यात्मक कारण को सहज रूप से प्रकट करती है।
- source_word: ζωῆς τῆς νῦν
  choice: वर्तमान जीवन
  rationale: यह यूनानी पद का संक्षिप्त और स्वाभाविक हिन्दी रूप है तथा आगामी जीवन के साथ स्पष्ट विरोध बनाता है।
- source_word: τῆς μελλούσης
  choice: आनेवाले जीवन
  rationale: मूल में ‘जीवन’ दूसरी बार अध्याहृत है; हिन्दी में अर्थ की स्पष्टता के लिए इसे दोहराया गया है।
theological_decisions:
- issue: शारीरिक प्रशिक्षण के लाभ की सीमा
  choice: शारीरिक प्रशिक्षण थोड़े समय तक लाभदायक है
  alternative: शारीरिक प्रशिक्षण थोड़ी मात्रा में लाभदायक है
  rationale: पद शारीरिक प्रशिक्षण को निरर्थक या बुरा नहीं बताता, बल्कि उसके सीमित लाभ की तुलना ईश्वर-भक्ति के व्यापक और स्थायी लाभ से करता है। यूनानी वाक्यांश की वैकल्पिक परिमाण-संबंधी समझ पादटिप्पणी में सुरक्षित है।
- issue: ईश्वर-भक्ति की व्यापक उपयोगिता
  choice: हर बात में लाभदायक
  alternative: हर प्रकार से लाभदायक
  rationale: अनुवाद πρὸς πάντα की व्यापकता बनाए रखता है, पर इससे किसी विशिष्ट भौतिक समृद्धि या सांसारिक सफलता की शिक्षा स्वतः नहीं जोड़ी गई है।
- issue: वर्तमान और आगामी जीवन की प्रतिज्ञा
  choice: वर्तमान जीवन और आनेवाले जीवन की प्रतिज्ञा
  alternative: अभी के और भविष्य के जीवन की प्रतिज्ञा
  rationale: मूल दोनों काल-क्षेत्रों को साथ रखता है। अनुवाद यह तनाव सुरक्षित रखता है कि ईश्वर-भक्ति का लाभ केवल भविष्य तक सीमित नहीं, फिर भी वर्तमान लाभ का स्वरूप पद में अलग से परिभाषित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ईश्वर-भक्ति’ पास्टोरल पत्रियों के प्रमुख धार्मिक पद को स्पष्ट करती है; वाक्य की तुलनात्मक समानांतरता और मूल की वास्तविक अर्थ-अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
