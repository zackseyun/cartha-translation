reference: 1 Timothy 4:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς τοῦτο ⸀γὰρ κοπιῶμεν καὶ ⸀ὀνειδιζόμεθα, ὅτι ἠλπίκαμεν ἐπὶ θεῷ ζῶντι, ὅς ἐστιν σωτὴρ πάντων ἀνθρώπων, μάλιστα πιστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/010.yaml
  text: For to this end we labor and are reproached[a], because we have put our hope in the living God, who is the Savior of all people[c][b], especially of believers.
translation:
  language: hi
  text: इसी उद्देश्य के लिए हम कठिन परिश्रम करते हैं और निन्दा सहते हैं, क्योंकि हमने जीवित परमेश्वर पर अपनी आशा रखी है[a]। वही सभी लोगों का उद्धारकर्ता है, विशेषकर विश्वासियों का[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने जीवित परमेश्वर पर अपनी आशा लगा रखी है।”
    reason: lexical_alternative
  - marker: b
    text: “सभी लोगों का उद्धारकर्ता, विशेषकर विश्वासियों का”—इसे मूल पाठ के अनुसार ही रखा गया है। व्याख्याकारों में मतभेद है कि यहाँ “उद्धारकर्ता” सबके प्रति परमेश्वर की रक्षा और पालन को, सबके लिए उसके उद्धार-प्रबन्ध को, या विश्वासियों को विशेष रूप से प्राप्त उद्धार को प्रमुखता देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: इसी उद्देश्य से
  rationale: यह पदबंध पिछले कथन में बताए लक्ष्य की ओर संकेत करता है; ‘इसी उद्देश्य से’ उसके प्रयोजनात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है। हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट करता है।
- source_word: κοπιῶμεν
  choice: हम कठिन परिश्रम करते
  rationale: क्रिया श्रमसाध्य और थका देने वाले काम का भाव रखती है; ‘कठिन परिश्रम’ उस तीव्रता को व्यक्त करता है।
- source_word: ὀνειδιζόμεθα
  choice: निन्दा सहते हैं
  rationale: मध्य/कर्मवाच्य रूप दूसरों से मिलने वाली भर्त्सना और अपमान को दर्शाता है; ‘निन्दा सहते हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἠλπίκαμεν ἐπὶ
  choice: हमने ... पर अपनी आशा रखी है
  rationale: पूर्णकाल पहले किए गए भरोसे और उसके वर्तमान में बने रहने वाले परिणाम दोनों को व्यक्त करता है।
- source_word: θεῷ ζῶντι
  choice: जीवित परमेश्वर
  rationale: यह परिचित बाइबलीय अभिव्यक्ति यूनानी विशेषण की सीधी और गरिमापूर्ण अभिव्यक्ति है।
- source_word: σωτὴρ
  choice: उद्धारकर्ता
  rationale: शब्द बचाने, छुड़ाने या सुरक्षित रखने वाले को सूचित कर सकता है; पास्टोरल पत्रियों के धार्मिक संदर्भ में ‘उद्धारकर्ता’ उसका स्थापित भार बनाए रखता है।
- source_word: πάντων ἀνθρώπων
  choice: सब मनुष्यों का
  rationale: यहाँ ἄνθρωποι समस्त मानवजाति के लिए व्यापक रूप से प्रयुक्त है; ‘सब मनुष्यों’ में लिंग-विशेष तक सीमित करने का आशय नहीं है।
- source_word: μάλιστα
  choice: विशेषकर
  rationale: यह ‘सब मनुष्यों’ की व्यापकता और विश्वासियों के साथ विशेष संबंध—दोनों को बिना किसी एक में मिला दिए बनाए रखता है।
- source_word: πιστῶν
  choice: विश्वासियों का
  rationale: संदर्भ में यह उन लोगों को दर्शाता है जो विश्वास करते हैं; ‘विश्वासी’ आधुनिक हिन्दी का स्पष्ट और प्रचलित शब्द है।
theological_decisions:
- issue: ‘सब मनुष्यों का उद्धारकर्ता, विशेषकर विश्वासियों का’ का अर्थ
  choice: व्यापक कथन और विश्वासियों के संबंध में विशेषता—दोनों को ज्यों का त्यों बनाए रखना
  alternative: ‘उद्धारकर्ता’ को सबका सामान्य पालनकर्ता और केवल विश्वासियों का छुटकारा देने वाला मानना; सार्वभौमिक उद्धार समझना; अथवा ‘सब मनुष्यों’ को ‘हर प्रकार के मनुष्य’ तक सीमित करना
  rationale: यूनानी पाठ स्वयं सार्वभौमिक दायरे और विश्वासियों से विशेष संबंध, दोनों को साथ रखता है। अनुवाद किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष को आरोपित करने के बजाय इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘परमेश्वर’, ‘उद्धारकर्ता’ और ‘विश्वासी’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं। दो बार आए ‘क्योंकि’ को यूनानी वाक्य के व्याख्यात्मक और कारणात्मक संबंध सुरक्षित रखने के लिए रखा गया है।
