id: 1TI.4.6
reference: 1 Timothy 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ταῦτα ὑποτιθέμενος τοῖς ἀδελφοῖς καλὸς ἔσῃ διάκονος ⸂Χριστοῦ Ἰησοῦ⸃, ἐντρεφόμενος τοῖς λόγοις τῆς πίστεως καὶ τῆς καλῆς διδασκαλίας ᾗ παρηκολούθηκας,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/004/006.yaml
  text: By putting these things before the brothers[a], you will be a good servant of Messiah Jesus[c][b], being nourished by the words of the faith and of the good teaching that you have followed.
translation:
  language: hi
  text: इन बातों को भाइयों[a] के सामने रखते हुए, तुम मसीह यीशु[b] के अच्छे सेवक ठहरोगे और विश्वास[c] के वचनों तथा उस अच्छी शिक्षा से पोषित होते रहोगे, जिसका तुम पालन करते आए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भाइयों’ से प्रसंगानुसार साथी विश्वासी सामान्य रूप से अभिप्रेत हो सकते हैं, जिनमें स्त्रियाँ भी सम्मिलित हैं।
    reason: cultural_note
  - marker: b
    text: यूनानी Χριστός एक उपाधि है, जिसका अर्थ ‘अभिषिक्त जन’ है; यहाँ उसका अनुवाद ‘मसीह’ किया गया है।
    reason: lexical_note
  - marker: c
    text: या, ‘उस विश्वास के वचनों’; यहाँ ‘विश्वास’ से मसीही विश्वास की मान्य विषय-वस्तु अभिप्रेत हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταῦτα
  choice: इन बातों को
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक पद पहले कही गई चेतावनियों और निर्देशों की ओर संकेत करता है; ‘इन बातों’ से उसका बहुवचन स्वाभाविक रूप से बना रहता है।
- source_word: ὑποτιθέμενος
  choice: सामने रखते हुए
  rationale: यह पद किसी बात को लोगों के सामने रखने या उन्हें उससे अवगत कराने का भाव देता है। यह अनुवाद मूल रूपक को बनाए रखते हुए हिन्दी में सहज है।
- source_word: τοῖς ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी पद व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। आरम्भिक मसीही प्रयोग में यह पूरे विश्वासी समुदाय को भी सूचित कर सकता है; उस सम्भावना को पाद-टिप्पणी में रखा गया है।
- source_word: καλὸς
  choice: अच्छे
  rationale: यहाँ शब्द सेवा की प्रशंसनीय गुणवत्ता बताता है; ‘अच्छे सेवक’ साधारण, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: διάκονος
  choice: सेवक
  rationale: सन्दर्भ में यह किसी औपचारिक पदनाम के बजाय सेवा करने वाले व्यक्ति का कार्यात्मक वर्णन है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός अभिषिक्त जन की उपाधि है; ‘मसीह’ हिन्दी में अर्थ और प्रचलित बाइबलीय गरिमा दोनों को बनाए रखता है।
- source_word: ἐντρεφόμενος
  choice: पोषित होते रहोगे
  rationale: क्रिया किसी शिक्षा द्वारा पोषण और निरन्तर निर्माण का भाव देती है। प्रसंग में चलती रहने वाली प्रक्रिया स्पष्ट करने के लिए ‘होते रहोगे’ चुना गया है।
- source_word: τοῖς λόγοις
  choice: वचनों
  rationale: λόγοις को केवल ‘शिक्षा’ में मिला देने के बजाय ‘वचनों’ से उसका शाब्दिक रूप और पोषण का चित्र दोनों सुरक्षित रहते हैं।
- source_word: τῆς πίστεως
  choice: विश्वास के
  rationale: सप्रत्यय प्रयोग और ‘शिक्षा’ के साथ इसकी संगति से मान्य मसीही विश्वास-विषय का भाव सम्भव है; फिर भी ‘विश्वास के वचन’ वाला अधिक सामान्य अर्थ खुला रखा गया है।
- source_word: τῆς καλῆς διδασκαλίας
  choice: उस अच्छी शिक्षा
  rationale: ‘अच्छी शिक्षा’ καλῆς के मूल्यांकन और διδασκαλία के सामान्य अर्थ को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: παρηκολούθηκας
  choice: पालन करते आए हो
  rationale: क्रिया ध्यानपूर्वक अनुसरण करने और उससे जुड़े रहने दोनों का भाव दे सकती है। हिन्दी वाक्यांश निरन्तर अनुसरण को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: यहाँ उपाधि का अर्थ उपस्थित है। ‘मसीह’ हिन्दी में ‘अभिषिक्त जन’ की उपाधि का मान्य और सुबोध रूप है; केवल ध्वन्यन्तरण को मुख्य पाठ में नहीं रखा गया।
- issue: τοῖς ἀδελφοῖς का लैंगिक और सामुदायिक विस्तार
  choice: भाइयों
  alternative: भाइयों और बहनों / विश्वासियों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है, जबकि प्रसंग में स्त्री विश्वासियों सहित पूरे समुदाय की सम्भावना पाद-टिप्पणी में स्पष्ट की गई है।
- issue: τῆς πίστεως में πίστις का अर्थ
  choice: विश्वास के वचन
  alternative: उस विश्वास के वचन
  rationale: यह पद मान्य मसीही विश्वास की विषय-वस्तु का संकेत दे सकता है, पर यूनानी रचना को केवल तकनीकी अर्थ में सीमित करना आवश्यक नहीं। मुख्य पाठ स्वाभाविक अस्पष्टता रखता है और विशिष्ट सम्भावना टिप्पणी में बताता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘वचन’, ‘मसीह’ और ‘सेवक’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, पर वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ या पुरातन नहीं बनाया गया।
