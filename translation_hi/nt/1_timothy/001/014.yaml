  yaml_path: translation/nt/1_timothy/001/014.yaml
  text: But the grace of our Lord overflowed all the more[a], with faith and love that are in Messiah Jesus.
translation:
  language: hi
  text: लेकिन हमारे प्रभु का अनुग्रह मसीह यीशु में पाए जाने वाले विश्वास और प्रेम के साथ बहुतायत से उमड़ पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερεπλεόνασεν
  choice: अत्यन्त उमड़ पड़ा
  rationale: यह संयुक्त क्रिया साधारण रूप से बढ़ने या बहुतायत होने से अधिक, अत्यधिक प्रचुरता का भाव देती है; ‘अत्यन्त उमड़ पड़ा’ इस तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: लेकिन
  rationale: यहाँ δέ पिछली आयत में बताए गए पाप और अविश्वास के साथ स्पष्ट विरोध दिखाता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: ‘अनुग्रह’ χάρις के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द है तथा यहाँ प्रभु की कृपालु और अयोग्य को दी गई भलाई का भाव रखता है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु का
  rationale: यह यूनानी संबंधकारक संरचना को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: μετὰ πίστεως καὶ ἀγάπης
  choice: विश्वास और प्रेम के साथ
  rationale: μετά संबंधकारक के साथ संगति का भाव देता है; अनुवाद अनुग्रह के साथ विश्वास और प्रेम के संबंध को बनाए रखता है, बिना कारण-परिणाम को अनावश्यक रूप से स्पष्ट किए।
- source_word: τῆς ἐν Χριστῷ Ἰησοῦ
  choice: जो मसीह यीशु में हैं
  rationale: स्त्रीलिंग एकवचन संबंधवाचक पदबंध निकटतम संज्ञा ‘प्रेम’ से रूपगत मेल रखता है, पर अर्थतः विश्वास और प्रेम दोनों को विशेषित करना स्वाभाविक है; हिन्दी का बहुवचन ‘हैं’ इसे स्पष्ट करता है।
- source_word: Χριστῷ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός का मूल पदवीगत अर्थ ‘मसीह’ है; यह चयन परिचित हिन्दी बाइबलीय प्रयोग और यूनानी शीर्षक दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ‘विश्वास और प्रेम के साथ’ का अनुग्रह से संबंध
  choice: अनुग्रह विश्वास और प्रेम के साथ उमड़ पड़ा।
  alternative: विश्वास और प्रेम को अनुग्रह द्वारा उत्पन्न गुणों के रूप में स्पष्ट करना।
  rationale: यूनानी वाक्यरचना μετὰ πίστεως καὶ ἀγάπης को मुख्य क्रिया और अनुग्रह से जोड़ती है। अनुवाद इस संबंध को रखता है, पर यह अतिरिक्त दावा नहीं करता कि यहाँ व्याकरणिक रूप से कारण-परिणाम ही बताया गया है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ आधुनिक मानक हिन्दी में इस पदवी का स्वाभाविक और व्यापक रूप से समझा जाने वाला अनुवाद है तथा अभिषिक्त जन का अर्थ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण बाइबलीय शैली। ‘अत्यन्त उमड़ पड़ा’ मूल क्रिया की तीव्रता बनाए रखता है; वाक्यरचना को पठनीय रखते हुए विश्वास और प्रेम दोनों को ‘मसीह यीशु में’ स्थित बताया गया है।
