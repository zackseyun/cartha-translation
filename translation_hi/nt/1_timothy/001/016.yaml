reference: 1 Timothy 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ διὰ τοῦτο ἠλεήθην, ἵνα ἐν ἐμοὶ πρώτῳ ἐνδείξηται ⸂Χριστὸς Ἰησοῦς⸃ τὴν ⸀ἅπασαν μακροθυμίαν, πρὸς ὑποτύπωσιν τῶν μελλόντων πιστεύειν ἐπ’ αὐτῷ εἰς ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/016.yaml
  text: But for this reason I received mercy[a], so that in me, as the foremost[d][c][b], Messiah Jesus might display all his patience as a pattern for those who were going to believe in him for eternal life.
translation:
  language: hi
  text: लेकिन इसी कारण मुझ पर दया की गई, ताकि मुझमें, जो सबसे प्रमुख हूँ,[a] मसीह यीशु अपनी पूरी सहनशीलता प्रकट करें, जिससे मैं उन लोगों के लिए एक नमूना ठहरूँ जो अनन्त जीवन के लिए उन पर विश्वास करने वाले थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, पापियों में सबसे प्रमुख; देखें पद 15। इसका अनुवाद “सबसे पहला” या “सबसे बड़ा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'या: “...उन लोगों के लिए एक नमूने के रूप में जो अनन्त जीवन के लिए उन पर विश्वास करने वाले थे।”'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἠλεήθην
  choice: मुझ पर दया की गई
  rationale: यह कर्मवाच्य रूप को बनाए रखता है और दया करने वाले को स्पष्ट रूप से नामित नहीं करता, जैसा यूनानी पाठ में है।
- source_word: πρώτῳ
  choice: जो सबसे बड़ा हूँ
  rationale: पद 15 में पापियों में पौलुस की प्रमुखता की ओर संकेत करता है; ‘सबसे बड़ा’ उस संदर्भ को बनाए रखता है, जबकि ‘सबसे बुरा’ अर्थ को अधिक स्पष्ट करके तनाव समाप्त कर देता।
- source_word: ἐνδείξηται
  choice: प्रकट करें
  rationale: उद्देश्यवाचक प्रयोग में मसीह यीशु द्वारा अपनी सहनशीलता को पौलुस के मामले में प्रत्यक्ष रूप से दिखाने का भाव देता है।
- source_word: Χριστὸς Ἰησοῦς
  choice: मसीह यीशु
  rationale: Χριστός यहाँ यीशु की मसीही उपाधि को व्यक्त करता है; हिन्दी में ‘मसीह यीशु’ स्वाभाविक और प्रचलित है।
- source_word: τὴν ἅπασαν μακροθυμίαν
  choice: अपनी पूरी सहनशीलता
  rationale: ἅπασαν की समग्रता और μακροθυμία की धैर्यपूर्ण सहनशीलता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑποτύπωσιν
  choice: एक नमूना
  rationale: यह आगे विश्वास करने वालों के लिए प्रस्तुत उदाहरण या प्रतिरूप का भाव सुरक्षित रखता है।
- source_word: τῶν μελλόντων πιστεύειν
  choice: जो ... विश्वास करने वाले थे
  rationale: μέλλω के भावी, prospective अर्थ को पौलुस के अनुभव के समय से देखकर व्यक्त करता है।
- source_word: πιστεύειν ἐπ’ αὐτῷ
  choice: उन पर विश्वास
  rationale: ἐπί के साथ πιστεύω का व्यक्तिगत भरोसे और विश्वास का मानक हिन्दी रूप है।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन के लिए
  rationale: εἰς के लक्ष्य अथवा परिणाम की दिशा को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
theological_decisions:
- issue: πρώτῳ का संदर्भ
  choice: जो सबसे बड़ा हूँ
  alternative: सबसे बड़ा पापी / सबसे बुरा
  rationale: निकटवर्ती पद 15 से पापियों में प्रमुख होने का आशय समझ में आता है, पर इस पद में ‘पापी’ जोड़कर निहित अर्थ को मूल पाठ से अधिक स्पष्ट नहीं किया गया।
- issue: दया और सहनशीलता का कर्ता
  choice: दया के वाक्य में कर्ता अनकहा रखा गया; उद्देश्यवाक्य में मसीह यीशु को सहनशीलता प्रकट करने वाला रखा गया
  alternative: दया करने वाले के रूप में स्पष्टतः परमेश्वर पिता या मसीह यीशु को जोड़ना
  rationale: ἠλεήθην का कर्मवाच्य दया करने वाले को नामित नहीं करता, जबकि उद्देश्यवाक्य स्पष्टतः मसीह यीशु को सहनशीलता प्रकट करने वाला बताता है; अनुवाद इसी भेद को सुरक्षित रखता है।
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट जीसस
  rationale: ‘मसीह’ हिन्दी में उपाधि का अर्थ और बाइबलीय परिचितता दोनों बनाए रखता है।
- issue: ὑποτύπωσιν की वाक्यगत संबद्धता
  choice: मैं ... एक नमूना बनूँ
  alternative: सहनशीलता एक नमूना हो
  rationale: यूनानी में πρὸς ὑποτύπωσιν संक्षिप्त है; हिन्दी में पौलुस में प्रदर्शित मसीह की सहनशीलता के परिणामस्वरूप पौलुस का मामला भावी विश्वासियों के लिए नमूना बनता है। यह अर्थ स्पष्ट करता है, पर मूल की संक्षिप्तता के कारण फुटनोट में वैकल्पिक संरचना दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण पर सहज शैली। ‘मुझ पर दया की गई’ मूल के कर्मवाच्य को बनाए रखता है। ‘अनन्त’, ‘मसीह’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
