source:
  edition: SBLGNT
  text: Ταύτην τὴν παραγγελίαν παρατίθεμαί σοι, τέκνον Τιμόθεε, κατὰ τὰς προαγούσας ἐπὶ σὲ προφητείας, ἵνα ⸀στρατεύῃ ἐν αὐταῖς τὴν καλὴν στρατείαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/018.yaml
  text: This charge I entrust to you[a], child Timothy, in accordance with the prophecies previously made about you, so that by them you may wage the good warfare[c][b],
translation:
  language: hi
  text: तीमुथियुस, मेरे बच्चे, मैं यह आदेश तुम्हें उन भविष्यवाणियों के अनुसार सौंपता हूँ जो पहले तुम्हारे विषय में[a] की गई थीं, ताकि उनके द्वारा[b] तुम उत्तम युद्ध लड़ सको।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारे संबंध में’; संभवतः ‘तुम पर’, अर्थात तीमुथियुस को संबोधित करके या उसके ऊपर कही गई भविष्यवाणियाँ।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनमें’ अथवा ‘उनके सहारे’; यूनानी पद साधन या उस क्षेत्र—दोनों का भाव दे सकता है जिसमें यह युद्ध लड़ा जाता है।
    reason: lexical_alternative
  - marker: c
    text: 'परंपरागत अनुवाद: ‘अच्छी लड़ाई लड़ सको।’ यूनानी में अधिक शाब्दिक रूप से ‘उत्तम युद्ध लड़ सको’ या ‘उत्तम युद्ध-अभियान चला सको’ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγελίαν
  choice: आदेश
  rationale: यह शब्द अधिकारपूर्वक दिए गए निर्देश को व्यक्त करता है। ‘आदेश’ इस प्रसंग की गंभीरता बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: παρατίθεμαί
  choice: सौंपता हूँ
  rationale: मध्यवाच्य रूप किसी बात को दूसरे की देखरेख और उत्तरदायित्व में देने का भाव रखता है; ‘सौंपता हूँ’ इस व्यक्तिगत जिम्मेदारी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τέκνον
  choice: मेरे बच्चे
  rationale: शाब्दिक अर्थ ‘बच्चा/संतान’ है और यहाँ यह आत्मीय आध्यात्मिक संबोधन है। हिन्दी में ‘मेरे बच्चे’ इस आत्मीयता को व्यक्त करता है, जबकि ‘पुत्र’ यूनानी शब्द से अधिक लिंग-विशिष्ट होता।
- source_word: κατὰ
  choice: के अनुसार
  rationale: यहाँ κατά अनुरूपता या सामंजस्य बताता है; आदेश का संबंध पहले की भविष्यवाणियों से जोड़ा गया है।
- source_word: προαγούσας
  choice: पहले ... की गई थीं
  rationale: कृदन्त का मूल भाव ‘पहले जानेवाली’ है, पर प्रसंग में यह उन भविष्यवाणियों को बताता है जो पहले ही कही जा चुकी थीं।
- source_word: ἐπὶ σὲ
  choice: तुम्हारे विषय में
  rationale: ἐπί और कर्मकारक यहाँ तीमुथियुस की ओर संकेत या उसके विषय का भाव दे सकते हैं। ‘तुम्हारे विषय में’ सबसे स्पष्ट है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: προφητείας
  choice: भविष्यवाणियों
  rationale: बहुवचन संज्ञा भविष्यसूचक या परमेश्वर की ओर से कहे गए संदेशों को सीधे व्यक्त करती है; प्रचलित हिन्दी ‘भविष्यवाणियाँ’ पर्याप्त स्पष्ट है।
- source_word: στρατεύῃ
  choice: लड़ सको
  rationale: क्रिया सैनिक सेवा या युद्ध-अभियान में संलग्न होने की छवि रखती है। हिन्दी में इसके सजातीय कर्म के साथ ‘युद्ध लड़ना’ सैन्य रूपक को सहज रूप से बनाए रखता है।
- source_word: ἐν αὐταῖς
  choice: उनके द्वारा
  rationale: ἐν यहाँ साधन का अर्थ दे सकता है, अर्थात वे भविष्यवाणियाँ तीमुथियुस के संघर्ष का मार्गदर्शक या माध्यम हैं। क्षेत्र या परिधि का अर्थ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὴν καλὴν στρατείαν
  choice: उत्तम युद्ध
  rationale: στρατεία केवल एक मुठभेड़ नहीं, बल्कि युद्ध, अभियान या सैनिक सेवा का भाव रखता है। ‘उत्तम युद्ध’ मूल सैन्य रूपक और καλός के नैतिक गुण—अच्छा/उत्तम—दोनों को बनाए रखता है।
theological_decisions:
- issue: भविष्यवाणी और तीमुथियुस को सौंपे गए दायित्व का संबंध
  choice: पहले तीमुथियुस के विषय में हुई भविष्यवाणियाँ वर्तमान आदेश के आधार या मार्गदर्शक के रूप में प्रस्तुत हैं।
  alternative: वे भविष्यवाणियाँ औपचारिक रूप से तीमुथियुस का अभिषेक या नियुक्ति थीं; अथवा वे केवल निजी प्रोत्साहन थीं।
  rationale: पद भविष्यवाणियों को पौलुस के आदेश और तीमुथियुस के युद्ध से जोड़ता है, पर किसी विशिष्ट संस्कारात्मक नियुक्ति-सिद्धान्त या केवल निजी प्रोत्साहन का स्पष्ट निर्धारण नहीं करता। अनुवाद इस संबंध को बनाए रखते हुए उससे आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे बच्चे’ आत्मीय आध्यात्मिक संबोधन को दर्शाता है; ‘आदेश ... सौंपता हूँ’ अधिकार और व्यक्तिगत उत्तरदायित्व दोनों को बनाए रखता है। सैन्य रूपक को सामान्य पाठक के लिए बोधगम्य रखते हुए उसका विस्तार ‘एक लड़ाई’ तक सीमित नहीं किया गया।
