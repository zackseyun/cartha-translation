  text: θέλοντες εἶναι νομοδιδάσκαλοι, μὴ νοοῦντες μήτε ἃ λέγουσιν μήτε περὶ τίνων διαβεβαιοῦνται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/007.yaml
  text: wanting to be teachers of the law[b][a], though they understand neither what they are saying nor the things about which they speak so confidently.
translation:
  language: hi
  text: वे व्यवस्था के शिक्षक बनना चाहते हैं,[a] फिर भी वे न तो यह समझते हैं कि वे क्या कह रहे हैं, न यह कि वे किन बातों के विषय में इतनी दृढ़ता से दावे करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यवस्था के शिक्षक’ से संभवतः वे लोग अभिप्रेत हैं जो यहूदी व्यवस्था (तोरा) सिखाने का अधिकार जताते थे।
    reason: cultural_note
lexical_decisions:
- source_word: θέλοντες
  choice: बनना चाहते हैं
  rationale: वर्तमान कृदन्त की निरन्तर इच्छा को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले पद के निहित कर्ता से जुड़ता है।
- source_word: νομοδιδάσκαλοι
  choice: व्यवस्था के शिक्षक
  rationale: यौगिक संज्ञा का सीधा और सहज रूप; सम्भावित यहूदी तोरा-सन्दर्भ को मुख्य पाठ में आवश्यकता से अधिक निर्दिष्ट नहीं करता।
- source_word: μὴ νοοῦντες
  choice: फिर भी ... नहीं समझते
  rationale: इच्छा और समझ के अभाव के बीच निहित विरोधात्मक भाव को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: μήτε ... μήτε
  choice: न तो ... और न ही
  rationale: यूनानी के सहसम्बन्धी निषेध को स्वाभाविक हिन्दी संरचना में सुरक्षित रखता है।
- source_word: ἃ λέγουσιν
  choice: कि वे क्या कह रहे हैं
  rationale: उनके कथन की विषयवस्तु को दर्शाता है और वर्तमानकालीन क्रिया का जारी भाव बनाए रखता है।
- source_word: περὶ τίνων
  choice: उन बातों ... जिनके बारे में
  rationale: चर्चा या दावे के विषयों को दर्शाने वाली περί-संरचना का स्पष्ट हिन्दी रूप है।
- source_word: διαβεβαιοῦνται
  choice: इतने विश्वास के साथ दावे करते हैं
  rationale: क्रिया में निहित दृढ़, आत्मविश्वासी अभिकथन को व्यक्त करता है; केवल सामान्य बोलने की अपेक्षा मूल का बल बेहतर बनाए रखता है।
theological_decisions:
- issue: νομοδιδάσκαλοι में ‘व्यवस्था’ का सन्दर्भ
  choice: मुख्य पाठ में ‘व्यवस्था के शिक्षक’
  alternative: ‘मूसा की व्यवस्था के शिक्षक’ अथवा ‘तोरा के शिक्षक’
  rationale: सन्दर्भ में यहूदी व्यवस्था/तोरा सम्भावित है, पर यूनानी पद स्वयं इसे ‘मूसा की’ कहकर निर्दिष्ट नहीं करता; इसलिए मुख्य पाठ मूल की व्यापकता बनाए रखता है और पादटिप्पणी सांस्कृतिक सन्दर्भ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किन्तु गरिमापूर्ण शैली। ‘व्यवस्था’ बाइबलीय सन्दर्भ में νόμος का परिचित रूप है। वाक्य की समानान्तर नकारात्मक संरचना और मूल का आलोचनात्मक तनाव सुरक्षित रखा गया है।
