lexical_decisions:
- source_word: ὧν
  choice: इन बातों से
  rationale: यह संबंधवाचक सर्वनाम पिछली आयत में बताए गए प्रेम, शुद्ध हृदय, अच्छे विवेक और निष्कपट विश्वास की ओर संकेत करता है। हिन्दी में “इन बातों से” पिछला संदर्भ स्पष्ट रखता है, पर उसे अनावश्यक रूप से किसी एक संकीर्ण सूची तक सीमित नहीं करता।
- source_word: τινες
  choice: कुछ लोग
  rationale: अनिश्चित सर्वनाम किसी अनिर्दिष्ट समूह को दर्शाता है। “कुछ लोग” सहज आधुनिक हिन्दी है और पौलुस की अनिर्दिष्टता बनाए रखता है।
- source_word: ἀστοχήσαντες
  choice: चूककर
  rationale: क्रिया में लक्ष्य से चूकने या सही मार्ग से हटने का भाव है। “चूककर” लक्ष्य के रूपक को संक्षेप में बनाए रखता है और अगले क्रियापद “मुड़ गए” से उसका भेद भी रहने देता है।
- source_word: ἐξετράπησαν
  choice: मुड़ गए हैं
  rationale: यह उचित मार्ग से दूसरी ओर फिर जाने को व्यक्त करता है। हिन्दी का पूर्ण वर्तमान भूतकालीन घटना के वर्तमान परिणाम को स्वाभाविक रूप से प्रकट करता है।
- source_word: εἰς
  choice: की ओर
  rationale: यह गति या परिणति की दिशा बताता है; “मुड़ गए” के साथ “की ओर” स्वाभाविक हिन्दी प्रयोग है।
- source_word: ματαιολογίαν
  choice: निरर्थक बातों
  rationale: यह ऐसे भाषण या चर्चा को दर्शाता है जो खोखली, निष्फल या अर्थहीन हो। “निरर्थक बातें” सामान्य पाठक के लिए स्पष्ट और संदर्भानुकूल है।
theological_decisions:
- issue: ὧν का संदर्भ
  choice: इसे पिछली आयत में बताई गई नैतिक और आत्मिक बातों की ओर सामान्य संकेत के रूप में “इन बातों से” कहा गया है।
  alternative: इसे केवल “शुद्ध हृदय, अच्छे विवेक और निष्कपट विश्वास” की त्रयी तक सीमित समझना, अथवा अधिक शाब्दिक रूप में “जिनसे” कहना।
  rationale: यूनानी वाक्य पिछली आयत पर निर्भर है। “इन बातों से” उस संबंध को समझने योग्य बनाता है, लेकिन यह तय नहीं करता कि संकेत केवल अंतिम त्रयी तक है या आज्ञा के व्यापक लक्ष्य तक।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “चूककर” और “मुड़ गए हैं” द्वारा यूनानी के दो अलग दिशात्मक रूपकों को अलग-अलग बनाए रखा गया है; पादटिप्पणियाँ वास्तविक शब्दार्थगत विकल्प दर्ज करती हैं।
