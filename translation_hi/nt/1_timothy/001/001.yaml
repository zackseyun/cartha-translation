  rationale: The revision moves “मसीह यीशु का प्रेरित” immediately after “पौलुस” and retains both “परमेश्वर” and “मसीह यीशु” as the coordinated basis of the one apostolic commission. Commas mark “हमारी आशा” as an appositional designation of Messiah Jesus. Footnote b is retained as an explicitly expanded Hindi alternative, while the main text preserves the Greek's single shared “आज्ञा.”
