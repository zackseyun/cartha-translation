  text: Παῦλος ἀπόστολος ⸂Χριστοῦ Ἰησοῦ⸃ κατ’ ἐπιταγὴν θεοῦ σωτῆρος ἡμῶν καὶ ⸂Χριστοῦ Ἰησοῦ⸃ τῆς ἐλπίδος ἡμῶν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/001.yaml
  text: Paul[a], an apostle of Messiah Jesus by the command of God our Savior and Messiah Jesus our hope[b],
translation:
  language: hi
  text: पौलुस, मसीह[a] यीशु का प्रेरित, हमारे उद्धारकर्ता परमेश्वर और हमारी आशा, मसीह यीशु, की आज्ञा के अनुसार,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, दोनों स्थानों पर ‘ख्रीष्ट यीशु’। यूनानी पदवी Χριστός को ‘मसीह’ अथवा कुछ संदर्भों में नाम-जैसे रूप ‘ख्रीष्ट’ से व्यक्त किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: नए नियम के इस नाम का प्रचलित हिन्दी रूप।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यह पौलुस की अधिकृत सेवकाई और आरम्भिक मसीही पदनाम को व्यक्त करने वाला स्थापित हिन्दी शब्द है; सामान्य ‘दूत’ की अपेक्षा यहाँ अधिक सटीक है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: यूनानी पदक्रम को बनाए रखते हुए Χριστός की पदवीगत शक्ति को ‘मसीह’ से व्यक्त किया गया है।
- source_word: κατ’ ἐπιταγὴν
  choice: की आज्ञा से
  rationale: यह अधिकारपूर्ण आदेश को पौलुस की प्रेरिताई का आधार बताता है और हिन्दी में स्वाभाविक है।
- source_word: θεοῦ σωτῆρος ἡμῶν
  choice: हमारे उद्धारकर्ता परमेश्वर
  rationale: σωτήρ को परमेश्वर की उपाधि के रूप में रखते हुए यूनानी संबंधकारक पदबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: यह आज्ञा से जुड़े दो समानांतर पदबंधों—परमेश्वर और मसीह यीशु—को जोड़ता है; हिन्दी में साझा ‘की’ दूसरे पदबंध के बाद स्वाभाविक रूप से दोनों पर लागू होती है।
- source_word: Χριστοῦ Ἰησοῦ τῆς ἐλπίδος ἡμῶν
  choice: हमारी आशा मसीह यीशु
  rationale: ἐλπίδος ἡμῶν को मसीह यीशु का समानाधिकरण पद बनाए रखता है और उन्हें ही ‘हमारी आशा’ ठहराता है।
- source_word: ἐλπίδος
  choice: आशा
  rationale: यह पौलुस के प्रयोग में निहित भरोसे से भरी भावी अपेक्षा को व्यक्त करने वाला व्यापक और स्थापित शब्द है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ पदवी का अर्थ सक्रिय है; ‘मसीह’ आधुनिक हिन्दी में समझ में आने वाला और स्थापित पदवीगत रूप है। वैकल्पिक यूनानी-आधारित रूप को पादटिप्पणी में रखा गया है।
- issue: ‘हमारी आशा’ का मसीह यीशु से संबंध
  choice: 'समानाधिकरण: ‘हमारी आशा मसीह यीशु’'
  alternative: 'व्याख्यात्मक: ‘मसीह यीशु, जो हमारी आशा हैं’'
  rationale: संक्षिप्त समानाधिकरण यूनानी संरचना और उसके धर्मवैज्ञानिक बल को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
- issue: आज्ञा के साथ जुड़े कर्ता
  choice: परमेश्वर और मसीह यीशु दोनों को एक ही संबंधकारक संरचना में रखना
  alternative: हर पदबंध के साथ अलग से ‘की’ लगाना
  rationale: यूनानी में दोनों पदबंध καί से जुड़े हैं और ἐπιταγήν पर निर्भर हैं। हिन्दी की साझा संबंधकारक रचना इसे स्वाभाविक ढंग से व्यक्त करती है; अधिक स्पष्ट वैकल्पिक विन्यास पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्रारम्भ के अनुरूप संक्षिप्त रखी गई है। पद के अंत में अल्पविराम रखा गया है क्योंकि यूनानी वाक्य अगले पद में प्राप्तकर्ता के उल्लेख के साथ आगे बढ़ता है।
