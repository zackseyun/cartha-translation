    issue: Ambiguous attachment caused by the draft's word order
    rationale: In “हमारी आशा मसीह यीशु की आज्ञा से,” the nearest-genitive reading can attach “की आज्ञा” only to Messiah Jesus. Greek coordinates “God our Savior” and “Messiah Jesus our hope” as the authorities for the one command. Reordering resolves this without changing meaning.
  - severity: low
    issue: Footnote b's alternative is syntactically incomplete/awkward in Hindi
    rationale: The supplied alternative ends in a way that does not clearly express the shared relationship of both coordinated phrases to “आज्ञा.” A revised alternative makes the intended structural clarification explicit.
