translation:
  language: hi
  text: यौन अनैतिकता करने वालों, पुरुषों के साथ यौन-संबंध रखने वाले पुरुषों[a], दास-व्यापारियों, झूठ बोलने वालों, झूठी शपथ खाने वालों और जो कुछ भी खरी शिक्षा के विरुद्ध है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समलैंगिक यौन आचरण करने वाले पुरुषों।” यूनानी शब्द ἀρσενοκοῖται दुर्लभ है और उसके सटीक दायरे पर मतभेद है, पर वह पुरुषों के बीच यौन क्रिया को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: πόρνοις
  choice: यौन अनैतिकता करने वालों
  rationale: यह शब्द व्यापक रूप से यौन अनैतिक आचरण करने वालों को दर्शाता है। यह अनुवाद अर्थ को केवल विवाह-पूर्व यौन-संबंधों तक सीमित नहीं करता।
- source_word: ἀρσενοκοίταις
  choice: पुरुषों के साथ यौन-संबंध रखने वाले पुरुषों
  rationale: दुर्लभ यूनानी शब्द पुरुष-पुरुष यौन क्रिया की ओर संकेत करता है। व्यवहार-केंद्रित यह अनुवाद आधुनिक यौन पहचान की श्रेणियाँ मूल पाठ पर आरोपित नहीं करता; शब्द के सटीक दायरे पर विवाद को पादटिप्पणी में स्वीकार किया गया है।
- source_word: ἀνδραποδισταῖς
  choice: दास-व्यापारियों
  rationale: यह शब्द लोगों को दास बनाने, प्राप्त करने या उनका व्यापार करने वालों के लिए प्रयुक्त होता है। संक्षिप्त हिंदी पद मानव-दासता के व्यापारिक पहलू को स्पष्ट रखता है।
- source_word: ψεύσταις
  choice: झूठ बोलने वालों
  rationale: बहुवचन संज्ञा का यह सहज और स्पष्ट आधुनिक हिंदी रूप है।
- source_word: ἐπιόρκοις
  choice: झूठी शपथ खाने वालों
  rationale: यह उन लोगों को दर्शाता है जो झूठी शपथ लेते हैं या शपथ का उल्लंघन करते हैं; हिंदी में यह वाक्यांश अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: καὶ εἴ τι ἕτερον
  choice: और ऐसी किसी भी दूसरी बात के लिए
  rationale: यह खुला वाक्यांश सूची को अन्य समान बातों तक विस्तृत करता है और मूल के अनिश्चित, व्यापक बल को बनाए रखता है।
- source_word: τῇ ὑγιαινούσῃ διδασκαλίᾳ
  choice: खरी शिक्षा
  rationale: ὑγιαίνω का रूपक अर्थ स्वस्थ, सही या दोषरहित है। 'खरी शिक्षा' स्वाभाविक और गरिमापूर्ण हिंदी में शिक्षा की विश्वसनीयता तथा शुद्धता व्यक्त करती है।
- source_word: ἀντίκειται
  choice: के विरुद्ध है
  rationale: यह मूल क्रिया में निहित विरोध या प्रतिकूलता को सरल और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ἀρσενοκοίταις का अनुवाद एक शाब्दिक और धर्मवैज्ञानिक रूप से विवादित संदर्भ में
  choice: पुरुषों के साथ यौन-संबंध रखने वाले पुरुषों
  alternative: समलैंगिक यौन आचरण करने वाले पुरुषों
  rationale: चुना हुआ रूप शब्द के पुरुष-विशिष्ट और यौन-व्यवहार संबंधी आशय को व्यक्त करता है, पर मूल पाठ में आधुनिक पहचान-आधारित अवधारणा नहीं जोड़ता। दुर्लभ शब्द के सटीक दायरे पर मतभेद होने के कारण वैकल्पिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। पद मूल वाक्य की जारी रहने वाली सूची है, इसलिए अंत में पूर्णविराम के बजाय अल्पविराम रखा गया है। व्यवहार-केंद्रित पदावली अपनाई गई है और अनावश्यक सांप्रदायिक या आधुनिक पहचान-आधारित शब्दावली से बचा गया है।
