source:
  edition: SBLGNT
  text: ὧν ἐστιν Ὑμέναιος καὶ Ἀλέξανδρος, οὓς παρέδωκα τῷ Σατανᾷ ἵνα παιδευθῶσι μὴ βλασφημεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/020.yaml
  text: among whom are Hymenaeus and Alexander[b][a], whom I have handed over to Satan so that they may be taught not to blaspheme.
translation:
  language: hi
  text: उनमें हुमिनयुस और सिकन्दर हैं, जिन्हें मैंने शैतान के हवाले कर दिया है[a], ताकि वे ईशनिंदा न करना सीखें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शैतान के हवाले कर दिया” का अनुवाद “शैतान को सौंप दिया” भी हो सकता है। यह सम्भवतः अन्तिम दण्ड की घोषणा के बजाय कठोर सुधारात्मक अनुशासन की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी शब्द में सिखाने, प्रशिक्षित करने और सुधारात्मक अनुशासन देने—इन सभी का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ἐστιν
  choice: उन्हीं में ... हैं
  rationale: यह पिछले पद में बताए गए लोगों में से इन दो व्यक्तियों को चिह्नित करता है और यूनानी के अंशसूचक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: Ὑμέναιος καὶ Ἀλέξανδρος
  choice: हुमिनयुस और सिकन्दर
  rationale: व्यक्तिगत नामों के लिए हिन्दी बाइबल परम्परा में प्रचलित रूप अपनाए गए हैं।
- source_word: παρέδωκα τῷ Σατανᾷ
  choice: मैंने शैतान के हवाले कर दिया है
  rationale: यह मूल रूपक को बिना उसकी ठीक-ठीक प्रक्रिया तय किए स्पष्ट, वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: ἵνα παιδευθῶσι
  choice: ताकि वे अनुशासन के द्वारा ... सीखें
  rationale: παιδεύω में शिक्षा, प्रशिक्षण और सुधारात्मक अनुशासन के मिले-जुले भाव हैं; यह अभिव्यक्ति उसके सुधारात्मक उद्देश्य को बनाए रखती है।
- source_word: μὴ βλασφημεῖν
  choice: निन्दा न करना
  rationale: सन्दर्भ में यह परमेश्वर अथवा विश्वास के विरुद्ध अपमानजनक और श्रद्धाहीन वचन का संकेत देता है; ‘निन्दा’ इसकी गम्भीरता बनाए रखती है।
theological_decisions:
- issue: ‘शैतान के हवाले कर दिया’ का अर्थ
  choice: मुख्य पाठ में मूल अभिव्यक्ति को यथावत रखा गया है और पादटिप्पणी में इसके सम्भावित सुधारात्मक उद्देश्य का संकेत दिया गया है।
  alternative: इसे केवल कलीसियाई बहिष्कार, चमत्कारिक शारीरिक पीड़ा, या अन्तिम दण्ड की घोषणा के रूप में स्पष्ट करना।
  rationale: उद्देश्यवाचक उपवाक्य सुधार की ओर संकेत करता है, पर मूल पाठ अनुशासन की विधि नहीं बताता; इसलिए किसी एक व्याख्या को मुख्य पाठ में आरोपित नहीं किया गया।
- issue: παιδευθῶσι का सुधारात्मक और शिक्षात्मक तनाव
  choice: ‘अनुशासन के द्वारा ... सीखें’
  alternative: ‘उन्हें सिखाया जाए’ या ‘उन्हें दण्ड दिया जाए’
  rationale: चुना हुआ रूप शिक्षा और सुधारात्मक अनुशासन दोनों भावों को समेटता है तथा केवल दण्ड का अर्थ नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘हवाले कर दिया’ मुहावरेदार है, जबकि पादटिप्पणियाँ मूल अभिव्यक्ति की अस्पष्टता और παιδεύω के व्यापक अर्थक्षेत्र को सुरक्षित रखती हैं।
