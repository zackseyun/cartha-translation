    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर की व्यवस्था,” “परमेश्वर की योजना,” अथवा “परमेश्वर से मिला दायित्व।” यूनानी शब्द प्रबंधन, दायित्व या सुनियोजित व्यवस्था को सूचित कर सकता है।
