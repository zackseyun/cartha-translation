source:
  edition: SBLGNT
  text: πιστὸς ὁ λόγος καὶ πάσης ἀποδοχῆς ἄξιος, ὅτι Χριστὸς Ἰησοῦς ἦλθεν εἰς τὸν κόσμον ἁμαρτωλοὺς σῶσαι· ὧν πρῶτός εἰμι ἐγώ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/015.yaml
  text: 'The saying is trustworthy and worthy of full acceptance: that Messiah Jesus came into the world to save sinners[b][a], of whom I am the foremost.'
translation:
  language: hi
  text: 'यह बात भरोसे के योग्य और पूरी तरह स्वीकार किए जाने योग्य है: मसीह यीशु[a] पापियों को बचाने के लिए संसार में आए—जिनमें मैं सबसे प्रमुख हूँ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीस्त यीशु।’
    reason: Χριστός के पारंपरिक लिप्यंतरण-आधारित विकल्प को दर्ज करना।
  - marker: b
    text: या, ‘जिनमें मैं सबसे बुरा हूँ’ अथवा ‘जिनमें मैं मुख्य हूँ।’
    reason: πρῶτος यहाँ ‘सबसे प्रमुख,’ ‘सबसे बुरा,’ या ‘मुख्य’ के भाव में समझा जा सकता है।
lexical_decisions:
- source_word: πιστὸς ὁ λόγος
  choice: यह बात भरोसे के योग्य है
  rationale: यह पास्तरीय पत्रियों में प्रयुक्त सूत्रवाक्य है; ‘यह बात’ कथन का संकेत देता है और ‘भरोसे के योग्य’ πιστός का सहज आधुनिक हिन्दी रूप है।
- source_word: πάσης ἀποδοχῆς ἄξιος
  choice: पूरी तरह स्वीकार किए जाने योग्य
  rationale: ἀποδοχή स्वीकार या ग्रहण किए जाने को दर्शाता है और πάσης उसकी पूर्णता पर बल देता है।
- source_word: ὅτι
  choice: कोलन के बाद कथन की विषयवस्तु
  rationale: यहाँ ὅτι कारण नहीं, भरोसेयोग्य कथन की विषयवस्तु प्रस्तुत करता है; हिन्दी में कोलन से यह संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: Χριστὸς Ἰησοῦς
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि का बोध बनाए रखता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: ἦλθεν εἰς τὸν κόσμον
  choice: संसार में आए
  rationale: यह मूल की गति और उसके धर्मवैज्ञानिक संकेत को बिना विस्तार दिए सुरक्षित रखता है; ‘आए’ यीशु के लिए स्वाभाविक आदरसूचक हिन्दी है।
- source_word: ἁμαρτωλοὺς σῶσαι
  choice: पापियों को बचाने के लिए
  rationale: संज्ञा के रूप में प्रयुक्त ἁμαρτωλούς के लिए ‘पापियों’ और उद्धार-संदर्भ में σῶσαι के लिए ‘बचाने’ सटीक तथा सुबोध हैं।
- source_word: ὧν πρῶτός εἰμι ἐγώ
  choice: और उनमें सबसे बढ़कर मैं हूँ
  rationale: ‘सबसे बढ़कर’ πρῶτος के प्रथम/प्रधान होने के भाव को रखता है, पर उसे केवल ‘सबसे बुरा’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता; ‘मैं’ पर बल भी बना रहता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट यीशु
  rationale: इस अंगीकारात्मक कथन में उपाधि का भाव स्पष्ट है; ‘मसीह’ अर्थवाही और हिन्दी पाठकों के लिए स्थापित रूप है।
- issue: पौलुस के लिए πρῶτος का आशय
  choice: सबसे बढ़कर
  alternative: सबसे बुरा / मुख्य
  rationale: मूल शब्द श्रेणी या प्रधानता व्यक्त कर सकता है। मुख्य पाठ जानबूझकर इस अर्थ-परास को पूरी तरह ‘नैतिक रूप से सबसे बुरा’ में नहीं समेटता; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कोलन कथन की विषयवस्तु प्रस्तुत करता है और डैश अंतिम आत्म-संदर्भ पर स्वाभाविक बल देता है।
