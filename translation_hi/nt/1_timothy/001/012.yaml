source:
  edition: SBLGNT
  text: ⸀Χάριν ἔχω τῷ ἐνδυναμώσαντί με Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν, ὅτι πιστόν με ἡγήσατο θέμενος εἰς διακονίαν,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/012.yaml
  text: I give thanks to Messiah Jesus our Lord[a], who has strengthened me, because he considered me faithful, appointing me to ministry[b],
translation:
  language: hi
  text: मुझे सामर्थ्य देनेवाले हमारे प्रभु मसीह यीशु[a] का मैं धन्यवाद करता हूँ, क्योंकि उन्होंने मुझे विश्वासयोग्य समझकर सेवा[b] में नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ का अर्थ ‘अभिषिक्त जन’ है।
    reason: title_meaning
  - marker: b
    text: या ‘सेवाकार्य’। यूनानी शब्द व्यापक रूप से सेवा या सेवाकार्य को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χάριν ἔχω
  choice: मैं धन्यवाद करता हूँ
  rationale: यह यूनानी मुहावरा कृतज्ञता व्यक्त करने का अर्थ देता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: ἐνδυναμώσαντί με
  choice: मुझे सामर्थ्य देनेवाले
  rationale: यह मसीह यीशु को पौलुस को सक्षम और सुदृढ़ करनेवाले के रूप में प्रस्तुत करता है, बिना किसी विशेष प्रकार की सामर्थ्य को अनावश्यक रूप से निर्धारित किए।
- source_word: Χριστῷ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि है; प्रचलित हिंदी शब्द ‘मसीह’ उसके अभिषिक्त जन होने का भाव रखता है और ‘यीशु’ से पहले यूनानी क्रम को बनाए रखता है।
- source_word: κυρίῳ ἡμῶν
  choice: हमारे प्रभु
  rationale: ‘प्रभु’ मसीही अधिकार की इस उपाधि का प्रतिष्ठित और स्वाभाविक हिंदी रूप है।
- source_word: πιστόν
  choice: विश्वासयोग्य
  rationale: यहाँ शब्द सेवा सौंपे जाने योग्य भरोसेमंद और निष्ठावान पाए जाने का भाव देता है; ‘विश्वासयोग्य’ दोनों पहलुओं को समेटता है।
- source_word: ἡγήσατο
  choice: समझकर
  rationale: इसका अर्थ किसी को मानना या ऐसा विचार करना है; कृदंत-संबंध को हिंदी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: θέμενος εἰς διακονίαν
  choice: सेवा में नियुक्त किया
  rationale: शाब्दिक ‘रखना’ इस संदर्भ में किसी कार्य के लिए ठहराने या नियुक्त करने का भाव देता है; ‘सेवा’ διακονία की व्यापकता को बनाए रखती है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: अभिषिक्त यीशु
  rationale: ‘मसीह’ आधुनिक हिंदी बाइबलीय भाषा में परिचित है और उपाधि के रूप में स्वाभाविक रहता है; पादटिप्पणी उसके अर्थ को स्पष्ट करती है।
- issue: पौलुस को διακονία में रखे जाने का स्वरूप
  choice: सेवा में नियुक्त किया
  alternative: सेवा में लगाया
  rationale: ‘नियुक्त किया’ सौंपे गए दायित्व को स्पष्ट करता है, जबकि ‘सेवा’ को किसी बाद की संकीर्ण कलीसियाई पद-व्यवस्था तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आदरसूचक बहुवचन ‘उन्होंने’ प्रभु यीशु के लिए स्वाभाविक हिंदी प्रयोग है। वाक्य की संरचना यूनानी तर्कक्रम—सामर्थ्य देना, विश्वासयोग्य समझना और सेवा में नियुक्त करना—को बनाए रखती है।
