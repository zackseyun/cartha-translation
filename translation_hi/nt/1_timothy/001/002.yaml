base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/002.yaml
  text: 'To Timothy[a], my true child in the faith: grace, mercy[b], and peace from God the Father and Messiah Jesus our Lord.'
translation:
  language: hi
  text: 'तीमुथियुस को, जो विश्वास में मेरा सच्चा पुत्र[a] है: परमेश्वर पिता और हमारे प्रभु मसीह यीशु की ओर से अनुग्रह, दया और शांति मिले।


    [a] या, “विश्वास में मेरी सच्ची संतान।” यहाँ आत्मिक संबंध अभिप्रेत है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास में मेरी सच्ची संतान।” यहाँ आत्मिक संबंध अभिप्रेत है।
    reason: τέκνον का अर्थ व्यापक रूप से “संतान” हो सकता है, जबकि पाठ में तीमुथियुस के लिए स्वाभाविक पुल्लिंग रूप “पुत्र” रखा गया है।
lexical_decisions:
- source_word: γνησίῳ
  choice: सच्चा
  rationale: यह पौलुस और तीमुथियुस के आत्मिक संबंध की प्रामाणिकता व्यक्त करता है, जैविक पुत्रत्व नहीं।
- source_word: τέκνῳ
  choice: पुत्र
  rationale: मूल शब्द का व्यापक अर्थ ‘संतान’ है; पुरुष संबोधित व्यक्ति के लिए आधुनिक हिन्दी में ‘पुत्र’ अधिक स्वाभाविक है। पादटिप्पणी मूल की व्यापकता स्पष्ट करती है।
- source_word: ἐν πίστει
  choice: विश्वास में
  rationale: यह मूल वाक्यांश की संक्षिप्तता और उसके संभावित अर्थ—साझे विश्वास के क्षेत्र में आत्मिक संबंध—को बिना अनावश्यक रूप से निश्चित किए सुरक्षित रखता है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में प्रयुक्त इस धर्मवैचारिक शब्द का मानक और सटीक हिन्दी रूप।
- source_word: ἔλεος
  choice: दया
  rationale: मूल शब्द का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: εἰρήνη
  choice: शांति
  rationale: अभिवादन में निहित पूर्ण कुशल और मेल के भाव को व्यक्त करने वाला प्रचलित अनुवाद।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ यीशु की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में स्वीकृत उपाधिगत रूप है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का मानक हिन्दी अनुवाद, जो यहाँ यीशु के अधिकार और सम्मान को बनाए रखता है।
theological_decisions:
- issue: ἐν πίστει का आशय
  choice: विश्वास में
  alternative: विश्वास के कारण / उस विश्वास में
  rationale: चुना हुआ रूप साझा मसीही विश्वास के क्षेत्र और व्यक्तिगत विश्वास—दोनों से जुड़ी संभावित अर्थ-छाया को खुला रखता है।
- issue: Χριστοῦ Ἰησοῦ का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट यीशु
  rationale: Χριστός को उपाधि मानकर अर्थपूर्ण हिन्दी रूप ‘मसीह’ दिया गया है, जबकि यीशु का नाम लिप्यंतरित रखा गया है।
- issue: ग्रीक अभिवादन में निहित क्रिया
  choice: शांति मिले
  alternative: अनुग्रह, दया और शांति
  rationale: मूल में क्रिया निहित है; हिन्दी में ‘मिले’ जोड़ने से अभिवादन स्वाभाविक और स्पष्ट बनता है, बिना उसके आशय को बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अनुग्रह, दया और शांति’ पारंपरिक धर्मवैचारिक शब्दावली को बनाए रखते हैं; वाक्य-विन्यास स्वाभाविक हिन्दी अभिवादन के अनुरूप है।
