source:
  edition: SBLGNT
  text: εἰδὼς τοῦτο, ὅτι δικαίῳ νόμος οὐ κεῖται, ἀνόμοις δὲ καὶ ἀνυποτάκτοις, ἀσεβέσι καὶ ἁμαρτωλοῖς, ἀνοσίοις καὶ βεβήλοις, πατρολῴαις καὶ μητρολῴαις, ἀνδροφόνοις,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/009.yaml
  text: 'understanding this: the law is not laid down for a righteous man, but for the lawless and rebellious, the ungodly and sinful, the unholy and profane, those who kill their fathers and those who kill their mothers, murderers,'
translation:
  language: hi
  text: यह जानते हुए कि व्यवस्था किसी धर्मी मनुष्य के लिए नहीं ठहराई गई, बल्कि व्यवस्था-विहीनों और विद्रोहियों, परमेश्वर का आदर न करने वालों और पापियों, अपवित्रों और पवित्र बातों का अनादर करने वालों, अपने पिता की हत्या करने वालों और अपनी माता की हत्या करने वालों,[a] और हत्यारों के लिए ठहराई गई है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “अपने पिता पर हिंसक प्रहार करने वालों और अपनी माता पर हिंसक प्रहार करने वालों”; यूनानी शब्द माता-पिता पर हिंसक प्रहार का अर्थ भी दे सकते हैं, यद्यपि इस प्रसंग में “हत्या करने” का अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς τοῦτο
  choice: यह जानते हुए
  rationale: कृदंत का ज्ञान-संबंधी अर्थ और पिछले निर्देश से उसका संबंध स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: δικαίῳ
  choice: किसी धर्मी मनुष्य के लिए
  rationale: एकवचन पुल्लिंग रूप को प्रतिनिधिक अर्थ सहित रखा गया है; ‘किसी’ सामान्य कथन को हिन्दी में स्वाभाविक बनाता है।
- source_word: νόμος οὐ κεῖται
  choice: व्यवस्था ... नहीं ठहराई गई
  rationale: κεῖται के स्थापित या निर्धारित किए जाने के वैधानिक भाव को रखता है और ‘लागू नहीं होती’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἀνόμοις
  choice: व्यवस्था-विहीनों
  rationale: नैतिक और विधिक दोनों अर्थों में व्यवस्था को न मानने का भाव संक्षेप में व्यक्त होता है।
- source_word: ἀνυποτάκτοις
  choice: विद्रोहियों
  rationale: अधीन होने से इनकार का अर्थ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἀσεβέσι
  choice: परमेश्वर का आदर न करने वालों
  rationale: ईश्वर के प्रति श्रद्धाहीनता का भाव स्पष्ट करता है और निकटवर्ती पदों से भेद बनाए रखता है।
- source_word: ἁμαρτωλοῖς
  choice: पापियों
  rationale: व्यक्ति-सूचक बहुवचन सूची में स्वाभाविक और प्रचलित हिन्दी समतुल्य है।
- source_word: ἀνοσίοις
  choice: अपवित्रों
  rationale: पवित्रता के उल्लंघन का संक्षिप्त और परिचित समतुल्य है।
- source_word: βεβήλοις
  choice: धर्म-विरोधियों
  rationale: जो पवित्र है उसका अनादर करने के भाव को सामान्य पाठक के लिए व्यक्त करता है और ‘अपवित्रों’ की सीधी पुनरावृत्ति से बचाता है।
- source_word: πατρολῴαις
  choice: अपने पिता की हत्या करने वालों
  rationale: इस दुर्लभ पद का संदर्भ में संभावित प्रबल अर्थ चुना गया है; प्रहार करने का संभव अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: μητρολῴαις
  choice: अपनी माता की हत्या करने वालों
  rationale: पिछले पद के समानांतर हत्या का संभावित प्रबल अर्थ देता है और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: ἀνδροφόνοις
  choice: हत्यारों
  rationale: अवैध मानव-वध का सीधा, सुबोध और सूची के अनुकूल हिन्दी रूप है।
theological_decisions:
- issue: δικαίῳ में प्रतिनिधिक पुल्लिंग
  choice: किसी धर्मी मनुष्य के लिए
  alternative: किसी धर्मी व्यक्ति के लिए / धर्मियों के लिए
  rationale: यूनानी एकवचन पुल्लिंग है, पर कथन प्रतिनिधिक है। हिन्दी में ‘मनुष्य’ मूल रूप और सामान्य मानवीय संदर्भ दोनों को बनाए रखता है।
- issue: πατρολῴαις / μητρολῴαις का अर्थ-क्षेत्र
  choice: अपने पिता की हत्या करने वालों / अपनी माता की हत्या करने वालों
  alternative: अपने पिता को मारने-पीटने वालों / अपनी माता को मारने-पीटने वालों
  rationale: शब्द माता-पिता पर हिंसक प्रहार या उनकी हत्या, दोनों का संकेत दे सकते हैं। निकटवर्ती हत्या-संबंधी सूची में हत्या का अर्थ संभावित है, पर अनिश्चितता पाद-टिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर दोष-सूची की लय बचाई गई है; हिन्दी में वाक्य पूरा और स्पष्ट करने के लिए अंत में ‘ठहराई गई है’ दोहराया गया है।
