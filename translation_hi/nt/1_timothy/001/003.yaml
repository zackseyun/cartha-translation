reference: 1 Timothy 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καθὼς παρεκάλεσά σε προσμεῖναι ἐν Ἐφέσῳ, πορευόμενος εἰς Μακεδονίαν, ἵνα παραγγείλῃς τισὶν μὴ ἑτεροδιδασκαλεῖν
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/003.yaml
  text: Just as I urged you to remain in Ephesus when I was going into Macedonia[a], so that you might instruct certain people not to teach different doctrine,
translation:
  language: hi
  text: जैसा कि मैंने मकिदुनिया जाते समय तुमसे आग्रह किया था कि तुम इफिसुस में ही रहो, ताकि कुछ लोगों को आदेश दो कि वे भिन्न शिक्षा न दें।ᵃ
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καθὼς
  choice: जैसा
  rationale: पूर्व आग्रह का स्मरण कराते हुए वाक्य को आगे के कथन से जोड़ता है; हिंदी में ‘जैसा’ इसका स्वाभाविक आरंभ है।
- source_word: παρεκάλεσά
  choice: आग्रह किया
  rationale: यहाँ क्रिया गंभीर अनुरोध या प्रबल आग्रह व्यक्त करती है, पर स्वयं तीमुथियुस को दी गई आज्ञा जितनी कठोर नहीं है।
- source_word: προσμεῖναι
  choice: में ही रहो
  rationale: किसी स्थान पर बने रहने का अर्थ व्यक्त करता है; ‘ही’ वहाँ टिके रहने पर प्रसंगगत बल देता है।
- source_word: ἐν Ἐφέσῳ
  choice: इफिसुस में
  rationale: स्थानवाचक वाक्यांश का प्रचलित हिंदी रूप।
- source_word: πορευόμενος εἰς Μακεδονίαν
  choice: मकिदुनिया जाते समय
  rationale: कृदंत को पौलुस की यात्रा की समयगत परिस्थिति के रूप में स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक संबंध को सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: παραγγείλῃς
  choice: आदेश दो
  rationale: क्रिया अधिकारपूर्वक निर्देश देने का भाव रखती है; कलीसियाई शिक्षा को रोकने के इस प्रसंग में ‘आदेश दो’ उसके बल को स्पष्टतः व्यक्त करता है।
- source_word: τισὶν
  choice: कुछ लोगों को
  rationale: विशिष्ट किंतु अनाम व्यक्तियों के लिए स्वाभाविक हिंदी अभिव्यक्ति।
- source_word: ἑτεροδιδασκαλεῖν
  choice: कोई भिन्न शिक्षा न दें
  rationale: शब्द प्रचलित प्रेरितीय शिक्षा से अलग शिक्षा देने को दर्शाता है। ‘भिन्न शिक्षा’ मूल के भेद को बनाए रखती है और ‘झूठी शिक्षा’ जैसा अतिरिक्त मूल्यांकन नहीं जोड़ती।
theological_decisions:
- issue: παραγγείλῃς के अधिकारसूचक बल को कैसे व्यक्त किया जाए
  choice: आदेश दो
  alternative: निर्देश दो
  rationale: यह सामान्य सलाह नहीं बल्कि पौलुस द्वारा सौंपा गया अधिकारपूर्ण निषेध है। ‘आदेश दो’ मूल क्रिया के बल को स्पष्ट करता है, जबकि ‘निर्देश दो’ कुछ हल्का पड़ सकता है।
- issue: ἑτεροδιδασκαλεῖν का मूल्यांकनात्मक बल
  choice: भिन्न शिक्षा दें
  alternative: झूठी शिक्षा दें
  rationale: यौगिक क्रिया अलग या अन्य शिक्षा देने को सीधे व्यक्त करती है। प्रसंग उसे अनुचित ठहराता है, पर ‘झूठी’ कहना शब्द के प्रत्यक्ष अर्थ से अधिक व्याख्यात्मक होगा।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। वाक्य मूल यूनानी की अधूरी, अगले पद में जारी रहने वाली संरचना को पूर्ण विराम लगाकर कृत्रिम रूप से समाप्त नहीं करता। स्थाननामों के लिए प्रचलित बाइबलीय रूप ‘इफिसुस’ और ‘मकिदुनिया’ रखे गए हैं।
