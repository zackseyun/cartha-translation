  text: τῷ δὲ βασιλεῖ τῶν αἰώνων, ἀφθάρτῳ, ἀοράτῳ, ⸀μόνῳ θεῷ, τιμὴ καὶ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/017.yaml
  text: To the King of the ages[a], immortal, invisible, the only God, be honor and glory forever and ever. Amen.
translation:
  language: hi
  text: युगों के राजा, अविनाशी, अदृश्य, एकमात्र परमेश्वर[a] को युगानुयुग आदर और महिमा हो। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हस्तलिपियों में है: “एकमात्र बुद्धिमान परमेश्वर।”'
    reason: textual_variant
lexical_decisions:
- source_word: βασιλεῖ τῶν αἰώνων
  choice: युगों के राजा
  rationale: यह संबंधकारक रचना को स्पष्ट रूप से बनाए रखता है और αἰών की ‘युग’ संबंधी भाषा को केवल ‘अनन्त राजा’ में समेटने के बजाय सभी युगों पर परमेश्वर के राज्य को व्यक्त करता है।
- source_word: ἀφθάρτῳ
  choice: अविनाशी
  rationale: परमेश्वर के विषय में यह क्षय और मृत्यु से परे होने का अर्थ स्वाभाविक, संक्षिप्त और गरिमापूर्ण ढंग से देता है।
- source_word: ἀοράτῳ
  choice: अदृश्य
  rationale: यह ἀόρατος का सीधा और प्रचलित हिन्दी पर्याय है तथा स्तुतिपरक शैली के अनुकूल है।
- source_word: μόνῳ θεῷ
  choice: एकमात्र परमेश्वर
  rationale: यह SBLGNT के संक्षिप्त पाठ का सीधा अनुवाद है और उसके स्पष्ट एकेश्वरवादी बल को सुरक्षित रखता है।
- source_word: τιμὴ καὶ δόξα
  choice: आदर और महिमा
  rationale: यह दोनों संज्ञाओं के अर्थ और स्तुतिपरक युग्म को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनन्त अवधि बताने वाली यूनानी रूढ़ि का संक्षिप्त, स्वाभाविक और बाइबलीय हिन्दी रूप है।
- source_word: ἀμήν
  choice: आमीन
  rationale: हिन्दी बाइबल और मसीही उपासना में प्रचलित पारंपरिक लिप्यंतरण रखा गया है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया
  rationale: यहाँ δὲ स्तुति की ओर संक्रमण दर्शाता है; हिन्दी में पद को सीधे आरम्भ करना स्वाभाविक है और ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ उत्पन्न हो सकता है।
theological_decisions:
- issue: μόνῳ θεῷ के एकेश्वरवादी बल को बनाए रखते हुए व्यापक पौलुसी और कैनोनिक मसीह-साक्ष्य के साथ तनाव
  choice: एकमात्र परमेश्वर
  alternative: केवल परमेश्वर
  rationale: अनुवाद मूल पाठ की स्पष्ट घोषणा को बिना अतिरिक्त सिद्धान्तगत व्याख्या जोड़े ज्यों का त्यों रखता है।
- issue: μόνῳ के बाद σοφῷ (‘बुद्धिमान’) वाला पाठांतर
  choice: मुख्य पाठ में ‘बुद्धिमान’ को न रखना
  alternative: एकमात्र बुद्धिमान परमेश्वर
  rationale: दिया गया SBLGNT पाठ σοφῷ को सम्मिलित नहीं करता। परिचित विस्तृत पाठ को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण स्तुतिपरक हिन्दी में है। विशेषणों की क्रमबद्धता यूनानी पाठ की लय को बनाए रखती है; ‘युगों के राजा’ और ‘युगानुयुग’ अलग-अलग αἰών-रचनाओं को स्पष्ट रखते हैं।
