  text: according to the gospel of the glory of the blessed God[a], which was entrusted to me.
translation:
  language: hi
  text: उस धन्य परमेश्वर की महिमा के सुसमाचार के अनुसार[a], जो मुझे सौंपा गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार रूप में, “धन्य परमेश्वर का महिमामय सुसमाचार।”
    reason: alternative_reading
lexical_decisions:
- source_word: κατὰ
  choice: के अनुसार
  rationale: कर्मकारक के साथ κατά यहाँ उस मानक को बताता है जिसके अनुसार पहले कही गई बात को समझा जाता है; ‘के अनुसार’ स्वाभाविक और औपचारिक दोनों है।
- source_word: εὐαγγέλιον
  choice: सुसमाचार
  rationale: पौलुस के संदर्भ में यह प्रचलित, सहज-बोध्य और धर्मवैचारिक भार को बनाए रखने वाला हिन्दी शब्द है।
- source_word: τῆς δόξης
  choice: महिमा के
  rationale: सम्बन्धकारक रचना को विशेषण ‘महिमामय’ में बदलने के बजाय यथासंभव बनाए रखा गया है, ताकि इसका वर्णनात्मक अथवा सम्बन्धसूचक अर्थ खुला रहे।
- source_word: μακαρίου
  choice: धन्य
  rationale: परमेश्वर के लिए μακάριος का गरिमापूर्ण और उपयुक्त हिन्दी समतुल्य ‘धन्य’ है; ‘सुखी’ यहाँ हल्का और अनुपयुक्त लगेगा।
- source_word: θεοῦ
  choice: परमेश्वर की
  rationale: θεός का प्रचलित हिन्दी रूप; सम्बन्धकारक का रूप वाक्य की संरचना के अनुरूप है।
- source_word: ὃ
  choice: जो
  rationale: सम्बन्धवाचक सर्वनाम पीछे आए ‘सुसमाचार’ की ओर संकेत करता है। हिन्दी में ‘जो ... सौंपा गया’ स्वाभाविक है।
- source_word: ἐπιστεύθην
  choice: मुझे सौंपा गया
  rationale: यहाँ πιστεύω का कर्मवाच्य अर्थ ‘विश्वास करना’ नहीं, बल्कि किसी वस्तु या दायित्व का सौंपा जाना है।
- source_word: ἐγώ
  choice: मुझे
  rationale: ग्रीक का स्पष्ट प्रथम-पुरुष सर्वनाम अनुवाद में ‘मुझे’ द्वारा व्यक्त है; अलग से कृत्रिम बलाघात नहीं जोड़ा गया।
theological_decisions:
- issue: τὸ εὐαγγέλιον τῆς δόξης τοῦ μακαρίου θεοῦ में सम्बन्धकारकों का संबंध
  choice: उस धन्य परमेश्वर की महिमा का सुसमाचार
  alternative: धन्य परमेश्वर का महिमामय सुसमाचार
  rationale: मुख्य पाठ ग्रीक की ‘महिमा के सुसमाचार’ वाली रचना और उसकी वास्तविक अर्थगत खुलावट को बनाए रखता है। अधिक मुहावरेदार विशेषणात्मक अर्थ पादटिप्पणी में दिया गया है।
- issue: ἐπιστεύθην का अर्थ
  choice: मुझे सौंपा गया
  alternative: मैंने विश्वास किया
  rationale: संदर्भ, कर्मवाच्य रूप और सुसमाचार को सौंपे जाने की पौलुसी भाषा यहाँ ‘सौंपना’ अर्थ की पुष्टि करते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘धन्य परमेश्वर’ और ‘सुसमाचार’ जैसे स्थापित बाइबलीय पद रखे गए हैं, जबकि ग्रीक सम्बन्धकारक की अर्थगत खुलावट मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित है।
