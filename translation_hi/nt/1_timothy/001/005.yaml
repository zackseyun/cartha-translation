  text: The goal of the instruction is love from a pure heart and a good conscience and sincere faith[c][b][a],
translation:
  language: hi
  text: इस निर्देश[b] का लक्ष्य[a] शुद्ध हृदय, अच्छे विवेक और निष्कपट विश्वास[c] से उत्पन्न प्रेम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘लक्ष्य’ के स्थान पर ‘उद्देश्य’ या ‘परिणाम’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘निर्देश’ के स्थान पर ‘आदेश’ या ‘जिम्मेदारी-भरा आदेश’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘निष्कपट’ का अर्थ ‘कपट-रहित’ भी है; कुछ संदर्भों में πίστις का अर्थ ‘विश्वासयोग्यता’ या ‘भरोसा’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τέλος
  choice: लक्ष्य
  rationale: यहाँ शब्द निर्देश की समाप्ति नहीं, बल्कि उसके अभिप्रेत उद्देश्य या परिणाम को व्यक्त करता है। ‘लक्ष्य’ इस प्रयोजनात्मक अर्थ को सहज हिंदी में स्पष्ट करता है।
- source_word: παραγγελίας
  choice: निर्देश
  rationale: संदर्भ में यह तीमुथियुस को दिए गए आदेश और शिक्षापरक दायित्व की ओर संकेत करता है। ‘निर्देश’ इसके आदेशात्मक और पासबानी, दोनों पहलुओं को स्वाभाविक हिंदी में समेटता है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: यह शब्द नैतिक और संबंधपरक प्रेम को व्यक्त करता है; ‘प्रेम’ इसका स्वाभाविक और स्थापित हिंदी रूप है।
- source_word: ἐκ
  choice: से उत्पन्न होता है
  rationale: ἐκ यहाँ स्रोत या उद्गम बताता है। हिंदी में ‘से उत्पन्न होता है’ स्पष्ट करता है कि प्रेम आगे बताई गई तीन बातों से निकलता है।
- source_word: καθαρᾶς καρδίας
  choice: शुद्ध हृदय
  rationale: यह रूपक व्यक्ति के निर्मल आंतरिक और नैतिक जीवन को व्यक्त करता है और मूल पदावली के निकट रहता है।
- source_word: συνειδήσεως ἀγαθῆς
  choice: अच्छे विवेक
  rationale: ‘अच्छा विवेक’ यूनानी विशेषण ἀγαθῆς को बनाए रखता है और ‘दोषरहित विवेक’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस संदर्भ में ‘विश्वास’ प्राथमिक अर्थ है, पर ‘विश्वासयोग्यता’ या ‘भरोसा’ की संभावित अर्थछटाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: ἀνυποκρίτου
  choice: निष्कपट
  rationale: इसका शाब्दिक भाव ‘कपट-रहित’ है। ‘निष्कपट’ आधुनिक, गरिमापूर्ण और विश्वास के साथ स्वाभाविक विशेषण है।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं
  rationale: δέ यहाँ हल्का संक्रमण या विरोध दर्शाता है। हिंदी वाक्य में संदर्भ और वाक्य-आरंभ से यह संबंध पर्याप्त रूप से प्रकट होता है; ‘अब’ जोड़ने से अनावश्यक काल-सूचक अर्थ आ सकता है।
theological_decisions:
- issue: πίστεως ἀνυποκρίτου में πίστις का अर्थ
  choice: निष्कपट विश्वास
  alternative: निष्कपट विश्वासयोग्यता; निष्कपट भरोसा
  rationale: यहाँ सच्चा विश्वास प्रेम के स्रोतों में से एक के रूप में समझना संदर्भानुकूल है। फिर भी πίστις की अर्थ-सीमा में विश्वासयोग्यता और भरोसा भी आते हैं, इसलिए इन विकल्पों को बिना निर्णायक रूप से नकारे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। वाक्य को स्वाभाविक बनाने के लिए स्रोत-सूचक ἐκ को ‘से उत्पन्न होता है’ के रूप में खोला गया है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
