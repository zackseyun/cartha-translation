  text: We know that the law is good[a], if one uses it lawfully,
translation:
  language: hi
  text: और हम जानते हैं कि व्यवस्था अच्छी है, यदि कोई उसका उपयोग व्यवस्था के अनुसार[a] करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि कोई उसका उचित रीति से उपयोग करता है” अथवा “यदि कोई उसका वैध रूप से उपयोग करता है।”
    reason: νομίμως का अर्थ ‘व्यवस्था के अनुसार’ है; संदर्भ के अनुसार ‘उचित रीति से’ और ‘वैध रूप से’ निकटवर्ती अनुवाद हैं।
lexical_decisions:
- source_word: Οἴδαμεν
  choice: हम जानते हैं
  rationale: οἶδα का पूर्ण रूप यहाँ वर्तमान अर्थ में स्थिर ज्ञान व्यक्त करता है; आधुनिक हिन्दी में ‘हम जानते हैं’ स्वाभाविक और सटीक है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ पिछले विचार से हल्का विरोध अथवा संक्रमण दिखाता है। ‘पर’ इसे बिना प्रबल विरोध बनाए संक्षेप में व्यक्त करता है।
- source_word: καλὸς
  choice: अच्छी
  rationale: καλός व्यवस्था की सकारात्मक गुणवत्ता बताता है; ‘अच्छी’ व्यापक नैतिक अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: यह पौलुस के संदर्भ में मान्य ‘व्यवस्था’ को सूचित करता है। केवल ‘व्यवस्था’ रखने से इसे मुख्य पाठ में स्पष्ट रूप से ‘मूसा की व्यवस्था’ तक सीमित नहीं किया गया।
- source_word: ἐάν τις
  choice: यदि कोई
  rationale: यह सामान्य शर्त है। ‘यदि कोई’ यूनानी के अनिश्चित एकवचन को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: αὐτῷ
  choice: उसका
  rationale: सर्वनाम का संदर्भ व्यवस्था से है; χράομαι के साथ हिन्दी में ‘उसका उपयोग’ स्वाभाविक प्रयोग है।
- source_word: νομίμως
  choice: व्यवस्थापूर्वक
  rationale: νομίμως का अर्थ व्यवस्था अथवा उचित मानदंड के अनुरूप है। ‘व्यवस्थापूर्वक’ νόμος के साथ मूल के शब्द-संबंध को यथासंभव बनाए रखता है, यद्यपि ‘उचित रीति से’ अधिक सहज विकल्प है।
- source_word: χρῆται
  choice: उपयोग करता है
  rationale: χράομαι का सीधा अर्थ किसी वस्तु को काम में लाना या उसका उपयोग करना है।
theological_decisions:
- issue: ‘व्यवस्था’ का दायरा
  choice: मुख्य पाठ में केवल ‘व्यवस्था’
  alternative: ‘मूसा की व्यवस्था’ अथवा सामान्य अर्थ में ‘कानून’
  rationale: संदर्भ में मूसा की व्यवस्था विशेष रूप से दृष्टि में हो सकती है, पर यूनानी पाठ स्वयं केवल ὁ νόμος कहता है। अनुवाद इस दायरे को व्याख्यात्मक रूप से संकरा नहीं करता।
- issue: νομίμως का अर्थ
  choice: ‘व्यवस्थापूर्वक’ द्वारा व्यवस्था के अनुरूप प्रयोग का संकेत
  alternative: ‘उचित रीति से’ या ‘वैध रूप से’
  rationale: मूल में νόμος और νομίμως का शब्द-संबंध अर्थपूर्ण है। मुख्य पाठ इसे बनाए रखने का प्रयास करता है, जबकि पादटिप्पणी सहज अर्थ-विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘व्यवस्थापूर्वक’ कुछ औपचारिक है, पर मूल के νόμος—νομίμως शब्द-संबंध को सुरक्षित करता है; सहज विकल्प पादटिप्पणी में दिए गए हैं।
