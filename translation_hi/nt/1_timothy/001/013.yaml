source:
  edition: SBLGNT
  text: ⸀τὸ πρότερον ὄντα βλάσφημον καὶ διώκτην καὶ ὑβριστήν· ἀλλὰ ἠλεήθην, ὅτι ἀγνοῶν ἐποίησα ἐν ἀπιστίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/001/013.yaml
  text: formerly a blasphemer and a persecutor and a violent man[a]; but I was shown mercy, because I acted ignorantly in unbelief[d][c][b],
translation:
  language: hi
  text: पहले मैं निन्दा करनेवाला, सतानेवाला और हिंसक व्यक्ति था[a]; पर मुझ पर दया की गई[b], क्योंकि मैंने अविश्वास में अनजाने में ऐसा किया[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उद्दण्ड व्यक्ति” या “क्रूर व्यक्ति।” यूनानी शब्द केवल घमण्ड नहीं, बल्कि अपमानजनक और उग्र हिंसक व्यवहार को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे दया मिली।”
    reason: lexical_alternative
  - marker: c
    text: या “मैंने अज्ञान में ऐसा किया।”
    reason: lexical_alternative
  - marker: d
    text: या “विश्वासहीनता में।” यहाँ सम्भवतः आशय विश्वास के अभाव से है, न कि वाचा के प्रति विश्वासघात से।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ πρότερον ὄντα
  choice: हालाँकि पहले मैं ... था
  rationale: पूर्व पद से जुड़े कर्मकारक कृदन्त को हिन्दी में स्वाभाविक रूप से रियायती उपवाक्य बनाया गया है; πρότερον का पूर्वकालिक अर्थ ‘पहले’ से सुरक्षित रहता है।
- source_word: βλάσφημον
  choice: परमेश्वर की निन्दा करनेवाला
  rationale: संज्ञात्मक प्रयोग को सामान्य हिन्दी में स्पष्ट किया गया है। सन्दर्भ में पौलुस की पूर्व धार्मिक शत्रुता के कारण ‘परमेश्वर की निन्दा’ अभिप्रेत है।
- source_word: διώκτην
  choice: सतानेवाला
  rationale: यह कलीसिया और विश्वासियों के विरुद्ध उत्पीड़न करनेवाले व्यक्ति का सीधा, सहज हिन्दी रूप है।
- source_word: ὑβριστήν
  choice: हिंसक व्यक्ति
  rationale: शब्द अपमानजनक, उद्दण्ड और चोट पहुँचानेवाली हिंसा का बोध कराता है। मुख्य पाठ में सुबोध ‘हिंसक व्यक्ति’ रखा गया और व्यापक अर्थ पादटिप्पणी में बताया गया है।
- source_word: ἠλεήθην
  choice: मुझ पर दया की गई
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखते हुए परमेश्वर को अनकहा कर्ता रहने दिया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ कारण अथवा व्याख्यात्मक आधार का स्वाभाविक अर्थ है; अनुवाद अज्ञान को दया का अधिकारी बनाने की अतिरिक्त धारणा नहीं जोड़ता।
- source_word: ἀγνοῶν ἐποίησα
  choice: मैंने ... अनजाने में ऐसा किया था
  rationale: कृदन्त और क्रिया को सहज हिन्दी में जोड़ा गया है। ‘ऐसा’ पूर्वोक्त निन्दा, उत्पीड़न और हिंसा की ओर संकेत करता है।
- source_word: ἐν ἀπιστίᾳ
  choice: अविश्वास में
  rationale: इस प्रसंग में ἀπιστία मुख्यतः विश्वास के अभाव को दर्शाता है; ‘विश्वासघात’ सम्भव अर्थ है, पर यहाँ कम सम्भावित है।
theological_decisions:
- issue: ὅτι से आरम्भ होनेवाले कथन और दया का सम्बन्ध
  choice: ‘क्योंकि’ के द्वारा पौलुस के अज्ञान और अविश्वास में किए गए काम को दया दिखाए जाने के कारण अथवा व्याख्यात्मक आधार के रूप में रखा गया है।
  alternative: इसे केवल साथ की परिस्थिति मानकर ‘जबकि’ या ‘इस अर्थ में कि’ कहना।
  rationale: ὅτι का सामान्य कारणात्मक बल सुरक्षित रखा गया है, पर यह नहीं जोड़ा गया कि अज्ञान ने दया अर्जित की या पौलुस को निर्दोष ठहराया।
- issue: ἠλεήθην में दया देनेवाले की पहचान
  choice: कर्मवाच्य ‘मुझ पर दया की गई’
  alternative: ‘परमेश्वर ने मुझ पर दया की’
  rationale: प्रसंग में परमेश्वर निहित कर्ता हैं, किन्तु यूनानी पाठ उन्हें इस वाक्यांश में स्पष्ट नहीं करता; इसलिए मूल की संरचना और निहितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हालाँकि ... फिर भी’ हिन्दी में पद के रियायती सम्बन्ध को स्वाभाविक बनाता है। सूची में अनावश्यक संस्कृतनिष्ठ शब्दावली से बचते हुए धार्मिक अर्थ की स्पष्टता बनाए रखी गई है।
