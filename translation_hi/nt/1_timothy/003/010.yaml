  text: And these also must first be tested[a]; then let them serve[b], being beyond reproach.
translation:
  language: hi
  text: और इन्हें भी पहले परखा जाए; फिर, यदि वे दोषारोपण से परे हों, तो वे सेवा करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι
  choice: इन्हें भी
  rationale: यह पहले से चर्चा में आए सेवकों की ओर संकेत करता है और δὲ के साथ इसके अतिरिक्त संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी में स्वयं ‘पुरुष’ शब्द नहीं है।
- source_word: δοκιμαζέσθωσαν
  choice: परखा जाए
  rationale: δοκιμάζω किसी की योग्यता या प्रामाणिकता जाँचने के लिए परीक्षा करने का भाव रखता है। कर्मवाच्य आज्ञार्थ को हिन्दी में ‘परखा जाए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: πρῶτον … εἶτα
  choice: पहले … फिर
  rationale: 'दोनों क्रियाओं का स्पष्ट कालक्रम सुरक्षित रहता है: सेवा से पहले जाँच।'
- source_word: διακονείτωσαν
  choice: सेवा करें
  rationale: διακονέω का मूल अर्थ ‘सेवा करना’ है। निकटवर्ती संदर्भ इसे कलीसियाई सेवक की मान्य भूमिका से जोड़ता है, पर इस उपवाक्य में पदनाम संज्ञा स्पष्ट रूप से नहीं है; इसलिए मुख्य पाठ में व्यापक शाब्दिक अर्थ रखा गया है।
- source_word: ἀνέγκλητοι
  choice: निर्दोष पाए जाएँ
  rationale: शब्द का आशय यह है कि उनके विरुद्ध कोई ठोस या मान्य आरोप न हो; इसका अर्थ पापरहित सिद्धता नहीं है। ‘निर्दोष पाए जाएँ’ जाँच के संदर्भ में यह भाव सहज हिन्दी में देता है।
- source_word: ὄντες
  choice: यदि वे … पाए जाएँ
  rationale: वर्तमान कृदन्त सेवा के साथ जुड़ी अवस्था या योग्यता बताता है। हिन्दी में शर्तसूचक रचना संबंध को स्पष्ट करती है, यद्यपि यूनानी में अलग से ‘यदि’ नहीं है।
theological_decisions:
- issue: διακονείτωσαν को सामान्य सेवा के रूप में अनूदित किया जाए या पद-विशेष की सेवा के रूप में
  choice: सेवा करें
  alternative: सेवक के रूप में सेवा करें
  rationale: तात्कालिक संदर्भ पद-विशेष का संकेत देता है, पर क्रिया स्वयं केवल ‘सेवा करना’ कहती है। मुख्य पाठ स्रोत की अभिव्यक्ति और संदर्भगत अर्थ के बीच तनाव को बनाए रखता है।
- issue: ἀνέγκλητοι का आशय पापरहितता है या आरोप से मुक्त चरित्र
  choice: निर्दोष पाए जाएँ
  alternative: दोषारोपण से परे हों
  rationale: योग्यताओं की सूची में यह शब्द पूर्ण पापरहितता नहीं, बल्कि किसी सिद्ध या मान्य आरोप का न होना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘परखा जाए’ औपचारिक जाँच का भाव देता है, जबकि ‘सेवा करें’ यूनानी क्रिया की वास्तविक व्यापकता को सुरक्षित रखता है।
