  text: μὴ νεόφυτον, ἵνα μὴ τυφωθεὶς εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/006.yaml
  text: He must not be a recent convert[a], so that he may not become puffed up and fall into the judgment of the devil.
translation:
  language: hi
  text: वह नया विश्वासी न हो, कहीं ऐसा न हो कि घमण्ड से फूलकर वह शैतान के दण्ड[a] में पड़ जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शैतान के समान दण्ड पाए’; अथवा ‘शैतान से जुड़े दण्ड में पड़ जाए।’
    reason: सम्बन्धकारक τοῦ διαβόλου की वैकल्पिक व्याख्याएँ
lexical_decisions:
- source_word: νεόφυτον
  choice: नया विश्वासी
  rationale: इसका शाब्दिक अर्थ ‘नया रोपा हुआ’ है, पर यहाँ रूपक के रूप में ऐसे व्यक्ति के लिए प्रयुक्त है जो हाल ही में विश्वास में आया हो। ‘नया विश्वासी’ आधुनिक हिन्दी में इस कलीसियाई आशय को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: τυφωθεὶς
  choice: घमण्ड से फूलकर
  rationale: यह क्रिया अहंकार से फूल उठने का भाव रखती है। इस चयन से मूल रूपक और नैतिक चेतावनी दोनों बने रहते हैं।
- source_word: κρίμα
  choice: दण्ड
  rationale: κρίμα का अर्थ ‘न्याय-निर्णय’ या ‘दण्ड/दोषदण्ड’ हो सकता है। इस प्रसंग में ‘दण्ड में पड़ना’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी सम्बन्धवाचक पदबंध की वास्तविक अस्पष्टता स्पष्ट करती है।
- source_word: τοῦ διαβόλου
  choice: शैतान के
  rationale: 'यूनानी सम्बन्धकारक अस्पष्ट है: यह शैतान को मिले दण्ड या शैतान से जुड़े/उसके द्वारा लाए गए दण्ड की ओर संकेत कर सकता है। सीधा सम्बन्धवाचक अनुवाद इस तनाव को मुख्य पाठ में सुरक्षित रखता है।'
- source_word: ἐμπέσῃ
  choice: में पड़ जाए
  rationale: यह मूल क्रिया के ‘किसी खतरनाक दशा या परिणाम में पड़ने’ वाले रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἵνα μὴ
  choice: कहीं ऐसा न हो कि
  rationale: यह निषेधात्मक उद्देश्य अथवा आशंकित परिणाम को आधुनिक, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: εἰς κρίμα ἐμπέσῃ τοῦ διαβόλου का अर्थ
  choice: मुख्य पाठ में ‘शैतान के दण्ड में पड़ जाए’ कहकर अस्पष्टता बनाए रखी गई है।
  alternative: ‘शैतान के समान दण्ड पाए’ अथवा ‘शैतान से जुड़े/उसके द्वारा लाए गए दण्ड में पड़े।’
  rationale: τοῦ διαβόλου को शैतान पर आए दण्ड का सम्बन्धकारक भी समझा जा सकता है और शैतान से जुड़े या उसके द्वारा लाए गए दण्ड का भी। मूल पाठ किसी एक अर्थ को निर्विवाद रूप से निश्चित नहीं करता, इसलिए मुख्य अनुवाद इसे चुपचाप नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘नया विश्वासी’ सामान्य पाठक के लिए स्पष्ट है; ‘घमण्ड से फूलकर’ मूल रूपक को स्वाभाविक ढंग से सुरक्षित रखता है।
