translation:
  language: hi
  text: इसी प्रकार डीकनों को भी आदरणीय, दोहरी बात न करने वाले, बहुत दाखरस में आसक्त न रहने वाले, और लज्जाजनक लाभ के लोभी न होना चाहिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διακόνους
  choice: सेवक
  rationale: यहाँ शब्द कलीसिया में पहचानी गई सेवा-भूमिका को सूचित करता है; ‘सेवक’ यूनानी शब्द के मूल अर्थ को स्वाभाविक हिन्दी में रखता है और बाद की किसी विशिष्ट पद-व्यवस्था को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: ὡσαύτως
  choice: इसी प्रकार
  rationale: यह पिछले पदों में अध्यक्षों की योग्यताओं से निरंतरता दिखाते हुए संबंधित दूसरे समूह का परिचय देता है।
- source_word: σεμνούς
  choice: आदरणीय
  rationale: यह सम्मान के योग्य, गंभीर और मर्यादित चरित्र को व्यक्त करता है, बिना उदास या कठोर स्वभाव का अर्थ दिए।
- source_word: μὴ διλόγους
  choice: दोहरी बात करनेवाले न हों
  rationale: यूनानी के सजीव भाव—अलग-अलग लोगों से अलग बात कहने अथवा वाणी में कपट करने—को सुबोध हिन्दी में बनाए रखता है।
- source_word: μὴ οἴνῳ πολλῷ προσέχοντας
  choice: बहुत दाखमधु में मन न लगाए हों
  rationale: προσέχω की निरंतर लगाव या ध्यान देने की धारणा को व्यक्त करता है और πολλῷ, ‘बहुत’, को सुरक्षित रखता है; आधुनिक चिकित्सकीय ‘लत’ की धारणा आरोपित नहीं करता।
- source_word: μὴ αἰσχροκερδεῖς
  choice: नीच कमाई के लोभी न हों
  rationale: अनुचित, लज्जाजनक या घटिया ढंग से प्राप्त लाभ की लालसा को संक्षिप्त और नैतिक रूप से स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: διάκονος के लिए कलीसियाई पद-संज्ञा
  choice: ‘सेवक’ का प्रयोग, जिसे संदर्भ में मान्य कलीसियाई सेवा-भूमिका समझा जाए
  alternative: ‘डीकन’ अथवा ‘परिचारक’
  rationale: संदर्भ अध्यक्षों के बाद एक पहचाने गए समूह की योग्यताएँ देता है, पर ‘सेवक’ मूल शब्द के अर्थ और भूमिका—दोनों को रखता है तथा बाद की किसी संप्रदायगत पद-संरचना को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘दाखमधु’ मूल के οἶνος को स्पष्ट रखता है; वाक्य की सूचीबद्ध लय और प्रत्येक निषेध सुरक्षित हैं।
