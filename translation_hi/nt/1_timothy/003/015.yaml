  naturalness: The wording is generally clear and dignified modern Hindi. Supplying “मैं यह लिख रहा हूँ ताकि” makes the sentence idiomatic and restores the intended logical relation. “घराना,” “सभा,” “स्तंभ,” and “सहारा” are natural in this register.
  terminology: “परमेश्वर का घराना,” “जीवित परमेश्वर की सभा,” and “सत्य का स्तंभ और सहारा” are suitable and faithful. The footnotes appropriately retain “कलीसिया” and signal the lexical range of ἑδραίωμα without imposing a doctrinal interpretation.
