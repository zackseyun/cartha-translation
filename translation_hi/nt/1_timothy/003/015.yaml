  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δὲ βραδύνω, ἵνα εἰδῇς πῶς δεῖ ἐν οἴκῳ θεοῦ ἀναστρέφεσθαι, ἥτις ἐστὶν ἐκκλησία θεοῦ ζῶντος, στῦλος καὶ ἑδραίωμα τῆς ἀληθείας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/015.yaml
  text: But if I am delayed[a], I write so that you may know how one ought to conduct oneself in the household of God, which is the assembly of the living God[b], the pillar and support of the truth.
translation:
  language: hi
  text: पर यदि मुझे आने में देर हो जाए, तो मैं यह लिख रहा हूँ ताकि तुम जान सको कि परमेश्वर के घराने में किस प्रकार आचरण करना चाहिए, जो जीवित परमेश्वर की सभा[a], सत्य का स्तंभ और सहारा[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या परंपरागत रूप से, “जीवित परमेश्वर की कलीसिया”; “मंडली” भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या “दृढ़ आधार”; “दुर्ग” भी प्रस्तावित है। यूनानी शब्द का ठीक स्थापत्य आशय अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βραδύνω
  choice: मुझे आने में देर हो जाए
  rationale: संदर्भ में यह पौलुस के पहुँचने में विलंब को दर्शाता है। ‘आने में’ जोड़ने से आशय स्वाभाविक हिंदी में स्पष्ट होता है, बिना इसे नैतिक सुस्ती का अर्थ दिए।
- source_word: ἵνα εἰδῇς
  choice: तो तुम जान सको
  rationale: यह यूनानी उद्देश्य-वाचक उपवाक्य को सहज आधुनिक हिंदी में व्यक्त करता है और पिछले पद के ‘लिख रहा हूँ’ पर इसकी निर्भरता बनाए रखता है।
- source_word: πῶς δεῖ ... ἀναστρέφεσθαι
  choice: किस प्रकार आचरण करना चाहिए
  rationale: यह रीति और नैतिक आवश्यकता दोनों को व्यक्त करता है। अव्यक्त कर्ता को बनाए रखने के लिए हिंदी का सामान्य निर्वैयक्तिक रूप ‘करना चाहिए’ उपयुक्त है।
- source_word: ἐν οἴκῳ θεοῦ
  choice: परमेश्वर के घराने में
  rationale: यहाँ οἶκος केवल भवन नहीं, परिवार या घराना भी सूचित करता है; आगे उसे सभा के रूप में समझाया गया है। ‘घराना’ इस सामुदायिक अर्थ को स्पष्ट रखता है।
- source_word: ἐκκλησία
  choice: सभा
  rationale: यह शब्द परमेश्वर के बुलाए और एकत्र लोगों को सामने लाता है तथा बाद की संस्थागत धारणाएँ अनावश्यक रूप से आरोपित नहीं करता। प्रचलित ‘कलीसिया’ को पादटिप्पणी में रखा गया है।
- source_word: θεοῦ ζῶντος
  choice: जीवित परमेश्वर की
  rationale: यह संबंधकारक पदबंध का संक्षिप्त और स्वाभाविक हिंदी रूप है तथा ‘जीवित’ पर निहित धर्मवैचारिक बल बनाए रखता है।
- source_word: στῦλος
  choice: स्तंभ
  rationale: यह स्थापत्य रूपक का सीधा, प्रतिष्ठित और सामान्य हिंदी समतुल्य है।
- source_word: ἑδραίωμα
  choice: सहारा
  rationale: दुर्लभ यूनानी संज्ञा दृढ़ता देने वाली वस्तु का बोध कराती है। ‘सहारा’ अर्थ को स्पष्ट रखता है और सभा को सत्य का उद्गम घोषित करने जैसी अतिरिक्त धारणा नहीं जोड़ता। वैकल्पिक रूप पादटिप्पणी में दिए गए हैं।
- source_word: τῆς ἀληθείας
  choice: सत्य का
  rationale: यह निश्चित, प्रसंगगत ‘सत्य’ को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: कलीसियाई संदर्भ में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: कलीसिया; मंडली
  rationale: मूल शब्द मुख्यतः एकत्र समुदाय को सूचित करता है। ‘सभा’ इस मूल अर्थ को सामने रखता है, जबकि प्रचलित धर्मशास्त्रीय शब्द ‘कलीसिया’ पादटिप्पणी में सुरक्षित है।
- issue: ‘सत्य का स्तंभ और ἑδραίωμα’ रूपक
  choice: सत्य का स्तंभ और सहारा
  alternative: सत्य का स्तंभ और दृढ़ आधार; सत्य का स्तंभ और दुर्ग
  rationale: वाक्य यह ऊँचा दावा सभा के विषय में करता है, पर यह नहीं कहता कि सभा सत्य की उत्पत्ति है। ‘सहारा’ दृढ़ करने या थामे रखने के भाव को बनाए रखते हुए यूनानी शब्द की वास्तविक अर्थगत अनिश्चितता को पादटिप्पणी में स्वीकार करता है।
- issue: ‘स्तंभ और सहारा’ का व्याकरणिक संबंध
  choice: इसे ‘जीवित परमेश्वर की सभा’ का विधेय माना गया है
  alternative: इसे अगले कथन या किसी अन्य निहित विषय से जोड़ना
  rationale: यूनानी वाक्य-विन्यास में निकटतम और स्वाभाविक संबंध ἐκκλησία θεοῦ ζῶντος से है; विराम-चिह्न इसी संबंध को स्पष्ट करते हैं, बिना उससे आगे कोई सांप्रदायिक निष्कर्ष निकाले।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’, ‘सभा’, ‘स्तंभ’ और ‘सहारा’ रूपक तथा सामुदायिक अर्थ को स्वाभाविक ढंग से बनाए रखते हैं। पिछले पद से जुड़े ‘लिख रहा हूँ’ को इस पद में अनावश्यक रूप से दोहराया नहीं गया।
