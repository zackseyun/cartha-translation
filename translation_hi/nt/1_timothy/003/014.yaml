lexical_decisions:
- source_word: Ταῦτά
  choice: ये बातें
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक सर्वनाम पहले और वर्तमान प्रसंग में दिए गए निर्देशों को सामूहिक रूप से दर्शाता है; ‘ये बातें’ बहुवचन और पत्र-संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: σοι
  choice: तुम्हें
  rationale: γράφω के साथ सम्प्रदान कारक पत्र-व्यवहार में प्राप्तकर्ता को दर्शाता है; हिन्दी में ‘तुम्हें लिख रहा हूँ’ स्वाभाविक है।
- source_word: γράφω
  choice: लिख रहा हूँ
  rationale: वर्तमानकालीन क्रिया पत्र लिखने की चल रही क्रिया को व्यक्त करती है; आधुनिक हिन्दी में यह रूप सहज और स्पष्ट है।
- source_word: ἐλπίζων
  choice: इस आशा से
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ लेखक की आशा को व्यक्त करता है; यह अनुवाद आशा को बनाए रखता है और निश्चितता को बढ़ाकर नहीं कहता।
- source_word: ἐλθεῖν
  choice: आऊँगा
  rationale: πρὸς σέ के साथ ἔρχομαι लेखक की ओर से तीमुथियुस के पास आने को दर्शाता है; हिन्दी की आशापरक आश्रित रचना में ‘कि ... आऊँगा’ स्वाभाविक है।
- source_word: πρὸς σὲ
  choice: तुम्हारे पास
  rationale: πρός और कर्मकारक गति की दिशा, यहाँ एक व्यक्ति तक पहुँचना, बताते हैं; ‘तुम्हारे पास’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: ἐν τάχει
  choice: शीघ्र ही
  rationale: यह पद समय की निकटता (‘जल्द’) अथवा गति (‘जल्दी’) व्यक्त कर सकता है। पत्र के प्रसंग में ‘शीघ्र ही’ आसन्न आगमन का स्वाभाविक और गरिमापूर्ण रूप है।
