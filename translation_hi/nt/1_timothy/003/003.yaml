lexical_decisions:
- source_word: πάροινον
  choice: पियक्कड़
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जो मदिरा पीने का आदी हो या नशे में डूबा रहता हो। ‘पियक्कड़’ आधुनिक हिन्दी में इस स्थायी दुर्गुण को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πλήκτην
  choice: मारपीट करनेवाला
  rationale: मूल शब्द का सीधा अर्थ प्रहार करनेवाला है। ‘मारपीट करनेवाला’ शारीरिक आक्रामकता को स्पष्ट रखता है और इसे केवल सामान्य कठोरता तक व्यापक नहीं करता।
- source_word: ἐπιεικῆ
  choice: नम्र
  rationale: यह शब्द कोमलता, सहनशीलता और उचित व्यवहार का भाव रखता है। ‘नम्र’ इस गुणसूची में संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए सहज है।
- source_word: ἄμαχον
  choice: झगड़ालू न हो
  rationale: यह शब्द लड़ाई या विवाद की ओर प्रवृत्त न होने का अर्थ देता है। नकारात्मक रूप मूल यूनानी संरचना और अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀφιλάργυρον
  choice: धन का लोभी न हो
  rationale: यह संयुक्त शब्द धन से प्रेम न करने का भाव देता है। ‘धन का लोभी न हो’ आधुनिक हिन्दी में स्वाभाविक है और धन के प्रति अनुचित आसक्ति को व्यक्त करता है।
