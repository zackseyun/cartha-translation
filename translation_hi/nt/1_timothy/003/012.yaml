source:
  edition: SBLGNT
  text: διάκονοι ἔστωσαν μιᾶς γυναικὸς ἄνδρες, τέκνων καλῶς προϊστάμενοι καὶ τῶν ἰδίων οἴκων·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/012.yaml
  text: Deacons must be husbands of one wife[a], managing their children and their own households well.
translation:
  language: hi
  text: सेवक एक पत्नी के पति हों, जो अपने बच्चों और अपने घर-परिवार का अच्छी तरह प्रबंध करते हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάκονοι
  choice: सेवक
  rationale: कलीसिया-व्यवस्था के इस प्रसंग में यह मान्यता-प्राप्त सेवकीय भूमिका को दर्शाता है। आधुनिक हिन्दी में ‘सेवक’ सामान्य पाठक के लिए स्वाभाविक है और यूनानी शब्द के सेवा-संबंधी अर्थ को भी बनाए रखता है।
- source_word: ἔστωσαν
  choice: हों
  rationale: वर्तमान आज्ञार्थक का मानकात्मक बल हिन्दी में योग्यता-सूची के भीतर ‘हों’ से स्वाभाविक और स्पष्ट रूप में व्यक्त होता है।
- source_word: μιᾶς γυναικὸς ἄνδρες
  choice: एक ही पत्नी के पति
  rationale: यह यूनानी संबंधवाचक पदबंध का निकट और पारदर्शी अनुवाद है। यह वैवाहिक निष्ठा, एकपत्नीव्रत, बहुविवाह अथवा पुनर्विवाह से संबंधित विवादित व्याख्याओं में से किसी एक को मुख्य पाठ में निर्णायक नहीं बनाता।
- source_word: τέκνων
  choice: अपने बच्चों
  rationale: यद्यपि ‘अपने’ इस संज्ञा के साथ अलग से नहीं लिखा है, पर सहभागी क्रिया और समानांतर ‘अपने घर-परिवार’ से संबंध स्पष्ट है; हिन्दी में इसे व्यक्त करना स्वाभाविक है।
- source_word: καλῶς
  choice: अच्छी तरह
  rationale: यह क्रियाविशेषण जिम्मेदार देखरेख की गुणवत्ता को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προϊστάμενοι
  choice: प्रबंध करते हों
  rationale: यह पद घर के संदर्भ में जिम्मेदार नेतृत्व और देखरेख बताता है। ‘प्रबंध’ अधिकारवादी ध्वनि से बचते हुए वास्तविक उत्तरदायित्व को व्यक्त करता है।
- source_word: τῶν ἰδίων οἴκων
  choice: अपने घर-परिवार
  rationale: यहाँ οἶκος केवल भवन नहीं, बल्कि घरेलू इकाई और उससे जुड़े लोगों को दर्शाता है। ‘घर-परिवार’ आधुनिक हिन्दी में इस व्यापक सामाजिक-पारिवारिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: कलीसियाई सेवक की योग्यता में μιᾶς γυναικὸς ἄνδρες की व्याख्या
  choice: मुख्य पाठ में ‘एक ही पत्नी के पति’ रखकर पदबंध की औपचारिकता और अस्पष्टता बनाए रखी गई है।
  alternative: ‘अपनी पत्नी के प्रति निष्ठावान’, ‘एक-स्त्री पुरुष’, या ‘केवल एक बार विवाहित’
  rationale: यूनानी पदबंध संक्षिप्त और मुहावरेदार है तथा इसकी व्याख्या विवादित है। निकट अनुवाद पाठक को मूल तनाव देखने देता है और वैवाहिक निष्ठा, बहुविवाह या पुनर्विवाह के विषय में किसी एक सांप्रदायिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सेवक’ को प्रसंग में कलीसियाई भूमिका के अर्थ में लिया गया है; ‘घर-परिवार’ से οἶκος का केवल भवन से व्यापक अर्थ स्पष्ट होता है।
