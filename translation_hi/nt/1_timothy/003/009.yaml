  text: वे विश्वास के भेद को शुद्ध अंतःकरण के साथ थामे रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχοντας
  choice: थामे रहें
  rationale: वर्तमान कृदन्त का आशय निरन्तर धारण करने और दृढ़ बने रहने से है; हिन्दी में यह पद पिछले वचन के सेवकों के लिए अपेक्षित गुण के रूप में स्वाभाविक है।
- source_word: μυστήριον
  choice: भेद
  rationale: पौलुस के प्रयोग में यह ऐसी दिव्य सच्चाई है जो पहले छिपी थी और अब प्रकट की गई है। ‘भेद’ इस अर्थ को संक्षेप में रखता है और किसी गुप्त, तांत्रिक ज्ञान का संकेत नहीं देता।
- source_word: τῆς πίστεως
  choice: विश्वास के
  rationale: सप्रत्यय पदबंध यहाँ सम्भवतः मसीही विश्वास की विषयवस्तु को दर्शाता है; हिन्दी में ‘विश्वास के भेद’ इस वस्तुगत अर्थ को रखता है, यद्यपि ‘विश्वास’ शब्द की मूल व्यापकता बनी रहती है।
- source_word: ἐν καθαρᾷ συνειδήσει
  choice: शुद्ध विवेक के साथ
  rationale: ἐν को यहाँ संगति या नैतिक अवस्था के अर्थ में ‘के साथ’ कहना स्वाभाविक है। καθαρός का सीधा अर्थ ‘शुद्ध’ और συνείδησις का प्रचलित हिन्दी समतुल्य ‘विवेक’ है।
theological_decisions:
- issue: τῆς πίστεως में ‘विश्वास’ का आशय
  choice: मसीही विश्वास की विषयवस्तु
  alternative: व्यक्ति का विश्वास करना या भरोसा
  rationale: कलीसियाई सेवकों की योग्यताओं के प्रसंग में यह पदबंध सम्भवतः उस प्रकट सत्य की ओर संकेत करता है जिसे वे मानते और थामे रहते हैं। फिर भी अनुवाद में केवल ‘विश्वास’ रखा गया है, ताकि यूनानी पद की शेष अर्थगत व्यापकता समाप्त न हो।
- issue: μυστήριον का स्वरूप
  choice: पहले छिपा पर अब प्रकट किया गया दिव्य भेद
  alternative: अब भी अगम या गुप्त रहस्य
  rationale: पौलुस के सामान्य प्रयोग के अनुरूप ‘भेद’ को ऐसी प्रकट की गई सच्चाई समझा गया है; मुख्य पाठ में व्याख्यात्मक शब्द जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘अन्तःकरण’ की अपेक्षा ‘विवेक’ अधिक सहज है, जबकि ‘शुद्ध’ यूनानी विशेषण की नैतिक शुद्धता को सीधे व्यक्त करता है।
