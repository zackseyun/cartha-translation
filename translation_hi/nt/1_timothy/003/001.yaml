  yaml_path: translation/nt/1_timothy/003/001.yaml
  text: 'This saying is trustworthy: if anyone aspires to oversight[b][a], he desires a good work.'
translation:
  language: hi
  text: 'यह बात विश्वसनीय है: यदि कोई देखरेख के दायित्व[a] की आकांक्षा करता है, तो वह एक अच्छे कार्य[b] की इच्छा करता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखरेख करने वाले का पद”; परम्परागत रूप से, “बिशप का पद।”
    reason: alternative_reading
  - marker: b
    text: या, “एक उत्तम दायित्व।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πιστὸς ὁ λόγος
  choice: यह बात विश्वसनीय है
  rationale: यह पास्तरी पत्रियों में प्रयुक्त एक सूत्रवत अभिव्यक्ति है, जो आगे कही गई बात की भरोसेमंदी पर बल देती है। ‘बात’ यहाँ λόγος का स्वाभाविक हिन्दी रूप है।
- source_word: εἴ τις
  choice: यदि कोई
  rationale: τις अनिश्चित और इस वाक्यांश में सामान्य अर्थ वाला सर्वनाम है; ‘कोई’ बिना अनावश्यक रूप से लिंग निर्धारित किए यूनानी का अर्थ व्यक्त करता है।
- source_word: ἐπισκοπῆς
  choice: देखरेख की ज़िम्मेदारी
  rationale: ἐπισκοπή में निगरानी, देखरेख और उससे जुड़ी भूमिका का भाव है। यह अनुवाद बाद की किसी निश्चित कलीसियाई पद-व्यवस्था को मूलपाठ में आरोपित किए बिना उस दायित्व को स्पष्ट करता है।
- source_word: ὀρέγεται
  choice: पाने की आकांक्षा रखता है
  rationale: ὀρέγομαι का मूल भाव किसी वस्तु की ओर बढ़ने और उसे पाने की अभिलाषा करने का है; यह हिन्दी प्रयोग उस सकारात्मक आकांक्षा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καλοῦ ἔργου
  choice: एक अच्छे काम
  rationale: καλός यहाँ अच्छे, उत्तम या आदरणीय होने का भाव दे सकता है। ‘अच्छा काम’ यूनानी शब्दावली के निकट रहते हुए पद या प्रतिष्ठा के बजाय कार्य पर बल बनाए रखता है।
- source_word: ἐπιθυμεῖ
  choice: इच्छा रखता है
  rationale: ἐπιθυμέω इच्छा या लालसा रखने को व्यक्त करता है। यहाँ इसका भाव सकारात्मक है; ‘इच्छा रखता है’ बिना अनावश्यक तीव्रता जोड़े समानांतर क्रिया का अर्थ देता है।
theological_decisions:
- issue: क्या ἐπισκοπῆς का अनुवाद बाद में विकसित कलीसियाई पदनाम से किया जाए
  choice: देखरेख की ज़िम्मेदारी
  alternative: अध्यक्ष का पद; बिशप का पद
  rationale: संज्ञा का अर्थ बाद की निश्चित बिशपीय व्यवस्था से व्यापक है। चुना हुआ अनुवाद मूल के देखरेख और दायित्व के भाव को बनाए रखता है तथा किसी खास सम्प्रदाय की शासन-व्यवस्था को आरोपित नहीं करता।
- issue: क्या εἴ τις को पुरुष-विशेष बनाकर अनुवाद किया जाए
  choice: यदि कोई
  alternative: यदि कोई पुरुष
  rationale: इस शर्त में अनिश्चित सर्वनाम अपने आप में सामान्य है। ‘यदि कोई’ मूलपाठ की व्यापकता को सुरक्षित रखता है; निकटवर्ती प्रसंग में आने वाली योग्यताओं का प्रश्न इस वाक्यांश में जोड़कर तय नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘देखरेख की ज़िम्मेदारी’ संस्थागत पदनाम की अपेक्षा मूल के कार्य और उत्तरदायित्व पर बल देती है; दोनों वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
