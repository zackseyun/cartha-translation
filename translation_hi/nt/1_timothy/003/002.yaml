base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/002.yaml
  text: Therefore an overseer must be above reproach[a], the husband of one wife, sober-minded, self-controlled, respectable, hospitable, able to teach,
translation:
  language: hi
  text: इसलिए निरीक्षक को ऐसा होना आवश्यक है कि उस पर कोई दोष न लगाया जा सके—एक ही पत्नी का पति[a], सचेत, आत्म-संयमी, शालीन, अतिथि-सत्कार करने वाला और शिक्षा देने में सक्षम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक स्त्री के प्रति निष्ठावान पुरुष”; यह वाक्यांश केवल वैवाहिक स्थिति के बजाय वैवाहिक निष्ठा पर बल दे सकता है।
    reason: वैकल्पिक व्याख्या
lexical_decisions:
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह केवल सलाह नहीं, बल्कि योग्यता की अनिवार्यता व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विचार से निकले निष्कर्ष के तार्किक संबंध को बनाए रखता है।
- source_word: ἐπίσκοπον
  choice: अध्यक्ष
  rationale: यह पद के निरीक्षण और नेतृत्व के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है तथा बाद की विशिष्ट कलीसियाई पदावली थोपने से बचता है।
- source_word: ἀνεπίλημπτον
  choice: निर्दोष
  rationale: अर्थ यह है कि उसके विरुद्ध कोई उचित और टिकने वाला आरोप न हो; इसका आशय पापरहित सिद्धता नहीं है।
- source_word: μιᾶς γυναικὸς ἄνδρα
  choice: एक ही पत्नी का पति
  rationale: यह यूनानी की पुरुष-विशिष्ट और औपचारिक संरचना को बनाए रखते हुए वैवाहिक स्थिति तथा निष्ठा से जुड़े व्याख्यात्मक प्रश्न खुले रखता है।
- source_word: νηφάλιον
  choice: संयमी
  rationale: यह मानसिक सजगता और व्यवहारगत संतुलन का व्यापक भाव देता है, केवल मदिरा से परहेज़ का नहीं।
- source_word: σώφρονα
  choice: समझदार
  rationale: यह विवेकपूर्ण, अनुशासित निर्णय का भाव व्यक्त करता है और निकटवर्ती 'संयमी' से अनावश्यक शब्दगत पुनरावृत्ति से बचता है।
- source_word: κόσμιον
  choice: शालीन
  rationale: यह व्यवस्थित, मर्यादित और सम्मानयोग्य आचरण को सहज हिन्दी में व्यक्त करता है।
- source_word: φιλόξενον
  choice: अतिथि-सत्कार करने वाला
  rationale: यह अतिथियों और अपरिचितों का स्वागत करने की सद्गुण को स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: διδακτικόν
  choice: शिक्षा देने में निपुण
  rationale: यह शिक्षा देने की योग्यता और दक्षता को व्यक्त करता है, केवल इच्छा को नहीं।
theological_decisions:
- issue: कलीसियाई अगुवे की योग्यता में μιᾶς γυναικὸς ἄνδρα की व्याख्या
  choice: मुख्य पाठ में औपचारिक रूप से ‘एक ही पत्नी का पति’
  alternative: ‘एक स्त्री के प्रति निष्ठावान पुरुष’ या ‘अपनी पत्नी के प्रति निष्ठावान’
  rationale: यह वाक्यांश विवादित है और वैवाहिक निष्ठा, बहुविवाह के निषेध, अथवा पुनर्विवाह संबंधी सीमा की ओर संकेत कर सकता है। मुख्य पाठ किसी एक अर्थ को अंतिम नहीं ठहराता; पादटिप्पणी निष्ठा-केंद्रित सम्भावना सुरक्षित रखती है।
