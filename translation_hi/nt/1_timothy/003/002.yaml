  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। गुणों की सूची संक्षिप्त रखी गई है और निकटार्थी यूनानी विशेषणों के बीच हिन्दी में यथासम्भव भेद बनाए रखा गया है।
