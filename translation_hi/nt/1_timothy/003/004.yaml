translation:
  language: hi
  text: वह अपने घर-परिवार का अच्छी तरह प्रबंध करता हो[a] और उसके बच्चे पूरी गरिमा के साथ अधीनता में हों[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने घर-परिवार की अच्छी तरह अगुवाई करता हो’ अथवा ‘अपने घर पर अच्छी तरह शासन करता हो।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके बच्चे अधीन रहनेवाले हों’ अथवा ‘वह अपने बच्चों को अनुशासन में रखता हो।’
    reason: lexical_alternative
  - marker: c
    text: ‘पूरी गरिमा के साथ’ बच्चों की अधीनता के ढंग को बता सकता है, या उसके घर-परिवार के प्रबंध के ढंग को।
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ ἰδίου οἴκου
  choice: अपने घर-परिवार का
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि व्यक्ति के उत्तरदायित्व के अधीन घरेलू परिवार को दर्शाता है। ‘घर-परिवार’ आधुनिक हिन्दी में स्थान और पारिवारिक इकाई—दोनों का भाव स्वाभाविक रूप से व्यक्त करता है; ἰδίου का बल ‘अपने’ से बना रहता है।
- source_word: καλῶς
  choice: अच्छी तरह
  rationale: यह क्रियाविशेषण प्रबंध करने के ढंग को बताता है। ‘अच्छी तरह’ सहज और व्यापक है तथा योग्य और उचित देखरेख का भाव रखता है।
- source_word: προϊστάμενον
  choice: प्रबंध करनेवाला
  rationale: προΐστημι यहाँ उत्तरदायित्वपूर्वक अगुवाई और देखरेख करने को व्यक्त करता है। ‘प्रबंध करनेवाला’ वास्तविक अधिकार और जिम्मेदारी दोनों बताता है, पर अनावश्यक कठोरता नहीं जोड़ता।
- source_word: τέκνα ἔχοντα
  choice: अपने बच्चों को … रखता हो
  rationale: हिन्दी में शाब्दिक ‘बच्चों को रखता हुआ’ अस्वाभाविक होगा। ἔχω और ἐν ὑποταγῇ के संयुक्त भाव को ‘अधीनता में रखता हो’ से स्वाभाविक ढंग से व्यक्त किया गया है; ‘अपने’ सन्दर्भ से स्पष्ट पारिवारिक संबंध को सामने लाता है।
- source_word: ἐν ὑποταγῇ
  choice: अधीनता में
  rationale: ὑποταγή व्यवस्थित अधीनता का भाव देता है। ‘अधीनता में’ यूनानी की संज्ञात्मक अभिव्यक्ति को बनाए रखता है और इसे केवल बाहरी नियंत्रण या सामान्य आज्ञाकारिता तक सीमित नहीं करता।
- source_word: μετὰ πάσης σεμνότητος
  choice: पूरी गरिमा के साथ
  rationale: σεμνότης गरिमा, गंभीरता और सम्मानयोग्य आचरण का भाव रखता है। ‘पूरी गरिमा के साथ’ स्वाभाविक हिन्दी है और इस अस्पष्टता को खुला रखता है कि यह बच्चों की अधीनता के ढंग को बताता है या समूचे घरेलू प्रबंध को।
theological_decisions:
- issue: घर-परिवार पर अगुवाई के कथन का दायरा
  choice: यह पद भावी अध्यक्ष द्वारा अपने घर-परिवार की उत्तरदायित्वपूर्ण देखरेख का वर्णन करता है।
  alternative: इसे हर प्रकार के अधिकार पर व्यापक सिद्धान्त मानना, या अधिकार के भाव को केवल देखभाल तक हल्का कर देना।
  rationale: προϊστάμενον और ὑποταγή वास्तविक अधिकार तथा व्यवस्थित पारिवारिक जीवन सूचित करते हैं, किन्तु यह पद सेवकाई की योग्यता बता रहा है, परिवार-संबंधी सम्पूर्ण धर्मसिद्धान्त प्रस्तुत नहीं कर रहा।
- issue: ‘पूरी गरिमा के साथ’ का संबंध
  choice: वाक्य में इस पदबंध का संबंध जानबूझकर अनिर्णीत रखा गया है।
  alternative: इसे केवल बच्चों की अधीनता से या केवल पुरुष के प्रबंध से जोड़ना।
  rationale: यूनानी रचना दोनों संबंधों पर विचार की गुंजाइश देती है। मुख्य पाठ किसी एक को अनावश्यक रूप से निश्चित नहीं करता और पादटिप्पणी में अस्पष्टता स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘घर-परिवार’ घरेलू इकाई का व्यापक अर्थ देता है; ‘प्रबंध’ अधिकार और जिम्मेदारी को संतुलित रखता है। मुख्य पाठ में यूनानी वाक्य की वास्तविक व्याकरणिक अस्पष्टता सुरक्षित है।
