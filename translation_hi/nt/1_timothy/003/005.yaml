id: 1TI.3.5
reference: 1 Timothy 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: (εἰ δέ τις τοῦ ἰδίου οἴκου προστῆναι οὐκ οἶδεν, πῶς ἐκκλησίας θεοῦ ἐπιμελήσεται;)
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/005.yaml
  text: But if someone does not know how to manage his own household[c][b][a], how will he care for God’s church?
translation:
  language: hi
  text: पर यदि कोई अपने घर-परिवार का प्रबंध करना नहीं जानता, तो वह परमेश्वर की कलीसिया की देखभाल कैसे करेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δέ
  choice: पर यदि
  rationale: यह पद पिछले कथन से हल्का विरोध जोड़ते हुए एक शर्त रखता है; ‘पर यदि’ दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τις
  choice: कोई
  rationale: यह अनिश्चित एकवचन कर्ता है। ‘कोई’ अनावश्यक रूप से ‘पुरुष’ जोड़े बिना यूनानी की अनिश्चितता बनाए रखता है; वाक्य के अंत में पुल्लिंग ‘करेगा’ निकटवर्ती प्रसंग के अनुरूप है।
- source_word: τοῦ ἰδίου οἴκου
  choice: अपने घर-परिवार का
  rationale: οἶκος यहाँ भवन मात्र नहीं, बल्कि व्यक्ति की देखरेख में रहने वाले पूरे घरेलू समुदाय को सूचित करता है। ‘घर-परिवार’ आधुनिक हिन्दी में इस व्यापक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: προστῆναι
  choice: प्रबंध करना
  rationale: यहाँ क्रिया का अर्थ घर-परिवार को जिम्मेदारी से चलाना और उसका नेतृत्व करना है। ‘प्रबंध करना’ अधिकारवादी ‘शासन करना’ की अपेक्षा इस व्यावहारिक उत्तरदायित्व को अधिक ठीक ढंग से व्यक्त करता है।
- source_word: οὐκ οἶδεν
  choice: करना नहीं जानता
  rationale: οἶδα के साथ अनन्त क्रिया का भाव किसी काम को करने का ढंग या योग्यता जानना है; हिन्दी की यह रचना उसी मुहावरेदार अर्थ को रखती है।
- source_word: πῶς
  choice: कैसे करेगा
  rationale: यह भविष्यकालीन आलंकारिक प्रश्न है, जो घर-परिवार की जिम्मेदारी से कलीसिया की जिम्मेदारी की ओर निष्कर्ष निकालता है।
- source_word: ἐκκλησίας θεοῦ
  choice: परमेश्वर की कलीसिया
  rationale: सम्बन्धकारक रचना को हिन्दी में स्वाभाविक स्वामित्व-सूचक रूप में रखा गया है। इस कलीसियाई प्रसंग में ἐκκλησία के लिए ‘कलीसिया’ प्रचलित और सटीक शब्द है।
- source_word: ἐπιμελήσεται
  choice: देखभाल करेगा
  rationale: ἐπιμελέομαι सावधानी और चिंता के साथ किसी की सुध लेने का भाव रखता है। ‘देखभाल’ इसे सहज हिन्दी में व्यक्त करता है और पहले खंड के प्रशासन-सूचक ‘प्रबंध’ से क्रियात्मक भेद बनाए रखता है।
theological_decisions:
- issue: घर-परिवार के नेतृत्व और कलीसिया की देखभाल का संबंध
  choice: पहले खंड में ‘प्रबंध करना’ और दूसरे में ‘देखभाल करना’ रखा गया है।
  alternative: दोनों खंडों में ‘नेतृत्व करना’ या पहले में ‘शासन करना’ कहा जा सकता था।
  rationale: मूल पाठ दो अलग क्रियाएँ—προΐστημι और ἐπιμελέομαι—प्रयोग करता है। उनका भेद बनाए रखने से घर की जिम्मेदार अगुवाई और कलीसिया की सावधान देखभाल के बीच समानता तो बनी रहती है, पर कलीसियाई सेवा को केवल नियंत्रण या प्रशासन नहीं बनाया जाता।
- issue: अनिश्चित कर्ता का लिंग
  choice: τις के लिए ‘कोई’ रखा गया है और भविष्यकालीन क्रिया ‘करेगा’ निकटवर्ती पुरुष-पर्यवेक्षक प्रसंग के अनुसार पुल्लिंग है।
  alternative: पूरे वाक्य को पूर्णतः लिंग-निरपेक्ष बहुवचन में या आरम्भ से ‘कोई पुरुष’ कहकर प्रस्तुत किया जा सकता था।
  rationale: ‘कोई’ यूनानी अनिश्चित सर्वनाम की व्यापकता को सुरक्षित रखता है, जबकि पुल्लिंग क्रिया व्याकरण और अध्याय में पर्यवेक्षक की योग्यताओं के तात्कालिक प्रसंग को दर्शाती है; इससे मूल से अधिक स्पष्ट लिंग-निर्धारण भी नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘घर-परिवार’ सामान्य पाठक के लिए ‘घराने’ से अधिक सहज है, जबकि ‘कलीसिया’ भारतीय हिन्दी मसीही प्रयोग में स्थापित पद है। वाक्य की आलंकारिक प्रश्न-रचना और दोनों क्रियाओं का अर्थभेद सुरक्षित रखा गया है।
