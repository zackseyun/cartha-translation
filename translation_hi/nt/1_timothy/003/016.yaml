id: 1TI.3.16
reference: 1 Timothy 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὁμολογουμένως μέγα ἐστὶν τὸ τῆς εὐσεβείας μυστήριον· ⸀Ὃς ἐφανερώθη ἐν σαρκί, ἐδικαιώθη ἐν πνεύματι, ὤφθη ἀγγέλοις, ἐκηρύχθη ἐν ἔθνεσιν, ἐπιστεύθη ἐν κόσμῳ, ἀνελήμφθη ἐν δόξῃ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/016.yaml
  text: 'And undeniably[a], great is the mystery of godliness:

    He was revealed in flesh,

    was vindicated in spirit,

    was seen by angels,

    was proclaimed among the nations,

    was believed on in the world[d][c][b],

    was taken up in glory.'
translation:
  language: hi
  text: 'और निस्संदेह, भक्ति का रहस्य महान है:


    वह देह में प्रकट हुआ[a],


    आत्मा में सही ठहराया गया[b],


    स्वर्गदूतों द्वारा देखा गया,


    राष्ट्रों के बीच उसका प्रचार हुआ[c],


    संसार में उस पर विश्वास किया गया,


    और महिमा में उठा लिया गया[d]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘वह देह में प्रकट हुआ’ के स्थान पर ‘परमेश्वर देह में प्रकट हुआ’ है। आलोचनात्मक यूनानी पाठ में ‘जो/वह’ है, जिसे यहाँ अपनाया गया है।
    reason: textual_variant
  - marker: b
    text: या ‘पवित्र आत्मा के द्वारा सही ठहराया गया’ अथवा ‘आत्मा में सही ठहराया गया।’ संक्षिप्त यूनानी वाक्यांश पवित्र आत्मा की क्रिया अथवा आत्मिक क्षेत्र या अवस्था—दोनों की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘गैर-यहूदियों के बीच उसका प्रचार हुआ।’
    reason: lexical_alternative
  - marker: d
    text: या ‘महिमा में उठा लिया गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμολογουμένως
  choice: निस्संदेह
  rationale: यह शब्द ऐसी बात का बोध कराता है जिसे खुले तौर पर स्वीकार किया जाता है। ‘निस्संदेह’ आधुनिक और सहज हिन्दी में इस बल को व्यक्त करता है।
- source_word: τὸ τῆς εὐσεβείας μυστήριον
  choice: भक्ति का रहस्य
  rationale: यहाँ μυστήριον परमेश्वर द्वारा प्रकट किए गए उस सत्य को दर्शाता है जो पहले छिपा था; εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण जीवन या भक्ति को सूचित करता है।
- source_word: Ὃς
  choice: वह
  rationale: आलोचनात्मक यूनानी पाठ में पुल्लिंग सम्बन्धवाचक सर्वनाम ‘जो’ है, θεός (‘परमेश्वर’) नहीं। हिन्दी में स्तुतिगान की अगली पंक्ति आरम्भ करने के लिए ‘वह’ स्वाभाविक व्यक्तिगत संकेत है।
- source_word: ἐφανερώθη ἐν σαρκί
  choice: देह में प्रकट हुआ
  rationale: यह वाक्यांश उसके वास्तविक मानवीय, देहधारी अस्तित्व में प्रकट होने को व्यक्त करता है; ‘देह’ आधुनिक हिन्दी में ‘मांस’ से अधिक स्वाभाविक है।
- source_word: ἐδικαιώθη
  choice: सही सिद्ध हुआ
  rationale: यहाँ क्रिया का अर्थ धर्मी बनाया जाना नहीं, बल्कि सही या निर्दोष प्रमाणित होना है। यह चयन भ्रामक उद्धारशास्त्रीय अर्थ से बचता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: यूनानी वाक्यांश संक्षिप्त और अस्पष्ट है। यह पवित्र आत्मा की क्रिया अथवा आत्मिक क्षेत्र या अवस्था—दोनों की ओर संकेत कर सकता है; मुख्य पाठ इस अस्पष्टता को बनाए रखता है।
- source_word: ὤφθη ἀγγέλοις
  choice: स्वर्गदूतों को दिखाई दिया
  rationale: ὤφθη का अर्थ ‘दिखाई दिया’ या ‘देखा गया’ हो सकता है। सम्प्रदान कारक के साथ ‘स्वर्गदूतों को दिखाई दिया’ सहज हिन्दी है और स्वर्गीय दूतों के अर्थ को व्यक्त करता है।
- source_word: ἐκηρύχθη ἐν ἔθνεσιν
  choice: राष्ट्रों के बीच उसका प्रचार हुआ
  rationale: κηρύσσω सार्वजनिक घोषणा या प्रचार को दर्शाता है। ἔθνη का अर्थ ‘गैर-यहूदी’ भी हो सकता है, पर ‘राष्ट्र’ अधिक व्यापक मूल अर्थ को सुरक्षित रखता है।
- source_word: ἐπιστεύθη ἐν κόσμῳ
  choice: संसार में उस पर विश्वास किया गया
  rationale: निष्क्रिय क्रिया व्यक्तिगत विश्वास की प्रतिक्रिया को व्यक्त करती है। हिन्दी में ‘उस पर विश्वास किया गया’ इस आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνελήμφθη ἐν δόξῃ
  choice: महिमा में ऊपर उठा लिया गया
  rationale: क्रिया ऊपर उठा लिए जाने को दर्शाती है और ἐν δόξῃ को ‘महिमा में’ रखकर यूनानी पूर्वसर्ग की संक्षिप्तता सुरक्षित रहती है।
theological_decisions:
- issue: 'स्तुतिगान के आरम्भ में पाठांतर: Ὃς बनाम θεός बनाम ὅ'
  choice: आलोचनात्मक पाठ Ὃς को व्यक्तिगत संकेत ‘वह’ के रूप में अनुवादित किया गया है।
  alternative: 'कुछ पांडुलिपियों के अनुसार: ‘परमेश्वर देह में प्रकट हुआ।’'
  rationale: SBLGNT में Ὃς (‘जो’) है। पद का मसीह-संबंधी आशय स्पष्ट है, पर मुख्य पाठ में बाद के प्रसिद्ध पाठांतर ‘परमेश्वर’ को आयात नहीं किया गया; उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν πνεύματι का अभिप्राय
  choice: मुख्य पाठ में तटस्थ रूप से ‘आत्मा में’ रखा गया है।
  alternative: ‘पवित्र आत्मा के द्वारा’ अथवा ‘आत्मिक क्षेत्र/अवस्था में।’
  rationale: लेखरहित πνεύματι व्याकरण की दृष्टि से अस्पष्ट है। अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य न बनाकर मूल तनाव को बनाए रखता है।
- issue: ἀνελήμφθη ἐν δόξῃ में ἐν का अर्थ
  choice: ‘महिमा में ऊपर उठा लिया गया।’
  alternative: ‘महिमा में प्रवेश कराने के लिए ऊपर उठा लिया गया’ अथवा संक्षेप में ‘महिमा को उठा लिया गया।’
  rationale: ἐν सामान्यतः ‘में’ है, पर सन्दर्भ में लक्ष्य या प्रवेश का भाव भी समझा जा सकता है। मुख्य पाठ औपचारिक समानता बनाए रखता है और वैकल्पिक अर्थ पाद-टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। मूल की छह समानांतर काव्यात्मक पंक्तियों को सुरक्षित रखा गया है। ‘देह,’ ‘आत्मा,’ ‘संसार’ और ‘महिमा’ जैसे परिचित बाइबिलीय शब्दों का प्रयोग किया गया है, जबकि कठिन धर्मवैज्ञानिक अस्पष्टताओं को पाद-टिप्पणियों में स्पष्ट किया गया है।
