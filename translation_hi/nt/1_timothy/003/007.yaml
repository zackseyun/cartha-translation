id: 1TI.3.7
reference: 1 Timothy 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: δεῖ ⸀δὲ καὶ μαρτυρίαν καλὴν ἔχειν ἀπὸ τῶν ἔξωθεν, ἵνα μὴ εἰς ὀνειδισμὸν ἐμπέσῃ καὶ παγίδα τοῦ διαβόλου.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/007.yaml
  text: And he must also have a good testimony from those outside, so that he may not fall into reproach and the devil’s snare.
translation:
  language: hi
  text: और यह भी आवश्यक है कि बाहरवालों में उसकी अच्छी गवाही हो,[a] ताकि वह निंदा[b] और शैतान के फंदे[c] में न फँसे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बाहरवालों से अच्छी गवाही मिले।” “बाहरवाले” मसीही समुदाय से बाहर के लोगों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “बदनामी” अथवा “अपमान।”
    reason: lexical_alternative
  - marker: c
    text: या, “निंदक के फंदे,” यदि διάβολος को उसके सामान्य अर्थ “निंदक” में लिया जाए; यहाँ इसे “शैतान” समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: δεῖ δὲ καὶ
  choice: और यह भी आवश्यक है
  rationale: यह पद को पिछली योग्यताओं से जोड़ते हुए एक और अनिवार्य योग्यता प्रस्तुत करता है; ‘आवश्यक है’ δεῖ की बाध्यता को स्पष्ट रखता है।
- source_word: μαρτυρίαν καλὴν ἔχειν
  choice: उसकी अच्छी गवाही हो
  rationale: यह अनुकूल साक्ष्य या जनमत को व्यक्त करता है। ‘अच्छी गवाही’ यूनानी अभिव्यक्ति के निकट रहते हुए हिंदी में समझने योग्य है; ‘अच्छी प्रतिष्ठा’ अधिक व्याख्यात्मक होता।
- source_word: ἀπὸ τῶν ἔξωθεν
  choice: बाहरवालों में
  rationale: संदर्भ मसीही समुदाय से बाहर के लोगों का है। हिंदी में किसी के विषय में किसी समूह के बीच प्रचलित गवाही के लिए ‘में’ स्वाभाविक है, जबकि ‘से’ स्रोत-भाव को अधिक अक्षरशः व्यक्त करता।
- source_word: ἵνα μὴ ... ἐμπέσῃ
  choice: ताकि वह ... में न फँसे
  rationale: नकारात्मक उद्देश्य या परिणाम को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है। एक ही क्रिया निंदा और फंदे दोनों से जुड़ी यूनानी रचना को बनाए रखती है।
- source_word: ὀνειδισμὸν
  choice: निंदा
  rationale: यह सार्वजनिक तिरस्कार, अपमान या बदनामी का भाव रखता है। ‘निंदा’ संक्षिप्त और परिचित है; वैकल्पिक सामाजिक-लज्जा का भाव पादटिप्पणी में सुरक्षित है।
- source_word: παγίδα
  choice: फंदा
  rationale: यह पकड़ने वाले जाल की रूपकात्मक छवि को स्वाभाविक बाइबलीय हिंदी में सुरक्षित रखता है।
- source_word: τοῦ διαβόλου
  choice: शैतान के
  rationale: नए नियम के प्रचलित व्यक्तिगत संदर्भ के अनुसार διάβολος को शैतान माना गया है और यूनानी संबंधकारक को सीधे ‘के’ से व्यक्त किया गया है।
theological_decisions:
- issue: τοῦ διαβόλου का संदर्भ
  choice: व्यक्तिगत दुष्ट सत्ता शैतान—‘शैतान के फंदे’
  alternative: ‘निंदक के फंदे’ अथवा निंदा से उत्पन्न फंदा
  rationale: लेखयुक्त διάβολος पास्तरी पत्रियों और व्यापक नए नियम में सामान्यतः शैतान का संकेत करता है। फिर भी शब्द का मूल अर्थ ‘निंदक’ हो सकता है, इसलिए वैकल्पिक संभावना को पादटिप्पणी में रखा गया है।
- issue: ὀνειδισμός का सामाजिक और नैतिक भाव
  choice: ‘निंदा’
  alternative: ‘बदनामी’ या ‘अपमान’
  rationale: मुख्य पाठ शब्द के आरोप और तिरस्कार के भाव को रखता है, जबकि ‘बदनामी’ सामाजिक प्रतिष्ठा के परिणाम को अधिक स्पष्ट करती है; इस तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाहरवाले,’ ‘अच्छी गवाही,’ और ‘फंदा’ बाइबलीय रंग बनाए रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं हैं। मुख्य पाठ में वास्तविक अस्पष्टताओं को बिना अनावश्यक विस्तार के रखा गया है और विकल्प पादटिप्पणियों में दिए गए हैं।
