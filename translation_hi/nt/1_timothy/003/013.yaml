base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/003/013.yaml
  text: For those who have served well obtain for themselves a good standing and great boldness in the faith that is in Messiah Jesus[a][b][c].
translation:
  language: hi
  text: क्योंकि जिन लोगों ने अच्छी तरह सेवा की है, वे अपने लिए एक अच्छा स्थान और मसीहा यीशु में जो विश्वास है, उसमें बड़ा साहस प्राप्त करते हैं।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़ी निर्भीकता”; यूनानी शब्द का अर्थ साहस, भरोसा या खुलकर बोलने की स्वतंत्रता हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मसीहा यीशु में स्थित विश्वासयोग्यता में।” यूनानी πίστις का अर्थ विश्वास, भरोसा या विश्वासयोग्यता हो सकता है; मुख्य पाठ में “विश्वास” परियोजना के सामान्य अनुवाद के अनुसार है।
    reason: alternative_reading
  - marker: c
    text: यूनानी शब्द Χριστός है; यहाँ इसे “मसीहा” किया गया है, क्योंकि यह उपाधि के रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διακονήσαντες
  choice: जिन्होंने ... सेवा की है
  rationale: क्रिया का मूल अर्थ ‘सेवा करना’ है। प्रसंग सेवकों की योग्यताओं का है, फिर भी पदवी को क्रिया में जोड़ने के बजाय सामान्य अर्थ सुरक्षित रखा गया है।
- source_word: καλῶς
  choice: अच्छी तरह
  rationale: यह क्रिया-विशेषण सेवा करने के ढंग को बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: βαθμὸν ... καλὸν
  choice: अच्छा स्थान
  rationale: βαθμός का शाब्दिक अर्थ ‘कदम’ और रूपक अर्थ पद/प्रतिष्ठा/स्थान हो सकता है। ‘अच्छा स्थान’ सम्मानजनक स्थिति को व्यक्त करता है, बिना कलीसियाई पदक्रम निश्चित किए।
- source_word: περιποιοῦνται
  choice: अपने लिए ... प्राप्त करते हैं
  rationale: मध्यवाच्य की आत्मवाचक छाया ‘अपने लिए’ से सुरक्षित रहती है।
- source_word: παρρησίαν
  choice: साहस
  rationale: यह शब्द निर्भीकता, भरोसे और खुलकर बोलने की स्वतंत्रता व्यक्त कर सकता है। ‘साहस’ इसकी प्रबलता बनाए रखता है।
- source_word: πίστει
  choice: विश्वास
  rationale: यहाँ πίστις का सबसे स्वाभाविक अर्थ ‘विश्वास’ है; ‘विश्वासयोग्यता’ की संभव छाया पाद-टिप्पणी में रखी गई है।
- source_word: τῇ ἐν Χριστῷ Ἰησοῦ
  choice: जो मसीहा यीशु में है
  rationale: सव्यय पदबंध को ‘विश्वास’ का विशेषण बनाकर यूनानी संरचना और उसका संबंध सुरक्षित रखा गया है।
- source_word: Χριστῷ
  choice: मसीहा
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीहा’ उसके अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: ἐν πίστει τῇ ἐν Χριστῷ Ἰησοῦ में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: वाक्य सबसे स्वाभाविक रूप से मसीहा यीशु में स्थित विश्वास की ओर संकेत करता है, पर πίστις में ‘विश्वासयोग्यता’ का अर्थ भी संभव है; इसलिए इसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: βαθμὸν καλὸν से अभिप्रेत स्थिति
  choice: अच्छा स्थान
  alternative: अच्छी प्रतिष्ठा; अच्छा पद
  rationale: पाठ यह स्पष्ट नहीं करता कि यह औपचारिक कलीसियाई पद, सामाजिक प्रतिष्ठा या आत्मिक उन्नति है। ‘अच्छा स्थान’ इस अस्पष्टता को अपेक्षाकृत खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। ‘सेवा’ सामान्य पाठक के लिए स्पष्ट है और ‘सेवक का पद निभाया’ जैसी अतिव्याख्या से बचती है। ‘अच्छा स्थान’ जानबूझकर व्यापक रखा गया है ताकि βαθμός की रूपकात्मक अस्पष्टता बनी रहे। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
