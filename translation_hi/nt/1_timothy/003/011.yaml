  yaml_path: translation/nt/1_timothy/003/011.yaml
  text: Women likewise must be dignified[a], not slanderers, sober-minded, faithful in all things.
translation:
  language: hi
  text: इसी प्रकार स्त्रियाँ भी आदरयोग्य हों,[a] निंदा करने वाली न हों, संयमी हों और हर बात में विश्वासयोग्य हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी प्रकार पत्नियाँ भी आदरयोग्य हों...” इस प्रसंग में यूनानी शब्द का अर्थ “स्त्रियाँ” या “पत्नियाँ” हो सकता है; मूल पाठ में “उनकी पत्नियाँ” स्पष्ट रूप से नहीं कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: γυναῖκας
  choice: स्त्रियाँ
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ न तो संबंधवाचक सर्वनाम है, न निश्चित उपपद; इसलिए मुख्य पाठ में व्यापक अर्थ ‘स्त्रियाँ’ रखा गया और ‘पत्नियाँ’ को पादटिप्पणी में सुरक्षित किया गया।
- source_word: ὡσαύτως
  choice: इसी प्रकार ... भी
  rationale: यह पद पिछले योग्यता-वर्णन के साथ समानांतर संबंध दिखाता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: σεμνάς
  choice: आदरयोग्य
  rationale: यह शब्द गंभीर, सम्माननीय और गरिमापूर्ण चरित्र का बोध कराता है; ‘आदरयोग्य’ सहज आधुनिक हिंदी में इस भाव को व्यक्त करता है।
- source_word: μὴ διαβόλους
  choice: बदनामी करनेवाली न हों
  rationale: यहाँ διάβολος व्यक्तिवाचक ‘शैतान’ नहीं, बल्कि दूसरों पर निंदात्मक आरोप लगाने के स्वभाव को दर्शाता है।
- source_word: νηφαλίους
  choice: संयमी
  rationale: शब्द सजग, संतुलित और आत्म-नियंत्रित होने का भाव रखता है; ‘संयमी’ इसके नैतिक विस्तार को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: πιστὰς
  choice: विश्वासयोग्य
  rationale: इस गुण-सूची में πιστός मुख्यतः भरोसेमंद और निष्ठावान चरित्र को दर्शाता है; ‘विश्वासयोग्य’ प्रसंग के अनुकूल है।
- source_word: ἐν πᾶσιν
  choice: हर बात में
  rationale: यह यूनानी वाक्यांश व्यापकता व्यक्त करता है; ‘हर बात में’ आधुनिक हिंदी में स्वाभाविक रहते हुए उसका पूरा विस्तार बनाए रखता है।
theological_decisions:
- issue: योग्यता-सूची में γυναῖκας का संदर्भ
  choice: स्त्रियाँ
  alternative: पत्नियाँ
  rationale: यह शब्द स्त्रियों के किसी सेवकाई-समूह या पुरुष सेवकों की पत्नियों—दोनों की ओर संकेत कर सकता है। यूनानी में ‘उनकी’ नहीं है और ὡσαύτως समानांतर समूह का संकेत दे सकता है। अतः मुख्य पाठ में व्यापक अर्थ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिया गया, ताकि व्याख्यात्मक तनाव बना रहे।
