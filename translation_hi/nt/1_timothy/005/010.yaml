language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν ἔργοις καλοῖς μαρτυρουμένη, εἰ ἐτεκνοτρόφησεν, εἰ ἐξενοδόχησεν, εἰ ἁγίων πόδας ἔνιψεν, εἰ θλιβομένοις ἐπήρκεσεν, εἰ παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/010.yaml
  text: 'well attested for good works: if she has raised children[a], if she has shown hospitality, if she has washed the feet of the saints, if she has helped those under affliction[c][b], if she has followed every good work.'
translation:
  language: hi
  text: 'जिसके भले कामों की अच्छी गवाही हो: उसने बच्चों का पालन-पोषण किया हो, अतिथियों का सत्कार किया हो[a], पवित्र लोगों[b] के पाँव धोए हों, दुःख में पड़े लोगों की सहायता की हो, और हर भले काम में लगी रही हो[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपरिचितों को अपने यहाँ ठहराया हो।” यूनानी क्रिया विशेष रूप से अतिथियों या अपरिचितों को अपने घर में ग्रहण करने को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र लोगों” से आशय परमेश्वर के लोग, अर्थात् साथी विश्वासी हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “हर भले काम के पीछे लगी रही हो।” यूनानी अभिव्यक्ति सक्रिय रूप से भले कामों का अनुसरण करने और उनमें निरंतर लगे रहने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ἔργοις καλοῖς μαρτυρουμένη
  choice: भले कामों के लिए उसकी अच्छी गवाही हो
  rationale: यह निष्क्रिय भाव को बनाए रखता है कि दूसरे लोग उसके दिखाई देने वाले भले कामों के आधार पर उसके विषय में अनुकूल गवाही देते हैं।
- source_word: ἐτεκνοτρόφησεν
  choice: उसने बच्चों का पालन-पोषण किया हो
  rationale: क्रिया बच्चों को पालने और उनका पोषण करने को दर्शाती है; इससे यह अनावश्यक रूप से निश्चित नहीं किया जाता कि वे उसके जैविक बच्चे ही थे।
- source_word: ἐξενοδόχησεν
  choice: अतिथियों का सत्कार किया हो
  rationale: यह घर में अतिथियों या अपरिचितों को ग्रहण करने और उनकी सेवा करने के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἁγίων
  choice: पवित्र लोगों
  rationale: यह पौलुस के प्रयोग में परमेश्वर के लिए अलग किए गए लोगों, अर्थात् साथी विश्वासियों, के लिए प्रयुक्त मूल पद की पवित्रता-संबंधी धारणा को बनाए रखता है।
- source_word: πόδας ἔνιψεν
  choice: पाँव धोए हों
  rationale: नम्र सेवा के इस ठोस और सांस्कृतिक रूप से महत्त्वपूर्ण कार्य को स्पष्ट रूप से बनाए रखा गया है।
- source_word: θλιβομένοις ἐπήρκεσεν
  choice: दुःख में पड़े लोगों की सहायता की हो
  rationale: यह संकट, दबाव या क्लेश झेल रहे लोगों को व्यावहारिक सहारा देने का व्यापक अर्थ व्यक्त करता है और इसे केवल सताव तक सीमित नहीं करता।
- source_word: παντὶ ἔργῳ ἀγαθῷ ἐπηκολούθησεν
  choice: हर भले काम में तत्परता से लगी रही हो
  rationale: मूल क्रिया के सक्रिय रूप से पीछे लगने, अनुसरण करने और निरंतर समर्पित रहने के भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἁγίων का संदर्भ
  choice: मुख्य पाठ में “पवित्र लोगों” रखा गया है और पादटिप्पणी में साथी विश्वासियों का अर्थ स्पष्ट किया गया है।
  alternative: संतों; विश्वासियों
  rationale: पौलुस के सामान्य प्रयोग में यह परमेश्वर के पवित्र ठहराए हुए समुदाय को दर्शाता है। “पवित्र लोगों” मूल पद का धार्मिक अर्थ बनाए रखता है, पर किसी विशिष्ट बाद की उपाधि या संप्रदायगत अर्थ को आयात नहीं करता।
- issue: ἐπηκολούθησεν में अनुसरण अथवा समर्पित संलग्नता
  choice: “तत्परता से लगी रही हो”
  alternative: हर भले काम के पीछे चली हो; हर भले काम को अपनाया हो
  rationale: सन्दर्भ में यह केवल पीछे चलने की भौतिक क्रिया नहीं, बल्कि भले कामों का सक्रिय और निरंतर अनुसरण है। पादटिप्पणी अधिक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानान्तर शर्तों में “किया हो/धोए हों/लगी रही हो” का क्रम यूनानी के बार-बार आए εἰ की सूचीगत संरचना को हिन्दी में सहज ढंग से दर्शाता है।
