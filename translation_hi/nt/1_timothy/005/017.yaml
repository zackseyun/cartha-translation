source:
  edition: SBLGNT
  text: Οἱ καλῶς προεστῶτες πρεσβύτεροι διπλῆς τιμῆς ἀξιούσθωσαν, μάλιστα οἱ κοπιῶντες ἐν λόγῳ καὶ διδασκαλίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/017.yaml
  text: Let the elders who lead well be considered worthy of double honor[c][b][a], especially those who labor in word and teaching.
translation:
  language: hi
  text: जो प्राचीन अच्छी तरह अगुवाई करते हैं, वे दोगुने आदर[a] के योग्य समझे जाएँ, विशेषकर[b] वे जो वचन और शिक्षा में परिश्रम करते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दोहरा आदर।” इस वाक्यांश में सम्मान और भौतिक सहायता—दोनों सम्मिलित हो सकते हैं, विशेषकर अगले पद को देखते हुए।
    reason: lexical_alternative
  - marker: b
    text: कुछ लोग “विशेषकर” को “अर्थात्” के अर्थ में समझते हैं; तब यहाँ उन्हीं प्राचीनों की पहचान कराई जा रही होगी जो वचन और शिक्षा में परिश्रम करते हैं।
    reason: alternative_reading
  - marker: c
    text: “वचन और शिक्षा” से सम्भवतः प्रचार और लोगों को सिखाने जैसी मौखिक सेवकाई का बोध होता है।
    reason: cultural_note
lexical_decisions:
- source_word: πρεσβύτεροι
  choice: प्राचीन
  rationale: यहाँ शब्द केवल अधिक आयु के पुरुषों के लिए नहीं, बल्कि मण्डली के मान्य अगुवों के लिए प्रयुक्त है। ‘प्राचीन’ हिन्दी मसीही प्रयोग में परिचित है और बाद की किसी विशिष्ट कलीसियाई पद-व्यवस्था को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: καλῶς προεστῶτες
  choice: अच्छी तरह अगुवाई करते हैं
  rationale: प्रयोग नेतृत्व और देखरेख करने का भाव देता है। ‘अगुवाई करना’ आधुनिक हिन्दी में स्वाभाविक है और ‘शासन करना’ की अपेक्षा कम कठोर होते हुए भी वास्तविक अधिकार को बनाए रखता है।
- source_word: διπλῆς τιμῆς
  choice: दुगने आदर
  rationale: यह निकटवर्ती शाब्दिक रूप मूल वाक्यांश की व्यापकता बनाए रखता है; सन्दर्भ में इसमें सम्मान के साथ भौतिक सहायता भी सम्मिलित हो सकती है।
- source_word: ἀξιούσθωσαν
  choice: योग्य समझे जाएँ
  rationale: यह निष्क्रिय आज्ञार्थक रूप समुदाय द्वारा उनकी योग्यता को स्वीकार करने का भाव व्यक्त करता है।
- source_word: μάλιστα
  choice: विशेषकर
  rationale: यह सामान्यतः एक समूह के भीतर किसी उपसमूह पर विशेष बल देता है और ‘अर्थात्’ जैसा निर्णायक तादात्म्य आरोपित नहीं करता।
- source_word: κοπιῶντες
  choice: कड़ा परिश्रम करते हैं
  rationale: क्रिया कठिन और थका देने वाले श्रम का बोध कराती है; यह अभिव्यक्ति सामान्य आधुनिक हिन्दी में उस तीव्रता को स्पष्ट करती है।
- source_word: ἐν λόγῳ
  choice: वचन ... देने के काम में
  rationale: λόγος यहाँ मौखिक सेवकाई—सन्देश सुनाने या प्रचार करने—की ओर संकेत करता है। ‘वचन’ मूल की व्यापकता रखता है, जबकि ‘काम में’ हिन्दी वाक्य को स्वाभाविक बनाता है।
- source_word: διδασκαλίᾳ
  choice: शिक्षा देने
  rationale: यह सुलभ और स्वाभाविक हिन्दी है तथा ‘सिद्धान्त’ जैसे अधिक तकनीकी अर्थ तक शब्द को सीमित नहीं करता।
theological_decisions:
- issue: मण्डली के अगुवों के सम्बन्ध में ‘दुगने आदर’ का अर्थ
  choice: मुख्य पाठ में व्यापक अभिव्यक्ति ‘दुगने आदर’ रखी गई है।
  alternative: दुगना सम्मान; दुगना पारिश्रमिक; ऐसा आदर जिसमें भौतिक सहायता भी सम्मिलित हो
  rationale: अगला पद भौतिक सहायता की ओर संकेत करता है, पर τιμή सम्मान या प्रतिष्ठा को भी समेट सकता है। व्यापक पदावली दोनों सम्भावनाएँ बनाए रखती है और किसी विशिष्ट सम्प्रदाय की पारिश्रमिक-व्यवस्था को पाठ में नहीं डालती।
- issue: μάλιστα का बल
  choice: विशेषकर
  alternative: अर्थात्
  rationale: ‘विशेषकर’ प्राचीनों के व्यापक समूह और वचन तथा शिक्षा में विशेष परिश्रम करने वालों पर दिए गए बल को बनाए रखता है, पर यह तय नहीं करता कि ये अनिवार्यतः वही पूरा समूह हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुलभ रखी गई है। ‘प्राचीन’ और ‘वचन’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, पर वाक्य-विन्यास सहज हिन्दी का है। मूल पाठ की ‘दुगने आदर’ और ‘विशेषकर’ सम्बन्धी व्याख्यात्मक अनिश्चितता मुख्य पाठ तथा टिप्पणियों में सुरक्षित रखी गई है।
