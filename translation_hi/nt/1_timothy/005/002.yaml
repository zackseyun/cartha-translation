translation:
  language: hi
  text: अधिक उम्र की स्त्रियों को माताओं के समान, और कम उम्र की स्त्रियों को बहनों के समान, संपूर्ण पवित्रता के साथ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर प्रकार की पवित्रता के साथ।” इस प्रसंग में मूल शब्द में शील और यौन मर्यादा का प्रबल भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρεσβυτέρας
  choice: बड़ी उम्र की स्त्रियों
  rationale: यह स्त्रीलिंग बहुवचन विशेषण संज्ञा के रूप में प्रयुक्त है और νεωτέρας के साथ आयु का विरोध दर्शाता है; यहाँ कलीसियाई पद का अर्थ नहीं है।
- source_word: ὡς μητέρας
  choice: माताओं के समान
  rationale: ὡς तुलना व्यक्त करता है। यह अनुवाद पारिवारिक रूपक बनाए रखता है और मूल में निहित न होने वाला ‘अपनी’ नहीं जोड़ता।
- source_word: νεωτέρας
  choice: कम उम्र की स्त्रियों
  rationale: यह भी स्त्रीलिंग बहुवचन विशेषण का संज्ञात्मक प्रयोग है और अपेक्षाकृत युवा स्त्रियों को दर्शाता है।
- source_word: ὡς ἀδελφὰς
  choice: बहनों के समान
  rationale: यह पारिवारिक संबंध का दूसरा तुलनात्मक रूपक है और मूल की संक्षिप्त समानांतर संरचना को बनाए रखता है।
- source_word: ἐν πάσῃ ἁγνείᾳ
  choice: पूरी शुद्धता के साथ
  rationale: πάσῃ व्यापकता या पूर्णता व्यक्त करता है और ἁγνείᾳ नैतिक शुद्धता को दर्शाता है, जिसमें इस संदर्भ में यौन मर्यादा प्रबल रूप से सम्मिलित है। ‘शुद्धता’ अर्थ को केवल यौन संयम तक सीमित नहीं करती।
theological_decisions:
- issue: युवा स्त्रियों के प्रति व्यवहार में ἁγνεία का दायरा
  choice: मुख्य पाठ में व्यापक अर्थ वाला ‘शुद्धता’ रखा गया है।
  alternative: ‘पूरी यौन पवित्रता के साथ’ या ‘पूर्ण शील के साथ’
  rationale: यह यूनानी शब्द सामान्य नैतिक शुद्धता व्यक्त कर सकता है, जबकि इस प्रसंग में यौन शुचिता और मर्यादा का भाव भी स्पष्ट रूप से उपस्थित है। व्यापक अनुवाद मूल की अर्थगत गुंजाइश को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बड़ी उम्र की/कम उम्र की स्त्रियाँ’ आयु-आधारित विरोध को स्पष्ट करती हैं; डैश अंतिम पदबंध को विशेष बल देते हुए उसके व्यापक व्यवहारगत संबंध को खुला रखता है।
