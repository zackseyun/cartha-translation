  text: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι πρόδηλοί εἰσιν, προάγουσαι εἰς κρίσιν, τισὶν δὲ καὶ ἐπακολουθοῦσιν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/024.yaml
  text: The sins of some people are obvious[a], going before them to judgment[b], but for others they follow after.
translation:
  language: hi
  text: कुछ लोगों के पाप स्पष्ट होते हैं[a] और न्याय तक उनसे पहले पहुँच जाते हैं[b], पर कुछ लोगों के पाप उनके पीछे आते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रकट होते हैं’।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘न्याय’ का अर्थ प्रसंगानुसार वर्तमान जाँच या मूल्यांकन हो सकता है; फिर भी इस शब्द का आशय व्यापक रूप से परमेश्वर का न्याय भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τινῶν ἀνθρώπων αἱ ἁμαρτίαι
  choice: कुछ लोगों के पाप
  rationale: संबंधकारक पदबंध को स्वाभाविक हिन्दी में रखा गया है। ἄνθρωπος यहाँ सामान्यतः मनुष्यों को दर्शाता है, इसलिए लिंग-निरपेक्ष ‘लोगों’ उपयुक्त है।
- source_word: πρόδηλοί
  choice: स्पष्ट
  rationale: यह πρόδηλος के खुले तौर पर दिखाई देने या साफ़ प्रकट होने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προάγουσαι εἰς κρίσιν
  choice: न्याय के लिए उनसे पहले पहुँच जाते हैं
  rationale: कृदंत का संबंध ‘पाप’ से है। अनुवाद पापों के व्यक्तियों से पहले न्याय तक पहुँचने के मानवीकरण और εἰς की दिशात्मकता को बनाए रखता है; ‘उनसे’ प्रसंग से निहित कर्म को स्पष्ट करता है।
- source_word: τισὶν δὲ καὶ ἐπακολουθοῦσιν
  choice: पर कुछ लोगों के पाप उनके पीछे आते हैं
  rationale: यूनानी में ‘पाप’ कर्ता के रूप में निहित है; हिन्दी में भ्रम से बचने के लिए उसे दोहराया गया है। ‘पीछे आते हैं’ पहले खंड के मानवीकरण को जारी रखता है और यह निर्धारित नहीं करता कि वे कब प्रकट होते हैं।
theological_decisions:
- issue: κρίσις का आशय
  choice: न्याय
  alternative: वर्तमान प्रसंग में जाँच या मूल्यांकन; अथवा व्यापक अर्थ में परमेश्वर का अंतिम न्याय
  rationale: निकटवर्ती प्रसंग लोगों, विशेषतः अगुवों या नियुक्ति के अभ्यर्थियों, के मूल्यांकन से जुड़ा है; फिर भी κρίσις का शब्दार्थ व्यापक न्याय को भी समेट सकता है। सामान्य ‘न्याय’ इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। वाक्य में पापों के आगे जाने और पीछे आने की मूल चित्रात्मकता सुरक्षित रखी गई है।
