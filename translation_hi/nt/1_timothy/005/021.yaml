id: 1TI.5.21
reference: 1 Timothy 5:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διαμαρτύρομαι ἐνώπιον τοῦ θεοῦ καὶ ⸂Χριστοῦ Ἰησοῦ⸃ καὶ τῶν ἐκλεκτῶν ἀγγέλων, ἵνα ταῦτα φυλάξῃς χωρὶς προκρίματος, μηδὲν ποιῶν κατὰ πρόσκλισιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/021.yaml
  text: I solemnly charge you in the presence of God and Messiah Jesus and the chosen angels[a], that you keep these things without prejudice[c][b], doing nothing according to partiality.
translation:
  language: hi
  text: मैं परमेश्वर, मसीह यीशु और चुने हुए स्वर्गदूतों[a] की उपस्थिति में तुम्हें गंभीरतापूर्वक आदेश देता हूँ कि तुम इन बातों का बिना पूर्वनिर्णय के पालन करो और कोई काम पक्षपात से न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्वाचित स्वर्गदूतों”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμαρτύρομαι
  choice: गंभीरतापूर्वक आदेश देता हूँ
  rationale: यह क्रिया यहाँ साधारण गवाही नहीं, बल्कि साक्षियों की उपस्थिति में दिए गए गंभीर आदेश का भाव रखती है।
- source_word: ἐνώπιον
  choice: की उपस्थिति में
  rationale: यह अभिव्यक्ति परमेश्वर, मसीह यीशु और स्वर्गदूतों को गंभीर साक्षियों के रूप में प्रस्तुत करती है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: यहाँ Χριστός की उपाधिगत अर्थवत्ता बनाए रखने के लिए प्रचलित हिन्दी उपाधि ‘मसीह’ चुनी गई है।
- source_word: ἐκλεκτῶν ἀγγέλων
  choice: चुने हुए स्वर्गदूतों
  rationale: ἐκλεκτός का मूल भाव ‘चुना हुआ’ है; यह साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: ταῦτα φυλάξῃς
  choice: इन बातों का पालन ... करो
  rationale: संदर्भ में ταῦτα पिछली शिक्षाओं की ओर संकेत करता है और φυλάσσω उनका सावधानी से पालन करने का अर्थ देता है।
- source_word: χωρὶς προκρίματος
  choice: बिना पहले से कोई निर्णय किए
  rationale: πρόκριμα किसी मामले को सुनने या परखने से पहले निर्णय कर लेने का भाव देता है; यह अनुवाद उस विशिष्ट अर्थ को सुरक्षित रखता है।
- source_word: μηδὲν ποιῶν κατὰ πρόσκλισιν
  choice: पक्षपात से कुछ न करो
  rationale: πρόσκλισις किसी एक ओर अनुचित झुकाव या पक्षधरता को सूचित करता है; हिन्दी वाक्यांश संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु / क्राइस्ट यीशु
  rationale: इस गंभीर आह्वान में Χριστός उपाधि का अर्थ बनाए रखता है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और व्यापक रूप से समझा जाता है।
- issue: ἐκλεκτῶν ἀγγέλων का आशय
  choice: चुने हुए स्वर्गदूत
  alternative: निर्वाचित स्वर्गदूत
  rationale: पाठ यह नहीं बताता कि वे किस उद्देश्य के लिए चुने गए हैं; इसलिए अनुवाद चयन के तथ्य को रखता है और उसकी धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य की गंभीर साक्ष्यात्मक ध्वनि को ‘की उपस्थिति में’ और ‘गंभीरतापूर्वक आदेश’ से बनाए रखा गया है; साथ ही πρόκριμα और πρόσκλισις के भेद को क्रमशः पहले से निर्णय और पक्षपात के रूप में व्यक्त किया गया है।
