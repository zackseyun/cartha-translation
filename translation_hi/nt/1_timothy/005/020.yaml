base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/020.yaml
  text: Rebuke those who are sinning before everyone[b][a], so that the rest also may have fear.
translation:
  language: hi
  text: जो पाप कर रहे हैं[a][b], उन्हें सबके सामने फटकार, ताकि बाकी लोग भी भय मानें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो पाप में लगे रहते हैं”; वर्तमानकालिक कृदन्त लगातार चलते पापपूर्ण आचरण का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: तत्काल प्रसंग विशेष रूप से पाप करने वाले अगुवों की ओर संकेत कर सकता है, यद्यपि इस पद में केवल “जो पाप कर रहे हैं” कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: τοὺς ἁμαρτάνοντας
  choice: जो पाप कर रहे हैं
  rationale: वर्तमानकालिक कृदन्त यहाँ संज्ञा के रूप में प्रयुक्त है। यह अनुवाद चल रहे आचरण की सम्भावना बनाए रखता है, पर मूल से आगे बढ़कर अनिवार्य रूप से ‘पाप में लगे रहते हैं’ नहीं कहता।
- source_word: ἐνώπιον πάντων
  choice: सबके सामने
  rationale: यह ‘सभी के सामने/उपस्थित रहते’ का स्वाभाविक आधुनिक हिन्दी रूप है और सार्वजनिक प्रसंग को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: ἔλεγχε
  choice: डाँट
  rationale: ἐλέγχω में दोष प्रकट करने, समझाने और ताड़ना देने का भाव हो सकता है। इस अनुशासनात्मक प्रसंग में ‘डाँट’ साधारण पाठक के लिए स्वाभाविक है और सुधारात्मक फटकार का भाव देता है।
- source_word: οἱ λοιποὶ
  choice: बाकी लोग
  rationale: यह अपराध करने वालों से अलग समुदाय के अन्य लोगों को सूचित करता है और आधुनिक हिन्दी में सहज है।
- source_word: φόβον ἔχωσιν
  choice: भय रखें
  rationale: यह यूनानी मुहावरे ‘भय रखें’ के निकट रहता है और भय को केवल आतंक अथवा केवल श्रद्धापूर्ण भय ठहराकर अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: प्रसंग में पाप करने वालों का दायरा
  choice: मुख्य पाठ में सामान्य शब्दावली ‘जो पाप कर रहे हैं’ रखी गई है; ‘प्राचीन’ नहीं जोड़ा गया।
  alternative: तत्काल पूर्ववर्ती प्रसंग के कारण इसे विशेष रूप से पाप करने वाले प्राचीनों के विषय में समझा जा सकता है।
  rationale: इस पद में यूनानी पाठ स्वयं केवल ‘जो पाप कर रहे हैं’ कहता है। पिछले पद में प्राचीनों का उल्लेख होने से उनका संदर्भ सम्भव है, पर उसे मुख्य पाठ में जोड़ना मूल की अस्पष्टता को समाप्त कर देता।
- issue: भय का स्वरूप
  choice: ‘भय रखें’ कहकर भय का स्वरूप खुला रखा गया है।
  alternative: इसे दंड का डर, गंभीर चेतावनी से उत्पन्न आशंका, या उचित श्रद्धामिश्रित भय के रूप में समझा जा सकता है।
  rationale: φόβον अपने आप में इन सम्भावनाओं में से किसी एक को यहाँ निर्णायक रूप से निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक निर्देश के अनुरूप शैली रखी गई है। ‘ताड़ना दे’ की अपेक्षा ‘डाँट’ अधिक सहज है; ‘भय रखें’ मूल के जानबूझकर खुले अर्थ को सुरक्षित रखता है।
