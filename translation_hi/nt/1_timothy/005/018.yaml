  text: λέγει γὰρ ἡ γραφή· Βοῦν ἀλοῶντα οὐ φιμώσεις, καί· Ἄξιος ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/018.yaml
  text: For the Scripture says[a], “You shall not muzzle an ox while it is threshing,” and[b], “The laborer is worthy of his wages.”
translation:
  language: hi
  text: क्योंकि पवित्रशास्त्र कहता है, “अनाज रौंदते हुए बैल का मुँह न बाँधना,”[a] और “मज़दूर अपनी मज़दूरी पाने का अधिकारी है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनाज दाँवते हुए।” यूनानी शब्द उस बैल को सूचित करता है जो मड़ाई के लिए अनाज पर चलता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मज़दूर अपनी मेहनत की मज़दूरी पाने योग्य है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει γὰρ ἡ γραφή
  choice: क्योंकि पवित्रशास्त्र कहता है
  rationale: γάρ पिछले कथन का आधार बताता है, इसलिए ‘क्योंकि’ स्वाभाविक है। ἡ γραφή अधिकारपूर्ण पवित्र लेख को सूचित करता है और वर्तमान काल λέγει को ‘कहता है’ रखा गया है।
- source_word: Βοῦν ἀλοῶντα
  choice: दाँवते हुए बैल
  rationale: βοῦς खेत के काम में लगाए गए बैल को और ἀλοάω अनाज को दाँवने अथवा रौंदकर दाना अलग करने की क्रिया को दर्शाता है। संक्षिप्त मुख्य पाठ में ‘दाँवते हुए’ कृषि-संदर्भ को बनाए रखता है।
- source_word: οὐ φιμώσεις
  choice: मुँह न बाँधना
  rationale: भविष्यत् सूचक रूप यहाँ निषेधात्मक आज्ञा के रूप में प्रयुक्त है। हिंदी धर्मशास्त्रीय उद्धरण में ‘न बाँधना’ इस विधिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἄξιος ὁ ἐργάτης
  choice: मज़दूर ... हकदार है
  rationale: ἐργάτης काम करने वाले व्यक्ति, विशेषतः श्रमिक, को दर्शाता है। ἄξιος का इस संदर्भ में स्वाभाविक हिंदी अर्थ पारिश्रमिक का ‘हकदार’ होना है।
- source_word: τοῦ μισθοῦ αὐτοῦ
  choice: अपनी मज़दूरी का
  rationale: μισθός यहाँ किए गए काम के बदले मिलने वाला पारिश्रमिक है, न कि अमूर्त प्रतिफल। संबंधवाचक αὐτοῦ को हिंदी में कर्ता-सापेक्ष ‘अपनी’ से स्वाभाविक और एकवचन रूप में व्यक्त किया गया है।
theological_decisions:
- issue: γραφή के अंतर्गत दोनों उद्धरणों का संबंध
  choice: दोनों कथनों को ‘पवित्रशास्त्र कहता है’ के अधीन समानांतर उद्धरणों के रूप में प्रस्तुत किया गया है।
  alternative: केवल पहले कथन को पवित्रशास्त्र और दूसरे को अलग लोकोक्ति या प्रभु यीशु का कथन मानना।
  rationale: यूनानी वाक्य दोनों उद्धरणों को एक ही परिचय के बाद καί से जोड़ता है। अनुवाद इस संरचना को रखता है, पर इससे कैनन के विषय में आगे का कोई सिद्धांत निर्धारित नहीं करता।
- issue: αὐτοῦ का लिंग और वचन
  choice: ‘अपनी मज़दूरी’ द्वारा एकवचन संबंध सुरक्षित रखा गया है।
  alternative: ‘उनकी मज़दूरी’ जैसे बहुवचन या स्पष्ट पुरुषवाचक ‘उसकी मज़दूरी’।
  rationale: यूनानी सर्वनाम पुल्लिंग एकवचन है। हिंदी का ‘अपनी’ कर्ता से संबंध स्पष्ट करता है और बिना अनावश्यक लिंग-बल के मूल का एकवचन बनाए रखता है; ‘मज़दूर’ स्वयं व्याकरणिक रूप से पुल्लिंग एकवचन है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘पवित्रशास्त्र’ धार्मिक संदर्भ में स्पष्ट है; ‘दाँवना’ प्राचीन कृषि-क्रिया को संक्षेप में व्यक्त करता है, जिसे पादटिप्पणी स्पष्ट करती है। उद्धरणों के बीच ‘और’ से यूनानी καί की समानांतर संरचना सुरक्षित है।
