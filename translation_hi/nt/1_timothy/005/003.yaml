lexical_decisions:
- source_word: Χήρας
  choice: विधवा
  rationale: यह शब्द उन स्त्रियों को दर्शाता है जिनके पति की मृत्यु हो चुकी है। हिन्दी में ‘विधवा’ इसका सीधा और स्वाभाविक रूप है।
- source_word: τίμα
  choice: आदर करो
  rationale: क्रिया का मूल अर्थ सम्मान या आदर देना है। इस प्रसंग में आदर के अंतर्गत व्यावहारिक और आर्थिक सहायता भी आ सकती है, पर मुख्य पाठ में केवल ‘सहायता करो’ कहना अर्थ को अनावश्यक रूप से संकुचित कर देगा।
- source_word: τὰς ὄντως χήρας
  choice: जो सचमुच विधवा हैं
  rationale: ὄντως यहाँ एक वास्तविक भेद प्रकट करता है, जिसकी व्याख्या आगे के प्रसंग में उन विधवाओं के रूप में होती है जो वास्तव में निराश्रित हैं और कलीसिया की देखभाल की पात्र हैं। यह अनुवाद यूनानी की पुनरुक्ति का आशय स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὄντως
  choice: सचमुच
  rationale: यह केवल बल देने के बजाय वास्तविक स्थिति के आधार पर भेद करता है। ‘सचमुच’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: इस प्रसंग में τιμάω का दायरा
  choice: मुख्य पाठ में ‘आदर करो’ रखा गया है; इसमें सम्मान के साथ भौतिक सहायता भी निहित हो सकती है।
  alternative: जो सचमुच विधवा हैं, उनकी सहायता करो।
  rationale: आस-पास का प्रसंग विधवाओं के भरण-पोषण और देखभाल की चर्चा करता है, फिर भी यूनानी क्रिया का अर्थ केवल आर्थिक सहायता तक सीमित नहीं है। इसलिए मुख्य पाठ व्यापक अर्थ रखता है और संदर्भगत विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आदर करो’ सामान्य पाठक के लिए स्पष्ट है और यूनानी क्रिया की व्यापकता को सुरक्षित रखता है।
