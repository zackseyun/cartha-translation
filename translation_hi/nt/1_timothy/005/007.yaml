translation:
  language: hi
  text: और इन बातों के संबंध में आदेश देते रहो,[a] ताकि वे[b] दोषारोपण से परे हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इन बातों के संबंध में निर्देश देते रहो’; यहाँ प्रयुक्त क्रिया में अधिकारपूर्वक आदेश देने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘वे’ का कर्ता स्पष्ट रूप से नहीं बताया गया है। संदर्भ में इसका संकेत संभवतः पिछले निर्देशों से संबोधित लोगों, विशेषकर विधवाओं और उनके परिवारों, की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले निर्देशों से वाक्य का सीधा संबंध बनाए रखता है और मूल में निहित न होने वाला अतिरिक्त बल नहीं जोड़ता।
- source_word: ταῦτα
  choice: इन बातों
  rationale: नपुंसकलिंग बहुवचन संकेतवाचक शब्द पहले और आसपास दिए गए निर्देशों की ओर संकेत करता है; ‘इन बातों’ मूल की व्यापकता को बनाए रखता है।
- source_word: παράγγελλε
  choice: आज्ञा देते रहो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर आधिकारिक निर्देश देने का भाव रखता है। ‘आज्ञा देते रहो’ उसके अधिकारपूर्ण और चलते रहने वाले दोनों पक्षों को व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम का स्वाभाविक आधुनिक हिन्दी संकेत है।
- source_word: ἀνεπίλημπτοι
  choice: ऐसे हों कि उन पर कोई उचित आरोप न लगाया जा सके
  rationale: यह पद वैध आलोचना या आरोप से परे होने का अर्थ देता है। यह विस्तार ‘निर्दोष’ से उत्पन्न हो सकने वाले पूर्ण पापहीनता के अर्थ से बचते हुए यूनानी भाव स्पष्ट करता है।
- source_word: ὦσιν
  choice: वे ... हों
  rationale: ἵνα के साथ वर्तमान संभावनार्थक रूप को उद्देश्य-वाक्य में ‘हों’ स्वाभाविक रूप से व्यक्त करता है; बहुवचन कर्ता मूल में निहित है।
theological_decisions:
- issue: ‘वे ... हों’ के निहित बहुवचन कर्ता का संदर्भ
  choice: मुख्य पाठ में केवल ‘वे’ रखा गया है; किसी विशेष समूह का नाम नहीं जोड़ा गया।
  alternative: इसे विधवाओं और उनके परिवारों, केवल विधवाओं, तीमुथियुस, अथवा व्यापक कलीसियाई समुदाय के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ बहुवचन कर्ता को स्पष्ट रूप से नहीं बताता। निकट संदर्भ संभवतः पिछले निर्देशों से संबोधित लोगों, विशेषकर विधवाओं और उनके परिवारों, की ओर संकेत करता है; फिर भी किसी एक पहचान को मुख्य पाठ में निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आज्ञा देते रहो’ अधिकार और निरंतरता दोनों को व्यक्त करता है। ‘कोई उचित आरोप न लगाया जा सके’ नैतिक रूप से निन्दा से परे होने का भाव देता है, बिना पूर्ण पापहीनता का दावा किए।
