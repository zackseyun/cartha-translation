  text: ἤδη γάρ τινες ἐξετράπησαν ὀπίσω τοῦ Σατανᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/015.yaml
  text: For some have already turned aside to follow Satan.
translation:
  language: hi
  text: क्योंकि कुछ लोग पहले ही भटककर शैतान के पीछे हो लिए हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη
  choice: पहले ही
  rationale: यह उस भटकाव को बीती हुई किंतु वर्तमान संदर्भ में प्रासंगिक घटना बताता है और क्रियाविशेषण की कालगत शक्ति बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले निर्देश का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: τινες
  choice: कुछ लोग
  rationale: यह एक अनिर्दिष्ट समूह के कुछ सदस्यों को दर्शाता है; हिन्दी में ‘कुछ लोग’ सहज और स्पष्ट है।
- source_word: ἐξετράπησαν
  choice: भटककर
  rationale: यह सही मार्ग से हट जाने के रूपक को व्यक्त करता है और अनावश्यक रूप से यह अर्थ नहीं जोड़ता कि किसी बाहरी शक्ति ने उन्हें भटकाया।
- source_word: ὀπίσω
  choice: के पीछे हो लिए
  rationale: ὀπίσω का मूल दिशात्मक अर्थ ‘पीछे/बाद’ है और व्यक्ति के साथ यह उसके पीछे चलने या उसका अनुसरण करने का भाव देता है; ‘पीछे हो लिए’ दोनों पहलुओं को स्वाभाविक हिन्दी में रखता है।
- source_word: Σατανᾶ
  choice: शैतान
  rationale: नए नियम के इस नाम/उपाधि का मानक और सर्वसुलभ हिन्दी रूप है।
theological_decisions:
- issue: ὀπίσω τοῦ Σατανᾶ को शाब्दिक दिशात्मक भाषा में रखा जाए या स्पष्ट रूप से ‘शैतान का अनुसरण’ कहा जाए।
  choice: शैतान के पीछे हो लिए
  alternative: शैतान का अनुसरण करने लगे
  rationale: चुना हुआ रूप मूल के ‘पीछे’ वाले रूपक को बनाए रखते हुए निष्ठा या अनुसरण का गंभीर भाव भी स्पष्ट करता है, और किसी विशेष सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की आरंभिक कारणसूचक कड़ी तथा मार्ग से हटकर शैतान के पीछे जाने का मूल रूपक संरक्षित है।
