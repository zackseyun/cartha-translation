source:
  edition: SBLGNT
  text: εἰ δέ τις χήρα τέκνα ἢ ἔκγονα ἔχει, μανθανέτωσαν πρῶτον τὸν ἴδιον οἶκον εὐσεβεῖν καὶ ἀμοιβὰς ἀποδιδόναι τοῖς προγόνοις, τοῦτο γάρ ἐστιν ἀπόδεκτον ἐνώπιον τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/004.yaml
  text: But if any widow has children or grandchildren[a], let them first learn to show godliness to their own household and to repay their forebears[c][b], for this is acceptable before God.
translation:
  language: hi
  text: पर यदि किसी विधवा के बच्चे या नाती-पोते[a] हों, तो वे पहले अपने ही घर-परिवार के प्रति भक्ति दिखाना[b] और अपने पूर्वजों के प्रति प्रत्युपकार करना[c] सीखें, क्योंकि यह परमेश्वर के सामने ग्रहणयोग्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच्चे या वंशज।” यूनानी शब्द ἔκγονα का अर्थ “वंशज” भी हो सकता है, यद्यपि यहाँ संभवतः परिवार की अगली पीढ़ी, अर्थात नाती-पोते, अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने ही घर-परिवार के प्रति भक्ति का आचरण करना।” यूनानी में परिवार के प्रति इस आचरण को भक्ति से जोड़ा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “अपने माता-पिता के प्रति प्रत्युपकार करना”; अथवा “अपने पूर्वजों को प्रतिफल देना।” यूनानी शब्द का शाब्दिक अर्थ अपने से पहले जन्मे लोग या पूर्वज है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: विधवा
  rationale: यह उस स्त्री के लिए मानक और प्रसंगानुकूल शब्द है जिसका पति मर चुका है।
- source_word: τέκνα ἢ ἔκγονα
  choice: बच्चे या नाती-पोते
  rationale: τέκνα का अर्थ बच्चे है; ἔκγονα का व्यापक अर्थ वंशज हो सकता है, पर पारिवारिक देखभाल के इस प्रसंग में नाती-पोते स्वाभाविक और संभावित आशय है।
- source_word: μανθανέτωσαν πρῶτον
  choice: वे पहले ... सीखें
  rationale: बहुवचन वर्तमान आज्ञार्थक का निर्देशात्मक बल बनाए रखता है और πρῶτον से व्यक्त प्राथमिकता को स्पष्ट करता है।
- source_word: τὸν ἴδιον οἶκον
  choice: अपने ही घर-परिवार
  rationale: οἶκος यहाँ केवल भवन नहीं, बल्कि परिवार अथवा गृहस्थी को सूचित करता है; अपने ही से ἴδιον का बल आता है।
- source_word: εὐσεβεῖν
  choice: सेवा करके अपनी भक्ति दिखाना
  rationale: क्रिया में धार्मिक भक्ति का भाव है, जो इस प्रसंग में परिवार के प्रति व्यावहारिक सेवा और देखभाल से प्रकट होता है।
- source_word: ἀμοιβὰς ἀποδιδόναι
  choice: उपकार चुकाना
  rationale: यह पहले मिली पारिवारिक देखभाल के बदले प्रत्युपकार करने का स्वाभाविक हिन्दी रूप है।
- source_word: τοῖς προγόνοις
  choice: अपने से पहले की पीढ़ी
  rationale: यह माता-पिता तक अर्थ को सीमित किए बिना पूर्ववर्ती पीढ़ी का बोध कराता है और जीवित पारिवारिक जनों की देखभाल के प्रसंग में 'पुरखों' से अधिक स्पष्ट है।
- source_word: ἀπόδεκτον
  choice: ग्रहणयोग्य
  rationale: यह परमेश्वर द्वारा ऐसे आचरण को अनुकूल रूप से स्वीकार किए जाने का निकट और गरिमापूर्ण रूप है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: मूल मुहावरे को निकटता से रखते हुए परमेश्वर की उपस्थिति और मूल्यांकन दोनों का भाव देता है।
theological_decisions:
- issue: बहुवचन आज्ञार्थक μανθανέτωσαν का कर्ता
  choice: आज्ञा विधवा के बच्चों या नाती-पोतों को संबोधित है।
  alternative: इसे विधवाओं के लिए आज्ञा माना जाए, जिसमें वचन-परिवर्तन या कोई निहित कर्ता स्वीकार किया जाए।
  rationale: सबसे निकट और स्वाभाविक बहुवचन कर्ता τέκνα ἢ ἔκγονα है। इससे परिवार के सदस्यों द्वारा विधवा की देखभाल और पिछली पीढ़ी का उपकार चुकाने का प्रवाह भी स्पष्ट रहता है।
- issue: εὐσεβεῖν और पारिवारिक देखभाल का संबंध
  choice: परिवार की सेवा को भक्ति की व्यावहारिक अभिव्यक्ति के रूप में रखा गया है।
  alternative: इसे धार्मिक अर्थ के बिना केवल पारिवारिक कर्तव्य पूरा करना माना जाए।
  rationale: εὐσεβεῖν में स्पष्ट धार्मिक भाव है, और पद के अंत में इस आचरण को परमेश्वर के सामने ग्रहणयोग्य कहा गया है; इसलिए व्यावहारिक सेवा और भक्ति दोनों को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। “घर-परिवार” सामान्य पाठक के लिए गृहस्थी और पारिवारिक इकाई दोनों को स्पष्ट करता है। “सेवा करके अपनी भक्ति दिखाना” मूल के धार्मिक और व्यावहारिक दोनों आयामों को स्वाभाविक हिन्दी में साथ रखता है।
