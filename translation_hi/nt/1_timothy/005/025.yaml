- from: इसी प्रकार अच्छे काम भी प्रकट होते हैं, और जो काम ऐसे नहीं हैं[a], वे छिपे नहीं रह सकते।
  to: इसी प्रकार अच्छे काम भी स्पष्ट हैं, और जो काम दूसरे प्रकार के हैं[a], वे छिपे नहीं रह सकते।
  rationale: Revised only for idiomatic modern Hindi and closer representation of the Greek predicates. The rendering continues to leave open whether the otherwise-characterized works are morally different, not yet evident, or both in contextual implication.
