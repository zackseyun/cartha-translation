id: 1TI.5.25
reference: 1 Timothy 5:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡσαύτως καὶ τὰ ⸂ἔργα τὰ καλὰ⸃ ⸀πρόδηλα, καὶ τὰ ἄλλως ἔχοντα κρυβῆναι οὐ δύνανται.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/025.yaml
  text: Likewise also[a], good works are evident, and those that are otherwise cannot remain hidden.
translation:
  language: hi
  text: इसी प्रकार अच्छे काम भी स्पष्ट हैं, और जो काम दूसरे प्रकार के हैं[a], वे छिपे नहीं रह सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो काम भिन्न प्रकार के हैं” अथवा “जो उस तरह प्रकट नहीं हैं।” पिछले पद के आधार पर कुछ लोग इसे विशेष रूप से बुरे कामों के अर्थ में समझते हैं।
    reason: मूल यूनानी वाक्यांश यह स्पष्ट नहीं करता कि अंतर कामों की नैतिक प्रकृति में है या उनके अभी प्रकट न होने में।
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पद 24 के समानांतर संबंध को स्पष्ट करता है और ὡσαύτως तथा καί, दोनों की संयुक्त बलवत्ता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔργα τὰ καλά
  choice: अच्छे काम
  rationale: यह ἔργα के ठोस अर्थ और καλά की नैतिक गुणवत्ता, दोनों को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρόδηλα
  choice: प्रकट होते हैं
  rationale: यह कामों के स्पष्ट या सामने आ जाने का भाव देता है और आगे आने वाले ‘छिपे नहीं रह सकते’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: τὰ ἄλλως ἔχοντα
  choice: जो काम ऐसे नहीं हैं
  rationale: यह यूनानी वाक्यांश की अस्पष्टता बनाए रखता है—अर्थ उन कामों से हो सकता है जो अभी प्रकट नहीं हैं, अथवा संदर्भानुसार उन कामों से जो अच्छे नहीं हैं—बिना ‘बुरे काम’ को पाठ में जोड़ने के।
- source_word: κρυβῆναι οὐ δύνανται
  choice: छिपे नहीं रह सकते
  rationale: यह असमर्थता को स्पष्ट करता है और प्रसंगानुसार यह भाव व्यक्त करता है कि जो अभी सामने नहीं हैं, वे अंततः छिपे नहीं रहेंगे।
theological_decisions:
- issue: क्या τὰ ἄλλως ἔχοντα विशेष रूप से बुरे कामों को बताता है या सामान्य रूप से उन कामों को जो उसी प्रकार प्रकट नहीं हैं
  choice: व्यापक और अस्पष्ट अभिव्यक्ति ‘जो काम ऐसे नहीं हैं’
  alternative: ‘बुरे काम’
  rationale: यूनानी पाठ स्पष्ट रूप से ‘बुरे’ नहीं कहता। व्यापक अनुवाद मूल की अस्पष्टता और पद 24 से उत्पन्न संभावित नैतिक संकेत, दोनों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अच्छे काम’ सामान्य पाठक के लिए स्वाभाविक है; ‘जो काम ऐसे नहीं हैं’ जानबूझकर मूल की अर्थगत खुलावट बनाए रखता है।
