  source_fidelity: The draft correctly retains the parallel force of ὡσαύτως καί, renders ἔργα τὰ καλά as ‘अच्छे काम,’ and does not overstate τὰ ἄλλως ἔχοντα as explicitly evil works. A small revision better represents πρόδηλα as a present state (‘स्पष्ट हैं’) and makes the second substantival phrase more idiomatic while retaining its deliberate ambiguity.
  naturalness: ‘जो काम ऐसे नहीं हैं’ is grammatically possible but somewhat vague and unnatural in Hindi without a clearly specified antecedent. ‘जो काम दूसरे प्रकार के हैं’ is smoother and still does not decide whether the difference concerns moral character or present visibility.
  terminology: ‘अच्छे काम’ is suitable modern Hindi and preserves the ethical sense of καλά. ‘स्पष्ट’ naturally conveys πρόδηλα in contrast to being hidden. No theological terminology requires alteration.
  issues:
  - severity: low
    issue: ‘प्रकट होते हैं’ can sound eventive or habitual rather than describe the evident state expressed by πρόδηλα.
    rationale: ‘स्पष्ट हैं’ more directly conveys that the good works are manifest/evident while retaining the contrast with κρυβῆναι.
  - severity: medium
    issue: ‘जो काम ऐसे नहीं हैं’ is insufficiently idiomatic and can be heard chiefly as ‘works that are not good.’
    rationale: The Greek wording is intentionally broader than ‘evil works.’ ‘जो काम दूसरे प्रकार के हैं’ preserves the contrast without identifying its precise nature; the footnote explains the viable senses.
