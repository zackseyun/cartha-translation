base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/019.yaml
  text: Do not accept an accusation against an elder[b][a], except on the basis of two or three witnesses.
translation:
  language: hi
  text: कलीसिया के किसी प्राचीन[a] के विरुद्ध कोई आरोप स्वीकार न करो, सिवाय इसके कि वह दो या तीन गवाहों के साक्ष्य पर हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी वृद्ध पुरुष”; यूनानी शब्द आयु में बड़े पुरुष या कलीसिया के प्राचीन—दोनों के लिए प्रयुक्त हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यह पुराने नियम के उस न्यायिक सिद्धांत को दर्शाता है कि कोई मामला दो या तीन गवाहों के आधार पर स्थापित हो (देखें व्यवस्थाविवरण 19:15)।
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ πρεσβυτέρου
  choice: किसी प्राचीन के विरुद्ध
  rationale: यहाँ πρεσβύτερος निकटवर्ती कलीसियाई संदर्भ में अगुवे के पद को सूचित करता है; फिर भी इसका आयु-आधारित अर्थ ‘वृद्ध पुरुष’ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: κατηγορίαν
  choice: आरोप
  rationale: यह शब्द औपचारिक अभियोग या दोषारोपण का न्यायिक भाव रखता है; ‘आरोप’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: μὴ παραδέχου
  choice: स्वीकार न करो
  rationale: आज्ञार्थक रूप किसी आरोप को सुनवाई या विचार के लिए ग्रहण न करने का निर्देश देता है; इसका अर्थ आरोप को स्वतः झूठा मानना नहीं है।
- source_word: ἐκτὸς εἰ μὴ
  choice: जब तक कि … न हो
  rationale: यह यूनानी मुहावरा अपवाद अथवा आवश्यक शर्त बताता है; हिन्दी में यह संरचना स्वाभाविक रूप से वही अर्थ व्यक्त करती है।
- source_word: ἐπὶ δύο ἢ τριῶν μαρτύρων
  choice: दो या तीन गवाहों के आधार पर
  rationale: ἐπί यहाँ साक्ष्य के आधार को व्यक्त करता है और व्यवस्थाविवरण की न्यायिक भाषा की प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: πρεσβυτέρου का अर्थ
  choice: कलीसिया का प्राचीन/अगुवा
  alternative: वृद्ध पुरुष
  rationale: 1 तीमुथियुस 5 के निकटवर्ती संदर्भ में कलीसिया के प्राचीनों की चर्चा होने के कारण पद-संबंधी अर्थ अधिक संभावित है, पर आयु-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दो या तीन गवाहों की आवश्यकता
  choice: आरोप ग्रहण करने के लिए प्रमाण-संबंधी शर्त
  alternative: केवल दो या तीन व्यक्तियों द्वारा संयुक्त रूप से आरोप प्रस्तुत करना
  rationale: वाक्यांश पुराने नियम के उस न्यायिक सिद्धांत की ओर संकेत करता है जिसमें किसी मामले को दो या तीन गवाहों के आधार पर स्थापित किया जाता है; अनुवाद इसी प्रमाणिक आधार को व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। ‘प्राचीन’ भारतीय हिन्दी बाइबल परंपरा में कलीसियाई पद के लिए परिचित है, जबकि संभावित आयु-आधारित अर्थ पादटिप्पणी में स्पष्ट किया गया है।
