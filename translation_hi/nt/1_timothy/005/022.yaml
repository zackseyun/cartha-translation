  text: χεῖρας ταχέως μηδενὶ ἐπιτίθει, μηδὲ κοινώνει ἁμαρτίαις ἀλλοτρίαις· σεαυτὸν ἁγνὸν τήρει.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/022.yaml
  text: Do not lay hands on anyone hastily[a], nor share in the sins of others; keep yourself pure.
translation:
  language: hi
  text: किसी पर भी जल्दबाज़ी में हाथ न रखना[a], और न दूसरों के पापों में सहभागी होना; अपने आप को शुद्ध बनाए रखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस संदर्भ में अधिक विशेष रूप से, “किसी को बहुत जल्दी नियुक्त या अभिषिक्त न करना।” यूनानी में शाब्दिक रूप से “हाथ रखना” है—यह मुहावरा प्रायः सेवकाई के लिए नियुक्ति या सार्वजनिक मान्यता से जुड़ा होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χεῖρας ... ἐπιτίθει
  choice: हाथ न रखना
  rationale: यूनानी का शाब्दिक मुहावरा ‘हाथ रखना’ है। पास्टरल संदर्भ में यह सेवकाई के लिए नियुक्ति, अभिषेक या सार्वजनिक समर्थन से जुड़ा हो सकता है, पर मुख्य पाठ में मुहावरा बनाए रखने से अर्थ को किसी एक कलीसियाई प्रक्रिया तक सीमित नहीं किया गया।
- source_word: ταχέως
  choice: जल्दबाज़ी में
  rationale: यह केवल शीघ्रता नहीं, बल्कि बिना पर्याप्त विचार या जाँच के समय से पहले कार्रवाई करने की चेतावनी देता है।
- source_word: μηδενὶ
  choice: किसी पर भी ... न
  rationale: निषेध के साथ यह हिंदी में स्वाभाविक रूप से सार्वभौमिक दायरा व्यक्त करता है।
- source_word: μηδὲ κοινώνει
  choice: और न ... सहभागी होना
  rationale: κοινωνέω यहाँ भाग लेने या दोष में साझेदार बनने का भाव रखता है। ‘सहभागी होना’ गरिमापूर्ण और स्पष्ट हिंदी है।
- source_word: ἁμαρτίαις ἀλλοτρίαις
  choice: दूसरों के पापों में
  rationale: ἀλλοτρίαις का अर्थ ‘दूसरों से संबंधित’ है; यह रूप सहज हिंदी में वही संबंध बनाए रखता है।
- source_word: σεαυτὸν ἁγνὸν τήρει
  choice: अपने आप को शुद्ध बनाए रखना
  rationale: ἁγνός यहाँ व्यापक नैतिक शुद्धता बताता है, केवल यौन शुचिता नहीं। वर्तमान आज्ञार्थक का निरंतर भाव ‘बनाए रखना’ से व्यक्त होता है।
theological_decisions:
- issue: संदर्भ में ‘हाथ रखना’ का अर्थ
  choice: मुख्य पाठ में ‘हाथ रखना’ मुहावरा बनाए रखा गया।
  alternative: ‘किसी को जल्दबाज़ी में नियुक्त/अभिषिक्त न करना।’
  rationale: निकट संदर्भ में प्राचीनों और उत्तरदायित्व की चर्चा के कारण सेवकाई में नियुक्ति या मान्यता संभावित आशय है। फिर भी यूनानी में नियुक्ति का स्पष्ट क्रिया-पद नहीं है; इसलिए किसी खास कलीसियाई रीति को अनिवार्य किए बिना मुहावरा रखा गया और संभावित अर्थ पादटिप्पणी में दिया गया।
- issue: दोनों निषेधों के बीच संबंध
  choice: दूसरों के पापों में सहभागिता की व्यापक चेतावनी रखी गई।
  alternative: इसे केवल जल्दबाज़ नियुक्ति के कारण दोषी होने तक सीमित करना।
  rationale: वाक्यों का निकट संबंध संकेत करता है कि असमय समर्थन किसी को दूसरे के पापों में सहभागी बना सकता है, पर यूनानी इस संबंध को स्पष्ट रूप से परिभाषित नहीं करता। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी में सहज और गरिमापूर्ण शैली। ‘हाथ रखना’ परिचित बाइबलीय मुहावरे को सुरक्षित रखता है; पादटिप्पणी संभावित संदर्भगत अर्थ स्पष्ट करती है। समानांतर निषेधों और अंतिम आज्ञा को संक्षिप्त अर्धविरामयुक्त संरचना में रखा गया है।
