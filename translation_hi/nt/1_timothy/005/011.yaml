lexical_decisions:
- source_word: νεωτέρας δὲ χήρας
  choice: पर जवान विधवाओं को
  rationale: δὲ पिछले निर्देश से हल्का विरोध दिखाता है, और νεωτέρας χήρας उन विधवाओं को दर्शाता है जो अपेक्षाकृत कम उम्र की हैं। ‘जवान विधवाएँ’ स्वाभाविक आधुनिक हिन्दी है और कोई निश्चित आयु-सीमा नहीं जोड़ता।
- source_word: παραιτοῦ
  choice: सूची में लेने से मना कर दे
  rationale: केवल ‘अस्वीकार कर’ कहने से सामाजिक बहिष्कार का अर्थ निकल सकता है। प्रसंग में विधवाओं की एक विशेष सूची में नाम दर्ज करने की बात है, इसलिए संक्षिप्त प्रासंगिक स्पष्टता जोड़ी गई है।
- source_word: ὅταν γὰρ
  choice: क्योंकि जब
  rationale: यह पदबंध कारण और सामान्यतः घटने वाली परिस्थिति, दोनों को व्यक्त करता है।
- source_word: καταστρηνιάσωσιν
  choice: उनकी कामनाएँ उन्हें … ले जाती हैं
  rationale: यह दुर्लभ क्रिया प्रबल कामुक या भोग-विलासी आवेगों के वश में होने का भाव रखती है। हिन्दी में यह वाक्यांश उस प्रेरक शक्ति को सहज ढंग से व्यक्त करता है, बिना विवाह की इच्छा को अपने-आप पापपूर्ण ठहराए।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के विरुद्ध
  rationale: कठिन संबंधकारक रचना को निकटता से सुरक्षित रखा गया है। ‘मसीह’ Χριστός के पदवीगत अर्थ के लिए हिन्दी में स्थापित और स्वाभाविक रूप है।
- source_word: γαμεῖν θέλουσιν
  choice: वे विवाह करना चाहती हैं
  rationale: θέλω के साथ infinitive इच्छा या अभिलाषा व्यक्त करता है; यह रूप आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός पदवी के रूप में प्रयुक्त है। ‘मसीह’ हिन्दी बाइबलीय परंपरा में प्रचलित है और ‘अभिषिक्त जन’ के पदवीगत भाव को बनाए रखता है।
- issue: καταστρηνιάσωσιν τοῦ Χριστοῦ का अर्थ
  choice: जब उनकी कामनाएँ उन्हें मसीह के विरुद्ध ले जाती हैं
  alternative: जब वे मसीह की उपेक्षा करके अपनी कामनाओं के वश में हो जाती हैं
  rationale: मुख्य पाठ यूनानी के ‘मसीह के विरुद्ध’ संबंध को सुरक्षित रखता है, जबकि पादटिप्पणी संभावित आशय स्पष्ट करती है। इससे यह निष्कर्ष नहीं थोपा जाता कि पुनर्विवाह अपने-आप में निंदित है; तनाव संभवतः पहले की मसीह-केंद्रित प्रतिबद्धता के साथ है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘सूची में लेने’ से प्रसंग स्पष्ट किया गया है, और कठिन यूनानी संबंध ‘मसीह के विरुद्ध’ को मुख्य पाठ तथा व्याख्यात्मक पादटिप्पणी के साथ सुरक्षित रखा गया है।
