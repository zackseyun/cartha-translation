  text: But refuse younger widows[a], for when they become sensual against the Messiah, they desire to marry[c][b],
translation:
  language: hi
  text: पर कम उम्र की विधवाओं को सूची में शामिल मत कर[a], क्योंकि जब वे मसीह के विरुद्ध अपनी कामनाओं के वश में हो जाती हैं[b], तो वे विवाह करना चाहती हैं[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उस विशेष सूची में, जिसका प्रसंग ऊपर आया है; इसका अर्थ यह नहीं कि उनकी सहायता ही न की जाए।
    reason: contextual_clarification
  - marker: b
    text: शाब्दिक रूप से, “मसीह के विरुद्ध।” भाव यह हो सकता है कि उनकी कामनाएँ मसीह के प्रति उनकी पहले की भक्ति या प्रतिबद्धता से टकराने लगती हैं।
