id: 1TI.5.8
reference: 1 Timothy 5:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δέ τις τῶν ἰδίων καὶ ⸀μάλιστα οἰκείων οὐ ⸀προνοεῖ, τὴν πίστιν ἤρνηται καὶ ἔστιν ἀπίστου χείρων.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/008.yaml
  text: But if anyone does not provide for his own[a], and especially for members of his household[b], he has denied the faith and is worse than an unbeliever.
translation:
  language: hi
  text: पर यदि कोई अपनों[a] के लिए, और विशेष रूप से अपने घर के लोगों के लिए, प्रबंध नहीं करता, तो उसने विश्वास को नकार दिया है[b] और वह एक अविश्वासी से बुरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने लोगों के लिए’। यह अभिव्यक्ति केवल एक ही छत के नीचे रहने वालों तक सीमित नहीं है; इसके बाद ‘अपने घर के लोगों’ का उल्लेख उस विशेष उपसमूह पर बल देता है जिसके लिए व्यक्ति का दायित्व विशेष है।
    reason: lexical_alternative
  - marker: b
    text: या ‘विश्वास से मुकर गया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τις
  choice: कोई
  rationale: अनिश्चित एकवचन का सामान्य, प्रतिनिधिक अर्थ है; ‘कोई’ आधुनिक हिन्दी में स्वाभाविक है और कथन को केवल पुरुषों तक सीमित नहीं करता।
- source_word: τῶν ἰδίων
  choice: अपनों की
  rationale: यह निकट संबंधियों या अपने उत्तरदायित्व में आने वाले लोगों का व्यापक संकेत है; ‘अपनों’ से यह व्यापकता बनी रहती है और अगला वाक्यांश उसके भीतर विशेष रूप से घर के लोगों को रेखांकित करता है।
- source_word: μάλιστα
  choice: विशेष रूप से
  rationale: यह व्यापक समूह के भीतर उस उपसमूह पर अधिक बल देता है जिसके प्रति दायित्व विशेष है।
- source_word: οἰκείων
  choice: अपने घर के लोगों की
  rationale: यह अपने घराने या गृहस्थी से जुड़े सदस्यों को बताता है; आधुनिक हिन्दी में यह ‘घराने वालों’ की अपेक्षा अधिक सहज और स्पष्ट है।
- source_word: προνοεῖ
  choice: देखभाल नहीं करता
  rationale: संदर्भ में इसका अर्थ पहले से ध्यान देकर व्यावहारिक और भौतिक आवश्यकताओं की पूर्ति करना है; ‘देखभाल’ इस उत्तरदायित्व को सहज हिन्दी में व्यक्त करती है।
- source_word: τὴν πίστιν
  choice: विश्वास
  rationale: यहाँ सप्रत्यय पद उस मसीही विश्वास की ओर संकेत करता है जिसे व्यक्ति मानने का दावा करता है; हिन्दी में ‘विश्वास’ संदर्भ के भीतर इस अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: ἤρνηται
  choice: नकार दिया है
  rationale: पूर्णकालिक रूप किसी किए हुए इनकार की वर्तमान परिणति दिखाता है; ‘नकार दिया है’ कथन की गंभीरता और वर्तमान स्थिति दोनों बनाए रखता है।
- source_word: ἀπίστου
  choice: एक अविश्वासी
  rationale: यहाँ तुलना ऐसे व्यक्ति से है जो विश्वास नहीं करता; ‘अविश्वासी’ इसका संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: χείρων
  choice: बुरा
  rationale: तुलनात्मक नैतिक मूल्यांकन को ‘से भी बुरा’ सरल और प्रभावशाली ढंग से व्यक्त करता है।
theological_decisions:
- issue: सामान्य अर्थ वाले व्याकरणिक पुल्लिंग का निरूपण
  choice: ‘कोई ... करता’ की हिन्दी प्रतिनिधिक पुल्लिंग रचना
  alternative: पूरी तरह लिंग-निरपेक्ष बहुवचन या केवल पुरुष-सूचक शब्दावली
  rationale: यूनानी एकवचन रचना का आशय सामान्य है। हिन्दी की स्वाभाविक प्रतिनिधिक एकवचन रचना स्रोत के रूप को बनाए रखते हुए कथन को केवल पुरुषों तक सीमित नहीं करती।
- issue: τὴν πίστιν का अर्थ
  choice: व्यक्ति द्वारा अंगीकार किया गया मसीही ‘विश्वास’
  alternative: व्यक्तिगत भरोसा अथवा सामान्य विश्वसनीयता
  rationale: चरवाही पत्रियों के प्रयोग और इस वाक्य के नैतिक तर्क में आशय उस घोषित विश्वास का है जिसे आचरण द्वारा नकारा जाता है; इसलिए केवल ‘भरोसा’ या ‘विश्वसनीयता’ अर्थ को संकरा या परिवर्तित कर देंगे।
- issue: ἤρνηται की नैतिक-धार्मिक तीव्रता
  choice: ‘नकार दिया है’
  alternative: ‘विश्वास से मुकर गया है’
  rationale: मुख्य पाठ स्रोत की सीधी ‘इनकार’ संबंधी शब्दावली को रखता है, जबकि वैकल्पिक मुहावरेदार अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपनों’ और ‘अपने घर के लोगों’ के बीच स्रोत में उपस्थित व्यापक समूह तथा विशेष उपसमूह का अंतर सुरक्षित है। ‘देखभाल’ में संदर्भानुसार व्यावहारिक तथा भौतिक सहायता शामिल है।
