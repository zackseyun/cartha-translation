lexical_decisions:
- source_word: Πρεσβυτέρῳ
  choice: किसी बूढ़े पुरुष को
  rationale: यहाँ यह विशेषण संज्ञा के रूप में प्रयुक्त हुआ है और इसी पद के νεωτέρους तथा अगले पद की आयु-और-लिंग आधारित श्रेणियों के साथ इसका विरोध आयु-संबंधी अर्थ का समर्थन करता है।
- source_word: μὴ ἐπιπλήξῃς
  choice: कठोरता से न डाँटो
  rationale: ἐπιπλήσσω में किसी को झिड़कने या कड़े शब्दों से फटकारने का भाव है। हिन्दी में ‘कठोरता से न डाँटो’ इसके तीखे मौखिक व्यवहार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀλλὰ παρακάλει
  choice: बल्कि ... समझाओ
  rationale: παρακαλέω का अर्थ आग्रह करना, समझाना या प्रोत्साहित करना हो सकता है। कठोर डाँट के विपरीत और पारिवारिक उपमाओं के संदर्भ में ‘समझाओ’ आदरपूर्ण तथा संबंधपरक आग्रह व्यक्त करता है।
- source_word: ὡς πατέρα
  choice: उसे पिता मानकर
  rationale: ὡς तुलना का संकेत देता है। ‘पिता मानकर’ हिन्दी में उस व्यक्ति के साथ पिता के समान आदरपूर्ण व्यवहार को सहज रूप से व्यक्त करता है।
- source_word: νεωτέρους
  choice: जवान पुरुषों को
  rationale: पुल्लिंग बहुवचन और अगले पद में स्त्रियों के अलग उल्लेख के कारण लिंग-विशिष्ट अर्थ बनाए रखा गया है। ‘जवान’ यहाँ ‘बूढ़े’ के साथ स्पष्ट आयु-विरोध प्रस्तुत करता है।
- source_word: ὡς ἀδελφούς
  choice: भाई मानकर
  rationale: तत्काल संदर्भ में पुरुषों और स्त्रियों को अलग-अलग संबोधित किया गया है, इसलिए पुल्लिंग ‘भाई’ उपयुक्त है; पाठ में निहित न होने के कारण ‘विश्वास में’ जैसे शब्द नहीं जोड़े गए।
theological_decisions:
- issue: Πρεσβυτέρῳ कलीसिया के पद ‘प्राचीन’ को दर्शाता है या आयु में बड़े पुरुष को
  choice: 'आयु-आधारित अर्थ: ‘बूढ़े पुरुष’'
  alternative: कलीसिया का प्राचीन
  rationale: इस पद और अगले पद में बूढ़े पुरुष/पिता, जवान पुरुष/भाई, बूढ़ी स्त्रियाँ/माताएँ और जवान स्त्रियाँ/बहनें की सममित श्रेणियाँ हैं। इसलिए यहाँ कलीसियाई पद के बजाय आयु का अर्थ अधिक संभावित है, यद्यपि यूनानी शब्द दोनों अर्थ रख सकता है।
- issue: ἀδελφούς को समावेशी रूप में प्रस्तुत किया जाए या नहीं
  choice: ‘भाई’
  alternative: ‘भाई-बहन’
  rationale: यहाँ पुल्लिंग बहुवचन सामान्य समावेशी प्रयोग नहीं, बल्कि आयु और लिंग के अनुसार अलग किए गए समूहों का हिस्सा है; इसलिए ‘भाई’ मूल पाठ की संरचना को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, आदरपूर्ण और निर्देशात्मक रूप अपनाया गया है। ‘बूढ़े पुरुष’ और ‘जवान पुरुषों’ से आयु तथा लिंग का स्पष्ट विरोध सुरक्षित है; ‘पिता मानकर’ और ‘भाई मानकर’ पारिवारिक तुलना को स्वाभाविक हिन्दी में व्यक्त करते हैं।
