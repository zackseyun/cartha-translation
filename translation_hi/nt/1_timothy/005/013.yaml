reference: 1 Timothy 5:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἅμα δὲ καὶ ἀργαὶ μανθάνουσιν, περιερχόμεναι τὰς οἰκίας, οὐ μόνον δὲ ἀργαὶ ἀλλὰ καὶ φλύαροι καὶ περίεργοι, λαλοῦσαι τὰ μὴ δέοντα.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/013.yaml
  text: At the same time[a], they also learn to be idle, going around from house to house; and not only idle, but also gossips and busybodies[b], saying what they ought not to say.
translation:
  language: hi
  text: साथ ही वे घर-घर घूमती हुई आलसी रहना भी सीखती हैं। वे केवल आलसी ही नहीं, बल्कि व्यर्थ बातें करनेवाली[a] और दूसरों के मामलों में दखल देनेवाली[b] भी हैं, और ऐसी बातें कहती हैं जो उन्हें नहीं कहनी चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गप्पें मारनेवाली’। यूनानी शब्द मूर्खतापूर्ण, खोखली, या निरर्थक बातचीत को अधिक व्यापक रूप से भी व्यक्त कर सकता है; इस संदर्भ में इसमें दूसरों के बारे में गप्पें मारना भी शामिल हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दूसरों के काम में टाँग अड़ानेवाली’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅμα δὲ καὶ
  choice: साथ ही ... भी
  rationale: यह समय की समानता और पिछली बात में एक और बात जोड़ने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀργαὶ
  choice: निकम्मी
  rationale: यह काम में न लगे रहने या निष्क्रिय होने का भाव देता है और यूनानी पाठ में इसकी पुनरावृत्ति को हिन्दी में भी बनाए रखता है।
- source_word: μανθάνουσιν
  choice: रहना ... सीखती हैं
  rationale: संदर्भ में क्रिया किसी औपचारिक शिक्षा के बजाय आदत पड़ने का संकेत देती है; हिन्दी में ‘निकम्मी रहना सीखती हैं’ इस अधूरे निहितार्थ को स्वाभाविक रूप से पूरा करता है।
- source_word: περιερχόμεναι τὰς οἰκίας
  choice: घर-घर घूमते हुए
  rationale: यह एक घर से दूसरे घर जाने के वितरणात्मक भाव को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: φλύαροι
  choice: गप्पें मारनेवाली
  rationale: यह व्यर्थ, मूर्खतापूर्ण या असावधान बातचीत का भाव देता है; संदर्भ में दूसरों के विषय में अनुचित बातचीत भी इसमें सम्मिलित हो सकती है।
- source_word: περίεργοι
  choice: दूसरों के मामलों में दखल देनेवाली
  rationale: यह उन बातों में अनुचित हस्तक्षेप का अर्थ स्पष्ट करता है जिनसे व्यक्ति का सरोकार नहीं है।
- source_word: λαλοῦσαι τὰ μὴ δέοντα
  choice: ऐसी बातें कहती हैं जो उन्हें नहीं कहनी चाहिए
  rationale: यह बोलने की क्रिया और जो उचित नहीं है, दोनों को स्पष्ट रखता है, बिना अनुचित बातों की प्रकृति को आवश्यकता से अधिक सीमित किए।
theological_decisions:
- issue: स्त्रीलिंग बहुवचन रूपों का संदर्भ
  choice: वे ... सीखती हैं ... मारनेवाली ... देनेवाली
  alternative: ये स्त्रियाँ
  rationale: यूनानी स्त्रीलिंग रूप निकटवर्ती संदर्भ की जवान विधवाओं की ओर संकेत करते हैं। हिन्दी के स्त्रीलिंग क्रियारूप और विशेषण इस संदर्भ को स्पष्ट रखते हैं, इसलिए संज्ञा को अनावश्यक रूप से दोहराया नहीं गया।
- issue: φλύαροι का आशय
  choice: गप्पें मारनेवाली
  alternative: व्यर्थ बातें करनेवाली
  rationale: संदर्भ सामाजिक रूप से अनुचित बातचीत का संकेत देता है, पर यूनानी शब्द केवल चुगली तक सीमित नहीं है; इसलिए मुख्य पाठ में सहज विकल्प और पादटिप्पणी में व्यापक अर्थ दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग रूप संदर्भ में जवान विधवाओं को स्पष्ट करते हैं। ‘निकम्मी’ की पुनरावृत्ति मूल यूनानी की अलंकारिक पुनरावृत्ति को सुरक्षित रखती है।
