translation:
  language: hi
  text: वे न्याय के अधीन होती हैं, क्योंकि उन्होंने अपने पूर्व विश्वास को ठुकरा दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी पहली प्रतिज्ञा’ अथवा ‘अपनी पूर्व प्रतिबद्धता।’ यूनानी शब्द का अर्थ ‘विश्वास’ हो सकता है, पर इस प्रसंग में कुछ लोग इसे पहले की गई प्रतिज्ञा समझते हैं, जो संभवतः विधवाओं की सूची में नाम लिखाए जाने से जुड़ी थी।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχουσαι
  choice: वे दोषी ठहरती हैं
  rationale: शाब्दिक अर्थ ‘रखते हुए’ है, पर κρίμα के साथ यह न्याय के अधीन होने या दोषी ठहरने का भाव देता है। हिंदी में यह प्रयोग स्वाभाविक है और कृदंत का आशय बनाए रखता है।
- source_word: κρίμα
  choice: दोषी
  rationale: κρίμα न्याय, न्यायिक निर्णय या दण्डादेश का अर्थ दे सकता है। ‘दोषी ठहरती हैं’ इसकी गंभीरता व्यक्त करता है, पर अनन्त दण्ड को स्पष्ट रूप से आरोपित नहीं करता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι उस न्याय का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में स्पष्ट और सीधा है।
- source_word: τὴν πρώτην πίστιν
  choice: अपने पहले विश्वास को
  rationale: πρώτην का कालगत अर्थ ‘पहले’ है और πίστιν का सामान्य अर्थ ‘विश्वास’ है। पदबंध का अर्थ पहली प्रतिज्ञा या पहले किए गए समर्पण से भी लिया जाता है; इस वास्तविक संदिग्धता को पाद-टिप्पणी में रखा गया है।
- source_word: ἠθέτησαν
  choice: ठुकरा दिया है
  rationale: ἀθετέω का अर्थ अस्वीकार करना, अलग कर देना या अमान्य करना हो सकता है। ‘ठुकरा दिया’ किसी पूर्व विश्वास या दायित्व को अस्वीकार करने का प्रबल किंतु सहज हिंदी भाव देता है।
theological_decisions:
- issue: τὴν πρώτην πίστιν का प्रसंगगत अर्थ
  choice: अपने पहले विश्वास को
  alternative: अपनी पहली प्रतिज्ञा को; अपनी पहली प्रतिबद्धता को
  rationale: πίστις का मूल और सामान्य अर्थ ‘विश्वास’ है, इसलिए मुख्य पाठ उसे बनाए रखता है। फिर भी इस प्रसंग में इसे विधवा-सूची में नाम लिखाते समय की किसी पूर्व प्रतिज्ञा या प्रतिबद्धता के अर्थ में समझना संभव है। किसी एक व्याख्या को निर्णायक बनाए बिना विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘दोषी ठहरती हैं’ न्यायिक गंभीरता को रखता है, जबकि ‘पहले विश्वास’ मूल की अर्थगत संदिग्धता को पाद-टिप्पणी सहित सुरक्षित रखता है।
