  yaml_path: translation/nt/1_timothy/005/009.yaml
  text: Let a widow be enrolled only if she is not less than sixty years old[a], having been the wife of one husband,
translation:
  language: hi
  text: किसी विधवा का नाम सूची में तभी लिखा जाए, जब उसकी आयु साठ वर्ष से कम न हो और वह एक पति की पत्नी रही हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक पुरुष की स्त्री।” यह पद वैवाहिक निष्ठा या अच्छी प्रतिष्ठा का संकेत दे सकता है; कुछ लोग इसे “केवल एक बार विवाहित रही हो” के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Χήρα
  choice: विधवा
  rationale: पति की मृत्यु के बाद जीवित स्त्री के लिए मानक और प्रसंगानुकूल हिन्दी शब्द।
- source_word: καταλεγέσθω
  choice: नाम सूची में लिखा जाए
  rationale: यह क्रिया किसी आधिकारिक सूची में दर्ज किए जाने का प्रशासनिक भाव रखती है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: μὴ ἔλαττον ἐτῶν ἑξήκοντα γεγονυῖα
  choice: उसकी आयु साठ वर्ष से कम न हो
  rationale: यूनानी पदबंध न्यूनतम आयु की शर्त बताता है। यह रूप उसके निषेधात्मक बल और प्राप्त आयु की अवस्था—दोनों को व्यक्त करता है।
- source_word: ἑνὸς ἀνδρὸς γυνή
  choice: एक पति की पत्नी रही हो
  rationale: यह अपेक्षाकृत औपचारिक रूप यूनानी मुहावरे और उसकी व्याख्यात्मक अस्पष्टता को बनाए रखता है; इसे मुख्य पाठ में केवल वैवाहिक निष्ठा या केवल एक बार विवाह करने के अर्थ में सीमित नहीं किया गया।
theological_decisions:
- issue: ἑνὸς ἀνδρὸς γυνή का अर्थ
  choice: मुख्य पाठ में ‘एक पति की पत्नी रही हो’ कहकर मुहावरे को बनाए रखना
  alternative: ‘अपने पति के प्रति निष्ठावान रही हो’ अथवा ‘केवल एक बार विवाहित रही हो’
  rationale: यह पद वैवाहिक निष्ठा और प्रतिष्ठा का संकेत दे सकता है, जबकि कुछ इसे केवल एक विवाह के इतिहास की शर्त मानते हैं। यूनानी पाठ इस प्रश्न को निर्णायक रूप से नहीं सुलझाता, इसलिए मुख्य पाठ में तनाव बनाए रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट भाषा। ‘नाम सूची में लिखा जाए’ आधिकारिक पंजीकरण का भाव देता है, जबकि विवादित वैवाहिक मुहावरे को मुख्य पाठ और पादटिप्पणी में बिना सांप्रदायिक निष्कर्ष के प्रस्तुत किया गया है।
