reference: 1 Timothy 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ δὲ ὄντως χήρα καὶ μεμονωμένη ἤλπικεν ἐπὶ ⸀θεὸν καὶ προσμένει ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς νυκτὸς καὶ ἡμέρας·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/005.yaml
  text: She who is truly a widow[a], and is left all alone[c][b], has set her hope on God and continues in petitions and prayers night and day.
translation:
  language: hi
  text: परन्तु जो सचमुच विधवा है और बिल्कुल अकेली रह गई है,[a] उसने परमेश्वर पर अपनी आशा रखी है[b] और रात-दिन विनतियों और प्रार्थनाओं में लगी रहती है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अकेली है” अथवा “अकेली छोड़ दी गई है”; यूनानी पद सहारा देनेवाले परिवार के बिना रह जाने की दशा पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने परमेश्वर में आशा रखी है।” यूनानी पूर्ण काल ऐसी स्थिर आशा का संकेत दे सकता है जिसका प्रभाव अब भी बना हुआ है।
    reason: lexical_alternative
  - marker: c
    text: “विनतियों” और “प्रार्थनाओं”—दोनों शब्द इसलिए रखे गए हैं कि विशेष याचनाओं और सामान्य प्रार्थना के लिए प्रयुक्त यूनानी पदों का भेद दिखाई दे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντως χήρα
  choice: सचमुच विधवा
  rationale: यह आसपास के प्रसंग में केवल सामाजिक पहचान नहीं, बल्कि वास्तव में सहायता-विहीन विधवा होने पर बल देता है।
- source_word: μεμονωμένη
  choice: बिल्कुल अकेली रह गई है
  rationale: यूनानी पूर्ण कृदन्त उस स्थायी दशा को व्यक्त करता है जिसमें वह पारिवारिक सहारे के बिना रह गई है।
- source_word: ἤλπικεν ἐπὶ θεόν
  choice: उसने परमेश्वर पर अपनी आशा रखी है
  rationale: पूर्ण काल अतीत में रखी गई और अब भी बनी हुई आशा की स्थिर दिशा को व्यक्त करता है।
- source_word: προσμένει
  choice: लगी रहती है
  rationale: यह वर्तमान में निरन्तर बने रहने और लगे रहने का स्वाभाविक हिन्दी रूप है।
- source_word: ταῖς δεήσεσιν καὶ ταῖς προσευχαῖς
  choice: विनतियों और प्रार्थनाओं
  rationale: 'दोनों यूनानी पदों को अलग रखा गया है: पहला विशेष आवश्यकताओं से जुड़ी याचना, दूसरा प्रार्थना का अधिक सामान्य पद है।'
- source_word: νυκτὸς καὶ ἡμέρας
  choice: रात-दिन
  rationale: यूनानी क्रम को रखते हुए निरन्तर अभ्यास का स्वाभाविक हिन्दी मुहावरा है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन से विरोध या भेद को चिह्नित करता है; हिन्दी में 'परन्तु' प्रसंगगत संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: ‘सचमुच विधवा’ का आशय
  choice: ऐसी विधवा जो वास्तव में सहारे से वंचित है और जिसकी पहचान परमेश्वर पर स्थिर आशा तथा निरन्तर प्रार्थना से होती है
  alternative: सामान्य रूप से प्रत्येक विधवा का केवल वर्णन
  rationale: ὄντως और निकटवर्ती प्रसंग एक विशिष्ट श्रेणी का संकेत देते हैं, पर अनुवाद किसी विशेष कलीसियाई व्यवस्था या साम्प्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सार्वजनिक पाठ के अनुकूल शैली। ‘बिल्कुल अकेली रह गई है’ सामाजिक असहायता को स्वाभाविक रूप से व्यक्त करता है; ‘लगी रहती है’ निरन्तरता को बिना अनावश्यक तीव्रता जोड़े दिखाता है।
