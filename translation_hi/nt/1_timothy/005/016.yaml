base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/016.yaml
  text: If any believing woman has widows[a], let her provide for them, and let the church not be burdened, so that it may provide for those who are truly widows.
translation:
  language: hi
  text: यदि किसी विश्वासी स्त्री के पास विधवाएँ हों[a], तो वह उनकी सहायता करे, और कलीसिया पर बोझ न पड़े, ताकि वह उन विधवाओं की सहायता कर सके जो वास्तव में विधवाएँ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “यदि किसी विश्वासी पुरुष या स्त्री के पास विधवाएँ हों,” अथवा “यदि किसी विश्वासी के पास विधवाएँ हों”; इस प्रकार निर्देश का कर्ता केवल स्त्री तक सीमित नहीं रहता।
    reason: textual_variant
lexical_decisions:
- source_word: τις πιστὴ
  choice: किसी विश्वासी स्त्री
  rationale: पाठ में πιστή स्त्रीलिंग एकवचन है; इसलिए यहाँ विषय को सामान्य ‘विश्वासी’ न बनाकर स्त्री के रूप में व्यक्त किया गया है।
- source_word: ἔχει χήρας
  choice: के परिवार में विधवाएँ हों
  rationale: शाब्दिक अर्थ ‘विधवाएँ रखती/हैं’ हिन्दी में अस्वाभाविक और अस्पष्ट होगा। प्रसंग पारिवारिक उत्तरदायित्व का है, इसलिए ‘के परिवार में’ संबंध को स्वाभाविक रूप से स्पष्ट करता है, बिना किसी खास रिश्ते को निर्धारित किए।
- source_word: ἐπαρκείτω αὐταῖς
  choice: वह उनकी आवश्यकताएँ पूरी करे
  rationale: ἐπαρκέω यहाँ पर्याप्त व्यावहारिक और भौतिक सहायता देने का भाव रखता है। यह हिन्दी अभिव्यक्ति केवल सामान्य सहायता नहीं, बल्कि जरूरत पूरी करने का अर्थ देती है।
- source_word: μὴ βαρείσθω ἡ ἐκκλησία
  choice: कलीसिया पर उनका भार न पड़े
  rationale: निष्क्रिय आज्ञार्थक रूप को स्वाभाविक हिन्दी में प्रस्तुत करते हुए आर्थिक और देखभाल-संबंधी दायित्व के भार का भाव सुरक्षित रखा गया है।
- source_word: ἡ ἐκκλησία
  choice: कलीसिया
  rationale: यहाँ शब्द स्थानीय मसीही समुदाय को दर्शाता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘कलीसिया’ इसका प्रतिष्ठित और स्पष्ट रूप है।
- source_word: ταῖς ὄντως χήραις
  choice: उन विधवाओं ... जो सचमुच विधवा हैं
  rationale: ὄντως का जोर बनाए रखा गया है। यह केवल वैवाहिक स्थिति नहीं, अध्याय के प्रसंग में वास्तविक रूप से अकेली और सहायता की पात्र विधवाओं की श्रेणी की ओर संकेत करता है; अनुवाद इस तनाव को पूरी तरह व्याख्यायित नहीं करता।
- source_word: ἐπαρκέσῃ
  choice: आवश्यकताएँ पूरी कर सके
  rationale: पहले आए ἐπαρκέω के समान अर्थ को दोहराकर शब्दगत संगति रखी गई है; ἵνα के बाद यह उद्देश्य बताता है।
theological_decisions:
- issue: आरंभिक उपवाक्य के कर्ता का लिंग
  choice: 'विशेष रूप से स्त्री: ‘किसी विश्वासी स्त्री’'
  alternative: अन्य पाठ-परंपराओं के अनुसार ‘किसी विश्वासी पुरुष या स्त्री’ अथवा सामान्य ‘किसी विश्वासी’
  rationale: दिए गए SBLGNT पाठ में τις πιστή व्याकरण की दृष्टि से स्त्रीलिंग एकवचन है। इसलिए मुख्य पाठ में लिंग को सामान्यीकृत नहीं किया गया; व्यापक वैकल्पिक पाठ को पादटिप्पणी में रखा गया है।
- issue: ‘सचमुच विधवा’ की श्रेणी
  choice: मूल अभिव्यक्ति का जोर बनाए रखते हुए ‘जो सचमुच विधवा हैं’
  alternative: व्याख्यात्मक रूप से ‘जो निराश्रित विधवाएँ हैं’
  rationale: अध्याय का संदर्भ वास्तविक सहायता की पात्र, अकेली विधवाओं की ओर संकेत करता है, पर इस पद में ‘निराश्रित’ शब्द सीधे नहीं है। इसलिए धार्मिक-सामुदायिक पात्रता को अनुवाद में अत्यधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘परिवार में’ संबंध को स्पष्ट करता है, पर माँ, बहन या अन्य रिश्ते जैसी अनकही विशिष्टता नहीं जोड़ता। ‘आवश्यकताएँ पूरी करे’ दोनों बार ἐπαρκέω की व्यावहारिक सहायता का अर्थ और शब्दगत पुनरावृत्ति बनाए रखता है।
