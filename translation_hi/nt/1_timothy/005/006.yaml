  yaml_path: translation/nt/1_timothy/005/006.yaml
  text: But she who lives for pleasure is dead even while she lives[a].
translation:
  language: hi
  text: परन्तु जो स्त्री भोग-विलास में जीती है, वह जीवित रहते हुए भी मर चुकी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαταλῶσα
  choice: भोग-विलास में जीती है
  rationale: यह वर्तमान कृदन्त निरन्तर आत्म-लिप्त और सुख-प्रधान जीवन-शैली को व्यक्त करता है। ‘भोग-विलास में जीती है’ सामान्य आनन्द नहीं, बल्कि असंयमी सुखोपभोग का भाव देता है।
- source_word: ζῶσα
  choice: जीवित रहते हुए भी
  rationale: यहाँ कृदन्त मुख्य क्रिया के साथ विरोधात्मक रियायत का भाव रखता है। ‘जीवित रहते हुए भी’ मूल के जानबूझकर रखे गए विरोधाभास को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τέθνηκεν
  choice: मर चुकी है
  rationale: पूर्णकाल ऐसी मृत्यु को बताता है जिसका परिणाम वर्तमान में बना हुआ है। ‘मर चुकी है’ उस परिणामी अवस्था को रखते हुए ‘जीवित’ के साथ मूल का तीखा विरोध भी बनाए रखता है।
- source_word: ἡ ... σπαταλῶσα
  choice: जो स्त्री भोग-विलास में जीती है
  rationale: स्त्रीलिंग एकवचन लेख और कृदन्त संज्ञा की तरह प्रयुक्त हैं। ‘जो स्त्री...’ व्याकरणिक लिंग और प्रसंगगत संकेत को बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद में वर्णित परमेश्वर पर आशा रखने वाली विधवा से स्पष्ट विरोध दर्शाता है।
theological_decisions:
- issue: जीवित होते हुए ‘मर चुकी’ होने का स्वरूप
  choice: मूल रूपक को बिना व्याख्यात्मक विशेषण जोड़े यथावत रखना
  alternative: ‘आत्मिक रूप से मर चुकी है’ या ‘नैतिक रूप से मृत है’
  rationale: शारीरिक जीवन और मृत्यु की अवस्था का विरोध गैर-शारीरिक मृत्यु की ओर संकेत करता है, पर पाठ स्वयं उसे ‘आत्मिक’ या ‘नैतिक’ कहकर सीमित नहीं करता। इसलिए अनुवाद धार्मिक तनाव और अर्थ-व्याप्ति को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और स्पष्ट वाक्य। ‘भोग-विलास’ σπαταλάω के आत्म-लिप्त, सुखोपभोगी जीवन का भाव व्यक्त करता है; अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
