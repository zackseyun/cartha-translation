  yaml_path: translation/nt/1_timothy/005/023.yaml
  text: No longer drink only water[a], but use a little wine because of your stomach and your frequent illnesses.
translation:
  language: hi
  text: अब केवल पानी ही पीते न रहो,[a] बल्कि अपने पेट और बार-बार होनेवाली बीमारियों के कारण थोड़ा-सा दाखमधु लिया करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “अब पानी पीनेवाले न बने रहो।” भाव यह है कि तीमुथियुस केवल पानी ही पीते न रहें।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηκέτι
  choice: अब से ... न ... रहो
  rationale: यह पहले से चली आ रही आदत को छोड़ने की आज्ञा देता है; आधुनिक हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: ὑδροπότει
  choice: केवल पानी ही न पीते रहो
  rationale: क्रिया का शाब्दिक अर्थ पानी पीना है, पर ἀλλά के बाद दाखमधु लेने के निर्देश से आशय केवल पानी पीते रहने की आदत छोड़ना है, पानी को सर्वथा त्यागना नहीं।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पहले निषेध के विपरीत सकारात्मक निर्देश प्रस्तुत करता है।
- source_word: οἴνῳ ὀλίγῳ
  choice: थोड़ा-सा दाखमधु
  rationale: ὀλίγῳ मात्रा की अल्पता को स्पष्ट रखता है; οἶνος का सामान्य और स्पष्ट हिन्दी रूप दाखमधु है।
- source_word: χρῶ
  choice: लिया करो
  rationale: χράομαι का मूल अर्थ उपयोग करना है; पेय और स्वास्थ्य के इस संदर्भ में 'लिया करो' स्वाभाविक हिन्दी है और नियमित किंतु सीमित सेवन का भाव देता है।
- source_word: διὰ
  choice: के कारण
  rationale: कर्मकारक के साथ διά यहाँ कारण या आधार व्यक्त करता है।
- source_word: στόμαχον
  choice: पेट
  rationale: सामान्य शारीरिक अर्थ को साधारण आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: πυκνάς
  choice: बार-बार होनेवाली
  rationale: यह रोगों की आवृत्ति व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: ἀσθενείας
  choice: बीमारियों
  rationale: पेट और उपचार-संबंधी संदर्भ में यह शब्द शारीरिक रोगों या अस्वस्थताओं को सूचित करता है; 'बीमारियों' सबसे सहज अर्थ है।
theological_decisions:
- issue: क्या तीमुथियुस की पिछली आदत को केवल पानी पीने के रूप में स्पष्ट किया जाए
  choice: केवल पानी ही न पीते रहो
  alternative: पानी न पीते रहो
  rationale: दाखमधु लेने के विपरीत निर्देश से स्पष्ट है कि पानी पूर्णतः छोड़ना आशय नहीं है। 'केवल' निहित विरोध को स्पष्ट करता है और गलत अर्थ से बचाता है।
- issue: οἶνος को ज्यों का त्यों दाखमधु कहना या उसे औषधीय पेय के रूप में सामान्यीकृत करना
  choice: दाखमधु
  alternative: औषधीय पेय
  rationale: यूनानी पाठ स्पष्टतः οἶνος कहता है। सांस्कृतिक या सिद्धान्तगत कारणों से इसे नरम या विस्तृत नहीं किया गया; 'थोड़ा-सा' पाठ में उपस्थित संयम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'दाखमधु' बाइबलीय हिन्दी में परिचित तथा 'मदिरा' की अपेक्षा अधिक विशिष्ट है। 'लिया करो' औषधीय संदर्भ में स्वाभाविक है, पर पाठ से अधिक चिकित्सकीय विवरण नहीं जोड़ता।
