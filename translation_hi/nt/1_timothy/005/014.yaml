  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βούλομαι οὖν νεωτέρας γαμεῖν, τεκνογονεῖν, οἰκοδεσποτεῖν, μηδεμίαν ἀφορμὴν διδόναι τῷ ἀντικειμένῳ λοιδορίας χάριν·
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/005/014.yaml
  text: Therefore I want younger widows to marry[a], to bear children, to manage their households[b], and to give the opponent no opportunity for slander.
translation:
  language: hi
  text: इसलिए मैं चाहता हूँ कि कम उम्र की विधवाएँ विवाह करें[a], बच्चे जनें, अपने घर का प्रबंध करें, और विरोधी को निंदा करने का कोई अवसर न दें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल ‘विवाह करें’ है; विधवाओं के प्रसंग में पुनर्विवाह का अर्थ निहित है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शत्रु’; संभव है कि यहाँ शैतान की ओर संकेत हो।
    reason: alternative_reading
lexical_decisions:
- source_word: βούλομαι
  choice: मैं चाहता हूँ
  rationale: यह पौलुस की इच्छा या निश्चय को व्यक्तिगत रूप में व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विचार से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: νεωτέρας
  choice: कम उम्र की विधवाएँ
  rationale: शब्द का शाब्दिक अर्थ ‘कम उम्र की [स्त्रियाँ]’ है, पर निकटवर्ती प्रसंग विधवाओं का है; इसलिए निहित संज्ञा स्पष्ट की गई है।
- source_word: γαμεῖν
  choice: विवाह करें
  rationale: यूनानी क्रिया केवल ‘विवाह करना’ कहती है। विधवाओं के प्रसंग में पुनर्विवाह निहित है, पर मूल क्रिया उसे स्पष्ट रूप से नहीं कहती।
- source_word: τεκνογονεῖν
  choice: बच्चे जनें
  rationale: यह संतान उत्पन्न करने या जन्म देने का विशिष्ट अर्थ बनाए रखता है।
- source_word: οἰκοδεσποτεῖν
  choice: अपने घर का प्रबंध करें
  rationale: यह घर-परिवार की सक्रिय देखरेख और व्यवस्था का भाव देता है, बिना अनावश्यक रूप से कठोर प्रभुत्व का अर्थ जोड़े।
- source_word: μηδεμίαν ἀφορμὴν διδόναι
  choice: कोई अवसर न दें
  rationale: यह किसी विरोधी को आक्षेप या निंदा का मौका न देने का स्वाभाविक हिन्दी रूप है।
- source_word: τῷ ἀντικειμένῳ
  choice: विरोधी
  rationale: यह एकवचन ‘विरोध करनेवाले’ को व्यक्त करता है और उसे समय से पहले शैतान के रूप में निश्चित नहीं करता।
- source_word: λοιδορίας χάριν
  choice: निंदा करने का
  rationale: यह अपमानजनक या बदनाम करनेवाली वाणी के उद्देश्य अथवा अवसर को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τῷ ἀντικειμένῳ का संदर्भ
  choice: ‘विरोधी’—किसी विरोध करनेवाले व्यक्ति या पक्ष के लिए खुला संदर्भ
  alternative: ‘शत्रु’ अथवा विशेष रूप से शैतान
  rationale: यूनानी कृदंत स्वयं विरोधी की पहचान शैतान के रूप में नहीं करता। सार्वजनिक निंदा की तात्कालिक चिंता किसी मानवीय आलोचक की ओर संकेत कर सकती है, जबकि शैतान की संभावना भी पूरी तरह बाहर नहीं होती; इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। समांतर क्रियाओं को आज्ञार्थक-सदृश संभावनार्थक ‘करें’ रूप में रखा गया है, क्योंकि वे ‘मैं चाहता हूँ कि’ पर निर्भर हैं।
