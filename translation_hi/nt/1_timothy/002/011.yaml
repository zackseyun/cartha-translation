translation:
  language: hi
  text: स्त्री[a] शान्त भाव से[b], पूर्ण अधीनता के साथ सीखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्नी’; यूनानी शब्द का अर्थ प्रसंग के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है।
