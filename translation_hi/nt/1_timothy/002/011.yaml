lexical_decisions:
- source_word: γυνὴ
  choice: स्त्री
  rationale: γυνή का अर्थ प्रसंग के अनुसार ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ वैवाहिक स्थिति स्पष्ट नहीं है, इसलिए सामान्य अर्थ ‘स्त्री’ रखा गया है; दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν ἡσυχίᾳ
  choice: शान्त भाव से
  rationale: ἡσυχία शान्ति, स्थिरता या बिना उपद्रव के व्यवहार का बोध करा सकता है; यह आवश्यक रूप से पूर्ण मौन नहीं बताता। ‘शान्त भाव से’ आधुनिक हिन्दी में इस अर्थ-परास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μανθανέτω
  choice: सीखे
  rationale: यह वर्तमानकालीन कर्तृवाच्य आज्ञार्थक रूप है। हिन्दी का ‘सीखे’ निर्देशात्मक बल को बनाए रखता है और इस सकारात्मक आज्ञा को स्पष्ट करता है कि स्त्री शिक्षा ग्रहण करे।
- source_word: ἐν πάσῃ ὑποταγῇ
  choice: पूरी अधीनता के साथ
  rationale: ὑποταγή अधीनता या समर्पित रहने को दर्शाता है और πάσῃ उसकी पूर्णता पर बल देता है। यूनानी पाठ अधीनता का लक्ष्य स्पष्ट नहीं करता, इसलिए अनुवाद में भी कोई लक्ष्य नहीं जोड़ा गया।
theological_decisions:
- issue: क्या ἡσυχία का अर्थ पूर्ण मौन है या शान्त आचरण
  choice: शान्त भाव से
  alternative: मौन रहकर
  rationale: शब्द पूर्ण चुप्पी का अर्थ ले सकता है, पर उसका अर्थ शान्त और व्यवस्थित व्यवहार भी है। मुख्य पाठ में अधिक व्यापक अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- issue: क्या γυνή का अनुवाद ‘स्त्री’ हो या ‘पत्नी’
  choice: स्त्री
  alternative: पत्नी
  rationale: तात्कालिक वाक्य वैवाहिक प्रसंग को स्पष्ट रूप से चिह्नित नहीं करता। ‘स्त्री’ मूल की अस्पष्टता को कम नहीं करता, जबकि ‘पत्नी’ को वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- issue: अधीनता किसके प्रति है
  choice: लक्ष्य को अनिर्दिष्ट रखना
  alternative: किसी शिक्षक, पुरुष या पति के प्रति अधीनता को स्पष्ट करना
  rationale: मूल वाक्य ὑποταγή का कोई स्पष्ट लक्ष्य नहीं देता। किसी लक्ष्य को जोड़ना व्याख्यात्मक और सम्भवतः सम्प्रदायगत निर्णय होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शान्त भाव से’ शाब्दिक ‘शान्ति में’ की अपेक्षा अधिक स्वाभाविक हिन्दी है। ‘पूरी अधीनता’ मूल के बल को बनाए रखती है, पर अधीनता का कोई ऐसा लक्ष्य नहीं जोड़ती जिसे यूनानी पाठ स्वयं नहीं बताता।
