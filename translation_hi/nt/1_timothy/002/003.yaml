  text: This is good and acceptable before God our Savior,
translation:
  language: hi
  text: यह अच्छा और हमारे उद्धारकर्ता परमेश्वर की दृष्टि में ग्रहणयोग्य है,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο
  choice: यह
  rationale: नपुंसकलिंग एकवचन संकेतवाचक सर्वनाम पिछले पदों में प्रार्थना संबंधी निर्देश की ओर संकेत करता है। ‘यह’ उस संबंध को स्वाभाविक ढंग से बनाए रखता है, बिना आशय को आवश्यकता से अधिक स्पष्ट किए।
- source_word: καλὸν
  choice: अच्छा
  rationale: इस नैतिक संदर्भ में शब्द सुंदरता नहीं, बल्कि नैतिक अच्छाई और उचित होने का भाव व्यक्त करता है।
- source_word: ἀπόδεκτον
  choice: ग्रहणयोग्य
  rationale: यह शब्द किसी बात के अनुकूल रूप से स्वीकार किए जाने का भाव देता है। ‘ग्रहणयोग्य’ इस मूल्यांकन को बनाए रखता है और ‘दृष्टि में’ के साथ स्वाभाविक है।
- source_word: ἐνώπιον
  choice: की दृष्टि में
  rationale: यहाँ परमेश्वर के मूल्यांकन या अनुमोदन की दृष्टि अभिप्रेत है। ‘की दृष्टि में’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: σωτῆρος
  choice: उद्धारकर्ता
  rationale: यह पास्तरी पत्रियों में प्रयुक्त महत्वपूर्ण उपाधि है। ‘उद्धारकर्ता’ दैवी उद्धारकारी भूमिका को स्पष्ट रूप से व्यक्त करता है और हिन्दी बाइबलीय प्रयोग में स्थापित है।
- source_word: ἡμῶν
  choice: हमारे
  rationale: सम्बन्धकारक सर्वनाम को सीधे बनाए रखा गया है; यह ‘उद्धारकर्ता परमेश्वर’ को विशेषित करता है।
- source_word: θεοῦ
  choice: परमेश्वर
  rationale: यह ‘उद्धारकर्ता’ के साथ समानाधिकरण में है और उसी को परमेश्वर के रूप में पहचानता है। हिन्दी में ‘हमारे उद्धारकर्ता परमेश्वर’ स्वाभाविक क्रम है।
theological_decisions:
- issue: τοῦ σωτῆρος ἡμῶν θεοῦ में समानाधिकरण संबंध
  choice: ‘हमारे उद्धारकर्ता परमेश्वर’
  alternative: ‘हमारे उद्धार करनेवाले परमेश्वर’
  rationale: यूनानी पदबंध स्वाभाविक रूप से परमेश्वर की पहचान ‘हमारे उद्धारकर्ता’ के रूप में करता है। चुना हुआ रूप उपाधि को सुरक्षित रखता है और पाठ से परे कोई अतिरिक्त सैद्धान्तिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य पिछले संदर्भ से जुड़ा है, इसलिए आरंभ में सरल ‘यह’ रखा गया है। ‘ग्रहणयोग्य’ औपचारिक किंतु सुबोध शब्द है और मूल के अनुमोदन-संबंधी भाव को ‘प्रसन्न करनेवाला’ की अपेक्षा कम व्याख्यात्मक ढंग से व्यक्त करता है।
