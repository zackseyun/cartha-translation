id: 1TI.2.1
reference: 1 Timothy 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν πρῶτον πάντων ποιεῖσθαι δεήσεις, προσευχάς, ἐντεύξεις, εὐχαριστίας, ὑπὲρ πάντων ἀνθρώπων,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/001.yaml
  text: Therefore[a], first of all, I urge that petitions, prayers, intercessions, and thanksgivings be made for all people[c][b],
translation:
  language: hi
  text: इसलिए सबसे पहले मैं आग्रह करता हूँ कि सब लोगों के लिए[a] विनतियाँ, प्रार्थनाएँ, मध्यस्थ प्रार्थनाएँ और धन्यवाद किए जाएँ[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब लोगों की ओर से।”
    reason: lexical_alternative
  - marker: b
    text: “सब लोग” उस सामान्य यूनानी अभिव्यक्ति का अनुवाद है जिसका अर्थ सभी मनुष्य हैं, केवल पुरुष नहीं।
    reason: lexical_alternative
  - marker: c
    text: कुछ लोग यहाँ “सब लोग” का अर्थ “हर प्रकार के लोग” समझते हैं; यूनानी पाठ स्वयं केवल “सब लोग” कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं आग्रह करता हूँ
  rationale: यह पद प्रेरित की गंभीर और अधिकारपूर्ण अपील व्यक्त करता है। ‘आग्रह करता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और केवल साधारण अनुरोध से अधिक बल रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह शब्द पिछले विचार से निष्कर्षात्मक संबंध दिखाता है; ‘इसलिए’ उस तार्किक जोड़ को स्पष्ट रखता है।
- source_word: πρῶτον πάντων
  choice: सबसे पहले
  rationale: यह अभिव्यक्ति क्रम से अधिक प्राथमिकता पर बल देती है; ‘सबसे पहले’ हिन्दी में स्वाभाविक रूप से वही अर्थ देती है।
- source_word: ποιεῖσθαι
  choice: किए जाएँ
  rationale: यूनानी क्रिया चारों प्रार्थना-संबंधी संज्ञाओं पर लागू होती है। ‘किए जाएँ’ व्यापक है और अनावश्यक रूप से किसी विशेष उपासना-विधि का संकेत नहीं देती।
- source_word: δεήσεις
  choice: विनतियाँ
  rationale: यह आवश्यकता से उत्पन्न गंभीर निवेदनों को दर्शाता है। ‘विनतियाँ’ अर्थभेद बनाए रखते हुए dignified और समझने योग्य हिन्दी है।
- source_word: προσευχάς
  choice: प्रार्थनाएँ
  rationale: यह प्रार्थना के लिए सामान्य शब्द है; ‘प्रार्थनाएँ’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐντεύξεις
  choice: मध्यस्थ प्रार्थनाएँ
  rationale: इस संदर्भ में यह दूसरों की ओर से की जाने वाली प्रार्थनाओं को व्यक्त करता है। केवल ‘मध्यस्थताएँ’ की अपेक्षा यह रूप सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: εὐχαριστίας
  choice: धन्यवाद
  rationale: यह परमेश्वर के प्रति कृतज्ञता की अभिव्यक्तियों को दर्शाता है। हिन्दी में ‘धन्यवाद किए जाएँ’ स्वाभाविक है; कृत्रिम बहुवचन से बचा गया है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: सम्बन्धकारक के साथ यह किसी के हित में या उसकी ओर से किए जाने का अर्थ दे सकता है। मुख्य पाठ में ‘के लिए’ सहज है और वैकल्पिक सूक्ष्मता पादटिप्पणी में दी गई है।
- source_word: πάντων ἀνθρώπων
  choice: सब लोगों
  rationale: ἄνθρωπος यहाँ सामान्य रूप से मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं। ‘सब लोगों’ आधुनिक हिन्दी में स्वाभाविक और लिंग-समावेशी है।
theological_decisions:
- issue: πάντων ἀνθρώπων का दायरा
  choice: सब लोग
  alternative: हर प्रकार के लोग
  rationale: यूनानी वाक्यांश सीधे तौर पर ‘सब लोग’ कहता है। यह कि आशय प्रत्येक व्यक्ति है या हर वर्ग के लोग, इससे जुड़ी व्यापक धर्मवैज्ञानिक बहस को मुख्य पाठ में संकीर्ण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। प्रार्थना के चार रूपों का भेद यथासंभव सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
