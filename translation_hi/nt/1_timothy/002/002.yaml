  text: ὑπὲρ βασιλέων καὶ πάντων τῶν ἐν ὑπεροχῇ ὄντων, ἵνα ἤρεμον καὶ ἡσύχιον βίον διάγωμεν ἐν πάσῃ εὐσεβείᾳ καὶ σεμνότητι.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/002.yaml
  text: for kings and all who are in high positions[a], so that we may lead a tranquil and quiet life in all godliness and dignity.
translation:
  language: hi
  text: राजाओं और उन सभी के लिए जो उच्च पदों पर हैं[a], ताकि हम पूरी भक्ति और गरिमा के साथ निर्विघ्न और शांत जीवन बिताएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन सभी के लिए जो अधिकार के पदों पर हैं।” यूनानी वाक्यांश का शाब्दिक अर्थ है, “वे सभी जो उच्च अथवा प्रमुख स्थिति में हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: के लिए
  rationale: पिछले पद में प्रार्थनाओं और विनतियों के संदर्भ में यह उन व्यक्तियों के हित में की जाने वाली प्रार्थना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: βασιλέων
  choice: राजाओं
  rationale: यह संज्ञा विशेष रूप से राजाओं अथवा संप्रभु शासकों को सूचित करती है; सामान्यीकृत ‘शासकों’ के बजाय मूल शब्द की विशिष्टता रखी गई है।
- source_word: πάντων τῶν ἐν ὑπεροχῇ ὄντων
  choice: उन सभी के लिए जो ऊँचे पदों पर हैं
  rationale: यह वाक्यांश केवल विधिवत अधिकार रखने वालों तक सीमित नहीं, बल्कि प्रमुख या उच्च स्थिति में होने वालों को व्यापक रूप से दर्शाता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रार्थना के उद्देश्य अथवा अपेक्षित परिणाम को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἤρεμον
  choice: शांत
  rationale: यह अशांति और बाधा से मुक्त स्थिति का भाव देता है।
- source_word: ἡσύχιον
  choice: निश्चिंत
  rationale: यह स्थिर, निर्विघ्न और बिना हलचल के जीवन का भाव प्रकट करता है तथा ἤρεμον के साथ पूर्ण पुनरुक्ति से बचाता है।
- source_word: βίον διάγωμεν
  choice: जीवन बिताएँ
  rationale: यह हिन्दी का स्वाभाविक मुहावरा है और अपने सांसारिक जीवन को एक प्रकार से चलाने या व्यतीत करने का अर्थ देता है।
- source_word: ἐν πάσῃ εὐσεβείᾳ
  choice: पूरी भक्ति के साथ
  rationale: εὐσέβεια परमेश्वर के प्रति श्रद्धापूर्ण निष्ठा और उसके अनुरूप आचरण को व्यक्त करता है; ‘भक्ति’ सामान्य आधुनिक हिन्दी में स्पष्ट है और πάσῃ को ‘पूरी’ से दर्शाया गया है।
- source_word: σεμνότητι
  choice: गरिमा
  rationale: यह आदरणीय गंभीरता और मर्यादापूर्ण आचरण का भाव रखता है; ‘गरिमा’ आधुनिक और प्रतिष्ठित हिन्दी है।
theological_decisions:
- issue: नागरिक शासकों के लिए प्रार्थना का दायरा और उद्देश्य
  choice: पद शासकों और ऊँचे पदों पर स्थित सभी लोगों के लिए प्रार्थना करने को कहता है, जिसका उद्देश्य विश्वासियों के लिए शांत, भक्तिपूर्ण और गरिमामय जीवन की सामाजिक परिस्थितियाँ हैं।
  alternative: इसे शासन के प्रति निरपेक्ष समर्थन या केवल विधिवत अधिकार रखने वाले अधिकारियों तक सीमित कथन के रूप में पढ़ना।
  rationale: यूनानी पाठ प्रार्थना के पात्र और उसका व्यावहारिक उद्देश्य बताता है, पर हर शासक की वैधता या उसके प्रति निरपेक्ष समर्थन का व्यापक राजनीतिक सिद्धांत स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘ऊँचे पदों पर’ मूल वाक्यांश की व्यापकता बचाता है; ‘शांत और निश्चिंत’ दोनों यूनानी विशेषणों के निकटस्थ पर अलग-अलग भाव व्यक्त करता है।
