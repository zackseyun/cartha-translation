id: 1TI.2.8
reference: 1 Timothy 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Βούλομαι οὖν προσεύχεσθαι τοὺς ἄνδρας ἐν παντὶ τόπῳ, ἐπαίροντας ὁσίους χεῖρας χωρὶς ὀργῆς καὶ ⸀διαλογισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/008.yaml
  text: Therefore I want the men in every place to pray[a], lifting up holy hands without anger or quarreling.
translation:
  language: hi
  text: इसलिए मैं चाहता हूँ कि हर स्थान पर पुरुष प्रार्थना करें—पवित्र हाथ उठाकर, बिना क्रोध और विवाद[a] के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिना क्रोध या संदेह के।’ यूनानी शब्द मन के भीतर के तर्क-विचार या संदेह को भी सूचित कर सकता है, पर यहाँ संभवतः सभा में होने वाले झगड़ालू विवाद की ओर संकेत है।
    reason: शब्दार्थ का संभव वैकल्पिक अर्थ
lexical_decisions:
- source_word: Βούλομαι
  choice: मैं चाहता हूँ
  rationale: यह क्रिया इच्छा अथवा संकल्प व्यक्त करती है; यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए पौलुस के निर्देश का बल बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या विचार की अगली कड़ी दिखाता है; ‘इसलिए’ इस संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσεύχεσθαι
  choice: प्रार्थना करें
  rationale: यह προσεύχομαι का मानक और स्वाभाविक हिन्दी रूप है; हिन्दी वाक्य-संरचना के अनुसार इसे आश्रित उपवाक्य में रखा गया है।
- source_word: τοὺς ἄνδρας
  choice: पुरुष
  rationale: ἀνήρ यहाँ सामान्यतः ‘लोग’ नहीं, बल्कि पुरुषों को सूचित करता है; निकटवर्ती संदर्भ में पुरुषों और स्त्रियों के लिए अलग निर्देश भी इसी विशिष्टता का समर्थन करते हैं।
- source_word: ἐν παντὶ τόπῳ
  choice: हर स्थान पर
  rationale: यह मूल वाक्यांश के वितरणात्मक अर्थ को बनाए रखता है और हिन्दी में ‘हर स्थान में’ से अधिक स्वाभाविक है।
- source_word: ἐπαίροντας
  choice: उठाकर
  rationale: कृदंत प्रार्थना के साथ होने वाली शारीरिक मुद्रा बताता है; ‘हाथ उठाकर’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὁσίους χεῖρας
  choice: पवित्र हाथ
  rationale: ὅσιος परमेश्वर को स्वीकार्य पवित्र या भक्तिपूर्ण आचरण का भाव रखता है; ‘पवित्र हाथ’ मूल रूपक को सीधे सुरक्षित रखता है।
- source_word: χωρὶς
  choice: बिना
  rationale: यह किसी बात की अनुपस्थिति व्यक्त करने वाला सीधा और स्वाभाविक हिन्दी विकल्प है।
- source_word: ὀργῆς
  choice: क्रोध
  rationale: ‘क्रोध’ आधुनिक मानक हिन्दी में स्पष्ट है और यहाँ पारस्परिक संबंधों के संदर्भ के अनुकूल है।
- source_word: διαλογισμοῦ
  choice: विवाद
  rationale: διαλογισμός विचार-विमर्श, संदेह या विवाद का बोध करा सकता है। क्रोध के साथ इसके युग्म और सामूहिक प्रार्थना के संदर्भ में ‘विवाद’ संभवतः आशय को सबसे अच्छी तरह व्यक्त करता है; ‘संदेह’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: τοὺς ἄνδρας का लिंग-विशिष्ट संदर्भ
  choice: पुरुष
  alternative: लोग; सब लोग; पति
  rationale: पुल्लिंग-सूचक संज्ञा यहाँ पुरुषों के लिए विशिष्ट है, और तत्काल संदर्भ पुरुषों तथा स्त्रियों को अलग-अलग संबोधित करता है। सामान्य ‘लोग’ कहना स्रोत की विशिष्टता को मिटा देता, जबकि ‘पति’ के लिए पर्याप्त वैवाहिक संकेत नहीं है।
- issue: प्रार्थना के संदर्भ में διαλογισμοῦ का अर्थ
  choice: विवाद
  alternative: बहस; संदेह
  rationale: क्रोध के साथ युग्मित होने के कारण यहाँ झगड़ालू या विरोधपूर्ण विवाद का सामुदायिक अर्थ अधिक संभावित है। फिर भी भीतर के संदेह का अर्थ शब्दार्थ की दृष्टि से संभव है, इसलिए उसे पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। निर्देश का बल ‘मैं चाहता हूँ कि… करें’ से व्यक्त हुआ है। डैश प्रार्थना की रीति बताने वाले कृदंत वाक्यांश को स्पष्ट करता है, और मूल के ‘पवित्र हाथ’ रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
