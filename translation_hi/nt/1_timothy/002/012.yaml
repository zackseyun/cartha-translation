id: 1TI.2.12
reference: 1 Timothy 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂διδάσκειν δὲ γυναικὶ⸃ οὐκ ἐπιτρέπω, οὐδὲ αὐθεντεῖν ἀνδρός, ἀλλ’ εἶναι ἐν ἡσυχίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/012.yaml
  text: But I do not permit a woman to teach or to exercise authority over a man[a]; instead[c][b], she is to be in quietness.
translation:
  language: hi
  text: परन्तु मैं किसी स्त्री को शिक्षा देने या किसी पुरुष[a] पर अधिकार का प्रयोग करने[b] की अनुमति नहीं देता; इसके बजाय वह शान्त भाव से रहे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी पत्नी को ... अपने पति पर।” यूनानी शब्दों का अर्थ सामान्य रूप से “स्त्री/पुरुष” अथवा वैवाहिक रूप से “पत्नी/पति”—दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “अधिकार रखने”; सम्भवतः “प्रभुत्व जमाने।” यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ है और उसके सटीक भाव पर मतभेद है।
    reason: lexical_alternative
  - marker: c
    text: या “मौन रहे।” यूनानी शब्द प्रसंग के अनुसार शान्तता, स्थिरता या मौन का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διδάσκειν
  choice: शिक्षा देने
  rationale: यह ἐπιτρέπω के साथ जुड़ा सामान्य क्रियार्थक पूरक है। ‘शिक्षा देने’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी क्रिया का सीधा अर्थ बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ पिछली बात से हल्का विरोध या विचार में मोड़ दिखाता है; ‘परन्तु’ इस संबंध को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: γυναικί
  choice: किसी स्त्री को
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ दोनों हो सकता है। 2:9–15 के व्यापक प्रसंग के कारण मुख्य पाठ में सामान्य अर्थ चुना गया है; वैवाहिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: οὐκ ἐπιτρέπω
  choice: मैं ... अनुमति नहीं देता
  rationale: वर्तमानकालीन यूनानी रूप को हिन्दी में सामान्य कथन के रूप में प्रस्तुत किया गया है। ‘अनुमति नहीं देता’ मूल की औपचारिकता और स्पष्टता बनाए रखता है।
- source_word: οὐδὲ
  choice: या
  rationale: यह पहले निषेध के साथ दूसरे क्रियार्थक पद को जोड़ता है। हिन्दी में ‘अनुमति नहीं देता’ के बाद ‘या’ स्वाभाविक रूप से दोनों निषिद्ध कार्यों को समन्वित करता है।
- source_word: αὐθεντεῖν
  choice: अधिकार का प्रयोग करने
  rationale: यह दुर्लभ और विवादित क्रिया है। यह चुनाव अधिकार के तटस्थ अर्थ को व्यक्त करता है, बिना मूल में अनिवार्य न होने वाले दमनकारी भाव को मुख्य पाठ में जोड़ने के। अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἀνδρός
  choice: किसी पुरुष पर
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ दोनों हो सकता है। प्रसंग के आधार पर मुख्य पाठ में सामान्य अर्थ रखा गया है, जबकि वैवाहिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἀλλ’
  choice: इसके बजाय
  rationale: ἀλλά निषेध के बाद अपेक्षित वैकल्पिक आचरण प्रस्तुत करता है। ‘इसके बजाय’ इस विरोध को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: εἶναι
  choice: वह ... रहे
  rationale: यूनानी infinitive को हिन्दी में स्वाभाविक अपेक्षार्थक वाक्य के रूप में व्यक्त किया गया है; ‘वह ... रहे’ स्त्रीलिंग कर्ता को स्पष्ट करता है।
- source_word: ἐν ἡσυχίᾳ
  choice: शान्त भाव से
  rationale: ἡσυχία शान्तता, स्थिरता या प्रसंगानुसार मौन का संकेत दे सकता है। ‘शान्त भाव से’ पूर्ण चुप्पी को अनिवार्य ठहराए बिना मूल के प्रमुख भाव को व्यक्त करता है।
theological_decisions:
- issue: विवादित कलीसियाई पाठ में αὐθεντεῖν का अर्थ
  choice: अधिकार का प्रयोग करने
  alternative: अधिकार रखने; प्रभुत्व जमाने
  rationale: दुर्लभ क्रिया αὐθεντέω का सटीक भाव विवादित है। मुख्य पाठ में तटस्थ अधिकार-संबंधी अर्थ रखा गया है; न तो दुरुपयोग का भाव अनिवार्य मानकर जोड़ा गया है, न व्यापक धर्मवैज्ञानिक विवाद को अनुवाद द्वारा सुलझाया गया है।
- issue: γυνή और ἀνήρ का सामान्य अथवा वैवाहिक अर्थ
  choice: स्त्री ... पुरुष
  alternative: पत्नी ... पति
  rationale: दोनों संज्ञाएँ सामान्य और वैवाहिक दोनों अर्थ रख सकती हैं। निकटवर्ती प्रसंग स्त्रियों के बारे में व्यापक रूप से बोलता है और पद 13–14 की सृष्टि-संबंधी दलील केवल विवाह तक स्पष्ट रूप से सीमित नहीं है; इसलिए सामान्य अर्थ मुख्य पाठ में और वैवाहिक अर्थ पादटिप्पणी में रखा गया है।
- issue: ἐν ἡσυχίᾳ में शान्तता या पूर्ण मौन
  choice: शान्त भाव से
  alternative: मौन रहे
  rationale: ἡσυχία का अर्थ शान्तता, स्थिरता अथवा मौन हो सकता है। मुख्य पाठ पूर्ण निरवता को अनिवार्य रूप से आरोपित नहीं करता, और अधिक कड़ा विकल्प पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘किसी स्त्री’ और ‘किसी पुरुष’ सामान्य कथन को स्वाभाविक बनाते हैं। विवादित शब्दों को मुख्य पाठ में अत्यधिक व्याख्यायित नहीं किया गया; वास्तविक भाषिक विकल्प पादटिप्पणियों में सुरक्षित हैं।
