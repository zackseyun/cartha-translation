translation:
  language: hi
  text: बल्कि भले कामों से[a]—जैसा उन स्त्रियों को शोभा देता है[b] जो परमेश्वर-भक्ति[c] का अंगीकार करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘भले कामों के द्वारा’; यहाँ भाव यह है कि भले काम ही उचित श्रृंगार हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘जैसा ... उचित है’ अथवा ‘जैसा ... के लिए उपयुक्त है।’
    reason: lexical_alternative
  - marker: c
    text: या ‘परमेश्वर के प्रति भक्ति’ अथवा ‘परमेश्वर के प्रति श्रद्धा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह पद 9 में बताए गए बाहरी श्रृंगार के विपरीत उचित विकल्प प्रस्तुत करता है; इसलिए ‘बल्कि’ स्वाभाविक विरोधसूचक है।
- source_word: ὃ πρέπει
  choice: जैसा ... उचित है
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम और πρέπω का मुहावरा नैतिक रूप से शोभनीय या उपयुक्त बात को व्यक्त करता है।
- source_word: γυναιξὶν
  choice: स्त्रियों के लिए
  rationale: इस संदर्भ में बहुवचन γυνή सामान्य रूप से स्त्रियों को दर्शाता है, केवल विवाहित पत्नियों को नहीं।
- source_word: ἐπαγγελλομέναις
  choice: दावा करती हैं
  rationale: यह कृदंत किसी बात को सार्वजनिक रूप से मानने या अपने विषय में घोषित करने का भाव रखता है; ‘दावा करती हैं’ इस अर्थ को बिना व्रत या प्रतिज्ञा का अतिरिक्त भाव जोड़े व्यक्त करता है।
- source_word: θεοσέβειαν
  choice: परमेश्वर-भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धा और व्यावहारिक भक्ति को व्यक्त करता है; संयुक्त रूप संक्षिप्त, गरिमापूर्ण और आधुनिक हिन्दी में बोधगम्य है।
- source_word: δι’ ἔργων ἀγαθῶν
  choice: भले कामों से
  rationale: διά के साथ संबंधकारक यहाँ माध्यम या रीति का भाव देता है। पिछले पद के बाहरी श्रृंगार के विपरीत भले कामों को उचित श्रृंगार के रूप में समझा जाता है।
theological_decisions:
- issue: ‘भले कामों’ और परमेश्वर-भक्ति के दावे का संबंध
  choice: भले कामों को परमेश्वर-भक्ति का दावा करनेवाली स्त्रियों के लिए उचित बाहरी अभिव्यक्ति के रूप में रखा गया है।
  alternative: भले काम परमेश्वर के सामने स्वीकार किए जाने या उद्धार पाने का पुण्यकारी आधार हैं।
  rationale: वाक्य-विन्यास बाहरी श्रृंगार और भक्ति के अनुरूप आचरण के बीच विरोध दिखाता है। अनुवाद नैतिक बल बनाए रखता है, पर उद्धार के विषय में ऐसा दावा नहीं जोड़ता जो इस पद में स्पष्टतः नहीं किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण शैली रखी गई है। पद 9 से जुड़े विरोध को बनाए रखने के लिए वाक्य ‘बल्कि’ से आरम्भ होता है। ‘भले काम’ सामान्य पाठक के लिए ‘सत्कर्म’ से अधिक सहज है, जबकि ‘परमेश्वर-भक्ति’ धार्मिक अर्थ की स्पष्टता बनाए रखता है।
