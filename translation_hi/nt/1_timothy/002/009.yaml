id: 1TI.2.9
reference: 1 Timothy 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡσαύτως ⸀καὶ γυναῖκας ἐν καταστολῇ κοσμίῳ μετὰ αἰδοῦς καὶ σωφροσύνης κοσμεῖν ἑαυτάς, μὴ ἐν πλέγμασιν ⸀καὶ ⸀χρυσίῳ ἢ μαργαρίταις ἢ ἱματισμῷ πολυτελεῖ,
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/009.yaml
  text: Likewise also[a], women are to adorn themselves in respectable clothing, with modesty and self-control, not with braided hair and gold or pearls or expensive clothing[b],
translation:
  language: hi
  text: इसी प्रकार स्त्रियाँ भी शालीन वस्त्र पहनकर, लज्जाशीलता और आत्म-संयम के साथ अपना शृंगार करें—न कि बालों की चोटियों, सोने, मोतियों या महँगे वस्त्रों से[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बालों की चोटियों, सोने, मोतियों और महँगे वस्त्रों का यह उल्लेख संभवतः दिखावटी और वैभवपूर्ण सज्जा की ओर संकेत करता है; यह आवश्यक नहीं कि हर परिस्थिति में चोटी बनाने या आभूषण पहनने का पूर्ण निषेध हो।
    reason: cultural_note
lexical_decisions:
- source_word: ὡσαύτως καὶ
  choice: इसी प्रकार ... भी
  rationale: पूर्ववर्ती उपदेश से संबंध और καί की योगात्मकता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γυναῖκας
  choice: स्त्रियाँ
  rationale: सामान्य उपदेशात्मक संदर्भ में विवाह का कोई स्पष्ट संकेत नहीं है; इसलिए ‘पत्नियाँ’ की अपेक्षा ‘स्त्रियाँ’ उपयुक्त है।
- source_word: ἐν καταστολῇ κοσμίῳ
  choice: शालीन वस्त्र पहनकर
  rationale: καταστολή के पहनावे और κόσμιος के उचित, सुव्यवस्थित तथा सम्मानजनक भाव को सहज आधुनिक हिन्दी में समेटता है।
- source_word: μετὰ αἰδοῦς
  choice: लज्जाशीलता के साथ
  rationale: αἰδώς उस संकोच और मर्यादा-बोध को दर्शाता है जो अनुचित प्रदर्शन से रोकता है; ‘लज्जाशीलता’ यहाँ केवल बाहरी रूप नहीं, मनोवृत्ति भी बताती है।
- source_word: σωφροσύνης
  choice: आत्म-संयम
  rationale: सद्बुद्धि से उत्पन्न संयम और आत्म-नियंत्रण के अर्थ को संक्षेप में व्यक्त करता है।
- source_word: κοσμεῖν ἑαυτάς
  choice: अपना शृंगार करें
  rationale: κοσμέω के सजाने-सँवारने के अर्थ को बनाए रखता है और आगे बताए गए दिखावटी शृंगार के साथ वाक्यगत विरोध को स्पष्ट रखता है।
- source_word: μὴ ἐν πλέγμασιν
  choice: न कि बालों की चोटियों ... से
  rationale: πλέγματα बालों की गूँथी हुई सज्जा का संकेत देता है; ‘बालों की चोटियाँ’ आधुनिक पाठक के लिए स्पष्ट है और मूल में न दिए गए ‘अत्यधिक’ जैसे विशेषण को नहीं जोड़ता।
- source_word: χρυσίῳ
  choice: सोने
  rationale: मूल शब्द को व्यापक रखते हुए गहनों का कोई विशिष्ट रूप अनावश्यक रूप से नहीं जोड़ता।
- source_word: μαργαρίταις
  choice: मोतियों
  rationale: शब्द का सीधा और प्रचलित हिन्दी अर्थ।
- source_word: ἱματισμῷ πολυτελεῖ
  choice: महँगे वस्त्रों
  rationale: ἱματισμός के वस्त्र और πολυτελής के अधिक मूल्यवान/महँगे होने के भाव को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या पद सामान्य रूप से स्त्रियों को संबोधित करता है या केवल पत्नियों को
  choice: सामान्य रूप से स्त्रियाँ
  alternative: पत्नियाँ
  rationale: बहुवचन γυναῖκας के साथ ऐसा कोई वैवाहिक सूचक नहीं है जो अर्थ को केवल पत्नियों तक सीमित करे; व्यापक अर्थ मूल की अस्पष्टता को अनावश्यक रूप से संकुचित नहीं करता।
- issue: क्या निषेध हर परिस्थिति में चोटियों, सोने, मोतियों और महँगे वस्त्रों पर पूर्ण प्रतिबंध है
  choice: मुख्य पाठ सूची को बिना व्याख्यात्मक विशेषण के ज्यों का त्यों रखता है; पादटिप्पणी संभावित दिखावटी-सज्जा संदर्भ बताती है
  alternative: हर परिस्थिति में इन सभी वस्तुओं का पूर्ण निषेध
  rationale: वाक्य शालीनता, लज्जाशीलता और आत्म-संयम वाले शृंगार की तुलना सूचीबद्ध बाहरी सज्जा से करता है। फिर भी मुख्य पाठ में ‘दिखावटी’ जोड़ना मूल से अधिक स्पष्ट निर्णय होता, इसलिए व्याख्या पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘शालीन’, ‘लज्जाशीलता’ और ‘आत्म-संयम’ नैतिक भाव को व्यक्त करते हैं, जबकि मुख्य पाठ निषेध की मूल सूची को विस्तार दिए बिना सुरक्षित रखता है।
