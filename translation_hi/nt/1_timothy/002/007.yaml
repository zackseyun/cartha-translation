  text: εἰς ὃ ἐτέθην ἐγὼ κῆρυξ καὶ ἀπόστολος— ἀλήθειαν ⸀λέγω, οὐ ψεύδομαι— διδάσκαλος ἐθνῶν ἐν πίστει καὶ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/007.yaml
  text: For this I was appointed a herald and an apostle—I am telling the truth[c][b][a]; I am not lying—a teacher of the Gentiles in faith and truth.
translation:
  language: hi
  text: इसी उद्देश्य के लिए मुझे घोषक और प्रेरित—मैं सत्य कहता हूँ, झूठ नहीं बोलता—और विश्वास तथा सत्य में गैर-यहूदियों का शिक्षक[a][b] ठहराया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राष्ट्रों का शिक्षक।”
    reason: lexical_alternative
  - marker: b
    text: या, “विश्वासयोग्यता और सत्य में।”
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς ὃ
  choice: इसी उद्देश्य के लिए
  rationale: यह पदबंध पिछले कथन में बताए गए उद्धार और उसकी घोषणा की ओर संकेत करता है। यह अनुवाद प्रयोजन का भाव स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐτέθην
  choice: ठहराया गया
  rationale: यहाँ τίθημι का कर्मवाच्य रूप किसी सेवकीय भूमिका में नियुक्त किए जाने का अर्थ देता है, न कि केवल किसी स्थान पर रखे जाने का।
- source_word: κῆρυξ
  choice: प्रचारक
  rationale: κῆρυξ अधिकारपूर्वक सार्वजनिक घोषणा करने वाले व्यक्ति को दर्शाता है। आधुनिक हिन्दी में 'प्रचारक' सामान्य पाठक के लिए सहज है, यद्यपि इसमें मूल के राजकीय 'घोषक' का पूरा रंग नहीं आता।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: पौलुस द्वारा अपने लिए प्रयुक्त इस मान्य सेवकीय पदनाम का प्रचलित और सटीक हिन्दी रूप 'प्रेरित' है।
- source_word: ἀλήθειαν λέγω, οὐ ψεύδομαι
  choice: मैं सच कहता हूँ, झूठ नहीं बोलता
  rationale: यह स्वाभाविक आधुनिक हिन्दी में मूल की दोहरी और बलपूर्ण पुष्टि को बनाए रखता है।
- source_word: διδάσκαλος ἐθνῶν
  choice: गैर-यहूदियों का शिक्षक
  rationale: पौलुस के इस प्रसंग में ἔθνη मुख्यतः यहूदियों से बाहर के लोगों को दर्शाता है। 'गैर-यहूदी' आधुनिक पाठक के लिए 'अन्यजाति' से अधिक पारदर्शी है।
- source_word: ἐν πίστει καὶ ἀληθείᾳ
  choice: विश्वास और सत्य में
  rationale: यह पदबंध पौलुस की शिक्षकीय सेवा के क्षेत्र, ढंग या गुण को बता सकता है। निकट-औपचारिक रूप मूल की संभावित व्यापकता को बनाए रखता है।
theological_decisions:
- issue: पौलुस की नियुक्ति में ἐθνῶν का अर्थ
  choice: गैर-यहूदी
  alternative: राष्ट्रों/जातियों
  rationale: पौलुसी प्रयोग और निकट प्रसंग में गैर-यहूदी लोग संभावित अभिप्राय हैं, पर मूल शब्द व्यापक अर्थ में राष्ट्रों या जातियों को भी दर्शा सकता है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν πίστει καὶ ἀληθείᾳ में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: πίστις का सामान्य और यहाँ स्वाभाविक अर्थ 'विश्वास' है। फिर भी यह 'विश्वासयोग्यता' का भाव भी रख सकता है, इसलिए उस वास्तविक अर्थ-संभावना को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल वाक्य की बीच में आने वाली बलपूर्ण पुष्टि को दीर्घ विरामों से सुरक्षित रखा गया है। अंतिम 'ठहराया गया' हिन्दी में समानांतर भूमिकाओं को स्पष्ट करता है, यद्यपि यूनानी में क्रिया आरम्भ में एक बार ही आती है।
