translation:
  language: hi
  text: क्योंकि परमेश्वर एक ही है, और परमेश्वर तथा मनुष्यों के बीच मध्यस्थ भी एक ही है—मनुष्य मसीह यीशु।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς
  choice: एक ही
  rationale: दोनों प्रयोगों में ‘एक ही’ रखकर एक परमेश्वर और एक मध्यस्थ की बलयुक्त समानांतरता सुरक्षित की गई है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: θεός
  choice: परमेश्वर
  rationale: यहाँ एकमात्र परमेश्वर के लिए मानक और गरिमापूर्ण हिन्दी पद।
- source_word: μεσίτης
  choice: मध्यस्थ
  rationale: दो पक्षों के बीच संबंध या मेल कराने वाले व्यक्ति के लिए सटीक और प्रचलित धार्मिक हिन्दी शब्द।
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: परमेश्वर तथा मनुष्यों के बीच
  rationale: यूनानी में संबंधकारक रूप हैं, पर हिन्दी में ‘मध्यस्थ’ के साथ ‘के बीच’ अर्थ को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यह मध्यस्थ के वास्तविक मानव होने पर बल देता है और बहुवचन ‘मनुष्यों’ के साथ मूल का शब्द-संबंध बनाए रखता है।
- source_word: Χριστὸς Ἰησοῦς
  choice: मसीह यीशु
  rationale: Χριστός को पदवी के रूप में ‘मसीह’ और Ἰησοῦς को व्यक्तिगत नाम ‘यीशु’ के रूप में रखा गया है; मूल क्रम भी सुरक्षित है।
theological_decisions:
- issue: ἀνθρώπων और ἄνθρωπος का परस्पर संबंध
  choice: ‘मनुष्यों ... मनुष्य’
  alternative: ‘मानवजाति ... मानव’ या ‘लोगों ... मनुष्य’
  rationale: यह चयन समस्त मानवता के सामान्य बहुवचन और यीशु के लिए प्रयुक्त एकवचन के बीच मूल यूनानी का स्पष्ट शाब्दिक तथा प्रतिनिधिक संबंध बनाए रखता है।
- issue: Χριστός का पदवीगत अर्थ
  choice: ‘मसीह यीशु’
  alternative: ‘ख्रीष्ट यीशु’ अथवा ‘क्राइस्ट जीसस’
  rationale: यहाँ Χριστός पदवी है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और स्वाभाविक रूप है।
- issue: ἄνθρωπος Χριστὸς Ἰησοῦς का मसीह-विषयक बल
  choice: यीशु की मानवता को सीधे व्यक्त करना, बिना उनकी ईश्वरता पर कोई अतिरिक्त निष्कर्ष जोड़े
  alternative: ऐसा विस्तार जो उन्हें केवल मनुष्य बताए, या पाठ में उनकी ईश्वरता का स्पष्ट कथन जोड़ दे
  rationale: पद मध्यस्थ की मानवता को स्पष्ट करता है, पर उनकी ईश्वरता को न तो नकारता है, न यहाँ प्रत्यक्ष रूप से प्रतिपादित करता है; अनुवाद इस तनाव को यथावत रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘परमेश्वर तथा मनुष्यों के बीच’ हिन्दी वाक्य-विन्यास में स्वाभाविक है। दीर्घ विराम-चिह्न मध्यस्थ की पहचान ‘मनुष्य, मसीह यीशु’ के रूप में स्पष्ट करता है; अल्पविराम ‘मनुष्य’ की समानाधिकरणात्मक भूमिका दर्शाता है।
