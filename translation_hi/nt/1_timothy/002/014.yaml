base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/014.yaml
  text: And Adam was not deceived[a], but the woman, having been deceived[b], came to be in transgression.
translation:
  language: hi
  text: और आदम धोखे में नहीं पड़ा, पर स्त्री धोखा खाकर अपराध की अवस्था में आ गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδὰμ
  choice: आदम
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुसार मानक लिप्यंतरण।
- source_word: ἠπατήθη
  choice: धोखा नहीं खाया
  rationale: ἀπατάω के निष्क्रिय भूतकालीन रूप का स्वाभाविक हिन्दी अनुवाद; यह क्रिया को सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἡ γυνὴ
  choice: स्त्री
  rationale: γυνή का अर्थ पत्नी भी हो सकता है, किंतु उत्पत्ति-वृत्तांत की ओर संकेत और आदम के साथ विरोध यहाँ सामान्य पद ‘स्त्री’ का समर्थन करते हैं।
- source_word: ἐξαπατηθεῖσα
  choice: पूरी तरह धोखा खाकर
  rationale: ἐξαπατάω, पहले प्रयुक्त ἀπατάω की तुलना में प्रबल अभिव्यक्ति हो सकती है; ‘पूरी तरह’ उस संभावित गहनता को स्पष्ट किन्तु सहज हिन्दी में रखता है, और ‘खाकर’ मुख्य क्रिया से पूर्व की क्रिया को दर्शाता है।
- source_word: ἐν παραβάσει
  choice: अपराध की दशा में
  rationale: παράβασις का आशय निर्धारित सीमा या आज्ञा का उल्लंघन है। ‘अपराध की दशा में’ अमूर्त संज्ञा और ἐν की अवस्थात्मक संभावना को बनाए रखता है, बिना स्त्री को सीधे ‘अपराधिनी’ कहे।
- source_word: γέγονεν
  choice: आ गई
  rationale: γίνομαι के पूर्णकालिक रूप में घटना और उससे बनी अवस्था दोनों निहित हैं; ‘दशा में आ गई’ हिन्दी में इस परिवर्तन और परिणामी स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह आदम और स्त्री के बीच स्पष्ट विरोध दिखाता है।
- source_word: καὶ
  choice: और
  rationale: पद को पिछले तर्क से जोड़ने वाला सीधा संयोजक।
theological_decisions:
- issue: स्त्री और अपराध के संबंध को इस प्रकार व्यक्त करना कि उत्पत्ति-वृत्तांत से जुड़ा कथन बना रहे और व्यापक स्त्री-दोष या स्वभाव संबंधी निष्कर्ष न जोड़े जाएँ।
  choice: ‘स्त्री पूरी तरह धोखा खाकर अपराध की दशा में आ गई’
  alternative: ‘स्त्री धोखा खाकर अपराधिनी बन गई’
  rationale: चुना गया अनुवाद παράβασις की अमूर्त संज्ञा और γέγονεν के परिणामी अवस्था-सूचक बल को बनाए रखता है। ‘अपराधिनी’ मूल पाठ में निहित अमूर्त कथन को व्यक्ति की स्थायी संज्ञा में बदल सकता है।
- issue: ἀπατάω और ἐξαπατάω के बीच संभावित अर्थ-बल को हिन्दी में दिखाना।
  choice: पहली क्रिया के लिए ‘धोखा नहीं खाया’ और दूसरी के लिए ‘पूरी तरह धोखा खाकर’
  alternative: दोनों के लिए केवल ‘धोखा खाना’
  rationale: संयुक्त क्रिया ἐξαπατάω में अधिक प्रबल अर्थ संभव है। मुख्य पाठ में अंतर दिखाया गया है, पर इसे किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष तक नहीं बढ़ाया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘उल्लंघन’ की अपेक्षा ‘अपराध’ आम पाठक के लिए अधिक सहज है, जबकि ‘अपराध की दशा में’ मूल की अमूर्त और अवस्थात्मक रचना को पर्याप्त निकटता से बचाए रखता है।
