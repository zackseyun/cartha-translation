source:
  edition: SBLGNT
  text: σωθήσεται δὲ διὰ τῆς τεκνογονίας, ἐὰν μείνωσιν ἐν πίστει καὶ ἀγάπῃ καὶ ἁγιασμῷ μετὰ σωφροσύνης.
base_translation:
  language: en
  yaml_path: translation/nt/1_timothy/002/015.yaml
  text: Yet she will be saved through childbearing[c][b][a], if they continue in faith and love and holiness with self-control.
translation:
  language: hi
  text: फिर भी वह संतान जनने के द्वारा उद्धार पाएगी[a][c], यदि वे विश्वास[b], प्रेम और पवित्रता में आत्म-संयम के साथ बनी रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस संतान-जन्म के द्वारा।” कुछ लोग इसे किसी विशेष जन्म—संभवतः मसीहा के जन्म—का संकेत समझते हैं; पर यह वाक्यांश सामान्य रूप से संतान जनने के अर्थ में भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “विश्वास” का अर्थ यहाँ “विश्वासयोग्यता” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी पाठ एकवचन (“वह उद्धार पाएगी”) से बहुवचन (“यदि वे ... बनी रहें”) में बदल जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σωθήσεται
  choice: उद्धार पाएगी
  rationale: भविष्यत् कर्मवाच्य रूप को पौलुस के सामान्य धर्मवैचारिक प्रयोग के अनुरूप ‘उद्धार पाएगी’ कहा गया है; ‘सुरक्षित रहेगी’ अर्थ को केवल शारीरिक रक्षा तक सीमित कर सकता है।
- source_word: δὲ
  choice: फिर भी
  rationale: यह पिछले कथन के साथ हल्का विरोध अथवा आगे का विकास दिखाता है; ‘फिर भी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς τεκνογονίας
  choice: सन्तान उत्पन्न करने के द्वारा
  rationale: τεκνογονία का सामान्य अर्थ सन्तान उत्पन्न करना अथवा बच्चे जनना है। यूनानी निश्चित लेख के कारण किसी विशिष्ट जन्म की सम्भावना पादटिप्पणी में रखी गई है, पर मुख्य पाठ में सामान्य अर्थ सुरक्षित है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य का सीधा और स्वाभाविक अनुवाद है।
- source_word: μείνωσιν
  choice: वे ... बने रहें
  rationale: बहुवचन क्रिया विश्वास, प्रेम और पवित्रता में निरन्तर बने रहने का भाव देती है।
- source_word: ἐν πίστει
  choice: विश्वास में
  rationale: πίστις का सामान्य अनुवाद ‘विश्वास’ रखा गया है; ‘विश्वासयोग्यता’ भी सम्भव अर्थ है और उसे पादटिप्पणी में दिया गया है।
- source_word: ἀγάπῃ
  choice: प्रेम
  rationale: ἀγάπη का मानक, स्पष्ट और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἁγιασμῷ
  choice: पवित्रता
  rationale: यहाँ सद्गुणों की सूची में ‘पवित्रता’ स्वाभाविक है और तकनीकी शब्दावली से बचते हुए नैतिक-आत्मिक भाव बनाए रखती है।
- source_word: μετὰ σωφροσύνης
  choice: आत्म-संयम के साथ
  rationale: σωφροσύνη में संयम, विवेक और संतुलित मन का भाव है; ‘आत्म-संयम’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग के नैतिक बल के अनुकूल है।
theological_decisions:
- issue: एकवचन ‘वह उद्धार पाएगी’ से बहुवचन ‘यदि वे ... बने रहें’ की ओर परिवर्तन
  choice: मूल व्याकरणिक परिवर्तन को ज्यों का त्यों रखा गया है।
  alternative: दोनों को सामान्य रूप से स्त्रियों पर लागू मानकर ‘स्त्रियाँ ... यदि वे’ कहना, अथवा ‘वह’ को हव्वा और ‘वे’ को सामान्यतः स्त्रियाँ मानना।
  rationale: यूनानी पाठ स्वयं एकवचन से बहुवचन में बदलता है। इसे समतल करने से स्रोत का महत्त्वपूर्ण और व्याख्यात्मक रूप से तनावपूर्ण पहलू छिप जाता।
- issue: ‘सन्तान उत्पन्न करने के द्वारा उद्धार’ का अर्थ
  choice: उद्धार की प्रकृति या ‘के द्वारा’ के सटीक सम्बन्ध को स्पष्ट किए बिना वाक्यांश को खुला रखा गया है।
  alternative: प्रसव में सुरक्षित रहना; मातृत्व अपनाने से उद्धार पाना; मसीहा के जन्म के द्वारा उद्धार पाना।
  rationale: यह वाक्यांश वास्तव में विवादित है। यूनानी न तो स्पष्ट रूप से प्रसव में शारीरिक सुरक्षा कहता है, न मातृत्व को उद्धार का साधन ठहराता है, और न किसी विशिष्ट मसीही जन्म की स्पष्ट पहचान करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किन्तु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘सन्तान उत्पन्न करना,’ ‘उद्धार’ और ‘आत्म-संयम’ जैसे परिचित शब्द चुने गए हैं। स्रोत का एकवचन-बहुवचन परिवर्तन और कठिन धर्मवैचारिक अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
