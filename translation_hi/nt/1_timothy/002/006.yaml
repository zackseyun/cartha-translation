  yaml_path: translation/nt/1_timothy/002/006.yaml
  text: who gave himself as a ransom for all[c][b][a], the testimony at the proper times.
translation:
  language: hi
  text: जिसने अपने आप को सबके लिए[a] छुड़ौती के रूप में दे दिया—नियत समयों पर गवाही[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबकी ओर से।” यूनानी पद व्यापक है और अपने आप यह तय नहीं करता कि आशय बिना अपवाद हर व्यक्ति से है या हर प्रकार के लोगों से।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “नियत समयों पर गवाही।” यूनानी वाक्यांश संक्षिप्त है और पिछले कथन के साथ उसका व्याकरणिक संबंध विवादित है। इसका आशय यह हो सकता है कि मसीह का अपने आप को दे देना ही वह गवाही है जो परमेश्वर के ठहराए समयों पर दी गई या प्रकट की गई।
    reason: lexical_alternative
lexical_decisions:
- source_word: δοὺς
  choice: दे दिया
  rationale: यह δίδωμι का एओरिस्ट कृदंत है और पिछले पद के ‘मनुष्य मसीह यीशु’ का वर्णन करता है। हिन्दी में संबंधवाचक उपवाक्य के भीतर ‘दे दिया’ स्वाभाविक है और पूर्ण आत्म-समर्पण का भाव रखता है।
- source_word: ἑαυτὸν
  choice: अपने आप को
  rationale: आत्मवाचक सर्वनाम मसीह के स्वेच्छापूर्ण आत्म-दान पर बल देता है; ‘अपने आप को’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ἀντίλυτρον
  choice: छुड़ौती के रूप में
  rationale: यह शब्द मुक्ति के लिए चुकाए गए मूल्य को व्यक्त करता है और ἀντί- के कारण बदले में दिए जाने का भाव भी रखता है। ‘छुड़ौती’ मूल अर्थ को सुरक्षित रखता है, जबकि मुख्य पाठ में ‘बदले की छुड़ौती’ जैसा अस्वाभाविक विस्तार नहीं किया गया।
- source_word: ὑπὲρ πάντων
  choice: सबके लिए
  rationale: ὑπέρ का अर्थ ‘के लिए’ अथवा ‘की ओर से’ हो सकता है। ‘सबके लिए’ संक्षिप्त, स्वाभाविक और πάντων की व्यापकता को बिना संकीर्ण किए व्यक्त करता है।
- source_word: τὸ μαρτύριον
  choice: यही वह गवाही है
  rationale: यह संक्षिप्त यूनानी पद पिछले कथन को समानाधिकरण या साररूप में ग्रहण कर सकता है। ‘यही वह गवाही है’ आत्म-दान और गवाही के बीच संबंध को हिन्दी में स्पष्ट करता है, पर उसका आशय नया सिद्धांत जोड़कर नहीं खोलता।
- source_word: καιροῖς ἰδίοις
  choice: नियत समयों पर
  rationale: बहुवचन पद उपयुक्त अथवा ठहराए हुए अवसरों को दर्शाता है। ‘नियत समयों पर’ बहुवचन को बनाए रखते हुए ईश्वर द्वारा निर्धारित समयों का भाव स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: πάντων के संदर्भ में मसीह की छुड़ौती का विस्तार
  choice: सबके लिए
  alternative: हर एक व्यक्ति के लिए; हर प्रकार के लोगों के लिए
  rationale: पाठ का शब्द व्यापक है, पर यह बाद की इस धर्मवैज्ञानिक बहस का स्वयं निर्णय नहीं करता कि आशय बिना अपवाद प्रत्येक व्यक्ति से है या सभी प्रकार और वर्गों के लोगों से। अनुवाद उसी व्यापकता और तनाव को बनाए रखता है।
- issue: ἀντίλυτρον में प्रतिस्थापन का भाव
  choice: छुड़ौती
  alternative: बदले में दी गई छुड़ौती; छुड़ौती का मूल्य
  rationale: शब्द में मुक्ति और बदले में मूल्य दिए जाने, दोनों का भाव है। मुख्य पाठ में ‘छुड़ौती’ मूल अर्थ देता है; विस्तृत विकल्प अर्थ को आवश्यकता से अधिक व्याख्यायित कर सकते हैं।
- issue: τὸ μαρτύριον καιροῖς ἰδίοις का पिछले कथन से संबंध
  choice: मसीह का आत्म-दान ही नियत समयों पर दी गई गवाही है
  alternative: यह वाक्यांश गवाही के प्रकट किए जाने के समय को बताता है; अथवा ‘नियत समयों पर गवाही’ के रूप में संक्षिप्त समानाधिकरण है
  rationale: यूनानी रचना अत्यंत संक्षिप्त है। सहज हिन्दी के लिए निहित संयोजक और क्रिया व्यक्त किए गए हैं, जबकि पादटिप्पणी अधिक शाब्दिक संरचना और संभावित संबंध को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘छुड़ौती’ बाइबलीय संदर्भ में परिचित है और ‘फिरौती’ की तुलना में अनावश्यक आपराधिक संदर्भ कम जगाती है। यूनानी के संक्षिप्त समानाधिकरण को हिन्दी में दो वाक्यों द्वारा स्वाभाविक बनाया गया है; जोड़ी गई व्याकरणिक स्पष्टता को पादटिप्पणी में पारदर्शी किया गया है।
