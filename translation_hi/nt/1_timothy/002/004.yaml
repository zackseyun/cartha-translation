lexical_decisions:
- source_word: ὃς
  choice: जो
  rationale: यह सम्बन्धवाचक सर्वनाम पिछले पद में उल्लिखित परमेश्वर की ओर संकेत करता है और वाक्य का सम्बन्ध स्वाभाविक रूप से बनाए रखता है।
- source_word: πάντας ἀνθρώπους
  choice: सभी मनुष्य
  rationale: यह पदबंध सामान्य रूप से समस्त मानवजाति को सूचित करता है, केवल पुरुषों को नहीं; आधुनिक हिन्दी में ‘सभी मनुष्य’ सार्वभौमिक दायरे को स्पष्ट रखता है।
- source_word: θέλει
  choice: चाहता है
  rationale: θέλω का अर्थ चाहना, इच्छा रखना या संकल्प करना हो सकता है। ‘चाहता है’ सरल और स्वाभाविक है तथा परमेश्वर की इच्छा के स्वरूप पर चलने वाली धर्मवैज्ञानिक बहस को अनावश्यक रूप से तय नहीं करता।
- source_word: σωθῆναι
  choice: उद्धार पाएँ
  rationale: यह σῴζω का कर्मवाच्य अनन्तरूप है और पौलुस के प्रयोग में यहाँ उद्धार-संबंधी अर्थ रखता है; ‘उद्धार पाएँ’ हिन्दी बाइबलीय भाषा में स्पष्ट और परिचित है।
- source_word: εἰς ἐπίγνωσιν ἀληθείας
  choice: सत्य के ज्ञान तक
  rationale: ἐπίγνωσις ज्ञान, पहचान या पूर्ण ज्ञान का भाव दे सकता है। ‘सत्य के ज्ञान तक’ मुख्य अर्थ को सहज हिन्दी में रखता है, जबकि अधिक पूर्ण ज्ञान की सम्भावित छाया पादटिप्पणी में दी गई है।
- source_word: ἐλθεῖν
  choice: पहुँचें
  rationale: ἔρχομαι का εἰς के साथ प्रयोग किसी अवस्था या वास्तविकता तक आने को व्यक्त करता है; हिन्दी में ‘तक पहुँचें’ इस गति-भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: πάντας ἀνθρώπους का दायरा और परमेश्वर की उद्धारकारी इच्छा
  choice: ‘सभी मनुष्य’ और ‘चाहता है’ के रूप में सीधा अनुवाद, जिससे सार्वभौमिक दायरा और धर्मवैज्ञानिक तनाव दोनों बने रहें।
  alternative: ‘हर प्रकार के मनुष्य’ अथवा ‘सभी मनुष्यों के उद्धार का संकल्प करता है।’
  rationale: यूनानी पदबंध स्वाभाविक रूप से व्यापक दायरा रखता है। उसे ‘हर प्रकार के’ तक सीमित करना या θέλει को तकनीकी अर्थ में निर्णायक ‘संकल्प’ बनाना मूल पाठ से आगे जाकर विवाद का समाधान कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उद्धार पाएँ’ धर्मवैज्ञानिक अर्थ को स्पष्ट रखता है, जबकि ‘चाहता है’ और ‘सत्य के ज्ञान तक पहुँचें’ सामान्य पाठक के लिए स्वाभाविक हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
