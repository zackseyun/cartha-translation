base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/008.yaml
  text: But even if we or an angel from heaven should proclaim good news to you contrary to what we proclaimed to you[c][b][a], let him be accursed.
translation:
  language: hi
  text: लेकिन यदि हम स्वयं, या स्वर्ग से कोई दूत भी तुम्हें उस शुभ समाचार के विपरीत कोई शुभ समाचार सुनाए[a] जो हमने तुम्हें सुनाया था,[b] तो वह शापित हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें सुसमाचार का प्रचार करे।” यूनानी में यहाँ “शुभ समाचार सुनाना” या “घोषित करना” अर्थ वाली क्रिया है।
    reason: lexical_alternative
  - marker: b
    text: या “उस शुभ समाचार से भिन्न” अथवा “उससे आगे बढ़कर।”
    reason: lexical_alternative
  - marker: c
    text: या “वह अभिशाप के अधीन हो”; परंपरागत रूप में, “वह अनाथेमा हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ ἐὰν
  choice: लेकिन यदि हम भी
  rationale: ‘लेकिन’ प्रबल विरोधसूचक बल को, और ‘भी’ καί के बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ
  choice: हम भी, या स्वर्ग से कोई दूत
  rationale: यह पौलुस के स्वयं को भी शर्त के अधीन रखने और स्वर्गीय संदेशवाहक के तीखे उदाहरण—दोनों को बनाए रखता है। ‘दूत’ ἄγγελος का सहज और प्रसंगानुकूल अर्थ है।
- source_word: εὐαγγελίζηται
  choice: शुभ समाचार सुनाए
  rationale: यूनानी क्रिया के ‘शुभ समाचार घोषित करने’ के अर्थ को सामान्य पाठक के लिए स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल पारिभाषिक संज्ञा तक सीमित किए।
- source_word: παρ’ ὃ
  choice: उस शुभ समाचार के विरुद्ध
  rationale: इस विवादात्मक प्रसंग में παρά पहले घोषित संदेश से विरोध या विचलन बताता है। मुख्य पाठ में ‘विरुद्ध’ उसका प्रबल अर्थ रखता है, जबकि अन्य सम्भव छायाएँ पादटिप्पणी में दी गई हैं।
- source_word: εὐηγγελισάμεθα
  choice: जो हमने तुम्हें सुनाया था
  rationale: पहली क्रिया के साथ अर्थगत संबंध बनाए रखता है और हिन्दी में वाक्य को स्वाभाविक बनाता है।
- source_word: ἀνάθεμα ἔστω
  choice: तो वह शापित हो
  rationale: यह सूत्र की गंभीर, न्यायात्मक और अभिशापसूचक शक्ति को स्पष्ट आधुनिक हिन्दी में रखता है, बिना बाद की कलीसियाई तकनीकी धारणा जोड़ने के।
theological_decisions:
- issue: ἀνάθεμα ἔστω में अभिशाप का स्वरूप
  choice: तो वह शापित हो
  alternative: वह अभिशाप के अधीन हो; वह अनाथेमा हो
  rationale: मूल पाठ वास्तविक और गंभीर अभिशाप व्यक्त करता है। ‘शापित हो’ उसकी तीव्रता बनाए रखता है, पर इसे केवल औपचारिक बहिष्कार का तकनीकी विधान नहीं बनाता।
- issue: παρ’ ὃ में विरोध अथवा भिन्नता
  choice: उस शुभ समाचार के विरुद्ध
  alternative: उससे भिन्न; उससे आगे बढ़कर
  rationale: संदर्भ में पौलुस का बल प्रेरितिक शुभ समाचार से टकराने वाले संदेश पर है। फिर भी यूनानी पूर्वसर्ग की व्यापक सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शुभ समाचार’ सामान्य पाठक के लिए पारदर्शी है; ‘सुसमाचार’ को पादटिप्पणी में पारंपरिक विकल्प के रूप में रखा गया है। वचन की तीव्र चेतावनी और मूल की वास्तविक अर्थगत अस्पष्टता दोनों सुरक्षित हैं।
