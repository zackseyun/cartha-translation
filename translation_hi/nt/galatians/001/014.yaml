source:
  edition: SBLGNT
  text: καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/014.yaml
  text: And I was advancing in Judaism beyond many of my contemporaries among my people[b][a], being far more zealous for the traditions of my fathers.
translation:
  language: hi
  text: और मैं यहूदी धर्म[a] में अपने लोगों में अपने बहुत-से हमउम्रों से अधिक प्रगति कर रहा था, और अपने पूर्वजों की परंपराओं के लिए कहीं अधिक उत्साही था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदी जीवन-पद्धति”। यहाँ यूनानी शब्द में केवल व्यक्तिगत धार्मिक विश्वास नहीं, बल्कि यहूदी धार्मिक-सामुदायिक जीवन-व्यवस्था का व्यापक संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτον
  choice: आगे बढ़ रहा था
  rationale: अपूर्णकाल भूतकाल में जारी प्रगति को व्यक्त करता है; यह पदबंध उसी गतिशील और तुलनात्मक भाव को बनाए रखता है।
- source_word: Ἰουδαϊσμῷ
  choice: यहूदी धर्म में
  rationale: यह संक्षिप्त और स्वाभाविक हिंदी अभिव्यक्ति है, जो यहाँ पहचानी जा सकने वाली यहूदी धार्मिक जीवन-व्यवस्था को दर्शाती है।
- source_word: ὑπὲρ πολλοὺς συνηλικιώτας
  choice: बहुत-से हमउम्र लोगों से
  rationale: ὑπέρ तुलना व्यक्त करता है और συνηλικιώτας समान आयु के लोगों को; 'हमउम्र' आधुनिक हिंदी में दोनों बातों को स्पष्ट रखता है।
- source_word: ἐν τῷ γένει μου
  choice: अपने लोगों के
  rationale: γένος यहाँ पौलुस के अपने जातीय-सामुदायिक समूह की ओर संकेत करता है; 'अपने लोग' आधुनिक हिंदी में स्वाभाविक है और 'जाति' से उत्पन्न संभावित भ्रम से बचाता है।
- source_word: περισσοτέρως
  choice: उनसे कहीं अधिक
  rationale: यह तुलना को तीव्र करता है; 'उनसे' का स्पष्ट प्रयोग हमउम्र लोगों के साथ निहित तुलना को हिंदी में सहज बनाता है।
- source_word: ζηλωτὴς ὑπάρχων
  choice: उत्साही था
  rationale: यह कृदंतीय रचना पौलुस की उस समय विद्यमान तीव्र लगन को व्यक्त करती है; 'उत्साही' राजनीतिक या तकनीकी अर्थ जोड़े बिना ζηλωτής का भाव देता है।
- source_word: τῶν πατρικῶν μου παραδόσεων
  choice: अपने पूर्वजों से मिली परंपराओं के लिए
  rationale: πατρικός पूर्वजों से विरासत में मिली बात को और παραδόσεις सौंपी गई परंपराओं को सूचित करता है; यह हिंदी अभिव्यक्ति उस विरासतगत भाव को स्पष्ट और स्वाभाविक रूप से रखती है।
theological_decisions:
- issue: Ἰουδαϊσμός का दायरा
  choice: यहूदी धर्म
  alternative: यहूदी जीवन-पद्धति
  rationale: संदर्भ पौलुस की धार्मिक-सामुदायिक जीवन-व्यवस्था की ओर संकेत करता है। 'यहूदी धर्म' मानक और सहज है, पर इसे केवल आधुनिक अर्थ में निजी विश्वास तक सीमित नहीं समझना चाहिए।
- issue: πατρικῶν παραδόσεων में पूर्वजगत विरासत
  choice: पूर्वजों से मिली परंपराएँ
  alternative: पितरों की परंपराएँ
  rationale: चुना हुआ रूप विरासत और सौंपे जाने का भाव स्पष्ट करता है, बिना इन परंपराओं के धार्मिक मूल्य का समर्थन या खंडन जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु साधारण पाठक के लिए सहज। वाक्य में पौलुस की निरंतर प्रगति, अपने हमउम्र लोगों से तुलना और पैतृक परंपराओं के प्रति उसकी तीव्र लगन—तीनों को स्पष्ट रखा गया है।
