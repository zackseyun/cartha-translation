  text: ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρ’ ὃ παρελάβετε, ἀνάθεμα ἔστω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/009.yaml
  text: 'As we have said before[a], so now I say again: if anyone is preaching a gospel to you contrary to what you received[b], let him be accursed.'
translation:
  language: hi
  text: 'जैसा हम पहले कह चुके हैं, वैसा ही अब मैं फिर कहता हूँ: यदि कोई तुम्हें ऐसा सुसमाचार सुनाता है जो उस सुसमाचार से भिन्न है जिसे तुमने ग्रहण किया है,[a] तो वह शापित हो![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुमने ग्रहण किया है उसके विपरीत”; यह वाक्यांश ग्रहण किए हुए संदेश से विचलन को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'या, “वह शाप के अधीन रहे”; यूनानी: अनाथेमा एस्तो।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς προειρήκαμεν
  choice: जैसा हम पहले कह चुके हैं
  rationale: यह वाक्यांश पहले कही गई बात और उसकी वर्तमान प्रासंगिकता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄρτι πάλιν λέγω
  choice: वैसा ही अब मैं फिर कहता हूँ
  rationale: ‘अब’ वर्तमान क्षण और ‘फिर’ कथन की पुनरावृत्ति को सुरक्षित रखता है।
- source_word: εἴ τις ὑμᾶς εὐαγγελίζεται
  choice: यदि कोई तुम्हें ... सुसमाचार सुनाता है
  rationale: क्रिया सुसमाचार घोषित करने को दर्शाती है; ‘सुनाता है’ सहज आधुनिक हिन्दी में उसके प्रचारात्मक अर्थ को व्यक्त करता है।
- source_word: παρ’ ὃ
  choice: से भिन्न
  rationale: इस प्रसंग में παρά ग्रहण किए गए संदेश से विचलन या विरोध सूचित करता है। ‘से भिन्न’ मूल की तुलना और वास्तविक विचलन को बनाए रखता है, जबकि पादटिप्पणी अधिक तीखा विकल्प बताती है।
- source_word: παρελάβετε
  choice: जिसे तुमने ग्रहण किया था
  rationale: ‘ग्रहण किया’ किसी सौंपे गए संदेश को पाने और स्वीकार करने के अर्थ के लिए उपयुक्त तथा गरिमापूर्ण है।
- source_word: ἀνάθεμα ἔστω
  choice: तो वह शापित हो
  rationale: यह संक्षिप्त और गंभीर अभिव्यक्ति यूनानी पद के शापाधीन होने के न्यायिक बल को बनाए रखती है, बिना शाप के कर्ता के बारे में अतिरिक्त बात जोड़े।
theological_decisions:
- issue: ἀνάθεμα ἔστω में पौलुस की निंदा का बल
  choice: तो वह शापित हो
  alternative: तो वह शाप के अधीन रहे
  rationale: मुख्य पाठ चेतावनी की कठोरता बनाए रखता है, पर यूनानी से परे जाकर स्पष्ट रूप से ‘परमेश्वर का शाप’ नहीं जोड़ता।
- issue: παρ’ ὃ का संबंधपरक अर्थ
  choice: उस सुसमाचार से भिन्न ... जिसे तुमने ग्रहण किया था
  alternative: उसके विरुद्ध ... जिसे तुमने ग्रहण किया था
  rationale: ‘से भिन्न’ प्राप्त सुसमाचार से विचलन को व्यक्त करता है और मूल के संभावित ‘विरुद्ध/से परे’ अर्थक्षेत्र को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गंभीर और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘सुसमाचार’ स्थापित बाइबलीय पद है; ‘ग्रहण किया’ परंपरा या संदेश प्राप्त करने का भाव बनाए रखता है।
