source:
  edition: SBLGNT
  text: ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/016.yaml
  text: to reveal his Son in me[a], so that I might proclaim him among the Gentiles, I did not immediately consult with flesh and blood[b],
translation:
  language: hi
  text: कि अपने पुत्र को मुझमें[a] प्रकट करे, ताकि मैं अन्यजातियों के बीच उसी का प्रचार करूँ, तो मैंने तुरन्त मांस और लहू से परामर्श नहीं किया[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे” अथवा “मेरे द्वारा।”
    reason: alternative_reading
  - marker: b
    text: “मांस और लहू” मनुष्य या मनुष्यों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκαλύψαι
  choice: प्रकट करे
  rationale: यह परमेश्वर द्वारा किए गए प्रकाशन का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है तथा पिछले पद से चली आ रही आशय-संबंधी रचना को बनाए रखता है।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: अपने पुत्र को
  rationale: यह सम्बन्धवाचक सर्वनाम का स्वाभाविक हिन्दी रूप है और ‘पुत्र’ की मसीह-संबंधी उपाधि को बिना विस्तार के सुरक्षित रखता है।
- source_word: ἐν ἐμοὶ
  choice: मुझमें
  rationale: ग्रीक ἐν का निकटतम औपचारिक रूप रखकर यह आन्तरिक प्रकाशन तथा पौलुस को प्रकाशन का क्षेत्र या माध्यम मानने की सम्भावनाओं को खुला छोड़ता है।
- source_word: ἵνα εὐαγγελίζωμαι αὐτὸν
  choice: ताकि मैं उसका सुसमाचार सुनाऊँ
  rationale: εὐαγγελίζω का अर्थ शुभ समाचार घोषित करना है। हिन्दी में ‘उसका सुसमाचार सुनाऊँ’ सहज है; यह αὐτόν के व्यक्ति-केंद्रित बल को यथासम्भव बनाए रखते हुए अप्राकृतिक ‘उसे सुसमाचार सुनाऊँ’ से बचता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: अन्यजातियों के बीच
  rationale: इस पौलुसी सन्दर्भ में ἔθνη मुख्यतः गैर-यहूदी लोगों को सूचित करता है; ‘अन्यजातियाँ’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और परिचित है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: यह εὐθέως का संक्षिप्त, स्वाभाविक और अर्थ-सटीक आधुनिक हिन्दी रूप है।
- source_word: οὐ προσανεθέμην
  choice: सलाह नहीं ली
  rationale: मध्यवाच्य क्रिया यहाँ किसी से परामर्श या विचार-विमर्श करने का भाव रखती है; ‘सलाह नहीं ली’ साधारण पाठक के लिए स्पष्ट है।
- source_word: σαρκὶ καὶ αἵματι
  choice: हाड़-माँस के मनुष्यों से
  rationale: यह मुहावरे की मूर्त शारीरिक भाषा और उसका मानवीय संकेत दोनों व्यक्त करता है। केवल ‘मनुष्यों से’ कहने पर पौलुस की सजीव अभिव्यक्ति खो जाती।
theological_decisions:
- issue: पुत्र के प्रकाशन के सम्बन्ध में ἐν ἐμοὶ का अर्थ
  choice: मुख्य पाठ में शाब्दिक और बहुअर्थी ‘मुझमें’ रखा गया
  alternative: ‘मुझ पर/मुझे’ अथवा ‘मेरे द्वारा’
  rationale: यह वाक्यांश पौलुस के भीतर हुए प्रकाशन, उसे दिए गए प्रकाशन, या उसके द्वारा प्रकट किए जाने की ओर संकेत कर सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता और विकल्प पादटिप्पणी में रखता है।
- issue: ἵνα εὐαγγελίζωμαι αὐτὸν में αὐτόν का व्यक्ति-केंद्रित बल
  choice: ‘उसका सुसमाचार सुनाऊँ’
  alternative: अधिक औपचारिक ‘उसी को शुभ समाचार के रूप में घोषित करूँ’
  rationale: ग्रीक में पुत्र स्वयं क्रिया का कर्म है। चुना हुआ रूप पठनीय आधुनिक हिन्दी देता है, जबकि अर्थ को पुत्र-केंद्रित बनाए रखता है; वैकल्पिक रूप अधिक औपचारिक पर कम स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय गद्य। पद पिछले वाक्य की निरन्तरता में है, इसलिए आरम्भ ‘कि’ से और अन्त अल्पविराम से किया गया है। ‘अन्यजातियों’ जैसे परिचित धर्मग्रन्थीय शब्द को रखा गया है, पर वाक्य-विन्यास सामान्य पाठकों के लिए सरल रखा गया है।
