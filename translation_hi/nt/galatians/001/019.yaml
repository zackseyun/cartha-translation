  yaml_path: translation/nt/galatians/001/019.yaml
  text: But I saw none of the other apostles except James[a], the Lord’s brother.
translation:
  language: hi
  text: परन्तु प्रेरितों में से मैंने प्रभु के भाई याकूब[a] के सिवा किसी और को नहीं देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने प्रेरितों में से किसी और को नहीं देखा—केवल प्रभु के भाई याकूब को देखा।” कुछ लोग इस वाक्य-विन्यास को ऐसा समझते हैं कि इसमें याकूब को प्रेरितों में शामिल नहीं किया गया है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: ἕτερον
  choice: दूसरे ... में से किसी को
  rationale: 'τῶν ἀποστόλων के साथ यह अंशात्मक संबंध व्यक्त करता है: प्रेरितों में से कोई दूसरा। हिंदी में यह विन्यास स्वाभाविक और अर्थ-सटीक है।'
- source_word: δέ
  choice: परन्तु
  rationale: यह पिछले कथन के साथ हल्का विरोध या आगे बढ़ता हुआ अंतर दिखाता है।
- source_word: ἀποστόλων
  choice: प्रेरितों
  rationale: पौलुस के संदर्भ में मान्य प्रेषितीय समूह के लिए स्थापित और सामान्य हिंदी पद।
- source_word: οὐκ εἶδον
  choice: मैंने ... किसी को नहीं देखा
  rationale: नकार और भूतकाल को स्पष्ट रखते हुए अंशात्मक वाक्य-विन्यास के साथ स्वाभाविक हिंदी देता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: यहाँ यह शर्त नहीं, बल्कि अपवाद सूचित करता है।
- source_word: Ἰάκωβον
  choice: याकूब
  rationale: Ἰάκωβος के लिए हिंदी बाइबलीय परंपरा में प्रचलित नाम।
- source_word: ἀδελφὸν
  choice: भाई
  rationale: मूल शब्द का सीधा और सामान्य पारिवारिक अर्थ; संदर्भ इसे व्यापक संबंध-सूचक शब्द बनाने की माँग नहीं करता।
- source_word: τοῦ κυρίου
  choice: प्रभु के
  rationale: κύριος की उपाधि के लिए स्थापित हिंदी रूप रखते हुए संबंधकारक विन्यास स्वाभाविक है।
theological_decisions:
- issue: क्या इस वाक्य-विन्यास में याकूब को प्रेरितों में गिना गया है
  choice: मुख्य पाठ में याकूब को ‘दूसरे प्रेरितों’ के कथन का अपवाद माना गया है, जो यूनानी वाक्य-विन्यास का सबसे स्वाभाविक अर्थ है।
  alternative: इसे इस प्रकार भी समझा जाता है कि पौलुस ने पतरस के अतिरिक्त कोई और प्रेरित नहीं देखा, पर याकूब को भी देखा—बिना उसे अनिवार्य रूप से प्रेरितों में गिने।
  rationale: εἰ μὴ सामान्यतः पहले नकारात्मक कथन का अपवाद प्रस्तुत करता है। फिर भी वर्गीकरण संबंधी संभावित अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
