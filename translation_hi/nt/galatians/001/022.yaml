review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents δέ (“पर”), the Judean churches, and ἐν Χριστῷ (“मसीह में”). However, “कलीसियाओं के लिए ... अपरिचित” is not the natural Hindi construal of the Greek passive with a dative recipient. “कलीसियाओं को ... ज्ञात नहीं था” faithfully retains the sense that Paul was not personally recognized/known by those churches.
  naturalness: 'The main sentence needs a small idiomatic correction: “के लिए अपरिचित” is awkward and can suggest that the churches themselves were unfamiliar to Paul. “कलीसियाओं को व्यक्तिगत रूप से ज्ञात नहीं था” is clear, dignified modern Hindi. Footnote a should not say merely that they had not seen him, since the Greek concerns personal recognition/acquaintance rather than necessarily no visual encounter.'
  terminology: “कलीसियाओं,” “यहूदिया,” and “मसीह में” are suitable. The existing second footnote is not a genuine lexical alternative to the Hindi main text and narrows the phrase interpretively; it should instead give the title-form alternative “ख्रीस्त में,” corresponding to the English audit trail’s “in Christ.”
  issues:
  - severity: medium
    issue: “कलीसियाओं के लिए ... अपरिचित” reverses/obscures the intended relationship in Hindi.
    rationale: The Greek means that Paul was unknown to the churches, not that the churches were unknown or unfamiliar to him. “कलीसियाओं को ... ज्ञात नहीं था” expresses the passive sense idiomatically.
  - severity: medium
    issue: Footnote a says “जिन्होंने मुझे देखा नहीं था.”
    rationale: This can imply that the churches had never seen Paul at all. The source idiom permits the more precise sense of not knowing or recognizing him personally/by sight.
  - severity: low
    issue: Footnote b gives an interpretive paraphrase rather than the documented lexical/title alternative.
    rationale: “मसीह से जुड़ी हुई” may be a possible explanatory gloss, but it does not function as the corresponding alternative rendering. “ख्रीस्त में” preserves the alternative title form without narrowing the phrase.
  revised_text: पर मैं यहूदिया की उन कलीसियाओं को व्यक्तिगत रूप से ज्ञात नहीं था, जो मसीह में हैं।[a][b]
  revised_footnotes:
