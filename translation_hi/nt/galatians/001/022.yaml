- from: पर मैं यहूदिया की उन कलीसियाओं के लिए, जो मसीह में हैं, व्यक्तिगत रूप से अपरिचित था।[a][b]
  to: पर मैं यहूदिया की उन कलीसियाओं को व्यक्तिगत रूप से ज्ञात नहीं था, जो मसीह में हैं।[a][b]
  rationale: The revision preserves the Greek word order and ambiguity while making the recipient relationship clear in idiomatic Hindi. It retains “मसीह में” in the main text, in line with the project’s titular rendering of Χριστός, and replaces both footnotes with accurate alternatives.
