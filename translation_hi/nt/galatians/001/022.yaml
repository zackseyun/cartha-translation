lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध या विषयांतर दिखाता है; आधुनिक हिन्दी में “पर” इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγνοούμενος τῷ προσώπῳ
  choice: व्यक्तिगत रूप से अपरिचित
  rationale: यह यूनानी मुहावरा चेहरे से पहचान या प्रत्यक्ष व्यक्तिगत परिचय न होने को दर्शाता है; यह चयन अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκκλησίαις
  choice: कलीसियाओं
  rationale: पौलुस के संदर्भ में यह मसीही समुदायों को सूचित करता है; “कलीसिया” हिन्दी बाइबलीय प्रयोग में प्रचलित और स्पष्ट है।
- source_word: Ἰουδαίας
  choice: यहूदिया
  rationale: यह भौगोलिक नाम का प्रचलित हिन्दी रूप है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός का पदवीगत अर्थ “अभिषिक्त जन/मसीह” यहाँ सुनाई देता है, और ἐν का संबंधपरक भाव बनाए रखा गया है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यह वाक्यांश समुदायों को अभिषिक्त जन से उनके संबंध के आधार पर पहचानता है; “मसीह” पदवीगत अर्थ को स्पष्ट और पारंपरिक हिन्दी में सुरक्षित रखता है।
- issue: “मसीह में” के संबंध का अर्थ
  choice: शाब्दिक संबंधपरक वाक्यांश को बनाए रखना
  alternative: मसीह से जुड़ी हुई
  rationale: “में” पौलुस के वाक्यांश की वास्तविक व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखता है तथा उसका अर्थ केवल संस्थागत संबद्धता तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। यूनानी वाक्य का केंद्र पौलुस की व्यक्तिगत अपरिचितता पर है; इसलिए अस्वाभाविक शब्दशः “चेहरे से अपरिचित” के स्थान पर मुख्य पाठ में “व्यक्तिगत रूप से अपरिचित” रखा गया और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
