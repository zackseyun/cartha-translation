id: GAL.1.1
reference: Galatians 1:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παῦλος ἀπόστολος, οὐκ ἀπ’ ἀνθρώπων οὐδὲ δι’ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/001.yaml
  text: Paul[a], an apostle—not from men nor through a man, but through Jesus the Messiah and God the Father, who raised him from the dead,
translation:
  language: hi
  text: पौलुस, एक प्रेरित—न मनुष्यों की ओर से, न किसी मनुष्य के द्वारा, बल्कि यीशु मसीह और परमेश्वर पिता के द्वारा, जिसने उसे मरे हुओं में से जिलाया—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यह पौलुस की नियुक्ति और अधिकार का मान्य पदनाम है; ‘संदेशवाहक’ की अपेक्षा ‘प्रेरित’ इसके औपचारिक और धार्मिक महत्व को सुरक्षित रखता है।
- source_word: ἀπ’ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: ἀπό स्रोत या उद्गम बताता है। यह बहुवचन को बनाए रखता है और आगे आने वाले एकवचन ‘किसी मनुष्य’ के साथ अलंकारिक विरोध स्पष्ट करता है।
- source_word: δι’ ἀνθρώπου
  choice: किसी मनुष्य के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम या अभिकरण व्यक्त करता है। यह यूनानी के एकवचन और अनिश्चित भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: दोहराया गया διά मानवीय माध्यम के निषेध के विपरीत पौलुस की प्रेरिताई के वास्तविक अभिकरण को बताता है। ‘मसीह’ Χριστός की पदवी का अर्थ सुरक्षित रखता है।
- source_word: θεοῦ πατρὸς
  choice: परमेश्वर पिता
  rationale: यह संयुक्त पदवी का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है तथा यीशु मसीह के साथ समन्वित दिव्य अभिकरण को बनाए रखता है।
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: जिन्होंने उसे मरे हुओं में से जिलाया
  rationale: कृदन्त पद ‘परमेश्वर पिता’ को विशेषित करता है। ‘मरे हुओं में से जिलाया’ पुनरुत्थान के दावे और ἐκ νεκρῶν की सामूहिक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीष्ट
  rationale: यहाँ Χριστός में पदवी का अर्थ सक्रिय है; इसलिए ‘मसीह’ अर्थ को अधिक स्पष्टता से सुरक्षित रखता है, जबकि ‘ख्रीष्ट’ ध्वन्यात्मक रूप है।
- issue: पौलुस की प्रेरिताई का स्रोत और माध्यम
  choice: मनुष्यों की ओर से नहीं, न किसी मनुष्य के द्वारा, बल्कि यीशु मसीह और परमेश्वर पिता के द्वारा
  alternative: लोगों से नहीं और न मनुष्य के माध्यम से
  rationale: चुना हुआ रूप बहुवचन ἀνθρώπων और एकवचन ἀνθρώπου के जानबूझकर रखे गए विरोध तथा διά की अभिकरण-संबंधी भूमिका को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद की आरंभिक पत्रात्मक संरचना के कारण ‘पौलुस की ओर से’ जोड़ा गया है; डैश मूल वाक्य के प्रबल विरोध को बनाए रखते हैं। ‘जिन्होंने’ परमेश्वर पिता के लिए आदरसूचक क्रिया-सामंजस्य है।
