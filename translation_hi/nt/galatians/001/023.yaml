  text: μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/023.yaml
  text: They were only hearing[a], “The one who formerly persecuted us now proclaims the faith he once tried to destroy.”
translation:
  language: hi
  text: वे केवल यह सुनते रहते थे, “जो पहले हमें सताता था, वही अब उस विश्वास का प्रचार कर रहा है, जिसे वह कभी नष्ट करता था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: केवल
  rationale: 'यह उनकी जानकारी की सीमा बताता है: वे पौलुस के विषय में केवल यही समाचार सुनते थे।'
- source_word: ἀκούοντες ἦσαν
  choice: सुनते रहते थे
  rationale: परिभाषात्मक अपूर्णकाल लगातार या बार-बार यह समाचार सुनने का भाव देता है।
- source_word: ὁ διώκων ἡμᾶς ποτε
  choice: जो पहले हमें सताता था
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त और ποτέ पौलुस की पूर्व गतिविधि से उसकी पहचान कराते हैं।
- source_word: νῦν εὐαγγελίζεται
  choice: अब ... सुसमाचार सुना रहा है
  rationale: क्रिया सुसमाचार की सार्वजनिक घोषणा को व्यक्त करती है; यह हिंदी में स्वाभाविक और अर्थपूर्ण है।
- source_word: τὴν πίστιν
  choice: उस विश्वास
  rationale: सप्रत्यय πίστις यहाँ मुख्यतः मसीही विश्वास—अर्थात विश्वास किए जाने वाले संदेश—की ओर संकेत करता है, यद्यपि हिंदी में 'विश्वास' मूल शब्द की अर्थगत व्यापकता बनाए रखता है।
- source_word: ἣν ποτε ἐπόρθει
  choice: जिसे वह कभी नष्ट करने की कोशिश करता था
  rationale: πορθέω उजाड़ने या नष्ट करने का प्रबल भाव रखता है; यह रूप उसके विनाशकारी अभियान और उद्देश्य को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: τὴν πίστιν का अर्थ
  choice: '''विश्वास'' से मसीही विश्वास अथवा वह संदेश अभिप्रेत है जिसकी पौलुस अब घोषणा करता है'
  alternative: '''विश्वास'' को व्यक्तिगत विश्वास करने की क्रिया मानना; अथवा सीधे ''सुसमाचार'' अनुवाद करना'
  rationale: संदर्भ में पौलुस की पहले की सताहट और अब की घोषणा के बीच विरोध है। निश्चित उपपद वस्तुगत अर्थ—स्वीकार किए जाने वाले मसीही संदेश/विश्वास—का समर्थन करता है, पर मूल शब्द 'विश्वास' रखने से वास्तविक अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली। 'सताता था' धार्मिक उत्पीड़न के भाव को स्पष्ट रखता है। 'सुसमाचार सुना रहा है' εὐαγγελίζεται की सुसमाचार-संबंधी शक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी असामान्य वाक्यांश और वैकल्पिक सहज अनुवाद स्पष्ट करती है।
