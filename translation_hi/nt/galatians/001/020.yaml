lexical_decisions:
- source_word: ἃ
  choice: जो कुछ
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम यहाँ लिखी जा रही बातों को समष्टि रूप में बताता है; ‘जो कुछ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ तीव्र विरोध नहीं, बल्कि हल्का कथन-संक्रमण है; ‘और’ संदर्भ से संबंध बनाए रखता है।
- source_word: γράφω ὑμῖν
  choice: मैं तुम्हें लिख रहा हूँ
  rationale: वर्तमानकालीन पत्र-लेखन और उसके प्राप्तकर्ताओं—दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला बलात्मक अव्यय है; ‘देखो’ उसका प्रत्यक्ष और सामान्य हिन्दी समतुल्य है।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति और उनके प्रति उत्तरदायित्व का आह्वान करने वाली गंभीर अभिव्यक्ति है।
- source_word: ὅτι οὐ ψεύδομαι
  choice: मैं कहता हूँ कि मैं झूठ नहीं बोल रहा
  rationale: ὅτι गंभीर घोषणा की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘मैं कहता हूँ कि’ जोड़ने से ‘परमेश्वर के सामने’ वाली अपूर्ण संरचना स्वाभाविक बनती है, जबकि मूल दावे का अर्थ नहीं बढ़ाया जाता।
theological_decisions:
- issue: परमेश्वर को साक्षी मानने वाले कथन का बल
  choice: ‘परमेश्वर के सामने मैं कहता हूँ कि मैं झूठ नहीं बोल रहा’
  alternative: इसे केवल सामान्य बलाघात मानना, जिसमें परमेश्वर के प्रति उत्तरदायित्व का भाव मंद हो जाए
  rationale: ἐνώπιον τοῦ θεοῦ पौलुस के सत्य-दावे को गंभीर बनाता है और परमेश्वर के सामने उसकी जवाबदेही दर्शाता है; फिर भी अनुवाद इसे मूल में स्पष्ट रूप से न दी गई औपचारिक शपथ नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तुम्हें’ बहुवचन पत्र-प्राप्तकर्ताओं के लिए प्रयुक्त है। डैश और ‘देखो’ मूल कथन के अचानक, गंभीर बल को बनाए रखते हैं।
