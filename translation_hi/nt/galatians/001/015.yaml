base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/015.yaml
  text: But when the one who set me apart from my mother’s womb and called me through his grace was pleased[a]
translation:
  language: hi
  text: परन्तु जब उस परमेश्वर को, जिसने मुझे मेरी माँ के गर्भ से ही अलग किया[a] और अपने अनुग्रह से बुलाया, यह अच्छा लगा—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जन्म से ही”; यिर्मयाह 1:5 और यशायाह 49:1 में भविष्यद्वक्ता के बुलावे की भाषा से तुलना करें।
    reason: ‘माँ के गर्भ से’ के लिए एक मुहावरेदार वैकल्पिक अनुवाद देता है और संबंधित भविष्यद्वक्ताई बुलाहट की भाषा का संकेत करता है।
lexical_decisions:
- source_word: ὅτε δὲ
  choice: परन्तु जब
  rationale: ὅτε के काल-संबंधी अर्थ और δέ के हल्के विरोध अथवा प्रसंगगत मोड़—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εὐδόκησεν
  choice: यह अच्छा लगा
  rationale: दैवी प्रसन्नता और स्वतंत्र इच्छा के भाव को बनाए रखता है; इसे केवल ‘निर्णय किया’ कहकर सीमित नहीं करता।
- source_word: ὁ ἀφορίσας με
  choice: जिसने मुझे ... अलग कर रखा था
  rationale: कर्ता को परमेश्वर के रूप में स्पष्ट करते हुए ἀφορίζω के ‘अलग ठहराने’ के भाव को रखता है और चुनाव या नियुक्ति की अधिक विशिष्ट धर्मवैज्ञानिक धारणा आरोपित नहीं करता।
- source_word: ἐκ κοιλίας μητρός μου
  choice: मेरी माँ के गर्भ से ही
  rationale: मूल का ठोस गर्भ-बिंब और भविष्यद्वक्ताओं के बुलावे से जुड़ी बाइबलीय अभिव्यक्ति सुरक्षित रहती है।
- source_word: καλέσας
  choice: बुलाया था
  rationale: दैवी बुलाहट के सामान्य पौलुसी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके स्वरूप को अनावश्यक रूप से सीमित किए।
- source_word: διὰ τῆς χάριτος αὐτοῦ
  choice: अपने अनुग्रह के द्वारा
  rationale: διά सहित संबंधकारक की माध्यमसूचक शक्ति को दर्शाता है और अनुग्रह को बुलाने का माध्यम बनाए रखता है।
theological_decisions:
- issue: ἀφορίσας में चुनाव, पूर्वनियति या सेवकाई के लिए अलग किए जाने का अर्थ कितना स्पष्ट किया जाए
  choice: अलग कर रखा था
  alternative: चुन लिया था / नियुक्त किया था
  rationale: मूल पाठ परमेश्वर द्वारा पौलुस को अलग किए जाने की बात करता है और भविष्यद्वक्ताई बुलाहट की भाषा की ओर संकेत करता है, पर किसी व्यवस्थित पूर्वनियति-सिद्धान्त को स्पष्ट रूप से नहीं बाँधता।
- issue: ἐκ κοιλίας μητρός μου को जन्म से या जन्म से पहले समझना
  choice: माँ के गर्भ से ही
  alternative: जन्म से ही / मेरे जन्म से पहले
  rationale: शाब्दिक बिंब को सुरक्षित रखकर समय-संबंधी वास्तविक अस्पष्टता को मुख्य पाठ में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यह पद अगले पद में पूरा होने वाले वाक्य का आश्रित खंड है, इसलिए अंत में दीर्घ विराम-चिह्न लगाया गया है। ‘परमेश्वर’ को स्पष्ट किया गया है क्योंकि पिछले संदर्भ में वही कर्ता है और हिन्दी में केवल ‘उसको’ कहना असहज तथा अस्पष्ट होता।
