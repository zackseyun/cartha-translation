  edition: SBLGNT
  text: Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/006.yaml
  text: I am astonished that you are so quickly deserting the one who called you in the grace of Messiah for a different gospel[c][b][a],
translation:
  language: hi
  text: मुझे अचम्भा होता है कि जिसने तुम्हें मसीह[b] के अनुग्रह[a] में बुलाया, उससे तुम इतनी जल्दी फिरकर एक भिन्न सुसमाचार की ओर[c] जा रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह के अनुग्रह के द्वारा।” यूनानी पूर्वसर्ग का अर्थ किसी क्षेत्र में होना या किसी साधन के द्वारा होना—दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “ख्रीस्तोस”; यहाँ इसका अनुवाद “मसीह” किया गया है, क्योंकि यह शब्द उपाधि के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: या, “दूसरे सुसमाचार की ओर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θαυμάζω
  choice: मुझे अचम्भा होता है
  rationale: यह पौलुस के आश्चर्य और व्यथित असहमति, दोनों को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὕτως ταχέως
  choice: इतनी जल्दी
  rationale: यह पदबंध परिवर्तन की चौंकाने वाली शीघ्रता पर मूल बल को बनाए रखता है।
- source_word: μετατίθεσθε
  choice: उससे ... फिरकर ... जा रहे हो
  rationale: मध्य/निष्क्रिय रूप यहाँ चल रहे विचलन या दलबदल को सूचित करता है; यह अनुवाद केवल विचार बदलने के बजाय बुलाने वाले व्यक्ति से विमुख होने की संबंधपरक शक्ति बनाए रखता है।
- source_word: τοῦ καλέσαντος ὑμᾶς
  choice: जिसने तुम्हें ... बुलाया
  rationale: कर्ता को ‘परमेश्वर’ या ‘मसीह’ कहकर स्पष्ट किए बिना यूनानी पाठ की अंतर्निहित अभिव्यक्ति और पूर्व बुलाहट को सुरक्षित रखता है।
- source_word: ἐν χάριτι Χριστοῦ
  choice: मसीह के अनुग्रह में
  rationale: ἐν के क्षेत्रवाचक अर्थ और Χριστοῦ के संबंध को पारदर्शी रूप से रखता है; साधनवाचक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός की उपाधिगत अर्थवत्ता को हिन्दी के प्रचलित बाइबलीय पद ‘मसीह’ से व्यक्त किया गया है।
- source_word: εἰς ἕτερον εὐαγγέλιον
  choice: एक भिन्न सुसमाचार की ओर
  rationale: ‘भिन्न’ ἕτερον में निहित गुणात्मक भेद को बनाए रखता है, और ‘की ओर’ εἰς की दिशात्मकता को स्पष्ट करता है।
theological_decisions:
- issue: ‘जिसने तुम्हें बुलाया’ में बुलाने वाले की पहचान
  choice: मुख्य पाठ में कर्ता को अनिर्दिष्ट रखा गया
  alternative: ‘परमेश्वर, जिसने तुम्हें बुलाया’ अथवा ‘मसीह, जिसने तुम्हें बुलाया’
  rationale: तात्कालिक यूनानी पाठ कर्ता का नाम नहीं बताता; उसे जोड़ना पाठ में निहित धार्मिक तनाव को अनावश्यक रूप से सुलझा देता।
- issue: ἐν χάριτι Χριστοῦ में ἐν का अर्थ
  choice: ‘मसीह के अनुग्रह में’
  alternative: ‘मसीह के अनुग्रह के द्वारा’
  rationale: मुख्य पाठ में क्षेत्रवाचक अर्थ को रखा गया है, पर साधनवाचक अर्थ भी व्याकरणतः संभव है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘अचम्भा’ पौलुस की व्यथित चकितता व्यक्त करता है; ‘फिरकर ... जा रहे हो’ जारी दलबदल को स्वाभाविक हिन्दी में सामने लाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
