lexical_decisions:
- source_word: Ἔπειτα
  choice: फिर
  rationale: यह पौलुस के वृत्तांत में अगली घटना को स्वाभाविक और स्पष्ट ढंग से जोड़ता है।
- source_word: μετὰ ἔτη τρία
  choice: तीन वर्ष बाद
  rationale: यूनानी कालवाचक पदबंध का सहज आधुनिक हिन्दी रूप है और समयांतराल को यथावत रखता है।
- source_word: ἀνῆλθον
  choice: गया
  rationale: यरूशलेम की यात्रा के लिए यूनानी में प्रयुक्त ‘ऊपर जाना’ सामान्य भौगोलिक और पारंपरिक अभिव्यक्ति है; हिन्दी में ‘यरूशलेम गया’ अधिक स्वाभाविक है, जबकि ‘ऊपर गया’ भ्रामक हो सकता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी में प्रचलित मानक रूप।
- source_word: ἱστορῆσαι
  choice: से भेंट करने
  rationale: क्रिया व्यक्तिगत रूप से मिलने या परिचय प्राप्त करने का भाव रख सकती है। ‘भेंट करने’ मुख्य पाठ में स्वाभाविक है, जबकि व्यापक अर्थ-संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: Κηφᾶν
  choice: कैफा
  rationale: पौलुस ने यहाँ अरामी नाम का यूनानी रूप Κηφᾶς प्रयोग किया है; उसे ‘पतरस’ से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: ἐπέμεινα πρὸς αὐτὸν
  choice: उसके साथ ... रहा
  rationale: यह कैफा के साथ निरंतर ठहरने को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡμέρας δεκαπέντε
  choice: पंद्रह दिन
  rationale: समयावधि बताने वाले यूनानी कर्मकारक का स्पष्ट और स्वाभाविक हिन्दी रूप।
