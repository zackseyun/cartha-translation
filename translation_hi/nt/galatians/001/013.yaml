lexical_decisions:
- source_word: ἀναστροφήν ποτε
  choice: मेरे पहले के जीवन
  rationale: ἀναστροφή जीवन-व्यवहार या रहन-सहन की व्यापक रीति को दर्शाता है, और ποτε उसके पूर्वकालीन होने को बताता है। यह वाक्यांश आधुनिक हिन्दी में स्वाभाविक रूप से दोनों अर्थ व्यक्त करता है।
- source_word: Ἰουδαϊσμῷ
  choice: यहूदी धर्म में
  rationale: यह शब्द यहाँ पौलुस की पूर्व यहूदी धार्मिक पहचान और जीवन-पद्धति को सूचित करता है। ‘यहूदी धर्म’ इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: καθ’ ὑπερβολὴν
  choice: हद से बढ़कर
  rationale: यह पदबंध उत्पीड़न की असाधारण तीव्रता और सीमा को उभारता है; ‘हद से बढ़कर’ सामान्य पाठक के लिए बोधगम्य रहते हुए उसका बल बनाए रखता है।
- source_word: ἐδίωκον
  choice: सताता था
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार होने वाली पूर्वकालीन क्रिया व्यक्त करता है। ‘सताता था’ हिन्दी में इस पक्ष को स्वाभाविक ढंग से दर्शाता है।
- source_word: ἐκκλησίαν τοῦ θεοῦ
  choice: परमेश्वर की कलीसिया
  rationale: यहाँ ἐκκλησία मसीह में विश्वास करने वाले पहचाने जा सकने वाले समुदाय को दर्शाता है। हिन्दी बाइबलीय प्रयोग में ‘कलीसिया’ इस अर्थ का स्थापित और संक्षिप्त रूप है।
- source_word: ἐπόρθουν
  choice: उसे उजाड़ने में लगा था
  rationale: क्रिया हिंसक विनाश या बरबादी का प्रबल भाव रखती है। अपूर्ण भूतकाल वास्तविक विनाश और विनाश के सतत प्रयास के बीच कुछ खुलापन छोड़ता है; यह रूप उसी तनाव को सुरक्षित रखता है।
theological_decisions:
- issue: ἐκκλησία का अनुवाद ‘कलीसिया’ या ‘सभा’
  choice: परमेश्वर की कलीसिया
  alternative: परमेश्वर की सभा
  rationale: संदर्भ में यह मसीह-अनुयायी समुदाय है। ‘कलीसिया’ आधुनिक हिन्दी बाइबलीय भाषा में इस विशिष्ट समुदाय को स्पष्ट करता है, जबकि ‘सभा’ केवल किसी एकत्रीकरण का अर्थ भी दे सकती है।
- issue: ἐπόρθουν को संपन्न विनाश या विनाश के प्रयास के रूप में व्यक्त करना
  choice: उसे उजाड़ने में लगा था
  alternative: उसे नष्ट कर रहा था / उसे नष्ट करने की कोशिश करता था
  rationale: मूल क्रिया अत्यंत प्रबल है, पर अपूर्ण भूतकाल जारी गतिविधि को उभारता है और यह अनिवार्य नहीं करता कि विनाश पूरा हो गया था। चुना हुआ रूप इस अर्थगत तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘क्योंकि’ γάρ के तर्क-संबंध को, ‘सताता था’ और ‘लगा था’ अपूर्ण भूतकाल की निरंतरता को व्यक्त करते हैं। ‘कलीसिया’ स्थापित बाइबलीय पद है; शेष वाक्य में अनावश्यक धर्मशास्त्रीय व्याख्या नहीं जोड़ी गई।
