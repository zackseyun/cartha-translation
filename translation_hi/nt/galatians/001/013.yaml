  text: क्योंकि तुमने यहूदी धर्म में मेरे पहले के जीवन के बारे में सुना है[a][b], कि मैं परमेश्वर की कलीसिया को हद से बढ़कर सताता था[c] और उसे उजाड़ता था[d]।
  philosophy: optimal-equivalence
  footnotes:
