  edition: SBLGNT
  text: ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/007.yaml
  text: which is not another gospel[b][a]; except that there are some who are troubling you and wanting to distort the gospel of Messiah.
translation:
  language: hi
  text: जो कोई दूसरा सुसमाचार है ही नहीं। बात बस इतनी है कि कुछ लोग आपको उलझन में डाल रहे हैं और मसीह के सुसमाचार को बिगाड़ना चाहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλο
  choice: दूसरा सुसमाचार
  rationale: ἄλλο के साथ संज्ञा व्यक्त नहीं है, पर पिछले पद से ‘सुसमाचार’ स्पष्ट रूप से समझा जाता है; हिंदी में उसे दोहराने से अर्थ सहज और स्पष्ट रहता है।
- source_word: εἰ μή
  choice: बात बस इतनी है कि
  rationale: यहाँ εἰ μή कोई कठोर शर्त नहीं, बल्कि पिछले कथन को स्पष्ट करने वाला अपवाद प्रस्तुत करता है; यह हिंदी अभिव्यक्ति उसी व्याख्यात्मक मोड़ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ταράσσοντες
  choice: उलझन में डाल रहे हैं
  rationale: क्रिया मानसिक अशांति और भ्रम उत्पन्न करने का भाव रखती है; यह चयन आधुनिक हिंदी में उस प्रभाव को स्पष्ट करता है।
- source_word: θέλοντες
  choice: चाहते हैं
  rationale: यह उनके उद्देश्य या अभिप्राय को सरल और स्वाभाविक हिंदी में व्यक्त करता है, बिना उनकी इच्छा की तीव्रता बढ़ाए।
- source_word: μεταστρέψαι
  choice: बिगाड़ देना
  rationale: क्रिया किसी चीज़ को पलटकर विकृत या भ्रष्ट रूप देने का संकेत करती है; ‘बिगाड़ देना’ साधारण पाठक के लिए सुबोध है और नकारात्मक बल बनाए रखता है।
- source_word: εὐαγγέλιον
  choice: सुसमाचार
  rationale: पौलुस के संदर्भ में यह स्थापित, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिंदी धार्मिक शब्द है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की मसीही पदवी को बनाए रखता है; ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में स्वाभाविक और परिचित है।
theological_decisions:
- issue: τοῦ Χριστοῦ में संबंध का प्रकार
  choice: मसीह का सुसमाचार
  alternative: मसीह के विषय का सुसमाचार
  rationale: यूनानी संबंधकारक स्वामित्व, स्रोत या विषय में से एक से अधिक संबंध सुझा सकता है। संक्षिप्त ‘मसीह का सुसमाचार’ इस वास्तविक अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
- issue: Χριστοῦ को पदवी या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: क्राइस्ट
  rationale: इस वाक्यांश में मसीही पदवी का भाव सक्रिय रह सकता है; ‘मसीह’ हिंदी में अर्थपूर्ण तथा स्थापित रूप है और किसी संप्रदायगत व्याख्या को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य से जुड़ा है, फिर भी उपलब्ध अकेले पद के रूप में पठनीय बनाने के लिए आरंभ में ‘जो’ रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
