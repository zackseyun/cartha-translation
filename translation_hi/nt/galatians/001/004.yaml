source:
  edition: SBLGNT
  text: τοῦ δόντος ἑαυτὸν ⸀ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ ⸂αἰῶνος τοῦ ἐνεστῶτος⸃ πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/004.yaml
  text: who gave himself for our sins so that he might rescue us from the present evil age[a], according to the will of our God and Father,
translation:
  language: hi
  text: जिसने हमारे पापों के लिए अपने आप को दे दिया, ताकि वह हमें इस वर्तमान बुरे युग[a] से छुड़ाए—हमारे परमेश्वर और पिता की इच्छा के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस वर्तमान बुरे संसार से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δόντος ἑαυτόν
  choice: अपने आप को दे दिया
  rationale: यह स्वेच्छा से स्वयं को अर्पित करने का भाव स्वाभाविक हिन्दी में बनाए रखता है; ‘सौंप दिया’ यहाँ अनावश्यक रूप से बाहरी हस्तांतरण का संकेत दे सकता है।
- source_word: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν
  choice: हमारे पापों के लिए
  rationale: ‘के लिए’ बलिदानात्मक और प्रतिनिधिक संबंध को व्यक्त करता है, पर प्रायश्चित की किसी विशिष्ट व्याख्या को पाठ में नहीं जोड़ता।
- source_word: ἐξέληται
  choice: छुड़ाए
  rationale: यह किसी नियंत्रित या संकटपूर्ण दशा से बाहर निकालने का अर्थ स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: αἰῶνος τοῦ ἐνεστῶτος πονηροῦ
  choice: इस वर्तमान बुरे युग
  rationale: αἰών मूलतः कालगत-सांसारिक ‘युग’ को दर्शाता है; ‘संसार’ कहने से स्थानगत अर्थ अधिक उभर सकता है। ‘इस वर्तमान’ यूनानी निश्चित पदबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὸ θέλημα
  choice: की इच्छा के अनुसार
  rationale: यह परमेश्वर के उद्देश्य के अनुरूप होने का भाव सटीक और स्वाभाविक ढंग से रखता है।
- source_word: τοῦ θεοῦ καὶ πατρὸς ἡμῶν
  choice: हमारे परमेश्वर और पिता
  rationale: यह एक ही व्यक्ति को ‘परमेश्वर’ और ‘पिता’ दोनों रूपों में प्रस्तुत करने वाली यूनानी रचना को स्पष्ट रखता है।
theological_decisions:
- issue: ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν में प्रायश्चित के अर्थ को कितना विशिष्ट बनाया जाए
  choice: हमारे पापों के लिए
  alternative: हमारे पापों के कारण; हमारे पापों की ओर से
  rationale: चुना हुआ रूप उद्धारकारी और बलिदानात्मक संबंध को बनाए रखता है, लेकिन प्रायश्चित के किसी पूर्ण सिद्धांत को आरोपित नहीं करता।
- issue: αἰών का अनुवाद ‘युग’ किया जाए या ‘संसार’
  choice: इस वर्तमान बुरे युग
  alternative: इस वर्तमान बुरे संसार
  rationale: पौलुस का शब्द मुख्यतः कालगत-सांसारिक व्यवस्था की ओर संकेत करता है; ‘युग’ मूल अर्थ को अधिक ठीक रखता है, जबकि वैकल्पिक पारंपरिक अभिव्यक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘छुड़ाए’ सामान्य पाठक के लिए स्पष्ट है और उद्धार का सक्रिय भाव रखता है। मुख्य पाठ में ‘युग’ स्रोत-सापेक्ष सटीकता के लिए रखा गया है; ‘संसार’ को वैकल्पिक पाठ के रूप में पादटिप्पणी में दिया गया है।
