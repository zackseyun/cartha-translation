lexical_decisions:
- source_word: ᾧ
  choice: उसी की
  rationale: सम्बन्धवाचक सर्वनाम निकटतम पूर्ववर्ती पद ‘हमारे परमेश्वर और पिता’ की ओर संकेत करता है। हिन्दी की स्वाभाविक स्तुतिपरक अभिव्यक्ति में ‘उसी की’ यह सम्बन्ध स्पष्ट रखता है।
- source_word: δόξα
  choice: महिमा
  rationale: स्तुतिगान के सन्दर्भ में ‘महिमा’ प्रचलित, गरिमापूर्ण और अर्थ की व्यापकता बनाए रखने वाला समतुल्य शब्द है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनन्त अवधि व्यक्त करने वाला यूनानी मुहावरा है; ‘युगानुयुग’ आधुनिक हिन्दी में संक्षिप्त, परिचित और स्तुतिपरक शैली के अनुकूल है।
- source_word: ἀμήν
  choice: आमीन
  rationale: यह गम्भीर पुष्टि व्यक्त करने वाला पारम्परिक बाइबलीय लिप्यन्तरण है और स्तुतिवचन का स्वाभाविक समापन करता है।
theological_decisions:
- issue: क्रियारहित यूनानी स्तुतिवाक्य में निहित क्रियार्थ
  choice: महिमा ... होती रहे
  alternative: महिमा ... है / महिमा ... हो
  rationale: मूल यूनानी में कोई स्पष्ट क्रिया नहीं है। ‘होती रहे’ हिन्दी में स्तुतिपरक कामना का स्वाभाविक भाव देता है, पर इसे स्वामित्व के केवल वर्णन के रूप में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘युगानुयुग’ स्तुतिपरक लय और अनन्तकाल के मुहावरेदार अर्थ दोनों को बनाए रखता है।
