source:
  edition: SBLGNT
  text: οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, ⸀οὔτε ἐδιδάχθην, ἀλλὰ δι’ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/012.yaml
  text: For I neither received it from a human source[a], nor was I taught it, but through a revelation of Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि न तो मैंने उसे किसी मनुष्य से प्राप्त किया, न ही मुझे वह सिखाया गया, बल्कि वह मुझे यीशु मसीह के प्रकाशन[a] के द्वारा मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यीशु मसीह से प्राप्त प्रकाशन; अथवा, यीशु मसीह के विषय में प्रकाशन।
    reason: यूनानी सम्बन्धकारक का अर्थ स्रोत/कर्ता अथवा विषय, दोनों हो सकता है।
lexical_decisions:
- source_word: παρὰ ἀνθρώπου
  choice: किसी मनुष्य से
  rationale: एकवचन ἀνθρώπου यहाँ सामान्य अर्थ में है। यह वाक्यांश मानवीय माध्यम या स्रोत का निषेध करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παρέλαβον
  choice: पाया
  rationale: यहाँ क्रिया परंपरा या संदेश को ग्रहण करने के अर्थ में है। 'पाया' सहज हिन्दी में उस प्राप्ति को व्यक्त करता है; अंतिम खंड में 'मिला' जोड़कर निहित सुसमाचार के साथ वाक्य-संबंध स्पष्ट किया गया है।
- source_word: ἐδιδάχθην
  choice: मुझे वह सिखाया गया
  rationale: कर्मवाच्य रूप को बनाए रखते हुए यह स्पष्ट करता है कि पौलुस को वह संदेश किसी शिक्षक से शिक्षा के रूप में नहीं मिला।
- source_word: δι’ ἀποκαλύψεως
  choice: प्रकाशन के द्वारा
  rationale: διά साधन को व्यक्त करता है। 'प्रकाशन' दैवी रूप से प्रकट किए जाने के अर्थ को dignified और प्रचलित बाइबलीय हिन्दी में रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के
  rationale: 'सम्बन्धकारक की मूल अस्पष्टता मुख्य पाठ में ''के'' से सुरक्षित रहती है: इसका अर्थ यीशु मसीह से प्राप्त प्रकाशन भी हो सकता है और उनके विषय में प्रकाशन भी। Χριστός को पदवी के रूप में ''मसीह'' किया गया है।'
theological_decisions:
- issue: ἀποκαλύψεως Ἰησοῦ Χριστοῦ में सम्बन्धकारक का अर्थ
  choice: मुख्य पाठ में अस्पष्ट 'यीशु मसीह के प्रकाशन'
  alternative: यीशु मसीह से मिला प्रकाशन; अथवा यीशु मसीह के विषय में प्रकाशन
  rationale: यूनानी सम्बन्धकारक स्रोत/कर्ता और विषय—दोनों अर्थ दे सकता है। मुख्य पाठ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता और पादटिप्पणी दोनों संभावनाएँ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। मूल के समानांतर निषेध और प्रकाशन के साथ उसका विरोध सुरक्षित रखा गया है।
