base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/003.yaml
  text: Grace to you and peace from God our Father and the Lord Jesus the Messiah,[a]
translation:
  language: hi
  text: तुम्हें हमारे पिता परमेश्वर और हमारे प्रभु यीशु मसीह की ओर से अनुग्रह और शांति मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: यह पौलुस के अभिवादन में प्रयुक्त मानक शब्द है और परमेश्वर की कृपा तथा उदार कृपादृष्टि—दोनों का धार्मिक भाव बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: आशीर्वचनात्मक वाक्य में दत्तिव का सहज और स्पष्ट हिन्दी रूप।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह यहूदी अभिवादन की पृष्ठभूमि और आत्मिक कल्याण की व्यापक धारणा, दोनों को सुरक्षित रखता है।
- source_word: ἀπὸ
  choice: की ओर से
  rationale: यहाँ पूर्वसर्ग स्रोत को दर्शाता है; हिन्दी अभिवादन में ‘की ओर से’ स्वाभाविक है।
- source_word: θεοῦ πατρὸς
  choice: हमारे पिता परमेश्वर
  rationale: यह पदबंध परमेश्वर को विश्वासियों के पिता के रूप में व्यक्त करता है और हिन्दी में स्वाभाविक संबंध बनाए रखता है।
- source_word: κυρίου ἡμῶν
  choice: हमारे प्रभु
  rationale: ‘प्रभु’ κύριος की मसीही उपाधि का स्थापित और अर्थपूर्ण हिन्दी रूप है; ‘हमारे’ संबंध को स्पष्ट करता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘मसीह’ Χριστός के अभिषिक्त उद्धारकर्ता संबंधी उपाधिगत अर्थ को सुरक्षित रखता है और हिन्दी बाइबिलीय प्रयोग में स्वाभाविक है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में अनूदित करना या नाम-सदृश पारंपरिक रूप रखना
  choice: यीशु मसीह
  alternative: यीशु, अभिषिक्त जन
  rationale: हिन्दी ‘मसीह’ स्वयं ‘अभिषिक्त’/‘मसीहा’ की उपाधि को व्यक्त करता है और साथ ही परिचित, गरिमापूर्ण बाइबिलीय भाषा बनाए रखता है; अंग्रेज़ी के ‘Messiah/Christ’ का भेद हिन्दी में इसी एक स्थापित शब्द में स्वाभाविक रूप से समाहित हो जाता है।
- issue: ἡμῶν का संबंध केवल ‘प्रभु’ से है या ‘पिता’ के साथ भी समझा जाए
  choice: हमारे पिता परमेश्वर और हमारे प्रभु
  alternative: पिता परमेश्वर और हमारे प्रभु
  rationale: पौलुस के समानांतर अभिवादनों और पदबंध के अर्थ के अनुरूप परमेश्वर को ‘हमारे पिता’ कहना उचित है; हिन्दी में ‘हमारे’ को दोनों संज्ञा-पदबंधों के साथ दोहराने से संबंध स्पष्ट और स्वाभाविक बनता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यूनानी नामवाचक अभिवादन को हिन्दी में पूर्ण आशीर्वचन ‘अनुग्रह और शांति मिले’ के रूप में रखा गया है। कोई पादटिप्पणी नहीं दी गई, क्योंकि अंग्रेज़ी ‘Messiah/Christ’ का विकल्प हिन्दी ‘मसीह’ में अलग रूपों की आवश्यकता नहीं पैदा करता।
