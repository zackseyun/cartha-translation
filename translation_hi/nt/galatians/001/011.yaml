  terminology: “सुसमाचार” is the established Hindi rendering for εὐαγγέλιον. “भाइयो और बहनो” communicates the likely inclusive addressees; the footnote responsibly records the masculine plural form. “मनुष्य के अनुसार नहीं” retains the formal semantic openness of κατὰ ἄνθρωπον, though its alternatives need explanation in the note.
