source:
  edition: SBLGNT
  text: Γνωρίζω ⸀γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/011.yaml
  text: For I make known to you[a], brothers[b], that the gospel proclaimed by me is not according to man.
translation:
  language: hi
  text: क्योंकि, भाइयो और बहनो,[a] मैं तुम्हें बताता हूँ कि जिस सुसमाचार का मैंने प्रचार किया है, वह मनुष्य के अनुसार नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में शाब्दिक रूप से “भाइयो”; यहाँ यह संबोधन पूरे विश्वासी-समुदाय को सम्मिलित करता है।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य के अनुसार नहीं” का अर्थ “मानवीय स्रोत से नहीं” या “मानवीय मानदंडों के अनुसार नहीं” भी हो सकता है। अगले पद में मानवीय स्रोत का अर्थ प्रमुख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Γνωρίζω γὰρ ὑμῖν
  choice: क्योंकि ... मैं तुम्हें बता दूँ
  rationale: Γνωρίζω ὑμῖν यहाँ महत्त्वपूर्ण बात स्पष्ट करने वाला कथन है; ‘मैं तुम्हें बता दूँ’ आधुनिक हिंदी में स्वाभाविक है, जबकि γὰρ का व्याख्यात्मक संबंध ‘क्योंकि’ से बना रहता है।
- source_word: ἀδελφοί
  choice: हे भाइयो और बहनो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है, पर पौलुस के सामुदायिक संबोधन में सामान्यतः पूरी विश्वास-समुदाय को सम्मिलित करता है। हिंदी में समावेशी आशय स्पष्ट किया गया है और शाब्दिक रूप टिप्पणी में रखा गया है।
- source_word: εὐαγγέλιον
  choice: सुसमाचार
  rationale: यह पौलुस के विशिष्ट धार्मिक प्रयोग के लिए हिंदी का मानक, संक्षिप्त और सुविज्ञ शब्द है।
- source_word: τὸ εὐαγγελισθὲν ὑπ’ ἐμοῦ
  choice: जिस सुसमाचार का प्रचार मैंने किया
  rationale: यह कर्मवाच्य कृदंत और कर्ता-सूचक ὑπ’ ἐμοῦ का अर्थ स्वाभाविक हिंदी में व्यक्त करता है तथा सार्वजनिक घोषणा का भाव बनाए रखता है।
- source_word: κατὰ ἄνθρωπον
  choice: मनुष्य के अनुसार
  rationale: यह निकट-औपचारिक अनुवाद यूनानी वाक्यांश की वास्तविक अर्थगत खुली संभावना—मानवीय स्रोत अथवा मानवीय मानदंड—को मुख्य पाठ में सुरक्षित रखता है।
theological_decisions:
- issue: κατὰ ἄνθρωπον में स्रोत और मानदंड के बीच अर्थगत संभावना
  choice: मनुष्य के अनुसार नहीं
  alternative: मनुष्य से उत्पन्न नहीं / मानवीय मानदंडों के अनुसार नहीं
  rationale: अगला पद मानवीय स्रोत का निषेध करता है, इसलिए स्रोत वाला अर्थ संदर्भ में प्रबल है; फिर भी यूनानी अभिव्यक्ति मानदंड का भाव भी दे सकती है। मुख्य पाठ अधिक खुला रखा गया है और दोनों संभावनाएँ टिप्पणी में स्पष्ट की गई हैं।
- issue: ἀδελφοί का सामुदायिक विस्तार
  choice: भाइयो और बहनो
  alternative: भाइयो
  rationale: संबोधन का संदर्भ पूरी गलाती विश्वासी-समुदाय है। समावेशी हिंदी आशय को स्पष्ट करती है, जबकि व्याकरणिक रूप टिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। ‘तुम्हें’ पौलुस के सामुदायिक संबोधन के अनुरूप है। मुख्य पाठ में κατὰ ἄνθρωπον की अस्पष्टता सुरक्षित रखी गई है।
