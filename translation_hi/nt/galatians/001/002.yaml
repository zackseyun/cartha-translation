lexical_decisions:
- source_word: καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί
  choice: और मेरे साथ के सभी भाइयों की ओर से
  rationale: καὶ पिछले पद में पौलुस के नाम से इस सह-प्रेषक वाक्यांश को जोड़ता है। ἀδελφοί व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ में “भाइयों” रखा गया है; यह स्त्री-पुरुष दोनों सहविश्वासियों को भी समाहित कर सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है। हिन्दी में पत्र के प्रेषकों की सूची को प्राप्तकर्ताओं से स्वाभाविक रूप से जोड़ने के लिए “की ओर से” जोड़ा गया है।
- source_word: ἐκκλησίαις
  choice: कलीसियाओं
  rationale: पौलुस के पत्र-संबोधन में ἐκκλησία के लिए “कलीसिया” प्रचलित, स्वाभाविक और समुदाय-सूचक हिन्दी शब्द है; बहुवचन को सुरक्षित रखा गया है।
- source_word: τῆς Γαλατίας
  choice: गलातिया की
  rationale: सम्बन्धकारक रचना को हिन्दी में सीधे “गलातिया की कलीसियाओं” के रूप में व्यक्त किया गया है, बिना यह तय किए कि आशय भौगोलिक क्षेत्र की कौन-सी सीमाओं से है।
