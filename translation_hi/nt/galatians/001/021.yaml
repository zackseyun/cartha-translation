lexical_decisions:
- source_word: ἔπειτα
  choice: इसके बाद
  rationale: पौलुस के वर्णन में घटनाओं का क्रम दिखाता है; आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἦλθον
  choice: मैं गया
  rationale: यूनानी क्रिया का मूल भाव ‘आया’ हो सकता है, पर यहाँ वक्ता के पिछले स्थान से आगे की यात्रा का वर्णन है; हिन्दी कथन में ‘गया’ स्वाभाविक है।
- source_word: εἰς
  choice: में
  rationale: प्रदेशों के भीतर पहुँचने की दिशात्मक गति को हिन्दी में ‘प्रदेशों में गया’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: κλίματα
  choice: प्रदेशों
  rationale: यह किसी एक नगर के बजाय भौगोलिक क्षेत्रों या इलाकों को सूचित करता है; ‘प्रदेश’ स्पष्ट, वर्तमान और गरिमापूर्ण है।
- source_word: Συρίας
  choice: सीरिया
  rationale: इस स्थान-नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: Κιλικίας
  choice: किलिकिया
  rationale: इस स्थान-नाम का प्रचलित आधुनिक हिन्दी रूप।
