source:
  edition: SBLGNT
  text: Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; ⸀εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/010.yaml
  text: For am I now persuading people[a], or God? Or am I seeking to please people? If I were still pleasing people[b], I would not be Messiah’s servant.
translation:
  language: hi
  text: तो क्या मैं अब लोगों को मना रहा हूँ, या परमेश्वर को?[a] या क्या मैं लोगों को प्रसन्न करने का प्रयत्न कर रहा हूँ? यदि मैं अब भी लोगों को प्रसन्न करता रहता, तो मैं मसीह का दास न होता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं अब लोगों की स्वीकृति चाहता हूँ या परमेश्वर की?”
    reason: lexical_alternative
  - marker: b
    text: या, “मसीह का सेवक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄρτι
  choice: अब
  rationale: यह पौलुस की वर्तमान स्थिति को पहले के जीवन-ढंग से अलग दिखाता है; ‘अब’ संक्षिप्त और स्वाभाविक है।
- source_word: πείθω
  choice: मनाने की कोशिश कर रहा हूँ
  rationale: क्रिया का मूल अर्थ ‘मनाना/राज़ी करना’ है। हिंदी में परमेश्वर को ‘मनाना’ असामान्य लगने पर भी यूनानी के जानबूझकर रखे गए अलंकारिक तनाव को बनाए रखता है; स्वीकृति वाला अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀνθρώπους
  choice: लोगों
  rationale: यहाँ आशय सामान्य रूप से मनुष्यों से है, केवल पुरुषों से नहीं; आधुनिक हिंदी में ‘लोगों’ स्वाभाविक और अर्थ-सटीक है।
- source_word: θεόν
  choice: परमेश्वर
  rationale: यह हिंदी बाइबल शैली में θεός का प्रतिष्ठित, स्पष्ट और गरिमापूर्ण रूप है।
- source_word: ζητῶ
  choice: चाहता हूँ
  rationale: ἀρέσκειν के साथ यह किसी लक्ष्य का प्रयत्न या इच्छा व्यक्त करता है; ‘प्रसन्न करना चाहता हूँ’ आधुनिक हिंदी में सहज है।
- source_word: ἀρέσκειν / ἤρεσκον
  choice: प्रसन्न करना / प्रसन्न करने में लगा होता
  rationale: ‘प्रसन्न करना’ दोनों रूपों का सीधा अर्थ देता है। अंतिम वाक्य में ‘लगा होता’ निरंतर व्यवहार और अवास्तविक शर्त, दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: εἰ ἔτι
  choice: यदि मैं अब भी
  rationale: यह शर्त के साथ पहले से चले आ रहे व्यवहार के जारी रहने की धारणा को सुरक्षित रखता है।
- source_word: Χριστοῦ
  choice: मसीह का
  rationale: Χριστός यहाँ उस व्यक्ति की उपाधि और अधिकार को सामने रखता है; ‘मसीह’ हिंदी में मानक उपाधि है।
- source_word: δοῦλος
  choice: दास
  rationale: यह पूर्ण अधीनता और स्वामित्व का बोध ‘सेवक’ से अधिक स्पष्ट रखता है, जो लोगों को प्रसन्न करने के विपरीत मसीह के प्रति पौलुस की निष्ठा पर बल देता है।
theological_decisions:
- issue: 'πείθω का अर्थ: मनाना या स्वीकृति पाना'
  choice: मुख्य पाठ में ‘लोगों को मनाने की कोशिश ... या परमेश्वर को’
  alternative: ‘लोगों की स्वीकृति चाहता हूँ या परमेश्वर की’
  rationale: πείθω का सामान्य शाब्दिक अर्थ ‘मनाना’ है, जबकि प्रसंग में स्वीकृति पाने का भाव भी संभव है। मुख्य पाठ शाब्दिक अलंकारिक तनाव रखता है और पादटिप्पणी प्रसंगगत विकल्प बताती है।
- issue: Χριστοῦ δοῦλος का अनुवाद
  choice: मसीह का दास
  alternative: मसीह का सेवक
  rationale: यहाँ लोगों की प्रसन्नता के विपरीत मसीह के प्रति पूर्ण निष्ठा और संबंध प्रमुख है। ‘दास’ δοῦλος की प्रबलता को बचाता है, जबकि ‘सेवक’ को पादटिप्पणी में नरम विकल्प के रूप में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। अलंकारिक प्रश्नों की तीक्ष्णता और अंतिम प्रतिकल्पित शर्त को बनाए रखा गया है।
