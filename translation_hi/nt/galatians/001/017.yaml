source:
  edition: SBLGNT
  text: οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/001/017.yaml
  text: Nor did I go up to Jerusalem to those who were apostles before me, but I went away to Arabia, and returned again to Damascus.
translation:
  language: hi
  text: और न मैं यरूशलेम में उन लोगों के पास गया जो मुझसे पहले प्रेरित थे, बल्कि मैं अरब चला गया और फिर दमिश्क वापस लौटा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲ
  choice: और न
  rationale: पिछले संदर्भ की नकारात्मक बात को आगे बढ़ाते हुए वाक्य को उससे जोड़ता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἀνῆλθον
  choice: गया
  rationale: यरूशलेम की यात्रा के लिए प्रयुक्त क्रिया में ऊपर जाने का पारंपरिक-भौगोलिक भाव है, पर हिन्दी में केवल ‘गया’ अधिक स्वाभाविक है और आशय सुरक्षित रखता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους
  choice: उन लोगों के पास जो मुझसे पहले प्रेरित थे
  rationale: πρός का ‘के पास’ और πρὸ ἐμοῦ का कालगत ‘मुझसे पहले’ स्पष्ट रखता है, बिना पद या श्रेष्ठता का भाव जोड़े।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यरूशलेम न जाने और अरब चले जाने के बीच तीखा प्रतिविरोध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπῆλθον
  choice: चला गया
  rationale: ἀπ- उपसर्ग में निहित प्रस्थान या दूर जाने के हल्के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: Ἀραβίαν
  choice: अरब
  rationale: उस क्षेत्र का प्रचलित हिन्दी नाम; पद उसकी ऐतिहासिक सीमाएँ निर्धारित नहीं करता।
- source_word: πάλιν
  choice: फिर
  rationale: वापसी की अगली गति को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: ὑπέστρεψα
  choice: लौट आया
  rationale: यात्रा के संदर्भ में वापसी का सहज हिन्दी रूप; प्रथम-पुरुष दृष्टिकोण में ‘आया’ स्वाभाविक है।
- source_word: Δαμασκόν
  choice: दमिश्क
  rationale: नगर के नाम का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: प्रेरितों के संबंध में ‘मुझसे पहले’ का अर्थ
  choice: वे लोग जो पौलुस से पहले प्रेरित थे
  alternative: वे प्रेरित जो पद या अधिकार में पौलुस से श्रेष्ठ थे
  rationale: πρὸ ἐμοῦ सबसे स्वाभाविक रूप से कालगत प्राथमिकता बताता है। अनुवाद पदानुक्रम या श्रेष्ठता का ऐसा दावा नहीं जोड़ता जो मूल पाठ में स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रेरित’ स्थापित बाइबलीय पद है; वाक्य-रचना मूल के विरोध और यात्रा-क्रम को स्पष्ट बनाए रखती है।
