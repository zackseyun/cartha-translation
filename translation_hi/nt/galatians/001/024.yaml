  yaml_path: translation/nt/galatians/001/024.yaml
  text: And they glorified God because of me[a].
translation:
  language: hi
  text: और वे मेरे कारण परमेश्वर की महिमा करते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “मुझमें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पौलुस के वर्णन को आगे बढ़ाता है; यहाँ सरल समन्वय स्वाभाविक है।
- source_word: ἐδόξαζον
  choice: महिमा करते थे
  rationale: δοξάζω का अर्थ महिमा या आदर देना है। हिन्दी का अपूर्ण भूतकाल यूनानी इम्परफेक्ट में निहित जारी या बार-बार होने वाली क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν ἐμοὶ
  choice: मेरे कारण
  rationale: 'ἐν का शाब्दिक अर्थ ‘में’ है, पर इस प्रसंग में वाक्यांश कारणात्मक या संबंधसूचक है: यहूदिया की कलीसियाएँ पौलुस के जीवन और सेवकाई में हुई बातों के कारण परमेश्वर की महिमा करती थीं। अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।'
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: यह ἐδόξαζον का सीधा कर्म है; ‘परमेश्वर’ आधुनिक मानक हिन्दी में स्पष्ट और प्रतिष्ठित बाइबलीय पद है।
theological_decisions:
- issue: ἐν ἐμοὶ का अर्थ
  choice: 'कारणात्मक/संबंधसूचक: ‘मेरे कारण’'
  alternative: 'स्थानसूचक अथवा अधिक शाब्दिक: ‘मुझमें’'
  rationale: निकटवर्ती प्रसंग में कलीसियाओं की प्रतिक्रिया पौलुस के परिवर्तन और सेवकाई के समाचार पर है। ‘मेरे कारण’ इस आशय को स्पष्ट करता है, जबकि मूल की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सहज और गरिमापूर्ण शैली। ‘महिमा करते थे’ यूनानी इम्परफेक्ट की निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
