  text: This persuasion is not from the one who calls you[a].
translation:
  language: hi
  text: यह मनाना उसकी ओर से नहीं है जो तुम्हें बुलाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह प्रभाव उसकी ओर से नहीं है जो तुम्हें बुलाता है।”
    reason: πεισμονή का अर्थ मनाने की प्रक्रिया, उसका प्रभाव, या राज़ी हो जाने की अवस्था हो सकता है; ‘प्रभाव’ एक वैकल्पिक संदर्भानुकूल अर्थ है।
lexical_decisions:
- source_word: πεισμονὴ
  choice: समझाना
  rationale: यह दुर्लभ संज्ञा समझाने, राज़ी करने, या उसके प्रभाव को व्यक्त कर सकती है। यहाँ भाव यह है कि गलातियों को जिस बात के लिए राज़ी किया जा रहा है, उसका स्रोत बुलाने वाला नहीं है। ‘समझाना’ हिंदी में स्वाभाविक रहते हुए शब्द की सक्रिय और प्रभावकारी छाया को बनाए रखता है।
- source_word: ἐκ
  choice: का
  rationale: इस वाक्य-विन्यास में ‘उसका नहीं है’ स्रोत या उद्गम का स्वाभाविक हिंदी संकेत देता है; अर्थात यह समझाना उससे नहीं आता।
- source_word: τοῦ καλοῦντος ὑμᾶς
  choice: जो तुम्हें बुलाता है
  rationale: वर्तमान कृदन्त की निरंतर क्रिया और मूल पाठ की सामान्य अभिव्यक्ति दोनों सुरक्षित रहती हैं; ‘परमेश्वर’ को स्पष्ट रूप से जोड़कर निहित संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: οὐκ
  choice: नहीं
  rationale: पौलुस के स्पष्ट निषेध को सीधे बनाए रखता है।
theological_decisions:
- issue: ‘जो तुम्हें बुलाता है’ की पहचान
  choice: मुख्य पाठ में ‘जो तुम्हें बुलाता है’ रखा गया है।
  alternative: ‘परमेश्वर, जो तुम्हें बुलाता है’
  rationale: व्यापक संदर्भ में संकेत परमेश्वर की ओर है, पर यूनानी पाठ यहाँ ‘परमेश्वर’ संज्ञा नहीं देता। इसलिए अनुवाद मूल की अभिव्यक्ति और उसकी निहितता को बनाए रखता है।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण हिंदी। ‘तुम्हें’ गलातियों को संबोधित बहुवचन का स्वाभाविक रूप है। मुख्य पाठ में दुर्लभ यूनानी शब्द की अस्पष्टता को अत्यधिक व्याख्यायित नहीं किया गया; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
