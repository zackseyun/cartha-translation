source:
  edition: SBLGNT
  text: Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/022.yaml
  text: But the fruit of the Spirit is love[a], joy, peace, patience, kindness, goodness, faithfulness,
translation:
  language: hi
  text: पर आत्मा का फल है—प्रेम, आनन्द, शान्ति, धीरज, दयालुता, भलाई, विश्वास[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता।’ यूनानी शब्द ‘पिस्तिस’ का अर्थ विश्वास, भरोसा या विश्वासयोग्यता हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पदों में बताए गए शरीर के कामों और अब आत्मा के फल के बीच विरोध दिखाता है; आधुनिक हिन्दी में ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: καρπὸς
  choice: फल
  rationale: पौलुस के रूपक को सीधे बनाए रखता है। यूनानी में एकवचन है, इसलिए गुणों की इस पूरी सूची को एक संयुक्त फल के रूप में प्रस्तुत किया गया है।
- source_word: τοῦ πνεύματός
  choice: आत्मा का
  rationale: निकटवर्ती सन्दर्भ में इसका आशय पवित्र आत्मा है। मूल पाठ में केवल πνεῦμα है, इसलिए मुख्य पाठ में ‘पवित्र’ जोड़ने के बजाय संक्षिप्त ‘आत्मा’ रखा गया है।
- source_word: ἀγάπη
  choice: प्रेम
  rationale: ἀγάπη का स्पष्ट, प्रचलित और व्यापक आधुनिक हिन्दी पर्याय।
- source_word: χαρά
  choice: आनन्द
  rationale: गुणों की सूची में इस आन्तरिक प्रसन्नता के लिए स्वाभाविक और प्रतिष्ठित हिन्दी शब्द।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह सामान्य अर्थ को बनाए रखता है और उसे केवल आन्तरिक या केवल पारस्परिक शान्ति तक सीमित नहीं करता।
- source_word: μακροθυμία
  choice: धीरज
  rationale: लम्बे समय तक सहने और क्रोध में देर करने के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: χρηστότης
  choice: दयालुता
  rationale: दूसरों के प्रति कृपालु और भला व्यवहार करने के गुण को स्पष्ट करता है तथा अगले शब्द ‘भलाई’ से पर्याप्त भेद रखता है।
- source_word: ἀγαθωσύνη
  choice: भलाई
  rationale: व्यापक नैतिक अच्छाई के लिए सरल और स्वाभाविक हिन्दी शब्द।
- source_word: πίστις
  choice: विश्वास
  rationale: πίστις का सामान्य और पारम्परिक समतुल्य। इस गुण-सूची में ‘विश्वासयोग्यता’ भी सम्भव है, इसलिए उस अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: πνεῦμα का सन्दर्भ
  choice: पवित्र आत्मा के अर्थ में ‘आत्मा’
  alternative: मनुष्य की आत्मा
  rationale: गलातियों 5 में शरीर और आत्मा का तात्कालिक विरोध तथा पौलुस का व्यापक तर्क पवित्र आत्मा की ओर संकेत करता है। फिर भी मूल में ‘पवित्र’ विशेषण नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: गुण-सूची में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: πίστις ‘विश्वास’ और ‘विश्वासयोग्यता’ दोनों अर्थ दे सकता है। सामान्य शाब्दिक समतुल्य मुख्य पाठ में रखा गया है, जबकि गुण-सूची के कारण सम्भव दूसरे अर्थ को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। एकवचन ‘फल’ मूल रूपक को बनाए रखता है। सूची को स्पष्ट पढ़ने के लिए दीर्घ विराम लगाया गया है। हिन्दी लिपि में बड़े अक्षर से पवित्र आत्मा का संकेत देना सम्भव नहीं; सन्दर्भ ‘आत्मा’ का आशय स्पष्ट करता है।
