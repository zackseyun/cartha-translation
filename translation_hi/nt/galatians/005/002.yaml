translation:
  language: hi
  text: देखो, मैं पौलुस तुमसे कहता हूँ कि यदि तुम अपना खतना करवाते हो[a], तो मसीह[b] तुम्हें कोई लाभ नहीं देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘यदि तुम्हारा खतना किया जाता है’ या ‘यदि तुम अपने को खतना कराने देते हो’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द ‘ख्रिस्तोस’ है, जिसका अर्थ ‘मसीह,’ अर्थात ‘अभिषिक्त जन,’ है; यहाँ इसे उपाधि के रूप में समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान खींचने वाला उद्गार है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में पौलुस की चेतावनी का जोर बनाए रखता है।
- source_word: ἐγὼ Παῦλος
  choice: मैं पौलुस
  rationale: मूल में स्पष्ट सर्वनाम और नाम दोनों जोर देते हैं; हिन्दी में दोनों को रखना इस आत्म-पहचान और बल को सुरक्षित रखता है।
- source_word: λέγω ὑμῖν
  choice: तुमसे कहता हूँ
  rationale: यह सीधा और स्वाभाविक हिन्दी प्रयोग है तथा λέγω के प्रत्यक्ष कथन को बनाए रखता है।
- source_word: ἐὰν περιτέμνησθε
  choice: यदि तुम अपना खतना करवाते हो
  rationale: मध्य/कर्मवाच्य रूप खतना की क्रिया को अपने ऊपर होने देने या उसे ग्रहण करने का भाव देता है। ‘अपना खतना करवाते हो’ हिन्दी में स्वाभाविक है और संदर्भ में स्वेच्छा से इस संस्कार को अपनाने का भाव व्यक्त करता है, बिना हर प्रकार के खतने पर व्यापक निषेध जोड़ने के।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की मसीही उपाधि को व्यक्त करता है। ‘मसीह’ हिन्दी में स्थापित, अर्थपूर्ण और स्वाभाविक रूप है।
- source_word: οὐδὲν ὠφελήσει
  choice: तुम्हें कुछ भी लाभ नहीं होगा
  rationale: यह भविष्यकालीन कथन लाभ के पूर्ण अभाव को बताता है। यह हिन्दी प्रयोग स्पष्ट और सहज है तथा मूल के जोर को सुरक्षित रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस चेतावनी में उपाधि का अर्थ सक्रिय है; ‘मसीह’ उस अभिषिक्त उद्धारकर्ता की भूमिका को स्पष्ट रखता है और हिन्दी में अधिक परिचित है।
- issue: खतने के विषय में पौलुस की चेतावनी का दायरा
  choice: वचन को इस रूप में रखा गया है कि गलातिया के पाठक खतने को धार्मिक-वाचा संबंधी आवश्यकता के रूप में अपना रहे हैं तो मसीह से उन्हें कोई लाभ नहीं होगा।
  alternative: हर चिकित्सीय, जातीय या सांस्कृतिक परिस्थिति में किए गए खतने की सार्वभौमिक निंदा
  rationale: तात्कालिक संदर्भ व्यवस्था के पालन और धार्मिक मान्यता के लिए खतना अपनाने से संबंधित है। अनुवाद मूल कथन से आगे जाकर सभी परिस्थितियों पर निषेध नहीं लगाता।
- issue: οὐδὲν ὠφελήσει की पूर्णता
  choice: कुछ भी लाभ नहीं होगा
  alternative: कम लाभ होगा
  rationale: οὐδέν लाभ के पूर्ण अभाव को व्यक्त करता है; इसे नरम नहीं किया गया है, ताकि पौलुस की चेतावनी का धर्मवैचारिक तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधा और गरिमापूर्ण संबोधन। ‘तुम’ बहुवचन समुदाय के लिए है। वाक्य में पौलुस की आत्म-पहचान और चेतावनी का जोर रखा गया है; अनावश्यक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
