  text: Let us not become conceited[a], provoking one another, envying one another.
translation:
  language: hi
  text: हम व्यर्थ की प्रतिष्ठा चाहने वाले न बनें; न एक-दूसरे को उकसाएँ और न एक-दूसरे से ईर्ष्या करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γινώμεθα
  choice: हम ... न बनें
  rationale: μή के साथ प्रथम पुरुष बहुवचन वर्तमान संभावनार्थक क्रिया निषेधात्मक सामूहिक आग्रह व्यक्त करती है। ‘न बनें’ उपदेशात्मक भाव और γίνομαι में निहित किसी दशा में आने की छाया—दोनों को बनाए रखता है।
- source_word: κενόδοξοι
  choice: खोखली शान के अभिमानी
  rationale: κενόδοξος निराधार महिमा, व्यर्थ प्रतिष्ठा या आत्म-महत्त्व से प्रेरित होने का भाव रखता है। यह पदबंध मूल के ‘खोखली महिमा’ संबंधी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀλλήλους / ἀλλήλοις
  choice: एक-दूसरे को / एक-दूसरे से
  rationale: पारस्परिक सर्वनाम को प्रत्येक कृदंत की हिन्दी कारक-आवश्यकता के अनुसार स्वाभाविक रूप दिया गया है।
- source_word: προκαλούμενοι
  choice: उकसाते हुए
  rationale: यह शब्द सामने वाले को चुनौती देकर प्रतिक्रिया या प्रतिद्वंद्विता के लिए भड़काने का व्यापक भाव रखता है; ‘उकसाना’ इसे केवल चिढ़ाने तक सीमित नहीं करता।
- source_word: φθονοῦντες
  choice: ईर्ष्या करते हुए
  rationale: φθονέω दूसरे की भलाई या उपलब्धि के कारण उससे ईर्ष्या रखने को दर्शाता है। कृदंतात्मक समानांतरता बनाए रखने के लिए ‘करते हुए’ प्रयुक्त है।
theological_decisions:
- issue: कृदंतों का मुख्य आग्रह से संबंध
  choice: ‘उकसाते और ... ईर्ष्या करते हुए’ को अभिमान के साथ चलने वाले व्यवहारों के रूप में रखा गया है।
  alternative: 'इन्हें साधन के अर्थ में लिया जा सकता है: ‘एक-दूसरे को उकसाकर और एक-दूसरे से ईर्ष्या करके हम अभिमानी न बनें।’'
  rationale: यूनानी वाक्य में κενόδοξοι मुख्य विधेय है और दोनों कृदंत साथ होने वाले आचरण बताते हैं। हिन्दी अनुवाद उनके सटीक तार्किक संबंध को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण सामूहिक उपदेशात्मक स्वर रखा गया है। ‘खोखली शान’ सामान्य पाठक के लिए बोधगम्य है और मूल κενόδοξοι की व्युत्पत्तिगत छवि भी बचाती है।
