base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/025.yaml
  text: If we live by the Spirit[a], let us also walk by the Spirit.
translation:
  language: hi
  text: यदि हम पवित्र आत्मा[a] के द्वारा जीवित हैं, तो पवित्र आत्मा के साथ कदम मिलाकर भी चलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि हम पवित्र आत्मा में जीवित हैं, तो पवित्र आत्मा के अनुसार भी चलें।”
    reason: यूनानी πνεύματι के दत्तिव संबंध में ‘में’ और ‘के अनुसार’ संभावित विकल्प हैं; साथ ही στοιχέω का सामान्य ‘चलना’ वाला अनुवाद दिया गया है।
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यूनानी की शर्तवाचक रचना और पौलुस के उपदेशात्मक तर्क को सुरक्षित रखता है; संदर्भ में ‘जब/चूँकि’ का भाव संभव है, पर वह शर्त को अधिक स्पष्ट रूप से व्याख्यायित कर देगा।
- source_word: ζῶμεν
  choice: हम ... जीवित हैं
  rationale: वर्तमान काल के स्वाभाविक हिन्दी रूप में आत्मा से प्राप्त जीवन का भाव व्यक्त होता है, न कि केवल जैविक अस्तित्व।
- source_word: πνεύματι
  choice: पवित्र आत्मा से / पवित्र आत्मा के अनुसार
  rationale: पहले प्रयोग में करण अथवा जीवन-स्रोत का भाव ‘से’ द्वारा आता है। दूसरे प्रयोग को στοιχῶμεν के साथ ‘के अनुसार’ कहना आत्मा के निर्देशन के अनुरूप आचरण का भाव स्वाभाविक हिन्दी में व्यक्त करता है। गलातियों 5 के निकट संदर्भ में संकेत पवित्र आत्मा की ओर है।
- source_word: καὶ
  choice: भी
  rationale: पहली वास्तविकता के अनुरूप आचरण की अपेक्षा बताने वाले आरोही बल को व्यक्त करता है।
- source_word: στοιχῶμεν
  choice: कदम मिलाकर चलें
  rationale: यह उपदेशात्मक संभावनार्थक रूप है। क्रिया में पंक्ति अथवा चाल के अनुरूप चलने का विशिष्ट भाव है, जिसे केवल ‘चलें’ की अपेक्षा ‘कदम मिलाकर चलें’ अधिक स्पष्टता से सुरक्षित रखता है।
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: पवित्र आत्मा
  alternative: मानवीय आत्मा
  rationale: गलातियों 5 में शरीर और आत्मा के बीच लगातार किया गया विरोध और आसपास के पद पवित्र आत्मा की ओर संकेत करते हैं; इसलिए हिन्दी में ‘पवित्र आत्मा’ कहना संदर्भगत आशय को स्पष्ट करता है।
- issue: पहले πνεύματι में संबंध का प्रकार
  choice: पवित्र आत्मा से
  alternative: पवित्र आत्मा में
  rationale: यूनानी संबंधकारक/करण कारक दोनों प्रकार की छाया दे सकता है। यहाँ ‘से’ जीवन के स्रोत अथवा साधन का भाव देता है और अगले खंड के आचरण-संबंधी निर्देश से स्वाभाविक रूप से जुड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। ‘कदम मिलाकर चलें’ στοιχέω की पंक्ति/ताल के अनुरूप चलने की छवि को बचाता है।
