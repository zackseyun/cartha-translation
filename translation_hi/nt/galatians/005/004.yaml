translation:
  language: hi
  text: तुम जो व्यवस्था के द्वारा धर्मी ठहराए जाने का प्रयास कर रहे हो[a], मसीह से अलग हो गए हो[b]; तुम अनुग्रह से गिर गए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक औपचारिक रूप से, “तुम जो व्यवस्था के द्वारा धर्मी ठहराए जा रहे हो।” यूनानी वर्तमान निष्क्रिय रूप है; संदर्भ में यह व्यवस्था के आधार पर धर्मी ठहराए जाने का प्रयास करने वालों को इंगित करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मसीह से तुम्हारा संबंध टूट गया है” या “तुम मसीह से काट दिए गए हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατηργήθητε ἀπὸ Χριστοῦ
  choice: मसीह से अलग कर दिए गए हैं
  rationale: καταργέω का निष्क्रिय रूप ἀπό के साथ यहाँ मसीह से संबंध-विच्छेद व्यक्त करता है। यह अनुवाद यूनानी की कठोर संबंधपरक शक्ति बनाए रखता है, पर अंतिम उद्धार के विषय में पाठ से आगे कोई निष्कर्ष नहीं जोड़ता।
- source_word: οἵτινες
  choice: तुम में से जो लोग
  rationale: यह संबोधित समुदाय के भीतर उस समूह को चिह्नित करता है जिसके बारे में पौलुस सीधे कह रहा है; यह हिंदी में स्वाभाविक रूप से दूसरे पुरुष का बल बनाए रखता है।
- source_word: ἐν νόμῳ
  choice: व्यवस्था के द्वारा
  rationale: ἐν यहाँ आधार अथवा साधन का भाव देता है। पौलुस के संदर्भ में νόμος के लिए 'व्यवस्था' प्रचलित और अर्थपूर्ण है; यूनानी में लेख न होने के कारण हिंदी में कोई अतिरिक्त निश्चिततासूचक तत्व नहीं जोड़ा गया।
- source_word: δικαιοῦσθε
  choice: धर्मी ठहराए जाने की खोज में हैं
  rationale: रूप वर्तमान निष्क्रिय है, किंतु संदर्भ में ऐसे लोगों की कोशिश अथवा दावा सामने है जो व्यवस्था के आधार पर धर्मी ठहरना चाहते हैं। यह अभिव्यक्ति पौलुस के तर्क को स्वाभाविक हिंदी में सामने लाती है; अधिक औपचारिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τῆς χάριτος ἐξεπέσατε
  choice: अनुग्रह से गिर गए हो
  rationale: ἐκπίπτω के साथ संबंधवाचक τῆς χάριτος अनुग्रह से गिर जाने का रूपक देता है। अओरिस्ट की निर्णायक चेतावनी को पूर्ण परिणामसूचक हिंदी में रखा गया है।
theological_decisions:
- issue: क्या यह कथन उद्धार खोने बनाम अनुग्रह के सिद्धांत से हटने के विवाद को निर्णायक रूप से सुलझाए
  choice: मसीह से अलग कर दिए गए हैं; अनुग्रह से गिर गए हो
  alternative: मसीह से विमुख हो गए हो; अनुग्रह का मार्ग छोड़ दिया है
  rationale: मूल पाठ की चेतावनी तीखी और संबंधपरक है। अनुवाद उसी तनाव को बनाए रखता है, लेकिन किसी विशिष्ट मत के अनुसार यह नहीं बताता कि इसका अंतिम उद्धार की स्थिति पर ठीक क्या व्यवस्थित-धर्मवैज्ञानिक प्रभाव है।
