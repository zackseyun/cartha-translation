  text: Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/016.yaml
  text: But I say[a], walk by the Spirit, and you will certainly not carry out the desire of the flesh.
translation:
  language: hi
  text: 'पर मैं कहता हूँ: आत्मा के अनुसार चलो, और तुम शरीर[a] की लालसा को कदापि पूरा न करोगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘पापी स्वभाव।’ यूनानी शब्द का शाब्दिक अर्थ ‘मांस’ है; पौलुस के लेखन में यह आत्मा का विरोध करने वाले पतित मानवीय स्वभाव को भी सूचित कर सकता है।
    reason: वैकल्पिक अर्थ को स्पष्ट करना और मुख्य पाठ में मूल रूपक को सुरक्षित रखना।
lexical_decisions:
- source_word: Λέγω δέ
  choice: पर मैं कहता हूँ
  rationale: δέ यहाँ पिछले कथन से हल्का विरोध अथवा वक्तव्य में मोड़ दिखाता है; ‘पर’ इस संबंध को बिना अधिक प्रबल बनाए स्वाभाविक रूप से व्यक्त करता है।
- source_word: πνεύματι
  choice: आत्मा के अनुसार
  rationale: यह दत्तिवाचक रूप साधन अथवा जीवन के क्षेत्र/मानक का भाव दे सकता है। निकटवर्ती प्रसंग में संकेत पवित्र आत्मा की ओर है; यह अनुवाद आत्मा के निर्देशन में जीवन जीने का भाव रखता है और हिंदी में स्वाभाविक है।
- source_word: περιπατεῖτε
  choice: चलो
  rationale: पौलुस के ‘चलने’ के रूपक को बनाए रखा गया है; यहाँ इसका अर्थ जीवन और आचरण से है।
- source_word: ἐπιθυμίαν
  choice: अभिलाषा
  rationale: ἐπιθυμία सामान्यतः इच्छा या लालसा हो सकती है; यहाँ ‘शरीर की’ के कारण इसका नकारात्मक अर्थ स्पष्ट है। ‘अभिलाषा’ व्यापक अर्थ बनाए रखती है और इसे केवल यौन वासना तक सीमित नहीं करती।
- source_word: σαρκὸς
  choice: शरीर
  rationale: पौलुस की σάρξ संबंधी मूल शब्दावली और आत्मा के साथ उसके तनाव को मुख्य पाठ में सुरक्षित रखा गया है; इसे सीधे ‘पापी स्वभाव’ कहकर अर्थ को एक व्याख्या तक सीमित नहीं किया गया।
- source_word: οὐ μὴ τελέσητε
  choice: कदापि पूरी न करोगे
  rationale: οὐ μή के प्रबल निषेध को ‘कदापि ... न’ व्यक्त करता है। τελέω यहाँ अभिलाषा को कार्यरूप देने या पूरा करने के अर्थ में है।
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: पवित्र आत्मा
  alternative: मनुष्य की आत्मा अथवा सामान्य आध्यात्मिक सिद्धांत
  rationale: गलातियों 5 के निकटवर्ती प्रसंग में आत्मा और शरीर का विरोध पवित्र आत्मा की सक्रिय भूमिका की ओर संकेत करता है। मुख्य पाठ में केवल ‘आत्मा’ रखकर स्रोत की संक्षिप्तता भी बनाए रखी गई है।
- issue: σάρξ का अनुवाद
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: यहाँ नैतिक रूप से नकारात्मक, आत्मा-विरोधी मानवीय प्रवृत्ति अभिप्रेत है, फिर भी ‘शरीर’ पौलुस की मूल संकल्पना और उसकी व्यापकता को सुरक्षित रखता है। वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘चलो’ मूल रूपक को बनाए रखता है, जबकि ‘कदापि’ प्रबल निषेध को संक्षेप और स्पष्टता से व्यक्त करता है।
