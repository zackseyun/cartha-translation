id: GAL.5.15
reference: Galatians 5:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπ’ ἀλλήλων ἀναλωθῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/015.yaml
  text: But if you bite and devour one another[a], watch out that you are not consumed by one another.
translation:
  language: hi
  text: पर यदि तुम एक-दूसरे को काटते और खा जाते हो, तो सावधान रहो कि कहीं तुम एक-दूसरे के द्वारा नष्ट न कर दिए जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: εἰ शर्त प्रस्तुत करता है और δέ पिछले उपदेश के संबंध में हल्का विरोध या नया मोड़ दिखाता है; ‘पर यदि’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे को
  rationale: पारस्परिक सर्वनाम समुदाय के सदस्यों द्वारा परस्पर किए जा रहे कार्य को स्पष्ट करता है।
- source_word: δάκνετε
  choice: काटते
  rationale: क्रिया का मूल अर्थ ‘काटना’ है; वर्तमान काल निरंतर या स्वभावगत व्यवहार का संकेत दे सकता है, जिसे हिन्दी का सामान्य वर्तमान पर्याप्त रूप से व्यक्त करता है।
- source_word: κατεσθίετε
  choice: निगलते
  rationale: यह तीव्र क्रिया साधारण खाने से बढ़कर चट कर जाने का भाव देती है; ‘निगलते’ हिंसक रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βλέπετε
  choice: सावधान रहो
  rationale: आज्ञार्थक क्रिया सतर्कता की तात्कालिक चेतावनी देती है; ‘सावधान रहो’ वर्तमान मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: μὴ
  choice: कहीं ... न
  rationale: उत्तरवर्ती संभावनार्थक क्रिया के साथ μή आशंकित नकारात्मक परिणाम की चेतावनी देता है; ‘कहीं ... न’ हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπ’ ἀλλήλων
  choice: एक-दूसरे के द्वारा
  rationale: ὑπό और संबंधकारक निष्क्रिय वाक्य में कर्ता-साधन बताता है; यह चुनाव पारस्परिक विनाश की विडंबना को स्पष्ट रखता है।
- source_word: ἀναλωθῆτε
  choice: नष्ट न कर दिए जाओ
  rationale: निष्क्रिय संभावनार्थक रूप पूरी तरह बरबाद या समाप्त कर दिए जाने की आशंका व्यक्त करता है। ‘नष्ट’ परिणाम की पूरी गंभीरता रखता है, जबकि पहले प्रयुक्त κατεσθίετε से अनावश्यक शब्दगत समानता नहीं बनाता।
theological_decisions:
- issue: विश्वासी समुदाय के भीतर हिंसक रूपक
  choice: ‘काटते’ और ‘निगलते’ जैसे पशुवत रूपक को यथावत रखना
  alternative: ‘एक-दूसरे को हानि पहुँचाते और बरबाद करते हो’ जैसे सामान्य संघर्ष-सूचक शब्द
  rationale: पौलुस की भाषा जानबूझकर तीखी है और समुदाय के आत्म-विनाश की नैतिक गंभीरता दिखाती है; रूपक को नरम करना मूल वक्तव्य की शक्ति घटा देता।
- issue: ἀναλωθῆτε में रूपक और परिणाम का संबंध
  choice: ‘नष्ट न कर दिए जाओ’
  alternative: ‘खा न लिए जाओ’ अथवा ‘समाप्त न हो जाओ’
  rationale: यह अनुवाद पूर्ण विनाश के परिणाम को स्पष्ट करता है और निष्क्रियता बनाए रखता है, पर पूर्ववर्ती खाने के रूपक को उससे अधिक नहीं दोहराता जितना अलग यूनानी क्रिया स्वयं माँगती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, प्रत्यक्ष और गरिमापूर्ण चेतावनी। पशुवत हिंसा का मूल रूपक सुरक्षित रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि सम्भावित अर्थभेद मुख्य पाठ में स्वाभाविक रूप से व्यक्त हो जाता है।
