base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/021.yaml
  text: envy[a], drunkenness, carousing, and things like these, about which I warn you, just as I warned before, that those who practice such things will not inherit the kingdom of God.
translation:
  language: hi
  text: ईर्ष्याएँ, नशेबाज़ी, उच्छृंखल मौज-मस्ती[a], और ऐसी ही दूसरी बातें—जिनके विषय में मैं तुम्हें चेतावनी देता हूँ, जैसा कि पहले भी चेतावनी दे चुका हूँ—कि जो लोग ऐसे काम करते हैं, वे परमेश्वर के राज्य के वारिस नहीं होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हुड़दंग भरे उत्सव।” यूनानी शब्द उच्छृंखल उत्सवी मौज-मस्ती और अति को सूचित करता है, जो प्रायः मदिरापान से जुड़ी होती थी; इसका अर्थ अनिवार्य रूप से यौन अनैतिकता नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φθόνοι
  choice: ईर्ष्याएँ
  rationale: यूनानी बहुवचन दूसरे की भलाई देखकर होने वाली द्वेषपूर्ण ईर्ष्या को व्यक्त करता है; हिन्दी में बहुवचन मूल की सूचीगत बारीकी को बनाए रखता है।
- source_word: μέθαι
  choice: मतवालापन
  rationale: यह नशे और मदहोशी की दशा अथवा उसके प्रसंगों को दर्शाता है; यह सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: κῶμοι
  choice: रंगरेलियाँ[a]
  rationale: यह मदिरापान से प्रायः जुड़ी उच्छृंखल सामूहिक मौज-मस्ती और उत्सवी अति को दर्शाता है; शब्द को केवल यौन अर्थ तक सीमित न समझा जाए, इसलिए पादटिप्पणी दी गई है।
- source_word: τὰ ὅμοια τούτοις
  choice: ऐसी ही दूसरी बातें
  rationale: यह सूची को खुला रखता है और बताता है कि नामित बुराइयाँ संपूर्ण सूची नहीं हैं।
- source_word: ἃ προλέγω ὑμῖν
  choice: इनके विषय में मैं तुम्हें पहले से चेतावनी देता हूँ
  rationale: προλέγω के अग्रिम कथन और चेतावनी—दोनों भाव नैतिक प्रसंग में स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: καθὼς προεῖπον
  choice: जैसे पहले भी दे चुका हूँ
  rationale: उसी क्रिया की पूर्व चेतावनी का संकेत बनाए रखता है और हिन्दी में अनावश्यक पुनरुक्ति से बचता है।
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: जो लोग ऐसे काम करते रहते हैं
  rationale: वर्तमान कृदन्त के चरित्रगत या निरंतर आचरण के भाव को व्यक्त करता है, पर हर एक अलग चूक के विषय में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: βασιλείαν θεοῦ
  choice: परमेश्वर के राज्य
  rationale: नए नियम के धर्मवैज्ञानिक पद का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: οὐ κληρονομήσουσιν
  choice: वारिस नहीं होंगे
  rationale: विरासत पाने की भविष्यकालीन भाषा को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: क्या चेतावनी एकाकी कृत्यों के लिए है या चरित्रगत आचरण के लिए
  choice: जो लोग ऐसे काम करते रहते हैं
  alternative: जो लोग ऐसे काम करते हैं
  rationale: प्रसंग में वर्तमान कृदन्त πράσσοντες निरंतर अथवा चरित्रगत व्यवहार की ओर संकेत करता है। यह गंभीर चेतावनी को बनाए रखते हुए किसी एक चूक पर पाठ से आगे बढ़कर निर्णय नहीं देता।
- issue: परमेश्वर के राज्य से संबंधित विरासत की भाषा
  choice: परमेश्वर के राज्य के वारिस नहीं होंगे
  alternative: परमेश्वर के राज्य को विरासत में नहीं पाएँगे
  rationale: दोनों सम्भव हैं; चुना हुआ रूप हिन्दी में संक्षिप्त और स्वाभाविक है तथा मूल की विरासत-संबंधी युगांतकारी भाषा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। 'तुम्हें' पौलुस के समुदाय-संबोधन के बहुवचन भाव में है। मूल की खुली सूची, दोहराई गई चेतावनी और चरित्रगत आचरण की गंभीरता सुरक्षित रखी गई है।
