  text: εἰδωλολατρία, φαρμακεία, ἔχθραι, ⸂ἔρις, ζῆλος⸃, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/020.yaml
  text: idolatry[a], sorcery, hostilities, strife, jealousy, outbursts of anger, selfish ambition, divisions, factions[b],
translation:
  language: hi
  text: मूर्तिपूजा, जादू-टोना[a], शत्रुताएँ, झगड़ा, ईर्ष्या, क्रोध के प्रकोप, स्वार्थी महत्त्वाकांक्षाएँ, फूट, गुटबंदियाँ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टोना-टोटका”।
    reason: lexical_alternative
  - marker: b
    text: या “पंथ”; बाद के कलीसियाई प्रयोग में “विधर्म”।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδωλολατρία
  choice: मूर्तिपूजा
  rationale: मूर्तियों की उपासना या सेवा के लिए यह मानक, संक्षिप्त और सहज हिन्दी पद है।
- source_word: φαρμακεία
  choice: जादू-टोना
  rationale: इस दुर्गुण-सूची में आशय औषधि से नहीं, बल्कि मंत्रों या पदार्थों से जुड़ी गुप्त जादुई क्रियाओं से है; ‘जादू-टोना’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἔχθραι
  choice: शत्रुताएँ
  rationale: बहुवचन रूप विरोध और वैमनस्य की अवस्थाओं या अभिव्यक्तियों को दर्शाता है; हिन्दी में बहुवचन बनाए रखा गया है।
- source_word: ἔρις
  choice: झगड़ा
  rationale: यह विवादपूर्ण संघर्ष को व्यक्त करता है; ‘झगड़ा’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ζῆλος
  choice: ईर्ष्या
  rationale: नकारात्मक दुर्गुण-सूची में यह उत्साह नहीं, बल्कि ईर्ष्यापूर्ण प्रतिद्वंद्विता का भाव रखता है।
- source_word: θυμοί
  choice: क्रोध के प्रकोप
  rationale: यूनानी बहुवचन बार-बार भड़क उठने वाले क्रोध को सूचित करता है, जिसे ‘क्रोध के प्रकोप’ ठीक प्रकार से व्यक्त करता है।
- source_word: ἐριθεῖαι
  choice: स्वार्थी महत्त्वाकांक्षाएँ
  rationale: यह निजी लाभ के लिए स्वार्थपूर्ण आगे बढ़ने और दलगत प्रतिद्वंद्विता का भाव रखता है; बहुवचन भी सुरक्षित है।
- source_word: διχοστασίαι
  choice: फूट
  rationale: विरोधी पक्षों में बँटकर अलग खड़े होने की सामुदायिक स्थिति को ‘फूट’ सहज और सटीक रूप से व्यक्त करता है।
- source_word: αἱρέσεις
  choice: गुटबंदियाँ
  rationale: इस संदर्भ में प्राथमिक अर्थ विभाजनकारी दल या गुट बनाना है; यह बाद के तकनीकी अर्थ ‘विधर्म’ को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: αἱρέσεις का अनुवाद
  choice: गुटबंदियाँ
  alternative: पंथ; बाद के कलीसियाई प्रयोग में ‘विधर्म’
  rationale: आस-पास के शब्द संबंधों और समुदाय में पैदा होने वाले संघर्षों की सूची बनाते हैं, इसलिए यहाँ सामाजिक-दलगत अर्थ प्रमुख है। ‘विधर्म’ चुनने से बाद की धर्मवैचारिक तकनीकी श्रेणी मूल संदर्भ पर आरोपित हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पद एक जारी दुर्गुण-सूची का अंश है, इसलिए अंत में अल्पविराम रखा गया है। यूनानी बहुवचनों को जहाँ हिन्दी में स्वाभाविक था वहाँ बनाए रखा गया है।
