  text: I wish those who are upsetting you would even mutilate themselves[a][b].
translation:
  language: hi
  text: काश, जो लोग तुम्हें उलझन में डाल रहे हैं, वे अपना अंग-विच्छेद ही कर लेते![a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “वे अपने आपको काटकर अलग कर लेते।” खतने के प्रसंग में पौलुस का आशय संभवतः उससे आगे बढ़कर अपने आपको बधिया कर लेने से है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो लोग तुम्हें परेशान कर रहे हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφελον
  choice: काश
  rationale: यह अव्यय तीव्र इच्छा व्यक्त करता है। ‘काश’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी की कामनासूचक शक्ति को बनाए रखता है।
- source_word: καὶ
  choice: ही
  rationale: यहाँ καί साधारण संयोजन न होकर कथन को तीखा और आगे बढ़ाने वाला बल देता है; ‘ही’ इस बढ़ी हुई काटने की विडंबना को व्यक्त करता है।
- source_word: ἀποκόψονται
  choice: अपने आपको काट ही डालते
  rationale: मध्यवाच्य रूप आत्म-संबंधी क्रिया का संकेत देता है। खतने के प्रसंग में यह उससे आगे बढ़कर अंग-विच्छेद या बधिया करने की तीखी शब्द-क्रीड़ा हो सकती है, पर मुख्य पाठ में ‘काट डालते’ मूल की वास्तविक अस्पष्टता और कठोरता दोनों बचाता है।
- source_word: οἱ ἀναστατοῦντες
  choice: जो लोग तुम्हें अशांत कर रहे हैं
  rationale: कृदन्त उन लोगों को दर्शाता है जो समुदाय में हलचल, उलझन और अस्थिरता उत्पन्न कर रहे हैं। ‘अशांत कर रहे हैं’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह बहुवचन द्वितीय पुरुष कर्म है, जिसका संदर्भ गलातिया के विश्वासियों से सामूहिक रूप से है।
theological_decisions:
- issue: खतने के संबंध में पौलुस की तीखी कामना का अर्थ
  choice: मुख्य पाठ में काटने की शब्द-क्रीड़ा को रखते हुए, पादटिप्पणी में अंग-विच्छेद या बधिया कर लेने की संभावित तीव्र व्यंजना बताई गई है।
  alternative: वे समुदाय से अपने आपको अलग कर लें।
  rationale: निकटवर्ती प्रसंग खतने का है, इसलिए शारीरिक काटने की तीखी विडंबना सबसे अधिक संदर्भ-संगत है। फिर भी ἀποκόπτω का शाब्दिक अर्थ ‘काटकर अलग करना’ वैकल्पिक समझ की गुंजाइश देता है, अतः उसे दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘काश’ पौलुस की तीखी कामना को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ जानबूझकर शाब्दिक काटने की छवि रखता है, जबकि अधिक विशिष्ट शारीरिक अर्थ पादटिप्पणी में दिया गया है।
