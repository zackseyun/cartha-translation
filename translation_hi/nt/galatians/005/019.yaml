source:
  edition: SBLGNT
  text: φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ⸀ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/019.yaml
  text: 'The works of the flesh are evident: sexual immorality[a], impurity, sensuality,'
translation:
  language: hi
  text: 'पर देह[a] के काम स्पष्ट हैं: यौन अनैतिकता, अशुद्धता, लंपटता,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापी स्वभाव।” यूनानी शब्द का मूल अर्थ “देह” है; यहाँ पौलुस इसे पतित मानवीय इच्छाओं और रुझान के लिए रूपक के रूप में प्रयोग करता है।
    reason: वैकल्पिक व्याख्यात्मक अनुवाद देते हुए मूल यूनानी उपमा और उसकी धर्मवैचारिक व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: φανερὰ
  choice: स्पष्ट
  rationale: यह शब्द ऐसी बात को दर्शाता है जो साफ दिखाई देती या पहचानी जाती है। ‘स्पष्ट’ आधुनिक, सहज और गरिमापूर्ण है।
- source_word: δέ
  choice: पर
  rationale: यह पिछले विचार से हल्का संक्रमण और विरोध व्यक्त करता है। ‘पर’ इस संबंध को स्वाभाविक रूप से दिखाता है, बिना विरोध को आवश्यकता से अधिक प्रबल बनाए।
- source_word: τὰ ἔργα
  choice: काम
  rationale: ‘काम’ सामान्य पाठक के लिए सहज है और मनुष्य के व्यवहार तथा कृत्यों का अर्थ देता है; साथ ही आगे आने वाले ‘आत्मा के फल’ के साथ पौलुस के काम/फल के विरोध को बनाए रखता है।
- source_word: τῆς σαρκός
  choice: देह
  rationale: ‘देह’ यूनानी σάρξ की मूल उपमा को बनाए रखता है और इसे केवल भौतिक शरीर या किसी एक व्याख्यात्मक धारणा तक सीमित नहीं करता। प्रसंगगत अर्थ पादटिप्पणी में बताया गया है।
- source_word: ἅτινά ἐστιν
  choice: ':'
  rationale: यह पदबंध आगे उदाहरणों की सूची प्रस्तुत करता है। हिंदी में विसर्ग सूची का परिचय स्वाभाविक और संक्षिप्त रूप से देता है।
- source_word: πορνεία
  choice: यौन अनैतिकता
  rationale: यह व्यापक रूप से अनुचित यौन आचरण को व्यक्त करता है और आधुनिक हिंदी में पुराने या संकुचित विकल्पों की अपेक्षा अधिक स्पष्ट है।
- source_word: ἀκαθαρσία
  choice: अशुद्धता
  rationale: यह नैतिक मलिनता के अर्थ को स्पष्ट और परिचित हिंदी में व्यक्त करता है।
- source_word: ἀσέλγεια
  choice: लंपटता
  rationale: यह निर्लज्ज, बेलगाम और विशेषतः यौन स्वच्छंद आचरण को संक्षेप में व्यक्त करता है; केवल ‘कामुकता’ की अपेक्षा इसमें आचरण की बेशर्मी और असंयम अधिक सुरक्षित रहते हैं।
theological_decisions:
- issue: पौलुस के नैतिक प्रयोग में σάρξ का अनुवाद
  choice: देह
  alternative: पापी स्वभाव
  rationale: गलातियों 5 में पौलुस ‘देह’ और ‘आत्मा’ के बीच धर्मवैचारिक तनाव रखता है। ‘देह’ उसकी मूल उपमा को सुरक्षित रखता है; ‘पापी स्वभाव’ उसका एक प्रसंगगत स्पष्टीकरण है, इसलिए उसे मुख्य पाठ में अर्थ का स्थान लेने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। पद की सूची अगले पद में जारी रहती है, इसलिए अंतिम पद के बाद पूर्णविराम या ‘और’ के बजाय अल्पविराम रखा गया है।
