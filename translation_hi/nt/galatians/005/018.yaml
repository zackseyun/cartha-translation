id: GAL.5.18
reference: Galatians 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/018.yaml
  text: But if you are led by the Spirit[b][a], you are not under the law.
translation:
  language: hi
  text: पर यदि आप आत्मा के द्वारा चलाए जाते हैं[a], तो आप व्यवस्था के अधीन नहीं हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा के द्वारा चलाए जा रहे हैं।”
    reason: मूल यूनानी के वर्तमानकालिक कर्मवाच्य रूप में जारी प्रक्रिया का भाव स्पष्ट किया जा सकता है।
  - marker: b
    text: “व्यवस्था के अधीन” का अर्थ व्यवस्था के अधिकार या शासन-क्षेत्र के अधीन होना है; तुलना करें गलातियों 5:23।
    reason: पौलुसी पदबंध का आशय स्पष्ट करने और निकटवर्ती समान विचार से जोड़ने के लिए।
lexical_decisions:
- source_word: εἰ
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: δὲ
  choice: पर
  rationale: यह शरीर और आत्मा के बीच प्रसंगगत हल्का विरोध प्रकट करता है; ‘पर’ आधुनिक हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πνεύματι
  choice: आत्मा के द्वारा
  rationale: यह करण कारक में है और इस प्रसंग में पवित्र आत्मा को सूचित करता है; ‘के द्वारा’ आत्मा की सक्रिय भूमिका तथा ἄγεσθε के कर्मवाच्य को स्पष्ट रखता है।
- source_word: ἄγεσθε
  choice: चलाए जाते हैं
  rationale: वर्तमानकालिक कर्मवाच्य रूप को सुरक्षित रखता है और आत्मा के मार्गदर्शन में निरन्तर जीवन-चाल का प्रसंगगत भाव व्यक्त करता है।
- source_word: οὐκ ἐστὲ
  choice: आप ... नहीं हैं
  rationale: निषेध सहित इस संयोजक क्रिया का सीधा हिन्दी रूप है; बहुवचन सम्बोधन के लिए आदरसूचक ‘आप’ स्वाभाविक है।
- source_word: ὑπὸ νόμον
  choice: व्यवस्था के अधीन
  rationale: ‘अधीन’ अधिकार या शासन-क्षेत्र के नीचे होने का पौलुसी भाव सुरक्षित रखता है; गलातियों के प्रसंग में ‘व्यवस्था’ मूसा की व्यवस्था की ओर संकेत करती है।
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: पवित्र आत्मा के अर्थ में ‘आत्मा’
  alternative: मनुष्य की आत्मा
  rationale: गलातियों 5:16–25 में शरीर और आत्मा का बार-बार किया गया विरोध दिव्य आत्मा की ओर संकेत करता है। मुख्य पाठ में ‘पवित्र’ जोड़कर मूल से अधिक स्पष्टता आरोपित नहीं की गई।
- issue: ὑπὸ νόμον का अर्थ
  choice: व्यवस्था के अधिकार अथवा शासन के अधीन नहीं
  alternative: सामान्य अर्थ में किसी भी नियम के अधीन नहीं
  rationale: गलातियों के पौलुसी प्रसंग में νόμος मुख्यतः मूसा की व्यवस्था और उसके शासन-क्षेत्र को सूचित करता है। अनुवाद इस अर्थ को बनाए रखता है, पर कोई विस्तृत धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। ‘चलाए जाते हैं’ मूल कर्मवाच्य संरचना और आत्मा की सक्रिय अगुवाई दोनों को बनाए रखता है; ‘व्यवस्था’ और ‘अधीन’ प्रचलित बाइबलीय शब्दावली होते हुए भी सामान्य पाठक के लिए बोधगम्य हैं।
