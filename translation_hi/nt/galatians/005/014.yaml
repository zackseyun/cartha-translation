  yaml_path: translation/nt/galatians/005/014.yaml
  text: 'For the whole law is fulfilled in one statement: “You shall love your neighbor as yourself.”[a][b]'
translation:
  language: hi
  text: 'क्योंकि सारी व्यवस्था इस एक ही कथन में[a] पूरी हो जाती है[b]: “तुम अपने पड़ोसी से अपने समान प्रेम करो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक वचन में।” यूनानी में शाब्दिक रूप से “एक वचन/कथन में” है, अर्थात एक ही उक्ति या आज्ञा में।
    reason: lexical_alternative
  - marker: b
    text: या, “पूरी हो गई है”; भावार्थतः, “का सार इसमें आ जाता है।” यूनानी क्रिया का मूल अर्थ “पूरा होना” है और इससे यह भी संकेत मिल सकता है कि इस आज्ञा में व्यवस्था का अभिप्राय अपनी पूर्णता तक पहुँचता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का आधार या स्पष्टीकरण देता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πᾶς νόμος
  choice: पूरी व्यवस्था
  rationale: एकवचन और निश्चित νόμος के साथ πᾶς व्यवस्था की समग्रता बताता है। ‘पूरी व्यवस्था’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: ἐν ἑνὶ λόγῳ
  choice: इस एक कथन में
  rationale: λόγος यहाँ किसी एक शब्द मात्र के बजाय आगे उद्धृत एक कथन या आज्ञा को दर्शाता है। ‘कथन’ अर्थ को स्पष्ट रखता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: πεπλήρωται
  choice: पूरी होती है
  rationale: पूर्णकालिक कर्मवाच्य रूप उस वर्तमान स्थिति को व्यक्त करता है जिसमें व्यवस्था इस आज्ञा में अपनी पूर्ति पाती है। यह ‘सारांशित होती है’ की अपेक्षा πληρόω के पूर्ति-संबंधी बल को बेहतर बनाए रखता है।
- source_word: Ἀγαπήσεις
  choice: तुम ... प्रेम रखना
  rationale: भविष्यकालीन रूप लैव्यव्यवस्था 19:18 से उद्धृत आज्ञा के रूप में प्रयुक्त है। ‘प्रेम रखना’ हिन्दी बाइबलीय उद्धरण में स्वाभाविक, गरिमापूर्ण और आज्ञार्थक है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: इस नैतिक संदर्भ में πλησίον का स्थापित और सटीक अर्थ ‘पड़ोसी’ है।
- source_word: ὡς σεαυτόν
  choice: अपने समान
  rationale: यह तुलना को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है तथा ‘जैसे स्वयं से’ जैसी अस्वाभाविक रचना से बचता है।
theological_decisions:
- issue: प्रेम की आज्ञा और पूरी व्यवस्था के संबंध का अर्थ
  choice: व्यवस्था समग्र रूप से पड़ोसी से प्रेम करने की आज्ञा में पूरी होती है।
  alternative: यह आज्ञा केवल व्यवस्था का सार प्रस्तुत करती है; अथवा यहाँ केवल व्यवस्था के नैतिक भाग अभिप्रेत हैं।
  rationale: πληρόω का स्वाभाविक बल केवल सारांश देने से अधिक ‘पूरा होने’ का है। साथ ही यूनानी पाठ ‘व्यवस्था’ को किसी सीमित उपभाग के रूप में स्पष्ट नहीं करता। अनुवाद इस तनाव को बनाए रखता है और व्यवस्था के व्यापक धर्मवैज्ञानिक स्थान पर कोई अतिरिक्त निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज शैली रखी गई है। ‘व्यवस्था’ और ‘पड़ोसी’ जैसे स्थापित बाइबलीय पदों को बनाए रखा गया है। मुख्य पाठ में पूर्ति का सशक्त अर्थ रखा गया है और शाब्दिक अथवा व्याख्यात्मक विकल्प पादटिप्पणियों में दिए गए हैं।
