id: GAL.5.17
reference: Galatians 5:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα ⸀γὰρ ⸂ἀλλήλοις ἀντίκειται⸃, ἵνα μὴ ἃ ⸀ἐὰν θέλητε ταῦτα ποιῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/017.yaml
  text: For the flesh desires what is against the Spirit[a], and the Spirit what is against the flesh; for these oppose each other[b], so that you do not do the things you want.
translation:
  language: hi
  text: क्योंकि शरीर[a] आत्मा[b] के विरुद्ध लालसा करता है, और आत्मा शरीर के विरुद्ध; क्योंकि ये एक-दूसरे के विरोधी हैं, ताकि तुम जो चाहते हो, वह न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘शरीर’ के लिए यूनानी शब्द σάρξ (सार्क्स) है। पौलुस इस शब्द का प्रयोग केवल भौतिक देह के लिए नहीं, बल्कि व्यापक नैतिक अर्थ में भी करता है; इसका अनुवाद ‘पापी स्वभाव’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आत्मा’ का अर्थ ‘पवित्र आत्मा’ समझा जा सकता है; वैकल्पिक रूप से इसे मनुष्य की आत्मा भी समझा जा सकता है। निकटवर्ती संदर्भ पहले अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σὰρξ
  choice: शरीर
  rationale: पौलुस के रूपक और उसकी व्यापक नैतिक-अर्थवत्ता को बनाए रखने के लिए मुख्य पाठ में ‘शरीर’ रखा गया है; यहाँ इसका अर्थ केवल भौतिक देह नहीं है।
- source_word: ἐπιθυμεῖ
  choice: लालसा करता है
  rationale: यह क्रिया प्रबल इच्छा को व्यक्त करती है। ‘लालसा करता है’ आधुनिक हिन्दी में उस तीव्रता को रखता है, जबकि विरोध की दिशा अगले पदबंध से स्पष्ट होती है।
- source_word: κατὰ τοῦ πνεύματος / κατὰ τῆς σαρκός
  choice: आत्मा के विरुद्ध / शरीर के विरुद्ध
  rationale: κατά के विरोधात्मक भाव को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: निकटवर्ती संदर्भ में सम्भावित संकेत पवित्र आत्मा की ओर है; हिन्दी में ‘आत्मा’ की वर्तनी बड़े-छोटे अक्षर से भेद नहीं करती, इसलिए वास्तविक संदर्भगत अस्पष्टता बनी रहती है।
- source_word: ἀλλήλοις ἀντίκειται
  choice: एक-दूसरे का विरोध करते हैं
  rationale: यह परस्पर विरोध को स्पष्ट, संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἵνα μὴ ἃ ἐὰν θέλητε ταῦτα ποιῆτε
  choice: ताकि तुम जो करना चाहते हो, वही न कर सको
  rationale: ἵνα μή की उद्देश्य/परिणामगत छाया और अनिश्चित सम्बन्धवाचक वाक्यांश का अर्थ स्वाभाविक हिन्दी में रखा गया है। ‘न कर सको’ व्यवहार में बाधा के आशय को व्यक्त करता है, यद्यपि यूनानी क्रिया स्वयं केवल ‘करो’ है; इसका शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: पौलुस के नैतिक प्रयोग में σάρξ का अर्थ
  choice: मुख्य पाठ में ‘शरीर’ रखकर पौलुस का रूपक सुरक्षित रखा गया।
  alternative: पापी स्वभाव
  rationale: यहाँ केवल भौतिक देह अभिप्रेत नहीं, फिर भी ‘पापी स्वभाव’ अर्थ को एक व्याख्या तक सीमित कर सकता है। पाद-टिप्पणी व्यापक नैतिक प्रयोग स्पष्ट करती है।
- issue: πνεῦμα का संकेत
  choice: ‘आत्मा’ रखा गया; संदर्भ पवित्र आत्मा की ओर संकेत करता है।
  alternative: मनुष्य की आत्मा
  rationale: गलातियों 5 का निकटवर्ती संदर्भ पवित्र आत्मा और शरीर का विरोध दिखाता है, लेकिन देवनागरी में capitalization न होने से मुख्य पाठ स्वयं इस प्रश्न को निर्णायक रूप से हल नहीं करता।
- issue: ἵνα μή उपवाक्य का उद्देश्य अथवा परिणाम
  choice: ‘ताकि ... न कर सको’
  alternative: ‘जिससे ... नहीं करते’ अथवा अधिक शाब्दिक ‘ताकि ... न करो’
  rationale: यह विरोध मनुष्य की इच्छा के कार्यान्वयन में बाधा उत्पन्न करता है। अनुवाद उस व्यावहारिक परिणाम को स्वाभाविक हिन्दी में दर्शाता है, जबकि पाद-टिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शरीर’ और ‘आत्मा’ जैसे पौलुस के प्रमुख शब्दों को व्याख्यात्मक प्रतिस्थापन से बचाते हुए सुरक्षित रखा गया है; आवश्यक अर्थगत स्पष्टीकरण पाद-टिप्पणियों में है।
