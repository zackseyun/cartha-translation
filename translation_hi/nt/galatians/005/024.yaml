source:
  edition: SBLGNT
  text: οἱ δὲ τοῦ ⸀Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/024.yaml
  text: Those who belong to Messiah have crucified the flesh along with its passions and desires[a][b].
translation:
  language: hi
  text: पर जो मसीह[a] के हैं, उन्होंने देह[b] को उसकी वासनाओं और अभिलाषाओं समेत क्रूस पर चढ़ा दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट।” यूनानी शब्द Χριστός का अर्थ “मसीह” है और यहाँ इसे नाम-सदृश रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “देह” से आशय केवल भौतिक शरीर नहीं, बल्कि आत्मा के विरोध में खड़े पतित मानवीय स्वभाव से है; कुछ अनुवाद इसे “पापी स्वभाव” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ τοῦ Χριστοῦ
  choice: पर जो मसीह के हैं
  rationale: οἱ ... τοῦ Χριστοῦ लोगों के मसीह से संबंध और उनके उसके होने का भाव व्यक्त करता है। हिंदी में ‘जो मसीह के हैं’ संक्षिप्त, स्वाभाविक और संबंधपरक अर्थ के निकट है। δέ का हल्का विरोध पिछले कथन से जोड़ने के लिए ‘पर’ से व्यक्त किया गया है।
- source_word: σάρκα
  choice: देह
  rationale: यहाँ σάρξ केवल भौतिक शरीर नहीं, बल्कि आत्मा के विरोध में खड़ी पतित मानवीय प्रवृत्ति के लिए पौलुस का रूपक है। ‘देह’ मूल रूपक और धर्मवैचारिक तनाव को बनाए रखता है; व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐσταύρωσαν
  choice: क्रूस पर चढ़ा दिया है
  rationale: क्रिया स्पष्ट रूप से क्रूस पर चढ़ाने का बिंब रखती है, इसलिए इसे सामान्य ‘मार डाला’ नहीं किया गया। पूर्ण वर्तमान रूप निर्णायक अतीत की उस क्रिया को व्यक्त करता है जिसका वर्तमान में परिणाम बना हुआ है।
- source_word: σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις
  choice: उसकी वासनाओं और अभिलाषाओं समेत
  rationale: σύν साथ होने का भाव देता है। इस नैतिक संदर्भ में παθήματα भावावेगपूर्ण वासनाएँ हैं, न कि दुःख; ἐπιθυμίαι इच्छाओं अथवा तीव्र अभिलाषाओं को दर्शाता है। ‘उसकी’ से स्पष्ट होता है कि ये देह से संबंधित हैं।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यह पद यीशु की मसीहाई उपाधि की ओर संकेत करता है। हिंदी में ‘मसीह’ इस उपाधि का स्थापित और स्वाभाविक रूप है; नाम-सदृश लिप्यंतरण ‘ख्रीष्ट’ को पादटिप्पणी में रखा गया है।
- issue: पौलुस के नैतिक विरोध में σάρξ
  choice: देह
  alternative: पापी स्वभाव
  rationale: ‘पापी स्वभाव’ संदर्भगत आशय स्पष्ट करता है, पर वह मूल रूपक की बहुअर्थकता को पहले ही सुलझा देता है। ‘देह’ पौलुस की शब्दावली और आत्मा के साथ उसके तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘पर’ δέ के हल्के विरोध को दर्शाता है। ‘देह’, ‘वासनाएँ’, ‘अभिलाषाएँ’ और ‘क्रूस पर चढ़ाना’ पौलुस के मूल बिंब और धर्मवैचारिक तनाव को बिना अनावश्यक व्याख्यात्मक विस्तार के बनाए रखते हैं।
