  text: For through the Spirit[a], by faith[d][c][b], we eagerly await the hope of righteousness.
translation:
  language: hi
  text: क्योंकि हम आत्मा के द्वारा[a], विश्वास से[b], धार्मिकता की आशा[c] की उत्सुकता से प्रतीक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा में।” यूनानी दत्तिव रूप साधन (“आत्मा के द्वारा”) या कार्य-क्षेत्र (“आत्मा में”)—दोनों का भाव दे सकता है। संदर्भ में सम्भवतः पवित्र आत्मा अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “विश्वास के आधार पर।” यूनानी ἐκ स्रोत या आधार का भाव देता है। πίστις का अर्थ कुछ संदर्भों में “विश्वासयोग्यता” या “भरोसा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “न्याय की आशा।” “धार्मिकता की आशा” का अर्थ “जिस धार्मिकता की आशा की जाती है” भी हो सकता है; यूनानी सम्बन्ध को पूरी तरह स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: हम
  rationale: स्पष्ट प्रथम-पुरुष बहुवचन सर्वनाम; यूनानी में उपस्थित हल्का बल हिन्दी में स्वतंत्र ‘हम’ से पर्याप्त रूप से व्यक्त होता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या समर्थन प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πνεύματι
  choice: आत्मा के द्वारा
  rationale: सम्प्रदान कारक यहाँ साधन अथवा कार्यकारी माध्यम का भाव दे सकता है। निकटवर्ती संदर्भ में इसका सम्भावित संकेत पवित्र आत्मा की ओर है।
- source_word: ἐκ πίστεως
  choice: विश्वास के आधार पर
  rationale: ἐκ स्रोत या आधार व्यक्त करता है। यह हिन्दी में केवल ‘विश्वास से’ की अपेक्षा आधार का भाव अधिक स्पष्ट करता है, जबकि πίστις को सामान्य पौलुसी पद ‘विश्वास’ से अनूदित रखता है।
- source_word: ἐλπίδα
  choice: आशा
  rationale: यह ἀπεκδεχόμεθα का कर्म है; हिन्दी में अगली सम्बन्धकारक संज्ञा के साथ ‘धार्मिकता की आशा’ स्वाभाविक है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: पौलुस के इस तर्क में δικαιοσύνη के लिए यह स्थापित और संदर्भानुकूल हिन्दी पद है; ‘न्याय’ सम्भव अर्थ है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἀπεκδεχόμεθα
  choice: बड़ी उत्सुकता से प्रतीक्षा करते हैं
  rationale: क्रिया धैर्यपूर्ण किन्तु उत्कट भावी अपेक्षा प्रकट करती है; यह वाक्यांश साधारण ‘प्रतीक्षा करते हैं’ से उस बल को बेहतर व्यक्त करता है।
theological_decisions:
- issue: πνεύματι का संकेत और कारकीय अर्थ
  choice: पवित्र आत्मा की ओर सम्भावित संकेत के साथ ‘आत्मा के द्वारा’
  alternative: ‘आत्मा में’; अथवा ‘आत्मा से’
  rationale: गलातियों 5 में शरीर, व्यवस्था और आत्मा का विरोध पवित्र आत्मा के संकेत को प्रबल बनाता है। फिर भी यूनानी सम्प्रदान कारक साधन और क्षेत्र—दोनों अर्थ दे सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐλπίδα δικαιοσύνης का सम्बन्ध
  choice: ‘धार्मिकता की आशा’
  alternative: ‘जिस धार्मिकता की आशा है’; अथवा ‘धार्मिकता से उत्पन्न आशा’
  rationale: सम्बन्धकारक रचना को हिन्दी में भी खुला रखा गया है, ताकि इसे भावी धार्मिकता/धर्मी ठहराए जाने की आशा या धार्मिकता से जुड़ी आशा के रूप में समझने की वास्तविक व्याकरणिक गुंजाइश अनावश्यक रूप से समाप्त न हो।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस संदर्भ में ‘विश्वास’ सबसे स्वाभाविक और प्रचलित अर्थ है, पर यूनानी पद कुछ संदर्भों में विश्वासयोग्यता या भरोसा भी व्यक्त कर सकता है; इसे पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्मा’, ‘विश्वास’, ‘धार्मिकता’ और ‘आशा’ जैसे प्रमुख पौलुसी पद बनाए गए हैं। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार है, पर यूनानी पाठ की साधन/क्षेत्र और सम्बन्धकारक सम्बन्ध की वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
