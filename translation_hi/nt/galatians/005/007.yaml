  yaml_path: translation/nt/galatians/005/007.yaml
  text: You were running well[a]. Who hindered you from obeying the truth?
translation:
  language: hi
  text: तुम अच्छी तरह दौड़ रहे थे; किसने तुम्हें सत्य को मानने से रोक दिया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसने तुम्हें सत्य से आश्वस्त होने से रोक दिया?” यूनानी क्रिया का अर्थ “मानना/आज्ञा मानना” या “आश्वस्त होना”—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐτρέχετε
  choice: तुम … दौड़ रहे थे
  rationale: अपूर्णकाल भूतकाल में जारी क्रिया व्यक्त करता है। ‘दौड़ रहे थे’ पौलुस के खेल-संबंधी रूपक को बनाए रखता है और मूल में स्पष्ट रूप से न आए ‘दौड़’ या ‘दौड़ की प्रतियोगिता’ जैसे शब्द नहीं जोड़ता।
- source_word: καλῶς
  choice: अच्छी तरह
  rationale: यह क्रियाविशेषण दौड़ने के ढंग और सही प्रगति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τίς
  choice: किसने
  rationale: यहाँ प्रश्नवाचक सर्वनाम उस व्यक्ति या मानवीय कर्ता की ओर संकेत करता है जिसने बाधा डाली।
- source_word: ἐνέκοψεν
  choice: रोक दिया
  rationale: क्रिया का अर्थ मार्ग में बाधा डालना या आगे बढ़ने से रोकना है; आसपास के ‘दौड़ रहे थे’ रूपक के कारण दौड़ में बाधा डालने की छवि भी बनी रहती है।
- source_word: τῇ ἀληθείᾳ
  choice: सत्य को
  rationale: सम्प्रदान कारक पद πείθεσθαι से जुड़ा है। हिन्दी में ‘मानना’ के साथ ‘सत्य को’ स्वाभाविक है और सन्दर्भ में पहले ग्रहण किए गए सुसमाचार के सत्य की ओर संकेत करता है।
- source_word: μὴ πείθεσθαι
  choice: कि तुम … न मानो
  rationale: πείθομαι आज्ञापालन/मानने और किसी बात से आश्वस्त होने—दोनों अर्थ दे सकता है। ‘सत्य को मानना’ हिन्दी में प्रतिक्रिया और आज्ञाकारिता के आयाम को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἀληθείᾳ के साथ πείθεσθαι का अर्थ
  choice: सत्य को मानना
  alternative: सत्य से आश्वस्त होना
  rationale: प्रसंग गलातियों के सुसमाचार-सत्य के प्रति व्यावहारिक प्रत्युत्तर और उससे हटने से जुड़ा है। ‘मानना’ उस प्रत्युत्तर को व्यक्त करता है, पर यूनानी क्रिया में ‘आश्वस्त होना’ का वास्तविक अर्थ भी संभव है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में है, जो समुदाय को सम्बोधित मूल पाठ के अनुरूप स्वाभाविक और सीधा है। वाक्य गरिमापूर्ण, स्पष्ट और खेल-संबंधी रूपक को सुरक्षित रखने वाला है।
