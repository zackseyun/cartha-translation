lexical_decisions:
- source_word: πραΰτης
  choice: नम्रता
  rationale: यह शब्द ऐसी विनम्र, सौम्य और कठोरता-रहित प्रवृत्ति को दर्शाता है। आधुनिक हिन्दी में ‘नम्रता’ स्वाभाविक और नैतिक गुण-सूची के अनुकूल है।
- source_word: ἐγκράτεια
  choice: संयम
  rationale: यह अपनी इच्छाओं और आवेगों पर नियंत्रण रखने का भाव व्यक्त करता है। ‘संयम’ आधुनिक हिन्दी में संक्षिप्त, परिचित और व्यापक है।
- source_word: κατὰ τῶν τοιούτων
  choice: ऐसी बातों के विरुद्ध
  rationale: τοιούτων व्याकरणतः लोगों या बातों, दोनों की ओर संकेत कर सकता है; किन्तु निकट संदर्भ में यह आत्मा के फल के रूप में गिनाए गए गुणों की ओर अधिक स्वाभाविक रूप से लौटता है।
- source_word: νόμος
  choice: कोई व्यवस्था
  rationale: यूनानी में νόμος के साथ निश्चित उपपद नहीं है। ‘कोई व्यवस्था’ कथन की व्यापक, सूक्तिपरक शक्ति को बनाए रखता है और इसे केवल मूसा की व्यवस्था तक सीमित नहीं करता।
theological_decisions:
- issue: νόμος का दायरा
  choice: व्यापक अर्थ में ‘कोई व्यवस्था’
  alternative: विशेष रूप से ‘व्यवस्था’ अर्थात मूसा की व्यवस्था
  rationale: 'गलातियों में मूसा की व्यवस्था की पृष्ठभूमि स्पष्ट है, फिर भी यहाँ उपपद-रहित νόμος व्यापक कथन की अनुमति देता है: ऐसी सद्गुणों का विरोध कोई व्यवस्था नहीं करती। यह अनुवाद दोनों स्तरों के बीच के तनाव को सुरक्षित रखता है।'
- issue: τοιούτων का संकेत
  choice: गिनाए गए गुण—‘ऐसी बातें’
  alternative: इन गुणों को दिखाने वाले लोग—‘ऐसे लोग’
  rationale: रूप अपने-आप में दोनों अर्थों की अनुमति देता है, पर निकटतम संदर्भ में गुणों की सूची होने के कारण नपुंसक भाव अधिक संभावित है।
translation_notes:
