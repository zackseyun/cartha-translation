source:
  edition: SBLGNT
  text: Ὑμεῖς γὰρ ἐπ’ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/013.yaml
  text: For you were called to freedom[a], brothers; only do not use your freedom as an opportunity for the flesh[d][c][b], but through love serve one another.
translation:
  language: hi
  text: क्योंकि, हे भाइयो,[a] तुम्हें स्वतंत्रता के लिए बुलाया गया है। केवल अपनी स्वतंत्रता को शरीर के लिए अवसर मत बनाओ;[b] बल्कि प्रेम के द्वारा एक-दूसरे की सेवा करो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ “भाइयो” है, पर यहाँ यह पूरी विश्वासी मण्डली—स्त्रियों समेत—को संबोधित करता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप में: “स्वतंत्रता को शरीर के लिए अवसर मत बनाओ।” यहाँ “शरीर” केवल भौतिक देह नहीं, बल्कि पाप की ओर झुकी हुई मानवीय प्रवृत्तियों को भी सूचित करता है; कुछ अनुवाद इसे “पापी स्वभाव” कहते हैं।'
    reason: alternative_reading
  - marker: c
    text: “सेवा करो” वाली यूनानी क्रिया “दास” शब्द से जुड़ी है और स्वयं को दूसरों की सेवा में लगा देने का प्रबल भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς
  choice: तुम्हें
  rationale: स्पष्ट बहुवचन सर्वनाम को हिन्दी में क्रिया के साथ स्वाभाविक रूप से रखा गया है; अलग से ‘तुम ही’ कहना यूनानी बल को अधिक बढ़ा देता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क का कारण या स्पष्टीकरण देता है; हिन्दी में ‘क्योंकि’ इस संबंध को सहज रूप से प्रकट करता है।
- source_word: ἐπ’ ἐλευθερίᾳ
  choice: स्वतंत्रता के लिए
  rationale: ἐπί के साथ चतुर्थी यहाँ बुलाहट के लक्ष्य या उद्देश्य को व्यक्त करती है।
- source_word: ἐκλήθητε
  choice: बुलाया गया है
  rationale: ईश्वरीय बुलाहट का भाव रखते हुए हिन्दी में पूर्ण हुई घटना की वर्तमान प्रासंगिकता स्वाभाविक रूप से व्यक्त होती है।
- source_word: ἀδελφοί
  choice: हे भाईयो और बहनो
  rationale: व्याकरणतः पुल्लिंग बहुवचन संबोधन पूरी विश्वासी मण्डली को सम्मिलित करता है; आधुनिक हिन्दी में स्पष्ट समावेशी संबोधन आशय को ठीक पहुँचाता है।
- source_word: μόνον μὴ
  choice: पर ... मत
  rationale: यह स्वतंत्रता के कथन पर निर्णायक सीमा लगाता है; वाक्य-विभाजन के बाद ‘पर’ हिन्दी में विरोध और सावधानी दोनों स्पष्ट करता है।
- source_word: εἰς ἀφορμὴν τῇ σαρκί
  choice: शरीर की अभिलाषाओं के लिए अवसर
  rationale: ἀφορμή अवसर या आरम्भ-बिन्दु है। σάρξ का केवल भौतिक शरीर वाला अर्थ न निकलने देने के लिए ‘अभिलाषाओं’ से नैतिक आशय स्पष्ट किया गया, जबकि ‘शरीर’ की पौलुसी छवि बची रहती है।
- source_word: διὰ τῆς ἀγάπης
  choice: प्रेम के द्वारा
  rationale: διά के करणवाचक भाव को स्पष्ट रखते हुए ἀγάπη का सीधा और स्वाभाविक अनुवाद किया गया है।
- source_word: δουλεύετε
  choice: दास के समान सेवा करो
  rationale: क्रिया में दासत्व की प्रबल छवि है; केवल ‘सेवा करो’ की अपेक्षा यह उसे बनाए रखता है, पर शाब्दिक ‘दास बनो’ से उत्पन्न सम्भावित भ्रम से बचता है।
- source_word: ἀλλήλοις
  choice: एक-दूसरे की
  rationale: पारस्परिक सर्वनाम का मानक, सहज हिन्दी रूप; ‘सेवा’ के साथ सम्बन्धकारक प्रयोग स्वाभाविक है।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοί का संबोधन
  choice: हे भाईयो और बहनो
  alternative: हे भाइयो
  rationale: यूनानी शब्द रूपतः पुल्लिंग बहुवचन है, पर पत्र में पूरे विश्वासी समुदाय को संबोधित करता है। मुख्य पाठ में दोनों को कहना आधुनिक हिन्दी पाठक के लिए वास्तविक संदर्भ स्पष्ट करता है; पादटिप्पणी रूपगत तथ्य बचाती है।
- issue: पौलुस के नैतिक प्रयोग में σάρξ
  choice: शरीर की अभिलाषाएँ
  alternative: शरीर; पापी स्वभाव
  rationale: यह केवल देह का उल्लेख नहीं, बल्कि परमेश्वर-विरोधी मानवीय प्रवृत्तियों का संकेत है। ‘शरीर की अभिलाषाएँ’ मूल रूपक को कुछ हद तक रखते हुए आशय स्पष्ट करता है और ‘पापी स्वभाव’ जैसी पूर्ण व्याख्यात्मक समानता से बचता है।
- issue: δουλεύετε में दासत्व और स्वैच्छिक पारस्परिक सेवा का तनाव
  choice: दास के समान सेवा करो
  alternative: एक-दूसरे के दास बनो; एक-दूसरे की सेवा करो
  rationale: स्वतंत्रता के ठीक बाद दास-सेवा की विडम्बनापूर्ण छवि महत्वपूर्ण है। चुना हुआ रूप उस बल को बनाए रखता है, साथ ही यह संकेत नहीं देता कि विश्वासी सचमुच एक-दूसरे की सम्पत्ति बन जाएँ।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। संबोधन में ‘हे’ से पत्रात्मक आग्रह स्पष्ट होता है। स्वतंत्रता और दास-सेवा के जानबूझकर रखे गए विरोध को मुख्य पाठ में संरक्षित किया गया है; कठिन पौलुसी शब्द σάρξ के नैतिक आशय को पाठ और पादटिप्पणी दोनों से स्पष्ट किया गया है।
