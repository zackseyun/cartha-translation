source:
  edition: SBLGNT
  text: ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ⸀ἐὰν ᾖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/010.yaml
  text: I am confident in the Lord about you[a], that you will think nothing else; but the one who is troubling you will bear the judgment[b], whoever he may be.
translation:
  language: hi
  text: मुझे प्रभु में तुम्हारे विषय में भरोसा है कि तुम कोई और विचार नहीं रखोगे[a]; परन्तु जो तुम्हें विचलित कर रहा है, वह दण्डादेश को भुगतेगा—चाहे वह कोई भी हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम कोई दूसरा दृष्टिकोण नहीं अपनाओगे।” यूनानी क्रिया सामान्य सोच के साथ-साथ किसी खास मनोभाव या मत को रखने का अर्थ भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह जो कोई भी हो।” आशय यह है कि उस व्यक्ति की पहचान से बात नहीं बदलती।
    reason: alternative_rendering
lexical_decisions:
- source_word: πέποιθα
  choice: मुझे … भरोसा है
  rationale: यूनानी पूर्णकाल यहाँ भरोसे की स्थिर वर्तमान अवस्था व्यक्त करता है। यह हिंदी प्रयोग उस बने हुए विश्वास को स्वाभाविक ढंग से प्रकट करता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे विषय में
  rationale: πέποιθα के साथ यह वाक्यांश गलातियों के भावी प्रत्युत्तर के संबंध में पौलुस का भरोसा व्यक्त करता है; ‘तुम पर’ की अपेक्षा यह अर्थ अधिक स्पष्ट है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस का सामान्य धार्मिक वाक्यांश है, जो उसके भरोसे के आधार या क्षेत्र को प्रभु में स्थित बताता है और जानबूझकर इन दोनों संभावित भावों को खुला रखता है।
- source_word: οὐδὲν ἄλλο φρονήσετε
  choice: तुम कोई और विचार नहीं रखोगे
  rationale: φρονέω केवल क्षणिक सोच नहीं, बल्कि किसी दृष्टिकोण या मनोभाव को रखने का अर्थ भी दे सकता है। प्रसंग में ‘विचार रखना’ स्वाभाविक है और इस व्यापक भाव को सुरक्षित रखता है।
- source_word: ὁ … ταράσσων ὑμᾶς
  choice: जो तुम्हें विचलित कर रहा है
  rationale: वर्तमान कृदन्त ऐसे व्यक्ति को दर्शाता है जो समुदाय में अभी अशांति या अस्थिरता उत्पन्न कर रहा है। ‘विचलित’ मानसिक और सामुदायिक अस्थिरता दोनों को समेट सकता है।
- source_word: βαστάσει τὸ κρίμα
  choice: न्याय का भार उठाएगा
  rationale: βαστάζω के ‘उठाने/ढोने’ के रूपक को बनाए रखा गया है। κρίμα को केवल अनन्त दण्ड या मानवीय अनुशासन तक सीमित किए बिना ‘न्याय’ अनुवादित किया गया है।
- source_word: ὅστις ἐὰν ᾖ
  choice: चाहे वह कोई भी हो
  rationale: अनिश्चयवाचक संबंधवाचक रचना बताती है कि अशांति फैलानेवाले की पहचान या प्रतिष्ठा से परिणाम नहीं बदलता। यह हिंदी वाक्यांश उस भाव को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: गलातियों के विषय में पौलुस के भरोसे का स्वरूप
  choice: उनके भावी विचार के विषय में पौलुस का भरोसा प्रभु में स्थित है।
  alternative: इसे या तो सभी गलातियों के अटल बने रहने की निरपेक्ष गारंटी, या केवल पौलुस का मानवीय आशावाद समझना।
  rationale: पाठ व्यक्तिगत भरोसे को स्पष्टतः ‘प्रभु में’ रखता है और साथ ही भविष्य की अपेक्षा व्यक्त करता है। अनुवाद इस तनाव को किसी एक धर्मसैद्धान्तिक निष्कर्ष में नहीं बदलता।
- issue: τὸ κρίμα का स्वरूप
  choice: अशांति फैलानेवाला न्याय का भार उठाएगा, पर पद न्याय के ठीक स्वरूप को निर्दिष्ट नहीं करता।
  alternative: इसे निश्चित रूप से अनन्त दण्ड, अथवा केवल कलीसियाई अनुशासन मानना।
  rationale: κρίμα न्याय, निर्णय, दण्डादेश या उसके परिणाम को सूचित कर सकता है। ‘न्याय’ चेतावनी की गंभीरता और शब्द की अर्थगत व्यापकता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामुदायिक-पत्र शैली वाला रूप अपनाया गया है। ‘प्रभु में’ जैसे पौलुसी धार्मिक वाक्यांश को यथावत रखा गया है। ‘न्याय का भार उठाएगा’ थोड़ा रूपकात्मक है, पर मूल के βαστάζω को सुरक्षित रखते हुए κρίμα की जानबूझकर बनी व्यापकता को संकुचित नहीं करता।
