reference: Galatians 5:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις δι’ ἀγάπης ἐνεργουμένη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/006.yaml
  text: For in Messiah Jesus neither circumcision nor uncircumcision counts for anything[c][b][a], but faith working through love.
translation:
  language: hi
  text: क्योंकि मसीह[a] यीशु में न तो खतने का कोई महत्त्व है, न खतनारहित होने का, बल्कि प्रेम के द्वारा सक्रिय विश्वास[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ख्रीस्त यीशु।’ यूनानी Χριστός यहाँ एक उपाधि है; मुख्य पाठ में उसका अर्थ ‘मसीह’ दिया गया है।
    reason: alternative_reading
  - marker: b
    text: πίστις का अनुवाद ‘विश्वासयोग्यता’ या ‘भरोसा’ भी हो सकता है; मुख्य पाठ में ‘विश्वास’ रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘विश्वास जो प्रेम के द्वारा काम करता है,’ ‘विश्वास जो प्रेम में अपने को प्रकट करता है,’ या ‘विश्वास जो प्रेम के द्वारा प्रभावी बनाया जाता है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν को ‘में’ रखकर पौलुस की ‘मसीह में’ होने की भाषा सुरक्षित रखी गई है। Χριστός को यहाँ उपाधि के अर्थ में ‘मसीह’ कहा गया है, जबकि Ἰησοῦ नाम ‘यीशु’ है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक संबंधसूचक है।
- source_word: περιτομή
  choice: खतना
  rationale: यह प्रचलित और स्पष्ट हिन्दी शब्द है तथा शारीरिक रीति और उससे जुड़ी सामुदायिक पहचान—दोनों को बिना विस्तार जोड़े बनाए रखता है।
- source_word: τι ἰσχύει
  choice: कोई महत्त्व रखता है
  rationale: यहाँ क्रिया केवल शारीरिक शक्ति नहीं, बल्कि प्रभाव, उपयोगिता या निर्णायक महत्त्व बताती है। हिन्दी मुहावरा संदर्भ में इसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκροβυστία
  choice: खतनारहित होना
  rationale: यह खतना न किए जाने की अवस्था को व्यक्त करता है और ‘खतना’ के साथ मूल विरोध को स्पष्ट रखता है।
- source_word: πίστις
  choice: विश्वास
  rationale: यह πίστις का मानक हिन्दी अनुवाद है। ‘विश्वासयोग्यता’ और ‘भरोसा’ जैसी संभावित छायाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: δι’ ἀγάπης
  choice: प्रेम के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम दर्शाता है; ‘के द्वारा’ विश्वास और प्रेम का संबंध स्पष्ट करता है, पर उसे आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: ἐνεργουμένη
  choice: सक्रिय होता है
  rationale: वर्तमान मध्य/कर्मवाच्य कृदन्त विश्वास के क्रियाशील या प्रभावी होने को दर्शाता है। यह चयन क्रियात्मक भाव रखता है, जबकि व्याकरणिक अस्पष्टता पादटिप्पणी में दी गई है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस पौलुसी पदबंध में Χριστός उपाधि का अर्थ रखता है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में उस अभिषिक्त उपाधि को पहचानने योग्य ढंग से सुरक्षित रखता है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता या भरोसा
  rationale: मुख्य पाठ में सामान्य अर्थ ‘विश्वास’ रखा गया है, पर शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में स्वीकार किया गया है ताकि विचारगत तनाव का अनावश्यक समाधान न किया जाए।
- issue: ἐνεργουμένη की वाच्यगत अस्पष्टता
  choice: सक्रिय होता है
  alternative: काम करता है; प्रभावी बनाया जाता है; अपने को प्रकट करता है
  rationale: यूनानी रूप को मध्य अथवा कर्मवाच्य छाया के साथ समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी अन्य सम्भव अर्थों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खतना’ प्रचलित शब्द है; ‘खतनारहित होना’ मूल के समानांतर पहचान-स्थिति को स्पष्ट करता है। वाक्य की संक्षिप्त विरोधात्मक संरचना और ‘मसीह यीशु में’ का पौलुसी सूत्र सुरक्षित रखा गया है।
