id: GAL.5.1
reference: Galatians 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῇ ἐλευθερίᾳ ⸂ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν⸃ καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/001.yaml
  text: For freedom Messiah set us free[a]; therefore stand firm[b], and do not again be held by a yoke of slavery.
translation:
  language: hi
  text: स्वतंत्रता के लिए मसीह ने हमें स्वतंत्र किया[a]। इसलिए दृढ़ बने रहो, और फिर से दासता के जुए के अधीन न हो जाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “स्वतंत्रता में मसीह ने हमें स्वतंत्र किया।” आरंभ का यूनानी पद संक्षिप्त है और उसका अर्थ ‘स्वतंत्रता के लिए’ या ‘स्वतंत्रता में’ लिया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इसका अनुवाद “दासता के जुए में फिर से न फँसो” या “उससे फिर न जकड़े जाओ” भी हो सकता है। यूनानी क्रिया में किसी के अधीन हो जाने या उसमें फँस जाने—दोनों की छाया हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐλευθερίᾳ
  choice: स्वतंत्रता के लिए
  rationale: आरंभिक संप्रदान कारक पद को उद्देश्य या परिणाम के अर्थ में लिया गया है। यह अनुवाद पौलुस की संक्षिप्त अभिव्यक्ति और ‘स्वतंत्रता—स्वतंत्र किया’ की शब्दगत पुनरावृत्ति को बनाए रखता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त उद्धारकर्ता की उपाधि है। ‘मसीह’ आधुनिक हिन्दी में स्थापित और अर्थपूर्ण धार्मिक पद है।
- source_word: ἠλευθέρωσεν
  choice: स्वतंत्र किया
  rationale: क्रिया का अर्थ बंधन से मुक्त करना है। ‘स्वतंत्र किया’ निकटवर्ती संज्ञा ‘स्वतंत्रता’ के साथ मूल यूनानी की सजातीय शब्दावली को सुरक्षित रखता है।
- source_word: στήκετε
  choice: दृढ़ बने रहो
  rationale: वर्तमान आज्ञार्थक निरंतर स्थिरता और अटल बने रहने का आग्रह करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पहले कथन से निकलने वाले निष्कर्ष को स्पष्ट रूप से चिह्नित करता है।
- source_word: πάλιν
  choice: फिर से
  rationale: यह पहले की दासता जैसी दशा में लौटने की चेतावनी को सीधे व्यक्त करता है।
- source_word: ζυγῷ δουλείας
  choice: दासता के जुए
  rationale: ‘जुआ’ अधीनता के सजीव रूपक को बनाए रखता है और ‘दासता’ δουλεία की कठोरता को ‘बंधन’ की अपेक्षा अधिक स्पष्टता से व्यक्त करती है।
- source_word: ἐνέχεσθε
  choice: के अधीन न हो जाओ
  rationale: इस प्रसंग में क्रिया किसी सत्ता के वश या अधीन हो जाने का भाव रखती है। यह रूप दासता के जुए के रूपक के साथ स्वाभाविक हिन्दी देता है, जबकि फँसने या जकड़े जाने की छाया को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: मूल शब्द अभिषिक्त जन की मसीही उपाधि को वहन करता है। ‘मसीह’ उसका अर्थगत और हिन्दी में प्रचलित प्रतिनिधित्व है; इसे केवल विदेशी नाम-सदृश रूप नहीं बनाया गया।
- issue: δουλεία की तीव्रता
  choice: दासता
  alternative: बंधन
  rationale: स्वतंत्रता के विपरीत रखे गए इस शब्द में वास्तविक पराधीनता का प्रबल भाव है। ‘दासता’ उस तनाव को स्पष्ट रखती है और उसे सामान्य ‘बंधन’ बनाकर हल्का नहीं करती।
- issue: आरंभिक संप्रदान कारक τῇ ἐλευθερίᾳ का संबंध
  choice: उद्देश्य/परिणाम की प्रमुख सम्भावना के रूप में ‘स्वतंत्रता के लिए’
  alternative: अवस्था या क्षेत्र के अर्थ में ‘स्वतंत्रता में’
  rationale: वाक्यरचना संक्षिप्त है और दोनों निकटवर्ती अर्थ सम्भव हैं। मुख्य पाठ में उद्देश्यगत बल रखा गया है, पर वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वतंत्रता…स्वतंत्र किया’ की पुनरावृत्ति जानबूझकर सुरक्षित है, क्योंकि वह मूल यूनानी की अलंकारिक शक्ति का भाग है। ‘दृढ़ बने रहो’ निरंतर स्थिरता का स्वाभाविक आज्ञार्थक रूप है।
