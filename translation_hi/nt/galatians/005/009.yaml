  text: μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/009.yaml
  text: A little leaven leavens the whole batch of dough[a].
translation:
  language: hi
  text: थोड़ा-सा खमीर पूरे गुँधे हुए आटे को खमीर उठा देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μικρὰ
  choice: थोड़ा-सा
  rationale: यहाँ विशेषण खमीर की कम मात्रा बताता है। ‘थोड़ा-सा’ स्वाभाविक हिंदी में सूक्ति की संक्षिप्तता और छोटी मात्रा के व्यापक प्रभाव को बनाए रखता है।
- source_word: ζύμη
  choice: खमीर
  rationale: यह आटे को उठाने वाले किण्वक पदार्थ को दर्शाता है। ‘खमीर’ आधुनिक हिंदी में सहज, ठोस और बाइबिलीय रूपक के लिए उपयुक्त है।
- source_word: ὅλον
  choice: पूरे
  rationale: यह प्रभाव की संपूर्णता पर बल देता है और ‘गुँधे हुए आटे’ के साथ स्वाभाविक हिंदी प्रयोग है।
- source_word: φύραμα
  choice: गुँधा हुआ आटा
  rationale: यह मिलाए या गुँधे हुए आटे की पूरी लोई अथवा मात्रा को दर्शाता है। ‘गुँधा हुआ आटा’ आधुनिक पाठक के लिए चित्र स्पष्ट करता है, जबकि केवल ‘लोई’ पूरी मात्रा की अपेक्षा एक छोटे पिंड का बोध करा सकती है।
- source_word: ζυμοῖ
  choice: खमीर उठा देता है
  rationale: क्रिया का अर्थ किसी वस्तु को खमीरयुक्त करना या खमीर से फुलाना है। यह हिंदी अभिव्यक्ति मूल क्रिया और उसके ठोस पाक-संबंधी चित्र को बनाए रखती है।
theological_decisions:
- issue: सूक्ति का रूपकात्मक बल
  choice: खमीर और गुँधे हुए आटे के ठोस चित्र को बिना व्याख्या जोड़े बनाए रखा गया है।
  alternative: ‘थोड़ी-सी गलत शिक्षा पूरे समुदाय में फैल जाती है’ जैसी संदर्भगत व्याख्या।
  rationale: संदर्भ में यह सूक्ति व्यापक भ्रष्टकारी प्रभाव की चेतावनी देती है, पर पद स्वयं उसका अर्थ खोलकर नहीं बताता। रूपक को ज्यों का त्यों रखने से उसकी आलंकारिक शक्ति और वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूक्तिपरक रखी गई है। ‘खमीर’ सामान्य पाठकों के लिए बोधगम्य है; ‘गुँधा हुआ आटा’ प्राचीन पाक-चित्र को स्वाभाविक हिंदी में स्पष्ट करता है।
