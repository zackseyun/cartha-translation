id: GAL.5.11
reference: Galatians 5:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/011.yaml
  text: But I[a], brothers, if I am still preaching circumcision[b], why am I still being persecuted? Then the offense of the cross has been removed.
translation:
  language: hi
  text: परन्तु भाइयो[a], यदि मैं अब भी खतने का प्रचार करता हूँ, तो मुझे अब भी क्यों सताया जा रहा है? तब तो क्रूस की ठोकर[b] दूर हो गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ “भाइयो” है; यह शब्द भाइयों और बहनों की मिली-जुली मण्डली को भी सम्बोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्रूस से होने वाली ठेस” या “क्रूस से उत्पन्न आपत्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन के पुल्लिंग बहुवचन रूप को बनाए रखता है; गलातिया की मिली-जुली मण्डली के सन्दर्भ में इसका समावेशी प्रयोग पादटिप्पणी में स्पष्ट किया गया है।
- source_word: περιτομήν
  choice: खतने
  rationale: περιτομή का सीधा और प्रचलित हिन्दी समतुल्य; यहाँ यह केवल शारीरिक क्रिया नहीं, बल्कि धार्मिक अपेक्षा के रूप में उसके प्रचार को भी सूचित करता है।
- source_word: ἔτι
  choice: अब भी
  rationale: दोनों बार आए कालगत और तर्कगत बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κηρύσσω
  choice: प्रचार करता हूँ
  rationale: सार्वजनिक रूप से घोषित करने के वर्तमान, जारी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: διώκομαι
  choice: मुझे अब भी क्यों सताया जा रहा है
  rationale: वर्तमान कर्मवाच्य और विरोधियों द्वारा किए जा रहे धार्मिक उत्पीड़न—दोनों को स्पष्ट रखता है।
- source_word: ἄρα
  choice: तब तो
  rationale: काल्पनिक कथन से निकाले गए व्यंग्यपूर्ण निष्कर्ष का अनुमानसूचक बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατήργηται
  choice: दूर हो गई है
  rationale: 'पूर्ण कर्मवाच्य के परिणामी भाव को व्यक्त करता है: उस दशा में क्रूस की ठोकर पैदा करने वाली शक्ति निष्प्रभावी हो चुकी होती।'
- source_word: σκάνδαλον
  choice: ठोकर
  rationale: किसी को गिराने वाले कारण और आहत या विकर्षित करने वाली बात—दोनों सम्भव अर्थों को संक्षेप में बनाए रखता है।
- source_word: σταυροῦ
  choice: क्रूस
  rationale: पौलुस के धार्मिक प्रयोग में σταυρός का मानक और पारदर्शी हिन्दी रूप।
theological_decisions:
- issue: मिली-जुली श्रोता-मण्डली के लिए ἀδελφοί का अनुवाद
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मूल यूनानी के पुल्लिंग सम्बोधन को मुख्य पाठ में सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि यह मिली-जुली मण्डली को सम्बोधित कर सकता है।
- issue: σκάνδαλον τοῦ σταυροῦ का अर्थ
  choice: क्रूस से होने वाली ठोकर
  alternative: क्रूस से होने वाला अपमान या विरोध
  rationale: मूल पदबंध में ठोकर का कारण बनने और लोगों को आहत करके विरोध जगाने—दोनों अर्थों की सम्भावना है। मुख्य पाठ स्रोत-रूपक को बनाए रखता है और पादटिप्पणी दूसरा अर्थ बताती है।
- issue: काल्पनिक कथन के निष्कर्ष का स्वर
  choice: तब तो
  alternative: उस दशा में
  rationale: ἄρα के निष्कर्षसूचक बल के साथ पौलुस के तीखे तर्क को बचाता है, बिना यह मान लेने के कि वह वास्तव में खतने का प्रचार कर रहा था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। “अब भी” की पुनरावृत्ति मूल के तर्क को बनाए रखती है, और “तब तो” प्रश्न से निकलने वाले तीखे निष्कर्ष को स्वाभाविक हिन्दी में प्रस्तुत करता है।
