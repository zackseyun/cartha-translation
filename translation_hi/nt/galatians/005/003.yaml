id: GAL.5.3
reference: Galatians 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/005/003.yaml
  text: And I testify again to every man who receives circumcision that he is obligated to keep the whole law[a][b][c].
translation:
  language: hi
  text: और मैं फिर हर उस पुरुष को, जो खतना करवाता है,[a] गवाही देता हूँ कि वह पूरी व्यवस्था का पालन करने के लिए बाध्य है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसका खतना किया जा रहा है।” यूनानी कृदंत का अर्थ संदर्भ में खतना स्वीकार करना या करवाना है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “वह पूरी व्यवस्था का पालन करने का ऋणी है”; अर्थात् उस पर इसका दायित्व है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτύρομαι
  choice: गवाही देता हूँ
  rationale: यह क्रिया यहाँ पौलुस की गंभीर व्यक्तिगत पुष्टि को व्यक्त करती है। ‘गवाही देता हूँ’ उसके औपचारिक बल को बनाए रखता है; ‘चेतावनी देता हूँ’ संदर्भगत प्रभाव तो बताता, पर मूल से अधिक व्याख्यात्मक होता।
- source_word: δὲ
  choice: और
  rationale: यह पद पिछले कथन से हल्की निरंतरता के साथ जुड़ता है, प्रबल विरोध के साथ नहीं।
- source_word: πάλιν
  choice: फिर
  rationale: यह दोबारा कही गई या नए बल के साथ दोहराई गई बात को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παντὶ ἀνθρώπῳ
  choice: हर उस पुरुष से
  rationale: एकवचन पुल्लिंग अभिव्यक्ति इस विवाद में खतना करवाने वाले प्रत्येक पुरुष को अलग-अलग संबोधित करती है। हिन्दी में ‘पुरुष’ खतने के ठोस संदर्भ को स्वाभाविक और सटीक रखता है।
- source_word: περιτεμνομένῳ
  choice: जो खतना करवाता है
  rationale: वर्तमान कृदंत यहाँ उस व्यक्ति की ओर संकेत करता है जो इस विवाद के संदर्भ में खतने की प्रक्रिया को स्वीकार करता है, न कि अनिवार्यतः उस प्रत्येक व्यक्ति की ओर जिसका शैशव में खतना हुआ था। ‘खतना करवाता है’ इस मध्य/कर्मवाच्य अर्थ-छाया को स्पष्ट रखता है।
- source_word: ὀφειλέτης
  choice: बाध्य है
  rationale: संज्ञा का शाब्दिक अर्थ ‘ऋणी’ है, पर यहाँ आर्थिक ऋण नहीं बल्कि दायित्व अभिप्रेत है। ‘बाध्य है’ आधुनिक हिन्दी में वही अर्थ स्पष्ट करता है।
- source_word: ὅλον τὸν νόμον
  choice: पूरी व्यवस्था
  rationale: यह व्यवस्था की समग्रता पर बल देता है; केवल उसके किसी चुने हुए भाग पर नहीं।
- source_word: ποιῆσαι
  choice: पालन करने
  rationale: व्यवस्था के साथ ποιέω का आशय उसके अनुसार करना या उसे मानना है। ‘पालन करना’ हिन्दी में विधि-आज्ञाओं के प्रति अपेक्षित आज्ञाकारिता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: खतने और पूरी व्यवस्था के दायित्व संबंधी कथन का दायरा
  choice: कथन उस पुरुष के विषय में है जो गलातिया के विवाद में धार्मिक अपेक्षा के रूप में खतना स्वीकार करता है और इस प्रकार पूरी व्यवस्था के पालन का दायित्व अपने ऊपर लेता है।
  alternative: इसे शैशव में खतना पाए यहूदियों सहित प्रत्येक खतना किए हुए पुरुष के बारे में एक सामान्य कथन माना जा सकता है।
  rationale: περιτεμνομένῳ का वर्तमान रूप और 5:2 का निकट संदर्भ उन लोगों की ओर संकेत करते हैं जो अब खतना स्वीकार करने पर विचार कर रहे हैं। मुख्य पाठ उद्देश्य को स्पष्ट रूप से जोड़ता नहीं, इसलिए वह मूल की सीमा और तनाव को बनाए रखता है।
- issue: ὀφειλέτης का रूपक
  choice: मुख्य पाठ में दायित्व का अर्थ ‘बाध्य है’ से दिया गया है और शाब्दिक ‘ऋणी’ को पादटिप्पणी में रखा गया है।
  alternative: मुख्य पाठ में ‘ऋणी है’ रखा जा सकता है।
  rationale: ‘ऋणी’ यूनानी संज्ञा का अधिक औपचारिक समतुल्य है, लेकिन आधुनिक पाठक इसे आर्थिक ऋण समझ सकता है। यहाँ आशय पूरी व्यवस्था मानने के दायित्व से है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। ‘व्यवस्था’ को νόμος के धार्मिक-विधिक अर्थ के लिए रखा गया है। वाक्य-विन्यास हिन्दी के अनुकूल किया गया है, जबकि ‘फिर गवाही देता हूँ’ की गंभीर पुष्टि और ‘पूरी’ के समग्र बल को सुरक्षित रखा गया है।
