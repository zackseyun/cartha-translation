id: GAL.3.3
reference: Galatians 3:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/003.yaml
  text: Are you so foolish? Having begun by the Spirit[c][b][a], are you now being perfected by the flesh?
translation:
  language: hi
  text: क्या तुम इतने नासमझ हो? आत्मा के द्वारा आरम्भ करके[a], क्या अब शरीर के द्वारा[b] पूर्ण बनाए जा रहे हो[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आत्मा में आरम्भ करके।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘मानवीय प्रयास के द्वारा’; सम्भवतः ‘पापी स्वभाव के द्वारा।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘पूरा किए जा रहे हो।’ यूनानी रूप का अर्थ ‘पूरा कर रहे हो’ भी हो सकता है।
    reason: lexical_and_grammatical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इतने
  rationale: प्रश्न में यह रीति के बजाय मात्रा पर बल देता है—‘इतने नासमझ’—और पौलुस की तीखी विस्मयपूर्ण फटकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνόητοί
  choice: नासमझ
  rationale: यह समझ और विवेक की कमी बताता है; आधुनिक हिन्दी में सीधा है, पर ‘मूर्ख’ की अपेक्षा अनावश्यक रूप से अपमानजनक नहीं लगता।
- source_word: ἐναρξάμενοι
  choice: आरम्भ करके
  rationale: 'अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुए कार्य को दिखाता है: उन्होंने आत्मा के द्वारा आरम्भ किया, पर अब दूसरी रीति से पूर्णता पाने का प्रयत्न कर रहे हैं।'
- source_word: πνεύματι
  choice: आत्मा के द्वारा
  rationale: गलातियों 3 के निकटवर्ती प्रसंग में संकेत पवित्र आत्मा की ओर है। करण कारक का भाव ‘के द्वारा’ से स्पष्ट होता है और ‘शरीर के द्वारा’ के साथ समानान्तर विरोध बना रहता है।
- source_word: νῦν
  choice: अब
  rationale: आरम्भ और वर्तमान अवस्था के बीच समयगत विरोध को संक्षिप्त और स्पष्ट रखता है।
- source_word: σαρκὶ
  choice: शरीर के द्वारा
  rationale: ‘शरीर’ पौलुस के σάρξ-विषयक बहुस्तरीय प्रयोग को बनाए रखता है और अर्थ को केवल ‘मानवीय प्रयास’ या ‘पापी स्वभाव’ तक सीमित नहीं करता।
- source_word: ἐπιτελεῖσθε
  choice: पूर्ण बनाए जा रहे हो
  rationale: 'वर्तमान मध्य/कर्मवाच्य रूप को यहाँ कर्मवाच्य प्रक्रिया के रूप में प्रस्तुत किया गया है: आरम्भ के बाद पूर्णता की ओर लाया जाना। यह रूप की सम्भावित अस्पष्टता को टिप्पणी में वैकल्पिक ‘पूरा किए जा रहे’ के साथ बनाए रखता है।'
theological_decisions:
- issue: πνεύματι का संदर्भ
  choice: पवित्र आत्मा
  alternative: मनुष्य की आत्मा अथवा कोई आत्मिक सिद्धान्त
  rationale: गलातियों 3 का तत्काल प्रसंग विश्वास के द्वारा आत्मा पाने और परमेश्वर के सामर्थ्यपूर्ण कार्यों का है; इसलिए पवित्र आत्मा सबसे स्वाभाविक संदर्भ है।
- issue: आत्मा के साथ विरोध में σάρξ का अर्थ
  choice: शरीर
  alternative: मानवीय प्रयास अथवा पापी स्वभाव
  rationale: मुख्य पाठ में ‘शरीर’ रखने से पौलुस की शब्दावली और उसका अर्थगत तनाव सुरक्षित रहता है; व्याख्यात्मक सम्भावनाएँ पाद-टिप्पणी में दी गई हैं।
- issue: ἐπιτελεῖσθε का वाच्य और भाव
  choice: पूर्ण बनाए जा रहे हो
  alternative: पूरा किए जा रहे हो; अथवा ‘अब शरीर के द्वारा पूरा कर रहे हो’
  rationale: यूनानी रूप मध्य और कर्मवाच्य—दोनों के समान हो सकता है। प्रसंग में कर्मवाच्य-सदृश अर्थ स्वाभाविक है, किन्तु ‘पूर्ण’ को नैतिक निष्पापता के किसी विशेष सिद्धान्त तक सीमित नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। पौलुस की कठोर प्रश्नात्मक फटकार को बनाए रखते हुए ‘नासमझ’ सामान्य पाठक के लिए स्वाभाविक है। ‘आत्मा’ और ‘शरीर’ का समानान्तर प्रयोग मूल पाठ के धर्मवैचारिक तनाव को बिना संप्रदायगत व्याख्या थोपे सुरक्षित रखता है।
