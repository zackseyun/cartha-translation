  text: A mediator is not of one[b][a], but God is one.
translation:
  language: hi
  text: मध्यस्थ एक का नहीं होता[a], परन्तु परमेश्वर एक है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘एक का नहीं होता’ यूनानी में संक्षिप्त और अस्पष्ट है। इसका अर्थ “वह केवल एक के लिए काम नहीं करता” या “वह केवल एक पक्ष का नहीं होता” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “परमेश्वर एक है” सम्भवतः इस्राएल के एकेश्वरवादी अंगीकार की प्रतिध्वनि है; व्यवस्थाविवरण 6:4 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: μεσίτης
  choice: मध्यस्थ
  rationale: यह उस व्यक्ति के लिए प्रचलित और सटीक हिन्दी शब्द है जो दो पक्षों के बीच खड़ा होता है; इससे प्रसंग का वाचा-संबंधी और विधिक भाव बना रहता है।
- source_word: ἑνὸς
  choice: एक का
  rationale: यूनानी संबंधकारक पद जानबूझकर संक्षिप्त और अस्पष्ट है। ‘एक का’ उसकी असामान्य संक्षिप्तता को सुरक्षित रखता है; सम्भावित अर्थ को पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: οὐκ ἔστιν
  choice: नहीं होता
  rationale: मध्यस्थ के विषय में सामान्य कथन के रूप में हिन्दी में ‘नहीं होता’ स्वाभाविक है और यूनानी के निषेधात्मक कथन को सीधे व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: दूसरा δέ मध्यस्थ-वाले कथन और परमेश्वर की एकता के कथन के बीच विरोध अथवा तनाव दिखाता है। पहले δέ के लिए अलग आरम्भिक संयोजक जोड़ना हिन्दी में अनावश्यक है।
- source_word: θεὸς εἷς ἐστιν
  choice: परमेश्वर एक है
  rationale: यह सीधा और स्वाभाविक अनुवाद है, जो एकेश्वरवादी अंगीकार की सम्भावित प्रतिध्वनि और मूल कथन की प्रभावशाली संक्षिप्तता दोनों को बनाए रखता है।
theological_decisions:
- issue: पहले उपवाक्य में पौलुस के अत्यन्त संक्षिप्त तर्क का अर्थ
  choice: मुख्य पाठ में ‘मध्यस्थ एक का नहीं होता’ रखकर मूल की अस्पष्टता सुरक्षित रखी गई।
  alternative: ‘मध्यस्थ केवल एक पक्ष के लिए नहीं होता’ अथवा ‘मध्यस्थ अकेले एक व्यक्ति का प्रतिनिधि नहीं होता।’
  rationale: यह पद अनेक प्रकार से समझा गया है। मुख्य पाठ में ‘पक्ष’ या मध्यस्थ की विशिष्ट भूमिका जोड़ने से तर्क का एक अर्थ पहले ही तय हो जाता; इसलिए सम्भावित व्याख्या पादटिप्पणी में दी गई है।
- issue: ‘परमेश्वर एक है’ का धर्मवैज्ञानिक संकेत
  choice: कथन को बिना व्याख्यात्मक विस्तार के ज्यों का त्यों रखा गया।
  alternative: ‘परमेश्वर एक ही परमेश्वर है।’
  rationale: सीधा अनुवाद व्यवस्थाविवरण 6:4 की सम्भावित प्रतिध्वनि को रहने देता है, पर उसे पाठ में स्पष्ट उद्धरण घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘एक का’ कुछ असामान्य लग सकता है, पर यहाँ मूल यूनानी की वास्तविक संक्षिप्तता और व्याख्यात्मक तनाव को जानबूझकर सुरक्षित रखा गया है।
