  text: और यदि तुम मसीह के हो, तो तुम अब्राहम का वंश[a] और प्रतिज्ञा के अनुसार वारिस हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बीज’। यूनानी शब्द यहाँ एकवचन में है और इसी अध्याय में पहले अब्राहम के ‘बीज’ के विषय में पौलुस के तर्क की प्रतिध्वनि करता है; इसका अर्थ ‘सन्तान’ या ‘वंशज’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστοῦ
  choice: मसीह के
  rationale: Χριστός को यहाँ उपाधि ‘मसीह’ के रूप में और सम्बन्धकारक को स्वाभाविक हिन्दी ‘के हो’ से व्यक्त किया गया है; इससे उसके अपने होने का भाव बना रहता है।
- source_word: σπέρμα
  choice: वंश
  rationale: ‘वंश’ आधुनिक हिन्दी में सामूहिक सन्तान-समुदाय का स्वाभाविक बोध देता है और अब्राहम से वंशगत सम्बन्ध को बनाए रखता है। यूनानी के शाब्दिक ‘बीज’ और उसके एकवचन रूप की जानकारी पादटिप्पणी में दी गई है, ताकि अध्याय के पहले के तर्क से सम्बन्ध न खोए।
- source_word: κληρονόμοι
  choice: वारिस
  rationale: पारिवारिक और प्रतिज्ञा-संबंधी सन्दर्भ में ‘वारिस’ स्पष्ट, प्रचलित और स्वाभाविक हिन्दी है।
- source_word: κατ’ ἐπαγγελίαν
  choice: प्रतिज्ञा के अनुसार
  rationale: यह रूप यूनानी वाक्यांश की व्यापकता बनाए रखता है और यह तय नहीं करता कि प्रतिज्ञा आधार, मानदण्ड या रीति में से किस अर्थ में प्रमुख है।
- source_word: εἰ δὲ ὑμεῖς ... ἄρα
  choice: और यदि तुम ... तो
  rationale: यह हल्के संयोजक δέ और शर्त से निकलने वाले निष्कर्ष ἄρα—दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: σπέρμα के एकवचन और गलातियों 3 में पहले आए उसी शब्द से उसके सम्बन्ध को कैसे बनाए रखा जाए
  choice: मुख्य पाठ में ‘वंश’, तथा पादटिप्पणी में शाब्दिक ‘बीज’ और एकवचन की सूचना
  alternative: मुख्य पाठ में ‘बीज’ या ‘सन्तान’
  rationale: ‘बीज’ शब्द-साम्य को सबसे सीधे बचाता है, पर इस वाक्य में सामान्य हिन्दी पाठक के लिए अस्वाभाविक और भ्रमकारी हो सकता है। ‘वंश’ सामूहिक अर्थ को स्वाभाविक रूप से देता है, जबकि पादटिप्पणी पौलुस के शब्दगत और धर्मवैचारिक सूत्र को दृश्यमान रखती है।
- issue: κατ’ ἐπαγγελίαν में प्रतिज्ञा की भूमिका को अधिक स्पष्ट किया जाए या नहीं
  choice: ‘प्रतिज्ञा के अनुसार’
  alternative: ‘प्रतिज्ञा के आधार पर’
  rationale: ‘के आधार पर’ कारण या आधार को अपेक्षाकृत अधिक निश्चित कर देता है; मूल यूनानी की सम्भावित अर्थ-व्याप्ति बनाए रखने के लिए अधिक खुला रूप चुना गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मसीह के हो’ सम्बन्ध और अपनत्व को संक्षेप में व्यक्त करता है। ‘वारिस’ का रूप हिन्दी में एकवचन और बहुवचन दोनों के लिए समान होने के कारण यूनानी बहुवचन का अर्थ प्रसंग से स्पष्ट है।
