    issue: The expression “जब तक वह विश्वास प्रकट न हो जाए जिसे प्रकट किया जाना था” is temporally inconsistent and duplicates the revelation idea.
    rationale: The Greek has one passive infinitive, ἀποκαλυφθῆναι, governed by μέλλουσαν (“about to be/forthcoming”). The draft adds an awkward “प्रकट न हो जाए” and then repeats revelation in a relative clause. This obscures the source construction.
  - severity: low
    issue: The main-text wording does not clearly express the future-oriented force of μέλλουσαν.
    rationale: “आने वाले विश्वास के प्रकट होने तक” naturally represents the forthcoming faith and its revelation, without over-interpreting πίστις as an era or doctrine.
