  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα ⸀συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/023.yaml
  text: But before faith came[a], we were being guarded under the law[d][c][b], confined until the faith that was about to be revealed.
translation:
  language: hi
  text: पर विश्वास[d] के आने से पहले, हमें व्यवस्था के अधीन पहरे में रखा जाता था और आने वाले विश्वास के प्रकट होने तक बंद रखा जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: d
    text: यहाँ ‘विश्वास’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘विश्वासयोग्यता’ या ‘भरोसा’ भी हो सकता है, यद्यपि इस संदर्भ में ‘विश्वास’ सबसे उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρὸ τοῦ ... ἐλθεῖν
  choice: के आने से पहले
  rationale: πρό के साथ संज्ञास्वरूप क्रिया temporal संबंध व्यक्त करती है; यह हिंदी में स्वाभाविक रूप से ‘के आने से पहले’ है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले तर्क से हल्का विरोध या संक्रमण दिखाता है; ‘पर’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν πίστιν
  choice: विश्वास
  rationale: संदर्भ में πίστις का प्रमुख अर्थ ‘विश्वास’ है। यूनानी निश्चित उपपद उद्धार-इतिहास के एक नए युग की ओर संकेत कर सकता है, पर मुख्य पाठ में ‘विश्वास’ इस अर्थगत तनाव को खुला रखता है।
- source_word: ὑπὸ νόμον
  choice: व्यवस्था के अधीन
  rationale: यह पौलुस का प्रचलित पदबंध है, जो मूसा की व्यवस्था के अधिकार अथवा शासन के अधीन होने को व्यक्त करता है।
- source_word: ἐφρουρούμεθα
  choice: हमारी रखवाली की जाती थी
  rationale: अपूर्णकालीन कर्मवाच्य निरंतर भूतकालीन दशा दिखाता है। ‘रखवाली’ सुरक्षा और हिरासत—दोनों संभावित छायाओं को पूरी तरह बंद नहीं करती।
- source_word: συγκλειόμενοι
  choice: हमें ... बंद रखा गया था
  rationale: यह कृदंत चारों ओर से रोककर रखने या सीमित करने का भाव जोड़ता है; ‘बंद रखा गया’ उसका प्रतिबंधात्मक बल बनाए रखता है।
- source_word: εἰς
  choice: तब तक ... जब तक
  rationale: इस संदर्भ में εἰς आनेवाले प्रकाशन की ओर कालगत गति या सीमा दर्शाता है; हिंदी में ‘तब तक ... जब तक’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: τὴν μέλλουσαν πίστιν
  choice: वह विश्वास ... जिसे प्रकट किया जाना था
  rationale: μέλλουσαν आगामी घटना का भाव देता है; हिंदी संरचना इसे ἀποκαλυφθῆναι के साथ जोड़कर ‘जिसे प्रकट किया जाना था’ के रूप में स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀποκαλυφθῆναι
  choice: प्रकट किया जाना था
  rationale: यह अओरिस्ट कर्मवाच्य infinitive के प्रकाशन-संबंधी अर्थ और कर्मवाच्यता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या πίστις सामान्य व्यक्तिगत विश्वास है या मसीह के आगमन से आरंभ हुआ उद्धार-ऐतिहासिक युग
  choice: मुख्य पाठ में ‘विश्वास’ रखा गया है, जबकि उसके ‘आने’ और ‘प्रकट किए जाने’ की भाषा उद्धार-ऐतिहासिक आयाम को बनाए रखती है।
  alternative: ‘वह विश्वास’ या ‘विश्वास का युग’
  rationale: संदर्भ मसीह से पहले और बाद की अवस्थाओं की तुलना करता है, किंतु ‘विश्वास का युग’ कहना मूल से अधिक व्याख्यात्मक होगा।
- issue: ἐφρουρούμεθα में संरक्षण और हिरासत का संबंध
  choice: ‘हमारी रखवाली की जाती थी’
  alternative: ‘हमें हिरासत में रखा जाता था’
  rationale: ‘रखवाली’ मूल क्रिया का अपेक्षाकृत खुला अर्थ रखती है; अगले पद ‘बंद रखा गया’ से प्रतिबंध का पहलू भी स्पष्ट हो जाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘व्यवस्था’ पौलुस के νόμος के लिए स्थापित बाइबिलीय शब्द है। वाक्य में कर्मवाच्य और प्रथम पुरुष बहुवचन बनाए गए हैं; अर्धविराम दोनों परस्पर संबद्ध क्रियात्मक विचारों को स्पष्ट करता है।
