review_pass:
  verdict: revise
  source_fidelity: 'Draft correctly identifies the temporal contrast, the law, and the twofold imagery of guarding and confinement. However, its final clause is grammatically and temporally inconsistent: “जब तक ... प्रकट न हो जाए जिसे प्रकट किया जाना था” mixes a prospective completion with a past-oriented passive and redundantly expresses revelation. The revision renders μέλλουσαν ... ἀποκαλυφθῆναι as “आने वाले विश्वास के प्रकट होने तक.”'
  naturalness: The draft’s semicolon and alternating passive constructions make the sentence somewhat heavy, and the final relative clause is unnatural. The revised sentence is coherent, modern standard Hindi, and maintains the restrained formal register appropriate to the epistle.
  terminology: ‘विश्वास’ appropriately retains the ambiguity of πίστις, while ‘व्यवस्था के अधीन’ is an established rendering of ὑπὸ νόμον. ‘पहरे में रखा जाता था’ conveys φρουρέω without forcing either a protective or carceral sense; ‘बंद रखा जाता था’ conveys the restrictive force of συγκλείω.
  issues:
