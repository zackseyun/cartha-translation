source:
  edition: SBLGNT
  text: Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/015.yaml
  text: 'Brothers[a], I am speaking in human terms: even a covenant ratified by a man[b], no one sets aside or adds to it.'
translation:
  language: hi
  text: 'भाइयो[a], मैं मानवीय रीति से कहता हूँ: मनुष्य द्वारा विधिवत् मान्य की गई वाचा[b] को भी कोई रद्द नहीं करता, न उसमें कुछ जोड़ता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी के पुल्लिंग बहुवचन शब्द का अनुवाद है; पौलुस सम्भवतः स्त्री-पुरुष सभी साथी विश्वासियों को सम्बोधित कर रहा है।
    reason: cultural_note
  - marker: b
    text: या ‘वसीयत’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन में प्रयुक्त पुल्लिंग बहुवचन को मुख्य पाठ में बनाए रखा गया है; सम्भवतः स्त्रियाँ भी विश्वासी श्रोताओं में शामिल थीं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: κατὰ ἄνθρωπον λέγω
  choice: मैं मनुष्यों के व्यवहार से एक उदाहरण देता हूँ
  rationale: यह मुहावरा सामान्य मानवीय जीवन या कानूनी व्यवहार से उपमा प्रस्तुत करता है। शाब्दिक अनुवाद की अपेक्षा यह आधुनिक हिन्दी में उसका आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅμως
  choice: भी
  rationale: 'यह सामान्य मानवीय मामले पर बल देता है: ऐसी वाचा को भी कोई रद्द या परिवर्तित नहीं करता। हिन्दी वाक्य में ‘भी’ इसी तर्कात्मक बल को सहजता से व्यक्त करता है।'
- source_word: ἀνθρώπου
  choice: मनुष्य द्वारा
  rationale: एकवचन सम्बन्धकारक का कर्तृवाचक अर्थ रखा गया है और उसे किसी विशेष पुरुष तक सीमित किए बिना स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: κεκυρωμένην
  choice: विधिवत् ठहराई गई
  rationale: पूर्ण निष्क्रिय कृदन्त किसी ऐसी व्यवस्था को दर्शाता है जिसे औपचारिक रूप से मान्य करके प्रभावी कर दिया गया हो।
- source_word: διαθήκην
  choice: वाचा
  rationale: गलातियों 3 में अब्राहम से सम्बन्धित परमेश्वर की प्रतिज्ञा और वाचा के प्रसंग के कारण ‘वाचा’ मुख्य अर्थ है; ‘वसीयत’ का सम्भव कानूनी अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀθετεῖ
  choice: रद्द नहीं करता
  rationale: यह किसी मान्य व्यवस्था को निष्प्रभावी या अमान्य करने का कानूनी भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπιδιατάσσεται
  choice: न उसमें कुछ जोड़ता है
  rationale: क्रिया का अर्थ बाद में अतिरिक्त शर्तें या प्रावधान जोड़ना है; यह अनुवाद संक्षिप्त रहते हुए उस अर्थ को बनाए रखता है।
theological_decisions:
- issue: διαθήκη का अनुवाद ‘वाचा’ किया जाए या ‘वसीयत’
  choice: वाचा
  alternative: वसीयत
  rationale: तात्कालिक सन्दर्भ अब्राहम से की गई प्रतिज्ञा और परमेश्वर की वाचा है, इसलिए ‘वाचा’ प्रसंगगत और धर्मवैचारिक निरन्तरता बनाए रखती है। फिर भी यूनानी शब्द का कानूनी अर्थ ‘वसीयत’ हो सकता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘विधिवत् ठहराई गई’ कानूनी भाव को व्यक्त करती है, जबकि ‘रद्द’ और ‘कुछ जोड़ता’ अनावश्यक तकनीकीपन से बचते हैं।
