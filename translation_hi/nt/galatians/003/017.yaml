  text: τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ ⸀θεοῦ ὁ μετὰ ⸂τετρακόσια καὶ τριάκοντα ἔτη⸃ γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/017.yaml
  text: 'This is what I mean: the law[a], which came four hundred and thirty years later, does not invalidate a covenant previously ratified by God[b], so as to abolish the promise.'
translation:
  language: hi
  text: 'मेरे कहने का अर्थ यह है: परमेश्वर द्वारा पहले ही प्रमाणित की गई वाचा को चार सौ तीस वर्ष बाद आई व्यवस्था अमान्य नहीं करती[a], जिससे प्रतिज्ञा निष्प्रभावी हो जाए[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, रद्द नहीं करती।
    reason: lexical_alternative
  - marker: b
    text: या, निरस्त हो जाए; अथवा एक ओर कर दी जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο δὲ λέγω
  choice: मेरे कहने का अर्थ यह है
  rationale: यह पौलुस के स्पष्टीकरण-सूचक कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; δέ के संवादगत संबंध को बिना अनावश्यक कालवाचक शब्द जोड़े बनाए रखता है।
- source_word: διαθήκην
  choice: वाचा
  rationale: गलातियों 3 में अब्राहम से की गई परमेश्वर की प्रतिज्ञा के संदर्भ में ‘वाचा’ इसके संबंधपरक और विधिक अर्थ को ठीक प्रकार व्यक्त करती है।
- source_word: προκεκυρωμένην ὑπὸ τοῦ θεοῦ
  choice: परमेश्वर द्वारा पहले ही प्रमाणित की गई
  rationale: पूर्णकालिक कृदंत वाचा की पहले से स्थापित वैधता को दिखाता है और ὑπό-वाक्यांश परमेश्वर को कर्ता के रूप में स्पष्ट करता है।
- source_word: ὁ ... γεγονὼς νόμος
  choice: आई व्यवस्था
  rationale: γίνομαι को ऐतिहासिक आगमन के अर्थ में सहज हिन्दी दी गई है और ‘व्यवस्था’ पौलुस के νόμος के लिए मानक, संदर्भानुकूल शब्द है।
- source_word: μετὰ τετρακόσια καὶ τριάκοντα ἔτη
  choice: चार सौ तीस वर्ष बाद
  rationale: यह कालांतर को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: οὐκ ἀκυροῖ
  choice: अमान्य नहीं करती
  rationale: यह वाचा को कानूनी रूप से अवैध या रद्द ठहराने के अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν
  choice: जिससे वह प्रतिज्ञा को निष्प्रभावी कर दे
  rationale: यह εἰς τό के प्रयोजन/परिणाम संबंध को खुला रखता है और καταργέω के किसी चीज़ को प्रभावहीन कर देने वाले प्रबल अर्थ को व्यक्त करता है।
theological_decisions:
- issue: पौलुस के तर्क में διαθήκη का अर्थ
  choice: वाचा
  alternative: वसीयत; कानूनी प्रबंध
  rationale: निकटवर्ती प्रसंग अब्राहम को दी गई परमेश्वर की प्रतिज्ञा और उसके स्थायी बल पर केंद्रित है; ‘वाचा’ इस उद्धार-ऐतिहासिक तर्क को बिना अतिरिक्त सिद्धान्त आरोपित किए सुरक्षित रखती है।
- issue: εἰς τὸ καταργῆσαι में प्रयोजन और परिणाम का संबंध
  choice: जिससे वह प्रतिज्ञा को निष्प्रभावी कर दे
  alternative: इस उद्देश्य से कि वह प्रतिज्ञा को निष्प्रभावी कर दे
  rationale: यूनानी रचना प्रयोजन अथवा परिणामी प्रभाव दोनों की छाया रख सकती है; चुनी हुई हिन्दी इस संबंध को अनावश्यक रूप से केवल एक अर्थ तक सीमित नहीं करती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की विधिक-वाचागत शब्दावली को स्पष्ट रखा गया है, पर अत्यधिक संस्कृतनिष्ठ शैली से बचा गया है।
