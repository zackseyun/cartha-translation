id: GAL.3.21
reference: Galatians 3:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ⸂ἐκ νόμου ἂν⸃ ἦν ἡ δικαιοσύνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/021.yaml
  text: Is the law then against the promises of God? May it never be! For if a law had been given that was able to give life[a], then righteousness really would have been from the law.
translation:
  language: hi
  text: तो क्या व्यवस्था परमेश्वर की प्रतिज्ञाओं के विरुद्ध है? कदापि नहीं! क्योंकि यदि ऐसी व्यवस्था दी गई होती जो जीवन दे सकती, तो वास्तव में धार्मिकता[a] व्यवस्था से होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।”
    reason: δικαιοσύνη का एक वैध शाब्दिक विकल्प और अर्थगत आयाम सुरक्षित रखना।
lexical_decisions:
- source_word: νόμος
  choice: व्यवस्था
  rationale: यह पौलुस के तर्क में व्यवस्था की व्यापक श्रेणी को व्यक्त करता है और साथ ही मूसा की व्यवस्था की संदर्भगत गूँज बनाए रखता है।
- source_word: κατὰ
  choice: के विरुद्ध
  rationale: संबंधकारक के साथ यह विरोध का भाव देता है; हिंदी में यह स्पष्ट और स्वाभाविक है।
- source_word: ἐπαγγελιῶν
  choice: प्रतिज्ञाओं
  rationale: यूनानी मूल का बहुवचन सुरक्षित रखा गया है और यह पिछले संदर्भ में परमेश्वर की प्रतिज्ञाओं की ओर संकेत करता है।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: यह पौलुस की प्रबल निषेधात्मक अभिव्यक्ति का संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिंदी रूप है।
- source_word: ἐδόθη
  choice: दी गई होती
  rationale: अवास्तविक शर्त को हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δυνάμενος ζῳοποιῆσαι
  choice: जो जीवन दे सकती
  rationale: व्यवस्था की जीवन देने की सामर्थ्य का भाव स्पष्ट और सहज भाषा में सुरक्षित है।
- source_word: ὄντως
  choice: वास्तव में
  rationale: निष्कर्ष पर दिए गए यूनानी बल को व्यक्त करता है।
- source_word: ἐκ νόμου
  choice: व्यवस्था से
  rationale: ἐκ के स्रोत अथवा आधार के भाव को संक्षिप्त और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के इस तर्क में परमेश्वर के सामने सही ठहरने के भाव के लिए प्रचलित हिंदी बाइबलीय शब्द है; ‘न्याय’ की संभावित व्यापक अर्थछाया पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: पौलुस के तर्क में δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: संदर्भ में व्यवस्था और प्रतिज्ञा के संबंध में परमेश्वर के सामने सही ठहरने की बात प्रमुख है। फिर भी यूनानी शब्द की न्याय-संबंधी अर्थछाया को समाप्त न करते हुए वैकल्पिक अनुवाद पादटिप्पणी में दिया गया है।
- issue: νόμος का दायरा
  choice: व्यवस्था
  alternative: मूसा की व्यवस्था
  rationale: पद की काल्पनिक शर्त व्यवस्था को एक श्रेणी के रूप में प्रस्तुत करती है, यद्यपि संदर्भ में मूसा की व्यवस्था भी सम्मिलित है; इसलिए मुख्य पाठ में दायरा संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और तर्कप्रधान शैली रखी गई है। ‘कदापि नहीं!’ प्रबल निषेध को व्यक्त करता है, जबकि शर्तवाचक वाक्य हिंदी में स्वाभाविक रूप से विन्यस्त है।
