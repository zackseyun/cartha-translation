  text: τοῦτο μόνον θέλω μαθεῖν ἀφ’ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/002.yaml
  text: 'This only I want to learn from you: did you receive the Spirit by works of the law[b][a], or by hearing with faith?'
translation:
  language: hi
  text: 'मैं तुमसे केवल यह जानना चाहता हूँ: क्या तुमने आत्मा को व्यवस्था के कामों से प्राप्त किया, या विश्वास के साथ सुनने से?[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास का सुनना”; इस वाक्यांश का अर्थ विश्वास के साथ संदेश सुनना भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “विश्वास” के लिए “निष्ठा” का अर्थ कम संभावित है, पर संक्षिप्त यूनानी रचना के कारण कभी-कभी इस पर विचार किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο μόνον
  choice: केवल यह
  rationale: यूनानी पदक्रम के बल और पौलुस के तीखे आलंकारिक प्रश्न को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: θέλω μαθεῖν ἀφ’ ὑμῶν
  choice: मैं तुमसे ... जानना चाहता हूँ
  rationale: θέλω μαθεῖν का स्वाभाविक हिन्दी रूप है और ἀφ’ ὑμῶν के ‘तुमसे’ को स्पष्ट रखता है।
- source_word: ἐξ ἔργων νόμου
  choice: व्यवस्था के कामों से
  rationale: पौलुस की संक्षिप्त अभिव्यक्ति को ज्यों का त्यों रखते हुए ἐκ के साधन अथवा आधार के भाव को ‘से’ द्वारा व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: संदर्भ में परमेश्वर का पवित्र आत्मा अभिप्रेत है; मूल में ‘पवित्र’ न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐλάβετε
  choice: पाया
  rationale: यहाँ ‘पाया’ आत्मा की प्राप्ति को सहज आधुनिक हिन्दी में व्यक्त करता है और यूनानी अओरिस्ट की बीती घटना का भाव बनाए रखता है।
- source_word: ἐξ ἀκοῆς πίστεως
  choice: विश्वास के साथ सुनने से
  rationale: संक्षिप्त यूनानी संबंधकारक रचना को स्वाभाविक हिन्दी में प्रस्तुत करता है, जबकि सुनने और विश्वास के संबंध की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस संदर्भ में πίστις का सामान्य और सर्वाधिक संभावित अर्थ ‘विश्वास’ है; ‘विश्वासयोग्यता’ कम संभावित है।
theological_decisions:
- issue: ‘आत्मा’ का अभिप्राय
  choice: परमेश्वर का पवित्र आत्मा
  alternative: सामान्य आत्मिक अनुभव या सामर्थ्य
  rationale: गलातियों 3 का निकट संदर्भ विश्वासियों द्वारा परमेश्वर के आत्मा को पाने की बात करता है; फिर भी मूल में विशेषण ‘पवित्र’ न होने से उसे पाठ में नहीं जोड़ा गया।
- issue: ἀκοῆς πίστεως में संबंध
  choice: विश्वास के साथ सुनना
  alternative: विश्वास का सुनना; विश्वास से उत्पन्न संदेश/सुनवाई; विश्वासयोग्यता के विषय में सुनना
  rationale: यूनानी संबंधकारक संक्षिप्त और अर्थ की दृष्टि से खुला है। मुख्य पाठ सर्वाधिक स्वाभाविक अर्थ देता है, और वैकल्पिक संबंधों को पादटिप्पणियों में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी किंतु गरिमापूर्ण शैली। ‘व्यवस्था के काम’ पौलुस की पारिभाषिक अभिव्यक्ति को बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में शामिल हैं।
