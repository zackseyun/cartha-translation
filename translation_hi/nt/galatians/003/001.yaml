reference: Galatians 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ⸀ἐβάσκανεν, οἷς κατ’ ὀφθαλμοὺς Ἰησοῦς Χριστὸς ⸀προεγράφη ἐσταυρωμένος;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/001.yaml
  text: You foolish Galatians[a], who has bewitched you[c][b], before whose eyes Jesus the Messiah was publicly portrayed as crucified?
translation:
  language: hi
  text: हे नासमझ गलातियो! तुम्हें किसने मोहित कर दिया? तुम्हारी आँखों के सामने तो यीशु मसीह को क्रूस पर चढ़ाया हुआ स्पष्ट रूप से प्रस्तुत किया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνόητοι
  choice: नासमझ
  rationale: यह पौलुस की तीखी फटकार को व्यक्त करता है, पर मूल शब्द से बढ़कर नैतिक दुष्टता का आरोप नहीं लगाता।
- source_word: Γαλάται
  choice: गलातियो
  rationale: क्षेत्र के लोगों के नाम ‘गलाती’ का स्वाभाविक हिन्दी संबोधन-बहुवचन।
- source_word: ἐβάσκανεν
  choice: तुम पर जादू कर दिया
  rationale: मूल क्रिया के जादू या सम्मोहन जैसे हानिकारक प्रभाव के सजीव रूपक को बनाए रखता है; केवल ‘बहका दिया’ कहने से इसकी आलंकारिक तीक्ष्णता घट जाती।
- source_word: οἷς κατ’ ὀφθαλμοὺς
  choice: तुम्हारी आँखों के सामने
  rationale: प्रत्यक्ष और सजीव रूप से सामने रखे जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦς Χριστός
  choice: यीशु मसीह
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता संबंधी उपाधि-भाव को हिन्दी के स्थापित अर्थपूर्ण पद ‘मसीह’ से व्यक्त करता है।
- source_word: προεγράφη
  choice: साफ़-साफ़ चित्रित किए गए थे
  rationale: क्रिया के सार्वजनिक रूप से सामने रखने, स्पष्टतः प्रदर्शित करने या सजीव चित्रण करने के अर्थ-क्षेत्र को बनाए रखता है।
- source_word: ἐσταυρωμένος
  choice: क्रूस पर चढ़ाए हुए
  rationale: पूर्ण कृदंत यीशु को क्रूस पर चढ़ी हुई अवस्था में चित्रित किए जाने पर बल देता है।
theological_decisions:
- issue: Ἰησοῦς Χριστός में Χριστός का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: आधुनिक मानक हिन्दी में ‘मसीह’ परिचित है और Χριστός को केवल नाम का अंश बनाने के बजाय उसकी उपाधि का अर्थ सुनाई देता रहने देता है।
- issue: प्रचार की सजीवता और वास्तविक क्रूसारोपण का संबंध
  choice: क्रूस पर चढ़ाए हुए साफ़-साफ़ चित्रित किए गए थे
  alternative: क्रूस पर चढ़ाया जाना स्पष्ट रूप से बताया गया था
  rationale: मूल वाक्य गलातियों के सामने हुए वास्तविक क्रूसारोपण का दावा नहीं करता, बल्कि उनके बीच यीशु के क्रूसारोपण को अत्यंत सजीव और खुलकर प्रस्तुत किए जाने की बात करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे नासमझ गलातियो’ मूल संबोधन की तीखी वक्तृता बनाए रखता है। डैश यूनानी वाक्य की एकसूत्रता बचाते हुए हिन्दी में लंबे प्रश्न को सुबोध बनाता है; सम्मानसूचक बहुवचन क्रियापद हिन्दी में यीशु के उल्लेख के अनुरूप है।
