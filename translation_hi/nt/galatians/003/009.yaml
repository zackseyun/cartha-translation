  text: So then[a], those who are of faith are blessed along with Abraham, the faithful one.
translation:
  language: hi
  text: इसलिए, जो विश्वास करते हैं, वे विश्वासी अब्राहम[a] के साथ आशीष पाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब्राहम, जो विश्वास करते थे” अथवा “विश्वासयोग्य अब्राहम।” यूनानी शब्द दोनों अर्थ दे सकता है।
    reason: πιστός में ‘विश्वास करनेवाला’ और ‘विश्वासयोग्य’ दोनों अर्थ संभव हैं।
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकलने वाले निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἐκ πίστεως
  choice: जो विश्वास करनेवाले हैं
  rationale: यह लोगों की विश्वास से पहचानी जाने वाली अवस्था को सहज हिन्दी में व्यक्त करता है; शाब्दिक ‘जो विश्वास से हैं’ हिन्दी में अस्वाभाविक होता।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस प्रसंग में पौलुस उन लोगों की बात करता है जो विश्वास करते हैं; यहाँ ‘विश्वासयोग्यता’ मुख्य अर्थ नहीं है।
- source_word: εὐλογοῦνται
  choice: आशीष पाते हैं
  rationale: यह यूनानी वर्तमानकालीन कर्मवाच्य का स्वाभाविक हिन्दी रूप है और स्पष्ट करता है कि आशीष प्राप्त होती है, कमाई नहीं जाती।
- source_word: σὺν
  choice: के साथ
  rationale: यह अब्राहम और विश्वास करनेवालों को एक ही आशीष में सहभागी दिखाता है, बिना अनावश्यक विस्तार के।
- source_word: τῷ πιστῷ Ἀβραάμ
  choice: विश्वासी अब्राहम
  rationale: यह प्रसंग में अब्राहम के विश्वास को स्वाभाविक रूप से सामने लाता है, जबकि πιστός में निहित ‘विश्वासयोग्य’ अर्थ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: विश्वास-केंद्रित प्रसंग में अब्राहम के लिए πιστός का अर्थ
  choice: विश्वासी अब्राहम
  alternative: विश्वास करनेवाले अब्राहम; विश्वासयोग्य अब्राहम
  rationale: πιστός किसी विश्वास करनेवाले या किसी विश्वासयोग्य व्यक्ति का वर्णन कर सकता है। गलातियों 3 का निकट प्रसंग अब्राहम के विश्वास पर बल देता है, इसलिए मुख्य पाठ में ‘विश्वासी’ चुना गया है; फिर भी दूसरे अर्थ को पादटिप्पणी में रखा गया है ताकि अर्थगत तनाव मिट न जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विश्वास करनेवाले’ सामान्य पाठक के लिए ‘विश्वास से हैं’ की अपेक्षा अधिक स्वाभाविक है; ‘आशीष पाते हैं’ कर्मवाच्य भाव को स्पष्ट और बोलचाल-सुलभ ढंग से रखता है।
