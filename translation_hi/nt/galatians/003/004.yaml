lexical_decisions:
- source_word: τοσαῦτα
  choice: इतना सब
  rationale: नपुंसकलिंग बहुवचन उन अनेक बातों को समष्टि रूप में दर्शाता है जिनसे गलातिया के विश्वासी गुज़रे; ‘इतना सब’ स्वाभाविक आधुनिक हिन्दी में इस व्यापकता को रखता है।
- source_word: ἐπάθετε
  choice: सहा
  rationale: πάσχω का अर्थ ‘दुःख सहना’ या व्यापक रूप से ‘अनुभव करना’ हो सकता है। प्रसंग में विश्वास से जुड़ी कठिनाइयों की सम्भावना के कारण मुख्य पाठ में ‘सहा’ रखा गया है, जबकि व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: εἰκῇ
  choice: व्यर्थ ही
  rationale: यह प्रयोजनहीनता या निष्फलता व्यक्त करता है। ‘व्यर्थ ही’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा दोनों बार इसकी पुनरावृत्ति यूनानी की आलंकारिक पुनरावृत्ति सुरक्षित रखती है।
- source_word: εἴ γε
  choice: यदि सचमुच
  rationale: यह संयोजन सावधानी से रखी गई शर्त या संशयपूर्ण योग्यता व्यक्त करता है; ‘यदि सचमुच’ पौलुस के इस संकेत को बनाए रखता है कि परिणाम का व्यर्थ होना अभी अंतिम निष्कर्ष नहीं है।
- source_word: καὶ
  choice: सचमुच (εἴ γε के साथ)
  rationale: यहाँ καὶ दूसरे εἰκῇ पर बल देता है। हिन्दी में ‘यदि सचमुच वह व्यर्थ ही था’ उसी जोर को स्वाभाविक ढंग से व्यक्त करता है।
