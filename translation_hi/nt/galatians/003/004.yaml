  text: क्या तुमने इतना सब व्यर्थ ही सहा[a]?—यदि सचमुच वह व्यर्थ ही हुआ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुमने इतना सब व्यर्थ ही अनुभव किया?”
