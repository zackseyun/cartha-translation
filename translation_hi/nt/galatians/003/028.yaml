source:
  edition: SBLGNT
  text: οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· ⸀πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/028.yaml
  text: There is no Jew or Greek[a], there is no servant or free, there is no male and female[b]; for you are all one in Messiah Jesus.
translation:
  language: hi
  text: न यहूदी है, न यूनानी[a]; न दास है, न स्वतंत्र; न नर है और न नारी[b]; क्योंकि तुम सब मसीह यीशु में एक हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में ‘यूनानी’ है; इस जोड़ी में यह यहूदी से भिन्न जातीय-धार्मिक समुदाय को दर्शाता है।
    reason: lexical_clarification
  - marker: b
    text: मूल यूनानी में ‘नर और नारी’ है, जो संभवतः उत्पत्ति 1:27 की प्रतिध्वनि है। पहली दो जोड़ियों के विपरीत, यहाँ दोनों पदों के बीच ‘और’ है, ‘न’ नहीं।
    reason: literary_allusion
lexical_decisions:
- source_word: οὐκ ἔνι
  choice: न … है
  rationale: अस्तित्वसूचक नकार को स्वाभाविक हिन्दी में व्यक्त करता है और तीनों खंडों में पौलुस की दोहरावपूर्ण, बलपूर्ण संरचना बनाए रखता है।
- source_word: Ἰουδαῖος
  choice: यहूदी
  rationale: Ἕλλην के साथ इस विरोध में जातीय-धार्मिक अर्थ प्रमुख है; आधुनिक हिन्दी में ‘यहूदी’ स्पष्ट और स्थापित शब्द है।
- source_word: Ἕλλην
  choice: यूनानी
  rationale: मूल पाठ में व्यापक ‘गैर-यहूदी’ नहीं, बल्कि ठोस शब्द ‘यूनानी’ है; उसी को सुरक्षित रखा गया है।
- source_word: δοῦλος
  choice: दास
  rationale: ἐλεύθερος के साथ सामाजिक स्थिति का विरोध है। ‘दास’ बंधनाधीन स्थिति को व्यक्त करता है और हिन्दी बाइबलीय गद्य में सहज है।
- source_word: ἐλεύθερος
  choice: स्वतंत्र
  rationale: ‘दास’ के विपरीत स्वतंत्र सामाजिक स्थिति को संक्षेप और स्पष्ट रूप में व्यक्त करता है।
- source_word: ἄρσεν
  choice: नर
  rationale: यह सामान्य ‘पुरुष’ के बजाय लिंगसूचक शब्द है और उत्पत्ति 1:27 की संभावित प्रतिध्वनि को बनाए रखता है।
- source_word: θῆλυ
  choice: नारी
  rationale: ἄρσεν के साथ लिंगसूचक जोड़ी को व्यक्त करता है और हिन्दी में ‘नर और नारी’ के परिचित सृष्टि-वर्णनात्मक पदबंध को सुरक्षित रखता है।
- source_word: καὶ
  choice: और
  rationale: पहली दो जोड़ियों के οὐδὲ से भिन्न, यहाँ मूल पाठ में καὶ है। ‘और’ इस जानबूझकर किए गए बदलाव तथा उत्पत्ति 1:27 की संभावित प्रतिध्वनि को बनाए रखता है।
- source_word: πάντες ὑμεῖς
  choice: तुम सब
  rationale: संबोधित समुदाय और उसकी समग्रता, दोनों पर दिए गए बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: εἷς
  choice: एक
  rationale: एकता के संक्षिप्त विधेय को बिना ‘एक व्यक्ति’ या ‘एकजुट’ जैसे व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: Χριστός को यहाँ पदवी ‘मसीह’ के रूप में रखा गया है और ἐν की संघात्मक भाषा को ‘में’ से सीधे व्यक्त किया गया है।
theological_decisions:
- issue: ἄρσεν καὶ θῆλυ में καὶ को कैसे व्यक्त किया जाए
  choice: न नर और नारी
  alternative: न नर है, न नारी
  rationale: पहली दो जोड़ियों में οὐδὲ है, पर तीसरी में καὶ। कुछ असामान्य लगने पर भी ‘और’ मूल भिन्नता और उत्पत्ति 1:27 की संभावित प्रतिध्वनि को सुरक्षित रखता है; अधिक मुहावरेदार विकल्प इस भिन्नता को मिटा देता।
- issue: εἷς ἐστε का अर्थ विस्तार करना या न करना
  choice: तुम सब … एक हो
  alternative: तुम सब एक व्यक्ति हो / तुम सब एकजुट हो
  rationale: मूल पाठ मसीह में सामूहिक एकता कहता है, पर यह स्पष्ट नहीं करता कि सभी सृजित या सामाजिक भेद मिट गए हैं। संक्षिप्त अनुवाद इस धार्मिक तनाव को खुला रखता है।
- issue: Χριστός को नाम की तरह या पदवी की तरह प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट जीसस
  rationale: यहाँ Χριστός की मसीही पदवी सक्रिय है। ‘मसीह’ आधुनिक हिन्दी में स्थापित, अर्थपूर्ण और स्वाभाविक रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। समानांतर खंडों और विरामचिह्नों से पौलुस की लय सुरक्षित रखी गई है। तीसरे खंड का जानबूझकर असामान्य रूप मूल यूनानी के ‘और’ तथा संभावित सृष्टि-संदर्भ को बचाने के लिए रखा गया है।
