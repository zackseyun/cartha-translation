id: GAL.3.13
reference: Galatians 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ⸂ὅτι γέγραπται⸃· Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/013.yaml
  text: 'The Messiah redeemed us from the curse of the law by becoming a curse for us[d][c][b][a], because it is written: “Cursed is everyone who hangs on a tree.”'
translation:
  language: hi
  text: मसीह[a] ने हमारे लिए[b] शाप बनकर हमें व्यवस्था के शाप से मोल लेकर छुड़ा लिया। इसलिए कि लिखा है:[c] “हर वह व्यक्ति शापित है जो पेड़[d] पर लटका है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट।”
    reason: lexical_alternative
  - marker: b
    text: या, “हमारी ओर से”; सम्भवतः “हमारी जगह।”
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि लिखा है।”
    reason: alternative_reading
  - marker: d
    text: यूनानी शब्द ξύλον का शाब्दिक अर्थ “लकड़ी” या “पेड़” हो सकता है; “पेड़” शास्त्र के इस उद्धरण की शब्दावली सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: मसीह
  rationale: यह यूनानी उपाधि का प्रचलित और सहज हिन्दी रूप है; केवल निजी नाम की तरह न लेकर अभिषिक्त जन की उपाधि का भाव बनाए रखता है।
- source_word: ἐξηγόρασεν
  choice: मोल लेकर छुड़ा लिया
  rationale: इसमें खरीदकर मुक्त करने का व्यापारिक रूपक और पौलुस के प्रयोग का उद्धार-संबंधी बल दोनों स्पष्ट रहते हैं।
- source_word: κατάρας / κατάρα
  choice: शाप / शाप बनकर
  rationale: एक ही मूल संज्ञा की पुनरावृत्ति को बनाए रखते हुए वाचा और दण्ड से जुड़ा उसका तीखा बल सुरक्षित रखा गया है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: संदर्भ में मूसा की व्यवस्था अभिप्रेत है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ νόμος का स्वाभाविक और पहचाना हुआ रूप है।
- source_word: γενόμενος
  choice: बनकर
  rationale: कृदन्त को साधनसूचक ढंग से व्यक्त करता है और बताता है कि छुड़ाना उसके हमारे लिए शाप बनने के द्वारा हुआ।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: यह लाभ और प्रतिनिधित्व दोनों की सम्भावना खुली रखता है तथा मुख्य पाठ में ‘हमारी जगह’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ὅτι γέγραπται
  choice: इसलिए कि लिखा है
  rationale: आने वाले शास्त्रीय उद्धरण को आधार के रूप में प्रस्तुत करता है और यूनानी संयोजक के कारणसूचक अथवा व्याख्यात्मक संबंध को कठोरता से एक ही दिशा में नहीं बाँधता।
- source_word: Ἐπικατάρατος
  choice: शापित
  rationale: यह सामान्य आधुनिक हिन्दी में स्वाभाविक है और मूल का न्यायिक तथा शास्त्रीय बल बनाए रखता है।
- source_word: κρεμάμενος
  choice: लटका है
  rationale: वर्तमान कृदन्त की सामान्य कथन-शैली को सहज हिन्दी में व्यक्त करता है, बिना यह अनावश्यक रूप से तय किए कि लटकाने वाला कौन है।
- source_word: ξύλου
  choice: पेड़
  rationale: ξύλον का अर्थ लकड़ी भी हो सकता है, पर यहाँ व्यवस्थाविवरण के शास्त्रीय उद्धरण से संबंध बनाए रखने के लिए ‘पेड़’ उपयुक्त है।
theological_decisions:
- issue: प्रायश्चित-संबंधी भाषा में ὑπὲρ ἡμῶν का दायरा
  choice: हमारे लिए
  alternative: हमारी ओर से; हमारी जगह
  rationale: पद लाभ और प्रतिनिधित्व को स्पष्ट करता है, पर ὑπέρ अपने आप में केवल एक विशिष्ट प्रायश्चित-सिद्धान्त को अनिवार्य नहीं बनाता; इसलिए व्यापकता सुरक्षित रखी गई है।
- issue: मसीह का ‘शाप बनना’
  choice: शाप बनकर
  alternative: शापित होकर
  rationale: पौलुस ने विशेषण के बजाय संज्ञा κατάρα का तीखा प्रयोग किया है। ‘शाप बनकर’ उसी तनाव को बनाए रखता है और उसे नरम करके केवल ‘शापित’ नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मोल लेकर छुड़ा लिया’ मूल के मुक्ति और मूल्य-चुकाने, दोनों भावों को स्पष्ट करता है। ‘व्यवस्था’, ‘शाप’ और ‘मसीह’ जैसे परिचित बाइबलीय शब्द प्रसंग की गंभीरता और अंतर्पाठीय संबंध बनाए रखते हैं।
