source:
  edition: SBLGNT
  text: ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/022.yaml
  text: But the Scripture imprisoned everything under sin[b][a], so that the promise by faith in Jesus the Messiah might be given to those who believe.
translation:
  language: hi
  text: परन्तु पवित्रशास्त्र ने सब कुछ पाप के अधीन कैद कर दिया[a], ताकि यीशु मसीह पर विश्वास के द्वारा प्रतिज्ञा उन लोगों को दी जाए जो विश्वास करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रशास्त्र ने सब कुछ पाप के अधीन बन्द कर दिया।”
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि यीशु मसीह की विश्वासयोग्यता के द्वारा प्रतिज्ञा उन लोगों को दी जाए जो विश्वास करते हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: बन्द कर दिया
  rationale: यह यूनानी क्रिया के घेरकर रोक रखने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; फुटनोट में अधिक स्पष्ट कारावास-सदृश विकल्प दिया गया है।
- source_word: ἡ γραφή
  choice: पवित्रशास्त्र
  rationale: एकवचन में प्रयुक्त इस अभिव्यक्ति को पौलुस द्वारा एकीकृत और क्रियाशील साक्षी के रूप में पवित्रशास्त्र के मानवीकरण सहित व्यक्त करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन की व्यापकता बनाए रखता है और अर्थ को केवल मनुष्यों तक सीमित नहीं करता।
- source_word: ὑπὸ ἁμαρτίαν
  choice: पाप के अधीन
  rationale: पाप के नीचे वश अथवा बन्धन में होने का रूपक बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
- source_word: ἡ ἐπαγγελία
  choice: प्रतिज्ञा
  rationale: मूल संज्ञा का सीधा, प्रचलित और धर्मशास्त्रीय रूप से तटस्थ हिन्दी समतुल्य है।
- source_word: ἐκ πίστεως Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह पर विश्वास के द्वारा
  rationale: मुख्य पाठ में विवादित सम्बन्धकारक को कर्मवाचक अर्थ में लिया गया है; यीशु मसीह की विश्वासयोग्यता वाला सम्भव अर्थ फुटनोट में सुरक्षित है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यीशु के साथ प्रयुक्त उपाधि का हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाने वाला अनुवाद है।
- source_word: δοθῇ
  choice: दी जाए
  rationale: ἵνα के बाद आए निष्क्रिय संभावनार्थक क्रियारूप को हिन्दी में उद्देश्यसूचक ढंग से व्यक्त करता है।
- source_word: τοῖς πιστεύουσιν
  choice: उन लोगों को ... जो विश्वास करते हैं
  rationale: कृदन्त के सक्रिय और वर्णनात्मक भाव को बनाए रखता है, इसे केवल एक स्थिर पहचान-सूचक संज्ञा नहीं बनाता।
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ सम्बन्धकारक रचना
  choice: 'कर्मवाचक सम्बन्ध: “यीशु मसीह पर विश्वास”'
  alternative: 'कर्तृवाचक सम्बन्ध: “यीशु मसीह की विश्वासयोग्यता”'
  rationale: यूनानी रचना वास्तव में दोनों अर्थों के लिए विवादित है। मुख्य पाठ सामान्य कर्मवाचक अर्थ अपनाता है, जबकि दूसरे सम्भव अर्थ को फुटनोट में रखकर धर्मशास्त्रीय तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास रखा गया है। “सब कुछ” मूल की व्यापकता, “पाप के अधीन” अधीनता का रूपक, और “बन्द कर दिया” घेरकर रोकने का भाव बनाए रखते हैं। दोनों फुटनोट-चिह्न मुख्य पाठ में सम्बद्ध पदबंधों के निकट रखे गए हैं।
