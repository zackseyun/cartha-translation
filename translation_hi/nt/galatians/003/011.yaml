  choice: “धर्मी विश्वास से जीवित रहेगा”
  alternative: “जो विश्वास से धर्मी है, वह जीवित रहेगा”
  rationale: यूनानी पदबंध व्याकरणतः ‘धर्मी’ या ‘जीवित रहेगा’ से जोड़ा जा सकता है। मुख्य पाठ पारंपरिक और सहज संबंध को रखता है, जबकि दूसरी सम्भावना टिप्पणी में दी गई है ताकि वास्तविक अस्पष्टता न मिटे।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: इस पौलुसी संदर्भ में ‘विश्वास’ मुख्य अर्थ के रूप में स्वाभाविक है, पर हबक्कूक के उद्धरण की पृष्ठभूमि में ‘विश्वासयोग्यता’ भी सम्भव है; इसलिए उसे टिप्पणी में सुरक्षित रखा गया है।
- issue: δικαιοῦται का न्यायिक अर्थ
  choice: धर्मी ठहराया जाता
  alternative: निर्दोष ठहराया जाता
  rationale: ‘धर्मी ठहराना’ न्यायिक घोषणा का भाव रखता है और केवल नैतिक परिवर्तन का अर्थ आरोपित नहीं करता।
