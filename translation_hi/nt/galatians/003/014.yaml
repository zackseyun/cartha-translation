id: GAL.3.14
reference: Galatians 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν ⸂Χριστῷ Ἰησοῦ⸃, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/014.yaml
  text: so that the blessing of Abraham might come to the Gentiles in Messiah Jesus[c][b][a], so that we might receive the promise of the Spirit through faith.
translation:
  language: hi
  text: ताकि मसीह यीशु[b] में अब्राहम की आशीष गैर-यहूदियों[a] तक पहुँचे, और ताकि हम विश्वास के द्वारा आत्मा की प्रतिज्ञा प्राप्त करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों तक।”
    reason: lexical_alternative
  - marker: b
    text: परंपरागत रूप से, “ख्रीस्त यीशु।”
    reason: lexical_alternative
  - marker: c
    text: या, “वह आत्मा जिसकी प्रतिज्ञा की गई है।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: दोनों उपवाक्यों में उद्देश्य व्यक्त करता है; दो बार ‘ताकि’ रखने से यूनानी की दोहरी उद्देश्य-संरचना स्पष्ट रहती है।
- source_word: εἰς τὰ ἔθνη
  choice: गैर-यहूदियों तक
  rationale: इस पौलुसी संदर्भ में ἔθνη मुख्यतः यहूदियों से भिन्न लोगों को दर्शाता है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए स्पष्ट है; ‘जातियों/राष्ट्रों’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἡ εὐλογία τοῦ Ἀβραὰμ
  choice: अब्राहम की आशीष
  rationale: स्वाभाविक हिन्दी में वह आशीष व्यक्त होती है जो अब्राहम से संबद्ध है और आसपास के तर्क में प्रतिज्ञा से जुड़ी है।
- source_word: γένηται
  choice: पहुँचे
  rationale: इस प्रसंग में γίνομαι का आशय आशीष का गैर-यहूदियों को उपलब्ध होना है; ‘पहुँचे’ हिन्दी में स्वाभाविक रूप से यह गति और उपलब्धता व्यक्त करता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν की संघात्मक/क्षेत्रगत भाषा को ‘में’ से बनाए रखा गया है। Χριστός की उपाधिगत शक्ति के लिए ‘मसीह’ उपयुक्त और हिन्दी में प्रचलित है।
- source_word: τὴν ἐπαγγελίαν τοῦ πνεύματος
  choice: आत्मा की प्रतिज्ञा
  rationale: यूनानी संबंधकारक संरचना को खुला रखा गया है, ताकि इसे बिना आवश्यकता ‘प्रतिज्ञा किया हुआ आत्मा’ के रूप में निश्चित न किया जाए। वह संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: λάβωμεν
  choice: हम ... प्राप्त करें
  rationale: ἵνα के अधीन उद्देश्यसूचक भाव को ‘ताकि हम ... प्राप्त करें’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς πίστεως
  choice: विश्वास के द्वारा
  rationale: साधन या माध्यम का अर्थ स्पष्ट करता है और πίστις के सामान्य धार्मिक अर्थ ‘विश्वास’ को बनाए रखता है।
theological_decisions:
- issue: Χριστῷ को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु / क्राइस्ट जीसस
  rationale: इस वाक्य में अब्राहम की प्रतिज्ञा और आशीष का संदर्भ उपाधि ‘मसीह’ की शक्ति को सक्रिय रखता है। ‘मसीह यीशु’ आधुनिक हिन्दी में स्वाभाविक और व्यापक रूप से समझा जाता है।
- issue: τοῦ πνεύματος संबंधकारक का अर्थ
  choice: आत्मा की प्रतिज्ञा
  alternative: प्रतिज्ञा किया हुआ आत्मा
  rationale: मुख्य पाठ यूनानी की व्याकरणिक अस्पष्टता को बनाए रखता है; प्रसंगानुकूल अधिक व्याख्यात्मक अर्थ को पादटिप्पणी में रखा गया है।
- issue: ἐν Χριστῷ Ἰησοῦ का संबंध
  choice: मसीह यीशु में
  alternative: मसीह यीशु के द्वारा
  rationale: ‘में’ पौलुस की संघात्मक भाषा को सीधे सुरक्षित रखता है; ‘के द्वारा’ साधनात्मक अर्थ को अधिक निश्चित कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘गैर-यहूदी’ को अपेक्षाकृत पारदर्शी आधुनिक पद के रूप में चुना गया है; ‘अन्यजाति’ जैसे अधिक कलीसियाई शब्द से बचा गया। ‘आत्मा की प्रतिज्ञा’ जानबूझकर थोड़ी औपचारिक है, क्योंकि यह मूल यूनानी की वास्तविक व्याकरणिक और धर्मवैचारिक खुलावट को सुरक्षित रखती है।
