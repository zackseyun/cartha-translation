id: GAL.3.5
reference: Galatians 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/005.yaml
  text: So then[a], does the one who supplies the Spirit to you and works miracles among you do so by works of the law[b], or by hearing with faith?
translation:
  language: hi
  text: तो फिर, जो तुम्हें आत्मा प्रदान करता है और तुम्हारे बीच[b] सामर्थ्य के कार्य करता है, क्या वह यह व्यवस्था के कामों से करता है, या विश्वास के साथ सुनने से[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास का संदेश सुनने से,” अथवा “संदेश को विश्वास के साथ सुनने से।”
    reason: alternative_reading
  - marker: b
    text: या, “तुम्हारे भीतर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιχορηγῶν
  choice: प्रदान करता
  rationale: यह वर्तमान कृदंत में निहित लगातार उपलब्ध कराने के भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: यूनानी में निश्चित संदर्भ और पौलुस के प्रयोग के अनुसार यह परमेश्वर के आत्मा की ओर संकेत करता है; मूल से आगे बढ़कर मुख्य पाठ में ‘पवित्र’ नहीं जोड़ा गया।
- source_word: ἐνεργῶν δυνάμεις
  choice: सामर्थ्य के काम करता
  rationale: यह δυνάμεις के ‘सामर्थ्यपूर्ण कार्य/चमत्कार’ अर्थ को अपेक्षाकृत औपचारिक ढंग से बनाए रखता है और केवल असाधारण चिन्हों तक अर्थ सीमित नहीं करता।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: गलाती समुदायों में होने वाले प्रत्यक्ष सामर्थ्यपूर्ण कामों के संदर्भ में यह स्वाभाविक है; ‘तुम्हारे भीतर’ भी व्याकरणतः संभव है और पाद-टिप्पणी में रखा गया है।
- source_word: ἐξ ἔργων νόμου
  choice: व्यवस्था के कामों के कारण
  rationale: ἐξ के स्रोत/आधार के भाव को प्रश्न के हिन्दी वाक्य-विन्यास में स्पष्ट करता है और पौलुस की विशिष्ट अभिव्यक्ति ‘व्यवस्था के काम’ सुरक्षित रखता है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: संदर्भ में यह मूसा की व्यवस्था की ओर संकेत करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और परिचित है।
- source_word: ἀκοῆς πίστεως
  choice: विश्वास के साथ सुनने
  rationale: संक्षिप्त और कुछ अस्पष्ट संबंधवाचक रचना को ऐसे सुनने के रूप में व्यक्त करता है जो विश्वास से जुड़ा है; अन्य संभावित अर्थ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस विरोध में πίστις का सबसे स्वाभाविक अर्थ ‘विश्वास’ है; ‘विश्वासयोग्यता’ यहाँ कम संभावित है।
theological_decisions:
- issue: ἀκοῆς πίστεως का वाक्यगत संबंध एक से अधिक निकट अर्थों में समझा जा सकता है।
  choice: विश्वास के साथ सुनने के कारण
  alternative: विश्वास की बात सुनने के कारण; या विश्वास से सुने हुए संदेश के कारण
  rationale: मुख्य पाठ व्यवस्था के कामों और विश्वास से जुड़े सुनने के बीच पौलुस का विरोध स्पष्ट रखता है, जबकि यूनानी संबंधवाचक पद की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित रहती है।
- issue: ἐν ὑμῖν सामुदायिक क्षेत्र या व्यक्तियों के भीतर की क्रिया, दोनों का संकेत दे सकता है।
  choice: तुम्हारे बीच
  alternative: तुम्हारे भीतर
  rationale: सामुदायिक संदर्भ में ‘बीच’ अधिक स्वाभाविक है, पर आत्मा की भीतरी क्रिया का संभावित अर्थ दबाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। पौलुस की प्रश्नात्मक शैली और ‘व्यवस्था के काम’ जैसी प्रमुख अभिव्यक्ति बनाए रखी गई है। मुख्य पाठ में सभी पाद-टिप्पणी चिह्न अपेक्षित स्थान पर होने चाहिए; ἐν ὑμῖν के बाद [b] रखा गया है।
