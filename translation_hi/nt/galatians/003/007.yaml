  yaml_path: translation/nt/galatians/003/007.yaml
  text: Know, then, that those of faith—these are Abraham’s sons.
translation:
  language: hi
  text: इसलिए जान लो कि जो विश्वास से हैं—वे ही अब्राहम के पुत्र हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκετε
  choice: जान लो
  rationale: वर्तमान काल के आदेशात्मक रूप को स्वाभाविक और प्रत्यक्ष हिन्दी आज्ञा के रूप में व्यक्त करता है।
- source_word: ἄρα
  choice: इसलिए
  rationale: पिछले तर्क से निकाले गए निष्कर्ष का संकेत देता है।
- source_word: οἱ ἐκ πίστεως
  choice: जो विश्वास से हैं
  rationale: पौलुस की संक्षिप्त अभिव्यक्ति को बिना यह जोड़कर समझाए कि विश्वास कोई कर्म, जीवन-पद्धति या मानवीय योग्यता है, उसकी मूल अस्पष्टता सहित रखता है।
- source_word: οὗτοι
  choice: वे ही
  rationale: यूनानी संकेतवाचक सर्वनाम के बलाघात को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: υἱοί
  choice: पुत्र
  rationale: यूनानी के संबंधपरक और उत्तराधिकार-सूचक 'sons' को अधिक सामान्य 'संतान' में विलीन किए बिना सुरक्षित रखता है।
theological_decisions:
- issue: अब्राहम के परिवार में कौन सम्मिलित है
  choice: जो विश्वास से हैं—वे ही अब्राहम के पुत्र हैं
  alternative: जो विश्वास करते हैं, वे अब्राहम की संतान हैं
  rationale: चुना हुआ पाठ ἐκ πίστεως की पौलुसी संरचना और οὗτοι के विशेष बल को बनाए रखता है तथा संबंध को केवल जैविक वंश या सामान्य विश्वास-क्रिया तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त हिन्दी। वाक्य में डैश यूनानी οὗτοι के पुनरुक्त, बलाघाती निष्कर्ष को स्पष्ट करता है।
