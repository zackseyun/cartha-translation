base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/012.yaml
  text: But the law is not from faith[a]; rather[b], “The one who does them will live by them.”
translation:
  language: hi
  text: 'परन्तु व्यवस्था विश्वास से नहीं है; बल्कि: “जो इन बातों को करता है, वह इनके द्वारा[a] जीवित रहेगा।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह इनमें जीवित रहेगा।”
    reason: lexical_alternative
  - marker: b
    text: लैव्यव्यवस्था 18:5 से उद्धरण।
    reason: cross_reference
lexical_decisions:
- source_word: νόμος
  choice: व्यवस्था
  rationale: पौलुस के व्यापक प्रयोग को बनाए रखते हुए सन्दर्भ में मूसा की व्यवस्था को दृष्टि में रहने देता है।
- source_word: ἐκ πίστεως
  choice: विश्वास से
  rationale: ‘से’ स्रोत या आधार के भाव को सीधे व्यक्त करता है और व्यवस्था तथा विश्वास के बीच पौलुस के विरोध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह तीखे विरोध को स्वाभाविक हिन्दी में व्यक्त करके शास्त्रीय उद्धरण का परिचय देता है।
- source_word: ὁ ποιήσας αὐτά
  choice: जो इन बातों को करता है
  rationale: सामान्य एकवचन कर्ता और αὐτά के व्यवस्था की आज्ञाओं की ओर संकेत—दोनों को स्पष्ट, पर अनावश्यक रूप से विशिष्ट किए बिना व्यक्त करता है।
- source_word: ζήσεται ἐν αὐτοῖς
  choice: इनके द्वारा जीवित रहेगा
  rationale: ἐν को यहाँ साधन या आधार के अर्थ में प्रस्तुत किया गया है; अधिक शाब्दिक ‘इनमें’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: व्यवस्था और विश्वास के बीच पौलुस का विरोध
  choice: “व्यवस्था विश्वास से नहीं है”
  alternative: “व्यवस्था विश्वास पर आधारित नहीं है” अथवा “व्यवस्था विश्वास के सिद्धान्त पर नहीं चलती”
  rationale: चुना हुआ पाठ यूनानी के निकट रहकर धर्मवैज्ञानिक तनाव को बनाए रखता है और किसी विशिष्ट व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप; ‘व्यवस्था’ बाइबलीय सन्दर्भ में परिचित है। उद्धरण में सामान्य और कालातीत कथन के लिए ‘जो…करता है’ तथा भविष्यसूचक ‘जीवित रहेगा’ रखा गया है।
