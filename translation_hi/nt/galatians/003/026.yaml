id: GAL.3.26
reference: Galatians 3:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/026.yaml
  text: For you are all sons of God through faith in Messiah Jesus[a][b].
translation:
  language: hi
  text: क्योंकि तुम सब मसीह यीशु में विश्वास के द्वारा परमेश्वर के पुत्र[a] हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘पुत्र’ है; यह पुत्रत्व और उत्तराधिकार के दर्जे पर बल देता है। यहाँ ‘तुम सब’ पूरी संबोधित मंडली को समाविष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्यांश का अर्थ ‘मसीह यीशु में विश्वास के द्वारा’ भी हो सकता है, और ‘विश्वास के द्वारा, मसीह यीशु में [होते हुए]’ भी।
    reason: source_ambiguity
lexical_decisions:
- source_word: πάντες
  choice: तुम सब
  rationale: द्वितीय पुरुष बहुवचन ἐστε के साथ πάντες पूरी संबोधित मंडली को समाविष्ट करता है; ‘तुम सब’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का आधार या कारण देता है; ‘क्योंकि’ उसके संयोजक और व्याख्यात्मक बल को बनाए रखता है।
- source_word: υἱοὶ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: υἱοί का सीधा अर्थ ‘पुत्र’ है और यह पौलुस के पुत्रत्व, पारिवारिक दर्जे और उत्तराधिकार के भाव को सुरक्षित रखता है।
- source_word: διὰ τῆς πίστεως
  choice: विश्वास के द्वारा
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम बताता है; ‘विश्वास के द्वारा’ इस अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν के लिए ‘में’ पौलुस की मसीह के साथ संबंध/एकता की भाषा को बनाए रखता है। Χριστός उपाधि है, इसलिए हिन्दी में प्रचलित अर्थवाही रूप ‘मसीह’ चुना गया है।
theological_decisions:
- issue: लिंगसूचक पुत्रत्व की भाषा
  choice: परमेश्वर के पुत्र
  alternative: परमेश्वर की संतान
  rationale: मूल यूनानी में υἱοί (‘पुत्र’) है। इसे रखना पुत्रत्व तथा उत्तराधिकार के विशेष भाव को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि ‘तुम सब’ के कारण यह दर्जा पूरी संबोधित मंडली के लिए है।
- issue: ἐν Χριστῷ Ἰησοῦ का संबंध
  choice: मसीह यीशु में विश्वास के द्वारा
  alternative: विश्वास के द्वारा, मसीह यीशु में
  rationale: यूनानी शब्दक्रम में यह पदबंध ‘विश्वास’ के विषय (‘मसीह यीशु में विश्वास’) अथवा मसीह में होने की स्थिति से जुड़ा समझा जा सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी वास्तविक वाक्यगत संभावना को सुरक्षित रखती है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: Χριστός यहाँ उपाधि है। ‘मसीह’ आधुनिक हिन्दी बाइबिलीय प्रयोग में परिचित है और ‘अभिषिक्त जन’ की उपाधि को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम सब’ सामूहिक संबोधन को स्पष्ट करता है; ‘पुत्र’ मूल के पारिवारिक और उत्तराधिकार-संबंधी भाव को बनाए रखता है।
