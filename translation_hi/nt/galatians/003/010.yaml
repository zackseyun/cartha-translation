source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ⸀ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ⸀ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/010.yaml
  text: For all who are of works of the law are under a curse[a], for it is written, “Cursed is everyone who does not remain in all the things written in the book of the law[b], to do them.”
translation:
  language: hi
  text: क्योंकि जितने लोग व्यवस्था के कामों पर आधारित हैं, वे शाप के अधीन हैं[a]; क्योंकि लिखा है, “शापित है हर वह व्यक्ति जो व्यवस्था की पुस्तक में लिखी हुई सभी बातों का पालन करते हुए उन्हें पूरा करने में लगा नहीं रहता[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था के कामों पर भरोसा रखते हैं।”
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “व्यवस्था की पुस्तक में लिखी हुई सभी बातों में बना नहीं रहता, उन्हें करने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅσοι γὰρ
  choice: क्योंकि जितने लोग
  rationale: बहुवचन के व्यापक दायरे और γάρ के व्याख्यात्मक संबंध—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξ ἔργων νόμου
  choice: व्यवस्था के कामों पर आधारित हैं
  rationale: ἐκ की आधार अथवा स्रोत-सूचक शक्ति को व्यक्त करता है और केवल मानसिक ‘भरोसा रखने’ तक अर्थ को सीमित नहीं करता।
- source_word: ὑπὸ κατάραν
  choice: शाप के अधीन हैं
  rationale: शाप के वश अथवा दंडाधीन स्थिति को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी में निश्चित उपपद न होने के कारण किसी पहले से निर्दिष्ट ‘उस शाप’ को नहीं मानता।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्रीय उद्धरण का प्रचलित सूत्र है और यूनानी पूर्णकाल के वर्तमान प्रामाणिक प्रभाव को संक्षेप में रखता है।
- source_word: Ἐπικατάρατος πᾶς ὃς
  choice: शापित है हर वह व्यक्ति जो
  rationale: सार्वभौमिक दायरे को स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ ἐμμένει πᾶσιν τοῖς γεγραμμένοις
  choice: लिखी हुई सभी बातों पर चलने में लगा नहीं रहता
  rationale: ἐμμένω की निरंतर बने रहने की धारणा और आज्ञापालन के व्यावहारिक आशय, दोनों को व्यक्त करता है।
- source_word: ἐν τῷ βιβλίῳ τοῦ νόμου
  choice: व्यवस्था की पुस्तक में
  rationale: ‘पुस्तक’ आधुनिक पाठक के लिए स्वाभाविक है और पारंपरिक शास्त्रीय पदबंध को बनाए रखता है।
- source_word: τοῦ ποιῆσαι αὐτά
  choice: उन पर चलने में
  rationale: हिन्दी मुहावरे में नियमों को ‘करना’ अस्वाभाविक है; ‘उन पर चलना’ वास्तविक पालन को व्यक्त करता है और वाक्य में ἐμμένει तथा ποιῆσαι के संयुक्त आशय को सहजता से समेटता है।
theological_decisions:
- issue: ἐξ ἔργων νόμου का अर्थ
  choice: व्यवस्था के कामों पर आधारित हैं
  alternative: व्यवस्था के कामों पर भरोसा रखते हैं; व्यवस्था के कामों से हैं
  rationale: यह चयन पौलुस के पदबंध में आधार/पहचान की धारणा को बनाए रखता है, पर इसे केवल व्यक्तिगत मानसिक भरोसे की व्याख्या में नहीं बदलता। वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- issue: व्यवस्था की समग्र माँग
  choice: सभी बातों पर चलने में लगा नहीं रहता
  alternative: लिखी हुई हर बात को पूरा नहीं करता
  rationale: πᾶσιν और ἐμμένει की समग्रता तथा निरंतरता दोनों सुरक्षित रहती हैं; पाठ यह नहीं बताता कि विफलता की मात्रा या स्वरूप क्या है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘व्यवस्था’ को νόμος के लिए रखा गया है। मुख्य पाठ में अत्यधिक शब्दशः और अस्वाभाविक ‘बातों में बना रहता’ के स्थान पर ‘बातों पर चलने में लगा रहता’ है; अधिक शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
