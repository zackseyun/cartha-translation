- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: यह नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप है।
- source_word: ἐπίστευσεν τῷ θεῷ
  choice: परमेश्वर पर विश्वास किया
  rationale: πιστεύω के साथ सम्प्रदान कारक का आशय परमेश्वर को विश्वसनीय मानकर उनकी बात पर भरोसा करना है; प्रचलित हिन्दी अभिव्यक्ति इस आशय को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐλογίσθη
  choice: गिना गया
  rationale: कर्मवाच्य रूप और लेखे अथवा मान्यता में गिने जाने का भाव सुरक्षित रहता है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सम्प्रदान कारक उस व्यक्ति को सूचित करता है जिसके पक्ष में यह गणना हुई।
- source_word: εἰς δικαιοσύνην
  choice: धार्मिकता गिना गया
  rationale: यह पौलुस के उद्धरण में परिणाम अथवा मान्य स्थिति का भाव रखता है और δικαιοσύνη का स्थापित, व्यापक हिन्दी प्रतिशब्द देता है।
theological_decisions:
- issue: पौलुस के उद्धरण में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस संदर्भ में अब्राहम के लिए गिनी गई सही स्थिति या धार्मिकता मुख्य भाव है; फिर भी शब्द के ‘न्याय’ संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐπίστευσεν τῷ θεῷ में विश्वास का संबंध
  choice: परमेश्वर पर विश्वास किया
  alternative: परमेश्वर की बात पर विश्वास किया
  rationale: मूल पाठ में स्पष्ट कर्म ‘बात’ नहीं है; इसलिए उसे मुख्य पाठ में जोड़ने के बजाय यूनानी संरचना की संक्षिप्तता और व्यापकता बनाए रखी गई है।
