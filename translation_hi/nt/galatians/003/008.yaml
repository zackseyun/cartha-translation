language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/008.yaml
  text: 'And the Scripture[a], foreseeing that God justifies the nations by faith[b], proclaimed the good news beforehand to Abraham: “In you all the nations will be blessed.”'
translation:
  language: hi
  text: 'और पवित्रशास्त्र ने पहले से यह देखकर कि परमेश्वर विश्वास के आधार पर राष्ट्रों को धर्मी ठहराता है[a], अब्राहम को पहले ही शुभ समाचार सुनाया[b]: “तुझ में सब राष्ट्र आशीष पाएँगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गैर-यहूदियों को”; यूनानी शब्द ἔθνη का अर्थ “राष्ट्र” या “गैर-यहूदी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अब्राहम को पहले ही सुसमाचार सुनाया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προϊδοῦσα
  choice: पहले से यह देखकर
  rationale: यह अओरिस्ट कृदंत मुख्य क्रिया से पहले की दृष्टि या पूर्वज्ञान को व्यक्त करता है। यह अनुवाद पवित्रशास्त्र के मानवीकरण और कालगत अर्थ, दोनों को बनाए रखता है।
- source_word: ἡ γραφή
  choice: पवित्रशास्त्र
  rationale: पौलुस के प्रयोग में यह किसी सामान्य लेख के बजाय अधिकारपूर्ण धर्मग्रंथ को दर्शाता है; हिन्दी में ‘पवित्रशास्त्र’ स्वाभाविक और प्रतिष्ठित पद है।
- source_word: ἐκ πίστεως
  choice: विश्वास के आधार पर
  rationale: ἐκ यहाँ आधार या माध्यम का भाव देता है। यह वाक्यांश ‘विश्वास से’ की अपेक्षा इस संबंध को कुछ अधिक स्पष्ट करता है, पर अर्थ का विस्तार नहीं करता।
- source_word: δικαιοῖ
  choice: धर्मी ठहराता है
  rationale: यह पौलुस के न्यायिक अर्थ को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है, बिना इसे केवल नैतिक रूप से धर्मी बनाने के अर्थ में सीमित किए।
- source_word: τὰ ἔθνη ... πάντα τὰ ἔθνη
  choice: जातियों ... सब जातियाँ
  rationale: दोनों स्थानों पर एक ही हिन्दी मूल रखने से पौलुस के कथन और अब्राहम से की गई प्रतिज्ञा के बीच का शब्दगत संबंध दिखाई देता है। ‘जातियाँ’ का अर्थ यहाँ जनसमूह/राष्ट्र हैं, सामाजिक जाति-व्यवस्था नहीं।
- source_word: προευηγγελίσατο
  choice: पहले ही शुभ समाचार सुनाया
  rationale: यह क्रिया पूर्वघोषणा और εὐαγγελ- अर्थात शुभ समाचार, दोनों भावों को समेटती है। हिन्दी पद सामान्य पाठक के लिए सहज है।
- source_word: τῷ Ἀβραὰμ
  choice: अब्राहम को
  rationale: सम्प्रदान कारक का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Ἐνευλογηθήσονται
  choice: आशीष पाएँगी
  rationale: यह भविष्यकालीन कर्मवाच्य प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है; ‘आशीषित की जाएँगी’ अधिक कृत्रिम होता।
- source_word: ἐν σοὶ
  choice: तुझमें
  rationale: यूनानी पूर्वसर्ग और उत्पत्ति की प्रतिज्ञा के प्रतिनिधिक/वाचागत शब्दरूप को निकटता से सुरक्षित रखता है, बिना ‘तेरे द्वारा’ जैसा व्याख्यात्मक निर्णय किए।
theological_decisions:
- issue: ἔθνη का अर्थ ‘जातियाँ/राष्ट्र’ रखा जाए या ‘गैर-यहूदी’
  choice: दोनों occurrences में ‘जातियाँ’
  alternative: पहली बार ‘गैर-यहूदी’ और उद्धरण में ‘जातियाँ’
  rationale: संदर्भ में गैर-यहूदियों का आशय संभव है, फिर भी एक ही शब्द दोहराने से धर्मी ठहराए जाने वाले लोगों और अब्राहम की प्रतिज्ञा में सम्मिलित सभी जनसमूहों के बीच पौलुस का स्पष्ट संबंध सुरक्षित रहता है।
- issue: δικαιόω को संक्षिप्त धार्मिक पद से या स्पष्ट न्यायिक वाक्यांश से व्यक्त करना
  choice: धर्मी ठहराता है
  alternative: धर्मी बनाता है
  rationale: ‘धर्मी ठहराता है’ न्यायिक घोषणा के भाव को सुरक्षित रखता है और इस प्रश्न को अनावश्यक रूप से नहीं सुलझाता कि इस घोषणा के सभी रूपांतरकारी परिणाम कैसे समझे जाएँ।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और धर्मग्रंथ-पाठ के अनुकूल रूप अपनाया गया है। उद्धरण में ‘तुझमें’ जानबूझकर रखा गया है ताकि अब्राहम से कही गई प्रतिज्ञा का एकवचन और पारंपरिक गंभीरता बनी रहे। ‘जातियाँ’ को सामाजिक जाति-व्यवस्था के अर्थ में नहीं, विभिन्न जनसमूहों/राष्ट्रों के अर्थ में पढ़ा जाना चाहिए; इसी संभावित अस्पष्टता के लिए पादटिप्पणी दी गई है।
