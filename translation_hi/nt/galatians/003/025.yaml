id: GAL.3.25
reference: Galatians 3:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/025.yaml
  text: But now that faith has come[b][a], we are no longer under a guardian.
translation:
  language: hi
  text: पर अब जब विश्वास आ गया है[a], तो हम संरक्षक[b] के अधीन नहीं रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब जब वह विश्वास आ गया है।”
    reason: यूनानी में ‘विश्वास’ के साथ निश्चित उपपद है; यह प्रसंग में उस प्रकट हुए विश्वास अथवा विश्वास के नए युग पर बल दे सकता है।
  - marker: b
    text: यूनानी शब्द उस घरेलू संरक्षक या निरीक्षक को दर्शाता है जो किसी नाबालिग की देखरेख और अनुशासन करता था; वह मुख्यतः कक्षा में पढ़ाने वाला शिक्षक नहीं था।
    reason: प्राचीन सामाजिक भूमिका को स्पष्ट करने वाला सांस्कृतिक नोट।
lexical_decisions:
- source_word: ἐλθούσης
  choice: अब जब ... आ गया है
  rationale: संबंधकारक निरपेक्ष रचना में आया एओरिस्ट कृदंत समय-सूचक है। यह अनुवाद आगमन की पूर्णता और उसके वर्तमान परिणाम—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में वर्णित व्यवस्था की निगरानी और अब की स्थिति के बीच हल्का विरोध तथा संक्रमण दिखाता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις को उसके सामान्य अर्थ ‘विश्वास’ में रखा गया है। प्रसंग में इसका आगमन उद्धार-इतिहास के नए चरण की ओर भी संकेत करता है, पर मुख्य पाठ उस संकेत को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: οὐκέτι
  choice: नहीं रहे
  rationale: यह पहले की स्थिति के समाप्त हो जाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ
  choice: के अधीन
  rationale: यह निगरानी और अधिकार के नीचे होने की पौलुस की उपमा को बनाए रखता है।
- source_word: παιδαγωγόν
  choice: संरक्षक
  rationale: παιδαγωγός प्राचीन घराने में नाबालिग की देखरेख और अनुशासन करने वाला व्यक्ति था; वह मुख्यतः कक्षा में पढ़ाने वाला शिक्षक नहीं था। ‘संरक्षक’ आधुनिक पाठक के लिए इस भूमिका का सबसे स्पष्ट संक्षिप्त शब्द है।
- source_word: ἐσμεν
  choice: हम ... नहीं रहे
  rationale: वर्तमानकालीन εἰμί को οὐκέτι के साथ मिलाकर हिन्दी में पूर्व स्थिति की समाप्ति और वर्तमान दशा को सहज रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ‘विश्वास के आने’ का अर्थ
  choice: मुख्य पाठ में ‘विश्वास आ गया है’
  alternative: ‘वह विश्वास आ गया है’
  rationale: यूनानी में πίστις के साथ निश्चित उपपद है और प्रसंग उद्धार-इतिहास में मसीह से जुड़े विश्वास के प्रकट होने का संकेत दे सकता है। फिर भी ‘विश्वास’ अधिक स्वाभाविक हिन्दी है और व्यक्ति के विश्वास तथा विश्वास के नए युग के बीच की वास्तविक अर्थगत व्यापकता को खुला रखता है। वैकल्पिक निश्चित रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘संरक्षक के अधीन’ मूल उपमा को बनाए रखता है, जबकि ‘नहीं रहे’ हिन्दी में οὐκέτι ἐσμεν का स्वाभाविक रूप है।
