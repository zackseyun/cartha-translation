id: GAL.3.18
reference: Galatians 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ δι’ ἐπαγγελίας κεχάρισται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/018.yaml
  text: For if the inheritance is from the law[a], it is no longer from a promise; but God has graciously given it to Abraham through a promise.
translation:
  language: hi
  text: क्योंकि यदि विरासत व्यवस्था से मिलती है, तो फिर वह प्रतिज्ञा से नहीं मिलती; परन्तु परमेश्वर ने अब्राहम को प्रतिज्ञा के द्वारा उसे अनुग्रहपूर्वक दे दिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने अब्राहम को प्रतिज्ञा के द्वारा यह कृपापूर्वक प्रदान किया है।”
    reason: κεχάρισται का अनुवाद “कृपापूर्वक प्रदान किया है” भी किया जा सकता है; मुख्य पाठ अधिक सामान्य हिन्दी में उसी अनुग्रहपूर्ण भाव को व्यक्त करता है।
lexical_decisions:
- source_word: κληρονομία
  choice: विरासत
  rationale: यह पौलुस के तर्क में वारिस के रूप में मिलने वाली वस्तु को व्यक्त करता है और आधुनिक हिन्दी में सहज तथा स्पष्ट है।
- source_word: νόμου / ἐκ νόμου
  choice: व्यवस्था से
  rationale: यह मूसा की व्यवस्था की ओर संकेत करता है और ἐκ के स्रोत या आधार के भाव को प्रतिज्ञा के साथ किए गए विरोध में बनाए रखता है।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञा
  rationale: यह अब्राहम से की गई परमेश्वर की प्रतिज्ञा के लिए मानक और संदर्भानुकूल हिन्दी शब्द है।
- source_word: οὐκέτι
  choice: फिर ... नहीं
  rationale: 'यह οὐκέτι के बहिष्कारी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है: यदि विरासत व्यवस्था से है, तो वह प्रतिज्ञा से नहीं है।'
- source_word: δι’ ἐπαγγελίας
  choice: प्रतिज्ञा के द्वारा
  rationale: यह διά के माध्यम-सूचक भाव को सुरक्षित रखता है और व्यवस्था तथा प्रतिज्ञा के बीच पौलुस के विरोध को स्पष्ट रखता है।
- source_word: κεχάρισται
  choice: अनुग्रहपूर्वक दे दिया है
  rationale: यह पूर्णकाल के वर्तमान-प्रासंगिक परिणाम और χαρίζομαι में निहित कृपापूर्ण, नि:शुल्क देने के भाव—दोनों को व्यक्त करता है।
- source_word: τῷ Ἀβραὰμ
  choice: अब्राहम को
  rationale: सम्प्रदान कारक को स्वाभाविक हिन्दी में प्राप्तकर्ता के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: χαρίζομαι में अनुग्रह के भाव को स्पष्ट करना
  choice: “अनुग्रहपूर्वक दे दिया है”
  alternative: “प्रदान किया है” या “दे दिया है”
  rationale: क्रिया में स्वयं कृपापूर्ण देने का भाव है। उसे स्पष्ट करना व्यवस्था और प्रतिज्ञा के बीच पौलुस के तर्क को उभारता है, पर किसी अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: विरासत के आधार के रूप में व्यवस्था और प्रतिज्ञा का परस्पर बहिष्कार
  choice: “यदि ... व्यवस्था से ... तो फिर ... प्रतिज्ञा से नहीं”
  alternative: दोनों को विरासत मिलने के पूरक साधन मानना
  rationale: οὐκέτι इस वाक्य में दोनों आधारों के बीच स्पष्ट निषेधात्मक विरोध स्थापित करता है; अनुवाद उस तनाव को यथावत रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “व्यवस्था,” “प्रतिज्ञा,” “विरासत” और “अनुग्रहपूर्वक” जैसे स्थापित बाइबलीय शब्द संदर्भगत स्पष्टता के लिए रखे गए हैं।
