  text: इसलिए व्यवस्था मसीह तक[b] हमारा संरक्षक[a] बन गई है, ताकि हम विश्वास के द्वारा धर्मी ठहराए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘संरक्षक’ से आशय उस घरेलू अभिभावक या निगरानी करने वाले से है जो बालक की देखरेख करता था; यह शब्द मुख्यतः कक्षा में पढ़ाने वाले शिक्षक के लिए नहीं था।
    reason: lexical_alternative
