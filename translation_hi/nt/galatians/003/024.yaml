    text: ‘मसीह तक’ का शाब्दिक भाव ‘मसीह की ओर’ भी हो सकता है; इसलिए इसे ‘मसीह तक पहुँचाने वाली’ भूमिका के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यहाँ ὥστε पिछले तर्क से निकले निष्कर्ष को प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: गलातियों के संदर्भ में यह मूसा की व्यवस्था को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ सटीक और परिचित है।
- source_word: παιδαγωγὸς ἡμῶν
  choice: हमारी संरक्षक
  rationale: παιδαγωγός यूनानी-रोमी समाज में बालक की देखरेख और निगरानी करने वाले घरेलू अभिभावक को कहता था, मुख्यतः अध्यापक को नहीं। ‘संरक्षक’ उस भूमिका को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γέγονεν
  choice: बनी रही
  rationale: पूर्णकाल अतीत में स्थापित और आगे तक प्रभावी रही अवस्था दिखाता है। संदर्भ में ‘बनी रही’ व्यवस्था की अस्थायी संरक्षक भूमिका को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς Χριστόν
  choice: मसीह तक
  rationale: εἰς दिशा, लक्ष्य या सीमा का बोध करा सकता है। निकटवर्ती संदर्भ में ‘मसीह तक’ अस्थायी और लक्ष्याभिमुख दोनों आयामों को यथासंभव बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य बताता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐκ πίστεως
  choice: विश्वास के द्वारा
  rationale: यहाँ वाक्यांश साधन या आधार व्यक्त करता है; ‘विश्वास के द्वारा’ पौलुस के कथन को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: δικαιωθῶμεν
  choice: धर्मी ठहराए जाएँ
  rationale: यह निष्क्रिय विधिलिंग रूप है। ‘धर्मी ठहराए जाएँ’ न्यायिक अर्थ और निष्क्रियता दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: εἰς Χριστόν में व्यवस्था और मसीह के संबंध का अर्थ
  choice: मसीह तक
  alternative: मसीह की ओर / मसीह तक पहुँचाने वाली
  rationale: गलातियों 3 का संदर्भ व्यवस्था की सीमित अवधि पर बल देता है, जबकि εἰς लक्ष्य या दिशा भी व्यक्त कर सकता है। मुख्य पाठ में ‘मसीह तक’ रखा गया है और वैकल्पिक लक्ष्याभिमुख अर्थ पादटिप्पणी में सुरक्षित है।
- issue: δικαιόω का अनुवाद
  choice: धर्मी ठहराए जाएँ
  alternative: धर्मी किए जाएँ
  rationale: ‘धर्मी ठहराना’ क्रिया के न्यायिक आयाम को स्पष्ट रखता है, पर पाठ इससे आगे धार्मिक प्रणालीगत निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय रूप अपनाया गया है। ‘व्यवस्था’, ‘मसीह’, ‘विश्वास’ और ‘धर्मी ठहराए जाएँ’ जैसे परिचित पद रखे गए हैं; παιδαγωγός को भ्रामक ‘शिक्षक’ के बजाय ‘संरक्षक’ कहा गया है।
