  text: Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις ⸀οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς δι’ ἀγγέλων ἐν χειρὶ μεσίτου·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/019.yaml
  text: Why then the law? It was added because of transgressions until the seed should come to whom the promise had been made[c][b][a], having been ordained through angels by the hand of a mediator.
translation:
  language: hi
  text: तो फिर व्यवस्था क्यों दी गई? वह अपराधों के कारण[b] जोड़ी गई, जब तक वह बीज[a] न आ जाए जिससे प्रतिज्ञा की गई थी; उसे स्वर्गदूतों के द्वारा एक मध्यस्थ के हाथ से ठहराया गया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सन्तान,” “वंश,” या “वंशज।”
    reason: lexical_alternative
  - marker: b
    text: “अपराधों के कारण” का अर्थ अपराधों से निपटने, उन्हें प्रकट करने, या उन्हें रोकने के लिए हो सकता है; यूनानी पाठ इससे अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: c
    text: या “व्यवस्थित किया गया” अथवा “विधिवत नियोजित किया गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ὁ νόμος;
  choice: तो फिर व्यवस्था क्यों दी गई?
  rationale: यूनानी का यह संक्षिप्त प्रश्न इस प्रसंग में व्यवस्था के उद्देश्य के विषय में है। हिन्दी में ‘क्यों दी गई?’ इसे स्वाभाविक ढंग से व्यक्त करता है, बिना आगे बताए गए कारण को पहले से निर्धारित किए।
- source_word: νόμος
  choice: व्यवस्था
  rationale: यहाँ पौलुस की चर्चा मूसा की व्यवस्था से है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित और प्रसंगानुकूल शब्द है।
- source_word: τῶν παραβάσεων χάριν
  choice: अपराधों के कारण
  rationale: यह कारण अथवा प्रयोजन दोनों की सम्भावना खुली रखता है और यह तय नहीं करता कि व्यवस्था अपराधों को रोकने, प्रकट करने या किसी अन्य रीति से उनसे निपटने के लिए दी गई थी।
- source_word: προσετέθη
  choice: जोड़ी गई थी
  rationale: यह προστίθημι के पूरक रूप से जोड़े जाने के भाव को सीधे और सहज हिन्दी में व्यक्त करता है।
- source_word: ἄχρις οὗ ἔλθῃ
  choice: उस समय तक के लिए ... जब तक ... न आ जाए
  rationale: यह व्यवस्था के जोड़े जाने की समय-सीमा और प्रतीक्षित भावी आगमन, दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: τὸ σπέρμα
  choice: वह सन्तान
  rationale: ‘सन्तान’ बीज/वंश की वाचा-संबंधी भाषा तथा एकवचन रूप को पर्याप्त रूप से बनाए रखता है, साथ ही आधुनिक हिन्दी में ‘बीज’ से अधिक स्वाभाविक है। शाब्दिक और अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ᾧ ἐπήγγελται
  choice: जिसको प्रतिज्ञा दी गई थी
  rationale: दत्तिव संबंध को प्राप्तकर्ता के रूप में व्यक्त करता है और पूर्णकाल के पूर्व में दी गई, अब भी प्रभावी प्रतिज्ञा के भाव को बनाए रखता है।
- source_word: διαταγεὶς
  choice: स्थापित की गई थी
  rationale: यह व्यवस्था के विधिवत नियोजित अथवा ठहराए जाने का भाव आधुनिक, बोधगम्य हिन्दी में देता है; वैकल्पिक अधिक औपचारिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: δι’ ἀγγέλων
  choice: स्वर्गदूतों के द्वारा
  rationale: διά के माध्यम अथवा अभिकरण के भाव और व्यवस्था दिए जाने की मध्यस्थता को सुरक्षित रखता है।
- source_word: ἐν χειρὶ μεσίτου
  choice: एक मध्यस्थ के हाथ से
  rationale: यूनानी के ठोस मुहावरे ‘हाथ में/हाथ से’ को बनाए रखते हुए मध्यस्थ के माध्यम से किए जाने का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ‘अपराधों के कारण’ का आशय
  choice: व्यापक वाक्यांश ‘अपराधों के कारण’ रखा गया है।
  alternative: अपराधों को रोकने के लिए; अपराधों को प्रकट करने के लिए; अपराधों के संदर्भ में
  rationale: यूनानी वाक्यांश संक्षिप्त है और यह अधिक संकीर्ण रूप से नहीं बताता कि व्यवस्था अपराधों को रोकती, उजागर करती या उनसे किसी अन्य प्रकार से संबंधित होती है।
- issue: पौलुस के तर्क में σπέρμα का अनुवाद
  choice: मुख्य पाठ में ‘सन्तान’
  alternative: बीज; वंश; वंशज
  rationale: ‘सन्तान’ अब्राहम की प्रतिज्ञा से शब्दगत संबंध, एकवचन की तर्कगत भूमिका और हिन्दी की स्वाभाविकता के बीच संतुलन रखता है; शाब्दिक ‘बीज’ पादटिप्पणी में सुरक्षित है।
- issue: व्यवस्था दिए जाने में मध्यस्थता
  choice: ‘स्वर्गदूतों के द्वारा एक मध्यस्थ के हाथ से’
  alternative: स्वर्गदूतों के माध्यम से एक मध्यस्थ द्वारा
  rationale: मूल पाठ में मध्यस्थता की दोनों परतों और ‘हाथ’ के ठोस मुहावरे को बनाए रखा गया है, बिना मध्यस्थ की पहचान पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘व्यवस्था,’ ‘प्रतिज्ञा,’ ‘स्वर्गदूत’ और ‘मध्यस्थ’ जैसे परिचित धर्मग्रन्थीय शब्द बनाए गए हैं। वाक्य को हिन्दी में पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है, पर मूल के सभी संबंध सुरक्षित हैं।
