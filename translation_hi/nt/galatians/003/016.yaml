id: GAL.3.16
reference: Galatians 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλ’ ὡς ἐφ’ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/003/016.yaml
  text: The promises were spoken to Abraham and to his offspring[a]. It does not say, “And to offsprings,” as referring to many, but as referring to one[c][b], “And to your offspring,” who is Messiah.
translation:
  language: hi
  text: ये प्रतिज्ञाएँ अब्राहम और उसकी संतान[a] से कही गई थीं। वह यह नहीं कहता, “और तेरी संतानों[b] से,” मानो बहुतों की बात हो रही हो; बल्कि मानो एक की बात हो, “और तेरी संतान से,” जो मसीह[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पूरे पद में ‘बीज’; यूनानी में एकवचन सामूहिक संज्ञा है, जो पौलुस के तर्क का केंद्र है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में, “और बीजों से”; पौलुस शब्द के बहुवचन रूप को उभारता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘ख्रीस्त’।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐρρέθησαν
  choice: कही गई थीं
  rationale: λέγω के कर्मवाच्य बहुवचन को स्वाभाविक हिन्दी में व्यक्त करता है और प्रतिज्ञाओं के वचन रूप में दिए जाने का भाव बनाए रखता है।
- source_word: ἐπαγγελίαι
  choice: प्रतिज्ञाएँ
  rationale: परमेश्वर के दिए हुए वचनों के लिए प्रचलित, स्पष्ट और पौलुस की शब्दावली के अनुरूप हिन्दी शब्द।
- source_word: σπέρμα / σπέρματι
  choice: वंश
  rationale: हिन्दी में ‘वंश’ स्वाभाविक रूप से सामूहिक और रूपतः एकवचन है; इससे यूनानी एकवचन सामूहिक संज्ञा और पौलुस के तर्क, दोनों को सुरक्षित रखा जाता है।
- source_word: τοῖς σπέρμασιν
  choice: वंशों
  rationale: जानबूझकर बहुवचन रखा गया है, क्योंकि पौलुस का तर्क एकवचन और बहुवचन के अंतर पर निर्भर है।
- source_word: ὡς ἐπὶ πολλῶν
  choice: मानो बहुतों की बात हो रही हो
  rationale: यूनानी वाक्यांश का संदर्भगत अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀλλ’ ὡς ἐφ’ ἑνός
  choice: बल्कि मानो एक की बात हो
  rationale: पहले वाक्यांश के समानांतर रहते हुए एक की ओर संकेत करने पर बल देता है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ अभिषिक्त उद्धारकर्ता की उपाधि सक्रिय है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और प्रतिष्ठित रूप है।
theological_decisions:
- issue: प्रतिज्ञा के ‘वंश’ की मसीह से पहचान
  choice: जो मसीह है
  alternative: जिसका अर्थ मसीह है / जो ख्रीष्ट है
  rationale: ὅς ἐστιν Χριστός का सीधा संबंधवाचक कथन सुरक्षित रखा गया है; इसे केवल शब्दार्थ-स्पष्टीकरण बनाकर पौलुस की स्पष्ट पहचान को कमजोर नहीं किया गया।
- issue: σπέρμα के सामूहिक और व्यक्तिगत अर्थ का तनाव
  choice: ‘वंश’ को पूरे पद में बनाए रखना
  alternative: सन्तान / वंशज
  rationale: ‘वंश’ सामूहिक अर्थ भी रख सकता है और यहाँ एक विशिष्ट व्यक्ति की ओर भी लागू हो सकता है, इसलिए पौलुस के तर्क में उपस्थित वास्तविक अर्थगत तनाव को समय से पहले हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण है। उद्धृत बहुवचन ‘वंशों’ हिन्दी में कुछ असामान्य जान पड़ता है, पर मूल यूनानी के जानबूझकर किए गए व्याकरणिक विरोध को दिखाने के लिए आवश्यक है। δέ को अलग शब्द से नहीं अनूदित किया गया, क्योंकि यहाँ हिन्दी में उसका हल्का संयोजक/विषयांतर बल संदर्भ से स्वाभाविक रूप से प्रकट होता है।
