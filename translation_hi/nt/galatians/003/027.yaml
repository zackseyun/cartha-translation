    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσοι
  choice: तुममें से जितनों ने
  rationale: यूनानी के परिमाण-सूचक संबंधवाचक भाव को बनाए रखते हुए गलातियों को किए गए प्रत्यक्ष संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन के साथ व्याख्यात्मक संबंध बनाए रखता है।
- source_word: εἰς
  choice: में
  rationale: ‘मसीह में बपतिस्मा’ हिन्दी का स्वाभाविक और प्रचलित रूप है तथा मसीह से जुड़ने या उसमें सम्मिलित होने के भाव को बिना अतिरिक्त धर्मसैद्धांतिक व्याख्या के सुरक्षित रखता है।
- source_word: Χριστόν
  choice: मसीह
  rationale: Χριστός के अभिषिक्त उद्धारकर्ता वाले पदनाम को व्यक्त करने वाला मानक और व्यापक रूप से समझा जाने वाला हिन्दी शब्द है।
- source_word: ἐβαπτίσθητε
  choice: बपतिस्मा लिया है
  rationale: यूनानी रूप भूतकालीन घटना को वर्तमान परिणाम से जोड़ता है; हिन्दी में यह मानक धार्मिक पद है और बपतिस्मे की किसी विशेष विधि को निर्धारित नहीं करता।
- source_word: ἐνεδύσασθε
  choice: पहन लिया है
  rationale: वस्त्र धारण करने के रूपक को संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: क्या बपतिस्मे की भाषा किसी विशिष्ट संस्कार-सिद्धांत या बपतिस्मे की विधि को अनिवार्य ठहराए।
  choice: मसीह में बपतिस्मा लिया है
  alternative: मसीह में डुबकी लगाई गई है / मसीह के संबंध में बपतिस्मा लिया है
  rationale: मूल पाठ मसीह में सम्मिलित होने का भाव रखता है, पर बाद के विवादों में संस्कार की प्रभावशीलता या जल में डुबाने की विशिष्ट विधि का निर्णय स्वयं नहीं करता।
- issue: ‘मसीह को पहन लेना’ रूपक का अर्थ स्पष्ट करके सीमित किया जाए या नहीं।
  choice: मसीह को पहन लिया है
  alternative: मसीह के समान हो गए हैं / मसीह से ढक गए हैं
  rationale: मूल का सशक्त वस्त्र-रूपक बनाए रखा गया है, ताकि पहचान, संबंध और जीवन-परिवर्तन जैसे संभावित अर्थों में से किसी एक को अनावश्यक रूप से अंतिम न बनाया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कलीसियाई पाठकों के लिए परिचित रूप। ‘बपतिस्मा’ और ‘मसीह’ प्रचलित शब्द हैं; वाक्य में मूल यूनानी का व्याख्यात्मक संबंध और वस्त्र-रूपक सुरक्षित हैं।
