language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/005.yaml
  text: To them we did not yield in submission even for a moment[b][a], so that the truth of the gospel might remain for you.
translation:
  language: hi
  text: हम उनके आगे अधीन होकर एक पल के लिए भी नहीं झुके[a], ताकि सुसमाचार का सत्य तुम्हारे लिए बना रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “एक घड़ी के लिए भी नहीं”; यह “एक पल के लिए भी नहीं” के अर्थ में प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे बीच बना रहे।”
    reason: alternative_reading
lexical_decisions:
- source_word: οἷς
  choice: उनके आगे
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद में बताए गए लोगों की ओर संकेत करता है; हिन्दी में “उनके आगे” अगले क्रियापद के साथ स्वाभाविक है।
- source_word: οὐδὲ πρὸς ὥραν
  choice: एक पल के लिए भी नहीं
  rationale: शाब्दिक अर्थ “एक घड़ी के लिए भी नहीं” है, पर यह थोड़े-से समय का मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में उसका बल स्पष्ट करता है।
- source_word: εἴξαμεν
  choice: नहीं झुके
  rationale: क्रिया का अर्थ दबाव के आगे झुकना या हार मानना है; यह अगले संज्ञा-पद “अधीन होकर” को दोहराए बिना सक्रिय अस्वीकार को व्यक्त करता है।
- source_word: τῇ ὑποταγῇ
  choice: अधीन होकर
  rationale: करण/रीति-सूचक दत्तिव को स्वाभाविक हिन्दी में व्यक्त करता है और आज्ञापालनपूर्ण अधीनता का भाव बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य को सूचित करता है; “ताकि” आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἡ ἀλήθεια τοῦ εὐαγγελίου
  choice: सुसमाचार का सत्य
  rationale: पौलुस के महत्त्वपूर्ण पदबंध को संक्षिप्त रूप में सुरक्षित रखता है; “सुसमाचार” εὐαγγέλιον का प्रचलित और बोधगम्य हिन्दी रूप है।
- source_word: διαμείνῃ
  choice: बना रहे
  rationale: यह क्रिया निरन्तर बने रहने या सुरक्षित रहने का भाव देती है; “बना रहे” उद्देश्यवाचक वाक्य में स्वाभाविक है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे लिए
  rationale: यह गलातियों की ओर सम्बन्ध अथवा उनके हित का भाव व्यक्त कर सकता है; “तुम्हारे लिए” उस लाभार्थक अर्थ को सामने रखता है, जबकि “तुम्हारे बीच” भी सम्भव है।
theological_decisions:
- issue: विरोधियों के प्रति पौलुस के इनकार का आशय
  choice: पौलुस कहता है कि वे उनके आगे अधीन होकर बिल्कुल नहीं झुके, ताकि सुसमाचार का सत्य सुरक्षित बना रहे।
  alternative: इसे केवल पौलुस की व्यक्तिगत अधीनता के इनकार या केवल किसी संस्थागत रियायत के इनकार तक सीमित समझना।
  rationale: यूनानी पाठ “अधीनता में झुकने” का व्यापक कथन करता है और यह निश्चित नहीं करता कि बात केवल व्यक्तिगत थी या संस्थागत; अनुवाद इस तनाव को खुला रखता है।
- issue: πρὸς ὑμᾶς का सम्बन्ध
  choice: तुम्हारे लिए
  alternative: तुम्हारे बीच / तुम्हारे साथ
  rationale: पूर्वसर्ग गलातियों के हित या उनकी ओर सम्बन्ध को व्यक्त कर सकता है। मुख्य पाठ लाभार्थक अर्थ लेता है, पर स्थानिक/सहवर्ती सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। “झुके” और “अधीन होकर” का संयोजन मूल के εἴξαμεν तथा τῇ ὑποταγῇ दोनों को अलग-अलग अभिव्यक्त करता है। पादटिप्पणी-चिह्न सम्बद्ध पदों के तुरन्त बाद रखे गए हैं।
