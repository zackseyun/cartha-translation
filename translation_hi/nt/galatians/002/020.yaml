source:
  edition: SBLGNT
  text: ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ ⸂υἱοῦ τοῦ θεοῦ⸃ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/020.yaml
  text: And it is no longer I who live[a], but Messiah lives in me. And the life that I now live in the flesh, I live by faith in the Son of God, who loved me and gave himself for me.
translation:
  language: hi
  text: अब मैं जीवित नहीं हूँ, बल्कि मसीह मुझमें जीवित हैं। और जो जीवन मैं अब शरीर में जीता हूँ, उसे परमेश्वर के पुत्र पर विश्वास के द्वारा जीता हूँ[a], जिन्होंने मुझसे प्रेम किया और मेरे लिए अपने आप को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के पुत्र की विश्वासयोग्यता के द्वारा जीता हूँ।”
    reason: πίστις के साथ संबंधकारक पदबंध का कर्तृगत अर्थ भी सम्भव है।
lexical_decisions:
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; आधुनिक हिन्दी बाइबल-भाषा में ‘मसीह’ स्वाभाविक, प्रतिष्ठित और व्यापक रूप से बोधगम्य है।
- source_word: ὃ δὲ νῦν ζῶ
  choice: अब मैं ... जो जीवन जीता हूँ
  rationale: यूनानी का नपुंसकलिंगी संबंधवाचक प्रयोग संक्षिप्त और मुहावरेदार है; हिन्दी में निहित ‘जीवन’ को स्पष्ट करना अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν σαρκί
  choice: शरीर में
  rationale: यह वाक्यांश वर्तमान देहधारी सांसारिक जीवन को दर्शाता है। ‘शरीर में’ हिन्दी में ‘देह में’ की अपेक्षा अधिक सामान्य है और यहाँ ‘पापी स्वभाव’ का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: πίστει
  choice: विश्वास
  rationale: πίστις का सामान्य अर्थ यहाँ ‘विश्वास’ रखा गया है; संबंधकारक पदबंध से उत्पन्न वैकल्पिक ‘विश्वासयोग्यता’ का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: τῇ τοῦ υἱοῦ τοῦ θεοῦ
  choice: परमेश्वर के पुत्र पर विश्वास करके
  rationale: मुख्य पाठ में संबंधकारक को वस्तुगत अर्थ में लिया गया है—पुत्र पर रखा गया विश्वास। हिन्दी में ‘पर ... विश्वास’ स्वाभाविक है; कर्तृगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ
  choice: अपने आप को मेरे लिए दे दिया
  rationale: यह आत्म-समर्पण और प्रतिनिधिक हित दोनों को सरल, गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘अपने आप को सौंप दिया’ अधिक शाब्दिक, पर यहाँ अपेक्षाकृत कम स्वाभाविक है।
theological_decisions:
- issue: τῇ τοῦ υἱοῦ τοῦ θεοῦ में πίστις और संबंधकारक का अर्थ
  choice: परमेश्वर के पुत्र पर विश्वास करके
  alternative: परमेश्वर के पुत्र की विश्वासयोग्यता के द्वारा
  rationale: यूनानी रचना वस्तुगत संबंधकारक (‘पुत्र पर विश्वास’) या कर्तृगत संबंधकारक (‘पुत्र की विश्वासयोग्यता’) दोनों समझी जा सकती है। मुख्य पाठ में अधिक सामान्य और सहज अर्थ रखा गया है, जबकि वास्तविक व्याकरणिक और धर्मवैचारिक अस्पष्टता पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘मसीह’ प्रचलित धार्मिक उपाधि के रूप में रखा गया है। आदरसूचक बहुवचन क्रियाएँ (‘हैं’, ‘जिन्होंने’) हिन्दी में मसीह के प्रति सम्मान दर्शाती हैं, बिना मूल पाठ में कोई अतिरिक्त सैद्धान्तिक दावा जोड़े।
