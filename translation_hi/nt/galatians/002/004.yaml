  text: διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς ⸀καταδουλώσουσιν—
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/004.yaml
  text: But because of the false brothers secretly brought in[a], who slipped in to spy out our freedom that we have in Messiah Jesus[b], so that they might enslave us—
translation:
  language: hi
  text: पर उन गुप्त रूप से भीतर लाए गए झूठे भाइयों[a] के कारण, जो मसीह यीशु में हमें प्राप्त हमारी उस स्वतंत्रता की टोह लेने के लिए चुपके से घुस आए थे, ताकि वे हमें दास बना लें—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “झूठे भाई” से आशय ऐसे लोगों से है जो अपने को साथी विश्वासी बताते थे।
    reason: cultural_note
lexical_decisions:
- source_word: παρεισάκτους
  choice: चुपके से लाए गए
  rationale: विशेषण के रूप में बाहर से गुप्त रीति से भीतर लाए जाने का भाव रखता है और अगले क्रियापद से अलग बना रहता है।
- source_word: ψευδαδέλφους
  choice: झूठे भाइयों
  rationale: पौलुस की पारिवारिक संबोधन-छवि और तीखे विवादात्मक भाव को बनाए रखता है; आशय ऐसे लोगों से है जो स्वयं को सहविश्वासी बताते थे।
- source_word: παρεισῆλθον
  choice: चुपके से घुस आए थे
  rationale: गुप्त प्रवेश का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατασκοπῆσαι
  choice: टोह लेने
  rationale: विरोधी उद्देश्य से गुप्त निरीक्षण करने का सशक्त भाव रखता है।
- source_word: ἐλευθερίαν
  choice: स्वतंत्रता
  rationale: समकालीन, स्वाभाविक शब्द है और पौलुस के धार्मिक तथा सामाजिक आशय को बनाए रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में मिली
  rationale: Χριστός को उपाधि के रूप में ‘मसीह’ रखा गया है; हिन्दी में संबंध स्पष्ट करने के लिए ‘मिली’ जोड़ा गया है।
- source_word: καταδουλώσουσιν
  choice: दास बना लें
  rationale: किसी को दासता के अधीन कर देने का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ἵνα ... καταδουλώσουσιν
  choice: ताकि वे हमें दास बना लें
  rationale: ἵνα के उद्देश्यसूचक भाव को सहज हिन्दी में रखता है; असामान्य भावी निर्देशार्थक रूप को अनावश्यक रूप से कठोर नहीं बनाता।
theological_decisions:
- issue: Χριστῷ को उपाधि के रूप में या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: इस प्रसंग में Χριστός की उपाधिमूलक शक्ति सुनाई देती है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय भाषा में अर्थपूर्ण और व्यापक रूप से समझा जाता है।
- issue: ψευδαδέλφους में पारिवारिक भाषा को बनाए रखना
  choice: झूठे भाई
  alternative: झूठे विश्वासी
  rationale: ‘भाई’ मूल की पारिवारिक छवि और पौलुस की विवादात्मक तीक्ष्णता को बचाता है, जबकि टिप्पणी यह स्पष्ट करती है कि वे अपने को सहविश्वासी बताते थे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य के अंत का दीर्घ विराम मूल यूनानी की अपूर्ण वाक्य-संरचना को दर्शाता है, जो अगले पद में आगे बढ़ती है।
