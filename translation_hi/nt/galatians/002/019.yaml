revisions:
- from: क्योंकि व्यवस्था के द्वारा मैं व्यवस्था के लिए मर गया, ताकि मैं परमेश्वर के लिए जीऊँ। मैं मसीह के साथ क्रूस पर चढ़ाया गया हूँ।
  to: क्योंकि व्यवस्था के द्वारा मैं व्यवस्था के प्रति मर गया, ताकि मैं परमेश्वर के लिए जीऊँ। मैं मसीह के साथ क्रूस पर चढ़ाया गया हूँ।
  rationale: The sole revision corrects the Hindi rendering of the second occurrence of νόμος. ‘व्यवस्था के प्रति मर गया’ communicates ‘died to the law’ and avoids the contrary sense ‘died for the law.’ The compact and theologically unexpanded wording of the Greek is otherwise retained.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T01:49:52Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the instrumental sense of διὰ νόμου, the purpose clause, and the perfect passive συνεσταύρωμαι. However, ‘व्यवस्था के लिए मर गया’ normally means ‘died for the law’ in Hindi and does not convey the Greek idiom ἀπέθανον νόμῳ, ‘died to the law,’ that is, death with respect to its jurisdiction.
  naturalness: The sentence is clear and suitably formal. Replacing ‘के लिए’ with ‘के प्रति’ yields a natural Hindi equivalent of ‘died to the law’ while retaining the source’s compactness.
  terminology: ‘व्यवस्था,’ ‘परमेश्वर,’ ‘मसीह,’ and ‘क्रूस पर चढ़ाया गया हूँ’ are appropriate modern-standard Hindi biblical terminology. ‘मसीह’ properly retains the titular sense of Χριστῷ.
  issues:
  - severity: high
    issue: ‘व्यवस्था के लिए मर गया’ reverses the intended relation of νόμῳ.
    rationale: In modern Hindi, ‘X के लिए मरना’ ordinarily means dying on behalf of X. The Greek dative in ἀπέθανον νόμῳ expresses dying ‘to’ or ‘with respect to’ the law, not dying for its benefit. ‘व्यवस्था के प्रति मर गया’ preserves this relation without supplying an interpretation.
  revised_text: क्योंकि व्यवस्था के द्वारा मैं व्यवस्था के प्रति मर गया, ताकि मैं परमेश्वर के लिए जीऊँ। मैं मसीह के साथ क्रूस पर चढ़ाया गया हूँ।
  revised_footnotes: []
  revision_rationale: The sole revision corrects the Hindi rendering of the second occurrence of νόμος. ‘व्यवस्था के प्रति मर गया’ communicates ‘died to the law’ and avoids the contrary sense ‘died for the law.’ The compact and theologically unexpanded wording of the Greek is otherwise retained.
