  yaml_path: translation/nt/galatians/002/019.yaml
  text: For through the law I died to the law, so that I might live to God. I have been crucified with Messiah.
translation:
  language: hi
  text: क्योंकि व्यवस्था के द्वारा मैं व्यवस्था के प्रति मर गया, ताकि मैं परमेश्वर के लिए जीऊँ। मैं मसीह के साथ क्रूस पर चढ़ाया गया हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार और स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में तर्क-संबंध को स्वाभाविक रूप से बनाए रखता है।
- source_word: διὰ νόμου
  choice: व्यवस्था के द्वारा
  rationale: διά के संबंधकारक प्रयोग का साधनवाचक अर्थ सुरक्षित रहता है। प्रसंग में νόμος से मूसा की व्यवस्था अभिप्रेत है, इसलिए ‘व्यवस्था’ उपयुक्त है।
- source_word: νόμῳ
  choice: व्यवस्था के लिए
  rationale: यह दत्तिव संबंध को संक्षिप्त रूप में रखता है और ‘व्यवस्था के द्वारा ... व्यवस्था के लिए’ की जानबूझकर रखी गई समानता तथा धर्मवैचारिक तनाव को बनाए रखता है।
- source_word: ἀπέθανον
  choice: मैं ... मर गया
  rationale: अनिश्चित भूतकाल को एक निर्णायक अतीत की घटना के रूप में व्यक्त करता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य का भाव आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: θεῷ ζήσω
  choice: मैं परमेश्वर के लिए जीऊँ
  rationale: दत्तिव का संबंधपरक और दिशात्मक भाव सहज हिन्दी में व्यक्त करता है; इसे केवल परमेश्वर के काम आने के अर्थ तक सीमित नहीं करता।
- source_word: Χριστῷ
  choice: मसीह के साथ
  rationale: Χριστός की उपाधिगत पहचान को ‘मसीह’ सुरक्षित रखता है; दत्तिव यहाँ σύν-युक्त क्रिया के साथ सहभागिता दर्शाता है।
- source_word: συνεσταύρωμαι
  choice: क्रूस पर चढ़ाया गया हूँ
  rationale: पूर्णकाल एक घटित क्रूसारोपण और उसके वर्तमान में बने हुए परिणाम—दोनों को व्यक्त करता है; ‘गया हूँ’ हिन्दी में इस बल को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: व्यवस्था के विषय में पौलुस के संक्षिप्त कथन को कितना स्पष्ट किया जाए
  choice: ‘व्यवस्था के द्वारा मैं व्यवस्था के लिए मर गया’ की संक्षिप्त संरचना बनाए रखी गई।
  alternative: ‘व्यवस्था की दण्डाज्ञा के द्वारा मैं व्यवस्था के अधिकार से मुक्त होकर मर गया’ या ‘मैं विधि-पालन के लिए मर गया।’
  rationale: यूनानी कथन जानबूझकर संक्षिप्त और धर्मवैचारिक रूप से सघन है। विस्तार करने से किसी एक व्याख्या को मूल पाठ में जोड़ दिया जाता; वर्तमान रूप वास्तविक अस्पष्टता और तनाव को सुरक्षित रखता है।
- issue: Χριστός को नाम मानें या उपाधि
  choice: ‘मसीह’
  alternative: ‘ख्रीस्त’ या केवल व्यक्तिनाम-सदृश रूप
  rationale: यहाँ ‘मसीह’ स्रोत की उपाधिगत ध्वनि को सामान्य हिन्दी पाठक के लिए परिचित और अर्थपूर्ण रूप में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था के लिए मर गया’ सामान्य बोलचाल से कुछ अधिक सघन है, पर मूल पाठ की समानांतर रचना और उसकी वास्तविक धर्मवैचारिक अनिर्णीतता सुरक्षित रखने के लिए इसे जानबूझकर बनाए रखा गया है।
