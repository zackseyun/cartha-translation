source:
  edition: SBLGNT
  text: Ὅτε δὲ ἦλθεν ⸀Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/011.yaml
  text: But when Cephas came to Antioch[a], I opposed him to his face[b], because he stood condemned.
translation:
  language: hi
  text: पर जब कैफ़ा अन्ताकिया[a] आया, तो मैंने आमने-सामने उसका विरोध किया, क्योंकि वह दोषी ठहर चुका था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कैफ़ा, पतरस का अरामी नाम है।
    reason: cross_reference
  - marker: b
    text: या, “क्योंकि वह स्पष्ट रूप से गलत था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅτε δὲ
  choice: पर जब
  rationale: यह δέ के हल्के विरोध और ὅτε के समय-संबंध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: Κηφᾶς
  choice: कैफ़ा
  rationale: यूनानी पाठ में आए अरामी नाम के रूप को लिप्यंतरित किया गया है; परिचित नाम पतरस से उसकी पहचान पादटिप्पणी में दी गई है।
- source_word: ἦλθεν εἰς Ἀντιόχειαν
  choice: अन्ताकिया आया
  rationale: किसी नगर की ओर आने को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: κατὰ πρόσωπον αὐτῷ
  choice: उसके मुँह पर
  rationale: मूल के सजीव मुहावरे और आमने-सामने सीधे विरोध के भाव को सुरक्षित रखता है।
- source_word: ἀντέστην
  choice: मैंने ... उसका विरोध किया
  rationale: पौलुस द्वारा किए गए खुले और प्रत्यक्ष प्रतिरोध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: पौलुस के विरोध का कारण सीधे ढंग से प्रस्तुत करता है।
- source_word: κατεγνωσμένος ἦν
  choice: वह दोषी ठहर चुका था
  rationale: परिणामी अवस्था वाले परोक्ष क्रिया-रूप को बनाए रखता है और यह तय नहीं करता कि दोष किसने ठहराया; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: Κηφᾶς की पहचान और नाम का रूप
  choice: मुख्य पाठ में ‘कैफ़ा’
  alternative: पाठकों की परिचितता के लिए ‘पतरस’
  rationale: मूल यूनानी पाठ में Κηφᾶς है, इसलिए नाम के उसी रूप को लिप्यंतरित करना स्रोत के प्रति अधिक पारदर्शी है; पतरस से पहचान पादटिप्पणी में स्पष्ट है।
- issue: κατεγνωσμένος ἦν में दोष-निर्णय का भाव
  choice: ‘दोषी ठहर चुका था’
  alternative: ‘वह स्पष्ट रूप से गलत था’
  rationale: चुना हुआ रूप यूनानी के परोक्ष और परिणामी-अवस्था के भाव को सुरक्षित रखता है तथा दोष ठहराने वाले को अनावश्यक रूप से निर्दिष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसके मुँह पर’ मूल के प्रत्यक्ष टकराव वाले मुहावरे को बनाए रखता है; ‘दोषी ठहर चुका था’ जानबूझकर मूल की अस्पष्टता और परिणामी अवस्था को सुरक्षित रखता है।
