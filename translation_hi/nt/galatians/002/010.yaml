  text: only that we should remember the poor, which was exactly what I was eager to do.
translation:
  language: hi
  text: केवल इतना कि हम गरीबों को याद रखें—और ठीक यही करने के लिए मैं भी उत्सुक था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μόνον
  choice: केवल इतना
  rationale: यह सहमति के साथ जुड़ी एकमात्र अपेक्षा को सूचित करता है; हिंदी में ‘केवल इतना कि’ स्वाभाविक और सटीक है।
- source_word: τῶν πτωχῶν
  choice: गरीबों को
  rationale: πτωχός यहाँ आर्थिक अभाव में रहने वाले लोगों को दर्शाता है; ‘गरीबों’ इसका सीधा और सामान्य हिंदी रूप है।
- source_word: ἵνα μνημονεύωμεν
  choice: कि हम ... याद रखें
  rationale: ἵνα यहाँ एकमात्र अनुरोध की विषय-वस्तु बताता है। ‘याद रखें’ मूल क्रिया को बनाए रखता है और प्रसंग में व्यावहारिक चिंता का संकेत देता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ὃ
  choice: और ... यही
  rationale: संबंधवाचक सर्वनाम पिछले पूरे अनुरोध की ओर लौटता है। हिंदी में ‘और ठीक यही’ उस संबंध को सहज ढंग से व्यक्त करता है।
- source_word: ἐσπούδασα
  choice: मैं भी उत्सुक था
  rationale: क्रिया गंभीर तत्परता और सक्रिय इच्छा व्यक्त करती है; ‘उत्सुक था’ इस भाव को स्वाभाविक आधुनिक हिंदी में प्रस्तुत करता है।
- source_word: αὐτὸ τοῦτο ποιῆσαι
  choice: ठीक यही करने के लिए
  rationale: αὐτὸ τοῦτο का बल ‘इसी काम’ पर है; ‘ठीक यही’ उस विशेष जोर को हिंदी में सुरक्षित रखता है।
