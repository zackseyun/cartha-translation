id: GAL.2.17
reference: Galatians 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/017.yaml
  text: But if[a], while seeking to be justified in Messiah, we ourselves also were found to be sinners, is Messiah then a servant of sin? May it never be!
translation:
  language: hi
  text: पर यदि मसीह में धर्मी ठहराए जाने का प्रयत्न करते हुए हम स्वयं भी पापी पाए गए, तो क्या मसीह पाप का सेवक है? कदापि नहीं!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζητοῦντες
  choice: प्रयत्न करते हुए
  rationale: समकालिक कृदंत का भाव रखता है और मुख्य क्रिया की परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δικαιωθῆναι
  choice: धर्मी ठहराए जाने
  rationale: पौलुस के न्यायिक/घोषणात्मक प्रयोग को बनाए रखता है; केवल नैतिक रूप से धर्मी बनाए जाने का अर्थ आरोपित नहीं करता।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: ἐν की जानबूझकर व्यापकता और Χριστός के उपाधिगत अर्थ दोनों को सुरक्षित रखता है।
- source_word: εὑρέθημεν
  choice: पाए गए
  rationale: यूनानी कर्मवाच्य रूप और निष्कर्षात्मक अलंकारिक बल को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: καὶ αὐτοὶ ἁμαρτωλοί
  choice: हम स्वयं भी पापी
  rationale: αὐτοὶ का बल ‘स्वयं’ से और καί का समावेशी भाव ‘भी’ से स्पष्ट होता है।
- source_word: ἁμαρτίας διάκονος
  choice: पाप का सेवक
  rationale: διάκονος का सामान्य सेवा/साधन संबंधी अर्थ सहज हिन्दी में देता है और किसी औपचारिक कलीसियाई पद का संकेत नहीं करता।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: पौलुस की तीव्र अस्वीकृति को संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या प्रश्न का अनुवाद ऐसा हो कि मसीह को पाप कराने वाला कहा जाए
  choice: क्या मसीह पाप का सेवक है?
  alternative: क्या मसीह पाप को बढ़ावा देने वाला है?
  rationale: मूल पाठ एक अस्वीकार किए जाने वाले तार्किक निष्कर्ष को प्रश्न के रूप में रखता है। ‘सेवक’ διάκονος को सीधे व्यक्त करता है और कारणता की अतिरिक्त धारणा नहीं जोड़ता।
- issue: ἐν Χριστῷ के संबंध का स्वरूप
  choice: मसीह में
  alternative: मसीह के द्वारा
  rationale: ‘मसीह में’ मूल पूर्वसर्गीय अभिव्यक्ति की व्यापकता और पौलुस की संघ/क्षेत्र संबंधी धार्मिक तनावपूर्ण भाषा को सुरक्षित रखता है; ‘के द्वारा’ इसे केवल साधन के अर्थ में सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सामान्य पाठक के लिए स्पष्ट। ‘धर्मी ठहराया जाना’ पौलुस की घोषणात्मक शब्दावली को रखता है, और अंतिम वाक्य तीव्र अलंकारिक अस्वीकृति के रूप में दिया गया है।
