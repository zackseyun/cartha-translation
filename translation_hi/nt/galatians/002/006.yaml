  text: ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον ⸀θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/006.yaml
  text: But from those who were reputed to be something—whatever they once were makes no difference to me[a]; God shows no partiality—to me, indeed[c][b], those of reputation added nothing.
translation:
  language: hi
  text: परन्तु जो लोग कुछ माने जाते थे[a]—वे पहले चाहे जैसे भी रहे हों, इससे मुझे कोई अन्तर नहीं पड़ता; परमेश्वर किसी का पक्षपात नहीं करता[b]—जहाँ तक मेरा सम्बन्ध है, उन प्रतिष्ठित लोगों ने कुछ भी और नहीं जोड़ा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो लोग कुछ समझे जाते थे।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “परमेश्वर मनुष्य का मुख ग्रहण नहीं करता”; यह किसी का पक्ष न करने का मुहावरा है।
    reason: cultural_note
  - marker: c
    text: या, “उन्होंने मुझ पर कोई अतिरिक्त बात नहीं थोपी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τῶν δοκούντων εἶναί τι / οἱ δοκοῦντες
  choice: जो लोग कुछ माने जाते थे / वे प्रतिष्ठित लोग
  rationale: यह अभिव्यक्ति उनकी मान्य प्रतिष्ठा की ओर संकेत करती है और पौलुस की हल्की दूरी बनाए रखती है, बिना उनके नेतृत्व को तुच्छ ठहराए।
- source_word: ὁποῖοί ποτε ἦσαν
  choice: वे पहले चाहे जैसे भी रहे हों
  rationale: यह उनके पूर्व पद या स्वरूप की अप्रासंगिकता व्यक्त करता है और ποτε के कालगत संकेत को स्वाभाविक हिन्दी में रखता है।
- source_word: οὐδέν μοι διαφέρει
  choice: इससे मुझे कोई अन्तर नहीं पड़ता
  rationale: यूनानी मुहावरे का स्पष्ट और स्वाभाविक हिन्दी रूप, जो पौलुस के मूल्यांकन पर उनकी प्रतिष्ठा का प्रभाव न होने की बात कहता है।
- source_word: πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει
  choice: परमेश्वर किसी का पक्षपात नहीं करता
  rationale: शाब्दिक रूप से ‘मनुष्य का मुख ग्रहण नहीं करता’ एक सामी मुहावरा है; चुना हुआ रूप उसका आशय आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: οὐδὲν προσανέθεντο
  choice: मेरे लिए कुछ भी और नहीं जोड़ा
  rationale: προσανατίθημι के ‘अतिरिक्त जोड़ने’ के मूल भाव को बनाए रखता है और यह अस्पष्टता खुली छोड़ता है कि सुसमाचार, शिक्षा या दायित्व में कुछ नहीं जोड़ा गया।
theological_decisions:
- issue: क्या पौलुस यरूशलेम के अगुओं का तिरस्कार कर रहा है या उनकी प्रतिष्ठा से अपनी स्वतंत्रता जता रहा है
  choice: सम्मानसूचक ‘प्रतिष्ठित’ के साथ ‘माने जाते थे’ द्वारा मापी हुई दूरी
  alternative: ‘जो अपने को बड़ा समझते थे’ जैसा अधिक तीखा और तिरस्कारपूर्ण रूप
  rationale: पौलुस का मुख्य तर्क यह है कि मानवीय प्रतिष्ठा उसके सुसमाचार की सत्यता निर्धारित नहीं करती; पाठ आवश्यक रूप से उन अगुओं की वैधता को नकारता नहीं।
- issue: οὐδὲν προσανέθεντο का आशय योगदान देना है या अतिरिक्त शर्त लगाना
  choice: ‘कुछ भी और नहीं जोड़ा’ द्वारा दोनों सम्भावनाओं को खुला रखना
  alternative: ‘मुझ पर कोई और शर्त नहीं लगाई’
  rationale: क्रिया संदर्भ में संदेश में योगदान या अतिरिक्त अपेक्षा थोपने—दोनों की छाया रख सकती है; मुख्य पाठ में किसी एक को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य के डैश पौलुस की बीच में कही गई टिप्पणी को स्पष्ट रखते हैं; ‘कुछ माने जाते थे’ उसकी अलंकारिक दूरी और ‘प्रतिष्ठित’ उन व्यक्तियों की स्वीकार्य सार्वजनिक स्थिति—दोनों को सुरक्षित रखते हैं।
