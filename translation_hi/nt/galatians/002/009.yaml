source:
  edition: SBLGNT
  text: καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ⸀ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/009.yaml
  text: and recognizing the grace that had been given to me[a], James and Cephas and John, who were regarded as pillars, gave to Barnabas and me the right hands of fellowship[c][b], so that we would go to the Gentiles and they to the circumcised.
translation:
  language: hi
  text: मुझे दिए गए अनुग्रह को पहचानकर, याकूब, कैफा और यूहन्ना ने—जो स्तंभ माने जाते थे—मुझे और बरनबास को संगति के दाहिने हाथ बढ़ाए[a], ताकि हम गैर-यहूदियों[b] के पास जाएँ और वे खतना करवाए हुए लोगों[c] के पास।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साझेदारी के दाहिने हाथ बढ़ाए।” यह पारस्परिक स्वीकृति और साझा सेवाकार्य की सहमति का संकेत था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जातियों”; यहाँ आशय गैर-यहूदियों से है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “खतना के पास”; यहाँ आशय यहूदी लोगों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γνόντες
  choice: पहचान लिया
  rationale: यह क्रिया केवल जान लेने के बजाय अनुग्रह को समझकर स्वीकार करने का भाव देती है और आगे की कार्रवाई का आधार बताती है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: पौलुस की भाषा में यह परमेश्वर के दिए हुए कृपापूर्ण वरदान और प्रेरिताई बुलाहट, दोनों की व्यापकता बनाए रखता है।
- source_word: Κηφᾶς
  choice: कैफा
  rationale: मूल यूनानी पाठ में प्रयुक्त नाम को पतरस से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: οἱ δοκοῦντες στῦλοι εἶναι
  choice: जो खंभे माने जाते थे
  rationale: यह उनकी सार्वजनिक प्रतिष्ठा व्यक्त करता है, बिना पौलुस के कथन में अनावश्यक व्यंग्य जोड़ने के।
- source_word: δεξιὰς ... κοινωνίας
  choice: संगति के दाहिने हाथ दिए
  rationale: बहुवचन δεξιὰς को बनाए रखते हुए यह सहमति, स्वीकृति और साझा सेवाकार्य के औपचारिक संकेत को व्यक्त करता है।
- source_word: ἔθνη
  choice: गैर-यहूदी
  rationale: इस प्रसंग में यह राजनीतिक राष्ट्रों के बजाय यहूदियों से भिन्न लोगों को सूचित करता है।
- source_word: περιτομήν
  choice: खतना किए हुए
  rationale: मूल का लक्षणात्मक प्रयोग बनाए रखते हुए यह यहूदी लोगों की ओर संकेत करता है।
theological_decisions:
- issue: κοινωνία का अर्थ संगति या साझेदारी
  choice: संगति
  alternative: साझेदारी
  rationale: संदर्भ में साझा मिशन और पारस्परिक मान्यता दोनों निहित हैं; ‘संगति’ मूल शब्द की संबंधपरक व्यापकता बनाए रखती है, जबकि पादटिप्पणी मिशन-संबंधी साझेदारी का विकल्प बताती है।
- issue: ἡμεῖς और αὐτοί के लक्ष्य-समूहों का कथन
  choice: ताकि हम गैर-यहूदियों के पास जाएँ और वे खतना किए हुओं के पास
  alternative: ताकि हम गैर-यहूदियों के लिए और वे यहूदियों के लिए काम करें
  rationale: मूल में गति-सूचक क्रिया व्यक्त नहीं है, पर εἰς के संक्षिप्त वाक्यांश में मिशन की दिशा निहित है। ‘के पास जाएँ’ इसे स्वाभाविक हिंदी में व्यक्त करता है, बिना सेवाकार्य को पूर्णतः अलग या अनन्य क्षेत्र घोषित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘कैफा’ मूल नाम को सुरक्षित रखता है। ‘खंभे माने जाते थे’ सार्वजनिक प्रतिष्ठा का भाव देता है; ‘संगति के दाहिने हाथ’ मूल मुहावरे और बहुवचन को यथासंभव बनाए रखता है।
