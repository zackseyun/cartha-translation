base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/012.yaml
  text: For before certain men came from James[a], he used to eat with the Gentiles; but when they came, he began to draw back and separate himself[c][b], fearing those of the circumcision.
translation:
  language: hi
  text: क्योंकि याकूब की ओर से कुछ लोग आने से पहले वह गैर-यहूदियों के साथ खाया करता था; पर जब वे आए, तो वह पीछे हटने लगा और अपने को अलग रखने लगा, क्योंकि वह खतना किए हुए लोगों[a] से डरता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खतना-दल के लोग।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸ τοῦ γὰρ ἐλθεῖν τινας
  choice: क्योंकि ... कुछ लोगों के आने से पहले
  rationale: πρό के साथ articular infinitive का समय-संबंध स्वाभाविक हिन्दी में रखा गया है; τινας की अनिश्चितता ‘कुछ लोगों’ से बनी रहती है।
- source_word: ἀπὸ Ἰακώβου
  choice: याकूब के यहाँ से
  rationale: यह व्यक्ति से स्रोत अथवा संबंध का संकेत देता है, पर यह नहीं जोड़ता कि याकूब ने उन्हें औपचारिक रूप से भेजा या उनके रुख का समर्थन किया था।
- source_word: μετὰ τῶν ἐθνῶν
  choice: गैर-यहूदियों के साथ
  rationale: पौलुस के इस संदर्भ में ἔθνη यहूदियों से भिन्न लोगों को दर्शाता है; ‘विश्वासी’ जोड़ना मूल पाठ से अधिक स्पष्ट करना होता।
- source_word: συνήσθιεν
  choice: खाया करता था
  rationale: अपूर्ण भूतकाल नियमित अथवा प्रचलित अतीत की क्रिया बताता है, जिसे यह हिन्दी रूप स्पष्ट करता है।
- source_word: ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν
  choice: पीछे हटने और अपने आपको अलग रखने लगा
  rationale: दोनों अपूर्ण भूतकालीन क्रियाओं की क्रमशः आरम्भ होती प्रक्रिया और सामाजिक दूरी को सुरक्षित रखा गया है।
- source_word: φοβούμενος
  choice: क्योंकि वह ... से डरता था
  rationale: कृदन्त का प्रसंगानुकूल कारणात्मक भाव स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: τοὺς ἐκ περιτομῆς
  choice: खतना किए हुए लोगों
  rationale: समूह की पहचान खतने के आधार पर रखी गई है, बिना उसे अनिवार्य रूप से कोई औपचारिक ‘दल’ कहे।
theological_decisions:
- issue: क्या ἀπὸ Ἰακώβου से यह निष्कर्ष निकले कि याकूब ने इन लोगों को अधिकार देकर भेजा था
  choice: याकूब के यहाँ से
  alternative: याकूब द्वारा भेजे गए
  rationale: यूनानी पाठ स्रोत या संबंध दर्शाता है, लेकिन औपचारिक प्रेषण अथवा समर्थन को स्पष्ट नहीं करता; इसलिए उस तनाव को अनिर्णीत रखा गया है।
- issue: क्या τοὺς ἐκ περιτομῆς को एक औपचारिक गुट के रूप में नामित किया जाए
  choice: खतना किए हुए लोगों
  alternative: खतना-दल के लोगों
  rationale: मूल वाक्यांश समूह को खतने से पहचानता है, पर स्पष्ट रूप से किसी संगठित दल का नाम नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है; वाक्य की कारणात्मक और कालगत संरचना तथा मूल पाठ की संबंधगत अस्पष्टता सुरक्षित रखी गई है।
