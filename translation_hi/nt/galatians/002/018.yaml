  text: εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν ⸀συνιστάνω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/018.yaml
  text: For if I rebuild the things I tore down[b][a], I prove myself to be a transgressor.
translation:
  language: hi
  text: क्योंकि यदि मैं उन्हीं बातों को फिर से बनाता हूँ जिन्हें मैंने ढा दिया था, तो मैं स्वयं को अपराधी सिद्ध करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: ‘क्योंकि’ पिछले तर्क से व्याख्यात्मक संबंध और ‘यदि’ शर्त का भाव सुरक्षित रखते हैं।
- source_word: ἃ ... ταῦτα
  choice: उन्हीं बातों को ... जिन्हें
  rationale: यह यूनानी सहसंबंधी रचना के बहुवचन और बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατέλυσα
  choice: ढा दिया था
  rationale: οἰκοδομῶ के साथ भवन-निर्माण का रूपक बनाए रखता है; ‘नष्ट किया’ की तुलना में यह तत्काल रूपक को अधिक स्पष्ट करता है।
- source_word: πάλιν οἰκοδομῶ
  choice: फिर से बनाता हूँ
  rationale: पुनर्निर्माण और वर्तमान काल की शर्तात्मक क्रिया—दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: παραβάτην
  choice: अपराधी
  rationale: यह सीमा या नियम का उल्लंघन करने वाले व्यक्ति के नैतिक-विधिक भाव को साधारण आधुनिक हिन्दी में व्यक्त करता है, बिना इसे स्पष्ट रूप से केवल मूसा की व्यवस्था तक सीमित किए।
- source_word: ἐμαυτὸν συνιστάνω
  choice: मैं अपने आप को ... ठहराता हूँ
  rationale: यह आत्म-दोषारोपक बल को सुरक्षित रखते हुए ‘स्वयं को ऐसा सिद्ध/प्रदर्शित करना’ का प्रसंगगत अर्थ स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: ढाई और फिर बनाने की वस्तुओं की पहचान
  choice: ‘बातों’ को अनिर्दिष्ट रखा गया है
  alternative: इसे स्पष्ट रूप से ‘व्यवस्था’ या ‘व्यवस्था के काम’ कहना
  rationale: यूनानी पद ἃ ... ταῦτα स्वयं वस्तुओं की पहचान स्पष्ट नहीं करता; प्रसंग से अर्थ ग्रहण किया जाना चाहिए, इसलिए अनुवाद में किसी एक धर्मवैचारिक व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। भवन-निर्माण का मूल रूपक ‘ढा दिया’ और ‘फिर से बनाता हूँ’ द्वारा बनाए रखा गया है।
