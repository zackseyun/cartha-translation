- from: क्योंकि यदि मैं उन्हीं बातों को फिर से बनाता हूँ जिन्हें मैंने ढा दिया था, तो मैं अपने आप को अपराधी ठहराता हूँ।
  to: क्योंकि यदि मैं उन्हीं बातों को फिर से बनाता हूँ जिन्हें मैंने ढा दिया था, तो मैं स्वयं को अपराधी सिद्ध करता हूँ।
