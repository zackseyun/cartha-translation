lexical_decisions:
- source_word: συνυπεκρίθησαν
  choice: उसके साथ कपट किया
  rationale: संयुक्त क्रिया में साथ मिलकर कपटपूर्ण व्यवहार करने का भाव है। यह अभिव्यक्ति σύν- उपसर्ग के सहभागिता-भाव को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: αὐτῷ
  choice: उसके साथ
  rationale: सम्बन्धसूचक सम्प्रदान कारक यहाँ पतरस के आचरण में साथ देने को दर्शाता है; ‘उसके साथ’ इसे स्पष्ट रखता है।
- source_word: λοιποὶ
  choice: बाकी
  rationale: यह पहले उल्लिखित समूह में शेष लोगों को पतरस से अलग करके दिखाता है। ‘बाकी’ आधुनिक हिन्दी में सहज है।
- source_word: Ἰουδαῖοι
  choice: यहूदी
  rationale: इस प्रसंग में शब्द जातीय-धार्मिक समुदाय को सूचित करता है, केवल यहूदिया के निवासियों को नहीं।
- source_word: συναπήχθη
  choice: बह गया
  rationale: निष्क्रिय क्रिया दूसरों के सामाजिक और नैतिक प्रभाव में खिंच जाने का चित्र देती है। ‘बह गया’ उस प्रभाव और अनैच्छिक खिंचाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑποκρίσει
  choice: कपट
  rationale: यह शब्द दिखावे और वास्तविक आचरण के बीच असंगति वाले व्यवहार को नाम देता है। दोनों बार ‘कपट’ रखने से पौलुस की पुनरुक्ति और जोर सुरक्षित रहता है।
