base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/003.yaml
  text: But not even Titus[a], who was with me, though he was a Greek[b], was compelled to be circumcised.
translation:
  language: hi
  text: परन्तु मेरे साथ जो तीतुस था, उसे भी, यूनानी होते हुए[a], खतना कराने के लिए विवश नहीं किया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यूनानी होते हुए” का अनुवाद “यद्यपि वह यूनानी था” भी हो सकता है। यहाँ “यूनानी” से प्रसंग में तीतुस के खतनारहित गैर-यहूदी होने का संकेत मिलता है, पर मूल पाठ विशेष रूप से “यूनानी” ही कहता है।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: यह पिछले प्रसंग से विरोध दर्शाता है; ‘परन्तु’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: οὐδὲ
  choice: को भी ... नहीं
  rationale: हिन्दी में ‘तीतुस को भी ... नहीं’ यूनानी के बलयुक्त निषेध ‘not even Titus’ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Τίτος
  choice: तीतुस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ὁ σὺν ἐμοί
  choice: मेरे साथ रहनेवाले
  rationale: यह तीतुस की पहचान उसके पौलुस के साथ होने के आधार पर करता है, बिना ‘साथी’ जैसा अतिरिक्त संबंध जोड़ने के।
- source_word: Ἕλλην ὤν
  choice: यूनानी होते हुए
  rationale: कृदन्तीय वाक्यांश को जानबूझकर कुछ खुला रखा गया है; संदर्भ में रियायती भाव सम्भव है, पर उसे मुख्य पाठ में ‘यद्यपि’ जोड़कर अनिवार्य नहीं बनाया गया।
- source_word: Ἕλλην
  choice: यूनानी
  rationale: मूल शब्द विशेष रूप से ‘यूनानी’ कहता है, व्यापक व्याख्यात्मक शब्द ‘गैर-यहूदी’ नहीं।
- source_word: ἠναγκάσθη
  choice: विवश नहीं किया गया
  rationale: कर्मवाच्य रूप बाहरी दबाव या बाध्यता को सुरक्षित रखता है।
- source_word: περιτμηθῆναι
  choice: खतना कराने के लिए
  rationale: हिन्दी में यह कर्मवाच्य अनन्त क्रिया का स्वाभाविक और स्पष्ट रूप है।
theological_decisions:
- issue: Ἕλλην को जातीय-सांस्कृतिक पद के रूप में रखना या धार्मिक व्याख्यात्मक सामान्यीकरण करना
  choice: यूनानी
  alternative: गैर-यहूदी
  rationale: मूल पाठ तीतुस को सीधे ‘यूनानी’ कहता है। प्रसंग में इससे उसके खतनारहित गैर-यहूदी होने का संकेत मिलता है, पर अनुवाद को मूल की विशिष्ट शब्दावली बनाए रखनी चाहिए।
- issue: Ἕλλην ὤν के कृदन्तीय संबंध को स्पष्ट रूप से रियायती बनाना
  choice: यूनानी होते हुए
  alternative: यद्यपि वह यूनानी था
  rationale: संदर्भ रियायती अर्थ का समर्थन करता है, फिर भी यूनानी कृदन्त स्वयं संबंध को पूर्णतः चिह्नित नहीं करता; चुना हुआ रूप वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप। ‘विवश’ बाहरी दबाव का भाव रखता है; ‘यूनानी होते हुए’ कृदन्तीय संरचना और उसकी सम्भावित रियायती छाया दोनों को सुरक्षित रखता है। मुख्य पाठ का [a] चिह्न सम्बद्ध टिप्पणी से मेल खाता है।
