    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ τοὐναντίον
  choice: इसके विपरीत
  rationale: दोनों पद मिलकर पिछले कथन के साथ प्रबल विरोध दिखाते हैं; यह हिंदी में स्वाभाविक और अर्थानुकूल है।
