- source_word: '[ellipsis after Πέτρος τῆς περιτομῆς]'
  choice: को [सौंपा गया है]
  rationale: यूनानी में पहले खंड की क्रिया दूसरे खंड में निहित है; हिंदी में तुलना समझने के लिए ‘को’ पर्याप्त है और क्रिया स्वाभाविक रूप से पहले खंड से ग्रहण होती है।
theological_decisions:
- issue: ἀκροβυστία और περιτομή को जातीय नामों से व्यक्त किया जाए या मूल के खतना-संबंधी पदों से
  choice: खतनारहितों / खतनावालों
  alternative: गैर-यहूदियों / यहूदियों; खतनारहित अवस्था / खतना
  rationale: मूल पाठ समुदायों को खतने की स्थिति के आधार पर संबोधित करता है। इन्हें सीधे ‘गैर-यहूदी’ और ‘यहूदी’ कहना अर्थ को कुछ अधिक व्याख्यात्मक बना देता; चुने हुए रूप पौलुस की शब्दावली और उसके वाचा-संबंधी तनाव को बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘खतनारहितों’ और ‘खतनावालों’ से मूल यूनानी की समानांतर संरचना तथा वाचा-संबंधी शब्दावली सुरक्षित रखी गई है।
