  rationale: मूल के खतना-आधारित समूह-सूचक शब्द को बनाए रखते हुए संबंधकारक का आशय लक्षित समुदाय के रूप में स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: पौलुस और पतरस को सौंपे गए कार्यों के बीच स्पष्ट समानता व्यक्त करता है।
- source_word: Πέτρος
