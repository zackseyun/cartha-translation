- source_word: πεπίστευμαι
  choice: मुझे ... सौंपा गया है
  rationale: पूर्णकालिक कर्मवाच्य यहाँ किसी दायित्व या कार्य के सौंपे जाने का अर्थ देता है; हिंदी में यह रूप वर्तमान तक बनी स्थिति को भी व्यक्त करता है।
- source_word: τὸ εὐαγγέλιον
  choice: सुसमाचार
  rationale: पौलुस के संदर्भ में यह प्रचलित, गरिमापूर्ण और धर्मवैचारिक भार को बनाए रखने वाला हिंदी पद है।
- source_word: τῆς ἀκροβυστίας
