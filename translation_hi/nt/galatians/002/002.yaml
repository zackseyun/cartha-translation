  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατ’ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/002.yaml
  text: But I went up in response to a revelation[a], and I laid before them the gospel that I proclaim among the Gentiles—but privately before those of repute—lest somehow I should be running, or had run[c][b], in vain.
translation:
  language: hi
  text: पर मैं एक प्रकाशन के प्रत्युत्तर में ऊपर गया, और मैंने उनके सामने उस सुसमाचार को रखा जिसका प्रचार मैं गैर-यहूदियों के बीच करता हूँ—लेकिन निजी तौर पर उनके सामने जो प्रतिष्ठित माने जाते थे[b]—ताकि कहीं ऐसा न हो कि मैं व्यर्थ दौड़ रहा हूँ या दौड़ा हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, ‘जो प्रभावशाली समझे जाते थे।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘इस भय से कि मैं व्यर्थ दौड़ रहा होऊँ या दौड़ चुका होऊँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβην
  choice: ऊपर गया
  rationale: क्रिया का सामान्य अर्थ ‘ऊपर जाना’ है। इस पद में गंतव्य स्पष्ट रूप से नहीं कहा गया, इसलिए ‘यरूशलेम’ नहीं जोड़ा गया।
- source_word: κατὰ ἀποκάλυψιν
  choice: एक प्रकाशन के कारण
  rationale: यह वाक्यांश पौलुस के ऊपर जाने का आधार या प्रेरक कारण बताता है। ‘प्रकाशन’ ईश्वरीय प्रकट किए जाने के भाव को बनाए रखता है।
- source_word: ἀνεθέμην αὐτοῖς
  choice: मैंने उनके सामने ... रखा
  rationale: यह विचारार्थ किसी बात को सामने रखने का भाव व्यक्त करता है, पर औपचारिक अधीनता या अनुमोदन माँगने का अर्थ अनिवार्य नहीं बनाता।
- source_word: τὸ εὐαγγέλιον
  choice: वह सुसमाचार
  rationale: ‘सुसमाचार’ पौलुस के संदर्भ में εὐαγγέλιον का प्रचलित, संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के बीच
  rationale: यहाँ ἔθνη राजनीतिक राष्ट्रों की अपेक्षा यहूदियों से बाहर के लोगों को सूचित करता है; ‘गैर-यहूदी’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: κατ’ ἰδίαν
  choice: अलग से
  rationale: यह व्यापक बातचीत से भिन्न निजी रूप से बात रखने का संकेत देता है। ‘अलग से’ सहज हिन्दी है और अनावश्यक रूप से औपचारिक बैठक नहीं जोड़ता।
- source_word: τοῖς δοκοῦσιν
  choice: जो प्रतिष्ठित माने जाते थे
  rationale: यह उन लोगों को सूचित करता है जिन्हें महत्त्वपूर्ण समझा जाता था। यह रूप उनकी प्रतिष्ठा को न पूरी तरह पौलुस का मूल्यांकन बनाता है, न व्यंग्य मानता है।
- source_word: μή πως εἰς κενὸν τρέχω ἢ ἔδραμον
  choice: ताकि कहीं ऐसा न हो कि मैं व्यर्थ दौड़ रहा हूँ या दौड़ा हूँ
  rationale: ‘दौड़ना’ पौलुस के रूपक को बनाए रखता है और वर्तमान कार्य तथा पिछले परिश्रम के बीच यूनानी क्रियाओं का भेद यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: क्या पौलुस ने अपना सुसमाचार प्रेरितों की स्वीकृति या सुधार के लिए अधीनतापूर्वक प्रस्तुत किया?
  choice: ‘उनके सामने ... रखा’
  alternative: ‘उनकी स्वीकृति के लिए प्रस्तुत किया’ अथवा ‘उन्हें केवल सूचित किया’
  rationale: ἀνατίθημι विचारार्थ बात सामने रखने का अर्थ देता है, पर न औपचारिक अधीनता को अनिवार्य करता है, न किसी भी मूल्यांकन की संभावना को मिटाता है। तटस्थ शब्दावली पाठ का तनाव बनाए रखती है।
- issue: τοῖς δοκοῦσιν में सम्मान है या सूक्ष्म दूरी?
  choice: ‘जो प्रतिष्ठित माने जाते थे’
  alternative: ‘मान्य अगुवे’ अथवा ‘जो प्रभावशाली समझे जाते थे’
  rationale: यूनानी पद उनकी सामाजिक या सामुदायिक प्रतिष्ठा बताता है, जबकि पौलुस उस प्रतिष्ठा से स्वयं कितना सहमत था, यह पूरी तरह स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है; ‘ऊपर गया’ मूल की स्थानगत अभिव्यक्ति को बिना गंतव्य जोड़े सुरक्षित रखता है। दौड़ने का रूपक और वर्तमान-पिछले परिश्रम का तनाव जानबूझकर बनाए रखा गया है।
