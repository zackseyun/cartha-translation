  yaml_path: translation/nt/galatians/002/001.yaml
  text: Then after fourteen years I went up again to Jerusalem with Barnabas, also taking Titus along.
translation:
  language: hi
  text: फिर चौदह वर्ष बाद मैं बरनबास के साथ दोबारा यरूशलेम गया और तीतुस को भी साथ ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπειτα
  choice: फिर
  rationale: पौलुस के वृत्तांत में घटनाओं का क्रम स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: διὰ δεκατεσσάρων ἐτῶν
  choice: चौदह वर्ष बाद
  rationale: समयवाचक διά और संबंधकारक का भाव बीती हुई अवधि के बाद अगली घटना होने का है।
- source_word: πάλιν
  choice: दोबारा
  rationale: यरूशलेम की यात्रा की पुनरावृत्ति स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
- source_word: ἀνέβην
  choice: गया
  rationale: हिन्दी में यरूशलेम को गंतव्य बताने के लिए यह स्वाभाविक है; ‘ऊपर गया’ स्रोत की भौगोलिक अभिव्यक्ति को अधिक शाब्दिक रूप से रखता, पर यहाँ असहज लग सकता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: εἰς के गंतव्य-बोध को ‘यरूशलेम गया’ की हिन्दी संरचना स्वाभाविक रूप से व्यक्त करती है।
- source_word: μετὰ Βαρναβᾶ
  choice: बरनबास के साथ
  rationale: साथ होने का सीधा और स्पष्ट भाव रखता है।
- source_word: συμπαραλαβὼν καὶ Τίτον
  choice: और तीतुस को भी साथ ले गया
  rationale: सहभागी क्रिया और καί के योगात्मक बल दोनों को सहज हिन्दी में व्यक्त करता है; तीतुस को बरनबास के अतिरिक्त साथ लिए जाने की बात स्पष्ट रहती है।
