  yaml_path: translation/nt/galatians/002/014.yaml
  text: But when I saw that they were not walking in step with the truth of the gospel[a], I said to Cephas before them all, “If you, though a Jew, live like a Gentile and not like a Jew[b], how do you compel the Gentiles to live like Jews?”
translation:
  language: hi
  text: लेकिन जब मैंने देखा कि वे सुसमाचार के सत्य के अनुरूप नहीं चल रहे थे[a], तो मैंने सबके सामने कैफा से कहा, “यदि तुम यहूदी होकर भी गैर-यहूदियों की तरह जीते हो और यहूदियों की तरह नहीं, तो तुम गैर-यहूदियों को यहूदियों की तरह जीने के लिए कैसे विवश करते हो?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक: “सुसमाचार के सत्य के अनुरूप सीधे नहीं चल रहे थे।”'
    reason: lexical_alternative
  - marker: b
    text: इसे संक्षेप में “यहूदी रीति अपनाने के लिए कैसे विवश करते हो?” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀρθοποδοῦσιν
  choice: सीधी चाल नहीं चल रहे थे
  rationale: यह क्रिया सीधे चलने का रूपक रखती है और यहाँ आचरण के सुसमाचार के सत्य के अनुरूप न होने को व्यक्त करती है। हिंदी में यह रूपक स्वाभाविक और बोधगम्य रहता है।
- source_word: πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου
  choice: सुसमाचार के सत्य के अनुसार
  rationale: यहाँ πρός दिशा मात्र नहीं, बल्कि सत्य के मानदंड के साथ अनुरूपता व्यक्त करता है; ‘के अनुसार’ इसे सहज हिंदी में स्पष्ट करता है।
- source_word: Κηφᾷ
  choice: कैफा
  rationale: मूल पाठ में प्रयुक्त अरामी नाम के यूनानी रूप को बनाए रखा गया है; इसे ‘पतरस’ से प्रतिस्थापित नहीं किया गया।
- source_word: ἐθνικῶς
  choice: गैर-यहूदियों की तरह
  rationale: यह क्रियाविशेषण जीवन-व्यवहार की रीति बताता है और Ἰουδαϊκῶς के साथ स्पष्ट समानांतर विरोध बनाता है।
- source_word: Ἰουδαϊκῶς
  choice: यहूदियों की तरह
  rationale: जोड़ीदार क्रियाविशेषणों का समानांतर रूप हिंदी में बनाए रखा गया है।
- source_word: ἀναγκάζεις
  choice: विवश करते हो
  rationale: यह शब्द दबाव या बाध्यता का प्रबल भाव रखता है; ‘विवश करना’ आधुनिक और गरिमापूर्ण हिंदी में उस बल को सुरक्षित रखता है।
- source_word: Ἰουδαΐζειν
  choice: यहूदियों की तरह जीने के लिए
  rationale: यह विशिष्ट यहूदी रीति से जीवन बिताने या यहूदी प्रथाएँ अपनाने को बताता है। यह अनुवाद बाद की पारिभाषिक बहस जोड़े बिना तत्काल संदर्भ स्पष्ट करता है।
- source_word: πῶς
  choice: कैसे
  rationale: प्रश्न को क्षमता (‘कैसे कर सकते हो’) के बजाय रीति और असंगति के सीधे प्रश्न के रूप में रखा गया है।
theological_decisions:
- issue: Ἰουδαΐζειν का अनुवाद बाद के धर्मवैज्ञानिक विवादों को आरोपित किए बिना करना
  choice: यहूदियों की तरह जीने के लिए
  alternative: यहूदी रीति अपनाने के लिए; यहूदी बनने के लिए
  rationale: संदर्भ जीवन-व्यवहार, संगति और जातीय-धार्मिक सीमाचिह्नों से जुड़ा है। चुना हुआ रूप अर्थ को खुला रखता है और इसे औपचारिक धर्म-परिवर्तन तक सीमित नहीं करता।
- issue: पौलुस के प्रश्न में πῶς का बल
  choice: कैसे विवश करते हो?
  alternative: कैसे विवश कर सकते हो?
  rationale: मूल का प्रश्न क्षमता से अधिक कैफा के व्यवहार की असंगति को सीधे उजागर करता है; इसलिए संभाव्यता सूचक ‘सकते’ नहीं जोड़ा गया।
