id: GAL.2.21
reference: Galatians 2:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/021.yaml
  text: I do not nullify the grace of God[a], for if righteousness comes through the law[c][b], then Messiah died for nothing.
translation:
  language: hi
  text: मैं परमेश्वर के अनुग्रह को निष्फल नहीं करता, क्योंकि यदि व्यवस्था के द्वारा धार्मिकता[a] मिलती है, तो मसीह[b] व्यर्थ ही मरा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘न्याय’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द ‘ख्रिस्तोस’ का अर्थ ‘अभिषिक्त जन’ है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘बिना किसी प्रयोजन के मरा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετῶ
  choice: निष्फल नहीं करता
  rationale: यह ἀθετέω के यहाँ प्रयुक्त अर्थ—किसी बात को प्रभावहीन या निरर्थक ठहराना—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: यह χάρις का प्रचलित और प्रसंगानुकूल हिन्दी धार्मिक पद है, जो परमेश्वर की कृपापूर्ण देन को व्यक्त करता है।
- source_word: διὰ νόμου
  choice: व्यवस्था के द्वारा
  rationale: διά के साधन-सूचक अर्थ को बनाए रखता है और νόμος को पौलुस के प्रसंग में प्रचलित हिन्दी पद ‘व्यवस्था’ से व्यक्त करता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के इस तर्क में परमेश्वर के सामने सही ठहरने से जुड़ा अर्थ प्रमुख है; ‘धार्मिकता’ उसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखती है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में इसी पद को व्यक्त करता है।
- source_word: δωρεὰν
  choice: व्यर्थ ही
  rationale: इस शर्तीय तर्क में शब्द मसीह की मृत्यु के निष्प्रयोजन हो जाने का भाव देता है; ‘व्यर्थ ही’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: व्यवस्था और धार्मिकता के संबंध पर पौलुस का तर्क
  choice: यदि धार्मिकता व्यवस्था के द्वारा मिलती है, तो मसीह की मृत्यु व्यर्थ ठहरती है।
  alternative: ‘धार्मिकता’ को ‘न्याय’ समझने पर वाक्य परमेश्वर द्वारा न्यायपूर्ण सुधार या वाचा-संबंधी पुनर्स्थापना पर अधिक बल दे सकता है।
  rationale: निकटवर्ती प्रसंग परमेश्वर के सामने सही ठहरने और व्यवस्था के कामों के प्रश्न पर केंद्रित है। अनुवाद इस बल को बनाए रखता है, पर वैकल्पिक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित करता है।
- issue: Χριστός को उपाधि या नाम-सदृश पद के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός ‘अभिषिक्त जन’ की उपाधि का भाव रखता है; ‘मसीह’ हिन्दी में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निष्फल नहीं करता’ मूल क्रिया की शक्ति को बनाए रखता है, जबकि ‘व्यर्थ ही मरा’ निष्कर्ष की तीक्ष्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
