id: GAL.2.16
reference: Galatians 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰδότες ⸀δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως ⸂Ἰησοῦ Χριστοῦ⸃, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ⸂ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται⸃ πᾶσα σάρξ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/016.yaml
  text: Yet knowing that a person is not justified by works of the law except through faith in Jesus the Messiah[a], even we have believed in Messiah Jesus, so that we might be justified by faith in Messiah and not by works of the law[c][b], because by works of the law no flesh will be justified.
translation:
  language: hi
  text: फिर भी हम जानते हैं कि कोई मनुष्य व्यवस्था के कामों से धर्मी नहीं ठहराया जाता, केवल यीशु मसीह पर विश्वास के द्वारा ठहराया जाता है[a]। हमने भी मसीह यीशु पर विश्वास किया, ताकि हम व्यवस्था के कामों से नहीं, बल्कि मसीह पर विश्वास से धर्मी ठहराए जाएँ[b], क्योंकि व्यवस्था के कामों से कोई भी मनुष्य धर्मी नहीं ठहराया जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु मसीह की विश्वासयोग्यता के द्वारा।”
    reason: alternative_reading
  - marker: b
    text: या, “मसीह की विश्वासयोग्यता से।”
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “कोई देह।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιοῦται / δικαιωθῶμεν / δικαιωθήσεται
  choice: धर्मी ठहराया जाता है / धर्मी ठहराए जाएँ / धर्मी नहीं ठहराया जाएगा
  rationale: एक ही न्यायिक पौलुसी पदावली को पूरे वचन में संगत रखा गया है; यह केवल नैतिक रूप से धर्मी बनने के बजाय परमेश्वर द्वारा धर्मी माने या घोषित किए जाने का भाव सुरक्षित रखती है।
- source_word: ἄνθρωπος
  choice: कोई मनुष्य
  rationale: यूनानी एकवचन का प्रतिनिधिक, सामान्य मानवीय अर्थ स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: ἐξ ἔργων νόμου
  choice: व्यवस्था के कामों से
  rationale: पौलुस की विशिष्ट पदावली को ‘अच्छे कामों’ जैसे व्यापक अर्थ में बदले बिना पारदर्शी रूप से रखा गया है।
- source_word: διὰ πίστεως Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह पर विश्वास करने के द्वारा
  rationale: मुख्य पाठ में संबंधवाचक रचना को यीशु मसीह में रखे गए विश्वास के रूप में लिया गया है; मसीह की विश्वासयोग्यता वाला वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν
  choice: हमने भी मसीह यीशु पर विश्वास किया
  rationale: πιστεύω εἰς का स्वाभाविक हिन्दी रूप चुना गया है और यूनानी क्रिया के पूर्ण कृत्य को साधारण भूतकाल से व्यक्त किया गया है।
- source_word: ἐκ πίστεως Χριστοῦ
  choice: मसीह पर विश्वास करने से
  rationale: पहली πίστις Χριστοῦ रचना के साथ संगति रखी गई है और वैकल्पिक व्यक्तिपरक संबंधवाचक अर्थ पादटिप्पणी में दिया गया है।
- source_word: Χριστοῦ / Χριστόν
  choice: मसीह
  rationale: Χριστός के उपाधिगत अर्थ को हिन्दी की प्रचलित बाइबलीय उपाधि ‘मसीह’ से व्यक्त किया गया है।
- source_word: πᾶσα σάρξ
  choice: कोई भी मनुष्य
  rationale: शाब्दिक ‘कोई प्राणी’ या ‘कोई देह’ की अपेक्षा हिन्दी में अभिप्रेत समस्त मानवजाति का अर्थ स्पष्ट और स्वाभाविक है; मूल मुहावरा पादटिप्पणी में दिया गया है।
- source_word: εἰδότες δὲ
  choice: फिर भी हम जानते हैं
  rationale: δέ का हल्का विरोधात्मक बल और सहभागी रूप का संदर्भगत सामूहिक कर्ता सहज हिन्दी में व्यक्त किया गया है।
- source_word: ἐὰν μὴ
  choice: नहीं, बल्कि ... के द्वारा
  rationale: इस संदर्भ में यूनानी अपवाद-वाक्य को विरोधात्मक साधन के रूप में समझते हुए स्वाभाविक हिन्दी में रखा गया है, बिना यह संकेत दिए कि विश्वास भी व्यवस्था का कोई काम है।
theological_decisions:
- issue: πίστις Χριστοῦ / πίστεως Ἰησοῦ Χριστοῦ का अर्थ
  choice: ‘यीशु मसीह पर विश्वास’ / ‘मसीह पर विश्वास’
  alternative: ‘यीशु मसीह की विश्वासयोग्यता’ / ‘मसीह की विश्वासयोग्यता’
  rationale: यूनानी संबंधवाचक रचना वस्तुनिष्ठ और व्यक्तिनिष्ठ—दोनों अर्थों में समझी गई है। मुख्य पाठ में प्रचलित वस्तुनिष्ठ अर्थ रखा गया है, जबकि दूसरे वास्तविक अर्थ को पादटिप्पणियों में स्पष्ट किया गया है।
- issue: δικαιόω का धार्मिक-न्यायिक अर्थ
  choice: धर्मी ठहराना
  alternative: धर्मी घोषित करना / धर्मी मानना
  rationale: ‘धर्मी ठहराना’ न्यायिक बल, हिन्दी बाइबलीय परिचितता और तीनों क्रियारूपों की संगति को संतुलित करता है।
- issue: πᾶσα σάρξ का अनुवाद
  choice: कोई भी मनुष्य
  alternative: कोई प्राणी / कोई देह
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी द्वारा सार्वभौमिक मानवीय संदर्भ स्पष्ट किया गया है और शाब्दिक बाइबलीय मुहावरा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘व्यवस्था के काम’ और ‘धर्मी ठहराना’ जैसी पौलुसी पदावलियाँ संगत रखी गई हैं। मुख्य पाठ में ‘कोई भी मनुष्य’ स्वाभाविक है, जबकि σάρξ का शाब्दिक मुहावरा पादटिप्पणी में संरक्षित है।
