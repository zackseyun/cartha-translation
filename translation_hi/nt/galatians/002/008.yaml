id: GAL.2.8
reference: Galatians 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/002/008.yaml
  text: For the one who worked through Peter for apostleship to the circumcised also worked through me for the Gentiles[b][a],
translation:
  language: hi
  text: क्योंकि जिसने पतरस के द्वारा खतना किए हुओं के लिए प्रेरिताई में[a] कार्य किया, उसी ने मेरे द्वारा गैर-यहूदियों[b] के लिए भी कार्य किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “खतने की प्रेरिताई के लिए।”
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεργήσας / ἐνήργησεν
  choice: कार्य किया
  rationale: दोनों सजातीय क्रियारूपों के लिए एक ही अभिव्यक्ति रखी गई है, ताकि पतरस और पौलुस की सेवाओं के बीच मूल समानांतरता बनी रहे और ईश्वरीय कार्य की रीति का अनावश्यक अर्थ-विस्तार न हो।
- source_word: Πέτρῳ / ἐμοὶ
  choice: पतरस के द्वारा / मेरे द्वारा
  rationale: 'संदर्भ में दोनों संप्रदान कारकों को करणार्थक समझना सबसे स्वाभाविक है: वह पतरस और पौलुस के द्वारा उनकी सेवकाई में कार्य करता है।'
- source_word: εἰς ἀποστολὴν
  choice: प्रेरिताई के लिए
  rationale: यह ἀποστολή के औपचारिक अर्थ तथा प्रेरित की नियुक्ति और सेवकाई की दिशा—दोनों को संक्षिप्त रूप में बनाए रखता है।
- source_word: τῆς περιτομῆς
  choice: खतना किए हुओं
  rationale: मूल का शब्दशः रूप 'खतने की' है, पर यहाँ 'खतना' यहूदी लोगों के लिए लक्षणा है; चुना गया रूप यहूदी और गैर-यहूदी विरोध को स्पष्ट रखते हुए मूल बिंब को बचाता है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदियों
  rationale: पौलुस के इस संदर्भ में यह शब्द खतना किए हुए यहूदियों के विपरीत गैर-यहूदी लोगों को दर्शाता है; 'राष्ट्रों' का शब्दशः विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: कर्ता को स्पष्ट रूप से 'परमेश्वर' कहना या मूल के कृदंत रूप को बनाए रखना
  choice: जिसने ... उसी ने
  alternative: परमेश्वर ने, जिसने ...
  rationale: यूनानी में स्पष्ट संज्ञा नहीं, बल्कि अर्थतः 'जिसने कार्य किया' वाला साभिप्राय कृदंत है। हिन्दी में सहसंबंधी रचना निहित ईश्वरीय कर्ता को समझने देती है, पर पाठ में 'परमेश्वर' जोड़कर अस्पष्टता को समाप्त नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'प्रेरिताई' पारिभाषिक है, पर मूल ἀποστολή और निकटवर्ती प्रेरित-संदर्भ को अधिक ठीक से बनाए रखती है। मुख्य पाठ में पादटिप्पणी चिह्न संबंधित पदांशों के क्रम में [a][b] दिए गए हैं।
