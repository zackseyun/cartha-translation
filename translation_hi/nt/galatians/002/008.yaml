  naturalness: The original wording is grammatically possible but noticeably cumbersome. 'खतना किए हुओं के लिए प्रेरिताई में' is more idiomatic modern Hindi while retaining the formal term 'प्रेरिताई' and the intended scope of Peter's ministry. Footnote markers are placed immediately after the expressions they annotate.
