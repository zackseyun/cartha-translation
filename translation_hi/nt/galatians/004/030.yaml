review_pass:
  verdict: revise
  source_fidelity: The draft generally follows the Greek, including the imperative and the emphatic future negation. However, παιδίσκη denotes an enslaved woman in this contrast, and the inserted cross-reference wording is not part of the biblical text. The citation should retain the direct progression from the command to γάρ (“for/because”).
  naturalness: The core Hindi is understandable, but inserting “यह उत्पत्ति 21:10 की प्रतिध्वनि है” between the clauses disrupts the quotation and reads as editorial material mistakenly placed in the verse. “किसी भी तरह ... नहीं पाएगा” naturally conveys the categorical force of οὐ μὴ.
  terminology: “गुलाम स्त्री” explicitly preserves the slavery/freedom contrast central to παιδίσκη and ἐλευθέρα. “विरासत ... पाना” is clear modern Hindi for κληρονομέω in this legal-family context.
  issues:
  - severity: high
    issue: A cross-reference explanation has been inserted into the translation text.
    rationale: “यह उत्पत्ति 21:10 की प्रतिध्वनि है” is editorial information, not represented by any Greek words in Galatians 4:30. It interrupts the causal clause introduced by γάρ and must be confined to a footnote.
  - severity: medium
    issue: The lexical note for “दासी” understates the term’s meaning.
    rationale: The note’s “दास या सेवक की अधीन स्थिति” is imprecise and permits a merely servant-status sense. παιδίσκη here identifies a female slave, and the slavery/freedom contrast should remain explicit.
  - severity: low
    issue: Footnote anchors do not consistently attach to the material they explain.
    rationale: The lexical note should follow the term for the enslaved woman; the cross-reference should anchor the quotation rather than appear as prose within it; and the emphatic-negation note should follow the negated inheritance clause.
