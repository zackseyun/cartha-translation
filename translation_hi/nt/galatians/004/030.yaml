id: GAL.4.30
reference: Galatians 4:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ ⸀κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/030.yaml
  text: But what does the Scripture say? “Cast out the servant woman and her son[c][b][a], for the son of the servant woman will certainly not inherit with the son of the free woman.”
translation:
  language: hi
  text: पर पवित्रशास्त्र क्या कहता है? “गुलाम स्त्री[a] और उसके बेटे को निकाल दे, क्योंकि गुलाम स्त्री का बेटा स्वतंत्र स्त्री के बेटे के साथ किसी भी तरह विरासत नहीं पाएगा।”[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द एक गुलाम स्त्री को दर्शाता है। यहाँ दासता और स्वतंत्रता का विरोध केंद्रीय है; ‘दासी’ इसका एक पारंपरिक विकल्प है।
    reason: lexical_alternative
  - marker: b
    text: यह उद्धरण उत्पत्ति 21:10 से है।
    reason: cross_reference
  - marker: c
    text: 'यूनानी में निषेध पर विशेष बल है: “किसी भी तरह ... नहीं पाएगा”; इसका अनुवाद “कदापि ... नहीं पाएगा” भी किया जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले तर्क के विपरीत एक नया, तीखा मोड़ प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक और पर्याप्त है।
- source_word: τί λέγει ἡ γραφή
  choice: पवित्रशास्त्र क्या कहता है
  rationale: वर्तमान काल और पवित्रशास्त्र को बोलते हुए प्रस्तुत करने वाली उद्धरण-शैली दोनों को बनाए रखता है।
- source_word: Ἔκβαλε
  choice: निकाल दे
  rationale: आज्ञार्थक रूप और बलपूर्वक अलग किए जाने का भाव रखता है; ‘भेज दे’ की तुलना में अधिक तीखा है और हिन्दी में स्वाभाविक है।
- source_word: παιδίσκην
  choice: दासी
  rationale: यह स्त्री की अधीन/दास स्थिति को व्यक्त करता है और प्रसंग में दासता तथा स्वतंत्रता के केंद्रीय विरोध को स्पष्ट रखता है।
- source_word: υἱὸν αὐτῆς
  choice: उसके बेटे
  rationale: यूनानी के सरल संबंधसूचक वाक्यांश का सहज हिन्दी रूप।
- source_word: οὐ γὰρ μὴ κληρονομήσει
  choice: क्योंकि ... उत्तराधिकार निश्चय ही नहीं पाएगा
  rationale: οὐ μή के प्रबल निषेध को समकालीन, स्पष्ट हिन्दी में व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: κληρονομήσει
  choice: उत्तराधिकार ... पाएगा
  rationale: पारिवारिक और कानूनी संदर्भ में विरासत प्राप्त करने के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: μετὰ τοῦ υἱοῦ
  choice: बेटे के साथ
  rationale: उत्तराधिकार में सहभागिता या संगति के μετά + संबंधकारक अर्थ को संक्षेप में रखता है।
- source_word: τῆς ἐλευθέρας
  choice: स्वतंत्र स्त्री
  rationale: विशेषण के संज्ञात्मक प्रयोग में निहित ‘स्त्री’ को हिन्दी में स्पष्ट करता है और दासी के साथ विरोध बनाए रखता है।
theological_decisions:
- issue: पौलुस के सारा-हाजिरा रूपक में παιδίσκη का अनुवाद
  choice: दासी
  alternative: गुलाम स्त्री; सेविका
  rationale: आस-पास के तर्क में दासता और स्वतंत्रता का विरोध केंद्रीय है। ‘दासी’ इस अधीन स्थिति को स्पष्ट रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और सुबोध है; ‘सेविका’ दास स्थिति को अनावश्यक रूप से नरम कर सकती है।
- issue: οὐ γὰρ μὴ κληρονομήσει में निषेध का बल
  choice: उत्तराधिकार निश्चय ही नहीं पाएगा
  alternative: कदापि उत्तराधिकार नहीं पाएगा; किसी भी दशा में उत्तराधिकार नहीं पाएगा
  rationale: यह यूनानी के दोहरे प्रबल निषेध को सुरक्षित रखता है और उद्धरण में व्यक्त निश्चित बहिष्कार से आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘दासी/स्वतंत्र स्त्री’ का समानांतर रूप प्रसंग के मुख्य विरोध को उभारता है। आज्ञा की तीक्ष्णता के लिए ‘निकाल दे’ और प्रबल निषेध के लिए ‘निश्चय ही नहीं’ चुना गया है।
