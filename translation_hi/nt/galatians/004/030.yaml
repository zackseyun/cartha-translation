- from: पर पवित्रशास्त्र क्या कहता है? “दासी और उसके बेटे को निकाल दे[a]—यह उत्पत्ति 21:10 की प्रतिध्वनि है[b]—क्योंकि दासी का बेटा स्वतंत्र स्त्री के बेटे के साथ उत्तराधिकार निश्चय ही नहीं पाएगा।”[c]
  to: पर पवित्रशास्त्र क्या कहता है? “गुलाम स्त्री[a] और उसके बेटे को निकाल दे, क्योंकि गुलाम स्त्री का बेटा स्वतंत्र स्त्री के बेटे के साथ किसी भी तरह विरासत नहीं पाएगा।”[c][b]
  rationale: The revision removes the non-source editorial cross-reference from the verse and places it in its proper footnote. It renders παιδίσκη as “गुलाम स्त्री” to preserve the explicit enslaved/free contrast, keeps the forceful imperative “निकाल दे,” and expresses οὐ μὴ κληρονομήσει with the categorical “किसी भी तरह ... नहीं पाएगा.” Footnote anchors have been placed beside the precise words or quotation they document.
