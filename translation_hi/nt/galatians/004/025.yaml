base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/025.yaml
  text: Hagar is Mount Sinai in Arabia[a], and she corresponds to the present Jerusalem, for she is enslaved with her children.
translation:
  language: hi
  text: हाजिरा अरब में सीनै पर्वत है[a], और वह वर्तमान यरूशलेम के अनुरूप है, क्योंकि वह अपने बच्चों समेत दासता में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब यह हाजिरा अरब में सीनै पर्वत है।” यूनानी में “हाजिरा” से पहले एक निश्चित उपपद है, जिसके कारण इस वाक्यांश की रचना कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ δὲ Ἁγὰρ
  choice: हाजिरा
  rationale: δέ को हल्के संयोजक के रूप में समझा गया है; हिन्दी में अनावश्यक आरम्भिक ‘अब’ नहीं जोड़ा गया। Ἁγὰρ से पहले का नपुंसकलिंगी लेख वाक्यरचना को कठिन बनाता है, इसलिए मुख्य पाठ स्वाभाविक रखा गया और विकल्प पादटिप्पणी में दिया गया।
- source_word: Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ
  choice: अरब में सीनै पर्वत है
  rationale: प्रत्यक्ष समतुल्यता ‘है’ के द्वारा सुरक्षित है; ‘दर्शाती है’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया। Ἀραβία को भौगोलिक नाम ‘अरब’ से व्यक्त किया गया है।
- source_word: συστοιχεῖ
  choice: के समान ठहरती है
  rationale: क्रिया का भाव एक ही पंक्ति या श्रेणी में अनुरूप होने का है। यह पदबंध वर्तमान यरूशलेम के साथ रूपकात्मक समानता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῇ νῦν Ἰερουσαλήμ
  choice: वर्तमान यरूशलेम
  rationale: νῦν का कालगत भेद सुरक्षित है और अगले पद के ‘ऊपर की यरूशलेम’ से इसका अंतर बना रहता है।
- source_word: δουλεύει
  choice: दासता में है
  rationale: यह अनुवाद दासता और स्वतंत्रता के प्रसंगगत विरोध को बनाए रखता है तथा सामान्य ‘सेवा करती है’ की अपेक्षा बंधन की दशा को स्पष्ट करता है।
- source_word: μετὰ τῶν τέκνων αὐτῆς
  choice: अपने बच्चों समेत
  rationale: μετά साहचर्य बताता है और τέκνα रूपकात्मक पारिवारिक अर्थ में ‘बच्चों’ से स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: हाजिरा, सीनै और वर्तमान यरूशलेम की रूपकात्मक पहचान
  choice: 'प्रत्यक्ष कथन रखा गया: ‘हाजिरा ... सीनै पर्वत है’ और फिर वर्तमान यरूशलेम से उसकी समानता कही गई।'
  alternative: ‘हाजिरा सीनै पर्वत का प्रतीक है’ या ‘हाजिरा सीनै पर्वत को दर्शाती है।’
  rationale: यूनानी पाठ प्रत्यक्ष समतुल्यता की भाषा का प्रयोग करता है। व्याख्यात्मक ‘प्रतीक’ जोड़ने से पौलुस के कथन की अलंकारिक तीक्ष्णता नरम पड़ जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘हाजिरा’, ‘सीनै’ और ‘यरूशलेम’ के प्रचलित बाइबलीय रूप रखे गए हैं। ‘दासता’ प्रसंग के दासता–स्वतंत्रता विरोध को स्पष्ट रखती है।
