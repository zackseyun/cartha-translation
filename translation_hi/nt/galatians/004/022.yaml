source:
  edition: SBLGNT
  text: γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/022.yaml
  text: For it is written that Abraham had two sons[a], one by the servant woman and one by the free woman.
translation:
  language: hi
  text: क्योंकि लिखा है कि अब्राहम के दो पुत्र थे—एक दासी से और एक स्वतंत्र स्त्री से।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: यह पूर्ण निष्क्रिय रूप पवित्रशास्त्र का प्रमाण प्रस्तुत करने वाला प्रचलित सूत्र है; ‘लिखा है’ हिन्दी में स्वाभाविक है और लिखित वचन की वर्तमान प्रामाणिकता बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क का आधार बताने वाला संयोजक है; हिन्दी में ‘क्योंकि’ इसका संबंध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: जो लिखा है उसकी विषय-वस्तु का सीधा परिचय देता है।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: δύο υἱοὺς
  choice: दो पुत्र
  rationale: υἱούς विशेष रूप से पुरुष संतान को दर्शाता है; ‘पुत्र’ सटीक और गरिमापूर्ण है।
- source_word: ἔσχεν
  choice: थे
  rationale: माता-पिता और संतान के संबंध में यूनानी ‘उसके थे/उसने पाए’ का स्वाभाविक हिन्दी रूप ‘के ... थे’ है; यह ‘जन्म दिया’ जैसी अनावश्यक व्याख्या से बचता है।
- source_word: ἕνα ... καὶ ἕνα
  choice: एक ... और एक
  rationale: यूनानी की संतुलित समानांतर संरचना को सुरक्षित रखता है।
- source_word: ἐκ
  choice: से
  rationale: वंश या मातृत्व के स्रोत को व्यक्त करने के लिए हिन्दी में ‘से’ स्वाभाविक है और यूनानी की स्रोत-संबंधी अस्पष्टता को भी बनाए रखता है।
- source_word: παιδίσκης
  choice: दासी
  rationale: शब्द स्त्री सेवक या दासत्व की स्थिति वाली स्त्री को दर्शाता है; इस प्रसंग में ‘दासी’ सामान्य हिन्दी में बंधन की स्थिति और आगे आने वाले स्वतंत्रता-विरोध को स्पष्ट रखता है।
- source_word: ἐλευθέρας
  choice: स्वतंत्र स्त्री
  rationale: यह विशेषण संज्ञा के रूप में स्वतंत्र सामाजिक स्थिति वाली स्त्री को दर्शाता है; ‘स्वतंत्र स्त्री’ दासी के साथ पौलुस का विरोध स्पष्ट करता है।
theological_decisions:
- issue: पौलुस के तर्क में दासता और स्वतंत्रता का सामाजिक तथा धर्मवैचारिक विरोध
  choice: παιδίσκη/ἐλευθέρα को ‘दासी’/‘स्वतंत्र स्त्री’ कहना
  alternative: ‘सेविका’/‘स्वतंत्र स्त्री’
  rationale: आसपास के तर्क में दासता और स्वतंत्रता का विरोध केंद्रीय है। ‘दासी’ उस बंधित सामाजिक स्थिति को स्पष्ट करता है, जबकि ‘सेविका’ केवल घरेलू सेवा का आभास दे सकती है; फिर भी पाठ में स्त्री की पहचान या नाम नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। डैश दोनों पुत्रों के समानांतर वर्णन को स्पष्ट करता है। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई।
