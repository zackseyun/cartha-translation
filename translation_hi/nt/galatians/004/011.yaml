  yaml_path: translation/nt/galatians/004/011.yaml
  text: I fear for you[a], that somehow I have labored over you in vain.
translation:
  language: hi
  text: मुझे तुम्हारे विषय में डर है कि कहीं ऐसा न हो कि मैंने तुम्हारे लिए व्यर्थ ही परिश्रम किया हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβοῦμαι ὑμᾶς
  choice: मुझे तुम्हारे विषय में डर है
  rationale: यह वाक्यांश पौलुस की वर्तमान आशंका व्यक्त करता है। ‘तुम्हारे विषय में’ स्पष्ट करता है कि वह गलातियों से भयभीत नहीं, बल्कि उनकी दशा को लेकर चिंतित है।
- source_word: μή πως
  choice: कि कहीं ऐसा न हो कि
  rationale: यह स्वाभाविक आधुनिक हिन्दी में आशंकित संभावना को व्यक्त करता है और यूनानी वाक्य की अनिश्चितता बनाए रखता है।
- source_word: εἰκῇ
  choice: व्यर्थ ही
  rationale: यह परिणामहीन अथवा निष्फल होने का अर्थ संक्षेप और स्पष्टता से देता है।
- source_word: κεκοπίακα
  choice: मैंने ... परिश्रम किया हो
  rationale: परफेक्ट क्रिया पहले किए गए कठिन श्रम और उसकी वर्तमान प्रासंगिकता को व्यक्त करती है; आशंका-प्रधान हिन्दी उपवाक्य में ‘किया हो’ स्वाभाविक है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे लिए
  rationale: यह गलातियों की ओर निर्देशित और उनके हित में किए गए प्रेरितिक श्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस की चिंता का स्वरूप
  choice: पौलुस को आशंका है कि गलातियों के बीच किया गया उसका परिश्रम निष्फल सिद्ध न हो जाए।
  alternative: इसे केवल पौलुस की सामान्य व्यक्तिगत चिंता समझा जा सकता है।
  rationale: φοβοῦμαι ... μή πως ... εἰκῇ κεκοπίακα का संयुक्त बल सामान्य चिंता से अधिक, उसके श्रम के संभावित रूप से निष्फल हो जाने की चरवाही आशंका व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘डर है’ मूल की तीव्रता बनाए रखता है, जबकि ‘तुम्हारे विषय में’ गलत अर्थ—कि पौलुस उनसे डरता है—से बचाता है।
