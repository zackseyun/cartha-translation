  text: ⸂ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/028.yaml
  text: You[a], brothers, like Isaac, are children of promise.
translation:
  language: hi
  text: पर तुम, भाइयो[a], इसहाक के समान प्रतिज्ञा की संतान हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयो” के लिए मूल भाषा में पुल्लिंग बहुवचन संबोधन है, जिसका प्रयोग संभवतः मंडली के पुरुषों और स्त्रियों—दोनों—के लिए प्रतिनिधिक रूप में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: द्वितीय पुरुष बहुवचन सर्वनाम को स्पष्ट रखा गया है; हिन्दी में “तुम” सामान्य, स्वाभाविक और मंडली को संबोधित करने के लिए उपयुक्त है।
- source_word: δέ
  choice: पर
  rationale: यह पिछले तर्क से हल्का विरोध या संक्रमण दिखाता है; “पर” उस संबंध को संक्षेप में बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: पुल्लिंग बहुवचन संबोधन के रूप को मुख्य पाठ में सुरक्षित रखा गया है; मंडली की स्त्रियों सहित प्रतिनिधिक प्रयोग को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κατὰ Ἰσαὰκ
  choice: इसहाक के समान
  rationale: 'κατά यहाँ अनुरूपता या प्रतिरूप का भाव देता है: पाठकों की तुलना इसहाक से की गई है।'
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञा की
  rationale: संबंधकारक प्रयोग को “प्रतिज्ञा की संतान” के रूप में रखा गया है, जिससे पौलुस की विशिष्ट अभिव्यक्ति और उसका धर्मवैचारिक भार सुरक्षित रहता है।
- source_word: τέκνα
  choice: संतान
  rationale: यह लिंग-निरपेक्ष बहुवचन संज्ञा है और पारिवारिक संबंध या दर्जे पर बल देती है; हिन्दी में “संतान” स्वाभाविक रूप से सामूहिक अर्थ व्यक्त करती है।
- source_word: ἐστέ
  choice: हो
  rationale: द्वितीय पुरुष बहुवचन वर्तमानकालीन संयोजक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: विश्वासियों की इसहाक के साथ तुलना और प्रतिज्ञा की संतान के रूप में उनकी पहचान
  choice: “इसहाक के समान प्रतिज्ञा की संतान हो”
  alternative: “इसहाक की तरह प्रतिज्ञा से उत्पन्न संतान हो”
  rationale: यूनानी वाक्य-विन्यास में इसहाक तुलना का प्रतिरूप है और “प्रतिज्ञा की संतान” विधेय है। चुना हुआ पाठ दोनों बातों को बनाए रखता है और जन्म की प्रक्रिया जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मंडलीय संबोधन। “पर तुम” से δέ का हल्का विरोध और ὑμεῖς का स्पष्ट बल दोनों स्वाभाविक ढंग से व्यक्त होते हैं।
