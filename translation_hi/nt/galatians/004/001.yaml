id: GAL.4.1
reference: Galatians 4:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγω δέ, ἐφ’ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/001.yaml
  text: I say that as long as the heir is a child[a], he differs in nothing from a servant, though he is lord of all[b],
translation:
  language: hi
  text: मैं यह कहता हूँ कि जब तक वारिस नाबालिग[a] है, तब तक यद्यपि वह सब कुछ का स्वामी है, फिर भी वह किसी बात में दास[b] से भिन्न नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बालक’। यूनानी शब्द νήπιος छोटे या अपरिपक्व बच्चे को दर्शा सकता है; यहाँ प्रसंग में उसका आशय ऐसे व्यक्ति से है जो अभी उत्तराधिकार सँभालने की आयु तक नहीं पहुँचा है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सेवक’। यूनानी शब्द δοῦλος सामान्यतः ऐसे व्यक्ति को दर्शाता है जो दासता या बंधुआ स्थिति में हो; यहाँ ‘दास’ पौलुस की तुलना का बल बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω δέ
  choice: मैं यह कहता हूँ कि
  rationale: λέγω कथन या स्पष्टीकरण आरम्भ करता है और δέ हल्का संयोजक है। हिन्दी में यह रूप संक्रमण को स्वाभाविक रखता है, बिना अनावश्यक रूप से प्रबल विरोध जोड़े।
- source_word: ἐφ’ ὅσον χρόνον
  choice: जब तक ... तब तक
  rationale: यह पदबंध एक निश्चित सीमा तक की अवधि व्यक्त करता है; हिन्दी का सहसंबंधी प्रयोग अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὁ κληρονόμος
  choice: वारिस
  rationale: κληρονόμος उस व्यक्ति को दर्शाता है जिसे विरासत मिलनी है; ‘वारिस’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: νήπιος
  choice: नाबालिग
  rationale: इस उत्तराधिकार-संबंधी उपमा में शब्द का आशय केवल छोटे बच्चे से नहीं, बल्कि अभी विधिक आयु तक न पहुँचे वारिस से है। ‘नाबालिग’ उस प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: οὐδὲν διαφέρει
  choice: किसी बात में भिन्न नहीं होता
  rationale: यह यूनानी वाक्यांश किसी भी व्यावहारिक भेद के न होने पर बल देता है; चुना हुआ रूप अर्थ और बल दोनों बनाए रखता है।
- source_word: δούλου
  choice: दास
  rationale: δοῦλος यहाँ बंधन और दूसरे के अधिकार के अधीन स्थिति दर्शाता है। ‘दास’ तुलना की तीव्रता को ‘सेवक’ की अपेक्षा अधिक ठीक रखता है।
- source_word: κύριος πάντων ὤν
  choice: सबका स्वामी होते हुए भी
  rationale: कृदन्तीय वाक्यांश में निहित विरोधात्मक भाव को ‘होते हुए भी’ व्यक्त करता है। ‘सबका स्वामी’ यूनानी की व्यापकता और विडंबना को बनाए रखता है।
theological_decisions:
- issue: पौलुस की उपमा में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: उपमा वारिस की अस्थायी स्थिति की तुलना ऐसे व्यक्ति से करती है जो दूसरे के अधिकार में बँधा है। इसलिए ‘दास’ मूल शब्द की सामाजिक और आलंकारिक शक्ति को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- issue: κύριος πάντων में स्वामित्व का स्वरूप
  choice: सबका स्वामी
  alternative: हर चीज़ का मालिक
  rationale: मूल अभिव्यक्ति πάντων को व्यापक और कुछ हद तक संदर्भ-निर्भर छोड़ती है। ‘सबका स्वामी’ उस व्यापकता को बनाए रखता है और इसे केवल संपत्ति तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उत्तराधिकार के विधिक प्रसंग के कारण ‘नाबालिग’ चुना गया है, जबकि पादटिप्पणी ‘बालक’ की शाब्दिक संभावना सुरक्षित रखती है।
