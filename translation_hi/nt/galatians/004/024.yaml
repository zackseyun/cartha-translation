id: GAL.4.24
reference: Galatians 4:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/024.yaml
  text: 'These things are being interpreted allegorically[a], for these women are two covenants: one from Mount Sinai, bearing children for slavery[b]; she is Hagar.'
translation:
  language: hi
  text: 'इन बातों की आलंकारिक व्याख्या की जा रही है[a], क्योंकि ये स्त्रियाँ दो वाचाएँ हैं: एक सीनै पर्वत से है, जो दासता के लिए बच्चों को जन्म देती है[b]; वह हाजिरा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन बातों की आलंकारिक व्याख्या की जाती है,” अथवा “ये बातें एक रूपक हैं।” यूनानी अभिव्यक्ति बताती है कि पौलुस पिछले वृत्तांत का आलंकारिक रीति से प्रयोग कर रहा है।
    reason: lexical_alternative
  - marker: b
    text: या, “दासता में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: इन बातों
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम पिछले कथानक की बातों की ओर संकेत करता है; हिन्दी में ‘इन बातों’ उसका स्वाभाविक अनुवर्ती संकेत है।
- source_word: ἀλληγορούμενα
  choice: का आलंकारिक अर्थ लगाया जाता है
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त पौलुस द्वारा पिछले वृत्तांत के आलंकारिक प्रयोग अथवा निर्वचन को व्यक्त करता है; यह अनुवाद इतिहास-वृत्तांत को असत्य ठहराए बिना उस व्याख्यात्मक विधि को सामने रखता है।
- source_word: αὗται
  choice: ये स्त्रियाँ
  rationale: स्त्रीलिंग बहुवचन संकेतवाचक पद पिछली दो स्त्रियों, सारा और हाजिरा, की ओर संकेत करता है; ‘स्त्रियाँ’ जोड़ने से हिन्दी में सन्दर्भ स्पष्ट रहता है।
- source_word: διαθῆκαι
  choice: वाचाएँ
  rationale: सीनै और पौलुस के उद्धार-ऐतिहासिक सन्दर्भ में διαθήκη का स्थापित और उपयुक्त बाइबलीय अर्थ ‘वाचा’ है।
- source_word: ἀπὸ ὄρους Σινᾶ
  choice: सीनै पर्वत से
  rationale: ἀπό वाचा के स्रोत अथवा उद्गम को दर्शाता है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: εἰς δουλείαν
  choice: दासता के लिए
  rationale: εἰς यहाँ परिणाम अथवा गन्तव्य का भाव रखता है और δουλεία बँधी हुई दास-अवस्था को व्यक्त करता है; ‘दासता के लिए’ संतान के परिणाम को सहज हिन्दी में बताता है।
- source_word: γεννῶσα
  choice: संतान उत्पन्न करती है
  rationale: स्त्रीलिंग एकवचन वर्तमान कृदन्त वाचा को माता के रूप में चित्रित करता है; यह पद उस मातृत्व-रूपक को बनाए रखता है।
- source_word: ἥτις ἐστὶν Ἁγάρ
  choice: वह हाजिरा है
  rationale: स्त्रीलिंग एकवचन सम्बन्धवाचक पद पहली वाचा को हाजिरा से आलंकारिक रूप में पहचानता है; ‘वह’ हिन्दी में इस स्त्रीलिंग चित्रण को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: सारा-हाजिरा के वृत्तांत के प्रति पौलुस का आलंकारिक प्रयोग
  choice: ‘इन बातों का आलंकारिक अर्थ लगाया जाता है’
  alternative: ‘ये बातें एक रूपक हैं’
  rationale: कर्मवाच्य ἀλληγορούμενα व्याख्या या आलंकारिक प्रयोग की प्रक्रिया का संकेत देता है। चुना हुआ रूप यह नहीं कहता कि उत्पत्ति का वृत्तांत ऐतिहासिक नहीं है, और न ही पाठ की आलंकारिक विधि को कम करता है।
- issue: δουλεία की तीव्रता और εἰς का परिणामसूचक भाव
  choice: ‘दासता के लिए’
  alternative: ‘दासता में’
  rationale: ‘दासता’ अधीन बँधी अवस्था की पूरी तीव्रता रखता है, जबकि ‘के लिए’ जन्म लेने वाली संतान के परिणाम या नियति का भाव देता है; वैकल्पिक दिशात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: दो स्त्रियों और दो वाचाओं की पहचान
  choice: ‘ये स्त्रियाँ दो वाचाएँ हैं’
  alternative: ‘ये दो वाचाओं का प्रतीक हैं’
  rationale: मूल पाठ सीधे ‘दो वाचाएँ हैं’ कहता है। ‘प्रतीक हैं’ अर्थ को व्याख्यात्मक रूप से नरम कर देता, इसलिए पौलुस की सशक्त आलंकारिक पहचान को ज्यों का त्यों रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘वाचा’, ‘दासता’ और ‘आलंकारिक’ जैसे बाइबलीय तथा वैचारिक शब्द आवश्यक सटीकता के लिए रखे गए हैं; वाक्य को सामान्य पाठक के लिए स्पष्ट बनाने हेतु दो वाक्यों में बाँटा गया है।
