  terminology: ‘आलंकारिक व्याख्या,’ ‘वाचाएँ,’ and ‘दासता’ fit a dignified modern biblical register. ‘बच्चों को जन्म देती है’ preserves the explicitly maternal imagery better than ‘संतान उत्पन्न करती है.’
