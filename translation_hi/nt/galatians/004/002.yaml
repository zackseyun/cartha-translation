base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/002.yaml
  text: but he is under guardians and stewards until the time set by his father[a][b].
translation:
  language: hi
  text: पर वह पिता के ठहराए हुए समय तक अभिभावकों और घराने के प्रबंधकों[a] के अधीन रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गृह-प्रबंधकों”; यूनानी शब्द घराने या संपत्ति का प्रबंध करने वालों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “उस समय तक जिसे पिता ने ठहराया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले पद में वारिस की हैसियत और उसकी वास्तविक अधीनता के बीच विरोध दिखाता है; हिन्दी में ‘बल्कि’ इस मोड़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπὸ
  choice: के अधीन
  rationale: यह अधिकार और देखरेख के नीचे होने का भाव रखता है और हिन्दी में सहज है।
- source_word: ἐπιτρόπους
  choice: अभिभावकों
  rationale: यह नाबालिग की व्यक्तिगत देखरेख के लिए नियुक्त लोगों को सूचित करता है।
- source_word: ἐστὶ
  choice: रहता है
  rationale: पिछले पद के ‘वारिस’ को निहित कर्ता मानते हुए हिन्दी में निरंतर स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: यह देखरेख करने वाले दो वर्गों को साधारण रूप से जोड़ता है।
- source_word: οἰκονόμους
  choice: घर-बार के प्रबंधकों
  rationale: यूनानी शब्द घराने या संपत्ति के कामकाज का प्रबंध करने वालों को दर्शाता है; यह पदबंध उस ऐतिहासिक अर्थ को आधुनिक पाठक के लिए स्पष्ट करता है।
- source_word: ἄχρι
  choice: तक
  rationale: यह व्यवस्था की समय-सीमा बताता है।
- source_word: τῆς προθεσμίας
  choice: ठहराए हुए समय
  rationale: इसका अर्थ पहले से निश्चित या नियुक्त समय है; ‘ठहराए हुए समय’ में पूर्व-निर्धारण का भाव बना रहता है।
- source_word: τοῦ πατρός
  choice: पिता के
  rationale: संदर्भ में पिता ही समय निर्धारित करता है; हिन्दी का संबंधकारक प्रयोग इस अर्थ को संक्षेप में व्यक्त करता है, यद्यपि ‘पिता द्वारा’ भी संभव है।
theological_decisions:
- issue: τοῦ πατρός में संबंधकारक का अर्थ
  choice: ‘पिता के ठहराए हुए समय’—पिता को समय निर्धारित करने वाला समझा गया है।
  alternative: अधिक शाब्दिक ‘पिता के नियुक्त समय तक’ या स्पष्ट कर्तृवाचक ‘पिता द्वारा ठहराए हुए समय तक’।
  rationale: नाबालिग वारिस की घरेलू उपमा में पिता के द्वारा समय निश्चित किया जाना सबसे स्वाभाविक है; यह प्रसंगगत निर्णय है और कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘अभिभावक’ और ‘घर-बार के प्रबंधक’ से व्यक्ति की देखरेख तथा संपत्ति-प्रबंधन का भेद बनाए रखा गया है।
