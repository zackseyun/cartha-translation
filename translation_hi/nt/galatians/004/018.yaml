source:
  edition: SBLGNT
  text: καλὸν ⸀δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/018.yaml
  text: But it is good to be sought eagerly for a good purpose at all times[b][a], and not only when I am present with you.
translation:
  language: hi
  text: पर अच्छे उद्देश्य से[b] सदा उत्साहपूर्वक चाहा जाना[a] अच्छा है, और केवल तभी नहीं जब मैं तुम्हारे साथ उपस्थित हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उत्साही होना’ या ‘उत्साह दिखाना’ भी हो सकता है। यूनानी क्रिया को अलग-अलग प्रकार से समझा जा सकता है, पर पिछले पद में लोगों द्वारा गलातियों को अपने पक्ष में करने की उत्सुकता के साथ तुलना के कारण यहाँ निष्क्रिय अर्थ अधिक उपयुक्त लगता है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक अर्थ: ‘किसी अच्छी बात में।’ इस वाक्यांश का आशय सम्भवतः अच्छे अभिप्राय या अच्छे उद्देश्य से है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: अच्छा है
  rationale: विधेय विशेषण को हिन्दी में स्वाभाविक रूप से ‘अच्छा है’ कहा गया है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में बताए गए बुरे उद्देश्य के विपरीत अच्छे उद्देश्य की बात आरम्भ करता है।
- source_word: ζηλοῦσθαι
  choice: उत्साहपूर्वक चाहा जाना
  rationale: यूनानी रूप को निष्क्रिय अर्थ में लिया गया है, जो पद 17 में गलातियों को पाने के लिए दूसरों की उत्सुकता से सीधा संबंध रखता है; ‘उत्साहपूर्वक’ मूल शब्द में निहित प्रबल लगाव या उत्सुकता व्यक्त करता है।
- source_word: ἐν καλῷ
  choice: अच्छे उद्देश्य से
  rationale: शाब्दिक ‘अच्छी बात में’ की अपेक्षा यह प्रसंग में अभिप्राय या प्रेरणा की नैतिक अच्छाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντοτε
  choice: सदा
  rationale: यह आगे के ‘केवल तभी नहीं’ के साथ समय संबंधी विरोध को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ μὴ μόνον
  choice: और केवल तभी नहीं
  rationale: समन्वय तथा समय-संबंधी सीमा दोनों को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τῷ παρεῖναί με πρὸς ὑμᾶς
  choice: जब मैं तुम्हारे साथ उपस्थित हूँ
  rationale: ἐν के साथ प्रयुक्त क्रियार्थक संज्ञा समय बताती है; यह अनुवाद पौलुस की उपस्थिति और अनुपस्थिति के बीच विरोध बनाए रखता है।
theological_decisions:
- issue: ζηλοῦσθαι का वाच्य और निहित कर्ता
  choice: 'निष्क्रिय अर्थ: उत्साहपूर्वक चाहा जाना'
  alternative: उत्साही होना / उत्साह दिखाना
  rationale: पद 17 में दूसरे लोग गलातियों को उत्साह से अपने पक्ष में करना चाहते हैं; इसलिए यहाँ निष्क्रिय अर्थ उसी क्रिया का अच्छे उद्देश्य वाला सकारात्मक प्रतिरूप बनता है। फिर भी यूनानी रूप की दूसरी सम्भव समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी रखी गई है। ‘उत्साहपूर्वक चाहा जाना’ कुछ असामान्य होते हुए भी यूनानी निष्क्रियता और प्रसंगगत शब्द-खेल को बनाए रखता है; अस्पष्ट वैकल्पिक वाच्य पादटिप्पणी में दिया गया है।
