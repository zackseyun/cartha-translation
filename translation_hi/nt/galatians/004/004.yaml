source:
  edition: SBLGNT
  text: ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/004.yaml
  text: But when the fullness of time had come[a], God sent out his Son, born of a woman, born under the law[d][c][b],
translation:
  language: hi
  text: लेकिन जब समय की पूर्णता आ गई[a], तब परमेश्वर ने अपने पुत्र को भेजा[b], जो स्त्री से जन्मा[c] और व्यवस्था के अधीन जन्मा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब निर्धारित समय पूरा हो गया।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया में “बाहर भेजा” या “भेज दिया” का बल हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “स्त्री से उत्पन्न हुआ”; यह पुत्र के वास्तविक मानवीय जन्म पर बल देता है।
    reason: lexical_alternative
  - marker: d
    text: अर्थात् मूसा की व्यवस्था के अधिकार के अधीन।
    reason: cross_reference
lexical_decisions:
- source_word: ὅτε δὲ
  choice: लेकिन जब
  rationale: δέ को हल्के प्रसंगगत मोड़ के रूप में और ὅτε को समयसूचक रूप में व्यक्त करता है; इससे पिछले कथन के साथ संबंध बना रहता है और अनावश्यक रूप से तीखा विरोध नहीं बनता।
- source_word: ἦλθεν
  choice: आ गई
  rationale: समय की पूर्णता के निर्णायक रूप से उपस्थित हो जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ πλήρωμα τοῦ χρόνου
  choice: समय की पूर्णता
  rationale: यह मूल पदबंध की संक्षिप्तता और उस भाव को सुरक्षित रखता है कि समय अपने निर्धारित पूर्ण बिंदु तक पहुँच गया।
- source_word: ἐξαπέστειλεν
  choice: भेजा
  rationale: हिन्दी में स्वाभाविक और स्पष्ट है; यूनानी संयुक्त क्रिया में निहित ‘बाहर भेजने’ के बल को पादटिप्पणी में बताया गया है।
- source_word: τὸν υἱὸν αὐτοῦ
  choice: अपने पुत्र को
  rationale: कर्ता परमेश्वर की ओर लौटते संबंधवाचक सर्वनाम को स्वाभाविक हिन्दी में व्यक्त करता है और ‘पुत्र’ की पहचान को स्पष्ट रखता है।
- source_word: γενόμενον ἐκ γυναικός
  choice: जो स्त्री से जन्मा
  rationale: इस प्रसंग में γίνομαι और ἐκ γυναικός वास्तविक मानवीय जन्म को सूचित करते हैं; ‘जन्मा’ इसका स्पष्ट और सहज हिन्दी रूप है।
- source_word: γενόμενον ὑπὸ νόμον
  choice: व्यवस्था के अधीन जन्मा
  rationale: दूसरे γενόμενον की समानांतर रचना को बनाए रखता है और ὑπὸ νόμον को अधिकार-क्षेत्र के अधीन होने के रूप में व्यक्त करता है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: गलातियों के प्रसंग में यह मूसा की व्यवस्था की ओर संकेत करता है; मुख्य पाठ में पौलुस की संक्षिप्त अभिव्यक्ति को रखा गया है।
theological_decisions:
- issue: γενόμενον ἐκ γυναικός में मसीह की वास्तविक मानवता
  choice: ‘स्त्री से जन्मा’
  alternative: ‘स्त्री से उत्पन्न हुआ’
  rationale: ‘जन्मा’ पुत्र के वास्तविक मानवीय जन्म को स्पष्ट करता है, जबकि पहले से पुत्र को परमेश्वर द्वारा भेजे जाने की भाषा को भी बिना समझाए या दबाए यथावत रहने देता है।
- issue: ὑπὸ νόμον में νόμος का संदर्भ
  choice: मुख्य पाठ में ‘व्यवस्था के अधीन’, और पादटिप्पणी में मूसा की व्यवस्था का संकेत
  alternative: मुख्य पाठ में ‘मूसा की व्यवस्था के अधीन’
  rationale: गलातियों के प्रसंग में मूसा की व्यवस्था अभिप्रेत है, पर मुख्य पाठ में सामान्य संज्ञा रखकर मूल की संक्षिप्तता और प्रसंगगत अर्थ-निर्धारण दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समय की पूर्णता’ तथा ‘व्यवस्था के अधीन’ जैसे संक्षिप्त धर्मवैचारिक पदबंध मूल की अभिव्यक्ति को सुरक्षित रखते हैं, जबकि पादटिप्पणियाँ आवश्यक वैकल्पिक अर्थ और प्रसंग स्पष्ट करती हैं।
