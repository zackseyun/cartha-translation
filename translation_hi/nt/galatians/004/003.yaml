  text: इसी प्रकार हम भी, जब बच्चे थे, संसार के मूल तत्त्वों[a] के अधीन दासता में पड़े हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संसार की मूलभूत आत्मिक शक्तियाँ”; यूनानी शब्द का अर्थ मूल तत्त्व या सिद्धान्त भी हो सकता है और संसार-संबंधी आत्मिक शक्तियाँ भी।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पिछले पदों में उत्तराधिकारी के उदाहरण से तुलना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡμεῖς
  choice: हम
  rationale: यूनानी में बलपूर्वक आए प्रथम पुरुष बहुवचन को स्पष्ट रूप से रखा गया है।
- source_word: ὅτε ἦμεν νήπιοι
  choice: जब बच्चे थे
  rationale: यह समय-संबंधी उपवाक्य और उत्तराधिकारी की अपरिपक्व अवस्था—दोनों को सहज हिन्दी में व्यक्त करता है; यहाँ शाब्दिक शैशव आवश्यक नहीं है।
- source_word: ὑπὸ τὰ στοιχεῖα τοῦ κόσμου
  choice: संसार के मूल तत्त्वों के अधीन
  rationale: ‘अधीन’ नियंत्रण का रूपक सुरक्षित रखता है। ‘मूल तत्त्व’ στοιχεῖα की मूलभूत तत्त्वों/सिद्धान्तों वाली सम्भावना व्यक्त करता है, जबकि दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἤμεθα δεδουλωμένοι
  choice: दास बनाए हुए थे
  rationale: यह परिप्रयुक्त निष्क्रिय क्रियारूप की जारी अवस्था और दासता की प्रबल भाषा, दोनों को बनाए रखता है।
theological_decisions:
- issue: τὰ στοιχεῖα τοῦ κόσμου का अर्थ
  choice: मुख्य पाठ में “संसार के मूल तत्त्व”
  alternative: “संसार की तात्त्विक आत्मिक शक्तियाँ”
  rationale: यह यूनानी पद मूल तत्त्वों/सिद्धान्तों अथवा विश्व-संबंधी आत्मिक शक्तियों की ओर संकेत कर सकता है। मुख्य पाठ अपेक्षाकृत व्यापक गैर-व्यक्तिगत अर्थ देता है और पादटिप्पणी वैकल्पिक आत्मिक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और संदर्भानुकूल शैली। ‘दास बनाए हुए थे’ को दासता की तीव्रता तथा यूनानी निष्क्रिय रचना बनाए रखने के लिए चुना गया है।
