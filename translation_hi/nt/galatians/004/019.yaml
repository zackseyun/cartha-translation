  text: ⸀τέκνα μου, οὓς πάλιν ὠδίνω ⸀μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/019.yaml
  text: My children[a], for whom I am again suffering birth pains until Messiah is formed in you[c][b],
translation:
  language: hi
  text: मेरे बच्चो, जिनके लिए मैं फिर से प्रसव-पीड़ा सह रहा हूँ[a], जब तक मसीह तुममें[b] आकार न ले ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं फिर से प्रसव-वेदना में हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे बीच”; यूनानी वाक्यांश का सामुदायिक अर्थ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκνα μου
  choice: मेरे बच्चो
  rationale: यह स्नेहपूर्ण संबोधन है। ‘बच्चो’ स्वाभाविक आधुनिक हिन्दी है; ‘मेरे छोटे बच्चो’ मूल से अधिक लाड़ का भाव जोड़ देता।
- source_word: οὓς
  choice: जिनके लिए
  rationale: यूनानी में संबंधवाचक सर्वनाम कर्मकारक है, पर प्रसव के रूपक के साथ हिन्दी में ‘जिनके लिए’ संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: πάλιν
  choice: फिर से
  rationale: यह दोहराव को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: ὠδίνω
  choice: प्रसव-पीड़ा सह रहा हूँ
  rationale: यह क्रिया प्रसव-वेदना के सजीव मातृरूपक को बनाए रखती है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: μέχρις οὗ
  choice: जब तक
  rationale: यह समय और अपेक्षित लक्ष्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μορφωθῇ
  choice: आकार न ले ले
  rationale: यह ‘रूप धारण करने/बनने’ के अर्थ को सहज हिन्दी में व्यक्त करता है। यद्यपि यूनानी रूप व्याकरणतः कर्मवाच्य है, शाब्दिक ‘गठित किया जाए’ हिन्दी में कठोर और भ्रामक लगेगा।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यह Χριστός के पदवीगत अर्थ को व्यक्त करने वाला प्रचलित और स्वाभाविक हिन्दी शब्द है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह मूल का निकटतम अर्थ है और भीतर होने वाले रूपांतरण का संकेत देता है; बहुवचन संबोधन सामुदायिक आयाम को भी खुला रखता है।
theological_decisions:
- issue: ‘मसीह तुममें आकार ले’ का आशय
  choice: रूपक को बिना किसी तकनीकी धर्मसैद्धांतिक व्याख्या में बदले ज्यों का त्यों रखा गया है।
  alternative: इसे मुख्यतः समुदाय के बीच मसीह के स्वरूप के प्रकट होने या नए जन्म के विशिष्ट सिद्धांत के रूप में स्पष्ट करना।
  rationale: पद व्यक्तिगत आंतरिक परिवर्तन और सामुदायिक निर्माण—दोनों की गुंजाइश रखता है; अनुवाद इस तनाव को अनावश्यक रूप से नहीं सुलझाता।
- issue: ἐν ὑμῖν का स्थानगत/सामुदायिक अर्थ
  choice: तुममें
  alternative: तुम्हारे बीच
  rationale: ‘तुममें’ अधिक सीधा है, पर यूनानी बहुवचन और ἐν के अर्थक्षेत्र के कारण ‘तुम्हारे बीच’ भी संभव है; इसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्नेहपूर्ण और गरिमापूर्ण रखी गई है। पौलुस के असामान्य किंतु जानबूझकर प्रयुक्त मातृरूपक को नरम किए बिना सुरक्षित रखा गया है।
