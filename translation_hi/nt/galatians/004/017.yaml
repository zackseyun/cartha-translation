review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the repeated ζηλόω wordplay by using the same Hindi expression in both clauses, renders ἐκκλεῖσαι without specifying what the Galatians would be excluded from, and correctly marks the purpose introduced by ἵνα. However, “बहुत” adds an unexpressed degree of intensity, and “अच्छे उद्देश्य से नहीं” narrows οὐ καλῶς to motive, whereas the Greek more broadly evaluates the manner or propriety of their conduct.
  naturalness: The Hindi is modern, clear, and suitably dignified. “भले ढंग से नहीं” is natural and better retains the source wording’s breadth. “तुम्हें अलग कर देना” remains appropriately open-ended and readable.
  terminology: “उत्साह दिखाते हैं … उत्साह दिखाओ” consistently reflects the rhetorical repetition of ζηλόω without imposing a romantic sense. The footnotes appropriately identify the lexical alternative and the likely contextual implication of exclusion.
  issues:
  - severity: low
    issue: “बहुत” is added in the first occurrence of ζηλόω.
    rationale: ζηλοῦσιν indicates zealous/eager interest but does not itself require the additional adverb “बहुत.” Removing it avoids unnecessary intensification and keeps the two occurrences more exactly parallel.
  - severity: medium
    issue: “अच्छे उद्देश्य से नहीं” restricts οὐ καλῶς to motive.
    rationale: οὐ καλῶς means “not well/rightly/honorably” and can encompass manner, character, and motive. “भले ढंग से नहीं” preserves this broader evaluation without making an interpretive narrowing.
  revised_text: वे तुम्हारे प्रति उत्साह दिखाते हैं[a], पर भले ढंग से नहीं। बल्कि वे तुम्हें अलग कर देना चाहते हैं[b], ताकि तुम उनके प्रति उत्साह दिखाओ।
