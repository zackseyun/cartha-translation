  to: वे तुम्हारे प्रति उत्साह दिखाते हैं[a], पर भले ढंग से नहीं। बल्कि वे तुम्हें अलग कर देना चाहते हैं[b], ताकि तुम उनके प्रति उत्साह दिखाओ।
