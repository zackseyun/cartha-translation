  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/017.yaml
  text: They are zealous for you[a], but not in a good way. Rather, they want to shut you out[b], so that you may be zealous for them.
translation:
  language: hi
  text: वे तुम्हारे प्रति उत्साह दिखाते हैं[a], पर भले ढंग से नहीं। बल्कि वे तुम्हें अलग कर देना चाहते हैं[b], ताकि तुम उनके प्रति उत्साह दिखाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे प्रति उत्साह दिखाते हैं” का अनुवाद “तुम्हें अपने पक्ष में करने की बड़ी कोशिश करते हैं” भी हो सकता है। यूनानी क्रिया में किसी के प्रति प्रबल रुचि दिखाने या उसे पाने का प्रयत्न करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम्हें बाहर कर देना चाहते हैं।” संभवतः भाव यह है कि वे तुम्हें पौलुस और उसके साथियों से अलग करना चाहते हैं, ताकि तुम उन्हीं का साथ चाहो।
    reason: alternative_reading
lexical_decisions:
- source_word: ζηλοῦσιν … ζηλοῦτε (ζηλόω)
  choice: उत्साह दिखाते हैं … उत्साह दिखाओ
  rationale: यह क्रिया किसी के प्रति प्रबल रुचि, लगाव या उसे अपने पक्ष में करने की चेष्टा व्यक्त कर सकती है। दोनों प्रयोगों में समान पदावली रखने से यूनानी पाठ की अलंकारिक समानता बनी रहती है और प्रेम-प्रसंग का अनावश्यक भाव नहीं जुड़ता।
- source_word: οὐ καλῶς
  choice: पर अच्छे उद्देश्य से नहीं
  rationale: यह विरोधियों के प्रकट उत्साह के पीछे गलत मंशा को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी पद रीति या उद्देश्य दोनों की ओर संकेत कर सकता है; संदर्भ में उद्देश्य प्रमुख जान पड़ता है।
- source_word: ἐκκλεῖσαι ὑμᾶς
  choice: तुम्हें अलग कर देना
  rationale: ἐκκλείω का अर्थ बाहर कर देना या अलग कर देना है। यह अनुवाद सामाजिक और संबंधपरक दूरी का भाव रखता है, पर यह नहीं जोड़ता कि वे गलातियों को ठीक किससे अलग करना चाहते थे।
- source_word: θέλουσιν
  choice: चाहते हैं
  rationale: इच्छा व्यक्त करने वाली सामान्य क्रिया का स्पष्ट और वर्तमान हिन्दी रूप।
- source_word: ἵνα
  choice: ताकि
  rationale: विरोधियों के उद्देश्य को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: विरोधी गलातियों को किससे अलग करना चाहते थे
  choice: 'मुख्य पाठ में लक्ष्य को अनिर्दिष्ट रखा गया है: “तुम्हें अलग कर देना”।'
  alternative: उन्हें पौलुस और उसके साथियों से, कलीसिया से, या परमेश्वर की आशीष से अलग करना।
  rationale: यूनानी वाक्य यह स्पष्ट नहीं करता कि अलगाव किससे है। निकटवर्ती संदर्भ पौलुस और गलातियों के संबंध तथा प्रतिद्वंद्वी शिक्षकों के प्रभाव की ओर संकेत करता है, पर मुख्य पाठ में उसे स्पष्ट कर देना मूल की वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “तुम्हारे प्रति” और “उनके प्रति” की समान रचना मूल यूनानी के दोहरे ζηλόω को प्रतिबिंबित करती है। “अलग कर देना” जानबूझकर इतना खुला रखा गया है कि मूल पाठ की अनिर्दिष्टता बनी रहे।
