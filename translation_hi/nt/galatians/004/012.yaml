  yaml_path: translation/nt/galatians/004/012.yaml
  text: Become as I am[a], because I also am as you are, brothers; I beg you[c][b], you did me no wrong.
translation:
  language: hi
  text: भाइयो[a], मेरे जैसे बनो, क्योंकि मैं भी तुम्हारे जैसा हूँ[b]। मैं तुमसे विनती करता हूँ। तुमने मेरे साथ कोई अन्याय नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयो” यहाँ पूरी विश्वासी मण्डली के लिए सम्बोधन है और सम्भवतः इसमें स्त्री और पुरुष दोनों सम्मिलित हैं।
    reason: सांस्कृतिक टिप्पणी
  - marker: b
    text: या, “मैं भी तुम्हारे जैसा हो गया हूँ।” यूनानी में यहाँ क्रिया व्यक्त नहीं की गई है; प्रसंग के अनुसार ‘हो गया हूँ’ समझा जा सकता है।
    reason: वैकल्पिक पाठ
lexical_decisions:
- source_word: Γίνεσθε ὡς ἐγώ
  choice: मेरे जैसे बनो
  rationale: आज्ञार्थक Γίνεσθε किसी अवस्था या रुख को अपनाने का आह्वान करता है; ‘बनो’ इसे स्वाभाविक हिन्दी में व्यक्त करता है। ὡς ἐγώ का तुलनात्मक भाव ‘मेरे जैसे’ से स्पष्ट है।
- source_word: ὅτι κἀγὼ ὡς ὑμεῖς
  choice: क्योंकि मैं भी तुम्हारे जैसा हो गया हूँ
  rationale: ὅτι अपील का कारण बताता है। यूनानी वाक्यांश में क्रिया लुप्त है; प्रसंग में पहले Γίνεσθε से ‘हो गया हूँ’ ग्रहण करना पौलुस के गलातियों के समान बनने के पूर्व कार्य को सहज रूप से व्यक्त करता है, जबकि मूल की दीर्घवृत्तता पादटिप्पणी में सुरक्षित है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: पुंलिंग बहुवचन सम्बोधन का रूपगत अनुवाद; यहाँ यह सम्भवतः पूरी विश्वासी मण्डली को सम्बोधित करता है।
- source_word: δέομαι ὑμῶν
  choice: मैं तुमसे विनती करता हूँ
  rationale: δέομαι earnest request व्यक्त करता है; ‘विनती करता हूँ’ गरिमापूर्ण, वर्तमान हिन्दी में स्वाभाविक और भावानुकूल है।
- source_word: οὐδέν με ἠδικήσατε
  choice: तुमने मेरे साथ कुछ अन्याय नहीं किया
  rationale: अओरिस्ट ἠδικήσατε और प्रत्यक्ष सम्बन्ध με को स्वाभाविक हिन्दी में व्यक्त करता है; οὐδέν का अर्थ पूर्ण निषेध के रूप में ‘कुछ ... नहीं’ है।
theological_decisions:
- issue: ἀδελφοί के सम्बोधन का समावेशी आशय
  choice: मुख्य पाठ में ‘भाइयो’
  alternative: ‘भाइयो और बहनो’ अथवा ‘भाई-बहनो’
  rationale: यूनानी शब्द व्याकरणतः पुंलिंग बहुवचन है, यद्यपि सम्बोधन सम्भवतः स्त्री-पुरुष दोनों विश्वासियों को समेटता है। मुख्य पाठ स्रोत का रूप रखता है और समावेशी आशय को पादटिप्पणी में स्पष्ट करता है।
- issue: κἀγὼ ὡς ὑμεῖς में लुप्त क्रिया
  choice: ‘मैं भी तुम्हारे जैसा हो गया हूँ’
  alternative: ‘मैं भी तुम्हारे जैसा हूँ’
  rationale: यूनानी में दूसरी उपवाक्य की क्रिया व्यक्त नहीं है। पहले Γίνεσθε से ‘बनना/हो जाना’ ग्रहण करना प्रसंग में पौलुस के अन्यजातियों के समान बनने की ओर संकेत करता है, पर वर्तमान अवस्था वाला पाठ भी व्याकरणतः सम्भव है; इसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन को आरम्भ में रखकर हिन्दी वाक्य-प्रवाह स्वाभाविक बनाया गया है। छोटे वाक्य पौलुस की earnest appeal और अगले कथन की स्पष्टता बनाए रखते हैं।
