lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: दोनों प्रयोजनवाचक उपवाक्यों का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; दूसरे ἵνα को हिन्दी प्रवाह के लिए ‘और’ से जोड़ा गया है, जबकि प्रयोजन का संबंध बना रहता है।
- source_word: τοὺς ὑπὸ νόμον
  choice: व्यवस्था के अधीन लोगों को
  rationale: व्यक्तियों पर मूसा की व्यवस्था के अधिकार या अधीनता को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: गलातियों के संदर्भ में यह मुख्यतः मूसा की तोराह को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ इसका प्रतिष्ठित और सुबोध समतुल्य है।
- source_word: ἐξαγοράσῃ
  choice: छुड़ा ले
  rationale: क्रय करके मुक्त करने की पृष्ठभूमि वाले उद्धारात्मक अर्थ को सहज हिन्दी में व्यक्त करता है; ‘मोल लेकर छुड़ाए’ अधिक स्पष्ट होता, पर यूनानी में मूल्य का उल्लेख न होने के कारण अनावश्यक विस्तार से बचा गया है।
- source_word: τὴν υἱοθεσίαν
  choice: पुत्रों के रूप में गोद लिए जाने का दर्जा
  rationale: υἱοθεσία के दत्तक-ग्रहण तथा पुत्र-संबंधी पूर्ण कानूनी और उत्तराधिकार के दर्जे—दोनों को बचाता है। केवल ‘गोद लिया जाना’ पुत्र के विशिष्ट दर्जे को धुंधला कर सकता था।
- source_word: ἀπολάβωμεν
  choice: हम … पाएँ
  rationale: यहाँ इच्छित परिणाम या प्रयोजन के रूप में किसी प्रदान किए गए दर्जे को प्राप्त करने का स्वाभाविक हिन्दी रूप है; ‘वापस पाएँ’ वाला संभावित उपसर्गीय अर्थ संदर्भ में प्रमुख नहीं है।
theological_decisions:
- issue: υἱοθεσία में लिंगसूचक पुत्रत्व और सभी विश्वासियों का समावेश
  choice: पुत्रों के रूप में गोद लिए जाने का दर्जा
  alternative: गोद लिया जाना; पुत्रत्व
  rationale: यूनानी शब्द उस समय के पुत्र-संबंधी कानूनी दर्जे और उत्तराधिकार को उभारता है। मुख्य पाठ इसे बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका संदर्भ स्त्री और पुरुष सभी विश्वासियों से है।
- issue: ‘व्यवस्था के अधीन’ का संदर्भ
  choice: मुख्यतः मूसा की व्यवस्था के अधीन लोग
  alternative: सामान्य अर्थ में किसी भी कानून के अधीन सभी लोग
  rationale: गलातियों 4:4–5 का निकट संदर्भ मूसा की व्यवस्था की ओर संकेत करता है, यद्यपि पद में ‘हम’ के माध्यम से प्राप्त पुत्र-दर्जा व्यापक विश्वासी समुदाय से जुड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’ परिचित बाइबलीय शब्द है। ‘दर्जा’ जोड़ने से υἱοθεσία का कानूनी-पारिवारिक आशय स्पष्ट होता है, बिना किसी संप्रदायगत व्याख्या को आरोपित किए।
