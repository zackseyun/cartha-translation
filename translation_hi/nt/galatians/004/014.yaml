source:
  edition: SBLGNT
  text: καὶ τὸν πειρασμὸν ⸀ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/014.yaml
  text: And though my bodily condition was a trial to you[a], you did not treat me with contempt or disgust; rather, you welcomed me as an angel of God[c][b], as Messiah Jesus.
translation:
  language: hi
  text: और यद्यपि मेरी शारीरिक दशा तुम्हारे लिए एक परीक्षा थी[a], फिर भी तुमने न तो मुझे तुच्छ जाना और न घृणा से ठुकराया[b]; बल्कि तुमने मेरा स्वागत परमेश्वर के एक स्वर्गदूत के समान, मसीह यीशु[c] के समान किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मेरी देह में तुम्हारी परीक्षा”; यूनानी पाठ और वाक्य-विन्यास यहाँ कठिन हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, “थूक नहीं दिया”; यह घृणा या अस्वीकार प्रकट करने वाला कथन है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “ख्रिस्तोस यीशु”; यहाँ ख्रिस्तोस एक उपाधि है, इसलिए इसका अनुवाद “मसीह यीशु” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πειρασμὸν
  choice: परीक्षा
  rationale: संदर्भ में इसका अर्थ पाप के लिए प्रलोभन नहीं, बल्कि पौलुस की शारीरिक दशा के कारण गलातियों के सामने आई कठिन परीक्षा है।
- source_word: ὑμῶν ἐν τῇ σαρκί μου
  choice: मेरी शारीरिक दशा तुम्हारे लिए
  rationale: यह पाठ और वाक्य-विन्यास कठिन है। यह अनुवाद स्वाभाविक हिन्दी में उस अर्थ को व्यक्त करता है कि पौलुस की देहगत दशा गलातियों के लिए परीक्षा बनी, जबकि अधिक शाब्दिक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: ἐξουθενήσατε
  choice: तुच्छ जाना
  rationale: क्रिया किसी को नगण्य समझने या उसका तिरस्कार करने का भाव व्यक्त करती है।
- source_word: ἐξεπτύσατε
  choice: घृणा करके ठुकराया
  rationale: शाब्दिक चित्र ‘थूक देना’ है, जो घोर विरक्ति और अस्वीकार का संकेत देता है; मुख्य पाठ में उसका स्वाभाविक हिन्दी भाव दिया गया है।
- source_word: ἐδέξασθέ
  choice: स्वागत किया
  rationale: यहाँ क्रिया व्यक्तिगत और आदरपूर्ण ग्रहण किए जाने को दर्शाती है; ‘स्वागत किया’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ἄγγελον θεοῦ
  choice: परमेश्वर के एक दूत
  rationale: ἄγγελος का अर्थ दूत या स्वर्गदूत हो सकता है। ‘परमेश्वर का दूत’ हिन्दी में मूल की यह अर्थ-व्याप्ति बनाए रखता है और तुलना की गरिमा भी व्यक्त करता है।
- source_word: Χριστὸν Ἰησοῦν
  choice: मसीह यीशु
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है, इसलिए ‘मसीह’ उसके अर्थ को ‘क्राइस्ट’ के लिप्यंतरण से अधिक स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के दूत के समान, मसीह यीशु के समान’ तुलना का आशय
  choice: यह गलातियों द्वारा पौलुस के अत्यंत आदरपूर्ण स्वागत की रीति बताता है।
  alternative: दूसरी तुलना पहली तुलना को अलंकारिक रूप से और प्रबल करती है।
  rationale: दोनों ὡς वाक्यांश स्वागत की रीति बताते हैं; वे पौलुस की पहचान मसीह के रूप में नहीं करते। सीधे समानतासूचक अनुवाद से प्रबल भाषा और आवश्यक भेद दोनों बने रहते हैं।
- issue: σάρξ का अर्थ
  choice: शारीरिक दशा
  alternative: देह; पापी स्वभाव
  rationale: इस प्रसंग में पौलुस की देहगत कमजोरी या अस्वस्थता अभिप्रेत है। ‘पापी स्वभाव’ कहना संदर्भ में अनावश्यक धर्मवैज्ञानिक अर्थ जोड़ देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। कठिन यूनानी आरंभ को स्वाभाविक हिन्दी में स्पष्ट किया गया है, और वास्तविक पाठगत-वाक्यगत अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है। ‘देह’ को नैतिक अर्थ देने से बचते हुए शारीरिक संदर्भ स्पष्ट किया गया है।
