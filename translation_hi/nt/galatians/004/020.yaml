  text: ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/020.yaml
  text: But I wish I could be with you right now and change my tone[a], because I am perplexed about you.
translation:
  language: hi
  text: काश, मैं अभी तुम्हारे पास होता और अपना बोलने का ढंग बदल पाता[a], क्योंकि मैं तुम्हारे विषय में असमंजस में हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी आवाज़ बदल पाता”; यूनानी में शाब्दिक रूप से “अपनी आवाज़ बदलना” है। इस संदर्भ में इसका आशय संभवतः बोलने का लहजा या ढंग बदलना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤθελον
  choice: मेरी इच्छा है कि मैं ... होता ... पाता
  rationale: अपूर्णकाल यहाँ वर्तमान, किंतु पूरी न हो सकी इच्छा को कोमल ढंग से व्यक्त करता है; हिंदी में संभावनाहीन इच्छा की यह रचना उस भाव को स्वाभाविक रूप से पहुँचाती है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध अथवा संक्रमण दिखाता है।
- source_word: παρεῖναι πρὸς ὑμᾶς
  choice: तुम्हारे पास उपस्थित होता
  rationale: παρεῖναι व्यक्तिगत रूप से उपस्थित होने को और πρὸς ὑμᾶς उनके पास होने को व्यक्त करता है।
- source_word: ἄρτι
  choice: अभी
  rationale: यह वर्तमान क्षण की तात्कालिकता को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἀλλάξαι τὴν φωνήν μου
  choice: अपनी आवाज़ का ढंग बदल पाता
  rationale: φωνή का मूल अर्थ 'आवाज़' सुरक्षित रखा गया है, जबकि 'का ढंग' संदर्भ में बोलने के लहजे या रीति की संभावित अर्थछाया स्पष्ट करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पौलुस की इच्छा का कारण प्रस्तुत करता है।
- source_word: ἀποροῦμαι
  choice: मैं असमंजस में हूँ
  rationale: यह समझ न आने, अनिश्चित होने और कोई स्पष्ट उपाय न सूझने के भाव को बिना अतिशयोक्ति के व्यक्त करता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे विषय में
  rationale: व्यक्तियों के साथ यह प्रयोग संबंध या संदर्भ का भाव दे सकता है; हिंदी में 'तुम्हारे विषय में' स्वाभाविक है और कारण का अनावश्यक आरोप नहीं लगाता।
theological_decisions:
- issue: संदर्भ में φωνή का अर्थ
  choice: मुख्य पाठ में 'आवाज़ का ढंग' रखा गया है, जो आवाज़ और बोलने के लहजे दोनों की अर्थछाया बनाए रखता है।
  alternative: केवल 'लहजा' अथवा शारीरिक आवाज़
  rationale: निकटवर्ती संदर्भ में पौलुस की चरवाही-संबंधी चिंता और संबोधन की रीति प्रमुख है, फिर भी यूनानी के शाब्दिक 'आवाज़' को पूरी तरह हटाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में आत्मीय बहुवचन 'तुम' रखा गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है; मूल की भावनात्मक अनिश्चितता और φωνή की अर्थगत गुंजाइश सुरक्षित रखी गई है।
