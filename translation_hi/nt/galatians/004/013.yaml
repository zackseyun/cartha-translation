  text: οἴδατε δὲ ὅτι δι’ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/013.yaml
  text: But you know that it was because of an illness of the flesh that I first proclaimed the good news to you,[a]
translation:
  language: hi
  text: पर तुम जानते हो कि शरीर की बीमारी के कारण मैंने पहली बार तुम्हें शुभ समाचार सुनाया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शरीर की दुर्बलता के कारण।” यूनानी वाक्यांश का शाब्दिक अर्थ “शरीर की दुर्बलता/बीमारी के कारण” है।
    reason: ἀσθένεια के ‘बीमारी’ और ‘दुर्बलता’ दोनों सम्भव अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: οἴδατε
  choice: तुम जानते हो
  rationale: οἶδα का रूप पूर्णकाल का है, पर अर्थ वर्तमानकालीन है; यह गलातियों की पहले से ज्ञात बात की ओर संकेत करता है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले कथन से हल्का विरोध अथवा विषयांतर दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: δι’ ἀσθένειαν τῆς σαρκὸς
  choice: शरीर की बीमारी के कारण
  rationale: Accusative के साथ διά कारण व्यक्त करता है। ἀσθένεια बीमारी या दुर्बलता दोनों हो सकता है, और τῆς σαρκός यहाँ शारीरिक दशा बताता है; मुख्य पाठ में प्रसंगानुकूल ‘बीमारी’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εὐηγγελισάμην
  choice: मैंने शुभ समाचार सुनाया
  rationale: यह सुसमाचार की घोषणा करने को दर्शाता है; ‘शुभ समाचार सुनाया’ सामान्य पाठक के लिए स्पष्ट, स्वाभाविक और क्रियात्मक है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: Dative अप्रत्यक्ष कर्म को हिन्दी में स्वाभाविक रूप से ‘तुम्हें’ कहा गया है।
- source_word: τὸ πρότερον
  choice: पहली बार
  rationale: यह पौलुस द्वारा उन्हें पहले अवसर पर शुभ समाचार सुनाने की ओर संकेत करता है; ‘पहली बार’ सम्भावित अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀσθένειαν τῆς σαρκὸς में σάρξ का अर्थ
  choice: 'शारीरिक अर्थ: ‘शरीर की बीमारी’'
  alternative: ‘शरीर की दुर्बलता’; रूपकात्मक दुर्बलता; पापी स्वभाव
  rationale: प्रसंग पौलुस की उस शारीरिक दशा की ओर संकेत करता है जो उसके पहले प्रचार के अवसर से जुड़ी थी। यहाँ नैतिक ‘पापी स्वभाव’ का अर्थ थोपना उचित नहीं है। बीमारी और दुर्बलता की वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। सम्बोधन के लिए ‘तुम’ रखा गया है, जो समुदाय को संबोधित बहुवचन का स्वाभाविक रूप है। ‘शुभ समाचार’ साधारण पाठकों के लिए स्पष्ट है और यूनानी क्रिया के घोषणात्मक भाव को बनाए रखता है।
