source:
  edition: SBLGNT
  text: ⸀ποῦ ⸀οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ⸀ἐξορύξαντες ἐδώκατέ μοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/015.yaml
  text: Where then is your blessedness? For I testify to you that[a], if possible[b], you would have torn out your eyes and given them to me.
translation:
  language: hi
  text: तो अब तुम्हारा धन्य होने का वह भाव कहाँ है?[a] क्योंकि मैं तुमसे गवाही देकर कहता हूँ कि यदि संभव होता, तो तुम अपनी आँखें निकालकर[b] मुझे दे देते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा वह धन्य होना कहाँ है?” अथवा “तुम्हारी वह आशीष कहाँ है?” यूनानी शब्द धन्य होने की दशा या किसी को धन्य मानने अथवा कहने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में अत्यंत तीखी अभिव्यक्ति है: “अपनी आँखें निकालकर।” संभवतः यह उनके पहले के समर्पण को दर्शाने वाली अतिशयोक्ति है; कुछ लोग इसे पौलुस की शारीरिक दशा की ओर संकेत भी मानते हैं।'
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: ποῦ οὖν
  choice: तो अब … कहाँ गया?
  rationale: यह आलंकारिक प्रश्न गलातियों की पहले की मनोवृत्ति के अब लुप्त हो जाने को पूछता है। ‘तो अब’ οὖν के निष्कर्षात्मक और प्रसंग को आगे बढ़ाने वाले बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μακαρισμὸς ὑμῶν
  choice: अपने को धन्य समझने का तुम्हारा वह भाव
  rationale: μακαρισμός धन्य होने की दशा या किसी को धन्य मानने/कहने का बोध दे सकता है। प्रसंग में यह पौलुस को ग्रहण करते समय गलातियों द्वारा अपने को धन्य मानने की पूर्व मनोवृत्ति को दर्शाता है; यह हिन्दी अभिव्यक्ति उस अर्थ को स्पष्ट रखते हुए मूल की अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखती है।
- source_word: μαρτυρῶ γὰρ ὑμῖν
  choice: क्योंकि मैं तुम्हारे विषय में गवाही देता हूँ
  rationale: μαρτυρέω का गंभीर, साक्ष्य देने वाला स्वर रखा गया है। प्रसंग में यह गलातियों के पूर्व समर्पण के पक्ष में दी गई गवाही है; ‘तुम्हारे विषय में’ हिन्दी में स्वाभाविक है और ὑμῖν के संदर्भगत बल को व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह पौलुस की गवाही की विषय-वस्तु का परिचय देता है, कारण का नहीं।
- source_word: εἰ δυνατὸν
  choice: यदि संभव होता
  rationale: संक्षिप्त यूनानी शर्त को स्वाभाविक हिन्दी में रखा गया है। ‘होता’ अतीत की ऐसी स्थिति का संकेत देता है जो वास्तव में संभव नहीं हुई, पर वाक्य को अनावश्यक रूप से नहीं खोलता।
- source_word: τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες
  choice: अपनी आँखें निकालकर
  rationale: ἐξορύσσω की तीखी और ठोस छवि को नरम किए बिना रखा गया है। ‘अपनी’ हिन्दी में स्वाभाविक रूप से ὑμῶν को व्यक्त करता है।
- source_word: ἐδώκατέ μοι
  choice: मुझे दे देते
  rationale: शर्तयुक्त भूतकालीन कथन को सहज हिन्दी में व्यक्त करता है और ‘आँखें’ को कर्म के रूप में स्पष्ट बनाए रखता है।
theological_decisions:
- issue: आँखें निकाल देने की भाषा को शाब्दिक छवि के रूप में रखना या सामान्य उदारता में बदल देना
  choice: मुख्य पाठ में ‘अपनी आँखें निकालकर मुझे दे देते’ की ठोस छवि रखी गई है।
  alternative: ‘तुम मुझे कुछ भी दे देते’ जैसे सामान्य कथन में इसे नरम करना।
  rationale: यूनानी पाठ स्पष्ट रूप से आँखों का उल्लेख करता और अत्यंत तीखी क्रिया का प्रयोग करता है। यह अतिशयोक्ति हो सकती है और संभवतः पौलुस की शारीरिक दशा की ओर संकेत भी कर सकती है, पर अनुवाद किसी एक व्याख्या को निश्चित नहीं करता।
- issue: μακαρισμός को केवल आनंद, आशीष, या धन्यता की दशा मानना
  choice: गलातियों के ‘अपने को धन्य समझने’ की मनोवृत्ति के रूप में प्रस्तुत किया गया है, और अन्य अर्थ पादटिप्पणी में दिए गए हैं।
  alternative: ‘तुम्हारा आनंद’, ‘तुम्हारी आशीष’, या ‘तुम्हारा धन्य होना’।
  rationale: प्रसंग उनकी पूर्व प्रतिक्रिया की ओर संकेत करता है, जबकि शब्द स्वयं धन्य दशा या धन्य घोषित करने का अर्थ भी रख सकता है। मुख्य पाठ को समझने योग्य रखते हुए अर्थगत विस्तार को पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘धन्य’ बाइबलीय और सामान्य धार्मिक हिन्दी में परिचित है; ‘भाव’ अमूर्त यूनानी संज्ञा को साधारण पाठक के लिए समझने योग्य बनाता है। सर्वनाम-रूप ‘तुम्हारा/तुम्हारे’ बहुवचन समुदाय को संबोधित करते हैं।
