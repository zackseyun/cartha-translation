lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: पिछले पद में वर्णित वर्तमान यरूशलेम के साथ स्पष्ट विरोध दिखाता है।
- source_word: ἄνω
  choice: ऊपर की
  rationale: मूल स्थान-संबंधी रूपक को बनाए रखता है और इसे केवल ‘स्वर्गीय’ कहकर अधिक व्याख्यायित नहीं करता।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित मानक नाम-रूप।
- source_word: ἐλευθέρα
  choice: स्वतंत्र
  rationale: दास और स्वतंत्र के प्रसंगगत विरोध को सुरक्षित रखते हुए विशेषण को सीधे व्यक्त करता है; मूल में ‘स्त्री’ शब्द नहीं जोड़ा गया है।
- source_word: ἥτις
  choice: और वह
  rationale: यरूशलेम को माता के रूप में व्यक्तित्व दिए जाने को स्वाभाविक हिन्दी में प्रकट करता है, जबकि अधिक शाब्दिक संबंधवाचक विकल्प पादटिप्पणी में दिया गया है।
- source_word: μήτηρ
  choice: माता
  rationale: मातृत्व के केंद्रीय रूपक को गरिमापूर्ण और सहज हिन्दी में बनाए रखता है।
- source_word: ἡμῶν
  choice: हमारी
  rationale: प्रथम पुरुष बहुवचन संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘ऊपर की यरूशलेम’ का मातृरूप में मानवीकरण
  choice: ‘और वह हमारी माता है’
  alternative: ‘जो हमारी माता है’
  rationale: पौलुस के हाजिरा-सारा रूपक में यरूशलेम को स्त्री और माता के रूप में प्रस्तुत किया गया है। ‘वह’ इस मानवीकरण को स्पष्ट करता है, पर कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘स्वतंत्र’ आसपास के दासता–स्वतंत्रता विरोध से शब्दगत संबंध बनाए रखता है।
