  yaml_path: translation/nt/galatians/004/026.yaml
  text: But the Jerusalem above is free[a], and she is our mother.
translation:
  language: hi
  text: पर ऊपर की यरूशलेम स्वतंत्र है, और वह[a] हमारी माता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
