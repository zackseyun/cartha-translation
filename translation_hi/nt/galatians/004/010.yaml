  text: You are carefully observing days and months and seasons and years.
translation:
  language: hi
  text: तुम दिनों, महीनों, नियत समयों और वर्षों का बड़ी सावधानी से पालन करते हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम दिनों, महीनों, निर्धारित समयों और वर्षों का पालन करते हो।” यह सूची कैलेंडर-संबंधी पालन की ओर संकेत करती है; “नियत समयों” के लिए “निर्धारित समयों” भी संभव है।
    reason: καιρούς के वैकल्पिक अर्थ तथा सूची के कैलेंडर-संबंधी संदर्भ को स्पष्ट करना।
lexical_decisions:
- source_word: ἡμέρας
  choice: दिनों
  rationale: ἡμέρα का सीधा बहुवचन अनुवाद है। धार्मिक पंचांग का भाव प्रसंग से आता है, इसलिए मुख्य पाठ में ‘विशेष’ या ‘पवित्र’ नहीं जोड़ा गया।
- source_word: παρατηρεῖσθε
  choice: बड़ी सावधानी से मानते हो
  rationale: वर्तमानकालीन क्रिया ध्यानपूर्वक पालन या निरीक्षण करने का भाव दे सकती है। यहाँ कैलेंडर-संबंधी पालन के प्रसंग में ‘मानते हो’ स्वाभाविक हिंदी है और ‘बड़ी सावधानी से’ क्रिया में निहित सूक्ष्म सतर्कता को व्यक्त करता है।
- source_word: μῆνας
  choice: महीनों
  rationale: μήν का सीधा बहुवचन अनुवाद, जो समय-इकाइयों की सूची को बनाए रखता है।
- source_word: καιρούς
  choice: नियत समयों
  rationale: καιρός यहाँ निर्धारित अथवा उपयुक्त समय को सूचित कर सकता है। ‘नियत समय’ धार्मिक पंचांग-संबंधी आशय को व्यक्त करता है, पर इसे सीधे ‘पर्व’ नहीं बनाता।
- source_word: ἐνιαυτούς
  choice: वर्षों
  rationale: ἐνιαυτός का सीधा बहुवचन अनुवाद, जो सूची की बढ़ती समय-सीमा को पूरा करता है।
- source_word: καὶ
  choice: और
  rationale: समन्वयकारी καὶ को ‘और’ से व्यक्त किया गया है; हिंदी की स्वाभाविक सूची-रचना में अंतिम पद से पहले इसे रखा गया है।
theological_decisions:
- issue: क्या समय-इकाइयों को स्पष्ट रूप से यहूदी, धार्मिक या पवित्र अनुष्ठान कहा जाए
  choice: मुख्य पाठ में केवल दिन, महीने, नियत समय और वर्ष रखे गए हैं।
  alternative: ‘विशेष दिन’, ‘धार्मिक महीने’ या ‘पर्व’ जैसे अधिक स्पष्ट शब्द जोड़े जाएँ।
  rationale: यूनानी पाठ समय-संबंधी पदों की सूची देता है, उन्हें स्पष्ट रूप से यहूदी या पवित्र नहीं कहता। धार्मिक कैलेंडर का आशय प्रसंग से स्पष्ट होता है; अनुवाद में उससे अधिक विशिष्टता नहीं जोड़ी गई।
- issue: παρατηρεῖσθε की तीव्रता
  choice: ‘बड़ी सावधानी से मानते हो’
  alternative: केवल ‘मानते हो’ या ‘पालन करते हो’
  rationale: क्रिया ध्यानपूर्वक या सूक्ष्मता से पालन करने का भाव धारण कर सकती है। चुना गया रूप इस संभावित बल को बनाए रखता है, जबकि किसी खास संप्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सीधे संबोधन का प्रयोग किया गया है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘मानते हो’ धार्मिक दिनों या समयों के पालन के लिए सामान्य और स्वाभाविक है।
