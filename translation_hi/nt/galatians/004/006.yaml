source:
  edition: SBLGNT
  text: ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ⸀ἡμῶν, κρᾶζον· Αββα ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/006.yaml
  text: And because you are sons[a], God sent the Spirit of his Son into our hearts, crying, “Abba[c][b], Father.”
translation:
  language: hi
  text: और क्योंकि तुम पुत्र[b] हो, परमेश्वर ने अपने पुत्र की आत्मा हमारे[a] हृदयों में भेजी, जो पुकारती है, “अब्बा[c], पिता!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘हमारे हृदयों’ के स्थान पर ‘तुम्हारे हृदयों’ है।
    reason: textual_variant
  - marker: b
    text: ‘पुत्र’ यहाँ पौलुस की पुत्रत्व और उत्तराधिकार संबंधी भाषा को बनाए रखता है; इसका आशय सभी विश्वासियों से है, केवल पुरुषों से नहीं।
    reason: cultural_note
  - marker: c
    text: ‘अब्बा’ अरामी भाषा में ‘पिता’ के लिए प्रयुक्त संबोधन है; मूल संबोधन के बल और आत्मीयता को बनाए रखने के लिए इसे यहाँ ज्यों का त्यों रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι δέ
  choice: और क्योंकि
  rationale: ὅτι कारण या आधार बताता है और δέ हल्का संयोजक बल रखता है; ‘और क्योंकि’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐστε
  choice: तुम ... हो
  rationale: वर्तमानकालीन εἰμί पाठकों की मौजूदा स्थिति बताता है, न कि उनके ‘बन जाने’ की प्रक्रिया।
- source_word: υἱοί
  choice: पुत्र
  rationale: यहाँ पौलुस का तर्क पुत्रत्व और उत्तराधिकार पर आधारित है। ‘पुत्र’ उस कानूनी-धर्मवैचारिक बिंब को बनाए रखता है; संदर्भ में इसमें सभी विश्वासी सम्मिलित हैं।
- source_word: ἐξαπέστειλεν
  choice: भेजा
  rationale: यह पूर्ण हुई ईश्वरीय क्रिया को सरल और स्वाभाविक हिन्दी में व्यक्त करता है; ‘भेज दिया’ अनावश्यक अतिरिक्त बल दे सकता था।
- source_word: τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ
  choice: अपने पुत्र का आत्मा
  rationale: यह यूनानी संबंधवाचक संरचना और ‘पुत्र के आत्मा’ की धर्मवैचारिक विशिष्टता को सुरक्षित रखता है।
- source_word: εἰς τὰς καρδίας ἡμῶν
  choice: हमारे हृदयों में
  rationale: ‘हृदय’ मूल बाइबलीय मानव-विज्ञान संबंधी पद को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: κρᾶζον
  choice: जो पुकारता है
  rationale: नपुंसकलिंग एकवचन कृदंत πνεῦμα से मेल खाता है, इसलिए आत्मा को पुकारने वाला स्पष्ट किया गया है; वर्तमान कृदंत का जीवंत भाव भी बना रहता है।
- source_word: Αββα
  choice: अब्बा
  rationale: यूनानी पाठ में सुरक्षित अरामी संबोधन को लिप्यंतरित किया गया है, ताकि मूल संबोधन का बल और आत्मीयता बनी रहे।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: Αββα के साथ यह अर्थ की दृष्टि से प्रत्यक्ष संबोधन है; हिन्दी में ‘पिता’ स्वाभाविक है, जबकि ‘वह पिता’ या ‘पिता परमेश्वर’ मूल से अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: दत्तक ग्रहण और उत्तराधिकार के संदर्भ में υἱοί का अनुवाद
  choice: पुत्र
  alternative: सन्तान / बच्चे
  rationale: गलातियों 3–4 में पौलुस का तर्क पुत्रत्व से उत्तराधिकारी होने पर टिका है। ‘पुत्र’ उस बिंब को बनाए रखता है, जबकि टिप्पणी स्पष्ट करती है कि इसका आशय केवल पुरुष विश्वासियों से नहीं है।
- issue: ‘हृदयों’ के साथ सर्वनाम का पाठांतर
  choice: हमारे हृदयों
  alternative: तुम्हारे हृदयों
  rationale: दिए गए SBLGNT मुख्य पाठ में ἡμῶν (‘हमारे’) है, इसलिए उसे मुख्य पाठ में रखा गया है; प्रसिद्ध वैकल्पिक पाठ को पादटिप्पणी में बताया गया है।
- issue: पुकारने वाला कौन है
  choice: आत्मा पुकारता है
  alternative: विश्वासी आत्मा के द्वारा पुकारते हैं
  rationale: κρᾶζον व्याकरण की दृष्टि से τὸ πνεῦμα से मेल खाता है, इसलिए इस उपवाक्य में आत्मा ही स्पष्ट कर्ता है; विश्वासियों की सहभागिता को मूल से आगे बढ़कर मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। वाक्यरचना मूल के कारणसूचक संबंध और आत्मा को पुकारने वाले कर्ता के रूप में स्पष्ट रखती है। ‘पुत्र’ तथा ‘अब्बा’ जैसे प्रमुख पदों को पादटिप्पणियों द्वारा सामान्य पाठक के लिए समझाया गया है।
