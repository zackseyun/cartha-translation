- issue: κατὰ σάρκα और δι’ ἐπαγγελίας का विरोध
  choice: ‘शरीर के अनुसार’ बनाम ‘प्रतिज्ञा के द्वारा’
  alternative: ‘साधारण मानवीय रीति से’ बनाम ‘परमेश्वर की प्रतिज्ञा के फलस्वरूप’
  rationale: मुख्य पाठ पौलुस की शब्दावली और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है। संदर्भ में यह प्राकृतिक मानवीय जन्म और परमेश्वर की प्रतिज्ञा से हुए जन्म का विरोध है, न कि शारीरिक जन्म को अपने-आप पापपूर्ण बताना।
