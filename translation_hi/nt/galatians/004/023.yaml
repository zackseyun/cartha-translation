lexical_decisions:
- source_word: παιδίσκη
  choice: दासी
  rationale: यह शब्द हाजिरा की दासता की स्थिति को स्पष्ट रखता है, जो आगे पौलुस के तर्क में महत्त्वपूर्ण है; ‘सेविका’ इस सामाजिक विरोध को कुछ नरम कर देता।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: यह पौलुस की प्रमुख शब्दावली को सुरक्षित रखता है और यहाँ साधारण मानवीय प्रजनन का संकेत देता है; अर्थ-स्पष्टीकरण पादटिप्पणी में दिया गया है।
- source_word: γεγέννηται
  choice: जन्मा था
  rationale: यूनानी पूर्ण निष्क्रिय रूप का इस ऐतिहासिक तुलना में स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἐλευθέρα
  choice: स्वतंत्र स्त्री
  rationale: यह दासी के साथ सामाजिक और तर्कगत विरोध को स्पष्ट रूप से बनाए रखता है।
- source_word: δι’ ἐπαγγελίας
  choice: प्रतिज्ञा के द्वारा
  rationale: यह जन्म के पीछे परमेश्वर की प्रतिज्ञा की निर्णायक भूमिका व्यक्त करता है और यूनानी में निहित माध्यम/कारण के भाव को बनाए रखता है।
- source_word: ὁ μὲν ... ὁ δὲ
  choice: पुत्र ... जबकि ... पुत्र
  rationale: दोनों निहित कर्ताओं को ‘पुत्र’ कहकर स्पष्ट करना हिन्दी में तुलना को सहज और असंदिग्ध बनाता है।
