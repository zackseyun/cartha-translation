base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/021.yaml
  text: Tell me[a], you who want to be under the law, do you not listen to the law?
translation:
  language: hi
  text: मुझे बताओ, तुम जो व्यवस्था के अधीन रहना चाहते हो, क्या तुम व्यवस्था की बात नहीं सुनते?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम व्यवस्था को नहीं सुनते?” यूनानी क्रिया का अर्थ ‘सुनना’ या ध्यान देकर ‘बात सुनना’ हो सकता है। यहाँ “व्यवस्था” से सम्भवतः मूसा की व्यवस्था, विशेषकर वह शास्त्रीय वृत्तांत, अभिप्रेत है जिसे पौलुस आगे उद्धृत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγετέ μοι
  choice: मुझे बताओ
  rationale: वर्तमानकालिक बहुवचन आज्ञार्थक पद सीधे संबोधन और चुनौती को व्यक्त करता है। ‘मुझे बताओ’ स्वाभाविक आधुनिक हिन्दी में इसकी आज्ञार्थक शक्ति बनाए रखता है।
- source_word: οἱ ὑπὸ νόμον θέλοντες εἶναι
  choice: तुम जो व्यवस्था के अधीन रहना चाहते हो
  rationale: संज्ञात्मक कृदंत एक ऐसे समूह को संबोधित करता है जिसकी पहचान इस इच्छा से होती है। ‘व्यवस्था के अधीन’ पौलुस की वैधानिक और वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: νόμον / τὸν νόμον
  choice: व्यवस्था / व्यवस्था
  rationale: 'दोनों स्थानों पर एक ही शब्द रखकर पौलुस का शब्द-संबंध सुरक्षित किया गया है: जिस व्यवस्था के अधीन वे होना चाहते हैं, उसी व्यवस्था की गवाही उन्हें सुननी चाहिए। सन्दर्भ मूसा की व्यवस्था और आगे उद्धृत शास्त्रीय वृत्तांत—दोनों की ओर संकेत कर सकता है।'
- source_word: οὐκ ἀκούετε
  choice: क्या तुम व्यवस्था की बात नहीं सुनते?
  rationale: ἀκούω का अर्थ ‘सुनना’ या ध्यान देकर ‘बात मानना/सुनना’ हो सकता है। ‘की बात सुनना’ हिन्दी में ध्यान देने का भाव व्यक्त करता है, जबकि मूल की अर्थगत खुलावट को पूरी तरह समाप्त नहीं करता।
theological_decisions:
- issue: ‘व्यवस्था’ का सन्दर्भ
  choice: दोनों बार ‘व्यवस्था’ रखा गया है; दूसरे प्रयोग में ‘की बात सुनना’ उसके शास्त्रीय कथन की ओर भी संकेत करता है।
  alternative: ‘मूसा की व्यवस्था’ कहकर सन्दर्भ को स्पष्ट करना, अथवा दूसरे प्रयोग को ‘व्यवस्था-ग्रन्थ’ कहना।
  rationale: मूल νόμος के दोहरे प्रयोग में वाचा के अधीन होने और तोराह/शास्त्र की गवाही सुनने के बीच जानबूझकर तनाव है। विशिष्ट विस्तार जोड़ना इस शब्द-क्रीड़ा को समय से पहले सीमित कर देता।
- issue: ἀκούω में सुनने और ध्यान देने का सम्बन्ध
  choice: ‘व्यवस्था की बात नहीं सुनते?’
  alternative: ‘क्या तुम व्यवस्था को नहीं सुनते?’ या ‘क्या तुम व्यवस्था पर ध्यान नहीं देते?’
  rationale: पहला विकल्प हिन्दी में अस्वाभाविक हो सकता है, जबकि दूसरा केवल ध्यान देने के अर्थ को चुनकर ‘सुनने’ की मूल छवि खो देता है। चुना हुआ रूप दोनों के बीच संतुलन रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और सम्मानपूर्ण हिन्दी। ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में νόμος के लिए परिचित शब्द है। वाक्य की प्रश्नात्मक चुनौती और ‘व्यवस्था’ के दोहरे प्रयोग को बनाए रखा गया है।
