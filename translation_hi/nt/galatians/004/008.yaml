source:
  edition: SBLGNT
  text: Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς ⸂φύσει μὴ⸃ οὖσι θεοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/008.yaml
  text: But at that time[a], when you did not know God, you were enslaved to those that by nature are not gods.
translation:
  language: hi
  text: परन्तु उस समय[a], जब तुम परमेश्वर को नहीं जानते थे, तुम उनके दास थे, जो स्वभाव से देवता नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु पहले, परमेश्वर को न जानते हुए, तुम उनके दास थे, जो वास्तव में स्वभाव से देवता नहीं हैं।”
    reason: तότε μὲν और कृदन्तीय वाक्यांश की वैकल्पिक, अधिक रूप-समीपी अभिव्यक्ति।
lexical_decisions:
- source_word: Ἀλλὰ
  choice: परन्तु
  rationale: पिछले तर्क के साथ स्पष्ट विरोध दर्शाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τότε μὲν
  choice: उस समय
  rationale: गलातियों के पहले के जीवन-काल की ओर संकेत करता है; μέν से अगले पद में आने वाला विरोध भी खुला रहता है।
- source_word: οὐκ εἰδότες θεὸν
  choice: जब तुम परमेश्वर को नहीं जानते थे
  rationale: कृदन्त का प्रसंगानुकूल कालवाचक अर्थ व्यक्त करता है और परमेश्वर को जानने के संबंधपरक भाव को बनाए रखता है।
- source_word: θεὸν
  choice: परमेश्वर
  rationale: एकवचन शब्द सच्चे परमेश्वर को बहुवचन कथित ईश्वरों से अलग करता है।
- source_word: ἐδουλεύσατε
  choice: तुम उनके दास थे
  rationale: δουλεύω में निहित दासता और बंधन का बल सुरक्षित रखता है, जो गलातियों के दासता-स्वतंत्रता विषय में महत्त्वपूर्ण है।
- source_word: τοῖς ... οὖσι θεοῖς
  choice: उनके ... जो ... ईश्वर नहीं हैं
  rationale: मूल की अनिर्दिष्ट सत्ता या वस्तु को अनावश्यक रूप से मूर्ति अथवा दुष्टात्मा नहीं ठहराता।
- source_word: φύσει μὴ
  choice: स्वभाव से ... नहीं
  rationale: इन कथित ईश्वरों की वास्तविक प्रकृति के विषय में निषेध व्यक्त करता है, केवल उनकी प्रतिष्ठा के विषय में नहीं।
- source_word: θεοῖς
  choice: ईश्वर
  rationale: बहुवचन अर्थ वाक्य के 'जो ... हैं' में प्रकट है; हिन्दी में 'ईश्वरों' की अपेक्षा यह विधेय-प्रयोग अधिक स्वाभाविक है और सच्चे परमेश्वर से भेद बना रहता है।
theological_decisions:
- issue: पहले जिनकी उपासना या सेवा की जाती थी, उनका स्वरूप
  choice: जो स्वभाव से ईश्वर नहीं हैं
  alternative: जो वास्तव में ईश्वर नहीं हैं
  rationale: φύσει μὴ οὖσι θεοῖς उनकी वास्तविक प्रकृति का निषेध करता है। पाठ स्वयं यह निश्चित नहीं करता कि वे मूर्तियाँ हैं या आत्मिक शक्तियाँ, इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दास थे’ मूल के बंधन-बोध को ‘सेवा करते थे’ से अधिक स्पष्ट रूप में सुरक्षित रखता है।
