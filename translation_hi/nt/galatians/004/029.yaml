- source_word: ἀλλ’
  choice: परन्तु
  rationale: यह पिछले कथन के साथ विरोध दर्शाता है; ‘परन्तु’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: ὥσπερ τότε ... οὕτως καὶ νῦν
  choice: जैसे उस समय ... वैसे ही अब भी होता है
  rationale: यूनानी की सहसंबंधी तुलना और तब-अब के कालगत विरोध को बनाए रखता है; अंतर्निहित क्रिया को सहज हिन्दी के लिए ‘होता है’ से व्यक्त किया गया है।
- source_word: ὁ ... γεννηθεὶς
