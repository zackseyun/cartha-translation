  yaml_path: translation/nt/galatians/004/029.yaml
  text: But just as then the one born according to the flesh persecuted the one born according to the Spirit[b][a], so also it is now.
translation:
  language: hi
  text: परन्तु जैसे उस समय जो शरीर के अनुसार जन्मा था[b], वह उस व्यक्ति को सताता था जो आत्मा के अनुसार जन्मा था[a], वैसे ही अब भी होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से दूसरे खंड में केवल “आत्मा के अनुसार वाला” है; “जन्मा था” पहले खंड से समझकर जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: “शरीर के अनुसार” का अर्थ यहाँ सामान्य मानवीय रीति से जन्मा हुआ भी हो सकता है।
    reason: lexical_alternative
