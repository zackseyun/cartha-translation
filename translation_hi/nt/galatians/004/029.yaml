  rationale: संज्ञा के रूप में प्रयुक्त भूतकालिक कर्मवाच्य कृदन्त को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: पौलुस के ‘शरीर’ और ‘आत्मा’ के शब्दगत विरोध को सुरक्षित रखता है तथा इसे अनावश्यक रूप से ‘पापी स्वभाव’ नहीं बनाता।
- source_word: ἐδίωκε
  choice: सताया था
  rationale: संदर्भ में शत्रुतापूर्ण उत्पीड़न का अर्थ देता है; हिन्दी में ‘सताना’ स्वाभाविक है और अपूर्ण भूतकालीन क्रिया को प्रसंगानुकूल व्यक्त करता है।
- source_word: τὸν κατὰ πνεῦμα
  choice: आत्मा के अनुसार जन्मे हुए
  rationale: ‘जन्मे हुए’ पहले खंड से अध्याहृत है; उसे दोहराने से समानांतरता हिन्दी में स्पष्ट होती है, जबकि ‘के अनुसार’ κατά की व्यापकता बनाए रखता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: गलातियों के इस प्रसंग में संकेत पवित्र आत्मा की ओर है; हिन्दी बाइबल-परंपरा में ‘आत्मा’ का रूप संदर्भ से यह अर्थ वहन करता है।
- source_word: νῦν
  choice: अब
  rationale: प्राचीन घटना को पौलुस की वर्तमान स्थिति से जोड़ने वाला सीधा कालवाचक क्रियाविशेषण है।
theological_decisions:
- issue: इश्माएल और इसहाक के विरोध में κατὰ σάρκα का अर्थ
  choice: मुख्य पाठ में ‘शरीर के अनुसार’, जिसका आशय सामान्य मानवीय जन्म से है
  alternative: पापी स्वभाव के अनुसार जन्मा हुआ
  rationale: निकटवर्ती संदर्भ सामान्य जन्म को प्रतिज्ञा/आत्मा से जुड़े जन्म के साथ रखता है। शाब्दिक अभिव्यक्ति पौलुस की शब्दावली बचाती है, और पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
- issue: πνεῦμα का संदर्भ
  choice: पवित्र आत्मा
  alternative: मानवीय आत्मा अथवा आध्यात्मिक सिद्धान्त
  rationale: गलातियों में प्रतिज्ञा, परमेश्वर की क्रिया और विश्वासियों की पहचान से जुड़ा विरोध पवित्र आत्मा की ओर संकेत करता है; फिर भी अनुवाद मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है।
- issue: दूसरे खंड में γεννηθεὶς का अध्याहार
  choice: स्पष्टता के लिए ‘जन्मे हुए’ दोहराया गया
  alternative: केवल ‘आत्मा के अनुसार वाले’
  rationale: यूनानी में शब्द पहले खंड से समझा जाता है; हिन्दी में दोहराव समानांतरता को साफ करता है, और पादटिप्पणी इस पूर्ति की सूचना देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रूप। ‘शरीर के अनुसार’ और ‘आत्मा के अनुसार’ की समानांतर संरचना मूल की धर्मवैचारिक तनातनी को बिना अधिक व्याख्या के बनाए रखती है।
