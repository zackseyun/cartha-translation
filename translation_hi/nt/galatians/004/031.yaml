id: GAL.4.31
reference: Galatians 4:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀διό, ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/031.yaml
  text: Therefore[a], brothers, we are not children of the servant woman[b], but of the free woman.
translation:
  language: hi
  text: इसलिए, भाइयो[a], हम दासी[b] की संतान नहीं, बल्कि स्वतंत्र स्त्री की संतान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में शाब्दिक रूप से ‘भाइयो’ है, जो प्रतिनिधिक रूप से स्त्री-पुरुष दोनों वाले समुदाय को संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दास स्त्री’; यूनानी शब्द किसी दासी या सेविका को दर्शाता है। यहाँ पौलुस के रूपक में हाजिरा का सारा से विरोध किया गया है (गलातियों 4:21–31)।
    reason: lexical_alternative
lexical_decisions:
- source_word: διό
  choice: इसलिए
  rationale: यह पिछले रूपकात्मक तर्क से निकला निष्कर्ष सूचित करता है; ‘इसलिए’ उसके तार्किक बल को सहज हिन्दी में बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यह ἀδελφός का संबोधन बहुवचन है। मूल का पुल्लिंग पारिवारिक संबोधन रखा गया है; पूरे समुदाय, जिसमें स्त्रियाँ भी सम्मिलित हैं, की ओर उसके प्रतिनिधिक संकेत को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: οὐκ ἐσμὲν
  choice: हम ... नहीं ... हैं
  rationale: यह वर्तमानकालीन निषेध का सीधा अनुवाद है; मूल में ‘अब नहीं’ जैसा कोई स्पष्ट कालगत तत्व नहीं है।
- source_word: παιδίσκης
  choice: दासी
  rationale: यह शब्द दास अथवा सेवक स्थिति वाली स्त्री को दर्शाता है। यहाँ हाजिरा और सारा के बीच दासता तथा स्वतंत्रता का विरोध केंद्रीय है, इसलिए ‘दासी’ सटीक और स्वाभाविक है।
- source_word: τέκνα
  choice: संतान
  rationale: यह लिंग-समावेशी शब्द है और पुत्रों तक सीमित नहीं है; ‘संतान’ हिन्दी में सामूहिक पारिवारिक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकारात्मक कथन के बाद आने वाले स्पष्ट विरोध को हिन्दी में ‘बल्कि’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῆς ἐλευθέρας
  choice: स्वतंत्र स्त्री
  rationale: स्त्रीलिंग विशेषण संज्ञा के रूप में प्रयुक्त हुआ है और संदर्भ में सारा की ओर संकेत करता है; ‘स्वतंत्र स्त्री’ स्त्री संदर्भ तथा दासी के साथ विरोध दोनों स्पष्ट रखता है।
theological_decisions:
- issue: हाजिरा और सारा के रूपक में दासता तथा स्वतंत्रता के विरोध को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘दासी’ और ‘स्वतंत्र स्त्री’
  alternative: ‘सेविका’ और ‘स्वतंत्र स्त्री’
  rationale: पौलुस के तर्क में बंधन और स्वतंत्रता का तीखा विरोध महत्वपूर्ण है। ‘दासी’ उस सामाजिक और रूपकात्मक विरोध को बिना अतिरिक्त सिद्धान्त जोड़े सुरक्षित रखता है।
- issue: मिश्रित समुदाय को संबोधित करने वाले ἀδελφοί का अनुवाद
  choice: मुख्य पाठ में ‘भाइयो’, और व्यापक आशय पादटिप्पणी में
  alternative: ‘भाइयो और बहनो’ अथवा ‘भाई-बहनो’
  rationale: यह मूल के पुल्लिंग पारिवारिक संबोधन को बनाए रखते हुए इस संभावना को भी स्पष्ट करता है कि संबोधन में समुदाय की स्त्रियाँ सम्मिलित हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘संतान’ के दोहराव से यूनानी संबंधवाचक संरचना हिन्दी में स्पष्ट रहती है। ‘दासी’ और ‘स्वतंत्र स्त्री’ मूल के सामाजिक तथा रूपकात्मक विरोध को उभारते हैं।
