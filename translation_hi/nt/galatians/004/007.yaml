  yaml_path: translation/nt/galatians/004/007.yaml
  text: So you are no longer a servant but a son[a]; and if a son[b], then also an heir through God.
translation:
  language: hi
  text: इसलिए अब तुम दास नहीं, बल्कि पुत्र[a] हो; और यदि पुत्र हो, तो परमेश्वर के द्वारा वारिस भी हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संतान।” यूनानी में “पुत्र” है, जो इस प्रसंग में दत्तक-पुत्रता और उत्तराधिकार की तर्क-श्रृंखला को बनाए रखता है; फिर भी पौलुस यह दर्जा सभी विश्वासियों पर लागू करता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में “मसीह के द्वारा परमेश्वर का वारिस” लिखा है।
    reason: textual_variant
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκέτι εἶ δοῦλος
  choice: अब तुम दास नहीं
  rationale: οὐκέτι बदली हुई स्थिति को सूचित करता है; दास बंधन और पुत्रत्व के बीच पौलुस के प्रबल विरोध को बनाए रखता है।
- source_word: ἀλλὰ υἱός
  choice: बल्कि पुत्र
  rationale: पुत्र यूनानी के पुल्लिंग एकवचन और इस प्रसंग की दत्तक-पुत्रता तथा उत्तराधिकार की कानूनी तर्क-श्रृंखला को सुरक्षित रखता है।
- source_word: εἰ δὲ υἱός
  choice: और यदि पुत्र हो
  rationale: यह तर्क की अगली कड़ी को सहज हिन्दी में जोड़ता है और मूल की शर्तात्मक रचना बनाए रखता है।
- source_word: καὶ κληρονόμος
  choice: तो ... वारिस भी हो
  rationale: वारिस उत्तराधिकार पाने वाले व्यक्ति का स्वाभाविक हिन्दी पद है; भी पुत्रत्व के साथ जुड़ी अतिरिक्त स्थिति व्यक्त करता है।
- source_word: διὰ θεοῦ
  choice: परमेश्वर के द्वारा
  rationale: यह SBLGNT के ग्रहण किए गए पाठ को सीधे व्यक्त करता और διά की माध्यम-सूचक शक्ति को बनाए रखता है।
theological_decisions:
- issue: υἱός में लिंगसूचक पुत्रत्व की भाषा
  choice: पुत्र
  alternative: संतान
  rationale: पुत्र इस प्रसंग में दत्तक-पुत्रता और वारिस होने के संबंध को अधिक स्पष्ट रूप से सुरक्षित रखता है; पादटिप्पणी बताती है कि यह दर्जा सभी विश्वासियों पर लागू है।
- issue: पद के अंत का पाठांतर
  choice: परमेश्वर के द्वारा वारिस
  alternative: मसीह के द्वारा परमेश्वर का वारिस
  rationale: मुख्य पाठ SBLGNT के διὰ θεοῦ का अनुसरण करता है; उल्लेखनीय विस्तृत पाठांतर पादटिप्पणी में दिया गया है।
