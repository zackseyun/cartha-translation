source:
  edition: SBLGNT
  text: νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν ⸀δουλεύειν θέλετε;
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/009.yaml
  text: But now[a], having come to know God—or rather, having been known by God—how can you turn back again to the weak and poor elemental principles, to which you want to be enslaved all over again?
translation:
  language: hi
  text: पर अब, जब तुम परमेश्वर को जान गए हो—बल्कि, परमेश्वर के द्वारा जाने गए हो—तो तुम फिर उन निर्बल और दरिद्र मूल तत्त्वों[a] की ओर कैसे लौट रहे हो, जिनकी दासता में तुम फिर से, नए सिरे से, जाना चाहते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मूल शक्तियाँ,” “मूलभूत सिद्धान्त,” अथवा “आरम्भिक बातें।”
    reason: στοιχεῖα के सम्भव अर्थों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: γνόντες θεόν
  choice: परमेश्वर को जान गए हो
  rationale: 'अओरिस्ट कृदन्त को सन्दर्भ में प्रवेशात्मक अर्थ के साथ व्यक्त किया गया है: वे परमेश्वर को जानने की अवस्था में आए। यह मुख्य प्रश्न के साथ कृदन्त का सम्बन्ध भी बनाए रखता है।'
- source_word: μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ
  choice: बल्कि, परमेश्वर ने तुम्हें जान लिया है
  rationale: μᾶλλον δέ के सुधारात्मक बल को ‘बल्कि’ से व्यक्त किया गया है। यूनानी कर्मवाच्य को स्वाभाविक हिन्दी में कर्तृवाच्य बनाते हुए परमेश्वर की पहल और ‘जाने जाने’ का भाव सुरक्षित रखा गया है।
- source_word: πῶς
  choice: कैसे
  rationale: प्रश्नवाचक ‘कैसे’ इस प्रसंग में पौलुस के आश्चर्य और उलाहने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιστρέφετε πάλιν
  choice: फिर ... की ओर कैसे लौट रहे हो
  rationale: वर्तमानकालीन क्रिया को चल रही वापसी के रूप में और πάλιν को ‘फिर’ से व्यक्त किया गया है।
- source_word: τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα
  choice: निर्बल और दरिद्र मूल तत्त्व
  rationale: ‘निर्बल’ और ‘दरिद्र’ क्रमशः ἀσθενῆ और πτωχὰ का सीधा, गरिमापूर्ण अनुवाद हैं। ‘मूल तत्त्व’ στοιχεῖα की अर्थगत व्यापकता को कुछ हद तक खुला रखता है।
- source_word: πάλιν ἄνωθεν
  choice: एक बार फिर नए सिरे से
  rationale: दोनों क्रियाविशेषणों के संयुक्त पुनरावृत्ति-बल को स्वाभाविक हिन्दी में रखा गया है।
- source_word: δουλεύειν θέλετε
  choice: दास ... बनना चाहते हो
  rationale: δουλεύειν में निहित दासत्व को केवल ‘सेवा करना’ कहकर हल्का नहीं किया गया; θέλετε की इच्छासूचक शक्ति भी स्पष्ट है।
theological_decisions:
- issue: गलातियों 4:9 में στοιχεῖα का अर्थ
  choice: मूल तत्त्व
  alternative: मूल शक्तियाँ; मूलभूत सिद्धान्त; आरम्भिक बातें
  rationale: यह शब्द मूल धार्मिक सिद्धान्तों, संसार के घटक तत्त्वों या ब्रह्माण्डीय शक्तियों की ओर संकेत कर सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता और विकल्प पादटिप्पणी में देता है।
- issue: ‘परमेश्वर के द्वारा जाने गए’ का बल
  choice: परमेश्वर ने तुम्हें जान लिया है
  alternative: तुम परमेश्वर के द्वारा जाने गए हो
  rationale: स्वाभाविक हिन्दी में कर्तृवाच्य प्रयोग किया गया है, पर परमेश्वर को स्पष्ट कर्ता रखकर यूनानी कर्मवाच्य में निहित उसकी पहल और μᾶλλον δέ का सुधारात्मक बल सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘दास बनना’ गलातियों में चल रहे बन्धन-दासत्व के रूपक को स्पष्ट रखता है; ‘एक बार फिर नए सिरे से’ मूल यूनानी की बलपूर्ण पुनरावृत्ति को दर्शाता है।
