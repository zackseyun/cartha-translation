source:
  edition: SBLGNT
  text: γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/004/027.yaml
  text: 'For it is written: “Rejoice[a], barren woman who is not bearing children; break forth and cry out, you who are not in labor[c][b]; because the children of the desolate woman are more numerous than those of the woman who has a husband.”'
translation:
  language: hi
  text: 'क्योंकि लिखा है: “हे बाँझ स्त्री, जो बच्चे नहीं जनती, आनन्दित हो[a]; हे वह जो प्रसव-पीड़ा में नहीं है, फूट पड़ और ऊँचे स्वर से पुकार उठ[b]; क्योंकि उजड़ी हुई स्त्री[c] के बच्चे उस स्त्री के बच्चों से अधिक हैं जिसका पति है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यशायाह 54:1 से उद्धरण।
    reason: cross_reference
  - marker: b
    text: या, “हे बाँझ स्त्री, जो जन्म नहीं देती, प्रसन्न हो जा … फूटकर जयजयकार कर।”
    reason: lexical_alternative
  - marker: c
    text: “उजड़ी हुई स्त्री” के लिए प्रयुक्त शब्द का अर्थ इस रूपक में “त्यागी हुई” या “परित्यक्त” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण का प्रचलित और स्वाभाविक परिचय; यूनानी पूर्णकाल से निहित स्थायी प्रामाणिकता को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: Εὐφράνθητι
  choice: आनन्द मना
  rationale: आनन्दित होने की आज्ञा को स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: στεῖρα ἡ οὐ τίκτουσα
  choice: हे बाँझ स्त्री, जो बच्चे नहीं जनती
  rationale: विशेषण के सम्बोधनात्मक, संज्ञा-सदृश प्रयोग और लगातार संतान न जनने की स्थिति—दोनों को स्पष्ट रखता है।
- source_word: ῥῆξον καὶ βόησον
  choice: फूट पड़ और ऊँचे स्वर से पुकार उठ
  rationale: अचानक उमड़ पड़ने और जोर से पुकारने की दोहरी आज्ञा को बनाए रखता है, बिना उसे केवल हर्षध्वनि तक सीमित किए।
- source_word: ἡ οὐκ ὠδίνουσα
  choice: तू, जिसे प्रसव-पीड़ा नहीं होती
  rationale: ὠδίνω के प्रसव-वेदना सम्बन्धी ठोस अर्थ और स्त्री-रूपक को सीधे व्यक्त करता है।
- source_word: τῆς ἐρήμου
  choice: उजड़ी हुई स्त्री
  rationale: इस रूपक में वीरान, त्यागी या परित्यक्त दशा का बोध देता है; केवल भौगोलिक ‘निर्जन’ अर्थ से बचता है।
- source_word: πολλὰ ... μᾶλλον ἢ
  choice: बच्चे ... बच्चों से अधिक हैं
  rationale: तुलनात्मक कथन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τῆς ἐχούσης τὸν ἄνδρα
  choice: उस स्त्री ... जिसका पति है
  rationale: ‘पति रखने वाली’ जैसे अस्वाभाविक शाब्दिक रूप से बचते हुए ἀνήρ का वैवाहिक अर्थ और मूल विरोध बनाए रखता है।
theological_decisions:
- issue: गलातियों 4 के रूपकात्मक प्रसंग में यशायाह 54:1 का उद्धरण
  choice: उद्धरण की भविष्यसूचक स्त्री-छवि को उसी रूप में रखा गया है; पौलुस की प्रसंगगत पहचान को पद के शब्दों में नहीं जोड़ा गया।
  alternative: अनुवाद में ही बाँझ अथवा उजड़ी स्त्री को सारा या ‘ऊपर की यरूशलेम’ के रूप में स्पष्ट कर देना।
  rationale: मूल पद पवित्रशास्त्र का प्रत्यक्ष उद्धरण है। उसकी छवि और अर्थगत तनाव को सुरक्षित रखना तथा उसकी व्याख्या आसपास के तर्क पर छोड़ना स्रोत के प्रति अधिक निष्ठावान है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। मातृत्व और प्रसव की मूल छवि स्पष्ट है; ‘फूट पड़’ के साथ ‘ऊँचे स्वर से पुकार उठ’ जोड़कर यूनानी की दोनों आज्ञाएँ अलग-अलग सुरक्षित रखी गई हैं।
