  yaml_path: translation/nt/galatians/004/016.yaml
  text: So then[a], have I become your enemy by telling you the truth?
translation:
  language: hi
  text: तो क्या तुम्हें सच बताने के कारण मैं तुम्हारा शत्रु बन गया हूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमसे सच बोलने के कारण।” यूनानी कृदंत का अर्थ “सच्चाई से बोलना” या “सच बताना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: तो क्या
  rationale: यह पूर्ववर्ती बात से निष्कर्ष निकालते हुए अलंकारिक प्रश्न की ओर ले जाता है; हिंदी में ‘तो क्या’ इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐχθρὸς ὑμῶν
  choice: तुम्हारा शत्रु
  rationale: संबंधवाचक सर्वनाम के साथ यह उस व्यक्ति को दर्शाता है जिसे वे अपना विरोधी या शत्रु मानने लगे हों; ‘तुम्हारा शत्रु’ स्पष्ट और स्वाभाविक है।
- source_word: γέγονα
  choice: बन गया हूँ
  rationale: γίνομαι का पूर्णकाल बीते परिवर्तन के वर्तमान परिणाम को उभारता है; ‘बन गया हूँ’ दोनों पहलुओं को बनाए रखता है।
- source_word: ἀληθεύων ὑμῖν
  choice: तुम्हें सच बताने के कारण
  rationale: कृदंत का अर्थ उनसे सच बोलना या उन्हें सच बताना हो सकता है और यहाँ कारण अथवा साधन का भाव है; यह चयन हिंदी में स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἀληθεύων का पौलुस की अलंकारिक बात में आशय
  choice: पौलुस पूछता है कि क्या उन्हें सच बताने के कारण वह उनका शत्रु बन गया है।
  alternative: पौलुस पूछता है कि क्या उनके प्रति सच बोलने या सत्यनिष्ठ रहने के कारण वह उनका शत्रु बन गया है।
  rationale: निकट संदर्भ में पौलुस की सीधी और सच्ची बात प्रमुख है। अनुवाद संप्रेषण के इस भाव को सामने रखता है, पर यूनानी कृदंत की व्यापक संभावना पादटिप्पणी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और अलंकारिक प्रश्न के रूप में अनुवाद। ‘शत्रु’ मूल की तीव्रता बनाए रखता है और ‘बन गया हूँ’ पूर्णकाल के वर्तमान परिणाम को व्यक्त करता है।
