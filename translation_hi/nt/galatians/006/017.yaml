  text: Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα ⸀τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/017.yaml
  text: From now on let no one cause me trouble[a], for I bear the marks of Jesus on my body.
translation:
  language: hi
  text: अब से कोई मुझे कष्ट न दे, क्योंकि मैं अपने शरीर पर यीशु के चिह्न[a] धारण किए हुए हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दागे हुए चिह्न”; यह शब्द शरीर पर ऐसे निशानों के लिए प्रयुक्त हो सकता है जो स्वामित्व या निष्ठा की पहचान कराते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦ λοιποῦ
  choice: अब से
  rationale: यह यूनानी कालवाचक मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप है और पौलुस की समापन चेतावनी को स्पष्ट रखता है।
- source_word: κόπους μοι μηδεὶς παρεχέτω
  choice: कोई मुझे कष्ट न दे
  rationale: κόπους παρέχειν यहाँ परिश्रम कराने के बजाय कष्ट या परेशानी देने का मुहावरा है। निषेधात्मक आज्ञा को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
- source_word: στίγματα
  choice: चिह्न
  rationale: यह शब्द शरीर पर पड़े पहचान-सूचक निशानों या दागों का बोध करा सकता है। 'चिह्न' मुख्य पाठ में इसकी व्यापकता बनाए रखता है; अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοῦ Ἰησοῦ
  choice: यीशु के
  rationale: सम्बन्धकारक की अस्पष्टता को बनाए रखा गया है; इसे 'यीशु के स्वामित्व के' या 'यीशु के लिए' कहकर संकीर्ण नहीं किया गया।
- source_word: ἐν τῷ σώματί μου
  choice: अपने शरीर पर
  rationale: दृश्य शारीरिक चिह्नों के लिए 'शरीर पर' स्वाभाविक हिन्दी है, यद्यपि यूनानी में ἐν का मूल अर्थ 'में' है।
- source_word: βαστάζω
  choice: धारण किए हुए हूँ
  rationale: यह βαστάζω के 'उठाए रखना/धारण करना' अर्थ और वाक्य के गंभीर भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के στίγματα का स्वरूप
  choice: '''यीशु के चिह्न'' के रूप में तटस्थ अनुवाद'
  alternative: उत्पीड़न से पड़े वास्तविक घावों के निशान; यीशु से सम्बन्ध या स्वामित्व दिखाने वाले दाग; प्रेरिताई दुःख का रूपक
  rationale: पद सम्भवतः पौलुस के दुःखों से पड़े शारीरिक निशानों और यीशु से उसकी निष्ठा—दोनों की ओर संकेत करता है, पर किसी एक अर्थ को निर्णायक नहीं बनाता। इसलिए मूल की व्याख्यात्मक और धर्मवैज्ञानिक व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'कष्ट न दे' समापन चेतावनी की दृढ़ता व्यक्त करता है, जबकि 'चिह्न' मूल शब्द की सम्भावित शारीरिक और पहचान-सूचक दोनों अर्थछटाएँ बनाए रखता है।
