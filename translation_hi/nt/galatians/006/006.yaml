translation:
  language: hi
  text: जिसे वचन की शिक्षा मिलती है, वह शिक्षा देनेवाले के साथ सब अच्छी वस्तुएँ बाँटे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिक्षा पानेवाला शिक्षा देनेवाले के साथ सब अच्छी वस्तुओं में सहभागी हो।” इसमें भौतिक सहायता भी शामिल होने की संभावना है।
    reason: मूल यूनानी की वैकल्पिक, अधिक रूप-सन्निकट अभिव्यक्ति तथा साझेदारी के संभावित व्यावहारिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: Κοινωνείτω
  choice: बाँटे
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरंतर आचरण का निर्देश देता है। यहाँ क्रिया का अर्थ किसी के साथ व्यावहारिक रूप से साझा करना है; ‘बाँटे’ स्वाभाविक हिन्दी है और भौतिक सहायता की संभावना रखते हुए अर्थ को केवल धन तक सीमित नहीं करता।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यह हल्का संक्रमणसूचक अव्यय है, प्रबल विरोध नहीं। हिन्दी में प्रसंग-संबंध बिना ‘अब’ या ‘परन्तु’ जोड़े स्वाभाविक रूप से व्यक्त हो जाता है।
- source_word: ὁ κατηχούμενος
  choice: जिसे ... शिक्षा मिलती है
  rationale: वर्तमान कर्मवाच्य कृदन्त शिक्षा ग्रहण करनेवाले व्यक्ति को दर्शाता है। यह आधुनिक, सहज हिन्दी है और बाद के तकनीकी धार्मिक अर्थ को नहीं लाता।
- source_word: τὸν λόγον
  choice: वचन
  rationale: यहाँ λόγος सिखाए जा रहे मसीही संदेश को सूचित करता है। ‘वचन’ पौलुस की परिचित अभिव्यक्ति को बनाए रखता है और हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
- source_word: τῷ κατηχοῦντι
  choice: शिक्षा देनेवाले के साथ
  rationale: वर्तमान कर्तृवाच्य कृदन्त शिक्षा देनेवाले व्यक्ति को दर्शाता है। संबंधकारक ‘के साथ’ κοινωνέω के साथ आए संप्रदान कारक के साझेदारी-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν πᾶσιν ἀγαθοῖς
  choice: सब अच्छी वस्तुएँ
  rationale: यह व्यापक पद भौतिक और व्यावहारिक भलाई अथवा संसाधनों को समेट सकता है। ‘सब अच्छी वस्तुएँ’ इसकी व्यापकता बनाए रखता है; हिन्दी वाक्य-रचना में इसे ‘बाँटे’ का सीधा कर्म बनाया गया है।
theological_decisions:
- issue: आज्ञा में साझेदारी का स्वरूप
  choice: शिक्षा पानेवाला शिक्षा देनेवाले के साथ अच्छी वस्तुएँ साझा करे; इसमें संभवतः भौतिक सहायता भी सम्मिलित है।
  alternative: यह केवल आत्मिक संगति की बात करता है, भौतिक सहायता की नहीं।
  rationale: κοινωνέω, संप्रदान कारक में शिक्षा देनेवाले व्यक्ति, और ‘सब अच्छी वस्तुओं’ के मेल से व्यावहारिक साझेदारी—सामान्यतः भौतिक सहायता सहित—का संकेत मिलता है। फिर भी यूनानी अभिव्यक्ति इतनी व्यापक है कि इसे केवल धन तक सीमित नहीं किया जाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वचन’ परिचित बाइबलीय पद है, जबकि शेष वाक्य सामान्य पाठक के लिए सीधी हिन्दी में है।
