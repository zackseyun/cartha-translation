lexical_decisions:
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह वितरणात्मक एकवचन है और प्रत्येक व्यक्ति पर अलग-अलग बल देता है; आधुनिक हिन्दी में ‘हर एक’ इस एकवचन भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाला संयोजक है; ‘क्योंकि’ हिन्दी में इस तार्किक संबंध को स्पष्ट और सहज रखता है।
- source_word: τὸ ἴδιον
  choice: अपना ही
  rationale: ἴδιος व्यक्ति के स्वयं के हिस्से या दायित्व पर बल देता है; ‘ही’ उस विशेष बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φορτίον
  choice: भार
  rationale: यह उठाई जाने वाली लदाई या जिम्मेदारी का भार दर्शाता है। ‘भार’ dignified तथा सहज है; पादटिप्पणी निकटवर्ती पद 2 के βάρη से शब्दगत भिन्नता स्पष्ट करती है।
- source_word: βαστάσει
  choice: उठाएगा
  rationale: भविष्यकालीन सक्रिय क्रिया है। ‘उठाएगा’ भार ढोने की ठोस छवि और भविष्यकाल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: गलातियों 6:5 का 6:2 से संबंध
  choice: मुख्य पाठ में प्रत्येक व्यक्ति के अपने भार की बात रखी गई है और पादटिप्पणी में दोनों यूनानी संज्ञाओं का अंतर बताया गया है।
  alternative: दोनों पदों में बिना किसी टिप्पणी के एक ही हिन्दी शब्द ‘बोझ’ या ‘भार’ प्रयोग करना; अथवा यहाँ अंतिम न्याय में व्यक्तिगत उत्तरदायित्व को स्पष्ट रूप से जोड़ देना।
  rationale: पद 2 और पद 5 में यूनानी के अलग शब्द हैं। अनुवाद इस तनाव को खुला रखता है कि विश्वासी एक-दूसरे के भारी बोझ उठाते हैं, फिर भी हर व्यक्ति अपना भार उठाएगा; मुख्य पाठ किसी विशिष्ट धर्मवैज्ञानिक सामंजस्य को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘हर एक’ व्यक्तिगत वितरणात्मक बल बनाए रखता है, जबकि ‘अपना ही भार उठाएगा’ साधारण पाठक के लिए स्पष्ट है और मूल की संक्षिप्तता को संरक्षित करता है।
