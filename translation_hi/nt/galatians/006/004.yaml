  text: τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/004.yaml
  text: But let each one test his own work[a], and then he will have his reason for boasting in himself alone and not in the other person[b],
translation:
  language: hi
  text: पर हर व्यक्ति अपने काम को परखे। तब उसके पास गर्व करने का आधार केवल अपने ही संबंध में होगा, किसी दूसरे के संबंध में नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔργον
  choice: काम
  rationale: यह व्यापक और स्वाभाविक हिन्दी शब्द है, जो यहाँ व्यक्ति के आचरण और किए हुए कार्य को समेटता है।
- source_word: δοκιμαζέτω
  choice: परखे
  rationale: यह आज्ञार्थक क्रिया किसी वस्तु की गुणवत्ता जानने के लिए उसकी जाँच करने का भाव बनाए रखती है, परिणाम को पहले से अच्छा नहीं मानती।
- source_word: ἕκαστος
  choice: हर व्यक्ति
  rationale: यह यूनानी के वितरणात्मक भाव को सहज, समावेशी आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἑαυτοῦ
  choice: अपने
  rationale: निजवाचक सर्वनाम कर्ता के स्वयं के काम पर बल देता है।
- source_word: εἰς ἑαυτὸν μόνον
  choice: केवल अपने ही विषय में
  rationale: यह स्वयं पर केंद्रित मूल्यांकन और μόνον की सीमाबोधक शक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: καύχημα
  choice: गर्व करने का आधार
  rationale: καύχημα गर्व करने की बात अथवा उसके आधार को सूचित कर सकता है; यह चयन उस अर्थ-विस्तार को हिन्दी में स्पष्ट रखता है।
- source_word: ἕξει
  choice: उसके पास ... होगा
  rationale: यह भविष्यकालीन परिणाम को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἕτερον
  choice: किसी दूसरे से
  rationale: संदर्भ में इसका आशय स्वयं से भिन्न दूसरे व्यक्ति से है; तुलना का निहित संबंध हिन्दी में स्पष्ट किया गया है।
- source_word: δέ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध अथवा विचार-मोड़ दिखाता है।
theological_decisions:
- issue: पौलुस के प्रयोग में καύχημα का अर्थ
  choice: “गर्व करने का आधार”
  alternative: “गर्व” या “घमंड करने की बात”
  rationale: यह केवल गर्व की क्रिया के बजाय उसके आधार की संभावना को व्यक्त करता है और यह तय नहीं करता कि ऐसा गर्व नैतिक रूप से प्रशंसनीय है या निंदनीय।
- issue: εἰς τὸν ἕτερον में तुलना का संबंध
  choice: “किसी दूसरे से तुलना करके नहीं”
  alternative: “किसी दूसरे के विषय में नहीं”
  rationale: प्रसंग आत्म-परीक्षण को दूसरों के आधार पर स्वयं को आँकने के विपरीत रखता है। हिन्दी में तुलना को स्पष्ट करने से आशय सहज होता है, बिना दूसरे व्यक्ति की पहचान को विशेष बनाए।
- issue: व्याकरणिक पुल्लिंग एकवचन का सामान्य मानवीय संदर्भ
  choice: “हर व्यक्ति ... उसके”
  alternative: “हर एक ... वह” अथवा पुल्लिंग “हर एक ... उसका”
  rationale: यूनानी एकवचन की वितरणात्मक शक्ति कायम रखते हुए आधुनिक हिन्दी में सामान्य मानवीय संदर्भ को स्वाभाविक और समावेशी बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। “काम को परखे” आत्म-जाँच का सीधा भाव देता है और “किसी दूसरे से तुलना करके नहीं” प्रसंगगत विरोध को स्पष्ट करता है।
