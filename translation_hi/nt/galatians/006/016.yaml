source:
  edition: SBLGNT
  text: καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπ’ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/016.yaml
  text: And as many as will walk by this rule—peace be upon them and mercy[c][b][a], and upon the Israel of God.
translation:
  language: hi
  text: और जितने लोग इस मापदंड के अनुसार कदम मिलाकर चलेंगे[a], उन पर शांति और दया हो, और परमेश्वर के इस्राएल पर[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस मानक के अनुसार चलेंगे।” यूनानी क्रिया में किसी रेखा के अनुरूप चलने या कदम मिलाकर चलने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: '“परमेश्वर का इस्राएल” किसे दर्शाता है, इस पर मतभेद है: विश्वासी यहूदियों को, पूरी कलीसिया को, या अधिक व्यापक रूप से परमेश्वर के लोगों को। अनुवाद यूनानी शब्दावली को बनाए रखकर इस प्रश्न का निर्णय नहीं करता।'
    reason: alternative_reading
  - marker: c
    text: अंतिम “और” को या तो एक और समूह जोड़ने वाला समझा जा सकता है—“और परमेश्वर के इस्राएल पर”—या पहले बताए गए लोगों को दूसरे ढंग से बताने वाला—“अर्थात् परमेश्वर के इस्राएल पर।”
    reason: alternative_reading
lexical_decisions:
- source_word: ὅσοι
  choice: जितने लोग
  rationale: यह यूनानी संबंधवाचक पद के व्यापक और वितरणात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है; ‘वे सभी जो’ भी सम्भव है।
- source_word: κανόνι
  choice: मापदंड
  rationale: यहाँ κανών आचरण को दिशा देने वाले मानक या नियम को दर्शाता है। ‘मापदंड’ आधुनिक हिन्दी में स्पष्ट है और संदर्भ में किसी विशिष्ट विधि-संहिता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: στοιχήσουσιν
  choice: कदम मिलाकर चलेंगे
  rationale: यह क्रिया किसी निर्धारित रेखा या मानक के अनुरूप चलने का रूपक रखती है; केवल ‘मानेंगे’ की तुलना में यूनानी चित्रात्मकता को बेहतर बचाती है।
- source_word: εἰρήνη
  choice: शांति
  rationale: आशीर्वचन में प्रयुक्त εἰρήνη का मानक और स्वाभाविक हिन्दी रूप।
- source_word: ἔλεος
  choice: दया
  rationale: ἔλεος का सामान्य हिन्दी अनुवाद, जो यहाँ शांति के साथ आशीर्वचन का भाग है।
- source_word: ἐπ’ αὐτοὺς ... καὶ ἐπὶ
  choice: उन पर ... और ... पर भी
  rationale: दोहराए गए ἐπί को ‘पर’ से व्यक्त किया गया है। अंतिम ‘भी’ हिन्दी में संयोजक प्रवाह को स्वाभाविक बनाता है, जबकि ‘और’ को बनाए रखकर संबंध की बहस को मुख्य पाठ में निर्णीत नहीं करता।
- source_word: Ἰσραὴλ τοῦ θεοῦ
  choice: परमेश्वर का इस्राएल
  rationale: यह संबंधकारक रचना का सीधा और गरिमापूर्ण हिन्दी रूप है तथा वाक्यांश किस समुदाय को दर्शाता है, इसे अनिर्णीत रखता है।
theological_decisions:
- issue: ‘परमेश्वर के इस्राएल’ का अभिप्रेत समुदाय
  choice: वाक्यांश को सीधे ‘परमेश्वर का इस्राएल’ अनूदित किया गया, बिना यह निर्धारित किए कि इससे विश्वासी यहूदी, पूरी कलीसिया, या परमेश्वर के लोग व्यापक अर्थ में अभिप्रेत हैं।
  alternative: इसे केवल विश्वासी यहूदियों, पूरी कलीसिया, अथवा यहूदी और गैर-यहूदी सभी विश्वासियों के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ किसी एक व्याख्या को निर्विवाद रूप से बाध्य नहीं करता; सीधा अनुवाद वास्तविक धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: ‘परमेश्वर के इस्राएल’ से पहले अंतिम καί का बल
  choice: इसे ‘और ... पर भी’ के रूप में रखा गया है, जिससे एक अतिरिक्त समूह और उसी समूह की पुनर्व्याख्या—दोनों सम्भावनाओं पर टिप्पणी की जा सके।
  alternative: ‘अर्थात् परमेश्वर के इस्राएल पर’ कहकर इसे केवल व्याख्यात्मक मानना, या स्पष्ट रूप से दूसरा अलग समूह बताना।
  rationale: संदर्भ में καί को योगात्मक या व्याख्यात्मक दोनों प्रकार से समझा गया है; मुख्य पाठ में किसी एक मत को निर्णायक बनाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली अपनाई गई है। ‘कदम मिलाकर चलना’ पौलुस के नैतिक चाल-चलन संबंधी रूपक को जीवित रखता है। मुख्य पाठ में विवादित धर्मवैज्ञानिक पहचान और अंतिम संयोजक का संबंध जानबूझकर खुला रखा गया है।
