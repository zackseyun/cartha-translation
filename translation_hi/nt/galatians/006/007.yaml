source:
  edition: SBLGNT
  text: μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ⸀ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/007.yaml
  text: 'Do not be deceived: God is not mocked[a], for whatever a man sows, this he will also reap.'
translation:
  language: hi
  text: 'धोखा न खाओ: परमेश्वर का उपहास नहीं किया जाता, क्योंकि मनुष्य जो कुछ बोता है, वही वह काटेगा भी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ πλανᾶσθε
  choice: धोखा न खाओ
  rationale: वर्तमानकालीन कर्मवाच्य आज्ञार्थक बहुवचन की चेतावनी को सहज और सीधे आधुनिक हिन्दी में व्यक्त करता है; इसका अर्थ है कि पाठक बहकावे या भ्रम में न आएँ।
- source_word: θεὸς
  choice: परमेश्वर
  rationale: यहाँ θεός एकमात्र सच्चे परमेश्वर के लिए प्रयुक्त है; हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट, प्रतिष्ठित और स्वाभाविक मानक रूप है।
- source_word: οὐ μυκτηρίζεται
  choice: का उपहास नहीं किया जा सकता
  rationale: μυκτηρίζω में उपहास करने, नाक-भौं सिकोड़कर तिरस्कार दिखाने और अवमानना से व्यवहार करने का भाव है। शाब्दिक कर्मवाच्य ‘उपहास नहीं किया जाता’ हिन्दी में केवल तथ्य-वर्णन जैसा और भ्रामक लग सकता है; यह रूप पौलुस के इस बल को व्यक्त करता है कि कोई परमेश्वर को तुच्छ समझकर परिणामों से बच नहीं सकता।
- source_word: ὃ γὰρ ἐὰν
  choice: क्योंकि ... जो कुछ
  rationale: यह अनिश्चित सम्बन्धवाचक रचना एक सार्वभौमिक शर्त प्रस्तुत करती है; ‘जो कुछ’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: σπείρῃ
  choice: बोता है
  rationale: कृषि-रूपक को अक्षुण्ण रखता है और आगे आने वाले ‘काटेगा’ से स्वाभाविक जोड़ी बनाता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: एकवचन ἄνθρωπος यहाँ प्रतिनिधिक और सामान्य अर्थ में किसी भी मानव के लिए है। हिन्दी ‘मनुष्य’ उसी सार्वभौमिक अर्थ को बिना अनावश्यक लिंग-सीमा के सटीक रूप से देता है।
- source_word: τοῦτο καὶ θερίσει
  choice: वही वह काटेगा भी
  rationale: '‘वही’ τοῦτο की संकेतात्मक और समानता पर बल देने वाली शक्ति को, तथा ‘भी’ καί को बनाए रखता है: जो बोया गया है, ठीक वही काटा जाएगा।'
theological_decisions:
- issue: ἄνθρωπος का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: आदमी
  rationale: मूल यूनानी का आशय केवल पुरुष नहीं, बल्कि सामान्य रूप से हर मानव है। ‘मनुष्य’ हिन्दी में एकवचन और सार्वभौमिक दोनों भावों को सुरक्षित रखता है, इसलिए किसी अतिरिक्त पादटिप्पणी की आवश्यकता नहीं है।
- issue: θεὸς οὐ μυκτηρίζεται की कहावतनुमा शक्ति
  choice: परमेश्वर का उपहास नहीं किया जा सकता
  alternative: परमेश्वर का उपहास नहीं किया जाता
  rationale: वाक्य का आशय यह नहीं कि कोई कभी परमेश्वर का उपहास करने का प्रयास नहीं करता, बल्कि यह कि उसे तुच्छ मानकर कोई उसके न्यायपूर्ण परिणाम से बच नहीं सकता। चुना हुआ रूप इस बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अगले वाक्य में बताए बोने-काटने के सिद्धान्त को विस्तार देकर किसी विशेष सिद्धान्त में बदलने के।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बोता है/काटेगा’ का कृषि-रूपक तथा ‘वही ... भी’ का प्रतिफल-संबंध सुरक्षित है। किसी पादटिप्पणी की जरूरत नहीं पड़ी, क्योंकि ‘मनुष्य’ हिन्दी में स्वाभाविक रूप से सामान्य मानव का बोध कराता है।
