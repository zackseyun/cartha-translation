review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the inferential force, the opportunity/καιρός sense, the universal scope of doing good, and the special priority for members of the faith household. However, “सबके साथ भलाई करें” can suggest simply behaving kindly in one’s interactions rather than actively doing good toward all, and “जो विश्वास के घराने के हैं” is less natural Hindi than an explicit reference to the people belonging to that household.
  naturalness: 'A small revision makes the exhortation more idiomatic and clarifies its direction: “सबके प्रति भलाई करें” and “विश्वास के घराने के लोगों के प्रति.”'
  terminology: “विश्वास” appropriately renders πίστις without prematurely narrowing it to a formal creed. “घराना” suitably retains the household metaphor; the footnotes separately preserve the household/family alternative and the possible sense “the faith.”
  issues:
  - severity: medium
    issue: “सबके साथ भलाई करें” is somewhat semantically broad in Hindi.
    rationale: It may mean to behave well with everyone, whereas ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας calls for actively doing what is good toward all people. “सबके प्रति भलाई करें” better expresses the source’s directed beneficence.
  - severity: low
    issue: “जो विश्वास के घराने के हैं” is awkwardly elliptical.
    rationale: Adding “लोगों” gives natural modern Hindi while retaining the source’s household imagery and reference to those belonging to the believing community.
  - severity: low
    issue: The combined footnote obscures two distinct source-level alternatives.
    rationale: Separate notes for the household expression and for πίστεως preserve the audit trail more clearly and provide unambiguous anchors.
