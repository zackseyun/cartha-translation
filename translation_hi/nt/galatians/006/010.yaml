- from: इसलिए, जब तक हमें अवसर मिलता है,[a] हम सबके साथ भलाई करें, और विशेष रूप से उनके साथ जो विश्वास के घराने के हैं।[b]
  to: इसलिए, जब तक हमें अवसर मिलता है,[a] हम सबके प्रति भलाई करें, और विशेष रूप से विश्वास के घराने के लोगों के प्रति।[b][c]
  rationale: 'The revision retains every element of the Greek: the conclusion, the present opportunity for action, the hortatory appeal, the universal scope, and the nonexclusive special concern for fellow believers. It improves Hindi precision and fluency without adding a denominational interpretation. Separate footnotes preserve both the household metaphor and the possible confessional nuance of πίστεως.'
  reviewer_model: gpt-5.6-terra
