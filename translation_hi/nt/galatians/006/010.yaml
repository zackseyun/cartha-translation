id: GAL.6.10
reference: Galatians 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄρα οὖν ὡς καιρὸν ⸀ἔχομεν, ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/010.yaml
  text: So then[a], as we have opportunity, let us do what is good toward everyone[c][b], and especially toward those who are of the household of faith.
translation:
  language: hi
  text: इसलिए, जब तक हमें अवसर मिलता है,[a] हम सबके प्रति भलाई करें, और विशेष रूप से विश्वास के घराने के लोगों के प्रति।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक हमारे पास समय है।” यहाँ यूनानी शब्द सामान्य समय से अधिक किसी उपयुक्त अवसर या अनुकूल समय पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “विश्वास का परिवार” या “विश्वास के घराने के सदस्य।” यूनानी में विश्वास करने वालों के समुदाय के लिए घराने की पारिवारिक भाषा प्रयुक्त है।
    reason: lexical_alternative
  - marker: c
    text: “विश्वास” का अर्थ “वह विश्वास,” अर्थात साझा मसीही विश्वास या अंगीकार, भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्यय पिछले विचार से व्यावहारिक निष्कर्ष निकालते हैं; आधुनिक हिन्दी में ‘इसलिए’ इसका स्वाभाविक और पर्याप्त संकेत देता है।
- source_word: ὡς καιρὸν ἔχομεν
  choice: जब तक हमें अवसर मिलता है
  rationale: καιρός सामान्य काल-मात्र नहीं, बल्कि कार्य करने के उपयुक्त अवसर को सूचित करता है। ‘जब तक’ उपलब्ध अवसर की सीमित अवधि का भाव भी बनाए रखता है।
- source_word: ἐργαζώμεθα τὸ ἀγαθὸν
  choice: हम ... भलाई करें
  rationale: वर्तमान संभावनार्थक रूप यहाँ सामूहिक आग्रह है और निरंतर आचरण की ओर बुलाता है। संज्ञीकृत विशेषण τὸ ἀγαθόν को स्वाभाविक हिन्दी में ‘भलाई’ कहा गया है।
- source_word: πρὸς πάντας
  choice: सबके साथ
  rationale: πρός यहाँ कार्य के व्यक्तियों की ओर निर्देशित होने का भाव देता है। ‘सबके साथ भलाई करें’ सहज हिन्दी है और सार्वभौमिक दायरा सुरक्षित रखता है।
- source_word: μάλιστα δὲ
  choice: और विशेष रूप से
  rationale: यह व्यापक आदेश के भीतर एक खास प्राथमिकता जोड़ता है, दूसरों को बाहर नहीं करता।
- source_word: τοὺς οἰκείους τῆς πίστεως
  choice: जो विश्वास के घराने के हैं
  rationale: οἰκεῖοι घराने से संबंधित लोगों को दर्शाता है। ‘विश्वास का घराना’ पारिवारिक रूपक बनाए रखता है और उसे संस्थागत सदस्यता तक सीमित नहीं करता।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का मूल अर्थ ‘विश्वास’ रखा गया है; प्रसंग में यह विश्वासी समुदाय की साझा पहचान अथवा ‘विश्वास-मत’ दोनों की ओर संकेत कर सकता है।
theological_decisions:
- issue: भलाई करने का दायरा और प्राथमिकता
  choice: सब लोगों के साथ भलाई, पर विश्वास के घराने वालों को विशेष प्राथमिकता
  alternative: केवल विश्वासियों के साथ भलाई; अथवा विश्वासियों के प्रति किसी विशेष दायित्व का निषेध
  rationale: πρὸς πάντας सार्वभौमिक दायरा देता है, जबकि μάλιστα एक विशेष प्राथमिकता जोड़ता है। अनुवाद दोनों पक्षों को साथ रखता है।
- issue: τῆς πίστεως का अर्थ
  choice: मुख्य पाठ में ‘विश्वास’
  alternative: ‘उस विश्वास’ अर्थात साझा मसीही मत या अंगीकार
  rationale: यूनानी पद दोनों अर्थच्छायाओं की अनुमति देता है। मुख्य पाठ व्यापक ‘विश्वास’ रखता है और पादटिप्पणी वैकल्पिक समझ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक उपदेशात्मक शैली। ‘घराना’ स्रोत के पारिवारिक रूपक को बनाए रखता है।
