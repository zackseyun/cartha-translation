  text: ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ⸀ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/002.yaml
  text: Carry one another’s burdens[a], and in this way you will fulfill the law of Messiah.
translation:
  language: hi
  text: एक-दूसरे के बोझ उठाओ, और इस प्रकार तुम मसीहा की व्यवस्था[a] को पूरा करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मसीह की व्यवस्था।”'
    reason: Χριστός के पारंपरिक हिन्दी रूप ‘मसीह’ को वैकल्पिक अनुवाद के रूप में देना।
lexical_decisions:
- source_word: ἀλλήλων
  choice: एक-दूसरे के
  rationale: यह पारस्परिक सर्वनाम समुदाय के सदस्यों के बीच परस्पर जिम्मेदारी व्यक्त करता है।
- source_word: τὰ βάρη
  choice: बोझ
  rationale: βάρη यहाँ कठिनाइयों और दबावों के लिए प्रयुक्त रूपक है; ‘बोझ’ इसका स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: βαστάζετε
  choice: उठाओ
  rationale: वर्तमानकालीन बहुवचन आज्ञा को सीधी, स्वाभाविक हिन्दी आज्ञा में रखा गया है; संदर्भ में इसका अर्थ दूसरों का भार सँभालने में सहभागी होना है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह आज्ञा को उसके परिणाम से जोड़ता है और यूनानी की तार्किक कड़ी को स्पष्ट रखता है।
- source_word: ἀναπληρώσετε
  choice: पूरा करोगे
  rationale: भविष्यकालीन क्रिया आज्ञा मानने के परिणाम को व्यक्त करती है; व्यवस्था के साथ ‘पूरा करना’ स्वाभाविक है और पूर्ण अनुपालन का भाव सुरक्षित रखता है।
- source_word: τὸν νόμον
  choice: व्यवस्था
  rationale: νόμος का मूल अर्थ ‘व्यवस्था/कानून’ है। पौलुस के धार्मिक-नैतिक संदर्भ और बाइबिलीय प्रतिध्वनि के कारण ‘व्यवस्था’ चुना गया है।
- source_word: τοῦ Χριστοῦ
  choice: मसीहा की
  rationale: Χριστός यहाँ उपाधि के रूप में है; ‘मसीहा’ उसके अभिषिक्त जन होने के अर्थ और यहूदी-मसीही पृष्ठभूमि को उभारता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीहा
  alternative: मसीह
  rationale: यहाँ Χριστός ‘व्यवस्था’ को विशेषित करने वाली उपाधि है, इसलिए मुख्य पाठ में उसके उपाधिगत अर्थ को ‘मसीहा’ द्वारा व्यक्त किया गया है। हिन्दी बाइबिलीय परंपरा में प्रचलित ‘मसीह’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और समुदाय-केंद्रित आज्ञात्मक शैली रखी गई है। ‘एक-दूसरे’ पारस्परिकता को और ‘बोझ उठाओ’ मूल रूपक को स्वाभाविक ढंग से बनाए रखते हैं।
