source:
  edition: SBLGNT
  text: ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ⸀ἵνα τῷ σταυρῷ τοῦ ⸀Χριστοῦ ⸀μὴ διώκωνται·
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/012.yaml
  text: As many as want to make a good showing in the flesh[a], these are forcing you to be circumcised[c][b], only so that they may not be persecuted for the cross of the Messiah.
translation:
  language: hi
  text: जो लोग शरीर के मामले में अच्छा दिखना चाहते हैं[a], वे ही तुम्हें खतना करवाने के लिए मजबूर करते हैं—केवल इसलिए कि मसीहा के क्रूस के कारण उन्हें सताया न जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाहरी रूप से अच्छा प्रभाव डालना चाहते हैं।”
    reason: lexical_alternative
  - marker: b
    text: 'पारंपरिक अनुवाद: “मसीह के क्रूस के कारण।”'
    reason: traditional_rendering
lexical_decisions:
- source_word: ὅσοι
  choice: जो लोग
  rationale: यह पूरे वर्णित समूह को समेटता है और आधुनिक हिन्दी में ‘जितने लोग’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: εὐπροσωπῆσαι ἐν σαρκί
  choice: शरीर में अच्छा दिखना
  rationale: यह εὐπροσωπῆσαι के अनुकूल बाहरी रूप से प्रभावशाली दिखने का भाव देता है, साथ ही पौलुस के अर्थगर्भित शब्द σάρξ को ‘शरीर’ के रूप में बनाए रखता है। अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: οὗτοι
  choice: वे ही
  rationale: '‘ही’ संकेतवाचक पद के जोर को व्यक्त करता है: ऐसे ही लोग यह दबाव डाल रहे हैं।'
- source_word: ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι
  choice: तुम्हें खतना करवाने के लिए मजबूर करते हैं
  rationale: यह जारी दबाव और περιτέμνεσθαι के कर्मवाच्य भाव—स्वयं अपना खतना करना नहीं, बल्कि खतना करवाना—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μόνον ἵνα
  choice: केवल इसलिए कि
  rationale: यह उस एकमात्र उद्देश्य या मंशा को स्पष्ट करता है जो पौलुस उनके कार्य के पीछे बताता है।
- source_word: τῷ σταυρῷ
  choice: क्रूस के कारण
  rationale: διώκωνται के साथ संबंध/कारणसूचक दत्तिव का आशय यहाँ स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: τοῦ Χριστοῦ
  choice: मसीहा के
  rationale: इस संबंधसूचक पदबंध में Χριστός की उपाधिसूचक शक्ति सक्रिय है; ‘मसीहा’ उसका अर्थ सीधे व्यक्त करता है। पारंपरिक हिन्दी रूप पादटिप्पणी में सुरक्षित है।
- source_word: μὴ διώκωνται
  choice: उन्हें सताया न जाए
  rationale: यह ἵνα के बाद आए कर्मवाच्य संभावनार्थक रूप का उद्देश्यसूचक भाव बनाए रखता है।
theological_decisions:
- issue: ἐν σαρκί में σάρξ का अर्थ
  choice: शरीर में
  alternative: बाहरी रूप से
  rationale: मुख्य पाठ पौलुस के अर्थगर्भित ‘शरीर’ शब्द को बनाए रखता है और उसे केवल बाहरी धार्मिक प्रदर्शन तक सीमित नहीं करता; पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है।
- issue: τῷ σταυρῷ τοῦ Χριστοῦ में Χριστός
  choice: मसीहा के क्रूस
  alternative: मसीह के क्रूस
  rationale: यहाँ Χριστός एक उपाधि के रूप में मसीहाई पहचान व्यक्त करता है, इसलिए अर्थानुवाद ‘मसीहा’ चुना गया है; हिन्दी बाइबल परंपरा का परिचित रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘वे ही’ मूल के आलंकारिक जोर को सुरक्षित रखता है; डैश अंतिम उद्देश्यसूचक खंड को उभारता है।
