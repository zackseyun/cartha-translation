review_pass:
  verdict: revise
  source_fidelity: The draft generally reflects the Greek well and preserves the important ambiguity of προλημφθῇ in a footnote. However, ‘भाइयो और बहनो’ expands the masculine plural form in the main text despite the stated source-form policy, and ‘हर एक ... रखे’ unnecessarily recasts the participial warning. ‘सुधारो’ can suggest moral correction rather than restoring someone to a sound condition.
  naturalness: The revised wording is natural modern standard Hindi and retains a dignified congregational register. ‘अपने आप पर ध्यान रखते रहो’ reads more smoothly than the singularized ‘हर एक ... रखे.’
  terminology: ‘आत्मिक,’ ‘नम्रता,’ and ‘प्रलोभन’ are appropriate established biblical Hindi terms. ‘फिर से सही स्थिति में लाओ’ brings out καταρτίζετε more accurately than merely ‘सुधारो,’ without importing a technical denominational sense.
  issues:
  - severity: medium
    issue: Main-text expansion of Ἀδελφοί
    rationale: ‘भाइयो और बहनो’ makes the likely mixed-group reference explicit, but the Greek text itself uses a masculine plural address. Since the audit policy favors retaining source gender in the text and clarifying inclusive reference in a note, ‘भाइयों’ is preferable.
  - severity: medium
    issue: καταρτίζετε rendered ‘सुधारो’
    rationale: The verb means restore, mend, or put back into proper condition. ‘सुधारो’ may primarily imply rebuking or reforming the person, whereas restoration is the central sense.
  - severity: low
    issue: σκοπῶν σεαυτόν recast as ‘हर एक ... रखे’
    rationale: Though the singular participle can have a distributive force, the Hindi singular finite clause interrupts the direct plural address. A plural attendant-warning construction better follows the sentence.
