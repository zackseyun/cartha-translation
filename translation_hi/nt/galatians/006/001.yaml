id: GAL.6.1
reference: Galatians 6:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/001.yaml
  text: Brothers[a], even if a man is caught in some trespass, you who are spiritual should restore such a one in a spirit of gentleness, watching yourself[c][b], lest you also be tempted.
translation:
  language: hi
  text: भाइयों[a], यदि कोई व्यक्ति किसी अपराध में फँस भी जाए[b], तो तुम जो आत्मिक हो, उसे नम्रता की भावना से फिर से सही स्थिति में लाओ[c], और अपने आप पर ध्यान रखते रहो, कहीं तुम भी प्रलोभन में न पड़ जाओ[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ शब्दशः ‘भाइयों’ है; यह पुल्लिंग बहुवचन संबोधन स्त्री और पुरुष दोनों विश्वासियों के समूह के लिए प्रयुक्त हो सकता है।
    reason: source_form
  - marker: b
    text: या, ‘किसी अपराध की चपेट में आ जाए’ अथवा ‘अचानक किसी अपराध में फँस जाए।’
    reason: lexical_ambiguity
  - marker: c
    text: या, ‘नम्रता की आत्मा में।’ यूनानी वाक्यांश नम्र स्वभाव की ओर संकेत करता है; निकट संदर्भ में आत्मा से उत्पन्न नम्रता की प्रतिध्वनि भी संभव है।
    reason: theological_ambiguity
  - marker: d
    text: या, ‘परीक्षा में पड़ जाओ’; यूनानी क्रिया का अर्थ ‘परखा जाना’ भी हो सकता है।
    reason: lexical_ambiguity
lexical_decisions:
- source_word: Ἀδελφοί
  choice: भाइयो और बहनो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, पर मंडली को संबोधित करते समय इसमें स्त्री और पुरुष दोनों विश्वासी सम्मिलित हो सकते हैं। आधुनिक हिन्दी में यह संबोधन स्वाभाविक और संदर्भानुकूल है; पादटिप्पणी मूल रूप को स्पष्ट करती है।
- source_word: ἐὰν καὶ
  choice: यदि ... भी
  rationale: यह शर्त के साथ रियायती भाव व्यक्त करता है; हिन्दी में ‘यदि ... भी’ उस अर्थ को सहजता से रखता है।
- source_word: προλημφθῇ
  choice: पकड़ा ... जाए
  rationale: यह क्रिया पकड़े जाने, किसी अपराध से आ घिरने, या अचानक उसकी चपेट में आने का भाव दे सकती है। मुख्य पाठ में संक्षिप्त और स्वाभाविक विकल्प रखा गया है तथा व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἄνθρωπος
  choice: कोई व्यक्ति
  rationale: यहाँ ἄνθρωπος किसी भी मनुष्य के लिए प्रयुक्त एकवचन सामान्य संज्ञा है; ‘कोई व्यक्ति’ आधुनिक हिन्दी में उसके सामान्य और अनिर्दिष्ट अर्थ को ठीक से व्यक्त करता है।
- source_word: ἔν τινι παραπτώματι
  choice: किसी अपराध में
  rationale: παράπτωμα नैतिक चूक, अपराध या उल्लंघन को दर्शाता है। ‘अपराध’ अर्थ की गंभीरता बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: οἱ πνευματικοὶ
  choice: तुम जो आत्मिक हो
  rationale: यह उन लोगों को दर्शाता है जिनका जीवन आत्मा से संबंधित या आत्मिक परिपक्वता से चिह्नित है। अनुवाद इस व्यापकता को किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: καταρτίζετε
  choice: सुधारो
  rationale: आज्ञार्थक क्रिया का अर्थ किसी को फिर ठीक दशा में लाना, बहाल करना या सुधारना है। ‘सुधारो’ संक्षिप्त, सक्रिय और इस संदर्भ में सहज है।
- source_word: τὸν τοιοῦτον
  choice: उसे
  rationale: यह पहले बताए गए व्यक्ति की ओर संकेत करता है। हिन्दी सर्वनाम अनावश्यक औपचारिकता के बिना एकवचन संदर्भ बनाए रखता है।
- source_word: ἐν πνεύματι πραΰτητος
  choice: नम्रता की भावना से
  rationale: यह वाक्यांश नम्र स्वभाव या आत्मा से उत्पन्न नम्रता—दोनों की प्रतिध्वनि रख सकता है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: σκοπῶν σεαυτόν
  choice: हर एक अपने आप पर ध्यान रखे
  rationale: एकवचन कृदंत समुदाय के प्रत्येक आत्मिक व्यक्ति को व्यक्तिगत रूप से सावधान करता है। ‘हर एक’ इस संख्या-परिवर्तन और व्यक्तिगत उत्तरदायित्व को स्पष्ट करता है।
- source_word: μὴ καὶ σὺ πειρασθῇς
  choice: कहीं ऐसा न हो कि तुम भी परीक्षा में पड़ जाओ
  rationale: यह नकारात्मक आशंका या उद्देश्य व्यक्त करता है। πειράζω में प्रलोभन और परीक्षा दोनों की अर्थ-छाया हो सकती है; हिन्दी वाक्यांश उस तनाव को काफी हद तक बनाए रखता है।
theological_decisions:
- issue: Ἀδελφοί का सामुदायिक और व्याकरणिक लिंग
  choice: मुख्य पाठ में ‘भाइयो और बहनो’, और पादटिप्पणी में यूनानी के पुल्लिंग रूप की जानकारी
  alternative: भाइयो
  rationale: संदर्भ पूरी मंडली को संबोधित करता है। आधुनिक हिन्दी में स्पष्ट समावेशी संबोधन आशय संप्रेषित करता है, जबकि पादटिप्पणी स्रोत की व्याकरणिक बनावट को पारदर्शी रखती है।
- issue: προλημφθῇ में पकड़े जाने अथवा अपराध से आ घिरने का भाव
  choice: मुख्य पाठ में ‘पकड़ा ... जाए’
  alternative: किसी अपराध की चपेट में आ जाए; अचानक किसी अपराध में फँस जाए
  rationale: क्रिया यह अनिश्चित छोड़ती है कि व्यक्ति अपराध करते हुए पकड़ा गया या अपराध ने उसे आ घेरा। पादटिप्पणी इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: ἐν πνεύματι πραΰτητος में मानवीय भावना और पवित्र आत्मा की संभावित प्रतिध्वनि
  choice: नम्रता की भावना से
  alternative: आत्मा से मिलने वाली नम्रता के साथ
  rationale: यूनानी πνεῦμα यहाँ स्वभाव/भावना को सूचित कर सकता है, पर गलातियों के निकट संदर्भ में आत्मा से उत्पन्न गुण की प्रतिध्वनि भी संभव है। मुख्य पाठ किसी एक अर्थ को अनिवार्य नहीं बनाता।
- issue: πειρασθῇς का अर्थ ‘प्रलोभित होना’ या ‘परीक्षा में पड़ना’
  choice: परीक्षा में पड़ जाओ
  alternative: प्रलोभन में पड़ जाओ; परखे जाओ
  rationale: नैतिक संदर्भ प्रलोभन की ओर संकेत करता है, फिर भी क्रिया की व्यापक अर्थ-सीमा परीक्षा को भी संभव रखती है। पादटिप्पणी दोनों अर्थों को सामने रखती है।
translation_notes:
  register: 'भाषा आधुनिक मानक हिन्दी की है: सहज, गरिमापूर्ण और मंडलीय पाठ के योग्य। ‘आत्मिक’, ‘नम्रता’ और ‘परीक्षा में पड़ना’ जैसे परिचित बाइबिलीय पद रखे गए हैं, पर वाक्य-रचना को सामान्य आधुनिक पाठक के लिए स्वाभाविक बनाया गया है।'
