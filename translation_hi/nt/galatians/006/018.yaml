id: GAL.6.18
reference: Galatians 6:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/018.yaml
  text: The grace of our Lord Jesus Christ be with your spirit[a], brothers[b]. Amen.
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह का अनुग्रह तुम्हारी आत्मा के साथ रहे[a], भाइयो[b]। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में ‘तुम्हारी’ बहुवचन है, जबकि ‘आत्मा’ एकवचन है; यह पूरी विश्वासी मंडली को सामूहिक रूप से संबोधित कर सकता है।
    reason: source_form
  - marker: b
    text: यहाँ ‘भाइयो’ पूरे विश्वासी समुदाय को संबोधित करता है और इसमें स्त्री तथा पुरुष दोनों सम्मिलित हो सकते हैं; दूसरा सम्भव अनुवाद है, ‘भाइयो और बहनो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के आशीर्वचन में यह प्रचलित और अर्थपूर्ण शब्द है; इसमें कृपापूर्ण उपकार और परमेश्वर की उदार कृपा, दोनों का भाव बना रहता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए स्वाभाविक, प्रतिष्ठित और आरंभिक मसीही अंगीकार के अनुरूप हिन्दी पद।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘यीशु’ नाम और Χριστός की उपाधि को हिन्दी के परिचित ‘मसीह’ से व्यक्त किया गया है, जो ‘अभिषिक्त जन’ का भाव रखता है।
- source_word: μετὰ
  choice: के साथ रहे
  rationale: यूनानी आशीर्वचन में क्रिया व्यक्त नहीं है; स्वाभाविक हिन्दी में कामना का आशय स्पष्ट करने के लिए ‘रहे’ जोड़ा गया है।
- source_word: πνεύματος ὑμῶν
  choice: तुम्हारी आत्मा
  rationale: मूल में बहुवचन ‘तुम्हारी’ के साथ एकवचन ‘आत्मा’ है; इसे बनाए रखने से समुदाय को एक साथ संबोधित करने वाला पौलुस का विशिष्ट कथन सुरक्षित रहता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी संबोधन व्याकरणतः पुल्लिंग बहुवचन है। मुख्य पाठ में उसका सीधा रूप रखा गया है और पूरे विश्वासी समुदाय को संबोधित करने की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἀμήν
  choice: आमीन
  rationale: उपासना और प्रार्थना में प्रचलित पारंपरिक लिप्यंतरण समापन की पुष्टि को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: Χριστός को पौलुस के समापन आशीर्वचन में कैसे व्यक्त किया जाए
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय भाषा में परिचित है और उपाधि के मसीहाई अर्थ को बनाए रखता है; ‘अभिषिक्त जन’ अर्थ स्पष्ट करता, पर इस संक्षिप्त आशीर्वचन में कम स्वाभाविक लगता।
- issue: मिश्रित विश्वासी समुदाय के लिए ἀδελφοί का अनुवाद
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मूल का रूप पुल्लिंग बहुवचन संबोधन है, पर प्रसंग में यह पूरी कलीसिया को समावेशी ढंग से संबोधित कर सकता है। इस तनाव को मुख्य पाठ और पादटिप्पणी के मेल से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘के साथ रहे’ हिन्दी में आशीर्वचन की स्वाभाविक कामनार्थक शैली है। ‘तुम्हारी आत्मा’ मूल की असामान्य सामूहिक एकवचन रचना को समतल किए बिना समझने योग्य रखता है।
