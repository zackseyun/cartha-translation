source:
  edition: SBLGNT
  text: ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ ἐμοὶ κόσμος ἐσταύρωται ⸀κἀγὼ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/014.yaml
  text: But far be it from me to boast except in the cross of our Lord Jesus the Messiah[a], through which the world has been crucified to me[b], and I to the world.
translation:
  language: hi
  text: परन्तु मेरे लिए ऐसा कभी न हो कि मैं हमारे प्रभु यीशु मसीह के क्रूस के सिवा और किसी बात पर घमण्ड करूँ। क्रूस के द्वारा[a] संसार मेरे लिए क्रूस पर चढ़ाया जा चुका है, और मैं संसार के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके द्वारा,” यदि सम्बन्धवाचक सर्वनाम का पूर्वपद “क्रूस” के बजाय प्रभु यीशु मसीह माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: मेरे लिए ऐसा कभी न हो
  rationale: यह प्रबल व्यक्तिगत अस्वीकार व्यक्त करता है और यूनानी इच्छार्थक प्रयोग की शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καυχᾶσθαι
  choice: घमण्ड करूँ
  rationale: पौलुस के इस प्रमुख शब्द का स्पष्ट और प्रचलित हिन्दी समतुल्य है; सन्दर्भ में मानवीय उपलब्धियों पर घमण्ड और क्रूस पर घमण्ड का विरोध सुरक्षित रहता है।
- source_word: εἰ μὴ
  choice: को छोड़ किसी और बात पर
  rationale: केवल एक वैध आधार होने का अपवादभाव स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: σταυρῷ
  choice: क्रूस
  rationale: नए नियम के यातना और मृत्यु-सन्दर्भ में स्थापित तथा उपयुक्त हिन्दी शब्द है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का मानक, गरिमापूर्ण और सन्दर्भानुकूल हिन्दी अनुवाद है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός के अभिषिक्त जन अथवा मसीहा-सूचक शीर्षक का अर्थ हिन्दी की स्थापित बाइबलीय शब्दावली में सुरक्षित करता है।
- source_word: δι’ οὗ
  choice: उसी के द्वारा
  rationale: निकटतम व्याकरणिक पूर्वपद ‘क्रूस’ है; हिन्दी में यह अभिव्यक्ति उसके साधनात्मक अर्थ को बनाए रखती है, जबकि सर्वनाम की सम्भावित वैकल्पिक सम्बद्धता पादटिप्पणी में सुरक्षित है।
- source_word: κόσμος
  choice: संसार
  rationale: κόσμος का व्यापक और प्रचलित हिन्दी समतुल्य है; परमेश्वर से विमुख व्यवस्था की सन्दर्भगत छाया को अनावश्यक व्याख्या से सीमित नहीं करता।
- source_word: ἐσταύρωται
  choice: क्रूस पर चढ़ाया जा चुका है
  rationale: पूर्ण निष्पन्न कर्म और उसके बने रहने वाले परिणाम—दोनों को यूनानी पूर्णकालिक कर्मवाच्य के अनुरूप व्यक्त करता है।
- source_word: κἀγὼ κόσμῳ
  choice: और मैं संसार के लिए
  rationale: यूनानी की लुप्त क्रिया को हिन्दी में भी न दोहराकर संक्षिप्त समानान्तरता बनाए रखता है; पूर्ववर्ती क्रिया से अर्थ स्पष्ट है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त / यीशु मसीहा
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबल-परम्परा में शीर्षक का अर्थ वहन करने वाला स्थापित शब्द है और इसे केवल नाम-जैसे लिप्यन्तरण तक सीमित नहीं करता।
- issue: δι’ οὗ का पूर्वपद और अर्थ
  choice: 'क्रूस पूर्वपद है: ‘उसी के द्वारा’'
  alternative: 'प्रभु यीशु मसीह पूर्वपद हैं: ‘उन्हीं के द्वारा’'
  rationale: निकटतम व्याकरणिक रूप से मेल खाता पूर्वपद σταυρῷ है, इसलिए मुख्य पाठ में क्रूस को साधन माना गया है; पुरुषवाचक वैकल्पिक सम्बन्ध को पादटिप्पणी में खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मेरे लिए ऐसा कभी न हो’ प्रबल निषेध को, तथा अंतिम खण्ड में लुप्त क्रिया संक्षिप्त यूनानी समानान्तरता को सुरक्षित रखती है।
