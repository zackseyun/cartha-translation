  yaml_path: translation/nt/galatians/006/003.yaml
  text: For if anyone thinks he is something when he is nothing[a], he deceives himself.
translation:
  language: hi
  text: क्योंकि यदि कोई कुछ न होते हुए अपने आप को कुछ समझता है, तो वह अपने आप को धोखा देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: यह पद पिछले उपदेश का कारण बताने वाली शर्त प्रस्तुत करता है; ‘क्योंकि’ γάρ की व्याख्यात्मक शक्ति और ‘यदि’ εἰ की शर्त दोनों को स्वाभाविक हिन्दी में बनाए रखते हैं।
- source_word: δοκεῖ
  choice: समझता है
  rationale: यहाँ क्रिया व्यक्ति के अपने विषय में आकलन को व्यक्त करती है, न कि दूसरों को उसका कैसा दिखाई देना।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित सर्वनाम का सामान्य और प्रतिनिधिक अर्थ आधुनिक हिन्दी में सहज रूप से व्यक्त होता है।
- source_word: εἶναί τι
  choice: अपने आप को कुछ समझता है
  rationale: ‘कुछ होना’ महत्त्वपूर्ण या विशिष्ट होने का दावा सूचित करता है। यह चयन यूनानी के संक्षिप्त ‘कुछ/कुछ नहीं’ विरोध को यथासंभव सुरक्षित रखता है।
- source_word: μηδὲν ὤν
  choice: कुछ न होते हुए भी
  rationale: कृदन्तीय वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करता है। ‘भी’ प्रसंग में निहित विरोध को स्पष्ट करता है, बिना यह तय किए कि ‘कुछ नहीं’ का आशय पूर्ण मूल्यहीनता है।
- source_word: φρεναπατᾷ
  choice: धोखा देता है
  rationale: क्रिया मन में भ्रमित करने या छलने का भाव रखती है; आत्मवाचक कर्म के साथ ‘अपने आप को धोखा देता है’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: ἑαυτόν
  choice: अपने आप को
  rationale: आत्मवाचक सर्वनाम को हिन्दी में स्वाभाविक रूप से व्यक्त करता है और उसी अनिश्चित एकवचन कर्ता की ओर संकेत करता है।
theological_decisions:
- issue: ‘कुछ’ और ‘कुछ नहीं’ का आशय
  choice: 'शाब्दिक विरोध को बनाए रखा गया: ‘कुछ ... कुछ न होते हुए’'
  alternative: ‘महत्त्वपूर्ण ... कोई महत्त्व न रखते हुए’
  rationale: मूल की तीखी और जानबूझकर संक्षिप्त शब्दावली व्यक्ति के आत्म-मूल्यांकन की आलोचना करती है। उसे ‘महत्त्वपूर्ण’ कहकर खोलना संभव है, पर इससे पौलुस की अभिव्यक्ति का व्यापक और तनावपूर्ण स्वर संकरा हो जाता।
- issue: प्रतिनिधिक एकवचन का हिन्दी रूप
  choice: लिंग-निरपेक्ष ‘कोई’ और आत्मवाचक ‘अपने आप को’
  alternative: ‘वह अपने आप को’ अथवा पुल्लिंग-चिह्नित विस्तृत रूप
  rationale: यूनानी का अनिश्चित एकवचन प्रतिनिधिक है। हिन्दी में ‘कोई’ और ‘अपने आप को’ उसी एकवचन सामान्य संदर्भ को स्वाभाविक रूप से रखते हैं, अनावश्यक लैंगिक विशिष्टता जोड़े बिना।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल के ‘कुछ/कुछ नहीं’ विरोध और आत्म-छल की तीव्रता सुरक्षित रखी गई है।
