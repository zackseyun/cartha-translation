lexical_decisions:
- source_word: Ἴδετε
  choice: देखो
  rationale: बहुवचन आज्ञार्थक यहाँ ध्यान आकर्षित करता है; ‘देखो’ सीधा, स्वाभाविक और संक्षिप्त है।
- source_word: πηλίκοις
  choice: कितने बड़े-बड़े
  rationale: यह आकार या परिमाण बता सकता है। γράμμασιν के साथ मुख्य पाठ में लिखावट के अक्षरों के बड़े आकार का अर्थ अधिक स्वाभाविक है।
- source_word: γράμμασιν
  choice: अक्षरों में
  rationale: यहाँ बहुवचन शब्द लिखित वर्णों/अक्षरों को सूचित करता है; ‘अक्षरों में’ साधन/रीति का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: यह लिखने की क्रिया का अप्रत्यक्ष कर्म है और पाठकों को संबोधित करता है।
- source_word: ἔγραψα
  choice: मैंने ... लिखा है
  rationale: यूनानी एओरिस्ट को यहाँ वर्तमान पाठ से जुड़े पूर्ण कार्य के रूप में हिंदी पूर्णकाल में कहना स्वाभाविक है, बिना काल पर अतिरिक्त अर्थ थोपे।
- source_word: τῇ ἐμῇ χειρί
  choice: अपने हाथ से
  rationale: करणवाचक प्रयोग है; ‘अपने’ ἐμῇ के बल को स्वाभाविक हिंदी में व्यक्त करता है और पौलुस के स्वयं लिखने पर जोर देता है।
theological_decisions:
- issue: πηλίκοις γράμμασιν का अर्थ
  choice: लिखावट के अक्षरों का बड़ा आकार
  alternative: मैंने तुम्हें कितना लंबा पत्र लिखा है
  rationale: γράμματα का सामान्य अर्थ अक्षर/लिखित वर्ण है, और ‘अपने हाथ से’ का निकट संदर्भ लिखावट के आकार वाले अर्थ का समर्थन करता है। फिर भी पत्र की लंबाई वाला अर्थ व्याकरणतः और ऐतिहासिक रूप से संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘बड़े-बड़े अक्षरों’ से भौतिक लिखावट स्पष्ट होती है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
