source:
  edition: SBLGNT
  text: ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/008.yaml
  text: For the one who sows to his own flesh will reap corruption from the flesh[c][b][a], but the one who sows to the Spirit will reap eternal life from the Spirit.
translation:
  language: hi
  text: क्योंकि जो अपने ही शरीर[a] के लिए बोता है, वह शरीर से विनाश[b] की फसल काटेगा; पर जो आत्मा[c] के लिए बोता है, वह आत्मा से अनन्त जीवन की फसल काटेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने ही पापी स्वभाव के लिए।’ यूनानी शब्द सार्क्स का शाब्दिक अर्थ ‘शरीर’ हो सकता है, पर पौलुस के नैतिक विरोधों में यह अक्सर पवित्र आत्मा के विरुद्ध खड़े पतित मानवीय झुकाव को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्षय’ अथवा ‘बर्बादी।’ यूनानी शब्द भ्रष्ट होने, नष्ट होने या सड़ने-गलने का भाव व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात् परमेश्वर का पवित्र आत्मा। कुछ लोग इसे मनुष्य की ‘आत्मा’ समझ सकते हैं, पर गलातियों में शरीर और आत्मा का यह विरोध सामान्यतः परमेश्वर के पवित्र आत्मा की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले उपदेश का आधार बताता है; ‘क्योंकि’ उसके व्याख्यात्मक और कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ σπείρων
  choice: जो ... बोता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त का सामान्य, नीतिवचन-जैसा अर्थ सुरक्षित रहता है।
- source_word: εἰς τὴν σάρκα ἑαυτοῦ
  choice: अपने ही शरीर के लिए
  rationale: σπείρω के साथ εἰς लक्ष्य अथवा हित की ओर संकेत करता है। ‘शरीर’ पौलुस की प्रमुख शब्दावली और उसके व्यापक अर्थ-तनाव को बनाए रखता है; ‘अपने ही’ ἑαυτοῦ के आत्मवाचक बल को दर्शाता है।
- source_word: ἐκ τῆς σαρκὸς
  choice: शरीर से
  rationale: ἐκ परिणाम के स्रोत को दर्शाता है और अगले खंड के ‘आत्मा से’ के साथ समानांतरता बनाए रखता है।
- source_word: θερίσει
  choice: फसल काटेगा
  rationale: यह हिन्दी में कृषि-रूपक को स्पष्ट और स्वाभाविक रखते हुए बोने और काटने की जोड़ी बनाए रखता है।
- source_word: φθοράν
  choice: नाश
  rationale: φθορά में क्षय, भ्रष्टता और विनाश का व्यापक भाव हो सकता है। ‘नाश’ यहाँ अंतिम बर्बादी के अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि पादटिप्पणी अन्य संभावित छायाएँ बताती है।
- source_word: εἰς τὸ πνεῦμα
  choice: आत्मा के लिए
  rationale: वाक्य में यह ‘शरीर के लिए’ के ठीक समानांतर लक्ष्य को दर्शाता है। गलातियों के संदर्भ में ‘आत्मा’ का सबसे संभावित आशय परमेश्वर का पवित्र आत्मा है।
- source_word: ἐκ τοῦ πνεύματος
  choice: आत्मा से
  rationale: ἐκ स्रोत को दर्शाता है और पहले खंड के ‘शरीर से’ के साथ संतुलित समानांतरता रखता है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह स्थापित अभिव्यक्ति का सटीक, प्रचलित और सहज हिन्दी अनुवाद है।
theological_decisions:
- issue: पौलुस के नैतिक विरोध में σάρξ का अर्थ
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: यहाँ नैतिक अर्थ प्रमुख है, फिर भी मुख्य पाठ में ‘शरीर’ रखने से पौलुस की शब्दावली तथा देह, मानवीय दुर्बलता और परमेश्वर-विरोधी झुकाव के बीच का वास्तविक अर्थ-तनाव सुरक्षित रहता है।
- issue: πνεῦμα का संदर्भ
  choice: आत्मा, जिसे पादटिप्पणी में पवित्र आत्मा के रूप में स्पष्ट किया गया है
  alternative: मनुष्य की आत्मा
  rationale: गलातियों में शरीर और आत्मा के इस विरोध का सामान्य संदर्भ परमेश्वर का पवित्र आत्मा है। मुख्य पाठ स्रोत की संक्षिप्तता रखता है और पादटिप्पणी संभावित संदर्भ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बोता है/फसल काटेगा’ कृषि-रूपक को स्पष्ट करता है; दोनों खंडों की समानांतर बनावट मूल यूनानी के संतुलित विरोध को सुरक्षित रखती है।
