  text: οὐδὲ γὰρ οἱ ⸀περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/013.yaml
  text: For not even those who are circumcised themselves keep the law[a], but they want you to be circumcised so that they may boast in your flesh.
translation:
  language: hi
  text: क्योंकि खतना किए हुए लोग स्वयं भी व्यवस्था का पालन नहीं करते, परन्तु वे चाहते हैं कि तुम्हारा खतना हो, ताकि वे तुम्हारी देह[a] को लेकर घमण्ड कर सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी देह में।” यहाँ ‘देह’ खतने के शारीरिक चिह्न के संदर्भ में है।
    reason: literal_rendering_and_lexical_clarity
lexical_decisions:
- source_word: οὐδὲ γὰρ
  choice: क्योंकि ... भी नहीं
  rationale: γάρ के व्याख्यात्मक संबंध को ‘क्योंकि’ और οὐδέ के बल को ‘भी नहीं’ से स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: οἱ περιτεμνόμενοι
  choice: जिनका खतना होता है
  rationale: संज्ञा-सदृश वर्तमान कृदन्त समूह को खतने से पहचाने जाने वाले लोगों के रूप में प्रस्तुत करता है, बिना इसे केवल ‘खतने का समर्थन करने वाले’ कहकर अधिक व्याख्यायित किए।
- source_word: αὐτοὶ
  choice: वे स्वयं भी
  rationale: 'विषय पर दिए गए यूनानी बल को स्पष्ट करता है: यही लोग स्वयं व्यवस्था का पालन नहीं करते।'
- source_word: νόμον φυλάσσουσιν
  choice: व्यवस्था का पालन करते
  rationale: टोरा/मूसा की व्यवस्था का आज्ञापालन करने के अर्थ में आधुनिक हिन्दी का स्वाभाविक और मानक प्रयोग।
- source_word: ἀλλὰ θέλουσιν
  choice: फिर भी वे चाहते हैं
  rationale: यहाँ ἀλλά के विरोध को हिन्दी में स्पष्ट करता है और θέλουσιν की इच्छासूचक शक्ति बनाए रखता है।
- source_word: ὑμᾶς περιτέμνεσθαι
  choice: तुम्हारा खतना हो
  rationale: यूनानी कर्मवाच्य/मध्यवाच्य अनन्त रूप का सहज हिन्दी निरूपण।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν τῇ ὑμετέρᾳ σαρκὶ
  choice: तुम्हारे शरीर[a] पर
  rationale: संदर्भ में शारीरिक खतने के दिखाई देने वाले चिह्न की बात है। हिन्दी में ‘शरीर पर’ अर्थ को स्वाभाविक बनाता है; पादटिप्पणी अधिक शाब्दिक ‘देह/मांस में’ को दर्ज करती है।
- source_word: καυχήσωνται
  choice: घमण्ड कर सकें
  rationale: नकारात्मक प्रसंग में καυχάομαι की डींग या गर्व करने की भावना को प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस प्रसंग में σάρξ का अर्थ
  choice: खतने के शारीरिक चिह्न के संदर्भ में ‘शरीर’
  alternative: ‘मांस’; अथवा रूपकात्मक ‘पापी स्वभाव’
  rationale: निकटवर्ती प्रसंग खतने का है, इसलिए σάρξ भौतिक देह को सूचित करता है। ‘पापी स्वभाव’ कहना इस स्थल पर अनुचित धर्मवैचारिक अर्थ आरोपित करेगा।
- issue: περιτεμνόμενοι कृदन्त का बल
  choice: ‘जिनका खतना होता है’—खतने से पहचाना गया समूह
  alternative: ‘खतने का समर्थन करने वाले’ या ‘जो अपना खतना करवाते हैं’
  rationale: मूल शब्द समूह को खतने की स्थिति/प्रथा से पहचानता है। व्यापक प्रसंग में वे खतने के समर्थक हैं, पर मुख्य पाठ में उस व्याख्या को मूल शब्दों का स्थान नहीं दिया गया।
- issue: ἐν के साथ boasting का संबंध
  choice: ‘तुम्हारे शरीर पर घमण्ड’—उनके शरीर पर किए गए खतने को उपलब्धि मानना
  alternative: अधिक शाब्दिक ‘तुम्हारी देह में घमण्ड’
  rationale: यूनानी संबंध को बनाए रखते हुए हिन्दी का स्वाभाविक मुहावरा चुना गया है; यह उपलब्धि के आधार और दृश्य शारीरिक चिह्न, दोनों की ओर संकेत कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘व्यवस्था’, ‘खतना’ और ‘घमण्ड’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। वाक्य तर्कपूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है।
