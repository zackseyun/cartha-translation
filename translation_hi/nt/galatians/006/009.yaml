  text: τὸ δὲ καλὸν ποιοῦντες μὴ ⸀ἐγκακῶμεν, καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/009.yaml
  text: And let us not grow weary in doing good[a], for in due time we will reap[c][b], if we do not give up.
translation:
  language: hi
  text: भलाई करते हुए हम निराश न हों, क्योंकि उचित समय पर हम फसल काटेंगे, यदि हम ढीले न पड़ें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καλὸν ποιοῦντες
  choice: भलाई करते-करते
  rationale: यह यूनानी पदबंध निरंतर वह करने को व्यक्त करता है जो अच्छा और भला है। ‘भलाई करते-करते’ सहज हिन्दी में उसके नैतिक अर्थ और जारी रहने वाले भाव, दोनों को रखता है।
- source_word: μὴ ἐγκακῶμεν
  choice: हिम्मत न हारें
  rationale: क्रिया का अर्थ भलाई में लगे रहते हुए निरुत्साहित होकर ढीला पड़ना या साहस खोना है। ‘हिम्मत न हारें’ आधुनिक हिन्दी में स्वाभाविक है और अंतिम पदबंध से पर्याप्त भिन्न भी रहता है।
- source_word: καιρῷ ... ἰδίῳ
  choice: उचित समय पर
  rationale: καιρός के साथ ἴδιος उस समय को दर्शाता है जो अपना नियत, उपयुक्त या ठीक समय है। ‘उचित समय पर’ किसी अनकहे कर्ता को जोड़े बिना यह भाव देता है।
- source_word: θερίσομεν
  choice: फसल काटेंगे
  rationale: यह शब्द काटनी करने या उपज बटोरने के कृषि-रूपक को जारी रखता है। हिन्दी में ‘फसल काटेंगे’ स्पष्ट और स्वाभाविक रूप से उस रूपक को बनाए रखता है।
- source_word: μὴ ἐκλυόμενοι
  choice: यदि हम हार न मानें
  rationale: यह कृदंत थककर ढीला पड़ने या प्रयास छोड़ देने का भाव रखता है और यहाँ शर्त जैसा कार्य करता है। ‘यदि हम हार न मानें’ इस शर्त को स्पष्ट करता है तथा पहले पद ‘हिम्मत न हारें’ से संबंधित किंतु अलग अभिव्यक्ति देता है।
theological_decisions:
- issue: ἐγκακῶμεν और ἐκλυόμενοι—धीरज से जुड़े दो पदबंधों का संबंध
  choice: पहले को ‘हिम्मत न हारें’ और दूसरे को ‘यदि हम हार न मानें’ कहा गया है।
  alternative: ‘थक न जाएँ’ ... ‘यदि हम ढीले न पड़ें’; अथवा ‘निराश न हों’ ... ‘बिना शिथिल हुए’।
  rationale: पौलुस दो निकट-संबंधी पर पूर्णतः समान न होने वाली अभिव्यक्तियाँ प्रयोग करता है। हिन्दी में उनका परस्पर संबंध बनाए रखते हुए उन्हें अलग ढंग से प्रस्तुत किया गया है; फसल पाने की शर्त को न तो हटाया गया है, न किसी विशिष्ट उद्धार-सिद्धांत के अनुसार समझाया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामूहिक उपदेशात्मक शैली। कृषि-रूपक को ‘फसल काटेंगे’ से सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि प्रमुख अर्थगत सूक्ष्मताएँ मुख्य पाठ में स्वाभाविक रूप से व्यक्त हैं।
