id: GAL.6.15
reference: Galatians 6:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂οὔτε γὰρ⸃ περιτομή τί ⸀ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.
base_translation:
  language: en
  yaml_path: translation/nt/galatians/006/015.yaml
  text: For neither circumcision counts for anything[a], nor uncircumcision[b], but a new creation.
translation:
  language: hi
  text: क्योंकि न तो खतने का कोई महत्त्व है, न खतना-रहित होने का; बल्कि महत्त्व नई सृष्टि[a] का है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नया प्राणी’; किन्तु इस प्रसंग में ‘नई सृष्टि’ अधिक सम्भावित है।
    reason: κτίσις का अर्थ ‘सृष्टि’ अथवा ‘सृजित प्राणी’ हो सकता है; टिप्पणी वास्तविक शब्दार्थगत विकल्प को सुरक्षित रखती है।
lexical_decisions:
- source_word: οὔτε γὰρ
  choice: क्योंकि न तो
  rationale: γάρ को पिछले कथन से कारणात्मक संबंध दिखाने के लिए ‘क्योंकि’ और οὔτε को समांतर ‘न तो…न…’ रचना से व्यक्त किया गया है।
- source_word: περιτομή
  choice: खतना
  rationale: यह प्रचलित और स्पष्ट हिन्दी शब्द है, जो शारीरिक विधि तथा उससे चिह्नित धार्मिक-सामुदायिक स्थिति—दोनों का संकेत बनाए रखता है।
- source_word: τί ἐστιν
  choice: कोई महत्त्व है
  rationale: इस प्रसंग में यूनानी मुहावरा निर्णायक महत्त्व या मूल्य होने को व्यक्त करता है। ‘कोई महत्त्व है’ हिन्दी में स्वाभाविक है और कथन को किसी विशेष धार्मिक सिद्धान्त तक सीमित नहीं करता।
- source_word: οὔτε ἀκροβυστία
  choice: न खतना-रहित होने का
  rationale: यह περιτομή के समानांतर खतनारहित स्थिति को व्यक्त करता है; केवल शारीरिक अंग का उल्लेख करने वाली अत्यधिक शाब्दिक अभिव्यक्ति से बचा गया है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह दोनों पूर्ववर्ती स्थितियों के विपरीत उस वास्तविकता पर स्पष्ट बल देता है जिसका महत्त्व है।
- source_word: καινὴ κτίσις
  choice: नई सृष्टि
  rationale: καινή गुणात्मक नवीनता बताता है और κτίσις यहाँ व्यापक सृजनात्मक नवीनीकरण का बोध करा सकता है। ‘नई सृष्टि’ इस व्यापकता को सुरक्षित रखता है, जबकि ‘नया प्राणी’ अर्थ को व्यक्ति तक सीमित कर सकता है।
theological_decisions:
- issue: खतना, खतनारहित स्थिति और नई सृष्टि के बीच पौलुस का विरोध
  choice: दोनों बाहरी स्थितियों के निर्णायक महत्त्व का निषेध करते हुए नई सृष्टि को महत्त्वपूर्ण वास्तविकता के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल सामाजिक पहचान के चिह्नों पर टिप्पणी मानना, या दोनों स्थितियों को उद्धार के समान मार्ग मानना।
  rationale: यूनानी पाठ दोनों स्थितियों के विषय में ‘कुछ होना’ नकारता है और उन्हें नई सृष्टि के विपरीत रखता है। अनुवाद इसी विरोध को बनाए रखता है, पर पाठ से आगे बढ़कर किसी संप्रदाय-विशेष की व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘न तो…न…; बल्कि…’ से यूनानी विरोधात्मक संरचना बनी रहती है। अन्तिम खंड में हिन्दी की स्वाभाविकता के लिए निहित ‘महत्त्व’ दोहराया गया है।
