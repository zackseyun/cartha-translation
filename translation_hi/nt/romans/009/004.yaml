  text: οἵτινές εἰσιν Ἰσραηλῖται, ὧν ἡ υἱοθεσία καὶ ἡ δόξα καὶ αἱ διαθῆκαι καὶ ἡ νομοθεσία καὶ ἡ λατρεία καὶ αἱ ἐπαγγελίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/004.yaml
  text: who are Israelites[a], to whom belong the adoption, the glory, the covenants, the giving of the law, the worship, and the promises[d][c][b],
translation:
  language: hi
  text: वे इस्राएली हैं[a], जिनके हैं पुत्रत्व[c], महिमा[b], वाचाएँ, व्यवस्था का दिया जाना, उपासना[d] और प्रतिज्ञाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे इस्राएली हैं; उन्हें पुत्रत्व, महिमा, वाचाएँ, व्यवस्था का दिया जाना, उपासना और प्रतिज्ञाएँ प्राप्त हुई हैं।”
    reason: lexical_alternative
  - marker: b
    text: “महिमा” संभवतः इस्राएल के बीच परमेश्वर की प्रकट उपस्थिति की ओर संकेत करती है।
    reason: cross_reference
  - marker: c
    text: या, “गोद लिया जाना” अथवा “पुत्रों के रूप में गोद लिया जाना।”
    reason: lexical_alternative
  - marker: d
    text: अर्थात, परमेश्वर के लिए इस्राएल की वाचा-संबंधी उपासना और धार्मिक सेवा।
    reason: cultural_note
lexical_decisions:
- source_word: οἵτινές εἰσιν Ἰσραηλῖται
  choice: वे इस्राएली हैं
  rationale: यह पिछले पद में उल्लिखित पौलुस के स्वजातीय लोगों का परिचय देता है। सरल वर्तमानकालीन वाक्य यूनानी की पहचानसूचक शक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ὧν
  choice: उन्हीं को ... मिली हैं
  rationale: सम्बन्धवाचक सर्वनाम यहाँ अधिकार अथवा प्राप्त विशेषाधिकार बताता है। हिन्दी में ‘उन्हीं को ... मिली हैं’ सूची के साथ स्वाभाविक है और ‘उनके हैं’ की अपेक्षा व्यवस्था दिए जाने जैसी संज्ञाओं के साथ अधिक सहज बैठता है।
- source_word: υἱοθεσία
  choice: गोद लिए जाने का अधिकार
  rationale: यह इस्राएल को परमेश्वर की सन्तान के रूप में मिली वाचागत प्रतिष्ठा को व्यक्त करता है। ‘अधिकार’ जोड़ने से यहाँ सूचीबद्ध सामूहिक विशेषाधिकार का भाव स्पष्ट होता है, पर व्यक्तिगत उद्धार-विषयक अर्थ नहीं थोपा जाता।
- source_word: δόξα
  choice: महिमा
  rationale: यूनानी का संक्षिप्त और धर्मवैचारिक रूप से सघन शब्द ज्यों का त्यों रखा गया है; सम्भावित आशय परमेश्वर की इस्राएल के बीच प्रकट उपस्थिति है।
- source_word: διαθῆκαι
  choice: वाचाएँ
  rationale: यूनानी बहुवचन को बनाए रखते हुए बाइबलीय और प्रचलित हिन्दी पद चुना गया है।
- source_word: νομοθεσία
  choice: व्यवस्था का दिया जाना
  rationale: यह केवल व्यवस्था नहीं, बल्कि उसके दिए जाने की घटना और विशेषाधिकार को दर्शाता है।
- source_word: λατρεία
  choice: उपासना
  rationale: यह परमेश्वर के सामने इस्राएल की ठहराई हुई धार्मिक सेवा और आराधना को व्यापक रूप से व्यक्त करता है, बिना इसे केवल मन्दिर या याजकीय सेवा तक सीमित किए।
- source_word: ἐπαγγελίαι
  choice: प्रतिज्ञाएँ
  rationale: यूनानी बहुवचन बनाए रखा गया है और परमेश्वर द्वारा इस्राएल को दी गई प्रतिज्ञाओं का स्वाभाविक बाइबलीय हिन्दी रूप अपनाया गया है।
theological_decisions:
- issue: इस्राएल के सम्बन्ध में υἱοθεσία का अर्थ
  choice: इस्राएल को सामूहिक रूप से गोद लिए जाने का वाचागत अधिकार
  alternative: पुत्रत्व; पुत्रों के रूप में गोद लिया जाना
  rationale: रोमियों 9:4 में इस्राएल के ऐतिहासिक, सामूहिक विशेषाधिकार गिनाए गए हैं। अनुवाद रूपक को बनाए रखता है, पर बाद के व्यक्तिगत उद्धार-विषयक अर्थ को यहाँ आरोपित नहीं करता।
- issue: ἡ δόξα का संकेत
  choice: मुख्य पाठ में केवल ‘महिमा’
  alternative: ईश्वरीय महिमा; महिमामय उपस्थिति
  rationale: सन्दर्भ सम्भवतः इस्राएल के बीच परमेश्वर की प्रकट उपस्थिति की ओर संकेत करता है, पर यूनानी पाठ केवल ‘महिमा’ कहता है; इसलिए अधिक विशिष्ट व्याख्या पाद-टिप्पणी में रखी गई है।
- issue: λατρεία का दायरा
  choice: उपासना
  alternative: मन्दिर की सेवा; धार्मिक सेवा
  rationale: शब्द में वाचागत धार्मिक सेवा का भाव है, किन्तु उसे केवल मन्दिर या याजकों तक सीमित करना मूल से अधिक विशिष्ट होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘वाचा’, ‘व्यवस्था’, ‘महिमा’ और ‘प्रतिज्ञा’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। सूची की लय और यूनानी बहुवचनों को सुरक्षित रखा गया है; व्याख्यात्मक विस्तार मुख्य पाठ के बजाय पाद-टिप्पणियों में दिया गया है।
