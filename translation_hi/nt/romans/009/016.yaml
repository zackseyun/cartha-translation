id: ROM.9.16
reference: Romans 9:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄρα οὖν οὐ τοῦ θέλοντος οὐδὲ τοῦ τρέχοντος ἀλλὰ τοῦ ἐλεῶντος θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/016.yaml
  text: So then[a], it does not depend on the one who wills or the one who runs[b], but on God who shows mercy.
translation:
  language: hi
  text: इसलिए[a] यह न तो इच्छा करनेवाले पर निर्भर है, न दौड़नेवाले पर[b], बल्कि दया करनेवाले परमेश्वर पर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “अतः यह न इच्छा करनेवाले का है, न दौड़नेवाले का, बल्कि दया करनेवाले परमेश्वर का।” यूनानी वाक्य संक्षिप्त और अपूर्ण-सा है; उसका निहित आशय संदर्भ में परमेश्वर के उद्देश्य और दया से समझा जाता है।'
    reason: lexical_alternative
  - marker: b
    text: “दौड़नेवाले” का आशय संभवतः मनुष्य के प्रयत्न या जी-तोड़ प्रयास से है, पर यूनानी क्रिया का शाब्दिक अर्थ “दौड़ना” है।
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले तर्क से निकलने वाले निष्कर्ष को दिखाता है; ‘इसलिए’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: τοῦ θέλοντος
  choice: इच्छा करनेवाले
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत मानवीय इच्छा या संकल्प को व्यक्त करता है; यह ‘चाहनेवाले’ से कुछ अधिक सटीक रूप से इच्छाशक्ति का भाव रखता है।
- source_word: τοῦ τρέχοντος
  choice: दौड़नेवाले
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दौड़ना’ है। मुख्य पाठ में इस बिंब को बनाए रखा गया है, जबकि उसके प्रयत्न या परिश्रम संबंधी रूपकात्मक भाव को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पहले दो नकारात्मक पदों और परमेश्वर की दया के बीच प्रबल विरोध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοῦ ἐλεῶντος θεοῦ
  choice: दया करनेवाले परमेश्वर पर
  rationale: यह कृदंत के सक्रिय भाव को सुरक्षित रखता है और परमेश्वर को दया करने की क्रिया द्वारा पहचानता है।
- source_word: implied predicate/expression
  choice: यह ... पर निर्भर है
  rationale: यूनानी वाक्य में विधेय लुप्त है। ‘निर्भर है’ हिंदी में वाक्य को स्पष्ट बनाता है, पर ‘यह’ का आशय उद्धार, चुनाव या किसी अन्य संकीर्ण धारणा के रूप में निश्चित नहीं करता।
theological_decisions:
- issue: लुप्त कर्ता/विधेय और निर्भरता का दायरा
  choice: मुख्य पाठ में सामान्य ‘यह ... पर निर्भर है’ रखा गया है।
  alternative: ‘उद्धार मनुष्य की इच्छा या प्रयास पर निर्भर नहीं है’ अथवा ‘परमेश्वर का चुनाव ... पर निर्भर नहीं है।’
  rationale: तात्कालिक संदर्भ परमेश्वर के उद्देश्य और दया से जुड़ा है, फिर भी यूनानी पाठ वाक्य का आशय स्पष्ट संज्ञा से नहीं बताता। सामान्य अभिव्यक्ति मूल की अस्पष्टता और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल यूनानी की संक्षिप्तता को पूरी तरह अस्वाभाविक बनाए बिना उसकी वास्तविक अस्पष्टता सुरक्षित रखी गई है।
