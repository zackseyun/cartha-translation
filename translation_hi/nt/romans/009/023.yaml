source:
  edition: SBLGNT
  text: ⸀καὶ ἵνα γνωρίσῃ τὸν πλοῦτον τῆς δόξης αὐτοῦ ἐπὶ σκεύη ἐλέους, ἃ προητοίμασεν εἰς δόξαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/023.yaml
  text: and in order to make known the riches of his glory upon vessels of mercy, which he prepared beforehand for glory,
translation:
  language: hi
  text: और ताकि वह दया के पात्रों पर अपनी महिमा की संपदा प्रकट करे, जिन्हें उसने महिमा के लिए पहले से तैयार किया था,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν πλοῦτον τῆς δόξης αὐτοῦ
  choice: अपनी महिमा का धन
  rationale: एकवचन ‘πλοῦτον’ को ‘धन’ और संबंधसूचक वाक्यांश को स्वाभाविक हिंदी में रखा गया है; ‘अपार’ जैसा अतिरिक्त विशेषण नहीं जोड़ा गया।
- source_word: ἐπὶ σκεύη ἐλέους
  choice: दया के पात्रों पर
  rationale: ‘ἐπί’ के ‘पर’ भाव को सुरक्षित रखा गया है और ‘σκεύη’ के रूपक को ‘पात्र’ से बनाए रखा गया है।
- source_word: ἃ προητοίμασεν εἰς δόξαν
  choice: जिन्हें उसने महिमा के लिए पहले से तैयार किया था
  rationale: ‘προητοίμασεν’ की पूर्वतैयारी और ‘εἰς δόξαν’ के लक्ष्यभाव—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: γνωρίσῃ
  choice: प्रकट करे
  rationale: संदर्भ में अर्थ किसी बात को ज्ञात या जाहिर करने का है; ‘प्रकट करे’ हिंदी में स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: ‘दया के पात्रों’ और उनकी पूर्वतैयारी का संबंध
  choice: ‘जिन्हें’ का निकटतम पूर्वपद ‘दया के पात्रों’ को माना गया है
  alternative: संबंधवाचक उपवाक्य को अधिक व्याख्यात्मक बनाकर व्यक्तियों के चुनाव या अंतिम उद्धार को स्पष्ट करना
  rationale: यूनानी व्याकरण सीधे पात्रों को पूर्वतैयारी का कर्म बताता है, पर यह पद पूर्वतैयारी की रीति या आधार नहीं बताता; इसलिए कोई अतिरिक्त सिद्धान्त नहीं जोड़ा गया।
- issue: ‘महिमा के लिए’ का आशय
  choice: लक्ष्यसूचक अभिव्यक्ति को खुला रखा गया है
  alternative: इसे ‘महिमा पाने के लिए’ या ‘अपनी महिमा दिखाने के लिए’ कहना
  rationale: ‘εἰς δόξαν’ में लक्ष्य का भाव है, किंतु महिमा किस प्रकार संबंधित है यह संक्षिप्त वाक्यांश स्वयं स्पष्ट नहीं करता; अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और स्रोत के वाक्य-विन्यास से पर्याप्त निकट। आरंभ का ‘और इसलिए कि’ तथा अंत का अल्पविराम इस पद के पूर्ववर्ती और अगले संदर्भ से व्याकरणिक संबंध को बनाए रखते हैं।
