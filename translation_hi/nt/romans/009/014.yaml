lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: तो हम क्या कहें?
  rationale: यह पौलुस का प्रचलित संक्रमणकारी प्रश्न है, जो पिछले कथन से निकलने वाली संभावित आपत्ति प्रस्तुत करता है। यह हिन्दी में स्वाभाविक है और यूनानी भविष्यकाल की विचार-विमर्शात्मक शक्ति को व्यक्त करता है।
- source_word: μὴ ἀδικία
  choice: क्या ... अन्याय है?
  rationale: प्रश्न में μή नकारात्मक उत्तर की अपेक्षा दर्शाता है। हिन्दी का प्रश्नात्मक रूप इस आलंकारिक आशय को बिना अतिरिक्त व्याख्या के स्वाभाविक ढंग से रखता है। ἀδικία के न्याय-संबंधी नैतिक अर्थ के लिए ‘अन्याय’ स्पष्ट और प्रचलित है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर की ओर से
  rationale: यह पदबंध यहाँ परमेश्वर की ओर से या परमेश्वर के व्यवहार में अन्याय होने की बात उठाता है। ‘परमेश्वर की ओर से’ स्रोत के संबंधसूचक अर्थ को स्पष्ट रखते हुए ‘क्या परमेश्वर अन्यायी है?’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: यह यूनानी मुहावरा अत्यंत प्रबल निषेध व्यक्त करता है। ‘कदापि नहीं!’ संक्षिप्त, गरिमापूर्ण और जोरदार आधुनिक हिन्दी है; शाब्दिक ‘ऐसा कभी न हो’ भी संभव है, पर यहाँ कम स्वाभाविक है।
theological_decisions:
- issue: क्या पद को परमेश्वर के चरित्र पर सीधे आरोप के रूप में व्याख्यायित किया जाए या यूनानी की संक्षिप्त आलंकारिक आपत्ति बनाए रखी जाए।
  choice: ‘क्या परमेश्वर की ओर से अन्याय है?’ के रूप में आपत्ति और उसके प्रबल निषेध को ज्यों का त्यों रखना।
  alternative: ‘क्या परमेश्वर अन्यायी है?’ या चुनाव और न्याय के विषय में कोई व्याख्यात्मक विस्तार।
  rationale: मूल पाठ केवल संभावित अन्याय का प्रश्न उठाकर उसे दृढ़ता से नकारता है। अनुवाद चुनाव, तिरस्कार या दैवी निष्पक्षता की किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘कदापि’ यहाँ प्रबल निषेध के लिए साहित्यिक किंतु व्यापक रूप से समझा जाने वाला शब्द है।
