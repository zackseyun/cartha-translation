source:
  edition: SBLGNT
  text: τῷ ⸂Μωϋσεῖ γὰρ⸃ λέγει· Ἐλεήσω ὃν ἂν ἐλεῶ, καὶ οἰκτιρήσω ὃν ἂν οἰκτίρω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/015.yaml
  text: For he says to Moses[a], “I will have mercy on whomever I have mercy[b], and I will have compassion on whomever I have compassion.”
translation:
  language: hi
  text: क्योंकि वह मूसा से कहता है, “मैं जिस पर दया करूँ, उस पर दया करूँगा; और जिस पर करुणा करूँ, उस पर करुणा करूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: निर्गमन 33:19 से उद्धरण।
    reason: cross_reference
lexical_decisions:
- source_word: τῷ Μωϋσεῖ
  choice: मूसा से
  rationale: λέγει के साथ दत्तिव कारक संबोधित व्यक्ति को दर्शाता है; आधुनिक हिन्दी में ‘मूसा से कहता है’ स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार प्रस्तुत करता है और पौलुस के तर्क-संबंध को स्पष्ट रूप से बनाए रखता है।
- source_word: λέγει
  choice: वह ... कहता है
  rationale: यूनानी वर्तमान काल के जीवंत शास्त्रीय उद्धरण-प्रयोग को सुरक्षित रखा गया है; निर्गमन के संदर्भ में निहित वक्ता परमेश्वर है।
- source_word: Ἐλεήσω ... ἐλεῶ
  choice: मैं जिस पर दया करूँगा, उस पर दया करूँगा
  rationale: एक ही क्रिया की पुनरावृत्ति और भविष्य-संबंधी रूप को बनाए रखते हुए हिन्दी में स्रोत की बलपूर्ण, जानबूझकर दोहराई गई अभिव्यक्ति सुरक्षित रहती है।
- source_word: ὃν ἂν
  choice: जिस पर ... उस पर
  rationale: यह हिन्दी में अनिश्चित संबंधवाचक कर्म को स्वाभाविक ढंग से व्यक्त करता है और ‘जिसे मैं चुनूँ’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: οἰκτιρήσω ... οἰκτίρω
  choice: मैं जिस पर करुणा करूँगा, उस पर करुणा करूँगा
  rationale: ‘करुणा’ दया से निकट होते हुए भी οἰκτίρω और ἐλεέω का शाब्दिक भेद बनाए रखती है; समानांतर पुनरावृत्ति भी सुरक्षित है।
theological_decisions:
- issue: उद्धरण-सूत्र में वक्ता की पहचान
  choice: व्यक्तिगत कर्ता ‘वह’ रखा गया, जो निर्गमन के संदर्भ में परमेश्वर को सूचित करता है।
  alternative: ‘शास्त्र मूसा से कहता है’ या कर्तारहित ‘मूसा से कहा गया है।’
  rationale: यूनानी में कर्ता व्यक्त नहीं है, पर उद्धरण परमेश्वर का प्रत्यक्ष कथन है। ‘वह’ संदर्भ के अनुरूप है और अतिरिक्त धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
- issue: दया और करुणा में परमेश्वर की स्वतंत्रता
  choice: मूल की पुनरुक्त, तनावपूर्ण संरचना को यथावत रखा गया।
  alternative: ‘मैं जिस किसी को चुनूँगा, उस पर दया करूँगा।’
  rationale: ‘चुनूँगा’ यूनानी पाठ में नहीं है और निर्वाचन-विषयक विवाद का एक अर्थ अनुवाद में जोड़ देगा; स्रोत की वास्तविक धर्मवैचारिक खुली जगह सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘दया’ और ‘करुणा’ परिचित शब्द हैं। अर्धविराम दोनों समानांतर उपवाक्यों का संबंध और भेद स्पष्ट करता है।
