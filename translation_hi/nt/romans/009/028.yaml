- source_word: συντελῶν
  choice: उसे पूर्ण करके
  rationale: यह कृदन्त किसी बात को उसके निश्चित अंत तक पहुँचाने का भाव रखता है। ‘पूर्ण करके’ उस प्रक्रिया और परिणति दोनों को व्यक्त करता है।
- source_word: καὶ συντέμνων
  choice: और संक्षिप्त करके
  rationale: συντέμνω का मूल भाव छोटा या संक्षिप्त करना है। यह अनुवाद उसकी सजीव अस्पष्टता को बनाए रखता है, जबकि ‘शीघ्र पूरा करके’ केवल निहित गतिशीलता को प्रमुख बना देता।
- source_word: ποιήσει
  choice: पूरा करेगा
  rationale: λόγον के साथ ποιέω का अर्थ कही हुई बात को कार्यरूप देना या पूरा करना है। ‘पूरा करेगा’ स्वाभाविक हिन्दी है और केवल ‘करेगा’ से अधिक स्पष्ट है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह उद्धरण में परमेश्वर के लिए प्रयुक्त पद है; ‘प्रभु’ मानक, गरिमापूर्ण और संप्रदाय-निरपेक्ष हिन्दी रूप है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: रोमियों में उपलब्ध यूनानी पाठ का सामान्य और व्यापक अर्थ ‘पृथ्वी पर’ है। ‘देश में’ यशायाह के मूल ऐतिहासिक संदर्भ को दर्शा सकता है, पर यहाँ यूनानी अभिव्यक्ति व्यापक है।
theological_decisions:
- issue: यशायाह के उद्धरण में प्रभु के कार्य का स्वरूप
  choice: प्रभु अपने कहे हुए वचन को निर्णायक रूप से पूर्ण करता है, जबकि वचन स्वयं यह निर्दिष्ट नहीं करता कि यहाँ केवल न्याय या केवल उद्धार का कार्य अभिप्रेत है।
  alternative: प्रभु न्यायिक दण्डादेश को शीघ्र और निर्णायक रूप से लागू करेगा।
  rationale: शब्दावली में न्याय-संबंधी संकेत संभव हैं, पर यूनानी पाठ किसी विस्तृत धर्मसैद्धान्तिक योजना को स्पष्ट रूप से निर्धारित नहीं करता। इसलिए अनुवाद वचन के पूरा और संक्षिप्त किए जाने की तनावपूर्ण भाषा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वाक्य। ‘वचन’ और ‘पूर्ण’ सामान्य पाठक के लिए परिचित हैं। ‘संक्षिप्त करके’ कुछ असामान्य किंतु स्रोत के रूपक और वास्तविक अर्थगत अस्पष्टता को सुरक्षित रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
