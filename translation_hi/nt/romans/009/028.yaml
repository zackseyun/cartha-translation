- source_word: λόγον
  choice: अपने वचन को
  rationale: यहाँ λόγον, ποιήσει का कर्म है और उस बात को सूचित करता है जिसे प्रभु ने कहा और जिसे वह पूरा करेगा। ‘अपने’ हिन्दी में कर्ता के साथ सम्बन्ध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: γὰρ
