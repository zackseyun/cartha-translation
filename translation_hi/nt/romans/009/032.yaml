  text: διὰ τί; ὅτι οὐκ ἐκ πίστεως ἀλλ’ ὡς ἐξ ⸀ἔργων· ⸀προσέκοψαν τῷ λίθῳ τοῦ προσκόμματος,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/032.yaml
  text: Why? Because it was not from faith[a], but as if from works. They stumbled over the stone of stumbling[d][c][b],
translation:
  language: hi
  text: क्यों? क्योंकि वे उसके पीछे विश्वास के आधार पर नहीं, बल्कि मानो कामों के आधार पर लगे थे। वे ठोकर के पत्थर से ठोकर खा गए[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास से नहीं” या “विश्वास के आधार पर नहीं।” यूनानी में शाब्दिक रूप से “विश्वास से नहीं” है।
    reason: lexical_alternative
  - marker: b
    text: या, “बल्कि जैसे कि वे कामों के आधार पर लगे हों।” ‘मानो’ मूल पाठ की सूक्ष्मता को बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: यह यशायाह 8:14 की ओर संकेत है; अगली आयत में यशायाह 28:16 से भी तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: διὰ τί; ὅτι
  choice: क्यों? क्योंकि
  rationale: पौलुस के संक्षिप्त आलंकारिक प्रश्न और उसके कारणसूचक उत्तर को स्वाभाविक तथा सटीक हिंदी में बनाए रखता है।
- source_word: οὐκ ἐκ πίστεως
  choice: विश्वास से नहीं
  rationale: ἐκ के आधार/स्रोत-संबंधी भाव को हिंदी के ‘से’ द्वारा संक्षेप में व्यक्त करता है और πίστις के लिए स्थापित पौलुसी शब्द ‘विश्वास’ रखता है।
- source_word: ἀλλ’ ὡς ἐξ ἔργων
  choice: बल्कि मानो कामों से
  rationale: ὡς की ‘मानो’ वाली सूक्ष्मता को बचाता है; केवल ‘कामों से’ कहकर कथन को अधिक निश्चित नहीं बनाता। ‘काम’ ἔργον के पौलुसी प्रयोग के लिए सहज और संगत है।
- source_word: προσέκοψαν
  choice: वे ठोकर खा गए
  rationale: पत्थर से टकराकर लड़खड़ाने की ठोस उपमा को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ λίθῳ τοῦ προσκόμματος
  choice: ठोकर खिलानेवाले पत्थर से
  rationale: प्रसκόμμα के कारणात्मक भाव और προσέκοψαν के साथ शब्दगत संबंध को बनाए रखते हुए सुबोध हिंदी देता है।
theological_decisions:
- issue: πίστις का विश्वास/कामों के विरोध में अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ पौलुस धार्मिकता की खोज के आधार के रूप में विश्वास को कामों के सामने रखता है। ‘विश्वासयोग्यता’ चुनना संदर्भ को अनावश्यक रूप से किसी विशेष व्याख्या की ओर सीमित करेगा।
- issue: ὡς के कारण कथन की सूक्ष्मता
  choice: मानो कामों से
  alternative: कामों से; जैसे कि कामों के आधार पर
  rationale: मूल पाठ इस वाक्यांश को ὡς से संयमित करता है। ‘मानो’ उस वास्तविक तनाव को बनाए रखता है और इस्राएल के प्रयत्न को सपाट ढंग से परिभाषित नहीं करता।
- issue: λίθος τοῦ προσκόμματος की उपमा
  choice: ठोकर खिलानेवाला पत्थर
  alternative: ठेस का पत्थर; ठोकर का पत्थर
  rationale: यह चयन यशायाह-संबंधी ठोस उपमा और ठोकर लगने के कारण, दोनों को स्पष्ट रखता है; ‘ठेस’ भावनात्मक अपमान का अर्थ अधिक उभार सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘विश्वास’, ‘काम’ और ‘ठोकर’ जैसे परिचित शब्द पौलुसी विरोध और यशायाह की ठोस उपमा दोनों को बनाए रखते हैं।
