  yaml_path: translation/nt/romans/009/010.yaml
  text: And not only that[a], but Rebekah also had conceived by one man, our father Isaac.
translation:
  language: hi
  text: और केवल यही नहीं, बल्कि रिबका ने भी एक ही पुरुष, अर्थात् हमारे पिता इसहाक, से गर्भ धारण किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ καί
  choice: और केवल यही नहीं, बल्कि ... भी
  rationale: यह पौलुस की पूरक तर्क-रचना को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: Ῥεβέκκα
  choice: रिबका
  rationale: यह बाइबिलीय नाम का प्रचलित हिन्दी रूप है।
- source_word: ἐξ ἑνός
  choice: एक ही पुरुष से
  rationale: यूनानी में पुरुष निहित है; ‘एक ही’ रिबका की दोनों संतानों के एक पिता होने पर बल देता है।
- source_word: κοίτην ἔχουσα
  choice: गर्भवती हुई थीं
  rationale: शाब्दिक रूप से यह शय्या/यौन-संबंध से जुड़ा मुहावरा है, जो प्रसंग में गर्भधारण को व्यक्त करता है; यह हिन्दी में स्पष्ट और मर्यादित है।
- source_word: Ἰσαὰκ τοῦ πατρὸς ἡμῶν
  choice: हमारे पूर्वज इसहाक से
  rationale: ‘पूर्वज’ यहाँ वंशगत अर्थ को स्पष्ट करता है और ‘से’ को इसहाक के साथ जोड़कर यूनानी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: गर्भधारण और एक पिता वाले यूनानी मुहावरे को कितनी स्पष्टता से व्यक्त किया जाए
  choice: रिबका एक ही पुरुष, हमारे पूर्वज इसहाक, से गर्भवती हुई थीं
  alternative: रिबका ने हमारे पिता इसहाक से एक ही शय्या पाई थी
  rationale: चुना हुआ पाठ मुहावरे का प्रसंगगत अर्थ स्पष्ट करता है, पर संतानों या जुड़वाँ बच्चों को इस पद में अनावश्यक रूप से नहीं जोड़ता। यह समान पितृत्व पर पौलुस के बल को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘पूर्वज’ जैविक पिता की संभावित गलतफहमी से बचाता है; डैश इसहाक को ‘एक ही पुरुष’ के समानाधिकरण के रूप में स्पष्ट करते हैं।
