base_translation:
  language: en
  yaml_path: translation/nt/romans/009/007.yaml
  text: Nor is it the case that because they are Abraham’s offspring[a], they are all children. Rather[c][b], “In Isaac your offspring will be called.”
translation:
  language: hi
  text: और न इसलिए कि वे अब्राहम के वंशज[a] हैं, वे सभी संतान हैं; बल्कि, “इसहाक में तुम्हारा वंश कहलाएगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बीज।” यूनानी शब्द एकवचन है, पर सामूहिक अर्थ में संतान या वंशजों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: उत्पत्ति 21:12 की प्रतिध्वनि। “कहलाएगा” का अर्थ “माना जाएगा” या “ठहराया जाएगा” भी समझा जा सकता है।
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ὅτι
  choice: और न यह कि ... होने के कारण
  rationale: οὐδέ पिछले कथन से एक और निषेध जोड़ता है और ὅτι आधारसूचक उपवाक्य आरम्भ करता है; यह हिन्दी में तर्क-संबंध को स्पष्ट रखते हुए मूल के निकट है।
- source_word: σπέρμα Ἀβραάμ
  choice: अब्राहम के वंश
  rationale: σπέρμα यहाँ सामूहिक एकवचन में संतान या वंश को सूचित करता है। ‘वंश’ स्वाभाविक हिन्दी है और शारीरिक वंशक्रम का भाव बनाए रखता है।
- source_word: πάντες τέκνα
  choice: वे सब उसकी संतान हैं
  rationale: τέκνα लिंग-समावेशी है। ‘उसकी’ सन्दर्भ से अब्राहम को स्पष्ट करती है, पर वाचा-संबंधी अर्थ को अनावश्यक रूप से व्याख्यायित नहीं करती।
- source_word: ἀλλ’
  choice: बल्कि
  rationale: यह पहले कथन का तीखा सुधार और विरोध स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἐν Ἰσαὰκ
  choice: इसहाक में ही
  rationale: ‘में’ ἐν की औपचारिक संगति और उत्पत्ति 21:12 की प्रतिध्वनि बचाता है; ‘ही’ हिन्दी में उस चयनात्मक बल को व्यक्त करता है जो उद्धरण के विरोधी प्रसंग से उभरता है।
- source_word: κληθήσεταί σοι σπέρμα
  choice: तुम्हारा वंश कहलाएगा
  rationale: κληθήσεται का मूल ‘कहलाना’ है। ‘गिना जाएगा’ प्रसंगानुकूल सम्भव व्याख्या है, पर उसे मुख्य पाठ में रखने से अर्थ समय से पहले निश्चित हो जाता।
theological_decisions:
- issue: शारीरिक वंश और संतान होने का संबंध
  choice: अब्राहम के शारीरिक वंश में होना अपने-आप सबको उसकी संतान नहीं ठहराता
  alternative: पद में ही स्पष्ट रूप से ‘वाचा की संतान’ या पूर्वनियति की पूर्ण व्याख्या जोड़ना
  rationale: पौलुस शारीरिक वंश और प्रतिज्ञा से चिह्नित वंशरेखा में भेद करता है, पर इस पद में उस भेद की पूरी धर्मवैज्ञानिक प्रक्रिया नहीं बताता।
- issue: उत्पत्ति 21:12 के उद्धरण का बल
  choice: ‘इसहाक में ही तुम्हारा वंश कहलाएगा’
  alternative: ‘इसहाक के द्वारा तुम्हारा वंश गिना जाएगा’
  rationale: मुख्य पाठ ἐν और καλέω की शब्दावली को बनाए रखता है तथा ‘गिना/ठहराया जाएगा’ जैसी अधिक व्याख्यात्मक सम्भावना को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। उद्धरण में ‘इसहाक में’ मूल यूनानी और पुराने नियम की औपचारिक प्रतिध्वनि को सुरक्षित रखता है; ‘वंश’ पूरे पद में σπέρμα की शब्दगत कड़ी बनाए रखता है।
