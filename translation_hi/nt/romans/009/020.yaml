id: ROM.9.20
reference: Romans 9:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ὦ ἄνθρωπε, μενοῦνγε⸃ σὺ τίς εἶ ὁ ἀνταποκρινόμενος τῷ θεῷ; μὴ ἐρεῖ τὸ πλάσμα τῷ πλάσαντι Τί με ἐποίησας οὕτως;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/020.yaml
  text: But who are you[a], O man, to answer back to God? Will what is formed say to the one who formed it[d][c][b], “Why did you make me like this?”
translation:
  language: hi
  text: परन्तु हे मनुष्य, तू कौन है जो परमेश्वर को पलटकर उत्तर देता है? क्या गढ़ी हुई वस्तु अपने गढ़नेवाले से कहेगी, “तूने मुझे ऐसा क्यों बनाया?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तूने मुझे इस प्रकार क्यों बनाया?”
    reason: lexical_alternative
lexical_decisions:
- source_word: μενοῦνγε
  choice: परन्तु
  rationale: यह अव्यय पिछले कथन के प्रति प्रबल, कुछ सुधारात्मक विरोध प्रकट करता है। ‘परन्तु’ आधुनिक हिन्दी में इस मोड़ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ὦ ἄνθρωπε
  choice: हे मनुष्य
  rationale: प्रत्यक्ष एकवचन सम्बोधन और समस्त मानवता के प्रतिनिधि भाव—दोनों को बनाए रखता है; हिन्दी में यह गंभीर अलंकारिक सम्बोधन स्वाभाविक है।
- source_word: σὺ τίς εἶ
  choice: तू कौन है
  rationale: यह पहचान पूछने के बजाय मनुष्य के अधिकार को चुनौती देने वाला अलंकारिक प्रश्न है। ‘तू’ एकवचन की तीक्ष्णता और प्रत्यक्षता बनाए रखता है।
- source_word: ὁ ἀνταποκρινόμενος τῷ θεῷ
  choice: जो परमेश्वर को पलटकर उत्तर देता है
  rationale: ἀνταποκρίνομαι साधारण उत्तर देने के बजाय विरोधपूर्वक जवाब देने का भाव रखता है। ‘पलटकर उत्तर देना’ वही अनुचित प्रतिवाद व्यक्त करता है।
- source_word: μὴ ἐρεῖ
  choice: क्या ... कहेगी
  rationale: μή के साथ भविष्यकालीन प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिन्दी में ‘क्या ... कहेगी?’ प्रसंग और स्वर से यह अपेक्षा स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ πλάσμα
  choice: गढ़ी हुई वस्तु
  rationale: πλάσμα किसी गढ़ी या आकार दी गई चीज़ को बताता है। यह विकल्प कुम्हार-जैसी रूपक-छवि और रचना की निर्भरता बनाए रखता है।
- source_word: τῷ πλάσαντι
  choice: अपने गढ़नेवाले से
  rationale: यह कर्ता को उस व्यक्ति के रूप में चिन्हित करता है जिसने वस्तु को गढ़ा। ‘गढ़ी’ और ‘गढ़नेवाले’ की शब्दगत कड़ी मूल यूनानी के πλάσμα/πλάσαντι संबंध को सुरक्षित रखती है।
- source_word: Τί με ἐποίησας οὕτως;
  choice: तूने मुझे ऐसा क्यों बनाया?
  rationale: यह मूल वाक्य के अर्थ और क्रम को स्वाभाविक आधुनिक हिन्दी में निकटता से व्यक्त करता है; ‘ऐसा’ οὕτως की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: ἄνθρωπε का प्रतिनिधिक मानवीय अर्थ
  choice: ‘हे मनुष्य’ के रूप में अनुवाद
  alternative: ‘हे मानव’ या केवल ‘मनुष्य’
  rationale: एकवचन सम्बोधन किसी एक पुरुष तक सीमित नहीं, बल्कि परमेश्वर के सामने मनुष्य का प्रतिनिधित्व करता है। ‘मनुष्य’ हिन्दी में इस व्यापक अर्थ को स्पष्ट रखते हुए मूल सम्बोधन की गंभीरता बनाए रखता है।
- issue: पौलुस की फटकार और सृष्टिकर्ता-सृष्टि का असममित संबंध
  choice: ‘पलटकर उत्तर देता है’ और गढ़ी वस्तु/गढ़नेवाले का स्पष्ट विरोध
  alternative: अधिक तटस्थ ‘परमेश्वर को उत्तर देता है’
  rationale: मूल क्रिया विरोधपूर्ण प्रतिवाद को सूचित करती है। अनुवाद उस तीखेपन को बिना अतिरिक्त सिद्धान्त जोड़ने या प्रश्न में निहित तनाव को हल करने के बनाए रखता है।
- issue: μή वाले प्रश्न की अपेक्षित नकारात्मक प्रतिक्रिया
  choice: 'सकारात्मक रूप वाला अलंकारिक प्रश्न: ‘क्या ... कहेगी?’'
  alternative: ‘क्या गढ़ी हुई वस्तु ... नहीं कहेगी?’ या ‘निश्चय ही ... नहीं कहेगी’
  rationale: यूनानी प्रश्न नकारात्मक उत्तर की अपेक्षा करता है, पर हिन्दी में सकारात्मक ‘क्या’ प्रश्न भी वही अलंकारिक असंभवता स्पष्ट करता है। स्पष्ट नकार जोड़ने से हिन्दी में अर्थ उलझ सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हे मनुष्य’ और ‘तू’ मूल के प्रत्यक्ष एकवचन सम्बोधन तथा तीखी अलंकारिक चुनौती को बनाए रखते हैं। ‘गढ़ी हुई वस्तु/गढ़नेवाला’ मूल के जुड़े हुए शब्दों और कारीगर-रचना की छवि को सुरक्षित रखते हैं।
