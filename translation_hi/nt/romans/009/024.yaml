  yaml_path: translation/nt/romans/009/024.yaml
  text: even us[a], whom he also called[b], not only from the Jews but also from the Gentiles—
translation:
  language: hi
  text: जिन्हें उसने भी बुलाया, अर्थात् हमें—न केवल यहूदियों में से, बल्कि गैर-यहूदियों में से भी—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὓς ... ἡμᾶς
  choice: अर्थात् हम भी, जिन्हें
  rationale: संबंधवाचक सर्वनाम οὓς और उसके स्पष्टीकरण ἡμᾶς को स्वाभाविक हिन्दी में व्यक्त करता है तथा पिछले पद में बताए गए दया के पात्रों की पहचान ‘हम’ के रूप में बनाए रखता है।
- source_word: καὶ ἐκάλεσεν
  choice: उसने बुलाया
  rationale: καλέω के पौलुसी प्रयोग में ‘बुलाया’ प्रचलित, स्पष्ट और धर्मवैज्ञानिक अर्थ बनाए रखने वाला हिन्दी रूप है; यहाँ καί की योगात्मक शक्ति वाक्य के प्रवाह और ‘भी’ से व्यक्त होती है।
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: न केवल ... बल्कि ... भी
  rationale: यूनानी सहसंबंधी रचना का स्वाभाविक हिन्दी समतुल्य, जो दोनों समूहों के संतुलित विरोध और समावेश को सुरक्षित रखता है।
- source_word: ἐξ Ἰουδαίων
  choice: यहूदियों में से
  rationale: ἐξ यहाँ किसी समुदाय में से बुलाए जाने का स्रोत बताता है; ‘में से’ हिन्दी में इस सामूहिक स्रोत को स्पष्ट करता है।
- source_word: ἐξ ἐθνῶν
  choice: गैर-यहूदियों में से
  rationale: यहूदियों के साथ प्रत्यक्ष विरोध में ἔθνη गैर-यहूदी लोगों को सूचित करता है। ‘गैर-यहूदी’ आधुनिक हिन्दी पाठक के लिए ‘अन्यजाति’ से अधिक पारदर्शी है।
theological_decisions:
- issue: ἐθνῶν को यहूदी/गैर-यहूदी उद्धार-ऐतिहासिक विरोध में प्रस्तुत करना
  choice: गैर-यहूदियों
  alternative: जातियों / अन्यजातियों
  rationale: निकटवर्ती Ἰουδαίων के विरोध से आशय सामान्य राष्ट्रों के बजाय गैर-यहूदी लोग हैं। यह रूप किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़े बिना विरोध स्पष्ट करता है।
- issue: पिछले पद के दया के पात्रों से संबंध बनाए रखना
  choice: अर्थात् हम भी, जिन्हें उसने बुलाया
  alternative: जिन्हें उसने बुलाया, यानी हमें भी
  rationale: यह पद पिछले वाक्य पर व्याकरणिक रूप से निर्भर है। चुना हुआ रूप ‘हम’ की स्पष्ट पहचान और संबंधवाचक संरचना दोनों रखता है, पर बुलाहट या चुनाव से जुड़ी व्यापक धर्मवैज्ञानिक बहस को पाठ से आगे जाकर हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘अर्थात्’ यूनानी οὓς ... ἡμᾶς की स्पष्टीकरणात्मक पुनरुक्ति को सहज बनाता है। अंतिम पूर्णविराम की जगह प्रसंगानुसार आगे जारी रहने वाला डैश भी रखा जा सकता है, क्योंकि यूनानी पाठ अगले उद्धरण की ओर बढ़ता है।
