  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वाक्य-क्रम को हिन्दी के अनुरूप बनाया गया है, जबकि ‘मैं स्वयं,’ ‘शरीर के अनुसार,’ और मसीह से वियोग की धर्मवैचारिक तीव्रता सुरक्षित है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
