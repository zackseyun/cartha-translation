source:
  edition: SBLGNT
  text: ηὐχόμην γὰρ ⸂ἀνάθεμα εἶναι αὐτὸς ἐγὼ⸃ ἀπὸ τοῦ Χριστοῦ ὑπὲρ τῶν ἀδελφῶν μου τῶν συγγενῶν μου κατὰ σάρκα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/003.yaml
  text: For I could wish that I myself were accursed and cut off from the Messiah for the sake of my brothers[a], my kinsmen according to the flesh[c][b],
translation:
  language: hi
  text: क्योंकि मैं यहाँ तक इच्छा कर सकता था कि मैं स्वयं अपने भाइयों, अर्थात् अपने स्वजातीयों[a], के लिए शापित तथा मसीह से अलग हो जाऊँ[b]—जो शरीर के अनुसार मेरे संबंधी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शरीर के अनुसार” का अर्थ यहाँ शारीरिक वंश या जातीय संबंध से है, “पापी स्वभाव” से नहीं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति में शाप के अधीन होने और मसीह से अलग होने के विचार निकटता से जुड़े हैं। इसका अनुवाद “मसीह से अलग शापित” या “शाप के अधीन, मसीह से अलग” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ηὐχόμην
  choice: मैं यह तक चाह सकता था
  rationale: अपूर्णकालीन रूप यहाँ साधारण भूतकाल की इच्छा से अधिक एक अत्यंत प्रबल, कठिन और काल्पनिक इच्छा व्यक्त करता है। ‘यह तक’ प्रसंग में निहित तीव्रता को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ व्याख्यात्मक संबंध बनाए रखता है और पौलुस के तर्क-प्रवाह को स्पष्ट करता है।
- source_word: ἀνάθεμα
  choice: शापित
  rationale: यह शब्द ईश्वरीय शाप के अधीन होने या विनाश के लिए ठहराए जाने का गंभीर भाव रखता है; ‘शापित’ आधुनिक हिन्दी में स्पष्ट और धर्मवैचारिक भार वाला है।
- source_word: αὐτὸς ἐγὼ
  choice: मैं स्वयं
  rationale: दोहरी कर्ता-प्रबलता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἀπὸ τοῦ Χριστοῦ
  choice: मसीह से अलग
  rationale: ἀπό का वियोगार्थ स्पष्ट करता है। ‘मसीह’ Χριστός के पदवीगत अर्थ को बनाए रखता है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यहाँ हितार्थक और प्रतिनिधिक भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῶν ἀδελφῶν μου
  choice: अपने भाइयों
  rationale: यूनानी पुल्लिंग बहुवचन को औपचारिक रूप से रखता है; अगला पद स्पष्ट करता है कि अभिप्राय पौलुस के इस्राएली स्वजातीय समुदाय से है।
- source_word: τῶν συγγενῶν μου
  choice: मेरे स्वजातियों
  rationale: यहाँ केवल निकट पारिवारिक रिश्तेदार नहीं, बल्कि समान जातीय वंश वाले लोग अभिप्रेत हैं; ‘स्वजातियों’ इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: पौलुस की विशिष्ट अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ अर्थ शारीरिक वंश अथवा जातीय संबंध है, पापी स्वभाव नहीं।
theological_decisions:
- issue: क्या पौलुस वास्तविक प्रार्थना का वर्णन करता है या काल्पनिक इच्छा का
  choice: 'काल्पनिक अथवा संभाव्य इच्छा: ‘मैं यह तक चाह सकता था’'
  alternative: मैं इच्छा करता था / मैंने प्रार्थना की
  rationale: यह पौलुस की भावना की चरम तीव्रता बनाए रखता है, पर यह दावा नहीं करता कि उसने वास्तव में मसीह से अलग किए जाने की प्रार्थना की थी।
- issue: Χριστός को पदवी या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट / क्राइस्ट
  rationale: इस प्रसंग में पदवीगत अर्थ उपयुक्त है और हिन्दी बाइबलीय भाषा में ‘मसीह’ स्वाभाविक तथा स्पष्ट है।
- issue: ἀνάθεμα और ἀπὸ τοῦ Χριστοῦ का पारस्परिक संबंध
  choice: ‘शापित होकर मसीह से अलग’—शाप और वियोग को निकट संबद्ध परिणामों के रूप में
  alternative: मसीह की ओर से शापित / केवल शापित
  rationale: 'यूनानी वाक्यांश वास्तविक संरचनात्मक अस्पष्टता रखता है: ἀπό को वियोग के रूप में समझा जा सकता है, जबकि ‘मसीह से शापित’ भी व्याकरणतः प्रस्तावित हुआ है। मुख्य पाठ संदर्भानुकूल वियोगार्थ देता है और पादटिप्पणी विकल्प सुरक्षित रखती है।'
- issue: κατὰ σάρκα में σάρξ का अर्थ
  choice: शारीरिक अथवा जातीय वंश
  alternative: पापी स्वभाव
  rationale: यहाँ पौलुस अपने जातीय संबंधियों की पहचान करता है; नैतिक या पापमय स्वभाव का अर्थ संदर्भ में उपयुक्त नहीं है।
