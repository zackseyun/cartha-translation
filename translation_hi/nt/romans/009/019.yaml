    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐρεῖς
  choice: तुम कहोगे
  rationale: भविष्यकाल यहाँ पौलुस द्वारा पहले से अनुमानित आपत्ति का परिचय देता है; ‘कहोगे’ प्रश्नात्मक संदर्भ में भी यूनानी क्रिया के निकट है।
- source_word: μοι
  choice: मुझसे
  rationale: सम्प्रदान कारक के अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν … οὖν
  choice: तब … फिर
  rationale: दोनों अनुमानसूचक अव्ययों को हिन्दी के स्वाभाविक वाद-विवाद प्रवाह में अलग-अलग व्यक्त किया गया है।
- source_word: Τί οὖν ἔτι μέμφεται
  choice: फिर वह अब भी दोष क्यों लगाता है?
  rationale: τί यहाँ कारण पूछता है, इसलिए ‘क्यों’; ἔτι का अर्थ ‘अब भी’; μέμφεται के लिए ‘दोष लगाता है’ सामान्य और सटीक हिन्दी है।
- source_word: τῷ βουλήματι αὐτοῦ
  choice: उसकी ठहराई हुई इच्छा
  rationale: βούλημα में इच्छा के साथ सोचा-समझा या निश्चित अभिप्राय निहित हो सकता है। यह पदबंध उस अर्थ-सीमा को बनाए रखता है, जबकि ‘योजना’ जैसा अधिक विशिष्ट अर्थ नहीं थोपता।
- source_word: ἀνθέστηκεν
  choice: विरोध किसने किया है
  rationale: पूर्णकाल की वर्तमान प्रासंगिकता को ‘किया है’ बनाए रखता है और ἀνθίστημι का विरोध में खड़े होने का भाव स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: ईश्वरीय संप्रभुता के संदर्भ में βούλημα का अनुवाद
  choice: उसकी ठहराई हुई इच्छा
  alternative: उसका उद्देश्य / उसका अभिप्राय
  rationale: ‘ठहराई हुई इच्छा’ दृढ़ इरादे का भाव रखती है, पर यह तय नहीं करती कि पद का तात्पर्य किसी विशेष धर्मवैज्ञानिक व्यवस्था से है। इससे ईश्वर के दोष लगाने और उसकी इच्छा का विरोध न कर पाने के बीच पाठ में उपस्थित तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; पौलुस की अनुमानित आपत्ति को सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध भाषा में रखा गया है। सर्वनाम ‘वह/उसकी’ का संदर्भ पिछले प्रसंग से परमेश्वर है, पर मूल पद में नाम न होने के कारण उसे यहाँ जोड़कर स्पष्ट नहीं किया गया।
