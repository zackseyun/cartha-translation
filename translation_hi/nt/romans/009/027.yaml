source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ κράζει ὑπὲρ τοῦ Ἰσραήλ· Ἐὰν ᾖ ὁ ἀριθμὸς τῶν υἱῶν Ἰσραὴλ ὡς ἡ ἄμμος τῆς θαλάσσης, τὸ ⸀ὑπόλειμμα σωθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/027.yaml
  text: But Isaiah cries out concerning Israel[a], “Though the number of the sons of Israel is like the sand of the sea[c][b], only the remnant will be saved.”
translation:
  language: hi
  text: पर यशायाह इस्राएल के विषय में पुकारकर कहते हैं, “भले ही इस्राएल की संतान[a] की संख्या समुद्र की रेत के समान हो, फिर भी केवल बचा हुआ भाग ही उद्धार पाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; इसका अर्थ ‘इस्राएल की संतान’ या ‘इस्राएली’ भी हो सकता है। यह वाचा से जुड़ा एक पारंपरिक सामूहिक पदनाम है।
    reason: lexical_alternative
  - marker: b
    text: ‘यदि इस्राएल की संतान की संख्या समुद्र की रेत के समान हो, तो बचा हुआ भाग उद्धार पाएगा’ भी संभव है। ‘उद्धार पाएगा’ का अनुवाद ‘छुड़ाया जाएगा’ भी किया जा सकता है; यह कथन यशायाह की उस भविष्यवाणी की प्रतिध्वनि है जिसमें एक बचा हुआ भाग सुरक्षित रहता है।
    reason: alternative_reading_and_cross_reference
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध और तर्क की अगली कड़ी दिखाता है।
- source_word: κράζει
  choice: पुकारकर कहते हैं
  rationale: वर्तमान काल की सजीवता और जोरदार घोषणा का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑπὲρ τοῦ Ἰσραήλ
  choice: इस्राएल के विषय में
  rationale: भविष्यवाणी के उद्धरण में ὑπέρ का अर्थ यहाँ ‘के विषय में’ अधिक स्वाभाविक है, न कि ‘की ओर से’।
- source_word: Ἐὰν ᾖ
  choice: भले ही ... हो
  rationale: रूपतः शर्तसूचक पदबंध को प्रसंग में निहित रियायती भाव के साथ प्रस्तुत करता है; अधिक अक्षरशः ‘यदि ... हो’ फुटनोट में सुरक्षित है।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल की संतान
  rationale: पारंपरिक सामूहिक वाचा-संबंधी पदनाम को आधुनिक, सहज हिन्दी में व्यक्त करता है और केवल पुरुषों तक अर्थ सीमित नहीं करता।
- source_word: ὡς ἡ ἄμμος τῆς θαλάσσης
  choice: समुद्र की रेत के समान
  rationale: परिचित शास्त्रीय उपमा को गरिमापूर्ण और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ ὑπόλειμμα
  choice: बचा हुआ भाग
  rationale: एक बड़े समुदाय में से बचे हुए समूह का अर्थ स्पष्ट करता है; ‘शेष’ संभव है, पर सामान्य पाठक के लिए यह वाक्यांश अधिक पारदर्शी है।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: पौलुस के प्रसंग में क्रिया का उद्धार-संबंधी भार बनाए रखता है, जबकि भविष्यवाणी की पृष्ठभूमि में ‘छुड़ाया जाएगा’ की संभावना फुटनोट में दी गई है।
theological_decisions:
- issue: Ἐὰν ᾖ का शर्तसूचक या रियायती अर्थ
  choice: 'रियायती भाव: ‘भले ही ... हो’'
  alternative: 'अधिक अक्षरशः: ‘यदि ... हो’'
  rationale: उद्धरण में विशाल संख्या और केवल बचे हुए भाग के उद्धार के बीच विरोध प्रमुख है। मुख्य पाठ इसे स्वाभाविक हिन्दी में दिखाता है, जबकि मूल की वास्तविक शर्तसूचक बनावट फुटनोट में सुरक्षित है।
- issue: σωθήσεται का अर्थ
  choice: ‘उद्धार पाएगा’
  alternative: ‘छुड़ाया जाएगा’
  rationale: रोमियों 9–11 के प्रसंग में उद्धार का अर्थ प्रमुख है, पर यशायाह की भविष्यवाणी में ऐतिहासिक छुटकारे की प्रतिध्वनि को नकारा नहीं गया है।
- issue: τὸ ὑπόλειμμα की सामूहिक एकवचनता
  choice: ‘केवल बचा हुआ भाग ही’
  alternative: ‘केवल बचे हुए लोग ही’
  rationale: यूनानी पाठ की सामूहिक एकवचन संज्ञा को बनाए रखते हुए किसी विशिष्ट धर्मवैज्ञानिक परिभाषा को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट। ‘पुकारकर कहते हैं’ भविष्यवाणी की जोरदार घोषणा को स्वाभाविक बनाता है। मुख्य पाठ में रियायती अर्थ रखा गया है और शर्तसूचक अक्षरशः रूप तथा ‘छुड़ाया जाएगा’ का विकल्प फुटनोट में सुरक्षित किया गया है।
