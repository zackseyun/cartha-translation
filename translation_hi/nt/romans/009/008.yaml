  text: τοῦτ’ ἔστιν, οὐ τὰ τέκνα τῆς σαρκὸς ταῦτα τέκνα τοῦ θεοῦ, ἀλλὰ τὰ τέκνα τῆς ἐπαγγελίας λογίζεται εἰς σπέρμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/008.yaml
  text: That is[a], it is not the children of the flesh who are the children of God[b], but the children of the promise are counted as offspring.
translation:
  language: hi
  text: अर्थात्, शरीर की संतानें[a] परमेश्वर की संतानें नहीं हैं, बल्कि प्रतिज्ञा की संतानें ही वंशज[b] गिनी जाती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वाभाविक वंश से उत्पन्न संतानें।” यूनानी में शाब्दिक रूप से, “शरीर की संतानें।”
    reason: lexical_alternative
  - marker: b
    text: या, “बीज के रूप में गिनी जाती हैं।” यहाँ यूनानी स्पेर्मा का अर्थ वंशज या संतति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह पद पिछले कथन की व्याख्या प्रस्तुत करता है; ‘अर्थात्’ संक्षिप्त, स्वाभाविक और व्याख्यात्मक बल को स्पष्ट रखता है।
- source_word: τέκνα
  choice: संतान
  rationale: यह बहुवचन स्त्री-पुरुष दोनों को समेटता है और वंशगत संदर्भ में आधुनिक हिन्दी के ‘बच्चे’ की अपेक्षा ‘संतान’ अधिक उपयुक्त है।
- source_word: σάρξ / τὰ τέκνα τῆς σαρκὸς
  choice: शरीर / शरीर की संतान
  rationale: ‘शरीर’ पौलुस की स्पष्ट शब्दावली और प्रतिज्ञा के साथ उसके विरोध को सुरक्षित रखता है; प्रसंग में इसका आशय स्वाभाविक वंश से उत्पन्न संतान है।
- source_word: τέκνα τοῦ θεοῦ
  choice: परमेश्वर की संतान
  rationale: यह सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता और मूल का धार्मिक कथन बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἐπαγγελία / τὰ τέκνα τῆς ἐπαγγελίας
  choice: प्रतिज्ञा / प्रतिज्ञा की संतान
  rationale: यह अब्राहम और सारा से संबंधित परमेश्वर की प्रतिज्ञा का मानक बाइबलीय पद है और मूल की समानान्तर रचना बनाए रखता है।
- source_word: λογίζεται
  choice: मानी जाती हैं
  rationale: यह कर्मवाच्य भाव में ‘गिनी/स्वीकार की जाती हैं’ का सहज आधुनिक हिन्दी रूप है और वर्गीकरण के आशय को व्यक्त करता है।
- source_word: εἰς σπέρμα
  choice: वंश
  rationale: इस अब्राहमी संदर्भ में σπέρμα का अर्थ बीज नहीं, वंश अथवा वंशज है; ‘वंश मानी जाती हैं’ हिन्दी में अर्थ को स्पष्ट रखते हुए मूल के सामूहिक एकवचन को सुरक्षित रखता है।
theological_decisions:
- issue: शारीरिक वंश और प्रतिज्ञा से निर्धारित वंश के बीच पौलुस का विरोध
  choice: पद को इस प्रकार रखा गया है कि केवल स्वाभाविक वंश से उत्पन्न लोगों और प्रतिज्ञा की संतान माने जाने वालों के बीच मूल का विरोध स्पष्ट रहे।
  alternative: इसे केवल सामूहिक-ऐतिहासिक चुनाव या स्पष्ट व्यक्तिगत पूर्वनियति के रूप में खोलकर अनूदित करना।
  rationale: यूनानी पाठ विरोध को बताता है, पर व्यापक धार्मिक विवाद का समाधान इसी पद में नहीं करता; इसलिए अनुवाद किसी संप्रदायगत निष्कर्ष को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शरीर की संतान’ और ‘प्रतिज्ञा की संतान’ की समानान्तर संरचना पौलुस के वाक्य-विन्यास और धार्मिक तनाव को सुरक्षित रखती है।
