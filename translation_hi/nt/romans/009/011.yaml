  verdict: revise
  source_fidelity: The draft conveys the two coordinated preconditions (not yet born; having done nothing good or bad), the purpose clause, God’s purpose according to election, and μένῃ adequately. However, the repeated ‘...से पहले’ construction blurs the compact genitive-absolute construction and is less idiomatic than a finite clause expressing ‘not yet.’
  naturalness: ‘क्योंकि बच्चों के जन्म लेने से पहले, और उनके कुछ भी अच्छा या बुरा करने से पहले ही’ is awkward and repetitious in modern Hindi. ‘जब तक बच्चे पैदा भी नहीं हुए थे और उन्होंने अच्छा या बुरा कुछ भी नहीं किया था’ is natural, retains the temporal-negative force, and supports the unfinished sentence ending.
  terminology: ‘परमेश्वर’ and ‘चुनाव’ are suitable. Reordering to ‘परमेश्वर का चुनाव के अनुसार उद्देश्य’ follows the Greek relationship while reading more smoothly in Hindi. ‘बना रहे’ is an appropriate rendering of μένῃ.
  issues:
  - severity: medium
    issue: Awkward and repetitive temporal construction
    rationale: The source has one coordinated genitive-absolute condition governed by μήπω (‘not yet’). Repeating ‘से पहले’ is unnecessarily cumbersome, and ‘पहले ही’ can sound emphatic in a way not required by the Greek.
  - severity: low
    issue: Word order in the election phrase
    rationale: ‘उद्देश्य, जो चुनाव के अनुसार है’ is understandable, but ‘चुनाव के अनुसार उद्देश्य’ is more direct and avoids a relative clause not present in Greek.
  revised_text: क्योंकि जब तक बच्चे पैदा भी नहीं हुए थे और उन्होंने अच्छा या बुरा कुछ भी नहीं किया था—ताकि परमेश्वर का चुनाव के अनुसार उद्देश्य बना रहे[a]—
  revised_footnotes:
