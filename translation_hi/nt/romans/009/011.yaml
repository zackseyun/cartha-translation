  text: μήπω γὰρ γεννηθέντων μηδὲ πραξάντων τι ἀγαθὸν ἢ ⸀φαῦλον, ἵνα ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ μένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/011.yaml
  text: For before they had yet been born or had done anything good or bad[a], so that God’s purpose according to election might remain[c][b],
translation:
  language: hi
  text: क्योंकि जब तक बच्चे पैदा भी नहीं हुए थे और उन्होंने अच्छा या बुरा कुछ भी नहीं किया था—ताकि परमेश्वर का चुनाव के अनुसार उद्देश्य बना रहे[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्थिर रहे” अथवा “कायम रहे।” यूनानी क्रिया का अर्थ “बने रहना” या “जारी रहना” है और यहाँ उसमें स्थिर बने रहने की छटा भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μήπω γὰρ γεννηθέντων
  choice: क्योंकि बच्चों के जन्म लेने से पहले
  rationale: जनन से पूर्व की समय-संबंधी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है; γάρ का व्याख्यात्मक संबंध ‘क्योंकि’ से सुरक्षित है। संदर्भ से दोनों अजन्मे बच्चों का संकेत स्पष्ट किया गया है।
- source_word: μηδὲ πραξάντων τι ἀγαθὸν ἢ φαῦλον
  choice: और उनके कुछ भी अच्छा या बुरा करने से पहले ही
  rationale: समन्वित नकार और अच्छे-बुरे कर्मों के अभाव को सहज हिन्दी में रखता है। φαῦλον के लिए ‘बुरा’ ἀγαθόν का स्वाभाविक प्रतिपद है और अनावश्यक रूप से नैतिक तीव्रता नहीं बढ़ाता।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यवाचक बल को बनाए रखता है, बिना इसे केवल परिणाम या किसी विस्तृत धर्मवैज्ञानिक निष्कर्ष में बदलने के।
- source_word: ἡ κατ’ ἐκλογὴν πρόθεσις τοῦ θεοῦ
  choice: परमेश्वर का उद्देश्य, जो चुनाव के अनुसार है
  rationale: κατά + ἐκλογή की संरचना को स्पष्ट रखता है। ‘चुनाव’ पौलुस के इस संदर्भ में ἐκλογή का परिचित धर्मवैज्ञानिक पद है, जबकि वाक्यांश को ‘चुनने का उद्देश्य’ बनाकर उसकी व्याख्या तय नहीं की गई।
- source_word: μένῃ
  choice: बना रहे
  rationale: μένω के ‘बने रहना/कायम रहना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘स्थिर रहे’ भी संभव है।
theological_decisions:
- issue: पूर्वनियति-संबंधी संदर्भ में ἵνα का बल
  choice: उद्देश्यवाचक ‘ताकि’
  alternative: परिणामवाचक ‘जिससे कि’
  rationale: यूनानी रचना स्वाभाविक रूप से उद्देश्य सूचित करती है, पर अनुवाद व्यापक पूर्वनियति-विवाद का निर्णय नहीं करता।
- issue: ἐκλογή का अनुवाद
  choice: चुनाव
  alternative: चयन / चुनना
  rationale: ‘चुनाव’ मूल संज्ञा की धर्मवैज्ञानिक और संदर्भगत गंभीरता रखता है, फिर भी चुनाव के आधार या स्वरूप की अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: μένῃ की संदर्भगत छटा
  choice: बना रहे
  alternative: स्थिर रहे / कायम रहे
  rationale: मुख्य अर्थ निरंतर बने रहने का है; पादटिप्पणी संभावित ‘स्थिर रहने’ की छटा सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। पद 10–12 में फैले लंबे यूनानी वाक्य को ध्यान में रखते हुए अंत में डैश रखा गया है, क्योंकि विचार अगले पद में पूरा होता है।
