  to: क्योंकि जब तक बच्चे पैदा भी नहीं हुए थे और उन्होंने अच्छा या बुरा कुछ भी नहीं किया था—ताकि परमेश्वर का चुनाव के अनुसार उद्देश्य बना रहे[a]—
