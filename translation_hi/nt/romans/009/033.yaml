  text: καθὼς γέγραπται· Ἰδοὺ τίθημι ἐν Σιὼν λίθον προσκόμματος καὶ πέτραν σκανδάλου, ⸀καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ καταισχυνθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/033.yaml
  text: As it is written[a], “Look, I am laying in Zion a stone of stumbling and a rock of offense[d][c][b], and the one who believes in him will not be put to shame.”
translation:
  language: hi
  text: 'जैसा लिखा है: “देखो, मैं सिय्योन में ठोकर का पत्थर और ठेस पहुँचाने वाली चट्टान रखता हूँ; और जो उस पर विश्वास करता है, वह लज्जित नहीं किया जाएगा।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पौलुस यहाँ यशायाह 8:14 और 28:16 के शब्दों को मिलाकर उद्धृत करते हैं।
    reason: cross_reference
  - marker: b
    text: “लज्जित नहीं किया जाएगा” का अनुवाद “निराश नहीं होगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: पवित्रशास्त्र के उद्धरण का परिचित सूत्र; यूनानी पूर्णकाल के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाला बल बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τίθημι ἐν Σιὼν
  choice: मैं सिय्योन में ... रखता हूँ
  rationale: वर्तमान काल और स्थानवाचक ἐν दोनों सुरक्षित रहते हैं; पत्थर रखने की छवि भी स्पष्ट है।
- source_word: λίθον προσκόμματος
  choice: ठोकर का पत्थर
  rationale: सम्बन्धकारक रचना और ठोकर लगने की रूपकात्मक छवि को संक्षिप्त, प्रचलित हिन्दी में रखता है।
- source_word: πέτραν σκανδάλου
  choice: गिरने का कारण बनने वाली चट्टान
  rationale: स्कान्दालोन के फँसाने अथवा गिराने वाले कारण का अर्थ स्पष्ट करता है और पहले पदबंध से कुछ भेद बनाए रखता है।
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: जो उस पर विश्वास करता है
  rationale: संज्ञार्थक कृदन्त को सर्वसमावेशी और स्वाभाविक हिन्दी में व्यक्त करता है; ἐπί की ‘पर’ संबंधी छवि भी बनी रहती है।
- source_word: οὐ καταισχυνθήσεται
  choice: वह लज्जित नहीं किया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य और मान-लज्जा का भाव सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ἐπ’ αὐτῷ में सर्वनाम का सन्दर्भ
  choice: ‘उस पर’—व्यक्तिवाचक अर्थ को खुला रखते हुए पत्थर/चट्टान की छवि से जुड़ा हुआ
  alternative: ‘उसमें’ या वस्तुवाचक ‘उस पत्थर पर’
  rationale: यूनानी αὐτῷ पुल्लिंग एकवचन है और λίθος से व्याकरणिक रूप से मेल खाता है, जबकि पौलुस के निकटवर्ती सन्दर्भ में यह प्रतिमा मसीह पर लागू होती है। हिन्दी ‘उस पर’ दोनों स्तरों को बिना अनावश्यक रूप से सुलझाए बनाए रखता है।
- issue: σκανδάλου का अर्थ
  choice: गिरने का कारण बनने वाली
  alternative: ‘ठेस की’ या ‘अपमान की’
  rationale: यहाँ समानांतर पदबंध शारीरिक ठोकर/पतन की प्रतिमा को प्रमुख बनाता है; चयन नैतिक अपमान तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘सिय्योन’, ‘ठोकर का पत्थर’ और ‘लज्जित’ जैसे बाइबलीय रूप परिचित होने के कारण रखे गए हैं। मुख्य पाठ के सभी पादटिप्पणी-चिह्न वाक्य के अंत में क्रम से दिए गए हैं।
