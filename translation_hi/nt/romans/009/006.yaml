  text: Οὐχ οἷον δὲ ὅτι ἐκπέπτωκεν ὁ λόγος τοῦ θεοῦ. οὐ γὰρ πάντες οἱ ἐξ Ἰσραήλ, οὗτοι Ἰσραήλ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/006.yaml
  text: But it is not as though the word of God has failed[b][a]. For not all those from Israel are Israel.
translation:
  language: hi
  text: पर ऐसा नहीं कि परमेश्वर का वचन विफल हो गया है। क्योंकि जो इस्राएल से हैं[a], वे सभी इस्राएल नहीं हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘जो इस्राएल के वंशज हैं।’ यूनानी पदबंध उद्गम या वंश को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ दूसरी बार आया ‘इस्राएल’ पहली बार की अपेक्षा अधिक संकुचित अर्थ में प्रयुक्त हुआ है; पौलुस शारीरिक वंश और ‘इस्राएल’ के अधिक पूर्ण वाचा-संबंधी अर्थ के बीच भेद करता है।
    reason: cross_reference
lexical_decisions:
- source_word: Οὐχ οἷον δὲ ὅτι
  choice: पर ऐसा नहीं कि
  rationale: यह स्वाभाविक हिन्दी में उस संभावित निष्कर्ष का खंडन करता है जिसे पौलुस अब सुधारता है।
- source_word: ἐκπέπτωκεν
  choice: विफल हो गया है
  rationale: पूर्णकाल से पूर्व घटित बात की वर्तमान परिणामी स्थिति व्यक्त होती है; परमेश्वर के वचन के विषय में ‘विफल’ यूनानी मुहावरे का अर्थ सहज रूप से देता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: ‘वचन’ मूल की व्यापकता बनाए रखता है; ‘प्रतिज्ञा’ कहना संदर्भानुकूल होते हुए भी अधिक व्याख्यात्मक होता।
- source_word: οὐ γὰρ πάντες
  choice: क्योंकि ... सभी ... नहीं
  rationale: γάρ पिछले कथन का कारण अथवा स्पष्टीकरण देता है; हिन्दी की स्वाभाविक निषेध-रचना के लिए शब्दक्रम समायोजित किया गया है।
- source_word: οἱ ἐξ Ἰσραήλ
  choice: जो इस्राएल से हैं
  rationale: ἐξ के उद्गम अथवा वंश-संबंधी भाव को संक्षिप्त रूप में रखता है और अगली ‘इस्राएल’ से भेद को समय से पहले व्याख्यायित नहीं करता।
- source_word: οὗτοι Ἰσραήλ
  choice: वे ... इस्राएल ... हैं
  rationale: यूनानी के संक्षिप्त समतामूलक वाक्य को स्वाभाविक हिन्दी में पूरा करता है और दोनों प्रयोगों के बीच तीखा भेद बनाए रखता है।
theological_decisions:
- issue: ‘इस्राएल’ के दूसरे प्रयोग का अर्थ
  choice: मुख्य पाठ में वही शब्द रखकर उसके अपेक्षाकृत संकुचित वाच्यार्थ का संकेत पादटिप्पणी में देना
  alternative: इसे सीधे ‘चुने हुए इस्राएली’ या ‘परमेश्वर की सच्ची प्रजा’ अनूदित करना
  rationale: संदर्भ शारीरिक वंश और परमेश्वर के उद्देश्य में ‘इस्राएल’ के अधिक पूर्ण अर्थ के बीच भेद करता है, पर उसकी ठीक धर्मवैज्ञानिक सीमा इस पद में स्पष्ट नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप रखा गया है। ‘पर ऐसा नहीं कि’ तर्क के मोड़ को स्वाभाविक बनाता है; ‘विफल हो गया है’ मूल पूर्णकाल की परिणामी अवस्था को व्यक्त करता है। दोनों बार ‘इस्राएल’ ज्यों का त्यों रखकर मूल की जानबूझकर बनाई गई अर्थगत कसावट सुरक्षित रखी गई है।
