  text: परन्तु क्या हो यदि परमेश्वर ने, अपना क्रोध दिखाना और अपना सामर्थ्य प्रकट करना चाहते हुए, बड़े धैर्य के साथ क्रोध के पात्रों को सहा, जो विनाश के लिए तैयार किए गए थे[a]—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विनाश के लिए तैयार किए गए’ में निष्क्रिय रूप यह नहीं बताता कि उन्हें किसने तैयार किया। इस विषय में भिन्न व्याख्याएँ हैं कि यहाँ परमेश्वर के कार्य, मनुष्य के अपने कठोर हो जाने, या न्याय के लिए तैयार अवस्था का संकेत है।
    reason: alternative_reading
  - marker: b
    text: यहाँ आरम्भ हुआ शर्तसूचक वाक्य अगले पद में जारी रहता है; इसलिए पद 22 अपने आप में पूरा वाक्य नहीं है। ‘परन्तु क्या हो यदि’ का अनुवाद ‘परन्तु यदि’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: परन्तु यदि
  rationale: यूनानी में यह एक शर्तसूचक आलंकारिक वाक्य का आरम्भ है, जो अगले पद में जारी रहता है; इसलिए हिन्दी में भी इसे अधूरा और अगले पद से जुड़ा रखा गया है।
- source_word: θέλων
  choice: इच्छा रखते हुए
  rationale: वर्तमान कृदन्त परमेश्वर की इच्छा को मुख्य क्रिया से जोड़ता है, बिना उसे स्पष्टतः कारण या विरोधार्थक रियायत ठहराए।
- source_word: ἐνδείξασθαι τὴν ὀργὴν
  choice: अपना क्रोध दिखाने
  rationale: यह उद्देश्यपूर्ण प्रकटीकरण को व्यक्त करता है; ‘क्रोध’ यहाँ परमेश्वर के न्यायपूर्ण रोष के अर्थ को वहन करता है।
- source_word: γνωρίσαι τὸ δυνατὸν αὐτοῦ
  choice: अपना सामर्थ्य प्रकट करने
  rationale: सन्दर्भ में τὸ δυνατόν परमेश्वर की शक्ति या सामर्थ्य को सूचित करता है; ‘प्रकट करने’ causative अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ἤνεγκεν ἐν πολλῇ μακροθυμίᾳ
  choice: बड़े धैर्य के साथ ... सहा
  rationale: मुख्य क्रिया और रीति-सूचक पदबंध को आधुनिक, गरिमापूर्ण हिन्दी में निकटता से व्यक्त करता है।
- source_word: σκεύη ὀργῆς
  choice: क्रोध के पात्रों
  rationale: ‘पात्र’ पिछले कुम्हार-मिट्टी के रूपक को बनाए रखता है और सम्बन्धकारक पदबंध की अर्थगत सघनता को अनावश्यक रूप से नहीं खोलता।
- source_word: κατηρτισμένα εἰς ἀπώλειαν
  choice: जो विनाश के लिए तैयार किए गए थे
  rationale: पूर्ण निष्क्रिय कृदन्त तैयारी की वर्तमान दशा को बताता है, पर कर्ता को नहीं बताता; हिन्दी निष्क्रिय रचना भी कर्ता को अनिर्दिष्ट रखती है।
theological_decisions:
- issue: κατηρτισμένα में तैयारी करने वाले की पहचान
  choice: निष्क्रिय रूप ‘तैयार किए गए थे’ रखा गया और कर्ता नहीं बताया गया।
  alternative: परमेश्वर द्वारा विनाश के लिए तैयार; स्वयं विनाश के योग्य बने; विनाश के लिए तैयार अवस्था में
  rationale: यूनानी पाठ तैयारी करने वाले को स्पष्ट नहीं करता। अनुवाद इस धर्मवैज्ञानिक तनाव को किसी एक व्याख्या के पक्ष में हल नहीं करता।
- issue: εἰ से आरम्भ होने वाले अधूरे शर्तसूचक वाक्य का बल
  choice: ‘परन्तु यदि’ से आरम्भ करके पद के अन्त में डैश रखा गया, ताकि वाक्य अगले पद में जारी रहे।
  alternative: ‘परन्तु क्या हो यदि’; अथवा इसी पद में वाक्य को पूर्ण कथन बना देना
  rationale: मूल वाक्य-रचना पद 23 तक स्थगित रहती है। हिन्दी में उसे बनाए रखना इस पद को मूल से अधिक प्रत्यक्ष दावा बनने से रोकता है।
- issue: θέλων का मुख्य क्रिया से सम्बन्ध
  choice: ‘इच्छा रखते हुए’ के रूप में तटस्थ कृदन्तीय सम्बन्ध रखा गया।
  alternative: ‘क्योंकि वह चाहता था’; ‘यद्यपि वह चाहता था’
  rationale: कृदन्त को स्पष्ट कारणार्थक या रियायती बनाना मूल में निहित सम्भावित सम्बन्धों में से किसी एक को अनावश्यक रूप से निश्चित कर देगा।
