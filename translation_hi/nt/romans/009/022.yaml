  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध। ‘पात्र’ को तत्काल प्रसंग के कुम्हार-रूपक के कारण बनाए रखा गया है। पदान्त डैश वाक्य के अगले पद में जारी रहने का संकेत देता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
