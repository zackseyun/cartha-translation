id: ROM.9.17
reference: Romans 9:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγει γὰρ ἡ γραφὴ τῷ Φαραὼ ὅτι Εἰς αὐτὸ τοῦτο ἐξήγειρά σε ὅπως ἐνδείξωμαι ἐν σοὶ τὴν δύναμίν μου, καὶ ὅπως διαγγελῇ τὸ ὄνομά μου ἐν πάσῃ τῇ γῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/017.yaml
  text: 'For the Scripture says to Pharaoh[a], “For this very purpose I raised you up: that I might display my power in you[b], and that my name might be proclaimed in all the earth.”'
translation:
  language: hi
  text: क्योंकि पवित्रशास्त्र फ़िरौन से कहता है, “मैंने तुझे इसी उद्देश्य से खड़ा किया[a] कि मैं तुझमें अपनी सामर्थ्य दिखाऊँ और मेरा नाम[b] सारी पृथ्वी पर घोषित किया जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने तुझे बनाए रखा” अथवा “मैंने तुझे उठाया।” निर्गमन के उद्धरण के प्रसंग में यूनानी क्रिया का अर्थ किसी को खड़ा करना, सामने लाना या बनाए रखना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नाम” केवल पुकारे जाने वाले नाम का नहीं, बल्कि परमेश्वर की प्रकट की गई कीर्ति और प्रतिष्ठा का भी संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἡ γραφή
  choice: पवित्रशास्त्र
  rationale: निश्चित एकवचन को स्वाभाविक हिन्दी में रखा गया है और बोलने वाले के रूप में लिखित पवित्रशास्त्र के पौलुस के व्यक्तिकरण को सुरक्षित किया गया है।
- source_word: λέγει ... τῷ Φαραώ
  choice: फ़िरौन से कहता है
  rationale: वर्तमान काल और पवित्रशास्त्र के व्यक्तिकरण दोनों को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले तर्क के साथ व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: Εἰς αὐτὸ τοῦτο
  choice: इसी उद्देश्य से
  rationale: मूल के बलाघात और प्रयोजन, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξήγειρά σε
  choice: मैंने तुझे ... खड़ा किया
  rationale: क्रिया के व्यापक अर्थ—उठाना, सामने लाना, किसी भूमिका में खड़ा करना अथवा बनाए रखना—को जानबूझकर खुला रखता है; यह किसी एक धर्मवैज्ञानिक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐνδείξωμαι
  choice: मैं ... दिखाऊँ
  rationale: सार्वजनिक रूप से प्रकट या प्रदर्शित करने का भाव सरल और स्वाभाविक हिन्दी में देता है।
- source_word: ἐν σοὶ
  choice: तुझमें
  rationale: ἐν की निकट संरचना को बनाए रखता है और ‘तेरे द्वारा’ या ‘तुझ पर’ जैसी अधिक व्याख्यात्मक दिशा से बचता है।
- source_word: τὴν δύναμίν μου
  choice: अपनी सामर्थ्य
  rationale: δύναμις का स्पष्ट, गरिमापूर्ण और प्रसंगानुकूल हिन्दी रूप।
- source_word: καὶ ὅπως διαγγελῇ
  choice: और ... घोषित किया जाए
  rationale: सार्वजनिक घोषणा के अर्थ तथा यूनानी निष्क्रिय क्रियारूप को सुरक्षित रखता है।
- source_word: τὸ ὄνομά μου
  choice: मेरा नाम
  rationale: मूल रूपक को बनाए रखता है; यहाँ ‘नाम’ परमेश्वर की प्रकट की गई कीर्ति और प्रतिष्ठा को भी समेटता है।
- source_word: ἐν πάσῃ τῇ γῇ
  choice: सारी पृथ्वी पर
  rationale: सार्वभौमिक विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है; इसे केवल किसी स्थानीय ‘देश’ तक सीमित नहीं करता।
theological_decisions:
- issue: फ़िरौन और परमेश्वर की प्रभुता के संबंध में ἐξήγειρά σε का अर्थ
  choice: मैंने तुझे इसी उद्देश्य से खड़ा किया
  alternative: मैंने तुझे बनाए रखा / मैंने तुझे उठाया
  rationale: यह अनुवाद परमेश्वर द्वारा फ़िरौन को इस भूमिका के लिए सामने लाने या बनाए रखने के व्यापक भाव को खुला रखता है। इससे परमेश्वर की प्रभुता और मानवीय उत्तरदायित्व के बीच पाठ में उपस्थित तनाव को किसी संकीर्ण सिद्धान्त से हल नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट। उद्धरण के भीतर ‘तू’ का प्रयोग फ़िरौन को किए गए प्रत्यक्ष एकवचन संबोधन को स्वाभाविक रूप से सुरक्षित करता है।
