id: ROM.9.9
reference: Romans 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπαγγελίας γὰρ ὁ λόγος οὗτος· Κατὰ τὸν καιρὸν τοῦτον ἐλεύσομαι καὶ ἔσται τῇ Σάρρᾳ υἱός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/009.yaml
  text: 'For this is the word of promise: “At this time I will come[a], and Sarah will have a son.”'
translation:
  language: hi
  text: 'क्योंकि यह प्रतिज्ञा का वचन है: “इसी समय मैं आऊँगा[a], और सारा को एक पुत्र होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं लौटूँगा।” यहाँ यूनानी पाठ में “मैं आऊँगा” है, हालाँकि कुछ अनुवाद उत्पत्ति की पृष्ठभूमि के अनुसार “लौटूँगा” लिखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञा का
  rationale: यह संबंधकारक λόγος को विशेषित करता है और पौलुस के संदर्भ में परमेश्वर की प्रतिज्ञा पर बल बनाए रखता है।
- source_word: λόγος
  choice: वचन
  rationale: यह उद्धृत कथन को दर्शाता है; ‘वचन’ हिंदी बाइबलीय शैली में स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है और तर्क-संबंध स्पष्ट रखता है।
- source_word: Κατὰ τὸν καιρὸν τοῦτον
  choice: इसी समय
  rationale: यह निर्धारित समय की ओर संकेत करता है; ‘इसी समय’ मूल वाक्यांश की विशिष्टता को सहज हिंदी में व्यक्त करता है।
- source_word: ἐλεύσομαι
  choice: मैं आऊँगा
  rationale: यूनानी क्रिया का सीधा अर्थ ‘आना’ है; उत्पत्ति की पृष्ठभूमि के कारण संभव ‘लौटूँगा’ को पादटिप्पणी में रखा गया है।
- source_word: ἔσται τῇ Σάρρᾳ υἱός
  choice: सारा के एक पुत्र होगा
  rationale: यूनानी स्वामित्व-सूचक रचना को स्वाभाविक हिंदी में व्यक्त करता है और ‘पुत्र’ की विशिष्टता बनाए रखता है।
- source_word: Σάρρᾳ
  choice: सारा
  rationale: नाम का प्रचलित मानक हिंदी रूप।
- source_word: υἱός
  choice: पुत्र
  rationale: मूल शब्द विशेष रूप से पुत्र को दर्शाता है, जो अब्राहम-सारा की प्रतिज्ञा के संदर्भ में महत्त्वपूर्ण है।
theological_decisions:
- issue: अब्राहम से संबंधित प्रतिज्ञा का उद्धरण और परमेश्वर की प्रत्यक्ष भूमिका
  choice: प्रतिज्ञा को परमेश्वर के सीधे कथन के रूप में प्रस्तुत करते हुए ‘मैं आऊँगा’ रखा गया।
  alternative: उत्पत्ति की कुछ अनुवाद-परंपराओं के अनुरूप ‘मैं लौटूँगा’।
  rationale: पौलुस का तर्क इसहाक के जन्म के आधार के रूप में परमेश्वर की प्रतिज्ञा पर निर्भर है; रोमियों के उपलब्ध यूनानी पाठ को प्राथमिकता देते हुए व्याख्यात्मक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण बाइबलीय शैली; ‘प्रतिज्ञा का वचन’ मूल संबंध को निकटता से रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है।
