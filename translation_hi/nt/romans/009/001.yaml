  text: Ἀλήθειαν λέγω ἐν Χριστῷ, οὐ ψεύδομαι, συμμαρτυρούσης μοι τῆς συνειδήσεώς μου ἐν πνεύματι ἁγίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/001.yaml
  text: I am telling the truth in Messiah[a]; I am not lying, as my conscience bears witness with me in the Holy Spirit[c][b],
translation:
  language: hi
  text: मैं मसीह में सत्य कहता हूँ, झूठ नहीं बोलता; मेरा विवेक भी पवित्र आत्मा[a] में मेरे साथ गवाही देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, ‘एक पवित्र आत्मा में।’ फिर भी पौलुस के प्रयोग में यहाँ ‘पवित्र आत्मा’ को दिव्य आत्मा के रूप में समझना सबसे स्वाभाविक है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀλήθειαν λέγω
  choice: मैं ... सच कहता हूँ
  rationale: यह यूनानी मुहावरा सत्य बोलने की गंभीर और प्रत्यक्ष घोषणा है; हिंदी में यह स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός अभिषिक्त जन की उपाधि है; ‘मसीह’ उसके उपाधि-संबंधी अर्थ को हिंदी बाइबिलीय प्रयोग में बनाए रखता है।
- source_word: οὐ ψεύδομαι
  choice: झूठ नहीं बोलता
  rationale: वर्तमान काल के इस स्पष्ट निषेध को सहज आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: συμμαρτυρούσης μοι
  choice: मेरे साथ गवाही देता है
  rationale: συν- के सह-साक्ष्य भाव को बनाए रखते हुए संबंधवाचक कृदंत को हिंदी के स्वाभाविक समन्वित वाक्य में व्यक्त किया गया है।
- source_word: τῆς συνειδήσεώς μου
  choice: मेरा विवेक
  rationale: यह συνείδησις का सामान्य पौलुसी अर्थ है और हिंदी में नैतिक आत्म-साक्ष्य को स्पष्ट करता है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: पौलुस के प्रयोग में इसे दिव्य पवित्र आत्मा का उल्लेख समझना सबसे स्वाभाविक है; ‘में’ यूनानी ἐν को बिना अनावश्यक रूप से साधनवाचक बनाए सुरक्षित रखता है।
theological_decisions:
- issue: πνεύματι ἁγίῳ का संदर्भ
  choice: दिव्य पवित्र आत्मा
  alternative: एक पवित्र आत्मा अथवा पौलुस की पवित्र की गई मानवीय आत्मा
  rationale: पौलुसी भाषा और इस गंभीर सत्य-दावे के संदर्भ में दिव्य पवित्र आत्मा का अर्थ सर्वाधिक स्वाभाविक है; फिर भी अनुवाद ἐν को ‘में’ रखकर उसके संबंध की सूक्ष्मता को खुला छोड़ता है।
- issue: Χριστός का उपाधि-संबंधी स्वरूप
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ ‘मसीह’ अभिषिक्त जन की उपाधि का अर्थ बनाए रखता है और इसे केवल निजी नाम बनाकर सपाट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; गंभीर किंतु सहज शैली। मूल के दोहरे सत्य-दावे और विवेक की सह-गवाही को डैशों द्वारा स्पष्ट किया गया है। पद के अंत में पूर्णविराम लगाया गया है, यद्यपि यूनानी वाक्य आगे के विचार से जुड़ता है।
