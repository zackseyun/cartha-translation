source:
  edition: SBLGNT
  text: ἢ οὐκ ἔχει ἐξουσίαν ὁ κεραμεὺς τοῦ πηλοῦ ἐκ τοῦ αὐτοῦ φυράματος ποιῆσαι ὃ μὲν εἰς τιμὴν σκεῦος ὃ δὲ εἰς ἀτιμίαν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/021.yaml
  text: Or does the potter not have authority over the clay[d][c][b][a], to make from the same lump one vessel for honor and another for dishonor?
translation:
  language: hi
  text: या क्या कुम्हार को मिट्टी पर यह अधिकार नहीं है कि वह उसी गूँधी हुई मिट्टी से एक बर्तन आदर के लिए और दूसरा अनादर के लिए बनाए?[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या कुम्हार को मिट्टी पर हक नहीं है?”
    reason: lexical_alternative
  - marker: b
    text: “उसी गूँधी हुई मिट्टी” का अनुवाद “उसी लोथ” या “उसी मिश्रित मिट्टी” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “एक बर्तन आदरपूर्ण उपयोग के लिए और दूसरा साधारण उपयोग के लिए।”
    reason: alternative_reading
  - marker: d
    text: यह चित्र पुराने नियम के कुम्हार और मिट्टी वाले प्रसंगों की प्रतिध्वनि है; देखें यशायाह 29:16; 45:9; यिर्मयाह 18:1–6।
    reason: cross_reference
lexical_decisions:
- source_word: ἢ
  choice: या क्या
  rationale: यह पौलुस के तर्क में अगला आलंकारिक प्रश्न प्रस्तुत करता है; ‘या क्या’ हिन्दी में स्वाभाविक रूप से प्रवाह बनाए रखता है।
- source_word: οὐκ ἔχει ἐξουσίαν
  choice: अधिकार नहीं
  rationale: ἐξουσία यहाँ केवल सामर्थ्य नहीं, बल्कि वैध अधिकार या स्वामित्वगत अधिकारिता व्यक्त करता है।
- source_word: ὁ κεραμεὺς
  choice: कुम्हार
  rationale: मिट्टी को आकार देने वाले कारीगर के लिए सटीक और प्रचलित हिन्दी शब्द है तथा भविष्यद्वक्ताओं के कुम्हार-मिट्टी रूपक को बनाए रखता है।
- source_word: τοῦ πηλοῦ
  choice: मिट्टी पर
  rationale: ἐξουσία के साथ संबंध को स्वाभाविक हिन्दी में ‘पर अधिकार’ से व्यक्त किया गया है।
- source_word: ἐκ τοῦ αὐτοῦ φυράματος
  choice: उसी गूँधे हुए ढेले से
  rationale: φύραμα किसी मिलाई या गूँधी हुई मात्रा/लोथ को दर्शाता है; ‘गूँधा हुआ ढेला’ मिट्टी के संदर्भ को स्पष्ट रखते हुए मूल बिंब को संप्रेषित करता है।
- source_word: ποιῆσαι
  choice: बनाए
  rationale: साधारण ‘बनाना’ यूनानी क्रिया का सीधा और स्वाभाविक समतुल्य है।
- source_word: ὃ μὲν ... ὃ δὲ
  choice: एक ... और दूसरा
  rationale: दो विपरीत परिणामों का सहसंबंध स्पष्ट और सहज हिन्दी में व्यक्त होता है।
- source_word: εἰς τιμὴν
  choice: आदर के लिए
  rationale: τιμή के आदर-सम्मान संबंधी अर्थ को बनाए रखता है और उपयोग का कोई अतिरिक्त उद्देश्य आरोपित नहीं करता।
- source_word: σκεῦος
  choice: बरतन
  rationale: कुम्हार और मिट्टी के रूपक में यह आधुनिक हिन्दी का स्वाभाविक शब्द है; ‘पात्र’ की अपेक्षा अधिक सामान्यतः समझ में आता है।
- source_word: εἰς ἀτιμίαν
  choice: अनादर के लिए
  rationale: ἀτιμία को τιμή के सीधे विलोम के रूप में रखता है और ‘साधारण उपयोग’ जैसी संदर्भगत व्याख्या को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: ἐξουσία को ऐसे प्रसंग में कैसे व्यक्त किया जाए जो परमेश्वर की प्रभुता और मानवीय उत्तरदायित्व की बहसों में प्रयुक्त होता है
  choice: अधिकार
  alternative: सामर्थ्य; हक
  rationale: ‘अधिकार’ वैध अधिकारिता को व्यक्त करता है, पर नियतिवाद या स्वतंत्र इच्छा के बारे में कोई विकसित धर्मवैज्ञानिक निष्कर्ष पाठ में नहीं जोड़ता।
- issue: εἰς τιμὴν / εἰς ἀτιμίαν को कार्यगत उपयोग के रूप में स्पष्ट किया जाए या आदर-अनादर की भाषा बनाए रखी जाए
  choice: आदर के लिए ... अनादर के लिए
  alternative: आदरपूर्ण उपयोग के लिए ... साधारण उपयोग के लिए
  rationale: मूल यूनानी सीधे आदर-अनादर की श्रेणियाँ देता है। यह चयन रूपक को घरेलू उपयोग तक सीमित किए बिना उसकी वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘बरतन’ रूपक को ठोस और सहज रखता है; ‘आदर/अनादर’ मूल की संक्षिप्त सम्मान-अपमान शब्दावली तथा उसकी खुली व्याख्यात्मक सीमा को सुरक्षित रखते हैं।
