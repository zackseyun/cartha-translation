source:
  edition: SBLGNT
  text: ὧν οἱ πατέρες, καὶ ἐξ ὧν ὁ χριστὸς τὸ κατὰ σάρκα, ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/005.yaml
  text: theirs are the fathers[a], and from them, according to the flesh, is the Messiah, who is over all, God blessed forever[b]. Amen.
translation:
  language: hi
  text: पितृपुरुष उनके हैं, और देह के अनुसार मसीह भी उन्हीं में से हैं[a]—जो सबके ऊपर हैं, परमेश्वर हैं और युगानुयुग धन्य हैं[b]। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मानवीय वंश की दृष्टि से। मूल में शाब्दिक रूप से, ‘देह के अनुसार।’
    reason: lexical_alternative
  - marker: b
    text: 'अन्तिम खण्ड को अलग स्तुति मानकर इसका अनुवाद यह भी हो सकता है: ‘परमेश्वर, जो सबके ऊपर हैं, युगानुयुग धन्य हों। आमीन।’ इस स्थिति में ये शब्द मसीह का वर्णन नहीं करते।'
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ πατέρες
  choice: पितृपुरुष
  rationale: यह इस्राएल के श्रद्धेय पूर्वजों को सूचित करता है। ‘पितृपुरुष’ पौलुस की वाचा और इतिहास से जुड़ी भाषा को बनाए रखता है तथा केवल सामान्य ‘पूर्वजों’ से अधिक विशिष्ट है।
- source_word: ἐξ ὧν
  choice: उन्हीं में से
  rationale: सम्बन्धवाचक पद पौलुस के इस्राएली स्वजातियों की ओर लौटता है; यह हिन्दी में स्वाभाविक रूप से वंशगत उद्गम व्यक्त करता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ Χριστός इस्राएल की प्रतिज्ञाओं से जुड़े पदनाम के रूप में प्रयुक्त है, इसलिए प्रचलित उपाधि ‘मसीह’ उपयुक्त है।
- source_word: τὸ κατὰ σάρκα
  choice: देह के अनुसार
  rationale: यह स्रोत की अभिव्यक्ति को निकटता से बनाए रखता है और यहाँ सांसारिक/मानवीय वंश की दृष्टि को सूचित करता है, पापी स्वभाव को नहीं। इसका अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὁ ὢν ἐπὶ πάντων
  choice: जो सबके ऊपर हैं
  rationale: संज्ञीकृत कृदन्त को मसीह के निरन्तर वर्णन के रूप में स्वाभाविक हिन्दी में प्रस्तुत करता है और ‘सबके ऊपर’ की व्यापकता बनाए रखता है।
- source_word: θεὸς εὐλογητὸς
  choice: परमेश्वर, ... धन्य
  rationale: ग्रीक पदक्रम में ‘परमेश्वर’ और ‘धन्य’ को मसीह के लिए समानाधिकरणात्मक/विधेयात्मक वर्णन के रूप में पढ़ा गया है; हिन्दी विराम-चिह्न मूल की गहन संक्षिप्तता बनाए रखते हैं।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह स्तुतिपरक पद का प्रतिष्ठित, संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἀμήν
  choice: आमीन
  rationale: प्रचलित धार्मिक लिप्यन्तरण रखा गया है।
theological_decisions:
- issue: क्या ‘ὁ ὢν ἐπὶ πάντων, θεὸς εὐλογητὸς εἰς τοὺς αἰῶνας’ मसीह का वर्णन करता है या परमेश्वर के लिए अलग स्तुति आरम्भ करता है?
  choice: 'मुख्य पाठ में इसे मसीह के वर्णन की निरन्तरता माना गया है: ‘जो सबके ऊपर हैं, परमेश्वर, युगानुयुग धन्य।’'
  alternative: 'इसे अलग स्तुति के रूप में पढ़ना: ‘परमेश्वर, जो सबके ऊपर हैं, युगानुयुग धन्य हों।’'
  rationale: ग्रीक में संज्ञीकृत कृदन्त ὁ ὢν का ὁ χριστός से समानाधिकरण में होना वाक्य के प्रवाह की स्वाभाविक समझ है। फिर भी प्राचीन हस्तलिपियों में आधुनिक विराम-चिह्न न होने और इस पाठ के दीर्घकालीन विवाद को देखते हुए अलग स्तुति वाले पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सुबोध शैली रखी गई है। ‘पितृपुरुष’, ‘मसीह’, ‘युगानुयुग’ और ‘आमीन’ जैसे प्रचलित बाइबलीय शब्द प्रसंग की वाचा-संबंधी और स्तुतिपरक ध्वनि बनाए रखते हैं। मुख्य पाठ की संक्षिप्त समानाधिकरणात्मक रचना जानबूझकर मूल ग्रीक की सघनता को प्रतिबिम्बित करती है।
