id: ROM.9.30
reference: Romans 9:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὅτι ἔθνη τὰ μὴ διώκοντα δικαιοσύνην κατέλαβεν δικαιοσύνην, δικαιοσύνην δὲ τὴν ἐκ πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/030.yaml
  text: What then shall we say? That the Gentiles, who were not pursuing righteousness, attained righteousness—but the righteousness that is from faith.
translation:
  language: hi
  text: तो हम क्या कहें? यही कि गैर-यहूदियों[a] ने, जो धार्मिकता[b] की खोज नहीं कर रहे थे, धार्मिकता प्राप्त कर ली—वह धार्मिकता जो विश्वास[c] से है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जातियों” या “राष्ट्रों”; यहाँ आशय गैर-यहूदी लोगों से है।
    reason: lexical_alternative
  - marker: b
    text: “धार्मिकता” के लिए “न्याय” या “न्यायपरायणता” भी सम्भव है। यूनानी शब्द यहाँ और इसके दोहराव में नैतिक या न्यायिक सहीपन तथा वाचा के अनुरूप न्याय की अर्थ-सीमा रख सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात “विश्वास से आने वाली धार्मिकता”; कम सम्भावित अर्थ, “विश्वासयोग्यता से आने वाली धार्मिकता।”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: तो हम क्या कहें?
  rationale: यह पौलुस का प्रचलित विचार-संक्रमण सूत्र है। यह यूनानी के विचारात्मक भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἔθνη
  choice: गैर-यहूदियों
  rationale: इस संदर्भ में यह शब्द इस्राएल के विपरीत गैर-यहूदी लोगों को सूचित करता है। ‘गैर-यहूदी’ सामान्य पाठक के लिए ‘अन्यजाति’ से अधिक स्पष्ट है।
- source_word: τὰ μὴ διώκοντα
  choice: जो ... के पीछे नहीं लगे थे
  rationale: वर्तमान कृदंत उनकी निरंतर या सामान्य प्रवृत्ति बताता है। यह अभिव्यक्ति हिन्दी में स्वाभाविक रहते हुए ‘पीछा करने/लक्ष्य की ओर बढ़ने’ का भाव रखती है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह पौलुस के व्यापक नैतिक, न्यायिक और परमेश्वर के सामने उचित स्थिति से जुड़े अर्थों को किसी एक सिद्धान्त तक सीमित किए बिना व्यक्त करने वाला प्रचलित हिन्दी पद है।
- source_word: κατέλαβεν
  choice: प्राप्त कर ली
  rationale: संदर्भ में क्रिया का अर्थ उस वस्तु तक पहुँच जाना या उसे पा लेना है जिसका वे पीछा नहीं कर रहे थे।
- source_word: δικαιοσύνην δὲ τὴν ἐκ πίστεως
  choice: वह धार्मिकता जो विश्वास से है
  rationale: दोहराया गया संज्ञा-पद पहले कथन में धार्मिकता के प्रकार को स्पष्ट करता है। ‘से है’ ἐκ के स्रोत-संबंध को बिना अतिरिक्त धर्मवैज्ञानिक विस्तार के सुरक्षित रखता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस रचना में πίστις का सबसे संभावित अर्थ विश्वास या भरोसा है; फिर भी ‘विश्वासयोग्यता’ की कम संभावित सम्भावना टिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: पौलुस के तर्क में δικαιοσύνη का अर्थ
  choice: मुख्य पाठ में ‘धार्मिकता’, इसे केवल आरोपित धार्मिकता या केवल वाचा-सदस्यता तक सीमित किए बिना
  alternative: न्याय; परमेश्वर के सामने सही स्थिति; वाचा के अनुरूप स्थिति
  rationale: पद स्वयं धर्मवैज्ञानिक प्रक्रिया को पूरी तरह नहीं खोलता। व्यापक शब्दावली पौलुस के कथन की अर्थ-समृद्धि और तनाव को बनाए रखती है।
- issue: ἐκ πίστεως का आशय
  choice: ‘विश्वास से’
  alternative: विश्वास के द्वारा; विश्वास के आधार पर; विश्वासयोग्यता से
  rationale: यह अनुवाद ἐκ के स्रोत-संबंध को निकटता से रखता है और ‘केवल विश्वास से’ जैसी बाद की, पाठ में अनुपस्थित व्याख्यात्मक वृद्धि नहीं करता।
- issue: δέ का संबंध
  choice: विशिष्टता को स्पष्ट करने के लिए डैश के बाद ‘वह धार्मिकता’
  alternative: ‘परन्तु वह धार्मिकता’
  rationale: यहाँ दोहराया हुआ संज्ञा-पद प्राप्त धार्मिकता के प्रकार को निर्दिष्ट करता है। हिन्दी में डैश इस स्पष्टीकरण को अधिक स्वाभाविक ढंग से दिखाता है, यद्यपि δέ में हल्का विरोधात्मक रंग सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य-पाठक-अनुकूल रूप अपनाया गया है। ‘गैर-यहूदी’ को अपेक्षाकृत पारदर्शी शब्द के रूप में चुना गया; ‘धार्मिकता’ और ‘विश्वास’ जैसे स्थापित धर्मग्रन्थीय पदों को उनके व्यापक अर्थ सहित रखा गया है।
