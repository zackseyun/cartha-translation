lexical_decisions:
- source_word: οὐκ ἐξ ἔργων
  choice: यह कर्मों से नहीं
  rationale: ἐκ संबंध का स्रोत या आधार व्यक्त करता है। ‘कर्मों से नहीं’ पौलुस के संक्षिप्त विरोध को बनाए रखता है और हिन्दी में स्वाभाविक है; ‘कर्मों के आधार पर नहीं’ अधिक स्पष्ट, पर कुछ विस्तारपूर्ण है।
- source_word: ἀλλ’ ἐκ τοῦ καλοῦντος
  choice: बल्कि बुलानेवाले से था
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदंत τοῦ καλοῦντος परमेश्वर की ओर संकेत करता है। ‘बुलानेवाले’ वर्तमान पहलू और यूनानी की संक्षिप्तता को बनाए रखता है; ‘था’ पिछले प्रसंग की क्रिया से इस अधूरे वाक्यांश का स्वाभाविक हिन्दी संबंध बनाता है।
- source_word: ἐρρέθη αὐτῇ
  choice: उससे कहा गया
  rationale: यह अओरिस्ट कर्मवाच्य का संक्षिप्त और स्वाभाविक हिन्दी रूप है तथा यूनानी में न दिए गए वक्ता को नहीं जोड़ता।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के लिए उद्धरण-चिह्न
  rationale: यहाँ ὅτι प्रत्यक्ष कथन आरम्भ करता है; हिन्दी में उद्धरण-चिह्न इसका अर्थ स्वाभाविक ढंग से देते हैं।
- source_word: Ὁ μείζων
  choice: बड़ा
  rationale: मूल शब्द ‘बड़ा/अधिक बड़ा’ है और उत्पत्ति 25:23 के याकूब-एसाव संदर्भ में बड़े भाई को सूचित करता है। ‘बड़ा’ शाब्दिक व्यापकता और पारिवारिक अर्थ दोनों बनाए रखता है।
- source_word: δουλεύσει
  choice: सेवा करेगा
  rationale: δουλεύω दास की तरह सेवा या अधीनता का भाव रख सकता है। इस उद्धरण में ‘सेवा करेगा’ संबंधगत अधीनता बताता है, पर अनावश्यक रूप से दासत्व को अधिक विशिष्ट नहीं बनाता।
- source_word: τῷ ἐλάσσονι
  choice: छोटे की
  rationale: ἐλάσσων का मूल भाव ‘छोटा/कमतर’ है; संदर्भ में यह छोटे भाई की ओर संकेत करता है। ‘छोटे की सेवा’ हिन्दी में स्वाभाविक है और तुलना की कुछ व्यापकता भी बचाती है।
theological_decisions:
- issue: ‘कर्मों से नहीं, बल्कि बुलानेवाले से’ के विरोध को निःशर्त चुनाव के किसी पूर्ण सिद्धान्त के रूप में विस्तार देना या नहीं
  choice: मूल का संक्षिप्त विरोध रखा गया और कोई सिद्धान्तगत विस्तार नहीं जोड़ा गया।
  alternative: ‘कर्मों के कारण नहीं, बल्कि बुलानेवाले परमेश्वर के कारण’
  rationale: पद कर्मों और बुलानेवाले के बीच स्पष्ट विरोध करता है, पर व्यापक धर्मवैज्ञानिक निष्कर्ष संदर्भ से निकलते हैं। अनुवाद में ‘परमेश्वर’ या ‘कारण’ जोड़ने से मूल की संक्षिप्तता और कुछ व्याकरणिक खुलापन घट जाता।
- issue: μείζων और ἐλάσσων को आयु के रूप में स्पष्ट करना या तुलनात्मक व्यापकता बनाए रखना
  choice: मुख्य पाठ में ‘बड़ा’ और ‘छोटा’ रखा गया।
  alternative: ‘बड़ा भाई छोटे भाई की सेवा करेगा’ अथवा ‘श्रेष्ठ कनिष्ठ की सेवा करेगा’
  rationale: याकूब और एसाव के प्रसंग में आयु प्रमुख है, फिर भी यूनानी शब्द तुलनात्मक रूप से व्यापक हैं और उत्पत्ति का कथन व्यक्तियों के साथ जातियों से भी संबंधित है। ‘बड़ा/छोटा’ हिन्दी में दोनों स्तरों को पर्याप्त रूप से खुला रखता है।
