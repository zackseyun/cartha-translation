  yaml_path: translation/nt/romans/009/013.yaml
  text: 'as it is written: “Jacob I loved[b][a], but Esau I hated.”'
translation:
  language: hi
  text: 'जैसा लिखा है: “मैंने याकूब से प्रेम किया, पर एसाव से घृणा की।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “अस्वीकार किया” या “कम प्रेम किया।” कुछ लोग यहाँ “घृणा की” को भावनात्मक वैर के बजाय वाचा के संबंध में अस्वीकार करने या तुलनात्मक रूप से कम पसंद करने के अर्थ में समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह उद्धरण मलाकी 1:2–3 से है।
    reason: cross_reference
lexical_decisions:
- source_word: καθὼς
  choice: जैसा
  rationale: यह पवित्रशास्त्र के उद्धरण का परिचय देने वाला स्वाभाविक और संक्षिप्त तुलनात्मक पद है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य यहाँ प्रचलित उद्धरण-सूत्र है; ‘लिखा है’ वर्तमान में प्रामाणिक बने हुए लेख का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰακώβ
  choice: याकूब
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: ἠγάπησα
  choice: मैंने ... से प्रेम किया
  rationale: ἀγαπάω का सीधा अर्थ ‘प्रेम करना’ है; यूनानी अओरिस्ट को यहाँ सामान्य हिन्दी भूतकाल से व्यक्त किया गया है।
- source_word: δὲ
  choice: पर
  rationale: यह याकूब और एसाव के प्रति कथनों के बीच स्पष्ट विरोध दर्शाता है।
- source_word: Ἠσαῦ
  choice: एसाव
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: ἐμίσησα
  choice: मैंने ... से घृणा की
  rationale: μισέω का सीधा और प्रबल अर्थ ‘घृणा करना’ है। मुख्य पाठ में इसकी तीव्रता बनाए रखी गई है; संभावित वाचाई अथवा तुलनात्मक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय चुनाव और सामी तुलनात्मक प्रयोग की बहस के कारण ‘घृणा की’ को नरम किया जाए या नहीं
  choice: मुख्य पाठ में सीधा अनुवाद ‘घृणा की’ रखा गया
  alternative: ‘अस्वीकार किया’ अथवा ‘कम प्रेम किया’
  rationale: यूनानी उद्धरण में सामान्य और प्रबल क्रिया μισέω है। इसे नरम करना किसी एक व्याख्या से तनाव को पहले ही सुलझा देता; इसलिए मूल अभिव्यक्ति मुख्य पाठ में और संभावित अर्थ पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘घृणा की’ की मूल तीव्रता सुरक्षित रखी गई है। पादटिप्पणी-चिह्न उद्धरण के बाद क्रमशः [a][b] दिए गए हैं।
