source:
  edition: SBLGNT
  text: καὶ καθὼς προείρηκεν Ἠσαΐας· Εἰ μὴ κύριος Σαβαὼθ ἐγκατέλιπεν ἡμῖν σπέρμα, ὡς Σόδομα ἂν ἐγενήθημεν καὶ ὡς Γόμορρα ἂν ὡμοιώθημεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/029.yaml
  text: And just as Isaiah said before[a], “If the Lord of Hosts had not left us offspring[c][b], we would have become like Sodom and been made like Gomorrah.”
translation:
  language: hi
  text: और जैसा यशायाह ने पहले ही कहा था, “यदि सेनाओं का प्रभु[a] हमारे लिए सन्तान[b] न छोड़ी होती, तो हम सदोम के समान हो गए होते और गमोरा के समान बना दिए गए होते।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रभु सबाओत।” यूनानी Σαβαώθ इब्रानी ईश्वरीय उपाधि का लिप्यंतरण है, जिसका अनुवाद प्रायः “सेनाओं का” किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “बीज।” यहाँ इसका आशय जीवित बची सन्तति या वंशजों से है।
    reason: lexical_alternative
  - marker: c
    text: यशायाह 1:9 से उद्धरण।
    reason: cross_reference
lexical_decisions:
- source_word: καὶ καθὼς
  choice: और जैसा
  rationale: यह पिछले कथन के साथ अनुरूपता दिखाता है और हिन्दी में उद्धरण का स्वाभाविक परिचय देता है।
- source_word: προείρηκεν
  choice: पहले ही कहा था
  rationale: क्रिया किसी पहले कही गई बात को वर्तमान विमर्श में उद्धृत करती है। हिन्दी का पूर्ण भूतकाल प्रसंग में स्वाभाविक है और इसे अनावश्यक रूप से भविष्यवाणी नहीं बनाता।
- source_word: κύριος Σαβαὼθ
  choice: सेनाओं के प्रभु
  rationale: Σαβαώθ इब्रानी उपाधि का यूनानी लिप्यंतरण है। अर्थ का अनुवाद करते हुए यह परमेश्वर की सेनाओं के अधिपति की उपाधि को स्पष्ट और परिचित हिन्दी में रखता है।
- source_word: ἐγκατέλιπεν
  choice: छोड़ा होता
  rationale: मूल क्रिया के ‘पीछे छोड़ना/बचा रहने देना’ अर्थ को बनाए रखता है; शर्तवाचक वाक्य में ‘न छोड़ा होता’ प्रतिकल्पित स्थिति व्यक्त करता है।
- source_word: σπέρμα
  choice: वंश
  rationale: शाब्दिक अर्थ ‘बीज’ है, पर यहाँ जीवित बची सन्तति या वंश अभिप्रेत है। ‘वंश’ सामूहिक अर्थ को स्वाभाविक हिन्दी में रखता है और मुख्य पाठ में ‘बचा हुआ भाग’ जैसी व्याख्यात्मक धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- source_word: ὡς Σόδομα ἂν ἐγενήθημεν
  choice: हम सदोम के समान हो गए होते
  rationale: ἄν के साथ क्रिया अतीत की प्रतिकल्पित परिणति बताती है; ‘हो गए होते’ γίνομαι के बनने के भाव को सुरक्षित रखता है।
- source_word: ὡς Γόμορρα ἂν ὡμοιώθημεν
  choice: गमोरा के समान बना दिए गए होते
  rationale: निष्क्रिय ὁμοιόω को ‘बना दिए गए होते’ के रूप में रखकर इसे पहले प्रयुक्त γίνομαι से अलग बनाए रखा गया है।
theological_decisions:
- issue: पुराने नियम के उद्धरण में κύριος Σαβαώθ का अनुवाद
  choice: सेनाओं के प्रभु
  alternative: प्रभु सबाओत / सेनाओं के यहोवा
  rationale: पौलुस के यूनानी पाठ में κύριος और इब्रानी उपाधि का लिप्यंतरण है। अर्थानुवाद उपाधि का आशय स्पष्ट करता है, जबकि मुख्य पाठ में इब्रानी परमेश्वर-नाम जोड़ना यूनानी रूप से आगे चला जाता। लिप्यंतरण को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: σπέρμα को ‘बचा हुआ भाग’ कहना या उसके शाब्दिक वंशगत अर्थ को रखना
  choice: वंश
  alternative: बीज / सन्तति / बचा हुआ भाग
  rationale: व्यापक प्रसंग में बचे हुए लोगों की धारणा है, पर यहाँ वास्तविक शब्द σπέρμα है। ‘वंश’ उस धारणा को नकारे बिना मूल की वंशगत छवि और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर यूनानी क्रियाओं का भेद ‘हो गए होते’ और ‘बना दिए गए होते’ से बनाए रखा गया है।
