translation:
  language: hi
  text: कि मुझे बहुत दुःख है और मेरे हृदय में निरन्तर पीड़ा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: कि
  rationale: यह पिछले पद में पौलुस के गंभीर कथन की विषय-वस्तु प्रस्तुत करता है; हिन्दी में ‘कि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λύπη
  choice: शोक
  rationale: यह गहरी उदासी या दुःख को दर्शाता है। ‘शोक’ गरिमापूर्ण और सहज है तथा ὀδύνη के लिए चुने गए ‘पीड़ा’ से भेद बनाए रखता है।
- source_word: μοί ἐστιν
  choice: मुझे ... है
  rationale: εἰμί के साथ सम्प्रदानवाचक सर्वनाम अनुभव या अवस्था को व्यक्त करता है; हिन्दी में ‘मुझे ... है’ स्वाभाविक समानार्थी रचना है।
- source_word: μεγάλη
  choice: बड़ा
  rationale: λύπη की तीव्रता बताने वाला सीधा विशेषण है; ‘बड़ा शोक’ यूनानी अभिव्यक्ति का बल बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: दोनों भावात्मक अभिव्यक्तियों को सरल समुच्चय के रूप में जोड़ता है।
- source_word: ἀδιάλειπτος
  choice: निरन्तर
  rationale: लगातार बने रहने की अवधि को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὀδύνη
  choice: पीड़ा
  rationale: यह तीव्र आन्तरिक कष्ट को दर्शाता है; ‘पीड़ा’ सीधे अर्थ को व्यक्त करती है और अनावश्यक व्याख्या नहीं जोड़ती।
- source_word: τῇ καρδίᾳ μου
  choice: मेरे हृदय में
  rationale: यूनानी का शाब्दिक रूप ‘मेरे हृदय को’ है, पर यहाँ हिन्दी में स्थानवाचक ‘मेरे हृदय में’ आन्तरिक भाव-जगत का स्वाभाविक बाइबलीय मुहावरा है।
theological_decisions: []
