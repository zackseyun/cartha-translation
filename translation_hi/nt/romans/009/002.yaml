review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly renders ὅτι as a content clause and retains the two coordinated expressions: μεγάλη λύπη and ἀδιάλειπτος ὀδύνη τῇ καρδίᾳ μου. However, “बड़ा शोक” is not idiomatic modern Hindi for μεγάλη λύπη and can suggest bereavement-specific mourning more readily than the broader sorrow intended here.'
  naturalness: “मुझे बहुत दुःख है” is substantially more natural than “मुझे बड़ा शोक है.” “मेरे हृदय में निरन्तर पीड़ा है” is concise, idiomatic, and represents the Greek heart idiom without adding an unnecessary verbal aspect.
  terminology: “दुःख” and “पीड़ा” preserve the source’s paired but distinct terms without forcing a technical distinction. “हृदय” appropriately retains the biblical concrete idiom.
  issues:
  - severity: medium
    issue: “बड़ा शोक” is awkward and overly bereavement-oriented in modern standard Hindi.
    rationale: μεγάλη λύπη denotes profound sorrow broadly, not necessarily mourning for a death. “बहुत दुःख” is idiomatic and preserves the scope and intensity.
  - severity: low
    issue: “पीड़ा रहती है” adds a finite durative formulation not expressed as such in the Greek.
    rationale: The adjective ἀδιάλειπτος already conveys uninterrupted continuance. “निरन्तर पीड़ा है” is closer in structure and fully natural Hindi.
  revised_text: कि मुझे बहुत दुःख है और मेरे हृदय में निरन्तर पीड़ा है।
