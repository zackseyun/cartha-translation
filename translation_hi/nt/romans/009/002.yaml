  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘शोक’ और ‘पीड़ा’ मूल के दो निकट किंतु अलग भावात्मक शब्दों को बनाए रखते हैं; ‘हृदय’ के ठोस बाइबलीय रूपक को व्याख्यात्मक शब्द से नहीं बदला गया।
