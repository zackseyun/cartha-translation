id: ROM.9.26
reference: Romans 9:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔσται ἐν τῷ τόπῳ οὗ ἐρρέθη ⸀αὐτοῖς· Οὐ λαός μου ὑμεῖς, ἐκεῖ κληθήσονται υἱοὶ θεοῦ ζῶντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/026.yaml
  text: And in the very place where it was said to them[b][a], ‘You are not my people,’ there they will be called sons of the living God.
translation:
  language: hi
  text: और ऐसा होगा कि जिस स्थान पर उनसे कहा गया था, “तुम मेरी प्रजा नहीं हो,”[a] उसी स्थान पर वे जीवित परमेश्वर के पुत्र[b] कहलाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: होशे 1:10 (यूनानी पुराने नियम में 2:1) का उद्धरण/संकेत; यहाँ वाचा की पुनर्स्थापना की भाषा प्रयुक्त है।
    reason: cross_reference
  - marker: b
    text: या “जीवित परमेश्वर की सन्तान।” यूनानी में शाब्दिक रूप से “पुत्र” है; मुख्य पाठ में इसे पुत्रत्व और उत्तराधिकार के अर्थ-संकेत को बनाए रखने के लिए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἔσται
  choice: और ऐसा होगा कि
  rationale: यह अभिव्यक्ति सरल संयोजक और भविष्यकाल—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखती है।
- source_word: ἐν τῷ τόπῳ οὗ
  choice: जिस स्थान पर
  rationale: स्थानवाचक सम्बन्ध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐρρέθη αὐτοῖς
  choice: उनसे कहा गया था
  rationale: यूनानी के कर्मवाच्य को सुरक्षित रखता है और कथन के अनकहे कर्ता को नहीं जोड़ता।
- source_word: Οὐ λαός μου ὑμεῖς
  choice: तुम मेरी प्रजा नहीं हो
  rationale: होशे से आई वाचा-संबंधी अभिव्यक्ति ‘मेरी प्रजा’ को सीधे और गरिमापूर्ण रूप में बनाए रखता है।
- source_word: ἐκεῖ
  choice: उसी स्थान पर
  rationale: पहले उल्लिखित स्थान पर होने वाले उलटाव की बलपूर्ण समानता को हिन्दी में स्पष्ट करता है।
- source_word: κληθήσονται
  choice: कहलाएँगे
  rationale: भविष्यत् कर्मवाच्य को संक्षिप्त और स्वाभाविक रूप में रखता है तथा निहित दिव्य कर्ता को स्पष्ट करके नहीं जोड़ता।
- source_word: υἱοὶ
  choice: पुत्र
  rationale: यूनानी के स्पष्ट पुल्लिंग बहुवचन और उससे जुड़े पुत्रत्व तथा उत्तराधिकार के संभावित भाव को सुरक्षित रखता है।
- source_word: θεοῦ ζῶντος
  choice: जीवित परमेश्वर के
  rationale: यह स्थापित, स्वाभाविक बाइबलीय अभिव्यक्ति है और जीवित परमेश्वर पर दिए गए बल को बनाए रखती है।
theological_decisions:
- issue: υἱοὶ का प्रतिनिधिक बहुवचन
  choice: पुत्र
  alternative: सन्तान
  rationale: मूल में υἱοὶ है, τέκνα नहीं। ‘पुत्र’ मूल शब्द और पुत्रत्व/उत्तराधिकार के संभावित अर्थ-संकेत को सुरक्षित रखता है; फिर भी संदर्भ में स्त्री और पुरुष दोनों सम्मिलित हो सकते हैं, इसलिए समावेशी अर्थ को पादटिप्पणी में बताया गया है।
- issue: λαός μου में वाचा-संबंधी पहचान
  choice: मेरी प्रजा
  alternative: मेरे अपने लोग
  rationale: ‘मेरी प्रजा’ पुराना नियम की वाचा-संबंधी सूत्रात्मक भाषा और होशे की पुनर्स्थापना की पृष्ठभूमि को अधिक स्पष्टता से बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और ऐसा होगा कि’ भविष्यकालीन उद्धरण-भूमिका को स्वाभाविक बनाता है; ‘उसी स्थान पर’ मूल के स्थानगत उलटाव पर बल देता है।
