  yaml_path: translation/nt/romans/009/018.yaml
  text: So then[a], he shows mercy to whom he wills[b], and he hardens whom he wills.
translation:
  language: hi
  text: इसलिए वह जिस पर दया करना चाहता है, उस पर दया करता है[a]; और जिसे कठोर बनाना चाहता है, उसे कठोर बनाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पर वह चाहता है, उस पर दया करता है।”
    reason: lexical_alternative
  - marker: b
    text: “कठोर बनाता है” का अनुवाद “हठी बनाता है” या “अड़ियल बना देता है” भी हो सकता है। यूनानी में सक्रिय क्रिया है; इसलिए इसे केवल “कठोर होने देता है” के अर्थ में नरम नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले तर्क से निकले निष्कर्ष को दर्शाता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὃν θέλει
  choice: जिस पर चाहता है / जिसे चाहता है
  rationale: θέλει में इच्छा या संकल्प का सीधा भाव सुरक्षित रखा गया है। हिन्दी कारक-रचना के अनुसार दया के साथ ‘जिस पर’ और कठोर करने के साथ ‘जिसे’ प्रयोग हुआ है।
- source_word: ἐλεεῖ
  choice: दया करता है
  rationale: यह क्रिया दया दिखाने या दयापूर्ण व्यवहार करने को व्यक्त करती है; ‘दया करता है’ सहज, प्रतिष्ठित और अर्थ की दृष्टि से सटीक है।
- source_word: ὃν δὲ θέλει
  choice: और जिसे चाहता है
  rationale: δέ दोनों समानांतर कथनों के बीच विरोध प्रस्तुत करता है। हिन्दी में ‘और’ के साथ विपरीत क्रिया स्वयं इस विरोध को स्पष्ट करती है और यूनानी वाक्य की समांतरता बनाए रखती है।
- source_word: σκληρύνει
  choice: कठोर कर देता है
  rationale: यूनानी में सक्रिय क्रिया है, जिसका अर्थ कठोर या हठी बनाना है। यह अनुवाद कर्ता की सक्रिय भूमिका तथा फ़िरौन-वृत्तांत की शास्त्रीय प्रतिध्वनि को बिना नरम किए सुरक्षित रखता है।
theological_decisions:
- issue: θέλει में परमेश्वर की इच्छा
  choice: ‘चाहता है’ द्वारा परमेश्वर की इच्छा का सीधा कथन बनाए रखा गया है।
  alternative: इसे केवल अनुमति देने के अर्थ में व्याख्यात्मक रूप से कहना।
  rationale: यूनानी दोनों उपवाक्यों में सीधे θέλει कहता है। अनुवाद पूर्वनियति और मानवीय उत्तरदायित्व के विवाद को हल किए बिना मूल पाठ का तनाव बनाए रखता है।
- issue: σκληρύνει में कर्तृत्व
  choice: सक्रिय रूप ‘कठोर कर देता है’।
  alternative: ‘कठोर होने देता है’ या ‘कठोरता के हवाले कर देता है’।
  rationale: मूल पाठ की सक्रिय क्रिया इस कार्य को सीधे कर्ता से जोड़ती है; इसे केवल अनुमति में बदलना स्रोत से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। दोनों उपवाक्यों की समांतर रचना सुरक्षित है। ‘कठोर कर देता है’ सक्रिय कर्तृत्व और मूल पाठ के धर्मवैचारिक तनाव को बनाए रखता है।
