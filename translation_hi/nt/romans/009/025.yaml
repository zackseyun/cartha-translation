source:
  edition: SBLGNT
  text: ὡς καὶ ἐν τῷ Ὡσηὲ λέγει· Καλέσω τὸν οὐ λαόν μου λαόν μου καὶ τὴν οὐκ ἠγαπημένην ἠγαπημένην·
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/025.yaml
  text: as he also says in Hosea[a], “I will call those who were not my people, ‘my people,’ and her who was not loved[c][b], ‘loved.’”
translation:
  language: hi
  text: जैसा वह होशे की पुस्तक में भी कहता है,[b] “जो मेरी प्रजा नहीं थी, उसे मैं ‘अपनी प्रजा’ कहूँगा,[a] और जिसे प्रेम नहीं किया गया था, उसे ‘प्रिय’[c] कहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जो मेरी प्रजा नहीं थी, उसे ‘मेरी प्रजा’ कहूँगा।” यूनानी में यह एकवचन है, पर ‘प्रजा’ का अर्थ सामूहिक है।'
    reason: lexical_alternative
  - marker: b
    text: यह होशे 2:23 से लिया गया उद्धरण है; कुछ परंपराओं में अध्याय-पद की संख्या अलग है। पौलुस होशे में पुनर्स्थापना की भाषा को परमेश्वर द्वारा अपने लिए एक प्रजा बुलाने पर लागू करता है।
    reason: cross_reference
  - marker: c
    text: या अधिक शाब्दिक रूप से, “जिससे प्रेम नहीं किया गया था, उसे ‘प्रेम की हुई’ कहूँगा।” यूनानी में दोनों रूप स्त्रीलिंग एकवचन हैं और एक ही ‘प्रेम’ शब्द-परिवार से हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς καὶ
  choice: जैसा ... भी
  rationale: यह पद पहले कही गई बात के समर्थन में एक शास्त्रीय उद्धरण प्रस्तुत करता है; यह रूप तुलना और अतिरिक्त पुष्टि—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ Ὡσηὲ
  choice: होशे की पुस्तक में
  rationale: यह यूनानी शास्त्र-उद्धरण सूत्र होशे के ग्रंथ की ओर संकेत करता है। हिन्दी में केवल ‘होशे में’ की अपेक्षा ‘होशे की पुस्तक में’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: λέγει
  choice: वह ... कहता है
  rationale: यूनानी क्रिया एकवचन और व्यक्तिवाचक है; संदर्भ में बोलनेवाला परमेश्वर है। ‘वह कहता है’ इस रूप को बनाए रखता है, जबकि ‘लिखा है’ मूल की व्यक्तिगत वाणी को धुंधला कर देता।
- source_word: Καλέσω
  choice: मैं ... कहूँगा
  rationale: यहाँ καλέω नाम देने अथवा किसी पहचान से पुकारने के अर्थ में है। उद्धरणों के साथ ‘कहूँगा’ हिन्दी में स्वाभाविक है और भावी काल को सुरक्षित रखता है।
- source_word: τὸν οὐ λαόν μου
  choice: जो मेरी प्रजा नहीं थी
  rationale: यूनानी रूप व्याकरणतः एकवचन है, पर λαός सामूहिक ‘प्रजा/लोग’ का बोध देता है। हिन्दी में ‘प्रजा’ स्वयं सामूहिक और व्याकरणतः एकवचन है, इसलिए दोनों पहलू बने रहते हैं।
- source_word: λαόν μου
  choice: अपनी प्रजा
  rationale: यह वाचा-संबंधी अभिव्यक्ति है। ‘अपनी प्रजा’ उद्धरण के भीतर बोलनेवाले परमेश्वर के साथ स्वाभाविक हिन्दी है और ‘मेरी प्रजा’ का आशय ठीक रखती है।
- source_word: τὴν οὐκ ἠγαπημένην
  choice: जिसे प्रेम नहीं किया गया था
  rationale: यह पूर्ण निष्क्रिय कृदंत के भाव को स्पष्ट रूप से व्यक्त करता है और ‘अप्रिय’ जैसे शब्द से बचता है, जिसका अर्थ प्रेम न किए जाने के बजाय नापसंद किया जाना भी हो सकता है।
- source_word: ἠγαπημένην
  choice: प्रिय
  rationale: यहाँ कृदंत उस पहचान को दर्शाता है जो प्रेम पाए हुए व्यक्ति को दी जाती है। ‘प्रिय’ संक्षिप्त, गरिमापूर्ण और सामान्य हिन्दी में समझने योग्य है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: होशे के उद्धरण में सामूहिक बनाम व्यक्तिगत अर्थ
  choice: पहली अभिव्यक्ति को सामूहिक संज्ञा ‘प्रजा’ के साथ एकवचन रूप में रखा गया है।
  alternative: ‘जो लोग मेरी प्रजा नहीं थे, उन्हें मैं अपनी प्रजा कहूँगा।’
  rationale: पौलुस का तर्क परमेश्वर द्वारा अपने लिए एक प्रजा बुलाए जाने से संबंधित है। हिन्दी ‘प्रजा’ यूनानी एकवचन रूप और उसके सामूहिक अर्थ—दोनों को बिना कृत्रिम बहुवचन के व्यक्त करती है।
- issue: स्त्रीलिंग कृदंत और होशे की पृष्ठभूमि
  choice: मुख्य पाठ में स्वाभाविक निष्क्रिय वाक्य ‘जिसे प्रेम नहीं किया गया था’ रखा गया है और स्त्रीलिंग रूप की जानकारी पादटिप्पणी में दी गई है।
  alternative: ‘जो प्रेम की हुई नहीं थी, उसे प्रेम की हुई कहूँगा।’
  rationale: यूनानी स्त्रीलिंग एकवचन होशे की भविष्यवाणी की पृष्ठभूमि से आता है, किंतु उसका कठोर रूपान्तरण आधुनिक हिन्दी में अस्वाभाविक होगा। पादटिप्पणी मूल रूप को पारदर्शी रखती है और मुख्य पाठ पठनीय बना रहता है।
- issue: ἠγαπημένην का ‘प्रिय’ या ‘प्रेम की हुई’ अनुवाद
  choice: मुख्य पाठ में ‘प्रिय’ रखा गया है।
  alternative: ‘प्रेम की हुई’ अथवा ‘जिससे प्रेम किया गया है’।
  rationale: ‘प्रिय’ बुलाए जाने से दी गई संबंधपरक पहचान को सहजता से व्यक्त करता है। फिर भी मूल क्रिया प्रेम किए जाने का निष्क्रिय भाव रखती है, इसलिए अधिक औपचारिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण शास्त्रीय गद्य। ‘प्रजा’ सामूहिक अर्थ और वाचा-संबंधी स्वर को बनाए रखती है। कठिन शाब्दिक स्त्रीलिंग कृदंत को मुख्य पाठ में स्वाभाविक निष्क्रिय वाक्य से व्यक्त किया गया है और उसकी औपचारिक संरचना पादटिप्पणी में सुरक्षित रखी गई है।
