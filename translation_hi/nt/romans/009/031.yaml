  text: Ἰσραὴλ δὲ διώκων νόμον δικαιοσύνης εἰς ⸀νόμον οὐκ ἔφθασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/009/031.yaml
  text: But Israel[a], pursuing a law of righteousness[b], did not attain to that law.
translation:
  language: hi
  text: परन्तु इस्राएल, धार्मिकता की व्यवस्था[a] का अनुसरण करते हुए, उस व्यवस्था तक नहीं पहुँचा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय की व्यवस्था।”
    reason: δικαιοσύνης का अर्थ यहाँ ‘न्याय’ भी समझा जा सकता है।
  - marker: b
    text: या “उसे प्राप्त नहीं किया,” अथवा “व्यवस्था तक नहीं पहुँचा।” यूनानी पदबंध संक्षिप्त और कठिन है।
    reason: εἰς νόμον οὐκ ἔφθασεν की वाक्यरचना और आशय के वैकल्पिक अनुवाद सुरक्षित रखना।
lexical_decisions:
- source_word: Ἰσραήλ
  choice: इस्राएल
  rationale: मानक हिन्दी बाइबलीय रूप; पौलुस के तर्क में यहाँ जातीय/राष्ट्रीय इस्राएल का संकेत है।
- source_word: δέ
  choice: परन्तु
  rationale: पिछले कथन में अन्यजातियों के विषय से स्पष्ट विरोध दर्शाता है।
- source_word: διώκων
  choice: के पीछे लगा रहा
  rationale: सक्रिय और निरन्तर प्रयत्न का स्वाभाविक हिन्दी बोध देता है; मुख्य वाक्य के नकारात्मक परिणाम के कारण ‘फिर भी’ से निहित रियायती संबंध स्पष्ट किया गया है।
- source_word: νόμον δικαιοσύνης
  choice: धार्मिकता की व्यवस्था
  rationale: अनिर्दिष्ट νόμον को हिन्दी में बिना अनिवार्य निश्चितता जोड़े प्रस्तुत करता है और संबंधकारक पदबंध की संक्षिप्तता बनाए रखता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में परमेश्वर के सम्मुख सही ठहराव/सही दशा से जुड़ा प्रचलित और उपयुक्त हिन्दी शब्द है; ‘न्याय’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: εἰς νόμον οὐκ ἔφθασεν
  choice: उस व्यवस्था तक नहीं पहुँचा
  rationale: दोहराए गए νόμον को पूर्वोक्त व्यवस्था की ओर संकेत मानते हुए कठिन और संक्षिप्त यूनानी वाक्यरचना को यथासंभव बनाए रखता है; ‘लक्ष्य’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: पौलुस के संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: संदर्भ परमेश्वर के सम्मुख सही ठहराव से संबंधित पौलुसी तर्क का है, इसलिए ‘धार्मिकता’ मुख्य पाठ में अधिक उपयुक्त है; शब्द की ‘न्याय’ संबंधी संभावना पादटिप्पणी में दी गई है।
- issue: νόμον δικαιοσύνης में व्यवस्था और धार्मिकता का संबंध
  choice: धार्मिकता की व्यवस्था
  alternative: धार्मिकता दिलाने वाली व्यवस्था
  rationale: मूल संबंधकारक की वास्तविक अस्पष्टता बनाए रखने के लिए उद्देश्य या परिणाम को स्पष्ट रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘व्यवस्था’ पौलुसी संदर्भ में νόμος का स्थापित रूप है। मूल यूनानी की संक्षिप्तता तथा νόμον δικαιοσύνης और εἰς νόμον की अस्पष्टता को अतिव्याख्या के बिना रखा गया है।
