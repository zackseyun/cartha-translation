translation:
  language: hi
  text: वह हर एक को उसके कामों[a][b] के अनुसार प्रतिफल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कर्मों।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में शाब्दिक रूप से “उसके”; यहाँ इसका सामान्य, प्रतिनिधिक अर्थ है: “हर व्यक्ति के अपने कामों के।”'
    reason: cultural_note
lexical_decisions:
- source_word: ὃς
  choice: वह
  rationale: संबंधवाचक सर्वनाम पिछले संदर्भ में परमेश्वर की ओर संकेत करता है। स्वतंत्र हिन्दी वाक्य में “वह” इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀποδώσει
  choice: बदला देगा
  rationale: यह क्रिया न्यायिक संदर्भ में किसी के किए के अनुरूप प्रतिफल देने का भाव रखती है। “बदला देगा” उस प्रतिदानात्मक बल को बनाए रखता है और केवल सकारात्मक पुरस्कार तक अर्थ को सीमित नहीं करता।
- source_word: ἑκάστῳ
  choice: हर एक को
  rationale: यह यूनानी के वितरणात्मक एकवचन और प्रत्येक व्यक्ति पर अलग-अलग बल को सुरक्षित रखता है।
- source_word: κατὰ
  choice: के अनुसार
  rationale: यहाँ यह मापदंड अथवा मानक व्यक्त करता है; “के अनुसार” इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: τὰ ἔργα
  choice: कामों
  rationale: “काम” ἔργον का व्यापक और प्रचलित हिन्दी समतुल्य है तथा पौलुस के प्रयोग में शब्दगत निरंतरता बनाए रखता है। “कर्मों” अधिक धार्मिक या दार्शनिक अर्थछाया ला सकता है; “कामों” सामान्य भाषा में तटस्थ है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: यूनानी पुल्लिंग एकवचन सर्वनाम ἑκάστῳ के साथ प्रतिनिधिक, सामान्य अर्थ में प्रयुक्त है। हिन्दी में “उसके” व्याकरणिक रूप को बनाए रखता है; उसका प्रत्येक व्यक्ति से संबंध पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: कामों के अनुसार न्याय
  choice: न्यायिक प्रतिदान के कथन को “कामों के अनुसार बदला देगा” के रूप में यथावत रखना
  alternative: इसे नरम करके “व्यवहार करेगा” या केवल सकारात्मक अर्थ में “इनाम देगा” कहना
  rationale: मूल पाठ स्पष्ट रूप से प्रत्येक व्यक्ति को उसके कामों के अनुसार प्रतिफल दिए जाने की बात कहता है। अनुवाद को पौलुस की अन्य शिक्षाओं के साथ इसकी धार्मिक तनावपूर्णता को स्वयं सुलझाना नहीं चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “बदला देगा” न्यायिक प्रतिदान को स्पष्ट करता है, जबकि “कामों” सामान्य पाठक के लिए स्वाभाविक है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
