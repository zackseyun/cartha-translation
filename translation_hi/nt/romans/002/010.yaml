  text: but glory and honor and peace to everyone who does good[b][a], to the Jew first and also to the Greek.
translation:
  language: hi
  text: परन्तु भलाई करने वाले हर व्यक्ति के लिए महिमा, आदर और शान्ति होगी—पहले यहूदी के लिए और यूनानी के लिए भी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “यूनानी” से सम्भवतः व्यापक रूप से गैर-यहूदी व्यक्ति, अर्थात अन्यजाति, अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: δόξα
  choice: महिमा
  rationale: यह शब्द सम्मान और अन्तिम प्रतिफल—दोनों के भाव को बनाए रखता है और बाइबलीय हिन्दी में स्वाभाविक है।
- source_word: τιμή
  choice: आदर
  rationale: ‘महिमा’ के साथ प्रतिफल-सूचक युग्म में ‘आदर’ सहज और स्पष्ट है।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह मूल शब्द के व्यापक बाइबलीय अर्थ को बनाए रखता है और उसे केवल भीतरी अनुभूति या सामाजिक कल्याण तक सीमित नहीं करता।
- source_word: παντὶ τῷ ἐργαζομένῳ
  choice: हर उस व्यक्ति को, जो ... करता है
  rationale: यह कृदन्त की व्यक्ति को उसके निरन्तर या चारित्रिक आचरण से पहचानने वाली शक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἀγαθόν
  choice: भलाई
  rationale: संज्ञीकृत विशेषण का अर्थ ‘जो अच्छा है’ है; ‘भलाई करता है’ संक्षिप्त, स्वाभाविक और अर्थ-संगत हिन्दी है।
- source_word: Ἰουδαίῳ
  choice: यहूदी को
  rationale: एकवचन यहाँ प्रतिनिधिक है; हिन्दी में ‘यहूदी को’ मूल संरचना को सहज ढंग से बनाए रखता है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह पौलुस के कथन में क्रम को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: Ἕλληνι
  choice: यूनानी को
  rationale: यह मूल जातीय पद और ‘यहूदी और यूनानी’ की पौलुसी अभिव्यक्ति को सुरक्षित रखता है; व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले पद में बताए गए क्रोध और संकट के प्रतिफल के साथ स्पष्ट विरोध दर्शाता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: महिमा, आदर और शान्ति की समन्वित सूची को स्पष्ट तथा स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: τε ... καὶ
  choice: पहले ... और फिर
  rationale: मूल का ‘दोनों/और भी’ संबंध तथा πρῶτον से व्यक्त क्रम हिन्दी में स्पष्ट करता है; ‘फिर’ कालगत विलम्ब का दावा नहीं, बल्कि सूची के दूसरे सदस्य को चिह्नित करता है।
theological_decisions:
- issue: Ἕλληνι का आशय पौलुस के ‘यहूदी और यूनानी’ विरोध में
  choice: मुख्य पाठ में ‘यूनानी’, और व्यापक ‘गैर-यहूदी’ अर्थ पादटिप्पणी में
  alternative: मुख्य पाठ में ‘गैर-यहूदी’
  rationale: शाब्दिक जातीय पद को बनाए रखने से मूल अभिव्यक्ति सुरक्षित रहती है, जबकि पादटिप्पणी रोमियों में उसके सम्भावित व्यापक धार्मिक-जातीय अर्थ को बताती है।
- issue: भलाई करने और अन्तिम प्रतिफल का संबंध
  choice: मूल के प्रत्यक्ष कथन को बिना धर्मसैद्धान्तिक विस्तार के प्रस्तुत करना
  alternative: पाठ में विश्वास, अनुग्रह या योग्यता संबंधी स्पष्टीकरण जोड़ना
  rationale: यह पद कर्म और प्रतिफल का संबंध सीधे कहता है। अतिरिक्त प्रणालीगत व्याख्या जोड़ना पाठ की वास्तविक धर्मवैचारिक तनातनी को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप रखा गया है। ‘परन्तु’ पिछले पद से विरोध को दिखाता है। ‘भलाई करता है’ स्वाभाविक मुहावरा है। पादटिप्पणी-चिह्न उसी पद ‘यूनानी’ के बाद रखा गया है जिसे वह स्पष्ट करता है।
