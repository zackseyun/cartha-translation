id: ROM.2.15
reference: Romans 2:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἵτινες ἐνδείκνυνται τὸ ἔργον τοῦ νόμου γραπτὸν ἐν ταῖς καρδίαις αὐτῶν, συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως καὶ μεταξὺ ἀλλήλων τῶν λογισμῶν κατηγορούντων ἢ καὶ ἀπολογουμένων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/015.yaml
  text: They show that the work of the law is written on their hearts[b][a], while their conscience also bears witness and their thoughts accuse or even defend them.
translation:
  language: hi
  text: वे दिखाते हैं कि व्यवस्था का कार्य उनके हृदयों में लिखा हुआ है,[a] और उनका विवेक भी इसकी गवाही देता है; उनके विचार आपस में उन पर दोष लगाते या उनका बचाव भी करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था की माँग” अथवा “जो व्यवस्था चाहती है।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में अधिक शाब्दिक रूप से “एक-दूसरे के बीच” का भाव है; इसका अर्थ “उनके परस्पर विरोधी विचार” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐνδείκνυνται
  choice: दिखाते हैं
  rationale: यह क्रिया के प्रमाणसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर उसे कठोर अर्थ में ‘सिद्ध करना’ नहीं बनाता।
- source_word: τὸ ἔργον τοῦ νόμου
  choice: व्यवस्था का कार्य
  rationale: यूनानी में ‘कार्य’ एकवचन है। यह अनुवाद मूल अभिव्यक्ति को खुला रखता है; ‘व्यवस्था की माँग’ जैसी व्याख्या पादटिप्पणी में दी गई है।
- source_word: γραπτὸν ἐν ταῖς καρδίαις αὐτῶν
  choice: उनके हृदयों में लिखा हुआ
  rationale: यह भीतरी लेखन के रूपक को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: συμμαρτυρούσης αὐτῶν τῆς συνειδήσεως
  choice: उनका विवेक भी इसकी गवाही देता है
  rationale: ‘भी’ संयुक्त अथवा पुष्टिकारक गवाही का भाव देता है, और ‘इसकी’ उस लिखे हुए कार्य से संबंध स्पष्ट करती है।
- source_word: μεταξὺ ἀλλήλων τῶν λογισμῶν
  choice: उनके विचार आपस में
  rationale: यह संक्षिप्त यूनानी रचना के पारस्परिक भाव को मिटाए बिना पठनीय हिन्दी देता है।
- source_word: κατηγορούντων ἢ καὶ ἀπολογουμένων
  choice: दोष लगाते या उनका बचाव भी करते हैं
  rationale: ‘बचाव’ ἀπολογουμένων का अपेक्षाकृत सीधा अर्थ है, और ‘भी’ ἢ καὶ के बलाघात को व्यक्त करता है।
theological_decisions:
- issue: क्या ‘व्यवस्था का कार्य’ सामान्य आंतरिक नैतिक बोध है या विशेष रूप से व्यवस्था की माँगें?
  choice: मुख्य पाठ में कम व्याख्यात्मक ‘व्यवस्था का कार्य’ रखा गया है।
  alternative: ‘व्यवस्था की माँग’ अथवा ‘जो व्यवस्था चाहती है’
  rationale: मूल यूनानी अभिव्यक्ति संक्षिप्त है और इन व्याख्याओं में से किसी एक को स्पष्ट रूप से निश्चित नहीं करती; इसलिए मूल का धार्मिक तनाव सुरक्षित रखा गया है।
- issue: विचारों के ‘आपस में’ होने और दोष लगाने अथवा बचाव करने का संबंध
  choice: पारस्परिक भाव को ‘विचार आपस में’ द्वारा बनाए रखते हुए दोष और बचाव का लक्ष्य व्यक्तियों को माना गया है।
  alternative: ‘उनके परस्पर विरोधी विचार उन्हें दोषी ठहराते या निर्दोष बताते हैं’
  rationale: यूनानी वाक्यरचना संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ ἀλλήλων का पारस्परिक भाव बचाता है, पर ‘परस्पर विरोधी’ जैसी व्याख्या को सीधे पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘व्यवस्था’, ‘विवेक’, ‘गवाही’ और ‘बचाव’ सामान्य बाइबलीय शब्दावली के अनुरूप हैं, जबकि वाक्य को अनावश्यक रूप से सांप्रदायिक या व्याख्यात्मक नहीं बनाया गया।
