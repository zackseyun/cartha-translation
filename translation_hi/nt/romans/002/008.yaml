id: ROM.2.8
reference: Romans 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῖς δὲ ἐξ ἐριθείας καὶ ⸀ἀπειθοῦσι τῇ ἀληθείᾳ πειθομένοις δὲ τῇ ἀδικίᾳ ⸂ὀργὴ καὶ θυμός⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/008.yaml
  text: 'But for those who are self-seeking and disobey the truth[b][a], but obey unrighteousness: wrath and fury.'
translation:
  language: hi
  text: परन्तु जो स्वार्थी महत्त्वाकांक्षा से प्रेरित होकर सत्य की आज्ञा नहीं मानते, बल्कि अधार्मिकता की आज्ञा मानते हैं—उन पर क्रोध और प्रकोप होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἐριθείας
  choice: स्वार्थी महत्त्वाकांक्षा से प्रेरित होकर
  rationale: ἐξ उद्देश्य या प्रेरक स्रोत को सूचित करता है और ἐριθεία स्वार्थपूर्ण, गुटबाज़ या प्रतिद्वंद्वी महत्त्वाकांक्षा का भाव रखता है; यह रूप हिंदी में स्वाभाविक रहते हुए उस प्रेरणा को व्यक्त करता है।
- source_word: ἀπειθοῦσι τῇ ἀληθείᾳ
  choice: सत्य की आज्ञा नहीं मानते
  rationale: ἀπειθέω यहाँ केवल विश्वास न करने के बजाय नैतिक अवज्ञा का भाव रखता है; यह अनुवाद सत्य के प्रति जानबूझकर आज्ञा न मानने की शक्ति बनाए रखता है।
- source_word: πειθομένοις δὲ τῇ ἀδικίᾳ
  choice: बल्कि अधार्मिकता की आज्ञा मानते हैं
  rationale: यह वाक्यांश सत्य की अवज्ञा के समानांतर विपरीत निष्ठा व्यक्त करता है। 'आज्ञा मानते हैं' दोनों यूनानी क्रियाओं के आज्ञापालन-अवज्ञा संबंध को स्पष्ट रखता है।
- source_word: ἀδικίᾳ
  choice: अधार्मिकता
  rationale: पौलुस के नैतिक और परमेश्वर-संबंधी संदर्भ में यह शब्द केवल सामाजिक अन्याय से व्यापक है; 'अधार्मिकता' उस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: ὀργὴ
  choice: क्रोध
  rationale: इस न्याय-संदर्भ में यह परमेश्वर के न्यायपूर्ण क्रोध को दर्शाता है; हिंदी में 'क्रोध' गंभीर और स्वाभाविक है।
- source_word: θυμός
  choice: प्रकोप
  rationale: ὀργή के साथ प्रयुक्त होकर यह तीव्रता बढ़ाता है। 'प्रकोप' गंभीर न्यायिक शैली रखता है और केवल अनियंत्रित मानवीय आवेश का संकेत नहीं देता।
- source_word: implicit verbal ellipsis
  choice: उन पर ... होगा
  rationale: यूनानी में क्रिया लुप्त है और अर्थ बड़े वाक्य से पूरा होता है। हिंदी में केवल संज्ञाएँ रखने पर वाक्य अस्वाभाविक होता; न्यूनतम पूर्ति अर्थ स्पष्ट करती है।
theological_decisions:
- issue: ἀδικία का न्याय-संदर्भ में अनुवाद
  choice: अधार्मिकता
  alternative: अन्याय
  rationale: '''अधार्मिकता'' परमेश्वर के सामने नैतिक विरोध और गलत आचरण दोनों को समेटता है, जबकि ''अन्याय'' हिंदी में प्रायः सामाजिक या कानूनी अन्याय तक सीमित समझा जा सकता है।'
- issue: ὀργὴ καὶ θυμός में दो निकटार्थक न्याय-संज्ञाएँ
  choice: क्रोध और प्रकोप
  alternative: कोप और रोष
  rationale: दोनों अलग संज्ञाओं को बनाए रखने से मूल की तीव्रता और संचयी बल सुरक्षित रहता है; इन्हें एक ही शब्द में समेटना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, सार्वजनिक-पाठ योग्य शैली। वाक्य को पिछले और अगले पद के व्यापक व्याकरणिक संदर्भ से समझते हुए न्यूनतम क्रियात्मक पूर्ति की गई है। 'परन्तु' और 'बल्कि' मूल के दोहरे विरोध को स्पष्ट करते हैं।
