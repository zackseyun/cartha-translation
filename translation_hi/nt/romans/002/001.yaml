  rationale: यह साधारण ‘न्याय करना’ से अधिक प्रबल दंडनिर्णयात्मक अर्थ को स्पष्ट करता है।
- source_word: τὰ γὰρ αὐτὰ πράσσεις
  choice: तुम स्वयं वही काम करते हो
  rationale: यह समान आचरण पर बल देता है; वर्तमान काल का व्यवहारगत भाव हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὁ κρίνων
  choice: न्याय करनेवाले तुम
  rationale: यह कृदन्त द्वारा संबोधित व्यक्ति की पहचान और दूसरे पुरुष की प्रत्यक्षता को बनाए रखता है।
theological_decisions:
- issue: पौलुस के उलाहने में प्रतिनिधिक पुल्लिंग संबोधन
  choice: मुख्य पाठ में ‘हे मनुष्य’ रखा गया और उसके व्यापक प्रतिनिधिक अर्थ को पादटिप्पणी में स्पष्ट किया गया।
  alternative: हे व्यक्ति / हे मानव
  rationale: यूनानी ἄνθρωπε पुल्लिंग एकवचन संबोधन है, पर संदर्भ में उसका बल हर न्याय करनेवाले मनुष्य पर है। यह रूप स्रोत की वाक्पटुता और व्यापक आशय दोनों को सुरक्षित रखता है।
- issue: न्याय करने और दोषी ठहराने के बीच अंतर
  choice: κρίνεις के लिए ‘न्याय करते हो’ और κατακρίνεις के लिए ‘दोषी ठहराते हो’ रखा गया।
  alternative: दोनों स्थानों पर ‘न्याय करना’
  rationale: अलग हिन्दी पद यूनानी के दूसरे, अधिक प्रबल और दंडनिर्णयात्मक क्रियापद को समतल होने से बचाते हैं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। एकवचन संबोधन के लिए ‘तुम’ चुना गया है, ताकि ‘तू’ से उत्पन्न संभावित अपमानसूचकता से बचते हुए यूनानी की प्रत्यक्षता बनी रहे।
