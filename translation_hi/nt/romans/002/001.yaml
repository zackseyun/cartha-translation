- source_word: ἐν ᾧ κρίνεις τὸν ἕτερον
  choice: जिस बात में तुम दूसरे का न्याय करते हो
  rationale: यह यूनानी संबंधवाचक रचना की संभावित आधारगत और क्रियागत दोनों छायाओं को पूरी तरह केवल कालवाचक अर्थ में सीमित किए बिना बनाए रखता है।
- source_word: κατακρίνεις
