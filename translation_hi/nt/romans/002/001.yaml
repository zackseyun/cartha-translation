  text: Διὸ ἀναπολόγητος εἶ, ὦ ἄνθρωπε πᾶς ὁ κρίνων· ἐν ᾧ γὰρ κρίνεις τὸν ἕτερον, σεαυτὸν κατακρίνεις, τὰ γὰρ αὐτὰ πράσσεις ὁ κρίνων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/001.yaml
  text: Therefore you are without excuse[a], O man, every one who judges. For in passing judgment on another, you condemn yourself, because you who judge practice the same things.
translation:
  language: hi
  text: इसलिए, हे मनुष्य[a], तुम जो दूसरे का न्याय करते हो—तुम चाहे जो कोई हो—तुम्हारे पास कोई सफाई नहीं है। क्योंकि जिस बात में तुम दूसरे का न्याय करते हो, उसी में अपने आप को दोषी ठहराते हो; क्योंकि तुम, जो न्याय करते हो, स्वयं वही काम करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यह संबोधन पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक अर्थ में किसी भी मनुष्य को संबोधित करता है।
    reason: lexical_alternative
