source:
  edition: SBLGNT
  text: ὁ λέγων μὴ μοιχεύειν μοιχεύεις; ὁ βδελυσσόμενος τὰ εἴδωλα ἱεροσυλεῖς;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/022.yaml
  text: You who say[a], “Do not commit adultery,” do you commit adultery? You who detest idols, do you rob temples?
translation:
  language: hi
  text: तुम जो कहते हो, “व्यभिचार न करना,” क्या तुम व्यभिचार करते हो? तुम जो मूर्तियों से घृणा करते हो, क्या मंदिरों को लूटते हो?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्यापक अर्थ में, “क्या तुम पवित्र वस्तुओं का अनादर करते हो?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λέγων
  choice: तू जो कहता है
  rationale: निश्चित उपपद के साथ वर्तमान कृदन्त यहाँ प्रतिनिधि व्यक्ति को सीधे सम्बोधित करता है; यह रूप पौलुस की तीखी प्रश्नात्मक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μὴ μοιχεύειν
  choice: व्यभिचार न करना
  rationale: μή के साथ अनन्त क्रिया कही गई मनाही की विषयवस्तु व्यक्त करती है; ‘व्यभिचार करना’ सटीक और प्रचलित हिन्दी पद है।
- source_word: μοιχεύεις
  choice: क्या तू व्यभिचार करता है?
  rationale: वर्तमान निर्देशार्थक का सामान्य आरोपात्मक बल हिन्दी के सामान्य वर्तमान काल में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὁ βδελυσσόμενος
  choice: तू जो ... घृणा करता है
  rationale: βδελύσσομαι तीव्र अरुचि और घृणा बताता है; ‘घृणा करना’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: τὰ εἴδωλα
  choice: मूर्तियों
  rationale: इस उपासना-सन्दर्भ में εἴδωλα देव-प्रतिमाओं अथवा मूर्तियों को सूचित करता है; ‘मूर्तियाँ’ सामान्य हिन्दी में स्पष्ट है।
- source_word: ἱεροσυλεῖς
  choice: क्या तू मन्दिरों को लूटता है?
  rationale: ἱεροσυλέω का ठोस अर्थ मन्दिर अथवा उसकी सम्पत्ति लूटना है। निकट सन्दर्भ में मूर्तियों का उल्लेख होने से यह अर्थ विडम्बना और ऐतिहासिक रंग को बनाए रखता है; व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ἱεροσυλεῖς का ठोस या व्यापक अर्थ
  choice: मन्दिरों को लूटता है
  alternative: पवित्र वस्तुओं का अपमान करता है / पवित्रता का उल्लंघन करता है
  rationale: मूल क्रिया दोनों अर्थ-क्षेत्रों से जुड़ सकती है। मुख्य पाठ में अधिक ठोस और शब्दकोशीय अर्थ रखा गया है, जबकि वास्तविक व्यापक सम्भावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रत्यक्ष, तीखी आलंकारिक प्रश्न-शैली रखी गई है। यूनानी एकवचन सम्बोधन की निकटता और आरोपात्मक धार के लिए ‘तू’ चुना गया है। ‘मन्दिर’ की वर्तनी गरिमापूर्ण प्रचलित रूप में रखी गई है।
