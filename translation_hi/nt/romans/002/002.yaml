  text: οἴδαμεν δὲ ὅτι τὸ κρίμα τοῦ θεοῦ ἐστιν κατὰ ἀλήθειαν ἐπὶ τοὺς τὰ τοιαῦτα πράσσοντας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/002.yaml
  text: And we know that the judgment of God is according to truth against those who practice such things[a].
translation:
  language: hi
  text: और हम जानते हैं कि ऐसे काम करने वालों के विरुद्ध परमेश्वर का न्याय सत्य के अनुसार होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: οἶδα का पूर्णकालिक रूप यहाँ वर्तमान अर्थ रखता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध के बजाय विचार को आगे बढ़ाता है; इसलिए ‘और’ उसके संयोजक बल को सहज रूप से व्यक्त करता है।
- source_word: κρίμα
  choice: न्याय
  rationale: κρίμα यहाँ परमेश्वर के न्यायिक निर्णय को दर्शाता है। ‘न्याय’ परिणाम को केवल ‘दण्डादेश’ तक सीमित नहीं करता।
- source_word: κατὰ ἀλήθειαν
  choice: सत्य के अनुसार
  rationale: यह पदबंध सत्य अथवा वास्तविकता के अनुरूप होने का भाव रखता है और मूल शब्दावली तथा पौलुस के नैतिक-न्यायिक बल को बनाए रखता है।
- source_word: ἐπὶ
  choice: के विरुद्ध
  rationale: प्रतिकूल न्याय के अधीन व्यक्तियों के संदर्भ में ἐπί की न्यायिक दिशा को ‘के विरुद्ध’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ τοιαῦτα
  choice: ऐसे काम
  rationale: यह नपुंसकलिंग बहुवचन पदबंध पिछले संदर्भ में बताए गए आचरणों की ओर संकेत करता है; हिन्दी में ‘ऐसे काम’ सहज है।
- source_word: πράσσοντας
  choice: करते रहनेवालों
  rationale: वर्तमान कृदंत निरंतर अथवा चरित्रगत आचरण का संकेत दे सकता है; ‘करते रहनेवालों’ इस पहलू को केवल ‘करनेवालों’ से अधिक स्पष्ट करता है।
theological_decisions:
- issue: κατὰ ἀλήθειαν को अर्थ खोलकर ‘ठीक’ कहना या पारदर्शी रूप से ‘सत्य के अनुसार’ रखना
  choice: सत्य के अनुसार
  alternative: ठीक; सत्य के अनुरूप
  rationale: ‘सत्य के अनुसार’ परमेश्वर के न्याय का सत्य अथवा वास्तविकता के अनुरूप होना स्पष्ट रखता है और इस धर्मवैचारिक बनावट को केवल एक क्रियाविशेषण में नहीं समेटता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘करते रहनेवालों’ से वर्तमान कृदंत का निरंतर या चरित्रगत भाव व्यक्त किया गया है; ‘सत्य के अनुसार’ मूल पदबंध की जानबूझकर रखी गई पारदर्शिता को सुरक्षित रखता है।
