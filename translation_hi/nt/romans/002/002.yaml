revisions:
- from: और हम जानते हैं कि ऐसे काम करते रहनेवालों के विरुद्ध परमेश्वर का न्याय सत्य के अनुसार[a] होता है।
  to: और हम जानते हैं कि ऐसे काम करने वालों के विरुद्ध परमेश्वर का न्याय सत्य के अनुसार होता है।
  rationale: The revision removes an unnecessary implication of uninterrupted action while keeping the present participle’s characteristic-practice sense. The footnote is clarified so that ‘according to truth’ is explained as conformity of divine judgment to truth, not simply as a claim that the judgment is true.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:55Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the main clause, God's judicial judgment, its direction against the relevant people, and the sense of κατὰ ἀλήθειαν. However, ‘करते रहनेवालों’ can suggest an explicitly uninterrupted continuance, whereas the present participle more broadly denotes those characterized by doing/practising such things. ‘करने वालों’ conveys this without over-specifying the aspect.
  naturalness: The sentence is understandable and appropriately formal. Replacing ‘करते रहनेवालों’ with the spaced, more idiomatic ‘करने वालों’ improves modern standard Hindi while retaining the generic/habitual force. ‘होता है’ naturally expresses the stated character of God's judgment.
  terminology: ‘परमेश्वर का न्याय’ suitably renders κρίμα without prematurely narrowing it to condemnation. ‘सत्य के अनुसार’ is transparent and preserves the intentional breadth of κατὰ ἀλήθειαν. The footnote is revised to avoid wording that could be read as merely saying that the judgment itself is true, rather than that it accords with truth.
  issues:
  - severity: low
    issue: ‘करते रहनेवालों’ overstates the participle’s aspect and is less idiomatic in this context.
    rationale: πράσσοντας is present participial and can indicate characteristic practice, but it does not specifically require the stronger sense of continuing without interruption conveyed by ‘करते रहने’. ‘करने वालों’ is natural and sufficiently preserves the generic, conduct-characterizing sense.
  - severity: low
    issue: The explanatory footnote’s phrase ‘परमेश्वर का न्याय जो सत्य है’ is syntactically ambiguous.
    rationale: It may be understood as qualifying the judgment as true rather than explaining that the judgment conforms to truth. A direct formulation makes the intended relation clear.
  revised_text: और हम जानते हैं कि ऐसे काम करने वालों के विरुद्ध परमेश्वर का न्याय सत्य के अनुसार होता है।
  revised_footnotes:
  - marker: a
    text: या ‘सत्य के अनुरूप’; अर्थात, परमेश्वर का न्याय सत्य के अनुरूप होता है।
    reason: lexical_alternative
  revision_rationale: The revision removes an unnecessary implication of uninterrupted action while keeping the present participle’s characteristic-practice sense. The footnote is clarified so that ‘according to truth’ is explained as conformity of divine judgment to truth, not simply as a claim that the judgment is true.
