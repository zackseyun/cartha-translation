  text: παιδευτὴν ἀφρόνων, διδάσκαλον νηπίων, ἔχοντα τὴν μόρφωσιν τῆς γνώσεως καὶ τῆς ἀληθείας ἐν τῷ νόμῳ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/020.yaml
  text: an instructor of the foolish[a], a teacher of infants, having in the law the embodiment of knowledge and truth—
translation:
  language: hi
  text: मूर्खों को शिक्षा देने वाला, शिशुओं का शिक्षक, और व्यवस्था में ज्ञान और सत्य का स्वरूप रखने वाला—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδευτὴν
  choice: शिक्षा देनेवाला
  rationale: यह शब्द प्रशिक्षण, अनुशासन और सुधार सहित शिक्षा देने का भाव रखता है। संदर्भ में शैक्षिक दावे को स्वाभाविक ढंग से व्यक्त करने के लिए यह चयन किया गया है।
- source_word: ἀφρόνων
  choice: मूर्खों
  rationale: यह शब्द विवेकहीन या मूर्ख लोगों के लिए प्रयुक्त होता है। “मूर्खों” से वक्ता के आत्मविश्वासी और कुछ हद तक तिरस्कारपूर्ण दावे की धार बनी रहती है।
- source_word: διδάσκαλον
  choice: शिक्षक
  rationale: यह इसका सामान्य और स्पष्ट अर्थ है तथा आधुनिक हिन्दी में सहज है।
- source_word: νηπίων
  choice: शिशुओं
  rationale: शब्द का मूल अर्थ बहुत छोटे बच्चे या शिशु है; यहाँ अपरिपक्व लोगों के लिए रूपक भी संभव है। “शिशुओं” मूल रूपक और उसकी तीक्ष्णता को बनाए रखता है।
- source_word: ἔχοντα
  choice: रखनेवाला
  rationale: वर्तमान कृदंत को पिछले समानांतर वर्णनों से जोड़ते हुए अधिकार या धारण करने का भाव व्यक्त किया गया है।
- source_word: μόρφωσιν
  choice: मूर्त रूप
  rationale: शब्द रूप, अभिव्यक्ति या साकार प्रतिरूप का अर्थ दे सकता है। “मूर्त रूप” व्यवस्था को ज्ञान और सत्य की ठोस अभिव्यक्ति के रूप में प्रस्तुत करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: γνώσεως
  choice: ज्ञान
  rationale: यह γνῶσις का स्वाभाविक हिन्दी समतुल्य है और सत्य के साथ इसकी जोड़ी को बनाए रखता है।
- source_word: ἀληθείας
  choice: सत्य
  rationale: यह ἀλήθεια का स्पष्ट और प्रचलित अनुवाद है।
- source_word: ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: पूर्वसर्गीय वाक्यांश को निकटता से रखते हुए यह दिखाया गया है कि दावा किया गया मूर्त रूप व्यवस्था में पाया जाता है; अनावश्यक व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: μόρφωσις का आशय
  choice: मूर्त रूप
  alternative: स्वरूप
  rationale: पद यह स्पष्ट नहीं करता कि यहाँ पूर्ण साकार अभिव्यक्ति पर बल है या केवल रूप/संरचना पर। मुख्य पाठ में स्वाभाविक “मूर्त रूप” रखा गया है और वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और संक्षिप्त शैली रखी गई है। पद पिछले वाक्य के वर्णनों की शृंखला का अंश है, इसलिए अंत का दीर्घ विराम-चिह्न बनाए रखा गया है।
