id: ROM.2.3
reference: Romans 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λογίζῃ δὲ τοῦτο, ὦ ἄνθρωπε ὁ κρίνων τοὺς τὰ τοιαῦτα πράσσοντας καὶ ποιῶν αὐτά, ὅτι σὺ ἐκφεύξῃ τὸ κρίμα τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/003.yaml
  text: But do you suppose this[a], O man—you who judge those who practice such things and yet do them yourself—that you will escape the judgment of God?
translation:
  language: hi
  text: पर हे मनुष्य[a], तू जो ऐसे काम करने वालों का न्याय करता है और स्वयं वही काम करता है, क्या तू यह समझता है कि तू परमेश्वर के न्याय से बच निकलेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे व्यक्ति।” यूनानी में “मनुष्य” पुल्लिंग एकवचन है और यहाँ एक प्रतिनिधि मानव व्यक्ति को संबोधित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: λογίζῃ
  choice: क्या तू यह समझता है
  rationale: यह क्रिया मन में विचार करने या मान लेने का भाव देती है; प्रश्नात्मक रूप वक्ता की उस धारणा को चुनौती देता है।
- source_word: ἄνθρωπε
  choice: हे मनुष्य
  rationale: संबोधन एक प्रतिनिधि मानव व्यक्ति से है। ‘हे मनुष्य’ यूनानी एकवचन और पौलुस की प्रतिवादात्मक संबोधन-शैली को बनाए रखता है।
- source_word: κρίνων
  choice: न्याय करता है
  rationale: यह नैतिक निर्णय करने के सामान्य अर्थ को सीधे व्यक्त करता है; ‘दोषी ठहराता’ मूल शब्द से अधिक प्रबल होता।
- source_word: πράσσοντας
  choice: ऐसे काम करनेवालों
  rationale: वर्तमान कृदंत लगातार या अभ्यस्त आचरण का संकेत दे सकता है; यह पद पिछले संदर्भ के ‘ऐसे कामों’ से संबंध बनाए रखता है।
- source_word: ποιῶν αὐτά
  choice: स्वयं वही काम करता है
  rationale: αὐτά पहले बताए कामों की ओर लौटता है, और ‘स्वयं’ प्रसंग तथा स्पष्ट σύ से उभरने वाले विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκφεύξῃ
  choice: बच निकलेगा
  rationale: यह परमेश्वर के आने वाले न्याय से बच जाने या उसे टाल देने की धारणा को सटीक और सहज रूप में व्यक्त करता है।
- source_word: κρίμα
  choice: न्याय
  rationale: यहाँ शब्द परमेश्वर के न्यायिक निर्णय को व्यापक रूप में दर्शाता है; केवल ‘दण्डादेश’ या ‘फैसला’ कहना अर्थ को अनावश्यक रूप से सीमित कर सकता है।
theological_decisions:
- issue: κρίμα τοῦ θεοῦ में न्याय का स्वरूप
  choice: परमेश्वर का न्याय
  alternative: परमेश्वर का दण्डादेश
  rationale: मूल शब्द इस संदर्भ में न्यायिक निर्णय को दर्शाता है, पर केवल अंतिम दण्डादेश तक सीमित करना आवश्यक नहीं; इसलिए व्यापक अभिव्यक्ति रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तू’ का प्रयोग यूनानी एकवचन के सीधे, तीखे संबोधन और हिन्दी बाइबलीय शैली के अनुरूप है; इसे अपमानसूचक बनाने का आशय नहीं है।
