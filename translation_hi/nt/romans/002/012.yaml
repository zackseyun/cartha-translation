id: ROM.2.12
reference: Romans 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅσοι γὰρ ἀνόμως ἥμαρτον, ἀνόμως καὶ ἀπολοῦνται· καὶ ὅσοι ἐν νόμῳ ἥμαρτον, διὰ νόμου κριθήσονται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/012.yaml
  text: For all who sinned apart from the law will also perish apart from the law[c][b][a], and all who sinned under the law will be judged through the law.
translation:
  language: hi
  text: क्योंकि जितनों ने व्यवस्था से बाहर रहकर पाप किया, वे व्यवस्था से बाहर ही नाश होंगे[a]; और जितनों ने व्यवस्था के अधीन रहकर पाप किया, उनका न्याय व्यवस्था के द्वारा किया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यवस्था से बाहर’ का अनुवाद ‘व्यवस्था के बिना’ या ‘व्यवस्थाहीन रीति से’ भी हो सकता है; यूनानी में दोनों स्थानों पर एक ही शब्द है।
    reason: lexical_alternative
  - marker: b
    text: ‘व्यवस्था के द्वारा’ का अनुवाद ‘व्यवस्था के आधार पर’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνόμως
  choice: व्यवस्था से बाहर रहकर / व्यवस्था से बाहर
  rationale: यह अनुवाद केवल ‘व्यवस्थाहीन रीति से’ किए गए अनैतिक आचरण के बजाय मूसा की व्यवस्था के क्षेत्र से बाहर होने का भाव व्यक्त करता है और ἐν νόμῳ के साथ पौलुस के विरोध को बनाए रखता है।
- source_word: ἥμαρτον
  choice: पाप किया
  rationale: अओरिस्ट क्रिया का सरल भूतकालीन भाव स्वाभाविक हिन्दी में रखा गया है, बिना उसके पक्ष को अधिक व्याख्यायित किए।
- source_word: ἀπολοῦνται
  choice: नाश होंगे
  rationale: यह भविष्यकालीन परिणाम को व्यक्त करता है, पर नाश के स्वरूप को विनाशवाद या किसी अन्य विशिष्ट सिद्धान्त के रूप में तय नहीं करता।
- source_word: ἐν νόμῳ
  choice: व्यवस्था के अधीन रहकर
  rationale: शाब्दिक ‘व्यवस्था में’ की तुलना में यह व्यवस्था के अधिकार-क्षेत्र में होने का प्रसंगगत अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ νόμου
  choice: व्यवस्था के द्वारा
  rationale: διά के साधनात्मक भाव को बनाए रखता है और इसे ἐν νόμῳ के ‘व्यवस्था के अधीन’ भाव से अलग रखता है।
- source_word: κριθήσονται
  choice: उनका न्याय ... किया जाएगा
  rationale: न्यायिक जाँच या निर्णय का तटस्थ भाव रखा गया है; इसे सीधे ‘दोषी ठहराए जाएँगे’ कहकर परिणाम को पहले से निश्चित नहीं किया गया।
- source_word: Ὅσοι ... καὶ ὅσοι
  choice: जितनों ने ... और जितनों ने
  rationale: दोनों समूहों की सर्वसमावेशी और समानान्तर संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह दर्शाता है कि पद पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है।
theological_decisions:
- issue: νόμος में ‘व्यवस्था’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘व्यवस्था’, प्रसंगतः विशेष रूप से मूसा की व्यवस्था
  alternative: सामान्य नैतिक नियम या व्यवस्था
  rationale: रोमियों 2 में यहूदी और गैर-यहूदी का विरोध मुख्यतः मूसा की व्यवस्था पाए हुए और उससे बाहर लोगों के बीच है; फिर भी मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- issue: ἀπολοῦνται में नाश का स्वरूप
  choice: ‘नाश होंगे’—स्वरूप को अनिर्धारित रखना
  alternative: ‘दोषी ठहराए जाएँगे’ या ‘पूरी तरह मिटा दिए जाएँगे’
  rationale: पद न्यायिक परिणाम बताता है, पर इसी वाक्य में अंतिम दण्ड की प्रक्रिया या प्रकृति निर्धारित नहीं करता; इसलिए धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: κριθήσονται का न्यायिक परिणाम
  choice: तटस्थ ‘न्याय किया जाएगा’
  alternative: ‘दोषी ठहराए जाएँगे’
  rationale: κρίνω यहाँ न्यायिक निर्णय को सूचित करता है; अनुवाद संदर्भ को परिणाम स्पष्ट करने देता है और क्रिया में स्वतः दोषसिद्धि नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और समानान्तर वाक्य-विन्यास रखा गया है। ‘व्यवस्था’ हिन्दी बाइबल परम्परा में νόμος का परिचित शब्द है। ‘व्यवस्था से बाहर रहकर’ और ‘व्यवस्था के अधीन रहकर’ का विरोध मूल यूनानी की वैचारिक समानान्तरता को स्पष्ट करता है।
