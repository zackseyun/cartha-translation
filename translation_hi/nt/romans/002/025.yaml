reference: Romans 2:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Περιτομὴ μὲν γὰρ ὠφελεῖ ἐὰν νόμον πράσσῃς· ἐὰν δὲ παραβάτης νόμου ᾖς, ἡ περιτομή σου ἀκροβυστία γέγονεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/025.yaml
  text: Circumcision indeed is beneficial if you practice the law[a]; but if you are a transgressor of the law[d][c][b], your circumcision has become uncircumcision.
translation:
  language: hi
  text: क्योंकि खतना सचमुच लाभदायक है, यदि तुम व्यवस्था का पालन करते हो; लेकिन यदि तुम व्यवस्था का उल्लंघन करते हो, तो तुम्हारा खतना खतनारहित हो गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात, व्यवस्था का उल्लंघन करने पर वाचा के चिह्न के रूप में खतने का लाभ नहीं रहता। यूनानी में प्रबल शब्द हैं: ‘तुम्हारा खतना खतनारहितता बन गया है।’'
    reason: cultural_note
lexical_decisions:
- source_word: Περιτομὴ
  choice: खतना
  rationale: प्रचलित और सहज धार्मिक-सांस्कृतिक शब्द; पौलुस की वाचा-संबंधी श्रेणी और आगे आनेवाले विरोध को बनाए रखता है।
- source_word: μὲν γὰρ
  choice: क्योंकि … सचमुच
  rationale: γὰρ को पिछले तर्क से जोड़ने के लिए ‘क्योंकि’ और μὲν के स्वीकारात्मक बल को विरोध से पहले ‘सचमुच’ द्वारा व्यक्त किया गया है।
- source_word: ὠφελεῖ
  choice: लाभदायक है
  rationale: वास्तविक किंतु सशर्त लाभ या उपयोगिता को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐὰν νόμον πράσσῃς
  choice: यदि तुम व्यवस्था का पालन करते हो
  rationale: प्राकृतिक हिन्दी में व्यवस्था को व्यवहार में लाने का अर्थ देता है; ‘करते हो’ की अत्यधिक शाब्दिक और असहज अभिव्यक्ति से बचता है।
- source_word: παραβάτης νόμου ᾖς
  choice: यदि तुम व्यवस्था का उल्लंघन करते हो
  rationale: ग्रीक संज्ञात्मक कथन को स्वाभाविक हिन्दी क्रियात्मक रूप में व्यक्त करते हुए व्यवस्था के अतिक्रमण का स्पष्ट अर्थ सुरक्षित रखता है।
- source_word: ἡ περιτομή σου
  choice: तुम्हारा खतना
  rationale: प्रत्यक्ष संबोधन और अधिकारसूचक रचना को ज्यों का त्यों रखता है।
- source_word: ἀκροβυστία
  choice: खतनारहित दशा
  rationale: इस प्रसंग में शारीरिक अंग के बजाय खतने के वाचा-संबंधी विलोम को दर्शाता है और हिन्दी में समझने योग्य है।
- source_word: γέγονεν
  choice: बन गया है
  rationale: पूर्णकाल के परिवर्तन और उससे उत्पन्न वर्तमान स्थिति—दोनों को बनाए रखता है।
theological_decisions:
- issue: अंतिम वाक्यांश को शारीरिक परिवर्तन मानना या वाचा-संबंधी स्थिति का प्रबल उलटाव
  choice: ‘तुम्हारा खतना खतनारहित दशा बन गया है’—पौलुस की प्रबल उलटाव-वाली भाषा को मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘तुम्हारा खतना बिना खतने के समान माना जाता है’ या ‘बिना खतने के बराबर हो जाता है।’
  rationale: γέγονεν केवल मूल्यांकन या तुलना नहीं, बल्कि परिणामी स्थिति को व्यक्त करता है। इसलिए ‘माना जाता है’ और ‘के बराबर’ जैसे व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़े गए।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘व्यवस्था’ νόμος के लिए स्थापित बाइबिलीय शब्द है। अंतिम खंड की असामान्य तीव्रता जानबूझकर सुरक्षित रखी गई है, जबकि पादटिप्पणी उसके वाचा-संबंधी आशय को स्पष्ट करती है।
