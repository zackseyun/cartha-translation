  text: ὅταν γὰρ ἔθνη τὰ μὴ νόμον ἔχοντα φύσει τὰ τοῦ νόμου ⸀ποιῶσιν, οὗτοι νόμον μὴ ἔχοντες ἑαυτοῖς εἰσιν νόμος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/014.yaml
  text: For whenever Gentiles[a], who do not have the law, do by nature the things of the law, these, though not having the law[c][b], are a law to themselves.
translation:
  language: hi
  text: क्योंकि जब भी गैर-यहूदी[a], जिनके पास व्यवस्था नहीं है, स्वभाव से[b] व्यवस्था की बातों का पालन करते हैं[c], तो वे, व्यवस्था न रखते हुए भी, अपने लिए व्यवस्था हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों के लोग।”
    reason: lexical_alternative
  - marker: b
    text: या “सहज रूप से।”
    reason: lexical_alternative
  - marker: c
    text: या “व्यवस्था की अपेक्षाएँ पूरी करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη
  choice: गैर-यहूदी
  rationale: यहाँ पौलुस यहूदियों और मूसा की व्यवस्था से वंचित अन्यजातीय लोगों का अंतर कर रहा है; आधुनिक हिन्दी में ‘गैर-यहूदी’ यह अर्थ सामान्य पाठक तक स्पष्ट रूप से पहुँचाता है।
- source_word: νόμον / νόμου / νόμος
  choice: व्यवस्था
  rationale: सभी आवृत्तियों में ‘व्यवस्था’ रखकर मूसा की व्यवस्था के संदर्भ और अंतिम वाक्यांश के शब्द-साम्य—‘अपने लिए स्वयं व्यवस्था हैं’—दोनों को सुरक्षित रखा गया है।
- source_word: φύσει
  choice: स्वभाव से
  rationale: यह निकट और स्वाभाविक हिन्दी रूप है तथा यह तय नहीं करता कि आशय जन्मजात नैतिक बोध, सहज प्रवृत्ति या प्राकृतिक दशा में से कौन-सा है।
- source_word: τὰ τοῦ νόμου ποιῶσιν
  choice: व्यवस्था की बातों को करते हैं
  rationale: यह यूनानी अभिव्यक्ति की संरचना को पहचानने योग्य रखता है; अधिक सहज अर्थ ‘व्यवस्था की माँगें पूरी करते हैं’ पादटिप्पणी में दिया गया है।
- source_word: ἑαυτοῖς εἰσιν νόμος
  choice: अपने लिए स्वयं व्यवस्था हैं
  rationale: यह दत्तिव ἑαυτοῖς को स्वाभाविक हिन्दी में व्यक्त करता है और इसे स्वायत्त आत्म-विधान के स्पष्ट दावे में नहीं बदलता।
theological_decisions:
- issue: φύσει का नैतिक ज्ञान और विवेक से संबंध
  choice: मुख्य पाठ में ‘स्वभाव से’ रखकर अर्थ को खुला रखा गया है।
  alternative: ‘सहज रूप से’ या ‘अपनी स्वाभाविक समझ के अनुसार’
  rationale: अकेला φύσει जन्मजात नैतिक बोध, सहज प्रवृत्ति अथवा प्राकृतिक दशा में से किसी एक व्याख्या को निर्णायक नहीं बनाता; इसलिए धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: ‘अपने लिए स्वयं व्यवस्था हैं’ का आशय
  choice: पौलुस के रूपक और ‘व्यवस्था’ की पुनरावृत्ति को यथावत रखा गया है।
  alternative: ‘वे अपने ही लिए व्यवस्था का काम करते हैं’
  rationale: व्याख्यात्मक विस्तार यह संकेत दे सकता है कि वे स्वयं अपने नैतिक नियम बनाते हैं; यूनानी पाठ इतना स्पष्ट दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘व्यवस्था’ बाइबलीय हिन्दी में νόμος के लिए परिचित शब्द है। वाक्य की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है, क्योंकि वही पौलुस के तर्क और शब्द-साम्य का अंग है।
