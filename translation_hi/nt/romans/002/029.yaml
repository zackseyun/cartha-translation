source:
  edition: SBLGNT
  text: ἀλλ’ ὁ ἐν τῷ κρυπτῷ Ἰουδαῖος, καὶ περιτομὴ καρδίας ἐν πνεύματι οὐ γράμματι, οὗ ὁ ἔπαινος οὐκ ἐξ ἀνθρώπων ἀλλ’ ἐκ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/029.yaml
  text: But the Jew is one inwardly[a], and circumcision is of the heart—by the Spirit, not by the letter—whose praise is not from people but from God.
translation:
  language: hi
  text: बल्कि यहूदी वह है जो भीतर से यहूदी है, और खतना हृदय का है—आत्मा में, अक्षर में नहीं। उसकी प्रशंसा मनुष्यों से नहीं, बल्कि परमेश्वर से होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ κρυπτῷ
  choice: भीतर से
  rationale: यह पौलुस के बाहरी और भीतरी के विरोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; इसका अर्थ केवल गुप्त होना नहीं है।
- source_word: Ἰουδαῖος
  choice: यहूदी
  rationale: यहाँ संदर्भ भौगोलिक पहचान से अधिक वाचा और धार्मिक पहचान का है।
- source_word: περιτομὴ καρδίας
  choice: हृदय का खतना
  rationale: यह मूल रूपक को बनाए रखते हुए हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐν πνεύματι
  choice: पवित्र आत्मा के द्वारा
  rationale: पौलुस के यहाँ आत्मा और लिखित व्यवस्था का विरोध पवित्र आत्मा के कार्य की ओर संकेत करता है; फिर भी व्याकरणगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: οὐ γράμματι
  choice: न कि लिखित व्यवस्था के द्वारा
  rationale: शाब्दिक 'अक्षर' सामान्य पाठक के लिए अस्पष्ट हो सकता है; यहाँ γράμμα बाहरी लिखित विधान की ओर संकेत करता है।
- source_word: οὗ ὁ ἔπαινος
  choice: ऐसे व्यक्ति की प्रशंसा
  rationale: सम्बन्धवाचक सर्वनाम का आशय भीतर से यहूदी व्यक्ति से है; हिन्दी में यह रूप अधिक स्पष्ट और सहज है।
- source_word: ἐξ ἀνθρώπων
  choice: मनुष्यों से
  rationale: यह बहुवचन के सामान्य मानवीय अर्थ को बिना केवल पुरुषों तक सीमित किए व्यक्त करता है।
- source_word: ἐκ τοῦ θεοῦ
  choice: परमेश्वर से
  rationale: यह स्रोत वाक्यांश का सीधा और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: πνεύματι पवित्र आत्मा को दर्शाता है या मानवीय आत्मा/आंतरिक आध्यात्मिक वास्तविकता को
  choice: पवित्र आत्मा के द्वारा
  alternative: आत्मिक रूप से / आत्मा में
  rationale: पौलुस के व्यापक प्रयोग में आत्मा और लिखित विधान का विरोध पवित्र आत्मा की ओर अधिक संभावित संकेत करता है, पर पद का रूप पूर्णतः निर्णायक नहीं है; इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'सच्चा' मूल में पृथक शब्द नहीं है, पर बाहरी और भीतरी यहूदी पहचान के निहित विरोध को हिन्दी में स्वाभाविक ढंग से स्पष्ट करता है। 'लिखित व्यवस्था' को 'अक्षर' की अपेक्षा अर्थ-स्पष्टता के लिए चुना गया है।
