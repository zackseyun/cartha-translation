source:
  edition: SBLGNT
  text: κατὰ δὲ τὴν σκληρότητά σου καὶ ἀμετανόητον καρδίαν θησαυρίζεις σεαυτῷ ὀργὴν ἐν ἡμέρᾳ ὀργῆς καὶ ⸀ἀποκαλύψεως δικαιοκρισίας τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/005.yaml
  text: But because of your hardness and unrepentant heart, you are storing up wrath for yourself on the day of wrath and the revelation of God’s righteous judgment,
translation:
  language: hi
  text: परन्तु अपनी कठोरता और पश्चाताप न करने वाले हृदय के कारण, तुम क्रोध और परमेश्वर के न्यायपूर्ण निर्णय[a] के प्रकट होने के दिन अपने लिए क्रोध जमा कर रहे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “परमेश्वर का न्यायसंगत निर्णय।”'
    reason: δικαιοκρισία का वैकल्पिक, अधिक शाब्दिक अनुवाद।
lexical_decisions:
- source_word: κατὰ δὲ
  choice: परन्तु … के कारण
  rationale: δέ का हल्का विरोध ‘परन्तु’ से और κατά का प्रसंगगत कारणात्मक भाव ‘के कारण’ से स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: σκληρότητά
  choice: कठोरता
  rationale: यह नैतिक असंवेदनशीलता के मूल रूपक को बनाए रखता है और हिन्दी में परिचित बाइबलीय अभिव्यक्ति है।
- source_word: ἀμετανόητον καρδίαν
  choice: पश्चाताप न करनेवाला हृदय
  rationale: यह ‘हृदय’ की मूल छवि को सुरक्षित रखता है और ἀμετανόητος के अर्थ को सरल, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θησαυρίζεις
  choice: जमा कर रहे हो
  rationale: क्रिया में समय के साथ संचय करने का भाव है; नकारात्मक संदर्भ में ‘जमा करना’ स्वाभाविक और स्पष्ट है।
- source_word: σεαυτῷ
  choice: अपने लिए
  rationale: आत्मवाचक सम्प्रदान कारक उस परिणाम को स्वयं अपने ऊपर लाने का भाव देता है।
- source_word: ὀργή
  choice: क्रोध
  rationale: यह परमेश्वर के न्यायिक रोष की गंभीरता को स्पष्ट रखता है और आधुनिक हिन्दी में सुबोध है।
- source_word: ἐν ἡμέρᾳ ὀργῆς καὶ ἀποκαλύψεως
  choice: क्रोध और … के प्रकट होने के दिन
  rationale: ἐν ἡμέρᾳ का कालवाचक अर्थ ‘के दिन’ से व्यक्त किया गया है, जबकि ‘क्रोध’ और ‘प्रकट होने’ की समन्वित संज्ञात्मक रचना यथासंभव सुरक्षित है।
- source_word: δικαιοκρισίας τοῦ θεοῦ
  choice: परमेश्वर के न्यायपूर्ण निर्णय
  rationale: δικαιοκρισία में निर्णय और उसकी नैतिक न्यायसंगतता दोनों निहित हैं; ‘न्यायपूर्ण निर्णय’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: क्या संज्ञात्मक काल-वाक्यांश को ‘जब परमेश्वर… प्रकट करेगा’ जैसे स्पष्ट उपवाक्य में बदला जाए
  choice: ‘क्रोध और परमेश्वर के न्यायपूर्ण निर्णय के प्रकट होने के दिन’ के रूप में संज्ञात्मक संरचना बनाए रखना
  alternative: ‘क्रोध के दिन, जब परमेश्वर का न्यायपूर्ण निर्णय प्रकट होगा’
  rationale: वैकल्पिक रूप अर्थ को स्पष्ट करता है, पर यूनानी में कोई स्पष्ट सीमित क्रिया नहीं है। चुना हुआ रूप मूल की संरचना और उसके तनाव को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘कठोरता’, ‘हृदय’, ‘क्रोध’ और ‘प्रकट होने’ जैसे मूल रूपकों और धर्मवैचारिक शब्दों को अनावश्यक व्याख्या के बिना रखा गया है।
