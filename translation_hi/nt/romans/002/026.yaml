id: ROM.2.26
reference: Romans 2:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν οὖν ἡ ἀκροβυστία τὰ δικαιώματα τοῦ νόμου φυλάσσῃ, ⸀οὐχ ἡ ἀκροβυστία αὐτοῦ εἰς περιτομὴν λογισθήσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/026.yaml
  text: So then[a], if the uncircumcised man keeps the requirements of the law, will not his uncircumcision be counted as circumcision?
translation:
  language: hi
  text: इसलिए, यदि कोई खतनारहित व्यक्ति व्यवस्था की माँगों का पालन करता है, तो क्या उसकी खतनारहित दशा खतना नहीं गिनी जाएगी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप में: “यदि खतनारहित दशा व्यवस्था की माँगों का पालन करे, तो क्या उसकी खतनारहित दशा खतना नहीं गिनी जाएगी?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: खतनारहित व्यक्ति / उसकी खतनारहित दशा
  rationale: पहले प्रयोग में संज्ञा व्यक्ति को सूचित करती है, इसलिए स्वाभाविक हिन्दी में ‘खतनारहित व्यक्ति’ रखा गया है; दूसरे प्रयोग में αὐτοῦ के साथ उसकी अवस्था अभिप्रेत है, इसलिए ‘उसकी खतनारहित दशा’ मूल की शब्द-पुनरावृत्ति और अर्थभेद दोनों को यथासंभव सुरक्षित रखती है।
- source_word: δικαιώματα
  choice: माँगों
  rationale: बहुवचन यहाँ उन बातों को सूचित करता है जिनकी व्यवस्था अपेक्षा करती है। ‘माँगों’ आधुनिक, स्पष्ट हिन्दी है और अनावश्यक अतिरिक्त धार्मिक अर्थ नहीं जोड़ता।
- source_word: νόμου
  choice: व्यवस्था की
  rationale: पौलुस के संदर्भ में νόμος मूसा की व्यवस्था को सूचित करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में परिचित और उपयुक्त है।
- source_word: φυλάσσῃ
  choice: पालन करता है
  rationale: आज्ञाओं अथवा व्यवस्था की माँगों के संबंध में ‘पालन करना’ स्वाभाविक हिन्दी है और संदर्भगत अर्थ को ‘रक्षा करना’ से अधिक स्पष्ट करता है।
- source_word: λογισθήσεται
  choice: गिनी जाएगी
  rationale: यह लेखे या मान्यता की भाषा को बनाए रखता है और हिन्दी में सहज है।
- source_word: εἰς περιτομήν
  choice: खतना
  rationale: λογίζομαι के साथ यह वाक्यांश किसी अवस्था को खतने के रूप में गिने जाने का भाव देता है; हिन्दी में ‘खतना गिनी जाएगी’ संक्षिप्त और स्वाभाविक है।
- source_word: οὐχ
  choice: क्या ... नहीं
  rationale: नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी का ‘क्या ... नहीं’ वही आलंकारिक बल बनाए रखता है।
theological_decisions:
- issue: खतनारहित दशा को खतना गिना जाना
  choice: लेखांकन/मान्यता की भाषा को ‘गिनी जाएगी’ के रूप में बनाए रखा गया
  alternative: ‘खतना मानी जाएगी’
  rationale: ‘गिनी जाएगी’ λογίζομαι के लेखांकन-संबंधी रूपक को अधिक निकटता से सुरक्षित रखता है और इस पद से आगे कोई धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘खतनारहित’ मूल संज्ञा की पुनरावृत्ति को यथासंभव बनाए रखता है, जबकि मुख्य पाठ में व्यक्ति और अवस्था के बीच स्वाभाविक हिन्दी भेद किया गया है।
