    reason: alternative_reading
lexical_decisions:
- source_word: γινώσκεις
  choice: जानते हो
  rationale: वर्तमानकालीन क्रिया का सीधा और स्वाभाविक हिन्दी रूप; सक्रिय ज्ञान को व्यक्त करता है।
- source_word: τὸ θέλημα
  choice: उसकी इच्छा
  rationale: यूनानी में शाब्दिक रूप से ‘इच्छा’ है, पर प्रसंग में इसका संबंध परमेश्वर से है; ‘उसकी’ हिन्दी में निहित संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: δοκιμάζεις
  choice: परखकर स्वीकार करते हो
  rationale: क्रिया में जाँचने और जाँच के बाद योग्य ठहराने—दोनों का भाव हो सकता है; संयुक्त अभिव्यक्ति इस मूल्यांकनात्मक अर्थ को सुरक्षित रखती है।
- source_word: τὰ διαφέροντα
  choice: उत्तम बातें
  rationale: इस पदबंध का मुहावरेदार अर्थ ‘जो श्रेष्ठ/उत्तम हैं’ हो सकता है, यद्यपि अधिक शाब्दिक अर्थ ‘जो भिन्न हैं’ भी संभव है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: κατηχούμενος
  choice: क्योंकि तुम्हें शिक्षा मिलती है
  rationale: निष्क्रिय कृदन्त यहाँ ज्ञान और विवेक का आधार बता सकता है; कारणवाचक हिन्दी वाक्य सहज है और शिक्षण का भाव बनाए रखता है।
- source_word: ἐκ τοῦ νόμου
  choice: व्यवस्था से
  rationale: ἐκ स्रोत को दर्शाता है; ‘व्यवस्था से’ संक्षिप्त, स्वाभाविक और मूल के निकट है।
theological_decisions:
- issue: τὸ θέλημα में स्वत्वसूचक सर्वनाम का अभाव
  choice: मुख्य पाठ में ‘उसकी इच्छा’
  alternative: ‘इच्छा’
  rationale: पिछले प्रसंग में परमेश्वर निहित संदर्भ है; सर्वनाम स्पष्टता देता है, बिना किसी संप्रदायगत व्याख्या को जोड़ने के।
- issue: τὰ διαφέροντα की अर्थगत अस्पष्टता
  choice: ‘उत्तम बातें’
  alternative: ‘भिन्न बातों’ या ‘जो बातें अलग हैं’
  rationale: नैतिक विवेक के प्रसंग में श्रेष्ठ बातों को पहचानने का अर्थ संभावित है, पर मूल में ‘भिन्न होने’ का अर्थ भी वास्तविक है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। पद पिछले वाक्य की शर्तात्मक संरचना का अंश है, इसलिए आरम्भ में ‘और’ रखा गया है। ‘व्यवस्था’ पौलुस के νόμος के लिए परिचित बाइबलीय शब्द है।
