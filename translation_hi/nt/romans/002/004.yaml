reference: Romans 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ τοῦ πλούτου τῆς χρηστότητος αὐτοῦ καὶ τῆς ἀνοχῆς καὶ τῆς μακροθυμίας καταφρονεῖς, ἀγνοῶν ὅτι τὸ χρηστὸν τοῦ θεοῦ εἰς μετάνοιάν σε ἄγει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/004.yaml
  text: Or do you despise the riches of his kindness and forbearance and patience[a], not knowing that God's kindness is leading you to repentance?
translation:
  language: hi
  text: या क्या तुम उसकी दयालुता, सहनशीलता और धीरज की प्रचुरता को तुच्छ समझते हो, यह न जानते हुए कि परमेश्वर की दयालुता तुम्हें पश्चात्ताप की ओर ले जा रही है?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πλούτου
  choice: भरपूरी
  rationale: यह शब्द इन गुणों की प्रचुरता का रूपक स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘धन’ यहाँ कम सहज होता।
- source_word: χρηστότητος / τὸ χρηστόν
  choice: दयालुता
  rationale: दोनों प्रयोगों में एक ही शब्द रखकर यूनानी की शब्दगत संगति बचाई गई है और परमेश्वर के कृपालु व्यवहार का संबंधपरक भाव व्यक्त हुआ है।
- source_word: ἀνοχῆς
  choice: सहनशीलता
  rationale: यह न्याय को तत्काल लागू न करके सह लेने या रोक रखने का भाव व्यक्त करता है।
- source_word: μακροθυμίας
  choice: धीरज
  rationale: यह आधुनिक और सहज हिन्दी में लंबे समय तक धैर्य रखने का भाव देता है।
- source_word: καταφρονεῖς
  choice: तुच्छ समझते हो
  rationale: यह यूनानी क्रिया की तीखी फटकार और किसी बात को कम मूल्य का मानने का भाव सुरक्षित रखता है।
- source_word: ἀγνοῶν
  choice: क्या तुम नहीं जानते
  rationale: कृदंत को स्वाभाविक हिन्दी प्रश्न के रूप में व्यक्त किया गया है, बिना इसे जानबूझकर अनदेखा करना मान लिए।
- source_word: εἰς μετάνοιάν
  choice: पश्चात्ताप की ओर
  rationale: ‘की ओर’ εἰς की दिशात्मक शक्ति को बचाता है; ‘पश्चात्ताप’ पाप से फिरने के अर्थ में आधुनिक हिन्दी का व्यापक और सुबोध शब्द है।
- source_word: ἄγει
  choice: ले जा रही है
  rationale: वर्तमान काल परमेश्वर की दयालुता की जारी दिशात्मक क्रिया के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: χρηστότης / χρηστόν को ‘दयालुता’ या ‘भलाई’ के रूप में प्रस्तुत करना
  choice: दोनों स्थानों पर ‘दयालुता’
  alternative: दोनों स्थानों पर ‘भलाई’
  rationale: संदर्भ में परमेश्वर द्वारा न्याय को रोककर पापी के प्रति कृपालु व्यवहार करने पर बल है; ‘दयालुता’ इस संबंधपरक भाव को अधिक स्पष्ट रखती है, जबकि ‘भलाई’ को पादटिप्पणी में वास्तविक शाब्दिक विकल्प के रूप में दिया गया है।
- issue: μετάνοια का हिन्दी रूप
  choice: पश्चात्ताप
  alternative: मन फिराव
  rationale: ‘पश्चात्ताप’ सामान्य आधुनिक हिन्दी में अधिक सहज है और यहाँ पाप के प्रति बदली हुई दिशा का अर्थ ग्रहण कर सकता है; अनुवाद इसे केवल भावनात्मक पछतावे तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी का एक ही लंबा प्रश्न हिन्दी में दो प्रश्नों में बाँटा गया है, पर वैकल्पिक ‘या’ और फटकार की निरंतरता सुरक्षित है।
