  yaml_path: translation/nt/romans/002/011.yaml
  text: For there is no partiality with God[a].
translation:
  language: hi
  text: क्योंकि परमेश्वर के यहाँ कोई पक्षपात नहीं है[a]।
  philosophy: optimal-equivalence
  footnotes:
