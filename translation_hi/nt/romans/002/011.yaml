lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; हिन्दी में “क्योंकि” इसके व्याख्यात्मक कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσωπολημψία
  choice: पक्षपात
  rationale: यह शब्द पद, प्रतिष्ठा या बाहरी बातों के आधार पर अनुचित भेदभाव या तरजीह देने को दर्शाता है। “पक्षपात” आधुनिक हिन्दी में स्वाभाविक है और नैतिक-न्यायिक अर्थ बनाए रखता है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर के यहाँ
  rationale: यह प्रयोग परमेश्वर के संबंध या उपस्थिति में ऐसी बात के न होने को व्यक्त करता है। “परमेश्वर के यहाँ” यूनानी संरचना के निकट रहते हुए हिन्दी में सहज है।
- source_word: οὐ γάρ ἐστιν ... παρὰ τῷ θεῷ
  choice: क्योंकि परमेश्वर के यहाँ कोई पक्षपात नहीं है।
  rationale: अस्तित्वसूचक यूनानी रचना को सक्रिय कथन “परमेश्वर पक्षपात नहीं करता” में बदलने के बजाय बनाए रखा गया है, फिर भी वाक्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर की निष्पक्षता की अभिव्यक्ति
  choice: इसे परमेश्वर के यहाँ पक्षपात के पूर्ण अभाव के सामान्य कथन के रूप में प्रस्तुत किया गया है।
  alternative: “क्योंकि परमेश्वर पक्षपात नहीं करता।”
  rationale: दोनों रूप समान मूल सत्य बताते हैं, पर चुना हुआ रूप यूनानी अस्तित्वसूचक वाक्य-विन्यास को अधिक निकटता से सुरक्षित रखता है और ऐसा सक्रिय कार्य नहीं जोड़ता जो मूल में स्पष्ट रूप से क्रिया के रूप में नहीं कहा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “परमेश्वर के यहाँ” सामान्य पाठक के लिए सहज है और मूल की संबंधसूचक संरचना को भी बनाए रखता है।
