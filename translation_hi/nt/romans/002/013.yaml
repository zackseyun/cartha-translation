id: ROM.2.13
reference: Romans 2:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ οἱ ἀκροαταὶ ⸀νόμου δίκαιοι παρὰ ⸀τῷ θεῷ, ἀλλ’ οἱ ποιηταὶ ⸁νόμου δικαιωθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/013.yaml
  text: For it is not the hearers of the law who are righteous before God[a], but the doers of the law who will be justified.
translation:
  language: hi
  text: क्योंकि परमेश्वर की दृष्टि में व्यवस्था को सुननेवाले धर्मी नहीं हैं, बल्कि व्यवस्था का पालन करनेवाले ही धर्मी ठहराए जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी घोषित किए जाएँगे”; अथवा, “सही सिद्ध किए जाएँगे।”
    reason: δικαιωθήσονται के न्यायिक अर्थ के वैकल्पिक हिन्दी रूपों को दर्शाने के लिए।
lexical_decisions:
- source_word: ἀκροαταὶ
  choice: सुननेवाले
  rationale: यह संज्ञात्मक रूप को स्वाभाविक हिन्दी में व्यक्त करता है और ‘पालन करनेवाले’ के साथ पौलुस के सुनने और करने के विरोध को बनाए रखता है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: यूनानी में पदबंध निर्धारक के बिना है, फिर भी इस संदर्भ में ‘व्यवस्था’ उस ज्ञात व्यवस्था को स्वाभाविक रूप से सूचित करती है जिसकी चर्चा चल रही है; हिन्दी में अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: यह परमेश्वर के न्याय में सही ठहरने की स्थिति को संक्षेप में व्यक्त करता है और रोमियों में प्रयुक्त धार्मिक-न्यायिक शब्दावली से संगति रखता है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर की दृष्टि में
  rationale: यह पदबंध परमेश्वर के मूल्यांकन अथवा न्याय के सामने व्यक्ति की स्थिति का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: ποιηταὶ
  choice: पालन करनेवाले
  rationale: शाब्दिक ‘करनेवाले’ की अपेक्षा व्यवस्था के संबंध में ‘पालन करनेवाले’ वर्तमान हिन्दी में अधिक स्पष्ट और स्वाभाविक है, जबकि सुनने मात्र और आचरण करने का विरोध सुरक्षित रहता है।
- source_word: δικαιωθήσονται
  choice: धर्मी ठहराए जाएँगे
  rationale: यह भविष्यकालीन कर्मवाच्य को बनाए रखता है और δικαιόω की न्यायिक तथा धर्मवैज्ञानिक अर्थ-छाया को किसी एक संकीर्ण व्याख्या तक सीमित नहीं करता।
theological_decisions:
- issue: δικαιωθήσονται की पौलुसी न्यायिक और धर्मवैज्ञानिक अर्थ-व्याप्ति
  choice: धर्मी ठहराए जाएँगे
  alternative: धर्मी घोषित किए जाएँगे; सही सिद्ध किए जाएँगे
  rationale: मुख्य पाठ का रूप पारंपरिक शब्दावली से जुड़ा रहते हुए कर्मवाच्य और भावी न्याय के संदर्भ को सुरक्षित रखता है। विकल्प यह दिखाते हैं कि क्रिया में घोषणा अथवा निर्दोष/सही सिद्ध होने की अर्थ-छाया भी हो सकती है, बिना यह तय किए कि यहाँ केवल कौन-सी छाया अभिप्रेत है।
- issue: व्यवस्था के पालन और धर्मी ठहराए जाने के संबंध को व्याख्यात्मक रूप से सीमित करना
  choice: यूनानी वाक्य के सीधे भविष्यकालीन कथन को बनाए रखना
  alternative: ऐसा विस्तार जोड़ना कि पालन धर्मी ठहराए जाने का आधार, प्रमाण या फल है
  rationale: पद स्वयं इन धर्मवैज्ञानिक संबंधों को स्पष्ट नहीं करता। इसलिए अनुवाद किसी संप्रदायगत निष्कर्ष को पाठ में नहीं जोड़ता और संदर्भ में उपस्थित तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था को सुननेवाले’ तथा ‘व्यवस्था का पालन करनेवाले’ का समानांतर ढाँचा यूनानी विरोध को स्पष्ट करता है; दूसरे खंड में ‘ही’ विरोध की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
