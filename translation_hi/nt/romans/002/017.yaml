  text: ⸂Εἰ δὲ⸃ σὺ Ἰουδαῖος ἐπονομάζῃ καὶ ἐπαναπαύῃ ⸀νόμῳ καὶ καυχᾶσαι ἐν θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/017.yaml
  text: But if you call yourself a Jew and rely on the law and boast in God[b][a],
translation:
  language: hi
  text: पर यदि तुम अपने आपको यहूदी कहते हो[a], व्यवस्था पर भरोसा रखते हो[b], और परमेश्वर पर गर्व करते हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहूदी कहलाते हो’ अथवा ‘यहूदी नाम धारण करते हो।’
    reason: lexical_alternative
  - marker: b
    text: या ‘व्यवस्था पर टिके रहते हो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ δὲ
  choice: पर यदि
  rationale: ‘यदि’ शर्त को और ‘पर’ पौलुस के तर्क में हल्के विरोध अथवा संक्रमण को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἰουδαῖος
  choice: यहूदी
  rationale: रोमियों में यह शब्द मुख्यतः जातीय-धार्मिक पहचान बताता है, केवल भौगोलिक पहचान नहीं।
- source_word: ἐπονομάζῃ
  choice: अपने आपको ... कहते हो
  rationale: मध्यवाच्य रूप में स्वयं इस पदनाम को धारण करने या इसका दावा करने का भाव है; यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक और आलंकारिक धार वाली है।
- source_word: ἐπαναπαύῃ
  choice: भरोसा रखते हो
  rationale: यहाँ शारीरिक विश्राम नहीं, व्यवस्था पर निर्भरता और विश्वास का भाव है।
- source_word: νόμῳ
  choice: व्यवस्था
  rationale: संदर्भ में यह मूसा की व्यवस्था की परिचित वाचा-संबंधी श्रेणी को सूचित करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट है।
- source_word: καυχᾶσαι
  choice: गर्व करते हो
  rationale: यह पौलुस के नैतिक रूप से आवेशित ‘boast/glory’ भाव को सहज आधुनिक हिन्दी में व्यक्त करता है, जिसका मूल्यांकन आगे के संदर्भ पर निर्भर रहता है।
- source_word: ἐν θεῷ
  choice: परमेश्वर पर
  rationale: यह ‘परमेश्वर को अपने गर्व या विश्वास का आधार बनाना’ व्यक्त करता है और ἐν की संबंधात्मक अस्पष्टता को अत्यधिक व्याख्यायित नहीं करता।
theological_decisions:
- issue: व्यवस्था पर निर्भरता के प्रति पौलुस का मूल्यांकन
  choice: ‘भरोसा रखते हो’ द्वारा कथन को वर्णनात्मक रखा गया है
  alternative: ‘झूठा भरोसा रखते हो’ जैसे स्पष्ट नकारात्मक शब्द जोड़ना
  rationale: इस पद में आलोचनात्मक संदर्भ उपस्थित है, पर मूल पाठ स्वयं ‘झूठा’ नहीं कहता; इसलिए मूल्यांकन को आगामी तर्क से उभरने दिया गया है।
- issue: परमेश्वर में/पर गर्व करने का नैतिक अर्थ
  choice: ‘परमेश्वर पर गर्व करते हो’
  alternative: ‘परमेश्वर के विषय में डींग मारते हो’
  rationale: καυχᾶσαι संदर्भानुसार सकारात्मक या नकारात्मक छाया ले सकता है। ‘गर्व’ उस तनाव को बनाए रखता है, जबकि ‘डींग’ पहले ही स्पष्ट निंदा ठहरा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण। पद अगले वाक्यांशों में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है। सभी पादटिप्पणी-चिह्न संबंधित मुख्य-पाठ वाक्यांश के तुरंत बाद दिए गए हैं।
