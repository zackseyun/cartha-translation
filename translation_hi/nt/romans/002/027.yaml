source:
  edition: SBLGNT
  text: καὶ κρινεῖ ἡ ἐκ φύσεως ἀκροβυστία τὸν νόμον τελοῦσα σὲ τὸν διὰ γράμματος καὶ περιτομῆς παραβάτην νόμου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/027.yaml
  text: And the uncircumcised person by nature[a], if he fulfills the law, will judge you who, with the letter and circumcision[b], are a transgressor of the law.
translation:
  language: hi
  text: और जो व्यक्ति स्वभाव से खतनारहित है[a] और व्यवस्था का पालन करता है, वह तुम्हारा न्याय करेगा—तुम्हारा, जो लिखित विधान और खतना रखते हुए भी[b] व्यवस्था का उल्लंघन करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘खतनारहित अवस्था’; यहाँ आशय खतनारहित व्यक्ति से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘अक्षर और खतने के द्वारा’; यहाँ ‘अक्षर’ व्यवस्था के लिखित रूप को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκροβυστία
  choice: खतनारहित व्यक्ति
  rationale: मूल संज्ञा का शाब्दिक अर्थ ‘खतनारहित अवस्था’ है, पर यहाँ वह लक्षणा द्वारा खतनारहित व्यक्ति को दर्शाती है। यह अनुवाद व्यक्तिगत संदर्भ स्पष्ट करता है और मूल में अनुपस्थित व्यापक जातीय पद ‘गैर-यहूदी’ नहीं जोड़ता।
- source_word: ἐκ φύσεως
  choice: स्वभाव से
  rationale: यह वाक्यांश प्राकृतिक रूप से खतनारहित होने और खतना प्राप्त होने के बीच पौलुस के विरोध को निकटता से बनाए रखता है।
- source_word: τελοῦσα
  choice: पालन करता है
  rationale: वर्तमान कृदंत व्यवस्था को व्यवहार में पूरा करने या मानने का भाव देता है। हिन्दी में ‘पालन करता है’ स्वाभाविक है और कृदंत को अनावश्यक रूप से निश्चित शर्त में नहीं बदलता।
- source_word: νόμον
  choice: व्यवस्था
  rationale: संदर्भ में यह मूसा की व्यवस्था को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट और स्थापित पद है।
- source_word: διὰ γράμματος
  choice: लिखित विधान रखते हुए भी
  rationale: γράμμα व्यवस्था के लिखित रूप को सूचित करता है। διὰ का साधन/परिस्थिति-संबंध हिन्दी में प्रसंगानुकूल ‘रखते हुए भी’ से स्वाभाविक रूप में व्यक्त किया गया है; ‘भी’ इस विरोध को स्पष्ट करता है कि ये लाभ उल्लंघन को नहीं रोकते। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: περιτομῆς
  choice: खतना
  rationale: वाचा के चिह्न के लिए सीधा और प्रचलित हिन्दी पद।
- source_word: παραβάτην νόμου
  choice: व्यवस्था का उल्लंघन करते हो
  rationale: यह νόμος के साथ स्पष्ट संबंध बनाए रखता है और हिन्दी में ‘व्यवस्था के उल्लंघनकर्ता’ की अपेक्षा अधिक स्वाभाविक वाक्य बनाता है।
theological_decisions:
- issue: क्या ἀκροβυστία को स्पष्ट जातीय पहचान ‘गैर-यहूदी’ के रूप में अनूदित किया जाए
  choice: मुख्य पाठ में संकीर्ण अभिव्यक्ति ‘खतनारहित व्यक्ति’ रखी गई है।
  alternative: गैर-यहूदी
  rationale: पूरा प्रसंग यहूदियों और गैर-यहूदियों से संबंधित है, फिर भी इस पद में पौलुस का प्रत्यक्ष शब्द-विरोध खतना और खतनारहित अवस्था के बीच है। अनुवाद उसी पाठगत बल को बनाए रखता है।
- issue: τελοῦσα को शर्त के रूप में स्पष्ट करना
  choice: ‘और व्यवस्था का पालन करता है’ द्वारा कृदंत का वर्णनात्मक भाव रखा गया है।
  alternative: यदि वह व्यवस्था का पालन करे
  rationale: संदर्भ में शर्तार्थ संभव है, पर यूनानी में स्पष्ट शर्तवाचक संयोजक नहीं है। मुख्य पाठ वास्तविक पालन का वर्णन बनाए रखता है और सम्भावित अर्थ को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘व्यवस्था’, ‘खतना’ और ‘उल्लंघन’ जैसे परिचित बाइबलीय पद रखे गए हैं। सीधे संबोधन ‘तुम्हारा/तुम’ से यूनानी एकवचन दूसरे पुरुष का वाग्मयिक बल सुरक्षित रहता है।
