  text: ἐν ⸂ἡμέρᾳ ὅτε⸃ ⸀κρίνει ὁ θεὸς τὰ κρυπτὰ τῶν ἀνθρώπων κατὰ τὸ εὐαγγέλιόν μου διὰ ⸂Χριστοῦ Ἰησοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/016.yaml
  text: on the day when God judges the secrets of people through Messiah Jesus[a], according to my gospel.
translation:
  language: hi
  text: उस दिन, जब परमेश्वर मेरे सुसमाचार के अनुसार मसीह यीशु[a] के द्वारा लोगों की छिपी हुई बातों का न्याय करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “ख़्रीस्त यीशु।”'
    reason: Χριστός के पारंपरिक वैकल्पिक रूप को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: ἐν ἡμέρᾳ ὅτε
  choice: उस दिन, जब
  rationale: यह यूनानी कालवाचक रचना और न्याय के निश्चित दिन—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κρίνει
  choice: न्याय करेगा
  rationale: यूनानी में वर्तमानकाल है, पर प्रसंग भविष्य के न्याय का है; हिन्दी में भविष्यकाल अधिक स्वाभाविक और स्पष्ट है।
- source_word: τὰ κρυπτὰ τῶν ἀνθρώπων
  choice: लोगों की छिपी हुई बातों
  rationale: यह मनुष्यों से संबंधित गुप्त या अप्रकट बातों के व्यापक अर्थ को सुरक्षित रखता है और केवल मन की बातों तक सीमित नहीं करता।
- source_word: κατὰ τὸ εὐαγγέλιόν μου
  choice: मेरे सुसमाचार के अनुसार
  rationale: यह पौलुस के व्यक्तिगत संबंधसूचक सर्वनाम और κατὰ के मानक अर्थ को सीधे बनाए रखता है।
- source_word: διὰ Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु के द्वारा
  rationale: सम्बन्धकारक के साथ διά माध्यम या कर्तृत्व व्यक्त करता है; यहाँ Χριστός की उपाधिगत शक्ति को ‘मसीह’ सुरक्षित रखता है।
theological_decisions:
- issue: Χριστοῦ को उपाधि मानकर अनुवाद करना या पारंपरिक नाम-जैसा रूप रखना
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: इस प्रसंग में Χριστός की उपाधिगत अर्थ-शक्ति बनी हुई है; इसलिए मुख्य पाठ में ‘मसीह’ रखा गया है और पारंपरिक रूप पादटिप्पणी में दिया गया है।
- issue: न्याय में διὰ Χριστοῦ Ἰησοῦ की भूमिका
  choice: मसीह यीशु के द्वारा
  alternative: मसीह यीशु के माध्यम से
  rationale: ‘के द्वारा’ यूनानी में व्यक्त agency/instrumentality की अस्पष्टता को बनाए रखता है और यह अनावश्यक रूप से निर्धारित नहीं करता कि वाक्यांश केवल साधन बताता है या प्रतिनिधिक कर्तृत्व।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। वाक्य रोमियों 2:16 की पूर्ववर्ती बात से व्याकरणिक रूप से जुड़ा हुआ है; पद को अलग पढ़ने पर भी उसका भविष्यकालीन न्याय-संदर्भ स्पष्ट रहता है।
