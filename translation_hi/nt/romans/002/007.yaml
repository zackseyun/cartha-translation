  text: eternal life to those who by perseverance in doing good seek glory and honor and immortality.
translation:
  language: hi
  text: जो लोग अच्छे काम में धीरज के साथ लगे रहकर महिमा, आदर और अमरता की खोज करते हैं, उन्हें वह अनन्त जीवन देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὑπομονὴν ἔργου ἀγαθοῦ
  choice: भले काम करते हुए धीरज के साथ
  rationale: यह वाक्यांश अच्छे कार्य में निरन्तर बने रहने का भाव देता है। ‘भले काम करते हुए’ स्वाभाविक आधुनिक हिन्दी है और संशोधित अंग्रेज़ी परामर्श-पाठ के अनुरूप भी है।
- source_word: δόξαν καὶ τιμὴν καὶ ἀφθαρσίαν
  choice: महिमा, आदर और अमरता
  rationale: तीनों समानान्तर संज्ञाओं को अलग रखा गया है। ἀφθαρσία का मूल भाव क्षय या विनाश से मुक्त अवस्था है; इस प्रसंग में ‘अमरता’ सहज और सटीक है।
- source_word: ζητοῦσιν
  choice: खोज करते हैं
  rationale: वर्तमान कृदन्त का सतत और लक्ष्याभिमुख भाव सुरक्षित रहता है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह प्रचलित, स्पष्ट और स्रोत के अर्थ के अनुरूप धार्मिक अभिव्यक्ति है।
theological_decisions:
- issue: ‘अनन्त जीवन’ का वाक्यगत सम्बन्ध
  choice: ‘उन्हें वह अनन्त जीवन देगा’ के रूप में 2:6 से आए मुख्य क्रियापद और कर्ता को स्पष्ट किया गया
  alternative: खंडित रूप में केवल ‘अनन्त जीवन’ रखना
  rationale: यूनानी 2:7, 2:6 के ‘वह प्रतिफल देगा’ पर निर्भर है। हिन्दी में पूर्ण और बोधगम्य वाक्य के लिए निहित कर्ता-क्रिया दोहराना उचित है; इससे कर्मों और प्रतिफल के बीच पौलुस द्वारा रखे गए तनाव को बदला नहीं गया।
- issue: भले कार्य और अनन्त जीवन का सम्बन्ध
  choice: स्रोत की सीधी शर्तात्मक/वर्णनात्मक संरचना को बनाए रखा गया
  alternative: विश्वास, योग्यता या प्रमाण जैसे व्याख्यात्मक शब्द जोड़ना
  rationale: पद स्वयं इन संबंधों की आगे व्याख्या नहीं करता; अतः किसी विशिष्ट धर्म-सिद्धान्त के अनुसार तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किन्तु गरिमापूर्ण शैली। ‘परन्तु’ ने μὲν के विभेदकारी बल को अगले पद के विरोधी पक्ष की भूमिका के रूप में व्यक्त किया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
