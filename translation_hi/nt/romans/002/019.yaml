  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πέποιθάς
  choice: तुम्हें ... यह दृढ़ विश्वास है
  rationale: पूर्णकालिक रूप एक स्थिर और दृढ़ आत्मविश्वास की अवस्था व्यक्त करता है; यह पद के आत्म-आश्वस्त स्वर को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: τε
  choice: और
  rationale: यह अव्यय पिछले कथन से इस उपवाक्य को जोड़ता है; सरल संयोजक ‘और’ पर्याप्त और स्वाभाविक है।
- source_word: σεαυτὸν
  choice: अपने विषय में
  rationale: आत्मवाचक सर्वनाम व्यक्ति के अपने बारे में दृढ़ धारणा को उभारता है; ‘अपने विषय में’ हिन्दी में इस बल को स्पष्ट रखता है।
- source_word: ὁδηγὸν
  choice: मार्गदर्शक
  rationale: यह रूपकात्मक भूमिका के लिए सटीक, प्रचलित और गरिमापूर्ण हिन्दी शब्द है।
- source_word: τυφλῶν
  choice: अंधों के
  rationale: सम्बन्धकारक रूप को ‘अंधों के मार्गदर्शक’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है और यूनानी की संक्षिप्त प्रतिनिधिक अभिव्यक्ति बनी रहती है।
- source_word: φῶς
  choice: ज्योति
  rationale: रूपकात्मक अर्थ में ‘ज्योति’ मार्गदर्शन और प्रकाश देने की धारणा को गरिमापूर्ण तथा सहज हिन्दी में व्यक्त करती है।
- source_word: τῶν ἐν σκότει
  choice: अंधकार में पड़े लोगों के लिए
  rationale: यह व्यक्ति-सूचक वाक्यांश रूपक को बनाए रखते हुए स्पष्ट करता है कि आशय अंधकार की अवस्था में रहने वाले लोगों से है।
