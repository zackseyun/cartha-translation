  source_fidelity: The translation accurately represents the Greek rhetorical question. ‘व्यवस्था पर घमंड करते हो’ conveys ἐν νόμῳ καυχᾶσαι in idiomatic Hindi without adding a technical designation, and ‘व्यवस्था का उल्लंघन करके’ faithfully renders διὰ τῆς παραβάσεως τοῦ νόμου. ‘परमेश्वर का अनादर करते हो’ preserves the direct object and force of τὸν θεὸν ἀτιμάζεις.
