id: ROM.2.23
reference: Romans 2:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς ἐν νόμῳ καυχᾶσαι, διὰ τῆς παραβάσεως τοῦ νόμου τὸν θεὸν ἀτιμάζεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/023.yaml
  text: You who boast in the law[a], do you dishonor God through your transgression of the law?
translation:
  language: hi
  text: तुम जो व्यवस्था पर घमंड करते हो, क्या व्यवस्था का उल्लंघन करके[a] परमेश्वर का अनादर करते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था को तोड़कर।”
    reason: यह अधिक बोलचाल का विकल्प διὰ τῆς παραβάσεως τοῦ νόμου के उसी अर्थ को व्यक्त करता है।
lexical_decisions:
- source_word: ἐν νόμῳ
  choice: व्यवस्था पर
  rationale: यह प्रयोग यूनानी संबंधसूचक वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करता है और घमंड के आधार या विषय के रूप में व्यवस्था को सामने रखता है।
- source_word: καυχᾶσαι
  choice: घमंड करते हो
  rationale: यह पौलुस के आरोप की तीखी, आलोचनात्मक ध्वनि को बनाए रखता है; केवल सकारात्मक ‘गर्व करना’ इस संदर्भ में अपेक्षाकृत नरम पड़ सकता है।
- source_word: διὰ τῆς παραβάσεως τοῦ νόμου
  choice: व्यवस्था का उल्लंघन करके
  rationale: यह παράβασις के जानबूझकर सीमा लाँघने या आज्ञा तोड़ने के भाव को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν θεὸν
  choice: परमेश्वर
  rationale: निश्चित ईश्वरीय संदर्भ के लिए आधुनिक हिन्दी बाइबलीय भाषा में यह स्पष्ट और स्वाभाविक पद है।
- source_word: ἀτιμάζεις
  choice: अनादर करते हो
  rationale: यह ἀτιμάζω के सम्मान घटाने या अपमानित करने के अर्थ को सीधे व्यक्त करता है और घमंड तथा अनादर के अलंकारिक विरोध को बनाए रखता है।
theological_decisions:
- issue: पौलुस के तर्क में νόμος का संदर्भ
  choice: व्यवस्था
  alternative: मूसा की व्यवस्था
  rationale: आसपास का संदर्भ यहूदी व्यवस्था की ओर संकेत करता है, पर यूनानी पद स्वयं केवल νόμος कहता है। इसलिए ‘मूसा की’ जोड़कर निहित संदर्भ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- issue: दूसरे पुरुष एकवचन का हिन्दी रूप
  choice: तुम ... करते हो
  alternative: तू ... करता है
  rationale: यूनानी में संबोधन एकवचन है, पर आधुनिक मानक हिन्दी में ‘तुम’ आरोप की सीधाई बनाए रखते हुए अधिक स्वाभाविक और गरिमापूर्ण है; इसे बहुवचन के रूप में निर्णीत नहीं किया गया है।
translation_notes:
  register: आधुनिक, सीधी और गरिमापूर्ण हिन्दी। प्रश्नवाचक रूप यूनानी के अलंकारिक आरोप को बनाए रखता है। ‘उसी’ नहीं जोड़ा गया, क्योंकि वह संदर्भ में स्वाभाविक होते हुए भी मूल पाठ में स्पष्ट रूप से उपस्थित नहीं है।
