  text: οὐ γὰρ ὁ ἐν τῷ φανερῷ Ἰουδαῖός ἐστιν, οὐδὲ ἡ ἐν τῷ φανερῷ ἐν σαρκὶ περιτομή·
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/028.yaml
  text: For a Jew is not one outwardly[a], nor is circumcision outward in the flesh[c][b];
translation:
  language: hi
  text: क्योंकि जो बाहरी रूप से यहूदी है, वह यहूदी नहीं है[a], और न शरीर में किया गया बाहरी खतना ही खतना है[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाहरी रूप से’ का अर्थ ‘जो दिखाई देता है उसमें’ या ‘प्रत्यक्ष रूप से’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘शरीर में’ यहाँ शाब्दिक है और शारीरिक खतने की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और हिन्दी में तर्क-संबंध स्वाभाविक रूप से बनाए रखता है।
- source_word: Ἰουδαῖος
  choice: यहूदी
  rationale: इस प्रसंग में बात केवल यहूदिया क्षेत्र के निवासी की नहीं, बल्कि इस्राएल की वाचा से जुड़ी पहचान की है; इसलिए ‘यहूदी’ उपयुक्त है।
- source_word: ἐν τῷ φανερῷ
  choice: बाहरी रूप से
  rationale: यह दिखाई देने वाली, बाहरी पहचान को व्यक्त करता है और अगले पद के भीतरी आयाम के साथ विरोध बनाए रखता है।
- source_word: περιτομή
  choice: खतना
  rationale: वाचा के शारीरिक चिह्न के लिए यह आधुनिक हिन्दी का सटीक और सर्वसाधारण शब्द है।
- source_word: ἐν σαρκί
  choice: शरीर पर
  rationale: यहाँ σάρξ का आशय वास्तविक शारीरिक खतने से है। ‘शरीर पर’ हिन्दी में स्पष्ट है और अनावश्यक रूपकात्मक अर्थ से बचाता है।
theological_decisions:
- issue: बाहरी यहूदी पहचान और खतने का मूल्य
  choice: वाक्य को इस रूप में रखा गया है कि केवल बाहरी पहचान या शारीरिक चिह्न अपने-आप में निर्णायक नहीं है।
  alternative: इसे यहूदी पहचान के पूर्ण निषेध या उसके स्थान पर केवल एक आत्मिक पहचान स्थापित करने के कथन के रूप में अनूदित करना।
  rationale: यूनानी पाठ बाहरी और भीतरी आयामों में तनाव उत्पन्न करता है, जिसे अगला पद आगे स्पष्ट करता है; इसलिए इस पद में उस तनाव को पहले से हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर वाक्य-विन्यास यूनानी पाठ के बाहरी यहूदी पहचान और बाहरी शारीरिक खतने के बीच संबंध को बनाए रखता है।
