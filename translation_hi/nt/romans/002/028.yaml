revisions:
- from: क्योंकि यहूदी वह नहीं जो बाहरी रूप से यहूदी है[a], और न खतना वह है जो शरीर पर बाहरी रूप से है[b];
  to: क्योंकि जो बाहरी रूप से यहूदी है, वह यहूदी नहीं है[a], और न शरीर में किया गया बाहरी खतना ही खतना है[b];
  rationale: Revision removes the Hindi tautology and supplies the predicate required by natural Hindi while preserving the Greek's compact contrast. It does not deny Jewish identity or treat physical circumcision as unreal; rather, as the immediate context requires, it rejects outward, bodily status as sufficient in itself. The footnote wording is updated to match the revised physical expression.
