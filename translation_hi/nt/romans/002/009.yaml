lexical_decisions:
- source_word: θλῖψις
  choice: क्लेश
  rationale: यह न्याय के प्रसंग में आने वाले गंभीर दुःख और कष्ट को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: στενοχωρία
  choice: व्याकुलता
  rationale: यह θλῖψις से भिन्न, घिर जाने या भीतर से दबाव अनुभव करने की छाया को व्यक्त करता है और ‘क्लेश और व्याकुलता’ की तीव्र जोड़ी बनाए रखता है।
- source_word: ἐπὶ πᾶσαν ψυχὴν ἀνθρώπου
  choice: हर मनुष्य के प्राण पर
  rationale: यह ψυχή की ठोस ‘प्राण’ छवि को बनाए रखते हुए ἀνθρώπου को समस्त मनुष्यों के अर्थ में स्पष्ट करता है; अधिक मुहावरेदार विकल्प ‘हर मनुष्य पर’ पादटिप्पणी में दिया गया है।
- source_word: τοῦ κατεργαζομένου τὸ κακόν
  choice: बुराई करने वाले
  rationale: कर्तृवाचक कृदंत और सामान्य अर्थ में प्रयुक्त τὸ κακόν को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰουδαίου
  choice: यहूदी
  rationale: रोमियों में यह शब्द केवल यहूदिया-निवासी नहीं, बल्कि यहूदी समुदाय को सूचित करता है।
- source_word: Ἕλληνος
  choice: यूनानी
  rationale: यह पौलुस के वास्तविक यहूदी/यूनानी युग्म को बनाए रखता है; इस प्रसंग में गैर-यहूदी का व्यापक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह प्राथमिकता या क्रम को बिना अतिरिक्त व्याख्या जोड़े सीधे व्यक्त करता है।
theological_decisions:
- issue: संक्षिप्त यूनानी वाक्य में निहित भविष्यकालीन विधेय को हिन्दी में स्पष्ट करना
  choice: क्लेश और व्याकुलता आएगी
  alternative: क्लेश और व्याकुलता ... पर
  rationale: हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए विधेय आवश्यक है। ‘आएगी’ न्याय के निकटवर्ती प्रसंग से निहित भाव स्पष्ट करता है, पर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: ‘पहले’ के बाद यहूदी और यूनानी के संबंध को व्यक्त करना
  choice: पहले यहूदी पर और यूनानी पर भी
  alternative: पहले यहूदी पर और फिर यूनानी पर
  rationale: यूनानी τε ... καὶ ‘और ... भी’ का संबंध देता है; ‘फिर’ जोड़ने से स्रोत की अपेक्षा अधिक स्पष्ट कालक्रम सूचित हो सकता था।
