  text: τὸ γὰρ ὄνομα τοῦ θεοῦ δι’ ὑμᾶς βλασφημεῖται ἐν τοῖς ἔθνεσιν, καθὼς γέγραπται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/024.yaml
  text: For the name of God is blasphemed among the Gentiles because of you[b][a], just as it is written.
translation:
  language: hi
  text: क्योंकि “तुम्हारे कारण गैर-यहूदियों के बीच परमेश्वर के नाम की निन्दा होती है,”[a][b] जैसा लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जातियों के बीच।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ पौलुस पवित्रशास्त्र की प्रतिध्वनि करता है, विशेष रूप से यशायाह 52:5 की; ऐसी ही विषयवस्तु यहेजकेल 36:20–23 में भी मिलती है।
    reason: cross_reference
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद की फटकार का कारण बताता है; हिन्दी में ‘क्योंकि’ इस तार्किक सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὄνομα τοῦ θεοῦ
  choice: परमेश्वर के नाम
  rationale: मूल के ‘परमेश्वर का नाम’ को सीधे बनाए रखता है; यहाँ ‘नाम’ में प्रतिष्ठा का भाव हो सकता है, पर उसे व्याख्यात्मक रूप से नहीं बढ़ाया गया।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे कारण
  rationale: Accusative के साथ διά यहाँ कारण प्रकट करता है; यह पौलुस के आरोप को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: βλασφημεῖται
  choice: निन्दा होती है
  rationale: वर्तमान कर्मवाच्य का स्वाभाविक हिन्दी रूप है और परमेश्वर के विरुद्ध अपमानजनक कथन का प्रबल धार्मिक अर्थ सुरक्षित रखता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के बीच
  rationale: रोमियों के यहूदी–गैर-यहूदी सन्दर्भ में ἔθνη का यही सबसे सम्भावित आशय है; ‘जातियों के बीच’ को पादटिप्पणी में रखा गया है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित सूत्र है और καθώς का अर्थ सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण-चिह्न यह संकेत करते हैं कि पौलुस पवित्रशास्त्र की भाषा उद्धृत कर रहा है।
