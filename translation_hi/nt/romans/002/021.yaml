  text: ὁ οὖν διδάσκων ἕτερον σεαυτὸν οὐ διδάσκεις; ὁ κηρύσσων μὴ κλέπτειν κλέπτεις;
base_translation:
  language: en
  yaml_path: translation/nt/romans/002/021.yaml
  text: You, therefore, who teach another, do you not teach yourself? You who proclaim, “Do not steal,” do you steal?
translation:
  language: hi
  text: इसलिए, तुम जो दूसरे को सिखाते हो, क्या स्वयं को नहीं सिखाते? तुम जो प्रचार करते हो, “चोरी मत करना,” क्या चोरी करते हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष की ओर संकेत करता है; ‘इसलिए’ उस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: διδάσκων
  choice: जो ... सिखाते हो
  rationale: कर्तृवाचक कृदन्त को हिन्दी में संबंधवाचक वाक्यांश बनाना स्वाभाविक है और व्यक्ति की निरंतर भूमिका का भाव बनाए रखता है।
- source_word: ἕτερον
  choice: किसी दूसरे को
  rationale: यूनानी के एकवचन और अपने से भिन्न व्यक्ति के तीखे विरोध को सुरक्षित रखता है।
- source_word: σεαυτὸν
  choice: अपने आप को
  rationale: प्रत्यक्ष आत्मवाचक कर्म को स्पष्ट करता और दूसरे को सिखाने बनाम स्वयं को न सिखाने का विरोध बनाए रखता है।
- source_word: οὐ διδάσκεις;
  choice: क्या ... नहीं सिखाते?
  rationale: नकारात्मक आलंकारिक प्रश्न का रूप और उसकी फटकार दोनों सुरक्षित रहते हैं।
- source_word: κηρύσσων
  choice: जो घोषणा करते हो
  rationale: सार्वजनिक रूप से संदेश सुनाने का अर्थ देता है, बिना इसे केवल धार्मिक प्रवचन के तकनीकी अर्थ तक सीमित किए।
- source_word: μὴ κλέπτειν
  choice: चोरी न करना
  rationale: प्रतिवेदित निषेध को हिन्दी की परिचित आज्ञार्थक शैली में रखता है और यूनानी की निषेधात्मक शक्ति बनाए रखता है।
- source_word: κλέπτεις;
  choice: क्या तुम चोरी करते हो?
  rationale: सरल वर्तमानकालीन आलंकारिक प्रश्न पौलुस की सीधी और आरोपात्मक शैली को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सीधी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध है। दोनों आलंकारिक प्रश्नों की समानांतर संरचना तथा दूसरे व्यक्ति एकवचन का सीधा संबोधन सुरक्षित रखा गया है।
