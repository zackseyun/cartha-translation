source:
  edition: SBLGNT
  text: Πέπεισμαι δέ, ἀδελφοί μου, καὶ αὐτὸς ἐγὼ περὶ ὑμῶν, ὅτι καὶ αὐτοὶ μεστοί ἐστε ἀγαθωσύνης, πεπληρωμένοι ⸀πάσης γνώσεως, δυνάμενοι καὶ ⸀ἀλλήλους νουθετεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/014.yaml
  text: And I myself am convinced about you[a], my brothers, that you yourselves also are full of goodness, filled with all knowledge[b], and able also to instruct one another.
translation:
  language: hi
  text: और मेरे भाइयो[a], मैं स्वयं भी तुम्हारे विषय में आश्वस्त हूँ कि तुम स्वयं भी भलाई से भरपूर और हर प्रकार के ज्ञान से परिपूर्ण हो, और एक-दूसरे को शिक्षा देने में समर्थ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भाइयो” यूनानी शब्द अदेल्फ़ोई का अनुवाद है। यह साथी विश्वासियों के पूरे समुदाय को संबोधित कर सकता है, जिसमें स्त्री और पुरुष दोनों सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέπεισμαι
  choice: मुझे … यह विश्वास है
  rationale: यूनानी पूर्णकालिक रूप पहले उत्पन्न हुए और अब स्थिर विश्वास की वर्तमान अवस्था बताता है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: δέ
  choice: और
  rationale: यहाँ यह प्रबल विरोध नहीं, बल्कि प्रसंग में हल्का संक्रमण दिखाता है।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: सम्बोधन और μου दोनों को स्पष्ट रूप से रखा गया है; सामूहिक, स्त्री-पुरुष समावेशी प्रयोग को पादटिप्पणी में समझाया गया है।
- source_word: καὶ αὐτὸς ἐγὼ
  choice: मुझे स्वयं भी
  rationale: καί के योगात्मक और αὐτός के बलात्मक भाव को सहज हिंदी में सुरक्षित रखता है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: περί और संबंधकारक का सीधा, गरिमापूर्ण हिंदी रूप।
- source_word: καὶ αὐτοὶ
  choice: तुम स्वयं भी
  rationale: योगात्मक καί और बलात्मक αὐτοί, दोनों का भाव बनाए रखता है।
- source_word: μεστοί ἐστε ἀγαθωσύνης
  choice: भलाई से भरपूर
  rationale: ἀγαθωσύνη के नैतिक भलाई या सद्गुण के भाव को साधारण आधुनिक हिंदी में व्यक्त करता है।
- source_word: πεπληρωμένοι πάσης γνώσεως
  choice: समस्त ज्ञान से परिपूर्ण
  rationale: पूर्णकालिक कृदन्त की वर्तमान परिपूर्ण अवस्था और πάσης की व्यापकता को बनाए रखता है।
- source_word: δυνάμενοι
  choice: समर्थ
  rationale: पूर्वोक्त गुणों से उत्पन्न योग्यता को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे को
  rationale: पारस्परिक सर्वनाम का मानक हिंदी रूप।
- source_word: νουθετεῖν
  choice: समझाने
  rationale: इस क्रिया में शिक्षा, परामर्श और सुधारात्मक चेतावनी का भाव है; प्रशंसात्मक प्रसंग में 'समझाने' इसका व्यापक और स्वाभाविक हिंदी रूप है, जबकि तीखे विकल्प पादटिप्पणी में रखे गए हैं।
theological_decisions:
- issue: मिश्रित विश्वासी समुदाय के लिए लिंगसूचक सम्बोधन ἀδελφοί
  choice: मेरे भाइयो
  alternative: मेरे भाइयो और बहनो
  rationale: मुख्य पाठ में यूनानी के व्याकरणिक रूप को रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इस सामूहिक सम्बोधन में स्त्रियाँ भी सम्मिलित हो सकती हैं।
- issue: νουθετεῖν का सुधारात्मक अर्थ
  choice: एक-दूसरे को समझाने
  alternative: एक-दूसरे को चेताने या सुधारने
  rationale: प्रशंसात्मक संदर्भ में व्यापक, रचनात्मक अर्थ मुख्य पाठ में उपयुक्त है; पादटिप्पणी सुधारात्मक और चेतावनीपूर्ण अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। 'समस्त ज्ञान से परिपूर्ण' मूल की व्यापक अभिव्यक्ति को बिना सीमित किए सुरक्षित रखता है।
