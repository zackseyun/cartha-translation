  text: οἶδα δὲ ὅτι ἐρχόμενος πρὸς ὑμᾶς ἐν πληρώματι ⸀εὐλογίας Χριστοῦ ἐλεύσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/029.yaml
  text: And I know that when I come to you[a], I will come in the fullness of the blessing of Messiah.
translation:
  language: hi
  text: और मैं जानता हूँ कि जब मैं तुम्हारे पास आऊँगा, तो मसीह की आशीष की परिपूर्णता में आऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: यह पौलुस के निश्चित ज्ञान और विश्वासपूर्ण कथन को सीधे व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्के संयोजक के रूप में विचार को आगे बढ़ाता है; ‘और’ अनावश्यक विरोध उत्पन्न नहीं करता।
- source_word: ἐρχόμενος πρὸς ὑμᾶς
  choice: जब मैं तुम्हारे पास आऊँगा
  rationale: कृदंत मुख्य भविष्यकालीन क्रिया के सापेक्ष कालगत अर्थ रखता है; यह हिंदी में स्वाभाविक अभिव्यक्ति है।
- source_word: ἐλεύσομαι
  choice: आऊँगा
  rationale: भविष्यकालीन क्रिया को सीधा और स्वाभाविक रूप दिया गया है।
- source_word: ἐν πληρώματι
  choice: परिपूर्णता में
  rationale: यह पूर्णता और भरपूरी के मूल रूपक को बनाए रखता है, जबकि ἐν की रीति अथवा साथ रहने की छाया भी सुरक्षित रहती है।
- source_word: εὐλογίας
  choice: आशीष की
  rationale: संबंधकारक पद πλήρωμα को आशीष से विशिष्ट करता है; ‘आशीष की परिपूर्णता’ हिंदी में अर्थपूर्ण और गरिमापूर्ण है।
- source_word: Χριστοῦ
  choice: मसीह की
  rationale: Χριστός यहाँ उपाधि है; ‘मसीह’ उसका प्रचलित हिंदी रूप है और संबंधकारक को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: मूल पद अभिषिक्त जन की उपाधि है। ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में अर्थपूर्ण, परिचित और गैर-सांप्रदायिक रूप है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। मूल वाक्य की पुनरुक्ति—‘आऊँगा ... आऊँगा’—जानबूझकर रखी गई है, क्योंकि यह यूनानी संरचना और पौलुस के बल को प्रतिबिंबित करती है।
