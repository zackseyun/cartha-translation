  text: καὶ πάλιν· Αἰνεῖτε, ⸂πάντα τὰ ἔθνη, τὸν κύριον⸃, καὶ ⸀ἐπαινεσάτωσαν αὐτὸν πάντες οἱ λαοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/011.yaml
  text: 'And again: “Praise the Lord[a], all the nations[b], and let all the peoples praise him.”'
translation:
  language: hi
  text: 'और फिर: “हे सब जातियो[a], प्रभु[b] की स्तुति करो; और सब लोग उसकी प्रशंसा करें।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सब जातियो” का अनुवाद “सब गैर-यहूदियो” भी हो सकता है। यूनानी ἔθνη का अर्थ “जातियाँ” या “गैर-यहूदी” हो सकता है; यहाँ उद्धरण का भाव सार्वभौमिक है, फिर भी यह गैर-यहूदियों के विषय में पौलुस के तर्क से भी मेल खाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहोवा।” इस उद्धरण के इब्रानी स्रोत में परमेश्वर का विशिष्ट नाम है, जिसे यूनानी में κύριος (“प्रभु”) से व्यक्त किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ πάλιν
  choice: और फिर कहा गया है
  rationale: यह पद एक और पवित्रशास्त्रीय उद्धरण जोड़ता है। हिंदी में ‘और फिर कहा गया है’ उद्धरण-परिचय को स्वाभाविक और स्पष्ट बनाता है।
- source_word: Αἰνεῖτε
  choice: स्तुति करो
  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थक रूप का सीधा, प्रतिष्ठित और प्रचलित हिंदी समतुल्य।
- source_word: πάντα τὰ ἔθνη
  choice: हे सब जातियो
  rationale: ἔθνη का अर्थ ‘जातियाँ/राष्ट्र’ अथवा संदर्भानुसार ‘गैर-यहूदी’ हो सकता है। संबोधन में ‘हे सब जातियो’ सार्वभौमिक अर्थ और पौलुस के गैर-यहूदियों संबंधी तर्क—दोनों को खुला रखता है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος का सामान्य नए नियम संबंधी हिंदी रूप ‘प्रभु’ है; इब्रानी उद्धरण में इसके पीछे परमेश्वर का विशिष्ट नाम है, जिसे पादटिप्पणी में बताया गया है।
- source_word: ἐπαινεσάτωσαν
  choice: प्रशंसा करें
  rationale: तृतीय पुरुष बहुवचन आज्ञार्थक भाव को हिंदी में स्वाभाविक आह्वान के रूप में व्यक्त करता है।
- source_word: αὐτὸν
  choice: उसकी
  rationale: सर्वनाम का पूर्वपद ‘प्रभु’ है। हिंदी में ‘उसकी प्रशंसा करें’ सहज है और अनावश्यक पुनरुक्ति से बचता है।
- source_word: πάντες οἱ λαοί
  choice: सब लोग
  rationale: λαοί को ἔθνη से अलग रखते हुए ‘लोग’ अनूदित किया गया है, जिससे यूनानी समानांतरता और शब्दगत भेद बने रहते हैं।
theological_decisions:
- issue: पुराने नियम के उद्धरण में κύριος का अनुवाद, जहाँ इब्रानी स्रोत में परमेश्वर का विशिष्ट नाम है
  choice: प्रभु
  alternative: यहोवा
  rationale: मुख्य पाठ यूनानी κύριος को सीधे ‘प्रभु’ कहता है। इब्रानी स्रोत का दिव्य नाम महत्वपूर्ण पाठीय पृष्ठभूमि है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: पौलुस के यहूदी–गैर-यहूदी संदर्भ में ἔθνη का अर्थ
  choice: सब जातियाँ
  alternative: सब गैर-यहूदी
  rationale: उद्धरण का आह्वान सार्वभौमिक है, इसलिए ‘जातियाँ’ अधिक व्यापक और स्रोत-समीप है; फिर भी रोमियों 15 के संदर्भ में ‘गैर-यहूदी’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘हे सब जातियो’ काव्यात्मक उद्धरण के संबोधन को स्पष्ट करता है; ‘स्तुति’ और ‘प्रशंसा’ यूनानी के दो संबंधित क्रियापदों की हल्की भिन्नता बनाए रखते हैं।
