reference: Romans 15:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ Χριστὸς οὐχ ἑαυτῷ ἤρεσεν· ἀλλὰ καθὼς γέγραπται· Οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε ἐπέπεσαν ἐπ’ ἐμέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/003.yaml
  text: For even the Messiah did not please himself[a], but as it is written, “The reproaches of those who reproached you fell on me.”
translation:
  language: hi
  text: क्योंकि मसीह ने भी अपने आपको प्रसन्न नहीं किया,[a] बल्कि जैसा लिखा है, “तेरा अपमान करने वालों के अपमान मुझ पर आ पड़े।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अपने ही सुख की खोज नहीं की।”
    reason: ‘अपने आपको प्रसन्न नहीं किया’ यूनानी के निकट है, जबकि वैकल्पिक रूप प्रसंग में निहित आत्महित के भाव को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि ... भी
  rationale: यह पद पिछले उपदेश का आधार देता है और मसीह के उदाहरण पर बल भी देता है; हिन्दी में विभाजित रूप स्वाभाविक है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ इसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: οὐχ ἑαυτῷ ἤρεσεν
  choice: अपने आपको प्रसन्न नहीं किया
  rationale: यह अनुवाद क्रिया ‘प्रसन्न करना’ और आत्मवाचक सर्वनाम—दोनों को निकटता से बनाए रखता है, बिना ‘अपने सुख की खोज’ जैसी व्याख्या जोड़े।
- source_word: ἀλλὰ καθὼς γέγραπται
  choice: बल्कि जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का स्वाभाविक हिन्दी सूत्र है और यूनानी पूर्णकाल के वर्तमान परिणाम को व्यक्त करता है।
- source_word: οἱ ὀνειδισμοὶ τῶν ὀνειδιζόντων σε
  choice: जो तेरा अपमान करते थे, उनके अपमान
  rationale: ‘अपमान’ ὀνειδισμός की निन्दा और तिरस्कार की धारणा व्यक्त करता है; संज्ञा और संबंधित क्रिया की पुनरावृत्ति भी हिन्दी में रखी गई है।
- source_word: ἐπέπεσαν ἐπ’ ἐμέ
  choice: मुझ पर आ पड़े
  rationale: यह यूनानी मुहावरे का स्वाभाविक और निकट हिन्दी समतुल्य है तथा उद्धरण के भूतकाल को बनाए रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: संदर्भ में यह नाम-सदृश प्रयोग से अधिक अभिषिक्त जन की उपाधि है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थ और गरिमा दोनों बनाए रखता है।
- issue: पवित्रशास्त्र के उद्धरण में ‘मुझ’ की पहचान
  choice: वक्ता की पहचान को उद्धरण के शब्दों से आगे स्पष्ट नहीं किया गया
  alternative: ‘मुझ मसीह पर’ जैसे व्याख्यात्मक शब्द जोड़ना
  rationale: पौलुस इस भजन को मसीह पर लागू करता है, पर मूल उद्धरण स्वयं केवल ‘मुझ’ कहता है; अनुवाद इस धार्मिक तनाव और संकेत को खुला रखता है।
- issue: द्वितीय पुरुष सर्वनाम का वचन
  choice: तेरा
  alternative: तुम्हारा/आपका
  rationale: यूनानी σε एकवचन है। भजन के ईश्वर-संबोधन में ‘तेरा’ एकवचन और काव्यात्मक प्रत्यक्षता को सुरक्षित रखता है, बिना मुख्य पाठ में संबोधित व्यक्ति की व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। शास्त्रीय उद्धरण में ‘तेरा’ और ‘मुझ पर आ पड़े’ से काव्यात्मक स्वर बचता है। मुख्य पाठ स्रोत के संक्षिप्त कथन और उद्धरण की अस्पष्ट वक्ता-पहचान को बनाए रखता है।
