- source_word: τολμηρότερον
  choice: कुछ अधिक साहस के साथ
  rationale: तुलनात्मक क्रियाविशेषण का भाव बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δὲ
  choice: फिर भी
  rationale: पिछली प्रशंसा के बाद आने वाले हल्के विरोध अथवा कथन के नए मोड़ को व्यक्त करता है।
- source_word: ἔγραψα ὑμῖν
  choice: मैंने आपको ... लिखा है
  rationale: पत्र के संदर्भ में यूनानी पत्रात्मक भूतकाल को हिन्दी के पूर्ण वर्तमान में रखना स्वाभाविक है।
- source_word: ἀπὸ μέρους
  choice: कुछ बातों के विषय में
  rationale: संदर्भ में यह कुछ विषयों या मुद्दों की ओर संकेत कर सकता है; वाक्य को स्वाभाविक रखते हुए इसी अर्थ को मुख्य पाठ में रखा गया है, और वैकल्पिक व्याकरणिक संबंध पादटिप्पणी में दिया गया है।
- source_word: ὡς ἐπαναμιμνῄσκων ὑμᾶς
  choice: मानो आपको फिर से स्मरण दिला रहा हूँ
  rationale: ὡς की तुलनात्मक/विनम्र भावछाया तथा ἐπανα- उपसर्ग में निहित ‘फिर से स्मरण दिलाने’ का अर्थ दोनों सुरक्षित रहते हैं।
- source_word: διὰ τὴν χάριν
  choice: उस अनुग्रह के कारण
  rationale: διά के कारणसूचक अर्थ और पौलुस के सामान्य धर्मवैचारिक शब्द ‘अनुग्रह’ दोनों को बनाए रखता है।
- source_word: τὴν δοθεῖσάν μοι ὑπὸ τοῦ θεοῦ
  choice: जो परमेश्वर ने मुझे दिया है
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिन्दी कर्तृवाच्य में व्यक्त करते हुए परमेश्वर की कर्तृता स्पष्ट रखी गई है।
theological_decisions:
- issue: संदर्भ में χάρις का अर्थ
  choice: मुख्य पाठ में व्यापक शब्द ‘अनुग्रह’, जिसमें परमेश्वर द्वारा दी गई सेवकाई और सामर्थ्य का संदर्भगत भाव शामिल है
  alternative: इसे सीधे ‘प्रेरिताई का दायित्व’ या केवल सामान्य ‘कृपा’ कहना
  rationale: पद 15–16 में यह अनुग्रह पौलुस की गैर-यहूदियों के बीच सेवकाई से जुड़ा है, पर मूल शब्द सेवकाई के तकनीकी पद तक सीमित नहीं है। इसलिए मुख्य पाठ उसकी व्यापकता बनाए रखता है और पादटिप्पणी संदर्भगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक बहुवचन ‘आप’ अपनाया गया है। भाषा सहज और गरिमापूर्ण रखी गई है। मूल यूनानी की लंबी संरचना को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, जबकि कारण-संबंध सुरक्षित है।
