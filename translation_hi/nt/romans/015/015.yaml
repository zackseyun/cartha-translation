  text: लेकिन मैंने आपको कुछ बातों के विषय में कुछ अधिक साहस के साथ लिखा है[a], आपको फिर से स्मरण दिलाते हुए। ऐसा मैंने उस अनुग्रह के कारण किया है जो परमेश्वर ने मुझे दिया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने आपको कुछ अंशों में कुछ अधिक साहस के साथ लिखा है।” यूनानी वाक्यांश का संबंध लिखने के साहस की मात्रा से भी हो सकता है और उन कुछ बातों से भी जिनके विषय में पौलुस ने लिखा।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अनुग्रह” विशेष रूप से पौलुस को परमेश्वर से मिली गैर-यहूदियों के बीच सेवकाई और उसके लिए दी गई सामर्थ्य की ओर संकेत करता है; फिर भी मुख्य पाठ में यह व्यापक शब्द ही रखा गया है।
    reason: cross_reference
