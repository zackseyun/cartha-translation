id: ROM.15.12
reference: Romans 15:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πάλιν Ἠσαΐας λέγει· Ἔσται ἡ ῥίζα τοῦ Ἰεσσαί, καὶ ὁ ἀνιστάμενος ἄρχειν ἐθνῶν· ἐπ’ αὐτῷ ἔθνη ἐλπιοῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/012.yaml
  text: And again Isaiah says, “The root of Jesse will be, and the one who rises to rule the Gentiles; in him the Gentiles will hope.”
translation:
  language: hi
  text: और फिर यशायाह कहते हैं, “यिशै की जड़ होगी, और वह जो गैर-यहूदी जातियों पर शासन करने के लिए उठेगा; गैर-यहूदी जातियाँ उसी पर आशा रखेंगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ῥίζα τοῦ Ἰεσσαί
  choice: यिशै की जड़
  rationale: पौलुस द्वारा उद्धृत यशायाह के वंशगत रूपक को बनाए रखता है; यहाँ ‘जड़’ यिशै के वंश से आने वाले शासक की ओर संकेत करती है।
- source_word: ἔσται
  choice: प्रकट होगी
  rationale: अकेला शाब्दिक ‘होगी’ आधुनिक हिन्दी में अधूरा और अस्वाभाविक लगता है। प्रसंग में भावी आगमन/उपस्थिति का संकेत देते हुए ‘प्रकट होगी’ रूपक और भविष्यकाल दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἀνιστάμενος
  choice: वही जो ... उठेगा
  rationale: ἀνίστημι के ‘उठने/खड़े होने’ के चित्र को सुरक्षित रखता है और इसे यहाँ स्पष्टतः पुनरुत्थान तक सीमित नहीं करता।
- source_word: ἄρχειν ἐθνῶν
  choice: गैर-यहूदी जातियों पर शासन करने के लिए
  rationale: ἔθνη यहाँ यहूदी लोगों से भिन्न राष्ट्रों/लोगों के अर्थ में है; ‘गैर-यहूदी जातियाँ’ पौलुस के तर्क में इस भेद को स्पष्ट करती हैं।
- source_word: ἐπ’ αὐτῷ ... ἐλπιοῦσιν
  choice: उसी पर ... आशा रखेंगी
  rationale: ἐπί के साथ व्यक्त भरोसे के लक्ष्य को ‘पर’ स्वाभाविक हिन्दी में दर्शाता है और भविष्यकाल को बनाए रखता है।
theological_decisions:
- issue: ‘यिशै की जड़’ और ‘जो उठेगा’ के बीच संबंध
  choice: डैश और ‘वही’ द्वारा दोनों पदबंधों को एक ही अपेक्षित शासक से जोड़ा गया
  alternative: ‘और वह जो उठता है’ कहकर उन्हें अधिक पृथक रखना
  rationale: यूनानी में καί है, पर उद्धरण की समांतर संरचना दोनों वर्णनों को एक ही व्यक्ति पर लागू करती है। यह प्रस्तुति पहचान स्पष्ट करती है, बिना अतिरिक्त मसीही उपाधि जोड़ने के।
- issue: ἀνιστάμενος में पुनरुत्थान-संकेत
  choice: सामान्य ‘उठेगा’ रखा गया
  alternative: ‘जी उठेगा’
  rationale: क्रिया पुनरुत्थान के लिए प्रयुक्त हो सकती है, किंतु यहाँ शासन के लिए उभरने/खड़े होने का अर्थ भी वास्तविक है। ‘जी उठेगा’ अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘यिशै’ प्रचलित बाइबलीय नामरूप है। ‘अन्यजातियाँ’ की अपेक्षा ‘गैर-यहूदी जातियाँ’ सामान्य पाठक के लिए अधिक तुरंत बोधगम्य है। उद्धरण की काव्यात्मक समानता को डैश और अर्धविराम से स्पष्ट किया गया है।
