  text: ἐν δυνάμει σημείων καὶ τεράτων, ἐν δυνάμει ⸀πνεύματος· ὥστε με ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ πεπληρωκέναι τὸ εὐαγγέλιον τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/019.yaml
  text: by the power of signs and wonders[a], by the power of the Spirit, so that from Jerusalem and all around as far as Illyricum I have fully proclaimed the gospel of the Messiah[b],
translation:
  language: hi
  text: चिन्हों और अद्भुत कार्यों की सामर्थ्य से, आत्मा की सामर्थ्य से, इस प्रकार कि मैं यरूशलेम से और उसके चारों ओर के क्षेत्रों में, इल्लुरिकुम तक, मसीह के सुसमाचार का पूरी तरह प्रचार कर चुका हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δυνάμει
  choice: की सामर्थ्य से
  rationale: यह दोहराया गया पद साधन और प्रभावी शक्ति को व्यक्त करता है; हिंदी में यह स्वाभाविक रहते हुए मूल की पुनरावृत्ति बनाए रखता है।
- source_word: σημείων καὶ τεράτων
  choice: चिन्हों और अद्भुत कामों
  rationale: यह पारंपरिक बाइबलीय युग्म परमेश्वर की गतिविधि प्रमाणित करने वाले असाधारण कार्यों को दर्शाता है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: पौलुस के संदर्भ में यह सबसे स्वाभाविक रूप से पवित्र आत्मा का संकेत है, पर मूल में विशेषण ‘पवित्र’ नहीं है; इसलिए उसे नहीं जोड़ा गया।
- source_word: ἀπὸ Ἰερουσαλὴμ καὶ κύκλῳ μέχρι τοῦ Ἰλλυρικοῦ
  choice: यरूशलेम से लेकर उसके चारों ओर इल्लुरिकुम तक
  rationale: यह यरूशलेम से आरंभ होकर आसपास के विस्तृत क्षेत्रों से होते हुए इल्लुरिकुम तक की भौगोलिक पहुँच व्यक्त करता है।
- source_word: πεπληρωκέναι τὸ εὐαγγέλιον
  choice: सुसमाचार का पूरा-पूरा प्रचार किया
  rationale: इस संदर्भ में πληρόω सुसमाचार को किसी भूभाग में पूर्ण रूप से पहुँचा देने या घोषित करने का भाव देता है; शाब्दिक ‘सुसमाचार को पूरा किया’ आधुनिक हिंदी में भ्रामक होगा।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: यहाँ Χριστός अर्थपूर्ण उपाधि है; ‘मसीह’ हिंदी बाइबलीय प्रयोग में स्थापित और सुबोध है।
theological_decisions:
- issue: πνεύματος का अभिप्राय
  choice: आत्मा, अर्थात संदर्भतः पवित्र आत्मा
  alternative: सामान्य अर्थ में आत्मा; अथवा स्पष्ट रूप से ‘पवित्र आत्मा’
  rationale: प्रेरिताई सेवा, चिन्हों और अद्भुत कामों का संदर्भ पवित्र आत्मा की ओर प्रबल संकेत करता है, किंतु अनुवाद मूल से अधिक स्पष्टता नहीं जोड़ता।
- issue: πεπληρωκέναι τὸ εὐαγγέλιον का अर्थ
  choice: सुसमाचार का पूरा-पूरा प्रचार किया
  alternative: सुसमाचार को पूरा किया
  rationale: भौगोलिक सेवकाई के संदर्भ में अर्थ सुसमाचार को व्यापक रूप से घोषित या पहुँचा देने का है, न कि सुसमाचार की विषयवस्तु को पूर्ण करने का।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल यूनानी की दोहरी ‘सामर्थ्य’ संरचना सुरक्षित रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
