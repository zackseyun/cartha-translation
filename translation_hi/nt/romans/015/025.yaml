  text: But now I am going to Jerusalem[a], ministering to the saints.
translation:
  language: hi
  text: पर अब मैं पवित्र जनों की सेवा करने[a] यरूशलेम जा रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जनों की सेवा करते हुए”; अथवा, “उनके लिए सहायता पहुँचाने।” यूनानी शब्द व्यावहारिक सेवा को भी सूचित कर सकता है; यहाँ संभवतः यरूशलेम के विश्वासियों के लिए एकत्र की गई सहायता पहुँचाने की बात है (देखें 15:26)।
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: νυνί वर्तमान समय पर बल देता है और δέ हल्का विरोध अथवा विषयांतर दिखाता है; ‘पर अब’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: πορεύομαι
  choice: जा रहा हूँ
  rationale: यह वर्तमान यात्रा अथवा निकट यात्रा-अभिप्राय को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: εἰς Ἰερουσαλὴμ
  choice: यरूशलेम
  rationale: गति-सूचक हिन्दी क्रिया ‘जा रहा हूँ’ के साथ गंतव्य बिना ‘को’ के स्वाभाविक रूप से व्यक्त होता है।
- source_word: διακονῶν
  choice: सेवा करने
  rationale: यह διακονέω के व्यावहारिक सेवा-भाव को रखता है और प्रसंग में यात्रा के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है; सहायता पहुँचाने का अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों
  rationale: यह पौलुस द्वारा विश्वासियों के लिए प्रयुक्त ‘पवित्र जन’ के अर्थ को बनाए रखता है और ‘संतों’ से जुड़ी बाद की विशिष्ट धारणाओं से बचता है।
theological_decisions:
- issue: ‘पवित्र जनों’ का संदर्भ
  choice: मुख्य पाठ में व्यापक पद ‘पवित्र जनों’ रखा गया है, जो प्रसंग में यरूशलेम के विश्वासियों, विशेषकर वहाँ के जरूरतमंदों, को सूचित करता है।
  alternative: मुख्य पाठ में सीधे ‘यरूशलेम के जरूरतमंद विश्वासियों’ कहना।
  rationale: अगली आयत संग्रह और निर्धनों का संदर्भ स्पष्ट करती है, पर इस आयत का यूनानी पाठ केवल ‘पवित्र जनों’ कहता है; इसलिए अनुवाद स्रोत की अभिव्यक्ति को संकुचित नहीं करता।
- issue: διακονῶν का संबंध
  choice: ‘सेवा करने’ द्वारा यात्रा के संभावित उद्देश्य को व्यक्त किया गया है।
  alternative: ‘सेवा करते हुए’ द्वारा साथ-साथ चल रही परिस्थिति व्यक्त करना।
  rationale: प्रसंग में पौलुस यरूशलेम के विश्वासियों के लिए संग्रह पहुँचा रहा है, इसलिए उद्देश्य प्रमुख है; फिर भी कृदंत स्वयं कुछ लचीला है, अतः वैकल्पिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पवित्र जन’ स्रोत के सामुदायिक-धार्मिक पद को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सरल रखा गया है।
