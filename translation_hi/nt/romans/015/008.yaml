source:
  edition: SBLGNT
  text: λέγω ⸀γὰρ ⸀Χριστὸν διάκονον ⸀γεγενῆσθαι περιτομῆς ὑπὲρ ἀληθείας θεοῦ, εἰς τὸ βεβαιῶσαι τὰς ἐπαγγελίας τῶν πατέρων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/008.yaml
  text: For I say that the Messiah has become a servant to the circumcised for the sake of God's truth[a], in order to confirm the promises to the fathers,
translation:
  language: hi
  text: क्योंकि मैं कहता हूँ कि मसीह परमेश्वर के सत्य[a] की खातिर खतना किए हुए लोगों के लिए सेवक बना है, ताकि पूर्वजों को दी गई प्रतिज्ञाओं को दृढ़ करे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की सत्यनिष्ठा की खातिर,” अर्थात अपनी वाचा की प्रतिज्ञाओं को पूरा करने में उसकी विश्वसनीयता।
    reason: ἀλήθεια θεοῦ में ‘परमेश्वर का सत्य’ के साथ उसकी सत्यनिष्ठा या विश्वसनीयता का अर्थ भी संभव है।
lexical_decisions:
- source_word: λέγω γὰρ
  choice: क्योंकि मैं कहता हूँ
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण देता है; λέγω को पौलुस की तर्कपूर्ण शैली के अनुरूप सीधे रूप में रखा गया है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός इस्राएल, खतना और पूर्वजों की प्रतिज्ञाओं के संदर्भ में उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ इसका स्वाभाविक और प्रचलित रूप है।
- source_word: διάκονον γεγενῆσθαι
  choice: सेवक बना है
  rationale: διάκονος सेवा करने वाले व्यक्ति को दर्शाता है, न कि अनिवार्य रूप से कलीसियाई पद को; पूर्ण infinitive γεγενῆσθαι से उत्पन्न वर्तमान अवस्था को ‘बना है’ व्यक्त करता है।
- source_word: περιτομῆς
  choice: खतनावालों का
  rationale: यह genitive खतना किए हुए लोगों, अर्थात यहूदियों, की ओर संकेत करता है। ‘खतनावालों का सेवक’ स्रोत की संरचना और सेवा-संबंध दोनों को संक्षेप में बनाए रखता है।
- source_word: ὑπὲρ ἀληθείας θεοῦ
  choice: परमेश्वर के सत्य के लिए
  rationale: ὑπέρ यहाँ हित या उद्देश्य का भाव देता है। ἀλήθεια का अर्थ ‘सत्य’ हो सकता है, जबकि परमेश्वर की विश्वसनीयता का संदर्भगत भाव पादटिप्पणी में सुरक्षित है।
- source_word: εἰς τὸ βεβαιῶσαι
  choice: ताकि ... दृढ़ करे
  rationale: εἰς τὸ के साथ infinitive उद्देश्य व्यक्त करता है; βεβαιόω प्रतिज्ञाओं को पक्का, स्थापित या प्रमाणित करने का भाव रखता है।
- source_word: τὰς ἐπαγγελίας τῶν πατέρων
  choice: पूर्वजों से की गई प्रतिज्ञाओं को
  rationale: संबंधवाचक genitive को प्रसंगानुसार उन प्रतिज्ञाओं के रूप में समझा गया है जो इस्राएल के पूर्वजों से की गई थीं। ‘पूर्वज’ आधुनिक हिन्दी में स्पष्ट है और कुलपिताओं तक सीमित व्याख्या नहीं थोपता।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: प्रसंग में यह इस्राएल के अभिषिक्त उद्धारकर्ता की उपाधि है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और व्यापक रूप से बोधगम्य है।
- issue: ἀλήθεια θεοῦ का अर्थ
  choice: परमेश्वर का सत्य
  alternative: परमेश्वर की सत्यनिष्ठा / विश्वसनीयता
  rationale: मूल पदबंध ‘सत्य’ और प्रतिज्ञाएँ निभाने में परमेश्वर की विश्वसनीयता, दोनों की ओर संकेत कर सकता है। मुख्य पाठ व्यापक शब्द रखता है और पादटिप्पणी वाचा-निष्ठा की प्रबल संदर्भगत छाया बताती है।
- issue: τῶν πατέρων का संबंध
  choice: पूर्वजों से की गई प्रतिज्ञाएँ
  alternative: पूर्वजों की प्रतिज्ञाएँ
  rationale: प्रसंग परमेश्वर द्वारा इस्राएल के पूर्वजों से की गई प्रतिज्ञाओं की पुष्टि की बात करता है। यह रूप हिन्दी में संभावित भ्रांति दूर करता है कि प्रतिज्ञाएँ स्वयं पूर्वजों ने की थीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खतनावाले’ सामूहिक पहचान को स्पष्ट करता है; ‘सेवक’ ecclesial पद का अनावश्यक अर्थ नहीं लाता। वाक्य के अंत का अल्पविराम अगले पद से इसके निकट व्याकरणिक और तर्कगत संबंध को दर्शाता है।
