- from: क्योंकि उन्होंने ऐसा करना अच्छा समझा, और वे उनके ऋणी भी हैं। कारण, यदि गैर-यहूदियों[a] ने उनकी आत्मिक बातों[b] में सहभागिता पाई है, तो उन्हें भी भौतिक वस्तुओं[c] से उनकी सेवा करनी चाहिए।
  to: क्योंकि उन्होंने ऐसा करना प्रसन्नता से स्वीकार किया, और वे उनके ऋणी भी हैं। क्योंकि यदि गैर-यहूदियों[a] ने उनकी आत्मिक बातों[b] में सहभागिता की है, तो भौतिक वस्तुओं[c] के द्वारा उनकी सेवा करना भी उनका कर्तव्य है।
