id: ROM.15.27
reference: Romans 15:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εὐδόκησαν γάρ, καὶ ὀφειλέται ⸂εἰσὶν αὐτῶν⸃· εἰ γὰρ τοῖς πνευματικοῖς αὐτῶν ἐκοινώνησαν τὰ ἔθνη, ὀφείλουσιν καὶ ἐν τοῖς σαρκικοῖς λειτουργῆσαι αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/027.yaml
  text: For they were pleased to do it[a], and they are indebted to them. For if the Gentiles have shared in their spiritual things[c][b], they also owe it to minister to them in material things.
translation:
  language: hi
  text: क्योंकि उन्होंने ऐसा करना प्रसन्नता से स्वीकार किया, और वे उनके ऋणी भी हैं। क्योंकि यदि गैर-यहूदियों[a] ने उनकी आत्मिक बातों[b] में सहभागिता की है, तो भौतिक वस्तुओं[c] के द्वारा उनकी सेवा करना भी उनका कर्तव्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘जातियाँ’; यहाँ आशय गैर-यहूदियों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी आत्मिक आशीषों में।’ यूनानी में शाब्दिक रूप से ‘उनकी आत्मिक बातों में’ है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘शारीरिक बातों में’; यहाँ इसका अर्थ आत्मिक बातों के विपरीत भौतिक या देह-संबंधी सहायता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: उन्होंने ऐसा करना अच्छा समझा
  rationale: यह क्रिया स्वेच्छापूर्ण सहमति और प्रसन्न अनुमोदन दोनों व्यक्त करती है; ‘ऐसा’ पिछले पद में बताई गई सहायता की ओर संकेत करता है।
- source_word: ὀφειλέται εἰσὶν αὐτῶν
  choice: वे उनके ऋणी भी हैं
  rationale: यह वाक्यांश नैतिक दायित्व व्यक्त करता है और हिंदी में स्वाभाविक रूप से ‘ऋणी’ द्वारा सुरक्षित रहता है।
- source_word: τὰ ἔθνη
  choice: गैर-यहूदी
  rationale: इस पौलुसी संदर्भ में यहूदी विश्वासियों से भिन्न अन्यजातीय लोगों का संकेत है; आधुनिक पाठक के लिए ‘गैर-यहूदी’ स्पष्ट है।
- source_word: τοῖς πνευματικοῖς αὐτῶν
  choice: उनकी आत्मिक बातों में
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है; ‘बातों’ मूल की व्यापकता बनाए रखता है और ‘आशीषों’ को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐκοινώνησαν
  choice: सहभागिता पाई है
  rationale: यह दत्तिव के साथ किसी वस्तु में हिस्सा पाने या सहभागी होने का भाव व्यक्त करता है।
- source_word: ἐν τοῖς σαρκικοῖς
  choice: भौतिक वस्तुओं से
  rationale: यहाँ संदर्भ आर्थिक और शारीरिक आवश्यकताओं की सहायता का है, न कि पापमय ‘शारीरिकता’ का; हिंदी में करणसूचक ‘से’ स्वाभाविक है।
- source_word: λειτουργῆσαι
  choice: सेवा करनी चाहिए
  rationale: यह सम्मानपूर्ण और दायित्वपूर्ण सेवा का भाव रखता है, पर इसे पादरी-वर्ग तक सीमित नहीं करता।
theological_decisions:
- issue: σαρκικοῖς का πνευματικοῖς के विपरीत अर्थ
  choice: भौतिक वस्तुएँ
  alternative: शारीरिक बातें
  rationale: यरूशलेम के पवित्र लोगों के लिए धन-संग्रह के निकट संदर्भ में यह भौतिक या देह-संबंधी सहायता है, पापमय स्वभाव नहीं।
- issue: αὐτῶν / αὐτοῖς का संदर्भ
  choice: यरूशलेम के यहूदी विश्वासी, जिनके लिए सहायता भेजी जा रही है
  alternative: व्यापक रूप से इस्राएल या यहूदी लोग
  rationale: 15:25–26 का तत्काल संदर्भ यरूशलेम के पवित्र लोगों का है, यद्यपि तर्क में व्यापक उद्धार-ऐतिहासिक पृष्ठभूमि भी निहित हो सकती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘गैर-यहूदी’ स्पष्टता के लिए चुना गया है; ‘आत्मिक बातें’ मूल की अनिश्चित व्यापकता बनाए रखता है; ‘भौतिक वस्तुओं से सेवा’ आर्थिक सहायता के संदर्भ को स्वाभाविक हिंदी में व्यक्त करता है।
