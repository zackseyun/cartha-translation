  yaml_path: translation/nt/romans/015/026.yaml
  text: For Macedonia and Achaia were pleased to make a certain contribution for the poor among the saints in Jerusalem[a].
translation:
  language: hi
  text: क्योंकि मकिदुनिया और अखाया ने यरूशलेम में रहने वाले पवित्र जनों में से गरीब लोगों के लिए कुछ योगदान देना अच्छा समझा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ सहभागिता करना”; यूनानी अभिव्यक्ति ऐसी सहभागिता पर बल देती है जो भौतिक सहायता के रूप में प्रकट होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐδόκησαν
  choice: अच्छा समझा
  rationale: यह प्रयोग अनुकूल इच्छा और स्वेच्छापूर्ण निर्णय—दोनों को व्यक्त करता है; केवल ‘निर्णय किया’ कहना इसके सकारात्मक भाव को कम कर देता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: Μακεδονία καὶ Ἀχαΐα
  choice: मकिदुनिया और अखाया
  rationale: यूनानी पाठ में प्रदेशों के नाम ही व्याकरणिक कर्ता हैं और वे वहाँ के मसीही समुदायों के लिए लक्षणा के रूप में प्रयुक्त हुए हैं; अनकहे ‘कलीसियाओं’ या ‘विश्वासियों’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: κοινωνίαν τινὰ ποιήσασθαι
  choice: कुछ योगदान देना
  rationale: इस प्रसंग में κοινωνία भौतिक सहायता के रूप में प्रकट सहभागिता को सूचित करता है। ‘योगदान’ व्यावहारिक अर्थ स्पष्ट करता है और ‘कुछ’ अनिश्चित सर्वनाम τινά को व्यक्त करता है।
- source_word: εἰς τοὺς πτωχοὺς
  choice: जो गरीब हैं, उनके लिए
  rationale: εἰς यहाँ लाभार्थियों की ओर लक्षित सहायता बताता है; यह हिंदी रूप गरीब व्यक्तियों और सहायता के उद्देश्य को स्पष्ट करता है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों में
  rationale: संबंधकारक पद गरीबों को पवित्र जनों के समूह के भीतर के लोगों के रूप में पहचानता है। यह पौलुस के विश्वासियों के लिए प्रयुक्त संबोधन को बनाए रखता है।
- source_word: τῶν ἐν Ἰερουσαλήμ
  choice: यरूशलेम के
  rationale: स्थान-सूचक पद पवित्र जनों को विशेषित करता है; ‘यरूशलेम के पवित्र जन’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: पौलुस के संदर्भ में ἅγιοι का अनुवाद
  choice: पवित्र जन
  alternative: संत; परमेश्वर के लोग
  rationale: ‘पवित्र जन’ मूल शब्द के पवित्रता-संबंधी अर्थ और विश्वासियों की सामुदायिक पहचान को बनाए रखता है, साथ ही बाद के औपचारिक संत-घोषणा संबंधी अर्थ की अनचाही छाया से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रदेशों को कर्ता बनाकर मूल की लक्षणा सुरक्षित रखी गई है; ‘अच्छा समझा’ स्वेच्छा और सकारात्मक मनोभाव दोनों व्यक्त करता है।
