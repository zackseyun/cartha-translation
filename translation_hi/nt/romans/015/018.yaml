  text: οὐ γὰρ τολμήσω ⸂τι λαλεῖν⸃ ὧν οὐ κατειργάσατο Χριστὸς δι’ ἐμοῦ εἰς ὑπακοὴν ἐθνῶν, λόγῳ καὶ ἔργῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/018.yaml
  text: For I will not dare to speak of anything except what Messiah has accomplished through me for the obedience of the Gentiles[a], by word and deed[b],
translation:
  language: hi
  text: क्योंकि मैं केवल उसी का उल्लेख करने का साहस करूँगा, जो मसीह ने गैर-यहूदियों[a] की आज्ञाकारिता के लिए मेरे द्वारा वचन और कर्म से किया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जातियों की।”
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि मैं उस बात के सिवा किसी और बात का उल्लेख करने का साहस नहीं करूँगा, जो मसीह ने गैर-यहूदियों की आज्ञाकारिता के लिए मेरे द्वारा वचन और कर्म से की है।”
    reason: alternative_reading
lexical_decisions:
- source_word: τολμήσω
  choice: साहस नहीं करूँगा
  rationale: भविष्यकाल और साहस/जोखिम उठाकर कहने की धारणा, दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τι λαλεῖν ὧν οὐ κατειργάσατο
  choice: ऐसी किसी बात के विषय में बोलने ... जिसे ... पूरा न किया हो
  rationale: 'यूनानी की नकारात्मक प्रतिबंधात्मक रचना को औपचारिक रूप से सुरक्षित रखता है: पौलुस केवल उसी की चर्चा करेगा जिसे मसीह ने उसके द्वारा किया है।'
- source_word: Χριστὸς
  choice: मसीह
  rationale: हिन्दी बाइबलीय प्रयोग में यह Χριστός का प्रतिष्ठित, सहज और उपाधिसूचक रूप है।
- source_word: δι’ ἐμοῦ
  choice: मेरे द्वारा
  rationale: मसीह को प्रधान कर्ता और पौलुस को माध्यम बनाए रखने वाली agency/instrumentality को व्यक्त करता है।
- source_word: εἰς ὑπακοὴν ἐθνῶν
  choice: गैर-यहूदियों को आज्ञाकारी बनाने के लिए
  rationale: रोमियों के संदर्भ में ἔθνη का अर्थ गैर-यहूदी लोग है; हिन्दी में उद्देश्य/परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: λόγῳ καὶ ἔργῳ
  choice: वचन और कर्म के द्वारा
  rationale: दोनों संज्ञाओं के साधनवाचक बल को बनाए रखते हुए परिचित और गरिमापूर्ण जोड़ी प्रस्तुत करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ पदवी का भाव उपयुक्त है; ‘मसीह’ आधुनिक मानक हिन्दी में व्यापक और स्वाभाविक बाइबलीय रूप है।
- issue: ἐθνῶν का संदर्भगत अर्थ
  choice: गैर-यहूदियों
  alternative: जातियों
  rationale: रोमियों में यह प्रायः यहूदियों से भिन्न लोगों को दर्शाता है; विकल्प में इसके व्यापक शाब्दिक अर्थ को सुरक्षित रखा गया है।
- issue: नकारात्मक प्रतिबंधात्मक वाक्यरचना
  choice: जिसे मसीह ने ... पूरा न किया हो
  alternative: उसके सिवा किसी बात के विषय में नहीं, जो मसीह ने ... पूरी की है
  rationale: मुख्य पाठ यूनानी οὐ ... ὧν οὐ की तनावपूर्ण नकारात्मक रचना के अधिक निकट रहता है, जबकि पादटिप्पणी अधिक स्पष्ट सकारात्मक-अपवादात्मक रूप देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘गैर-यहूदी’ संदर्भगत स्पष्टता देता है; ‘जातियाँ’ को पादटिप्पणी में रखा गया है। मुख्य वाक्य में मूल यूनानी की दोहरी नकारात्मक, प्रतिबंधात्मक संरचना को यथासंभव सुरक्षित रखा गया है।
