id: ROM.15.7
reference: Romans 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Διὸ προσλαμβάνεσθε ἀλλήλους, καθὼς καὶ ὁ Χριστὸς προσελάβετο ⸀ὑμᾶς, εἰς δόξαν ⸀τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/007.yaml
  text: Therefore welcome one another[a], just as the Messiah also welcomed you[c][b], for the glory of God.
translation:
  language: hi
  text: इसलिए एक-दूसरे को अपनाओ[a], जैसे मसीह ने भी तुम्हें अपनाया, ताकि परमेश्वर की महिमा हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक-दूसरे को स्वीकार करो” अथवा “एक-दूसरे का स्वागत करो।”
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर की महिमा के लिए।” यूनानी में यह वाक्यांश मसीह के तुम्हें अपनाने या एक-दूसरे को अपनाने की पूरी आज्ञा से जुड़ा समझा जा सकता है।
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: προσλαμβάνεσθε ἀλλήλους
  choice: एक-दूसरे को अपनाओ
  rationale: यह पारस्परिक, संबंधपरक स्वीकार और स्वागत का भाव व्यक्त करता है; केवल सहन करने का अर्थ नहीं देता।
- source_word: καθὼς καὶ
  choice: जैसे ... भी
  rationale: तुलना और καί के योगात्मक बल, दोनों को सुरक्षित रखता है।
- source_word: ὁ Χριστὸς
  choice: मसीह
  rationale: हिन्दी में प्रचलित ‘मसीह’ इस पदवी के मसीही/अभिषिक्त अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: προσελάβετο ὑμᾶς
  choice: तुम्हें अपनाया
  rationale: आज्ञा में प्रयुक्त उसी यूनानी क्रिया के साथ शब्दगत समानता बनाए रखता है और बहुवचन ‘तुम्हें’ को ठीक व्यक्त करता है।
- source_word: εἰς δόξαν τοῦ θεοῦ
  choice: ताकि परमेश्वर की महिमा हो
  rationale: εἰς के लक्ष्य अथवा परिणाम के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक संबंध पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: संदर्भ में यह पदवी है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और व्यापक रूप से बोधगम्य है।
- issue: προσλαμβάνομαι का सामुदायिक भाव
  choice: अपनाओ
  alternative: स्वीकार करो / स्वागत करो
  rationale: रोमियों 14–15 के संदर्भ में यह समुदाय के भीतर सक्रिय पारस्परिक ग्रहणशीलता दिखाता है, बिना किसी संकीर्ण सांप्रदायिक अर्थ को जोड़े।
- issue: εἰς δόξαν τοῦ θεοῦ का संबंध
  choice: ताकि परमेश्वर की महिमा हो
  alternative: परमेश्वर की महिमा के लिए
  rationale: वाक्यांश लक्ष्य या परिणाम बता सकता है और उसका संबंध मसीह के अपनाने अथवा पूरी पारस्परिक आज्ञा से समझा जा सकता है; मुख्य पाठ स्वाभाविक लक्ष्यभाव देता है और पादटिप्पणी इस वास्तविक अस्पष्टता को दर्शाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन और आत्मीय है। शैली संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है।
