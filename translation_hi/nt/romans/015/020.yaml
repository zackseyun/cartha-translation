source:
  edition: SBLGNT
  text: οὕτως δὲ ⸀φιλοτιμούμενον εὐαγγελίζεσθαι οὐχ ὅπου ὠνομάσθη Χριστός, ἵνα μὴ ἐπ’ ἀλλότριον θεμέλιον οἰκοδομῶ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/020.yaml
  text: And in this way I make it my ambition to proclaim the good news[a], not where Messiah has already been named[b], so that I might not build on another's foundation.
translation:
  language: hi
  text: और इस प्रकार मैंने यह अपना लक्ष्य बनाया है कि शुभ समाचार वहाँ न सुनाऊँ जहाँ मसीह[a] का नाम लिया जा चुका है, ताकि मैं किसी दूसरे की नींव[b] पर निर्माण न करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; इसलिए “मसीह” अनुवाद किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “किसी अन्य की नींव पर।” मूल में भवन और नींव का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως δὲ
  choice: और इस प्रकार
  rationale: δὲ यहाँ हल्का संयोजक है और οὕτως पौलुस की पिछली सेवकाई-विवेचना से इस कथन को जोड़ता है।
- source_word: φιλοτιμούμενον
  choice: मैंने यह अपना लक्ष्य बनाया है
  rationale: यह कृदंत उत्सुक अभिलाषा और सचेत सेवकाई-लक्ष्य का भाव देता है; हिन्दी में यह प्रयोग स्वाभाविक और स्पष्ट है।
- source_word: εὐαγγελίζεσθαι
  choice: शुभ समाचार सुनाऊँ
  rationale: मूल क्रिया शुभ समाचार की घोषणा करने को व्यक्त करती है; यह पारंपरिक धार्मिक शब्दावली तक सीमित हुए बिना सामान्य पाठक के लिए सुबोध है।
- source_word: ὠνομάσθη Χριστός
  choice: मसीह का नाम लिया जा चुका है
  rationale: यह रूप निष्क्रिय क्रिया और पूर्व में हो चुकी सार्वजनिक पहचान या घोषणा—दोनों को बनाए रखता है। 'पहले ही' अलग से जोड़ने के बजाय पूर्णतासूचक रूप संदर्भगत पूर्वता व्यक्त करता है।
- source_word: ἐπ’ ἀλλότριον θεμέλιον
  choice: किसी दूसरे की नींव पर
  rationale: ἀλλότριον का अर्थ किसी अन्य से संबंधित है; हिन्दी वाक्य मूल में निहित न होने वाले पुरुष-सूचक शब्द को जोड़े बिना रूपक बनाए रखता है।
- source_word: οἰκοδομῶ
  choice: निर्माण न करूँ
  rationale: '''नींव'' के साथ भवन-निर्माण का रूपक स्पष्ट रहता है और प्रेरिताई सेवकाई के आशय की अतिरिक्त व्याख्या पाठ में नहीं जोड़ी जाती।'
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस प्रसंग में Χριστός उस व्यक्ति की उपाधि के रूप में प्रयुक्त है जिसकी घोषणा की जाती है; इसलिए 'मसीह' उपाधिगत अर्थ को स्पष्ट रखता है।
- issue: पौलुस की सेवकाई-नीति का स्वरूप
  choice: पौलुस के अपने लक्ष्य के रूप में प्रस्तुत
  alternative: पहले से प्रचारित क्षेत्रों में सेवा करने पर सार्वभौमिक रोक
  rationale: φιλοτιμούμενον व्यक्तिगत अभिलाषा या लक्ष्य बताता है। अनुवाद इसे सभी सेवकों के लिए आदेश बनाकर धार्मिक तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। 'शुभ समाचार सुनाना' सामान्य पाठक के लिए सुलभ है, जबकि 'मसीह', 'नींव' और 'निर्माण' मूल की धार्मिक तथा रूपकात्मक भाषा को बनाए रखते हैं।
