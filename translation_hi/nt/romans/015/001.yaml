  text: Ὀφείλομεν δὲ ἡμεῖς οἱ δυνατοὶ τὰ ἀσθενήματα τῶν ἀδυνάτων βαστάζειν, καὶ μὴ ἑαυτοῖς ἀρέσκειν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/001.yaml
  text: We who are strong ought to bear the weaknesses of the weak[a], and not please ourselves.
translation:
  language: hi
  text: हम जो बलवान हैं, हमें निर्बलों की कमज़ोरियों[a] का भार उठाना चाहिए और अपनी ही इच्छा पूरी नहीं करनी चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्बलों की दुर्बलताएँ” अथवा “निर्बलों की चूकें।” यूनानी शब्द कमज़ोरियों, सीमाओं या चूकों का अर्थ दे सकता है; यहाँ संभवतः पिछले अध्याय में चर्चा की गई विवेक-संबंधी झिझक और सीमाएँ अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὀφείλομεν
  choice: हमें … चाहिए
  rationale: यह नैतिक दायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, पर इसे प्रत्यक्ष कठोर आज्ञा के रूप में नहीं बदलता।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: यहाँ δὲ पिछले विचार से हल्के संक्रमण का संकेत देता है; हिन्दी में अनुच्छेद-संदर्भ और वाक्य-क्रम से यह संबंध स्पष्ट है। ‘परन्तु’ जोड़ने से अनावश्यक प्रबल विरोध उत्पन्न हो सकता था।
- source_word: ἡμεῖς οἱ δυνατοὶ
  choice: हम जो बलवान हैं
  rationale: मूल के बलवान–निर्बल विरोध और ἡμεῖς के बलाघात को बनाए रखता है। संदर्भ में बलवान होना मुख्यतः विवेक और विश्वास की स्वतंत्रता से जुड़ा है, न कि शारीरिक बल से।
- source_word: τὰ ἀσθενήματα
  choice: दुर्बलताओं
  rationale: यह सीमाओं, कमज़ोरियों या चूकों के व्यापक अर्थ को खुला रखता है और अनावश्यक रूप से नैतिक दोष का आरोप नहीं लगाता।
- source_word: τῶν ἀδυνάτων
  choice: निर्बलों की
  rationale: यह οἱ δυνατοί के साथ मूल का स्पष्ट शब्द-विरोध बनाए रखता है और रोमियों 14 के संदर्भ में अधिक सीमित विवेक रखनेवालों को सूचित करता है।
- source_word: βαστάζειν
  choice: का भार उठाना
  rationale: मूल के उठाने/ढोने के रूपक को सुरक्षित रखता है और केवल अनिच्छा से सह लेने की अपेक्षा सक्रिय सहयोग का भाव देता है।
- source_word: καὶ μὴ ἑαυτοῖς ἀρέσκειν
  choice: और अपने ही सुख की चिंता नहीं करनी चाहिए
  rationale: शाब्दिक ‘अपने आप को प्रसन्न न करें’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और अपने हित या संतोष को लक्ष्य न बनाने का नैतिक आशय व्यक्त करता है।
theological_decisions:
- issue: ‘बलवान’ और ‘निर्बल’ का आशय
  choice: मुख्यतः ऐसे विश्वासियों का विरोध जिनके विवेक की स्वतंत्रता या दृढ़ता अलग-अलग है
  alternative: सामाजिक रूप से शक्तिशाली और शक्तिहीन, अथवा शारीरिक रूप से बलवान और दुर्बल
  rationale: रोमियों 14–15 का निकट संदर्भ भोजन और विशेष दिनों के विषय में विवेकगत मतभेदों पर केंद्रित है। फिर भी मुख्य पाठ में व्याख्यात्मक शब्द जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बलवान–निर्बल’ और ‘दुर्बलताओं का भार उठाना’ मूल के विरोध तथा रूपक को बनाए रखते हैं; पादटिप्पणी संभावित अर्थ-सीमा स्पष्ट करती है।
