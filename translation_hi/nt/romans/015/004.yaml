source:
  edition: SBLGNT
  text: ὅσα γὰρ προεγράφη, ⸀εἰς τὴν ἡμετέραν διδασκαλίαν ⸀ἐγράφη, ἵνα διὰ τῆς ὑπομονῆς καὶ διὰ τῆς παρακλήσεως τῶν γραφῶν τὴν ἐλπίδα ἔχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/004.yaml
  text: For whatever was written beforehand was written for our instruction[b][a], so that through the endurance and through the encouragement of the Scriptures we might have hope.
translation:
  language: hi
  text: क्योंकि जो कुछ पहले लिखा गया था, वह हमारी शिक्षा के लिए लिखा गया था, ताकि हम धीरज और पवित्र शास्त्र के प्रोत्साहन[a] के द्वारा आशा रख सकें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सांत्वना”; παράκλησις का अर्थ प्रोत्साहन, सांत्वना या आग्रह भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ताकि हम आशा रखें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅσα
  choice: जो कुछ
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम का व्यापक और अनिश्चित भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προεγράφη
  choice: पहले लिखा गया था
  rationale: προ- के कालगत भाव को सुरक्षित रखता है और पहले से लिखे गए पवित्र शास्त्र की ओर संकेत करता है।
- source_word: εἰς τὴν ἡμετέραν διδασκαλίαν
  choice: हमारी शिक्षा के लिए
  rationale: εἰς के प्रयोजनात्मक भाव और διδασκαλία के शिक्षण/निर्देशन संबंधी अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγράφη
  choice: लिखा गया था
  rationale: ग्रीक में γράφω की पुनरावृत्ति के अनुरूप 'लिखा' दोहराकर वाक्य का आलंकारिक बल बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: प्रयोजन सूचक उपवाक्य को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: διὰ τῆς ὑπομονῆς
  choice: धीरज के द्वारा
  rationale: ὑπομονή कठिनाई में टिके रहनेवाले धैर्य को दर्शाता है; 'धीरज' सामान्य पाठक के लिए सहज और गरिमापूर्ण है।
- source_word: διὰ τῆς παρακλήσεως τῶν γραφῶν
  choice: पवित्र शास्त्र से मिलनेवाले ... प्रोत्साहन के द्वारा
  rationale: παράκλησις का मुख्य प्रसंगगत अर्थ उत्साह और बल देना है। हिन्दी में संबंध को स्वाभाविक बनाने के लिए 'से मिलनेवाले' प्रयोग किया गया है, जबकि वैकल्पिक 'सांत्वना' पादटिप्पणी में रखा गया है।
- source_word: τῶν γραφῶν
  choice: पवित्र शास्त्र
  rationale: पौलुस के प्रयोग में यह पवित्र लेखों को दर्शाता है; हिन्दी में एकवचन सामूहिक पद 'पवित्र शास्त्र' मानक और स्पष्ट है।
- source_word: τὴν ἐλπίδα ἔχωμεν
  choice: आशा रख सकें
  rationale: ἵνα के बाद वर्तमान संभावनार्थक क्रिया के प्रयोजन/अभिप्रेत परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आशा उत्पन्न करने में पवित्र शास्त्र की भूमिका
  choice: वाक्य पवित्र शास्त्र को शिक्षा का साधन तथा धीरज और प्रोत्साहन का स्रोत बताता है, जिनके द्वारा विश्वासी आशा रखते हैं।
  alternative: संबंधकारक को अधिक सीमित रूप से केवल पवित्र शास्त्र से मिलनेवाले प्रोत्साहन के साथ जोड़ा जा सकता है, जबकि धीरज अलग मानवीय गुण हो।
  rationale: ग्रीक क्रम में τῶν γραφῶν निकटतः παρακλήσεως से जुड़ा है, पर समूची युग्मित अभिव्यक्ति पर उसका व्यापक प्रभाव भी संभव है। हिन्दी रचना दोनों को पवित्र शास्त्र से मिलनेवाला बताती है, जो संदर्भगत अर्थ को स्पष्ट करती है; इस संबंध की सूक्ष्म व्याकरणिक संभावना को निर्णयात्मक सिद्धांत में नहीं बदला गया।
- issue: ἔχωμεν का भाव
  choice: आशा रख सकें
  alternative: हम आशा रखें
  rationale: यह प्रयोजनवाचक संभावनार्थक रूप है; 'रख सकें' अभिप्रेत परिणाम को व्यक्त करता है, इसे अविश्वास या अनिश्चितता का कथन नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। 'जो कुछ पहले लिखा गया था' मूल की पुनरावृत्ति और व्यापकता को बनाए रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
