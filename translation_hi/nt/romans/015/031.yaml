id: ROM.15.31
reference: Romans 15:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα ῥυσθῶ ἀπὸ τῶν ἀπειθούντων ἐν τῇ Ἰουδαίᾳ ⸀καὶ ἡ διακονία μου ἡ εἰς Ἰερουσαλὴμ εὐπρόσδεκτος ⸂τοῖς ἁγίοις γένηται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/031.yaml
  text: so that I may be rescued from those who are disobedient in Judea[a], and that my service for Jerusalem may become acceptable to the saints,
translation:
  language: hi
  text: कि मैं यहूदिया में आज्ञा न माननेवालों[a] से बचाया जाऊँ, और यरूशलेम के लिए मेरी सेवा पवित्र जनों को स्वीकार्य हो जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया में अविश्वासियों से।” यूनानी शब्द में विश्वास करने से इनकार और इस प्रकार आज्ञा न मानने—दोनों का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: कि ... और ...
  rationale: यह पौलुस की प्रार्थना-विनती के दो समन्वित उद्देश्यों को स्वाभाविक हिन्दी में जोड़ता है।
- source_word: ῥυσθῶ
  choice: मैं ... बचाया जाऊँ
  rationale: निष्क्रिय संभावनार्थक क्रिया संकट से छुड़ाए जाने की प्रार्थना व्यक्त करती है।
- source_word: ἀπὸ τῶν ἀπειθούντων
  choice: आज्ञा न माननेवालों से
  rationale: यह ἀπειθέω के अवज्ञा तथा विश्वास से इनकार—दोनों से जुड़े अर्थ-क्षेत्र को पूरी तरह केवल बौद्धिक अविश्वास तक सीमित नहीं करता।
- source_word: ἐν τῇ Ἰουδαίᾳ
  choice: यहूदिया में
  rationale: भौगोलिक नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: διακονία
  choice: सेवा
  rationale: यह शब्द पौलुस द्वारा सहायता पहुँचाने के ठोस कार्य और व्यापक सेवकाई—दोनों की गुंजाइश बनाए रखता है।
- source_word: ἡ εἰς Ἰερουσαλήμ
  choice: यरूशलेम के लिए
  rationale: सेवा की दिशा और लाभार्थी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐπρόσδεκτος
  choice: स्वीकार्य
  rationale: अनुकूल रूप से ग्रहण किए जाने का मूल्यांकनात्मक भाव सुरक्षित रहता है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र जनों को
  rationale: पौलुस के विश्वासियों के लिए प्रयुक्त पद का अर्थ स्पष्ट रखते हुए असाधारण या पदवी-सूचक आधुनिक अर्थ से बचता है।
- source_word: γένηται
  choice: हो जाए
  rationale: γίνομαι के ‘ऐसा बन/हो जाना’ के गतिशील भाव को हिन्दी में सहज रूप से दर्शाता है।
theological_decisions:
- issue: यहूदिया में पौलुस के विरोधियों के लिए ἀπειθούντων का अर्थ
  choice: आज्ञा न माननेवाले
  alternative: अविश्वासी
  rationale: यूनानी कृदंत विश्वास न करने और फलस्वरूप आज्ञा न मानने दोनों का भाव रख सकता है। मुख्य पाठ व्यापक अर्थ रखता है और दूसरा सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पवित्र जन’ पौलुस के विश्वासियों के लिए प्रयुक्त संबोधन को स्पष्ट करता है; वाक्य का आरम्भ ‘कि’ से है क्योंकि यह पिछले पद में की गई प्रार्थना-विनती पर निर्भर उद्देश्य-वाक्य है।
