  text: νυνὶ δὲ μηκέτι τόπον ἔχων ἐν τοῖς κλίμασι τούτοις, ἐπιποθίαν δὲ ἔχων τοῦ ἐλθεῖν πρὸς ὑμᾶς ἀπὸ ⸀ἱκανῶν ἐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/023.yaml
  text: But now[a], no longer having any place in these regions, but having had a longing for many years to come to you,
translation:
  language: hi
  text: पर अब, इन क्षेत्रों में मेरे लिए कोई स्थान नहीं रहा है, और मैं कई वर्षों से तुम्हारे पास आने की लालसा रखता आया हूँ,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: δέ के संक्रमण और νυνί के वर्तमान-कालिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μηκέτι τόπον ἔχων
  choice: मेरे लिए कोई स्थान न रह जाने पर
  rationale: μηκέτι की ‘अब और नहीं’ की धारणा को ‘न रह जाने’ से व्यक्त किया गया है। ‘स्थान’ मूल रूपक को बनाए रखता है, जबकि सन्दर्भ में सेवाकार्य की शेष गुंजाइश अभिप्रेत हो सकती है।
- source_word: ἐν τοῖς κλίμασι τούτοις
  choice: इन क्षेत्रों में
  rationale: κλίμασι भौगोलिक क्षेत्रों या इलाकों को सूचित करता है; ‘क्षेत्रों’ आधुनिक और स्पष्ट है।
- source_word: ἐπιποθίαν δὲ ἔχων
  choice: और ... लालसा होने के कारण
  rationale: ἐπιποθία की प्रबल इच्छा को ‘लालसा’ व्यक्त करती है। हिन्दी में कारणसूचक कृदन्तीय रचना अगले पद से जुड़ने वाले यूनानी वाक्य-प्रवाह को बनाए रखती है। दूसरे δέ को प्रसंगानुकूल ‘और’ से रखा गया है, क्योंकि हिन्दी में दोहरा विरोधसूचक संयोजक अस्वाभाविक होता।
- source_word: τοῦ ἐλθεῖν πρὸς ὑμᾶς
  choice: तुम्हारे पास आने की
  rationale: मूल infinitive के आशय को बिना ‘भेंट करने’ जैसी अतिरिक्त व्याख्या जोड़े सीधे व्यक्त करता है।
- source_word: ἀπὸ ἱκανῶν ἐτῶν
  choice: कई वर्षों से
  rationale: भूतकाल से वर्तमान तक चली आ रही अवधि का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: τόπον का आशय
  choice: मुख्य पाठ में ‘स्थान’ रखकर रूपक को खुला रखा गया
  alternative: ‘सेवाकार्य का अवसर/गुंजाइश’
  rationale: सन्दर्भ पौलुस के मिशन-कार्य की गुंजाइश का संकेत देता है, पर यूनानी शब्द स्वयं ‘स्थान’ भी कहता है; इसलिए व्याख्यात्मक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद मूल यूनानी की तरह अगले पद से जुड़ा हुआ वाक्यांश है, इसलिए अन्त में अल्पविराम रखा गया है।
