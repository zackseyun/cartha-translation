id: ROM.15.10
reference: Romans 15:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πάλιν λέγει· Εὐφράνθητε, ἔθνη, μετὰ τοῦ λαοῦ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/010.yaml
  text: And again he says[a], “Rejoice, Gentiles, with his people.”
translation:
  language: hi
  text: और फिर वह कहता है, “हे गैर-यहूदियो,[a] उसके लोगों के साथ आनन्द मनाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे राष्ट्रो, उसके लोगों के साथ आनन्द मनाओ।”
    reason: ἔθνη का अर्थ ‘गैर-यहूदी’ या अधिक व्यापक रूप से ‘राष्ट्र’ हो सकता है।
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह एक और पवित्रशास्त्रीय उद्धरण प्रस्तुत करता है; ‘फिर’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: λέγει
  choice: वह कहता है
  rationale: वर्तमान काल को बनाए रखा गया है, क्योंकि उद्धरण-सूत्र में पवित्रशास्त्र को अभी बोलते हुए प्रस्तुत किया गया है। यूनानी में कर्ता निहित है, इसलिए ‘वह’ उसकी अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: Εὐφράνθητε
  choice: आनन्द मनाओ
  rationale: यह आज्ञार्थक रूप प्रसन्न होने या आनन्द मनाने का आह्वान करता है; ‘आनन्द मनाओ’ गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
- source_word: ἔθνη
  choice: गैर-यहूदियो
  rationale: रोमियों 15 के संदर्भ में यह शब्द यहूदियों से भिन्न लोगों को सूचित करता है। सम्बोधन के कारण ‘गैर-यहूदियो’ रूप रखा गया है; व्यापक अर्थ ‘राष्ट्रो’ पाद-टिप्पणी में सुरक्षित है।
- source_word: μετὰ τοῦ λαοῦ αὐτοῦ
  choice: उसके लोगों के साथ
  rationale: यह संगति का सीधा अर्थ व्यक्त करता है और ‘उसके लोगों’ की वाचाई पहचान को ‘इस्राएल’ जोड़कर अधिक स्पष्ट नहीं करता।
- source_word: λαοῦ
  choice: लोगों
  rationale: यूनानी शब्द का सीधा अर्थ रखा गया है। संदर्भ में यह परमेश्वर की प्रजा, विशेषतः इस्राएल, की ओर संकेत कर सकता है, पर मुख्य पाठ में उसे खुलकर जोड़ना व्याख्यात्मक विस्तार होता।
theological_decisions:
- issue: यहूदी और गैर-यहूदी एकता के संदर्भ में ἔθνη का अनुवाद
  choice: गैर-यहूदियो
  alternative: राष्ट्रो
  rationale: तात्कालिक संदर्भ में पौलुस गैर-यहूदियों के परमेश्वर की स्तुति में सम्मिलित होने पर बल देता है। फिर भी मूल शब्द और पुराने नियम के उद्धरण में ‘राष्ट्र’ का व्यापक अर्थ संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- issue: λέγει के निहित कर्ता की पहचान
  choice: वह कहता है
  alternative: पवित्रशास्त्र कहता है
  rationale: यूनानी पाठ कर्ता को स्पष्ट नाम नहीं देता। ‘वह’ मूल की संक्षिप्तता और कुछ अस्पष्टता बनाए रखता है; ‘पवित्रशास्त्र’ जोड़ना संभावित अर्थ को स्पष्ट तो करता, पर मूल से अधिक कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण उद्धरण-शैली अपनाई गई है। ‘आनन्द’ का वर्तनी-रूप धार्मिक साहित्य में परिचित है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सहज रखी गई है।
