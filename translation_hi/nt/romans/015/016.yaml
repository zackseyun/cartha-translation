source:
  edition: SBLGNT
  text: εἰς τὸ εἶναί με λειτουργὸν ⸂Χριστοῦ Ἰησοῦ⸃ εἰς τὰ ἔθνη, ἱερουργοῦντα τὸ εὐαγγέλιον τοῦ θεοῦ, ἵνα γένηται ἡ προσφορὰ τῶν ἐθνῶν εὐπρόσδεκτος, ἡγιασμένη ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/016.yaml
  text: to be a minister of Messiah Jesus to the Gentiles[a], serving as a priest in the gospel of God, so that the offering of the Gentiles may become acceptable[d][c][b], sanctified by the Holy Spirit.
translation:
  language: hi
  text: कि मैं गैर-यहूदियों[a] के लिए मसीह यीशु का सेवक बनूँ और परमेश्वर के सुसमाचार की याजकीय सेवा करूँ[b], ताकि गैर-यहूदियों की भेंट[c] पवित्र आत्मा के द्वारा[d] पवित्र की हुई और ग्रहणयोग्य बने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जातियों के लिए।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “याजक के समान पवित्र सेवा करूँ।”'
    reason: lexical_alternative
  - marker: c
    text: संभवतः गैर-यहूदी स्वयं परमेश्वर को भेंट के रूप में प्रस्तुत किए गए हैं; दूसरा संभव अर्थ है, “गैर-यहूदियों द्वारा चढ़ाई गई भेंट।”
    reason: alternative_reading
  - marker: d
    text: या, “पवित्र आत्मा में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λειτουργὸν
  choice: सेवक
  rationale: यह शब्द सार्वजनिक या धार्मिक सेवा करने वाले व्यक्ति को सूचित कर सकता है। यहाँ याजकीय क्रिया के साथ प्रयुक्त होने के कारण ‘सेवक’ सेवा का भाव रखता है, जबकि आगे का वाक्यांश पवित्र सेवा की उपमा स्पष्ट करता है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि के रूप में है; आधुनिक हिन्दी में ‘मसीह यीशु’ इसका स्वाभाविक और प्रचलित रूप है।
- source_word: εἰς τὰ ἔθνη
  choice: गैर-यहूदियों के लिए
  rationale: रोमियों के यहूदी–गैर-यहूदी संदर्भ में ἔθνη मुख्यतः गैर-यहूदी लोगों को दर्शाता है; ‘जातियों के लिए’ शाब्दिक विकल्प है।
- source_word: ἱερουργοῦντα
  choice: याजकीय सेवा करूँ
  rationale: यह क्रिया विशेष रूप से पवित्र अथवा याजकीय कार्य करने का अर्थ देती है। यह अनुवाद पौलुस की पुरोहितीय उपमा को बनाए रखता है, पर उसे औपचारिक पद का दावा नहीं बनाता।
- source_word: τὸ εὐαγγέλιον τοῦ θεοῦ
  choice: परमेश्वर के सुसमाचार
  rationale: यह पौलुस की परिचित अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: προσφορὰ τῶν ἐθνῶν
  choice: गैर-यहूदियों की भेंट
  rationale: ग्रीक संबंधकारक की वास्तविक अस्पष्टता बनी रहती है। संदर्भ में संभवतः गैर-यहूदी स्वयं परमेश्वर को अर्पित भेंट हैं, पर उनके द्वारा चढ़ाई गई भेंट का अर्थ भी व्याकरणतः संभव है।
- source_word: εὐπρόσδεκτος
  choice: ग्रहणयोग्य
  rationale: बलिदान या भेंट के संदर्भ में यह परमेश्वर द्वारा अनुकूल रूप से स्वीकार किए जाने का भाव स्पष्ट करता है।
- source_word: ἡγιασμένη
  choice: पवित्र की हुई
  rationale: पूर्ण निष्क्रिय कृदन्त उस वर्तमान दशा को व्यक्त करता है जो पवित्र किए जाने की क्रिया से बनी है; यह सामान्य पाठक के लिए ‘पवित्रीकृत’ से अधिक सहज है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा के द्वारा
  rationale: ἐν को यहाँ साधन अथवा कर्तृत्व के अर्थ में समझा गया है; ‘पवित्र आत्मा में’ भी संभव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पौलुस का अपने सेवाकार्य को याजकीय भाषा में व्यक्त करना
  choice: पौलुस गैर-यहूदियों के बीच अपने प्रेरितीय सुसमाचार-सेवाकार्य का वर्णन याजकीय उपमा से करता है।
  alternative: इसे औपचारिक याजकीय पद का दावा मानना, या याजकीय चित्र को हटाकर केवल सामान्य सेवा कहना।
  rationale: λειτουργός, ἱερουργέω और προσφορά मिलकर स्पष्ट याजकीय चित्र बनाते हैं। फिर भी यहाँ प्रायश्चितकारी बलिदान नहीं, बल्कि सुसमाचार-सेवा और गैर-यहूदियों को परमेश्वर के सामने भेंट के रूप में प्रस्तुत करने की बात है।
- issue: ‘गैर-यहूदियों की भेंट’ का आशय
  choice: मुख्यतः गैर-यहूदी स्वयं उस भेंट के रूप में समझे गए हैं जो पौलुस की सुसमाचार-सेवा के फलस्वरूप परमेश्वर को प्रस्तुत होती है।
  alternative: गैर-यहूदियों द्वारा चढ़ाई गई भेंट।
  rationale: निकटवर्ती याजकीय उपमा और गैर-यहूदियों के बीच पौलुस की सेवा पहला अर्थ अधिक संभावित बनाते हैं, पर ग्रीक संबंधकारक दूसरे अर्थ को पूरी तरह निषिद्ध नहीं करता; इसलिए मुख्य पाठ अस्पष्टता रखता और पादटिप्पणी दोनों बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘याजकीय सेवा’ मूल की पुरोहितीय उपमा को स्पष्ट रखती है; ‘गैर-यहूदी’ संदर्भगत अर्थ देता है; और संबंधकारक तथा ἐν की अस्पष्टताओं को पादटिप्पणियों में सुरक्षित रखा गया है।
