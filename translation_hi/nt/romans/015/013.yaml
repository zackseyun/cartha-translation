source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς ἐλπίδος πληρώσαι ὑμᾶς πάσης χαρᾶς καὶ εἰρήνης ἐν τῷ πιστεύειν, εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι ἐν δυνάμει πνεύματος ἁγίου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/013.yaml
  text: May the God of hope fill you with all joy and peace in believing, so that you may abound in hope by the power of the Holy Spirit.
translation:
  language: hi
  text: आशा का परमेश्वर तुम्हें विश्वास करते हुए सम्पूर्ण आनन्द और शान्ति से भर दे, ताकि तुम पवित्र आत्मा की सामर्थ्य से आशा में बढ़ते जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς ἐλπίδος
  choice: आशा का परमेश्वर
  rationale: यह पदबंध यूनानी संबंधकारक की संक्षिप्तता बनाए रखता है और परमेश्वर को आशा के स्रोत अथवा आशा के विषय के रूप में समझे जाने की स्वाभाविक व्यापकता को अनावश्यक रूप से सीमित नहीं करता। δὲ हल्का संयोजक है; इस स्वतंत्र पद में अलग से ‘अब’ या प्रबल विरोधसूचक शब्द जोड़ना आवश्यक नहीं है।
- source_word: πληρώσαι
  choice: भर दे
  rationale: आओरिस्ट ऑप्टेटिव यहाँ आशीर्वचनात्मक कामना व्यक्त करता है। ‘भर दे’ हिन्दी में स्वाभाविक है और परिपूर्णता के मूल रूपक को बनाए रखता है।
- source_word: πάσης χαρᾶς καὶ εἰρήνης
  choice: सम्पूर्ण आनन्द और शान्ति से
  rationale: πάσης की व्यापकता को ‘सम्पूर्ण’ व्यक्त करता है। ‘आनन्द’ और ‘शान्ति’ परिचित, स्पष्ट और गरिमापूर्ण हिन्दी शब्द हैं।
- source_word: ἐν τῷ πιστεύειν
  choice: विश्वास करते हुए
  rationale: ἐν के साथ क्रियार्थक संज्ञा विश्वास करने की अवस्था या परिस्थिति बताती है। ‘विश्वास करते हुए’ इसे संज्ञा ‘विश्वास’ मात्र में बदलने या स्पष्ट साधनार्थक अर्थ थोपने से बचाता है।
- source_word: εἰς τὸ περισσεύειν ὑμᾶς ἐν τῇ ἐλπίδι
  choice: ताकि तुम … आशा में भरपूर होते जाओ
  rationale: εἰς τὸ के उद्देश्य अथवा परिणामी भाव को ‘ताकि’ स्वाभाविक रूप से व्यक्त करता है। ‘भरपूर होते जाओ’ περισσεύειν की प्रचुरता और बढ़ते रहने के भाव को सहज हिन्दी में सामने लाता है।
- source_word: ἐν δυνάμει πνεύματος ἁγίου
  choice: पवित्र आत्मा की सामर्थ्य से
  rationale: यहाँ ἐν का साधनार्थक भाव प्रमुख है। ‘सामर्थ्य से’ बताता है कि आशा में भरपूर होना पवित्र आत्मा की सामर्थ्य के द्वारा होता है।
theological_decisions:
- issue: θεὸς τῆς ἐλπίδος में संबंध का अर्थ
  choice: आशा का परमेश्वर
  alternative: आशा देने वाला परमेश्वर
  rationale: मूल संबंधकारक स्रोत, विशेषता या आशा के विषय जैसे निकट भावों को समेट सकता है। अधिक व्याख्यात्मक विकल्प के स्थान पर संक्षिप्त हिन्दी पदबंध मूल की वास्तविक व्यापकता बनाए रखता है।
- issue: εἰς τὸ περισσεύειν में उद्देश्य और परिणाम
  choice: ताकि तुम … भरपूर होते जाओ
  alternative: जिसके परिणामस्वरूप तुम … भरपूर होते जाओ
  rationale: रचना उद्देश्य और परिणाम दोनों की छाया रख सकती है। प्रार्थनात्मक कामना के संदर्भ में ‘ताकि’ स्वाभाविक है, पर अनुवाद घटनाक्रम या किसी विशिष्ट धर्मशास्त्रीय व्यवस्था को नहीं जोड़ता।
- issue: πνεύματος ἁγίου का संदर्भ
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मिक सामर्थ्य
  rationale: पौलुस के संदर्भ में यह पदबंध दिव्य पवित्र आत्मा को सूचित करता है, केवल किसी पवित्र मनोभाव या निराकार शक्ति को नहीं। हिन्दी में प्रचलित व्यक्तिवाचक पद ‘पवित्र आत्मा’ मूल संदर्भ को स्पष्ट रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक और गरिमापूर्ण रखी गई है। वाक्य सामान्य पाठक के लिए सहज है; ‘सम्पूर्ण’, ‘सामर्थ्य’ और ‘भरपूर होते जाओ’ मूल की व्यापकता, शक्ति और प्रचुरता को संतुलित रूप से व्यक्त करते हैं।
