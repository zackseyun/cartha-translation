  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα ἐν χαρᾷ ⸀ἐλθὼν πρὸς ὑμᾶς διὰ θελήματος ⸀θεοῦ συναναπαύσωμαι ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/032.yaml
  text: so that by God's will I may come to you with joy and be refreshed together with you[a].
translation:
  language: hi
  text: ताकि मैं परमेश्वर की इच्छा से आनन्द के साथ आपके पास आऊँ और आपके साथ मिलकर विश्राम पाऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले निवेदन से जुड़ा उद्देश्यवाचक उपवाक्य प्रस्तुत करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक रूप से इसके प्रयोजन-भाव को बनाए रखता है।
- source_word: ἐν χαρᾷ
  choice: आनन्द के साथ
  rationale: यह आगमन की भाव-दशा अथवा रीति बताता है और संज्ञा ‘आनन्द’ को बनाए रखता है।
- source_word: ἐλθὼν πρὸς ὑμᾶς
  choice: मैं ... आपके पास आऊँ
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया के अधीन है; हिन्दी में इसे उद्देश्यवाचक रचना के भीतर क्रिया के रूप में व्यक्त करना स्पष्ट और स्वाभाविक है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: διά के साथ संबंधकारक यहाँ परमेश्वर की इच्छा के माध्यम अथवा उसके अनुसार होने का भाव देता है; हिन्दी वाक्यांश इस अर्थ को संक्षेप और स्वाभाविकता से रखता है।
- source_word: συναναπαύσωμαι
  choice: आपके साथ मिलकर विश्राम पाऊँ
  rationale: συν- उपसर्ग साझा अनुभव और ἀναπαύομαι विश्राम या राहत पाने का भाव देते हैं; यह अनुवाद उस सहभागिता को बिना अनावश्यक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: पौलुस और रोमी विश्वासियों के बीच अपेक्षित सहभागिता की पारस्परिकता
  choice: आपके साथ मिलकर विश्राम पाऊँ
  alternative: आपके साथ ताज़गी पाऊँ
  rationale: चुना हुआ रूप साझा विश्राम के भाव को सुरक्षित रखता है और पौलुस को केवल सेवा देने वाला नहीं, बल्कि उनके साथ राहत पाने वाला भी दिखाता है; फिर भी यूनानी क्रिया को स्पष्टतः ‘एक-दूसरे को’ कहकर आवश्यकता से अधिक पारस्परिक नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘आपके’ सम्मानपूर्ण बहुवचन के रूप में ὑμᾶς/ὑμῖν को व्यक्त करता है।
