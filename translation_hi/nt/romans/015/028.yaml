  text: τοῦτο οὖν ἐπιτελέσας, καὶ σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον, ἀπελεύσομαι δι’ ὑμῶν ⸀εἰς Σπανίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/028.yaml
  text: Therefore[a], when I have completed this and have sealed this fruit to them[c][b], I will go on by way of you to Spain.
translation:
  language: hi
  text: इसलिए, जब मैं यह काम पूरा कर लूँगा और यह फल उन्हें मुहरबंद करके सौंप दूँगा[a], तब मैं आपके यहाँ से होकर[b] स्पेन जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह फल उन्हें मुहर लगाकर [सौंप दूँगा]।” यहाँ “फल” अन्यजाति विश्वासियों द्वारा यरूशलेम के संतों के लिए इकट्ठी की गई आर्थिक भेंट है। “मुहरबंद” करने का भाव संभवतः उसे औपचारिक रूप से सुनिश्चित करना अथवा सुरक्षित ढंग से प्राप्तकर्ताओं को सौंपना है।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: या, “आपके बीच से होकर।” पौलुस का आशय संभवतः स्पेन जाते समय रोम के मार्ग से यात्रा करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο οὖν ἐπιτελέσας
  choice: इसलिए, जब मैं यह काम पूरा कर लूँगा
  rationale: οὖν पिछले विचार से निष्कर्ष अथवा संक्रमण दर्शाता है। τοῦτο उस चंदे को यरूशलेम पहुँचाने के काम की ओर संकेत करता है; ‘यह काम’ हिन्दी में संदर्भ को स्वाभाविक रूप से स्पष्ट करता है। कृदंत ἐπιτελέσας मुख्य भविष्यकालीन क्रिया से पहले काम पूरा होने को दर्शाता है।
- source_word: σφραγισάμενος αὐτοῖς τὸν καρπὸν τοῦτον
  choice: यह फल उन तक सुरक्षित रूप से पहुँचा दूँगा
  rationale: σφραγίζω का मूल अर्थ ‘मुहर लगाना’ है, पर इस प्रसंग में रूपकतः भेंट को उसके प्राप्तकर्ताओं तक प्रमाणित अथवा सुरक्षित ढंग से सौंपना अभिप्रेत जान पड़ता है। शाब्दिक ‘उनके लिए इस फल पर मुहर लगा दूँगा’ आधुनिक हिन्दी में अर्थ को भटका सकता है, इसलिए भाव मुख्य पाठ में और मूल बिंब पादटिप्पणी में रखा गया है। ‘फल’ पौलुस का रूपक बनाए रखता है।
- source_word: ἀπελεύσομαι δι’ ὑμῶν εἰς Σπανίαν
  choice: मैं आपके यहाँ से होकर स्पेन जाऊँगा
  rationale: ἀπελεύσομαι आगे प्रस्थान करने को और διά + संबंधकारक मार्ग अथवा माध्यम को दर्शाता है। ‘आपके यहाँ से होकर’ रोम के मार्ग से स्पेन जाने का स्वाभाविक हिन्दी रूप है, बिना सहायता के भाव को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: यरूशलेम की भेंट के संबंध में ‘मुहर लगाने’ के रूपक का अर्थ
  choice: मुख्य पाठ में ‘सुरक्षित रूप से पहुँचा दूँगा’, और पादटिप्पणी में शाब्दिक रूपक
  alternative: ‘यह फल उनके लिए मुहरबंद कर दूँगा’
  rationale: यूनानी रूपक सुरक्षित सुपुर्दगी, औपचारिक पुष्टि या सुनिश्चित हस्तांतरण का संकेत दे सकता है। शाब्दिक हिन्दी अस्पष्ट ही नहीं, भ्रामक भी हो सकती है; फिर भी पादटिप्पणी मूल शब्द-चित्र और उसकी वास्तविक अर्थ-सीमा को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘आपके यहाँ से होकर’ सामूहिक ὑμῶν को स्वाभाविक ढंग से व्यक्त करता है। ‘फल’ के पौलुसी रूपक को बनाए रखते हुए कठिन ‘मुहर’ रूपक की व्याख्या पादटिप्पणी में दी गई है।
