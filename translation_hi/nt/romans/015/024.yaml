source:
  edition: SBLGNT
  text: ὡς ⸀ἂν πορεύωμαι εἰς τὴν ⸀Σπανίαν, ἐλπίζω γὰρ διαπορευόμενος θεάσασθαι ὑμᾶς καὶ ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ ἐὰν ὑμῶν πρῶτον ἀπὸ μέρους ἐμπλησθῶ—
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/024.yaml
  text: whenever I go to Spain—for I hope[a], as I pass through, to see you and to be sent on my way there by you[c][b], if first I may be satisfied in part with your company—
translation:
  language: hi
  text: जब भी मैं स्पेन जाऊँगा[a]—क्योंकि मुझे आशा है कि वहाँ जाते हुए मैं आप लोगों से मिलूँगा और आप मेरी वहाँ तक की यात्रा में सहायता करेंगे[b], यदि पहले आप लोगों की संगति से मुझे कुछ हद तक तृप्ति मिल जाए[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मैं स्पेन जाऊँगा।” यूनानी रचना अनिश्चित भावी समय व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “आप मुझे वहाँ तक आगे भेजेंगे।” मूल क्रिया में सहायता देकर या कुछ दूर साथ चलकर किसी यात्री को आगे भेजने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पहले मैं आप लोगों से कुछ हद तक तृप्त हो जाऊँ।” यूनानी में शाब्दिक भाव ‘अंशतः भर जाऊँ’ है; सम्भवतः पौलुस आगे बढ़ने से पहले सीमित रूप में उनकी संगति का आनन्द लेने की बात कर रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς ἂν πορεύωμαι
  choice: जब भी मैं ... जाऊँगा
  rationale: ὡς ἄν के साथ संभावनार्थक क्रिया अनिश्चित भावी समय व्यक्त करती है; ‘जब भी’ इस भावी और कुछ हद तक अनिश्चित भाव को सहज हिन्दी में बनाए रखता है।
- source_word: Σπανίαν
  choice: स्पेन
  rationale: स्थान-नाम का आधुनिक मानक हिन्दी रूप।
- source_word: ἐλπίζω γὰρ
  choice: क्योंकि मुझे आशा है
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को और ‘मुझे आशा है’ अपेक्षा तथा अभिलाषा के संयुक्त भाव को व्यक्त करता है।
- source_word: διαπορευόμενος
  choice: उधर से जाते हुए
  rationale: यह कृदन्त मार्ग में होकर आगे जाने का भाव देता है; सन्दर्भ में रोम से होकर स्पेन जाने की बात है।
- source_word: θεάσασθαι ὑμᾶς
  choice: आप लोगों से मिलूँगा
  rationale: यात्रा के इस सन्दर्भ में θεάομαι केवल दृष्टि पड़ने के बजाय व्यक्तिगत भेंट का संकेत देता है; ‘मिलना’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ὑφ’ ὑμῶν προπεμφθῆναι ἐκεῖ
  choice: आप मुझे वहाँ की आगे की यात्रा के लिए विदा करेंगे
  rationale: προπέμπω किसी यात्री को आगे भेजने, साथ देने या सहायता देकर विदा करने का व्यापक भाव रखता है। यह रूप सहायता की ठीक प्रकृति निर्धारित नहीं करता।
- source_word: ἐὰν ... ἐμπλησθῶ
  choice: बशर्ते ... मुझे ... तृप्ति मिल जाए
  rationale: ἐάν के साथ संभावनार्थक क्रिया भावी शर्त व्यक्त करती है। ‘तृप्ति’ मूल के भर जाने के रूपक को पठनीय हिन्दी में आंशिक रूप से बनाए रखती है।
- source_word: ἀπὸ μέρους
  choice: कुछ हद तक
  rationale: शाब्दिक अर्थ ‘अंशतः’ है; ‘कुछ हद तक’ सीमितता को स्वाभाविक हिन्दी में रखता है और यह तय नहीं करता कि सीमा समय की है या संतोष की मात्रा की।
- source_word: ὑμῶν
  choice: आप लोगों की संगति से
  rationale: ἐμπλησθῶ के साथ सम्बन्धकारक का भाव यहाँ रोम के विश्वासियों के साथ रहने और सहभागिता का है; ‘संगति’ इसे स्पष्ट करता है, पर भावनात्मक या धार्मिक स्वरूप को अनावश्यक रूप से विशिष्ट नहीं बनाता।
theological_decisions:
- issue: रोम के विश्वासियों से पौलुस को मिलने वाली आगे की यात्रा-सहायता का स्वरूप
  choice: आगे की यात्रा के लिए विदा करेंगे
  alternative: आगे की यात्रा में सहायता करेंगे / साथ पहुँचाएँगे
  rationale: मूल क्रिया में व्यावहारिक सहायता, सामग्री देना या कुछ दूर साथ जाना सम्मिलित हो सकता है, पर पाठ कोई एक रूप निश्चित नहीं करता। चुना हुआ अनुवाद इस व्यापकता को बनाए रखता है।
- issue: रोम के विश्वासियों के साथ रहकर पौलुस की तृप्ति का अर्थ
  choice: आप लोगों की संगति से मुझे कुछ हद तक तृप्ति मिल जाए
  alternative: मैं आप लोगों से कुछ हद तक तृप्त हो जाऊँ / कुछ समय आपकी संगति का आनन्द ले लूँ
  rationale: मूल में भर जाने का रूपक और ‘अंशतः’ की सीमा दोनों हैं। अनुवाद संगति का सम्भावित सम्बन्ध स्पष्ट करता है, किन्तु यह निर्णय नहीं करता कि सीमा अवधि, अवसर या तृप्ति की मात्रा से सम्बन्धित है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज हिन्दी। बहुवचन ‘आप लोगों’ से ὑμᾶς/ὑμῶν की सामुदायिक बहुवचनता स्पष्ट की गई है। वाक्य के अन्त का दीर्घ विराम मूल पाठ में अगले पद तक जारी रहने वाली वाक्य-संरचना को दर्शाता है।
