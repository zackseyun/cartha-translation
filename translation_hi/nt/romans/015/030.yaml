source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ καὶ διὰ τῆς ἀγάπης τοῦ πνεύματος συναγωνίσασθαί μοι ἐν ταῖς προσευχαῖς ὑπὲρ ἐμοῦ πρὸς τὸν θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/030.yaml
  text: I urge you[a], brothers, through our Lord Jesus the Messiah and through the love of the Spirit, to strive together with me in prayers to God for me[c][b],
translation:
  language: hi
  text: हे भाइयो[b], मैं हमारे प्रभु यीशु मसीह[a] के द्वारा और आत्मा के प्रेम[c] के द्वारा तुमसे आग्रह करता हूँ कि मेरे लिए परमेश्वर से प्रार्थना करने में मेरे साथ मिलकर संघर्ष करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ख्रीस्त’; यूनानी ख्रिस्तोस एक पदवी है, जिसका अर्थ ‘अभिषिक्त जन’ या ‘मसीह’ है।
    reason: alternative_reading
  - marker: b
    text: ‘भाइयो’ यूनानी में व्याकरण की दृष्टि से पुल्लिंग है, पर यहाँ यह पूरी विश्वासी सभा—अर्थात भाइयों और बहनों—को सम्बोधित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘आत्मा का अपना प्रेम’ अथवा ‘आत्मा से उत्पन्न प्रेम’; यूनानी सम्बन्धकारक को एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Παρακαλῶ
  choice: आग्रह करता हूँ
  rationale: यहाँ क्रिया एक गंभीर और आत्मीय अपील व्यक्त करती है। ‘आग्रह करता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और इसकी प्रबलता को बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि कथन के अगले चरण की ओर संक्रमण दिखाता है। हिन्दी में वाक्य का आरम्भ और प्रसंग स्वयं यह संक्रमण स्वाभाविक रूप से व्यक्त करते हैं; ‘अब’ जोड़ने से अनावश्यक कालगत अर्थ आ सकता था।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: सम्बोधन का यूनानी रूप व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। ‘भाइयो’ स्रोत-रूप को सुरक्षित रखता है; पूरी विश्वासी सभा के सम्भावित समावेशी आशय को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु यीशु मसीह के द्वारा
  rationale: सम्बन्धकारक के साथ διά अपील के आधार या माध्यम को व्यक्त करता है। ‘के द्वारा’ इसे और दोहराए गए διά को स्पष्ट रखता है। Χριστός को उसके पदवीगत अर्थ में ‘मसीह’ किया गया है।
- source_word: ἀγάπης τοῦ πνεύματος
  choice: आत्मा के प्रेम
  rationale: यह निकट-रूपात्मक अनुवाद यूनानी सम्बन्धकारक की अस्पष्टता बनाए रखता है—अर्थ आत्मा का अपना प्रेम अथवा आत्मा से उत्पन्न प्रेम हो सकता है।
- source_word: συναγωνίσασθαί μοι
  choice: मेरे साथ मिलकर संघर्ष करो
  rationale: यह संयुक्त क्रिया साझा और कठिन प्रयास का भाव रखती है। ‘साथ मिलकर संघर्ष करो’ συν- उपसर्ग और संघर्षात्मक बल दोनों को व्यक्त करता है।
- source_word: ἐν ταῖς προσευχαῖς
  choice: प्रार्थना करने में
  rationale: हिन्दी में यह स्वाभाविक रूप से प्रार्थना के क्षेत्र या साधन को व्यक्त करता है। यूनानी में कोई स्पष्ट ‘अपनी’ या ‘तुम्हारी’ नहीं है, इसलिए ऐसा सर्वनाम नहीं जोड़ा गया।
- source_word: ὑπὲρ ἐμοῦ πρὸς τὸν θεόν
  choice: मेरे लिए परमेश्वर से
  rationale: ὑπέρ पौलुस की ओर से मध्यस्थता और πρός प्रार्थना की परमेश्वर की ओर दिशा बताता है। हिन्दी में ‘मेरे लिए परमेश्वर से प्रार्थना’ इसका सहज समतुल्य है।
theological_decisions:
- issue: ‘आत्मा’ का संकेत
  choice: पवित्र आत्मा का संकेत मानकर ‘आत्मा’ लिखा गया
  alternative: मानवीय आत्मा या गैर-वैयक्तिक आत्मिक भाव
  rationale: पौलुस के प्रयोग और इस विन्यास में πνεῦμα का सबसे स्वाभाविक संकेत पवित्र आत्मा है। फिर भी सम्बन्धकारक का अर्थ मुख्य पाठ में खुला रखा गया है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: Χριστός यहाँ यीशु की पदवी है; ‘मसीह’ उसके ‘अभिषिक्त जन’ के अर्थ को हिन्दी बाइबलीय प्रयोग में स्वाभाविक रूप से व्यक्त करता है।
- issue: ἀδελφοί का सम्बोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ में स्रोत के व्याकरणिक पुल्लिंग रूप को रखा गया है। सम्भवतः पूरी कलीसिया को सम्बोधित करने वाला समावेशी आशय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हे भाइयो’ सम्बोधन को स्पष्ट करता है; ‘आग्रह’ अपील की गंभीरता और ‘साथ मिलकर संघर्ष’ प्रार्थना में साझा कठिन प्रयास का भाव बनाए रखते हैं।
