source:
  edition: SBLGNT
  text: ἔχω οὖν ⸀τὴν καύχησιν ἐν Χριστῷ Ἰησοῦ τὰ πρὸς τὸν θεόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/017.yaml
  text: Therefore I have reason for boasting in Messiah Jesus in the things pertaining to God[a][b][c].
translation:
  language: hi
  text: इसलिए परमेश्वर से संबंधित बातों में मुझे मसीह यीशु में गर्व करने का आधार है[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुझे गर्व करने का कारण है’ अथवा ‘मैं गर्व कर सकता हूँ।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘मसीह यीशु में’; यहाँ ‘मसीह’ एक उपाधि है।
    reason: alternative_reading
  - marker: c
    text: या ‘परमेश्वर के विषयों में’ अथवा ‘परमेश्वर से जुड़े मामलों में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔχω
  choice: मुझे … है
  rationale: वर्तमानकालीन प्रथम पुरुष कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पौलुस के सीधे दावे को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट और सहज ढंग से दर्शाता है।
- source_word: καύχησιν
  choice: गर्व करने का आधार
  rationale: संज्ञा का अर्थ ‘गर्व करना’ और ‘गर्व करने का आधार’ दोनों हो सकता है। यह प्रयोग प्रसंग में वैध आधार का भाव व्यक्त करता है, पर पौलुस की प्रबल भाषा को मिटाता नहीं।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν को ‘में’ रखकर मसीह के साथ संबंध अथवा उसमें स्थित होने का भाव सुरक्षित रखा गया है; इसे केवल साधन के अर्थ में ‘के द्वारा’ नहीं किया गया। Χριστός यहाँ उपाधि है, इसलिए ‘मसीह’ उपयुक्त है।
- source_word: τὰ πρὸς τὸν θεόν
  choice: परमेश्वर से संबंधित बातों में
  rationale: यह व्यापक वाक्यांश परमेश्वर से जुड़े विषयों या सेवा-संबंधी मामलों को दर्शाता है। चुना हुआ रूप इसे केवल याजकीय सेवा तक सीमित नहीं करता।
- source_word: θεόν
  choice: परमेश्वर
  rationale: इस संदर्भ में θεός का मानक और गरिमापूर्ण हिन्दी रूप।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में अर्थवान है। हिन्दी में ‘मसीह’ उस उपाधि को प्रचलित और बोधगम्य रूप में व्यक्त करता है।
- issue: पौलुस के καύχησις का स्वरूप
  choice: मसीह यीशु में और परमेश्वर-संबंधी बातों तक सीमित गर्व करने का आधार
  alternative: सामान्य निजी आत्मविश्वास अथवा केवल आनंद
  rationale: मुख्य पाठ में लगी दोनों सीमाएँ—‘मसीह यीशु में’ और ‘परमेश्वर से संबंधित बातों में’—पौलुस के गर्व को आत्मनिर्भर आत्मप्रशंसा के रूप में समझने से रोकती हैं। फिर भी अनुवाद ‘गर्व’ की वास्तविक वैचारिक तनातनी को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गर्व’ साधारण पाठक के लिए ‘घमंड’ से कम एकांगी है, जबकि पादटिप्पणी और वाक्य की सीमाएँ मूल के वैध boasting तथा आत्मप्रशंसा के बीच तनाव को सुरक्षित रखती हैं।
