source:
  edition: SBLGNT
  text: ἀλλὰ καθὼς γέγραπται· ⸂Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ ὄψονται⸃, καὶ οἳ οὐκ ἀκηκόασιν συνήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/021.yaml
  text: 'but as it is written: Those who were not told about him will see[b][a], and those who have not heard will understand.'
translation:
  language: hi
  text: 'परन्तु, जैसा लिखा है:


    “जिन्हें उसके विषय में नहीं बताया गया, वे देखेंगे,[a][b]


    और जिन्होंने नहीं सुना, वे समझेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पौलुस यहाँ यशायाह 52:15 उद्धृत कर रहा है। यशायाह के सन्दर्भ में “उसके” का संकेत सेवक की ओर है; यहाँ पौलुस इस वचन को अपने सुसमाचार-प्रचार के काम पर लागू करता है।
    reason: cross_reference
  - marker: b
    text: 'या अधिक शाब्दिक रूप में: “जिनके सामने उसके विषय में कोई घोषणा नहीं की गई ... और जिन्होंने नहीं सुना, वे समझेंगे।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पौलुस के पिछले कथन के साथ विरोध और उसके सेवाकार्य के आधार की ओर मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण की प्रचलित और स्वाभाविक हिन्दी भूमिका है; यूनानी पूर्णकालीन कर्मवाच्य का मुहावरेदार अर्थ बनाए रखती है।
- source_word: Οἷς οὐκ ἀνηγγέλη περὶ αὐτοῦ
  choice: जिन्हें उसके विषय में नहीं बताया गया
  rationale: दत्तिव सम्बन्ध और कर्मवाच्य घोषणा को सहज हिन्दी में व्यक्त करता है, साथ ही αὐτοῦ के सर्वनाम को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ὄψονται
  choice: वे देखेंगे
  rationale: भविष्यकालीन क्रिया का सीधा अर्थ सुरक्षित रखा गया है; इसे व्याख्यात्मक रूप से ‘पहचानेंगे’ या ‘विश्वास करेंगे’ नहीं बनाया गया।
- source_word: οἳ οὐκ ἀκηκόασιν
  choice: जिन्होंने नहीं सुना
  rationale: यूनानी पूर्णकाल यहाँ उन लोगों की स्थिति बताता है जिन्हें अब तक संदेश सुनने को नहीं मिला; संक्षिप्त हिन्दी रूप सन्दर्भ में यह अर्थ स्वाभाविक ढंग से देता है।
- source_word: συνήσουσιν
  choice: वे समझेंगे
  rationale: भविष्यकालीन प्रतिज्ञा और ‘देखेंगे’ के समानांतर बोधात्मक अर्थ को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: यशायाह के उद्धरण में αὐτοῦ (‘उसके’) का संकेत किसकी ओर है
  choice: मुख्य पाठ में केवल ‘उसके’ रखा गया है।
  alternative: ‘मसीह के विषय में’ या ‘मसीह यीशु के विषय में’
  rationale: यूनानी पाठ सर्वनाम का प्रयोग करता है। उसका स्पष्ट नाम जोड़ना अनुवाद में व्याख्या मिला देता। पादटिप्पणी यशायाह के सेवक-सन्दर्भ और रोमियों में पौलुस द्वारा सुसमाचार-प्रचार पर उसके प्रयोग को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक उद्धरण को दो पंक्तियों में रखा गया है। ‘बताया गया’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी में अधिक शाब्दिक ‘घोषणा’ दी गई है।
