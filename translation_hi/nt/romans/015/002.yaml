  yaml_path: translation/nt/romans/015/002.yaml
  text: Let each of us please his neighbor for his good[b][a], for building him up.
translation:
  language: hi
  text: हम में से हर एक अपने पड़ोसी को उसके हित और उसकी उन्नति के लिए प्रसन्न करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “उन्नति” का शब्द शाब्दिक रूप से “निर्माण” है और रूपक में किसी व्यक्ति को सुदृढ़ करने के अर्थ में प्रयुक्त होता है। इसे “भलाई की ओर” या “निर्माण के लिए” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕκαστος ἡμῶν
  choice: हम में से हर एक
  rationale: वितरणात्मक एकवचन और संबंधकारक बहुवचन का स्वाभाविक हिन्दी रूप; पूरी मण्डली के प्रत्येक व्यक्ति पर आग्रह बनाए रखता है।
- source_word: τῷ πλησίον
  choice: अपने पड़ोसी को
  rationale: यहाँ πλησίον नैतिक अर्थ में अपने निकटवर्ती या साथी मनुष्य को दर्शाता है; ‘अपने पड़ोसी’ आधुनिक हिन्दी में संक्षिप्त और परिचित है।
- source_word: ἀρεσκέτω
  choice: प्रसन्न करे
  rationale: तीसरे पुरुष के वर्तमान आज्ञार्थक का आग्रहपूर्ण स्वर सुरक्षित रहता है; आगे दिए उद्देश्य-वाक्य इसे चापलूसी या असीमित मनुष्य-प्रसन्नता समझे जाने से रोकते हैं।
- source_word: εἰς τὸ ἀγαθὸν
  choice: उसके भले के लिए
  rationale: लक्ष्य अथवा लाभ का भाव स्पष्ट करता है और बताता है कि प्रसन्न करना पड़ोसी के हित की ओर निर्देशित है।
- source_word: πρὸς οἰκοδομήν
  choice: ताकि उसका निर्माण हो
  rationale: οἰκοδομή के ‘निर्माण’ रूपक को बनाए रखते हुए उसके सुदृढ़ किए जाने का उद्देश्य व्यक्त करता है; कर्म स्रोत में स्पष्ट नहीं है, इसलिए हिन्दी में निष्क्रिय रचना अनावश्यक रूप से ‘उसे’ जोड़ने से बचाती है।
theological_decisions:
- issue: पड़ोसी को प्रसन्न करने की नैतिक सीमा
  choice: आज्ञा को पड़ोसी के भले और निर्माण से सीमित रखा गया है।
  alternative: इसे दूसरों को हर दशा में प्रसन्न रखने की व्यापक आज्ञा समझना।
  rationale: दोनों उद्देश्यसूचक पद बताते हैं कि अभिप्राय चापलूसी या स्वीकृति पाने की कोशिश नहीं, बल्कि दूसरे का हित और निर्माण है।
- issue: οἰκοδομή के निर्माण का स्वरूप
  choice: ‘निर्माण’ का रूपक खुला रखा गया है।
  alternative: इसे स्पष्ट रूप से केवल ‘आत्मिक उन्नति’ या ‘विश्वास में दृढ़ता’ कहना।
  rationale: संदर्भ ऐसी उन्नति का संकेत दे सकता है, पर इस पद में विशेषण नहीं है; इसलिए अनुवाद स्रोत से अधिक संकीर्ण धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञार्थक प्रयोग किया गया है। ‘प्रसन्न करे’ स्रोत के शब्द के निकट है, जबकि उद्देश्यसूचक वाक्यांश उसके अर्थ को नैतिक हित तक सीमित करते हैं।
