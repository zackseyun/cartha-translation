source:
  edition: SBLGNT
  text: ἵνα ὁμοθυμαδὸν ἐν ἑνὶ στόματι δοξάζητε τὸν θεὸν καὶ πατέρα τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/006.yaml
  text: so that with one accord and with one mouth you may glorify the God and Father of our Lord Jesus the Messiah[a][b].
translation:
  language: hi
  text: ताकि तुम एक मन होकर और एक ही मुँह से हमारे प्रभु यीशु मसीह के परमेश्वर और पिता की महिमा करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप: “एक स्वर से।” यूनानी में शाब्दिक रूप से “एक ही मुँह से” है, जो एकजुट स्तुति पर बल देता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले उपदेश से निकलने वाले उद्देश्य या परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁμοθυμαδόν
  choice: एक मन होकर
  rationale: यह साझा मनोभाव और उद्देश्य की एकता व्यक्त करता है; साथ का ἐν ἑνὶ στόματι वाणी की एकता को अलग से बनाए रखता है।
- source_word: ἐν ἑνὶ στόματι
  choice: एक ही मुँह से
  rationale: यूनानी के सजीव शारीरिक रूपक को सुरक्षित रखता है; अधिक मुहावरेदार विकल्प 'एक स्वर से' है।
- source_word: δοξάζητε
  choice: महिमा करो
  rationale: उद्देश्यवाचक रचना में क्रिया को स्वाभाविक हिन्दी में रखता है और आराधनात्मक भार बनाए रखता है।
- source_word: τὸν θεὸν καὶ πατέρα
  choice: परमेश्वर और पिता
  rationale: एक ही निर्दिष्ट व्यक्ति के लिए प्रयुक्त निकट संयुक्त पदों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु के
  rationale: κύριος के लिए मानक 'प्रभु' और सम्बन्धसूचक 'हमारे' को सीधे बनाए रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός के पदवीगत अर्थ को हिन्दी के प्रचलित अर्थपूर्ण रूप 'मसीह' से व्यक्त करता है; हिन्दी में इसके साथ अलग निश्चित उपपद आवश्यक नहीं है।
theological_decisions:
- issue: τὸν θεὸν καὶ πατέρα का सम्बन्ध
  choice: हमारे प्रभु यीशु मसीह के परमेश्वर और पिता
  alternative: परमेश्वर की, जो हमारे प्रभु यीशु मसीह के पिता हैं
  rationale: मूल की संक्षिप्त पौलुसी अभिव्यक्ति और 'परमेश्वर और पिता' के संयुक्त सम्बन्ध को बनाए रखा गया है; व्याख्यात्मक पुनर्गठन से बचा गया है।
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: Χριστός को पदवी के अर्थ में अनूदित किया गया है, केवल लिप्यंतरित नहीं; इससे किसी अतिरिक्त सम्प्रदायगत निष्कर्ष को नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामूहिक आराधना के अनुकूल हिन्दी। 'एक मन होकर' और 'एक ही मुँह से' मूल में विचार/उद्देश्य तथा वाणी की दोहरी एकता को अलग-अलग सुरक्षित रखते हैं।
