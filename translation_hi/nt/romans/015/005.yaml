  text: ὁ δὲ θεὸς τῆς ὑπομονῆς καὶ τῆς παρακλήσεως δῴη ὑμῖν τὸ αὐτὸ φρονεῖν ἐν ἀλλήλοις κατὰ ⸂Χριστὸν Ἰησοῦν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/005.yaml
  text: May the God of endurance and encouragement grant you to think the same way toward one another[a], in accordance with Messiah Jesus[b],
translation:
  language: hi
  text: धीरज और प्रोत्साहन का परमेश्वर तुम्हें यह वर दे कि तुम मसीह यीशु के अनुसार आपस में एक ही मन रखो[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक ही मनोवृत्ति रखो” अथवा “एकचित्त रहो।” शाब्दिक रूप से, “एक ही बात सोचो”; यह हर विषय में पूर्ण मत-एकरूपता आवश्यक होने का दावा नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ θεὸς
  choice: परमेश्वर
  rationale: δέ यहाँ हल्का संबंधसूचक संक्रमण है; हिंदी में अलग संयोजक जोड़ना आवश्यक नहीं, जबकि प्रार्थनात्मक भाव ‘दे’ से प्रकट होता है।
- source_word: τῆς ὑπομονῆς
  choice: धीरज ... देनेवाला
  rationale: ὑπομονή दबाव में टिके रहनेवाले धैर्य या सहनशीलता को व्यक्त करता है। संबंधकारक को स्वाभाविक हिंदी में परमेश्वर को इस गुण का दाता बताकर व्यक्त किया गया है।
- source_word: τῆς παρακλήσεως
  choice: प्रोत्साहन देनेवाला
  rationale: παράκλησις में प्रोत्साहन, सांत्वना और आग्रह की अर्थ-छायाएँ हैं; निकटवर्ती संदर्भ में ‘प्रोत्साहन’ व्यापक सहायक भाव को सबसे सहज रूप से रखता है।
- source_word: δῴη
  choice: सामर्थ्य दे
  rationale: विधिलिङ्ग-सदृश optative प्रार्थना या मंगलकामना व्यक्त करता है। केवल ‘दे’ संभव है, पर हिंदी में infinitival विचार के साथ ‘सामर्थ्य दे’ कामना का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ αὐτὸ φρονεῖν
  choice: एक ही मन रखना
  rationale: यह समान मनोवृत्ति या दृष्टिकोण का संकेत है, हर विषय में पूर्ण मत-एकरूपता का नहीं; पारंपरिक किंतु सुबोध हिंदी इस अस्पष्टता को बनाए रखती है।
- source_word: ἐν ἀλλήλοις
  choice: आपस में
  rationale: यह पारस्परिक सामुदायिक क्षेत्र को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: κατὰ Χριστὸν Ἰησοῦν
  choice: मसीह यीशु के अनुसार
  rationale: κατά अनुरूपता या मानक बताता है। Χριστός को अर्थपूर्ण पदवी के रूप में ‘मसीह’ रखा गया है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु / क्राइस्ट यीशु
  rationale: Χριστός यहाँ अभिषिक्त जन की अर्थपूर्ण पदवी है; ‘मसीह’ आधुनिक हिंदी बाइबलीय प्रयोग में अर्थ और परिचय दोनों सुरक्षित रखता है।
- issue: τὸ αὐτὸ φρονεῖν का आशय
  choice: आपस में एक ही मन रखना
  alternative: हर बात में एक ही मत रखना
  rationale: मूल पाठ साझी मनोवृत्ति की माँग करता है, किंतु हर गौण विषय पर पूर्ण वैचारिक एकरूपता स्पष्टतः नहीं कहता; इसलिए अधिक कठोर व्याख्या नहीं जोड़ी गई।
- issue: परमेश्वर और धीरज/प्रोत्साहन के बीच संबंधकारक
  choice: धीरज और प्रोत्साहन देनेवाला परमेश्वर
  alternative: धीरज और प्रोत्साहन का परमेश्वर
  rationale: यूनानी संबंधकारक स्रोत, विशेषता या अधिकार का संकेत दे सकता है। हिंदी में ‘देनेवाला’ संदर्भानुकूल है, पर संबंध की पूरी सीमा को संकीर्ण करने की संभावना के कारण वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘आपस में’ पारस्परिकता को सहज बनाता है; ‘एक ही मन’ मूल की वैचारिक और संबंधपरक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता। पद के अंत का अल्पविराम अगले पद से वाक्यगत निरंतरता दर्शाता है।
