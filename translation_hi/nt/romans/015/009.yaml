id: ROM.15.9
reference: Romans 15:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰ δὲ ἔθνη ὑπὲρ ἐλέους δοξάσαι τὸν θεόν· καθὼς γέγραπται· Διὰ τοῦτο ἐξομολογήσομαί σοι ἐν ἔθνεσι, καὶ τῷ ὀνόματί σου ψαλῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/015/009.yaml
  text: and the Gentiles might glorify God for his mercy[a], as it is written, “Therefore I will praise you among the Gentiles, and sing praise to your name.”
translation:
  language: hi
  text: 'और गैर-यहूदी परमेश्वर की दया के कारण उसकी महिमा करें[a], जैसा लिखा है:

    “इसलिए मैं गैर-यहूदियों के बीच तेरी स्तुति करूँगा,

    और तेरे नाम का स्तुतिगान करूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर “राष्ट्र” या “राष्ट्रों के बीच” भी हो सकता है। पौलुस यहाँ इस उद्धरण को विशेष रूप से गैर-यहूदियों पर लागू करता है, पर मूल उद्धरण में “राष्ट्रों” का व्यापक अर्थ भी मौजूद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔθνη / ἔθνεσι
  choice: गैर-यहूदी / गैर-यहूदियों के बीच
  rationale: रोमियों में यह शब्द प्रायः यहूदियों से भिन्न लोगों को दर्शाता है। यहाँ पौलुस का तर्क विशेष रूप से उनके परमेश्वर की महिमा करने पर केंद्रित है; फिर भी मूल उद्धरण में ‘राष्ट्र’ का व्यापक अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ὑπὲρ ἐλέους
  choice: दया के कारण
  rationale: ὑπέρ के साथ संबंधकारक यहाँ आधार या कारण व्यक्त करता है। प्रसंग से स्पष्ट है कि यह परमेश्वर की दया है।
- source_word: δοξάσαι
  choice: महिमा करें
  rationale: यह अनिश्चित क्रिया पिछले पद की वाक्य-रचना पर निर्भर है और उद्देश्य अथवा परिणाम का भाव रखती है। हिंदी में ‘करें’ इस अधीनस्थ भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र उद्धृत करने का मानक सूत्र है और हिंदी में स्पष्ट तथा स्वाभाविक है।
- source_word: ἐξομολογήσομαί
  choice: स्तुति करूँगा
  rationale: इस आराधनात्मक संदर्भ में क्रिया सार्वजनिक धन्यवाद अथवा प्रशंसा का अर्थ देती है, पाप-स्वीकार का नहीं।
- source_word: ψαλῶ
  choice: स्तुतिगान करूँगा
  rationale: क्रिया का अर्थ यहाँ परमेश्वर की प्रशंसा में गाना है। ‘स्तुतिगान’ आराधना और गायन दोनों भावों को संक्षेप में रखता है।
- source_word: τῷ ὀνόματί σου
  choice: तेरे नाम का
  rationale: यह स्वाभाविक हिंदी में उस बाइबलीय भाव को बनाए रखता है जिसमें परमेश्वर के नाम की स्तुति की जाती है।
theological_decisions:
- issue: आरंभिक अनिश्चित क्रिया का पिछले पद से संबंध
  choice: वाक्य को पिछले पद से जारी उद्देश्य/परिणाम के रूप में ‘और गैर-यहूदी ... महिमा करें’ अनूदित किया गया है।
  alternative: 'अधिक शब्दशः परंतु खंडित रूप: ‘और गैर-यहूदियों का दया के कारण परमेश्वर की महिमा करना।’'
  rationale: यूनानी वाक्यांश रोमियों 15:8 की वाक्य-रचना पर निर्भर है। हिंदी में संभावनार्थक ‘करें’ संबंध को सुबोध बनाता है, बिना उद्देश्य और परिणाम के बीच की सूक्ष्म अस्पष्टता को अनावश्यक रूप से तय किए।
- issue: ἔθνη का जातीय और व्यापक अर्थ
  choice: मुख्य पाठ में ‘गैर-यहूदी’, क्योंकि पौलुस यहाँ यहूदियों के विपरीत गैर-यहूदी लोगों पर तर्क लागू करता है।
  alternative: ‘राष्ट्र’ या ‘जातियाँ’, जो उद्धृत भजन के व्यापक अर्थ को अधिक सीधे व्यक्त करता है।
  rationale: मुख्य पाठ पौलुस के निकट संदर्भ को प्राथमिकता देता है, जबकि पादटिप्पणी उद्धरण में मौजूद व्यापक अर्थ को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज और गरिमापूर्ण स्तर रखा गया है। ‘गैर-यहूदी’ सामान्य पाठक के लिए स्पष्ट है; उद्धरण में एकवचन संबोधन के लिए पारंपरिक किंतु सुबोध ‘तेरी/तेरे’ का प्रयोग किया गया है।
