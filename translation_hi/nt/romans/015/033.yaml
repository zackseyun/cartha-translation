  text: May the God of peace be with all of you. Amen.
translation:
  language: hi
  text: शान्ति का परमेश्वर आप सबके साथ रहे। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: अलग शब्द के रूप में नहीं दिया
  rationale: यहाँ δέ हल्का संयोजक अथवा संक्रमणसूचक है, प्रबल विरोधसूचक नहीं। स्वाभाविक हिन्दी समापन-आशीर्वचन में इसे अलग से ‘अब’, ‘और’ या ‘परन्तु’ कहना अनावश्यक और कुछ भ्रामक होगा।
- source_word: θεὸς τῆς εἰρήνης
  choice: शान्ति का परमेश्वर
  rationale: यह सम्बन्धकारक पद का सीधा और स्वाभाविक हिन्दी रूप है तथा पौलुस की पहचानी जाने वाली उपाधि को सुरक्षित रखता है।
- source_word: εἰρήνης
  choice: शान्ति
  rationale: यह εἰρήνη का मानक हिन्दी रूप है; प्रसंग में मेल-मिलाप, कुशल और संपूर्ण भलाई की छाया रहते हुए भी ‘शान्ति’ पर्याप्त और स्वाभाविक है।
- source_word: μετὰ πάντων ὑμῶν
  choice: आप सबके साथ रहे
  rationale: यूनानी में क्रिया व्यक्त नहीं है, पर पत्र के समापन-आशीर्वचन का भाव हिन्दी में ‘रहे’ से स्वाभाविक रूप से प्रकट होता है। ‘आप सबके’ πάντων ὑμῶν की समावेशी व्यापकता बनाए रखता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: आराधनात्मक समापन के रूप में प्रचलित लिप्यंतरण रखा गया है, जिससे इसकी गंभीर अनुमोदनात्मक शक्ति बनी रहती है।
theological_decisions:
- issue: क्रियारहित वाक्यांश को कथन माना जाए या आशीर्वचनात्मक कामना
  choice: 'आशीर्वचनात्मक कामना: ‘शान्ति का परमेश्वर आप सबके साथ रहे।’'
  alternative: ‘शान्ति का परमेश्वर आप सबके साथ है।’
  rationale: यद्यपि यूनानी में स्पष्ट क्रिया नहीं है, पत्र के समापन के इस सूत्र का स्वाभाविक कार्य प्रार्थनामय आशीर्वचन है। हिन्दी में ‘रहे’ जोड़ना उसी कार्य को स्पष्ट करता है, बिना अनावश्यक व्याख्या के।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘आप सबके’ सामूहिक बहुवचन को स्पष्ट करता है। ‘शान्ति’ और ‘आमीन’ के मानक बाइबलीय रूप प्रयुक्त हैं; किसी पंथ-विशेष की शब्दावली नहीं जोड़ी गई।
