lexical_decisions:
- source_word: Διὸ
  choice: इसी कारण
  rationale: यह पिछले कथन से निष्कर्षात्मक संबंध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: καὶ
  choice: वाक्य के निष्कर्षात्मक प्रवाह में अंतर्निहित
  rationale: यूनानी में इसका योगात्मक बल है; हिन्दी में ‘इसी कारण’ के साथ अलग से ‘भी’ रखने पर वाक्य अस्वाभाविक हो सकता है, इसलिए संबंध को समूचे वाक्य-प्रवाह में व्यक्त किया गया है।
- source_word: ἐνεκοπτόμην
  choice: रोका गया
  rationale: अपूर्ण भूतकाल का रूप बीते समय में बार-बार या लगातार आए अवरोध को व्यक्त करता है; कर्मवाच्य अनिर्दिष्ट रोकने वाले को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὰ πολλὰ
  choice: बार-बार
  rationale: यह क्रियाविशेषणीय मुहावरा अनेक अवसरों पर पुनरावृत्ति का भाव देता है; ‘बार-बार’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τοῦ ἐλθεῖν
  choice: आने से
  rationale: रोकने की क्रिया के बाद संबंधवाचक सभाव infinitive उस कार्य को बताता है जो बाधित हुआ; हिन्दी में ‘आने से रोका गया’ सीधा समतुल्य है।
- source_word: πρὸς ὑμᾶς
  choice: आपके पास
  rationale: यह रोमी विश्वासियों की ओर गति को दर्शाता है; ‘आपके पास आना’ हिन्दी का स्वाभाविक प्रयोग है।
