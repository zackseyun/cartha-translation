lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले पद के प्रश्नों की शृंखला में एक और आलंकारिक प्रश्न जोड़ता है; ‘या’ संक्षिप्त और स्वाभाविक है।
- source_word: τίς
  choice: किसने
  rationale: व्यक्ति के विषय में पूछने वाले यूनानी सर्वनाम को हिन्दी के स्वाभाविक प्रश्नवाचक रूप में रखा गया है।
- source_word: προέδωκεν
  choice: पहले कुछ दिया है
  rationale: क्रिया में पहले या अग्रिम रूप से देने का भाव है। ‘पहले’ इस प्राथमिकता को सुरक्षित रखता है, जबकि ‘कुछ’ हिन्दी में सकर्मक प्रयोग को स्वाभाविक बनाता है और कोई विशिष्ट वस्तु नहीं जोड़ता।
- source_word: αὐτῷ
  choice: उसे
  rationale: सर्वनाम संदर्भ में परमेश्वर की ओर संकेत करता है; यूनानी की तरह संज्ञा ‘परमेश्वर’ को स्पष्ट रूप से जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: καὶ
  choice: और
  rationale: दोनों उपवाक्यों के बीच यूनानी के सामान्य समुच्चयबोधक संबंध और आलंकारिक संरचना को बनाए रखता है।
- source_word: ἀνταποδοθήσεται
  choice: बदले में चुका दिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य क्रिया प्रतिदान या बदले में लौटाने का अर्थ देती है। यह रूप परमेश्वर को स्पष्ट कर्ता बनाए बिना दायित्व चुकाने का भाव व्यक्त करता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: दूसरा सर्वनाम उस व्यक्ति की ओर संकेत करता है जिसने कथित रूप से पहले दिया हो; इसकी पुनरावृत्ति यूनानी के समानांतर ढाँचे को बनाए रखती है।
theological_decisions:
- issue: पहले αὐτῷ का संदर्भ
  choice: ‘उसे’ रखा गया है, जिसका संदर्भ आसपास के प्रसंग में परमेश्वर है।
  alternative: स्पष्टता के लिए ‘परमेश्वर को’ कहना।
  rationale: मूल पाठ में संज्ञा नहीं, सर्वनाम है। सर्वनाम रखने से मूल रूप सुरक्षित रहता है और संदर्भ से उसका संकेत स्पष्ट है।
- issue: προέδωκεν में प्राथमिकता और परमेश्वर पर ऋण का दावा
  choice: ‘पहले’ के द्वारा यह भाव रखा गया है कि कोई परमेश्वर से पहले देकर उसे अपना ऋणी नहीं बना सकता।
  alternative: केवल ‘दिया है’ कहना, अथवा ‘पहले से दिया है’ कहना।
  rationale: ‘पहले’ संयुक्त क्रिया के महत्वपूर्ण कालगत और तार्किक भाव को सुरक्षित रखता है, पर व्याख्या को मुख्य पाठ में अनावश्यक रूप से विस्तृत नहीं करता।
- issue: καὶ और दूसरे उपवाक्य का संबंध
  choice: ‘और’ से मूल का समन्वयी संबंध रखा गया है।
  alternative: परिणाम स्पष्ट करने के लिए ‘कि’ या ‘ताकि’ कहना।
  rationale: यहाँ परिणाम या उद्देश्य का अर्थ निहित हो सकता है, पर यूनानी केवल καὶ कहता है; ‘और’ वास्तविक संरचनात्मक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आलंकारिक प्रश्न, सर्वनाम और समन्वयी ‘और’ मूल यूनानी के तनाव और रूप को बनाए रखते हैं। ‘चुका दिया जाएगा’ ऋण या प्रतिदान का स्वाभाविक हिन्दी भाव देता है।
