translation:
  language: hi
  text: या किसने उसे पहले दिया है[a], और उसे प्रतिदान दिया जाएगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसने उसे पहले से दिया है?”
    reason: lexical_alternative
  - marker: b
    text: अर्थात, किसी ने परमेश्वर को इस प्रकार कुछ नहीं दिया कि परमेश्वर उसे लौटाने के लिए बाध्य हो जाए।
