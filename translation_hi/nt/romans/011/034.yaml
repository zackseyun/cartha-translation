  yaml_path: translation/nt/romans/011/034.yaml
  text: For who has known the mind of the Lord? Or who has become his counselor?[a]
translation:
  language: hi
  text: क्योंकि प्रभु का मन किसने जाना है? या कौन उसका सलाहकार बना है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पौलुस यहाँ यशायाह 40:13 की प्रतिध्वनि करता है, जहाँ यूनानी पाठ भी इसी प्रकार पूछता है कि प्रभु का मन किसने जाना या कौन उसका सलाहकार बना।
    reason: cross_reference
lexical_decisions:
- source_word: Τίς
  choice: किसने / कौन
  rationale: दोनों समानांतर अलंकारिक प्रश्नों में हिन्दी कारक के अनुसार क्रमशः ‘किसने’ और ‘कौन’ स्वाभाविक हैं।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताने वाला संयोजक है; ‘क्योंकि’ पौलुस के तर्क-संबंध को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔγνω
  choice: जाना है
  rationale: यहाँ ‘जानना’ यूनानी क्रिया के निकट है और सार्वकालिक अलंकारिक प्रश्न में पूर्णता का भाव व्यक्त करता है।
- source_word: νοῦν
  choice: मन
  rationale: यह शब्द यहाँ परमेश्वर की बुद्धि, विचार और अभिप्राय की ओर संकेत करता है; ‘मन’ सीधा, संक्षिप्त और यशायाह-संबंधी प्रतिध्वनि के अनुकूल है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का मानक, गरिमापूर्ण हिन्दी रूप; पाठ में निहित संदर्भ को इससे अधिक संकीर्ण नहीं किया गया है।
- source_word: ἢ
  choice: या
  rationale: यह समानांतर दूसरे अलंकारिक प्रश्न को पहले से जोड़ते हुए यूनानी विकल्पसूचक संरचना सुरक्षित रखता है।
- source_word: σύμβουλος
  choice: सलाहकार
  rationale: आधुनिक हिन्दी में स्पष्ट और स्वाभाविक शब्द, जो सलाह देने वाले व्यक्ति का अर्थ ठीक व्यक्त करता है।
- source_word: αὐτοῦ
  choice: उसका
  rationale: यह κυρίου की ओर लौटता है; ‘उसका सलाहकार’ हिन्दी में स्वाभाविक संबंधसूचक रचना है।
- source_word: ἐγένετο
  choice: बना है
  rationale: γίνομαι के ‘बनना’ अर्थ को सीधे व्यक्त करता है और प्रश्न में इस भूमिका को कभी प्राप्त करने की धारणा बनाए रखता है।
theological_decisions:
- issue: यशायाह से लिए गए कथन में ‘प्रभु’ का संदर्भ
  choice: ‘प्रभु’ रखा गया है और मुख्य पाठ में संदर्भ को इससे अधिक सीमित नहीं किया गया।
  alternative: यशायाह की पृष्ठभूमि के आधार पर सीधे परमेश्वर के विशेष वाचा-नाम का हिन्दी रूप देना।
  rationale: यूनानी पाठ में κυρίου है। पौलुस के संदर्भ में यह परमेश्वर की अगम बुद्धि को दर्शाता है, पर अनुवाद नए नियम की शब्दावली को बनाए रखता है और पृष्ठभूमि से विशेष नाम मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। समानांतर अलंकारिक प्रश्नों और शास्त्रीय उद्धरण की लय को सुरक्षित रखा गया है।
