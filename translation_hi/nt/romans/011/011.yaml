id: ROM.11.11
reference: Romans 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἔπταισαν ἵνα πέσωσιν; μὴ γένοιτο· ἀλλὰ τῷ αὐτῶν παραπτώματι ἡ σωτηρία τοῖς ἔθνεσιν, εἰς τὸ παραζηλῶσαι αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/011.yaml
  text: So I say[a], they did not stumble so as to fall, did they? May it never be! Rather, by their trespass salvation has come to the Gentiles[d][c][b], to make them jealous.
translation:
  language: hi
  text: 'इसलिए मैं पूछता हूँ: क्या उन्होंने इसलिए ठोकर खाई कि वे गिर जाएँ?[a] कदापि नहीं! बल्कि उनके अपराध के कारण उद्धार गैर-यहूदियों[b][c] तक पहुँचा, ताकि उनमें ईर्ष्या जगे।[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘ठोकर खाना’ और ‘गिरना’ दो अलग शब्द हैं। प्रश्न का अपेक्षित उत्तर ‘नहीं’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके अपराध के द्वारा।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘जातियों’; यहाँ आशय गैर-यहूदी लोगों से है।
    reason: lexical_alternative
  - marker: d
    text: या, ‘ताकि उनमें ईर्ष्या जगाई जाए’; इसमें वही उद्धार पाने की चाह जगाने का भाव भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Λέγω οὖν
  choice: इसलिए मैं पूछता हूँ
  rationale: यह पद पौलुस के तर्क से निकलने वाला आलंकारिक प्रश्न प्रस्तुत करता है। ‘पूछता हूँ’ हिन्दी में इस संवादात्मक भूमिका को स्वाभाविक रूप से स्पष्ट करता है, और ‘इसलिए’ οὖν का निष्कर्षसूचक बल रखता है।
- source_word: μὴ ἔπταισαν ἵνα πέσωσιν
  choice: क्या उन्होंने इसलिए ठोकर खाई कि वे गिर जाएँ?
  rationale: μή वाला प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। ‘ठोकर खाना’ और ‘गिर जाना’ अलग रखे गए हैं, जिससे πταίω और πίπτω का अर्थभेद बना रहे; ‘सदा के लिए’ या ‘पूरी तरह’ जैसा अर्थ नहीं जोड़ा गया।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: यह पौलुस के प्रबल निषेध को संक्षिप्त, प्रतिष्ठित और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ αὐτῶν παραπτώματι
  choice: उनके अपराध के कारण
  rationale: παράπτωμα यहाँ नैतिक चूक अथवा उल्लंघन को दर्शाता है। ‘अपराध’ सामान्य पाठक के लिए स्पष्ट है; दत्तिव को कारण/माध्यम के रूप में व्यक्त किया गया है।
- source_word: ἡ σωτηρία
  choice: उद्धार
  rationale: रोमियों में σωτηρία का धार्मिक और मुक्तिपरक अर्थ है; ‘उद्धार’ उसका प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: τοῖς ἔθνεσιν
  choice: गैर-यहूदियों तक
  rationale: रोमियों 9–11 के यहूदी–अन्यजाति संदर्भ में ἔθνη का आशय गैर-यहूदी लोगों से है। ‘तक पहुँचा’ हिन्दी में निहित गति/लाभार्थक संबंध को सहज बनाता है।
- source_word: εἰς τὸ παραζηλῶσαι αὐτούς
  choice: ताकि उन्हें जलन हो
  rationale: εἰς τό के साथ अनंत क्रिया उद्देश्य अथवा परिणाम व्यक्त करती है। ‘जलन हो’ παραζηλόω का सामान्य हिन्दी अर्थ रखता है, जबकि उसी उद्धार की चाह जगने की सम्भावित सकारात्मक छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या इस्राएल की ठोकर को अंतिम अथवा अपरिवर्तनीय पतन कहा गया है
  choice: मुख्य पाठ ठोकर खाने और गिर जाने में भेद रखते हुए ऐसे पतन को प्रश्न के रूप में नकारता है।
  alternative: इसे ‘पूरी तरह गिरना’ या ‘सदा के लिए नष्ट होना’ समझना।
  rationale: यूनानी पाठ दो अलग क्रियाओं का प्रयोग करता है, पर पतन की अवधि या अपरिवर्तनीयता को स्पष्ट नहीं करता। इसलिए अनुवाद व्याख्यात्मक विशेषण नहीं जोड़ता और तनाव को बनाए रखता है।
- issue: जलन उत्पन्न करने का उद्धार-ऐतिहासिक आशय
  choice: गैर-यहूदियों को मिले उद्धार से उनमें जलन उत्पन्न होना।
  alternative: उन्हें उसी उद्धार की खोज करने के लिए प्रेरित करना अथवा केवल नकारात्मक ईर्ष्या उत्पन्न करना।
  rationale: παραζηλόω में ईर्ष्या और अनुकरण की इच्छा—दोनों की छाया सम्भव है। मुख्य पाठ सामान्य अभिव्यक्ति रखता है और व्यापक सम्भावना पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर बाइबलीय गरिमा बनाए रखती है। ‘कदापि नहीं’ पौलुस के तीखे निषेध के अनुरूप है। ‘गैर-यहूदी’ आज के सामान्य पाठक के लिए ‘अन्यजाति’ से अधिक तुरंत स्पष्ट है। सभी व्याख्यात्मक विकल्प पादटिप्पणियों में रखे गए हैं, मुख्य पाठ में नहीं।
