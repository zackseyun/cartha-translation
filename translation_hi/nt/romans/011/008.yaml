id: ROM.11.8
reference: Romans 11:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καθὼς γέγραπται· Ἔδωκεν αὐτοῖς ὁ θεὸς πνεῦμα κατανύξεως, ὀφθαλμοὺς τοῦ μὴ βλέπειν καὶ ὦτα τοῦ μὴ ἀκούειν, ἕως τῆς σήμερον ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/008.yaml
  text: 'just as it is written: “God gave them a spirit of stupor[a], eyes not to see and ears not to hear, until this very day.”'
translation:
  language: hi
  text: 'जैसा लिखा है: “परमेश्वर ने उन्हें सुन्नता की आत्मा[a] दी, ऐसी आँखें कि वे न देखें और ऐसे कान कि वे न सुनें—आज तक।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गहरी नींद की आत्मा।” यह वाक्यांश यशायाह 29:10 की प्रतिध्वनि है, यद्यपि यहाँ प्रयुक्त यूनानी शब्द सुन्नता, मंदता या स्तब्धता की दशा व्यक्त करता है।
    reason: वैकल्पिक अनुवाद और पुराने नियम की साहित्यिक पृष्ठभूमि को स्पष्ट करना।
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र का उद्धरण प्रस्तुत करने वाला प्रचलित सूत्र है और καθώς तथा γέγραπται दोनों का स्वाभाविक हिन्दी रूप है।
- source_word: Ἔδωκεν αὐτοῖς ὁ θεὸς
  choice: परमेश्वर ने उन्हें … दी
  rationale: यूनानी वाक्य में परमेश्वर स्पष्ट कर्ता हैं और ἔδωκεν सामान्य भूतकालीन क्रिया है; इसलिए कथन को अनुमति के अर्थ में नरम नहीं किया गया।
- source_word: πνεῦμα κατανύξεως
  choice: जड़ता की आत्मा
  rationale: κατάνυξις यहाँ मानसिक और आत्मिक सुन्नता, मंदता या चेतनाहीनता की दशा व्यक्त करता है। ‘जड़ता’ आधुनिक हिन्दी में इस भाव को गरिमापूर्ण और संक्षिप्त ढंग से रखता है; ‘आत्मा’ πνεῦμα की अभिव्यक्ति और मूल की अस्पष्टता को बनाए रखता है। यशायाह 29:10 की पृष्ठभूमि वाला ‘गहरी नींद की आत्मा’ पादटिप्पणी में दिया गया है।
- source_word: ὀφθαλμοὺς τοῦ μὴ βλέπειν
  choice: ऐसी आँखें कि वे न देखें
  rationale: यह τοῦ μή के साथ धातुरूप में निहित प्रयोजन या परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसे केवल ‘न देखने वाली आँखें’ जैसी स्थायी विशेषता बना देने के।
- source_word: ὦτα τοῦ μὴ ἀκούειν
  choice: ऐसे कान कि वे न सुनें
  rationale: पिछले पदबंध के समानांतर रचना रखी गई है और ἀκούειν के मूल श्रवण-संबंधी अर्थ को ‘सुनें’ से व्यक्त किया गया है।
- source_word: ἕως τῆς σήμερον ἡμέρας
  choice: आज के दिन तक
  rationale: यह यूनानी मुहावरे की कालगत सीमा और उसके गंभीर, उद्धरणात्मक स्वर को बनाए रखता है।
theological_decisions:
- issue: कठोरता अथवा न्यायिक आत्मिक असंवेदनशीलता में परमेश्वर की सक्रिय भूमिका
  choice: “परमेश्वर ने उन्हें … दी” के सीधे कथन को बनाए रखा गया।
  alternative: “परमेश्वर ने उन्हें जड़ता की आत्मा रखने दी” अथवा “परमेश्वर ने उन्हें जड़ता के वश में छोड़ दिया।”
  rationale: यूनानी पाठ में ὁ θεός स्पष्ट कर्ता और ἔδωκεν ‘दिया’ क्रिया है। इसे केवल अनुमति या निष्क्रिय रूप में बदलना पाठ में निहित ईश्वरीय न्याय और मानवीय उत्तरदायित्व के तनाव को अनावश्यक रूप से हल्का कर देता।
- issue: πνεῦμα का अर्थ
  choice: “आत्मा” रखा गया, जिससे किसी आत्मिक सत्ता, प्रवृत्ति या दशा के बीच मूल अभिव्यक्ति की गुंजाइश बनी रहे।
  alternative: “मनःस्थिति” या “भाव”
  rationale: अधिक व्याख्यात्मक शब्द πνεῦμα को केवल मनोवैज्ञानिक दशा तक सीमित कर देते; मूल पाठ इतनी स्पष्ट सीमा नहीं लगाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए बोधगम्य रखी गई है। उद्धरण की समानांतर संरचना और संक्षिप्त लय सुरक्षित है; ‘ऐसी आँखें कि… ऐसे कान कि…’ मूल के प्रयोजन/परिणाम संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
