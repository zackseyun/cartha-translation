base_translation:
  language: en
  yaml_path: translation/nt/romans/011/010.yaml
  text: Let their eyes be darkened so that they may not see[b][a], and bend their back continually.
translation:
  language: hi
  text: उनकी आँखें ऐसी अँधेरी हो जाएँ कि वे देख न सकें,[a] और उनकी पीठ सदा झुकाए रख।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी आँखें अंधी हो जाएँ, ताकि वे देख न सकें।’ यूनानी में शाब्दिक रूप से ‘अँधेरी हो जाएँ’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी पीठ लगातार झुकी रहे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: σκοτισθήτωσαν
  choice: अँधेरी हो जाएँ
  rationale: तीसरे पुरुष के निष्क्रिय आज्ञार्थक/कामनार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और यूनानी के अन्धकार-बिम्ब को बनाए रखता है; केवल ‘अन्धी हो जाएँ’ कहना अधिक व्याख्यात्मक होता।
- source_word: οἱ ὀφθαλμοὶ αὐτῶν
  choice: उनकी आँखें
  rationale: मूल के शारीरिक और रूपकात्मक बिम्ब को सीधे और स्वाभाविक ढंग से रखता है।
- source_word: τοῦ μὴ βλέπειν
  choice: ऐसी ... कि वे देख न सकें
  rationale: सप्रयोजन infinitive के प्रयोजन/परिणाम दोनों की सम्भावना को बिना अनावश्यक रूप से निश्चित किए सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν νῶτον αὐτῶν
  choice: उनकी कमर
  rationale: νῶτος शरीर के पीछे के भाग या पीठ को सूचित करता है; इस प्रसंग में झुके रहने के चित्र के लिए ‘कमर’ स्वाभाविक हिन्दी है, यद्यपि ‘पीठ’ अधिक शाब्दिक विकल्प है।
- source_word: διὰ παντός
  choice: सदा
  rationale: निरन्तर या लगातार अवधि को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है, बिना अनिवार्यतः ‘सर्वदा के लिए’ का अन्तिम अर्थ जोड़े।
- source_word: σύγκαμψον
  choice: झुकाए रख
  rationale: दूसरे पुरुष के सक्रिय आज्ञार्थक और जारी रहने वाले झुकाव के शारीरिक बिम्ब को हिन्दी में स्पष्ट रखता है।
theological_decisions:
- issue: शापोक्ति और परमेश्वर की सक्रिय भूमिका
  choice: 'आज्ञार्थक/प्रार्थनात्मक शापोक्ति को बनाए रखा गया: ‘हो जाएँ ... झुकाए रख।’'
  alternative: इसे भविष्यवाणी (‘हो जाएँगी’) या केवल निष्क्रिय परिणाम के रूप में अनूदित करना।
  rationale: उद्धरण न्याय की कठोर प्रार्थनात्मक भाषा रखता है; अनुवाद को न तो इसे केवल भविष्यवाणी बनाना चाहिए, न परमेश्वर को सम्बोधन की शक्ति को मन्द करना चाहिए।
- issue: τοῦ μὴ βλέπειν में प्रयोजन और परिणाम
  choice: ‘ऐसी ... कि वे देख न सकें’
  alternative: ‘ताकि वे न देखें’ या ‘जिससे वे देख नहीं पाते।’
  rationale: यह रचना प्रयोजन अथवा परिणाम दोनों का संकेत दे सकती है; चुनी हुई हिन्दी उस तनाव को पर्याप्त रूप से खुला रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और साधारण पाठक के लिए बोधगम्य रखी गई है। ‘अँधेरी’ मूल के अन्धकार-बिम्ब को बचाता है; ‘झुकाए रख’ आज्ञार्थक सम्बोधन और निरन्तर अवस्था दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
