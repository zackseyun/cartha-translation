  text: ὥσπερ ⸀γὰρ ὑμεῖς ποτε ἠπειθήσατε τῷ θεῷ, νῦν δὲ ἠλεήθητε τῇ τούτων ἀπειθείᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/030.yaml
  text: For just as you once were disobedient to God[a], but now have received mercy because of their disobedience,
translation:
  language: hi
  text: क्योंकि जैसे तुम पहले परमेश्वर की आज्ञा नहीं मानते थे[a], पर अब उनकी अवज्ञा के कारण तुम पर दया की गई है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आज्ञा नहीं मानते थे’ और ‘अवज्ञा’—दोनों के लिए ‘विश्वास नहीं करते थे’ और ‘अविश्वास’ भी संभव है; इस संदर्भ में यूनानी शब्द दोनों अर्थ दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और ὥσπερ की तुलना—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑμεῖς
  choice: तुम
  rationale: यह बहुवचन संबोधन है; हिन्दी में संदर्भानुसार ‘तुम’ स्वाभाविक है और पद में ‘गैर-यहूदी’ जोड़ने से बचता है।
- source_word: ποτε
  choice: पहले
  rationale: νῦν ‘अब’ के साथ अतीत और वर्तमान का स्पष्ट, स्वाभाविक विरोध व्यक्त करता है।
- source_word: ἠπειθήσατε τῷ θεῷ
  choice: परमेश्वर की आज्ञा नहीं मानते थे
  rationale: ἀπειθέω के अवज्ञा और अविश्वास से जुड़े अर्थ-क्षेत्र में यहाँ परमेश्वर के प्रति संबंधपरक अवज्ञा को सहज हिन्दी में व्यक्त करता है।
- source_word: νῦν δὲ
  choice: पर अब
  rationale: पहली दशा और वर्तमान में मिली दया के बीच प्रबल विरोध बनाए रखता है।
- source_word: ἠλεήθητε
  choice: तुम पर दया की गई है
  rationale: यूनानी कर्मवाच्य को सुरक्षित रखते हुए स्पष्ट करता है कि संबोधित लोग दया पाने वाले हैं, दया के कर्ता नहीं।
- source_word: τῇ τούτων ἀπειθείᾳ
  choice: उनकी अवज्ञा के कारण
  rationale: सम्बन्धवाचक τούτων को संदर्भानुकूल ‘उनकी’ और दत्तिव को कारण/माध्यम के रूप में प्रस्तुत करता है, बिना प्रक्रिया को अनावश्यक रूप से निश्चित किए।
theological_decisions:
- issue: ἀπειθέω / ἀπείθεια का अवज्ञा और अविश्वास के बीच अर्थ-संबंध
  choice: आज्ञा नहीं मानते थे / अवज्ञा
  alternative: विश्वास नहीं करते थे / अविश्वास
  rationale: मूल शब्द अवज्ञा और अविश्वास दोनों अर्थ धारण कर सकते हैं। मुख्य पाठ में नैतिक-संबंधपरक ‘अवज्ञा’ को प्राथमिकता दी गई है, जबकि पादटिप्पणी वैध वैकल्पिक अर्थ को सुरक्षित रखती है।
- issue: τῇ τούτων ἀπειθείᾳ में कारण अथवा माध्यम
  choice: उनकी अवज्ञा के कारण
  alternative: उनकी अवज्ञा के द्वारा
  rationale: दत्तिव दोनों छायाएँ दे सकता है; ‘के कारण’ सामान्य पाठक के लिए स्पष्ट है और इस एक पद में उद्धार की पूरी प्रक्रिया को कठोर यांत्रिक अर्थ नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘आज्ञा नहीं मानते थे’ साधारण पाठक के लिए क्रियात्मक अर्थ स्पष्ट करता है, जबकि संज्ञा ‘अवज्ञा’ मूल के शब्द-संबंध को यथासंभव बनाए रखती है। पद के अंत की अल्पविराम-संरचना अगले पद से जुड़े अधूरे तुलनात्मक वाक्य को दर्शाती है।
