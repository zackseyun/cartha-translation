source:
  edition: SBLGNT
  text: εἰ δὲ τὸ παράπτωμα αὐτῶν πλοῦτος κόσμου καὶ τὸ ἥττημα αὐτῶν πλοῦτος ἐθνῶν, πόσῳ μᾶλλον τὸ πλήρωμα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/012.yaml
  text: If their trespass means riches for the world[a], and their loss means riches for the Gentiles[b], how much more will their fullness mean?
translation:
  language: hi
  text: यदि उनका अपराध संसार के लिए धन है, और उनकी हानि गैर-यहूदियों के लिए धन है, तो उनकी परिपूर्णता से कितना अधिक धन होगा![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उनकी परिपूर्णता” का अर्थ “उनकी पूरी संख्या” या “उनका पूर्ण समावेश” भी हो सकता है।
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: παράπτωμα
  choice: अपराध
  rationale: यह शब्द नैतिक चूक या उल्लंघन का भाव रखता है; ‘अपराध’ आधुनिक हिन्दी में स्वाभाविक है और इस नैतिक अर्थ को बनाए रखता है।
- source_word: πλοῦτος
  choice: धन
  rationale: यहाँ परमेश्वर की आशीष की प्रचुरता का रूपक है; ‘धन’ उस रूपक को संक्षिप्त और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: κόσμου
  choice: संसार
  rationale: यह इस्राएल से परे व्यापक मानव-जगत को सूचित करता है; ‘संसार’ यूनानी अभिव्यक्ति की व्यापकता बनाए रखता है।
- source_word: ἥττημα
  choice: हानि
  rationale: दुर्लभ शब्द में हानि, पराजय या घटाव के भाव संभव हैं; ‘हानि’ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: ἐθνῶν
  choice: गैर-यहूदियों
  rationale: रोमियों के पत्र में यह इस्राएल/यहूदियों के विपरीत अन्यजातीय लोगों को दर्शाता है; ‘गैर-यहूदी’ आधुनिक सामान्य पाठक के लिए स्पष्ट है।
- source_word: πόσῳ μᾶλλον
  choice: कितना अधिक
  rationale: यह न्यून से अधिक की ओर तर्क करने वाली मानक तुलनात्मक अभिव्यक्ति है।
- source_word: πλήρωμα
  choice: परिपूर्णता
  rationale: यह पूर्णता, पूरी संख्या या पूर्ण सहभागिता का भाव दे सकता है; ‘परिपूर्णता’ मूल की व्यापकता और अस्पष्टता को सुरक्षित रखती है।
theological_decisions:
- issue: τὸ πλήρωμα αὐτῶν का आशय
  choice: ‘उनकी परिपूर्णता’ के रूप में व्यापक अनुवाद
  alternative: उनकी पूरी संख्या; उनका पूर्ण समावेश; उनकी बहाली
  rationale: यूनानी पद संक्षिप्त है और यह स्पष्ट नहीं करता कि आशय संख्या, समावेश, या पुनर्स्थापना से है। मुख्य पाठ इस धर्मवैज्ञानिक तनाव को खुला रखता है।
- issue: अंतिम वाक्य में निहित परिणाम
  choice: ‘कितना अधिक लाभ लाएगी’
  alternative: 'शाब्दिक रूप से अधूरा: ‘तो उनकी परिपूर्णता कितना अधिक!’'
  rationale: यूनानी में अंतिम परिणाम क्रिया रहित है और पहले के ‘संसार/गैर-यहूदियों के लिए धन’ से समझा जाता है। हिन्दी में वाक्य पूरा करने के लिए ‘लाभ लाएगी’ जोड़ा गया है, बिना लाभ के स्वरूप को अधिक निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘अन्यजातियों’ की अपेक्षा ‘गैर-यहूदियों’ को स्पष्टता के लिए चुना गया। यूनानी के क्रियारहित अंतिम खंड को स्वाभाविक हिन्दी में पूरा किया गया है।
