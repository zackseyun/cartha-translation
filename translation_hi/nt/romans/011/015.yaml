source:
  edition: SBLGNT
  text: εἰ γὰρ ἡ ἀποβολὴ αὐτῶν καταλλαγὴ κόσμου, τίς ἡ πρόσλημψις εἰ μὴ ζωὴ ἐκ νεκρῶν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/015.yaml
  text: For if their rejection means reconciliation for the world[b][a], what will their acceptance mean if not life from the dead?
translation:
  language: hi
  text: क्योंकि यदि उनका ठुकराया जाना संसार का मेल-मिलाप है, तो उनका स्वीकार किया जाना मरे हुओं में से जीवन के सिवा और क्या होगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मरे हुओं में से जीवन” असाधारण आत्मिक नवजीवन का रूपक हो सकता है, या अधिक विशेष रूप से पुनरुत्थान की ओर संकेत कर सकता है; पौलुस की अभिव्यक्ति संक्षिप्त और अर्थ-सघन है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀποβολὴ
  choice: ठुकराया जाना
  rationale: यह प्रसंग में अलग कर दिए जाने या अस्वीकार किए जाने का संबंधपरक भाव स्वाभाविक हिन्दी में व्यक्त करता है और πρόσλημψις के साथ स्पष्ट विरोध बनाता है।
- source_word: καταλλαγὴ
  choice: मेल-मिलाप
  rationale: यह पौलुस के यहाँ बिगड़े संबंध के बहाल होने का मानक भाव व्यक्त करता है और सामान्य पाठक के लिए सहज है।
- source_word: κόσμου
  choice: संसार
  rationale: मूल की व्यापक अभिव्यक्ति को बनाए रखता है; इसे मुख्य पाठ में केवल गैर-यहूदियों तक सीमित नहीं करता।
- source_word: πρόσλημψις
  choice: स्वीकार किया जाना
  rationale: यह ἀποβολή के विपरीत फिर से ग्रहण या स्वीकार किए जाने का भाव स्पष्ट करता है।
- source_word: ζωὴ ἐκ νεκρῶν
  choice: मरे हुओं में से जीवन
  rationale: मूल की संक्षिप्त और प्रभावशाली अभिव्यक्ति को बनाए रखता है तथा आत्मिक नवजीवन और पुनरुत्थान के बीच की वास्तविक व्याख्यात्मक खुली जगह को बंद नहीं करता।
- source_word: εἰ μὴ
  choice: के सिवा और क्या
  rationale: आलंकारिक प्रश्न में अपेक्षित जोरदार उत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले तर्क के साथ कारणात्मक संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: ‘मरे हुओं में से जीवन’ का अर्थ
  choice: वाक्यांश को खुली और अर्थ-सघन अभिव्यक्ति के रूप में बनाए रखना
  alternative: इसे विशेष रूप से महान आत्मिक नवजागरण या अंतिम पुनरुत्थान कहना
  rationale: पौलुस की भाषा संक्षिप्त और संकेतपूर्ण है; अनुवाद को यह तय नहीं करना चाहिए कि यहाँ केवल आत्मिक नवीकरण, व्यापक जीवन-संचार या अंतिम पुनरुत्थान में से कौन-सा अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘ठुकराया जाना’ और ‘स्वीकार किया जाना’ से यूनानी संज्ञाओं का स्पष्ट विरोध उभरता है। ‘मेल-मिलाप’ सामान्य धार्मिक शब्दावली में परिचित है, और ‘मरे हुओं में से जीवन’ मूल की धर्मवैचारिक अस्पष्टता को सुरक्षित रखता है।
