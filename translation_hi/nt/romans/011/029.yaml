  edition: SBLGNT
  text: ἀμεταμέλητα γὰρ τὰ χαρίσματα καὶ ἡ κλῆσις τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/029.yaml
  text: For the gifts and the calling of God are irrevocable[a].
translation:
  language: hi
  text: क्योंकि परमेश्वर के वरदान और बुलाहट वापस नहीं लिए जाते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिन पर पछतावा नहीं किया जाता।’ पुराने अनुवादों में, ‘पश्चाताप के बिना।’
    reason: ἀμεταμέλητα के ‘न पछताया जाना’ और ‘वापस न लिया जाना’ दोनों अर्थों को सुरक्षित रखता है। पुराना शाब्दिक अनुवाद दिया गया है, बिना उसे आधुनिक हिन्दी में मुख्य अर्थ के रूप में प्रस्तुत किए।
lexical_decisions:
- source_word: ἀμεταμέλητα
  choice: अटल हैं
  rationale: यह विशेषण ऐसी बात को दर्शाता है जिस पर पछतावा न किया जाए या जिसे वापस न लिया जाए। यहाँ ‘अटल हैं’ स्वाभाविक और गरिमापूर्ण हिन्दी में यह भाव व्यक्त करता है कि परमेश्वर अपने वरदान और बुलाहट को वापस नहीं लेता, पर ‘अपरिवर्तनीय’ जैसा अर्थगत अतिकथन नहीं करता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: τὰ χαρίσματα
  choice: वरदान
  rationale: χάρισμα अनुग्रह से दिए गए उपहार को दर्शाता है। ‘वरदान’ प्रचलित, संक्षिप्त और प्रसंगानुकूल बहुवचन अर्थ रखता है।
- source_word: ἡ κλῆσις
  choice: बुलाहट
  rationale: ‘बुलाहट’ पौलुस के प्रयोग में परमेश्वर द्वारा बुलाए जाने के धर्मवैचारिक भार को बनाए रखती है और केवल साधारण निमंत्रण का अर्थ नहीं देती।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के … उसकी
  rationale: यूनानी संबंधकारक दोनों संज्ञाओं के साथ परमेश्वर का संबंध बताता है और स्रोत अथवा स्वामित्व की सटीक छाया खुली रखता है। स्वाभाविक हिन्दी के लिए दूसरे पद के साथ ‘उसकी’ रखा गया है।
theological_decisions:
- issue: ‘परमेश्वर के वरदान और बुलाहट’ का प्रसंगगत दायरा
  choice: मुख्य पाठ में वाक्यांश को बिना यह निर्धारित किए रखा गया है कि वह केवल इस्राएल के विशेषाधिकारों और बुलाहट पर लागू है या एक व्यापक सिद्धांत है।
  alternative: इसे स्पष्ट रूप से इस्राएल की वाचा-संबंधी बुलाहट तक सीमित करना, अथवा परमेश्वर के सभी अनुग्रहपूर्ण वरदानों और बुलाहट का सार्वभौमिक सिद्धांत बताना।
  rationale: रोमियों 9–11 का निकट प्रसंग इस्राएल पर केंद्रित है, लेकिन इस पद का यूनानी पाठ स्वयं कर्म या प्राप्तकर्ता को दोबारा स्पष्ट नहीं करता। इसलिए अनुवाद पौलुस की संक्षिप्त अभिव्यक्ति और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘वरदान’ और ‘बुलाहट’ परिचित बाइबलीय शब्द हैं। ‘अटल’ संक्षिप्त और स्वाभाविक है; पादटिप्पणी मूल शब्द की ‘पछतावा न होने/वापस न लेने’ वाली अर्थ-छाया सुरक्षित रखती है।
