translation:
  language: hi
  text: कि शायद किसी तरह मैं अपने ही लोगों को ईर्ष्या दिलाऊँ और उनमें से कुछ को बचाऊँ।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘मेरे अपने मांस को’; अर्थात् मेरे जातीय स्वजनों, मेरे साथी यहूदियों को।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ πως
  choice: कि किसी तरह
  rationale: यह वाक्यांश पौलुस की आशापूर्ण, किंतु अनिश्चित अभिलाषा या उद्देश्य व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक ढंग से उस अनिश्चितता को बनाए रखता है।
- source_word: παραζηλώσω
  choice: जलन उत्पन्न करूँ
  rationale: क्रिया का अर्थ ईर्ष्या या होड़ की भावना जगाना है और यह आसपास के प्रसंग में गैर-यहूदियों के सम्मिलित होने से इस्राएल में उत्पन्न जलन की विषय-वस्तु को बनाए रखता है।
- source_word: μου τὴν σάρκα
  choice: अपने ही लोगों
  rationale: शाब्दिक अर्थ ‘मेरे शरीर/मांस’ है, पर यहाँ यह पौलुस के जातीय स्वजनों, अर्थात उसके साथी यहूदियों, के लिए यूनानी मुहावरा है। हिन्दी में शाब्दिक ‘मेरा मांस’ भ्रामक और अप्राकृतिक होगा, इसलिए अभिप्रेत संबंध को मुख्य पाठ में स्पष्ट किया गया है।
- source_word: σώσω
  choice: बचाऊँ
  rationale: पौलुस के प्रयोग में यह उद्धार संबंधी अर्थ रखता है; ‘बचाऊँ’ सामान्य, स्पष्ट और धर्मवैज्ञानिक भार को सुरक्षित रखने वाला हिन्दी रूप है।
- source_word: τινὰς ἐξ αὐτῶν
  choice: उनमें से कुछ को
  rationale: यह पहले बताए समूह में से एक अनिश्चित उपसमूह को दर्शाता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: μου τὴν σάρκα में σάρξ का अर्थ
  choice: जातीय/कुटुंबीय अर्थ में ‘अपने ही लोगों’
  alternative: शाब्दिक रूप में ‘अपने ही मांस को’ या व्याख्यात्मक रूप में ‘अपने साथी यहूदियों को’
  rationale: प्रसंग में σάρξ ‘पापी स्वभाव’ नहीं, बल्कि पौलुस की प्राकृतिक और जातीय नातेदारी को सूचित करता है। ‘अपने ही लोगों’ अर्थ को स्पष्ट रखता है, जबकि ‘साथी यहूदी’ की अपेक्षा स्रोत की थोड़ी व्यापक कुटुंबीय अभिव्यक्ति को भी बनाए रखता है।
- issue: परमेश्वर और मानवीय साधन के बीच ‘बचाऊँ’ का प्रयोग
  choice: पौलुस के प्रथम पुरुष क्रियापद को सीधे ‘बचाऊँ’ कहना
  alternative: ‘उनके उद्धार का माध्यम बनूँ’
  rationale: यूनानी पाठ स्वयं σώσω, ‘मैं बचाऊँ’, कहता है। इसे व्याख्यात्मक ढंग से नरम करना पाठ की धर्मवैज्ञानिक तनावशीलता को अनावश्यक रूप से सुलझा देता; इसलिए मूल अभिव्यक्ति सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘जलन उत्पन्न करूँ’ प्रसंगगत प्रतिध्वनि को ‘ईर्ष्यालु बनाऊँ’ से अधिक स्पष्ट रखता है।
