base_translation:
  language: en
  yaml_path: translation/nt/romans/011/026.yaml
  text: 'And in this way all Israel will be saved[a], just as it is written: “The Deliverer will come from Zion[c][b]; he will turn away ungodliness from Jacob.”'
translation:
  language: hi
  text: 'और इस रीति से सारा इस्राएल उद्धार पाएगा[a], जैसा लिखा है: “छुड़ानेवाला सिय्योन से[b] आएगा; वह याकूब से अभक्ति को दूर करेगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस रीति से” का अनुवाद “और इस प्रकार सारा इस्राएल उद्धार पाएगा” भी हो सकता है। यूनानी οὕτως ढंग या प्रक्रिया को सूचित कर सकता है और सम्भवतः पिछले वर्णन की ओर संकेत करता है। “सारा इस्राएल” का अभिप्राय विवादित है; अनुवाद यह तय नहीं करता कि यहाँ समस्त जातीय इस्राएल, विश्वासी शेष, या परमेश्वर की पूर्ण प्रजा अभिप्रेत है।
    reason: lexical_alternative_and_interpretive_ambiguity
  - marker: b
    text: “सिय्योन से” का अधिक शाब्दिक रूप “सिय्योन में से” है।
    reason: lexical_alternative
