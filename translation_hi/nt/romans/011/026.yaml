- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: भविष्यकालीन कर्मवाच्य तथा पौलुस के प्रसंग में निहित उद्धार-संबंधी अर्थ दोनों सुरक्षित रहते हैं।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्रीय उद्धरण का प्रचलित, स्पष्ट और स्वाभाविक हिन्दी सूत्र है।
- source_word: Ἥξει
  choice: आएगा
  rationale: भविष्यसूचक उद्धरण में सरल और स्वाभाविक समतुल्य।
- source_word: ἐκ Σιὼν
  choice: सिय्योन से
  rationale: ἐκ के स्रोत-बोध को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ ῥυόμενος
  choice: छुड़ानेवाला
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदंत को उपाधि-सदृश, अर्थपूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी में प्रस्तुत करता है।
- source_word: ἀποστρέψει
  choice: दूर करेगा
  rationale: इस प्रसंग में किसी वस्तु को हटा देने या अलग कर देने का कारणात्मक भाव स्पष्ट करता है; अत्यधिक शाब्दिक और अस्वाभाविक ‘फेर देगा’ से बचता है।
- source_word: ἀσεβείας
  choice: अभक्ति
  rationale: यह परमेश्वर के प्रति अनादर और भक्तिहीनता के नैतिक-धार्मिक अर्थ को संक्षिप्त तथा गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἀπὸ Ἰακώβ
  choice: याकूब से
  rationale: मूल उद्धरण का नाम और ἀπό का अलगाव-बोध सुरक्षित रखा गया है; इसे ‘इस्राएल’ बनाकर सामंजस्य नहीं किया गया।
theological_decisions:
- issue: ‘सारा इस्राएल’ का अभिप्राय
  choice: वाक्यांश को बिना व्याख्यात्मक विस्तार के ‘सारा इस्राएल’ रखा गया है।
  alternative: समस्त जातीय इस्राएल; इस्राएल का विश्वासी शेष; अन्यजातियों सहित परमेश्वर की पूर्ण प्रजा
  rationale: मूल यूनानी स्वयं इन व्याख्याओं में से किसी एक को स्पष्ट रूप से निर्धारित नहीं करता; अनुवाद विवादित धर्मवैज्ञानिक प्रश्न को खुला रखता है।
- issue: ὁ ῥυόμενος की उपाधि-सदृश भूमिका
  choice: ‘छुड़ानेवाला’
  alternative: ‘वह जो छुड़ाता है’ या ‘उद्धारकर्ता’
  rationale: कृदंत की उपाधि-सदृश शक्ति सुरक्षित रहती है, पर देवनागरी में बड़े अक्षर न होने के कारण कोई अतिरिक्त मुद्रणगत धर्मवैज्ञानिक संकेत नहीं जोड़ा गया।
- issue: ‘उद्धार पाएगा’ का स्वरूप
  choice: भविष्यकालीन कर्मवाच्य अर्थ को बनाए रखा गया।
  alternative: ‘छुड़ाया जाएगा’
  rationale: ‘उद्धार पाएगा’ पौलुस के उद्धार-संबंधी प्रयोग को अधिक पूर्णता से व्यक्त करता है, जबकि कर्ता को पाठ से बाहर जाकर निर्दिष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और शास्त्रीय उद्धरण के अनुकूल शैली अपनाई गई है। ‘उद्धार पाएगा’, ‘छुड़ानेवाला’ और ‘अभक्ति’ जैसे शब्द धर्मवैज्ञानिक भार को बनाए रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
