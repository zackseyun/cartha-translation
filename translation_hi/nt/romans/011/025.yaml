id: ROM.11.25
reference: Romans 11:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ γὰρ θέλω ὑμᾶς ἀγνοεῖν, ἀδελφοί, τὸ μυστήριον τοῦτο, ἵνα μὴ ⸀ἦτε ἑαυτοῖς φρόνιμοι, ὅτι πώρωσις ἀπὸ μέρους τῷ Ἰσραὴλ γέγονεν ἄχρι οὗ τὸ πλήρωμα τῶν ἐθνῶν εἰσέλθῃ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/025.yaml
  text: 'For I do not want you to be unaware[a], brothers, of this mystery, so that you may not be wise in your own sight: a partial hardening has come upon Israel until the fullness of the Gentiles has come in[b],'
translation:
  language: hi
  text: 'क्योंकि, हे भाइयो,[a] मैं नहीं चाहता कि तुम इस रहस्य से अनजान रहो, ताकि तुम अपनी ही दृष्टि में बुद्धिमान न बनो: इस्राएल पर कुछ हद तक कठोरता आई है, जब तक कि गैर-यहूदियों की भरपूरी प्रवेश न कर जाए।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘हे भाई-बहनो’; यूनानी में ‘भाइयो’ है, जो स्त्री-पुरुषों के मिले-जुले समूह को भी संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘जब तक गैर-यहूदियों की पूरी संख्या प्रवेश न कर जाए।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοεῖν
  choice: अनजान रहो
  rationale: पौलुस के प्रचलित कथन οὐ θέλω ὑμᾶς ἀγνοεῖν का स्वाभाविक अर्थ है कि पाठक इस विषय से बेखबर या अनजान न रहें; यह नकारात्मक भाव वाले ‘अज्ञानी’ से अधिक सहज है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी संबोधन पुल्लिंग बहुवचन है। ‘हे भाइयो’ उसके रूप और गरिमापूर्ण संबोधन को बनाए रखता है; मिश्रित समुदाय को संबोधित करने की सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: μυστήριον
  choice: रहस्य
  rationale: पौलुस में यह परमेश्वर की उस योजना को सूचित करता है जो पहले छिपी थी और अब प्रकट की गई है; ‘रहस्य’ इस धर्मवैचारिक अर्थ-क्षेत्र को सुरक्षित रखता है।
- source_word: ἵνα μὴ ἦτε ἑαυτοῖς φρόνιμοι
  choice: ताकि तुम अपनी ही दृष्टि में बुद्धिमान न बनो
  rationale: यह उद्देश्यसूचक खंड आत्मबुद्धिमत्ता और घमंड के विरुद्ध चेतावनी देता है तथा यूनानी वाक्य की प्रतिमा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πώρωσις
  choice: कठोरता
  rationale: संदर्भ में यह आत्मिक असंवेदनशीलता या हृदय की कठोर अवस्था को दर्शाता है; ‘कठोरता’ अर्थ को अनावश्यक व्याख्या के बिना व्यक्त करती है।
- source_word: ἀπὸ μέρους
  choice: कुछ हद तक
  rationale: यह वाक्यांश कठोरता की सीमा को आंशिक बताता है। ‘कुछ हद तक’ आधुनिक हिन्दी में स्वाभाविक है और इसे अनिवार्यतः केवल समयावधि से नहीं जोड़ता।
- source_word: τῷ Ἰσραὴλ γέγονεν
  choice: इस्राएल पर ... आई है
  rationale: पूर्णकालीन γέγονεν अतीत में आई और अब विद्यमान अवस्था को व्यक्त करता है; ‘आई है’ इस परिणामी स्थिति को सहज हिन्दी में रखता है।
- source_word: πλήρωμα
  choice: भरपूरी
  rationale: ‘भरपूरी’ पूर्णता, समग्रता या पूरी संख्या की सम्भावित छटाओं को खुला रखती है और विवादित पद का अर्थ किसी एक व्याख्या तक सीमित नहीं करती।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों की
  rationale: यहाँ ἔθνη इस्राएल के विपरीत अन्यजातीय, अर्थात गैर-यहूदी लोगों को दर्शाता है; ‘गैर-यहूदी’ साधारण आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: εἰσέλθῃ
  choice: भीतर न आ जाए
  rationale: ἄχρι οὗ के बाद यह उस घटना को सीमा-बिंदु के रूप में रखता है। ‘भीतर आ जाए’ प्रवेश की मूल छवि और सम्भाव्य भाव दोनों बनाए रखता है।
theological_decisions:
- issue: ‘गैर-यहूदियों की भरपूरी’ का अर्थ
  choice: मुख्य पाठ में ‘गैर-यहूदियों की भरपूरी’ रखा गया है।
  alternative: ‘गैर-यहूदियों की पूरी संख्या’ या ‘गैर-यहूदियों का पूर्ण समावेश’।
  rationale: πλήρωμα का आशय पूरी संख्या, पूर्ण समावेश या युगांतकारी पूर्णता हो सकता है। मुख्य पाठ व्यापक शब्द रखकर इस धर्मवैचारिक तनाव को अनिर्णीत छोड़ता है।
- issue: ἀδελφοί के संबोधन का दायरा
  choice: मुख्य पाठ में ‘हे भाइयो’ रखा गया है।
  alternative: ‘हे भाई-बहनो’।
  rationale: मूल यूनानी रूप पुल्लिंग बहुवचन है, जबकि रोमी मसीही समुदाय में स्त्रियाँ भी सम्मिलित थीं। स्रोत-रूप मुख्य पाठ में और सम्भावित समावेशी दायरा पादटिप्पणी में सुरक्षित है।
- issue: इस्राएल की कठोरता की सीमा
  choice: ‘कुछ हद तक कठोरता’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘इस्राएल का एक भाग कठोर हो गया है’।
  rationale: ἀπὸ μέρους कठोरता के आंशिक स्वरूप को बताता है, पर यह ठीक-ठीक लोगों के एक हिस्से या कठोरता की मात्रा में से किस पर बल देता है, इसे पूर्णतः स्पष्ट नहीं करता; चुना हुआ रूप इस खुलापन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। ‘हे भाइयो’, ‘रहस्य’, ‘कठोरता’ और ‘भरपूरी’ स्रोत की धर्मवैचारिक शब्दावली को बनाए रखते हैं, जबकि ‘गैर-यहूदी’ सामान्य पाठक के लिए ‘अन्यजाति’ से अधिक तुरंत स्पष्ट है।
