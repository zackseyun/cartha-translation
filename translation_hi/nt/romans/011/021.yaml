base_translation:
  language: en
  yaml_path: translation/nt/romans/011/021.yaml
  text: For if God did not spare the natural branches[a], neither will he spare you.
translation:
  language: hi
  text: क्योंकि यदि परमेश्वर ने स्वाभाविक डालियों को नहीं बख्शा,[a] तो वह तुम्हें भी नहीं बख्शेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रकृति के अनुसार डालियों को”; शाब्दिक रूप से, “स्वभाव के अनुसार डालियों को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: γάρ के तर्कसूचक संबंध और εἰ की शर्त—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण हिन्दी पद।
- source_word: τῶν κατὰ φύσιν κλάδων
  choice: उन डालियों को ... जो स्वभाव से थीं
  rationale: κατὰ φύσιν का शाब्दिक भाव ‘स्वभाव के अनुसार’ सुरक्षित रखते हुए जैतून के पेड़ का रूपक कायम रखता है; ‘डालियाँ’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκ ἐφείσατο
  choice: नहीं छोड़ा
  rationale: φείδομαι का अर्थ हानि या दण्ड से बचाना/बख्शना है। ‘नहीं छोड़ा’ इस संदर्भ में सीधी और स्वाभाविक हिन्दी है तथा अगले खंड के साथ क्रियात्मक समानता रखता है।
- source_word: οὐδὲ σοῦ φείσεται
  choice: तो वह तुम्हें भी नहीं छोड़ेगा
  rationale: οὐδέ की नकारात्मक निरंतरता को ‘भी नहीं’ से और σοῦ के एकवचन संबोधन को ‘तुम्हें’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘स्वभाव से’ वाली डालियों का संदर्भ
  choice: मुख्य पाठ में डालियों का रूपक बनाए रखा गया है।
  alternative: मुख्य पाठ में इसे जातीय इस्राएल कहकर स्पष्ट करना।
  rationale: संदर्भ इस्राएल की ओर संकेत करता है, पर यूनानी पाठ यहाँ रूपक ही प्रस्तुत करता है; इसलिए अनुवाद व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- issue: ‘तुम्हें भी नहीं छोड़ेगा’ चेतावनी का धर्मवैज्ञानिक आशय
  choice: चेतावनी को उसके सीधे, एकवचन रूप में रखा गया है।
  alternative: इसे किसी विशिष्ट मत के अनुसार व्यक्तिगत या सामूहिक उद्धार, धर्मत्याग अथवा चुनाव की व्याख्या देना।
  rationale: पद वास्तविक चेतावनी देता है, किंतु व्यापक धर्मवैज्ञानिक विवादों का स्पष्ट समाधान इस वाक्य में नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और तर्कप्रधान शैली। ‘डालियाँ’ रूपक को सुलभ रखता है। ‘छोड़ा/छोड़ेगा’ से दोनों यूनानी क्रियारूपों की समानता बनी रहती है।
