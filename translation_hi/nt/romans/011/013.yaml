source:
  edition: SBLGNT
  text: Ὑμῖν ⸀δὲ λέγω τοῖς ἔθνεσιν. ἐφ’ ὅσον μὲν ⸀οὖν εἰμι ἐγὼ ἐθνῶν ἀπόστολος, τὴν διακονίαν μου δοξάζω,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/013.yaml
  text: I am speaking to you Gentiles[a]. Inasmuch, then, as I am an apostle to the Gentiles, I magnify my ministry[b],
translation:
  language: hi
  text: 'पर मैं तुम गैर-यहूदियों से कहता हूँ: चूँकि मैं गैर-यहूदियों के लिए प्रेरित हूँ, इसलिए मैं अपनी सेवा को गौरवान्वित करता हूँ[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपनी सेवा की महिमा करता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμῖν δὲ λέγω τοῖς ἔθνεσιν
  choice: पर मैं तुम गैर-यहूदियों से कह रहा हूँ
  rationale: δὲ प्रसंग में हल्का संक्रमण अथवा विरोध दर्शाता है; ‘पर’ पिछले विचार से संबंध बनाए रखता है। Ὑμῖν और τοῖς ἔθνεσιν को स्वाभाविक हिन्दी संबोधन में साथ रखा गया है।
- source_word: ἐφ’ ὅσον μὲν οὖν
  choice: इसलिए, जहाँ तक
  rationale: ἐφ’ ὅσον सीमा/परिधि का भाव देता है, जबकि μὲν οὖν विचार को आगे बढ़ाता है; यह संयोजन दोनों भूमिकाएँ संक्षेप में व्यक्त करता है।
- source_word: ἐθνῶν ἀπόστολος
  choice: गैर-यहूदियों के लिए प्रेरित
  rationale: रोमियों 9–11 में ἔθνη इस्राएल से भिन्न गैर-यहूदी लोगों को सूचित करता है। जननकारक यहाँ प्रेरिताई के लक्षित समुदाय को बताता है।
- source_word: τὴν διακονίαν μου
  choice: अपनी सेवा
  rationale: διακονία पौलुस को सौंपे गए सेवाकार्य को दर्शाता है। ‘सेवा’ सामान्य आधुनिक हिन्दी में स्पष्ट है और शब्द के मूल सेवाभाव को बनाए रखती है।
- source_word: δοξάζω
  choice: गौरव बढ़ाता हूँ
  rationale: यहाँ क्रिया का कर्म पौलुस की सेवा है। ‘गौरव बढ़ाता हूँ’ उसके सेवाकार्य को सम्मानित/महत्त्वपूर्ण ठहराने का भाव देता है, बिना आत्म-महिमा का अर्थ आरोपित किए।
theological_decisions:
- issue: पौलुस द्वारा अपनी सेवा का δοξάζω करना
  choice: मैं अपनी सेवा का गौरव बढ़ाता हूँ
  alternative: मैं अपनी सेवा की महिमा करता हूँ
  rationale: मूल क्रिया सम्मान या महिमा देने का अर्थ रख सकती है। चुना हुआ पाठ यह स्पष्ट रखता है कि पौलुस स्वयं नहीं, अपनी नियुक्त सेवा को प्रतिष्ठित करता है; पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- issue: ἔθνη / ἐθνῶν का संदर्भ
  choice: गैर-यहूदी
  alternative: राष्ट्र/जातियाँ
  rationale: इस प्रसंग में इस्राएल और अन्य लोगों के बीच तुलना है, इसलिए ‘गैर-यहूदी’ अभिप्रेत समूह को आधुनिक हिन्दी में सबसे स्पष्ट रूप से बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल लेकिन गरिमापूर्ण शैली। ‘प्रेरित’ को पौलुस की विशिष्ट नियुक्त भूमिका के लिए रखा गया है। पद का अंतिम अल्पविराम अगले पद में जारी वाक्य को दर्शाता है।
