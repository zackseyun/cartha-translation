  text: κατὰ μὲν τὸ εὐαγγέλιον ἐχθροὶ δι’ ὑμᾶς, κατὰ δὲ τὴν ἐκλογὴν ἀγαπητοὶ διὰ τοὺς πατέρας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/028.yaml
  text: With respect to the gospel[a], they are enemies for your sake; but with respect to election[b], they are beloved because of the fathers.
translation:
  language: hi
  text: सुसमाचार के संबंध में तो वे तुम्हारे कारण शत्रु हैं, पर चुने जाने के संबंध में पूर्वजों[a] के कारण प्रिय हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पूर्वजों” से आशय विशेष रूप से इस्राएल के कुलपिताओं—अब्राहम, इसहाक और याकूब—से है।
    reason: cross_reference
lexical_decisions:
- source_word: κατὰ μὲν τὸ εὐαγγέλιον
  choice: सुसमाचार के संबंध में तो
  rationale: κατά के साथ कर्मकारक यहाँ विचार के क्षेत्र या दृष्टि को दर्शाता है; μέν...δέ का विरोध ‘तो...पर’ से स्वाभाविक रूप में सुरक्षित रहता है।
- source_word: ἐχθροὶ
  choice: शत्रु
  rationale: यह बहुवचन विशेषण विधेय रूप में प्रयुक्त है। ‘शत्रु’ संबंधगत स्थिति को व्यक्त करता है और इसे केवल ‘विरोधी’ या ‘घृणा के पात्र’ तक सीमित नहीं करता।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे कारण
  rationale: διά के साथ कर्मकारक कारण अथवा हित का भाव दे सकता है। ‘तुम्हारे कारण’ मूल की कारणगत अस्पष्टता को बनाए रखता है; ‘तुम्हारे भले के लिए’ अधिक व्याख्यात्मक होता।
- source_word: κατὰ δὲ τὴν ἐκλογὴν
  choice: पर चुने जाने के संबंध में
  rationale: κατά फिर विचार के क्षेत्र को दर्शाता है। ἐκλογή को ‘चुने जाने’ से देना आधुनिक हिंदी में सहज है और परमेश्वर के चुनाव की धारणा को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: ἀγαπητοὶ
  choice: प्रिय
  rationale: यह विधेय विशेषण प्रेम किए जाने की स्थिति बताता है। ‘प्रिय’ dignified और स्वाभाविक हिंदी है तथा ‘शत्रु’ के साथ पद का तनाव सुरक्षित रखता है।
- source_word: διὰ τοὺς πατέρας
  choice: पूर्वजों के कारण
  rationale: यहाँ διά कारण या आधार दर्शाता है। οἱ πατέρες का शब्दशः ‘पितर’ आधुनिक सामान्य पाठक के लिए कम सहज है; ‘पूर्वज’ मूल संकेत को रखता है, जबकि पादटिप्पणी उसके विशेष आशय को स्पष्ट करती है।
theological_decisions:
- issue: ‘वे’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘वे’ रखा गया है, जो प्रसंग में इस्राएल के लोगों की ओर संकेत करता है।
  alternative: इसे स्पष्ट करके ‘अविश्वासी यहूदी’ या ‘समस्त जातीय इस्राएल’ कहना।
  rationale: यूनानी पाठ सर्वनाम के आशय को प्रसंग पर छोड़ता है। अनुवाद इसे अधिक संकीर्ण या व्यापक बनाकर विवाद का समाधान नहीं करता।
- issue: ‘शत्रु’ और ‘प्रिय’ का संबंध
  choice: दोनों कथनों को पूर्ण बल और समानांतर रूप में रखा गया है।
  alternative: ‘शत्रु’ को केवल ‘विरोधी’ करना या ‘प्रिय’ को ऐसी व्याख्या से सीमित करना जिससे तनाव मिट जाए।
  rationale: पद स्वयं सुसमाचार के संबंध में ‘शत्रु’ और चुनाव के संबंध में ‘प्रिय’ का तनाव रखता है; अनुवाद को दोनों ध्रुव सुरक्षित रखने चाहिए।
- issue: ‘पूर्वजों’ का आशय
  choice: मुख्य पाठ में व्यापक स्रोत-संगत शब्द ‘पूर्वज’ और पादटिप्पणी में कुलपिताओं की पहचान।
  alternative: मुख्य पाठ में सीधे ‘अब्राहम, इसहाक और याकूब’ या ‘कुलपिताओं’ कहना।
  rationale: प्रसंग में इसका प्रमुख संकेत इस्राएल के कुलपिताओं की ओर है, पर मूल पाठ नाम नहीं देता; इसलिए विस्तार पादटिप्पणी में उचित है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘सुसमाचार’, ‘शत्रु’, ‘चुने जाने’ और ‘प्रिय’ पौलुस के विरोधात्मक ढाँचे और धर्मवैचारिक तनाव को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखते हैं।
