source:
  edition: SBLGNT
  text: Εἰ δέ τινες τῶν κλάδων ἐξεκλάσθησαν, σὺ δὲ ἀγριέλαιος ὢν ἐνεκεντρίσθης ἐν αὐτοῖς καὶ συγκοινωνὸς τῆς ⸀ῥίζης τῆς πιότητος τῆς ἐλαίας ἐγένου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/017.yaml
  text: But if some of the branches were broken off[a], and you, although being a wild olive tree, were grafted in among them and became a fellow sharer in the root, in the richness of the olive tree[b],
translation:
  language: hi
  text: पर यदि डालियों में से कुछ तोड़ दी गईं[a], और तुम, जंगली जैतून का पेड़ होते हुए भी, उनके बीच कलम लगाए गए और उनके साथ जड़ तथा जैतून के पेड़ की समृद्धि में सहभागी बन गए[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन डालियों के बीच कलम लगाए गए।”
    reason: यूनानी ἐν αὐτοῖς का वैकल्पिक, अधिक स्पष्ट संदर्भात्मक अनुवाद।
  - marker: b
    text: या, “जैतून के पेड़ की जड़ और उसकी समृद्धि में सहभागी बन गए”; परंपरागत रूप से, “जैतून के पेड़ की जड़ और चिकनाई में सहभागी बन गए।”
    reason: यूनानी में ‘जड़’, ‘समृद्धि/चिकनाई’ और ‘जैतून के पेड़’ की संबंधकारक-शृंखला सघन है और उसके संबंध को एक से अधिक प्रकार से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: Εἰ δέ
  choice: पर यदि
  rationale: शर्त और हल्के विरोध—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τινες τῶν κλάδων
  choice: डालियों में से कुछ
  rationale: τινες और अंशवाचक संबंध, दोनों स्पष्ट रूप से व्यक्त होते हैं।
- source_word: ἐξεκλάσθησαν
  choice: तोड़ दी गईं
  rationale: निष्क्रिय क्रिया और पेड़ से डालियाँ तोड़े जाने का रूपक सुरक्षित रहता है।
- source_word: ἀγριέλαιος ὢν
  choice: जंगली जैतून होते हुए भी
  rationale: ὢν के प्रसंगगत रियायती भाव को व्यक्त करता है और जैतून के रूपक को गैर-यहूदी के व्याख्यात्मक पर्याय से नहीं बदलता।
- source_word: ἐνεκεντρίσθης ἐν αὐτοῖς
  choice: उनके बीच कलम लगाया गया
  rationale: बागवानी-संबंधी क्रिया तथा बची हुई डालियों के बीच जोड़े जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συγκοινωνὸς
  choice: उनके साथ सहभागी
  rationale: συν- में निहित संयुक्त सहभागिता को स्पष्ट रखता है।
- source_word: τῆς ῥίζης τῆς πιότητος τῆς ἐλαίας
  choice: जैतून के पेड़ की जड़ की समृद्धि में
  rationale: संबंधकारकों की सघन शृंखला को यथासंभव बनाए रखते हुए πιότης को आधुनिक हिन्दी के ‘समृद्धि’ से व्यक्त करता है; वैकल्पिक व्याकरणिक संबंध पादटिप्पणी में रखा गया है।
- source_word: ἐγένου
  choice: हो गया
  rationale: नई अवस्था में प्रवेश के क्रियार्थ को सीधे व्यक्त करता है।
theological_decisions:
- issue: ἀγριέλαιος की रूपकात्मक पहचान
  choice: इसे ‘जंगली जैतून’ के रूप में ही रखा गया है।
  alternative: इसे सीधे ‘गैर-यहूदी’ कहना, या ‘जंगली जैतून की टहनी’ कहना।
  rationale: पौलुस की दलील जैतून के पेड़ के रूपक पर निर्भर है; अनुवाद में उसकी धार्मिक पहचान को व्याख्यात्मक रूप से तय नहीं किया गया।
- issue: ‘जड़’ और ‘समृद्धि’ का संबंध
  choice: मुख्य पाठ में ‘जैतून के पेड़ की जड़ की समृद्धि’ रखा गया है।
  alternative: ‘जैतून के पेड़ की जड़ और उसकी समृद्धि’।
  rationale: यूनानी संबंधकारकों का संबंध सघन और कुछ हद तक संदिग्ध है। मुख्य पाठ एक व्याकरणतः संभव और पठनीय संबंध देता है, जबकि समन्वयी पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। एकवचन संबोधन σὺ के कारण ‘तू’ रखा गया है; यह निकट या अनौपचारिक शैली नहीं, बल्कि मूल के एकवचन को स्पष्ट करने के लिए है। ‘कलम लगाया गया’ प्रचलित बागवानी पद है।
