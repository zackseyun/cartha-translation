  yaml_path: translation/nt/romans/011/005.yaml
  text: So then, in the present time also, a remnant has come to be according to the election of grace.
translation:
  language: hi
  text: तो इसी प्रकार, वर्तमान समय में भी अनुग्रह से चुने जाने के अनुसार एक शेष अस्तित्व में आया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως οὖν καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पद एलिय्याह के समय के उदाहरण से निष्कर्ष निकालकर उसे वर्तमान समय पर लागू करता है। ‘इसी प्रकार’ उस समानता और निष्कर्ष दोनों को स्वाभाविक हिन्दी में व्यक्त करता है, और καὶ के लिए ‘भी’ रखा गया है।
- source_word: ἐν τῷ νῦν καιρῷ
  choice: वर्तमान समय में
  rationale: καιρός यहाँ किसी विशेष वर्तमान काल या दौर को दर्शाता है। ‘वर्तमान समय में’ एलिय्याह के समय और पौलुस के वर्तमान के बीच का अंतर स्पष्ट रखता है।
- source_word: λεῖμμα
  choice: एक शेष समुदाय
  rationale: λεῖμμα उस अल्प समुदाय को दर्शाता है जो बड़े समूह में से शेष है। ‘शेष समुदाय’ सामूहिक अर्थ को स्पष्ट करता है और केवल निर्जीव ‘बाकी हिस्सा’ जैसा भाव आने से बचाता है।
- source_word: κατ’ ἐκλογὴν χάριτος
  choice: अनुग्रह के चुनाव के अनुसार
  rationale: यह अनुवाद ἐκλογή और χάρις दोनों को स्पष्ट रखता है तथा उनके बीच के संबंध को किसी एक अर्थ—अनुग्रहपूर्ण चुनाव, अनुग्रह द्वारा चुनाव, या अनुग्रह पर आधारित चुनाव—तक सीमित नहीं करता।
- source_word: γέγονεν
  choice: अस्तित्व में आया है
  rationale: γίνομαι का पूर्णकाल किसी पूर्व घटना से उत्पन्न वर्तमान स्थिति बताता है। ‘अस्तित्व में आया है’ उसके क्रियात्मक और परिणामी भाव को केवल ‘है’ की अपेक्षा अधिक अच्छी तरह सुरक्षित रखता है।
theological_decisions:
- issue: पौलुस के धर्मवैज्ञानिक संदर्भ में ἐκλογή का अनुवाद
  choice: चुनाव
  alternative: चुना जाना; चयन
  rationale: ‘चुनाव’ मूल शब्द का भार बनाए रखता है, पर किसी विशेष सम्प्रदायगत चुनाव-सिद्धांत को पाठ में नहीं जोड़ता।
- issue: κατ’ ἐκλογὴν χάριτος में अनुग्रह और चुनाव का संबंध
  choice: अनुग्रह के चुनाव के अनुसार
  alternative: अनुग्रहपूर्ण चुनाव के अनुसार; अनुग्रह द्वारा हुए चुनाव के अनुसार
  rationale: मूल यूनानी का संबंध संक्षिप्त और अर्थ की दृष्टि से खुला है। सम्बन्धकारक रचना को बनाए रखने से चुनाव के गुण, आधार या स्रोत में से किसी एक को अनावश्यक रूप से निर्णायक नहीं बनाया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘शेष समुदाय’ सामूहिक अर्थ स्पष्ट करता है; ‘अनुग्रह के चुनाव’ की कुछ असामान्य किन्तु समझने योग्य रचना मूल की धर्मवैज्ञानिक अस्पष्टता को सुरक्षित रखती है।
