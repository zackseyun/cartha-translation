id: ROM.11.24
reference: Romans 11:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ σὺ ἐκ τῆς κατὰ φύσιν ἐξεκόπης ἀγριελαίου καὶ παρὰ φύσιν ἐνεκεντρίσθης εἰς καλλιέλαιον, πόσῳ μᾶλλον οὗτοι οἱ κατὰ φύσιν ἐγκεντρισθήσονται τῇ ἰδίᾳ ἐλαίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/024.yaml
  text: For if you were cut from what is by nature a wild olive tree and[a], contrary to nature, were grafted into a cultivated olive tree, how much more will these, the natural branches[b], be grafted into their own olive tree.
translation:
  language: hi
  text: क्योंकि यदि तुम स्वभाव से जंगली जैतून के पेड़ से काटे गए और प्रकृति के विरुद्ध उगाए हुए जैतून के पेड़ में कलम लगाए गए, तो ये, जो स्वभावतः डालियाँ हैं[a], अपने ही जैतून के पेड़ में कितना अधिक कलम लगाए जाएँगे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये, जो स्वभावतः हैं।” यूनानी में केवल “ये, जो स्वभावतः हैं” है; जैतून-वृक्ष के रूपक और संदर्भ के आधार पर “डालियाँ” जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने ही जैतून के पेड़ में फिर से कलम लगाए जाएँगे।” लौटने का भाव संदर्भ में निहित है, पर यूनानी क्रिया में “फिर से” स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεκόπης
  choice: काटे गए
  rationale: ἐκκόπτω का मूल अर्थ काटना या काटकर अलग करना है। यह चयन बाग़बानी के रूपक को बनाए रखता है और निकटवर्ती पदों के प्रभाव से इसे केवल ‘तोड़ दिए गए’ नहीं बनाता।
- source_word: ἀγριελαίου
  choice: जंगली जैतून का पेड़
  rationale: यह संज्ञा जंगली जैतून को दर्शाती है। ‘पेड़’ जोड़ने से हिन्दी में पेड़ और डालियों का रूपक स्पष्ट रहता है।
- source_word: παρὰ φύσιν
  choice: प्रकृति के विरुद्ध
  rationale: यह κατὰ φύσιν के साथ पौलुस के जानबूझकर रखे गए विरोध को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐνεκεντρίσθης / ἐγκεντρισθήσονται
  choice: कलम लगाए गए / कलम लगाए जाएँगे
  rationale: ἐγκεντρίζω बाग़बानी का तकनीकी क्रिया-पद है। ‘कलम लगाना’ आधुनिक हिन्दी में इस प्रक्रिया का सामान्य और सटीक पद है।
- source_word: καλλιέλαιον
  choice: सँवारा हुआ जैतून का पेड़
  rationale: शब्द जंगली जैतून के विपरीत उगाए-सँवारे या cultivated जैतून को दर्शाता है। ‘सँवारा हुआ’ ‘अच्छा’ की अनावश्यक नैतिक छाया से बचता है और सामान्य पाठक के लिए बोधगम्य है।
- source_word: πόσῳ μᾶλλον
  choice: और भी कितने अधिक
  rationale: यह कम से अधिक की पौलुस की दलील और विस्मयात्मक प्रश्न का बल बनाए रखता है, यद्यपि हिन्दी में यह जानबूझकर कुछ औपचारिक वाक्य-विन्यास है।
- source_word: οὗτοι οἱ κατὰ φύσιν
  choice: ये, जो स्वभावतः उसकी डालियाँ हैं
  rationale: यूनानी में ‘डालियाँ’ प्रत्यक्ष रूप से नहीं है, पर जैतून के पेड़ और कलम लगाने के निकट संदर्भ से स्पष्ट रूप से निहित है। इसे जोड़ने से रूपक हिन्दी में स्वाभाविक और स्पष्ट बनता है।
- source_word: τῇ ἰδίᾳ ἐλαίᾳ
  choice: अपने ही जैतून के पेड़ में
  rationale: ἰδίᾳ अपनेपन और स्वाभाविक संबंध पर बल देता है; ‘में’ कलम लगाने की दिशा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ‘ये’ को स्पष्ट रूप से यहूदी या इस्राएली कहा जाए
  choice: मुख्य पाठ में ‘ये, जो स्वभावतः उसकी डालियाँ हैं’ रखकर पहचान को संदर्भ और रूपक से प्रकट होने देना
  alternative: ‘ये यहूदी’ या ‘ये इस्राएली’
  rationale: रोमियों 11 का संदर्भ जातीय इस्राएल की ओर संकेत करता है, पर इस पद का यूनानी पाठ कोई जातीय नाम नहीं देता। रूपक को बनाए रखना पाठ से आगे बढ़कर अर्थ को सीमित करने से बचाता है।
- issue: यूनानी में अनुपस्थित ‘डालियाँ’ शब्द की पूर्ति
  choice: स्पष्टता के लिए मुख्य पाठ में ‘डालियाँ’ जोड़ना और पादटिप्पणी में इसकी सूचना देना
  alternative: ‘ये, जो स्वभावतः उसके हैं’
  rationale: आसपास का पूरा रूपक डालियों को काटने और कलम लगाने का है। हिन्दी में संज्ञा की पूर्ति अर्थ को स्वाभाविक बनाती है, जबकि पादटिप्पणी मूल पाठ की संक्षिप्तता सुरक्षित रखती है।
- issue: क्या अंतिम क्रिया में वापसी का भाव स्पष्ट किया जाए
  choice: मुख्य पाठ में केवल ‘कलम लगाए जाएँगे’
  alternative: ‘फिर से कलम लगाए जाएँगे’ या ‘वापस कलम लगाए जाएँगे’
  rationale: वापसी का भाव संदर्भ से निहित है, लेकिन ἐγκεντρισθήσονται में ‘फिर से’ या ‘वापस’ प्रत्यक्ष रूप से नहीं है। इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए बोधगम्य रखी गई है। बाग़बानी के रूपक के लिए ‘कलम लगाना’ प्रयुक्त है। ‘सँवारा हुआ’ cultivated का सहज प्रतिरूप है और ‘उत्तम’ जैसे मूल्यांकनकारी शब्द से बचता है। πόσῳ μᾶλλον की तार्किक और अलंकारिक शक्ति बचाने के लिए अंतिम वाक्य में अपेक्षाकृत औपचारिक ‘और भी कितने अधिक’ रखा गया है।
