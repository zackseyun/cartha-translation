source:
  edition: SBLGNT
  text: Κύριε, τοὺς προφήτας σου ἀπέκτειναν, ⸀τὰ θυσιαστήριά σου κατέσκαψαν, κἀγὼ ὑπελείφθην μόνος, καὶ ζητοῦσιν τὴν ψυχήν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/003.yaml
  text: Lord[a], they killed your prophets, they tore down your altars, and I alone was left, and they are seeking my life.
translation:
  language: hi
  text: “प्रभु, उन्होंने तेरे भविष्यद्वक्ताओं को मार डाला, तेरी वेदियों को ढा दिया, और केवल मैं ही बचा रह गया; और वे मेरे प्राण लेने की ताक में हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “वे मेरे प्राण की खोज कर रहे हैं”; यहाँ यूनानी मुहावरे का अर्थ है कि वे मुझे मार डालना चाहते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κύριε
  choice: प्रभु
  rationale: परमेश्वर को सीधे संबोधित करने वाला संबोधन है; नए नियम के इस प्रसंग में ‘प्रभु’ स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: ἀπέκτειναν
  choice: मार डाला
  rationale: क्रिया का सीधा अर्थ हत्या करना या प्राण ले लेना है। ‘मार डाला’ आधुनिक हिन्दी में स्वाभाविक है और ‘हत्या की’ की अपेक्षा अनावश्यक अतिरिक्त नैतिक रंग नहीं जोड़ता।
- source_word: τὰ θυσιαστήριά σου
  choice: तेरी वेदियों
  rationale: θυσιαστήριον बलिदान चढ़ाने की वेदी को दर्शाता है; इस प्रसंग में ‘वेदियाँ’ पर्याप्त स्पष्ट और प्रचलित बाइबलीय हिन्दी है।
- source_word: κατέσκαψαν
  choice: ढा दिया
  rationale: क्रिया में खोदकर गिरा देने या पूरी तरह ढहा देने का ठोस भाव है। वेदियों के संदर्भ में ‘ढा दिया’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κἀγὼ ὑπελείφθην μόνος
  choice: और केवल मैं ही बचा रह गया हूँ
  rationale: यह रूप केवल एक व्यक्ति के शेष रहने पर बल देता है और यूनानी के कर्मवाच्य परिणाम को सहज हिन्दी में प्रकट करता है। वर्तमान परिणाम के कारण हिन्दी में ‘रह गया हूँ’ स्वाभाविक है।
- source_word: ζητοῦσιν τὴν ψυχήν μου
  choice: वे मेरे प्राण लेने की ताक में हैं
  rationale: यह यूनानी मुहावरा एलिय्याह के जीवन पर घात की बात करता है, अमूर्त ‘आत्मा’ की नहीं। हिन्दी का यह मुहावरा जारी शत्रुतापूर्ण प्रयास को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ψυχή को प्राण-संकट वाले मुहावरे में कैसे व्यक्त किया जाए
  choice: मेरे प्राण लेने की ताक में हैं
  alternative: मेरे प्राण की खोज में हैं
  rationale: यहाँ ψυχή मनुष्य के जीवन को दर्शाता है, देह से अलग किसी अमूर्त आत्मा के विषय में कथन नहीं करता। चुना हुआ रूप आशय स्पष्ट करता है, पर हत्या की कोशिश से आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर को संबोधन में एकवचन निकटतासूचक ‘तेरे/तेरी’ रखा गया है, जो उद्धृत प्रार्थना की पारंपरिक गंभीरता और यूनानी एकवचन को बनाए रखता है।
