base_translation:
  language: en
  yaml_path: translation/nt/romans/011/023.yaml
  text: And even they[a], if they do not continue in unbelief, will be grafted in[b]; for God is able to graft them in again.
translation:
  language: hi
  text: और वे भी, यदि अविश्वास में बने न रहें[a], तो कलम लगाकर जोड़े जाएँगे[b]; क्योंकि परमेश्वर उन्हें फिर से कलम लगाकर जोड़ सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासहीनता में बने न रहें।”
    reason: lexical_alternative
  - marker: b
    text: या, “फिर से कलम लगाकर जोड़े जाएँगे।” यूनानी में “फिर से” दूसरे उपवाक्य में स्पष्ट रूप से आया है।
    reason: alternative_reading
lexical_decisions:
- source_word: κἀκεῖνοι δέ
  choice: और वे भी
  rationale: καί के समावेशी बल और ἐκεῖνοι के संदर्भसूचक अर्थ को सहज हिन्दी में व्यक्त करता है; δέ से पिछले कथन के साथ हल्का विरोध और विचार की निरंतरता दोनों बने रहते हैं।
- source_word: ἐὰν μὴ ἐπιμένωσι
  choice: यदि ... बने न रहें
  rationale: ἐάν के साथ वर्तमान संभावनार्थक क्रिया की शर्त और ἐπιμένω के किसी दशा में लगातार बने रहने के अर्थ को सुरक्षित रखता है।
- source_word: τῇ ἀπιστίᾳ
  choice: अविश्वास में
  rationale: रोमियों 11 में विश्वास और अविश्वास के सीधे विरोध को व्यक्त करता है; यहाँ मुख्य अर्थ विश्वास न करना है।
- source_word: ἐγκεντρισθήσονται
  choice: कलम लगाकर जोड़ दिए जाएँगे
  rationale: जैतून के पेड़ के रूपक और यूनानी भविष्यत् कर्मवाच्य दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: δυνατὸς ... ὁ θεὸς
  choice: परमेश्वर ... समर्थ है
  rationale: परमेश्वर की ऐसा करने की सामर्थ्य पर यूनानी वाक्य के बल को संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: πάλιν ἐγκεντρίσαι αὐτούς
  choice: उन्हें फिर से कलम लगाकर जोड़ने
  rationale: πάλιν के पुनर्स्थापन या दोबारा किए जाने के स्पष्ट अर्थ को केवल दूसरे उपवाक्य में रखता है, जहाँ वह यूनानी पाठ में उपस्थित है।
theological_decisions:
- issue: ἀπιστία का अर्थ
  choice: अविश्वास
  alternative: विश्वासघात या अविश्वसनीयता
  rationale: इस प्रसंग में पौलुस विश्वास और अविश्वास के आधार पर जैतून के पेड़ में बने रहने या काटे जाने की बात करता है; फिर भी पदटिप्पणी व्यापक शाब्दिक संभावना को बनाए रखती है।
- issue: पहली grafting क्रिया में पुनर्स्थापन को स्पष्ट करना
  choice: पहले उपवाक्य में केवल “कलम लगाकर जोड़ दिए जाएँगे,” और दूसरे में “फिर से”
  alternative: पहले ही उपवाक्य में “फिर से कलम लगाकर जोड़ दिए जाएँगे”
  rationale: यूनानी πάλιν केवल दूसरे उपवाक्य में है। यह चयन पुनर्स्थापन के भाव को बनाए रखते हुए उसके स्पष्ट स्थान को नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। बागवानी के रूपक को समझने योग्य बनाने के लिए “कलम लगाकर जोड़ना” रखा गया है। वाक्य में शर्त, कर्मवाच्य और परमेश्वर की सामर्थ्य पर बल सुरक्षित हैं।
