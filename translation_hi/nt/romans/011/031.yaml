source:
  edition: SBLGNT
  text: οὕτως καὶ οὗτοι νῦν ἠπείθησαν τῷ ὑμετέρῳ ἐλέει ἵνα καὶ αὐτοὶ ⸀νῦν ἐλεηθῶσιν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/031.yaml
  text: So also these now have been disobedient[a], so that by the mercy shown to you they also may now receive mercy.
translation:
  language: hi
  text: उसी प्रकार ये भी अब अवज्ञाकारी हो गए हैं, ताकि तुम पर की गई दया के द्वारा[a] उन पर भी अब दया की जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी दया के द्वारा।” यूनानी पदबंध का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, पर संदर्भ में सम्भवतः वह उस दया को दर्शाता है जो परमेश्वर ने तुम पर की है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ
  choice: उसी प्रकार ... भी
  rationale: यह पिछले कथन के साथ तुलना और निष्कर्ष का संबंध दिखाता है तथा हिन्दी में स्वाभाविक है।
- source_word: οὗτοι
  choice: ये
  rationale: संदर्भ में इस्राएल की ओर संकेत करनेवाले यूनानी संकेतवाचक सर्वनाम का बल बनाए रखता है।
- source_word: νῦν
  choice: अब
  rationale: उद्धार-इतिहास की वर्तमान अवस्था को सूचित करनेवाले कालगत बल को बनाए रखता है; दोनों स्थानों पर इसका अनुवाद किया गया है।
- source_word: ἠπείθησαν
  choice: आज्ञा न माननेवाले हुए हैं
  rationale: ἀπειθέω में अविश्वास और अवज्ञा दोनों का भाव हो सकता है। यह चुनाव व्यापक आज्ञाभंग का भाव बनाए रखता है और इसे केवल बौद्धिक अविश्वास तक सीमित नहीं करता।
- source_word: τῷ ὑμετέρῳ ἐλέει
  choice: तुम पर की गई दया के द्वारा
  rationale: संक्षिप्त यूनानी कर्मकारक पदबंध को संदर्भानुसार परमेश्वर द्वारा गैर-यहूदी पाठकों पर की गई दया के रूप में व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का संबंध सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ αὐτοὶ
  choice: उन पर भी
  rationale: इस्राएल को भी दया में सम्मिलित किए जाने के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐλεηθῶσιν
  choice: दया की जाए
  rationale: यूनानी कर्मवाच्य को बनाए रखता है और दया करनेवाले परमेश्वर को पाठ में अनावश्यक रूप से जोड़ता नहीं है।
theological_decisions:
- issue: क्या ‘तुम्हारी दया’ का अर्थ गैर-यहूदी विश्वासियों द्वारा की गई दया है या परमेश्वर द्वारा उन पर की गई दया
  choice: तुम पर की गई दया के द्वारा
  alternative: तुम्हारी दया के द्वारा
  rationale: रोमियों 11:30–32 में दोनों समूहों की अवज्ञा और परमेश्वर से प्राप्त दया की समानांतर चर्चा संदर्भगत रूप से परमेश्वर द्वारा गैर-यहूदियों पर की गई दया का समर्थन करती है। फिर भी यूनानी पदबंध अधिक शाब्दिक रूप से ‘तुम्हारी दया’ भी समझा जा सकता है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘अवज्ञाकारी’ जैसे अधिक संक्षिप्त पर औपचारिक शब्द के बदले ‘आज्ञा न माननेवाले’ रखा गया है, ताकि विश्वास और आज्ञाकारिता से जुड़े यूनानी भाव की व्यापकता बनी रहे।
