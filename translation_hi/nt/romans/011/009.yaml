  text: καὶ Δαυὶδ λέγει· Γενηθήτω ἡ τράπεζα αὐτῶν εἰς παγίδα καὶ εἰς θήραν καὶ εἰς σκάνδαλον καὶ εἰς ἀνταπόδομα αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/009.yaml
  text: And David says[b][a], “Let their table become a snare and a trap and a stumbling block and a retribution to them,”
translation:
  language: hi
  text: और दाऊद कहते हैं, “उनकी मेज़ उनके लिए फंदा, जाल, ठोकर का कारण और प्रतिफल बन जाए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “फंदा” और “जाल” यहाँ फँसाने वाले साधनों के लिए प्रयुक्त दो निकटार्थक शब्द हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δαυὶδ
  choice: दाऊद
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबल परंपरा में प्रचलित रूप।
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी वर्तमान काल को उद्धरण प्रस्तुत करने वाले साहित्यिक वर्तमान के रूप में रखा गया है।
- source_word: Γενηθήτω
  choice: बन जाए
  rationale: आज्ञार्थक रूप की कामनार्थक/न्याय-आह्वानकारी शक्ति को सीधे बनाए रखता है; इसे केवल भविष्यवाणी नहीं बनाता।
- source_word: τράπεζα
  choice: मेज़
  rationale: ठोस मूल बिंब को बनाए रखा गया है; भोज या भोजन-व्यवस्था की व्याख्या मुख्य पाठ में नहीं जोड़ी गई।
- source_word: παγίδα
  choice: फंदा
  rationale: फँसाने के साधन का स्वाभाविक हिन्दी शब्द और अगले निकटार्थक पद से पर्याप्त भिन्न।
- source_word: θήραν
  choice: जाल
  rationale: शिकार में फँसाने के बिंब को व्यक्त करता है और παγίδα के साथ निकटार्थक युग्म को बनाए रखता है।
- source_word: σκάνδαλον
  choice: ठोकर का कारण
  rationale: गिरावट कराने वाले अवरोध का रूपक सुरक्षित रहता है; केवल भावनात्मक ‘आपत्ति’ का अर्थ नहीं आता।
- source_word: ἀνταπόδομα
  choice: प्रतिफल
  rationale: बदले में मिलने वाले फल या प्रतिदान को व्यक्त करता है और दंडात्मक संदर्भ को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: समूची विधेय-श्रृंखला के साथ स्वाभाविक हिन्दी विन्यास देता है और उस परिणाम का उन पर लागू होना स्पष्ट करता है।
theological_decisions:
- issue: भजन 69:22 से न्याय-आह्वानकारी उद्धरण
  choice: ‘बन जाए’ के द्वारा प्रत्यक्ष कामनार्थक/आज्ञार्थक बल बनाए रखना
  alternative: ‘बन जाएगी’ या ‘बन सकती है’
  rationale: Γενηθήτω को केवल भविष्यवाणी या संभावना में बदलना मूल की तीव्रता को कम कर देता; हिन्दी में ‘बन जाए’ उसका स्वाभाविक समतुल्य है।
- issue: ἀνταπόδομα का दंडात्मक आशय
  choice: प्रतिफल
  alternative: प्रतिशोध / बदला / प्रतिदान
  rationale: संदर्भ न्यायपूर्ण दंड की ओर संकेत करता है, पर शब्द का मूल अर्थ बदले में मिलने वाला फल है; ‘प्रतिफल’ इस अर्थ-सीमा और तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य शैली। ‘मेज़’ का ठोस बिंब, चार समानांतर संज्ञाएँ और न्याय-आह्वान की तीव्रता बनाए रखी गई है। पादटिप्पणी-चिह्न उसी पद-समूह के बाद रखा गया है जिसे वह स्पष्ट करता है।
