source:
  edition: SBLGNT
  text: ὅτι ἐξ αὐτοῦ καὶ δι’ αὐτοῦ καὶ εἰς αὐτὸν τὰ πάντα· αὐτῷ ἡ δόξα εἰς τοὺς αἰῶνας, ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/036.yaml
  text: For from him and through him and to him are all things[a]. To him be the glory forever[b]. Amen.
translation:
  language: hi
  text: क्योंकि सब कुछ उसी से, उसी के द्वारा और उसी के लिए है। महिमा सदा उसी की हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले स्तुति-वचन का आधार बताता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξ αὐτοῦ
  choice: उसी से
  rationale: ἐξ स्रोत या उद्गम को दर्शाता है; ‘उसी से’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: δι’ αὐτοῦ
  choice: उसी के द्वारा
  rationale: διά संबंधकारक के साथ माध्यम अथवा कर्तृत्व व्यक्त करता है; यह अनुवाद उस अर्थ को बनाए रखता है।
- source_word: εἰς αὐτὸν
  choice: उसी के लिए
  rationale: εἰς यहाँ लक्ष्य अथवा परम प्रयोजन की ओर संकेत करता है। ‘उसी के लिए’ हिन्दी में इस प्रयोजनात्मक अर्थ को ‘उसी की ओर’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यह समग्रता को व्यक्त करता है; आधुनिक हिन्दी में ‘सब कुछ’ सहज और व्यापक है।
- source_word: αὐτῷ ἡ δόξα
  choice: महिमा सदा उसी की हो
  rationale: यूनानी वाक्य क्रियारहित स्तुति-अर्पण है; हिन्दी में ‘उसी की हो’ उसके उपासना-संबंधी बल को स्वाभाविक रूप देता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: सदा
  rationale: शाब्दिक अर्थ ‘युगों तक’ है, पर यह अनंत अवधि का मुहावरा है; ‘सदा’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: ἀμήν
  choice: आमीन
  rationale: प्रचलित हिन्दी मसीही प्रयोग में स्वीकृत लिप्यंतरण को रखा गया है।
theological_decisions:
- issue: αὐτοῦ/αὐτόν/αὐτῷ सर्वनामों का संदर्भ
  choice: तीनों स्थानों पर ‘उसी’ रखकर निकटवर्ती संदर्भ में परमेश्वर की ओर संकेत बनाए रखा गया है।
  alternative: हर स्थान पर ‘परमेश्वर’ स्पष्ट रूप से लिखना।
  rationale: रोमियों 11:33–35 में संदर्भ परमेश्वर का है, पर मूल पाठ सर्वनामों की पुनरावृत्ति करता है। ‘उसी’ उस आलंकारिक बल को बचाता है और अनावश्यक व्याख्या नहीं जोड़ता।
- issue: εἰς αὐτόν का लक्ष्य अथवा प्रयोजन
  choice: उसी के लिए
  alternative: उसी की ओर
  rationale: दोनों अर्थगत पक्ष संभव हैं; ‘उसी के लिए’ हिन्दी में सृष्टि के परम लक्ष्य का भाव स्वाभाविक रूप से देता है, बिना उसे अधिक विस्तृत doctrinal कथन में बदलने के।
- issue: αὐτῷ ἡ δόξα का स्तुतिपरक स्वरूप
  choice: महिमा सदा उसी की हो
  alternative: महिमा उसी को मिले
  rationale: ‘उसी की हो’ मूल के क्रियारहित महिमा-अर्पण को गरिमापूर्ण और संक्षिप्त हिन्दी में व्यक्त करता है; ‘मिले’ से उत्पन्न होने वाले अर्जित महिमा के संभावित भाव से भी बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, स्तुतिपरक और गरिमापूर्ण। ‘उसी’ की त्रिक पुनरावृत्ति मूल की लय और बल को बनाए रखती है।
