  yaml_path: translation/nt/romans/011/019.yaml
  text: You will say then, “Branches were broken off so that I might be grafted in.”
translation:
  language: hi
  text: तब तुम कहोगे, “डालियाँ इसलिए तोड़ी गईं कि मैं कलम लगाकर जोड़ा जाऊँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρεῖς
  choice: तुम कहोगे
  rationale: λέγω का भविष्यत् सक्रिय, द्वितीय पुरुष एकवचन रूप है। पौलुस की तर्क-संवाद शैली में एक कल्पित वार्ताकार को किया गया सीधा संबोधन सुरक्षित रखा गया है।
- source_word: οὖν
  choice: तब
  rationale: यह निष्कर्षसूचक अथवा वार्तालाप को आगे बढ़ाने वाला संयोजक है। यहाँ “तब” तर्क की अगली कड़ी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἐξεκλάσθησαν
  choice: तोड़ी गईं
  rationale: ἐκκλάω का अओरिस्ट कर्मवाच्य रूप है। “तोड़ी गईं” जैतून के पेड़ और उसकी डालियों के मूल बागवानी रूपक को बनाए रखता है।
- source_word: κλάδοι
  choice: डालियाँ
  rationale: पेड़ के रूपक में κλάδοι का सीधा और सामान्य आधुनिक हिन्दी पर्याय “डालियाँ” है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ ἵνα उद्देश्य अथवा अभिप्रेत परिणाम प्रस्तुत करता है। “इसलिए ... कि” स्रोत में व्यक्त दावे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγὼ
  choice: मुझे
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है। हिन्दी की कर्मवाच्य रचना में “मुझे” वक्ता को प्रमुखता देते हुए स्वाभाविक है।
- source_word: ἐγκεντρισθῶ
  choice: कलम लगाकर जोड़ दिया जाए
  rationale: ἐγκεντρίζω का अओरिस्ट कर्मवाच्य संभावनार्थक रूप है और पेड़ में कलम लगाने का अर्थ देता है। यह वाक्यांश बागवानी रूपक तथा कर्मवाच्य, दोनों को स्पष्ट और सामान्य हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या यह स्पष्ट किया जाए कि बोलने वाला पौलुस के तर्क का कल्पित वार्ताकार है
  choice: मुख्य पाठ में बिना व्याख्यात्मक जोड़ के सीधे द्वितीय पुरुष संबोधन को बनाए रखा गया
  alternative: “तब कोई कहेगा” अथवा “तुम शायद कहोगे”
  rationale: यूनानी पाठ सीधे “तुम कहोगे” कहता है। “कोई” जोड़ना या भविष्यत् रूप को संभावना में बदलना स्रोत से आगे बढ़ेगा।
- issue: क्या उद्देश्य-वाक्य को परमेश्वर के अभिप्राय के विषय में प्रत्यक्ष धर्मवैज्ञानिक घोषणा बनाया जाए
  choice: वार्ताकार के कथन को ज्यों का त्यों उद्देश्यसूचक रूप में रखा गया
  alternative: “ताकि परमेश्वर मुझे कलम लगाकर जोड़ सके”
  rationale: यह कल्पित गैर-यहूदी वक्ता का निष्कर्ष है, आवश्यक रूप से पौलुस द्वारा अनुमोदित धर्मवैज्ञानिक व्याख्या नहीं। स्रोत में “परमेश्वर” कर्ता के रूप में नहीं है, इसलिए उसे जोड़ा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। “कलम लगाकर जोड़ना” भारतीय हिन्दी में बागवानी की क्रिया को स्पष्ट करता है; किसी सम्प्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
