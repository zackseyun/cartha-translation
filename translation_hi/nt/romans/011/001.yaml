id: ROM.11.1
reference: Romans 11:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγω οὖν, μὴ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ; μὴ γένοιτο· καὶ γὰρ ἐγὼ Ἰσραηλίτης εἰμί, ἐκ σπέρματος Ἀβραάμ, φυλῆς Βενιαμίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/001.yaml
  text: So I ask[a], has God rejected his people? May it never be! For I myself am an Israelite, from the offspring of Abraham[c][b], of the tribe of Benjamin.
translation:
  language: hi
  text: 'इसलिए मैं पूछता हूँ: क्या परमेश्वर ने अपनी प्रजा को ठुकरा दिया है?[a] कदापि नहीं![b] क्योंकि मैं स्वयं भी एक इस्राएली हूँ—अब्राहम के वंश से, बिन्यामीन के गोत्र का।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “त्याग दिया है?”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यह अत्यंत प्रबल खंडन की अभिव्यक्ति है; इसका अनुवाद “बिलकुल नहीं!” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अब्राहम के बीज से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Λέγω οὖν
  choice: इसलिए मैं पूछता हूँ
  rationale: λέγω यहाँ आलंकारिक प्रश्न का परिचय देता है और οὖν पिछले तर्क से निष्कर्षात्मक संबंध जोड़ता है; यह हिंदी में स्वाभाविक रूप से दोनों बातों को व्यक्त करता है।
- source_word: μὴ ἀπώσατο
  choice: क्या ... ठुकरा दिया है
  rationale: ἀπωθέομαι अस्वीकार या दूर कर देने का भाव रखता है। प्रश्न में μή नकारात्मक उत्तर की अपेक्षा करता है, पर उसे प्रश्न के अनुवाद में अलग से जोड़ना हिंदी में अस्वाभाविक होता।
- source_word: τὸν λαὸν αὐτοῦ
  choice: अपनी प्रजा
  rationale: λαός यहाँ परमेश्वर से संबंधित सामुदायिक और वाचागत पहचान रखता है; 'अपनी प्रजा' आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: यह साधारण नकार से अधिक प्रबल खंडन है। 'कदापि नहीं' संक्षिप्त, प्रबल और प्रतिष्ठित हिंदी अभिव्यक्ति है।
- source_word: καὶ γὰρ ἐγὼ
  choice: क्योंकि मैं स्वयं भी
  rationale: γάρ कारण प्रस्तुत करता है, καί का समावेशी बल 'भी' से और बलाघाती ἐγώ का भाव 'स्वयं' से व्यक्त होता है।
- source_word: Ἰσραηλίτης
  choice: एक इस्राएली
  rationale: जातीय और वाचागत पहचान का सीधा, प्रचलित हिंदी रूप।
- source_word: ἐκ σπέρματος Ἀβραάμ
  choice: अब्राहम के वंश
  rationale: σπέρμα का शाब्दिक अर्थ 'बीज' है, किंतु वंशावली के संदर्भ में 'वंश' स्वाभाविक हिंदी है और संतान/वंशज का आशय सुरक्षित रखता है।
- source_word: φυλῆς Βενιαμίν
  choice: बिन्यामीन के गोत्र का
  rationale: φυλή के लिए 'गोत्र' बाइबलीय इस्राएली जनजातीय विभाजन का सुविज्ञात और संक्षिप्त हिंदी रूप है।
theological_decisions:
- issue: क्या प्रश्न जातीय इस्राएल के पूर्ण या स्थायी परित्याग को स्पष्ट रूप से व्यक्त करता है
  choice: '''क्या परमेश्वर ने अपनी प्रजा को ठुकरा दिया है?''—बिना ''पूरी तरह'' या ''सदा के लिए'' जोड़े'
  alternative: '''क्या परमेश्वर ने अपनी प्रजा को सदा के लिए/पूरी तरह ठुकरा दिया है?'''
  rationale: यूनानी पाठ में 'पूरी तरह' या 'सदा के लिए' जैसा कोई क्रियाविशेषण नहीं है। पद को अपने संदर्भ में प्रश्न का दायरा विकसित करने देना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। 'कदापि नहीं' प्रबल पौलुसी खंडन को बनाए रखता है; वंशावली संबंधों को हिंदी में सुबोध बनाने के लिए डैश का प्रयोग किया गया है।
