id: ROM.11.32
reference: Romans 11:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: συνέκλεισεν γὰρ ὁ θεὸς τοὺς πάντας εἰς ἀπείθειαν ἵνα τοὺς πάντας ἐλεήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/032.yaml
  text: For God has shut up all into disobedience[c][b][a], so that he may show mercy to all.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने सबको[c] अवज्ञा में बन्द कर दिया है[a][b], ताकि वह सब पर दया करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सबको अवज्ञा के अधीन कर दिया’ अथवा ‘सबको अवज्ञा में सीमित कर दिया’।
    reason: lexical_alternative
  - marker: b
    text: कुछ सन्दर्भों में ‘अवज्ञा’ का अनुवाद ‘अविश्वास’ भी हो सकता है, पर यहाँ आज्ञा न मानने या मानने से इनकार करने का व्यापक अर्थ अधिक सम्भावित है।
    reason: lexical_alternative
  - marker: c
    text: मूल पाठ दोनों स्थानों पर ‘सब’ दोहराता है। इसका दायरा अनुवाद में समय से पहले सीमित नहीं किया गया है; सन्दर्भ में पौलुस यहूदियों और गैर-यहूदियों को साथ लेकर चर्चा कर रहा है।
    reason: alternative_reading
lexical_decisions:
- source_word: συνέκλεισεν
  choice: बन्द कर दिया है
  rationale: यह συγκλείω के घेरकर बन्द करने या सीमित कर देने के रूपक को बनाए रखता है। पूर्ण की गई क्रिया और उसकी वर्तमान प्रासंगिकता व्यक्त करने के लिए हिन्दी में ‘कर दिया है’ स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस तर्क-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοὺς πάντας
  choice: सबको / सब पर
  rationale: दोनों स्थानों पर πάντας की व्यापकता और पौलुस की समानान्तर पुनरावृत्ति सुरक्षित रखी गई है। कारक के अनुसार ‘सबको’ और ‘सब पर’ का प्रयोग हुआ है, पर दायरा संकीर्ण नहीं किया गया।
- source_word: εἰς ἀπείθειαν
  choice: अवज्ञा में
  rationale: ‘अवज्ञा’ ἀπείθεια के आज्ञा न मानने वाले व्यापक अर्थ को व्यक्त करता है; ‘में’ εἰς के दिशा या परिणति के भाव को यथासम्भव बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: ‘ताकि’ उद्देश्य या अभिप्रेत परिणाम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐλεήσῃ
  choice: दया करे
  rationale: यह ἐλεέω की क्रियात्मकता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है। यहाँ संभाव्यता नहीं, बल्कि ἵνα के साथ उद्देश्य व्यक्त हो रहा है।
theological_decisions:
- issue: दोनों उपवाक्यों में ‘सब’ का दायरा
  choice: दोनों बार व्यापक ‘सब’ रखा गया है और पहले प्रयोग पर व्याख्यात्मक पादटिप्पणी दी गई है।
  alternative: ‘सब लोगों’, ‘हर एक’, या स्पष्ट रूप से ‘यहूदियों और गैर-यहूदियों दोनों’ कहना।
  rationale: यूनानी पाठ दोनों उपवाक्यों में वही व्यापक पद दोहराता है। सन्दर्भ में यहूदी और गैर-यहूदी दोनों सामने हैं, पर अनुवाद को उद्धार के दायरे से जुड़ी बहस का समय से पहले निर्णय नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बन्द कर दिया है’ मूल रूपक को बनाए रखता है, जबकि ‘अवज्ञा’ धार्मिक तकनीकी शब्दावली से बचते हुए ἀπείθεια का व्यापक नैतिक और संबंधपरक भाव व्यक्त करता है।
