id: ROM.11.33
reference: Romans 11:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὦ βάθος πλούτου καὶ σοφίας καὶ γνώσεως θεοῦ· ὡς ἀνεξεραύνητα τὰ κρίματα αὐτοῦ καὶ ἀνεξιχνίαστοι αἱ ὁδοὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/033.yaml
  text: Oh[b][a], the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and untraceable his ways!
translation:
  language: hi
  text: आह, परमेश्वर की समृद्धि, बुद्धि और ज्ञान की गहराई[a]! उसके निर्णय कितने खोज से परे हैं, और उसके मार्गों का पता लगाना कितना असंभव है[b]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “आह, परमेश्वर की बुद्धि और ज्ञान की समृद्धि की गहराई!” यूनानी वाक्य-विन्यास में ‘समृद्धि’ को ‘बुद्धि और ज्ञान’ के साथ अधिक निकटता से जोड़ना संभव है।'
    reason: alternative_reading
  - marker: b
    text: 'यहाँ प्रयुक्त यूनानी शब्द का भाव है: ऐसा जिसका सुराग लगाकर या पदचिह्नों का अनुसरण करके पता न लगाया जा सके।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὦ
  choice: आह
  rationale: यह विस्मय और स्तुति व्यक्त करने वाला उद्गार है; ‘आह’ आधुनिक हिन्दी में इसकी भावात्मक शक्ति बनाए रखता है।
- source_word: βάθος
  choice: गहराई
  rationale: यहाँ परमेश्वर की समृद्धि, बुद्धि और ज्ञान की अथाह गहनता के लिए रूपक है।
- source_word: πλούτου
  choice: समृद्धि
  rationale: यह विकल्प धन मात्र के बजाय प्रचुरता और वैभव के व्यापक अर्थ को व्यक्त करता है।
- source_word: σοφίας
  choice: बुद्धि
  rationale: यह परमेश्वर की विवेकपूर्ण योजना और कार्य-पद्धति को सूचित करने वाला स्वाभाविक हिन्दी पद है।
- source_word: γνώσεως
  choice: ज्ञान
  rationale: स्रोत में यह ‘बुद्धि’ से अलग संज्ञा है, इसलिए इसे स्वतंत्र रूप से रखा गया है।
- source_word: ἀνεξεραύνητα
  choice: अगम
  rationale: यह उन निर्णयों को व्यक्त करता है जिनकी पूरी तरह खोज या छानबीन नहीं की जा सकती।
- source_word: κρίματα
  choice: निर्णय
  rationale: κρίματα न्यायिक फैसलों से लेकर परमेश्वर के ठहरावों तक व्यापक अर्थ रखता है; ‘निर्णय’ इस संदर्भ में स्पष्ट और अनावश्यक रूप से संकीर्ण नहीं है।
- source_word: ἀνεξιχνίαστοι
  choice: अथाह
  rationale: शब्द का मूल भाव ऐसे मार्गों का है जिनका सुराग लगाकर अंत तक पता नहीं लगाया जा सकता; सहज हिन्दी में ‘अथाह’ इस अगम्यता को व्यक्त करता है, जबकि पदटिप्पणी अनुरेखण की विशिष्ट छवि बताती है।
- source_word: ὁδοὶ
  choice: मार्ग
  rationale: यह परमेश्वर के कार्य करने के ढंग और कार्य-क्रम के लिए प्रयुक्त बाइबिलीय रूपक को बनाए रखता है।
theological_decisions:
- issue: θεοῦ का ‘समृद्धि’, ‘बुद्धि’ और ‘ज्ञान’ से संबंध
  choice: मुख्य पाठ में ‘परमेश्वर की’ को तीनों संज्ञाओं से संबंधित माना गया है।
  alternative: ‘परमेश्वर की बुद्धि और ज्ञान की समृद्धि की गहराई’—अर्थात ‘समृद्धि’ को बाद की दोनों संज्ञाओं से अधिक निकटता से जोड़ना।
  rationale: यूनानी वाक्य-विन्यास दोनों संबंधों की संभावना देता है। संदर्भ और स्तुतिपरक त्रयी को देखते हुए मुख्य पाठ तीनों गुणों को परमेश्वर से जोड़ता है, पर वास्तविक अस्पष्टता पदटिप्पणी में सुरक्षित है।
- issue: ἀνεξεραύνητα और ἀνεξιχνίαστοι के बीच भेद
  choice: मुख्य पाठ में ‘अगम’ और ‘अथाह’ रखा गया है तथा दूसरे शब्द की ‘सुराग लगाकर पता करने’ वाली छवि पदटिप्पणी में स्पष्ट की गई है।
  alternative: दोनों के लिए एक ही या लगभग समान शब्द, जैसे ‘अगम’ और ‘अगम्य’, रखना।
  rationale: यूनानी में दो संबंधित किंतु भिन्न विशेषण हैं; हिन्दी में अर्थ-स्पष्टता और काव्यात्मक प्रवाह रखते हुए उनके भेद को पूरी तरह मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और स्तुतिपरक रखी गई है। ‘आह’ विस्मय को, तथा समानांतर ‘कितने...कितने...’ यूनानी वाक्य की लय को व्यक्त करता है। दोनों पदटिप्पणी-चिह्न संबंधित मुख्य पाठ के अंत में दिए गए हैं।
