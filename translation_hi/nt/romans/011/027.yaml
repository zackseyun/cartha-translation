  text: καὶ αὕτη αὐτοῖς ἡ παρ’ ἐμοῦ διαθήκη, ὅταν ἀφέλωμαι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/027.yaml
  text: And this will be my covenant with them[a], when I take away their sins.
translation:
  language: hi
  text: और उनके साथ मेरी वाचा[a] यह होगी, जब मैं उनके पापों को दूर कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मेरी ओर से उनके लिए वाचा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: वाचा
  rationale: पौलुस के शास्त्रीय उद्धरण के संदर्भ में यह शब्द परमेश्वर की बंधनकारी प्रतिज्ञा और वाचागत संबंध को व्यक्त करता है; ‘वाचा’ पुराने नियम की पृष्ठभूमि और धर्मवैज्ञानिक अर्थ को सुरक्षित रखता है।
- source_word: ἡ παρ’ ἐμοῦ διαθήκη
  choice: मेरी वाचा
  rationale: यूनानी पदबंध का अधिक शाब्दिक अर्थ ‘मेरी ओर से वाचा’ है। स्वाभाविक हिन्दी में ‘मेरी वाचा’ उसके परमेश्वर से उद्गम और उसके संबंध—दोनों को संक्षेप में व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उनके साथ
  rationale: यद्यपि यह रूप व्याकरणतः ‘उन्हें/उनके लिए’ हो सकता है, हिन्दी में वाचा के संबंध को स्वाभाविक रूप से ‘उनके साथ’ कहा जाता है।
- source_word: ὅταν
  choice: जब
  rationale: यहाँ यह भविष्य की प्रतिज्ञा के पूरा होने का समय बताता है, बार-बार होने वाली अनिश्चित घटना नहीं; इसलिए ‘जब’ उपयुक्त है।
- source_word: ἀφέλωμαι
  choice: दूर कर दूँगा
  rationale: पापों को हटाने के अर्थ में यह सहज, स्पष्ट और गरिमापूर्ण हिन्दी है; भविष्यकाल संदर्भ की भविष्यसूचक प्रतिज्ञा को व्यक्त करता है।
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: उनके पापों को
  rationale: यह बहुवचन संज्ञा और संबंधसूचक सर्वनाम का सीधा, स्वाभाविक अनुवाद है।
- source_word: καὶ αὕτη
  choice: और ... यह होगी
  rationale: यूनानी में क्रिया अध्याहृत है। भविष्यसूचक संदर्भ के कारण हिन्दी में ‘होगी’ जोड़ना वाक्य को पूर्ण और स्वाभाविक बनाता है, बिना समय को आवश्यकता से अधिक निश्चित किए।
theological_decisions:
- issue: भविष्यसूचक उद्धरण में διαθήκη का स्वरूप
  choice: वाचा
  alternative: वसीयतनामा; समझौता
  rationale: यह पद इस्राएल से संबंधित भविष्यसूचक प्रतिज्ञा और परमेश्वर द्वारा पाप हटाए जाने की शास्त्रीय पृष्ठभूमि में है। ‘वाचा’ इस अंतर्पाठीय और धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: ὅταν ἀφέλωμαι का कालगत बल
  choice: जब मैं उनके पापों को दूर कर दूँगा
  alternative: जब-जब मैं उनके पापों को दूर करूँ
  rationale: संदर्भ एक सुनिश्चित भविष्यसूचक कार्य की ओर संकेत करता है, किसी बार-बार दोहराई जाने वाली सामान्य शर्त की ओर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘वाचा’ बाइबलीय संदर्भ के लिए आवश्यक पारिभाषिक भार रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज रखा गया है।
