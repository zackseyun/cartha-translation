  text: εἰ δὲ ἡ ἀπαρχὴ ἁγία, καὶ τὸ φύραμα· καὶ εἰ ἡ ῥίζα ἁγία, καὶ οἱ κλάδοι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/016.yaml
  text: If the firstfruits are holy[a], so is the whole batch of dough; and if the root is holy, so are the branches.
translation:
  language: hi
  text: यदि पहला अंश पवित्र है, तो आटे का सारा लोथा भी पवित्र है[a]; और यदि जड़ पवित्र है, तो डालियाँ भी पवित्र हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ आटे का लोथा या मिश्रण है।
    reason: φύραμα के अर्थ-क्षेत्र को स्पष्ट करने वाला शब्दार्थ-संबंधी विकल्प।
lexical_decisions:
- source_word: ἀπαρχὴ
  choice: पहला अंश
  rationale: यह उस पहले भाग को दर्शाता है जो परमेश्वर को अर्पित किया जाता था। यहाँ आटे के रूपक के साथ यह ‘पहली उपज’ की अपेक्षा अधिक स्वाभाविक है और अर्पण-संबंधी अर्थ भी बनाए रखता है।
- source_word: ἁγία
  choice: पवित्र
  rationale: यह बाइबलीय श्रेणी को बनाए रखता है और दोनों समानांतर कथनों में स्वाभाविक है; पद स्वयं पवित्रता के स्वरूप को और स्पष्ट नहीं करता।
- source_word: φύραμα
  choice: गूँधे हुए आटे का पूरा लोथा
  rationale: यूनानी शब्द गूँधे हुए आटे के मिश्रण या लोथे को दर्शाता है। इस रूप में पहले अंश और पूरे आटे का संबंध आधुनिक हिन्दी पाठक के लिए स्पष्ट रहता है।
- source_word: ῥίζα
  choice: जड़
  rationale: आगे आने वाले जैतून के पेड़ के रूपक के अनुरूप सीधा और स्वाभाविक वनस्पति-संबंधी शब्द।
- source_word: κλάδοι
  choice: डालियाँ
  rationale: पेड़ के रूपक में सामान्य और सहज हिन्दी; बहुवचन को बनाए रखता है।
- source_word: εἰ δὲ ... καὶ ...; καὶ εἰ ... καὶ ...
  choice: यदि ... तो ... भी; और यदि ... तो ... भी
  rationale: यूनानी में उत्तरवर्ती खंडों की लुप्त क्रिया को हिन्दी में दोहराकर संक्षिप्त तर्क और समानांतर रचना स्पष्ट की गई है। δέ को अलग से ‘अब’ नहीं बनाया गया, क्योंकि यहाँ वह हल्का संयोजक है।
theological_decisions:
- issue: पहले अंश/जड़ से पूरे आटे/डालियों तक पवित्रता का संबंध
  choice: हर स्थान पर केवल ‘पवित्र’ कहा गया है, बिना यह निर्धारित किए कि यह पवित्रता वाचा-संबंधी, प्रतिनिधिक या उद्धार-संबंधी है।
  alternative: ‘समर्पित’, ‘अलग किया हुआ’ या उद्धार-संबंधी अर्थ को स्पष्ट करना।
  rationale: पौलुस का रूपक व्युत्पन्न संबंध दिखाता है, पर इस पद में पवित्रता का ठीक स्वरूप परिभाषित नहीं होता; इसलिए धार्मिक तनाव और अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘लोथा’ रूपक की ठोस छवि रखता है, जबकि ‘गूँधे हुए आटे का पूरा’ उसके अर्थ को तुरंत स्पष्ट करता है।
