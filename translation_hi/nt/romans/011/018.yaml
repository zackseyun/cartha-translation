source:
  edition: SBLGNT
  text: μὴ κατακαυχῶ τῶν κλάδων· εἰ δὲ κατακαυχᾶσαι, οὐ σὺ τὴν ῥίζαν βαστάζεις ἀλλὰ ἡ ῥίζα σέ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/018.yaml
  text: do not boast over the branches[a]. But if you do boast, it is not you who support the root[b], but the root supports you.
translation:
  language: hi
  text: डालियों पर घमंड न करो।[a] पर यदि तुम घमंड करते हो, तो तुम जड़ को सहारा नहीं देते, बल्कि जड़ तुम्हें सहारा देती है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “डालियों के विरुद्ध घमंड न करो।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम जड़ को थामे नहीं रखते, बल्कि जड़ तुम्हें थामे रखती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κατακαυχῶ / κατακαυχᾶσαι
  choice: पर घमण्ड न करो / यदि तुम घमण्ड करते हो
  rationale: क्रिया में किसी के विरुद्ध या अपने को उससे श्रेष्ठ मानकर घमण्ड करने का भाव है। ‘पर घमण्ड’ जैतून के वृक्ष के रूपक और संबंधगत श्रेष्ठता, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: κλάδων
  choice: उन डालियों
  rationale: निश्चित पदबंध संदर्भ में पहले से उल्लिखित खास डालियों की ओर संकेत करता है; ‘उन’ यह संदर्भ स्पष्ट करता है।
- source_word: ῥίζαν / ῥίζα
  choice: जड़
  rationale: दोनों स्थानों पर एक ही शब्द रखकर वृक्ष के स्रोत और आश्रय का रूपक सुरक्षित रखा गया है।
- source_word: βαστάζεις
  choice: सँभालते / सँभालती है
  rationale: यहाँ क्रिया केवल उठाने नहीं, बल्कि टिकाए रखने और सहारा देने का अर्थ रखती है। ‘सँभालना’ आधुनिक हिन्दी में यह आश्रय-संबंध स्पष्ट करता है और रूपक से जुड़ा रहता है।
- source_word: οὐ σὺ ... ἀλλὰ ἡ ῥίζα σέ
  choice: तुम जड़ को नहीं सँभालते, बल्कि जड़ तुम्हें सँभालती है
  rationale: ‘तुम’ और ‘जड़’ के स्पष्ट विरोध तथा निर्भरता के उलटाव को सुरक्षित रखा गया है।
- source_word: μὴ
  choice: न करो
  rationale: वर्तमान आज्ञार्थक के निषेध को बिना उसके पक्ष को अधिक व्याख्यायित किए स्वाभाविक प्रत्यक्ष मनाही के रूप में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के जैतून-वृक्ष रूपक में जड़ और डालियों की पहचान
  choice: मुख्य पाठ में जड़ और डालियों का रूपक बिना उनकी पहचान स्पष्ट किए बनाए रखा गया है।
  alternative: जड़ की पहचान कुलपिताओं, अब्राहम या वाचा की प्रतिज्ञाओं के रूप में अनुवाद में ही कर देना।
  rationale: यूनानी पाठ यहाँ केवल रूपक प्रस्तुत करता है। अधिक विशिष्ट पहचान जोड़ने से व्याख्या पाठ में आ जाएगी और संदर्भ में बनी धर्मवैचारिक खुली जगह समाप्त हो जाएगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘डालियाँ’ और ‘जड़’ से जैतून-वृक्ष का रूपक स्पष्ट रहता है; ‘सँभालना’ आश्रय और टिकाए रखने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
