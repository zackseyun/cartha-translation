source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει αὐτῷ ὁ χρηματισμός; Κατέλιπον ἐμαυτῷ ἑπτακισχιλίους ἄνδρας, οἵτινες οὐκ ἔκαμψαν γόνυ τῇ Βάαλ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/004.yaml
  text: But what does the divine response say to him? “I have kept for myself seven thousand men[b][a], who have not bent the knee to Baal.”
translation:
  language: hi
  text: परन्तु परमेश्वर का उत्तर उसे क्या कहता है? “मैंने अपने लिए सात हज़ार पुरुषों को बचाए रखा है[a], जिन्होंने बाल के आगे घुटना नहीं टेका।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने लिए अलग रख छोड़ा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: χρηματισμός
  choice: परमेश्वर का उत्तर
  rationale: संदर्भ में यह एलिय्याह को दिया गया परमेश्वर का अधिकारपूर्ण उत्तर है। यह हिन्दी में स्वाभाविक है और दैवी स्रोत को स्पष्ट करता है।
- source_word: Κατέλιπον
  choice: मैंने ... बचाए रखा है
  rationale: यह पूर्ण की गई उस क्रिया और उसके वर्तमान परिणाम—बचे हुए समुदाय—दोनों को व्यक्त करता है।
- source_word: ἐμαυτῷ
  choice: अपने लिए
  rationale: आत्मवाचक सम्प्रदान का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἑπτακισχιλίους ἄνδρας
  choice: सात हज़ार पुरुषों
  rationale: यूनानी पाठ में विशेष रूप से पुल्लिंग संज्ञा ἄνδρας है, इसलिए इसे सामान्य 'लोगों' से निरपेक्ष नहीं किया गया।
- source_word: οὐκ ἔκαμψαν γόνυ
  choice: घुटना नहीं टेका
  rationale: मूल उपासना और अधीनता की सजीव अभिव्यक्ति को स्वाभाविक हिन्दी मुहावरे में बनाए रखता है।
- source_word: τῇ Βάαλ
  choice: बाल के आगे
  rationale: बाल देवता का व्यक्तिवाचक नाम है; 'के आगे घुटना टेकना' हिन्दी में उपासना-संबंधी समर्पण को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: उद्धरण के उत्तरदाता को परमेश्वर के रूप में स्पष्ट करना
  choice: परमेश्वर का उत्तर
  alternative: दैवी वाणी; उत्तर
  rationale: संदर्भ और 1 राजा 19 की पृष्ठभूमि बताते हैं कि उत्तर परमेश्वर से है; इसे स्पष्ट करना χρηματισμός के आशय को व्यक्त करता है, कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: ἄνδρας का लिंग-सटीक अनुवाद
  choice: पुरुषों
  alternative: लोगों
  rationale: मूल पाठ विशिष्ट पुल्लिंग शब्द का प्रयोग करता है, इसलिए उसका रूप सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘परमेश्वर का उत्तर’ तकनीकी ‘दैवी वाणी’ की अपेक्षा अधिक स्वाभाविक है; ‘घुटना नहीं टेका’ मूल बिंब और उपासना-संबंधी अर्थ दोनों बनाए रखता है।
