source:
  edition: SBLGNT
  text: οὐκ ἀπώσατο ὁ θεὸς τὸν λαὸν αὐτοῦ ὃν προέγνω. ἢ οὐκ οἴδατε ἐν Ἠλίᾳ τί λέγει ἡ γραφή, ὡς ἐντυγχάνει τῷ θεῷ κατὰ τοῦ ⸀Ἰσραήλ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/002.yaml
  text: God has not rejected his people[a], whom he foreknew. Or do you not know what the Scripture says in the passage about Elijah[c][b], how he appeals to God against Israel?
translation:
  language: hi
  text: परमेश्वर ने अपनी उस प्रजा को अस्वीकार नहीं किया, जिसे वह पहले से जानता था। या क्या तुम नहीं जानते कि एलिय्याह के विषय वाले अंश में पवित्रशास्त्र क्या कहता है—कि वह किस प्रकार इस्राएल के विरुद्ध परमेश्वर से विनती करता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह किस प्रकार इस्राएल के विरुद्ध परमेश्वर से फरियाद करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπώσατο
  choice: अस्वीकार नहीं किया
  rationale: इस प्रसंग में क्रिया का अर्थ ठुकराना या त्याग देना है। ‘अस्वीकार’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: λαὸν αὐτοῦ
  choice: अपनी ... प्रजा
  rationale: ‘प्रजा’ परमेश्वर से संबंधित सामूहिक और वाचा-संबंधी भाव को सहज हिन्दी में व्यक्त करती है; पहले उपवाक्य में ‘इस्राएल’ जोड़ने से बचा गया है।
- source_word: προέγνω
  choice: पहले से जाना था
  rationale: यह मूल क्रिया के ‘पहले से जानना’ अर्थ को बनाए रखता है और इसे ‘पहले से चुनना’ बनाकर धर्मवैज्ञानिक विवाद का निर्णय नहीं करता।
- source_word: ἢ οὐκ οἴδατε
  choice: क्या तुम नहीं जानते
  rationale: यह पौलुस के आलंकारिक प्रश्न का स्वाभाविक हिन्दी रूप है; आरम्भिक ἤ को हिन्दी प्रवाह में पृथक ‘या’ के बिना व्यक्त किया गया है।
- source_word: ἐν Ἠλίᾳ
  choice: एलिय्याह के विषय वाले अंश में
  rationale: यूनानी मुहावरा पवित्रशास्त्र में एलिय्याह से संबंधित अंश को दर्शाता है, न कि स्थानगत अर्थ ‘एलिय्याह में’।
- source_word: ἡ γραφή
  choice: पवित्रशास्त्र
  rationale: पौलुस के प्रयोग में यह पवित्र लेख को सूचित करता है; ‘पवित्रशास्त्र’ हिन्दी बाइबलीय भाषा में स्पष्ट और परिचित है।
- source_word: ὡς ἐντυγχάνει τῷ θεῷ
  choice: कि वह किस प्रकार ... परमेश्वर से विनती करता है
  rationale: क्रिया निवेदन या विनती करने का अर्थ दे सकती है। अगले विरोधात्मक वाक्यांश के कारण ऐसा शब्द चुना गया है जो सकारात्मक मध्यस्थता अनिवार्य न करे।
- source_word: κατὰ τοῦ Ἰσραήλ
  choice: इस्राएल के विरुद्ध
  rationale: यहाँ κατά संबंधकारक के साथ विरोधात्मक अर्थ देता है; इस्राएल का नाम यथावत रखा गया है।
theological_decisions:
- issue: προέγνω का ईश्वरीय चुनाव से संबंध
  choice: पहले से जाना था
  alternative: पहले से चुना था / पहले से प्रेम किया था
  rationale: मूल शब्द पूर्वज्ञान व्यक्त करता है, पर इस स्थान पर अनुवाद में उसे किसी विशिष्ट चुनाव-सिद्धांत के अर्थ में सीमित करना उचित नहीं। यह रूप वास्तविक धर्मवैज्ञानिक तनाव को खुला रखता है।
- issue: ἐντυγχάνει का भाव
  choice: विनती करता है
  alternative: फरियाद करता है / निवेदन करता है
  rationale: क्रिया का भाव परमेश्वर के समक्ष आग्रह रखने का है। ‘विनती’ संदर्भ में स्वाभाविक है, जबकि ‘मध्यस्थता’ इस्राएल के पक्ष में सकारात्मक निवेदन का भ्रामक संकेत दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, मध्यम औपचारिक और सार्वजनिक पाठ के अनुकूल। ‘प्रजा’, ‘पवित्रशास्त्र’ और ‘इस्राएल’ परिचित बाइबलीय शब्दावली हैं। वाक्यरचना को स्वाभाविक रखते हुए मूल के आलंकारिक प्रश्न और धर्मवैज्ञानिक अस्पष्टता को सुरक्षित रखा गया है।
