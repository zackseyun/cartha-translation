- source_word: τοῦτο οὐκ ἐπέτυχεν
  choice: वह उसे नहीं मिली
  rationale: प्राप्ति में असफलता को सहज हिन्दी में व्यक्त करता है; अगली उपवाक्य में उसी क्रिया-संबंधी विरोध को दोहराया गया है।
- source_word: ἡ δὲ ἐκλογὴ
  choice: पर चुने हुए लोगों को
  rationale: ἐκλογή का शाब्दिक अर्थ ‘चुनाव/चयन’ है, पर ‘बाकी लोग’ के साथ विरोध यहाँ चुने हुए व्यक्तियों की ओर संकेत करता है।
- source_word: ἐπέτυχεν
  choice: वह मिल गई
  rationale: पहले उपवाक्य के ‘नहीं मिली’ को दोहराकर यूनानी पाठ का अलंकारिक विरोध सुरक्षित रखता है।
- source_word: οἱ δὲ λοιποὶ
  choice: और बाकी लोग
  rationale: चुने हुए लोगों से भिन्न शेष समूह का संक्षिप्त और स्वाभाविक अनुवाद।
- source_word: ἐπωρώθησαν
  choice: कठोर कर दिए गए
  rationale: यूनानी कर्मवाच्य और कठोरता के रूपक को बनाए रखता है, जबकि कर्ता को अनिर्दिष्ट छोड़ता है।
