  text: τί οὖν; ὃ ἐπιζητεῖ Ἰσραήλ, τοῦτο οὐκ ἐπέτυχεν, ἡ δὲ ἐκλογὴ ἐπέτυχεν· οἱ δὲ λοιποὶ ἐπωρώθησαν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/007.yaml
  text: What then? Israel did not obtain what it seeks[a], but the elect obtained it, and the rest were hardened[b],
translation:
  language: hi
  text: तो फिर क्या? इस्राएल जिस चीज़ की खोज कर रहा है, उसे वह प्राप्त नहीं कर सका; पर चुने हुए लोगों ने उसे प्राप्त किया[a], और बाकी लोग कठोर कर दिए गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पर चुनाव/चयन ने उसे प्राप्त किया।” यूनानी शब्द का अर्थ “चुनाव” या “चयन” है, पर यहाँ संभवतः उससे चुने हुए लोग अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “संवेदनहीन कर दिए गए।” इस क्रिया का अर्थ कठोर या आत्मिक रूप से असंवेदनशील कर दिया जाना हो सकता है; यहाँ कर्ता नहीं बताया गया है।
    reason: lexical_alternative
