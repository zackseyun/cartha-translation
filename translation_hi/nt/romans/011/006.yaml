  yaml_path: translation/nt/romans/011/006.yaml
  text: But if by grace, it is no longer from works; otherwise grace no longer becomes grace.
translation:
  language: hi
  text: पर यदि यह अनुग्रह से है, तो फिर कर्मों से नहीं; नहीं तो अनुग्रह, अनुग्रह नहीं बनता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριτι
  choice: अनुग्रह से
  rationale: भाववाचक संज्ञा और साधन/आधार के अर्थ को बनाए रखता है; पौलुस की शब्दावली के अनुरूप स्वाभाविक हिन्दी है।
- source_word: ἐξ ἔργων
  choice: कर्मों से
  rationale: ἐξ के स्रोत अथवा आधार के भाव को ‘से’ व्यक्त करता है और ἔργων का व्यापक अर्थ खुला रखता है।
- source_word: γίνεται
  choice: रहता
  rationale: शाब्दिक ‘बनता’ हिन्दी में अस्वाभाविक और भ्रमकारी हो सकता है। ‘अनुग्रह नहीं रहता’ उसी तर्क को स्वाभाविक ढंग से व्यक्त करता है कि कर्मों पर आधारित होने पर वह अनुग्रह के रूप में अस्तित्व नहीं रखता।
theological_decisions:
- issue: अनुग्रह और कर्मों के बीच विरोध
  choice: वाक्य के स्पष्ट परस्पर-विरोध को बिना किसी अतिरिक्त धार्मिक व्याख्या के बनाए रखा गया है।
  alternative: ‘कमाए हुए कामों’ या ‘व्यवस्था के कामों’ जैसे अधिक विशिष्ट पद जोड़ना।
  rationale: मूल में केवल ἔργων है; उसका दायरा संकीर्ण करना इस पद में उपस्थित सामान्य कथन को अनावश्यक रूप से निर्धारित कर देगा।
- issue: निहित कर्ता
  choice: ‘यह’ का प्रयोग किया गया है, जिसका संदर्भ पिछले पद में परमेश्वर के चुने जाने/शेष बचे लोगों की स्थिति से समझा जाता है।
  alternative: ‘चुनाव’ अथवा ‘शेष’ को स्पष्ट रूप से जोड़ना।
  rationale: यूनानी पाठ में कर्ता निहित है; किसी एक संज्ञा को जोड़कर अस्पष्टता समाप्त करना मूल से आगे जाना होगा।
translation_notes:
  register: आधुनिक, संक्षिप्त और गरिमापूर्ण मानक हिन्दी। ‘अनुग्रह’ बाइबिलीय संदर्भ में परिचित है; समानांतर खंडों और तर्कपूर्ण विरामचिह्न को मूल के निकट रखा गया है।
