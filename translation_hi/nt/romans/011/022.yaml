id: ROM.11.22
reference: Romans 11:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἴδε οὖν χρηστότητα καὶ ἀποτομίαν θεοῦ· ἐπὶ μὲν τοὺς πεσόντας ⸀ἀποτομία, ἐπὶ δὲ σὲ ⸂χρηστότης θεοῦ⸃, ἐὰν ⸀ἐπιμένῃς τῇ χρηστότητι, ἐπεὶ καὶ σὺ ἐκκοπήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/022.yaml
  text: 'Consider[a], then, the kindness and severity of God: severity toward those who have fallen, but God''s kindness toward you, if you continue in his kindness[b]; otherwise you too will be cut off.'
translation:
  language: hi
  text: 'इसलिए परमेश्वर की दयालुता[a] और कठोरता पर ध्यान दो: जो गिर गए हैं, उन पर कठोरता; पर तुम पर परमेश्वर की दयालुता है—यदि तुम उसकी दयालुता में बने रहो। नहीं तो तुम भी काट दिए जाओगे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भलाई।’ यूनानी शब्द χρηστότης दयालुता, भलाई या हितकारी कृपा का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘डाली की तरह तोड़ दिए जाओगे।’ यूनानी क्रिया का सीधा अर्थ ‘काट देना’ है; आसपास के जैतून के पेड़ के रूपक के कारण ‘तोड़ देना’ भी प्रसंगानुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴδε
  choice: ध्यान दो
  rationale: यह आज्ञार्थक क्रिया पाठक को ध्यानपूर्वक विचार करने के लिए बुलाती है। ‘ध्यान दो’ आधुनिक हिन्दी में स्वाभाविक है और केवल दृश्य रूप से ‘देखने’ तक अर्थ को सीमित नहीं करती।
- source_word: χρηστότητα / χρηστότης
  choice: दयालुता
  rationale: यह शब्द भलाई, कृपालुता या हितकारी उदारता का भाव रखता है। ‘दयालुता’ परमेश्वर के अनुग्रहपूर्ण व्यवहार को व्यक्त करती है और ‘कठोरता’ के साथ स्पष्ट संबंधपरक विरोध बनाती है।
- source_word: ἀποτομίαν / ἀποτομία
  choice: कठोरता
  rationale: यहाँ यह न्याय में कड़ी और निर्णायक कार्रवाई को दर्शाता है। ‘कठोरता’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है, बिना उसे अनावश्यक रूप से बढ़ाए।
- source_word: ἐπὶ μὲν τοὺς πεσόντας
  choice: जो गिर गए हैं, उन पर
  rationale: यह अनुवाद ἐπί की दिशा/लक्ष्य और substantival participle के फलस्वरूप वर्तमान दशा—‘गिर गए हैं’—दोनों को बनाए रखता है।
- source_word: ἐπὶ δὲ σὲ
  choice: पर तुम पर
  rationale: यह पहले ἐπί-वाक्यांश के समानांतर है और परमेश्वर की दयालुता के संबोधित व्यक्ति की ओर होने को स्पष्ट करता है।
- source_word: ἐὰν ἐπιμένῃς τῇ χρηστότητι
  choice: यदि तुम उसकी दयालुता में बने रहो
  rationale: सशर्त संरचना और दयालुता के क्षेत्र में निरंतर बने रहने का भाव सुरक्षित रखा गया है। ‘उसकी’ का संदर्भ निकटवर्ती ‘परमेश्वर’ से स्पष्ट है।
- source_word: ἐπεὶ
  choice: नहीं तो
  rationale: इस प्रसंग में यह शर्त पूरी न होने के परिणाम को प्रस्तुत करता है; ‘नहीं तो’ आधुनिक हिन्दी में चेतावनी का तर्क स्पष्ट करता है।
- source_word: ἐκκοπήσῃ
  choice: काट दिए जाओगे
  rationale: भविष्यत् कर्मवाच्य रूप का सीधा अर्थ ‘काट दिया जाना’ है। यह आसपास के जैतून के पेड़ के रूपक से भी मेल खाता है।
theological_decisions:
- issue: परमेश्वर की दयालुता में बने रहने से जुड़ी सशर्त चेतावनी
  choice: 'वास्तविक शर्त और चेतावनी को सीधे बनाए रखा गया: यदि संबोधित व्यक्ति परमेश्वर की दयालुता में बना रहे; नहीं तो वह भी काट दिया जाएगा।'
  alternative: इसे केवल काल्पनिक चेतावनी बनाना, या अनुवाद में धीरज अथवा विश्वासत्याग से संबंधित किसी विशिष्ट सम्प्रदायगत निष्कर्ष को जोड़ना।
  rationale: यूनानी पाठ शर्त और परिणाम को स्पष्ट रूप से रखता है, पर यह स्वयं इस पद में व्यक्तिगत बनाम सामूहिक प्रयोग अथवा अंतिम धीरज और विश्वासत्याग के व्यापक धर्मवैज्ञानिक विवादों को हल नहीं करता। अनुवाद उसी तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण किंतु सहज शैली रखी गई है। एकवचन संबोधन ‘तुम’ यूनानी σέ और क्रियाओं के एकवचन को सुरक्षित रखता है। अर्धविराम और डैश विरोधी खंडों को स्पष्ट करते हैं।
