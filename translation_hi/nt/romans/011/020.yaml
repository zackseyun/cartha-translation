source:
  edition: SBLGNT
  text: καλῶς· τῇ ἀπιστίᾳ ἐξεκλάσθησαν, σὺ δὲ τῇ πίστει ἕστηκας. μὴ ⸂ὑψηλὰ φρόνει⸃, ἀλλὰ φοβοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/011/020.yaml
  text: 'Quite right: they were broken off because of unbelief[a], but you stand by faith. Do not be arrogant[d][c][b], but fear.'
translation:
  language: hi
  text: ठीक है; वे अविश्वास के कारण तोड़कर अलग कर दिए गए, पर तुम विश्वास के द्वारा स्थिर खड़े हो। घमण्ड न करो, बल्कि डरो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλῶς
  choice: ठीक है
  rationale: यह पिछले कथन को स्वीकार करने वाला उत्तर है; ‘ठीक है’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक रूप से अनुमोदन व्यक्त करता है।
- source_word: ἀπιστίᾳ
  choice: अविश्वास के कारण
  rationale: यहाँ कारक/साधनसूचक दत्तिव का प्रसंगानुकूल कारणात्मक अर्थ है और यह πίστις के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἐξεκλάσθησαν
  choice: तोड़ दिए गए
  rationale: जैतून के पेड़ और उसकी डालियों का रूपक सुरक्षित रहता है; कर्मवाच्य भी मूल के अनुरूप है।
- source_word: πίστει
  choice: विश्वास के द्वारा
  rationale: दत्तिव यहाँ आधार अथवा साधन बताता है; ‘विश्वास’ ἀπιστία के ‘अविश्वास’ से सीधा विरोध बनाए रखता है।
- source_word: ἕστηκας
  choice: स्थिर खड़े हो
  rationale: पूर्णकाल से बनी वर्तमान स्थिति को व्यक्त करता है; केवल ‘खड़े हो’ की अपेक्षा परिणामी स्थिरता स्पष्ट करता है, बिना इसे योग्यता का दावा बनाए।
- source_word: ὑψηλὰ φρόνει
  choice: घमण्ड न करो
  rationale: मुहावरे का आशय अपने विषय में ऊँचा या अभिमानी विचार रखना है; यह हिन्दी में सहज और स्पष्ट निषेध है।
- source_word: φοβοῦ
  choice: डरो
  rationale: आज्ञार्थक की तीक्ष्णता और जानबूझकर बनी धार्मिक-नैतिक तनातनी को सुरक्षित रखता है; इसे केवल ‘आदर करो’ कहकर नरम नहीं किया गया।
theological_decisions:
- issue: πίστις और ἀπιστία का विरोध
  choice: विश्वास / अविश्वास
  alternative: भरोसा / भरोसा न करना; विश्वासयोग्यता
  rationale: इस प्रसंग में मनुष्य की विश्वासपूर्ण प्रतिक्रिया का अर्थ सबसे स्वाभाविक है; फिर भी ‘विश्वास के द्वारा’ साधन और आधार के बीच की सूक्ष्मता को पूरी तरह सीमित नहीं करता।
- issue: φοβοῦ का बल
  choice: डरो
  alternative: भय मानो; श्रद्धापूर्ण भय रखो
  rationale: आसपास का प्रसंग आत्म-अभिमान के विरुद्ध परमेश्वर के सामने सावधानी और भय की माँग करता है। सरल ‘डरो’ मूल की चेतावनी को न तो मात्र आतंक बनाता है, न केवल सम्मान तक नरम करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण। वाक्य में मूल के विरोधसूचक ढाँचे और जैतून की डालियों के रूपक को बनाए रखा गया है। पाठ में कोई पादटिप्पणी-चिह्न आवश्यक नहीं माना गया।
