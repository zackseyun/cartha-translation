id: ROM.1.17
reference: Romans 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: δικαιοσύνη γὰρ θεοῦ ἐν αὐτῷ ἀποκαλύπτεται ἐκ πίστεως εἰς πίστιν, καθὼς γέγραπται· Ὁ δὲ δίκαιος ἐκ πίστεως ζήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/017.yaml
  text: 'For in it the righteousness of God is revealed from faith to faith[d][c][b][a], just as it is written: “The righteous one shall live by faith.”'
translation:
  language: hi
  text: 'क्योंकि उसमें परमेश्वर की धार्मिकता[a] विश्वास से विश्वास तक[b] प्रकट होती है, जैसा लिखा है: “धर्मी जन विश्वास से जीवित रहेगा।”[c][d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का न्याय।”
    reason: lexical_alternative
  - marker: b
    text: “विश्वास से विश्वास तक” वाला यूनानी वाक्यांश अत्यन्त कठिन और अर्थ की दृष्टि से खुला है। सम्भव अनुवादों में “विश्वास से, विश्वास के लिए,” “आरम्भ से अन्त तक विश्वास के द्वारा,” और “विश्वास के माध्यम से, विश्वास के लिए” शामिल हैं।
    reason: alternative_reading
  - marker: c
    text: या, “जो विश्वास के आधार पर धर्मी है, वह जीवित रहेगा।”
    reason: alternative_reading
  - marker: d
    text: या, “परन्तु धर्मी जन विश्वास से जीवित रहेगा।”
    reason: previous_rendering
lexical_decisions:
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यह पौलुस के इस प्रमुख पद में पारंपरिक और व्यापक अर्थ को बनाए रखता है; ‘न्याय’ एक वास्तविक वैकल्पिक अर्थ है, जिसे पादटिप्पणी में दिया गया है।
- source_word: θεοῦ
  choice: परमेश्वर की
  rationale: संबंधकारक की अस्पष्टता को खुला रखता है—यह परमेश्वर की अपनी धार्मिकता या परमेश्वर से संबंधित अथवा उसके द्वारा दी जाने वाली धार्मिकता की ओर संकेत कर सकता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: नपुंसकलिंग सर्वनाम का स्वाभाविक पूर्वपद पिछले पद का ‘सुसमाचार’ है।
- source_word: ἀποκαλύπτεται
  choice: प्रकट होती है
  rationale: वर्तमानकालीन कर्मवाच्य को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ πίστεως εἰς πίστιν
  choice: विश्वास से विश्वास तक
  rationale: दोनों संबंधसूचक पदों और ‘विश्वास’ की पुनरावृत्ति को बनाए रखते हुए कठिन यूनानी वाक्यांश की वास्तविक अर्थगत अस्पष्टता को किसी एक व्याख्या में सीमित नहीं करता।
- source_word: δίκαιος
  choice: धर्मी जन
  rationale: विशेषण के संज्ञात्मक, प्रतिनिधिक एकवचन अर्थ को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐκ πίστεως
  choice: विश्वास से
  rationale: हबक्कूक के उद्धरण में साधन अथवा रीति का स्वाभाविक हिन्दी बोध देता है और वाक्यगत जुड़ाव की कुछ अस्पष्टता बनाए रखता है।
- source_word: ζήσεται
  choice: जीवित रहेगा
  rationale: भविष्यकाल का बल स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: δικαιοσύνη θεοῦ का अर्थ
  choice: परमेश्वर की धार्मिकता
  alternative: परमेश्वर से मिलने वाली धार्मिकता; परमेश्वर का न्याय
  rationale: यूनानी संबंधकारक धर्मवैज्ञानिक रूप से विवादित है। मुख्य पाठ निकट और पारंपरिक रूप रखकर यह तय नहीं करता कि बात परमेश्वर के गुण, उसके न्यायपूर्ण कार्य या उसके द्वारा दी जाने वाली धार्मिकता की है।
- issue: ἐκ πίστεως εἰς πίστιν का आशय
  choice: विश्वास से विश्वास तक
  alternative: विश्वास से, विश्वास के लिए; आरम्भ से अन्त तक विश्वास के द्वारा; विश्वास के माध्यम से, विश्वास के लिए
  rationale: यह प्रसिद्ध कठिन वाक्यांश अनेक सम्भव अर्थों की अनुमति देता है। चुना हुआ अनुवाद यूनानी के दोनों संबंधसूचक पदों और अलंकारिक पुनरावृत्ति को सुरक्षित रखता है।
- issue: हबक्कूक के उद्धरण में ἐκ πίστεως का जुड़ाव
  choice: धर्मी जन विश्वास से जीवित रहेगा
  alternative: जो विश्वास के आधार पर धर्मी है, वह जीवित रहेगा
  rationale: यूनानी में ‘विश्वास से’ को ‘धर्मी’ अथवा ‘जीवित रहेगा’ के साथ समझा जा सकता है। मुख्य पाठ प्रचलित और सहज रचना रखता है; दूसरी सम्भावना पादटिप्पणी में है।
- issue: उद्धरण के आरम्भ में δὲ
  choice: मुख्य पाठ में अलग से अनूदित नहीं
  alternative: परन्तु धर्मी जन विश्वास से जीवित रहेगा
  rationale: δὲ को ‘परन्तु’ कहना रूपगत रूप से सम्भव है, पर यहाँ उद्धरण पिछले कथन का समर्थन करता है; हिन्दी में ‘परन्तु’ अनावश्यक रूप से तीखा विरोध सुझा सकता है। विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और धर्मग्रन्थीय स्वर रखा गया है। ‘धार्मिकता’ और ‘धर्मी जन’ परिचित धार्मिक शब्द हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सरल है। मूल पाठ की धर्मवैज्ञानिक और वाक्यगत अस्पष्टताओं को मुख्य पाठ तथा पादटिप्पणियों में जानबूझकर सुरक्षित रखा गया है।
