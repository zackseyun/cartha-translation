translation:
  language: hi
  text: जिनमें तुम भी हो—यीशु मसीह के होने के लिए बुलाए गए हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν οἷς
  choice: जिनमें
  rationale: बहुवचन सम्बन्धवाचक सर्वनाम पिछले पद में उल्लिखित गैर-यहूदी जातियों की ओर संकेत करता है; ‘जिनमें’ उस समूह में रोमी विश्वासियों के सम्मिलित होने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐστε
  choice: हो
  rationale: εἰμί के वर्तमानकालीन रूप को हिंदी में स्पष्ट रूप से रखा गया है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: यह रोमी विश्वासियों के भी उसी समूह में सम्मिलित होने पर मूल यूनानी का बल बनाए रखता है।
- source_word: κλητοὶ
  choice: बुलाए हुए
  rationale: यह विशेषण का संज्ञात्मक प्रयोग स्वाभाविक हिंदी में व्यक्त करता है और ‘निमंत्रित’ की अपेक्षा बुलाहट की व्यापक तथा धर्मवैचारिक शक्ति को बनाए रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के
  rationale: दोनों शब्द सम्बन्धकारक में हैं। Ἰησοῦ को व्यक्तिगत नाम ‘यीशु’ और Χριστοῦ को उपाधि ‘मसीह’ के रूप में प्रस्तुत किया गया है।
- source_word: κλητοὶ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के बुलाए हुए
  rationale: मूल का संक्षिप्त सम्बन्धकारक निर्माण ज्यों का त्यों निकटता से रखा गया है; यह सम्बन्ध या स्वामित्व का भाव दे सकता है, जबकि कर्तृत्व की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: κλητοὶ Ἰησοῦ Χριστοῦ में सम्बन्धकारक का अर्थ
  choice: यीशु मसीह के बुलाए हुए
  alternative: यीशु मसीह द्वारा बुलाए हुए; यीशु मसीह के होने के लिए बुलाए हुए
  rationale: यूनानी सम्बन्धकारक यह स्पष्ट नहीं करता कि यीशु बुलाने वाले हैं या बुलाए हुओं का उनसे सम्बन्ध/स्वामित्व बताया गया है। मुख्य पाठ में संक्षिप्तता और अस्पष्टता सुरक्षित रखी गई है तथा सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। पदांश की आश्रित संरचना को बनाए रखते हुए डैश से अंतिम पदबंध स्पष्ट किया गया है।
