source:
  edition: SBLGNT
  text: ⸀Διὸ παρέδωκεν αὐτοὺς ὁ θεὸς ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν εἰς ἀκαθαρσίαν τοῦ ἀτιμάζεσθαι τὰ σώματα αὐτῶν ἐν ⸀αὐτοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/024.yaml
  text: Therefore God gave them over in the desires of their hearts to impurity[a], for the dishonoring of their bodies among themselves.
translation:
  language: hi
  text: इसलिए परमेश्वर ने उन्हें उनके हृदयों की इच्छाओं में अशुद्धता के लिए सौंप दिया, ताकि उनके बीच उनके शरीरों का अनादर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: παρέδωκεν
  choice: हवाले कर दिया
  rationale: यह किसी व्यक्ति को किसी शक्ति या दशा के अधीन कर देने का भाव रखता है और क्रिया के गंभीर, न्याय-संबंधी बल को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἐν ταῖς ἐπιθυμίαις τῶν καρδιῶν αὐτῶν
  choice: उनके हृदयों की अभिलाषाओं में
  rationale: ‘में’ यूनानी पूर्वसर्ग की क्षेत्र अथवा सक्रिय परिस्थिति संबंधी अस्पष्टता को बनाए रखता है; ‘हृदयों’ स्रोत की बाइबलीय मानव-दृष्टि को सुरक्षित रखता है।
- source_word: ἐπιθυμίαις
  choice: अभिलाषाओं
  rationale: यह शब्द इच्छा की व्यापकता को बनाए रखता है और संदर्भ से पहले ही इसे केवल यौन वासना तक सीमित नहीं करता।
- source_word: ἀκαθαρσίαν
  choice: अशुद्धता
  rationale: यह आधुनिक धार्मिक हिंदी में स्वाभाविक है और नैतिक अपवित्रता का अर्थ स्पष्ट करता है।
- source_word: τοῦ ἀτιμάζεσθαι
  choice: जिससे ... अनादर हो
  rationale: यह यूनानी संबंधवाचक क्रियार्थक संज्ञा के परिणाम/परिणति के भाव और उसके कर्मवाच्य रूप को पठनीय हिंदी में व्यक्त करता है।
- source_word: τὰ σώματα αὐτῶν
  choice: उनके शरीरों
  rationale: यह पौलुस के ठोस शारीरिक बल को सीधे सुरक्षित रखता है।
- source_word: ἐν αὐτοῖς
  choice: आपस में
  rationale: संदर्भ में पारस्परिक या सामुदायिक अर्थ को स्वाभाविक हिंदी में व्यक्त करता है, जबकि अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: क्या παρέδωκεν को ‘त्याग दिया’ या स्पष्ट न्यायिक व्याख्या के रूप में तीव्र किया जाए
  choice: हवाले कर दिया
  alternative: त्याग दिया; दंड के रूप में उनके पाप के अधीन कर दिया
  rationale: मूल पाठ परमेश्वर द्वारा उन्हें सौंप दिए जाने की गंभीर बात कहता है, पर यह अनुवाद उसमें कोई विस्तृत सिद्धान्तात्मक व्याख्या नहीं जोड़ता।
- issue: τοῦ ἀτιμάζεσθαι में उद्देश्य और परिणाम का संबंध
  choice: जिससे उनके शरीरों का ... अनादर हो
  alternative: ताकि उनके शरीरों का ... अनादर हो
  rationale: ‘जिससे’ परिणाम को प्रमुखता देता है, फिर भी उद्देश्य की संभावित छाया को पूरी तरह नकारे बिना यूनानी रचना के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘हवाले कर दिया’ गंभीरता बनाए रखता है, जबकि ‘हृदयों की अभिलाषाओं में’ मूल की अर्थगत खुलावट को जानबूझकर सुरक्षित रखता है।
