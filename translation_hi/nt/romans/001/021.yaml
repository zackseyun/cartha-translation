id: ROM.1.21
reference: Romans 1:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διότι γνόντες τὸν θεὸν οὐχ ὡς θεὸν ἐδόξασαν ἢ ηὐχαρίστησαν, ἀλλὰ ἐματαιώθησαν ἐν τοῖς διαλογισμοῖς αὐτῶν καὶ ἐσκοτίσθη ἡ ἀσύνετος αὐτῶν καρδία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/021.yaml
  text: For although they knew God[a], they did not glorify him as God or give thanks, but they became futile in their thinking[b], and their senseless heart was darkened.
translation:
  language: hi
  text: क्योंकि परमेश्वर को जानने पर भी उन्होंने न तो उसे परमेश्वर के रूप में महिमा दी, न उसका धन्यवाद किया; बल्कि वे अपने विचारों[a] में व्यर्थ हो गए, और उनका नासमझ हृदय[b] अंधकारमय हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने तर्कों में’, ‘अपनी सोच में’, अथवा ‘अपनी कल्पनाओं में’।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में ‘हृदय’ एकवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है और वाक्य के आरम्भ में तार्किक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γνόντες τὸν θεὸν
  choice: परमेश्वर को जानने पर भी
  rationale: 'संदर्भ में कृदन्त का रियायती भाव है: परमेश्वर को जानने के बावजूद उन्होंने उचित प्रत्युत्तर नहीं दिया।'
- source_word: οὐχ ὡς θεὸν ἐδόξασαν
  choice: न तो परमेश्वर के रूप में उसकी महिमा की
  rationale: यह इस बात को बनाए रखता है कि उन्होंने परमेश्वर को उस हैसियत से महिमा नहीं दी जो परमेश्वर होने के कारण उसकी है; ‘महिमा की’ δοξάζω का धार्मिक भार भी सुरक्षित रखता है।
- source_word: ἢ ηὐχαρίστησαν
  choice: न उसका धन्यवाद किया
  rationale: क्रिया व्यक्त की गई कृतज्ञता को दर्शाती है; हिन्दी में कर्म को स्पष्ट करने के लिए ‘उसका’ जोड़ा गया है।
- source_word: ἐματαιώθησαν
  choice: व्यर्थ हो गए
  rationale: यह निष्क्रिय क्रिया के परिणामकारी भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी ऐसे बाहरी कर्ता को निश्चित किए जो मूल में स्पष्ट नहीं है।
- source_word: ἐν τοῖς διαλογισμοῖς αὐτῶν
  choice: अपने विचारों में
  rationale: διαλογισμοί विचारों, तर्कों या मन के विचार-विमर्श को सूचित कर सकता है; ‘विचारों’ सहज और पर्याप्त व्यापक है।
- source_word: ἐσκοτίσθη
  choice: अंधकारमय हो गया
  rationale: नैतिक-बौद्धिक अंधकार के रूपक और निष्क्रिय परिणाम, दोनों को बनाए रखता है।
- source_word: ἡ ἀσύνετος αὐτῶν καρδία
  choice: उनका नासमझ हृदय
  rationale: ἀσύνετος का अर्थ समझ या विवेक से रहित है; ‘नासमझ’ केवल कम बुद्धि का तकनीकी दावा किए बिना भाव स्पष्ट करता है। यूनानी का एकवचन ‘हृदय’ सुरक्षित रखा गया है।
theological_decisions:
- issue: γνόντες का रियायती भाव
  choice: परमेश्वर को जानने पर भी
  alternative: परमेश्वर को जानकर / जब उन्होंने परमेश्वर को जाना
  rationale: संदर्भ उनके ज्ञान और उनके अनुचित प्रत्युत्तर के बीच विरोध पर बल देता है। यह व्याकरणिक-संदर्भगत चयन है और ज्ञान की प्रकृति या सीमा को उससे अधिक निश्चित नहीं करता जितना पद कहता है।
- issue: ἐματαιώθησαν में कारण या कर्ता
  choice: व्यर्थ हो गए
  alternative: व्यर्थ कर दिए गए
  rationale: मूल में रूप निष्क्रिय है, पर कर्ता व्यक्त नहीं है। चुना गया हिन्दी रूप परिणाम को व्यक्त करता है और यह निर्धारित नहीं करता कि व्यर्थता स्वयं आई या किसी बाहरी कर्ता ने उत्पन्न की।
- issue: ‘हृदय’ का सामूहिक एकवचन
  choice: उनका नासमझ हृदय
  alternative: उनके नासमझ हृदय
  rationale: यूनानी एकवचन को बनाए रखा गया है, जिससे सामूहिक रूप में उनके भीतरी नैतिक-बौद्धिक केंद्र का कथन सामने आता है; बहुवचन करके स्रोत की संख्या नहीं बदली गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण धार्मिक गद्य। ‘परमेश्वर’, ‘महिमा’ और ‘हृदय’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
