id: ROM.1.20
reference: Romans 1:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰ γὰρ ἀόρατα αὐτοῦ ἀπὸ κτίσεως κόσμου τοῖς ποιήμασιν νοούμενα καθορᾶται, ἥ τε ἀΐδιος αὐτοῦ δύναμις καὶ θειότης, εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/020.yaml
  text: For his invisible attributes[a], that is, his eternal power and divinity, have been clearly seen since the creation of the world, being understood through what has been made[b], so that they are without excuse.
translation:
  language: hi
  text: क्योंकि संसार की सृष्टि से ही उसकी अदृश्य विशेषताएँ[a]—अर्थात् उसकी अनन्त सामर्थ्य और दिव्यता[b]—उसकी बनाई हुई वस्तुओं के माध्यम से समझी जाने पर स्पष्ट दिखाई देती हैं। इस प्रकार वे निरुत्तर हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके अदृश्य गुण।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘ईश्वरीय स्वभाव।’ यहाँ यूनानी शब्द θειότης है, अधिक प्रबल शब्द θεότης नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰ ἀόρατα αὐτοῦ
  choice: उसकी अदृश्य विशेषताएँ
  rationale: नपुंसकलिंग बहुवचन परमेश्वर के उन अदृश्य पहलुओं को व्यापक रूप से बताता है जिन्हें सृष्टि के माध्यम से जाना जा सकता है। ‘विशेषताएँ’ आधुनिक हिन्दी में स्वाभाविक है और इसे अदृश्य वस्तुओं का संदर्भ समझे जाने से बचाता है।
- source_word: ἀπὸ κτίσεως κόσμου
  choice: संसार की सृष्टि के समय से ही
  rationale: यह वाक्यांश उस आरम्भिक समय को सूचित करता है जब से ये विशेषताएँ दिखाई देती रही हैं; ‘से ही’ ἀπό के कालगत बल को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῖς ποιήμασιν
  choice: उसकी बनाई हुई वस्तुओं के द्वारा
  rationale: 'यहाँ दत्तिव कारक साधन का बोध कराता है: सृजी हुई वस्तुएँ वह माध्यम हैं जिनसे समझ प्राप्त होती है।'
- source_word: νοούμενα
  choice: समझी जाकर
  rationale: यह कृदन्त मानसिक ग्रहण या बोध को व्यक्त करता है और बताता है कि अदृश्य बातें सृष्टि पर विचार करने से कैसे दिखाई देती हैं।
- source_word: καθορᾶται
  choice: स्पष्ट दिखाई देती हैं
  rationale: यह क्रिया प्रबल रूप से स्पष्ट देखने या पहचानने का भाव रखती है; वर्तमानकालीन निरन्तर वास्तविकता को हिन्दी में सहज रूप से रखा गया है।
- source_word: ἥ τε ἀΐδιος αὐτοῦ δύναμις
  choice: उसकी अनन्त सामर्थ्य
  rationale: यह पहले आए ‘अदृश्य विशेषताएँ’ की व्याख्या का एक भाग है। ‘अनन्त’ ἀΐδιος के चिरस्थायी भाव और ‘सामर्थ्य’ δύναμις के अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करते हैं।
- source_word: θειότης
  choice: दिव्यता
  rationale: θειότης ईश्वरीय गुण या दिव्यता को सूचित करता है। ‘दिव्यता’ θεότης जैसे अधिक प्रबल अस्तित्वगत शब्द के साथ अनावश्यक समानता किए बिना इस सूक्ष्मता को बनाए रखती है।
- source_word: εἰς τὸ εἶναι αὐτοὺς ἀναπολογήτους
  choice: इसलिए उनके पास कोई बहाना नहीं है
  rationale: यह रचना परिणाम व्यक्त करती है। हिन्दी वाक्य स्वाभाविक रहते हुए यह अर्थ रखता है कि वे अपने बचाव में कोई उचित सफाई नहीं दे सकते।
theological_decisions:
- issue: θειότης को उसके अर्थ से अधिक प्रबल बनाए बिना प्रस्तुत करना
  choice: दिव्यता
  alternative: ईश्वरीय स्वभाव
  rationale: पद सृष्टि में परमेश्वर की वास्तविक ईश्वरीयता प्रकट होने की पुष्टि करता है, पर θειότης ईश्वरीय गुण का शब्द है और इसे θεότης के समान अधिक प्रबल अस्तित्वगत अभिव्यक्ति नहीं बनाना चाहिए।
- issue: εἰς τό रचना में उद्देश्य और परिणाम का संबंध
  choice: इसलिए उनके पास कोई बहाना नहीं है
  alternative: ताकि उनके पास कोई बहाना न रहे
  rationale: संदर्भ में सृष्टि के प्रकाशन का परिणाम मनुष्यों का निरुत्तर होना है। ‘इसलिए’ परिणाम को व्यक्त करता है और यह संकेत देने से बचता है कि प्रकाशन का एकमात्र उद्देश्य उन्हें दोषी ठहराना था।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सर्वसुलभ रूप अपनाया गया है। मुख्य यूनानी वाक्य की लंबी संरचना को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है। व्याख्यात्मक पदांश को दीर्घ विराम-चिह्नों के बीच रखा गया है, और प्रत्येक पाद-टिप्पणी चिह्न मुख्य पाठ में संबंधित शब्द के साथ दिया गया है।
