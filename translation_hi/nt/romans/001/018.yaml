id: ROM.1.18
reference: Romans 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀποκαλύπτεται γὰρ ὀργὴ θεοῦ ἀπ’ οὐρανοῦ ἐπὶ πᾶσαν ἀσέβειαν καὶ ἀδικίαν ἀνθρώπων τῶν τὴν ἀλήθειαν ἐν ἀδικίᾳ κατεχόντων,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/018.yaml
  text: For the wrath of God is being revealed from heaven against all ungodliness and unrighteousness of people who suppress the truth in unrighteousness[a][b][c][d][e].
translation:
  language: hi
  text: क्योंकि परमेश्वर का क्रोध स्वर्ग से उन लोगों की सारी अभक्ति और अधार्मिकता पर प्रकट हो रहा है, जो अपनी अधार्मिकता से सत्य को दबाए रखते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रकट होता है।”
    reason: lexical_alternative
  - marker: b
    text: “अपनी अधार्मिकता से” का अनुवाद “अधार्मिकता में” भी हो सकता है। “दबाए रखते हैं” का अर्थ “रोके रखते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀποκαλύπτεται
  choice: प्रकट हो रहा है
  rationale: वर्तमानकालीन कर्मवाच्य का चल रहा भाव स्वाभाविक हिन्दी में व्यक्त करता है; सामान्य वर्तमान ‘प्रकट होता है’ भी व्याकरणतः सम्भव है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस तार्किक सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: ὀργὴ θεοῦ
  choice: परमेश्वर का क्रोध
  rationale: सम्बन्धकारक रचना का सीधा अनुवाद है और ὀργή की व्यक्तिगत तथा न्यायिक गम्भीरता को बनाए रखता है।
- source_word: ἀπ’ οὐρανοῦ
  choice: स्वर्ग से
  rationale: क्रोध के प्रकट होने के स्वर्गीय स्रोत को सीधे व्यक्त करता है।
- source_word: πᾶσαν ἀσέβειαν
  choice: सारी अभक्ति
  rationale: ἀσέβεια का परमेश्वर के प्रति अनादर और भक्तिहीनता वाला अर्थ ‘अभक्ति’ से संक्षेप में व्यक्त होता है।
- source_word: ἀδικίαν
  choice: अधार्मिकता
  rationale: यह ἀδικία की व्यापक नैतिक विपथता को बनाए रखता है; केवल सामाजिक ‘अन्याय’ कहना यहाँ अर्थ को संकरा कर सकता है।
- source_word: ἀνθρώπων
  choice: लोगों
  rationale: यह शब्द यहाँ सामान्य रूप से मनुष्यों के लिए है, केवल पुरुषों के लिए नहीं।
- source_word: τῶν ... κατεχόντων
  choice: जो ... दबाए रखते हैं
  rationale: सन्दर्भ में κατέχω सत्य को रोकने या दबाने का भाव देता है; ‘दबाए रखते हैं’ उसके वर्तमान और सतत भाव को भी बनाए रखता है।
- source_word: τὴν ἀλήθειαν
  choice: सत्य को
  rationale: मूल संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν ἀδικίᾳ
  choice: अपनी अधार्मिकता से
  rationale: ἐν को यहाँ साधन या रीति के रूप में समझना स्वाभाविक है; ‘अपनी’ सम्बन्ध स्पष्ट करता है, जबकि ‘अधार्मिकता में’ सम्भव वैकल्पिक अर्थ है।
theological_decisions:
- issue: ὀργὴ θεοῦ को व्यक्तिगत ईश्वरीय न्यायिक क्रोध माना जाए या केवल नैतिक परिणाम
  choice: परमेश्वर का क्रोध
  alternative: बुराई का अपने-आप आने वाला दुष्परिणाम
  rationale: सम्बन्धकारक रचना और पौलुस के तर्क में यह परमेश्वर की अपनी न्यायिक प्रतिक्रिया है; अनुवाद इसे निर्जीव प्रक्रिया बनाकर हल्का नहीं करता।
- issue: ἐν ἀδικίᾳ साधन बताता है या क्षेत्र/अवस्था
  choice: अपनी अधार्मिकता से
  alternative: अधार्मिकता में
  rationale: साधन या रीति का अर्थ प्रसंग में अधिक सहज है, पर यूनानी रचना क्षेत्र या अवस्था का भाव भी दे सकती है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। ‘अभक्ति’ और ‘अधार्मिकता’ पौलुस की दो अलग नैतिक संज्ञाओं तथा ἀδικία की जानबूझकर की गई पुनरावृत्ति को सुरक्षित रखते हैं।
