revisions:
- from: क्योंकि परमेश्वर मेरा गवाह है कि मैं तुम्हें निरन्तर स्मरण करता हूँ—वही परमेश्वर, जिसकी सेवा मैं अपने आत्मा में उसके पुत्र के शुभ समाचार में करता हूँ।[a]
  to: क्योंकि परमेश्वर, जिसकी मैं अपनी आत्मा से उसके पुत्र के शुभ समाचार में सेवा करता हूँ, मेरा गवाह है कि मैं तुम लोगों का निरंतर उल्लेख करता हूँ।
  rationale: The sentence has been recast so that the oath-like appeal, ‘परमेश्वर ... मेरा गवाह है,’ remains the central assertion. The service clause is rendered in idiomatic Hindi while retaining both the personal-spiritual qualifier and the good-news qualifier. ‘उल्लेख करता हूँ’ translates the Greek idiom directly, so the former literalizing footnote is no longer needed.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:37Z'
review_pass:
  verdict: revise
  source_fidelity: The draft retains the principal elements, but its restructuring makes the statement of divine witness less direct, and ‘अपने आत्मा में’ is grammatically and idiomatically unsuitable in Hindi. The revision retains the Greek’s two service-related qualifiers without forcing a disputed interpretive expansion.
  naturalness: ‘जिसकी सेवा मैं अपने आत्मा में उसके पुत्र के शुभ समाचार में करता हूँ’ is difficult Hindi. ‘अपनी आत्मा से’ is natural as a manner/means expression, and placing the relative clause within the main sentence yields a clear, dignified modern-Hindi construction.
  terminology: ‘परमेश्वर,’ ‘गवाह,’ ‘सेवा,’ and ‘शुभ समाचार’ are suitable. ‘उल्लेख करता हूँ’ accurately renders μνείαν ... ποιοῦμαι without reducing it merely to inward remembrance.
  issues:
  - severity: medium
    issue: ‘अपने आत्मा में’ is unidiomatic and has an agreement error.
    rationale: आत्मा is feminine in standard Hindi, requiring ‘अपनी’; moreover, ‘सेवा करना’ with ‘आत्मा में’ is unnatural. ‘अपनी आत्मा से’ communicates the inward/personal manner of service in idiomatic Hindi.
  - severity: medium
    issue: The draft’s dash construction reverses and weakens the source’s main syntactic assertion.
    rationale: The Greek foregrounds ‘God is my witness’ and then supplies the relative description. Keeping the relative clause between ‘परमेश्वर’ and ‘मेरा गवाह है’ preserves this relationship clearly in Hindi.
  - severity: low
    issue: ‘स्मरण करता हूँ’ is less precise than the source idiom.
    rationale: μνείαν ... ποιοῦμαι denotes making mention. ‘तुम लोगों का निरंतर उल्लेख करता हूँ’ is direct, natural formal Hindi and preserves the expressed action.
  revised_text: क्योंकि परमेश्वर, जिसकी मैं अपनी आत्मा से उसके पुत्र के शुभ समाचार में सेवा करता हूँ, मेरा गवाह है कि मैं तुम लोगों का निरंतर उल्लेख करता हूँ।
