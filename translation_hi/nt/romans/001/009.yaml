id: ROM.1.9
reference: Romans 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μάρτυς γάρ μού ἐστιν ὁ θεός, ᾧ λατρεύω ἐν τῷ πνεύματί μου ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ, ὡς ἀδιαλείπτως μνείαν ὑμῶν ποιοῦμαι
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/009.yaml
  text: For God[a], whom I serve in my spirit in the good news of his Son[d][c][b], is my witness that I continually mention you.
translation:
  language: hi
  text: क्योंकि परमेश्वर, जिसकी मैं अपनी आत्मा से उसके पुत्र के शुभ समाचार में सेवा करता हूँ, मेरा गवाह है कि मैं तुम लोगों का निरंतर उल्लेख करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς
  choice: गवाह
  rationale: शपथ-सदृश कथन में यह पौलुस के दावे की सत्यता की गवाही देने वाले को दर्शाता है; ‘गवाह’ स्वाभाविक और सटीक है।
- source_word: λατρεύω
  choice: सेवा करता हूँ
  rationale: यह परमेश्वर की धार्मिक उपासना और समर्पित सेवा दोनों का बोध करा सकता है; ‘सेवा’ इस व्यापकता को बनाए रखती है।
- source_word: ἐν τῷ πνεύματί μου
  choice: अपने आत्मा में
  rationale: ἐν के स्थान अथवा रीति/साधन-सूचक अर्थ को अनावश्यक रूप से निश्चित किए बिना यूनानी अभिव्यक्ति के निकट रहता है।
- source_word: ἐν τῷ εὐαγγελίῳ τοῦ υἱοῦ αὐτοῦ
  choice: उसके पुत्र के शुभ समाचार में
  rationale: दोनों ἐν-वाक्यांशों की समानांतर रचना बनाए रखता है और संबंधवाचक τοῦ υἱοῦ αὐτοῦ को व्याख्यात्मक ‘के विषय में’ बनाए बिना सुरक्षित रखता है।
- source_word: ἀδιαλείπτως
  choice: निरन्तर
  rationale: चलते रहने या बार-बार नियमित रूप से होने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μνείαν ὑμῶν ποιοῦμαι
  choice: मैं तुम्हें निरन्तर स्मरण करता हूँ
  rationale: यूनानी मुहावरे का आशय प्रार्थना में किसी का उल्लेख/स्मरण करना है; हिन्दी में ‘स्मरण करता हूँ’ अधिक स्वाभाविक है, जबकि शाब्दिक रूप फुटनोट में दिया गया है।
theological_decisions:
- issue: εὐαγγέλιον का पारंपरिक धार्मिक पद या पारदर्शी अर्थ
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: ‘शुभ समाचार’ मूल शब्द का अर्थ सामान्य पाठक के लिए सीधे व्यक्त करता है और कोई सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: ‘उसके पुत्र के’ संबंधवाचक का अर्थ
  choice: उसके पुत्र के शुभ समाचार
  alternative: उसके पुत्र के विषय में शुभ समाचार
  rationale: मूल का संबंधवाचक प्रयोग वास्तविक रूप से व्यापक/अस्पष्ट है; उसे केवल विषयवाचक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण और सहज शैली। मुख्य कथन को पहले रखकर लम्बे यूनानी वाक्य को पठनीय बनाया गया है; डैश वाला परिशिष्ट परमेश्वर का परिचय देता है। ‘तुम्हें’ बहुवचन समुदाय के लिए प्रयुक्त है।
