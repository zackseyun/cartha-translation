    reason: lexical_alternative
  - marker: b
    text: या “प्रेरित होने के लिए बुलाया गया।”
    reason: alternative_reading
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और सहज रूप।
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द स्वामित्व और पूर्ण अधीनता का भाव बनाए रखता है; ‘सेवक’ की अपेक्षा यूनानी शब्द की प्रबलता के अधिक निकट है, जबकि ‘गुलाम’ की तुलना में गरिमापूर्ण धार्मिक गद्य में अधिक स्वाभाविक है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु
  rationale: Χριστός यहाँ उपाधि के रूप में समझा जा सकता है, इसलिए उसके अभिषिक्त-मसीही अर्थ को अनूदित किया गया है और यूनानी शब्दक्रम बनाए रखा गया है।
- source_word: κλητὸς ἀπόστολος
  choice: बुलाया हुआ प्रेरित
  rationale: विशेषण और संज्ञा की संक्षिप्त समानाधिकरणीय रचना को बनाए रखता है और ‘प्रेरित होने के लिए’ जैसा उद्देश्य स्पष्ट रूप से जोड़ने से बचता है।
- source_word: ἀφωρισμένος
  choice: अलग किया हुआ
  rationale: निष्क्रिय कृदंत के रूप और किसी विशेष काम के लिए पृथक किए जाने के भाव को सुरक्षित रखता है।
- source_word: εἰς εὐαγγέλιον θεοῦ
  choice: परमेश्वर के सुसमाचार के लिए
  rationale: εἰς के उद्देश्य-संबंधी भाव और θεοῦ के संबंधकारक रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δοῦλος में सेवा और स्वामित्व का संबंध
  choice: दास
  alternative: सेवक; गुलाम
  rationale: ‘दास’ अधीनता और स्वामित्व की तीव्रता को बनाए रखता है, पर आधुनिक हिन्दी में ‘गुलाम’ से जुड़ी केवल सामाजिक-ऐतिहासिक धारणाओं तक अर्थ को सीमित नहीं करता।
- issue: Χριστός का उपाधि अथवा नाम-सदृश प्रयोग
  choice: मसीह यीशु
  alternative: ख्रीष्ट यीशु
  rationale: इस परिचय में उपाधिगत अर्थ सजीव है; ‘मसीह’ मूल के अभिषिक्त जन के भाव की ओर संकेत करता है, जबकि वैकल्पिक पारंपरिक लिप्यंतरण पादटिप्पणी में दिया गया है।
- issue: κλητὸς ἀπόστολος का संबंध
  choice: बुलाया हुआ प्रेरित
  alternative: प्रेरित होने के लिए बुलाया गया
  rationale: मूल की संक्षिप्तता और कुछ व्याकरणिक खुलापन सुरक्षित रखा गया है; वैकल्पिक रूप संबंध को अधिक व्याख्यात्मक ढंग से स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्यांश की पत्रारंभिक लय तथा पौलुस के तीन परिचयात्मक वर्णनों—दास, बुलाया हुआ प्रेरित, और अलग किया हुआ—का समानांतर क्रम बनाए रखा गया है।
