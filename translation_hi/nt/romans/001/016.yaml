  text: Οὐ γὰρ ἐπαισχύνομαι τὸ ⸀εὐαγγέλιον, δύναμις γὰρ θεοῦ ἐστιν εἰς σωτηρίαν παντὶ τῷ πιστεύοντι, Ἰουδαίῳ τε πρῶτον καὶ Ἕλληνι·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/016.yaml
  text: For I am not ashamed of the good news[a], for it is the power of God for salvation to everyone who believes[b], to the Jew first and also to the Greek.
translation:
  language: hi
  text: क्योंकि मैं शुभ समाचार[a] से लज्जित नहीं हूँ, क्योंकि यह हर विश्वास करनेवाले के उद्धार के लिए परमेश्वर की सामर्थ्य है—पहले यहूदी के लिए और यूनानी[b] के लिए भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुसमाचार।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘यूनानी’ शब्द व्यापक रूप से किसी गैर-यहूदी, अर्थात् जो यहूदी नहीं है, के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχύνομαι
  choice: नहीं लजाता
  rationale: यह क्रिया लज्जित होने या अपमान के भय से पीछे हटने का भाव व्यक्त करती है। ‘नहीं लजाता’ पौलुस की सार्वजनिक निर्भीकता को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: εὐαγγέλιον
  choice: शुभ समाचार
  rationale: यह मूल शब्द के ‘अच्छे समाचार’ के अर्थ को आधुनिक हिन्दी में सीधे व्यक्त करता है; परंपरागत विकल्प ‘सुसमाचार’ पाद-टिप्पणी में दिया गया है।
- source_word: δύναμις
  choice: सामर्थ्य
  rationale: यह परमेश्वर की प्रभावकारी और उद्धारकारी शक्ति को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार के लिए
  rationale: यह εἰς के लक्ष्य अथवा परिणामसूचक बल को बनाए रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: παντὶ τῷ πιστεύοντι
  choice: हर विश्वास करनेवाले के
  rationale: यह παντί के प्रत्येक-व्यक्ति संबंधी भाव और πιστεύοντι के सक्रिय कृदन्तीय अर्थ, दोनों को स्पष्ट रखता है।
- source_word: Ἰουδαίῳ
  choice: यहूदी
  rationale: Ἕλλην के साथ इस उद्धार-ऐतिहासिक विरोध में जातीय-धार्मिक अर्थ ‘यहूदी’ भौगोलिक ‘यहूदिया-वासी’ से अधिक उपयुक्त है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह यूनानी पाठ की संक्षिप्त प्राथमिकता को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: Ἕλληνι
  choice: यूनानी
  rationale: मुख्य पाठ मूल शब्द का प्रत्यक्ष जातीय-सांस्कृतिक रूप बनाए रखता है; पौलुस के प्रयोग में इसके व्यापक गैर-यहूदी अर्थ को पाद-टिप्पणी स्पष्ट करती है।
- source_word: τε ... καί
  choice: और ... भी
  rationale: यह यहूदी को दी गई प्राथमिकता के बाद यूनानी के समावेश को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘पहले यहूदी के लिए और यूनानी के लिए भी’ में Ἕλληνι का दायरा
  choice: मुख्य पाठ में ‘यूनानी’, और व्यापक गैर-यहूदी अर्थ पाद-टिप्पणी में
  alternative: मुख्य पाठ में ‘गैर-यहूदी’
  rationale: ‘यूनानी’ मूल पाठ की वास्तविक शब्दावली और ऐतिहासिक-सांस्कृतिक विशेषता को सुरक्षित रखता है, जबकि पाद-टिप्पणी यह स्वीकार करती है कि पौलुस के प्रयोग में यह शब्द व्यापक रूप से गैर-यहूदियों का प्रतिनिधित्व कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘शुभ समाचार’ अर्थ को पारदर्शी रखता है, जबकि ‘सुसमाचार’ को परिचित परंपरागत विकल्प के रूप में पाद-टिप्पणी में दिया गया है। वाक्य की दोहरी ‘क्योंकि’ संरचना मूल यूनानी के तर्कात्मक प्रवाह को बनाए रखती है।
