source:
  edition: SBLGNT
  text: Καὶ καθὼς οὐκ ἐδοκίμασαν τὸν θεὸν ἔχειν ἐν ἐπιγνώσει, παρέδωκεν αὐτοὺς ὁ θεὸς εἰς ἀδόκιμον νοῦν, ποιεῖν τὰ μὴ καθήκοντα,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/028.yaml
  text: And just as they did not see fit to have God in their knowledge[a], God gave them over to a debased mind, to do what is not fitting[b],
translation:
  language: hi
  text: और जिस प्रकार उन्होंने परमेश्वर को अपने ज्ञान में रखना उचित नहीं समझा[a], उसी प्रकार परमेश्वर ने उन्हें भ्रष्ट बुद्धि के हवाले कर दिया[b], कि वे ऐसे काम करें जो उचित नहीं हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को अपने ज्ञान में बनाए रखना उचित नहीं समझा।”
    reason: मूल वाक्यांश परमेश्वर को अपने ज्ञान में बनाए रखने का भाव देता है; इसे “परमेश्वर को सचमुच पहचानना” भी समझा जा सकता है।
  - marker: b
    text: “भ्रष्ट” के लिए प्रयुक्त यूनानी शब्द का अर्थ “जाँच में खरा न उतरने वाला” भी है; यह पहले आए “उचित नहीं समझा” से शब्द-संबंध बनाता है।
    reason: यूनानी में ἐδοκίμασαν और ἀδόκιμον के बीच का शब्द-खेल सहज हिंदी में पूरी तरह सुरक्षित नहीं रह सकता।
lexical_decisions:
- source_word: καθὼς
  choice: जिस प्रकार … उसी प्रकार
  rationale: यह यूनानी संयोजक तुलना के साथ न्यायपूर्ण अनुरूपता भी दिखाता है। हिंदी में यह संरचना उस संबंध को स्वाभाविक रूप से व्यक्त करती है, बिना उसे केवल कारणवाचक बना देने के।
- source_word: οὐκ ἐδοκίμασαν
  choice: उचित नहीं समझा
  rationale: यहाँ क्रिया जाँच-परख के बाद किसी बात को स्वीकार या योग्य मानने का भाव रखती है। यह हिंदी प्रयोग उस सोचे-समझे अस्वीकार को स्पष्ट करता है।
- source_word: ἔχειν ἐν ἐπιγνώσει
  choice: अपने ज्ञान में रखना
  rationale: यह मूल वाक्यांश की ठोस अभिव्यक्ति और उसकी संभावित अस्पष्टता को बनाए रखता है; इसे केवल ‘स्वीकार करना’ कहने से निहित अर्थ कुछ अधिक निश्चित हो जाता।
- source_word: παρέδωκεν
  choice: हवाले कर दिया
  rationale: यह न्यायिक रूप से छोड़ दिए जाने का भाव स्पष्ट करता है और रोमियों 1 के प्रसंग में दोहराई गई क्रिया के अनुरूप है।
- source_word: ἀδόκιμον νοῦν
  choice: भ्रष्ट बुद्धि
  rationale: आधुनिक हिंदी में यह स्वाभाविक और समझने योग्य है तथा ऐसी विचार-शक्ति का भाव देता है जो नैतिक कसौटी पर खरी नहीं उतरती। यूनानी शब्द-संबंध को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ποιεῖν τὰ μὴ καθήκοντα
  choice: ताकि वे ऐसे काम करें जो उचित नहीं हैं
  rationale: क्रियार्थक infinitive के उद्देश्य/परिणाम के खुले संबंध को ‘ताकि’ से सहज हिंदी में व्यक्त किया गया है; καθήκοντα के उचित-अनुचित भाव को सीधा रखा गया है।
theological_decisions:
- issue: परमेश्वर के ‘हवाले कर देने’ को दंड, अनुमति या परित्याग में से किसी एक व्यवस्थित सिद्धान्त के रूप में निश्चित करना
  choice: हवाले कर दिया
  alternative: उन्हें उनकी दशा में छोड़ दिया
  rationale: मूल क्रिया को सीधे रखा गया है, ताकि परमेश्वर की न्यायिक क्रिया का बल बना रहे और पाठ से आगे बढ़कर उसकी प्रक्रिया की व्याख्या न की जाए।
- issue: ἀδόκιμον νοῦν को बाद की धर्मवैज्ञानिक शब्दावली से तीव्र बनाना
  choice: भ्रष्ट बुद्धि
  alternative: निकृष्ट बुद्धि / त्याज्य मन
  rationale: ‘भ्रष्ट बुद्धि’ नैतिक विफलता बताती है, पर ‘त्याज्य’ या किसी संप्रदायगत तकनीकी पद द्वारा व्यक्ति की अंतिम दशा तय नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बुद्धि’ यहाँ केवल बौद्धिक क्षमता नहीं, बल्कि सोचने-समझने और नैतिक निर्णय करने की वृत्ति को व्यक्त करती है।
