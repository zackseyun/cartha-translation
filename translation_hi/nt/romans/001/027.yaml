id: ROM.1.27
reference: Romans 1:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁμοίως τε καὶ οἱ ἄρσενες ἀφέντες τὴν φυσικὴν χρῆσιν τῆς θηλείας ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν εἰς ἀλλήλους, ἄρσενες ἐν ἄρσεσιν τὴν ἀσχημοσύνην κατεργαζόμενοι καὶ τὴν ἀντιμισθίαν ἣν ἔδει τῆς πλάνης αὐτῶν ἐν ⸀ἑαυτοῖς ἀπολαμβάνοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/027.yaml
  text: And likewise the males[a], having abandoned the natural use of the female, were inflamed in their desire for one another[d][c][b], males with males committing indecency and receiving in themselves the due penalty for their error.
translation:
  language: hi
  text: और इसी प्रकार पुरुषों ने भी स्त्री के साथ स्वाभाविक यौन-संबंध छोड़ दिए और एक-दूसरे के प्रति अपनी कामना में जल उठे। पुरुष पुरुषों के साथ अशोभनीय काम करते हुए अपने भटकाव का वह उचित प्रतिफल अपने ही भीतर प्राप्त करते रहे, जो उन्हें मिलना था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρσενες / θηλείας
  choice: पुरुषों / स्त्री
  rationale: यूनानी के जैविक रूप से चिह्नित नर/मादा विरोध को हिन्दी में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है; ‘आदमियों’ की अपेक्षा ‘पुरुषों’ यहाँ अधिक उपयुक्त है।
- source_word: ἀφέντες
  choice: छोड़ दिए
  rationale: मुख्य क्रिया से पहले हुए त्याग को स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
- source_word: φυσικὴν χρῆσιν τῆς θηλείας
  choice: स्त्री के साथ स्वाभाविक यौन-संबंध
  rationale: χρῆσις का शाब्दिक अर्थ ‘उपयोग’ है, किंतु इस प्रसंग में उसका यौन आशय है; ‘यौन-संबंध’ अर्थ को स्पष्ट रखते हुए हिन्दी में अनावश्यक वस्तुकरण से बचता है।
- source_word: ἐξεκαύθησαν ἐν τῇ ὀρέξει αὐτῶν
  choice: अपनी कामना में जल उठे
  rationale: क्रिया की आग वाली छवि और ὄρεξις की तीव्र इच्छा—दोनों को बनाए रखता है; ‘वासना’ की अपेक्षा ‘कामना’ मूल संज्ञा से अधिक संयत है।
- source_word: εἰς ἀλλήλους
  choice: एक-दूसरे के लिए
  rationale: पारस्परिक दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἄρσενες ἐν ἄρσεσιν
  choice: पुरुष पुरुषों के साथ
  rationale: मूल में ἄρσενες की पुनरावृत्ति और उसके आलंकारिक बल को सुरक्षित रखता है।
- source_word: τὴν ἀσχημοσύνην κατεργαζόμενοι
  choice: निर्लज्ज काम करते रहे
  rationale: ἀσχημοσύνη के लज्जाजनक/अशोभनीय नैतिक भाव को बनाए रखता है, पर मूल से अधिक विशिष्ट क्रिया आरोपित नहीं करता।
- source_word: τὴν ἀντιμισθίαν ἣν ἔδει
  choice: उचित प्रतिफल
  rationale: ἀντιμισθία के अनुरूप प्रत्युत्तर या परिणाम और ἔδει के उचित/आवश्यक होने के भाव को संक्षेप में व्यक्त करता है; ‘दंड’ की अपेक्षा ‘प्रतिफल’ मूल की व्यापकता बचाता है।
- source_word: τῆς πλάνης αὐτῶν
  choice: अपने भटकाव का
  rationale: πλάνη की भूल और मार्ग से भटकने की छवि दोनों को बनाए रखता है।
- source_word: ἐν ἑαυτοῖς ἀπολαμβάνοντες
  choice: अपने ही भीतर पाते रहे
  rationale: प्रतिबिंबात्मक ἑαυτοῖς को सुरक्षित रखता है और परिणाम के ठीक स्वरूप को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: जैविक रूप से चिह्नित शब्दों को संबंधपरक भाषा में नरम करना या न करना
  choice: पुरुषों … स्त्री … पुरुष पुरुषों के साथ
  alternative: आदमी … औरत … आदमी आदमियों के साथ
  rationale: मूल यूनानी सामान्य संबंधपरक पदों के बजाय लिंग-चिह्नित पदों का प्रयोग करता है। हिन्दी की गरिमा और स्वाभाविकता बनाए रखते हुए उस विरोध को सुरक्षित रखा गया है।
- issue: नैतिक मूल्यांकन को मूल से अधिक स्पष्ट करना या न करना
  choice: निर्लज्ज काम
  alternative: समलैंगिक कृत्य
  rationale: ἀσχημοσύνη में नैतिक मूल्यांकन विद्यमान है, पर यूनानी यहाँ आधुनिक श्रेणीगत लेबल नहीं देता; इसलिए मूल से अधिक विशिष्ट अभिधान नहीं जोड़ा गया।
- issue: ἀντιμισθία को अनिवार्य रूप से दंड के रूप में सीमित करना या न करना
  choice: उचित प्रतिफल
  alternative: उचित दंड
  rationale: प्रसंग नकारात्मक परिणाम बताता है, फिर भी शब्द का मूल भाव अनुरूप प्रतिदान/प्रतिफल है। ‘उचित प्रतिफल’ इस नकारात्मक संदर्भ को रहने देता है बिना शब्दार्थ को अनावश्यक रूप से संकुचित किए।
- issue: ἐν ἑαυτοῖς के परिणाम को किसी विशिष्ट शारीरिक या मनोवैज्ञानिक अवस्था के रूप में पहचानना
  choice: अपने ही भीतर
  alternative: अपने शरीरों में
  rationale: मूल पाठ परिणाम की सटीक प्रकृति नहीं बताता। व्यापक प्रतिबिंबात्मक अभिव्यक्ति अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वर्तमान, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य में मूल की पुनरावृत्ति तथा अग्नि-रूपक सुरक्षित हैं। ‘यौन-संबंध’ प्रसंग को स्पष्ट करता है, जबकि ‘उचित प्रतिफल’ और ‘अपने ही भीतर’ मूल की अर्थगत व्यापकता तथा धर्मवैचारिक तनाव को बनाए रखते हैं।
