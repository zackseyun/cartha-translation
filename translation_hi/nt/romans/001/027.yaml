revisions:
- from: और इसी प्रकार पुरुषों ने भी स्त्री के साथ स्वाभाविक यौन-संबंध छोड़ दिए और एक-दूसरे के लिए अपनी कामना में जल उठे। पुरुष पुरुषों के साथ निर्लज्ज काम करते रहे और अपने भटकाव का उचित प्रतिफल अपने ही भीतर पाते रहे।
  to: और इसी प्रकार पुरुषों ने भी स्त्री के साथ स्वाभाविक यौन-संबंध छोड़ दिए और एक-दूसरे के प्रति अपनी कामना में जल उठे। पुरुष पुरुषों के साथ अशोभनीय काम करते हुए अपने भटकाव का वह उचित प्रतिफल अपने ही भीतर प्राप्त करते रहे, जो उन्हें मिलना था।
  rationale: The revision clarifies that the desire is mutual and directed toward one another, renders ἀσχημοσύνη as conduct that is itself shameful/indecent, and explicitly represents the relative clause ἣν ἔδει (‘which was fitting/necessary’) as ‘जो उन्हें मिलना था.’ It retains the source’s ambiguity concerning the nature of the recompense and the phrase ‘in themselves.’
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:58:56Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the verse’s sequence, reciprocal desire, repeated male terminology, and the deliberately unspecified sense of receiving the recompense ‘in themselves.’ However, ‘एक-दूसरे के लिए’ can suggest desire on behalf of one another rather than desire directed toward one another. ‘निर्लज्ज काम’ is less precise and natural for ἀσχημοσύνη, which denotes what is shameful or indecent. The iterative wording ‘करते रहे ... पाते रहे’ also adds a durative/repetitive nuance not clearly required by the Greek.
  naturalness: The Hindi is generally clear and suitably formal. ‘अशोभनीय काम’ is more idiomatic and accurately evaluative than ‘निर्लज्ज काम’; ‘एक-दूसरे के प्रति’ makes the reciprocal direction unambiguous. The revised second sentence preserves a natural Hindi flow while representing the Greek participial actions.
  terminology: ‘पुरुषों ... स्त्री ... पुरुष पुरुषों के साथ’ appropriately retains the sex-marked contrast without importing modern category labels. ‘स्वाभाविक यौन-संबंध’ is a clear contextual rendering of φυσικὴ χρῆσις. ‘उचित प्रतिफल’ appropriately preserves the broader recompense/consequence sense of ἀντιμισθία; the added relative clause represents ἣν ἔδει without forcing a specific nature for that recompense.
  issues:
  - severity: medium
    issue: Reciprocal-direction phrase
    rationale: ‘एक-दूसरे के लिए’ can mean ‘for one another’ in a benefactive sense. εἰς ἀλλήλους here indicates desire directed toward one another; ‘एक-दूसरे के प्रति’ is clearer.
  - severity: medium
    issue: Rendering of ἀσχημοσύνη
    rationale: ‘निर्लज्ज काम’ can describe acts done without shame, whereas ἀσχημοσύνη identifies the acts as shameful/indecent. ‘अशोभनीय काम’ more directly reflects the noun and is natural modern Hindi.
  - severity: low
    issue: Unnecessary iterative aspect
    rationale: ‘करते रहे’ and ‘पाते रहे’ can imply repeated or continuing action more strongly than the Greek construction requires. A participial Hindi construction better retains the relationship of the clauses.
  revised_text: और इसी प्रकार पुरुषों ने भी स्त्री के साथ स्वाभाविक यौन-संबंध छोड़ दिए और एक-दूसरे के प्रति अपनी कामना में जल उठे। पुरुष पुरुषों के साथ अशोभनीय काम करते हुए अपने भटकाव का वह उचित प्रतिफल अपने ही भीतर प्राप्त करते रहे, जो उन्हें मिलना था।
  revised_footnotes: []
  revision_rationale: The revision clarifies that the desire is mutual and directed toward one another, renders ἀσχημοσύνη as conduct that is itself shameful/indecent, and explicitly represents the relative clause ἣν ἔδει (‘which was fitting/necessary’) as ‘जो उन्हें मिलना था.’ It retains the source’s ambiguity concerning the nature of the recompense and the phrase ‘in themselves.’
