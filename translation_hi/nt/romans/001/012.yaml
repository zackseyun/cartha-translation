  text: that is[a], that I may be mutually encouraged among you through each other’s faith[c][b], both yours and mine.
translation:
  language: hi
  text: अर्थात्, तुम्हारे बीच तुम्हारे और मेरे साझा विश्वास के द्वारा मैं तुम्हारे साथ प्रोत्साहित होऊँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο δέ ἐστιν
  choice: अर्थात्
  rationale: यह पिछले कथन को स्पष्ट करता है; ‘अर्थात्’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक व्याख्यात्मक संयोजक है।
- source_word: συμπαρακληθῆναι
  choice: तुम्हारे साथ प्रोत्साहन पाऊँ
  rationale: συν- उपसर्ग साझा/परस्पर प्रोत्साहन का भाव देता है। प्रसंगानुसार निहित प्रथम पुरुष एकवचन दृष्टिकोण को ‘मैं’ से रखा गया है, जबकि ‘तुम्हारे साथ’ उस कार्य की पारस्परिकता स्पष्ट करता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: यह रोमी विश्वासियों के बीच घटने वाले सामाजिक और स्थानगत संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς ἐν ἀλλήλοις πίστεως
  choice: हम दोनों के विश्वास के द्वारा
  rationale: ἐν ἀλλήλοις और आगे के ὑμῶν τε καὶ ἐμοῦ को साथ पढ़ते हुए यह विश्वास की पारस्परिकता और प्रोत्साहन के साधन—दोनों को व्यक्त करता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις का आशय परमेश्वर/मसीह पर विश्वास से है; प्रसंग ‘विश्वासयोग्यता’ की अपेक्षा ‘विश्वास’ का समर्थन करता है।
- source_word: ὑμῶν τε καὶ ἐμοῦ
  choice: तुम्हारे और अपने—हम दोनों के
  rationale: यह पौलुस और रोमी विश्वासियों के विश्वास को संतुलित ढंग से सामने रखता है और ‘हम दोनों’ पारस्परिकता को स्पष्ट करता है।
theological_decisions:
- issue: क्या पौलुस केवल रोमियों को दृढ़ करना चाहता है या स्वयं भी उनके साथ प्रोत्साहन पाना चाहता है?
  choice: पौलुस और रोमी विश्वासियों के बीच पारस्परिक प्रोत्साहन
  alternative: मुख्यतः पौलुस द्वारा उनका एकतरफ़ा प्रोत्साहन
  rationale: συμπαρακληθῆναι का συν- तत्व तथा ‘तुम्हारे और मेरे’ की समाप्ति साझा प्रभाव दिखाती है; अनुवाद प्रेरित की भूमिका को एकतरफ़ा नहीं बनाता।
- issue: निहित कर्ता को ‘मैं’ माना जाए या ‘हम’?
  choice: प्रसंग के अनुसार ‘मैं’, पर ‘तुम्हारे साथ’ द्वारा साझा क्रिया व्यक्त की गई
  alternative: स्पष्ट बहुवचन ‘हम प्रोत्साहन पाएँ’
  rationale: यूनानी infinitive स्वयं व्यक्ति-वचन नहीं बताता; पिछले पद में पौलुस की प्रथम पुरुष इच्छा इसका कर्ता सुझाती है, जबकि संयुक्त क्रिया पारस्परिक भागीदारी बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परस्पर प्रोत्साहित होऊँ’ की कुछ कृत्रिम हिन्दी से बचते हुए ‘तुम्हारे साथ प्रोत्साहन पाऊँ’ चुना गया है।
