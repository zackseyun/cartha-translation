  yaml_path: translation/nt/romans/001/015.yaml
  text: So[a], for my part, I am eager to proclaim the good news also to you who are in Rome.
translation:
  language: hi
  text: इसलिए जहाँ तक मेरी बात है, मैं तुम लोगों को भी, जो रोम में हो, शुभ समाचार सुनाने[a] के लिए उत्सुक हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “सुसमाचार का प्रचार करने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष या परिणाम जोड़ता है; आधुनिक हिन्दी में ‘इसलिए’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ κατ’ ἐμὲ πρόθυμον
  choice: जहाँ तक मेरी बात है, मैं … के लिए उत्सुक हूँ
  rationale: यूनानी पदबंध संक्षिप्त और मुहावरेदार है। यह पौलुस की अपनी तत्पर इच्छा व्यक्त करता है; ‘उत्सुक’ πρόθυμον में निहित तत्परता और उत्साह, दोनों को सामने लाता है।
- source_word: καὶ ὑμῖν
  choice: तुम लोगों को भी
  rationale: καὶ रोम के श्रोताओं को उन अन्य लोगों और स्थानों के साथ सम्मिलित करता है जहाँ पौलुस शुभ समाचार सुनाना चाहता है।
- source_word: τοῖς ἐν Ῥώμῃ
  choice: जो रोम में हो
  rationale: यह संबोधित लोगों की पहचान उनके रोम में होने के आधार पर करता है और सीधे संबोधन के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: εὐαγγελίσασθαι
  choice: शुभ समाचार सुनाने
  rationale: क्रिया का अर्थ शुभ समाचार घोषित करना या सुसमाचार सुनाना है। ‘शुभ समाचार सुनाना’ सामान्य पाठकों के लिए स्पष्ट है और इसे केवल औपचारिक उपदेश देने तक सीमित नहीं करता।
