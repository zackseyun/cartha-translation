  text: I am under obligation both to Greeks and to barbarians[a], both to the wise and to the foolish.
translation:
  language: hi
  text: मैं यूनानियों और गैर-यूनानियों[a] दोनों का, और बुद्धिमानों और मूर्खों दोनों का ऋणी हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बर्बरों’; उस समय यह यूनानी सांस्कृतिक दृष्टि से गैर-यूनानियों या विदेशी भाषा बोलनेवालों के लिए प्रचलित शब्द था, और यहाँ इसका अर्थ आवश्यक रूप से असभ्य या क्रूर लोग नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἕλλησίν
  choice: यूनानियों
  rationale: यह शब्द यूनानी जातीय-सांस्कृतिक समुदाय को दर्शाता है; ‘यूनानियों’ आधुनिक हिन्दी में इसका सीधा और स्वाभाविक रूप है।
- source_word: βαρβάροις
  choice: गैर-यूनानियों
  rationale: प्राचीन यूनानी सांस्कृतिक प्रयोग में यह मुख्यतः यूनानियों के विपरीत, अन्य भाषा और संस्कृति के लोगों को सूचित करता है। हिन्दी में ‘बर्बरों’ से अनावश्यक रूप से असभ्यता या क्रूरता का भाव आता है, इसलिए ‘गैर-यूनानियों’ मूल विरोध को अधिक स्पष्ट रखता है।
- source_word: σοφοῖς
  choice: बुद्धिमानों
  rationale: यह ἀνοήτοις के साथ बने सीधे विरोध को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: ἀνοήτοις
  choice: मूर्खों
  rationale: यह ‘बुद्धिमानों’ के साथ मूल का अर्थगत विरोध सुरक्षित रखता है; ‘अशिक्षितों’ अर्थ को केवल शिक्षा तक सीमित कर देता।
- source_word: ὀφειλέτης
  choice: ऋणी
  rationale: मूल संज्ञा का शाब्दिक रूप ‘ऋणी’ है। यहाँ आर्थिक कर्ज नहीं, बल्कि पौलुस पर रखे गए दायित्व का रूपक है; हिन्दी में यह रूपक समझने योग्य और प्रभावी है।
- source_word: τε ... καὶ / τε ... καὶ
  choice: दोनों ... और ... दोनों
  rationale: यह यूनानी वाक्य की दो संतुलित जोड़ियों—यूनानी/गैर-यूनानी और बुद्धिमान/मूर्ख—को हिन्दी में स्पष्ट रखता है।
