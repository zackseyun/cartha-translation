lexical_decisions:
- source_word: φάσκοντες
  choice: बताते हुए
  rationale: वर्तमान कृदन्त उनके अपने विषय में किए गए दावे को व्यक्त करता है। ‘अपने को ... बताते हुए’ आधुनिक हिन्दी में स्वाभाविक है और कथन की विडंबना बनाए रखता है।
- source_word: εἶναι
  choice: अपने को
  rationale: यूनानी में यह φάσκοντες के साथ दावे की विषय-वस्तु बताने वाला infinitive है; हिन्दी में ‘अपने को ... बताते हुए’ संरचना उसी अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: σοφοὶ
  choice: बुद्धिमान
  rationale: यह विधेयात्मक विशेषण है। ‘बुद्धिमान’ संक्षिप्त है और पौलुस के मूल्यांकन तथा विरोधाभास को सुरक्षित रखता है।
- source_word: ἐμωράνθησαν
  choice: वे मूर्ख बन गए
  rationale: यहाँ क्रिया का परिणामसूचक अर्थ ‘मूर्ख बन गए’ से स्पष्ट होता है। यह ‘बुद्धिमान—मूर्ख’ के तीखे अलंकारिक विरोध को भी बनाए रखता है, जबकि कर्मवाच्य कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: ἐμωράνθησαν को गुणसूचक ‘मूर्ख हो गए’ या अधिक तीखे व्यक्तिवाचक ‘मूर्ख बन गए’ के रूप में प्रस्तुत करना
  choice: मूर्ख बन गए
  alternative: मूर्ख हो गए; मूर्ख बना दिए गए
  rationale: यूनानी वाक्य की विडंबना और σοφοὶ के साथ उसका सीधा विरोध ‘मूर्ख बन गए’ में अधिक स्पष्ट है। ‘बना दिए गए’ अस्पष्ट कर्मवाच्य को हिन्दी में बाहरी कर्ता की ओर अधिक झुका सकता है, इसलिए उसे मुख्य पाठ में नहीं रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘अपने को’ का प्रयोग आत्म-दावे को स्पष्ट करता है और ‘बुद्धिमान—मूर्ख’ का मूल विरोध सुरक्षित रखता है।
