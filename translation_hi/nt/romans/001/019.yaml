id: ROM.1.19
reference: Romans 1:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διότι τὸ γνωστὸν τοῦ θεοῦ φανερόν ἐστιν ἐν αὐτοῖς, ὁ ⸂θεὸς γὰρ⸃ αὐτοῖς ἐφανέρωσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/019.yaml
  text: because what can be known about God is plain among them, for God has made it plain to them.
translation:
  language: hi
  text: क्योंकि परमेश्वर के विषय में जो कुछ जाना जा सकता है, वह उनके बीच स्पष्ट है[a], क्योंकि परमेश्वर ने उसे उन्हें स्पष्ट कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनमें” अथवा “उनके भीतर”।
    reason: यूनानी ἐν αὐτοῖς सामूहिक/सार्वजनिक स्थान के साथ-साथ आंतरिक स्थान भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ हिन्दी में कारण-संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: τὸ γνωστὸν τοῦ θεοῦ
  choice: परमेश्वर के विषय में जो कुछ जाना जा सकता है
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग विशेषण τὸ γνωστόν यहाँ उस बात को सूचित करता है जो ज्ञान के लिए सुलभ है; ‘के विषय में’ सम्बन्धवाचक τοῦ θεοῦ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: φανερόν
  choice: प्रकट
  rationale: यह खुले तौर पर दिखाई या समझ में आने की धारणा देता है और आगे के ἐφανέρωσεν के साथ शब्दगत संबंध बनाए रखता है।
- source_word: ἐν αὐτοῖς
  choice: उनके बीच
  rationale: ἐν αὐτοῖς का सामूहिक/सार्वजनिक अर्थ मुख्य पाठ में रखा गया है; ‘उनमें’ वाला संभावित आंतरिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὁ θεὸς γὰρ αὐτοῖς ἐφανέρωσεν
  choice: क्योंकि परमेश्वर ने उसे उन पर प्रकट कर दिया है
  rationale: ‘प्रकट’ पहले आए φανερόν से संबंध बनाए रखता है; ‘उन पर प्रकट’ αὐτοῖς के प्रति किए गए ईश्वरीय प्रकटीकरण को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐν αὐτοῖς का अर्थ
  choice: उनके बीच
  alternative: उनमें / उनके भीतर
  rationale: यूनानी पदबंध सार्वजनिक-सामूहिक या आंतरिक अर्थ दे सकता है। सृष्टि में उपलब्ध प्रकाशन के निकटवर्ती संदर्भ के कारण मुख्य पाठ में सामूहिक अर्थ चुना गया है, पर वास्तविक अस्पष्टता पादटिप्पणी में बनाए रखी गई है।
- issue: τὸ γνωστὸν का सामर्थ्यसूचक या तथ्यसूचक अर्थ
  choice: जो कुछ जाना जा सकता है
  alternative: जो कुछ ज्ञात है
  rationale: यह रूप ‘जानने योग्य/ज्ञान के लिए सुलभ’ और ‘ज्ञात’ दोनों छायाएँ रख सकता है। संदर्भ में मनुष्यों के लिए उपलब्ध परमेश्वर-ज्ञान पर बल होने के कारण सामर्थ्यसूचक अनुवाद चुना गया, बिना उसके दायरे को अनावश्यक रूप से परिभाषित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली। ‘परमेश्वर’, ‘प्रकट’ और ‘के विषय में’ जैसे परिचित शब्द चुने गए हैं; वास्तविक यूनानी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
