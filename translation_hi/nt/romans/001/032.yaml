  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἵτινες τὸ δικαίωμα τοῦ θεοῦ ἐπιγνόντες, ὅτι οἱ τὰ τοιαῦτα πράσσοντες ἄξιοι θανάτου εἰσίν, οὐ μόνον αὐτὰ ποιοῦσιν ἀλλὰ καὶ συνευδοκοῦσιν τοῖς πράσσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/032.yaml
  text: who[a], although they know God's righteous decree—that those who practice such things are worthy of death—not only do them but also approve of those who practice them.
translation:
  language: hi
  text: वे परमेश्वर के धर्मसंगत निर्णय[a] को जानते हुए कि ऐसे काम करनेवाले मृत्यु के योग्य हैं, न केवल स्वयं ऐसे काम करते हैं, बल्कि ऐसे काम करनेवालों का समर्थन भी करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायपूर्ण विधान,” “धर्मसंगत अपेक्षा,” अथवा “न्यायपूर्ण फैसला।”
    reason: δικαίωμα के विधिक, नैतिक और न्यायिक अर्थ-क्षेत्र को दर्शाने वाले सम्भव विकल्प।
lexical_decisions:
- source_word: οἵτινες
  choice: वे
  rationale: यह पिछले प्रसंग में वर्णित लोगों की ओर संकेत करनेवाला संबंधवाचक रूप है; हिन्दी में स्वतंत्र पद के आरम्भ पर ‘वे’ स्वाभाविक रूप से उस संबंध को आगे बढ़ाता है।
- source_word: δικαίωμα
  choice: धर्मसंगत निर्णय
  rationale: यहाँ शब्द परमेश्वर के न्यायपूर्ण नैतिक-विधिक निर्णय को व्यक्त करता है, जिसे आगे मृत्यु के योग्य होने वाले कथन से स्पष्ट किया गया है।
- source_word: ἐπιγνόντες
  choice: जानते हैं
  rationale: कृदन्त वास्तविक जानकारी या पहचान को दर्शाता है; अगले विरोधसूचक वाक्य में ‘फिर भी’ इसका concessive बल स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: οἱ τὰ τοιαῦτα πράσσοντες
  choice: ऐसे काम करते रहनेवाले
  rationale: यह निरन्तर या अभ्यस्त आचरण का भाव बनाए रखता है, न कि केवल किसी एक घटना का।
- source_word: ἄξιοι θανάτου
  choice: मृत्यु के योग्य
  rationale: मूल की न्यायिक गंभीरता को सीधे बनाए रखता है और मृत्यु के स्वरूप या दायरे को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ποιοῦσιν
  choice: स्वयं ऐसे काम करते हैं
  rationale: ‘स्वयं’ οὐ μόνον αὐτὰ के विरोध को स्पष्ट करता है और ‘करते हैं’ ποιοῦσιν का सहज हिन्दी रूप है।
- source_word: συνευδοκοῦσιν
  choice: समर्थन भी करते हैं
  rationale: यह दूसरों के आचरण से सहमति और अनुमोदन का भाव व्यक्त करता है; केवल साथ देने या भाग लेने तक अर्थ को सीमित नहीं करता।
- source_word: τοῖς πράσσουσιν
  choice: ऐसा करनेवालों
  rationale: दूसरों के उसी प्रकार के आचरण को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मृत्यु के योग्य’ का आशय
  choice: इसे परमेश्वर के न्यायिक निर्णय के रूप में रखा गया है, पर मृत्यु के पूरे स्वरूप को परिभाषित नहीं किया गया।
  alternative: इसे मुख्यतः नागरिक मृत्युदंड अथवा विशेष रूप से युगान्तकालीन मृत्यु के अर्थ में सीमित करना।
  rationale: पद स्वयं ‘मृत्यु’ का दायरा स्पष्ट नहीं करता; इसलिए अनुवाद उसके धार्मिक और न्यायिक भार को सुरक्षित रखते हुए किसी एक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पठन के अनुकूल रूप। ‘धर्मसंगत निर्णय’ सामान्य पाठक के लिए अर्थपूर्ण रहते हुए मूल के न्यायपूर्ण-विधिक भाव को सुरक्षित रखता है; दो वाक्यों में विभाजन हिन्दी में स्पष्टता बढ़ाता है।
