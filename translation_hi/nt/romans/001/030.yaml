  text: καταλάλους, θεοστυγεῖς, ὑβριστάς, ὑπερηφάνους, ἀλαζόνας, ἐφευρετὰς κακῶν, γονεῦσιν ἀπειθεῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/030.yaml
  text: slanderers[a], hateful to God, insolent, arrogant, boastful, inventors of evil, disobedient to parents,
translation:
  language: hi
  text: दूसरों को बदनाम करनेवाले, परमेश्वर से घृणा करनेवाले[a], उद्दंड, घमंडी, डींग मारनेवाले, बुराई के नए-नए उपाय निकालनेवाले और माता-पिता की आज्ञा न माननेवाले,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर द्वारा घृणा किए गए।”
    reason: θεοστυγεῖς का कर्मवाच्य अर्थ भी संभव माना गया है; पादटिप्पणी इस वास्तविक वैकल्पिक समझ को सुरक्षित रखती है।
lexical_decisions:
- source_word: καταλάλους
  choice: दूसरों को बदनाम करनेवाले
  rationale: यह शब्द दूसरों के विरुद्ध उनकी बदनामी करने के ढंग से बोलनेवालों को दर्शाता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट है और केवल सामान्य चुगली की अपेक्षा शब्द की हानिकारक नैतिक शक्ति को बेहतर रखती है।
- source_word: θεοστυγεῖς
  choice: परमेश्वर से घृणा करनेवाले
  rationale: क्रियाशील अर्थ में यह उन लोगों का वर्णन करता है जो परमेश्वर से घृणा करते हैं। यह दोष-सूची में मानवीय प्रवृत्तियों और आचरण के क्रम के अनुकूल है; कर्मवाच्य अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὑβριστάς
  choice: उद्दंड
  rationale: यह शब्द घमंड से भरे, अपमानजनक और दूसरों के साथ दुर्व्यवहार करनेवाले रवैये को समेटता है। “उद्दंड” संक्षिप्त और स्वाभाविक है तथा अर्थ को केवल शारीरिक हिंसा तक सीमित नहीं करता।
- source_word: ὑπερηφάνους
  choice: घमंडी
  rationale: यह अपने को दूसरों से ऊँचा समझने की प्रवृत्ति को स्पष्ट, प्रचलित हिन्दी में व्यक्त करता है और अगले शब्द में आनेवाली डींग मारने की धारणा से अलग रहता है।
- source_word: ἀλαζόνας
  choice: डींग मारनेवाले
  rationale: यह दिखावटी आत्म-प्रशंसा करनेवालों या शेखीबाजों को दर्शाता है। यह रूप आधुनिक हिन्दी में सहज है और यूनानी संज्ञा की मुख्य धारणा रखता है।
- source_word: ἐφευρετὰς κακῶν
  choice: बुराई के नए-नए उपाय निकालनेवाले
  rationale: वाक्यांश उन लोगों को दर्शाता है जो बुराई करने के नए तरीके गढ़ते हैं। यह हिन्दी में स्वाभाविक रहते हुए यूनानी में निहित खोजी या आविष्कारशील दुष्टता को व्यक्त करता है।
- source_word: γονεῦσιν ἀπειθεῖς
  choice: माता-पिता की आज्ञा न माननेवाले
  rationale: यह माता-पिता के प्रति अवज्ञा को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है तथा मूल का संबंधपरक केंद्र बनाए रखता है।
theological_decisions:
- issue: θεοστυγεῖς का वाच्य और अर्थ
  choice: 'क्रियाशील अर्थ: “परमेश्वर से घृणा करनेवाले”'
  alternative: 'कर्मवाच्य अर्थ: “परमेश्वर की दृष्टि में घृणित” अथवा “परमेश्वर द्वारा घृणा किए गए”'
  rationale: दोष-सूची में आसपास के सभी पद मानवीय स्वभाव या व्यवहार बताते हैं, इसलिए क्रियाशील अर्थ प्रसंग में अधिक स्वाभाविक है। फिर भी शब्द के ऐतिहासिक रूप से चर्चित कर्मवाच्य अर्थ को दबाया नहीं गया, बल्कि पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यह पद एक चलती हुई दोष-सूची का अंश है, इसलिए अंत में अल्पविराम रखा गया है। पास-पास के ὑπερηφάνους और ἀλαζόνας के भेद को क्रमशः “घमंडी” और “डींग मारनेवाले” से बनाए रखा गया है।
