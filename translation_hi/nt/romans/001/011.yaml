- source_word: εἰς τὸ στηριχθῆναι ὑμᾶς
  choice: जिससे तुम दृढ़ किए जाओ
  rationale: यह यूनानी के उद्देश्य/परिणाम और उसके कर्मवाच्य रूप, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: क्या ‘आत्मिक वरदान’ किसी विशिष्ट चमत्कारी करिश्मे को दर्शाता है या व्यापक आत्मिक लाभ को
  choice: कोई आत्मिक वरदान
  alternative: पवित्र आत्मा का कोई वरदान; कोई अनुग्रहपूर्ण आत्मिक लाभ
  rationale: यूनानी पदबंध किसी संकीर्ण तकनीकी अर्थ को अनिवार्य नहीं करता; चुना हुआ रूप वास्तविक अर्थगत खुलापन बनाए रखता है और किसी सम्प्रदायगत व्याख्या को आरोपित नहीं करता।
- issue: दृढ़ करने में पौलुस की सक्रिय भूमिका को प्रमुख बनाया जाए या यूनानी कर्मवाच्य को सुरक्षित रखा जाए
  choice: जिससे तुम दृढ़ किए जाओ
  alternative: तुम्हें दृढ़ करने के लिए
  rationale: मुख्य पाठ में कर्मवाच्य मूल रूप को बनाए रखता है, जबकि सक्रिय और अधिक सहज हिन्दी विकल्प को पादटिप्पणी में रखा गया है; इससे अगले पद में आने वाली पारस्परिकता को पहले से सीमित नहीं किया जाता।
