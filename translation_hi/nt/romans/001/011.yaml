  rationale: यूनानी पाठ की अनिश्चितता को बनाए रखता है और किसी विशेष वरदान की पहचान नहीं करता।
- source_word: μεταδῶ
  choice: तुम्हारे साथ ... बाँट सकूँ
  rationale: यह देने या सहभागी बनाने के भाव को व्यक्त करता है और हिन्दी में स्वाभाविक है; वैकल्पिक अधिक एकतरफा अर्थ पादटिप्पणी में दिया गया है।
- source_word: χάρισμα
  choice: वरदान
  rationale: यह χάρισμα का प्रचलित और संक्षिप्त बाइबलीय हिन्दी समतुल्य है, जिसमें अनुग्रह से मिले दान का भाव निहित है।
- source_word: πνευματικὸν
