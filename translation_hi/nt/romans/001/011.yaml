  text: क्योंकि मैं तुम्हें देखने की बहुत लालसा रखता हूँ, ताकि मैं तुम्हें कोई आत्मिक वरदान प्रदान कर सकूँ[a], जिससे तुम दृढ़ किए जाओ[b]।
