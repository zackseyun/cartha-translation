  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पर सहज दोष-सूची वाला रूप अपनाया गया है। समानार्थी यूनानी शब्दों के भेद को दुष्टता/दुर्भावना/बदनीयती द्वारा यथासंभव बनाए रखा गया है। पद अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
