id: ROM.1.29
reference: Romans 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πεπληρωμένους πάσῃ ⸀ἀδικίᾳ πονηρίᾳ πλεονεξίᾳ κακίᾳ, μεστοὺς φθόνου φόνου ἔριδος δόλου κακοηθείας, ψιθυριστάς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/029.yaml
  text: filled with every kind of unrighteousness[a], evil, greed, and malice; full of envy, murder, strife, deceit, and maliciousness; whisperers[b],
translation:
  language: hi
  text: वे हर प्रकार की अधार्मिकता[a], दुष्टता, लोभ और दुर्भावना से भरे हुए थे; वे ईर्ष्या, हत्या, कलह, छल और बदनीयती से परिपूर्ण थे; वे कानाफूसी करके बदनाम करनेवाले[b] थे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारी अधार्मिकता”; यूनानी वाक्यांश व्यापक और समग्र अर्थ व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “चुगली करनेवाले” या “छिपकर निंदा करनेवाले” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πεπληρωμένους
  choice: भरे हुए थे
  rationale: पूर्ण निष्क्रिय कृदंत से बनी वर्तमान परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग के मुख्य क्रियापद के साथ भूतकाल-सामंजस्य भी रखता है।
- source_word: πάσῃ
  choice: हर प्रकार की
  rationale: एकवचन भाववाचक संज्ञा के साथ व्यापकता को सहज हिन्दी में प्रकट करता है।
- source_word: ἀδικίᾳ
  choice: अधार्मिकता
  rationale: केवल सामाजिक अन्याय नहीं, बल्कि परमेश्वर और नैतिकता के संबंध में व्यापक अनुचितता का भाव बनाए रखता है।
- source_word: πονηρίᾳ
  choice: दुष्टता
  rationale: सामान्य नैतिक बुराई के लिए स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी शब्द है।
- source_word: πλεονεξίᾳ
  choice: लोभ
  rationale: अधिक पाने और हथियाने की लालसा को संक्षेप और सामान्य भाषा में व्यक्त करता है।
- source_word: κακίᾳ
  choice: दुर्भावना
  rationale: πονηρία की सामान्य दुष्टता से अलग, दूसरों के प्रति बुरी मंशा का अर्थ उभारता है।
- source_word: μεστοὺς
  choice: परिपूर्ण थे
  rationale: पहले आए πεπληρωμένους से शब्दगत भिन्नता बनाए रखते हुए पूर्णता की तीव्रता व्यक्त करता है।
- source_word: φθόνου
  choice: ईर्ष्या
  rationale: दूसरे की भलाई या उपलब्धि से दुखी होनेवाली वृत्ति का मानक हिन्दी पर्याय है।
- source_word: φόνου
  choice: हत्या
  rationale: दोष-सूची में नैतिक रूप से आरोपित अवैध वध का अर्थ स्पष्ट करता है।
- source_word: ἔριδος
  choice: कलह
  rationale: झगड़ालू विरोध और विवाद की प्रवृत्ति के लिए संक्षिप्त तथा प्रचलित शब्द है।
- source_word: δόλου
  choice: छल
  rationale: जानबूझकर धोखा देने के भाव को साफ और स्वाभाविक रूप से व्यक्त करता है।
- source_word: κακοηθείας
  choice: बदनीयती
  rationale: दुर्भावना से अर्थगत निकटता रखते हुए भी दूषित मनोवृत्ति और बुरी नीयत की अलग छाया को बचाता है।
- source_word: ψιθυριστάς
  choice: कानाफूसी करके बदनाम करनेवाले
  rationale: शब्द के गुप्त या दबे स्वर में दूसरों के विरुद्ध बोलने के आशय को सामान्य पाठक के लिए स्पष्ट करता है।
