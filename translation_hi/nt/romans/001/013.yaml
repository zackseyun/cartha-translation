id: ROM.1.13
reference: Romans 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ θέλω δὲ ὑμᾶς ἀγνοεῖν, ἀδελφοί, ὅτι πολλάκις προεθέμην ἐλθεῖν πρὸς ὑμᾶς, καὶ ἐκωλύθην ἄχρι τοῦ δεῦρο, ἵνα τινὰ καρπὸν σχῶ καὶ ἐν ὑμῖν καθὼς καὶ ἐν τοῖς λοιποῖς ἔθνεσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/013.yaml
  text: I do not want you to be unaware[a], brothers, that I have often planned to come to you—but have been prevented until now—so that I might have some fruit among you also[c][b], just as among the rest of the Gentiles.
translation:
  language: hi
  text: भाइयो,[a] मैं नहीं चाहता कि तुम इस बात से अनजान रहो कि मैंने कई बार तुम्हारे पास आने का इरादा किया, पर अब तक मुझे रोका गया है, ताकि जैसे बाकी गैर-यहूदियों के बीच, वैसे ही तुम्हारे बीच भी मुझे कुछ फल मिले।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘भाइयो’; यहाँ संबोधन में स्त्री और पुरुष दोनों विश्वासी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘फल’ से आशय उनके बीच पौलुस की सेवकाई से होने वाले परिणाम से है।
    reason: cultural_note
  - marker: c
    text: या ‘बाकी राष्ट्रों के बीच’।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ θέλω ... ἀγνοεῖν
  choice: मैं नहीं चाहता कि तुम ... अनजान रहो
  rationale: मूल की निषेधात्मक संरचना और पौलुस के प्रचलित कथन-ढंग को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀδελφοί
  choice: भाइयो और बहनो
  rationale: व्याकरणिक रूप पुल्लिंग बहुवचन है, पर रोमी विश्वासियों की मिश्रित सभा को संबोधन होने के कारण हिन्दी में समावेशी अर्थ स्पष्ट किया गया है; शाब्दिक विकल्प पादटिप्पणी में है।
- source_word: πολλάκις προεθέμην
  choice: मैंने बहुत बार ... आने की योजना बनाई
  rationale: बार-बार किए गए पूर्व निश्चय को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκωλύθην ἄχρι τοῦ δεῦρο
  choice: अब तक मुझे रोका गया है
  rationale: कर्मवाच्य बाहरी बाधा को खुला रखता है और ἄχρι τοῦ δεῦρο का स्वाभाविक कालगत अर्थ देता है।
- source_word: ἵνα τινὰ καρπὸν σχῶ
  choice: मुझे कुछ फल मिले
  rationale: पौलुस के कृषि-रूपक को सुरक्षित रखता है; उसका सेवकाई-संबंधी आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: समूह के मध्य फल प्राप्त होने के प्रसंग में हिन्दी का स्वाभाविक प्रयोग है, जबकि ‘तुममें’ की अनावश्यक अस्पष्टता से बचता है।
- source_word: τοῖς λοιποῖς ἔθνεσιν
  choice: बाकी गैर-यहूदियों के बीच
  rationale: पौलुस के इस प्रसंग में ἔθνη का सबसे संभावित अर्थ गैर-यहूदी लोग है; λοιποί से रोम के विश्वासियों का उसी व्यापक सेवाक्षेत्र में होना सूचित होता है।
theological_decisions:
- issue: ἔθνη का अर्थ
  choice: गैर-यहूदी
  alternative: अन्य राष्ट्र
  rationale: पौलुस की गैर-यहूदियों के बीच प्रेरिताई और रोमी पाठकों की तुलना के प्रसंग में जातीय-धार्मिक अर्थ अधिक संभावित है, पर मूल शब्द ‘राष्ट्रों’ का अर्थ भी ले सकता है; इसे पादटिप्पणी में रखा गया है।
- issue: καρπός का आशय
  choice: मुख्य पाठ में ‘फल’ रूपक बनाए रखा
  alternative: सेवकाई का परिणाम / उपज
  rationale: मूल की रूपकात्मक और कुछ हद तक खुली भाषा को किसी एक विशेष परिणाम—जैसे मन-फिराव, विश्वास की वृद्धि, या सहायता—तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। लंबे यूनानी वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘अब’ को केवल ἄχρι τοῦ δεῦρο के भीतर ‘अब तक’ के रूप में रखा गया है; आरंभ में कोई अतिरिक्त संवाद-सूचक ‘अब’ नहीं जोड़ा गया।
