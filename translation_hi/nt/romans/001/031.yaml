  text: ἀσυνέτους, ἀσυνθέτους, ⸀ἀστόργους, ἀνελεήμονας·
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/031.yaml
  text: senseless[a], faithless, heartless[b], merciless.
translation:
  language: hi
  text: समझहीन, वचन न निभानेवाले[a], स्नेहहीन[b] और दयाहीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समझौते या प्रतिज्ञाएँ तोड़नेवाले” अथवा “अविश्वसनीय।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ विशेष रूप से परिवार के सदस्यों के प्रति स्वाभाविक स्नेह के अभाव का भाव हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀσυνέτους
  choice: समझहीन
  rationale: यह शब्द समझ और विवेक के अभाव को व्यक्त करता है। ‘समझहीन’ संक्षिप्त और स्वाभाविक है तथा इसे केवल कम बुद्धि होने तक सीमित नहीं करता।
- source_word: ἀσυνθέτους
  choice: वचन न निभानेवाले
  rationale: यह उन लोगों को दर्शाता है जो समझौते, प्रतिज्ञा या दिए हुए वचन पर कायम नहीं रहते। यह अभिव्यक्ति आधुनिक हिन्दी में संबंधपरक और नैतिक अविश्वसनीयता को स्पष्ट करती है।
- source_word: ἀστόργους
  choice: स्नेहहीन
  rationale: यह στοργή, विशेषकर परिवार के सदस्यों के प्रति स्वाभाविक लगाव और स्नेह, के अभाव को दर्शाता है। संक्षिप्त अनुवाद के साथ पारिवारिक अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀνελεήμονας
  choice: दयाहीन
  rationale: यह दया अथवा करुणा के अभाव का सीधा और गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त दुर्गुण-सूची की लय रखी गई है। शब्दावली साधारण पाठकों के लिए सहज, पर गरिमापूर्ण है; यूनानी शब्दों की संबंधपरक और पारिवारिक अर्थ-छायाएँ पादटिप्पणियों में स्पष्ट की गई हैं।
