source:
  edition: SBLGNT
  text: οἵτινες μετήλλαξαν τὴν ἀλήθειαν τοῦ θεοῦ ἐν τῷ ψεύδει, καὶ ἐσεβάσθησαν καὶ ἐλάτρευσαν τῇ κτίσει παρὰ τὸν κτίσαντα, ὅς ἐστιν εὐλογητὸς εἰς τοὺς αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/025.yaml
  text: who exchanged the truth of God for the lie, and revered and served the creation rather than the Creator, who is blessed forever. Amen.
translation:
  language: hi
  text: उन्होंने परमेश्वर की सच्चाई को उस झूठ से बदल दिया, और सृष्टिकर्ता के बजाय सृष्टि की आराधना की और उसकी सेवा की। सृष्टिकर्ता युगानुयुग धन्य है। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετήλλαξαν ... ἐν
  choice: …को …से बदल दिया
  rationale: यह स्वाभाविक हिन्दी में किसी सत्य वस्तु को त्यागकर उसके स्थान पर दूसरी वस्तु अपनाने का भाव व्यक्त करता है।
- source_word: τὴν ἀλήθειαν τοῦ θεοῦ
  choice: परमेश्वर की सच्चाई
  rationale: सम्बन्धकारक की व्यापकता बनाए रखी गई है; इसे केवल ‘परमेश्वर के विषय का सत्य’ तक सीमित नहीं किया गया।
- source_word: τῷ ψεύδει
  choice: उस झूठ
  rationale: यूनानी निश्चित उपपद को दर्शाता है और पिछले प्रसंग में वर्णित मूर्तिपूजक असत्य की ओर संकेत बनाए रखता है।
- source_word: ἐσεβάσθησαν
  choice: पूजनीय माना
  rationale: यह धार्मिक श्रद्धा और सम्मान का भाव देता है, जबकि अगले क्रियापद में व्यक्त सेवा से अनावश्यक पुनरुक्ति नहीं करता।
- source_word: ἐλάτρευσαν
  choice: सेवा की
  rationale: धार्मिक उपासना-सेवा के अर्थ को सरल और प्रतिष्ठित हिन्दी में व्यक्त करता है।
- source_word: τῇ κτίσει
  choice: सृष्टि
  rationale: सृजी हुई समस्त व्यवस्था या सृष्ट वस्तुओं के सामूहिक भाव को सुरक्षित रखता है।
- source_word: παρὰ τὸν κτίσαντα
  choice: सृष्टिकर्ता के बजाय
  rationale: 'तुलनात्मक विरोध स्पष्ट करता है: सम्मान और सेवा सृष्टिकर्ता को न देकर सृष्टि को दी गई।'
- source_word: εὐλογητὸς εἰς τοὺς αἰῶνας
  choice: युगानुयुग धन्य
  rationale: स्थायी स्तुतिपरक सूत्र को संक्षिप्त, पारंपरिक और सुबोध हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: सृष्टि और सृष्टिकर्ता का विरोध
  choice: सृष्टिकर्ता के बजाय सृष्टि
  alternative: सृष्टिकर्ता से बढ़कर सृष्टि
  rationale: παρά यहाँ गलत आराधना के प्रतिस्थापन या वरीयता का भाव रख सकता है। ‘के बजाय’ प्रसंग के मुख्य विरोध को स्पष्ट करता है, बिना सृष्टि को सृष्टिकर्ता से वस्तुतः श्रेष्ठ बताने के।
- issue: स्तुतिवचन का कर्ता
  choice: ‘सृष्टिकर्ता’ को दूसरे वाक्य में स्पष्ट रूप से दोहराया
  alternative: ‘जो युगानुयुग धन्य है’
  rationale: यूनानी सम्बन्धवाचक सर्वनाम सृष्टिकर्ता को संदर्भित करता है। हिन्दी में अलग वाक्य और संज्ञा की पुनरावृत्ति संदर्भ को स्वाभाविक एवं अस्पष्टतारहित बनाती है।
- issue: ἐσεβάσθησαν और ἐλάτρευσαν के बीच भेद
  choice: ‘पूजनीय माना’ और ‘सेवा की’
  alternative: ‘पूजा और सेवा की’
  rationale: 'दो निकटवर्ती किन्तु भिन्न यूनानी क्रियाओं का अंतर रखा गया है: पहली धार्मिक श्रद्धा/सम्मान, दूसरी उपासना-संबंधी सेवा को व्यक्त करती है।'
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘आमीन’ प्रचलित बाइबलीय रूप में रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
