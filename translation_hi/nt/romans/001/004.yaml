source:
  edition: SBLGNT
  text: τοῦ ὁρισθέντος υἱοῦ θεοῦ ἐν δυνάμει κατὰ πνεῦμα ἁγιωσύνης ἐξ ἀναστάσεως νεκρῶν, Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/004.yaml
  text: and who was declared to be the Son of God in power according to the Spirit of holiness by the resurrection from the dead—Jesus the Messiah our Lord[b][a],
translation:
  language: hi
  text: और जो पवित्रता की आत्मा[b] के अनुसार, मरे हुओं में से पुनरुत्थान के द्वारा, सामर्थ्य के साथ परमेश्वर का पुत्र ठहराया गया[a]—हमारा प्रभु यीशु मसीह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सामर्थ्य के साथ परमेश्वर का पुत्र घोषित किया गया’ अथवा ‘नियुक्त किया गया’।
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्र आत्मा के अनुसार’।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁρισθέντος
  choice: ठहराया गया
  rationale: यह ὁρίζω के ‘निर्धारित करना, नियुक्त करना, ठहराना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और यह अनावश्यक निष्कर्ष नहीं निकालता कि यीशु पहली बार पुनरुत्थान पर परमेश्वर का पुत्र बना। ‘घोषित किया गया’ विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: υἱοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह मसीही उपाधि का सीधा और प्रचलित हिन्दी अनुवाद है।
- source_word: ἐν δυνάμει
  choice: सामर्थ्य के साथ
  rationale: यह यूनानी पद का निकट और स्वाभाविक हिन्दी रूप है तथा इसे केवल ‘सामर्थी’ विशेषण बनाकर अर्थ को सीमित नहीं करता।
- source_word: κατὰ πνεῦμα ἁγιωσύνης
  choice: पवित्रता की आत्मा के अनुसार
  rationale: यह असामान्य यूनानी अभिव्यक्ति को पारदर्शी ढंग से सुरक्षित रखता है और पहले से तय नहीं करता कि संकेत सीधे पवित्र आत्मा की ओर है या पद 3 के ‘शरीर के अनुसार’ के विपरीत किसी आत्मिक-पवित्र क्षेत्र की ओर।
- source_word: ἐξ ἀναστάσεως νεκρῶν
  choice: मरे हुओं में से जी उठने के द्वारा
  rationale: यह पुनरुत्थान को उस ठहराए जाने या प्रकट घोषणा के आधार अथवा अवसर के रूप में सहज हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός को उसके उपाधिगत अर्थ ‘मसीह’ से व्यक्त किया गया है; ‘यीशु मसीह’ हिन्दी में स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: κυρίου ἡμῶν
  choice: हमारा प्रभु
  rationale: ‘प्रभु’ κύριος की मसीह-संबंधी और शास्त्रीय प्रतिध्वनि को बनाए रखता है।
theological_decisions:
- issue: क्या ὁρισθέντος का अर्थ है कि यीशु पुनरुत्थान के समय ही पहली बार परमेश्वर का पुत्र बना
  choice: ‘सामर्थ्य के साथ परमेश्वर का पुत्र ठहराया गया’
  alternative: ‘सामर्थ्य के साथ परमेश्वर का पुत्र घोषित किया गया’ या ‘नियुक्त किया गया’
  rationale: मुख्य पाठ यूनानी कथन का तनाव बनाए रखता है और पुत्रत्व के आरम्भ के बारे में उससे अधिक दावा नहीं करता जितना पाठ स्वयं कहता है।
- issue: क्या πνεῦμα ἁγιωσύνης विशेष रूप से पवित्र आत्मा को दर्शाता है
  choice: ‘पवित्रता की आत्मा के अनुसार’
  alternative: ‘पवित्र आत्मा के अनुसार’
  rationale: असामान्य यूनानी पदबंध का निकट अनुवाद उसके सटीक संदर्भ को खुला रखता है; अधिक परिचित व्याख्या पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। पद 3 से जुड़ी हुई सम्बन्धवाचक संरचना बनाए रखी गई है। ‘मरे हुओं में से जी उठना’ शाब्दिक निकटता और स्वाभाविक हिन्दी के बीच संतुलन रखता है।
