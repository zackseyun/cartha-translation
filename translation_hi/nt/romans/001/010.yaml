  text: πάντοτε ἐπὶ τῶν προσευχῶν μου, δεόμενος εἴ πως ἤδη ποτὲ εὐοδωθήσομαι ἐν τῷ θελήματι τοῦ θεοῦ ἐλθεῖν πρὸς ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/010.yaml
  text: always in my prayers[a], asking whether somehow, at last, by the will of God I may succeed in coming to you.
translation:
  language: hi
  text: और अपनी प्रार्थनाओं में सदा यह विनती करता हूँ कि किसी प्रकार अब अन्ततः परमेश्वर की इच्छा से तुम्हारे पास आने में मुझे सफलता मिले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा मार्ग सफल हो,” अथवा “मेरी यात्रा सफल हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: सदा
  rationale: यह पौलुस की नियमित और निरन्तर प्रार्थना पर बल देता है तथा आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ τῶν προσευχῶν μου
  choice: अपनी प्रार्थनाओं में
  rationale: यूनानी पूर्वसर्गीय वाक्यांश का स्वाभाविक हिन्दी रूप, जो प्रार्थना के अवसर और संदर्भ को व्यक्त करता है।
- source_word: δεόμενος
  choice: विनती करता हूँ
  rationale: यह साधारण माँग से अधिक आग्रहपूर्ण प्रार्थना को व्यक्त करता है और पिछले पद से चल रहे प्रथम पुरुष वाक्य के अनुरूप है।
- source_word: εἴ πως
  choice: कि यदि किसी प्रकार
  rationale: यह आशा के साथ जुड़ी अनिश्चितता को बनाए रखता है; पौलुस साधन या अवसर को निश्चित नहीं बताता।
- source_word: ἤδη ποτὲ
  choice: अब अन्ततः
  rationale: दोनों अव्ययों के संयुक्त बल को बनाए रखते हुए लम्बे समय से प्रतीक्षित अवसर का भाव व्यक्त करता है।
- source_word: εὐοδωθήσομαι
  choice: मुझे सफलता मिले
  rationale: संदर्भ में क्रिया का अर्थ प्रयास या यात्रा के सफल होने से है; यह आर्थिक समृद्धि का भ्रामक भाव उत्पन्न किए बिना कर्मवाच्य छाया को कुछ हद तक बनाए रखता है।
- source_word: ἐν τῷ θελήματι τοῦ θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: यह परमेश्वर की इच्छा को पौलुस के आने की निर्णायक शर्त अथवा माध्यम के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλθεῖν πρὸς ὑμᾶς
  choice: तुम्हारे पास आने में
  rationale: यह मूल क्रिया 'आना' को स्पष्ट रूप से बनाए रखता है और 'भेंट करने' जैसा अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: मानवीय योजना और परमेश्वर की इच्छा का संबंध
  choice: परमेश्वर की इच्छा से
  alternative: परमेश्वर की इच्छा के अनुसार
  rationale: मूल ἐν वाक्यांश साधन, क्षेत्र या नियंत्रक परिस्थिति की कुछ अस्पष्टता रख सकता है। चुना हुआ रूप परमेश्वर की इच्छा की निर्णायक भूमिका व्यक्त करता है, पर किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से व्याकरणिक रूप से जुड़ा है, इसलिए आरम्भ में “और” रखा गया है। “तुम्हारे” का प्रयोग मूल बहुवचन ὑμᾶς के अनुरूप है।
