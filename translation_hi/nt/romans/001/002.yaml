lexical_decisions:
- source_word: ὃ
  choice: जिसकी
  rationale: यह संबंधवाचक सर्वनाम पिछले पद के ‘सुसमाचार’ की ओर संकेत करता है। हिन्दी में ‘प्रतिज्ञा’ के साथ स्वाभाविक संबंध व्यक्त करने के लिए ‘जिसकी’ चुना गया है।
- source_word: προεπηγγείλατο
  choice: प्रतिज्ञा उसने पहले ही … की थी
  rationale: यह क्रिया प्रतिज्ञा करने और उसके पहले से किए जाने—दोनों भावों को रखती है; हिन्दी में विभाजित पदबंध स्वाभाविक और स्पष्ट है।
- source_word: διὰ
  choice: के द्वारा
  rationale: संबंधित कारक के साथ यह माध्यम अथवा प्रतिनिधि के द्वारा कार्य होने का भाव देता है।
- source_word: τῶν προφητῶν αὐτοῦ
  choice: अपने भविष्यद्वक्ताओं
  rationale: ‘अपने’ प्रतिज्ञा करने वाले परमेश्वर से संबंध स्पष्ट करता है, और ‘भविष्यद्वक्ता’ προφήτης का प्रचलित बाइबलीय हिन्दी रूप है।
- source_word: ἐν γραφαῖς ἁγίαις
  choice: पवित्र शास्त्रों में
  rationale: यह पदबंध उन पवित्र माने गए लिखित ग्रंथों की ओर संकेत करता है जिनमें प्रतिज्ञा दर्ज है; ‘शास्त्रों’ से मान्य धर्मग्रंथों का भाव स्वाभाविक रूप से व्यक्त होता है।
theological_decisions:
- issue: γραφαῖς ἁγίαις को ‘पवित्र शास्त्रों’ या ‘पवित्र लेखों’ के रूप में प्रस्तुत करना
  choice: पवित्र शास्त्रों में
  alternative: पवित्र लेखों में
  rationale: पौलुस के संदर्भ में γραφαί सामान्य लेखों के बजाय मान्य धर्मग्रंथों को सूचित करता है। फिर भी यूनानी पद का अधिक शाब्दिक अर्थ ‘पवित्र लेख’ हो सकता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वाक्य पिछले पद से जुड़ा संबंधवाचक उपवाक्य है; इसलिए ‘जिसकी’ से आरंभ किया गया है।
