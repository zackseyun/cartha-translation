translation:
  language: hi
  text: यह उसके पुत्र के विषय में है, जो शरीर के अनुसार[b] दाऊद के वंश[a] से उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दाऊद के बीज से।”
    reason: lexical_alternative
  - marker: b
    text: “शरीर के अनुसार” यहाँ मानवीय वंश या सांसारिक उद्गम को सूचित करता है, पापमय स्वभाव को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: περὶ
  choice: के विषय में
  rationale: यह पद पिछले संदर्भ में सुसमाचार की विषयवस्तु बताता है; यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: τοῦ υἱοῦ αὐτοῦ
  choice: उसके पुत्र
  rationale: संदर्भ में सर्वनाम परमेश्वर की ओर संकेत करता है। हिंदी में विशेष नाम के रूप में कृत्रिम रूप से बड़े अक्षर दिखाना संभव नहीं है।
- source_word: τοῦ γενομένου
  choice: उत्पन्न हुआ
  rationale: γίνομαι का कृदंत उद्गम या वंशगत उत्पत्ति व्यक्त करता है। यह अनुवाद ‘जन्मा’ की अपेक्षा थोड़ा व्यापक है और दाऊदी वंश से वास्तविक मानवीय उत्पत्ति को स्वाभाविक ढंग से बताता है।
- source_word: ἐκ σπέρματος Δαυὶδ
  choice: दाऊद के वंश से
  rationale: σπέρμα का शाब्दिक अर्थ ‘बीज’ है, पर इस वंशावली-संदर्भ में ‘वंश’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: विवादित और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण σάρξ को व्याख्यात्मक विस्तार से बदलने के बजाय औपचारिक समानता के निकट रखा गया है।
theological_decisions:
- issue: परमेश्वर के पुत्र और दाऊदी मानवीय वंश के बीच संबंध
  choice: ‘उसके पुत्र’ और ‘शरीर के अनुसार दाऊद के वंश से उत्पन्न हुआ’ दोनों कथनों को साथ बनाए रखना
  alternative: ‘अपने मानवीय स्वभाव में दाऊद का वंशज था’
  rationale: मूल पाठ पुत्रत्व और वास्तविक दाऊदी मानवीय उद्गम को साथ रखता है, पर उनके तत्त्वमीमांसात्मक संबंध की व्याख्या नहीं करता; इसलिए अनुवाद उस तनाव को हल नहीं करता।
- issue: κατὰ σάρκα का आशय
  choice: मुख्य पाठ में ‘शरीर के अनुसार’
  alternative: ‘मानवीय वंश के अनुसार’
  rationale: मुख्य पाठ पौलुस की भारयुक्त शब्दावली को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ आशय पापमय स्वभाव नहीं, मानवीय वंश से है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखा गया है। मूल यूनानी की संक्षिप्त संरचना तथा ‘शरीर के अनुसार’ की धर्मवैज्ञानिक अस्पष्टता सुरक्षित है।
