source:
  edition: SBLGNT
  text: καὶ ἤλλαξαν τὴν δόξαν τοῦ ἀφθάρτου θεοῦ ἐν ὁμοιώματι εἰκόνος φθαρτοῦ ἀνθρώπου καὶ πετεινῶν καὶ τετραπόδων καὶ ἑρπετῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/023.yaml
  text: and exchanged the glory of the imperishable God for the likeness of an image of perishable man and birds and four-footed animals and reptiles[a][b][c][d].
translation:
  language: hi
  text: और उन्होंने अविनाशी परमेश्वर की महिमा के बदले नाशवान मनुष्य, पक्षियों, चौपायों और रेंगनेवाले जीवों की प्रतिमा की समानता को अपना लिया।[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अक्षय परमेश्वर की महिमा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “नाशवान मनुष्य... की प्रतिमा की समानता के बदले।”
    reason: lexical_alternative
  - marker: c
    text: या, “मरणशील मनुष्य।”
    reason: lexical_alternative
  - marker: d
    text: या, “सरकनेवाले जीव।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤλλαξαν
  choice: बदल दिया
  rationale: यह जानबूझकर एक वस्तु के स्थान पर दूसरी को ग्रहण करने का भाव देता है और हिन्दी में स्वाभाविक है।
- source_word: δόξαν
  choice: महिमा
  rationale: यह δόξα का प्रचलित और प्रसंगानुकूल धार्मिक अर्थ सुरक्षित रखता है।
- source_word: ἀφθάρτου
  choice: अविनाशी
  rationale: यह क्षय या नाश के अधीन न होने का अर्थ देता है और φθαρτοῦ के साथ स्पष्ट विरोध बनाता है।
- source_word: ἐν ὁμοιώματι εἰκόνος
  choice: प्रतिमा की समानता से
  rationale: यह यूनानी के दोहरे चित्र-सम्बन्धी पदों और ἐν की संरचना को यथासम्भव सुरक्षित रखता है, बिना उसे अनेक प्रतिमाओं में बदलने के।
- source_word: φθαρτοῦ ἀνθρώπου
  choice: नाशवान मनुष्य
  rationale: यह ἀφθάρτου के साथ शब्दगत विरोध बनाए रखता है और एकवचन ἀνθρώπου को दर्शाता है।
- source_word: πετεινῶν
  choice: पक्षियों
  rationale: आधुनिक हिन्दी में सीधा और स्वाभाविक समतुल्य।
- source_word: τετραπόδων
  choice: चौपायों
  rationale: चार पैरों वाले प्राणियों का संक्षिप्त और प्रचलित हिन्दी रूप।
- source_word: ἑρπετῶν
  choice: रेंगनेवाले जीवों
  rationale: यह शब्द आधुनिक प्राणी-वर्ग ‘सरीसृप’ से अधिक व्यापक यूनानी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ἀφθάρτου और φθαρτοῦ का परस्पर विरोध
  choice: अविनाशी / नाशवान
  alternative: अक्षय / मरणशील
  rationale: एक ही शब्द-परिवार से बना स्पष्ट विरोध पौलुस की वाक्यगत और धर्मवैचारिक तीव्रता को बनाए रखता है।
- issue: ἐν ὁμοιώματι εἰκόνος की व्याख्या
  choice: प्रतिमा की समानता से
  alternative: समान दिखनेवाली प्रतिमाओं से
  rationale: चुना हुआ रूप यूनानी की एकवचन संरचना और जानबूझकर प्रयुक्त दोहरे प्रतिमा-संबंधी शब्दों को बनाए रखता है, यद्यपि हिन्दी में यह कुछ औपचारिक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए बोधगम्य रूप। मुख्य पाठ में यूनानी की एकवचन और दोहरी प्रतिमा-भाषा को औपचारिक ढंग से सुरक्षित रखा गया है; पादटिप्पणियाँ प्रमुख वैकल्पिक अर्थ स्पष्ट करती हैं।
