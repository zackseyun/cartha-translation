base_translation:
  language: en
  yaml_path: translation/nt/romans/001/007.yaml
  text: 'To all those in Rome who are beloved by God and called to be saints: Grace to you and peace from God our Father and the Lord Jesus the Messiah[a][b][c].'
translation:
  language: hi
  text: 'रोम में रहनेवाले उन सभी को, जो परमेश्वर के प्रिय और बुलाए हुए पवित्र जन हैं[a]: हमारे पिता परमेश्वर और प्रभु यीशु मसीह[b] की ओर से तुम्हें अनुग्रह और शांति मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र जन होने के लिए बुलाए गए हैं।”
    reason: lexical_alternative
  - marker: b
    text: “मसीह” का अर्थ “अभिषिक्त जन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶσιν τοῖς οὖσιν ἐν Ῥώμῃ
  choice: रोम में रहनेवाले उन सभी को
  rationale: दत्तिव संबोधन, सार्वभौमिकता और स्थान—तीनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀγαπητοῖς θεοῦ
  choice: जो परमेश्वर के प्रिय हैं
  rationale: विशेषणात्मक अर्थ और परमेश्वर के साथ संबंधपरक भाव को स्पष्ट तथा सहज हिन्दी में बनाए रखता है।
- source_word: κλητοῖς ἁγίοις
  choice: पवित्र जन होने के लिए बुलाए गए हैं
  rationale: हिन्दी में स्वाभाविक ढंग से बुलाहट और पवित्र जन की पहचान व्यक्त करता है; यूनानी में स्पष्ट ‘होने के लिए’ नहीं है, इसलिए निकटतर विकल्प पादटिप्पणी में दिया गया है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के अभिवादन में शब्द का मानक धार्मिक और संबंधपरक अर्थ सुरक्षित रखता है।
- source_word: εἰρήνη
  choice: शांति
  rationale: अभिवादन और व्यापक धार्मिक अर्थ दोनों को बनाए रखने वाला सीधा समतुल्य है।
- source_word: θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर
  rationale: यूनानी संबंधवाचक संरचना का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के अधिकार और मसीही महत्व को व्यक्त करने वाला स्थापित हिन्दी समतुल्य है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: अभिषिक्त जन के पदनाम को हिन्दी की स्थापित बाइबलीय शब्दावली में व्यक्त करता है।
theological_decisions:
- issue: κλητοῖς ἁγίοις में बुलाहट और पवित्र पहचान का संबंध
  choice: पवित्र जन होने के लिए बुलाए गए हैं
  alternative: बुलाए हुए पवित्र जन हैं
  rationale: मुख्य पाठ में सहज आधुनिक हिन्दी चुनी गई है, पर यूनानी के दो विशेषणों में स्पष्ट उद्देश्यसूचक क्रिया न होने के कारण अधिक रूप-समीपी पाठ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: Χριστός को पदनाम या लिप्यंतरित पारंपरिक नाम के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबल पाठकों के लिए स्थापित और गरिमापूर्ण है तथा पदनाम का धार्मिक भार बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबोधन में ‘तुम्हें’ बहुवचन समुदाय के लिए है। मुख्य पाठ की स्वाभाविकता और यूनानी संरचना की वास्तविक अस्पष्टता के बीच संतुलन रखा गया है।
