  text: Διὰ τοῦτο παρέδωκεν αὐτοὺς ὁ θεὸς εἰς πάθη ἀτιμίας· αἵ τε γὰρ θήλειαι αὐτῶν μετήλλαξαν τὴν φυσικὴν χρῆσιν εἰς τὴν παρὰ φύσιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/026.yaml
  text: For this reason God gave them over to dishonorable passions[a], for even their women exchanged natural relations for what is contrary to nature[c][b],
translation:
  language: hi
  text: इसी कारण परमेश्वर ने उन्हें अपमानकारी वासनाओं के हवाले कर दिया; क्योंकि उनकी स्त्रियों ने भी स्वाभाविक यौन-संबंध के बदले प्रकृति-विरुद्ध संबंध अपना लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: पूर्ववर्ती तर्क से स्पष्ट कारणात्मक संबंध जोड़ता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: παρέδωκεν αὐτοὺς
  choice: उन्हें ... के वश में छोड़ दिया
  rationale: परमेश्वर द्वारा लोगों को उनकी चुनी हुई दशा और उसके परिणामों के हवाले कर देने का भाव स्पष्ट करता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: πάθη ἀτιμίας
  choice: अपमानजनक वासनाओं
  rationale: ἀτιμία के अनादर या अपमान के मूल्यांकन को बनाए रखता है और πάθη की प्रबल अभिलाषाओं को सहज हिन्दी में व्यक्त करता है।
- source_word: αἵ ... θήλειαι αὐτῶν
  choice: उनकी स्त्रियों ने भी
  rationale: θήλειαι का अधिक शाब्दिक अर्थ 'मादाएँ' है, पर मनुष्यों के लिए 'स्त्रियाँ' अधिक स्वाभाविक और गरिमापूर्ण हिन्दी है; τε γὰρ का बल 'क्योंकि ... भी' से व्यक्त होता है।
- source_word: μετήλλαξαν
  choice: बदल लिया
  rationale: एक व्यवहार को दूसरे से बदलने का अर्थ सीधे और सहज ढंग से व्यक्त करता है।
- source_word: τὴν φυσικὴν χρῆσιν
  choice: स्वाभाविक यौन-संबंध
  rationale: χρῆσις का शाब्दिक 'उपयोग' हिन्दी में यहाँ अस्वाभाविक और वस्तुकरणकारी लगेगा; प्रसंग यौन व्यवहार का है, इसलिए 'यौन-संबंध' अर्थ को स्पष्ट करता है।
- source_word: τὴν παρὰ φύσιν
  choice: उस संबंध से ... जो प्रकृति के विरुद्ध है
  rationale: ग्रीक में निहित संज्ञा को पूर्वपद 'यौन-संबंध' से ग्रहण करके वाक्य को स्पष्ट रखता है और παρὰ φύσιν का मूल्यांकन सीधे सुरक्षित करता है।
theological_decisions:
- issue: पौलुस के नैतिक मूल्यांकन को तीखा या हल्का करना
  choice: '''अपमानजनक'' और ''प्रकृति के विरुद्ध'' को स्पष्ट रूप से बनाए रखना'
  alternative: मूल्यांकन को नरम करना, या आधुनिक पहचान-श्रेणियाँ जोड़कर उसे अधिक विशिष्ट बनाना
  rationale: मूल पाठ स्वयं नैतिक मूल्यांकन करता है, इसलिए उसे हटाना उचित नहीं; पर पद में न आने वाली आधुनिक सामाजिक या धार्मिक श्रेणियाँ जोड़ना भी उचित नहीं।
- issue: παρέδωκεν में परमेश्वर की भूमिका
  choice: '''के वश में छोड़ दिया'''
  alternative: '''दंड दिया'' या केवल ''अनुमति दी'''
  rationale: ग्रीक क्रिया सौंप देने या हवाले कर देने का भाव रखती है; अनुवाद न तो इसे स्पष्ट दंड-विधान तक बढ़ाता है, न निष्क्रिय अनुमति तक घटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट। 'मादाएँ' और 'स्वाभाविक उपयोग' जैसी अत्यधिक शाब्दिक किन्तु असहज अभिव्यक्तियों से बचते हुए मूल का नैतिक और तर्कगत बल सुरक्षित रखा गया है।
