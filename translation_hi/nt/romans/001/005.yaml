id: ROM.1.5
reference: Romans 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: δι’ οὗ ἐλάβομεν χάριν καὶ ἀποστολὴν εἰς ὑπακοὴν πίστεως ἐν πᾶσιν τοῖς ἔθνεσιν ὑπὲρ τοῦ ὀνόματος αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/005.yaml
  text: Through whom we received grace and apostleship for the obedience of faith among all the nations for the sake of his name[b][a],
translation:
  language: hi
  text: उसी के द्वारा हमें अनुग्रह और प्रेरिताई मिली, ताकि उसके नाम के लिए सब जातियों[b] में विश्वास की आज्ञाकारिता[a] हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास से उत्पन्न आज्ञाकारिता,” अथवा “वह आज्ञाकारिता जो विश्वास है।”
    reason: alternative_reading
  - marker: b
    text: या “सब गैर-यहूदियों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ οὗ
  choice: उसी के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम को व्यक्त करता है। “उसी के द्वारा” पिछले पद में उल्लिखित यीशु मसीह से संबंध बनाए रखता है।
- source_word: ἐλάβομεν
  choice: हमें ... मिली
  rationale: यूनानी क्रिया प्रथम पुरुष बहुवचन में है। हिंदी में “हमें ... मिली” उसी बहुवचन को सुरक्षित रखता है और यह तय नहीं करता कि पौलुस केवल अपने लिए बोल रहा है या व्यापक रूप से।
- source_word: χάριν
  choice: अनुग्रह
  rationale: पौलुस के प्रयोग में χάρις के लिए “अनुग्रह” स्वाभाविक और स्थापित हिंदी शब्द है।
- source_word: καὶ ἀποστολήν
  choice: और प्रेरिताई
  rationale: मूल पाठ में χάριν और ἀποστολήν दो समन्वित संज्ञाएँ हैं; इसलिए उन्हें एक ही धारणा में नहीं मिलाया गया। “प्रेरिताई” भेजे और नियुक्त किए गए प्रेरित की भूमिका को व्यक्त करती है।
- source_word: εἰς
  choice: ताकि ... हो
  rationale: यहाँ εἰς उद्देश्य या लक्ष्य बताता है। “ताकि ... हो” आधुनिक हिंदी में इस लक्ष्य को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπακοὴν πίστεως
  choice: विश्वास की आज्ञाकारिता
  rationale: यह संबंधकारक रचना अर्थ की दृष्टि से खुली है। औपचारिक रूप से निकट यह अनुवाद विश्वास और आज्ञाकारिता के संबंध को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις के लिए यहाँ मानक और प्रसंगानुकूल हिंदी शब्द “विश्वास” है।
- source_word: ἐν πᾶσιν τοῖς ἔθνεσιν
  choice: सब जातियों में
  rationale: ἔθνη का अर्थ “जातियाँ/राष्ट्र” अथवा प्रसंगानुसार “गैर-यहूदी” हो सकता है। “सब जातियों” व्यापक मिशन-क्षेत्र को बनाए रखता है; दूसरा अर्थ पादटिप्पणी में दिया गया है।
- source_word: ὑπὲρ τοῦ ὀνόματος αὐτοῦ
  choice: उसके नाम के लिए
  rationale: ὑπέρ यहाँ उद्देश्य, हित या सम्मान के भाव को व्यक्त करता है। “उसके नाम के लिए” संक्षिप्त, स्वाभाविक और बाइबिलीय अभिव्यक्ति है।
theological_decisions:
- issue: ὑπακοὴν πίστεως का संबंध
  choice: विश्वास की आज्ञाकारिता
  alternative: “विश्वास से उत्पन्न आज्ञाकारिता” अथवा “वह आज्ञाकारिता जो विश्वास है”
  rationale: यूनानी पदबंध संक्षिप्त और बहुअर्थी है। मुख्य पाठ में संबंध को खुला रखा गया है, जबकि सम्भव व्याख्याएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। “प्रेरिताई” पारिभाषिक शब्द है, जबकि वाक्य-विन्यास को स्वाभाविक बनाने के लिए εἰς को “ताकि ... हो” से व्यक्त किया गया है। पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
