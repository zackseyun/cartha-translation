source:
  edition: SBLGNT
  text: Πρῶτον μὲν εὐχαριστῶ τῷ θεῷ μου διὰ Ἰησοῦ Χριστοῦ ⸀περὶ πάντων ὑμῶν, ὅτι ἡ πίστις ὑμῶν καταγγέλλεται ἐν ὅλῳ τῷ κόσμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/001/008.yaml
  text: First[a], I thank my God through Jesus the Messiah for all of you[b], because your faith is being proclaimed throughout the whole world.
translation:
  language: hi
  text: सबसे पहले, मैं तुम सबके लिए यीशु मसीह[a] के द्वारा अपने परमेश्वर को धन्यवाद देता हूँ, क्योंकि तुम्हारे विश्वास[b] की चर्चा सारे संसार में हो रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ख्रीस्त।
    reason: alternative_reading
  - marker: b
    text: या, विश्वासयोग्यता; संभवतः भरोसा भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πρῶτον μὲν
  choice: सबसे पहले
  rationale: यह पौलुस की बात के आरम्भिक बिंदु को चिह्नित करता है। μὲν को अलग शब्द देने के बजाय स्वाभाविक हिन्दी वाक्यांश में समाहित किया गया है।
- source_word: εὐχαριστῶ
  choice: धन्यवाद देता हूँ
  rationale: यह क्रिया सीधे धन्यवाद व्यक्त करती है और वर्तमान काल तथा पौलुस के व्यक्तिगत भाव को बनाए रखती है।
- source_word: τῷ θεῷ μου
  choice: अपने परमेश्वर को
  rationale: हिन्दी में कर्ता के अपने परमेश्वर के लिए ‘अपने’ स्वाभाविक है और यूनानी संबंधवाचक भाव को सुरक्षित रखता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: संबंधकारक के साथ διά माध्यम या मध्यस्थता दर्शाता है; इसलिए ‘के द्वारा’ रखा गया है। Χριστός को उसके पदवीगत अर्थ के अनुसार ‘मसीह’ किया गया है।
- source_word: περὶ πάντων ὑμῶν
  choice: तुम सबके लिए
  rationale: धन्यवाद के इस प्रसंग में περί का स्वाभाविक हिन्दी अर्थ ‘के लिए’ है और πάντων की समावेशी व्यापकता ‘सब’ से व्यक्त होती है।
- source_word: ἡ πίστις ὑμῶν
  choice: तुम्हारे विश्वास
  rationale: πίστις का मुख्य और प्रसंगानुकूल अर्थ ‘विश्वास’ है; ‘विश्वासयोग्यता’ और ‘भरोसा’ की संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: καταγγέλλεται
  choice: घोषणा ... हो रही है
  rationale: यह वर्तमान कर्मवाच्य का सार्वजनिक और जारी प्रचार व्यक्त करता है।
- source_word: ἐν ὅλῳ τῷ κόσμῳ
  choice: सारे संसार में
  rationale: यह व्यापक आलंकारिक क्षेत्र को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: διὰ Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: Χριστός यहाँ मसीही पदवी है; ‘मसीह’ उसके अर्थ को व्यक्त करता है, जबकि पारंपरिक लिप्यंतरण को पादटिप्पणी में रखा गया है।
- issue: ἡ πίστις ὑμῶν में πίστις का अर्थ
  choice: तुम्हारा विश्वास
  alternative: तुम्हारी विश्वासयोग्यता; तुम्हारा भरोसा
  rationale: इस प्रसंग में रोम के विश्वासियों का प्रसिद्ध हो चुका विश्वास मुख्य अर्थ है, पर यूनानी शब्द के अन्य वास्तविक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘तुम’ बहुवचन समुदाय-संबोधन के रूप में प्रयुक्त है; ‘अपने परमेश्वर को’ हिन्दी में संबंध को अधिक सहज बनाता है।
