source:
  edition: SBLGNT
  text: ἀσπάσασθε Ἀνδρόνικον καὶ ⸀Ἰουνίαν τοὺς συγγενεῖς μου καὶ συναιχμαλώτους μου, οἵτινές εἰσιν ἐπίσημοι ἐν τοῖς ἀποστόλοις, οἳ καὶ πρὸ ἐμοῦ ⸀γέγοναν ἐν Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/007.yaml
  text: Greet Andronicus and Junia[a], my kinsmen and my fellow prisoners. They are notable among the apostles[b], and they were in Messiah before me.
translation:
  language: hi
  text: अन्द्रोनिकुस और यूनिया[a] को नमस्कार करो, जो मेरे स्वजन और मेरे सहबंदी हैं। वे प्रेरितों में प्रतिष्ठित हैं[b], और मुझसे पहले ही मसीह में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यूनिया’ के स्थान पर ‘यूनियास’, अर्थात् पुरुष का नाम, भी माना गया है; पर यूनानी रूप और ऐतिहासिक प्रयोग के आधार पर स्त्रीलिंग नाम अधिक सम्भावित है।
    reason: alternative_reading
  - marker: b
    text: या, ‘प्रेरितों में विशिष्ट हैं’; इस वाक्यांश को ‘प्रेरितों को भली-भाँति ज्ञात हैं’ भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: पत्रात्मक आज्ञा के सीधे भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀνδρόνικον
  choice: अन्द्रुनीकुस
  rationale: यूनानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: Ἰουνίαν
  choice: यूनिया
  rationale: यूनानी रूप और प्राचीन नाम-प्रयोग के अनुसार स्त्रीलिंग नाम अधिक सम्भावित है; ऐतिहासिक पुरुषलिंग विकल्प पादटिप्पणी में रखा गया है।
- source_word: συγγενεῖς μου
  choice: मेरे स्वजन
  rationale: यह शब्द रिश्तेदारों या एक ही जातीय समुदाय के लोगों का बोध करा सकता है; ‘स्वजन’ इस वास्तविक अस्पष्टता को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: συναιχμαλώτους μου
  choice: मेरे साथ के बन्दी
  rationale: साथ में कैद रहे व्यक्तियों का ठोस अर्थ स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: ἐπίσημοι ἐν τοῖς ἀποστόλοις
  choice: प्रेरितों में प्रतिष्ठित
  rationale: ἐπίσημοι के ‘विशिष्ट/प्रतिष्ठित’ भाव और ἐν के सहज ‘में’ अर्थ को रखता है; ‘प्रेरितों को भली-भाँति ज्ञात’ सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: πρὸ ἐμοῦ γέγοναν ἐν Χριστῷ
  choice: मुझसे पहले से मसीह में हैं
  rationale: कालगत प्राथमिकता, पूर्णकाल से सूचित वर्तमान स्थिति, और ‘मसीह में’ की पौलुसी अभिव्यक्ति को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: Ἰουνίαν की पहचान और लिंग
  choice: मुख्य पाठ में स्त्रीलिंग नाम ‘यूनिया’
  alternative: पुरुषलिंग नाम ‘यूनियास’
  rationale: यूनानी रूप और ऐतिहासिक प्रयोग स्त्रीलिंग नाम के पक्ष में अधिक प्रबल हैं, पर प्रभावशाली ऐतिहासिक विकल्प को पारदर्शिता के लिए पादटिप्पणी में दिया गया है।
- issue: ἐπίσημοι ἐν τοῖς ἀποστόλοις का आशय
  choice: ‘प्रेरितों में प्रतिष्ठित’
  alternative: ‘प्रेरितों को भली-भाँति ज्ञात’
  rationale: वाक्यांश यह संकेत दे सकता है कि वे प्रेरितों के समूह में प्रतिष्ठित थे, या केवल प्रेरितों के बीच प्रसिद्ध थे। मुख्य पाठ अधिक सीधा समावेशी अर्थ रखता है और वैकल्पिक बाह्य अर्थ पादटिप्पणी में देता है।
- issue: ἐν Χριστῷ का अनुवाद
  choice: ‘मसीह में’
  alternative: ‘मसीह पर विश्वास करनेवाले बने’
  rationale: मूल की धार्मिक-संबंधपरक अभिव्यक्ति को बिना उसे धर्म-परिवर्तन की व्याख्यात्मक भाषा में बदलने के सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘स्वजन’ जानबूझकर रिश्तेदारी और जातीय निकटता के बीच की अस्पष्टता रखता है; ‘मसीह में’ मूल धार्मिक मुहावरे को सुरक्षित रखता है।
