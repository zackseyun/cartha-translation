source:
  edition: SBLGNT
  text: οἱ γὰρ τοιοῦτοι τῷ κυρίῳ ⸀ἡμῶν Χριστῷ οὐ δουλεύουσιν ἀλλὰ τῇ ἑαυτῶν κοιλίᾳ, καὶ διὰ τῆς χρηστολογίας καὶ εὐλογίας ἐξαπατῶσι τὰς καρδίας τῶν ἀκάκων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/018.yaml
  text: For such people do not serve our Lord Messiah[a], but their own belly[c][b], and by smooth talk and flattery they deceive the hearts of the unsuspecting.
translation:
  language: hi
  text: क्योंकि ऐसे लोग हमारे प्रभु मसीह की सेवा नहीं करते, बल्कि अपने पेट की सेवा करते हैं; और चिकनी-चुपड़ी बातों और चापलूसी से वे निष्कपट लोगों[a] के हृदयों को धोखा देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निष्कपट लोगों’ का अनुवाद ‘भोले-भाले लोगों’ या ‘बुराई से अनजान लोगों’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιοῦτοι
  choice: ऐसे लोग
  rationale: यह पिछले पद में बताए गए फूट डालने वालों की ओर संकेत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κυρίῳ ἡμῶν Χριστῷ
  choice: हमारे प्रभु मसीह
  rationale: κύριος के लिए ‘प्रभु’ और पदवी Χριστός के लिए ‘मसीह’ रखा गया है; यूनानी पाठ में ‘यीशु’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: δουλεύουσιν
  choice: सेवा करते हैं
  rationale: क्रिया दास के समान सेवा करने या अधीन रहने का भाव रखती है; यहाँ ‘सेवा करना’ प्रभु और अपने पेट के बीच के विरोध को सहज रूप से व्यक्त करता है।
- source_word: κοιλίᾳ
  choice: पेट
  rationale: पौलुस के सजीव रूपक को बनाए रखता है; इसका आशय अपनी भोग-वासनाओं या स्वार्थी इच्छाओं की सेवा करना है।
- source_word: χρηστολογίας
  choice: चिकनी-चुपड़ी बातों
  rationale: सुनने में मधुर, लुभावनी और छलपूर्ण वाणी का भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: εὐλογίας
  choice: चापलूसी
  rationale: इस प्रसंग में वास्तविक आशीर्वाद नहीं, बल्कि प्रशंसापूर्ण और बहकाने वाली भाषा अभिप्रेत है।
- source_word: ἐξαπατῶσι
  choice: धोखा देते हैं
  rationale: छल या बहकावे का अर्थ स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: καρδίας
  choice: हृदयों
  rationale: मनुष्य के भीतरी व्यक्तित्व के लिए प्रयुक्त बाइबलीय रूपक को सुरक्षित रखता है।
- source_word: ἀκάκων
  choice: निष्कपट लोगों
  rationale: शब्द का मूल भाव बुराई या कपट से रहित होना है; प्रसंग में ऐसे लोग छल के प्रति असावधान भी हैं।
theological_decisions:
- issue: पौलुस के पदवी-वाक्यांश में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: Χριστός को नाम-जैसे रूप में रखने के बजाय ‘अभिषिक्त जन’ की पदवी के रूप में ‘मसीह’ अनूदित किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अपने पेट की सेवा’ का सजीव रूपक जानबूझकर सुरक्षित रखा गया है। मुख्य पाठ में ‘चिकनी-चुपड़ी बातें’ और ‘चापलूसी’ दोनों यूनानी संज्ञाओं का भेद सहज हिन्दी में व्यक्त करते हैं।
