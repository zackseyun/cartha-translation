base_translation:
  language: en
  yaml_path: translation/nt/romans/016/014.yaml
  text: Greet Asyncritus[a], Phlegon, Hermes, Patrobas, Hermas, and the brothers with them.
translation:
  language: hi
  text: असुंक्रितुस, फ्लेगोन, हेरमेस, पत्रोबास, हेरमास और उनके साथ रहने वाले भाइयों[a] का अभिवादन करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे भाई जो उनके साथ हैं।’ यह वाक्यांश संभवतः इन पुरुषों से जुड़े सहविश्वासियों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहो
  rationale: यह बहुवचन आज्ञार्थक क्रिया पौलुस की समापन-अभिवादन सूची में प्रयुक्त हुई है। ‘नमस्कार कहो’ संक्षिप्त, स्वाभाविक और पत्र-संदर्भ के अनुरूप है।
- source_word: Ἀσύγκριτον
  choice: असुंक्रितुस
  rationale: व्यक्तिवाचक नाम को उसके यूनानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: Φλέγοντα
  choice: फ्लेगोन
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: Ἑρμῆν
  choice: हेरमेस
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण; इसे अगले नाम Ἑρμᾶν से स्पष्ट रूप से अलग रखा गया है।
- source_word: Πατροβᾶν
  choice: पत्रुबास
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी-बाइबलीय रूप के अनुकूल देवनागरी लिप्यंतरण।
- source_word: Ἑρμᾶν
  choice: हेरमास
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण, जिससे पहले आए ‘हेरमेस’ से उसका भेद बना रहता है।
- source_word: τοὺς σὺν αὐτοῖς ἀδελφούς
  choice: उनके साथ के भाइयों
  rationale: यह अनुवाद σὺν αὐτοῖς (‘उनके साथ’) और व्याकरणतः पुल्लिंग बहुवचन ἀδελφούς (‘भाइयों’) दोनों को सीधे और संक्षिप्त रूप में व्यक्त करता है। संदर्भ में ‘भाई’ संभवतः सहविश्वासियों के लिए प्रयुक्त है।
theological_decisions:
- issue: सामुदायिक अभिवादन में ἀδελφούς का अनुवाद
  choice: भाइयों
  alternative: भाई-बहनों; सहविश्वासियों
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है। इस संक्षिप्त वाक्य में मिश्रित-लिंग समूह स्पष्ट नहीं किया गया, इसलिए मूल रूप को ‘भाइयों’ के रूप में सुरक्षित रखा गया है; पादटिप्पणी इसके संभावित सामुदायिक आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सम्मानपूर्ण रखी गई है। नामों को देवनागरी में इस प्रकार लिप्यंतरित किया गया है कि हेरमेस और हेरमास का अंतर स्पष्ट रहे।
