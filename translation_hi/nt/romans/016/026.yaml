  terminology: ‘अनन्त परमेश्वर,’ ‘विश्वास की आज्ञाकारिता,’ and ‘सब राष्ट्रों’ are sound and preserve the Greek wording and its theological/semantic openness. ‘भविष्यसूचक पवित्र शास्त्रों’ better represents the adjectival Greek phrase without unnecessarily identifying the writings as the possessions of prophets.
