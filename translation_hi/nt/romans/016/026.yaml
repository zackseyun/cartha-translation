lexical_decisions:
- source_word: φανερωθέντος
  choice: प्रकट किया गया है
  rationale: यह कृदन्त पद पिछले पद के ‘भेद’ की ओर संकेत करता है और उस बात के प्रकाश में लाए जाने को व्यक्त करता है जो पहले छिपी हुई थी। कर्मवाच्य रूप भी सुरक्षित रखा गया है।
- source_word: γραϕῶν προϕητικῶν
  choice: भविष्यद्वक्ताओं के पवित्र शास्त्रों
  rationale: यहाँ बहुवचन γραϕῶν, ‘भविष्यसूचक/भविष्यद्वक्ताओं से संबंधित’ विशेषण के साथ, मान्य पवित्र लेखों की ओर संकेत करता है। सहज हिन्दी के लिए ‘भविष्यद्वक्ताओं के पवित्र शास्त्रों’ चुना गया है।
- source_word: ἐπιταγὴν
  choice: आज्ञा
  rationale: यह परमेश्वर के अधिकारपूर्ण निर्देश को व्यक्त करता है; ‘आज्ञा’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὑπακοὴν πίστεως
  choice: विश्वास की आज्ञाकारिता
  rationale: मूल यूनानी के संबंधकारक की जानबूझकर संक्षिप्तता और सम्भावित अर्थ-विस्तार को सुरक्षित रखा गया है; इसे केवल ‘विश्वास से उत्पन्न आज्ञाकारिता’ या ‘विश्वासरूपी आज्ञाकारिता’ बनाकर सीमित नहीं किया गया। यही पदबंध रोमियों 1:5 से भी मेल रखता है।
- source_word: πάντα τὰ ἔθνη
  choice: सब राष्ट्रों
  rationale: यह विकल्प सुसमाचार के सार्वभौमिक विस्तार को सामने रखता है और पद को केवल गैर-यहूदियों तक सीमित नहीं करता।
- source_word: γνωρισθέντος
  choice: बता दिया गया है
  rationale: 'यह दूसरे कर्मवाच्य कृदन्त का अर्थ स्वाभाविक हिन्दी में देता है: भेद को सब राष्ट्रों में ज्ञात कराया गया है।'
theological_decisions:
- issue: ‘विश्वास की आज्ञाकारिता’ में संबंधकारक का अर्थ
  choice: विश्वास की आज्ञाकारिता के लिए
  alternative: ताकि वे विश्वास करके आज्ञाकारी हों
  rationale: यूनानी ὑπακοὴ πίστεως अस्पष्ट रूप से विश्वास और आज्ञाकारिता को जोड़ता है। अधिक व्याख्यात्मक विकल्प सम्बन्ध को एक ही अर्थ में बाँध देता; चुना हुआ रूप मूल की धर्मवैचारिक गहनता और तनाव बनाए रखता है।
- issue: ‘सब राष्ट्रों’ का दायरा
  choice: सब राष्ट्रों
  alternative: सब गैर-यहूदियों
  rationale: πάντα τὰ ἔθνη यहाँ विश्वव्यापी घोषणा को व्यक्त कर सकता है। ‘सब राष्ट्रों’ व्यापकता को बनाए रखता है और अनावश्यक रूप से यहूदी/गैर-यहूदी भेद आरोपित नहीं करता।
