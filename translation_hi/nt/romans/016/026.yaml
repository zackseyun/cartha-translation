  text: पर[a] अब प्रकट किया गया है, और अनन्त परमेश्वर की आज्ञा के अनुसार भविष्यसूचक पवित्र शास्त्रों के द्वारा सब राष्ट्रों को विश्वास की आज्ञाकारिता के लिए ज्ञात कराया गया है,
