  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य को अल्पविराम पर समाप्त किया गया है, क्योंकि यह 16:25–27 के एक निरन्तर यूनानी वाक्य का मध्य भाग है। ‘पर’ पर पादटिप्पणी-चिह्न रखकर अंग्रेज़ी परामर्श-पाठ के संकेत का स्थान सुरक्षित रखा गया है।
