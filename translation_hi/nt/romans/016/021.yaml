  text: ⸀Ἀσπάζεται ὑμᾶς Τιμόθεος ὁ συνεργός μου, καὶ Λούκιος καὶ Ἰάσων καὶ Σωσίπατρος οἱ συγγενεῖς μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/021.yaml
  text: Timothy[a], my fellow worker, greets you, and so do Lucius and Jason and Sosipater, my kinsmen.
translation:
  language: hi
  text: मेरा सहकर्मी तीमुथियुस तुम्हें नमस्कार भेजता है। लूकियुस, यासोन और सोसिपत्रुस—मेरे स्वजन[a]—भी तुम्हें नमस्कार भेजते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे रिश्तेदार’ अथवा ‘मेरे साथी यहूदी।’ यूनानी शब्द पारिवारिक संबंध या व्यापक वंशगत/जातीय संबंध को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: नमस्कार कहता है
  rationale: पत्र के समापन में ἀσπάζομαι अभिवादन भेजने या नमस्कार कहने के अर्थ में आता है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यह द्वितीय पुरुष बहुवचन कर्म है और रोम के विश्वासियों को सामूहिक रूप से संबोधित करता है। हिन्दी में ‘तुम्हें’ प्रसंगानुकूल और सहज है।
- source_word: συνεργός
  choice: सहकर्मी
  rationale: यह साझा काम में साथ देने वाले व्यक्ति को दर्शाता है। ‘सहकर्मी’ संक्षिप्त और स्वाभाविक है तथा सेवकाई के काम को किसी पदानुक्रम में नहीं बाँधता।
- source_word: Τιμόθεος
  choice: तीमुथियुस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Λούκιος
  choice: लूकियुस
  rationale: यूनानी व्यक्तिनाम का स्पष्ट देवनागरी लिप्यंतरण।
- source_word: Ἰάσων
  choice: यासोन
  rationale: यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: Σωσίπατρος
  choice: सोसिपत्रुस
  rationale: इस पद में आए पूर्ण यूनानी नाम Σωσίπατρος का लिप्यंतरण; इसे अन्यत्र मिलने वाले संक्षिप्त रूप से नहीं बदला गया।
- source_word: συγγενεῖς
  choice: बंधु
  rationale: यह शब्द रक्त-संबंधियों अथवा व्यापक पारिवारिक/जातीय संबंध वालों को सूचित कर सकता है। ‘बंधु’ इस विस्तार को अपेक्षाकृत खुला रखता है; संभावित अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: पौलुस के प्रयोग में συγγενεῖς μου का आशय
  choice: मेरे बंधु
  alternative: मेरे रिश्तेदार; मेरे साथी यहूदी
  rationale: यूनानी शब्द निकट पारिवारिक संबंध और व्यापक जातीय संबंध—दोनों को व्यक्त कर सकता है। पद स्वयं आशय को अधिक सीमित नहीं करता, इसलिए मुख्य पाठ में अपेक्षाकृत खुला शब्द रखा गया है और विकल्प पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। दूसरे खंड में हिन्दी की स्वाभाविकता के लिए निहित क्रिया को स्पष्ट किया गया है। ‘बंधु’ के साथ पाद-टिप्पणी मूल यूनानी की वास्तविक अस्पष्टता बनाए रखती है।
