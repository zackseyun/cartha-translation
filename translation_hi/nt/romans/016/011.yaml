  text: ἀσπάσασθε Ἡρῳδίωνα τὸν ⸀συγγενῆ μου. ἀσπάσασθε τοὺς ἐκ τῶν Ναρκίσσου τοὺς ὄντας ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/011.yaml
  text: Greet Herodion[a], my kinsman[b]. Greet those of Narcissus who are in the Lord.
translation:
  language: hi
  text: मेरे स्वजन[a] हेरोदियोन को नमस्कार कहना। नरकिस्सुस से संबंधित लोगों[b] में से जो प्रभु में हैं, उन्हें नमस्कार कहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे रिश्तेदार” अथवा “मेरे साथी यहूदी।” यूनानी शब्द रक्त-संबंधी या पौलुस के अपने लोगों में से किसी व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: संभवतः नरकिस्सुस के घराने या उसकी संपत्ति से जुड़े उन लोगों की ओर संकेत है जो विश्वासी थे।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: पत्र के अभिवादन-संदर्भ में यह बहुवचन आज्ञार्थक रूप का स्वाभाविक और वर्तमान हिन्दी अनुवाद है।
- source_word: Ἡρῳδίωνα
  choice: हेरोदियोन
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: συγγενῆ μου
  choice: मेरे सजातीय
  rationale: συγγενής रक्त-संबंधी अथवा अपने ही लोगों, विशेषतः साथी यहूदी, के लिए प्रयुक्त हो सकता है। ‘सजातीय’ जातीय/लोक-संबंध को व्यक्त करता है, जबकि वैकल्पिक पारिवारिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: τοὺς ἐκ τῶν Ναρκίσσου
  choice: नरकिस्सुस से जुड़े उन लोगों
  rationale: यूनानी वाक्यांश नरकिस्सुस से संबंध या संबद्धता बताता है, पर ‘घराना’ शब्द स्पष्ट रूप से नहीं कहता; अतः मुख्य पाठ में संबंध को अनिर्दिष्ट रखा गया है।
- source_word: τοὺς ὄντας ἐν κυρίῳ
  choice: जो प्रभु में हैं
  rationale: पौलुस की विशिष्ट अभिव्यक्ति ‘प्रभु में’ को उसके धार्मिक अर्थ और संक्षिप्तता सहित सुरक्षित रखा गया है।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: इस पौलुसी मसीही अभिव्यक्ति में κύριος का स्वाभाविक और स्थापित हिन्दी समतुल्य ‘प्रभु’ है।
theological_decisions:
- issue: συγγενής का संबंध-सूचक अर्थ
  choice: मुख्य पाठ में ‘मेरे सजातीय’
  alternative: ‘मेरे रिश्तेदार’ अथवा ‘मेरे साथी यहूदी’
  rationale: इस शब्द में रक्त-संबंध और व्यापक जातीय/राष्ट्रीय संबंध दोनों की संभावना है। हिन्दी में एक ही सहज शब्द दोनों को पूरी तरह नहीं समेटता; इसलिए मुख्य पाठ में व्यापक सामुदायिक अर्थ चुना गया और पारिवारिक संभावना पाद-टिप्पणी में स्पष्ट की गई।
- issue: नरकिस्सुस से संबद्ध लोगों का दायरा
  choice: ‘नरकिस्सुस से जुड़े उन लोगों’
  alternative: ‘नरकिस्सुस के घराने के उन लोगों’
  rationale: स्रोत में संबद्धता व्यक्त है, लेकिन ‘घराना’ संज्ञा नहीं है। संभावित घरेलू या संपत्ति-संबंधी अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
- issue: ‘प्रभु में’ अभिव्यक्ति का अर्थ
  choice: पौलुसी मुहावरे को ज्यों का त्यों ‘प्रभु में’ रखा गया
  alternative: ‘जो प्रभु के विश्वासी हैं’ अथवा ‘जो प्रभु के हैं’
  rationale: व्याख्यात्मक विकल्प अर्थ को सीमित कर सकते हैं; मूल अभिव्यक्ति मसीह से संबंध या एकता की धार्मिक गूंज बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सजातीय’ कुछ औपचारिक है, पर यह ‘रिश्तेदार’ की अपेक्षा मूल की व्यापक संभाव्यता को बेहतर बनाए रखता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
