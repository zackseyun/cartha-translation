source:
  edition: SBLGNT
  text: οἵτινες ὑπὲρ τῆς ψυχῆς μου τὸν ἑαυτῶν τράχηλον ὑπέθηκαν, οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ πᾶσαι αἱ ἐκκλησίαι τῶν ἐθνῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/004.yaml
  text: who laid down their own necks for my life[a], to whom not only I give thanks, but also all the churches of the Gentiles[b],
translation:
  language: hi
  text: जिन्होंने मेरे जीवन के लिए अपनी गर्दनें दाँव पर लगा दी थीं[a]; उनका धन्यवाद केवल मैं ही नहीं करता, बल्कि गैर-यहूदियों की सारी कलीसियाएँ भी करती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘अपनी गर्दन रख दी’ (एकवचन) है; यह स्वयं को प्राणघातक खतरे में डालने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘राष्ट्रों की सारी कलीसियाएँ’।
    reason: alternative_reading
lexical_decisions:
- source_word: οἵτινες
  choice: जिन्होंने
  rationale: यह प्रिस्किल्ला और अक्विला की ओर संकेत करने वाला वर्णनात्मक सम्बन्धवाचक रूप है; हिन्दी में ‘जिन्होंने’ स्वाभाविक रूप से पिछले पद से सम्बन्ध जोड़ता है।
- source_word: ὑπὲρ τῆς ψυχῆς μου
  choice: मेरे प्राण के लिए
  rationale: यहाँ ψυχή पौलुस के जीवन को दर्शाता है, अमूर्त आत्मा को नहीं। ‘प्राण’ जीवन के संकट का भाव गरिमापूर्ण और सहज ढंग से व्यक्त करता है।
- source_word: τὸν ἑαυτῶν τράχηλον ὑπέθηκαν
  choice: अपनी गर्दनें दाँव पर लगा दी थीं
  rationale: यूनानी मुहावरा जानलेवा खतरा मोल लेने का चित्र प्रस्तुत करता है। यह हिन्दी मुहावरा उस ठोस चित्र और आशय दोनों को बनाए रखता है; बहुवचन ‘गर्दनें’ दो व्यक्तियों के लिए स्वाभाविक है।
- source_word: οἷς οὐκ ἐγὼ μόνος εὐχαριστῶ ἀλλὰ καὶ
  choice: उनका धन्यवाद केवल मैं ही नहीं, बल्कि ... भी करती हैं
  rationale: यह रचना पौलुस पर दिए गए बल और ‘केवल...नहीं, बल्कि...भी’ के विरोध को स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: πᾶσαι αἱ ἐκκλησίαι
  choice: सारी कलीसियाएँ
  rationale: निश्चित बहुवचन का सामूहिक विस्तार व्यक्त होता है; ‘कलीसिया’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों की
  rationale: पौलुस के सन्दर्भ में ἔθνη मुख्यतः यहूदी न होने वाले लोगों को सूचित करता है; यह चयन जातीय-धार्मिक भेद को स्पष्ट रखता है।
theological_decisions:
- issue: ψυχή का सन्दर्भगत अर्थ
  choice: प्राण अर्थात जीवन
  alternative: आत्मा
  rationale: वाक्य में घातक जोखिम उठाने की बात है, इसलिए यहाँ पौलुस के जीवित बचने का आशय है, मनुष्य की अभौतिक आत्मा का विशिष्ट अर्थ नहीं।
- issue: ἐθνῶν का अर्थ
  choice: गैर-यहूदी
  alternative: राष्ट्रों/जातियों
  rationale: रोमियों के पत्र में यह पद सामान्यतः यहूदियों से भिन्न लोगों को दर्शाता है। ‘गैर-यहूदी’ इस सन्दर्भ को स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक रूप पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गर्दनें दाँव पर लगाना’ मूल के सजीव मुहावरे और उसके प्राणघातक जोखिम के अर्थ को साथ रखता है; ‘गैर-यहूदी’ पौलुस के प्रसंग को स्पष्ट करता है।
