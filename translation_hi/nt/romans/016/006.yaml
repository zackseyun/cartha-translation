lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: पत्र के समापन में यह बहुवचन आज्ञार्थक क्रिया अभिवादन पहुँचाने का निर्देश देती है। ‘नमस्कार कहना’ आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Μαριάμ
  choice: मरियम
  rationale: बाइबिलीय हिन्दी में इस व्यक्तिगत नाम का प्रचलित और पहचाना जाने वाला रूप ‘मरियम’ है।
- source_word: ἥτις
  choice: जिसने
  rationale: यह सम्बन्धवाचक सर्वनाम मरियम के परिश्रम का वर्णन आरम्भ करता है; हिन्दी में ‘जिसने’ सहज रूप से वही सम्बन्ध व्यक्त करता है।
- source_word: πολλὰ ἐκοπίασεν
  choice: बहुत परिश्रम किया है
  rationale: πολλὰ परिश्रम की अधिकता और κοπιάω कठिन श्रम को व्यक्त करता है। ‘बहुत परिश्रम किया है’ स्वाभाविक हिन्दी में दोनों भावों को सुरक्षित रखता है और वर्तमान प्रशंसा से उस पिछले कार्य का सम्बन्ध दिखाता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे लिए
  rationale: प्रदत्त SBLGNT पाठ में यह पदबंध प्राप्तकर्ताओं के हित में किए गए श्रम को सबसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: अन्तिम पदबंध का पाठांतर
  choice: तुम्हारे लिए
  alternative: हमारे लिए; तुम्हारे बीच
  rationale: मुख्य पाठ प्रदत्त SBLGNT के εἰς ὑμᾶς का अनुसरण करता है। अन्य प्राचीन पांडुलिपियों में अर्थपूर्ण पाठांतर हैं, इसलिए उन्हें पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘परिश्रम’ कठिन श्रम की तीव्रता बनाए रखता है; वाक्य में कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई है।
