  text: Συνίστημι δὲ ὑμῖν Φοίβην τὴν ἀδελφὴν ἡμῶν, οὖσαν ⸀καὶ διάκονον τῆς ἐκκλησίας τῆς ἐν Κεγχρεαῖς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/001.yaml
  text: I commend to you Phoebe[a], our sister, who is also a deacon of the church in Cenchreae,
translation:
  language: hi
  text: मैं हमारी बहन फीबे की तुमसे सिफारिश करता हूँ, जो किंख्रिया की कलीसिया की सेविका[a] भी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डीकन” अथवा “सेवा करनेवाली।” यूनानी शब्द διάκονος किसी मान्य कलीसियाई सेवकाई-भूमिका को, या अधिक सामान्य रूप से सेवा करने वाले व्यक्ति को, दर्शा सकता है।
    reason: मूल शब्द की पदनाम और सामान्य सेवा—दोनों सम्भव अर्थ-छायाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: Συνίστημι
  choice: सिफारिश करता हूँ
  rationale: पत्र के इस संदर्भ में क्रिया किसी व्यक्ति का अनुकूल परिचय देकर उसे स्वीकार करने की सिफारिश करने का भाव रखती है।
- source_word: δὲ
  choice: अलग शब्द से अनूदित नहीं
  rationale: यहाँ δέ हल्के प्रसंग-परिवर्तन का संकेत देता है, प्रबल विरोध या कालगत ‘अब’ का नहीं; स्वाभाविक हिन्दी वाक्य में इसे अलग शब्द दिए बिना प्रवाह से व्यक्त किया गया है।
- source_word: Φοίβην
  choice: फीबे
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: τὴν ἀδελφὴν ἡμῶν
  choice: हमारी बहन
  rationale: मूल का पारिवारिक और विश्वास-समुदाय संबंधी संबोधन सीधे बनाए रखा गया है, बिना ‘विश्वास में’ जैसे व्याख्यात्मक शब्द जोड़े।
- source_word: οὖσαν καὶ
  choice: जो … भी हैं
  rationale: प्रतिभागी रचना को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है और καί का योगसूचक भाव ‘भी’ से सुरक्षित रखा गया है।
- source_word: διάκονον
  choice: सेविका
  rationale: διάκονος सेवा करने वाले व्यक्ति अथवा किसी मान्य कलीसियाई सेवकाई-भूमिका, दोनों को सूचित कर सकता है। ‘सेविका’ हिन्दी में स्त्री के लिए स्वाभाविक है और मूल की व्यापक अर्थ-सीमा को बनाए रखती है; पदनाम की सम्भावना पादटिप्पणी में दी गई है।
- source_word: τῆς ἐκκλησίας
  choice: कलीसिया की
  rationale: पौलुस के पत्रों में ἐκκλησία स्थानीय मसीही समुदाय को दर्शाता है; ‘कलीसिया’ इस संदर्भ का स्थापित और स्पष्ट हिन्दी शब्द है।
- source_word: τῆς ἐν Κεγχρεαῖς
  choice: किंख्रिया की
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण लिया गया है और संबंधसूचक रचना स्थानीय कलीसिया से जुड़ाव को स्वाभाविक रूप से व्यक्त करती है।
theological_decisions:
- issue: διάκονον सामान्य सेवा-सूचक शब्द है या कलीसियाई भूमिका का पदनाम
  choice: मुख्य पाठ में ‘सेविका’
  alternative: ‘डीकन’ अथवा ‘सेवकाई करनेवाली’
  rationale: यूनानी शब्द दोनों अर्थों की अनुमति देता है। किसी विशिष्ट स्थानीय कलीसिया के साथ संबंध एक पहचानी हुई सेवकाई-भूमिका की सम्भावना बढ़ाता है, पर बाद की संस्थागत संरचना को निश्चित नहीं करता। इसलिए मुख्य पाठ में स्वाभाविक व्यापक शब्द रखा गया और पदनाम की सम्भावना पादटिप्पणी में स्पष्ट की गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘फीबे’, ‘किंख्रिया’ और ‘कलीसिया’ परिचित बाइबलीय रूप हैं। वाक्य मूल की एकवाक्यता और संबंधवाचक पहचान को बनाए रखता है; δέ के लिए अनावश्यक ‘अब’ नहीं जोड़ा गया।
