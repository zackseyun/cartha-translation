id: ROM.16.23
reference: Romans 16:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Γάϊος ὁ ξένος μου καὶ ⸂ὅλης τῆς ἐκκλησίας⸃. ἀσπάζεται ὑμᾶς Ἔραστος ὁ οἰκονόμος τῆς πόλεως καὶ Κούαρτος ὁ ἀδελφός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/023.yaml
  text: Gaius[a], my host and the host of the whole church, greets you. Erastus, the city treasurer, greets you, and Quartus, the brother.
translation:
  language: hi
  text: मेरे और पूरी कलीसिया के मेज़बान गायुस तुम्हें नमस्कार कहते हैं। नगर के कोषाध्यक्ष[a] इरास्तुस और भाई क्वारतुस तुम्हें नमस्कार कहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर के प्रबंधक।” यूनानी शब्द व्यापक अर्थ में किसी नागरिक प्रशासक को भी सूचित कर सकता है, यद्यपि यहाँ “कोषाध्यक्ष” सम्भावित पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: नमस्कार कहते हैं
  rationale: पौलुस के पत्रों के समापन में यह क्रिया अभिवादन पहुँचाने के अर्थ में प्रयुक्त होती है; यह हिन्दी में स्वाभाविक और सीधा है।
- source_word: ξένος
  choice: मेज़बान
  rationale: इस प्रसंग में गायुस वह व्यक्ति है जो पौलुस और पूरी कलीसिया का आतिथ्य करता है; इसलिए ‘अजनबी’ या ‘अतिथि’ नहीं, ‘मेज़बान’ उपयुक्त है।
- source_word: ὅλης τῆς ἐκκλησίας
  choice: पूरी कलीसिया
  rationale: ὅλης की व्यापकता को ‘पूरी’ से बनाए रखा गया है, और पौलुस के प्रयोग में ἐκκλησία के लिए प्रचलित हिन्दी शब्द ‘कलीसिया’ लिया गया है।
- source_word: οἰκονόμος τῆς πόλεως
  choice: नगर के कोषाध्यक्ष
  rationale: नागरिक प्रशासन के संदर्भ में οἰκονόμος किसी नगर अधिकारी या प्रबंधक को सूचित कर सकता है; ‘कोषाध्यक्ष’ सम्भावित वित्तीय पद को स्पष्ट रूप से व्यक्त करता है, जबकि व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἀδελφός
  choice: भाई
  rationale: यह पुल्लिंग एकवचन है और क्वारतुस को सहविश्वासी के रूप में बताता है। यूनानी में कोई स्पष्ट ‘हमारा’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
theological_decisions:
- issue: ἐκκλησία का अनुवाद
  choice: कलीसिया
  alternative: सभा / मण्डली
  rationale: यहाँ शब्द मसीही समुदाय को दर्शाता है। ‘कलीसिया’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है और मूल से अतिरिक्त कलीसियाई व्यवस्था नहीं जोड़ता।
- issue: ἀδελφός में पारिवारिक और लैंगिक अर्थ
  choice: भाई
  alternative: सहविश्वासी / हमारा भाई
  rationale: मूल पाठ पुल्लिंग एकवचन में है। ‘भाई’ उसके पारिवारिक रूपक और लिंग दोनों को रखता है; ‘हमारा’ जोड़ना मूल से आगे जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। व्यक्तिनामों को प्रचलित हिन्दी बाइबलीय रूपों में रखा गया है। दोनों यूनानी वाक्यों की अभिवादन-संरचना को स्पष्ट हिन्दी वाक्यों में सुरक्षित रखा गया है।
