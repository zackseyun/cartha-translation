base_translation:
  language: en
  yaml_path: translation/nt/romans/016/009.yaml
  text: Greet Urbanus[a], our fellow worker in Messiah, and Stachys, my beloved.
translation:
  language: hi
  text: मसीह में हमारे सहकर्मी उरबानुस को, और मेरे प्रिय स्ताखुस को नमस्कार कहना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहो
  rationale: पत्र के अभिवादन-सूची प्रसंग में बहुवचन आज्ञार्थक क्रिया का यह स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: Οὐρβανὸν
  choice: उरबानुस
  rationale: यूनानी में लिखे लैटिन व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: συνεργὸν ἡμῶν
  choice: हमारे सहकर्मी
  rationale: यह साथ मिलकर काम करने और पौलुस तथा उसके साथियों के साथ साझेदारी का भाव सुरक्षित रखता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: ἐν का संबंधपरक/क्षेत्रगत भाव बनाए रखते हुए Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ कहा गया है।
- source_word: Στάχυν
  choice: स्तखुस
  rationale: यूनानी व्यक्तिगत नाम Στάχυς के कर्मकारक रूप का हिन्दी में प्रचलित नाम-रूपानुसार लिप्यंतरण।
- source_word: ἀγαπητόν μου
  choice: मेरे प्रिय
  rationale: यह पौलुस के व्यक्तिगत स्नेह को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस सूत्रात्मक वाक्यांश में भी Χριστός की उपाधिगत पहचान स्पष्ट है; ‘मसीह’ मूल शब्द के अभिषिक्त जन के अर्थ और हिन्दी पाठक की समझ—दोनों के अनुकूल है।
- issue: ἐν Χριστῷ का संबंध
  choice: ‘मसीह में’ को ‘सहकर्मी’ से जोड़ना
  alternative: ‘मसीह के कार्य में हमारे सहकर्मी’
  rationale: शाब्दिक संबंध और पौलुस के विशिष्ट ‘मसीह में’ सूत्र की व्यापकता बनाए रखी गई है; इसे केवल सेवाकार्य तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। यूनानी वाक्य की अभिवादन-सूची वाली सीधी संरचना रखी गई है।
