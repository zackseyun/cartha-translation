  text: ἀσπάσασθε Ἀπελλῆν τὸν δόκιμον ἐν Χριστῷ. ἀσπάσασθε τοὺς ἐκ τῶν Ἀριστοβούλου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/010.yaml
  text: Greet Apelles[a], the approved one in Messiah. Greet those of the household of Aristobulus.
translation:
  language: hi
  text: मसीह में खरे सिद्ध हुए अपेल्लेस को नमस्कार कहना। अरिस्तोबुलुस के घराने के लोगों[a] को नमस्कार कहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में संक्षेप से ‘अरिस्तोबुलुस के लोगों’ कहा गया है; आशय उसके घराने या उससे जुड़े लोगों से हो सकता है।
    reason: मूल वाक्यांश की संक्षिप्तता और ‘घराने’ के अर्थ-विस्तार को स्पष्ट करना।
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: बहुवचन आज्ञार्थक क्रिया अभिवादन पहुँचाने को कहती है। ‘नमस्कार कहना’ आधुनिक हिन्दी में स्वाभाविक है और इस पद में दोहराव को बनाए रखता है।
- source_word: Ἀπελλῆν
  choice: अपेल्लेस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: τὸν δόκιμον
  choice: खरे सिद्ध हुए
  rationale: δόκιμος ऐसे व्यक्ति को दर्शाता है जो परखे जाने पर असली या स्वीकारयोग्य सिद्ध हुआ हो। ‘खरे सिद्ध हुए’ उसके प्रशंसात्मक और परीक्षित होने के दोनों भावों को संक्षेप में रखता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: पौलुस की संबंध अथवा क्षेत्र व्यक्त करने वाली विशेष अभिव्यक्ति को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है; Χριστός का पदवीगत अर्थ ‘मसीह’ से व्यक्त होता है।
- source_word: τοὺς ἐκ τῶν Ἀριστοβούλου
  choice: अरिस्तुबुलुस के घराने के लोगों
  rationale: यूनानी वाक्यांश शाब्दिक रूप से ‘अरिस्तुबुलुस के लोगों में से’ जैसा है और सम्भवतः उसके घराने या प्रतिष्ठान से जुड़े लोगों को सूचित करता है। स्पष्ट हिन्दी के लिए ‘घराने के लोगों’ चुना गया है, जबकि मूल की संक्षिप्तता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστός का अनुवाद
  choice: मसीह में
  alternative: ख्रीष्ट में
  rationale: यहाँ Χριστός पदवीगत अर्थ रखता है और पौलुस की ‘मसीह में’ वाली धर्मवैचारिक अभिव्यक्ति को यथावत रखना उचित है। हिन्दी में ‘मसीह’ स्वाभाविक और व्यापक रूप से समझा जाता है।
- issue: δόκιμος का आशय
  choice: खरे सिद्ध हुए
  alternative: स्वीकृत / परखे हुए
  rationale: पाठ यह स्पष्ट नहीं करता कि परीक्षा किस विशेष घटना से हुई; इसलिए ऐसा अनुवाद चुना गया है जो परखे जाकर खरा पाए जाने का भाव रखता है, पर कोई अतिरिक्त प्रसंग नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। दोनों आज्ञाओं की समान रचना और पौलुस की ‘मसीह में’ अभिव्यक्ति सुरक्षित हैं।
