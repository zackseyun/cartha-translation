  rationale: यूनानी में यह दत्तिवाचक पदबंध है जिसका व्याकरणिक समापन पद 27 में होता है। इसी पद में कर्ता या निष्कर्ष जोड़ना मूल की रचना को समय से पहले सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद मूल यूनानी की तरह अगले पदों में पूरी होने वाली समापन-स्तुति का आरम्भ है; इसलिए अंत में दीर्घ विराम-चिह्न वाक्य के जारी रहने का संकेत देता है। ‘अब’ नहीं जोड़ा गया, क्योंकि मूल में स्पष्ट कालवाचक ‘अब’ नहीं है।
