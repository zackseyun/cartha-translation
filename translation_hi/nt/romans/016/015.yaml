reference: Romans 16:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀσπάσασθε Φιλόλογον καὶ Ἰουλίαν, Νηρέα καὶ τὴν ἀδελφὴν αὐτοῦ, καὶ Ὀλυμπᾶν καὶ τοὺς σὺν αὐτοῖς πάντας ἁγίους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/015.yaml
  text: Greet Philologus and Julia[a], Nereus and his sister, and Olympas and all the saints with them.
translation:
  language: hi
  text: फिलोलोगुस और यूलिया[a] को, नेरियुस और उसकी बहन को, और ओलुम्पास तथा उनके साथ के सभी पवित्र जनों को नमस्कार कहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “यूलियास,” यदि इस नाम को पुल्लिंग माना जाए; यूनानी रूप को सामान्यतः स्त्रीलिंग नाम “यूलिया” समझा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: पत्र के अभिवादन-संदर्भ में यह बहुवचन आज्ञा का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: Φιλόλογον
  choice: फिलोलोगुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: Ἰουλίαν
  choice: यूलिया
  rationale: यह कर्मकारक रूप सबसे स्वाभाविक रूप से स्त्रीलिंग नाम यूलिया को दर्शाता है; सम्भावित पुल्लिंग समझ को पाद-टिप्पणी में रखा गया है।
- source_word: Νηρέα
  choice: नेरियुस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित रूप के निकट देवनागरी लिप्यंतरण।
- source_word: τὴν ἀδελφὴν αὐτοῦ
  choice: उसकी बहन
  rationale: ἀδελφή का अर्थ ‘बहन’ है और αὐτοῦ का सम्बन्ध निकटतम नाम नेरियुस से स्वाभाविक रूप से लिया गया है।
- source_word: Ὀλυμπᾶν
  choice: ओलुम्पास
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जिसमें मूल उच्चारण का निकट रूप रखा गया है।
- source_word: τοὺς σὺν αὐτοῖς
  choice: उनके साथ के
  rationale: σύν के संगति-सूचक अर्थ को सहज हिन्दी में व्यक्त करता है, बिना यह तय किए कि समूह किस प्रकार उनके साथ था।
- source_word: πάντας ἁγίους
  choice: सभी पवित्र जनों
  rationale: पौलुस के प्रयोग में यह मसीही विश्वासियों के लिए सामूहिक संबोधन है। ‘पवित्र जन’ मूल के विशेषण-संज्ञा भाव को बनाए रखता है और बाद की औपचारिक संत-उपाधि का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: पौलुस की अभिवादन-सूची में ἅγιοι का अनुवाद
  choice: पवित्र जन
  alternative: सन्त; परमेश्वर के पवित्र लोग
  rationale: ‘पवित्र जन’ मूल अर्थ और पौलुस के विश्वासियों के लिए प्रयुक्त सामूहिक पद को सुरक्षित रखता है, जबकि किसी बाद की धर्म-संस्थागत उपाधि को नहीं थोपता।
- issue: Ἰουλίαν का लिंग
  choice: यूलिया
  alternative: यूलियास
  rationale: यूनानी रूप सामान्यतः स्त्रीलिंग नाम यूलिया समझा जाता है। अनुवाद-परम्परा में उठी पुल्लिंग सम्भावना को पारदर्शिता के लिए पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज पत्रात्मक शैली अपनाई गई है। नामों को मूल यूनानी के निकट देवनागरी में लिखा गया है; ‘नमस्कार कहना’ सामान्य पाठक के लिए स्वाभाविक निर्देशात्मक अभिव्यक्ति है।
