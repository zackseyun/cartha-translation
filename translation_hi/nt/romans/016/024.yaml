id: ROM.16.24
reference: Romans 16:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ πάντων ὑμῶν.⸃ ⸀Ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/024.yaml
  text: The grace of our Lord Jesus Christ be with all of you[b][a]. Amen.
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह का अनुग्रह तुम सबके साथ रहे।[a] आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में यह पद मिलता है, जबकि अन्य में नहीं मिलता; इसलिए अनेक आधुनिक यूनानी संस्करण इसे रोमियों के समापन में पाठांतर मानकर कोष्ठकों में रखते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के आशीर्वचन में यह परमेश्वर की कृपापूर्ण भलाई और वरदान का अर्थ रखता है; ‘अनुग्रह’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और अर्थपूर्ण है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यीशु की प्रभुता व्यक्त करने वाले इस ख्रीस्तीय शीर्षक के लिए ‘प्रभु’ मानक और स्वाभाविक हिन्दी रूप है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘यीशु’ नाम का प्रचलित हिन्दी रूप है और ‘मसीह’ Χριστός के अभिषिक्त जन वाले शीर्षकीय अर्थ को सुरक्षित रखता है।
- source_word: μετὰ πάντων ὑμῶν
  choice: तुम सबके साथ
  rationale: μετά के साथ होने तथा πάντων ὑμῶν के पूरे समुदाय को समेटने वाले भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Ἀμήν
  choice: आमीन
  rationale: उपासना और बाइबलीय परंपरा में प्रचलित ध्वन्यात्मक रूप है, जो समापन की पुष्टि को बनाए रखता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός शीर्षकीय अर्थ बनाए रखता है; ‘मसीह’ उसके ‘अभिषिक्त जन’ संबंधी अर्थ और यहूदी पृष्ठभूमि को हिन्दी में अधिक पारदर्शी ढंग से व्यक्त करता है।
- issue: पद की पाठ-समीक्षात्मक स्थिति
  choice: पद को मुख्य पाठ में रखते हुए पाठांतर की सूचना पादटिप्पणी में देना
  alternative: पद को मुख्य पाठ से हटाना या कोष्ठक में रखना
  rationale: दिए गए SBLGNT पाठ में पूरा वाक्य पाठ-समीक्षात्मक चिह्नों से घिरा है, जो इसकी संदिग्ध/परिवर्ती स्थिति बताता है; इसलिए पाठ को प्रस्तुत करते हुए अनिश्चितता स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण आशीर्वचन। बहुवचन सम्बोधन के लिए ‘तुम सब’ अपनाया गया है, जो समुदाय को संबोधित करने में स्पष्ट और स्वाभाविक है।
