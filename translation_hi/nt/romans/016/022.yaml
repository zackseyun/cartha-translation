source:
  edition: SBLGNT
  text: ἀσπάζομαι ὑμᾶς ἐγὼ Τέρτιος ὁ γράψας τὴν ἐπιστολὴν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/022.yaml
  text: I[a], Tertius, who wrote the letter, greet you in the Lord.
translation:
  language: hi
  text: मैं, तिरतियुस, जिसने यह पत्र लिखा है, प्रभु में आपको नमस्कार कहता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य, पर कम सम्भावित अर्थ: “मैं, तिरतियुस, जिसने प्रभु में यह पत्र लिखा है, आपको नमस्कार कहता हूँ।” यूनानी में “प्रभु में” को “लिखा है” के साथ भी जोड़ा जा सकता है, यद्यपि इसे अभिवादन के साथ जोड़ना अधिक स्वाभाविक है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάζομαι
  choice: नमस्कार कहता हूँ
  rationale: पत्र के समापन में यह क्रिया अभिवादन देने का भाव रखती है। ‘नमस्कार कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और मूल से अधिक आत्मीयता नहीं जोड़ती।
- source_word: ὑμᾶς
  choice: आपको
  rationale: यह द्वितीय पुरुष बहुवचन कर्म है। आदरपूर्ण आधुनिक हिन्दी में ‘आपको’ स्वाभाविक है और सामूहिक संबोधन को प्रसंग से समझा जा सकता है।
- source_word: ἐγὼ Τέρτιος
  choice: मैं, तिरतियुस
  rationale: स्पष्ट सर्वनाम के साथ नाम वक्ता की अलग पहचान पर बल देता है; यह रूप उस आत्म-परिचय को बनाए रखता है।
- source_word: ὁ γράψας
  choice: जिसने ... लिखा है
  rationale: संज्ञासदृश एओरिस्ट कृदंत तिरतियुस को पत्र लिखने वाले व्यक्ति के रूप में पहचानता है। हिन्दी में यह संबंधवाचक रचना सहज है।
- source_word: τὴν ἐπιστολήν
  choice: यह पत्र
  rationale: यूनानी में निश्चित उपपद है, और हिन्दी प्रसंग में सामने उपस्थित इसी लेख को सूचित करने के लिए ‘यह पत्र’ सबसे स्वाभाविक है; ‘पत्री’ की अपेक्षा ‘पत्र’ अधिक वर्तमान और सामान्य है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुसी संबंध/क्षेत्रसूचक अभिव्यक्ति है। ‘प्रभु में’ इसकी संक्षिप्तता और धर्मवैचारिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ἐν κυρίῳ (‘प्रभु में’) का संबंध
  choice: 'इसे मुख्य अभिवादन से जोड़ा गया है: तिरतियुस प्रभु में नमस्कार कहता है।'
  alternative: 'इसे पत्र लिखने से जोड़ा जा सकता है: ‘जिसने प्रभु में यह पत्र लिखा है।’'
  rationale: शब्दक्रम के कारण दोनों व्याकरणिक संबंध संभव हैं, पर पत्रात्मक अभिवादन के प्रसंग में मुख्य क्रिया के साथ इसका संबंध अधिक स्वाभाविक है। वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तिरतियुस’ नाम का निकट ध्वन्यात्मक लिप्यंतरण है; ‘प्रभु में’ को पारंपरिक किंतु आज भी समझ में आने वाले बाइबलीय प्रयोग के रूप में रखा गया है।
