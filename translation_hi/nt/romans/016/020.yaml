id: ROM.16.20
reference: Romans 16:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς τῆς εἰρήνης συντρίψει τὸν Σατανᾶν ὑπὸ τοὺς πόδας ὑμῶν ἐν τάχει. ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ ⸀Χριστοῦ μεθ’ ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/020.yaml
  text: And the God of peace will soon crush Satan under your feet[a]. The grace of our Lord Jesus Christ be with you.
translation:
  language: hi
  text: और शांति का परमेश्वर शैतान को जल्द ही तुम्हारे पैरों तले कुचल देगा। हमारे प्रभु यीशु मसीहा[a] का अनुग्रह तुम्हारे साथ रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या परंपरागत रूप में, “यीशु मसीह।”
    reason: Χριστός के उपाधिगत अर्थ ‘मसीहा’ और हिन्दी में प्रचलित नाम-जैसे रूप ‘मसीह’—दोनों को पाठक के सामने रखना।
lexical_decisions:
- source_word: ὁ δὲ θεὸς τῆς εἰρήνης
  choice: और शांति का परमेश्वर
  rationale: यह पौलुस के प्रचलित संबंधकारकीय संबोधन को सीधे और स्वाभाविक रूप में रखता है; इसे व्याख्यात्मक रूप से ‘शांति देने वाला परमेश्वर’ नहीं बनाया गया। δέ को प्रसंग से जोड़ने वाले सहज ‘और’ से व्यक्त किया गया है।
- source_word: συντρίψει
  choice: कुचल देगा
  rationale: भविष्यकाल की निश्चित क्रिया और पैरों तले पराजित करने की बिंबात्मक भाषा—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸν Σατανᾶν
  choice: शैतान को
  rationale: यूनानी पाठ में यह व्यक्तिवाचक नाम है; हिन्दी के मानक बाइबलीय रूप ‘शैतान’ को रखा गया है, न कि मुख्य पाठ में ‘विरोधी’ जैसी व्याख्या।
- source_word: ὑπὸ τοὺς πόδας ὑμῶν
  choice: तुम्हारे पैरों तले
  rationale: विजय और अधीनता का मुहावरा स्वाभाविक हिन्दी में सुरक्षित है। ‘तुम्हारे’ सामूहिक संबोधन को बनाए रखता है।
- source_word: ἐν τάχει
  choice: जल्द ही
  rationale: यहाँ निकट भविष्य का भाव सबसे स्वाभाविक है; ‘तेजी से’ क्रिया की गति का अर्थ दे सकता था।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: पौलुस की आशीर्वचन शैली के प्रमुख धार्मिक शब्द को हिन्दी के परिचित और गरिमापूर्ण रूप में सुरक्षित रखा गया है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु ... का
  rationale: संबंधकारक को स्वामित्व-संबंध के रूप में रखा गया है और κύριος के लिए मानक ‘प्रभु’ चुना गया है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीहा
  rationale: Χριστός के ‘अभिषिक्त जन’ वाले उपाधिगत अर्थ को ‘मसीहा’ से स्पष्ट किया गया है; परिचित पारंपरिक रूप ‘यीशु मसीह’ पादटिप्पणी में दिया गया है।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ रहे
  rationale: यूनानी में क्रिया अध्याहृत है; स्वाभाविक हिन्दी आशीर्वचन के लिए ‘रहे’ जोड़ना आवश्यक है।
theological_decisions:
- issue: समापन आशीर्वचन में Χριστοῦ का अनुवाद
  choice: मसीहा
  alternative: मसीह
  rationale: यहाँ यीशु के साथ लगी उपाधि का अर्थ अभी भी पहचाना जा सकता है, इसलिए अर्थसूचक ‘मसीहा’ मुख्य पाठ में है। हिन्दी की पारंपरिक, नाम-जैसी अभिव्यक्ति ‘मसीह’ को पाठकीय परिचय और पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
- issue: परमेश्वर द्वारा शैतान को विश्वासियों के पैरों तले कुचलना
  choice: मूल सामूहिक विजय-बिंब को यथावत रखना
  alternative: परमेश्वर शैतान को स्वयं अपने पैरों तले कुचलेगा
  rationale: पाठ परमेश्वर को कर्ता और रोमी विश्वासियों के पैरों को पराजय का स्थान—दोनों बताता है। इस तनाव को किसी एक पक्ष के पक्ष में सरल नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम्हारे’ मूल के बहुवचन सामूहिक संबोधन को दर्शाता है। विजय के मुहावरे के लिए ‘पैरों तले’ और निकटता के लिए ‘जल्द ही’ सामान्य पाठक को स्पष्ट हैं।
