  text: Ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἁγίῳ. Ἀσπάζονται ὑμᾶς αἱ ἐκκλησίαι ⸀πᾶσαι τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/016.yaml
  text: Greet one another with a holy kiss[b][a]. All the churches of Messiah greet you.
translation:
  language: hi
  text: पवित्र चुम्बन के साथ एक-दूसरे का अभिवादन करो।[a] मसीह की सभी कलीसियाएँ तुम्हें नमस्कार कहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पवित्र चुम्बन’ उस समय विश्वासियों के बीच पवित्र स्नेह और संगति प्रकट करने वाला सांस्कृतिक रूप से पहचाना जाने वाला अभिवादन था।
    reason: cultural_note
lexical_decisions:
- source_word: Ἀσπάσασθε ἀλλήλους
  choice: एक-दूसरे का अभिवादन करो
  rationale: ἀσπάσασθε अभिवादन करने की आज्ञा है और ἀλλήλους पारस्परिकता व्यक्त करता है। यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: ἐν φιλήματι ἁγίῳ
  choice: पवित्र चुम्बन के साथ
  rationale: ἐν यहाँ साधन अथवा रीति का भाव देता है; φίλημα का अर्थ चुम्बन और ἁγίῳ का अर्थ पवित्र है। सांस्कृतिक प्रथा को बदलकर किसी आधुनिक अभिवादन का नाम नहीं दिया गया।
- source_word: Ἀσπάζονται ὑμᾶς
  choice: तुम्हें नमस्कार कहती हैं
  rationale: पत्र के समापन में प्रयुक्त ἀσπάζονται का अर्थ अभिवादन या नमस्कार भेजना है। हिंदी में यह वाक्य-विन्यास सहज है और ὑμᾶς के बहुवचन संबोधन को संदर्भ से स्पष्ट रहने देता है।
- source_word: αἱ ἐκκλησίαι πᾶσαι
  choice: सभी कलीसियाएँ
  rationale: लेख सहित πᾶσαι सामूहिक समग्रता पर बल देता है। 'सभी कलीसियाएँ' संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह की
  rationale: Χριστός यहाँ उपाधि और संबंध—मसीह से संबंधित कलीसियाएँ—दोनों व्यक्त करता है। 'मसीह' आधुनिक हिंदी में स्थापित, अर्थपूर्ण रूप है।
theological_decisions:
- issue: τοῦ Χριστοῦ का अनुवाद
  choice: मसीह की
  alternative: ख्रीस्त की / मसीहा की
  rationale: '''मसीह'' Χριστός की यहूदी-मसीही उपाधि को सुरक्षित रखता है और हिंदी पाठकों के लिए स्वाभाविक है; इसे केवल व्यक्तिगत नाम मानकर अर्थ-संकेत मिटाया नहीं गया।'
translation_notes:
  register: आज्ञार्थक शैली सीधी, गरिमापूर्ण और आधुनिक मानक हिंदी में रखी गई है। 'चुम्बन' और 'कलीसिया' प्रचलित बाइबलीय शब्द हैं; सांस्कृतिक अभिवादन को पाठ में समझाकर या आधुनिक समकक्ष से बदलकर मूल चित्र को मिटाया नहीं गया।
