reference: Romans 16:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, σκοπεῖν τοὺς τὰς διχοστασίας καὶ τὰ σκάνδαλα παρὰ τὴν διδαχὴν ἣν ὑμεῖς ἐμάθετε ποιοῦντας, καὶ ⸀ἐκκλίνετε ἀπ’ αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/017.yaml
  text: I urge you[a], brothers, to watch out for those who cause divisions and stumbling blocks contrary to the teaching that you learned, and turn away from them.
translation:
  language: hi
  text: भाइयो[a], मैं तुमसे आग्रह करता हूँ कि उन लोगों से सावधान रहो, जो उस शिक्षा के विरुद्ध फूट डालते और ठोकर के कारण पैदा करते हैं जो तुमने सीखी थी; और उनसे दूर रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयो और बहनो”; यूनानी में “भाइयो” है और सम्भवतः पूरी मण्डली को सम्बोधित किया गया है।
    reason: शाब्दिक विकल्प और सम्बोधन के सम्भावित समावेशी दायरे को स्पष्ट करना।
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: यह पदबंध पौलुस की गंभीर पास्टरी विनती को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी का पुल्लिंग बहुवचन सम्बोधन सीधे रखा गया है; मण्डली की स्त्रियाँ भी सम्भवतः इसमें सम्मिलित हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: σκοπεῖν
  choice: सावधान रहो
  rationale: यहाँ क्रिया कुछ लोगों पर चौकस ध्यान देने और उनसे सतर्क रहने का आह्वान करती है; हिन्दी में यह चेतावनी का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: διχοστασίας
  choice: फूट
  rationale: यह समुदाय के भीतर उत्पन्न किए जाने वाले विभाजन और आपसी टूट को संक्षिप्त, सामान्य हिन्दी में व्यक्त करता है।
- source_word: σκάνδαλα
  choice: ठोकर खाने के कारण
  rationale: यह चुनाव मूल शब्द की ठोकर वाली रूपक-छवि को बनाए रखते हुए स्पष्ट करता है कि अभिप्राय दूसरों के गिरने या भटकने का कारण बनने वाली बातों से है।
- source_word: παρὰ τὴν διδαχήν
  choice: उस शिक्षा के विरुद्ध
  rationale: παρά के साथ कर्मकारक यहाँ सीखी हुई शिक्षा से विचलन या उसके विरोध को दर्शाता है।
- source_word: ἣν ὑμεῖς ἐμάθετε
  choice: जिसे तुमने सीखा है
  rationale: यह मूल के प्रत्यक्ष कथन और पहले प्राप्त की गई शिक्षा के भाव को सहज हिन्दी में रखता है।
- source_word: ποιοῦντας
  choice: डालते और ... पैदा करते हैं
  rationale: कृदन्त उन लोगों का वर्णन करता है जो सक्रिय रूप से फूट और ठोकर के कारण उत्पन्न करते हैं; दोनों संज्ञाओं के साथ हिन्दी के स्वाभाविक क्रियापद प्रयुक्त हैं।
- source_word: ἐκκλίνετε ἀπ’ αὐτῶν
  choice: उनसे दूर रहो
  rationale: यह उनसे अलग हटने या बचने की आज्ञा को स्पष्ट रखता है और यूनानी की दिशात्मक छवि भी पर्याप्त रूप से संप्रेषित करता है।
theological_decisions:
- issue: रोम की मण्डली को सम्बोधित ἀδελφοί का प्रतिनिधिक दायरा
  choice: मुख्य पाठ में “भाइयो” रखा गया और सम्भावित मिश्रित-लैंगिक सम्बोधन को पादटिप्पणी में बताया गया।
  alternative: मुख्य पाठ में “भाइयो और बहनो” लिखना।
  rationale: यूनानी रूप स्पष्ट रूप से पुल्लिंग बहुवचन है, पर पौलुस के मण्डलीगत प्रयोग में यह पूरी मण्डली को सम्बोधित कर सकता है। मुख्य पाठ रूप को सुरक्षित रखता है और पादटिप्पणी उसके सम्भावित व्यापक दायरे को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। “फूट” सामान्य पाठक के लिए सहज है, जबकि “ठोकर खाने के कारण” मूल रूपक को बनाए रखता है। लम्बे यूनानी वाक्य को अन्तिम आज्ञा से पहले विभाजित किया गया है ताकि हिन्दी में चेतावनी स्पष्ट और प्रभावी रहे।
