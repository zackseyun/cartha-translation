id: ROM.16.2
reference: Romans 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα ⸂αὐτὴν προσδέξησθε⸃ ἐν κυρίῳ ἀξίως τῶν ἁγίων, καὶ παραστῆτε αὐτῇ ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι, καὶ γὰρ αὐτὴ προστάτις πολλῶν ἐγενήθη καὶ ⸂ἐμοῦ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/002.yaml
  text: so that you may welcome her in the Lord in a manner worthy of the saints[a], and assist her in whatever matter she may need from you, for she herself has become a patron of many[b], and of myself as well.
translation:
  language: hi
  text: कि आप प्रभु में उसका स्वागत पवित्र जनों के योग्य रीति से करें, और जिस किसी मामले में उसे आपकी ज़रूरत हो, उसमें उसकी सहायता करें[a]; क्योंकि वह स्वयं बहुतों की आश्रयदात्री[b] रही है—मेरी भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका साथ दें।”
    reason: lexical_alternative
  - marker: b
    text: या, “उपकारिणी,” “संरक्षिका,” या “संरक्षक।” यूनानी शब्द ऐसी महिला का संकेत देता है जो दूसरों को सामाजिक, व्यावहारिक या आर्थिक सहायता देती थी; इसका अर्थ “आश्रयदात्री” या “उपकारी संरक्षक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδέξησθε
  choice: स्वागत करें
  rationale: यहाँ क्रिया का अर्थ फीबे को समुदाय में अनुकूलता और आतिथ्य के साथ ग्रहण करना है; आधुनिक हिन्दी में ‘स्वागत करें’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस का विशिष्ट प्रयोग है, जो प्रभु के साथ संबंध और मसीही संगति के क्षेत्र—दोनों को बनाए रखता है।
- source_word: ἀξίως τῶν ἁγίων
  choice: जैसे पवित्र जनों के योग्य है
  rationale: यह वाक्यांश स्वागत करने की रीति बताता है। ‘पवित्र जन’ ἅγιοι का स्पष्ट और गैर-सांप्रदायिक हिन्दी रूप है।
- source_word: παραστῆτε αὐτῇ
  choice: उसकी सहायता करें
  rationale: इस प्रसंग में अर्थ उसके पक्ष में खड़े होकर आवश्यक व्यावहारिक सहयोग देना है। ‘सहायता करें’ आधुनिक हिन्दी में स्वाभाविक है, जबकि वैकल्पिक ‘उसका साथ दें’ मूल रूपक को अधिक निकटता से रखता है।
- source_word: ἐν ᾧ ἂν ὑμῶν χρῄζῃ πράγματι
  choice: जिस किसी मामले में उसे आपसे सहायता चाहिए
  rationale: πρᾶγμα को व्यापक ‘मामला’ और χρῄζῃ ὑμῶν को प्रसंगानुसार ‘आपसे सहायता चाहिए’ कहा गया है, जिससे किसी विशेष प्रकार के काम को अनावश्यक रूप से निश्चित नहीं किया जाता।
- source_word: προστάτις
  choice: संरक्षिका
  rationale: स्त्रीलिंग संज्ञा ऐसी महिला को सूचित करती है जो दूसरों को प्रभावी समर्थन, संरक्षण या संसाधन देती थी। ‘संरक्षिका’ फीबे की सक्रिय और महत्त्वपूर्ण भूमिका को साधारण ‘सहायिका’ की अपेक्षा बेहतर रखता है; सामाजिक आश्रयदाता का भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐμοῦ αὐτοῦ
  choice: मेरी भी
  rationale: संक्षिप्त हिन्दी में ‘मेरी भी’ καί और बलयुक्त αὐτοῦ के जोड़ तथा व्यक्तिगत जोर को स्वाभाविक ढंग से व्यक्त करता है; डैश उस अंतिम जोर को उभारता है।
theological_decisions:
- issue: फीबे के लिए προστάτις का अर्थ
  choice: संरक्षिका
  alternative: उपकारिणी; आश्रयदात्री; सहायिका
  rationale: मूल शब्द संभवतः सामाजिक रूप से पहचानी जाने वाली सहायता, संरक्षण या आश्रयदाता की भूमिका बताता है, केवल सामान्य मदद नहीं। ‘संरक्षिका’ उसकी सक्रिय भूमिका और प्रतिष्ठा को बनाए रखता है, लेकिन इसे किसी बाद के कलीसियाई पद का नाम नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र जन’ पौलुस के सामुदायिक प्रयोग को स्पष्ट करता है। अंतिम ‘—मेरी भी’ मूल के व्यक्तिगत बल को सहज हिन्दी में उभारता है।
