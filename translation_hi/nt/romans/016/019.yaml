source:
  edition: SBLGNT
  text: ἡ γὰρ ὑμῶν ὑπακοὴ εἰς πάντας ἀφίκετο· ⸂ἐφ’ ὑμῖν οὖν χαίρω⸃, θέλω δὲ ὑμᾶς ⸀σοφοὺς εἶναι εἰς τὸ ἀγαθόν, ἀκεραίους δὲ εἰς τὸ κακόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/019.yaml
  text: For your obedience has reached everyone[a]. Therefore I rejoice over you, but I want you to be wise in what is good[c][b], and innocent in what is evil.
translation:
  language: hi
  text: क्योंकि तुम्हारी आज्ञाकारिता सब लोगों तक पहुँच गई है[a]। इसलिए मैं तुम्हारे विषय में आनन्दित हूँ[b]; पर मैं चाहता हूँ कि तुम भलाई के विषय में बुद्धिमान और बुराई के विषय में निर्दोष[c] रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी आज्ञाकारिता की खबर सब लोगों तक पहुँच गई है।” यूनानी में शाब्दिक रूप से, “तुम्हारी आज्ञाकारिता सब तक पहुँच गई है।”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुम्हारे कारण आनन्दित हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “बुराई के विषय में निष्कपट” अथवा “शुद्ध।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπακοή
  choice: आज्ञाकारिता
  rationale: पौलुस के प्रयोग में यह केवल सुनने नहीं, बल्कि आज्ञा मानने वाली प्रतिक्रिया को दर्शाता है।
- source_word: εἰς πάντας ἀφίκετο
  choice: सब लोगों तक पहुँच गई है
  rationale: यह यूनानी अभिव्यक्ति के ‘पहुँचने’ वाले रूपक को बनाए रखता है; सन्दर्भ में भाव यह है कि उनकी आज्ञाकारिता व्यापक रूप से जानी गई।
- source_word: ἐφ’ ὑμῖν χαίρω
  choice: मैं तुम्हारे विषय में आनन्दित हूँ
  rationale: ἐπί के कारण, अवसर या विषय के भाव को बिना अनावश्यक रूप से सीमित किए स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: σοφοὺς ... εἰς τὸ ἀγαθόν
  choice: भलाई के विषय में बुद्धिमान
  rationale: भलाई की ओर निर्देशित व्यावहारिक समझ और विवेक का भाव सुरक्षित रहता है।
- source_word: ἀκεραίους ... εἰς τὸ κακόν
  choice: बुराई के विषय में निष्कपट
  rationale: ἀκέραιος के अमिश्रित, शुद्ध और कपटरहित होने के अर्थ को नैतिक विरोध में संक्षेप से व्यक्त करता है।
theological_decisions:
- issue: πάντας का दायरा
  choice: सब लोगों
  alternative: सब जगह के विश्वासियों में / सभी के बीच
  rationale: कथन की व्यापक, प्रशंसात्मक और आलंकारिक शक्ति रखी गई है; इसे न तो गणितीय सार्वभौमिकता बनाया गया, न किसी अनुल्लिखित समूह तक सीमित किया गया।
- issue: भलाई में बुद्धिमानी और बुराई में ἀκέραιος होने का विरोध
  choice: भलाई के विषय में बुद्धिमान और बुराई के विषय में निष्कपट
  alternative: भलाई में समझदार और बुराई से अछूते
  rationale: सक्रिय नैतिक विवेक और बुराई से अमिश्रित रहने के बीच का तनाव सुरक्षित है; इसे अज्ञान या नासमझी की शिक्षा नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। समानांतर ‘भलाई के विषय में… बुराई के विषय में…’ संरचना मूल यूनानी के नैतिक विरोध को बनाए रखती है।
