lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: यह बहुवचन आज्ञार्थक क्रिया पत्रों में अभिवादन पहुँचाने का सामान्य निर्देश है; ‘नमस्कार कहना’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: Ἀμπλιᾶτον
  choice: अम्प्लियातुस
  rationale: SBLGNT के यूनानी रूप Ἀμπλιᾶτον को मूल नाम के कर्ताकार रूप Ἀμπλιᾶτος के अनुसार देवनागरी में लिप्यंतरित किया गया है।
- source_word: ἀγαπητόν μου
  choice: मेरे प्रिय
  rationale: यह प्रयोग पौलुस के व्यक्तिगत स्नेह को संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस का विशिष्ट वाक्यांश है, जो प्रभु के साथ संबंध अथवा मसीही सहभागिता के क्षेत्र को व्यक्त करता है; मूल में निहित न होने के कारण ‘यीशु’ नहीं जोड़ा गया।
theological_decisions:
- issue: पौलुस के स्नेह और ἐν κυρίῳ का संबंध
  choice: ‘प्रभु में’ को ‘मेरे प्रिय अम्प्लियातुस’ से जोड़ा गया है।
  alternative: इसे अभिवादन करने की क्रिया से जोड़ना, अथवा केवल व्यक्तिगत मित्रता समझना।
  rationale: यूनानी शब्दक्रम और व्याकरण स्वाभाविक रूप से अम्प्लियातुस को ऐसा व्यक्ति बताते हैं जो पौलुस का प्रिय है—विशेषतः प्रभु में। इससे व्यक्तिगत स्नेह और मसीही सहभागिता दोनों सुरक्षित रहते हैं।
