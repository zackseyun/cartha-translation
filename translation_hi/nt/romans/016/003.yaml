lexical_decisions:
- source_word: Ἀσπάσασθε
  choice: नमस्कार कहो
  rationale: यह बहुवचन आज्ञार्थक क्रिया पत्रों में अभिवादन पहुँचाने का सामान्य निर्देश है। ‘नमस्कार कहो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Πρίσκαν
  choice: प्रिस्का
  rationale: यूनानी पाठ में नाम का रूप Πρίσκα है; इसलिए परिचित वैकल्पिक रूप ‘प्रिस्किल्ला’ के बजाय स्रोत-पाठ का रूप मुख्य पाठ में रखा गया है।
- source_word: Ἀκύλαν
  choice: अक्विला
  rationale: यह Ἀκύλας नाम का मानक देवनागरी लिप्यंतरण है।
- source_word: συνεργούς μου
  choice: मेरे सहकर्मी
  rationale: यह पद उन लोगों को दर्शाता है जो पौलुस के साथ एक ही सेवा-कार्य में लगे थे। ‘सहकर्मी’ सहयोग और साझा श्रम दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ‘मसीह’ Χριστός के पदवीगत अर्थ को हिन्दी के प्रचलित बाइबलीय शब्द में व्यक्त करता है; ‘में’ उनके साझा कार्य के उस संबंध अथवा क्षेत्र को बनाए रखता है जो यीशु से जुड़ा है।
theological_decisions:
- issue: पौलुसीय पदबंध ἐν Χριστῷ Ἰησοῦ में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός यीशु की मसीही पदवी को बनाए रखता है। ‘मसीह यीशु’ हिन्दी में अर्थपूर्ण और स्थापित है, जबकि ‘ख्रीष्ट यीशु’ अधिक लिप्यंतरणपरक विकल्प है; उसे पारदर्शिता के लिए पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। यूनानी में एक ही वाक्य है, पर सामान्य पाठक के लिए संबंध स्पष्ट करने हेतु उसे दो छोटे वाक्यों में प्रस्तुत किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
