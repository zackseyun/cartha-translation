    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहो
  rationale: बहुवचन आज्ञार्थक क्रिया अभिवादन करने को कहती है; हिन्दी में यह स्वाभाविक और संक्षिप्त है।
- source_word: Ῥοῦφον
  choice: रूफुस
  rationale: व्यक्तिनाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: τὸν ἐκλεκτὸν
  choice: चुने हुए
  rationale: निर्धारक सहित विशेषण रूफुस का वर्णन करता है। यह चुनाव के अर्थ को बनाए रखता है, जबकि पादटिप्पणी 'विशिष्ट' अर्थ की संभावना बताती है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: मूल वाक्यांश की संबंध अथवा क्षेत्र-सूचक अस्पष्टता को बनाए रखता है; इसे 'प्रभु द्वारा' नहीं बनाया गया।
- source_word: τὴν μητέρα αὐτοῦ καὶ ἐμοῦ
  choice: उसकी माता को भी, जो मेरी भी माता है
  rationale: मूल की संक्षिप्त अभिव्यक्ति 'उसकी और मेरी माता' का स्वाभाविक हिन्दी रूप; आत्मीय, पारिवारिक संबंध को व्यक्त करता है और जैविक संबंध का अनावश्यक दावा नहीं करता।
theological_decisions:
- issue: ἐκλεκτὸν ἐν κυρίῳ का आशय
  choice: प्रभु में चुने हुए
  alternative: प्रभु में विशिष्ट अथवा उत्कृष्ट
  rationale: यह रूप ईश्वरीय चुनाव की संभावना को खुला रखता है, पर उसे किसी संकीर्ण धर्मवैज्ञानिक प्रणाली में नहीं बाँधता; पादटिप्पणी गुणात्मक अर्थ की संभावना भी सुरक्षित रखती है।
- issue: “उसकी माता…मेरी भी माता” का आशय
  choice: मूल के पारिवारिक संबोधन को बनाए रखना
  alternative: उसकी माता, जिसने मेरी भी माता के समान देखभाल की
  rationale: संदर्भ आत्मीय और संबंधपरक अर्थ का समर्थन करता है, पर मूल पाठ सेवा या देखभाल का स्पष्ट उल्लेख नहीं करता; इसलिए व्याख्यात्मक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कलीसियाई पत्र-शैली के अनुकूल रूप। 'माता' ने आत्मीयता और सम्मान रखा है; वाक्य को अत्यधिक शाब्दिक और अस्वाभाविक बनने से बचाया गया है।
