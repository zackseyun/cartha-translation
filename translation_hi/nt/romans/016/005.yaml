reference: Romans 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὴν κατ’ οἶκον αὐτῶν ἐκκλησίαν. ἀσπάσασθε Ἐπαίνετον τὸν ἀγαπητόν μου, ὅς ἐστιν ἀπαρχὴ τῆς ⸀Ἀσίας εἰς Χριστόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/005.yaml
  text: Also greet the church in their house[a]. Greet Epaenetus, my beloved[c][b], who is the firstfruits of Asia for Messiah.
translation:
  language: hi
  text: उनके घर की कलीसिया[a] को भी नमस्कार कहना। मेरे प्रिय एपैनेतुस को नमस्कार कहना, जो मसीह के लिए आसिया का पहला फल[b] है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके घर में इकट्ठी होने वाली कलीसिया।”
    reason: lexical_alternative
  - marker: b
    text: “पहला फल” से आशय संभवतः मसीह पर विश्वास करने वाले आरम्भिक व्यक्ति से है; या, “जो आसिया में मसीह पर विश्वास करने वाला पहला व्यक्ति था।”
    reason: alternative_reading
  - marker: c
    text: यहाँ “आसिया” आधुनिक एशिया महाद्वीप नहीं, बल्कि उसी नाम का एक रोमी प्रांत है।
    reason: cultural_note
lexical_decisions:
- source_word: κατ’ οἶκον αὐτῶν ἐκκλησίαν
  choice: उनके घर की कलीसिया
  rationale: यह यूनानी वाक्यांश सभा और उस घर के बीच संबंध बताता है; चुना हुआ रूप संक्षिप्त और मूल के निकट है, जबकि पादटिप्पणी स्पष्ट करती है कि कलीसिया वहाँ एकत्र होती थी।
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: पत्र में लोगों तक अभिवादन पहुँचाने के निर्देश के लिए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: Ἐπαίνετον
  choice: इपैनेतुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: ἀγαπητόν μου
  choice: मेरे प्रिय
  rationale: यह पौलुस के व्यक्तिगत स्नेह को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἀπαρχὴ
  choice: पहला फल
  rationale: यह पौलुस के ‘प्रथम फल’ के रूपक को बनाए रखता है; केवल ‘पहला विश्वासी’ कहने से मूल रूपक मिट जाता।
- source_word: τῆς Ἀσίας
  choice: आसिया का
  rationale: संबंधकारक का सीधा रूप रखा गया है। ‘आसिया’ यहाँ रोमी प्रांत है, जिसकी व्याख्या पादटिप्पणी में दी गई है।
- source_word: εἰς Χριστόν
  choice: मसीह के लिए
  rationale: ἀπαρχή के साथ εἰς लक्ष्य अथवा संबंध प्रकट कर सकता है। यह रूप उस संबंध को खुला रखता है और ‘मसीह में’ या ‘मसीह की ओर’ जैसी एकमात्र व्याख्या थोपता नहीं।
theological_decisions:
- issue: Χριστόν का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός उपाधि का अर्थ लिए हुए है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित है।
- issue: ἀπαρχὴ τῆς Ἀσίας εἰς Χριστόν का आशय
  choice: मसीह के लिए आसिया का पहला फल
  alternative: आसिया में मसीह पर विश्वास करने वाला पहला व्यक्ति
  rationale: मुख्य पाठ ‘पहले फल’ का रूपक और εἰς की संबंधगत अस्पष्टता बनाए रखता है; संभावित आशय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कलीसिया’, ‘मसीह’ और ‘पहला फल’ जैसे परिचित बाइबलीय पद मूल की धार्मिक छवि को सुरक्षित रखते हैं; कठिन ऐतिहासिक और अर्थगत बातें पादटिप्पणियों में स्पष्ट की गई हैं।
