  text: to the only wise God, through Jesus the Messiah, to whom be the glory forever. Amen.
translation:
  language: hi
  text: एकमात्र बुद्धिमान परमेश्वर को, यीशु मसीह के द्वारा—जिसकी महिमा युगानुयुग हो। आमीन।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद समापन के स्तुतिवचन (रोमियों 16:25–27) को पूरा करता है। जैसा रोमियों 16:25 की टिप्पणी में बताया गया है, आरम्भिक पांडुलिपियों में इस स्तुतिवचन के स्थान और इसके सम्मिलित होने के विषय में उल्लेखनीय भिन्नताएँ हैं; फिर भी बीजान्टिन बहुसंख्यक पाठ-परंपरा में इसे यहाँ सुरक्षित रखा गया है।
    reason: textual_critical
lexical_decisions:
- source_word: μόνῳ
  choice: एकमात्र
  rationale: यह σοφῷ θεῷ के साथ मिलकर परमेश्वर की अद्वितीय बुद्धिमत्ता पर बल देता है; ‘एकमात्र’ आधुनिक हिन्दी में इस विशेष बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: σοφῷ
  choice: बुद्धिमान
  rationale: यह σοφός का सीधा और सामान्य हिन्दी समतुल्य है तथा स्तुतिवचन के गरिमापूर्ण भाव को बनाए रखता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: διά के साधन/माध्यम के भाव को ‘के द्वारा’ व्यक्त करता है; Χριστός को उसके पदनाम के रूप में ‘मसीह’ रखा गया है।
- source_word: ᾧ
  choice: जिसकी
  rationale: सम्बन्धवाचक सर्वनाम की यूनानी संरचना को बनाए रखता है और उसका पूर्वपद परमेश्वर है या यीशु मसीह—इस हल्की व्याकरणिक अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: शाब्दिक ‘युगों तक’ का स्वाभाविक, गरिमापूर्ण हिन्दी मुहावरा है, जिसका अर्थ सदा-सर्वदा है।
- source_word: Ἀμήν
  choice: आमीन
  rationale: उपासना और बाइबलीय प्रयोग में प्रचलित पारंपरिक लिप्यंतरण।
theological_decisions:
- issue: ᾧ का सम्भावित पूर्वपद
  choice: ‘जिसकी’ द्वारा सम्बन्धवाचक रचना और उसकी सम्भावित अस्पष्टता बनाए रखी गई
  alternative: ‘उसी परमेश्वर की महिमा’ कहकर पूर्वपद को स्पष्ट रूप से परमेश्वर ठहराना
  rationale: यूनानी में दत्तिव सम्बन्धवाचक ᾧ व्याकरणतः परमेश्वर की ओर लौट सकता है, जबकि यीशु मसीह की निकटता कुछ अस्पष्टता उत्पन्न करती है; अनुवाद ने इसे चुपचाप निर्णीत नहीं किया।
- issue: Χριστός का स्वरूप
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यह यूनानी पदनाम के मसीही अर्थ को आधुनिक हिन्दी में स्पष्ट और गैर-सांप्रदायिक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, संक्षिप्त और उपासना-संगत गरिमापूर्ण शैली अपनाई गई है। ‘युगानुयुग’ बाइबलीय रंग बनाए रखते हुए सामान्य पाठकों के लिए बोधगम्य है। मुख्य पाठ में [a] चिह्न दिया गया है।
