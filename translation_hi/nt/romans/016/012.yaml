id: ROM.16.12
reference: Romans 16:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀσπάσασθε Τρύφαιναν καὶ Τρυφῶσαν τὰς κοπιώσας ἐν κυρίῳ. ἀσπάσασθε Περσίδα τὴν ἀγαπητήν, ἥτις πολλὰ ἐκοπίασεν ἐν κυρίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/016/012.yaml
  text: Greet Tryphaena and Tryphosa[a], who have labored in the Lord. Greet Persis, the beloved[b], who has labored much in the Lord.
translation:
  language: hi
  text: त्रूफैना और त्रूफोसा को नमस्कार कहो, जिन्होंने प्रभु में कठिन परिश्रम किया है। प्रिय पिरसिस को नमस्कार कहो, जिसने प्रभु में बहुत कठिन परिश्रम किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहो
  rationale: पत्र के अभिवादन-संदर्भ में यह बहुवचन आज्ञार्थक क्रिया का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: Τρύφαιναν καὶ Τρυφῶσαν
  choice: त्रूफैना और त्रूफोसा
  rationale: व्यक्तिनामों का अर्थानुवाद न करके यूनानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: τὰς κοπιώσας / ἐκοπίασεν
  choice: जिन्होंने…कठिन परिश्रम किया है / जिसने…कठिन परिश्रम किया है
  rationale: कोपियाओ में कठोर और थका देने वाले श्रम का भाव है। दोनों प्रयोगों में समान शब्दावली रखकर यूनानी की शाब्दिक पुनरावृत्ति सुरक्षित की गई है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुस की संबंध और कार्य-क्षेत्र दोनों को व्यक्त करने वाली समृद्ध पदावली को सुरक्षित रखता है; केवल ‘प्रभु के लिए’ कहना अर्थ को संकुचित कर देता।
- source_word: Περσίδα
  choice: पिरसिस
  rationale: व्यक्तिनाम को यूनानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: τὴν ἀγαπητήν
  choice: प्रिय
  rationale: यूनानी में स्पष्ट ‘मेरी’ नहीं है। सहज हिन्दी में ‘प्रिय पिरसिस’ मूल के विशेषण को व्यक्त करता है और अनावश्यक स्वामित्वसूचक शब्द नहीं जोड़ता।
- source_word: πολλὰ
  choice: बहुत
  rationale: क्रिया-विशेषण के रूप में यह पिरसिस के परिश्रम की मात्रा पर दिए गए बल को सरल हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पौलुस की सेवकाई-संबंधी पदावली ἐν κυρίῳ का अर्थ
  choice: प्रभु में
  alternative: प्रभु के लिए / प्रभु की सेवा में
  rationale: ‘प्रभु में’ श्रम के उद्देश्य मात्र के बजाय प्रभु के साथ संबंध और उसमें स्थित कार्य-क्षेत्र को खुला रखता है।
- issue: ἀγαπητήν के साथ स्वामित्वसूचक भाव
  choice: प्रिय पिरसिस
  alternative: मेरी प्रिय पिरसिस
  rationale: मूल यूनानी में μου अर्थात ‘मेरी’ नहीं है, इसलिए उसे जोड़ने से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कठिन परिश्रम’ दोनों संबंधित यूनानी रूपों की पुनरावृत्ति और श्रम की तीव्रता को स्पष्ट करता है। स्त्रीलिंग क्रियारूपों से तीनों सेविकाओं का संदर्भ स्वाभाविक रूप से प्रकट होता है।
