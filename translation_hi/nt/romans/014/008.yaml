  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐάν τε γὰρ ζῶμεν, τῷ κυρίῳ ζῶμεν, ἐάν τε ἀποθνῄσκωμεν, τῷ κυρίῳ ἀποθνῄσκομεν. ἐάν τε οὖν ζῶμεν ἐάν τε ἀποθνῄσκωμεν, τοῦ κυρίου ἐσμέν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/008.yaml
  text: For if we live[a], we live to the Lord, and if we die, we die to the Lord. So then, whether we live or whether we die[b], we are the Lord’s.
translation:
  language: hi
  text: क्योंकि यदि हम जीते हैं, तो प्रभु के लिए[a] जीते हैं; और यदि मरते हैं, तो प्रभु के लिए मरते हैं। अतः चाहे हम जीएँ या मरें, हम प्रभु के हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रभु के लिए’ का अर्थ ‘प्रभु के प्रति’ या ‘प्रभु से संबंध रखते हुए’ भी हो सकता है। यूनानी दत्तिव संबंध, उन्मुखता या हित का भाव व्यक्त कर सकता है। यही बात आगे ‘प्रभु के लिए मरते हैं’ पर भी लागू होती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘हम प्रभु से संबंधित हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τε γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण देता है, इसलिए ‘क्योंकि’ रखा गया है। ἐάν τε से आरम्भ होने वाली शर्त को स्वाभाविक हिन्दी में ‘यदि’ से व्यक्त किया गया है।
- source_word: ζῶμεν / ζῶμεν
  choice: हम जीवित रहते हैं / जीवित रहते हैं
  rationale: ζάω के दोनों प्रयोगों को एक ही शब्दावली से रखा गया है। ‘जीवित रहते हैं’ यहाँ सामान्य रूप से जीवन की दशा और आचरण दोनों को समेट सकता है।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: यूनानी संबंधकारक दत्तिव यहाँ प्रभु की ओर उन्मुखता, उनसे संबंध या उनके हित के लिए होने का भाव दे सकता है। ‘प्रभु के लिए’ स्वाभाविक आधुनिक हिन्दी है; व्यापक यूनानी अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κύριος
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का प्रतिष्ठित और धर्मवैज्ञानिक भार बनाए रखने वाला हिन्दी रूप है; निकट संदर्भ से संकेत मिलने पर भी अनुवाद में संदर्भित व्यक्ति को अलग से नहीं जोड़ा गया।
- source_word: ἀποθνῄσκωμεν / ἀποθνῄσκομεν
  choice: हम मरते हैं / मरते हैं
  rationale: दोनों रूप सामान्य रूप से मृत्यु की घटना को व्यक्त करते हैं; ‘मरते हैं’ संक्षिप्त, स्वाभाविक और मूल की पुनरावृत्ति के अनुरूप है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν पहले के संतुलित कथनों से निकलने वाले निष्कर्ष को सूचित करता है; ‘इसलिए’ आधुनिक हिन्दी में इस तार्किक संबंध को स्पष्ट रखता है।
- source_word: τοῦ κυρίου ἐσμέν
  choice: हम प्रभु के हैं
  rationale: संबंधकारक रचना अधिकार और संबंध दोनों व्यक्त करती है। ‘हम प्रभु के हैं’ संक्षिप्त है और मूल के प्रबल अपनत्व को बनाए रखता है।
theological_decisions:
- issue: κύριος का संदर्भ और बल
  choice: ‘प्रभु’ शीर्षक को बिना अतिरिक्त पहचान जोड़े रखा गया है।
  alternative: ‘स्वामी’ कहना, या अनुवाद में स्पष्ट रूप से ‘प्रभु यीशु’ जोड़ना।
  rationale: रोमियों 14:9 का निकट संदर्भ मसीह की ओर संकेत करता है, पर इस पद में यूनानी पाठ केवल κύριος कहता है। ‘प्रभु’ संदर्भगत मसीह-संबंधी संकेत और शीर्षक की व्यापक धर्मवैज्ञानिक प्रतिध्वनि दोनों सुरक्षित रखता है।
- issue: प्रभु के लिए जीने और मरने का संबंधपरक अर्थ
  choice: मुख्य पाठ में ‘प्रभु के लिए’ रखा गया है, पर इसे केवल सेवा या उद्देश्य तक सीमित नहीं माना गया।
  alternative: ‘प्रभु के प्रति’ या ‘प्रभु के होकर’ कहना।
  rationale: दत्तिव संबंध, उन्मुखता या हित का भाव दे सकता है, और अंतिम वाक्य अपनत्व पर बल देता है। स्वाभाविक हिन्दी के लिए ‘के लिए’ चुना गया है, जबकि पादटिप्पणी मूल की व्यापकता बचाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। जीवन और मृत्यु वाले दोनों वाक्यांशों की समानांतर रचना तथा ‘प्रभु’ की पुनरावृत्ति मूल के वक्तृत्वात्मक बल को बनाए रखती है।
