  text: μὴ βλασφημείσθω οὖν ὑμῶν τὸ ἀγαθόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/016.yaml
  text: Therefore[a], do not let your good be spoken of as evil.
translation:
  language: hi
  text: इसलिए तुम्हारी भलाई की निन्दा न होने पाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी भलाई को बुरा न कहा जाए,” अथवा “उसे बदनाम न किया जाए।” यूनानी क्रिया अपमानजनक या बदनाम करने वाली बातें कहने का भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ … βλασφημείσθω
  choice: निन्दा न होने पाए
  rationale: μή के साथ वर्तमान कर्मवाच्य आज्ञार्थक क्रिया निषेध व्यक्त करती है। यह हिन्दी प्रयोग उस बात को रोकने का आग्रह स्वाभाविक रूप से व्यक्त करता है कि उनकी भलाई अपमानजनक या बदनाम करने वाली बातों का विषय बने।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: ὑμῶν
  choice: तुम्हारी
  rationale: सम्बन्धकारक सर्वनाम τὸ ἀγαθόν के साथ अधिकार अथवा सम्बन्ध बताता है।
- source_word: τὸ ἀγαθόν
  choice: तुम्हारी भलाई
  rationale: संज्ञा के रूप में प्रयुक्त नपुंसकलिंग विशेषण का अर्थ व्यापक रूप से ‘भली वस्तु/भलाई’ है। ‘भलाई’ संक्षिप्त और स्वाभाविक है तथा सन्दर्भ को केवल स्वतंत्रता, अधिकार या लाभ तक सीमित नहीं करती।
- source_word: βλασφημείσθω
  choice: निन्दा
  rationale: βλασφημέω यहाँ परमेश्वर के विरुद्ध विशिष्ट धार्मिक अर्थ में नहीं, बल्कि किसी चीज़ के विषय में अपमानजनक, बदनाम करने वाली या बुरी बात कहने के अर्थ में है; ‘निन्दा’ इस अर्थ-क्षेत्र को गरिमापूर्ण और सहज हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: ‘तुम्हारी भलाई’ (τὸ ἀγαθόν) का सन्दर्भ
  choice: सन्दर्भ को व्यापक रखते हुए ‘तुम्हारी भलाई’ कहा गया है।
  alternative: तुम्हारी स्वतंत्रता; तुम्हारा अधिकार; तुम्हारा लाभ; तुम्हारी अच्छी गवाही
  rationale: यूनानी वाक्यांश संक्षिप्त और संदर्भतः खुला है। इसे किसी एक विशिष्ट वरदान, अधिकार या स्वतंत्रता के रूप में अनूदित करना पाठ में निहित अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन में बहुवचन ‘तुम्हारी’ रखा गया है। वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
