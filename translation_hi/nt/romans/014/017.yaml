  text: οὐ γάρ ἐστιν ἡ βασιλεία τοῦ θεοῦ βρῶσις καὶ πόσις, ἀλλὰ δικαιοσύνη καὶ εἰρήνη καὶ χαρὰ ἐν πνεύματι ἁγίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/017.yaml
  text: For the kingdom of God is not eating and drinking[a], but righteousness and peace and joy in the Holy Spirit.
translation:
  language: hi
  text: क्योंकि परमेश्वर का राज्य खाना-पीना नहीं, बल्कि पवित्र आत्मा में धार्मिकता[a], शांति और आनंद है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।” यूनानी शब्द δικαιοσύνη धार्मिकता अथवा न्याय का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह βασιλεία का मानक, व्यापक और पाठकों के लिए परिचित प्रतिरूप है; यहाँ शासन और राज्य—दोनों की अवधारणा समाहित रह सकती है।
- source_word: βρῶσις καὶ πόσις
  choice: खाना-पीना
  rationale: दोनों संज्ञाएँ गतिविधियों को सूचित कर सकती हैं; संयुक्त हिन्दी अभिव्यक्ति यूनानी समानांतरता और प्रसंग में भोजन-पान की प्रथाओं को स्वाभाविक रूप से व्यक्त करती है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के लेखन में यह मानक हिन्दी प्रतिरूप है और नैतिक तथा परमेश्वर-सम्मत सहीपन की व्यापकता बनाए रखता है; ‘न्याय’ को सार्थक विकल्प के रूप में पादटिप्पणी में रखा गया है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह शब्द व्यक्तिगत शांति के साथ सामुदायिक मेल-मिलाप का भाव भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: χαρά
  choice: आनंद
  rationale: यह χαρά का स्वाभाविक, गरिमापूर्ण और पौलुसी प्रसंग के अनुकूल हिन्दी प्रतिरूप है।
- source_word: ἐν πνεύματι ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: ‘में’ यूनानी ἐν की क्षेत्र अथवा माध्यम संबंधी संभावित सूक्ष्मता को बिना तय किए सुरक्षित रखता है; यह पद पौलुस के प्रयोग में पवित्र आत्मा को सूचित करता है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: मुख्य पाठ में पौलुसी प्रयोग का मानक प्रतिरूप रखा गया है, जबकि शब्द के न्याय-संबंधी अर्थक्षेत्र को पादटिप्पणी में सुरक्षित किया गया है।
- issue: ἐν πνεύματι ἁγίῳ में ἐν का संबंध
  choice: पवित्र आत्मा में
  alternative: पवित्र आत्मा के द्वारा
  rationale: शाब्दिक ‘में’ आत्मा को क्षेत्र अथवा माध्यम मानने की संभावित द्व्यर्थता बनाए रखता है और अनावश्यक रूप से केवल साधनार्थक अर्थ तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। ‘खाना-पीना’ बोलचाल में स्वाभाविक है, पर समूचे वाक्य का धार्मिक-पाठीय स्तर बनाए रखता है। पादटिप्पणी का चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
