  text: ἄρα οὖν τὰ τῆς εἰρήνης διώκωμεν καὶ τὰ τῆς οἰκοδομῆς τῆς εἰς ἀλλήλους.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/019.yaml
  text: So then[a], let us pursue what makes for peace and what builds up one another.
translation:
  language: hi
  text: इसलिए हम उन बातों के लिए प्रयत्न करते रहें जो शांति को बढ़ाती हैं और एक-दूसरे को दृढ़ करती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “इसलिए हम शांति की बातों और एक-दूसरे को दृढ़ करने की बातों के पीछे लगे रहें।”'
    reason: शाब्दिक संरचना का वैकल्पिक अनुवाद
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले तर्क से निकले निष्कर्ष को दिखाता है; आधुनिक हिन्दी में ‘इसलिए’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: τὰ τῆς εἰρήνης
  choice: वे बातें जो शान्ति बढ़ाती हैं
  rationale: सम्बन्धकारक पदबंध शान्ति से जुड़ी और शान्ति को आगे बढ़ाने वाली बातों की ओर संकेत करता है; यह रूप यूनानी मुहावरे का अर्थ सहज हिन्दी में देता है।
- source_word: διώκωμεν
  choice: हम ... के पीछे लगे रहें
  rationale: वर्तमान काल के आग्रहसूचक संभावनार्थक रूप में सामूहिक और निरन्तर प्रयत्न का भाव है; ‘पीछे लगे रहें’ क्रिया की सक्रिय और सतत शक्ति को बनाए रखता है।
- source_word: τὰ τῆς οἰκοδομῆς
  choice: वे बातें जिनसे ... उन्नति करते हैं
  rationale: οἰκοδομή का मूल अर्थ निर्माण है, पर यहाँ समुदाय को आत्मिक और नैतिक रूप से दृढ़ करने का रूपक है; ‘उन्नति’ सामान्य हिन्दी में इस आशय को स्पष्ट करता है।
- source_word: τῆς εἰς ἀλλήλους
  choice: हम एक-दूसरे की
  rationale: यह पदबंध उन्नति के पारस्परिक लक्ष्य को व्यक्त करता है; ‘एक-दूसरे की’ समुदाय के भीतर परस्परता को स्पष्ट रखता है।
theological_decisions:
- issue: सामुदायिक उन्नति का दायरा
  choice: विश्वासी मिलकर शान्ति बढ़ाने और एक-दूसरे की उन्नति करने वाली बातों के पीछे लगे रहें।
  alternative: इसे केवल प्रत्येक व्यक्ति की निजी नैतिक उन्नति के रूप में पढ़ना।
  rationale: प्रथम पुरुष बहुवचन आग्रह और पारस्परिक ἀλλήλους सामुदायिक जीवन पर बल देते हैं। अनुवाद इस परस्परता को बनाए रखता है, पर किसी विशिष्ट सम्प्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘उन्नति’ निर्माण के यूनानी रूपक का अर्थ देता है, जबकि पादटिप्पणी मूल की दोहराई हुई संरचना सुरक्षित रखती है।
