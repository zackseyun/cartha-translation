id: ROM.14.10
reference: Romans 14:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σὺ δὲ τί κρίνεις τὸν ἀδελφόν σου; ἢ καὶ σὺ τί ἐξουθενεῖς τὸν ἀδελφόν σου; πάντες γὰρ παραστησόμεθα τῷ βήματι τοῦ ⸀θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/010.yaml
  text: But you[a], why do you judge your brother? Or you also, why do you despise your brother? For we will all stand before the judgment seat of God[b],
translation:
  language: hi
  text: पर तुम अपने भाई[a] का न्याय क्यों करते हो? या तुम भी अपने भाई को तुच्छ क्यों समझते हो? क्योंकि हम सब परमेश्वर[b] के न्यायासन के सामने खड़े होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाई या बहन”; यूनानी में “अपने भाई।”
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में “मसीह के न्यायासन” है।
    reason: textual_variant
lexical_decisions:
- source_word: Σὺ δὲ
  choice: पर तुम
  rationale: ‘पर’ δέ के विरोधसूचक बल को और ‘तुम’ आगे रखे गए emphatic σύ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τί κρίνεις
  choice: न्याय क्यों करते हो
  rationale: इस आलंकारिक प्रश्न में τί का अर्थ ‘क्यों’ है। ‘न्याय करना’ κρίνω को सुरक्षित रखता है और इसे अनावश्यक रूप से ‘दोषी ठहराना’ नहीं बनाता।
- source_word: τὸν ἀδελφόν σου
  choice: अपने भाई
  rationale: ἀδελφός पुल्लिंग एकवचन है; इसलिए मुख्य पाठ में ‘भाई’ रखा गया है। प्रसंग में इसका व्यापक सामुदायिक आशय पादटिप्पणी में बताया गया है।
- source_word: ἢ καὶ σὺ
  choice: या तुम भी
  rationale: यह καί के योगात्मक भाव और दूसरे ‘तुम’ पर दिए गए बल—दोनों को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τί ἐξουθενεῖς
  choice: तुच्छ क्यों समझते हो
  rationale: ἐξουθενέω का अर्थ किसी को नगण्य या घृणा के योग्य मानना है। ‘तुच्छ समझना’ आधुनिक हिन्दी में इस अवमाननापूर्ण भाव को स्पष्ट रखता है।
- source_word: πάντες γὰρ
  choice: क्योंकि हम सब
  rationale: ‘क्योंकि’ γάρ के कारणसूचक/व्याख्यात्मक संबंध को और ‘हम सब’ πάντες के समावेशी अर्थ को व्यक्त करता है।
- source_word: παραστησόμεθα
  choice: सामने खड़े होंगे
  rationale: यह न्यायिक प्रसंग में παρίστημι के भाव—न्याय के लिए किसी के सम्मुख उपस्थित होकर खड़ा होना—को बनाए रखता है।
- source_word: τῷ βήματι
  choice: न्यायासन
  rationale: βῆμα यहाँ न्यायाधीश के आसन अथवा न्यायाधिकरण का बोध कराता है। ‘न्यायासन’ संक्षिप्त, प्रतिष्ठित और कानूनी बिंब के अनुरूप है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: यह SBLGNT के τοῦ θεοῦ का सीधा अनुवाद है।
theological_decisions:
- issue: वह कौन है जिसके न्यायासन के सामने सब खड़े होंगे
  choice: परमेश्वर
  alternative: मसीह
  rationale: दिए गए SBLGNT पाठ में τοῦ θεοῦ (‘परमेश्वर के’) है। कुछ पांडुलिपियों के τοῦ Χριστοῦ (‘मसीह के’) पाठ को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘न्याय करना,’ ‘तुच्छ समझना’ और ‘न्यायासन’ मूल के न्यायिक तथा नैतिक तनाव को बिना सांप्रदायिक व्याख्या जोड़े व्यक्त करते हैं। पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद रखे गए हैं; उपलब्ध अंग्रेज़ी परामर्श-पाठ में चिह्नों और पादटिप्पणियों का स्थान परस्पर उलटा दिखाई देता है।
