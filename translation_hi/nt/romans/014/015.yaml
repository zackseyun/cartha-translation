source:
  edition: SBLGNT
  text: εἰ ⸀γὰρ διὰ βρῶμα ὁ ἀδελφός σου λυπεῖται, οὐκέτι κατὰ ἀγάπην περιπατεῖς. μὴ τῷ βρώματί σου ἐκεῖνον ἀπόλλυε ὑπὲρ οὗ Χριστὸς ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/015.yaml
  text: For if your brother is grieved because of food[a], you are no longer walking according to love[c][b]. Do not destroy that one with your food—the one for whom Messiah died.
translation:
  language: hi
  text: क्योंकि यदि तुम्हारा भाई भोजन के कारण दुःखी होता है, तो तुम अब प्रेम के अनुसार नहीं चलते। अपने भोजन के कारण उस व्यक्ति को नष्ट मत करो[a], जिसके लिए मसीह मरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नष्ट मत करो” का अनुवाद “बरबाद मत करो” भी किया जा सकता है। यूनानी क्रिया बहुत प्रबल है और गंभीर आत्मिक हानि का संकेत दे सकती है, पर यह पद उसके सटीक धर्मवैज्ञानिक परिणाम को स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: βρῶμα / βρώματι
  choice: भोजन / अपने भोजन से
  rationale: यह शब्द सामान्य रूप से भोजन को दर्शाता है, केवल मांस को नहीं। करणवाचक भाव को स्वाभाविक हिन्दी में “अपने भोजन से” रखा गया है।
- source_word: ἀδελφός
  choice: भाई
  rationale: यूनानी में पुल्लिंग एकवचन है; इसलिए मुख्य पाठ में “भाई” रखा गया है, यद्यपि प्रसंग में यह किसी सहविश्वासी का प्रतिनिधि रूप हो सकता है।
- source_word: λυπεῖται
  choice: दुःखी होता है
  rationale: यह किसी को शोक या मानसिक कष्ट पहुँचने का भाव व्यक्त करता है और उसके प्रभाव को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: κατὰ ἀγάπην περιπατεῖς
  choice: प्रेम के अनुसार नहीं चलते
  rationale: κατά का मानक अथवा अनुरूपता का भाव और पौलुस का नैतिक “चलने” का रूपक दोनों सुरक्षित रखे गए हैं।
- source_word: ἀπόλλυε
  choice: नाश न करो
  rationale: यह क्रिया गंभीर हानि या विनाश का प्रबल भाव रखती है। “नाश” उसकी तीव्रता को बनाए रखता है, पर उसके सटीक धर्मवैज्ञानिक परिणाम को निर्धारित नहीं करता।
- source_word: ὑπὲρ οὗ
  choice: जिसके लिए
  rationale: ὑπέρ के प्रतिनिधिक और बलिदानी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: Χριστός
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; हिन्दी में स्थापित अर्थसूचक उपाधि “मसीह” स्वाभाविक और स्पष्ट है।
- source_word: ἀπέθανεν
  choice: मरा
  rationale: साधारण भूतकालीन घटना को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἀπόλλυε की शक्ति और सहविश्वासी के संभावित विनाश का स्वरूप
  choice: “उसका नाश न करो” के रूप में गंभीर चेतावनी
  alternative: “उसे बरबाद न करो” अथवा “उसे नष्ट न होने दो”
  rationale: पद की भाषा प्रबल है, पर यह स्वयं स्पष्ट नहीं करती कि अभिप्राय गंभीर आत्मिक हानि है या अंतिम विनाश। अनुवाद इस तनाव को खुला रखता है।
- issue: ἀδελφός का संदर्भ
  choice: मुख्य पाठ में “भाई”
  alternative: “भाई या बहन” अथवा “सहविश्वासी”
  rationale: मूल का पुल्लिंग एकवचन सुरक्षित रखा गया है; व्यापक प्रतिनिधिक प्रयोग सम्भव है, पर उसे मुख्य पाठ में आरोपित नहीं किया गया।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द उपाधि के रूप में कार्य करता है; “मसीह” हिन्दी में उसके अभिषिक्त जन के अर्थ और प्रचलित बाइबलीय प्रयोग दोनों को संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय और सामान्य पाठक के लिए सुबोध शैली। “प्रेम के अनुसार चलना” मूल के नैतिक रूपक को सुरक्षित रखता है। मुख्य पाठ में केवल वही पादटिप्पणी चिह्न रखा गया है जिसकी टिप्पणी दी गई है।
