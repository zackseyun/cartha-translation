base_translation:
  language: en
  yaml_path: translation/nt/romans/014/014.yaml
  text: I know and am persuaded in the Lord Jesus that nothing is unclean in itself; except that to the one who considers anything to be unclean[a], to that person it is unclean.
translation:
  language: hi
  text: मैं जानता हूँ और प्रभु यीशु में मुझे पूरा विश्वास है कि कोई भी वस्तु अपने आप में अशुद्ध नहीं है; परन्तु यदि कोई किसी वस्तु को अशुद्ध[a] मानता है, तो उसके लिए वह अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘साधारण’ या ‘सामान्य।’ यहाँ प्रयुक्त यूनानी शब्द प्रायः ऐसी वस्तु को दर्शाता है जिसे धार्मिक रीति से अपवित्र या अशुद्ध माना जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: सामान्य ज्ञानसूचक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πέπεισμαι
  choice: मुझे पूरा विश्वास है
  rationale: पूर्णकालिक रूप से व्यक्त स्थिर और दृढ़ निश्चय को सहज आधुनिक हिन्दी में प्रकट करता है।
- source_word: ἐν κυρίῳ Ἰησοῦ
  choice: प्रभु यीशु में
  rationale: सम्बन्ध को अधिक स्पष्ट करके सीमित करने के बजाय यूनानी पूर्वसर्ग की व्यापकता और धर्मवैज्ञानिक तनाव बनाए रखता है।
- source_word: κοινόν
  choice: अशुद्ध
  rationale: इस प्रसंग में यह शब्द साधारण या साझा होने के बजाय धार्मिक रीति से अपवित्र मानी जाने वाली वस्तु को दर्शाता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: δι’ ἑαυτοῦ
  choice: अपने आप में
  rationale: किसी वस्तु की अंतर्निहित स्थिति का स्वाभाविक हिन्दी बोध कराता है।
- source_word: τῷ λογιζομένῳ
  choice: जो ... मानता है
  rationale: किसी वस्तु के विषय में मानसिक आकलन या धारणा रखने का स्पष्ट और सहज रूप।
- source_word: τι
  choice: किसी वस्तु को
  rationale: सामान्य सिद्धान्त में अनिश्चित वस्तु का संकेत देता है और हिन्दी वाक्य में स्वाभाविक है।
- source_word: ἐκείνῳ κοινόν
  choice: उसके लिए वह अशुद्ध है
  rationale: व्यक्तिगत प्रयोज्यता व्यक्त करने वाले सम्प्रदान कारक का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: भोजन और शुद्धता के प्रसंग में κοινός का अर्थ
  choice: अशुद्ध
  alternative: साधारण; अपवित्र
  rationale: पौलुस किसी वस्तु को स्वभावतः अशुद्ध नहीं ठहराता, पर व्यक्ति की धारणा और विवेक के स्तर पर उसे अशुद्ध मानने की वास्तविकता बनाए रखता है। ‘अशुद्ध’ आधुनिक पाठक को प्रसंग स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: ἐν κυρίῳ Ἰησοῦ में निहित सम्बन्ध
  choice: प्रभु यीशु में
  alternative: प्रभु यीशु के द्वारा
  rationale: यूनानी पाठ यह स्पष्ट रूप से सीमित नहीं करता कि निश्चय का साधन, स्रोत या मसीह के साथ सम्बन्ध प्रमुख है; ‘में’ इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘कोई भी वस्तु’ और ‘किसी वस्तु’ प्रसंग की व्यापकता रखते हैं। ‘मुझे पूरा विश्वास है’ स्थिर निश्चय व्यक्त करता है, और ‘प्रभु यीशु में’ मूल की अर्थगत व्यापकता सुरक्षित रखता है।
