  text: καλὸν τὸ μὴ φαγεῖν κρέα μηδὲ πιεῖν οἶνον μηδὲ ἐν ᾧ ὁ ἀδελφός σου προσκόπτει ⸂ἢ σκανδαλίζεται ἢ ἀσθενεῖ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/021.yaml
  text: It is good not to eat meat or drink wine or do anything by which your brother stumbles or is offended or is weakened[a].
translation:
  language: hi
  text: मांस न खाना, दाखरस न पीना, और ऐसा कुछ न करना अच्छा है, जिससे तुम्हारा भाई ठोकर खाए, ठोकर खाकर गिर पड़े या निर्बल हो जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग में “भाई” का व्यापक अर्थ “भाई या बहन,” अर्थात् संगी विश्वासी, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: अच्छा है
  rationale: यहाँ καλός किसी आचरण को नैतिक रूप से उचित और सराहनीय बताता है; “अच्छा है” स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: τὸ μὴ φαγεῖν κρέα
  choice: मांस न खाना
  rationale: भाववाचक infinitive की संरचना और भोजन के रूप में κρέα का अर्थ सीधे और स्वाभाविक ढंग से सुरक्षित रहता है।
- source_word: μηδὲ πιεῖν οἶνον
  choice: दाखमधु न पीना
  rationale: μηδέ पहले निषेध के साथ एक और त्याग जोड़ता है; “दाखमधु” बाइबलीय संदर्भ में οἶνος का स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: μηδὲ ἐν ᾧ
  choice: और ऐसा कुछ न करना ... जिससे
  rationale: यूनानी में अंतिम पद लुप्तक्रियात्मक है। हिन्दी में अर्थ पूरा करने के लिए “ऐसा कुछ न करना” जोड़ा गया है, जिससे किसी भी हानिकारक आचरण का व्यापक आशय स्पष्ट होता है।
- source_word: ὁ ἀδελφός σου
  choice: तुम्हारा भाई
  rationale: यूनानी पद पुल्लिंग एकवचन है। मुख्य पाठ उसका रूप बनाए रखता है; प्रसंगगत समावेशी अर्थ पादटिप्पणी में दिया गया है।
- source_word: προσκόπτει
  choice: ठोकर खाए
  rationale: मूल क्रिया टकराने या ठोकर खाने का चित्र देती है और यहाँ नैतिक या आत्मिक बाधा का रूपक है।
- source_word: σκανδαλίζεται
  choice: पाप में पड़ जाए
  rationale: यह προσκόπτει से अर्थगत रूप से जुड़ा होते हुए भी उससे आगे प्रलोभन या फंदे में पड़ने का भाव रखता है। “पाप में पड़ जाए” दोनों क्रियाओं को एक ही हिन्दी पद में मिला देने से बचाता है और प्रसंगगत नैतिक आशय स्पष्ट करता है।
- source_word: ἀσθενεῖ
  choice: निर्बल हो जाए
  rationale: यहाँ शारीरिक बीमारी नहीं, बल्कि विवेक या विश्वास में दुर्बल होने का भाव है; अनुवाद उस भाव को बनाए रखता है, पर “आत्मिक” जैसा अतिरिक्त विशेषण नहीं जोड़ता।
theological_decisions:
- issue: ἀδελφός का प्रतिनिधिक प्रयोग
  choice: तुम्हारा भाई
  alternative: तुम्हारा भाई या बहन; तुम्हारा संगी विश्वासी
  rationale: मुख्य पाठ यूनानी के पुल्लिंग एकवचन रूप को सुरक्षित रखता है। प्रसंग में इसका आशय किसी भी संगी विश्वासी से हो सकता है, इसलिए व्यापक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: σκανδαλίζεται में नैतिक पतन का भाव
  choice: पाप में पड़ जाए
  alternative: फँस जाए; अपराध का कारण पाए; ठोकर खिलाया जाए
  rationale: क्रिया किसी को ऐसे फंदे या बाधा में पड़ने का संकेत देती है जो उसे गलत आचरण की ओर ले जाए। चुना हुआ रूप प्रसंगगत नैतिक परिणाम बताता है, लेकिन किसी विशिष्ट पाप या सिद्धान्त को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और बोलचाल में समझ आने वाली रचना। समानांतर infinitive पदों को “न खाना, न पीना, न करना” के रूप में रखा गया है। “दाखमधु” ने οἶνος का स्पष्ट बाइबलीय अर्थ बनाए रखा है; “निर्बल हो जाए” जानबूझकर खुला है ताकि विवेक, विश्वास और नैतिक सामर्थ्य से जुड़ी प्रसंगगत व्यापकता बनी रहे।
