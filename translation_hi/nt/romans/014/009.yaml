  text: εἰς τοῦτο γὰρ ⸀Χριστὸς ⸀ἀπέθανεν καὶ ἔζησεν ἵνα καὶ νεκρῶν καὶ ζώντων κυριεύσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/009.yaml
  text: For to this end Messiah died and lived again[a], so that he might rule over both the dead and the living.
translation:
  language: hi
  text: क्योंकि मसीह इसी उद्देश्य से मरा और फिर जीवित हुआ[a], ताकि वह मरे हुओं और जीवितों—दोनों पर प्रभुता करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जीवित हुआ”; अधिक स्पष्ट रूप से, “जी उठा।” यूनानी में शब्दशः “मरा और जीवित हुआ” है; संदर्भ पुनरुत्थान के जीवन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: इसी उद्देश्य से
  rationale: यह पदबंध लक्ष्य या प्रयोजन बताता है; यह हिन्दी में स्वाभाविक ढंग से उसके उद्देश्यपरक बल को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में व्याख्यात्मक कारण प्रस्तुत करता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ इसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: ἀπέθανεν
  choice: मरा
  rationale: क्रिया का सीधा अर्थ ‘मरा’ है; किसी विस्तार की आवश्यकता नहीं है।
- source_word: ἔζησεν
  choice: फिर जीवित हुआ
  rationale: ‘मरा और जीवित हुआ’ का क्रम पुनरुत्थान के जीवन की ओर संकेत करता है। ‘फिर’ संदर्भगत अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की संक्षिप्त अभिव्यक्ति को बताती है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्यसूचक उपवाक्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: νεκρῶν
  choice: मरे हुओं
  rationale: यह संज्ञात्मक बहुवचन है और ζώντων के साथ स्वाभाविक विरोध बनाता है।
- source_word: ζώντων
  choice: जीवितों
  rationale: वर्तमान कृदंत यहाँ संज्ञा के रूप में प्रयुक्त है; ‘जीवितों’ संक्षिप्त और स्वाभाविक समानांतर है।
- source_word: κυριεύσῃ
  choice: प्रभुता करे
  rationale: यह क्रियात्मक शासन और अधिकार को व्यक्त करता है तथा κύριος से इसके अर्थगत संबंध को भी बनाए रखता है, बिना इसे केवल उपाधि में बदल दिए।
theological_decisions:
- issue: ἔζησεν में पुनरुत्थान का संकेत
  choice: फिर जीवित हुआ
  alternative: जीवित हुआ; जी उठा
  rationale: मृत्यु के बाद जीवन का क्रम और मृतकों तथा जीवितों पर अधिकार का संदर्भ पुनरुत्थान की ओर संकेत करते हैं। अनुवाद संकेत को स्पष्ट करता है, और पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- issue: κυριεύσῃ का मसीह-संबंधी अधिकार
  choice: दोनों पर प्रभुता करे
  alternative: दोनों पर शासन करे; दोनों का प्रभु हो
  rationale: यूनानी रूप क्रिया है, इसलिए ‘प्रभुता करे’ उसके अधिकार और प्रभु-संबंधी अर्थ दोनों को रखता है, पर उसे संज्ञात्मक उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रखी गई है। ‘प्रभुता करे’ ने क्रियात्मक अधिकार तथा मूल शब्द के प्रभु-संबंधी अर्थ दोनों को सुरक्षित रखा है।
