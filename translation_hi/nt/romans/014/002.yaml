  text: One person believes he may eat anything[b][a], but the one who is weak eats vegetables.
translation:
  language: hi
  text: एक व्यक्ति विश्वास करता है कि वह सब कुछ खा सकता है[a], पर जो निर्बल[b] है, वह सब्ज़ियाँ खाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह दृढ़ता से मानता है कि वह सब कुछ खा सकता है।”
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में “निर्बल” भोजन-संबंधी आचरण के विषय में विश्वास या विवेक की निर्बलता को दर्शाता है (देखें रोमियों 14:1)।
    reason: cross_reference
lexical_decisions:
- source_word: ὃς μὲν
  choice: एक व्यक्ति
  rationale: यह रचना विरोध के पहले पक्ष को प्रस्तुत करती है। ‘एक व्यक्ति’ प्रतिनिधिक एकवचन को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से पुरुष-लिंग पर बल नहीं देता।
- source_word: πιστεύει
  choice: विश्वास करता है
  rationale: यहाँ क्रिया के साथ infinitive है और अर्थ भोजन के विषय में व्यक्तिगत विश्वास या धारणा का है। यह चयन मूल शब्दावली से संबंध बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: φαγεῖν πάντα
  choice: कि वह सब कुछ खा सकता है
  rationale: यह वाक्यांश उसके विश्वास की विषय-वस्तु बताता है। ‘खा सकता है’ प्रसंग में निहित आहार-संबंधी अनुमति को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: ὁ δὲ
  choice: पर जो
  rationale: यह वाक्य के दूसरे, विपरीत पक्ष को प्रस्तुत करता है और हिन्दी में समानांतर विरोध को सहज बनाए रखता है।
- source_word: ἀσθενῶν
  choice: जो निर्बल है
  rationale: कृदंत संज्ञात्मक है और किसी निर्बल व्यक्ति को दर्शाता है। पद में ‘विश्वास में’ जोड़ने के बजाय संक्षिप्त मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: λάχανα
  choice: सब्ज़ियाँ
  rationale: यह शब्द बगीचे की उपज या शाक-सब्ज़ियों को दर्शाता है। ‘सब्ज़ियाँ’ आधुनिक हिन्दी में सबसे स्पष्ट और व्यापक समानार्थी है।
- source_word: ἐσθίει
  choice: खाता है
  rationale: क्रिया केवल खाने की बात कहती है। मूल में ‘केवल’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: ἀσθενῶν में ‘निर्बलता’ का स्वरूप
  choice: ‘जो निर्बल है’ रखा गया, बिना इस पद में ‘विश्वास में’ जोड़ने के।
  alternative: ‘जो विश्वास में निर्बल है’
  rationale: रोमियों 14:1 का निकट प्रसंग विश्वास और भोजन-संबंधी धारणाओं के क्षेत्र में इस निर्बलता को स्पष्ट करता है, पर 14:2 स्वयं केवल ‘निर्बल’ कहता है। इसलिए मुख्य पाठ मूल पद की संक्षिप्तता और व्याख्यात्मक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘सब कुछ’ और ‘सब्ज़ियाँ’ प्रचलित शब्द हैं; ‘निर्बल’ पौलुस की मूल्यांकनात्मक श्रेणी को बिना शारीरिक कमजोरी की व्याख्या जोड़े सुरक्षित रखता है।
