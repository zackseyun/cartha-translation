reference: Romans 14:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μηκέτι οὖν ἀλλήλους κρίνωμεν· ἀλλὰ τοῦτο κρίνατε μᾶλλον, τὸ μὴ τιθέναι πρόσκομμα τῷ ἀδελφῷ ἢ σκάνδαλον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/013.yaml
  text: 'Therefore, let us no longer judge one another, but rather decide this: not to put a stumbling block or an offense before a brother.'
translation:
  language: hi
  text: इसलिए हम आगे से एक-दूसरे का न्याय न करें, बल्कि यह निश्चय करें कि किसी भाई[a] के मार्ग में ठोकर का कारण या फंदा[b] न रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘भाई या बहन’ अथवा ‘सहविश्वासी’; यूनानी में एकवचन ‘भाई’ है, जो यहाँ किसी साथी विश्वासी को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: अथवा ‘पतन का कारण’; आशय केवल किसी की भावनाएँ आहत करना नहीं, बल्कि उसे पाप में फँसाना या गिराना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηκέτι οὖν
  choice: इसलिए हम आगे से ... न करें
  rationale: οὖν पिछले तर्क से निष्कर्ष दर्शाता है; Μηκέτι किसी जारी व्यवहार को अब बंद करने का भाव देता है।
- source_word: ἀλλήλους κρίνωμεν
  choice: एक-दूसरे का न्याय न करें
  rationale: परस्परता और उपदेशात्मक प्रथम-पुरुष बहुवचन को स्वाभाविक हिन्दी में रखता है।
- source_word: ἀλλὰ τοῦτο κρίνατε μᾶλλον
  choice: बल्कि यह निश्चय करें
  rationale: 'κρίνω की पुनरावृत्ति में अर्थ का परिवर्तन है: दूसरों का न्याय करने के विपरीत अपने आचरण के विषय में दृढ़ निर्णय करना।'
- source_word: τὸ μὴ τιθέναι
  choice: न रखें
  rationale: आज्ञा के आशय को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρόσκομμα
  choice: ठोकर का कारण
  rationale: शाब्दिक चित्र और किसी के नैतिक या आत्मिक रूप से लड़खड़ाने का कारण—दोनों सुरक्षित रहते हैं।
- source_word: τῷ ἀδελφῷ
  choice: किसी भाई के मार्ग में
  rationale: एकवचन पुल्लिंग ἀδελφῷ को बनाए रखते हुए τιθέναι के साथ निहित 'रास्ते में रखना' का भाव स्पष्ट करता है।
- source_word: σκάνδαλον
  choice: फंदा
  rationale: यह आधुनिक हिन्दी में केवल भावनाएँ आहत करने वाला 'अपमान' नहीं, बल्कि किसी को पाप या पतन में फँसाने वाली वस्तु का अर्थ स्पष्ट करता है।
theological_decisions:
- issue: ἀδελφῷ का प्रतिनिधिक एकवचन
  choice: भाई
  alternative: भाई या बहन; सहविश्वासी
  rationale: मूल का पुल्लिंग एकवचन मुख्य पाठ में सुरक्षित है, जबकि प्रसंग में किसी भी सहविश्वासी पर लागू होने की बात पादटिप्पणी में स्पष्ट की गई है।
- issue: σκάνδαλον का नैतिक अर्थ
  choice: फंदा
  alternative: पतन का कारण; ठोकर खिलाने वाली वस्तु
  rationale: यह शब्द केवल मन दुखाने का नहीं, दूसरे को पाप अथवा आत्मिक पतन में फँसाने का भाव रखता है; 'फंदा' इस भेद को πρόσκομμα से भी यथासंभव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण उपदेशात्मक लहजा। ‘न्याय’ और ‘निश्चय’ से यूनानी κρίνω की अर्थगत पुनरावृत्ति आंशिक रूप से सुनाई देती है; ‘ठोकर का कारण’ और ‘फंदा’ दोनों चित्रात्मक शब्दों को अलग रखते हैं।
