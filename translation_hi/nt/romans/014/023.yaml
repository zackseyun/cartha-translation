  text: ὁ δὲ διακρινόμενος ἐὰν φάγῃ κατακέκριται, ὅτι οὐκ ἐκ πίστεως· πᾶν δὲ ὃ οὐκ ἐκ πίστεως ἁμαρτία ⸀ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/023.yaml
  text: But the one who doubts is condemned if he eats[a], because it is not from faith; and everything that is not from faith is sin.
translation:
  language: hi
  text: परन्तु जो संदेह करता है, यदि वह खाता है, तो वह दोषी ठहरता है, क्योंकि वह विश्वास से नहीं खाता[a]; और जो कुछ विश्वास से नहीं है, वह पाप है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह दृढ़ निश्चय के आधार पर नहीं खाता।” यूनानी में “विश्वास से” है, जिसमें परमेश्वर के सामने स्थिर निश्चय के साथ कार्य करने का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διακρινόμενος
  choice: जो संदेह करता है
  rationale: इस प्रसंग में यह शब्द दूसरों से विवाद करने के बजाय खाने के विषय में भीतर की हिचकिचाहट या संदेह को व्यक्त करता है।
- source_word: ἐὰν φάγῃ
  choice: यदि वह खाता है
  rationale: ἐάν के साथ एओरिस्ट सब्जंक्टिव शर्त को व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से शर्त का अर्थ बनाए रखता है।
- source_word: κατακέκριται
  choice: दोषी ठहराया गया है
  rationale: परफेक्ट पैसिव उस कार्य के फलस्वरूप बनी हुई दोषी अवस्था बताता है; कर्मवाच्य को बनाए रखने से दोष ठहराने वाला अभिकर्ता अनिर्दिष्ट रहता है।
- source_word: ὅτι οὐκ ἐκ πίστεως
  choice: क्योंकि उसका खाना विश्वास से नहीं है
  rationale: कारण-सूचक ὅτι को स्पष्ट रखा गया है। हिन्दी में कर्ता को स्वाभाविक रूप से स्पष्ट करने के लिए 'उसका खाना' जोड़ा गया है, जबकि ἐκ πίστεως का रूपक और पौलुस की शब्दावली सुरक्षित है।
- source_word: πᾶν ... ὃ
  choice: जो कुछ
  rationale: नपुंसकलिंग एकवचन की व्यापकता को सहज और समावेशी हिन्दी में व्यक्त करता है।
- source_word: ἁμαρτία ἐστίν
  choice: वह पाप है
  rationale: विशेषणात्मक 'पापमय है' के बजाय विधेय संज्ञा का सीधा और प्रबल कथन बनाए रखा गया है।
theological_decisions:
- issue: नैतिक रूप से गंभीर पौलुसी प्रसंग में πίστις का अनुवाद
  choice: विश्वास
  alternative: दृढ़ निश्चय; भरोसा; विश्वासयोग्यता
  rationale: '''विश्वास'' पौलुस की व्यापक धर्मवैचारिक शब्दावली को बनाए रखता है और अर्थ को केवल निजी राय तक सीमित नहीं करता। प्रसंग में परमेश्वर के सामने दृढ़ निश्चय से काम करने का भाव पादटिप्पणी में सुरक्षित है।'
- issue: κατακέκριται में दोष ठहराए जाने का अभिकर्ता और दायरा
  choice: दोषी ठहराया गया है
  alternative: अपने ही द्वारा दोषी ठहरता है; परमेश्वर के सामने दोषी ठहरता है
  rationale: यूनानी कर्मवाच्य अभिकर्ता को स्पष्ट नहीं करता। इसलिए अनुवाद यह तय नहीं करता कि मुख्य बल परमेश्वर के न्याय, अंतःकरण, या दोनों पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली अपनाई गई है। 'परन्तु', 'दोषी ठहराया गया है' और 'विश्वास से' मूल की तर्क-रचना तथा धर्मवैचारिक तनाव को बनाए रखते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित अंतिम कथन के बाद दिया गया है।
