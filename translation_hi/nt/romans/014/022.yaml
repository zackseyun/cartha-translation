  text: σὺ πίστιν ⸀ἣν ἔχεις κατὰ σεαυτὸν ἔχε ἐνώπιον τοῦ θεοῦ. μακάριος ὁ μὴ κρίνων ἑαυτὸν ἐν ᾧ δοκιμάζει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/022.yaml
  text: The faith that you have[a], keep to yourself before God[b]. Blessed is the one who does not judge himself by what he approves.
translation:
  language: hi
  text: जो विश्वास तुम्हारे पास है[a], उसे परमेश्वर के सामने अपने तक ही रखो। धन्य है वह जो जिस बात को सही मानता है, उसी बात में अपने को दोषी नहीं ठहराता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो दृढ़ धारणा तुम्हारे पास है, उसे परमेश्वर के सामने अपने तक ही रखो।” यहाँ यूनानी शब्द πίστις विवादित विषयों के बारे में व्यक्ति के निश्चय का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिस बात को वह सही मानता है, उसी बात में अपने आप का न्याय नहीं करता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστιν
  choice: विश्वास
  rationale: यह πίστις का सामान्य और प्रमुख हिन्दी रूप है। इस प्रसंग में इसका आशय विवादित विषय के बारे में परमेश्वर के सामने रखी गई व्यक्तिगत दृढ़ धारणा से है; इस संदर्भगत अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: κατὰ σεαυτὸν
  choice: अपने तक ही
  rationale: यह स्वाभाविक हिन्दी में इस बात को व्यक्त करता है कि व्यक्ति अपनी धारणा दूसरों पर न थोपे, बल्कि उसे निजी रूप से रखे।
- source_word: ἐνώπιον τοῦ θεοῦ
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति और उसके प्रति उत्तरदायित्व—दोनों भावों को बनाए रखता है।
- source_word: μακάριος
  choice: धन्य
  rationale: ‘धन्य’ नैतिक और धर्मवैचारिक गंभीरता को बनाए रखता है; केवल मनोदशा बताने वाला ‘सुखी’ यहाँ कम उपयुक्त है।
- source_word: κρίνων ἑαυτὸν
  choice: अपने आप को दोषी नहीं ठहराता
  rationale: इस संदर्भ में κρίνω का आशय अपने स्वीकृत आचरण के कारण आत्म-दोष या आत्म-दंड की स्थिति में आना है। ‘दोषी ठहराता’ स्वाभाविक हिन्दी में इस अर्थ को स्पष्ट करता है, जबकि व्यापक ‘न्याय करता’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐν ᾧ δοκιμάζει
  choice: जिस बात को सही मानता है, उसके कारण
  rationale: δοκιμάζω यहाँ जाँच-विचार के बाद किसी बात को स्वीकार या सही मानने का भाव देता है। ‘उसके कारण’ ἐν के साधनात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: विवादित आचरणों के प्रसंग में πίστις का अर्थ
  choice: ‘विश्वास’, जिसे यहाँ उस विषय के बारे में परमेश्वर के सामने रखी व्यक्तिगत दृढ़ धारणा के रूप में समझा गया है
  alternative: सामान्य रूप से परमेश्वर पर भरोसा; विश्वासयोग्यता; व्यक्तिगत दृढ़ धारणा
  rationale: निकटवर्ती प्रसंग भोजन और दिनों जैसे विवादित विषयों में विवेक और निश्चय की बात करता है। मुख्य पाठ में प्रमुख धर्मवैचारिक पद ‘विश्वास’ रखा गया है, पर उसके प्रसंगगत अर्थ को पादटिप्पणी में बताया गया है।
- issue: κρίνων ἑαυτὸν में न्याय अथवा दोषी ठहराने का भाव
  choice: अपने आप को दोषी ठहराना
  alternative: अपने आप का न्याय करना
  rationale: κρίνω दोनों अर्थ दे सकता है। यहाँ अपनी स्वीकृत बात के आधार पर आत्म-दोष में पड़ने का भाव अधिक स्वाभाविक है, फिर भी व्यापक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अपने तक ही रखो’ निजी दृढ़ धारणा को दूसरों पर न थोपने का प्रसंगगत भाव देता है, जबकि ‘परमेश्वर के सामने’ व्यक्तिगत उत्तरदायित्व को स्पष्ट रखता है।
