  yaml_path: translation/nt/romans/014/001.yaml
  text: Receive the one who is weak in faith[b][a], not for disputes over opinions.
translation:
  language: hi
  text: विश्वास में जो कमज़ोर है, उसे स्वीकार करो[a]—विचारों को लेकर विवाद करने के लिए नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे अपना लो’ अथवा ‘उसका स्वागत करो।’ यूनानी क्रिया का अर्थ किसी को अपने साथ या अपनी संगति में ग्रहण करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘विचारों का निर्णय करने के लिए नहीं’ या ‘तर्कों पर झगड़ा करने के लिए नहीं’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσθενοῦντα
  choice: जो … कमज़ोर है
  rationale: वर्तमान कृदंत यहाँ संज्ञा के रूप में प्रयुक्त है। यह अनुवाद व्यक्ति की कमज़ोरी को व्यक्त करता है, पर उसे ‘विवेक में कमज़ोर’ कहकर मूल से अधिक विशिष्ट नहीं बनाता।
- source_word: τῇ πίστει
  choice: विश्वास में
  rationale: यह संबंधवाचक चतुर्थी उस क्षेत्र या दृष्टि को बताती है जिसमें व्यक्ति कमज़ोर है। प्रसंग में ‘विश्वास’ उपयुक्त है; ‘मत-सिद्धांत’ या ‘विवेक’ कहना अधिक व्याख्यात्मक होता।
- source_word: προσλαμβάνεσθε
  choice: स्वीकार करो
  rationale: मध्यमवाच्य आज्ञार्थक क्रिया किसी को अपने साथ या संगति में ग्रहण करने का भाव रखती है। ‘स्वीकार करो’ आधुनिक हिन्दी में स्वाभाविक है और व्यक्तिगत तथा सामुदायिक, दोनों अर्थों को समेटता है।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ अगले निषेध के साथ हलका विरोध अथवा संक्रमण प्रकट करता है। हिन्दी वाक्य में ‘पर’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: μὴ εἰς
  choice: … करने के लिए नहीं
  rationale: यह रचना उस अनुचित उद्देश्य या परिणाम को रोकती है जिसके लिए व्यक्ति को स्वीकार नहीं किया जाना चाहिए।
- source_word: διακρίσεις διαλογισμῶν
  choice: विचारों को लेकर विवाद
  rationale: यह पदबंध तर्कों, धारणाओं या विचारों पर विवादपूर्ण निर्णय अथवा बहस का संकेत दे सकता है। मुख्य पाठ का रूप स्पष्ट और स्वाभाविक है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता; मत-सिद्धांत
  rationale: यहाँ प्रसंग विवादित आचरणों के विषय में किसी विश्वासी की दुर्बल दृढ़ता या धारणा से जुड़ा है। ‘विश्वास’ मूल शब्द की व्यापकता बनाए रखता है और किसी विशेष सिद्धांतगत व्याख्या को आरोपित नहीं करता।
- issue: कमज़ोर व्यक्ति को ग्रहण करने का आशय
  choice: स्वीकार करो
  alternative: अपना लो; स्वागत करो
  rationale: मूल क्रिया केवल सहन करने के बजाय व्यक्ति को अपनी संगति में ग्रहण करने का भाव देती है। ‘स्वीकार करो’ इस संबंधपरक आग्रह को बिना किसी सांप्रदायिक अर्थ के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कमज़ोर’ तथा ‘विश्वास’ सामान्य पाठक के लिए स्पष्ट हैं। बहुवचन आज्ञा προσλαμβάνεσθε को हिन्दी के प्रचलित सामूहिक संबोधन ‘करो’ से व्यक्त किया गया है।
