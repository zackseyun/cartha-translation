id: ROM.14.20
reference: Romans 14:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ ἕνεκεν βρώματος κατάλυε τὸ ἔργον τοῦ θεοῦ. πάντα μὲν καθαρά, ἀλλὰ κακὸν τῷ ἀνθρώπῳ τῷ διὰ προσκόμματος ἐσθίοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/020.yaml
  text: Do not[a], for the sake of food, tear down the work of God. All things are indeed clean[b], but it is evil for the person who eats in a way that causes stumbling.
translation:
  language: hi
  text: भोजन के कारण परमेश्वर के कार्य को नष्ट मत करो। सब कुछ निश्चय ही शुद्ध है,[a] पर जो मनुष्य ठोकर का कारण बनकर खाता है, उसके लिए यह बुरा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग भोजन का है; इसलिए इसका अनुवाद “सब भोजन निश्चय ही शुद्ध है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो ठोकर के साथ खाता है।” यूनानी पदबंध का अर्थ किसी दूसरे के लिए ठोकर का कारण बनकर खाना हो सकता है; इसकी संक्षिप्तता ठोकर से जुड़ी परिस्थिति का अर्थ भी रहने देती है।
    reason: ambiguity
lexical_decisions:
- source_word: ἕνεκεν βρώματος
  choice: भोजन के कारण
  rationale: ἕνεκεν के साथ संबंधकारक कारण या प्रयोजन बताता है; यह स्वाभाविक हिन्दी में भोजन जैसी बात के कारण होने वाली हानि को व्यक्त करता है।
- source_word: κατάλυε
  choice: न बिगाड़ो
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। κατάλυε में ढा देने या नष्ट करने का रूपक है; हिन्दी में 'काम को न बिगाड़ो' उस रूपक का स्वाभाविक, प्रभावी अर्थ देता है और पूर्ण विनाश का अनावश्यक भाव नहीं जोड़ता।
- source_word: τὸ ἔργον τοῦ θεοῦ
  choice: परमेश्वर के काम
  rationale: संबंधकारक पदबंध को सीधा रखा गया है, जिससे परमेश्वर द्वारा किसी विश्वासी और समुदाय में किए जा रहे कार्य की व्यापकता बनी रहती है।
- source_word: πάντα μὲν καθαρά
  choice: सब कुछ निश्चय ही शुद्ध है
  rationale: πάντα की व्यापक अभिव्यक्ति बनाए रखी गई है, यद्यपि प्रसंग भोजन का है। μέν को 'निश्चय ही' से हल्के बल सहित व्यक्त किया गया और καθαρά के शुद्धता-संबंधी शब्द को सुरक्षित रखा गया है।
- source_word: κακὸν
  choice: बुरा
  rationale: यहाँ κακόν खाने के उस नैतिक रूप से हानिकारक ढंग का मूल्यांकन करता है। आधुनिक हिन्दी में 'बुरा' सहज है और नैतिक निषेध को स्पष्ट रखता है।
- source_word: τῷ ἀνθρώπῳ
  choice: उस मनुष्य के लिए
  rationale: एकवचन प्रतिनिधिक ἄνθρωπος को स्रोत के रूप के निकट रखते हुए 'मनुष्य' कहा गया है; इसका आशय किसी भी व्यक्ति से है।
- source_word: διὰ προσκόμματος
  choice: जो अपने खाने से किसी को ठोकर खिलाता है
  rationale: πρόσκομμα की ठोकर वाली छवि बनाए रखते हुए वाक्यांश को स्वाभाविक हिन्दी में परिणाम/माध्यम के रूप में व्यक्त किया गया है।
- source_word: ἐσθίοντι
  choice: खाना / जो अपने खाने से
  rationale: वर्तमान कृदन्त उस व्यक्ति की पहचान उसके खाने के ढंग से कराता है; हिन्दी में मुख्य कथन और संबंधवाचक उपवाक्य के मेल से अर्थ स्वाभाविक बनता है।
theological_decisions:
- issue: '''शुद्ध'' कथन का दायरा और भोजन-विधियों से संबंध'
  choice: '''सब कुछ निश्चय ही शुद्ध है'' रखकर कथन को व्यापक छोड़ा गया, जबकि प्रसंग से भोजन का संकेत मिलता है।'
  alternative: '''सब भोजन शुद्ध है'' अथवा ''सब कुछ ग्रहण करने योग्य है।'''
  rationale: यूनानी में πάντα है, 'सब भोजन' स्पष्ट रूप से नहीं; καθαρά को 'शुद्ध' रखने से शुद्धता की धर्मवैचारिक भाषा बनी रहती है और 'अनुमत' जैसी व्याख्या नहीं जोड़ी जाती।
- issue: διὰ προσκόμματος में ठोकर का कर्ता या परिस्थिति
  choice: खाने को किसी दूसरे के लिए ठोकर का कारण माना गया।
  alternative: वह व्यक्ति जो ठोकर की आशंका या दोषी विवेक के साथ खाता है।
  rationale: यूनानी वाक्यांश संक्षिप्त और कुछ हद तक अस्पष्ट है। मुख्य पाठ तत्काल सामुदायिक प्रसंग में दूसरे को ठोकर खिलाने का अर्थ स्पष्ट करता है, जबकि पादटिप्पणी वैकल्पिक समझ को सुरक्षित रखती है।
- issue: प्रतिनिधिक एकवचन ἄνθρωπος
  choice: '''उस मनुष्य'' का प्रयोग, जिसका आशय सामान्य रूप से किसी भी व्यक्ति से है।'
  alternative: '''उस व्यक्ति''।'
  rationale: यह स्रोत के व्याकरणिक एकवचन को दर्शाता है, पर इसे केवल पुरुष तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज प्रवाह रखा गया है। 'ठोकर खिलाना' बाइबलीय रूपक को बनाए रखता है और सामान्य पाठक के लिए प्रसंग में समझने योग्य है।
