source:
  edition: SBLGNT
  text: ὁ γὰρ ἐν ⸀τούτῳ δουλεύων τῷ Χριστῷ εὐάρεστος τῷ θεῷ καὶ δόκιμος τοῖς ἀνθρώποις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/018.yaml
  text: For the one who serves the Messiah in this way is pleasing to God and approved by men.
translation:
  language: hi
  text: क्योंकि जो इस प्रकार मसीह की सेवा करता है, वह परमेश्वर को भाता है और लोगों की दृष्टि में खरा ठहरता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इस प्रकार
  rationale: यह पद 17 में वर्णित धार्मिकता, शांति और आनंद के अनुरूप मसीह की सेवा करने की ओर संकेत करता है; हिंदी में ‘इस प्रकार’ उस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δουλεύων τῷ Χριστῷ
  choice: मसीह की सेवा करता है
  rationale: δουλεύω मूलतः दास के रूप में सेवा करने का भाव रखता है; यहाँ ‘सेवा करता है’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है, जबकि मसीह के प्रति अधीन सेवा का आशय संदर्भ से बना रहता है।
- source_word: εὐάρεστος τῷ θεῷ
  choice: परमेश्वर को भाता है
  rationale: यह अभिव्यक्ति परमेश्वर को स्वीकार्य और प्रसन्न करने वाले होने का अर्थ सहज हिंदी में देती है।
- source_word: δόκιμος τοῖς ἀνθρώποις
  choice: लोगों की दृष्टि में खरा ठहरता है
  rationale: δόκιμος जाँच के बाद प्रमाणित, स्वीकृत या खरा पाए जाने का भाव देता है; ‘खरा ठहरता है’ उस मूल्यांकनात्मक अर्थ को बनाए रखता है। τοῖς ἀνθρώποις को सामान्य मानव समुदाय के अर्थ में समावेशी ‘लोगों’ से व्यक्त किया गया है।
theological_decisions:
- issue: ἐν τούτῳ का संदर्भ
  choice: इस प्रकार
  alternative: इन बातों में
  rationale: एकवचन τούτῳ पाठगत रूप से ‘इसमें/इस प्रकार’ की अनुमति देता है। संदर्भ में यह पद 17 के जीवन-ढंग की ओर संकेत करता है; अनुवाद ने किसी एक गुण तक संकेत को सीमित नहीं किया।
- issue: मनुष्यों द्वारा स्वीकृति का स्वरूप
  choice: लोगों की दृष्टि में खरा ठहरता है
  alternative: लोगों द्वारा स्वीकृत होता है
  rationale: ‘खरा ठहरता है’ मानव प्रशंसा की गारंटी नहीं देता, बल्कि आचरण के प्रमाणित या सम्मानयोग्य पाए जाने का भाव रखता है और δόκιμος की जाँच-संबंधी छाया बचाता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य की कारणसूचक शुरुआत ‘क्योंकि’ से रखी गई है ताकि γάρ और पिछले पद से संबंध सुरक्षित रहे।
