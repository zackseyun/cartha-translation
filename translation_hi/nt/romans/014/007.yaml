  text: Οὐδεὶς γὰρ ἡμῶν ἑαυτῷ ζῇ, καὶ οὐδεὶς ἑαυτῷ ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/007.yaml
  text: For none of us lives for himself[a], and none dies for himself.
translation:
  language: hi
  text: क्योंकि हममें से कोई भी अपने लिए नहीं जीता, और कोई भी अपने लिए नहीं मरता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐδεὶς
  choice: कोई भी नहीं
  rationale: दोनों उपवाक्यों में सार्वभौमिक निषेध व्यक्त करता है; हिन्दी में यह स्वाभाविक और समानांतर रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: ἡμῶν
  choice: हममें से
  rationale: οὐδεὶς के साथ अंशवाचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἑαυτῷ
  choice: अपने लिए
  rationale: यह आत्म-संदर्भित दत्तिव को व्यक्त करता है और प्रसंग में स्वयं को जीवन या मृत्यु का अंतिम लक्ष्य मानने का भाव संप्रेषित करता है।
- source_word: ζῇ
  choice: जीता
  rationale: सामान्य और सार्वकालिक कथन के लिए हिन्दी का सामान्य वर्तमान रूप उपयुक्त है।
- source_word: καὶ
  choice: और
  rationale: दो समानांतर उपवाक्यों को सीधे जोड़ता है।
- source_word: ἀποθνῄσκει
  choice: मरता
  rationale: सामान्य सत्य व्यक्त करता है और ‘जीता’ के साथ समानांतरता बनाए रखता है।
theological_decisions:
- issue: दोनों उपवाक्यों में ἑαυτῷ का अर्थ
  choice: अपने लिए
  alternative: अपने प्रति / अपने ही वास्ते
  rationale: अगले पद के संदर्भ में जीवन और मृत्यु की दिशा या अंतिम लक्ष्य का भाव प्रमुख है। ‘अपने लिए’ इस भाव को स्वाभाविक हिन्दी में रखता है, बिना प्रभु-संबंधी अगले पद की बात को पहले से जोड़ने के।
- issue: ग्रीक के पुल्लिंग एकवचन रूप का हिन्दी में निरूपण
  choice: कोई भी ... जीता/मरता
  alternative: कोई ... जीता या जीती/मरता या मरती
  rationale: हिन्दी में ‘कोई भी’ के साथ पुल्लिंग एकवचन सामान्य मानव-संदर्भ में प्रचलित व्याकरणिक रूप है; अनावश्यक विस्तार से पद की संक्षिप्त समानांतरता टूटती।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज। दोनों उपवाक्यों की यूनानी समानांतर संरचना को यथासंभव सुरक्षित रखा गया है।
