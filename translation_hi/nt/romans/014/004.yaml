review_pass:
  verdict: revise
  source_fidelity: Draft correctly represents the household-slave image, the accountability to one’s own master, the future passive in σταθήσεται, and the final theological reference of ὁ κύριος. However, “फिर भी” makes δέ more concessive/adversative than warranted; “और” is the safer connective. Rendering the repeated ἵστημι/στήκω language with “खड़ा” more directly preserves the source’s threefold verbal linkage.
  naturalness: “किसी दूसरे के घरेलू दास का न्याय करो” is understandable, but “तुम कौन हो जो ... न्याय करते हो?” is smoother modern Hindi for the rhetorical participial question. “खड़ा रहता है या गिरता है” is idiomatic in this contrast and coheres naturally with “खड़ा किया जाएगा” and “खड़ा करने.”
  terminology: “घरेलू दास” appropriately retains οἰκέτης’ household and bonded-status sense. “स्वामी” is apt within the analogy, while “प्रभु” rightly marks the final κύριος as the theological referent without forcing the alternative interpretation. The footnote retains the passive/intransitive alternative and the referential ambiguity.
  issues:
  - severity: medium
    issue: The connective “फिर भी” overstates δέ.
    rationale: δέ here advances the thought with an assurance (“and/but he will be made to stand”); “फिर भी” adds an unnecessary concessive sense.
  - severity: low
    issue: The source’s repeated standing wordplay is less visible in “स्थिर रहता है / स्थिर किया जाएगा / स्थिर करने में समर्थ है.”
    rationale: The draft is semantically defensible, but “खड़ा रहता है / खड़ा किया जाएगा / खड़ा करने” provides a more transparent and natural Hindi correspondence to στήκει / σταθήσεται / στῆσαι.
  - severity: low
    issue: The opening question can be more idiomatic.
    rationale: Using “तुम कौन हो जो ... न्याय करते हो?” reflects the substantival participle naturally and avoids the somewhat less direct “तुम कौन होते हो कि ... न्याय करो?”
  revised_text: तुम कौन हो जो किसी दूसरे के घरेलू दास का न्याय करते हो? वह अपने ही स्वामी के सामने खड़ा रहता है या गिरता है। और उसे खड़ा किया जाएगा,[a] क्योंकि प्रभु उसे खड़ा करने में समर्थ है।
