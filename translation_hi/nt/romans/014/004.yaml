id: ROM.14.4
reference: Romans 14:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: σὺ τίς εἶ ὁ κρίνων ἀλλότριον οἰκέτην; τῷ ἰδίῳ κυρίῳ στήκει ἢ πίπτει· σταθήσεται δέ, ⸂δυνατεῖ γὰρ⸃ ὁ ⸀κύριος στῆσαι αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/004.yaml
  text: Who are you to judge another's household servant? He stands or falls before his own lord[a], and he will be made to stand[c][b], for the Lord is able to make him stand.
translation:
  language: hi
  text: तुम कौन हो जो किसी दूसरे के घरेलू दास का न्याय करते हो? वह अपने ही स्वामी के सामने खड़ा रहता है या गिरता है। और उसे खड़ा किया जाएगा,[a] क्योंकि प्रभु उसे खड़ा करने में समर्थ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह खड़ा रहेगा।” अन्तिम “प्रभु” को कुछ लोग दास के स्वामी के अर्थ में समझते हैं; अधिक सम्भावना है कि यहाँ पौलुस धर्मवैज्ञानिक अर्थ में प्रभु की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σὺ τίς εἶ ὁ κρίνων
  choice: तुम कौन होते हो कि ... न्याय करो?
  rationale: यह स्वाभाविक हिन्दी में यूनानी के बलयुक्त आलंकारिक प्रश्न और फटकार को बनाए रखता है।
- source_word: ἀλλότριον οἰκέτην
  choice: किसी दूसरे का घरेलू दास
  rationale: οἰκέτης घराने की सेवा में बँधे सेवक/दास को दर्शाता है; ‘घरेलू दास’ उसके घरेलू और बंधुआ सामाजिक संबंध दोनों को सुरक्षित रखता है।
- source_word: τῷ ἰδίῳ κυρίῳ
  choice: अपने ही स्वामी के सामने
  rationale: सम्बन्धवाचक सम्प्रदान को उत्तरदायित्व के भाव सहित व्यक्त करता है; दास-रूपक में κύριος के लिए ‘स्वामी’ स्वाभाविक है।
- source_word: στήκει ἢ πίπτει
  choice: स्थिर रहता है या गिरता है
  rationale: यह विरोधी क्रियाओं और खड़े रहने/गिरने के रूपक को बनाए रखता है; στήκει में दृढ़ता का भाव भी व्यक्त होता है।
- source_word: σταθήσεται
  choice: स्थिर किया जाएगा
  rationale: भविष्यत् कर्मवाच्य को स्पष्ट रखता है और अगले उपवाक्य में प्रकट प्रभु की कर्तृता की ओर संकेत करता है।
- source_word: δυνατεῖ γὰρ ὁ κύριος στῆσαι αὐτόν
  choice: क्योंकि प्रभु उसे स्थिर करने में समर्थ है
  rationale: कारणसूचक γάρ, सामर्थ्यसूचक δυνατεῖ और σταθήσεται/στῆσαι की शब्दगत कड़ी सुरक्षित रहती है।
theological_decisions:
- issue: अन्तिम ὁ κύριος का निर्देश
  choice: ‘प्रभु’—धर्मवैज्ञानिक अर्थ में, सम्भवतः मसीह
  alternative: दास-रूपक के भीतर उसका मानवीय स्वामी
  rationale: निश्चित पदबंध और पौलुस का प्रसंग धर्मवैज्ञानिक निर्देश का अधिक समर्थन करते हैं; फिर भी ‘स्वामी’ और ‘प्रभु’ के निकट अर्थ तथा पादटिप्पणी के द्वारा रूपकगत वैकल्पिक समझ सुरक्षित है।
- issue: σταθήσεται में कर्तृता
  choice: कर्मवाच्य ‘स्थिर किया जाएगा’
  alternative: ‘स्थिर रहेगा’
  rationale: कर्मवाच्य रूप निहित दिव्य कर्तृता को बिना मिटाए रखता है, जिसे अगला उपवाक्य स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानपूर्ण पर सहज शैली। ‘दास’ प्राचीन बंधुआ सामाजिक स्थिति को छिपाता नहीं, जबकि ‘घरेलू’ οἰκέτης की घराने-विशेष अर्थछाया को व्यक्त करता है। ‘स्थिर’ की पुनरावृत्ति मूल की στήκει/σταθήσεται/στῆσαι शब्द-कड़ी को बनाए रखती है।
