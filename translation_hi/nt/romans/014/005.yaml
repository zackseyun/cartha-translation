source:
  edition: SBLGNT
  text: Ὃς ⸀μὲν κρίνει ἡμέραν παρ’ ἡμέραν, ὃς δὲ κρίνει πᾶσαν ἡμέραν· ἕκαστος ἐν τῷ ἰδίῳ νοῒ πληροφορείσθω·
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/005.yaml
  text: One person judges one day above another day[a], while another judges every day alike[c][b]. Let each one be fully convinced in his own mind.
translation:
  language: hi
  text: कोई एक दिन को दूसरे दिन से बढ़कर मानता है[a], जबकि कोई हर दिन को समान मानता है[b]। हर एक अपने मन में पूरी तरह निश्चित हो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई एक दिन को दूसरे दिन से अधिक महत्त्वपूर्ण समझता है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर दिन”; प्रसंग में आशय है कि वह सभी दिनों को समान मानता है।
    reason: lexical_alternative
  - marker: c
    text: या, “पूरी तरह आश्वस्त हो” अथवा “पूरा विश्वास रखे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κρίνει
  choice: मानता है
  rationale: यहाँ क्रिया का अर्थ दोषी ठहराना नहीं, बल्कि मूल्यांकन करके भेद करना है। ‘मानता है’ आधुनिक हिन्दी में स्वाभाविक है और दोनों खंडों में समान यूनानी क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: ἡμέραν παρ’ ἡμέραν
  choice: एक दिन को दूसरे दिन से बढ़कर
  rationale: παρά की तुलनात्मक शक्ति को स्पष्ट करता है, पर यह नहीं बताता कि किन दिनों की बात है।
- source_word: πᾶσαν ἡμέραν
  choice: हर दिन को समान
  rationale: यूनानी में शाब्दिक रूप से ‘हर दिन’ है; पहले खंड के विरोध से दिनों में भेद न करने का आशय निकलता है। ‘समान’ इसी निहित तुलना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἕκαστος
  choice: हर एक
  rationale: एकवचन और वितरणात्मक बल को सहज, समावेशी हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ ἰδίῳ νοῒ
  choice: अपने मन में
  rationale: νοῦς के ‘मन/समझ’ संबंधी अर्थ को सीधे व्यक्त करता है और ἰδίῳ के व्यक्तिगत बल को सुरक्षित रखता है।
- source_word: πληροφορείσθω
  choice: पूरी तरह निश्चित हो
  rationale: वर्तमान आज्ञार्थक का आशय किसी विषय में पूर्ण आश्वस्तता या दृढ़ निश्चय रखना है। यह हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: यहाँ उल्लिखित ‘दिनों’ का स्वरूप
  choice: सामान्य रूप में केवल ‘दिन’ रखा गया है।
  alternative: इसे सब्त, यहूदी पर्व-दिन, उपवास-दिन या विशेष भक्तिपरक दिन कहना।
  rationale: पौलुस इस पद में दिनों की पहचान स्पष्ट नहीं करता; अनुवाद को इस व्याख्यात्मक प्रश्न का निर्णय नहीं करना चाहिए।
- issue: πᾶσαν ἡμέραν में समानता का निहित अर्थ
  choice: ‘हर दिन को समान मानता है’
  alternative: अधिक शाब्दिक ‘हर दिन को मानता है’
  rationale: ‘समान’ यूनानी का अलग शब्द नहीं है, पर पहले खंड के स्पष्ट विरोध से यह आशय स्वाभाविक रूप से निकलता है; पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
- issue: एकवचन पुल्लिंग रूपों का हिन्दी में निरूपण
  choice: ‘हर एक अपने मन में’
  alternative: ‘हर व्यक्ति अपने मन में’ या स्पष्ट पुल्लिंग ‘हर पुरुष अपने मन में’
  rationale: हिन्दी में ‘हर एक अपने’ एकवचन वितरणात्मक अर्थ को बनाए रखते हुए अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर खंडों में ‘मानता है’ दोहराकर यूनानी संरचना सुरक्षित की गई है। किसी विशेष दिन, पर्व या सब्त का नाम जोड़ने से परहेज़ किया गया है।
