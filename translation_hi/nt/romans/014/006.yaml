source:
  edition: SBLGNT
  text: ὁ φρονῶν τὴν ἡμέραν κυρίῳ ⸀φρονεῖ. καὶ ὁ ἐσθίων κυρίῳ ἐσθίει, εὐχαριστεῖ γὰρ τῷ θεῷ· καὶ ὁ μὴ ἐσθίων κυρίῳ οὐκ ἐσθίει, καὶ εὐχαριστεῖ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/006.yaml
  text: The one who observes the day[a], observes it for the Lord. And the one who eats, eats for the Lord, for he gives thanks to God; and the one who does not eat, does not eat for the Lord, and he gives thanks to God.
translation:
  language: hi
  text: जो उस दिन को विशेष मानता है[a], वह प्रभु के लिए उसे विशेष मानता है। और जो खाता है, वह प्रभु के लिए खाता है, क्योंकि वह परमेश्वर को धन्यवाद देता है; और जो नहीं खाता, वह प्रभु के लिए नहीं खाता, और वह भी परमेश्वर को धन्यवाद देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस दिन का मान रखता है” अथवा “उस दिन पर ध्यान देता है”; यूनानी क्रिया का अर्थ किसी बात पर मन लगाना या उसे महत्त्व देना हो सकता है। यहाँ आशय सम्भवतः किसी दिन को विशेष मानने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φρονῶν / φρονεῖ
  choice: विशेष मानता है / विशेष मानता है
  rationale: φρονέω यहाँ केवल मन में सोचने के बजाय किसी दिन को महत्त्व या मान देने की व्यावहारिक भावना व्यक्त करता है। ‘विशेष मानना’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी क्रिया की कुछ व्यापकता भी बनाए रखता है।
- source_word: τὴν ἡμέραν
  choice: उस दिन को
  rationale: यूनानी में निश्चित उपपद है और निकटवर्ती प्रसंग में पहले से विचाराधीन दिन की ओर संकेत है। ‘उस दिन’ हिन्दी में इस संदर्भगत निश्चितता को स्वाभाविक रूप से व्यक्त करता है, बिना यह तय किए कि कौन-सा दिन है।
- source_word: κυρίῳ
  choice: प्रभु के लिए
  rationale: सम्प्रदान कारक यहाँ प्रभु की ओर उन्मुखता और उनके निमित्त किए जाने का भाव देता है। ‘प्रभु के लिए’ सहज हिन्दी है और उद्देश्य-संबंध को स्पष्ट रखता है।
- source_word: ἐσθίων / ἐσθίει
  choice: जो खाता है / खाता है
  rationale: वर्तमान रूप सामान्य या प्रचलित आचरण बताता है। हिन्दी का सामान्य वर्तमान काल इस भाव और वाक्य के समानांतर ढाँचे को बनाए रखता है।
- source_word: εὐχαριστεῖ τῷ θεῷ
  choice: परमेश्वर को धन्यवाद देता है
  rationale: यह हिन्दी में धन्यवाद की क्रिया और उसके लक्ष्य को स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ μὴ ἐσθίων
  choice: जो नहीं खाता
  rationale: यह नकारात्मक कृदन्त का सीधा और सहज अनुवाद है तथा ‘जो खाता है’ के साथ मूल का समानांतर रूप सुरक्षित रखता है।
theological_decisions:
- issue: ‘दिन’ को विशेष मानने का आशय
  choice: रोमियों 14 में विवादित आचरण से जुड़े किसी दिन का सामान्य उल्लेख
  alternative: विशेष रूप से सब्त, यहूदी पर्व-दिन, या उपवास-दिन
  rationale: पौलुस इस पद में दिन की पहचान नहीं करता। अनुवाद उसी व्यापकता को बनाए रखता है और किसी सांप्रदायिक या ऐतिहासिक निष्कर्ष को पाठ में नहीं जोड़ता।
- issue: κύριος का संदर्भ
  choice: प्रभु
  alternative: परमेश्वर
  rationale: पौलुस के इस प्रसंग में κύριος स्वाभाविक रूप से प्रभु यीशु की ओर संकेत कर सकता है, जबकि धन्यवाद स्पष्टतः परमेश्वर को दिया जाता है। ‘प्रभु’ रखने से मूल की शब्दावली और संभावित भेद सुरक्षित रहता है।
- issue: κυρίῳ οὐκ ἐσθίει का संबंध
  choice: ‘प्रभु के लिए नहीं खाता’—अर्थात प्रभु के निमित्त खाने से परहेज़ करता है
  alternative: ‘वह प्रभु के लिए नहीं खाता’ को प्रभु-विरोधी आचरण समझना
  rationale: οὐκ क्रिया ‘खाता है’ का निषेध करता है; सम्पूर्ण प्रसंग बताता है कि न खाने वाला भी अपने आचरण को प्रभु की ओर उन्मुख मानता है और परमेश्वर को धन्यवाद देता है। हिन्दी में मूल क्रम रखा गया है, जबकि प्रसंग गलत अर्थ को नियंत्रित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विशेष मानता है’ धार्मिक पालन की धारणा व्यक्त करता है, पर किसी खास दिन या विधि को निर्दिष्ट नहीं करता। दूसरे अर्धांश में ‘वह भी’ जोड़ा गया है ताकि καί का समावेशी बल स्वाभाविक हिन्दी में स्पष्ट हो; इससे नया आशय नहीं जुड़ता।
