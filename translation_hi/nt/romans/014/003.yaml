  text: ὁ ἐσθίων τὸν μὴ ἐσθίοντα μὴ ἐξουθενείτω, ⸂ὁ δὲ⸃ μὴ ἐσθίων τὸν ἐσθίοντα μὴ κρινέτω, ὁ θεὸς γὰρ αὐτὸν προσελάβετο.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/003.yaml
  text: The one who eats must not despise the one who does not eat[a], and the one who does not eat must not judge the one who eats[c][b], for God has welcomed him.
translation:
  language: hi
  text: जो खाता है, वह जो नहीं खाता उसे तुच्छ न समझे[a]; और जो नहीं खाता, वह जो खाता है उसके विषय में फैसला न करे[b], क्योंकि परमेश्वर ने उसे स्वीकार किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हिकारत की दृष्टि से न देखे।”
    reason: lexical_alternative
  - marker: b
    text: या, “उस पर निर्णय न दे” अथवा “उसे दोषी न ठहराए।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसे अपना लिया है” अथवा “उसे ग्रहण किया है।” इस क्रिया में किसी का स्वागत करके उसे संगति में अपनाने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἐσθίων
  choice: जो खाता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी ऐसे व्यक्ति को दर्शाता है जिसकी पहचान यहाँ खाने से होती है। यह सहज हिन्दी है और यूनानी की सामान्य, अनिर्दिष्ट अभिव्यक्ति को बनाए रखती है।
- source_word: τὸν μὴ ἐσθίοντα
  choice: न खाने वाले को
  rationale: यह यूनानी के समान खाने वाले और न खाने वाले के बीच स्पष्ट समानांतर विरोध रखता है तथा यह नहीं जोड़ता कि वह किन वस्तुओं से परहेज़ करता है।
- source_word: ἐξουθενείτω
  choice: तुच्छ न समझे
  rationale: क्रिया किसी को महत्वहीन मानने या उसका तिरस्कार करने का भाव देती है। ‘तुच्छ न समझे’ आधुनिक हिन्दी में स्वाभाविक और नैतिक निषेध के अनुरूप प्रबल है।
- source_word: ὁ δὲ μὴ ἐσθίων
  choice: और जो नहीं खाता
  rationale: δέ का विरोध वाक्य की समानांतर संरचना से स्पष्ट है; ‘और’ हिन्दी में दोनों पारस्परिक निषेधों को सहजता से जोड़ता है।
- source_word: κρινέτω
  choice: न्याय न करे
  rationale: यह किसी साथी के विषय में निर्णय देने या उसे दोषी ठहराने की क्रिया बताता है। ‘न्याय न करे’ अर्थ की व्यापकता को बनाए रखता है; ‘दोषी न ठहराए’ अपेक्षाकृत संकीर्ण होता।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यह स्पष्ट कर्ता है; हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ प्रतिष्ठित, dignified और सामान्यतः बोधगम्य पद है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले दिए दोनों निषेधों का कारण स्पष्ट करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: αὐτὸν
  choice: उसे
  rationale: एकवचन सर्वनाम को बनाए रखा गया है। इससे निकटतम संदर्भ खाने वाले का रह सकता है, जबकि व्यापक पारस्परिक तर्क में दूसरे पक्ष पर भी बात लागू होने की संभावना बंद नहीं होती।
- source_word: προσελάβετο
  choice: स्वीकार किया है
  rationale: इस संदर्भ में क्रिया किसी को अपने पास ग्रहण करने और संगति में स्वागत करने का भाव रखती है। ‘स्वीकार किया है’ सहज हिन्दी है और ‘स्वागत किया’ की तुलना में संबंधपरक ग्रहण का व्यापक अर्थ रखती है।
theological_decisions:
- issue: खाने और न खाने के विरोध का दायरा
  choice: वचन में केवल ‘खाता है’ और ‘नहीं खाता’ कहा गया है।
  alternative: इसे स्पष्ट रूप से सब प्रकार का भोजन खाने और कुछ खाद्य पदार्थों से परहेज़ करने के रूप में प्रस्तुत करना।
  rationale: आसपास का प्रसंग भोजन-संबंधी मतभेद बताता है, पर इस वचन की यूनानी भाषा सामान्य है। मुख्य पाठ में शाकाहार, रीति-विधान या किसी विशेष भोजन को जोड़ना मूल से अधिक स्पष्टता थोप देता।
- issue: ‘उसे’ का संदर्भ
  choice: एकवचन ‘उसे’ रखा गया है और उसका संदर्भ स्पष्ट करके सीमित नहीं किया गया।
  alternative: ‘उस व्यक्ति को’ कहना, अथवा इसे केवल खाने वाले के लिए स्पष्ट करना।
  rationale: निकटतम व्याकरणिक पूर्वपद खाने वाला है, पर पौलुस का पारस्परिक तर्क परमेश्वर द्वारा ग्रहण किए गए साथी विश्वासी पर व्यापक रूप से लागू होता है। मूल की संभावित तनावपूर्ण व्यापकता को बनाए रखा गया है।
- issue: προσελάβετο में ग्रहण और संगति का भाव
  choice: मुख्य पाठ में ‘स्वीकार किया है’ और पादटिप्पणी में संबंधपरक विकल्प दिए गए हैं।
  alternative: मुख्य पाठ में ‘अपना लिया है’ या ‘संगति में शामिल किया है’ कहना।
  rationale: ‘स्वीकार किया’ मूल अर्थ की पर्याप्त चौड़ाई रखता है; ‘अपना लिया’ अधिक आत्मीय किंतु कुछ अधिक व्याख्यात्मक है, और ‘संगति में शामिल किया’ निहितार्थ को सीधे मुख्य पाठ में जोड़ देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, संक्षिप्त और गरिमापूर्ण रखी गई है। समानांतर ‘जो खाता है/जो नहीं खाता’ संरचना मूल की पारस्परिकता को स्पष्ट करती है। ‘तुच्छ न समझे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘न्याय न करे’ धार्मिक अर्थ थोपे बिना κρίνω की व्यापकता बनाए रखता है।
