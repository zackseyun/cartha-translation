source:
  edition: SBLGNT
  text: γέγραπται γάρ· Ζῶ ἐγώ, λέγει κύριος, ὅτι ἐμοὶ κάμψει πᾶν γόνυ, καὶ ⸂πᾶσα γλῶσσα ἐξομολογήσεται⸃ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/014/011.yaml
  text: 'For it is written: “As I live[a], says the Lord, every knee will bow to me, and every tongue will confess to God.”'
translation:
  language: hi
  text: 'क्योंकि लिखा है: “मेरे जीवन की शपथ,” प्रभु कहता है, “हर एक घुटना मेरे सामने झुकेगा, और हर एक जीभ परमेश्वर का अंगीकार करेगी[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर को स्वीकार करेगी” अथवा “परमेश्वर की स्तुति करेगी।” यूनानी क्रिया प्रसंग के अनुसार अंगीकार, स्वीकार या स्तुति का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का परिचित सूत्र है और यूनानी पूर्णकाल के वर्तमान प्रामाणिक प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ζῶ ἐγώ
  choice: मेरे जीवन की शपथ
  rationale: यह केवल ‘मैं जीवित हूँ’ का कथन नहीं, बल्कि ईश्वरीय शपथ-सूत्र है; चुना हुआ रूप उसके गंभीर और प्रतिज्ञात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος का सामान्य और सटीक हिन्दी समतुल्य; यूनानी पाठ में प्रयुक्त उपाधि को ही रखा गया है।
- source_word: ἐμοὶ
  choice: मेरे सामने
  rationale: घुटना झुकाने के प्रसंग में यह स्वाभाविक हिन्दी है और ‘मेरी ओर/मेरे प्रति’ अधीनता का भाव बनाए रखती है।
- source_word: κάμψει πᾶν γόνυ
  choice: हर एक घुटना ... झुकेगा
  rationale: यूनानी की शारीरिक छवि और सार्वभौमिकता दोनों को स्पष्ट, प्रचलित हिन्दी में सुरक्षित रखता है।
- source_word: πᾶσα γλῶσσα
  choice: हर एक जीभ
  rationale: व्यक्ति या भाषा कहकर रूपक को सपाट करने के बजाय मूल शास्त्रीय शारीरिक बिंब को बनाए रखा गया है।
- source_word: ἐξομολογήσεται
  choice: अंगीकार करेगी
  rationale: यह सार्वजनिक स्वीकारोक्ति का मुख्य भाव देता है, जबकि क्रिया में स्वीकार करने और स्तुति करने की संभावित छायाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: τῷ θεῷ
  choice: परमेश्वर के सामने
  rationale: हिन्दी में ‘अंगीकार करना’ के साथ यह स्वाभाविक है और परमेश्वर को संबोधित अथवा उसके समक्ष किए जाने वाले अंगीकार का दत्तिव संबंध व्यक्त करता है।
theological_decisions:
- issue: उद्धरण में ‘प्रभु’ और ‘परमेश्वर’ का संबंध
  choice: ‘प्रभु कहता है ... मेरे सामने ... परमेश्वर के सामने’ के रूप को बिना सामंजस्य बैठाए बनाए रखा गया है।
  alternative: अंतिम पदांश को ‘मेरे सामने अंगीकार करेगी’ करना, अथवा अनुवाद में ही प्रभु की पहचान के विषय में स्पष्ट धर्मवैज्ञानिक निष्कर्ष जोड़ना।
  rationale: यूनानी पाठ प्रथम पुरुष ‘मेरे’ से ‘परमेश्वर’ की ओर जो शब्दगत परिवर्तन करता है, उसे अनुवाद में सुरक्षित रखना चाहिए; उसका धर्मवैज्ञानिक तनाव चुपचाप मिटाना या विस्तार से समझा देना अनुवाद का कार्य नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मेरे जीवन की शपथ’ शपथ-सूत्र को सामान्य पाठक के लिए स्पष्ट करता है; ‘हर एक घुटना’ और ‘हर एक जीभ’ मूल की काव्यात्मक समानांतरता बनाए रखते हैं।
