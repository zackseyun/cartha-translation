  text: So then[a], each of us will give an account of himself.
translation:
  language: hi
  text: इसलिए, हम में से हर एक अपने बारे में लेखा देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρα
  choice: इसलिए
  rationale: यह पिछले तर्क से निकला निष्कर्ष प्रकट करता है; आधुनिक हिन्दी में ‘इसलिए’ इसका तार्किक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἕκαστος ἡμῶν
  choice: हममें से हर एक
  rationale: ἕκαστος की प्रत्येक व्यक्ति पर अलग-अलग लागू होने वाली शक्ति और ἡμῶν के अंशवाचक संबंध को स्पष्ट रखता है।
- source_word: περὶ ἑαυτοῦ
  choice: अपने विषय में
  rationale: περί के साथ संबंधकारक का मूल अर्थ ‘के विषय में/के बारे में’ है; ‘अपने विषय में’ यूनानी के एकवचन आत्मवाचक रूप और आशय दोनों को सुरक्षित रखता है।
- source_word: λόγον
  choice: लेखा
  rationale: λόγον δώσει एक मुहावरा है जिसका अर्थ जवाबदेही के प्रसंग में लेखा देना है; ‘लेखा’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: δώσει
  choice: देगा
  rationale: यह δίδωμι का भविष्यकालीन सक्रिय रूप है; ‘लेखा देगा’ हिन्दी में पूरे मुहावरे को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἑαυτοῦ का एकवचन आत्मवाचक और सार्वत्रिक प्रयोग
  choice: अपने विषय में
  alternative: अपना लेखा / अपने लिए
  rationale: मूल पाठ प्रत्येक व्यक्ति को अलग-अलग एकवचन में प्रस्तुत करता है। ‘अपने विषय में’ इस संरचना को बनाए रखता है और जवाबदेही का आशय पाठ में अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- issue: प्राप्त यूनानी पाठ में अप्रकट कर्म का प्रश्न
  choice: परमेश्वर को
  alternative: लेखा देगा (किसे, यह अप्रकट रखते हुए)
  rationale: दिए गए SBLGNT अंश में ‘परमेश्वर को’ प्रत्यक्ष रूप से नहीं है, यद्यपि पिछले पद का संदर्भ परमेश्वर के न्यायासन को सामने रखता है। प्रकाशन-पाठ में संदर्भगत प्राप्तकर्ता को स्पष्ट करने का यह निर्णय अर्थ-संचार के लिए लिया गया है, पर इसे मूल पद में अप्रकट होने के कारण सावधानी से समझना चाहिए।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘हिसाब’ की अपेक्षा ‘लेखा’ न्याय और उत्तरदायित्व के प्रसंग में अधिक औपचारिक है, फिर भी सामान्य पाठक के लिए सहज है।
