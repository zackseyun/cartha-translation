source:
  edition: SBLGNT
  text: Πῶς οὖν ⸀ἐπικαλέσωνται εἰς ὃν οὐκ ἐπίστευσαν; πῶς δὲ ⸀πιστεύσωσιν οὗ οὐκ ἤκουσαν; πῶς δὲ ⸀ἀκούσωσιν χωρὶς κηρύσσοντος;
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/014.yaml
  text: How then will they call on him in whom they have not believed? And how will they believe in him of whom they have not heard? And how will they hear without someone preaching?[a]
translation:
  language: hi
  text: तो फिर, जिस पर उन्होंने विश्वास नहीं किया, उसे वे कैसे पुकारेंगे? और जिसके विषय में उन्होंने सुना नहीं, उस पर वे कैसे विश्वास करेंगे?[a] और बिना किसी के प्रचार किए वे कैसे सुनेंगे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसे उन्होंने सुना नहीं, उस पर वे कैसे विश्वास करेंगे?”
    reason: यूनानी οὗ को ἀκούω के साथ अधिक शाब्दिक रूप से ‘जिसे उन्होंने सुना नहीं’ भी समझा जा सकता है। मुख्य पाठ संदर्भ में प्रचारित संदेश के द्वारा किसी के विषय में सुनने का स्वाभाविक अर्थ व्यक्त करता है।
lexical_decisions:
- source_word: Πῶς οὖν
  choice: तो फिर ... कैसे
  rationale: ‘तो फिर’ οὖν के निष्कर्षसूचक बल को और ‘कैसे’ प्रश्नों की तर्कपूर्ण शृंखला को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐπικαλέσωνται
  choice: पुकारेंगे
  rationale: यह प्रभु का नाम लेकर उसे पुकारने या उससे सहायता की विनती करने के भाव को संक्षेप में व्यक्त करता है और पिछले पद की प्रतिध्वनि बनाए रखता है।
- source_word: εἰς ὃν οὐκ ἐπίστευσαν
  choice: जिस पर उन्होंने विश्वास नहीं किया
  rationale: ‘पर विश्वास करना’ आधुनिक हिन्दी में स्वाभाविक है और εἰς के लक्ष्य-संबंधी भाव को व्यक्त करता है।
- source_word: πιστεύσωσιν
  choice: विश्वास करेंगे
  rationale: πιστεύω के सामान्य अर्थ को सुरक्षित रखते हुए प्रश्न में भविष्याभिमुख सम्भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὗ οὐκ ἤκουσαν
  choice: जिसे उन्होंने सुना नहीं
  rationale: यह यूनानी संबंधवाचक रचना के निकट रहता है और इस सम्भावना को खुला रखता है कि आशय स्वयं उसे सुनने का है; ‘उसके विषय में सुनने’ वाला सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἀκούσωσιν
  choice: सुनेंगे
  rationale: सीधा lexical equivalent है और पहले ‘सुना’ के साथ पौलुस की पुनरुक्ति तथा तर्क-शृंखला को बनाए रखता है।
- source_word: χωρὶς κηρύσσοντος
  choice: बिना किसी के प्रचार किए
  rationale: यह किसी औपचारिक पद ‘प्रचारक’ पर बल देने के बजाय κηρύσσοντος द्वारा सूचित प्रचार की क्रिया को सामने रखता है।
theological_decisions:
- issue: πιστεύω / विश्वास-संबंधी भाषा
  choice: विश्वास करना
  alternative: भरोसा रखना
  rationale: ‘विश्वास करना’ पौलुस की faith-language से मानक शब्दगत संबंध बनाए रखता है; ‘भरोसा’ सम्भव है, पर यहाँ अनावश्यक व्याख्यात्मक विस्तार करेगा।
- issue: οὗ οὐκ ἤκουσαν में सुनने का विषय
  choice: जिसे उन्होंने सुना नहीं
  alternative: जिसके विषय में उन्होंने सुना नहीं
  rationale: यूनानी का अर्थ स्वयं मसीह को सुनना या उनके विषय में सुनना हो सकता है। मुख्य पाठ अधिक पाठ-समीपी रूप रखता है और संदेश-विषयक अर्थ पादटिप्पणी में सुरक्षित है, ताकि वास्तविक अस्पष्टता को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। तीनों आलंकारिक प्रश्नों की क्रमिक तर्क-रचना और ‘विश्वास/सुनना/प्रचार’ की शब्द-शृंखला सुरक्षित है।
