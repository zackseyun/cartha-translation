id: ROM.10.3
reference: Romans 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀγνοοῦντες γὰρ τὴν τοῦ θεοῦ δικαιοσύνην, καὶ τὴν ⸀ἰδίαν ζητοῦντες στῆσαι, τῇ δικαιοσύνῃ τοῦ θεοῦ οὐχ ὑπετάγησαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/003.yaml
  text: For[a], being ignorant of the righteousness of God and seeking to establish their own[b], they did not submit to the righteousness of God.
translation:
  language: hi
  text: क्योंकि वे परमेश्वर की धार्मिकता[a] को न जानते हुए और अपनी ही धार्मिकता स्थापित करने का प्रयत्न करते हुए, परमेश्वर की धार्मिकता के अधीन नहीं हुए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ का अनुवाद ‘न्याय’ भी हो सकता है। यहाँ प्रयुक्त यूनानी शब्द परमेश्वर की धार्मिकता, उसके न्याय, या लोगों को अपने साथ सही संबंध में लाने के उसके धार्मिक मार्ग की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘परमेश्वर की धार्मिकता’ का अर्थ ‘परमेश्वर से मिलने वाली धार्मिकता’ भी समझा जा सकता है। यूनानी वाक्यांश में एक से अधिक अर्थ-छटाएँ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀγνοοῦντες
  choice: न जानते हुए
  rationale: वर्तमान कृदंत का परिस्थितिजन्य और कारणसूचक भाव स्वाभाविक हिन्दी में रखता है; यह पहचान के अभाव को व्यक्त करता है, पर जानबूझकर अस्वीकार करने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संयोजक को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δικαιοσύνην / δικαιοσύνῃ
  choice: धार्मिकता
  rationale: पौलुस के प्रसंग में यह परमेश्वर के न्यायपूर्ण चरित्र, उसकी उद्धारकारी धार्मिकता और मनुष्य को सही ठहराने के उसके मार्ग जैसे परस्पर जुड़े अर्थों को समेट सकता है; ‘धार्मिकता’ इस व्यापकता को ‘न्याय’ की अपेक्षा बेहतर बनाए रखती है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: हिन्दी में स्वाभाविक संबंधसूचक रचना है। यूनानी संबंधकारक में परमेश्वर की अपनी धार्मिकता और परमेश्वर से मिलने वाली धार्मिकता—दोनों की छाया संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἰδίαν
  choice: अपनी ही धार्मिकता
  rationale: यूनानी में ‘धार्मिकता’ पहले पद से अध्याहृत है; हिन्दी में अर्थ स्पष्ट करने के लिए संज्ञा दोहराई गई है और ‘ही’ परमेश्वर की धार्मिकता के साथ निहित विरोध को स्वाभाविक रूप से उभारता है।
- source_word: ζητοῦντες στῆσαι
  choice: स्थापित करने का प्रयत्न करते हुए
  rationale: ‘खड़ा करना/स्थापित करना’ और निरंतर प्रयास के कृदंतीय भाव को पठनीय हिन्दी में व्यक्त करता है, बिना उद्देश्य या सफलता के विषय में अतिरिक्त अर्थ जोड़े।
- source_word: ὑπετάγησαν
  choice: के अधीन नहीं हुए
  rationale: रूपतः निष्क्रिय, पर प्रसंगतः आत्मसमर्पण या अधीनता स्वीकार करने का भाव है। यह हिन्दी अभिव्यक्ति उस अर्थ को सहजता से रखती है और अत्यधिक मनोवैज्ञानिक व्याख्या से बचती है।
theological_decisions:
- issue: τοῦ θεοῦ की धार्मिकता का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर की धार्मिकता’
  alternative: ‘परमेश्वर से मिलने वाली धार्मिकता’ अथवा ‘परमेश्वर का न्याय’
  rationale: यूनानी संबंधकारक स्वामित्व, स्रोत और परमेश्वर की धार्मिक/उद्धारकारी क्रिया की परतें ग्रहण कर सकता है। मुख्य पाठ किसी एक सिद्धान्तगत व्याख्या को निर्णायक नहीं बनाता; पादटिप्पणियाँ वास्तविक अर्थ-विकल्प सुरक्षित रखती हैं।
- issue: ἰδίαν में अध्याहृत संज्ञा
  choice: ‘अपनी ही धार्मिकता’ कहकर स्पष्ट किया गया
  alternative: केवल ‘अपनी ही’
  rationale: यूनानी में δικαιοσύνην अध्याहृत है, किंतु हिन्दी में केवल विशेषण रखने से वाक्य अस्पष्ट और अस्वाभाविक होता। संज्ञा की पुनरावृत्ति मूल विरोध को स्पष्ट करती है, नया धर्मवैज्ञानिक आशय नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। समानांतर कृदंतों को ‘न जानते हुए’ और ‘प्रयत्न करते हुए’ से रखा गया है। ‘धार्मिकता’ पौलुस की शब्दावली की व्यापकता बचाती है; संभावित वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
