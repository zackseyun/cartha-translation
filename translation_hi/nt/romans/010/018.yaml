  text: Ἀλλὰ λέγω, μὴ οὐκ ἤκουσαν; μενοῦνγε· Εἰς πᾶσαν τὴν γῆν ἐξῆλθεν ὁ φθόγγος αὐτῶν, καὶ εἰς τὰ πέρατα τῆς οἰκουμένης τὰ ῥήματα αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/018.yaml
  text: 'But I ask[a], did they not hear? Indeed they did: “Their voice has gone out into all the earth[c][b], and their words to the ends of the inhabited world.”'
translation:
  language: hi
  text: 'पर मैं पूछता हूँ, क्या उन्होंने नहीं सुना? निश्चय ही सुना है:


    “उनकी आवाज़ सारी पृथ्वी पर फैल गई है,


    और उनके वचन आबाद संसार के छोरों तक पहुँच गए हैं।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पौलुस यहाँ भजन 19:4 को उद्धृत करके उसकी भाषा को संदेश के प्रसार पर लागू करता है। ‘आवाज़’ का अनुवाद ‘ध्वनि’ भी हो सकता है, और ‘आबाद संसार’ को केवल ‘संसार’ भी कहा जा सकता है।
    reason: cross_reference_and_lexical_alternatives
lexical_decisions:
- source_word: μὴ οὐκ ἤκουσαν
  choice: क्या उन्होंने नहीं सुना?
  rationale: μή οὐκ वाला प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है; यह हिंदी में स्वाभाविक अलंकारिक प्रश्न के रूप में उसी बल को बनाए रखता है।
- source_word: μενοῦνγε
  choice: निश्चय ही सुना है
  rationale: यह प्रबल सकारात्मक उत्तर है। हिंदी में निहित क्रिया को स्पष्ट करने से उत्तर स्वाभाविक और जोरदार बनता है।
- source_word: φθόγγος
  choice: आवाज़
  rationale: यहाँ उद्धृत काव्यात्मक समानांतरता में श्रव्य अभिव्यक्ति का भाव है; ‘आवाज़’ आधुनिक हिंदी में सहज है और ‘वचन’ के साथ उपयुक्त बैठती है।
- source_word: γῆ
  choice: पृथ्वी
  rationale: सार्वभौमिक काव्यात्मक संदर्भ में यह किसी विशेष देश के बजाय पूरी पृथ्वी को सूचित करता है।
- source_word: ἐξῆλθεν
  choice: फैल गई है
  rationale: शाब्दिक ‘निकल गई’ हिंदी में इस प्रसंग में अस्वाभाविक होगा; ‘फैल गई है’ संदेश या आवाज़ के व्यापक रूप से पहुँचने का भाव और वर्तमान परिणाम दोनों व्यक्त करता है।
- source_word: πέρατα
  choice: छोर
  rationale: ‘संसार की छोर तक’ दूर से दूर सीमा का काव्यात्मक अर्थ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: οἰκουμένης
  choice: बसा हुआ संसार
  rationale: οἰκουμένη में आबाद या बसी हुई दुनिया का विशेष भाव है, जिसे केवल ‘संसार’ कहने पर खोया जा सकता है।
- source_word: ῥήματα
  choice: वचन
  rationale: यह ῥήματα का सीधा और गरिमापूर्ण समतुल्य है तथा पहली पंक्ति की ‘आवाज़’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
theological_decisions:
- issue: भजन के उद्धरण में ‘उनकी’ का संदर्भ
  choice: सर्वनाम को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: इसे स्पष्ट रूप से आकाशों अथवा सुसमाचार के प्रचारकों के संदर्भ में बताना
  rationale: पौलुस भजन 19:4 की भाषा को यहाँ अपने तर्क में लागू करता है। ‘उनकी’ का संदर्भ स्पष्ट कर देना मूलपाठ में मौजूद अंतरपाठीय और व्याख्यात्मक तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिंदी। उद्धरण की दो काव्यात्मक पंक्तियाँ और उनकी समानांतर संरचना सुरक्षित रखी गई है। ‘बसा हुआ संसार’ थोड़ा औपचारिक है, पर यूनानी οἰκουμένη की विशिष्टता बनाए रखता है।
