source:
  edition: SBLGNT
  text: ὅτι ἐὰν ⸀ὁμολογήσῃς ἐν τῷ στόματί ⸀σου κύριον Ἰησοῦν, καὶ πιστεύσῃς ἐν τῇ καρδίᾳ σου ὅτι ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν, σωθήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/009.yaml
  text: because if you confess with your mouth that Jesus is Lord[a], and believe in your heart that God raised him from the dead, you will be saved.
translation:
  language: hi
  text: क्योंकि यदि तुम अपने मुँह से अंगीकार करो कि यीशु प्रभु हैं[a], और अपने हृदय में विश्वास करो कि परमेश्वर ने उन्हें मरे हुओं में से जीवित किया, तो तुम उद्धार पाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु को प्रभु के रूप में अंगीकार करो।” यूनानी पदबंध को इस अधिक संक्षिप्त रूप में भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; प्रसंग में इसका कारणसूचक अर्थ स्वाभाविक है।
- source_word: ὁμολογήσῃς ἐν τῷ στόματί σου
  choice: अपने मुँह से अंगीकार करो
  rationale: यह सार्वजनिक और मौखिक स्वीकार को व्यक्त करता है तथा यूनानी क्रिया के स्वीकारोक्तिपरक बल को बनाए रखता है।
- source_word: κύριον Ἰησοῦν
  choice: कि यीशु प्रभु हैं
  rationale: यह अंगीकार की विषयवस्तु को हिन्दी में स्पष्ट करता है और κύριος को सम्मानित उपाधि ‘प्रभु’ के रूप में रखता है।
- source_word: πιστεύσῃς ἐν τῇ καρδίᾳ σου
  choice: अपने हृदय में विश्वास करो
  rationale: यह केवल बौद्धिक सहमति नहीं, बल्कि भीतरी दृढ़ विश्वास के बाइबलीय भाव को बनाए रखता है।
- source_word: ὁ θεὸς αὐτὸν ἤγειρεν ἐκ νεκρῶν
  choice: परमेश्वर ने उन्हें मरे हुओं में से जिलाया
  rationale: साधारण भूतकाल यूनानी एओरिस्ट के अनुकूल है; ‘मरे हुओं में से जिलाया’ पुनरुत्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σωθήσῃ
  choice: तुम उद्धार पाओगे
  rationale: पौलुस के इस उद्धार-संबंधी प्रसंग में यह भविष्यत् कर्मवाच्य का स्वाभाविक और सटीक हिन्दी रूप है।
theological_decisions:
- issue: κύριος की उपाधि
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ अधिकार और आसपास के शास्त्रीय संकेत—दोनों को बनाए रखता है; ‘स्वामी’ अर्थ को अधिक संकीर्ण कर सकता है।
- issue: κύριον Ἰησοῦν की वाक्यरचना
  choice: कि यीशु प्रभु हैं
  alternative: यीशु को प्रभु मानकर अंगीकार करो
  rationale: मुख्य पाठ अंगीकार की विषयवस्तु स्पष्ट करता है, जबकि वैकल्पिक रूप यूनानी पदबंध को अधिक संक्षेप में व्यक्त करता है।
- issue: σωθήσῃ का उद्धार-संबंधी बल
  choice: उद्धार पाओगे
  alternative: बचाए जाओगे
  rationale: ‘उद्धार’ प्रसंग के धर्मवैज्ञानिक बल को सुरक्षित रखता है, बिना पाठ से परे कोई अतिरिक्त सिद्धान्त जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्वर गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। ‘तुम’ मूल यूनानी के एकवचन दूसरे पुरुष को स्वाभाविक हिन्दी में व्यक्त करता है; यीशु और परमेश्वर के लिए आदरसूचक बहुवचन रूप प्रयुक्त हैं।
