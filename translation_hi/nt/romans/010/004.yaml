  text: τέλος γὰρ νόμου Χριστὸς εἰς δικαιοσύνην παντὶ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/004.yaml
  text: For Messiah is the end of the law for righteousness to everyone who believes[a][b].
translation:
  language: hi
  text: क्योंकि मसीह व्यवस्था का अंत[a] हैं, जिससे हर विश्वास करने वाले को धार्मिकता[b] मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लक्ष्य,” “परिणति,” अथवा “पूर्ति”; “अंत” के लिए प्रयुक्त यूनानी शब्द समाप्ति, लक्ष्य, चरम परिणति या पूर्ति का अर्थ दे सकता है।
    reason: alternative_reading
  - marker: b
    text: या “न्याय”; पौलुस के प्रयोग में इस यूनानी शब्द के अर्थ-क्षेत्र में धार्मिकता और न्याय दोनों शामिल हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τέλος
  choice: अंत
  rationale: ‘अंत’ यूनानी शब्द की समाप्ति और लक्ष्य/परिणति—दोनों संभावित छायाओं को मुख्य पाठ में यथासंभव खुला रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: νόμου
  choice: व्यवस्था
  rationale: पौलुस के इस संदर्भ में यह मूसा की व्यवस्था को ज्ञात वाचा-संबंधी श्रेणी के रूप में सूचित करता है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ शब्द यीशु की इस्राएल की व्यवस्था और वाचा की आशाओं से संबद्ध पदवी के रूप में प्रयुक्त है।
- source_word: εἰς δικαιοσύνην
  choice: जिससे … धार्मिकता मिले
  rationale: यह स्वाभाविक आधुनिक हिन्दी में εἰς की उद्देश्य/परिणाम की दिशात्मक शक्ति व्यक्त करता है, बिना उसे केवल उद्देश्य या केवल परिणाम तक सीमित किए।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में यह प्रचलित और संदर्भानुकूल हिन्दी प्रतिशब्द है; ‘न्याय’ की वैध वैकल्पिक छाया पादटिप्पणी में सुरक्षित है।
- source_word: παντὶ τῷ πιστεύοντι
  choice: हर विश्वास करनेवाले को
  rationale: यह दत्तिवाचक पदबंध और वर्तमान कृदंत का अर्थ स्पष्ट, सहज हिन्दी में व्यक्त करता है तथा किसी संप्रदाय-विशेष की शब्दावली नहीं जोड़ता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क की व्याख्या करनेवाले कारणसूचक संबंध को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: मूसा की व्यवस्था के संबंध में τέλος νόμου का अर्थ
  choice: मुख्य पाठ में ‘व्यवस्था का अंत’, साथ में पादटिप्पणी में ‘लक्ष्य’ और ‘परिणति’
  alternative: ‘व्यवस्था का लक्ष्य’ अथवा ‘व्यवस्था की परिणति’
  rationale: यूनानी पद समाप्ति तथा लक्ष्य/चरम परिणति—दोनों अर्थों की अनुमति देता है। ‘अंत’ और पादटिप्पणी मिलकर इस वास्तविक व्याख्यात्मक तनाव को खुला रखते हैं।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: व्यवस्था और इस्राएल की वाचा-कथा के संदर्भ में पदवीगत अर्थ प्रमुख है।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: मुख्य पाठ में पौलुस-संबंधी प्रचलित धार्मिक अर्थ सुरक्षित रखा गया है, जबकि वैध न्याय-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- issue: εἰς δικαιοσύνην का संबंध
  choice: ‘जिससे … धार्मिकता मिले’ द्वारा उद्देश्य/परिणाम की दिशा व्यक्त करना
  alternative: ‘धार्मिकता के लिए’
  rationale: यूनानी वाक्य अत्यंत संक्षिप्त है। हिन्दी में ‘जिससे’ उद्देश्य और परिणाम दोनों की संभावना रखता है तथा वाक्य को समझने योग्य बनाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यवस्था’ हिन्दी बाइबलीय संदर्भ में सामान्य पाठक के लिए परिचित है। आदरसूचक ‘हैं’ मसीह के संदर्भ में स्वाभाविक हिन्दी प्रयोग को दर्शाता है।
