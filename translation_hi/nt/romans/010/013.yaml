  rationale: यह पिछले कथन के समर्थन या कारण के रूप में इस शास्त्रीय उद्धरण को जोड़ता है।
- source_word: ἐπικαλέσηται
  choice: पुकारेगा
  rationale: ‘नाम पुकारना’ यहाँ प्रभु से प्रार्थनापूर्वक सहायता की विनती करने या उनका आह्वान करने का बाइबिलीय भाव रखता है।
- source_word: τὸ ὄνομα
