- source_word: κυρίου
  choice: प्रभु
  rationale: यूनानी पाठ के κύριος को बिना व्याख्यात्मक विस्तार के व्यक्त करता है; सन्दर्भ में इसका सम्बन्ध यीशु से है।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: भविष्यत् कर्मवाच्य रूप और पौलुस के उद्धार-संबंधी सन्दर्भ को स्वाभाविक, प्रतिष्ठित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: योएल के उद्धरण में ‘प्रभु’ का अभिप्राय
  choice: मुख्य पाठ में केवल ‘प्रभु’ रखा गया है।
  alternative: ‘याहवे’ अथवा ‘प्रभु यीशु’
  rationale: यूनानी पाठ κυρίου कहता है। योएल में मूल अभिप्राय याहवे है, जबकि रोमियों 10 के सन्दर्भ में पौलुस इस वचन को यीशु पर लागू करता है। मुख्य पाठ में किसी एक व्याख्यात्मक विस्तार को जोड़ने के बजाय इस तनाव को टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘हर वह व्यक्ति जो’ सार्वभौमिकता को स्पष्ट करता है; ‘प्रभु का नाम पुकारना’ मूल बाइबिलीय मुहावरे को सहज रूप में बनाए रखता है; ‘उद्धार पाएगा’ धार्मिक सन्दर्भ में परिचित और गरिमापूर्ण है।
