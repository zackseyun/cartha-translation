  choice: हर वह व्यक्ति जो
  rationale: यह सामान्य और सार्वभौमिक अर्थ व्यक्त करता है तथा आधुनिक हिन्दी में स्वाभाविक रहते हुए किसी एक लिंग तक अर्थ को सीमित नहीं करता।
- source_word: γὰρ
