  text: ἡ δὲ ἐκ πίστεως δικαιοσύνη οὕτως λέγει· Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου· Τίς ἀναβήσεται εἰς τὸν οὐρανόν; τοῦτ’ ἔστιν Χριστὸν καταγαγεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/006.yaml
  text: 'But the righteousness from faith speaks in this way: “Do not say in your heart[a], ‘Who will ascend into heaven?’” (that is[c][b], to bring Messiah down).'
translation:
  language: hi
  text: परन्तु विश्वास से मिलने वाली धार्मिकता इस प्रकार कहती है, “अपने मन में यह न कहना, ‘कौन स्वर्ग में चढ़ेगा?’” (अर्थात् मसीह को नीचे लाना)।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में यह परमेश्वर के सामने सही ठहरने और सही अवस्था के अर्थ-संसार को बनाए रखता है; ‘न्याय’ यहाँ कम स्वाभाविक होगा।
- source_word: ἐκ πίστεως
  choice: विश्वास से मिलने वाली
  rationale: ἐκ के स्रोत या आधार के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और व्यवस्था पर आधारित धार्मिकता से विरोध बनाए रखता है।
- source_word: οὕτως λέγει
  choice: इस प्रकार कहती है
  rationale: वर्तमान काल तथा धार्मिकता के मानवीकरण, दोनों को सुरक्षित रखता है।
- source_word: Μὴ εἴπῃς ἐν τῇ καρδίᾳ σου
  choice: अपने मन में यह न कहना
  rationale: καρδία के आन्तरिक विचार और संकल्प के भाव को आधुनिक हिन्दी के मुहावरे ‘मन में’ द्वारा स्वाभाविक रूप से व्यक्त करता है।
- source_word: Τίς ἀναβήσεται εἰς τὸν οὐρανόν;
  choice: कौन स्वर्ग पर चढ़ेगा?
  rationale: आरोहण के भाव और व्यवस्थाविवरण 30:12 की शास्त्रीय प्रतिध्वनि को बनाए रखता है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός उद्धरण की मसीह-संबंधी व्याख्या में उपाधि के रूप में प्रयुक्त है; हिन्दी ‘मसीह’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καταγαγεῖν
  choice: नीचे लाने के लिए
  rationale: दिशात्मक अर्थ को स्पष्ट रखता है और व्याख्यात्मक infinitive के प्रयोजन-सदृश संबंध को हिन्दी में सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘विश्वास से धार्मिकता’ का मानवीकरण
  choice: ‘धार्मिकता ... कहती है’ के रूप में बनाए रखा
  alternative: ‘विश्वास से धार्मिकता के विषय में ऐसा कहा गया है’
  rationale: δικαιοσύνη यूनानी वाक्य में λέγει का कर्ता है; मानवीकरण पौलुस की अलंकारिक शैली और पिछले पद से विरोध का अंग है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: इस शास्त्रीय विवेचन में शब्द नाम-जैसे प्रयोग की अपेक्षा उपाधि के रूप में कार्य करता है।
- issue: व्याख्यात्मक infinitive τοῦτ’ ἔστιν ... καταγαγεῖν
  choice: ‘अर्थात् मसीह को नीचे लाने के लिए’
  alternative: ‘अर्थात् मसीह को नीचे ले आना’
  rationale: ग्रीक में यह पहले प्रश्न की पौलुस-प्रदत्त व्याख्या है; हिन्दी में उद्देश्य-सदृश बल बनाए रखते हुए इसे कोष्ठक में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। व्यवस्थाविवरण की प्रतिध्वनि और पौलुस का मानवीकरण सुरक्षित रखा गया है।
