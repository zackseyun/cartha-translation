id: ROM.10.5
reference: Romans 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ γράφει ⸂ὅτι τὴν δικαιοσύνην τὴν ἐκ ⸀τοῦ νόμου⸃ ὁ ⸀ποιήσας ἄνθρωπος ζήσεται ἐν ⸀αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/005.yaml
  text: 'For Moses writes about the righteousness that is from the law: the man who does these things will live by them[a][b][c].'
translation:
  language: hi
  text: 'क्योंकि मूसा व्यवस्था से प्राप्त धार्मिकता[a] के विषय में लिखते हैं: “जो मनुष्य[b] व्यवस्था का पालन करता है, वह उसी के द्वारा जीवित रहेगा।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ का वैकल्पिक अनुवाद ‘न्याय’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘मनुष्य’ किसी भी ऐसे व्यक्ति का प्रतिनिधित्व करता है जो व्यवस्था का पालन करता है।
    reason: cultural_note
  - marker: c
    text: या, ‘उसी में जीवित रहेगा।’ पौलुस यहाँ लैव्यव्यवस्था 18:5 की प्रतिध्वनि करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिंदी में इस तार्किक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γράφει
  choice: लिखते हैं
  rationale: वर्तमानकालीन उद्धरण-सूत्र को बनाए रखता है और पवित्रशास्त्र में मूसा के लिखे कथन की ओर संकेत करता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: रोमियों में पौलुस के न्यायिक और परमेश्वर-संबंधी अर्थ-विस्तार को बनाए रखता है तथा निकटवर्ती ‘विश्वास से प्राप्त धार्मिकता’ के साथ शब्दगत संबंध सुरक्षित रखता है।
- source_word: τὴν ἐκ τοῦ νόμου
  choice: व्यवस्था से प्राप्त
  rationale: ἐκ के स्रोत अथवा उद्गम के भाव को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: संदर्भ में यह मूसा की व्यवस्था को सूचित करता है; हिंदी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट और प्रतिष्ठित पद है।
- source_word: ὁ ποιήσας
  choice: उसका पालन करता है
  rationale: शाब्दिक ‘उसे करता है’ हिंदी में अस्वाभाविक है। ‘पालन करता है’ आज्ञाओं के अनुसार आचरण करने का आशय व्यक्त करता है, जबकि एक बार किए गए कार्य के बजाय सामान्य सिद्धांत को बनाए रखता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यूनानी का प्रतिनिधिक एकवचन सुरक्षित रहता है और ‘मनुष्य’ हिंदी में स्त्री-पुरुष दोनों को समेट सकने वाला स्वाभाविक जातिवाचक शब्द है।
- source_word: ζήσεται
  choice: जीवित रहेगा
  rationale: भविष्यकाल और लैव्यव्यवस्था 18:5 की जीवन-संबंधी प्रतिध्वनि दोनों को सीधे बनाए रखता है।
- source_word: ἐν αὐτῇ
  choice: उसी के द्वारा
  rationale: स्त्रीलिंग एकवचन सर्वनाम को निकटवर्ती ‘धार्मिकता’ से जोड़ता है और ἐν के साधनार्थक भाव को व्यक्त करता है; स्थानवाची ‘उसी में’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: पौलुस के विरोधात्मक तर्क में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ व्यवस्था से प्राप्त और विश्वास से प्राप्त धार्मिकता के बीच पौलुस के जानबूझकर बनाए गए शब्दगत संबंध को सुरक्षित रखती है; ‘न्याय’ वास्तविक शब्दार्थ-विकल्प के रूप में पादटिप्पणी में दिया गया है।
- issue: ἄνθρωπος का प्रतिनिधिक अर्थ
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ‘मनुष्य’ मूल के एकवचन प्रतिनिधिक रूप को बनाए रखता है, पर हिंदी में केवल पुरुष तक सीमित नहीं है; समावेशी अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- issue: ἐν αὐτῇ का संबंध और अर्थ
  choice: उसी के द्वारा
  alternative: उसी में
  rationale: यूनानी पाठ का सर्वनाम स्त्रीलिंग एकवचन है और ‘धार्मिकता’ से जोड़ा जा सकता है; साथ ही कथन लैव्यव्यवस्था 18:5 की प्रतिध्वनि है, जहाँ आज्ञाओं के पालन द्वारा जीवन का भाव है। मुख्य पाठ साधनार्थक अर्थ देता है, जबकि अधिक रूपगत विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘धार्मिकता’ और ‘जीवित रहेगा’ जैसे स्थापित बाइबलीय पद पौलुस के तर्क और लैव्यव्यवस्था की प्रतिध्वनि को बनाए रखते हैं; ‘उसका पालन करता है’ शाब्दिक किंतु अस्वाभाविक ‘उसे करता है’ के स्थान पर अर्थ-सटीक हिंदी है।
