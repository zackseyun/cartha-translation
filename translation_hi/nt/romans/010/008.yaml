source:
  edition: SBLGNT
  text: ἀλλὰ τί λέγει; Ἐγγύς σου τὸ ῥῆμά ἐστιν, ἐν τῷ στόματί σου καὶ ἐν τῇ καρδίᾳ σου, τοῦτ’ ἔστιν τὸ ῥῆμα τῆς πίστεως ὃ κηρύσσομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/008.yaml
  text: But what does it say? “The word is near you[a], in your mouth and in your heart” — that is[b], the word of faith that we proclaim.
translation:
  language: hi
  text: पर वह क्या कहती है? “वचन तुम्हारे निकट है, तुम्हारे मुँह में और तुम्हारे हृदय में।”[a] अर्थात्, वह विश्वास का वचन है जिसका हम प्रचार करते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यवस्थाविवरण 30:14 की प्रतिध्वनि है; पौलुस उसके शब्दों को प्रचार किए जाने वाले विश्वास के वचन पर लागू करता है।
    reason: cross_reference
  - marker: b
    text: ‘विश्वास का वचन’ का अनुवाद ‘विश्वास का संदेश’ भी हो सकता है; यहाँ ‘विश्वास’ के लिए प्रयुक्त यूनानी शब्द कुछ प्रसंगों में ‘भरोसा’ या ‘विश्वासयोग्यता’ भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले विचार के साथ विरोध दिखाता है और आधुनिक हिन्दी में सहज संक्रमण है।
- source_word: τί λέγει
  choice: वह क्या कहता है?
  rationale: यूनानी में कर्ता स्पष्ट रूप से नहीं दिया गया; ‘वह’ उद्धृत वचन/धर्मशास्त्र की ओर संकेत करते हुए मूल की संक्षिप्तता बनाए रखता है।
- source_word: Ἐγγύς σου
  choice: तुम्हारे निकट है
  rationale: स्थानिक और रूपक दोनों अर्थों को सुरक्षित रखते हुए व्यवस्थाविवरण के उद्धरण की गरिमा बनाए रखता है।
- source_word: τὸ ῥῆμα
  choice: वचन
  rationale: यह पहले और बाद के दोनों प्रयोगों में एक ही शब्द रखकर पौलुस की व्याख्यात्मक कड़ी सुरक्षित करता है; ‘संदेश’ अधिक व्याख्यात्मक विकल्प है।
- source_word: ἐν τῷ στόματί σου
  choice: तुम्हारे मुँह में
  rationale: मूल की शारीरिक बिंबात्मकता का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν τῇ καρδίᾳ σου
  choice: तुम्हारे हृदय में
  rationale: καρδία का मानक बाइबलीय रूप, जो भीतरी विचार और निष्ठा के आयाम को खुला रखता है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह उद्धरण के बाद पौलुस की व्याख्या को संक्षिप्त और स्पष्ट रूप से प्रस्तुत करता है।
- source_word: τὸ ῥῆμα τῆς πίστεως
  choice: विश्वास का वह वचन
  rationale: ῥῆμα के पहले प्रयोग से शब्दगत संबंध बनाए रखता है और संबंधकारक की संभावित अर्थ-छायाओं को अनावश्यक रूप से सीमित नहीं करता।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस प्रसंग में πίστις का स्वाभाविक पौलुसी अर्थ है; ‘भरोसा’ संभव है, पर मुख्य पाठ में ‘विश्वास’ अधिक स्थापित और सटीक है।
- source_word: ὃ κηρύσσομεν
  choice: जिसका हम प्रचार करते हैं
  rationale: κηρύσσω के सार्वजनिक उद्घोषणा के भाव को साधारण आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: τὸ ῥῆμα τῆς πίστεως में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: ‘विश्वास’ मानक अर्थ को सुरक्षित रखता है, जबकि संबंधकारक यह खुला छोड़ता है कि वचन विश्वास से संबंधित, विश्वास को बुलाने वाला, या विश्वास द्वारा ग्रहण किया जाने वाला है।
- issue: व्यवस्थाविवरण 30:14 के उद्धरण का पौलुसी अनुप्रयोग
  choice: मुख्य पाठ में उद्धरण और उसकी व्याख्या को अलग वाक्य-खंडों में रखा गया
  alternative: ‘सुसमाचार का संदेश’ कहकर अर्थ को स्पष्ट करना
  rationale: मूल पाठ स्वयं पहले ‘वचन’ उद्धृत करता है और फिर उसे ‘विश्वास का वचन’ बताता है; ‘सुसमाचार’ जोड़ना उचित व्याख्या होते हुए भी मूल में प्रत्यक्ष नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। ‘वचन’ को दोनों स्थानों पर रखकर यूनानी की पुनरावृत्ति और पौलुस की व्याख्यात्मक कड़ी सुरक्षित की गई है।
