lexical_decisions:
- source_word: ἄρα
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्ष निकालने वाला शब्द है; ‘इसलिए’ उस तार्किक संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस संदर्भ में यह सुनाए गए सुसमाचार के प्रति मनुष्य के प्रत्युत्तर को दर्शाता है; ‘विश्वास’ इसका स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: ἐξ ἀκοῆς
  choice: सुनने से
  rationale: ἐκ स्रोत या उत्पत्ति बताता है और ἀκοή यहाँ सुनने को सूचित करता है; ‘सुनने से’ संक्षिप्त और स्वाभाविक है।
- source_word: ἀκοή
  choice: सुनना
  rationale: शब्द सुनने की क्रिया या सुनी हुई बात दोनों को सूचित कर सकता है। यहाँ निकट संदर्भ में सुनने की क्रिया उपयुक्त है, जबकि मूल की पुनरावृत्ति भी बनी रहती है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि अगले कथन को हल्के ढंग से जोड़ता है।
- source_word: διὰ
  choice: के द्वारा
  rationale: संबंधकारक के साथ διά माध्यम को सूचित करता है; ‘के द्वारा’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: ῥήματος
  choice: वचन
  rationale: ῥῆμα प्रायः बोले गए शब्द या कथन को सूचित करता है। ‘वचन’ अर्थ, गरिमा और बाइबलीय परिचितता को बनाए रखता है।
- source_word: Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उपाधि के रूप में है, इसलिए ‘मसीह’ उपयुक्त है। संबंधकारक का अपेक्षाकृत औपचारिक रूप ‘मसीह के वचन’ मूल की वास्तविक अर्थगत अस्पष्टता को मुख्य पाठ में बनाए रखता है।
theological_decisions:
- issue: यहाँ पौलुस के प्रयोग में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: रोमियों 10:14–16 का निकट संदर्भ घोषित संदेश के प्रति मनुष्य के प्रत्युत्तर पर केंद्रित है; इसलिए ‘विश्वास’ सबसे उपयुक्त है और किसी अधिक विशिष्ट अर्थ को अनावश्यक रूप से नहीं थोपता।
- issue: ῥήματος Χριστοῦ में Χριστοῦ संबंधकारक का अर्थ
  choice: मसीह का वचन
  alternative: मसीह के विषय में वचन; मसीह से संबंधित संदेश
  rationale: यूनानी संबंधकारक को मसीह से आने वाले/मसीह के वचन के रूप में अथवा मसीह के विषय में संदेश के रूप में समझा जा सकता है। मुख्य पाठ में अपेक्षाकृत औपचारिक रूप रखा गया है और व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘विश्वास,’ ‘मसीह’ और ‘वचन’ सामान्य पाठकों के लिए परिचित बाइबलीय शब्द हैं। यूनानी की क्रियारहित, समानांतर रचना को हिन्दी में एक साझा ‘होता है’ के साथ स्वाभाविक बनाया गया है।
