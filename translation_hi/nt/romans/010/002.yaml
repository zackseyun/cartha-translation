  text: क्योंकि मैं उनके विषय में गवाही देता हूँ कि उनमें परमेश्वर के लिए उत्साह[a] तो है, पर वह ज्ञान के अनुरूप नहीं है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनमें परमेश्वर का उत्साह है”; यूनानी सम्बन्धकारक का यह अधिक शाब्दिक अनुवाद संभव है, पर यहाँ सम्भवतः आशय परमेश्वर की ओर निर्देशित उत्साह से है।
    reason: lexical_alternative
  - marker: b
    text: या “वह पूर्ण ज्ञान के साथ नहीं है” अथवा “वह ज्ञान पर आधारित नहीं है।”
