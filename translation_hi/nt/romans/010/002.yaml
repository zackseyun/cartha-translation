- source_word: αὐτοῖς
  choice: उनके विषय में
  rationale: यहाँ संप्रदान कारक उन लोगों को सूचित करता है जिनके विषय में गवाही दी जा रही है, न कि गवाही पाने वालों को।
- source_word: ζῆλον θεοῦ
  choice: परमेश्वर के लिए उत्साह
  rationale: सम्बन्धकारक को प्रसंगानुसार वस्तुगत माना गया है—उत्साह परमेश्वर की ओर निर्देशित है; फिर भी वैकल्पिक व्याकरणिक संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: ἔχουσιν
  choice: उनमें ... है
  rationale: हिन्दी में किसी गुण या भाव के होने की स्वाभाविक अभिव्यक्ति है।
- source_word: ἀλλ’
  choice: पर ... तो ... है
  rationale: ‘तो ... पर’ की रचना उनके उत्साह की स्वीकृति और उसके ज्ञानगत अभाव के बीच तीखा विरोध व्यक्त करती है।
- source_word: οὐ κατ’ ἐπίγνωσιν
  choice: वह सही ज्ञान के अनुसार नहीं है
  rationale: κατά की अनुरूपता/आधार की धारणा बनाए रखते हुए ἐπίγνωσις को ऐसा ज्ञान समझाता है जो उचित या यथार्थ हो; ‘पूर्ण ज्ञान’ की संभावित छाया पाद-टिप्पणी में रखी गई है।
theological_decisions:
- issue: इस्राएल के उत्साह का स्वरूप
  choice: उनका उत्साह परमेश्वर की ओर निर्देशित है, पर सही ज्ञान के अनुरूप नहीं
  alternative: उनमें परमेश्वर का अपना उत्साह है; अथवा उसके लक्ष्य को निर्दिष्ट किए बिना केवल धार्मिक उत्साह है
  rationale: 'प्रसंग में ζῆλον θεοῦ को वस्तुगत सम्बन्धकारक समझना अधिक संभावित है। यह कथन की वास्तविक धर्मवैज्ञानिक खींचतान बनाए रखता है: निष्ठा स्वीकार की जाती है, किंतु उसकी ज्ञानगत शुद्धता नहीं।'
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘सही ज्ञान’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पाद-टिप्पणी मूल पदबंध की ‘पूर्ण ज्ञान’ और ‘ज्ञान पर आधारित’ संभावनाएँ सुरक्षित रखती है।
