lexical_decisions:
- source_word: μαρτυρῶ
  choice: मैं ... गवाही देता हूँ
  rationale: वर्तमानकाल के प्रत्यक्ष कथन और प्रमाणात्मक भाव को स्वाभाविक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: γὰρ
