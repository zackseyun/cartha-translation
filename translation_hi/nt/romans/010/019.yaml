source:
  edition: SBLGNT
  text: ἀλλὰ λέγω, μὴ ⸂Ἰσραὴλ οὐκ ἔγνω⸃; πρῶτος Μωϋσῆς λέγει· Ἐγὼ παραζηλώσω ὑμᾶς ἐπ’ οὐκ ἔθνει, ἐπ’ ἔθνει ἀσυνέτῳ παροργιῶ ὑμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/019.yaml
  text: But I ask[a], did Israel not know? First Moses says, “I will make you jealous by what is not a nation[b]; by a nation without understanding I will provoke you to anger.”
translation:
  language: hi
  text: परन्तु मैं पूछता हूँ, क्या इस्राएल नहीं जानता था?[a] सबसे पहले मूसा कहता है, “जो एक राष्ट्र नहीं है, उसके द्वारा मैं तुम्हें जलन दिलाऊँगा; एक नासमझ राष्ट्र के द्वारा मैं तुम्हें क्रोधित करूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या इस्राएल नहीं समझता था?” यूनानी क्रिया का अर्थ “जानना” या “समझना” हो सकता है; यहाँ सुनी हुई बात का आशय ग्रहण करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: व्यवस्थाविवरण 32:21 से उद्धरण। “जो एक राष्ट्र नहीं है” ऐसे लोगों की ओर संकेत कर सकता है जिन्हें वास्तविक राष्ट्र नहीं माना जाता था—अर्थात गैर-यहूदी।
    reason: cross_reference
lexical_decisions:
- source_word: μὴ Ἰσραὴλ οὐκ ἔγνω
  choice: क्या इस्राएल नहीं जानता था?
  rationale: ἔγνω का मूल अर्थ ‘जानना’ है। प्रश्न की अलंकारिक धार और यूनानी की वास्तविक अस्पष्टता बनाए रखने के लिए मुख्य पाठ में ‘जानता था’ रखा गया; संदर्भगत अर्थ ‘समझता था’ पादटिप्पणी में दिया गया है।
- source_word: πρῶτος
  choice: सबसे पहले
  rationale: यह मूसा को आगे आने वाली शास्त्रीय गवाहियों की शृंखला में प्रथम गवाह के रूप में प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: इस नाम का प्रचलित मानक हिन्दी रूप।
- source_word: παραζηλώσω
  choice: मैं तुम्हें जलन दिलाऊँगा
  rationale: क्रिया का कारणात्मक भाव, अर्थात किसी को ईर्ष्या या जलन के लिए उकसाना, सरल और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἐπ’ οὐκ ἔθνει
  choice: जो एक राष्ट्र नहीं है, उसके द्वारा
  rationale: व्यवस्थाविवरण 32:21 की असामान्य और तीखी अभिव्यक्ति को किसी निश्चित समुदाय की व्याख्यात्मक पहचान में बदले बिना बनाए रखता है।
- source_word: ἔθνει ἀσυνέτῳ
  choice: एक नासमझ राष्ट्र के द्वारा
  rationale: ἀσύνετος समझ या विवेक के अभाव को व्यक्त करता है; ‘नासमझ’ ‘मूर्ख’ की अपेक्षा अधिक निकट है और हिन्दी में स्वाभाविक भी है।
- source_word: παροργιῶ
  choice: मैं तुम्हें क्रोध दिलाऊँगा
  rationale: यह कारणात्मक अर्थ को बनाए रखता है और पहले खंड के ‘जलन दिलाऊँगा’ के साथ समानांतर संरचना बनाता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: यूनानी में द्वितीय पुरुष बहुवचन है; उद्धरण में सामूहिक इस्राएल को संबोधित करने के लिए हिन्दी ‘तुम्हें’ उपयुक्त है।
theological_decisions:
- issue: मूसा के उद्धरण में ‘जो एक राष्ट्र नहीं है’ और ‘नासमझ राष्ट्र’ का अभिप्राय
  choice: मुख्य पाठ में उद्धरण की भाषा को बनाए रखकर उसके अभिप्राय को स्पष्ट रूप से किसी एक समूह से नहीं जोड़ा गया।
  alternative: इसे सीधे गैर-यहूदियों अथवा इस्राएल की दृष्टि में वास्तविक राष्ट्र न माने जाने वाले लोगों के रूप में पहचानना।
  rationale: पौलुस व्यवस्थाविवरण 32:21 का उद्धरण देता है, पर मुख्य पाठ में उस समूह का स्पष्ट नाम नहीं रखता। अनुवाद वही धर्मवैचारिक तनाव सुरक्षित रखता है; संभावित संकेत केवल पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’, ‘इस्राएल’ और ‘मूसा’ बाइबलीय हिन्दी के परिचित रूप हैं; असामान्य उद्धरणात्मक वाक्यांश को व्याख्यात्मक रूप से समतल नहीं किया गया।
