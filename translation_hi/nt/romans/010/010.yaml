id: ROM.10.10
reference: Romans 10:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καρδίᾳ γὰρ πιστεύεται εἰς δικαιοσύνην, στόματι δὲ ὁμολογεῖται εἰς σωτηρίαν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/010.yaml
  text: For with the heart one believes unto righteousness[a], and with the mouth one confesses unto salvation.
translation:
  language: hi
  text: क्योंकि धार्मिकता[a] के लिए हृदय से विश्वास किया जाता है, और उद्धार के लिए मुँह से अंगीकार किया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।” यूनानी शब्द δικαιοσύνη का अनुवाद “न्याय” भी हो सकता है, यद्यपि पौलुस के लेखों में सामान्यतः “धार्मिकता” अधिक उपयुक्त है।
    reason: δικαιοσύνη के वास्तविक वैकल्पिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: καρδίᾳ
  choice: हृदय से
  rationale: करण कारक के भाव को व्यक्त करते हुए यह भी स्पष्ट करता है कि विश्वास मनुष्य के भीतरी व्यक्तित्व से जुड़ा है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन की व्याख्या आरम्भ करने वाले कारणसूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πιστεύεται
  choice: विश्वास किया जाता है
  rationale: यूनानी के सामान्य, व्यक्तिनिरपेक्ष प्रयोग को बनाए रखता है और किसी विशेष कर्ता को नहीं जोड़ता।
- source_word: εἰς δικαιοσύνην
  choice: धार्मिकता के लिए
  rationale: εἰς के लक्ष्य अथवा परिणाम की ओर संकेत को संक्षिप्त रूप में रखता है, बिना इस संबंध को अधिक स्पष्ट करके किसी एक धर्मवैज्ञानिक व्याख्या में बाँधे।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: पौलुस के संदर्भ में यह प्रचलित और व्यापक हिन्दी प्रतिशब्द है; यह न्यायिक और नैतिक दोनों अर्थछायाओं के लिए स्थान छोड़ता है।
- source_word: στόματι
  choice: मुँह से
  rationale: καρδίᾳ के समानांतर करण भाव को व्यक्त करता है और भीतरी विश्वास तथा बाहरी अंगीकार की संरचना बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ दोनों कथनों को विरोधी नहीं, बल्कि परस्पर पूरक रूप में जोड़ना अधिक स्वाभाविक है।
- source_word: ὁμολογεῖται
  choice: अंगीकार किया जाता है
  rationale: पद 9 के निकट संदर्भ में यीशु को प्रभु मानकर मौखिक रूप से स्वीकार करने का भाव व्यक्त करता है तथा यूनानी के सामान्य, व्यक्तिनिरपेक्ष रूप को बनाए रखता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार के लिए
  rationale: पहले εἰς-वाक्यांश के साथ समानांतरता रखते हुए लक्ष्य अथवा परिणाम का संकेत देता है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: पौलुस के इस संदर्भ में σωτηρία का मानक हिन्दी अनुवाद है और इसकी वर्तमान तथा भावी अर्थछायाओं को समेट सकता है।
theological_decisions:
- issue: विश्वास और अंगीकार का धार्मिकता तथा उद्धार से संबंध
  choice: 'दोनों समानांतर कथनों को सीधे रूप में रखा गया है: हृदय से विश्वास धार्मिकता के लिए और मुँह से अंगीकार उद्धार के लिए है।'
  alternative: अंगीकार को केवल उद्धार का प्रमाण बताना, अथवा उसे उद्धार अर्जित करने वाला अतिरिक्त कर्म बताना।
  rationale: यूनानी पाठ दोनों खंडों में εἰς के समानांतर प्रयोग से संबंध व्यक्त करता है, पर उद्धार-क्रम की यांत्रिक व्याख्या नहीं देता। अतः अनुवाद उस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। समानांतर निष्क्रिय रचना मूल यूनानी की सूक्तिपरक, सार्वभौमिक शैली को बनाए रखती है।
