reference: Romans 10:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πῶς δὲ ⸀κηρύξωσιν ἐὰν μὴ ἀποσταλῶσιν; ⸀καθὼς γέγραπται· Ὡς ὡραῖοι οἱ πόδες τῶν ⸀εὐαγγελιζομένων ⸀τὰ ἀγαθά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/015.yaml
  text: And how are they to proclaim unless they are sent? As it is written[b][a], “How beautiful are the feet of those who bring good news of good things!”
translation:
  language: hi
  text: और वे घोषणा कैसे करेंगे, जब तक वे भेजे न जाएँ? जैसा लिखा है, “जो अच्छी बातों का शुभ समाचार सुनाते हैं, उनके पाँव कितने सुन्दर हैं!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुन्दर” का अर्थ यहाँ “कितने स्वागतयोग्य” या “कितने ठीक समय पर आनेवाले” भी हो सकता है। यूनानी विशेषण सन्देशवाहक के मनभावन और उपयुक्त आगमन की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κηρύξωσιν
  choice: घोषणा करेंगे
  rationale: यह सार्वजनिक रूप से संदेश सुनाने का व्यापक अर्थ रखता है और इसे केवल औपचारिक उपदेश तक सीमित नहीं करता।
- source_word: ἀποσταλῶσιν
  choice: उन्हें भेजा न जाए
  rationale: कर्मवाच्य रूप किसी दूसरे के द्वारा भेजे जाने को व्यक्त करता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: पवित्रशास्त्र के उद्धरण का परिचित और गरिमापूर्ण परिचय है।
- source_word: ὡραῖοι
  choice: सुन्दर
  rationale: मुख्य अर्थ सौन्दर्य या मनोहरता है, जबकि स्वागतयोग्य अथवा ठीक समय पर आगमन की सम्भावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: πόδες
  choice: पाँव
  rationale: उद्धरण में संदेशवाहकों के आगमन का सजीव शारीरिक बिम्ब बनाए रखता है।
- source_word: εὐαγγελιζομένων
  choice: शुभ समाचार लाते हैं
  rationale: सन्देशवाहक के बिम्ब के अनुरूप अच्छी खबर पहुँचाने का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है और बाद की संस्थागत शब्दावली नहीं जोड़ता।
- source_word: τὰ ἀγαθά
  choice: अच्छी बातों का
  rationale: यूनानी के ‘अच्छी वस्तुएँ/बातें’ को ‘शुभ समाचार’ में पूरी तरह विलीन किए बिना हिन्दी में अर्थपूर्ण ढंग से रखता है।
theological_decisions:
- issue: सन्देशवाहक के उद्धरण और सुसमाचार की घोषणा का सम्बन्ध
  choice: भेजे गए सन्देशवाहकों की व्यापक छवि बनाए रखना
  alternative: इसे केवल औपचारिक प्रचारक पद या कलीसियाई उपदेश के रूप में व्यक्त करना
  rationale: पौलुस का तर्क भेजे जाने और घोषणा करने से सम्बन्धित है, पर उद्धरण शुभ समाचार सुनाने वालों का अभिनन्दन करता है; इसलिए किसी विशिष्ट कलीसियाई पद को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट। प्रश्न की तर्क-श्रृंखला और यशायाह से लिए गए पाँवों के बिम्ब को बनाए रखा गया है।
