revisions:
- from: और यदि उन्हें भेजा न जाए, तो वे घोषणा कैसे करेंगे? जैसा लिखा है, “उनके पाँव कितने सुन्दर हैं, जो अच्छी बातों का शुभ समाचार लाते हैं!”[a]
  to: और वे घोषणा कैसे करेंगे, जब तक वे भेजे न जाएँ? जैसा लिखा है, “जो अच्छी बातों का शुभ समाचार सुनाते हैं, उनके पाँव कितने सुन्दर हैं!”[a]
  rationale: The revision makes only safe idiomatic adjustments. It keeps the passive dependence on being sent, the broad public sense of proclamation, the biblical citation register, and the Isaiah-derived foot imagery. The wording continues to distinguish the act of announcing good news from the ‘good things’ announced, without imposing a formal preaching office or a doctrinal interpretation.
