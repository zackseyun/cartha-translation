review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two rhetorical questions' sending/proclamation logic, the Scripture-citation formula, and the literal image of the messengers' feet. However, the quotation's final wording, “अच्छी बातों का शुभ समाचार लाते हैं,” is syntactically strained in Hindi. A modest recasting retains the Greek distinction between εὐαγγελιζομένων (announce/bring good news) and τὰ ἀγαθά (good things).
  naturalness: “जब तक वे भेजे न जाएँ” is a more idiomatic Hindi rendering of ἐὰν μὴ ἀποσταλῶσιν in this rhetorical question. “जो अच्छी बातों का शुभ समाचार सुनाते हैं” is clearer and more natural than the draft's construction, while retaining the intentionally close pairing of good news and good things.
  terminology: “घोषणा करेंगे,” “भेजे,” “जैसा लिखा है,” “सुन्दर,” and “पाँव” are appropriate, nonsectarian choices. The revision does not introduce ecclesiastical-office language or collapse “good things” into a second generic term for gospel.
  issues:
  - severity: medium
    issue: The phrase “अच्छी बातों का शुभ समाचार लाते हैं” is awkward Hindi and obscures the relation between ‘bringing good news’ and ‘good things.’
    rationale: The Greek intentionally uses εὐαγγελιζομένων with τὰ ἀγαθά. Recasting it as “जो अच्छी बातों का शुभ समाचार सुनाते हैं” preserves both elements in a comprehensible Hindi expression.
  - severity: low
    issue: “यदि उन्हें भेजा न जाए” is less smooth than the idiomatic conditional expression “जब तक वे भेजे न जाएँ.”
    rationale: Both are faithful to ἐὰν μὴ ἀποσταλῶσιν, but the revised form better fits a rhetorical Hindi question.
  revised_text: और वे घोषणा कैसे करेंगे, जब तक वे भेजे न जाएँ? जैसा लिखा है, “जो अच्छी बातों का शुभ समाचार सुनाते हैं, उनके पाँव कितने सुन्दर हैं!”[a]
