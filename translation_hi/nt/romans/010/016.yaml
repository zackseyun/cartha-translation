lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: पिछले तर्क के साथ स्पष्ट विरोध दर्शाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐ πάντες
  choice: सबने ... नहीं
  rationale: यूनानी के आंशिक निषेध को सुरक्षित रखता है; इसका अर्थ यह नहीं कि किसी ने भी स्वीकार नहीं किया।
- source_word: ὑπήκουσαν
  choice: पालन नहीं किया
  rationale: क्रिया केवल सुनने नहीं, बल्कि आज्ञापूर्ण प्रत्युत्तर देने का भाव रखती है।
- source_word: τῷ εὐαγγελίῳ
  choice: शुभ समाचार
  rationale: εὐαγγέλιον का पारदर्शी अर्थ देता है; पारम्परिक विकल्प ‘सुसमाचार’ पादटिप्पणी में रखा गया है।
- source_word: Ἠσαΐας
  choice: यशायाह
  rationale: भविष्यद्वक्ता के नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पहले कथन के समर्थन में दिए गए शास्त्रीय प्रमाण का व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यूनानी वर्तमान काल को बनाए रखता है और हिन्दी में आदरसूचक एकवचन के अनुरूप है।
- source_word: Κύριε
  choice: हे प्रभु
  rationale: सम्बोधन को स्वाभाविक, स्पष्ट और श्रद्धापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: उद्धरण के आलंकारिक प्रश्न में यूनानी अओरिस्ट का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: τῇ ἀκοῇ ἡμῶν
  choice: हमारे संदेश
  rationale: ἀκοή यहाँ सुनी या घोषित की गई बात, अर्थात संदेश/वृत्तान्त, को सूचित कर सकता है; ‘संदेश’ सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: ὑπήκουσαν τῷ εὐαγγελίῳ में शुभ समाचार के प्रति अपेक्षित प्रत्युत्तर
  choice: ‘शुभ समाचार का पालन नहीं किया’
  alternative: ‘शुभ समाचार को नहीं सुना/नहीं माना’
  rationale: ‘पालन’ आज्ञाकारिता की शक्ति को बनाए रखता है और इसे केवल सुनने तक सीमित नहीं करता, जबकि उद्धार की प्रक्रिया पर कोई साम्प्रदायिक व्याख्या नहीं थोपता।
- issue: यशायाह के उद्धरण में ἀκοή का अर्थ
  choice: ‘संदेश’
  alternative: ‘वृत्तान्त’ अथवा शाब्दिक ‘सुनना’
  rationale: सन्दर्भ में शब्द सुनी गई घोषणा की विषयवस्तु को दर्शाता है। वास्तविक शब्दार्थगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘शुभ समाचार’ पारदर्शी मुख्य पाठ है, जबकि परिचित बाइबलीय ‘सुसमाचार’ पादटिप्पणी में दिया गया है। उद्धरण में ‘हे प्रभु’ स्वाभाविक सम्बोधन है।
