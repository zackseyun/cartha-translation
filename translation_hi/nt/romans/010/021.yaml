  naturalness: “दिन भर मैंने … अपने हाथ फैलाए” is clear, modern, and idiomatic Hindi. “विरोध करते हैं” is more natural than “विरोध में बोलते हैं,” while the latter’s more specifically verbal nuance remains available in the footnote.
  terminology: “आज्ञा नहीं मानते” suitably conveys the volitional disobedience of ἀπειθοῦντα without excluding its belief-related sense. “विरोध करते हैं” faithfully conveys active opposition in ἀντιλέγοντα; the footnote supplies “विरुद्ध बोलते हैं” and related alternatives.
