source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν Ἰσραὴλ λέγει· Ὅλην τὴν ἡμέραν ἐξεπέτασα τὰς χεῖράς μου πρὸς λαὸν ἀπειθοῦντα καὶ ἀντιλέγοντα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/021.yaml
  text: But concerning Israel he says[c][b][a], “All day long I have stretched out my hands to a disobedient and opposing people.”
translation:
  language: hi
  text: परन्तु इस्राएल के विषय में वह कहता है[a], “दिन भर मैंने उन लोगों की ओर अपने हाथ फैलाए, जो आज्ञा नहीं मानते[b] और विरोध करते हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परन्तु इस्राएल से वह कहता है।” यूनानी वाक्यरचना का अर्थ इस्राएल से कहा गया कथन या इस्राएल के विषय में कहा गया कथन—दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “आज्ञा नहीं मानते” का अर्थ “विश्वास नहीं करते” या “समझाए जाने से इनकार करते हैं” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “विरोध में बोलते हैं,” “खंडन करते हैं,” अथवा “विरुद्ध बोलते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν Ἰσραὴλ
  choice: परन्तु इस्राएल के विषय में
  rationale: πρός के इस प्रयोग को कथन के विषय या संदर्भ के रूप में प्रस्तुत किया गया है। प्रत्यक्ष संबोधन, ‘इस्राएल से,’ भी व्याकरणतः सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: λέγει
  choice: वह कहता है
  rationale: यूनानी वर्तमान काल और पौलुस की सजीव उद्धरण-शैली को बनाए रखा गया है। कर्ता प्रसंग में परमेश्वर है, पर यूनानी पाठ में यहाँ उसका नाम स्पष्ट रूप से नहीं दिया गया।
- source_word: Ὅλην τὴν ἡμέραν
  choice: दिन भर
  rationale: यह समय की पूरी अवधि व्यक्त करने वाला स्वाभाविक और संक्षिप्त आधुनिक हिन्दी रूप है।
- source_word: ἐξεπέτασα τὰς χεῖράς μου
  choice: मैं अपने हाथ ... फैलाए रहा
  rationale: ‘हाथ फैलाने’ का मानवीय बिंब ज्यों का त्यों रखा गया है; ‘दिन भर’ के साथ ‘फैलाए रहा’ लगातार किए गए आग्रह की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς λαὸν
  choice: ऐसे लोगों की ओर
  rationale: πρός संकेत करता है कि फैले हुए हाथ उन लोगों की दिशा में हैं। λαός की सामूहिक धारणा को सहज हिन्दी में ‘लोगों’ से व्यक्त किया गया है।
- source_word: ἀπειθοῦντα
  choice: जो आज्ञा नहीं मानते
  rationale: यह ἀπειθέω के अवज्ञा और न माने जाने के नैतिक-इच्छात्मक भाव को स्पष्ट, सामान्य हिन्दी में व्यक्त करता है; ‘विश्वास न करना’ या ‘समझाए जाने से इनकार करना’ इसकी सम्भव अर्थ-छायाएँ हैं।
- source_word: ἀντιλέγοντα
  choice: विरोध में बोलते हैं
  rationale: यह क्रिया के वाचिक और सक्रिय दोनों पक्षों—विरोध करना तथा विरुद्ध बोलना—को बनाए रखता है।
theological_decisions:
- issue: इस्राएल की प्रतिक्रिया का वर्णन
  choice: ‘जो आज्ञा नहीं मानते और विरोध में बोलते हैं’
  alternative: ‘जो विश्वास नहीं करते और विरोध करते हैं’
  rationale: अनुवाद परमेश्वर की लगातार पहल और लोगों की अवज्ञापूर्ण, सक्रिय प्रतिक्रिया—दोनों को बनाए रखता है, पर इस पद से इस्राएल की व्यापक स्थिति के विषय में कोई अतिरिक्त सैद्धान्तिक निष्कर्ष नहीं जोड़ता।
- issue: उद्धरण में वक्ता की पहचान
  choice: ‘वह कहता है’
  alternative: ‘परमेश्वर कहता है’
  rationale: प्रसंग वक्ता को परमेश्वर के रूप में समझने देता है, किन्तु यूनानी पद में कर्ता का नाम स्पष्ट नहीं है; इसलिए मूल की अंतर्निहितता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हाथ फैलाए रहा’ मूल के सजीव बिंब और पूरे दिन जारी आग्रह को सुरक्षित रखता है; तकनीकी या सम्प्रदाय-विशेष शब्दावली से बचा गया है।
