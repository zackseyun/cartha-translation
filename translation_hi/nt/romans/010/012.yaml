id: ROM.10.12
reference: Romans 10:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν διαστολὴ Ἰουδαίου τε καὶ Ἕλληνος, ὁ γὰρ αὐτὸς κύριος πάντων, πλουτῶν εἰς πάντας τοὺς ἐπικαλουμένους αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/012.yaml
  text: For there is no distinction between Jew and Greek[a], for the same Lord is Lord of all[b], being rich toward all who call on him.
translation:
  language: hi
  text: क्योंकि यहूदी और यूनानी[a] के बीच कोई भेद नहीं है, क्योंकि वही प्रभु सबका प्रभु है[b] और उसे पुकारने वाले सभी लोगों के प्रति भरपूर उदार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में ‘यूनानी’ है। यहाँ ‘यहूदी और यूनानी’ की जोड़ी यहूदी और गैर-यहूदी के बीच के व्यापक अंतर को दर्शाती है। कुछ अनुवाद ‘गैर-यहूदी’ लिखते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, ‘वही सबके ऊपर प्रभु है।’
    reason: alternative_reading
lexical_decisions:
- source_word: διαστολή
  choice: भेद
  rationale: यह शब्द यहाँ यहूदी और यूनानी के बीच किए जाने वाले अंतर को दर्शाता है। ‘भेद’ सहज और स्पष्ट है तथा मूल्य या दर्जे की असमानता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: Ἰουδαίου ... Ἕλληνος
  choice: यहूदी ... यूनानी
  rationale: मूल पाठ में व्यापक शब्द ‘गैर-यहूदी’ नहीं, बल्कि ‘यूनानी’ है। मुख्य पाठ में इसे बनाए रखा गया है, जबकि पादटिप्पणी बताती है कि यहाँ यह जोड़ी यहूदी और गैर-यहूदी के व्यापक विरोध को व्यक्त करती है।
- source_word: ὁ ... αὐτὸς κύριος πάντων
  choice: वही प्रभु सबका प्रभु है
  rationale: यह अनुवाद αὐτός की समानता पर दी गई बलाघात को और πάντων के व्यापक दायरे को स्पष्ट रखता है। ‘प्रभु’ की पुनरावृत्ति हिंदी में कथन को पूर्ण और बोधगम्य बनाती है।
- source_word: κύριος
  choice: प्रभु
  rationale: रोमियों 10 के संदर्भ में यह एक महत्त्वपूर्ण मसीही उपाधि है। ‘प्रभु’ इसके धार्मिक और शास्त्रीय अर्थ-संबंध को सुरक्षित रखता है।
- source_word: πλουτῶν εἰς πάντας
  choice: उन सभी के प्रति भरपूर उदार है
  rationale: शाब्दिक ‘धनी है’ हिंदी में इस संबंध के साथ अस्वाभाविक होगा। ‘भरपूर उदार’ प्रभु की प्रचुरता और उसे पुकारने वालों की ओर निर्देशित उदारता—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοὺς ἐπικαλουμένους αὐτόν
  choice: जो उसे पुकारते हैं
  rationale: यह वाक्यांश विश्वास के साथ प्रभु को पुकारने का भाव देता है और अगले पद से इसका संबंध बनाए रखता है।
theological_decisions:
- issue: संदर्भ में ‘प्रभु’ किसके लिए प्रयुक्त है
  choice: मुख्य पाठ केवल ‘प्रभु’ कहता है; आसपास का संदर्भ इसे प्रभु यीशु की स्वीकृति से जोड़ता है और साथ ही प्रभु को पुकारने की शास्त्रीय प्रतिध्वनि बनाए रखता है।
  alternative: इसे बिना किसी मसीही विशिष्टता के केवल परमेश्वर के सामान्य उल्लेख के रूप में समझना।
  rationale: रोमियों 10:9-13 में यीशु को प्रभु मानने और प्रभु का नाम पुकारने के कथन जुड़े हुए हैं। अनुवाद व्याख्यात्मक नाम नहीं जोड़ता, इसलिए पौलुस के कथन की गहराई और तनाव संदर्भ से उभरते हैं।
- issue: ‘सभी’ का दायरा
  choice: ‘सभी’ को ‘जो उसे पुकारते हैं’ वाक्यांश सीमित और स्पष्ट करता है।
  alternative: इसे प्रत्येक व्यक्ति के उद्धार का बिना किसी योग्यता वाला सार्वभौमिक कथन मानना।
  rationale: यूनानी वाक्य-विन्यास में लाभ पाने वाले ‘वे सभी’ हैं जो उसे पुकारते हैं। अनुवाद यहूदी और यूनानी दोनों के लिए समान उपलब्धता तथा पुकारने वाले सहभागियों की स्पष्ट पहचान—दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘भरपूर उदार’ शाब्दिक धन-संबंधी रूपक का भाव सुरक्षित रखते हुए अस्वाभाविक ‘सबके प्रति धनी’ से बचता है। अर्धविराम दोनों कारणसूचक उपवाक्यों के संबंध को स्पष्ट करता है।
