  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘अभिलाषा’ हार्दिक इच्छा का भाव रखता है और ‘कि वे उद्धार पाएँ’ यूनानी लक्ष्य-वाक्यांश को स्वाभाविक हिन्दी में व्यक्त करता है।
