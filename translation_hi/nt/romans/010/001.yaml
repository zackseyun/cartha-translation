  text: Ἀδελφοί, ἡ μὲν εὐδοκία τῆς ἐμῆς καρδίας καὶ ἡ ⸀δέησις πρὸς τὸν θεὸν ὑπὲρ ⸀αὐτῶν εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/001.yaml
  text: Brothers[a], the desire of my heart and my prayer to God for them is for their salvation.
translation:
  language: hi
  text: भाइयो[a], मेरे हृदय की अभिलाषा और परमेश्वर से उनके लिए मेरी प्रार्थना यह है कि वे उद्धार पाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में पुल्लिंग बहुवचन रूप है, जिसका प्रयोग स्त्री-पुरुष दोनों वाले समूह को सम्बोधित करने के लिए भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन में प्रयुक्त पुल्लिंग बहुवचन रूप को मुख्य पाठ में रखा गया है; यूनानी में यह मिश्रित समुदाय को भी सम्बोधित कर सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: εὐδοκία
  choice: अभिलाषा
  rationale: यहाँ शब्द पौलुस की हार्दिक इच्छा को व्यक्त करता है; ‘अभिलाषा’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: τῆς ἐμῆς καρδίας
  choice: मेरे हृदय की
  rationale: यूनानी संबंधकारक रचना को स्वाभाविक हिन्दी संबंध-वाक्यांश के रूप में रखा गया है।
- source_word: δέησις
  choice: प्रार्थना
  rationale: शब्द में विनती का भाव है, पर परमेश्वर की ओर निर्देशित निवेदन के लिए ‘प्रार्थना’ सर्वाधिक सहज और स्पष्ट है।
- source_word: πρὸς τὸν θεόν
  choice: परमेश्वर से
  rationale: हिन्दी में ‘परमेश्वर से प्रार्थना’ दिशा और सम्बोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὑπὲρ αὐτῶν
  choice: उनके लिए
  rationale: ὑπέρ का हितार्थक भाव संक्षिप्त और मुहावरेदार हिन्दी में व्यक्त होता है।
- source_word: αὐτῶν
  choice: उनके
  rationale: पूर्ववर्ती प्रसंग से संकेतित लोगों के लिए मूल का सर्वनाम बनाए रखा गया है; मुख्य पाठ में ‘इस्राएल’ नहीं जोड़ा गया।
- source_word: εἰς σωτηρίαν
  choice: कि वे उद्धार पाएँ
  rationale: εἰς यहाँ प्रार्थना और अभिलाषा के लक्ष्य को बताता है; हिन्दी उपवाक्य लक्ष्य तथा उद्धार का उन्हीं से सम्बन्ध स्पष्ट करता है।
- source_word: μὲν
  choice: प्रत्यक्ष रूप से अनूदित नहीं
  rationale: यह हल्का संवाद-सूचक कण है और इस पद में स्पष्ट δέ से युग्मित नहीं है; अलग शब्द जोड़ने से हिन्दी अस्वाभाविक होती।
theological_decisions:
- issue: सम्बोधन Ἀδελφοί का लिंग और समावेशिता
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है, जबकि सम्भावित मिश्रित समुदाय की समावेशी व्याप्ति पादटिप्पणी में बताई गई है।
- issue: εἰς σωτηρίαν का लक्ष्य-संबंध
  choice: कि वे उद्धार पाएँ
  alternative: उद्धार के लिए
  rationale: यह स्वाभाविक हिन्दी में उनके उद्धार को अभिलाषा और प्रार्थना का लक्ष्य बताता है, बिना उद्धार के साधन या परिणाम के विषय में अतिरिक्त धर्मवैज्ञानिक दावा जोड़े।
