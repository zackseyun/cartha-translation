source:
  edition: SBLGNT
  text: Ἠσαΐας δὲ ἀποτολμᾷ καὶ λέγει· Εὑρέθην ⸀ἐν τοῖς ἐμὲ μὴ ζητοῦσιν, ἐμφανὴς ⸀ἐγενόμην τοῖς ἐμὲ μὴ ἐπερωτῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/010/020.yaml
  text: But Isaiah is very bold and says[a], “I was found by those who were not seeking me[b]; I became manifest to those who were not asking for me.”
translation:
  language: hi
  text: परन्तु यशायाह बहुत साहस से कहता है, “जो मुझे नहीं खोज रहे थे, उन्होंने मुझे पाया[a]; जो मुझसे नहीं पूछ रहे थे, उन पर मैं प्रकट हुआ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मुझे नहीं खोज रहे थे, उनके बीच मैं पाया गया।”
    reason: ἐν के ‘में/बीच’ अर्थ और यूनानी कर्मवाच्य के अधिक शाब्दिक रूप को सुरक्षित रखना।
  - marker: b
    text: या, “जो मुझसे नहीं पूछ रहे थे, उन पर मैंने अपने आपको प्रकट किया।”
    reason: ἐμφανὴς ἐγενόμην का अधिक स्पष्ट, पर कुछ अधिक व्याख्यात्मक हिन्दी विकल्प देना।
lexical_decisions:
- source_word: ἀποτολμᾷ
  choice: बड़े साहस से
  rationale: यह क्रिया निर्भीकता से आगे बढ़कर कहने का भाव व्यक्त करती है। यह प्रयोग वर्तमान काल की सजीवता और कथन की साहसिकता को स्वाभाविक हिन्दी में रखता है।
- source_word: Εὑρέθην
  choice: उन्होंने मुझे पा लिया
  rationale: यूनानी में यह प्रथम पुरुष एकवचन कर्मवाच्य है, अर्थात् ‘मैं पाया गया।’ हिन्दी में शाब्दिक कर्मवाच्य अस्वाभाविक लगता है; कर्तृवाच्य रूप वही अर्थ स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ἐν τοῖς ἐμὲ μὴ ζητοῦσιν
  choice: जिन लोगों ने मुझे नहीं खोजा
  rationale: ἐν का शाब्दिक अर्थ ‘में/बीच’ है, पर उद्धरण में यह उन लोगों को बताता है जिन्होंने परमेश्वर को पाया। निकटतर ‘बीच’ वाला विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: ζητοῦσιν
  choice: खोजा
  rationale: ‘खोजना’ ζητέω के सक्रिय प्रयत्न और बाइबलीय अर्थ-छाया को आधुनिक, सहज हिन्दी में बनाए रखता है।
- source_word: ἐμφανὴς ἐγενόμην
  choice: उन पर मैं प्रकट हुआ
  rationale: यह रूप ‘मैं प्रकट/प्रत्यक्ष हुआ’ का भाव देता है। ‘प्रकट हुआ’ यूनानी संरचना को बनाए रखता है और उसे स्पष्ट रूप से ‘मैंने अपने आपको प्रकट किया’ में परिवर्तित नहीं करता।
- source_word: ἐπερωτῶσιν
  choice: मेरे विषय में नहीं पूछा
  rationale: यहाँ क्रिया पूछने या जानकारी लेने का अर्थ देती है। यह अनुवाद ‘पुकारने’ जैसे अधिक विशिष्ट धार्मिक अर्थ को आरोपित नहीं करता।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले तर्क और इस अधिक साहसिक यशायाही कथन के बीच विरोध अथवा संक्रमण को स्पष्ट करता है।
- source_word: Ἠσαΐας
  choice: यशायाह
  rationale: यह नाम का हिन्दी बाइबल परम्परा में प्रचलित और आसानी से पहचाना जाने वाला रूप है।
theological_decisions:
- issue: यशायाह के उद्धरण में परमेश्वर के आत्म-प्रकाशन का अनुवाद
  choice: उन पर मैं प्रकट हुआ
  alternative: मैंने अपने आपको उन पर प्रकट किया / मैंने अपने आपको उन्हें जानने दिया
  rationale: यूनानी पाठ प्रकट होने पर बल देता है, पर स्पष्ट रूप से आत्मवाचक क्रिया नहीं कहता। चुना हुआ पाठ इस रूप और उसकी धर्मवैचारिक तन्यता को बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘उन्होंने मुझे पा लिया’ शाब्दिक ‘मैं पाया गया’ की अपेक्षा अधिक स्वाभाविक हिन्दी है, जबकि पादटिप्पणी मूल कर्मवाच्य और ἐν की निकटतर संरचना को सुरक्षित रखती है।
