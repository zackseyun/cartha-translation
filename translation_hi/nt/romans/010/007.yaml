lexical_decisions:
- source_word: ἤ
  choice: या
  rationale: यह पिछले कथन के विपरीत उद्धरण के दूसरे विकल्प को प्रस्तुत करता है; सरल ‘या’ यूनानी वाक्य-प्रवाह को बनाए रखता है।
- source_word: Τίς καταβήσεται
  choice: कौन उतरेगा
  rationale: सीधा आलंकारिक प्रश्न है; भविष्यकाल और नीचे जाने की स्थानिक छवि दोनों सुरक्षित रहती हैं।
- source_word: εἰς τὴν ἄβυσσον
  choice: अथाह गहराई में
  rationale: ‘अथाह गहराई’ ἄβυσσος की अगाध गहराई की छवि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है और इसे कब्र, अधोलोक या समुद्र जैसे किसी संकुचित अर्थ में नहीं बदलती।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह यूनानी व्याख्यात्मक सूत्र का संक्षिप्त, प्रतिष्ठित और स्वाभाविक हिन्दी रूप है।
- source_word: Χριστόν
  choice: मसीह
  rationale: यहाँ Χριστός अभिषिक्त उद्धारकर्ता की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अर्थ को हिन्दी में सुरक्षित रखता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह यूनानी मुहावरे का सटीक और हिन्दी में प्रचलित रूप है, जो मृतकों के बीच से ऊपर लाए जाने का भाव रखता है।
- source_word: ἀναγαγεῖν
  choice: ऊपर लाने के लिए
  rationale: यह क्रिया की स्थानिक दिशा को बनाए रखता है और ‘उतरेगा’ के साथ जानबूझकर बने ऊपर-नीचे के विरोध को सुरक्षित करता है; ‘जिलाने’ जैसा अधिक व्याख्यात्मक शब्द नहीं अपनाया गया।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रसंग में शब्द उपाधि के रूप में कार्य करता है। ‘मसीह’ अभिषिक्त जन का अर्थ व्यक्त करता है, जबकि केवल लिप्यंतरण उस अर्थ को अस्पष्ट कर सकता है।
- issue: ἄβυσσος की व्याख्या
  choice: अथाह गहराई
  alternative: अधोलोक / मृतकों का लोक / अथाह कुंड
  rationale: पौलुस व्यवस्थाविवरण 30 की भाषा को मसीह को मरे हुओं में से ऊपर लाने पर लागू करता है। मुख्य पाठ में व्यापक और चित्रात्मक अर्थ रखा गया है, ताकि इसे किसी एक व्यवस्थित परलोक-संबंधी धारणा में सीमित न किया जाए।
- issue: ἀναγαγεῖν और पुनरुत्थान
  choice: ऊपर लाने के लिए
  alternative: जिलाकर उठाने के लिए
  rationale: संदर्भ पुनरुत्थान की ओर संकेत करता है, फिर भी स्वयं क्रिया स्थानिक रूप से ‘ऊपर लाना’ कहती है। इसी तनाव और चित्रात्मक समानता को मुख्य पाठ में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। उद्धरण की आलंकारिक शक्ति तथा ‘उतरने’ और ‘ऊपर लाने’ की स्थानिक समानता सुरक्षित है।
