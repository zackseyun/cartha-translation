    text: या, “विषैले साँपों का विष।” यूनानी शब्द एक विषैले साँप को सूचित करता है; उसकी निश्चित आधुनिक प्रजाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τάφος
  choice: कब्र
  rationale: ‘कब्र’ आधुनिक हिंदी में स्वाभाविक है और मृत्यु तथा सड़न की तीखी उपमा को बनाए रखती है।
- source_word: ἀνεῳγμένος
  choice: खुली हुई
  rationale: यूनानी पूर्ण निष्क्रिय कृदंत के परिणामस्वरूप बनी अवस्था को ‘खुली हुई’ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: λάρυγξ
  choice: गला
  rationale: इस शारीरिक और रूपकात्मक संदर्भ में ‘गला’ सर्वसुलभ तथा सीधा हिंदी समतुल्य है।
- source_word: ἐδολιοῦσαν
  choice: छल करते रहे हैं
  rationale: अपूर्ण काल में निहित निरंतर या बार-बार किए गए छल का भाव इस रूप में सुरक्षित रहता है।
- source_word: ἰὸς
  choice: विष
  rationale: साँप के संदर्भ में हिंदी का ‘विष’ स्वाभाविक है और जहरीले द्रव्य के अर्थ को ठीक से व्यक्त करता है।
- source_word: ἀσπίδων
  choice: नागों
  rationale: ἀσπίς एक विषैले साँप को सूचित करता है; ‘नाग’ पारंपरिक बाइबलीय चित्र को बनाए रखते हुए सामान्य हिंदी पाठक के लिए परिचित है, यद्यपि किसी निश्चित आधुनिक प्रजाति की पहचान अनिश्चित है।
- source_word: ὑπὸ τὰ χείλη αὐτῶν
  choice: उनके होंठों के नीचे
  rationale: यह स्रोत की स्थान-सूचक और सजीव शारीरिक छवि का सीधा, स्वाभाविक अनुवाद है।
