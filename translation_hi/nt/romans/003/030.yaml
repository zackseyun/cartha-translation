id: ROM.3.30
reference: Romans 3:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀εἴπερ εἷς ὁ θεός, ὃς δικαιώσει περιτομὴν ἐκ πίστεως καὶ ἀκροβυστίαν διὰ τῆς πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/030.yaml
  text: since God is one[c][b][a], who will justify the circumcised by faith and the uncircumcised through faith.
translation:
  language: hi
  text: क्योंकि परमेश्वर एक ही है,[a] जो खतना किए हुओं[b] को विश्वास के आधार पर और खतनारहितों को विश्वास के द्वारा धर्मी ठहराएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि वास्तव में परमेश्वर एक ही है।”
    reason: alternative_reading
  - marker: b
    text: यूनानी में शाब्दिक रूप से “खतना” और “खतनारहित अवस्था” है; यहाँ इनसे क्रमशः खतना किए हुए और खतनारहित लोग अभिप्रेत हैं।
    reason: cultural_note
  - marker: c
    text: 'पौलुस यहाँ दो अलग अभिव्यक्तियाँ प्रयोग करता है: “विश्वास के आधार पर” और “विश्वास के द्वारा।” संभव है कि यह अंतर केवल शैलीगत हो, कोई तीखा अर्थगत भेद न हो।'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴπερ
  choice: क्योंकि
  rationale: यहाँ पौलुस अनिश्चित शर्त नहीं रखता, बल्कि एकेश्वरवादी विश्वास को अपने निष्कर्ष का आधार बनाता है; इसलिए कारणसूचक अनुवाद स्वाभाविक है।
- source_word: εἷς ὁ θεός
  choice: परमेश्वर एक ही है
  rationale: यह यूनानी वाक्य के बलयुक्त एकेश्वरवादी कथन को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: δικαιώσει
  choice: धर्मी ठहराएगा
  rationale: यह δικαιόω के न्यायिक अर्थ और भविष्यकाल—दोनों को सुरक्षित रखता है।
- source_word: περιτομήν
  choice: खतना किए हुओं
  rationale: अमूर्त संज्ञा यहाँ खतना किए हुए लोगों के लिए लक्षणा है; यह अनुवाद उसे व्यक्त करता है, पर सीधे ‘यहूदियों’ कहकर अर्थ को सीमित नहीं करता।
- source_word: ἐκ πίστεως
  choice: विश्वास के आधार पर
  rationale: ἐκ का आधार या स्रोत संबंधी रंग स्पष्ट करता है और अगले διά से शब्दगत भिन्नता बनाए रखता है।
- source_word: ἀκροβυστίαν
  choice: खतनारहितों
  rationale: यह संज्ञा खतनारहित लोगों के लिए लक्षणा है; ‘गैर-यहूदी’ की अपेक्षा यह मूल रूपक के अधिक निकट है।
- source_word: διὰ τῆς πίστεως
  choice: विश्वास के द्वारा
  rationale: यह διά के माध्यमसूचक भाव को व्यक्त करता है और ἐκ πίστεως से मूल पाठ की अभिव्यक्तिगत भिन्नता बचाता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस प्रसंग में πίστις के लिए ‘विश्वास’ सटीक, परिचित और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: क्या ἐκ πίστεως और διὰ τῆς πίστεως के बीच कोई विशेष धर्मवैज्ञानिक भेद है
  choice: दोनों को क्रमशः ‘विश्वास के आधार पर’ और ‘विश्वास के द्वारा’ कहकर पूर्वसर्गों का अंतर सुरक्षित रखा गया है, पर किसी निश्चित धर्मवैज्ञानिक भेद का दावा नहीं किया गया।
  alternative: दोनों का समान रूप से ‘विश्वास के द्वारा’ अनुवाद करना, अथवा पहले को आधार और दूसरे को साधन का कठोर धर्मवैज्ञानिक भेद मानना।
  rationale: यूनानी पाठ दो अलग पूर्वसर्गों का प्रयोग करता है, इसलिए अंतर दिखना चाहिए; फिर भी प्रसंग यह सिद्ध नहीं करता कि पौलुस कोई तीखा धर्मवैज्ञानिक भेद स्थापित कर रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप अपनाया गया है। ‘धर्मी ठहराएगा’ पौलुस की न्यायिक शब्दावली को सुरक्षित रखता है। सभी टिप्पणियों के संकेत मुख्य पाठ में अर्थानुसार संबंधित स्थानों पर रखे गए हैं।
