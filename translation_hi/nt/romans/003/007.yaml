source:
  edition: SBLGNT
  text: εἰ ⸀δὲ ἡ ἀλήθεια τοῦ θεοῦ ἐν τῷ ἐμῷ ψεύσματι ἐπερίσσευσεν εἰς τὴν δόξαν αὐτοῦ, τί ἔτι κἀγὼ ὡς ἁμαρτωλὸς κρίνομαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/007.yaml
  text: But if God’s truthfulness has abounded through my lie for his glory, why am I still being judged as a sinner?
translation:
  language: hi
  text: पर यदि मेरे झूठ[b] के द्वारा परमेश्वर की सच्चाई[a] उसकी महिमा के लिए[c] और भी अधिक बढ़ी है, तो फिर मुझ पर भी अब तक पापी के रूप में न्याय क्यों किया जाता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर का सत्य।’
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे असत्य के द्वारा।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘उसकी महिमा की ओर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλήθεια τοῦ θεοῦ
  choice: परमेश्वर की सत्यनिष्ठा
  rationale: पद 4–7 में परमेश्वर के सत्य होने का मनुष्य के झूठ से विरोध है। ‘सत्यनिष्ठा’ इस नैतिक और संबंधपरक भाव को व्यक्त करती है, जबकि पादटिप्पणी अधिक व्यापक ‘सत्य’ का विकल्प सुरक्षित रखती है।
- source_word: ἐν τῷ ἐμῷ ψεύσματι
  choice: मेरे झूठ के द्वारा
  rationale: यहाँ ἐν को साधनवाचक मानना प्रसंगानुकूल है; ‘के द्वारा’ उसी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ψεύσματι
  choice: झूठ
  rationale: ‘झूठ’ सीधा, प्रचलित और मनुष्य के झूठ तथा परमेश्वर की सत्यनिष्ठा के विरोध को स्पष्ट रखने वाला शब्द है।
- source_word: ἐπερίσσευσεν
  choice: और भी अधिक बढ़ी है
  rationale: यह क्रिया बढ़ने या बहुतायत में होने का भाव रखती है। यह अनुवाद मूल कथन की जानबूझकर रखी गई वैचारिक विषमता को किसी व्याख्यात्मक क्रिया से नहीं बदलता।
- source_word: εἰς τὴν δόξαν αὐτοῦ
  choice: उसकी महिमा के लिए
  rationale: यह εἰς के परिणाम अथवा प्रयोजन के भाव को स्वाभाविक हिन्दी में रखता है; शाब्दिक दिशा-सूचक रूप पादटिप्पणी में दिया गया है।
- source_word: τί ἔτι
  choice: क्यों ... अब तक
  rationale: यह ἔτι में निहित जारी रहने के भाव को स्पष्ट करता है।
- source_word: κἀγὼ
  choice: मेरा भी
  rationale: ‘भी’ κἀγώ के योगात्मक बल को बनाए रखता है।
- source_word: κρίνομαι
  choice: मेरा ... न्याय किया जाता है
  rationale: यह वर्तमान कर्मवाच्य को बनाए रखता है और अर्थ को पहले ही ‘दोषी ठहराए जाने’ या अंतिम दंड तक सीमित नहीं करता।
- source_word: ὡς ἁμαρτωλὸς
  choice: पापी के रूप में
  rationale: यह पदबंध का सीधा और अर्थगत रूप से खुला अनुवाद है।
theological_decisions:
- issue: ἀλήθεια τοῦ θεοῦ को व्यापक ‘सत्य’ के रूप में अनुवाद किया जाए या परमेश्वर के चरित्रगत ‘सत्यनिष्ठा’ के रूप में।
  choice: परमेश्वर की सत्यनिष्ठा
  alternative: परमेश्वर का सत्य / परमेश्वर की सच्चाई
  rationale: निकट प्रसंग में परमेश्वर के सत्य होने और मनुष्य के झूठे होने का नैतिक विरोध प्रमुख है। ‘सत्यनिष्ठा’ इसे उभारती है, पर वैकल्पिक व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: κρίνομαι को ‘न्याय किया जाता है’ या ‘दोषी ठहराया जाता है’ कहा जाए।
  choice: न्याय किया जाता है
  alternative: दोषी ठहराया जाता है
  rationale: मूल क्रिया न्याय या निर्णय का व्यापक अर्थ रखती है; इसे ‘दोषी ठहराना’ कहना इस स्थान पर अर्थ को अनावश्यक रूप से संकीर्ण कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। मूल यूनानी की तर्कपूर्ण शर्त और उससे उत्पन्न तनाव को सरल करके समाप्त नहीं किया गया।
