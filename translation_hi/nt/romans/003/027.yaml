id: ROM.3.27
reference: Romans 3:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ποῦ οὖν ἡ καύχησις; ἐξεκλείσθη. διὰ ποίου νόμου; τῶν ἔργων; οὐχί, ἀλλὰ διὰ νόμου πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/027.yaml
  text: Where, then, is boasting? It has been excluded. Through what kind of law? A law of works? No, but through a law of faith.
translation:
  language: hi
  text: तो फिर घमंड कहाँ रहा? वह तो दूर कर दिया गया। किस प्रकार की व्यवस्था के द्वारा? कर्मों की व्यवस्था के द्वारा? नहीं, बल्कि विश्वास की व्यवस्था के द्वारा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καύχησις
  choice: घमंड
  rationale: यहाँ अपने धार्मिक दर्जे या उपलब्धि पर गर्व करने का भाव है; ‘घमंड’ साधारण पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: ἐξεκλείσθη
  choice: दूर कर दिया गया
  rationale: मूल क्रिया का अर्थ बाहर कर देना या निषिद्ध कर देना है; यह प्रयोग हिंदी में प्रसंगानुकूल और सहज है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: पौलुस के तर्क में νόμος का शब्द-खेल बनाए रखने के लिए दोनों स्थानों पर एक ही शब्द रखा गया है; यहाँ इसका अर्थ केवल मूसा की व्यवस्था तक सीमित नहीं, बल्कि कार्यकारी सिद्धांत भी हो सकता है।
- source_word: πίστεως
  choice: विश्वास की
  rationale: πίστις का सामान्य और संदर्भानुकूल अनुवाद ‘विश्वास’ है; संबंधकारक की संभावित अर्थ-व्याप्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: διὰ
  choice: के द्वारा
  rationale: संबंधकारक के साथ διά यहाँ माध्यम या साधन दर्शाता है; ‘के द्वारा’ इस संबंध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: νόμος का अर्थ
  choice: व्यवस्था
  alternative: सिद्धांत / नियम
  rationale: ‘व्यवस्था’ रोमियों के व्यापक संदर्भ और ‘कर्मों’ तथा ‘विश्वास’ के साथ किए गए जानबूझकर शब्द-प्रयोग को सुरक्षित रखती है, जबकि मूल में संभव ‘सिद्धांत’ का अर्थ पूर्णतः बंद नहीं करती।
- issue: πίστις का संबंधकारक
  choice: विश्वास की व्यवस्था
  alternative: विश्वास पर आधारित व्यवस्था
  rationale: शाब्दिक संरचना मूल की संक्षिप्तता और संभावित अर्थगत तनाव बनाए रखती है; विस्तार करके किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त प्रश्नोत्तर की अलंकारिक गति और पौलुस के ‘व्यवस्था’ संबंधी शब्द-खेल को बनाए रखा गया है।
