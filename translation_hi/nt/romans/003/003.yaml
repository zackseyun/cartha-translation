  register: आधुनिक मानक हिन्दी; तर्कपूर्ण, संक्षिप्त और गरिमापूर्ण शैली। ‘विश्वासयोग्य न निकले/अविश्वासयोग्यता’ से मूल के शब्दगत संबंध और मानवीय-दिव्य विरोध को बनाए रखा गया है। पादटिप्पणी-चिह्न उस पूरे विवादित पदबंध के बाद रखा गया है जिसे वह स्पष्ट करता है।
