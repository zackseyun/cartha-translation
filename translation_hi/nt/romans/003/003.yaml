base_translation:
  language: en
  yaml_path: translation/nt/romans/003/003.yaml
  text: What then? If some were unfaithful[a], will their unfaithfulness nullify God's faithfulness?
translation:
  language: hi
  text: तो फिर क्या? यदि कुछ लोगों ने विश्वास नहीं किया, तो क्या उनका अविश्वास परमेश्वर की विश्वासयोग्यता को निष्फल कर देगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के विश्वास को।” यूनानी में शाब्दिक रूप से “परमेश्वर का विश्वास” है; यहाँ प्रसंग में आशय संभवतः परमेश्वर की विश्वासयोग्यता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί γάρ
  choice: तो फिर क्या?
  rationale: यह पौलुस के तर्क में आपत्ति या निष्कर्ष की ओर मोड़ने वाला संक्षिप्त प्रश्नसूचक वाक्यांश है; यह हिन्दी में स्वाभाविक रूप से उस मोड़ को बनाए रखता है।
- source_word: ἠπίστησάν
  choice: विश्वासयोग्य न निकले
  rationale: क्रिया का अर्थ ‘विश्वास न करना’ भी हो सकता है, पर यहाँ ἀπιστία और परमेश्वर की πίστις के साथ विरोध मानव अविश्वासयोग्यता की ओर संकेत करता है।
- source_word: τινες
  choice: कुछ लोग
  rationale: यह अनिश्चित बहुवचन है; ‘कुछ लोग’ आधुनिक हिन्दी में इसका सहज समतुल्य है।
- source_word: ἀπιστία
  choice: अविश्वासयोग्यता
  rationale: यह ἠπίστησάν के समान शब्द-परिवार से है और परमेश्वर की विश्वासयोग्यता के विपरीत रखा गया है; यह रूप उस अलंकारिक विरोध को स्पष्ट रखता है, यद्यपि ‘अविश्वास’ भी संभव है।
- source_word: πίστιν τοῦ θεοῦ
  choice: परमेश्वर की विश्वासयोग्यता
  rationale: शाब्दिक संरचना ‘परमेश्वर का विश्वास’ है, पर प्रसंग में मानव अविश्वासयोग्यता के विपरीत परमेश्वर की भरोसेमंदी/विश्वासयोग्यता सबसे स्वाभाविक अर्थ है।
- source_word: καταργήσει
  choice: निष्फल कर देगी
  rationale: यह किसी बात को प्रभावहीन या बेअसर कर देने का अर्थ व्यक्त करता है और प्रश्न की भावी क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: πίστιν τοῦ θεοῦ जैसे विवादित पौलुसी वाक्यांश का अनुवाद
  choice: परमेश्वर की विश्वासयोग्यता
  alternative: परमेश्वर का विश्वास
  rationale: मनुष्यों की ἀπιστία और परमेश्वर की πίστις के बीच विरोध ‘विश्वासयोग्यता’ अर्थ का प्रबल समर्थन करता है; फिर भी मूल संबंधवाचक संरचना की वास्तविक वैकल्पिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
