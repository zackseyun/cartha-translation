source:
  edition: SBLGNT
  text: ὃν προέθετο ὁ θεὸς ἱλαστήριον ⸀διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι εἰς ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ διὰ τὴν πάρεσιν τῶν προγεγονότων ἁμαρτημάτων
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/025.yaml
  text: whom God put forward as an atoning sacrifice[a] through faith in his blood[b], to demonstrate his righteousness[c], because of the passing over of previously committed sins.
translation:
  language: hi
  text: परमेश्वर ने उन्हें उनके लहू में विश्वास के द्वारा प्रायश्चित-बलि[a] के रूप में प्रस्तुत किया[b], अपनी धार्मिकता[c] प्रकट करने के लिए, क्योंकि पहले किए गए पापों को दंड दिए बिना छोड़ दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोप-शमनकारी बलि”; या “करुणासन”—पुराने नियम में वाचा के सन्दूक का वह सोने का ढकना, जिस पर प्रायश्चित का लहू छिड़का जाता था।
    reason: lexical_alternative
  - marker: b
    text: 'वाक्यांश का अनुवाद यह भी हो सकता है: “विश्वास के द्वारा, उनके लहू से।” यूनानी में इसका संबंध एक से अधिक प्रकार से समझा जा सकता है।'
    reason: alternative_reading
  - marker: c
    text: या “न्याय”।
    reason: lexical_alternative
lexical_decisions:
- source_word: προέθετο
  choice: प्रस्तुत किया
  rationale: यह चयन परमेश्वर द्वारा मसीह को सामने रखने या उपलब्ध कराने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल पूर्व-निर्धारण के अर्थ तक सीमित किए।
- source_word: ἱλαστήριον
  choice: प्रायश्चित-बलि
  rationale: यह सुबोध हिन्दी में पाप के प्रायश्चित और बलिदानी संदर्भ को बनाए रखता है, पर शब्द को केवल कोप-शमन या केवल प्रायश्चित के ढकने तक सीमित नहीं करता। प्रमुख विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: πίστις के सामान्य पौलुसी अर्थ को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ αὐτοῦ αἵματι
  choice: उनके लहू में
  rationale: यूनानी पूर्वसर्ग की औपचारिक पारदर्शिता बनाए रखता है और वाक्यांश का संबंध विश्वास से है या प्रायश्चित के साधन से—इस प्रश्न को पादटिप्पणी सहित खुला रखता है।
- source_word: εἰς ἔνδειξιν
  choice: ताकि वह ... प्रकट करे
  rationale: उद्देश्य या परिणाम के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग के लिए प्रचलित और व्यापक हिन्दी समानार्थी है; ‘न्याय’ की संभावित छाया पादटिप्पणी में सुरक्षित है।
- source_word: πάρεσιν
  choice: दंड दिए बिना छोड़ दिया
  rationale: यह अस्थायी रूप से दंड न देने या पापों को जाने देने का भाव व्यक्त करता है और इसे पूर्ण क्षमा के समान नहीं बना देता।
- source_word: προγεγονότων ἁμαρτημάτων
  choice: पहले किए गए पापों
  rationale: पूर्वकालिक कृदन्त का अर्थ सरल और वर्तमान हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ἱλαστήριον का अर्थ
  choice: प्रायश्चित-बलि
  alternative: कोप-शमनकारी बलि; प्रायश्चित का ढकना/करुणासन
  rationale: मुख्य पाठ बलिदानी और प्रायश्चितकारी कार्य को सुलभ भाषा में रखता है, जबकि परमेश्वर के कोप के शमन और वाचा के सन्दूक के प्रायश्चित-ढकने से जुड़े अर्थ पादटिप्पणी में सुरक्षित रहते हैं।
- issue: διὰ πίστεως ἐν τῷ αὐτοῦ αἵματι का वाक्यगत संबंध
  choice: उनके लहू में विश्वास के द्वारा
  alternative: विश्वास के द्वारा, उनके लहू से
  rationale: मुख्य पाठ उस सामान्य अर्थ को अपनाता है जिसमें विश्वास का संबंध मसीह के लहू से है; साधन के रूप में लहू समझने की सम्भावना पादटिप्पणी में दी गई है।
- issue: δικαιοσύνη का पौलुसी अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ व्यापक शब्दार्थ और पारंपरिक पौलुसी शब्दावली बनाए रखती है, जबकि इस प्रसंग में परमेश्वर के न्याय का भाव भी सम्भव है।
- issue: πάρεσις को क्षमा से अलग रखना
  choice: दंड दिए बिना छोड़ दिया
  alternative: अनदेखा किया; जाने दिया
  rationale: यहाँ प्रयुक्त दुर्लभ शब्द का अर्थ तत्काल दंड न देना है; अनुवाद इसे पूर्ण क्षमा के सामान्य शब्द में नहीं बदलता।
