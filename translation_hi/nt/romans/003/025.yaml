  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’ बलिदानी बाइबिलीय संदर्भ में ‘खून’ की अपेक्षा अधिक उपयुक्त है। ‘प्रायश्चित-बलि’ तकनीकी अर्थ को स्पष्ट करते हुए भी किसी एक संप्रदायगत व्याख्या को निर्णायक नहीं बनाती।
