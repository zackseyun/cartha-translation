    issue: Potential ambiguity in “न्यायी ठहरें”
    rationale: Although defensible, “न्यायी” may be understood as ‘just/judicial’ or associated with ‘judge.’ “सही ठहरें” communicates the quotation’s forensic vindication more directly in modern standard Hindi.
  - severity: low
    issue: Footnote alternative “निर्दोष सिद्ध हों” is overly narrow
    rationale: It may imply being acquitted or found not guilty, whereas δικαιωθῇς here concerns God being shown to be in the right. Replacing it with “न्यायी सिद्ध हों” preserves the judicial nuance without adding that implication.
