id: ROM.3.4
reference: Romans 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ γένοιτο· γινέσθω δὲ ὁ θεὸς ἀληθής, πᾶς δὲ ἄνθρωπος ψεύστης, ⸀καθὼς γέγραπται· Ὅπως ἂν δικαιωθῇς ἐν τοῖς λόγοις σου καὶ ⸀νικήσεις ἐν τῷ κρίνεσθαί σε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/004.yaml
  text: 'May it never be! Rather[a], let God be true, and every person a liar[b], as it is written: “So that you may be justified in your words and prevail when you are judged.”'
translation:
  language: hi
  text: 'ऐसा कभी न हो! बल्कि परमेश्वर सच्चा ठहरे और हर मनुष्य झूठा, जैसा लिखा है:


    “ताकि आप अपनी बातों में सही ठहरें[a]


    और जब आपका न्याय किया जाए, तब विजयी हों[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायी सिद्ध हों” अथवा “सही प्रमाणित हों।”
    reason: lexical_alternative
  - marker: b
    text: या, “जब आप न्याय करें।” यह भजन 51:4 के इब्रानी शब्दों को अधिक सीधे दर्शाता है, जबकि रोमियों के यूनानी शब्दों का स्वाभाविक अर्थ “जब आपका न्याय किया जाए” है।
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: ऐसा कभी न हो!
  rationale: पौलुस के तीखे निषेध और यूनानी की इच्छार्थक अभिव्यक्ति—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: γινέσθω δὲ ὁ θεὸς ἀληθής
  choice: बल्कि परमेश्वर सच्चा ठहरे
  rationale: γινέσθω के आज्ञार्थक बल को सुरक्षित रखता है और ‘झूठा’ के साथ स्पष्ट विरोध प्रस्तुत करता है।
- source_word: πᾶς δὲ ἄνθρωπος
  choice: हर मनुष्य
  rationale: ἄνθρωπος यहाँ समस्त मानवजाति के प्रत्येक व्यक्ति के लिए प्रयुक्त है; ‘हर मनुष्य’ हिन्दी में इसका सहज और समावेशी रूप है।
- source_word: ψεύστης
  choice: झूठा
  rationale: यह संज्ञा झूठ बोलने वाले अथवा असत्य सिद्ध होने वाले व्यक्ति को दर्शाती है; संक्षिप्त रूप यूनानी के तीखे विरोध को बनाए रखता है।
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: पवित्रशास्त्र उद्धृत करने की प्रचलित, संक्षिप्त और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: δικαιωθῇς
  choice: न्यायी ठहरें
  rationale: यहाँ अर्थ परमेश्वर के धर्मी बनाए जाने का नहीं, बल्कि उनके वचनों में सही और न्यायी प्रमाणित होने का है; न्यायिक भाव सुरक्षित रहता है।
- source_word: ἐν τοῖς λόγοις σου
  choice: अपनी बातों में
  rationale: λόγοις का सीधा अर्थ ‘बातों/वचनों’ है; इस प्रसंग में ‘अपनी बातों में’ स्वाभाविक हिन्दी है।
- source_word: νικήσεις
  choice: विजयी हों
  rationale: न्यायिक प्रसंग में निर्णय के समय सफल या सही सिद्ध होने का अर्थ व्यक्त करता है, जबकि मूल क्रिया की विजय-संबंधी छवि भी बनी रहती है।
- source_word: ἐν τῷ κρίνεσθαί σε
  choice: जब आपका न्याय किया जाए
  rationale: रोमियों के यूनानी पाठ में क्रियारूप का सबसे स्वाभाविक पाठ कर्मवाच्य है; सम्मानसूचक ‘आपका’ उद्धरण में परमेश्वर को संबोधित करता है।
theological_decisions:
- issue: δικαιωθῇς का परमेश्वर के विषय में न्यायिक अर्थ
  choice: न्यायी ठहरें
  alternative: सही प्रमाणित हों / निर्दोष सिद्ध हों
  rationale: वचन यह नहीं कहता कि परमेश्वर न्यायी बनते हैं, बल्कि यह कि उनकी बातों की सत्यता के कारण वे न्यायी सिद्ध होते हैं।
- issue: κρίνεσθαί का वाच्य
  choice: जब आपका न्याय किया जाए
  alternative: जब आप न्याय करें
  rationale: रोमियों का यूनानी पाठ स्वाभाविक रूप से कर्मवाच्य पढ़ा जाता है, पर भजन 51:4 के इब्रानी पाठ में परमेश्वर के न्याय करने का भाव है; वैकल्पिक पाठ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। उद्धरण में परमेश्वर को संबोधित करने के कारण सम्मानसूचक ‘आप’ रखा गया है। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे उनकी व्याख्या संबंधित है।
