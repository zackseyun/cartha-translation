  naturalness: The register is modern, dignified, and generally natural. “अपनी बातों में सही ठहरें” is clearer contemporary Hindi for being shown right/vindicated in one’s words while retaining the judicial-contextual sense.
  terminology: “परमेश्वर,” “सच्चा,” “झूठा,” and “विजयी” are suitable. The revised footnote avoids “निर्दोष सिद्ध हों,” which can suggest acquittal from an accusation rather than the source’s sense of vindication/rightness.
  issues:
