  text: ἐν τῇ ἀνοχῇ τοῦ θεοῦ, πρὸς ⸀τὴν ἔνδειξιν τῆς δικαιοσύνης αὐτοῦ ἐν τῷ νῦν καιρῷ, εἰς τὸ εἶναι αὐτὸν δίκαιον καὶ δικαιοῦντα τὸν ἐκ πίστεως Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/026.yaml
  text: in God's forbearance[a], for the demonstration of his righteousness at the present time[c][b], so that he might be just and the justifier of the one who has faith in Jesus.
translation:
  language: hi
  text: परमेश्वर की सहनशीलता में, वर्तमान समय में अपनी धार्मिकता[a] प्रदर्शित करने के लिए, ताकि वह स्वयं धर्मी और यीशु पर विश्वास करने वाले को धर्मी ठहराने वाला हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायपरायणता।”
    reason: lexical_alternative
  - marker: c
    text: या, “धर्मी घोषित करने वाला हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνοχῇ
  choice: सहनशीलता
  rationale: यह शब्द परमेश्वर द्वारा तत्काल दंड को रोक रखने का भाव व्यक्त करता है; ‘धैर्य’ की तुलना में ‘सहनशीलता’ इस प्रसंग में अधिक सटीक है।
- source_word: ἔνδειξιν
  choice: प्रदर्शित करने
  rationale: यह चयन किसी बात को प्रत्यक्ष रूप से दिखाने या प्रमाणित करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह पौलुस की शब्दावली के नैतिक और न्यायिक दोनों आयामों को खुला रखता है; ‘न्यायपरायणता’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- source_word: νῦν καιρῷ
  choice: वर्तमान समय में
  rationale: यह νῦν के समय-संबंधी बल को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: δίκαιον
  choice: धर्मी
  rationale: यह δικαιοσύνη और δικαιοῦντα के साथ एक ही शब्द-परिवार का संबंध बनाए रखता है, साथ ही न्यायिक संदर्भ के अनुकूल है।
- source_word: δικαιοῦντα
  choice: धर्मी ठहराए
  rationale: यह क्रिया के न्यायिक अर्थ को व्यक्त करती है और ‘धर्मी’ के साथ पौलुस की जानबूझकर की गई शब्द-संगति को हिन्दी में यथासंभव बनाए रखती है।
- source_word: ἐκ πίστεως Ἰησοῦ
  choice: यीशु पर विश्वास करने वाले
  rationale: मुख्य पाठ में संबंधवाचक प्रयोग को यीशु में विश्वास के वस्तुगत अर्थ में स्वाभाविक हिन्दी में प्रस्तुत किया गया है; विवादित वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἐκ πίστεως Ἰησοῦ का अर्थ
  choice: यीशु पर विश्वास करने वाले
  alternative: जो यीशु की विश्वासयोग्यता पर आधारित है
  rationale: मुख्य पाठ प्रचलित वस्तुगत संबंधवाचक अर्थ अपनाता है, पर यूनानी वाक्यांश की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: δικαιοσύνη का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: ‘धार्मिकता’ पौलुस की व्यापक अवधारणा और निकटवर्ती शब्द-संगति को बनाए रखती है, जबकि न्याय संबंधी वैध अर्थ को पादटिप्पणी में रखा गया है।
- issue: δικαιοῦντα का न्यायिक भाव
  choice: धर्मी ठहराए
  alternative: धर्मी घोषित करे
  rationale: ‘धर्मी ठहराए’ स्वाभाविक और परिचित हिन्दी है; ‘धर्मी घोषित करे’ न्यायिक घोषणा के भाव को अधिक स्पष्ट करने वाला वैध विकल्प है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। दिए गए यूनानी अंश की आरंभिक खंडात्मक संरचना को ‘परमेश्वर की सहनशीलता में’ द्वारा बनाए रखा गया है। ‘धर्मी’ और ‘धर्मी ठहराए’ से मूल की शब्द-संगति सुरक्षित रखी गई है।
