  text: उनका मुँह शाप और कड़वाहट से भरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: उनका
  rationale: संबंधवाचक सर्वनाम पूर्ववर्ती लोगों की ओर संकेत करता है। स्वतंत्र पद के रूप में स्वाभाविक हिंदी में “उनका” इस संबंध को स्पष्ट और संक्षिप्त रखता है।
- source_word: τὸ στόμα
  choice: मुँह
  rationale: एकवचन संज्ञा सामूहिक रूप से प्रत्येक व्यक्ति की वाणी के साधन को दर्शाती है; हिंदी में “मुँह” यही रूपक स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἀρᾶς
  choice: शाप
  rationale: यह संज्ञा ऐसी वाणी को दर्शाती है जो किसी पर अनिष्ट आने की कामना या घोषणा करती है। “शाप” मूल अर्थ को सीधे बनाए रखता है।
- source_word: πικρίας
  choice: कड़वाहट
  rationale: यह शब्द कटुता और वैरभाव से भरी वाणी का भाव व्यक्त करता है; “कड़वाहट” हिंदी में मूल रूपक और नैतिक बल दोनों बनाए रखती है।
- source_word: γέμει
  choice: भरा है
  rationale: वर्तमानकालीन क्रिया का अर्थ “भरपूर होना” है। “भरा है” हिंदी में सहज है और निरंतर विद्यमान दशा को व्यक्त करता है।
