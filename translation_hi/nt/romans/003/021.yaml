  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Νυνὶ δὲ χωρὶς νόμου δικαιοσύνη θεοῦ πεφανέρωται, μαρτυρουμένη ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/021.yaml
  text: But now[a], apart from the law, the righteousness of God has been revealed, attested by the Law and the Prophets[c][b],
translation:
  language: hi
  text: पर अब व्यवस्था से अलग परमेश्वर की धार्मिकता[a] प्रकट हुई है, जिसकी गवाही व्यवस्था और भविष्यद्वक्ता देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर का न्याय”; संभवतः “परमेश्वर से मिलने वाली धार्मिकता।”
    reason: δικαιοσύνη θεοῦ में ‘धार्मिकता/न्याय’ और संबंधकारक के अर्थ की वास्तविक गुंजाइश को सुरक्षित रखना।
  - marker: b
    text: “व्यवस्था और भविष्यद्वक्ता” से यहाँ पवित्रशास्त्र के पुराने नियम के साक्ष्य का संकेत है।
    reason: इस प्रचलित शास्त्रीय पदनाम को स्पष्ट करना।
lexical_decisions:
- source_word: Νυνὶ δὲ
  choice: पर अब
  rationale: यह पौलुस के तर्क में समय-संबंधी और विरोधसूचक, दोनों प्रकार के निर्णायक परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χωρὶς νόμου
  choice: व्यवस्था से अलग
  rationale: χωρίς अलगाव का भाव देता है; प्रसंग में νόμος मुख्यतः मूसा की व्यवस्था की ओर संकेत करता है।
- source_word: δικαιοσύνη θεοῦ
  choice: परमेश्वर की धार्मिकता
  rationale: यह स्वाभाविक हिन्दी होते हुए यूनानी संबंधकारक की गुंजाइश को यथासंभव खुला रखता है—वाक्यांश परमेश्वर के धर्मी चरित्र और कार्य का संकेत दे सकता है; ‘परमेश्वर से मिलने वाली धार्मिकता’ को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: πεφανέρωται
  choice: प्रकट हुई है
  rationale: पूर्णकाल से पूर्व में हुए प्रकटीकरण और उसके वर्तमान परिणाम, दोनों का भाव व्यक्त होता है।
- source_word: μαρτυρουμένη
  choice: जिसकी गवाही ... देते हैं
  rationale: वर्तमान कर्मवाच्य कृदंत को सहज हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है; यह निरंतर शास्त्रीय साक्ष्य का भाव बनाए रखता है।
- source_word: ὑπὸ τοῦ νόμου καὶ τῶν προφητῶν
  choice: व्यवस्था और भविष्यद्वक्ता
  rationale: यह मान्य शास्त्रीय पदनाम है, जो व्यवस्था और भविष्यवक्ताओं के लेखों द्वारा दिए गए पुराने नियम के साक्ष्य की ओर संकेत करता है।
theological_decisions:
- issue: δικαιοσύνη θεοῦ में संबंधकारक का अर्थ
  choice: परमेश्वर की धार्मिकता
  alternative: परमेश्वर से मिलने वाली धार्मिकता; परमेश्वर का न्याय
  rationale: मुख्य पाठ यूनानी वाक्यांश की धर्मवैज्ञानिक व्यापकता और तनाव को सुरक्षित रखता है, उसे केवल स्रोत, स्वामित्व या एक ही सिद्धान्तगत अर्थ में सीमित नहीं करता।
- issue: νόμος का प्रसंगगत आशय
  choice: व्यवस्था
  alternative: कानून; बिना व्यवस्था के
  rationale: रोमियों के इस प्रसंग में मूसा की व्यवस्था प्रमुख संदर्भ है, जबकि आगे ‘व्यवस्था और भविष्यद्वक्ता’ संपूर्ण शास्त्रीय साक्ष्य का प्रचलित पदनाम है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘धार्मिकता’ पौलुस की प्रमुख शब्दावली को बनाए रखती है; ‘जिसकी गवाही ... देते हैं’ शाब्दिक रूप से बोझिल कर्मवाच्य के स्थान पर स्वाभाविक हिन्दी है।
