id: ROM.3.8
reference: Romans 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ μὴ καθὼς βλασφημούμεθα καὶ καθώς φασίν τινες ἡμᾶς λέγειν ὅτι Ποιήσωμεν τὰ κακὰ ἵνα ἔλθῃ τὰ ἀγαθά; ὧν τὸ κρίμα ἔνδικόν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/008.yaml
  text: And why not say—as we are slandered and as some claim that we say—“Let us do evil so that good may come”? Their condemnation is just[a][b].
translation:
  language: hi
  text: तो क्यों न कहें—जैसा कि हमारी निन्दा की जाती है और जैसा कुछ लोग दावा करते हैं कि हम कहते हैं—“आओ, हम बुराई करें ताकि भलाई हो”? उनका दोषी ठहराया जाना न्यायसंगत है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और क्यों न कहें—जैसा कि हमारी निन्दा की जाती है और जैसा कुछ लोग कहते हैं कि हम कहते हैं—‘आओ, हम बुराई करें ताकि भलाई हो’?”'
    reason: lexical_alternative
  - marker: b
    text: “उनका” सम्भवतः उन लोगों की ओर संकेत करता है जो यह आरोप लगाते हैं या इस प्रकार के तर्क का समर्थन करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: βλασφημούμεθα
  choice: हमारी निन्दा की जाती है
  rationale: यहाँ क्रिया का आशय पौलुस और उसके साथियों की शिक्षा को दुर्भावना से गलत रूप में प्रस्तुत करना है; यह अनुवाद आधुनिक हिन्दी में उस निन्दात्मक आरोप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φασίν τινες
  choice: कुछ लोग दावा करते हैं
  rationale: φασίν का मूल अर्थ ‘कहते हैं’ है, पर इस प्रसंग में आरोप लगाने का भाव है; ‘दावा करते हैं’ उस भाव को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: λέγειν
  choice: कि हम कहते हैं
  rationale: यह अनन्त क्रिया का सीधा अनुवाद है; ‘सिखाते हैं’ कहना मूल पाठ से अधिक व्याख्यात्मक होता।
- source_word: Ποιήσωμεν
  choice: आओ, हम ... करें
  rationale: प्रथम पुरुष बहुवचन एओरिस्ट सबजंक्टिव यहाँ प्रोत्साहनात्मक है; हिन्दी में ‘आओ, हम ... करें’ इसका स्वाभाविक समतुल्य है।
- source_word: τὰ κακὰ
  choice: बुराई
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण को हिन्दी में सामूहिक अर्थ वाले ‘बुराई’ से सहज रूप में व्यक्त किया गया है।
- source_word: ἵνα ἔλθῃ τὰ ἀγαθά
  choice: ताकि भलाई हो
  rationale: यह ἵνα के उद्देश्य अथवा अपेक्षित परिणाम के भाव को स्वाभाविक हिन्दी में रखता है; ‘अच्छी वस्तुएँ आएँ’ अत्यधिक शाब्दिक होता।
- source_word: κρίμα
  choice: दण्ड
  rationale: यहाँ κρίμα प्रतिकूल न्यायिक निर्णय को दर्शाता है; ‘दण्ड’ सामान्य पाठक के लिए परिणाम सहित उस अर्थ को स्पष्ट करता है।
- source_word: ἔνδικόν
  choice: उचित
  rationale: यह न्यायोचित और योग्य होने का नैतिक-न्यायिक भाव बनाए रखता है।
- source_word: καὶ μὴ
  choice: तो क्यों न कहें
  rationale: यूनानी वाक्य पिछले तर्क पर निर्भर एक संक्षिप्त प्रश्न है; हिन्दी में ‘तो क्यों न कहें’ निहित प्रश्नार्थक अर्थ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: ὧν में निहित व्यक्तियों की पहचान
  choice: मुख्य पाठ में ‘ऐसे लोगों’ से आरोप लगाने या इस तर्क का समर्थन करने वालों की ओर संकेत
  alternative: ‘उनका’ कहकर सर्वनाम की अस्पष्टता यथावत रखना
  rationale: यूनानी सम्बन्धवाचक सर्वनाम बहुवचन व्यक्तियों की ओर लौटता है। हिन्दी में केवल ‘उनका’ का सन्दर्भ बहुत अस्पष्ट हो सकता था; ‘ऐसे लोगों’ निकटवर्ती आरोपकर्ताओं की ओर संकेत करता है, जबकि पादटिप्पणी व्याख्यात्मक दायरा स्पष्ट करती है।
- issue: καὶ μὴ की दीर्घवृत्तात्मक रचना
  choice: 'पिछले पद के तर्क को आगे बढ़ाने वाला प्रश्न: ‘तो क्यों न कहें’'
  alternative: अधिक शाब्दिक ‘और नहीं’
  rationale: मूल में क्रिया निहित है और वाक्य प्रश्न के रूप में चलता है। पूर्ति अर्थबोध के लिए आवश्यक है, पर इसे सिद्धान्तगत निष्कर्ष के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। उद्धृत नारे में ‘आओ, हम ... करें’ द्वारा यूनानी प्रोत्साहनात्मक रूप रखा गया है। मुख्य पाठ में सभी पादटिप्पणी चिह्न [a], [b] उपस्थित हैं।
