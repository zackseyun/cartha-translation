source:
  edition: SBLGNT
  text: πολὺ κατὰ πάντα τρόπον. πρῶτον μὲν ⸀γὰρ ὅτι ἐπιστεύθησαν τὰ λόγια τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/002.yaml
  text: Much in every way. For first of all[a], they were entrusted with the oracles of God.
translation:
  language: hi
  text: हर तरह से बहुत अधिक। क्योंकि पहली बात तो यह है कि परमेश्वर के वचन[a] उन्हें सौंपे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की दिव्य वाणियाँ।”
    reason: λόγια के लिए अधिक विशिष्ट शाब्दिक विकल्प, जो परमेश्वर से प्राप्त कथनों या घोषणाओं पर बल देता है।
lexical_decisions:
- source_word: πολὺ
  choice: बहुत अधिक
  rationale: यहाँ यह क्रियाविशेषण के रूप में पिछले प्रश्न के उत्तर में लाभ की मात्रा बताता है; यह प्रयोग संक्षिप्त और स्वाभाविक है।
- source_word: κατὰ πάντα τρόπον
  choice: हर तरह से
  rationale: यह मुहावरा व्यापकता व्यक्त करता है और पौलुस के दावे की समग्रता बनाए रखता है।
- source_word: πρῶτον μὲν γὰρ
  choice: क्योंकि पहली बात तो यह है
  rationale: ‘क्योंकि’ γὰρ के व्याख्यात्मक संबंध को और ‘पहली बात तो’ πρῶτον μὲν के क्रमसूचक बल को सहज हिन्दी में व्यक्त करता है, भले ही इसके तुरंत बाद दूसरी बात न कही गई हो।
- source_word: ἐπιστεύθησαν
  choice: उन्हें सौंपे गए
  rationale: यह πιστεύω का कर्मवाच्य रूप है और यहाँ विश्वास करने के बजाय किसी को उत्तरदायित्व के साथ कुछ सौंपने का अर्थ देता है।
- source_word: τὰ λόγια
  choice: वचन
  rationale: λόγια परमेश्वर की कही या प्रकट की हुई बातों को सूचित करता है। ‘वचन’ आधुनिक बाइबलीय हिन्दी में सुबोध और गरिमापूर्ण है; अधिक विशिष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक को सीधे रूप में रखा गया है; इससे अधिकार और स्रोत—दोनों की सम्भावना खुली रहती है।
