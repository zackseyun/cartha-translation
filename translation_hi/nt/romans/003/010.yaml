translation:
  language: hi
  text: 'जैसा लिखा है: “कोई भी धर्मी नहीं है, एक भी नहीं।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: जैसा
  rationale: यह शास्त्रीय उद्धरण की भूमिका को स्वाभाविक और सटीक ढंग से प्रस्तुत करता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य उद्धरण-सूत्र का प्रचलित हिन्दी रूप; यह लिखे हुए वचन की वर्तमान प्रामाणिकता को बनाए रखता है।
- source_word: ὅτι
  choice: ':'
  rationale: हिन्दी में उद्धरण-सूत्र के बाद द्विबिंदु लगाना स्पष्ट और स्वाभाविक है; अलग से ‘कि’ आवश्यक नहीं।
- source_word: Οὐκ ἔστιν
  choice: कोई भी ... नहीं है
  rationale: अस्तित्व और निषेध के संयुक्त भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह पौलुस के नैतिक और परमेश्वर-संबंधी न्याय के अर्थ-क्षेत्र को संक्षेप में सुरक्षित रखता है और हिन्दी बाइबलीय भाषा में परिचित है।
- source_word: οὐδὲ εἷς
  choice: एक भी नहीं
  rationale: यूनानी पदबंध के प्रबल, सर्वसमावेशी निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कथन को किसी ‘धर्मी व्यक्ति’ तक सीमित ढंग से व्यक्त किया जाए या सार्वभौमिक और निरपेक्ष रखा जाए।
  choice: कोई भी धर्मी नहीं है
  alternative: कोई धर्मी व्यक्ति नहीं है
  rationale: यूनानी कथन व्यापक और निरपेक्ष है। चुना हुआ रूप उसकी सार्वभौमिकता और तीखे आलंकारिक बल को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘धर्मी’ बाइबलीय अर्थ को बनाए रखता है, जबकि वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप है।
