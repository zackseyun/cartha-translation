lexical_decisions:
- source_word: σύντριμμα
  choice: विनाश
  rationale: यह शब्द टूटने-कुचलने से उत्पन्न बरबादी या ध्वंस का भाव रखता है। “विनाश” संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: ταλαιπωρία
  choice: दुर्दशा
  rationale: यह गंभीर कष्ट, बदहाली और दयनीय दशा को व्यक्त करता है। “दुर्दशा” आधुनिक हिन्दी में इस व्यापक परिणाम को सहजता से संप्रेषित करती है।
- source_word: ἐν ταῖς ὁδοῖς αὐτῶν
  choice: उनके मार्गों में
  rationale: यह अनुवाद मूल के मार्ग-चित्र को बनाए रखता है और साथ ही उनके आचरण तथा जीवन-क्रम का रूपकात्मक संकेत भी देता है।
- source_word: καὶ
  choice: और
  rationale: दो समानांतर संज्ञाओं को जोड़ने वाला सामान्य संयोजक।
