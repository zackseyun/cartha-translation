id: ROM.3.20
reference: Romans 3:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διότι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σὰρξ ἐνώπιον αὐτοῦ, διὰ γὰρ νόμου ἐπίγνωσις ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/020.yaml
  text: because by works of the law no one will be justified before him, for through the law comes the knowledge of sin.
translation:
  language: hi
  text: क्योंकि व्यवस्था के कामों से कोई भी मनुष्य उसके सामने धर्मी नहीं ठहराया जाएगा, क्योंकि व्यवस्था के द्वारा पाप की पहचान होती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξ ἔργων νόμου
  choice: व्यवस्था के कामों से
  rationale: यह पदबंध व्यवस्था द्वारा अपेक्षित कामों को व्यक्त करता है और मूल की संक्षिप्तता बनाए रखता है।
- source_word: οὐ δικαιωθήσεται
  choice: धर्मी नहीं ठहराया जाएगा
  rationale: न्यायिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है; इसका अर्थ नैतिक रूप से बदलकर धर्मी बनाना मात्र नहीं है।
- source_word: πᾶσα σὰρξ
  choice: कोई भी मनुष्य
  rationale: यहाँ सामी प्रभाव वाला वाक्यांश समस्त मानवजाति को सूचित करता है; शाब्दिक ‘कोई प्राणी’ या ‘कोई देह’ हिन्दी में आशय को धुँधला कर सकता है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: परमेश्वर के न्याय और मूल्यांकन की उपस्थिति का मूल भाव सुरक्षित रहता है; पूर्ववर्ती संदर्भ में सर्वनाम का संकेत स्पष्ट है।
- source_word: ἐπίγνωσις ἁμαρτίας
  choice: पाप की पहचान
  rationale: व्यवस्था द्वारा पाप को जानने और पहचानने का भाव देता है, बिना यह जोड़ने के कि व्यवस्था पाप से मुक्ति भी देती है।
theological_decisions:
- issue: ‘व्यवस्था के कामों’ की सीमा
  choice: व्यवस्था के कामों
  alternative: मूसा की व्यवस्था के पालन से
  rationale: मूल में νόμου के साथ ‘मूसा की’ स्पष्ट रूप से नहीं है; अनुवाद उस संभावित संदर्भ को व्याख्यात्मक रूप से सीमित नहीं करता।
- issue: δικαιόω का स्वरूप
  choice: धर्मी ठहराया जाएगा
  alternative: धर्मी बनाया जाएगा
  rationale: संदर्भ में परमेश्वर के सामने न्यायिक घोषणा प्रमुख है, जबकि ‘बनाया जाएगा’ अनावश्यक रूप से आंतरिक नैतिक परिवर्तन का अर्थ निश्चित कर सकता है।
- issue: πᾶσα σὰρξ का अनुवाद
  choice: कोई भी मनुष्य
  alternative: कोई भी प्राणी
  rationale: पौलुस का कथन यहाँ मानवों की सार्वभौमिक जवाबदेही के विषय में है; यह चयन धर्मवैज्ञानिक दायरे को संकुचित किए बिना स्वाभाविक हिन्दी देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘व्यवस्था’, ‘धर्मी ठहराया जाना’ और ‘पाप की पहचान’ जैसे स्थापित बाइबलीय पदों को बनाए रखते हुए वाक्य को सहज रखा गया है।
