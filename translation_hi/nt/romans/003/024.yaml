base_translation:
  language: en
  yaml_path: translation/nt/romans/003/024.yaml
  text: being justified freely by his grace through the redemption that is in Messiah Jesus[b][a],
translation:
  language: hi
  text: उसके अनुग्रह से बिना किसी मूल्य के, उस छुटकारे के द्वारा जो मसीह यीशु में है, धर्मी ठहराए जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी घोषित किए जाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δικαιούμενοι
  choice: धर्मी ठहराए जाते हैं
  rationale: वर्तमानकालिक कर्मवाच्य कृदन्त का अर्थ और पिछले वाक्य से उसका व्याकरणिक संबंध बनाए रखते हुए पौलुस की न्यायिक भाषा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δωρεὰν
  choice: बिना किसी मूल्य के
  rationale: यह स्पष्ट करता है कि धर्मी ठहराया जाना कमाया या खरीदा नहीं जाता, बल्कि निःशुल्क मिलता है; यह आधुनिक हिन्दी में ‘सेंतमेंत’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: τῇ αὐτοῦ χάριτι
  choice: उसके अनुग्रह से
  rationale: ‘अनुग्रह’ पौलुस की χάρις-संबंधी भाषा का स्थापित हिन्दी प्रतिशब्द है और परमेश्वर की अयोग्य पात्रों पर की गई कृपालु पहल को व्यक्त करता है।
- source_word: ἀπολυτρώσεως
  choice: छुटकारे
  rationale: यह बंधन से मुक्त किए जाने के केंद्रीय भाव को सरल, परिचित हिन्दी में रखता है और मुख्य पाठ में भुगतान की प्रक्रिया को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: जो मसीह यीशु में है
  rationale: संबंधवाचक संरचना यह स्पष्ट करती है कि यूनानी पदबंध ‘छुटकारे’ को विशेषित करता है। Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ किया गया है।
theological_decisions:
- issue: पौलुस की धर्मी ठहराने की भाषा
  choice: धर्मी ठहराए जाते हैं
  alternative: धर्मी घोषित किए जाते हैं
  rationale: मुख्य पाठ में संक्षिप्त न्यायिक-पौलुसी अभिव्यक्ति रखी गई है। वैकल्पिक रूप न्यायालयीन घोषणा का भाव अधिक स्पष्ट करता है, पर मुख्य पाठ में क्रिया के आशय को अनावश्यक रूप से सीमित कर सकता है।
- issue: ἐν Χριστῷ Ἰησοῦ में संबंध
  choice: वह छुटकारा जो मसीह यीशु में है
  alternative: मसीह यीशु के द्वारा मिला छुटकारा
  rationale: यूनानी ἐν को ‘में’ रखकर मसीह से छुटकारे के संबंध की वास्तविक व्यापकता और कुछ हद तक अस्पष्टता सुरक्षित रखी गई है; इसे केवल साधनवाचक ‘के द्वारा’ में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। पद यूनानी में पिछले कथन पर निर्भर कृदन्तीय खंड है; इसलिए हिन्दी में भी नया कर्ता या संयोजक नहीं जोड़ा गया। ‘मसीह’ हिन्दी में Χριστός की उपाधिगत अर्थवत्ता स्वाभाविक रूप से व्यक्त करता है, अतः ‘Christ’ बनाम ‘Messiah’ का अंग्रेज़ी-विशिष्ट पादटिप्पणी-भेद यहाँ उपयोगी नहीं है।
