    reason: alternative_reading
lexical_decisions:
- source_word: πάντες
  choice: सबने / वे
  rationale: संदर्भ में इसका दायरा समस्त मनुष्यों तक है। हिन्दी वाक्य में पहले ‘सबने’ और फिर क्रिया के साथ ‘वे’ रखने से सार्वभौमिक कथन स्वाभाविक और स्पष्ट रहता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले के कथन का आधार या स्पष्टीकरण देता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: ἥμαρτον
  choice: पाप किया है
  rationale: यूनानी अओरिस्ट मानव-पाप के तथ्य को समग्र रूप में प्रस्तुत करता है। ‘पाप किया है’ उस घटित वास्तविकता और उसकी वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑστεροῦνται
  choice: वंचित हैं
  rationale: वर्तमानकालीन क्रिया निरंतर अभाव की दशा बताती है। ‘वंचित हैं’ हिन्दी में इस कमी को स्पष्ट करता है, जबकि टिप्पणी में ‘महिमा तक नहीं पहुँचते’ और ‘महिमा की कमी है’ जैसे संभावित अर्थ सुरक्षित रखे गए हैं।
- source_word: δόξης
  choice: महिमा
  rationale: ‘महिमा’ δόξα का स्थापित, गरिमापूर्ण और प्रसंगानुकूल हिन्दी प्रतिशब्द है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक पद का सीधा अनुवाद मूल की संक्षिप्तता और अर्थगत खुलेपन को बनाए रखता है।
theological_decisions:
- issue: ‘परमेश्वर की महिमा’ का आशय
  choice: मुख्य पाठ में तटस्थ रूप से ‘परमेश्वर की महिमा’ रखा गया है।
  alternative: परमेश्वर की अपनी महिमा; वह महिमा जिसे मनुष्यों को प्रतिबिंबित करना था; परमेश्वर से मिलने वाली महिमा
  rationale: यूनानी पदबंध संक्षिप्त है और इन अर्थ-संभावनाओं को पूरी तरह सीमित नहीं करता; इसलिए मुख्य पाठ किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। ‘वंचित हैं’ सामान्य पाठक के लिए सहज है और वर्तमान अभाव की दशा को व्यक्त करता है। मूल की अर्थगत और धर्मवैज्ञानिक अस्पष्टता पादटिप्पणियों में सुरक्षित रखी गई है।
