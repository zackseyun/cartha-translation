  text: क्योंकि सभी ने पाप किया है और परमेश्वर की महिमा से वंचित हैं[a][b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की महिमा तक नहीं पहुँचते” अथवा “परमेश्वर की महिमा से रहित हैं।”
