- from: तो क्या हम विश्वास के द्वारा व्यवस्था को निष्प्रभावी ठहराते हैं? कदापि नहीं! इसके विपरीत, हम व्यवस्था को दृढ़ ठहराते हैं।[a]
  to: तो क्या हम विश्वास के द्वारा व्यवस्था को निष्प्रभावी कर देते हैं? कदापि नहीं! बल्कि, हम व्यवस्था को कायम रखते हैं[a]।
