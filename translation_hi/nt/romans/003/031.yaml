base_translation:
  language: en
  yaml_path: translation/nt/romans/003/031.yaml
  text: Do we then nullify the law through faith? May it never be! On the contrary[a], we uphold the law.
translation:
  language: hi
  text: तो क्या हम विश्वास के द्वारा व्यवस्था को निष्प्रभावी कर देते हैं? कदापि नहीं! बल्कि, हम व्यवस्था को कायम रखते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम व्यवस्था को स्थापित करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμον
  choice: व्यवस्था
  rationale: रोमियों के इस तर्क में यह मूसा की व्यवस्था/तोरा की निश्चित धारणा को सूचित करता है। हिन्दी बाइबलीय प्रयोग में “व्यवस्था” स्वाभाविक और परिचित है।
- source_word: οὖν
  choice: तो
  rationale: यह पिछले तर्क से निकलने वाले आलंकारिक निष्कर्ष को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καταργοῦμεν
  choice: निष्प्रभावी ठहराते हैं
  rationale: यह क्रिया किसी चीज़ को बेअसर या निष्फल कर देने का भाव रखती है; “मिटा देते” या “समाप्त करते” की अपेक्षा मूल अर्थ की व्यापकता को सुरक्षित रखती है।
- source_word: διὰ τῆς πίστεως
  choice: विश्वास के द्वारा
  rationale: διά के संबंधकारक रूप के साधनात्मक भाव को स्पष्ट रखता है और πίστις के लिए मानक हिन्दी “विश्वास” का प्रयोग करता है।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: पौलुस के अत्यंत प्रबल निषेध को गरिमापूर्ण, संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ
  choice: इसके विपरीत
  rationale: यह पहले कथन का तीखा खंडन और उसके बाद आने वाले सकारात्मक प्रतिपक्ष को स्पष्ट करता है।
- source_word: ἱστάνομεν
  choice: दृढ़ ठहराते हैं
  rationale: ἵστημι के ‘स्थिर करना, कायम रखना, स्थापित करना’ अर्थक्षेत्र को बनाए रखता है और व्यवस्था को पहली बार अस्तित्व में लाने का अनचाहा संकेत नहीं देता।
theological_decisions:
- issue: विश्वास और व्यवस्था का संबंध
  choice: हम व्यवस्था को दृढ़ ठहराते हैं
  alternative: हम व्यवस्था को स्थापित करते हैं
  rationale: यूनानी क्रिया ‘स्थापित करना’ या ‘कायम रखना’ दोनों भाव दे सकती है। मुख्य पाठ का “दृढ़ ठहराते हैं” इस बात पर बल देता है कि विश्वास व्यवस्था को निष्प्रभावी नहीं करता, जबकि किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं थोपता; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। पौलुस के प्रश्न, प्रबल निषेध और विरोधात्मक उत्तर की लय सुरक्षित रखी गई है।
