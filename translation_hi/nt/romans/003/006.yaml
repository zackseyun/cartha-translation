  text: Absolutely not! Otherwise[a], how will God judge the world?
translation:
  language: hi
  text: बिलकुल नहीं! नहीं तो, परमेश्वर संसार का न्याय कैसे करेगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: यह यूनानी प्रयोग पिछले निष्कर्ष का प्रबल और रूढ़िगत खंडन है। ‘कदापि नहीं!’ उसके बल को स्वाभाविक, संक्षिप्त और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπεὶ
  choice: नहीं तो
  rationale: यहाँ यह अस्वीकार किए गए कथन के परिणाम की ओर ले जाता है; ‘नहीं तो’ पौलुस के तर्क का प्रवाह स्पष्ट और स्वाभाविक रखता है।
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: यूनानी क्रिया भविष्यत् सूचक है, इसलिए ‘न्याय करेगा’ काल और अर्थ दोनों को सीधे बनाए रखता है।
- source_word: κόσμον
  choice: संसार
  rationale: यहाँ κόσμος परमेश्वर के न्याय के व्यापक विषय को दर्शाता है; ‘संसार’ इसका प्रचलित और सहज हिन्दी समतुल्य है।
theological_decisions:
- issue: μὴ γένοιτο में पौलुस के खंडन का बल
  choice: पिछले निष्कर्ष का प्रबल खंडन—‘कदापि नहीं!’
  alternative: अधिक शाब्दिक कामनासूचक रूप, जैसे ‘ऐसा कभी न हो!’
  rationale: यह एक रूढ़िगत पौलुसी निषेध-वाक्य है। मुहावरेदार अनुवाद उसके वास्तविक बल को सुरक्षित रखता है, बिना किसी अतिरिक्त सैद्धान्तिक अर्थ को जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। अलंकारिक प्रश्न तथा यूनानी भविष्यत् काल सुरक्षित रखे गए हैं।
