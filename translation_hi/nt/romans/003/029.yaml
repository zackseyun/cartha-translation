  text: Or is God the God of the Jews only? Is he not also the God of the Gentiles? Yes[a], of the Gentiles also.
translation:
  language: hi
  text: या क्या परमेश्वर केवल यहूदियों का परमेश्वर है? क्या वह गैर-यहूदियों का भी परमेश्वर नहीं है? हाँ, गैर-यहूदियों का भी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गैर-यहूदियों” के लिए यूनानी शब्द का अधिक शाब्दिक अनुवाद “राष्ट्रों” या “जातियों” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: तो क्या
  rationale: यह पद पौलुस के पिछले तर्क से जुड़ा एक नया आलंकारिक विकल्प प्रस्तुत करता है; हिंदी में ‘तो क्या’ उस तार्किक प्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἰουδαίων
  choice: यहूदियों का
  rationale: संबंधकारक रूप θεὸς के साथ है; ‘यहूदियों का परमेश्वर’ सहज हिंदी है और समूह-संदर्भ को स्पष्ट रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए प्रतिष्ठित और गरिमापूर्ण हिंदी प्रतिशब्द; दूसरे प्रश्न में स्पष्टता और स्वाभाविकता के लिए इसे दोहराया गया है।
- source_word: μόνον
  choice: केवल
  rationale: विशेषाधिकार की सीमा बताने वाले यूनानी बल को सीधे बनाए रखता है।
- source_word: οὐχὶ
  choice: क्या ... नहीं है?
  rationale: यह प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिंदी की नकारात्मक प्रश्न-रचना उस आलंकारिक बल को सुरक्षित रखती है।
- source_word: ἐθνῶν
  choice: गैर-यहूदियों का
  rationale: यहाँ यहूदियों के साथ स्पष्ट विरोध में ἔθνη का अर्थ गैर-यहूदी लोग है; यह आधुनिक सामान्य हिंदी में ‘अन्यजातियों’ से अधिक तुरंत समझ में आता है।
- source_word: ναὶ
  choice: हाँ
  rationale: संक्षिप्त और प्रत्यक्ष सकारात्मक उत्तर यूनानी संवादात्मक बल को बनाए रखता है।
- source_word: καὶ
  choice: भी
  rationale: गैर-यहूदियों को यहूदियों के साथ शामिल किए जाने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ἐθνῶν का अनुवाद ‘गैर-यहूदी’ किया जाए या ‘राष्ट्र/जातियाँ’
  choice: गैर-यहूदी
  alternative: राष्ट्रों या जातियों के लोग
  rationale: यहूदी–ἔθνη विरोध के कारण आशय राजनीतिक राष्ट्र नहीं, बल्कि यहूदी समुदाय से बाहर के लोग हैं। ‘गैर-यहूदी’ इसे स्पष्ट रखता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प दर्ज करती है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक पठन में सहज। ‘अन्यजाति’ जैसे पारंपरिक किंतु आज कम स्वाभाविक शब्द के स्थान पर ‘गैर-यहूदी’ चुना गया है। पादटिप्पणी-चिह्न संबंधित अभिव्यक्ति के बाद रखा गया है।
