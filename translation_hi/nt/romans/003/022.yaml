source:
  edition: SBLGNT
  text: δικαιοσύνη δὲ θεοῦ διὰ πίστεως Ἰησοῦ Χριστοῦ, εἰς ⸀πάντας τοὺς πιστεύοντας, οὐ γάρ ἐστιν διαστολή.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/022.yaml
  text: And the righteousness of God through faith in Jesus the Messiah[a], for all who believe[b]; for there is no distinction.
translation:
  language: hi
  text: और परमेश्वर की धार्मिकता[a] यीशु मसीह पर विश्वास[b] के द्वारा उन सभी के लिए है जो विश्वास करते हैं; क्योंकि कोई भेद नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का न्याय।”
    reason: lexical_alternative
  - marker: b
    text: या, “यीशु मसीह की विश्वासयोग्यता के द्वारा।”
    reason: alternative_reading
lexical_decisions:
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के इस प्रसंग में यह शब्द परमेश्वर की धार्मिकता, उसके धर्मी कार्य और उससे मिलने वाली धर्मी स्थिति की व्यापकता बनाए रखता है; ‘न्याय’ को वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्धकारक रूप को सीधे और व्यापक अर्थ वाला रखा गया है, बिना इसे केवल ‘परमेश्वर से मिलने वाली’ के रूप में सीमित किए।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: πίστις का सामान्य और प्रसंगानुकूल हिन्दी रूप ‘विश्वास’ है; विवादित सम्बन्धकारक रचना के कारण ‘विश्वासयोग्यता’ वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός को उसके उपाधिगत अर्थ में ‘मसीह’ कहा गया है; हिन्दी में ‘यीशु मसीह’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: εἰς πάντας τοὺς πιστεύοντας
  choice: उन सभी के लिए जो विश्वास करते हैं
  rationale: यह समावेशी πάντας और वर्तमान कृदन्त πιστεύοντας दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διαστολή
  choice: भेद
  rationale: यह प्रसंग में लोगों के बीच किसी भिन्न आधार या अलग दर्जे के न होने को सरल और स्वाभाविक हिन्दी में बताता है।
theological_decisions:
- issue: πίστεως Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह पर विश्वास
  alternative: यीशु मसीह की विश्वासयोग्यता
  rationale: यूनानी सम्बन्धकारक रचना वस्तुनिष्ठ और कर्तृवाचक—दोनों प्रकार से समझी जा सकती है। मुख्य पाठ में अधिक प्रचलित वस्तुनिष्ठ अर्थ रखा गया है, और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित किया गया है।
- issue: δικαιοσύνη θεοῦ
  choice: परमेश्वर की धार्मिकता
  alternative: परमेश्वर का न्याय
  rationale: यह पद परमेश्वर के धर्मी चरित्र और कार्य तथा उसके द्वारा दी जाने वाली धर्मी स्थिति की ओर संकेत कर सकता है। मुख्य पाठ व्यापक पारंपरिक पद रखता है और न्याय का अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और धर्मशास्त्रीय रूप से खुला अनुवाद। यूनानी वाक्य में निहित क्रिया को हिन्दी की स्वाभाविकता के लिए ‘है’ से व्यक्त किया गया है। ‘धार्मिकता’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि उनके वास्तविक वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
