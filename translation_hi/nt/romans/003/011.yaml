lexical_decisions:
- source_word: συνίων
  choice: समझनेवाला
  rationale: यह वर्तमान कृदन्त सूझ-बूझ से समझने का अर्थ देता है। ‘समझनेवाला’ सहज हिन्दी में इसके संज्ञात्मक प्रयोग को बनाए रखता है।
- source_word: ἐκζητῶν
  choice: खोजनेवाला
  rationale: इस संयुक्त क्रिया में लगन या गंभीरता से खोजने की छाया हो सकती है, पर ‘परमेश्वर को खोजनेवाला’ आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से पर्याप्त है।
- source_word: οὐκ ἔστιν
  choice: कोई ... नहीं है
  rationale: यह हिन्दी प्रयोग यूनानी के स्पष्ट और सार्वभौमिक निषेध को स्वाभाविक ढंग से व्यक्त करता है; दोनों खंडों में इसकी पुनरावृत्ति मूल का बल बनाए रखती है।
- source_word: ὁ συνίων / ὁ ἐκζητῶν
  choice: समझनेवाला / खोजनेवाला
  rationale: संज्ञा के रूप में प्रयुक्त यूनानी कृदन्तों के लिए ‘-नेवाला’ संरचना स्वाभाविक हिन्दी समतुल्य है।
- source_word: τὸν θεόν
  choice: परमेश्वर को
  rationale: ‘परमेश्वर’ आधुनिक मानक हिन्दी में θεός का प्रतिष्ठित और स्पष्ट अनुवाद है; ‘को’ सकर्मक क्रिया के कर्म को चिह्नित करता है।
theological_decisions:
- issue: पौलुस के उद्धरण में निषेध का विस्तार
  choice: दोनों खंडों में निरपेक्ष कथन ‘कोई ... नहीं है’ बनाए रखा गया है।
  alternative: ‘कोई सचमुच नहीं समझता; कोई वास्तव में परमेश्वर को नहीं खोजता।’
  rationale: यूनानी पाठ स्पष्ट, श्रेणीगत निषेध करता है। ‘सचमुच’ या ‘वास्तव में’ जोड़ना व्याख्यात्मक योग होगा और मूल कथन के तनाव को अनावश्यक रूप से हल्का कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्यरचना और ‘कोई ... नहीं है’ की पुनरावृत्ति मूल यूनानी के बल तथा लय को सुरक्षित रखती है।
