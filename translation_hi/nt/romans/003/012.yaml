  text: πάντες ἐξέκλιναν, ἅμα ἠχρεώθησαν· οὐκ ⸀ἔστιν ποιῶν χρηστότητα, οὐκ ἔστιν ἕως ἑνός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/012.yaml
  text: All have turned aside[a]; together they have become worthless. There is no one who does what is good[b]; there is not even one.
translation:
  language: hi
  text: सब मार्ग से हट गए हैं; वे सब मिलकर निकम्मे हो गए हैं।[a] भलाई करने वाला कोई नहीं है,[b] एक भी नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्प्रयोज्य हो गए हैं” अथवा “व्यर्थ हो गए हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “अच्छाई करने वाला कोई नहीं है”; χρηστότητα में “दयालुता” का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντες
  choice: सब
  rationale: यूनानी बहुवचन के सार्वभौमिक दायरे को बिना कोई अतिरिक्त संज्ञा जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξέκλιναν
  choice: मार्ग से हट गए हैं
  rationale: नैतिक पथ से विचलन का भाव स्पष्ट करता है और यूनानी क्रिया के पूर्ण हो चुके परिणाम को बनाए रखता है।
- source_word: ἅμα
  choice: सब मिलकर
  rationale: यहाँ सामूहिक अर्थ को व्यक्त करता है कि सभी एक ही दशा में आ गए हैं।
- source_word: ἠχρεώθησαν
  choice: निकम्मे हो गए हैं
  rationale: निष्प्रयोज्य या मूल्यहीन हो जाने के प्रबल नकारात्मक भाव और परिणामसूचक कर्मवाच्य को सहज हिन्दी में रखता है।
- source_word: ποιῶν
  choice: करने वाला
  rationale: यूनानी कृदन्त के सामान्य या चरित्रगत कार्य के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χρηστότητα
  choice: भलाई
  rationale: नैतिक अच्छाई का अर्थ स्पष्ट रखता है, जबकि ‘दयालुता’ का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: οὐκ ἔστιν
  choice: कोई नहीं है
  rationale: अस्तित्व के स्पष्ट निषेध को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: ἕως ἑνός
  choice: एक भी नहीं
  rationale: यूनानी मुहावरे के जोरदार निष्कर्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
