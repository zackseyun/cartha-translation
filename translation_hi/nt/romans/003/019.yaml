source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι ὅσα ὁ νόμος λέγει τοῖς ἐν τῷ νόμῳ λαλεῖ, ἵνα πᾶν στόμα φραγῇ καὶ ὑπόδικος γένηται πᾶς ὁ κόσμος τῷ θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/019.yaml
  text: We know that whatever the law says[a], it speaks to those under the law[c][b], so that every mouth may be stopped and the whole world may become accountable to God.
translation:
  language: hi
  text: पर हम जानते हैं कि व्यवस्था जो कुछ कहती है, वह उन लोगों से कहती है जो व्यवस्था के अधीन हैं[a], ताकि हर मुँह बंद हो जाए[b] और सारा संसार परमेश्वर के प्रति उत्तरदायी ठहरे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “जो व्यवस्था में हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “हर मुँह बंद किया जाए।”
    reason: lexical_alternative
  - marker: c
    text: या “जवाबदेह ठहरे,” “परमेश्वर के न्याय के अधीन ठहरे,” अथवा “परमेश्वर के सामने दोषी ठहरे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν δὲ
  choice: पर हम जानते हैं
  rationale: Οἴδαμεν को साझा और वर्तमान ज्ञान के कथन के रूप में तथा δέ को प्रसंगगत हल्के विरोध/संक्रमण के रूप में व्यक्त किया गया है; इसमें कोई कालवाचक ‘अब’ नहीं जोड़ा गया।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: पौलुस के संदर्भ में यह परमेश्वर की मान्य विधि/व्यवस्था को सूचित करता है; ‘व्यवस्था’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: τοῖς ἐν τῷ νόμῳ
  choice: जो व्यवस्था के अधीन हैं
  rationale: यूनानी का शब्दशः रूप ‘व्यवस्था में’ है, पर यहाँ उसके अधिकार-क्षेत्र में आने का भाव है; मुख्य पाठ में स्वाभाविक हिन्दी रखी गई और शब्दशः विकल्प पादटिप्पणी में दिया गया।
- source_word: λέγει ... λαλεῖ
  choice: कहती है ... कहती है
  rationale: यूनानी में दो अलग क्रियाएँ हैं, किंतु इस वाक्य में हिन्दी में ‘कहती है ... बोलती है’ अस्वाभाविक लगता। अर्थ की स्पष्टता और सहजता के लिए पुनरुक्ति स्वीकार की गई।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम की दिशा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: πᾶν στόμα φραγῇ
  choice: हर मुँह बंद हो जाए
  rationale: मूल न्यायिक रूपक को बनाए रखते हुए सभी प्रतिवाद या सफाई के शांत हो जाने का भाव व्यक्त करता है।
- source_word: ὑπόδικος γένηται
  choice: उत्तरदायी ठहरे
  rationale: ὑπόδικος के न्यायिक उत्तरदायित्व और γένηται के किसी स्थिति में ठहराए जाने/आने के भाव को व्यक्त करता है, बिना सीधे अंतिम दोषसिद्धि घोषित किए।
- source_word: πᾶς ὁ κόσμος
  choice: सारा संसार
  rationale: समस्त मानव-जगत को समेटने वाले व्यापक दायरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के प्रति
  rationale: सम्प्रदान कारक के उस संबंध को दर्शाता है जिसमें संसार परमेश्वर को उत्तर देने योग्य और उसके न्याय के अधीन है।
theological_decisions:
- issue: ὑπόδικος का न्यायिक बल और परमेश्वर के न्याय से उसका संबंध
  choice: ‘सारा संसार परमेश्वर के प्रति उत्तरदायी ठहरे’
  alternative: ‘सारा संसार परमेश्वर के सामने दोषी ठहरे’ अथवा ‘परमेश्वर के न्याय के अधीन ठहरे’
  rationale: मूल शब्द परमेश्वर के न्यायालय के सामने उत्तर देने योग्य और दंडनीय स्थिति का प्रबल न्यायिक भाव रखता है, पर स्वयं अनिवार्य रूप से अंतिम दोषसिद्धि का पूरा कथन नहीं करता। ‘उत्तरदायी ठहरे’ इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘व्यवस्था,’ ‘हर मुँह बंद हो जाए,’ और ‘उत्तरदायी ठहरे’ मूल के वाचा-संबंधी तथा न्यायिक स्वर को सामान्य पाठक के लिए समझने योग्य ढंग से बनाए रखते हैं।
