lexical_decisions:
- source_word: Τί οὖν
  choice: तो फिर
  rationale: यह पौलुस के निष्कर्षसूचक संक्रमण और अलंकारिक प्रश्न को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τὸ περισσὸν τοῦ Ἰουδαίου
  choice: यहूदी होने का क्या लाभ
  rationale: περισσόν यहाँ विशेष लाभ या बढ़त के अर्थ में है। हिन्दी में भाववाचक रचना प्रतिनिधिक एकवचन का आशय स्वाभाविक रूप से व्यक्त करती है और जातीय श्रेष्ठता का अनावश्यक संकेत नहीं देती।
- source_word: ἢ τίς ἡ ὠφέλεια
  choice: या ... क्या फायदा है
  rationale: दूसरे समानांतर प्रश्न को स्पष्ट रखता है; ‘फायदा’ पहले खंड के ‘लाभ’ से हल्का शब्दगत अंतर भी सुरक्षित रखता है।
- source_word: τῆς περιτομῆς
  choice: खतना कराने से
  rationale: संदर्भ में यह यहूदी पहचान के वाचा-चिह्न के रूप में खतना ग्रहण करने की बात है। यह हिन्दी में ‘खतने का लाभ’ की अपेक्षा अधिक स्वाभाविक है, जबकि रीति का सीधा उल्लेख बना रहता है।
theological_decisions:
- issue: τοῦ Ἰουδαίου के प्रतिनिधिक एकवचन को हिन्दी में कैसे व्यक्त किया जाए
  choice: यहूदी होने का
  alternative: यहूदी व्यक्ति का
  rationale: यूनानी पद एक यहूदी को पूरी श्रेणी के प्रतिनिधि के रूप में रखता है। ‘यहूदी होने का’ उसी सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना केवल पुरुष का अर्थ लगाने या बहुवचन द्वारा शैली बदलने के।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लाभ’ और ‘फायदा’ से दोनों यूनानी संज्ञाओं का हल्का अंतर सुनाई देता है; ‘खतना’ सामान्य आधुनिक हिन्दी में पहचाना जाने वाला सीधा शब्द है।
