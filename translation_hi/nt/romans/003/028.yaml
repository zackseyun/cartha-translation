base_translation:
  language: en
  yaml_path: translation/nt/romans/003/028.yaml
  text: For we conclude that a person is justified by faith apart from works of the law[a][b].
translation:
  language: hi
  text: क्योंकि हम इस निष्कर्ष पर पहुँचते हैं कि मनुष्य व्यवस्था के कामों से अलग, विश्वास के द्वारा धर्मी ठहराया जाता है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी घोषित किया जाता है।”
    reason: lexical_alternative
  - marker: b
    text: “मनुष्य” के लिए प्रयुक्त यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग है, पर यहाँ सामान्य अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λογιζόμεθα
  choice: हम इस निष्कर्ष पर पहुँचते हैं
  rationale: यह क्रिया पौलुस के तर्क से निकले विचारपूर्ण निष्कर्ष को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन के लिए आधार या स्पष्टीकरण प्रस्तुत करने वाला संबंध बनाए रखता है।
- source_word: δικαιοῦσθαι
  choice: धर्मी ठहराया जाता है
  rationale: यह निष्क्रिय रूप और पौलुस के न्यायिक-घोषणात्मक भाव को हिन्दी की प्रचलित बाइबलीय अभिव्यक्ति में सुरक्षित रखता है।
- source_word: πίστει
  choice: विश्वास के द्वारा
  rationale: यह साधनसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और πίστις के अर्थ को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: ἄνθρωπον
  choice: मनुष्य
  rationale: यहाँ शब्द किसी विशेष पुरुष के लिए नहीं, बल्कि सामान्य मानव व्यक्ति के लिए प्रयुक्त है; हिन्दी में 'मनुष्य' इस व्यापक अर्थ को व्यक्त करता है।
- source_word: χωρὶς
  choice: से अलग
  rationale: यह विश्वास द्वारा धर्मी ठहराए जाने को व्यवस्था के कामों से पृथक रखने का अर्थ स्पष्ट करता है।
- source_word: ἔργων νόμου
  choice: व्यवस्था के कामों
  rationale: यह पौलुस की विशिष्ट पदावली का औपचारिक संबंध बनाए रखता है और इसे केवल अच्छे कामों या नैतिक प्रयास तक सीमित नहीं करता।
theological_decisions:
- issue: δικαιοῦσθαι का पौलुसी अर्थ
  choice: धर्मी ठहराया जाता है
  alternative: धर्मी घोषित किया जाता है
  rationale: मुख्य पाठ में प्रचलित और सटीक अभिव्यक्ति रखी गई है; पादटिप्पणी घोषणात्मक अर्थ को स्पष्ट विकल्प के रूप में सुरक्षित रखती है।
- issue: ἄνθρωπον का सामान्य अर्थ
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग है, पर यहाँ उसका संदर्भ समस्त मानव जाति से है; 'मनुष्य' हिन्दी में इस प्रतिनिधिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- issue: ἔργων νόμου की सीमा
  choice: व्यवस्था के कामों
  alternative: व्यवस्था के अनुसार किए गए कामों
  rationale: शाब्दिक रूप से निकट पदावली जानबूझकर सुरक्षित रखी गई है, ताकि पाठ स्वयं यह निर्धारित करने दे कि इसमें किन कामों का समावेश है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य का तर्कसूचक आरंभ और विश्वास तथा व्यवस्था के कामों के बीच मूल विरोध सुरक्षित है।
