id: ROM.3.5
reference: Romans 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ἡ ἀδικία ἡμῶν θεοῦ δικαιοσύνην συνίστησιν, τί ἐροῦμεν; μὴ ἄδικος ὁ θεὸς ὁ ἐπιφέρων τὴν ὀργήν; κατὰ ἄνθρωπον λέγω.
base_translation:
  language: en
  yaml_path: translation/nt/romans/003/005.yaml
  text: But if our unrighteousness demonstrates God’s righteousness[a], what shall we say? Is God unjust to inflict wrath? (I am speaking in a human way.)
translation:
  language: hi
  text: पर यदि हमारी अधार्मिकता परमेश्वर की धार्मिकता[a] को दिखाती है, तो हम क्या कहें? क्या क्रोध लाने वाला परमेश्वर अन्यायी है? (मैं मनुष्य की रीति से कह रहा हूँ।)
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारा अन्याय परमेश्वर के न्याय को दिखाता है।”
    reason: ἀδικία और δικαιοσύνη यहाँ क्रमशः ‘अन्याय’ और ‘न्याय’ भी व्यक्त कर सकते हैं।
lexical_decisions:
- source_word: ἀδικία
  choice: अधार्मिकता
  rationale: यह शब्द मनुष्य की नैतिक अनुचितता को व्यक्त करता है और δικαιοσύνη के साथ पौलुस के विरोधाभास को बनाए रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: यह सामान्य पौलुसी अर्थ और ἀδικία के नैतिक-वाचक विरोध को सुरक्षित रखता है; ‘न्याय’ की प्रासंगिक संभावना पादटिप्पणी में दी गई है।
- source_word: συνίστησιν
  choice: स्पष्ट रूप से दिखाती है
  rationale: संदर्भ में इसका अर्थ किसी बात को प्रत्यक्ष या प्रमाणित करना है; यह आधुनिक हिंदी में सहज और स्पष्ट है।
- source_word: μὴ ἄδικος
  choice: क्या ... परमेश्वर अन्यायी है?
  rationale: प्रश्नात्मक रूप को बनाए रखा गया है; μή से अपेक्षित नकारात्मक उत्तर का संकेत मिलता है, पर उत्तर को अनुवाद में जोड़कर तनाव समाप्त नहीं किया गया।
- source_word: ἐπιφέρων τὴν ὀργήν
  choice: क्रोध बरसाने वाला
  rationale: यह न्यायिक दंड के रूप में क्रोध लाने या लागू करने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: κατὰ ἄνθρωπον λέγω
  choice: मैं मनुष्य की रीति से कह रहा हूँ
  rationale: यह पौलुस के इस स्पष्टीकरण को बनाए रखता है कि वह मानवीय ढंग की दलील प्रस्तुत कर रहा है।
theological_decisions:
- issue: परमेश्वर के न्याय के विषय में पौलुस के आलंकारिक प्रश्न का रूप
  choice: क्या क्रोध बरसाने वाला परमेश्वर अन्यायी है?
  alternative: क्रोध बरसाने वाला परमेश्वर अन्यायी तो नहीं है?
  rationale: मुख्य पाठ में यूनानी प्रश्न का सीधा रूप और उसका धर्मवैचारिक तनाव सुरक्षित रखा गया है। μή नकारात्मक उत्तर की अपेक्षा का संकेत देता है, किंतु उसे स्पष्ट उत्तर बनाकर पाठ में नहीं जोड़ा गया।
- issue: ἀδικία और δικαιοσύνη का नैतिक अथवा न्यायिक अर्थ
  choice: अधार्मिकता / धार्मिकता
  alternative: अन्याय / न्याय
  rationale: मुख्य पाठ नैतिक-सम्बन्धपरक विरोध को सामने रखता है, जबकि न्यायिक अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। आलंकारिक प्रश्न और कोष्ठकीय मानवीय दृष्टिकोण-सूचक कथन को स्रोत के अनुरूप बनाए रखा गया है।
