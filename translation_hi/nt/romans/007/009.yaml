source:
  edition: SBLGNT
  text: ἐγὼ δὲ ἔζων χωρὶς νόμου ποτέ· ἐλθούσης δὲ τῆς ἐντολῆς ἡ ἁμαρτία ἀνέζησεν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/009.yaml
  text: I was once alive apart from the law[a], but when the commandment came, sin came to life,
translation:
  language: hi
  text: मैं तो एक समय व्यवस्था के बिना जीवित था; पर जब आज्ञा आई, तब पाप जीवित हो उठा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाप फिर से जी उठा।”
    reason: ἀνέζησεν में पुनर्जीवित होने की अर्थछाया संभव है।
lexical_decisions:
- source_word: ἔζων
  choice: जीवित था
  rationale: केवल ‘जीता था’ के बजाय जीवन की अवस्था व्यक्त की गई है, ताकि निकटवर्ती जीवन-मृत्यु का विरोध बना रहे।
- source_word: χωρὶς νόμου
  choice: व्यवस्था से अलग
  rationale: χωρίς की अलगाव-सूचक शक्ति को स्वाभाविक हिन्दी में रखा गया है; ‘व्यवस्था’ यहाँ पौलुस के νόμος-संबंधी प्रयोग के अनुरूप है।
- source_word: ποτέ
  choice: कभी
  rationale: यह पूर्व समय की ओर संकेत करने वाला संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: ἐλθούσης ... τῆς ἐντολῆς
  choice: जब आज्ञा आई
  rationale: यूनानी genitive absolute को अर्थ सुरक्षित रखते हुए स्वाभाविक हिन्दी कालवाचक उपवाक्य में बदला गया है।
- source_word: ἐντολῆς
  choice: आज्ञा
  rationale: यह νόμος से संबंधित होते हुए भी अलग शब्द को बनाए रखता है और बाइबलीय हिन्दी में सहज है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: एकवचन और मानवीकृत प्रयोग को ज्यों का त्यों रखा गया है।
- source_word: ἀνέζησεν
  choice: जीवित हो उठा
  rationale: यह मानवीकृत पाप के सक्रिय हो उठने का रूपक स्पष्ट रखता है, जबकि ‘फिर से जी उठा’ की संभावित अर्थछाया को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: ‘मैं’ को आत्मकथात्मक, प्रतिनिधिक अथवा उद्धार-इतिहास संबंधी कथन के रूप में स्पष्ट करना
  choice: सरल प्रथम-पुरुष कथन को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे केवल पौलुस का निजी अनुभव, या इस्राएल अथवा व्यवस्था के अधीन मानवता का प्रतिनिधिक कथन बनाकर स्पष्ट किया जा सकता था।
  rationale: यह पद अकेले इन व्याख्याओं में निर्णय नहीं करता; इसलिए अनुवाद मूल की धर्मवैज्ञानिक अस्पष्टता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘व्यवस्था’ और ‘आज्ञा’ जैसे स्थापित बाइबलीय शब्द बनाए रखते हुए वाक्य-संरचना को स्वाभाविक रखा गया है।
