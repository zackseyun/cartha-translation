source:
  edition: SBLGNT
  text: Ὥστε, ἀδελφοί μου, καὶ ὑμεῖς ἐθανατώθητε τῷ νόμῳ διὰ τοῦ σώματος τοῦ Χριστοῦ, εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ, τῷ ἐκ νεκρῶν ἐγερθέντι ἵνα καρποφορήσωμεν τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/004.yaml
  text: So then[a], my brothers, you also were put to death to the law through the body of the Messiah[c][b], so that you might belong to another—to him who was raised from the dead—in order that we might bear fruit for God.
translation:
  language: hi
  text: इसलिए, मेरे भाइयो[a], तुम भी मसीह[b] की देह के द्वारा व्यवस्था के प्रति मरे हुए कर दिए गए, ताकि तुम किसी दूसरे के हो जाओ[c], अर्थात् उसके जो मृतकों में से जिलाया गया, जिससे हम परमेश्वर के लिए फल लाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे भाइयो और बहनो”; यूनानी में “भाइयो” शब्द मिश्रित समूह को भी संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी “ख़्रिस्तू” (Χριστοῦ); यहाँ “मसीह” पदवी के अर्थ को व्यक्त करता है। वैकल्पिक रूप: “ख्रीस्त।”'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “ताकि तुम किसी दूसरे के हो जाओ”; यह शब्दावली पिछले प्रसंग की विवाह-संबंधी उपमा को आगे बढ़ाती है।
    reason: cultural_note
lexical_decisions:
- source_word: Ὥστε
  choice: इसलिए
  rationale: यह पिछले विवाह-संबंधी दृष्टांत से निकलने वाले निष्कर्ष को स्वाभाविक और स्पष्ट हिंदी में व्यक्त करता है।
- source_word: ἀδελφοί μου
  choice: मेरे भाइयो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन संबोधन है; मिश्रित समुदाय को संबोधित करने की इसकी सम्भावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: καί के समावेशी बल और ὑμεῖς पर दिए गए जोर, दोनों को बनाए रखता है।
- source_word: ἐθανατώθητε
  choice: मार डाले गए
  rationale: अओरिस्ट कर्मवाच्य को स्पष्ट कर्मवाच्य रूप में रखता है और यह भाव बचाता है कि विश्वासियों पर यह कार्य किया गया।
- source_word: τῷ νόμῳ
  choice: व्यवस्था के लिए
  rationale: 'मृत्यु की उपमा के साथ दत्तिव कारक को निकटता से रखता है: व्यवस्था से उनका पूर्व बंधन मृत्यु के द्वारा समाप्त हुआ।'
- source_word: διὰ τοῦ σώματος τοῦ Χριστοῦ
  choice: मसीह की देह के द्वारा
  rationale: διά तथा संबंधकारक के साधन अथवा माध्यम के भाव को व्यक्त करता है और मसीह की देहगत मृत्यु की ओर संकेत बनाए रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: हिंदी में प्रचलित यह पदनाम अभिषिक्त उद्धारकर्ता के अर्थ को स्वाभाविक ढंग से वहन करता है।
- source_word: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ
  choice: ताकि तुम किसी दूसरे के हो जाओ
  rationale: उद्देश्यवाचक रचना और पिछले पदों से जारी विवाह-संबंधी उपमा, दोनों को सहज आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: τῷ ἐκ νεκρῶν ἐγερθέντι
  choice: उसके, जो मरे हुओं में से जिलाया गया
  rationale: मूल के कर्मवाच्य पुनरुत्थान-वर्णन और बहुवचन νεκρῶν का भाव बनाए रखता है।
- source_word: ἵνα καρποφορήσωμεν
  choice: जिससे हम ... फल लाएँ
  rationale: उद्देश्य का भाव और 'तुम' से 'हम' की मूल पाठ में उपस्थित पुरुष-परिवर्तन, दोनों सुरक्षित हैं।
- source_word: τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: दत्तिव का हित अथवा लक्ष्य-संबंधी भाव स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: Χριστοῦ को पदनाम या नाम की तरह प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ शब्द उद्धारकर्ता की पदवी के रूप में अर्थपूर्ण है; 'मसीह' आधुनिक हिंदी में परिचित और अर्थवाही रूप है।
- issue: εἰς τὸ γενέσθαι ὑμᾶς ἑτέρῳ में संबंध और विवाह की उपमा
  choice: ताकि तुम किसी दूसरे के हो जाओ
  alternative: ताकि तुम किसी दूसरे से जुड़ जाओ
  rationale: '''किसी दूसरे के हो जाओ'' स्वामित्व अथवा संबंध के स्थानांतरण की मूल अभिव्यक्ति और विवाह की उपमा को सुरक्षित रखता है; ''जुड़ जाओ'' संबंध को अधिक स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता।'
- issue: ἐγερθέντι का कर्मवाच्य स्वरूप
  choice: जिलाया गया
  alternative: जी उठा
  rationale: कर्मवाच्य रूप को बनाए रखने से परमेश्वर द्वारा किए गए पुनरुत्थान की निहित दिशा सुरक्षित रहती है, बिना कर्ता को पाठ में स्पष्ट रूप से जोड़ने के।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। 'व्यवस्था', 'मसीह' और 'फल लाएँ' जैसे परिचित बाइबलीय शब्द मूल की विधिक, मसीही और रूपकात्मक परतों को बनाए रखते हैं।
