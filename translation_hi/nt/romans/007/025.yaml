source:
  edition: SBLGNT
  text: ⸀χάρις τῷ θεῷ διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν. Ἄρα οὖν αὐτὸς ἐγὼ τῷ μὲν νοῒ δουλεύω νόμῳ θεοῦ, τῇ δὲ σαρκὶ νόμῳ ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/025.yaml
  text: Thanks be to God through Jesus the Messiah our Lord! So then[a], I myself serve the law of God with my mind[c][b], but with my flesh the law of sin.
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह के द्वारा परमेश्वर का धन्यवाद हो! तो फिर, मैं स्वयं अपने मन से परमेश्वर की व्यवस्था की सेवा करता हूँ, लेकिन अपने शरीर से पाप की व्यवस्था की सेवा करता हूँ।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“शरीर” के लिए वैकल्पिक अनुवाद: “पापी स्वभाव।”'
    reason: lexical_alternative
  - marker: b
    text: '“पाप की व्यवस्था” के लिए वैकल्पिक अनुवाद: “पाप का सिद्धांत।”'
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις τῷ θεῷ
  choice: परमेश्वर का धन्यवाद हो
  rationale: इस विस्मयात्मक प्रयोग में χάρις धन्यवाद की अभिव्यक्ति है, न कि यहाँ ‘अनुग्रह’ नामक गुण या वरदान का उल्लेख।
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु यीशु मसीह के द्वारा
  rationale: διά के संबंधकारक प्रयोग का अर्थ ‘के द्वारा’ है। Χριστός को उसके उपाधिगत अर्थ में मानक हिन्दी के स्वाभाविक रूप ‘मसीह’ से व्यक्त किया गया है।
- source_word: Ἄρα οὖν
  choice: तो फिर
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले तर्क का सार और परिणाम प्रस्तुत करता है।
- source_word: αὐτὸς ἐγώ
  choice: मैं स्वयं
  rationale: यह संयोजन कर्ता पर स्पष्ट बल देता है।
- source_word: τῷ μὲν νοῒ ... τῇ δὲ σαρκὶ
  choice: अपने मन से ... अपने शरीर से
  rationale: करणवाचक हिन्दी ‘से’ दोनों समानांतर पक्षों को स्वाभाविक रूप में रखती है और मन तथा शरीर का विरोध बनाए रखती है।
- source_word: δουλεύω
  choice: सेवा करता हूँ
  rationale: यह क्रिया अधीन होकर सेवा करने का भाव रखती है। ‘सेवा करता हूँ’ समानांतर वाक्य में स्वाभाविक है, यद्यपि मूल में दासवत अधीनता का प्रबलतर संकेत भी संभव है।
- source_word: νόμῳ θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: ‘व्यवस्था’ रोमियों 7 के पूरे तर्क में νόμος की पुनरावृत्ति और परमेश्वर से उसके संबंध को सुरक्षित रखती है।
- source_word: σαρκὶ
  choice: शरीर
  rationale: ‘शरीर’ σάρξ का प्रत्यक्ष और साधारण हिन्दी रूप है; इससे इसे मुख्य पाठ में ही ‘पापी स्वभाव’ कहकर पौलुस की मानवशास्त्रीय और नैतिक अस्पष्टता को समाप्त नहीं किया गया।
- source_word: νόμῳ ἁμαρτίας
  choice: पाप की व्यवस्था
  rationale: ‘व्यवस्था’ की पुनरावृत्ति ‘परमेश्वर की व्यवस्था’ के साथ जानबूझकर रखी गई समानता को सुरक्षित रखती है; ‘सिद्धांत’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: नैतिक अर्थ वाले पौलुसी प्रसंग में σάρξ का अनुवाद
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: मूल में स्पष्ट रूप से ‘पापी स्वभाव’ नहीं, बल्कि σάρξ है। ‘शरीर’ रखने से मन और शरीर का विरोध तथा मूल की धर्मवैज्ञानिक तनातनी बनी रहती है।
- issue: νόμος की दूसरी occurrence का अर्थ
  choice: पाप की व्यवस्था
  alternative: पाप का सिद्धांत
  rationale: ‘व्यवस्था’ मूल की शाब्दिक पुनरावृत्ति और ‘परमेश्वर की व्यवस्था’ के साथ समांतरता को बनाए रखती है; ‘सिद्धांत’ संभव अर्थ को अधिक स्पष्ट कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘मसीह’, ‘प्रभु’ और ‘व्यवस्था’ जैसे स्थापित बाइबलीय पद रखे गए हैं। मुख्य पाठ में मूल यूनानी की समानांतर संरचना और धर्मवैज्ञानिक तनाव को यथासंभव सुरक्षित रखा गया है।
