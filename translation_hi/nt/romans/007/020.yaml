source:
  edition: SBLGNT
  text: εἰ δὲ ὃ οὐ ⸀θέλω τοῦτο ποιῶ, οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/020.yaml
  text: But if I do what I do not want[a], I am no longer the one doing it, but sin dwelling in me.
translation:
  language: hi
  text: पर यदि मैं वही करता हूँ जो मैं नहीं चाहता, तो उसे करनेवाला अब मैं नहीं हूँ, बल्कि वह पाप है जो मुझमें वास करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: यह पौलुस के जारी तर्क में शर्त के साथ हल्का विरोध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὃ οὐ θέλω τοῦτο ποιῶ
  choice: मैं वही करता हूँ जो मैं नहीं चाहता
  rationale: यह यूनानी के संबंधवाचक-सहसंबंधी ढाँचे और अनचाहे काम करने के अर्थ को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτό
  choice: उसे करनेवाला अब मैं नहीं हूँ
  rationale: ‘अब ... नहीं’ οὐκέτι का अर्थ देता है; वाक्य-विन्यास स्पष्ट ἐγώ के बल और पहले व्यक्ति तथा पाप के बीच विरोध को सुरक्षित रखता है।
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: वह पाप है जो मुझमें वास करता है
  rationale: ‘पाप’ को किसी व्याख्यात्मक पद, जैसे ‘पापी स्वभाव’, से नहीं बदलता और οἰκοῦσα की भीतर निवास करने की सजीव छवि बनाए रखता है।
theological_decisions:
- issue: क्या ‘मैं नहीं’ की बात को निजी उत्तरदायित्व घटाने वाली व्याख्या से नरम किया जाए
  choice: ‘उसे करनेवाला अब मैं नहीं हूँ’ के रूप में पौलुस का प्रत्यक्ष विरोध बनाए रखा गया है।
  alternative: इसे व्याख्यात्मक ढंग से कहना कि पौलुस केवल अपने भीतर पाप के प्रभाव की बात कर रहा है।
  rationale: मूल पाठ ‘मैं’ और ‘मुझमें वास करनेवाले पाप’ के बीच तनाव को स्वयं स्पष्ट नहीं करता; अनुवाद को उस धर्मवैचारिक तनाव को हल नहीं करना चाहिए।
- issue: ἁμαρτία की पहचान
  choice: पाप
  alternative: पापी स्वभाव
  rationale: यूनानी में सीधे ἁμαρτία है, σάρξ नहीं; इसलिए किसी विशिष्ट धर्मवैचारिक व्याख्या को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘वास करता है’ पाप के भीतर निवास की पौलुसी छवि को बनाए रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सीधा रखा गया है।
