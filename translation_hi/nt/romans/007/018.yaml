id: ROM.7.18
reference: Romans 7:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἶδα γὰρ ὅτι οὐκ οἰκεῖ ἐν ἐμοί, τοῦτ’ ἔστιν ἐν τῇ σαρκί μου, ἀγαθόν· τὸ γὰρ θέλειν παράκειταί μοι, τὸ δὲ κατεργάζεσθαι τὸ καλὸν ⸀οὔ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/018.yaml
  text: For I know that nothing good dwells in me—that is[a], in my flesh. For the willing is present with me, but the doing of the good is not.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि मुझमें—अर्थात् मेरी देह[a] में—कोई भलाई वास नहीं करती। क्योंकि भलाई करने की इच्छा तो मेरे पास है, पर भलाई को करना नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पापी स्वभाव।”
    reason: σάρξ का इस संदर्भ में एक व्याख्यात्मक भावार्थ; मुख्य पाठ में अधिक औपचारिक ‘देह’ रखा गया है।
lexical_decisions:
- source_word: οἶδα
  choice: मैं जानता हूँ
  rationale: पूर्णकालिक रूप यहाँ वर्तमान अर्थ देता है; हिन्दी में यह स्वाभाविक और सटीक अभिव्यक्ति है।
- source_word: οἰκεῖ
  choice: वास नहीं करती
  rationale: ‘वास करना’ अंतर्वास के रूपक को बनाए रखता है और पौलुस की गंभीर शैली के अनुकूल है।
- source_word: ἀγαθόν
  choice: कोई भलाई
  rationale: नकार के साथ प्रयुक्त संज्ञात्मक नपुंसकलिंग विशेषण का स्वाभाविक हिन्दी अर्थ ‘कोई भलाई’ है।
- source_word: σάρξ
  choice: शरीर
  rationale: यह σάρξ का निकट, सामान्य हिन्दी रूप है और ‘पापी स्वभाव’ जैसी व्याख्यात्मक स्पष्टता थोपे बिना पौलुस की अभिव्यक्ति और उसके धार्मिक तनाव को बनाए रखता है।
- source_word: θέλειν
  choice: भलाई की इच्छा
  rationale: संज्ञात्मक क्रिया-रूप को सहज हिन्दी में व्यक्त करता है; अगले वाक्यांश के ‘करना’ के साथ इच्छा और कर्म का विरोध स्पष्ट रहता है।
- source_word: παράκειταί μοι
  choice: मुझमें मौजूद है
  rationale: इच्छा की निकटता अथवा उपलब्ध उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है और व्यक्तिगत संबंध बनाए रखता है।
- source_word: κατεργάζεσθαι
  choice: उसे करना
  rationale: वास्तव में भलाई को कार्यरूप देने का अर्थ संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ καλόν
  choice: भलाई
  rationale: संज्ञात्मक विशेषण द्वारा सूचित नैतिक भलाई को स्पष्ट करता है और पहले खंड के ‘भलाई’ से संबंध बनाए रखता है।
- source_word: οὔ
  choice: नहीं
  rationale: यूनानी में अंतिम कथन संक्षिप्त और अध्याहृत है; हिन्दी में भी ‘मौजूद है’ को दोहराए बिना उसकी संक्षिप्तता बचाई गई है।
theological_decisions:
- issue: नैतिक अर्थ वाले पौलुसी संदर्भ में σάρξ का अनुवाद
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: ‘शरीर’ मूल रूपक को सुरक्षित रखता है और σάρξ को सीधे ‘पापी स्वभाव’ मानकर धार्मिक व्याख्या को पाठ में नहीं जोड़ता। विकल्प को पाद-टिप्पणी में देना आधुनिक पाठक के लिए संभावित भावार्थ उपलब्ध कराता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर किंतु सहज शैली। इच्छा और कर्म के बीच पौलुस के समानांतर विरोध को प्राकृतिक हिन्दी में रखा गया है। मुख्य पाठ में ‘शरीर’ से मूल की अस्पष्टता और धार्मिक तनाव सुरक्षित हैं।
