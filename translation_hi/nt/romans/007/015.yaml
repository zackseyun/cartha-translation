source:
  edition: SBLGNT
  text: ὃ γὰρ κατεργάζομαι οὐ γινώσκω· οὐ γὰρ ὃ θέλω τοῦτο πράσσω, ἀλλ’ ὃ μισῶ τοῦτο ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/015.yaml
  text: For I do not understand what I am doing, because I do not practice what I want; instead, I do the very thing I hate.
translation:
  language: hi
  text: क्योंकि मैं जो कर रहा हूँ, उसे नहीं समझता; क्योंकि मैं वह नहीं करता जो मैं चाहता हूँ, बल्कि जिससे मैं घृणा करता हूँ, वही करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεργάζομαι
  choice: मैं जो करता हूँ
  rationale: यह क्रिया यहाँ व्यक्ति के वास्तविक आचरण या किए जा रहे काम को दर्शाती है; सहज हिन्दी में ‘जो करता हूँ’ इसका अर्थ स्पष्ट रखता है।
- source_word: οὐ γινώσκω
  choice: उसे समझ नहीं पाता
  rationale: γινώσκω का मूल अर्थ ‘जानना’ है, पर इस संदर्भ में वक्ता अपने आचरण को न समझ पाने की बात करता है; ‘समझ नहीं पाता’ हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: πράσσω
  choice: उसका अभ्यास नहीं करता
  rationale: πράσσω बार-बार या व्यवहार में किए जाने वाले काम का संकेत दे सकता है। ‘अभ्यास नहीं करता’ इस पक्ष को ποιῶ के सामान्य ‘करता हूँ’ से अलग बनाए रखता है।
- source_word: μισῶ
  choice: घृणा करता हूँ
  rationale: यह μισέω की तीव्र नकारात्मक भावना को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ποιῶ
  choice: वही करता हूँ
  rationale: सामान्य क्रिया ‘करना’ मूल पाठ के सीधे कथन और τοῦτο के बल को ‘वही’ द्वारा सुरक्षित रखती है।
theological_decisions:
- issue: γάρ के दूसरे प्रयोग का संबंध
  choice: ‘क्योंकि’—पहले कथन का कारण बताने वाला
  alternative: ‘दरअसल/अर्थात’—पहले कथन की व्याख्या करने वाला
  rationale: 'दूसरा γάρ उस दावे को आधार देता है कि वक्ता अपने किए को नहीं समझता: वह जो चाहता है उसका अभ्यास नहीं करता। कारणात्मक संबंध स्पष्ट रखा गया है, यद्यपि व्याख्यात्मक छाया भी संभव है।'
- issue: वक्ता की पहचान और आध्यात्मिक अवस्था
  choice: पद को प्रथम पुरुष के अंतर्विरोध के रूप में ही रखा गया
  alternative: इसे स्पष्ट रूप से अविश्वासी, विश्वासी, या पौलुस के अतीत/वर्तमान अनुभव से जोड़ना
  rationale: इस अकेले पद का यूनानी पाठ वक्ता की धर्मवैज्ञानिक अवस्था को निर्णायक रूप से नहीं बताता; अनुवाद में कोई सांप्रदायिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, आत्मचिंतनपूर्ण और गरिमापूर्ण शैली। ‘चाहता हूँ’ बनाम ‘घृणा करता हूँ’ तथा ‘अभ्यास नहीं करता’ बनाम ‘करता हूँ’ के विरोध को बनाए रखा गया है। कोई फुटनोट आवश्यक नहीं समझा गया।
