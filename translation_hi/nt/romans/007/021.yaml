base_translation:
  language: en
  yaml_path: translation/nt/romans/007/021.yaml
  text: 'So I find this law: when I want to do what is good[a], evil lies close at hand.'
translation:
  language: hi
  text: 'इसलिए मैं यह व्यवस्था[a] पाता हूँ: जब मैं भला करना चाहता हूँ, तब बुराई मेरे पास ही रहती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियम” या “सिद्धांत”।
    reason: νόμος यहाँ मूसा की व्यवस्था के बजाय किसी कार्यरत नियम या सिद्धांत के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: Εὑρίσκω
  choice: मैं ... पाता हूँ
  rationale: वर्तमान काल और किसी बात को पहचान लेने के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ἄρα
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट करता है।
- source_word: νόμον
  choice: व्यवस्था
  rationale: मुख्य पाठ में νόμος का सामान्य पौलुसी शब्द बनाए रखा गया है, जबकि संदर्भ में इसका अर्थ कार्यरत नियम या सिद्धांत भी हो सकता है।
- source_word: τῷ θέλοντι ἐμοὶ ποιεῖν τὸ καλὸν
  choice: जब मैं भला करना चाहता हूँ
  rationale: यूनानी के दत्तिवाचक विन्यास को स्वाभाविक हिन्दी में व्यक्त करते हुए इच्छा और भला करने—दोनों भाव सुरक्षित रखता है।
- source_word: τὸ καλὸν
  choice: भला
  rationale: संज्ञा की तरह प्रयुक्त विशेषण का सहज और वर्तमान हिन्दी रूप।
- source_word: τὸ κακὸν
  choice: बुराई
  rationale: संज्ञा की तरह प्रयुक्त विशेषण को स्पष्ट रूप से व्यक्त करता है और नैतिक विरोध बनाए रखता है।
- source_word: παράκειται
  choice: मेरे पास ही मौजूद रहती है
  rationale: निकट पड़े रहने और तत्परता से उपस्थित होने के संयुक्त भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: νόμον का आशय मूसा की व्यवस्था है या कोई कार्यरत नियम/सिद्धांत
  choice: मुख्य पाठ में “व्यवस्था”
  alternative: “नियम” या “सिद्धांत”
  rationale: “व्यवस्था” पौलुस के νόμος-संबंधी शब्द-प्रतिध्वनि को बनाए रखती है; पादटिप्पणी संदर्भगत वैकल्पिक अर्थ देकर प्रश्न को अनावश्यक रूप से निर्णीत नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। निष्कर्षसूचक “इसलिए” और काल-संबंधी “जब... तब” वाक्य को सामान्य पाठक के लिए स्पष्ट बनाते हैं; “व्यवस्था” की अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
