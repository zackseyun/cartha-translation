id: ROM.7.5
reference: Romans 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτε γὰρ ἦμεν ἐν τῇ σαρκί, τὰ παθήματα τῶν ἁμαρτιῶν τὰ διὰ τοῦ νόμου ἐνηργεῖτο ἐν τοῖς μέλεσιν ἡμῶν εἰς τὸ καρποφορῆσαι τῷ θανάτῳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/005.yaml
  text: For when we were in the flesh[a], the sinful passions that came through the law[c][b], were at work in our members to bear fruit for death.
translation:
  language: hi
  text: क्योंकि जब हम शरीर में थे[a], तब व्यवस्था के माध्यम से होने वाली पापमय अभिलाषाएँ[b] हमारे अंगों[c] में कार्य कर रही थीं, ताकि वे मृत्यु के लिए फल लाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापी स्वभाव में थे” अथवा “अपनी पतित मानवीय दशा में थे।”
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “पापों की अभिलाषाएँ।” यहाँ आशय पाप से चिह्नित आवेगों या प्रवृत्तियों से है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “अंग” से आशय शरीर के उन भागों या क्षमताओं से है जो कार्य करने के साधन बनते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ σαρκί
  choice: शरीर में
  rationale: यह पौलुस के अर्थगर्भित मुहावरे की निकट और पारदर्शी अभिव्यक्ति है। इसे सीधे ‘पापी स्वभाव के अधीन’ कहने से निहित मानवशास्त्रीय अर्थ समय से पहले निश्चित हो जाता; इसलिए मुख्य पाठ में रूपक और उसका तनाव सुरक्षित रखा गया है।
- source_word: τὰ παθήματα τῶν ἁμαρτιῶν
  choice: पापमय अभिलाषाएँ
  rationale: παθήματα यहाँ दुःख नहीं, बल्कि पाप से चिह्नित आंतरिक प्रवृत्तियों या आवेगों को दर्शाता है। ‘पापमय अभिलाषाएँ’ हिन्दी में स्वाभाविक है और संबंधकारक पद τῶν ἁμαρτιῶν के गुणसूचक बल को व्यक्त करता है।
- source_word: διὰ τοῦ νόμου
  choice: व्यवस्था के माध्यम से आती थीं
  rationale: यह व्यवस्था की माध्यमात्मक भूमिका को व्यक्त करता है, पर ‘जागृत की गई थीं’ जैसे अधिक व्याख्यात्मक कारणार्थ को मुख्य पाठ में नहीं जोड़ता।
- source_word: ἐνηργεῖτο
  choice: सक्रिय थीं
  rationale: अपूर्णकालीन क्रिया के बीते समय में निरंतर कार्यरत रहने के भाव को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς μέλεσιν ἡμῶν
  choice: हमारे अंगों में
  rationale: ‘अंग’ पौलुस की देह-संबंधी और साधनात्मक छवि को बनाए रखता है; टिप्पणी स्पष्ट करती है कि आशय केवल हाथ-पाँव तक सीमित नहीं है।
- source_word: εἰς τὸ καρποφορῆσαι τῷ θανάτῳ
  choice: ताकि वे मृत्यु के लिए फल उत्पन्न करें
  rationale: यह उद्देश्य/परिणाम की संरचना और फल लाने के जैविक रूपक दोनों को सुरक्षित रखता है। ‘मृत्यु के लिए’ यूनानी संबंधवाचक चतुर्थी की कठोर दिशात्मकता को बिना अत्यधिक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ἐν τῇ σαρκί को शाब्दिक रूप में रखा जाए या ‘पापी स्वभाव के अधीन’ जैसे व्याख्यात्मक पद से अनूदित किया जाए
  choice: शरीर में
  alternative: पापी स्वभाव के अधीन / अपनी पतित मानवीय दशा में
  rationale: रोमियों में σάρξ देह मात्र से अधिक व्यापक पुरानी मानवीय दशा का संकेत दे सकता है, पर यहाँ मुख्य पाठ में ‘शरीर’ रखने से पौलुस की शरीर/आत्मा संबंधी शब्दावली और वास्तविक अर्थगत तनाव सुरक्षित रहता है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: τῶν ἁμαρτιῶν को औपचारिक बहुवचन संबंधकारक के रूप में या गुणसूचक रूप में व्यक्त करना
  choice: पापमय अभिलाषाएँ
  alternative: पापों की अभिलाषाएँ
  rationale: संदर्भ में संबंधकारक उन अभिलाषाओं को पाप से चिह्नित बताता है; ‘पापों की अभिलाषाएँ’ आधुनिक हिन्दी में स्वामित्व का अस्वाभाविक आभास दे सकता है। शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
- issue: διὰ τοῦ νόμου में व्यवस्था की भूमिका को ‘जागृत करना’ कहकर स्पष्ट किया जाए या माध्यमात्मक अस्पष्टता रखी जाए
  choice: व्यवस्था के माध्यम से आती थीं
  alternative: व्यवस्था के द्वारा जागृत होती थीं
  rationale: व्यापक पौलुसी तर्क ‘जागृत’ अर्थ का समर्थन कर सकता है, किंतु इस पद में वह क्रिया स्पष्ट रूप से नहीं है। चुना हुआ पाठ व्यवस्था और पापमय अभिलाषाओं का संबंध बनाए रखता है, पर उसके क्रियाविधान को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘शरीर’, ‘अंग’ और ‘फल उत्पन्न करना’ जैसे पद रोमियों की पारस्परिक शब्दावली और पौलुस के रूपकों को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
