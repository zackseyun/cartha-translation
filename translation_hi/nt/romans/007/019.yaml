  yaml_path: translation/nt/romans/007/019.yaml
  text: For I do not do the good that I want[b][a], but the evil that I do not want—this I practice.
translation:
  language: hi
  text: क्योंकि मैं वह भला काम नहीं करता जो मैं करना चाहता हूँ, बल्कि उसी बुरे काम को करता हूँ जो मैं नहीं करना चाहता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘करता हूँ’ के लिए पहले ποιῶ और बाद में πράσσω—दो अलग क्रियापद हैं, हालाँकि उनके अर्थ काफ़ी हद तक एक-दूसरे से मिलते हैं। अंतिम क्रियापद का अनुवाद ‘अमल में लाता हूँ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: θέλω
  choice: चाहता हूँ
  rationale: यह आधुनिक हिन्दी में इच्छा और संकल्प—दोनों के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ποιῶ
  choice: करता
  rationale: ποιέω के लिए सामान्य और सीधा हिन्दी क्रियापद है; यहाँ इच्छित भले काम को वास्तव में करने की बात है।
- source_word: ἀγαθόν
  choice: भला काम
  rationale: यह पद के नैतिक अर्थ को बनाए रखते हुए हिन्दी में स्वाभाविक है और समानांतर ‘बुरे काम’ से स्पष्ट विरोध बनाता है।
- source_word: κακὸν
  choice: बुरा काम
  rationale: यह नैतिक विरोध को स्पष्ट रखता है और इसे केवल अनुपयोगी या अप्रिय अर्थ तक सीमित नहीं करता।
- source_word: πράσσω
  choice: करता रहता हूँ
  rationale: यह πράσσω के आचरण में किए जाने वाले कार्य के भाव को व्यक्त करता है और पहले प्रयुक्त ποιῶ से हल्का-सा भेद दिखाता है, बिना अर्थांतर को बढ़ा-चढ़ाकर प्रस्तुत किए।
- source_word: τοῦτο
  choice: उसी को
  rationale: पूर्वोक्त बुरे काम पर यूनानी संकेतवाचक के बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को सुरक्षित रखता है और ‘नहीं’ निषेध को संबंधित क्रिया के साथ स्वाभाविक स्थान देता है।
theological_decisions:
- issue: पौलुस के नैतिक विरोध को हल्का करना या उसकी पूरी शक्ति बनाए रखना
  choice: ‘भला काम’ और ‘बुरा काम’ के रूप में सीधा नैतिक विरोध बनाए रखा गया।
  alternative: ‘सही काम’ और ‘गलत काम’
  rationale: ἀγαθόν और κακόν यहाँ नैतिक भार रखते हैं; अनुवाद इस तनाव को व्यावहारिक पसंद-नापसंद तक सीमित नहीं करता।
- issue: πράσσω को आदतन पाप के किसी विशेष धर्मसैद्धांतिक दावे के रूप में लेना
  choice: ‘करता रहता हूँ’ से व्यवहारगत/निरंतर किए जाने का भाव दिया गया, पर किसी विशिष्ट धर्मसैद्धांतिक निष्कर्ष को आरोपित नहीं किया गया।
  alternative: सिर्फ ‘करता हूँ’
  rationale: संदर्भ और क्रियापद आचरण के भाव की अनुमति देते हैं, किंतु हिन्दी का वाक्य यह तय नहीं करता कि वक्ता की पहचान या अनुभव को किस विशेष धर्मसैद्धांतिक ढाँचे में रखा जाए।
