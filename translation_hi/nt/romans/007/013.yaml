id: ROM.7.13
reference: Romans 7:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τὸ οὖν ἀγαθὸν ἐμοὶ ⸀ἐγένετο θάνατος; μὴ γένοιτο· ἀλλὰ ἡ ἁμαρτία, ἵνα φανῇ ἁμαρτία διὰ τοῦ ἀγαθοῦ μοι κατεργαζομένη θάνατον· ἵνα γένηται καθ’ ὑπερβολὴν ἁμαρτωλὸς ἡ ἁμαρτία διὰ τῆς ἐντολῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/013.yaml
  text: So then[a], did what is good become death to me? May it never be! Rather, it was sin, so that it might be shown to be sin by producing death in me through what is good[b], in order that through the commandment sin might become exceedingly sinful.
translation:
  language: hi
  text: तो क्या जो अच्छा है, वह मेरे लिए मृत्यु बन गया? बिलकुल नहीं! बल्कि पाप ने—ताकि वह पाप के रूप में प्रकट हो[a]—जो अच्छा है, उसके द्वारा मेरे लिए मृत्यु उत्पन्न की, ताकि आज्ञा के द्वारा पाप अत्यन्त पापमय हो जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि पाप, पाप ही दिखाई दे।”
    reason: मूल यूनानी में दूसरे ‘पाप’ का विधेयात्मक संबंध इस अधिक शाब्दिक रूप में भी व्यक्त किया जा सकता है।
  - marker: b
    text: या, “पाप हद से बढ़कर पापमय हो जाए।”
    reason: καθ’ ὑπερβολὴν की अतिरेक-सूचक अभिव्यक्ति का वैकल्पिक मुहावरेदार अनुवाद।
lexical_decisions:
- source_word: Τὸ ... ἀγαθὸν
  choice: वह जो अच्छा है
  rationale: नपुंसकलिंग विशेषण के संज्ञात्मक प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है और किसी एक विशिष्ट वस्तु को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐμοὶ
  choice: मेरे लिए
  rationale: व्यक्तिगत संदर्भ के चतुर्थी अर्थ को प्रश्न में सीधे और स्वाभाविक ढंग से रखता है।
- source_word: ἐγένετο θάνατος
  choice: मृत्यु बन गया
  rationale: γίνομαι के विधेयात्मक अर्थ को बनाए रखता है; इसे अधिक व्याख्यात्मक ‘मृत्यु का कारण बना’ नहीं किया गया।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: पौलुस के तीव्र निषेध को संक्षिप्त, प्रतिष्ठित और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ἡ ἁμαρτία
  choice: पाप
  rationale: मूल में पाप का मानवीकरण है, पर वह अमूर्त संज्ञा ही रहता है; हिन्दी में ‘पाप’ यह तनाव बनाए रखता है।
- source_word: ἵνα φανῇ ἁμαρτία
  choice: ताकि वह पाप के रूप में प्रकट हो
  rationale: दोहराए गए ἁμαρτία की विधेयात्मक शक्ति और उद्देश्यवाचक उपवाक्य दोनों को स्पष्ट करता है।
- source_word: διὰ τοῦ ἀγαθοῦ
  choice: उस अच्छे के द्वारा
  rationale: पहले आए संज्ञात्मक ‘अच्छे’ से संबंध बनाए रखते हुए διά के साधनवाचक अर्थ को सुरक्षित रखता है।
- source_word: μοι κατεργαζομένη θάνατον
  choice: मेरे भीतर मृत्यु उत्पन्न की
  rationale: κατεργάζομαι के परिणाम उत्पन्न करने के भाव को सहज हिन्दी में देता है; ‘मेरे भीतर’ व्यक्तिगत अनुभव में मृत्यु के कार्य को स्पष्ट करता है।
- source_word: καθ’ ὑπερβολὴν ἁμαρτωλὸς
  choice: अत्यन्त पापमय
  rationale: अतिरेक की तीव्रता और ‘पाप—पापमय’ की जानबूझकर की गई पुनरुक्ति दोनों बनाए रखता है।
- source_word: διὰ τῆς ἐντολῆς
  choice: आज्ञा के द्वारा
  rationale: ἐντολή को वर्तमान प्रसंग में व्यवस्था से जुड़ी आज्ञा के रूप में और διά को साधनवाचक रूप में व्यक्त करता है।
theological_decisions:
- issue: अच्छी आज्ञा और मृत्यु के बीच उत्तरदायित्व
  choice: मृत्यु उत्पन्न करने वाला कर्ता पाप है, जबकि अच्छा साधन के रूप में आता है।
  alternative: ऐसा ढीला अनुवाद जिसमें आज्ञा स्वयं नैतिक रूप से दोषी मृत्यु-कारक लगे।
  rationale: μὴ γένοιτο के बाद ἀλλὰ ἡ ἁμαρτία स्पष्ट विरोध स्थापित करता है और उत्तरदायित्व पाप पर रखता है; अनुवाद आज्ञा की अच्छाई और उसके द्वारा पाप के काम करने का तनाव बनाए रखता है।
- issue: दोनों ἵνα उपवाक्यों का संबंध
  choice: दोनों को ‘ताकि’ से उद्देश्य अथवा लक्ष्यसूचक रूप में रखा गया है।
  alternative: उन्हें केवल परिणामसूचक ‘जिसके फलस्वरूप’ के रूप में समझना।
  rationale: ἵνα का उद्देश्यवाचक बल प्रमुख है, फिर भी हिन्दी का ‘ताकि’ प्रसंग में दैवी उद्देश्य और प्रकट परिणाम के बीच मूल पाठ के तनाव को अत्यधिक नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘कदापि नहीं’ पौलुस के प्रबल निषेध के अनुरूप गरिमापूर्ण है, जबकि शेष वाक्य सामान्य पाठक के लिए वर्तमान और स्पष्ट रखा गया है। डैश जटिल यूनानी वाक्य में पहले उद्देश्यवाचक उपवाक्य की सीमा दिखाते हैं।
