source:
  edition: SBLGNT
  text: νυνὶ δὲ οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ ἀλλὰ ἡ ⸀οἰκοῦσα ἐν ἐμοὶ ἁμαρτία.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/017.yaml
  text: But now I am no longer the one doing it[a], but sin dwelling in me.
translation:
  language: hi
  text: पर अब इसे करनेवाला मैं नहीं, बल्कि मुझमें वास करनेवाला पाप है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: यह पिछले कथन से तार्किक और प्रसंगगत विरोध दिखाता है; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οὐκέτι ἐγὼ κατεργάζομαι αὐτὸ
  choice: इसे करनेवाला मैं नहीं
  rationale: οὐκέτι का भाव प्रसंग में ‘अब नहीं’ से व्यक्त होता है, जबकि स्पष्ट ἐγώ का बल ‘मैं’ पर रखा गया है; κατεργάζομαι के लिए ‘करना’ सरल और सटीक है।
- source_word: αὐτὸ
  choice: इसे
  rationale: यह पिछले पद में बताए गए उस काम की ओर संकेत करता है जिसे वक्ता नहीं करना चाहता।
- source_word: ἡ οἰκοῦσα ἐν ἐμοὶ ἁμαρτία
  choice: मुझमें वास करनेवाला पाप
  rationale: ‘वास करना’ οἰκέω के निवास-संबंधी रूपक और पाप के सजीव चित्रण को गरिमापूर्ण, स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘मैं’ और ‘मुझमें वास करनेवाला पाप’ के बीच तीखा भेद उत्तरदायित्व से बचने जैसा समझा जा सकता है।
  choice: मूल पाठ का स्पष्ट भेद बिना व्याख्यात्मक नरमी के बनाए रखा गया।
  alternative: इसे केवल आंतरिक संघर्ष बताने के लिए विस्तार या भावानुवाद करना।
  rationale: पद स्वयं कर्ता के विषय में तनावपूर्ण भेद प्रस्तुत करता है; अनुवाद को उस धर्मवैचारिक तनाव का समाधान नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। ‘वास करनेवाला’ रूपक को बनाए रखता है और अत्यधिक संस्कृतनिष्ठ नहीं है।
