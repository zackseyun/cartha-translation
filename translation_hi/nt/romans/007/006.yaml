source:
  edition: SBLGNT
  text: νυνὶ δὲ κατηργήθημεν ἀπὸ τοῦ νόμου, ἀποθανόντες ἐν ᾧ κατειχόμεθα, ὥστε δουλεύειν ἡμᾶς ἐν καινότητι πνεύματος καὶ οὐ παλαιότητι γράμματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/006.yaml
  text: But now we have been released from the law[a], having died to what held us[c][b], so that we serve in newness of the Spirit and not in oldness of the letter.
translation:
  language: hi
  text: पर अब हम व्यवस्था से मुक्त कर दिए गए हैं, क्योंकि हम उसके लिए मर गए हैं जिसके बंधन में हम थे, ताकि हम अक्षर की पुरानी रीति में नहीं, बल्कि पवित्र आत्मा की नई रीति में सेवा करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατηργήθημεν ἀπὸ τοῦ νόμου
  choice: व्यवस्था से मुक्त कर दिए गए हैं
  rationale: यह प्रयोग व्यवस्था के अस्तित्व का अंत नहीं, बल्कि उसके बंधनकारी अधिकार से मुक्त किए जाने को व्यक्त करता है। कर्मवाच्य रूप भी सुरक्षित है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: संदर्भ में मूसा की व्यवस्था अभिप्रेत है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और परिचित है।
- source_word: ἀποθανόντες
  choice: मर गए हैं
  rationale: बहुवचन कर्ता ‘हम’ ही मरने वाले हैं। हिन्दी में यह रूप पूर्व घटित अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ᾧ κατειχόμεθα
  choice: जिस चीज़ ने हमें जकड़ रखा था, उसके लिए
  rationale: यह अनुवाद पहले के बंधन का भाव स्पष्ट करता है, पर उस चीज़ की पहचान को मूल की तरह सामान्य रखता है।
- source_word: δουλεύειν
  choice: सेवा करें
  rationale: यहाँ क्रिया का केंद्र नई रीति से की जाने वाली सेवा है। ‘दास बने रहें’ दासत्व की छवि को अधिक प्रमुख कर देता, जबकि ‘सेवा करें’ इस वाक्य में अधिक स्वाभाविक है।
- source_word: καινότητι
  choice: नएपन में
  rationale: मूल की भाववाचक संज्ञा और ‘पुरानेपन’ के साथ उसका अलंकारिक संतुलन सुरक्षित रहता है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: यह पवित्र आत्मा की ओर संकेत कर सकता है, पर यूनानी में मानवीय आत्मा या आत्मिक रीति का अर्थ भी व्याकरणतः संभव है। हिन्दी ‘आत्मा’ मूल की इस संक्षिप्तता को बनाए रखता है।
- source_word: παλαιότητι γράμματος
  choice: अक्षर के पुरानेपन में
  rationale: यह मूल की समानांतर अमूर्त अभिव्यक्ति को सुरक्षित रखता है और ‘आत्मा’ तथा ‘अक्षर’ के पौलुसी विरोध को अनावश्यक व्याख्या के बिना प्रस्तुत करता है।
theological_decisions:
- issue: मरने वाला कौन है—विश्वासी या व्यवस्था
  choice: ‘हम’ मर गए हैं
  alternative: व्यवस्था हमारे संबंध में मर गई
  rationale: ἀποθανόντες कर्तृकारक बहुवचन कृदंत है और निहित कर्ता ‘हम’ से जुड़ता है। इसलिए मुख्य पाठ में विश्वासियों के मरने का कथन रखा गया है।
- issue: πνεύματος का संकेत पवित्र आत्मा की ओर है या मानवीय आत्मा की ओर
  choice: मुख्य पाठ में केवल ‘आत्मा’ रखकर संदर्भगत खुलापन बनाए रखना
  alternative: ‘पवित्र आत्मा’ अथवा ‘मानवीय आत्मा/आत्मिक रीति’
  rationale: पौलुस के ‘आत्मा और अक्षर’ विरोध तथा नई वाचा के संदर्भ में पवित्र आत्मा अधिक संभावित है, फिर भी मूल संज्ञा अपने आप में दोनों व्याख्याओं की गुंजाइश रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘आत्मा’ और ‘अक्षर’ जैसे पौलुसी प्रमुख पद बनाए गए हैं; कठिन यूनानी संबंधवाचक रचना को स्वाभाविक हिन्दी में खोला गया है, जबकि उसकी अनिश्चितता पादटिप्पणी में सुरक्षित है।
