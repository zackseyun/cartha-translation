base_translation:
  language: en
  yaml_path: translation/nt/romans/007/010.yaml
  text: and I died[b][a], and the commandment that was for life proved to be for death to me.
translation:
  language: hi
  text: और मैं मर गया, और जो आज्ञा जीवन के लिए थी,[a] वही मेरे लिए मृत्यु की ठहरी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो जीवन के लिए अभिप्रेत थी।”
    reason: lexical_alternative
  - marker: b
    text: या, “यही आज्ञा मेरे लिए मृत्यु का परिणाम देने वाली सिद्ध हुई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπέθανον
  choice: मैं मर गया
  rationale: अओरिस्ट सक्रिय संकेतार्थक क्रिया को एक सीधे भूतकालीन परिणाम के रूप में व्यक्त करता है; यह न तो केवल अवस्था है, न क्रमिक प्रक्रिया।
- source_word: εὑρέθη μοι
  choice: मेरे लिए ... निकली
  rationale: यूनानी कर्मवाच्य और μοι के अनुभवात्मक भाव को स्वाभाविक हिन्दी में ‘मेरे लिए ... निकली’ व्यक्त करता है, अर्थात अनुभव में उसका परिणाम ऐसा पाया गया।
- source_word: ἐντολή
  choice: आज्ञा
  rationale: यह एकवचन संज्ञा के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द है तथा मूल में न दिए गए ‘व्यवस्था की’ जैसे शब्द नहीं जोड़ता।
- source_word: ἡ εἰς ζωὴν
  choice: जो जीवन के लिए थी
  rationale: εἰς के दिशा अथवा परिणाम-संबंधी खुले भाव को बनाए रखता है और यह तय नहीं करता कि आज्ञा केवल ‘अभिप्रेत’ थी या वास्तव में जीवन की ओर ले जाती थी।
- source_word: αὕτη
  choice: वही आज्ञा
  rationale: संकेतवाचक αὕτη के बल को स्वाभाविक हिन्दी में ‘वही’ से व्यक्त किया गया है।
- source_word: εἰς θάνατον
  choice: मृत्यु का कारण
  rationale: शाब्दिक ‘मृत्यु के लिए’ हिन्दी में अस्वाभाविक और अस्पष्ट होता; यह चयन परिणाम का भाव स्पष्ट करता है, जबकि पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: क्या आज्ञा को सीधे मृत्यु लाने वाली बताकर कारणता स्पष्ट की जाए
  choice: ‘मेरे लिए मृत्यु का कारण निकली’—अनुभव में प्रकट परिणाम पर बल
  alternative: ‘मेरे लिए मृत्यु के लिए निकली’ अथवा ‘मेरे लिए घातक सिद्ध हुई’
  rationale: पाठ आज्ञा की अच्छाई और व्यक्ति के लिए उसके मृत्यु-संबंधी परिणाम के बीच तनाव रखता है। अनुवाद परिणाम को स्पष्ट करता है, पर यह नहीं कहता कि आज्ञा अपने स्वभाव में बुरी थी।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘जीवन’ और ‘मृत्यु’ का मूल अलंकारिक विरोध सुरक्षित है, तथा दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
