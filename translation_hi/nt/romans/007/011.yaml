id: ROM.7.11
reference: Romans 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ γὰρ ἁμαρτία ἀφορμὴν λαβοῦσα διὰ τῆς ἐντολῆς ἐξηπάτησέν με καὶ δι’ αὐτῆς ἀπέκτεινεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/011.yaml
  text: For sin[a], having taken an opportunity through the commandment[b], deceived me and through it killed me.
translation:
  language: hi
  text: क्योंकि पाप ने आज्ञा के द्वारा अवसर पाकर[a] मुझे धोखा दिया और उसी के द्वारा मुझे मार डाला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अवसर का लाभ उठाकर।”
    reason: lexical_alternative
  - marker: b
    text: “उसी” से आशय “आज्ञा” है।
    reason: referent_clarification
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन से पद का व्याख्यात्मक संबंध स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: पौलुस के प्रयोग के अनुरूप यह पाप को यहाँ सक्रिय कर्ता के रूप में प्रस्तुत करता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: ἀφορμὴν λαβοῦσα
  choice: अवसर पाकर
  rationale: यह मुहावरेदार आधुनिक हिन्दी में अवसर मिलने अथवा उसका लाभ उठाने का भाव रखता है; अधिक आक्रामक अर्थ को अनावश्यक रूप से नहीं थोपता।
- source_word: διὰ τῆς ἐντολῆς
  choice: आज्ञा के द्वारा
  rationale: यह साधनवाचक अर्थ और यूनानी के एकवचन दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐξηπάτησέν
  choice: धोखा दिया
  rationale: यह क्रिया के मूल अर्थ को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: με
  choice: मुझे
  rationale: प्रत्यक्ष व्यक्तिगत कर्म को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: δι’ αὐτῆς
  choice: उसी के द्वारा
  rationale: स्त्रीलिंग एकवचन सर्वनाम का पूर्वपद ‘आज्ञा’ है; ‘उसी’ संदर्भ को स्पष्ट रखते हुए पुनरुक्ति से बचाता है।
- source_word: ἀπέκτεινεν
  choice: मार डाला
  rationale: यह घातक परिणाम को स्वाभाविक और सशक्त आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पाप के मानवीकरण की मात्रा
  choice: पाप को धोखा देने और मार डालने वाले सक्रिय कर्ता के रूप में रखा गया है।
  alternative: पाप की सक्रियता को किसी अमूर्त प्रभाव के रूप में नरम कर देना।
  rationale: यूनानी वाक्य में पाप ही अवसर पाने, धोखा देने और मार डालने का व्याकरणिक कर्ता है; अनुवाद इस अलंकारिक और धर्मवैचारिक तनाव को बिना विस्तार के बनाए रखता है।
- issue: आज्ञा की भूमिका
  choice: ‘आज्ञा के द्वारा’ कहकर साधनवाचक संबंध सुरक्षित रखा गया है।
  alternative: आज्ञा को स्वयं मृत्यु का स्वतंत्र कारण बताना।
  rationale: मूल पाठ पाप को कर्ता और आज्ञा को उसके द्वारा प्रयुक्त माध्यम के रूप में प्रस्तुत करता है; अनुवाद इस भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘आज्ञा’ पौलुस के संदर्भ में प्रचलित और सटीक शब्द है; ‘मार डाला’ मूल की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
