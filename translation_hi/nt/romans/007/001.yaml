id: ROM.7.1
reference: Romans 7:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἢ ἀγνοεῖτε, ἀδελφοί, γινώσκουσιν γὰρ νόμον λαλῶ, ὅτι ὁ νόμος κυριεύει τοῦ ἀνθρώπου ἐφ’ ὅσον χρόνον ζῇ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/001.yaml
  text: Or do you not know[b][a], brothers—for I am speaking to those who know the law—that the law has authority over a person for as long as he lives?
translation:
  language: hi
  text: या क्या तुम नहीं जानते, भाइयो[a]—क्योंकि मैं व्यवस्था को जानने वालों से बात कर रहा हूँ—कि व्यवस्था मनुष्य पर अधिकार रखती है, जब तक वह जीवित रहता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है; इस प्रसंग में संभवतः पौलुस के श्रोताओं में शामिल स्त्रियाँ भी संबोधित हैं।
    reason: cultural_note
lexical_decisions:
- source_word: Ἢ
  choice: या
  rationale: पिछले तर्क से जुड़े वैकल्पिक/आलंकारिक संक्रमण को बनाए रखता है।
- source_word: ἀγνοεῖτε
  choice: क्या तुम नहीं जानते
  rationale: साझे ज्ञान की ओर संकेत करनेवाले आलंकारिक प्रश्न को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी संबोधन के पुल्लिंग बहुवचन रूप को मुख्य पाठ में सुरक्षित रखता है; प्रसंग में इसके समावेशी आशय को पादटिप्पणी स्पष्ट करती है।
- source_word: γινώσκουσιν γὰρ νόμον λαλῶ
  choice: क्योंकि मैं व्यवस्था जाननेवालों से कह रहा हूँ
  rationale: γάρ के व्याख्यात्मक भाव और व्यवस्था से परिचित श्रोताओं के संदर्भ को स्पष्ट, वर्तमान हिंदी में रखता है।
- source_word: νόμον / ὁ νόμος
  choice: व्यवस्था
  rationale: नόμος के धार्मिक-कानूनी अर्थ को पारंपरिक किंतु आज भी बोधगम्य हिंदी शब्द से व्यक्त करता है, बिना इसे केवल मूसा की व्यवस्था तक स्पष्टतः सीमित किए।
- source_word: κυριεύει
  choice: अधिकार रखती है
  rationale: प्रभुत्व अथवा अधिकार के भाव को सहज औपचारिक हिंदी में व्यक्त करता है।
- source_word: τοῦ ἀνθρώπου
  choice: मनुष्य पर
  rationale: यहाँ ἄνθρωπος सामान्य मानव व्यक्ति का द्योतक है, न कि केवल पुरुष का।
- source_word: ἐφ’ ὅσον χρόνον ζῇ
  choice: तब तक ... जब तक वह जीवित रहता है
  rationale: कालगत सीमा को स्वाभाविक हिंदी संरचना में सुरक्षित रखता है।
theological_decisions:
- issue: νόμος का दायरा
  choice: व्यवस्था
  alternative: विशेष रूप से मूसा की व्यवस्था; अथवा सामान्य कानूनी सिद्धांत
  rationale: तात्कालिक प्रसंग में मूसा की व्यवस्था प्रमुख है, पर यूनानी कथन का रूप व्यापक है; इसलिए अनुवाद इस तनाव को खुला रखता है।
- issue: κυριεύει में अधिकार का स्वरूप
  choice: अधिकार रखती है
  alternative: शासन करती है; प्रभुता करती है
  rationale: यह चयन कानूनी बाध्यता और प्रभुत्व दोनों की संभावना को बनाए रखते हुए हिंदी में अनावश्यक रूप से कठोर या सांप्रदायिक भाषा से बचता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सम्मानपूर्ण, स्पष्ट और सामान्य पाठकों के लिए सुबोध। ‘व्यवस्था’ पौलुस के तर्क की परिचित धर्मशास्त्रीय शब्दावली को बनाए रखती है।
