  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν; ὁ νόμος ἁμαρτία; μὴ γένοιτο· ἀλλὰ τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου, τήν τε γὰρ ἐπιθυμίαν οὐκ ᾔδειν εἰ μὴ ὁ νόμος ἔλεγεν· Οὐκ ἐπιθυμήσεις·
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/007.yaml
  text: What then shall we say? Is the law sin? May it never be! On the contrary[a], I would not have known sin except through the law. For I would not have known coveting if the law had not said, "You shall not covet."
translation:
  language: hi
  text: तो हम क्या कहें? क्या व्यवस्था पाप है? कदापि नहीं! बल्कि, यदि व्यवस्था न होती, तो मैं पाप को न जानता। क्योंकि यदि व्यवस्था ने यह न कहा होता, “लालच[a] न करना,” तो मैं न जानता कि लालच क्या है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लालच” के स्थान पर “इच्छा” भी हो सकता है; पर इसके तुरंत बाद उद्धृत आज्ञा यहाँ अधिक विशिष्ट अर्थ का समर्थन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: तो हम क्या कहें?
  rationale: पौलुस के तर्क में प्रयुक्त आलंकारिक संक्रमण को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: यहाँ संदर्भ मूसा की व्यवस्था का है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ νόμος का सुस्थापित और संदर्भानुकूल रूप है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: यूनानी में यह विधेय संज्ञा है; ‘पाप’ प्रश्न की तीक्ष्णता बनाए रखता है और उसे केवल ‘पापमय’ गुण में नहीं बदलता।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: पौलुस के प्रबल निषेध को संक्षिप्त, गरिमापूर्ण और सामान्यतः समझ में आने वाली हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: पहले कथन के प्रबल खंडन के बाद आने वाले सुधारात्मक विरोध को स्वाभाविक रूप से दिखाता है।
- source_word: τὴν ἁμαρτίαν οὐκ ἔγνων εἰ μὴ διὰ νόμου
  choice: व्यवस्था के द्वारा ही मैंने पाप को जाना
  rationale: εἰ μὴ की अपवादात्मक सीमा को ‘ही’ से व्यक्त किया गया है; यह मूल की कथनात्मक संरचना को बनाए रखता है और अनावश्यक रूप से स्पष्ट प्रतिकल्पना आरोपित नहीं करता।
- source_word: ἐπιθυμίαν
  choice: लालच
  rationale: ἐπιθυμία का अर्थ व्यापक ‘इच्छा’ भी हो सकता है, पर तुरन्त उद्धृत दसवीं आज्ञा यहाँ निषिद्ध लोभ या लालच के विशिष्ट अर्थ का समर्थन करती है।
- source_word: οὐκ ᾔδειν
  choice: मैं ... न जानता
  rationale: पूर्ववर्ती ἔγνων के साथ हिन्दी में अर्थगत समानांतरता बनाए रखता है, यद्यपि यूनानी में अलग ज्ञान-क्रिया प्रयुक्त है।
- source_word: Οὐκ ἐπιθυμήσεις
  choice: लालच मत करना
  rationale: दसवीं आज्ञा के निषेधात्मक बल को स्पष्ट, सीधे और आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: व्यवस्था और पाप का संबंध
  choice: क्या व्यवस्था पाप है? कदापि नहीं!
  alternative: क्या व्यवस्था पापमय है?
  rationale: यूनानी विधेय संज्ञा व्यवस्था को पाप के साथ पहचानने का प्रश्न उठाती है, केवल उसमें पापमय गुण होने का नहीं; चुना हुआ रूप इस तीखे विरोध को सुरक्षित रखता है।
- issue: व्यवस्था के द्वारा पाप को जानना
  choice: व्यवस्था के द्वारा ही मैंने पाप को जाना
  alternative: व्यवस्था के बिना मैं पाप को न जानता
  rationale: यह रूप मूल के εἰ μὴ διὰ νόμου का आशय देता है, पर ज्ञान की प्रकृति को केवल बौद्धिक पहचान या व्यक्तिगत अनुभव मानकर संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘कदापि नहीं’ पौलुस के प्रबल निषेध को बनाए रखता है; शेष वाक्य सामान्य पाठक के लिए सीधे और सहज रखे गए हैं।
