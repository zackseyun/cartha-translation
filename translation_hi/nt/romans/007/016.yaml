  text: εἰ δὲ ὃ οὐ θέλω τοῦτο ποιῶ, σύμφημι τῷ νόμῳ ὅτι καλός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/016.yaml
  text: But if I do what I do not want, I agree with the law that it is good.
translation:
  language: hi
  text: पर यदि मैं वही करता हूँ जो मैं नहीं चाहता, तो मैं व्यवस्था से सहमत हूँ कि वह अच्छी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: εἰ की शर्त और δέ के हल्के विरोधात्मक संबंध—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃ … τοῦτο
  choice: वही … जो
  rationale: यूनानी सहसंबंधी रचना को सहज हिन्दी में रखते हुए उस काम पर बल बनाए रखता है जिसे वक्ता नहीं चाहता।
- source_word: θέλω
  choice: चाहता
  rationale: यहाँ व्यक्ति की आंतरिक इच्छा को व्यक्त करने वाला सीधा और वर्तमान हिन्दी प्रयोग है।
- source_word: ποιῶ
  choice: करता हूँ
  rationale: साधारण वर्तमान काल और मूल क्रिया के सीधे अर्थ को सुरक्षित रखता है।
- source_word: σύμφημι
  choice: सहमत हूँ
  rationale: व्यवस्था के निर्णय से सहमति प्रकट करने का अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: τῷ νόμῳ
  choice: व्यवस्था से
  rationale: सम्प्रदान कारक को हिन्दी के ‘से सहमत’ मुहावरे के अनुसार प्रस्तुत करता है; प्रसंग में यह ज्ञात व्यवस्था की ओर संकेत करता है।
- source_word: καλός
  choice: अच्छी
  rationale: व्यवस्था के सकारात्मक नैतिक गुण को बिना अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
theological_decisions:
- issue: क्या पौलुस व्यवस्था का स्वयं सकारात्मक मूल्यांकन करता है
  choice: ‘व्यवस्था से सहमत हूँ कि वह अच्छी है’
  alternative: ‘मानता हूँ कि व्यवस्था सही है’
  rationale: यह अनुवाद व्यवस्था की अच्छाई के स्पष्ट कथन और व्यक्ति की इच्छा तथा कर्म के बीच तनाव—दोनों को सुरक्षित रखता है, बिना ‘अच्छी’ को केवल ‘सही’ निर्णय तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और निकट-औपचारिक शैली। ‘व्यवस्था’ रोमी पत्र में νόμος के लिए परिचित बाइबिलीय शब्द है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक रखा गया है।
