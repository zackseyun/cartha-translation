source:
  edition: SBLGNT
  text: ἀφορμὴν δὲ λαβοῦσα ἡ ἁμαρτία διὰ τῆς ἐντολῆς κατειργάσατο ἐν ἐμοὶ πᾶσαν ἐπιθυμίαν, χωρὶς γὰρ νόμου ἁμαρτία νεκρά.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/008.yaml
  text: But sin[a], seizing an opportunity through the commandment, produced in me every kind of coveting. For apart from the law[b], sin is dead.
translation:
  language: hi
  text: परन्तु पाप ने आज्ञा के द्वारा अवसर[a] पाकर मेरे भीतर हर प्रकार का लालच[b] उत्पन्न किया; क्योंकि व्यवस्था के बिना पाप मरा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मौका।”
    reason: lexical_alternative
  - marker: b
    text: या, “हर इच्छा।” इस संदर्भ में विशेष अर्थ लालच का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορμήν
  choice: अवसर
  rationale: यह शब्द उस मौके या अनुकूल आधार को दर्शाता है जिसका पाप ने आज्ञा के माध्यम से लाभ उठाया। “अवसर” आधुनिक हिन्दी में स्वाभाविक है और रूपक को बनाए रखता है।
- source_word: λαβοῦσα
  choice: पाकर
  rationale: कृदन्त मुख्य क्रिया से पहले की सहायक क्रिया बताता है। “अवसर पाकर” हिन्दी में स्वाभाविक है और पाप के सक्रिय रूप से अवसर का लाभ उठाने का भाव संदर्भ से स्पष्ट करता है।
- source_word: ἡ ἁμαρτία
  choice: पाप
  rationale: यूनानी पाठ पाप को कार्य करने वाली शक्ति के रूप में व्यक्तित्व देता है; “पाप” को वाक्य का कर्ता रखकर यह चित्र सुरक्षित रहता है।
- source_word: διὰ τῆς ἐντολῆς
  choice: आज्ञा के द्वारा
  rationale: एकवचन आज्ञा निकटवर्ती संदर्भ में उद्धृत विशेष आज्ञा की ओर संकेत करती है और यहाँ वह माध्यम है जिसका पाप उपयोग करता है।
- source_word: κατειργάσατο
  choice: उत्पन्न किया
  rationale: क्रिया किसी परिणाम को घटित या पैदा करने का अर्थ देती है। “उत्पन्न किया” स्पष्ट और पर्याप्त रूप से सशक्त है।
- source_word: πᾶσαν ἐπιθυμίαν
  choice: हर प्रकार का लोभ
  rationale: निकटवर्ती संदर्भ ‘लोभ न करना’ वाली आज्ञा का है, इसलिए यहाँ ἐπιθυμία का संदर्भगत अर्थ “लोभ” है। “हर प्रकार का” πᾶσαν की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χωρὶς γὰρ νόμου
  choice: क्योंकि व्यवस्था के बिना
  rationale: γάρ पिछले कथन का कारण देता है और χωρὶς νόμου व्यवस्था की अनुपस्थिति या उससे पृथक स्थिति बताता है। “व्यवस्था के बिना” सहज हिन्दी है।
- source_word: νεκρά
  choice: मरा हुआ
  rationale: यूनानी का तीखा मृत्यु-रूपक ज्यों का त्यों रखा गया है; इसे “निष्क्रिय” कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: पाप के व्यक्तित्वकरण और “मरा हुआ” रूपक को बनाए रखना
  choice: पाप को क्रियाशील कर्ता रखा गया और νεκρά का अनुवाद “मरा हुआ” किया गया।
  alternative: पाप को केवल अमूर्त धारणा मानकर वाक्य बदलना, या “मरा हुआ” के स्थान पर “निष्क्रिय” कहना।
  rationale: मूल पाठ पाप को अवसर पाने और लोभ उत्पन्न करने वाली शक्ति के रूप में चित्रित करता है तथा अंत में उसे “मरा हुआ” कहता है। अनुवाद इस धर्मवैचारिक तनाव की व्याख्या करके उसे समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “आज्ञा,” “व्यवस्था,” “पाप” और “लोभ” जैसे प्रचलित बाइबलीय शब्द सामान्य पाठक के लिए बोधगम्य हैं।
