  yaml_path: translation/nt/romans/007/012.yaml
  text: So then, the law is holy, and the commandment is holy and righteous and good.
translation:
  language: hi
  text: इसलिए व्यवस्था पवित्र है, और आज्ञा पवित्र, न्यायपूर्ण और अच्छी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: पौलुस के इस संदर्भ में यह मूसा की व्यवस्था की ओर संकेत करता है; ‘व्यवस्था’ बाइबलीय हिन्दी में प्रचलित है और यूनानी पद को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: ἅγιος
  choice: पवित्र
  rationale: यह नैतिक शुद्धता और परमेश्वर के लिए अलग किए जाने—दोनों भावों को समेटने वाला मानक हिन्दी शब्द है।
- source_word: ἐντολή
  choice: आज्ञा
  rationale: यह व्यवस्था के भीतर किसी विशिष्ट आदेश के संभावित संदर्भ को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: δικαία
  choice: धार्मिक
  rationale: यह आज्ञा के नैतिक रूप से सही और न्यायपूर्ण होने का भाव व्यक्त करता है तथा पौलुस की धार्मिकता-संबंधी शब्दावली से संबंध बनाए रखता है।
- source_word: ἀγαθή
  choice: अच्छी
  rationale: यह नैतिक भलाई और हितकारी चरित्र, दोनों की संभावना को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: μὲν
  choice: तो
  rationale: यह हलके बल और वाक्य के प्रवाह को दर्शाता है; यद्यपि स्पष्ट δέ-विरोध नहीं है, हिन्दी में ‘तो’ यहाँ स्वाभाविक है।
- source_word: καί
  choice: भी
  rationale: आज्ञा के विषय में कही गई बात को व्यवस्था के विषय में निकले निष्कर्ष से जोड़ते हुए हिन्दी में स्वाभाविक समावेशी बल देता है।
theological_decisions:
- issue: ‘व्यवस्था’ और ‘आज्ञा’ का संबंध
  choice: दोनों को अलग संज्ञाओं के रूप में रखते हुए आज्ञा को भी पवित्र बताया गया है।
  alternative: आज्ञा को व्यवस्था का पूर्ण समानार्थी मानकर वाक्य को मिला देना।
  rationale: यूनानी पाठ νόμος और ἐντολή को अलग-अलग रखता है; अनुवाद इस भेद को बनाए रखता है और यह तय नहीं करता कि आज्ञा केवल एक विशिष्ट आज्ञा है या व्यवस्था का प्रतिनिधि आदेश।
- issue: δικαία का नैतिक अर्थ
  choice: धार्मिक
  alternative: न्यायपूर्ण
  rationale: दोनों अर्थ संभव हैं; ‘धार्मिक’ पौलुस की नैतिक-धार्मिक शब्दावली से संबंध रखता है, पर किसी विशिष्ट धार्मिक परंपरा की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘व्यवस्था’ और ‘आज्ञा’ पारंपरिक बाइबलीय शब्द हैं, पर वाक्य-विन्यास वर्तमान हिन्दी के अनुरूप रखा गया है।
