  text: Οἴδαμεν γὰρ ὅτι ὁ νόμος πνευματικός ἐστιν· ἐγὼ δὲ ⸀σάρκινός εἰμι, πεπραμένος ὑπὸ τὴν ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/014.yaml
  text: For we know that the law is spiritual[a], but I am fleshly[b], sold under sin.
translation:
  language: hi
  text: क्योंकि हम जानते हैं कि व्यवस्था आत्मिक है, पर मैं देहमय हूँ[a], पाप के अधीन बिका हुआ हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देह से बना हुआ हूँ।”
    reason: lexical_alternative
  - marker: b
    text: या, “पाप के अधीन दास के रूप में बेचा हुआ हूँ,” अर्थात पाप की सत्ता के अधीन।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: हम जानते हैं
  rationale: यह पौलुस और पाठकों के साझा, स्थापित ज्ञान को स्वाभाविक और सीधे ढंग से व्यक्त करता है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: रोमियों के पत्र के संदर्भ में यह प्रचलित और स्पष्ट हिन्दी समतुल्य है तथा मूल पद को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: πνευματικός
  choice: आत्मिक
  rationale: यह व्यवस्था के आत्मा से संबंधित या आत्मा के अनुरूप चरित्र को व्यक्त करता है और σάρκινος के साथ विरोध बनाए रखता है।
- source_word: σάρκινός
  choice: देह का
  rationale: यह cognate adjective के देह-संबंधी अर्थ को बनाए रखता है और ‘पापी स्वभाव वाला’ जैसी अधिक व्याख्यात्मक शब्दावली नहीं जोड़ता।
- source_word: πεπραμένος
  choice: दास के समान बेच दिया गया हूँ
  rationale: perfect passive participle से उत्पन्न वर्तमान अधीन अवस्था और बिक्री में निहित दासत्व-रूपक दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τὴν ἁμαρτίαν
  choice: पाप के अधीन
  rationale: यह मूल की संक्षिप्त अधीनता की भाषा को सुरक्षित रखता है, बिना मुख्य पाठ में ‘पाप की शक्ति’ जोड़कर अर्थ को अधिक स्पष्ट रूप से व्याख्यायित किए।
theological_decisions:
- issue: पौलुस की देह-संबंधी भाषा की व्याख्या कितनी स्पष्ट की जाए
  choice: मुख्य पाठ में ‘देह का’ रखा गया है।
  alternative: पापी; पापी स्वभाव वाला; अनात्मिक
  rationale: यह आत्मिक/देह का विरोध बनाए रखता है और पौलुस की मानव-प्रकृति संबंधी भाषा को किसी बाद की धर्मवैज्ञानिक परिभाषा में सीमित नहीं करता।
- issue: πεπραμένος में दासत्व की छवि
  choice: ‘दास के समान बेच दिया गया’ द्वारा रूपक स्पष्ट किया गया है।
  alternative: केवल ‘बेच दिया गया’
  rationale: प्राचीन संदर्भ में किसी व्यक्ति का बेचा जाना दासत्व का बोध देता है; ‘के समान’ रूपक को स्पष्ट रखते हुए अनावश्यक रूप से यह दावा नहीं करता कि यूनानी पाठ में ‘दास’ संज्ञा प्रत्यक्षतः उपस्थित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘व्यवस्था,’ ‘आत्मिक,’ ‘देह’ और ‘पाप के अधीन’ जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य का आत्मिक/देह संबंधी तनाव सुरक्षित है।
