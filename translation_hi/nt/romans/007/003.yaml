id: ROM.7.3
reference: Romans 7:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄρα οὖν ζῶντος τοῦ ἀνδρὸς μοιχαλὶς χρηματίσει ἐὰν γένηται ἀνδρὶ ἑτέρῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου, τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα γενομένην ἀνδρὶ ἑτέρῳ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/003.yaml
  text: So then[a], while her husband is living, she will be called an adulteress if she belongs to another man. But if the husband dies, she is free from the law[b], so that she is not an adulteress if she belongs to another man.
translation:
  language: hi
  text: इसलिए, जब तक उसका पति जीवित है, यदि वह किसी दूसरे पुरुष की हो जाए[a], तो वह व्यभिचारिणी कहलाएगी। पर यदि उसका पति मर जाए, तो वह उस व्यवस्था से मुक्त है[b]; इसलिए, किसी दूसरे पुरुष की हो जाने पर वह व्यभिचारिणी नहीं कहलाती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, किसी दूसरे पुरुष की पत्नी बन जाए या उससे जुड़ जाए।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “व्यवस्था” का तात्कालिक अर्थ विवाह-संबंध को बाँधने वाली व्यवस्था है।
    reason: cultural_note
lexical_decisions:
- source_word: ἄρα οὖν
  choice: इसलिए
  rationale: दोनों निष्कर्षसूचक अव्ययों का संयुक्त बल पिछले कथन से निकलने वाले परिणाम को दिखाता है; आधुनिक हिन्दी में ‘इसलिए’ स्वाभाविक और स्पष्ट है।
- source_word: ζῶντος τοῦ ἀνδρός
  choice: जब तक उसका पति जीवित है
  rationale: यह genitive absolute पति के जीवित रहने की समकालिक परिस्थिति बताता है; प्रसंग के आधार पर ‘उसका’ जोड़ा गया है।
- source_word: μοιχαλὶς
  choice: व्यभिचारिणी
  rationale: यह संज्ञा विशेष रूप से व्यभिचार करने वाली स्त्री को दर्शाती है; ‘व्यभिचारिणी’ सटीक और गरिमापूर्ण हिन्दी है।
- source_word: χρηματίσει
  choice: कहलाएगी
  rationale: यहाँ क्रिया का अर्थ किसी नाम या दर्जे से पुकारा अथवा माना जाना है; भविष्यकाल का भाव ‘कहलाएगी’ में बना रहता है।
- source_word: ἐὰν γένηται ἀνδρὶ ἑτέρῳ / γενομένην ἀνδρὶ ἑτέρῳ
  choice: यदि वह किसी दूसरे पुरुष की हो जाए
  rationale: γίνομαι के साथ dative किसी दूसरे पुरुष के साथ वैवाहिक अथवा दाम्पत्य संबंध में आने का संकेत देता है। ‘की हो जाए’ मूल की संक्षिप्त संबंधपरक अभिव्यक्ति और उसकी कुछ अस्पष्टता को सुरक्षित रखता है; पादटिप्पणी अधिक स्पष्ट विकल्प देती है।
- source_word: ἐλευθέρα ἐστὶν ἀπὸ τοῦ νόμου
  choice: वह उस व्यवस्था से मुक्त है
  rationale: ‘मुक्त’ बाध्यता से स्वतंत्र होने का अर्थ देता है। निश्चित article को ‘उस’ से व्यक्त करने पर तत्काल संदर्भ में विवाह को बाँधने वाली व्यवस्था की ओर संकेत बना रहता है, बिना मुख्य पाठ में उसका दायरा अत्यधिक स्पष्ट किए।
- source_word: τοῦ μὴ εἶναι αὐτὴν μοιχαλίδα
  choice: इसलिए ... वह व्यभिचारिणी नहीं है
  rationale: articular infinitive यहाँ परिणाम को व्यक्त करता है; हिन्दी में ‘इसलिए’ उस तार्किक परिणाम को सहज ढंग से जोड़ता है।
theological_decisions:
- issue: νόμος का तात्कालिक दायरा
  choice: मुख्य पाठ में ‘उस व्यवस्था’
  alternative: विवाह की व्यवस्था; मूसा की व्यवस्था का व्यापक अर्थ
  rationale: तात्कालिक प्रसंग पति के जीवन और मृत्यु के अनुसार पत्नी की कानूनी-वैवाहिक स्थिति का है। ‘उस व्यवस्था’ मूल शब्दावली को बनाए रखता है और व्यापक पौलुसी अर्थ को अनावश्यक रूप से आरोपित नहीं करता; पादटिप्पणी तत्काल संदर्भ स्पष्ट करती है।
- issue: γένηται ἀνδρὶ ἑτέρῳ में संबंध की प्रकृति
  choice: किसी दूसरे पुरुष की हो जाए
  alternative: किसी दूसरे पुरुष की पत्नी बन जाए; किसी दूसरे पुरुष से जुड़ जाए
  rationale: मूल अभिव्यक्ति संबंध में आने को बताती है, पर संज्ञा ‘पत्नी’ स्पष्ट रूप से नहीं कहती। चुना हुआ पाठ उस संक्षिप्तता को रखता है, जबकि पादटिप्पणी वैवाहिक प्रसंग बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यभिचारिणी’ कानूनी-नैतिक संदर्भ की सटीकता बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
