  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: βλέπω δὲ ἕτερον νόμον ἐν τοῖς μέλεσίν μου ἀντιστρατευόμενον τῷ νόμῳ τοῦ νοός μου καὶ αἰχμαλωτίζοντά με ⸀ἐν τῷ νόμῳ τῆς ἁμαρτίας τῷ ὄντι ἐν τοῖς μέλεσίν μου.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/023.yaml
  text: But I see another law in my members[b][a], waging war against the law of my mind and taking me captive to the law of sin that is in my members.
translation:
  language: hi
  text: पर मैं अपने अंगों में एक और नियम[a] देखता हूँ, जो मेरे मन के नियम के विरुद्ध युद्ध करता है और मुझे मेरे अंगों में मौजूद पाप के नियम के अधीन बंदी बना लेता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ बार-बार आए “नियम” का अनुवाद “सिद्धांत” या “शक्ति” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पाप के नियम में बंदी बना लेता है”; “के अधीन” उस नियम की सत्ता के नीचे बंदी होने का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέπω
  choice: मैं ... देखता हूँ
  rationale: साधारण वर्तमान काल पौलुस के सजीव, प्रत्यक्ष अनुभव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἕτερον
  choice: एक दूसरा
  rationale: यह पहले उल्लिखित नियम से भेद बनाए रखता है, बिना अर्थ को अनावश्यक रूप से तीखा किए।
- source_word: νόμον / νόμῳ
  choice: नियम
  rationale: νόμος की पुनरावृत्ति को हर स्थान पर एक ही शब्द से रखकर मूल की अलंकारिक शक्ति और 'नियम' बनाम 'नियम' का तनाव सुरक्षित रहता है। हिन्दी में इस संदर्भ में 'नियम' अधिक स्वाभाविक है; 'व्यवस्था' से मूसा की व्यवस्था का अर्थ अनावश्यक रूप से निश्चित हो सकता है।
- source_word: ἐν τοῖς μέλεσίν μου
  choice: अपने अंगों में / मेरे अंगों में
  rationale: यह पौलुस के ठोस शारीरिक रूपक को सुरक्षित रखता है और इसे केवल 'शरीर' कहकर समतल नहीं करता।
- source_word: ἀντιστρατευόμενον
  choice: के विरुद्ध युद्ध करता है
  rationale: मूल की सैनिक छवि को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में बनाए रखता है।
- source_word: τοῦ νοός μου
  choice: मेरे मन के
  rationale: νοῦς की बौद्धिक और इच्छात्मक आंतरिक क्षमता के लिए 'मन' सीधा तथा सुबोध विकल्प है।
- source_word: αἰχμαλωτίζοντά με
  choice: मुझे ... बंदी बना लेता है
  rationale: यह युद्ध की छवि जारी रखता है और क्रिया के अधीनता में ले आने वाले बल को व्यक्त करता है।
- source_word: ἐν τῷ νόμῳ τῆς ἁμαρτίας
  choice: पाप के नियम के अधीन
  rationale: ग्रीक ἐν का शाब्दिक रूप 'में' है, पर बंदी बनाए जाने के परिणामस्वरूप उस नियम की सत्ता के नीचे आना हिन्दी में 'के अधीन' से अधिक स्पष्ट और स्वाभाविक व्यक्त होता है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: यह मानक, स्पष्ट और संदर्भानुकूल अनुवाद है।
theological_decisions:
- issue: νόμος को 'नियम', 'सिद्धांत', या 'शक्ति' के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में हर बार 'नियम'
  alternative: एक या अधिक स्थानों पर 'सिद्धांत' अथवा 'शक्ति'
  rationale: एक ही शब्द की पुनरावृत्ति पौलुस के जानबूझकर बनाए गए धार्मिक और अलंकारिक तनाव को सुरक्षित रखती है; 'सिद्धांत' या 'शक्ति' अर्थ की व्याख्या पहले ही निश्चित कर देते।
- issue: ἐν τῷ νόμῳ τῆς ἁμαρτίας का संबंध
  choice: पाप के नियम के अधीन बंदी बना लेता है
  alternative: पाप के नियम में बंदी बना लेता है
  rationale: मुख्य पाठ स्वाभाविक हिन्दी में परिणामस्वरूप अधीनता व्यक्त करता है, जबकि पादटिप्पणी मूल पूर्वसर्ग की अधिक शाब्दिक अभिव्यक्ति बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। 'अंगों' ने मूल शारीरिक रूपक, और 'युद्ध' तथा 'बंदी' ने लगातार चल रही सैनिक छवि को सुरक्षित रखा है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
