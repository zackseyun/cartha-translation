  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταλαίπωρος ἐγὼ ἄνθρωπος· τίς με ῥύσεται ἐκ τοῦ σώματος τοῦ θανάτου τούτου;
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/024.yaml
  text: What a wretched man I am! Who will rescue me from this body of death?[a][b]
translation:
  language: hi
  text: हाय, मैं कैसा अभागा मनुष्य हूँ! मुझे इस मृत्यु की देह से कौन छुड़ाएगा?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक स्वाभाविक रूप में, “मृत्यु की इस देह से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ταλαίπωρος
  choice: अभागा
  rationale: यह शब्द गहरी दयनीयता और संकट की दशा व्यक्त करता है; ‘अभागा’ विलाप की भावनात्मक तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἐγὼ ἄνθρωπος
  choice: मैं…मनुष्य
  rationale: प्रथम पुरुष और ἄνθρωπος दोनों को स्पष्ट रखते हुए पौलुस के आत्म-संदर्भ को सुरक्षित करता है।
- source_word: τίς
  choice: कौन
  rationale: यह किसी छुड़ाने वाले के विषय में व्यक्तिगत प्रश्न है।
- source_word: ῥύσεται
  choice: छुड़ाएगा
  rationale: क्रिया संकट या बन्धन से बचाकर निकालने का अर्थ देती है; ‘छुड़ाएगा’ आधुनिक हिन्दी में स्वाभाविक है और ‘उद्धार करेगा’ की सम्भावित धार्मिक संकीर्णता से बचता है।
- source_word: ἐκ
  choice: से
  rationale: अलग किए जाने या बाहर निकाले जाने का सामान्य और स्वाभाविक हिन्दी बोध देता है।
- source_word: σώματος
  choice: देह
  rationale: मूल पाठ की ठोस शारीरिक उपमा को बनाए रखता है और इस प्रसंग के गंभीर साहित्यिक स्तर के अनुकूल है।
- source_word: τοῦ θανάτου τούτου
  choice: इस मृत्यु की
  rationale: यूनानी पदबंध में संकेतवाचक ‘इस’ व्याकरणतः ‘मृत्यु’ से जुड़ा है; हिन्दी में ‘इस मृत्यु की देह’ उसकी वास्तविक संरचना और जानबूझकर रखी गई असामान्यता को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम पदबंध में संकेतवाचक शब्द का सम्बन्ध
  choice: इस मृत्यु की देह
  alternative: मृत्यु की इस देह
  rationale: यूनानी τοῦ θανάτου τούτου में ‘इस’ का व्याकरणिक सम्बन्ध ‘मृत्यु’ से है। मुख्य पाठ में इसे बनाए रखने से ‘इस देह’ वाली व्याख्यात्मक पुनर्संरचना थोपे बिना मूल की अस्पष्ट और तीखी छवि सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; पौलुस के व्याकुल आत्म-विलाप को ‘हाय’ और विस्मयादिबोधक वाक्य से व्यक्त किया गया है। भाषा साधारण पाठकों के लिए सुबोध है, जबकि मूल यूनानी के असामान्य अंतिम पदबंध को मुख्य पाठ में यथासम्भव सुरक्षित रखा गया है।
