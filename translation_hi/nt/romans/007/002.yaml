source:
  edition: SBLGNT
  text: ἡ γὰρ ὕπανδρος γυνὴ τῷ ζῶντι ἀνδρὶ δέδεται νόμῳ· ἐὰν δὲ ἀποθάνῃ ὁ ἀνήρ, κατήργηται ἀπὸ τοῦ νόμου τοῦ ἀνδρός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/007/002.yaml
  text: For a married woman is bound by law to her husband while he lives; but if the husband dies[a], she is released from the law of her husband.
translation:
  language: hi
  text: क्योंकि विवाहित स्त्री अपने पति के जीवित रहने तक व्यवस्था के द्वारा उससे बँधी रहती है; पर यदि पति मर जाए, तो वह पति से सम्बन्धित व्यवस्था से मुक्त हो जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕπανδρος γυνή
  choice: विवाहित स्त्री
  rationale: यह पद विवाह के बंधन में स्थित स्त्री को दर्शाता है; ‘विवाहित स्त्री’ स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: τῷ ζῶντι ἀνδρί
  choice: अपने पति के जीवित रहने तक उससे
  rationale: यूनानी में पति के जीवित होने पर बल है। हिन्दी में यह रचना सम्बन्ध और समय-सीमा दोनों को स्वाभाविक रूप से स्पष्ट करती है।
- source_word: δέδεται
  choice: बँधी रहती है
  rationale: पूर्ण निष्क्रिय रूप अतीत में स्थापित और वर्तमान में जारी बंधन की अवस्था व्यक्त करता है; ‘बँधी रहती है’ इस निरंतर कानूनी स्थिति को दर्शाता है।
- source_word: νόμῳ
  choice: व्यवस्था के द्वारा
  rationale: यहाँ अनिश्चित/गुणवाचक प्रयोग विवाह से जुड़े कानूनी सिद्धान्त की ओर संकेत करता है; ‘व्यवस्था’ पौलुस की शब्दावली से संगति रखते हुए अर्थ को केवल मूसा की व्यवस्था तक सीमित नहीं करती।
- source_word: κατήργηται
  choice: मुक्त हो जाती है
  rationale: इस प्रसंग में क्रिया का अर्थ किसी कानूनी बंधन या अधिकार-क्षेत्र से निष्प्रभावी होकर छूट जाना है, न कि स्त्री का ‘नाश’ या ‘समाप्त’ होना।
- source_word: ἀπὸ τοῦ νόμου τοῦ ἀνδρός
  choice: पति से सम्बन्धित व्यवस्था से
  rationale: संक्षिप्त यूनानी संबंधकारक को इस प्रकार व्यक्त करने से यह भ्रम नहीं होता कि पति स्वयं व्यवस्था देने वाला है, और विवाह में उससे बाँधने वाली व्यवस्था का अर्थ बना रहता है।
theological_decisions:
- issue: क्या νόμῳ / τοῦ νόμου विशेष रूप से मूसा की व्यवस्था है या विवाह का सामान्य कानूनी बंधन
  choice: विवाह से सम्बन्धित व्यवस्था या कानूनी सिद्धान्त
  alternative: विवाह पर लागू मूसा की व्यवस्था
  rationale: तात्कालिक प्रसंग विवाह और मृत्यु से समाप्त होने वाले कानूनी बंधन का उदाहरण देता है। पहले νόμῳ का लेखरहित प्रयोग और वैवाहिक संदर्भ सामान्य कानूनी-विवाहिक अर्थ का समर्थन करते हैं, यद्यपि ‘व्यवस्था’ शब्द पौलुस के व्यापक तर्क से सम्बन्ध बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। कानूनी-विवाहिक रूपक को स्पष्ट रखा गया है और यूनानी के संबंधकारक पद का अत्यधिक शाब्दिक, भ्रमकारी अनुवाद टाला गया है।
