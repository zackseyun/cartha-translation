translation:
  language: hi
  text: जो तुम्हें सताते हैं, उन्हें आशीष दो[a]; आशीष दो और शाप मत दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो तुम्हारा पीछा करते हैं।’ यूनानी क्रिया का अर्थ ‘पीछा करना’ भी हो सकता है, पर यहाँ संभवतः शत्रुतापूर्ण सताव अभिप्रेत है।
