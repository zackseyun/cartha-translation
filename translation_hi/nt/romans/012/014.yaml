lexical_decisions:
- source_word: εὐλογεῖτε
  choice: आशीष दो
  rationale: बहुवचन आज्ञार्थक क्रिया का स्वाभाविक और संक्षिप्त हिन्दी रूप। यह दूसरों के लिए भलाई कहने या चाहने के धार्मिक-नैतिक भाव को बनाए रखता है। यूनानी पाठ की बलपूर्ण पुनरावृत्ति भी ज्यों की त्यों रखी गई है।
- source_word: τοὺς διώκοντας
  choice: जो तुम्हें सताते हैं
  rationale: 'लेखयुक्त कृदन्त यहाँ संज्ञा के समान प्रयुक्त है: ‘सतानेवाले लोग।’ διώκω का व्यापक अर्थ ‘पीछा करना’ हो सकता है, पर इस संदर्भ में विरोधपूर्ण उत्पीड़न अभिप्रेत होने की अधिक संभावना है। यूनानी में कर्म निहित है; सहज हिन्दी के लिए ‘तुम्हें’ जोड़ा गया है।'
- source_word: καὶ
  choice: और
  rationale: दोहराई गई सकारात्मक आज्ञा को नकारात्मक निषेध से जोड़ने वाला सरल संयोजक।
- source_word: μὴ καταρᾶσθε
  choice: शाप मत दो
  rationale: μή के साथ वर्तमान आज्ञार्थक रूप निषेध व्यक्त करता है। ‘शाप मत दो’ स्पष्ट, स्वाभाविक है और ‘आशीष दो’ के साथ मूल विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: संदर्भ में διώκω का अर्थ-क्षेत्र
  choice: विरोधपूर्ण उत्पीड़न के अर्थ में ‘सताते हैं’
  alternative: ‘पीछा करते हैं’
  rationale: यद्यपि διώκω का अर्थ सामान्यतः ‘पीछा करना’ भी हो सकता है, पौलुस के नैतिक उपदेश और आशीष देने बनाम शाप देने के विरोध में यहाँ शत्रुतापूर्ण सताव अधिक उपयुक्त है। पादटिप्पणी व्यापक शाब्दिक संभावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज शैली। ‘आशीष दो’ की पुनरावृत्ति मूल यूनानी के बलाघात को बनाए रखती है; संबोधन बहुवचन है।
