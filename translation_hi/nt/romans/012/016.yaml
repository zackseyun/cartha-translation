  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες, μὴ τὰ ὑψηλὰ φρονοῦντες ἀλλὰ τοῖς ταπεινοῖς συναπαγόμενοι. μὴ γίνεσθε φρόνιμοι παρ’ ἑαυτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/016.yaml
  text: Be of the same mind toward one another[a]; do not set your mind on high things, but associate with the lowly[b]. Do not become wise in your own sight.
translation:
  language: hi
  text: एक-दूसरे के प्रति एक-सा मनोभाव रखो। ऊँची बातों पर मन न लगाओ[a], बल्कि दीनों के साथ जुड़ो[b]। अपनी ही दृष्टि में बुद्धिमान न बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊँची चीज़ों की आकांक्षा न करो” अथवा “घमंडी न बनो।”
    reason: lexical_alternative
  - marker: b
    text: या “नम्र लोगों के साथ जुड़ो”; यूनानी शब्द का अर्थ दीन लोग या निम्न/साधारण बातें या वस्तुएँ—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ αὐτὸ εἰς ἀλλήλους φρονοῦντες
  choice: एक-दूसरे के प्रति एक ही भाव रखो
  rationale: यह यूनानी मुहावरा केवल एक जैसी राय रखने के बजाय समुदाय में परस्पर मेल और समान मनोभाव रखने का आग्रह करता है। यह हिंदी अभिव्यक्ति संबंधपरक दिशा और उपदेशात्मक बल दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: μὴ τὰ ὑψηλὰ φρονοῦντες
  choice: ऊँची बातों पर मन न लगाओ
  rationale: शाब्दिक चित्र ‘ऊँची बातों को मन में रखना’ है। चुना हुआ रूप घमंड, ऊँचे पद या प्रतिष्ठित वस्तुओं की आकांक्षा—इन संभावित अर्थों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: τοῖς ταπεινοῖς συναπαγόμενοι
  choice: दीन लोगों के साथ हो लो
  rationale: संदर्भ में συναπαγόμενοι साथ जुड़ने या उनके साथ चलने का भाव देता है। ‘साथ हो लो’ आधुनिक और सहज हिंदी है; मुख्य पाठ में व्यक्तिवाचक अर्थ लिया गया है, जबकि विशेषण के संभावित नपुंसकलिंगी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: μὴ γίνεσθε
  choice: न बनो
  rationale: γίνομαι में किसी दशा को अपनाने या उसमें बनने का प्रक्रियात्मक भाव है, जिसे ‘न बनो’ सुरक्षित रखता है।
- source_word: φρόνιμοι παρ’ ἑαυτοῖς
  choice: अपनी ही दृष्टि में बुद्धिमान
  rationale: यह अपने ही आकलन में स्वयं को बुद्धिमान मानने का मुहावरा है। हिंदी में यह रूप स्पष्ट, गरिमापूर्ण और स्रोत के निकट है।
theological_decisions:
- issue: τὰ ὑψηλά और τοῖς ταπεινοῖς का सामाजिक तथा मनोभाव-संबंधी अर्थ
  choice: मुख्य पाठ ऊँची बातों की ओर मन लगाने के विपरीत दीन लोगों के साथ होने का आग्रह करता है, पर पादटिप्पणियाँ अर्थ की व्यापकता बनाए रखती हैं।
  alternative: ‘घमंडी न बनो, बल्कि नम्र लोगों के साथ रहो’ अथवा ‘ऊँची वस्तुओं की आकांक्षा न करो, बल्कि साधारण कामों में लगो।’
  rationale: यूनानी पाठ आंतरिक अभिमान, सामाजिक प्रतिष्ठा और दीन लोगों अथवा साधारण बातों—इन सभी अर्थ-छायाओं की अनुमति देता है। इसलिए अनुवाद किसी एक संकीर्ण धार्मिक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामुदायिक उपदेश के अनुकूल रखी गई है। ‘एक ही भाव’, ‘मन लगाना’ और ‘साथ हो लेना’ जैसे स्वाभाविक पद स्रोत की अर्थ-छवियों को सामान्य पाठक के लिए सुलभ बनाते हैं।
