id: ROM.12.9
reference: Romans 12:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἡ ἀγάπη ἀνυπόκριτος. ἀποστυγοῦντες τὸ πονηρόν, κολλώμενοι τῷ ἀγαθῷ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/009.yaml
  text: Let love be without hypocrisy[a]. Abhor what is evil; cling to what is good.
translation:
  language: hi
  text: प्रेम निष्कपट हो।[a] बुराई से घृणा करो; भलाई से लिपटे रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रेम में कोई कपट न हो।” यूनानी में शाब्दिक रूप से “प्रेम निष्कपट” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: आधुनिक मानक हिन्दी में यह ἀγάπη का स्वाभाविक, व्यापक और गरिमापूर्ण समतुल्य है।
- source_word: ἀνυπόκριτος
  choice: निष्कपट
  rationale: यह दिखावे या कपट से रहित होने का भाव संक्षेप और स्वाभाविक रूप में व्यक्त करता है; यूनानी का क्रियारहित वाक्य हिन्दी में भी सहज बना रहता है।
- source_word: ἀποστυγοῦντες
  choice: घृणा करो
  rationale: यह क्रिया बुराई के प्रति तीव्र नैतिक विरक्ति व्यक्त करती है। उपदेशात्मक संदर्भ के कारण कृदन्त को आज्ञार्थक रूप दिया गया है।
- source_word: τὸ πονηρόν
  choice: बुराई
  rationale: नपुंसकलिंग विशेषण यहाँ संज्ञा के रूप में व्यापक नैतिक बुराई को सूचित करता है; ‘बुराई’ हिन्दी में स्वाभाविक है और अर्थ को किसी एक कार्य तक सीमित नहीं करती।
- source_word: κολλώμενοι
  choice: लिपटे रहो
  rationale: यह निकटता से जुड़े रहने और दृढ़ता से थामे रहने की सजीव तीव्रता को बनाए रखता है; ‘रहो’ निरंतर लगाव का संकेत देता है।
- source_word: τῷ ἀγαθῷ
  choice: भलाई
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का व्यापक नैतिक अर्थ रखता है और ‘बुराई’ के साथ स्पष्ट समानांतर बनाता है।
theological_decisions:
- issue: क्रियारहित आरंभिक वाक्य और उपदेशात्मक कृदन्तों का बल
  choice: आरंभ को ‘प्रेम निष्कपट हो’ और अगले दोनों खंडों को सीधे उपदेश के रूप में प्रस्तुत किया गया है।
  alternative: ‘निष्कपट प्रेम, बुराई से घृणा करते हुए, भलाई से लिपटे हुए’ जैसा अधिक शब्दशः खंडित रूप।
  rationale: रोमियों 12 में ये नैतिक उपदेशों की शृंखला हैं। हिन्दी में विध्यर्थक और आज्ञार्थक रूप लेखक के आशय को स्पष्ट करते हैं, जबकि आरंभिक यूनानी वाक्य की संक्षिप्तता भी बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘निष्कपट’ सामान्य पाठक के लिए बोधगम्य है और ‘लिपटे रहो’ मूल क्रिया की सजीव निकटता को व्यक्त करता है।
