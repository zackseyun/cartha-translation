translation:
  language: hi
  text: यदि किसी को सेवा का वर मिला है, तो वह सेवा में लगा रहे[a]; यदि कोई सिखाता है, तो वह सिखाने में लगा रहे[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यदि सेवकाई है, तो सेवकाई में लगा रहे।’ यूनानी शब्द διακονία का अर्थ ‘सेवा’ या ‘सेवकाई’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यदि शिक्षक है, तो शिक्षण में लगा रहे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: यदि
  rationale: यहाँ εἴτε वरों और कार्यों की संक्षिप्त, शर्त-सदृश सूची को आगे बढ़ाता है। ‘यदि’ इस समानांतर रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διακονίαν
  choice: सेवा का वर मिला है
  rationale: διακονία का अर्थ सेवा, सेवाकार्य या व्यावहारिक सहायता हो सकता है। प्रसंग में वरों की सूची होने के कारण ‘सेवा का वर मिला है’ हिन्दी में निहित अर्थ स्पष्ट करता है, पर इसे किसी औपचारिक कलीसियाई पद तक सीमित नहीं करता।
- source_word: ἐν τῇ διακονίᾳ
  choice: सेवा में लगे रहें
  rationale: ἐν के साथ दोहराया गया संज्ञा-पद व्यक्ति को उसी कार्य-क्षेत्र में तत्पर रहने का संकेत देता है। ‘सेवा में लगे रहें’ संक्षिप्तता और व्यावहारिक आग्रह दोनों व्यक्त करता है।
- source_word: ὁ διδάσκων
  choice: जो सिखाता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त व्यक्ति के औपचारिक पद से अधिक उसके सिखाने के कार्य पर बल देता है।
- source_word: διδασκαλίᾳ
  choice: सिखाने
  rationale: यहाँ διδασκαλία सिखाने की क्रिया या शिक्षा को दर्शाता है। ‘सिखाने’ तत्काल प्रसंग में सहज और स्पष्ट है; ‘सिद्धान्त’ अनावश्यक रूप से तकनीकी होता।
theological_decisions:
- issue: क्या διακονία के लिए औपचारिक कलीसियाई शब्दावली अपनाई जाए
  choice: सेवा
  alternative: सेवकाई
  rationale: वरों और कार्यों की इस सूची में ‘सेवा’ शब्द अर्थ की व्यापकता बनाए रखता है और इसे किसी विशिष्ट पद या संस्थागत सेवकाई तक सीमित नहीं करता।
- issue: क्या ὁ διδάσκων को पदनाम बनाया जाए
  choice: जो सिखाता है
  alternative: शिक्षक
  rationale: यूनानी कृदन्त सिखाने में लगे व्यक्ति पर बल देता है; यह अनुवाद पाठ से अधिक संस्थागत संरचना नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक बहुवचन का प्रयोग किया गया है। मूल यूनानी की अपूर्ण, अत्यंत संक्षिप्त रचना को स्वाभाविक बनाने के लिए ‘का वर मिला है’ और ‘लगे रहें’ जोड़े गए हैं; पद या औपचारिक कार्यालय का भाव नहीं जोड़ा गया।
