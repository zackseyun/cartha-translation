source:
  edition: SBLGNT
  text: ἔχοντες δὲ χαρίσματα κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν διάφορα, εἴτε προφητείαν κατὰ τὴν ἀναλογίαν τῆς πίστεως,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/006.yaml
  text: 'But having gifts that differ according to the grace given to us: if prophecy[a], in proportion to faith;'
translation:
  language: hi
  text: 'और हमें दिए गए अनुग्रह के अनुसार हमारे वरदान अलग-अलग हैं: यदि भविष्यवाणी का वरदान मिला है, तो विश्वास के अनुपात में उसका उपयोग करें[a];'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने विश्वास के अनुपात में”; एक अन्य सम्भावना है, “मसीही विश्वास के अनुरूप।” यूनानी पदबंध भविष्यवाणी करनेवाले को मिले विश्वास की मात्रा या मसीही विश्वास की विषयवस्तु के साथ अनुरूपता—दोनों में से किसी की ओर संकेत कर सकता है।
    reason: वैकल्पिक अर्थ
lexical_decisions:
- source_word: ἔχοντες δὲ
  choice: और ... हैं
  rationale: वर्तमान कृदन्त पिछले वाक्य के प्रवाह को आगे बढ़ाता है। हिन्दी में समापिका रचना स्वाभाविक है; δέ यहाँ हल्के संक्रमण/निरंतरता को दर्शाता है, इसलिए कठोर विरोधसूचक ‘परन्तु’ से बचा गया है।
- source_word: χαρίσματα ... διάφορα
  choice: हमारे वरदान अलग-अलग हैं
  rationale: χαρίσματα के लिए प्रचलित और स्पष्ट ‘वरदान’ चुना गया; διάφορα की विधेयात्मक भूमिका ‘अलग-अलग हैं’ से व्यक्त होती है।
- source_word: κατὰ τὴν χάριν τὴν δοθεῖσαν ἡμῖν
  choice: हमें दिए गए अनुग्रह के अनुसार
  rationale: κατά अनुरूपता/मानक व्यक्त करता है और χάρις यहाँ परमेश्वर से मिले कृपापूर्ण सामर्थ्य का बोध देता है।
- source_word: εἴτε προφητείαν
  choice: यदि भविष्यवाणी का वरदान मिला है
  rationale: मूल की संक्षिप्त, अपूर्ण सूचीगत रचना को सहज हिन्दी में स्पष्ट किया गया है; ‘वरदान’ संदर्भ से लिया गया है और कोई नया धार्मिक अर्थ नहीं जोड़ता।
- source_word: κατὰ τὴν ἀναλογίαν τῆς πίστεως
  choice: विश्वास के अनुपात में
  rationale: ἀναλογία का मूल भाव अनुपात अथवा अनुरूपता है। यह अभिव्यक्ति जानबूझकर व्यापक रखी गई है ताकि πίστις को व्यक्ति के विश्वास या मसीही विश्वास की विषयवस्तु मानने की दोनों संभावनाएँ बनी रहें।
theological_decisions:
- issue: κατὰ τὴν ἀναλογίαν τῆς πίστεως का अर्थ
  choice: मुख्य पाठ में ‘विश्वास के अनुपात में’
  alternative: ‘अपने विश्वास के अनुपात में’ अथवा ‘मसीही विश्वास के अनुरूप’
  rationale: यूनानी पदबंध संक्षिप्त और वास्तव में बहुअर्थी है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता; प्रमुख विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- issue: खंडित यूनानी वाक्य में निहित क्रिया
  choice: ‘उसका उपयोग करें’ को स्पष्ट किया गया
  alternative: केवल ‘तो विश्वास के अनुपात में’
  rationale: मूल में क्रिया अध्याहृत है और आगे के उपदेशात्मक संदर्भ से वरदान का प्रयोग करना निहित है। सहज हिन्दी के लिए इसे स्पष्ट किया गया, बिना भविष्यवाणी की प्रकृति पर अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अनुग्रह’, ‘वरदान’, ‘भविष्यवाणी’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द रखे गए हैं।
