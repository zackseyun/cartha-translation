  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῇ ἐλπίδι χαίροντες, τῇ θλίψει ὑπομένοντες, τῇ προσευχῇ προσκαρτεροῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/012.yaml
  text: rejoicing in hope[a], enduring in affliction, persisting in prayer[b],
translation:
  language: hi
  text: आशा में आनन्दित रहो, क्लेश में धीरज धरो[a], प्रार्थना में निरन्तर लगे रहो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्लेश में दृढ़ बने रहो।”
    reason: ὑπομένοντες में कठिनाई के बीच टिके रहने और दृढ़तापूर्वक सहने—दोनों का भाव है।
  - marker: b
    text: या, “प्रार्थना के प्रति समर्पित रहो।”
    reason: προσκαρτεροῦντες केवल बार-बार करते रहने को नहीं, बल्कि दृढ़ और समर्पित निरन्तरता को भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἐλπίδι
  choice: आशा में
  rationale: संज्ञा ἐλπίς आशा या आशापूर्ण अपेक्षा को व्यक्त करती है; यहाँ साधन/क्षेत्रसूचक दत्तिव का स्वाभाविक हिन्दी रूप ‘आशा में’ है।
- source_word: χαίροντες
  choice: आनन्दित रहो
  rationale: वर्तमान कृदन्त उपदेशात्मक क्रम में प्रयुक्त है। हिन्दी में आज्ञार्थक ‘आनन्दित रहो’ निरन्तर भाव और उपदेश—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: θλίψει
  choice: क्लेश में
  rationale: θλῖψις दबाव, संकट, दुःख या उत्पीड़नजन्य कष्ट को दर्शाता है। ‘क्लेश’ संक्षिप्त, गरिमापूर्ण और इस व्यापक अर्थ के अनुकूल है।
- source_word: ὑπομένοντες
  choice: धीरज धरो
  rationale: ὑπομένω कठिनाई के नीचे टिके रहने और सहनशील दृढ़ता का भाव देता है। ‘धीरज धरो’ आधुनिक हिन्दी में स्वाभाविक उपदेशात्मक अभिव्यक्ति है, यद्यपि ‘दृढ़ बने रहो’ भी सम्भव है।
- source_word: προσευχῇ
  choice: प्रार्थना में
  rationale: यह सामान्य रूप से प्रार्थना को सूचित करता है; यूनानी निश्चित लेख को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: προσκαρτεροῦντες
  choice: निरन्तर लगे रहो
  rationale: προσκαρτερέω किसी कार्य में दृढ़तापूर्वक बने रहने, लगे रहने या उसके प्रति समर्पित रहने को व्यक्त करता है। यह चयन निरन्तरता और निष्ठा दोनों को सहज हिन्दी में रखता है।
theological_decisions: []
