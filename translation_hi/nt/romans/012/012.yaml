  register: आधुनिक मानक हिन्दी में संक्षिप्त, लयात्मक और गरिमापूर्ण त्रिखण्डीय उपदेश रखा गया है। यूनानी कृदन्तों को स्वाभाविक हिन्दी आज्ञार्थक रूपों में व्यक्त किया गया है।
