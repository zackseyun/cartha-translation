  verdict: revise
  source_fidelity: The draft accurately preserves the prohibition against conformity to the present αἰών, the contrast with transformation through renewal of the mind, the purpose clause, and the threefold description of God's will. The rendering “परखकर जान सको” appropriately conveys δοκιμάζειν as evaluative discernment without implying that people authoritatively judge God's will.
  naturalness: The Hindi is modern, clear, and suitably dignified. “इस युग के साँचे में न ढलो” effectively retains the image of external conformity, and “रूपांतरित होते जाओ” expresses the ongoing imperative naturally.
  terminology: “युग,” “नवीनीकरण,” and “रूपांतरित” are sound choices. However, “सिद्ध” ordinarily means accomplished, proven, or established in modern Hindi and does not reliably express τέλειον here. “पूर्ण” is the more direct and idiomatic equivalent for “perfect/complete.”
  issues:
  - severity: medium
    issue: The final adjective τέλειον is rendered “सिद्ध.”
    rationale: In current standard Hindi, “सिद्ध” commonly denotes something proven, established, accomplished, or successful. In this triad describing God's will, τέλειον means perfect or complete. “पूर्ण” preserves this sense without adding a different nuance.
