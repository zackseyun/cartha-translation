id: ROM.12.2
reference: Romans 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ μὴ ⸀συσχηματίζεσθε τῷ αἰῶνι τούτῳ, ἀλλὰ ⸀μεταμορφοῦσθε τῇ ἀνακαινώσει τοῦ ⸀νοός, εἰς τὸ δοκιμάζειν ὑμᾶς τί τὸ θέλημα τοῦ θεοῦ, τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/002.yaml
  text: And do not be conformed to this age[a], but be transformed by the renewing of your mind[c][b], so that you may discern what the will of God is—the good and pleasing and perfect.
translation:
  language: hi
  text: और इस युग[a] के साँचे में न ढलो, बल्कि अपने मन के नवीनीकरण से रूपांतरित होते जाओ, ताकि तुम परखकर जान सको[b] कि परमेश्वर की इच्छा क्या है—जो भली, मनभावनी[c] और पूर्ण है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “इस संसार।” यूनानी αἰών का अधिक ठीक अर्थ “युग” है; यहाँ इससे वर्तमान व्यवस्था या काल अभिप्रेत है।'
    reason: lexical_alternative
  - marker: b
    text: 'या: “ताकि तुम जाँचकर स्वीकार कर सको।” यूनानी क्रिया में परखने के साथ-साथ परख में सही पाए गए को पहचानने या स्वीकार करने का भाव भी हो सकता है।'
    reason: lexical_alternative
  - marker: c
    text: “मनभावनी” का अर्थ परमेश्वर को भानेवाली हो सकता है; अनुवाद “स्वीकार्य” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συσχηματίζεσθε
  choice: के साँचे में न ढलो
  rationale: यह वर्तमान निषेध बाहरी प्रतिरूप के अनुसार ढलने से रोकता है। ‘साँचे में ढलना’ आधुनिक हिन्दी में इस चित्र को स्वाभाविक रूप से व्यक्त करता है और μεταμορφοῦσθε के आंतरिक रूपांतरण से स्पष्ट विरोध बनाए रखता है।
- source_word: αἰῶνι τούτῳ
  choice: इस युग
  rationale: αἰών यहाँ सृष्ट जगत की अपेक्षा वर्तमान काल-व्यवस्था या नैतिक युग को सूचित करता है; इसलिए ‘युग’ मूल शब्द के कालगत बल को सुरक्षित रखता है।
- source_word: μεταμορφοῦσθε
  choice: रूपांतरित होते जाओ
  rationale: वर्तमान आज्ञार्थक रूप गहरे परिवर्तन की निरंतर प्रक्रिया का बोध करा सकता है। ‘रूपांतरित’ क्रिया की शक्ति और बाहरी अनुरूपता के साथ उसका विरोध सुरक्षित रखता है।
- source_word: τῇ ἀνακαινώσει τοῦ νοός
  choice: अपने मन के नवीनीकरण से
  rationale: करणवाचक दत्तिव को ‘से’ द्वारा व्यक्त किया गया है। ‘मन’ νοῦς की विचार, नैतिक समझ और विवेक की क्षमता को सहज हिन्दी में समेटता है; ‘अपने’ संदर्भगत कर्ता से स्वाभाविक रूप से पूरित है।
- source_word: εἰς τὸ δοκιμάζειν
  choice: ताकि तुम परखकर जान सको
  rationale: रचना उद्देश्य/परिणाम बताती है और δοκιμάζω में जाँचने तथा जाँच के फलस्वरूप पहचानने या अनुमोदित ठहराने—दोनों का भाव हो सकता है। ‘परखकर जानना’ इस संयुक्त अर्थ को हिन्दी में सहज रखता है।
- source_word: τί τὸ θέλημα τοῦ θεοῦ
  choice: कि परमेश्वर की इच्छा क्या है
  rationale: यह τί की प्रश्नवाचकता और τοῦ θεοῦ के संबंधवाचक अर्थ को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὸ ἀγαθὸν καὶ εὐάρεστον καὶ τέλειον
  choice: जो भली, मनभावनी और सिद्ध है
  rationale: तीनों विशेषण परमेश्वर की इच्छा को समानाधिकरण रूप में वर्णित करते हैं। स्त्रीलिंग रूप ‘इच्छा’ से मेल खाते हैं; ‘सिद्ध’ τέλειον के पूर्णता/परिपूर्णता संबंधी भार को बनाए रखता है।
theological_decisions:
- issue: नैतिक विरोध में αἰών का अनुवाद
  choice: इस युग
  alternative: इस संसार
  rationale: ‘युग’ पौलुस के कालगत-नैतिक विरोध को बनाए रखता है और मूल शब्द में निहित न होने वाले सृष्टि-विरोध का आभास नहीं देता।
- issue: δοκιμάζειν और परमेश्वर की इच्छा का संबंध
  choice: परखकर जान सको
  alternative: परख सको; जाँचकर स्वीकार कर सको
  rationale: यह मनुष्यों को परमेश्वर की इच्छा का न्यायाधीश बनाए बिना उस क्रिया के जाँचने और पहचानने वाले दोनों पक्षों को सुरक्षित रखता है।
- issue: εὐάρεστον किसे मनभावन है
  choice: मनभावनी
  alternative: परमेश्वर को भानेवाली; स्वीकार्य
  rationale: यूनानी विशेषण स्वयं प्रसन्न होने वाले को स्पष्ट नहीं करता। मुख्य पाठ में अस्पष्टता रखी गई है और संभावित अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज। ‘के साँचे में न ढलो’ चित्रात्मक और बोलचाल में बोधगम्य है, जबकि ‘नवीनीकरण’, ‘रूपांतरित’ और ‘सिद्ध’ पद की धर्मवैचारिक गंभीरता बनाए रखते हैं। बहुवचन संबोधन के लिए ‘तुम’ प्रयोग हुआ है।
