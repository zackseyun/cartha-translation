  text: ταῖς χρείαις τῶν ἁγίων κοινωνοῦντες, τὴν φιλοξενίαν διώκοντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/013.yaml
  text: sharing in the needs of the saints[b][a], pursuing hospitality.
translation:
  language: hi
  text: पवित्र लोगों की ज़रूरतों में हाथ बँटाओ,[a] और अतिथि-सत्कार के अवसर उत्साह से खोजो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र लोगों की ज़रूरतें पूरी करने में योगदान दो।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द में विशेष रूप से अपरिचित लोगों का स्वागत करने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χρείαις
  choice: ज़रूरतों
  rationale: यहाँ χρεία व्यावहारिक आवश्यकताओं को सूचित करता है; ‘ज़रूरतों’ आधुनिक, सहज और प्रसंगानुकूल है।
- source_word: ἁγίων
  choice: पवित्र लोगों
  rationale: पौलुस के प्रयोग में ἅγιοι सभी विश्वासियों को परमेश्वर के लिए अलग किए गए समुदाय के रूप में दर्शाता है। ‘पवित्र लोगों’ से बाद के सीमित, धर्मसंस्थागत अर्थ से बचते हुए मूल पहचान बनी रहती है।
- source_word: κοινωνοῦντες
  choice: हाथ बँटाओ
  rationale: κοινωνέω यहाँ उनकी ज़रूरतें पूरी करने में सक्रिय सहभागिता बताता है। ‘हाथ बँटाओ’ केवल आर्थिक दान तक अर्थ को सीमित किए बिना स्वाभाविक हिन्दी में यह भाव व्यक्त करता है।
- source_word: φιλοξενίαν
  choice: अतिथि-सत्कार
  rationale: φιλοξενία अपरिचितों को भी अपनाकर उनका स्वागत करने की तत्परता है; ‘अतिथि-सत्कार’ इसका प्रचलित और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: διώκοντες
  choice: अवसर उत्साह से खोजो
  rationale: διώκω के सक्रिय, प्रयत्नशील बल को व्यक्त करने के लिए यह अनुवाद केवल ‘करो’ की तुलना में अधिक उपयुक्त है और आतिथ्य के अवसर जानबूझकर तलाशने का भाव देता है।
theological_decisions:
- issue: ‘पवित्र लोगों’ का संदर्भ
  choice: सामान्य रूप से विश्वासी, अर्थात परमेश्वर के लिए अलग किए गए लोग
  alternative: बाद के धर्मसंस्थागत अर्थ में केवल विशेष मान्यता-प्राप्त संत
  rationale: पौलुस के पत्रों में οἱ ἅγιοι मसीही समुदाय के सदस्यों के लिए सामूहिक पद है, किसी बाद की सीमित श्रेणी के लिए नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदेशात्मक प्रवाह को स्वाभाविक बनाने के लिए यूनानी कृदंतों को आज्ञार्थक क्रियाओं में व्यक्त किया गया है। भाषा सरल, गरिमापूर्ण और सामुदायिक जीवन के व्यावहारिक संदर्भ के अनुकूल रखी गई है।
