  text: μὴ ἑαυτοὺς ἐκδικοῦντες, ἀγαπητοί, ἀλλὰ δότε τόπον τῇ ὀργῇ, γέγραπται γάρ· Ἐμοὶ ἐκδίκησις, ἐγὼ ἀνταποδώσω, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/019.yaml
  text: 'Do not avenge yourselves[a], beloved, but give place to wrath, for it is written: “Vengeance is mine; I will repay[b], says the Lord.”'
translation:
  language: hi
  text: हे प्रियो, अपना बदला स्वयं न लो, बल्कि क्रोध के लिए स्थान छोड़ दो[a], क्योंकि लिखा है, “बदला मेरा है; मैं ही प्रतिफल दूँगा,” प्रभु कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्रोध को स्थान दो”; अगले उद्धरण के प्रकाश में सम्भवतः यहाँ परमेश्वर का क्रोध अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ἑαυτοὺς ἐκδικοῦντες
  choice: अपना बदला स्वयं न लो
  rationale: यह वर्तमान कृदन्त प्रसंग में आज्ञार्थक है। यह सहज आधुनिक हिन्दी में आत्मवाचक बल और प्रतिशोध के अर्थ दोनों को बनाए रखता है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: सम्बोधन की आत्मीयता और गरिमा को संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: ἀλλὰ δότε τόπον τῇ ὀργῇ
  choice: बल्कि क्रोध के लिए स्थान छोड़ दो
  rationale: मूल मुहावरे के ‘स्थान देना/छोड़ना’ रूपक को बनाए रखता है और ‘क्रोध’ को बिना ‘परमेश्वर का’ जोड़े प्रस्तुत करता है।
- source_word: γέγραπται γάρ
  choice: क्योंकि लिखा है
  rationale: पवित्रशास्त्र के उद्धरण की प्रचलित और स्वाभाविक हिन्दी भूमिका है तथा यूनानी पूर्णकालीन कर्मवाच्य सूत्र का अर्थ देती है।
- source_word: Ἐμοὶ ἐκδίκησις
  choice: बदला लेना मेरा काम है
  rationale: यूनानी सम्प्रदान से व्यक्त अधिकार/अधिकार-क्षेत्र को सामान्य आधुनिक हिन्दी में स्पष्ट करता है; इसका आशय है कि प्रतिशोध प्रभु का विशेषाधिकार है।
- source_word: ἐγὼ ἀνταποδώσω
  choice: मैं ही प्रतिफल दूँगा
  rationale: ἐγώ के व्यक्त बल को ‘ही’ से और न्यायिक प्रत्युत्तर के व्यापक अर्थ को ‘प्रतिफल दूँगा’ से व्यक्त करता है।
- source_word: λέγει κύριος
  choice: प्रभु कहता है
  rationale: उद्धरण-सूत्र को सीधा रखता है और κύριος का परियोजना-संगत अनुवाद ‘प्रभु’ करता है।
theological_decisions:
- issue: τῇ ὀργῇ में ‘क्रोध’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘क्रोध’ रखा गया है; निकटवर्ती उद्धरण के प्रकाश में इसका सबसे सम्भावित आशय परमेश्वर का क्रोध है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर के क्रोध’ के लिए स्थान छोड़ दो।
  rationale: व्यवस्थाविवरण 32:35 के उद्धरण से न्याय और प्रतिशोध परमेश्वर के अधिकार में दिखाई देते हैं, पर यूनानी में ‘परमेश्वर का’ स्पष्टतः नहीं है। इसलिए मुख्य पाठ स्रोत की संक्षिप्तता और सम्भावित तनाव बनाए रखता है।
- issue: Ἐμοὶ ἐκδίκησις में प्रतिशोध का दैवी अधिकार
  choice: बदला लेना मेरा काम है
  alternative: बदला मेरा है
  rationale: चुना हुआ रूप स्वाभाविक हिन्दी में यह स्पष्ट करता है कि निजी प्रतिशोध के विपरीत न्यायपूर्ण प्रत्युत्तर प्रभु के अधिकार में है, बिना न्याय की रीति या समय के विषय में अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय किन्तु गरिमापूर्ण बाइबिलीय शैली। ‘अपना बदला स्वयं न लो’ सामान्य पाठक के लिए सहज है। ‘हे प्रियो’ स्नेहपूर्ण सम्बोधन को बनाए रखता है। उद्धरण में ‘मेरा काम है’ स्वाभाविक हिन्दी है, जबकि पादटिप्पणी न्यायिक प्रत्युत्तर का अधिक सीधा विकल्प देती है।
