  text: If possible[a], as far as it depends on you, live at peace with all people.
translation:
  language: hi
  text: यदि संभव हो, तो जहाँ तक तुम्हारे वश में हो, सब लोगों के साथ शांति से रहो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ δυνατόν
  choice: यदि हो सके
  rationale: यह स्वाभाविक आधुनिक हिन्दी में वास्तविक संभावना की शर्त व्यक्त करता है और उपदेश को निरपेक्ष नहीं बनाता।
- source_word: τὸ ἐξ ὑμῶν
  choice: जहाँ तक तुम पर निर्भर है
  rationale: यह मुहावरा पाठकों की अपनी सामर्थ्य और जिम्मेदारी की सीमा को स्पष्ट रूप से व्यक्त करता है।
- source_word: μετὰ πάντων ἀνθρώπων
  choice: सब लोगों के साथ
  rationale: ἄνθρωποι यहाँ केवल पुरुषों के लिए नहीं, बल्कि सभी मनुष्यों के लिए प्रयुक्त है; यह चयन उसी व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: εἰρηνεύοντες
  choice: शान्ति से रहो
  rationale: संदर्भ में यह कृदन्त आदेशात्मक बल रखता है और लगातार शांतिपूर्ण जीवन-व्यवहार का बोध कराता है।
theological_decisions:
- issue: शान्ति के उपदेश का विस्तार और उसकी सीमा
  choice: सभी लोगों के साथ शान्ति से रहने का प्रयत्न करो, पर जिम्मेदारी उतनी ही है जितनी वास्तव में तुम्हारे नियंत्रण में है।
  alternative: इस आदेश को बिना किसी शर्त के मानना, मानो विश्वासी के सही आचरण से शान्ति हर दशा में प्राप्त हो ही जाएगी।
  rationale: εἰ δυνατόν और τὸ ἐξ ὑμῶν दोनों मिलकर उपदेश की वास्तविक सीमा बताते हैं, जबकि μετὰ πάντων ἀνθρώπων उसका सार्वभौमिक विस्तार बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सीधे संबोधन वाला रूप। ‘शान्ति से रहो’ निरंतर आचरण को स्वाभाविक हिन्दी में व्यक्त करता है।
