  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। पौलुस की संक्षिप्त सूची को पठनीय बनाने के लिए समानांतर क्रियात्मक वाक्यांश रखे गए हैं। केवल वास्तविक और पाठकीय रूप से महत्त्वपूर्ण अस्पष्टता पर पादटिप्पणी दी गई है।
