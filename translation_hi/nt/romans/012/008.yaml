  text: εἴτε ὁ παρακαλῶν ἐν τῇ παρακλήσει, ὁ μεταδιδοὺς ἐν ἁπλότητι, ὁ προϊστάμενος ἐν σπουδῇ, ὁ ἐλεῶν ἐν ἱλαρότητι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/008.yaml
  text: if exhorting[a], in exhortation; the one who shares, with generosity; the one who leads, with diligence; the one who shows mercy[e][d][c][b], with cheerfulness.
translation:
  language: hi
  text: और जिसे प्रोत्साहित करने का वरदान मिला है,[a] वह प्रोत्साहन देने में लगा रहे; जो बाँटता है, वह उदारता से बाँटे; जो अगुवाई करता है, वह लगन से करे; जो दया करता है, वह प्रसन्नता से करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसे उपदेश देने का वरदान मिला है, वह उपदेश देने में लगा रहे।” यूनानी क्रिया और संज्ञा का यह शब्द-युग्म प्रोत्साहित करने के साथ आग्रहपूर्वक समझाने या उपदेश देने का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴτε
  choice: और यदि किसी का वर ... है
  rationale: यह पिछले पद से चल रही अधूरी सूची को स्वाभाविक हिन्दी में जोड़ता है; स्पष्टता के लिए प्रसंग से ‘वर’ जोड़ा गया है।
- source_word: ὁ παρακαλῶν / ἐν τῇ παρακλήσει
  choice: प्रोत्साहित करना ... प्रोत्साहित करने में लगा रहे
  rationale: शब्द-युग्म के प्रोत्साहन और आग्रह—दोनों संभावित भावों में से सहज आधुनिक हिन्दी के लिए ‘प्रोत्साहित’ चुना गया और मूल की सजातीय पुनरावृत्ति यथासंभव रखी गई।
- source_word: ὁ μεταδιδοὺς
  choice: जो बाँटता है
  rationale: यह अपने संसाधनों में दूसरों को सहभागी करने का सक्रिय भाव व्यक्त करता है और केवल औपचारिक दान तक अर्थ को सीमित नहीं करता।
- source_word: ἐν ἁπλότητι
  choice: उदारता से
  rationale: संसाधन बाँटने के निकट प्रसंग में उदारता सबसे संभावित अर्थ है, यद्यपि मूल शब्द निष्कपटता अथवा सरलता भी व्यक्त कर सकता है।
- source_word: ὁ προϊστάμενος
  choice: जो अगुवाई करता है
  rationale: यह नेतृत्व या देखरेख का व्यापक अर्थ रखता है और किसी विशेष कलीसियाई पद को आरोपित नहीं करता।
- source_word: ἐν σπουδῇ
  choice: लगन से
  rationale: यह तत्परता, गंभीर परिश्रम और उत्साह के अर्थ-क्षेत्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἐλεῶν
  choice: जो दया करता है
  rationale: क्रियात्मक कृदन्त का सक्रिय स्वर बनाए रखता है।
- source_word: ἐν ἱλαρότητι
  choice: प्रसन्नता से
  rationale: दया के कार्य में हर्षपूर्ण और स्वेच्छापूर्ण मनोभाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: προϊστάμενος का दायरा
  choice: व्यापक रूप में ‘जो अगुवाई करता है’
  alternative: ‘जो शासन करता है’ अथवा किसी विशिष्ट कलीसियाई पदाधिकारी के रूप में
  rationale: पद में स्पष्ट पदनाम नहीं है; व्यापक अनुवाद पाठ की खुली सीमा को बनाए रखता और किसी सम्प्रदाय-विशेष की व्यवस्था आरोपित करने से बचता है।
- issue: बाँटने के प्रसंग में ἁπλότης का अर्थ
  choice: ‘उदारता’
  alternative: ‘निष्कपटता’ या ‘सरलता’
  rationale: संसाधन बाँटने के साथ उदारता का अर्थ प्रसंगानुकूल है, पर वास्तविक शाब्दिक बहुअर्थकता को पादटिप्पणी में सुरक्षित रखा गया है।
