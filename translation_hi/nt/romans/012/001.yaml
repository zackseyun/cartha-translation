id: ROM.12.1
reference: Romans 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Παρακαλῶ οὖν ὑμᾶς, ἀδελφοί, διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ παραστῆσαι τὰ σώματα ὑμῶν θυσίαν ζῶσαν ἁγίαν ⸂εὐάρεστον τῷ θεῷ⸃, τὴν λογικὴν λατρείαν ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/001.yaml
  text: Therefore I urge you[a], brothers, by the mercies of God, to present your bodies as a living sacrifice[b], holy and pleasing to God—your reasonable worship.
translation:
  language: hi
  text: इसलिए, हे भाइयो[a], मैं परमेश्वर की करुणाओं का वास्ता देकर तुमसे आग्रह करता हूँ कि तुम अपने शरीरों को जीवित, पवित्र और परमेश्वर को भानेवाले बलिदान के रूप में अर्पित करो—यही तुम्हारी विवेकपूर्ण उपासना है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हे भाई-बहनो”; यूनानी में “भाइयो” है, और इस प्रकार का पुल्लिंग संबोधन प्रायः स्त्री-पुरुष दोनों से बने समूह के लिए प्रयुक्त होता है।
    reason: alternative_reading
  - marker: b
    text: या “यही तुम्हारी आत्मिक उपासना है” अथवा “यही तुम्हारी तर्कसंगत सेवा है”; यूनानी पद विचारयुक्त, उचित या आत्मिक सेवा अथवा उपासना के अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं ... आग्रह करता हूँ
  rationale: यहाँ क्रिया गंभीर प्रेरणा और अनुरोध व्यक्त करती है; ‘आग्रह करता हूँ’ आधुनिक हिन्दी में इसके बल को स्वाभाविक रूप से रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह रोमियों 1–11 के तर्क से निकले निष्कर्ष और आगे के आग्रह के बीच संबंध स्पष्ट करता है।
- source_word: ἀδελφοί
  choice: हे भाइयो
  rationale: यूनानी संबोधन का पुल्लिंग बहुवचन रूप बनाए रखा गया है; सम्भावित मिश्रित समुदाय का आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: διὰ τῶν οἰκτιρμῶν τοῦ θεοῦ
  choice: परमेश्वर की करुणाओं का वास्ता देकर
  rationale: διά और संबंधकारक यहाँ आग्रह के आधार को व्यक्त करते हैं। ‘वास्ता देकर’ हिन्दी में अपील की शक्ति को स्वाभाविक ढंग से व्यक्त करता है और बहुवचन ‘करुणाओं’ को सुरक्षित रखता है।
- source_word: παραστῆσαι
  choice: अर्पित करो
  rationale: बलिदान-संबंधी प्रसंग में παρίστημι का भाव प्रस्तुत करने अथवा चढ़ाने का है; ‘अर्पित करो’ हिन्दी में इस उपासना और बलिदान की छवि को स्पष्ट रखता है।
- source_word: τὰ σώματα ὑμῶν
  choice: अपने शरीरों को
  rationale: मूल के ठोस बहुवचन ‘शरीरों’ को ‘अपने आपको’ कहकर सामान्यीकृत नहीं किया गया।
- source_word: θυσίαν ζῶσαν
  choice: जीवित ... बलिदान
  rationale: यह पौलुस की जानबूझकर प्रयुक्त विरोधाभासी बलिदानी छवि को बनाए रखता है।
- source_word: ἁγίαν
  choice: पवित्र
  rationale: परमेश्वर के लिए अलग किए हुए बलिदान का मानक और धर्मवैचारिक रूप से सार्थक हिन्दी शब्द।
- source_word: εὐάρεστον τῷ θεῷ
  choice: परमेश्वर को भानेवाले
  rationale: यह केवल न्यूनतम स्वीकार्यता नहीं, बल्कि परमेश्वर को प्रसन्न करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λογικὴν
  choice: विवेकपूर्ण
  rationale: λογικός में तर्कसंगत, उचित अथवा आत्मिक होने की अर्थ-सम्भावना है। ‘विवेकपूर्ण’ इसे केवल बौद्धिक तर्कवाद या अभौतिक आत्मिकता तक सीमित किए बिना विचारयुक्त और उचित उपासना का भाव देता है।
- source_word: λατρείαν
  choice: उपासना
  rationale: λατρεία परमेश्वर को दी जानेवाली धार्मिक सेवा या उपासना है; बलिदान की निकटवर्ती छवि सेवा का याजकीय आयाम भी बनाए रखती है।
theological_decisions:
- issue: मिश्रित श्रोता-समुदाय में ἀδελφοί का अनुवाद
  choice: हे भाइयो
  alternative: हे भाई-बहनो
  rationale: मुख्य पाठ में यूनानी के व्याकरणिक रूप को रखा गया है, जबकि सम्भावित समावेशी संदर्भ को पादटिप्पणी में बताया गया है।
- issue: λογικὴν λατρείαν का अर्थ
  choice: विवेकपूर्ण उपासना
  alternative: आत्मिक उपासना; तर्कसंगत सेवा
  rationale: यूनानी पद अर्थ की दृष्टि से विवादित है। मुख्य पाठ अपेक्षाकृत निकट और कम व्याख्यात्मक विकल्प रखता है तथा अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: διά के द्वारा आग्रह का आधार या साधन
  choice: परमेश्वर की करुणाओं का वास्ता देकर
  alternative: परमेश्वर की करुणाओं के कारण; परमेश्वर की करुणाओं के द्वारा
  rationale: इस उपदेशात्मक प्रसंग में परमेश्वर की करुणाएँ आग्रह का आधार हैं; चुना हुआ वाक्यांश इस अपील को स्पष्ट करता है, पर कारण और साधन के बीच स्रोत की सूक्ष्मता को पूरी तरह कठोर नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वास्ता देकर’ आग्रह की जीवंत हिन्दी अभिव्यक्ति है; ‘अर्पित करो’ बलिदानी प्रसंग को स्वाभाविक बनाता है। वाक्य की पौलुसी तार्किक गति और शरीर, बलिदान तथा उपासना की परस्पर जुड़ी छवियाँ सुरक्षित रखी गई हैं।
