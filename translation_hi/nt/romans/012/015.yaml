  yaml_path: translation/nt/romans/012/015.yaml
  text: Rejoice with those who rejoice[a]; weep with those who weep.
translation:
  language: hi
  text: जो आनन्दित हैं, उनके साथ आनन्दित हो; जो रोते हैं, उनके साथ रोओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαίρειν
  choice: आनन्द मनाओ
  rationale: वर्तमानकालीन सक्रिय infinitive यहाँ उपदेशात्मक क्रम में आज्ञार्थक बल रखता है। ‘आनन्द मनाओ’ आधुनिक हिन्दी में स्वाभाविक है और भाव तथा क्रिया दोनों को व्यक्त करता है।
- source_word: μετὰ
  choice: के साथ
  rationale: सम्बन्ध या सहभागिता सूचित करने वाले μετά का यहाँ स्वाभाविक और सटीक हिन्दी रूप ‘के साथ’ है।
- source_word: χαιρόντων
  choice: आनन्द मनानेवालों
  rationale: वर्तमानकालीन सक्रिय कृदन्त बहुवचन में संज्ञा के समान प्रयुक्त है। यह रूप सामान्य बहुवचन अर्थ और मुख्य क्रिया के साथ समानान्तरता बनाए रखता है।
- source_word: κλαίειν
  choice: रोओ
  rationale: यह infinitive भी आज्ञार्थक बल रखता है। ‘रोओ’ κλαίω के प्रत्यक्ष शोक और आँसू बहाने के अर्थ को सरल, गम्भीर और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κλαιόντων
  choice: रोनेवालों
  rationale: संज्ञावत् प्रयुक्त वर्तमानकालीन सक्रिय कृदन्त का यह सहज हिन्दी रूप है और ‘आनन्द मनानेवालों’ के साथ वाक्यगत समानान्तरता बनाए रखता है।
theological_decisions:
- issue: उपदेशात्मक क्रम में infinitive क्रियाओं का आज्ञार्थक बल
  choice: दोनों infinitive को हिन्दी आज्ञार्थक रूपों ‘आनन्द मनाओ’ और ‘रोओ’ में प्रस्तुत किया गया है।
  alternative: ‘आनन्द मनानेवालों के साथ आनन्द मनाना; रोनेवालों के साथ रोना।’
  rationale: यूनानी पाठ में infinitive हैं, पर रोमियों 12:9–21 के उपदेशात्मक क्रम में वे निर्देश या आज्ञा का कार्य करते हैं। हिन्दी आज्ञार्थक रूप इस संवादगत बल को स्वाभाविक ढंग से व्यक्त करते हैं, बिना कोई अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। संक्षिप्त समानान्तर संरचना मूल यूनानी की लय और पारस्परिक सहभागिता पर दिए गए बल को सुरक्षित रखती है।
