translation:
  language: hi
  text: बुराई से पराजित न हो[a], बल्कि भलाई से बुराई को पराजित कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बुरा है उससे अपने को पराजित न होने दे ... जो भला है उसके द्वारा जो बुरा है उसे पराजित कर।” यूनानी में निश्चित लेख के साथ प्रयुक्त नपुंसकलिंगी विशेषण हैं, जिन्हें “बुराई/भलाई” या “जो बुरा/भला है” दोनों प्रकार से अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ νικῶ
  choice: पराजित न हो
  rationale: वर्तमानकालिक निषेधात्मक आज्ञा और कर्मवाच्य को स्वाभाविक हिन्दी में व्यक्त करता है। ‘हार न मान’ की अपेक्षा यह मूल के ‘विजित होने’ के भाव को अधिक ठीक रखता है।
- source_word: ὑπὸ τοῦ κακοῦ
  choice: बुराई से
  rationale: ὑπό के कर्तृ/कारक भाव को हिन्दी का ‘से’ स्वाभाविक रूप से व्यक्त करता है। नपुंसकलिंगी विशेषण का संज्ञात्मक प्रयोग सामान्य नैतिक बुराई अथवा ‘जो बुरा है’ दोनों अर्थ दे सकता है।
- source_word: ἀλλὰ νίκα
  choice: बल्कि ... पराजित कर
  rationale: ἀλλά का प्रबल विरोध ‘बल्कि’ से और सक्रिय आज्ञा का भाव ‘पराजित कर’ से प्रकट होता है। पहले खंड के साथ एक ही विजय-संबंधी शब्दावली बनी रहती है।
- source_word: ἐν τῷ ἀγαθῷ
  choice: भलाई से
  rationale: ἐν यहाँ साधन का बोध कराता है; ‘भलाई से’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा ‘जो भला है उसके द्वारा’ की संभावना भी समेटता है।
- source_word: τὸ κακόν
  choice: बुराई को
  rationale: नपुंसकलिंगी संज्ञात्मक विशेषण को व्यापक नैतिक श्रेणी के रूप में प्रस्तुत करता है और पहले खंड की ‘बुराई’ को दोहराकर मूल का अलंकारिक विरोध बनाए रखता है।
theological_decisions:
- issue: κακός/ἀγαθός को अमूर्त नैतिक श्रेणियों के रूप में समझना या उनका व्यक्तिकरण करना
  choice: ‘बुराई’ और ‘भलाई’—अमूर्त नैतिक श्रेणियाँ
  alternative: ‘जो बुरा है’ और ‘जो भला है’; अथवा बुराई को किसी व्यक्तिगत दुष्ट सत्ता के रूप में समझना
  rationale: नपुंसकलिंगी रूप अमूर्त या गुणात्मक अर्थ का समर्थन करते हैं, और निकटवर्ती प्रसंग बुरे व्यवहार के प्रति नैतिक प्रतिक्रिया पर केंद्रित है। पाठ किसी विशिष्ट व्यक्तिगत दुष्ट सत्ता को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, आज्ञार्थक और गरिमापूर्ण शैली। एकवचन संबोधन को मूल के अनुसार ‘हो/कर’ से रखा गया है। ‘पराजित’ दोनों खंडों में νικάω की शब्दगत पुनरावृत्ति सुरक्षित रखता है।
