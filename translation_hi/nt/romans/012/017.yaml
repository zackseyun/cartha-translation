source:
  edition: SBLGNT
  text: μηδενὶ κακὸν ἀντὶ κακοῦ ἀποδιδόντες· προνοούμενοι καλὰ ἐνώπιον πάντων ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/017.yaml
  text: Repaying no one evil for evil[a], but taking thought for what is good in the sight of all people.
translation:
  language: hi
  text: किसी की बुराई के बदले बुराई न करो। जो सब लोगों की दृष्टि में अच्छा[a] है, उसका ध्यान रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आदरणीय’ अथवा ‘उत्तम’।
    reason: καλά नैतिक अच्छाई के साथ सम्मानयोग्य या उत्कृष्ट होने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: μηδενὶ
  choice: किसी की ... न
  rationale: निषेध के साथ यह स्वाभाविक हिन्दी में सार्वभौमिक अर्थ देता है—किसी भी व्यक्ति के प्रति नहीं।
- source_word: κακὸν ἀντὶ κακοῦ ἀποδιδόντες
  choice: बुराई के बदले बुराई न करो
  rationale: यह प्रतिशोध में वैसी ही बुराई लौटाने का अर्थ और प्रसंगगत आज्ञार्थक बल स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προνοούμενοι
  choice: ध्यान रखो
  rationale: यह आगे से सोच-विचार करके सावधानी बरतने के आशय को व्यक्त करता है, बिना इसे केवल भौतिक प्रबंध तक सीमित किए।
- source_word: καλὰ
  choice: जो ... अच्छा है
  rationale: καλά की व्यापक नैतिक अच्छाई को मुख्य पाठ में बनाए रखता है; आदरणीय या उत्तम होने की छाया पादटिप्पणी में दी गई है।
- source_word: ἐνώπιον πάντων ἀνθρώπων
  choice: सब लोगों की दृष्टि में
  rationale: यह सार्वजनिक दृश्यता और सभी मनुष्यों के सामने उत्तरदायी आचरण—दोनों का भाव सुरक्षित रखता है।
theological_decisions:
- issue: सार्वजनिक प्रसंग में καλά का नैतिक और सामाजिक अर्थ
  choice: अच्छा
  alternative: आदरणीय या उत्तम
  rationale: मुख्य पाठ का ‘अच्छा’ नैतिक अर्थ को व्यापक रखता है और उपदेश को केवल सामाजिक प्रतिष्ठा तक सीमित नहीं करता; अन्य वास्तविक अर्थ-छायाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली। दोनों यूनानी कृदंतों का प्रसंगगत आज्ञार्थक बल हिन्दी की निषेधात्मक और सकारात्मक आज्ञाओं से व्यक्त किया गया है।
