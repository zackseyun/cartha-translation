source:
  edition: SBLGNT
  text: ⸂ἀλλὰ ἐὰν⸃ πεινᾷ ὁ ἐχθρός σου, ψώμιζε αὐτόν· ἐὰν διψᾷ, πότιζε αὐτόν· τοῦτο γὰρ ποιῶν ἄνθρακας πυρὸς σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/020.yaml
  text: But if your enemy is hungry[a], feed him; if he is thirsty, give him something to drink; for by doing this you will heap burning coals on his head.
translation:
  language: hi
  text: परन्तु यदि तुम्हारा शत्रु भूखा हो, तो उसे खाना खिलाओ; यदि वह प्यासा हो, तो उसे पीने के लिए कुछ दो; क्योंकि ऐसा करने से तुम उसके सिर पर जलते हुए अंगारे ढेर करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आग के अंगारे।” यह चित्र पश्चाताप की ओर ले जाने वाली लज्जा, पीड़ादायक नैतिक बोध, या आने वाले न्याय का संकेत हो सकता है; मुख्य पाठ में यूनानी रूपक को बिना किसी एक अर्थ में सीमित किए रखा गया है।
    reason: रूपक की वास्तविक व्याख्यात्मक अनिश्चितता और शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: ἀλλὰ ἐὰν
  choice: परन्तु यदि
  rationale: ἀλλά पिछले पद में बदला लेने की मनाही के विपरीत सकारात्मक आचरण प्रस्तुत करता है, और ἐάν शर्त प्रकट करता है। ‘परन्तु यदि’ दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πεινᾷ ὁ ἐχθρός σου
  choice: तुम्हारा शत्रु भूखा हो
  rationale: एकवचन ‘तुम्हारा शत्रु’ को बनाए रखते हुए वर्तमान शर्त को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ψώμιζε αὐτόν
  choice: उसे खाना खिलाओ
  rationale: ψωμίζω का अर्थ किसी को भोजन देना या खिलाना है। यह चयन ठोस आदेश और उसकी निरन्तर नैतिक प्रासंगिकता को स्पष्ट रखता है।
- source_word: ἐὰν διψᾷ, πότιζε αὐτόν
  choice: यदि वह प्यासा हो, तो उसे पीने को दो
  rationale: ποτίζω किसी को पेय देने का अर्थ रखता है। ‘पानी’ कहना यूनानी से अधिक विशिष्ट होता, इसलिए व्यापक ‘पीने को दो’ चुना गया है।
- source_word: τοῦτο γὰρ ποιῶν
  choice: क्योंकि ऐसा करने से
  rationale: γάρ कारण या स्पष्टीकरण देता है और कृदन्त ποιῶν साधनात्मक भाव रख सकता है; यह हिन्दी वाक्यांश दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἄνθρακας πυρὸς
  choice: जलते हुए अंगारों
  rationale: शाब्दिक संरचना ‘आग के अंगारे’ है। ‘जलते हुए अंगारे’ वर्तमान हिन्दी में स्वाभाविक रहते हुए मूल ठोस रूपक को सुरक्षित रखता है।
- source_word: σωρεύσεις ἐπὶ τὴν κεφαλὴν αὐτοῦ
  choice: उसके सिर पर … का ढेर लगाओगे
  rationale: भविष्यकाल σωρεύσεις और सिर पर अंगारे इकट्ठे करने की मूर्त उपमा दोनों को निकट और सुबोध हिन्दी में रखा गया है।
theological_decisions:
- issue: ‘उसके सिर पर जलते हुए अंगारों का ढेर’ रूपक का अर्थ
  choice: मुख्य पाठ में रूपक को बिना व्याख्यात्मक निष्कर्ष के ज्यों का त्यों बनाए रखना
  alternative: इसे पश्चाताप की ओर ले जाने वाली लज्जा, पीड़ादायक नैतिक बोध, या आने वाले न्याय के रूप में स्पष्ट कर देना
  rationale: यूनानी रूपक का आशय विवादित है। किसी एक अर्थ को मुख्य पाठ में चुनने से मूल की धर्मवैचारिक अनिश्चितता समाप्त हो जाती; इसलिए सम्भावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शत्रु’ बाइबिलीय नैतिक प्रसंग के अनुकूल है, जबकि ‘खाना खिलाओ’ और ‘पीने को दो’ आदेशों को स्वाभाविक समकालीन हिन्दी में व्यक्त करते हैं।
