id: ROM.12.5
reference: Romans 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως οἱ πολλοὶ ἓν σῶμά ἐσμεν ἐν Χριστῷ, ⸀τὸ δὲ καθ’ εἷς ἀλλήλων μέλη.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/005.yaml
  text: so we[a], though many, are one body in Messiah, and individually members of one another.
translation:
  language: hi
  text: उसी प्रकार, यद्यपि हम बहुत हैं, हम मसीह में एक देह हैं, और हम में से हर एक एक-दूसरे के अंग हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: उसी प्रकार
  rationale: यह पिछले पद में दिए गए एक देह और अनेक अंगों के दृष्टांत को वर्तमान कथन से जोड़ता है और यूनानी शब्द की तुलनात्मक शक्ति बनाए रखता है।
- source_word: οἱ πολλοὶ
  choice: हम, जो बहुत हैं
  rationale: क्रिया ἐσμεν प्रथम पुरुष बहुवचन है; यह रूप पौलुस के समावेशी कथन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἓν σῶμά
  choice: एक देह
  rationale: यह सामूहिक एकता के शारीरिक रूपक को सीधे बनाए रखता है और अगले वाक्यांश के ‘अंग’ से स्वाभाविक रूप से जुड़ता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: ‘मसीह’ Χριστός के पदवीगत अर्थ को सुरक्षित रखता है, जबकि ‘में’ पौलुस की संबंध और सहभागिता बताने वाली अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के प्रस्तुत करता है।
- source_word: τὸ δὲ καθ’ εἷς
  choice: और अलग-अलग हम
  rationale: यह प्रत्येक व्यक्ति पर लागू होने वाले वितरणात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘और’ यहाँ देह की सामूहिक एकता से व्यक्तिगत पारस्परिक संबंध की ओर बढ़ाता है।
- source_word: ἀλλήλων μέλη
  choice: एक-दूसरे के अंग
  rationale: यह पारस्परिक संबंध और देह के रूपक दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστῷ का अनुवाद
  choice: मसीह में
  alternative: क्राइस्ट में
  rationale: Χριστός मूलतः अभिषिक्त जन की पदवी है। प्रचलित और गरिमापूर्ण हिन्दी ‘मसीह’ इस पदवीगत अर्थ को सुरक्षित रखती है और किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ती।
- issue: ἀλλήλων μέλη में पारस्परिक सदस्यता
  choice: एक-दूसरे के अंग
  alternative: एक ही देह के अंग
  rationale: ‘एक ही देह के अंग’ अधिक सहज लग सकता है, पर वह ἀλλήλων के स्पष्ट पारस्परिक भाव को कम कर देता है। चुना हुआ पाठ विश्वासियों की परस्पर संबद्धता के असामान्य किंतु जानबूझकर प्रयुक्त कथन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, मानक और गरिमापूर्ण हिन्दी है। ‘देह’ और ‘अंग’ से मूल शारीरिक रूपक तथा सामूहिक एकता बनी रहती है। ‘एक-दूसरे के अंग’ की धर्मवैचारिक तीक्ष्णता को अधिक सामान्य व्याख्या से प्रतिस्थापित नहीं किया गया है।
