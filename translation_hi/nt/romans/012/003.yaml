id: ROM.12.3
reference: Romans 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λέγω γὰρ διὰ τῆς χάριτος τῆς δοθείσης μοι παντὶ τῷ ὄντι ἐν ὑμῖν μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν, ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν, ἑκάστῳ ὡς ὁ θεὸς ἐμέρισεν μέτρον πίστεως.
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/003.yaml
  text: For by the grace given to me I say to everyone among you not to think of himself more highly than he ought to think, but to think with sound judgment, as God has apportioned to each a measure of faith.
translation:
  language: hi
  text: क्योंकि मुझे दिए गए अनुग्रह के द्वारा मैं तुम में से हर एक से कहता हूँ कि वह अपने बारे में जितना सोचना चाहिए, उससे अधिक न सोचे, बल्कि संयमित बुद्धि से विचार करे[a], जैसा परमेश्वर ने हर एक को विश्वास का एक माप बाँटा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बल्कि ऐसा सोचे कि उसकी सोच संयमित हो।”
    reason: lexical_alternative
  - marker: b
    text: या, “विश्वास का माप”; संभवतः “भरोसे या विश्वासयोग्यता का एक माप।” यूनानी पद परमेश्वर द्वारा दिए गए विश्वास से संबंधित माप का संकेत दे सकता है, पर उसका ठीक आशय निर्दिष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τῆς χάριτος τῆς δοθείσης μοι
  choice: मुझे दिए गए अनुग्रह के द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम या आधार प्रकट करता है। यह अनुवाद पौलुस को मिले परमेश्वर-प्रदत्त अनुग्रह और अधिकार को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: παντὶ τῷ ὄντι ἐν ὑμῖν
  choice: तुम में से हर एक से
  rationale: यह समुदाय के प्रत्येक व्यक्ति को अलग-अलग संबोधित करने वाली अभिव्यक्ति है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: μὴ ὑπερφρονεῖν παρ’ ὃ δεῖ φρονεῖν
  choice: अपने आपको जितना समझना चाहिए, उससे बढ़कर न समझे
  rationale: यह आत्म-मूल्यांकन की उचित सीमा व्यक्त करता है और ὑπερφρονεῖν तथा φρονεῖν के बीच के वैचारिक शब्द-संबंध को यथासंभव बनाए रखता है।
- source_word: ἀλλὰ φρονεῖν εἰς τὸ σωφρονεῖν
  choice: बल्कि अपने विषय में सही समझ रखे
  rationale: σωφρονεῖν में विवेकपूर्ण, संयमित और संतुलित सोच का भाव है। चुना हुआ वाक्यांश आधुनिक हिन्दी में सहज है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἑκάστῳ
  choice: हर एक को
  rationale: यह वितरणात्मक भाव को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐμέρισεν
  choice: बाँट दिया है
  rationale: μερίζω का अर्थ बाँटना या किसी को उसका भाग देना है। यह रूप परमेश्वर द्वारा किए गए जानबूझकर वितरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μέτρον πίστεως
  choice: विश्वास का एक माप
  rationale: यह यूनानी पद की व्यापकता को बनाए रखता है और यह निश्चित नहीं करता कि आशय उद्धारकारी विश्वास, सेवकाई की क्षमता, विश्वास के मानदंड या भरोसे की मात्रा से है।
- source_word: πίστεως
  choice: विश्वास
  rationale: πίστις का सामान्य और इस संदर्भ में उपयुक्त हिन्दी रूप ‘विश्वास’ है; ‘भरोसा’ या ‘विश्वासयोग्यता’ की संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
theological_decisions:
- issue: μέτρον πίστεως का अभिप्राय
  choice: ‘विश्वास का एक माप’ कहकर व्यापक और अनिर्धारित अर्थ बनाए रखना
  alternative: ‘विश्वास का माप’, ‘भरोसे का एक माप’ अथवा वरदानों के अनुरूप परमेश्वर-प्रदत्त सेवकाई-क्षमता
  rationale: आगे का प्रसंग अलग-अलग वरदानों की चर्चा करता है, पर यूनानी पद अपने आप किसी एक धर्मवैज्ञानिक अर्थ को अनिवार्य नहीं बनाता। इसलिए अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
- issue: σωφρονεῖν में निहित नैतिक-बौद्धिक भाव
  choice: ‘सही समझ रखे’
  alternative: ‘ऐसा सोचे कि उसकी सोच संयमित हो’
  rationale: इस क्रिया में समझदारी, आत्म-संयम और संतुलित आत्म-मूल्यांकन साथ-साथ निहित हैं। मुख्य पाठ सहज हिन्दी रखता है और अधिक रूप-सन्निकट अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, आदरपूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘अनुग्रह’ और ‘विश्वास’ जैसे स्थापित धर्मग्रंथीय शब्द बनाए गए हैं, जबकि वाक्य-विन्यास को अनावश्यक रूप से पुरातन नहीं बनाया गया।
