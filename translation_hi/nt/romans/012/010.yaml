  yaml_path: translation/nt/romans/012/010.yaml
  text: In brotherly love, be affectionate toward one another; in honor, outdo one another.
translation:
  language: hi
  text: भाई-बहन के समान प्रेम रखते हुए एक-दूसरे के प्रति स्नेहशील रहो; एक-दूसरे को आदर देने में एक-दूसरे से आगे बढ़ो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φιλαδελφίᾳ
  choice: भाई-बहन के समान प्रेम
  rationale: यह शब्द विश्वासियों के बीच पारिवारिक, सहोदर-जैसे प्रेम को व्यक्त करता है। ‘भाई-बहन’ आधुनिक हिन्दी में समुदाय के स्त्री और पुरुष दोनों सदस्यों को स्वाभाविक रूप से समेटता है।
- source_word: φιλόστοργοι
  choice: स्नेहशील रहो
  rationale: यह निकट पारिवारिक लगाव और कोमल आत्मीयता का भाव देता है; ‘स्नेहशील’ उस स्थायी प्रवृत्ति को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: τιμῇ
  choice: आदर देने में
  rationale: संदर्भ में τιμή दूसरे को सम्मान प्रदान करने की क्रिया की ओर संकेत करता है, इसलिए केवल अमूर्त ‘आदर में’ की अपेक्षा यह हिन्दी में अधिक स्पष्ट और स्वाभाविक है।
- source_word: προηγούμενοι
  choice: एक-दूसरे से आगे बढ़ो
  rationale: क्रिया में आगे चलने, पहल करने या दूसरे से बढ़कर करने का भाव है। यह चयन अंग्रेज़ी consultation layer के ‘outdo’ के बल को बनाए रखते हुए हिन्दी में आपसी आदर की सक्रिय तत्परता व्यक्त करता है।
theological_decisions:
- issue: προηγούμενοι का अर्थगत तनाव
  choice: एक-दूसरे से आगे बढ़ो
  alternative: एक-दूसरे को प्राथमिकता दो / आदर करने में पहल करो
  rationale: मूल क्रिया को केवल ‘दूसरे को प्राथमिकता देना’ मान लेने पर उसकी ‘आगे रहने/अगुवाई करने’ की धार मंद पड़ सकती है। चुना गया पाठ अस्वस्थ प्रतिस्पर्धा को स्पष्ट रूप से आरोपित किए बिना परस्पर आदर में बढ़-चढ़कर तत्पर रहने का अर्थ खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञार्थक बहुवचन शैली, सरल किंतु गरिमापूर्ण। ‘भाई-बहन के समान प्रेम’ मंडली के पारिवारिक संबंध को समावेशी और सहज ढंग से व्यक्त करता है।
