lexical_decisions:
- source_word: σπουδῇ
  choice: लगन
  rationale: यह शब्द तत्परता, उत्साह और परिश्रमपूर्ण निष्ठा का भाव रखता है। ‘लगन’ ὀκνηροί के साथ स्वाभाविक विरोध बनाता है और आधुनिक हिन्दी में सहज है।
- source_word: ὀκνηροί
  choice: आलसी न बनो
  rationale: यहाँ अर्थ सुस्ती या तत्परता की कमी का है। ‘आलसी न बनो’ स्पष्ट और स्वाभाविक नैतिक आग्रह है।
- source_word: πνεύματι
  choice: आत्मा में
  rationale: यूनानी पद मानव की आत्मा या पवित्र आत्मा—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘आत्मा’ इस वास्तविक अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: ζέοντες
  choice: उत्साह से भरे रहो
  rationale: शाब्दिक भाव ‘उबलते हुए’ है, जो रूपकतः प्रबल आंतरिक जोश बताता है। यह हिन्दी प्रयोग उसी तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: पौलुस के संदर्भ में यह उपाधि सबसे सम्भवतः प्रभु यीशु के लिए है, पर अनुवाद उपाधि को ही बनाए रखता है।
- source_word: δουλεύοντες
  choice: सेवा करो
  rationale: क्रिया दासवत समर्पित सेवा का भाव रखती है; इस उपदेशात्मक वाक्य में ‘सेवा करो’ सबसे स्वाभाविक है और आज्ञाकारिता तथा समर्पण दोनों व्यक्त करता है।
theological_decisions:
- issue: τῷ πνεύματι में πνεύματι का संदर्भ
  choice: मुख्य पाठ में ‘आत्मा’, जिसे मनुष्य की आत्मा/भीतरी स्वभाव के रूप में पढ़ा जा सकता है
  alternative: ‘पवित्र आत्मा के द्वारा’ या ‘पवित्र आत्मा में’
  rationale: यूनानी में संदर्भ स्पष्ट करने वाला कोई विशेष चिह्न नहीं है। निकटवर्ती नैतिक आग्रह मानव के भीतरी उत्साह की ओर संकेत कर सकता है, पर पवित्र आत्मा वाला पाठ भी सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। समानांतर तीन आग्रहों की लय बनाए रखी गई है।
