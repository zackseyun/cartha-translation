  text: καθάπερ γὰρ ἐν ἑνὶ σώματι ⸂πολλὰ μέλη⸃ ἔχομεν, τὰ δὲ μέλη πάντα οὐ τὴν αὐτὴν ἔχει πρᾶξιν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/012/004.yaml
  text: For just as in one body we have many members[a], but the members do not all have the same function[b],
translation:
  language: hi
  text: क्योंकि जिस प्रकार एक शरीर में बहुत-से अंग होते हैं[a], परन्तु उन सब अंगों का कार्य[b] एक-सा नहीं होता,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत से हिस्से।”
    reason: lexical_alternative
  - marker: b
    text: या, “गतिविधि।” यूनानी शब्द गतिविधि या कार्य को दर्शा सकता है; शरीर के रूपक में “कार्य” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθάπερ γὰρ
  choice: क्योंकि जैसे
  rationale: ‘क्योंकि’ पिछले उपदेश से व्याख्यात्मक संबंध बनाए रखता है और ‘जैसे’ उस तुलना को आरंभ करता है जो अगले पद में पूरी होती है।
- source_word: ἐν ἑνὶ σώματι
  choice: हमारे एक शरीर में
  rationale: यह शरीर के रूपक को सहज हिन्दी में व्यक्त करता है; ‘एक’ मूल के एकवचन और एकता, दोनों को बनाए रखता है।
- source_word: πολλὰ μέλη
  choice: बहुत से अंग
  rationale: ‘अंग’ शारीरिक रूपक के लिए स्वाभाविक आधुनिक हिन्दी है और आगे उसके सामुदायिक अनुप्रयोग के लिए भी उपयुक्त है।
- source_word: ἔχομεν
  choice: हमारे ... हैं
  rationale: यूनानी ‘हम रखते/रखते हैं’ को हिन्दी में स्वाभाविक अस्तित्व-संबंधी रचना ‘हमारे ... हैं’ से व्यक्त किया गया है।
- source_word: τὰ δὲ μέλη πάντα οὐ
  choice: लेकिन सभी अंगों का ... एक ही नहीं
  rationale: 'यह δέ के विरोध और नकार के सही दायरे को स्पष्ट रखता है: हर अंग एक ही काम नहीं करता।'
- source_word: πρᾶξιν
  choice: काम
  rationale: संदर्भ में यह अंग की गतिविधि या कार्य को दर्शाता है। ‘काम’ साधारण पाठक के लिए स्वाभाविक है और अत्यधिक तकनीकी अर्थ नहीं जोड़ता।
theological_decisions:
- issue: शरीर के रूपक का कलीसियाई आशय
  choice: ‘एक शरीर’ और ‘बहुत से अंग’ के रूपक को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘एक शरीर अर्थात कलीसिया’ जैसा स्पष्टकारी अनुवाद।
  rationale: अगला पद इस रूपक को विश्वासियों पर लागू करता है, पर यह पद स्वयं पहले तुलना प्रस्तुत करता है। इसलिए पाठ की क्रमिक प्रगति और निहित तनाव को बनाए रखा गया है।
- issue: πρᾶξις का अर्थ
  choice: काम
  alternative: कार्य; भूमिका; गतिविधि
  rationale: शरीर के अंगों के संदर्भ में ‘काम’ कार्य और गतिविधि दोनों का सहज संकेत देता है, जबकि ‘भूमिका’ मूल से अधिक अमूर्त और व्याख्यात्मक हो सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद के अंत का अल्पविराम अगले पद में पूरी होने वाली तुलना को दर्शाता है।
