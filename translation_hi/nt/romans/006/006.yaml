source:
  edition: SBLGNT
  text: τοῦτο γινώσκοντες ὅτι ὁ παλαιὸς ἡμῶν ἄνθρωπος συνεσταυρώθη, ἵνα καταργηθῇ τὸ σῶμα τῆς ἁμαρτίας, τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/006.yaml
  text: knowing this[a], that our old self was crucified with him, so that the body of sin might be rendered powerless, so that we should no longer be enslaved to sin[c][b],
translation:
  language: hi
  text: हम यह जानते हैं कि हमारा पुराना मनुष्य उसके साथ क्रूस पर चढ़ाया गया, ताकि पाप का शरीर निष्प्रभावी कर दिया जाए[a] और हम अब पाप के दास न रहें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निष्क्रिय कर दिया जाए”; अथवा, “मिटा दिया जाए।”
    reason: lexical_alternative
  - marker: b
    text: या, “हम अब पाप की सेवा न करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκοντες
  choice: हम यह जानते हैं
  rationale: वर्तमान कृदन्त को स्वाभाविक हिन्दी में मुख्य कथन से जुड़ी हुई ज्ञात बात के रूप में व्यक्त किया गया है; इससे पिछले संदर्भ के साथ इसका संबंध बना रहता है, बिना इसे स्पष्टतः कारणवाचक बनाने के।
- source_word: ὁ παλαιὸς ἡμῶν ἄνθρωπος
  choice: हमारा पुराना मनुष्य
  rationale: यह पौलुस का मानव-सम्बन्धी रूपक है। ‘पुराना मनुष्य’ मूल की संज्ञा और उसके रूपक को सुरक्षित रखता है; ‘पुराना स्वभाव’ कहने से अर्थ अनावश्यक रूप से केवल स्वभाव तक सीमित हो सकता था।
- source_word: συνεσταυρώθη
  choice: उसके साथ क्रूस पर चढ़ाया गया
  rationale: συν- उपसर्ग में निहित साझा क्रूसारोपण को ‘उसके साथ’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καταργηθῇ
  choice: निष्प्रभावी कर दिया जाए
  rationale: यहाँ क्रिया को पूर्ण विनाश के बजाय प्रभाव या कार्यशील शक्ति से वंचित करने के अर्थ में लिया गया है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: τὸ σῶμα τῆς ἁμαρτίας
  choice: पाप का शरीर
  rationale: सम्बन्धकारक पदबंध को ज्यों का त्यों रखा गया है, ताकि यह अस्पष्टता बनी रहे कि शरीर पाप के अधीन, पाप से चिह्नित, अथवा पाप से किसी अन्य सम्बन्ध में बताया जा रहा है।
- source_word: τοῦ μηκέτι δουλεύειν ἡμᾶς τῇ ἁμαρτίᾳ
  choice: हम आगे पाप की दासता न करें
  rationale: δουλεύω के दासत्व और सेवा—दोनों भावों को हिन्दी का ‘दासता करना’ संक्षेप में व्यक्त करता है और पाप को स्वामी मानने वाला रूपक बनाए रखता है।
theological_decisions:
- issue: ὁ παλαιὸς ἡμῶν ἄνθρωπος का मानव-सम्बन्धी मुहावरा
  choice: हमारा पुराना मनुष्य
  alternative: हमारा पुराना व्यक्तित्व / हमारा पुराना स्वभाव
  rationale: मुख्य पाठ मूल रूपक को बनाए रखता है और उसे केवल मनोवैज्ञानिक स्वभाव में नहीं बदलता। हिन्दी में ‘मनुष्य’ यहाँ समस्त व्यक्ति को सूचित करता है, केवल पुरुष को नहीं।
- issue: καταργηθῇ का बल
  choice: निष्प्रभावी कर दिया जाए
  alternative: मिटा दिया जाए / निष्क्रिय कर दिया जाए
  rationale: यह चयन पाप से सम्बद्ध शरीर की कार्यकारी शक्ति के निष्फल किए जाने को व्यक्त करता है, पर मूल से अधिक बढ़कर उसके पूर्ण अस्तित्व-विनाश का दावा नहीं करता।
- issue: δουλεύειν में दासत्व या सेवा का भाव
  choice: पाप की दासता न करें
  alternative: पाप की सेवा न करें / पाप के दास न रहें
  rationale: संदर्भ में पाप के प्रभुत्व का रूपक प्रमुख है। ‘दासता’ उसकी कठोरता बनाए रखती है, जबकि सेवा वाला सम्भव अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुराना मनुष्य’ और ‘पाप का शरीर’ जैसे सघन पौलुसी पदबंध मूल की रूपकात्मकता और वास्तविक अस्पष्टता बचाने के लिए बनाए रखे गए हैं।
