language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: νυνὶ δέ, ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας δουλωθέντες δὲ τῷ θεῷ, ἔχετε τὸν καρπὸν ὑμῶν εἰς ἁγιασμόν, τὸ δὲ τέλος ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/022.yaml
  text: But now[a], having been freed from sin and enslaved to God, you have your fruit unto sanctification, and the end[c][b], eternal life.
translation:
  language: hi
  text: परन्तु अब, पाप से मुक्त किए जाने और परमेश्वर के दास बनाए जाने के बाद, तुम्हें पवित्रीकरण के लिए अपना फल मिलता है, और उसका अंतिम परिणाम अनंत जीवन है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νυνὶ δέ
  choice: पर अब
  rationale: पिछली अवस्था के साथ प्रबल विरोध और वर्तमान नई स्थिति—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλευθερωθέντες ἀπὸ τῆς ἁμαρτίας
  choice: पाप से स्वतंत्र किए जाकर
  rationale: अओरिस्ट कर्मवाच्य कृदन्त के प्राप्त और पूर्ण किए गए कार्य को बनाए रखता है; एकवचन ‘पाप’ को शक्ति या अधीनता के क्षेत्र के रूप में रहने देता है।
- source_word: δουλωθέντες δὲ τῷ θεῷ
  choice: परमेश्वर के दास बनाए जाकर
  rationale: δουλόω की प्रबल दासता-संबंधी उपमा को नरम किए बिना, पाप की दासता और परमेश्वर की दासता के बीच पौलुस के जानबूझकर रखे गए विरोध को सुरक्षित रखता है।
- source_word: ἔχετε τὸν καρπὸν ὑμῶν
  choice: तुम्हें वह फल मिलता है
  rationale: καρπός की फलवाली उपमा बनाए रखते हुए आधुनिक हिन्दी में ἔχετε का सहज अर्थ देता है।
- source_word: εἰς ἁγιασμόν
  choice: पवित्रीकरण की ओर ले जाता है
  rationale: εἰς में निहित दिशा और परिणति को व्यक्त करता है तथा ἁγιασμός के प्रक्रिया/परिणाम संबंधी धार्मिक अर्थ को सुरक्षित रखता है।
- source_word: τὸ δὲ τέλος
  choice: और उसका अंतिम परिणाम
  rationale: τέλος को केवल समाप्ति नहीं, उस फल की अंतिम परिणति के अर्थ में स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: मूल पद का मानक, स्पष्ट और धर्मवैचारिक भार बनाए रखने वाला हिन्दी अनुवाद है।
theological_decisions:
- issue: परमेश्वर के संबंध में दासता की उपमा
  choice: परमेश्वर के दास बनाए जाकर
  alternative: परमेश्वर की सेवा में लगाए जाकर
  rationale: रोमियों 6 में पाप की पूर्व दासता और परमेश्वर की नई दासता का विरोध तर्क का अभिन्न भाग है; ‘सेवा’ उपमा की बंधनकारी शक्ति को अनावश्यक रूप से नरम कर देती।
- issue: ἁγιασμός का अर्थ
  choice: पवित्रीकरण
  alternative: पवित्रता
  rationale: इस प्रसंग में प्रक्रिया और परिणति दोनों की संभावना बनी रहती है। मुख्य पाठ में ‘पवित्रीकरण’ चुना गया है और समान रूप से संभव ‘पवित्रता’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: τέλος की परिणति-संबंधी बारीकी
  choice: अंतिम परिणाम
  alternative: अंत
  rationale: संदर्भ में अंतिम परिणति का भाव प्रमुख है, फिर भी मूल शब्द की अधिक सीधी अभिव्यक्ति ‘अंत’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। वाक्य की कृदन्तीय रचना और फल की उपमा यथासंभव सुरक्षित हैं, जबकि अस्वाभाविक शब्दक्रम से बचा गया है।
