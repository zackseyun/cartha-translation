revisions:
- from: पर अब, पाप से स्वतंत्र किए जाकर और परमेश्वर के दास बनाए जाकर[a], तुम्हें वह फल मिलता है जो पवित्रीकरण[b] की ओर ले जाता है, और उसका अंतिम परिणाम[c] अनन्त जीवन है।
  to: परन्तु अब, पाप से मुक्त किए जाने और परमेश्वर के दास बनाए जाने के बाद, तुम्हें पवित्रीकरण के लिए अपना फल मिलता है, और उसका अंतिम परिणाम अनंत जीवन है।
  rationale: Revision improves idiomatic modern Hindi while retaining the source’s passive participial force and the unsoftened slave metaphor. “पवित्रीकरण के लिए” directly conveys the fruit’s orientation toward sanctification. “अंतिम परिणाम” remains a clear contextual rendering of τέλος, with “अंत” retained in a footnote. The redundant footnote has been removed; remaining footnotes preserve genuine lexical alternatives.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:59:51Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrastive νυνὶ δέ, the passive liberation from sin, the deliberately strong δουλόω imagery in relation to God, the fruit metaphor, the directional/resultative force of εἰς ἁγιασμόν, and eternal life as the τέλος. The phrase “जो पवित्रीकरण की ओर ले जाता है” is defensible but introduces a relative clause that makes the fruit itself the explicit agent; a more direct Hindi construction better reflects the compact Greek relation.
  naturalness: “स्वतंत्र किए जाकर ... दास बनाए जाकर” is grammatically possible but noticeably cumbersome and repetitive in modern Hindi. “पाप से मुक्त किए जाने और परमेश्वर के दास बनाए जाने के बाद” retains the received/passive sense while reading naturally. “अनन्त” is intelligible, though “अनंत” is the more usual modern standard spelling.
  terminology: “परमेश्वर,” “दास,” “पवित्रीकरण,” and “अनंत जीवन” are suitable and consistent with the source’s register. The footnote attached to the God-slavery phrase in the draft is not a meaningful lexical alternative, since it substantially repeats the main rendering; it should be removed. The viable alternatives for ἁγιασμός and τέλος should remain documented.
  issues:
  - severity: medium
    issue: Repeated passive participial wording is awkward
    rationale: “पाप से स्वतंत्र किए जाकर और परमेश्वर के दास बनाए जाकर” is overly mechanical in Hindi. Recasting it as two passive verbal nouns followed by “के बाद” preserves the aorist passive sense without sacrificing readability.
  - severity: low
    issue: Footnote a is redundant
    rationale: “परमेश्वर के दास बना दिए गए” does not provide a materially distinct or more useful alternative to “परमेश्वर के दास बनाए जाकर.” Removing it improves footnote quality without losing a source ambiguity.
  - severity: low
    issue: Main-text relation of fruit to sanctification can be more direct
    rationale: “तुम्हें पवित्रीकरण के लिए अपना फल मिलता है” represents εἰς ἁγιασμόν directly and avoids adding an explicit relative-clause agent.
  revised_text: परन्तु अब, पाप से मुक्त किए जाने और परमेश्वर के दास बनाए जाने के बाद, तुम्हें पवित्रीकरण के लिए अपना फल मिलता है, और उसका अंतिम परिणाम अनंत जीवन है।
