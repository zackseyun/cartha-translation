  text: Τί οὖν ἐροῦμεν; ⸀ἐπιμένωμεν τῇ ἁμαρτίᾳ, ἵνα ἡ χάρις πλεονάσῃ;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/001.yaml
  text: What then shall we say? Should we continue in sin so that grace may increase?[a][b]
translation:
  language: hi
  text: तो हम क्या कहें? क्या हम पाप में बने रहें[a], ताकि अनुग्रह और बढ़े?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘क्या हम पाप में बने ही रहें ...?’
    reason: ἐπιμένωμεν के ‘बने रहने’ के साथ ‘लगे/बने ही रहने’ अर्थात् लगातार बने रहने के भाव का शाब्दिक विकल्प।
  - marker: b
    text: या, ‘ताकि अनुग्रह बहुतायत से बढ़े?’
    reason: πλεονάσῃ के ‘बढ़ने’ के साथ ‘बहुतायत से बढ़ने’ या ‘abound’ के अर्थ को सुरक्षित रखने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: Τί οὖν
  choice: तो हम क्या
  rationale: ‘तो’ पौलुस के पिछले तर्क से निकले निष्कर्षात्मक संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐροῦμεν
  choice: कहें
  rationale: यह भविष्यकालीन विचार-विमर्शात्मक अभिव्यक्ति है; ‘हम क्या कहें?’ हिन्दी में प्रश्न की आलंकारिक और विचारात्मक प्रकृति को सहज रूप से रखता है।
- source_word: ἐπιμένωμεν
  choice: क्या हम ... बने रहें
  rationale: वर्तमान संभावनार्थक रूप किसी जारी आचरण पर विचारात्मक प्रश्न उठाता है; ‘बने रहें’ निरंतरता और टिके रहने, दोनों भावों को व्यक्त करता है।
- source_word: τῇ ἁμαρτίᾳ
  choice: पाप में
  rationale: ἐπιμένω के साथ दत्तिव पाप के क्षेत्र या अभ्यास में बने रहने का भाव देता है; ‘पाप में’ स्वाभाविक और सटीक हिन्दी है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह प्रस्तावित उद्देश्य या परिणाम को स्पष्ट रखता है और पौलुस के आलंकारिक तर्क को समय से पहले हल नहीं करता।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: यहाँ χάρις के लिए स्थापित हिन्दी धर्मशास्त्रीय शब्द है और परमेश्वर की कृपापूर्ण भलाई के पौलुसी भाव को संक्षेप में व्यक्त करता है।
- source_word: πλεονάσῃ
  choice: और बढ़े
  rationale: क्रिया मात्रा या विस्तार में वृद्धि दर्शाती है; ‘और बढ़े’ आधुनिक पाठक के लिए स्पष्ट है और पूर्ववर्ती संदर्भ में अनुग्रह के बढ़ने का भाव स्वाभाविक बनाता है।
theological_decisions:
- issue: पौलुस के प्रश्न को अनुमति, कर्तव्य या केवल भविष्यवाणी के रूप में प्रस्तुत करना
  choice: 'विचारात्मक नैतिक प्रश्न: ‘क्या हम पाप में बने रहें’'
  alternative: ‘क्या हम पाप में बने रहेंगे’ अथवा ‘क्या हमें पाप में बने रहना है’
  rationale: यूनानी संभावनार्थक रूप प्रस्तावित आचरण के विषय में आलंकारिक प्रश्न पूछता है। ‘क्या हम ... बने रहें’ उसके विचारात्मक और नैतिक बल को रखता है, बिना अगले पद के उत्तर को इसमें मिला देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य की संक्षिप्त आलंकारिक संरचना तथा मूल का उद्देश्य/परिणाम संबंध सुरक्षित है।
