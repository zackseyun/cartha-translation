id: ROM.6.23
reference: Romans 6:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰ γὰρ ὀψώνια τῆς ἁμαρτίας θάνατος, τὸ δὲ χάρισμα τοῦ θεοῦ ζωὴ αἰώνιος ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/023.yaml
  text: For the wages of sin is death[b][a], but the gift of God is eternal life in Messiah Jesus our Lord.
translation:
  language: hi
  text: क्योंकि पाप की मज़दूरी मृत्यु है, परन्तु परमेश्वर का वरदान[a] हमारे प्रभु मसीह यीशु में[b] अनन्त जीवन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुग्रहपूर्ण वरदान।”
    reason: χάρισμα में अनुग्रह से और बिना अर्जित किए दिए गए उपहार का भाव निहित है।
  - marker: b
    text: या, “हमारे प्रभु मसीह यीशु के द्वारा”; यूनानी ‘में’ संबंध या सहभागिता का भाव भी व्यक्त कर सकता है।
    reason: ἐν की अर्थ-सीमा और मसीह-संबंधी पौलुस की भाषा में निहित वास्तविक व्याख्यात्मक विकल्प को दर्शाने के लिए।
lexical_decisions:
- source_word: ὀψώνια
  choice: मज़दूरी
  rationale: यह शब्द अर्जित पारिश्रमिक को दर्शाता है। ‘मज़दूरी’ पाप से मिलने वाले प्रतिफल और परमेश्वर के अनर्जित वरदान के बीच पौलुस के विरोध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἁμαρτίας
  choice: पाप की
  rationale: 'संबंधकारक रूप को संक्षिप्त रूप में रखा गया है: वह मज़दूरी जो पाप से संबद्ध है अथवा जिसे पाप देता है।'
- source_word: θάνατος
  choice: मृत्यु
  rationale: यह सीधा अर्थ है और मृत्यु के स्वरूप को अनावश्यक रूप से सीमित किए बिना उसके शाब्दिक तथा धर्मवैज्ञानिक भार को सुरक्षित रखता है।
- source_word: χάρισμα
  choice: वरदान
  rationale: ‘वरदान’ अनर्जित और अनुग्रह से दिए गए उपहार का भाव व्यक्त करता है तथा ‘मज़दूरी’ के साथ स्पष्ट विरोध बनाता है।
- source_word: ζωὴ αἰώνιος
  choice: अनन्त जीवन
  rationale: यह स्थापित, सहज और अर्थसंगत हिंदी अभिव्यक्ति है, जो जीवन की कालातीत अवधि और धर्मवैज्ञानिक अर्थ दोनों को बनाए रखती है।
- source_word: ἐν
  choice: में
  rationale: ‘में’ पौलुस की मसीह के साथ संबंध अथवा सहभागिता की भाषा को खुला रखता है और इसे केवल साधन के अर्थ में सीमित नहीं करता।
- source_word: Χριστῷ
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन के अर्थ और प्रचलित हिंदी बाइबलीय प्रयोग को बनाए रखता है।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: ‘प्रभु’ आरंभिक मसीही अंगीकार और इस पद के धर्मवैज्ञानिक भार को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: ἐν Χριστῷ Ἰησοῦ का संबंधसूचक बल
  choice: ‘हमारे प्रभु मसीह यीशु में’
  alternative: ‘हमारे प्रभु मसीह यीशु के द्वारा’
  rationale: यूनानी ἐν यहाँ क्षेत्र, संबंध या सहभागिता का भाव दे सकता है। ‘में’ मूल की व्यापकता और पौलुस की विशिष्ट भाषा को बनाए रखता है; ‘के द्वारा’ इसे साधन या कारण तक सीमित कर सकता है।
- issue: θάνατος की व्याप्ति
  choice: केवल ‘मृत्यु’
  alternative: ‘आत्मिक मृत्यु’ अथवा ‘अनन्त मृत्यु’
  rationale: मूल पाठ मृत्यु के प्रकार को इस पद में स्पष्ट नहीं करता। इसलिए अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मज़दूरी’ और ‘वरदान’ अर्जित परिणाम तथा अनर्जित उपहार के मूल विरोध को स्पष्ट करते हैं।
