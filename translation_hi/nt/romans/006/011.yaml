revisions:
- from: इसी प्रकार तुम भी अपने आपको पाप के लिए मरा हुआ, पर परमेश्वर के लिए मसीह यीशु में जीवित समझो।[a]
  to: इसी प्रकार तुम भी अपने आपको पाप के प्रति मरा हुआ, परन्तु परमेश्वर के लिए मसीह यीशु में जीवित समझो।[a]
  rationale: Only the first relational phrase is adjusted from “पाप के लिए” to “पाप के प्रति” to avoid a possible purposive reading and to represent the Greek dative relation more clearly in modern Hindi. The wording retains the source’s contrast, ambiguity of the final prepositional phrase, and established key terminology.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T00:59:44Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the exhortation, the explicit reflexive object, the dead/alive antithesis, and the unexpanded ἐν relation in “मसीह यीशु में.” The dative relation is retained, but “पाप के लिए” can naturally be heard in modern Hindi as ‘for the sake of sin,’ rather than the intended ‘with respect to sin.’
  naturalness: The sentence is generally clear and idiomatic. “पाप के प्रति” is a clearer modern Hindi expression of being dead in relation to sin, while retaining the contrast with being alive for God.
  terminology: “परमेश्वर,” “मसीह यीशु,” and “जीवित” are appropriate, dignified, and theologically noninterpretive. “मसीह” suitably retains the titular force of Χριστός.
  issues:
  - severity: medium
    issue: “पाप के लिए मरा हुआ” is semantically less precise in contemporary Hindi.
    rationale: Although it can occur in established biblical idiom, “के लिए” often expresses purpose or benefit. The Greek τῇ ἁμαρτίᾳ marks the relation with respect to which believers are dead; “पाप के प्रति” expresses this more directly without adding interpretation.
  revised_text: इसी प्रकार तुम भी अपने आपको पाप के प्रति मरा हुआ, परन्तु परमेश्वर के लिए मसीह यीशु में जीवित समझो।[a]
