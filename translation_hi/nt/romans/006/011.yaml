lexical_decisions:
- source_word: οὕτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पिछले तर्क से निष्कर्षात्मक संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λογίζεσθε
  choice: समझो
  rationale: यह किसी बात को सत्य मानने या अपने विषय में वैसा विचार करने का भाव देता है; ‘समझो’ सामान्य पाठक के लिए सहज है।
- source_word: ἑαυτοὺς
  choice: अपने आपको
  rationale: यूनानी के स्पष्ट आत्मवाचक सर्वनाम को बनाए रखता है।
- source_word: εἶναι
  choice: मरा हुआ ... जीवित
  rationale: हिन्दी वाक्य-विन्यास में ‘होना’ का भाव विधेय विशेषणों में स्वाभाविक रूप से व्यक्त होता है; अलग से ‘होना’ जोड़ना आवश्यक नहीं।
- source_word: νεκροὺς μὲν τῇ ἁμαρτίᾳ
  choice: पाप के लिए मरा हुआ
  rationale: सम्बन्धसूचक चतुर्थी का स्वाभाविक हिन्दी रूप है; μέν–δέ का विरोध ‘पर’ से व्यक्त किया गया है।
- source_word: ζῶντας δὲ τῷ θεῷ
  choice: पर परमेश्वर के लिए ... जीवित
  rationale: ‘जीवित’ ‘मरा हुआ’ के साथ स्पष्ट विरोध बनाता है और परमेश्वर-संबंधी चतुर्थी को बनाए रखता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν को ‘में’ रखकर पौलुस की संघ/क्षेत्र संबंधी भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है; Χριστός को अर्थपूर्ण उपाधि ‘मसीह’ के रूप में अनूदित किया गया है।
theological_decisions:
- issue: Χριστῷ को उपाधि या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ Χριστός की उपाधिगत अर्थवत्ता बनी हुई है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित और अर्थपूर्ण है।
- issue: ἐν Χριστῷ Ἰησοῦ का संबंध
  choice: मसीह यीशु में
  alternative: मसीह यीशु के द्वारा / मसीह यीशु के कारण
  rationale: ‘में’ मूल पूर्वसर्ग को सुरक्षित रखता है और सहभागिता, एकता अथवा क्षेत्र की सम्भावित अर्थ-छायाओं को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। एकवचन ‘अपने आपको’ हिन्दी में बहुवचन संबोधन ‘तुम’ के साथ स्वाभाविक है। मुख्य वाक्य में ‘पाप के लिए’ और ‘परमेश्वर के लिए’ की समानांतर रचना मूल विरोध को स्पष्ट रखती है।
