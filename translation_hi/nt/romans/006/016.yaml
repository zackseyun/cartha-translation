id: ROM.6.16
reference: Romans 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐκ οἴδατε ὅτι ᾧ παριστάνετε ἑαυτοὺς δούλους εἰς ὑπακοήν, δοῦλοί ἐστε ᾧ ὑπακούετε, ἤτοι ἁμαρτίας εἰς θάνατον ἢ ὑπακοῆς εἰς δικαιοσύνην;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/016.yaml
  text: Do you not know that if you present yourselves as servants for obedience[a], you are servants of the one whom you obey—either of sin leading to death, or of obedience leading to righteousness?
translation:
  language: hi
  text: क्या तुम नहीं जानते कि जब तुम आज्ञा मानने के लिए अपने आप को किसी के दासों के रूप में सौंपते हो, तो तुम उसी के दास हो जिसकी आज्ञा तुम मानते हो—या तो पाप के, जो मृत्यु की ओर ले जाता है, या आज्ञाकारिता के, जो धार्मिकता[a] की ओर ले जाती है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, न्याय।
    reason: lexical_alternative
lexical_decisions:
- source_word: παριστάνετε ἑαυτούς
  choice: अपने आप को ... सौंपते हो
  rationale: यह किसी के अधिकार और उपयोग के लिए स्वयं को प्रस्तुत करने का ठोस भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δούλους / δοῦλοί
  choice: दास
  rationale: यह शब्द स्वामित्व और अधीनता के प्रबल बिंब को बनाए रखता है; केवल ‘सेवक’ कहना उस बल को घटा सकता है।
- source_word: εἰς ὑπακοήν
  choice: आज्ञा मानने के लिए
  rationale: εἰς के प्रयोजनात्मक भाव को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ᾧ ὑπακούετε
  choice: जिसकी आज्ञा तुम मानते हो
  rationale: सम्बन्धवाचक रूप को बिना ‘स्वामी’ जैसा अनुपस्थित संज्ञा-पद जोड़े स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: मूल का सीधा शब्द बनाए रखा गया है; दासता का प्रसंग पाप के मानवीकरण को स्वयं स्पष्ट करता है।
- source_word: εἰς θάνατον
  choice: जिसका परिणाम मृत्यु है
  rationale: εἰς के परिणामसूचक अर्थ को स्पष्ट करता है, बिना पुरातन मुहावरे के।
- source_word: ὑπακοῆς
  choice: आज्ञाकारिता
  rationale: मूल की भाववाचक संज्ञा और पाप के साथ उसकी समानांतर संरचना सुरक्षित रहती है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह पौलुस के नैतिक और धर्मवैचारिक अर्थ-विस्तार को ‘न्याय’ की अपेक्षा अधिक व्यापक रूप में बनाए रखता है।
theological_decisions:
- issue: पौलुस के इस विरोध में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ पाप से मृत्यु और आज्ञाकारिता से δικαιοσύνη का नैतिक-आध्यात्मिक विरोध है। ‘धार्मिकता’ व्यापक पौलुसी अर्थ को सुरक्षित रखती है, जबकि ‘न्याय’ को वास्तविक शब्दार्थ-विकल्प के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। ‘दास’ मूल रूपक की कठोरता बनाए रखता है, और ‘जिसका परिणाम’ दोनों εἰς-वाक्यांशों की परिणामसूचक समानता को स्पष्ट करता है।
