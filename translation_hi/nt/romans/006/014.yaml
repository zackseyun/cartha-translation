  text: ἁμαρτία γὰρ ὑμῶν οὐ κυριεύσει, οὐ γάρ ἐστε ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/014.yaml
  text: For sin will not rule over you[b][a], because you are not under the law but under grace.
translation:
  language: hi
  text: क्योंकि पाप तुम पर शासन नहीं करेगा[a]; आखिर तुम व्यवस्था के अधीन नहीं, बल्कि अनुग्रह के अधीन हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाप तुम पर अधिकार नहीं चलाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁμαρτία
  choice: पाप
  rationale: पौलुस के प्रयोग के अनुरूप मानक शब्द; क्रिया के द्वारा पाप का शासक शक्ति के रूप में मानवीकरण बना रहता है, पर अनावश्यक रूप से कोई अतिरिक्त व्याख्यात्मक संकेत नहीं जोड़ा गया।
- source_word: κυριεύσει
  choice: प्रभुता नहीं करेगा
  rationale: क्रिया में प्रभु या स्वामी की तरह अधिकार चलाने का भाव है। यह चयन उस रूपक को बनाए रखता है; अधिक सहज विकल्प ‘अधिकार नहीं चलाएगा’ पादटिप्पणी में दिया गया है।
- source_word: ὑπὸ νόμον
  choice: व्यवस्था के अधीन
  rationale: यूनानी मुहावरे में व्यवस्था की सत्ता या शासन-व्यवस्था के अधीन होने का अर्थ है। हिन्दी में ‘के अधीन’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: χάριν
  choice: अनुग्रह
  rationale: पौलुस के व्यवस्था और अनुग्रह के विरोध में यह स्थापित तथा अर्थपूर्ण धार्मिक शब्द है; केवल ‘कृपा’ की अपेक्षा यहाँ शासनकारी क्षेत्र के समानांतर भाव को बेहतर वहन करता है।
- source_word: γὰρ … γάρ
  choice: क्योंकि … क्योंकि
  rationale: पहला γὰρ पिछले कथन का आधार प्रस्तुत करता है और दूसरा इस आश्वासन का कारण देता है। हिन्दी में दोनों स्थानों पर ‘क्योंकि’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: पाप के मानवीकरण को कितना स्पष्ट किया जाए
  choice: ‘पाप’ को सामान्य रूप में रखते हुए ‘प्रभुता नहीं करेगा’ कहना
  alternative: ‘पाप तुम्हारा स्वामी नहीं होगा’ या पाप को किसी विशिष्ट सत्ता के रूप में चिह्नित करना
  rationale: यूनानी पाठ पाप को शासन करने वाली शक्ति के रूप में चित्रित करता है, पर उसे औपचारिक व्यक्तित्व या अलग नाम नहीं देता। चुना हुआ रूपक इस तनाव को बिना अतिरिक्त doctrinal व्याख्या के सुरक्षित रखता है।
- issue: ὑπὸ νόμον में νόμον को किस दायरे में समझाया जाए
  choice: मुख्य पाठ में केवल ‘व्यवस्था के अधीन’ रखना
  alternative: ‘मूसा की व्यवस्था के अधीन’ या ‘व्यवस्था के शासन के अधीन’
  rationale: रोमियों के व्यापक संदर्भ में मूसा की व्यवस्था प्रमुख संदर्भ है, किंतु इस पद में विशेषण नहीं है। मुख्य पाठ स्रोत की संक्षिप्तता और संभावित व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘व्यवस्था’ और ‘अनुग्रह’ पौलुस-साहित्य के स्थापित शब्द हैं। मुख्य वाक्य में यूनानी के दो γὰρ को दो बार ‘क्योंकि’ से दर्शाया गया है; यह थोड़ी पुनरावृत्ति मूल तर्क-संबंध को सुरक्षित रखती है।
