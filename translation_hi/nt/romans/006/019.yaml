id: ROM.6.19
reference: Romans 6:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνθρώπινον λέγω διὰ τὴν ἀσθένειαν τῆς σαρκὸς ὑμῶν· ὥσπερ γὰρ παρεστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ ἀκαθαρσίᾳ καὶ τῇ ἀνομίᾳ εἰς τὴν ἀνομίαν, οὕτως νῦν παραστήσατε τὰ μέλη ὑμῶν δοῦλα τῇ δικαιοσύνῃ εἰς ἁγιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/019.yaml
  text: I am speaking in human terms because of the weakness of your flesh[a]. For just as you presented your members as servants to impurity and to lawlessness, leading to lawlessness, so now present your members as servants to righteousness[b], leading to sanctification.
translation:
  language: hi
  text: तुम्हारी देह[a] की दुर्बलता के कारण मैं मानवीय ढंग से बोल रहा हूँ। क्योंकि जैसे तुमने अपने अंगों को अशुद्धता और अधर्म के दासों के रूप में अधर्म की ओर समर्पित किया था, वैसे ही अब अपने अंगों को धार्मिकता[b] के दासों के रूप में पवित्रीकरण के लिए समर्पित करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पापी स्वभाव”; पर यूनानी अभिव्यक्ति का अर्थ इससे अधिक व्यापक हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνθρώπινον λέγω
  choice: मैं मानवीय ढंग से बोल रहा हूँ
  rationale: यह स्वाभाविक आधुनिक हिन्दी में बताता है कि पौलुस सामान्य मानवीय समझ के अनुरूप भाषा का प्रयोग कर रहा है, पर इसे केवल ‘उदाहरण’ या ‘उपमा’ तक सीमित नहीं करता।
- source_word: ἀσθένειαν
  choice: दुर्बलता
  rationale: यह शारीरिक अथवा नैतिक सीमा—दोनों की सम्भावना खुली रखता है और यूनानी शब्द की व्यापकता को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: σαρκὸς
  choice: देह
  rationale: ‘देह’ यहाँ σάρξ की व्यापकता और मानवीय मूर्त-अस्तित्व की धारणा को बनाए रखता है; मुख्य पाठ में अधिक व्याख्यात्मक ‘पापी स्वभाव’ नहीं रखा गया।
- source_word: παρεστήσατε / παραστήσατε
  choice: सौंप दिया था / सौंप दो
  rationale: दोनों रूपों में एक ही हिन्दी क्रिया रखकर भूतकालीन आचरण और वर्तमान आज्ञा का विरोध तथा यूनानी क्रिया की पुनरावृत्ति सुरक्षित की गई है।
- source_word: μέλη
  choice: अंगों
  rationale: यह शरीर के अंगों तथा उनसे जुड़ी मानवीय क्षमताओं—दोनों के लिए स्वाभाविक और पौलुस के रूपक के अनुकूल है।
- source_word: δοῦλα
  choice: दास बनाकर
  rationale: रोमियों 6 में स्वामित्व और अधीनता का दासता-रूपक केंद्रीय है; ‘सेवक’ उस बल को कम कर देता।
- source_word: ἀκαθαρσίᾳ
  choice: अशुद्धता
  rationale: यह नैतिक अशुद्धता का स्पष्ट, प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἀνομίᾳ / ἀνομίαν
  choice: अधर्म / अधर्म
  rationale: दोनों occurrences में एक ही शब्द रखकर यूनानी पुनरावृत्ति और पाप की बढ़ती दिशा को सुरक्षित किया गया है; ‘व्यवस्थाहीनता’ आधुनिक हिन्दी में केवल अव्यवस्था का अर्थ दे सकती है।
- source_word: εἰς τὴν ἀνομίαν
  choice: जिससे अधर्म बढ़ता गया
  rationale: εἰς की परिणाम अथवा दिशा-सूचक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और उसी अधर्म की आगे बढ़ती प्रक्रिया दिखाता है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यह पौलुस के नैतिक विरोध में δικαιοσύνη का स्थापित हिन्दी समतुल्य है; सम्भव ‘न्याय’ को पादटिप्पणी में रखा गया है।
- source_word: εἰς ἁγιασμόν
  choice: जिससे पवित्रीकरण हो
  rationale: यह धार्मिकता के प्रति समर्पण से उत्पन्न परिणाम अथवा दिशा को व्यक्त करता है और ἁγιασμός के प्रक्रियात्मक अर्थ को बनाए रखता है।
theological_decisions:
- issue: ‘तुम्हारी देह की दुर्बलता’ में σάρξ का अर्थ
  choice: देह
  alternative: पापी स्वभाव
  rationale: संदर्भ पतित मानवीय अस्तित्व की दुर्बलता को छू सकता है, पर यूनानी अभिव्यक्ति इसे केवल ‘पापी स्वभाव’ तक सीमित नहीं करती; इसलिए व्यापक अभिव्यक्ति मुख्य पाठ में और व्याख्यात्मक विकल्प पादटिप्पणी में रखा गया है।
- issue: पौलुस के इस संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: अशुद्धता और अधर्म के साथ नैतिक विरोध यहाँ ‘धार्मिकता’ का समर्थन करता है, जबकि δικαιοσύνη में निहित ‘न्याय’ की सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘अंग’, ‘दास’, ‘अशुद्धता’, ‘अधर्म’, ‘धार्मिकता’ और ‘पवित्रीकरण’ जैसे शब्द पौलुस के तर्क और रूपक को स्पष्ट रखते हैं। मुख्य पाठ के सभी पादटिप्पणी-चिह्न अपने सम्बद्ध शब्दों के तुरंत बाद दिए गए हैं।
