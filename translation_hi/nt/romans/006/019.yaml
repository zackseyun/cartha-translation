review_pass:
  verdict: revise
  source_fidelity: 'The draft conveys the verse''s central contrast and retains the repeated terms for lawlessness, righteousness, and sanctification. However, “अशुद्धता और अधर्म के दास बनाकर सौंप दिया था” alters the syntax: the members are not made into slaves and then handed over; they are presented as slaves to those powers. The revised wording represents this relationship directly and preserves the parallelism of the two commands/actions.'
  naturalness: The revision uses natural modern Hindi while retaining Paul's formal ethical and slavery imagery. “समर्पित किया था/समर्पित करो” provides a clear repeated equivalent for παρεστήσατε/παραστήσατε, and “अधर्म की ओर” expresses the directional/resultative force of εἰς without adding an unwarranted past-progressive nuance.
  terminology: “देह,” “अंग,” “अशुद्धता,” “अधर्म,” “धार्मिकता,” and “पवित्रीकरण” are appropriate in this register. The footnotes correctly preserve the broader interpretive possibility of σάρξ and the lexical alternative “न्याय” for δικαιοσύνη.
  issues:
  - severity: medium
    issue: The phrase “अशुद्धता और अधर्म के दास बनाकर सौंप दिया था” makes “बनाकर” modify the members as though the readers first made their members slaves and then handed them over.
    rationale: 'δοῦλα is predicative with παρεστήσατε: the members were presented as slaves to impurity and lawlessness. “दासों के रूप में … समर्पित” represents that construction without changing the imagery.'
  - severity: low
    issue: “जिससे अधर्म बढ़ता गया” adds a specifically progressive past result and weakens the direct parallel with “पवित्रीकरण के लिए.”
    rationale: εἰς expresses direction/result. “अधर्म की ओर” retains this force and mirrors “पवित्रीकरण के लिए” more closely.
