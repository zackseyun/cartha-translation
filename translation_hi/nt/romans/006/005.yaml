reference: Romans 6:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ γὰρ σύμφυτοι γεγόναμεν τῷ ὁμοιώματι τοῦ θανάτου αὐτοῦ, ἀλλὰ καὶ τῆς ἀναστάσεως ἐσόμεθα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/005.yaml
  text: For if we have become united with him in the likeness of his death[b][a], we will certainly also be united with him in the likeness of his resurrection.
translation:
  language: hi
  text: क्योंकि यदि हम उसकी मृत्यु की समानता में उसके साथ एक हो गए हैं[a], तो निश्चय ही उसके पुनरुत्थान की समानता में भी उसके साथ एक होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी मृत्यु की समानता में उसके साथ उगकर जुड़े हैं।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में, “हम पुनरुत्थान के भी होंगे”; “उसके साथ एक” और “उसके ... की समानता में” पहले खंड से समझे जाते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: σύμφυτοι
  choice: उसके साथ एक
  rationale: यह शब्द साथ उगने या जैविक रूप से जुड़ने से उत्पन्न गहरे सहभागी संबंध को व्यक्त करता है। ‘उसके साथ एक’ आधुनिक हिन्दी में स्वाभाविक है और संबंध की शक्ति बनाए रखता है; शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: γεγόναμεν
  choice: हो गए हैं
  rationale: पूर्णकाल किसी पूर्व घटना के वर्तमान परिणाम को दर्शाता है; ‘हो गए हैं’ हिन्दी में इस पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῷ ὁμοιώματι
  choice: की समानता में
  rationale: सम्बन्ध अथवा क्षेत्र सूचक दत्तिव को व्यक्त करते हुए यह यूनानी पद की जानबूझकर रखी गई ‘समानता’ की भाषा को सुरक्षित रखता है।
- source_word: τοῦ θανάτου αὐτοῦ
  choice: उसकी मृत्यु
  rationale: सम्बन्धकारक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἀλλὰ καὶ
  choice: तो निश्चय ही ... भी
  rationale: पहले खंड से निकलने वाले दूसरे खंड के बलपूर्ण निष्कर्ष और आरोही जोर को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: τῆς ἀναστάσεως
  choice: उसके पुनरुत्थान की समानता में
  rationale: यूनानी में ‘उसके’ और ‘समानता में’ दोहराए नहीं गए, पर समानांतर रचना से वे समझे जाते हैं। मुख्य पाठ में उन्हें दोहराना हिन्दी में स्पष्टता और संतुलन देता है।
- source_word: ἐσόμεθα
  choice: उसके साथ एक होंगे
  rationale: यूनानी का शाब्दिक अर्थ ‘हम होंगे’ है; विधेय σύμφυτοι पहले खंड से समझा जाता है। हिन्दी में पूरा भाव दोहराने से वाक्य सहज बनता है।
theological_decisions:
- issue: मसीह की मृत्यु और पुनरुत्थान में सहभागिता को संस्कारात्मक, रहस्यात्मक या केवल रूपकात्मक रूप में सीमित करना
  choice: ‘उसकी मृत्यु की समानता में उसके साथ एक ... उसके पुनरुत्थान की समानता में भी उसके साथ एक’
  alternative: ‘उसकी मृत्यु और पुनरुत्थान के नमूने से जुड़ना’ अथवा ‘उसके साथ उगना’
  rationale: मूल पाठ वास्तविक एकता/सहभागिता और ‘समानता’—दोनों को साथ रखता है। अनुवाद इस तनाव को बनाए रखता है और सहभागिता की रीति पर कोई संकीर्ण धर्मसैद्धान्तिक निष्कर्ष नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली रखी गई है। ‘पुनरुत्थान’ प्रचलित बाइबलीय शब्द है; वाक्य की समानांतर रचना पौलुस के तर्क और बल को स्पष्ट रखती है।
