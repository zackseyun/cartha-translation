  text: Ὅτε γὰρ δοῦλοι ἦτε τῆς ἁμαρτίας, ἐλεύθεροι ἦτε τῇ δικαιοσύνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/020.yaml
  text: For when you were servants of sin[b][a], you were free in regard to righteousness.
translation:
  language: hi
  text: क्योंकि जब तुम पाप के दास थे, तब धार्मिकता[b] के संबंध में स्वतंत्र थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के विषय में स्वतंत्र थे”; अथवा, “धार्मिकता से स्वतंत्र थे।”
    reason: मूल यूनानी दातृकारक में प्रमुखतः संबंध/संदर्भ का भाव है; पृथक्करण-सदृश समझ को वैकल्पिक रूप में सुरक्षित रखा गया है।
  - marker: b
    text: या, “न्याय।”
    reason: δικαιοσύνη का संभावित वैकल्पिक अर्थ; इस पौलुसी संदर्भ में मुख्य पाठ में ‘धार्मिकता’ अधिक उपयुक्त है।
lexical_decisions:
- source_word: δοῦλοι
  choice: दास
  rationale: रोमियों 6 में पाप और धार्मिकता की परस्पर विरोधी दासता का चित्र प्रमुख है; ‘दास’ बंधन और स्वामित्व की इस प्रबलता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἁμαρτίας
  choice: पाप के
  rationale: 'संबंधकारक रूप पाप के अधिकार या स्वामित्व को व्यक्त करता है: वे पाप के दास थे।'
- source_word: ἐλεύθεροι
  choice: स्वतंत्र
  rationale: यह पौलुस की तीखी विडंबना को बनाए रखता है कि पाप की दासता में रहते हुए वे धार्मिकता के प्रति बंधे हुए नहीं थे।
- source_word: τῇ δικαιοσύνῃ
  choice: धार्मिकता के संबंध में
  rationale: करण/संप्रदान कारक को यहाँ संबंध या संदर्भ के अर्थ में लिया गया है; यह अनुवाद धार्मिकता को किसी नकारात्मक बंधन के रूप में प्रस्तुत किए बिना यूनानी की अर्थगत खुली बनावट को रखता है।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: पौलुस के इस नैतिक-धर्मवैचारिक संदर्भ में ‘धार्मिकता’ मानक और स्वाभाविक विकल्प है; ‘न्याय’ संभावित वैकल्पिक अर्थ है, पर यहाँ मुख्य पाठ में कम उपयुक्त है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के साथ पद के व्याख्यात्मक संबंध को आधुनिक हिंदी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: धार्मिकता के साथ संबंध को किस प्रकार व्यक्त किया जाए
  choice: धार्मिकता के संबंध में स्वतंत्र थे
  alternative: धार्मिकता से स्वतंत्र थे
  rationale: चुना हुआ रूप संदर्भसूचक दातृकारक को दर्शाता है और पौलुस की विडंबनापूर्ण नैतिक तुलना को बनाए रखता है, पर ऐसा नहीं जताता कि धार्मिकता स्वयं कोई उत्पीड़क बंधन थी।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘दास’ को ‘सेवक’ पर प्राथमिकता दी गई है ताकि रोमियों 6 में बंधन और स्वामित्व का रूपक कमजोर न हो।
