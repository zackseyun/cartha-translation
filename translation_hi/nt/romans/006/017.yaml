  text: χάρις δὲ τῷ θεῷ ὅτι ἦτε δοῦλοι τῆς ἁμαρτίας ὑπηκούσατε δὲ ἐκ καρδίας εἰς ὃν παρεδόθητε τύπον διδαχῆς,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/017.yaml
  text: But thanks be to God that[a], though you were servants of sin[b], you obeyed from the heart the pattern of teaching to which you were handed over.
translation:
  language: hi
  text: पर परमेश्वर का धन्यवाद हो कि यद्यपि तुम पाप के दास थे, फिर भी तुमने हृदय से शिक्षा के उस प्रतिरूप[a] का पालन किया, जिसके हवाले तुम किए गए थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिक्षा के उस रूप” अथवा “शिक्षा के उस मानक।”
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “जिसमें तुम सौंपे गए थे।”
    reason: alternative_reading
lexical_decisions:
- source_word: χάρις δὲ τῷ θεῷ
  choice: पर परमेश्वर का धन्यवाद हो
  rationale: यह पदबंध परमेश्वर के प्रति धन्यवाद व्यक्त करता है; ‘अनुग्रह’ का अमूर्त अर्थ यहाँ उपयुक्त नहीं है।
- source_word: δοῦλοι τῆς ἁμαρτίας
  choice: पाप के दास
  rationale: रोमियों 6 में स्वामित्व और अधीनता का दासत्व-रूपक प्रमुख है; ‘सेवक’ इस तीव्रता को कम कर देता।
- source_word: ὑπηκούσατε
  choice: पालन किया
  rationale: क्रिया आज्ञाकारिता दर्शाती है, केवल सुनना नहीं; हिंदी में शिक्षा या प्रतिरूप का ‘पालन करना’ स्वाभाविक है।
- source_word: ἐκ καρδίας
  choice: हृदय से
  rationale: मूल के हृदय-रूपक और सच्ची आंतरिक आज्ञाकारिता, दोनों को सुरक्षित रखता है।
- source_word: τύπον διδαχῆς
  choice: शिक्षा के उस प्रतिरूप
  rationale: ‘प्रतिरूप’ τύπος के नमूने, रूप या मानक के अर्थ को समेटता है और गरिमापूर्ण आधुनिक हिंदी में बोधगम्य है।
- source_word: παρεδόθητε
  choice: हवाले तुम किए गए थे
  rationale: यूनानी कर्मवाच्य और विश्वासियों को शिक्षा के प्रतिरूप के अधीन सौंपे जाने की प्रभावशाली छवि को बनाए रखता है।
- source_word: εἰς ὃν
  choice: जिसके हवाले
  rationale: दिशा और अधीन किए जाने का संबंध स्वाभाविक हिंदी में व्यक्त करता है; अधिक शाब्दिक ‘जिसमें’ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: δοῦλοι को ‘सेवक’ से नरम किया जाए या ‘दास’ कहा जाए
  choice: पाप के दास
  alternative: पाप के सेवक
  rationale: इस अध्याय में पाप के प्रभुत्व और स्वामित्व का स्पष्ट दासत्व-रूपक है; ‘दास’ इस तनाव को सुरक्षित रखता है।
- issue: παρεδόθητε के कर्मवाच्य को बनाए रखा जाए या शिक्षा को विश्वासियों तक पहुँचाई गई वस्तु बनाया जाए
  choice: जिसके हवाले तुम किए गए थे
  alternative: जो शिक्षा तुम्हें सौंपी गई थी
  rationale: मूल पाठ में विश्वासी शिक्षा के प्रतिरूप को सौंपे जाते हैं, न कि केवल शिक्षा उन्हें सौंपी जाती है; चुना हुआ पाठ इस असामान्य किंतु अर्थपूर्ण छवि को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। वाक्य को हिंदी के स्वाभाविक क्रम में रखा गया है, जबकि दासत्व, हृदय से आज्ञाकारिता और शिक्षा के प्रतिरूप के हवाले किए जाने की मूल छवियाँ सुरक्षित हैं।
