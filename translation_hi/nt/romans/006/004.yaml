language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: συνετάφημεν οὖν αὐτῷ διὰ τοῦ βαπτίσματος εἰς τὸν θάνατον, ἵνα ὥσπερ ἠγέρθη Χριστὸς ἐκ νεκρῶν διὰ τῆς δόξης τοῦ πατρός, οὕτως καὶ ἡμεῖς ἐν καινότητι ζωῆς περιπατήσωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/004.yaml
  text: Therefore we were buried with him through baptism into death[a], so that just as Messiah was raised from the dead through the glory of the Father, so also we might walk in newness of life.
translation:
  language: hi
  text: इसलिए हम बपतिस्मे के द्वारा मृत्यु में उसके साथ गाड़े गए, ताकि जैसे मसीह पिता की महिमा के द्वारा मरे हुओं में से जिलाया गया, वैसे ही हम भी जीवन की नवीनता में चलें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετάφημεν
  choice: हम उसके साथ गाड़े गए
  rationale: संयुक्त क्रिया के συν- भाव को ‘उसके साथ’ से और अओरिस्ट कर्मवाच्य को पूर्ण भूतकालीन घटना के रूप में व्यक्त किया गया है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: διὰ τοῦ βαπτίσματος
  choice: बपतिस्मे के द्वारा
  rationale: सम्बन्धकारक के साथ διά का साधनवाचक अर्थ सुरक्षित रहता है, बिना किसी विशिष्ट संस्कार-सिद्धांत को अनुवाद में जोड़ने के।
- source_word: εἰς τὸν θάνατον
  choice: मृत्यु में
  rationale: εἰς की दिशात्मकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός की उपाधिगत शक्ति को प्रचलित और स्वाभाविक हिन्दी पद ‘मसीह’ से व्यक्त किया गया है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह पुनरुत्थान को मृतकों के बीच से उठाए जाने के रूप में सटीक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς δόξης τοῦ πατρός
  choice: पिता की महिमा के द्वारा
  rationale: διά की साधनवाचकता और δόξα के व्यापक अर्थ ‘महिमा’—दोनों को सुरक्षित रखा गया है।
- source_word: ἐν καινότητι ζωῆς περιπατήσωμεν
  choice: जीवन की नवीनता में चलें
  rationale: ‘चलना’ रूपक और ‘नवीनता’ की अमूर्त अभिव्यक्ति दोनों सुरक्षित हैं; ἵνα के अधीन सम्भावनार्थक क्रिया को हिन्दी उद्देश्य-वाक्य में ‘चलें’ से स्वाभाविक रूप मिला है।
theological_decisions:
- issue: बपतिस्मे और मसीह के साथ सहभागिता के संबंध को किसी विशिष्ट संस्कार-सिद्धांत के रूप में प्रस्तुत करना
  choice: बपतिस्मे के द्वारा
  alternative: बपतिस्मे से
  rationale: चुना हुआ रूप यूनानी वाक्य की साधनवाचकता दर्शाता है, पर यह निर्धारित नहीं करता कि यह सहभागिता किस धर्मसैद्धांतिक रीति से घटित होती है।
- issue: εἰς τὸν θάνατον में निहित मृत्यु की पहचान
  choice: मुख्य पाठ में ‘मृत्यु में’
  alternative: ‘मसीह की मृत्यु में’
  rationale: इस पद के यूनानी पाठ में ‘मसीह की’ स्पष्ट रूप से नहीं है, यद्यपि निकटवर्ती प्रसंग उस अर्थ का समर्थन करता है; इसलिए मूल की संक्षिप्तता मुख्य पाठ में रखी गई और स्पष्टार्थक विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप रखा गया है। ‘गाड़े गए’, ‘मरे हुओं में से जिलाया गया’ और ‘जीवन की नवीनता में चलें’ पौलुस के दफन, पुनरुत्थान और चाल के रूपकों को सपाट व्याख्या में बदले बिना सुरक्षित रखते हैं।
