source:
  edition: SBLGNT
  text: Μὴ οὖν βασιλευέτω ἡ ἁμαρτία ἐν τῷ θνητῷ ὑμῶν σώματι εἰς τὸ ⸀ὑπακούειν ταῖς ἐπιθυμίαις αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/012.yaml
  text: Therefore[a], do not let sin reign in your mortal body, so that you obey its desires.
translation:
  language: hi
  text: इसलिए पाप को अपने नश्वर शरीर में राज करने न दो, कि तुम उसकी अभिलाषाओं के अनुसार चलो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट और स्वाभाविक हिंदी में जोड़ता है।
- source_word: βασιλευέτω
  choice: राज न करने दो
  rationale: निषेधात्मक आज्ञा और राजकीय रूपक—दोनों को बनाए रखता है तथा पाप के मानवीकरण को स्पष्ट करता है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: मूल अर्थ का सीधा अनुवाद है; ‘राज’ के साथ इसका प्रयोग पाप को शासन करने वाली शक्ति के रूप में प्रस्तुत करता है।
- source_word: θνητῷ
  choice: नश्वर
  rationale: मनुष्य के वर्तमान शरीर की मृत्यु के अधीन अवस्था को संक्षिप्त और प्रतिष्ठित भाषा में व्यक्त करता है।
- source_word: σώματι
  choice: शरीर
  rationale: यह सामान्य आधुनिक हिंदी में मूल संज्ञा का सीधा और अनावश्यक विस्तार से रहित अनुवाद है।
- source_word: εἰς τὸ ὑπακούειν
  choice: जिससे तुम ... के अधीन हो जाओ
  rationale: यह रचना उद्देश्य अथवा परिणाम व्यक्त कर सकती है। हिंदी में यह अनचाहे परिणाम को स्वाभाविक ढंग से सामने लाती है।
- source_word: ἐπιθυμίαις
  choice: अभिलाषाओं
  rationale: यह शब्द केवल यौन वासना तक अर्थ को सीमित किए बिना नैतिक संदर्भ में इच्छाओं का व्यापक भाव बनाए रखता है।
- source_word: αὐτοῦ
  choice: शरीर की
  rationale: यूनानी सर्वनाम का लिंग और वचन निकटवर्ती नपुंसकलिंग एकवचन ‘शरीर’ से मेल खाता है; संदर्भगत वैकल्पिक संबंध को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: क्या पाप केवल कर्मों को सूचित करता है या शासन करने वाली शक्ति के रूप में चित्रित है
  choice: ‘पाप को ... राज न करने दो’ द्वारा पाप के मानवीकरण और राजकीय रूपक को बनाए रखा गया है।
  alternative: इसे विस्तार देकर ‘पापपूर्ण व्यवहार को नियंत्रण न करने दो’ कहना।
  rationale: मूल क्रिया पाप को राजा-समान शासन करने वाली शक्ति के रूप में चित्रित करती है; व्याख्यात्मक विस्तार किए बिना उसी तनाव को बनाए रखना उचित है।
- issue: αὐτοῦ का पूर्वपद
  choice: मुख्य पाठ में इसे नश्वर शरीर से संबद्ध माना गया है।
  alternative: इसे संदर्भगत रूप से पाप की अभिलाषाओं से संबद्ध समझना।
  rationale: यूनानी सर्वनाम का रूप ‘शरीर’ से व्याकरणिक रूप से स्वाभाविक मेल रखता है, जबकि संदर्भ में पाप से वैचारिक संबंध संभव है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘राज’ पाप के मानवीकरण को और ‘नश्वर शरीर’ पौलुस के तर्क की शारीरिक-मृत्यु संबंधी भाषा को बनाए रखते हैं।
