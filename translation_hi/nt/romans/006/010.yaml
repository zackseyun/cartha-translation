  yaml_path: translation/nt/romans/006/010.yaml
  text: For the death he died[a], he died to sin once for all; but the life he lives, he lives to God.
translation:
  language: hi
  text: क्योंकि वह जो मरा, पाप के संबंध में एक ही बार मरा; पर जो जीवन वह जीता है, वह परमेश्वर के लिए जीता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ γὰρ ἀπέθανεν
  choice: क्योंकि जो मृत्यु वह मरा
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम और दोहराई गई क्रिया मृत्यु की घटना पर बल देते हैं। यह हिंदी रूप यूनानी संरचना और पिछले कथन से γάρ के व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: τῇ ἁμαρτίᾳ
  choice: पाप के लिए
  rationale: हिंदी में ‘पाप के लिए मरना’ संबंध अथवा संदर्भ व्यक्त कर सकता है, किंतु बलिदानी अर्थ भी ग्रहण कर सकता है; मूल के संबंधवाचक दत्तिव की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἐφάπαξ
  choice: सदा के लिए एक ही बार
  rationale: यह एक बार घटित, न दोहराए जाने वाले और स्थायी महत्त्व वाले कार्य का भाव स्पष्ट करता है।
- source_word: ὃ δὲ ζῇ
  choice: पर जो जीवन वह जीता है
  rationale: पहले खंड के समानांतर रूप को सुरक्षित रखते हुए मृत्यु और जीवन का विरोध स्पष्ट किया गया है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: यह परमेश्वर की ओर उन्मुख जीवन का भाव देता है और पहले दत्तिव पद के साथ संरचनात्मक समानता बनाए रखता है।
theological_decisions:
- issue: τῇ ἁμαρτίᾳ का संबंधवाचक या बलिदानी अर्थ
  choice: पाप के लिए
  alternative: पाप के प्रति; पाप के संबंध में
  rationale: मूल दत्तिव कई निकट अर्थों की अनुमति देता है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और पादटिप्पणी में विकल्प दिए गए हैं, ताकि मसीह में व्यक्तिगत पाप का संकेत न जोड़ा जाए और पौलुस का धर्मवैचारिक तनाव भी न मिटे।
