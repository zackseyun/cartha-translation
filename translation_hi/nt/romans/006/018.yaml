lexical_decisions:
- source_word: ἐλευθερωθέντες
  choice: स्वतंत्र किए जाकर
  rationale: अओरिस्ट कर्मवाच्य कृदंत उस पूर्ण कार्य को व्यक्त करता है जो संबोधित लोगों पर किया गया; यह रूप कर्मवाच्य अर्थ और मुख्य क्रिया से उसका संबंध बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ पौलुस के तर्क को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ हिंदी में स्वाभाविक रूप से इस संबंध को व्यक्त करता है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: एकवचन और निश्चित रूप में यह पाप को एक शासक शक्ति के रूप में भी संकेत कर सकता है; ‘पाप’ अमूर्त तथा मानवीकृत, दोनों अर्थों की संभावना बनाए रखता है।
- source_word: ἐδουλώθητε
  choice: दास बनाए गए
  rationale: कर्मवाच्य क्रिया स्वामीत्व के परिवर्तन और दासत्व की तीखी उपमा को सुरक्षित रखती है; इसे ‘सेवक बने’ कहकर नरम नहीं किया गया।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यह प्रचलित हिंदी बाइबलीय शब्द नैतिक और न्याय-संबंधी अर्थ-छायाओं को समेट सकता है; ‘न्यायपरायणता’ को वैकल्पिक अर्थ के रूप में टिप्पणी में रखा गया है।
theological_decisions:
- issue: δουλόω की दासत्व-उपमा
  choice: तुम धार्मिकता के दास बनाए गए
  alternative: तुम धार्मिकता के सेवक बन गए
  rationale: रोमियों 6 में दासत्व की उपमा तर्क का केंद्रीय अंग है। चुना हुआ रूप पाप के अधिकार से धार्मिकता के अधिकार में स्थानांतरण को बिना नरम किए व्यक्त करता है।
- issue: δικαιοσύνη का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: यहाँ नैतिक सहीपन प्रमुख है, फिर भी यूनानी शब्द में न्याय की अर्थ-छाया संभव है; इसलिए वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिंदी। ‘दास बनाए गए’ जानबूझकर सशक्त रखा गया है ताकि मूल दासत्व-उपमा और कर्मवाच्य दोनों सुरक्षित रहें।
