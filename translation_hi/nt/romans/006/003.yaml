  naturalness: The opening and theological vocabulary are natural modern standard Hindi, but the comma-separated ‘हम सबने, जिन्होंने’ interrupts the clause and leaves an ungrammatical construction. ‘हम में से जितनों ने … उन्होंने …’ is fluent and clearly correlates the two baptism clauses.
  terminology: ‘मसीह यीशु,’ ‘बपतिस्मा,’ and ‘मृत्यु’ are appropriate in a dignified modern Hindi biblical register. The alternative-name footnote is retained but corrected to cite the actual Greek inflected form found in this verse.
