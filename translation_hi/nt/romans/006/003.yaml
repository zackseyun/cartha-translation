id: ROM.6.3
reference: Romans 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἢ ἀγνοεῖτε ὅτι ὅσοι ἐβαπτίσθημεν εἰς Χριστὸν Ἰησοῦν εἰς τὸν θάνατον αὐτοῦ ἐβαπτίσθημεν;
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/003.yaml
  text: Or do you not know that all of us who were baptized into Messiah Jesus were baptized into his death?[a]
translation:
  language: hi
  text: या क्या तुम नहीं जानते कि हम में से जितनों ने मसीह यीशु में बपतिस्मा लिया, उन्होंने उसकी मृत्यु में बपतिस्मा लिया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “ख्रीस्त यीशु।” यूनानी: “Χριστὸν Ἰησοῦν” (ख्रिस्तोन ईएसून)।'
    reason: Χριστός के लिए प्रचलित वैकल्पिक लिप्यंतरण और इस पद में आए यूनानी पदबंध की जानकारी देना।
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: पौलुस के पिछले तर्क से जुड़े विकल्पसूचक संक्रमण और हल्की झिड़की को बनाए रखता है।
- source_word: ἀγνοεῖτε
  choice: क्या तुम नहीं जानते
  rationale: अलंकारिक प्रश्न को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और साझा ज्ञान की ओर संकेत बनाए रखता है।
- source_word: ὅσοι
  choice: हम सबने, जिन्होंने
  rationale: प्रथम पुरुष बहुवचन के साथ समावेशी व्यापकता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐβαπτίσθημεν
  choice: बपतिस्मा लिया
  rationale: यूनानी कर्मवाच्य घटना को हिन्दी की रूढ़ और स्वाभाविक बाइबलीय अभिव्यक्ति में रखता है, बिना बपतिस्मा की विधि या प्रभाव की व्याख्या जोड़े।
- source_word: εἰς
  choice: में
  rationale: दोनों स्थानों पर एक ही संबंधसूचक शब्द रखकर मसीह और उसकी मृत्यु में प्रवेश अथवा समावेश की छवि बचाता है; हिन्दी में ‘में बपतिस्मा लेना’ सबसे स्वाभाविक निकट समतुल्य है।
- source_word: Χριστὸν Ἰησοῦν
  choice: मसीह यीशु
  rationale: Χριστός के पदवीगत अर्थ को ‘मसीह’ से व्यक्त करता है और हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: मूल संज्ञा का सीधा और पर्याप्त अनुवाद है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: सम्बन्धकारक सर्वनाम को स्वाभाविक हिन्दी अधिकारसूचक रूप में व्यक्त करता है।
theological_decisions:
- issue: बपतिस्मा के साथ εἰς को ऐसा कैसे अनूदित किया जाए कि संस्कारगत प्रभाव, प्रतीकात्मक पहचान या वाचागत एकता में से किसी एक मत को निर्णायक न बनाया जाए।
  choice: दोनों बार ‘में’
  alternative: ‘के संबंध में’ या ‘के साथ एकता में’
  rationale: ‘में’ मसीह यीशु और उसकी मृत्यु में प्रवेश अथवा समावेश की मूल छवि को बनाए रखता है, पर उसके धर्मवैज्ञानिक तंत्र को किसी एक सम्प्रदायगत व्याख्या से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और बाइबलीय रूप। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘बपतिस्मा लिया’ हिन्दी में कर्मवाच्य यूनानी का स्वाभाविक मुहावरेदार समतुल्य है; इससे कर्ता, विधि या धर्मवैज्ञानिक प्रभाव नहीं जोड़ा गया।
