reference: Romans 6:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μηδὲ παριστάνετε τὰ μέλη ὑμῶν ὅπλα ἀδικίας τῇ ἁμαρτίᾳ, ἀλλὰ παραστήσατε ἑαυτοὺς τῷ θεῷ ⸀ὡσεὶ ἐκ νεκρῶν ζῶντας καὶ τὰ μέλη ὑμῶν ὅπλα δικαιοσύνης τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/013.yaml
  text: And do not present your members to sin as weapons of unrighteousness[a], but present yourselves to God as alive from the dead[b], and your members to God as weapons of righteousness.
translation:
  language: hi
  text: और अपने शरीर के अंगों को अधर्म के हथियारों के रूप में पाप को न सौंपो; बल्कि अपने आप को परमेश्वर को ऐसे लोगों के समान सौंप दो जो मरे हुओं में से जीवित हैं, और अपने शरीर के अंगों को धार्मिकता के हथियारों के रूप में परमेश्वर को सौंप दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παριστάνετε / παραστήσατε
  choice: सौंपो / सौंप दो
  rationale: यह चयन किसी के अधिकार या उपयोग के लिए स्वयं अथवा अपने अंगों को प्रस्तुत करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और दोनों खंडों में यूनानी क्रिया की पुनरावृत्ति बनाए रखता है। निषेध में अपूर्णतामूलक वर्तमान और सकारात्मक आदेश में निर्णायक अओरिस्ट के अंतर को क्रमशः “न सौंपो” और “सौंप दो” से हल्के रूप में व्यक्त किया गया है।
- source_word: μέλη
  choice: शरीर के अंग
  rationale: सिर्फ “अंग” की अपेक्षा यह सामान्य पाठक के लिए अधिक स्पष्ट है और नैतिक कार्य में प्रयुक्त शारीरिक अंगों के पौलुसीय अर्थ को सुरक्षित रखता है।
- source_word: ὅπλα
  choice: हथियार
  rationale: यह युद्ध-संबंधी बिंब को “साधन” से अधिक स्पष्टता से बनाए रखता है; व्यापक अर्थ “साधन” को पादटिप्पणी में दिया गया है।
- source_word: ἀδικίας
  choice: अधर्म
  rationale: यह नैतिक और धर्मवैचारिक अर्थ को संक्षेप में व्यक्त करता है तथा “धार्मिकता” के साथ स्पष्ट विरोध बनाता है।
- source_word: ἁμαρτίᾳ
  choice: पाप को
  rationale: सरल दत्तिव संबंध रखा गया है; “पाप की शक्ति” जैसा व्याख्यात्मक विस्तार नहीं जोड़ा गया, जिससे प्रसंग में पाप का मानवीकरण खुला रहता है।
- source_word: ὡσεὶ ἐκ νεκρῶν ζῶντας
  choice: ऐसे लोगों के समान जो मरे हुओं में से जीवित हैं
  rationale: यह ὡσεὶ की तुलनात्मक शक्ति और मृत्यु से जीवन के पुनरुत्थान-सदृश विरोध दोनों को बनाए रखता है, बिना यह स्पष्ट किए कि बात रूपक, आत्मिक दशा या भावी शारीरिक पुनरुत्थान में से केवल किसकी है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: रोमियों के इस नैतिक-धर्मवैचारिक संदर्भ में यह प्रचलित और उपयुक्त चयन है; “न्याय” की संभावित अर्थछाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पाप और परमेश्वर के प्रति प्रतिद्वंद्वी समर्पण
  choice: “पाप को” और “परमेश्वर को” के सीधे संबंध बनाए रखे गए हैं।
  alternative: “पाप की सेवा में” और “परमेश्वर की सेवा में”
  rationale: यूनानी दत्तिव स्वयं अधिकार, दिशा और निष्ठा का संकेत देता है; “सेवा में” जोड़ना निहित धर्मवैचारिक अर्थ को अनावश्यक रूप से स्पष्ट कर देता।
- issue: “मरे हुओं में से जीवित” की पुनरुत्थान-संबंधी भाषा
  choice: तुलनात्मक वाक्यांश को “ऐसे लोगों के समान” से खुला रखा गया है।
  alternative: “मानो जिलाए गए हो” या “आत्मिक रूप से जीवित किए गए हो”
  rationale: पहला विकल्प कर्मवाच्य क्रिया जोड़ता और दूसरा एक विशिष्ट व्याख्या आरोपित करता; चुना हुआ रूप मूल की तुलना तथा धर्मवैचारिक तनाव दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। “शरीर के अंग” सामान्य पाठक के लिए स्पष्ट है, जबकि “अधर्म” और “धार्मिकता” पौलुसीय धर्मवैचारिक विरोध को बनाए रखते हैं। डैश जटिल मध्यवर्ती तुलना को पठनीय बनाते हैं।
