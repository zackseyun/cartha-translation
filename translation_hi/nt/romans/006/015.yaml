id: ROM.6.15
reference: Romans 6:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τί οὖν; ⸀ἁμαρτήσωμεν ὅτι οὐκ ἐσμὲν ὑπὸ νόμον ἀλλὰ ὑπὸ χάριν; μὴ γένοιτο·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/015.yaml
  text: What then? Should we sin because we are not under law but under grace? May it never be![a][b]
translation:
  language: hi
  text: तो फिर क्या? क्या हम इसलिए पाप करें कि हम व्यवस्था के अधीन नहीं, बल्कि अनुग्रह के अधीन हैं?[a] कदापि नहीं![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या हमें पाप करना चाहिए?”
    reason: lexical_alternative
  - marker: b
    text: या, “ऐसा कभी न हो!”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τί οὖν
  choice: तो फिर क्या?
  rationale: यह संक्षिप्त वाक्यांश पौलुस के तर्क में निष्कर्षात्मक संक्रमण को स्वाभाविक हिन्दी में व्यक्त करता है और मूल में अनुपस्थित शब्द नहीं जोड़ता।
- source_word: ἁμαρτήσωμεν
  choice: क्या हम ... पाप करें
  rationale: प्रथम पुरुष बहुवचन का एओरिस्ट सब्जंक्टिव यहाँ विचारार्थक प्रश्न है। यह रूप उस प्रस्तावित संभावना को स्पष्ट रखता है, बिना उसे आज्ञा या वास्तविक इरादा बनाए।
- source_word: ὅτι
  choice: इसलिए ... कि
  rationale: 'यह प्रस्तावित तर्क का आधार बताता है: क्या अनुग्रह के अधीन होना पाप करने का कारण माना जाए। आधुनिक हिन्दी में ‘इसलिए ... कि’ इस कारण-संबंध को सहजता से व्यक्त करता है।'
- source_word: ὑπὸ νόμον
  choice: व्यवस्था के अधीन
  rationale: ‘व्यवस्था’ νόμος का मानक बाइबलीय हिन्दी प्रतिशब्द है। ‘अधीन’ ὑπό के अधिकार-क्षेत्र का भाव बनाए रखता है; अनुवाद इसे मुख्य पाठ में विशेष रूप से ‘मूसा की व्यवस्था’ कहकर सीमित नहीं करता।
- source_word: ὑπὸ χάριν
  choice: अनुग्रह के अधीन
  rationale: ‘अनुग्रह’ χάρις के धर्मवैचारिक और संबंधपरक अर्थ को बनाए रखता है तथा व्यवस्था के साथ पौलुस के समानांतर विरोध को स्पष्ट रखता है।
- source_word: μὴ γένοιτο
  choice: कदापि नहीं!
  rationale: यह पौलुस की तीव्र अस्वीकृति को संक्षिप्त, गरिमापूर्ण और प्रचलित आधुनिक हिन्दी में व्यक्त करता है। अधिक शाब्दिक मुहावरेदार रूप फुटनोट में दिया गया है।
theological_decisions:
- issue: νόμος के अर्थ-क्षेत्र की सीमा
  choice: मुख्य पाठ में ‘व्यवस्था’ रखा गया है, ‘मूसा की व्यवस्था’ नहीं।
  alternative: ‘मूसा की व्यवस्था’ या सामान्य अर्थ में ‘कानून’।
  rationale: यूनानी में यहाँ संज्ञा के साथ निश्चित उपपद नहीं है। ‘व्यवस्था’ पौलुस के कानूनी-वाचा संबंधी विरोध को सुरक्षित रखती है, पर मुख्य पाठ में उसके सटीक दायरे का धर्मवैचारिक निर्णय नहीं करती।
- issue: अनुग्रह के अधीन होने और पाप करने के बीच प्रस्तावित संबंध
  choice: प्रश्न को वास्तविक विचारार्थक संभावना के रूप में रखा गया है, जिसके बाद तीव्र निषेध आता है।
  alternative: प्रश्न को व्याख्यात्मक रूप से ‘क्या इसका अर्थ है कि हम पाप करते रहें?’ बनाना।
  rationale: मूल केवल ‘पाप करें’ कहता है; ‘करते रहें’ जोड़ने से इस पद और 6:1 के बीच का भेद कम हो सकता है। इसलिए मूल की कालगत अस्पष्टता और तर्कगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘व्यवस्था’, ‘अनुग्रह’ और ‘अधीन’ जैसे परिचित बाइबलीय शब्द गरिमापूर्ण धार्मिक शैली बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सीधा और स्वाभाविक है।
