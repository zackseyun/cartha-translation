source:
  edition: SBLGNT
  text: εἰδότες ὅτι Χριστὸς ἐγερθεὶς ἐκ νεκρῶν οὐκέτι ἀποθνῄσκει, θάνατος αὐτοῦ οὐκέτι κυριεύει·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/009.yaml
  text: knowing that the Messiah[a], having been raised from the dead, no longer dies; death no longer rules over him.
translation:
  language: hi
  text: यह जानते हुए कि मसीह[a] मरे हुओं में से जिलाया गया है, फिर कभी नहीं मरता; मृत्यु का उस पर फिर प्रभुत्व नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ख्रीस्त।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: क्योंकि हम जानते हैं
  rationale: यह कृदन्त संदर्भ में पहले कही बात का आधार बताता है। स्वाभाविक हिन्दी में यह साझा ज्ञान और तर्क-संबंध दोनों स्पष्ट करता है, यद्यपि यूनानी में संबंध को किसी एक संयोजक से निश्चित नहीं किया गया।
- source_word: Χριστὸς
  choice: मसीह
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित पदवी है और अभिषिक्त जन/मसीहा का भाव रखती है। वैकल्पिक लिप्यंतरण ‘ख्रीस्त’ पादटिप्पणी में दिया गया है।
- source_word: ἐγερθεὶς
  choice: जिलाए जाने के बाद
  rationale: यह अनुवाद अओरिस्ट कर्मवाच्य कृदन्त की पूर्ववर्ती क्रिया और कर्मवाच्य—उसे जिलाया गया—दोनों को सुरक्षित रखता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह यूनानी वाक्यांश के ‘मृतकों के बीच से’ वाले अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκέτι
  choice: फिर कभी नहीं / अब ... नहीं
  rationale: दोनों प्रयोगों में समाप्त हो चुकी अवस्था का भाव रखा गया है; पहले वाक्य में ‘फिर कभी नहीं’ अंतिमता को और दूसरे में ‘अब ... नहीं’ वर्तमान प्रभुत्व के अंत को सहज हिन्दी में बताता है।
- source_word: ἀποθνῄσκει
  choice: मरता
  rationale: साधारण वर्तमान काल उस स्थायी वास्तविकता को व्यक्त करता है कि मसीह अब मृत्यु के अधीन नहीं होता।
- source_word: θάνατος
  choice: मृत्यु
  rationale: सीधा अनुवाद पौलुस के मानवीकरण को बनाए रखता है, जिसमें मृत्यु प्रभुत्व रखने वाली शक्ति के रूप में आती है।
- source_word: κυριεύει
  choice: प्रभुत्व ... है
  rationale: ‘प्रभुत्व होना’ अधिकार और शासन की धारणा को गरिमापूर्ण, प्रचलित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पौलुस के कथन में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द पदवी का अर्थ रखता है। ‘मसीह’ हिन्दी में उसी पदवी के लिए स्थापित और अर्थवाही रूप है; ‘ख्रीस्त’ वैकल्पिक पारंपरिक रूप के रूप में पादटिप्पणी में रखा गया है।
- issue: ἐγερθεὶς का कर्मवाच्य
  choice: जिलाए जाने के बाद
  alternative: जी उठने के बाद
  rationale: कर्मवाच्य को बनाए रखने से मूल कथन का रूप सुरक्षित रहता है और यह अनावश्यक रूप से तय नहीं किया जाता कि क्रिया को केवल आत्मक्रियात्मक ढंग से समझा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘जिलाए जाने’ से मूल का कर्मवाच्य और ‘मरे हुओं में से’ से स्रोत-वाक्यांश की सामूहिक धारणा सुरक्षित है। मुख्य पाठ में पादटिप्पणी चिह्न [a] उपस्थित है।
