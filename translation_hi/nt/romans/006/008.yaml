base_translation:
  language: en
  yaml_path: translation/nt/romans/006/008.yaml
  text: If we died with Messiah[a], we believe that we will also live with him.
translation:
  language: hi
  text: पर यदि हम मसीह[a] के साथ मर गए, तो हम विश्वास करते हैं कि हम उसके साथ जिएँगे भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“मसीह” का शाब्दिक अर्थ “अभिषिक्त” है; यूनानी: Χριστῷ (ख्रिस्तो)।'
    reason: पदवी के मूल अर्थ और इस पद में प्रयुक्त यूनानी रूप की शाब्दिक जानकारी।
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: εἰ शर्त प्रस्तुत करता है और δέ पिछले तर्क से हल्का संक्रमण या विरोध दिखाता है; हिंदी में “पर यदि” दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπεθάνομεν
  choice: हम ... मर गए
  rationale: अओरिस्ट निर्देशार्थक क्रिया को यहाँ साधारण भूतकाल में रखा गया है; संदर्भ मसीह के साथ हुई मृत्यु की ओर संकेत करता है।
- source_word: σὺν Χριστῷ
  choice: मसीह के साथ
  rationale: σύν सहभागिता या संगति व्यक्त करता है। Χριστός पदवी है, इसलिए प्रचलित और अर्थपूर्ण हिंदी रूप “मसीह” चुना गया है।
- source_word: πιστεύομεν
  choice: हम विश्वास करते हैं
  rationale: यह πιστεύω का सीधा, वर्तमानकालीन और स्वाभाविक हिंदी अनुवाद है।
- source_word: ὅτι
  choice: कि
  rationale: ὅτι विश्वास की विषय-वस्तु प्रस्तुत करता है, जिसे हिंदी में “कि” स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ συζήσομεν αὐτῷ
  choice: हम उसके साथ जिएँगे भी
  rationale: συζάω साथ जीने का भाव देता है, αὐτῷ उस सहभागिता के व्यक्ति को स्पष्ट करता है, और καί का अनुरूप जोड़ “भी” से व्यक्त होता है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रिस्त / अभिषिक्त जन
  rationale: यहाँ Χριστός पदवी के रूप में प्रयुक्त है। “मसीह” आधुनिक हिंदी में परिचित है और पदवी के भाव को बनाए रखता है; पादटिप्पणी मूल यूनानी और उसके अर्थ को स्पष्ट करती है।
- issue: συζήσομεν αὐτῷ में भावी जीवन का स्वरूप
  choice: हम उसके साथ जिएँगे भी
  alternative: हम उसके साथ फिर जीवित होंगे / उसके पुनरुत्थान के जीवन में सहभागी होंगे
  rationale: मूल कथन साझा भावी जीवन की पुष्टि करता है, पर उसके समय या तंत्र को इस पद में विस्तार से निर्धारित नहीं करता। चुना हुआ रूप उसी व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की शर्तात्मक संरचना और मसीह के साथ मरने तथा उसके साथ जीने की समानांतरता स्पष्ट रखी गई है।
