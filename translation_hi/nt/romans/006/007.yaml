  yaml_path: translation/nt/romans/006/007.yaml
  text: For the one who has died has been acquitted from sin.
translation:
  language: hi
  text: क्योंकि जो मर चुका है, वह पाप से बरी ठहराया गया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाप से धर्मी ठहराया गया है”; संदर्भ के अनुसार, “पाप से मुक्त किया गया है।”
    reason: δικαιόω के न्यायिक अर्थ और इस प्रसंग में उसके मुक्ति-संबंधी परिणाम—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: ὁ ... ἀποθανὼν
  choice: जो मर चुका है
  rationale: लेख के साथ प्रयुक्त भूतकालिक कृदंत यहाँ संज्ञा का काम करता है। यह स्वाभाविक हिन्दी है और किसी विशेष लिंग को अनावश्यक रूप से स्पष्ट नहीं करती।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण देता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: δεδικαίωται
  choice: निर्दोष ठहराया जा चुका है
  rationale: δικαιόω का मूल न्यायिक भाव बनाए रखते हुए यह पूर्णकाल के वर्तमान परिणाम को व्यक्त करता है। संदर्भ में इससे पाप के दावे अथवा अधिकार से छुटकारे का भाव भी निकलता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀπὸ τῆς ἁμαρτίας
  choice: पाप से
  rationale: ἀπό अलगाव या मुक्ति दर्शाता है। ‘पाप से’ स्वाभाविक हिन्दी है और पाप को केवल दोष या केवल शक्ति तक सीमित नहीं करता।
theological_decisions:
- issue: यहाँ δικαιόω को न्यायिक अर्थ में प्रस्तुत किया जाए या मुक्ति के अर्थ में।
  choice: मुख्य पाठ में ‘निर्दोष ठहराया जा चुका है’
  alternative: ‘धर्मी ठहराया जा चुका है’ अथवा संदर्भानुसार ‘पाप से मुक्त हो चुका है’
  rationale: रोमियों 6 में पाप के प्रभुत्व से मुक्ति प्रमुख है, फिर भी पौलुस ने न्यायिक अर्थ वाला δικαιόω प्रयुक्त किया है। मुख्य अनुवाद न्यायिक भाव रखता है और पादटिप्पणी संदर्भगत मुक्ति तथा अधिक पारंपरिक विकल्प—दोनों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘निर्दोष ठहराया’ न्यायालय-संबंधी बिंब को सामान्य पाठक के लिए स्पष्ट रखता है; ‘जा चुका है’ यूनानी पूर्णकाल के बने हुए परिणाम को व्यक्त करता है।
