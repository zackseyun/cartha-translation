id: ROM.6.21
reference: Romans 6:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίνα οὖν καρπὸν εἴχετε τότε ἐφ’ οἷς νῦν ἐπαισχύνεσθε; τὸ γὰρ τέλος ἐκείνων θάνατος·
base_translation:
  language: en
  yaml_path: translation/nt/romans/006/021.yaml
  text: So what fruit did you have then from the things of which you are now ashamed? For the end of those things is death[a].
translation:
  language: hi
  text: तो उस समय तुम्हें उन कामों से क्या फल मिलता था, जिन पर अब तुम्हें लज्जा आती है? क्योंकि उन कामों का अंत मृत्यु है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिणाम।”
    reason: τέλος का प्रसंगानुकूल वैकल्पिक अर्थ बताना।
lexical_decisions:
- source_word: τίνα
  choice: क्या
  rationale: अलंकारिक प्रश्न की सीधी और स्वाभाविक अभिव्यक्ति; यहाँ पूर्व जीवन से मिले फल की प्रकृति पूछी गई है।
- source_word: καρπὸν
  choice: फल
  rationale: पौलुस के रूपक को बनाए रखता है और उसे केवल ‘लाभ’ या ‘परिणाम’ में नहीं बदलता।
- source_word: εἴχετε
  choice: मिलता था
  rationale: अपूर्ण भूतकाल से प्रकट पूर्व की निरंतर स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘फल’ के साथ स्वाभाविक है।
- source_word: τότε
  choice: उस समय
  rationale: νῦν के ‘अब’ के साथ स्पष्ट कालगत विरोध बनाए रखता है।
- source_word: ἐφ’ οἷς
  choice: उन कामों से
  rationale: संदर्भ में पूर्व आचरण निहित है; ‘से’ फल के स्रोत या आधार का अर्थ देता है, जबकि ‘कामों’ से सामान्य पाठक के लिए संकेत स्पष्ट होता है।
- source_word: νῦν
  choice: अब
  rationale: ‘उस समय’ के साथ संक्षिप्त और स्पष्ट विरोध।
- source_word: ἐπαισχύνεσθε
  choice: तुम्हें लज्जा आती है
  rationale: नैतिक गंभीरता को बनाए रखते हुए आधुनिक, गरिमापूर्ण हिन्दी में स्वाभाविक अभिव्यक्ति।
- source_word: τέλος
  choice: अंत
  rationale: चरम परिणति और समाप्ति—दोनों संभावित भावों को खुला रखता है; ‘परिणाम’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐκείνων
  choice: उन कामों का
  rationale: पूर्ववर्ती निहित आचरण की ओर स्पष्ट संकेत करता है और हिन्दी में अस्पष्ट सर्वनाम से बचाता है।
- source_word: θάνατος
  choice: मृत्यु
  rationale: मूल शब्द की गंभीरता और व्यापक धर्मवैचारिक अर्थ को बिना सीमित किए सुरक्षित रखता है।
theological_decisions:
- issue: τέλος को ‘अंत’ या व्याख्यात्मक रूप से ‘परिणाम’ कहना
  choice: अंत
  alternative: परिणाम
  rationale: ‘अंत’ पूर्व जीवन-पद्धति की अंतिम परिणति तथा उसके नतीजे, दोनों के लिए स्थान रखता है; पाठ की धर्मवैचारिक व्यापकता को चुपचाप सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में संदर्भानुसार अनौपचारिक बहुवचन ‘तुम’; भाषा सहज किन्तु गरिमापूर्ण है। ‘फल’ का मूल रूपक और ‘अंत’ की अर्थगत व्यापकता सुरक्षित रखी गई है।
