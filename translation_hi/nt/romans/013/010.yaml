base_translation:
  language: en
  yaml_path: translation/nt/romans/013/010.yaml
  text: Love does no harm to a neighbor[b][a]; therefore love is the fulfillment of the law.
translation:
  language: hi
  text: प्रेम पड़ोसी को कोई हानि नहीं पहुँचाता[a]; इसलिए प्रेम व्यवस्था की पूर्ति है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रेम पड़ोसी के विरुद्ध कोई बुराई नहीं करता।”
    reason: lexical_alternative
  - marker: b
    text: या, “प्रेम व्यवस्था की परिपूर्णता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγάπη
  choice: प्रेम
  rationale: आधुनिक हिन्दी में यह स्वाभाविक और व्यापक समतुल्य है तथा पद में दोनों बार आए यूनानी शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: τῷ πλησίον
  choice: पड़ोसी को
  rationale: सम्प्रदान कारक उस व्यक्ति को दर्शाता है जो किए गए काम से प्रभावित होता है; ‘पड़ोसी’ यहाँ सामान्य नैतिक अर्थ में है।
- source_word: κακὸν οὐκ ἐργάζεται
  choice: कोई हानि नहीं पहुँचाता
  rationale: संदर्भ में यह पदबंध किसी दूसरे के साथ बुराई या अहित करने का अर्थ देता है। यह हिन्दी में स्वाभाविक है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πλήρωμα
  choice: पूर्ति
  rationale: यह उस बात को व्यक्त करता है जो व्यवस्था को उसके अभिप्रेत लक्ष्य तक पहुँचाती है। ‘पूर्ति’ संज्ञात्मक यूनानी वाक्य-विन्यास को भी बनाए रखती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पहले कथन से निकाले गए निष्कर्ष को स्पष्ट रूप से व्यक्त करता है।
- source_word: νόμου
  choice: व्यवस्था की
  rationale: संदर्भ में νόμος पहचान योग्य परमेश्वर की व्यवस्था की ओर संकेत करता है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रचलित है।
theological_decisions:
- issue: प्रेम और व्यवस्था का संबंध
  choice: प्रेम व्यवस्था की पूर्ति है
  alternative: प्रेम व्यवस्था को पूरा करता है; प्रेम व्यवस्था की परिपूर्णता है
  rationale: यूनानी पाठ संज्ञात्मक कथन है। ‘पूर्ति है’ उसी संरचना और पौलुस के दावे को बनाए रखता है, बिना इस संबंध की कार्यविधि को आवश्यकता से अधिक समझाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हानि नहीं पहुँचाता’ सामान्य पाठक के लिए स्वाभाविक है; अधिक शाब्दिक ‘बुराई नहीं करता’ पादटिप्पणी में दिया गया है।
