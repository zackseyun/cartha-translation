  text: ὡς ἐν ἡμέρᾳ εὐσχημόνως περιπατήσωμεν, μὴ κώμοις καὶ μέθαις, μὴ κοίταις καὶ ἀσελγείαις, μὴ ἔριδι καὶ ζήλῳ,
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/013.yaml
  text: Let us walk properly as in the daytime[a], not in revelries and drunkenness, not in sexual immorality and sensuality[b], not in strife and jealousy.
translation:
  language: hi
  text: हम जैसे दिन में, वैसे ही शालीनता से चलें[a]—न रंगरेलियों और मतवालेपन में, न अनैतिक यौन-संबंधों और उच्छृंखलता में, न झगड़े और ईर्ष्या[b] में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मर्यादापूर्वक।”
    reason: εὐσχημόνως के लिए निकट lexical_alternative; “शालीनता से” का एक स्वाभाविक आधुनिक हिन्दी विकल्प।
  - marker: b
    text: या, “जलन”; यूनानी शब्द यहाँ दुर्गुणों की सूची में नकारात्मक अर्थ रखता है।
    reason: ζήλῳ के लिए lexical_alternative; इस संदर्भ में सकारात्मक ‘उत्साह/जोश’ अर्थ अभिप्रेत नहीं है।
lexical_decisions:
- source_word: ὡς ἐν ἡμέρᾳ
  choice: दिन के समान
  rationale: यह आसपास के संदर्भ में दिन और रात के रूपकात्मक विरोध को बनाए रखता है और व्यवहार को दिन के उजाले के अनुरूप बताता है।
- source_word: εὐσχημόνως
  choice: शालीनता से
  rationale: यह सम्मानजनक, मर्यादित और उचित आचरण का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: περιπατήσωμεν
  choice: हम ... चलें
  rationale: यह प्रेरित पौलुस के जीवन-चाल संबंधी रूपक और प्रोत्साहनसूचक बहुवचन—दोनों को सुरक्षित रखता है।
- source_word: κώμοις
  choice: रंगरेलियों
  rationale: यह मदिरापान से जुड़ी उच्छृंखल दावतों और मौज-मस्ती को दर्शाता है, पर आधुनिक अर्थ में इसे केवल यौन कुकर्म तक सीमित नहीं करता।
- source_word: μέθαις
  choice: मतवालेपन
  rationale: यह नशे और मदहोशी की दशा को सामान्य, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: κοίταις
  choice: अनैतिक यौन-संबंधों
  rationale: शाब्दिक अर्थ ‘बिस्तरों’ के बजाय यूनानी मुहावरे का स्पष्ट यौन और नैतिक आशय व्यक्त किया गया है।
- source_word: ἀσελγείαις
  choice: अश्लील आचरण
  rationale: यह निर्लज्ज, बेलगाम और प्रायः यौन रूप से उच्छृंखल व्यवहार का व्यापक भाव रखता है।
- source_word: ἔριδι
  choice: झगड़े
  rationale: यह कलह और विवादपूर्ण वैमनस्य को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ζήλῳ
  choice: ईर्ष्या
  rationale: दुर्गुणों की इस सूची में शब्द का नकारात्मक भाव है; ‘ईर्ष्या’ स्वाभाविक है, जबकि ‘जलन’ भी संभव है।
theological_decisions:
- issue: नैतिक उपदेश में दिन और अंधकार का रूपकात्मक विरोध
  choice: ‘दिन के समान’ कहकर रूपक को यथावत रखा गया है।
  alternative: ‘मानो दिन हो’ या व्याख्यात्मक रूप से ‘उजाले में रहनेवालों के समान’
  rationale: मूल पद दिन के बिंब द्वारा उचित आचरण की बात करता है; अनुवाद को इस बिंब को किसी अधिक विकसित धर्मवैज्ञानिक कथन में नहीं बदलना चाहिए।
- issue: κοίταις में निहित यौन मुहावरा
  choice: ‘अनैतिक यौन-संबंधों’ द्वारा भावानुवाद
  alternative: शाब्दिक ‘बिस्तरों’
  rationale: ‘बिस्तरों’ से आधुनिक हिन्दी पाठक के लिए आशय अस्पष्ट रहता; चुना गया रूप मूल के स्पष्ट अनैतिक यौन संकेत को संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। दुर्गुणों की तीन जोड़ी वाली यूनानी संरचना को ‘न... न... न...’ से सुरक्षित रखा गया है; ‘चलें’ पौलुस के प्रचलित जीवन-मार्ग रूपक को बनाए रखता है।
