id: ROM.13.9
reference: Romans 13:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ γάρ· Οὐ μοιχεύσεις, Οὐ φονεύσεις, Οὐ κλέψεις, Οὐκ ἐπιθυμήσεις, καὶ εἴ τις ἑτέρα ἐντολή, ἐν ⸂τῷ λόγῳ τούτῳ⸃ ἀνακεφαλαιοῦται, ⸂ἐν τῷ⸃· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/009.yaml
  text: 'For this: “You shall not commit adultery[a], you shall not murder, you shall not steal, you shall not covet,” and if there is any other commandment[b], it is summed up in this word: “You shall love your neighbor as yourself.”'
translation:
  language: hi
  text: 'क्योंकि, “व्यभिचार न करना, हत्या न करना,[a] चोरी न करना, लालच न करना,” और यदि कोई दूसरी आज्ञा हो, तो इन सबका सार इस वचन[b] में समाहित है: “अपने पड़ोसी से अपने समान प्रेम करना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी क्रिया का अर्थ सामान्य रूप से ‘मारना’ नहीं, बल्कि ‘हत्या करना’ है।
    reason: lexical_alternative
  - marker: b
    text: या “इस कथन में।” यूनानी शब्द का अर्थ प्रसंग के अनुसार “वचन,” “कथन” या “उक्ति” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ γάρ
  choice: क्योंकि ये आज्ञाएँ हैं
  rationale: τὸ γάρ आगे उद्धृत आज्ञाओं की विषयवस्तु प्रस्तुत करता है। हिन्दी में यह रूप यूनानी के व्याख्यात्मक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μοιχεύσεις
  choice: व्यभिचार न करना
  rationale: भविष्यत्कालीन रूप यहाँ दस आज्ञाओं के उद्धरण में निषेधात्मक आज्ञा का कार्य करता है; हिन्दी का क्रियार्थक निषेध शास्त्रीय स्वर और स्पष्टता दोनों बनाए रखता है।
- source_word: φονεύσεις
  choice: हत्या न करना
  rationale: φονεύω सामान्य रूप से हर प्रकार के प्राण लेने के बजाय हत्या को सूचित करता है; इसलिए ‘हत्या’ अधिक सटीक है।
- source_word: κλέψεις
  choice: चोरी न करना
  rationale: यह दस आज्ञाओं के उद्धरण की निषेधात्मक आज्ञा है; ‘चोरी न करना’ स्वाभाविक और अर्थ-सटीक हिन्दी है।
- source_word: ἐπιθυμήσεις
  choice: लालच न करना
  rationale: दस आज्ञाओं के संदर्भ में ἐπιθυμέω किसी दूसरे की वस्तु पाने की अनुचित लालसा को व्यक्त करता है; ‘लालच’ सामान्य ‘इच्छा’ से अधिक संदर्भानुकूल है।
- source_word: εἴ τις ἑτέρα ἐντολή
  choice: यदि कोई दूसरी आज्ञा हो
  rationale: यह सूची से परे किसी भी अन्य आज्ञा को अनिश्चित और व्यापक रूप से शामिल करता है।
- source_word: ἀνακεφαλαιοῦται
  choice: समा जाती है
  rationale: क्रिया का अर्थ अनेक बातों को एक सार या शीर्षक के अंतर्गत समेटना है। ‘इस बात में समा जाती है’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐν τῷ λόγῳ τούτῳ
  choice: इस बात में
  rationale: λόγος यहाँ किसी एक शब्द के बजाय आगे दिए गए कथन या सूत्र को दर्शाता है। ‘बात’ हिन्दी में इस अर्थ को सहजता से व्यक्त करती है।
- source_word: Ἀγαπήσεις
  choice: प्रेम रखना
  rationale: यह लैव्यव्यवस्था के उद्धरण में आज्ञार्थक भविष्यत्काल है। ‘प्रेम रखना’ उद्धरण की औपचारिक आज्ञात्मक शैली को सुरक्षित रखता है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: उद्धृत आज्ञा में πλησίον का पारंपरिक और सटीक अर्थ ‘पड़ोसी’ है, जो मूल शास्त्रीय संबंध भी बनाए रखता है।
- source_word: ὡς σεαυτόν
  choice: अपने समान
  rationale: यह संक्षिप्त प्रतिवर्ती तुलना को बिना अनावश्यक व्याख्यात्मक विस्तार के व्यक्त करता है।
theological_decisions:
- issue: दस आज्ञाओं के निषेधों का आज्ञात्मक रूप
  choice: ‘व्यभिचार न करना’ जैसे औपचारिक निषेध
  alternative: ‘व्यभिचार मत करो’ जैसे सीधे आज्ञार्थक रूप
  rationale: यूनानी पाठ शास्त्रीय भविष्यत्कालीन आज्ञा-शैली को उद्धृत करता है। हिन्दी का क्रियार्थक रूप उस विधिक और उद्धरणात्मक स्वर को स्वाभाविक ढंग से बनाए रखता है।
- issue: ἐν τῷ λόγῳ τούτῳ में λόγος का आशय
  choice: ‘इस बात’ अर्थात सार प्रस्तुत करने वाला कथन
  alternative: ‘इस वचन’ या ‘इस उक्ति’
  rationale: यहाँ आशय किसी अकेले शब्द से नहीं, बल्कि इसके बाद आने वाले संपूर्ण शास्त्रीय कथन से है। ‘बात’ इस व्यापकता को स्पष्ट रखती है और किसी अतिरिक्त धर्मवैज्ञानिक अर्थ को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और उद्धरणानुकूल रूप अपनाया गया है। आज्ञाओं में समानांतर क्रियार्थक संरचना रखी गई है, ताकि सूची का विधिक स्वर और लय सुरक्षित रहें।
