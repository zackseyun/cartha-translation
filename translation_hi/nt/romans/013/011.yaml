source:
  edition: SBLGNT
  text: Καὶ τοῦτο εἰδότες τὸν καιρόν, ὅτι ὥρα ⸂ἤδη ὑμᾶς⸃ ἐξ ὕπνου ἐγερθῆναι, νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία ἢ ὅτε ἐπιστεύσαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/011.yaml
  text: And do this[a], knowing the time, that it is already the hour for you to awaken from sleep[b], for now our salvation is nearer than when we believed.
translation:
  language: hi
  text: और यह भी करो, क्योंकि तुम समय को पहचानते हो कि तुम्हारे लिए[a] नींद से जाग उठने की घड़ी पहले ही आ चुकी है; क्योंकि अब हमारा उद्धार उस समय की अपेक्षा अधिक निकट है, जब हमने विश्वास किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में ‘तुम्हारे लिए’ के स्थान पर ‘हमारे लिए’ है।
    reason: textual_variant
lexical_decisions:
- source_word: Καὶ τοῦτο
  choice: और यह भी करो
  rationale: τοῦτο पिछले पदों के नैतिक आग्रहों की ओर संकेत करता है। हिन्दी में केवल ‘और यह’ अधूरा लगेगा; ‘यह भी करो’ प्रसंग में निहित क्रियात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰδότες τὸν καιρόν
  choice: क्योंकि तुम इस समय को जानते हो
  rationale: कृदन्त εἰδότες में यहाँ कारणसूचक भाव है। καιρός साधारण कालक्रम नहीं, बल्कि निर्णायक वर्तमान अवसर को सूचित करता है; ‘इस समय’ उसे प्रसंग से जोड़ता है।
- source_word: ὅτι ὥρα ἤδη ὑμᾶς
  choice: कि तुम्हारे लिए ... घड़ी पहले ही आ चुकी है
  rationale: ‘घड़ी’ ὥρα की संज्ञात्मक और तात्कालिक शक्ति बनाए रखती है। ‘पहले ही आ चुकी है’ हिन्दी में ἤδη और वर्तमान निर्णायक घड़ी को सहज ढंग से व्यक्त करता है।
- source_word: ἐξ ὕπνου ἐγερθῆναι
  choice: नींद से जाग उठने
  rationale: यह अनुवाद नींद के रूपक को अक्षुण्ण रखता है और ἐγερθῆναι में निहित उठने/जागने के भाव को आधुनिक हिन्दी में स्वाभाविक रूप देता है।
- source_word: νῦν γὰρ ἐγγύτερον ἡμῶν ἡ σωτηρία
  choice: क्योंकि अब हमारा उद्धार ... अधिक निकट है
  rationale: γάρ कारण बताता है, νῦν वर्तमान क्षण पर बल देता है, और ἐγγύτερον तुलनात्मक निकटता व्यक्त करता है। ‘हमारा उद्धार’ भविष्य की ओर बढ़ते उद्धार को बिना संकीर्ण व्याख्या के रखता है।
- source_word: ἢ ὅτε ἐπιστεύσαμεν
  choice: उस समय की अपेक्षा ... जब हमने विश्वास किया था
  rationale: यूनानी पाठ केवल ‘जब हमने विश्वास किया’ कहता है। ‘पहली बार’ या ‘विश्वास में आए’ जैसी व्याख्यात्मक वृद्धि से बचते हुए हिन्दी में तुलना स्पष्ट की गई है।
theological_decisions:
- issue: विश्वासियों का उद्धार अभी ‘अधिक निकट’ होना
  choice: ‘हमारा उद्धार’ को बिना किसी अतिरिक्त doctrinal qualification के रखा गया
  alternative: ‘हमारा अंतिम उद्धार’ अथवा ‘प्रभु के आगमन पर हमारा छुटकारा’
  rationale: पाठ उद्धार को विश्वासियों से वर्तमान रूप में जोड़ता है, फिर भी उसे निकट आता हुआ बताता है। अनुवाद इस पहले से/अभी नहीं के तनाव को किसी एक धर्मवैज्ञानिक चरण में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘घड़ी’, ‘जाग उठने’ और ‘अधिक निकट’ मूल की तात्कालिकता और रूपक बनाए रखते हैं। अंग्रेज़ी परत का दूसरा फुटनोट वास्तव में ‘when we believed’ से संबंधित था; हिन्दी मुख्य पाठ मूल की सादगी बनाए रखता है, इसलिए उस lexical alternative के लिए अलग फुटनोट आवश्यक नहीं समझा गया।
