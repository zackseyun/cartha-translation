base_translation:
  language: en
  yaml_path: translation/nt/romans/013/005.yaml
  text: Therefore it is necessary to submit[a], not only because of wrath but also because of conscience[b],
translation:
  language: hi
  text: इसलिए अधीन रहना[b] आवश्यक है—न केवल क्रोध के कारण[a], बल्कि विवेक के कारण भी।
  philosophy: optimal-equivalence
  footnotes:
