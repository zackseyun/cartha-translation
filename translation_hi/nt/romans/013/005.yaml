    text: या “दंड के भय से”; यूनानी में शाब्दिक रूप से “क्रोध के कारण” है। इसका संकेत शासक की दंडात्मक कार्रवाई की ओर, या अधिक व्यापक रूप से नागरिक सत्ता के माध्यम से कार्य करने वाले परमेश्वर के क्रोध की ओर हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “अधीन होना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्ष निकालने वाला संयोजक है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक रूप से उसका तार्किक बल बनाए रखता है।
- source_word: ἀνάγκη
  choice: आवश्यक है
  rationale: यह निर्वैयक्तिक रूप से आवश्यकता व्यक्त करता है; यह मूल की अनिवार्यता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ὑποτάσσεσθαι
  choice: अधीन रहना
  rationale: शासकीय अधिकारियों के संबंध में अपेक्षित स्थिति को व्यक्त करता है। ‘अधीन रहना’ हिन्दी में स्वाभाविक है और इसे पूर्ण या निरपेक्ष आज्ञापालन के अर्थ तक नहीं बढ़ाता।
- source_word: οὐ μόνον … ἀλλὰ καὶ
  choice: न केवल … बल्कि … भी
  rationale: मूल यूनानी के सहसंबंधी विरोध-जोड़ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τὴν ὀργὴν
  choice: प्रकोप के कारण
  rationale: διά के कारणसूचक अर्थ और ὀργή के मूल भाव को सुरक्षित रखता है। ‘प्रकोप’ यह खुला छोड़ता है कि आशय शासक की दंडात्मक कार्रवाई है या नागरिक सत्ता के माध्यम से प्रकट परमेश्वर का प्रकोप।
- source_word: διὰ τὴν συνείδησιν
  choice: विवेक के कारण
  rationale: διά के कारण अथवा प्रेरणा के भाव को और συνείδησις की आंतरिक नैतिक चेतना को संक्षेप व स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ὀργή का संदर्भ
  choice: ‘प्रकोप’ कहकर संदर्भ को अनिर्धारित रखा गया है।
  alternative: ‘दंड के भय से’, ‘शासक के प्रकोप के कारण’, या ‘परमेश्वर के प्रकोप के कारण’।
  rationale: निकटवर्ती संदर्भ में शासक की दंडात्मक भूमिका और परमेश्वर द्वारा स्थापित व्यवस्था—दोनों उपस्थित हैं, पर इस पद में यूनानी पाठ प्रकोप के कर्ता को स्पष्ट नहीं करता।
- issue: ὑποτάσσεσθαι का बल
  choice: अधीन रहना
  alternative: अपने आपको अधीन करना; समर्पित होना; आज्ञा मानना।
  rationale: यह अधिकारियों के प्रति अपेक्षित अधीन स्थिति को व्यक्त करता है, लेकिन पाठ से आगे जाकर निरपेक्ष आज्ञापालन का सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘अधीन रहना’ और ‘विवेक’ प्रचलित बाइबलीय शब्दावली से मेल खाते हैं; ‘प्रकोप’ मूल की अस्पष्टता और धार्मिक तनाव को सुरक्षित रखता है।
