id: ROM.13.7
reference: Romans 13:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀπόδοτε πᾶσι τὰς ὀφειλάς, τῷ τὸν φόρον τὸν φόρον, τῷ τὸ τέλος τὸ τέλος, τῷ τὸν φόβον τὸν φόβον, τῷ τὴν τιμὴν τὴν τιμήν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/007.yaml
  text: 'Pay to all what is owed: to the one due tax, tax; to the one due revenue, revenue; to the one due fear, fear; to the one due honor, honor.'
translation:
  language: hi
  text: 'सबको जो देय है, वह चुका दो: जिसे कर देय है, उसे कर; जिसे शुल्क देय है, उसे शुल्क; जिसके प्रति भय रखना हो, उसके प्रति भय; और जिसका सम्मान करना हो, उसका सम्मान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδοτε
  choice: चुकाओ
  rationale: क्रिया का अर्थ किसी का देय उसे लौटा देना या अदा करना है; ‘चुकाओ’ बकाया और दायित्व दोनों के संदर्भ में स्वाभाविक है।
- source_word: ὀφειλάς
  choice: जो कुछ बकाया है
  rationale: यहाँ संज्ञा विभिन्न प्रकार के देय दायित्वों को समेटती है; यह वाक्यांश आर्थिक और सामाजिक दोनों दायित्वों के लिए पर्याप्त व्यापक है।
- source_word: φόρον
  choice: कर
  rationale: यह प्रत्यक्ष कर या अधीन प्रजा से वसूले जाने वाले कर को सूचित करता है; आधुनिक हिन्दी में ‘कर’ इसका स्पष्ट सामान्य समतुल्य है।
- source_word: τέλος
  choice: शुल्क
  rationale: φόρος से भेद बनाए रखते हुए यह सीमा-शुल्क, चुंगी या अन्य अप्रत्यक्ष सरकारी देय को व्यक्त करता है; ‘शुल्क’ आधुनिक पाठक के लिए व्यापक और स्वाभाविक है।
- source_word: φόβον
  choice: भय
  rationale: मूल शब्द स्पष्टतः ‘भय’ है। ‘आदर’ या केवल ‘सम्मान’ करने से मूल की तीव्रता और पद 3–4 में शासकीय दंड के संदर्भ की प्रतिध्वनि घट जाएगी।
- source_word: τιμήν
  choice: सम्मान
  rationale: यह मान-सम्मान या प्रतिष्ठा देने को दर्शाता है और φόβος से स्पष्ट भेद रखता है।
theological_decisions:
- issue: φόβος को ‘भय’ या ‘आदर’ के रूप में प्रस्तुत करना
  choice: भय
  alternative: आदर / श्रद्धापूर्ण आदर
  rationale: शाब्दिक अर्थ और निकट संदर्भ में अधिकारी से डरने की भाषा को सुरक्षित रखा गया है। अनुवाद यह अतिरिक्त निर्णय नहीं करता कि यह भय हर स्थिति में केवल श्रद्धा है या दंड का वास्तविक डर।
- issue: ‘सबका’ के दायरे को सीमित करना
  choice: मूल की व्यापकता बनाए रखना
  alternative: केवल सरकारी अधिकारियों को देय चुकाने के रूप में स्पष्ट करना
  rationale: पद का निकट संदर्भ शासन से जुड़ा है, पर πᾶσι स्वयं व्यापक है और अंतिम दो दायित्व सामाजिक रूप से भी लागू हो सकते हैं; इसलिए अनुवाद ने दायरा चुपचाप संकीर्ण नहीं किया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सुबोध शैली। मूल की समानांतर पुनरावृत्ति को हिन्दी में स्वाभाविक संबंधवाचक संरचना द्वारा रखा गया है; ‘कर’ और ‘शुल्क’ का भेद तथा ‘भय’ और ‘सम्मान’ का तनाव सुरक्षित है।
