source:
  edition: SBLGNT
  text: Μηδενὶ μηδὲν ὀφείλετε, εἰ μὴ τὸ ⸂ἀλλήλους ἀγαπᾶν⸃· ὁ γὰρ ἀγαπῶν τὸν ἕτερον νόμον πεπλήρωκεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/008.yaml
  text: Owe no one anything[a], except to love one another; for the one who loves another has fulfilled the law.
translation:
  language: hi
  text: किसी के भी किसी बात के ऋणी न रहो, सिवाय एक-दूसरे से प्रेम करने के; क्योंकि जो दूसरे[a] से प्रेम करता है, उसने व्यवस्था को पूरा किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “दूसरे व्यक्ति से।” यूनानी: “दूसरे से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Μηδενὶ μηδὲν ὀφείλετε
  choice: किसी के भी कुछ ऋणी न रहो
  rationale: यह व्यापक निषेध ‘किसी के प्रति कुछ भी बकाया न रखो’ का भाव देता है। ‘ऋणी न रहो’ आर्थिक ऋण और व्यापक दायित्व—दोनों की संभावित अर्थ-छाया बनाए रखता है।
- source_word: εἰ μὴ τὸ ἀλλήλους ἀγαπᾶν
  choice: सिवाय इसके कि एक-दूसरे से प्रेम करो
  rationale: यह प्रेम को एकमात्र निरंतर दायित्व के रूप में प्रस्तुत करता है और हिन्दी में स्वाभाविक है।
- source_word: ὁ γὰρ ἀγαπῶν
  choice: क्योंकि जो ... प्रेम करता है
  rationale: संज्ञात्मक कृदंत के प्रतिनिधिक एकवचन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἕτερον
  choice: दूसरे व्यक्ति से
  rationale: ग्रीक का शाब्दिक भाव ‘दूसरे’ है। ‘दूसरे व्यक्ति’ हिन्दी में स्पष्ट है और इस पद में अनुपस्थित ‘पड़ोसी’ को आयात नहीं करता।
- source_word: νόμον πεπλήρωκεν
  choice: व्यवस्था को पूरा किया है
  rationale: ‘व्यवस्था’ νόμος के बाइबिलीय संदर्भ को व्यक्त करती है, और पूर्णकालिक πεπλήρωκεν के पूर्ण कार्य तथा वर्तमान परिणाम को ‘पूरा किया है’ बनाए रखता है।
theological_decisions:
- issue: ऋण के निषेध का दायरा
  choice: कथन को ऋणी न रहने के सीधे निषेध के रूप में रखा गया है, पर इसे हर प्रकार के उधार पर पूर्ण प्रतिबंध के रूप में विस्तृत नहीं किया गया।
  alternative: इसे समस्त आर्थिक उधार का पूर्ण निषेध मानना, या केवल नैतिक दायित्व का रूपक मानना।
  rationale: ग्रीक पाठ ऋण/दायित्व की भाषा का प्रयोग करता है और प्रेम को अपवाद बनाता है; अनुवाद को इससे आगे जाकर नैतिक विवाद का निर्णय नहीं करना चाहिए।
- issue: व्यवस्था की पूर्ति
  choice: ‘व्यवस्था को पूरा किया है’ कहकर पौलुस के कथन का बल बनाए रखा गया है।
  alternative: ‘व्यवस्था का पूरी तरह पालन किया है’ कहना।
  rationale: ‘पालन’ व्याख्यात्मक रूप से अर्थ को संकुचित कर सकता है, जबकि ‘पूरा किया है’ πληρόω की व्यापक और धर्मवैचारिक अर्थ-छाया सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ‘ऋणी’ और ‘व्यवस्था’ जैसे स्थापित बाइबिलीय शब्द संदर्भ की गंभीरता तथा मूल की अर्थ-छाया बनाए रखते हैं।
