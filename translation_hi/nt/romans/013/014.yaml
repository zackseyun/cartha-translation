id: ROM.13.14
reference: Romans 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ ἐνδύσασθε τὸν κύριον Ἰησοῦν Χριστόν, καὶ τῆς σαρκὸς πρόνοιαν μὴ ποιεῖσθε εἰς ἐπιθυμίας.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/014.yaml
  text: But put on the Lord Jesus the Messiah[a], and make no provision for the flesh, for its desires.
translation:
  language: hi
  text: बल्कि प्रभु यीशु मसीह को पहन लो, और शरीर[a] की अभिलाषाएँ पूरी करने का कोई प्रबंध न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पापी स्वभाव।’ यूनानी में ‘शरीर’ है, जिसे पौलुस प्रायः परमेश्वर द्वारा निर्देशित जीवन के विपरीत पतित मानवीय प्रवृत्तियों के लिए प्रयोग करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνδύσασθε
  choice: पहन लो
  rationale: मध्यवाच्य आज्ञार्थक क्रिया वस्त्र पहनने के रूपक द्वारा किसी पहचान और जीवन-पद्धति को अपनाने का भाव देती है। ‘पहन लो’ स्वाभाविक हिंदी में इस रूपक को बनाए रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: यहाँ κύριος यीशु की उपाधि है; ‘प्रभु’ उसके धार्मिक और मसीही महत्व को बनाए रखता है।
- source_word: Χριστόν
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि है। हिंदी में ‘यीशु मसीह’ स्वाभाविक और व्यापक रूप से समझा जाने वाला रूप है।
- source_word: πρόνοιαν μὴ ποιεῖσθε
  choice: कोई प्रबंध न करो
  rationale: πρόνοια और ποιεῖσθε मिलकर पहले से योजना बनाने या साधन जुटाने का भाव देते हैं; ‘कोई प्रबंध न करो’ इसे स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: σαρκὸς
  choice: शरीर
  rationale: शाब्दिक शब्दावली और पौलुस के रूपकगत तनाव को बनाए रखने के लिए ‘शरीर’ रखा गया है; संदर्भ में इसका अर्थ केवल भौतिक देह तक सीमित नहीं है, इसलिए व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: εἰς ἐπιθυμίας
  choice: की अभिलाषाएँ पूरी करने का
  rationale: εἰς यहाँ उद्देश्य या परिणति बताता है। यह हिंदी रूप उस संबंध को स्वाभाविक ढंग से स्पष्ट करता है, बिना ‘अभिलाषाओं’ की नैतिक प्रकृति को अलग शब्द जोड़कर अधिक निर्धारित किए।
theological_decisions:
- issue: नैतिक संदर्भ में σάρξ का अर्थ
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: संदर्भ विकृत मानवीय अभिलाषाओं की ओर संकेत करता है, पर मुख्य पाठ में ‘पापी स्वभाव’ रखने से पौलुस का देह-संबंधी रूपक एक निश्चित मानवशास्त्रीय व्याख्या में सीमित हो सकता है। इसलिए ‘शरीर’ रखा गया और विकल्प पादटिप्पणी में बताया गया।
- issue: Χριστός का उपाधि-संबंधी अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ शब्द अभिषिक्त उद्धारकर्ता की उपाधि का भार रखता है। ‘मसीह’ आधुनिक हिंदी के सामान्य बाइबलीय प्रयोग में अर्थपूर्ण और स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहन लो’ मूल के वस्त्र-रूपक को सीधे बनाए रखता है, जबकि अंतिम वाक्यांश को स्वाभाविक हिंदी उद्देश्य-वाक्य के रूप में व्यक्त किया गया है।
