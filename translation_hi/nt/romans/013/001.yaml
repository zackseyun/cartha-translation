source:
  edition: SBLGNT
  text: Πᾶσα ψυχὴ ἐξουσίαις ὑπερεχούσαις ὑποτασσέσθω, οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ, αἱ δὲ ⸀οὖσαι ⸀ὑπὸ θεοῦ τεταγμέναι εἰσίν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/001.yaml
  text: Let every person be subject to the governing authorities[a], for there is no authority except from God[b], and those that exist have been appointed by God.
translation:
  language: hi
  text: हर व्यक्ति शासन करनेवाले अधिकारियों[a] के अधीन रहे, क्योंकि कोई भी अधिकार परमेश्वर की ओर से ही होता है, और जो अधिकार विद्यमान हैं, वे परमेश्वर द्वारा स्थापित किए गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊँचे पद के अधिकारी” अथवा “श्रेष्ठ अधिकारी।”
    reason: lexical_alternative
  - marker: b
    text: या “नियुक्त किए गए हैं,” “ठहराए गए हैं” अथवा “व्यवस्थित किए गए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶσα ψυχὴ
  choice: हर व्यक्ति
  rationale: शाब्दिक अर्थ ‘हर प्राण’ है, पर कोईने यूनानी में यह प्रत्येक मनुष्य के लिए स्वाभाविक मुहावरा है। ‘हर व्यक्ति’ वितरणात्मक बल को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξουσίαις ὑπερεχούσαις
  choice: शासन करनेवाले अधिकारियों
  rationale: ἐξουσίαις अधिकार रखनेवालों को और ὑπερεχούσαις उनके ऊपर/श्रेष्ठ स्थान को दर्शाता है। नागरिक संदर्भ में यह पदबंध उनके शासकीय कार्य को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ὑποτασσέσθω
  choice: के अधीन रहे
  rationale: वर्तमान आज्ञार्थक का भाव एक व्यवस्थित अधीनता में बने रहने का है। यह अनावश्यक रूप से पूर्ण नैतिक सहमति या हर आदेश के अंध पालन का अर्थ नहीं जोड़ता।
- source_word: οὐ γὰρ ἔστιν ἐξουσία εἰ μὴ ὑπὸ θεοῦ
  choice: क्योंकि परमेश्वर से अलग कोई अधिकार नहीं है
  rationale: यह अधिकार के अंतिम स्रोत को परमेश्वर में रखता है। ‘से अलग’ εἰ μὴ को स्वाभाविक हिन्दी में व्यक्त करता है और ὑπὸ θεοῦ के स्रोत/कर्ता संबंध को खुला रखता है।
- source_word: αἱ δὲ οὖσαι
  choice: और जो अधिकारी अस्तित्व में हैं
  rationale: स्त्रीलिंग बहुवचन कृदंत पहले आए ἐξουσίαις की ओर लौटता है। हिन्दी में ‘अधिकारी’ दोहराने से संदर्भ अस्पष्ट नहीं रहता।
- source_word: τεταγμέναι
  choice: नियुक्त किए गए हैं
  rationale: τάσσω का पूर्णकालिक कर्मवाच्य रूप परमेश्वर द्वारा क्रम में रखे या ठहराए जाने के फलस्वरूप वर्तमान स्थिति बताता है। ‘नियुक्त’ आधुनिक हिन्दी में स्पष्ट है; अन्य संभव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: नागरिक अधिकार और परमेश्वर के विषय में पौलुस के कथन का दायरा
  choice: पद को इस प्रकार रखा गया है कि वास्तविक शासकीय अधिकारियों का अधिकार परमेश्वर से आता है और उनका अस्तित्व परमेश्वर की व्यवस्था के अधीन है।
  alternative: इसे हर शासन और उसके हर कार्य पर परमेश्वर की नैतिक स्वीकृति मानना; अथवा इसे केवल अमूर्त ‘अधिकार के सिद्धांत’ तक सीमित करना।
  rationale: यूनानी पाठ वास्तविक अधिकारियों की बात करता है और कहता है कि अस्तित्व में रहनेवाले परमेश्वर द्वारा τεταγμέναι हैं। अनुवाद इस दृढ़ कथन को बनाए रखता है, पर हर शासकीय कार्य की नैतिक स्वीकृति जैसी अतिरिक्त धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘अधीन रहे’ आज्ञा का सतत भाव रखता है। मुख्य पाठ में ‘शासन करनेवाले अधिकारी’ नागरिक संदर्भ स्पष्ट करता है, जबकि अधिक शाब्दिक संभावनाएँ पादटिप्पणियों में सुरक्षित हैं।
