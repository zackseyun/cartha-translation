id: ROM.13.12
reference: Romans 13:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ νὺξ προέκοψεν, ἡ δὲ ἡμέρα ἤγγικεν. ⸀ἀποβαλώμεθα οὖν τὰ ἔργα τοῦ σκότους, ⸂ἐνδυσώμεθα δὲ⸃ τὰ ὅπλα τοῦ φωτός.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/012.yaml
  text: The night is far gone[a]; the day has drawn near[b]. Therefore let us cast off the works of darkness and put on the armor of light.
translation:
  language: hi
  text: रात बहुत बीत चुकी है[a], और दिन निकट आ गया है। इसलिए आओ, हम अंधकार के कामों को उतार फेंकें और प्रकाश का कवच धारण करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रात आगे बढ़ चुकी है।” यूनानी क्रिया रात के आगे बढ़ने, अर्थात उसके काफी बीत चुकने, की छवि प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रकाश के हथियार धारण करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νὺξ
  choice: रात
  rationale: ‘दिन’ के साथ मूल समय-संबंधी रूपक और उसके निहित नैतिक अर्थ को बनाए रखता है।
- source_word: προέκοψεν
  choice: बहुत बीत चुकी है
  rationale: क्रिया का मूल भाव आगे बढ़ने का है; समय के संदर्भ में यह स्वाभाविक हिन्दी रात के काफी बीत जाने का आशय स्पष्ट करती है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἡμέρα
  choice: दिन
  rationale: ‘रात’ के साथ मूल कालिक और नैतिक विरोध को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: पूर्णकालिक क्रिया में निकट आने से उत्पन्न वर्तमान स्थिति का भाव है; यह पदबंध उस पहलू को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποβαλώμεθα
  choice: आओ, हम ... उतार फेंकें
  rationale: उपदेशात्मक बहुवचन को स्पष्ट करता है और ‘धारण करें’ के साथ वस्त्र उतारने-पहनने की सजीव समानांतर छवि बनाए रखता है।
- source_word: ἔργα
  choice: कामों
  rationale: पौलुस की शब्दावली के अनुरूप सामान्य और सुबोध शब्द है; यहाँ नैतिक कर्मों का अर्थ संदर्भ से स्पष्ट होता है।
- source_word: σκότους
  choice: अंधकार
  rationale: मूल रूपक को अक्षुण्ण रखता है और मुख्य पाठ में इसे सीधे ‘बुराई’ कहकर उसकी अर्थ-सीमा को नहीं बाँधता।
- source_word: ἐνδυσώμεθα
  choice: धारण करें
  rationale: पहनने के रूपक को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है तथा ‘उतार फेंकें’ के समानांतर है।
- source_word: ὅπλα
  choice: कवच
  rationale: शब्द युद्ध-सामग्री या हथियारों को सूचित कर सकता है; ‘धारण करें’ के साथ ‘कवच’ पहनने योग्य युद्ध-सज्जा का स्वाभाविक अर्थ देता है। व्यापक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: φωτός
  choice: प्रकाश
  rationale: अंधकार के साथ मूल नैतिक और युगांत-संबंधी विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: रात और दिन का युगांत-संबंधी रूपक
  choice: ‘रात’ और ‘दिन’ की मूल छवि को ज्यों का त्यों रखा गया है।
  alternative: ‘अंधकार का यह युग लगभग समाप्त हो चुका है’ और ‘नया युग निकट है’ जैसे व्याख्यात्मक रूप।
  rationale: मूल रूपक में कालिक, नैतिक और उद्धार-इतिहास संबंधी अर्थ साथ-साथ उपस्थित हैं; स्पष्ट व्याख्यात्मक रूप इनमें से किसी एक अर्थ को अनावश्यक रूप से प्रधान कर देता।
- issue: ὅπλα τοῦ φωτός का अर्थ
  choice: प्रकाश का कवच
  alternative: प्रकाश के हथियार
  rationale: ‘धारण करें’ पहनने योग्य युद्ध-सज्जा की ओर संकेत करता है, इसलिए मुख्य पाठ में ‘कवच’ स्वाभाविक है; फिर भी ὅπλα का व्यापक अर्थ ‘हथियार’ हो सकता है, जिसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप रखा गया है। ‘बहुत बीत चुकी है’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी मूल क्रिया की अधिक शाब्दिक छवि बचाती है। ‘उतार फेंकें’ और ‘धारण करें’ परस्पर संबद्ध वस्त्र-रूपक को बनाए रखते हैं।
