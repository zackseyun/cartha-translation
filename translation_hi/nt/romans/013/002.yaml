reference: Romans 13:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε ὁ ἀντιτασσόμενος τῇ ἐξουσίᾳ τῇ τοῦ θεοῦ διαταγῇ ἀνθέστηκεν, οἱ δὲ ἀνθεστηκότες ἑαυτοῖς κρίμα λήμψονται.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/002.yaml
  text: Therefore[a], the one who resists the authority has opposed the ordinance of God[b], and those who have opposed it will receive judgment on themselves.
translation:
  language: hi
  text: इसलिए जो सत्ता का विरोध करता है, उसने परमेश्वर की ठहराई हुई व्यवस्था[a] का विरोध किया है; और जो ऐसा विरोध कर चुके हैं, वे अपने ही लिए दण्ड पाएँगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का ठहराया हुआ प्रबंध।”
    reason: διαταγή किसी ठहराई हुई व्यवस्था, प्रबंध या निर्देश को व्यक्त कर सकता है।
  - marker: b
    text: “दण्ड” का अनुवाद “न्याय”, “दण्डादेश” या “दोष-दण्ड” भी किया जा सकता है; पर यूनानी शब्द यहाँ अनिवार्य रूप से अन्तिम दण्ड का अधिक प्रबल अर्थ नहीं देता।
    reason: κρίμα के अर्थ-क्षेत्र और पद में बनी हुई धर्मवैज्ञानिक अनिश्चितता को स्पष्ट करना।
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाला निष्कर्ष बताता है; ‘इसलिए’ आधुनिक हिन्दी में इसके तार्किक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἀντιτασσόμενος
  choice: जो … विरोध करता है
  rationale: वर्तमानकालिक कृदन्त किसी भी ऐसे व्यक्ति को सामान्य रूप से दर्शाता है जो विरोध की मुद्रा अपनाता है।
- source_word: τῇ ἐξουσίᾳ
  choice: सत्ता
  rationale: यह पद तत्काल प्रसंग में शासकीय अधिकार की ओर संकेत करता है। ‘सत्ता’ हिन्दी में केवल किसी वैध ‘अधिकार’ के बजाय शासन करने वाले प्राधिकार को अधिक स्पष्टता से व्यक्त करती है।
- source_word: τῇ τοῦ θεοῦ διαταγῇ
  choice: परमेश्वर की ठहराई हुई व्यवस्था
  rationale: διαταγή में व्यवस्थित या निर्धारित किए जाने का भाव है। यह चयन परमेश्वर द्वारा स्थापित प्रबंध का अर्थ रखता है, बिना इसे किसी विशेष मानवीय कानून या आदेश तक सीमित किए।
- source_word: ἀνθέστηκεν
  choice: विरोध किया है
  rationale: पूर्णकाल ऐसी स्थापित कार्रवाई या स्थिति को दर्शाता है जिसका वर्तमान महत्त्व बना हुआ है। इसी धातु की पुनरावृत्ति को हिन्दी में ‘विरोध’ दोहराकर सुरक्षित रखा गया है।
- source_word: οἱ δὲ ἀνθεστηκότες
  choice: और जिन्होंने उसका विरोध किया है
  rationale: पूर्णकालिक कृदन्त उन लोगों को दर्शाता है जिन्होंने ऐसा विरोध अपनाया है; ‘उसका’ निकटवर्ती परमेश्वर की ठहराई व्यवस्था को संदर्भित करता है।
- source_word: ἑαυτοῖς
  choice: अपने ऊपर
  rationale: निजवाचक दत्तिव बताता है कि विरोध का परिणाम उन्हीं विरोधियों पर लौटता है।
- source_word: κρίμα
  choice: न्याय का फैसला
  rationale: κρίμα न्यायिक निर्णय, दण्डादेश या दोष-दण्ड का अर्थ दे सकता है। ‘न्याय का फैसला’ चेतावनी और न्यायिक भाव को रखता है, पर अपने आप अनन्त दण्ड का निष्कर्ष नहीं जोड़ता।
- source_word: λήμψονται
  choice: पाएँगे
  rationale: भविष्यकाल उस परिणाम को प्राप्त करने को व्यक्त करता है; ‘पाएँगे’ हिन्दी में λήμψονται का सीधा और स्वाभाविक रूप है।
theological_decisions:
- issue: κρίμα का दायरा
  choice: न्याय का फैसला
  alternative: दण्डादेश / दोष-दण्ड
  rationale: यह पद प्रतिकूल न्यायिक परिणाम की चेतावनी देता है, पर स्वयं यह निश्चित नहीं करता कि आशय अन्तिम या अनन्त दण्ड ही है। व्यापक अनिश्चितता को बनाए रखा गया है।
- issue: ἐξουσία का संदर्भ
  choice: प्रसंगानुसार शासकीय सत्ता
  alternative: सामान्य या अमूर्त अधिकार
  rationale: रोमियों 13:1 का तत्काल प्रसंग शासन करने वाली सत्ताओं का है। मुख्य पाठ में संक्षिप्त ‘सत्ता’ रखा गया है ताकि प्रसंग स्पष्ट रहे और अनावश्यक विस्तार न जुड़े।
- issue: विरोध का प्रत्यक्ष लक्ष्य
  choice: दूसरे खण्ड में ‘उसका’ परमेश्वर की ठहराई व्यवस्था की ओर संकेत करता है
  alternative: इसे फिर से सत्ता की ओर संकेत मानना
  rationale: यूनानी में दूसरे कृदन्त का कर्म व्यक्त नहीं है। निकटतम व्याकरणिक संदर्भ व्यवस्था है, फिर भी सत्ता का विरोध ही उस व्यवस्था का विरोध है; अनुवाद इस संबंध को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘विरोध’ की पुनरावृत्ति मूल यूनानी के शब्द-संबंध को सुरक्षित रखती है। ‘ठहराई हुई व्यवस्था’ औपचारिक अर्थ बनाए रखते हुए अत्यधिक कानूनी या साम्प्रदायिक शब्दावली से बचती है।
