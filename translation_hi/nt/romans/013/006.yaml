source:
  edition: SBLGNT
  text: διὰ τοῦτο γὰρ καὶ φόρους τελεῖτε, λειτουργοὶ γὰρ θεοῦ εἰσιν εἰς αὐτὸ τοῦτο προσκαρτεροῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/006.yaml
  text: For because of this you also pay taxes, for they are God’s ministers, devoting themselves to this very thing.
translation:
  language: hi
  text: इसी कारण आप कर भी चुकाते हैं, क्योंकि अधिकारी परमेश्वर के सेवक हैं और इसी काम में निरंतर लगे रहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόρους τελεῖτε
  choice: कर चुकाते हैं
  rationale: यह पदबंध सरकारी कर अदा करने को व्यक्त करता है; आधुनिक हिन्दी में ‘कर चुकाना’ स्वाभाविक और सटीक है।
- source_word: λειτουργοὶ θεοῦ
  choice: परमेश्वर के सेवक
  rationale: λειτουργοί यहाँ सार्वजनिक दायित्व निभाने वाले सेवकों के लिए है। ‘सेवक’ मूल अर्थ को व्यापक रखता है और अनावश्यक धार्मिक या प्रशासनिक विशेषार्थ नहीं जोड़ता।
- source_word: προσκαρτεροῦντες
  choice: निरंतर लगे रहते हैं
  rationale: कृदन्त किसी कार्य में दृढ़तापूर्वक और लगातार लगे रहने का भाव देता है।
theological_decisions:
- issue: λειτουργοὶ θεοῦ का आशय
  choice: अधिकारी परमेश्वर के सेवक हैं
  alternative: वे परमेश्वर के उपासना-सेवक हैं
  rationale: पूर्ववर्ती संदर्भ में ‘वे’ शासकीय अधिकारियों को सूचित करता है। धार्मिक पदाधिकारी का अर्थ यहाँ संदर्भानुकूल नहीं है; फिर भी ‘सेवक’ उनके कार्य को परमेश्वर से संबंधित बताने वाले पौलुस के कथन को यथावत रखता है।
- issue: εἰς αὐτὸ τοῦτο का संदर्भ
  choice: इसी काम में
  alternative: इसी कर-वसूली के काम में
  rationale: यूनानी वाक्यांश का संदर्भ कुछ व्यापक रह सकता है—शासकीय सेवा या कर से जुड़ा यही दायित्व। अनुवाद इसे केवल कर-वसूली तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन ‘आप’ रखा गया है। भाषा सरल और गरिमापूर्ण है। स्पष्टता के लिए पिछले संदर्भ से निहित कर्ता ‘अधिकारी’ व्यक्त किया गया है।
