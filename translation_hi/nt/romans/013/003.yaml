id: ROM.13.3
reference: Romans 13:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ γὰρ ἄρχοντες οὐκ εἰσὶν φόβος ⸂τῷ ἀγαθῷ ἔργῳ⸃ ἀλλὰ ⸂τῷ κακῷ⸃. θέλεις δὲ μὴ φοβεῖσθαι τὴν ἐξουσίαν; τὸ ἀγαθὸν ποίει, καὶ ἕξεις ἔπαινον ἐξ αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/003.yaml
  text: For rulers are not a terror to good conduct[a], but to bad. But if you do not want to fear the authority, do what is good[c][b], and you will have praise from it.
translation:
  language: hi
  text: क्योंकि शासक अच्छे काम के लिए भय का कारण नहीं, बल्कि बुरे काम के लिए होते हैं। क्या तुम शासकीय सत्ता से न डरना चाहते हो? जो अच्छा है, वही करो, और उससे तुम्हें प्रशंसा मिलेगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: अर्थात शासकीय सत्ता की ओर से।
    reason: स्त्रीलिंग सर्वनाम αὐτῆς का पूर्वपद ἐξουσία, अर्थात शासकीय सत्ता, है।
lexical_decisions:
- source_word: ἄρχοντες
  choice: शासक
  rationale: यह शब्द शासन करनेवालों या शासकीय पद रखनेवालों को दर्शाता है; ‘शासक’ राजनीतिक संदर्भ में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: φόβος
  choice: भय का कारण
  rationale: विधेय संज्ञा यहाँ ऐसी वस्तु या व्यक्ति का भाव देती है जिससे भय हो; ‘भय का कारण’ हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ ἀγαθῷ ἔργῳ ... τῷ κακῷ
  choice: अच्छे काम करनेवालों के लिए ... बुरे काम करनेवालों के लिए
  rationale: यूनानी में अच्छे काम और बुरे के बीच सामान्य नैतिक विरोध है। हिन्दी में कर्ताओं को स्पष्ट करके यह भाव स्वाभाविक बनता है, बिना किसी विशेष प्रकार के काम तक अर्थ सीमित किए।
- source_word: θέλεις δὲ μὴ φοβεῖσθαι
  choice: क्या तुम ... से निडर रहना चाहते हो?
  rationale: θέλεις और नकारयुक्त infinitive की प्रश्नात्मक संरचना सुरक्षित रहती है, जबकि अभिव्यक्ति आधुनिक हिन्दी में सहज है।
- source_word: τὴν ἐξουσίαν
  choice: शासकीय सत्ता
  rationale: एकवचन शब्द संदर्भ में शासन करनेवाली संस्थागत सत्ता को दर्शाता है; ‘शासकीय सत्ता’ इस संदर्भ को स्पष्ट करता है।
- source_word: τὸ ἀγαθὸν ποίει
  choice: जो अच्छा है, वही करो
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण सामान्य नैतिक भलाई को दर्शाता है, न कि केवल किसी एक अच्छे काम को।
- source_word: ἕξεις ἔπαινον ἐξ αὐτῆς
  choice: उससे तुम्हारी प्रशंसा होगी
  rationale: यह भाव व्यक्त करता है कि प्रशंसा उसी शासकीय सत्ता की ओर से मिलेगी; हिन्दी में यह ‘प्रशंसा पाओगे’ की तुलना में स्रोत-संबंध को निकटता से रखता है।
theological_decisions:
- issue: शासकों और अच्छे काम की प्रशंसा के विषय में पौलुस के कथन का दायरा
  choice: कथन को शासकीय सत्ता की सामान्य अथवा अभिप्रेत भूमिका के वर्णन के रूप में रखा गया है।
  alternative: इसे ऐसा निरपवाद सार्वभौमिक दावा बनाना कि हर शासक हर समय अच्छे को पुरस्कृत और बुरे को दंडित करता है; अथवा इसे व्यंग्य मानना।
  rationale: मूल पाठ सीधा कथन करता है, पर हर शासक के प्रत्येक व्यवहार का स्पष्ट धर्मवैज्ञानिक समर्थन नहीं जोड़ता। अनुवाद इस तनाव को जस का तस रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। ‘शासक’ और ‘शासकीय सत्ता’ के भेद से व्यक्तियों और संस्थागत अधिकार के बीच मूल पाठ का अंतर रखा गया है; प्रश्नात्मक संरचना भी सुरक्षित है।
