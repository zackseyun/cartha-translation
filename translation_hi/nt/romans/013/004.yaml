id: ROM.13.4
reference: Romans 13:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: θεοῦ γὰρ διάκονός ἐστιν σοὶ εἰς τὸ ἀγαθόν. ἐὰν δὲ τὸ κακὸν ποιῇς, φοβοῦ· οὐ γὰρ εἰκῇ τὴν μάχαιραν φορεῖ· θεοῦ γὰρ διάκονός ἐστιν, ἔκδικος εἰς ὀργὴν τῷ τὸ κακὸν πράσσοντι.
base_translation:
  language: en
  yaml_path: translation/nt/romans/013/004.yaml
  text: For it is God’s servant for your good[a]. But if you do what is evil, be afraid, for it does not bear the sword for nothing. For it is God’s servant[b], an avenger for wrath against the one who practices evil.
translation:
  language: hi
  text: क्योंकि वह तुम्हारी भलाई के लिए परमेश्वर का सेवक है। लेकिन यदि तुम बुराई करते हो, तो डरो, क्योंकि वह व्यर्थ तलवार धारण नहीं करता। वह परमेश्वर का सेवक है, जो क्रोध के लिए बुराई करनेवाले को दंड देता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάκονός
  choice: सेवक
  rationale: यहाँ शासकीय अधिकारी परमेश्वर के अधीन कार्य करनेवाले प्रतिनिधि के रूप में प्रस्तुत है। ‘सेवक’ सामान्य और नागरिक संदर्भ में स्वाभाविक है तथा इसे कलीसियाई पद तक सीमित नहीं करता।
- source_word: σοὶ εἰς τὸ ἀγαθόν
  choice: तुम्हारी भलाई के लिए
  rationale: यह व्यक्ति के हित और लाभ के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ κακὸν ποιῇς
  choice: तुम बुराई करते हो
  rationale: κακόν का नैतिक अर्थ स्पष्ट रहता है और हिन्दी में अभिव्यक्ति सहज है।
- source_word: φοβοῦ
  choice: डरो
  rationale: आज्ञार्थक रूप को संक्षिप्त और सीधे ढंग से व्यक्त करता है।
- source_word: εἰκῇ
  choice: व्यर्थ
  rationale: इसका अर्थ बिना उद्देश्य या निष्फल रूप से है; यहाँ आशय है कि तलवार धारण करना निरर्थक नहीं है।
- source_word: μάχαιραν φορεῖ
  choice: तलवार धारण करता
  rationale: ‘तलवार’ मूल ठोस बिंब और दंडाधिकार के प्रतीक को बनाए रखती है; ‘धारण करता’ φορέω के निरंतर साथ रखने के भाव के अनुकूल है।
- source_word: ἔκδικος
  choice: प्रतिशोधकर्ता
  rationale: यह न्यायिक प्रतिकार या दंड लागू करनेवाले व्यक्ति का प्रबल अर्थ बनाए रखता है, बिना इसे केवल सामान्य ‘न्याय करनेवाला’ बना देने के।
- source_word: εἰς ὀργὴν
  choice: क्रोध लानेवाला
  rationale: उद्देश्य या परिणाम का भाव स्वाभाविक हिन्दी में आता है, जबकि ‘क्रोध’ किसका है यह मूल पाठ की तरह अनिर्दिष्ट रहता है।
- source_word: τῷ τὸ κακὸν πράσσοντι
  choice: बुराई करनेवाले पर
  rationale: कृदंत के चरित्रगत या जारी आचरण के भाव को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पौलुस के व्याख्यात्मक तर्क-संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: शासकीय अधिकारी के दंडात्मक कार्य और क्रोध का संबंध
  choice: ‘बुराई करनेवाले पर क्रोध लानेवाला प्रतिशोधकर्ता’
  alternative: ‘बुराई करनेवाले को दंड देनेवाला’ अथवा ‘परमेश्वर का क्रोध लानेवाला’
  rationale: मूल εἰς ὀργὴν में ‘परमेश्वर का’ स्पष्ट रूप से नहीं दोहराया गया है। ‘क्रोध’ को बनाए रखने से दैवी न्याय का संदर्भ बना रहता है, पर अनुवाद मूल की संक्षिप्तता और अस्पष्टता को सिद्धांतगत विस्तार से नहीं भरता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। संबोधन में एकवचन ‘तुम’ मूल σοὶ के अनुरूप है। वाक्य की तर्कात्मक पुनरावृत्ति और ‘तलवार’ का ठोस बिंब सुरक्षित रखा गया है।
