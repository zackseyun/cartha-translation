review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly preserves the two-part argument: sin was present in the world before the law, yet sin is not accounted in the absence of law. However, “व्यवस्था दिए जाने तक” makes explicit the act of giving that is contextually likely but not expressed in the Greek phrase ἄχρι νόμου. “व्यवस्था के आने तक” is idiomatic Hindi while retaining the source’s relative restraint.'
  naturalness: The register is clear and appropriately biblical-modern. “लेखे में नहीं गिना जाता” communicates the accounting metaphor, but “किसी के लेखे में नहीं गिना जाता” is more natural and makes the inherent account-charging sense of ἐλλογεῖται clear without imposing a theological interpretation.
  terminology: “व्यवस्था,” “संसार,” and “पाप” are suitable established Hindi biblical terms. A lexical footnote should retain the alternatives ‘किसी के खाते में लगाया जाता’ and ‘आरोपित किया जाता,’ corresponding to the English audit trail and the Greek accounting term.
  issues:
  - severity: low
    issue: “दिए जाने” is an unnecessary explicitation in the temporal phrase.
    rationale: The immediate context makes the Mosaic giving of the law likely, but ἄχρι νόμου itself says only ‘until the law.’ Replacing it with “आने तक” avoids stating the giving event more explicitly than the source wording.
  - severity: low
    issue: The accounting sense of ἐλλογεῖται can be expressed more idiomatically and its lexical alternatives should be retained in a footnote.
    rationale: Adding “किसी के” fits the implicit accounting-to-an-account sense. The footnote preserves ‘charged to one’s account’ and ‘imputed’ without loading the main text with technical terminology.
  revised_text: क्योंकि व्यवस्था के आने तक संसार में पाप था, पर जहाँ व्यवस्था नहीं है, वहाँ पाप किसी के लेखे में नहीं गिना जाता।
  revised_footnotes:
  - marker: a
    text: या, “किसी के खाते में लगाया जाता” या “आरोपित किया जाता।”
    reason: यूनानी ἐλλογεῖται के लेखांकन/आरोपण संबंधी वैकल्पिक अर्थों को सुरक्षित रखने के लिए।
  revision_rationale: संशोधन मूल के कालगत वाक्यांश को अनावश्यक रूप से ‘दिए जाने’ के रूप में विस्तृत करने से बचाता है, जबकि हिन्दी की सहजता बनाए रखता है। मुख्य पाठ में ‘किसी के लेखे में’ लेखांकन-रूपक को स्पष्ट करता है; पादटिप्पणी वैकल्पिक, अधिक तकनीकी अभिव्यक्तियाँ उपलब्ध कराती है।
