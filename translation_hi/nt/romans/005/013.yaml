- from: क्योंकि व्यवस्था दिए जाने तक संसार में पाप था, पर जहाँ व्यवस्था नहीं है, वहाँ पाप लेखे में नहीं गिना जाता।
  to: क्योंकि व्यवस्था के आने तक संसार में पाप था, पर जहाँ व्यवस्था नहीं है, वहाँ पाप किसी के लेखे में नहीं गिना जाता।
  rationale: संशोधन मूल के कालगत वाक्यांश को अनावश्यक रूप से ‘दिए जाने’ के रूप में विस्तृत करने से बचाता है, जबकि हिन्दी की सहजता बनाए रखता है। मुख्य पाठ में ‘किसी के लेखे में’ लेखांकन-रूपक को स्पष्ट करता है; पादटिप्पणी वैकल्पिक, अधिक तकनीकी अभिव्यक्तियाँ उपलब्ध कराती है।
