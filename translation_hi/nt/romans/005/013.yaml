id: ROM.5.13
reference: Romans 5:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄχρι γὰρ νόμου ἁμαρτία ἦν ἐν κόσμῳ, ἁμαρτία δὲ οὐκ ἐλλογεῖται μὴ ὄντος νόμου,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/013.yaml
  text: For until the law[a], sin was in the world; but sin is not counted where there is no law.
translation:
  language: hi
  text: क्योंकि व्यवस्था के आने तक संसार में पाप था, पर जहाँ व्यवस्था नहीं है, वहाँ पाप किसी के लेखे में नहीं गिना जाता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄχρι γὰρ νόμου
  choice: क्योंकि व्यवस्था दिए जाने तक
  rationale: ἄχρι νόμου उस समयावधि को सूचित करता है जो व्यवस्था के आने या दिए जाने तक थी। हिन्दी में केवल ‘व्यवस्था तक’ अस्पष्ट होता, इसलिए प्रसंगानुसार ‘दिए जाने’ जोड़ा गया है।
- source_word: νόμου
  choice: व्यवस्था
  rationale: रोमियों 5 के आदम से मूसा तक के प्रसंग में मूसा की व्यवस्था अभिप्रेत है। ‘व्यवस्था’ प्रचलित और गरिमापूर्ण बाइबलीय हिन्दी है; मूल में यहाँ निश्चित उपपद न होने के कारण ‘मूसा की’ स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: ἁμαρτία
  choice: पाप
  rationale: यह पौलुस के प्रयोग की एकवचन भाववाचक संज्ञा को स्वाभाविक रूप से व्यक्त करता है और उसकी संभावित व्यक्तिकृत शक्ति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐν κόσμῳ
  choice: संसार में
  rationale: यह मानव संसार में पाप की उपस्थिति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐλλογεῖται
  choice: लेखे में नहीं गिना जाता
  rationale: क्रिया में हिसाब में दर्ज करने या किसी के खाते में लगाने का भाव है। ‘लेखे में गिना जाता’ साधारण पाठक के लिए बोधगम्य रहते हुए लेखांकन-संबंधी अर्थ को ‘गिना जाता’ से अधिक स्पष्ट रूप में सुरक्षित रखता है।
- source_word: μὴ ὄντος νόμου
  choice: जहाँ व्यवस्था नहीं है
  rationale: यह genitive absolute व्यवस्था की अनुपस्थिति को उस कथन की शर्त के रूप में व्यक्त करता है। ‘जहाँ’ पौलुस के सामान्य सिद्धांत को हिन्दी में सहज रूप देता है।
theological_decisions:
- issue: ‘व्यवस्था’ का संदर्भ
  choice: प्रसंग में मूसा की व्यवस्था अभिप्रेत मानते हुए ‘व्यवस्था दिए जाने तक’
  alternative: सामान्य अर्थ में केवल ‘व्यवस्था तक’ या ‘कानून तक’
  rationale: आदम से मूसा तक की निकटवर्ती चर्चा मूसा की व्यवस्था की ओर संकेत करती है। फिर भी अनुवाद में ‘मूसा की’ जोड़कर मूल की अभिव्यक्ति को अधिक निश्चित नहीं बनाया गया।
- issue: ἐλλογεῖται का धर्मवैज्ञानिक बल
  choice: लेखे में नहीं गिना जाता
  alternative: आरोपित नहीं किया जाता; किसी के खाते में नहीं डाला जाता
  rationale: मूल क्रिया लेखांकन या आरोपण का अर्थ रखती है, पर तकनीकी धर्मवैज्ञानिक शब्द चुनने से पद का अर्थ किसी एक सिद्धान्त की ओर झुक सकता था। चुना हुआ वाक्यांश उस रूपक को सुरक्षित रखता है।
- issue: व्यवस्था न होने पर पाप की स्थिति
  choice: पाप की उपस्थिति और उसके लेखे में गिने जाने के बीच मूल का भेद बनाए रखा
  alternative: यह कहना कि व्यवस्था के बिना पाप था ही नहीं या उसका कोई दोष नहीं था
  rationale: पद पहले स्पष्ट करता है कि पाप संसार में था, फिर उसके गिने जाने के विषय में कथन करता है। अनुवाद इस धर्मवैज्ञानिक तनाव को हल किए बिना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली। ‘व्यवस्था’ और ‘पाप’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। मुख्य पाठ में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘लेखे में’ स्वयं ἐλλογεῖται के लेखांकन-भाव को स्पष्ट करता है।
