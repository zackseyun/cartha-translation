  text: μόλις γὰρ ὑπὲρ δικαίου τις ἀποθανεῖται· ὑπὲρ γὰρ τοῦ ἀγαθοῦ τάχα τις καὶ τολμᾷ ἀποθανεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/007.yaml
  text: For hardly will anyone die for a righteous person[b][a]; though perhaps for a good person someone might even dare to die.
translation:
  language: hi
  text: किसी धर्मी व्यक्ति[a] के लिए शायद ही कोई मरे; किसी भले व्यक्ति के लिए शायद कोई मरने का साहस भी करे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मी मनुष्य।” यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग है, पर यहाँ उसका प्रयोग संभवतः सामान्य अर्थ में किसी भी व्यक्ति के लिए हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “धर्मी” और “भले” के बीच का अंतर जानबूझकर रखा गया हो सकता है, केवल शैलीगत भिन्नता नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: μόλις
  choice: शायद ही
  rationale: यह किसी घटना के अत्यंत असामान्य या दुर्लभ होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यहाँ यह किसी की खातिर या उसके हित में प्राण देने का अर्थ देता है; ‘के लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: δικαίου
  choice: धर्मी व्यक्ति
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण नैतिक रूप से धर्मी व्यक्ति को दर्शाता है; ‘व्यक्ति’ सामान्य मानवीय संदर्भ को स्पष्ट करता है।
- source_word: ἀποθανεῖται
  choice: मरे
  rationale: हिन्दी में सामान्य और संभाव्य कथन के लिए यह रूप यूनानी भविष्यकाल के आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ ἀγαθοῦ
  choice: भले व्यक्ति
  rationale: ‘भला’ सकारात्मक भलाई या उपकारशीलता का भाव देता है और ‘धर्मी’ से संभावित अर्थभेद बनाए रखता है।
- source_word: τάχα
  choice: शायद
  rationale: यह संभावना को बिना निश्चित बनाए व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: 'यह आरोही बल देता है: कोई ऐसा करने का साहस ‘भी’ कर सकता है।'
- source_word: τολμᾷ
  choice: साहस कर ले
  rationale: यह सामान्य कथन में संकोचपूर्ण संभावना और साहस, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποθανεῖν
  choice: मरने
  rationale: प्रत्यक्ष अनुवाद मृत्यु के विचार की दोनों खंडों में पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: δικαίου और ἀγαθοῦ के बीच संभावित भेद
  choice: इन्हें अलग-अलग ‘धर्मी व्यक्ति’ और ‘भले व्यक्ति’ के रूप में प्रस्तुत करना।
  alternative: दोनों को निकटार्थक मानकर एक ही हिन्दी शब्द से अनूदित करना।
  rationale: मूल पाठ दो अलग शब्दों का प्रयोग करता है और इनके बीच अर्थपूर्ण विरोध या प्रगति संभव है; अनुवाद उस तनाव को मिटाता नहीं है।
- issue: दोनों खंडों के संबंध का स्वरूप
  choice: दूसरे खंड को ‘फिर भी’ से संभावित विरोध के रूप में प्रस्तुत करना।
  alternative: दूसरे γάρ को कारणसूचक ‘क्योंकि’ से अनूदित करना।
  rationale: यहाँ दूसरा γάρ कथन को स्पष्ट या संशोधित करता है; हिन्दी में ‘फिर भी’ धर्मी के लिए मृत्यु की अत्यंत दुर्लभता और भले व्यक्ति के लिए संभावित साहस का संबंध अधिक स्पष्ट और स्वाभाविक बनाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘धर्मी’ और ‘भला’ का भेद सुरक्षित है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
