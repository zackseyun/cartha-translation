source:
  edition: SBLGNT
  text: ἀλλὰ ἐβασίλευσεν ὁ θάνατος ἀπὸ Ἀδὰμ μέχρι Μωϋσέως καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ, ὅς ἐστιν τύπος τοῦ μέλλοντος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/014.yaml
  text: Yet death reigned from Adam until Moses[a], even over those who did not sin in the likeness of Adam’s transgression[b], who is a type of the coming one.
translation:
  language: hi
  text: फिर भी आदम से लेकर मूसा तक मृत्यु ने राज किया—उन लोगों पर भी जिन्होंने आदम के उल्लंघन के समान पाप नहीं किया था। आदम उस आनेवाले[b] का प्रतिरूप[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नमूना” अथवा “पूर्व-संकेत।”
    reason: lexical_alternative
  - marker: b
    text: या “जो आनेवाला है।” प्रसंग में इसका संकेत मसीह की ओर है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλὰ
  choice: फिर भी
  rationale: यह पिछले कथन के साथ प्रबल विरोध दिखाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐβασίλευσεν ὁ θάνατος
  choice: मृत्यु ने राज किया
  rationale: यह βασιλεύω की राजकीय छवि और मृत्यु के मानवीकरण—दोनों को बनाए रखता है।
- source_word: ἀπὸ Ἀδὰμ μέχρι Μωϋσέως
  choice: आदम से लेकर मूसा तक
  rationale: समयावधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ ἐπὶ τοὺς μὴ ἁμαρτήσαντας
  choice: उन लोगों पर भी, जिन्होंने ... पाप नहीं किया था
  rationale: मृत्यु के शासन की आश्चर्यजनक व्यापकता को ‘पर भी’ स्पष्ट करता है।
- source_word: ἐπὶ τῷ ὁμοιώματι τῆς παραβάσεως Ἀδάμ
  choice: आदम के अपराध के समान
  rationale: ὁμοίωμα की तुलना को बनाए रखते हुए कृत्रिम शब्दशः संरचना से बचता है; παράβασις के लिए ‘अपराध’ आज की सामान्य हिन्दी में आज्ञा-उल्लंघन का भाव देता है।
- source_word: τύπος
  choice: प्रतिरूप
  rationale: आदम और आनेवाले व्यक्ति के बीच अनुरूपता तथा पूर्व-संकेत का भाव रखता है, बिना उसे केवल ‘उदाहरण’ बना देने के।
- source_word: τοῦ μέλλοντος
  choice: उस आनेवाले
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को निकटता से प्रस्तुत करता है और मुख्य पाठ में मसीह नाम जोड़कर निहित संदर्भ को स्पष्टतः निर्धारित नहीं करता।
theological_decisions:
- issue: ‘उस आनेवाले’ का संदर्भ
  choice: मुख्य पाठ में अप्रत्यक्ष अभिव्यक्ति ‘उस आनेवाले’ रखी गई है।
  alternative: ‘मसीह’ या ‘आनेवाला मसीह’
  rationale: रोमियों 5:12–21 में संदर्भ मसीह की ओर है, पर यूनानी पाठ यहाँ उनका नाम नहीं देता; इसलिए अनुवाद मूल अभिव्यक्ति और उसकी साहित्यिक-धर्मवैचारिक तनावशीलता को सुरक्षित रखता है।
- issue: आदम के अपराध के समान पाप न करने का अर्थ
  choice: तुलना को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे किसी स्पष्ट आज्ञा के उल्लंघन अथवा आदम-जैसे व्यक्तिगत कृत्य के रूप में खोलकर कहना
  rationale: ἐπὶ τῷ ὁμοιώματι का सटीक दायरा व्याख्यात्मक प्रश्न है; अनुवाद उसे चुपचाप हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मृत्यु ने राज किया’ पौलुस के सजीव मानवीकरण को बनाए रखता है। ‘प्रतिरूप’ थोड़ा औपचारिक है, पर इस प्रसंग की अनुरूपात्मक तथा पूर्वसूचक शक्ति को ‘उदाहरण’ से बेहतर सुरक्षित रखता है।
