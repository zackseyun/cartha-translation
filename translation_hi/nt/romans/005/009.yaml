  yaml_path: translation/nt/romans/005/009.yaml
  text: Much more then[a], having now been justified by his blood[c][b], we shall be saved through him from the wrath.
translation:
  language: hi
  text: इसलिए, अब जबकि हम उसके लहू के द्वारा धर्मी ठहराए गए हैं,[a] तो हम उसके द्वारा उस क्रोध से कितना अधिक बचाए जाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धर्मी घोषित किए गए हैं।’
    reason: lexical_alternative
  - marker: b
    text: अर्थात् संदर्भ में निहित परमेश्वर का क्रोध।
    reason: cross_reference
lexical_decisions:
- source_word: πολλῷ οὖν μᾶλλον
  choice: इसलिए ... तो कितना अधिक
  rationale: οὖν के निष्कर्षसूचक संबंध और πολλῷ ... μᾶλλον के प्रबल ‘कितना अधिक’ तर्क—दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में सुरक्षित रखता है।
- source_word: δικαιωθέντες
  choice: जब हम ... धर्मी ठहराए गए हैं
  rationale: अओरिस्ट कर्मवाच्य कृदंत मुख्य भविष्यकालीन क्रिया से पहले पूर्ण हुए कार्य और उसके वर्तमान परिणाम को व्यक्त करता है। ‘धर्मी ठहराए गए’ पौलुस की न्याय-संबंधी भाषा को स्पष्ट रखता है।
- source_word: νῦν
  choice: अब
  rationale: वर्तमान अवस्था को सूचित करने वाला सीधा कालवाचक अनुवाद।
- source_word: ἐν τῷ αἵματι αὐτοῦ
  choice: उसके लहू के द्वारा
  rationale: ἐν यहाँ साधन अथवा आधार का भाव रखता है। ‘के द्वारा’ हिन्दी में स्वाभाविक है और लहू के बलिदानी आशय को बिना विस्तार जोड़े बनाए रखता है।
- source_word: σωθησόμεθα
  choice: हम ... बचाए जाएँगे
  rationale: भविष्य कर्मवाच्य को स्पष्ट रूप से सुरक्षित रखता है और भविष्य में प्राप्त होने वाले उद्धार को व्यक्त करता है।
- source_word: δι’ αὐτοῦ
  choice: उसी के द्वारा
  rationale: διά के साथ संबंधकारक माध्यम अथवा कर्तृत्व बताता है; ‘उसी’ मसीह की ओर लौटते सर्वनाम को स्वाभाविक बल देता है।
- source_word: ἀπὸ τῆς ὀργῆς
  choice: उस क्रोध से
  rationale: निश्चित उपपद के कारण ‘उस क्रोध’ निश्चित संदर्भ को दर्शाता है, पर मूल में न आए ‘परमेश्वर के’ शब्द नहीं जोड़ता।
theological_decisions:
- issue: δικαιωθέντες में धर्मी ठहराए जाने का स्वरूप
  choice: मुख्य पाठ में ‘धर्मी ठहराए गए’
  alternative: ‘निर्दोष ठहराए गए’ अथवा ‘धर्मी घोषित किए गए’
  rationale: यह पौलुस के δικαιόω शब्द-समूह की न्याय-संबंधी निरंतरता बनाए रखता है, लेकिन धर्मी ठहराए जाने की प्रक्रिया पर किसी संप्रदाय-विशेष की व्याख्या नहीं थोपता।
- issue: ἡ ὀργή का संदर्भ
  choice: ‘उस क्रोध’—मुख्य पाठ में स्वामी को स्पष्ट न करना
  alternative: ‘परमेश्वर के क्रोध’
  rationale: संदर्भ इसे परमेश्वर का क्रोध समझने का प्रबल आधार देता है, पर यूनानी पदबंध में θεοῦ नहीं है; इसलिए विस्तार को पाद-टिप्पणी तक सीमित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज रूप। ‘लहू’ बाइबलीय बलिदानी संदर्भ में परिचित है; ‘खून’ की अपेक्षा अधिक उपयुक्त धार्मिक-साहित्यिक गरिमा रखता है। वाक्य में ‘जब ... तो कितना अधिक’ यूनानी कृदंत और पौलुस के बढ़ते हुए तर्क को स्वाभाविक हिन्दी में व्यक्त करता है।
