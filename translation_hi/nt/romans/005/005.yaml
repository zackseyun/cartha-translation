source:
  edition: SBLGNT
  text: ἡ δὲ ἐλπὶς οὐ καταισχύνει· ὅτι ἡ ἀγάπη τοῦ θεοῦ ἐκκέχυται ἐν ταῖς καρδίαις ἡμῶν διὰ πνεύματος ἁγίου τοῦ δοθέντος ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/005.yaml
  text: And hope does not put to shame[a], because the love of God has been poured out in our hearts through the Holy Spirit[b], who was given to us.
translation:
  language: hi
  text: और आशा हमें लज्जित नहीं करती[a], क्योंकि परमेश्वर का प्रेम[b] पवित्र आत्मा के द्वारा हमारे हृदयों में उंडेला गया है, जो हमें दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें निराश नहीं करती।”
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर का प्रेम” का अर्थ संभवतः हमारे प्रति परमेश्वर का प्रेम है; कम संभावना से इसका अर्थ परमेश्वर के प्रति हमारा प्रेम भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλπίς
  choice: आशा
  rationale: यह सामान्य और स्वाभाविक हिन्दी समतुल्य है; यूनानी लेख यहाँ सामान्य अर्थ देता है।
- source_word: δέ
  choice: और
  rationale: यह हल्के संयोजक को व्यक्त करता है, बिना अनावश्यक विरोध का भाव बढ़ाए।
- source_word: καταισχύνει
  choice: हमें लज्जित नहीं करती
  rationale: यह क्रिया के लज्जा और मान-सम्मान संबंधी मूल भाव को बनाए रखता है; कर्म हिन्दी में अर्थ की स्पष्टता के लिए जोड़ा गया है।
- source_word: ἡ ἀγάπη τοῦ θεοῦ
  choice: परमेश्वर का प्रेम
  rationale: यह यूनानी संबंधकारक की संरचना को स्वाभाविक हिन्दी में बनाए रखता है; प्रसंग मुख्यतः परमेश्वर द्वारा हमारे प्रति किए गए प्रेम की ओर संकेत करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐκκέχυται
  choice: उंडेला गया है
  rationale: पूर्णकालिक रूप अतीत में हुए कार्य और उसके वर्तमान स्थायी परिणाम—दोनों को व्यक्त करता है।
- source_word: ἐν ταῖς καρδίαις ἡμῶν
  choice: हमारे हृदयों में
  rationale: मूल बहुवचन और रूपकात्मक अभिव्यक्ति को सीधे तथा गरिमापूर्ण ढंग से रखता है।
- source_word: διὰ πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा
  rationale: διά के साधन अथवा माध्यम संबंधी अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: τοῦ δοθέντος ἡμῖν
  choice: जो हमें दिया गया था
  rationale: संबंधवाचक वाक्यांश पवित्र आत्मा को व्यक्तिगत संदर्भ में प्रस्तुत करता है और यूनानी कृदंत के भूतकालीन दान को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἡ ἀγάπη τοῦ θεοῦ में संबंधकारक का अर्थ
  choice: परमेश्वर का हमारे प्रति प्रेम
  alternative: परमेश्वर के प्रति हमारा प्रेम
  rationale: आशा के लज्जित न करने का कारण यह बताया गया है कि प्रेम पवित्र आत्मा के द्वारा हमारे हृदयों में उंडेला गया है; यह तर्क मुख्यतः परमेश्वर के हमारे प्रति प्रेम का समर्थन करता है। फिर भी व्याकरणगत वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट। ‘लज्जित नहीं करती’ मूल के लज्जा-संबंधी अर्थ को बनाए रखता है, जबकि अधिक प्रचलित अर्थ ‘निराश नहीं करती’ पादटिप्पणी में दिया गया है।
