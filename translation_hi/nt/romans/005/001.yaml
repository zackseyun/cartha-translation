  yaml_path: translation/nt/romans/005/001.yaml
  text: Therefore[a], since we have been justified by faith, we have peace with God through our Lord Jesus the Messiah[c][b],
translation:
  language: hi
  text: इसलिए, विश्वास के आधार पर[b] धर्मी ठहराए जाने के कारण, हमारे प्रभु यीशु मसीह के द्वारा परमेश्वर के साथ हमारी शांति है।[a][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन हस्तलिपियों में पाठ है: “हम परमेश्वर के साथ शांति रखें।”'
    reason: textual_variant
  - marker: b
    text: “विश्वास के आधार पर” का अनुवाद “विश्वास से” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “मसीह” यूनानी शब्द Christos का अनुवाद है, जिसका अर्थ “अभिषिक्त” है; परंपरागत रूप से “क्राइस्ट”।
    reason: lexical_alternative
lexical_decisions:
- source_word: Δικαιωθέντες
  choice: धर्मी ठहराए गए हैं
  rationale: δικαιόω के न्यायिक भाव को संक्षिप्त और प्रचलित हिन्दी में सुरक्षित रखता है; यह पद स्वयं ‘धर्मी घोषित’ या ‘धर्मी बनाए’ के बीच की व्यापक धर्मवैज्ञानिक बहस का पूरा समाधान नहीं करता।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले तर्क से निकाले गए निष्कर्ष को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐκ πίστεως
  choice: विश्वास के आधार पर
  rationale: ἐκ के आधार अथवा स्रोत-संबंधी भाव को स्वाभाविक हिन्दी में व्यक्त करता है और केवल साधन बताने से कुछ अधिक निकटता से यूनानी संरचना को दर्शाता है।
- source_word: εἰρήνην
  choice: शांति
  rationale: यूनानी संज्ञा के व्यापक अर्थ को बनाए रखता है; ‘मेल-मिलाप’ कहना अधिक व्याख्यात्मक और संकीर्ण होता।
- source_word: ἔχομεν
  choice: हमारी शांति है
  rationale: SBLGNT के संकेतार्थक पाठ ἔχομεν (‘हमारे पास है’) का स्वाभाविक हिन्दी रूप; संबंधवाचक प्रयोग ‘परमेश्वर के साथ हमारी शांति है’ हिन्दी में सहज है।
- source_word: πρὸς τὸν θεὸν
  choice: परमेश्वर के साथ
  rationale: शांति के संदर्भ में πρὸς का संबंधपरक अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος का प्रतिष्ठित, सम्मानसूचक और प्रसंगानुकूल हिन्दी रूप।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός को उसके मसीही पदनाम के अर्थ सहित हिन्दी के मानक बाइबलीय प्रयोग ‘मसीह’ से व्यक्त करता है।
theological_decisions:
- issue: पौलुस के प्रयोग में δικαιωθέντες का अर्थ
  choice: धर्मी ठहराए गए हैं
  alternative: धर्मी घोषित किए गए हैं / धर्मी बनाए गए हैं
  rationale: मुख्य पाठ परमेश्वर के धर्मी ठहराने के कार्य को व्यक्त करता है, पर उस कार्य की समस्त धर्मवैज्ञानिक प्रक्रिया को विस्तार देकर किसी एक मत में सीमित नहीं करता।
- issue: ‘परमेश्वर के साथ शांति’ का आशय
  choice: परमेश्वर के साथ हमारी शांति है
  alternative: परमेश्वर से हमारा मेल-मिलाप है / हमें परमेश्वर से मिलने वाली भीतरी शांति है
  rationale: वाक्य मुख्यतः परमेश्वर के साथ बहाल संबंध की बात करता है, पर मूल शब्द ‘शांति’ है; अतः उसके अर्थ की व्यापकता बनाए रखी गई है।
- issue: ἔχομεν और ἔχωμεν का पाठांतर
  choice: 'संकेतार्थक: हमारी शांति है'
  alternative: 'आग्रहात्मक: हम शांति बनाए रखें / हमें शांति रखनी चाहिए'
  rationale: प्रदत्त SBLGNT पाठ ἔχομεν को अपनाया गया है, जबकि प्राचीन हस्तलिपियों में पाए जाने वाले आग्रहात्मक पाठ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘धर्मी ठहराए गए’, ‘प्रभु’, और ‘मसीह’ जैसे परिचित बाइबलीय पद रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य आधुनिक पाठक के लिए सहज बनाया गया है।
