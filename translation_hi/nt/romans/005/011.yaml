source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ καυχώμενοι ἐν τῷ θεῷ διὰ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι’ οὗ νῦν τὴν καταλλαγὴν ἐλάβομεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/011.yaml
  text: And not only that[a], but we also boast in God through our Lord Jesus the Messiah[d][c][b], through whom we have now received the reconciliation.
translation:
  language: hi
  text: और केवल इतना ही नहीं, बल्कि हम अपने प्रभु यीशु मसीह के द्वारा परमेश्वर में गर्व भी करते हैं[a]; उनके द्वारा अब हमें मेल-मिलाप प्राप्त हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर में आनन्दित होते हैं” अथवा “परमेश्वर में गौरव करते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμενοι
  choice: गर्व करते हैं
  rationale: यह καυχάομαι के ‘गर्व करना/महिमा करना’ वाले अर्थ को सीधे व्यक्त करता है। यहाँ गर्व का आधार स्वयं मनुष्य नहीं, बल्कि परमेश्वर हैं; इसलिए नकारात्मक आत्मश्लाघा का भाव संदर्भ से नियंत्रित होता है।
- source_word: ἐν τῷ θεῷ
  choice: परमेश्वर पर
  rationale: ἐν यहाँ गर्व के आधार अथवा विषय को व्यक्त करता है। आधुनिक हिन्दी में ‘परमेश्वर पर गर्व करना’ स्वाभाविक और स्पष्ट है।
- source_word: κυρίου
  choice: प्रभु
  rationale: नए नियम में यीशु के लिए κύριος का मानक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला हिन्दी प्रतिशब्द।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός अभिषिक्त राजा की उपाधि है; हिन्दी में ‘मसीह’ इसी अर्थ और पारंपरिक पहचान को स्वाभाविक रूप से वहन करता है।
- source_word: καταλλαγὴν
  choice: मेल-मिलाप
  rationale: καταλλαγή टूटे संबंध के पुनर्स्थापन को दर्शाता है। ‘मेल-मिलाप’ साधारण आधुनिक हिन्दी में इस संबंधपरक अर्थ को स्पष्ट रखता है।
- source_word: ἐλάβομεν
  choice: प्राप्त हुआ है
  rationale: νῦν के साथ अतीत में संपन्न कार्य के वर्तमान परिणाम को स्वाभाविक हिन्दी पूर्णकाल में व्यक्त करता है; ‘हमें ... प्राप्त हुआ है’ प्राप्तकर्ता की भूमिका भी बनाए रखता है।
theological_decisions:
- issue: καυχώμενοι का सकारात्मक किंतु तनावपूर्ण अर्थ
  choice: गर्व भी करते हैं
  alternative: आनन्दित भी होते हैं / गौरव करते हैं
  rationale: पौलुस का शब्द केवल आनन्द नहीं, परमेश्वर में विश्वासपूर्ण गर्व या महिमा करने का भाव रखता है। ‘गर्व’ इस धार को बनाए रखता है, जबकि ‘परमेश्वर पर’ स्पष्ट करता है कि यह आत्मश्लाघा नहीं है।
- issue: Χριστοῦ को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित है और Χριστός के उपाधिसूचक अर्थ को नाम मात्र में बदले बिना संप्रेषित करता है।
- issue: τὴν καταλλαγὴν में निश्चितता
  choice: मेल-मिलाप
  alternative: वह मेल-मिलाप
  rationale: यूनानी निश्चित पद पूर्ववर्ती संदर्भ में वर्णित विशिष्ट मेल-मिलाप की ओर संकेत करता है, पर हिन्दी में अमूर्त भाववाचक संज्ञा के साथ संकेतवाचक जोड़ना यहाँ कृत्रिम लगता है। संदर्भ स्वयं इसकी विशिष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और केवल इतना ही नहीं’ पौलुस के तर्क का पिछले कथन से संबंध बनाए रखता है। ‘उन्हीं के द्वारा’ संबंधवाचक सर्वनाम के पुरुष-संदर्भ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
