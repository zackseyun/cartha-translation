id: ROM.5.18
reference: Romans 5:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἄρα οὖν ὡς δι’ ἑνὸς παραπτώματος εἰς πάντας ἀνθρώπους εἰς κατάκριμα, οὕτως καὶ δι’ ἑνὸς δικαιώματος εἰς πάντας ἀνθρώπους εἰς δικαίωσιν ζωῆς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/018.yaml
  text: So then[a], as through one trespass condemnation came to all people, so also through one righteous act justification that brings life came to all people.
translation:
  language: hi
  text: इसलिए, जैसे एक अपराध के द्वारा सब मनुष्यों के लिए दण्डादेश हुआ, वैसे ही एक धर्मी कार्य के द्वारा सब मनुष्यों के लिए जीवन देनेवाला धर्मी ठहराया जाना हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “एक धर्मी कार्य के द्वारा ... जीवन के धर्मी ठहराए जाने के लिए।”'
    reason: δικαιώματος और δικαίωσιν ζωῆς के अधिक शाब्दिक, संक्षिप्त रूप तथा ζωῆς के संबंध की संभावित अस्पष्टता दिखाने के लिए।
lexical_decisions:
- source_word: Ἄρα οὖν
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयुक्त पद का स्वाभाविक आधुनिक हिन्दी रूप है और पिछले तर्क से संबंध स्पष्ट करता है।
- source_word: παραπτώματος
  choice: अपराध
  rationale: यह किसी गलत कृत्य या उल्लंघन को व्यक्त करता है और यहाँ आदम के एक निर्णायक कृत्य के लिए स्वाभाविक है।
- source_word: κατάκριμα
  choice: दण्ड की आज्ञा
  rationale: यह पद के न्यायिक अर्थ को बनाए रखता है; केवल सामान्य 'न्याय' की अपेक्षा दोषसिद्धि और दण्डादेश का भाव अधिक स्पष्ट करता है।
- source_word: δικαιώματος
  choice: धार्मिक कार्य
  rationale: एकवचन यहाँ एक निर्णायक उचित/धर्मी कृत्य को सूचित करता है। यह अनुवाद उस कृत्य की नैतिक-न्यायिक गुणवत्ता को व्यक्त करता है, बिना पद में नामतः न कही गई व्याख्या जोड़ने के।
- source_word: δικαίωσιν ζωῆς
  choice: वह धर्मी ठहराया जाना जो जीवन देता है
  rationale: यह न्यायिक 'धर्मी ठहराए जाने' और उससे जुड़े जीवनदायी परिणाम—दोनों को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πάντας ἀνθρώπους
  choice: सब मनुष्यों
  rationale: यूनानी में दोनों तुलनात्मक खंडों में यही समान पद दोहराया गया है। यह समावेशी मानवीय दायरे को बनाए रखता है और दूसरे प्रयोग को व्याख्यात्मक रूप से सीमित नहीं करता।
theological_decisions:
- issue: क्या दूसरे 'सब मनुष्यों' को प्रत्यक्ष सार्वभौमिक दायरे से बचाने के लिए सीमित किया जाए
  choice: दोनों खंडों में 'सब मनुष्यों' रखा गया है।
  alternative: '''सब विश्वासियों'' या ''वे सब जो धर्मी ठहराए जाते हैं'''
  rationale: मूल यूनानी दोनों ओर ठीक वही पद दोहराता है। अनुवाद में इसे सीमित करना उस धर्मवैज्ञानिक तनाव को पहले ही सुलझा देना होगा जिसे पद स्वयं व्यापक संदर्भ के लिए खुला छोड़ता है।
- issue: δικαιώματος के कर्ता या विशेष स्वरूप को स्पष्ट करना
  choice: मुख्य पाठ में केवल 'एक धार्मिक कार्य' रखा गया है।
  alternative: '''मसीह के एक आज्ञाकारी कार्य'''
  rationale: संदर्भ इस कार्य को मसीह से जोड़ता है, पर इस पद के वाक्यांश में न नाम दिया गया है, न 'आज्ञाकारी' विशेषण। इसलिए अनुवाद मूल की संक्षिप्तता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। समानांतर 'जैसे... वैसे ही...' संरचना मूल तर्क को बनाए रखती है। न्यायिक शब्दावली में 'दण्ड की आज्ञा' और 'धर्मी ठहराया जाना' चुने गए हैं।
