  source_fidelity: Draft preserves the repeated universal phrase and the comparative structure, but «दण्ड की आज्ञा» is not the judicial-result sense of κατάκριμα, and «धार्मिक कार्य» can mean a religious act rather than a righteous act.
  naturalness: The revised wording is concise, parallel, and idiomatic in modern standard Hindi while retaining the Greek ellipsis/result structure.
  terminology: «दण्डादेश» suitably renders κατάκριμα as a judicial condemnation. «धर्मी कार्य» distinguishes δικαίωμα from merely religious activity. «धर्मी ठहराया जाना» accurately retains the forensic sense of δικαίωσις.
  issues:
  - severity: medium
    issue: «दण्ड की आज्ञा» for κατάκριμα
    rationale: The Greek denotes condemnation/a condemnatory judicial verdict, not an order or command to punish. «दण्डादेश» better conveys the judicial outcome.
  - severity: medium
    issue: «धार्मिक कार्य» for δικαιώματος
    rationale: In current Hindi, «धार्मिक» commonly means religious, whereas the source denotes a righteous or just act. «धर्मी कार्य» more faithfully conveys the intended moral-juridical quality.
  - severity: low
    issue: Asymmetry between «सब मनुष्यों पर» and «सब मनुष्यों के लिए»
    rationale: The same Greek phrase is repeated in both clauses. Using «सब मनुष्यों के लिए» in both preserves the formal parallel and avoids introducing a different relation in the first half.
