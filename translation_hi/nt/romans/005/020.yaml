  text: व्यवस्था अतिरिक्त रूप से आ गई[a], ताकि अपराध[b] बढ़े; पर जहाँ पाप बढ़ा, वहाँ अनुग्रह उससे भी कहीं अधिक उमड़ पड़ा[c]।
