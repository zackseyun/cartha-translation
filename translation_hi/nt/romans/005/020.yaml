lexical_decisions:
- source_word: νόμος
  choice: व्यवस्था
  rationale: सपद νόμος और पौलुस के संदर्भ में यह मूसा की व्यवस्था की ओर संकेत करता है; हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और पहचाना हुआ शब्द है।
- source_word: παρεισῆλθεν
  choice: साथ में आ गई
  rationale: यह क्रिया केवल आने के बजाय किसी अन्य बात के साथ या अतिरिक्त रूप से प्रवेश करने का भाव रखती है। ‘साथ में आ गई’ उस para-भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ἵνα πλεονάσῃ
  choice: ताकि ... बढ़े
  rationale: ἵνα के साथ संभावनार्थक क्रिया उद्देश्य का भाव देती है। ‘ताकि ... बढ़े’ उस व्याकरणिक बल और निहित धर्मवैज्ञानिक तनाव को बिना नरम किए सुरक्षित रखता है।
- source_word: τὸ παράπτωμα
  choice: अपराध
  rationale: यह किसी ठोस उल्लंघन या चूक को दर्शाता है। ‘अपराध’ आधुनिक हिन्दी में स्पष्ट है और इस प्रसंग में आदम के अपराध से जुड़ी पौलुस की दलील के अनुकूल है।
- source_word: οὗ
  choice: जहाँ
  rationale: इस विरोधात्मक संरचना में स्थानवाचक सम्बन्धसूचक क्रियाविशेषण का स्वाभाविक हिन्दी रूप ‘जहाँ’ है।
- source_word: ἁμαρτία
  choice: पाप
  rationale: यह ἁμαρτία का मानक, स्पष्ट और प्रसंगानुकूल हिन्दी अनुवाद है।
- source_word: ὑπερεπερίσσευσεν
  choice: उससे भी कहीं अधिक उमड़ पड़ा
  rationale: यह तीव्र संयुक्त क्रिया साधारण वृद्धि से बढ़कर अत्यधिक प्रचुरता व्यक्त करती है। ‘उमड़ पड़ा’ प्रचुर प्रवाह का चित्र देता है और ‘उससे भी कहीं अधिक’ उसकी तीव्रता को स्पष्ट करता है।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: χάρις के लिए ‘अनुग्रह’ मानक हिन्दी धर्मवैज्ञानिक शब्द है और यहाँ परमेश्वर की कृपा का आशय स्पष्ट करता है।
theological_decisions:
- issue: ἵνα को उद्देश्य के रूप में अनूदित करने से यह तनाव उत्पन्न होता है कि व्यवस्था अपराध बढ़ाने के लिए आई।
  choice: ताकि अपराध बढ़े
  alternative: जिसके परिणामस्वरूप अपराध बढ़ा
  rationale: मूल यूनानी में ἵνα के साथ संभावनार्थक क्रिया उद्देश्य-सदृश अर्थ देती है। अनुवाद को इस तनाव को बनाए रखना चाहिए, न कि परिणामवाचक भाषा से उसे चुपचाप हल करना चाहिए; वाक्य स्वयं पाप की नैतिक स्वीकृति नहीं सिखाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘व्यवस्था’, ‘पाप’ और ‘अनुग्रह’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; ‘उमड़ पड़ा’ तीव्र प्रचुरता को जीवंत किन्तु सम्मानजनक ढंग से व्यक्त करता है।
