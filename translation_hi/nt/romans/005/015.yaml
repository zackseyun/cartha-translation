id: ROM.5.15
reference: Romans 5:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀλλ’ οὐχ ὡς τὸ παράπτωμα, οὕτως καὶ τὸ χάρισμα· εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι οἱ πολλοὶ ἀπέθανον, πολλῷ μᾶλλον ἡ χάρις τοῦ θεοῦ καὶ ἡ δωρεὰ ἐν χάριτι τῇ τοῦ ἑνὸς ἀνθρώπου Ἰησοῦ Χριστοῦ εἰς τοὺς πολλοὺς ἐπερίσσευσεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/015.yaml
  text: But the gift is not like the trespass[a]. For if by the trespass of the one man the many died, much more the grace of God and the gift by the grace of the one man, Jesus the Messiah[b], overflowed to the many.
translation:
  language: hi
  text: परन्तु वरदान अपराध के समान नहीं है। क्योंकि यदि उस एक मनुष्य के अपराध से बहुतों की मृत्यु हो गई, तो परमेश्वर का अनुग्रह और उस एक मनुष्य, यीशु मसीह, के अनुग्रह के द्वारा मिला वरदान[a] बहुतों तक कहीं अधिक मात्रा में पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस एक मनुष्य, यीशु मसीह, के अनुग्रह में मिला वरदान।’
    reason: ἐν χάριτι का अर्थ ‘अनुग्रह के द्वारा’ अथवा ‘अनुग्रह में’ हो सकता है; वैकल्पिक रूप यूनानी संरचना की अस्पष्टता को सुरक्षित रखता है।
lexical_decisions:
- source_word: παράπτωμα
  choice: अपराध
  rationale: यह शब्द आदम के गलत और दोषपूर्ण कार्य को व्यक्त करता है। ‘अपराध’ आधुनिक हिन्दी में स्वाभाविक है और इसके नैतिक तथा विधिक बल को बनाए रखता है।
- source_word: χάρισμα
  choice: वरदान
  rationale: यह परमेश्वर की ओर से अनुग्रहपूर्वक दी गई भेंट है। ‘वरदान’ संक्षिप्त और स्वाभाविक है तथा आगे आने वाले ‘अनुग्रह’ के साथ अनावश्यक दोहराव से बचता है।
- source_word: οἱ πολλοί / τοὺς πολλούς
  choice: बहुतों
  rationale: यह ‘एक’ और ‘बहुतों’ के बीच पौलुस के प्रतिनिधिक विरोध को बनाए रखता है। इसे ‘सब’ कहना इस पद की अभिव्यक्ति को आवश्यकता से अधिक निश्चित कर देता।
- source_word: ἡ χάρις τοῦ θεοῦ
  choice: परमेश्वर का अनुग्रह
  rationale: यह यूनानी संबंधवाचक संरचना को स्पष्ट और प्रतिष्ठित हिन्दी में सीधे व्यक्त करता है।
- source_word: ἡ δωρεὰ ἐν χάριτι
  choice: अनुग्रह के द्वारा मिला वरदान
  rationale: यह ἐν के साधनात्मक अथवा निकट-संबंधात्मक अर्थ को पठनीय हिन्दी में व्यक्त करता है; वैकल्पिक ‘अनुग्रह में मिला वरदान’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: उस एक मनुष्य
  rationale: ‘उस’ और ‘एक’ मिलकर संदर्भ में आदम तथा यीशु के बीच और ‘एक/बहुतों’ के बीच स्पष्ट समानांतर बनाए रखते हैं।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘मसीह’ Χριστός की उपाधिगत और मसीहाई अर्थवत्ता को हिन्दी में स्वाभाविक रीति से बनाए रखता है।
- source_word: ἐπερίσσευσεν
  choice: कहीं अधिक उमड़ पड़ा
  rationale: ‘उमड़ पड़ा’ क्रिया की प्रचुरता और अधिशेष का सजीव भाव व्यक्त करता है, जबकि ‘कहीं अधिक’ πολλῷ μᾶλλον के जोर को सुरक्षित रखता है।
- source_word: εἰς τοὺς πολλούς
  choice: बहुतों के लिए
  rationale: εἰς को यहाँ लाभ अथवा लक्ष्य के अर्थ में लिया गया है; यह वरदान के बहुतों तक पहुँचने का भाव स्पष्ट करता है।
theological_decisions:
- issue: आदम-मसीह समानांतर में ‘बहुतों’ का दायरा
  choice: ‘बहुतों’ रखा गया है; इसे ‘सब’ नहीं बनाया गया।
  alternative: प्रतिनिधिक दायरे को स्पष्ट करने के लिए ‘सब’ कहना।
  rationale: इस पद में पौलुस जानबूझकर ‘एक’ और ‘बहुतों’ की भाषा प्रयोग करता है। ‘बहुतों’ उस तनाव को सुरक्षित रखता है और व्यापक अनुच्छेद से निकले किसी निष्कर्ष को इस अकेले पद पर आरोपित नहीं करता।
- issue: ἐν χάριτι का संबंध और बल
  choice: ‘अनुग्रह के द्वारा मिला वरदान’—साधनात्मक/संबंधात्मक अर्थ।
  alternative: ‘अनुग्रह में मिला वरदान’—अधिक रूपात्मक और खुला अर्थ।
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है, पर यूनानी पदबंध की संभावित संबंधात्मक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, प्रतिष्ठित और सामान्य पाठक के लिए सुबोध रखी गई है। ‘एक’ और ‘बहुतों’ की पुनरावृत्ति जानबूझकर सुरक्षित है। ‘मृत्यु हुई’ सामूहिक कर्ता के साथ स्वाभाविक हिन्दी देता है, और ‘उमड़ पड़ा’ पौलुस के प्रचुरता-वाले तर्क को सजीव बनाता है।
