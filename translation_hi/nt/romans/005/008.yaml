source:
  edition: SBLGNT
  text: συνίστησιν δὲ τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς ὁ θεὸς ὅτι ἔτι ἁμαρτωλῶν ὄντων ἡμῶν Χριστὸς ὑπὲρ ἡμῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/008.yaml
  text: But God demonstrates his own love for us in that while we were still sinners[c][b][a], Messiah died for us.
translation:
  language: hi
  text: 'परन्तु परमेश्वर हमारे प्रति अपने प्रेम को इस प्रकार प्रकट करता है: जब हम पापी ही थे, तभी मसीह हमारे लिए मर गया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हमारे लिए’ का अनुवाद ‘हमारी ओर से’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνίστησιν
  choice: प्रकट करता है
  rationale: वर्तमानकालीन क्रिया यहाँ परमेश्वर के प्रेम को प्रत्यक्ष रूप से दिखाने या प्रमाणित करने का भाव रखती है; ‘प्रकट करता है’ आधुनिक, स्वाभाविक और साक्ष्यात्मक बल के अनुकूल है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले विचार के साथ हल्का विरोध दर्शाता है; ‘परन्तु’ तर्क के इस मोड़ को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τὴν ἑαυτοῦ ἀγάπην εἰς ἡμᾶς
  choice: हमारे प्रति अपने प्रेम को
  rationale: ‘अपने’ ἑαυτοῦ के बलाघात को और ‘हमारे प्रति’ εἰς ἡμᾶς में प्रेम की हमारी ओर दिशा को स्पष्ट रखता है।
- source_word: ὅτι
  choice: इस प्रकार
  rationale: यह आगे आने वाली घटना को उस रीति या आधार के रूप में प्रस्तुत करता है जिससे परमेश्वर का प्रेम प्रकट होता है; हिन्दी में द्विबिंदु के साथ यह संबंध सहज है।
- source_word: ἔτι ἁμαρτωλῶν ὄντων ἡμῶν
  choice: जब हम पापी ही थे, तभी
  rationale: यह संबंधवाचक निरपेक्ष रचना का कालगत और रियायती बल व्यक्त करता है; ‘ही’ और ‘तभी’ ἔτι के आश्चर्यजनक विरोध को स्वाभाविक हिन्दी में उभारते हैं।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός मसीहाई उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में स्थापित और अर्थपूर्ण रूप है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे लिए
  rationale: ὑπέρ लाभ, पक्ष या प्रतिनिधिक संबंध बता सकता है; ‘हमारे लिए’ किसी एक प्रायश्चित्त-सिद्धान्त को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ बचाता है।
- source_word: ἀπέθανεν
  choice: मर गया
  rationale: साधारण भूतकालीन घटना का सीधा और स्वाभाविक हिन्दी अनुवाद।
theological_decisions:
- issue: पौलुस के कथन में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ शब्द उपाधि का मसीहाई अर्थ रखता है; हिन्दी में ‘मसीह’ उस अर्थ को अनूदित करता है और केवल नाम-जैसा रूप नहीं बनाता।
- issue: ὑπὲρ ἡμῶν का धर्मवैज्ञानिक विस्तार
  choice: हमारे लिए
  alternative: हमारी ओर से / हमारे स्थान पर
  rationale: मूल पाठ स्पष्टतः उनकी मृत्यु को हमारे हित और संबंध में रखता है, पर अकेला यह पद ‘हमारे स्थान पर’ जैसी अधिक विशिष्ट व्याख्या को अनिवार्य नहीं करता; इसलिए व्यापक अभिव्यक्ति रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘हमारे प्रति’ और ‘हमारे लिए’ द्वारा εἰς तथा ὑπέρ का अंतर बनाए रखा गया है। मुख्य वाक्य में स्पष्टता के लिए द्विबिंदु प्रयुक्त है।
