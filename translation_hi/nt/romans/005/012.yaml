  text: Διὰ τοῦτο ὥσπερ δι’ ἑνὸς ἀνθρώπου ἡ ἁμαρτία εἰς τὸν κόσμον εἰσῆλθεν καὶ διὰ τῆς ἁμαρτίας ὁ θάνατος, καὶ οὕτως εἰς πάντας ἀνθρώπους ὁ θάνατος διῆλθεν ἐφ’ ᾧ πάντες ἥμαρτον—
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/012.yaml
  text: Therefore[a], just as sin entered into the world through one man, and death through sin, so also death spread to all people, because all sinned—
translation:
  language: hi
  text: इसलिए, जैसे एक मनुष्य के द्वारा पाप संसार में आया, और पाप के द्वारा मृत्यु आई, वैसे ही मृत्यु सभी मनुष्यों तक फैल गई, क्योंकि सबने पाप किया[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परंपरागत अर्थ में, “उस एक मनुष्य में सबने पाप किया।”
    reason: ἐφ’ ᾧ की प्रतिनिधिक/समावेशी वैकल्पिक व्याख्या को सुरक्षित रखना।
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्षात्मक संबंध दिखाता है और आधुनिक हिन्दी में स्वाभाविक तथा संक्षिप्त है।
- source_word: δι’ ἑνὸς ἀνθρώπου
  choice: एक मनुष्य के द्वारा
  rationale: διά के संबंधकारक प्रयोग की माध्यमवाचक शक्ति को रखता है; संदर्भ में यह आदम नामक पुरुष की ओर संकेत करता है और आगे की प्रतिरूपात्मक तुलना बनाए रखता है।
- source_word: ἡ ἁμαρτία
  choice: पाप
  rationale: पौलुस के इस व्यक्तिवाची-सदृश प्रयोग को बिना अनावश्यक विस्तार के मानक हिन्दी शब्द से व्यक्त करता है।
- source_word: εἰς τὸν κόσμον εἰσῆλθεν
  choice: संसार में आया
  rationale: εἰς की दिशात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τῆς ἁμαρτίας ὁ θάνατος
  choice: पाप के द्वारा मृत्यु आई
  rationale: माध्यमवाचक संबंध और समानांतर क्रम—एक मनुष्य के द्वारा पाप, पाप के द्वारा मृत्यु—को स्पष्ट रखता है।
- source_word: οὕτως
  choice: वैसे ही
  rationale: ‘जैसे…वैसे ही’ रचना यूनानी तुलना और उसके परिणामात्मक संबंध को सहज हिन्दी में बनाए रखती है।
- source_word: εἰς πάντας ἀνθρώπους
  choice: सब मनुष्यों में
  rationale: यह पूरी मानवजाति को समावेशी रूप से दर्शाता है; हिन्दी में ‘मनुष्य’ यहाँ स्त्री-पुरुष सभी के लिए सामान्य जातिवाचक शब्द है।
- source_word: ὁ θάνατος διῆλθεν
  choice: मृत्यु … फैल गई
  rationale: διέρχομαι के व्यापक मानवीय प्रसार के भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐφ’ ᾧ
  choice: क्योंकि
  rationale: संदर्भ में कारणवाचक अर्थ सबसे स्वाभाविक है, पर इसकी प्रसिद्ध वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: πάντες ἥμαρτον
  choice: सबने पाप किया
  rationale: यूनानी अनिश्चित भूतकाल को हिन्दी के सामान्य पूर्ण भूत रूप में रखता है और कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ἐφ’ ᾧ πάντες ἥμαρτον का अर्थ
  choice: 'कारणवाचक: ‘क्योंकि सबने पाप किया’'
  alternative: 'प्रतिनिधिक/समावेशी: ‘जिसमें सबने पाप किया’'
  rationale: ἐφ’ ᾧ का कारणवाचक अर्थ इस संदर्भ में व्याकरण और प्रवाह के अनुसार अधिक स्वाभाविक है। फिर भी आदम और मानवजाति के संबंध पर इसका धर्मवैज्ञानिक महत्व होने के कारण परंपरागत प्रतिनिधिक पाठ को हटाया नहीं गया, बल्कि पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जैसे…वैसे ही’ से मूल वाक्य की अधूरी तुलना और अंत का दीर्घ विराम सुरक्षित है; विचार अगले पदों में पूरा होता है।
