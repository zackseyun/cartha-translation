  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα ὥσπερ ἐβασίλευσεν ἡ ἁμαρτία ἐν τῷ θανάτῳ, οὕτως καὶ ἡ χάρις βασιλεύσῃ διὰ δικαιοσύνης εἰς ζωὴν αἰώνιον διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/021.yaml
  text: so that[a], just as sin reigned in death[c][b], so also grace might reign through righteousness to eternal life through Jesus the Messiah our Lord.
translation:
  language: hi
  text: ताकि, जैसे पाप ने मृत्यु में राज्य किया, वैसे ही अनुग्रह भी धार्मिकता के द्वारा अनन्त जीवन के लिए हमारे प्रभु यीशु मसीह के द्वारा राज्य करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘धार्मिकता’ का अनुवाद ‘न्याय’ भी हो सकता है।
    reason: δικαιοσύνη का सम्भव अर्थ-विकल्प।
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का संबंध व्यक्त करता है और इसके बाद आने वाले संभावनार्थक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐβασίλευσεν
  choice: राज किया
  rationale: पौलुस के राजकीय मानवीकरण को सुरक्षित रखते हुए भूतकाल को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν τῷ θανάτῳ
  choice: मृत्यु में
  rationale: ἐν के क्षेत्र-सूचक अर्थ को संक्षिप्त रूप में सुरक्षित रखता है; इसे कारण या साधन मानकर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: χάρις का प्रचलित और गरिमापूर्ण हिन्दी रूप है तथा पाप के साथ उसके मानवीकृत विरोध को बनाए रखता है।
- source_word: βασιλεύσῃ
  choice: राज करे
  rationale: ἵνα के साथ प्रयुक्त संभावनार्थक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ δικαιοσύνης
  choice: धार्मिकता के द्वारा
  rationale: διά के साधन-सूचक अर्थ और δικαιοσύνη के पौलुसी अर्थ-क्षेत्र को सुरक्षित रखता है।
- source_word: εἰς ζωὴν αἰώνιον
  choice: अनन्त जीवन तक पहुँचाए
  rationale: εἰς की लक्ष्य-दिशा को हिन्दी में स्पष्ट करता है और अनुग्रह के राज करने के परिणाम को स्वाभाविक वाक्य में व्यक्त करता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु यीशु मसीह के द्वारा
  rationale: διά को माध्यम के रूप में व्यक्त करता है; Χριστός को प्रचलित हिन्दी उपाधि ‘मसीह’ और κύριος को ‘प्रभु’ के रूप में रखता है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ-क्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ ‘धार्मिकता’ पौलुस की परिचित धर्मवैचारिक शब्दावली और अनुग्रह से उसके संबंध को सुरक्षित रखती है; ‘न्याय’ संभव अर्थ-छाया है, पर मुख्य पाठ में उसे रखने से अर्थ अधिक संकीर्ण हो सकता है।
- issue: εἰς ζωὴν αἰώνιον का वाक्यगत संबंध
  choice: अनुग्रह राज करे और अनन्त जीवन तक पहुँचाए
  alternative: अनन्त जीवन के लिए राज करे
  rationale: ग्रीक में εἰς लक्ष्य या परिणाम बताता है। हिन्दी में ‘पहुँचाए’ जोड़ना इस दिशा को सहज बनाता है, जबकि यह अस्पष्टता बनी रहती है कि लक्ष्य मुख्यतः अनुग्रह के राज्य का परिणाम है।
- issue: Χριστός का उपाधि-सूचक रूप
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ आधुनिक हिन्दी में उपाधि का अर्थ अधिक पारदर्शी ढंग से व्यक्त करता है और इसे केवल व्यक्तिगत नाम की तरह नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक-पाठ योग्य रूप। ‘राज किया/राज करे’ से मूल का राजकीय रूपक तथा पाप और अनुग्रह का मानवीकरण बनाए रखा गया है।
