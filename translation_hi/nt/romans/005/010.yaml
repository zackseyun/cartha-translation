id: ROM.5.10
reference: Romans 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ ἐχθροὶ ὄντες κατηλλάγημεν τῷ θεῷ διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ, πολλῷ μᾶλλον καταλλαγέντες σωθησόμεθα ἐν τῇ ζωῇ αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/010.yaml
  text: For if[a], while we were enemies, we were reconciled to God through the death of his Son, much more, having been reconciled, will we be saved by his life.
translation:
  language: hi
  text: क्योंकि यदि जब हम शत्रु थे, तब उसके पुत्र की मृत्यु के द्वारा हमारा परमेश्वर से मेल कराया गया, तो मेल कराए जाने के बाद हम उसके जीवन के द्वारा[a] और भी अधिक बचाए जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके जीवन में।”
    reason: यूनानी ἐν τῇ ζωῇ αὐτοῦ का स्थानिक अथवा सहभागितामूलक अर्थ भी संभव है।
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले कथन का कारण प्रस्तुत करता है और εἰ शर्तात्मक तर्क बनाए रखता है; इसलिए पौलुस की तर्क-शृंखला को बिना 'क्योंकि' या 'यदि' हटाए सुरक्षित रखा गया है।
- source_word: ἐχθροὶ ὄντες
  choice: हम शत्रु रहते हुए
  rationale: यह ὄντες की परिस्थितिजन्य शक्ति और ἐχθροί की संबंधपरक शत्रुता, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατηλλάγημεν / καταλλαγέντες
  choice: मेल कराए गए / मेल कराए जाने के बाद
  rationale: दोनों निष्क्रिय रूपों को बनाए रखते हुए परमेश्वर द्वारा संबंध बहाल किए जाने का भाव व्यक्त होता है; कृदंत की क्रिया भावी उद्धार से पहले की है।
- source_word: τῷ θεῷ
  choice: परमेश्वर से
  rationale: हिन्दी में 'मेल कराना' के साथ 'से' स्वाभाविक है और परमेश्वर के साथ बहाल संबंध को स्पष्ट करता है।
- source_word: διὰ τοῦ θανάτου τοῦ υἱοῦ αὐτοῦ
  choice: उसके पुत्र की मृत्यु के द्वारा
  rationale: διά + संबंधकारक के साधनात्मक भाव और 'उसके पुत्र' की पुत्र-संबंधी उपाधि को निकटता से सुरक्षित रखता है।
- source_word: πολλῷ μᾶλλον
  choice: और भी निश्चय से
  rationale: इस प्रसंग में पौलुस के अधिक-से-अधिक निश्चित निष्कर्ष को सहज हिन्दी में व्यक्त करता है, न कि उद्धार की मात्रा को।
- source_word: σωθησόμεθα
  choice: बचाए जाएँगे
  rationale: भविष्यकाल और कर्मवाच्य दोनों सुरक्षित हैं; 'बचाए जाना' सामान्य पाठक के लिए स्वाभाविक है और उद्धार का भाव रखता है।
- source_word: ἐν τῇ ζωῇ αὐτοῦ
  choice: उसके जीवन के द्वारा
  rationale: मृत्यु के द्वारा मेल और जीवन के द्वारा भावी उद्धार के समानांतर विरोध को व्यक्त करता है; ἐν का स्थानिक/सहभागितामूलक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἐν τῇ ζωῇ αὐτοῦ का अर्थ
  choice: 'साधनात्मक: ''उसके जीवन के द्वारा'''
  alternative: 'स्थानिक/सहभागितामूलक: ''उसके जीवन में'''
  rationale: निकटवर्ती 'उसके पुत्र की मृत्यु के द्वारा' के साथ मृत्यु–जीवन का समानांतर साधनात्मक अर्थ का समर्थन करता है, पर यूनानी ἐν की वास्तविक वैकल्पिक संभावना को पादटिप्पणी में रखा गया है।
- issue: πολλῷ μᾶλλον का बल
  choice: '''और भी निश्चय से'''
  alternative: '''कितना अधिक'''
  rationale: तर्क यह नहीं कि उद्धार मात्रा में अधिक होगा, बल्कि यह कि मेल हो जाने के कारण भावी उद्धार और अधिक निश्चित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'मेल कराए गए' निष्क्रिय वाच्य तथा संबंध की बहाली दोनों को व्यक्त करता है; 'और भी निश्चय से' पौलुस के तर्क की शक्ति को स्वाभाविक हिन्दी में सामने लाता है।
