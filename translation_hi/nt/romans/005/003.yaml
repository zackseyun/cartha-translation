id: ROM.5.3
reference: Romans 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ καὶ ⸀καυχώμεθα ἐν ταῖς θλίψεσιν, εἰδότες ὅτι ἡ θλῖψις ὑπομονὴν κατεργάζεται,
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/003.yaml
  text: And not only that[a], but we also rejoice in afflictions, knowing that affliction produces endurance[c][b],
translation:
  language: hi
  text: इतना ही नहीं, बल्कि हम क्लेशों में भी आनन्दित होते हैं,[a] क्योंकि हम जानते हैं कि क्लेश धीरज उत्पन्न करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम क्लेशों में भी गर्व करते हैं” अथवा “गौरव करते हैं।”
    reason: lexical_alternative
  - marker: b
    text: “धीरज” का अर्थ कठिनाइयों में दृढ़ता से टिके रहना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καυχώμεθα
  choice: आनन्दित होते हैं
  rationale: यहाँ क्रिया आत्म-अभिमान नहीं, बल्कि परमेश्वर के कार्य पर आधारित उल्लासपूर्ण भरोसा व्यक्त करती है। ‘आनन्दित होते हैं’ आधुनिक हिन्दी में स्वाभाविक है; ‘गर्व करते हैं’ मूल की शेखी/गौरव की छाया को अधिक सीधे रखता है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: θλίψεσιν / θλῖψις
  choice: क्लेशों / क्लेश
  rationale: ‘क्लेश’ दबाव, दुःख और विपत्ति के अर्थ-क्षेत्र को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है। पहले प्रयोग में यूनानी बहुवचन और सामान्य सिद्धान्त में एकवचन का भेद सुरक्षित रखा गया है।
- source_word: ὑπομονήν
  choice: धीरज
  rationale: ‘धीरज’ कठिन दबाव में टिके रहने वाली सहनशील दृढ़ता को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: κατεργάζεται
  choice: उत्पन्न करता है
  rationale: 'यह परिणामकारी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है: क्लेश धीरज को जन्म देता या विकसित करता है।'
- source_word: εἰδότες
  choice: क्योंकि हम जानते हैं
  rationale: यूनानी कृदन्त मुख्य कथन के ज्ञान-आधारित कारण को सूचित करता है। हिन्दी में कारणसूचक उपवाक्य अधिक स्वाभाविक है, यद्यपि ‘यह जानते हुए कि’ अधिक रूपगत विकल्प है।
theological_decisions:
- issue: καυχώμεθα का सकारात्मक आत्मिक अर्थ
  choice: आनन्दित होते हैं
  alternative: गर्व करते हैं / गौरव करते हैं
  rationale: सन्दर्भ में पौलुस का आशय आत्म-केंद्रित डींग नहीं, बल्कि परमेश्वर के कार्य के कारण क्लेशों में भी उल्लास और भरोसा है। मुख्य पाठ स्वाभाविक अर्थ देता है और पादटिप्पणी मूल क्रिया की ‘गौरव/शेखी’ संबंधी अर्थ-छाया सुरक्षित रखती है।
- issue: क्लेश और धीरज के बीच सम्बन्ध
  choice: क्लेश धीरज उत्पन्न करता है
  alternative: क्लेश धीरज को विकसित करता है
  rationale: मूल पाठ स्पष्ट परिणामकारी सम्बन्ध बताता है, पर यह नहीं खोलता कि प्रक्रिया तत्काल है या क्रमिक; इसलिए उसी संक्षिप्त तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘इतना ही नहीं’ पूर्ववर्ती विचार से οὐ μόνον δέ का सम्बन्ध बनाए रखता है। यूनानी में ‘हमारे’ नहीं है, इसलिए ‘क्लेशों’ के साथ उसे नहीं जोड़ा गया।
