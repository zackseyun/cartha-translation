source:
  edition: SBLGNT
  text: δι’ οὗ καὶ τὴν προσαγωγὴν ἐσχήκαμεν τῇ πίστει εἰς τὴν χάριν ταύτην ἐν ᾗ ἑστήκαμεν, καὶ καυχώμεθα ἐπ’ ἐλπίδι τῆς δόξης τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/002.yaml
  text: through whom we also have obtained access by faith into this grace in which we stand[a], and we boast in the hope of the glory of God.
translation:
  language: hi
  text: उसी के द्वारा हमें विश्वास से इस अनुग्रह तक पहुँच भी मिली है, जिसमें हम खड़े हैं; और हम परमेश्वर की महिमा की आशा में गर्व करते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्दित होते हैं” अथवा “उल्लसित होते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσαγωγή
  choice: प्रवेश
  rationale: यह शब्द मसीह के द्वारा परमेश्वर के अनुग्रह की स्थिति में पहुँच मिलने का भाव स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: πίστει
  choice: विश्वास से
  rationale: करणवाचक दत्तिव का स्वाभाविक हिन्दी रूप है और बताता है कि यह प्रवेश विश्वास के माध्यम से मिला है।
- source_word: χάρις
  choice: अनुग्रह
  rationale: पौलुस के इस प्रसंग में यह परमेश्वर की कृपापूर्ण स्वीकृति और प्रदान की हुई स्थिति के लिए स्थापित तथा उपयुक्त शब्द है।
- source_word: ἑστήκαμεν
  choice: हम स्थिर खड़े हैं
  rationale: पूर्णकाल से उत्पन्न वर्तमान और बनी हुई स्थिति को व्यक्त करता है; ‘स्थिर’ हिन्दी में इस निरंतर स्थिति को स्पष्ट करता है।
- source_word: καυχώμεθα
  choice: हम गर्व करते हैं
  rationale: यूनानी क्रिया की जानबूझकर रखी गई प्रबल और कुछ तनावपूर्ण भाषा को बनाए रखता है; यहाँ गर्व का आधार अपनी उपलब्धि नहीं, परमेश्वर की महिमा की आशा है।
- source_word: ἐπ’ ἐλπίδι
  choice: आशा पर
  rationale: 'ἐπί के आधार-सूचक भाव को बनाए रखता है: परमेश्वर की महिमा की आशा ही इस गर्व का आधार है।'
- source_word: δόξης τοῦ θεοῦ
  choice: परमेश्वर की महिमा
  rationale: सम्बन्धकारक रचना का सीधा, गरिमापूर्ण और पारदर्शी हिन्दी रूप है।
theological_decisions:
- issue: καυχώμεθα की ऐसी अभिव्यक्ति जो पौलुस की धर्मवैचारिक तनावपूर्ण भाषा बनाए रखे
  choice: हम गर्व करते हैं
  alternative: हम आनन्दित होते हैं / हम उल्लसित होते हैं
  rationale: ‘गर्व करते हैं’ मूल क्रिया की आलंकारिक शक्ति और निकटवर्ती प्रयोगों से उसका शब्दगत संबंध बनाए रखता है। नरम विकल्प प्रसंग में सम्भव हैं, पर मूल की चौंकाने वाली धार को घटाते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘उसी के द्वारा’ पिछले पद में उल्लिखित यीशु मसीह से संबंध बनाए रखता है। मुख्य पाठ में ‘गर्व’ रखकर मूल की धर्मवैचारिक तनावपूर्ण भाषा सुरक्षित की गई है और सहज विकल्प पादटिप्पणी में दिए गए हैं।
