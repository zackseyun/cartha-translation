source:
  edition: SBLGNT
  text: ἡ δὲ ὑπομονὴ δοκιμήν, ἡ δὲ δοκιμὴ ἐλπίδα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/004.yaml
  text: and endurance produces proven character[a], and proven character produces hope.
translation:
  language: hi
  text: और धीरज से खरा चरित्र[a], और खरे चरित्र से आशा उत्पन्न होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परखा हुआ चरित्र’ अथवा ‘स्वीकृति’।
    reason: δοκιμή के अर्थ-क्षेत्र में जाँच से प्रमाणित चरित्र और स्वीकृति, दोनों भाव संभव हैं।
lexical_decisions:
- source_word: ὑπομονή
  choice: धीरज
  rationale: यह शब्द कठिनाई के बीच टिके रहने और सहते हुए आगे बढ़ने का भाव स्वाभाविक, संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δοκιμή
  choice: खरा चरित्र
  rationale: यह केवल सामान्य नैतिक चरित्र नहीं, बल्कि परीक्षा में जाँचा और सच्चा सिद्ध हुआ चरित्र दर्शाता है। ‘खरा’ जाँच के परिणाम और प्रामाणिकता—दोनों को सहज हिन्दी में रखता है।
- source_word: ἐλπίς
  choice: आशा
  rationale: यह मानक और स्वाभाविक हिन्दी समानार्थी है; संदर्भ में इसकी परमेश्वर-आधारित अपेक्षा निहित रहती है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ विरोध नहीं, क्रम की अगली कड़ी जोड़ता है; इसलिए ‘और’ उपयुक्त है।
- source_word: ellipsis of κατεργάζεται
  choice: उत्पन्न होती है
  rationale: यूनानी में पिछली पंक्ति की क्रिया दोनों खंडों में समझी जाती है। हिन्दी में वाक्य को पूरा और स्वाभाविक बनाने के लिए इसे अंत में व्यक्त किया गया है और दोनों चरणों पर लागू होने दिया गया है।
theological_decisions:
- issue: पवित्रीकरण की क्रमिक कड़ी में δοκιμή का अर्थ
  choice: परीक्षा में खरा सिद्ध हुआ चरित्र
  alternative: परीक्षण की प्रक्रिया; स्वीकृति
  rationale: यहाँ δοκιμή धीरज के परिणाम के रूप में आता है, इसलिए परीक्षण की घटना के बजाय उससे खरा सिद्ध हुआ चरित्र अधिक संगत है। फिर भी ‘स्वीकृति’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। समानांतर यूनानी संरचना को ‘और... और...’ से बनाए रखा गया है।
