id: ROM.5.17
reference: Romans 5:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ τῷ τοῦ ἑνὸς παραπτώματι ὁ θάνατος ἐβασίλευσεν διὰ τοῦ ἑνός, πολλῷ μᾶλλον οἱ τὴν περισσείαν τῆς χάριτος καὶ τῆς δωρεᾶς τῆς δικαιοσύνης λαμβάνοντες ἐν ζωῇ βασιλεύσουσιν διὰ τοῦ ἑνὸς Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/017.yaml
  text: For if[a], by the trespass of the one, death reigned through the one, much more will those who receive the abundance of grace and the gift of righteousness reign in life through the one[b], Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि यदि एक व्यक्ति के अपराध के कारण मृत्यु ने उसी एक व्यक्ति के द्वारा राज्य किया, तो जो लोग अनुग्रह की बहुतायत और धार्मिकता[a] का वरदान पाते हैं, वे जीवन में उस एक व्यक्ति, यीशु मसीह[b], के द्वारा कहीं अधिक राज्य करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय का वरदान।”
    reason: lexical_alternative
  - marker: b
    text: या, “यीशु मसीहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπτώματι
  choice: अपराध
  rationale: यह शब्द सीमा लाँघने या गलत कदम उठाने से हुए उल्लंघन का भाव देता है और आदम तथा मसीह के बीच पौलुस की तुलना में स्वाभाविक हिन्दी है।
- source_word: ἐβασίλευσεν / βασιλεύσουσιν
  choice: राज किया / राज करेंगे
  rationale: दोनों क्रियाओं में निहित राजकीय रूपक और उनके जानबूझकर बनाए गए समानांतर को सुरक्षित रखा गया है।
- source_word: περισσείαν τῆς χάριτος
  choice: अनुग्रह की बहुतायत
  rationale: ‘बहुतायत’ अत्यधिक परिपूर्णता का भाव देता है, जबकि ‘अनुग्रह’ χάρις के दैवी कृपा और उपहार-संबंधी अर्थ को बनाए रखता है।
- source_word: δωρεᾶς τῆς δικαιοσύνης
  choice: धार्मिकता का वरदान
  rationale: यह सम्बन्धकारक पदबंध को खुला रखता है और δικαιοσύνη के पौलुसी अर्थ को किसी एक व्याख्यात्मक सिद्धान्त तक सीमित नहीं करता।
- source_word: λαμβάνοντες
  choice: पाते हैं
  rationale: वर्तमान कृदन्त उन लोगों की पहचान उन्हें वरदान पाने वालों के रूप में कराता है; हिन्दी में ‘पाते हैं’ सहज और ग्रहणशीलता का सूचक है।
- source_word: ἐν ζωῇ
  choice: जीवन में
  rationale: संक्षिप्त यूनानी अभिव्यक्ति और पहले आए मृत्यु के राज के साथ उसका विरोध सुरक्षित रहता है।
- source_word: τοῦ ἑνὸς
  choice: उस एक जन
  rationale: यूनानी का पुल्लिंग ‘एक’ किसी व्यक्ति की ओर संकेत करता है। ‘जन’ संदर्भ को स्पष्ट करता है, पर ‘आदम’ नाम जोड़कर निहित संकेत को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में यह स्वाभाविक नाम-उपाधि रूप है और Χριστός के मसीही अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: δικαιοσύνης का पौलुसी अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: तात्कालिक आदम-मसीह और धर्मी ठहराए जाने के संदर्भ में ‘धार्मिकता’ उपयुक्त मुख्य पाठ है; फिर भी न्याय या सही व्यवस्था का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ‘एक’ की पहचान
  choice: एक जन / उस एक जन
  alternative: एक मनुष्य / आदम
  rationale: पुल्लिंग यूनानी रूप को स्वाभाविक हिन्दी में व्यक्त किया गया है, लेकिन जहाँ मूल पाठ नाम नहीं लेता वहाँ ‘आदम’ जोड़कर संकेत को स्पष्ट नहीं किया गया।
- issue: Χριστοῦ का रूप
  choice: मसीह
  alternative: मसीहा / अभिषिक्त जन
  rationale: ‘यीशु मसीह’ हिन्दी में स्वाभाविक है और उपाधि के नाम-जैसे प्रयोग को बनाए रखता है; मूल उपाधि का अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘राज किया/राज करेंगे’ की पुनरावृत्ति मूल के केंद्रीय राजकीय रूपक को बनाए रखती है; ‘कहीं अधिक’ πολλῷ μᾶλλον के प्रबल तुलनात्मक बल को व्यक्त करता है।
