  text: ⸂Ἔτι γὰρ⸃ Χριστὸς ὄντων ἡμῶν ἀσθενῶν ⸀ἔτι κατὰ καιρὸν ὑπὲρ ἀσεβῶν ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/006.yaml
  text: For while we were still weak[a], at the right time Messiah died for the ungodly.
translation:
  language: hi
  text: क्योंकि जब हम अब भी निर्बल थे, तब मसीह ठीक समय पर भक्तिहीनों के लिए[a] मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भक्तिहीनों की ओर से।”
    reason: ὑπὲρ के प्रतिनिधिक अर्थ की सम्भावना को दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: Χριστός को उपाधि के रूप में स्वाभाविक और प्रचलित हिन्दी शब्द “मसीह” से व्यक्त किया गया है।
- source_word: ὄντων ἡμῶν ἀσθενῶν
  choice: जब हम अब भी निर्बल ही थे
  rationale: सम्बन्धकारक निरपेक्ष रचना को सहज कालवाचक उपवाक्य बनाया गया है; “निर्बल” व्यापक अक्षमता को बनाए रखता है।
- source_word: ἔτι
  choice: अब भी … ही
  rationale: यह जारी अवस्था पर बल देता है; हिन्दी में “अब भी” और बलसूचक “ही” उसके भाव को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: κατὰ καιρὸν
  choice: ठीक समय पर
  rationale: वाक्यांश उपयुक्त या नियत अवसर का संकेत देता है; यह चुनाव उस अर्थ को अनावश्यक व्याख्या के बिना स्पष्ट रखता है।
- source_word: ὑπὲρ
  choice: के लिए
  rationale: यह लाभ, प्रतिनिधित्व या स्थानापन्नता की सम्भावित छायाओं को किसी एक व्यवस्थित सिद्धान्त तक सीमित किए बिना खुला रखता है।
- source_word: ἀσεβῶν
  choice: भक्तिहीनों
  rationale: यह परमेश्वर के प्रति श्रद्धा न रखने वालों के नैतिक-धार्मिक अर्थ को व्यक्त करता है और केवल सैद्धान्तिक नास्तिकता का बोध नहीं कराता।
- source_word: ἀπέθανεν
  choice: प्राण दे दिए
  rationale: हिन्दी में किसी के लिए स्वेच्छापूर्वक मरने के प्रसंग में यह सहज और गरिमापूर्ण अभिव्यक्ति है; इसका मूल अर्थ “मर गया” ही है।
theological_decisions:
- issue: ὑπὲρ ἀσεβῶν में मसीह की मृत्यु का सम्बन्ध
  choice: भक्तिहीनों के लिए
  alternative: भक्तिहीनों की ओर से
  rationale: “के लिए” उनके हित में मृत्यु और सम्भावित प्रतिनिधिक/स्थानापन्न अर्थ को बनाए रखता है, पर यूनानी से आगे जाकर किसी एक धर्मवैज्ञानिक व्याख्या को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। “निर्बल” और “भक्तिहीन” जैसे शब्द मूल की व्यापक नैतिक-धार्मिक अर्थछाया बनाए रखते हैं।
