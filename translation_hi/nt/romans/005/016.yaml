id: ROM.5.16
reference: Romans 5:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐχ ὡς δι’ ἑνὸς ἁμαρτήσαντος τὸ δώρημα· τὸ μὲν γὰρ κρίμα ἐξ ἑνὸς εἰς κατάκριμα, τὸ δὲ χάρισμα ἐκ πολλῶν παραπτωμάτων εἰς δικαίωμα.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/016.yaml
  text: And the gift is not like what came through the one who sinned[a]. For the judgment from one trespass led to condemnation[c][b], but the gracious gift from many trespasses led to justification.
translation:
  language: hi
  text: और यह दान उस परिणाम जैसा नहीं है जो उस एक व्यक्ति के पाप करने से आया।[a] क्योंकि न्याय-निर्णय एक ही अपराध से दोषी ठहराए जाने तक पहुँचा, पर अनुग्रह का वरदान बहुत-से अपराधों से धर्मी ठहराए जाने तक पहुँचा।[c][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से इसका अनुवाद यह भी हो सकता है: ‘और दान वैसा नहीं है जैसा एक पाप करनेवाले के द्वारा आया।’ यूनानी वाक्य संक्षिप्त है; संदर्भ में वह व्यक्ति आदम है।'
    reason: lexical_alternative
  - marker: b
    text: यूनानी में केवल ‘एक से’ है; इसका अर्थ ‘एक व्यक्ति से’ भी हो सकता है।
    reason: textual_ambiguity
  - marker: c
    text: या ‘धर्मसम्मत निर्णय तक पहुँचा’ अथवा ‘निर्दोष ठहराए जाने तक पहुँचा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δώρημα
  choice: दान
  rationale: यह शब्द दी हुई भेंट को दर्शाता है। ‘दान’ संक्षिप्त, स्वाभाविक है और मूल शब्द में निहित उपहार के भाव को व्यक्त करता है।
- source_word: δι’ ἑνὸς ἁμαρτήσαντος
  choice: उस एक व्यक्ति के पाप करने से आया
  rationale: यह संक्षिप्त यूनानी रचना एक पाप करनेवाले व्यक्ति—संदर्भ में आदम—के माध्यम से आए परिणाम की ओर संकेत करती है। हिंदी में तुलना स्पष्ट करने के लिए ‘परिणाम’ जोड़ा गया है, जबकि व्यक्तिगत संदर्भ बनाए रखा गया है।
- source_word: κρίμα
  choice: न्याय-निर्णय
  rationale: यहाँ शब्द न्यायिक निर्णय को दर्शाता है और κατάκριμα तथा δικαίωμα के साथ न्यायालय-संबंधी विरोध बनाता है।
- source_word: ἐξ ἑνὸς
  choice: एक ही अपराध से
  rationale: नपुंसकलिंग ἑνός को बाद के ‘बहुत-से अपराधों’ के विपरीत एक अपराध के रूप में समझना संदर्भानुकूल है; फिर भी ‘एक व्यक्ति से’ की व्याकरणिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: κατάκριμα
  choice: दोषी ठहराए जाने
  rationale: यह न्यायिक दोषनिर्णय को व्यक्त करता है। यह आधुनिक हिंदी में स्पष्ट है और δικαίωμα के साथ सीधा विरोध बनाता है।
- source_word: χάρισμα
  choice: अनुग्रह का वरदान
  rationale: χάρισμα अनुग्रह से दिए गए उपहार पर बल देता है। यह पद के पहले ‘दान’ से शब्दगत भेद भी बनाए रखता है।
- source_word: παραπτωμάτων
  choice: अपराधों
  rationale: यह शब्द नैतिक चूक या उल्लंघन को दर्शाता है। ‘अपराध’ सामान्य पाठक के लिए सुबोध है और इस प्रसंग के नैतिक-न्यायिक भाव को बनाए रखता है।
- source_word: δικαίωμα
  choice: धर्मी ठहराए जाने
  rationale: κατάκριμα के विपरीत यहाँ यह अनुकूल न्यायिक परिणाम को दर्शाता है। ‘धर्मी ठहराया जाना’ पौलुस के न्यायिक विरोध को स्वाभाविक हिंदी में व्यक्त करता है, जबकि वैकल्पिक ‘निर्दोष ठहराया जाना’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: κατάκριμα के विपरीत δικαίωμα का न्यायिक अर्थ
  choice: धर्मी ठहराए जाने
  alternative: धर्मसम्मत निर्णय; निर्दोष ठहराए जाने
  rationale: वाक्य न्याय-निर्णय/दोषी ठहराए जाने और अनुग्रह के वरदान/δικαίωμα के बीच न्यायिक विरोध रचता है। ‘धर्मी ठहराया जाना’ उस विरोध को व्यक्त करता है, पर मूल संज्ञा के ‘अनुकूल या धर्मसम्मत निर्णय’ वाले अधिक ठोस अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐξ ἑνὸς में ‘एक’ का संकेत
  choice: एक ही अपराध से
  alternative: एक व्यक्ति से
  rationale: ‘बहुत-से अपराधों’ के साथ समानांतरता के कारण ‘एक अपराध’ अधिक संभावित है, लेकिन यूनानी में संज्ञा व्यक्त नहीं है और निकट संदर्भ के कारण ‘एक व्यक्ति’ भी संभव है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्यतः सुबोध रूप अपनाया गया है। न्यायालय-संबंधी विरोध को स्पष्ट रखने के लिए ‘न्याय-निर्णय’, ‘दोषी ठहराया जाना’ और ‘धर्मी ठहराया जाना’ चुने गए हैं। पहले खंड की यूनानी संक्षिप्तता को हिंदी में समझने योग्य बनाने हेतु ‘परिणाम’ जोड़ा गया है, और मूल की अस्पष्टता पादटिप्पणियों में सुरक्षित रखी गई है।
