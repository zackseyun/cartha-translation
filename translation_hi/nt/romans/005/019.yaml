id: ROM.5.19
reference: Romans 5:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ διὰ τῆς παρακοῆς τοῦ ἑνὸς ἀνθρώπου ἁμαρτωλοὶ κατεστάθησαν οἱ πολλοί, οὕτως καὶ διὰ τῆς ὑπακοῆς τοῦ ἑνὸς δίκαιοι κατασταθήσονται οἱ πολλοί.
base_translation:
  language: en
  yaml_path: translation/nt/romans/005/019.yaml
  text: For just as through the disobedience of the one man the many were made sinners[c][b][a], so also through the obedience of the one man the many will be made righteous.
translation:
  language: hi
  text: क्योंकि जिस प्रकार उस एक मनुष्य की अवज्ञा के द्वारा बहुत-से लोग पापी बना दिए गए[a], उसी प्रकार उस एक की[b] आज्ञाकारिता के द्वारा बहुत-से लोग धर्मी बनाए जाएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापी ठहराए गए।” यूनानी क्रिया किसी दशा या स्थिति में रखे अथवा स्थापित किए जाने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात “उस एक मनुष्य की”; यूनानी में यहाँ “मनुष्य” शब्द दोहराया नहीं गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “धर्मी ठहराए जाएँगे।” यूनानी क्रिया को “धर्मी के रूप में स्थापित किए जाएँगे” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακοῆς
  choice: अवज्ञा
  rationale: यह आज्ञा न मानने को सीधे और स्वाभाविक रूप से व्यक्त करता है तथा ὑπακοή के साथ पौलुस के विरोध को बनाए रखता है।
- source_word: τοῦ ἑνὸς ἀνθρώπου
  choice: उस एक मनुष्य की
  rationale: संदर्भ में निश्चित, पहचाने हुए एक मनुष्य—आदम—की ओर संकेत सुरक्षित रहता है, पर नाम को पाठ में जोड़ा नहीं गया है।
- source_word: ἁμαρτωλοὶ
  choice: पापी
  rationale: यह विशेषण यहाँ संज्ञार्थक/विधेय रूप में है; “पापी” इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: κατεστάθησαν
  choice: बना दिए गए
  rationale: यह किसी दशा या स्थिति में स्थापित किए जाने का भाव देता है। यह सहज हिन्दी है और इसे केवल न्यायिक घोषणा मानकर सीमित नहीं करता।
- source_word: οἱ πολλοί
  choice: बहुत-से लोग
  rationale: यह οἱ πολλοί की सामूहिक बहुलता को व्यक्त करता है। हिन्दी में उपपद न होने के कारण निश्चितता संदर्भ से प्रकट होती है; इसे व्याख्यात्मक रूप से “सब” नहीं किया गया।
- source_word: ὑπακοῆς
  choice: आज्ञाकारिता
  rationale: यह παρακοή के ठीक विपरीत भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοῦ ἑνὸς
  choice: उस एक की
  rationale: यूनानी की दूसरी उपवाक्य में ἀνθρώπου दोहराया नहीं गया है। “उस एक की” इस संक्षिप्तता को सुरक्षित रखता है; फुटनोट संदर्भ स्पष्ट करता है।
- source_word: δίκαιοι
  choice: धर्मी
  rationale: पौलुस के δικ- शब्दसमूह के इस संदर्भ में “धर्मी” स्पष्ट और परंपरागत रूप से समझने योग्य है।
- source_word: κατασταθήσονται
  choice: बनाए जाएँगे
  rationale: यह पहले उपवाक्य के κατεστάθησαν के साथ काल और निष्क्रिय समानांतरता बनाए रखता है तथा यूनानी में न आए अधिक विशिष्ट “धर्मी घोषित किए जाएँगे” को पाठ में नहीं लाता।
theological_decisions:
- issue: οἱ πολλοί का दायरा
  choice: बहुत-से लोग
  alternative: सब; अनेक लोग
  rationale: मूल पाठ οἱ πολλοί कहता है। “सब” करके इसके दायरे को व्याख्यात्मक रूप से तय नहीं किया गया, जिससे पाठ की वास्तविक धर्मवैज्ञानिक तनातनी बनी रहती है।
- issue: κατασταθήσονται δίκαιοι में स्थिति, गठन या घोषणा का भाव
  choice: धर्मी बनाए जाएँगे
  alternative: धर्मी घोषित किए जाएँगे; धर्मी ठहराए जाएँगे; धर्मी के रूप में स्थापित किए जाएँगे
  rationale: यहाँ क्रिया καθίστημι है, δικαιόω नहीं। चुना हुआ रूप मूल शब्दावली के अधिक निकट है और वाक्य को केवल न्यायिक घोषणा तक सीमित नहीं करता।
- issue: दूसरे उपवाक्य में τοῦ ἑνὸς के साथ “मनुष्य” की पूर्ति
  choice: मुख्य पाठ में “उस एक की,” और फुटनोट में निहित अर्थ स्पष्ट
  alternative: उस एक मनुष्य की
  rationale: इससे यूनानी की संक्षिप्त अभिव्यक्ति बनी रहती है, जबकि हिन्दी पाठक को फुटनोट द्वारा पहले उपवाक्य से उसका संबंध समझाया जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “अवज्ञा/आज्ञाकारिता” और “पापी बना दिए गए/धर्मी बनाए जाएँगे” की समानांतर संरचना मूल यूनानी के संतुलन को दर्शाती है। “बहुत-से लोग” को “सब” नहीं बनाया गया, और “धर्मी घोषित किए जाएँगे” जैसी अधिक संप्रदायगत या व्याख्यात्मक शब्दावली से बचा गया है।
