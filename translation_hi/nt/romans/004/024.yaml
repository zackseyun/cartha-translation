  text: बल्कि हमारे लिए भी, जिनके खाते में वह गिना जाएगा[a]—अर्थात् हम, जो उस पर विश्वास करते हैं[b] जिसने हमारे प्रभु यीशु को मृतकों में से जीवित किया,
