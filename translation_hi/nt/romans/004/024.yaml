  - marker: b
    text: या ‘उस पर भरोसा रखते हैं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ καὶ
  choice: बल्कि … भी
  rationale: यह पिछले कथन के साथ विरोधात्मक संबंध और अब विश्वासियों तक उसके विस्तार—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δι’ ἡμᾶς
  choice: हमारे लिए
  rationale: यहाँ διά के साथ कर्मकारक का भाव उन लोगों की ओर संकेत करता है जिन्हें ध्यान में रखकर बात लिखी गई थी।
- source_word: οἷς μέλλει λογίζεσθαι
  choice: जिनके लेखे वह गिना जाएगा
  rationale: यह μέλλω के भावी अभिमुख बल और λογίζομαι के लेखांकन-संबंधी रूपक को सुरक्षित रखता है। ‘वह’ पिछले प्रसंग से समझे जाने वाले अव्यक्त विषय को बिना स्पष्ट रूप से ‘धार्मिकता’ जोड़ दिए व्यक्त करता है।
- source_word: τοῖς πιστεύουσιν ἐπὶ
  choice: जो उस पर विश्वास करते हैं
  rationale: πιστεύω के साथ ἐπί किसी व्यक्ति की ओर निर्देशित विश्वास या भरोसा व्यक्त करता है; यह हिन्दी में सहज और सटीक है।
- source_word: τὸν ἐγείραντα
  choice: जिसने … जिलाया
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त को उसके कार्य के द्वारा परमेश्वर की पहचान बताते हुए स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: Ἰησοῦν τὸν κύριον ἡμῶν
  choice: हमारे प्रभु यीशु
  rationale: यह κύριος को ‘प्रभु’ और सम्बन्धवाचक सर्वनाम को हिन्दी की स्वाभाविक शब्द-व्यवस्था में रखता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह पुनरुत्थान की अभिव्यक्ति में ἐκ के ‘में से’ भाव को स्पष्ट रूप से सुरक्षित रखता है।
theological_decisions:
- issue: λογίζεσθαι के अव्यक्त विषय/वस्तु को हिन्दी में कैसे व्यक्त किया जाए
  choice: '‘वह’ का प्रयोग: ‘जिनके लेखे वह गिना जाएगा’'
  alternative: ‘धार्मिकता उनके लेखे गिनी जाएगी’
  rationale: यूनानी पाठ पिछले प्रसंग से अर्थ ग्रहण करते हुए इसे अव्यक्त छोड़ता है। ‘वह’ हिन्दी वाक्य को पूर्ण बनाता है, पर इस पद में ‘धार्मिकता’ को खुलकर जोड़कर मूल की अर्थगत अपूर्णता को अनावश्यक रूप से नहीं सुलझाता।
- issue: πιστεύω ἐπί में विश्वास और भरोसे का संबंध
  choice: ‘उस पर विश्वास करते हैं’
  alternative: ‘उस पर भरोसा रखते हैं’
  rationale: ‘विश्वास’ सामान्य बाइबलीय और आधुनिक हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी संबंधपरक ‘भरोसा’ भाव को भी सामने रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। ‘जिनके लेखे’ लेखांकन के रूपक को बनाए रखता है, जबकि ‘अर्थात् हम’ οἷς और τοῖς πιστεύουσιν के समानाधिकरण संबंध को स्पष्ट करता है। अंतिम अल्पविराम दिए गए यूनानी अंश के अगले पद में जारी रहने का संकेत रखता है।
