source:
  edition: SBLGNT
  text: Οὐ γὰρ διὰ νόμου ἡ ἐπαγγελία τῷ Ἀβραὰμ ἢ τῷ σπέρματι αὐτοῦ, τὸ κληρονόμον αὐτὸν ⸀εἶναι κόσμου, ἀλλὰ διὰ δικαιοσύνης πίστεως·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/013.yaml
  text: For the promise to Abraham or to his offspring that he would be heir of the world was not through the law[d][c][b][a], but through the righteousness of faith.
translation:
  language: hi
  text: क्योंकि अब्राहम या उसके वंश[a] को यह प्रतिज्ञा—कि वह संसार का वारिस होगा—व्यवस्था के द्वारा नहीं, बल्कि विश्वास[d] की धार्मिकता[c][b] के द्वारा मिली थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बीज’। यूनानी शब्द एकवचन है, लेकिन सामूहिक रूप से ‘वंश’ या ‘वंशज’ भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘विश्वास के द्वारा धार्मिकता’ या ‘विश्वास से मिलने वाली धार्मिकता’ भी हो सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘धार्मिकता’ का अनुवाद कुछ संदर्भों में ‘न्याय’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘विश्वास’ का अर्थ संदर्भ के अनुसार ‘विश्वासयोग्यता’ या ‘भरोसा’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαγγελία
  choice: प्रतिज्ञा
  rationale: यह पौलुस के संदर्भ में परमेश्वर की दी हुई प्रतिज्ञा को व्यक्त करने वाला मानक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: σπέρματι
  choice: वंश
  rationale: यूनानी शब्द एकवचन है, पर सामूहिक अर्थ में संतान या वंशजों को सूचित कर सकता है; ‘वंश’ इस सामूहिकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κληρονόμον ... κόσμου
  choice: संसार का वारिस
  rationale: यह विरासत-संबंधी रूपक और κόσμος के व्यापक अर्थ, दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: διὰ νόμου
  choice: व्यवस्था के द्वारा
  rationale: पौलुस के तर्क में νόμος स्वाभाविक रूप से मूसा की व्यवस्था की ओर संकेत करता है; यह अनुवाद साधन के भाव को भी बनाए रखता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: पौलुस के प्रयोग में यह शब्द परमेश्वर के सम्मुख सही ठहरने और सही संबंध की अर्थ-छटा रखता है; ‘धार्मिकता’ इसे ‘न्याय’ की अपेक्षा अधिक व्यापक रूप में सुरक्षित रखता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस संदर्भ में व्यवस्था के विपरीत विश्वास मुख्य अर्थ है, जबकि ‘विश्वासयोग्यता’ और ‘भरोसा’ संभावित अर्थ-छटाएँ हैं।
- source_word: διὰ δικαιοσύνης πίστεως
  choice: विश्वास की धार्मिकता के द्वारा
  rationale: यह यूनानी संबंधकारक की संक्षिप्तता और उसके संबंध की वास्तविक अस्पष्टता को बनाए रखता है, बिना उसे अनिवार्य रूप से ‘विश्वास से मिलने वाली धार्मिकता’ के रूप में तय किए।
theological_decisions:
- issue: δικαιοσύνης πίστεως में संबंधकारक का अर्थ
  choice: विश्वास की धार्मिकता
  alternative: विश्वास के द्वारा मिलने वाली धार्मिकता; विश्वास पर आधारित धार्मिकता
  rationale: यूनानी पदबंध संक्षिप्त है और धार्मिकता तथा विश्वास के बीच संबंध को पूरी तरह स्पष्ट नहीं करता। शाब्दिक-सहज हिन्दी उस धर्मवैचारिक तनाव को सुरक्षित रखती है।
- issue: प्रतिज्ञा का कर्ता और प्राप्तकर्ता
  choice: अब्राहम या उसके वंश से ... प्रतिज्ञा ... की गई थी
  alternative: अब्राहम या उसके वंश के लिए प्रतिज्ञा थी
  rationale: यूनानी में प्रतिज्ञा अब्राहम अथवा उसके वंश को संबोधित है। हिन्दी में ‘से ... प्रतिज्ञा की गई’ यह संबंध स्पष्ट करता है और किसी अतिरिक्त कर्ता को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। वाक्य की प्रतिज्ञा-संबंधी उपवाक्य संरचना को डैश से स्पष्ट किया गया है। ‘व्यवस्था’, ‘धार्मिकता’ और ‘वारिस’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, जबकि पदबंध को अत्यधिक संस्कृतनिष्ठ या संप्रदाय-विशिष्ट नहीं बनाया गया।
