  text: Μακάριοι ὧν ἀφέθησαν αἱ ἀνομίαι καὶ ὧν ἐπεκαλύφθησαν αἱ ἁμαρτίαι,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/007.yaml
  text: Blessed are those whose lawless deeds have been forgiven[a], and whose sins have been covered.
translation:
  language: hi
  text: “धन्य हैं वे, जिनके व्यवस्था-विरोधी काम क्षमा किए गए हैं[a], और जिनके पाप ढाँप दिए गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिनके अधर्म क्षमा किए गए हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Μακάριοι
  choice: धन्य हैं
  rationale: यह ईश्वर की कृपा से प्राप्त धन्य दशा की घोषणात्मक और वाचा-संबंधी छाया को बनाए रखता है; ‘सुखी’ केवल मनोभाव का संकेत दे सकता है।
- source_word: ἀφέθησαν
  choice: क्षमा किए गए हैं
  rationale: ἀφίημι का कर्मवाच्य यहाँ अपराधों की क्षमा या विमोचन बताता है; यह प्रयोग पूर्ण हुए कार्य और उसके वर्तमान परिणाम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνομίαι
  choice: व्यवस्था-विरोधी काम
  rationale: ἀνομία में केवल सामान्य बुराई नहीं, बल्कि व्यवस्था के उल्लंघन का भाव है। यह चयन आधुनिक पाठक के लिए अर्थ स्पष्ट रखते हुए बहुवचन कर्मों को भी व्यक्त करता है।
- source_word: ἐπεκαλύφθησαν
  choice: ढाँप दिए गए हैं
  rationale: यह भजन 32:1 से लिए गए रूपक को बनाए रखता है और उसका अर्थ व्याख्यात्मक रूप से ‘हटा दिए गए’ या ‘क्षमा किए गए’ नहीं कर देता।
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: ἁμαρτίαι के लिए यह मानक, स्पष्ट और स्वाभाविक हिन्दी शब्द है।
theological_decisions:
- issue: ‘व्यवस्था-विरोधी काम’ और ‘पाप’ का संबंध
  choice: दोनों यूनानी पदों को हिन्दी में अलग-अलग रखा गया है।
  alternative: दोनों को केवल ‘पाप’ के रूप में अनूदित करना।
  rationale: पौलुस भजन की काव्यात्मक समानांतरता में दो संबंधित, पर एक-समान न होने वाले शब्द रखता है। उन्हें अलग रखना पाठ की विविधता बचाता है, पर उनके बीच उससे अधिक कठोर धर्मवैज्ञानिक भेद नहीं बनाता जितना पद स्वयं बताता है।
- issue: पापों के ‘ढाँपे जाने’ का रूपक
  choice: रूपक को ‘ढाँप दिए गए हैं’ के रूप में सुरक्षित रखा गया है।
  alternative: इसे व्याख्यात्मक रूप से ‘क्षमा किए गए हैं’ या ‘दूर किए गए हैं’ कहना।
  rationale: मूल पाठ दो समानांतर अभिव्यक्तियाँ रखता है। रूपक को बनाए रखने से उसकी धर्मवैज्ञानिक गहराई और संभावित तनाव को समय से पहले हल नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप। ‘धन्य’ और ‘पाप’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; ‘व्यवस्था-विरोधी काम’ से ἀνομίαι का विधि-उल्लंघन संबंधी भाव साधारण पाठक के लिए स्पष्ट किया गया है।
