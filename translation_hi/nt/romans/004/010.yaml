source:
  edition: SBLGNT
  text: πῶς οὖν ἐλογίσθη; ἐν περιτομῇ ὄντι ἢ ἐν ἀκροβυστίᾳ; οὐκ ἐν περιτομῇ ἀλλ’ ἐν ἀκροβυστίᾳ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/010.yaml
  text: How then was it counted? While he was circumcised[a], or uncircumcised? Not while circumcised, but while uncircumcised.
translation:
  language: hi
  text: तो यह किस स्थिति में गिना गया[a]? जब अब्राहम का खतना हो चुका था, या जब उसका खतना नहीं हुआ था? खतना होने के बाद नहीं, बल्कि खतना होने से पहले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लेखे में गिना गया” या “ठहराया गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πῶς οὖν
  choice: तो यह किस दशा में
  rationale: οὖν के तर्कसूचक संबंध को ‘तो’ व्यक्त करता है। यहाँ πῶς का उत्तर उस परिस्थिति से दिया जाता है जिसमें अब्राहम था; इसलिए ‘किस दशा में’ शाब्दिक ‘कैसे’ की अपेक्षा प्रसंग में अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐλογίσθη
  choice: गिना गया
  rationale: निष्क्रिय क्रिया का अर्थ किसी बात को अब्राहम के पक्ष में मानना या उसके लेखे में गिनना है। ‘गिना गया’ सरल है और रोमियों 4 की लेखा-संबंधी छवि को बनाए रखता है।
- source_word: ἐν περιτομῇ ὄντι
  choice: जब अब्राहम का खतना हो चुका था
  rationale: यूनानी संज्ञा और कृदन्त द्वारा खतना की अवस्था बताता है। हिन्दी में यह कालगत-अवस्थागत वाक्यांश स्वाभाविक है; अब्राहम का नाम स्पष्टता के लिए दिया गया है।
- source_word: ἐν ἀκροβυστίᾳ
  choice: जब उसका खतना नहीं हुआ था / खतना होने से पहले
  rationale: यहाँ संज्ञा खतनारहित अवस्था को दर्शाती है। प्रश्न में ‘खतना नहीं हुआ था’ और उत्तर में स्वाभाविक ‘खतना होने से पहले’ उसी विरोध को स्पष्ट रूप से व्यक्त करते हैं।
- source_word: οὐκ ... ἀλλ’
  choice: नहीं, बल्कि
  rationale: यूनानी के प्रबल निषेधात्मक विरोध को सामान्य और प्रभावी हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἐλογίσθη में निहित लेखा अथवा मान्यता का भाव
  choice: मुख्य पाठ में ‘गिना गया’
  alternative: ‘लेखे में डाला गया’ या ‘ठहराया गया’
  rationale: ‘गिना गया’ मूल क्रिया की व्यापकता और पिछले पदों से संबंध बनाए रखता है, बिना इसे केवल वित्तीय लेन-देन या किसी विशेष धर्मवैज्ञानिक व्याख्या तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘खतना’ प्रचलित धार्मिक-सांस्कृतिक शब्द है। अंतिम वाक्य में शाब्दिक ‘खतनारहित अवस्था में’ के बजाय ‘खतना होने से पहले’ कहा गया है, क्योंकि संदर्भ अब्राहम के जीवन की कालगत स्थिति पर बल देता है।
