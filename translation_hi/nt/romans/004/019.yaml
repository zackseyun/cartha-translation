source:
  edition: SBLGNT
  text: καὶ μὴ ἀσθενήσας τῇ ⸀πίστει κατενόησεν τὸ ἑαυτοῦ ⸀σῶμα νενεκρωμένον, ἑκατονταετής που ὑπάρχων, καὶ τὴν νέκρωσιν τῆς μήτρας Σάρρας,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/019.yaml
  text: And without weakening in faith[b][a], he considered his own body as good as dead—since he was about a hundred years old—and the deadness of Sarah’s womb.
translation:
  language: hi
  text: और विश्वास में निर्बल पड़े बिना, उसने अपने शरीर को ध्यान में रखा[a]—जो लगभग सौ वर्ष का होने के कारण मृतप्राय था—और सारा के गर्भ की मृतप्राय अवस्था को भी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक अन्य पाठ-परम्परा में: “उसने अपने शरीर को, जो मृतप्राय था, ध्यान में नहीं रखा।”'
    reason: textual_variant
  - marker: b
    text: या “बन्ध्यता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσθενήσας
  choice: निर्बल हुए बिना
  rationale: नकार सहित कृदन्त का संबंध मुख्य क्रिया से बनाए रखता है और यह दर्शाता है कि अब्राहम का विश्वास दुर्बल नहीं पड़ा।
- source_word: πίστει
  choice: विश्वास में
  rationale: यहाँ πίστις परमेश्वर की प्रतिज्ञा पर अब्राहम के भरोसे को व्यक्त करता है; ‘विश्वास में’ आधुनिक हिन्दी में स्वाभाविक और धर्मवैचारिक रूप से अनावश्यक रूप से संकीर्ण नहीं है।
- source_word: κατενόησεν
  choice: ध्यान दिया
  rationale: क्रिया वास्तविक परिस्थिति को जान-बूझकर देखने या विचार में लेने का भाव देती है; ‘ध्यान दिया’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: νενεκρωμένον
  choice: मानो मर चुका था
  rationale: पूर्ण कृदन्त प्रजनन की दृष्टि से मृतप्राय दशा बताता है, शारीरिक मृत्यु नहीं; ‘मानो’ इस प्रभावी किन्तु अलाक्षणिक मृत्यु-भाव को स्पष्ट रखता है।
- source_word: ἑκατονταετής που ὑπάρχων
  choice: क्योंकि वह लगभग सौ वर्ष का था
  rationale: πού की अनिश्चितता ‘लगभग’ से बनी रहती है, और कारणसूचक वाक्यांश हिन्दी में शरीर की मृतप्राय दशा का आधार सहज रूप से बताता है।
- source_word: νέκρωσιν
  choice: मृत दशा
  rationale: यह चयन पहले प्रयुक्त मृत्यु-संबंधी भाषा के साथ समानता बनाए रखता है, जबकि हिन्दी में ‘मृतता’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: μήτρας Σάρρας
  choice: सारा के गर्भ
  rationale: यह संबंधकारक पद का स्वाभाविक हिन्दी रूप है और मूल का ठोस शारीरिक बिंब बनाए रखता है।
theological_decisions:
- issue: क्या प्रजनन-असमर्थता को केवल ‘बाँझपन’ कहकर मृत्यु के बिंब को नरम किया जाए
  choice: अब्राहम के शरीर के लिए ‘मानो मर चुका था’ और सारा के गर्भ के लिए ‘मृत दशा’
  alternative: अब्राहम का शरीर संतान उत्पन्न करने में असमर्थ था; सारा का गर्भ बाँझ था
  rationale: पौलुस दोनों खंडों में परस्पर संबंधित मृत्यु-शब्दावली रखता है, जिससे मानवीय असम्भवता और परमेश्वर की प्रतिज्ञा के बीच का तनाव उभरता है; इसलिए इस बिंब को बनाए रखा गया है।
- issue: मुख्य पाठ में κατενόησεν को सकारात्मक माना जाए या नकार उसके साथ जोड़ा जाए
  choice: SBLGNT के दिए हुए मुख्य पाठ के अनुसार ‘उसने ... ध्यान दिया’
  alternative: ‘उसने अपने शरीर की दशा पर ध्यान नहीं दिया’
  rationale: दिए हुए पाठ में μή का संबंध ἀσθενήσας से है, इसलिए मुख्य पाठ सकारात्मक क्रिया व्यक्त करता है; अन्य पाठ-परम्परा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मानो मर चुका’ और ‘मृत दशा’ मूल के समानान्तर मृत्यु-बिंब को बनाए रखते हैं। [a] को संबंधित क्रिया के बाद और [b] को वैकल्पिक शब्द वाले पद के बाद रखा गया है।
