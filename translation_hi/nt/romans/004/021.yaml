  text: and being fully convinced that what he had promised[c][b][a], he was also able to do.
translation:
  language: hi
  text: और उसे पूरा विश्वास था कि उसने जो प्रतिज्ञा की है, उसे पूरा करने में वह समर्थ भी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पूरा विश्वास था’ का अनुवाद ‘पूरी तरह आश्वस्त था’ या ‘उसे पूरा निश्चय था’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πληροφορηθεὶς
  choice: पूरा विश्वास था
  rationale: यह कृदंत पूर्ण निश्चय की अवस्था व्यक्त करता है। ‘पूरा विश्वास था’ सहज आधुनिक हिन्दी में इसकी प्रबलता बनाए रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह अब्राहम के दृढ़ विश्वास की विषय-वस्तु का परिचय देता है।
- source_word: ὃ
  choice: जो
  rationale: सम्बन्धवाचक सर्वनाम को हिन्दी में ‘उसने जो प्रतिज्ञा की है’ के स्वाभाविक विन्यास में रखा गया है।
- source_word: ἐπήγγελται
  choice: प्रतिज्ञा की है
  rationale: यूनानी पूर्ण काल अतीत में की गई प्रतिज्ञा और उसके बने हुए प्रभाव को व्यक्त करता है; हिन्दी का पूर्ण वर्तमान दोनों पहलुओं को स्वाभाविक रूप से दर्शाता है।
- source_word: δυνατός ἐστιν
  choice: समर्थ है
  rationale: यूनानी वर्तमान काल को यथावत रखा गया है, जो परमेश्वर की वर्तमान और स्थायी सामर्थ्य को व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यह इस बात पर बल देता है कि प्रतिज्ञा करने वाला उसे पूरा करने में भी समर्थ है।
- source_word: ποιῆσαι
  choice: पूरा करने
  rationale: शाब्दिक अर्थ ‘करना’ है, पर प्रतिज्ञा के साथ हिन्दी में ‘पूरा करना’ स्वाभाविक है और सन्दर्भगत अर्थ को स्पष्ट करता है।
theological_decisions:
- issue: प्रतिज्ञा करने और उसे पूरा करने वाले का निहित कर्ता
  choice: मुख्य पाठ में ‘वह’ और ‘उसने’ रखा गया है
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: आस-पास के प्रसंग से कर्ता परमेश्वर है, पर इस पद के यूनानी पाठ में नाम निहित है। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति सुरक्षित रहती है।
- issue: δυνατός ἐστιν का काल
  choice: ‘समर्थ है’
  alternative: ‘समर्थ था’
  rationale: यूनानी में वर्तमान काल है। हिन्दी में वर्तमान काल कथात्मक प्रसंग में भी स्वाभाविक है और कथन की सामान्य, स्थायी सच्चाई को अनावश्यक रूप से अतीत तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘प्रतिज्ञा’ बाइबिलीय सन्दर्भ के अनुकूल है, जबकि वाक्य-विन्यास स्वाभाविक हिन्दी रखा गया है।
