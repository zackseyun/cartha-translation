  text: μακάριος ἀνὴρ ⸀οὗ οὐ μὴ λογίσηται κύριος ἁμαρτίαν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/008.yaml
  text: Blessed is the man against whom the Lord will never count sin[a][b].
translation:
  language: hi
  text: धन्य है वह मनुष्य[a], जिसके विरुद्ध प्रभु पाप कभी नहीं गिनेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘व्यक्ति’; यहाँ ‘मनुष्य’ का अर्थ प्रतिनिधिक है, केवल पुरुष नहीं।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘उसके विरुद्ध पाप को निश्चय ही नहीं गिनेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह बाइबलीय आशीष की गंभीर और परमेश्वर-संबंधी भाषा को बनाए रखता है; ‘सुखी’ यहाँ अत्यधिक भावनात्मक या हल्का लग सकता है।
- source_word: ἀνήρ
  choice: मनुष्य
  rationale: यूनानी में पुल्लिंग एकवचन है, पर यहाँ प्रतिनिधिक और सामान्य अर्थ है। हिन्दी का ‘मनुष्य’ उस रूप को बनाए रखते हुए अर्थ को केवल पुरुष तक सीमित नहीं करता।
- source_word: οὗ
  choice: जिसके विरुद्ध
  rationale: सम्बन्धवाचक षष्ठी को λογίζομαι के साथ स्वाभाविक हिन्दी में इस प्रकार व्यक्त किया गया है, ताकि पाप को किसी के विरुद्ध गिने जाने का भाव स्पष्ट रहे।
- source_word: οὐ μὴ
  choice: कभी नहीं
  rationale: यह यूनानी की प्रबल निषेधात्मक अभिव्यक्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λογίσηται
  choice: गिनेगा
  rationale: ‘गिनना’ स्पष्ट और स्वाभाविक है तथा रोमियों 4 के लेखा-संबंधी रूपक को बनाए रखता है, बिना किसी बाद की तकनीकी धर्मवैज्ञानिक शब्दावली को आरोपित किए।
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का प्रचलित, गरिमापूर्ण बाइबलीय हिन्दी रूप है और पवित्रशास्त्र के उद्धरण के संदर्भ में उपयुक्त है।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: यूनानी के एकवचन को श्रेणीवाचक अर्थ में स्वाभाविक हिन्दी ‘पाप’ से व्यक्त किया गया है।
theological_decisions:
- issue: प्रतिनिधिक पुल्लिंग भाषा
  choice: मुख्य पाठ में ‘मनुष्य’ रखा गया है और उसके सामान्य, समावेशी आशय को पादटिप्पणी में स्पष्ट किया गया है।
  alternative: व्यक्ति
  rationale: ἀνήρ व्याकरण की दृष्टि से पुल्लिंग एकवचन है, किन्तु इस कथन में उसका आशय केवल पुरुष नहीं बल्कि सामान्य रूप से मनुष्य है। हिन्दी ‘मनुष्य’ स्रोत-रूप और प्रतिनिधिक अर्थ दोनों को स्वाभाविक ढंग से संप्रेषित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और पवित्रशास्त्रीय शैली रखी गई है। ‘धन्य’ आशीष की धार्मिक गंभीरता और ‘गिनेगा’ निकटवर्ती लेखा-रूपक को सुरक्षित रखते हैं।
