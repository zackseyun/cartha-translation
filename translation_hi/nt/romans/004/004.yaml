  yaml_path: translation/nt/romans/004/004.yaml
  text: To the one who works[a], the wages are not credited as a gift[b], but as an obligation.
translation:
  language: hi
  text: परन्तु जो काम करता है, उसकी मजदूरी अनुग्रह के अनुसार नहीं, बल्कि देय मानकर गिनी जाती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐργαζομένῳ
  choice: जो काम करता है
  rationale: लेखयुक्त वर्तमान कृदन्त यहाँ सामान्य रूप से काम करने वाले व्यक्ति को दर्शाता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: μισθὸς
  choice: मजदूरी
  rationale: काम और देय भुगतान के प्रसंग में ‘मजदूरी’ अर्जित पारिश्रमिक को स्पष्ट रूप से व्यक्त करती है।
- source_word: λογίζεται
  choice: गिनी जाती है
  rationale: यह पौलुस की हिसाब-किताब संबंधी उपमा को सहज हिन्दी में बनाए रखता है; ‘खाते में जमा’ की अपेक्षा यहाँ अधिक स्वाभाविक है।
- source_word: κατὰ χάριν
  choice: अनुग्रह के अनुसार
  rationale: यह मूल पदबंध का निकट अनुवाद है और χάρις के ‘अनुग्रह’ तथा प्रसंगगत ‘उपहार’ दोनों अर्थ-संकेतों को समय से पहले सीमित नहीं करता।
- source_word: ὀφείλημα
  choice: उसके हक़ के रूप में
  rationale: शब्द का अर्थ देय वस्तु या ऋण है; मजदूरी के प्रसंग में ‘हक़’ स्पष्ट करता है कि भुगतान कमाया हुआ और देय है।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ पिछले कथन से हल्का विरोध/संक्रमण प्रकट करता है; ‘परन्तु’ इसे स्पष्ट रखता है, यद्यपि हिन्दी में ‘अब’ भी प्रसंगानुसार सम्भव होता।
theological_decisions:
- issue: काम के बदले मजदूरी और अनुग्रह का विरोध
  choice: ‘अनुग्रह के अनुसार नहीं’ रखकर χάρις को स्पष्ट धार्मिक शब्दावली में व्यक्त किया गया है।
  alternative: ‘उपहार के रूप में नहीं’
  rationale: मूल अभिव्यक्ति κατὰ χάριν का औपचारिक स्वर और पौलुस की व्यापक शब्दावली सुरक्षित रहती है, जबकि अगला ‘हक़’ वाला पद विरोध को सामान्य पाठक के लिए स्पष्ट करता है।
- issue: ὀφείλημα का देयता-बोध
  choice: ‘उसके हक़ के रूप में’
  alternative: ‘ऋण के अनुसार’ या ‘जो देय है उसके रूप में’
  rationale: यह नियोक्ता के आर्थिक ऋण की तकनीकी भाषा थोपे बिना कमाई हुई मजदूरी की वास्तविक देयता को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘परन्तु’ औपचारिक किन्तु प्रचलित संयोजक है; ‘मजदूरी’ और ‘हक़’ श्रम-भुगतान की उपमा को सहज बनाते हैं।
