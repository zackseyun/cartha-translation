source:
  edition: SBLGNT
  text: Διὰ τοῦτο ἐκ πίστεως, ἵνα κατὰ χάριν, εἰς τὸ εἶναι βεβαίαν τὴν ἐπαγγελίαν παντὶ τῷ σπέρματι, οὐ τῷ ἐκ τοῦ νόμου μόνον ἀλλὰ καὶ τῷ ἐκ πίστεως Ἀβραάμ (ὅς ἐστιν πατὴρ πάντων ἡμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/016.yaml
  text: For this reason it is by faith[a], so that it may be according to grace, in order that the promise may be certain to all the offspring—not only to those from the law, but also to those of the faith of Abraham, who is the father of us all[c][b],
translation:
  language: hi
  text: इसी कारण यह विश्वास से है, ताकि यह अनुग्रह के अनुसार हो और प्रतिज्ञा सभी वंशजों[a] के लिए निश्चित हो—न केवल उनके लिए जो व्यवस्था से हैं, बल्कि उनके लिए भी जो अब्राहम के विश्वास वाले हैं—अब्राहम, जो हम सबका पिता है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वंशजों” के लिए यूनानी शब्द का शाब्दिक अर्थ “बीज” है; यहाँ वह सामूहिक रूप से अब्राहम की संतान अथवा वंशजों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पिछले तर्क से निष्कर्षात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκ πίστεως
  choice: विश्वास से
  rationale: ἐκ यहाँ आधार अथवा माध्यम का बोध कराता है; हिन्दी में यह संक्षिप्त और पौलुस के तर्क के अनुरूप है।
- source_word: ἵνα κατὰ χάριν
  choice: ताकि अनुग्रह के अनुसार हो
  rationale: उद्देश्यवाचक उपवाक्य और κατὰ χάριν की औपचारिक संबंध-भाषा दोनों सुरक्षित रहती हैं।
- source_word: βεβαίαν
  choice: निश्चित
  rationale: प्रतिज्ञा की विश्वसनीयता और दृढ़ता को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπαγγελίαν
  choice: प्रतिज्ञा
  rationale: पौलुस की वाचागत भाषा के लिए प्रचलित, गरिमापूर्ण और सटीक शब्द है।
- source_word: σπέρματι
  choice: वंश
  rationale: शाब्दिक अर्थ 'बीज' है, पर यहाँ सामूहिक रूप से अब्राहम के वंश को दर्शाता है; 'वंश' स्वाभाविक हिन्दी है।
- source_word: οὐ τῷ ἐκ τοῦ νόμου μόνον
  choice: न केवल उसके लिए जो व्यवस्था से है
  rationale: यूनानी के एकवचन और संक्षिप्त संरचना को बनाए रखते हुए उसका सामूहिक आशय खुला रखा गया है।
- source_word: τῷ ἐκ πίστεως Ἀβραάμ
  choice: उसके लिए भी जो अब्राहम के विश्वास से है
  rationale: यूनानी की संक्षिप्त और कुछ अस्पष्ट संरचना को निकटता से रखता है तथा 'अब्राहम जैसा विश्वास रखने वाले' जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस प्रसंग में भरोसा निहित है, पर 'विश्वास' पौलुस के तर्क और हिन्दी बाइबलीय शब्दावली दोनों के लिए उपयुक्त है; 'विश्वासयोग्यता' यहाँ कम संभावित है।
- source_word: πατὴρ πάντων ἡμῶν
  choice: वही हम सबका पिता है
  rationale: मूल का पारिवारिक और वाचागत रूपक स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित है।
theological_decisions:
- issue: τῷ ἐκ πίστεως Ἀβραάμ का संबंध और अर्थ
  choice: उसके लिए भी जो अब्राहम के विश्वास से है
  alternative: उनके लिए भी जो अब्राहम जैसा विश्वास रखते हैं
  rationale: वैकल्पिक रूप आशय को स्पष्ट करता है, पर मूल की संक्षिप्तता और संभावित संबंधगत अस्पष्टता को अधिक हल कर देता है। चुना हुआ रूप मूल के निकट रहकर पाठक को वही तनाव देखने देता है।
- issue: एकवचन τῷ को सामूहिक बहुवचन में बदलना
  choice: एकवचन रूप 'उसके लिए जो...' बनाए रखा
  alternative: उनके लिए जो...
  rationale: यूनानी व्याकरण में दोनों समानांतर पद एकवचन हैं, यद्यपि उनका आशय सामूहिक हो सकता है। मुख्य पाठ में रूप सुरक्षित रखा गया है।
- issue: प्रतिज्ञा का अव्यक्त कर्ता-संबंध
  choice: यह विश्वास से है... ताकि... हो
  alternative: प्रतिज्ञा विश्वास पर आधारित है, ताकि वह अनुग्रह के अनुसार हो
  rationale: मूल में आरंभिक खंड का स्पष्ट कर्ता व्यक्त नहीं है। 'प्रतिज्ञा' को सीधे कर्ता बनाना सहज है, पर मूल की दीर्घवृत्तता को हल कर देता; इसलिए अस्पष्टता संरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पाठयोग्य शैली अपनाई गई है। 'अनुग्रह', 'प्रतिज्ञा', 'व्यवस्था' और 'विश्वास' जैसे स्थापित धर्मग्रंथीय शब्द रखे गए हैं। मूल यूनानी की एकवचन सामूहिक अभिव्यक्ति और आरंभिक अव्यक्त कर्ता को अनावश्यक रूप से स्पष्ट नहीं किया गया।
