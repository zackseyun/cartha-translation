- from: इसी कारण यह विश्वास से है, ताकि अनुग्रह के अनुसार हो, जिससे प्रतिज्ञा समस्त वंश के लिए निश्चित हो—न केवल उसके लिए जो व्यवस्था से है, बल्कि उसके लिए भी जो अब्राहम के विश्वास से है। वही हम सबका पिता है।[a]
  to: इसी कारण यह विश्वास से है, ताकि यह अनुग्रह के अनुसार हो और प्रतिज्ञा सभी वंशजों[a] के लिए निश्चित हो—न केवल उनके लिए जो व्यवस्था से हैं, बल्कि उनके लिए भी जो अब्राहम के विश्वास वाले हैं—अब्राहम, जो हम सबका पिता है,
  rationale: Purpose relations have been made idiomatic without changing their force. The collective referent of σπέρμα is expressed clearly, while the singular Greek construction is not made doctrinally specific. The concluding clause is restored as an apposition to Abraham, and the trailing comma reflects that the Greek sentence continues into the following verse.
