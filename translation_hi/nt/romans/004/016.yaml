review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the main inferential and purpose structure, but its final independent sentence weakens the Greek syntactic attachment: ὅς (“who”) modifies Abraham directly. The expression “जो अब्राहम के विश्वास से है” is overly literal in a way that is not idiomatic Hindi and leaves the intended characterization unclear.'
  naturalness: “जिससे” following “ताकि” produces an awkwardly doubled purpose construction, and “वही हम सबका पिता है” is less connected to Abraham than the Greek relative clause. A small recasting gives natural modern Hindi while retaining the compressed sense.
  terminology: विश्वास, अनुग्रह, प्रतिज्ञा, व्यवस्था, and अब्राहम are appropriate established terms. “वंशजों” communicates σπέρμα’s collective referent more clearly than “समस्त वंश” in this context.
  issues:
  - severity: medium
    issue: The relative clause concerning Abraham is separated into a new sentence.
    rationale: Greek reads “Abraham, who is father of us all”; “वही हम सबका पिता है” is grammatically possible but loosens the explicit modification of Abraham and ends a sentence where the source continues.
  - severity: medium
    issue: “जो अब्राहम के विश्वास से है” is not natural Hindi and is semantically opaque.
    rationale: Hindi “X के विश्वास से है” can suggest derivation from Abraham’s faith rather than a person characterized by that faith. “अब्राहम के विश्वास वाले” is concise, natural, and does not add the more explicit interpretation “अब्राहम जैसा विश्वास रखने वाले.”},{
