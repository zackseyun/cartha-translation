reference: Romans 4:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ οὐ διεκρίθη τῇ ἀπιστίᾳ ἀλλὰ ἐνεδυναμώθη τῇ πίστει, δοὺς δόξαν τῷ θεῷ
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/020.yaml
  text: Yet regarding the promise of God[a], he did not waver in unbelief, but was strengthened in faith[b], giving glory to God.
translation:
  language: hi
  text: फिर भी परमेश्वर की प्रतिज्ञा के विषय में वह अविश्वास में नहीं डगमगाया[a], बल्कि विश्वास में दृढ़ हुआ[b] और परमेश्वर को महिमा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अविश्वास के कारण नहीं डगमगाया” अथवा “अविश्वास के कारण संदेह नहीं किया।”
    reason: ग्रीक दत्तिव अवस्था, कारण या साधन का भाव दे सकता है, और διεκρίθη का अर्थ ‘डगमगाया’ या ‘संदेह किया’ हो सकता है।
  - marker: b
    text: या, “विश्वास के द्वारा दृढ़ हुआ” अथवा “विश्वास में सामर्थी हुआ।”
    reason: τῇ πίστει को अवस्थासूचक ‘विश्वास में’ या साधनसूचक ‘विश्वास के द्वारा’ समझा जा सकता है; ἐνεδυναμώθη में मजबूत या दृढ़ होने का भाव है।
lexical_decisions:
- source_word: εἰς δὲ τὴν ἐπαγγελίαν τοῦ θεοῦ
  choice: फिर भी परमेश्वर की प्रतिज्ञा के विषय में
  rationale: εἰς यहाँ संबंधसूचक अर्थ में है—‘के विषय में’; δέ पिछले कथन से हल्का विरोध दिखाता है, जिसे ‘फिर भी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐ διεκρίθη
  choice: नहीं डगमगाया
  rationale: διακρίνω इस प्रसंग में भीतर से विभाजित होने, हिचकने या डगमगाने का भाव देता है; ‘डगमगाया’ विश्वास के साथ अगले विरोध को स्पष्ट रखता है।
- source_word: τῇ ἀπιστίᾳ
  choice: अविश्वास के कारण
  rationale: दत्तिव को कारण अथवा साधन के रूप में समझना संभव है। हिंदी में ‘अविश्वास के कारण’ सहज है, जबकि पादटिप्पणी में अवस्थासूचक विकल्प सुरक्षित रखा गया है।
- source_word: ἐνεδυναμώθη
  choice: सामर्थी हुआ
  rationale: निष्क्रिय क्रिया का अर्थ शक्ति प्राप्त करना है। ‘सामर्थी हुआ’ कर्तृवाच्य अर्थ आरोपित किए बिना स्वाभाविक हिंदी देता है।
- source_word: τῇ πίστει
  choice: विश्वास में
  rationale: दत्तिव को विश्वास के क्षेत्र या अवस्था के रूप में व्यक्त किया गया है; साधनसूचक ‘विश्वास के द्वारा’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: δοὺς δόξαν τῷ θεῷ
  choice: और परमेश्वर को महिमा दी
  rationale: ग्रीक कृदंत साथ होने वाली क्रिया बताता है। हिंदी में समन्वित क्रिया ‘और ... दी’ अधिक स्वाभाविक है और अर्थ को सुरक्षित रखती है।
theological_decisions:
- issue: διακρίνω को केवल बौद्धिक संदेह मानना या व्यापक विश्वासगत डगमगाहट
  choice: नहीं डगमगाया
  alternative: संदेह नहीं किया
  rationale: ‘डगमगाया’ आंतरिक हिचकिचाहट और विश्वास में अस्थिरता की व्यापकता को बनाए रखता है तथा इसे केवल बौद्धिक संदेह तक सीमित नहीं करता।
- issue: विश्वास को सामर्थ्य का क्षेत्र मानना या साधन
  choice: विश्वास में सामर्थी हुआ
  alternative: विश्वास के द्वारा सामर्थी हुआ
  rationale: ग्रीक दत्तिव दोनों अर्थों की अनुमति देता है। मुख्य पाठ अवस्थासूचक समानांतरता रखता है, जबकि साधनसूचक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘प्रतिज्ञा,’ ‘अविश्वास,’ ‘विश्वास,’ ‘सामर्थी’ और ‘महिमा’ स्थापित बाइबलीय शब्दावली हैं, पर वाक्य-विन्यास वर्तमान हिंदी के अनुरूप रखा गया है।
