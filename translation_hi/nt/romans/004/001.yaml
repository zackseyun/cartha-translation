  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τί οὖν ἐροῦμεν ⸀εὑρηκέναι Ἀβραὰμ τὸν ⸀προπάτορα ⸀ἡμῶν κατὰ σάρκα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/001.yaml
  text: What then shall we say that Abraham[a], our forefather according to the flesh[c][b], has found?
translation:
  language: hi
  text: तो फिर हम क्या कहें कि हमारे शारीरिक वंश के पूर्वज[a] अब्राहम ने क्या पाया है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे पूर्वज अब्राहम, शरीर के अनुसार।” यहाँ आशय शारीरिक वंश-संबंध से है।
    reason: lexical_alternative
  - marker: b
    text: '“शरीर के अनुसार” को “पाया है” के साथ भी जोड़ा जा सकता है; तब अर्थ होगा: अब्राहम ने मानवीय साधनों से या केवल मानवीय दृष्टि से क्या पाया है?'
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: तो फिर हम क्या कहें
  rationale: पौलुस के तर्क में निष्कर्षात्मक परिवर्तन और विचार-विमर्श वाले प्रश्न को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: εὑρηκέναι
  choice: पाया है
  rationale: पूर्ण infinitive के प्राप्त परिणाम के भाव को सहज हिन्दी में व्यक्त करता है; ‘खोज निकाला’ अनावश्यक रूप से अधिक व्याख्यात्मक होता।
- source_word: Ἀβραὰμ τὸν προπάτορα ἡμῶν
  choice: हमारे ... पूर्वज अब्राहम
  rationale: अब्राहम के साथ साझा वंशगत पहचान को स्पष्ट रखते हुए προπάτωρ के पैतृक/पूर्वज अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ σάρκα
  choice: शारीरिक
  rationale: मुख्य पाठ में इसे वंश-संबंध के अर्थ में अब्राहम/पूर्वज के साथ जोड़ा गया है। ‘शरीर के अनुसार’ अधिक शब्दशः है, पर आधुनिक हिन्दी में अस्पष्ट और असहज हो सकता है।
theological_decisions:
- issue: κατὰ σάρκα का संबंध
  choice: इसे ‘हमारे शारीरिक पूर्वज अब्राहम’ में अब्राहम के साथ जोड़कर भौतिक वंश का संकेत दिया गया है।
  alternative: 'इसे ‘क्या पाया है’ के साथ जोड़कर अर्थ लिया जा सकता है: अब्राहम ने मानवीय साधनों से या मानवीय दृष्टि से क्या पाया।'
  rationale: वाक्य में ‘अब्राहम, हमारे पूर्वज’ की समानाधिकरण संरचना इस संबंध का समर्थन करती है, पर यूनानी पदक्रम दूसरी व्याख्या की वास्तविक संभावना भी छोड़ता है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रश्न की यूनानी संरचना के कारण हिन्दी में ‘क्या’ दोहराया गया है, जिससे आशय स्पष्ट और स्वाभाविक रहता है।
