id: ROM.4.18
reference: Romans 4:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς παρ’ ἐλπίδα ἐπ’ ἐλπίδι ἐπίστευσεν εἰς τὸ γενέσθαι αὐτὸν πατέρα πολλῶν ἐθνῶν κατὰ τὸ εἰρημένον· Οὕτως ἔσται τὸ σπέρμα σου·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/018.yaml
  text: 'who[a], against hope, believed in hope, so that he might become the father of many nations[c][b], according to what had been spoken: “So shall your offspring be.”'
translation:
  language: hi
  text: 'उसने आशा के विरुद्ध भी आशा रखते हुए विश्वास किया[a], ताकि वह बहुत-सी जातियों का पिता बने[c], जैसा कहा गया था: “तेरा वंश[b] ऐसा ही होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सामान्य आशा से परे” अथवा “आशा के विपरीत।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तेरा बीज”; यूनानी में यह एकवचन सामूहिक चित्र है।
    reason: lexical_alternative
  - marker: c
    text: उत्पत्ति 15:5 से उद्धृत; उत्पत्ति 17:5 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: παρ’ ἐλπίδα
  choice: आशा के विरुद्ध भी
  rationale: यह सामान्य मानवीय अपेक्षा के विपरीत परिस्थिति को व्यक्त करता है और मूल यूनानी के विरोधाभासी बल को बनाए रखता है। ‘भी’ हिंदी में इसके बावजूद होने वाले विश्वास को स्वाभाविक ढंग से जोड़ता है।
- source_word: ἐπ’ ἐλπίδι
  choice: आशा रखते हुए
  rationale: यह अब्राहम के विश्वास करने की आशापूर्ण दशा या आधार को व्यक्त करता है। हिंदी में यह ‘आशा पर विश्वास किया’ की उस संभावित गलतफहमी से बचाता है कि आशा स्वयं विश्वास का विषय थी।
- source_word: ἐπίστευσεν
  choice: विश्वास किया
  rationale: यह πιστεύω का सीधा और पौलुस की शब्दावली के अनुरूप अनुवाद है; इसमें अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: εἰς τὸ γενέσθαι αὐτὸν
  choice: ताकि वह ... बने
  rationale: εἰς τό के साथ infinitive यहाँ उद्देश्य या अपेक्षित परिणाम—दोनों की छाया रख सकता है। यह हिंदी अभिव्यक्ति prospective force को सहज रूप से व्यक्त करती है।
- source_word: πατέρα πολλῶν ἐθνῶν
  choice: बहुत-सी जातियों का पिता
  rationale: ἔθνη को ‘गैर-यहूदी’ न कहकर ‘जातियाँ’ कहना उत्पत्ति की अब्राहीमी प्रतिज्ञा के व्यापक जनसमूह-संबंधी संदर्भ को सुरक्षित रखता है।
- source_word: κατὰ τὸ εἰρημένον
  choice: जैसा कहा गया था
  rationale: यह पहले कही गई और अब भी प्रभावी वाणी का स्वाभाविक, गरिमापूर्ण हिंदी रूप है।
- source_word: Οὕτως ἔσται
  choice: ऐसा ही होगा
  rationale: यह प्रतिज्ञा की निश्चित भावी पूर्ति और उत्पत्ति 15:5 के उद्धरण का संकेत संक्षिप्त, स्वाभाविक हिंदी में बनाए रखता है।
- source_word: τὸ σπέρμα σου
  choice: तेरा वंश
  rationale: ‘वंश’ आधुनिक हिंदी में स्वाभाविक है और यूनानी के एकवचन सामूहिक भाव को ‘वंशजों’ की अपेक्षा बेहतर सुरक्षित रखता है; ‘बीज’ अधिक शाब्दिक किंतु यहाँ कम स्वाभाविक है।
theological_decisions:
- issue: अब्राहीमी प्रतिज्ञा में πολλῶν ἐθνῶν का संदर्भ
  choice: बहुत-सी जातियाँ
  alternative: बहुत-से गैर-यहूदी / बहुत-से जनसमूह
  rationale: यहाँ पौलुस उत्पत्ति की प्रतिज्ञा को प्रतिध्वनित करता है। ‘गैर-यहूदी’ कहना यहूदी–गैर-यहूदी भेद को इस पद में आवश्यकता से अधिक सीधे आरोपित कर देगा, जबकि ‘जातियाँ’ मूल की व्यापक वाचिकता बनाए रखता है।
- issue: εἰς τὸ γενέσθαι में उद्देश्य और परिणाम का संबंध
  choice: ताकि वह ... बने
  alternative: जिसके परिणामस्वरूप वह ... बना
  rationale: यूनानी रचना उद्देश्य अथवा परिणाम दोनों की संभावना रखती है। ‘ताकि’ प्रतिज्ञा की भावी दिशा को व्यक्त करता है, पर इसे केवल यांत्रिक परिणाम के रूप में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘आशा के विरुद्ध भी आशा रखते हुए’ मूल के जानबूझकर रखे गए विरोधाभास को बिना कृत्रिम शाब्दिकता के सुरक्षित करता है। उद्धरण में ‘तेरा’ बाइबिलीय प्रत्यक्ष संबोधन के लिए स्वाभाविक है।
