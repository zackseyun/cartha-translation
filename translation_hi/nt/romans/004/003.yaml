  text: τί γὰρ ἡ γραφὴ λέγει; Ἐπίστευσεν δὲ Ἀβραὰμ τῷ θεῷ καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/003.yaml
  text: For what does the Scripture say? Abraham believed God[b][a], and it was counted to him as righteousness.
translation:
  language: hi
  text: क्योंकि पवित्रशास्त्र क्या कहता है? “अब्राहम ने परमेश्वर की बात पर विश्वास किया, और यह उसके लिए धार्मिकता[b] के रूप में गिना गया।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह उसके लिए धार्मिकता के रूप में माना गया,” अथवा “यह उसके खाते में धार्मिकता के रूप में जमा किया गया।”
    reason: lexical_alternative
  - marker: b
    text: या, “न्याय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραφή
  choice: पवित्रशास्त्र
  rationale: पौलुस के प्रयोग में निश्चित पद के साथ यह शब्द सामान्य लेख नहीं, बल्कि पवित्र लिखित वचन को दर्शाता है; ‘पवित्रशास्त्र’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: Ἐπίστευσεν
  choice: विश्वास किया
  rationale: यह सीधा और प्रचलित हिन्दी रूप है तथा यूनानी क्रिया के अर्थ को बिना अनावश्यक व्याख्यात्मक विस्तार के व्यक्त करता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर की बात पर
  rationale: πιστεύω के साथ संप्रदान कारक यहाँ परमेश्वर के कथन को सत्य मानने का भाव रखता है। केवल ‘परमेश्वर पर विश्वास किया’ अस्तित्वगत या सामान्य भरोसे का अर्थ दे सकता है; ‘परमेश्वर की बात पर’ हिन्दी में प्रसंग का आशय स्पष्ट करता है।
- source_word: ἐλογίσθη
  choice: गिना गया
  rationale: यह कर्मवाच्य बल को बनाए रखता है और हिसाब लगाने अथवा किसी के खाते में मानने की अर्थछाया को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς δικαιοσύνην
  choice: धार्मिकता
  rationale: पौलुसी संदर्भ में ‘धार्मिकता’ न्याय, सही ठहराव और परमेश्वर के सम्मुख उचित स्थिति से जुड़ी अर्थ-व्याप्ति को ‘न्याय’ की अपेक्षा बेहतर सुरक्षित रखती है।
theological_decisions:
- issue: पौलुसी धर्मी ठहराए जाने के संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: ‘धार्मिकता’ इस पद में व्यक्ति की परमेश्वर के सम्मुख सही स्थिति और धर्मी माने जाने की संभावना को खुला रखती है; ‘न्याय’ वैध शब्दार्थ है, पर यहाँ हिन्दी में मुख्यतः निष्पक्ष निर्णय या सामाजिक न्याय का अर्थ दे सकता है।
- issue: ἐλογίσθη αὐτῷ की अर्थछाया
  choice: यह उसके लिए ... गिना गया
  alternative: यह उसके खाते में ... माना गया / उसे ... ठहराया गया
  rationale: ‘गिना गया’ मूल के कर्मवाच्य और लेखा-संबंधी रूपक को बनाए रखता है, पर इस बारे में अनावश्यक निर्णय नहीं करता कि कथन का प्रमुख बल अंतःस्थ नैतिक गुण, प्रदत्त दर्जे या किसी अन्य संबंधपरक अर्थ पर है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। उत्पत्ति 15:6 के उद्धरण को उद्धरण-चिह्नों में रखा गया है। ‘परमेश्वर की बात पर विश्वास किया’ मूल संप्रदान कारक का प्रसंगगत भाव स्वाभाविक हिन्दी में व्यक्त करता है।
