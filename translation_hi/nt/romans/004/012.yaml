source:
  edition: SBLGNT
  text: καὶ πατέρα περιτομῆς τοῖς οὐκ ἐκ περιτομῆς μόνον ἀλλὰ καὶ τοῖς στοιχοῦσιν τοῖς ἴχνεσιν τῆς ⸂ἐν ἀκροβυστίᾳ πίστεως⸃ τοῦ πατρὸς ἡμῶν Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/012.yaml
  text: and the father of circumcision to those who are not merely circumcised[d][c][b][a], but who also walk in the footsteps of the faith that our father Abraham had while uncircumcised.
translation:
  language: hi
  text: और खतना वालों के पिता भी[a]—अर्थात् उन लोगों के, जो केवल खतना किए हुए नहीं हैं, बल्कि उस विश्वास के पदचिह्नों पर भी चलते हैं जो हमारे पिता अब्राहम ने खतनारहित अवस्था में रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खतने के पिता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πατέρα περιτομῆς
  choice: खतना वालों के पिता
  rationale: यूनानी पद का शाब्दिक रूप ‘खतने का पिता’ है, पर प्रसंग में आशय खतना किए हुए समुदाय से है। ‘खतना वालों के पिता’ आधुनिक हिन्दी में स्वाभाविक है और अमूर्त रीति के बजाय लोगों के साथ अब्राहम के संबंध को स्पष्ट करता है।
- source_word: οὐκ ἐκ περιτομῆς μόνον
  choice: जो केवल खतना किए हुए ही नहीं हैं
  rationale: शाब्दिक अर्थ ‘केवल खतने में से नहीं’ हिन्दी में अस्वाभाविक है। चुना हुआ रूप बाहरी खतने और अब्राहम-सदृश विश्वास से जुड़े खतने के बीच पौलुस का विरोध सुरक्षित रखता है।
- source_word: στοιχοῦσιν τοῖς ἴχνεσιν
  choice: पदचिह्नों पर ... चलते हैं
  rationale: στοιχέω के क्रमबद्ध चलने या अनुसरण करने और ἴχνη के पैरों के निशानों वाले चित्र—दोनों को यह अभिव्यक्ति स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις अब्राहम के परमेश्वर पर विश्वास करने की ओर संकेत करता है; ‘विश्वास’ प्रसंग और रोमियों 4 के तर्क के अनुकूल है।
- source_word: ἐν ἀκροβυστίᾳ
  choice: खतनारहित अवस्था में
  rationale: यह पद उस अवस्था को बताता है जिसमें अब्राहम ने खतना होने से पहले विश्वास किया था। यह रूप अर्थ को स्पष्ट रखते हुए मूल की अवस्थासूचक अभिव्यक्ति बचाता है।
- source_word: τοῦ πατρὸς ἡμῶν Ἀβραάμ
  choice: हमारे पिता अब्राहम
  rationale: यह सामुदायिक संबोधन मूल के निकट, सहज और पौलुस के तर्क के लिए महत्वपूर्ण है।
theological_decisions:
- issue: क्या अब्राहम सभी खतना किए हुओं के पिता हैं, या उन खतना किए हुओं के जो उनके विश्वास के पदचिह्नों पर भी चलते हैं?
  choice: वाक्य अब्राहम की पितृत्व-संबंधी भूमिका को उन खतना वालों तक सीमित करता है जो केवल बाहरी खतने पर निर्भर नहीं, बल्कि उनके विश्वास का अनुसरण भी करते हैं।
  alternative: अब्राहम बिना किसी योग्यता के सभी खतना किए हुओं के पिता हैं।
  rationale: 'οὐκ ... μόνον ἀλλὰ καί की रचना खतना वाले समूह को ही विशेषित करती है: वे केवल खतना किए हुए नहीं, बल्कि अब्राहम के विश्वास के पदचिह्नों पर चलने वाले भी हैं। अनुवाद इस सीमा को बिना धर्मशास्त्रीय विस्तार के व्यक्त करता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पदचिह्नों पर चलते हैं’ मूल रूपक को सुरक्षित रखता है। वाक्य पूर्ववर्ती पद से जुड़ा हुआ है, इसलिए आरंभ का ‘और ... भी’ मूल की संयोजक संरचना को दर्शाता है।
