language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Πατέρα πολλῶν ἐθνῶν τέθεικά σε), κατέναντι οὗ ἐπίστευσεν θεοῦ τοῦ ζῳοποιοῦντος τοὺς νεκροὺς καὶ καλοῦντος τὰ μὴ ὄντα ὡς ὄντα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/017.yaml
  text: as it is written[a], "I have made you the father of many nations"—in the presence of the God in whom he believed[b], who gives life to the dead and calls the things that are not as though they were.
translation:
  language: hi
  text: जैसा लिखा है, “मैंने तुझे बहुत-सी जातियों[a] का पिता ठहराया है।” उस परमेश्वर की दृष्टि में, जिस पर उसने विश्वास किया, वह बहुत-सी जातियों का पिता है—वही परमेश्वर मरे हुओं को जीवन देता है और जो अस्तित्व में नहीं हैं, उन्हें ऐसे बुलाता है मानो वे अस्तित्व में हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “जातियों” का अर्थ “गैर-यहूदियों” भी हो सकता है, पर उत्पत्ति के इस उद्धरण में इसका व्यापक अर्थ, अर्थात् अनेक जातियाँ या राष्ट्र, अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक व्याख्यात्मक रूप में, “जो अस्तित्व में नहीं हैं, उन्हें बुलाकर अस्तित्व में लाता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का स्वाभाविक हिन्दी सूत्र है और यूनानी पूर्णकाल के लिखे हुए वचन की स्थायी प्रामाणिकता को व्यक्त करता है।
- source_word: Πατέρα πολλῶν ἐθνῶν
  choice: बहुत-सी जातियों का पिता
  rationale: उत्पत्ति के उद्धरण में ἐθνῶν का व्यापक अर्थ विभिन्न जातियाँ या राष्ट्र है; यहाँ इसे केवल गैर-यहूदियों तक सीमित नहीं किया गया।
- source_word: τέθεικά σε
  choice: मैंने तुझे ... ठहराया है
  rationale: ‘ठहराया है’ परमेश्वर की नियुक्ति और उसके स्थायी प्रभाव को व्यक्त करता है तथा यूनानी पूर्णकाल के अनुकूल है।
- source_word: κατέναντι οὗ ἐπίστευσεν θεοῦ
  choice: जिस परमेश्वर पर उसने विश्वास किया, उसकी दृष्टि में
  rationale: यह κατέναντι के ‘सामने/दृष्टि में’ अर्थ और अब्राहम के परमेश्वर पर विश्वास, दोनों को स्वाभाविक हिन्दी में रखता है। वाक्य की स्पष्टता के लिए निहित संबंध को ‘वह उनका पिता है’ से व्यक्त किया गया है।
- source_word: ζῳοποιοῦντος τοὺς νεκρούς
  choice: मरे हुओं को जीवन देता है
  rationale: यह परमेश्वर की जीवन देने वाली सामर्थ्य को सरल, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: καλοῦντος τὰ μὴ ὄντα ὡς ὄντα
  choice: जो अस्तित्व में नहीं हैं, उन्हें ऐसे बुलाता है मानो वे अस्तित्व में हों
  rationale: यह यूनानी की संक्षिप्त और कुछ हद तक खुली अभिव्यक्ति के निकट रहता है; मुख्य पाठ में इसे सीधे ‘अस्तित्व में लाता है’ कहकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
theological_decisions:
- issue: क्या अंतिम वाक्यांश को स्पष्ट रूप से शून्य से सृष्टि करने का कथन बनाया जाए या उसके व्यापक, पाठ-समीप अर्थ को बनाए रखा जाए।
  choice: जो अस्तित्व में नहीं हैं, उन्हें ऐसे बुलाता है मानो वे अस्तित्व में हों
  alternative: जो अस्तित्व में नहीं हैं, उन्हें अस्तित्व में बुलाता है
  rationale: यूनानी शब्द परमेश्वर की सृजनात्मक सामर्थ्य की ओर संकेत कर सकते हैं, पर उनका रूप संक्षिप्त और अर्थ की दृष्टि से खुला है। इसलिए मुख्य पाठ उस तनाव को बनाए रखता है और अधिक व्याख्यात्मक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। अब्राहम के लिए उद्धरण के भीतर पारंपरिक एकवचन ‘तुझे’ रखा गया है; शेष वाक्य में अनावश्यक धार्मिक पारिभाषिकता से बचते हुए यूनानी पाठ की अस्पष्टता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
