source:
  edition: SBLGNT
  text: ὁ γὰρ νόμος ὀργὴν κατεργάζεται, οὗ ⸀δὲ οὐκ ἔστιν νόμος, οὐδὲ παράβασις.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/015.yaml
  text: For the law produces wrath[a], but where there is no law[b], neither is there transgression.
translation:
  language: hi
  text: क्योंकि व्यवस्था क्रोध उत्पन्न करती है; पर जहाँ व्यवस्था नहीं है, वहाँ उल्लंघन भी नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νόμος
  choice: व्यवस्था
  rationale: पौलुस के व्यापक शब्द को बनाए रखने के लिए प्रचलित बाइबलीय हिन्दी ‘व्यवस्था’ चुना गया है; मुख्य पाठ में इसे केवल मूसा की व्यवस्था तक सीमित नहीं किया गया।
- source_word: ὀργή
  choice: क्रोध
  rationale: यहाँ ‘क्रोध’ न्यायिक और धर्मवैज्ञानिक भार को स्वाभाविक हिन्दी में व्यक्त करता है; संदर्भ में इसे परमेश्वर के क्रोध के रूप में समझा जा सकता है, पर मूल पाठ में संबंधवाचक पद न होने के कारण वह स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: κατεργάζεται
  choice: उत्पन्न करती है
  rationale: क्रिया के परिणामकारी अर्थ को स्पष्ट और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὗ δὲ
  choice: पर जहाँ
  rationale: δέ के हल्के विरोध और οὗ के स्थानवाचक अर्थ दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: παράβασις
  choice: उल्लंघन
  rationale: यह किसी ज्ञात सीमा या आज्ञा को लाँघने का विशिष्ट भाव व्यक्त करता है और आधुनिक हिन्दी में ‘अपराध’ या ‘पाप’ की अपेक्षा मूल शब्द से अधिक निकट है।
theological_decisions:
- issue: νόμος का दायरा
  choice: व्यवस्था
  alternative: मूसा की व्यवस्था
  rationale: पद एक व्यापक सिद्धांत कहता है, यद्यपि पौलुस के तर्क में मूसा की व्यवस्था पृष्ठभूमि में है; इसलिए मुख्य पाठ इस शब्द को समय से पहले संकीर्ण नहीं करता।
- issue: ὀργή का कर्ता या स्वामी
  choice: क्रोध
  alternative: परमेश्वर का क्रोध
  rationale: संदर्भ में परमेश्वर का न्यायिक क्रोध संभावित है, लेकिन यूनानी पाठ केवल ‘क्रोध’ कहता है; अतः मूल की संक्षिप्तता और निहित अस्पष्टता बनाए रखी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। समानांतर वाक्य-विन्यास ‘जहाँ... वहाँ... भी नहीं’ तर्क को स्पष्ट करता है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई, इसलिए मुख्य पाठ में कोई संकेतक नहीं है।
