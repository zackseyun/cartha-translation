  text: who was handed over because of our trespasses and was raised for our justification[a][b].
translation:
  language: hi
  text: जो हमारे अपराधों के कारण सौंप दिया गया और हमें धर्मी ठहराए जाने के लिए[a][b] जिलाया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें धर्मी ठहराए जाने के कारण।”
    reason: alternative_reading
  - marker: b
    text: “धर्मी ठहराया जाना” को “दोषमुक्त ठहराया जाना” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρεδόθη
  choice: सौंप दिया गया
  rationale: यह यूनानी के कर्मवाच्य रूप को बनाए रखता है और किसी कर्ता का नाम जोड़े बिना उसके संभावित ईश्वरीय कर्मवाच्य भाव को सुरक्षित रखता है।
- source_word: διὰ τὰ παραπτώματα ἡμῶν
  choice: हमारे अपराधों के कारण
  rationale: διά के साथ कर्मकारक यहाँ स्वाभाविक रूप से कारण बताता है; यह अनुवाद स्पष्ट और आधुनिक हिन्दी में सहज है।
- source_word: παραπτώματα
  choice: अपराधों
  rationale: यह नैतिक उल्लंघनों का भाव व्यक्त करता है और सामान्य शब्द ‘पापों’ की अपेक्षा παράπτωμα की विशिष्टता को अधिक निकटता से बनाए रखता है।
- source_word: ἠγέρθη
  choice: जिलाया गया
  rationale: यह पुनरुत्थान के अर्थ को स्वाभाविक हिन्दी में व्यक्त करते हुए यूनानी कर्मवाच्य को बनाए रखता है।
- source_word: διὰ τὴν δικαίωσιν ἡμῶν
  choice: हमें धर्मी ठहराए जाने के लिए
  rationale: मुख्य पाठ में उद्देश्य अथवा परिणाम का भाव रखा गया है, जबकि व्याकरण की दृष्टि से संभव कारणसूचक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: δικαίωσιν
  choice: धर्मी ठहराया जाना
  rationale: यह पौलुस की न्यायिक और उद्धार-संबंधी शब्दावली को समझने योग्य हिन्दी में व्यक्त करता है तथा केवल आंतरिक नैतिक परिवर्तन का अर्थ देने से बचता है।
theological_decisions:
- issue: क्या διὰ τὴν δικαίωσιν ἡμῶν उद्देश्य/परिणाम (‘धर्मी ठहराए जाने के लिए’) बताता है या कारण (‘धर्मी ठहराए जाने के कारण’)?
  choice: हमें धर्मी ठहराए जाने के लिए
  alternative: हमें धर्मी ठहराए जाने के कारण
  rationale: मुख्य पाठ संभावित भाव को रखता है कि मसीह का जिलाया जाना विश्वासियों के धर्मी ठहराए जाने से लक्ष्य अथवा परिणाम के रूप में जुड़ा है; कारणसूचक अर्थ व्याकरणतः संभव होने के कारण पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पद पिछले वाक्य से जुड़े यूनानी संबंधवाचक रूप ‘जो’ को बनाए रखता है। ‘सौंप दिया गया’ और ‘जिलाया गया’ दोनों कर्मवाच्य हैं, जिससे मूल पाठ द्वारा कर्ता को अनकहा रखने की शैली सुरक्षित रहती है।
