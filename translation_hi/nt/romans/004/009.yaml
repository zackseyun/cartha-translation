language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ μακαρισμὸς οὖν οὗτος ἐπὶ τὴν περιτομὴν ἢ καὶ ἐπὶ τὴν ἀκροβυστίαν; λέγομεν ⸀γάρ· Ἐλογίσθη τῷ Ἀβραὰμ ἡ πίστις εἰς δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/009.yaml
  text: Is this blessing[a], then, for the circumcised, or also for the uncircumcised? For we say, “Faith was counted to Abraham as righteousness.”
translation:
  language: hi
  text: तो क्या यह धन्यता खतना किए हुओं के लिए है, या खतना न किए हुओं के लिए भी? क्योंकि हम कहते हैं, “अब्राहम के विश्वास को उसके लिए धार्मिकता[a] के रूप में गिना गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय।”
    reason: δικαιοσύνη का प्रसंगानुकूल शब्दार्थ-विकल्प; मुख्य पाठ में पौलुस के तर्क के अनुरूप ‘धार्मिकता’ रखा गया है।
lexical_decisions:
- source_word: μακαρισμός
  choice: धन्यता
  rationale: यह शब्द 4:6–8 में वर्णित उस धन्य अवस्था की ओर लौटता है जिसकी घोषणा की गई है। ‘धन्यता’ मूल संज्ञा और संदर्भगत अर्थ दोनों को बनाए रखती है।
- source_word: περιτομή
  choice: खतना किए हुए
  rationale: यद्यपि यूनानी में शाब्दिक रूप से ‘खतना’ है, यहाँ यह खतने का चिह्न रखने वाले लोगों के लिए लक्षणा के रूप में प्रयुक्त है।
- source_word: ἀκροβυστία
  choice: खतना न किए हुए
  rationale: यहाँ संज्ञा उन लोगों को दर्शाती है जिनका खतना नहीं हुआ; यह हिंदी में स्वाभाविक रूप से विपरीत समूह को स्पष्ट करता है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस संदर्भ में अब्राहम के परमेश्वर पर विश्वास को व्यक्त करने वाला मानक और स्पष्ट हिंदी शब्द।
- source_word: ἐλογίσθη
  choice: गिना गया
  rationale: यह λογίζομαι के लेखा या गणना-संबंधी भाव को सहज हिंदी में सुरक्षित रखता है और अनावश्यक धर्मवैज्ञानिक विस्तार नहीं जोड़ता।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के तर्क में यह परमेश्वर के सामने सही ठहरने या सही स्थिति के भाव से जुड़ा है; ‘धार्मिकता’ प्रचलित और संदर्भानुकूल पद है।
- source_word: εἰς δικαιοσύνην
  choice: धार्मिकता गिना गया
  rationale: यह यूनानी मुहावरे के संबंध को संक्षिप्त हिंदी में रखता है और विश्वास तथा धार्मिकता के बीच पौलुस के कथन को बिना अतिरिक्त व्याख्या के प्रस्तुत करता है।
theological_decisions:
- issue: अब्राहम के विश्वास और धार्मिकता के बीच संबंध
  choice: अब्राहम का विश्वास उसके लिए धार्मिकता गिना गया।
  alternative: अब्राहम के विश्वास का लेखा उसके लिए धार्मिकता के रूप में किया गया।
  rationale: मुख्य पाठ मूल कथन की संक्षिप्तता और धर्मवैज्ञानिक तनाव को बनाए रखता है; यह इस पद में किसी विस्तृत मत-प्रणाली को नहीं जोड़ता।
- issue: περιτομή और ἀκροβυστία का आशय
  choice: लोगों के समूह के रूप में ‘खतना किए हुए’ और ‘खतना न किए हुए’
  alternative: अवस्थाओं के रूप में ‘खतना’ और ‘बेखतनी’
  rationale: प्रश्न आशीष पाने वाले व्यक्तियों के विषय में है, इसलिए समूहवाचक अर्थ को स्पष्ट करना स्वाभाविक है, जबकि मूल विरोध सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘खतना’ सामान्य पाठक के लिए ‘सुन्नत’ की अपेक्षा अधिक व्यापक और तटस्थ है।
