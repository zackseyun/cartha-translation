source:
  edition: SBLGNT
  text: εἰ γὰρ οἱ ἐκ νόμου κληρονόμοι, κεκένωται ἡ πίστις καὶ κατήργηται ἡ ἐπαγγελία·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/014.yaml
  text: For if those who are of the law are heirs[c][b][a], faith has been emptied and the promise has been nullified.
translation:
  language: hi
  text: क्योंकि यदि व्यवस्था से जुड़े लोग[a] वारिस हैं, तो विश्वास खोखला कर दिया गया है और प्रतिज्ञा निष्प्रभावी कर दी गई है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो व्यवस्था से हैं।” इसका अर्थ “व्यवस्था पर निर्भर रहनेवाले लोग” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “निष्प्रभावी कर दी गई है” का अनुवाद “बेअसर कर दी गई है” या “निरस्त कर दी गई है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἐκ νόμου
  choice: व्यवस्था से जुड़े लोग
  rationale: यह पौलुस की संक्षिप्त अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और लोगों को व्यवस्था के साथ उनके संबंध से परिभाषित करता है, बिना इसे केवल व्यवस्था-पालन तक सीमित किए।
- source_word: κληρονόμοι
  choice: वारिस
  rationale: विरासत और प्रतिज्ञा के संदर्भ में यह प्रचलित, स्पष्ट और स्वाभाविक हिन्दी शब्द है।
- source_word: κεκένωται
  choice: खोखला कर दिया गया है
  rationale: यह पूर्णकालिक निष्क्रिय रूप को व्यक्त करते हुए मूल क्रिया के ‘खाली कर देने’ वाले रूपक को बनाए रखता है।
- source_word: πίστις
  choice: विश्वास
  rationale: रोमियों 4 में व्यवस्था और विश्वास के बीच जिस विरोध को प्रस्तुत किया गया है, उसे यह स्पष्ट और पारंपरिक रूप से व्यक्त करता है।
- source_word: κατήργηται
  choice: निष्प्रभावी कर दी गई है
  rationale: यह किसी वस्तु को प्रभावहीन कर देने का भाव देता है, पर उसके पूर्ण विनाश का अर्थ नहीं जोड़ता।
- source_word: ἡ ἐπαγγελία
  choice: प्रतिज्ञा
  rationale: निश्चित पदबंध उस विशेष प्रतिज्ञा की ओर संकेत करता है जिसकी चर्चा निकटवर्ती संदर्भ में हो रही है।
theological_decisions:
- issue: व्यवस्था के संबंध में οἱ ἐκ νόμου का अर्थ
  choice: व्यवस्था से जुड़े लोग
  alternative: जो व्यवस्था से हैं; व्यवस्था पर निर्भर रहनेवाले लोग
  rationale: मुख्य पाठ लोगों को व्यवस्था के साथ उनके संबंध से पहचानता है, पर यह तय नहीं करता कि वह संबंध केवल पालन, उत्पत्ति या भरोसे का है।
- issue: पौलुस के νόμος-विरोधी संदर्भ में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इस अनुच्छेद में विरासत का आधार व्यवस्था नहीं बल्कि विश्वास है; ‘विश्वास’ इस तर्क को स्पष्ट रखते हुए शब्द की धार्मिक गंभीरता बनाए रखता है।
- issue: κατήργηται की प्रभाव-सम्बन्धी शक्ति
  choice: निष्प्रभावी कर दी गई है
  alternative: निरस्त कर दी गई है; बेअसर कर दी गई है
  rationale: यह प्रतिज्ञा को प्रभावहीन या अमान्य बना दिए जाने का भाव सुरक्षित रखता है, बिना यह कहे कि वह अस्तित्व में ही नहीं रही।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘खोखला कर दिया गया’ मूल के रूपक को बनाए रखता है, जबकि ‘निष्प्रभावी’ प्रतिज्ञा के प्रभाव को समाप्त किए जाने का सटीक भाव देता है।
