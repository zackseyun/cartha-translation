  verdict: revise
  source_fidelity: The draft accurately preserves the Greek contrast between the one not working and the one believing in God, as well as the reference to God justifying the ungodly. The final accounting expression, however, requires an explicit Hindi construction for λογίζεται ... εἰς δικαιοσύνην.
  naturalness: '‘उसका विश्वास धार्मिकता गिना जाता है’ is not idiomatic standard Hindi: it lacks the required postposition and does not clearly express ‘counted as righteousness.’ Recasting it with ‘उसके विश्वास को ... के रूप में गिना जाता है’ is natural and precise.'
  terminology: ‘विश्वास,’ ‘भक्तिहीन,’ ‘धर्मी ठहराता है,’ and ‘धार्मिकता’ appropriately maintain the lexical and theological links in the verse without imposing a doctrinal system. The alternative ‘धर्मी घोषित करता है’ is suitable in a footnote.
  issues:
  - severity: medium
    issue: The clause ‘उसका विश्वास धार्मिकता गिना जाता है’ is grammatically and idiomatically defective.
    rationale: Hindi passive ‘गिना जाता है’ requires the object in the oblique form (‘विश्वास को’), and εἰς δικαιοσύνην is best represented explicitly as ‘धार्मिकता के रूप में.’ The revision preserves the Greek accounting/result idiom.
