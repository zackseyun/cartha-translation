  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῷ δὲ μὴ ἐργαζομένῳ, πιστεύοντι δὲ ἐπὶ τὸν δικαιοῦντα τὸν ἀσεβῆ, λογίζεται ἡ πίστις αὐτοῦ εἰς δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/005.yaml
  text: But to the one not working[a], but believing in the one who justifies the ungodly[d][c][b], his faith is counted as righteousness.
translation:
  language: hi
  text: परन्तु जो काम नहीं करता, पर उस पर विश्वास करता है जो भक्तिहीन को धर्मी ठहराता है,[a] उसके विश्वास को धार्मिकता के रूप में गिना जाता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भक्तिहीन को धर्मी घोषित करता है।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘धार्मिकता के लिए गिना जाता है’ या ‘धार्मिकता के रूप में माना जाता है।’ ‘धार्मिकता’ के लिए यूनानी शब्द का अर्थ कुछ प्रसंगों में ‘न्याय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῷ ... μὴ ἐργαζομένῳ
  choice: जो काम नहीं करता
  rationale: यह संज्ञात्मक वर्तमान कृदन्त और μή को स्वाभाविक हिन्दी में व्यक्त करता है तथा ‘विश्वास करता है’ के साथ यूनानी विरोध को बनाए रखता है; प्रसंग से अलग हर प्रकार के काम की निन्दा नहीं जोड़ता।
- source_word: πιστεύοντι δὲ ἐπὶ
  choice: बल्कि उस पर विश्वास करता है
  rationale: πιστεύω के विश्वास-शब्दसमूह को बनाए रखते हुए ἐπί से व्यक्त निर्भरता का स्वाभाविक हिन्दी रूप देता है।
- source_word: τὸν δικαιοῦντα
  choice: जो ... धर्मी ठहराता है
  rationale: पौलुस के तर्क में δικαιόω की न्यायिक और धर्मवैज्ञानिक शक्ति को सुरक्षित रखता है और δικαιοσύνη के साथ शब्दार्थगत सम्बन्ध भी दिखाता है।
- source_word: τὸν ἀσεβῆ
  choice: भक्तिहीन को
  rationale: ἀσεβής का केन्द्र परमेश्वर के प्रति श्रद्धा या भक्ति का अभाव है; ‘भक्तिहीन’ इसे ‘दुष्ट’ की अपेक्षा अधिक ठीक रूप से व्यक्त करता है।
- source_word: λογίζεται
  choice: गिना जाता है
  rationale: यह हिसाब लगाने या किसी रूप में मानने की भावभूमि को सरल आधुनिक हिन्दी में रखता है, बिना किसी संकीर्ण धर्मवैज्ञानिक व्याख्या को थोपे।
- source_word: ἡ πίστις αὐτοῦ
  choice: उसका विश्वास
  rationale: निकटवर्ती πιστεύοντι के साथ शब्दगत संगति रखता है; यहाँ ‘विश्वासयोग्यता’ की तुलना में विश्वास का भाव प्रसंगानुकूल है।
- source_word: εἰς δικαιοσύνην
  choice: धार्मिकता गिना जाता है
  rationale: λογίζεται ... εἰς की परिणामी या मान्यतासूचक रचना को स्वाभाविक हिन्दी में ‘के रूप में’ के अर्थ के साथ व्यक्त करता है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: δικαιοσύνη के लिए स्थापित और व्यापक हिन्दी पद है तथा δικαιόω से सम्बन्ध बनाए रखता है; ‘न्याय’ सम्भव अर्थक्षेत्र है पर यहाँ कम उपयुक्त है।
theological_decisions:
- issue: δικαιοῦντα का धर्मवैज्ञानिक रूप से भारित अर्थ
  choice: धर्मी ठहराता है
  alternative: धर्मी घोषित करता है
  rationale: ‘धर्मी ठहराता है’ न्यायिक अर्थ को सुरक्षित रखता है, पर यह निर्धारित नहीं करता कि ठहराने का पूरा धर्मवैज्ञानिक ढाँचा किस प्रकार समझा जाए।
- issue: πίστις/πιστεύω का अनुवाद
  choice: विश्वास करता है / विश्वास
  alternative: भरोसा करता है / भरोसा
  rationale: एक ही शब्दसमूह की संगति बनाए रखी गई है। ἐπί में भरोसे का भाव निहित है, पर मुख्य पाठ में ‘विश्वास’ पौलुस के तर्क के प्रमुख पद को बेहतर बनाए रखता है।
- issue: कार्य और विश्वास के विरोध का दायरा
  choice: जो काम नहीं करता, बल्कि ... विश्वास करता है
  alternative: जो कर्मों पर निर्भर नहीं रहता, बल्कि ... भरोसा करता है
  rationale: मुख्य पाठ यूनानी की सीधी संरचना बनाए रखता है और यह व्याख्यात्मक जोड़ नहीं करता कि यहाँ किन सभी प्रकार के ‘कामों’ का आशय है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘परन्तु ... बल्कि’ से यूनानी δέ ... δέ का विरोध रखा गया है। ‘काम’ को जानबूझकर सामान्य रखा गया है ताकि प्रसंग से अधिक विशिष्ट ‘कर्मकाण्ड’ या ‘व्यवस्था के काम’ न जोड़े जाएँ।
