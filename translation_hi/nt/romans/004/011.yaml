source:
  edition: SBLGNT
  text: καὶ σημεῖον ἔλαβεν περιτομῆς, σφραγῖδα τῆς δικαιοσύνης τῆς πίστεως τῆς ἐν τῇ ἀκροβυστίᾳ, εἰς τὸ εἶναι αὐτὸν πατέρα πάντων τῶν πιστευόντων δι’ ἀκροβυστίας, εἰς τὸ ⸀λογισθῆναι αὐτοῖς τὴν δικαιοσύνην,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/011.yaml
  text: And he received the sign of circumcision as a seal of the righteousness of the faith that he had while uncircumcised[a], so that he might be the father of all who believe while uncircumcised, so that righteousness might be counted to them also[c][b],
translation:
  language: hi
  text: और उसने खतने का चिन्ह पाया—उस धार्मिकता[a] की मुहर, जो उसे उस विश्वास के संबंध में प्राप्त थी जब उसका खतना नहीं हुआ था। ताकि वह उन सबका पिता हो जो खतनारहित अवस्था में[b] विश्वास करते हैं, ताकि उनके लिए भी धार्मिकता गिनी जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘धार्मिकता’ के लिए ‘न्याय’ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “खतनारहित अवस्था में”; अर्थात जब उनका खतना न हुआ हो।
    reason: lexical_alternative
  - marker: c
    text: या “उनके खाते में डाली जाए” अथवा “उनके नाम लिखी जाए”।
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: चिन्ह
  rationale: ‘चिन्ह’ वाचा-संबंधी बाहरी संकेत का भाव स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: περιτομή
  choice: खतना
  rationale: यह इस यहूदी धार्मिक रीति के लिए आधुनिक मानक हिन्दी का सटीक और सर्वसुलभ शब्द है।
- source_word: σφραγίς
  choice: मुहर
  rationale: ‘मुहर’ प्रमाणीकरण और पुष्टि के मूल रूपक को बनाए रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: पौलुस के तर्क में परमेश्वर के सामने सही ठहरने/सही स्थिति के भाव को बिना किसी एक व्याख्यात्मक सूत्र में सीमित किए सुरक्षित रखता है।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ प्रमुख अर्थ भरोसा/विश्वास है; ‘विश्वासयोग्यता’ को मुख्य पाठ में लाने का पर्याप्त संदर्भगत आधार नहीं है।
- source_word: ἐν τῇ ἀκροβυστίᾳ
  choice: उस समय ... जब उसका खतना नहीं हुआ था
  rationale: यह इब्राहीम की उस अवस्था को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है जिसमें उसका विश्वास था।
- source_word: πατέρα πάντων τῶν πιστευόντων
  choice: उन सबका पिता ... जो ... विश्वास करते हैं
  rationale: प्रतिनिधिक पिता होने के पौलुस के कथन को सहज हिन्दी में अक्षुण्ण रखता है।
- source_word: δι’ ἀκροβυστίας
  choice: बिना खतने की दशा में
  rationale: यहाँ διά साधन के बजाय उस अवस्था को दर्शाता है जिसमें लोग विश्वास करते हैं; अनुवाद उस अर्थ को सुरक्षित रखता है।
- source_word: λογισθῆναι
  choice: गिनी जाए
  rationale: यह लेखांकन के रूपक को बनाए रखता है और हिन्दी में धर्मशास्त्रीय अर्थ को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: καί
  choice: भी
  rationale: यह स्पष्ट करता है कि बिना खतने वाले विश्वासियों के लिए भी धार्मिकता गिनी जाती है।
theological_decisions:
- issue: खतने और धार्मिकता का संबंध
  choice: खतने को पहले से विद्यमान विश्वास-संबंधी धार्मिकता का चिन्ह और मुहर बताया गया है, धार्मिकता प्राप्त करने का साधन नहीं।
  alternative: वाक्य को इस प्रकार समझा जा सकता था मानो खतना स्वयं धार्मिकता प्रदान करता हो।
  rationale: यूनानी पाठ में खतना उस विश्वास और धार्मिकता के बाद आता है जो इब्राहीम की बिना खतने की अवस्था से संबंधित है; अनुवाद इसी क्रम को सुरक्षित रखता है और बाद की सांप्रदायिक व्याख्याएँ नहीं जोड़ता।
- issue: τῆς δικαιοσύνης τῆς πίστεως का संबंध
  choice: ‘उस धार्मिकता ... जो उस विश्वास से जुड़ी थी’
  alternative: ‘विश्वास से मिलने वाली धार्मिकता’
  rationale: चुना गया रूप यूनानी संबंधकारक की वास्तविक व्यापकता बनाए रखता है और विश्वास तथा धार्मिकता के संबंध को कारण-साधन के रूप में आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘चिन्ह’ और ‘मुहर’ के मूल रूपक सुरक्षित हैं। लंबे यूनानी वाक्य को हिन्दी में स्पष्ट विराम के साथ रखा गया है, जबकि दोनों उद्देश्य-वाक्यों का तार्किक संबंध बनाए रखा गया है।
