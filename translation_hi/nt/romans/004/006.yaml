id: ROM.4.6
reference: Romans 4:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καθάπερ καὶ Δαυὶδ λέγει τὸν μακαρισμὸν τοῦ ἀνθρώπου ᾧ ὁ θεὸς λογίζεται δικαιοσύνην χωρὶς ἔργων·
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/006.yaml
  text: Just as David also speaks of the blessedness of the man to whom God credits righteousness apart from works:[a][b][c]
translation:
  language: hi
  text: जैसे दाऊद भी उस मनुष्य की धन्यता के विषय में कहता है, जिसके खाते में परमेश्वर कर्मों के बिना धार्मिकता गिनता है:[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्य” यहाँ प्रतिनिधिक अर्थ में है; इसका अनुवाद “व्यक्ति” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “गिनता है” का अनुवाद “श्रेय देता है,” “मानता है,” या “लेखे में रखता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “धार्मिकता” के लिए “न्यायपरायणता” भी एक सम्भव अर्थ है।
    reason: alternative_reading
lexical_decisions:
- source_word: καθάπερ καὶ
  choice: ठीक वैसे ही ... भी
  rationale: यह पद पिछले तर्क के साथ तुलना करता है और दाऊद को एक अतिरिक्त साक्षी के रूप में प्रस्तुत करता है।
- source_word: τὸν μακαρισμὸν
  choice: धन्य होने की बात
  rationale: यह स्वाभाविक आधुनिक हिन्दी में धन्य माने जाने की अवस्था या घोषणा, दोनों को व्यक्त करता है।
- source_word: τοῦ ἀνθρώπου
  choice: उस मनुष्य के
  rationale: यूनानी में एकवचन पुल्लिंग रूप है, जिसका प्रयोग यहाँ प्रतिनिधिक अर्थ में हुआ है।
- source_word: λογίζεται
  choice: गिनता है
  rationale: यह λογίζομαι के हिसाबी रूपक को स्पष्ट और परिचित हिन्दी में बनाए रखता है; ‘लेखा लगाता है’ सम्भव है, पर यहाँ कम स्वाभाविक है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: पौलुस के इस प्रसंग में यह प्रचलित और अर्थपूर्ण समतुल्य है, जो परमेश्वर के सामने सही ठहरने से जुड़े धार्मिक आशय को बनाए रखता है।
- source_word: χωρὶς ἔργων
  choice: कर्मों से अलग
  rationale: यह कर्मों को इस गिनती का आधार मानने से अलग रखने वाले पौलुस के विरोध को निकटता से व्यक्त करता है।
theological_decisions:
- issue: ἀνθρώπου का प्रतिनिधिक पुल्लिंग प्रयोग
  choice: उस मनुष्य के
  alternative: उस व्यक्ति के
  rationale: मूल के एकवचन पुल्लिंग रूप को रखा गया है, पर इसका आशय केवल पुरुषों तक सीमित नहीं है; इस प्रतिनिधिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: δικαιοσύνην का अर्थ
  choice: धार्मिकता
  alternative: न्यायपरायणता
  rationale: ‘धार्मिकता’ पौलुस की शब्दावली और इस लेखा-संबंधी प्रसंग को बेहतर बनाए रखती है; ‘न्याय’ यहाँ हिन्दी में दंडात्मक या सामाजिक न्याय का भ्रामक संकेत दे सकता है।
- issue: λογίζεται में परमेश्वर की गणना का स्वरूप
  choice: गिनता है
  alternative: श्रेय देता है
  rationale: ‘गिनता है’ मूल के लेखा-रूपक को बिना किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। वाक्य-रचना ने यूनानी तुलना और लेखा-रूपक को सँभाला है, जबकि अत्यधिक तकनीकी धर्मशास्त्रीय शब्दावली से बचा गया है।
