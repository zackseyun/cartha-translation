source:
  edition: SBLGNT
  text: εἰ γὰρ Ἀβραὰμ ἐξ ἔργων ἐδικαιώθη, ἔχει καύχημα· ἀλλ’ οὐ ⸀πρὸς θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/romans/004/002.yaml
  text: For if Abraham was justified by works[b][a], he has a boast—but not before God.
translation:
  language: hi
  text: क्योंकि यदि अब्राहम कामों के आधार पर धर्मी ठहराया गया[a], तो उसके पास घमंड करने का आधार है[b]—परन्तु परमेश्वर के सामने नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “धर्मी घोषित किया गया।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “तो उसके पास घमंड करने के लिए कुछ है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: γάρ को ‘क्योंकि’ से पिछले तर्क के साथ जोड़ा गया है और εἰ की शर्त को ‘यदि’ से स्पष्ट रखा गया है।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: नाम का प्रचलित मानक हिन्दी रूप अपनाया गया है।
- source_word: ἐξ ἔργων
  choice: कामों के आधार पर
  rationale: ἐξ यहाँ स्रोत या आधार बताता है। यह रूप केवल साधन बताने वाले ‘कामों से’ की अपेक्षा अर्थ को अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐδικαιώθη
  choice: धर्मी ठहराया गया
  rationale: न्यायिक अर्थ और निष्क्रिय क्रिया-रूप दोनों सुरक्षित रहते हैं; वैकल्पिक ‘धर्मी घोषित किया गया’ पादटिप्पणी में दिया गया है।
- source_word: ἔχει καύχημα
  choice: उसके पास घमंड करने का आधार है
  rationale: καύχημα का अर्थ यहाँ घमंड का विषय या आधार हो सकता है। यह हिन्दी में स्वाभाविक है और संज्ञात्मक भाव बनाए रखता है।
- source_word: ἀλλ’ οὐ πρὸς θεόν
  choice: परन्तु परमेश्वर के सामने नहीं
  rationale: πρὸς θεόν को इस प्रसंग में परमेश्वर के सम्मुख या उसके मूल्यांकन में होने के अर्थ के साथ सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: शर्त को वास्तविक तथ्य मानकर व्यक्त किया जाए या काल्पनिक संभावना के रूप में
  choice: ‘यदि अब्राहम ... धर्मी ठहराया गया’ के रूप में शर्त को सीधे रखा गया है।
  alternative: ‘यदि अब्राहम वास्तव में ... धर्मी ठहराया गया था’ या ‘यदि अब्राहम ... धर्मी ठहराया गया होता।’
  rationale: यूनानी वाक्य शर्त प्रस्तुत करता है, पर यहाँ स्वयं यह स्पष्ट नहीं करता कि वह वास्तविक है या अवास्तविक। इसलिए पौलुस के आगे के निष्कर्ष को अनुवाद में पहले से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कामों के आधार पर’ पौलुस के तर्क की संक्षिप्तता बनाए रखते हुए आधार का संबंध स्पष्ट करता है; ‘तो’ हिन्दी के स्वाभाविक यदि–तो विन्यास के लिए जोड़ा गया है।
