id: ROM.8.22
reference: Romans 8:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ ὅτι πᾶσα ἡ κτίσις συστενάζει καὶ συνωδίνει ἄχρι τοῦ νῦν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/022.yaml
  text: For we know that the whole creation groans together and suffers labor pains together until now[a][b].
translation:
  language: hi
  text: क्योंकि हम जानते हैं कि सारी सृष्टि अब तक मिलकर कराहती और प्रसव-पीड़ा सहती आ रही है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “समस्त सृष्टि”; “हर सृजी हुई वस्तु” भी संभव है, हालांकि यहाँ व्यापक सृष्टिगत अर्थ अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: “प्रसव-पीड़ा” जन्म की वेदना का बिंब है; यह केवल दुःख ही नहीं, बल्कि नए जीवन की ओर बढ़ती पीड़ा का संकेत भी देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἴδαμεν
  choice: हम जानते हैं
  rationale: यूनानी रूप ऐतिहासिक रूप से पूर्णकालिक है, पर यहाँ वर्तमान में विद्यमान, साझा और दृढ़ ज्ञान व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण अथवा व्याख्या प्रस्तुत करनेवाले संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πᾶσα ἡ κτίσις
  choice: सारी सृष्टि
  rationale: संज्ञा के साथ πᾶσα का प्रयोग समष्टिगत अर्थ देता है; प्रसंग में व्यक्तिगत प्राणियों के बजाय व्यापक सृजित जगत अभिप्रेत है।
- source_word: συστενάζει
  choice: मिलकर कराहती
  rationale: ‘मिलकर’ συν- उपसर्ग में निहित साझा कराहने के भाव को सुरक्षित रखता है।
- source_word: συνωδίνει
  choice: प्रसव-पीड़ा सहती
  rationale: यह सामान्य दुःख नहीं, बल्कि प्रसव-वेदना का विशिष्ट बिंब है; पहले क्रिया के साथ जुड़ा ‘मिलकर’ दोनों समानांतर क्रियाओं के सामूहिक भाव को स्वाभाविक रूप से समेटता है।
- source_word: ἄχρι τοῦ νῦν
  choice: अब तक … आ रही है
  rationale: यह ऐसी जारी अवस्था व्यक्त करता है जो वर्तमान समय तक चली आई है; हिन्दी का संयुक्त क्रिया-रूप उसकी निरंतरता स्पष्ट करता है।
theological_decisions:
- issue: κτίσις का अनुवाद ‘सृष्टि’ हो या ‘प्राणी/सृजी हुई वस्तु’।
  choice: सारी सृष्टि
  alternative: हर सृजी हुई वस्तु; सभी प्राणी
  rationale: रोमियों 8:19–23 में पौलुस व्यापक, मानवीकृत सृजित व्यवस्था की बात करता है जो व्यर्थता के अधीन है और मुक्ति की बाट जोहती है। ‘सृष्टि’ इस व्यापक अर्थ को बनाए रखती है, फिर भी उसकी सटीक सीमा को आवश्यकता से अधिक निर्धारित नहीं करती।
- issue: प्रसव-पीड़ा के बिंब को सामान्य दुःख के रूप में सरल किया जाए या स्पष्ट रखा जाए।
  choice: प्रसव-पीड़ा सहती
  alternative: पीड़ा सहती
  rationale: συνωδίνει स्पष्ट रूप से प्रसव-वेदना का बिंब रखता है। इसे बनाए रखने से वर्तमान कष्ट और उससे आगे आनेवाली नई अवस्था के बीच का संकेत सुरक्षित रहता है, बिना उस संकेत को पूर्ण व्याख्या में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘कराहती’ और ‘प्रसव-पीड़ा’ मूल के सजीव मानवीकरण तथा जन्म-वेदना के बिंब को बनाए रखते हैं; ‘मिलकर’ दोनों क्रियाओं के साझा भाव से स्वाभाविक रूप से जुड़ता है।
