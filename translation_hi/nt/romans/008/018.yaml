id: ROM.8.18
reference: Romans 8:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Λογίζομαι γὰρ ὅτι οὐκ ἄξια τὰ παθήματα τοῦ νῦν καιροῦ πρὸς τὴν μέλλουσαν δόξαν ἀποκαλυφθῆναι εἰς ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/018.yaml
  text: For I consider that the sufferings of the present time are not worthy to be compared with the coming glory that is to be revealed to us[a].
translation:
  language: hi
  text: क्योंकि मैं मानता हूँ कि इस वर्तमान समय के दुःख उस आने वाली महिमा के सामने तुलना के योग्य नहीं हैं, जो हम पर[a] प्रकट होने वाली है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हममें”।
    reason: मूल यूनानी εἰς ἡμᾶς का अर्थ यहाँ “हम पर” या “हममें” समझा जा सकता है।
lexical_decisions:
- source_word: Λογίζομαι
  choice: मैं मानता हूँ
  rationale: यह सोच-विचार से किए गए आकलन को व्यक्त करता है, केवल भावना को नहीं; आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछली बात का आधार या स्पष्टीकरण देनेवाले संयोजक का बल सुरक्षित रखता है।
- source_word: οὐκ ἄξια ... πρὸς
  choice: के सामने तुलना के योग्य नहीं हैं
  rationale: ἄξια और πρὸς से व्यक्त असमानता तथा तुलना का भाव स्पष्ट और स्वाभाविक हिन्दी में देता है।
- source_word: τὰ παθήματα
  choice: दुःख
  rationale: यहाँ अनुभव किए जानेवाले कष्टों को सरल, व्यापक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοῦ νῦν καιροῦ
  choice: इस वर्तमान समय के
  rationale: καιρός को ‘समय’ के रूप में रखता है और अनावश्यक रूप से ‘युग’ का विशेष अंतकालीन अर्थ नहीं जोड़ता।
- source_word: τὴν μέλλουσαν δόξαν
  choice: उस आनेवाली महिमा
  rationale: μέλλουσαν के भविष्याभिमुख अर्थ को अलग से सुरक्षित रखते हुए δόξαν के लिए स्थापित ‘महिमा’ रखता है।
- source_word: ἀποκαλυφθῆναι
  choice: प्रकट होनेवाली है
  rationale: निष्क्रिय और भविष्याभिमुख अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ἡμᾶς
  choice: हम पर
  rationale: εἰς के लक्ष्य/दिशा-संबंधी बल को हिन्दी में सहज रूप से व्यक्त करता है; ‘हममें’ की सहभागितामूलक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: महिमा के प्रकट होने के संबंध में εἰς ἡμᾶς का अर्थ
  choice: हम पर
  alternative: हममें
  rationale: पूर्वसर्गीय वाक्यांश लक्ष्य, संबंध या सहभागिता का निकटवर्ती अर्थ दे सकता है। मुख्य पाठ में ‘हम पर’ दिशा/लक्ष्य का भाव रखता है, जबकि व्याख्यात्मक रूप से महत्त्वपूर्ण ‘हममें’ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘आनेवाली’ तथा ‘प्रकट होनेवाली’ दोनों रखकर μέλλουσαν और ἀποκαλυφθῆναι के अलग-अलग अर्थ सुरक्षित किए गए हैं।
