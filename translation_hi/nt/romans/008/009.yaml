reference: Romans 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ οὐκ ἐστὲ ἐν σαρκὶ ἀλλὰ ἐν πνεύματι, εἴπερ πνεῦμα θεοῦ οἰκεῖ ἐν ὑμῖν. εἰ δέ τις πνεῦμα Χριστοῦ οὐκ ἔχει, οὗτος οὐκ ἔστιν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/009.yaml
  text: But you are not in the flesh but in the Spirit[a], if indeed the Spirit of God dwells in you. But if anyone does not have the Spirit of Messiah[c][b], he does not belong to him.
translation:
  language: hi
  text: पर तुम शरीर में नहीं, बल्कि आत्मा में हो, यदि सचमुच परमेश्वर की आत्मा तुम में वास करती है। पर यदि किसी के पास मसीह की आत्मा नहीं है, तो वह उसका नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “वह उसका नहीं है।” निकटतम संदर्भ मसीह है, यद्यपि व्यापक प्रसंग में इसका संबंध परमेश्वर से भी समझा जा सकता है।'
    reason: ambiguity
lexical_decisions:
- source_word: σάρξ
  choice: शरीर
  rationale: पौलुस के मुख्य शब्द और उसके रूपकात्मक धर्मवैचारिक तनाव को बनाए रखने के लिए ‘शरीर’ रखा गया है; ‘के अधीन’ इस प्रसंग में ἐν की क्षेत्र या प्रभावाधीन अस्तित्व की भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: निकटवर्ती ‘परमेश्वर का आत्मा’ और ‘मसीह का आत्मा’ से स्पष्ट है कि संकेत पवित्र आत्मा की ओर है, न कि केवल मानवीय मनोवृत्ति की ओर।
- source_word: οἰκεῖ
  choice: वास करता है
  rationale: यह स्थायी निवास की भावना बनाए रखता है और आधुनिक बाइबलीय हिन्दी में गरिमापूर्ण तथा सुबोध है।
- source_word: Χριστοῦ
  choice: मसीह का
  rationale: Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ कहना उसके अभिषिक्त जन के अर्थ को बनाए रखता है।
- source_word: οὐκ ἔστιν αὐτοῦ
  choice: वह मसीह का नहीं है
  rationale: यूनानी स्वामित्व-सूचक मुहावरे को सहज हिन्दी में व्यक्त किया गया है; तत्काल पूर्वपद को स्पष्ट करने हेतु ‘मसीह’ दोहराया गया है।
- source_word: εἴπερ
  choice: यदि सचमुच
  rationale: शर्त की व्याकरणिक आकृति और वक्ता द्वारा उसके सत्य माने जाने की संकेतात्मक शक्ति, दोनों को बनाए रखता है।
- source_word: Ὑμεῖς
  choice: तुम
  rationale: यूनानी में सर्वनाम स्पष्ट और बलयुक्त है; ‘पर तुम’ पिछले विरोध को बनाए रखता है।
- source_word: οὗτος
  choice: वह
  rationale: यूनानी एकवचन प्रतिनिधिक रूप को स्वाभाविक हिन्दी में ‘वह’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘शरीर में’ और ‘आत्मा में’ का विरोध
  choice: ‘शरीर के अधीन’ और ‘आत्मा के अधीन’—अस्तित्व के क्षेत्र या प्रभाव को व्यक्त करते हुए मूल प्रमुख शब्द बनाए गए
  alternative: ‘पापी स्वभाव के अनुसार’ और ‘आत्मा के नियंत्रण में’
  rationale: पद विश्वासी की परमेश्वर के आत्मा से निर्धारित स्थिति का वर्णन करता है। व्याख्यात्मक ‘पापी स्वभाव’ मूल शब्द की व्यापकता को अनावश्यक रूप से सीमित कर सकता है।
- issue: अंतिम αὐτοῦ का संदर्भ
  choice: मुख्य पाठ में ‘मसीह का’
  alternative: ‘उसका’, जिसका व्यापक संदर्भ परमेश्वर भी समझा जा सकता है
  rationale: तत्काल निकटतम संबंध ‘मसीह का आत्मा’ है, इसलिए आधुनिक हिन्दी में अस्पष्ट लगने वाले सर्वनाम को मसीह से जोड़ा गया; व्यापक संदर्भगत संभावना पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘तुम’ बहुवचन समुदाय को संबोधित करता है। शैली गरिमापूर्ण किंतु सहज है। ‘वास करता है’ बाइबलीय ध्वनि रखते हुए आज भी समझने योग्य है; पादटिप्पणियाँ मूल की शाब्दिकता और वास्तविक संदर्भगत अस्पष्टता सुरक्षित रखती हैं।
