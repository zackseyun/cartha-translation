  text: ὅσοι γὰρ πνεύματι θεοῦ ἄγονται, οὗτοι ⸂υἱοί εἰσιν θεοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/014.yaml
  text: For all who are led by the Spirit of God[a], these are sons of God.
translation:
  language: hi
  text: क्योंकि जितने लोगों की अगुवाई परमेश्वर की आत्मा के द्वारा की जाती है, वे ही परमेश्वर के पुत्र हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅσοι
  choice: जितने लोग
  rationale: यह बहुवचन संबंधवाचक प्रयोग के सार्वभौमिक वर्ग-बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले विचार से इस कथन का व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: πνεύματι θεοῦ
  choice: परमेश्वर के आत्मा के द्वारा
  rationale: करण कारक का भाव ἄγονται के साथ सुरक्षित रहता है और 'परमेश्वर का आत्मा' वाली पौलुस की शब्दावली बनी रहती है।
- source_word: ἄγονται
  choice: चलाए जाते हैं
  rationale: वर्तमानकालिक कर्मवाच्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; यह केवल सलाह या मार्गदर्शन से अधिक स्रोत के 'ले जाए जाने' के भाव को बचाता है।
- source_word: οὗτοι
  choice: वे ही
  rationale: यूनानी संकेतवाचक शब्द के बल को हिन्दी में स्वाभाविक रूप से प्रकट करता है।
- source_word: υἱοί
  choice: पुत्र
  rationale: यूनानी के स्पष्ट पुल्लिंग बहुवचन तथा रोमी 8 में दत्तकपन और उत्तराधिकार से जुड़ी पुत्रता की छाया को सुरक्षित रखता है।
- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: दोनों स्थानों पर संबंधकारक का सीधा अनुवाद करते हुए मूल की पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: υἱοί θεοῦ का अनुवाद 'परमेश्वर के पुत्र' किया जाए या अधिक समावेशी पद से।
  choice: परमेश्वर के पुत्र
  alternative: परमेश्वर की संतान; परमेश्वर के बेटे-बेटियाँ
  rationale: मूल में υἱοί स्पष्टतः पुल्लिंग बहुवचन है और प्रसंग में दत्तकपन तथा उत्तराधिकार की भाषा से जुड़ा है। मुख्य पाठ में 'पुत्र' मूल की शब्दावली और धर्मवैचारिक तनाव बचाता है; पादटिप्पणी स्पष्ट करती है कि इसमें परमेश्वर से संबंधित सभी विश्वासी सम्मिलित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। 'चलाए जाते हैं' कर्मवाच्य और निरंतर नेतृत्व का भाव रखता है; 'वे ही' οὗτοι के संकेतात्मक बल को व्यक्त करता है।
