  text: διότι τὸ φρόνημα τῆς σαρκὸς ἔχθρα εἰς θεόν, τῷ γὰρ νόμῳ τοῦ θεοῦ οὐχ ὑποτάσσεται, οὐδὲ γὰρ δύναται·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/007.yaml
  text: because the mindset of the flesh is hostility toward God[a], for it does not submit to the law of God[b], for it is not even able.
translation:
  language: hi
  text: क्योंकि शरीर[a] की मनोवृत्ति परमेश्वर के प्रति शत्रुता[b] है, क्योंकि वह परमेश्वर की व्यवस्था के अधीन नहीं होती; क्योंकि वह ऐसा कर भी नहीं सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापमय स्वभाव।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर के विरुद्ध बैर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ यूनानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: φρόνημα
  choice: मनोवृत्ति
  rationale: यह केवल बुद्धि या विचार नहीं, बल्कि मन के स्थायी रुझान और अभिमुखता को व्यक्त करता है।
- source_word: σάρξ
  choice: शरीर
  rationale: पौलुस के रूपकात्मक प्रयोग को व्याख्यात्मक रूप से पूरी तरह खोल देने के बजाय मूल बिंब सुरक्षित रखा गया है; ‘पापमय स्वभाव’ को पादटिप्पणी में दिया गया है।
- source_word: ἔχθρα
  choice: शत्रुता
  rationale: संज्ञा रूप बनाए रखते हुए यह सक्रिय विरोध और बैर का भाव स्पष्ट करता है।
- source_word: εἰς θεόν
  choice: परमेश्वर के प्रति
  rationale: यह शत्रुता की दिशा परमेश्वर की ओर होने को स्वाभाविक हिन्दी में व्यक्त करता है; विरोध का अर्थ ‘शत्रुता’ से स्पष्ट है।
- source_word: ὑποτάσσεται
  choice: अधीन नहीं होती
  rationale: यह परमेश्वर की व्यवस्था के अधीन रहने या उसके प्रति समर्पित होने का भाव व्यक्त करता है और यूनानी के वर्तमान मध्य/कर्मवाच्य रूप की व्यापकता बनाए रखता है।
- source_word: νόμῳ τοῦ θεοῦ
  choice: परमेश्वर की व्यवस्था
  rationale: यह संबंधवाचक यूनानी पदबंध का सीधा और परंपरागत रूप से बोधगम्य अनुवाद है।
- source_word: οὐδὲ γὰρ δύναται
  choice: और वास्तव में वह ऐसा कर भी नहीं सकती
  rationale: ‘कर भी नहीं सकती’ οὐδέ के जोर और δύναται द्वारा व्यक्त वास्तविक असमर्थता—केवल अनिच्छा नहीं—दोनों को सुरक्षित रखता है; ‘ऐसा’ का संकेत व्यवस्था के अधीन होने की ओर है।
theological_decisions:
- issue: σάρξ को ‘शरीर’ कहा जाए या व्याख्यात्मक रूप से ‘पापमय स्वभाव’
  choice: मुख्य पाठ में ‘शरीर’, और ‘पापमय स्वभाव’ पादटिप्पणी में।
  alternative: पापमय स्वभाव
  rationale: संदर्भ में शब्द रूपकात्मक है, फिर भी ‘शरीर’ मूल पौलुसी बिंब और उसकी अर्थगत व्यापकता बचाता है; पादटिप्पणी आधुनिक पाठक को अभिप्रेत नैतिक अर्थ समझने में सहायता देती है।
- issue: अंतिम उपवाक्य को असमर्थता के स्पष्ट कथन के रूप में रखा जाए या केवल अनिच्छा के रूप में
  choice: 'स्पष्ट असमर्थता: ‘वह ऐसा कर भी नहीं सकती।’'
  alternative: वह अधीन होना नहीं चाहती
  rationale: δύναται सामर्थ्य को सीधे व्यक्त करता है। पाठ में कही गई असमर्थता को किसी विस्तृत धर्मवैज्ञानिक व्यवस्था से समझाकर हल किए बिना ज्यों का त्यों रखा गया है।
- issue: ἔχθρα के संज्ञात्मक कथन को विशेषण बनाकर सहज किया जाए या संज्ञा रूप रखा जाए
  choice: ‘शत्रुता है’ के रूप में संज्ञात्मक कथन।
  alternative: परमेश्वर की शत्रु है / परमेश्वर के प्रति शत्रुतापूर्ण है
  rationale: यूनानी में ἔχθρα संज्ञा है; ‘शत्रुता है’ कथन की तीव्रता और पहचानात्मक संरचना को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मनोवृत्ति’ दार्शनिक या अत्यधिक तकनीकी हुए बिना मन के स्थायी रुझान को व्यक्त करती है। अर्धविराम दोनों कारणसूचक खंडों का संबंध स्पष्ट करता है, और अंतिम वाक्यांश स्वाभाविक हिन्दी में यूनानी के जोर को बनाए रखता है।
