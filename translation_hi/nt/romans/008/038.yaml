- source_word: δυνάμεις
  choice: सामर्थ्यशाली शक्तियाँ
  rationale: व्यक्तिगत या आत्मिक सत्ताओं और अवैयक्तिक प्रभावशाली शक्तियों के बीच मूल की अस्पष्टता को यथासंभव सुरक्षित रखता है।
theological_decisions:
- issue: क्या ἀρχαὶ और δυνάμεις को आत्मिक प्राणियों के तकनीकी नामों के रूप में अनूदित किया जाए
