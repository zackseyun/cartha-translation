lexical_decisions:
- source_word: πέπεισμαι
  choice: मुझे पूरा विश्वास है
  rationale: पूर्णकालिक रूप से उत्पन्न और वर्तमान में स्थिर दृढ़ विश्वास व्यक्त होता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
