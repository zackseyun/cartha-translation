  alternative: ‘प्रधानताएँ और शक्तियाँ’ अथवा ‘शासक और अधिकारी’
  rationale: संदर्भ ब्रह्मांडीय या आत्मिक सत्ताओं की ओर संकेत कर सकता है, पर यूनानी शब्द केवल किसी एक व्यवस्थित धर्मवैज्ञानिक श्रेणी तक सीमित नहीं हैं; इसलिए व्यापकता और तनाव बनाए रखा गया है।
