id: ROM.8.15
reference: Romans 8:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ ἐλάβετε πνεῦμα δουλείας πάλιν εἰς φόβον, ἀλλὰ ἐλάβετε πνεῦμα υἱοθεσίας ἐν ᾧ κράζομεν· Αββα ὁ πατήρ·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/015.yaml
  text: For you did not receive a spirit of slavery leading back into fear[a], but you received the Spirit of adoption as sons, by whom we cry[c][b], “Abba! Father!”
translation:
  language: hi
  text: क्योंकि तुम्हें दासता की ऐसी आत्मा नहीं मिली जो फिर से भय की ओर ले जाए, बल्कि तुम्हें पुत्रों के रूप में अपनाए जाने की आत्मा[a] मिली; उसी में[b] हम पुकारते हैं, “अब्बा! हे पिता!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ “आत्मा” से संभवतः पवित्र आत्मा अभिप्रेत है। अनुवाद यह भी हो सकता है: “वह आत्मा जो हमें पुत्रों के रूप में अपनाती है।”'
    reason: theological_ambiguity
  - marker: b
    text: या, “उसी के द्वारा”; यूनानी में अधिक शाब्दिक अर्थ “उसी में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεῦμα δουλείας
  choice: दासता की ऐसी आत्मा
  rationale: “दासता” यूनानी शब्द के बंधुआपन के प्रबल बिंब को बनाए रखता है। “ऐसी” अगले परिणामसूचक वाक्यांश को स्वाभाविक हिन्दी में इससे जोड़ता है।
- source_word: πάλιν εἰς φόβον
  choice: जो फिर से भय की ओर ले जाए
  rationale: यह स्वाभाविक हिन्दी में πάλιν के “फिर से” और εἰς φόβον की भय की दिशा/परिणाम—दोनों को व्यक्त करता है, बिना यह कहे कि विश्वासी वास्तव में पहले ही उस अवस्था में लौट चुके थे।
- source_word: πνεῦμα υἱοθεσίας
  choice: पुत्रों के रूप में अपनाए जाने की आत्मा
  rationale: यह πνεῦμα की दूसरी घटना को पहले वाक्यांश के समानांतर रखता है और υἱοθεσία के कानूनी-पारिवारिक भाव को केवल सामान्य “गोद लिया जाना” या अमूर्त “पुत्रत्व” की अपेक्षा अधिक स्पष्ट करता है।
- source_word: υἱοθεσίας
  choice: पुत्रों के रूप में अपनाया जाना
  rationale: यूनानी पद में निहित पुत्र का दर्जा और उससे जुड़ा उत्तराधिकार-संबंधी भाव सुरक्षित रहता है; यहाँ पुल्लिंग को मिटाकर केवल “संतान” नहीं किया गया है।
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: यह यूनानी के अधिक औपचारिक “जिसमें” को सुरक्षित रखता है और यह प्रश्न खुला छोड़ता है कि आत्मा को व्यक्तिगत रूप से समझते हुए अर्थ “जिसके द्वारा” भी हो सकता है।
- source_word: κράζομεν
  choice: हम पुकारते हैं
  rationale: यह क्रिया की ऊँची, उत्कट और प्रत्यक्ष पुकार को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Αββα ὁ πατήρ
  choice: अब्बा! हे पिता!
  rationale: अरामी संबोधन “अब्बा” को लिप्यंतरित रखा गया है और यूनानी ὁ πατήρ को सम्बोधनात्मक हिन्दी “हे पिता” से व्यक्त किया गया है; विस्मयादिबोधक चिह्न पुकार की तीव्रता दिखाते हैं।
theological_decisions:
- issue: πνεῦμα υἱοθεσίας में πνεῦμα को सामान्य “आत्मा” माना जाए या स्पष्ट रूप से पवित्र आत्मा
  choice: मुख्य पाठ में “पुत्रों के रूप में अपनाए जाने की आत्मा” रखा गया है, बिना “पवित्र” जोड़ने के।
  alternative: “वह आत्मा जो हमें पुत्रों के रूप में अपनाता है” अथवा स्पष्ट रूप से “पवित्र आत्मा”
  rationale: रोमियों 8 का प्रसंग दृढ़ता से पवित्र आत्मा की ओर संकेत करता है, पर यूनानी रचना “दासता की आत्मा” और “अपनाए जाने की आत्मा” के बीच जानबूझकर समानांतरता रखती है। इसलिए मुख्य पाठ इस तनाव को अनावश्यक रूप से समाप्त नहीं करता।
- issue: ἐν ᾧ का स्थानीय/क्षेत्रसूचक अथवा करणसूचक अर्थ
  choice: “उसी में”
  alternative: “उसी के द्वारा”
  rationale: यूनानी का शाब्दिक रूप “जिसमें” है, जबकि पवित्र आत्मा को व्यक्तिगत कर्ता मानने पर “जिसके द्वारा” अर्थसंगत है। मुख्य पाठ औपचारिक रूप को रखता है और पादटिप्पणी करणसूचक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “पुत्रों के रूप में अपनाया जाना” कानूनी पुत्र-दर्जा और उत्तराधिकार के पौलुसी भाव को सुरक्षित करता है। “उसी में” कुछ औपचारिक है, पर मूल की वास्तविक अस्पष्टता बनाए रखने के लिए जानबूझकर चुना गया है।
