  yaml_path: translation/nt/romans/008/025.yaml
  text: But if we hope for what we do not see[b][a], we wait for it with patient endurance.
translation:
  language: hi
  text: पर यदि हम उसकी आशा रखते हैं जिसे हम नहीं देखते, तो हम धीरज के साथ उसकी प्रतीक्षा करते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रतीक्षा करते हैं” का अर्थ “उत्सुकता से बाट जोहते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: यह εἰ की शर्त और δέ के हल्के विरोध अथवा आगे बढ़ते विचार—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὃ οὐ βλέπομεν
  choice: जिसे हम नहीं देखते
  rationale: नपुंसकलिंगी सम्बन्धवाचक पद को सहज हिन्दी में व्यक्त करता है और वर्तमान काल के सीधे अर्थ को बनाए रखता है; ‘देख नहीं सकते’ जैसी अतिरिक्त असमर्थता नहीं जोड़ता।
- source_word: ἐλπίζομεν
  choice: हम उसकी आशा रखते हैं
  rationale: वर्तमानकालीन, निरन्तर आशा को स्वाभाविक हिन्दी में व्यक्त करता है और उसके अनदेखे विषय को पिछले सम्बन्धवाचक उपवाक्य से स्पष्ट रूप से जोड़ता है।
- source_word: δι’ ὑπομονῆς
  choice: धीरज के साथ
  rationale: ὑπομονή में विलम्ब या कठिनाई के बीच धैर्यपूर्वक टिके रहने का भाव है। ‘धीरज’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है।
- source_word: ἀπεκδεχόμεθα
  choice: हम ... प्रतीक्षा करते हैं
  rationale: यह अपेक्षापूर्ण प्रतीक्षा को स्वाभाविक हिन्दी में व्यक्त करता है। क्रिया में उत्सुकतापूर्वक बाट जोहने का भाव भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अदृश्य भावी प्रतिफल के सम्बन्ध में मसीही आशा
  choice: आशा और प्रतीक्षा के विषय को केवल ‘जिसे हम नहीं देखते’ के रूप में रखा गया है।
  alternative: सन्दर्भ के आधार पर इसे उद्धार, देह का छुटकारा, या पुनरुत्थान कहकर स्पष्ट करना।
  rationale: निकटवर्ती सन्दर्भ इन धारणाओं की ओर संकेत करता है, पर इस वाक्य में पौलुस विषय को सामान्य सम्बन्धवाचक पद में ही रखता है। अनुवाद उसी संयम और सम्भावित व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘धीरज’ निष्क्रिय प्रतीक्षा मात्र के बजाय कठिनाई या विलम्ब में स्थिर बने रहने का भाव देता है।
