id: ROM.8.11
reference: Romans 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ τὸ πνεῦμα τοῦ ἐγείραντος ⸀τὸν Ἰησοῦν ἐκ νεκρῶν οἰκεῖ ἐν ὑμῖν, ὁ ἐγείρας ⸂ἐκ νεκρῶν Χριστὸν Ἰησοῦν⸃ ζῳοποιήσει καὶ τὰ θνητὰ σώματα ὑμῶν διὰ ⸂τὸ ἐνοικοῦν αὐτοῦ πνεῦμα⸃ ἐν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/011.yaml
  text: And if the Spirit of the one who raised Jesus from the dead dwells in you[b][a], the one who raised Messiah Jesus from the dead will also give life to your mortal bodies through his Spirit dwelling in you.
translation:
  language: hi
  text: और यदि जिसने यीशु को मरे हुओं में से जिलाया, उसकी आत्मा तुम में वास करती है, तो जिसने मसीह यीशु[b] को मरे हुओं में से जिलाया, वह अपनी उस आत्मा के कारण, जो तुम में वास करती है,[a] तुम्हारे नश्वर शरीरों को भी जीवन देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी उस आत्मा के द्वारा, जो तुम में वास करती है।”
    reason: वैकल्पिक पाठ/व्याकरणिक अर्थ में अंतिम पदबंध को कारण के बजाय साधन के रूप में समझा जा सकता है।
  - marker: b
    text: “मसीह” का अर्थ है “अभिषिक्त जन”; यहाँ यह यीशु की उपाधि है।
    reason: यूनानी Χριστός के उपाधिसूचक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: πνεῦμα
  choice: आत्मा
  rationale: दोनों स्थानों पर संदर्भ परमेश्वर के पवित्र आत्मा का है; इसलिए हिंदी में आदरसूचक और व्यक्तिगत अर्थ बनाए रखने के लिए “आत्मा” चुना गया।
- source_word: ἐγείραντος / ἐγείρας
  choice: जिलाया
  rationale: पुनरुत्थान के संदर्भ में “मरे हुओं में से जिलाया” स्वाभाविक आधुनिक हिंदी है और शारीरिक पुनरुत्थान का भाव स्पष्ट रखता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह वाक्यांश मृतकों के बीच से उठाए जाने का मूल अर्थ बनाए रखता है और हिंदी में सहज है।
- source_word: οἰκεῖ / ἐνοικοῦν
  choice: वास करता है
  rationale: दोनों संबंधित क्रियाओं के लिए एक ही अभिव्यक्ति रखने से आत्मा के भीतर निवास करने की धारणा और शाब्दिक संगति बनी रहती है।
- source_word: Χριστὸν Ἰησοῦν
  choice: मसीह यीशु
  rationale: “मसीह” को केवल नाम का भाग न मानकर उपाधि के रूप में सुरक्षित रखा गया है।
- source_word: ζῳοποιήσει
  choice: जीवन देगा
  rationale: यह भविष्यकालीन जीवनदायी कार्य को स्पष्ट और गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: θνητὰ σώματα
  choice: नश्वर शरीरों
  rationale: यह शरीर की वास्तविकता और उसकी मृत्युशील दशा, दोनों को सीधे बनाए रखता है।
- source_word: διὰ τὸ ἐνοικοῦν αὐτοῦ πνεῦμα
  choice: अपने उस आत्मा के कारण, जो तुममें वास करता है
  rationale: प्रस्तुत SBLGNT पाठ में διά के साथ कर्मकारक पदबंध होने के कारण मुख्य पाठ में कारणसूचक अर्थ लिया गया है।
theological_decisions:
- issue: अंतिम पदबंध में διά के कारणसूचक या साधनसूचक अर्थ का चुनाव
  choice: अपने उस आत्मा के कारण, जो तुममें वास करता है
  alternative: अपने उस आत्मा के द्वारा, जो तुममें वास करता है
  rationale: मुख्य पाठ प्रस्तुत यूनानी पाठ के कर्मकारक रूप का सीधा कारणसूचक अर्थ रखता है; परिचित साधनसूचक अर्थ को पादटिप्पणी में दिया गया है, जिससे वास्तविक पाठगत और व्याकरणिक तनाव बना रहे।
- issue: Χριστός को नाम या उपाधि के रूप में व्यक्त करना
  choice: मसीह यीशु
  alternative: ख्रीस्त यीशु
  rationale: यहाँ Χριστός का उपाधिसूचक बल बनाए रखने के लिए प्रचलित और अर्थपूर्ण हिंदी शब्द “मसीह” रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “वास करता है” धार्मिक संदर्भ में परिचित है और οἰκεῖ तथा ἐνοικοῦν की पारस्परिक संगति बनाए रखता है। वाक्य की लंबी पौलुसी संरचना को सुरक्षित रखते हुए अल्पविरामों से पठनीयता बढ़ाई गई है।
