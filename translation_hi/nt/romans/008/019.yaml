- source_word: ἀποκάλυψιν
  choice: प्रकट होने
  rationale: यह अभी छिपी हुई वास्तविकता के भविष्य में उजागर होने को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: υἱῶν
