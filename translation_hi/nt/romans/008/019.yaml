  text: For the creation waits with eager expectation for the revealing of the sons of God[a].
translation:
  language: hi
  text: क्योंकि सृष्टि बड़ी उत्सुकता से परमेश्वर के पुत्रों[a] के प्रकट होने की प्रतीक्षा कर रही है।
