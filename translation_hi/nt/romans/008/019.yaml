  choice: परमेश्वर के पुत्रों
  alternative: परमेश्वर की संतान
  rationale: “पुत्रों” मूल यूनानी के व्याकरणिक रूप को सुरक्षित रखता है और पौलुस के संदर्भ में पुत्रत्व के दर्जे तथा उत्तराधिकार की अनुगूँज भी बनाए रख सकता है; पादटिप्पणी समावेशी अर्थ की संभावना स्पष्ट करती है।
