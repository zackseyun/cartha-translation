- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: संबंधसूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπεκδέχεται
  choice: प्रतीक्षा कर रही है
  rationale: क्रिया भविष्य की ओर आशापूर्वक प्रतीक्षा का भाव देती है; उसकी तीव्रता पहले ही “बड़ी उत्सुकता से” में व्यक्त है।
