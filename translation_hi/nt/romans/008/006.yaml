- source_word: πνεῦμα
  choice: आत्मा
  rationale: रोमियों 8 के निकट प्रसंग में यह परमेश्वर के पवित्र आत्मा की ओर संकेत करता है; हिन्दी में अर्थ प्रसंग से स्पष्ट होता है, जबकि वैकल्पिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: ζωή
  choice: जीवन
  rationale: मृत्यु के साथ मूल के सीधे प्रतिविरोध को बनाए रखता है।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: यह सामान्य और धर्मवैचारिक दोनों अर्थ-व्याप्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
