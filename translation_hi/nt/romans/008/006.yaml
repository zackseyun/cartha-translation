  alternative: मनुष्य की आत्मा अथवा सामान्य अर्थ में आत्मा
  rationale: रोमियों 8 का निकट प्रसंग शरीर के विपरीत जीवन देने वाले दिव्य आत्मा की सक्रियता पर बार-बार बल देता है। फिर भी मूल शब्द की सम्भावित व्यापकता पादटिप्पणी में रखी गई है।
