id: ROM.8.17
reference: Romans 8:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ τέκνα, καὶ κληρονόμοι· κληρονόμοι μὲν θεοῦ, συγκληρονόμοι δὲ Χριστοῦ, εἴπερ συμπάσχομεν ἵνα καὶ συνδοξασθῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/017.yaml
  text: and if children[a], then heirs also—heirs of God and fellow heirs with Messiah, if indeed we suffer with him so that we may also be glorified with him.
translation:
  language: hi
  text: और यदि हम सन्तान हैं, तो वारिस भी हैं—परमेश्वर के वारिस और मसीह के साथ सह-वारिस—यदि सचमुच हम उसके साथ दुःख उठाते हैं, ताकि उसके साथ महिमान्वित भी किए जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα
  choice: सन्तान
  rationale: नपुंसकलिंग बहुवचन स्त्री-पुरुष दोनों को समेटते हुए पारिवारिक सम्बन्ध और उत्तराधिकार की स्थिति बताता है; ‘सन्तान’ आधुनिक हिन्दी में स्वाभाविक और समावेशी है।
- source_word: κληρονόμοι
  choice: वारिस
  rationale: यह उत्तराधिकार पाने वाले व्यक्ति के लिए प्रचलित कानूनी-पारिवारिक शब्द है और हिन्दी में स्पष्ट है।
- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक को सीधे रखा गया है; इससे वारिसों का परमेश्वर से सम्बन्ध बना रहता है, बिना उत्तराधिकार की वस्तु को अनावश्यक रूप से निश्चित किए।
- source_word: συγκληρονόμοι
  choice: सह-वारिस
  rationale: συν- से व्यक्त साझा उत्तराधिकार को संक्षिप्त और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ अभिषिक्त राजकीय व्यक्ति की उपाधि सक्रिय है; हिन्दी बाइबलीय प्रयोग में ‘मसीह’ स्वाभाविक और अर्थपूर्ण है।
- source_word: εἴπερ
  choice: यदि सचमुच
  rationale: यह वास्तविक शर्त के साथ कथन की अपेक्षात्मक या पुष्टिकारक शक्ति भी बनाए रखता है; इसे ‘क्योंकि’ कहकर शर्त समाप्त नहीं की गई।
- source_word: συμπάσχομεν
  choice: हम उसके साथ दुःख उठाते हैं
  rationale: συν- से व्यक्त मसीह के साथ सहभागिता को स्पष्ट किया गया है; ‘दुःख उठाना’ सहज आधुनिक हिन्दी है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνδοξασθῶμεν
  choice: उसके साथ महिमान्वित भी किए जाएँ
  rationale: कर्मवाच्य रूप और συν- से व्यक्त मसीह के साथ साझा महिमा—दोनों को सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या εἴπερ συμπάσχομεν दुःख को महिमा अर्जित करने वाला साधन बताता है या मसीह के साथ सहभागिता की वास्तविक शर्त/रीति?
  choice: ‘यदि सचमुच हम उसके साथ दुःख उठाते हैं’ कहकर वास्तविक शर्त और मसीह के साथ सहभागिता दोनों को बनाए रखा गया है।
  alternative: ‘क्योंकि हम उसके साथ दुःख उठाते हैं’ कहकर शर्त को कमजोर करना, या ऐसा अनुवाद करना मानो दुःख से महिमा कमाई जाती हो।
  rationale: यूनानी में सशर्त बल वास्तविक है, पर पद स्वयं दुःख को योग्यता अथवा कमाई घोषित नहीं करता; इसलिए इस धार्मिक तनाव को अनुवाद में खुला रखा गया है।
- issue: θεοῦ में सम्बन्धकारक का अर्थ
  choice: ‘परमेश्वर के वारिस’
  alternative: ‘परमेश्वर से विरासत पाने वाले’ या ‘परमेश्वर को विरासत में पाने वाले’
  rationale: यूनानी सम्बन्धकारक इन अधिक विशिष्ट व्याख्याओं में से किसी एक को स्पष्ट रूप से निश्चित नहीं करता; सीधा हिन्दी सम्बन्धकारक मूल की सम्भावित व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सह-वारिस’ उत्तराधिकार की साझा स्थिति को सटीकता से व्यक्त करता है, जबकि समानान्तर वाक्य-विन्यास पौलुस के तर्क और मसीह के साथ दुःख तथा महिमा की सहभागिता को उभारता है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान और उसकी टिप्पणी परस्पर असंगत थे तथा यूनानी पाठ में कोई पाठांतर नहीं दिया गया; इसलिए प्रकाशन-पाठ में असमर्थित पाद-टिप्पणी नहीं जोड़ी गई।
