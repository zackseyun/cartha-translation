lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: यह पिछले पद में गिनाए गए संकटों के बावजूद एक प्रबल विरोध दर्शाता है; ‘परन्तु’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἐν τούτοις πᾶσιν
  choice: इन सब बातों में
  rationale: यह यूनानी पूर्वसर्गीय वाक्यांश के निकट है और पिछले पद में बताई गई सभी विपत्तियों से संबंध बनाए रखता है।
- source_word: ὑπερνικῶμεν
  choice: पूरी तरह विजयी होते हैं
  rationale: यह संयुक्त क्रिया νικάω के साथ ὑπέρ- की तीव्रता और निर्णायक विजय का भाव व्यक्त करती है, यद्यपि यूनानी में क्रियात्मक रूप है।
- source_word: διὰ τοῦ ἀγαπήσαντος ἡμᾶς
  choice: उससे, जिसने हमसे प्रेम किया
  rationale: यहाँ διά संबंधकारक के साथ साधन अथवा माध्यम को दर्शाता है; कृदन्त को किसी नाम से स्पष्ट किए बिना व्यक्तिवाचक रूप में रखा गया है।
- source_word: ἀγαπήσαντος
  choice: प्रेम किया
  rationale: साधारण भूतकाल यूनानी अओरिस्ट कृदन्त को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘जिसने हमसे प्रेम किया’ की पहचान
  choice: मुख्य पाठ में पहचान को स्पष्ट नाम दिए बिना रखा गया है।
  alternative: तात्कालिक संदर्भ में इसे मसीह के रूप में समझना।
  rationale: रोमियों 8:35 का निकट संदर्भ प्रबल रूप से मसीह की ओर संकेत करता है, पर इस पद के यूनानी पाठ में नाम स्पष्ट नहीं है; इसलिए अनुवाद मूल की अभिव्यक्ति और उसकी सीमित अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘पूरी तरह विजयी होते हैं’ तीव्र विजय का अर्थ देता है; वैकल्पिक अधिक शाब्दिक/परंपरागत अभिव्यक्ति पादटिप्पणी में दी गई है।
