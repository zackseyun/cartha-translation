reference: Romans 8:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι καὶ αὐτὴ ἡ κτίσις ἐλευθερωθήσεται ἀπὸ τῆς δουλείας τῆς φθορᾶς εἰς τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/021.yaml
  text: because creation itself also will be set free from slavery to decay into the freedom of the glory of the children of God[a].
translation:
  language: hi
  text: क्योंकि सृष्टि स्वयं भी विनाशशीलता की दासता से मुक्त होकर परमेश्वर की संतानों की महिमा की स्वतंत्रता में प्रवेश करेगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι पिछले कथन में व्यक्त आशा का कारण स्पष्ट करता है।
- source_word: καὶ αὐτὴ ἡ κτίσις
  choice: सृष्टि स्वयं भी
  rationale: ‘भी’ सृष्टि की सहभागिता और ‘स्वयं’ αὐτὴ के बलाघात को बनाए रखता है। κτίσις यहाँ समस्त सृष्टि को सूचित करता है।
- source_word: ἐλευθερωθήσεται
  choice: मुक्त होकर ... प्रवेश करेगी
  rationale: भविष्यकालीन कर्मवाच्य का आशय आने वाली मुक्ति है; हिन्दी में ‘मुक्त होकर ... प्रवेश करेगी’ स्रोत के ἀπό से εἰς तक के संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπὸ τῆς δουλείας τῆς φθορᾶς
  choice: विनाशशीलता की दासता से
  rationale: δουλεία के प्रबल दासता-रूपक को बनाए रखते हुए φθορά को सृष्टि के क्षय, नश्वरता और नष्ट होने की अधीनता के व्यापक अर्थ में ‘विनाशशीलता’ कहा गया है।
- source_word: εἰς τὴν ἐλευθερίαν
  choice: स्वतंत्रता में प्रवेश करेगी
  rationale: εἰς एक नई अवस्था में गमन दर्शाता है; ‘प्रवेश करेगी’ हिन्दी में इस दिशा और संक्रमण को स्पष्ट करता है।
- source_word: τῆς δόξης τῶν τέκνων τοῦ θεοῦ
  choice: परमेश्वर की संतानों की महिमा की
  rationale: यूनानी संबंधकारक-श्रृंखला को जानबूझकर निकट रूप में रखा गया है, ताकि ‘महिमामय स्वतंत्रता’ कहकर उसके संबंध को समय से पहले निश्चित न किया जाए। τέκνα के लिए समावेशी और स्वाभाविक ‘संतानें’ चुना गया है।
theological_decisions:
- issue: τὴν ἐλευθερίαν τῆς δόξης τῶν τέκνων τοῦ θεοῦ संबंधकारक-श्रृंखला का अर्थ
  choice: परमेश्वर की संतानों की महिमा की स्वतंत्रता
  alternative: परमेश्वर की संतानों की महिमामय स्वतंत्रता
  rationale: मुख्य पाठ में स्रोत की संरचना और वास्तविक अर्थगत तनाव सुरक्षित रखा गया है। विशेषणात्मक विकल्प अधिक सहज है, पर वह ‘महिमा’ और ‘स्वतंत्रता’ के संबंध को कुछ अधिक व्याख्यायित कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। ‘विनाशशीलता’ कुछ औपचारिक है, पर φθορά के केवल प्रक्रिया-सूचक ‘क्षय’ से अधिक व्यापक अर्थ को सँभालता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि निकटतर संबंधकारक संरचना मुख्य पाठ में ही सुरक्षित है।
