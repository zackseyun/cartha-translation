id: ROM.8.10
reference: Romans 8:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ Χριστὸς ἐν ὑμῖν, τὸ μὲν σῶμα νεκρὸν διὰ ἁμαρτίαν, τὸ δὲ πνεῦμα ζωὴ διὰ δικαιοσύνην.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/010.yaml
  text: But if the Messiah is in you[a], the body is dead because of sin[c][b], but the spirit is life because of righteousness.
translation:
  language: hi
  text: पर यदि मसीह तुम में हैं, तो शरीर पाप के कारण मरा हुआ है,[a] पर आत्मा[b] धार्मिकता[c] के कारण जीवन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शरीर मृत्यु के अधीन है” अथवा “शरीर नश्वर है।”
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र आत्मा जीवन है।” यूनानी शब्द का अर्थ परमेश्वर द्वारा जीवित की गई मनुष्य की आत्मा या पवित्र आत्मा—दोनों में से कोई हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “न्याय के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: यह यूनानी उपाधि का स्वाभाविक और स्थापित हिन्दी रूप है तथा यहाँ उसके उपाधिगत अर्थ को बनाए रखता है।
- source_word: σῶμα
  choice: शरीर
  rationale: यह σῶμα का सीधा अर्थ है और πνεῦμα के साथ ठोस विरोध को सुरक्षित रखता है; इसे 'देह/शारीरिक स्वभाव' के अर्थ में नहीं बदलता।
- source_word: νεκρὸν
  choice: मरा हुआ
  rationale: यह विशेषण के तीखे, सीधे अर्थ को बनाए रखता है; यहाँ नश्वरता या मृत्यु के अधीन होने की सम्भावित व्याख्या पादटिप्पणी में दी गई है।
- source_word: διὰ ἁμαρτίαν
  choice: पाप के कारण
  rationale: διά के साथ कर्मकारक की कारणसूचक शक्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: देवनागरी में बड़े-छोटे अक्षरों से भेद सम्भव नहीं है; इसलिए मुख्य पाठ संदर्भगत अस्पष्टता बनाए रखता है और पादटिप्पणी मनुष्य की आत्मा तथा पवित्र आत्मा—दोनों सम्भावनाएँ स्पष्ट करती है।
- source_word: ζωὴ
  choice: जीवन है
  rationale: संज्ञा ζωή को विशेषण 'जीवित' या क्रिया 'जीवन देता है' में बदलने के बजाय पौलुस की संक्षिप्त संज्ञात्मक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: διὰ δικαιοσύνην
  choice: धार्मिकता के कारण
  rationale: कारणसूचक διά को बनाए रखते हुए δικαιοσύνη का प्रचलित पौलुसी हिन्दी रूप देता है; 'न्याय' को वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: πνεῦμα का अभिप्राय
  choice: मुख्य पाठ में 'आत्मा', जिसका अभिप्राय खुला रखा गया है
  alternative: पवित्र आत्मा; अथवा परमेश्वर द्वारा जीवन पाई हुई मनुष्य की आत्मा
  rationale: शरीर और आत्मा का विरोध मनुष्य की आत्मा की ओर संकेत कर सकता है, जबकि निकट संदर्भ पवित्र आत्मा की ओर भी संकेत करता है। हिन्दी लिपि में capitalization का भेद न होने से पादटिप्पणी दोनों सम्भावनाएँ सुरक्षित रखती है।
- issue: σῶμα νεκρὸν की शक्ति
  choice: शरीर मरा हुआ है
  alternative: शरीर मृत्यु के अधीन है; शरीर नश्वर है
  rationale: मूल विशेषण का सीधा अर्थ 'मरा हुआ' है। यद्यपि प्रसंग में शरीर की नश्वरता अभिप्रेत हो सकती है, मुख्य पाठ उस व्याख्या को चुपचाप मूल पर आरोपित नहीं करता।
- issue: δικαιοσύνη का अर्थक्षेत्र
  choice: धार्मिकता
  alternative: न्याय
  rationale: पौलुसी प्रयोग में 'धार्मिकता' अधिक उपयुक्त और स्थापित है, पर शब्द के न्याय-संबंधी अर्थक्षेत्र को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। 'मरा हुआ' और 'जीवन है' की कुछ असामान्य तीक्ष्णता जानबूझकर रखी गई है ताकि यूनानी पाठ की संक्षिप्त समानांतर संरचना और धर्मवैचारिक तनाव सुरक्षित रहें।
