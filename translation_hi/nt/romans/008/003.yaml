id: ROM.8.3
reference: Romans 8:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸ γὰρ ἀδύνατον τοῦ νόμου, ἐν ᾧ ἠσθένει διὰ τῆς σαρκός, ὁ θεὸς τὸν ἑαυτοῦ υἱὸν πέμψας ἐν ὁμοιώματι σαρκὸς ἁμαρτίας καὶ περὶ ἁμαρτίας κατέκρινε τὴν ἁμαρτίαν ἐν τῇ σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/003.yaml
  text: For what the law could not do[a], in that it was weak through the flesh, God did by sending his own Son in the likeness of sinful flesh and for sin; he condemned sin in the flesh[d][c][b],
translation:
  language: hi
  text: 'क्योंकि जो काम व्यवस्था नहीं कर सकी[a]—क्योंकि वह शरीर[b] के कारण दुर्बल थी—उसे परमेश्वर ने अपने ही पुत्र को पापमय शरीर की समानता में[d] और पाप के लिए[c] भेजकर किया: उसने शरीर में पाप को दोषी ठहराया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “व्यवस्था की असमर्थता।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “शरीर” से संभवतः मनुष्य अपनी पतित दुर्बलता में अभिप्रेत है। कुछ अनुवाद कुछ संदर्भों में इसका अधिक व्याख्यात्मक अनुवाद “पापी स्वभाव” करते हैं।
    reason: lexical_alternative
  - marker: c
    text: “पाप के लिए” का यूनानी वाक्यांश बलिदानी अर्थ में “पापबलि के रूप में” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: d
    text: “पापमय शरीर की समानता में” पुत्र की वास्तविक मानवता को स्वीकार करता है, पर उसे स्वयं पापी नहीं ठहराता।
    reason: cultural_note
lexical_decisions:
- source_word: τὸ ἀδύνατον τοῦ νόμου
  choice: व्यवस्था जो नहीं कर सकी
  rationale: यूनानी का नपुंसकलिंग पद व्यवस्था की असमर्थता को व्यक्त करता है। यह हिंदी में स्वाभाविक है और अर्थ को क्रियात्मक रूप में स्पष्ट करता है।
- source_word: νόμος
  choice: व्यवस्था
  rationale: पौलुस के संदर्भ में यह परमेश्वर की दी हुई व्यवस्था, विशेषतः मूसा की व्यवस्था, की ओर संकेत करता है। हिंदी बाइबलीय प्रयोग में ‘व्यवस्था’ स्वाभाविक और परिचित है।
- source_word: ἐν ᾧ ἠσθένει διὰ τῆς σαρκός
  choice: इस कारण कि वह शरीर के कारण शक्तिहीन थी
  rationale: उपवाक्य बताता है कि व्यवस्था किस कारण अपना काम पूरा नहीं कर सकी। ‘शरीर’ को बनाए रखने से σάρξ की अर्थगत परतें सुरक्षित रहती हैं।
- source_word: πέμψας
  choice: भेजकर
  rationale: अओरिस्ट कृदंत यहाँ उस साधन को बताता है जिसके द्वारा परमेश्वर ने कार्य किया; हिंदी का ‘भेजकर’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν ἑαυτοῦ υἱόν
  choice: अपने ही पुत्र को
  rationale: ‘ही’ ἑαυτοῦ के विशेष बल को सुरक्षित रखता है।
- source_word: ἐν ὁμοιώματι σαρκὸς ἁμαρτίας
  choice: पापमय शरीर की समानता में
  rationale: यह शब्दावली वास्तविक मानवीय देह और ‘समानता’ की सावधान योग्यता—दोनों को बनाए रखती है, बिना पुत्र को स्वयं पापी कहे।
- source_word: περὶ ἁμαρτίας
  choice: पाप के लिए
  rationale: यह अपेक्षाकृत खुला और औपचारिक अनुवाद है। वाक्यांश के संभावित बलिदानी अर्थ ‘पापबलि के रूप में’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κατέκρινε τὴν ἁμαρτίαν
  choice: पाप को दोषी ठहराया
  rationale: यह क्रिया के न्यायिक भाव को स्पष्ट रखता है और ‘पाप’ को वाक्य का कर्म बनाए रखता है।
- source_word: ἐν τῇ σαρκί
  choice: शरीर में
  rationale: यूनानी में कोई स्पष्ट संबंधवाचक सर्वनाम नहीं है। इसलिए ‘उसके शरीर में’ कहकर आशय को आवश्यकता से अधिक निश्चित नहीं किया गया।
theological_decisions:
- issue: इस पद में σάρξ का अर्थ
  choice: दोनों स्थानों पर ‘शरीर’
  alternative: ‘पापी स्वभाव’ या ‘मनुष्य का पापी स्वभाव’
  rationale: ‘शरीर’ पौलुस की बहुस्तरीय शब्दावली तथा देहधारण और पतित मानवीय दुर्बलता के बीच के तनाव को सुरक्षित रखता है; ‘पापी स्वभाव’ यहाँ अत्यधिक व्याख्यात्मक होगा।
- issue: περὶ ἁμαρτίας का अर्थ
  choice: मुख्य पाठ में ‘पाप के लिए’
  alternative: ‘पापबलि के रूप में’ अथवा ‘पाप के विषय में’
  rationale: यूनानी वाक्यांश पुराने यूनानी धर्मग्रंथ में बलिदानी अर्थ ले सकता है, पर सामान्य अर्थ भी संभव है। मुख्य पाठ में व्यापक अर्थ और पादटिप्पणी में बलिदानी संभावना रखने से वास्तविक अस्पष्टता बनी रहती है।
- issue: ‘पापमय शरीर की समानता में’ का मसीह-संबंधी बल
  choice: ‘समानता’ और ‘पापमय शरीर’ दोनों को बनाए रखा
  alternative: ऐसा विस्तार जो या तो वास्तविक मानवता को कमजोर करे या पुत्र को पापी बताए
  rationale: यूनानी वाक्यांश पुत्र की वास्तविक मानवता बताते हुए उसे पाप से एकरूप नहीं करता। अनुवाद इस सावधान तनाव को बिना सैद्धांतिक विस्तार के बनाए रखता है।
- issue: ἐν τῇ σαρκί में निहित संदर्भ
  choice: ‘शरीर में’
  alternative: ‘उसके शरीर में’
  rationale: संदर्भ पुत्र के देहधारण की ओर प्रबल संकेत करता है, फिर भी यूनानी में ‘उसके’ नहीं है। इसलिए मुख्य पाठ मूल की संक्षिप्तता और संभावित अर्थ-क्षेत्र को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। लंबे यूनानी वाक्य की तर्कगत संरचना को डैश और द्विबिंदु से स्पष्ट किया गया है। ‘व्यवस्था’, ‘शरीर’ और ‘दोषी ठहराया’ जैसे स्थापित बाइबलीय शब्द रखते हुए अत्यधिक सांप्रदायिक या व्याख्यात्मक भाषा से बचा गया है।
