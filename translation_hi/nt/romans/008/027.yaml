  text: ὁ δὲ ἐραυνῶν τὰς καρδίας οἶδεν τί τὸ φρόνημα τοῦ πνεύματος, ὅτι κατὰ θεὸν ἐντυγχάνει ὑπὲρ ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/027.yaml
  text: And he who searches hearts knows what the mindset of the Spirit is, because he intercedes for the saints according to God.
translation:
  language: hi
  text: और जो हृदयों को परखता है, वह जानता है कि आत्मा की मनोवृत्ति क्या है, क्योंकि आत्मा पवित्र जनों के लिए परमेश्वर के अनुसार[a] विनती करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की इच्छा के अनुसार।”
    reason: κατὰ θεὸν का संदर्भानुकूल वैकल्पिक अनुवाद; ‘इच्छा’ शब्द यूनानी मूल पाठ में स्पष्ट रूप से नहीं है।
lexical_decisions:
- source_word: ἐραυνῶν
  choice: परखनेवाला
  rationale: यह वर्तमान कृदंत के सक्रिय और गहराई से जाँचने वाले भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καρδίας
  choice: हृदयों
  rationale: यह मूल बाइबलीय रूपक को बनाए रखता है और मनुष्य के भीतरी जीवन की ओर संकेत करता है।
- source_word: τί τὸ φρόνημα
  choice: अभिप्राय क्या है
  rationale: ‘अभिप्राय’ यहाँ केवल बौद्धिक विचार नहीं, बल्कि आत्मा की प्रवृत्ति और मंशा का भाव देता है; साथ ही वाक्य आधुनिक हिन्दी में सहज रहता है।
- source_word: τοῦ πνεύματος
  choice: आत्मा का
  rationale: रोमियों 8 के निकटवर्ती संदर्भ में यह पवित्र आत्मा को सूचित करता है।
- source_word: ἐντυγχάνει
  choice: विनती करता है
  rationale: संदर्भ में यह किसी के पक्ष में प्रार्थनापूर्वक निवेदन करने का अर्थ देता है और पिछले पद से संबंध बनाए रखता है।
- source_word: ὑπὲρ ἁγίων
  choice: पवित्र जनों के लिए
  rationale: यह ὑπέρ के प्रतिनिधिक भाव और पौलुस के ἅγιοι के सामान्य प्रयोग को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ θεὸν
  choice: परमेश्वर के अनुसार
  rationale: यह यूनानी की संक्षिप्त अभिव्यक्ति को सुरक्षित रखता है और मुख्य पाठ में ‘इच्छा’ शब्द जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: κατὰ θεὸν में परमेश्वर की इच्छा को स्पष्ट रूप से जोड़ना या न जोड़ना
  choice: मुख्य पाठ में ‘परमेश्वर के अनुसार’ रखा गया।
  alternative: ‘परमेश्वर की इच्छा के अनुसार’
  rationale: संदर्भ में परमेश्वर की इच्छा के अनुरूप होना संभावित आशय है, पर यूनानी पाठ में ‘इच्छा’ शब्द नहीं है। मुख्य पाठ मूल की संक्षिप्तता और धर्मवैचारिक तनाव बनाए रखता है; स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण रूप अपनाया गया है। ‘हृदय’ और ‘पवित्र जन’ जैसे परिचित बाइबलीय पद बनाए गए हैं; कठिन शाब्दिकता से बचते हुए κατὰ θεὸν की वास्तविक संक्षिप्तता पादटिप्पणी सहित सुरक्षित रखी गई है।
