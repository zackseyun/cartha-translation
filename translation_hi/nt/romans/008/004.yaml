  to: ताकि व्यवस्था की धर्मसंगत अपेक्षा हममें पूरी हो[a], जो शरीर के अनुसार नहीं, बल्कि आत्मा के अनुसार चलते हैं।[b][c]
  rationale: The revision replaces a potentially misleading rendering of δικαίωμα with ‘धर्मसंगत अपेक्षा,’ removes the awkward repeated ‘हममें,’ and adjusts footnote a to match the revised wording. It retains the passive, purposive, and ethically contrastive force of the Greek, while preserving the contextual ambiguity of πνεῦμα in the footnote.
