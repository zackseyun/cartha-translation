id: ROM.8.4
reference: Romans 8:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα τὸ δικαίωμα τοῦ νόμου πληρωθῇ ἐν ἡμῖν τοῖς μὴ κατὰ σάρκα περιπατοῦσιν ἀλλὰ κατὰ πνεῦμα·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/004.yaml
  text: so that the righteous requirement of the law might be fulfilled in us[c][b][a], who do not walk according to the flesh but according to the Spirit.
translation:
  language: hi
  text: ताकि व्यवस्था की धर्मसंगत अपेक्षा हममें पूरी हो[a], जो शरीर के अनुसार नहीं, बल्कि आत्मा के अनुसार चलते हैं।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था की अपेक्षा हममें पूरी हो।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “शरीर” केवल देह नहीं, बल्कि पाप से प्रभावित और परमेश्वर से विमुख मानवीय जीवन-दृष्टि को सूचित करता है; कुछ अनुवादों में “पापी स्वभाव” है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “आत्मा” से संदर्भतः संभवतः पवित्र आत्मा अभिप्रेत है; यूनानी शब्द का अर्थ मानवीय आत्मा भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य या अभिप्रेत परिणाम व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τὸ δικαίωμα τοῦ νόμου
  choice: व्यवस्था की धार्मिक माँग
  rationale: δικαίωμα यहाँ व्यवस्था की न्यायोचित अथवा धर्मसंगत अपेक्षा को व्यक्त करता है; यह अनुवाद उसके वैधानिक और नैतिक दोनों बल को बनाए रखता है।
- source_word: πληρωθῇ
  choice: पूरी हो
  rationale: कर्मवाच्य संभावनार्थक रूप को उद्देश्यवाचक खंड में स्वाभाविक हिन्दी से व्यक्त किया गया है, बिना कर्ता को स्पष्ट करके मूल से अधिक कहे।
- source_word: ἐν ἡμῖν
  choice: हममें
  rationale: ἐν का सीधा अर्थ सुरक्षित रहता है और इसे ‘हमारे द्वारा’ बनाकर मानवीय कर्तृत्व को अनावश्यक रूप से प्रबल नहीं किया जाता।
- source_word: περιπατοῦσιν
  choice: चलते हैं
  rationale: पौलुस के जीवन-आचरण संबंधी रूपक को बनाए रखता है और हिन्दी बाइबलीय भाषा में समझने योग्य है।
- source_word: σάρξ
  choice: शरीर
  rationale: मूल रूपक को सुरक्षित रखा गया है; यहाँ इसका आशय केवल भौतिक देह नहीं, बल्कि परमेश्वर से विमुख मानवीय प्रवृत्ति है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: रोमियों 8 के निकट संदर्भ में पवित्र आत्मा अभिप्रेत होने की प्रबल संभावना है; देवनागरी में अक्षर-भेद न होने के कारण संदर्भगत पहचान पादटिप्पणी में दी गई है।
- source_word: κατὰ σάρκα ... κατὰ πνεῦμα
  choice: शरीर के अनुसार ... आत्मा के अनुसार
  rationale: κατά की समानांतर रचना और पौलुस का नैतिक-विरोध दोनों पारदर्शी रूप से सुरक्षित रहते हैं।
theological_decisions:
- issue: πνεῦμα से मनुष्य की आत्मा अभिप्रेत है या पवित्र आत्मा
  choice: मुख्य पाठ में ‘आत्मा’, संदर्भतः पवित्र आत्मा
  alternative: मनुष्य की आत्मा या सामान्य आत्मिक अभिमुखता
  rationale: रोमियों 8 में पवित्र आत्मा की भूमिका प्रमुख है, फिर भी यूनानी शब्द को अलग से देखने पर व्यापक अर्थ संभव है; इसलिए पादटिप्पणी में अस्पष्टता सुरक्षित रखी गई है।
- issue: ἐν ἡμῖν का अर्थ ‘हममें’ है या ‘हमारे द्वारा’
  choice: हममें
  alternative: हमारे द्वारा; हमारे बीच
  rationale: यह मूल पूर्वसर्ग का निकटतम अनुवाद है और पाठ में स्पष्ट न किए गए मानवीय कर्तृत्व को आरोपित नहीं करता।
- issue: δικαίωμα का अर्थ धार्मिक माँग है या केवल माँग/विधान
  choice: धार्मिक माँग
  alternative: व्यवस्था की माँग; व्यवस्था का विधान
  rationale: शब्द की न्यायोचित और वैधानिक छाया दोनों व्यक्त होती हैं, जबकि संक्षिप्त विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘चलते हैं’ और ‘के अनुसार’ जैसे पौलुसी रूपकों को अर्थ खोलकर बदलने के बजाय सुरक्षित रखा गया है। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
