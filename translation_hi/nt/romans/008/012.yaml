- source_word: τῇ σαρκί / κατὰ σάρκα
  choice: शरीर / शरीर के अनुसार
  rationale: ‘शरीर’ पौलुस के σάρξ-संबंधी शब्द और इसी पद में उसकी पुनरावृत्ति को सुरक्षित रखता है; इसे सीधे ‘पापी स्वभाव’ कह देने से अर्थ की वास्तविक व्यापकता और धर्मवैज्ञानिक तनाव सीमित हो सकता है।
- source_word: τοῦ κατὰ σάρκα ζῆν
  choice: कि शरीर के अनुसार जीवन बिताएँ
  rationale: संबंधसूचक infinitive उस जीवन को बताता है जिसके लिए शरीर के प्रति कोई दायित्व नहीं है। ‘के अनुसार’ पौलुस की बार-बार प्रयुक्त अभिव्यक्ति के मानदंडात्मक भाव को निकटता से रखता है।
theological_decisions:
- issue: पौलुस के विरोध में σάρξ का अनुवाद कितना व्याख्यात्मक हो
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: मुख्य पाठ में पौलुस की शब्दावली और शरीर तथा आत्मा के बीच का धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है। प्रसंग में यह केवल भौतिक देह नहीं है, पर इसे ‘पापी स्वभाव’ कहना संभावित अर्थ को पहले ही पूरी तरह निर्धारित कर देगा।
- issue: ἀδελφοί के सामुदायिक संबोधन में लैंगिक समावेश
  choice: भाइयो और बहनो
  alternative: भाइयो
  rationale: पौलुस पूरी विश्वासी संगति को संबोधित करता है। मुख्य पाठ में समावेशी आशय स्वाभाविक हिन्दी में स्पष्ट है, और यूनानी का व्याकरणिक रूप पादटिप्पणी में सुरक्षित है।
