  text: αὐτὸ τὸ πνεῦμα συμμαρτυρεῖ τῷ πνεύματι ἡμῶν ὅτι ἐσμὲν τέκνα θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/016.yaml
  text: The Spirit himself testifies with our spirit that we are God's children[a][b][c].
translation:
  language: hi
  text: पवित्र आत्मा स्वयं हमारी आत्मा के साथ गवाही देता है कि हम परमेश्वर की संतान हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτὸ τὸ πνεῦμα
  choice: पवित्र आत्मा स्वयं
  rationale: αὐτό पदबंध को बल देता है; हिंदी में ‘स्वयं’ उस बल को स्वाभाविक रूप से बनाए रखता है। संदर्भ में πνεῦμα पवित्र आत्मा है, इसलिए स्पष्टता हेतु ‘पवित्र’ जोड़ा गया है।
- source_word: συμμαρτυρεῖ
  choice: के साथ गवाही देता है
  rationale: συν- उपसर्ग संयुक्त या सहवर्ती गवाही का भाव देता है। ‘के साथ गवाही देता है’ इस अर्थ को ‘गवाही देता है’ मात्र से अधिक ठीक ढंग से व्यक्त करता है।
- source_word: τῷ πνεύματι ἡμῶν
  choice: हमारी आत्मा के साथ
  rationale: 'यहाँ दत्तिव कारक को संगति/सहभागिता के अर्थ में लिया गया है: पवित्र आत्मा हमारी आत्मा के साथ गवाही देता है, केवल हमारी आत्मा को नहीं।'
- source_word: ὅτι ἐσμὲν
  choice: कि हम ... हैं
  rationale: ὅτι कथन की विषय-वस्तु प्रस्तुत करता है; सरल हिंदी संरचना मूल के आशय को सीधे रखती है।
- source_word: τέκνα θεοῦ
  choice: परमेश्वर की संतान
  rationale: τέκνα लिंग-समावेशी ‘children’ है, विशेष रूप से ‘पुत्र’ नहीं। ‘संतान’ आधुनिक, गरिमापूर्ण और समावेशी हिंदी है।
theological_decisions:
- issue: πνεῦμα का व्यक्तिगत कर्तृत्व
  choice: पवित्र आत्मा स्वयं ... गवाही देता है
  alternative: आत्मा स्वयं ... गवाही देती है/वह आत्मा स्वयं
  rationale: यूनानी व्याकरणिक नपुंसकलिंग को हिंदी में यांत्रिक रूप से उतारना उचित नहीं। संदर्भ पवित्र आत्मा के व्यक्तिगत कर्तृत्व को व्यक्त करता है; ‘स्वयं’ मूल के बल को भी सुरक्षित रखता है।
- issue: पवित्र आत्मा और हमारी आत्मा की गवाही का संबंध
  choice: हमारी आत्मा के साथ
  alternative: हमारी आत्मा को
  rationale: συμμαρτυρεῖ का मूल अर्थ साथ मिलकर या साथ-साथ गवाही देना है। ‘को’ चुनने से संयुक्त गवाही का भाव दब सकता है, इसलिए पाठ में ‘के साथ’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। ‘परमेश्वर’ और ‘पवित्र आत्मा’ सामान्य बाइबलीय शब्दावली हैं। ‘संतान’ बहुवचन-संदर्भ में भी स्वाभाविक सामूहिक संज्ञा है और τέκνα की लिंग-समावेशिता बनाए रखती है।
