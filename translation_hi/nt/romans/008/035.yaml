id: ROM.8.35
reference: Romans 8:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τίς ἡμᾶς χωρίσει ἀπὸ τῆς ἀγάπης τοῦ Χριστοῦ; θλῖψις ἢ στενοχωρία ἢ διωγμὸς ἢ λιμὸς ἢ γυμνότης ἢ κίνδυνος ἢ μάχαιρα;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/035.yaml
  text: Who will separate us from the Messiah’s love? Will trouble or distress or persecution or famine or nakedness or danger or sword?[a]
translation:
  language: hi
  text: कौन हमें मसीह के प्रेम से अलग करेगा? क्या क्लेश, या संकट, या सताव, या अकाल, या वस्त्रहीनता, या खतरा, या तलवार?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह के प्रति हमारे प्रेम से।” यूनानी सम्बन्धकारक का यह अर्थ भी हो सकता है, यद्यपि प्रसंग “मसीह के प्रेम” के अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह व्यक्तिवाचक प्रश्नवाचक सर्वनाम है; “कौन” पौलुस के आलंकारिक प्रश्न को सीधे और स्वाभाविक रूप में रखता है।
- source_word: χωρίσει
  choice: अलग करेगा
  rationale: भविष्यकालीन क्रिया संभावित पृथक्करण को व्यक्त करती है; “अलग करेगा” सीधा और सहज हिन्दी रूप है।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: ἀγάπη का सामान्य, स्पष्ट और प्रसंगानुकूल हिन्दी समतुल्य “प्रेम” है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उपाधि है, इसलिए “मसीह” उपयुक्त है; सम्बन्धकारक रचना को हिन्दी में स्वाभाविक ढंग से “मसीह के प्रेम” कहा गया है।
- source_word: θλῖψις
  choice: क्लेश
  rationale: यह दबाव, दुःख और विपत्ति की व्यापक धारणा को समेटता है तथा गंभीर किन्तु समझने योग्य हिन्दी है।
- source_word: στενοχωρία
  choice: संकट
  rationale: यह घिर जाने, तंगी और विकट परिस्थिति के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और “क्लेश” से पर्याप्त भिन्नता बनाए रखता है।
- source_word: διωγμός
  choice: सताव
  rationale: विश्वास या पहचान के कारण किए जाने वाले पीछा और अत्याचार के लिए यह स्पष्ट, प्रचलित और प्रसंगानुकूल शब्द है।
- source_word: λιμός
  choice: अकाल
  rationale: यह केवल व्यक्तिगत भूख नहीं, बल्कि भोजन की गंभीर और व्यापक कमी को व्यक्त करता है।
- source_word: γυμνότης
  choice: वस्त्रहीनता
  rationale: यह वस्त्रों के अभाव की अवस्था को सीधे व्यक्त करता है, पर “नंगापन” की तुलना में अधिक गरिमापूर्ण प्रकाशन-शैली रखता है।
- source_word: κίνδυνος
  choice: खतरा
  rationale: यह समकालीन हिन्दी में सहज और सटीक है; अधिक संस्कृतनिष्ठ विकल्प की अपेक्षा साधारण पाठक के लिए स्पष्ट है।
- source_word: μάχαιρα
  choice: तलवार
  rationale: यह मूल बिंब और प्राणघातक हिंसा की धमकी दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ Χριστοῦ में सम्बन्धकारक का अर्थ
  choice: मसीह का हमारे प्रति प्रेम
  alternative: मसीह के प्रति हमारा प्रेम
  rationale: यूनानी सम्बन्धकारक व्याकरणतः दोनों अर्थ दे सकता है। रोमियों 8:31–39 का निकट प्रसंग मुख्य पाठ में मसीह के प्रेम को कर्तृवाचक अर्थ में लेने का प्रबल समर्थन करता है, पर दूसरा सम्भव अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गंभीर और गरिमापूर्ण शैली अपनाई गई है। अलंकारिक प्रश्न और विपत्तियों की क्रमिक सूची ज्यों की त्यों रखी गई है; सूची में बार-बार “या” देकर मूल की लय और संचयी बल सुरक्षित रखा गया है।
