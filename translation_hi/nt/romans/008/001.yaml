  text: Therefore[b][a], there is now no condemnation for those in Messiah Jesus.
translation:
  language: hi
  text: इसलिए अब उन लोगों के लिए कोई दण्डादेश नहीं है जो मसीहा यीशु में हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ बाद की पाण्डुलिपियाँ यहाँ जोड़ती हैं: “जो शरीर के अनुसार नहीं चलते।” सबसे प्राचीन यूनानी साक्ष्य यहाँ संक्षिप्त पाठ का समर्थन करते हैं।'
    reason: textual_variant
  - marker: b
    text: या “मसीह यीशु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδὲν
  choice: कोई ... नहीं
  rationale: κατάκριμα के साथ यह स्वाभाविक हिन्दी में पूर्ण निषेध व्यक्त करता है और यूनानी के बल को बनाए रखता है।
- source_word: ἄρα
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट करता है।
- source_word: νῦν
  choice: अब
  rationale: पौलुस द्वारा बताई गई वर्तमान वास्तविकता को स्पष्ट रूप से बनाए रखता है।
- source_word: κατάκριμα
  choice: दण्ड की आज्ञा
  rationale: यह न्यायिक दोषनिर्णय और उसके फलस्वरूप दण्डादेश का भाव व्यक्त करता है, केवल मन में दोषी होने की अनुभूति का नहीं।
- source_word: τοῖς ἐν Χριστῷ Ἰησοῦ
  choice: उन लोगों के लिए ... जो मसीहा यीशु में हैं
  rationale: दत्तिव सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करते हुए ἐν की सहभागिता/एकता वाली समृद्ध भाषा को बनाए रखता है।
- source_word: Χριστῷ
  choice: मसीहा
  rationale: Χριστός को केवल नाम न बनाकर उसके अभिषिक्त राजा के पदनाम का अर्थ बनाए रखा गया है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: यूनानी व्यक्तिगत नाम Ἰησοῦς का प्रचलित हिन्दी रूप।
theological_decisions:
- issue: “मसीहा यीशु में” का अर्थ
  choice: मसीहा यीशु से सम्बन्धित और उनमें सहभागी लोगों की पहचान बताने वाली एकता की अभिव्यक्ति
  alternative: “मसीहा यीशु के कारण” जैसा अधिक ढीला कारणसूचक अर्थ
  rationale: पौलुस के प्रयोग में ἐν को “में” बनाए रखने से सहभागिता और एकता की धर्मवैचारिक गहराई सुरक्षित रहती है; इसे किसी एक व्याख्यात्मक भाव में सीमित नहीं किया गया।
- issue: κατάκριμα का न्यायिक आशय
  choice: न्यायिक दोषनिर्णय से जुड़ा दण्डादेश
  alternative: केवल दोषभावना या सामान्य निन्दा
  rationale: सन्दर्भ में शब्द का न्यायालय-सदृश, प्रतिकूल निर्णय वाला आशय है; अनुवाद उस अर्थ को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। “दण्ड की आज्ञा” न्यायिक भाव को स्पष्ट करती है; “मसीहा यीशु में” पौलुस की मूल सहभागिता/एकता की भाषा और उसकी धर्मवैचारिक व्यापकता को सुरक्षित रखता है।
