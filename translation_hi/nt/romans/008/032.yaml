source:
  edition: SBLGNT
  text: ὅς γε τοῦ ἰδίου υἱοῦ οὐκ ἐφείσατο, ἀλλὰ ὑπὲρ ἡμῶν πάντων παρέδωκεν αὐτόν, πῶς οὐχὶ καὶ σὺν αὐτῷ τὰ πάντα ἡμῖν χαρίσεται;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/032.yaml
  text: He indeed did not spare his own Son[c][b][a], but gave him over for us all—how will he not also with him graciously give us all things?
translation:
  language: hi
  text: जिसने अपने ही पुत्र को भी नहीं बचाया, बल्कि हम सबके लिए[a] उसे सौंप दिया[b], वह उसके साथ हमें सब कुछ अनुग्रहपूर्वक क्यों न देगा[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम सबकी ओर से।”
    reason: alternative_reading
  - marker: b
    text: या, “उसे हवाले कर दिया।”
    reason: lexical_alternative
  - marker: c
    text: या, “सेंतमेंत हमें सब कुछ क्यों न देगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς γε
  choice: जिसने ... भी
  rationale: संबंधवाचक रूप पिछले संदर्भ में परमेश्वर की ओर संकेत बनाए रखता है; ‘भी’ यूनानी γε के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοῦ ἰδίου υἱοῦ
  choice: अपने निज पुत्र
  rationale: ‘निज’ ἰδίου के गहरे निजी संबंध और बल को सुरक्षित रखता है।
- source_word: οὐκ ἐφείσατο
  choice: नहीं बचाया
  rationale: यहाँ क्रिया का अर्थ अपने पुत्र को दुःख और मृत्यु से बचाकर न रखना है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: ὑπὲρ ἡμῶν πάντων
  choice: हम सबके लिए
  rationale: यह लाभ और प्रतिनिधिक पक्ष दोनों के लिए पर्याप्त व्यापक है तथा मूल से अधिक तकनीकी प्रायश्चित्तार्थ नहीं जोड़ता।
- source_word: παρέδωκεν αὐτόν
  choice: उसे सौंप दिया
  rationale: παραδίδωμι का दुःख और मृत्यु के लिए सौंपे जाने का गंभीर भाव सुरक्षित रहता है।
- source_word: πῶς οὐχὶ καὶ
  choice: क्यों न देगा?
  rationale: नकारात्मक आलंकारिक प्रश्न के निश्चित आशय को सहज हिन्दी में रखते हुए तर्क का बल सुरक्षित है।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: सύν का सीधा सहवर्ती अर्थ सुरक्षित रखता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: पौलुस की व्यापक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
- source_word: χαρίσεται
  choice: अनुग्रहपूर्वक ... देगा
  rationale: χαρίζομαι में निहित अनुग्रह और नि:शुल्क दान का भाव केवल ‘देगा’ की अपेक्षा अधिक स्पष्ट रहता है।
theological_decisions:
- issue: ὑπὲρ ἡμῶν πάντων को प्रतिस्थापन के तकनीकी सूत्र के रूप में स्पष्ट करना या उसके व्यापक लाभार्थक अर्थ को बनाए रखना
  choice: हम सबके लिए
  alternative: हम सबकी ओर से
  rationale: मूल पाठ लाभार्थक और प्रतिनिधिक अर्थ की गुंजाइश रखता है, पर स्वयं किसी अधिक संकीर्ण तकनीकी प्रायश्चित्त-सूत्र का प्रयोग नहीं करता।
- issue: τὰ πάντα की व्यापकता को संदर्भगत आत्मिक भलाई तक सीमित करना
  choice: सब कुछ
  alternative: हर आवश्यक वस्तु
  rationale: मूल की व्यापक और तनावपूर्ण अभिव्यक्ति को बिना व्याख्यात्मक सीमा लगाए सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध हिन्दी। आलंकारिक प्रश्न और ‘अपने निज पुत्र’ का बल रखा गया है; अत्यधिक संस्कृतनिष्ठ या संप्रदायगत शब्दावली से बचा गया है।
