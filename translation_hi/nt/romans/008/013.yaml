language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ κατὰ σάρκα ζῆτε μέλλετε ἀποθνῄσκειν, εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/013.yaml
  text: For if you live according to the flesh[a], you are about to die; but if by the Spirit you put to death the deeds of the body, you will live.
translation:
  language: hi
  text: क्योंकि यदि आप शरीर के अनुसार जीते हैं[a], तो आप मरने वाले हैं; परन्तु यदि आप पवित्र आत्मा के द्वारा शरीर के कामों को मार डालते हैं, तो आप जीएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मांस के अनुसार।” यहाँ ‘शरीर’ परमेश्वर की आत्मा के विरोध में मनुष्य के पाप-प्रभावित जीवन-ढंग को दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन से इस पद के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κατὰ σάρκα
  choice: शरीर के अनुसार
  rationale: यह σάρξ के ठोस रूपक को सुरक्षित रखता है और उसे व्याख्यात्मक रूप से केवल ‘पापी स्वभाव’ नहीं बना देता; प्रसंग में इसका नैतिक अर्थ स्पष्ट है।
- source_word: ζῆτε
  choice: जीते हैं
  rationale: शर्तवाचक वाक्य में यूनानी वर्तमानकाल का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: μέλλετε ἀποθνῄσκειν
  choice: आप मरेंगे
  rationale: यहाँ μέλλω परिणाम की निश्चित भावी संभावना व्यक्त करता है; ‘मरने ही वाले हैं’ हिन्दी में अनावश्यक तात्कालिकता जता सकता है।
- source_word: πνεύματι
  choice: आत्मा के द्वारा
  rationale: करण कारक का अर्थ स्पष्ट करता है; रोमियों 8 का निकट प्रसंग पवित्र आत्मा की ओर संकेत करता है।
- source_word: τὰς πράξεις τοῦ σώματος
  choice: शरीर के कामों को
  rationale: πράξεις का साधारण, नैतिक और क्रियात्मक अर्थ तथा σώματος का संबंध दोनों सुरक्षित रहते हैं।
- source_word: θανατοῦτε
  choice: मार डालते हैं
  rationale: क्रिया की प्रबलता को आधुनिक और समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: ζήσεσθε
  choice: जीवित रहेंगे
  rationale: यूनानी भविष्यकाल का सहज हिन्दी प्रतिरूप है और पहले खंड के ‘मरेंगे’ से स्पष्ट विरोध बनाता है।
theological_decisions:
- issue: πνεύματι पवित्र आत्मा है या मानवीय आत्मा
  choice: मुख्य पाठ में ‘आत्मा’ को परमेश्वर के आत्मा के रूप में समझना
  alternative: मानवीय आत्मा अथवा जानबूझकर अस्पष्ट ‘आत्मा’
  rationale: रोमियों 8 में बार-बार आने वाला निकट संदर्भ पवित्र आत्मा को वह सामर्थ्य देने वाला कर्ता बताता है जिसके द्वारा शरीर के काम मारे जाते हैं; हिन्दी में आदरसूचक रूप ‘आत्मा’ इस संदर्भ को संकेतित करता है।
- issue: σάρξ का नैतिक अर्थ
  choice: ‘शरीर’ के रूपक को बनाए रखना
  alternative: ‘पापी स्वभाव’
  rationale: ‘पापी स्वभाव’ अर्थ की एक व्याख्या को पाठ में स्थिर कर देता है, जबकि ‘शरीर’ पौलुस के शरीर/आत्मा-विरोध की भाषिक और धर्मवैचारिक तनातनी को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक बहुवचन ‘आप’; भाषा सरल, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘शरीर’ को मुख्य पाठ में रखकर मूल रूपक सुरक्षित किया गया है, और पाद-टिप्पणी उसका शाब्दिक तथा प्रसंगगत अर्थ स्पष्ट करती है।
