source:
  edition: SBLGNT
  text: τίς ὁ ⸀κατακρινῶν; ⸀Χριστὸς ὁ ἀποθανών, μᾶλλον ⸀δὲ ⸀ἐγερθείς, ὅς ⸀καί ἐστιν ἐν δεξιᾷ τοῦ θεοῦ, ὃς καὶ ἐντυγχάνει ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/034.yaml
  text: Who is the one condemning? Messiah Jesus is the one who died—more than that[a], who was raised—who is also at the right hand of God[d][c][b], who also intercedes for us.
translation:
  language: hi
  text: दोषी ठहराने वाला कौन है? मसीह हैं—जो मर गए; बल्कि, इससे भी बढ़कर, जो जिलाए गए, जो परमेश्वर के दाहिने हाथ पर हैं और हमारे लिए विनती भी करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατακρινῶν
  choice: दोषी ठहराने वाला
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत को स्वाभाविक हिन्दी में व्यक्त करता है और अलंकारिक प्रश्न की तीक्ष्णता बनाए रखता है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ शब्द उपाधि के रूप में प्रयुक्त है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थपूर्ण और परिचित रूप है। मूल यूनानी पाठ में ‘यीशु’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: ἀποθανών
  choice: जो मर गए
  rationale: अओरिस्ट कृदंत के ऐतिहासिक कार्य को सरल भूतकालीन संबंधवाचक उपवाक्य से व्यक्त किया गया है।
- source_word: μᾶλλον δὲ
  choice: इससे भी बढ़कर
  rationale: यह वाक्यांश मृत्यु से पुनरुत्थान की ओर बढ़ते हुए कथन को और प्रबल बनाता है; यह हिन्दी अभिव्यक्ति उस उत्कर्ष को स्वाभाविक ढंग से रखती है।
- source_word: ἐγερθείς
  choice: जो जिलाए गए
  rationale: यूनानी का कर्मवाच्य सुरक्षित रखा गया है और यह नहीं कहा गया कि मसीह स्वयं जी उठे।
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: परमेश्वर की दाहिनी ओर
  rationale: मूल स्थानसूचक बाइबलीय अभिव्यक्ति को परिचित हिन्दी रूप में रखा गया है।
- source_word: ἐντυγχάνει ὑπὲρ ἡμῶν
  choice: हमारे लिए विनती भी करते हैं
  rationale: यह मध्यस्थतापूर्ण निवेदन का भाव व्यक्त करता है, जबकि ὑπέρ का सहज अर्थ ‘हमारे लिए’ बनाए रखता है।
theological_decisions:
- issue: Χριστός का उपाधि-सूचक प्रयोग
  choice: मसीह
  alternative: ख्रीस्त
  rationale: संदर्भ में यह उद्धारकर्ता की उपाधि है। ‘मसीह’ अर्थपूर्ण, प्रचलित हिन्दी रूप है और मूल में अनुपस्थित ‘यीशु’ को नहीं जोड़ता।
- issue: ἐγερθείς का वाच्य
  choice: जो जिलाए गए
  alternative: जो जी उठे
  rationale: कर्मवाच्य अनुवाद यूनानी रूप को सुरक्षित रखता है और पुनरुत्थान को मसीह पर किए गए कार्य के रूप में प्रस्तुत करने वाली पाठगत अभिव्यक्ति को नहीं बदलता।
- issue: परमेश्वर की दाहिनी ओर होने का अर्थ
  choice: मुहावरे को मुख्य पाठ में यथावत रखकर पादटिप्पणी में समझाया गया
  alternative: परमेश्वर के साथ सर्वोच्च अधिकार के स्थान पर
  rationale: मुख्य पाठ में बाइबलीय रूपक और उसकी अंतर्पाठीय प्रतिध्वनि सुरक्षित रहती है; व्याख्या को अनुवाद में मिलाने के बजाय टिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मसीह के लिए आदरसूचक बहुवचन (‘हैं’, ‘गए’, ‘करते हैं’) हिन्दी की स्वाभाविक धार्मिक शैली के अनुरूप है। दोहराए गए ‘और’ यूनानी καί की संचयी लय को बिना असहजता के बनाए रखते हैं।
