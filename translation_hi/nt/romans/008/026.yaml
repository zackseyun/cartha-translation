source:
  edition: SBLGNT
  text: Ὡσαύτως δὲ καὶ τὸ πνεῦμα συναντιλαμβάνεται ⸂τῇ ἀσθενείᾳ⸃ ἡμῶν· τὸ γὰρ τί ⸀προσευξώμεθα καθὸ δεῖ οὐκ οἴδαμεν, ἀλλὰ αὐτὸ τὸ πνεῦμα ⸀ὑπερεντυγχάνει στεναγμοῖς ἀλαλήτοις,
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/026.yaml
  text: Likewise[a], the Spirit also helps in our weakness. For we do not know what we should pray for as we ought, but the Spirit himself intercedes with inexpressible groanings[b],
translation:
  language: hi
  text: इसी प्रकार आत्मा भी हमारी दुर्बलता में हमारी सहायता करता है। क्योंकि हम नहीं जानते कि जैसा उचित है, किस बात के लिए प्रार्थना करें; पर आत्मा स्वयं अकथनीय कराहों के साथ हमारे लिए विनती करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शब्दरहित कराहों के साथ।”
    reason: ἀλαλήτοις का अर्थ ऐसी कराहें हो सकता है जिन्हें कहा या शब्दों में व्यक्त नहीं किया जा सकता; ‘शब्दरहित’ निकट वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: Ὡσαύτως δὲ καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पिछले प्रसंग से संबंध को स्वाभाविक हिन्दी में बनाए रखता है; δὲ को अलग विरोधसूचक शब्द से व्यक्त करना यहाँ आवश्यक नहीं।
- source_word: συναντιλαμβάνεται
  choice: हमारी सहायता करता है
  rationale: क्रिया साथ मिलकर भार उठाने या सहायता के लिए आगे आने का भाव रखती है; सहज हिन्दी में ‘सहायता करता है’ उपयुक्त है।
- source_word: τῇ ἀσθενείᾳ ἡμῶν
  choice: हमारी दुर्बलता में
  rationale: एकवचन सामूहिक मानवीय दुर्बलता को दर्शाता है और अर्थ को केवल शारीरिक या आत्मिक कमजोरी तक सीमित नहीं करता।
- source_word: τὸ γὰρ τί προσευξώμεθα καθὸ δεῖ
  choice: हमें किस बात के लिए प्रार्थना करनी चाहिए, जैसे करना उचित है
  rationale: τί को प्रार्थना की विषयवस्तु और καθὸ δεῖ को उचित रीति/मानक के रूप में अलग-अलग बनाए रखता है।
- source_word: αὐτὸ τὸ πνεῦμα
  choice: आत्मा स्वयं
  rationale: बलाघातयुक्त यूनानी रचना को व्यक्त करता है और हिन्दी में व्याकरणिक लिंग पर अनावश्यक निर्भरता से बचते हुए आत्मा की सक्रिय भूमिका स्पष्ट करता है।
- source_word: ὑπερεντυγχάνει
  choice: हमारे लिए विनती करता है
  rationale: यह असाधारण रूप से प्रबल मध्यस्थता या पक्ष में निवेदन का भाव देता है; प्रसंग से निहित ‘हमारे लिए’ हिन्दी में स्पष्ट किया गया है।
- source_word: στεναγμοῖς ἀλαλήτοις
  choice: ऐसे कराहते हुए ... जिन्हें शब्दों में व्यक्त नहीं किया जा सकता
  rationale: ἀλάλητος की वास्तविक अस्पष्टता—अकथनीय अथवा शब्दरहित—को अत्यधिक संकीर्ण किए बिना स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या αὐτὸ τὸ πνεῦμα को लिंगयुक्त आत्मवाचक सर्वनाम से प्रस्तुत किया जाए
  choice: आत्मा स्वयं
  alternative: आत्मा खुद / आत्मा अपने आप
  rationale: यह यूनानी के बलाघात और व्यक्तिगत सक्रियता दोनों को रखता है, पर हिन्दी में पुल्लिंग सर्वनाम जोड़कर व्याकरण से अधिक निष्कर्ष नहीं निकालता।
- issue: कराहने का कर्ता और स्वरूप
  choice: वाक्यरचना आत्मा की मध्यस्थता को कराहों से जोड़ती है, पर उनके अनुभवगत स्वरूप को और परिभाषित नहीं करती
  alternative: विश्वासी के कराहने अथवा किसी विशिष्ट प्रार्थना-पद्धति के रूप में स्पष्ट करना
  rationale: मूल पाठ आत्मा को मध्यस्थता करने वाला बताता है, किंतु कराहों की प्रक्रिया या श्रव्यता पर विस्तृत सिद्धान्त नहीं देता; अनावश्यक व्याख्यात्मक विस्तार से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज पाठ। ‘दुर्बलता’, ‘प्रार्थना’ और ‘विनती’ सामान्य धार्मिक शब्दावली में बोधगम्य हैं। वाक्य को मूल की तार्किक संरचना के निकट रखते हुए अत्यधिक संस्कृतनिष्ठ भाषा से बचाया गया है।
