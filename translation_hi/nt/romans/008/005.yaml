id: ROM.8.5
reference: Romans 8:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ γὰρ κατὰ σάρκα ὄντες τὰ τῆς σαρκὸς φρονοῦσιν, οἱ δὲ κατὰ πνεῦμα τὰ τοῦ πνεύματος.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/005.yaml
  text: For those who live according to the flesh set their minds on the things of the flesh, but those who live according to the Spirit, on the things of the Spirit.
translation:
  language: hi
  text: क्योंकि जो शरीर के अनुसार जीते हैं, वे शरीर की बातों पर मन लगाते हैं; पर जो आत्मा के अनुसार जीते हैं, वे आत्मा की बातों पर मन लगाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ σάρκα ὄντες
  choice: शरीर के अनुसार जीते हैं
  rationale: शाब्दिक अर्थ ‘शरीर के अनुसार होने वाले’ है, पर प्रसंग में यह जीवन की दिशा और आचरण को दर्शाता है। ‘जीते हैं’ आधुनिक हिन्दी में इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φρονοῦσιν
  choice: मन लगाते हैं
  rationale: यह क्रिया केवल विचार करने नहीं, बल्कि मनोवृत्ति, रुचि और ध्यान की दिशा रखने का भाव देती है; ‘मन लगाते हैं’ इस व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: τὰ τῆς σαρκὸς / τὰ τοῦ πνεύματος
  choice: शरीर की बातें / आत्मा की बातें
  rationale: यूनानी संबंधसूचक अभिव्यक्ति को जानबूझकर व्यापक रखा गया है, ताकि उससे संबंधित हितों, इच्छाओं और विषयों का अर्थ बना रहे।
- source_word: πνεῦμα
  choice: आत्मा
  rationale: रोमियों 8 के निकटवर्ती प्रसंग में इसका संकेत परमेश्वर के पवित्र आत्मा की ओर है; हिन्दी में ‘आत्मा’ स्वाभाविक और परंपरागत समतुल्य है।
theological_decisions:
- issue: σάρξ का अर्थ
  choice: शरीर
  alternative: पापी स्वभाव
  rationale: ‘शरीर’ मूल रूपक और पौलुस की जानबूझकर रखी गई अर्थगत व्यापकता को सुरक्षित रखता है; ‘पापी स्वभाव’ व्याख्यात्मक होकर अर्थ को एक धर्मवैज्ञानिक निष्कर्ष तक सीमित कर देगा।
- issue: κατὰ ... ὄντες की अभिव्यक्ति
  choice: के अनुसार जीते हैं
  alternative: के अनुसार हैं
  rationale: ‘जीते हैं’ प्रसंग में जीवन-अभिमुखता को स्पष्ट करता है, जबकि इसे केवल व्यवहार तक सीमित नहीं किया गया; समानांतर दोनों खंडों में संरचना कायम रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और समानांतर वाक्य-विन्यास। ‘शरीर’ और ‘आत्मा’ की पौलुसी विरोधात्मकता को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
