source:
  edition: SBLGNT
  text: τῇ γὰρ ματαιότητι ἡ κτίσις ὑπετάγη, οὐχ ἑκοῦσα ἀλλὰ διὰ τὸν ὑποτάξαντα, ⸀ἐφ’ ἑλπίδι
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/020.yaml
  text: For the creation was subjected to futility[a], not willingly, but because of the one who subjected it[c][b], in hope
translation:
  language: hi
  text: क्योंकि सृष्टि व्यर्थता[a] के अधीन कर दी गई—अपनी इच्छा से नहीं, बल्कि उसके कारण जिसने उसे अधीन किया[b]—आशा में[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निष्फलता’ अथवा ‘निरर्थकता’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ स्पष्ट रूप से नहीं बताता कि सृष्टि को अधीन करने वाला कौन है।
    reason: alternative_reading
  - marker: c
    text: या ‘आशा के साथ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ματαιότητι
  choice: व्यर्थता
  rationale: यहाँ शब्द सृष्टि की उस निष्फल और निराशाजनक दशा को दर्शाता है जिसमें वह अपने उचित लक्ष्य तक नहीं पहुँच पाती; ‘व्यर्थता’ इस भाव को संक्षेप में रखता है।
- source_word: κτίσις
  choice: सृष्टि
  rationale: रोमियों 8:19–22 के संदर्भ में यह किसी एक प्राणी के बजाय सामूहिक सृजित जगत को दर्शाता है।
- source_word: ὑπετάγη
  choice: अधीन कर दी गई
  rationale: कर्मवाच्य रूप बताता है कि सृष्टि पर यह दशा बाहर से थोपी गई थी; हिन्दी में यह प्रयोग उस कर्मवाच्य बल को सुरक्षित रखता है।
- source_word: οὐχ ἑκοῦσα
  choice: अपनी इच्छा से नहीं
  rationale: यह सृष्टि की स्वेच्छा के अभाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τὸν ὑποτάξαντα
  choice: उसके कारण जिसने उसे अधीन किया
  rationale: διά के कारणसूचक अर्थ को रखते हुए कर्ता की पहचान अनिर्धारित छोड़ी गई है, जैसा यूनानी पाठ में है।
- source_word: ἐφ’ ἑλπίδι
  choice: आशा में
  rationale: यह संक्षिप्त पदबंध मूल की संक्षिप्तता और भविष्य की ओर उन्मुख भाव को बनाए रखता है।
theological_decisions:
- issue: सृष्टि को अधीन करने वाले की पहचान
  choice: मुख्य पाठ में पहचान को अनिर्दिष्ट रखते हुए ‘उसके कारण जिसने उसे अधीन किया’ कहा गया।
  alternative: इसे परमेश्वर, आदम के पतन, या शैतान के स्पष्ट संदर्भ के रूप में प्रस्तुत करना।
  rationale: यूनानी पद स्वयं कर्ता का नाम नहीं बताता; इसलिए अनुवाद इस धर्मवैज्ञानिक तनाव को बिना सुलझाए सुरक्षित रखता है।
- issue: ἐφ’ ἑλπίδι का पिछले या अगले कथन से संबंध
  choice: ‘आशा में’ को इसी पद के अंत में रखा गया।
  alternative: इसे अगले पद के कथन से अधिक निकटता से जोड़ना, या ‘इस आशा के साथ’ कहना।
  rationale: मूल वाक्यांश का संबंध व्याकरणतः कुछ खुला है; संक्षिप्त अनुवाद और पद-अंत की स्थिति इस संभावित संबंध-विविधता को बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘अधीन कर दी गई’ मूल के कर्मवाच्य को सुरक्षित रखता है, जबकि डैश वाक्य के विरोधी और व्याख्यात्मक खंडों को स्पष्ट करते हैं।
