source:
  edition: SBLGNT
  text: οὔτε ὕψωμα οὔτε βάθος οὔτε τις κτίσις ἑτέρα δυνήσεται ἡμᾶς χωρίσαι ἀπὸ τῆς ἀγάπης τοῦ θεοῦ τῆς ἐν Χριστῷ Ἰησοῦ τῷ κυρίῳ ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/039.yaml
  text: nor height nor depth nor any other created thing will be able to separate us from the love of God that is in Messiah Jesus our Lord[a][b][c].
translation:
  language: hi
  text: न ऊँचाई, न गहराई, और न ही कोई अन्य सृजित वस्तु हमें परमेश्वर के उस प्रेम से अलग कर सकेगी, जो हमारे प्रभु मसीहा यीशु में है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सृष्टि की कोई और वस्तु” अथवा “कोई अन्य सृजित प्राणी।”
    reason: lexical_alternative
  - marker: b
    text: “मसीहा यीशु” का पारंपरिक अनुवाद “मसीह यीशु” है।
    reason: lexical_alternative
  - marker: c
    text: “परमेश्वर का प्रेम” यहाँ सम्भवतः हमारे प्रति परमेश्वर के प्रेम को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὕψωμα
  choice: ऊँचाई
  rationale: βάθος के साथ विरोधी स्थानिक युग्म बनाता है; ‘ऊँचाई’ सीधा, स्वाभाविक और अलंकारिक व्यापकता को सुरक्षित रखने वाला अनुवाद है।
- source_word: βάθος
  choice: गहराई
  rationale: ὕψωμα के साथ चरम आयामों का युग्म है; ‘गहराई’ इसका स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: κτίσις ἑτέρα
  choice: कोई दूसरी सृजी हुई वस्तु
  rationale: κτίσις यहाँ सृष्ट वस्तु या प्राणी को सूचित कर सकता है। यह रूप किसी भी सृजी हुई सत्ता को समेटता है और ἑτέρα तथा τις दोनों का बल बनाए रखता है।
- source_word: δυνήσεται
  choice: अलग कर सकेगी
  rationale: ‘सकेगी’ भविष्यकालीन सामर्थ्य को व्यक्त करता है और हिन्दी में χωρίσαι के साथ स्वाभाविक संयुक्त रूप बनाता है।
- source_word: χωρίσαι
  choice: अलग कर
  rationale: संदर्भ में किसी को प्रेम से पृथक कर देने का अर्थ है; ‘अलग करना’ स्पष्ट और प्रचलित है।
- source_word: ἀγάπης τοῦ θεοῦ
  choice: परमेश्वर के उस प्रेम
  rationale: सम्बन्धकारक की मूल संरचना को रखा गया है। ‘उस’ आगे आने वाले विशेषणात्मक वाक्यांश ‘जो...में है’ से प्रेम को स्वाभाविक ढंग से जोड़ता है।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीहा यीशु में
  rationale: Χριστός यहाँ पदवी है; ‘मसीहा’ उसके अर्थ को व्यक्त करता है, और ἐν के लिए ‘में’ मूल सम्बन्ध को सुरक्षित रखता है।
- source_word: κυρίῳ ἡμῶν
  choice: हमारे प्रभु
  rationale: κύριος का स्थापित और प्रसंगानुकूल हिन्दी रूप ‘प्रभु’ है; ἡμῶν को ‘हमारे’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘परमेश्वर के प्रेम’ में सम्बन्धकारक का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर के प्रेम’ रखकर मूल व्याकरणिक अस्पष्टता सुरक्षित रखी गई; पादटिप्पणी में प्रसंगतः परमेश्वर का हमारे प्रति प्रेम बताया गया।
  alternative: परमेश्वर के लिए हमारा प्रेम; अथवा दोनों दिशाओं को समेटने वाला व्यापक अर्थ।
  rationale: रोमियों 8:31–39 में परमेश्वर के अपने लोगों के पक्ष में किए कार्य प्रमुख हैं, इसलिए परमेश्वर का हमारे प्रति प्रेम सबसे सम्भावित है; फिर भी मूल सम्बन्धकारक को मुख्य पाठ में स्पष्ट करके सीमित नहीं किया गया।
- issue: Χριστός को पदवी या पारम्परिक नामरूप मानना
  choice: मसीहा
  alternative: मसीह
  rationale: यूनानी Χριστός अभिषिक्त जन की पदवी है। ‘मसीहा’ अर्थ-सूचक और सामान्य पाठक के लिए बोधगम्य है; पादटिप्पणी पारम्परिक ‘मसीह’ रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। पदक्रम को हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि यूनानी के नकारात्मक क्रम, भविष्यकालीन सामर्थ्य और मुख्य धर्मवैज्ञानिक अस्पष्टता को सुरक्षित रखा गया है।
