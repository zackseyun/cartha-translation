id: ROM.8.24
reference: Romans 8:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τῇ γὰρ ἐλπίδι ἐσώθημεν· ἐλπὶς δὲ βλεπομένη οὐκ ἔστιν ἐλπίς, ὃ γὰρ βλέπει ⸀τίς ἐλπίζει;
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/024.yaml
  text: For in hope we were saved[a]. But hope that is seen is not hope[b], for who hopes for what he sees?
translation:
  language: hi
  text: क्योंकि आशा में हमारा उद्धार हुआ[a]। पर जो आशा दिखाई देती है, वह आशा नहीं; क्योंकि जो दिखाई दे रहा है, उसकी आशा कौन करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आशा के द्वारा हमारा उद्धार हुआ।”
    reason: alternative_reading
lexical_decisions:
- source_word: τῇ ἐλπίδι
  choice: आशा में
  rationale: 'यहाँ दत्तिव कारक को क्षेत्र या अवस्था के अर्थ में लिया गया है: उद्धार वास्तविक है, पर उसकी पूर्णता अभी दिखाई नहीं देती। यह विकल्प ‘आशा के द्वारा’ की अपेक्षा आशा को उद्धार का साधन बताने से बचता है।'
- source_word: ἐσώθημεν
  choice: हमारा उद्धार हुआ
  rationale: यूनानी के अओरिस्ट कर्मवाच्य को स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है; इससे कर्ता को जोड़े बिना पूर्ण हुई उद्धारकारी घटना व्यक्त होती है।
- source_word: ἐλπὶς ... βλεπομένη
  choice: जो आशा दिखाई देती है
  rationale: वर्तमान कर्मवाच्य कृदन्त को सहज हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है और आशा तथा दृष्टि का विरोध बनाए रखा गया है।
- source_word: οὐκ ἔστιν ἐλπίς
  choice: वह आशा नहीं
  rationale: यूनानी के गुणात्मक कथन को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: ὃ γὰρ βλέπει
  choice: क्योंकि जो दिखाई दे रहा है
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम को सामान्य वस्तु या परिस्थिति के रूप में ‘जो’ से व्यक्त किया गया है। कर्मवाच्य हिन्दी वाक्य लिंग-विशिष्ट सर्वनाम जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: τίς ἐλπίζει
  choice: उसकी आशा कौन करता है?
  rationale: प्रश्नवाचक और लोकोक्तिपरक बल को सरल वर्तमान काल में रखा गया है; ‘कौन’ कथन की सार्वभौमिकता बनाए रखता है।
theological_decisions:
- issue: τῇ ἐλπίδι ἐσώθημεν में उद्धार और आशा का संबंध
  choice: मुख्य पाठ में ‘आशा में हमारा उद्धार हुआ’ रखा गया है, जिससे वर्तमान उद्धार और उसकी भावी, अभी अदृश्य पूर्णता के बीच का तनाव बना रहता है।
  alternative: ‘आशा के द्वारा हमारा उद्धार हुआ’—दत्तिव को साधनवाचक समझने वाला अनुवाद।
  rationale: आसपास का प्रसंग ‘पहले से’ और ‘अभी नहीं’ के तनाव पर केंद्रित है। ‘आशा में’ इस अर्थ को सुरक्षित रखता है और आशा को उद्धार का प्रभावकारी कारण घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। मुख्य पाठ में ‘आशा में’ जानबूझकर रखा गया है ताकि मूल दत्तिव की संभावित क्षेत्रवाचकता और पौलुस का भविष्याभिमुख तनाव सुरक्षित रहे। अंग्रेज़ी की व्याख्यात्मक दूसरी टिप्पणी को अलग पादटिप्पणी नहीं बनाया गया, क्योंकि वाक्य स्वयं स्पष्ट करता है कि आशा अभी न दिखाई देने वाली वस्तु से संबंधित है।
