  text: What then shall we say to these things? If God is for us[b][a], who is against us?
translation:
  language: hi
  text: तो इन बातों के विषय में हम क्या कहें?[a] यदि परमेश्वर हमारे पक्ष में है,[b] तो हमारे विरुद्ध कौन है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो इन बातों के उत्तर में हम क्या कहें?”
    reason: lexical_alternative
  - marker: b
    text: या, “जब परमेश्वर हमारे पक्ष में है, तो हमारे विरुद्ध कौन है?”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί οὖν ἐροῦμεν
  choice: तो ... हम क्या कहें?
  rationale: यह वाक्यांश पिछले तर्क से निष्कर्ष की ओर ले जाने वाला विचारात्मक-अलंकारिक प्रश्न है। ‘तो’ οὖν की संयोजक शक्ति को और ‘हम क्या कहें?’ भविष्यकालीन ἐροῦμεν के विचारात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς ταῦτα
  choice: इन बातों के विषय में
  rationale: πρός यहाँ पहले कही गई बातों के संदर्भ में बोलने का भाव देता है। यह हिन्दी में स्वाभाविक है और ‘इन बातों के उत्तर में’ की सम्भव वैकल्पिक छाया को पादटिप्पणी में रखा गया है।
- source_word: εἰ
  choice: यदि
  rationale: ‘यदि’ यूनानी की शर्तसूचक संरचना को बनाए रखता है। प्रसंग में यह संदेह नहीं, बल्कि सत्य मानी गई बात पर आधारित प्रभावशाली अलंकारिक प्रश्न है; ‘क्योंकि/जब’ की व्याख्यात्मक सम्भावना पादटिप्पणी में दी गई है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: θεός के लिए आधुनिक हिन्दी बाइबलीय भाषा में स्पष्ट, प्रतिष्ठित और सामान्य पद।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे पक्ष में
  rationale: ὑπέρ यहाँ अनुकूलता, समर्थन और पक्षधरता व्यक्त करता है। ‘हमारे पक्ष में’ इस विरोधात्मक वाक्य में καθ’ ἡμῶν के साथ स्पष्ट समानांतर बनाता है।
- source_word: τίς καθ’ ἡμῶν
  choice: हमारे विरुद्ध कौन हो सकता है?
  rationale: κατά के विरोध के भाव को ‘विरुद्ध’ व्यक्त करता है। हिन्दी में केवल ‘कौन हमारे विरुद्ध?’ अपूर्ण लगता है; ‘हो सकता है’ निहित विधेय को स्वाभाविक रूप से पूरा करता और अलंकारिक चुनौती का भाव बनाए रखता है।
theological_decisions:
- issue: εἰ ὁ θεὸς ὑπὲρ ἡμῶν का शर्तसूचक बल
  choice: मुख्य पाठ में ‘यदि परमेश्वर हमारे पक्ष में है’
  alternative: ‘क्योंकि परमेश्वर हमारे पक्ष में है’ या ‘जब परमेश्वर हमारे पक्ष में है’
  rationale: मूल यूनानी में εἰ है, इसलिए ‘यदि’ औपचारिक संरचना और अलंकारिक तनाव सुरक्षित रखता है। पूर्ववर्ती प्रसंग स्पष्ट करता है कि पौलुस परमेश्वर के पक्ष में होने पर संदेह नहीं कर रहा; वैकल्पिक भाव पादटिप्पणी में बताया गया है।
- issue: τίς καθ’ ἡμῶν की अलंकारिक चुनौती
  choice: ‘हमारे विरुद्ध कौन हो सकता है?’
  alternative: ‘हमारे विरुद्ध कौन है?’
  rationale: प्रश्न का आशय यह नहीं कि कोई विरोधी अस्तित्व में नहीं है, बल्कि यह कि परमेश्वर के पक्ष में होने पर कोई विरोधी निर्णायक रूप से सफल नहीं हो सकता। ‘हो सकता है’ हिन्दी में इस अलंकारिक शक्ति को व्यक्त करता है, बिना यह दावा जोड़े कि विश्वासियों का कोई विरोधी नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर’, ‘पक्ष में’ और ‘विरुद्ध’ सामान्य पाठक के लिए स्पष्ट हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित वाक्यांशों के तुरंत बाद दिए गए हैं।
