source:
  edition: SBLGNT
  text: ὅτι οὓς προέγνω, καὶ προώρισεν συμμόρφους τῆς εἰκόνος τοῦ υἱοῦ αὐτοῦ, εἰς τὸ εἶναι αὐτὸν πρωτότοκον ἐν πολλοῖς ἀδελφοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/029.yaml
  text: For those whom he foreknew[a], he also predestined to be conformed to the image of his Son[b], so that he might be the firstborn among many brothers.
translation:
  language: hi
  text: क्योंकि जिन्हें उसने पहले से जाना[a], उन्हें उसने अपने पुत्र के स्वरूप के अनुरूप होने के लिए पहले से ठहराया, ताकि उसका पुत्र बहुत से भाइयों[b] में पहलौठा हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहले से जानता था”; कुछ लोग यहाँ “जानना” को संबंधपरक अर्थ में समझते हैं, अर्थात उसने पहले ही उन पर अपनी दृष्टि रखी थी।
    reason: alternative_reading
  - marker: b
    text: “भाइयों” का यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है; परमेश्वर के परिवार के इस संदर्भ में इसमें स्त्री और पुरुष दोनों सम्मिलित हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: προέγνω
  choice: पहले से जाना
  rationale: यह यूनानी क्रिया के मूल अर्थ और उसकी धर्मवैचारिक गहराई दोनों को बनाए रखता है, पर यह तय नहीं करता कि यहाँ केवल पूर्वज्ञान है या पहले से स्थापित संबंधपरक कृपादृष्टि।
- source_word: προώρισεν
  choice: पहले से ... ठहराया
  rationale: यह क्रिया के पूर्वकालिक और उद्देश्यपूर्ण भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी विशिष्ट सम्प्रदायगत पारिभाषिक शब्द को थोपे।
- source_word: συμμόρφους τῆς εἰκόνος
  choice: स्वरूप के अनुरूप हों
  rationale: यह पुत्र के स्वरूप के साथ समानता का भाव बनाए रखता है और परिवर्तन अथवा ढाले जाने की दिशा को व्यक्त करता है।
- source_word: υἱοῦ
  choice: पुत्र
  rationale: मूल पाठ में स्पष्ट पुत्र-संबंधी मसीही उपाधि है, इसलिए इसे सीधे बनाए रखा गया है।
- source_word: εἰς τὸ εἶναι
  choice: ताकि ... हो
  rationale: यह रचना के उद्देश्य अथवा परिणाम के भाव को सहज हिन्दी में व्यक्त करती है।
- source_word: πρωτότοκον
  choice: पहलौठा
  rationale: यह जन्म-क्रम की मूल उपमा और उससे जुड़ी प्रधानता, दोनों को सुरक्षित रखता है; इसे केवल ‘सर्वप्रधान’ कहकर रूपक को हटाया नहीं गया।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है; सम्भावित समावेशी संदर्भ को मुख्य पाठ में बदलने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताने वाले व्याख्यात्मक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या προέγνω का अनुवाद पूर्वज्ञान और पूर्वनिर्धारण के विवाद को किसी एक दिशा में तय करे?
  choice: पहले से जाना
  alternative: पहले से उस पर कृपादृष्टि की / पहले से प्रेम किया
  rationale: चुना गया अनुवाद यूनानी क्रिया के शाब्दिक रूप को बनाए रखता है और ज्ञानात्मक तथा संबंधपरक, दोनों सम्भावनाओं के बीच पाठ की धर्मवैचारिक कसावट को सुरक्षित रखता है।
- issue: क्या ἀδελφοῖς को मुख्य पाठ में लिंग-समावेशी बनाया जाए?
  choice: भाइयों, साथ में समावेशी अर्थ की पादटिप्पणी
  alternative: भाइयों और बहनों / भाई-बहनों
  rationale: मुख्य पाठ में यूनानी का व्याकरणिक पुल्लिंग रूप रखा गया है, जबकि परमेश्वर के परिवार में स्त्री और पुरुष दोनों सम्मिलित हो सकने की बात पादटिप्पणी में दी गई है।
- issue: πρωτότοκον में जन्म-क्रम और प्रधानता के संबंध को कैसे रखा जाए?
  choice: पहलौठा
  alternative: सर्वप्रधान
  rationale: ‘पहलौठा’ मूल रूपक को सुरक्षित रखता है और पाठक को संदर्भ में उसकी प्रधानता के निहितार्थ को समझने देता है, बिना अनुवाद में रूपक को व्याख्या से बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘स्वरूप के अनुरूप’ मूल की निकटता और हिन्दी की बोधगम्यता के बीच संतुलन रखता है। कर्ता की अस्पष्टता से बचने के लिए अंतिम उपवाक्य में ‘उसका पुत्र’ दोहराया गया है।
