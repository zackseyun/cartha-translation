source:
  edition: SBLGNT
  text: Οἴδαμεν δὲ ὅτι τοῖς ἀγαπῶσι τὸν θεὸν πάντα ⸀συνεργεῖ εἰς ἀγαθόν, τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/028.yaml
  text: And we know that for those who love God, all things work together for good—for those who are called according to purpose.
translation:
  language: hi
  text: और हम जानते हैं कि जो परमेश्वर से प्रेम करते हैं, उनके लिए सब बातें मिलकर भलाई उत्पन्न करती हैं[a]—अर्थात् उनके लिए, जो उद्देश्य के अनुसार बुलाए गए हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में है, “परमेश्वर सब बातों को मिलाकर भलाई उत्पन्न करता है।”
    reason: textual_variant
  - marker: b
    text: या, “उसके उद्देश्य के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἴδαμεν
  choice: हम जानते हैं
  rationale: वर्तमान काल में दृढ़ और साझा ज्ञान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ हल्के संयोजक के रूप में तर्क को आगे बढ़ाता है; विरोध का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: τοῖς ἀγαπῶσι τὸν θεόν
  choice: जो परमेश्वर से प्रेम करते हैं, उनके लिए
  rationale: समूह-सूचक कृदन्त और संप्रदान कारक दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: πάντα
  choice: सब बातें
  rationale: नपुंसकलिंग बहुवचन की व्यापकता बनाए रखता है और केवल घटनाओं या परिस्थितियों तक अर्थ को सीमित नहीं करता।
- source_word: συνεργεῖ
  choice: मिलकर भलाई उत्पन्न करती हैं
  rationale: πάντα को मुख्य कर्ता रखते हुए संयुक्त रूप से शुभ परिणाम की ओर कार्य करने का भाव देता है; मुख्य पाठ में 'परमेश्वर' को कर्ता बनाकर नहीं जोड़ता।
- source_word: εἰς ἀγαθόν
  choice: भलाई उत्पन्न करती हैं
  rationale: εἰς के परिणाम अथवा दिशा के भाव को सहज हिन्दी में व्यक्त करता है; इसे यह कहने तक नहीं बढ़ाता कि हर बात अपने आप में अच्छी है।
- source_word: τοῖς κατὰ πρόθεσιν κλητοῖς οὖσιν
  choice: उनके लिए, जो उद्देश्य के अनुसार बुलाए हुए हैं
  rationale: दूसरे संप्रदान पदबंध को पहले समूह की व्याख्या के रूप में बनाए रखता है और कृदन्तीय वर्णन को सुरक्षित रखता है।
- source_word: πρόθεσιν
  choice: उद्देश्य
  rationale: संदर्भ में सोची-समझी मंशा अथवा योजना का संक्षिप्त और गरिमापूर्ण अनुवाद है; मूल में अनुपस्थित स्वत्ववाचक सर्वनाम मुख्य पाठ में नहीं जोड़ा गया।
- source_word: κλητοῖς
  choice: बुलाए हुए
  rationale: पौलुस के प्रयोग से जुड़ी 'बुलाहट' की धारणा बनाए रखता है और उसे केवल सामान्य निमंत्रण तक सीमित नहीं करता।
theological_decisions:
- issue: συνεργεῖ का निहित अथवा स्पष्ट कर्ता
  choice: मुख्य पाठ में 'सब बातें' को कर्ता रखते हुए 'सब बातें मिलकर भलाई उत्पन्न करती हैं'
  alternative: '''परमेश्वर सब बातों को मिलाकर भलाई उत्पन्न करता है'''
  rationale: दिए गए SBLGNT पाठ में θεός स्पष्ट कर्ता के रूप में नहीं है। इसलिए मुख्य पाठ उसी अस्पष्टता/तनाव को बनाए रखता है, जबकि स्पष्ट-परमेश्वर पाठांतर पादटिप्पणी में दिया गया है।
- issue: κατὰ πρόθεσιν में स्वत्ववाचक सर्वनाम
  choice: '''उद्देश्य के अनुसार'''
  alternative: '''उसके उद्देश्य के अनुसार'' अथवा ''अपने उद्देश्य के अनुसार'''
  rationale: संदर्भ उद्देश्य को परमेश्वर से जोड़ता है, पर यूनानी पदबंध में स्वत्ववाचक सर्वनाम व्यक्त नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया और अर्थ-स्पष्ट विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। 'परमेश्वर', 'भलाई', और 'बुलाए हुए' जैसे परिचित बाइबलीय शब्द बनाए गए हैं। डैश दूसरे समूह को पहले समूह की व्याख्या के रूप में दिखाता है, अलग वर्ग के रूप में नहीं।
