  text: Those who are in the flesh cannot please God[a].
translation:
  language: hi
  text: और जो शरीर में हैं, वे परमेश्वर को प्रसन्न नहीं कर सकते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापी स्वभाव के अधीन।” यूनानी में शाब्दिक रूप से “शरीर में” है; इस प्रसंग में “शरीर” पौलुस का एक प्रमुख शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ... ὄντες
  choice: जो ... हैं
  rationale: लेखयुक्त कृदंत लोगों के एक वर्ग को दर्शाता है; हिंदी में “जो ... हैं” वर्तमान दशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: δέ पिछले कथन से संबद्धता और हल्का विरोध दोनों दिखाता है; हिंदी में “और” प्रसंग का प्रवाह बनाए रखता है।
- source_word: ἐν σαρκὶ
  choice: शरीर के अधीन
  rationale: सिर्फ “शरीर में” हिंदी में भौतिक देह के भीतर होने का भ्रामक अर्थ दे सकता है। “शरीर के अधीन” पौलुस के σάρξ के नैतिक-आध्यात्मिक प्रयोग को स्पष्ट करता है, जबकि मुख्य शब्द “शरीर” और उसकी प्रसंगगत कड़ी बनाए रखता है।
- source_word: θεῷ ἀρέσαι
  choice: परमेश्वर को प्रसन्न
  rationale: हिंदी में यह दत्तिव और ἀρέσκω का सहज तथा सटीक रूप है।
- source_word: οὐ δύνανται
  choice: नहीं कर सकते
  rationale: नकारयुक्त सामर्थ्य को आधुनिक हिंदी में संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: रोमियों 8 में σάρξ का अर्थ
  choice: शरीर के अधीन
  alternative: पापी स्वभाव के अधीन; शरीर में
  rationale: यहाँ σάρξ साधारण भौतिक देह से अधिक व्यापक पौलुसी धारणा है। अनुवाद उसकी सत्ता या क्षेत्र में होने का भाव देता है, पर उसे पूरी तरह “पापी स्वभाव” कहकर धार्मिक अर्थ को अंतिम रूप नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “परमेश्वर” सामान्य बाइबलीय हिंदी के अनुरूप है। फुटनोट चिह्न मुख्य पाठ में वाक्य के अंत में दिया गया है।
