  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ μόνον δέ, ἀλλὰ ⸂καὶ αὐτοὶ⸃ τὴν ἀπαρχὴν τοῦ πνεύματος ἔχοντες ⸂ἡμεῖς καὶ⸃ αὐτοὶ ἐν ἑαυτοῖς στενάζομεν, υἱοθεσίαν ἀπεκδεχόμενοι τὴν ἀπολύτρωσιν τοῦ σώματος ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/023.yaml
  text: And not only that[a], but we ourselves also, who have the firstfruits of the Spirit, even we ourselves groan within ourselves[c][b], eagerly awaiting adoption as sons—the redemption of our bodies.
translation:
  language: hi
  text: और केवल सृष्टि ही नहीं, बल्कि हम स्वयं भी, जिनके पास आत्मा का पहला फल[a] है, अपने भीतर कराहते हैं और उत्सुकता से पुत्रों के रूप में गोद लिए जाने[b] की—अर्थात् अपने शरीरों के छुटकारे[c] की—प्रतीक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “पहले फल के रूप में आत्मा।”
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द में शाब्दिक रूप से पुत्रत्व का भाव है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में शाब्दिक रूप से “हमारे शरीर का” है; एकवचन का प्रयोग प्रत्येक व्यक्ति के शरीर के लिए वितरणात्मक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐ μόνον δέ, ἀλλὰ
  choice: और केवल सृष्टि ही नहीं, बल्कि
  rationale: पिछले पद में वर्णित सृष्टि की ओर संकेत को हिन्दी में स्पष्ट करता है और यूनानी विरोधात्मक संरचना को स्वाभाविक ढंग से रखता है।
- source_word: καὶ αὐτοὶ / ἡμεῖς καὶ αὐτοὶ
  choice: हम स्वयं भी
  rationale: दोहराए गए आत्मवाचक बल को अत्यधिक बोझिल हिन्दी के बिना व्यक्त करता है।
- source_word: τὴν ἀπαρχὴν τοῦ πνεύματος
  choice: आत्मा का पहला फल
  rationale: ἀπαρχή के आरम्भिक अंश अथवा भविष्य की पूर्णता की प्रतिज्ञा-सदृश अर्थ को रखता है; सम्बन्धकारक की सम्भावित व्याख्याएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἐν ἑαυτοῖς στενάζομεν
  choice: अपने भीतर कराहते हैं
  rationale: आन्तरिक स्थान और निकटवर्ती सन्दर्भ में सृष्टि के कराहने से शब्दगत सम्बन्ध दोनों बनाए रखता है।
- source_word: υἱοθεσίαν
  choice: पुत्रों के रूप में गोद लिए जाने
  rationale: υἱοθεσία में निहित पुत्रत्व और उत्तराधिकार की कानूनी छवि को सुरक्षित रखता है; इसका सन्दर्भ सभी विश्वासियों से है।
- source_word: ἀπεκδεχόμενοι
  choice: उत्सुकता से ... प्रतीक्षा करते हैं
  rationale: क्रिया में निहित तीव्र और आशापूर्ण प्रतीक्षा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν ἀπολύτρωσιν
  choice: छुटकारे
  rationale: मूल्य देकर मुक्ति तथा अंतिम उद्धार की पौलुसी धारणा को सामान्य पाठक के लिए समझने योग्य शब्द में रखता है।
- source_word: τοῦ σώματος ἡμῶν
  choice: अपने शरीरों के
  rationale: यूनानी एकवचन का प्रयोग वितरणात्मक है; हिन्दी बहुवचन प्रत्येक विश्वासी के शरीर का आशय स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: υἱοθεσίαν में पुत्रत्व की छवि और सभी विश्वासियों का समावेश
  choice: पुत्रों के रूप में गोद लिए जाने
  alternative: गोद लिए जाने; संतान के रूप में अपनाए जाने
  rationale: पौलुस की कानूनी उत्तराधिकार-सम्बन्धी पुत्रत्व की छवि को मिटाए बिना पद के सभी स्त्री-पुरुष विश्वासियों पर लागू होने को पादटिप्पणी में स्पष्ट किया गया है।
- issue: τὴν ἀπαρχὴν τοῦ πνεύματος में सम्बन्धकारक का अर्थ
  choice: आत्मा का पहला फल
  alternative: पहले फल के रूप में आत्मा
  rationale: मुख्य पाठ यूनानी संरचना को निकटता से रखता है, जबकि आत्मा स्वयं पहले फल हैं—इस सम्भव अपोसिशनल अर्थ को पादटिप्पणी में सुरक्षित करता है।
- issue: υἱοθεσίαν और शरीर के छुटकारे का सम्बन्ध
  choice: गोद लिए जाने की—अर्थात् अपने शरीरों के छुटकारे की—प्रतीक्षा
  alternative: गोद लिए जाने और अपने शरीरों के छुटकारे की प्रतीक्षा
  rationale: दूसरा संज्ञापद पहले की व्याख्या करता है; डैश इस अपोसिशनल सम्बन्ध को दर्शाता है, उन्हें दो अलग घटनाएँ नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली। “कराहते हैं,” “प्रतीक्षा करते हैं,” और “छुटकारा” सामान्य पाठकों के लिए स्पष्ट हैं। मुख्य पाठ में पुत्रत्व और आत्मा के पहले फल से जुड़ी वास्तविक व्याख्यात्मक जटिलता को दबाया नहीं गया है।
