base_translation:
  language: en
  yaml_path: translation/nt/romans/008/002.yaml
  text: For the law of the Spirit of life in Messiah Jesus has set you free from the law of sin and death[a][b][c].
translation:
  language: hi
  text: क्योंकि मसीहा यीशु में जीवन की आत्मा की व्यवस्था[a] ने तुम्हें[b] पाप और मृत्यु की व्यवस्था से स्वतंत्र कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “सिद्धांत”: “जीवन की आत्मा का सिद्धांत।”'
