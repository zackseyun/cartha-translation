  - marker: b
    text: कुछ पाण्डुलिपियों में “तुम्हें” के स्थान पर “मुझे” है।
    reason: textual_variant
lexical_decisions:
- source_word: νόμος
  choice: व्यवस्था
  rationale: दोनों स्थानों पर एक ही शब्द रखकर पौलुस की पुनरावृत्ति और उसके रूपक का तनाव सुरक्षित रखा गया है। ‘सिद्धांत’ अर्थ की एक सम्भव व्याख्या है, पर वह अर्थ-क्षेत्र को समय से पहले सीमित कर देता है।
- source_word: πνεύματος
  choice: आत्मा
  rationale: रोमियों 8 के संदर्भ में यह पवित्र आत्मा की ओर संकेत करता है। देवनागरी में बड़े अक्षर का भेद न होने के कारण मूल शब्द ‘आत्मा’ रखा गया है, बिना ‘पवित्र’ जोड़कर स्रोत का विस्तार किए।
- source_word: ζωῆς
  choice: जीवन
  rationale: सम्बन्धकारक पदबंध ‘जीवन के आत्मा’ को यथासम्भव निकटता से सुरक्षित रखा गया है; ‘जीवनदायी आत्मा’ अधिक स्वाभाविक होता, पर सम्बन्ध की व्याख्या कर देता।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीहा यीशु में
  rationale: Χριστός को उपाधि ‘मसीहा’ के रूप में व्यक्त किया गया है और ἐν के लिए ‘में’ रखकर पौलुस की मसीहा के साथ एकता की भाषा सुरक्षित रखी गई है।
- source_word: ἠλευθέρωσέν
  choice: स्वतंत्र कर दिया है
  rationale: यह पूर्ण किए गए कार्य और उसके वर्तमान परिणाम, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σε
  choice: तुम्हें
  rationale: SBLGNT के मुद्रित पाठ के द्वितीय पुरुष एकवचन σε का अनुसरण किया गया है; ‘मुझे’ वाला प्रसिद्ध पाठांतर पादटिप्पणी में दिया गया है।
- source_word: ἁμαρτίας
  choice: पाप
  rationale: एकवचन बनाए रखा गया है; यहाँ ‘पाप’ अमूर्त वास्तविकता के साथ-साथ दास बनाने वाली शक्ति का बोध भी करा सकता है।
- source_word: θανάτου
  choice: मृत्यु
  rationale: मानक समतुल्य शब्द रखा गया है और ‘पाप और मृत्यु’ का संक्षिप्त संयुक्त पदबंध सुरक्षित है।
theological_decisions:
- issue: πνεύματος पवित्र आत्मा को दर्शाता है या मानवीय आत्मा/आध्यात्मिक सिद्धांत को
  choice: पवित्र आत्मा का संदर्भ समझते हुए ‘आत्मा’
  alternative: मानवीय आत्मा या कोई आध्यात्मिक सिद्धांत
  rationale: रोमियों 8 में शरीर, पाप और मृत्यु के विपरीत जीवन देने वाले परमेश्वर के आत्मा का संदर्भ अधिक स्वाभाविक है; फिर भी अनुवाद में स्रोत से अतिरिक्त ‘पवित्र’ नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘जीवन के आत्मा की व्यवस्था’ सामान्य हिन्दी की अपेक्षा कुछ अधिक स्रोत-सन्निकट है, ताकि सम्बन्धकारक पदबंध और पौलुस का संक्षिप्त धर्मवैचारिक तनाव सुरक्षित रहे। सभी पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के पास दिए गए हैं।
