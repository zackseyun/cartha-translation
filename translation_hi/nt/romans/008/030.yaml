source:
  edition: SBLGNT
  text: οὓς δὲ προώρισεν, τούτους καὶ ἐκάλεσεν· καὶ οὓς ἐκάλεσεν, τούτους καὶ ἐδικαίωσεν· οὓς δὲ ἐδικαίωσεν, τούτους καὶ ἐδόξασεν.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/030.yaml
  text: And those whom he predestined[a], he also called; and those whom he called, he also justified; and those whom he justified[b], he also glorified.
translation:
  language: hi
  text: और जिन्हें उसने पहले से ठहराया[a], उन्हें बुलाया भी; और जिन्हें उसने बुलाया, उन्हें धर्मी भी ठहराया; और जिन्हें उसने धर्मी ठहराया, उन्हें महिमा भी दी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले से नियत किया।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “महिमा दी” भूतकाल में है; कुछ लोग इसे भविष्य की उस महिमा के लिए प्रयुक्त मानते हैं जो इतनी निश्चित है कि उसका वर्णन पहले ही पूरी हो चुकी घटना के रूप में किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: προώρισεν
  choice: पहले से ठहराया
  rationale: यह क्रिया पहले से निर्णय करने या नियत करने का भाव रखती है। ‘पहले से ठहराया’ आधुनिक हिन्दी में स्वाभाविक है और किसी संकीर्ण सम्प्रदायगत व्यवस्था को आरोपित किए बिना यूनानी अर्थ को बनाए रखता है।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: ‘बुलाया’ καλέω का सीधा और प्रचलित हिन्दी प्रतिशब्द है तथा पौलुस की क्रमिक कड़ी को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
- source_word: ἐδικαίωσεν
  choice: धर्मी ठहराया
  rationale: पौलुसी प्रयोग में δικαιόω का न्यायिक भाव प्रमुख है। ‘धर्मी ठहराया’ हिन्दी पाठक के लिए ‘धर्मी किया’ की अपेक्षा अधिक स्पष्ट रूप से घोषणा अथवा निर्णय का अर्थ व्यक्त करता है।
- source_word: ἐδόξασεν
  choice: महिमा दी
  rationale: यूनानी रूप भूतकालिक एओरिस्ट है। ‘महिमा दी’ उसी रूप को स्वाभाविक हिन्दी में बनाए रखता है; सम्भावित भविष्य-संदर्भ को पादटिप्पणी में रखा गया है।
- source_word: οὓς ... τούτους
  choice: जिन्हें ... उन्हें
  rationale: यह हिन्दी सहसम्बन्धी रचना यूनानी की बार-बार दोहराई गई एक ही समूह को सूचित करने वाली संरचना को स्पष्ट और स्वाभाविक ढंग से सुरक्षित रखती है।
- source_word: καὶ
  choice: भी
  rationale: प्रत्येक खंड में καί का योगात्मक बल है। ‘भी’ पहले से ठहराने, बुलाने, धर्मी ठहराने और महिमा देने की क्रमिक कड़ी को दर्शाता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं; इसलिए ‘और’ प्रसंग के प्रवाह के अनुकूल है।
theological_decisions:
- issue: क्या προώρισεν को सम्प्रदायगत निहितार्थ से बचाने के लिए हल्का किया जाए
  choice: पहले से ठहराया
  alternative: पहले से नियत किया
  rationale: यूनानी पाठ पूर्व-निर्धारण व्यक्त करता है। मुख्य पाठ उसी तनाव को रखता है, पर यह नहीं बताता कि वह निर्धारण किस धर्मवैज्ञानिक प्रणाली के अनुसार समझा जाए।
- issue: ἐδόξασεν का अनुवाद भूतकाल में हो या भविष्यकाल में
  choice: महिमा दी
  alternative: महिमा देगा
  rationale: यूनानी में एओरिस्ट सूचक रूप है, इसलिए मुख्य पाठ में भूतकाल रखा गया है। भविष्य की महिमा को इतना निश्चित मानना कि उसे पूर्ण घटना की तरह कहा जाए—यह सम्भव समझ पादटिप्पणी में दी गई है, मुख्य पाठ में आरोपित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जिन्हें…उन्हें’ की पुनरावृत्ति मूल यूनानी की तर्क-श्रृंखला को जानबूझकर सुरक्षित रखती है।
