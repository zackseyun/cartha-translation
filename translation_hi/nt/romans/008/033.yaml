  text: τίς ἐγκαλέσει κατὰ ἐκλεκτῶν θεοῦ; θεὸς ὁ δικαιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/033.yaml
  text: Who will bring a charge against God's chosen ones? It is God who justifies[a][b][c].
translation:
  language: hi
  text: परमेश्वर के चुने हुओं[a] पर कौन आरोप लगाएगा?[b] परमेश्वर ही है जो धर्मी ठहराता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात परमेश्वर द्वारा चुने गए लोग; परंपरागत रूप से: “परमेश्वर के निर्वाचित जन।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “परमेश्वर के चुने हुओं पर कौन अभियोग लगाएगा?”'
    reason: lexical_alternative
  - marker: c
    text: '“धर्मी ठहराता है” में न्यायालय का भाव है: परमेश्वर अनुकूल निर्णय देकर किसी को धर्मी घोषित करता है। यूनानी वाक्य को प्रश्न के रूप में भी विराम दिया जा सकता है: “क्या परमेश्वर, जो धर्मी ठहराता है?”'
    reason: cultural_note
lexical_decisions:
- source_word: τίς
  choice: कौन
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक सर्वनाम है; ‘कौन’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἐγκαλέσει
  choice: आरोप लगाएगा
  rationale: क्रिया का न्यायिक अर्थ किसी के विरुद्ध अभियोग या आरोप लाना है; ‘आरोप लगाएगा’ आधुनिक हिन्दी में सहज रहते हुए न्यायालय-संबंधी भाव बनाए रखता है।
- source_word: κατὰ
  choice: पर
  rationale: आरोप लगाने की हिन्दी अभिव्यक्ति में ‘पर’ स्वाभाविक रूप से उस व्यक्ति-समूह को दर्शाता है जिसके विरुद्ध आरोप है।
- source_word: ἐκλεκτῶν θεοῦ
  choice: परमेश्वर के चुने हुओं
  rationale: विशेषण संज्ञा के रूप में प्रयुक्त है और परमेश्वर द्वारा चुने गए लोगों को सूचित करता है; यह रूप तकनीकी धार्मिक शब्दावली पर निर्भर हुए बिना मूल अर्थ देता है।
- source_word: θεὸς
  choice: परमेश्वर ही है
  rationale: वाक्य के आरम्भ में रखे गए θεός के बल को ‘ही’ द्वारा व्यक्त किया गया है।
- source_word: ὁ δικαιῶν
  choice: जो धर्मी ठहराता है
  rationale: वर्तमान कृदंत परमेश्वर को धर्मी ठहराने वाले के रूप में पहचानता है; ‘धर्मी ठहराता है’ पौलुस के न्यायिक अर्थ को अपेक्षाकृत स्पष्ट और परिचित हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ἐκλεκτῶν को बाद की किसी विशिष्ट धर्मवैज्ञानिक प्रणाली से अनावश्यक रूप से जोड़े बिना प्रस्तुत करना
  choice: चुने हुओं
  alternative: चुनिंदा जनों / निर्वाचितों
  rationale: यूनानी पाठ स्पष्टतः परमेश्वर द्वारा चुने गए लोगों की बात करता है। ‘चुने हुओं’ इस अर्थ को पारदर्शी ढंग से रखता है, पर चुनाव की प्रकृति या आधार को व्याख्या द्वारा तय नहीं करता।
- issue: θεὸς ὁ δικαιῶν की संक्षिप्त और बलयुक्त रचना
  choice: परमेश्वर ही है जो धर्मी ठहराता है
  alternative: परमेश्वर धर्मी ठहराने वाला है / क्या परमेश्वर, जो धर्मी ठहराता है?
  rationale: यह पाठ के स्वाभाविक कथनात्मक विराम और परमेश्वर पर दिए गए बल को बनाए रखता है। साथ ही, मूल की संक्षिप्तता से उत्पन्न संभावित विरामचिह्न-संबंधी अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
- issue: δικαιόω का न्यायिक भाव
  choice: धर्मी ठहराता है
  alternative: निर्दोष घोषित करता है / न्यायसंगत ठहराता है
  rationale: ‘धर्मी ठहराता है’ हिन्दी बाइबलीय प्रयोग में समझने योग्य है और केवल नैतिक परिवर्तन का अर्थ आरोपित किए बिना परमेश्वर के अनुकूल न्यायिक निर्णय को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘आरोप लगाएगा’ न्यायिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘धर्मी ठहराता है’ पौलुस की न्यायालय-संबंधी शब्दावली और धार्मिक गहराई को सुरक्षित रखता है।
