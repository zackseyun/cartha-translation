source:
  edition: SBLGNT
  text: καθὼς γέγραπται ὅτι Ἕνεκεν σοῦ θανατούμεθα ὅλην τὴν ἡμέραν, ἐλογίσθημεν ὡς πρόβατα σφαγῆς.
base_translation:
  language: en
  yaml_path: translation/nt/romans/008/036.yaml
  text: 'Just as it is written: “For your sake we are being put to death all day long[a]; we were counted as sheep for slaughter.”'
translation:
  language: hi
  text: 'जैसा कि लिखा है:


    “तेरे कारण हम दिन भर मारे जाते हैं;

    हम वध के लिए भेड़ों के समान समझे गए[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “माने गए।”
    reason: ἐλογίσθημεν का स्वाभाविक विकल्प; निष्क्रिय ‘reckoned/regarded’ का भाव बनाए रखता है।
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा कि लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का स्वाभाविक और गरिमापूर्ण परिचय है; पूर्णकालीन निष्क्रिय क्रिया के स्थायी प्रभाव को हिंदी की प्रचलित अभिव्यक्ति बनाए रखती है।
- source_word: Ἕνεκεν σοῦ
  choice: तेरे कारण
  rationale: कारण या निमित्त का भाव और परमेश्वर से सीधा एकवचन संबोधन दोनों सुरक्षित रहते हैं।
- source_word: θανατούμεθα
  choice: हमें मार डाला जाता है
  rationale: वर्तमान निष्क्रिय रूप लगातार प्राणघातक व्यवहार को व्यक्त करता है; यह हिंदी में स्पष्ट और प्रभावशाली है।
- source_word: ὅλην τὴν ἡμέραν
  choice: दिन भर
  rationale: समय की पूरी अवधि और निरंतरता को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐλογίσθημεν
  choice: गिने गए
  rationale: λογίζομαι के निष्क्रिय रूप का ‘लेखा जाना/समझा जाना’ वाला भाव संक्षेप में सुरक्षित रहता है।
- source_word: ὡς πρόβατα σφαγῆς
  choice: वध के लिए भेड़ों के समान
  rationale: तुलना तथा वध के लिए नियत भेड़ों की तीखी छवि को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: दुःख के संदर्भ में भजन 44:22 का उद्धरण
  choice: परमेश्वर के लोगों के सामूहिक और लगातार मृत्यु का सामना करने के भाव को यथावत रखा गया है।
  alternative: इसे विशेष रूप से शहादत या किसी एक सिद्धान्त तक सीमित करके अनुवाद करना।
  rationale: यूनानी पाठ उद्धृत विलाप और उसकी तनावपूर्ण छवि को खुला रखता है; अनुवाद को उससे अधिक संकीर्ण धार्मिक अर्थ नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। काव्यात्मक उद्धरण को पंक्तियों में रखा गया है; सीधे ईश्वरीय संबोधन में ‘तेरे’ मूल पाठ की एकवचन निकटता को सुरक्षित रखता है।
