id: 1PE.2.20
reference: 1 Peter 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ποῖον γὰρ κλέος εἰ ἁμαρτάνοντες καὶ κολαφιζόμενοι ὑπομενεῖτε; ἀλλ’ εἰ ἀγαθοποιοῦντες καὶ πάσχοντες ὑπομενεῖτε, τοῦτο χάρις παρὰ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/020.yaml
  text: For what credit is it if[a], when you are sinning and being beaten, you endure? But if, when you are doing good and suffering, you endure, this is grace before God.
translation:
  language: hi
  text: क्योंकि यदि पाप करते हुए तुम मार खाते हो और धीरज से सहते हो, तो इसमें क्या श्रेय है? पर यदि भलाई करते हुए तुम कष्ट सहते हो और धीरज से सहते हो, तो यह परमेश्वर की दृष्टि में सराहनीय है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह परमेश्वर की कृपादृष्टि पाता है”; शाब्दिक रूप से, “यह परमेश्वर के यहाँ अनुग्रह है।”
    reason: χάρις παρὰ θεῷ का अर्थ इस प्रसंग में परमेश्वर की अनुकूल स्वीकृति या सराहना है; ‘अनुग्रह’ शाब्दिक विकल्प है, लेकिन मुख्य पाठ में उसे तकनीकी धार्मिक अर्थ के रूप में नहीं थोपा गया है।
lexical_decisions:
- source_word: κλέος
  choice: श्रेय
  rationale: इस आलंकारिक प्रश्न में शब्द का अर्थ यश या ख्याति नहीं, बल्कि किसी काम के लिए मिलने वाला श्रेय या प्रशंसा है। ‘श्रेय’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἁμαρτάνοντες
  choice: पाप करते हुए
  rationale: यह कृदन्त पाप करने की क्रिया को सीधे व्यक्त करता है और सामान्य ‘गलत काम करने’ की अपेक्षा मूल का नैतिक-धार्मिक बल बनाए रखता है।
- source_word: κολαφιζόμενοι
  choice: मार खाते हो
  rationale: मूल क्रिया शारीरिक रूप से प्रहार किए जाने, विशेषतः घूँसे मारे जाने, का संकेत देती है। ‘मार खाते हो’ इसे साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ὑπομενεῖτε
  choice: धीरज धरते हो
  rationale: यह कठिनाई के अधीन दृढ़ बने रहने को दर्शाता है। दोनों उपवाक्यों में यही अभिव्यक्ति दोहराकर मूल की समानांतरता रखी गई है।
- source_word: ἀγαθοποιοῦντες
  choice: भलाई करते हुए
  rationale: यह सही अथवा हितकारी काम करने को दर्शाता है; ‘भलाई करना’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: πάσχοντες
  choice: दुःख सहते हो
  rationale: शब्द व्यापक रूप से कष्ट उठाने को दर्शाता है। इसे केवल दुर्व्यवहार तक सीमित न करके मूल का व्यापक अर्थ रखा गया है।
- source_word: χάρις
  choice: अनुग्रह की बात
  rationale: ‘अनुग्रह’ χάρις की धार्मिक और शाब्दिक प्रतिध्वनि बनाए रखता है; ‘की बात’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है, जबकि पादटिप्पणी प्रसंगगत ‘कृपादृष्टि/सराहना’ का अर्थ बताती है।
- source_word: παρὰ θεῷ
  choice: परमेश्वर के सामने
  rationale: παρά और चतुर्थी यहाँ परमेश्वर की उपस्थिति, दृष्टि या मूल्यांकन के संबंध को दर्शाते हैं। ‘परमेश्वर के सामने’ इस संबंध को संक्षिप्त रूप में बनाए रखता है।
theological_decisions:
- issue: अन्तिम वाक्यांश में χάρις का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर के सामने अनुग्रह की बात’
  alternative: ‘इससे परमेश्वर की कृपादृष्टि होती है’ अथवा ‘यह परमेश्वर की दृष्टि में सराहनीय है’
  rationale: इस प्रसंग में χάρις परमेश्वर की कृपादृष्टि या स्वीकृति को सूचित कर सकता है, पर ‘अनुग्रह’ इसकी व्यापक धार्मिक प्रतिध्वनि भी बनाए रखता है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अर्थ-व्याप्ति को बिना किसी एक अर्थ पर अनुचित रूप से निर्णय किए सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों शर्तीय उपवाक्यों में ‘करते हुए… सहते/खाते हो और धीरज धरते हो’ की समानांतर बनावट मूल के कृदन्तों और दोहराव को यथासम्भव सुरक्षित रखती है।
