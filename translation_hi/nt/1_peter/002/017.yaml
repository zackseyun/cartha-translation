id: 1PE.2.17
reference: 1 Peter 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πάντας τιμήσατε, τὴν ἀδελφότητα ⸀ἀγαπᾶτε, τὸν θεὸν φοβεῖσθε, τὸν βασιλέα τιμᾶτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/017.yaml
  text: Honor everyone[a], love the brotherhood, fear God[b], honor the king.
translation:
  language: hi
  text: 'सब लोगों का आदर करो; विश्वासी भाई-बहनों के समुदाय[a] से प्रेम करो; परमेश्वर का भय मानो; राजा[b] का आदर करो।


    [a] यूनानी शब्द का शाब्दिक अर्थ “भाईचारा” है; यहाँ इसका आशय साथी विश्वासियों के समुदाय से है।

    [b] या “सम्राट”; यूनानी शब्द “राजा” है, पर पतरस के रोमी संदर्भ में संभवतः सम्राट का उल्लेख है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का शाब्दिक अर्थ “भाईचारा” है; यहाँ इसका आशय साथी विश्वासियों के समुदाय से है।
    reason: lexical_alternative
  - marker: b
    text: या “सम्राट”; यूनानी शब्द “राजा” है, पर पतरस के रोमी संदर्भ में संभवतः सम्राट का उल्लेख है।
    reason: alternative_reading
lexical_decisions:
- source_word: πάντας
  choice: सब लोगों का
  rationale: यह सर्वसमावेशी बहुवचन है। “सब लोगों का” आधुनिक हिन्दी में स्वाभाविक है और इसके सार्वभौमिक विस्तार को स्पष्ट रखता है।
- source_word: τιμήσατε / τιμᾶτε
  choice: आदर करो
  rationale: दोनों स्थानों पर एक ही यूनानी क्रिया τιμάω है। समान हिन्दी अनुवाद पुनरावृत्ति को सुरक्षित रखता है और केवल सामान्य सम्मान से अधिक गंभीर भाव व्यक्त करता है।
- source_word: τὴν ἀδελφότητα
  choice: विश्वासी भाई-बहनों के समुदाय
  rationale: यह शब्द साथी विश्वासियों के सामुदायिक भाईचारे को दर्शाता है। केवल “भाईचारा” हिन्दी में एक भावना भी समझा जा सकता है, इसलिए मुख्य पाठ में सामुदायिक आशय स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ἀγαπᾶτε
  choice: प्रेम करो
  rationale: यह ἀγαπάω का वर्तमान आज्ञार्थक रूप है। “प्रेम करो” मानक और स्वाभाविक अनुवाद है; निरंतरता का पक्ष हिन्दी आज्ञा में संदर्भतः निहित रह सकता है।
- source_word: τὸν θεὸν
  choice: परमेश्वर का
  rationale: φοβεῖσθε के कर्म के रूप में सीधा और प्रतिष्ठित हिन्दी समतुल्य।
- source_word: φοβεῖσθε
  choice: भय मानो
  rationale: यह φοβέομαι की शक्ति को बनाए रखता है। “श्रद्धा करो” जैसे नरम विकल्प मूल की धार्मिक गंभीरता और राजा के लिए प्रयुक्त “आदर” से इसके अंतर को कम कर सकते हैं।
- source_word: τὸν βασιλέα
  choice: राजा
  rationale: βασιλεύς का प्रत्यक्ष अर्थ “राजा” है। रोमी संदर्भ में इसका संकेत सम्राट की ओर हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर और नागरिक शासक के प्रति अपेक्षित प्रतिक्रिया का अंतर
  choice: परमेश्वर के लिए “भय मानो” और राजा के लिए “आदर करो”
  alternative: परमेश्वर के लिए “श्रद्धा रखो” और राजा के लिए “सम्मान करो”
  rationale: मूल पाठ सबके आदर, विश्वासी समुदाय के प्रेम, परमेश्वर के भय और राजा के आदर में जानबूझकर भेद करता है। चुना हुआ अनुवाद परमेश्वर और शासक को एक ही स्तर पर रखे बिना इस क्रम और धार्मिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। चारों आज्ञाओं की संक्षिप्त समानांतर संरचना को अर्धविरामों द्वारा सुरक्षित किया गया है। “भय मानो” हिन्दी बाइबलीय प्रयोग में स्वाभाविक है, जबकि “विश्वासी भाई-बहनों के समुदाय” सामुदायिक अर्थ को स्पष्ट करता है।
