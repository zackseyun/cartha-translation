language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἦτε γὰρ ὡς πρόβατα ⸀πλανώμενοι, ἀλλὰ ἐπεστράφητε νῦν ἐπὶ τὸν ποιμένα καὶ ἐπίσκοπον τῶν ψυχῶν ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/025.yaml
  text: For you were like sheep going astray[c][b][a], but now you have returned to the Shepherd and Overseer of your souls.
translation:
  language: hi
  text: क्योंकि तुम भटक रही भेड़ों के समान थे[a], पर अब तुम अपनी आत्माओं के चरवाहे और देखरेख करनेवाले[c] के पास लौट आए हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भटक रहे थे”; अथवा, “भटकाए जा रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: या, “वापस मुड़े हो।” यूनानी क्रियारूप का अर्थ “लौटाए गए हो” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: “देखरेख करनेवाले” के लिए “निरीक्षक” या “रखवाला” भी संभव है; परंपरागत रूप से, “बिशप।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦτε γὰρ
  choice: क्योंकि तुम ... थे
  rationale: γάρ पिछले कथन का आधार बताता है, इसलिए ‘क्योंकि’ स्वाभाविक है; अपूर्णकाल ἦτε उनकी पिछली अवस्था को व्यक्त करता है।
- source_word: ὡς πρόβατα
  choice: भेड़ों के समान
  rationale: ὡς तुलना सूचित करता है और πρόβατα का बहुवचन ‘भेड़ों’ से स्पष्ट होता है।
- source_word: πλανώμενοι
  choice: भटकती हुई
  rationale: यह चयन भेड़ों के रूपक को बनाए रखता है और किसी बाहरी कर्ता को अनावश्यक रूप से निश्चित नहीं करता; कर्मवाच्य अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: ἀλλὰ ἐπεστράφητε νῦν
  choice: पर अब तुम ... लौट आए हो
  rationale: ἀλλά स्पष्ट विरोध दिखाता है। ἐπεστράφητε रूपतः कर्मवाच्य है, पर यहाँ मध्यवाच्य/अकर्मक अर्थ में भी समझा जा सकता है; ‘लौट आए हो’ सहज हिन्दी में पूर्ण परिवर्तन और उसकी वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: ἐπὶ τὸν ποιμένα
  choice: चरवाहे के पास
  rationale: ποιμήν का सीधा और रूपकानुकूल अर्थ ‘चरवाहा’ है। ἐπί + कर्मकारक यहाँ व्यक्ति की ओर लौटने को दर्शाता है, जिसे हिन्दी में ‘के पास’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ ἐπίσκοπον
  choice: और देखरेख करनेवाले
  rationale: ἐπίσκοπος यहाँ उस व्यक्ति को बताता है जो निगरानी और देखभाल करता है। यह पदनाम का अर्थ स्पष्ट करता है और बाद की किसी विशिष्ट कलीसियाई पद-व्यवस्था को पाठ में नहीं लाता।
- source_word: τῶν ψυχῶν ὑμῶν
  choice: अपनी आत्माओं
  rationale: ψυχή के अर्थ-क्षेत्र में आत्मा, जीवन और स्वयं व्यक्ति आते हैं। ‘आत्माओं’ पारंपरिक और शाब्दिक निकटता बनाए रखता है; सम्बन्धवाचक रचना को स्वाभाविक हिन्दी में ‘अपनी’ से व्यक्त किया गया है।
theological_decisions:
- issue: ἐπίσκοπος को मसीह के पदनाम के रूप में प्रस्तुत करना
  choice: देखरेख करनेवाला
  alternative: निरीक्षक; रखवाला; बिशप
  rationale: ‘देखरेख करनेवाला’ निगरानी के साथ देखभाल का भाव भी रखता है और ‘बिशप’ से जुड़ी बाद की संस्थागत धारणाओं को नहीं थोपता।
- issue: ἐπεστράφητε की वाच्यगत अस्पष्टता
  choice: लौट आए हो
  alternative: लौटाए गए हो; फिर गए हो
  rationale: रूप कर्मवाच्य है, किंतु क्रिया मध्यवाच्य/अकर्मक अर्थ भी दे सकती है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया है और सम्भावित कर्मवाच्य अर्थ पादटिप्पणी में सुरक्षित है, जिससे ईश्वरीय क्रिया और मानवीय प्रत्युत्तर के सम्बन्ध को अनावश्यक रूप से तय नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भटकती हुई भेड़ों’ से मूल चरवाही-रूपक सुरक्षित है। ‘देखरेख करनेवाला’ सामान्य पाठक के लिए अर्थपूर्ण है और अनावश्यक साम्प्रदायिक पदावली से बचता है।
