reference: 1 Peter 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λίθος προσκόμματος καὶ πέτρα σκανδάλου· οἳ προσκόπτουσιν τῷ λόγῳ ἀπειθοῦντες· εἰς ὃ καὶ ἐτέθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/008.yaml
  text: and, “a stone of stumbling and a rock of offense.” They stumble because they disobey the word, and to this they were also appointed.
translation:
  language: hi
  text: 'और,

    “ठोकर लगने का पत्थर

    और गिरा देने वाली चट्टान।”

    वे वचन की अवज्ञा करने के कारण ठोकर खाते हैं; और इसी के लिए वे ठहराए भी गए थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λίθος προσκόμματος
  choice: ठोकर लगने का पत्थर
  rationale: यशायाह 8:14 की प्रतिध्वनि और ठोकर के रूपक को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πέτρα σκανδάλου
  choice: गिरा देने वाली चट्टान
  rationale: σκανδάλου के यहाँ पतन या फँसने के कारण का भाव है; यह पद के समानांतर काव्यात्मक बिंब को सहज हिन्दी में व्यक्त करता है।
- source_word: τῷ λόγῳ ἀπειθοῦντες
  choice: वचन की अवज्ञा करने के कारण
  rationale: ἀπειθέω केवल बौद्धिक अविश्वास नहीं, बल्कि न मानने और आज्ञा न मानने का भाव रखता है; हिन्दी में 'अवज्ञा' इस संबंध को संक्षेप में व्यक्त करती है।
- source_word: εἰς ὃ
  choice: इसी के लिए
  rationale: यूनानी संबंधवाचक पदबंध का पूर्वगामी व्याकरणतः अस्पष्ट है; यह अनुवाद उस अस्पष्टता को पूरी तरह खोले बिना निकटता से रखता है।
- source_word: ἐτέθησαν
  choice: ठहराए भी गए थे
  rationale: τίθημι के निष्क्रिय रूप में निर्धारित या नियुक्त किए जाने का भाव है; 'ठहराए गए' धार्मिक अर्थ को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: लोग किस बात के लिए ठहराए गए थे
  choice: “इसी के लिए वे ठहराए भी गए थे” के द्वारा स्रोत की अस्पष्टता बनाए रखी गई
  alternative: “वचन की अवज्ञा करने के लिए वे ठहराए गए थे” या “ठोकर खाने के लिए वे ठहराए गए थे”
  rationale: εἰς ὃ का संकेत निकटवर्ती ठोकर खाने की घटना, अवज्ञा, अथवा व्यापक परिणाम की ओर समझा जा सकता है। किसी एक व्याख्या को मूल पाठ से अधिक निश्चित बनाना उचित नहीं।
- issue: अवज्ञा और ठोकर का संबंध
  choice: अवज्ञा को ठोकर खाने का कारण बताया गया
  alternative: “वे वचन पर ठोकर खाते हुए अवज्ञा करते हैं”
  rationale: वाक्य-विन्यास में ἀπειθοῦντες प्रसंगतः उनके ठोकर खाने की व्याख्या करता है; फिर भी नियुक्ति किस तत्व से जुड़ती है, उसे खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सुबोध रूप अपनाया गया है। उद्धृत पंक्तियों का काव्यात्मक समानांतर विन्यास रखा गया है। “वचन,” “अवज्ञा,” और “ठहराए गए” जैसे शब्द सामान्य बाइबलीय प्रयोग से परिचित हैं, पर किसी विशिष्ट सम्प्रदायगत निष्कर्ष को आरोपित नहीं करते।
