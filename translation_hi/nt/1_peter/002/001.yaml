  text: इसलिए, हर प्रकार की दुर्भावना, हर प्रकार का छल, पाखंड के सभी रूप, ईर्ष्या के सभी रूप और दूसरों के विरुद्ध हर तरह की बुरी बातें कहना[a] त्यागकर,
