lexical_decisions:
- source_word: Ἀποθέμενοι
  choice: उतार फेंककर
  rationale: वस्त्र उतारने की मूल छवि और मुख्य आज्ञा (पद 2) से पहले की तैयारी—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। कृदंत को स्वतंत्र आज्ञा नहीं बनाया गया।
- source_word: οὖν
  choice: इसलिए
  rationale: यह 1:22–25 से निकलने वाले निष्कर्ष और वर्तमान उपदेश के बीच संबंध स्पष्ट करता है।
- source_word: πᾶσαν κακίαν
  choice: हर प्रकार की दुर्भावना
  rationale: इस पारस्परिक दुर्गुण-सूची में κακία का आशय दूसरों के प्रति बुरी भावना से है; 'हर प्रकार की' एकवचन πᾶσαν की व्यापकता व्यक्त करता है।
- source_word: πάντα δόλον
  choice: हर प्रकार का छल
  rationale: δόλος की कपटपूर्ण धोखे की धारणा को साधारण आधुनिक हिन्दी में रखता है और πάντα की व्यापकता बनाए रखता है।
- source_word: ὑποκρίσεις
  choice: कपट के सभी रूप
  rationale: यूनानी बहुवचन को हिन्दी में अस्वाभाविक 'कपटों' के बजाय विभिन्न रूपों/कृत्यों के रूप में व्यक्त करता है।
- source_word: φθόνους
  choice: ईर्ष्या के सभी रूप
  rationale: बहुवचन की विविधता को स्वाभाविक हिन्दी में बनाए रखता है; 'जलन' की अपेक्षा 'ईर्ष्या' अधिक गरिमामय और सटीक है।
- source_word: πάσας καταλαλιάς
  choice: दूसरों की हर बुराई करना
  rationale: καταλαλιά दूसरों के विरुद्ध हानि पहुँचाने वाली वाणी का व्यापक संकेत देता है; यह हिन्दी कानूनी अर्थ तक सीमित 'मानहानि' से अधिक व्यापक है।
theological_decisions:
- issue: दुर्गुण-सूची का नैतिक दायरा
  choice: प्रत्येक दुर्गुण को ठोस पारस्परिक आचरण के रूप में अनूदित किया गया, बिना धर्मसैद्धांतिक विस्तार के।
  alternative: κακία को व्यापक 'दुष्टता' और καταλαλιάς को अधिक संकीर्ण 'निंदा' कहना।
  rationale: संदर्भ विश्वासियों के पारस्परिक जीवन पर केंद्रित है; फिर भी यूनानी पदों की व्यापकता को अनावश्यक रूप से सीमित नहीं किया गया।
- issue: Ἀποθέμενοι का मुख्य आज्ञा से संबंध
  choice: इसे 'उतार फेंककर' के रूप में अधीनस्थ रखा गया है, जिससे वाक्य पद 2 की मुख्य आज्ञा की ओर बढ़ता है।
  alternative: इसे स्वतंत्र आज्ञा 'उतार फेंको' बनाना।
  rationale: यूनानी में यह कृदंत है, मुख्य क्रिया नहीं; अनुवाद उसी वाक्यगत तनाव और तैयारी के भाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय किंतु सामान्य पाठक के लिए स्पष्ट। यूनानी कृदंत के कारण पद को अल्पविराम पर खुला रखा गया है, क्योंकि मुख्य आज्ञा पद 2 में आती है। बहुवचनों को अस्वाभाविक शब्द-रूपों के बजाय 'सभी रूप' से व्यक्त किया गया है।
