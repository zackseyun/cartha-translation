    reason: lexical_alternative
  - marker: b
    text: या, “सर्वोच्च के रूप में” या “ऊँचे पद वाले के रूप में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑποτάγητε
  choice: अधीन हो जाओ
  rationale: आज्ञार्थक रूप का स्वाभाविक और स्पष्ट हिन्दी अनुवाद; स्वेच्छापूर्वक अधीनता के आह्वान को व्यक्त करता है।
- source_word: πάσῃ
  choice: हर
  rationale: एकवचन दत्तिव के साथ वितरणात्मक अर्थ व्यक्त करता है।
- source_word: ἀνθρωπίνῃ κτίσει
  choice: मानवीय नागरिक संस्था
  rationale: κτίσις का मूल अर्थ ‘सृष्टि/रचना’ है, पर राजा और आगे राज्यपालों के उल्लेख से यहाँ मानव समाज की नागरिक संस्थाएँ या व्यवस्थाएँ अभिप्रेत हैं। ‘नागरिक’ संदर्भ स्पष्ट करता है, जबकि ‘मानवीय’ मूल विशेषण को बनाए रखता है।
- source_word: διὰ τὸν κύριον
  choice: प्रभु के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या प्रेरणा बताता है। यह वाक्यांश ‘प्रभु के लिए’ की तुलना में कारणगत अर्थ अधिक सीधे रखता है।
- source_word: κύριον
  choice: प्रभु
  rationale: मूल पाठ केवल उपाधि देता है; ‘यीशु’ या ‘परमेश्वर’ जोड़कर संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: εἴτε βασιλεῖ
  choice: चाहे राजा के
  rationale: εἴτε अगले पद तक चलने वाली ‘चाहे...चाहे’ संरचना आरम्भ करता है; βασιλεύς का व्यापक शाब्दिक अर्थ ‘राजा’ रखा गया है।
- source_word: ὡς ὑπερέχοντι
  choice: जो सर्वोच्च अधिकारी है
  rationale: ὑπερέχω यहाँ उच्च पद या प्रधान अधिकार दर्शाता है। ‘अधिकारी’ कार्यगत अर्थ स्पष्ट करता है, जबकि ‘सर्वोच्च’ सम्भव शाब्दिक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ἀνθρωπίνῃ κτίσει में नागरिक सत्ता का स्वरूप
  choice: ‘मानवीय नागरिक संस्था’
  alternative: ‘हर मानवीय रचना’ या ‘मनुष्य की हर व्यवस्था’
  rationale: आगे राजा और राज्यपालों के उदाहरण नागरिक संस्थागत संदर्भ को स्पष्ट करते हैं। अनुवाद प्रत्येक व्यक्ति के अधीन होने का भ्रामक अर्थ टालता है, पर ‘मानवीय’ शब्द द्वारा मूल की असामान्य अभिव्यक्ति को पूरी तरह छिपाता नहीं।
- issue: κύριον का संदर्भ
  choice: केवल ‘प्रभु’
  alternative: ‘प्रभु यीशु’ या ‘परमेश्वर’
  rationale: यूनानी पाठ संदर्भ को स्पष्ट रूप से सीमित नहीं करता; इसलिए उसकी सम्भावित धार्मिक व्यापकता सुरक्षित रखी गई है।
- issue: ὑπερέχοντι में अधिकार की सीमा
  choice: ‘सर्वोच्च अधिकारी’ और पादटिप्पणी में वैकल्पिक अर्थ
  alternative: ‘प्रधानता रखनेवाला’ या ‘ऊँचे पद पर स्थित’
  rationale: राजा की नागरिक पद-प्रधानता व्यक्त की गई है; इसे परम या असीम धार्मिक सर्वोच्चता का दावा न समझा जाए, इसलिए पादटिप्पणी विकल्प देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। ‘अधीन हो जाओ’ सामान्य पाठक के लिए स्पष्ट है। ‘मानवीय नागरिक संस्था’ कुछ औपचारिक है, पर मूल के असामान्य पदबंध और तत्काल राजनीतिक संदर्भ—दोनों को साथ रखता है। पद अगले वचन में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
