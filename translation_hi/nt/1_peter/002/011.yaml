  text: Ἀγαπητοί, παρακαλῶ ὡς παροίκους καὶ παρεπιδήμους ἀπέχεσθαι τῶν σαρκικῶν ἐπιθυμιῶν, αἵτινες στρατεύονται κατὰ τῆς ψυχῆς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/011.yaml
  text: Beloved[a], I urge you as sojourners and exiles to abstain from fleshly desires[c][b], which wage war against the soul.
translation:
  language: hi
  text: हे प्रिय जनो, मैं तुमसे आग्रह करता हूँ कि परदेशियों और अस्थायी निवासियों के रूप में शरीर की अभिलाषाओं से दूर रहो; ये आत्मा[a] के विरुद्ध युद्ध करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा’ का अनुवाद ‘जीवन’ या ‘स्वयं’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: हे प्रिय जनो
  rationale: बहुवचन संबोधन का स्नेहपूर्ण भाव बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: παρακαλῶ
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: यहाँ शब्द गंभीर और आत्मीय प्रोत्साहन व्यक्त करता है; ‘आग्रह’ न तो केवल निवेदन है, न अत्यधिक तकनीकी उपदेश।
- source_word: ὡς παροίκους καὶ παρεπιδήμους
  choice: परदेशियों और प्रवासियों के समान
  rationale: दोनों जुड़े हुए शब्द गैर-स्थायी निवास और अपने वास्तविक घर से बाहर रहने की स्थिति पर बल देते हैं; ‘के समान’ ὡς की तुलना/पहचान की खुली प्रकृति को सुरक्षित रखता है।
- source_word: ἀπέχεσθαι
  choice: दूर रहो
  rationale: निरंतर स्वयं को अलग रखने का आह्वान सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: τῶν σαρκικῶν ἐπιθυμιῶν
  choice: दैहिक अभिलाषाओं से
  rationale: ‘दैहिक’ σάρξ-सम्बन्धी रूपक को बनाए रखता है, जबकि ‘पापी अभिलाषाएँ’ कहकर उसकी व्याख्या को पहले से निश्चित नहीं करता; ‘अभिलाषाएँ’ संदर्भ की नैतिक तीव्रता व्यक्त करती हैं, पर अर्थ को केवल यौन वासना तक सीमित नहीं करतीं।
- source_word: αἵτινες στρατεύονται
  choice: ये अभिलाषाएँ ... युद्ध करती हैं
  rationale: सम्बन्धवाचक उपवाक्य और सजीव सैन्य रूपक दोनों स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहते हैं।
- source_word: κατὰ τῆς ψυχῆς
  choice: प्राण के विरुद्ध
  rationale: ‘प्राण’ यहाँ व्यक्ति के जीवन/अंतरात्मिक अस्तित्व की व्यापकता को रखता है और केवल मनोवैज्ञानिक ‘मन’ तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: σαρκικῶν का नैतिक संदर्भ में अनुवाद
  choice: दैहिक
  alternative: शरीर की; पापपूर्ण
  rationale: ‘दैहिक’ मूल देह/शरीर-सम्बन्धी रूपक और उसकी नैतिक तनातनी को बचाता है। ‘पापपूर्ण’ अधिक व्याख्यात्मक है, जबकि ‘शारीरिक’ आधुनिक हिन्दी में केवल भौतिक आवश्यकताओं का भ्रम दे सकता है।
- issue: ψυχή का अर्थ
  choice: प्राण
  alternative: आत्मा; जीवन; स्वयं
  rationale: इस प्रसंग में ψυχή पूरे व्यक्ति के जीवन और भीतरी अस्तित्व की ओर संकेत कर सकता है। ‘प्राण’ इस व्यापकता को बनाए रखता है; पाठ पर कठोर शरीर–आत्मा द्वैत आरोपित नहीं किया गया।
- issue: पाठकों की बाहरी/अस्थायी स्थिति
  choice: परदेशियों और प्रवासियों के समान
  alternative: विदेशियों और अस्थायी निवासियों के समान; निर्वासितों के समान
  rationale: दोनों मूल शब्दों का युग्म पाठकों के वर्तमान समाज/युग में पूर्णतः घर का न होने का भाव देता है। ‘निर्वासित’ अनिवार्य निष्कासन का अतिरिक्त अर्थ ला सकता है, जो प्रत्येक शब्द में आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय संबोधन, स्पष्ट आज्ञार्थक शैली और मूल सैन्य रूपक को बनाए रखते हुए गरिमापूर्ण सामान्य शब्दावली। मुख्य पाठ में ‘दैहिक’ स्रोत-रूपक को सुरक्षित रखता है; ψυχή की वास्तविक अर्थ-व्याप्ति को पादटिप्पणी में दर्शाया गया है।
