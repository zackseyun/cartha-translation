  text: τοῦτο γὰρ χάρις εἰ διὰ συνείδησιν θεοῦ ὑποφέρει τις λύπας πάσχων ἀδίκως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/019.yaml
  text: 'For this is grace: if someone endures sorrows while suffering unjustly because of consciousness of God[a][b][c].'
translation:
  language: hi
  text: क्योंकि यह अनुग्रह की बात है कि यदि कोई परमेश्वर के प्रति सचेत होने के कारण[a] अन्याय सहते हुए दुःखों को धीरज से सहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को ध्यान में रखकर” अथवा “परमेश्वर के प्रति विवेक के कारण।”
    reason: lexical_alternative
  - marker: b
    text: “अनुग्रह की बात” का अर्थ यहाँ “प्रशंसनीय बात” या “कृपापात्र बात” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह की बात
  rationale: यहाँ χάρις विधेयात्मक और मूल्यांकनसूचक है। केवल ‘अनुग्रह’ हिंदी में अस्पष्ट या अस्वाभाविक होता; ‘अनुग्रह की बात’ मूल शब्द का धार्मिक संबंध बनाए रखते हुए किसी प्रशंसनीय अथवा कृपापात्र बात का भाव देता है।
- source_word: διὰ συνείδησιν θεοῦ
  choice: परमेश्वर का ध्यान रखते हुए
  rationale: संक्षिप्त यूनानी पदबंध परमेश्वर के प्रति सचेत रहने या उसके सामने विवेक रखने का भाव दे सकता है। यह चयन स्वाभाविक हिंदी में परमेश्वर-केंद्रित प्रेरणा व्यक्त करता है, जबकि ‘विवेक’ वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ὑποφέρει
  choice: धीरज धरता है
  rationale: यहाँ क्रिया कठिनाई के नीचे टिके रहने और सहनशील बने रहने को व्यक्त करती है; ‘धीरज धरता है’ आधुनिक हिंदी में यही सक्रिय सहनशीलता स्पष्ट करता है।
- source_word: λύπας
  choice: दुःख
  rationale: बहुवचन λύπας पीड़ा, क्लेश और शोक के अनुभवों को समेटता है। हिंदी में समूहवाचक ‘दुःख’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: πάσχων ἀδίκως
  choice: अन्याय से दुःख सहता
  rationale: यह प्रयोग अनुचित या अन्यायपूर्ण व्यवहार के कारण कष्ट उठाने की परिस्थिति बताता है। ‘अन्याय से’ इस भाव को संक्षेप और सहजता से व्यक्त करता है।
- source_word: τις
  choice: कोई
  rationale: अनिश्चित एकवचन को बिना अनावश्यक लिंग-निर्धारण के स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τοῦτο γὰρ
  choice: क्योंकि यह
  rationale: ‘क्योंकि’ पूर्ववर्ती विचार से व्याख्यात्मक संबंध बनाए रखता है और ‘यह’ आगे आने वाली शर्त की ओर संकेत करता है।
theological_decisions:
- issue: संदर्भ में χάρις का अर्थ
  choice: ‘अनुग्रह की बात’ रखा गया है।
  alternative: ‘यह प्रशंसनीय है’; ‘यह कृपापात्र है’; ‘इससे कृपा मिलती है’
  rationale: मूल में इस खंड के भीतर ‘परमेश्वर के सामने’ स्पष्ट रूप से नहीं जोड़ा गया। चुना हुआ रूप χάρις से संबंध बचाता है और ऐसी बात के प्रशंसनीय या कृपापात्र होने का संकेत देता है, बिना किसी अनकहे कर्ता या प्रतिफल को जोड़ने के।
- issue: συνείδησις θεοῦ का संबंध
  choice: परमेश्वर के प्रति सचेत रहने के अर्थ में ‘परमेश्वर का ध्यान रखते हुए’।
  alternative: ‘परमेश्वर के प्रति विवेक के कारण’; ‘परमेश्वर के सामने अपने विवेक के कारण’
  rationale: θεοῦ को परमेश्वर की ओर उन्मुख चेतना या विवेक के रूप में समझा गया है। मुख्य पाठ स्वाभाविक हिंदी रखता है, और विवेक-संबंधी वास्तविक अर्थ-संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर का ध्यान रखते हुए’ को ‘धीरज धरता है’ से पहले रखा गया है, ताकि कारण का संबंध अन्यायपूर्ण दुःख से नहीं बल्कि सहनशीलता से स्पष्ट रहे।
