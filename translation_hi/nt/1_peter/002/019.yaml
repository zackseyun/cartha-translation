review_pass:
  verdict: revise
  source_fidelity: Draft correctly retains the evaluative use of χάρις, the God-directed motive in διὰ συνείδησιν θεοῦ, and the generic singular. However, “अन्याय से दुःख सहता और धीरज धरता है” makes the two Greek expressions sound like an unnecessarily duplicated coordination and weakens the participial relation of πάσχων ἀδίκως to ὑποφέρει λύπας.
  naturalness: The proposed revision is fluent modern Hindi. It expresses the motive as a cause of endurance and renders the participle naturally as the circumstance in which the griefs are endured.
  terminology: “अनुग्रह की बात” appropriately preserves the lexical and theological resonance of χάρις without supplying “परमेश्वर के सामने.” “परमेश्वर के प्रति सचेत होने के कारण” is a clear main-text rendering of the difficult phrase, while the conscience-oriented alternative remains footnoted.
  issues:
  - severity: medium
    issue: The main clause redundantly coordinates suffering and endurance.
    rationale: λύπας is the object of ὑποφέρει, while πάσχων ἀδίκως is a circumstantial participle. “दुःख सहता और धीरज धरता है” can suggest two separate actions and repeats the same idea. Rendering the unjust suffering with “अन्याय सहते हुए” preserves the Greek relationship.
  - severity: low
    issue: The causal force of διὰ is better stated explicitly.
    rationale: “परमेश्वर का ध्यान रखते हुए” is possible, but “परमेश्वर के प्रति सचेत होने के कारण” more directly represents διὰ while retaining the intended God-directed awareness.
  revised_text: क्योंकि यह अनुग्रह की बात है कि यदि कोई परमेश्वर के प्रति सचेत होने के कारण[a] अन्याय सहते हुए दुःखों को धीरज से सहता है।[b]
