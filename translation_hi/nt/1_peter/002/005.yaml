source:
  edition: SBLGNT
  text: καὶ αὐτοὶ ὡς λίθοι ζῶντες οἰκοδομεῖσθε οἶκος πνευματικὸς ⸀εἰς ἱεράτευμα ἅγιον, ἀνενέγκαι πνευματικὰς θυσίας ⸀εὐπροσδέκτους θεῷ διὰ Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/005.yaml
  text: you yourselves also[a], as living stones, are being built up as a spiritual house into a holy priesthood[d][c][b], to offer spiritual sacrifices acceptable to God through Jesus the Messiah.
translation:
  language: hi
  text: आप स्वयं भी जीवित पत्थरों के समान[a] एक आत्मिक भवन के रूप में बनाए जा रहे हैं—एक पवित्र याजक-समुदाय बनने के लिए[b]—ताकि यीशु मसीह के द्वारा परमेश्वर को स्वीकार्य आत्मिक बलिदान चढ़ाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘जीवित पत्थरों के रूप में’ भी हो सकता है।
    reason: ὡς तुलना या भूमिका/रूप—दोनों प्रकार से समझा जा सकता है।
  - marker: b
    text: या ‘एक पवित्र याजक-समुदाय के रूप में’ अथवा ‘एक पवित्र याजक-समुदाय में’; यूनानी पूर्वसर्ग यहाँ लक्ष्य या परिणाम व्यक्त कर सकता है।
    reason: εἰς ἱεράτευμα ἅγιον की लक्ष्यात्मक और परिणामात्मक अर्थगत व्यापकता को सुरक्षित रखना।
lexical_decisions:
- source_word: καὶ αὐτοὶ
  choice: आप भी स्वयं
  rationale: καί के योगात्मक अर्थ और αὐτοί के बलाघात, दोनों को रखते हुए पाठकों को बहुवचन में सीधे संबोधित किया गया है।
- source_word: ὡς λίθοι ζῶντες
  choice: जीवित पत्थरों के समान
  rationale: तुलना और पिछले पद के ‘जीवित पत्थर’ वाले बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: οἰκοδομεῖσθε
  choice: बनाए जा रहे हैं
  rationale: वर्तमानकालीन कर्मवाच्य को बनाए रखता है, जिससे चल रही क्रिया व्यक्त होती है और कर्ता को वहाँ स्पष्ट नहीं किया जाता जहाँ यूनानी पाठ उसे नाम नहीं देता।
- source_word: οἶκος πνευματικὸς
  choice: एक आत्मिक भवन के रूप में
  rationale: भवन के सामूहिक रूपक को स्पष्ट और स्वाभाविक हिन्दी में रखता है; ‘आत्मिक’ πνευματικός की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: εἰς ἱεράτευμα ἅγιον
  choice: एक पवित्र याजक-समुदाय बनने के लिए
  rationale: εἰς के लक्ष्य अथवा परिणाम के भाव को व्यक्त करता है और ἱεράτευμα को केवल अलग-अलग याजकों के बजाय सामूहिक याजक-वर्ग के रूप में प्रस्तुत करता है।
- source_word: ἀνενέγκαι πνευματικὰς θυσίας
  choice: आत्मिक बलिदान चढ़ाएँ
  rationale: बलिदान-संबंधी संदर्भ में ἀναφέρω के ‘चढ़ाने’ के अर्थ को और πνευματικὰς θυσίας की धार्मिक उपासना-छवि को बनाए रखता है।
- source_word: εὐπροσδέκτους θεῷ
  choice: परमेश्वर को ग्रहणयोग्य
  rationale: बलिदान के परमेश्वर द्वारा स्वीकार किए जाने का भाव व्यक्त करता है, बिना इसे केवल भावनात्मक ‘प्रसन्नता’ तक सीमित किए।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: διά के साधन अथवा मध्यस्थता के अर्थ को ‘के द्वारा’ से व्यक्त करता है और Χριστός को उसके प्रचलित हिन्दी पदनाम ‘मसीह’ से अनूदित करता है।
theological_decisions:
- issue: οἰκοδομεῖσθε में वाच्य और कर्तृत्व
  choice: कर्मवाच्य ‘बनाए जा रहे हैं’; कर्ता को स्पष्ट रूप से नहीं जोड़ा गया
  alternative: ‘अपने आपको बनाओ’ अथवा ‘परमेश्वर तुम्हें बना रहा है’
  rationale: रूप कर्मवाच्य है और प्रसंग परमेश्वर के निर्माण-कार्य की ओर संकेत करता है, पर पद स्वयं कर्ता का नाम नहीं लेता; इसलिए न तो आत्म-निर्माण जोड़ा गया है, न कर्ता को पाठ में स्पष्ट किया गया है।
- issue: εἰς ἱεράτευμα ἅγιον का लक्ष्य या परिणाम
  choice: ‘एक पवित्र याजक-समुदाय बनने के लिए’
  alternative: ‘एक पवित्र याजक-समुदाय के रूप में’ अथवा ‘एक पवित्र याजक-समुदाय में’
  rationale: εἰς लक्ष्य और परिणाम दोनों व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक हिन्दी के लिए लक्ष्य का भाव चुना गया है और वैकल्पिक परिणामात्मक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त अथवा क्राइस्ट
  rationale: यहाँ Χριστός यीशु के पदनाम के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय भाषा में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला पद है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘याजक-समुदाय’ सामूहिक ἱεράτευμα को ‘याजकाई’ की अपेक्षा अधिक स्पष्ट करता है। विराम-चिह्न आत्मिक भवन और पवित्र याजक-समुदाय के निकट, पर व्याकरणतः भिन्न संबंधों को दिखाते हैं।
