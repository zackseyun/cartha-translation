id: 1PE.2.6
reference: 1 Peter 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διότι περιέχει ⸀ἐν γραφῇ· Ἰδοὺ τίθημι ἐν Σιὼν λίθον ⸂ἀκρογωνιαῖον ἐκλεκτὸν⸃ ἔντιμον, καὶ ὁ πιστεύων ἐπ’ αὐτῷ οὐ μὴ καταισχυνθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/006.yaml
  text: 'For it stands in Scripture: “Behold[a], I lay in Zion a chosen and honored cornerstone[e][d][c][b], and the one who believes in him will certainly not be put to shame.”'
translation:
  language: hi
  text: 'क्योंकि पवित्रशास्त्र में लिखा है:

    “देखो, मैं सिय्योन में एक चुना हुआ और आदरणीय कोने का पत्थर रखता हूँ,

    और जो उस पर विश्वास करता है, वह निश्चय ही लज्जित नहीं होगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '“आदरणीय” का अनुवाद “बहुमूल्य” भी हो सकता है। “निश्चय ही ... नहीं” यूनानी में अत्यंत प्रबल निषेध है; अर्थ: “कभी लज्जित नहीं होगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में पवित्रशास्त्र का प्रमाण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका व्याख्यात्मक-कारणसूचक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: περιέχει ἐν γραφῇ
  choice: पवित्रशास्त्र में लिखा है
  rationale: यूनानी मुहावरे का आशय है कि यह कथन पवित्रशास्त्र में विद्यमान है। शाब्दिक संरचना हिन्दी में अस्वाभाविक होती; ‘लिखा है’ स्पष्ट, प्रचलित और अर्थनिष्ठ है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह उद्धरण के गंभीर स्वर को बनाए रखते हुए ध्यान आकर्षित करने वाली आज्ञा को आधुनिक और सहज हिन्दी में व्यक्त करता है।
- source_word: τίθημι
  choice: रखता हूँ
  rationale: पत्थर और निर्माण के बिंब में यह स्वाभाविक हिन्दी क्रिया है तथा वर्तमानकालीन यूनानी रूप को बनाए रखती है।
- source_word: ἐν Σιὼν
  choice: सिय्योन में
  rationale: ἐν का स्थानवाचक अर्थ सीधे व्यक्त होता है और भविष्यद्वाणी के भौगोलिक बिंब को सुरक्षित रखता है।
- source_word: λίθον ἀκρογωνιαῖον
  choice: कोने का पत्थर
  rationale: यह निर्माण-संबंधी रूपक को साधारण आधुनिक हिन्दी में स्पष्ट रखता है और ‘मुख्य’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐκλεκτὸν
  choice: चुना हुआ
  rationale: यह चयन के अर्थ को स्पष्ट रूप से व्यक्त करता है और किसी बाद की पारिभाषिक धार्मिक शब्दावली को नहीं थोपता।
- source_word: ἔντιμον
  choice: आदरणीय
  rationale: शब्द में सम्मान और मूल्य दोनों का भाव हो सकता है; ‘आदरणीय’ निकट संदर्भ में सम्मान की विषयवस्तु को सामने रखता है।
- source_word: ὁ πιστεύων ἐπ’ αὐτῷ
  choice: जो उस पर विश्वास करता है
  rationale: ‘जो ... करता है’ संज्ञार्थक कृदंत का स्वाभाविक हिन्दी रूप है। ‘उस पर’ यूनानी सर्वनाम की व्याकरणिक अस्पष्टता और पत्थर के रूपक, दोनों को बनाए रखता है।
- source_word: οὐ μὴ καταισχυνθῇ
  choice: निश्चय ही लज्जित नहीं होगा
  rationale: ‘निश्चय ही नहीं’ οὐ μή की प्रबल निषेधात्मक शक्ति व्यक्त करता है; ‘लज्जित’ καταισχύνω के मान-सम्मान संबंधी अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: यशायाह के उद्धरण में αὐτῷ का संदर्भ
  choice: ‘उस पर’—ऐसा रूप जो पत्थर के रूपक और मसीह-संबंधी प्रयोग दोनों के लिए खुला है
  alternative: ‘उसमें’ या व्यक्तिगत रूप से ‘उस पर/उस व्यक्ति पर’ को अधिक स्पष्ट करना
  rationale: यूनानी पुल्लिंग सर्वनाम व्याकरणतः ‘पत्थर’ से मेल खाता है, जबकि 1 पतरस 2:4–8 में यह पत्थर मसीह पर लागू होता है। हिन्दी ‘उस पर’ genuine ambiguity को बनाए रखते हुए विश्वास के व्यक्तिगत आशय को बाधित नहीं करता।
- issue: ἀκρογωνιαῖον ἐκλεκτὸν ἔντιμον का संबंध और क्रम
  choice: ‘एक चुना हुआ और आदरणीय कोने का पत्थर’
  alternative: ‘कोने का एक पत्थर, जो चुना हुआ और बहुमूल्य है’
  rationale: सभी विशेषण उसी पत्थर का वर्णन करते हैं। चुना हुआ और आदरणीय को संज्ञा से पहले रखना आधुनिक हिन्दी में सहज है और मूल के दोनों गुणों को स्पष्ट रखता है।
- issue: ἔντιμον में सम्मान अथवा बहुमूल्यता
  choice: आदरणीय
  alternative: बहुमूल्य
  rationale: दोनों अर्थ संभव हैं, पर निकट संदर्भ 2:7 में τιμή के साथ सम्मान का विषय प्रमुख है। वैकल्पिक मूल्य-संबंधी अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण बाइबलीय शैली। ‘सिय्योन’ पारंपरिक और व्यापक रूप से पहचाना जाने वाला नाम रखा गया है। काव्यात्मक उद्धरण को पंक्तियों में रखा गया है; अनावश्यक संस्कृतनिष्ठता और सम्प्रदायगत पारिभाषिकता से बचा गया है।
