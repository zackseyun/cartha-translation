id: 1PE.2.10
reference: 1 Peter 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἵ ποτε οὐ λαὸς νῦν δὲ λαὸς θεοῦ, οἱ οὐκ ἠλεημένοι νῦν δὲ ἐλεηθέντες.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/010.yaml
  text: you who once were not a people[a], but now are God's people; you who had not received mercy[b], but now have received mercy.
translation:
  language: hi
  text: तुम जो पहले एक लोग नहीं थे[a], पर अब परमेश्वर के लोग हो; तुम पर दया नहीं की गई थी[b], पर अब तुम पर दया की गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पतरस होशे 1:9-10; 2:23 की प्रतिध्वनि करता है और इस्राएल की पुनःस्थापना की भाषा को अपने पाठकों की वर्तमान पहचान—परमेश्वर के लोगों में उनकी सहभागिता—पर लागू करता है।
    reason: cross_reference
  - marker: b
    text: 'या: “तुम्हें दया नहीं मिली थी, पर अब तुम्हें दया मिली है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵ
  choice: तुम जो
  rationale: यह बहुवचन संबंधवाचक सर्वनाम पिछले पद में संबोधित पाठकों की ओर संकेत करता है; ‘तुम जो’ हिन्दी में उस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ποτε
  choice: पहले
  rationale: यह νῦν (‘अब’) के विपरीत उनकी पिछली दशा को दर्शाता है; ‘पहले’ सरल और स्वाभाविक है।
- source_word: λαὸς
  choice: एक लोग / परमेश्वर के लोग
  rationale: λαός सामूहिक जनसमुदाय और वाचा-संबंधी पहचान को व्यक्त करता है। पहली बार ‘एक लोग’ मूल के अनिश्चित सामूहिक भाव को, और दूसरी बार ‘परमेश्वर के लोग’ λαὸς θεοῦ को सुरक्षित रखता है।
- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक यहाँ अधिकार अथवा संबंध प्रकट करता है; ‘परमेश्वर के लोग’ स्वाभाविक हिन्दी है और वाचा-संबंधी भाव बनाए रखता है।
- source_word: οὐκ ἠλεημένοι
  choice: तुम पर दया नहीं की गई थी
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त दया के पात्र न बनाए जाने से उत्पन्न पिछली दशा बताता है। कर्मवाच्य अनुवाद परमेश्वर के दयालु कार्य को निहित रखते हुए मूल की संरचना के निकट है।
- source_word: ἐλεηθέντες
  choice: अब तुम पर दया की गई है
  rationale: अओरिस्ट कर्मवाच्य कृदन्त उस दया-कार्य और उससे बनी वर्तमान स्थिति को दर्शाता है; हिन्दी पूर्ण रूप ‘की गई है’ दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: दोनों खंडों में पूर्व और वर्तमान दशा का स्पष्ट विरोध प्रकट करता है।
- source_word: νῦν
  choice: अब
  rationale: विश्वासियों की वर्तमान स्थिति को उनकी पिछली दशा के विपरीत रखता है।
theological_decisions:
- issue: होशे की प्रतिध्वनि और वाचा-संबंधी सामूहिक पहचान
  choice: पहले खंड में ‘एक लोग नहीं’ और दूसरे में ‘परमेश्वर के लोग’ रखकर मूल यूनानी का अंतर सुरक्षित रखा गया है।
  alternative: दोनों खंडों में ‘परमेश्वर के लोग नहीं थे ... परमेश्वर के लोग हो’ कहना।
  rationale: यूनानी का पहला खंड केवल οὐ λαὸς (‘एक लोग नहीं’) कहता है, जबकि दूसरा λαὸς θεοῦ (‘परमेश्वर के लोग’) कहता है। इस अंतर को बनाए रखने से होशे की पृष्ठभूमि सुनाई देती है और पाठ में निहित से अधिक संकीर्ण जातीय या सम्प्रदायगत निष्कर्ष नहीं जोड़ा जाता।
- issue: दया पाने बनाम दया किए जाने का कर्मवाच्य
  choice: ‘तुम पर दया ... की गई’
  alternative: ‘तुम्हें दया नहीं मिली थी ... अब दया मिली है’
  rationale: कर्मवाच्य रूप यूनानी के ἠλεημένοι और ἐλεηθέντες को अधिक सीधे दर्शाता है और दया करने वाले परमेश्वर के कार्य को बिना अनावश्यक व्याख्या के निहित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक पहचान को स्पष्ट रखने वाली भाषा। ‘एक लोग’ सामान्य बोलचाल से कुछ अधिक बाइबलीय है, पर λαός के सामूहिक और वाचा-संबंधी अर्थ तथा पहले और दूसरे खंड के जानबूझकर रखे गए अंतर को सुरक्षित करता है।
