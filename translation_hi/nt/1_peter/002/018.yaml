  text: Οἱ οἰκέται ὑποτασσόμενοι ἐν παντὶ φόβῳ τοῖς δεσπόταις, οὐ μόνον τοῖς ἀγαθοῖς καὶ ἐπιεικέσιν ἀλλὰ καὶ τοῖς σκολιοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/018.yaml
  text: Household servants, submitting yourselves to your masters with all respect, not only to the good and gentle but also to the crooked.
translation:
  language: hi
  text: हे घर के दासों[a], पूरे आदर के साथ[b] अपने मालिकों के अधीन रहो—न केवल उन मालिकों के जो भले और कोमल हैं, बल्कि उन के भी जो टेढ़े हैं।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घर के सेवक।’ यूनानी शब्द विशेष रूप से घर के भीतर अधीन स्थिति में रहने वाले दासों या आश्रित सेवकों के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘हर प्रकार के भय के साथ।’ यहाँ इसका आशय आदरपूर्ण सम्मान या विनम्र अधीनता हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘कठोर’ अथवा ‘अन्यायी।’ यूनानी शब्द का शाब्दिक अर्थ ‘टेढ़ा’ या ‘मुड़ा हुआ’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκέται
  choice: घर के दासो
  rationale: यह शब्द सामान्य सेवकों के बजाय घर-परिवार के भीतर अधीन और बंधुआ स्थिति में रहने वाले दासों को सूचित करता है। ‘घर के दास’ घरेलू संदर्भ और उनकी वास्तविक सामाजिक स्थिति, दोनों को स्पष्ट रखता है।
- source_word: ὑποτασσόμενοι
  choice: अधीन रहो
  rationale: यह कृदंत प्रसंग में आज्ञार्थक बल रखता है। आधुनिक हिन्दी में ‘अधीन रहो’ स्वाभाविक है और अधीनता के भाव को सीधे व्यक्त करता है।
- source_word: ἐν παντὶ φόβῳ
  choice: पूरे आदर के साथ
  rationale: φόβος का मूल अर्थ ‘भय’ है, पर यहाँ यह आदरयुक्त संकोच अथवा सम्मान की मुद्रा को व्यक्त कर सकता है। मुख्य पाठ में ‘पूरे आदर के साथ’ प्रसंगगत अर्थ देता है, जबकि शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित है।
- source_word: δεσπόταις
  choice: मालिकों
  rationale: δεσπότης घर के दासों पर अधिकार रखने वाले व्यक्ति को दर्शाता है। इस सामाजिक संबंध के लिए ‘मालिक’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक शब्द है।
- source_word: ἀγαθοῖς
  choice: भले
  rationale: ἀγαθός का सामान्य नैतिक अर्थ ‘भला’ या ‘अच्छा’ है; ‘भले’ व्यक्ति के चरित्र का सहज वर्णन करता है।
- source_word: ἐπιεικέσιν
  choice: नरम स्वभाव के
  rationale: ἐπιεικής में कोमलता, सहनशीलता और उचित व्यवहार का भाव है। ‘नरम स्वभाव के’ मालिक के व्यवहार की मानवीय कोमलता को सामान्य हिन्दी में व्यक्त करता है।
- source_word: σκολιοῖς
  choice: टेढ़े स्वभाव के
  rationale: σκολιός का शाब्दिक अर्थ ‘टेढ़ा’ है और व्यक्तियों के लिए यह विकृत, अनुचित या कठोर आचरण की ओर संकेत करता है। ‘टेढ़े स्वभाव के’ मूल रूपक को बनाए रखते हुए हिन्दी में बोधगम्य है।
theological_decisions:
- issue: οἰκέται की सामाजिक स्थिति को न तो नरम करना, न सामान्य सेवा में बदलना
  choice: ‘घर के दास’
  alternative: ‘घरेलू सेवक’
  rationale: प्राचीन घरेलू संदर्भ में ये स्वतंत्र वेतनभोगी सेवक मात्र नहीं थे। ‘दास’ उस अधीन और बंधुआ स्थिति को स्पष्ट करता है, जबकि ‘घर के’ οἰκέται की विशिष्ट घरेलू सीमा बनाए रखता है।
- issue: φόβος को शाब्दिक ‘भय’ या प्रसंगगत ‘आदर’ के रूप में देना
  choice: मुख्य पाठ में ‘पूरे आदर के साथ’ और पाद-टिप्पणी में ‘हर प्रकार के भय में’
  alternative: मुख्य पाठ में ‘पूरे भय के साथ’
  rationale: यहाँ शब्द सम्मानपूर्ण अधीनता को व्यक्त कर सकता है; केवल ‘भय’ आधुनिक पाठक को आतंक का अनिवार्य अर्थ दे सकता है। फिर भी मूल की वास्तविक अस्पष्टता पाद-टिप्पणी में रखी गई है।
- issue: σκολιοῖς के रूपक को बनाए रखना या केवल उसका व्याख्यात्मक अर्थ देना
  choice: ‘टेढ़े स्वभाव के’
  alternative: ‘कठोर’ या ‘अन्यायी’
  rationale: मूल शब्द का ‘टेढ़ा’ रूपक नैतिक विकृति, अनुचितता और कठोरता के बीच अर्थगत तनाव बनाए रखता है; किसी एक गुण तक अर्थ को सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। संबोधन ‘हे घर के दासो’ से यूनानी वाक्य की प्रत्यक्ष संबोधन-शैली स्पष्ट होती है। डैश विरोधी तुलना को सहज बनाता है। ‘नरम स्वभाव’ और ‘टेढ़े स्वभाव’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल के चरित्र-वर्णन को बनाए रखते हैं।
