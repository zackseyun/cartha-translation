  text: εἰς τοῦτο γὰρ ἐκλήθητε, ὅτι καὶ Χριστὸς ἔπαθεν ὑπὲρ ⸀ὑμῶν, ὑμῖν ὑπολιμπάνων ὑπογραμμὸν ἵνα ἐπακολουθήσητε τοῖς ἴχνεσιν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/021.yaml
  text: For you were called to this[a], because Messiah also suffered for you, leaving you an example so that you might follow in his steps.
translation:
  language: hi
  text: तुम इसी के लिए बुलाए गए थे, क्योंकि मसीह ने भी तुम्हारे लिए दुःख सहा और तुम्हारे लिए एक उदाहरण[a] छोड़ गया, ताकि तुम उसके पदचिह्नों पर चलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक आदर्श लेख’ या ‘प्रतिलिपि के लिए लेख।’ यूनानी शब्द उस नमूने का संकेत कर सकता है जिसे शिक्षार्थियों के सामने रखकर वे उसे देखकर लिखें या उसकी रेखाओं का अनुसरण करें।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: इसी के लिए
  rationale: यह अभिव्यक्ति पिछले संदर्भ में अन्याय सहते हुए धीरज रखने की ओर संकेत करती है और उद्देश्य का भाव बनाए रखती है।
- source_word: ἐκλήθητε
  choice: तुम ... बुलाए गए हो
  rationale: कर्मवाच्य रूप और ईश्वरीय बुलाहट की धार्मिक प्रतिध्वनि दोनों सुरक्षित रहती हैं, बिना किसी विशिष्ट सिद्धान्त को आरोपित किए।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ ὅτι बुलाहट की विषयवस्तु अथवा व्याख्यात्मक आधार प्रस्तुत कर सकता है। हिंदी में ‘इसी के लिए ... कि’ मूल की वास्तविक व्याकरणिक गुंजाइश को स्वाभाविक ढंग से रखता है।
- source_word: Χριστὸς
  choice: मसीह
  rationale: Χριστός को अभिषिक्त जन की उपाधि के रूप में मानक और स्वाभाविक हिंदी ‘मसीह’ से व्यक्त किया गया है।
- source_word: ἔπαθεν
  choice: दुःख सहा
  rationale: मूल क्रिया सामान्यतः कष्ट सहने को बताती है; यहाँ मृत्यु या कष्ट के प्रकार को स्पष्टतः न जोड़ना उचित है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: यह लाभार्थक और प्रतिनिधिक दोनों संभावित भावों को खुला रखता है तथा इसे केवल ‘तुम्हारे स्थान पर’ तक सीमित नहीं करता।
- source_word: ὑμῖν ὑπολιμπάνων
  choice: तुम्हारे लिए ... छोड़ गया
  rationale: कृदन्त मसीह से संबंधित है और ὑμῖν उसके लाभार्थी को दर्शाता है; हिंदी में यह संबंध स्पष्ट और स्वाभाविक है।
- source_word: ὑπογραμμὸν
  choice: एक नमूना
  rationale: यह शब्द शिक्षार्थी के सामने नकल या अनुरेखण के लिए रखे गए आदर्श लेख को सूचित कर सकता है। ‘नमूना’ इस ठोस रूपक को ‘उदाहरण’ से अधिक निकटता से बचाता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य का भाव स्वाभाविक आधुनिक हिंदी में स्पष्ट होता है।
- source_word: ἐπακολουθήσητε
  choice: तुम ... चलो
  rationale: ἵνα के साथ यह अभिप्रेत अनुसरण को दर्शाता है; ‘ताकि ... चलो’ हिंदी में उद्देश्य और आह्वान दोनों को स्वाभाविक रूप देता है।
- source_word: τοῖς ἴχνεσιν αὐτοῦ
  choice: उसके पदचिह्नों पर
  rationale: मूल के पैरों के निशानों वाले रूपक को बनाए रखते हुए यह हिंदी में सुबोध और गरिमापूर्ण है।
theological_decisions:
- issue: मसीह के दुःख के संबंध में ὑπὲρ ὑμῶν का अर्थ
  choice: ‘तुम्हारे लिए’—लाभार्थक और प्रतिनिधिक विस्तार को खुला रखा गया
  alternative: ‘तुम्हारी ओर से’, ‘तुम्हारे कारण’, या ‘तुम्हारे स्थान पर’
  rationale: तत्काल संदर्भ मसीह के दुःख को विश्वासियों के अनुसरण के आदर्श के रूप में प्रस्तुत करता है। ‘तुम्हारे लिए’ संभावित प्रतिस्थापनात्मक प्रतिध्वनि को नकारे बिना इस पद में व्यक्त अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: ὅτι का संबंध
  choice: ‘इसी के लिए ... कि’ द्वारा बुलाहट की विषयवस्तु/व्याख्या के रूप में रखा गया
  alternative: ‘क्योंकि मसीह ने भी...’ द्वारा केवल कारणात्मक संबंध
  rationale: ὅτι कारण प्रस्तुत कर सकता है, पर εἰς τοῦτο ... ὅτι की रचना व्याख्यात्मक या विषयवस्तु-सूचक भी समझी जा सकती है। चुना हुआ हिंदी रूप मूल की इस वास्तविक अस्पष्टता को पर्याप्त रूप से खुला रखता है।
