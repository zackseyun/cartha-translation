  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘पदचिह्नों पर चलो’ मूल रूपक को बनाए रखता है। मुख्य पाठ का [a] पादटिप्पणी से ठीक प्रकार जुड़ा है।
