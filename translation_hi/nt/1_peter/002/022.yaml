base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/022.yaml
  text: who committed no sin[b][a], nor was deceit found in his mouth.
translation:
  language: hi
  text: जिसने कोई पाप नहीं किया,[b] और न उसके मुँह में कोई छल पाया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कपट’; यूनानी शब्द में छल, धोखा या धूर्तता का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह शब्दावली यशायाह 53:9 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: ὃς
  choice: जिसने
  rationale: यह संबंधवाचक सर्वनाम पिछले संदर्भ में मसीह की ओर संकेत करता है; हिंदी में कर्ता और सकर्मक क्रिया के साथ ‘जिसने’ स्वाभाविक है।
- source_word: ἁμαρτίαν οὐκ ἐποίησεν
  choice: कोई पाप नहीं किया
  rationale: ποιέω और ἁμαρτία का मेल पाप करने के अर्थ में है। ‘कोई पाप नहीं किया’ स्वाभाविक हिंदी है और पूर्ण निषेध बनाए रखता है।
- source_word: οὐδὲ
  choice: और न
  rationale: यह दूसरे नकारात्मक उपवाक्य को पहले से समन्वित करता है और यूनानी के संयुक्त निषेध को स्पष्ट रखता है।
- source_word: εὑρέθη
  choice: पाया गया
  rationale: कर्मवाच्य रूप को बनाए रखता है और यशायाह 53:9 की प्रतिध्वनि को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
- source_word: δόλος
  choice: छल
  rationale: ‘छल’ आधुनिक हिंदी में संक्षिप्त और व्यापक है तथा कपट, धोखे या धूर्तता के अर्थक्षेत्र को व्यक्त करता है।
- source_word: ἐν τῷ στόματι αὐτοῦ
  choice: उसके मुँह में
  rationale: मूल के शारीरिक रूपक और यशायाह की प्रतिध्वनि को निकटता से बनाए रखता है; ‘उसके होंठों पर’ अधिक मुहावरेदार पर कम प्रत्यक्ष विकल्प होता।
theological_decisions:
- issue: यीशु की निष्पापता और सत्यनिष्ठा के वर्णन में यशायाह 53:9 की प्रतिध्वनि
  choice: ‘कोई पाप नहीं किया’ और ‘उसके मुँह में कोई छल पाया गया’ जैसी मूल के निकट भाषा
  alternative: ‘उसने कभी पाप नहीं किया और कभी छल की बात नहीं कही’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति
  rationale: मूल के निकट रचना मसीह की निष्पापता का कथन और यशायाह से अंतर्पाठीय संबंध दोनों सुरक्षित रखती है, बिना ‘मुँह’ को केवल बोलने की क्रिया तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली। संबंधवाचक संरचना को पिछले पद से जोड़ने के लिए ‘जिसने’ रखा गया है। ‘मुँह में’ मूल रूपक और पुराने नियम की प्रतिध्वनि सुरक्षित रखता है।
