  text: (ὅτι οὕτως ἐστὶν τὸ θέλημα τοῦ θεοῦ, ἀγαθοποιοῦντας φιμοῦν τὴν τῶν ἀφρόνων ἀνθρώπων ἀγνωσίαν)·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/015.yaml
  text: 'For this is the will of God: that by doing good you should silence the ignorance of foolish people[a].'
translation:
  language: hi
  text: क्योंकि परमेश्वर की इच्छा यह है कि तुम भलाई करके मूर्ख लोगों की अज्ञानता का मुँह बंद कर दो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूर्ख लोगों की अज्ञानता का थूथन बाँध दो।” मूल क्रिया का शाब्दिक अर्थ “थूथन बाँधना” है; यहाँ यह मूर्ख लोगों की विरोधी बातों को रोकने के लिए रूपक के रूप में प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले उपदेश का कारण बताता है; इसलिए कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: οὕτως
  choice: यही
  rationale: यह उस रीति की ओर संकेत करता है जिसका वर्णन आगे ‘भलाई करके’ किया गया है; ‘इच्छा यही है’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: θέλημα
  choice: इच्छा
  rationale: परमेश्वर की अभिलाषा या अभिप्राय के लिए यह सीधा और प्रचलित हिन्दी शब्द है।
- source_word: ἀγαθοποιοῦντας
  choice: भलाई करके
  rationale: वर्तमान कृदन्त यहाँ साधन या रीति प्रकट करता है—भलाई करने के द्वारा अज्ञानता को चुप कराना।
- source_word: φιμοῦν
  choice: चुप करा दो
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘मुँह बाँधना’ है, पर यहाँ विरोधी वाणी को रोकने के रूपक में प्रयुक्त है; ‘चुप करा दो’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀγνωσίαν
  choice: अज्ञानता
  rationale: यह ज्ञान या समझ के अभाव को सीधे व्यक्त करता है और मूल संज्ञा के निकट है।
- source_word: ἀφρόνων ἀνθρώπων
  choice: मूर्ख लोगों की
  rationale: ἄφρων का अर्थ ‘मूर्ख/विवेकहीन’ है और ἄνθρωποι यहाँ सामान्य रूप से लोगों को सूचित करता है, केवल पुरुषों को नहीं।
theological_decisions:
- issue: ἀνθρώπων का लिंग-संबंधी अनुवाद
  choice: लोगों
  alternative: मनुष्यों / पुरुषों
  rationale: यूनानी शब्द यहाँ सामान्य मानवीय विरोधियों के लिए है, केवल पुरुषों के लिए नहीं; ‘लोगों’ मूल आशय को स्वाभाविक और समावेशी ढंग से रखता है।
- issue: φιμοῦν के रूपक का अनुवाद
  choice: चुप करा दो
  alternative: मुँह बाँध दो
  rationale: रूपक का आशय उनकी अज्ञानतापूर्ण या विरोधी बातों को भलाई के द्वारा निरुत्तर करना है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ पिछले संदर्भ के बहुवचन संबोधन को दर्शाता है। वाक्य की कारणसूचक कड़ी और साधनसूचक कृदन्त दोनों स्पष्ट रखे गए हैं।
