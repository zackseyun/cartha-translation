  text: ὃς λοιδορούμενος οὐκ ἀντελοιδόρει, πάσχων οὐκ ἠπείλει, παρεδίδου δὲ τῷ κρίνοντι δικαίως·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/023.yaml
  text: who[a], when he was insulted, did not insult in return; when he suffered, he did not threaten[b], but kept entrusting himself to the one who judges justly.
translation:
  language: hi
  text: जब उसका अपमान किया गया, तो उसने बदले में अपमान नहीं किया; जब उसने दुःख सहा, तो उसने धमकी नहीं दी, बल्कि वह अपने आपको उसे सौंपता रहा, जो न्यायपूर्वक न्याय करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιδορούμενος / ἀντελοιδόρει
  choice: जब उसका अपमान किया गया, तो उसने बदले में अपमान नहीं किया
  rationale: यह शब्द-युग्म मौखिक दुर्व्यवहार और प्रत्युत्तर में वैसा ही दुर्व्यवहार न करने का भाव रखता है। ‘अपमान’ आधुनिक हिन्दी में स्वाभाविक है और मूल की पुनरुक्ति को बनाए रखता है।
- source_word: πάσχων
  choice: जब उसने दुःख सहा
  rationale: वर्तमान कृदन्त को पहले खंड के समान कालगत उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: οὐκ ἠπείλει
  choice: उसने धमकी नहीं दी
  rationale: ἀπειλέω का सीधा अर्थ धमकी देना है; हिन्दी का सरल भूतकाल प्रसंग में उसके निरंतर/विशिष्ट आचरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρεδίδου
  choice: वह अपने आपको ... हाथों सौंपता रहा
  rationale: अपूर्ण भूतकाल की निरंतरता को ‘सौंपता रहा’ से व्यक्त किया गया है। कर्म मूल यूनानी में व्यक्त नहीं है, पर प्रसंग से आत्मवाचक अर्थ संभावित है; ‘हाथों’ हिन्दी में सौंपने के भाव को स्वाभाविक बनाता है।
- source_word: τῷ κρίνοντι δικαίως
  choice: उसके हाथों ... जो न्यायपूर्वक न्याय करता है
  rationale: कर्ता को वर्णनात्मक रूप में रखा गया है और उसे स्पष्ट रूप से ‘परमेश्वर’ या ‘पिता’ नहीं कहा गया। δικαίως के क्रियाविशेषणात्मक बल को ‘न्यायपूर्वक’ से सुरक्षित रखा गया है।
- source_word: δὲ
  choice: बल्कि
  rationale: यह प्रतिशोध और अपने आपको न्याय करने वाले को सौंपने के बीच स्पष्ट विरोध दर्शाता है।
- source_word: ὃς
  choice: जब उसका... उसने
  rationale: हिन्दी में अलग ‘जो’ से आरम्भ करना पिछले पद पर अत्यधिक निर्भर और अस्वाभाविक होता; सर्वनाम द्वारा पूर्ववर्ती मसीह का संदर्भ बनाए रखा गया है।
theological_decisions:
- issue: ‘जो न्यायपूर्वक न्याय करता है’ का अभिप्रेत व्यक्ति
  choice: मूल की तरह वर्णनात्मक और अप्रत्यक्ष रखा गया
  alternative: स्पष्ट रूप से ‘परमेश्वर’ या ‘पिता’ कहना
  rationale: प्रसंग में अभिप्रेत परमेश्वर है, पर यूनानी पाठ नाम या विशिष्ट उपाधि नहीं देता; इसलिए अनुवाद उससे अधिक निश्चितता नहीं जोड़ता।
- issue: παρεδίδου का अव्यक्त कर्म
  choice: ‘अपने आपको’
  alternative: ‘अपना मामला’ या बिना कर्म के ‘सौंपता रहा’
  rationale: प्रसंग और प्रचलित व्याख्या आत्म-समर्पण का समर्थन करते हैं, यद्यपि यूनानी में कर्म व्यक्त नहीं है। हिन्दी में सकर्मक क्रिया के लिए इसे स्पष्ट करना आवश्यक और स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘न्यायपूर्वक न्याय करता है’ की जानबूझकर रखी गई पुनरुक्ति मूल के κρίνω/δικαίως संबंध को स्पष्ट करती है।
