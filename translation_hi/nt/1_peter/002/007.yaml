source:
  edition: SBLGNT
  text: ὑμῖν οὖν ἡ τιμὴ τοῖς πιστεύουσιν· ⸀ἀπιστοῦσιν δὲ ⸀λίθος ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/007.yaml
  text: Therefore[a], for you who believe is the honor, but for those who do not believe[c][b], “The stone that the builders rejected—this one has become the head of the corner.”
translation:
  language: hi
  text: 'इसलिए, तुम जो विश्वास करते हो, तुम्हारे लिए आदर है[a]; पर जो विश्वास नहीं करते[b], उनके विषय में यह कहा गया है:


    “जिस पत्थर को राजमिस्त्रियों ने ठुकरा दिया था,

    वही कोने का सिरा बन गया है।”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम विश्वास करनेवालों के लिए यह पत्थर बहुमूल्य है,” अर्थात यह पत्थर विश्वासियों के लिए बहुमूल्य है।
    reason: alternative_reading
  - marker: b
    text: या, “जो आज्ञा नहीं मानते”; इस क्रिया में विश्वास करने से इनकार करने और इस कारण आज्ञा न मानने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'परंपरागत अनुवाद: “कोने का मुख्य पत्थर” या “प्रधान आधारशिला।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: τιμή
  choice: आदर
  rationale: यह शब्द आदर, मूल्य या बहुमूल्यता का अर्थ दे सकता है। यहाँ संक्षिप्त यूनानी वाक्य और विश्वास करनेवालों के साथ इसका संबंध बनाए रखने के लिए ‘आदर’ चुना गया है; ‘बहुमूल्य’ वाला संभावित अर्थ पादटिप्पणी में रखा गया है।
- source_word: τοῖς πιστεύουσιν
  choice: तुम जो विश्वास करते हो
  rationale: यह अनुवाद बहुवचन संबोधन और विश्वास करने की कृदन्तीय अभिव्यक्ति—दोनों को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀπιστοῦσιν
  choice: जो विश्वास नहीं करते
  rationale: यह πιστεύουσιν के साथ स्पष्ट विरोध को सुरक्षित रखता है। क्रिया में अविश्वास के फलस्वरूप आज्ञा न मानने का भाव भी हो सकता है, जिसे पादटिप्पणी में दिया गया है।
- source_word: λίθος
  choice: पत्थर
  rationale: निर्माण के रूपक और उद्धरण के लिए यह मानक तथा स्वाभाविक हिन्दी शब्द है।
- source_word: ἀπεδοκίμασαν
  choice: ठुकरा दिया
  rationale: क्रिया जाँचने या परखने के बाद अस्वीकार करने का भाव रखती है; ‘ठुकरा दिया’ उद्धरण में सहज और स्पष्ट है।
- source_word: οἰκοδομοῦντες
  choice: राजमिस्त्री
  rationale: निर्माण करनेवालों के लिए यह संक्षिप्त और स्वाभाविक हिन्दी पद है तथा भवन-निर्माण का चित्र स्पष्ट रखता है।
- source_word: κεφαλὴν γωνίας
  choice: कोने का सिरा
  rationale: यह यूनानी अभिव्यक्ति ‘कोने का सिर’ के रूपक को अपेक्षाकृत पारदर्शी ढंग से रखता है और उसे मुख्य पाठ में केवल एक विशिष्ट स्थापत्य अर्थ तक सीमित नहीं करता। परिचित व्याख्यात्मक अनुवाद पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ἡ τιμή का विश्वासियों और पत्थर रूपी मसीह से संबंध
  choice: आदर विश्वास करनेवालों के लिए है।
  alternative: विश्वास करनेवालों के लिए पत्थर बहुमूल्य है।
  rationale: ὑμῖν οὖν ἡ τιμή का अधिक सीधा अर्थ विश्वासियों के लिए आदर होना है और यह लज्जित न होने के व्यापक संदर्भ के अनुकूल है। पिछले पद के कारण पत्थर की बहुमूल्यता का अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: κεφαλὴ γωνίας का स्थापत्य और मसीह-संबंधी अर्थ
  choice: मुख्य पाठ में रूपक का पारदर्शी अनुवाद ‘कोने का सिरा’ रखा गया है।
  alternative: कोने का मुख्य पत्थर / आधारशिला
  rationale: वाक्यांश मसीह के विषय में महत्वपूर्ण है, पर यूनानी शब्दावली को समय से पहले किसी एक स्थापत्य व्याख्या में सीमित नहीं किया गया। परिचित अर्थ पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धरण को काव्यात्मक पंक्तियों में रखा गया है। ‘आदर’ और ‘कोने का सिरा’ मूल की संक्षिप्तता तथा रूपकीय खुलापन बनाए रखते हैं; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
