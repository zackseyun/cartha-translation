translation:
  language: hi
  text: यदि तुमने सचमुच चखा है कि प्रभु भला है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘क्योंकि तुमने चखा है’ भी हो सकता है। यूनानी में शर्तसूचक रूप है, पर यहाँ यह शर्त को सत्य मानकर कही गई बात हो सकती है।
    reason: alternative_reading
  - marker: b
    text: ‘भला’ का अनुवाद ‘दयालु’ या ‘कृपालु’ भी किया जा सकता है। यह वाक्यांश भजन 34:8 की प्रतिध्वनि करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ
  choice: यदि … सचमुच
  rationale: यूनानी की शर्तसूचक रचना को बनाए रखते हुए ‘सचमुच’ उसके ऐसे आलंकारिक प्रयोग को व्यक्त करता है जिसमें लेखक संभवतः शर्त को सत्य मानता है।
- source_word: ἐγεύσασθε
  choice: तुमने … चखा है
  rationale: ‘चखना’ मूल रूपक को सुरक्षित रखता है और 2:2–3 के पोषण-संबंधी चित्र तथा भजन 34:8 की प्रतिध्वनि से मेल खाता है।
- source_word: ὅτι
  choice: कि
  rationale: 'यह उस अनुभव की विषय-वस्तु प्रस्तुत करता है: ‘कि प्रभु भला है’; इस प्रकार यूनानी वाक्य-विन्यास स्वाभाविक हिन्दी में बना रहता है।'
- source_word: χρηστὸς
  choice: भला
  rationale: ‘भला’ व्यापक अच्छाई और कृपालुता दोनों की संभावना खुली रखता है तथा भजन 34:8 की प्रतिध्वनि के अनुकूल है; ‘दयालु’ या ‘कृपालु’ अर्थ को अधिक संकीर्ण कर देते।
- source_word: κύριος
  choice: प्रभु
  rationale: यह κύριος का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है। इससे संदर्भ में यीशु से संबंध और भजन में प्रभु की प्रतिध्वनि—दोनों बिना अतिरिक्त व्याख्या के सुरक्षित रहते हैं।
theological_decisions:
- issue: εἰ वाले शर्तसूचक उपवाक्य का बल
  choice: 'मुख्य पाठ में वास्तविक शर्त को रखा गया: ‘यदि तुमने सचमुच चखा है’'
  alternative: ‘क्योंकि तुम चख चुके हो’ अथवा ‘जबकि तुमने चखा है’
  rationale: लेखक संभवतः पाठकों के अनुभव को वास्तविक मानता है, फिर भी यूनानी में εἰ है। ‘यदि … सचमुच’ शर्त के आलंकारिक आकार और उसके पीछे निहित अपेक्षा—दोनों को सुरक्षित रखता है।
- issue: ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में केवल ‘प्रभु’
  alternative: ‘प्रभु मसीह’
  rationale: निकट संदर्भ इसे यीशु से जोड़ता है, जबकि शब्दावली भजन 34:8 की भी प्रतिध्वनि करती है। केवल ‘प्रभु’ रखने से यह अंतर्पाठीय और धर्मवैज्ञानिक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण शैली। ‘चखा’ का ठोस रूपक जानबूझकर रखा गया है; ‘प्रभु’ परिचित बाइबलीय पदवी है और ‘भला’ व्यापक अर्थक्षेत्र को बनाए रखता है।
