id: 1PE.2.4
reference: 1 Peter 2:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πρὸς ὃν προσερχόμενοι, λίθον ζῶντα, ὑπὸ ἀνθρώπων μὲν ἀποδεδοκιμασμένον παρὰ δὲ θεῷ ἐκλεκτὸν ἔντιμον
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/004.yaml
  text: As you come to him[a], a living stone, rejected by men but chosen and precious in the sight of God[b],
translation:
  language: hi
  text: उसके पास आते हुए[a]—उस जीवित पत्थर के पास, जिसे लोगों ने तो ठुकरा दिया, पर जो परमेश्वर की दृष्टि में चुना हुआ और बहुमूल्य है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके पास तुम आ रहे हो।”
    reason: यूनानी वर्तमान कृदंत को हिंदी में कृदंतीय रूप अथवा आश्रित उपवाक्य, दोनों तरह व्यक्त किया जा सकता है; वैकल्पिक रूप चल रही क्रिया और संबोधन को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: Πρὸς ὃν
  choice: उसके पास
  rationale: πρός गति और निकट आने की दिशा व्यक्त करता है। हिंदी में ‘उसके पास’ स्वाभाविक है और यूनानी सर्वनाम को बिना उसका नाम जोड़े बनाए रखता है।
- source_word: προσερχόμενοι
  choice: आते हुए
  rationale: वर्तमान कृदंत चल रही क्रिया को व्यक्त करता है और अगले पद से व्याकरणिक संबंध बनाए रखता है। इसे आज्ञा ‘आते रहो’ बनाना मूल पाठ से अधिक स्पष्ट अर्थ आरोपित करता।
- source_word: λίθον ζῶντα
  choice: उस जीवित पत्थर
  rationale: ‘जीवित पत्थर’ मूल के विरोधाभासी रूपक और आगे आने वाले भवन-संबंधी चित्र, दोनों को सुरक्षित रखता है। संकेतवाचक ‘उस’ हिंदी में पूर्ववर्ती सर्वनाम और समानाधिकरण को स्पष्ट करता है।
- source_word: ὑπὸ ἀνθρώπων
  choice: लोगों ने
  rationale: ἄνθρωποι यहाँ सामान्यतः मनुष्यों को दर्शाता है, केवल पुरुषों को नहीं। हिंदी का कर्तृवाच्य ‘लोगों ने’ स्वाभाविक है और अगले परमेश्वर-विरोधी मूल्यांकन के साथ तुलना स्पष्ट रखता है।
- source_word: ἀποδεδοκιμασμένον
  choice: ठुकरा दिया
  rationale: यह पूर्णकालिक कर्मवाच्य कृदंत जाँच या मूल्यांकन के बाद अस्वीकार किए जाने का भाव रखता है। ‘ठुकरा दिया’ आधुनिक हिंदी में स्पष्ट और प्रभावी है।
- source_word: παρὰ δὲ θεῷ
  choice: पर परमेश्वर की दृष्टि में
  rationale: παρά + संप्रदान यहाँ परमेश्वर के मूल्यांकन या मान्यता की दृष्टि व्यक्त करता है; ‘परमेश्वर की दृष्टि में’ इसे स्वाभाविक हिंदी में संप्रेषित करता है।
- source_word: ἐκλεκτὸν
  choice: चुना हुआ
  rationale: यह सामान्य और धर्मवैज्ञानिक, दोनों अर्थों में ἐκλεκτός को सीधे व्यक्त करता है और अनावश्यक पारिभाषिक शब्दावली से बचता है।
- source_word: ἔντιμον
  choice: बहुमूल्य
  rationale: ἔντιμος का अर्थ आदरणीय अथवा अत्यधिक मूल्यवान हो सकता है। ‘बहुमूल्य’ पत्थर के रूपक और परमेश्वर के मूल्यांकन दोनों के अनुकूल है।
theological_decisions:
- issue: सर्वनाम और जीवित पत्थर का संकेत
  choice: सर्वनाम ‘उसके’ रखा गया; नाम स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘यीशु के पास’ या ‘प्रभु के पास’
  rationale: निकटवर्ती संदर्भ में संकेत प्रभु/मसीह की ओर है, किंतु इस पद में यूनानी पाठ नाम के स्थान पर संबंधवाचक सर्वनाम रखता है। अनुवाद उसी रूप को सुरक्षित रखता है।
- issue: ἀνθρώπων का विस्तार
  choice: लोगों
  alternative: मनुष्यों या पुरुषों
  rationale: यहाँ शब्द मानव मूल्यांकन का परमेश्वर के मूल्यांकन से विरोध करता है और केवल पुरुषों तक सीमित नहीं है। ‘लोगों’ आधुनिक हिंदी में सहज और अर्थ-सटीक है।
- issue: ἐκλεκτός और ἔντιμος के बीच संबंध
  choice: चुना हुआ और बहुमूल्य
  alternative: चुना हुआ, अर्थात बहुमूल्य
  rationale: मूल में दोनों समांतर विशेषण हैं। ‘और’ उनकी निकटता बनाए रखता है, पर एक को दूसरे की व्याख्या बनाकर धर्मवैज्ञानिक तनाव को नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद 5 से जुड़ी मूल कृदंतीय संरचना के कारण वाक्य को डैश पर खुला छोड़ा गया है। ‘बहुमूल्य’ पत्थर के रूपक को बनाए रखता है, जबकि ‘लोगों’ से मानव और परमेश्वर के मूल्यांकन का विरोध स्वाभाविक रूप में उभरता है।
