  edition: SBLGNT
  text: ὡς ἀρτιγέννητα βρέφη τὸ λογικὸν ἄδολον γάλα ἐπιποθήσατε, ἵνα ἐν αὐτῷ αὐξηθῆτε ⸂εἰς σωτηρίαν⸃,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/002.yaml
  text: Like newborn infants[a], long for the pure, rational milk, so that by it you may grow into salvation,
translation:
  language: hi
  text: नवजात शिशुओं के समान शुद्ध आत्मिक[a] दूध की लालसा करो, ताकि उसके द्वारा तुम [उद्धार की ओर][b] बढ़ सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मिक’ के लिए प्रयुक्त यूनानी विशेषण का अर्थ ‘बुद्धि या विवेक से संबंधित’ भी हो सकता है; इसलिए वाक्यांश का अनुवाद ‘शुद्ध तर्कसंगत’ या ‘शुद्ध विवेकसंगत दूध’ भी किया जा सकता है। यहाँ अभिप्राय शाब्दिक दूध के बजाय भीतरी पोषण से जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उद्धार की ओर’ शब्द कुछ प्राचीन यूनानी पांडुलिपियों में नहीं मिलते; इसलिए इनके मूल पाठ में होने के बारे में अनिश्चितता है।
    reason: textual_variant
lexical_decisions:
- source_word: ὡς ἀρτιγέννητα βρέφη
  choice: नवजात शिशुओं के समान
  rationale: यह पहचान नहीं, बल्कि उपमा व्यक्त करता है; ‘नवजात शिशु’ हाल ही में जन्मे बच्चों की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ λογικὸν
  choice: आत्मिक
  rationale: यहाँ दूध रूपकात्मक पोषण है। ‘आत्मिक’ उस गैर-शाब्दिक, भीतरी पोषण को सामान्य हिन्दी में स्पष्ट करता है; यूनानी शब्द की बुद्धि या विवेक से संबंधित संभावित छाया को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: ἄδολον
  choice: शुद्ध
  rationale: शब्द का अर्थ बिना मिलावट, निष्कपट या खरा है; दूध के साथ ‘शुद्ध’ संक्षिप्त और स्वाभाविक है।
- source_word: γάλα
  choice: दूध
  rationale: पोषण का मूल रूपक सीधे बनाए रखा गया है।
- source_word: ἐπιποθήσατε
  choice: लालसा करो
  rationale: यह प्रबल इच्छा व्यक्त करने वाली आज्ञा है; ‘लालसा करो’ इसकी तीव्रता को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἵνα ἐν αὐτῷ αὐξηθῆτε
  choice: ताकि उसके द्वारा तुम ... बढ़ो
  rationale: ‘उसके द्वारा’ दूध को वृद्धि का साधन बताता है; हिन्दी में अकर्मक ‘बढ़ो’ यूनानी कर्मवाच्य रूप का स्वाभाविक अर्थ देता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार की ओर
  rationale: εἰς की लक्ष्य और दिशा की शक्ति को बनाए रखता है, बिना उद्धार के वर्तमान या भविष्य संबंधी किसी विशिष्ट सम्प्रदायगत सूत्र को आरोपित किए।
theological_decisions:
- issue: दूध के रूपक में λογικός का अर्थ
  choice: मुख्य पाठ में ‘आत्मिक’
  alternative: ‘बुद्धि से संबंधित’, ‘विवेकपूर्ण’ या ‘तर्कसंगत’
  rationale: संदर्भ में दूध शाब्दिक नहीं, बल्कि नए जीवन के पोषण का रूपक है। ‘आत्मिक’ हिन्दी पाठक के लिए यह बात स्वाभाविक रूप से पहुँचाता है, जबकि शब्द की बुद्धि-विवेक संबंधी वास्तविक अर्थ-छाया पाद-टिप्पणी में खुली रखी गई है।
- issue: εἰς σωτηρίαν की दिशात्मक शक्ति
  choice: ‘उद्धार की ओर’
  alternative: ‘उद्धार के लिए’ या ‘उद्धार तक’
  rationale: यह अनुवाद उद्धार की ओर वृद्धि की दिशा को व्यक्त करता है, पर यह तय नहीं करता कि वाक्यांश को केवल वर्तमान, केवल भविष्य, या किसी विशेष धर्मसैद्धान्तिक क्रम में समझा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘शुद्ध आत्मिक दूध’ सहज धार्मिक हिन्दी है; ‘उद्धार की ओर बढ़ो’ मूल की दिशात्मकता और धर्मवैज्ञानिक तनाव दोनों को बनाए रखता है।
