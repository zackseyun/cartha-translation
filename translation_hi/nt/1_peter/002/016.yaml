source:
  edition: SBLGNT
  text: ὡς ἐλεύθεροι, καὶ μὴ ὡς ἐπικάλυμμα ἔχοντες τῆς κακίας τὴν ἐλευθερίαν, ἀλλ’ ὡς ⸂θεοῦ δοῦλοι⸃.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/016.yaml
  text: as free people[a], and not using freedom as a cover for evil, but as servants of God.
translation:
  language: hi
  text: स्वतंत्र लोगों की तरह जियो, लेकिन अपनी स्वतंत्रता को बुराई की आड़ मत बनाओ; बल्कि परमेश्वर के गुलामों[a] की तरह जियो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दासों।” यूनानी शब्द गुलाम या दास का अर्थ दे सकता है; यहाँ “गुलामों” से “स्वतंत्र लोगों” के साथ प्रबल विरोधाभास बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλεύθεροι
  choice: स्वतंत्र लोग
  rationale: यह विशेषण पूरी श्रोता-मंडली को संबोधित करता है। ‘स्वतंत्र लोग’ सामाजिक और नैतिक स्वतंत्रता का भाव बनाए रखता है और अनावश्यक रूप से केवल पुरुषों का संकेत नहीं देता।
- source_word: ἐπικάλυμμα
  choice: आड़
  rationale: इस शब्द में किसी बात को ढकने या छिपाने का रूपक है। ‘आड़’ आधुनिक हिन्दी में स्वाभाविक है और यह भाव स्पष्ट करता है कि स्वतंत्रता के पीछे बुराई छिपाई जा सकती है।
- source_word: ἔχοντες ... τὴν ἐλευθερίαν
  choice: अपनी स्वतंत्रता को ... मत बनाओ
  rationale: शाब्दिक रचना ‘स्वतंत्रता को आड़ के रूप में रखते हुए’ हिन्दी में असहज होती। निषेधात्मक आज्ञा के रूप में यह अनुवाद सहभागी पदबंध का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κακίας
  choice: बुराई
  rationale: κακία यहाँ सामान्य रूप से नैतिक दुष्टता या गलत आचरण को दर्शाता है। ‘द्वेष’ अर्थ को अनावश्यक रूप से संकीर्ण कर देता।
- source_word: δοῦλοι
  choice: गुलाम
  rationale: δοῦλοι केवल स्वैच्छिक सेवा नहीं, बल्कि स्वामित्व और पूर्ण अधीनता का प्रबल भाव रखता है। ‘गुलाम’ स्वतंत्रता के साथ जानबूझकर रखे गए विरोधाभास को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: θεοῦ δοῦλοι
  choice: परमेश्वर के गुलाम
  rationale: सम्बन्धकारक रचना परमेश्वर से सम्बन्ध और उसके अधिकार में होने, दोनों का संकेत देती है। यह पद ‘स्वतंत्र लोगों’ के साथ मूल पाठ का तनाव बनाए रखता है।
theological_decisions:
- issue: विश्वासियों की पहचान के लिए δοῦλοι का अनुवाद
  choice: परमेश्वर के गुलाम
  alternative: परमेश्वर के दास
  rationale: पद में स्वतंत्र होने और फिर भी पूरी तरह परमेश्वर के अधिकार में होने का जानबूझकर रचा गया विरोधाभास है। ‘गुलाम’ इस प्रबल तनाव को नरम नहीं करता; ‘दास’ एक मान्य विकल्प है, पर आधुनिक हिन्दी में वह कभी-कभी केवल सेवक का हल्का अर्थ दे सकता है।
- issue: यूनानी पदबंध में निहित क्रियात्मक बल
  choice: ‘जियो’ को स्पष्ट करना
  alternative: क्रियारहित पदबंध ‘स्वतंत्र लोगों के समान ... परमेश्वर के गुलामों के समान’
  rationale: यूनानी वाक्यांश प्रसंग की आज्ञा पर निर्भर है। हिन्दी में पद को स्वतंत्र और सुबोध बनाने के लिए ‘जियो’ जोड़ा गया है; इससे कोई नई धर्मवैचारिक बात नहीं आती।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘मत बनाओ’ सामान्य पाठक के लिए स्वाभाविक निषेध है। ‘गुलाम’ शब्द जानबूझकर तीखा है, क्योंकि मूल यूनानी स्वतंत्रता और परमेश्वर के पूर्ण अधिकार में होने के बीच का तनाव बनाए रखता है।
