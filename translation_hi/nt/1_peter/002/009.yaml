id: 1PE.2.9
reference: 1 Peter 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὑμεῖς δὲ γένος ἐκλεκτόν, βασίλειον ἱεράτευμα, ἔθνος ἅγιον, λαὸς εἰς περιποίησιν, ὅπως τὰς ἀρετὰς ἐξαγγείλητε τοῦ ἐκ σκότους ὑμᾶς καλέσαντος εἰς τὸ θαυμαστὸν αὐτοῦ φῶς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/009.yaml
  text: But you are a chosen people[a], a royal priesthood, a holy nation, a people for his own possession[b], so that you may proclaim the excellencies of the one who called you out of darkness into his marvelous light.
translation:
  language: hi
  text: पर तुम चुना हुआ जनसमुदाय[a], राजसी याजक-समुदाय, पवित्र राष्ट्र और उसकी अपनी प्रजा हो, ताकि तुम उसके प्रशंसनीय गुणों[b] की घोषणा कर सको, जिसने तुम्हें अंधकार में से अपनी अद्भुत ज्योति में बुलाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चुना हुआ वंश।” यूनानी शब्द वंश, कुल या जनसमुदाय को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “प्रशंसाओं” अथवा “सामर्थी कार्यों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑμεῖς δὲ
  choice: पर तुम
  rationale: δὲ पिछले पदों में अविश्वासियों के वर्णन के साथ विरोध दिखाता है, और स्पष्ट सर्वनाम Ὑμεῖς संबोधित समुदाय पर बल देता है।
- source_word: γένος ἐκλεκτόν
  choice: चुना हुआ जनसमुदाय
  rationale: γένος वंश, कुल या जनसमुदाय को सूचित कर सकता है। ‘जनसमुदाय’ सामूहिक पहचान बनाए रखता है और आधुनिक जातीय अर्थों से अनावश्यक रूप से नहीं बाँधता।
- source_word: βασίλειον ἱεράτευμα
  choice: राजकीय याजक-समुदाय
  rationale: यह निर्गमन 19:6 की प्रतिध्वनि है। ‘राजकीय’ और ‘याजक-समुदाय’ क्रमशः βασίλειον और सामूहिक ἱεράτευμα के राजसी तथा याजकीय आयामों को सुरक्षित रखते हैं।
- source_word: ἔθνος ἅγιον
  choice: पवित्र राष्ट्र
  rationale: यह सीधा अनुवाद ἅγιον के परमेश्वर के लिए अलग किए जाने के वाचाई भाव को बनाए रखता है।
- source_word: λαὸς εἰς περιποίησιν
  choice: उसकी अपनी प्रजा
  rationale: περιποίησις विशेष स्वामित्व या अपने लिए प्राप्त किए जाने का भाव देता है। ‘उसकी अपनी प्रजा’ स्वाभाविक हिन्दी में परमेश्वर से विशेष रूप से संबंधित होने का अर्थ व्यक्त करता है।
- source_word: ὅπως
  choice: ताकि
  rationale: ὅπως उद्देश्य प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में उसका स्वाभाविक समतुल्य है।
- source_word: τὰς ἀρετὰς
  choice: प्रशंसनीय गुणों
  rationale: ἀρετή उत्कृष्टता, सद्गुण या प्रशंसा के योग्य गुण का बोध करा सकता है। यहाँ बहुवचन परमेश्वर के प्रशंसनीय चरित्र और कार्यों की व्यापक ओर संकेत कर सकता है; मुख्य पाठ में ‘प्रशंसनीय गुणों’ सहज और गरिमापूर्ण है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐξαγγείλητε
  choice: घोषणा करो
  rationale: ὅπως के बाद यह इच्छित उद्देश्य को व्यक्त करता है, और क्रिया में सार्वजनिक रूप से बताने का भाव है, जिसे ‘घोषणा करो’ स्पष्ट रूप से व्यक्त करता है।
- source_word: τοῦ ... καλέσαντος
  choice: जिसने ... बुलाया है
  rationale: संबंधवाचक रचना परमेश्वर को उसके बुलाने के कार्य से पहचानती है; हिन्दी में यह स्वाभाविक रूप से मूल कृदन्तीय अर्थ को व्यक्त करती है।
- source_word: ἐκ σκότους
  choice: अंधकार में से
  rationale: ἐκ किसी क्षेत्र या दशा के भीतर से बाहर बुलाए जाने का चित्र बनाए रखता है।
- source_word: εἰς τὸ θαυμαστὸν αὐτοῦ φῶς
  choice: अपनी अद्भुत ज्योति में
  rationale: θαυμαστός के आश्चर्यजनक और विस्मयकारी भाव के लिए ‘अद्भुत’ उपयुक्त है; ‘ज्योति’ पद की गरिमामय रूपकात्मक भाषा बनाए रखती है।
theological_decisions:
- issue: इस्राएल की वाचा-संबंधी उपाधियों से ली गई सामूहिक पहचान
  choice: ‘चुना हुआ जनसमुदाय,’ ‘राजकीय याजक-समुदाय’ और ‘पवित्र राष्ट्र’ को प्रत्यक्ष सामूहिक उपाधियों के रूप में रखा गया है।
  alternative: इन्हें केवल रूपक या अमूर्त आत्मिक गुणों के रूप में नरम करके प्रस्तुत करना।
  rationale: पद जानबूझकर पुराने नियम की वाचा-संबंधी भाषा को पत्र के पाठकों पर लागू करता है। अनुवाद इस तनाव को बनाए रखता है और उससे आगे कोई विशिष्ट धर्मवैज्ञानिक व्यवस्था आरोपित नहीं करता।
- issue: λαὸς εἰς περιποίησιν में निहित स्वामी
  choice: ‘उसकी अपनी प्रजा’ कहकर परमेश्वर के स्वामित्व को स्पष्ट किया गया है।
  alternative: शाब्दिक किंतु अस्पष्ट ‘अधिकार के लिए प्रजा’ या ‘प्राप्ति के लिए प्रजा।’
  rationale: यूनानी वाक्यांश में स्वामी अलग से व्यक्त नहीं है, पर निकट संदर्भ बुलाने वाले परमेश्वर की ओर स्पष्ट संकेत करता है। हिन्दी में संबंध को स्पष्ट करना अर्थ-संगत आवश्यक स्पष्टीकरण है।
- issue: τὰς ἀρετὰς का गुणों और कार्यों तक फैला अर्थ
  choice: मुख्य पाठ में ‘प्रशंसनीय गुणों’ और पादटिप्पणी में ‘प्रशंसाओं’ अथवा ‘सामर्थी कार्यों’ की संभावना रखी गई है।
  alternative: अर्थ को केवल नैतिक सद्गुणों या केवल चमत्कारी कार्यों तक सीमित करना।
  rationale: संदर्भ परमेश्वर के प्रशंसा-योग्य स्वरूप और उसके उद्धारकारी कार्य, दोनों की ओर संकेत करने की अनुमति देता है; मूल शब्द की व्यापकता को पूरी तरह समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक संबोधन के अनुरूप रखी गई है। ‘याजक-समुदाय’ सामूहिक priesthood को स्पष्ट करता है, जबकि ‘ज्योति’ ऊँचे काव्यात्मक-बाइबलीय स्वर को बिना पुरातनता के बनाए रखती है।
