- from: पर तुम चुना हुआ जनसमुदाय[a], राजकीय याजक-समुदाय, पवित्र राष्ट्र और उसकी अपनी प्रजा हो, ताकि तुम उसके प्रशंसनीय गुणों[b] की घोषणा करो, जिसने तुम्हें अंधकार में से अपनी अद्भुत ज्योति में बुलाया है।
