review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the contrastive address, the four collective covenant titles, the purpose clause, and the movement from darkness into God's marvelous light. However, ‘राजकीय’ ordinarily suggests governmental or state-related in modern Hindi and can obscure βασίλειον’s ‘royal/kingly’ sense. The purpose construction is also more precisely conveyed by ‘घोषणा कर सको’ than by the imperative-like ‘घोषणा करो.’
  naturalness: The verse is generally clear and appropriately elevated. Replacing ‘राजकीय’ with ‘राजसी’ improves ordinary modern-Hindi comprehension, and ‘ताकि ... कर सको’ makes the syntax of purpose natural. The footnote punctuation is normalized.
  terminology: ‘जनसमुदाय,’ ‘पवित्र राष्ट्र,’ ‘उसकी अपनी प्रजा,’ ‘अंधकार,’ and ‘ज्योति’ are suitable and faithful. ‘राजसी याजक-समुदाय’ better represents ‘royal priesthood’ without importing the administrative sense of ‘राजकीय.’ ‘प्रशंसनीय गुण’ appropriately retains the breadth of ἀρετάς, with alternatives in the footnote.
  issues:
  - severity: medium
    issue: ‘राजकीय याजक-समुदाय’ can suggest a state or governmental priesthood.
    rationale: βασίλειον denotes royal or kingly character. In current Hindi, ‘राजकीय’ commonly means official/state-related, whereas ‘राजसी’ communicates the intended royal sense more directly.
  - severity: low
    issue: ‘ताकि ... घोषणा करो’ can read as an imperative rather than as a purpose-enabled action.
    rationale: ὅπως with the subjunctive introduces purpose. ‘ताकि ... घोषणा कर सको’ is natural Hindi and more clearly reflects that relationship.
  - severity: low
    issue: Footnote b has nonstandard placement of the closing quotation mark relative to the sentence punctuation.
    rationale: Normalizing the punctuation improves readability without changing the lexical alternatives.
