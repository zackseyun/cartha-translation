id: 1PE.2.12
reference: 1 Peter 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὴν ἀναστροφὴν ὑμῶν ⸂ἐν τοῖς ἔθνεσιν ἔχοντες καλήν⸃, ἵνα, ἐν ᾧ καταλαλοῦσιν ὑμῶν ὡς κακοποιῶν, ἐκ τῶν καλῶν ἔργων ⸀ἐποπτεύοντες δοξάσωσι τὸν θεὸν ἐν ἡμέρᾳ ἐπισκοπῆς.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/012.yaml
  text: Keep your conduct among the Gentiles honorable, so that, in what they slander you as evildoers, by observing your good works they may glorify God on the day of visitation.
translation:
  language: hi
  text: अन्यजातियों के बीच अपना चाल-चलन अच्छा रखो, ताकि जिस बात के विषय में वे तुम्हें कुकर्मी कहकर बदनाम करते हैं, तुम्हारे अच्छे कामों को देखकर वे उस दिन परमेश्वर की महिमा करें जिस दिन वह सुधि लेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जिस दिन वह सुधि लेगा” का अनुवाद “निरीक्षण के दिन” या “भेंट करने के दिन” भी किया जा सकता है। मूल अभिव्यक्ति परमेश्वर के कृपापूर्ण हस्तक्षेप या न्यायकारी आगमन—दोनों में से किसी की ओर संकेत कर सकती है।
    reason: ἐπισκοπή के ‘visitation/oversight’ भाव और उसके संदर्भगत खुलेपन को सुरक्षित रखने के लिए; अकेले “भेंट के दिन” की भ्रामकता से बचने के लिए।
lexical_decisions:
- source_word: ἀναστροφή
  choice: चाल-चलन
  rationale: यह शब्द व्यक्ति के समूचे व्यवहार और जीवन-ढंग को दर्शाता है; ‘चाल-चलन’ आधुनिक पाठक के लिए स्वाभाविक और व्यापक है।
- source_word: ἔθνεσιν
  choice: अन्यजातियों
  rationale: यहाँ यह शब्द विश्वासियों के बाहर के व्यापक गैर-यहूदी/मूर्तिपूजक सामाजिक परिवेश की ओर संकेत करता है। ‘अन्यजातियों’ से मूल की जातीय और धार्मिक अस्पष्टता बनी रहती है।
- source_word: καλήν / καλῶν
  choice: भला / भले
  rationale: दोनों संबद्ध यूनानी रूपों के बीच शब्दगत संबंध बनाए रखने के लिए एक ही हिन्दी मूल का प्रयोग किया गया है।
- source_word: καταλαλοῦσιν
  choice: बदनाम करते हैं
  rationale: क्रिया किसी के विरुद्ध बुरा बोलने या निंदा करने का भाव रखती है; ‘बदनाम करते हैं’ प्रसंग में स्वाभाविक है।
- source_word: ἐποπτεύοντες
  choice: अपनी आँखों से देखकर
  rationale: यह सामान्य देखने से बढ़कर प्रत्यक्ष और ध्यानपूर्वक अवलोकन का संकेत देता है।
- source_word: ἐπισκοπῆς
  choice: सुधि लेगा
  rationale: मुहावरा परमेश्वर के हस्तक्षेप या भेंट करने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है, जबकि उसका कृपापूर्ण अथवा न्यायकारी स्वर संदर्भ के लिए खुला रखता है।
theological_decisions:
- issue: ‘ἡμέρᾳ ἐπισκοπῆς’ में परमेश्वर की भेंट का स्वर
  choice: उस दिन ... जब वह सुधि लेगा
  alternative: भेंट के दिन / न्याय के दिन
  rationale: मूल पद स्वयं यह निश्चित नहीं करता कि यह कृपापूर्ण उद्धार का अवसर है या न्याय का आगमन। इसलिए किसी एक अर्थ को मुख्य पाठ में निर्णायक रूप से नहीं थोपा गया।
- issue: ‘ἐν ᾧ’ का संबंध
  choice: जिस बात में ... उसी में
  alternative: हालाँकि वे तुम्हें ... बदनाम करते हैं
  rationale: मूल का अपेक्षाकृत कठिन और अस्पष्ट संबंध सुरक्षित रखा गया है; इसे केवल विरोधसूचक ‘हालाँकि’ बनाकर सरल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘अन्यजातियों’ और ‘चाल-चलन’ जैसे परिचित बाइबलीय शब्द मूल की अर्थ-सीमा बनाए रखते हैं; कठिन यूनानी वाक्य-संबंध को अनावश्यक रूप से समतल नहीं किया गया।
