base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/014.yaml
  text: or to governors[a], as those sent by him for the punishment of evildoers and the praise of those who do good.
translation:
  language: hi
  text: या राज्यपालों के अधीन रहो, जो उसके द्वारा बुराई करनेवालों को दण्ड देने और भलाई करनेवालों की प्रशंसा करने के लिए भेजे गए हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके द्वारा’ का संकेत संभवतः पिछले पद में बताए गए राजा या सम्राट की ओर है; कुछ लोग इसे अधिक व्यापक रूप से परमेश्वर द्वारा शासन-व्यवस्था ठहराए जाने का संकेत समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: εἴτε
  choice: या
  rationale: यह पद 13 के ‘चाहे...या’ क्रम को आगे बढ़ाता है।
- source_word: ἡγεμόσιν
  choice: राज्यपालों
  rationale: नागरिक-प्रशासनिक संदर्भ में यह शासकीय अधिकारियों के लिए स्वाभाविक और पर्याप्त रूप से विशिष्ट शब्द है।
- source_word: ὡς δι’ αὐτοῦ πεμπομένοις
  choice: क्योंकि वे उसके द्वारा भेजे गए हैं
  rationale: ὡς यहाँ अधिकारियों की हैसियत अथवा आधार बताता है; διά और संबंधकारक को अभिकर्ता-सूचक ‘उसके द्वारा’ से व्यक्त किया गया है, और निकटतम पूर्वपद पद 13 का राजा/सम्राट है।
- source_word: εἰς ἐκδίκησιν
  choice: ताकि ... दण्ड दें
  rationale: शासकीय संदर्भ में ἐκδίκησις न्यायिक दण्ड दिए जाने को सूचित करता है; उद्देश्य को स्वाभाविक हिन्दी क्रियात्मक वाक्य से व्यक्त किया गया है।
- source_word: κακοποιῶν
  choice: बुराई करनेवालों
  rationale: मूल शब्द ऐसे लोगों को बताता है जिनकी पहचान बुरा करने से होती है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἔπαινον
  choice: प्रशंसा करें
  rationale: ἔπαινος का मूल भाव प्रशंसा या अनुमोदन है; समानान्तर उद्देश्य-वाक्य में क्रियात्मक रूप सहज है।
- source_word: ἀγαθοποιῶν
  choice: भलाई करनेवालों
  rationale: यह मूल के क्रियात्मक भाव को बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: δι’ αὐτοῦ में αὐτοῦ का संकेत
  choice: ‘उसके’ को पिछले पद के राजा/सम्राट का संकेत मानते हुए मुख्य पाठ में सर्वनाम को अनिर्दिष्ट रखना
  alternative: इसे परमेश्वर और उसके द्वारा व्यवस्थित शासन का संकेत समझना
  rationale: निकटतम व्याकरणिक पूर्वपद पद 13 का राजा/सम्राट है, पर मुख्य पाठ में ‘उसके’ रखने और पादटिप्पणी देने से वास्तविक व्याख्यात्मक तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। यह पिछले पद से जुड़ा वाक्यांश है, इसलिए स्पष्टता के लिए ‘अधीन रहो’ की पूर्ति की गई है।
