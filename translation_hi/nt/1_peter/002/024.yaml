id: 1PE.2.24
reference: 1 Peter 2:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς τὰς ἁμαρτίας ἡμῶν αὐτὸς ἀνήνεγκεν ἐν τῷ σώματι αὐτοῦ ἐπὶ τὸ ξύλον, ἵνα ταῖς ἁμαρτίαις ἀπογενόμενοι τῇ δικαιοσύνῃ ζήσωμεν· οὗ τῷ ⸀μώλωπι ἰάθητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/002/024.yaml
  text: He himself bore our sins in his body on the tree[a], so that, having died to sins, we might live to righteousness[c][b]. By his wound you were healed.
translation:
  language: hi
  text: उसने स्वयं हमारे पापों को अपनी देह में वृक्ष[a] पर उठा लिया, ताकि हम पापों के प्रति मरकर धार्मिकता के लिए जिएँ। उसी के घाव[b] से तुम चंगे हुए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्रूस पर”; यूनानी शब्द का शाब्दिक अर्थ “वृक्ष” या “लकड़ी” है और संभवतः व्यवस्थाविवरण 21:23 की भाषा की प्रतिध्वनि करता है।
    reason: alternative_reading
  - marker: b
    text: या “मार का निशान” या “चोट”; यूनानी शब्द एकवचन है और यशायाह 53:5 की प्रतिध्वनि करता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ चंगाई को व्यापक रूप में कहा गया है। प्रसंग इसे पापों और धार्मिकता से जोड़ता है, पर इसे केवल शारीरिक अथवा केवल आत्मिक चंगाई तक सीमित नहीं करता।
    reason: cross_reference
lexical_decisions:
- source_word: ἀνήνεγκεν
  choice: उठा लिया
  rationale: ἀναφέρω में ऊपर ले जाने, अर्पित करने और भार उठाने के अर्थ समाहित हो सकते हैं। यहाँ “उठा लिया” पापों को अपने ऊपर लेने का भाव रखता है, पर इसे केवल तकनीकी बलिदानी शब्दावली तक सीमित नहीं करता।
- source_word: ἐν τῷ σώματι αὐτοῦ
  choice: अपनी देह में
  rationale: यह यूनानी पदबंध का सीधा और साकार अनुवाद है। “स्वयं” पहले ही αὐτός का बल दे रहा है, इसलिए यहाँ अनावश्यक पुनरुक्ति नहीं की गई।
- source_word: ἐπὶ τὸ ξύλον
  choice: काठ पर
  rationale: ξύλον का मूल अर्थ लकड़ी या पेड़ है और यहाँ वह यीशु के क्रूस की ओर संकेत करता है। “काठ” मूल शब्दावली तथा व्यवस्थाविवरण 21:23 की संभावित प्रतिध्वनि को बनाए रखता है; “क्रूस” को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ταῖς ἁμαρτίαις ἀπογενόμενοι
  choice: पापों के लिए मरकर
  rationale: ἀπογίνομαι यहाँ पापों से निर्णायक अलगाव व्यक्त करता है। “पापों के लिए मरकर” आधुनिक हिन्दी में स्वाभाविक है और यूनानी के बहुवचन को भी बनाए रखता है।
- source_word: τῇ δικαιοσύνῃ
  choice: धार्मिकता के लिए
  rationale: δικαιοσύνη को “धार्मिकता” कहना नैतिक रूप से सही जीवन की दिशा व्यक्त करता है और पद के पाप-विरोधी समानांतर को सुरक्षित रखता है।
- source_word: μώλωπι
  choice: घाव
  rationale: μώλωψ मार से बने घाव या चोट को सूचित करता है। “घाव” सहज आधुनिक हिन्दी है और यशायाह 53:5 की एकवचन प्रतिध्वनि को बनाए रखता है।
- source_word: ἰάθητε
  choice: तुम चंगे हुए
  rationale: अओरिस्ट कर्मवाच्य का सीधा अर्थ रखा गया है। “चंगे हुए” शारीरिक और रूपकात्मक दोनों आयामों के लिए खुला है और अर्थ को केवल एक प्रकार की चंगाई तक सीमित नहीं करता।
- source_word: αὐτὸς
  choice: स्वयं
  rationale: यह प्रबल सर्वनाम मसीह के अपने ही द्वारा पाप उठाए जाने पर दिए गए यूनानी बल को स्पष्ट करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में चंगाई का विस्तार
  choice: “तुम चंगे हुए” को बिना केवल शारीरिक या केवल आत्मिक अर्थ निर्धारित किए रखा गया।
  alternative: इसे केवल शारीरिक चंगाई, केवल पाप से आत्मिक चंगाई, या स्पष्ट रूप से सर्वांगीण चंगाई कहना।
  rationale: निकटवर्ती प्रसंग पापों, धार्मिकता और मसीह के दुःख पर केंद्रित है, इसलिए पाप से बहाली अवश्य सम्मिलित है; फिर भी पाठ स्वयं चंगाई को किसी एक आयाम तक सीमित नहीं करता। व्यापक अभिव्यक्ति यशायाह 53 की प्रतिध्वनि और धर्मवैज्ञानिक तनाव दोनों बनाए रखती है।
- issue: ξύλον का अनुवाद
  choice: मुख्य पाठ में “काठ” रखा गया।
  alternative: “क्रूस” या “पेड़”।
  rationale: संदर्भ स्पष्टतः यीशु के क्रूस पर चढ़ाए जाने का है, पर यूनानी में σταυρός नहीं बल्कि ξύλον है। “काठ” मूल शब्द और संभावित शास्त्रीय संकेत को सुरक्षित रखता है, जबकि पादटिप्पणी आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “काठ” शास्त्रीय प्रतिध्वनि के कारण अपेक्षाकृत साहित्यिक है, इसलिए पादटिप्पणी में “क्रूस” का आशय स्पष्ट किया गया है। वाक्य-संरचना मूल यूनानी के कारण-उद्देश्य संबंध और एकवचन “घाव” को सुरक्षित रखती है।
