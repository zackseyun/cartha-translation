id: 1PE.5.1
reference: 1 Peter 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πρεσβυτέρους ⸀οὖν ἐν ὑμῖν παρακαλῶ ὁ συμπρεσβύτερος καὶ μάρτυς τῶν τοῦ Χριστοῦ παθημάτων, ὁ καὶ τῆς μελλούσης ἀποκαλύπτεσθαι δόξης κοινωνός,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/001.yaml
  text: 'Therefore I exhort the elders among you[a], as a fellow elder and a witness of the sufferings of the Messiah[b], and also a sharer in the glory that is about to be revealed:'
translation:
  language: hi
  text: 'इसलिए मैं तुम में जो प्राचीन हैं, उनसे आग्रह करता हूँ—मैं, जो सह-प्राचीन, मसीह के दुःखों का साक्षी, और उस महिमा में सहभागी हूँ जो प्रकट होने वाली है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πρεσβυτέρους
  choice: प्राचीनों
  rationale: यहाँ शब्द केवल अधिक आयु वाले पुरुषों के लिए नहीं, बल्कि कलीसिया के अगुवों के लिए प्रयुक्त है। ‘प्राचीन’ हिन्दी मसीही प्रयोग में इस भूमिका का स्थापित और अपेक्षाकृत निरपेक्ष पद है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विचार से निष्कर्षात्मक संबंध दिखाता है और यूनानी संक्रमण की तार्किक शक्ति बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच के
  rationale: व्यक्तियों के संदर्भ में ἐν का सहज हिन्दी संबंधसूचक रूप है।
- source_word: παρακαλῶ
  choice: आग्रह करता हूँ
  rationale: यह गंभीर और आत्मीय प्रेरणा व्यक्त करता है; ‘आज्ञा देता हूँ’ से अधिक कोमल और ‘निवेदन करता हूँ’ से अधिक प्रबल है।
- source_word: συμπρεσβύτερος
  choice: सह-प्राचीन
  rationale: वक्ता स्वयं को उन्हीं प्राचीनों के समान पद और उत्तरदायित्व में सहभागी बताता है; ‘सह-प्राचीन’ इस सहकर्मी भाव को संक्षेप में रखता है।
- source_word: μάρτυς
  choice: साक्षी
  rationale: यह किसी बात को देखने या उसकी गवाही देने वाले दोनों अर्थों की संभाव्यता बनाए रखता है और इसे अनावश्यक रूप से ‘शहीद’ नहीं बनाता।
- source_word: τῶν τοῦ Χριστοῦ παθημάτων
  choice: मसीह के दुखों का
  rationale: सम्बन्धकारक रचना को स्वाभाविक हिन्दी में प्रस्तुत करता है और उन दुखों को मसीह द्वारा सहे गए दुखों के रूप में समझने देता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि के रूप में अर्थपूर्ण है; ‘मसीह’ आधुनिक हिन्दी में परिचित और शीर्षकीय अर्थ को सुरक्षित रखने वाला रूप है।
- source_word: κοινωνός
  choice: सहभागी
  rationale: यह किसी वस्तु में हिस्सा पाने या सम्मिलित होने का भाव रखता है, बिना व्यापारिक साझेदारी का संकेत दिए।
- source_word: τῆς μελλούσης ἀποκαλύπτεσθαι δόξης
  choice: उस महिमा में ... जो प्रकट होने वाली है
  rationale: यह भविष्य में महिमा के प्रकट किए जाने की निष्क्रिय संरचना और अपेक्षा—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: Χριστοῦ को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: मूल शब्द का अर्थ ‘अभिषिक्त जन’ है और इस प्रसंग में उपाधि का बल बना हुआ है। परंपरागत ध्वन्यात्मक रूप को पाद-टिप्पणी में रखा गया है।
- issue: μελλούσης ἀποκαλύπτεσθαι में भविष्य और निकटता का बल
  choice: जो प्रकट होने वाली है
  alternative: जो प्रकट की जाने वाली है / जो प्रकट होने ही वाली है
  rationale: चुना हुआ रूप भविष्य की अपेक्षा को व्यक्त करता है, लेकिन ‘होने ही वाली’ जोड़कर समयगत निकटता के विषय में आवश्यकता से अधिक निश्चितता नहीं लाता।
- issue: μάρτυς का आशय
  choice: साक्षी
  alternative: गवाह / गवाही देने वाला
  rationale: ‘साक्षी’ प्रत्यक्षदर्शी होने और प्रमाणपूर्वक गवाही देने के बीच मूल में संभव तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्राचीन’ और ‘सह-प्राचीन’ कलीसियाई नेतृत्व के संदर्भ को सुरक्षित रखते हैं; वाक्य के अंत का द्विबिंदु अगले पद में आने वाले आग्रह की ओर संकेत करता है।
