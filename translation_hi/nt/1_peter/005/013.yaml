  yaml_path: translation/nt/1_peter/005/013.yaml
  text: She who is in Babylon[a], chosen together with you, greets you, and so does Mark[c][b], my son.
translation:
  language: hi
  text: बाबुल में जो तुम्हारे साथ चुनी गई है[a], वह तुम्हें नमस्कार कहती है; और मेरा पुत्र[c] मरकुस भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, अधिक व्याख्यात्मक रूप में, “बाबुल की कलीसिया, जो तुम्हारे साथ चुनी गई है।” यूनानी में स्त्रीलिंग एकवचन पद है, पर उससे जुड़ी संज्ञा निहित है।
    reason: alternative_reading
  - marker: c
    text: “मेरा पुत्र” सम्भवतः जैविक नहीं, बल्कि आत्मिक संबंध व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀσπάζεται
  choice: नमस्कार कहती है
  rationale: यह पत्र के समापन में अभिवादन भेजने का स्वाभाविक हिन्दी रूप है और स्त्रीलिंग कर्ता को भी स्पष्ट रखता है।
- source_word: ἡ ... συνεκλεκτὴ
  choice: वह, जो तुम्हारे साथ चुनी गई है
  rationale: यूनानी में स्त्रीलिंग एकवचन पद है, पर संज्ञा व्यक्त नहीं की गई। यह रूप किसी संज्ञा को जोड़े बिना उस स्त्रीलिंग और अस्पष्टता को बनाए रखता है।
- source_word: ἐν Βαβυλῶνι
  choice: बाबुल में
  rationale: मूल पाठ सीधे ‘बाबुल’ कहता है; मुख्य पाठ में इसे ‘रोम’ कहना व्याख्यात्मक निष्कर्ष होता।
- source_word: συνεκλεκτὴ
  choice: तुम्हारे साथ चुनी गई
  rationale: यह चुनाव में सहभागिता का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Μᾶρκος
  choice: मरकुस
  rationale: यह हिन्दी बाइबल परंपरा में इस नाम का प्रचलित रूप है।
- source_word: ὁ υἱός μου
  choice: मेरा पुत्र
  rationale: यह यूनानी पारिवारिक संबोधन को यथावत रखता है; आध्यात्मिक संबंध की सम्भावना टिप्पणी में दी गई है।
theological_decisions:
- issue: ἡ ... συνεκλεκτὴ का अभिप्राय
  choice: मुख्य पाठ में संदर्भित स्त्रीलिंग सत्ता को अनाम और निहित रखा गया है।
  alternative: ‘बाबुल की कलीसिया, जो तुम्हारे साथ चुनी गई है’ अथवा पतरस की पत्नी/कोई अन्य मसीही स्त्री
  rationale: यूनानी में स्त्रीलिंग एकवचन विशेषण है, पर कोई स्पष्ट संज्ञा नहीं है। ‘कलीसिया’ जोड़ने से एक सम्भव व्याख्या मुख्य पाठ में निश्चित हो जाती।
- issue: ‘बाबुल’ का अर्थ
  choice: मुख्य पाठ में ‘बाबुल’ रखा गया है।
  alternative: आरम्भिक मसीही सांकेतिक प्रयोग में रोम
  rationale: स्थान की ऐतिहासिक पहचान विवादित है, जबकि मूल पाठ स्पष्ट रूप से ‘बाबुल’ नाम देता है।
- issue: मरकुस के लिए ‘मेरा पुत्र’
  choice: शाब्दिक पारिवारिक भाषा को मुख्य पाठ में रखा गया है।
  alternative: ‘मेरा आत्मिक पुत्र’
  rationale: आत्मिक संबंध सम्भावित है, पर यूनानी पदबंध स्वयं ‘आत्मिक’ नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह, जो ... चुनी गई है’ हिन्दी में स्त्रीलिंग को प्रकट करता है, लेकिन ‘कलीसिया’ या ‘स्त्री’ जैसी अनुपस्थित संज्ञा नहीं जोड़ता। विरामचिह्न दोनों अभिवादनकर्ताओं को स्पष्ट करते हैं।
