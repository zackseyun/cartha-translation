  text: νήψατε, γρηγορήσατε. ὁ ἀντίδικος ὑμῶν διάβολος ὡς λέων ὠρυόμενος περιπατεῖ ζητῶν ⸀τινα ⸀καταπιεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/008.yaml
  text: Be clear-minded[a]; stay alert. Your adversary, the devil, walks around like a roaring lion[b], seeking someone to devour.
translation:
  language: hi
  text: सचेतचित्त रहो[a]; जागते रहो। तुम्हारा विरोधी, शैतान, गरजते हुए सिंह के समान घूमता फिरता है[b] और किसी को निगल जाने के लिए ढूँढ़ता रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संयमी रहो” या “अपने होश में रहो।” यूनानी क्रिया का मूल संबंध नशे से मुक्त रहने से है, पर नए नियम में इसका प्रयोग लाक्षणिक रूप से मानसिक स्पष्टता और अपने ऊपर नियंत्रण रखने के अर्थ में होता है।
    reason: lexical_alternative
  - marker: b
    text: या “घात लगाए घूमता है।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “घूमता फिरता है” या “इधर-उधर चलता है” है; सिंह की उपमा से घात लगाने का भाव स्वाभाविक रूप से उभरता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νήψατε
  choice: सचेत मन के रहो
  rationale: यह क्रिया मूलतः नशे से मुक्त रहने से जुड़ी है, पर यहाँ इसका प्रयोग लाक्षणिक रूप में मानसिक स्पष्टता और आत्म-संयम के लिए हुआ है। यह अनुवाद साथ आने वाले γρηγορήσατε से अर्थगत भेद भी बनाए रखता है।
- source_word: γρηγορήσατε
  choice: जागते रहो
  rationale: यह आज्ञा चौकन्नी और सतत निगरानी की भावना व्यक्त करती है; हिन्दी में यह स्वाभाविक है और νήψατε की मानसिक सचेतता को पूरक करती है।
- source_word: ἀντίδικος
  choice: विरोधी
  rationale: शब्द कानूनी प्रतिपक्षी को भी सूचित कर सकता है, पर यहाँ व्यापक रूप से शत्रुतापूर्ण विरोधी का अर्थ उपयुक्त है।
- source_word: διάβολος
  choice: शैतान
  rationale: यद्यपि शब्द का सामान्य अर्थ निंदक हो सकता है, यहाँ यह विश्वासियों के व्यक्तिगत दुष्ट विरोधी की स्थापित पदवी के रूप में प्रयुक्त है।
- source_word: ὡς λέων ὠρυόμενος
  choice: गरजते हुए सिंह के समान
  rationale: यह स्पष्ट उपमा और भयावह शिकारी का सजीव चित्र सुरक्षित रखती है।
- source_word: περιπατεῖ
  choice: घूमता फिरता है
  rationale: मूल क्रिया का सामान्य अर्थ चलना या इधर-उधर घूमना है; उपमा स्वयं शिकारी भाव प्रकट करती है, इसलिए मुख्य पाठ में अधिक व्याख्यात्मक 'घात लगाए घूमता है' नहीं रखा गया।
- source_word: ζητῶν
  choice: खोज में रहता है
  rationale: वर्तमान कृदंत निरंतर खोजने की सहवर्ती क्रिया को व्यक्त करता है।
- source_word: τινα
  choice: किसी को
  rationale: अनिश्चित एकवचन सर्वनाम का स्वाभाविक हिन्दी रूप है।
- source_word: καταπιεῖν
  choice: निगल जाने
  rationale: क्रिया का मूल अर्थ निगलना है और सिंह की उपमा में यह पूर्ण विनाश की हिंसक छवि बनाए रखती है।
theological_decisions:
- issue: διάβολος को सामान्य संज्ञा 'निंदक' माना जाए या व्यक्तिगत पदवी
  choice: शैतान
  alternative: निंदक
  rationale: संदर्भ में यह किसी सामान्य निंदक के बजाय विश्वासियों के व्यक्तिगत दुष्ट विरोधी को सूचित करता है; 'शैतान' हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्वाभाविक है।
- issue: περιπατεῖ में शिकारी भाव कितना स्पष्ट किया जाए
  choice: घूमता फिरता है
  alternative: घात लगाए घूमता है
  rationale: मुख्य पाठ यूनानी क्रिया के सामान्य अर्थ को सुरक्षित रखता है और खतरे का भाव सिंह की उपमा से आने देता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- issue: νήψατε को शाब्दिक मद्य-संयम या लाक्षणिक मानसिक सजगता के रूप में व्यक्त करना
  choice: सचेत मन के रहो
  alternative: संयमी रहो
  rationale: यहाँ मद्य या नशे का प्रत्यक्ष विरोध नहीं है। निकटवर्ती 'जागते रहो' और आगे आने वाली आत्मिक चेतावनी के संदर्भ में मानसिक स्पष्टता तथा आत्म-नियंत्रण अभिप्रेत हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। 'सचेत मन के रहो' और 'जागते रहो' के द्वारा दोनों निकटवर्ती आज्ञाओं का अर्थगत अंतर बनाए रखा गया है।
