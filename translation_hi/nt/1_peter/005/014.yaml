source:
  edition: SBLGNT
  text: ἀσπάσασθε ἀλλήλους ἐν φιλήματι ἀγάπης. εἰρήνη ὑμῖν πᾶσιν τοῖς ἐν ⸀Χριστῷ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/014.yaml
  text: Greet one another with a kiss of love[a]. Peace to all of you who are in Messiah.
translation:
  language: hi
  text: प्रेम के चुम्बन से एक-दूसरे का अभिवादन करो। तुम सबको, जो मसीह[a] में हो, शान्ति मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारम्परिक रूप से, “ख्रीस्त में।”
    reason: Χριστός के परिचित पारम्परिक ध्वन्यन्तरण को बताने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: अभिवादन करो
  rationale: यह बहुवचन आज्ञार्थक क्रिया है और पत्र के समापन में परस्पर अभिवादन करने का निर्देश देती है। ‘अभिवादन करो’ आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: ἀλλήλους
  choice: एक-दूसरे का
  rationale: यह पारस्परिक सर्वनाम है; हिन्दी में ‘एक-दूसरे का अभिवादन करो’ परस्पर क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν φιλήματι ἀγάπης
  choice: प्रेम के चुम्बन से
  rationale: ἐν यहाँ अभिवादन के ढंग या माध्यम को बताता है। ‘प्रेम के चुम्बन’ से φίλημα और ἀγάπη दोनों की अलग-अलग शाब्दिक पहचान बनी रहती है।
- source_word: εἰρήνη
  choice: शान्ति मिले
  rationale: यूनानी में यह संक्षिप्त संज्ञात्मक आशीर्वचन है। हिन्दी में ‘शान्ति मिले’ उसके आशीर्वादात्मक भाव को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘मिले’ निहित क्रिया को स्पष्ट करता है।
- source_word: ὑμῖν πᾶσιν
  choice: तुम सबको
  rationale: सम्प्रदान कारक और πᾶσιν मिलकर आशीर्वचन के सभी प्राप्तकर्ताओं को समावेशी ढंग से निर्दिष्ट करते हैं।
- source_word: τοῖς ἐν Χριστῷ
  choice: जो मसीह में हो
  rationale: लेख सहित पूर्वसर्गीय पद यहाँ संज्ञा की तरह कार्य करता है—‘वे जो ... में हैं’। Χριστός को उसके उपाधिगत अर्थ ‘अभिषिक्त जन’ के अनुरूप ‘मसीह’ किया गया है।
theological_decisions:
- issue: ἐν Χριστῷ में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस सामुदायिक और धर्मवैचारिक सूत्र में Χριστός अभिषिक्त जन की उपाधि का बोध बनाए रखता है। ‘मसीह’ आधुनिक हिन्दी में अर्थपूर्ण और प्रचलित है; पारम्परिक ध्वन्यन्तरण ‘ख्रीष्ट’ को पादटिप्पणी में रखा गया है।
- issue: ‘मसीह में’ पद का अर्थ
  choice: स्थानगत रूपक को ज्यों का त्यों रखना
  alternative: मसीह से जुड़े हुए / मसीह के लोग
  rationale: यूनानी ἐν Χριστῷ का संक्षिप्त धर्मवैचारिक रूपक सम्बन्ध, सहभागिता या एकता की अनेक छायाएँ रख सकता है। व्याख्यात्मक विस्तार से किसी एक अर्थ को निर्णायक बनाने के बजाय ‘मसीह में’ उसकी वास्तविक व्यापकता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल, गरिमापूर्ण और सामुदायिक पत्र के समापन के अनुरूप है। ‘चुम्बन’ को सांस्कृतिक रूप से सामान्यीकृत किए बिना मूल निर्देश के ठोस रूप में रखा गया है।
