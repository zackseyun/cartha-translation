  yaml_path: translation/nt/1_peter/005/007.yaml
  text: casting all your anxiety on him[c][b][a], because he cares for you.
translation:
  language: hi
  text: अपनी सारी चिंता[a] उस[c] पर डाल दो,[b] क्योंकि उसे तुम्हारी परवाह है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘चिंता’ के लिए ‘फिक्र’ या ‘व्याकुलता’ भी संभव है; यहाँ अर्थ ऐसी चिंता का है जो मन को बोझिल करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उस पर डालते हुए’ या ‘उस पर डालकर’; यह पद 6 के आग्रह से जुड़ा है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात परमेश्वर, जैसा कि पद 6 के निकटवर्ती प्रसंग से स्पष्ट है।
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσαν τὴν μέριμναν ὑμῶν
  choice: अपनी सारी चिंता
  rationale: ‘सारी’ समग्रता को बनाए रखता है; ‘चिंता’ यहाँ सामान्य देखभाल नहीं, बल्कि व्याकुल करने वाली चिंता का स्वाभाविक आधुनिक हिन्दी रूप है। ‘अपनी’ बहुवचन संबोधन के स्वामित्व-संबंध को हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: ἐπιρίψαντες ἐπ’ αὐτόν
  choice: उसी पर डाल दो
  rationale: मूल में भार को किसी पर डालने का रूपक है। हिन्दी में ‘पर डाल दो’ उसे स्पष्ट और स्वाभाविक रखता है। विधिसूचक रूप निकटवर्ती पद 6 की आज्ञा पर आश्रित यूनानी कृदन्त का व्यावहारिक बल व्यक्त करता है। ‘उसी’ प्रसंग में बताए गए परमेश्वर की ओर संकेत करता है, पर मुख्य पाठ में संज्ञा जोड़कर मूल से अधिक स्पष्ट नहीं करता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह चिंता डालने के आह्वान का कारण प्रस्तुत करता है।
- source_word: αὐτῷ μέλει περὶ ὑμῶν
  choice: उसे तुम्हारी परवाह है
  rationale: यह आधुनिक हिन्दी में सक्रिय और व्यक्तिगत सरोकार का स्वाभाविक रूप है। ‘तुम्हारी’ मूल के बहुवचन दूसरे पुरुष को व्यक्त करता है; हिन्दी में संख्या यहाँ रूप से अस्पष्ट रहती है।
theological_decisions:
- issue: αὐτόν/αὐτῷ का संदर्भ
  choice: ‘उसी/उसे’ से परमेश्वर की ओर संकेत
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर’ कहना
  rationale: पद 6 में ‘परमेश्वर के सामर्थी हाथ’ के कारण परमेश्वर स्वाभाविक संदर्भ है। फिर भी सर्वनाम बनाए रखने से यूनानी पाठ का रूप और उसकी प्रसंग-निर्भरता सुरक्षित रहती है।
- issue: ἐπιρίψαντες का वाक्यगत बल
  choice: ‘डाल दो’ के द्वारा विधिसूचक बल
  alternative: ‘डालते हुए’ या ‘डालकर’
  rationale: यूनानी में यह कृदन्त पद 6 के आग्रह पर निर्भर है। अकेले पद के रूप में ‘डालते हुए’ अधूरा और अस्पष्ट लगेगा; ‘डाल दो’ आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक रचना बताती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘फेंक दो’ की अपेक्षा ‘डाल दो’ कम बोलचाल का और रूपक के अनुकूल है। ‘परवाह है’ सामान्य पाठक के लिए सहज है और परमेश्वर के व्यक्तिगत सरोकार को व्यक्त करता है।
