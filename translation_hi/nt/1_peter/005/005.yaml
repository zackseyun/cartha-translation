source:
  edition: SBLGNT
  text: ὁμοίως, νεώτεροι, ὑποτάγητε πρεσβυτέροις. πάντες δὲ ⸀ἀλλήλοις τὴν ταπεινοφροσύνην ἐγκομβώσασθε, ὅτι Ὁ θεὸς ὑπερηφάνοις ἀντιτάσσεται ταπεινοῖς δὲ δίδωσιν χάριν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/005.yaml
  text: Likewise[a], you younger men, submit yourselves to the elders. And all of you, clothe yourselves with humility toward one another, because God opposes the proud[c][b], but gives grace to the humble.
translation:
  language: hi
  text: इसी प्रकार, हे युवा पुरुषो,[a] तुम प्राचीनों के अधीन रहो। और तुम सब एक-दूसरे के प्रति नम्रता का वस्त्र पहन लो,[b] क्योंकि “परमेश्वर घमंडियों का विरोध करता है, पर नम्रों को अनुग्रह देता है।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम जो कम उम्र के हो।” यूनानी शब्द पुल्लिंग बहुवचन (“युवा पुरुष”) है, हालाँकि कुछ लोग इसे मंडली के कम उम्र वाले सदस्यों के लिए अधिक सामान्य संबोधन मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “नम्रता को बाँध लो।” यूनानी क्रिया किसी वस्त्र को पहनने या कसकर बाँधने का चित्र प्रस्तुत करती है और जानबूझकर नम्रता धारण करने पर बल देती है।
    reason: lexical_alternative
  - marker: c
    text: नीतिवचन 3:34 के यूनानी अनुवाद से उद्धरण या संकेत।
    reason: cross_reference
lexical_decisions:
- source_word: ὁμοίως
  choice: इसी प्रकार
  rationale: यह पिछले निर्देशों से इस उपदेश का संबंध दिखाने वाला स्वाभाविक और संक्षिप्त कथन है।
- source_word: νεώτεροι
  choice: हे जवान पुरुषो
  rationale: यूनानी शब्द संबोधन में पुल्लिंग बहुवचन है और प्राचीनों के समानांतर जवान पुरुषों को संबोधित करता है; पादटिप्पणी अधिक सामान्य संभावित अर्थ बताती है।
- source_word: ὑποτάγητε
  choice: अधीन रहो
  rationale: आज्ञार्थक प्रयोग स्वेच्छा से अधिकार मानने और अधीन होने का भाव व्यक्त करता है; यह आधुनिक हिन्दी में सहज है।
- source_word: πρεσβυτέροις
  choice: प्राचीनों
  rationale: निकटवर्ती संदर्भ 5:1–4 में कलीसिया के प्राचीनों की बात है, इसलिए केवल अधिक उम्र के पुरुषों के बजाय मान्य अगुओं का अर्थ अधिक संभावित है।
- source_word: πάντες δὲ ἀλλήλοις
  choice: और तुम सब एक-दूसरे के प्रति
  rationale: यह संबोधन को जवान पुरुषों से बढ़ाकर पूरे समुदाय पर लागू करता और पारस्परिक संबंध स्पष्ट करता है।
- source_word: ταπεινοφροσύνην
  choice: दीनता
  rationale: यह नम्र मनोवृत्ति और अपने को ऊँचा न मानने का भाव संक्षेप में व्यक्त करता है तथा आगे के ‘दीनों’ से शब्दगत संबंध बनाए रखता है।
- source_word: ἐγκομβώσασθε
  choice: वस्त्र के समान बाँध लो
  rationale: क्रिया किसी वस्त्र या एप्रन को कसकर पहनने अथवा बाँधने का सजीव रूपक रखती है; यह अनुवाद रूपक को मिटाता नहीं है।
- source_word: ὑπερηφάνοις ἀντιτάσσεται
  choice: घमंडियों का विरोध करता है
  rationale: यह परमेश्वर के सक्रिय रूप से उनके विरुद्ध खड़े होने का प्रबल और स्पष्ट भाव देता है।
- source_word: ταπεινοῖς δὲ δίδωσιν χάριν
  choice: पर दीनों को अनुग्रह देता है
  rationale: ‘अनुग्रह’ χάρις का परिचित धार्मिक किंतु सुबोध समतुल्य है; विरोधसूचक ‘पर’ यूनानी δέ को स्पष्ट करता है।
theological_decisions:
- issue: πρεσβυτέροις का अभिप्राय
  choice: कलीसिया के प्राचीन
  alternative: सामान्य रूप से अधिक उम्र के पुरुष
  rationale: तत्काल पूर्ववर्ती संदर्भ में प्राचीनों को मंडली की चरवाही का दायित्व दिया गया है, इसलिए यहाँ वही समूह सर्वाधिक संभावित है।
- issue: νεώτεροι का लिंग और विस्तार
  choice: जवान पुरुष
  alternative: तुम जो उम्र में छोटे हो / जवान लोग
  rationale: मूल रूप पुल्लिंग बहुवचन है, इसलिए मुख्य पाठ उसका लिंगगत रूप बनाए रखता है; संभावित व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: नीतिवचन 3:34 के कथन का स्वरूप
  choice: उद्धरण-चिह्नों सहित शास्त्रीय कथन
  alternative: बिना उद्धरण-चिह्न के लेखक का सीधा कथन
  rationale: शब्दांकन नीतिवचन 3:34 के यूनानी पाठ का स्पष्ट उद्धरण या निकट संकेत है; पादटिप्पणी स्रोत बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सार्वजनिक पाठ के योग्य स्तर रखा गया है। ‘हे जवान पुरुषो’ मूल के स्पष्ट संबोधन और पुल्लिंग को सुरक्षित रखता है; ‘प्राचीन’ कलीसियाई संदर्भ में स्वाभाविक है। वस्त्र बाँधने का रूपक जानबूझकर बनाए रखा गया है, जबकि पादटिप्पणी उसका शाब्दिक आयाम स्पष्ट करती है।
