source:
  edition: SBLGNT
  text: καὶ φανερωθέντος τοῦ ἀρχιποίμενος κομιεῖσθε τὸν ἀμαράντινον τῆς δόξης στέφανον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/004.yaml
  text: And when the Chief Shepherd is revealed[b][a], you will receive the unfading crown of glory.
translation:
  language: hi
  text: और जब प्रधान चरवाहा प्रकट होगा[a], तब तुम महिमा का वह मुकुट[b] पाओगे जो कभी मुरझाता नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दिखाई देगा।”
    reason: alternative_reading
  - marker: b
    text: “मुकुट” का यूनानी शब्द सम्मान के पुरस्कार के रूप में दी जाने वाली विजय-माला को भी दर्शा सकता है; यह विशेष रूप से राजकीय मुकुट का शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: φανερωθέντος
  choice: जब ... प्रकट होगा
  rationale: यह संबंधकारक निरपेक्ष रचना में प्रयुक्त एओरिस्ट कर्मवाच्य कृदंत है और समय का भाव देती है। ‘प्रकट होगा’ स्वाभाविक हिन्दी में प्रकट होने/दिखाई देने की घटना को व्यक्त करता है; यूनानी कर्मवाच्य का अधिक स्पष्ट रूप ‘प्रकट किया जाएगा’ यहाँ अस्वाभाविक और अनावश्यक रूप से किसी अलग कर्ता पर बल देता।
- source_word: ἀρχιποίμενος
  choice: प्रधान चरवाहा
  rationale: यह संयुक्त शब्द सर्वोच्च या मुख्य चरवाहे को दर्शाता है। ‘प्रधान चरवाहा’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और प्रसंग के अनुरूप मसीह-संबंधी उपाधि है।
- source_word: κομιεῖσθε
  choice: पाओगे
  rationale: भविष्यत् मध्यमवाच्य क्रिया यहाँ पुरस्कार प्राप्त करने का अर्थ देती है। ‘पाओगे’ सहज और संक्षिप्त है तथा निष्क्रिय ‘दिया जाएगा’ की अपेक्षा प्राप्ति के भाव को बनाए रखता है।
- source_word: ἀμαράντινον
  choice: जो कभी मुरझाता नहीं
  rationale: विशेषण का अर्थ ताजगी या शोभा न खोने वाला है। यह मुहावरेदार हिन्दी यूनानी बिंब को स्पष्ट रखती है और ‘अविनाशी’ जैसा अधिक व्यापक अर्थ नहीं जोड़ती।
- source_word: τῆς δόξης
  choice: महिमा का
  rationale: संबंधकारक रचना को बनाए रखने से संक्षिप्त रूपक और उसकी संभावित अर्थ-व्याप्ति सुरक्षित रहती है; इसे केवल ‘महिमामय’ विशेषण में नहीं बदला गया।
- source_word: στέφανον
  choice: मुकुट
  rationale: στέφανος सम्मान या विजय के पुरस्कार के रूप में पहनाई जाने वाली माला अथवा मुकुट को दर्शा सकता है, न कि अनिवार्यतः राजकीय मुकुट को। मुख्य पाठ में ‘मुकुट’ परिचित और पठनीय है; विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ‘प्रधान चरवाहा’ की पहचान
  choice: प्रसंग में यीशु के लिए प्रयुक्त मसीह-संबंधी उपाधि
  alternative: मुख्य पाठ में नाम जोड़कर ‘प्रधान चरवाहा यीशु’ कहना
  rationale: चरवाही के निकटवर्ती प्रसंग और भावी प्रकटन के कारण संकेत यीशु की ओर है, पर मूल पाठ नाम को स्पष्ट रूप से नहीं जोड़ता; इसलिए उपाधि को बिना विस्तार के रखा गया है।
- issue: अंतकालीन प्रकटन की भाषा
  choice: प्रकट होगा
  alternative: दिखाई देगा / प्रकट किया जाएगा
  rationale: यह अभिव्यक्ति यूनानी के प्रकटन-विषयक भाव को स्वाभाविक हिन्दी में बनाए रखती है और घटना की रीति या कर्ता को मूल से अधिक निश्चित नहीं करती।
- issue: ‘महिमा का मुकुट’ में संबंधकारक का अर्थ
  choice: ‘महिमा का’ संरचना को बनाए रखना
  alternative: ‘महिमामय मुकुट’ या ‘महिमा-रूपी मुकुट’
  rationale: यूनानी संबंधकारक महिमा से युक्त मुकुट या महिमा को ही पुरस्कार के रूप में समझने जैसी अर्थ-छटाओं के लिए खुला है। मूल संरचना इस वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘चरवाहा’ सामान्य पाठक के लिए ‘चरवाहे’ या संस्कृतनिष्ठ विकल्पों से अधिक सहज है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद रखे गए हैं।
