translation:
  language: hi
  text: जो लोग तुम्हारी देखरेख के लिए तुम्हें सौंपे गए हैं, उन पर प्रभुता न जताओ[a], बल्कि झुंड के लिए आदर्श बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हिस्से में आए लोगों पर प्रभुता न जताओ।” यूनानी में शाब्दिक रूप से “भागों/आवंटित हिस्सों” का उल्लेख है; यहाँ संभवतः परमेश्वर के झुंड के वे हिस्से अभिप्रेत हैं जो अलग-अलग प्राचीनों की देखरेख के लिए सौंपे गए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: μηδ’ ὡς
  choice: न ... जताओ
  rationale: यह पिछले पद के निषेध को आगे बढ़ाते हुए चरवाही के एक अनुचित ढंग को रोकता है। हिंदी में निषेधात्मक आज्ञा इस आशय को स्वाभाविक रूप से व्यक्त करती है।
- source_word: κατακυριεύοντες
  choice: प्रभुता न जताओ
  rationale: यह केवल नेतृत्व करने को नहीं, बल्कि अधिकार का दबावपूर्ण और निरंकुश ढंग से प्रयोग करने को दर्शाता है। ‘प्रभुता जताना’ इस नकारात्मक भाव को स्पष्ट रखता है।
- source_word: τῶν κλήρων
  choice: जो लोग तुम्हारी देखरेख में सौंपे गए हैं
  rationale: शाब्दिक अर्थ ‘भाग/बाँटे गए हिस्से’ है। संदर्भ में यह परमेश्वर के झुंड के उन हिस्सों, अर्थात लोगों, की ओर संकेत करता है जिनकी देखभाल अलग-अलग प्राचीनों को सौंपी गई थी। मुख्य पाठ अर्थ को सहज हिंदी में देता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: निषिद्ध आचरण और अपेक्षित आचरण के बीच प्रबल विरोध व्यक्त करता है।
- source_word: τύποι
  choice: आदर्श
  rationale: यह अनुकरण करने योग्य नमूने या उदाहरण को दर्शाता है; ‘आदर्श’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: γινόμενοι
  choice: बनो
  rationale: मूल कृदंत में व्यवहार द्वारा ऐसा हो जाने का गतिशील भाव है। हिंदी में ‘बनो’ उस भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: τοῦ ποιμνίου
  choice: झुंड के लिए
  rationale: विश्वासियों के समुदाय के लिए प्रयुक्त चरवाही-रूपक को ‘झुंड’ सीधे और परिचित ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: कलीरोन (κλήρων) और कलीसियाई नेतृत्व का संबंध
  choice: यह प्राचीनों की देखरेख में सौंपे गए लोगों को दर्शाता है, उनकी संपत्ति को नहीं
  alternative: ‘भागों/हिस्सों’ का केवल शाब्दिक अनुवाद, या प्राचीनों के अधिकार-क्षेत्र
  rationale: निकटवर्ती संदर्भ परमेश्वर के झुंड की चरवाही का है। यह अनुवाद स्वामित्व के बजाय सौंपे गए दायित्व को प्रमुख रखता है, जबकि पादटिप्पणी मूल रूपक को बताती है।
- issue: कटाक्यूरिएउओ (κατακυριεύω) का बल
  choice: अधिकार के दबावपूर्ण और निरंकुश प्रयोग का निषेध
  alternative: प्राचीनों द्वारा किसी भी प्रकार के नेतृत्व का निषेध
  rationale: क्रिया का नकारात्मक बल प्रभुतापूर्ण दुरुपयोग पर है। पद नेतृत्व को समाप्त नहीं करता, बल्कि प्रभुता जताने के विपरीत आदर्श बनने को कहता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली अपनाई गई है। मूल यूनानी के कृदंतों को हिंदी में निषेधात्मक और सकारात्मक आज्ञाओं के रूप में रखा गया है, क्योंकि पिछले पद से जुड़े उनके निर्देशात्मक बल को हिंदी में यही रूप स्वाभाविक ढंग से व्यक्त करता है।
