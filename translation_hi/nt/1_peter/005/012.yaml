source:
  edition: SBLGNT
  text: Διὰ Σιλουανοῦ ὑμῖν τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι, δι’ ὀλίγων ἔγραψα, παρακαλῶν καὶ ἐπιμαρτυρῶν ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ· εἰς ἣν ⸀στῆτε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/012.yaml
  text: Through Silvanus[a], the faithful brother, as I regard him, I have written to you briefly, exhorting and testifying that this is the true grace of God[b]. Stand firm in it.
translation:
  language: hi
  text: सिलवानुस के द्वारा, जिसे मैं एक विश्वासयोग्य भाई मानता हूँ, मैंने तुम्हें थोड़े शब्दों में लिखा है, तुम्हें प्रोत्साहित करते और इस बात की गवाही देते हुए कि यही परमेश्वर का सच्चा अनुग्रह है। इसमें दृढ़ बने रहो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: कुछ हस्तलिपियों में “जिसमें तुम स्थिर खड़े हो” है।
    reason: मुख्य पाठ के आज्ञार्थक στῆτε के स्थान पर विधानार्थक पाठांतर को दर्ज करना।
lexical_decisions:
- source_word: Διὰ Σιλουανοῦ
  choice: सिलवानुस के द्वारा
  rationale: διά के साथ संबंधकारक माध्यम या अभिकर्ता का बोध कराता है। यह अनुवाद सिलवानुस की भूमिका को पत्रवाहक या लेखक-सहायक के रूप में अनावश्यक रूप से निश्चित किए बिना मूल अर्थ बनाए रखता है।
- source_word: τοῦ πιστοῦ ἀδελφοῦ, ὡς λογίζομαι
  choice: जिसे मैं विश्वासयोग्य भाई मानता हूँ
  rationale: πιστός के लिए ‘विश्वासयोग्य’ निष्ठावान और भरोसेमंद दोनों भावों को समेटता है; λογίζομαι पतरस के निजी आकलन को व्यक्त करता है।
- source_word: δι’ ὀλίγων ἔγραψα
  choice: तुम्हें थोड़े शब्दों में लिखा है
  rationale: मुहावरे का आशय संक्षेप में लिखना है। ‘थोड़े शब्दों में’ मूल अभिव्यक्ति को निकटता से रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: παρακαλῶν
  choice: प्रोत्साहित किया
  rationale: संदर्भ में παρακαλέω आग्रह, उत्साह और उपदेश का भाव रखता है। ‘प्रोत्साहित’ सामान्य आधुनिक हिन्दी में गंभीर प्रेरणा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιμαρτυρῶν
  choice: गवाही दी है
  rationale: यह क्रिया गंभीर पुष्टि या साक्ष्य देने का भाव रखती है; ‘गवाही दी’ उसकी साक्ष्यात्मक शक्ति बनाए रखता है।
- source_word: ταύτην εἶναι ἀληθῆ χάριν τοῦ θεοῦ
  choice: कि यही परमेश्वर का सच्चा अनुग्रह है
  rationale: ‘यही’ निकटवर्ती संदेश या वर्णित वास्तविकता की ओर संकेत करता है, पर उसके दायरे को अनावश्यक रूप से सीमित नहीं करता। ‘सच्चा अनुग्रह’ ἀληθῆ χάριν का सीधा और धर्मशास्त्रीय रूप से निष्पक्ष अनुवाद है।
- source_word: εἰς ἣν στῆτε
  choice: इसमें दृढ़ बने रहो
  rationale: στῆτε यहाँ आज्ञार्थक है और स्थिरता की मांग करता है। ‘दृढ़ बने रहो’ हिन्दी में निरंतर अटल रहने का स्वाभाविक भाव देता है।
theological_decisions:
- issue: ‘यही’ (ταύτην) का संदर्भ
  choice: संकेत को व्यापक रखा गया है ताकि वह पत्र में व्यक्त संदेश और परमेश्वर के अनुग्रह की गवाही की ओर संकेत कर सके।
  alternative: इसे केवल पाठकों के वर्तमान अनुभव या केवल सिलवानुस द्वारा पहुँचाए गए सुसमाचार तक सीमित करना।
  rationale: लेखन, प्रोत्साहन और गवाही का निकट संदर्भ व्यापक संकेत का समर्थन करता है; मूल पाठ इसके दायरे को पूरी तरह स्पष्ट नहीं करता।
- issue: अंतिम क्रिया στῆτε का पाठ और भाव
  choice: 'आज्ञार्थक: ‘इसमें दृढ़ बने रहो।’'
  alternative: 'पाठांतर के अनुसार विधानार्थक: ‘जिसमें तुम स्थिर खड़े हो।’'
  rationale: दिए गए SBLGNT पाठ में στῆτε आज्ञार्थक है; पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सहज शैली। ‘तुम्हें/रहो’ बहुवचन संबोधन के रूप में प्रयुक्त हैं। निजी नाम को यूनानी रूप के अनुसार ‘सिलवानुस’ रखा गया है।
