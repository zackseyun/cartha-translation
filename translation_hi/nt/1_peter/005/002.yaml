source:
  edition: SBLGNT
  text: ποιμάνατε τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ, ⸀ἐπισκοποῦντες μὴ ἀναγκαστῶς ἀλλὰ ἑκουσίως ⸂κατὰ θεόν⸃, μηδὲ αἰσχροκερδῶς ἀλλὰ προθύμως,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/002.yaml
  text: Shepherd the flock of God among you[a], exercising oversight not under compulsion but willingly, according to God; nor for shameful gain, but eagerly.
translation:
  language: hi
  text: परमेश्वर के उस झुंड की चरवाही करो जो तुम्हारे बीच में है। उसकी देखरेख मजबूरी में नहीं, बल्कि अपनी इच्छा से, परमेश्वर के अनुसार[a] करो; और शर्मनाक लाभ के लिए नहीं, बल्कि उत्साह से करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “जैसा परमेश्वर चाहता है” या “परमेश्वर की इच्छा के अनुसार”
    reason: 'वैकल्पिक अर्थ: κατὰ θεόν संक्षिप्त है और इसे परमेश्वर की इच्छा अथवा उसके अनुरूप रीति के रूप में समझा जा सकता है।'
lexical_decisions:
- source_word: ποιμάνατε
  choice: चरवाही करो
  rationale: आज्ञार्थक क्रिया में चरवाहे का रूपक सुरक्षित रहता है और इसे बाद के तकनीकी पदनाम ‘पास्टर’ में नहीं बदला जाता।
- source_word: τὸ ἐν ὑμῖν ποίμνιον τοῦ θεοῦ
  choice: परमेश्वर के उस झुंड ... जो तुम्हारे बीच है
  rationale: ‘झुंड’ मूल रूपक और ‘परमेश्वर के’ उसके स्वामित्व को स्पष्ट रखता है; ‘तुम्हारे बीच’ प्राचीनों के स्वामित्व के बजाय स्थानीय/संबंधपरक अर्थ देता है।
- source_word: ἐπισκοποῦντες
  choice: उसकी देखरेख ... करो
  rationale: कृदंत को मुख्य आज्ञा के साथ स्वाभाविक हिन्दी में जोड़ा गया है; यह देखभाल और निगरानी की गतिविधि बताता है, किसी विशिष्ट कलीसियाई पद का नाम नहीं।
- source_word: μὴ ἀναγκαστῶς
  choice: मजबूरी में नहीं
  rationale: यह दबाव या बाध्यता से सेवा करने का अर्थ सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ ἑκουσίως
  choice: बल्कि अपनी इच्छा से
  rationale: यह बाध्यता के विपरीत स्वेच्छापूर्वक सेवा करने का स्पष्ट अर्थ देता है।
- source_word: κατὰ θεόν
  choice: परमेश्वर के अनुसार
  rationale: मूल का संक्षिप्त और अर्थगर्भित वाक्यांश रखा गया है, ताकि इसे केवल ‘परमेश्वर की इच्छा’ या किसी एक व्याख्या तक सीमित न किया जाए।
- source_word: μηδὲ αἰσχροκερδῶς
  choice: और नीच कमाई के लिए नहीं
  rationale: यह अनुचित और नैतिक रूप से लज्जाजनक लाभ की प्रेरणा को व्यक्त करता है; ‘नीच कमाई’ साधारण पाठक के लिए स्पष्ट और प्रभावशाली है।
- source_word: ἀλλὰ προθύμως
  choice: बल्कि तत्परता से
  rationale: यह तैयार और उत्सुक भाव से सेवा करने का अर्थ देता है तथा पहले आए ‘अपनी इच्छा से’ से आवश्यक भेद बनाए रखता है।
theological_decisions:
- issue: क्या ἐπισκοποῦντες को तकनीकी कलीसियाई पद के रूप में अनुवाद किया जाए
  choice: गतिविधि के रूप में ‘देखरेख ... करो’
  alternative: ‘अध्यक्षों के रूप में सेवा करो’ या ‘बिशप का पद निभाओ’
  rationale: यह कृदंत संदर्भ में प्राचीनों से अपेक्षित कार्य बताता है; तकनीकी पदनाम देने से किसी बाद की विशिष्ट कलीसियाई व्यवस्था को पाठ में आरोपित करने का जोखिम होता।
- issue: κατὰ θεόν की व्याख्या कितनी स्पष्ट की जाए
  choice: मुख्य पाठ में ‘परमेश्वर के अनुसार’, और अर्थ-स्पष्टीकरण पादटिप्पणी में
  alternative: ‘परमेश्वर की इच्छा के अनुसार’ या ‘जैसा परमेश्वर चाहता है’
  rationale: मूल वाक्यांश अर्थ की दृष्टि से संक्षिप्त है और परमेश्वर की इच्छा, मानक या अपेक्षित रीति की ओर संकेत कर सकता है; शाब्दिक रूप इस अर्थगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। चरवाहे और झुंड का रूपक बनाए रखा गया है। ‘देखरेख’ गैर-सांप्रदायिक है, जबकि ‘नीच कमाई’ αἰσχροκερδῶς की नैतिक तीव्रता व्यक्त करती है।
