base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/006.yaml
  text: Humble yourselves[a], therefore, under the mighty hand of God, so that he may exalt you at the proper time,
translation:
  language: hi
  text: इसलिए परमेश्वर के सामर्थी हाथ के नीचे अपने आपको नम्र करें[a], ताकि वह उचित समय पर आपको ऊँचा उठाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, शाब्दिक रूप से, “नम्र किए जाएँ ... ताकि वह उचित समय पर आपको ऊँचा उठाए।” यूनानी आज्ञार्थक क्रिया रूप में कर्मवाच्य है, हालाँकि यहाँ सामान्यतः उसका आत्मवाचक भाव समझा जाता है: “अपने आपको नम्र करें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ταπεινώθητε
  choice: अपने आपको दीन करें
  rationale: रूप की दृष्टि से यह यूनानी क्रिया कर्मवाच्य आज्ञार्थक है, पर इस उपदेशात्मक प्रसंग में इसका आत्मवाचक भाव स्वाभाविक है। यह हिंदी प्रयोग आज्ञा और परमेश्वर के अधीन स्वेच्छापूर्वक नम्र होने—दोनों को स्पष्ट रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन—परमेश्वर घमंडियों का विरोध करता और दीनों पर अनुग्रह करता है—से निकला निष्कर्ष दर्शाता है।
- source_word: ὑπὸ τὴν κραταιὰν χεῖρα τοῦ θεοῦ
  choice: परमेश्वर के सामर्थी हाथ के नीचे
  rationale: यह परमेश्वर की प्रबल और प्रभुतापूर्ण कार्रवाई का बाइबलीय रूपक है। ‘सामर्थी हाथ’ आधुनिक हिंदी में स्वाभाविक रहते हुए मूल रूपक को बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम प्रस्तुत करता है और आधुनिक हिंदी में संक्षिप्त तथा स्वाभाविक है।
- source_word: ὑμᾶς ὑψώσῃ
  choice: वह ... आपको ऊँचा उठाए
  rationale: पूर्ववर्ती पदबंध से कर्ता परमेश्वर समझा जाता है। ‘ऊँचा उठाए’ सम्मान, पुनर्स्थापन या न्यायोचित प्रतिष्ठा दिए जाने की अर्थ-व्याप्ति रखता है और केवल शारीरिक उठाने तक सीमित नहीं है।
- source_word: ἐν καιρῷ
  choice: उचित समय पर
  rationale: καιρός मात्र कालक्रम नहीं, बल्कि उपयुक्त अथवा निर्धारित अवसर को सूचित करता है। ‘उचित समय पर’ इस भाव को स्पष्ट आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: Ταπεινώθητε में वाच्य और कर्तृत्व
  choice: आज्ञा को आत्मवाचक भाव में ‘अपने आपको दीन करें’ अनूदित किया गया है, जबकि ‘परमेश्वर के सामर्थी हाथ के नीचे’ मनुष्य की दीनता को परमेश्वर के अधीन समर्पण के रूप में स्पष्ट करता है।
  alternative: ‘दीन किए जाएँ’—यह यूनानी के कर्मवाच्य रूप को अधिक प्रत्यक्ष दिखाता है, पर हिंदी में अस्पष्ट या अस्वाभाविक लग सकता है।
  rationale: 'यह अनुवाद मनुष्य की उत्तरदायित्वपूर्ण प्रतिक्रिया और परमेश्वर के प्रभुतापूर्ण कर्तृत्व के बीच तनाव को बनाए रखता है: विश्वासी उसके सामने दीन होते हैं और वही उचित समय पर उन्हें ऊँचा उठाता है।'
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सामर्थी हाथ’ का मूल बाइबलीय रूपक और ‘ऊँचा उठाए’ की धार्मिक-सामाजिक अर्थ-व्याप्ति सुरक्षित है।
