  text: To him be the dominion forever and ever[a]. Amen.
translation:
  language: hi
  text: उसी का प्रभुत्व युगानुयुग रहे। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτῷ
  choice: उसी का
  rationale: एकवचन संप्रदानवाचक सर्वनाम पिछले संदर्भ में परमेश्वर की ओर संकेत करता है। हिन्दी में संबंधवाचक रचना ‘उसी का’ स्वाभाविक रूप से इस स्तुतिवाक्य का भाव व्यक्त करती है।
- source_word: κράτος
  choice: प्रभुत्व
  rationale: स्तुतिवाक्य में यह शब्द केवल सामर्थ्य नहीं, बल्कि प्रभावी शासकीय शक्ति और सार्वभौम अधिकार को दर्शाता है; ‘प्रभुत्व’ इस अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह प्रबल यूनानी कालसूचक मुहावरा अंतहीन अवधि व्यक्त करता है। ‘युगानुयुग’ हिन्दी बाइबलीय शैली में संक्षिप्त, सुबोध और स्वाभाविक समतुल्य है।
- source_word: ἀμήν
  choice: आमीन
  rationale: परंपरागत लिप्यंतरण उपासना-संबंधी समापन और दृढ़ पुष्टि, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: स्तुतिवाक्य में निहित क्रियात्मक विधेय
  choice: उसी का प्रभुत्व युगानुयुग रहे
  alternative: प्रभुत्व उसी का है युगानुयुग
  rationale: यूनानी पाठ में स्पष्ट क्रिया नहीं है। ‘रहे’ जोड़ने से हिन्दी वाक्य पूरा और स्वाभाविक बनता है तथा स्तुतिपरक कामनार्थक स्वर बना रहता है; इसे केवल तथ्यात्मक कथन के रूप में सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण स्तुतिपरक शैली। ‘उसी’ पिछले संदर्भ के परमेश्वर पर बल देता है। मूल वाक्यांश का अर्थ स्वाभाविक हिन्दी में स्पष्ट होने के कारण पादटिप्पणी आवश्यक नहीं मानी गई।
