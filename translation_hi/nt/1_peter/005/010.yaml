reference: 1 Peter 5:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ θεὸς πάσης χάριτος, ὁ καλέσας ὑμᾶς εἰς τὴν αἰώνιον αὐτοῦ δόξαν ἐν ⸀Χριστῷ, ὀλίγον παθόντας αὐτὸς ⸀καταρτίσει, στηρίξει, σθενώσει, ⸀θεμελιώσει.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/010.yaml
  text: And the God of all grace, who called you into his eternal glory in Messiah, after you have suffered a little while, will himself restore, establish, strengthen, and ground you.
translation:
  language: hi
  text: और समस्त अनुग्रह का परमेश्वर, जिसने आपको मसीह में अपनी अनन्त महिमा में बुलाया है, थोड़ी देर तक दुःख सहने के बाद स्वयं आपको बहाल करेगा,[a] स्थिर करेगा, बलवन्त करेगा और दृढ़ नींव पर स्थापित करेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपको पूर्ण बनाएगा” अथवा “ठीक दशा में लाएगा।” यूनानी क्रिया में किसी वस्तु या व्यक्ति को सुधारकर उचित दशा में लाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “आपको नींव पर स्थापित करेगा” अथवा “आपकी नींव डालेगा।” यूनानी क्रिया में नींव का रूपक निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάσης χάριτος
  choice: समस्त अनुग्रह का
  rationale: यह संबंधवाचक पद परमेश्वर को हर प्रकार के अनुग्रह के स्रोत के रूप में प्रस्तुत करता है; ‘समस्त’ व्यापकता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: καλέσας ὑμᾶς
  choice: जिसने आपको ... बुलाया है
  rationale: यूनानी अओरिस्ट कृदन्त को हिन्दी में पूर्ण क्रिया वाले संबंधवाचक उपवाक्य से सहज रूप दिया गया है; आदरसूचक बहुवचन ‘आपको’ मूल के बहुवचन को भी बनाए रखता है।
- source_word: εἰς τὴν αἰώνιον αὐτοῦ δόξαν
  choice: अपनी अनन्त महिमा के लिए
  rationale: यहाँ εἰς बुलाहट के लक्ष्य को सूचित करता है। ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक है और उस महिमा की ओर बुलाए जाने का भाव रखता है, बिना स्थानगत अर्थ को अनावश्यक रूप से कठोर किए।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: ἐν Χριστῷ की प्रचलित पौलुसी/आरम्भिक मसीही अभिव्यक्ति को ‘मसीह में’ सीधे और अर्थपूर्ण ढंग से सुरक्षित रखा गया है।
- source_word: ὀλίγον παθόντας
  choice: आपके थोड़ी देर दुःख सह लेने के बाद
  rationale: ὀλίγον को कालवाचक रूप से ‘थोड़ी देर’ लिया गया है और कृदन्त को मुख्य भावी क्रियाओं से पहले घटने वाली सीमित अवधि की पीड़ा के रूप में व्यक्त किया गया है।
- source_word: αὐτός
  choice: स्वयं
  rationale: बलसूचक सर्वनाम यह रेखांकित करता है कि ये कार्य परमेश्वर स्वयं करेगा।
- source_word: καταρτίσει
  choice: बहाल करेगा
  rationale: क्रिया में किसी को उचित दशा में लाने, सुधारने या पूर्ण रूप से तैयार करने का भाव है; दुःख के प्रसंग में ‘बहाल करेगा’ इसका पुनर्स्थापनात्मक पक्ष स्पष्ट करता है।
- source_word: στηρίξει
  choice: स्थिर करेगा
  rationale: यह दृढ़ता और अटलता देने का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: σθενώσει
  choice: सामर्थ्य देगा
  rationale: यह पड़ोसी ‘स्थिर करेगा’ से भिन्न रहते हुए बलवान बनाने का अर्थ सहज हिन्दी में देता है।
- source_word: θεμελιώσει
  choice: दृढ़ नींव पर स्थापित करेगा
  rationale: स्पष्ट विस्तार मूल क्रिया में निहित नींव के रूपक को सुरक्षित रखता है और केवल ‘स्थापित’ कहने से στηρίξει के साथ होने वाली अस्पष्ट पुनरावृत्ति से बचता है।
theological_decisions:
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: Χριστός यहाँ अभिषिक्त उद्धारकर्ता की उपाधि है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में अर्थवान और व्यापक रूप से समझा जाने वाला रूप है।
- issue: εἰς के लक्ष्यगत अर्थ का निरूपण
  choice: अपनी अनन्त महिमा के लिए
  alternative: अपनी अनन्त महिमा में
  rationale: εἰς दिशा अथवा लक्ष्य दोनों व्यक्त कर सकता है। बुलाने वाली क्रिया के साथ ‘के लिए’ बुलाहट के लक्ष्य को स्वाभाविक हिन्दी में रखता है; ‘में’ सहभागिता को अधिक स्पष्ट करता, पर स्थानगत अर्थ को अपेक्षाकृत अधिक उभार सकता है।
- issue: दुःख और परमेश्वर की भावी क्रिया का संबंध
  choice: थोड़ी देर दुःख सह लेने के बाद
  alternative: थोड़ी देर दुःख सहते हुए/दुःख सहने पर
  rationale: कृदन्त को कालवाचक माना गया है और दुःख के बाद परमेश्वर की पुनर्स्थापक क्रिया का क्रम रखा गया है। इससे दुःख की वास्तविकता और सीमित अवधि दोनों सुरक्षित रहते हैं, बिना उसके कारण या धर्मवैज्ञानिक प्रयोजन को अतिरिक्त रूप से निर्धारित किए।
- issue: चार भावी क्रियाओं की विशिष्टता
  choice: बहाल करेगा, स्थिर करेगा, सामर्थ्य देगा और दृढ़ नींव पर स्थापित करेगा
  alternative: सिद्ध करेगा, दृढ़ करेगा, बलवन्त करेगा और नींव डालेगा
  rationale: मूल की चार निकटार्थक पर अलग क्रियाओं को अलग हिन्दी अभिव्यक्तियों में रखा गया है; पुनर्स्थापन, स्थिरता, शक्ति और नींव—चारों पक्ष सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक बहुवचन और गरिमापूर्ण पर सहज वाक्य-विन्यास अपनाया गया है। चार अंतिम क्रियाओं की लय तथा अर्थगत भिन्नता बनाए रखी गई है; तकनीकी या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
