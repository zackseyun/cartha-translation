source:
  edition: SBLGNT
  text: ᾧ ἀντίστητε στερεοὶ τῇ πίστει, εἰδότες τὰ αὐτὰ τῶν παθημάτων τῇ ἐν ⸀τῷ κόσμῳ ὑμῶν ἀδελφότητι ἐπιτελεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/005/009.yaml
  text: Resist him[a], firm in the faith[c][b], knowing that the same sufferings are being experienced by your brotherhood in the world.
translation:
  language: hi
  text: उसका विरोध करो, और विश्वास में दृढ़ रहो। यह जानते हुए कि संसार में तुम्हारे सहविश्वासियों के समुदाय को भी इसी प्रकार के दुःख सहने पड़ रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी प्रकार के दुःख पूरे किए जा रहे हैं।”
    reason: ἐπιτελεῖσθαι का अर्थ ‘अनुभव/सहन किए जा रहे हैं’ के साथ-साथ ‘पूरे किए जा रहे हैं’ या ‘पूर्णता तक पहुँचाए जा रहे हैं’ भी हो सकता है।
lexical_decisions:
- source_word: ᾧ
  choice: उसका
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद के शैतान की ओर संकेत करता है; हिन्दी में ‘उसका सामना करो’ स्वाभाविक और स्पष्ट है।
- source_word: ἀντίστητε
  choice: सामना करो
  rationale: आज्ञार्थक क्रिया दृढ़ विरोध का आह्वान करती है; ‘सामना करो’ आधुनिक हिन्दी में स्वाभाविक है और केवल निष्क्रिय सहनशीलता का भाव नहीं देता।
- source_word: στερεοὶ τῇ πίστει
  choice: विश्वास में दृढ़ रहो
  rationale: στερεοὶ की स्थिरता और τῇ πίστει के क्षेत्र अथवा आधार को संक्षेप में व्यक्त करता है; ‘विश्वास’ व्यक्तिगत भरोसे और मसीही विश्वास-निष्ठा के बीच की सम्भावित अर्थ-व्याप्ति को खुला रखता है।
- source_word: εἰδότες
  choice: क्योंकि तुम जानते हो
  rationale: कृदन्त यहाँ प्रतिरोध के आधार को बताता प्रतीत होता है; कारणसूचक उपवाक्य हिन्दी में अधिक स्वाभाविक है।
- source_word: τὰ αὐτὰ τῶν παθημάτων
  choice: इसी प्रकार के दुःख
  rationale: यूनानी रचना समान प्रकार के कष्टों की ओर संकेत करती है, अनिवार्यतः बिल्कुल समान घटनाओं की ओर नहीं।
- source_word: τῇ ἐν τῷ κόσμῳ ὑμῶν ἀδελφότητι
  choice: संसार भर में तुम्हारे विश्वासियों के पूरे परिवार को
  rationale: ἀδελφότης सम्पूर्ण सहविश्वासी समुदाय का सामूहिक पारिवारिक नाम है; यह अनुवाद स्त्री और पुरुष दोनों को स्पष्ट रूप से समाहित करता है और हिन्दी में स्वाभाविक है।
- source_word: ἐπιτελεῖσθαι
  choice: सहने पड़ रहे हैं
  rationale: इस कठिन वर्तमान कर्मवाच्य धातु-रूप को प्रसंगानुसार अनुभव किए जा रहे दुःखों के रूप में सहज हिन्दी में व्यक्त किया गया है; पूर्ण किए जाने का सम्भावित भाव पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: τῇ πίστει का अर्थ
  choice: विश्वास में
  alternative: मसीही विश्वास में / विश्वास के द्वारा
  rationale: सप्रत्यय रूप सामुदायिक मसीही विश्वास की ओर संकेत कर सकता है, पर ‘विश्वास में’ व्यक्तिगत भरोसे और अंगीकृत विश्वास के बीच की वास्तविक अर्थगत गुंजाइश को अनावश्यक रूप से सीमित नहीं करता।
- issue: ἀδελφότητι का समावेशी सामुदायिक अर्थ
  choice: विश्वासियों का पूरा परिवार
  alternative: भाईचारा / भाई-बहन
  rationale: यह सामूहिक संज्ञा केवल पुरुषों को नहीं, सारे सहविश्वासी समुदाय को दर्शाती है। ‘पूरा परिवार’ पारिवारिक रूपक और समावेशिता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- issue: ἐπιτελεῖσθαι की अर्थगत कठिनाई
  choice: दुःख सहने पड़ रहे हैं
  alternative: दुःख पूरे किए जा रहे हैं
  rationale: प्रसंग में अनुभव का भाव अधिक स्वाभाविक है, फिर भी यूनानी क्रिया में पूरा किए जाने अथवा पूर्णता तक पहुँचाए जाने की सम्भावना है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘विश्वासियों का पूरा परिवार’ सामूहिक ἀδελφότης का अर्थ स्पष्ट करता है; ‘संसार भर में’ विश्वव्यापी समुदाय के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
