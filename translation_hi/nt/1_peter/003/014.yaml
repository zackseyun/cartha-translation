source:
  edition: SBLGNT
  text: ἀλλ’ εἰ καὶ πάσχοιτε διὰ δικαιοσύνην, μακάριοι. τὸν δὲ φόβον αὐτῶν μὴ φοβηθῆτε μηδὲ ταραχθῆτε,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/014.yaml
  text: But even if you should suffer for righteousness, you are blessed. And do not fear their fear, nor be troubled,
translation:
  language: hi
  text: पर यदि धार्मिकता के कारण तुम्हें दुःख उठाना भी पड़े, तो तुम धन्य हो। उनके भय से मत डरो[a] और न घबराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ ‘उनसे मत डरो’ या ‘जिस बात से वे डरते हैं, उससे मत डरो’ भी हो सकता है। यूनानी में शाब्दिक अभिव्यक्ति ‘उनका भय’ है, जो यशायाह 8:12 की भाषा की अनुगूँज है और अर्थ को कुछ अस्पष्ट रहने देती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀλλ’ εἰ καὶ πάσχοιτε
  choice: पर यदि ... तुम्हें दुःख उठाना भी पड़े
  rationale: 'यह concessive और संभाव्य शर्त को स्वाभाविक हिन्दी में व्यक्त करता है: दुःख निश्चित नहीं बताया गया, पर उसकी वास्तविक संभावना बनी रहती है।'
- source_word: διὰ δικαιοσύνην
  choice: धार्मिकता के कारण
  rationale: διά के कारणवाचक अर्थ को स्पष्ट करता है और δικαιοσύνη के नैतिक-धर्मवैचारिक आशय को केवल ‘सही काम’ या सामाजिक ‘न्याय’ तक सीमित नहीं करता।
- source_word: μακάριοι
  choice: तुम धन्य हो
  rationale: सम्बोधित बहुवचन को स्पष्ट करता है; ‘धन्य’ बाइबलीय अनुगूँज और परमेश्वर की कृपा/स्वीकृति का भाव बनाए रखता है, जबकि ‘सुखी’ यहाँ अत्यधिक भावनात्मक लग सकता है।
- source_word: τὸν ... φόβον αὐτῶν μὴ φοβηθῆτε
  choice: उनके भय से मत डरो
  rationale: भय/डर की पुनरुक्ति को यथासंभव बनाए रखते हुए यशायाह 8:12 की अनुगूँज और यूनानी सम्बन्धवाचक पद की अस्पष्टता को मुख्य पाठ में रहने देता है। सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: μηδὲ ταραχθῆτε
  choice: और न घबराओ
  rationale: भीतरी व्याकुलता या विचलन को साधारण, वर्तमान और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय; सही काम करने के कारण
  rationale: इस प्रसंग में शब्द परमेश्वर के सामने और लोगों के बीच सही, खरे आचरण का व्यापक नैतिक-धर्मवैचारिक अर्थ रखता है। ‘धार्मिकता’ उस व्यापकता को बनाए रखती है।
- issue: τὸν φόβον αὐτῶν की अस्पष्टता
  choice: उनके भय से मत डरो
  alternative: उनसे मत डरो; जिस बात से वे डरते हैं, उससे मत डरो
  rationale: यूनानी पद यशायाह 8:12 की भाषा का अनुसरण करता है और यह स्पष्ट नहीं करता कि आशय उनके द्वारा उत्पन्न भय से है या उस बात से जिससे वे स्वयं डरते हैं। मुख्य पाठ इसे पूरी तरह किसी एक अर्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘तुम’ मूल पाठ के बहुवचन सम्बोधन को दर्शाता है। ‘दुःख उठाना भी पड़े’ संभाव्य शर्त को स्वाभाविक बनाता है, और ‘धन्य’ बाइबलीय स्वर बनाए रखता है।
