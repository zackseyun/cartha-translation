source:
  edition: SBLGNT
  text: οὕτως γάρ ποτε καὶ αἱ ἅγιαι γυναῖκες αἱ ἐλπίζουσαι ⸀εἰς θεὸν ἐκόσμουν ἑαυτάς, ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/005.yaml
  text: For in this way formerly also the holy women who hoped in God adorned themselves[a], submitting to their own husbands,
translation:
  language: hi
  text: क्योंकि इसी प्रकार पहले के समय में परमेश्वर पर आशा रखनेवाली[a] पवित्र स्त्रियाँ भी अपने-अपने पतियों के अधीन रहते हुए अपने आप को सँवारती थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर पर आशा रखती थीं।”
    reason: ἐλπίζουσαι εἰς θεὸν के लिए स्वाभाविक वैकल्पिक अभिव्यक्ति; यह आशा के लक्ष्य के रूप में परमेश्वर को बनाए रखती है और वर्तमान कृदंत के विशेषतापरक अर्थ को बिना अनावश्यक पूर्वकालिकता के व्यक्त करती है।
lexical_decisions:
- source_word: οὕτως
  choice: इसी प्रकार
  rationale: यह पिछले संदर्भ में बताए गए ढंग की ओर संकेत करता है और यूनानी क्रियाविशेषण की निर्देशात्मक शक्ति बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ποτε
  choice: पहले के समय में
  rationale: यह बीते युग की स्त्रियों की ओर संकेत करने वाला कालवाचक प्रयोग है।
- source_word: ἅγιαι γυναῖκες
  choice: पवित्र स्त्रियाँ
  rationale: ἅγιαι का मानक धार्मिक अर्थ ‘पवित्र’ बनाए रखा गया है, उसे केवल ‘भक्त’ कहकर कमजोर नहीं किया गया।
- source_word: ἐλπίζουσαι εἰς θεὸν
  choice: परमेश्वर पर आशा रखनेवाली
  rationale: वर्तमान कृदंत इन स्त्रियों की चारित्रिक पहचान बताता है। यह पदबंध आशा के लक्ष्य के रूप में परमेश्वर को स्पष्ट रखता है।
- source_word: ἐκόσμουν ἑαυτάς
  choice: अपने आप को सँवारती थीं
  rationale: यह निकटवर्ती संदर्भ में सजने-सँवरने की धारणा से संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑποτασσόμεναι
  choice: अधीन रहते हुए
  rationale: कृदंत रूप को बनाए रखते हुए यह उस रीति को व्यक्त करता है जिसमें वे अपने आप को सँवारती थीं।
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: अपने-अपने पतियों के
  rationale: वैवाहिक संदर्भ में ἀνδράσιν का अर्थ ‘पतियों’ है। ‘अपने-अपने’ ἰδίοις को बनाए रखकर कथन का दायरा प्रत्येक स्त्री के अपने वैवाहिक संबंध तक सीमित करता है।
theological_decisions:
- issue: वैवाहिक अधीनता संबंधी कथन का अनुवाद
  choice: अपने-अपने पतियों के अधीन रहते हुए
  alternative: अपने पतियों के प्रति समर्पित रहते हुए
  rationale: ‘अधीन रहते हुए’ ὑποτασσόμεναι के संबंधपरक और कृदंत रूप को अधिक सीधे ढंग से सुरक्षित रखता है। ‘अपने-अपने पतियों’ कथन को सभी स्त्रियों और सभी पुरुषों के बारे में व्यापक सिद्धांत बनाने के बजाय उसके वैवाहिक दायरे में रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘सँवारती थीं’ पिछले पदों के बाहरी और भीतरी श्रृंगार संबंधी संदर्भ से शब्दार्थिक संबंध बनाए रखता है; ‘अधीन रहते हुए’ कथन की गंभीरता को बिना अतिरिक्त सांप्रदायिक व्याख्या के व्यक्त करता है।
