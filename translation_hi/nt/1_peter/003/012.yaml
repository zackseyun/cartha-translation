source:
  edition: SBLGNT
  text: ὅτι ὀφθαλμοὶ κυρίου ἐπὶ δικαίους καὶ ὦτα αὐτοῦ εἰς δέησιν αὐτῶν, πρόσωπον δὲ κυρίου ἐπὶ ποιοῦντας κακά.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/012.yaml
  text: For the eyes of the Lord are on the righteous[a], and his ears are open to their prayer[b], but the face of the Lord is against those who do evil.
translation:
  language: hi
  text: क्योंकि प्रभु की आँखें धर्मियों पर लगी रहती हैं, और उसके कान उनकी विनती पर लगे रहते हैं[a]; परन्तु प्रभु का मुख बुराई करनेवालों के विरुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके कान उनकी विनती की ओर”; यहाँ आशय है कि वह उनकी विनती ध्यान से सुनता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पूर्ववर्ती कथन का कारण या शास्त्रीय आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὀφθαλμοὶ κυρίου ἐπὶ δικαίους
  choice: प्रभु की आँखें धर्मियों पर लगी रहती हैं
  rationale: मूल की मानवरूपी छवि और ध्यानपूर्वक दृष्टि—दोनों को सुरक्षित रखते हुए यह हिन्दी में स्वाभाविक है।
- source_word: ὦτα αὐτοῦ εἰς δέησιν αὐτῶν
  choice: उसके कान उनकी विनती की ओर लगे रहते हैं
  rationale: यूनानी की दीर्घवृत्तीय अभिव्यक्ति ‘उसके कान उनकी विनती की ओर’ को निकटता से रखते हुए हिन्दी में आवश्यक क्रिया जोड़ी गई है। δέησις के निवेदनपूर्ण भाव के लिए ‘विनती’ चुना गया।
- source_word: πρόσωπον δὲ κυρίου
  choice: परन्तु प्रभु का मुख
  rationale: δέ का विरोधसूचक बल ‘परन्तु’ से और πρόσωπον की प्रत्यक्ष मानवरूपी छवि ‘मुख’ से सुरक्षित रहती है।
- source_word: ἐπὶ ποιοῦντας κακά
  choice: बुराई करनेवालों के विरुद्ध है
  rationale: इस नकारात्मक समानांतर में ἐπί विरोध की दिशा व्यक्त करता है; ‘के विरुद्ध’ स्वाभाविक हिन्दी है और participle का क्रियात्मक बल ‘बुराई करनेवालों’ में बना रहता है।
theological_decisions:
- issue: परमेश्वर की आँखों, कानों और मुख की मानवरूपी भाषा
  choice: चित्रात्मक भाषा को सीधे बनाए रखा गया
  alternative: ‘प्रभु धर्मियों की देखभाल करता और उनकी प्रार्थना सुनता है’ जैसा व्याख्यात्मक रूप
  rationale: मूल पद भजन-साहित्य की सजीव मानवरूपी छवियों द्वारा प्रभु की कृपापूर्ण सजगता और बुराई करनेवालों के प्रति विरोध को व्यक्त करता है; सीधा रूप साहित्यिक और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: δέησις का अर्थ
  choice: विनती
  alternative: प्रार्थना
  rationale: δέησις विशेष रूप से आवश्यकता से उत्पन्न निवेदन या याचना का भाव रख सकता है; ‘विनती’ उस सूक्ष्मता को बनाए रखती है, जबकि ‘प्रार्थना’ भी प्रसंग में संभव है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘आँखें’, ‘कान’ और ‘मुख’ की समानांतर छवियाँ सुरक्षित रखी गई हैं। ‘करनेवालों’ का संयुक्त रूप मानक हिन्दी वर्तनी के अनुसार रखा गया है।
