id: 1PE.3.7
reference: 1 Peter 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἱ ἄνδρες ὁμοίως συνοικοῦντες κατὰ γνῶσιν, ὡς ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ ἀπονέμοντες τιμήν, ὡς καὶ ⸀συγκληρονόμοις χάριτος ζωῆς, εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/007.yaml
  text: Likewise[a], husbands, living together with your wives according to knowledge, assigning honor to the woman as to a weaker vessel, as also fellow heirs of the grace of life[c][b], so that your prayers may not be hindered.
translation:
  language: hi
  text: इसी प्रकार, हे पतियो, अपनी पत्नियों के साथ समझदारी से जीवन बिताओ और स्त्री को अपेक्षाकृत निर्बल पात्र के रूप में आदर दो,[a] क्योंकि वे भी तुम्हारे साथ जीवन के अनुग्रह की सह-वारिस हैं,[b] ताकि तुम्हारी प्रार्थनाओं में बाधा न पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निर्बल पात्र’ का रूपक सम्भवतः अपेक्षाकृत शारीरिक निर्बलता या सामाजिक असुरक्षा की ओर संकेत करता है, कम मूल्य या कम आत्मिक गरिमा की ओर नहीं; अगला वाक्यांश पत्नियों को जीवन के अनुग्रह की सह-वारिस बताता है।
    reason: cultural_note
  - marker: b
    text: या, “जीवन के अनुग्रह की सहभागी वारिस।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ ἄνδρες
  choice: हे पतियो
  rationale: 3:1 से चले आ रहे गृहस्थ-संबंधी संदर्भ में ἄνδρες का अर्थ सामान्यतः पुरुष नहीं, बल्कि पति है; संबोधन को हिन्दी में स्पष्ट किया गया है।
- source_word: ὁμοίως
  choice: इसी प्रकार
  rationale: यह पिछले उपदेशों से वचन का संबंध और यूनानी क्रियाविशेषण की तुलनात्मक शक्ति बनाए रखता है।
- source_word: συνοικοῦντες κατὰ γνῶσιν
  choice: अपनी पत्नियों के साथ समझदारी से जीवन बिताओ
  rationale: शाब्दिक 'ज्ञान के अनुसार साथ रहते हुए' की अपेक्षा यह स्वाभाविक हिन्दी है और ज्ञान से निर्देशित, विचारशील वैवाहिक आचरण का व्यापक भाव व्यक्त करती है।
- source_word: ἀσθενεστέρῳ σκεύει τῷ γυναικείῳ
  choice: स्त्री को अपेक्षाकृत निर्बल पात्र समझकर
  rationale: तुलनात्मक विशेषण और 'पात्र' का रूपक सुरक्षित रखे गए हैं; 'अपेक्षाकृत' यह स्पष्ट करता है कि तुलना की जा रही है, जबकि उसके प्रकार को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: ἀπονέμοντες τιμήν
  choice: उसका आदर करो
  rationale: ἀπονέμω का उचित आदर देने का भाव सरल और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: συγκληρονόμοις
  choice: तुम्हारे साथ सह-वारिस
  rationale: साझी विरासत और पत्नियों की समान सहभागिता स्पष्ट रूप से व्यक्त होती है।
- source_word: χάριτος ζωῆς
  choice: जीवन के अनुग्रह
  rationale: सम्बन्धकारक संरचना को बिना यह तय किए रखा गया है कि अनुग्रह जीवन है या जीवन प्रदान करता है।
- source_word: εἰς τὸ μὴ ἐγκόπτεσθαι τὰς προσευχὰς ὑμῶν
  choice: ताकि तुम्हारी प्रार्थनाओं में बाधा न पड़े
  rationale: उद्देश्य/परिणाम और निष्क्रिय अवरोध का भाव सहज हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: '''निर्बल पात्र'' का अर्थ'
  choice: तुलनात्मक निर्बलता का रूपक बनाए रखा गया और फुटनोट में सम्भावित शारीरिक या सामाजिक असुरक्षा बताई गई।
  alternative: इसे केवल शारीरिक, सामाजिक या भावनात्मक निर्बलता के रूप में निश्चित करना।
  rationale: मूल पाठ निर्बलता का प्रकार स्पष्ट नहीं करता; अगला वाक्यांश स्त्रियों की गरिमा और साझा उत्तराधिकार को पुष्ट करता है।
- issue: साझे उत्तराधिकार का अभिप्राय
  choice: पत्नियों को पतियों के साथ जीवन के अनुग्रह की सह-वारिस बताया गया।
  alternative: इसे केवल अनन्त जीवन अथवा केवल वर्तमान जीवन के वरदान तक सीमित करना।
  rationale: χάριτος ζωῆς में निहित वास्तविक व्यापकता को बनाए रखते हुए συγκληρονόμοις की साझा विरासत स्पष्ट की गई है।
- issue: ὡς καὶ का संबंध
  choice: हिन्दी में 'क्योंकि वे भी' द्वारा आदर करने का आधार व्यक्त किया गया।
  alternative: अधिक रूपात्मक 'और सह-वारिस के रूप में'।
  rationale: यूनानी वाक्य में स्त्रियों को सह-वारिस मानना आदर देने के निर्देश से जुड़ा है; हिन्दी में शाब्दिक संरचना अस्पष्ट और अस्वाभाविक होती, इसलिए निहित आधार को स्वाभाविक रीति से व्यक्त किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली अपनाई गई है। 'पात्र', 'अनुग्रह' और 'सह-वारिस' जैसे धर्मग्रंथीय शब्द मूल रूपक तथा धर्मवैचारिक व्यापकता बचाने के लिए रखे गए हैं; कठिन सांस्कृतिक संकेत फुटनोट में समझाया गया है।
