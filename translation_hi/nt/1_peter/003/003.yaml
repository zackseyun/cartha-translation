  text: ὧν ἔστω οὐχ ὁ ἔξωθεν ἐμπλοκῆς τριχῶν καὶ περιθέσεως χρυσίων ἢ ἐνδύσεως ἱματίων κόσμος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/003.yaml
  text: Do not let your adornment be the outward one—braiding of hair[a], wearing of gold jewelry, or putting on of clothing—
translation:
  language: hi
  text: तुम्हारा श्रृंगार केवल बाहरी न हो[a]—बाल गूँथना, सोने के आभूषण पहनना या कपड़े पहनना—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “जिनका श्रृंगार बाहरी न हो: बालों को गूँथना, सोने के आभूषण पहनना या कपड़े पहनना।” यहाँ जोर बाहरी दिखावे की अपेक्षा भीतरी चरित्र को प्राथमिकता देने पर है, न कि साज-सँवार या वस्त्र पहनने के सर्वथा निषेध पर।'
    reason: alternative_reading
lexical_decisions:
- source_word: ὧν
  choice: तुम्हारा
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में संबोधित स्त्रियों/पत्नियों की ओर संकेत करता है; आधुनिक हिन्दी में इसका स्वाभाविक संबंधसूचक रूप ‘तुम्हारा’ है।
- source_word: ἔστω οὐχ
  choice: केवल ... न हो
  rationale: निषेधात्मक आज्ञार्थक बल को स्वाभाविक हिन्दी में रखा गया है। ‘केवल’ संदर्भ से स्पष्ट तुलनात्मक विरोध को व्यक्त करता है, जबकि बाहरी श्रृंगार के पूर्ण निषेध का अनावश्यक अर्थ नहीं थोपता।
- source_word: ὁ ἔξωθεν ... κόσμος
  choice: बाहरी ... श्रृंगार
  rationale: यहाँ κόσμος का अर्थ ‘संसार’ नहीं, बल्कि सजावट/श्रृंगार है; ἔξωθεν इसे बाहरी बताता है। ‘श्रृंगार’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐμπλοκῆς τριχῶν
  choice: बाल गूँथना
  rationale: ἐμπλοκή बालों को गूँथने की क्रिया बताता है; क्रियामूलक हिन्दी रूप यूनानी संज्ञात्मक अभिव्यक्ति का अर्थ सहजता से पहुँचाता है।
- source_word: περιθέσεως χρυσίων
  choice: सोने के आभूषण पहनना
  rationale: περίθεσις अपने ऊपर या चारों ओर रखने की क्रिया है और χρυσίων सोने की वस्तुओं, यहाँ आभूषणों, को दर्शाता है।
- source_word: ἢ ἐνδύσεως ἱματίων
  choice: या कपड़े पहनना
  rationale: ἢ साधारण विकल्पसूचक ‘या’ है; ἐνδύσεως ἱματίων का सीधा अर्थ कपड़े पहनने की क्रिया है।
theological_decisions:
- issue: क्या पद बाहरी सज्जा और वस्त्र पहनने का पूर्ण निषेध करता है, या भीतरी चरित्र को प्राथमिकता देता है
  choice: ‘केवल बाहरी न हो’ द्वारा तुलनात्मक/प्राथमिकतामूलक अर्थ
  alternative: बाल गूँथने, आभूषण पहनने और वस्त्र पहनने का पूर्ण निषेध
  rationale: अगला पद बाहरी श्रृंगार की तुलना ‘हृदय के छिपे हुए मनुष्य’ से करता है। सूची में स्वयं कपड़े पहनना भी है, इसलिए पूर्ण निषेध संदर्भ में असंगत होगा। फिर भी मुख्य पाठ यूनानी निषेध और बाहरी-भीतरी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के लिए संदर्भानुकूल ‘तुम्हारा’; ‘श्रृंगार’, ‘आभूषण’ जैसे प्रतिष्ठित किंतु सामान्यतः समझे जाने वाले शब्द। पद अगले वाक्य में जारी रहने के कारण अंत में दीर्घ विराम-चिह्न रखा गया है।
