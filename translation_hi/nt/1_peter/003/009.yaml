  text: μὴ ἀποδιδόντες κακὸν ἀντὶ κακοῦ ἢ λοιδορίαν ἀντὶ λοιδορίας τοὐναντίον δὲ ⸀εὐλογοῦντες, ὅτι εἰς τοῦτο ἐκλήθητε ἵνα εὐλογίαν κληρονομήσητε.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/009.yaml
  text: not repaying evil for evil or insult for insult[a], but on the contrary blessing, because you were called to this[c][b], so that you might inherit a blessing.
translation:
  language: hi
  text: बुराई के बदले बुराई या अपमान के बदले अपमान न करो[a], बल्कि इसके विपरीत, आशीष दो[b], क्योंकि तुम इसी के लिए बुलाए गए हो[c], ताकि तुम आशीष के वारिस हो सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निंदा के बदले निंदा।” यूनानी शब्द अपमानजनक या गाली-गलौज भरी वाणी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बल्कि इसके बजाय।” यूनानी अभिव्यक्ति प्रबल उलटाव—“इसके विपरीत”—को दर्शाती है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात परमेश्वर ने तुम्हें बुलाया है कि दुर्व्यवहार का उत्तर प्रतिशोध से नहीं, आशीष से दो। यह अभिव्यक्ति दुःख सहने और बुराई का बदला न लेने के व्यापक आचरण को भी समेट सकती है।
    reason: cross_reference
lexical_decisions:
- source_word: ἀποδιδόντες
  choice: बदले ... न करो
  rationale: निषेधात्मक कृदन्त का हिन्दी में स्वाभाविक आज्ञार्थक रूप; प्रतिशोध में लौटाने का पारस्परिक भाव ‘के बदले’ से स्पष्ट होता है।
- source_word: κακὸν ἀντὶ κακοῦ
  choice: बुराई के बदले बुराई
  rationale: मूल की नैतिक गंभीरता और समानांतर प्रतिशोधात्मक संरचना को सुरक्षित रखता है।
- source_word: λοιδορίαν ἀντὶ λοιδορίας
  choice: अपमान के बदले अपमान
  rationale: अपमानजनक अथवा निंदात्मक वाणी का अर्थ सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: τοὐναντίον δὲ
  choice: बल्कि इसके विपरीत
  rationale: अपेक्षित प्रतिशोध से प्रबल उलटाव को व्यक्त करता है।
- source_word: εὐλογοῦντες
  choice: आशीष दो
  rationale: संक्षिप्त आज्ञार्थक अभिव्यक्ति, जो किसी का भला कहना और उसके लिए परमेश्वर की कृपा चाहना—दोनों अर्थों को खुला रखती है; मूल में अनुपस्थित कर्म नहीं जोड़ा गया।
- source_word: ὅτι
  choice: क्योंकि
  rationale: उपदेश का कारण प्रस्तुत करने वाली स्पष्ट कारणसूचक संयोजक अभिव्यक्ति।
- source_word: εἰς τοῦτο ἐκλήθητε
  choice: तुम इसी के लिए बुलाए गए हो
  rationale: दैवी निष्क्रिय वाच्य को बनाए रखते हुए ‘इसी’ निकटवर्ती आचरण की ओर संकेत करता है, पर उसके दायरे को अत्यधिक सीमित नहीं करता।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम का स्वाभाविक हिन्दी संकेत।
- source_word: εὐλογίαν
  choice: आशीष
  rationale: हिन्दी में बिना अनावश्यक अनिश्चित लेख के स्वाभाविक है और परमेश्वर से मिलने वाली आशीष का भाव सुरक्षित रखता है।
- source_word: κληρονομήσητε
  choice: वारिस बनो
  rationale: उत्तराधिकार-संबंधी पारिवारिक और वाचाई अर्थ को ‘पाओ’ की अपेक्षा अधिक स्पष्ट रखता है; ἵνα के अधीन अभिप्रेत परिणाम व्यक्त होता है।
theological_decisions:
- issue: εἰς τοῦτο ἐκλήθητε में बुलाहट का आशय
  choice: निकटवर्ती आदेश—प्रतिशोध के स्थान पर आशीष देना—से संबद्ध दैवी बुलाहट
  alternative: दुःख सहने और प्रतिशोध न लेने वाले पूरे मसीही जीवन की व्यापक बुलाहट
  rationale: तात्कालिक संदर्भ ‘इसी’ को पिछले उपदेश से जोड़ता है, फिर भी अनुवाद इतना खुला है कि व्यापक संदर्भ को बाहर नहीं करता।
- issue: εὐλογίαν κληρονομήσητε में आशीष का स्वरूप
  choice: परमेश्वर से उत्तराधिकार के रूप में मिलने वाली आशीष, जिसका स्वरूप अनिर्दिष्ट रखा गया है
  alternative: केवल भावी उद्धार अथवा केवल वर्तमान सांसारिक कल्याण
  rationale: मूल पाठ आशीष को और परिभाषित नहीं करता; इसलिए किसी एक कालगत या सिद्धान्तगत अर्थ को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘आशीष दो’ और ‘आशीष के वारिस बनो’ मूल की शब्द-पुनरावृत्ति तथा उत्तराधिकार की छवि बनाए रखते हैं।
