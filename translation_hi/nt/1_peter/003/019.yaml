- source_word: ἐκήρυξεν
  choice: घोषणा की
  rationale: क्रिया सार्वजनिक उद्घोषणा का भाव देती है, लेकिन सन्देश की विषयवस्तु नहीं बताती; इसलिए ‘सुसमाचार सुनाया’ या ‘न्याय सुनाया’ जैसे व्याख्यात्मक रूपों से बचा गया है।
theological_decisions:
- issue: ἐν ᾧ का सम्बन्ध और अर्थ
  choice: ‘उसी में’—सम्भवतः पिछले पद के ‘आत्मा’ से सम्बन्धित, पर सटीक सम्बन्ध खुला रखा गया है।
  alternative: ‘उसी के द्वारा’ अथवा व्यक्तिवाचक अर्थ में ‘उसी में’ मसीह की ओर संकेत करता हुआ।
  rationale: यूनानी वाक्यरचना एक से अधिक समझ की अनुमति देती है। मुख्य पाठ किसी खास सिद्धान्त के अनुसार माध्यम, अवस्था या व्यक्तिगत सम्बन्ध को निर्णायक नहीं बनाता।
- issue: ‘बन्दीगृह में पड़ी आत्माओं’ की पहचान
  choice: मुख्य पाठ में उनकी पहचान अनिर्धारित रखी गई है।
  alternative: मृत मनुष्य, विशेषतः नूह के समय के लोग; अथवा पतित स्वर्गदूत जैसे आत्मिक प्राणी।
  rationale: यूनानी पद स्वयं इन आत्माओं की पहचान पर्याप्त स्पष्टता से नहीं करता; इसलिए अनुवाद ऐतिहासिक व्याख्याओं में से किसी एक को नहीं चुनता।
- issue: ἐκήρυξεν में सन्देश का स्वरूप
  choice: ‘घोषणा की’
  alternative: ‘प्रचार किया,’ ‘सुसमाचार सुनाया,’ ‘न्याय की घोषणा की,’ अथवा ‘विजय घोषित की।’
  rationale: क्रिया घोषणा किए जाने को बताती है, उसकी विषयवस्तु को नहीं। तटस्थ रूप सुसमाचार, न्याय या विजय में से किसी एक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘बन्दीगृह’ धार्मिक गम्भीरता बनाए रखता है, जबकि ‘घोषणा की’ सन्देश की अनिर्दिष्ट विषयवस्तु को सुरक्षित रखता है। पद पिछले वाक्य पर निर्भर है, इसलिए अन्त में अल्पविराम रखा गया है।
