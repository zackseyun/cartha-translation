source:
  edition: SBLGNT
  text: ἀπειθήσασίν ποτε ὅτε ἀπεξεδέχετο ἡ τοῦ θεοῦ μακροθυμία ἐν ἡμέραις Νῶε κατασκευαζομένης κιβωτοῦ εἰς ἣν ⸀ὀλίγοι, τοῦτ’ ἔστιν ὀκτὼ ψυχαί, διεσώθησαν δι’ ὕδατος.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/020.yaml
  text: who formerly were disobedient[a], when the patience of God was waiting in the days of Noah while the ark was being prepared, into which a few—that is[b], eight persons—were brought safely through water.
translation:
  language: hi
  text: जिन्होंने पहले आज्ञा नहीं मानी थी, जब नूह के दिनों में जहाज़ तैयार किया जा रहा था और परमेश्वर धीरज के साथ प्रतीक्षा कर रहा था। उसमें प्रवेश करके केवल थोड़े लोग—अर्थात आठ व्यक्ति[a]—पानी से होकर सुरक्षित बचाए गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘आत्माएँ’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पानी के द्वारा सुरक्षित बचाए गए’।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπειθήσασίν
  choice: जिन्होंने ... आज्ञा नहीं मानी थी
  rationale: यह क्रिया केवल बौद्धिक अविश्वास नहीं, बल्कि न मानने या अवज्ञा करने का भाव रखती है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और पिछले पद से जुड़े कृदन्त-संबंध को बनाए रखता है।
- source_word: ποτε
  choice: पहले
  rationale: यह नूह के दिनों में घटे पूर्वकालीन प्रसंग की ओर संकेत करता है; ‘पहले’ सरल और स्वाभाविक हिन्दी है।
- source_word: ἀπεξεδέχετο
  choice: प्रतीक्षा कर रहा था
  rationale: अपूर्ण भूतकाल निरंतर प्रतीक्षा का भाव देता है। ‘धीरज’ पहले ही μακροθυμία से व्यक्त है, इसलिए क्रिया में उसे अनावश्यक रूप से दोहराया नहीं गया।
- source_word: μακροθυμία
  choice: धीरज धरकर
  rationale: यह परमेश्वर द्वारा न्याय को रोकते हुए सहनशीलता से प्रतीक्षा करने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατασκευαζομένης
  choice: तैयार किया जा रहा था
  rationale: मूल शब्द तैयार करने या बनाकर तैयार करने दोनों को समेटता है; यह अनुवाद उस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: κιβωτοῦ
  choice: जहाज़
  rationale: नूह के प्रसंग में ‘जहाज़’ आधुनिक हिन्दी पाठक के लिए स्पष्ट और प्रचलित है; ‘सन्दूक’ यहाँ भ्रामक हो सकता है।
- source_word: εἰς ἣν
  choice: उस जहाज़ में
  rationale: εἰς प्रवेश या भीतर जाने की दिशा बताता है। हिन्दी वाक्य में ‘उस जहाज़ में’ इसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὀλίγοι
  choice: थोड़े-से लोग
  rationale: यह बचाए गए व्यक्तियों की कम संख्या पर बल देता है और आधुनिक हिन्दी में सहज है।
- source_word: ψυχαί
  choice: प्राणी
  rationale: यहाँ ψυχαί आठ मानव व्यक्तियों की गणना करता है। ‘प्राणी’ मूल के ‘जीव/प्राण’ संबंध को कुछ हद तक बनाए रखता है, जबकि पाठ में ‘लोग’ से आशय स्पष्ट है; ‘व्यक्ति’ को पाद-टिप्पणी में दिया गया है।
- source_word: διεσώθησαν
  choice: सुरक्षित पार पहुँचाए गए
  rationale: διασῴζω संकट के बीच से सुरक्षित पहुँचाए जाने का भाव रखता है। यह बाढ़ की ठोस घटना को स्पष्ट करता है, जबकि ‘बचाए गए’ विकल्प पाद-टिप्पणी में रखा गया है।
- source_word: δι’ ὕδατος
  choice: पानी के बीच से
  rationale: διά के साथ यहाँ पानी के संकट के बीच से सुरक्षित गुजरने का अर्थ प्रसंगानुकूल है। साथ ही ‘पानी के द्वारा’ जैसी साधन-सूचक सम्भावना को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
theological_decisions:
- issue: διεσώθησαν δι’ ὕδατος में उद्धार-संबंधी अर्थ और पानी की भूमिका
  choice: पानी के बीच से सुरक्षित पार पहुँचाए गए
  alternative: पानी के द्वारा बचाए गए / पानी से होकर बचाए गए
  rationale: मुख्य पाठ बाढ़ के बीच संरक्षण की ठोस घटना को सामने रखता है और अगले पद की बपतिस्मा-संबंधी उपमा को पहले से किसी विशिष्ट सिद्धान्त में नहीं बाँधता। ‘बचाए गए’ को पाद-टिप्पणी में रखकर यूनानी क्रिया की सामान्य और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण सम्भावना सुरक्षित की गई है।
- issue: ψυχαί का मानव-स्वरूप संबंधी अर्थ
  choice: प्राणी
  alternative: व्यक्ति / प्राण
  rationale: यहाँ शब्द आठ मनुष्यों की संख्या बताता है, शरीर और आत्मा के तकनीकी भेद की शिक्षा नहीं देता। ‘प्राणी’ मूल रूपक से निकट रहते हुए हिन्दी में गणना का अर्थ देता है; स्पष्ट विकल्प पाद-टिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से व्याकरणतः जुड़ा है, इसलिए आरम्भ ‘जिन्होंने’ से किया गया है। ‘परमेश्वर धीरज धरकर प्रतीक्षा कर रहा था’ मूल के दीर्घ धैर्य और जारी प्रतीक्षा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
