source:
  edition: SBLGNT
  text: ἐκκλινάτω ⸀δὲ ἀπὸ κακοῦ καὶ ποιησάτω ἀγαθόν, ζητησάτω εἰρήνην καὶ διωξάτω αὐτήν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/011.yaml
  text: But let him turn away from evil and do good[a]; let him seek peace and pursue it.
translation:
  language: hi
  text: पर वह बुराई से दूर हटे और भलाई करे[a]; वह शांति की खोज करे और उसका पीछा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई व्यक्ति बुराई से दूर हटे और भलाई करे; वह शांति की खोज करे और उसका पीछा करे।” यूनानी में क्रियाएँ तीसरे पुरुष एकवचन आदेशात्मक रूप में हैं; संदर्भ में उनका आशय सामान्य है।
    reason: तीसरे पुरुष एकवचन आदेशात्मक रूप और उसके प्रतिनिधिक, सर्वसामान्य आशय को स्पष्ट करना।
lexical_decisions:
- source_word: ἐκκλινάτω
  choice: मुड़ जाए
  rationale: यह तीसरे पुरुष एकवचन का आदेश है और बुराई से दिशा बदलने का भाव व्यक्त करता है; ‘मुड़ जाए’ इस गतिशील अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: मुख्य पाठ में अलग संयोजक नहीं
  rationale: δέ हल्का संक्रमण या विरोध दर्शाता है। हिन्दी में पूर्ववर्ती संदर्भ के बिना ‘परन्तु’ अस्वाभाविक रूप से तीखा लगता; वाक्य का आरम्भ सीधे करने पर उपदेशात्मक प्रवाह स्वाभाविक रहता है।
- source_word: ἀπὸ κακοῦ
  choice: बुराई से
  rationale: यहाँ κακόν नैतिक बुराई को सूचित करता है, न कि केवल हानि या विपत्ति को; यह आगे की ‘भलाई’ के साथ स्पष्ट नैतिक विरोध बनाता है।
- source_word: ποιησάτω ἀγαθόν
  choice: भलाई करे
  rationale: यह प्रचलित, संक्षिप्त और सक्रिय नैतिक अभिव्यक्ति है, जो यूनानी क्रिया और उसके कर्म को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ζητησάτω εἰρήνην
  choice: शांति को खोजे
  rationale: ‘खोजे’ ζητέω का अर्थ बनाए रखता है और अगले अधिक प्रबल क्रियापद διώκω से उसकी अलंकारिक प्रगति को अलग रखता है।
- source_word: διωξάτω αὐτήν
  choice: उसके पीछे लगा रहे
  rationale: यह शांति का सक्रिय और दृढ़तापूर्वक पीछा करने का भाव देता है। ‘लगा रहे’ हिन्दी में निरंतर तत्परता व्यक्त करता है, जबकि सर्वनाम का संकेत शांति की ओर स्पष्ट है।
- source_word: तीसरे पुरुष एकवचन आदेशात्मक रूप
  choice: वह ... जाए/करे/खोजे/लगा रहे
  rationale: ‘वह’ यूनानी के एकवचन प्रतिनिधिक रूप और आदेशात्मक लय को बनाए रखता है; इसका आशय किसी भी व्यक्ति से है।
theological_decisions:
- issue: उद्धरण में पुल्लिंग एकवचन का प्रतिनिधिक प्रयोग
  choice: मुख्य पाठ में ‘वह’ और पादटिप्पणी में इसके सर्वसामान्य आशय की स्पष्टता
  alternative: ‘मनुष्य’ या सीधे बहुवचन ‘वे’ का प्रयोग
  rationale: यूनानी व्याकरणिक रूप एकवचन और पुल्लिंग है, पर उसका बल प्रतिनिधिक है। हिन्दी ‘वह’ स्रोत की एकवचन संरचना को बचाता है और पादटिप्पणी बिना अर्थ को किसी एक लिंग तक सीमित किए उसका व्यापक आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और उपदेशात्मक शैली रखी गई है। ‘बुराई/भलाई’ नैतिक विरोध को स्पष्ट रखते हैं और ‘शांति को खोजे ... उसके पीछे लगा रहे’ मूल की क्रमिक तीव्रता को व्यक्त करता है।
