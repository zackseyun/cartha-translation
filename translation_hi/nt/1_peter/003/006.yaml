source:
  edition: SBLGNT
  text: ὡς Σάρρα ⸀ὑπήκουσεν τῷ Ἀβραάμ, κύριον αὐτὸν καλοῦσα· ἧς ἐγενήθητε τέκνα ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι μηδεμίαν πτόησιν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/006.yaml
  text: just as Sarah obeyed Abraham[a], calling him lord. You have become her children if you do good and do not fear any intimidation.
translation:
  language: hi
  text: जिस प्रकार सारा ने अब्राहम की आज्ञा मानी और उसे ‘स्वामी’ कहा, उसी प्रकार तुम उसकी संतान बनी हो—यदि तुम भलाई करती हो और किसी भी डरावनी बात से नहीं घबरातीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, किसी भी आतंक से; अथवा, किसी भी भय से।
    reason: πτόησις का अर्थ भय, आतंक, घबराहट, या भय उत्पन्न करने वाली वस्तु/परिस्थिति हो सकता है।
lexical_decisions:
- source_word: ὡς
  choice: ठीक वैसे ही
  rationale: यह सारा को पिछले उपदेश के अनुरूप उदाहरण के रूप में प्रस्तुत करता है और तुलना को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: ὑπήκουσεν
  choice: आज्ञा मानी
  rationale: ὑπακούω का सामान्य और सीधा अर्थ ‘आज्ञा मानना’ है; इसे सांस्कृतिक या धर्मवैज्ञानिक कारणों से नरम नहीं किया गया।
- source_word: κύριον
  choice: स्वामी
  rationale: यहाँ κύριος परमेश्वर की उपाधि नहीं, बल्कि अब्राहम के लिए आदरसूचक संबोधन है। ‘स्वामी’ इस भेद को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: καλοῦσα
  choice: उसे स्वामी कहा
  rationale: कृदन्त सारा की आज्ञाकारिता की रीति या अभिव्यक्ति बताता है; हिन्दी में संयुक्त क्रिया इसे सहज रूप देती है।
- source_word: ἧς … τέκνα
  choice: उसकी सन्तान
  rationale: सम्बन्धवाचक सर्वनाम सारा की ओर संकेत करता है। ‘सन्तान’ τέκνα की पारिवारिक और लिंग-समावेशी छवि को बनाए रखता है।
- source_word: ἐγενήθητε
  choice: बन गई हो
  rationale: γίνομαι किसी अवस्था या पहचान में आने को व्यक्त करता है। पूर्णतासूचक हिन्दी रूप वर्तमान परिणाम को दर्शाता है; स्त्रीलिंग रूप पत्र में सम्बोधित पत्नियों के अनुरूप है।
- source_word: ἀγαθοποιοῦσαι
  choice: यदि तुम भलाई करती हो
  rationale: कृदन्त मुख्य कथन के साथ व्यावहारिक शर्त जैसा सम्बन्ध रखता है। ‘यदि’ उस निहित सम्बन्ध को स्वाभाविक हिन्दी में स्पष्ट करता है, यद्यपि यूनानी में पृथक शर्तवाचक अव्यय नहीं है।
- source_word: μὴ φοβούμεναι
  choice: नहीं डरतीं
  rationale: समन्वित वर्तमान कृदन्त को हिन्दी में सीमित क्रिया बनाकर निरन्तर आचरण या मनोवृत्ति व्यक्त की गई है।
- source_word: μηδεμίαν πτόησιν
  choice: किसी भी भयावह बात से
  rationale: πτόησις भय, आतंक अथवा भय उत्पन्न करने वाली बात का बोध करा सकता है। यह चयन स्रोत की व्यापकता बनाए रखता है और केवल बाहरी धमकी तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: मसीही पत्नियों के लिए सारा की आज्ञाकारिता का उदाहरण
  choice: सारा ने अब्राहम की ‘आज्ञा मानी’
  alternative: सारा अब्राहम के अधीन रही
  rationale: मूल क्रिया का सीधा अर्थ रखा गया है, पर पद से आगे बढ़कर विवाह का कोई व्यापक धर्मसैद्धान्तिक तंत्र अनुवाद में नहीं जोड़ा गया।
- issue: ἀγαθοποιοῦσαι καὶ μὴ φοβούμεναι कृदन्तों का मुख्य कथन से सम्बन्ध
  choice: इसे ‘यदि’ द्वारा व्यावहारिक शर्त के रूप में व्यक्त किया गया
  alternative: ‘भलाई करती हुई और न डरती हुई’ के रूप में वर्णनात्मक सम्बन्ध
  rationale: यूनानी कृदन्तों में सम्बन्ध कुछ हद तक निहित है। सन्दर्भ में वे उस आचरण को बताते हैं जिसमें पाठिकाएँ सारा की सन्तान सिद्ध होती हैं; हिन्दी में ‘यदि’ उपदेशात्मक और शर्त-सदृश बल को स्पष्ट करता है, बिना इसे किसी विस्तृत धर्मवैज्ञानिक शर्त में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वामी’ को परमेश्वर की उपाधि न समझे जाने के लिए वाक्य में ‘उसे’ स्पष्ट है। सम्बोधन पत्नियों से होने के कारण ‘करती हो’ और ‘डरतीं’ स्त्रीलिंग बहुवचन में हैं।
