id: 1PE.3.16
reference: 1 Peter 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀλλὰ μετὰ πραΰτητος καὶ φόβου, συνείδησιν ἔχοντες ἀγαθήν, ἵνα ἐν ᾧ ⸀καταλαλεῖσθε καταισχυνθῶσιν οἱ ἐπηρεάζοντες ὑμῶν τὴν ἀγαθὴν ἐν Χριστῷ ἀναστροφήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/016.yaml
  text: but with gentleness and fear[a], having a good conscience, so that in what you are slandered[c][b], those who revile your good conduct in Messiah may be put to shame.
translation:
  language: hi
  text: बल्कि नम्रता और भय के साथ[a], अच्छा विवेक रखते हुए, ताकि जिस बात में तुम्हारी निन्दा की जाती है[b], जो लोग मसीह[c] में तुम्हारे अच्छे आचरण की निन्दा करते हैं, वे लज्जित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नम्रता और श्रद्धा के साथ,’ अथवा ‘नम्रता और आदर के साथ।’
    reason: lexical_alternative
  - marker: b
    text: या ‘जिस विषय में तुम्हारे विरुद्ध कहा जाता है।’
    reason: lexical_alternative
  - marker: c
    text: या पारम्परिक रूप से, ‘ख्रीस्त।’
    reason: alternative_reading
lexical_decisions:
- source_word: πραΰτητος
  choice: नम्रता
  rationale: यह शब्द कठोरता से रहित, विनीत व्यवहार को व्यक्त करता है। आधुनिक हिन्दी में ‘नम्रता’ स्वाभाविक और स्पष्ट है।
- source_word: φόβου
  choice: भय
  rationale: मूल शब्द भय, श्रद्धा या आदर का भाव दे सकता है। ‘भय’ रखकर उसके आशय और लक्ष्य को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: συνείδησιν ἔχοντες ἀγαθήν
  choice: अच्छा विवेक रखते हुए
  rationale: यह सहभागी पदबंध मुख्य आज्ञा के साथ चलने वाली निरन्तर अवस्था को व्यक्त करता है और यूनानी रचना के निकट रहता है।
- source_word: ἐν ᾧ
  choice: जिस बात में … उसी में
  rationale: यह संक्षिप्त सम्बन्धवाचक पदबंध उस विषय या क्षेत्र की ओर संकेत करता है जिसमें विश्वासियों की निन्दा होती है; हिन्दी में यह रचना अर्थ को खुला रखते हुए स्पष्ट है।
- source_word: καταλαλεῖσθε
  choice: तुम्हारी निन्दा की जाती है
  rationale: क्रिया किसी के विरुद्ध शत्रुतापूर्वक बोलने का अर्थ देती है। ‘निन्दा’ हिन्दी में स्वाभाविक है और कर्मवाच्य रूप को बनाए रखती है।
- source_word: καταισχυνθῶσιν
  choice: वे लज्जित हों
  rationale: ἵνα के बाद का कर्मवाच्य सम्भावनार्थक रूप उद्देश्य या परिणाम बताता है। हिन्दी में ‘लज्जित हों’ इसी भाव को सहज रूप से व्यक्त करता है।
- source_word: ἐπηρεάζοντες
  choice: लांछन लगाते हैं
  rationale: यहाँ विरोधी लोगों द्वारा अपमानजनक और शत्रुतापूर्ण आक्रमण का भाव है। आचरण के सम्बन्ध में ‘लांछन लगाना’ हिन्दी में स्वाभाविक है और मौखिक बदनामी का संकेत देता है।
- source_word: ἀναστροφήν
  choice: आचरण
  rationale: शब्द जीवन-व्यवहार या चाल-चलन को सूचित करता है। ‘आचरण’ संक्षिप्त, गरिमापूर्ण और नैतिक सन्दर्भ में स्पष्ट है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: Χριστός यहाँ उपाधि के रूप में है। हिन्दी में ‘मसीह’ इसका स्थापित अर्थपूर्ण रूप है और सम्बन्धसूचक ‘में’ यूनानी पदबंध को बनाए रखता है।
- source_word: ἀγαθήν / ἀγαθὴν
  choice: अच्छा / अच्छे
  rationale: विवेक और आचरण दोनों के लिए मूल में एक ही विशेषण आया है; हिन्दी में ‘अच्छा’ की पुनरावृत्ति इस शब्दगत सम्बन्ध को सुरक्षित रखती है।
theological_decisions:
- issue: ‘नम्रता और भय’ में φόβου का आशय
  choice: मुख्य पाठ में ‘भय’ रखा गया और उसके लक्ष्य को अनिर्दिष्ट छोड़ा गया।
  alternative: श्रद्धा; आदर; परमेश्वर का भय
  rationale: निकटवर्ती पाठ स्पष्ट नहीं करता कि भय किसका है। ‘भय’ मूल की व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- issue: Χριστῷ का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट; अभिषिक्त जन
  rationale: इस पदबंध में उपाधि का अर्थ सक्रिय है। ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित है और ‘अभिषिक्त जन’ के अर्थ को वहन करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मध्यम रूप से औपचारिक शैली अपनाई गई है। ‘ऐसा करो’ पिछले पद की आज्ञा से इस अंश का व्याकरणिक सम्बन्ध स्पष्ट करता है; इसे नया स्वतंत्र आदेश नहीं बनाया गया। ‘विवेक,’ ‘आचरण’ और ‘लज्जित’ सामान्य पाठकों के लिए परिचित रहते हुए शास्त्रीय गरिमा बनाए रखते हैं।
