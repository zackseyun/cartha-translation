translation:
  language: hi
  text: बल्कि तुम्हारा श्रृंगार हृदय का वह छिपा हुआ व्यक्ति हो, जो नम्र और शांत आत्मा की अविनाशी सुंदरता में है; यह परमेश्वर की दृष्टि में बहुत अनमोल है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρυπτὸς τῆς καρδίας ἄνθρωπος
  choice: हृदय का छिपा हुआ मनुष्य
  rationale: यह यूनानी पद भीतर के अदृश्य व्यक्तित्व को दर्शाता है। ‘मनुष्य’ ἄνθρωπος की औपचारिक प्रतिध्वनि बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ आशय पुरुष-लिंग से नहीं, भीतरी व्यक्तित्व से है।
- source_word: ἐν τῷ ἀφθάρτῳ
  choice: अविनाशी सुंदरता से सजा हुआ
  rationale: मूल में विशेषण संज्ञा के बिना आया है और वाक्य संक्षिप्त है। पिछले पद के बाहरी श्रृंगार के विपरीत यहाँ ‘सुंदरता’ प्रसंग से ग्रहण की गई है; ‘से सजा हुआ’ हिन्दी में ἐν की भूमिका और श्रृंगार-संबंधी विरोध को स्वाभाविक बनाता है।
- source_word: πραέως
  choice: नम्र
  rationale: ‘नम्र’ πραΰς की सौम्यता और अहंकाररहित भाव को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; इसका आशय दुर्बलता नहीं है।
- source_word: ἡσυχίου
  choice: शांत
  rationale: ‘शांत’ यहाँ स्थिर, चैनपूर्ण और उपद्रवरहित स्वभाव बताता है, केवल न बोलने को नहीं।
- source_word: πνεύματος
  choice: आत्मा
  rationale: ‘आत्मा’ मूल की मानवशास्त्रीय भाषा को बनाए रखता है; ‘स्वभाव’ अधिक व्याख्यात्मक होता।
- source_word: ὅ ἐστιν ἐνώπιον τοῦ θεοῦ πολυτελές
  choice: जो परमेश्वर के सामने बहुत अनमोल है
  rationale: यह अनुवाद सम्बन्धवाचक रचना और परमेश्वर द्वारा किए गए मूल्यांकन को बनाए रखता है। ‘बहुत अनमोल’ πολυτελές के अत्यधिक मूल्य को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: लिंग-संदर्भ वाले प्रसंग में ἄνθρωπος का आशय
  choice: मुख्य पाठ में ‘मनुष्य’ रखकर पादटिप्पणी में ‘भीतरी व्यक्तित्व’ का अर्थ स्पष्ट किया गया है।
  alternative: ‘हृदय का छिपा हुआ व्यक्तित्व’ या ‘भीतरी मनुष्य’
  rationale: ἄνθρωπος का रूपकात्मक प्रयोग यहाँ भीतर के स्व को दर्शाता है, किसी पुरुष व्यक्ति को नहीं। औपचारिक अभिव्यक्ति बनाए रखते हुए पादटिप्पणी संभावित लिंग-संबंधी भ्रम दूर करती है।
- issue: ἀφθάρτῳ के साथ निहित संज्ञा
  choice: प्रसंग के आधार पर ‘सुंदरता’ की पूर्ति की गई है।
  alternative: ‘अविनाशी गुण’ अथवा संज्ञा की पूर्ति किए बिना अत्यंत शाब्दिक रचना
  rationale: पद 3 के बाहरी श्रृंगार के साथ विरोध भीतर की अविनाशी सुंदरता की ओर संकेत करता है। पादटिप्पणी बताती है कि ‘सुंदरता’ मूल में स्पष्ट संज्ञा के रूप में नहीं है।
- issue: ἡσύχιος का नैतिक आशय
  choice: ‘शांत’ को स्थिर और शांतिप्रिय स्वभाव के अर्थ में लिया गया है।
  alternative: इसे केवल मौन या न बोलने की आज्ञा समझना
  rationale: यह शब्द प्रसंग में आंतरिक वृत्ति का वर्णन करता है; इसे अनिवार्य मौन तक सीमित करना अर्थ को संकरा कर देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य को पिछले पद के ‘श्रृंगार’ वाले प्रसंग से जोड़ने हेतु ‘से सजा हुआ’ प्रयोग किया गया है। ‘नम्र और शांत आत्मा’ पारंपरिक बाइबिलीय शब्दावली को बनाए रखती है, और पादटिप्पणियाँ संक्षिप्त यूनानी रचना की अस्पष्टता को ईमानदारी से दर्शाती हैं।
