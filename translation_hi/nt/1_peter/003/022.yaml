    reason: lexical_alternative
lexical_decisions:
- source_word: ὅς
  choice: वह
  rationale: यह सम्बन्धवाचक सर्वनाम पिछले पद में उल्लिखित यीशु मसीह की ओर संकेत करता है। स्वतंत्र हिन्दी वाक्य में ‘वह’ स्वाभाविक है और कोई अतिरिक्त बल नहीं जोड़ता।
- source_word: ἐν δεξιᾷ θεοῦ
  choice: परमेश्वर की दाहिनी ओर
  rationale: यह परमेश्वर के साथ मसीह के महिमामय और सर्वोच्च स्थान का बाइबलीय मुहावरा है। ‘दाहिनी ओर’ स्थानात्मक-सम्बन्धात्मक भाषा को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: πορευθεὶς
  choice: जाकर
  rationale: कृदन्त मुख्य कथन से पहले पूरी हुई गति को बताता है। ‘जाकर’ हिन्दी में इस पूर्ववर्ती क्रिया और वाक्यगत सम्बन्ध को सहज ढंग से व्यक्त करता है।
- source_word: εἰς οὐρανόν
  choice: स्वर्ग में
  rationale: εἰς भीतर की ओर गति दर्शाता है। हिन्दी में ‘स्वर्ग में जाना’ स्वाभाविक है और ‘into heaven’ की दिशात्मकता को बनाए रखता है।
- source_word: ὑποταγέντων αὐτῷ
  choice: उसके अधीन कर दी गई हैं
  rationale: यह निष्क्रिय रूप है और मसीह के प्रति पूर्ण अधीनता बताता है। हिन्दी में यह वाक्यांश निष्क्रियता और परिणामस्वरूप बनी अधीन अवस्था दोनों को स्पष्ट रखता है।
- source_word: ἀγγέλων
  choice: स्वर्गदूत
  rationale: इस स्वर्गीय और ब्रह्मांडीय सन्दर्भ में यह शब्द मानवीय दूतों के बजाय अलौकिक स्वर्गदूतों को दर्शाता है।
- source_word: ἐξουσιῶν
  choice: अधिकार
  rationale: ब्रह्मांडीय श्रेणियों की सूची में यह सत्ता या अधिकार रखने वाली शक्तियों का द्योतक है। ‘अधिकार’ अगले शब्द ‘शक्तियाँ’ से भेद बनाए रखता है और अनावश्यक रूप से उनकी नैतिक प्रकृति तय नहीं करता।
- source_word: δυνάμεων
  choice: शक्तियाँ
  rationale: यह ब्रह्मांडीय सामर्थ्यवान शक्तियों की श्रेणी को व्यक्त करता है। आधुनिक हिन्दी में ‘शक्तियाँ’ संक्षिप्त और समझने योग्य है।
theological_decisions:
- issue: परमेश्वर की दाहिनी ओर मसीह की महिमा
  choice: ‘परमेश्वर की दाहिनी ओर’ के बाइबलीय स्थानात्मक-सम्बन्धात्मक मुहावरे को यथावत रखना
  alternative: ‘परमेश्वर के पास सर्वोच्च सम्मान के स्थान पर’
  rationale: मूल अभिव्यक्ति मसीह की महिमा और अधिकार दोनों का गहरा धर्मवैचारिक अर्थ रखती है। व्याख्यात्मक रूपक में बदलने से पाठ का स्थानात्मक आयाम घट जाता।
- issue: ‘स्वर्गदूत, अधिकार और शक्तियाँ’ किन्हें दर्शाते हैं
  choice: उन्हें स्वर्गीय या ब्रह्मांडीय प्राणियों और शक्तियों की व्यापक श्रेणियों के रूप में रहने देना
  alternative: केवल पवित्र स्वर्गदूत; अथवा केवल विरोधी दुष्ट आत्मिक शक्तियाँ
  rationale: यूनानी सूची उनकी नैतिक प्रकृति को स्पष्ट नहीं करती। व्यापक शब्दावली बनाए रखने से पाठ की वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। अर्धविराम मुख्य कथन और अधीन की गई ब्रह्मांडीय श्रेणियों के कथन को स्पष्ट रूप से जोड़ता है। पादटिप्पणी-चिह्न को ‘स्वर्ग में’ के बाद रखा गया है, क्योंकि वैकल्पिक अनुवाद उसी यूनानी पदबंध εἰς οὐρανόν से सम्बन्धित है।
