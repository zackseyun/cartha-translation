  text: ὁ γὰρ θέλων ζωὴν ἀγαπᾶν καὶ ἰδεῖν ἡμέρας ἀγαθὰς παυσάτω τὴν ⸀γλῶσσαν ἀπὸ κακοῦ καὶ ⸀χείλη τοῦ μὴ λαλῆσαι δόλον,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/010.yaml
  text: For the one who wants to love life and see good days must keep his tongue from evil and his lips from speaking deceit[a].
translation:
  language: hi
  text: क्योंकि जो जीवन से प्रेम करना और अच्छे दिन देखना चाहता है, वह अपनी जीभ को बुराई से और अपने होंठों को छल बोलने से रोके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कपट बोलने से।” यूनानी संज्ञा का अर्थ छल, कपट या धोखेबाज़ी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... θέλων
  choice: जो ... चाहता है
  rationale: लेख सहित वर्तमान कृदंत यहाँ सामान्य रूप से किसी भी व्यक्ति को सूचित करता है। हिंदी का ‘जो ... चाहता है’ स्वाभाविक है और यूनानी के एकवचन प्रतिनिधिक भाव को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश के लिए शास्त्रीय आधार या व्याख्या प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ζωὴν ἀγαπᾶν
  choice: जीवन से प्रेम करना
  rationale: यह यूनानी पद का निकट और स्वाभाविक हिंदी रूप है तथा मूल में अनुपस्थित स्वत्वसूचक भाव नहीं जोड़ता।
- source_word: ἰδεῖν ἡμέρας ἀγαθὰς
  choice: अच्छे दिन देखना
  rationale: ‘देखना’ मूल की ठोस अभिव्यक्ति और अनुभव करने के मुहावरेदार अर्थ, दोनों को बनाए रखता है। ‘अच्छे’ का अर्थ केवल भौतिक समृद्धि तक सीमित नहीं है।
- source_word: παυσάτω
  choice: रोके
  rationale: अओरिस्ट आज्ञार्थक का नैतिक निर्देश हिंदी में ‘रोके’ द्वारा स्वाभाविक रूप से व्यक्त होता है, विशेषकर ‘से’ वाले पूरकों के साथ।
- source_word: τὴν γλῶσσαν ἀπὸ κακοῦ
  choice: अपनी जीभ को बुराई से
  rationale: शरीर के अंग के साथ ‘अपनी’ हिंदी में स्वाभाविक है। ‘बुराई’ मूल अभिव्यक्ति की व्यापकता को सुरक्षित रखती है।
- source_word: χείλη
  choice: अपने होंठों को
  rationale: बहुवचन की ठोस वाणी-संबंधी छवि और एकवचन कर्ता से स्वाभाविक संबंध दोनों बनाए रखे गए हैं।
- source_word: τοῦ μὴ λαλῆσαι δόλον
  choice: छल की बातें कहने से
  rationale: निषेधात्मक आर्टिक्युलर इनफिनिटिव यहाँ रोकने या बचाए रखने का भाव देता है। यह रूप आधुनिक हिंदी में स्पष्ट है और δόλος के कपटपूर्ण वचन के अर्थ को व्यक्त करता है।
theological_decisions:
- issue: सामान्य एकवचन और लिंग-प्रतिनिधित्व
  choice: कर्ता के लिए ‘जो ... चाहता है’ तथा उसके अनुरूप ‘अपनी जीभ’ और ‘अपने होंठ’
  alternative: ‘जो कोई ... चाहे, वे अपनी...’ या स्पष्ट पुरुषवाची ‘वह पुरुष...’
  rationale: यूनानी एकवचन है, पर उसका संदर्भ सामान्य और प्रतिनिधिक है। हिंदी की संबंधवाचक रचना बिना अनावश्यक पुरुष-विशेष अर्थ जोड़े एकवचन की संगति बनाए रखती है।
- issue: ‘अच्छे दिन’ का आशय
  choice: मूल की व्यापक और मुहावरेदार अभिव्यक्ति ‘अच्छे दिन देखना’ बनाए रखना
  alternative: ‘समृद्धि के दिन देखना’ या ‘सुखी जीवन पाना’
  rationale: ἀγαθός को केवल आर्थिक समृद्धि या दुःखरहित जीवन के अर्थ में सीमित करना मूल से अधिक व्याख्यात्मक होता; पाठ की संभावित व्यापकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। भजन-संहिता से लिए गए कथन की काव्यात्मक समानांतरता—‘जीभ ... बुराई’ और ‘होंठ ... छल’—यथासंभव सुरक्षित रखी गई है।
