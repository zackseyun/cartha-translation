reference: 1 Peter 3:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι καὶ Χριστὸς ἅπαξ περὶ ἁμαρτιῶν ⸀ἔπαθεν, δίκαιος ὑπὲρ ἀδίκων, ἵνα ⸀ὑμᾶς προσαγάγῃ τῷ θεῷ, θανατωθεὶς μὲν σαρκὶ ζῳοποιηθεὶς δὲ πνεύματι·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/018.yaml
  text: For Messiah also suffered once for sins[a], the righteous for the unrighteous, so that he might bring you to God[b], having been put to death in the flesh but made alive in the spirit.
translation:
  language: hi
  text: क्योंकि मसीह ने भी पापों के लिए एक बार दुःख सहा[a]—धर्मी ने अधर्मियों के लिए—ताकि वह तुम्हें परमेश्वर के पास ले आए। वह शरीर में तो मार डाला गया, पर आत्मा में जीवित किया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “दुःख सहा” के स्थान पर “मर गया” है।
    reason: textual_variant
  - marker: b
    text: या, “पवित्र आत्मा के द्वारा जीवित किया गया।” यूनानी में “आत्मा” जीवन के क्षेत्र या पक्ष को, अथवा पवित्र आत्मा के कर्तृत्व को सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: यह स्वाभाविक और प्रचलित हिन्दी उपाधि है तथा Χριστός के अभिषिक्त-मसीही अर्थ को बनाए रखती है।
- source_word: ἅπαξ
  choice: एक बार
  rationale: यह क्रिया-विशेषण के सीधे अर्थ को व्यक्त करता है; ‘सदा के लिए’ जोड़ने से मूल में निहित अर्थ से अधिक स्पष्टता आ जाती।
- source_word: περὶ ἁμαρτιῶν
  choice: पापों के लिए
  rationale: इस उद्धारात्मक प्रसंग में περί के साथ संबंधवाचक रूप को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔπαθεν
  choice: दुःख सहा
  rationale: SBLGNT के पाठ ἔπαθεν का सीधा अर्थ रखा गया है; वैकल्पिक पाठ ‘मर गया’ पादटिप्पणी में दिया गया है।
- source_word: δίκαιος ὑπὲρ ἀδίκων
  choice: धर्मी ने अधर्मियों के लिए
  rationale: मसीह और अधर्मियों के बीच प्रतिनिधिक/प्रतिस्थापनात्मक विरोध को रखता है, पर प्रायश्चित का कोई विस्तृत सिद्धान्त नहीं जोड़ता।
- source_word: προσαγάγῃ
  choice: पास ले आए
  rationale: किसी की उपस्थिति में पहुँचाने या पहुँच दिलाने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: θανατωθεὶς ... σαρκὶ
  choice: शरीर में तो मार डाला गया
  rationale: निष्क्रिय वाच्य और μὲν ... δὲ के विरोध को बनाए रखता है; इस प्रसंग में ‘शरीर’ सामान्य पाठक के लिए ‘देहधारी नश्वर अस्तित्व’ का स्वाभाविक संकेत है।
- source_word: ζῳοποιηθεὶς ... πνεύματι
  choice: पर आत्मा में जीवित किया गया
  rationale: निष्क्रिय वाच्य तथा σαρκί/πνεύματι के समानांतर रूप को बनाए रखते हुए दायरे/पक्ष की व्याख्या को मुख्य पाठ में रखता है।
theological_decisions:
- issue: अंतिम वाक्यांश में शरीर और आत्मा का विरोध
  choice: ‘शरीर में ... आत्मा में’ रखकर दोनों समानांतर दत्तिव रूपों को क्षेत्र या पक्ष के रूप में प्रस्तुत किया गया है।
  alternative: ‘शरीर में ... आत्मा के द्वारा’, जहाँ ‘आत्मा’ से पवित्र आत्मा का कर्तृत्व समझा जाता है।
  rationale: यूनानी वाक्यांश संक्षिप्त और व्याख्यात्मक रूप से अस्पष्ट है। मुख्य पाठ किसी एक मत को निर्णायक न बनाकर तनाव को सुरक्षित रखता है; वैकल्पिक कर्तृवाचक अर्थ पादटिप्पणी में है।
- issue: ‘धर्मी ने अधर्मियों के लिए’ का प्रतिस्थापनात्मक बल
  choice: प्रतिनिधिक/प्रतिस्थापनात्मक संरचना को संक्षिप्त रूप में बनाए रखा गया है।
  alternative: ‘निर्दोष ने दोषियों के स्थान पर’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति।
  rationale: ὑπέρ दूसरों के हित में या उनकी ओर से दुःख सहने का अर्थ देता है, लेकिन अनुवाद को मूल से अधिक विकसित प्रायश्चित-सिद्धान्त नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘धर्मी ने अधर्मियों के लिए’ को डैश के बीच रखकर यूनानी के संक्षिप्त विरोध को पठनीय बनाया गया है। ‘तो ... पर’ से μὲν ... δὲ का विरोध व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
