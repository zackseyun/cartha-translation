  text: κύριον δὲ τὸν ⸀Χριστὸν ἁγιάσατε ἐν ταῖς καρδίαις ὑμῶν, ⸀ἕτοιμοι ἀεὶ πρὸς ἀπολογίαν παντὶ τῷ αἰτοῦντι ὑμᾶς λόγον περὶ τῆς ἐν ὑμῖν ἐλπίδος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/015.yaml
  text: But regard Messiah the Lord as holy in your hearts[a], always ready for a defense to everyone who asks you for a reason concerning the hope that is in you[b],
translation:
  language: hi
  text: पर अपने हृदयों में मसीह को प्रभु के रूप में पवित्र मानो[a], और जो कोई तुमसे उस आशा के विषय में कारण पूछे जो तुम में है, उसे उत्तर देने के लिए सदा तैयार रहो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “अपने हृदयों में मसीह को प्रभु मानकर पवित्र ठहराओ।”'
    reason: lexical_alternative
  - marker: b
    text: “उत्तर” का अर्थ अपने विश्वास का कारण बताना या उसके पक्ष में प्रतिरक्षा प्रस्तुत करना है। “तुम में” का अर्थ व्यक्तियों के भीतर या तुम लोगों के बीच भी हो सकता है।
    reason: source_ambiguity
lexical_decisions:
- source_word: κύριον ... τὸν Χριστόν
  choice: प्रभु मसीह
  rationale: यूनानी पदक्रम और उपाधियों को स्वाभाविक हिन्दी में सुरक्षित रखता है; Χριστός को यहाँ उपाधि के रूप में ‘मसीह’ किया गया है।
- source_word: ἁγιάσατε
  choice: पवित्र मानो
  rationale: आज्ञार्थक क्रिया के ‘पवित्र ठहराना/मानना’ भाव को व्यक्त करता है और यह भ्रम नहीं पैदा करता कि मनुष्य मसीह को वस्तुतः पवित्र बनाते हैं।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: अपने हृदयों में
  rationale: भीतरी व्यक्ति और बहुवचन दोनों को निकटता से सुरक्षित रखता है।
- source_word: ἕτοιμοι ἀεὶ
  choice: सदा तैयार रहो
  rationale: यूनानी विशेषण और कालवाचक क्रियाविशेषण का सहज हिन्दी रूप।
- source_word: πρὸς ἀπολογίαν
  choice: उत्तर देने के लिए
  rationale: ἀπολογία के प्रसंगगत अर्थ—अपने विश्वास के पक्ष में स्पष्टीकरण या प्रतिरक्षा—को सामान्य पाठक के लिए स्वाभाविक रूप में व्यक्त करता है।
- source_word: παντὶ τῷ αἰτοῦντι ὑμᾶς
  choice: जो कोई तुमसे ... पूछे, उसे
  rationale: παντί की सर्वसमावेशी-वितरणात्मक शक्ति और पूछने वाले व्यक्ति को स्पष्ट करता है।
- source_word: λόγον
  choice: कारण
  rationale: यहाँ λόγος आशा का आधार या तर्कसंगत स्पष्टीकरण माँगे जाने का भाव देता है।
- source_word: περὶ τῆς ἐν ὑμῖν ἐλπίδος
  choice: तुम्हारे भीतर की आशा का
  rationale: ἐν ὑμῖν की वास्तविक अस्पष्टता—व्यक्तियों के भीतर या समुदाय के बीच विद्यमान आशा—को मुख्य पाठ में सहज रूप से और पादटिप्पणी में स्पष्टतः सुरक्षित रखता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός प्रभु के साथ जुड़ी उपाधि है; ‘मसीह’ हिन्दी में उसके मसीही-अभिषिक्त पद को व्यक्त करता है।
- issue: ἁγιάσατε का मसीह के संबंध में अर्थ
  choice: पवित्र मानो
  alternative: पवित्र ठहराओ
  rationale: स्रोत की पवित्रता-संबंधी भाषा बनाए रखते हुए यह स्पष्ट करता है कि विश्वासी प्रभु मसीह की पवित्रता को अपने हृदयों में स्वीकार और आदर देते हैं, उन्हें पवित्र बनाते नहीं।
- issue: ἀπολογία की शक्ति
  choice: उत्तर देने के लिए
  alternative: प्रतिरक्षा करने के लिए
  rationale: शब्द में पक्ष-समर्थन और स्पष्टीकरण दोनों का भाव है; मुख्य पाठ में सहज अभिव्यक्ति और पादटिप्पणी में अधिक शाब्दिक विकल्प दिया गया है।
- issue: ἐν ὑμῖν का आशय
  choice: तुम्हारे भीतर
  alternative: तुम लोगों के बीच
  rationale: यूनानी बहुवचन दोनों अर्थों की अनुमति देता है; मुख्य पाठ पारंपरिक आंतरिक अर्थ रखता है और पादटिप्पणी सामुदायिक संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज वाक्य-विन्यास। ‘हृदयों’ से स्रोत का बहुवचन और ‘मसीह’ से उपाधि का भाव सुरक्षित रखा गया है।
