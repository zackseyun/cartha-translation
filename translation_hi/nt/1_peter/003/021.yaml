  text: ὃ ⸂καὶ ὑμᾶς ἀντίτυπον νῦν⸃ σῴζει βάπτισμα, οὐ σαρκὸς ἀπόθεσις ῥύπου ἀλλὰ συνειδήσεως ἀγαθῆς ἐπερώτημα εἰς θεόν, δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/021.yaml
  text: Corresponding to that[a], baptism now also saves you—not the removal of dirt from the flesh, but an appeal to God for a good conscience—through the resurrection of Jesus the Messiah,
translation:
  language: hi
  text: उसी के अनुरूप, बपतिस्मा अब तुम्हें भी बचाता है—देह का मैल हटाने के रूप में नहीं, बल्कि अच्छे विवेक के लिए परमेश्वर से विनती[a] के रूप में—यीशु मसीह के पुनरुत्थान के द्वारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के प्रति अच्छे विवेक की प्रतिज्ञा।” ‘विनती’ के लिए प्रयुक्त यूनानी शब्द (ἐπερώτημα) का अर्थ ‘प्रतिज्ञा’ या ‘उत्तर’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀντίτυπον
  choice: उसी के अनुरूप
  rationale: यह शब्द पिछले पद में वर्णित जलप्रलय के पानी की ओर संकेत करके बपतिस्मे के साथ अनुरूपता स्थापित करता है। यह अनुवाद उस संबंध को स्पष्ट रखता है, पर बाद की तकनीकी धार्मिक शब्दावली नहीं थोपता।
- source_word: σῴζει
  choice: बचाता है
  rationale: यूनानी वर्तमानकालीन कथन को सीधे रखा गया है। इसे ‘प्रतीक है’ जैसे शब्दों से कमजोर नहीं किया गया; आगे के वाक्यांश स्वयं इसका अर्थ सीमित और स्पष्ट करते हैं।
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: यह आधुनिक हिन्दी में प्रचलित और सटीक धार्मिक शब्द है। इसे ‘धुलाई’ नहीं कहा गया, क्योंकि लेखक तुरंत बाहरी शारीरिक सफाई से इसका भेद करता है।
- source_word: σαρκὸς ἀπόθεσις ῥύπου
  choice: देह का मैल हटाना
  rationale: संदर्भ में σάρξ भौतिक देह को सूचित करता है। यह सहज हिन्दी में बाहरी सफाई का अर्थ व्यक्त करता है।
- source_word: συνειδήσεως ἀγαθῆς
  choice: शुद्ध विवेक
  rationale: शाब्दिक ‘अच्छा विवेक’ की अपेक्षा ‘शुद्ध विवेक’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर के सामने सही अंतःकरण का भाव व्यक्त करता है, बिना यह तय किए कि वह विनती का स्रोत है या लक्ष्य।
- source_word: ἐπερώτημα
  choice: विनती
  rationale: εἰς θεόν के साथ यह परमेश्वर की ओर की गई प्रार्थना या निवेदन के अर्थ में अच्छी तरह बैठता है। शब्द के संभावित ‘प्रतिज्ञा’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἰς θεόν
  choice: परमेश्वर से
  rationale: ‘विनती’ के साथ हिन्दी में निवेदन के प्राप्तकर्ता को ‘से’ द्वारा व्यक्त करना स्वाभाविक है।
- source_word: δι’ ἀναστάσεως
  choice: पुनरुत्थान के द्वारा
  rationale: διά तथा संबंधकारक यहाँ माध्यम को व्यक्त करते हैं; ‘के द्वारा’ इस साधनात्मक संबंध को स्पष्ट रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός का पदवीगत अर्थ हिन्दी के परंपरागत और बोधगम्य ‘मसीह’ में बना रहता है।
theological_decisions:
- issue: उद्धार से बपतिस्मे का संबंध
  choice: ‘बपतिस्मा अब तुम्हें भी बचाता है’ कथन को सीधे बनाए रखा गया है और लेखक की अपनी व्याख्यात्मक सीमा उसके बाद दी गई है।
  alternative: इसे केवल उद्धार का प्रतीक कहना, अथवा किसी विशिष्ट सम्प्रदाय की संस्कार-संबंधी शिक्षा जोड़ना।
  rationale: मूल पाठ बपतिस्मे के विषय में सीधे ‘बचाता है’ कहता है, फिर स्पष्ट करता है कि आशय केवल देह की बाहरी सफाई नहीं है और इसे यीशु के पुनरुत्थान से जोड़ता है। अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
- issue: ἐπερώτημα का अर्थ
  choice: मुख्य पाठ में ‘विनती’ और पादटिप्पणी में ‘प्रतिज्ञा’ का विकल्प।
  alternative: मुख्य पाठ में ‘प्रतिज्ञा’ या ‘उत्तर’।
  rationale: यह शब्दार्थ वास्तव में विवादित है। εἰς θεόν के साथ ‘विनती’ सुगम है, किंतु ‘प्रतिज्ञा’ भी पर्याप्त रूप से समर्थित है; इसलिए उसे दबाने के बजाय पादटिप्पणी में रखा गया है।
- issue: συνειδήσεως ἀγαθῆς का संबंध
  choice: ‘शुद्ध विवेक की विनती’ जैसी संक्षिप्त रचना, जो विनती और विवेक का संबंध बनाए रखती है।
  alternative: ‘शुद्ध विवेक से की गई विनती’ या ‘शुद्ध विवेक के लिए विनती’।
  rationale: यूनानी संबंधकारक संक्षिप्त और अर्थ की दृष्टि से खुला है। हिन्दी मुख्य पाठ में ऐसा रूप चुना गया है जो स्रोत या लक्ष्य को अत्यधिक निश्चित नहीं करता; वैकल्पिक ‘प्रतिज्ञा’ पठन पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे यूनानी वाक्य का संबंध दो डैशों से सुरक्षित रखा गया है। ‘देह’, ‘विवेक’, ‘पुनरुत्थान’ और ‘मसीह’ जैसे स्थापित हिन्दी बाइबलीय शब्दों का प्रयोग किया गया है।
