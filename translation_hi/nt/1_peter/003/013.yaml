lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: पिछले उपदेश से संबंध बनाए रखने वाला तटस्थ संयोजक।
- source_word: τίς ὁ κακώσων ὑμᾶς
  choice: कौन तुम्हें हानि पहुँचाएगा
  rationale: भावी कृदंत सहित यूनानी प्रश्न का स्वाभाविक हिन्दी रूप; यह व्यापक अर्थ में हानि या दुर्व्यवहार दोनों को समेटता है।
- source_word: ἐὰν
  choice: यदि
  rationale: संभाव्य शर्त को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦ ἀγαθοῦ
  choice: भलाई के लिए
  rationale: नपुंसकलिंग विशेषण के भाववाचक अर्थ को सहज हिन्दी में व्यक्त करता है और इसे किसी एक भले काम तक सीमित नहीं करता।
- source_word: ζηλωταὶ γένησθε
  choice: उत्साही बनो
  rationale: ζηλωτής की प्रबल लगन और γίνομαι के ‘बनना’ भाव, दोनों को बनाए रखता है।
theological_decisions:
- issue: धार्मिकता के कारण दुःख के संदर्भ में आलंकारिक प्रश्न का बल
  choice: वचन को सामान्य आलंकारिक आश्वासन के रूप में रखा गया है, पर इसे दुःख से पूर्ण सुरक्षा की प्रतिज्ञा नहीं बनाया गया।
  alternative: ऐसा निरपेक्ष कथन कि विश्वासियों को कोई वास्तविक हानि पहुँचा ही नहीं सकता।
  rationale: अगले पद स्वयं भलाई के कारण दुःख सहने की संभावना स्वीकार करते हैं; इसलिए मूल प्रश्न का तनाव अनसुलझा रखा गया है।
