  yaml_path: translation/nt/1_peter/003/017.yaml
  text: For it is better to suffer for doing good[a], if the will of God should so will it[b], than for doing evil.
translation:
  language: hi
  text: क्योंकि भलाई करते हुए दुःख उठाना[a]—यदि परमेश्वर की इच्छा ऐसा चाहती हो[b]—बुराई करते हुए दुःख उठाने से अच्छा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘भलाई करने के कारण दुःख उठाना … बुराई करने के कारण दुःख उठाने से’ भी हो सकता है। यूनानी कृदंत कारण (‘के कारण’) या सामान्य परिस्थिति (‘करते हुए’) दोनों दर्शा सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में बलयुक्त ढंग से शाब्दिक अर्थ है, ‘यदि परमेश्वर की इच्छा ऐसा चाहे।’ मुख्य पाठ में ‘इच्छा’ और ‘चाहती’ की पुनरावृत्ति से इस बल को व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον
  choice: अच्छा है
  rationale: यह तुलनात्मक विशेषण यहाँ विधेय के रूप में प्रयुक्त है। हिंदी में ‘अच्छा है’ स्वाभाविक रूप से ‘बेहतर है’ का भाव देता है और आगे आने वाले ‘से’ के साथ तुलना स्पष्ट करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस तार्किक संबंध को सहज हिंदी में बनाए रखता है।
- source_word: ἀγαθοποιοῦντας
  choice: भलाई करते हुए
  rationale: वर्तमानकालिक कृदंत कार्य की परिस्थिति को दर्शाता है और κακοποιοῦντας के समानांतर है। ‘करते हुए’ कारण को अनिवार्य रूप से निर्धारित किए बिना उस परिस्थिति और जारी कार्य का भाव रखता है।
- source_word: εἰ θέλοι
  choice: यदि ... यही हो
  rationale: εἰ के साथ optative संभावित या अपेक्षाकृत अनिश्चित शर्त व्यक्त करता है। ‘यदि ... हो’ उस संभाव्यता को रखता है; ‘यही’ θέλοι और θέλημα के बलयुक्त संबंध का स्वाभाविक हिंदी रूप है।
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: परमेश्वर की इच्छा
  rationale: यह संबंधवाचक रचना का सीधा, गरिमापूर्ण और आधुनिक हिंदी रूप है।
- source_word: πάσχειν
  choice: दुःख उठाना
  rationale: यह κρεῖττον पर निर्भर infinitive है। ‘दुःख उठाना’ हिंदी बाइबलीय भाषा में परिचित होने के साथ आज भी स्पष्ट और स्वाभाविक है।
- source_word: ἢ
  choice: से
  rationale: तुलनात्मक रचना ‘बुराई करते हुए दुःख उठाने से अच्छा’ में हिंदी का मानक तुलनासूचक चिह्न है।
- source_word: κακοποιοῦντας
  choice: बुराई करते हुए
  rationale: यह ἀγαθοποιοῦντας के विपरीत और उसके समानांतर वर्तमानकालिक कृदंत है; समान रचना मूल पाठ का विरोधाभास बनाए रखती है।
theological_decisions:
- issue: दुःख और परमेश्वर की इच्छा का संबंध
  choice: पद यह कहता है कि भलाई करते हुए दुःख उठाना परमेश्वर की इच्छा के अंतर्गत हो सकता है, पर यह नहीं बताता कि वह संबंध आज्ञा, निर्धारण या अनुमति में से ठीक किस प्रकार का है।
  alternative: इसे या तो प्रत्येक दुःख का परमेश्वर द्वारा प्रत्यक्ष निर्धारण, या केवल निष्क्रिय अनुमति बताना।
  rationale: εἰ θέλοι τὸ θέλημα τοῦ θεοῦ परमेश्वर की इच्छा का सशर्त उल्लेख करता है, लेकिन व्यापक कारणात्मक सिद्धांत स्पष्ट नहीं करता। अनुवाद इसी धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। डैश सशर्त उपवाक्य को अलग करके मूल वाक्य की तुलना को पठनीय बनाते हैं।
