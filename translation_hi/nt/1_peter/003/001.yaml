source:
  edition: SBLGNT
  text: ⸀Ὁμοίως γυναῖκες ὑποτασσόμεναι τοῖς ἰδίοις ἀνδράσιν, ἵνα ⸀καὶ εἴ τινες ἀπειθοῦσιν τῷ λόγῳ διὰ τῆς τῶν γυναικῶν ἀναστροφῆς ἄνευ λόγου κερδηθήσονται
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/003/001.yaml
  text: Likewise[a], wives, being subject to your own husbands, so that even if some are disobeying the word, they may be won without a word through the conduct of their wives,
translation:
  language: hi
  text: उसी प्रकार, पत्नियो, अपने-अपने पतियों के अधीन रहो, ताकि यदि उनमें से कुछ वचन को नहीं मानते हों[a], तो वे भी अपनी पत्नियों के आचरण के द्वारा बिना बोले जीत लिए जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संदेश को न मानते हों”; अर्थात वे सुसमाचार के वचन को अस्वीकार करते हों।
    reason: ἀπειθέω में अविश्वास और अवज्ञा दोनों की अर्थ-छाया हो सकती है, और λόγος यहाँ सुसमाचार-संदेश को सूचित करता है।
lexical_decisions:
- source_word: Ὁμοίως
  choice: इसी प्रकार
  rationale: यह पिछले घरेलू निर्देशों से इस उपदेश का संबंध स्पष्ट करता है और यूनानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: γυναῖκες
  choice: हे पत्नियो
  rationale: ‘अपने-अपने पतियों’ के साथ प्रयुक्त होने के कारण यहाँ सामान्य ‘स्त्रियाँ’ नहीं, बल्कि ‘पत्नियाँ’ अभिप्रेत हैं। सम्बोधन को हिन्दी में स्पष्ट किया गया है।
- source_word: ὑποτασσόμεναι
  choice: अधीन रहो
  rationale: सहभागी रूप यहाँ उपदेशात्मक बल रखता है। ‘अधीन रहो’ संबंधगत व्यवस्था को व्यक्त करता है, पर ‘आज्ञा मानो’ जैसी अधिक प्रबल धारणा नहीं जोड़ता।
- source_word: τοῖς ἰδίοις ἀνδράσιν
  choice: अपने-अपने पतियों के
  rationale: घरेलू संदर्भ में ἀνήρ का अर्थ ‘पति’ है; ‘अपने-अपने’ यूनानी ἰδίοις के व्यक्तिगत संबंध पर दिए गए बल को सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अपेक्षित परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ εἴ τινες
  choice: यदि उनमें से कुछ
  rationale: संदर्भ में ‘कुछ’ अविश्वासी पतियों की ओर संकेत करता है; ‘यदि’ कठिन परिस्थिति में भी निर्देश के लागू होने का भाव रखता है।
- source_word: ἀπειθοῦσιν τῷ λόγῳ
  choice: वचन को न मानते हों
  rationale: ‘न मानना’ हिन्दी में अविश्वास और अवज्ञा दोनों की अर्थ-छाया रख सकता है और यूनानी पद की वास्तविक अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: λόγῳ
  choice: वचन
  rationale: यहाँ आशय घोषित मसीही संदेश से है; ‘वचन’ यूनानी शब्द और प्रचलित बाइबलीय प्रयोग दोनों को बनाए रखता है।
- source_word: διὰ τῆς τῶν γυναικῶν ἀναστροφῆς
  choice: अपनी पत्नियों के आचरण के द्वारा
  rationale: ἀναστροφή जीवन-व्यवहार या आचरण को दर्शाता है। संबंधसूचक संदर्भ के कारण ‘पत्नियों’ और स्वाभाविक हिन्दी के लिए ‘अपनी’ का प्रयोग किया गया है।
- source_word: ἄνευ λόγου
  choice: बिना किसी वचन के
  rationale: यह पहले आए ‘वचन’ के साथ जानबूझकर किए गए शब्दगत विरोध को सुरक्षित रखता है और पत्नी की मौखिक दलील के बिना होने का भाव देता है।
- source_word: κερδηθήσονται
  choice: जीत लिए जाएँ
  rationale: यह लोगों को प्राप्त करने या अपने पक्ष में जीतने के रूपक को बनाए रखता है, बिना उद्धार की प्रक्रिया को अधिक स्पष्ट करके पाठ से आगे बढ़े।
theological_decisions:
- issue: घरेलू निर्देश में ὑποτασσόμεναι का स्वरूप
  choice: ‘अधीन रहो’—संबंधगत अधीनता व्यक्त की गई है, पर पूर्ण आज्ञाकारिता या हीनता नहीं जोड़ी गई।
  alternative: ‘समर्पित रहो’ अथवा ‘आज्ञा मानो’
  rationale: मूल पाठ ὑποτάσσω का प्रयोग करता है, आज्ञापालन के अधिक प्रबल क्रियापद का नहीं। इसलिए अनुवाद पाठ के तनाव को बनाए रखता है और स्त्री की तात्त्विक हीनता जैसी धारणा नहीं जोड़ता।
- issue: ἀπειθοῦσιν τῷ λόγῳ में अविश्वास और अवज्ञा का संबंध
  choice: ‘वचन को न मानते हों’
  alternative: ‘संदेश पर विश्वास न करते हों’ अथवा ‘वचन की आज्ञा न मानते हों’
  rationale: यूनानी क्रिया संदर्भ के अनुसार अविश्वास और अवज्ञा दोनों का बोध करा सकती है। मुख्य पाठ का ‘न मानना’ दोनों अर्थ-छायाओं को खुला रखता है और पादटिप्पणी सुसमाचार-संदेश के संदर्भ को स्पष्ट करती है।
- issue: κερδηθήσονται में ‘जीते जाने’ का आशय
  choice: रूपकात्मक ‘जीत लिए जाएँ’
  alternative: ‘उद्धार पा जाएँ’ अथवा ‘विश्वास में लाए जाएँ’
  rationale: संदर्भ सुसमाचार की ओर जीते जाने का संकेत देता है, पर मूल क्रिया सीधे ‘उद्धार पाना’ नहीं कहती। रूपक को सुरक्षित रखने से अनुवाद व्याख्या को पाठ में नहीं मिलाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘हे पत्नियो’ सम्बोधन को स्पष्ट करता है; ‘अपने-अपने’ वैवाहिक संबंध की विशिष्टता रखता है। ‘वचन’ की पुनरावृत्ति यूनानी τῷ λόγῳ / ἄνευ λόγου के अलंकारिक विरोध को सुरक्षित रखती है।
