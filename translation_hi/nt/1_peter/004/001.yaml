  text: Χριστοῦ οὖν ⸀παθόντος σαρκὶ καὶ ὑμεῖς τὴν αὐτὴν ἔννοιαν ὁπλίσασθε, ὅτι ὁ ⸀παθὼν σαρκὶ πέπαυται ⸀ἁμαρτίας,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/001.yaml
  text: Therefore[a], since the Messiah suffered in the flesh, you also arm yourselves with the same mindset, because the one who has suffered in the flesh has ceased from sin[c][b],
translation:
  language: hi
  text: इसलिए, चूँकि मसीह ने शरीर में दुःख उठाया, तुम भी उसी मनोभाव को हथियार की तरह धारण कर लो, क्योंकि जिसने शरीर में दुःख उठाया है, वह पाप से विरत हो गया है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शरीर में’ यूनानी शब्द सार्क्स का अनुवाद है। यहाँ इसका आशय देहधारी मानवीय अस्तित्व है, अनिवार्य रूप से ‘पापी स्वभाव’ नहीं।
    reason: lexical_alternative
  - marker: b
    text: ‘जिसने शरीर में दुःख उठाया है, वह पाप से विरत हो गया है’ का आशय विवादित है। यह विशेष रूप से मसीह की ओर, उनके दुःख के नमूने में सहभागी विश्वासियों की ओर, या पाप से निर्णायक अलगाव के एक सामान्य सिद्धान्त की ओर संकेत कर सकता है।
    reason: alternative_reading
