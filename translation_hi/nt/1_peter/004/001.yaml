theological_decisions:
- issue: ‘जिसने शरीर में दुःख उठाया है’ का संकेत और ‘पाप से नाता तोड़ लिया है’ का आशय
  choice: मुख्य पाठ में कथन को व्यापक और अनिर्धारित रखा गया है।
  alternative: इसे केवल मसीह पर लागू समझना; इसे दुःख में मसीह का अनुसरण करने वाले विश्वासियों पर लागू समझना; अथवा इसे पापमय जीवन से निर्णायक अलगाव का सामान्य सिद्धान्त समझना।
  rationale: यूनानी कथन संक्षिप्त और व्याख्यात्मक रूप से विवादित है। अनुवाद किसी एक धर्मवैज्ञानिक समाधान को पाठ में नहीं जोड़ता; विकल्प पादटिप्पणी में दिए गए हैं।
