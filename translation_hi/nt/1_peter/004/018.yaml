  text: καὶ εἰ ὁ δίκαιος μόλις σῴζεται, ⸀ὁ ἀσεβὴς καὶ ἁμαρτωλὸς ποῦ φανεῖται;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/018.yaml
  text: And if the righteous is scarcely saved[b][a], where will the ungodly and the sinner appear?
translation:
  language: hi
  text: और यदि धर्मी का उद्धार कठिनाई से होता है[a], तो भक्तिहीन और पापी कहाँ दिखाई देगा[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बड़ी मुश्किल से उद्धार होता है” अथवा “मुश्किल से ही उद्धार होता है।” यहाँ भाव कठोर परीक्षाओं के बीच उद्धार पाने का है; यह आवश्यक रूप से उद्धार के अनिश्चित होने की बात नहीं कहता।
    reason: lexical_alternative
  - marker: b
    text: या, “कहाँ पाया जाएगा?”
    reason: translation_alternative
lexical_decisions:
- source_word: δίκαιος
  choice: धर्मी
  rationale: संज्ञा के रूप में प्रयुक्त एकवचन विशेषण है; ‘धर्मी’ प्रतिनिधिक एकवचन और नीतिवचन-जैसी संक्षिप्तता बनाए रखता है।
- source_word: μόλις
  choice: कठिनाई से
  rationale: यह क्रिया-विशेषण कठिनाई अथवा बड़ी मुश्किल से होने का भाव देता है। प्रसंग में यह परीक्षाओं के बीच उद्धार की कठिन राह को व्यक्त करता है, उद्धार की अनिश्चितता को अनिवार्यतः नहीं।
- source_word: σῴζεται
  choice: उद्धार ... होता है
  rationale: वर्तमान कर्मवाच्य/मध्यवाच्य रूप को हिन्दी के स्वाभाविक कर्मवाच्य में रखा गया है; इससे उद्धार का धार्मिक अर्थ और कथन का सामान्य, लोकोक्तिपरक बल बना रहता है।
- source_word: ἀσεβής
  choice: भक्तिहीन
  rationale: यह परमेश्वर के प्रति श्रद्धा या भक्ति से रहित व्यक्ति का नैतिक-धार्मिक भाव व्यक्त करता है और इसे ‘पापी’ से अलग रखता है।
- source_word: ἁμαρτωλός
  choice: पापी
  rationale: सामान्य और सटीक हिन्दी पद है; यूनानी के दोनों समन्वित वर्णनों को एक में नहीं मिलाया गया।
- source_word: ποῦ
  choice: कहाँ
  rationale: प्रश्नवाचक क्रिया-विशेषण का सीधा और स्वाभाविक अनुवाद, जो आलंकारिक प्रश्न का बल बनाए रखता है।
- source_word: φανεῖται
  choice: दिखाई देगा
  rationale: भविष्यकालीन रूप का मूल अर्थ ‘प्रकट होगा/दिखाई देगा’ है। यह सम्भावित सेप्टुआजिन्ट पृष्ठभूमि और प्रश्न की औपचारिक तीक्ष्णता को बनाए रखता है।
theological_decisions:
- issue: μόλις σῴζεται का आशय
  choice: ‘उद्धार कठिनाई से होता है’—धर्मी के उद्धार के साथ जुड़ी कठिन परीक्षा और दुःख का भाव
  alternative: ‘धर्मी मुश्किल से ही बच पाता है’—मानो उसके अंतिम उद्धार का परिणाम अनिश्चित हो
  rationale: निकटवर्ती प्रसंग दुःख, परमेश्वर के घराने से आरम्भ होने वाले न्याय और धीरज का है। अनुवाद मूल तनाव को बनाए रखता है, पर किसी विशिष्ट उद्धार-सिद्धान्त को पाठ में नहीं जोड़ता।
- issue: प्रतिनिधिक पुल्लिंग एकवचन
  choice: ‘धर्मी’ को एकवचन सामान्य प्रतिनिधि के रूप में रखना
  alternative: ‘धर्मी लोग’ अथवा ‘धर्मी व्यक्ति’
  rationale: यूनानी पाठ एकवचन पुल्लिंग और प्रतिनिधिक है; संक्षिप्त रूप से नीतिवचन-जैसी शैली भी बनी रहती है।
- issue: ἀσεβής और ἁμαρτωλός का संबंध
  choice: ‘भक्तिहीन और पापी’—दोनों पद अलग-अलग बनाए रखना
  alternative: दोनों को मिलाकर केवल ‘दुष्ट’ कहना
  rationale: यूनानी पाठ दो समन्वित नैतिक-धार्मिक विशेषण रखता है; उन्हें अलग रखना अधिक स्रोत-संगत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘धर्मी’, ‘उद्धार’, ‘भक्तिहीन’ और ‘पापी’ बाइबिलीय धार्मिक अर्थों को स्पष्ट रखते हैं। वाक्य की संक्षिप्त, नीतिवचन-जैसी और आलंकारिक प्रश्नवाचक संरचना सुरक्षित रखी गई है।
