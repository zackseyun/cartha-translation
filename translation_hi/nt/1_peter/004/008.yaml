source:
  edition: SBLGNT
  text: πρὸ ⸀πάντων τὴν εἰς ἑαυτοὺς ἀγάπην ἐκτενῆ ἔχοντες, ὅτι ἀγάπη ⸀καλύπτει πλῆθος ἁμαρτιῶν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/008.yaml
  text: Above all[a], maintain fervent love for one another[c][b], because love covers a multitude of sins.
translation:
  language: hi
  text: सबसे बढ़कर, आपस में प्रगाढ़ प्रेम बनाए रखो[a], क्योंकि प्रेम बहुत-से पापों को ढक देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आपस में प्रगाढ़ प्रेम रखते हुए।” यह कृदंत पिछले पद के उपदेशात्मक प्रवाह से जुड़ा है।
    reason: source_syntax
  - marker: b
    text: यह कथन नीतिवचन 10:12 की प्रतिध्वनि है। यहाँ “ढक देता है” का अर्थ अपराधों को न उभारना या उन्हें छिपाना भी समझा जा सकता है; मूल रूपक किसी एक अर्थ को स्पष्ट रूप से निर्धारित नहीं करता।
    reason: cross_reference
lexical_decisions:
- source_word: πρὸ πάντων
  choice: सबसे बढ़कर
  rationale: यह पदबंध समय-क्रम से अधिक प्राथमिकता और सर्वोच्च महत्त्व व्यक्त करता है; आधुनिक हिन्दी में ‘सबसे बढ़कर’ स्वाभाविक रूप से वही बल देता है।
- source_word: εἰς ἑαυτοὺς
  choice: आपस में
  rationale: समुदाय के भीतर पारस्परिकता व्यक्त करने के लिए यह सहज और स्पष्ट हिन्दी प्रयोग है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का मानक, प्रसंगानुकूल और व्यापक हिन्दी समतुल्य।
- source_word: ἐκτενῆ
  choice: प्रगाढ़
  rationale: यह शब्द खिंचे हुए समर्पण से उत्पन्न तीव्रता, गंभीरता और निरंतरता का भाव रखता है; ‘प्रगाढ़’ प्रेम की गहराई और तीव्रता दोनों व्यक्त करता है।
- source_word: ἔχοντες
  choice: बनाए रखो
  rationale: मूल में वर्तमान कृदंत है, जो पिछले पद के उपदेशात्मक प्रवाह से जुड़ा है। स्वतंत्र पद के रूप में हिन्दी में ‘बनाए रखो’ उसकी निरंतर और उपदेशात्मक शक्ति को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह प्रेम बनाए रखने के उपदेश का कारण प्रस्तुत करता है।
- source_word: καλύπτει
  choice: ढक देता है
  rationale: मूल रूपक और नीतिवचन 10:12 की प्रतिध्वनि सुरक्षित रहती है; इसे केवल ‘अनदेखा करता है’ या किसी विशिष्ट धर्मवैज्ञानिक अर्थ में सीमित नहीं किया गया।
- source_word: πλῆθος ἁμαρτιῶν
  choice: बहुत-से पापों
  rationale: यह पापों की बड़ी संख्या का स्वाभाविक आधुनिक हिन्दी रूप है और यूनानी पदबंध का आलंकारिक भार बनाए रखता है।
theological_decisions:
- issue: ‘प्रेम बहुत-से पापों को ढक देता है’ का आशय
  choice: ‘ढक देता है’ का रूपक यथावत रखा गया है और पाप किसके हैं, यह अनिर्धारित रहने दिया गया है।
  alternative: ‘बहुत-से अपराधों को अनदेखा करता है’ अथवा ‘बहुत-से पापों की क्षमा कराता है।’
  rationale: यूनानी कथन नीतिवचन-सदृश और संकेतपूर्ण है। वह स्वयं किसी एक धर्मवैज्ञानिक व्याख्या को अनिवार्य नहीं करता; इसलिए रूपक को बनाए रखना वास्तविक अस्पष्टता और तनाव की रक्षा करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, सम्मानपूर्ण और सामुदायिक उपदेश वाला स्वर रखा गया है। ‘प्रगाढ़’ तीव्र तथा स्थायी प्रेम को संक्षेप में व्यक्त करता है, जबकि ‘ढक देता है’ मूल रूपक और उसकी व्याख्यात्मक खुली जगह को सुरक्षित रखता है।
