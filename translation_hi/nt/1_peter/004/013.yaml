id: 1PE.4.13
reference: 1 Peter 4:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ καθὸ κοινωνεῖτε τοῖς τοῦ Χριστοῦ παθήμασιν χαίρετε, ἵνα καὶ ἐν τῇ ἀποκαλύψει τῆς δόξης αὐτοῦ χαρῆτε ἀγαλλιώμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/013.yaml
  text: But insofar as you share in the sufferings of Messiah[a], rejoice[b], so that at the revelation of his glory you may also rejoice with exultation.
translation:
  language: hi
  text: पर जितना तुम मसीह[a] के दुखों में सहभागी होते हो, उतना आनन्दित हो, ताकि उसकी महिमा के प्रकट होने[b] पर तुम भी हर्षोल्लास से आनन्दित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीष्ट के दुखों में।” यूनानी शब्द Χριστός एक उपाधि है, जिसका अर्थ “मसीह” अर्थात् “अभिषिक्त जन” है।
    reason: alternative_reading
  - marker: b
    text: या, “उसकी महिमा के प्रकाशन के समय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὸ
  choice: जितना…उतना
  rationale: 'यह आनुपातिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है: मसीह के दुखों में सहभागिता जिस सीमा तक है, उसी के अनुरूप आनन्द मनाने का आह्वान है।'
- source_word: κοινωνεῖτε
  choice: सहभागी होते हो
  rationale: यह दुखों में वास्तविक भागीदारी का भाव रखता है और केवल सहानुभूति या संगति का अर्थ नहीं देता।
- source_word: τοῖς τοῦ Χριστοῦ παθήμασιν
  choice: मसीह के दुखों में
  rationale: सम्बन्धकारक रचना को सहज अधिकारसूचक हिन्दी में रखा गया है और यह नहीं बताया गया कि सहभागिता किस विशिष्ट धर्मवैज्ञानिक अर्थ में है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन होने का अर्थ और यहूदी-मसीहाई सन्दर्भ बनाए रखता है।
- source_word: χαίρετε
  choice: आनन्दित हो
  rationale: आज्ञार्थक भाव को स्पष्ट रखता है और आगे आए χαρῆτε के साथ शब्दार्थगत सम्बन्ध बनाए रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: यूनानी उद्देश्य/परिणाम सम्बन्ध को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀποκαλύψει
  choice: प्रकट होने
  rationale: सन्दर्भ में भावी समय में उसकी महिमा के खुलकर दिखाई देने का आशय है; यह हिन्दी में ‘प्रकाशन’ की अपेक्षा अधिक सहज है।
- source_word: δόξης αὐτοῦ
  choice: उसकी महिमा
  rationale: मूल के सीधे अधिकारसूचक अर्थ को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: χαρῆτε
  choice: तुम भी…आनन्दित हो
  rationale: ἵνα के अधीन अपेक्षित भाव को हिन्दी में बनाए रखता है और वर्तमान आनन्द को भावी आनन्द से जोड़ने वाले καὶ को ‘भी’ से व्यक्त करता है।
- source_word: ἀγαλλιώμενοι
  choice: हर्षोल्लास से
  rationale: यह साधारण आनन्द से अधिक प्रबल और उत्सवी आनन्द का भाव देता है तथा मुख्य क्रिया के साथ स्वाभाविक हिन्दी बनाता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ शब्द उपाधि के रूप में मसीहाई पहचान बताता है। ‘मसीह’ मूल उपाधि का अर्थ बनाए रखता है, जबकि वैकल्पिक पारम्परिक रूप को पादटिप्पणी में दिया गया है।
- issue: ‘मसीह के दुखों’ में सहभागिता का स्वरूप
  choice: मसीह के दुखों में सहभागी होते हो
  alternative: मसीह के लिए दुख उठाते हो
  rationale: मूल पाठ सहभागिता की बात करता है, पर उसका विशिष्ट धर्मवैज्ञानिक स्वरूप स्पष्ट नहीं करता। इसलिए अनुवाद इसे न तो केवल मसीह के लिए कष्ट सहना बनाता है, न उनके प्रायश्चित्तकारी दुखों की पुनरावृत्ति का संकेत देता है।
- issue: महिमा के भावी प्रकट होने का वर्णन
  choice: उसकी महिमा के प्रकट होने पर
  alternative: उसकी महिमा के प्रकाशन के समय
  rationale: वाक्य भावी प्रकटीकरण को व्यक्त करता है; सहज हिन्दी चुनी गई है, जबकि मूल संज्ञात्मक रूप का निकट विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘जितना…उतना’ से मूल का आनुपातिक बल, ‘सहभागी’ से भागीदारी, और ‘हर्षोल्लास से’ से अन्तिम कृदन्त का तीव्र आनन्द सुरक्षित रखा गया है।
