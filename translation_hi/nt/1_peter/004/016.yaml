id: 1PE.4.16
reference: 1 Peter 4:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ὡς Χριστιανός, μὴ αἰσχυνέσθω, δοξαζέτω δὲ τὸν θεὸν ἐν τῷ ⸀ὀνόματι τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/016.yaml
  text: But if as a Christian[a], let him not be ashamed, but let him glorify God in this name.
translation:
  language: hi
  text: पर यदि कोई मसीही के रूप में दुःख उठाता है, तो वह लज्जित न हो, बल्कि इस नाम में[a] परमेश्वर की महिमा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस विषय में,” अथवा “यह नाम धारण करने के कारण।” यूनानी में अधिक शब्दशः “इस नाम में” है, जो संभवतः “मसीही” नाम की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: δέ के हल्के विरोधात्मक भाव और εἰ की शर्त को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὡς Χριστιανός
  choice: मसीही के रूप में
  rationale: Χριστιανός एक प्रचलित सामुदायिक पहचान है; ‘मसीही’ आधुनिक हिन्दी में स्वाभाविक है और ὡς के ‘के रूप में’ भाव को सुरक्षित रखता है।
- source_word: μὴ αἰσχυνέσθω
  choice: वह लज्जित न हो
  rationale: तीसरे पुरुष के वर्तमान निषेधात्मक आदेश को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: δοξαζέτω δὲ
  choice: बल्कि … महिमा करे
  rationale: δέ यहाँ लज्जित होने के विपरीत अपेक्षित प्रतिक्रिया दिखाता है; ‘बल्कि’ इस विरोध को स्वाभाविक रूप से व्यक्त करता है और δοξάζω के लिए ‘महिमा करे’ स्थापित बाइबलीय हिन्दी है।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: हिन्दी बाइबल की सामान्य और सम्मानपूर्ण शब्दावली के अनुसार सीधा कर्म।
- source_word: ἐν τῷ ὀνόματι τούτῳ
  choice: इस नाम में
  rationale: यूनानी की निकटतम अभिव्यक्ति को बनाए रखता और ‘मसीही’ नाम से उसका संबंध खुला रखता है; अन्य संभावित अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ἐν τῷ ὀνόματι τούτῳ में ‘इस नाम’ का संकेत
  choice: मुख्य पाठ में इसे ‘मसीही’ नाम की ओर संकेत करने वाला ‘इस नाम में’ रखा गया है।
  alternative: ‘इस विषय में,’ ‘इस कारण से,’ अथवा ‘यह नाम धारण करने के कारण।’
  rationale: निकटतम पूर्वपद Χριστιανός है और ὄνομα स्वाभाविक रूप से नाम या पदनाम का अर्थ देता है। फिर भी ἐν के कारण वाक्यांश में परिस्थिति अथवा कारण का भाव संभव है, इसलिए उस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: शर्तीय वाक्य में दुःख उठाने की क्रिया का लोप
  choice: हिन्दी की स्पष्टता के लिए पिछले पद के संदर्भ से ‘दुःख उठाता है’ जोड़ा गया है।
  alternative: 'अधिक शब्दशः: ‘पर यदि मसीही के रूप में।’'
  rationale: यूनानी में क्रिया पिछले संदर्भ से समझी जाती है; अकेला खंड हिन्दी में अधूरा और अस्वाभाविक होता। जोड़ी गई क्रिया संदर्भ को स्पष्ट करती है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘लज्जित’ और ‘महिमा करे’ धार्मिक संदर्भ में परिचित हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं। तीसरे पुरुष का प्रयोग यूनानी आदेश की संरचना बनाए रखता है।
