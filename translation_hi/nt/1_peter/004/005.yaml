review_pass:
  verdict: revise
  source_fidelity: The draft conveys the judicial accounting and the judge's readiness accurately. However, “उन्हें उसका लेखा देना होगा” is syntactically ambiguous in Hindi and can mean “they must give his account,” rather than “they will give an account to him.” The Greek has a future assertion, not primarily an obligation construction.
  naturalness: A finite active clause with an explicit dative recipient is clearer and more natural here. “हिसाब देंगे” idiomatically expresses ἀποδώσουσιν λόγον in a judicial context.
  terminology: “हिसाब देना” preserves the accountable/judicial sense without specifying the judge's identity. “जीवितों और मरे हुओं” is natural modern Hindi and retains the paired comprehensive scope. “तैयार है” accurately conveys ἑτοίμως ἔχοντι κρῖναι.
  issues:
  - severity: medium
    issue: Ambiguous recipient in “उन्हें उसका लेखा देना होगा.”
    rationale: The intended Greek sense is that the antecedent people will give an account to the unnamed judge. In Hindi, “उसका लेखा देना” ordinarily may be read as giving an account belonging to or concerning him, rather than giving an account to him. The obligation form “देना होगा” also weakens the straightforward future force of ἀποδώσουσιν.
  revised_text: वे उस व्यक्ति को हिसाब देंगे, जो जीवितों और मरे हुओं का न्याय करने के लिए तैयार है[a]।
