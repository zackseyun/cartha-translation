  text: They will give an account to the one who stands ready to judge the living and the dead[a].
translation:
  language: hi
  text: वे उस व्यक्ति को हिसाब देंगे, जो जीवितों और मरे हुओं का न्याय करने के लिए तैयार है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो न्याय करने को तत्पर है।” यूनानी अभिव्यक्ति का शाब्दिक भाव है, “न्याय करने की तत्परता रखने वाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἳ
  choice: उन्हें
  rationale: संबंधवाचक सर्वनाम पिछले पद में बताए गए लोगों की ओर संकेत करता है। स्वतंत्र हिन्दी वाक्य में कर्मवाच्य-जैसी अनिवार्यता के साथ ‘उन्हें’ संदर्भ को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀποδώσουσιν λόγον
  choice: लेखा देना होगा
  rationale: यह यूनानी मुहावरा अपने कामों के लिए उत्तर या हिसाब देने का न्यायिक भाव रखता है। ‘लेखा देना होगा’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: τῷ
  choice: उसका, जो
  rationale: लेखयुक्त कृदंत यहाँ संज्ञा के रूप में प्रयुक्त है। ‘उसका, जो’ न्यायी की पहचान को यूनानी पाठ की तरह अनिर्दिष्ट रखता है।
- source_word: ἑτοίμως ἔχοντι κρῖναι
  choice: न्याय करने के लिए तैयार है
  rationale: इस अभिव्यक्ति का शाब्दिक भाव ‘न्याय करने को तत्पर/तैयार होना’ है। चुना हुआ रूप तत्परता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘खड़ा है’ जैसी अतिरिक्त छवि जोड़े।
- source_word: ζῶντας καὶ νεκρούς
  choice: जीवितों और मरे हुओं
  rationale: यह न्याय के दोनों व्यापक वर्गों को संक्षेप और स्पष्टता से व्यक्त करता है। ‘मरे हुओं’ सामान्य आधुनिक हिन्दी में ‘मृतकों’ से अधिक सहज है।
theological_decisions:
- issue: जीवितों और मरे हुओं का न्याय करने वाले की पहचान
  choice: 'मुख्य पाठ में न्यायी का नाम नहीं जोड़ा गया: ‘उसका, जो…’'
  alternative: परमेश्वर; मसीह
  rationale: यूनानी पद न्यायी का स्पष्ट नाम नहीं देता। इसलिए व्यापक नए नियम के आधार पर परमेश्वर या मसीह नाम जोड़कर इस पद की वास्तविक अनिर्दिष्टता और धर्मवैचारिक तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। न्यायिक मुहावरे को सहज रखने के लिए ‘लेखा देना होगा’ चुना गया है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘न्याय करने के लिए तैयार है’ यूनानी अभिव्यक्ति की स्वाभाविक और पर्याप्त प्रस्तुति है।
