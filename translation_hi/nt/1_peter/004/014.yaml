  text: εἰ ὀνειδίζεσθε ἐν ὀνόματι Χριστοῦ, μακάριοι, ὅτι τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα ἐφ’ ὑμᾶς ⸀ἀναπαύεται.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/014.yaml
  text: If you are insulted in the name of Messiah[a], you are blessed[b], because the Spirit of glory and of God rests upon you.
translation:
  language: hi
  text: यदि मसीह[a] के नाम के कारण तुम्हारा अपमान किया जाता है, तो तुम धन्य हो, क्योंकि महिमा और परमेश्वर का आत्मा[b] तुम पर विश्राम करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी ‘ख्रिस्तोस’; अर्थ ‘अभिषिक्त’। यहाँ इसे उपाधि के रूप में ‘मसीह’ अनूदित किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इसे ‘परमेश्वर का महिमामय आत्मा’ या ‘महिमा का आत्मा, अर्थात् परमेश्वर का आत्मा’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὀνειδίζεσθε
  choice: तुम्हारा अपमान किया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य रूप ऐसी निंदा या मौखिक दुर्व्यवहार को व्यक्त करता है जो सामाजिक अपमान पहुँचाता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: ἐν ὀνόματι Χριστοῦ
  choice: मसीह के नाम के कारण
  rationale: यहाँ ἐν ὀνόματι संबंध या कारण का भाव रखता है। केवल ‘नाम में’ कहने की अपेक्षा ‘नाम के कारण’ हिंदी में आशय स्पष्ट करता है, जबकि ‘नाम’ और मसीही पहचान दोनों बने रहते हैं।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन वाले अर्थ और भारतीय बाइबलीय प्रचलन दोनों को बनाए रखता है।
- source_word: μακάριοι
  choice: धन्य
  rationale: ‘धन्य’ ईश्वर की स्वीकृति और कृपा से जुड़ा वचनात्मक भाव बनाए रखता है; ‘सुखी’ इसे केवल मनोदशा तक सीमित कर सकता है।
- source_word: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα
  choice: महिमा का और परमेश्वर का आत्मा
  rationale: यह कुछ असामान्य पर बोधगम्य हिंदी रचना यूनानी के दोहरे संबंधसूचक ढाँचे को दिखाती है और यह तय नहीं करती कि दोनों पद समानांतर वर्णन हैं या दूसरा पहले की व्याख्या।
- source_word: ἀναπαύεται
  choice: विश्राम करता है
  rationale: यह क्रिया ठहरने या विश्राम करने का अर्थ देती है और आत्मा के किसी पर ठहरने की यशायाही प्रतिध्वनि को सुरक्षित रखती है।
theological_decisions:
- issue: τὸ τῆς δόξης καὶ τὸ τοῦ θεοῦ πνεῦμα का संबंध
  choice: मुख्य पाठ में ‘महिमा का और परमेश्वर का आत्मा’ रखकर संबंध की अस्पष्टता को बनाए रखा गया है।
  alternative: ‘परमेश्वर का महिमामय आत्मा’ अथवा ‘महिमा का आत्मा, अर्थात् परमेश्वर का आत्मा।’
  rationale: यूनानी वाक्यांश को दो समन्वित संबंधसूचकों के रूप में या व्याख्यात्मक समानाधिकरण के रूप में समझा जा सकता है। किसी एक अर्थ को मुख्य पाठ में निर्णायक बनाना मूल की धर्मवैचारिक बहुअर्थकता को घटा देता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध रूप। ‘तुम्हारा’ बहुवचन समुदाय को संबोधित करता है। आत्मा के व्यक्तिगत कर्तृत्व के अनुरूप ‘करता है’ रखा गया है।
