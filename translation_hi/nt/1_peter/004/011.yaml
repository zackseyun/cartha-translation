id: 1PE.4.11
reference: 1 Peter 4:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἴ τις λαλεῖ, ὡς λόγια θεοῦ· εἴ τις διακονεῖ, ὡς ἐξ ἰσχύος ⸀ἧς χορηγεῖ ὁ θεός· ἵνα ἐν πᾶσιν δοξάζηται ὁ θεὸς διὰ Ἰησοῦ Χριστοῦ, ᾧ ἐστιν ἡ δόξα καὶ τὸ κράτος εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/011.yaml
  text: If anyone speaks[a], let it be as the utterances of God; if anyone serves, let it be from the strength that God supplies, so that in everything God may be glorified through Jesus the Messiah, to whom belong the glory and the dominion forever and ever[e][d][c][b]. Amen.
translation:
  language: hi
  text: यदि कोई बोलता है, तो ऐसा बोले मानो परमेश्वर के वचन बोल रहा हो[a]; यदि कोई सेवा करता है, तो उस सामर्थ्य से करे जो परमेश्वर प्रदान करता है[b], ताकि सब बातों में यीशु मसीह[c] के द्वारा परमेश्वर की महिमा हो। महिमा और प्रभुता उसी की है[d], युगानुयुग[e]। आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के दिव्य कथन’। यूनानी λόγια विशेष रूप से परमेश्वर के कथनों या दिव्य वचनों का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शब्दशः: ‘मानो उस सामर्थ्य से, जिसे परमेश्वर प्रदान करता है।’'
    reason: previous_rendering
  - marker: c
    text: यूनानी में Χριστός एक उपाधि है, जिसका अर्थ ‘मसीह’ अर्थात ‘अभिषिक्त जन’ है।
    reason: lexical_alternative
  - marker: d
    text: ‘उसी की’ का निकटतम संदर्भ यीशु मसीह है; फिर भी पिछले उपवाक्य के कारण कुछ लोग इसे पिता परमेश्वर के संदर्भ में समझते हैं।
    reason: alternative_reading
  - marker: e
    text: 'शब्दशः: ‘युगों के युगों तक।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: λαλεῖ
  choice: बोलता है
  rationale: सामान्य शर्तवाचक रचना में यह सीधा और व्यापक अनुवाद है; इसे केवल प्रचार तक सीमित नहीं करता।
- source_word: λόγια θεοῦ
  choice: परमेश्वर के वचन
  rationale: λόγια साधारण शब्दों से बढ़कर परमेश्वर के दिव्य कथनों को सूचित करता है। ‘वचन’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और गरिमापूर्ण है; विशेष अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: διακονεῖ
  choice: सेवा करता है
  rationale: यह औपचारिक कलीसियाई पद तक सीमित न होकर व्यापक सेवा को व्यक्त करता है।
- source_word: ἐξ ἰσχύος
  choice: उस सामर्थ्य से
  rationale: ἐξ सामर्थ्य के स्रोत को दर्शाता है। सहज हिन्दी में ‘उस सामर्थ्य से’ इस भाव को अगले संबंधवाचक उपवाक्य के साथ स्पष्ट रखता है।
- source_word: χορηγεῖ
  choice: प्रदान करता है
  rationale: यह आवश्यक सामर्थ्य उपलब्ध कराने का भाव स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἐν πᾶσιν
  choice: सब बातों में
  rationale: यह मूल की व्यापकता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: δοξάζηται
  choice: महिमा हो
  rationale: यह निष्क्रिय भाव और उद्देश्यसूचक ἵνα-उपवाक्य दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: Χριστός को उसके उपाधिसूचक अर्थ में मानक हिन्दी ‘मसीह’ से व्यक्त किया गया है; διά के माध्यम-सूचक भाव के लिए ‘के द्वारा’ रखा गया है।
- source_word: κράτος
  choice: प्रभुता
  rationale: स्तुतिवचन में यह शासनकारी शक्ति अथवा अधिकार का भाव देता है; ‘प्रभुता’ गरिमापूर्ण और अर्थसंगत है।
- source_word: εἰς τοὺς αἰῶνας τῶν αἰώνων
  choice: युगानुयुग
  rationale: यह अनंत अवधि बताने वाली यूनानी उक्ति का संक्षिप्त, स्वाभाविक और पारंपरिक हिन्दी समतुल्य है।
theological_decisions:
- issue: समापन स्तुतिवचन में ᾧ (‘उसी की’) का संदर्भ
  choice: मुख्य पाठ में निकटतम पूर्वपद यीशु मसीह को संदर्भ माना गया है।
  alternative: इसे पिछले उपवाक्य के ‘परमेश्वर’ अर्थात पिता परमेश्वर के लिए भी समझा जाता है; संभव है कि संक्षिप्त स्तुतिवचन जानबूझकर संदर्भ को घनिष्ठ रखता हो।
  rationale: व्याकरण की दृष्टि से निकटतम पूर्वपद Ἰησοῦ Χριστοῦ है, पर पिछले वाक्यांश का केंद्र परमेश्वर की महिमा है। इसलिए मुख्य पाठ निकटतम संदर्भ रखता है और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: दोनों उपवाक्यों में ὡς का बल
  choice: हिन्दी में निहित उपदेशात्मक क्रिया जोड़कर ‘ऐसे बोले’ और ‘...से करे’ अनूदित किया गया है।
  alternative: 'अधिक शब्दशः दीर्घवृत्तीय रूप: ‘यदि कोई बोलता है—परमेश्वर के वचनों के समान; यदि कोई सेवा करता है—मानो उस सामर्थ्य से...’।'
  rationale: यूनानी तुलना को दीर्घवृत्तीय छोड़ता है, पर सहज हिन्दी में क्रिया की पूर्ति आवश्यक है। जोड़ी गई अभिव्यक्ति मूल के उपदेशात्मक आशय को स्पष्ट करती है, नया सिद्धांत नहीं जोड़ती।
- issue: λόγια θεοῦ और बोलने वाले के कथन का संबंध
  choice: ‘जैसे परमेश्वर के वचन’ रखा गया है।
  alternative: ‘परमेश्वर की ओर से मिले दिव्य कथनों के समान’ या ‘परमेश्वर के वचनों के अनुरूप’।
  rationale: मूल ὡς λόγια θεοῦ तुलना अथवा मानक का भाव देता है, पर प्रत्येक वक्तव्य को स्वतः प्रत्यक्ष प्रेरित वचन घोषित नहीं करता। अनुवाद उसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। समानांतर शर्तवाचक वाक्यों को ‘यदि कोई...तो...’ से स्पष्ट किया गया है। ‘सामर्थ्य’, ‘महिमा’, ‘प्रभुता’ और ‘युगानुयुग’ जैसे परिचित बाइबलीय शब्द सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के स्तुतिपरक स्वर को बनाए रखते हैं।
