  text: μὴ γάρ τις ὑμῶν πασχέτω ὡς φονεὺς ἢ κλέπτης ἢ κακοποιὸς ἢ ὡς ἀλλοτριεπίσκοπος·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/015.yaml
  text: For let none of you suffer as a murderer or a thief or an evildoer or as a meddler[a].
translation:
  language: hi
  text: क्योंकि तुममें से कोई भी हत्यारा, चोर, बुराई करने वाला या दूसरों के मामलों में दखल देने वाला[a] होकर दुःख न सहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पराए काम में टाँग अड़ाने वाला”; अधिक शाब्दिक रूप से, “दूसरों के मामलों की निगरानी करने वाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ γάρ
  choice: क्योंकि ... न
  rationale: γάρ को पिछले कथन से व्याख्यात्मक संबंध बनाए रखने के लिए ‘क्योंकि’ और μὴ को निषेधात्मक ‘न’ से व्यक्त किया गया है।
- source_word: τις ὑμῶν
  choice: तुममें से कोई भी
  rationale: निषेध के साथ यह स्वाभाविक हिन्दी में प्रत्येक व्यक्ति को अलग-अलग संबोधित करने का भाव रखता है।
- source_word: πασχέτω
  choice: दुःख न सहे
  rationale: πάσχω के व्यापक अर्थ ‘दुःख सहना’ को रखा गया है; मूल में स्पष्ट न होने के कारण ‘दण्ड’ नहीं जोड़ा गया।
- source_word: ὡς
  choice: होकर
  rationale: यह उस चरित्र या हैसियत को दर्शाता है जिसके कारण व्यक्ति दुःख सहता है; हिन्दी में ‘होकर’ इसे सहज रूप से व्यक्त करता है।
- source_word: φονεύς
  choice: हत्यारा
  rationale: यह हत्या करने वाले व्यक्ति के नैतिक और विधिक अर्थ को स्पष्ट रखता है।
- source_word: κλέπτης
  choice: चोर
  rationale: यह κλέπτης का सामान्य और सटीक हिन्दी पर्याय है।
- source_word: κακοποιός
  choice: बुराई करने वाला
  rationale: यह शब्द के व्यापक नैतिक अर्थ को बनाए रखता है और उसे केवल कानूनी अपराध तक सीमित नहीं करता।
- source_word: ἀλλοτριεπίσκοπος
  choice: दूसरों के मामलों में दखल देने वाला
  rationale: यह दुर्लभ यौगिक शब्द दूसरों के अधिकार-क्षेत्र के मामलों में अनुचित हस्तक्षेप का भाव देता है; यह चयन आधुनिक हिन्दी में उस नकारात्मक आशय को स्पष्ट करता है।
theological_decisions:
- issue: ἀλλοτριεπίσκοπος का अर्थ
  choice: दूसरों के मामलों में दखल देने वाला
  alternative: पराए काम में टाँग अड़ाने वाला; दूसरों के मामलों का निगरान
  rationale: संदर्भ निंदनीय आचरणों की सूची है। इसलिए अनुचित हस्तक्षेप का अर्थ सबसे उपयुक्त है, जबकि ‘निगरान’ से कलीसियाई पद का अनचाहा संकेत आ सकता है। दुर्लभ शब्द की शाब्दिक अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दुःख सहे’ पत्री के व्यापक दुःख-विषय से संबंध रखता है; अंतिम दुर्लभ पद को स्पष्ट किया गया है और उसकी अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
