reference: 1 Peter 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀρκετὸς ⸀γὰρ ὁ παρεληλυθὼς ⸀χρόνος τὸ ⸀βούλημα τῶν ἐθνῶν ⸀κατειργάσθαι, πεπορευμένους ἐν ἀσελγείαις, ἐπιθυμίαις, οἰνοφλυγίαις, κώμοις, πότοις, καὶ ἀθεμίτοις εἰδωλολατρίαις.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/003.yaml
  text: For the time that has passed is enough to have carried out the will of the Gentiles[a], having walked in sensualities, lusts, drunkenness, carousing, drinking parties[c][b], and lawless idolatries.
translation:
  language: hi
  text: क्योंकि अन्यजातियों की इच्छा पूरी करने के लिए बीत चुका समय काफ़ी है—उस दौरान तुम निर्लज्ज भोग-विलासों[b], बुरी लालसाओं, मदहोशी के दौरों, रंगरेलियों, मदिरापान की महफ़िलों और निषिद्ध मूर्तिपूजाओं[c] में जीवन बिताते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘निर्लज्ज भोग-विलासों’ का अनुवाद ‘उच्छृंखलताओं’ भी किया जा सकता है; यूनानी शब्द निर्लज्ज और बेलगाम भोग पर बल देता है।
    reason: lexical_alternative
  - marker: c
    text: ‘निषिद्ध मूर्तिपूजाओं’ का अनुवाद ‘व्यवस्था-विरुद्ध मूर्तिपूजाओं’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρκετὸς γὰρ ὁ παρεληλυθὼς χρόνος
  choice: क्योंकि ... बीता हुआ समय बहुत लगा चुके हो
  rationale: यह स्वाभाविक हिन्दी में बीते समय की पर्याप्तता और γάρ के व्याख्यात्मक संबंध को व्यक्त करता है।
- source_word: τὸ βούλημα τῶν ἐθνῶν
  choice: अन्यजातियों की इच्छा
  rationale: βούλημα इच्छा या मंशा को और ἔθνη इस प्रसंग में गैर-यहूदी समाज को सूचित करता है; ‘अन्यजाति’ मानक बाइबलीय हिन्दी है।
- source_word: κατειργάσθαι
  choice: पूरी करने में ... लगा चुके हो
  rationale: ‘कर चुके हो’ पूर्ण हुए कार्य की दृष्टि को बनाए रखता है, जबकि पूरा वाक्य आधुनिक हिन्दी में स्वाभाविक रहता है।
- source_word: πεπορευμένους
  choice: जीवन बिताते थे
  rationale: नैतिक आचरण के संदर्भ में πορεύομαι का भाव जीवन जीना या आचरण करना है; हिन्दी में यह शाब्दिक ‘चलना’ से अधिक स्पष्ट है।
- source_word: ἀσελγείαις
  choice: निर्लज्ज भोग-विलासों
  rationale: यह निर्लज्ज और अनियंत्रित भोग की व्यापक नैतिक धारणा तथा यूनानी बहुवचन को बनाए रखता है।
- source_word: ἐπιθυμίαις
  choice: बुरी लालसाओं
  rationale: शब्द अपने आप में इच्छा भी हो सकता है, पर इस दुर्गुण-सूची में नकारात्मक अर्थ स्पष्ट है; ‘बुरी’ उस प्रसंगगत बल को प्रकट करता है।
- source_word: οἰνοφλυγίαις
  choice: मदहोशी के दौरों
  rationale: यह अत्यधिक मदिरापान से उत्पन्न बार-बार की मदहोशी को स्वाभाविक हिन्दी में व्यक्त करता और बहुवचन भाव बचाता है।
- source_word: κώμοις
  choice: रंगरेलियों
  rationale: यह मदिरापान और उच्छृंखलता से जुड़ी उत्सवी मौज-मस्ती का संक्षिप्त आधुनिक रूप है।
- source_word: πότοις
  choice: मदिरापान की महफ़िलों
  rationale: यह विशेष रूप से सामूहिक पीने के अवसरों को बताता है और निकटवर्ती मदहोशी तथा रंगरेलियों से भेद रखता है।
- source_word: ἀθεμίτοις εἰδωλολατρίαις
  choice: निषिद्ध मूर्तिपूजाओं
  rationale: ἀθέμιτος का अर्थ अनुमत व्यवस्था के विरुद्ध या निषिद्ध है; यह केवल भावनात्मक घृणा जोड़ने के बजाय नैतिक-विधिक बल को सुरक्षित रखता है।
theological_decisions:
- issue: ἔθνη का संदर्भगत अर्थ
  choice: अन्यजातियाँ
  alternative: राष्ट्र; मूर्तिपूजक लोग
  rationale: इस प्रसंग में यह भू-राजनीतिक राष्ट्रों के बजाय गैर-यहूदी समाज और उसके पूर्व जीवन-ढंग को दर्शाता है। ‘मूर्तिपूजक’ अधिक व्याख्यात्मक होता।
- issue: ἀθεμίτοις εἰδωλολατρίαις का नैतिक बल
  choice: निषिद्ध मूर्तिपूजाएँ
  alternative: घृणित मूर्तिपूजाएँ; अधर्ममय मूर्तिपूजाएँ
  rationale: ‘निषिद्ध’ इस बात पर बल देता है कि ये आचरण स्वीकृत सीमा और व्यवस्था के विरुद्ध हैं; यह यूनानी से अधिक भावात्मक तीव्रता नहीं जोड़ता।
- issue: पूर्व आचरण के पूर्ण होने का पहलू
  choice: समय बहुत लगा चुके हो
  alternative: बीता हुआ समय पर्याप्त है
  rationale: यह पाठकों के पूर्व जीवन की पूर्ण और पर्याप्त अवधि को लक्ष्य-भाषा में स्पष्ट करता है, बिना यह संकेत दिए कि ऐसा आचरण अब भी किसी उद्देश्य के लिए उचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। दुर्गुण-सूची में जहाँ स्वाभाविक था वहाँ यूनानी बहुवचन या बार-बार होने वाले आचरण का भाव रखा गया है। ‘जीवन बिताते थे’ नैतिक ‘चलने’ के रूपक का अर्थ स्वाभाविक हिन्दी में देता है।
