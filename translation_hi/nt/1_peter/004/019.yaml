  text: ὥστε καὶ οἱ πάσχοντες κατὰ τὸ θέλημα τοῦ ⸀θεοῦ πιστῷ κτίστῃ παρατιθέσθωσαν τὰς ψυχὰς ⸀αὐτῶν ἐν ἀγαθοποιΐᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/019.yaml
  text: Therefore[a], let also those who suffer according to the will of God entrust their souls to a faithful Creator in doing good.
translation:
  language: hi
  text: इसलिए जो लोग परमेश्वर की इच्छा के अनुसार दुःख उठाते हैं, वे भी भलाई करते हुए अपने प्राणों[a] को विश्वासयोग्य सृष्टिकर्ता को सौंप दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना जीवन” अथवा “अपने आपको”; यूनानी शब्द प्राण, जीवन या स्वयं व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को व्यक्त करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक है और अनुमानात्मक बल बनाए रखता है।
- source_word: οἱ πάσχοντες
  choice: जो लोग ... दुःख उठाते हैं
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदन्त दुःख उठाने वाले लोगों के वर्ग को बताता है; यह हिन्दी रूप सामान्य और स्वाभाविक है।
- source_word: κατὰ τὸ θέλημα τοῦ θεοῦ
  choice: परमेश्वर की इच्छा के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ को सीधे व्यक्त करता है और यह तय नहीं करता कि दुःख से परमेश्वर की इच्छा का संबंध अनुमति, विधान या किसी अन्य ढंग से है।
- source_word: πιστῷ κτίστῃ
  choice: विश्वासयोग्य सृष्टिकर्ता को
  rationale: πιστός की भरोसेमंद और निष्ठावान होने की अर्थछाया को ‘विश्वासयोग्य’ व्यक्त करता है; ‘सृष्टिकर्ता’ κτίστης का स्वाभाविक हिन्दी रूप है।
- source_word: παρατιθέσθωσαν
  choice: सौंप दें
  rationale: मध्यवाच्य आज्ञार्थ किसी को सुरक्षित रखे जाने के लिए कुछ सौंपने का भाव देता है; ‘सौंप दें’ स्पष्ट और सहज हिन्दी है।
- source_word: τὰς ψυχὰς αὐτῶν
  choice: अपने प्राण
  rationale: ψυχή के ‘प्राण’, ‘जीवन’ और ‘स्वयं’ तक फैले अर्थ-क्षेत्र में ‘प्राण’ पारंपरिक गहराई रखते हुए हिन्दी में देह से अलग किसी तकनीकी तत्त्व तक अर्थ को अनावश्यक रूप से सीमित नहीं करता; व्यापक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: ἐν ἀγαθοποιΐᾳ
  choice: भलाई करते हुए
  rationale: यह सौंपने के साथ चलने वाली रीति या परिस्थिति को व्यक्त करता है; हिन्दी में ‘भलाई करते हुए’ सतत सदाचरण का भाव स्वाभाविक रूप से देता है।
theological_decisions:
- issue: दुःख और परमेश्वर की इच्छा का संबंध
  choice: परमेश्वर की इच्छा के अनुसार
  alternative: परमेश्वर की इच्छा से
  rationale: मूल पाठ दुःख को परमेश्वर की इच्छा ‘के अनुसार’ बताता है, पर अनुमति, विधान या अनुमोदन की विस्तृत धर्मवैज्ञानिक प्रक्रिया स्पष्ट नहीं करता; चुना हुआ रूप इस तनाव को खुला रखता है।
- issue: संदर्भ में ψυχή का अर्थ
  choice: प्राण
  alternative: जीवन; स्वयं
  rationale: ‘प्राण’ मूल शब्द की पारंपरिक और धर्मवैज्ञानिक प्रतिध्वनि बनाए रखता है, जबकि पादटिप्पणी स्वीकार करती है कि यहाँ पूरा जीवन या स्वयं व्यक्ति भी अभिप्रेत हो सकता है।
- issue: πιστός द्वारा सृष्टिकर्ता का वर्णन
  choice: विश्वासयोग्य सृष्टिकर्ता
  alternative: भरोसेमंद सृष्टिकर्ता
  rationale: ‘विश्वासयोग्य’ परमेश्वर की विश्वसनीयता और निष्ठा दोनों की अर्थछाया बनाए रखता है, बिना किसी संप्रदायगत व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप। ‘दुःख उठाते हैं’, ‘सौंप दें’ और ‘भलाई करते हुए’ सामान्य पाठक के लिए स्पष्ट हैं; वाक्य मूल यूनानी की निष्कर्षात्मक आज्ञा और धर्मवैज्ञानिक अस्पष्टता को बनाए रखता है।
