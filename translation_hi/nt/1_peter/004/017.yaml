  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण धार्मिक गद्य। ‘घराना,’ ‘न्याय,’ और ‘सुसमाचार’ सामान्य हिन्दी बाइबलीय प्रयोग से परिचित हैं। मुख्य पाठ में मूल की पुनरावृत्ति और धार्मिक तनाव को रखा गया है; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
