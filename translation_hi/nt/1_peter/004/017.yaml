source:
  edition: SBLGNT
  text: ὅτι ὁ καιρὸς τοῦ ἄρξασθαι τὸ κρίμα ἀπὸ τοῦ οἴκου τοῦ θεοῦ· εἰ δὲ πρῶτον ἀφ’ ἡμῶν, τί τὸ τέλος τῶν ἀπειθούντων τῷ τοῦ θεοῦ εὐαγγελίῳ;
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/017.yaml
  text: For it is time for judgment to begin from the household of God[a]; and if it begins first from us[c][b], what will be the outcome for those who disobey the gospel of God?
translation:
  language: hi
  text: क्योंकि परमेश्वर के घराने से न्याय आरम्भ होने का समय है[a]; और यदि न्याय का आरम्भ पहले हमसे होता है, तो परमेश्वर के सुसमाचार की आज्ञा न माननेवालों का अन्त क्या होगा?[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के घर से।” यूनानी शब्द οἶκος का अर्थ “घर” या “घराना” दोनों हो सकता है; यहाँ सम्भवतः परमेश्वर के लोग उसके घराने के रूप में अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या “परिणाम क्या होगा?” यूनानी शब्द τέλος का अर्थ “अन्त,” “परिणाम” या “नतीजा” हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: “आज्ञा न माननेवालों” का अनुवाद “विश्वास करने से इनकार करनेवालों” भी हो सकता है, क्योंकि यूनानी क्रिया सुसमाचार के प्रति अवज्ञा और अविश्वास दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण देता है; इसलिए कारणसूचक संयोजक स्वाभाविक है।
- source_word: ὁ καιρός
  choice: समय आ गया है
  rationale: καιρός उपयुक्त या नियत समय को दर्शाता है; हिन्दी में यह वाक्यांश उस भाव को सहज रूप से व्यक्त करता है।
- source_word: τοῦ ἄρξασθαι τὸ κρίμα
  choice: न्याय आरम्भ होने
  rationale: यह रचना बताती है कि न्याय के आरम्भ का समय है; हिन्दी में भाव को स्पष्ट रखते हुए स्वाभाविक वाक्य-विन्यास अपनाया गया है।
- source_word: κρίμα
  choice: न्याय
  rationale: यह शब्द परमेश्वर की न्यायिक जाँच या व्यवहार को व्यापक रूप में रखता है; इसे न केवल दण्डाज्ञा और न केवल अनुशासन तक सीमित किया गया है।
- source_word: ἀπὸ τοῦ οἴκου τοῦ θεοῦ
  choice: परमेश्वर के घराने से
  rationale: οἶκος यहाँ भवन से अधिक परमेश्वर के लोगों के समुदाय को सूचित करता है; ‘से’ ἀπό और आरम्भ-बिन्दु को बनाए रखता है।
- source_word: εἰ δὲ πρῶτον ἀφ’ ἡμῶν
  choice: और यदि वह पहले हमसे आरम्भ होता है
  rationale: पिछले खण्ड से ‘न्याय’ और ‘आरम्भ होना’ स्पष्ट रूप से ग्रहण किए गए हैं; ‘हमसे’ दोहराए गए ἀπό को सुरक्षित रखता है।
- source_word: τέλος
  choice: अन्त
  rationale: τέλος का मूल और गंभीर भाव ‘अन्त’ से सुरक्षित रहता है; पादटिप्पणी में ‘परिणाम’ का सम्भव अर्थ दिया गया है।
- source_word: ἀπειθούντων
  choice: आज्ञा न माननेवालों
  rationale: यह क्रिया सुसमाचार के प्रति अवज्ञा को व्यक्त करती है और संदर्भ में अविश्वास या विश्वास करने से इनकार का भाव भी समेट सकती है।
- source_word: τῷ τοῦ θεοῦ εὐαγγελίῳ
  choice: परमेश्वर के सुसमाचार की
  rationale: दत्तिव सम्बन्ध को हिन्दी क्रिया ‘आज्ञा मानना’ के अनुरूप ‘की’ से व्यक्त किया गया है; ‘परमेश्वर का सुसमाचार’ स्रोत अथवा सम्बन्ध की वास्तविक अस्पष्टता को खुला रखता है।
theological_decisions:
- issue: परमेश्वर के लोगों के सम्बन्ध में κρίμα का स्वरूप
  choice: ‘न्याय’ रखा गया है, बिना इसे दण्डाज्ञा या अनुशासन तक सीमित किए।
  alternative: ‘दण्डाज्ञा’ अथवा ‘अनुशासन’
  rationale: मूल पाठ परमेश्वर के घराने से आरम्भ होनेवाले न्याय और सुसमाचार न माननेवालों के अन्त के बीच गंभीर तनाव रखता है। कोई संकरा शब्द उस तनाव को समय से पहले सुलझा देता।
- issue: ‘परमेश्वर के घराने’ का संदर्भ
  choice: परमेश्वर के लोगों का समुदाय
  alternative: परमेश्वर का भवन या मन्दिर
  rationale: अगला वाक्यांश ‘हमसे’ इस सामुदायिक संदर्भ की पुष्टि करता है; फिर भी οἶκος का शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ἀπειθούντων में अवज्ञा और अविश्वास का सम्बन्ध
  choice: मुख्य पाठ में ‘आज्ञा न माननेवाले’
  alternative: ‘विश्वास करने से इनकार करनेवाले’
  rationale: शब्द सुसमाचार के प्रति ऐसी प्रतिक्रिया दर्शा सकता है जिसमें अवज्ञा और अविश्वास दोनों जुड़े हैं; मुख्य पाठ नैतिक-क्रियात्मक बल रखता है और पादटिप्पणी दूसरा पहलू बताती है।
