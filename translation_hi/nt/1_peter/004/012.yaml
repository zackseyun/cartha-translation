source:
  edition: SBLGNT
  text: Ἀγαπητοί, μὴ ξενίζεσθε τῇ ἐν ὑμῖν πυρώσει πρὸς πειρασμὸν ὑμῖν γινομένῃ ὡς ξένου ὑμῖν συμβαίνοντος,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/012.yaml
  text: Beloved[a], do not be surprised at the fiery trial among you that is happening to test you, as though something strange were happening to you.
translation:
  language: hi
  text: प्रिय जनो, तुम्हारे बीच तुम्हें परखने के लिए जो अग्नि-परीक्षा हो रही है, उससे अचंभित न हो, मानो तुम्हारे साथ कोई अनोखी बात हो रही हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπητοί
  choice: प्रिय जनो
  rationale: बहुवचन सम्बोधन का आत्मीय और गरिमापूर्ण भाव व्यक्त करता है। ‘प्रियो’ की अपेक्षा आधुनिक सामान्य हिन्दी में अधिक स्वाभाविक है, यद्यपि मूल में प्रेम किए जाने का भाव भी निहित है।
- source_word: ξενίζεσθε
  choice: अचम्भा न करो
  rationale: यहाँ अर्थ किसी बात को अनोखा समझकर चकित होने का है। आगे ξένου के साथ मूल की अर्थगत पुनरावृत्ति ‘अचम्भा’ और ‘अनोखी’ से यथासम्भव बनी रहती है।
- source_word: πυρώσει
  choice: अग्नि-परीक्षा
  rationale: शब्द का शाब्दिक अग्नि या जलने का बिम्ब और प्रसंग में कठोर परीक्षा—दोनों सुरक्षित रहते हैं।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: सामुदायिक सम्बोधन और दुःख के प्रसंग में ‘बीच’ स्वाभाविक है; यह विश्वासियों के समुदाय में घट रही परीक्षा को दर्शाता है।
- source_word: πρὸς πειρασμόν
  choice: तुम्हें परखने के लिए
  rationale: इस प्रसंग में πειρασμός पाप के प्रलोभन से अधिक दुःख द्वारा जाँच या परख को सूचित करता है। उद्देश्यसूचक πρὸς को स्पष्ट हिन्दी में व्यक्त किया गया है।
- source_word: γινομένῃ
  choice: जो ... हो रही है
  rationale: वर्तमान कृदन्त की जारी घटना का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὡς ξένου
  choice: मानो ... कोई अनोखी बात
  rationale: ξένος के अपरिचित या असामान्य होने के भाव को सरल हिन्दी में व्यक्त करता है और ξενίζεσθε से अर्थगत सम्बन्ध रखता है।
- source_word: συμβαίνοντος
  choice: तुम्हारे साथ ... हो रही हो
  rationale: किसी के साथ घटना या उस पर बीतना यहाँ मुहावरेदार हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: प्रसंग में πειρασμός का स्वरूप
  choice: परख या परीक्षा
  alternative: पाप की ओर प्रलोभन
  rationale: आसपास का प्रसंग मसीही दुःख और सताव का है, इसलिए यहाँ कठिन अनुभव के द्वारा परखे जाने का अर्थ प्रमुख है। ‘अग्नि-परीक्षा’ और ‘परखने’ से आग का रूपक तथा परीक्षण का उद्देश्य दोनों स्पष्ट रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का आत्मीय, पास्तरीय और गरिमापूर्ण स्तर रखा गया है। वाक्य सामान्य पाठक के लिए सहज है; ‘अग्नि-परीक्षा’ मूल के सजीव अग्नि-बिम्ब को बचाती है।
