id: 1PE.4.2
reference: 1 Peter 4:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς τὸ μηκέτι ἀνθρώπων ἐπιθυμίαις ἀλλὰ θελήματι θεοῦ τὸν ἐπίλοιπον ἐν σαρκὶ βιῶσαι χρόνον.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/002.yaml
  text: so as to live the rest of his time in the flesh no longer for human desires[a], but for the will of God.
translation:
  language: hi
  text: ताकि वह देह में अपने जीवन का बाकी समय अब मनुष्यों की अभिलाषाओं के लिए नहीं, बल्कि परमेश्वर की इच्छा के अनुसार जिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς τὸ
  choice: ताकि
  rationale: पूर्ववर्ती कथन से जुड़े उद्देश्य या परिणाम का स्वाभाविक और निकट अर्थ व्यक्त करता है।
- source_word: μηκέτι
  choice: नहीं
  rationale: संदर्भ में पहले के जीवन-ढंग का अब आगे जारी न रहना व्यक्त होता है; हिंदी वाक्य में ‘...नहीं, बल्कि...’ यह विरोध स्वाभाविक रूप से दिखाता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों की
  rationale: बहुवचन संबंधकारक का सामान्य, लिंग-समावेशी अर्थ बनाए रखता है।
- source_word: ἐπιθυμίαις
  choice: अभिलाषाओं के लिए
  rationale: ‘अभिलाषाएँ’ व्यापक इच्छाओं को व्यक्त करता है और इसे केवल यौन वासना तक सीमित नहीं करता; ‘के लिए’ जीवन की दिशा या लक्ष्य दर्शाता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: नकारात्मक और सकारात्मक जीवन-दिशाओं के बीच प्रबल विरोध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: θελήματι θεοῦ
  choice: परमेश्वर की इच्छा के अनुसार
  rationale: जीवन के नियंत्रक मानदंड का अर्थ स्पष्ट करता है और ग्रीक दत्तिव के संभावित आशय को सहज हिंदी में व्यक्त करता है।
- source_word: τὸν ἐπίλοιπον ... χρόνον
  choice: अपने जीवन का बाकी समय
  rationale: शेष व्यक्तिगत जीवनकाल का अर्थ सहज हिंदी में देता है; एकवचन कर्ता का संबंध ‘अपने’ से स्पष्ट होता है।
- source_word: ἐν σαρκὶ
  choice: शरीर में
  rationale: यहाँ वाक्यांश पृथ्वी पर देहधारी जीवन को सूचित करता है, न कि आवश्यक रूप से ‘पापी स्वभाव’ को। हिंदी में ‘शरीर में’ इस अर्थ को अधिक स्पष्टता से देता है।
- source_word: βιῶσαι
  choice: जिए
  rationale: जीवन बिताने या आचरण करने के अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ἐν σαρκὶ में σάρξ का अर्थ
  choice: देहधारी सांसारिक जीवन (‘शरीर में’)
  alternative: पापी स्वभाव में
  rationale: तात्कालिक संदर्भ विश्वासी के बचे हुए नश्वर जीवन की बात करता है। स्वयं यह पदबंध किसी आंतरिक ‘पापी स्वभाव’ को स्पष्ट रूप से निर्दिष्ट नहीं करता, इसलिए उस धार्मिक व्याख्या को अनुवाद में आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण पर सामान्य पाठकों के लिए सहज। ‘मनुष्यों’ को सामान्य मानव अर्थ में और ‘अभिलाषाओं’ को व्यापक नैतिक अर्थ में रखा गया है।
