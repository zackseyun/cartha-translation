  naturalness: The sentence is fluent modern standard Hindi. ‘अब ... नहीं’ makes the cessation sense explicit while retaining natural cadence. ‘शरीर में’ is understandable, but ‘देह में’ is a more fitting elevated-scriptural rendering for embodied mortal existence and avoids a slightly clinical physical-body sense.
  terminology: ‘परमेश्वर की इच्छा’ is appropriate. ‘मनुष्यों की अभिलाषाएँ’ preserves the broad generic reference and does not narrow ἐπιθυμίαις to sexual lust. ‘देह में’ retains the embodied-life sense of ἐν σαρκί without importing the doctrinal sense ‘sinful nature.’
