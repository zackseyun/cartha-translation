  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘मनुष्यों के अनुसार’ और ‘परमेश्वर के अनुसार’ की थोड़ी असामान्य समानांतरता जानबूझकर रखी गई है, क्योंकि वही स्रोत-पाठ का धर्मवैज्ञानिक तनाव और मानक/दृष्टिकोण की अस्पष्टता बचाती है। पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
