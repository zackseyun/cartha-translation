source:
  edition: SBLGNT
  text: εἰς τοῦτο γὰρ καὶ νεκροῖς εὐηγγελίσθη ἵνα κριθῶσι μὲν κατὰ ἀνθρώπους σαρκὶ ζῶσι δὲ κατὰ θεὸν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/006.yaml
  text: 'For this is why the gospel was also proclaimed to the dead: so that[a], though judged according to men in the flesh[b], they might live according to God in the spirit.'
translation:
  language: hi
  text: क्योंकि इसी कारण मरे हुओं को भी सुसमाचार सुनाया गया, ताकि शरीर में उनका न्याय मनुष्यों के अनुसार तो हो, पर आत्मा में वे परमेश्वर के अनुसार जीवित रहें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आत्मा में’ का अनुवाद ‘आत्मिक रूप से’ भी किया जा सकता है। कुछ व्याख्याएँ इसे विशेष रूप से ‘पवित्र आत्मा के द्वारा’ समझती हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰς τοῦτο
  choice: इसी उद्देश्य से
  rationale: यह पद पिछले संदर्भ का कारण बताते हुए आगे उद्देश्य की ओर ले जाता है; यह अभिव्यक्ति εἰς τοῦτο की प्रयोजनात्मक शक्ति को स्वाभाविक हिन्दी में रखती है।
- source_word: νεκροῖς
  choice: मरे हुओं को
  rationale: विशेषण का संज्ञात्मक दत्तिव बहुवचन प्रयोग है। यह पहचान को खुला रखता है और यह निर्धारित नहीं करता कि वे प्रचार के समय शारीरिक या आत्मिक अर्थ में मृत थे।
- source_word: εὐηγγελίσθη
  choice: सुसमाचार सुनाया गया था
  rationale: εὐαγγελίζω के कर्मवाच्य रूप का प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी अनुवाद; निहित शुभ-संदेश को 'सुसमाचार' से व्यक्त किया गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम बताने वाले संयोजक का स्वाभाविक हिन्दी रूप।
- source_word: κριθῶσι μὲν ... ζῶσι δὲ
  choice: उनका न्याय तो हो, पर ... वे ... जीवित रहें
  rationale: μὲν...δὲ की स्पष्ट विरोधात्मक समानांतर रचना और दोनों subjunctive क्रियाओं को बनाए रखता है; 'हालाँकि' कहकर न्याय को केवल रियायती अर्थ देने के बजाय यूनानी वाक्य की वास्तविक व्याकरणिक अस्पष्टता सुरक्षित रहती है।
- source_word: κατὰ ἀνθρώπους
  choice: मनुष्यों के अनुसार
  rationale: κατά के मानक या दृष्टिकोण संबंधी अर्थ को तथा κατὰ θεὸν के साथ जानबूझकर बनाए गए समानांतर विरोध को सुरक्षित रखता है।
- source_word: σαρκὶ
  choice: शरीर में
  rationale: यहाँ σάρξ शारीरिक मानवीय अस्तित्व के क्षेत्र को दर्शाता है और πνεύματι से विरोध में है; हिन्दी में 'शरीर में' 'देह की पापी प्रकृति' जैसे अनावश्यक धर्मवैज्ञानिक अर्थ से बचता है।
- source_word: κατὰ θεὸν
  choice: परमेश्वर के अनुसार
  rationale: κατὰ ἀνθρώπους के समानांतर स्रोत-पाठ की संक्षिप्तता और अस्पष्टता को बनाए रखता है, बिना इसे केवल मानक, दृष्टि या जीवन-प्रकार तक सीमित किए।
- source_word: πνεύματι
  choice: आत्मा में
  rationale: σαρκί के समानांतर क्षेत्र-सूचक दत्तिव के रूप में अनुवाद किया गया है। स्रोत स्पष्ट रूप से पवित्र आत्मा नहीं कहता, इसलिए 'आत्मा' चुना गया और वैकल्पिक समझ पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ‘मरे हुओं’ की पहचान
  choice: वाक्यांश को बिना व्याख्यात्मक विस्तार के ‘मरे हुओं’ के रूप में रखा गया है।
  alternative: वे लोग जो अब मर चुके हैं पर जीवित रहते सुसमाचार सुन चुके थे; आत्मिक रूप से मृत लोग; या 3:19 से संबद्ध मृतक।
  rationale: νεκροῖς स्वयं इन व्याख्याओं में से किसी को निर्णायक रूप से निर्दिष्ट नहीं करता; अनुवाद धर्मसैद्धांतिक निष्कर्ष आरोपित नहीं करता।
- issue: ἵνα के अधीन न्याय और जीवन का संबंध
  choice: ‘ताकि ... न्याय तो हो, पर ... जीवित रहें’ के द्वारा दोनों क्रियाएँ उद्देश्य/परिणाम की रचना के भीतर और μὲν...δὲ के विरोध में रखी गई हैं।
  alternative: ‘हालाँकि उनका न्याय हुआ, फिर भी वे जीवित रहें’; या न्याय को केवल मानवीय दंड अथवा शारीरिक मृत्यु बताना।
  rationale: यूनानी व्याकरण दोनों subjunctive क्रियाओं को ἵνα के अधीन रखता है, जबकि विरोध कुछ व्याख्याओं में रियायती भाव उत्पन्न कर सकता है। मुख्य पाठ अधिक औपचारिक रचना बचाता है।
- issue: ‘शरीर में’ और ‘आत्मा में’ का अर्थ
  choice: इन्हें अस्तित्व के परस्पर विरोधी क्षेत्रों के रूप में रखा गया है।
  alternative: ‘आत्मा के द्वारा’ को विशेष रूप से पवित्र आत्मा की कर्तृवाचक भूमिका मानना; या ‘शरीर’ को पापी स्वभाव समझना।
  rationale: σαρκί और πνεύματι समानांतर दत्तिव हैं और पाठ स्वयं πνεῦμα को स्पष्ट रूप से पवित्र आत्मा नहीं कहता।
