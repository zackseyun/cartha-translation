base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/004.yaml
  text: In this[a], they are surprised that you do not run with them into the same flood of debauchery[c][b], slandering you.
translation:
  language: hi
  text: इसी बात पर वे अचरज करते हैं[a] कि तुम उनके साथ उसी उच्छृंखलता की बाढ़[b] में नहीं दौड़ते, और वे तुम्हें बुरा-भला कहते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इसे विचित्र मानते हैं’ अथवा ‘चकित होते हैं।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उच्छृंखलता के उसी उमड़ते बहाव में।’
    reason: lexical_alternative
  - marker: c
    text: या ‘तुम्हारी निन्दा करते हैं’ अथवा ‘तुम्हारे विरुद्ध अपमानजनक बातें कहते हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: इसी बात पर
  rationale: यह पदबंध पिछली आयत में वर्णित बदली हुई जीवन-रीति की ओर संकेत करता है। ‘इसी बात पर’ कारण का भाव अधिक प्रबल किए बिना उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ξενίζονται
  choice: वे अचरज करते हैं
  rationale: क्रिया किसी बात को विचित्र मानने और उस पर चकित होने—दोनों भाव रखती है। यह चयन आधुनिक, स्पष्ट हिन्दी में दोनों के निकट रहता है।
- source_word: μὴ συντρεχόντων ὑμῶν
  choice: कि तुम उनके साथ ... नहीं दौड़ते
  rationale: सम्बद्ध दौड़ या सहभागिता के रूपक को बनाए रखते हुए यूनानी genitive absolute को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है।
- source_word: εἰς τὴν αὐτὴν
  choice: उसी ... में
  rationale: εἰς की भीतर की ओर गति और αὐτήν के ‘उसी’ भाव को रूपक के साथ सुरक्षित रखता है।
- source_word: τῆς ἀσωτίας
  choice: उच्छृंखलता
  rationale: यह शब्द नैतिक असंयम, फिजूल और बेलगाम जीवन को दर्शाता है। ‘उच्छृंखलता’ गरिमापूर्ण और आधुनिक हिन्दी में व्यापक अर्थ बनाए रखती है।
- source_word: ἀνάχυσιν
  choice: बाढ़
  rationale: मूल शब्द उँडेल दिए जाने, उमड़ने या बह निकलने की छवि देता है। ‘बाढ़’ अतिरेक की सजीव रूपकात्मक छवि को सहज हिन्दी में बनाए रखती है।
- source_word: βλασφημοῦντες
  choice: और वे तुम्हें बुरा-भला कहते हैं
  rationale: इस संदर्भ में क्रिया मनुष्यों के विरुद्ध अपमानजनक या निंदात्मक वाणी बताती है। लक्ष्य ‘तुम्हें’ प्रसंग से स्पष्ट है; हिन्दी में इसे व्यक्त करना अर्थ को सहज बनाता है।
theological_decisions:
- issue: βλασφημοῦντες में विरोधी वाणी का स्वरूप
  choice: विश्वासियों को बुरा-भला कहना
  alternative: परमेश्वर की निन्दा करना; सामान्यतः निन्दा करना
  rationale: तात्कालिक प्रसंग लोगों द्वारा विश्वासियों की बदली हुई चाल पर प्रतिक्रिया का है। ‘ईशनिन्दा’ कहना लक्ष्य को अनुचित रूप से परमेश्वर तक सीमित कर देता; ‘बुरा-भला कहते हैं’ मानवीय अपमानजनक वाणी को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए स्पष्ट, किंतु गरिमापूर्ण। ‘दौड़ते’ और ‘बाढ़’ द्वारा मूल के संयुक्त रूपक को रखा गया है। मुख्य वाक्य में participle को समन्वित क्रिया के रूप में प्रस्तुत किया गया है, क्योंकि यही हिन्दी में स्वाभाविक है और साथ-साथ चल रही शत्रुतापूर्ण प्रतिक्रिया को स्पष्ट करता है।
