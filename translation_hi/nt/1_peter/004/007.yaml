  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πάντων δὲ τὸ τέλος ἤγγικεν. σωφρονήσατε οὖν καὶ νήψατε ⸀εἰς προσευχάς·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/007.yaml
  text: But the end of all things has drawn near[b][a]. Therefore be self-controlled and sober-minded for prayers.
translation:
  language: hi
  text: पर सब बातों का अन्त निकट आ गया है[a]। इसलिए प्रार्थना करने के लिए संयमी और सचेत रहो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘निकट है।’ यूनानी पूर्णकाल का अधिक रूपगत अनुवाद ‘निकट आ गया है’ और अधिक मुहावरेदार अनुवाद ‘निकट है’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘सुबुद्धि से काम लो और जागरूक रहो।’ दोनों आज्ञाएँ स्पष्ट विवेक, आत्मसंयम और आत्मिक चौकसी पर बल देती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πάντων
  choice: सब बातों का
  rationale: यह नपुंसकलिंग बहुवचन रूप यहाँ समग्र सृष्ट वास्तविकता—‘सब बातों’ या ‘सब कुछ’—की ओर संकेत करता है। ‘सब बातों का अन्त’ हिन्दी में स्वाभाविक रहते हुए व्यापक अर्थ बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिछले प्रसंग से हल्का संक्रमण या विरोध दिखाता है; ‘पर’ उस मोड़ और तात्कालिकता को संक्षेप में व्यक्त करता है।
- source_word: τὸ τέλος
  choice: अन्त
  rationale: इस युगान्त-संबंधी प्रसंग में τέλος का सीधा अर्थ ‘अन्त’ है; ‘लक्ष्य’ या ‘परिणाम’ यहाँ कम संभावित हैं।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: यूनानी पूर्णकाल किसी निकट आ चुकी घटना की वर्तमान स्थिति व्यक्त करता है। ‘निकट आ गया है’ इस पक्ष को बनाए रखता है; ‘निकट है’ अधिक मुहावरेदार विकल्प है।
- source_word: σωφρονήσατε
  choice: संयमी रहो
  rationale: यह आज्ञा विवेकपूर्ण सोच, आत्मनियंत्रण और स्थिर निर्णय की मुद्रा बताती है। ‘संयमी’ केवल शारीरिक रोक-थाम नहीं, बल्कि अनुशासित मनोवृत्ति भी व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: οὖν अन्त के निकट होने से निकाले गए व्यावहारिक निष्कर्ष को स्पष्ट करता है।
- source_word: νήψατε
  choice: सचेत रहो
  rationale: νήφω का मूल अर्थ मदिरा से होश में रहना हो सकता है, पर नए नियम में इसका प्रयोग रूपकात्मक रूप से मानसिक और आत्मिक चौकसी के लिए है। ‘सचेत रहो’ अनावश्यक रूप से मद्यत्याग का विशेष अर्थ जोड़े बिना इस जागरूकता को व्यक्त करता है।
- source_word: εἰς προσευχάς
  choice: प्रार्थना करने के लिए
  rationale: εἰς यहाँ उद्देश्य बताता है। यूनानी बहुवचन प्रार्थना के बार-बार किए जाने वाले कार्यों की ओर संकेत कर सकता है; हिन्दी में क्रियात्मक वाक्यांश ‘प्रार्थना करने के लिए’ अधिक स्वाभाविक है और प्रार्थना-जीवन का व्यापक भाव रखता है।
theological_decisions:
- issue: ‘सब बातों का अन्त’ का युगान्त-संबंधी बल
  choice: इसे अन्त की निकटता की सीधी घोषणा के रूप में रखा गया है, बिना किसी विस्तृत समय-सारणी या युगान्तवादी व्यवस्था को जोड़े।
  alternative: इसे केवल ‘सब बातों का लक्ष्य’ या पूर्णतः वर्तमान में सिद्ध वास्तविकता के रूप में समझना।
  rationale: पद अन्त की निकटता को नैतिक और प्रार्थनामय तत्परता का आधार बनाता है। अनुवाद उसी तनाव और तात्कालिकता को बनाए रखता है, पर किसी विशेष सहस्राब्दी-संबंधी मत को निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘प्रार्थना करने के लिए’ उद्देश्य-संबंध को स्वाभाविक ढंग से व्यक्त करता है, जबकि दोनों यूनानी आज्ञाओं को अलग विशेषणों—‘संयमी’ और ‘सचेत’—से सुरक्षित रखा गया है।
