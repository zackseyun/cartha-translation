source:
  edition: SBLGNT
  text: ἕκαστος καθὼς ἔλαβεν χάρισμα, εἰς ἑαυτοὺς αὐτὸ διακονοῦντες ὡς καλοὶ οἰκονόμοι ποικίλης χάριτος θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/004/010.yaml
  text: As each has received a gift[a], use it in serving one another as good stewards of God’s varied grace.
translation:
  language: hi
  text: जिसे जैसा वरदान मिला है, वह उसे एक-दूसरे की सेवा में लगाए, परमेश्वर के विविध अनुग्रह के अच्छे भंडारी के रूप में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕκαστος
  choice: जिसे…वह
  rationale: यूनानी के वितरणात्मक एकवचन को स्वाभाविक हिन्दी संबंधवाचक-वाक्य रचना में व्यक्त करता है और समुदाय के प्रत्येक व्यक्ति पर बल बनाए रखता है।
- source_word: καθὼς
  choice: जैसा
  rationale: प्राप्त वरदान और उसके द्वारा की जाने वाली सेवा के बीच अनुरूपता व्यक्त करता है।
- source_word: ἔλαβεν
  choice: मिला है
  rationale: वरदान पाने के तथ्य को सहज आधुनिक हिन्दी में व्यक्त करता है; कर्तृवाच्य से आगे बढ़कर दाता को क्रिया में स्पष्ट नहीं करता, यद्यपि प्रसंग में परमेश्वर निहित है।
- source_word: χάρισμα
  choice: वरदान
  rationale: अनुग्रह से मिले उपहार का अर्थ देता है, पर इसे संकीर्ण तकनीकी पद ‘आत्मिक वरदान’ तक सीमित नहीं करता।
- source_word: εἰς ἑαυτοὺς
  choice: एक-दूसरे की सेवा में
  rationale: समुदाय के सदस्यों को सेवा के लाभार्थियों के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτὸ
  choice: उसे
  rationale: पूर्वोक्त ‘वरदान’ की ओर स्पष्ट और संक्षिप्त संकेत करता है।
- source_word: διακονοῦντες
  choice: सेवा में लगाए
  rationale: संदर्भ में कृदंत के उपदेशात्मक बल को स्वाभाविक हिन्दी आज्ञार्थक अभिव्यक्ति देता है और अनावश्यक संस्थागत अर्थ से बचता है।
- source_word: ὡς
  choice: के समान
  rationale: सेवा करने की भूमिका अथवा हैसियत को व्यक्त करता है।
- source_word: καλοὶ
  choice: अच्छे
  rationale: प्रशंसनीय गुणवत्ता का सीधा और व्यापक हिन्दी रूप है; ‘विश्वासयोग्य’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता।
- source_word: οἰκονόμοι
  choice: भंडारी
  rationale: दूसरे की सौंपी हुई संपदा का उत्तरदायी प्रबंध करने वाले व्यक्ति की धारणा को संक्षेप में सुरक्षित रखता है।
- source_word: ποικίλης
  choice: विविध
  rationale: परमेश्वर के अनुग्रह के अनेक रूपों को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: χάριτος θεοῦ
  choice: परमेश्वर के विविध अनुग्रह
  rationale: संबंधकारक रचना को स्वाभाविक हिन्दी में रखते हुए अनुग्रह का स्रोत और स्वामित्व परमेश्वर से जोड़ता है।
theological_decisions:
- issue: क्या χάρισμα को संकीर्ण अर्थ में ‘आत्मिक वरदान’ कहा जाए
  choice: वरदान
  alternative: आत्मिक वरदान; अनुग्रह का वरदान
  rationale: संदर्भ अनुग्रह-प्रदत्त सामुदायिक सेवा का है, पर यूनानी संज्ञा स्वयं अनिवार्य रूप से संकीर्ण तकनीकी अर्थ नहीं मांगती। ‘वरदान’ उसकी अर्थ-व्याप्ति बनाए रखता है।
- issue: εἰς ἑαυτούς के सामुदायिक बल को कैसे व्यक्त किया जाए
  choice: एक-दूसरे की सेवा में
  alternative: आपस में; एक-दूसरे के लिए; एक-दूसरे को
  rationale: यूनानी बहुवचन आत्मवाचक समुदाय को सेवा के क्षेत्र और लाभार्थियों के रूप में दिखाता है। चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है, जबकि दिशा को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- issue: οἰκονόμοι में निहित उत्तरदायित्व
  choice: भंडारी
  alternative: प्रबंधक
  rationale: ‘भंडारी’ सौंपी हुई वस्तु के प्रबंधन और स्वामी के प्रति जवाबदेही, दोनों को बनाए रखता है; पद किसी विशेष कलीसियाई कार्यालय तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। संबंधवाचक ‘जिसे…वह’ रचना यूनानी वितरणात्मक बल को स्वाभाविक ढंग से रखती है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ सामुदायिक अर्थ को पर्याप्त रूप से व्यक्त करता है।
