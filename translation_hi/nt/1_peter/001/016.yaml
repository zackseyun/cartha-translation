  text: क्योंकि लिखा है[a], “तुम पवित्र होगे, क्योंकि मैं पवित्र हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक सीधे आज्ञा के रूप में, “पवित्र बनो।” यूनानी पाठ में, पवित्रशास्त्र के उद्धरण के अनुरूप, भविष्यकालीन रूप है: “तुम पवित्र होगे।”'
