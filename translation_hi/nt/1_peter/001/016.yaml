lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले उपदेश का शास्त्रीय आधार प्रस्तुत करता है और यूनानी के कारणवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण की प्रचलित हिन्दी भूमिका है; यूनानी पूर्णकाल के वर्तमान और स्थायी प्रभाव को भी व्यक्त करती है।
- source_word: ὅτι (पहला)
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: यह उद्धरण का परिचय देता है; हिन्दी में उद्धरण-चिह्न इसका कार्य स्वाभाविक रूप से करते हैं।
- source_word: Ἅγιοι
  choice: पवित्र
  rationale: यहाँ नैतिक और वाचागत संदर्भ में परमेश्वर के सदृश पवित्रता का अर्थ है; केवल ‘अलग किए हुए’ कहना अर्थ को सीमित कर देगा।
- source_word: ἔσεσθε
  choice: होगे
  rationale: यूनानी भविष्यकालीन रूप और लैव्यव्यवस्था के उद्धरण की आज्ञासदृश शक्ति—दोनों को बनाए रखता है।
- source_word: ὅτι (दूसरा)
  choice: क्योंकि
  rationale: विश्वासियों की पवित्रता का कारण परमेश्वर की अपनी पवित्रता है; ‘क्योंकि’ इस संबंध को स्पष्ट रखता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: उद्धरण में परमेश्वर के स्पष्ट और बलयुक्त आत्म-संदर्भ को बनाए रखता है।
- source_word: ἅγιος
  choice: पवित्र
  rationale: पहले विशेषण के साथ शब्दगत संगति रखता है और मनुष्य की पवित्रता को परमेश्वर की पवित्रता पर आधारित दिखाता है।
theological_decisions:
- issue: पवित्रता के उद्धरण में भविष्यकाल ἔσεσθε का बल
  choice: “तुम पवित्र होगे” द्वारा भविष्यकालीन रूप और आज्ञासदृश शास्त्रीय बल दोनों सुरक्षित रखे गए हैं।
  alternative: “पवित्र बनो” या “तुम पवित्र बनोगे”
  rationale: यूनानी पाठ लैव्यव्यवस्था के भविष्यकालीन रूप को उद्धृत करता है, जो शास्त्रीय विधिक और उपदेशात्मक शैली में आज्ञा का काम कर सकता है। केवल सीधी आज्ञा बना देना मूल रूप को मिटा देगा, जबकि सामान्य भविष्यवाणी की तरह अनुवाद करना उसके उपदेशात्मक बल को घटा देगा।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘लिखा है’ शास्त्रीय उद्धरण की परिचित शैली है। भविष्यकाल की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
