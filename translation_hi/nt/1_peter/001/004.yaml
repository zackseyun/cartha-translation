  text: εἰς κληρονομίαν ἄφθαρτον καὶ ἀμίαντον καὶ ἀμάραντον, τετηρημένην ἐν οὐρανοῖς εἰς ὑμᾶς
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/004.yaml
  text: into an inheritance imperishable and undefiled and unfading, kept in the heavens for you,
translation:
  language: hi
  text: एक ऐसी विरासत के लिए जो अविनाशी, निर्मल और कभी न मुरझाने वाली है, और जो तुम्हारे लिए स्वर्गों में सुरक्षित रखी गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κληρονομίαν
  choice: विरासत
  rationale: यह उत्तराधिकार में मिलने वाले हिस्से या धरोहर का स्वाभाविक आधुनिक हिन्दी रूप है और प्रतिज्ञात भावी प्राप्ति का भाव बनाए रखता है।
- source_word: ἄφθαρτον
  choice: अविनाशी
  rationale: नाश या क्षय से परे होने का अर्थ संक्षेप और गरिमा से व्यक्त करता है।
- source_word: ἀμίαντον
  choice: निष्कलंक
  rationale: दूषण और अपवित्रता से अछूते होने का अर्थ व्यक्त करता है; इसे केवल नैतिक दोष तक सीमित नहीं करता।
- source_word: ἀμάραντον
  choice: कभी न मुरझाने वाली
  rationale: मुरझाने या शोभा खोने की मूल छवि को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τετηρημένην
  choice: सुरक्षित रखी गई है
  rationale: पूर्ण कृदंत का भाव—पहले से रखी गई और अब भी सुरक्षित—व्यक्त करता है।
- source_word: ἐν οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी के बहुवचन को औपचारिक रूप से सुरक्षित रखता है।
- source_word: εἰς ὑμᾶς
  choice: तुम्हारे लिए
  rationale: यहाँ लक्ष्य अथवा लाभार्थी का भाव है; प्राकृतिक हिन्दी में ‘तुम्हारे लिए’ उपयुक्त है।
theological_decisions:
- issue: विरासत की वर्तमान सुरक्षा और भावी प्राप्ति
  choice: जो तुम्हारे लिए स्वर्गों में सुरक्षित रखी गई है
  alternative: जो तुम्हारे लिए स्वर्गों में आरक्षित है
  rationale: यह अनुवाद विरासत की अभी तक बनी हुई सुरक्षित अवस्था को व्यक्त करता है, बिना उसकी प्राप्ति की समय-सारणी या सिद्धान्तगत विवरण को अतिरिक्त रूप से निर्धारित किए।
- issue: εἰς के साथ पद का संबंध
  choice: एक ऐसी विरासत के लिए
  alternative: एक ऐसी विरासत में
  rationale: पद 3 के ‘जीवित आशा के लिए’ के समानांतर लक्ष्य की दिशा को हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है; ‘में’ हिन्दी में विरासत के भीतर प्रवेश का अनपेक्षित अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, पर गरिमापूर्ण। तीन विशेषणों की क्रमिक शक्ति और यूनानी ‘स्वर्गों’ का बहुवचन बनाए रखा गया है।
