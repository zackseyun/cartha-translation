source:
  edition: SBLGNT
  text: ἵνα τὸ δοκίμιον ὑμῶν τῆς πίστεως ⸀πολυτιμότερον χρυσίου τοῦ ἀπολλυμένου διὰ πυρὸς δὲ δοκιμαζομένου εὑρεθῇ εἰς ἔπαινον καὶ ⸂δόξαν καὶ τιμὴν⸃ ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/007.yaml
  text: so that the proven genuineness of your faith—more precious than gold that perishes though it is tested by fire—may be found to result in praise and glory and honor at the revelation of Jesus the Messiah[a][b][c].
translation:
  language: hi
  text: ताकि तुम्हारे विश्वास की परखी हुई प्रामाणिकता—जो नष्ट हो जाने वाले सोने से कहीं अधिक बहुमूल्य है, यद्यपि सोना आग से परखा जाता है—यीशु मसीह के प्रकट होने पर प्रशंसा, महिमा और आदर का कारण ठहरे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे विश्वास की परख”; यूनानी शब्द जाँच की प्रक्रिया या उससे प्रमाणित हुई प्रामाणिकता—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्रशंसा, महिमा और आदर” किसे मिलता है या किसकी ओर निर्देशित है, यह यूनानी पाठ स्पष्ट नहीं करता।
    reason: preserved_ambiguity
lexical_decisions:
- source_word: δοκίμιον
  choice: परखी हुई प्रामाणिकता
  rationale: यह संज्ञा केवल जाँच की प्रक्रिया नहीं, बल्कि जाँच से प्रमाणित हुई असलियत पर बल दे सकती है; सोने की तुलना के संदर्भ में परिणामसूचक अर्थ अधिक स्वाभाविक है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ विश्वासियों के उस विश्वास की बात है जो परीक्षाओं से होकर परखा जाता है; आधुनिक हिन्दी में ‘विश्वास’ इसका स्वाभाविक और मानक रूप है।
- source_word: πολυτιμότερον
  choice: कहीं अधिक बहुमूल्य
  rationale: तुलनात्मक मूल्य को स्पष्ट करता है और सोने के साथ तुलना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χρυσίου
  choice: सोना
  rationale: मूल शब्द का सीधा और प्रचलित हिन्दी रूप।
- source_word: ἀπολλυμένου
  choice: नष्ट हो जानेवाला
  rationale: सोने की नश्वरता को क्रियात्मक ढंग से व्यक्त करता है और विश्वास के स्थायी मूल्य के साथ निहित विरोध बनाए रखता है।
- source_word: διὰ πυρὸς
  choice: आग से
  rationale: साधनसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δοκιμαζομένου
  choice: परखा जाता है
  rationale: सोने की जाँच को व्यक्त करता है और δοκίμιον के साथ शब्दार्थ-संबंध भी बनाए रखता है, बिना केवल ‘शुद्ध किया जाता है’ जैसा अधिक विशिष्ट अर्थ थोपे।
- source_word: εὑρεθῇ εἰς
  choice: का कारण पाई जाए
  rationale: निष्क्रिय क्रिया और परिणाम की दिशा दोनों को पठनीय आधुनिक हिन्दी में व्यक्त करता है; ‘पाई जाए’ मूल के εὑρεθῇ को सुरक्षित रखता है।
- source_word: ἔπαινον
  choice: प्रशंसा
  rationale: त्रिक में स्वीकृति और सराहना का मानक अर्थ।
- source_word: δόξαν
  choice: महिमा
  rationale: मूल धार्मिक और सार्वजनिक गौरव-संबंधी अर्थ को बनाए रखने वाला मानक रूप।
- source_word: τιμήν
  choice: आदर
  rationale: प्रशंसा और महिमा के साथ सार्वजनिक सम्मान का स्वाभाविक हिन्दी रूप।
- source_word: ἐν ἀποκαλύψει
  choice: के प्रकट होने पर
  rationale: यहाँ समयसूचक अर्थ सबसे स्वाभाविक है; संज्ञात्मक ‘प्रकाशन’ की अपेक्षा यह सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός को उसके पदवीगत अर्थ ‘मसीह’ से प्रस्तुत किया गया है; हिन्दी में ‘यीशु मसीह’ स्थापित और स्वाभाविक पदबंध है।
theological_decisions:
- issue: τὸ δοκίμιον ὑμῶν τῆς πίστεως का अर्थ
  choice: ‘तुम्हारे विश्वास की परखी हुई प्रामाणिकता’—अर्थात परीक्षाओं से असली सिद्ध हुआ विश्वास
  alternative: ‘तुम्हारे विश्वास की परख’—जाँच की प्रक्रिया पर बल
  rationale: δοκίμιον संदर्भ में जाँच के फलस्वरूप सिद्ध हुई गुणवत्ता को अधिक स्वाभाविक रूप से दर्शाता है, फिर भी वैकल्पिक प्रक्रियात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ‘प्रशंसा, महिमा और आदर’ किसे मिलता है
  choice: मुख्य पाठ में प्राप्तकर्ता या स्रोत को अनिर्दिष्ट रखा गया है
  alternative: इसे विश्वासियों को मिलने वाला आदर, परमेश्वर/मसीह की प्रशंसा, या दोनों से जुड़ा अंतिम प्रतिपादन समझना
  rationale: यूनानी पाठ स्पष्ट रूप से नहीं बताता कि यह त्रिक किसकी ओर निर्देशित है या किसे प्रदान किया जाता है; अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
- issue: Χριστός का पदवीगत अर्थ
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: ‘मसीह’ अभिषिक्त जन की पदवी का अर्थ सामने रखता है और आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। वाक्य की मूल उद्देश्यसूचक संरचना, सोने से तुलना, निष्क्रिय ‘पाई जाए’, और अंतिम प्रकट होने का समयसूचक भाव सुरक्षित रखा गया है।
