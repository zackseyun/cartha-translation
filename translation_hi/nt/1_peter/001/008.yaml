reference: 1 Peter 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃν οὐκ ⸀ἰδόντες ἀγαπᾶτε, εἰς ὃν ἄρτι μὴ ὁρῶντες πιστεύοντες δὲ ⸀ἀγαλλιᾶσθε χαρᾷ ἀνεκλαλήτῳ καὶ δεδοξασμένῃ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/008.yaml
  text: Though you have not seen him[a], you love him. Though you do not now see him, yet believing in him, you rejoice with inexpressible and glorious joy,
translation:
  language: hi
  text: जिसे तुमने नहीं देखा, उससे तुम प्रेम करते हो। यद्यपि अभी तुम उसे नहीं देखते, फिर भी उस पर विश्वास करते हुए तुम अवर्णनीय और महिमामय आनन्द[a] से उल्लसित होते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महिमा से भरा हुआ आनन्द” अथवा “महिमान्वित आनन्द।”
    reason: δεδοξασμένῃ पूर्ण निष्क्रिय कृदन्त है। इसका अर्थ महिमा से युक्त/भरा हुआ या महिमान्वित आनन्द हो सकता है।
lexical_decisions:
- source_word: ὃν
  choice: जिसे / उसे
  rationale: सम्बन्धवाचक सर्वनाम पिछले सन्दर्भ के यीशु मसीह की ओर संकेत करता है; हिन्दी में ‘जिसे’ और फिर ‘उसे’ स्वाभाविक तथा स्पष्ट हैं।
- source_word: ἰδόντες
  choice: तुमने नहीं देखा
  rationale: अओरिस्ट कृदन्त को हिन्दी के पूर्ण भूतकाल में व्यक्त किया गया है, जिससे अब तक प्रत्यक्ष न देखने का भाव स्पष्ट होता है।
- source_word: ἀγαπᾶτε
  choice: तुम प्रेम करते हो
  rationale: वर्तमानकालीन क्रिया के लिए सरल और स्वाभाविक हिन्दी; ἀγαπάω के अर्थ को सीधे सुरक्षित रखती है।
- source_word: εἰς ὃν … πιστεύοντες
  choice: उस पर विश्वास करते हुए
  rationale: πιστεύω के साथ εἰς विश्वास के लक्ष्य को दर्शाता है। हिन्दी में किसी व्यक्ति के सम्बन्ध में ‘उस पर विश्वास करना’ स्वाभाविक है और निरन्तर विश्वास के कृदन्तीय भाव को भी बनाए रखता है।
- source_word: ἄρτι μὴ ὁρῶντες
  choice: अभी तुम उसे नहीं देखते
  rationale: ἄρτι का वर्तमानकालीन बल ‘अभी’ से और ὁρῶντες की जारी अवस्था वर्तमान क्रिया से व्यक्त होती है।
- source_word: δὲ
  choice: फिर भी
  rationale: न देखने के बावजूद विश्वास और आनन्द के हल्के विरोधात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀγαλλιᾶσθε
  choice: आनन्दित होते हो
  rationale: यह प्रबल आनन्द की वर्तमान अवस्था दर्शाता है; उसके उत्कट स्वरूप को साथ आने वाले ‘अवर्णनीय और महिमामय आनन्द’ से पर्याप्त बल मिलता है।
- source_word: χαρᾷ
  choice: आनन्द से
  rationale: रीति अथवा साथ देने वाला दत्तिव; हिन्दी में ‘आनन्द से आनन्दित’ कुछ पुनरुक्तिपूर्ण होते हुए भी मूल की संज्ञा और क्रिया दोनों को सुरक्षित रखता है।
- source_word: ἀνεκλαλήτῳ
  choice: अवर्णनीय
  rationale: ऐसा आनन्द जिसे शब्दों में पूरी तरह व्यक्त न किया जा सके; यह आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: δεδοξασμένῃ
  choice: महिमामय
  rationale: पूर्ण निष्क्रिय कृदन्त का अर्थ केवल साधारण ‘शानदार’ नहीं, बल्कि महिमा से युक्त अथवा महिमान्वित अवस्था है। मुख्य पाठ में स्वाभाविक ‘महिमामय’ रखा गया और अधिक रूपात्मक विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: πιστεύοντες εἰς ὃν में विश्वास और भरोसे का अर्थ
  choice: उस पर विश्वास करते हुए
  alternative: उस पर भरोसा रखते हुए
  rationale: यहाँ किसी विवादित सम्बन्धकारक रचना का प्रश्न नहीं है। ‘विश्वास’ मूल शब्द-परिवार से पारदर्शी सम्बन्ध रखता है, जबकि ‘भरोसा’ सम्भव अर्थछाया है पर मुख्य पाठ में आवश्यक नहीं।
- issue: δεδοξασμένῃ χαρᾷ का रूप और अर्थ
  choice: महिमामय आनन्द
  alternative: महिमा से भरा आनन्द / महिमान्वित किया गया आनन्द
  rationale: ग्रीक में पूर्ण निष्क्रिय कृदन्त है। ‘महिमामय’ हिन्दी में पठनीय रहते हुए महिमा की प्राप्त या विद्यमान अवस्था को व्यक्त करता है; निष्क्रिय रूप और ‘महिमा से भरा’ अर्थ की सम्भावना पादटिप्पणी में रखी गई है, ताकि मूल की असामान्य अभिव्यक्ति पूरी तरह समतल न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘यद्यपि… फिर भी’ से यूनानी कृदन्तों का प्रसंगगत concessive भाव स्पष्ट किया गया है। ‘आनन्द से आनन्दित’ मूल में संज्ञा χαρά और क्रिया ἀγαλλιάω दोनों की उपस्थिति को बनाए रखता है।
