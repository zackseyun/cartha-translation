id: 1PE.1.12
reference: 1 Peter 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἷς ἀπεκαλύφθη ὅτι οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν αὐτά, ἃ νῦν ἀνηγγέλη ὑμῖν διὰ τῶν εὐαγγελισαμένων ⸀ὑμᾶς πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ, εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/012.yaml
  text: To them it was revealed that they were serving not themselves but you in these things[c][b][a], which now have been announced to you through those who preached the good news to you by the Holy Spirit sent from heaven—things into which angels long to look.
translation:
  language: hi
  text: उन्हें यह प्रकट किया गया कि वे इन बातों के संबंध में अपने लिए नहीं, बल्कि आपके लिए सेवा कर रहे थे[a]। अब ये बातें आपको उन लोगों के द्वारा सुनाई गई हैं जिन्होंने स्वर्ग से भेजे गए पवित्र आत्मा के द्वारा आपको शुभ समाचार सुनाया[b]। इन्हीं बातों में स्वर्गदूत भी झाँककर देखने की लालसा रखते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे इन बातों के संबंध में अपने लिए नहीं, बल्कि आपके लिए सेवा कर रहे थे।” यूनानी में प्रयुक्त रूप सेवा के लाभार्थियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “पवित्र आत्मा के द्वारा” का अनुवाद “पवित्र आत्मा में” भी किया जा सकता है। यूनानी रूप साधन या कार्य-क्षेत्र, दोनों का भाव दे सकता है।
    reason: ambiguity
  - marker: c
    text: “झाँककर देखने” में झुककर भीतर ध्यान से देखने और उत्सुक निरीक्षण करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἷς ἀπεκαλύφθη
  choice: उन पर यह प्रकट किया गया
  rationale: सम्बन्धवाचक सर्वनाम का संकेत पिछले पद के भविष्यद्वक्ताओं की ओर है। यह रूप यूनानी कर्मवाच्य और प्रकाशन के भाव को बनाए रखता है।
- source_word: οὐχ ἑαυτοῖς ὑμῖν δὲ διηκόνουν
  choice: वे अपनी नहीं, बल्कि आपकी सेवा कर रहे थे
  rationale: दोनों सम्प्रदान कारकों को सेवा के लाभार्थी के रूप में व्यक्त किया गया है; अपूर्ण काल की निरन्तर भूतकालीन क्रिया भी सुरक्षित है। हिंदी में 'अपनी सेवा' प्रसंगतः 'अपने लिए सेवा' का स्वाभाविक संक्षिप्त रूप है, और विकल्प पादटिप्पणी में स्पष्ट किया गया है।
- source_word: αὐτά
  choice: इन बातों में
  rationale: सर्वनाम का सम्बन्ध पहले बताई गई भविष्यद्वाणी की बातों से है; 'इन बातों' से संदर्भ स्पष्ट रहता है।
- source_word: ἃ νῦν ἀνηγγέλη ὑμῖν
  choice: अब ये बातें आपको ... सुनाई गई हैं
  rationale: νῦν और कर्मवाच्य को बनाए रखते हुए वर्तमान तक प्रासंगिक घोषणा को स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: διὰ τῶν εὐαγγελισαμένων ὑμᾶς
  choice: उन लोगों के द्वारा ... जिन्होंने ... आपको शुभ समाचार सुनाया
  rationale: εὐαγγελίζω की क्रियात्मक धारणा को सुलभ हिंदी में रखा गया है और अनावश्यक तकनीकी शब्दावली से बचा गया है।
- source_word: πνεύματι ἁγίῳ ἀποσταλέντι ἀπ’ οὐρανοῦ
  choice: स्वर्ग से भेजे गए पवित्र आत्मा के द्वारा
  rationale: सम्प्रदान को साधनसूचक समझते हुए प्रचार के दिव्य माध्यम को व्यक्त किया गया है; कृदन्तीय वाक्यांश पवित्र आत्मा को विशेषित करता है।
- source_word: εἰς ἃ ἐπιθυμοῦσιν ἄγγελοι παρακύψαι
  choice: इन्हीं बातों में स्वर्गदूत भी झाँककर देखने की लालसा रखते हैं
  rationale: εἰς की दिशात्मकता, वर्तमानकालीन निरन्तर इच्छा और παρακύπτω के उत्सुकतापूर्वक भीतर झाँकने के चित्र—तीनों को बनाए रखा गया है।
theological_decisions:
- issue: πνεύματι ἁγίῳ का संदर्भ और कारक-सम्बन्ध
  choice: सुसमाचार की घोषणा में दिव्य कर्ता/माध्यम के रूप में पवित्र आत्मा
  alternative: पवित्र आत्मा में; अथवा कोई सामान्य पवित्र आत्मिक शक्ति
  rationale: इस उद्धार-ऐतिहासिक प्रसंग में वाक्यांश स्वाभाविक रूप से व्यक्तिगत पवित्र आत्मा की ओर संकेत करता है। फिर भी यूनानी सम्प्रदान की साधनसूचक और क्षेत्रसूचक सम्भावना को पादटिप्पणी में रखा गया है।
- issue: भविष्यद्वक्ताओं की सेवा के लाभार्थी
  choice: उन्होंने बाद के विश्वासियों के लाभ के लिए उन बातों की सेवा की जो अब शुभ समाचार में घोषित हुईं
  alternative: वे मुख्यतः अपने ही समय और अपने लिए सेवा कर रहे थे
  rationale: οὐχ ... δὲ की स्पष्ट विषमता बाद के श्रोताओं को प्रमुख लाभार्थी बताती है, जबकि अनुवाद इससे भविष्यद्वक्ताओं या उनके समकालीनों को कोई भी लाभ न होने का अतिरिक्त दावा नहीं करता।
- issue: स्वर्गदूतों की लालसा का विषय
  choice: घोषित उद्धार-सम्बन्धी बातों को गहराई से देखने की उनकी निरन्तर लालसा
  alternative: इन बातों को पहले से न जानने का पूर्ण दावा
  rationale: पाठ इच्छा और उत्सुक निरीक्षण बताता है, पर स्वर्गदूतों के ज्ञान की सीमा को व्यवस्थित रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। 'शुभ समाचार सुनाया' यूनानी क्रिया की सुलभ अभिव्यक्ति है; 'झाँककर देखने' से मूल का सजीव चित्र सुरक्षित रहता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उसी क्रम में दिए गए हैं।
