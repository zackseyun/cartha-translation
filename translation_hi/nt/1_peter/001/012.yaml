review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the prophets as the referent of οἷς, retains the passive sense of ἀπεκαλύφθη, the present relevance of νῦν, the heavenly origin of the Holy Spirit, and the angels’ eager desire. However, “अपनी नहीं, बल्कि आपकी सेवा” can mean a contrast between their own service and the readers’ service, rather than the Greek contrast of beneficiaries (“not for themselves but for you”). “इन बातों में” also obscures αὐτά as the matters being served.
  naturalness: Most of the Hindi is clear and suitably dignified. “उन्हें यह प्रकट किया गया” is more natural than “उन पर यह प्रकट किया गया.” Recasting the first clause also makes the beneficiary contrast unambiguous in modern Hindi.
  terminology: “पवित्र आत्मा,” “स्वर्ग,” “स्वर्गदूत,” and “शुभ समाचार” are appropriate. “शुभ समाचार सुनाया” naturally conveys εὐαγγελίζω. No doctrinal expansion is introduced.
  issues:
  - severity: medium
    issue: The beneficiary contrast in οὐχ ἑαυτοῖς ὑμῖν δὲ is ambiguous in the Hindi wording.
    rationale: “वे अपनी नहीं, बल्कि आपकी सेवा कर रहे थे” may be read as serving their own ministry versus the readers’ ministry. The Greek dative pronouns identify those for whose benefit the prophetic service was rendered.
  - severity: medium
    issue: αὐτά is insufficiently represented by “इन बातों में.”
    rationale: The pronoun denotes the prophetic matters and is the object associated with διακονέω. “इन बातों के संबंध में” preserves the connection without making the matters merely a setting.
  - severity: low
    issue: “उन पर यह प्रकट किया गया” is not idiomatic modern Hindi for a revelation given to persons.
    rationale: “उन्हें यह प्रकट किया गया” is the normal indirect-object construction and retains the Greek passive.
