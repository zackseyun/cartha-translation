source:
  edition: SBLGNT
  text: ἐραυνῶντες εἰς τίνα ἢ ποῖον καιρὸν ἐδήλου τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ προμαρτυρόμενον τὰ εἰς Χριστὸν παθήματα καὶ τὰς μετὰ ταῦτα δόξας·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/011.yaml
  text: inquiring into what person or what time the Spirit of Messiah in them was indicating[a], as it testified beforehand to the sufferings for Messiah and the glories after these things.
translation:
  language: hi
  text: वे यह खोज रहे थे कि मसीह का आत्मा, जो उनमें था, किस व्यक्ति या किस समय का संकेत कर रहा था, जब वह मसीह से संबंधित दुःखों[a] और इनके बाद की महिमाओं की पहले से गवाही दे रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मसीह के दुःखों।”
    reason: यूनानी वाक्यांश τὰ εἰς Χριστὸν παθήματα का यह प्रबल और पारंपरिक वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: ἐραυνῶντες
  choice: यह खोज रहे थे
  rationale: यह पद पिछले वचन में वर्णित भविष्यद्वक्ताओं की सतत और सावधान जाँच को आगे बढ़ाता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रहते हुए खोजबीन का भाव रखता है।
- source_word: εἰς τίνα ἢ ποῖον καιρόν
  choice: किस व्यक्ति या किस समय की ओर
  rationale: τίνα को व्यक्तिवाचक और ποῖον καιρόν को कालवाचक समझकर यूनानी वाक्यांश की दोहरी और कुछ कठिन जिज्ञासा को बनाए रखा गया है।
- source_word: ἐδήλου
  choice: संकेत कर रहा था
  rationale: अपूर्ण भूतकाल चल रही क्रिया का भाव देता है; यह चयन उस निरंतर संकेत को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ ἐν αὐτοῖς πνεῦμα Χριστοῦ
  choice: उनमें मौजूद मसीह का आत्मा
  rationale: आत्मा का भविष्यद्वक्ताओं में होना और मसीह से उसका सीधा संबंध—दोनों स्पष्ट रखे गए हैं; Χριστός को उपाधि के रूप में ‘मसीह’ कहा गया है।
- source_word: προμαρτυρόμενον
  choice: पहले से गवाही दे रहा था
  rationale: इसमें μαρτυρέω का गवाही वाला अर्थ और προ- का पूर्वकालिक भाव दोनों सुरक्षित रहते हैं।
- source_word: τὰ εἰς Χριστὸν παθήματα
  choice: मसीह के लिए होने वाले दुःखों
  rationale: εἰς के संबंधसूचक/दिशात्मक भाव को हिन्दी में व्यक्त किया गया है, बिना उसे सीधे स्वामित्वसूचक संबंध मान लेने के; प्रबल वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τὰς μετὰ ταῦτα δόξας
  choice: उनके बाद आने वाली महिमाओं
  rationale: बहुवचन ‘महिमाओं’ को सुरक्षित रखते हुए χρονिक क्रम को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: भविष्यद्वक्ताओं में ‘मसीह का आत्मा’
  choice: ‘उनमें मौजूद मसीह का आत्मा’ की सीधी अभिव्यक्ति रखी गई।
  alternative: ‘मसीह के विषय में बोलने वाला भविष्यद्वाणी का आत्मा’
  rationale: यूनानी पाठ आत्मा को मसीह से संबद्ध और भविष्यद्वक्ताओं में सक्रिय बताता है; व्याख्यात्मक सरलीकरण से इस धर्मवैचारिक गहराई को कम नहीं किया गया।
- issue: τὰ εἰς Χριστὸν παθήματα में εἰς का अर्थ
  choice: मुख्य पाठ में ‘मसीह के लिए होने वाले दुःख’
  alternative: ‘मसीह के दुःख’
  rationale: वाक्यांश में वास्तविक अर्थगत अस्पष्टता है। मुख्य पाठ पूर्वसर्ग की संरचना दर्शाता है, जबकि सन्दर्भतः प्रबल पारंपरिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। ‘मसीह’ को उपाधि के रूप में रखा गया है और ‘महिमाओं’ का मूल बहुवचन सुरक्षित है।
