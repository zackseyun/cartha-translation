  text: εἰδότες ὅτι οὐ φθαρτοῖς, ἀργυρίῳ ἢ χρυσίῳ, ἐλυτρώθητε ἐκ τῆς ματαίας ὑμῶν ἀναστροφῆς πατροπαραδότου,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/018.yaml
  text: knowing that you were redeemed from your futile way of life handed down from your fathers[a], not with perishable things such as silver or gold[b],
translation:
  language: hi
  text: क्योंकि तुम जानते हो कि तुम्हें अपने पूर्वजों से चली आई[b] व्यर्थ जीवन-रीति से चाँदी या सोने जैसी नाशवान वस्तुओं के द्वारा नहीं छुड़ाया गया था[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी क्रिया में कीमत देकर मुक्त कराने का भाव है; अनुवाद ‘मोल देकर मुक्त किया गया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने पूर्वजों से विरासत में मिली।’ शाब्दिक भाव है, ‘पितरों से सौंपी गई।’
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: क्योंकि तुम जानते हो
  rationale: पूर्णकालिक कृदन्त यहाँ आसपास के उपदेश का आधार बताता है। हिन्दी में कारणसूचक उपवाक्य इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλυτρώθητε
  choice: तुम्हें ... छुड़ाया गया था
  rationale: यह निष्क्रिय रूप कीमत देकर मुक्त कराने का भाव रखता है। ‘छुड़ाया गया’ सहज हिन्दी है, और चाँदी-सोने का उल्लेख कीमत/फिरौती की छवि को स्पष्ट करता है।
- source_word: φθαρτοῖς
  choice: नाशवान वस्तुओं
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और ऐसी चीज़ों को दर्शाता है जो नष्ट हो जाती हैं; यह अगले पद के ‘अनश्वर’ मूल्य से भी विरोध रखता है।
- source_word: ἀργυρίῳ ἢ χρυσίῳ
  choice: चाँदी या सोने जैसी
  rationale: चाँदी और सोना ‘नाशवान वस्तुओं’ के उदाहरण हैं। ‘जैसी’ हिन्दी में इस उदाहरणात्मक संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἐκ
  choice: से
  rationale: यह पूर्व जीवन-रीति से अलग किए जाने या बाहर निकाले जाने का भाव व्यक्त करता है।
- source_word: ματαίας
  choice: व्यर्थ
  rationale: यह शब्द खोखलेपन, निष्फलता और निरर्थकता का भाव रखता है; ‘व्यर्थ’ संक्षिप्त, प्रचलित और गरिमापूर्ण है।
- source_word: ἀναστροφῆς
  choice: जीवन-रीति
  rationale: यह व्यक्ति के आचरण और समूचे जीने के ढंग को दर्शाता है। ‘जीवन-रीति’ दोनों पहलुओं को समेटती है।
- source_word: πατροπαραδότου
  choice: अपने बाप-दादों से चली आई
  rationale: मूल शब्द पितरों/पूर्वजों से परम्परा द्वारा सौंपे जाने का भाव रखता है। ‘बाप-दादों से चली आई’ पितृपरक भाषा और पीढ़ी-दर-पीढ़ी प्राप्त होने, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: छुटकारे की शब्दावली
  choice: छुड़ाया गया
  alternative: मोल देकर मुक्त किया गया
  rationale: मूल क्रिया में कीमत देकर मुक्त कराने का बिंब है, पर यह खंड अपने आप उस छुटकारे की पूरी धर्मवैज्ञानिक प्रक्रिया निर्दिष्ट नहीं करता। मुख्य पाठ में सहज शब्द चुना गया है और कीमत का भाव संदर्भ तथा पादटिप्पणी में सुरक्षित है।
- issue: विरासत में मिली परम्परा की भाषा
  choice: बाप-दादों से चली आई
  alternative: पूर्वजों से विरासत में मिली
  rationale: मूल यूनानी शब्द पितरों का स्पष्ट उल्लेख करता है। मुख्य पाठ उस पितृपरक अभिव्यक्ति को रखता है, जबकि पादटिप्पणी उसके व्यापक पूर्वज-संबंधी अर्थ को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘बाप-दादों’ से मूल की पितृपरक भाषा और पीढ़ीगत परम्परा दोनों व्यक्त होते हैं; ‘जीवन-रीति’ केवल अलग-अलग कर्मों के बजाय पूरे आचरण-ढंग को समेटती है। वाक्य के अंत का अल्पविराम अगले पद में जारी रहने वाले विचार को दर्शाता है।
