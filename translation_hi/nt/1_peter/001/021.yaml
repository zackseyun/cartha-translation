  yaml_path: translation/nt/1_peter/001/021.yaml
  text: who through him are believers in God[a], who raised him from the dead and gave him glory[b], so that your faith and hope are in God.
translation:
  language: hi
  text: जो उसके द्वारा परमेश्वर पर विश्वास करते हैं[a]—उस परमेश्वर पर, जिसने उसे मरे हुओं में से जिलाया और उसे महिमा दी—ताकि आपका विश्वास और आशा परमेश्वर पर हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्य लोग”; यहाँ संभवतः अर्थ है कि वे मसीह के द्वारा परमेश्वर पर विश्वास करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसके फलस्वरूप आपका विश्वास और आशा परमेश्वर पर हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: διά + संबंधकारक यहाँ माध्यम को व्यक्त करता है; यह बताता है कि मसीह के माध्यम से लोग परमेश्वर पर विश्वास करते हैं।
- source_word: πιστοὺς εἰς θεόν
  choice: परमेश्वर पर विश्वास करते हैं
  rationale: πιστός का अर्थ ‘विश्वासयोग्य’ भी हो सकता है, पर εἰς θεόν के साथ यहाँ परमेश्वर पर विश्वास रखने वाले लोग अभिप्रेत हैं। हिंदी में क्रियात्मक वाक्यांश अधिक स्वाभाविक है।
- source_word: τὸν ἐγείραντα αὐτὸν ἐκ νεκρῶν
  choice: जिसने उसे मरे हुओं में से जिलाया
  rationale: यह पुनरुत्थान का प्रचलित यूनानी प्रयोग है; ‘मरे हुओं में से’ ἐκ νεκρῶν की सामूहिक और दिशात्मक छवि को बनाए रखता है।
- source_word: δόξαν αὐτῷ δόντα
  choice: उसे महिमा दी
  rationale: यह मूल के सीधे अर्थ को सुरक्षित रखता है और पुनरुत्थान के साथ परमेश्वर की दूसरी समांतर क्रिया को व्यक्त करता है।
- source_word: ὥστε
  choice: ताकि
  rationale: ὥστε परिणाम अथवा उद्देश्य-सदृश परिणाम व्यक्त कर सकता है; ‘ताकि’ हिंदी में संबंध को सहज रखता है, जबकि पादटिप्पणी परिणामार्थक संभावना स्पष्ट करती है।
- source_word: τὴν πίστιν ὑμῶν καὶ ἐλπίδα
  choice: आपका विश्वास और आशा
  rationale: πίστις और ἐλπίς के मानक अर्थ क्रमशः ‘विश्वास’ और ‘आशा’ हैं; एकवचन ‘आपका’ दोनों समन्वित संज्ञाओं के साथ स्वाभाविक है।
- source_word: εἶναι εἰς θεόν
  choice: परमेश्वर पर हो
  rationale: εἰς यहाँ विश्वास और आशा की दिशा अथवा विषय बताता है; हिंदी में ‘परमेश्वर पर’ मुहावरेदार है और पहले खंड की पुनरावृत्ति भी बनाए रखता है।
theological_decisions:
- issue: πιστούς का अर्थ
  choice: परमेश्वर पर विश्वास करने वाले
  alternative: विश्वासयोग्य लोग
  rationale: εἰς θεόν के साथ इसकी रचना विश्वास या भरोसे की दिशा बताती है; फिर भी वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: मसीह के द्वारा परमेश्वर तक विश्वास का संबंध
  choice: ‘उसके द्वारा’ को माध्यम के अर्थ में रखा गया
  alternative: ‘उसके कारण’
  rationale: διά + संबंधकारक माध्यम को सबसे स्वाभाविक रूप से व्यक्त करता है और पाठ से आगे बढ़कर कोई विस्तृत सिद्धांत नहीं जोड़ता।
- issue: ὥστε उपवाक्य का बल
  choice: ‘ताकि’ द्वारा उद्देश्य और परिणाम के बीच खुलापन रखा गया
  alternative: ‘जिसके फलस्वरूप’ द्वारा स्पष्ट परिणाम
  rationale: यह संयोजक परिणाम को प्रमुखता दे सकता है, पर उद्देश्य-सदृश छाया भी संभव है; मुख्य पाठ और पादटिप्पणी मिलकर इस तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। ‘आपका’ सामूहिक पाठक-वर्ग के प्रति सम्मानपूर्ण संबोधन है। डैश से परमेश्वर का वर्णन स्पष्ट रखा गया है, और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
