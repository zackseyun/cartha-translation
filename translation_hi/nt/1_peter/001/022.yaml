  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘प्राणों’, ‘निष्कपट’, ‘हृदय’ और ‘प्रगाढ़’ जैसे शब्द मूल की गंभीरता को रखते हैं; वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए स्पष्ट किया गया है।
