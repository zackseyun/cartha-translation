source:
  edition: SBLGNT
  text: Τὰς ψυχὰς ὑμῶν ἡγνικότες ἐν τῇ ὑπακοῇ τῆς ⸀ἀληθείας εἰς φιλαδελφίαν ἀνυπόκριτον ⸀ἐκ καρδίας ἀλλήλους ἀγαπήσατε ἐκτενῶς,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/022.yaml
  text: Having purified your souls by obedience to the truth for sincere brotherly love[a], love one another earnestly from the heart[b],
translation:
  language: hi
  text: सत्य का आज्ञापालन करके तुमने अपने आप को निष्कपट भाईचारे के प्रेम के लिए शुद्ध किया है; हृदय से एक-दूसरे से प्रगाढ़ प्रेम करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡγνικότες
  choice: शुद्ध किया है
  rationale: पूर्णकालिक कृदंत पहले हो चुके ऐसे कार्य को दर्शाता है जिसका प्रभाव वर्तमान में बना हुआ है। हिन्दी में ‘शुद्ध किया है’ इस पूर्ण और वर्तमान-संगत भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ψυχὰς ὑμῶν
  choice: अपने प्राणों को
  rationale: ψυχή व्यक्ति के प्राण, जीवन या आंतरिक अस्तित्व को सूचित कर सकता है। ‘अपने प्राणों को’ मूल की शब्दावली और बहुवचन को बनाए रखता है तथा केवल मन या भावनाओं तक अर्थ को सीमित नहीं करता।
- source_word: ἐν τῇ ὑπακοῇ τῆς ἀληθείας
  choice: सत्य का आज्ञापालन करके
  rationale: ἐν यहाँ साधन अथवा क्षेत्र का भाव दे सकता है। यह अनुवाद शुद्धिकरण को सत्य के प्रति आज्ञाकारी प्रत्युत्तर से जोड़ता है और हिन्दी में सहज है।
- source_word: εἰς φιλαδελφίαν ἀνυπόκριτον
  choice: भाईचारे के निष्कपट प्रेम के लिए
  rationale: εἰς लक्ष्य या परिणाम का बोध कराता है। ‘के लिए’ उस दिशा को खुला रखता है, जबकि ‘निष्कपट’ ἀνυπόκριτον का सीधा और गरिमापूर्ण समतुल्य है।
- source_word: φιλαδελφίαν
  choice: भाईचारे का प्रेम
  rationale: यह शब्द सहविश्वासियों के बीच पारिवारिक या भाई-बहन जैसे स्नेह को दर्शाता है। यह चयन अगले ἀγαπήσατε से शब्दगत भेद बनाए रखता है; स्त्रियाँ भी इसमें सम्मिलित हैं, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ἐκ καρδίας
  choice: हृदय से
  rationale: SBLGNT पाठ में विशेषण के बिना केवल ‘हृदय से’ है। अतः ‘शुद्ध हृदय से’ को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἀλλήλους ἀγαπήσατε
  choice: एक-दूसरे से प्रेम करो
  rationale: यह पारस्परिक प्रेम की स्पष्ट आज्ञा है। अओरिस्ट आज्ञार्थक के निर्णायक आग्रह को हिन्दी का सरल आज्ञार्थक स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐκτενῶς
  choice: प्रगाढ़
  rationale: यह क्रियाविशेषण प्रेम की तीव्रता और दृढ़ता बताता है। ‘प्रगाढ़’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल हिन्दी में उसी गहनता को व्यक्त करता है।
theological_decisions:
- issue: φιλαδελφία और ἀγαπάω के बीच शब्दगत भेद
  choice: φιλαδελφία के लिए ‘भाईचारे का प्रेम’ और ἀγαπήσατε के लिए सामान्य ‘प्रेम करो’ रखा गया।
  alternative: दोनों को केवल ‘प्रेम’ से अनूदित करना।
  rationale: मूल यूनानी एक ही पद में प्रेम से जुड़े दो अलग शब्दों का प्रयोग करता है। भेद बनाए रखने से पाठ की अभिव्यक्ति सुरक्षित रहती है, पर दोनों के बीच आवश्यकता से अधिक धर्मवैज्ञानिक अंतर नहीं थोपा जाता।
- issue: φιλαδελφία का लिंग-संबंधी विस्तार
  choice: मुख्य पाठ में ‘भाईचारे का प्रेम’ रखकर पादटिप्पणी में स्पष्ट किया गया कि इसमें विश्वासी बहनें भी सम्मिलित हैं।
  alternative: ‘सहविश्वासियों के प्रति प्रेम’ या ‘भाइयों और बहनों का प्रेम’।
  rationale: ‘भाईचारा’ यूनानी के पारिवारिक रूपक और अगले प्रेम-संबंधी शब्द से उसके भेद को सुरक्षित रखता है; पादटिप्पणी उसके समावेशी संदर्भ को स्पष्ट करती है।
- issue: ἐκ καρδίας के बाद पाठांतर
  choice: मुख्य पाठ में ‘हृदय से’ रखा गया।
  alternative: ‘शुद्ध हृदय से’।
  rationale: प्रदत्त SBLGNT पाठ में καθαρᾶς नहीं है। महत्वपूर्ण पाठांतर को पादटिप्पणी में रखा गया है, मुख्य पाठ में नहीं मिलाया गया।
- issue: कृदंत और मुख्य आज्ञा का संबंध
  choice: हिन्दी वाक्य में ‘इसलिए’ लगाकर पहले कथन को अगली आज्ञा के आधार के रूप में व्यक्त किया गया।
  alternative: दोनों खंडों को बिना किसी संयोजक के रखना।
  rationale: यूनानी का पूर्णकालिक कृदंत मुख्य आज्ञा की पृष्ठभूमि और आधार देता है। हिन्दी में ‘इसलिए’ इस संबंध को स्वाभाविक बनाता है, बिना शुद्धिकरण के साधन या कर्ता के विषय में अतिरिक्त सिद्धांत जोड़े।
