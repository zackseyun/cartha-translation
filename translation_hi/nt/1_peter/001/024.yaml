  text: διότι πᾶσα σὰρξ ὡς χόρτος, καὶ πᾶσα δόξα ⸀αὐτῆς ὡς ἄνθος χόρτου· ἐξηράνθη ὁ χόρτος, καὶ τὸ ⸀ἄνθος ἐξέπεσεν·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/024.yaml
  text: because all flesh is like grass[a], and all its glory is like the flower of grass; the grass withered[b], and the flower fell off.
translation:
  language: hi
  text: क्योंकि “सारी मानवजाति[a] घास के समान है, और उसकी सारी शोभा[b] घास के फूल के समान है; घास सूख गई और फूल झड़ गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘हर देह’; अर्थात समस्त मानवजाति। यह यशायाह 40:6 की प्रतिध्वनि है और मनुष्य की नश्वरता पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘महिमा’ अथवा ‘वैभव’।
    reason: lexical_alternative
lexical_decisions:
- source_word: διότι
  choice: क्योंकि
  rationale: यह पिछले कथन का शास्त्रीय आधार प्रस्तुत करता है और यूनानी के कारणसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶσα σὰρξ
  choice: सभी प्राणी
  rationale: शब्दशः अर्थ ‘हर देह’ है, पर यहाँ आशय नश्वर मानवजाति से है। ‘सभी प्राणी’ हिन्दी में स्वाभाविक रहते हुए यशायाह 40:6 की देहधारी जीवन की क्षणभंगुरता को बनाए रखता है; वैकल्पिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ὡς χόρτος
  choice: घास के समान हैं
  rationale: क्षणभंगुरता की उपमा को स्पष्ट और काव्यात्मक हिन्दी में सुरक्षित रखता है।
- source_word: πᾶσα δόξα αὐτῆς
  choice: उनकी सारी शोभा
  rationale: δόξα यहाँ मनुष्यों के वैभव, आकर्षण या सम्मान की नश्वर अभिव्यक्ति है। ‘शोभा’ इस संदर्भ में सहज है, जबकि ‘महिमा’ को पादटिप्पणी में विकल्प के रूप में रखा गया है। बहुवचन ‘उनकी’ हिन्दी के ‘सभी प्राणी’ से स्वाभाविक सामंजस्य रखता है।
- source_word: ὡς ἄνθος χόρτου
  choice: घास के फूल के समान है
  rationale: यूनानी संबंधवाचक चित्र को निकटता से बनाए रखता है और ‘मैदान के फूल’ जैसा स्रोत में निहित न होने वाला विस्तार नहीं जोड़ता।
- source_word: ἐξηράνθη
  choice: सूख गई
  rationale: वनस्पति के सूख जाने के लिए स्वाभाविक हिन्दी और यूनानी अओरिस्ट के पूर्ण घटना-वर्णन के अनुरूप है।
- source_word: ἐξέπεσεν
  choice: झड़ गया
  rationale: फूल के अपने स्थान से गिर जाने को हिन्दी में स्वाभाविक और सटीक ढंग से व्यक्त करता है।
theological_decisions:
- issue: नश्वरता के संदर्भ में σάρξ का अनुवाद
  choice: सभी प्राणी
  alternative: हर देह; समस्त मानवजाति
  rationale: यहाँ σάρξ पापी स्वभाव का संकेत नहीं, बल्कि देहधारी मनुष्य की नश्वरता का बिंब है। मुख्य पाठ में ‘सभी प्राणी’ अर्थ को सहज बनाता है, जबकि पादटिप्पणी यूनानी के शाब्दिक रूप और यशायाह 40:6 की प्रतिध्वनि को सुरक्षित रखती है।
- issue: δόξα का संदर्भगत अर्थ
  choice: शोभा
  alternative: महिमा; वैभव
  rationale: यहाँ मनुष्य की क्षणिक प्रतिष्ठा और बाहरी चमक फूल से तुलना में है। ‘शोभा’ इस चित्र को स्पष्ट करती है, पर ‘महिमा’ की व्यापक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। उद्धरण-चिह्न से शास्त्रीय उद्धरण स्पष्ट किया गया है और यूनानी वाक्य के प्रवाह के अनुरूप अर्धविराम बनाए रखा गया है।
