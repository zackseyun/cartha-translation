  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς
  choice: होने के नाते
  rationale: यह पदबंध उस पहचान और ढंग को व्यक्त करता है जिसमें आगे का निषेध दिया गया है; आधुनिक हिन्दी में यह केवल उपमा की अपेक्षा अधिक स्वाभाविक है।
- source_word: τέκνα ὑπακοῆς
  choice: आज्ञाकारिता की संतान
  rationale: यूनानी संबंधकारक संरचना को बनाए रखता है और आज्ञाकारिता से चिह्नित पहचान का बल सुरक्षित रखता है। अधिक सहज विकल्प ‘आज्ञाकारी संतान’ पादटिप्पणी में दिया गया है।
- source_word: μὴ συσχηματιζόμενοι
  choice: अपने आप को न ढालो
  rationale: वर्तमान कृदंत के उपदेशात्मक निषेध और पाठकों की नैतिक सहभागिता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ταῖς ... ἐπιθυμίαις
  choice: उन अभिलाषाओं के अनुसार
  rationale: ἐπιθυμίαι यहाँ नैतिक रूप से अनुचित प्रबल इच्छाओं को सूचित करता है; ‘अभिलाषाएँ’ व्यापक अर्थ रखता है और इसे केवल यौन वासना तक सीमित नहीं करता।
- source_word: πρότερον ἐν τῇ ἀγνοίᾳ ὑμῶν
  choice: जो तुम्हारी अज्ञानता के समय तुममें थीं
  rationale: पूर्व अवस्था और उस समय की अभिलाषाओं के संबंध को स्पष्ट करते हुए मूल के कालगत तथा नैतिक भाव को बनाए रखता है।
theological_decisions:
- issue: τέκνα ὑπακοῆς की संबंधकारक अभिव्यक्ति को विशेषण में सरल किया जाए या नहीं
  choice: आज्ञाकारिता की संतान
  alternative: आज्ञाकारी संतान
  rationale: मुख्य पाठ में स्रोत की पहचान-निर्माणकारी संरचना सुरक्षित रखी गई है, पर अधिक सहज हिन्दी विकल्प पादटिप्पणी में देकर वास्तविक भाषिक विकल्प को स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य हिन्दी। ‘संतान’ को लिंग-समावेशी बहुवचन अर्थ में और ‘अभिलाषाओं’ को व्यापक नैतिक अर्थ में रखा गया है।
