    text: “तितर-बितर होकर परदेशियों के रूप में रहने वाले” का अनुवाद “बिखराव के परदेशी” भी हो सकता है। यह अभिव्यक्ति यहूदी बिखराव और अपनी सच्ची मातृभूमि से दूर रहने वाली परमेश्वर की प्रजा—दोनों की ओर संकेत कर सकती है।
    reason: lexical_and_cultural_note
  - marker: b
    text: “परदेशियों” का अर्थ यहाँ अस्थायी निवासी या दूसरे स्थान में रहने वाले बाहरी लोग भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πέτρος
  choice: पतरस
  rationale: व्यक्तिनाम का हिन्दी बाइबल-परंपरा में प्रचलित और सहज रूप।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यह पत्र के आरंभ में मान्य पद और अधिकार-सूचक उपाधि है, केवल सामान्य संदेशवाहक नहीं।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός के अभिषिक्त, मसीही उपाधि-भाव को हिन्दी के स्वाभाविक और स्थापित रूप में सुरक्षित रखता है।
- source_word: ἐκλεκτοῖς
  choice: चुने हुए लोगों
  rationale: ईश्वर द्वारा चुने जाने का कथन बनाए रखता है, पर किसी संकीर्ण मतगत व्यवस्था को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: παρεπιδήμοις
  choice: परदेशियों के रूप में रहनेवाले
  rationale: अस्थायी निवास, बाहरीपन और अपनी स्थायी मातृभूमि से दूर रहने के भाव को आधुनिक, गैर-प्रशासनिक हिन्दी में व्यक्त करता है।
- source_word: διασπορᾶς
  choice: तितर-बितर होकर
  rationale: मूल के बिखराव/डायस्पोरा-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करते हुए यहूदी बिखराव और परमेश्वर की प्रजा के व्यापक प्रवासी भाव—दोनों की प्रतिध्वनि खुली रखता है।
- source_word: Πόντου, Γαλατίας, Καππαδοκίας, Ἀσίας, καὶ Βιθυνίας
  choice: पुन्तुस, गलातिया, कप्पदुकिया, आसिया और बितूनिया में
  rationale: प्राचीन भौगोलिक नामों के प्रचलित हिन्दी रूप; ‘में’ उनके निवास-क्षेत्र को स्पष्ट करता है।
theological_decisions:
- issue: ἐκλεκτοῖς का अर्थ
  choice: चुने हुए लोगों
  alternative: निर्वाचित लोगों
  rationale: स्रोत का चुनाव-संबंधी दावा स्पष्ट रहता है, लेकिन अपेक्षाकृत पारिभाषिक ‘निर्वाचित’ से उत्पन्न संप्रदायगत अतिरिक्त अर्थ से बचा जाता है।
- issue: παρεπιδήμοις διασπορᾶς का संबंध और आशय
  choice: तितर-बितर होकर परदेशियों के रूप में रहनेवाले
  alternative: बिखराव के परदेशी / प्रवासी यहूदी
  rationale: ग्रीक पदबंध सामाजिक-भौगोलिक स्थिति के साथ धर्मवैचारिक परदेशीपन की ओर भी संकेत कर सकता है; मुख्य पाठ किसी एक अर्थ को अंतिम नहीं बनाता।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: उपाधि का मसीही अर्थ सुरक्षित रहता है और हिन्दी पाठक के लिए स्थापित, स्वाभाविक रूप मिलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पत्रारंभ। ‘की ओर से … को’ हिन्दी में प्रेषक और प्राप्तकर्ताओं की ग्रीक संरचना को स्वाभाविक बनाता है। पद के अंत की अल्पविराम-सदृश अपूर्णता बनाए नहीं रखी गई, क्योंकि हिन्दी में यह पंक्ति स्वतंत्र पद के रूप में सहज विराम चाहती है।
