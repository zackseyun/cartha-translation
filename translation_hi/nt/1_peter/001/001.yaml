translation:
  language: hi
  text: यीशु मसीह के प्रेरित पतरस की ओर से, पुन्तुस, गलातिया, कप्पदुकिया, आसिया और बितूनिया में तितर-बितर होकर परदेशियों के रूप में रहने वाले चुने हुए लोगों को:[a][b]
  philosophy: optimal-equivalence
  footnotes:
