  text: τοὺς ἐν δυνάμει θεοῦ φρουρουμένους διὰ πίστεως εἰς σωτηρίαν ἑτοίμην ἀποκαλυφθῆναι ἐν καιρῷ ἐσχάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/005.yaml
  text: who are being guarded by the power of God through faith for a salvation ready to be revealed in the last time[a][b].
translation:
  language: hi
  text: जो परमेश्वर की सामर्थ्य से विश्वास के द्वारा उस उद्धार के लिए सुरक्षित रखे जा रहे हैं, जो अंतिम समय में प्रकट किए जाने के लिए तैयार है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भरोसे के द्वारा’; यहाँ ‘निष्ठा के द्वारा’ की संभावना कम है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अंतिम समय के अवसर पर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: φρουρουμένους
  choice: सुरक्षित रखे जा रहे हैं
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत लगातार जारी उस कार्य को व्यक्त करता है जो संबोधित लोगों पर किया जा रहा है। यह चयन रक्षा और पहरे में रखे जाने, दोनों भावों को स्वाभाविक हिन्दी में संजोता है।
- source_word: ἐν δυνάμει θεοῦ
  choice: परमेश्वर की सामर्थ्य से
  rationale: कर्मवाच्य कृदंत के साथ ἐν यहाँ साधन का बोध कराता है; हिन्दी में ‘से’ परमेश्वर की सामर्थ्य को रक्षा के प्रभावी साधन के रूप में स्पष्ट करता है।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: διά संबंधवाचक रूप के साथ माध्यम दर्शाता है। πίστις का यहाँ सबसे स्वाभाविक अर्थ ‘विश्वास’ है; ‘भरोसे’ का अर्थ भी संभव है और पादटिप्पणी में रखा गया है।
- source_word: εἰς σωτηρίαν
  choice: उस उद्धार के लिए
  rationale: εἰς लक्ष्य या परिणति बताता है। हिन्दी में ‘उद्धार के लिए’ आगे की ओर उन्मुख अर्थ को बनाए रखता है; ‘उस’ अगले विशेषक वाक्यांश से पहचाने गए उद्धार को स्वाभाविक रूप से इंगित करता है।
- source_word: ἑτοίμην ἀποκαλυφθῆναι
  choice: प्रकट होने को तैयार है
  rationale: विशेषण और कर्मवाच्य infinitive की रचना को यह सहज हिन्दी में सीधे व्यक्त करता है तथा उद्धार के प्रकट किए जाने की निकट तत्परता बनाए रखता है।
- source_word: ἐν καιρῷ ἐσχάτῳ
  choice: अंतिम समय में
  rationale: καιρός किसी निर्णायक या नियत अवसर का बोध देता है। ‘अंतिम समय में’ युगांत-संबंधी अर्थ को किसी विस्तृत अंत-काल योजना में बदले बिना सुरक्षित रखता है।
- source_word: τοὺς
  choice: जो
  rationale: यह पद पिछले वचन में संबोधित लोगों को फिर ग्रहण करता है; हिन्दी में संबंधवाचक ‘जो’ पूर्ववर्ती वाक्य से संबंध स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: διὰ πίστεως में परमेश्वर की सुरक्षा और मानवीय प्रत्युत्तर का संबंध
  choice: परमेश्वर अपनी सामर्थ्य से सुरक्षित रखता है, और विश्वास उस सुरक्षा का माध्यम है।
  alternative: विश्वास को केवल वर्णनात्मक जोड़ मानना, या यहाँ πίστις का मुख्य अर्थ ‘विश्वासयोग्यता’ लेना।
  rationale: वाक्य-विन्यास परमेश्वर की सामर्थ्य को सुरक्षा का साधन और विश्वास को माध्यम बताता है। अनुवाद दोनों को रखता है, पर धीरज, सुरक्षा या विश्वासत्याग संबंधी किसी साम्प्रदायिक निष्कर्ष को नहीं जोड़ता।
- issue: उद्धार का युगांत-संबंधी समय
  choice: यहाँ उद्धार अपनी पूर्ण अभिव्यक्ति में भविष्य में प्रकट होने वाला है।
  alternative: इसे केवल वर्तमान मन-परिवर्तन मानना, या नए नियम में उद्धार के किसी वर्तमान पहलू को नकारते हुए इसे सर्वथा केवल भविष्य का मानना।
  rationale: ‘अंतिम समय में प्रकट होने को तैयार’ स्पष्ट रूप से भविष्य की अभिव्यक्ति की ओर संकेत करता है। अनुवाद इसी दिशा को रखता है, पर उद्धार के व्यापक बाइबलीय कालगत आयामों पर अतिरिक्त दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘सुरक्षित रखे जा रहे हैं’ सतत कर्मवाच्य और रक्षात्मक अर्थ को बनाए रखता है। ‘सामर्थ्य’, ‘विश्वास’ और ‘उद्धार’ प्रचलित बाइबलीय शब्द हैं, किंतु वाक्य-रचना आधुनिक और सहज रखी गई है।
