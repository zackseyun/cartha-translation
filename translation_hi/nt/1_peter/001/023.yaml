  yaml_path: translation/nt/1_peter/001/023.yaml
  text: having been born again[a], not from perishable seed but imperishable, through the living and abiding word of God.
translation:
  language: hi
  text: तुम्हारा नया जन्म नाशवान बीज से नहीं, बल्कि अविनाशी बीज से—परमेश्वर के जीवित और सदा कायम रहने वाले वचन के द्वारा—हुआ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγεγεννημένοι
  choice: तुम्हारा नया जन्म … हुआ है
  rationale: पूर्णकालिक कर्मवाच्य कृदंत को स्वाभाविक हिन्दी में मुख्य वाक्य-सदृश रूप दिया गया है; यह बीते हुए कार्य और उसके वर्तमान परिणाम, दोनों को व्यक्त करता है। पद के आरम्भ का कृदंतीय संबंध हिन्दी में ‘क्योंकि’ से स्पष्ट किया गया है।
- source_word: σπορᾶς
  choice: बीज
  rationale: जन्म के रूपक और नाशवान/अविनाशी विरोध को सीधे तथा सहज रूप में बनाए रखता है।
- source_word: φθαρτῆς
  choice: नाशवान
  rationale: आधुनिक हिन्दी में ऐसी वस्तु का स्पष्ट बोध कराता है जो नष्ट हो सकती है और ἀφθάρτου के साथ स्वाभाविक विरोध बनाता है।
- source_word: ἀφθάρτου
  choice: अविनाशी
  rationale: नाशवान के सटीक विरोध को बनाए रखता है और धार्मिक हिन्दी में परिचित होते हुए भी सहज है।
- source_word: διὰ
  choice: के द्वारा
  rationale: सम्बन्धकारक के साथ διά यहाँ साधन या माध्यम बताता है; ‘के द्वारा’ इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: λόγου
  choice: वचन
  rationale: λόγος का सीधा और स्थापित बाइबलीय हिन्दी प्रतिशब्द है; ‘संदेश’ सम्भव है, पर यहाँ स्रोत की शब्दावली और अगले पद से संबंध के लिए ‘वचन’ उपयुक्त है।
- source_word: ζῶντος
  choice: जीवित
  rationale: वर्तमान कृदंत का सीधा विशेषणात्मक अनुवाद है; इसे वचन से जोड़ा गया है।
- source_word: θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक को स्वामित्व/स्रोत सूचक रूप में ‘वचन’ से जोड़ा गया है।
- source_word: μένοντος
  choice: सदा बने रहने वाले
  rationale: μένοντος की निरंतरता और स्थायित्व को सामान्य आधुनिक हिन्दी में व्यक्त करता है; केवल ‘रहने वाला’ की अपेक्षा प्रसंग में अधिक स्पष्ट है।
theological_decisions:
- issue: ζῶντος और μένοντος का संबंध ‘वचन’ से है या ‘परमेश्वर’ से
  choice: 'दोनों कृदंत ‘वचन’ को विशेषित करते हैं: ‘परमेश्वर के जीवित और सदा बने रहने वाले वचन’'
  alternative: ‘जीवित और सदा बने रहने वाले परमेश्वर के वचन के द्वारा’
  rationale: λόγου, ζῶντος और μένοντος सभी सम्बन्धकारक पुल्लिंग एकवचन हैं; अतः दोनों कृदंतों का λόγου को विशेषित करना स्वाभाविक है। पद 25 में वचन के सदा बने रहने पर बल भी इस पाठ का समर्थन करता है। फिर भी ‘परमेश्वर’ को विशेषित करने वाला संबंध व्याकरणतः सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नया जन्म’ प्रचलित एवं स्पष्ट है; ‘अविनाशी’ और ‘वचन’ बाइबलीय गरिमा बनाए रखते हैं। हिन्दी वाक्य की स्वाभाविकता के लिए कृदंत को ‘क्योंकि … हुआ है’ के रूप में व्यक्त किया गया है।
