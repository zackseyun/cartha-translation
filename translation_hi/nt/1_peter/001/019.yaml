id: 1PE.1.19
reference: 1 Peter 1:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ τιμίῳ αἵματι ὡς ἀμνοῦ ἀμώμου καὶ ἀσπίλου Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/019.yaml
  text: but with the precious blood of Messiah[a], like that of a lamb without blemish and without spot,
translation:
  language: hi
  text: बल्कि मसीह[a] के बहुमूल्य लहू से—जो एक दोषरहित और निष्कलंक मेम्ने के लहू के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “ख्रीस्त।” यूनानी पदवी Χριστός का अर्थ “मसीह” या “अभिषिक्त जन” है।'
    reason: पारंपरिक ध्वन्यंतरण और पदवी के अर्थपूर्ण अनुवाद—दोनों से पाठक को अवगत कराना।
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: पिछले पद के ‘नाशवान वस्तुओं से नहीं’ के साथ प्रबल विरोध दिखाता है और हिन्दी में ‘नहीं... बल्कि...’ संरचना स्वाभाविक है।
- source_word: τιμίῳ
  choice: बहुमूल्य
  rationale: यह ऊँचे मूल्य और आदर, दोनों का भाव रखता है तथा ‘लहू’ के साथ गरिमापूर्ण और स्वाभाविक लगता है।
- source_word: αἵματι
  choice: लहू
  rationale: मूल ठोस संज्ञा को बनाए रखता है; बलिदानी मृत्यु का निहितार्थ अनुवाद में इसकी जगह नहीं लेता।
- source_word: ὡς
  choice: जो ... के लहू के समान है
  rationale: यह स्पष्ट करता है कि तुलना मसीह के लहू और मेम्ने के लहू के बीच है, जबकि हिन्दी वाक्य सहज बना रहता है।
- source_word: ἀμνοῦ
  choice: मेम्ने
  rationale: यह सीधे ‘lamb’ का अर्थ देता है और बलिदान-संबंधी प्रतिध्वनि को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἀμώμου
  choice: दोषरहित
  rationale: बलिदान के लिए अस्वीकार्य दोष से रहित होने का भाव देता है और इसे केवल नैतिक निर्दोषता तक सीमित नहीं करता।
- source_word: καὶ
  choice: और
  rationale: दोनों विशेषणों का सरल समन्वय बनाए रखता है।
- source_word: ἀσπίλου
  choice: निष्कलंक
  rationale: दूसरे विशेषण को पहले से अलग रखते हुए धब्बे या कलंक से रहित होने का भाव और ऊँची शैली सुरक्षित रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यह Χριστός के पदवीगत अर्थ ‘अभिषिक्त जन/मसीहा’ को हिन्दी की प्रचलित और गरिमापूर्ण बाइबलीय शब्दावली में व्यक्त करता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रसंग में शब्द पदवी के रूप में अर्थपूर्ण है; ‘मसीह’ हिन्दी में प्रचलित होने के साथ उसके मसीहाई अर्थ को सुरक्षित रखता है। पारंपरिक ध्वन्यंतरण ‘ख्रीस्त’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- issue: बलिदानी तुलना की व्याख्या
  choice: लहू की तुलना दोषरहित और निष्कलंक मेम्ने के लहू से स्पष्ट की गई है
  alternative: मसीह को सीधे ‘दोषरहित और निष्कलंक मेम्ना’ कहना
  rationale: मूल यूनानी में ὡς ἀμνοῦ की संरचना लहू के साथ तुलना को सामने रखती है। अनुवाद बलिदानी संकेत को बनाए रखता है, पर उसे मूल से अधिक स्पष्ट धर्मवैज्ञानिक पहचान में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘बहुमूल्य लहू’, ‘दोषरहित’ और ‘निष्कलंक’ बलिदानी भाषा की गंभीरता तथा दोनों यूनानी विशेषणों का भेद बनाए रखते हैं। वाक्य पिछले पद पर निर्भर विरोधसूचक खंड है, इसलिए आरंभ में ‘बल्कि’ रखा गया है।
