  yaml_path: translation/nt/1_peter/001/025.yaml
  text: But the word of the Lord remains forever." And this is the word that was proclaimed as good news to you[a].
translation:
  language: hi
  text: परन्तु प्रभु का वचन सदा बना रहता है।” और यही वह वचन है, जो तुम्हें शुभ समाचार के रूप में सुनाया गया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह वचन जो तुम्हें सुसमाचार के रूप में प्रचारित किया गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥῆμα
  choice: वचन
  rationale: ‘वचन’ यशायाह 40:8 के उद्धरण की प्रतिध्वनि बनाए रखता है और दोनों उपवाक्यों में यूनानी शब्द की संगति सुरक्षित रखता है; यह यहाँ बोले या घोषित किए गए संदेश को भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: κυρίου
  choice: प्रभु का
  rationale: κυρίου संबंधकारक है और ‘प्रभु का’ उसका सीधा, प्रतिष्ठित तथा संप्रदाय-निरपेक्ष हिन्दी रूप है।
- source_word: μένει
  choice: बना रहता है
  rationale: यह μένω के निरंतर अस्तित्व और स्थायित्व के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह मुहावरा अनंत स्थायित्व बताता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τοῦτο δέ ἐστιν
  choice: और यही वह
  rationale: δέ के हल्के संक्रमण को ‘और’ व्यक्त करता है, जबकि ‘यही’ उद्धृत वचन और श्रोताओं को सुनाए गए शुभ समाचार के बीच स्पष्ट पहचान स्थापित करता है।
- source_word: τὸ ῥῆμα τὸ εὐαγγελισθὲν
  choice: वह वचन ... शुभ समाचार के रूप में सुनाया गया था
  rationale: यह εὐαγγελίζω के शुभ समाचार घोषित करने के शाब्दिक भाव को स्पष्ट रखता है और केवल पारिभाषिक ‘सुसमाचार’ पर निर्भर नहीं होता।
- source_word: εἰς ὑμᾶς
  choice: तुम्हें
  rationale: यह सुनाने की दिशा और पत्र के बहुवचन पाठकों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यशायाह 40:8 के उद्धरण में ‘प्रभु के वचन’ और पतरस द्वारा उसके शुभ समाचार से संबंध की पहचान
  choice: पहले उपवाक्य में ‘प्रभु का वचन’ रखा गया और दूसरे में उसी ‘वचन’ को पाठकों को सुनाए गए शुभ समाचार के रूप में पहचाना गया।
  alternative: दोनों स्थानों पर अधिक व्याख्यात्मक रूप से ‘प्रभु का संदेश’ कहना।
  rationale: ‘वचन’ शास्त्रीय उद्धरण की भाषा और उसके बाद के अनुप्रयोग की निरंतरता बचाता है, बिना उद्धरण और शुभ समाचार की घोषणा के संबंध को परिभाषात्मक व्याख्या में समेटे।
- issue: εὐαγγελισθέν का अनुवाद
  choice: ‘शुभ समाचार के रूप में सुनाया गया’
  alternative: ‘सुसमाचार के रूप में प्रचार किया गया’
  rationale: चुना हुआ रूप क्रिया के ‘शुभ समाचार सुनाने’ के अर्थ को साधारण आधुनिक पाठकों के लिए स्पष्ट करता है और यूनानी से परे कोई अतिरिक्त धर्मवैज्ञानिक आशय नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और शास्त्रीय संदर्भ के अनुकूल रूप। ‘परन्तु’ उद्धरण के भीतर δέ का विरोधसूचक संबंध बनाए रखता है; ‘तुम्हें’ मूल के बहुवचन संबोधन को हिन्दी की स्वाभाविक रीति से व्यक्त करता है।
