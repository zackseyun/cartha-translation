id: 1PE.1.3
reference: 1 Peter 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εὐλογητὸς ὁ θεὸς καὶ πατὴρ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, ὁ κατὰ τὸ πολὺ αὐτοῦ ἔλεος ἀναγεννήσας ἡμᾶς εἰς ἐλπίδα ζῶσαν δι’ ἀναστάσεως Ἰησοῦ Χριστοῦ ἐκ νεκρῶν,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/003.yaml
  text: Blessed be the God and Father of our Lord Jesus the Messiah[a], who according to his great mercy has caused us to be born again to a living hope through the resurrection of Jesus the Messiah from the dead[b],
translation:
  language: hi
  text: हमारे प्रभु यीशु मसीह के परमेश्वर और पिता की स्तुति हो! अपनी बड़ी दया के अनुसार उन्होंने यीशु मसीह के मरे हुओं में से जी उठने के द्वारा हमें फिर से जन्म दिया है, ताकि हमें जीवित आशा मिले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हमें फिर से जन्म दिया है—एक जीवित आशा के लिए।”'
    reason: मूल यूनानी में नए जन्म और जीवित आशा के बीच लक्ष्य या परिणाम का संक्षिप्त संबंध है; मुख्य पाठ इसे स्वाभाविक हिन्दी में खोलकर व्यक्त करता है।
lexical_decisions:
- source_word: Εὐλογητὸς
  choice: स्तुति हो
  rationale: यह विशेषण यहाँ स्तुतिपरक उद्घोषणा के रूप में प्रयुक्त है। ‘स्तुति हो’ आधुनिक हिन्दी में स्वाभाविक है और आराधनापूर्ण भाव व्यक्त करता है।
- source_word: ὁ θεὸς καὶ πατὴρ
  choice: परमेश्वर और पिता
  rationale: एक ही लेख दोनों संज्ञाओं को जोड़ता है। दोनों पदों को बनाए रखने से यूनानी की संबंधसूचक अभिव्यक्ति सुरक्षित रहती है।
- source_word: τοῦ κυρίου ἡμῶν
  choice: हमारे प्रभु
  rationale: κύριος को सम्मानसूचक संबोधन मात्र न मानकर उपाधि ‘प्रभु’ के रूप में रखा गया है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός अभिषिक्त जन की उपाधि है; हिन्दी में ‘मसीह’ इसे अर्थपूर्ण उपाधि के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: अपनी बड़ी दया के अनुसार
  rationale: κατά यहाँ मानक या अनुरूपता बताता है। यह रूप कारण को पूरी तरह नकारे बिना मूल की ‘के अनुसार’ वाली सूक्ष्मता बनाए रखता है।
- source_word: ἀναγεννήσας
  choice: हमें फिर से जन्म दिया है
  rationale: यह जन्म के बिंब और परमेश्वर की सक्रिय भूमिका दोनों को स्पष्ट रखता है। हिन्दी का पूर्ण पक्ष उस संपन्न कार्य के वर्तमान परिणाम को भी व्यक्त करता है।
- source_word: εἰς ἐλπίδα ζῶσαν
  choice: ताकि हमें जीवित आशा मिले
  rationale: εἰς यहाँ लक्ष्य या परिणाम व्यक्त करता है। हिन्दी में यह रूप स्वाभाविक है और नए जन्म से जीवित आशा की ओर संबंध स्पष्ट करता है।
- source_word: δι’ ἀναστάσεως
  choice: जी उठने के द्वारा
  rationale: διά के साथ संबंधकारक साधन या माध्यम बताता है; ‘के द्वारा’ उस अर्थ को स्पष्ट रखता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह पुनरुत्थान-संबंधी यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और समूह के बीच से उठने की छवि बनाए रखता है।
theological_decisions:
- issue: Χριστός को मसीही उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित है और Χριστός को केवल नाम का अंश बनाने के बजाय उसकी उपाधिगत शक्ति बनाए रखता है।
- issue: ἀναγεννήσας में परमेश्वर की सक्रिय भूमिका
  choice: उन्होंने ... हमें फिर से जन्म दिया है
  alternative: हमें नया जन्म मिला है
  rationale: यूनानी में परमेश्वर कर्ता हैं। चुना हुआ रूप इसी स्पष्ट कर्तृत्व को सुरक्षित रखता है, पर उससे आगे कोई सांप्रदायिक सिद्धांत नहीं जोड़ता।
- issue: εἰς ἐλπίδα ζῶσαν का लक्ष्य अथवा परिणाम
  choice: ताकि हमें जीवित आशा मिले
  alternative: जीवित आशा के लिए
  rationale: εἰς की लक्ष्य/परिणाम संबंधी व्यापकता को स्वाभाविक हिन्दी में व्यक्त किया गया है; इसे स्थानगत ‘आशा में’ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल रूप। ‘स्तुति हो’ आराधनापूर्ण उद्घोषणा को स्वाभाविक बनाता है; वाक्य को हिन्दी की पठनीयता के लिए दो वाक्यों में रखा गया है।
