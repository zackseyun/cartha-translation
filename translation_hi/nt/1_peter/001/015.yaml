  choice: जैसे तुम्हें बुलानेवाला पवित्र है, वैसे ही तुम भी … पवित्र बनो
  alternative: पवित्र बुलानेवाले के अनुसार तुम भी … पवित्र बनो
  rationale: ‘जैसे … वैसे ही’ मूल पाठ में बुलानेवाले और बुलाए गए लोगों की पवित्रता के बीच जानबूझकर रखी गई अनुरूपता को स्पष्ट करता है, बिना उसे किसी विशेष धर्मसैद्धान्तिक प्रणाली में बाँधे।
- issue: γενήθητε के आदेश का बल
  choice: पवित्र बनो
  alternative: पवित्र रहो
  rationale: ‘बनो’ यूनानी क्रिया के अवस्था में आने या उसे प्रकट करने के संभावित भाव को रखता है। पादटिप्पणी ‘रहो’ की सम्भावना बताती है, ताकि पवित्रीकरण की किसी विशिष्ट प्रक्रिया को अनिवार्य न किया जाए।
