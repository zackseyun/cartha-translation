- source_word: γενήθητε
  choice: बनो
  rationale: γίνομαι का यह आदेश किसी अवस्था में आने या उसे जीवन में प्रकट करने का भाव रख सकता है। ‘पवित्र बनो’ उस क्रियात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
