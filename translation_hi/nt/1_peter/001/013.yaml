source:
  edition: SBLGNT
  text: Διὸ ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν, νήφοντες τελείως, ἐλπίσατε ἐπὶ τὴν φερομένην ὑμῖν χάριν ἐν ἀποκαλύψει Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/013.yaml
  text: Therefore[a], having girded up the loins of your mind, being fully clear-minded[d][c][b], set your hope completely on the grace being brought to you at the revelation of Jesus the Messiah.
translation:
  language: hi
  text: इसलिए अपने मन की कमर कसकर[a] और सचेत रहते हुए, उस अनुग्रह पर अपनी आशा पूरी तरह टिकाओ[b], जो यीशु मसीह के प्रकट होने पर तुम्हारे पास लाया जा रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने मन की कमर कसकर”; अर्थात् अपने मन को कार्य के लिए तैयार करके।
    reason: रूपक का अर्थ स्पष्ट करना
  - marker: b
    text: या, “पूरी तरह सचेत रहते हुए, उस अनुग्रह पर अपनी आशा टिकाओ।” “पूरी तरह” को सचेत रहने या आशा टिकाने—दोनों में से किसी के साथ समझा जा सकता है।
    reason: मूल यूनानी की वाक्यरचनात्मक अस्पष्टता सुरक्षित रखना
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निष्कर्ष की ओर ले जाने वाले संबंध को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἀναζωσάμενοι τὰς ὀσφύας τῆς διανοίας ὑμῶν
  choice: अपनी बुद्धि की कमर कसकर
  rationale: यूनानी का सजीव शारीरिक रूपक सुरक्षित रहता है और हिन्दी का प्रचलित मुहावरा ‘कमर कसना’ कार्य के लिए मानसिक तैयारी का भाव समझने योग्य बनाता है।
- source_word: νήφοντες
  choice: सचेत रहते हुए
  rationale: यहाँ शब्द का प्रयोग आलंकारिक रूप से मानसिक स्पष्टता, संयम और चौकसी के लिए है; प्रसंग में मदिरा या नशे का सीधा विरोध नहीं है।
- source_word: τελείως
  choice: पूरी तरह
  rationale: क्रियाविशेषण की स्थिति के कारण इसे ‘सचेत रहते हुए’ अथवा मुख्य आज्ञा ‘आशा टिकाए रखो’ से जोड़ा जा सकता है; मुख्य पाठ और टिप्पणी इस अस्पष्टता को बनाए रखते हैं।
- source_word: ἐλπίσατε
  choice: अपनी आशा ... टिकाए रखो
  rationale: आज्ञार्थक क्रिया आशा को दृढ़ और उद्देश्यपूर्ण ढंग से अनुग्रह पर रखने की माँग करती है; यह हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ τὴν φερομένην ὑμῖν χάριν
  choice: उस अनुग्रह पर ... जो ... तुम्हारे पास लाया जा रहा है
  rationale: वर्तमान कर्मवाच्य कृदन्त का ‘लाया जा रहा है’ रूप सुरक्षित है और भविष्य में पूर्ण होने वाले अनुग्रह की वर्तमान गतिशीलता भी बनी रहती है।
- source_word: ἐν ἀποκαλύψει
  choice: प्रकट होने पर
  rationale: यह अभिव्यक्ति यहाँ यीशु मसीह के प्रकाशन से जुड़े समय को स्वाभाविक हिन्दी में बताती है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: हिन्दी में ‘मसीह’ स्वयं प्रचलित उपाधि है और Χριστός के मसीही पदनाम को ‘क्राइस्ट’ जैसे नाम-सदृश रूप में बदलने से बचाता है।
theological_decisions:
- issue: मानसिक तैयारी के रूपक को बनाए रखना या उसका अर्थ खोलकर कहना
  choice: मुख्य पाठ में ‘अपनी बुद्धि की कमर कसकर’ रूपक बनाए रखा गया।
  alternative: ‘अपने मन को काम के लिए तैयार करके’
  rationale: मूल यूनानी का देहात्मक और सजीव चित्र हिन्दी के ‘कमर कसना’ मुहावरे में समझने योग्य है; टिप्पणी उसका आशय स्पष्ट करती है।
- issue: τελείως किस क्रिया को विशेषित करता है
  choice: मुख्य पाठ में इसे ‘सचेत रहते हुए’ के पास रखा गया, साथ ही ‘आशा’ के साथ संबंध की संभावना टिप्पणी में दी गई।
  alternative: ‘अपनी आशा पूरी तरह ... टिकाओ’ के साथ ही जोड़ना
  rationale: यूनानी वाक्यरचना दोनों संबंधों की अनुमति देती है; किसी एक को निर्विवाद ठहराना मूल की वास्तविक अस्पष्टता को मिटा देगा।
- issue: Χριστοῦ का पदनाम
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: इस अंतकालीन प्रकाशन के प्रसंग में Χριστός की उपाधिगत शक्ति सुनाई देती है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय भाषा में स्वाभाविक और संप्रदाय-निरपेक्ष है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज संबोधन रखा गया है। ‘बुद्धि की कमर कसना’ मूल रूपक और स्वाभाविक हिन्दी मुहावरे के बीच संतुलन बनाता है। ‘सचेत’ मानसिक स्पष्टता और चौकसी व्यक्त करता है, बिना नशा-विरति का अनावश्यक अर्थ जोड़े।
