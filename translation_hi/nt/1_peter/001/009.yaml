review_pass:
  verdict: revise
  source_fidelity: κομιζόμενοι is well represented by the ongoing expression “प्राप्त कर रहे हैं,” and “उद्धार” appropriately renders σωτηρίαν. However, “प्रतिफल” can suggest a reward or recompense more strongly than τέλος in this context. “परिणाम” more directly conveys the realized outcome/result of faith. The appositional relation of “salvation of [your] souls” to the outcome is retained.
  naturalness: The sentence is clear and suitably dignified. Removing “इस प्रकार” avoids adding a specific inferential nuance not expressed by the Greek participle. The revised footnote for ψυχῶν is made idiomatic and avoids the misleading wording “स्वयं अपना उद्धार,” which could imply self-salvation rather than salvation of persons.
  terminology: “विश्वास,” “उद्धार,” and “प्राणों” are acceptable in this religious register. “प्राणों” preserves the breadth of ψυχῶν without forcing a strict body–soul distinction; the alternatives in the footnote preserve the lexical range.
  issues:
  - severity: medium
    issue: “प्रतिफल” may overstate τέλος as recompense or reward.
    rationale: τέλος here denotes the outcome, goal, or result attained through faith. “परिणाम” is more semantically direct and does not introduce a reward nuance.
  - severity: medium
    issue: Footnote b's alternative “स्वयं अपना उद्धार” is not an idiomatic rendering of “salvation of your persons” and may imply self-salvation.
    rationale: The alternative should identify ψυχῶν as “व्यक्तियों,” while maintaining that salvation is received, not self-achieved.
  - severity: low
    issue: “इस प्रकार” adds an inferential specification beyond the Greek wording.
    rationale: The participle can be linked naturally with “और” while leaving its precise contextual relationship unforced.
  revised_text: और आप अपने विश्वास का परिणाम[a]—अपने प्राणों का उद्धार[b]—प्राप्त कर रहे हैं।
