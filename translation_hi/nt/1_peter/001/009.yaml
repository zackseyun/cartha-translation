  text: as you receive the outcome of your faith[b][a], the salvation of your souls.
translation:
  language: hi
  text: और आप अपने विश्वास का परिणाम[a]—अपने प्राणों का उद्धार[b]—प्राप्त कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अन्त’, ‘लक्ष्य’ अथवा ‘परिणाम’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने जीवनों का उद्धार’ अथवा ‘अपने व्यक्तियों का उद्धार’। यूनानी शब्द सन्दर्भ के अनुसार ‘प्राणों’, ‘जीवनों’ या ‘व्यक्तियों’ को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κομιζόμενοι
  choice: प्राप्त कर रहे हैं
  rationale: वर्तमान कृदन्त का सतत भाव और विश्वास के फल को पा लेने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τέλος
  choice: प्रतिफल
  rationale: यहाँ केवल समयगत 'अन्त' नहीं, बल्कि विश्वास से प्राप्त होने वाला परिणाम अभिप्रेत है। 'प्रतिफल' उस सिद्ध परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: πίστεως
  choice: विश्वास
  rationale: इस सन्दर्भ में यह पाठकों के परमेश्वर पर विश्वास को सबसे स्वाभाविक रूप से दर्शाता है; 'विश्वासयोग्यता' या 'भरोसा' सम्भव शब्दार्थ हैं, पर यहाँ मुख्य पाठ के लिए कम उपयुक्त हैं।
- source_word: ὑμῶν
  choice: अपने
  rationale: यूनानी बहुवचन सम्बन्धवाचक सर्वनाम को हिन्दी में कर्ता-सापेक्ष 'अपने' से स्वाभाविक और स्पष्ट रूप में व्यक्त किया गया है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: पत्र के धार्मिक और भविष्याभिमुख सन्दर्भ में यह स्थापित, स्पष्ट और उपयुक्त हिन्दी पद है; 'छुटकारा' सम्भव है, पर यहाँ अर्थ की पूरी व्यापकता कम दर्शाता है।
- source_word: ψυχῶν
  choice: प्राणों
  rationale: ψυχή यहाँ 'प्राण', 'जीवन' या 'व्यक्ति' को सूचित कर सकता है। 'प्राणों' मूल अभिव्यक्ति की गरिमा और व्यापकता बनाए रखता है, बिना कठोर देह-आत्मा द्वैत आरोपित किए।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: ‘अपने विश्वास’ इस प्रसंग में पाठकों की विश्वासपूर्ण प्रतिक्रिया को सबसे सहज रूप से दर्शाता है। अन्य शब्दार्थों को अनावश्यक रूप से मुख्य पाठ में आरोपित नहीं किया गया।
- issue: ψυχῶν का मानव-सम्बन्धी आशय
  choice: प्राणों
  alternative: जीवनों; व्यक्तियों
  rationale: यह चयन यूनानी पद की परम्परागत और निकट अभिव्यक्ति सुरक्षित रखता है, पर पद को केवल शरीर से अलग किसी अमूर्त आत्मा के उद्धार तक सीमित नहीं करता; वैकल्पिक व्यापक अर्थ पाद-टिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज धार्मिक गद्य। ‘और इस प्रकार’ कृदन्त को पिछले प्रसंग से जोड़ता है। योजक डैश ‘अपने प्राणों का उद्धार’ को ‘प्रतिफल’ की व्याख्या के रूप में स्पष्ट करता है, जैसा यूनानी समानाधिकरण में है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
