base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/020.yaml
  text: He was foreknown before the foundation of the world[a], but was revealed at the end of the times for your sake[b],
translation:
  language: hi
  text: वह जगत की नींव रखे जाने से पहले से जाना गया था[a], परन्तु तुम्हारे लिए कालों के अन्त में प्रकट किया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहले से चुना गया था”; यूनानी में अर्थ है, “पहले से जाना गया था।” इससे परमेश्वर के उद्देश्य का संकेत मिल सकता है, पर मुख्य पाठ में इस अधिक विस्तृत व्याख्या को रखना आवश्यक नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “इन अन्तिम समयों में।”
    reason: alternative_reading
lexical_decisions:
- source_word: προεγνωσμένου
  choice: पहले ही जाना गया था
  rationale: यह अनुवाद προγινώσκω के मूल अर्थ ‘पहले से जानना’ को बनाए रखता है और मुख्य पाठ में ‘पहले से चुना गया’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ता। ‘ही’ सृष्टि से पहले की बात पर स्वाभाविक बल देता है।
- source_word: πρὸ καταβολῆς κόσμου
  choice: जगत की नींव डाले जाने से पहले
  rationale: यह यूनानी मुहावरे की पूर्व-सृष्टि समय-सूचना को स्पष्ट, गरिमापूर्ण और हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φανερωθέντος
  choice: प्रकट किया गया
  rationale: निष्क्रिय कृदन्त का अर्थ है कि उसे दृश्य या खुले रूप में प्रकट किया गया; यह अभिव्यक्ति उस निष्क्रियता और प्रकाशन के भाव, दोनों को सुरक्षित रखती है।
- source_word: ἐπ’ ἐσχάτου τῶν χρόνων
  choice: समयों के अन्त में
  rationale: यह मूल के बहुवचन ‘समयों’ और उसके युगान्त-संबंधी भाव को बनाए रखता है, बिना यूनानी में अनुपस्थित ‘इन’ शब्द को मुख्य पाठ में जोड़े।
- source_word: δι’ ὑμᾶς
  choice: तुम्हारे लिए
  rationale: यहाँ διά के साथ कर्मकारक लाभ या प्रयोजन व्यक्त करता है; ‘तुम्हारे लिए’ सामान्य आधुनिक हिन्दी में पाठकों के हित का भाव स्पष्ट करता है।
theological_decisions:
- issue: सृष्टि से पहले मसीह के विषय में προεγνωσμένου का अर्थ
  choice: मुख्य पाठ में ‘पहले ही जाना गया था’ रखा गया।
  alternative: ‘पहले से चुना गया था’ अथवा ‘पहले से ठहराया गया था’
  rationale: मूल शब्द पूर्वज्ञान को व्यक्त करता है और सन्दर्भ में ईश्वरीय उद्देश्य का संकेत दे सकता है, पर स्वयं अनिवार्य रूप से चुनाव या पूर्वनियति की पूरी धारणा नहीं बताता। इसलिए मूल की धर्मवैचारिक कसावट को खुला रखा गया है।
- issue: ἐπ’ ἐσχάτου τῶν χρόνων का काल-संबंधी बल
  choice: ‘समयों के अन्त में’
  alternative: ‘इन अन्तिम समयों में’
  rationale: चुना हुआ रूप मूल के निकट रहते हुए युगान्त-संबंधी काल को व्यक्त करता है; वैकल्पिक रूप अधिक सहज हो सकता है, पर उसमें ‘इन’ का संकेत जुड़ जाता है जो यूनानी में स्पष्ट रूप से नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘जगत’ और ‘प्रकट किया गया’ बाइबलीय सन्दर्भ के अनुकूल हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं। पद 19 के मसीह-संबंधी पूर्वपद को हिन्दी में स्पष्ट करने के लिए ‘वह’ रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
