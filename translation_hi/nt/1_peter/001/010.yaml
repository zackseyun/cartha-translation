  text: Περὶ ἧς σωτηρίας ἐξεζήτησαν καὶ ἐξηραύνησαν προφῆται οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/010.yaml
  text: Concerning this salvation[a], the prophets who prophesied about the grace for you searched and investigated carefully[b],
translation:
  language: hi
  text: इसी उद्धार के विषय में उन भविष्यद्वक्ताओं ने, जिन्होंने तुम्हारे लिए अनुग्रह[a] के विषय में भविष्यवाणी की थी, लगन से खोज की और गहराई से जाँच-पड़ताल की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लिए होने वाले अनुग्रह के विषय में।” भावी अर्थ प्रसंग से अनुमानित किया जा सकता है, पर इस पद में अलग से स्पष्ट नहीं कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Περὶ ἧς σωτηρίας
  choice: इसी उद्धार के विषय में
  rationale: περί सहित संबंधकारक विषय को सूचित करता है, और ἧς पिछले प्रसंग में बताए गए उद्धार की ओर संकेत करता है। ‘इसी उद्धार’ स्वाभाविक हिन्दी में उस पूर्वसंदर्भ को स्पष्ट रखता है।
- source_word: ἐξεζήτησαν καὶ ἐξηραύνησαν
  choice: बड़े यत्न से खोजबीन और जाँच-पड़ताल की
  rationale: दोनों क्रियाएँ परिश्रमी खोज और गहन जाँच का क्रमिक बल देती हैं। हिन्दी में दो अलग अभिव्यक्तियाँ रखने से मूल की पुनरुक्तिपूर्ण तीव्रता सुरक्षित रहती है।
- source_word: προφῆται
  choice: भविष्यद्वक्ताओं
  rationale: यह स्थापित बाइबलीय पद है और आगे का विशेषणात्मक कृदंत बताता है कि किन भविष्यद्वक्ताओं की बात हो रही है।
- source_word: οἱ περὶ τῆς εἰς ὑμᾶς χάριτος προφητεύσαντες
  choice: जिन्होंने तुम्हारे लिए होने वाले अनुग्रह के विषय में भविष्यवाणी की थी
  rationale: विशेषणात्मक कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य बनाया गया है। εἰς ὑμᾶς की दिशात्मक-लाभार्थक शक्ति ‘तुम्हारे लिए’ से व्यक्त होती है।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: इस उद्धार-संबंधी प्रसंग में χάρις परमेश्वर की कृपापूर्ण देन को दर्शाता है; ‘अनुग्रह’ इसका परिचित और गरिमापूर्ण हिन्दी प्रतिशब्द है।
theological_decisions:
- issue: εἰς ὑμᾶς χάριτος में भावी अर्थ को स्पष्ट करना
  choice: ‘तुम्हारे लिए होने वाले अनुग्रह’
  alternative: ‘तुम्हारे लिए अनुग्रह’ / ‘तुम तक आने वाले अनुग्रह’
  rationale: मूल पदबंध में अलग भावी क्रिया नहीं है, फिर भी भविष्यद्वक्ताओं की पिछली भविष्यवाणी और पाठकों के लिए उसके अभिप्रेत अनुग्रह का कालगत संबंध हिन्दी में केवल ‘तुम्हारे लिए अनुग्रह’ कहने पर अस्वाभाविक और अस्पष्ट होता है। ‘होने वाले’ प्रसंग से निहित भावी दृष्टि को व्यक्त करता है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, मध्यम औपचारिक और गरिमापूर्ण शैली। ‘खोजबीन और जाँच-पड़ताल’ साधारण पाठकों के लिए स्पष्ट है तथा यूनानी की दो समान लेकिन क्रमशः बलवती क्रियाओं को बनाए रखता है।
