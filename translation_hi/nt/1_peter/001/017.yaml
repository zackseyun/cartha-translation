source:
  edition: SBLGNT
  text: Καὶ εἰ πατέρα ἐπικαλεῖσθε τὸν ἀπροσωπολήμπτως κρίνοντα κατὰ τὸ ἑκάστου ἔργον, ἐν φόβῳ τὸν τῆς παροικίας ὑμῶν χρόνον ἀναστράφητε·
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/017.yaml
  text: And if you call as Father the one who judges impartially according to each person's work[c][b][a], conduct yourselves in fear during the time of your sojourn.
translation:
  language: hi
  text: और यदि तुम उसे पिता कहकर पुकारते हो[a], जो हर एक के काम के अनुसार बिना पक्षपात न्याय करता है, तो अपने परदेशी निवास के समय भय[c] के साथ जीवन बिताओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पिता के रूप में उसका नाम लेते हो।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने निर्वासन के समय।” यूनानी शब्द परदेशी या अस्थायी निवासी के रूप में जीवन बिताने को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “श्रद्धा के साथ” अथवा “श्रद्धामय विस्मय के साथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπικαλεῖσθε
  choice: पिता कहकर पुकारते हो
  rationale: मध्यवाच्य क्रिया यहाँ परमेश्वर को संबोधित करने या उसे पुकारने का भाव देती है; यह अनुवाद πατέρα के विधेयात्मक प्रयोग को भी स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πατέρα
  choice: पिता
  rationale: यह परमेश्वर के लिए संबोधन है; हिन्दी में बिना अनावश्यक अनिश्चितता जोड़े सीधा और स्वाभाविक रूप रखा गया है।
- source_word: ἀπροσωπολήμπτως
  choice: बिना पक्षपात
  rationale: यह बाहरी हैसियत या व्यक्ति का पक्ष किए बिना न्याय करने को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: κρίνοντα
  choice: न्याय करता है
  rationale: वर्तमान कृदंत परमेश्वर का निरंतर गुण बताता है; संबंधवाचक उपवाक्य में यह रूप स्वाभाविक है।
- source_word: κατὰ τὸ ἑκάστου ἔργον
  choice: हर एक के काम के अनुसार
  rationale: κατά मूल्यांकन के मानदंड को व्यक्त करता है और एकवचन ἔργον को सामूहिक अर्थ में रखते हुए व्यक्तिगत उत्तरदायित्व बचाता है।
- source_word: ἐν φόβῳ
  choice: भय में
  rationale: φόβος में भय, श्रद्धा और विस्मय की अर्थ-छायाएँ हो सकती हैं। मुख्य पाठ में ‘भय’ रखने से पिता और निष्पक्ष न्यायी के बीच का धर्मवैचारिक तनाव बना रहता है।
- source_word: παροικίας
  choice: परदेशी निवास
  rationale: यह किसी विदेशी या अस्थायी निवासी के रूप में रहने की अवस्था को दर्शाता है और राजनीतिक निर्वासन का अर्थ अनिवार्य नहीं बनाता।
- source_word: ἀναστράφητε
  choice: समय ... बिताओ
  rationale: संदर्भ में यह जीवन-व्यवहार का आदेश है। अवधि-वाचक χρόνον के साथ ‘समय ... बिताओ’ सहज हिन्दी है और पूरे समय के आचरण को समेटता है।
- source_word: τὸν τῆς παροικίας ὑμῶν χρόνον
  choice: अपने परदेशी निवास का समय
  rationale: यह अवधि और अस्थायी/परदेशी निवास—दोनों भावों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पिता के रूप में पुकारे जाने वाले परमेश्वर के संदर्भ में φόβος का अर्थ
  choice: मुख्य पाठ में ‘भय’
  alternative: ‘श्रद्धा’ या ‘श्रद्धामय विस्मय’
  rationale: पद परमेश्वर के पितृत्व को उसके निष्पक्ष न्याय से जोड़ता है। ‘भय’ नैतिक गंभीरता और निकटता तथा उत्तरदायित्व के तनाव को समय से पहले नरम नहीं करता।
- issue: काम के अनुसार न्याय का दायरा
  choice: ‘हर एक के काम के अनुसार’ का सीधा अनुवाद
  alternative: इसे विशेष रूप से विश्वासियों के अंतिम न्याय या केवल सामान्य दैवी मूल्यांकन के रूप में स्पष्ट करना
  rationale: यूनानी पाठ निष्पक्ष न्याय और व्यक्तिगत काम का संबंध बताता है, पर यहाँ योग्यता, उद्धार-निश्चय या न्याय की किसी संप्रदायगत व्याख्या को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए सहज रूप। ‘परदेशी निवास’ मूल के अस्थायी विदेशी-निवास के भाव को बचाता है; ‘भय’ जानबूझकर मुख्य पाठ में रखा गया है ताकि अर्थगत और धर्मवैचारिक तनाव बना रहे।
