language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κατὰ πρόγνωσιν θεοῦ πατρός, ἐν ἁγιασμῷ πνεύματος, εἰς ὑπακοὴν καὶ ῥαντισμὸν αἵματος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη.
base_translation:
  language: en
  yaml_path: translation/nt/1_peter/001/002.yaml
  text: 'according to the foreknowledge of God the Father[a], in the sanctification of the Spirit[c][b], for obedience and sprinkling with the blood of Jesus the Messiah: Grace to you and peace be multiplied.'
translation:
  language: hi
  text: परमेश्वर पिता के पूर्वज्ञान के अनुसार, आत्मा के पवित्र करने के काम में, आज्ञापालन और यीशु मसीह के लहू के छिड़काव के लिए—तुम्हें अनुग्रह और शान्ति बहुतायत से मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόγνωσιν
  choice: पूर्वज्ञान के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ और πρόγνωσις के मूल अर्थ को बनाए रखता है तथा पूर्वज्ञान और पूर्वचयन के बीच धर्मवैज्ञानिक विवाद का अनुवाद में निर्णय नहीं करता।
- source_word: θεοῦ πατρός
  choice: परमेश्वर पिता के
  rationale: दोनों संबंधकारकों का स्वाभाविक हिन्दी रूप है और पिता के रूप में परमेश्वर की पहचान सुरक्षित रखता है।
- source_word: ἐν ἁγιασμῷ πνεύματος
  choice: आत्मा के पवित्र करने के काम में
  rationale: ἁγιασμός को साधारण पाठक के लिए सुबोध क्रियात्मक हिन्दी में व्यक्त करता है; त्रिएक संरचना के कारण πνεῦμα को पवित्र आत्मा का संकेत मानते हुए 'आत्मा' लिखा गया है, पर संबंधकारक की कर्तृवाचक व्याख्या को अत्यधिक कठोर नहीं बनाया गया।
- source_word: εἰς ὑπακοὴν
  choice: आज्ञापालन ... के लिए
  rationale: εἰς के प्रयोजन अथवा परिणाम के भाव और ὑπακοή के अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: ῥαντισμὸν αἵματος
  choice: लहू के छिड़काव
  rationale: वाचा और शुद्धिकरण से जुड़ी बाइबलीय छवि को बनाए रखने के लिए ῥαντισμός का सीधा चित्रात्मक अनुवाद किया गया है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के
  rationale: Χριστός के पदवी-सूचक अर्थ को प्रचलित और गरिमापूर्ण हिन्दी 'मसीह' से व्यक्त करता है।
- source_word: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη
  choice: तुम्हें अनुग्रह और शान्ति बहुतायत से मिले
  rationale: optative आशीर्वचन को स्वाभाविक हिन्दी इच्छा-वाक्य में व्यक्त करता है; 'बहुतायत से' πληθυνθείη की वृद्धि/बहुगुणित होने की धारणा रखता है।
theological_decisions:
- issue: πρόγνωσις और चुनाव का संबंध
  choice: '''पूर्वज्ञान'' के रूप में तटस्थ अनुवाद'
  alternative: पूर्वनिर्धारण; पहले से किया गया चुनाव; केवल पूर्वदृष्टि
  rationale: यूनानी शब्द पूर्वज्ञान कहता है; अनुवाद यह तय नहीं करता कि इसमें केवल पहले से जानना, पहले से चुनना, या दोनों सम्मिलित हैं।
- issue: πνεύματος का संदर्भ
  choice: पवित्र आत्मा को सूचित करने वाला 'आत्मा'
  alternative: मानवीय आत्मा अथवा अवैयक्तिक आत्मिक दशा
  rationale: पिता, आत्मा और यीशु मसीह की त्रिपक्षीय संरचना पवित्र आत्मा के संदर्भ को प्रबल बनाती है।
- issue: Χριστοῦ का बल
  choice: मसीह
  alternative: ख्रीष्ट; क्राइस्ट
  rationale: यहाँ पदवी का अर्थ सुरक्षित रखते हुए हिन्दी का स्थापित मसीही शब्द प्रयुक्त हुआ है।
- issue: वाक्य में चुनाव का निहित कर्ता
  choice: पद 1 के निर्वासित चुने हुओं से संबंध स्पष्ट करने के लिए 'चुने गए हो' जोड़ा
  alternative: खंड को बिना क्रिया के रखना
  rationale: यूनानी में यह पद पिछले पद के ἐκλεκτοῖς को विशेषित करता है। स्वतंत्र पद के रूप में हिन्दी को पूर्ण और स्पष्ट बनाने के लिए वह संबंध व्यक्त किया गया है, बिना चुनाव की रीति पर अतिरिक्त दावा किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक बहुवचन के बजाय समुदाय को संबोधित सामान्य बाइबलीय 'तुम' शैली। 'लहू' बाइबलीय छवि के लिए परिचित और गरिमापूर्ण है। यह पद यूनानी में 1:1 से जुड़े लंबे वाक्य का अंश है; स्वतंत्र उद्धरण में अर्थपूर्ण पूर्णता के लिए 'चुने गए हो' व्यक्त किया गया है।
