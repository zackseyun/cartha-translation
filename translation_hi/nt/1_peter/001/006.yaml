  yaml_path: translation/nt/1_peter/001/006.yaml
  text: In this you rejoice[a], though now for a little while, if necessary, you have been grieved by various trials,
translation:
  language: hi
  text: इसी में तुम आनन्दित होते हो, यद्यपि अब थोड़े समय के लिए, यदि आवश्यक हो, तरह-तरह की परीक्षाओं[a] से तुम दुःखी हुए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कसौटियों’; यूनानी शब्द दूसरे संदर्भों में ‘प्रलोभनों’ का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: इसी में
  rationale: यह पिछले पदों में वर्णित उद्धार, जीवित आशा और विरासत के पूरे विचार की ओर संकेत कर सकता है। ‘इसी में’ संबंध की व्यापकता और यूनानी की कुछ अस्पष्टता बनाए रखता है; ‘इसी कारण’ कारण-संबंध को अधिक निश्चित कर देता।
- source_word: ἀγαλλιᾶσθε
  choice: तुम आनन्दित होते हो
  rationale: क्रिया प्रबल आनन्द को व्यक्त करती है। यह हिन्दी में स्वाभाविक और गरिमापूर्ण है; ‘अत्यन्त आनन्दित’ तीव्रता को अनावश्यक रूप से स्पष्ट कर सकता है।
- source_word: ὀλίγον ἄρτι
  choice: अब थोड़े समय के लिए
  rationale: यह वर्तमान समय और दुःख की अल्प अवधि—दोनों तत्वों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰ δέον
  choice: यदि आवश्यक हो
  rationale: यह शर्त और आवश्यकता दोनों को बिना किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- source_word: λυπηθέντες
  choice: तुम दुःखी हुए हो
  rationale: यूनानी कृदन्त दुःख का अनुभव करने को व्यक्त करता है। शाब्दिक कर्मवाच्य हिन्दी में अस्वाभाविक होता; यह रूप भाव को स्वाभाविक ढंग से रखता है और किसी अनिर्दिष्ट कर्ता को नहीं जोड़ता।
- source_word: ἐν ποικίλοις πειρασμοῖς
  choice: तरह-तरह की परीक्षाओं से
  rationale: संदर्भ में बाहरी कठिनाइयाँ और अगले पद में विश्वास का परखा जाना प्रमुख हैं। ‘से’ इन परीक्षाओं को दुःख की परिस्थिति अथवा कारण के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुःख के संदर्भ में πειρασμοῖς का अर्थ
  choice: परीक्षाओं
  alternative: परखों; प्रलोभनों
  rationale: अगला पद विश्वास के परखे जाने की बात करता है, इसलिए यहाँ ‘परीक्षाएँ’ बाहरी कठिनाइयों और परख की धारणा को सबसे अच्छी तरह समेटता है। फिर भी शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली रखी गई है। वाक्य की concessive संरचना को ‘यद्यपि’ से स्पष्ट किया गया है, जबकि मूल पाठ की शर्त और संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
