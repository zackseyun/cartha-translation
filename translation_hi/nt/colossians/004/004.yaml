  edition: SBLGNT
  text: ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/004.yaml
  text: so that I may make it clear[b][a], as I ought to speak.
translation:
  language: hi
  text: ताकि मैं उसे स्पष्ट करूँ[a], जैसा मुझे बोलना चाहिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे प्रकट करूँ” अथवा “उसे ज्ञात कराऊँ।” “उसे” पिछले पद में बताए गए रहस्य की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “जैसा मेरे लिए बोलना आवश्यक है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य प्रकट करता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक ढंग से प्रयोजन का भाव बनाए रखता है।
- source_word: φανερώσω
  choice: स्पष्ट रूप से प्रकट करूँ
  rationale: यह क्रिया किसी बात को प्रकट, ज्ञात या स्पष्ट करने का भाव रखती है। सन्दर्भ में पौलुस रहस्य की घोषणा की स्पष्टता और खुले प्रकटीकरण के लिए प्रार्थना चाहता है।
- source_word: αὐτὸ
  choice: उसे
  rationale: यूनानी सर्वनाम पिछले पद में बताए गए मसीह के रहस्य की ओर संकेत करता है। मुख्य पाठ में सर्वनाम रखने से मूल वाक्य-रचना और उसका संदर्भ-संबंध सुरक्षित रहता है।
- source_word: ὡς
  choice: जैसा
  rationale: यह यहाँ बोलने की रीति या अपेक्षित मानक बताता है; ‘जैसा’ संक्षिप्त और स्वाभाविक है।
- source_word: δεῖ
  choice: चाहिए
  rationale: यह आवश्यकता या दायित्व व्यक्त करता है। ‘चाहिए’ हिन्दी में इस दायित्व को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘अवश्य’ अधिक प्रबल विकल्प है।
- source_word: με
  choice: मुझे
  rationale: यूनानी में यह λαλῆσαι के कर्ता के रूप में कर्मकारक है; हिन्दी की ‘मुझे ... चाहिए’ रचना उसी अर्थ को स्वाभाविक रूप से देती है।
- source_word: λαλῆσαι
  choice: बोलना
  rationale: यह δεῖ के साथ प्रयुक्त क्रिया का अनन्त रूप है। ‘बोलना’ व्यापक और सीधा अर्थ रखता है; ‘प्रचार करना’ मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: αὐτό का पूर्वपद
  choice: मुख्य पाठ में ‘उसे’ रखा गया और टिप्पणी में उसका संबंध पिछले पद के ‘रहस्य’ से बताया गया।
  alternative: मुख्य पाठ में ‘उस रहस्य को’ लिखना।
  rationale: मूल यूनानी यहाँ संज्ञा को दोहराने के बजाय सर्वनाम रखता है; इसलिए मुख्य पाठ में सर्वनाम रखने से अनावश्यक व्याख्यात्मक विस्तार नहीं होता।
- issue: δεῖ में दायित्व की तीव्रता
  choice: ‘चाहिए’
  alternative: ‘अवश्य बोलना है’ या ‘बोलना ही है’
  rationale: δεῖ वास्तविक आवश्यकता या दायित्व व्यक्त करता है, पर इस छोटे वाक्यांश में उसकी तीव्रता को अत्यधिक बढ़ाना उचित नहीं। वैकल्पिक प्रबल अर्थ टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्पष्ट रूप से प्रकट करूँ’ घोषणा की बोधगम्यता तथा रहस्य को उजागर करने—दोनों निकटवर्ती भावों को समेटता है; टिप्पणियाँ मूल क्रिया और आवश्यकता-सूचक पद के वैकल्पिक अनुवाद सुरक्षित रखती हैं।
