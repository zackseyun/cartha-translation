  text: ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/006.yaml
  text: Let your speech always be with grace[a], seasoned with salt[b], so that you may know how you ought to answer each person.
translation:
  language: hi
  text: तुम्हारी बातचीत सदा अनुग्रहपूर्ण[a] और नमक से सुस्वादित[b] हो, ताकि तुम जान सको कि तुम्हें प्रत्येक व्यक्ति को किस प्रकार उत्तर देना चाहिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपापूर्ण।” इस पदबंध का अर्थ ऐसी बातचीत हो सकता है जिसमें कृपा, दयालुता और सद्भाव दिखाई दे।
    reason: lexical_alternative
  - marker: b
    text: “नमक से सुस्वादित” एक रूपक है—अर्थात ऐसी बातचीत जो नीरस या बिगाड़ने वाली न होकर उचित, रुचिकर और बुद्धिमत्तापूर्ण हो।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ λόγος ὑμῶν
  choice: तुम्हारी बातचीत
  rationale: यहाँ λόγος किसी एक शब्द या औपचारिक संदेश के बजाय विश्वासियों के बोलने के ढंग को सूचित करता है; ‘बातचीत’ उत्तर देने के आगामी संदर्भ में सहज और व्यापक है।
- source_word: πάντοτε
  choice: सदा
  rationale: यह समय की व्यापकता को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐν χάριτι
  choice: अनुग्रह से भरी
  rationale: यह वाणी के अनुग्रहपूर्ण और कृपालु गुण को व्यक्त करता है, साथ ही χάρις की पौलुसीय अनुगूँज को बनाए रखता है।
- source_word: ἅλατι ἠρτυμένος
  choice: नमक से स्वादिष्ट की हुई
  rationale: नमक के मूल रूपक और सिद्ध परिणामी गुण—बातचीत का उपयुक्त, प्रभावी और विवेकपूर्ण होना—दोनों को सुरक्षित रखता है। स्त्रीलिंग रूप ‘बातचीत’ से मेल खाता है।
- source_word: εἰδέναι
  choice: ताकि तुम जानो
  rationale: कठिन क्रियार्थक रूप को उद्देश्य अथवा परिणाम के रूप में प्रस्तुत करता है, पर इन दोनों के बीच संबंध को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: πῶς δεῖ
  choice: किस प्रकार ... चाहिए
  rationale: बोलने के उचित ढंग और प्रसंगानुकूल दायित्व को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἑνὶ ἑκάστῳ
  choice: हर एक व्यक्ति को
  rationale: 'यूनानी पदबंध के वितरणात्मक बल को बनाए रखता है: उत्तर प्रत्येक व्यक्ति के अनुरूप होना है।'
- source_word: ἀποκρίνεσθαι
  choice: उत्तर देना
  rationale: वार्तालाप के संदर्भ में क्रिया का सीधा और स्वाभाविक हिंदी समतुल्य है।
theological_decisions:
- issue: ἐν χάριτι में ‘अनुग्रह’ का आशय
  choice: अनुग्रह से भरी
  alternative: कृपापूर्ण / मधुर
  rationale: अनुवाद बोलचाल की दयालुता को व्यक्त करता है, पर χάρις को केवल शिष्टता या मधुरता तक सीमित नहीं करता।
- issue: εἰδέναι का पूर्ववर्ती उपदेश से संबंध
  choice: ताकि तुम जानो
  alternative: यह जानते हुए कि
  rationale: इसे उद्देश्य/परिणाम के रूप में पढ़ना संदर्भ में सहज है; ‘ताकि’ दोनों के बीच घनिष्ठ संबंध दिखाता है, यद्यपि यूनानी वाक्य-विन्यास में कुछ अस्पष्टता बनी हुई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘वार्तालाप’ की अपेक्षा ‘बातचीत’ सामान्य पाठक के लिए अधिक स्वाभाविक है। नमक का रूपक मुख्य पाठ में ज्यों का त्यों रखा गया है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
