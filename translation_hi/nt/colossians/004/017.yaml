source:
  edition: SBLGNT
  text: καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/017.yaml
  text: And tell Archippus[a], “See to the ministry that you received in the Lord, so that you may fulfill it.”
translation:
  language: hi
  text: और अरखिप्पुस से कहो, “उस सेवकाई पर ध्यान दो जो तुम्हें प्रभु में मिली है,[a] ताकि तुम उसे पूरा करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “जो सेवकाई तुम्हें प्रभु से मिली है।”
    reason: ἐν κυρίῳ को संबंध अथवा क्षेत्र के साथ-साथ प्रसंगतः स्रोत के अर्थ में भी समझा जा सकता है।
lexical_decisions:
- source_word: εἴπατε
  choice: कहो
  rationale: बहुवचन आज्ञार्थक रूप पूरी मंडली को संबोधित करता है; ‘अरखिप्पुस से कहो’ स्वाभाविक आधुनिक हिन्दी में इसकी आज्ञात्मक शक्ति बनाए रखता है।
- source_word: Ἀρχίππῳ
  choice: अरखिप्पुस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Βλέπε
  choice: ध्यान दो
  rationale: वर्तमानकालीन एकवचन आज्ञार्थक यहाँ सावधानी और निरंतर सजगता का भाव देता है; ‘ध्यान दो’ सहज और स्पष्ट है।
- source_word: διακονίαν
  choice: सेवकाई
  rationale: यह शब्द सौंपी गई मसीही सेवा या दायित्व को सूचित करता है; ‘सेवकाई’ किसी विशिष्ट पद को अनावश्यक रूप से निर्धारित किए बिना उस भाव को व्यक्त करता है।
- source_word: παρέλαβες
  choice: मिली है
  rationale: संदर्भ में किसी सौंपे या प्राप्त किए गए दायित्व का अर्थ है; हिन्दी में ‘तुम्हें ... मिली है’ स्वाभाविक है और स्वयं चुने हुए कार्य के बजाय प्राप्त जिम्मेदारी का भाव रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: ἐν का निकटतम अर्थ ‘में’ है। यह वाक्यांश संबंध, क्षेत्र अथवा प्रभु से जुड़े संदर्भ की वास्तविक अस्पष्टता को सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य का परिचय स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: πληροῖς
  choice: पूरा करो
  rationale: सेवकाई को पूर्ण रूप से निभाने या सम्पन्न करने का भाव देता है और हिन्दी में संक्षिप्त तथा सहज है।
theological_decisions:
- issue: ἐν κυρίῳ की अर्थ-छाया
  choice: मुख्य पाठ में ‘प्रभु में’
  alternative: ‘प्रभु से’
  rationale: यूनानी में ἐν है, न कि स्रोत को स्पष्ट रूप से बताने वाला παρά या ἀπό। इसलिए मुख्य पाठ मूल अभिव्यक्ति और उसकी संबंधपरक अस्पष्टता बनाए रखता है; संभावित स्रोतार्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। ‘सेवकाई’ कलीसियाई संदर्भ में बोधगम्य है और किसी विशिष्ट पद या संप्रदायगत संरचना को आरोपित नहीं करती। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
