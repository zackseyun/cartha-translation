reference: Colossians 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος ⸀Χριστοῦ, πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα ⸀σταθῆτε τέλειοι καὶ ⸀πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/012.yaml
  text: Epaphras[a], who is one of you, greets you—a servant of Messiah, always striving for you in his prayers[b], so that you may stand mature and fully assured in all the will of God.
translation:
  language: hi
  text: एपफ्रास, जो तुममें से एक है, तुम्हें नमस्कार कहता है। वह मसीह[a] का दास है और अपनी प्रार्थनाओं में तुम्हारे लिए सदा संघर्ष करता है, ताकि तुम परमेश्वर की पूरी इच्छा में परिपक्व और पूरी तरह आश्वस्त[b] होकर खड़े रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मसीह” का अर्थ “अभिषिक्त” है।
    reason: उपाधि के अनूदित अर्थ को स्पष्ट करना।
  - marker: b
    text: या “पूरी तरह निश्चय किए हुए” अथवा “पूरी तरह स्थापित।” यूनानी शब्द पूर्ण निश्चय या पूरी तरह स्थिर हो जाने की दशा को व्यक्त कर सकता है।
    reason: πεπληροφορημένοι की महत्वपूर्ण शाब्दिक और व्याख्यात्मक वैकल्पिकता सुरक्षित रखना।
lexical_decisions:
- source_word: ἀσπάζεται
  choice: नमस्कार कहता है
  rationale: पत्र के समापन में प्रयुक्त अभिवादन का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: ὁ ἐξ ὑμῶν
  choice: तुममें से एक
  rationale: यह बताता है कि एपफ्रास कुलुस्से के विश्वासियों के अपने समुदाय का सदस्य है।
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द केवल सेवा नहीं, बल्कि मसीह से संबंध, अधीनता और पूर्ण समर्पण का प्रबल भाव भी सुरक्षित रखता है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: मूल पाठ में केवल Χριστοῦ है, यीशु नाम नहीं; ‘मसीह’ यूनानी उपाधि का अर्थ सुरक्षित रखता है।
- source_word: ἀγωνιζόμενος
  choice: संघर्ष करता है
  rationale: यह चुनाव प्रार्थना में एपफ्रास के गहन और निरंतर परिश्रम को व्यक्त करता है।
- source_word: ἐν ταῖς προσευχαῖς
  choice: अपनी प्रार्थनाओं में
  rationale: बहुवचन बार-बार की जाने वाली मध्यस्थ प्रार्थनाओं को दर्शाता है; ‘अपनी’ से कर्ता हिन्दी में स्पष्ट होता है।
- source_word: ἵνα σταθῆτε
  choice: ताकि … खड़े रहो
  rationale: मूल की ‘खड़े होने’ की छवि सुरक्षित रखी गई है और ‘दृढ़’ जैसा अनुल्लिखित विशेषण नहीं जोड़ा गया।
- source_word: τέλειοι
  choice: परिपक्व
  rationale: इस पौलुसी संदर्भ में शब्द आत्मिक परिपक्वता या पूर्णता बताता है, निष्पाप सिद्धता आवश्यक रूप से नहीं।
- source_word: πεπληροφορημένοι
  choice: पूरी तरह आश्वस्त
  rationale: पूर्ण निश्चय की दशा इसका सामान्य प्रासंगिक अर्थ है; स्थापित होने की संभावित छाया पादटिप्पणी में रखी गई है।
- source_word: ἐν παντὶ θελήματι τοῦ θεοῦ
  choice: परमेश्वर की पूरी इच्छा में
  rationale: यह अपेक्षाकृत औपचारिक रूप मूल के व्यापक वाक्यांश को सुरक्षित रखता है और इसे केवल ‘के अनुसार’ या ‘के विषय में’ मानकर अर्थ सीमित नहीं करता।
theological_decisions:
- issue: δοῦλος Χριστοῦ का अनुवाद
  choice: मसीह का दास
  alternative: मसीह का सेवक
  rationale: ‘दास’ मसीह से पूर्ण संबंध और अधीनता की शक्ति को सुरक्षित रखता है; मूल पाठ में ‘यीशु’ नहीं जोड़कर केवल Χριστός का अनुवाद किया गया है।
- issue: Χριστός को उपाधि मानना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ हिन्दी में स्थापित रूप है और ‘अभिषिक्त जन’ की उपाधि का अर्थ वहन करता है; स्पष्टीकरण पादटिप्पणी में दिया गया है।
- issue: πεπληροφορημένοι का अर्थ
  choice: पूरी तरह आश्वस्त
  alternative: पूरी तरह स्थापित
  rationale: मुख्य पाठ पूर्ण निश्चय का प्रचलित अर्थ अपनाता है, पर शब्द की स्थिर/स्थापित दशा वाली सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: ἐν παντὶ θελήματι τοῦ θεοῦ में संबंध
  choice: परमेश्वर की पूरी इच्छा में
  alternative: परमेश्वर की पूरी इच्छा के अनुसार
  rationale: ‘में’ मूल पूर्वसर्ग की व्यापकता बनाए रखता है और क्षेत्र, विषय या अनुरूपता के बीच की सम्भावित अर्थ-छाया को अनावश्यक रूप से तय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘संघर्ष करता है’ मूल की तीव्रता रखता है; ‘खड़े रहो’ मूल रूपक को बनाए रखता है। वाक्य को पठनीयता के लिए दो मुख्य वाक्यों में बाँटा गया है, पर मूल के संबंध सुरक्षित हैं।
