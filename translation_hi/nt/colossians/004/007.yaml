base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/007.yaml
  text: Tychicus[a], the beloved brother and faithful minister and fellow servant in the Lord[c][b], will make known to you everything about me.
translation:
  language: hi
  text: तुखिकुस, जो प्रिय भाई, विश्वासयोग्य सेवक[a] और प्रभु में सह-दास[b] है, मेरे विषय में सब कुछ तुम्हें बताएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेवक’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘सेवकाई करने वाला’ या ‘सेवक’ भी हो सकता है और कुछ संदर्भों में कलीसिया का पद ‘डीकन’ भी।
    reason: lexical_alternative
  - marker: b
    text: या ‘सह-सेवक’। ‘सह-दास’ के मूल यूनानी शब्द में एक ही स्वामी के अधीन दास के रूप में साथ सेवा करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὰ κατ’ ἐμὲ πάντα
  choice: मेरे बारे में सारी बातें
  rationale: यह यूनानी मुहावरा पौलुस की दशा, परिस्थितियों और उससे संबंधित मामलों को व्यापक रूप से समेटता है; यह रूप स्वाभाविक हिंदी में πάντα की समग्रता बनाए रखता है।
- source_word: γνωρίσει ὑμῖν
  choice: तुम्हें बताएगा
  rationale: γνωρίζω का भाव किसी बात से अवगत कराना है। हिंदी में ‘तुम्हें बताएगा’ निकट, स्पष्ट और स्वाभाविक है।
- source_word: Τυχικὸς
  choice: तुखिकुस
  rationale: यूनानी नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: ὁ ἀγαπητὸς ἀδελφὸς
  choice: प्रिय भाई
  rationale: ἀγαπητός की आत्मीयता और ἀδελφός के एकवचन पुल्लिंग संदर्भ को सहज, गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: πιστὸς διάκονος
  choice: विश्वासयोग्य सेवक
  rationale: यहाँ διάκονος अनिवार्य रूप से कलीसियाई पद ‘डीकन’ नहीं दर्शाता; ‘सेवक’ अर्थगत अस्पष्टता बनाए रखता है और πιστός को ‘विश्वासयोग्य’ स्पष्ट रूप से व्यक्त करता है।
- source_word: σύνδουλος
  choice: सह-दास
  rationale: σύνδουλος साझा दासत्व अथवा एक ही स्वामी के अधीन सेवा का भाव रखता है। ‘सह-दास’ इस बंधी हुई अधीनता को ‘सह-सेवक’ से अधिक स्पष्ट रखता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: यह पौलुसी पदबंध प्रभु से संबंध अथवा उसके भीतर जीवन और सेवा के क्षेत्र को दर्शाता है; शाब्दिक रूप इसकी धर्मवैचारिक व्यापकता सुरक्षित रखता है।
theological_decisions:
- issue: σύνδουλος में दासत्व और सेवा का संबंध
  choice: सह-दास
  alternative: सह-सेवक
  rationale: मूल शब्द δοῦλος से बने σύνδουλος में एक ही प्रभु के स्वामित्व और अधीनता में सहभागी होने का बल है। मुख्य पाठ में ‘सह-दास’ इस तीखेपन को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक सहज विकल्प देती है।
- issue: διάκονος पद है या सामान्य सेवा-संज्ञा
  choice: सेवक
  alternative: सेवकाई करनेवाला; डीकन
  rationale: इस संदर्भ में किसी औपचारिक कलीसियाई पद को निश्चित करना संभव नहीं है। इसलिए व्यापक ‘सेवक’ चुना गया है और संभावित अर्थ पादटिप्पणी में रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी, आत्मीय किंतु गरिमापूर्ण शैली। वाक्य-विन्यास को हिंदी की स्वाभाविकता के अनुसार दो वाक्यों में रखा गया है। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है।
