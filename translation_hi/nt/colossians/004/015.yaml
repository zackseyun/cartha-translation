  text: ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ ⸂Νύμφαν καὶ τὴν κατ’ οἶκον αὐτῆς⸃ ἐκκλησίαν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/015.yaml
  text: Greet the brothers in Laodicea[a], and Nympha and the church in her house.
translation:
  language: hi
  text: लौदीकिया में भाइयों को, नुम्फा को, और उसके घर में मिलने वाली कलीसिया को नमस्कार कहना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “नुम्फास” और “उसके घर में मिलने वाली कलीसिया” है; अन्य में “उनके घर में मिलने वाली कलीसिया” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: यह बहुवचन आज्ञार्थक क्रिया है और अभिवादन पहुँचाने की सीधी आज्ञा देती है। आधुनिक हिन्दी में ‘नमस्कार कहना’ स्वाभाविक और स्पष्ट है।
- source_word: τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς
  choice: लौदीकिया में जो भाई-बहन हैं
  rationale: ἀδελφοὺς व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, पर पौलुस के पत्रों में प्रायः मसीही समुदाय के स्त्री-पुरुष दोनों को समावेशी रूप से संबोधित करता है; ‘भाई-बहन’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Νύμφαν
  choice: नुम्फा
  rationale: SBLGNT का Νύμφαν स्त्रीलिंग नाम ‘नुम्फा’ के रूप में सबसे सीधे समझा जाता है। अन्य पाठों में पुरुष नाम ‘नुम्फास’ की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: τὴν κατ’ οἶκον αὐτῆς ἐκκλησίαν
  choice: उसके घर में मिलने वाली कलीसिया
  rationale: κατ’ οἶκον उस समुदाय को सूचित करता है जो किसी के घर में एकत्र होता था। ‘मिलने वाली’ मुहावरे का आशय स्पष्ट करती है, जबकि αὐτῆς का स्त्रीलिंग एकवचन ‘उसके’ में संदर्भ से बना रहता है।
- source_word: ἐκκλησίαν
  choice: कलीसिया
  rationale: इस पौलिनी संदर्भ में ἐκκλησία मसीही विश्वासियों की एकत्र मंडली है; ‘कलीसिया’ हिन्दी बाइबलीय प्रयोग में स्थापित और यहाँ संदर्भानुकूल है।
theological_decisions:
- issue: Νύμφαν की पहचान/लिंग और संबंधित सर्वनाम
  choice: नुम्फा ... उसके घर में
  alternative: नुम्फास ... उसके घर में; अथवा नुम्फा ... उनके घर में
  rationale: मुद्रित SBLGNT पाठ में स्त्रीलिंग एकवचन αὐτῆς है, इसलिए मुख्य पाठ नुम्फा और उसके घर का अनुसरण करता है। पांडुलिपीय भिन्नताओं में पुरुषवाचक और बहुवचन संभावनाएँ हैं, जिन्हें चुपचाप हटाने के बजाय पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भाई-बहन’ सामान्य पाठक के लिए पौलिनी संबोधन का समावेशी आशय स्पष्ट करता है। ‘कलीसिया’ स्थापित धार्मिक शब्दावली को बनाए रखता है, और ‘घर में मिलने वाली’ प्राचीन गृह-मंडली के आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
