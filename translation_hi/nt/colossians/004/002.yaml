lexical_decisions:
- source_word: Τῇ προσευχῇ
  choice: प्रार्थना में
  rationale: सव्यय दत्तिवाचक पद यहाँ किसी एक विशिष्ट प्रार्थना के बजाय प्रार्थना के अभ्यास को दर्शाता है; हिंदी में ‘प्रार्थना में’ स्वाभाविक है।
- source_word: προσκαρτερεῖτε
  choice: लगे रहो
  rationale: वर्तमानकालीन आज्ञार्थक क्रिया निरंतर दृढ़ता और समर्पण का भाव रखती है। ‘लगे रहो’ सामान्य आधुनिक हिंदी में इस सतत अभ्यास को स्पष्ट करता है।
- source_word: γρηγοροῦντες
  choice: जागते रहो
  rationale: यह कृदंत मुख्य आज्ञा के साथ चलने वाली सतर्कता बताता है। ‘जागते रहो’ प्रार्थना में आत्मिक सजगता का अर्थ रखता है, मात्र शारीरिक रूप से न सोने का नहीं।
- source_word: ἐν αὐτῇ
  choice: उसमें
  rationale: स्त्रीलिंग सर्वनाम का स्वाभाविक पूर्वपद ‘प्रार्थना’ है; ‘उसमें’ यूनानी पाठ की संदर्भसूचक संरचना बनाए रखता है।
- source_word: ἐν εὐχαριστίᾳ
  choice: धन्यवाद देते हुए
  rationale: यह पद प्रार्थनापूर्ण सतर्कता के साथ रहने वाला कृतज्ञ भाव बताता है। क्रियात्मक हिंदी अभिव्यक्ति सहज और अर्थपूर्ण है।
