reference: Colossians 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/009.yaml
  text: together with Onesimus[a], the faithful and beloved brother, who is one of you[b]. They will make known to you everything here.
translation:
  language: hi
  text: उसके साथ उनेसिमुस भी है, जो विश्वासयोग्य और प्रिय भाई है और तुममें से एक है[a]। यहाँ की सारी बातें[b] वे तुम्हें बता देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हारे यहाँ का है।”
    reason: ἐξ ὑμῶν मूल स्थान या समुदाय से संबंध को व्यक्त कर सकता है।
  - marker: b
    text: या, “यहाँ के सब मामले।”
    reason: τὰ ὧδε यहाँ की बातों, मामलों, या परिस्थितियों के व्यापक अर्थ को सूचित करता है।
lexical_decisions:
- source_word: σὺν Ὀνησίμῳ
  choice: उसके साथ उनेसिमुस भी
  rationale: σύν साथ होने या संगति को व्यक्त करता है। प्रसंग में ‘उसके’ का संकेत पिछले पद के तुखिकुस की ओर है; ‘भी’ हिंदी में इस जुड़ाव को स्वाभाविक बनाता है। नाम Ὀνήσιμος का प्रचलित हिंदी लिप्यंतरण ‘उनेसिमुस’ रखा गया है।
- source_word: πιστῷ καὶ ἀγαπητῷ ἀδελφῷ
  choice: विश्वासयोग्य और प्रिय भाई
  rationale: πιστός यहाँ भरोसेमंद या निष्ठावान होने का भाव रखता है; ‘विश्वासयोग्य’ इस अर्थ और परिचित मसीही प्रयोग दोनों को बनाए रखता है। ἀγαπητός के लिए ‘प्रिय’ सहज और गरिमापूर्ण है, और ἀδελφός को बिना व्याख्यात्मक विस्तार के ‘भाई’ रखा गया है।
- source_word: ὅς ἐστιν ἐξ ὑμῶν
  choice: जो ... तुममें से ही एक है
  rationale: ἐξ ὑμῶν मूल या समुदाय से संबंध—दोनों का संकेत दे सकता है। ‘तुममें से ही एक’ आधुनिक हिंदी में स्वाभाविक है और उनेसिमुस की कुलुस्से समुदाय से संबद्धता व्यक्त करता है, बिना उसके सामाजिक दर्जे के बारे में कुछ जोड़े।
- source_word: πάντα ... τὰ ὧδε
  choice: यहाँ की सारी बातें
  rationale: यह पदबंध पौलुस के वर्तमान स्थान से संबंधित सभी बातों या परिस्थितियों को समग्र रूप से दर्शाता है। ‘यहाँ की सारी बातें’ यूनानी की संक्षिप्तता और व्यापकता को सुरक्षित रखता है।
- source_word: γνωρίσουσιν
  choice: बता देंगे
  rationale: γνωρίζω का अर्थ किसी बात को ज्ञात कराना या सूचित करना है। ‘बता देंगे’ सरल, वर्तमान हिंदी में स्वाभाविक है और बहुवचन कर्ता को स्पष्ट रखता है।
theological_decisions:
- issue: ἀδελφῷ का कलीसियाई पारिवारिक अर्थ
  choice: भाई
  alternative: विश्वास में भाई / सहविश्वासी
  rationale: संदर्भ में यह संगी विश्वासी को सूचित करता है, पर मूल पाठ केवल ‘भाई’ कहता है। इसलिए पारिवारिक कलीसियाई भाषा को बनाए रखते हुए व्याख्यात्मक शब्द नहीं जोड़े गए।
- issue: ἐξ ὑμῶν का संबंधसूचक बल
  choice: तुममें से ही एक है
  alternative: तुम्हारे यहाँ का है / तुममें से है
  rationale: चुना हुआ रूप उनेसिमुस को कुलुस्से के विश्वासियों के समुदाय से जोड़ता है, किंतु फिलेमोन पत्र से उसके सामाजिक या कानूनी दर्जे की कोई अतिरिक्त धारणा इस पद में नहीं लाता।
- issue: τὰ ὧδε का आशय
  choice: यहाँ की सारी बातें
  alternative: यहाँ जो कुछ हो रहा है
  rationale: वैकल्पिक रूप घटनाओं पर अधिक स्पष्ट बल देता, जबकि यूनानी पदबंध व्यापक रूप से स्थानीय मामलों या परिस्थितियों को सूचित कर सकता है। चुना हुआ रूप उस व्यापकता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए ‘उसके साथ’ पिछले पद के तुखिकुस को संदर्भित करता है। ‘प्रिय भाई’ मसीही पत्र-शैली की आत्मीयता बनाए रखता है, जबकि ‘बता देंगे’ सामान्य पाठक के लिए ‘ज्ञात कराएँगे’ से अधिक स्वाभाविक है।
