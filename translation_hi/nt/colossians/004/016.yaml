  text: καὶ ὅταν ἀναγνωσθῇ παρ’ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ ⸀Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/016.yaml
  text: And when this letter has been read among you[a], see that it is also read in the church of the Laodiceans[b], and that you also read the one from Laodicea.
translation:
  language: hi
  text: और जब यह पत्र तुम्हारे बीच पढ़ा जाए, तो सुनिश्चित करो कि यह लौदीकिया की कलीसिया में भी पढ़ा जाए; और तुम भी लौदीकिया से पत्र[a] पढ़ो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में यहाँ ‘पत्र’ शब्द प्रसंग से निहित है; शाब्दिक रूप से ‘लौदीकिया से’ है। यह किस पत्र की बात है, निश्चित नहीं है। संभव है कि आशय उस समय लौदीकिया में मौजूद या वहाँ से भेजे गए किसी पत्र से हो, न कि अनिवार्य रूप से लौदीकिया को संबोधित किसी पत्र से।
    reason: lexical_alternative_and_historical_uncertainty
lexical_decisions:
- source_word: ἀναγνωσθῇ / ἀναγνῶτε
  choice: पढ़ लिया जाए / पढ़ना
  rationale: ἀναγινώσκω का मूल अर्थ ‘पढ़ना’ है। यहाँ सामुदायिक सभा में पढ़ना संदर्भ से स्पष्ट है, पर ‘सुनाकर’ या ‘सार्वजनिक रूप से’ मूल पाठ में अलग से नहीं कहा गया।
- source_word: παρ’ ὑμῖν
  choice: तुम्हारे बीच
  rationale: παρά के साथ दत्तिव यहाँ कुलुस्से के विश्वासियों के समुदाय में पत्र पढ़े जाने का स्थान-सामाजिक भाव देता है; ‘तुम्हारे बीच’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἡ ἐπιστολή
  choice: यह पत्र
  rationale: निश्चित उपपद वर्तमान पत्र की ओर संकेत करता है। हिन्दी में ‘यह पत्र’ संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ποιήσατε ἵνα
  choice: यह भी सुनिश्चित करना कि
  rationale: यह रचना अपेक्षित कार्य को पूरा कराने की आज्ञा देती है। ‘सुनिश्चित करना कि’ आज्ञार्थक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐν τῇ Λαοδικέων ἐκκλησίᾳ
  choice: लौदीकिया की कलीसिया में
  rationale: ἐκκλησία के लिए पौलुस के पत्रों में प्रचलित हिन्दी बाइबलीय शब्द ‘कलीसिया’ रखा गया है; स्थाननाम के साथ यह वाक्यांश सहज है।
- source_word: τὴν ἐκ Λαοδικείας
  choice: लौदीकिया से आया पत्र
  rationale: यूनानी में ‘पत्र’ प्रसंग से निहित है और ἐκ का सामान्य अर्थ ‘से’ है। हिन्दी में निहित संज्ञा को व्यक्त करना स्पष्टता के लिए आवश्यक है, जबकि टिप्पणी मूल की संक्षिप्तता और संदर्भ की अनिश्चितता बताती है।
theological_decisions:
- issue: ‘लौदीकिया से’ आए पत्र की पहचान
  choice: इसे किसी ज्ञात प्रामाणिक या गैर-प्रामाणिक पत्र से पहचाने बिना ‘लौदीकिया से आया पत्र’ कहा गया है।
  alternative: इसे लौदीकिया को लिखा पौलुस का पत्र, लौदीकिया में मौजूद कोई पत्र, या इफिसियों जैसे किसी परिपत्र के रूप में पहचानना।
  rationale: यूनानी पाठ केवल लौदीकिया से उसके संबंध को बताता है; वह उस पत्र की पहचान या मूल प्राप्तकर्ताओं को निश्चित नहीं करता। इसलिए ऐतिहासिक या धर्मवैज्ञानिक अनुमान को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कलीसिया’ हिन्दी बाइबल पाठकों के लिए परिचित सामुदायिक शब्द है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है; ‘तुम्हारे बीच’ सामूहिक पठन का संकेत देता है, बिना मूल से अधिक स्पष्ट ‘सार्वजनिक रूप से’ जोड़ने के।
