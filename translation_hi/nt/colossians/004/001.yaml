source:
  edition: SBLGNT
  text: οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν ⸀οὐρανῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/001.yaml
  text: Masters[a], provide your servants with what is right and fair, knowing that you also have a Lord in heaven.
translation:
  language: hi
  text: हे स्वामियो, अपने दासों के साथ न्यायपूर्ण और निष्पक्ष[a] व्यवहार करो, यह जानते हुए कि स्वर्ग में तुम्हारा भी एक प्रभु है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय और समानता।” यहाँ ‘निष्पक्ष’ के लिए अनूदित यूनानी शब्द का अर्थ “समानता,” “निष्पक्षता” या “न्यायोचित व्यवहार” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ κύριοι
  choice: हे स्वामियो
  rationale: गृहस्थी-संबंधी इस प्रसंग में यह संबोधन दासों पर अधिकार रखने वाले मानवीय स्वामियों के लिए है। ‘हे स्वामियो’ संबोधन का रूप और सामाजिक संबंध दोनों स्पष्ट रखता है।
- source_word: τὸ δίκαιον
  choice: जो उचित
  rationale: विशेषण का संज्ञात्मक प्रयोग उस व्यवहार को दर्शाता है जो सही या न्यायपूर्ण है। ‘जो उचित’ आधुनिक हिन्दी में सहज है और नैतिक अपेक्षा को स्पष्ट करता है।
- source_word: τὴν ἰσότητα
  choice: न्यायसंगत
  rationale: ἰσότης का अर्थ समानता, निष्पक्षता अथवा न्यायोचित व्यवहार हो सकता है। प्रसंग में ‘न्यायसंगत’ स्वामियों से अपेक्षित उचित व्यवहार को स्वाभाविक हिन्दी में व्यक्त करता है; ‘समानता’ की महत्त्वपूर्ण शाब्दिक संभावना पादटिप्पणी में रखी गई है।
- source_word: τοῖς δούλοις
  choice: अपने दासों को
  rationale: यहाँ स्वामी-दास का सामाजिक संबंध स्पष्ट है, इसलिए ‘दास’ बंधन की वास्तविक स्थिति को ‘सेवक’ की अपेक्षा अधिक ठीक ढंग से व्यक्त करता है। ‘अपने’ हिन्दी में संबोधित स्वामियों और उनके अधीन दासों का संबंध स्वाभाविक रूप से स्पष्ट करता है।
- source_word: παρέχεσθε
  choice: दो
  rationale: क्रिया का आशय उपलब्ध कराने या प्रदान करने की आज्ञा है। ‘दो’ सरल, प्रत्यक्ष और स्वाभाविक हिन्दी है तथा ‘उचित और न्यायसंगत’ व्यवहार को देने की बात स्पष्ट करता है।
- source_word: εἰδότες
  choice: यह जानते हुए
  rationale: यह कृदन्त आज्ञा के साथ रहने वाली चेतना और उसके आधार दोनों को खुला रखता है; ‘यह जानते हुए’ मूल संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: καὶ ὑμεῖς
  choice: तुम्हारा भी
  rationale: ‘भी’ इस बात पर बल देता है कि सांसारिक स्वामी स्वयं भी एक उच्चतर प्रभु के अधीन हैं।
- source_word: κύριον
  choice: एक प्रभु
  rationale: ‘प्रभु’ इस स्वर्गीय पदवी का धार्मिक भार बनाए रखता और इसे पहले संबोधित मानवीय ‘स्वामियों’ से अलग करता है। अनिर्दिष्ट संज्ञा की संरचना को ‘एक’ से व्यक्त किया गया है, बिना प्रभु की पहचान को अस्पष्ट बनाने के उद्देश्य से।
- source_word: ἐν οὐρανῷ
  choice: स्वर्ग में
  rationale: यह एकवचन यूनानी पदबंध का मानक, स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: गृहस्थी-संबंधी प्रसंग में δοῦλοι का अनुवाद
  choice: दासों
  alternative: सेवकों; बंधुआ सेवकों
  rationale: स्वामियों के साथ सीधा संबंध दासत्व की सामाजिक और कानूनी स्थिति को प्रमुख बनाता है। ‘सेवक’ इसे अनावश्यक रूप से नरम कर सकता है, जबकि ‘बंधुआ सेवक’ कम सहज है।
- issue: ἰσότητα का अर्थ
  choice: न्यायसंगत
  alternative: समानता; निष्पक्षता
  rationale: यह शब्द समानता और न्यायोचित या निष्पक्ष व्यवहार दोनों का अर्थ दे सकता है। मुख्य पाठ में प्रसंगानुकूल सहज हिन्दी रखी गई है, पर ‘समानता’ की अर्थपूर्ण संभावना पादटिप्पणी में सुरक्षित है।
- issue: मानवीय κύριοι और स्वर्गीय κύριον का संबंध
  choice: स्वामियो ... एक प्रभु
  alternative: मालिको ... एक स्वामी
  rationale: अलग हिन्दी शब्द मानवीय अधिकार और स्वर्गीय प्रभुता के बीच भेद स्पष्ट करते हैं, जबकि ‘भी’ के द्वारा मूल का अधिकार-संबंधी उलटाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘हे स्वामियो’ संबोधन मूल के प्रत्यक्ष आग्रह को बनाए रखता है; ‘दास’ ऐतिहासिक सामाजिक स्थिति को नरम नहीं करता। वाक्य में ‘यह जानते हुए’ यूनानी कृदन्त की खुली तार्किक भूमिका को सुरक्षित रखता है।
