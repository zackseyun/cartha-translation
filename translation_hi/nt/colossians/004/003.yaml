  text: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, δι’ ὃ καὶ δέδεμαι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/003.yaml
  text: while also praying for us[a], that God may open to us a door for the word, to speak the mystery of Messiah, because of which I am also bound[d][c][b],
translation:
  language: hi
  text: और साथ ही हमारे लिए भी प्रार्थना करते रहो कि परमेश्वर हमारे लिए वचन के लिए एक द्वार खोल दे, ताकि हम मसीह के रहस्य के बारे में कह सकें, जिसके कारण मैं भी बँधा हुआ हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वचन के लिए एक द्वार” का अर्थ वचन सुनाने का मार्ग या अवसर है। “बँधा हुआ हूँ” का अनुवाद “कैद में हूँ” या “जंजीरों में हूँ” भी किया जा सकता है।
    reason: θύραν τοῦ λόγου के रूपक तथा δέδεμαι के प्रसंगगत विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: προσευχόμενοι ἅμα καὶ περὶ ἡμῶν
  choice: और साथ ही हमारे लिए भी प्रार्थना करते रहो
  rationale: वर्तमान कृदंत पिछले पद के प्रार्थना-संबंधी आग्रह को आगे बढ़ाता है। हिंदी में निरंतर आज्ञार्थक रूप इस संबंध और चलते रहने वाले कार्य को स्वाभाविक ढंग से व्यक्त करता है; ‘साथ ही’ और ‘भी’ क्रमशः ἅμα और καί का भाव रखते हैं।
- source_word: ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου
  choice: कि परमेश्वर हमारे लिए वचन का द्वार खोल दे
  rationale: ἵνα प्रार्थना की विषयवस्तु/उद्देश्य बताता है। ‘वचन का द्वार’ मूल रूपक को बनाए रखता है, जबकि ‘हमारे लिए’ ἡμῖν को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: λαλῆσαι
  choice: ताकि हम ... सुना सकें
  rationale: यह उद्देश्यसूचक infinitive है। ‘सुना सकें’ संदेश को लोगों तक वाणी से पहुँचाने का भाव स्वाभाविक हिंदी में देता है, बिना इसे तकनीकी रूप से ‘प्रचार करना’ बनाने के।
- source_word: τὸ μυστήριον τοῦ Χριστοῦ
  choice: मसीह के रहस्य
  rationale: μυστήριον के पौलुसी अर्थ—पहले छिपी, अब प्रकट की गई ईश्वरीय योजना—के लिए ‘रहस्य’ संगत है। Χριστός यहाँ उपाधिसूचक है, इसलिए ‘मसीह’ उपयुक्त है।
- source_word: δι’ ὃ καὶ δέδεμαι
  choice: जिसके कारण मैं कैद में हूँ
  rationale: διά + कर्मकारक कारण व्यक्त करता है। δέδεμαι का पूर्णकालिक निष्क्रिय रूप वर्तमान बँधी हुई अवस्था बताता है; प्रसंग में ‘कैद में हूँ’ अर्थ स्पष्ट और स्वाभाविक करता है।
theological_decisions:
- issue: τοῦ Χριστοῦ का अनुवाद
  choice: मसीह के
  alternative: ख्रीस्त के / क्राइस्ट के
  rationale: यहाँ Χριστός अर्थपूर्ण उपाधि के रूप में प्रयुक्त है। ‘मसीह’ आधुनिक हिंदी बाइबलीय भाषा में उस उपाधि को स्पष्ट रखता है।
- issue: θύραν τοῦ λόγου का रूपक
  choice: वचन का द्वार
  alternative: वचन सुनाने का अवसर
  rationale: मूल पाठ द्वार का रूपक रखता है; मुख्य पाठ में उसे सुरक्षित रखा गया है, जबकि उसके अवसर/मार्ग वाले आशय को पादटिप्पणी में स्पष्ट किया गया है।
- issue: δι’ ὃ का पूर्वपद
  choice: ‘जिसके कारण’ को मसीह के रहस्य/उसके कथन से संबंधित रखा
  alternative: मसीह के कारण
  rationale: नपुंसकलिंग ὃ निकटवर्ती नपुंसकलिंग μυστήριον से व्याकरणिक रूप से मेल खाता है, यद्यपि व्यापक अर्थ घोषित संदेश तक फैल सकता है। अनुवाद इस संबंध को अनावश्यक रूप से संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पिछले पद से जुड़े कृदंत को हिंदी में ‘प्रार्थना करते रहो’ के रूप में पूरा किया गया है। ‘वचन का द्वार’ पौलुस के रूपक को सुरक्षित रखता है; ‘कैद में हूँ’ प्रसंगगत अर्थ को स्वाभाविक बनाता है।
