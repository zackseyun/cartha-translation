  rationale: शाब्दिक रूप से 'उसके पास बहुत परिश्रम है' हिंदी में अस्वाभाविक है। क्रियात्मक अभिव्यक्ति πόνος के श्रम और कठिन प्रयास के मूल भाव को बनाए रखती है।
