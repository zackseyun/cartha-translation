  rationale: समानांतर यूनानी रचना को समान हिंदी रूप में व्यक्त करता है और नगर के नाम का लिप्यंतरण करता है।
theological_decisions:
- issue: इपफ्रास की सेवकाई के संबंध में πόνος का भाव
  choice: बहुत परिश्रम करता है
  alternative: बहुत चिंता रखता है; बड़ी पीड़ा सहता है
  rationale: πόνος मूलतः कठिन श्रम या कष्टपूर्ण प्रयास को व्यक्त करता है। निकट संदर्भ में प्रार्थना का संघर्ष शामिल हो सकता है, पर मुख्य पाठ को केवल भावनात्मक चिंता या पीड़ा तक सीमित नहीं किया गया।
- issue: μαρτυρῶ αὐτῷ में गवाही का संबंध
  choice: उसके विषय में गवाही देता हूँ
  alternative: उसके पक्ष में गवाही देता हूँ
  rationale: संप्रदान कारक को संबंधित व्यक्ति के रूप में समझना व्याकरणतः संभव है। चुना हुआ रूप पौलुस की व्यक्तिगत पुष्टि को बनाए रखता है, बिना यह तय किए कि वह औपचारिक रूप से इपफ्रास का पक्ष ले रहा है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। बहुवचन ‘तुम्हारे’ मूल पाठ के संबोधन को बनाए रखता है। नगरों के नाम प्रचलित बाइबलीय हिंदी लिप्यंतरण के निकट रखे गए हैं।
