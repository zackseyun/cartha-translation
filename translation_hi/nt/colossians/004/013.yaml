  text: क्योंकि मैं उसके विषय में गवाही देता हूँ कि वह तुम्हारे लिए और लौदीकिया में रहनेवालों तथा हियरापुलिस में रहनेवालों के लिए बहुत परिश्रम[a] करता है।
