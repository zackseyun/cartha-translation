base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/010.yaml
  text: Aristarchus[a], my fellow prisoner, greets you, and Mark, the cousin of Barnabas (about whom you received instructions—if he comes to you, welcome him)[b],
translation:
  language: hi
  text: मेरा सहबंदी अरिस्तर्खुस तुम्हें नमस्कार भेजता है, और बरनबास का रिश्ते में भाई मरकुस भी। उसके विषय में तुम्हें निर्देश मिले हैं—यदि वह तुम्हारे पास आए, तो उसका स्वागत करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀσπάζεται
  choice: नमस्कार कहता है
  rationale: पत्रों में अभिवादन भेजने के लिए प्रयुक्त इस क्रिया का यह स्वाभाविक और सीधा आधुनिक हिन्दी रूप है।
- source_word: συναιχμάλωτός
  choice: मेरे साथ कैद में पड़ा
  rationale: यह संयुक्त संज्ञा साथ में बंदी होने का भाव देती है। इस रूप में वास्तविक या रूपक कैद का प्रश्न अनिर्णीत रहता है और कोई अतिरिक्त धार्मिक व्याख्या नहीं जुड़ती।
- source_word: ἀνεψιὸς
  choice: रिश्ते का भाई
  rationale: कोइन यूनानी में यह शब्द पुरुष cousin को दर्शाता है। हिन्दी में पारिवारिक पक्ष जाने बिना चचेरा, ममेरा, फुफेरा या मौसेरा कहना संभव नहीं; ‘रिश्ते का भाई’ उस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐλάβετε ἐντολάς
  choice: तुम्हें निर्देश मिल चुके हैं
  rationale: यहाँ यात्रा और आतिथ्य के संदर्भ में ‘निर्देश’ अधिकारपूर्ण मार्गदर्शन व्यक्त करता है, पर ‘आदेश’ की अपेक्षा अनावश्यक कठोरता नहीं लाता।
- source_word: ἐὰν ἔλθῃ πρὸς ὑμᾶς
  choice: यदि वह तुम्हारे पास आए
  rationale: ἐάν और aorist subjunctive की भविष्य-संबंधी शर्त का यह स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: δέξασθε αὐτόν
  choice: उसका स्वागत करना
  rationale: यात्रा और आतिथ्य के प्रसंग में क्रिया किसी व्यक्ति को ग्रहण करने और आतिथ्य देने का अर्थ रखती है; ‘स्वागत करना’ इसे आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: συναιχμάλωτός μου में पौलुस और अरिस्तर्खुस के संबंध की प्रकृति
  choice: ‘मेरे साथ कैद में पड़ा’ कहकर बंदी होने की मूल छवि रखी गई है, पर यह स्पष्ट नहीं किया गया कि कैद वास्तविक है या रूपक।
  alternative: ‘प्रभु में मेरा सहबंदी’ अथवा ‘कष्टों में मेरा सहकर्मी’
  rationale: मूल पद स्वयं कोई अतिरिक्त धार्मिक विशेषण नहीं देता; इसलिए अनुवाद ऐतिहासिक और धर्मवैचारिक व्याख्या पाठक पर छोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ग्रीक की एक ही दीर्घ वाक्य-रचना को स्पष्टता के लिए तीन हिन्दी वाक्यों में बाँटा गया है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है।
