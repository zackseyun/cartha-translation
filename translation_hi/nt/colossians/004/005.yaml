  text: Walk in wisdom toward outsiders[b][a], making the most of the time.
translation:
  language: hi
  text: बाहरवालों[a] के प्रति बुद्धिमानी से आचरण करो और अवसर का पूरा लाभ उठाओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, विश्वासियों के समुदाय से बाहर के लोग।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “समय को खरीदते हुए”; भाव है, अवसर का पूरा उपयोग करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν σοφίᾳ
  choice: बुद्धिमानी से
  rationale: यह पदबंध आचरण की रीति बताता है। स्वाभाविक आधुनिक हिन्दी में ‘बुद्धिमानी से’ σοφία के नैतिक भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: περιπατεῖτε
  choice: जीवन बिताओ
  rationale: यहाँ क्रिया रूपक रूप में जीवन-व्यवहार के लिए प्रयुक्त है। हिन्दी में शाब्दिक ‘चलो’ अस्पष्ट हो सकता है, इसलिए ‘जीवन बिताओ’ आशय को स्वाभाविक ढंग से देता है।
- source_word: πρὸς τοὺς ἔξω
  choice: बाहरवालों के प्रति
  rationale: πρός संबंध में आचरण की दिशा दर्शाता है और οἱ ἔξω विश्वासियों के समुदाय से बाहर के लोगों को सूचित करता है। ‘के प्रति’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸν καιρόν
  choice: हर अवसर
  rationale: καιρός सामान्य काल नहीं, बल्कि उपयुक्त समय या अवसर का बोध कराता है। प्रसंग में हिन्दी ‘हर अवसर’ इस अर्थ को सीधे और स्वाभाविक रूप से प्रकट करती है।
- source_word: ἐξαγοραζόμενοι
  choice: पूरा लाभ उठाओ
  rationale: यह कृदन्त यहाँ उपलब्ध अवसर का भरपूर उपयोग करने के अर्थ में मुहावरेदार है। हिन्दी में ‘पूरा लाभ उठाओ’ अर्थ को स्पष्ट रखता है और अनावश्यक उद्धार-संबंधी अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ἐξαγοραζόμενοι को उद्धार-संबंधी भाषा मान लेने की संभावना
  choice: उपलब्ध अवसरों का पूरा उपयोग करने की समझाइश
  alternative: ‘समय को मोल ले लो’ अथवा ‘समय का उद्धार करो’ जैसा अधिक शाब्दिक रूप
  rationale: इस प्रसंग में क्रिया का आशय अवसर का सर्वोत्तम उपयोग करना है, न कि प्रायश्चित या आत्मिक उद्धार का कोई कथन। पादटिप्पणी शाब्दिक व्यापारिक रूपक को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जीवन बिताओ’ यूनानी चाल-चलन रूपक का स्वाभाविक हिन्दी अर्थ देता है; ‘बाहरवाले’ सामुदायिक संदर्भ को संक्षेप में रखता है और पादटिप्पणी उसे स्पष्ट करती है।
