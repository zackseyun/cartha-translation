lexical_decisions:
- source_word: ἀσπάζεται
  choice: नमस्कार कहते हैं
  rationale: पत्रों में प्रयुक्त अभिवादन-सूत्र का स्वाभाविक हिन्दी रूप; यूनानी में क्रिया एकवचन है क्योंकि वह निकटतम कर्ता लूका से मेल खाती है, जबकि हिन्दी में संयुक्त कर्ता के साथ बहुवचन स्वाभाविक है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: द्वितीय पुरुष बहुवचन कर्मकारक को सामूहिक संबोधन के रूप में व्यक्त करता है।
- source_word: Λουκᾶς
  choice: लूका
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: ἰατρὸς
  choice: वैद्य
  rationale: चिकित्सा करने वाले व्यक्ति के अर्थ को गरिमापूर्ण और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है, बिना आधुनिक शैक्षणिक उपाधि का अनावश्यक संकेत दिए।
- source_word: ἀγαπητὸς
  choice: प्रिय
  rationale: स्नेह और सम्मान दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: लूका और देमास को अभिवादन भेजने वाले संयुक्त कर्ताओं के रूप में जोड़ता है।
- source_word: Δημᾶς
  choice: देमास
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ‘प्रिय’ विशेषण का संबंध
  choice: ‘प्रिय वैद्य’ दोनों शब्द लूका का वर्णन करते हैं।
  alternative: ‘प्रिय’ को देमास सहित दोनों व्यक्तियों से जोड़ना।
  rationale: यूनानी पदबंध Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς में दोनों सव्याख्यात्मक पद निश्चित उपपद के साथ सीधे लूका से जुड़े हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नमस्कार कहते हैं’ हिन्दी पत्रात्मक अभिवादन का स्वाभाविक रूप है; ‘प्रिय वैद्य लूका’ यूनानी में लूका से जुड़े दोनों वर्णनों को स्पष्ट रखता है।
