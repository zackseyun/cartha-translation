  text: Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθ’ ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/018.yaml
  text: The greeting is in my own hand—Paul's[a]. Remember my chains[b]. Grace be with you.
translation:
  language: hi
  text: मैं, पौलुस, अपने हाथ से यह अभिवादन लिख रहा हूँ। मेरी बेड़ियों को याद रखो। अनुग्रह तुम्हारे साथ रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσπασμός
  choice: अभिवादन
  rationale: पत्र के अंत में लिखे गए समापन अभिवादन के लिए यह आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: τῇ ἐμῇ χειρὶ Παύλου
  choice: मैं, पौलुस, अपने हाथ से ... लिख रहा हूँ
  rationale: यूनानी की संक्षिप्त, क्रियारहित अभिव्यक्ति को स्वाभाविक हिन्दी में खोलकर कहा गया है; इससे पौलुस द्वारा स्वयं लिखे जाने का बल बना रहता है।
- source_word: μνημονεύετέ
  choice: याद रखो
  rationale: वर्तमान आज्ञार्थक के निरंतर स्मरण के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: μου τῶν δεσμῶν
  choice: मेरी बेड़ियों को
  rationale: δεσμοί की ठोस छवि को सुरक्षित रखता है और कैद की दशा का संकेत देता है, उसे अमूर्त ‘कारावास’ में नहीं बदलता।
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: पौलुस के प्रचलित समापन आशीर्वचन के लिए उपयुक्त है; यूनानी में अनुग्रह का स्रोत यहाँ स्पष्ट नहीं किया गया, इसलिए कोई अतिरिक्त संबंधसूचक पद नहीं जोड़ा गया।
- source_word: μεθ’ ὑμῶν
  choice: तुम्हारे साथ रहे
  rationale: क्रियारहित यूनानी आशीर्वचन को स्वाभाविक हिन्दी बनाने के लिए ‘रहे’ जोड़ा गया है।
theological_decisions:
- issue: क्रियारहित पौलुसी समापन आशीर्वचन
  choice: अनुग्रह तुम्हारे साथ रहे
  alternative: अनुग्रह तुम्हारे साथ
  rationale: ‘रहे’ हिन्दी में पूर्ण और स्वाभाविक आशीर्वचन बनाता है, पर कोई अतिरिक्त धर्मवैज्ञानिक आशय नहीं जोड़ता।
- issue: बेड़ियों के स्मरण का आशय
  choice: मेरी बेड़ियों को याद रखो
  alternative: मेरे कारावास को याद रखो
  rationale: मूल पाठ की ठोस और भावपूर्ण छवि सुरक्षित रखी गई है; इसे प्रार्थना, सहायता या सहानुभूति की किसी एक विशेष माँग के रूप में नहीं खोला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन समुदाय से है, इसलिए ‘रखो’ और ‘तुम्हारे’ प्रयुक्त हैं। शैली संक्षिप्त, आत्मीय और पत्र-समापन के अनुरूप गरिमापूर्ण रखी गई है।
