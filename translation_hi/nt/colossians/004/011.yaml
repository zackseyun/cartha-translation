source:
  edition: SBLGNT
  text: καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/011.yaml
  text: and Jesus who is called Justus[a]. These are the only ones from the circumcision who are fellow workers for the kingdom of God[c][b], and they became a comfort to me.
translation:
  language: hi
  text: और यीशु, जो यूस्तुस कहलाता है। खतना वालों में से केवल ये ही परमेश्वर के राज्य के लिए सहकर्मी हैं[a][b], और ये मेरे लिए सांत्वना बने[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, यहूदियों में से। शाब्दिक रूप से, ‘खतना में से।’
    reason: lexical_alternative
  - marker: b
    text: 'इसे इस प्रकार भी समझा जा सकता है: ‘परमेश्वर के राज्य के लिए मेरे सहकर्मियों में केवल ये ही खतना वालों में से हैं।’'
    reason: syntactic_ambiguity
  - marker: c
    text: या ‘ये मेरे लिए प्रोत्साहन बने हैं’ अथवा ‘ये मेरे लिए सांत्वना सिद्ध हुए हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नए नियम में इस व्यक्तिगत नाम का प्रचलित और सहज हिन्दी रूप ‘यीशु’ है; ‘यहोशू’ मूल सामी नाम से संबंधित होने पर भी यहाँ पाठक को भ्रमित कर सकता है।
- source_word: ὁ λεγόμενος Ἰοῦστος
  choice: जो यूस्तुस कहलाता है
  rationale: यह पदबंध यीशु नामक व्यक्ति का दूसरा, रोमी नाम बताता है। यह हिन्दी रूप पहचान और वाक्य की स्वाभाविकता दोनों बनाए रखता है।
- source_word: οἱ ὄντες ἐκ περιτομῆς
  choice: खतना वालों में से
  rationale: मूल अभिव्यक्ति यहूदी पहचान को खतने के द्वारा व्यक्त करती है। मुख्य पाठ में उसी रूपक को बनाए रखा गया है, जबकि अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: οὗτοι μόνοι
  choice: केवल ये ही
  rationale: यह रूप उस समूह के भीतर इन व्यक्तियों की विशिष्टता पर दिए गए बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: συνεργοὶ
  choice: सहकर्मी
  rationale: यह पौलुस के साथ सेवा और कार्य में भाग लेने वालों के लिए संक्षिप्त, वर्तमान और गरिमापूर्ण हिन्दी शब्द है।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य के लिए
  rationale: यहाँ εἰς उनके कार्य के लक्ष्य अथवा सेवा-सम्बन्ध को दिखाता है; ‘के लिए’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: ἐγενήθησάν μοι παρηγορία
  choice: ये मेरे लिए सांत्वना का कारण बने हैं
  rationale: γίνομαι के ‘बनना/सिद्ध होना’ भाव और παρηγορία के सांत्वना अथवा प्रोत्साहन के अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘खतना वालों में से’ का आशय
  choice: मुख्य पाठ में यहूदी पहचान बताने वाली मूल अभिव्यक्ति को बनाए रखा गया है।
  alternative: इसे सीधे ‘यहूदियों में से’ अथवा अधिक संकीर्ण अर्थ में ‘खतना-पक्ष के लोगों में से’ कहा जा सकता है।
  rationale: संदर्भ में ये परमेश्वर के राज्य के सहकर्मी हैं, इसलिए यह अभिव्यक्ति सबसे स्वाभाविक रूप से यहूदी पृष्ठभूमि के विश्वासियों को बताती है; फिर भी मूल यूनानी किसी विशिष्ट दल का नाम स्पष्ट रूप से नहीं देता।
- issue: μόνοι का वाक्यगत सम्बन्ध
  choice: ‘केवल’ को खतना वालों के समूह के भीतर इन व्यक्तियों की विशिष्टता से जोड़ा गया है।
  alternative: वाक्य को इस प्रकार भी समझा जा सकता है कि राज्य के लिए पौलुस के केवल यही सहकर्मी खतना वालों में से थे।
  rationale: यूनानी शब्दक्रम पहले ‘खतना वालों में से’ समूह स्थापित करता है और फिर ‘ये ही केवल सहकर्मी’ कहता है, पर हिन्दी में सम्बन्ध की दूसरी सम्भावना उल्लेख योग्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली अपनाई गई है। ‘खतना वालों’ से मूल सांस्कृतिक-धार्मिक अभिव्यक्ति सुरक्षित रहती है; ‘परमेश्वर का राज्य’, ‘सहकर्मी’ और ‘सांत्वना’ सामान्य बाइबलीय पाठक के लिए परिचित और स्पष्ट हैं। आरम्भ का ‘और’ पिछले पद की नाम-सूची से इस पद का सम्बन्ध बनाए रखता है।
