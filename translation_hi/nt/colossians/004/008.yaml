  text: ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα ⸀γνῶτε τὰ περὶ ⸀ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/004/008.yaml
  text: 'I sent him to you for this very purpose: that you may know how we are[a], and that he may encourage your hearts.'
translation:
  language: hi
  text: मैंने उसे तुम्हारे पास इसी उद्देश्य से भेजा है कि तुम जान सको कि हम कैसे हैं[a], और वह तुम्हारे हृदयों को प्रोत्साहित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाण्डुलिपियों में है, “कि हम जान सकें कि तुम कैसे हो।”
    reason: textual_variant
lexical_decisions:
- source_word: ὃν
  choice: उसे
  rationale: यह पुल्लिंग एकवचन सम्बन्धवाचक सर्वनाम पिछले पद के तुखिकुस की ओर संकेत करता है; हिन्दी में स्वतंत्र वाक्य-विन्यास के साथ ‘उसे’ स्वाभाविक है।
- source_word: ἔπεμψα
  choice: मैंने ... भेजा है
  rationale: पत्र के वर्तमान संदर्भ में प्रेषण की पूर्ण क्रिया और उसके वर्तमान प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी एओरिस्ट के आशय में अनावश्यक विस्तार नहीं करता।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे पास
  rationale: भेजने की क्रिया के साथ व्यक्तियों की ओर दिशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτὸ τοῦτο
  choice: इसी उद्देश्य से
  rationale: αὐτὸ τοῦτο के बल और स्पष्ट प्रयोजन—दोनों को संक्षिप्त तथा स्वाभाविक ढंग से रखता है।
- source_word: ἵνα γνῶτε
  choice: कि तुम जान सको
  rationale: ἵνα के प्रयोजन और γνῶτε के सम्भावनार्थक अधीन रूप को स्पष्ट करता है।
- source_word: τὰ περὶ ἡμῶν
  choice: कि हम कैसे हैं
  rationale: यह पौलुस और उसके साथियों की दशा या समाचार का सहज व्यक्तिगत निरूपण है; अधिक अमूर्त ‘हमारी परिस्थितियाँ’ की अपेक्षा मूल अभिव्यक्ति के निकट है।
- source_word: παρακαλέσῃ
  choice: प्रोत्साहित करे
  rationale: παρακαλέω में ढाढ़स, उत्साह और सुदृढ़ीकरण का अर्थ हो सकता है; इस दूताई और समाचार के संदर्भ में ‘प्रोत्साहित करे’ पर्याप्त व्यापक है।
- source_word: τὰς καρδίας ὑμῶν
  choice: तुम्हारे हृदयों को
  rationale: बाइबिलीय मानव-विज्ञान की ‘हृदय’ संज्ञा को बनाए रखता है और बहुवचन मूल के अनुरूप है।
theological_decisions:
- issue: प्रयोजन-वाक्य में पाठांतर के कारण जानने वाले और जिनके विषय में जाना जाता है उनकी दिशा
  choice: 'मुख्य पाठ में SBLGNT का पाठ: ‘कि तुम जान सको कि हम कैसे हैं।’'
  alternative: 'कुछ पाण्डुलिपियों में: ‘कि हम जान सकें कि तुम कैसे हो।’'
  rationale: मुख्य पाठ प्रदत्त यूनानी आलोचनात्मक संस्करण का अनुसरण करता है; अर्थ की दिशा उलट देने वाला प्रसिद्ध पाठांतर पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। मूल के उद्देश्य-वाक्य, ‘हृदय’ रूपक और पाठांतर से उत्पन्न वास्तविक अस्पष्टता को सुरक्षित रखा गया है।
