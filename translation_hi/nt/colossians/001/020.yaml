source:
  edition: SBLGNT
  text: καὶ δι’ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, ⸂[δι’ αὐτοῦ]⸃ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ⸀ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/020.yaml
  text: and through him to reconcile all things to himself[d][c][b][a], having made peace through the blood of his cross—through him—whether the things on the earth or the things in the heavens.
translation:
  language: hi
  text: और उसके द्वारा सब वस्तुओं का अपने साथ मेल-मिलाप करा ले—उसके क्रूस पर बहाए गए लहू के द्वारा शांति स्थापित करके—उसी के द्वारा,[a] चाहे पृथ्वी पर की वस्तुएँ हों, चाहे स्वर्गों में की हों।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पांडुलिपियों में दूसरी बार आए “उसी के द्वारा” शब्द नहीं हैं।
    reason: textual_variant
  - marker: b
    text: “सब वस्तुओं” का अर्थ यहाँ व्यापक ही रखा गया है, जैसा आगे “पृथ्वी पर” और “स्वर्गों में” से प्रकट होता है। यह पद स्वयं स्पष्ट नहीं करता कि यह मेल-मिलाप अंतिम उद्धार से किस प्रकार संबंधित है। यूनानी में “स्वर्गों” बहुवचन है।
    reason: alternative_reading
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: διά के साथ संबंधकारक साधन या माध्यम को व्यक्त करता है। हिंदी में ‘उसके द्वारा’ स्वाभाविक है और पुत्र की मध्यस्थ भूमिका को बनाए रखता है।
- source_word: ἀποκαταλλάξαι
  choice: मेल करा ले
  rationale: क्रिया टूटे हुए संबंध को फिर से मिलाने का भाव देती है। ‘मेल करा ले’ वर्तमान हिंदी में स्वाभाविक है और ‘पूरी तरह’ जैसा व्याख्यात्मक तीव्रीकरण नहीं जोड़ता।
- source_word: τὰ πάντα
  choice: सब वस्तुओं
  rationale: नपुंसकलिंग बहुवचन की व्यापकता सुरक्षित रहती है और इसे केवल मनुष्यों तक सीमित नहीं किया जाता।
- source_word: εἰς αὐτόν
  choice: अपने साथ
  rationale: संदर्भ में कर्ता परमेश्वर समझा जाता है; हिंदी में ‘अपने साथ’ संबंध की ओर होने वाले मेल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰρηνοποιήσας
  choice: शांति स्थापित करके
  rationale: कृदंत मेल कराने के साधन या उससे संबद्ध पूर्ववर्ती कार्य को बताता है। यह अनुवाद शांति किए जाने का भाव स्पष्ट रखता है।
- source_word: διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ
  choice: उसके क्रूस पर बहाए गए लहू के द्वारा
  rationale: ‘लहू’ और ‘क्रूस’ दोनों ठोस रूप में सुरक्षित हैं। ‘पर बहाए गए’ हिंदी में यूनानी संबंधवाचक वाक्यांश का अभिप्राय स्पष्ट करता है, बिना उसे केवल ‘मृत्यु’ में बदलने के।
- source_word: ⸂[δι’ αὐτοῦ]⸃
  choice: उसी के द्वारा
  rationale: पुनरुक्त वाक्यांश को पाठ में रखा गया है और ‘उसी’ उसके बलाघात को प्रकट करता है; पांडुलिपीय भिन्नता पाद-टिप्पणी में दी गई है।
- source_word: εἴτε ... εἴτε
  choice: चाहे ... या
  rationale: यह हिंदी में सहसंबंधी रचना का स्वाभाविक और व्यापक जोड़ा है।
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: पृथ्वी पर की वस्तुएँ
  rationale: ब्रह्मांडीय विरोध में γῆ को ‘पृथ्वी’ कहना उपयुक्त है और वस्तुओं का संदर्भ स्पष्ट रहता है।
- source_word: τὰ ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में की
  rationale: बहुवचन οὐρανοῖς को ‘स्वर्गों’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: τὰ πάντα में मेल-मिलाप का विस्तार
  choice: ‘सब वस्तुओं’ कहकर व्यापकता को बनाए रखा गया, पर इसे सार्वभौमिक अंतिम उद्धार नहीं कहा गया।
  alternative: ‘सब मनुष्यों’ या ‘समूचे विश्व का उद्धार’
  rationale: पृथ्वी और स्वर्गों की अगली जोड़ी ब्रह्मांडीय विस्तार दिखाती है, किंतु यह पद स्वयं नहीं बताता कि यह मेल अंतिम उद्धार से किस प्रकार संबंधित है।
- issue: εἰς αὐτόν में सर्वनाम का संदर्भ
  choice: परमेश्वर सब वस्तुओं का अपने साथ मेल कराता है, पुत्र के द्वारा।
  alternative: मसीह सब वस्तुओं का अपने साथ मेल कराता है।
  rationale: वाक्य-संरचना पद 19 से चलती है, जहाँ परमेश्वर की प्रसन्नता निहित कर्ता है; फिर भी पुत्र की मध्यस्थ भूमिका स्पष्ट रखी गई है।
- issue: ‘उसके क्रूस के लहू’ का अर्थ
  choice: लहू और क्रूस की ठोस भाषा दोनों बनाए रखी गईं।
  alternative: ‘क्रूस पर उसकी मृत्यु के द्वारा’
  rationale: मूल पाठ बलिदानी लहू और ऐतिहासिक क्रूस दोनों कहता है; इसे किसी एक विशिष्ट प्रायश्चित-सिद्धांत में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘मेल करा ले’ संबंधात्मक अर्थ को स्वाभाविक बनाता है; ‘लहू’ बाइबलीय और बलिदानी ठोसपन सुरक्षित रखता है। डैश पुनरुक्त ‘उसी के द्वारा’ के बलाघात को दर्शाते हैं।
