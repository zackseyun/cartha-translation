  text: Paul[a], an apostle of Messiah Jesus by the will of God, and Timothy our brother[b],
translation:
  language: hi
  text: परमेश्वर की इच्छा से मसीह[a] यीशु का प्रेरित पौलुस, और हमारा भाई[b] तीमुथियुस,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ के स्थान पर ‘ख्रीस्त’ भी लिखा जा सकता है; यहाँ उपाधि के अर्थ को बनाए रखने के लिए ‘मसीह’ लिखा गया है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में ‘भाई’ के साथ निश्चित उपपद है (शब्दशः, ‘वह भाई’); पत्र के इस अभिवादन में स्वाभाविक हिन्दी के लिए ‘हमारा भाई’ किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παῦλος
  choice: पौलुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा में प्रचलित और सहज रूप।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: यहाँ यह केवल सामान्य संदेशवाहक नहीं, बल्कि पौलुस की मान्य सेवकीय भूमिका और अधिकार को व्यक्त करने वाली उपाधि है।
- source_word: Χριστοῦ Ἰησοῦ
  choice: मसीह यीशु का
  rationale: सम्बन्धकारक रचना पौलुस को मसीह यीशु से सम्बद्ध और उनके द्वारा नियुक्त प्रेरित बताती है। Χριστός के उपाधिगत अर्थ को सुरक्षित रखने के लिए ‘मसीह’ चुना गया है।
- source_word: διὰ θελήματος θεοῦ
  choice: परमेश्वर की इच्छा से
  rationale: διά के साथ सम्बन्धकारक यहाँ पौलुस के प्रेरित होने के आधार या प्रभावी कारण को व्यक्त करता है; हिन्दी में ‘इच्छा से’ स्वाभाविक और सटीक है।
- source_word: Τιμόθεος
  choice: तीमुथियुस
  rationale: यूनानी नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: ὁ ἀδελφὸς
  choice: हमारा भाई
  rationale: यूनानी में शब्दशः ‘वह भाई’ है, पर पत्र के आरम्भ में यह विश्वासियों के सामुदायिक संबंध का पद है; हिन्दी में ‘हमारा भाई’ उसी निहित संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός यीशु की उपाधि के रूप में अर्थवान है; ‘मसीह’ अभिषिक्त राजा की धारणा को सुरक्षित रखता है, जबकि केवल लिप्यंतरण उसका अर्थ अस्पष्ट कर सकता है।
- issue: ὁ ἀδελφός का संबंधसूचक बल
  choice: हमारा भाई
  alternative: वह भाई
  rationale: मूल का निश्चित पदबंध मसीही समुदाय में तीमुथियुस की परिचित पारिवारिक पहचान बताता है। ‘हमारा’ कोई अलग सिद्धान्त नहीं जोड़ता, बल्कि हिन्दी में निहित सामुदायिक संबंध स्पष्ट करता है।
