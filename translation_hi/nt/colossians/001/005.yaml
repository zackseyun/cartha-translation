translation:
  language: hi
  text: उस आशा के कारण जो तुम्हारे लिए स्वर्गों[a] में रखी हुई है, और जिसके विषय में तुम सत्य के वचन, अर्थात् सुसमाचार, में पहले ही सुन चुके हो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्ग में।” यूनानी में बहुवचन “स्वर्गों” है।
    reason: lexical_alternative
  - marker: b
    text: “सत्य के वचन” का अनुवाद “सत्य के संदेश” भी हो सकता है। “सुसमाचार” उसी वचन या संदेश की पहचान बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὴν ἐλπίδα
  choice: उस आशा के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण या आधार व्यक्त करता है। ‘आशा’ ἐλπίς का सीधा और प्रचलित अर्थ है।
- source_word: ἀποκειμένην ὑμῖν
  choice: तुम्हारे लिए ... रखी हुई है
  rationale: ἀπόκειμαι किसी वस्तु के भविष्य के लिए रखे या सुरक्षित होने का भाव देता है। यह रूपक को अनावश्यक विस्तार दिए बिना बनाए रखता है; ὑμῖν लाभार्थक अर्थ में ‘तुम्हारे लिए’ है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी पाठ में बहुवचन है। ‘स्वर्गों’ उसे स्पष्ट रूप से सुरक्षित रखता है, जबकि पादटिप्पणी अधिक प्रचलित एकवचन विकल्प बताती है।
- source_word: ἣν προηκούσατε
  choice: जिसके विषय में तुम पहले ही ... सुन चुके हो
  rationale: स्त्रीलिंग एकवचन ἣν का निकटतम पूर्वपद ‘आशा’ है। हिंदी में आशा को सुनने के साथ ‘जिसके विषय में’ स्वाभाविक है, और ‘पहले ही’ προ- के पूर्वकालिक भाव को व्यक्त करता है।
- source_word: ἐν τῷ λόγῳ τῆς ἀληθείας
  choice: सत्य के वचन में
  rationale: λόγος को ‘वचन’ कहना मूल अभिव्यक्ति के निकट है और हिंदी बाइबलीय भाषा में बोधगम्य है; इसका अर्थ ‘संदेश’ भी हो सकता है।
- source_word: τοῦ εὐαγγελίου
  choice: अर्थात् सुसमाचार
  rationale: यह संबंधकारक पद ‘सत्य के वचन’ की पहचान या समानाधिकरण करता है। ‘अर्थात्’ इस संबंध को स्वाभाविक हिंदी में स्पष्ट करता है, बिना उसे अलग विचार बनाए।
theological_decisions:
- issue: संबंधवाचक उपवाक्य का पूर्वपद
  choice: ‘जिसके विषय में ... सुन चुके हो’ को ‘आशा’ से जोड़ा गया है।
  alternative: इसे पूरे सुसमाचार-संदेश या पिछले विचार से व्यापक रूप में जोड़ना।
  rationale: ἣν स्त्रीलिंग एकवचन है और सीधे ἐλπίδα (‘आशा’) से मेल खाता है; इसलिए स्रोत की व्याकरणिक संरचना और आशा पर पौलुस का बल सुरक्षित रहता है।
- issue: οὐρανοῖς का वचन
  choice: मुख्य पाठ में बहुवचन ‘स्वर्गों’ रखा गया है।
  alternative: प्रचलित हिंदी के अनुसार एकवचन ‘स्वर्ग’।
  rationale: बहुवचन मूल यूनानी रूप को सुरक्षित रखता है; एकवचन विकल्प पादटिप्पणी में दिया गया है।
- issue: ‘सत्य के वचन’ और ‘सुसमाचार’ का संबंध
  choice: ‘सुसमाचार’ को ‘सत्य के वचन’ की पहचान बताने वाला समानाधिकरण माना गया है।
  alternative: ‘सुसमाचार के सत्य के वचन’ जैसा संबंधकारक अनुवाद।
  rationale: यूनानी क्रम में τοῦ εὐαγγελίου पिछले पूरे पद की व्याख्या करता है। ‘अर्थात्’ इस संबंध को स्पष्ट करता है और कृत्रिम हिंदी से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘स्वर्गों’ और ‘सत्य के वचन’ जैसे स्रोत-समीपी पदों को बनाए रखते हुए पादटिप्पणियों में अधिक मुहावरेदार विकल्प दिए गए हैं।
