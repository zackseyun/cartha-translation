id: COL.1.10
reference: Colossians 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι ⸂τῇ ἐπιγνώσει⸃ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/010.yaml
  text: so as to walk worthily of the Lord[a], to all pleasing, bearing fruit in every good work and growing in the knowledge of God[b],
translation:
  language: hi
  text: ताकि तुम प्रभु के योग्य जीवन बिताओ[a] और उसे हर प्रकार से प्रसन्न करो—हर भले काम में फल लाते हुए और परमेश्वर के ज्ञान में बढ़ते हुए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “प्रभु के योग्य चलो”; “चलना” जीवन और आचरण के लिए प्रयुक्त एक रूपक है।
    reason: metaphor_clarification
  - marker: b
    text: या, “परमेश्वर के पूर्ण ज्ञान में बढ़ते हुए।” इस शब्द में अधिक पूर्ण या गहरे ज्ञान का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιπατῆσαι
  choice: जीवन चलो
  rationale: यूनानी का शाब्दिक अर्थ ‘चलना’ है, पर यहाँ पौलुस की जीवन-आचरण संबंधी रूपक-भाषा है। ‘जीवन चलो’ रूपक को बनाए रखते हुए आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: ἀξίως τοῦ κυρίου
  choice: प्रभु के योग्य
  rationale: यह वाक्यांश ऐसे जीवन-आचरण को व्यक्त करता है जो प्रभु के अनुरूप और उसके योग्य हो; संबंधवाचक संरचना को निकटता से रखा गया है।
- source_word: εἰς πᾶσαν ἀρεσκείαν
  choice: हर तरह से उसे प्रसन्न करो
  rationale: शाब्दिक संरचना ‘हर प्रकार की प्रसन्नता के लिए’ हिन्दी में अस्वाभाविक है। संदर्भ में प्रभु निहित लक्ष्य है, इसलिए स्वाभाविक हिन्दी में उसे स्पष्ट किया गया है और वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐν παντὶ ἔργῳ ἀγαθῷ
  choice: हर भले काम में
  rationale: παντί की वितरणात्मक व्यापकता और ἀγαθῷ की नैतिक गुणवत्ता दोनों सुरक्षित रहती हैं।
- source_word: καρποφοροῦντες
  choice: फल लाते
  rationale: फल लाने का जैविक रूपक सुरक्षित है और कुलुस्सियों 1:6 से संभावित शब्द-संबंध भी बना रहता है।
- source_word: αὐξανόμενοι
  choice: बढ़ते जाओ
  rationale: वर्तमान कृदंत निरंतर प्रगति दर्शाता है; ‘बढ़ते जाओ’ हिन्दी में इस सतत भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῇ ἐπιγνώσει τοῦ θεοῦ
  choice: परमेश्वर के ज्ञान में
  rationale: संबंधकारक को ‘परमेश्वर के’ और दत्तिव को क्षेत्र/संबंध के अर्थ में ‘ज्ञान में’ लिया गया है। ἐπίγνωσις की ‘भरपूर/गहरी पहचान’ वाली संभावित छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἀρεσκεία का निहित लक्ष्य
  choice: मुख्य पाठ में ‘उसे’ जोड़कर प्रभु को संदर्भगत लक्ष्य स्पष्ट करना
  alternative: ‘पूरी प्रसन्नता के लिए’ जैसे अधिक शाब्दिक किंतु हिन्दी में अस्पष्ट रूप में निहितता बनाए रखना
  rationale: यूनानी में कर्म स्पष्ट नहीं है, पर निकटतम संदर्भ में ‘प्रभु’ स्वाभाविक रूप से निहित है। हिन्दी में बिना कर्म के ‘प्रसन्न करना’ अधूरा और अस्वाभाविक लगता है; पादटिप्पणी मूल की संरचनात्मक निहितता बताती है।
- issue: ἐπίγνωσις की अर्थ-छाया
  choice: मुख्य पाठ में ‘ज्ञान’
  alternative: ‘पूरा ज्ञान’ या ‘गहरा ज्ञान’
  rationale: शब्द कभी अधिक पूर्ण या गहरी जानकारी/पहचान का भाव दे सकता है, पर यहाँ उसे अनिवार्य तकनीकी भेद बनाना उचित नहीं; संभावित अर्थ-छाया पादटिप्पणी में दी गई है।
- issue: τῇ ἐπιγνώσει का दत्तिव अर्थ
  choice: 'क्षेत्र अथवा संबंध: ‘ज्ञान में बढ़ते जाओ’'
  alternative: 'साधन: ‘परमेश्वर के ज्ञान के द्वारा बढ़ते जाओ’'
  rationale: दोनों व्याकरणतः संभव हैं, पर वृद्धि की जैविक छवि और निकट वाक्य-विन्यास के साथ क्षेत्र/संबंध वाला अर्थ अधिक सीधा है; साधनात्मक अर्थ को चुपचाप सिद्धांतगत निष्कर्ष नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘प्रभु’, ‘परमेश्वर’, ‘फल लाना’ और ‘योग्य जीवन चलना’ जैसे परिचित बाइबलीय पदों को सामान्य पाठक की समझ के अनुरूप रखा गया है; कृदंतों की निरंतरता ‘लाते’ और ‘बढ़ते जाओ’ से व्यक्त हुई है।
