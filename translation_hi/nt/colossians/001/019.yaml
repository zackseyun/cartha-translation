  text: क्योंकि सारी परिपूर्णता को उसी में वास करना अच्छा लगा[a][b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘क्योंकि’ के स्थान पर ‘इसलिए कि’ भी संभव है; प्रसंग में यह संयोजक व्याख्या या कारण प्रस्तुत कर सकता है।
