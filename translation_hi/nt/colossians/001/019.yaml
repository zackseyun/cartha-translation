    reason: cross_reference
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथनों का आधार या कारण प्रस्तुत करता है। ‘क्योंकि’ हिन्दी में उसके व्याख्यात्मक-कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है, यद्यपि प्रसंग में ‘इसलिए कि’ भी संभव है।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: सर्वनाम निकटवर्ती प्रसंग में पुत्र की ओर संकेत करता है। ‘उसी में’ यूनानी सर्वनाम को बनाए रखता है और इस पद में ‘मसीह’ या ‘पुत्र’ को अलग से नहीं जोड़ता।
- source_word: εὐδόκησεν
  choice: अच्छा समझा
  rationale: εὐδοκέω अनुकूल इच्छा, प्रसन्नता या स्वीकृति व्यक्त करता है। ‘अच्छा समझा’ वर्तमान हिन्दी में स्वाभाविक है और किसी अनकहे कर्ता के रूप में ‘परमेश्वर’ या ‘पिता’ को जोड़ने से बचता है।
- source_word: πᾶν τὸ πλήρωμα
  choice: सारी परिपूर्णता
  rationale: यह अभिव्यक्ति समग्र और निश्चित परिपूर्णता का बोध कराती है। ‘सारी परिपूर्णता’ πᾶν के व्यापक बल को बनाए रखती है और स्रोत में अनुपस्थित ‘परमेश्वर की’ नहीं जोड़ती।
- source_word: κατοικῆσαι
  choice: वास करना
  rationale: यह क्रिया स्थायी रूप से निवास करने का भाव रखती है। ‘वास करना’ संक्षिप्त, समझने योग्य और पद की गरिमापूर्ण धार्मिक शैली के अनुरूप है।
theological_decisions:
- issue: εὐδόκησεν का कर्ता और πᾶν τὸ πλήρωμα से उसका संबंध
  choice: मुख्य पाठ में ‘सारी परिपूर्णता’ को व्याकरणिक कर्ता रखते हुए ‘ने … अच्छा समझा’ कहा गया है।
  alternative: ‘परमेश्वर को यह अच्छा लगा कि उसकी सारी परिपूर्णता उसमें वास करे’ या ‘पिता ने चाहा कि सारी परिपूर्णता उसमें वास करे।’
  rationale: यूनानी में ‘परमेश्वर’ या ‘पिता’ स्पष्ट रूप से नहीं लिखा है, और πᾶν τὸ πλήρωμα स्वाभाविक रूप से εὐδόκησεν का कर्ता पढ़ा जा सकता है। इसलिए मुख्य पाठ अनकहे ईश्वरीय कर्ता को नहीं जोड़ता; प्रचलित वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- issue: ‘परिपूर्णता’ का आशय
  choice: ‘सारी परिपूर्णता’ को बिना विस्तार के रखा गया है।
  alternative: ‘परमेश्वर की सारी परिपूर्णता’ या ‘उसकी सारी परिपूर्णता।’
  rationale: व्यापक प्रसंग, विशेषकर कुलुस्सियों 2:9, इसे परमेश्वर की परिपूर्णता समझने का मजबूत आधार देता है; फिर भी इस पद में ऐसा कोई संबंधकारक पद स्पष्ट रूप से नहीं है। अनुवाद स्रोत की संक्षिप्तता और धर्मवैचारिक गहनता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘उसी में’ संदर्भगत बल को स्वाभाविक रूप से व्यक्त करता है। ‘परिपूर्णता’ धार्मिक गहनता वाला प्रचलित शब्द है, जबकि ‘वास करना’ स्थायी निवास के भाव और पद की ऊँची शैली को बनाए रखता है।
