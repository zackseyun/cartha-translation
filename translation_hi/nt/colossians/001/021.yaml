    text: या “मन में शत्रु, बुरे कामों में।” यूनानी वाक्यांश संक्षिप्त है और मन की शत्रुता तथा बुरे कामों के बीच संबंध को पूरी तरह स्पष्ट नहीं करता।
    reason: lexical_alternative
