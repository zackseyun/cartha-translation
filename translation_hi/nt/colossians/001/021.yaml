revisions:
- from: और तुम भी[a], जो पहले अलग किए हुए और मन से विरोधी थे, बुरे कामों में—
  to: और तुम[a], जो पहले पराए किए हुए और मन से शत्रु थे, बुरे कामों में—
  rationale: The revision removes an unwarranted additive nuance, restores the stronger noun sense of “enemies,” and improves the rendering of alienation as relational estrangement. It deliberately leaves “बुरे कामों में” compact, since the Greek does not resolve whether this phrase marks sphere, manifestation, or cause. The dash is retained because this verse continues syntactically into the following verse.
