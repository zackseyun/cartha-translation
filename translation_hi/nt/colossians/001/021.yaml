    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὑμᾶς
  choice: और तुम भी
  rationale: यह पिछले कथन से वाक्य को जोड़ता है और पाठकों को मसीह के मेल-मिलाप के कार्य के दायरे में सम्मिलित करता है।
- source_word: ποτε ὄντας
  choice: जो पहले ... थे
  rationale: कालवाचक क्रिया-विशेषण और कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है; यह उनकी पिछली दशा को बताता है।
- source_word: ἀπηλλοτριωμένους
  choice: अलग किए हुए
  rationale: पूर्ण निष्क्रिय कृदंत अलगाव की बनी हुई दशा सूचित करता है। यह पद बिना अनावश्यक व्याख्या के उस संबंध-विच्छेद को व्यक्त करता है।
- source_word: ἐχθροὺς τῇ διανοίᾳ
  choice: मन से विरोधी
  rationale: ἐχθρούς का मूल भाव शत्रुता है और दत्तिव τῇ διανοίᾳ उसके क्षेत्र या संबंध को बताता है। हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: ἐν τοῖς ἔργοις τοῖς πονηροῖς
  choice: बुरे कामों में
  rationale: ἐν को स्पष्ट कारण या अलग क्रियात्मक कृदंत में बदले बिना उसके क्षेत्र अथवा अभिव्यक्ति की संक्षिप्तता बनाए रखी गई है।
- source_word: ἔργοις
  choice: कामों
  rationale: आधुनिक सामान्य हिन्दी में यह कर्मों/कार्यों की तुलना में अधिक सहज है और यहाँ किसी विशेष पारिभाषिक धार्मिक अर्थ को नहीं जोड़ता।
- source_word: πονηροῖς
  choice: बुरे
  rationale: यह नैतिक बुराई का सीधा और सर्वसुलभ हिन्दी रूप है।
theological_decisions:
- issue: मन की शत्रुता और बुरे कामों का संबंध
  choice: “मन से विरोधी थे, बुरे कामों में”
  alternative: “मन से विरोधी थे और बुरे काम करते थे”
  rationale: यूनानी ἐν कारण, क्षेत्र या अभिव्यक्ति का संबंध सूचित कर सकता है। मुख्य पाठ उसकी संक्षिप्तता और अस्पष्टता बचाता है; विकल्प अधिक सहज है, पर मूल में निहित न होने वाला स्पष्ट क्रियात्मक संबंध जोड़ देता है।
- issue: ἐχθρούς का संज्ञात्मक या विशेषणात्मक बल
  choice: “विरोधी”
  alternative: “शत्रु”
  rationale: दोनों संभव हैं। “विरोधी” τῇ διανοίᾳ के साथ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी अधिक शाब्दिक “शत्रु” को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। पद मूल वाक्य का अपूर्ण अंश है, इसलिए अंत में दीर्घ डैश रखा गया है।
