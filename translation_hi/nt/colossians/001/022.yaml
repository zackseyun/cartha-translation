  text: νυνὶ δὲ ⸀ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/022.yaml
  text: But now he has reconciled you in his body of flesh through death[a], to present you holy and blameless and beyond reproach before him[b],
translation:
  language: hi
  text: पर अब मसीह की शारीरिक देह में, उसकी मृत्यु के द्वारा, तुम्हारा मेल कराया गया है[a], ताकि तुम्हें उसके सामने पवित्र, निष्कलंक और आरोप-रहित उपस्थित किया जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर अब उसने मसीह की शारीरिक देह में, उसकी मृत्यु के द्वारा, तुम्हारा मेल कराया है।” यूनानी क्रिया कर्मवाच्य है; कर्ता व्याकरण में व्यक्त नहीं है।
    reason: alternative_reading
  - marker: b
    text: “निष्कलंक” का अनुवाद “बिना दाग के” भी हो सकता है; यूनानी शब्द में निर्दोष बलिदान की प्रतिध्वनि हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: पद 21 की पिछली दशा और अब हुई स्थिति के बीच समयगत तथा विरोधसूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀποκατηλλάγητε
  choice: उसने ... तुम्हारा मेल अपने साथ करा दिया है
  rationale: यूनानी रूप कर्मवाच्य है, पर प्रसंग में परमेश्वर का कर्तृत्व निहित है। यह हिन्दी प्रयोग मेल-मिलाप की पूर्ण हो चुकी क्रिया और उसके वर्तमान परिणाम को स्वाभाविक ढंग से बताता है; कर्मवाच्य विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ
  choice: मसीह के देहधारी शरीर में
  rationale: शाब्दिक देह और वास्तविक मानवीय शरीर पर बल बनाए रखता है, पर हिन्दी में अस्वाभाविक ‘मांस का शरीर’ से बचता है। ‘मसीह’ प्रसंग से स्पष्ट संदर्भ को खोलता है, जबकि परमेश्वर और मसीह को एक ही सर्वनाम से व्यक्त करने की अस्पष्टता घटाता है।
- source_word: διὰ τοῦ θανάτου
  choice: उसकी मृत्यु के द्वारा
  rationale: διά के साधनार्थक भाव को स्पष्ट करता है और प्रसंगानुसार मृत्यु को मसीह की मृत्यु बताता है।
- source_word: παραστῆσαι
  choice: उपस्थित करे
  rationale: उद्देश्यसूचक infinitive को बनाए रखते हुए किसी के सामने लाकर खड़ा करने या प्रस्तुत करने का भाव देता है।
- source_word: ἁγίους
  choice: पवित्र
  rationale: अलग किए जाने और नैतिक शुद्धता—दोनों स्वरों को समेटने वाला स्थापित हिन्दी शब्द है।
- source_word: ἀμώμους
  choice: निष्कलंक
  rationale: दोषरहित होने के साथ बलिदान-संबंधी ‘बिना दाग’ की संभावित प्रतिध्वनि भी बनाए रखता है।
- source_word: ἀνεγκλήτους
  choice: निर्दोष ठहराकर
  rationale: ऐसी दशा व्यक्त करता है जिसमें कोई आरोप टिक न सके; साथ ही आधुनिक हिन्दी में सहज है। ‘ठहराकर’ न्यायिक रंग को उभारता है, यद्यपि यूनानी विशेषण का अधिक सीधा विकल्प ‘जिस पर कोई आरोप न लगे’ है।
- source_word: κατενώπιον αὐτοῦ
  choice: अपने सामने
  rationale: प्रसंग में मेल कराने वाले परमेश्वर के सामने उपस्थित किए जाने का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ἀποκατηλλάγητε में कर्ता और वाच्य
  choice: 'मुख्य पाठ में परमेश्वर को निहित कर्ता मानकर सक्रिय हिन्दी: ‘उसने ... तुम्हारा मेल अपने साथ करा दिया है’'
  alternative: ‘तुम्हारा मेल करा दिया गया है’
  rationale: यूनानी क्रिया कर्मवाच्य है और कर्ता व्याकरण में व्यक्त नहीं; निकट प्रसंग परमेश्वर के कर्तृत्व की ओर संकेत करता है। वास्तविक व्याकरणिक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: σάρξ का अर्थ
  choice: 'वास्तविक शारीरिक देह: ‘देहधारी शरीर’'
  alternative: ‘पापी स्वभाव’
  rationale: मृत्यु का उल्लेख वास्तविक मानवीय शरीर की ओर संकेत करता है। यहाँ ‘पापी स्वभाव’ कहना प्रसंग से परे धर्मवैचारिक अर्थ आरोपित करेगा।
- issue: ἀμώμους और ἀνεγκλήτους का भेद
  choice: ‘निष्कलंक और निर्दोष’
  alternative: ‘बिना दाग और जिस पर कोई आरोप न लगे’
  rationale: पहला शब्द शुद्धता तथा बलिदान-संबंधी स्वीकार्यता का रंग रख सकता है, जबकि दूसरा आरोप से परे होने का न्यायिक भाव देता है। दोनों को समानार्थक बनाकर समतल नहीं किया गया।
- issue: κατενώπιον αὐτοῦ में सर्वनाम का संदर्भ
  choice: ‘अपने सामने’, अर्थात मेल कराने वाले परमेश्वर के सामने
  alternative: ‘उसके सामने’, जो परमेश्वर या मसीह के संदर्भ को अधिक खुला छोड़ता है
  rationale: विस्तृत वाक्य-संदर्भ में परमेश्वर मेल कराने वाला कर्ता है; फिर भी यूनानी सर्वनाम स्वयं संज्ञा को दोहराता नहीं, इसलिए संभावित संदर्भगत तनाव को दर्ज किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘देहधारी शरीर’ वास्तविक मानवीय देह पर बल देता है, ‘मेल अपने साथ करा दिया’ संबंध की पुनर्स्थापना स्पष्ट करता है, और पादटिप्पणियाँ यूनानी कर्मवाच्य तथा बलिदान-संबंधी संभावित अर्थ को सुरक्षित रखती हैं।
