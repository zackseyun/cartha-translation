  text: ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/025.yaml
  text: of which I became a servant according to the stewardship from God given to me for you[a], to fulfill the word of God[b],
translation:
  language: hi
  text: मैं उस कलीसिया का सेवक बना, परमेश्वर की ओर से मुझे तुम्हारे लिए सौंपी गई उस जिम्मेदारी के अनुसार, ताकि मैं परमेश्वर के वचन को पूरा करूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताकि मैं परमेश्वर के वचन को पूरी तरह ज्ञात कराऊँ”; अथवा, “ताकि मैं परमेश्वर के वचन को पूर्ण करूँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἧς
  choice: उस कलीसिया का
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम का पूर्वपद पद 24 का ἐκκλησία (‘कलीसिया’) है। हिन्दी में संदर्भ स्पष्ट रखने के लिए संज्ञा दोहराई गई है।
- source_word: ἐγενόμην ἐγὼ διάκονος
  choice: मैं ... सेवक बना
  rationale: ἐγενόμην भूमिका में आने को व्यक्त करता है; διάκονος यहाँ सेवा करनेवाले व्यक्ति को दर्शाता है, किसी बाद के संस्थागत पद को नहीं।
- source_word: κατὰ τὴν οἰκονομίαν τοῦ θεοῦ
  choice: परमेश्वर से मिले उस प्रबंध के अनुसार
  rationale: οἰκονομία सौंपी हुई व्यवस्था, प्रबंध या दायित्व का बोध देता है। ‘प्रबंध’ मूल रूपक को पर्याप्त रूप से बनाए रखता है और ‘परमेश्वर से मिले’ उसके स्रोत को स्पष्ट करता है।
- source_word: τὴν δοθεῖσάν μοι εἰς ὑμᾶς
  choice: जो तुम्हारे लिए मुझे सौंपा गया
  rationale: δοθεῖσάν की निष्क्रियता को ‘सौंपा गया’ द्वारा और εἰς ὑμᾶς की लाभार्थी दिशा को ‘तुम्हारे लिए’ द्वारा व्यक्त किया गया है।
- source_word: πληρῶσαι
  choice: पूरा करूँ
  rationale: πληρόω की व्यापक अर्थ-सीमा—पूरा करना, पूर्ण रूप से प्रकट करना या प्रचार को पूर्णता तक पहुँचाना—को संकुचित किए बिना ‘पूरा करना’ मूल की संक्षिप्तता और तनाव बचाता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: ‘वचन’ λόγος के लिए स्वाभाविक बाइबलीय हिन्दी है और परमेश्वर के संदेश या प्रकाशन का आशय बनाए रखता है।
theological_decisions:
- issue: πληρῶσαι τὸν λόγον τοῦ θεοῦ का आशय
  choice: परमेश्वर के वचन को पूरा करूँ
  alternative: परमेश्वर के वचन को पूरी तरह प्रकट करूँ; परमेश्वर के वचन का प्रचार पूरी तरह करूँ
  rationale: वाक्यांश यह संकेत दे सकता है कि पौलुस वचन को पूर्ण अभिव्यक्ति या पूर्ण प्रचार तक पहुँचाए, अथवा उसे पूरा करे। मुख्य पाठ अपेक्षाकृत व्यापक अनुवाद रखता है और संभावित अर्थों को पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कलीसिया’ स्थापित बाइबलीय शब्दावली के रूप में रखा गया है; ‘सेवक’ और ‘प्रबंध’ से अनावश्यक संस्थागत या सांप्रदायिक अर्थों से बचा गया है।
