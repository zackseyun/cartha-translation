id: COL.1.2
reference: Colossians 1:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τοῖς ἐν ⸀Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ⸀ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/002.yaml
  text: 'To the holy and faithful brothers in Messiah at Colossae: grace to you and peace from God our Father[a][b][c].'
translation:
  language: hi
  text: 'कुलुस्से में रहनेवाले उन पवित्र और विश्वासयोग्य[a] भाइयों[b] के नाम, जो मसीहा में हैं[c]: हमारे पिता परमेश्वर की ओर से तुम्हें अनुग्रह और शांति मिले।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वास करनेवाले”; यूनानी शब्द विश्वास रखनेवाले या विश्वासयोग्य—दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक शब्द “भाइयों” है; इस संदर्भ में पौलुस संभवतः स्त्रियों समेत पूरे समुदाय को संबोधित कर रहा है।
    reason: lexical_alternative
  - marker: c
    text: 'परंपरागत हिंदी रूप: “मसीह में।” यूनानी उपाधि Χριστός का अर्थ “मसीहा” अर्थात “अभिषिक्त जन” है।'
    reason: alternative_reading
lexical_decisions:
- source_word: τοῖς ἐν Κολοσσαῖς
  choice: कुलुस्से में रहनेवाले ... के नाम
  rationale: यह स्थानसूचक वाक्यांश पत्र के प्राप्तकर्ताओं को उनके नगर के आधार पर पहचानता है। हिंदी पत्र-शैली में “के नाम” जोड़ने से संबोधन स्वाभाविक और स्पष्ट बनता है।
- source_word: ἁγίοις
  choice: पवित्र
  rationale: यहाँ विशेषण के रूप में प्रयुक्त शब्द परमेश्वर के लिए अलग किए गए लोगों को दर्शाता है; “पवित्र” मूल अर्थ रखता है और “संत” से जुड़ी बाद की संस्थागत धारणाओं से बचता है।
- source_word: πιστοῖς
  choice: विश्वासयोग्य
  rationale: πιστός विश्वास रखनेवाले या निष्ठावान/विश्वासयोग्य होने—दोनों अर्थ दे सकता है। मुख्य पाठ में चरित्र और निष्ठा का स्वाभाविक अर्थ लिया गया है, जबकि दूसरा संभव अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἀδελφοῖς
  choice: भाइयों
  rationale: यह यूनानी का व्याकरणिक रूप सीधे दर्शाता है। पौलुस के सामुदायिक संबोधन में स्त्रियाँ भी सम्मिलित हो सकती हैं; यह बात पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἐν Χριστῷ
  choice: मसीहा में
  rationale: Χριστός यहाँ उपाधि है। “मसीहा” उसके अर्थ को व्यक्त करता है और “में” पौलुस की संघ/संबंध सूचक अभिव्यक्ति को बिना खोले सुरक्षित रखता है।
- source_word: χάρις ὑμῖν καὶ εἰρήνη
  choice: तुम्हें अनुग्रह और शांति मिले
  rationale: यह पौलुस का अभिवादन-सूत्र है। “मिले” हिंदी में स्वाभाविक आशीर्वचन बनाता है, जबकि अनुग्रह और शांति का यूनानी क्रम बना रहता है।
- source_word: ἀπὸ θεοῦ πατρὸς ἡμῶν
  choice: हमारे पिता परमेश्वर की ओर से
  rationale: यह संबंधसूचक रचना स्वाभाविक रूप से परमेश्वर को “हमारे पिता” के रूप में पहचानती है; ऐसा कोई संयोजक नहीं जोड़ा गया जो यूनानी में नहीं है।
theological_decisions:
- issue: πιστοῖς का अर्थ
  choice: विश्वासयोग्य
  alternative: विश्वास करनेवाले
  rationale: मूल विशेषण विश्वास और विश्वासयोग्यता दोनों की ओर संकेत कर सकता है। पद किसी एक अर्थ को निर्णायक रूप से बाध्य नहीं करता, इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ἀδελφοῖς में लिंग और समुदाय का दायरा
  choice: भाइयों
  alternative: भाइयों और बहनों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग बहुवचन रूप को दर्शाता है, पर संदर्भ में संबोधन संभवतः पूरी कलीसिया, स्त्रियों समेत, के लिए है।
- issue: Χριστός की उपाधि
  choice: मसीहा
  alternative: मसीह
  rationale: यहाँ शब्द उपाधि के रूप में प्रयुक्त है, इसलिए उसका अर्थ प्रकट करने वाला “मसीहा” चुना गया है। प्रचलित हिंदी रूप “मसीह” पादटिप्पणी में दिया गया है।
- issue: ἐν Χριστῷ का संबंधसूचक भाव
  choice: मसीहा में
  alternative: मसीहा से जुड़े हुए
  rationale: शाब्दिक “में” पौलुस की सघन और धर्मवैज्ञानिक रूप से अर्थपूर्ण अभिव्यक्ति को बनाए रखता है; उसे किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। “रहनेवाले” संबोधन को स्वाभाविक बनाता है; “मसीहा में” जानबूझकर मूल की सघन अभिव्यक्ति और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है।
