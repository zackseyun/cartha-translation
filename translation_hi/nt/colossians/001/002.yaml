  terminology: “पवित्र,” “विश्वासयोग्य,” “भाइयों,” “मसीहा,” “अनुग्रह,” and “शांति” are consistent, understandable choices. The footnotes responsibly preserve the ambiguity of πιστοῖς, explain the contextual scope of ἀδελφοῖς without replacing the masculine source wording, and give the traditional form “मसीह” for Χριστός.
