id: COL.1.29
reference: Colossians 1:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/029.yaml
  text: For this I also labor[a], striving according to his working[d][c][b], which is working in me in power.
translation:
  language: hi
  text: इसी उद्देश्य से मैं भी कड़ा परिश्रम करता हूँ[a] और संघर्ष करता हूँ[b], उसकी उस सक्रिय सामर्थ्य के अनुसार[c], जो मुझमें सामर्थ्य के साथ काम कर रही है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसी के लिए” अथवा “जिसके लिए।”
    reason: lexical_alternative
  - marker: b
    text: या, “जी-जान से प्रयत्न करता हूँ।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी में केवल “उसकी” कहा गया है; इस पद में यह स्पष्ट रूप से नहीं बताया गया कि संकेत परमेश्वर की ओर है या मसीह की ओर।
    reason: alternative_reading
  - marker: d
    text: या, “जो मुझमें सामर्थ्यपूर्वक काम कर रही है” अथवा “जो मुझमें सामर्थ्य में कार्यरत है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ὃ
  choice: इसी उद्देश्य से
  rationale: यह पदबंध पिछले पद में बताए गए सेवाकार्य के लक्ष्य की ओर संकेत करता है। यह हिंदी में स्वाभाविक रूप से उद्देश्य व्यक्त करता है, जबकि ‘जिसके लिए’ भी संभव है।
- source_word: καὶ
  choice: भी
  rationale: यह पौलुस के परिश्रम को पिछले कथन से जोड़ते हुए उसका योगात्मक भाव व्यक्त करता है।
- source_word: κοπιῶ
  choice: कड़ा परिश्रम करता हूँ
  rationale: क्रिया थका देने वाले कठोर श्रम का बोध कराती है; केवल ‘काम करता हूँ’ उसकी तीव्रता नहीं दर्शाता।
- source_word: ἀγωνιζόμενος
  choice: संघर्ष करता हूँ
  rationale: यह प्रयत्न, स्पर्धा या कठिन संघर्ष की छवि रखता है और पौलुस के गहन प्रयास को स्पष्ट करता है।
- source_word: κατὰ
  choice: के अनुसार
  rationale: यह उस मानक या परिमाण को व्यक्त करता है जिसके अनुरूप पौलुस संघर्ष करता है, न कि केवल साधन को।
- source_word: ἐνέργειαν
  choice: सक्रिय सामर्थ्य
  rationale: संज्ञा प्रभावकारी क्रियाशीलता या कार्यरत शक्ति को व्यक्त करती है। ‘सक्रिय सामर्थ्य’ हिंदी में इसका शक्ति और क्रिया—दोनों का पहलू बनाए रखता है।
- source_word: αὐτοῦ
  choice: उसकी
  rationale: मूल पाठ में केवल सर्वनाम है; इसे ‘परमेश्वर की’ या ‘मसीह की’ बनाकर संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: τὴν ἐνεργουμένην
  choice: जो ... काम कर रही है
  rationale: वर्तमान कृदंत लगातार जारी प्रभावकारी कार्य को दर्शाता है। स्त्रीलिंग रूप हिंदी में निकटवर्ती ‘सामर्थ्य’ से मेल खाता है।
- source_word: ἐν ἐμοὶ
  choice: मुझमें
  rationale: यह ἐν का सीधा स्थानवाचक अर्थ रखता है और भीतर सामर्थ्य दिए जाने तथा सेवा में उसके प्रकट होने के बीच की व्याख्यात्मक गुंजाइश बचाता है।
- source_word: ἐν δυνάμει
  choice: सामर्थ्य के साथ
  rationale: यह कार्य के शक्तिशाली ढंग को व्यक्त करता है और δύναμις की संज्ञात्मकता को बनाए रखता है।
theological_decisions:
- issue: αὐτοῦ (‘उसकी’) का संदर्भ
  choice: केवल ‘उसकी’ रखकर संदर्भ को खुला रखना
  alternative: ‘परमेश्वर की’ या ‘मसीह की’ सक्रिय सामर्थ्य
  rationale: इस पद में सर्वनाम का पूर्वगामी स्पष्ट रूप से नामित नहीं है। कुलुस्सियों का संदर्भ दोनों व्याख्याओं को विचारणीय बनाता है, इसलिए अनुवाद मूल पाठ से अधिक निश्चित नहीं होता।
- issue: मानवीय परिश्रम और प्रदत्त सामर्थ्य का संबंध
  choice: पौलुस के वास्तविक संघर्ष और उसमें कार्यरत उसकी सामर्थ्य—दोनों को साथ रखना
  alternative: वाक्य को ऐसा बनाना कि परिश्रम केवल मानवीय या केवल ईश्वरीय क्रिया लगे
  rationale: मूल वाक्य पौलुस के कठिन परिश्रम को उस सक्रिय सामर्थ्य के अनुसार चलने वाला बताता है; इस धर्मवैचारिक तनाव को बनाए रखना आवश्यक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कड़ा परिश्रम’ और ‘संघर्ष’ मूल के दो अलग किंतु संबंधित प्रयाससूचक शब्दों को बनाए रखते हैं। ‘सक्रिय सामर्थ्य’ तथा ‘काम कर रही है’ यूनानी संज्ञा और उसके सजातीय कृदंत की पुनरुक्ति को यथासंभव अर्थपूर्ण हिंदी में दर्शाते हैं।
