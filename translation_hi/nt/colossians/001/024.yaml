  text: Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/024.yaml
  text: Now I rejoice in my sufferings for your sake[a], and in my flesh I am filling up what is lacking in the afflictions of the Messiah for the sake of his body, which is the church[b],
translation:
  language: hi
  text: अब मैं तुम्हारे लिए अपने दुःखों में आनन्दित हूँ, और अपने शरीर में मसीह के क्लेशों में जो कमी है, उसे उसकी देह, अर्थात् कलीसिया, के लिए पूरा कर रहा हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “और मसीह के क्लेशों का जो भाग शेष है, उसे मैं ... पूरा कर रहा हूँ।” पौलुस यह नहीं कह रहा कि मसीह का प्रायश्चित्त-कार्य अधूरा था; वह उन क्लेशों में अपनी सहभागिता की बात कर रहा है जो मसीह और उसकी देह, अर्थात् कलीसिया, से जुड़े हैं।'
    reason: वैकल्पिक अनुवाद और कठिन धर्मवैचारिक कथन का स्पष्टीकरण
lexical_decisions:
- source_word: Νῦν
  choice: अब
  rationale: यह पौलुस की वर्तमान परिस्थिति और मनोभाव को सामने लाने वाला स्वाभाविक तथा संक्षिप्त काल-सूचक शब्द है।
- source_word: χαίρω
  choice: मैं ... आनन्दित हूँ
  rationale: वर्तमानकालीन हर्ष को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए अपने दुःखों में
  rationale: सन्दर्भ के कारण दुःख पौलुस के अपने हैं; ὑπέρ का हितार्थक भाव ‘तुम्हारे लिए’ से स्पष्ट होता है।
- source_word: ἀνταναπληρῶ τὰ ὑστερήματα
  choice: जो कमी रह गई है, उसे ... पूरा कर रहा हूँ
  rationale: मूल के ‘कमी’ और ‘पूरा करने’ के प्रबल रूपक तथा उसकी वास्तविक वैचारिक कसावट को बनाए रखता है।
- source_word: τῶν θλίψεων
  choice: क्लेशों
  rationale: पहले आए παθήματα के लिए प्रयुक्त ‘दुःखों’ से भेद रखते हुए दबाव, विपत्ति और कष्ट का अर्थ व्यक्त करता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: हिन्दी में ‘मसीह’ Χριστός के पारम्परिक और व्यापक रूप से समझे जाने वाले शीर्षकीय अर्थ को वहन करता है।
- source_word: ἐν τῇ σαρκί μου
  choice: अपने शरीर में
  rationale: यहाँ σάρξ पौलुस के देहधारी, शारीरिक अस्तित्व को सूचित करता है; हिन्दी में ‘शरीर’ ‘मांस’ की अपेक्षा अधिक स्वाभाविक और अर्थतः स्पष्ट है।
- source_word: ὑπὲρ τοῦ σώματος αὐτοῦ
  choice: उसकी देह के लिए
  rationale: ὑπέρ के हितार्थक भाव को बनाए रखते हुए ‘देह’ के कलीसियाई रूपक को सुरक्षित रखता है।
- source_word: ὅ ἐστιν ἡ ἐκκλησία
  choice: अर्थात् कलीसिया
  rationale: सम्बन्धवाचक उपवाक्य देह की पहचान कलीसिया के रूप में करता है; ‘अर्थात्’ हिन्दी में इस व्याख्यात्मक सम्बन्ध को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘मसीह के क्लेशों में जो कमी रह गई है’ का अर्थ
  choice: मुख्य पाठ में मूल कथन की प्रबलता और अस्पष्टता बनाए रखी गई है; पौलुस कलीसिया के हित में अपने शरीर में इन क्लेशों को पूरा करने की बात करता है।
  alternative: इसे इस प्रकार नरम करना कि केवल ‘मसीह की सेवा से जुड़े शेष कष्ट’ अभिप्रेत हैं, अथवा इसे मसीह के प्रायश्चित्त की वास्तविक कमी मानना।
  rationale: θλίψεις सामान्यतः क्लेशों/विपत्तियों को सूचित करता है और कथन को मसीह की देह, कलीसिया, से जोड़ा गया है। फिर भी अनुवाद को मूल के ‘कमी’ और ‘पूरा करने’ के तनाव को मिटाना नहीं चाहिए। पादटिप्पणी केवल यह स्पष्ट करती है कि पाठ स्वयं मसीह के प्रायश्चित्त को अपर्याप्त नहीं कहता।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त अथवा अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित है और यहाँ शीर्षक के धर्मवैचारिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘दुःख’ और ‘क्लेश’ से πάθημα तथा θλῖψις का शब्दगत भेद बचाया गया है। ‘अपने शरीर में’ शाब्दिक ‘अपने मांस में’ की तुलना में वर्तमान हिन्दी में अधिक स्वाभाविक है, जबकि देहधारी कष्ट का अर्थ सुरक्षित रहता है।
