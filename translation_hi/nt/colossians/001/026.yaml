- source_word: νῦν δὲ
  choice: पर अब
  rationale: पूर्व के छिपे होने और वर्तमान प्रकाशन के बीच स्पष्ट विरोध बनाए रखता है।
- source_word: ἐφανερώθη
  choice: प्रकट किया गया है
  rationale: कर्मवाच्य रूप को सुरक्षित रखता है और हिंदी में घटित प्रकाशन के वर्तमान परिणाम को स्वाभाविक ढंग से व्यक्त करता है, बिना कर्ता को पाठ में जोड़ने के।
- source_word: τοῖς ἁγίοις αὐτοῦ
  choice: उसके पवित्र लोगों पर
  rationale: ‘पवित्र लोगों’ से पौलुस के अनुसार परमेश्वर के लिए अलग किए गए विश्वासियों का समुदाय अभिप्रेत है। ἐφανερώθη के साथ हिंदी में ‘पर प्रकट किया’ स्वाभाविक है और मूल का प्राप्तकर्ता-संबंध रखता है।
theological_decisions:
- issue: τοῖς ἁγίοις αὐτοῦ का आशय
  choice: ‘उसके पवित्र लोग’ परमेश्वर के लिए अलग किए गए विश्वासियों के समुदाय को सूचित करता है।
  alternative: ‘उसके संत’—यह अधिक पारंपरिक है, पर आधुनिक हिंदी में कभी-कभी किसी विशिष्ट आध्यात्मिक या बाद में मान्यता-प्राप्त वर्ग का भ्रम दे सकता है।
  rationale: पौलुस के सामान्य प्रयोग में ἅγιοι सभी विश्वासियों के लिए सामुदायिक पद है, किसी विशिष्ट उच्च वर्ग के लिए नहीं।
- issue: प्रकाशन का कर्ता
  choice: कर्मवाच्य ‘प्रकट किया गया है’ द्वारा कर्ता को अव्यक्त रखा गया है।
  alternative: ‘परमेश्वर ने प्रकट किया है’
  rationale: संदर्भ में परमेश्वर निहित हो सकता है, किंतु इस पद में कर्ता स्पष्ट रूप से नहीं दिया गया; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण। ‘रहस्य’ पौलुस की धार्मिक शब्दावली को बनाए रखता है; ‘पवित्र लोग’ आधुनिक पाठक के लिए ‘संत’ की संभावित संकीर्ण धारणा से बचाता है। मुख्य वाक्य पिछले पद से व्याकरणिक रूप से जुड़ा अंश है, जैसा मूल में है।
