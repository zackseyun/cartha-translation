lexical_decisions:
- source_word: μυστήριον
  choice: रहस्य
  rationale: यह पौलुस के उस विशिष्ट प्रयोग को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है जिसमें परमेश्वर का उद्देश्य पहले छिपा था और अब प्रकट किया गया है; यहाँ इसका अर्थ कोई गूढ़ या मनुष्य-निर्मित पहेली नहीं है।
