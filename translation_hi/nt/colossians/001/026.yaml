  rationale: पूर्णकालिक कर्मवाच्य कृदंत पूर्व में छिपाए जाने से बनी हुई अवस्था दिखाता है; यह हिंदी में उस अर्थ को सहज रूप से रखता है।
- source_word: ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν
