source:
  edition: SBLGNT
  text: ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/013.yaml
  text: who rescued us from the authority of darkness and transferred us into the kingdom of the Son of his love,[a]
translation:
  language: hi
  text: उसी ने हमें अंधकार की सत्ता से छुड़ाया और अपने प्रिय पुत्र के राज्य में स्थानांतरित किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पुत्र के राज्य में जिससे वह प्रेम करता है।” शाब्दिक रूप से, “उसके प्रेम के पुत्र के राज्य में।”
    reason: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ के मुहावरेदार और अधिक शाब्दिक अर्थ-विकल्प।
lexical_decisions:
- source_word: ἐρρύσατο
  choice: छुड़ाया
  rationale: यह शब्द किसी संकट या शत्रुतापूर्ण सत्ता से निर्णायक रूप से बचाने या मुक्त कराने का भाव रखता है। ‘छुड़ाया’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक पारिभाषिकता बढ़ाए बिना मूल अर्थ देता है।
- source_word: ἐξουσίας
  choice: अधिकार
  rationale: ἐξουσία यहाँ शासन करने वाली सत्ता या अधिकार को दर्शाता है। ‘अधिकार’ इसका सीधा समतुल्य है और अंधकार के अधीन क्षेत्र का संकेत भी बनाए रखता है।
- source_word: σκότους
  choice: अंधकार
  rationale: मूल शब्द का सीधा अर्थ ‘अंधकार’ है। उसके नैतिक और आत्मिक निहितार्थों को अनकहा ही रहने दिया गया है।
- source_word: μετέστησεν
  choice: पहुँचा दिया
  rationale: यह क्रिया एक सत्ता-क्षेत्र से दूसरे में स्थानांतरित करने को दर्शाती है। हिन्दी में ‘राज्य में स्थानांतरित किया’ अपेक्षाकृत प्रशासनिक लगता है; ‘पहुँचा दिया’ उसी निर्णायक परिवर्तन को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βασιλείαν
  choice: राज्य
  rationale: βασιλεία राज्य, राजकीय क्षेत्र या शासन का बोध करा सकता है। यहाँ εἰς और स्थानांतरण की छवि के साथ ‘राज्य’ सबसे स्वाभाविक है और पुत्र के शासन का भाव भी रखता है।
- source_word: υἱοῦ
  choice: पुत्र
  rationale: यह मूल शब्द का सीधा अर्थ है। संदर्भ में यह परमेश्वर के विशिष्ट पुत्र को दर्शाता है।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: ἀγάπη का सीधा और स्वाभाविक हिन्दी समतुल्य ‘प्रेम’ है।
- source_word: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ
  choice: अपने प्रेम के पुत्र
  rationale: यह चयन यूनानी संबंधकारक रचना ‘उसके प्रेम का पुत्र’ की बनावट और काव्यात्मक गहनता को यथासंभव बनाए रखता है। हिन्दी वाक्य में कर्ता के प्रति संबंध स्पष्ट करने के लिए ‘अपने’ प्रयुक्त है। अधिक मुहावरेदार अर्थ फुटनोट में दिए गए हैं।
theological_decisions:
- issue: τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ संबंधकारक पदबंध का अनुवाद
  choice: अपने प्रेम के पुत्र
  alternative: अपने प्रिय पुत्र; उस पुत्र, जिससे वह प्रेम करता है
  rationale: मूल पदबंध पिता के पुत्र के प्रति विशेष प्रेम को व्यक्त करता है, पर उसका व्याकरणिक रूप असामान्य और अर्थगर्भित है। मुख्य पाठ में उस रूप को सुरक्षित रखा गया है; स्पष्ट और मुहावरेदार अर्थ-विकल्प फुटनोट में दिए गए हैं ताकि वास्तविक अभिव्यक्तिगत तनाव न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अंधकार के अधिकार’ और ‘अपने प्रेम के पुत्र’ में मूल यूनानी की सघन अभिव्यक्ति जानबूझकर सुरक्षित है; ‘पहुँचा दिया’ औपचारिक ‘स्थानांतरित किया’ की तुलना में सहज हिन्दी देता है।
