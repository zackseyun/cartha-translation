  text: जिसमें हमें छुटकारा[a], अर्थात् पापों की क्षमा, प्राप्त है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छुटकारा’ का अनुवाद ‘मुक्ति’ भी हो सकता है। मूल भाषा में ‘छुटकारा’ और ‘क्षमा’ दोनों शब्दों में छोड़ दिए जाने या मुक्त किए जाने का भाव हो सकता है; यहाँ पौलुस सम्भवतः ‘पापों की क्षमा’ से स्पष्ट करता है कि यह छुटकारा किस बात में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: जिसमें
  rationale: पुल्लिंग एकवचन सम्बन्धवाचक सर्वनाम पिछले पद के प्रिय पुत्र की ओर संकेत करता है। ‘जिसमें’ व्यक्ति के साथ सम्बन्ध और उसमें स्थित होने के भाव को बनाए रखता है।
- source_word: ἔχομεν
  choice: हमें ... मिली है
  rationale: यूनानी वर्तमानकाल वर्तमान में प्राप्त लाभ को व्यक्त करता है। स्वाभाविक हिन्दी में ‘हमें ... मिली है’ इस वर्तमान प्राप्ति को स्पष्ट करता है।
- source_word: ἀπολύτρωσιν
  choice: छुटकारा
  rationale: यह मुक्ति या बन्धन से छुड़ाए जाने का भाव व्यक्त करता है और सामान्य आधुनिक हिन्दी में सहज है; शब्द की सम्भावित ‘कीमत देकर छुड़ाने’ की पृष्ठभूमि को पादटिप्पणी में दर्शाया गया है।
- source_word: ἄφεσιν
  choice: क्षमा
  rationale: पापों के नैतिक सन्दर्भ में ἄφεσις का सबसे स्पष्ट और स्वाभाविक हिन्दी रूप ‘क्षमा’ है; यहाँ यह छुटकारे का स्पष्टीकरण है।
- source_word: τῶν ἁμαρτιῶν
  choice: पापों की
  rationale: सम्बन्धकारक बहुवचन उस विषय को बताता है जिसकी क्षमा होती है; ‘पापों की क्षमा’ मानक और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ‘छुटकारा’ और ‘पापों की क्षमा’ का सम्बन्ध
  choice: 'दूसरे संज्ञा-पद को पहले की समानाधिकरण व्याख्या के रूप में प्रस्तुत किया: ‘छुटकारा, अर्थात् पापों की क्षमा।’'
  alternative: 'अधिक शाब्दिक विराम के साथ: ‘छुटकारा, पापों की क्षमा।’'
  rationale: यूनानी में ‘पापों की क्षमा’ ‘छुटकारा’ के समानाधिकरण में है और बताता है कि यहाँ यह छुटकारा किस रूप में है। हिन्दी में ‘अर्थात्’ इस व्याकरणिक सम्बन्ध को स्पष्ट और सहज बनाता है, बिना कोई अतिरिक्त धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘जिसमें’ पिछले पद के पुत्र से व्यक्तिगत सम्बन्ध बनाए रखता है। मुख्य वाक्य में समानाधिकरण को स्वाभाविक बनाने के लिए ‘अर्थात्’ जोड़ा गया है; पादटिप्पणी वास्तविक शब्दार्थ-सम्बन्ध और वैकल्पिक अनुवाद को सुरक्षित रखती है।
