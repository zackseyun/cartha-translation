id: COL.1.8
reference: Colossians 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/008.yaml
  text: and who also made known to us your love in the Spirit[a].
translation:
  language: hi
  text: और उसी ने हमें आत्मा में आपके प्रेम के बारे में भी बताया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपके आत्मिक प्रेम के बारे में,” अर्थात ऐसा प्रेम जो आत्मिक भाव से उत्पन्न होता है।
    reason: ἐν πνεύματι को पवित्र आत्मा के स्पष्ट संदर्भ के बजाय प्रेम के आत्मिक स्वरूप या भाव के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: ὁ ... δηλώσας
  choice: उसी ने ... बताया
  rationale: संज्ञात्मक कृदन्त पिछले पद के इपफ्रास की ओर संकेत करता है। हिन्दी में ‘उसी ने ... बताया’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है; δηλόω का अर्थ यहाँ किसी बात की सूचना देना या उसे प्रकट करना है।
- source_word: καὶ
  choice: और ... भी
  rationale: ‘और’ पिछले पद से संबंध बनाए रखता है, जबकि ‘भी’ इपफ्रास के एक और कार्य को जोड़ने वाला भाव व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमें
  rationale: 'सम्प्रदान कारक को अप्रत्यक्ष कर्म के रूप में व्यक्त किया गया है: इपफ्रास ने पौलुस और उसके साथियों को यह बात बताई।'
- source_word: τὴν ὑμῶν ἀγάπην
  choice: आपके प्रेम के बारे में
  rationale: ἀγάπη का सामान्य और स्पष्ट अनुवाद ‘प्रेम’ है। ‘के बारे में बताया’ हिन्दी में सूचना देने के भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν πνεύματι
  choice: आत्मा में
  rationale: यह पदबंध सम्भवतः पवित्र आत्मा की ओर संकेत करता है, पर यूनानी में ‘आत्मा’ के साथ निश्चित उपपद नहीं है और इसे आत्मिक भाव या क्षेत्र के अर्थ में भी समझा जा सकता है। मुख्य पाठ का ‘आत्मा में’ इस संक्षिप्तता और सम्भावित अर्थ-संदर्भ को बनाए रखता है।
theological_decisions:
- issue: πνεύματι का अभिप्रेत संदर्भ
  choice: मुख्य पाठ में ‘आत्मा में’, जिसे पवित्र आत्मा के संदर्भ में समझा जा सकता है
  alternative: ‘आत्मिक प्रेम’ या ‘आत्मिक भाव से प्रेम’
  rationale: पौलुस के प्रयोग और मसीही फल के प्रसंग में पवित्र आत्मा सम्भावित संदर्भ है, किन्तु व्याकरण दूसरे अर्थ को पूरी तरह बंद नहीं करता। इसलिए मुख्य पाठ में ‘आत्मा में’ रखा गया और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आपके’ बहुवचन समुदाय के लिए सम्मानसूचक और सामान्य आधुनिक हिन्दी रूप है।
