source:
  edition: SBLGNT
  text: ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν ⸀Χριστῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/028.yaml
  text: Him we proclaim, warning every person and teaching every person with all wisdom, so that we may present every person mature in Messiah.
translation:
  language: hi
  text: हम उसी की घोषणा करते हैं। हम हर व्यक्ति को चेतावनी देते और सारी बुद्धि के साथ हर व्यक्ति को शिक्षा देते हैं, ताकि हम मसीह में परिपक्व हर व्यक्ति को प्रस्तुत करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγγέλλομεν
  choice: प्रचार करते हैं
  rationale: यह क्रिया सार्वजनिक रूप से घोषणा या प्रचार करने का भाव रखती है; आधुनिक धार्मिक हिंदी में ‘प्रचार’ स्वाभाविक और स्पष्ट है।
- source_word: νουθετοῦντες
  choice: चेतावनी देते
  rationale: शब्द में मन पर बात रखकर सुधारने, समझाने और सावधान करने का भाव है; प्रसंग और परामर्श-पाठ के ‘warning’ के अनुरूप ‘चेतावनी देते’ चुना गया।
- source_word: ἐν πάσῃ σοφίᾳ
  choice: पूरी बुद्धि के साथ
  rationale: ἐν को साधन या रीति के अर्थ में लिया गया है और πάσῃ के व्यापक बल को ‘पूरी’ से व्यक्त किया गया है।
- source_word: τέλειον
  choice: परिपक्व
  rationale: यहाँ लक्ष्य नैतिक या आध्यात्मिक प्रौढ़ता है; ‘सिद्ध’ अनपेक्षित रूप से दोषरहित पूर्णता का अर्थ दे सकता है।
- source_word: ἐν Χριστῷ
  choice: मसीह में
  rationale: पौलुस की सहभागिता और संबंधसूचक अभिव्यक्ति को बिना विस्तार या संप्रदायगत व्याख्या के बनाए रखता है।
theological_decisions:
- issue: τέλειον का अर्थ
  choice: परिपक्व
  alternative: सिद्ध/पूर्ण
  rationale: इस प्रसंग में शिक्षा और चेतावनी का उद्देश्य व्यक्ति को मसीह में प्रौढ़ बनाना है; ‘परिपक्व’ मूल के लक्ष्यसूचक अर्थ को सहज हिंदी में व्यक्त करता है।
- issue: πάντα ἄνθρωπον की तीन बार पुनरावृत्ति
  choice: हर व्यक्ति को तीनों स्थानों पर बनाए रखा
  alternative: बाद की आवृत्तियों को सर्वनाम या सामूहिक पद से संक्षिप्त करना
  rationale: मूल की जोरदार सार्वभौमिकता और अलंकारिक पुनरावृत्ति को सुरक्षित रखना आवश्यक है।
- issue: ἵνα παραστήσωμεν में प्रस्तुत करने वाले
  choice: हम ... प्रस्तुत करें
  alternative: वे प्रस्तुत किए जाएँ
  rationale: मूल का प्रथम पुरुष बहुवचन और सेवकाई की उत्तरदायित्वपूर्ण भूमिका स्पष्ट रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण। मूल की ‘हर व्यक्ति’ वाली त्रिस्तरीय पुनरावृत्ति जानबूझकर रखी गई है। वाक्य को हिंदी में स्पष्टता के लिए दो वाक्यों में विभाजित किया गया है, जबकि अर्थ-संबंध सुरक्षित है।
