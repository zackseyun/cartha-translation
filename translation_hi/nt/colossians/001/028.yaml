revisions:
- from: उसी का हम प्रचार करते हैं। हम हर व्यक्ति को चेतावनी देते और हर व्यक्ति को पूरी बुद्धि के साथ शिक्षा देते हैं, ताकि हम हर व्यक्ति को मसीह में परिपक्व करके प्रस्तुत करें।
  to: हम उसी की घोषणा करते हैं। हम हर व्यक्ति को चेतावनी देते और सारी बुद्धि के साथ हर व्यक्ति को शिक्षा देते हैं, ताकि हम मसीह में परिपक्व हर व्यक्ति को प्रस्तुत करें।
  rationale: The revision retains the source’s emphatic threefold ‘हर व्यक्ति,’ its paired participial activities, its comprehensive ‘सारी बुद्धि,’ and the first-person plural purpose. It avoids making maturity an added preliminary action rather than the stated quality of each person presented.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:32:13Z'
review_pass:
  verdict: revise
  source_fidelity: The draft preserves the threefold repetition of πάντα ἄνθρωπον, the first-person plural purpose clause, and τέλειον as ‘परिपक्व.’ However, ‘परिपक्व करके प्रस्तुत करें’ can imply that the act of presenting is performed by first making each person mature, whereas τέλειον directly describes the person presented.
  naturalness: The wording is generally clear and modern. ‘हम उसी की घोषणा करते हैं’ is more direct and idiomatic for the fronted relative pronoun and καταγγέλλομεν than ‘उसी का हम प्रचार करते हैं,’ while retaining the public-proclamation sense.
  terminology: ‘चेतावनी देते,’ ‘परिपक्व,’ and ‘मसीह में’ are suitable, nonsectarian renderings in this context. ‘सारी बुद्धि के साथ’ more naturally conveys ἐν πάσῃ σοφίᾳ than ‘पूरी बुद्धि के साथ,’ which can suggest an individual’s complete intellectual capacity.
  issues:
  - severity: medium
    issue: ‘परिपक्व करके प्रस्तुत करें’ adds a potentially instrumental/causative nuance.
    rationale: The Greek says to ‘present every person mature in Christ’; it does not grammatically state ‘make every person mature and then present [them].’ Rendering ‘मसीह में परिपक्व हर व्यक्ति को प्रस्तुत करें’ retains the predicative description.
  - severity: low
    issue: ‘पूरी बुद्धि के साथ’ is less idiomatic for ἐν πάσῃ σοφίᾳ.
    rationale: ‘सारी बुद्धि के साथ’ expresses ‘with all wisdom’ naturally without implying a total quantity of personal intelligence.
  - severity: low
    issue: ‘उसी का हम प्रचार करते हैं’ is somewhat awkward and less direct.
    rationale: ‘हम उसी की घोषणा करते हैं’ naturally conveys ‘Him we proclaim’ and preserves the emphatic placement of ‘उसी.’
  revised_text: हम उसी की घोषणा करते हैं। हम हर व्यक्ति को चेतावनी देते और सारी बुद्धि के साथ हर व्यक्ति को शिक्षा देते हैं, ताकि हम मसीह में परिपक्व हर व्यक्ति को प्रस्तुत करें।
  revised_footnotes: []
  revision_rationale: The revision retains the source’s emphatic threefold ‘हर व्यक्ति,’ its paired participial activities, its comprehensive ‘सारी बुद्धि,’ and the first-person plural purpose. It avoids making maturity an added preliminary action rather than the stated quality of each person presented.
