source:
  edition: SBLGNT
  text: Διὰ τοῦτο καὶ ἡμεῖς, ἀφ’ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/009.yaml
  text: For this reason[a], we also, from the day we heard, have not ceased praying for you and asking that you may be filled with the knowledge of his will in all spiritual wisdom and understanding[b],
translation:
  language: hi
  text: इसी कारण हम भी, जिस दिन से हमने यह सुना है, तुम्हारे लिए प्रार्थना करने और यह माँगने से नहीं रुकते कि तुम हर प्रकार की आत्मिक बुद्धि और समझ के साथ उसकी इच्छा के ज्ञान[a] से भर जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पूर्ण ज्ञान’ अथवा ‘गहरा ज्ञान।’ यूनानी शब्द अधिक पूर्ण या गहरे ज्ञान का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद पिछले कथन की ओर संकेत करते हुए कारण और निष्कर्ष, दोनों का संबंध व्यक्त करता है। ‘इसी कारण’ आधुनिक हिन्दी में स्वाभाविक है और उस संबंध को बनाए रखता है।
- source_word: καὶ ἡμεῖς
  choice: हम भी
  rationale: καί वक्ताओं को पहले बताए गए प्रत्युत्तर में सम्मिलित करता है; ‘हम भी’ इस बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀφ’ ἧς ἡμέρας ἠκούσαμεν
  choice: जिस दिन से हमने यह सुना है
  rationale: यह उनकी निरंतर प्रार्थना के आरम्भ-बिंदु को दिखाता है। ‘यह’ पूर्ववर्ती समाचार की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: οὐ παυόμεθα
  choice: नहीं रुकते
  rationale: वर्तमान काल का रूप अब तक जारी क्रिया को व्यक्त करता है। ‘नहीं रुकते’ हिन्दी में निरंतरता को स्पष्ट और सहज ढंग से बताता है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: यहाँ ὑπέρ प्रार्थना से लाभ पाने वालों को दर्शाता है; ‘तुम्हारे लिए’ सामान्य और स्पष्ट हिन्दी प्रयोग है।
- source_word: προσευχόμενοι καὶ αἰτούμενοι
  choice: प्रार्थना करने और यह माँगने
  rationale: 'दोनों कृदंतों को अलग रखा गया है: पहला सामान्य प्रार्थना और दूसरा विशिष्ट विनती व्यक्त करता है।'
- source_word: ἵνα πληρωθῆτε
  choice: कि तुम ... भर जाओ
  rationale: यह उनकी माँग की विषय-वस्तु है। कर्मवाच्य भाव को बनाए रखा गया है और भरने वाले को, यूनानी पाठ की तरह, स्पष्ट रूप से नामित नहीं किया गया।
- source_word: τὴν ἐπίγνωσιν
  choice: ज्ञान
  rationale: ἐπίγνωσις में पूर्णतर या गहरे ज्ञान का भाव हो सकता है, पर ‘ज्ञान’ मुख्य पाठ में अर्थ को अनावश्यक रूप से तीव्र किए बिना संज्ञा का मूल भार बनाए रखता है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοῦ θελήματος αὐτοῦ
  choice: उसकी इच्छा के
  rationale: यह संबंधकारक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है; संदर्भ में ‘उसकी’ परमेश्वर की ओर संकेत करता है।
- source_word: ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ
  choice: सारी आत्मिक बुद्धि और समझ में
  rationale: ἐν को क्षेत्र अथवा साथ रहने वाली रीति के अर्थ में खुला रखा गया है। ‘आत्मिक’ को स्वाभाविक रूप से ‘बुद्धि’ और ‘समझ’ दोनों से संबंधित पढ़ा जा सकता है।
- source_word: σοφίᾳ
  choice: बुद्धि
  rationale: यह σοφία का स्थापित और सामान्य हिन्दी समतुल्य है, जिसमें व्यावहारिक तथा धार्मिक विवेक दोनों समा सकते हैं।
- source_word: συνέσει
  choice: समझ
  rationale: यह समझने और बातों के परस्पर संबंध को ग्रहण करने की क्षमता व्यक्त करता है तथा ‘बुद्धि’ के साथ सहज युग्म बनाता है।
theological_decisions:
- issue: ἐπίγνωσις का बल
  choice: ज्ञान
  alternative: पूरा ज्ञान; गहरा ज्ञान
  rationale: इस शब्द में अधिक पूर्ण या गहरे ज्ञान की छाया हो सकती है, किंतु तत्कालीन वाक्य-रचना इसे मुख्य पाठ में अनिवार्य नहीं करती। इसलिए मुख्य पाठ संयत रखा गया है और अर्थ-छाया पादटिप्पणी में सुरक्षित है।
- issue: πνευματικῇ का आशय
  choice: आत्मिक
  alternative: पवित्र आत्मा से दी गई बुद्धि और समझ
  rationale: विशेषण आत्मिक स्वरूप या पवित्र आत्मा से संबंध—दोनों की ओर संकेत कर सकता है। यूनानी की संक्षिप्तता और संभावित द्विअर्थता बनाए रखने के लिए मुख्य पाठ में ‘आत्मिक’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। वाक्य की प्रार्थनात्मक निरंतरता और यूनानी पाठ की धर्मवैज्ञानिक खुलावट सुरक्षित रखी गई है।
