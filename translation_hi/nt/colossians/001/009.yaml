  to: इसी कारण हम भी, जिस दिन से हमने यह सुना है, तुम्हारे लिए प्रार्थना करने और यह माँगने से नहीं रुकते कि तुम हर प्रकार की आत्मिक बुद्धि और समझ के साथ उसकी इच्छा के ज्ञान[a] से भर जाओ।
