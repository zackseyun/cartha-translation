  text: ⸀καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν, ὅς ἐστιν πιστὸς ὑπὲρ ⸀ἡμῶν διάκονος τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/007.yaml
  text: just as you learned from Epaphras[a], our beloved fellow servant, who is a faithful minister of the Messiah on our behalf[c][b],
translation:
  language: hi
  text: जैसा कि तुमने हमारे प्रिय सहदास इपफ्रास से सीखा, जो हमारी ओर से मसीह का विश्वासयोग्य सेवक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθὼς
  choice: जैसा कि
  rationale: यह पिछले कथन के साथ अनुरूपता जोड़ता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐμάθετε ἀπὸ Ἐπαφρᾶ
  choice: तुमने … इपफ्रास से सीखा
  rationale: ἀπό सीखने के स्रोत को दर्शाता है; कर्म को यूनानी की तरह अव्यक्त रखा गया है।
- source_word: ἀγαπητοῦ συνδούλου ἡμῶν
  choice: हमारे प्रिय सहदास
  rationale: ‘प्रिय’ स्नेह को और ‘सहदास’ एक ही स्वामी के अधीन दास होने के साझा संबंध को बनाए रखता है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यहाँ इपफ्रास की सेवा में निष्ठा और भरोसेमंदी का वर्णन है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारी ओर से
  rationale: ὑπέρ प्रतिनिधित्व अथवा हित में किए गए कार्य का भाव दे सकता है; यह अनुवाद उस अर्थ को खुला रखता है।
- source_word: διάκονος
  choice: सेवक
  rationale: संदर्भ मसीह की सेवा करने वाले व्यक्ति का है; ‘सेवक’ बाद के किसी औपचारिक कलीसियाई पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: τοῦ Χριστοῦ
  choice: मसीह का
  rationale: ‘मसीह’ हिन्दी में Χριστός के अभिषिक्त जन संबंधी उपाधिगत अर्थ का स्थापित और स्वाभाविक रूप है।
theological_decisions:
- issue: σύνδουλος में दासत्व की छवि
  choice: सहदास
  alternative: सहसेवक
  rationale: ‘सहदास’ एक ही स्वामी के अधिकार में साथ होने की मूल छवि को सुरक्षित रखता है; ‘सहसेवक’ अधिक सहज है, पर दासत्व के बल को नरम कर देता है।
- issue: ὑπὲρ ἡμῶν का संबंध
  choice: हमारी ओर से
  alternative: हमारे लिए
  rationale: चुना हुआ रूप प्रतिनिधित्व के भाव को स्पष्ट करता है, जबकि लाभ के व्यापक अर्थ को निषिद्ध नहीं करता।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ आधुनिक हिन्दी में इस उपाधि का व्यापक, अर्थपूर्ण और संप्रदाय-निरपेक्ष रूप है।
- issue: ὑπὲρ के बाद सर्वनाम की पाठ-भिन्नता
  choice: हमारी ओर से
  alternative: तुम्हारी ओर से
  rationale: मुख्य पाठ SBLGNT के ἡμῶν का अनुसरण करता है; वैकल्पिक प्राचीन पाठ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सहदास’ सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर यूनानी रूपक को सुरक्षित रखने के लिए चुना गया है। मूल यूनानी के लंबे वाक्यांश को हिन्दी में दो वाक्यों में बाँटा गया है ताकि अर्थ सहज रहे।
