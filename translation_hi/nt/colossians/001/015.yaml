  text: He is the image of the invisible God[a], the firstborn of all creation.
translation:
  language: hi
  text: वह अदृश्य परमेश्वर का प्रतिरूप है, सारी सृष्टि का पहलौठा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहलौठा’ यहाँ केवल जन्म-क्रम नहीं, बल्कि सर्वोच्च पद और उत्तराधिकार के अधिकार को भी सूचित कर सकता है। इसलिए इस पदबंध का अर्थ ‘सारी सृष्टि पर प्रधान’ भी समझा जाता है; अगले पदों से तुलना करें।
    reason: πάσης κτίσεως सम्बन्धकारक के अर्थ और πρωτότοκος के पद/उत्तराधिकार-संबंधी भाव की वास्तविक व्याख्यात्मक अस्पष्टता बताने के लिए।
lexical_decisions:
- source_word: ὅς ἐστιν
  choice: वह ... है
  rationale: सम्बन्धवाचक सर्वनाम का संकेत पिछले पद में आए पुत्र की ओर है। हिन्दी में स्वतंत्र वाक्य के आरम्भ में ‘वह ... है’ स्वाभाविक और स्पष्ट है।
- source_word: εἰκὼν
  choice: प्रतिरूप
  rationale: ‘प्रतिरूप’ मूल के प्रतिनिधित्व और उसे प्रकट करने—दोनों भावों को बनाए रखता है; ‘छवि’ की अपेक्षा यहाँ अधिक गरिमापूर्ण और स्पष्ट है।
- source_word: τοῦ θεοῦ τοῦ ἀοράτου
  choice: अदृश्य परमेश्वर का
  rationale: यह यूनानी सम्बन्धकारक रचना का सीधा और स्वाभाविक हिन्दी रूप है तथा परमेश्वर के दिखाई न देने पर बल बनाए रखता है।
- source_word: πρωτότοκος
  choice: पहलौठा
  rationale: यह ‘पहले जन्मे’ के रूपक और उसके बाइबलीय पद, अधिकार तथा उत्तराधिकार-संबंधी अर्थों को बिना किसी एक व्याख्या में सीमित किए सुरक्षित रखता है।
- source_word: πάσης κτίσεως
  choice: सारी सृष्टि का
  rationale: यह सम्बन्धकारक पदबंध का निकटतम स्वाभाविक अनुवाद है। ‘सृष्टि पर’ कहना सम्भावित प्रधानता के अर्थ को मुख्य पाठ में ही निश्चित कर देता, इसलिए उस व्याख्यात्मक अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: πρωτότοκος πάσης κτίσεως में मसीह और सृष्टि का सम्बन्ध
  choice: सारी सृष्टि का पहलौठा
  alternative: सारी सृष्टि पर प्रधान पहलौठा
  rationale: यूनानी सम्बन्धकारक को सीधे रखते हुए पाठ की वास्तविक अर्थगत तनातनी सुरक्षित रखी गई है। ‘पहलौठा’ कालक्रम के साथ-साथ पद, अधिकार और उत्तराधिकार भी सूचित कर सकता है; अगले पद मसीह को सृष्टि का कर्ता और लक्ष्य बताते हैं। इसलिए मुख्य पाठ में उसे स्पष्टतः सृष्ट प्राणी बताना या ‘पर’ जोड़कर केवल प्रधानता का अर्थ निश्चित करना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रतिरूप’ और ‘पहलौठा’ परिचित बाइबलीय शब्द हैं, पर पादटिप्पणी ‘पहलौठा’ के सम्भावित पद-संबंधी अर्थ को सामान्य पाठक के लिए स्पष्ट करती है।
