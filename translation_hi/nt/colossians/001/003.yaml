  text: Εὐχαριστοῦμεν τῷ ⸀θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε ⸀περὶ ὑμῶν προσευχόμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/003.yaml
  text: We always give thanks to God[a], the Father of our Lord Jesus the Messiah, when we pray for you,
translation:
  language: hi
  text: जब हम तुम्हारे लिए प्रार्थना करते हैं, तब हम सदा हमारे प्रभु यीशु मसीह[a] के पिता परमेश्वर को धन्यवाद देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परम्परागत रूप में, “यीशु ख्रीस्त।”
    reason: Χριστός का ‘मसीह’ अर्थानुवाद है; ‘ख्रीस्त’ उसी उपाधि का पारम्परिक लिप्यन्तरित रूप है।
lexical_decisions:
- source_word: Εὐχαριστοῦμεν
  choice: हम … धन्यवाद देते हैं
  rationale: यह क्रिया कृतज्ञता व्यक्त करने को दर्शाती है; पत्र के धन्यवाद-वचन में यह स्वाभाविक और अर्थनिष्ठ हिन्दी है।
- source_word: τῷ θεῷ πατρὶ τοῦ κυρίου ἡμῶν
  choice: अपने प्रभु … के पिता परमेश्वर को
  rationale: θεῷ और πατρὶ समानाधिकरण में हैं। हिन्दी में यह क्रम सम्बन्ध को स्पष्ट रखते हुए भारी विराम-चिह्नों से बचाता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος की मानक उपाधि को सीधे और प्रतिष्ठित हिन्दी में सुरक्षित रखता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός की उपाधिगत शक्ति को ‘मसीह’ व्यक्त करता है; हिन्दी में ‘यीशु मसीह’ स्वाभाविक और सुस्थापित रूप है।
- source_word: πάντοτε
  choice: सदा
  rationale: πάντοτε का सीधा अर्थ ‘सदा’ है। इसे मुख्य क्रिया ‘धन्यवाद देते हैं’ से जोड़ा गया है, जबकि यूनानी वाक्य-विन्यास में इसके सम्बन्ध की कुछ सम्भावित अस्पष्टता बनी रहती है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे लिए
  rationale: प्रार्थना के सन्दर्भ में περί + सम्बन्धकारक मध्यस्थ प्रार्थना का लक्ष्य बताता है; आधुनिक हिन्दी में ‘के लिए’ स्वाभाविक है।
- source_word: προσευχόμενοι
  choice: जब हम … प्रार्थना करते हैं
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चल रही परिस्थिति बताता है; ‘जब’ सहज हिन्दी में उस सामयिक सम्बन्ध को व्यक्त करता है।
theological_decisions:
- issue: Χριστός को पौलुस के धन्यवाद-वचन में कैसे प्रस्तुत किया जाए
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: यहाँ Χριστός को अर्थपूर्ण उपाधि के रूप में समझना सम्भव है। ‘मसीह’ उस उपाधिगत अर्थ को बनाए रखता है और हिन्दी मसीही प्रयोग में भी स्वाभाविक है; ‘ख्रीष्ट’ अधिक प्रत्यक्ष यूनानी लिप्यन्तरण है।
- issue: πάντοτε का व्याकरणिक सम्बन्ध
  choice: 'मुख्य धन्यवाद देने की क्रिया से: ‘हम सदा … धन्यवाद देते हैं’'
  alternative: 'प्रार्थना से: ‘तुम्हारे लिए सदा प्रार्थना करते हुए’'
  rationale: शब्द-क्रम और पत्रात्मक धन्यवाद-वाक्यों का सामान्य प्रयोग इसे मुख्य क्रिया से जोड़ने का समर्थन करते हैं, पर यूनानी रचना दूसरे सम्बन्ध को पूरी तरह असम्भव नहीं बनाती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामूहिक पत्र-शैली वाला रूप। ‘तुम्हारे’ बहुवचन समुदाय को सम्बोधित करता है। वाक्य-क्रम हिन्दी की स्वाभाविकता के लिए बदला गया है, पर स्रोत के सभी अर्थ-घटक सुरक्षित हैं।
