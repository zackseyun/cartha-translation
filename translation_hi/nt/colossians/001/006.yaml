  yaml_path: translation/nt/colossians/001/006.yaml
  text: which has come to you[a], just as also in all the world it is bearing fruit and growing, just as also among you[d][c][b], from the day you heard and came to know the grace of God in truth.
translation:
  language: hi
  text: जो तुम्हारे पास पहुँचा है[a] और जो सारे संसार में[b] फल ला रहा और बढ़ रहा है, वैसे ही तुम्हारे बीच[c] भी उस दिन से फल ला रहा और बढ़ रहा है जब तुमने परमेश्वर के अनुग्रह को सुना और सत्य में[d] जान लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो तुम्हारे साथ उपस्थित है” अथवा “जो तुम्हारे बीच आ पहुँचा है।”
    reason: lexical_alternative
  - marker: b
    text: या “पूरे संसार भर में।”
    reason: lexical_alternative
  - marker: c
    text: या “तुममें भी”; यूनानी पद समुदाय के बीच होने वाले कार्य या उनके भीतर होने वाले कार्य, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: या “सचमुच” अथवा “सत्य के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦ παρόντος εἰς ὑμᾶς
  choice: जो तुम्हारे पास पहुँचा है
  rationale: यह कृदन्त पद पिछले वचन के “सुसमाचार” का वर्णन जारी रखता है। “पहुँचा है” उसके आगमन और अब उपस्थित होने, दोनों के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν παντὶ τῷ κόσμῳ
  choice: सारे संसार में
  rationale: यह पौलुस की व्यापक, आलंकारिक विश्व-दृष्टि को बनाए रखता है और इसे हर स्थान या हर व्यक्ति के बारे में कठोर भौगोलिक दावा नहीं बनाता।
- source_word: ἐστὶν καρποφορούμενον καὶ αὐξανόμενον
  choice: वह फल ला रहा और बढ़ रहा है
  rationale: वर्तमान कृदन्तों की निरंतर क्रिया तथा फल लाने की कृषि-संबंधी उपमा दोनों सुरक्षित रहती हैं।
- source_word: καθὼς καὶ ἐν ὑμῖν
  choice: वैसे ही तुम्हारे बीच भी
  rationale: बहुवचन समुदाय के भीतर सुसमाचार के कार्य को स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी “तुममें” का आंतरिक अर्थ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἐπέγνωτε
  choice: जाना
  rationale: यह केवल सूचना पाने से आगे वास्तविक पहचान या ज्ञान का भाव दे सकता है; प्रसंग में साधारण “जाना” इसे अनावश्यक रूप से बढ़ाए बिना व्यक्त करता है।
- source_word: τὴν χάριν τοῦ θεοῦ
  choice: परमेश्वर के अनुग्रह को
  rationale: पौलुस के केंद्रीय धर्मवैचारिक पद को स्पष्ट और औपचारिक हिन्दी में सुरक्षित रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सत्य में
  rationale: यह यूनानी संरचना को बनाए रखकर “सचमुच” और “सत्य के क्षेत्र/विषय में” के बीच की वास्तविक अर्थगत खुलावट को सुरक्षित रखता है।
theological_decisions:
- issue: “सारे संसार” का विस्तार
  choice: सुसमाचार के व्यापक प्रसार का आलंकारिक विश्वव्यापी वर्णन
  alternative: पृथ्वी के हर क्षेत्र और प्रत्येक व्यक्ति तक उस समय पहुँच चुकने का अक्षरशः दावा
  rationale: मूल पाठ की सार्वभौमिक भाषा रखी गई है, पर मुख्य पाठ में ऐसा कोई विस्तार नहीं जोड़ा गया जो इसे आधुनिक भौगोलिक अर्थ में कठोर दावा बना दे।
- issue: ἐν ἀληθείᾳ का अर्थ
  choice: “सत्य में,” ताकि रीति और क्षेत्र/विषय दोनों की संभावना बनी रहे
  alternative: “सचमुच” अथवा “सत्य के रूप में”
  rationale: यूनानी पदबंध एक से अधिक निकट-संबंधित अर्थ स्वीकार करता है; अनुवाद उसे चुपचाप किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। वाक्य पिछले वचन से जुड़े यूनानी संबंधवाचक रूप के कारण “जो” से आरम्भ होता है। “सत्य में” सामान्य बोलचाल से कुछ अधिक औपचारिक है, पर मूल की अर्थगत अस्पष्टता सुरक्षित रखने के लिए उपयुक्त है।
