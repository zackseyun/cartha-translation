    text: या, ‘ज्योति में पवित्र जनों की विरासत के लिए ठहराया गया भाग।’ यूनानी शब्दावली चिट्ठी द्वारा ठहराए गए विरासत के हिस्से की छवि जगाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐχαριστοῦντες
  choice: धन्यवाद करते हुए
  rationale: वर्तमानकालिक कृदन्त का रूप रखा गया है, ताकि पिछले वाक्य से इसका व्याकरणिक प्रवाह और निरन्तर धन्यवाद देने का भाव बना रहे।
- source_word: τῷ πατρὶ
  choice: पिता का
  rationale: यूनानी पाठ में केवल निश्चित सम्बोधन ‘पिता’ है; ‘परमेश्वर’ जोड़ना इस पद के स्पष्ट शब्दों से आगे जाता। हिन्दी में ‘का धन्यवाद करना’ स्वाभाविक प्रयोग है।
- source_word: ἱκανώσαντι
  choice: योग्य बनाया है
  rationale: ἱκανόω का अर्थ किसी को पर्याप्त, उपयुक्त या योग्य बनाना है। यह अनुवाद केवल अनुमति या सामर्थ्य देने के बजाय उस किए गए कार्य को व्यक्त करता है।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: प्रदत्त SBLGNT पाठ में द्वितीय पुरुष बहुवचन ὑμᾶς है। ‘हमें’ वाला पाठान्तर पाद-टिप्पणी में रखा गया है।
- source_word: εἰς τὴν μερίδα
  choice: हिस्सा पाने
  rationale: μερίς किसी भाग या हिस्से को दर्शाता है। ‘हिस्सा पाने’ आधुनिक हिन्दी में स्वाभाविक है और εἰς के लक्ष्य अथवा परिणाम के भाव को सन्दर्भानुसार व्यक्त करता है।
- source_word: τοῦ κλήρου
  choice: विरासत में
  rationale: κλῆρος का अर्थ चिट्ठी से मिला भाग, निर्धारित हिस्सा या विरासत हो सकता है। यहाँ ‘विरासत’ पवित्र जनों की भावी भागीदारी और पुराना नियम की भूमि-विभाजन वाली पृष्ठभूमि दोनों को सुबोध रूप में व्यक्त करती है।
- source_word: τῶν ἁγίων
  choice: पवित्र जनों की
  rationale: यह पौलुस के प्रयोग में परमेश्वर के लिए अलग किए गए लोगों को सूचित करता है। ‘पवित्र जन’ शब्दार्थ को बनाए रखते हुए साधारण पाठक के लिए स्पष्ट है।
- source_word: ἐν τῷ φωτί
  choice: ज्योति में
  rationale: स्थानिक और रूपकात्मक अभिव्यक्ति को बिना अतिरिक्त व्याख्या के रखा गया है, जिससे उसका धर्मवैचारिक विस्तार और निकटवर्ती पदबंध से सम्बन्ध सुरक्षित रहता है।
theological_decisions:
- issue: कर्मवाचक सर्वनाम का पाठान्तर
  choice: तुम्हें
  alternative: हमें
  rationale: प्रदत्त यूनानी पाठ ὑμᾶς (‘तुम्हें’) पढ़ता है। कुछ पाण्डुलिपियों के ἡμᾶς (‘हमें’) को मुख्य पाठ में मिलाने के बजाय पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: μερίς और κλῆρος की संयुक्त विरासत-छवि
  choice: विरासत में हिस्सा पाने
  alternative: पवित्र जनों के लिए ठहराया गया भाग
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए साझा विरासत का भाव व्यक्त किया गया है; निर्धारित अथवा चिट्ठी से बाँटे भाग की अधिक शाब्दिक छवि पाद-टिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। पद पिछले वाक्य से जुड़ा कृदन्तीय खण्ड है, इसलिए आरम्भ में ‘धन्यवाद करते हुए’ और अन्त में अल्पविराम रखा गया है। ‘ज्योति’ बाइबलीय रूपक की गरिमा बनाए रखती है, जबकि ‘हिस्सा पाने’ मुहावरेदार आधुनिक हिन्दी देता है।
