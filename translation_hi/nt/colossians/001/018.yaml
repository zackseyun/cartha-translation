id: COL.1.18
reference: Colossians 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ⸀ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/018.yaml
  text: And he is the head of the body[a], the church; he is the beginning, the firstborn from the dead, so that he himself might become preeminent in all things[b],
translation:
  language: hi
  text: और वही देह, अर्थात् कलीसिया, का सिर है। वही आरम्भ[a] है, मरे हुओं में से पहलौठा, ताकि वह स्वयं हर बात में पहला स्थान रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘आरम्भ’ का अनुवाद ‘मूल-स्रोत’ या ‘शासक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि हर बात में वही सर्वप्रधान हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: वही / उसी
  rationale: दोनों स्थानों पर सर्वनाम का बल स्वाभाविक हिन्दी में ‘वही’ और ‘उसी’ से व्यक्त होता है।
- source_word: κεφαλή
  choice: सिर
  rationale: यह सीधा समतुल्य शब्द है और देह-सिर के रूपक को बनाए रखता है; इसे केवल ‘शासक’ या ‘स्रोत’ तक सीमित नहीं करता।
- source_word: σώματος
  choice: देह
  rationale: समूह के रूपक के लिए प्रतिष्ठित और गरिमापूर्ण हिन्दी शब्द; ‘सिर’ के साथ मूल बिम्ब सुरक्षित रहता है।
- source_word: ἐκκλησίας
  choice: कलीसिया
  rationale: पौलुस के इस प्रसंग में परमेश्वर के लोगों के समुदाय के लिए प्रचलित बाइबलीय पद।
- source_word: ἀρχή
  choice: आरम्भ
  rationale: ‘मरे हुओं में से पहलौठा’ के समानाधिकरण में यह पुनरुत्थान के नए क्रम के आरम्भकर्ता होने की ओर संकेत करता है, फिर भी मूल शब्द की व्यापकता बनाए रखता है।
- source_word: πρωτότοκος
  choice: पहलौठा
  rationale: मूल की पारिवारिक उपमा और बाइबलीय प्रतिध्वनि को सुरक्षित रखता है; क्रम तथा पद-प्रतिष्ठा दोनों की सम्भावना खुली रहती है।
- source_word: ἐκ τῶν νεκρῶν
  choice: मरे हुओं में से
  rationale: पुनरुत्थान की भाषा में स्वाभाविक हिन्दी और यूनानी पदबंध का स्पष्ट प्रतिनिधित्व।
- source_word: ἵνα γένηται
  choice: ताकि ... हो
  rationale: उद्देश्य अथवा परिणाम का सम्बन्ध व्यक्त करता है; हिन्दी में ‘हो जाए’ यहाँ अनावश्यक रूप से पहले ऐसा न होने का भाव दे सकता है।
- source_word: ἐν πᾶσιν
  choice: हर बात में
  rationale: नपुंसकलिंग बहुवचन के व्यापक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πρωτεύων
  choice: पहला स्थान हो
  rationale: ‘सर्वप्रधान’ की अपेक्षा यूनानी क्रिया के ‘पहला स्थान रखना’ भाव को अधिक पारदर्शी ढंग से व्यक्त करता है।
theological_decisions:
- issue: मसीह और देह के रूपक में κεφαλή का अर्थ
  choice: रूपक को ‘सिर’ के रूप में बनाए रखना
  alternative: अगुवा/अधिकारी अथवा स्रोत
  rationale: मूल रूपक अधिकार और स्रोत के विवादित प्रश्न को स्वयं स्पष्ट रूप से सीमित नहीं करता; इसलिए अनुवाद उसे खुला रखता है।
- issue: ἀρχή का आशय
  choice: आरम्भ
  alternative: मूल-स्रोत अथवा शासक
  rationale: निकटवर्ती पुनरुत्थान-सन्दर्भ ‘आरम्भ’ का समर्थन करता है, जबकि पादटिप्पणी वास्तविक शाब्दिक विकल्पों को दर्ज करती है।
- issue: πρωτότοκος ἐκ τῶν νεκρῶν का बल
  choice: मरे हुओं में से पहलौठा
  alternative: मरे हुओं में से सबसे पहले जी उठनेवाला
  rationale: ‘पहलौठा’ क्रम के साथ पद-प्रतिष्ठा की बाइबलीय प्रतिध्वनि भी बचाता है और अर्थ को केवल कालक्रम तक सीमित नहीं करता।
- issue: γένηται का अनुवाद
  choice: ताकि ... हो
  alternative: ताकि ... हो जाए
  rationale: यूनानी में उद्देश्य/परिणाम और प्रमुखता प्राप्त होने का भाव है, पर ‘हो जाए’ हिन्दी में मसीह के पहले प्रमुख न होने का अनपेक्षित तात्त्विक निष्कर्ष सुझा सकता है; ‘हो’ उद्देश्य को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली। ‘देह’, ‘कलीसिया’ और ‘पहलौठा’ परिचित बाइबलीय शब्दावली हैं; वाक्य-विन्यास को स्पष्ट रखने के लिए ‘अर्थात् कलीसिया’ रखा गया है।
