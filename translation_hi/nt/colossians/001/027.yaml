id: COL.1.27
reference: Colossians 1:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ⸀ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/027.yaml
  text: To them God chose to make known what is the riches of the glory of this mystery among the Gentiles[a], which is Messiah in you[b], the hope of glory.
translation:
  language: hi
  text: परमेश्वर ने उन्हें यह प्रकट करना चाहा कि गैर-यहूदियों के बीच इस रहस्य की महिमा का धन कितना महान है। यह रहस्य है—तुम में मसीह[a], जो महिमा की आशा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच मसीह।” यूनानी वाक्यांश का अर्थ विश्वासियों के भीतर मसीह की उपस्थिति या उनके समुदाय के बीच उसकी उपस्थिति हो सकता है।
    reason: मूल यूनानी ἐν ὑμῖν की वास्तविक स्थानवाचक/सामुदायिक अस्पष्टता सुरक्षित करना।
lexical_decisions:
- source_word: οἷς
  choice: उन्हें
  rationale: यह बहुवचन संबंधवाचक सर्वनाम पिछले पद के ‘पवित्र लोगों’ की ओर संकेत करता है और γνωρίσαι के साथ अप्रत्यक्ष कर्म है। स्वतंत्र हिन्दी वाक्य में ‘उन्हें’ स्वाभाविक है।
- source_word: ἠθέλησεν
  choice: चाहा
  rationale: यह परमेश्वर की सोची-समझी इच्छा व्यक्त करता है; ‘चाहा’ आधुनिक हिन्दी में सहज है और अर्थ को ‘चुना’ तक सीमित नहीं करता।
- source_word: γνωρίσαι
  choice: प्रकट करना
  rationale: γνωρίζω का मूल भाव किसी बात को ज्ञात कराना है। संदर्भ में पहले छिपे रहस्य को ज्ञात कराने के लिए ‘प्रकट करना’ उपयुक्त है।
- source_word: τί τὸ πλοῦτος τῆς δόξης
  choice: महिमा का धन कितना महान है
  rationale: यूनानी पदबंध संक्षिप्त और बलपूर्ण है। हिन्दी में ‘कितना महान’ τί की परिमाणसूचक शक्ति व्यक्त करता है, जबकि ‘महिमा का धन’ πλοῦτος τῆς δόξης की संबंधवाचक बनावट बनाए रखता है।
- source_word: μυστηρίου
  choice: रहस्य
  rationale: पौलुस के प्रयोग में यह परमेश्वर की पहले छिपी पर अब प्रकट योजना है; ‘रहस्य’ इस स्थापित अर्थ को बनाए रखता है।
- source_word: ἐν τοῖς ἔθνεσιν
  choice: गैर-यहूदियों के बीच
  rationale: इस संदर्भ में ἔθνη का अर्थ यहूदी जाति से बाहर के लोग है। ‘गैर-यहूदी’ आधुनिक पाठक के लिए इस भेद को स्पष्ट करता है।
- source_word: ὅ ἐστιν
  choice: यह रहस्य है—
  rationale: नपुंसकलिंग संबंधवाचक सर्वनाम निकटवर्ती ‘रहस्य’ की व्याख्या करता है। स्पष्ट हिन्दी के लिए संज्ञा दोहराई गई है, बिना व्याख्यात्मक संबंध बदले।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यहाँ Χριστός रहस्य की विषयवस्तु के रूप में उपाधिसूचक है। हिन्दी में ‘मसीह’ इसका प्रचलित और अर्थपूर्ण रूप है।
- source_word: ἐν ὑμῖν
  choice: तुम में
  rationale: यह सीधा बहुवचन अनुवाद है और विश्वासियों के भीतर मसीह की उपस्थिति तथा समुदाय के बीच उसकी उपस्थिति—दोनों संभावनाओं को पूरी तरह बंद नहीं करता। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἡ ἐλπὶς τῆς δόξης
  choice: जो महिमा की आशा है
  rationale: ‘महिमा की आशा’ सघन संबंधवाचक अभिव्यक्ति को बनाए रखता है; ‘जो ... है’ हिन्दी में मसीह के साथ समानाधिकरण को स्पष्ट करता है।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: खंड में यह पदवी के रूप में प्रयुक्त है। ‘मसीह’ हिन्दी में यह पदवी और उसके अभिषिक्त जन वाले आशय को स्वाभाविक रूप से व्यक्त करता है।
- issue: ἐν ὑμῖν का आशय
  choice: तुम में
  alternative: तुम्हारे बीच
  rationale: यूनानी वाक्यांश विश्वासियों के भीतर या समुदाय के बीच उपस्थिति का बोध करा सकता है। मुख्य पाठ निकटतम रूप रखता है और पादटिप्पणी सामुदायिक अर्थ सुरक्षित करती है।
- issue: ‘महिमा की आशा’ का संबंध
  choice: मसीह को महिमा की आशा के रूप में रखा गया
  alternative: महिमा पाने की आशा
  rationale: स्रोत का संबंधवाचक पदबंध सघन है और यह स्पष्ट नहीं करता कि महिमा आशा की विषयवस्तु, लक्ष्य या गुण किस अर्थ में है; इसलिए विस्तार करके किसी एक अर्थ को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण शैली। ‘गैर-यहूदी’, ‘रहस्य’, ‘मसीह’ और ‘महिमा’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं। लंबे यूनानी वाक्य को पठनीयता के लिए दो हिन्दी वाक्यों में बाँटा गया है, जबकि व्याख्यात्मक संबंध डैश से सुरक्षित है।
