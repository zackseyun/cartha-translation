  text: καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/017.yaml
  text: And he is before all things[b][a], and in him all things hold together.
translation:
  language: hi
  text: और वही सब वस्तुओं से पहले है[a], और उसी में सब वस्तुएँ एक साथ कायम रहती हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सब वस्तुओं से पहले’ में सब पर उसकी सर्वोच्चता का भाव भी हो सकता है, पर यूनानी पदबंध मुख्यतः पूर्वता व्यक्त करता है।
    reason: alternative_reading
  - marker: b
    text: या, ‘उसी में सब वस्तुएँ संगठित बनी रहती हैं’ अथवा ‘उसी में सब वस्तुएँ परस्पर जुड़ी हुई हैं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτός
  choice: वही
  rationale: वाक्य में सर्वनाम पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक विस्तार के।
- source_word: πρὸ πάντων
  choice: सब वस्तुओं से पहले
  rationale: πρό के साथ संबंधकारक यहाँ मुख्यतः कालगत पूर्वता व्यक्त करता है; यह पद या श्रेष्ठता मात्र की ओर अर्थ को नहीं मोड़ता।
- source_word: τὰ πάντα
  choice: सब वस्तुएँ
  rationale: व्यापक और समावेशी अर्थ रखता है तथा निकटवर्ती प्रसंग की सृष्टि-संबंधी भाषा से मेल खाता है, पर इसे केवल 'सारी सृष्टि' तक संकुचित नहीं करता।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: ἐν का मूल 'में' संबंध सुरक्षित रहता है और साथ ही सर्वनाम का बल भी स्वाभाविक ढंग से व्यक्त होता है; इसे अधिक व्याख्यात्मक 'उसके द्वारा' नहीं बनाया गया।
- source_word: συνέστηκεν
  choice: एक साथ बनी हुई हैं
  rationale: पूर्णकाल से सूचित वर्तमान स्थायी अवस्था और समग्र जगत के परस्पर जुड़े तथा कायम रहने का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: πρὸ πάντων में मसीह और समस्त वस्तुओं का संबंध
  choice: मुख्य पाठ में कालगत पूर्वता—'सब वस्तुओं से पहले'
  alternative: पद या अधिकार में सर्वोच्चता—'सब वस्तुओं से ऊपर'
  rationale: यूनानी पदबंध का प्राथमिक अर्थ पूर्वता है। प्रसंग में सर्वोच्चता का भाव निहित हो सकता है, पर अनुवाद उसे मूल कथन के स्थान पर नहीं रखता।
- issue: συνέστηκεν का बल
  choice: समस्त वस्तुओं का उसी में एक साथ कायम रहना
  alternative: सब वस्तुओं का उसी में अस्तित्व पाना या संगठित रहना
  rationale: क्रिया सृष्टि की वर्तमान संगति और स्थायित्व बताती है। चुनी हुई अभिव्यक्ति इस अर्थ को पठनीय रखते हुए अस्तित्वगत और संरचनात्मक अर्थों को अनावश्यक रूप से सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप। 'वही' और 'उसी में' मूल के बल को बनाए रखते हैं। 'वस्तुएँ' का प्रयोग τὰ πάντα की व्यापकता और आसपास के पदों की सृष्टि-संबंधी पुनरावृत्ति सुरक्षित रखने के लिए किया गया है।
