  text: ὅτι ἐν αὐτῷ ἐκτίσθη τὰ ⸀πάντα ἐν τοῖς οὐρανοῖς ⸀καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα δι’ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/016.yaml
  text: For in him all things were created[a], in the heavens and on the earth, the visible and the invisible, whether thrones or dominions or rulers or authorities[d][c][b]; all things have been created through him and for him.
translation:
  language: hi
  text: क्योंकि उसी में[a] सारी वस्तुएँ सृजी गईं—स्वर्गों में और पृथ्वी पर[b], दिखाई देनेवाली और न दिखाई देनेवाली वस्तुएँ; चाहे सिंहासन हों, चाहे प्रभुताएँ[c], चाहे शासक हों, चाहे अधिकार। सारी वस्तुएँ उसी के द्वारा और उसी के लिए[d] सृजी गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसी में’ का अनुवाद कभी-कभी ‘उसी के द्वारा’ भी किया जाता है; पर आगे ‘उसी के द्वारा’ के लिए यूनानी में अलग संबंधसूचक शब्द आया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘स्वर्ग’ बहुवचन है; सामान्य हिन्दी में ‘स्वर्ग में और पृथ्वी पर’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘प्रभुताएँ’ के लिए ‘अधिपत्य’ या ‘प्रभुता रखनेवाली शक्तियाँ’ भी सम्भव है; ये शब्द सम्भवतः सृजी गई अधिकार-श्रेणियों को सूचित करते हैं।
    reason: lexical_alternative
  - marker: d
    text: या, ‘उसी की ओर’; अर्थात सारी सृष्टि उसी को लक्ष्य करके सृजी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन का आधार बताता है। हिन्दी में ‘क्योंकि’ इसके कारणसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: ἐν का मूल भेद बनाए रखने के लिए ‘में’ रखा गया है; आगे δι’ αὐτοῦ को ‘उसी के द्वारा’ कहा गया है। इससे दोनों वाक्यांश एक ही अर्थ में नहीं मिला दिए जाते।
- source_word: ἐκτίσθη / ἔκτισται
  choice: सृजी गईं / सृजी गई हैं
  rationale: पहले क्रियारूप का अतीतकालीन घटना-संदर्भ और दूसरे पूर्णकाल का वर्तमान परिणाम हिन्दी में क्रमशः ‘सृजी गईं’ और ‘सृजी गई हैं’ से व्यक्त होता है।
- source_word: τὰ πάντα
  choice: सारी वस्तुएँ
  rationale: यह सृष्टि की समग्र व्यापकता बनाए रखता है और अगले दृश्यमान-अदृश्य विभाजन से सहजता से जुड़ता है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी बहुवचन को जानबूझकर सुरक्षित रखा गया है, यद्यपि सामान्य हिन्दी में एकवचन ‘स्वर्ग में’ अधिक प्रचलित है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: यह यूनानी वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है तथा ‘स्वर्गों में’ के साथ सृष्टि की समग्र सीमा दिखाता है।
- source_word: τὰ ὁρατὰ καὶ τὰ ἀόρατα
  choice: दिखाई देनेवाली और न दिखाई देनेवाली वस्तुएँ
  rationale: विशेषणों के संज्ञात्मक प्रयोग को स्पष्ट, सामान्य आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: θρόνοι
  choice: सिंहासन
  rationale: मूल बिंब को बनाए रखा गया है; सन्दर्भ में यह किसी ऊँचे पद या अधिकार-श्रेणी को सूचित कर सकता है।
- source_word: κυριότητες
  choice: प्रभुताएँ
  rationale: यह प्रभुता अथवा अधिपत्य रखनेवाली श्रेणियों का संकेत देता है और मूल पद से औपचारिक निकटता रखता है।
- source_word: ἀρχαὶ
  choice: शासक
  rationale: ‘प्रधानताएँ’ जैसे कम प्रचलित पारिभाषिक शब्द के बजाय शासन करनेवालों का अर्थ सामान्य आधुनिक हिन्दी में स्पष्ट किया गया है।
- source_word: ἐξουσίαι
  choice: अधिकारी
  rationale: यह अधिकार रखनेवाली शक्तियों या सत्ताओं का बोध कराता है और ‘शासक’ से शब्दगत भेद बनाए रखता है।
- source_word: δι’ αὐτοῦ
  choice: उसी के द्वारा
  rationale: διά के माध्यम अथवा कर्तृत्व-साधन संबंधी अर्थ को स्पष्ट करता है।
- source_word: εἰς αὐτόν
  choice: उसी के लिए
  rationale: यह सृष्टि के लक्ष्य के रूप में पुत्र को व्यक्त करता है; अधिक शाब्दिक दिशात्मक अर्थ फुटनोट में सुरक्षित है।
theological_decisions:
- issue: पुत्र और सृष्टि के संबंध में ἐν αὐτῷ / δι’ αὐτοῦ / εἰς αὐτόν
  choice: ‘उसी में … उसी के द्वारा … उसी के लिए’ के तीन अलग वाक्यांश सुरक्षित रखे गए हैं।
  alternative: तीनों को साधारणतः ‘उसी के द्वारा’ जैसे एक ही कर्तृत्व-संबंधी अर्थ में प्रस्तुत करना।
  rationale: यूनानी पाठ जानबूझकर अलग-अलग संबंधसूचक अव्ययों का प्रयोग करता है। अनुवाद पुत्र को सृष्टि के संदर्भ/क्षेत्र, माध्यम और लक्ष्य के रूप में प्रस्तुत करने वाले इस बहुस्तरीय कथन को समतल नहीं करता।
- issue: ‘सिंहासन, प्रभुताएँ, शासक और अधिकारी’ किन सत्ताओं को कहते हैं
  choice: इन्हें सृजी गई अधिकार-श्रेणियों के रूप में बिना और परिभाषित किए रखा गया है।
  alternative: इन्हें केवल स्वर्गदूतों की श्रेणियाँ या केवल मानवीय राजनीतिक संस्थाएँ कहना।
  rationale: इस पद में उनकी सत्ता का क्षेत्र स्पष्ट रूप से सीमित नहीं किया गया; इसलिए अनुवाद कोई संकीर्ण तात्त्विक पहचान नहीं थोपता।
- issue: εἰς αὐτόν में लक्ष्य और दिशा
  choice: मुख्य पाठ में स्वाभाविक ‘उसी के लिए’ और फुटनोट में दिशात्मक ‘उसी की ओर/उसी को लक्ष्य करके’।
  alternative: केवल स्वामित्व या लाभार्थ का अर्थ देना।
  rationale: εἰς यहाँ सृष्टि के अंतिम लक्ष्य को सूचित करता है; फुटनोट इसकी दिशात्मक छाया को भी बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘स्वर्गों’ और ‘प्रभुताएँ’ अपेक्षाकृत औपचारिक शब्द हैं, पर वे मूल पाठ के बहुवचन और अधिकार-श्रेणी को सुरक्षित रखते हैं; इनके सहज विकल्प फुटनोटों में दिए गए हैं।
