reference: Colossians 1:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν ⸀πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/023.yaml
  text: if indeed you continue in the faith[a], grounded and steadfast, and not moved away from the hope of the gospel that you heard, which has been proclaimed in all creation under heaven, of which I, Paul[b], became a servant.
translation:
  language: hi
  text: यदि सचमुच तुम विश्वास में बने रहते हो, नींव पर स्थापित और अटल रहते हो, और उस आशा से हटाए नहीं जाते जो उस सुसमाचार से मिलती है जिसे तुमने सुना है और जिसका प्रचार आकाश के नीचे सारी सृष्टि[a] में किया गया है। उसी सुसमाचार का मैं, पौलुस, सेवक[b] बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश के नीचे के समस्त प्राणी-जगत में।” यूनानी शब्द κτίσις का अर्थ “सृष्टि” या कुछ प्रसंगों में “प्राणी” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परिचारक।” यूनानी διάκονος प्रसंग के अनुसार सेवक या परिचारक को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴ γε
  choice: बशर्ते कि
  rationale: वास्तविक शर्त को स्वाभाविक हिन्दी में बनाए रखता है, पर इससे न तो अनिश्चितता को बढ़ाया जाता है और न धैर्य से जुड़े व्यापक धर्मवैज्ञानिक प्रश्न का निर्णय किया जाता है।
- source_word: ἐπιμένετε τῇ πίστει
  choice: तुम विश्वास में बने रहो
  rationale: वर्तमान काल की निरंतरता और τῇ πίστει के क्षेत्रगत अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: τεθεμελιωμένοι καὶ ἑδραῖοι
  choice: नींव पर दृढ़ता से स्थापित और अटल
  rationale: τεθεμελιωμένοι के पूर्ण निष्क्रिय भाव तथा नींव के रूपक को सुरक्षित रखते हुए ἑδραῖοι की स्थिरता को ‘अटल’ से व्यक्त करता है।
- source_word: μὴ μετακινούμενοι
  choice: न हटो
  rationale: अपनी स्थिर स्थिति से दूर किए जाने या खिसकने की छवि को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου
  choice: उस आशा से ... जो उस सुसमाचार से मिलती है
  rationale: समाचार से संबद्ध अथवा उससे उत्पन्न आशा के संबंध को स्पष्ट करता है, बिना उसे किसी अधिक संकीर्ण अर्थ तक सीमित किए।
- source_word: τοῦ κηρυχθέντος
  choice: जिसका प्रचार ... किया गया है
  rationale: सार्वजनिक घोषणा के निष्क्रिय भाव को सामान्य और प्रतिष्ठित हिन्दी में रखता है।
- source_word: ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν
  choice: आकाश के नीचे की सारी सृष्टि में
  rationale: κτίσις के व्यापक, सृष्टि-संबंधी अर्थ और कथन के विश्वव्यापी विस्तार को निकटता से सुरक्षित रखता है।
- source_word: διάκονος
  choice: सेवक
  rationale: सेवा की मूल धारणा को रखता है और ऐसा संस्थागत कलीसियाई पद नहीं जोड़ता जो यूनानी शब्द में इस प्रसंग में अनिवार्य नहीं है।
theological_decisions:
- issue: εἴ γε की शर्त और विश्वास में बने रहना
  choice: वास्तविक शर्त के रूप में ‘बशर्ते कि तुम ... बने रहो’
  alternative: ‘क्योंकि निश्चय ही तुम बने रहते हो’ अथवा ऐसा अनुवाद जो उद्धार खोने की संभावना को निर्णायक रूप से स्थापित करे
  rationale: यूनानी पाठ बने रहने की शर्त रखता है, पर यह पद अकेले सुनिश्चित धैर्य या धर्मत्याग की संभावना पर व्यापक मतभेद का निपटारा नहीं करता।
- issue: τῇ πίστει में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता अथवा भरोसा
  rationale: इस रचना और प्रसंग में ‘विश्वास’ सबसे संभावित और स्वाभाविक अर्थ है; यहाँ ‘विश्वासयोग्यता’ के पक्ष में कोई निर्णायक संकेत नहीं है।
- issue: सुसमाचार के प्रचार की विश्वव्यापक भाषा
  choice: ‘आकाश के नीचे की सारी सृष्टि में’ को उसके व्यापक अलंकारिक/विश्वव्यापी बल सहित रखना
  alternative: इसे केवल प्रत्येक मानव प्राणी तक सीमित करके स्पष्ट करना
  rationale: पाठ के व्यापक कथन को कम किए बिना κτίσις की वास्तविक शब्दार्थगत गुंजाइश बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। नींव और स्थिरता की रूपक-श्रृंखला को बनाए रखा गया है। ‘सुसमाचार’, ‘विश्वास’ और ‘सेवक’ जैसे प्रचलित बाइबलीय शब्द रखे गए हैं, जबकि वाक्य-विन्यास को स्वाभाविक हिन्दी के अनुरूप बनाया गया है।
