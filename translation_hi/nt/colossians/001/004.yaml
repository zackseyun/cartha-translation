review_pass:
  verdict: revise
  source_fidelity: The Greek aorist participle ἀκούσαντες is best retained in Hindi as a participial connection (“सुनकर”), rather than converted to the finite causal clause “क्योंकि हमने ... सुना है.” The draft otherwise conveys faith in Messiah Jesus, present love, and its scope correctly.
  naturalness: “प्रेम ... लोगों से रखते हैं” is understandable, but “सभी पवित्र लोगों के प्रति ... प्रेम” is more idiomatic modern standard Hindi and makes the direction of εἰς clear. The revised wording also avoids a slightly cumbersome relative-clause placement.
  terminology: “मसीह यीशु,” “विश्वास,” and “पवित्र लोग” are appropriate. The footnote should transliterate πίστις as “पिस्टिस,” not “पिस्तिस.”
  issues:
  - severity: medium
    issue: The participial form ἀκούσαντες is rendered as a finite causal clause, “क्योंकि हमने ... सुना है.”
    rationale: Although the causal sense fits the preceding verse, the source specifically uses a participle dependent on the previous thanksgiving clause. “सुनकर” preserves this connection without unnecessarily making the causal relation explicit.
  - severity: low
    issue: “जो आप सभी पवित्र लोगों से रखते हैं” is less idiomatic Hindi for love directed toward persons.
    rationale: “सभी पवित्र लोगों के प्रति ... प्रेम” naturally expresses the directional force of εἰς while retaining the source’s relative clause and present-tense sense.
  - severity: low
    issue: The Greek noun in the footnote is transliterated “पिस्तिस.”
    rationale: “पिस्टिस” more accurately represents πίστις in Devanagari.
  revised_text: मसीह यीशु में आपके विश्वास[a] और उस प्रेम के बारे में सुनकर, जो आप सभी पवित्र लोगों के प्रति रखते हैं,
