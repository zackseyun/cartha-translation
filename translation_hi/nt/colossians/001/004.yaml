  text: ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ⸂ἣν ἔχετε⸃ εἰς πάντας τοὺς ἁγίους
base_translation:
  language: en
  yaml_path: translation/nt/colossians/001/004.yaml
  text: having heard of your faith in Messiah Jesus and the love that you have for all the saints,[a]
translation:
  language: hi
  text: मसीह यीशु में आपके विश्वास[a] और उस प्रेम के बारे में सुनकर, जो आप सभी पवित्र लोगों के प्रति रखते हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मसीह यीशु में आपके भरोसे” अथवा “मसीह यीशु में आपकी विश्वासयोग्यता।” यूनानी संज्ञा पिस्टिस प्रसंग के अनुसार ये परस्पर संबंधित अर्थ व्यक्त कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσαντες
  choice: क्योंकि हमने ... सुना है
  rationale: यह भूतकालिक कृदन्त पिछले पद में धन्यवाद देने के कारण को बताता है। हिंदी में कारणसूचक उपवाक्य पद 3 से संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: मसीह यीशु के साथ ἐν के प्रयोग में यहाँ पाठकों का विश्वास प्रमुख अर्थ है; भरोसा और विश्वासयोग्यता की संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: ἐν Χριστῷ Ἰησοῦ
  choice: मसीह यीशु में
  rationale: ἐν की संबंधात्मक/क्षेत्रगत अभिव्यक्ति को 'में' से बनाए रखा गया है और Χριστός को उपाधि के रूप में 'मसीह' अनूदित किया गया है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη का मानक, सहज और गरिमापूर्ण हिंदी रूप।
- source_word: ἣν ἔχετε
  choice: जो आप ... रखते हैं
  rationale: स्रोत में उपस्थित संबंधवाचक उपवाक्य को स्पष्ट रूप से रखा गया है और वर्तमान में विद्यमान प्रेम का भाव व्यक्त किया गया है।
- source_word: εἰς πάντας τοὺς ἁγίους
  choice: सभी पवित्र लोगों से
  rationale: प्रेम के साथ εἰς का लक्ष्य हिंदी में स्वाभाविक रूप से 'से प्रेम रखना' द्वारा व्यक्त होता है। οἱ ἅγιοι को सामान्य पाठकों के लिए पारदर्शी 'पवित्र लोग' कहा गया है।
theological_decisions:
- issue: Χριστῷ को उपाधि के रूप में अनूदित करना या नाम-सदृश रूप देना
  choice: मसीह यीशु
  alternative: क्राइस्ट यीशु
  rationale: Χριστός यहाँ यीशु के साथ जुड़ी उपाधि है; 'मसीह' उसका स्थापित हिंदी अनुवाद है।
- issue: πίστις का अर्थ-क्षेत्र
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इस प्रसंग में मसीह यीशु से संबंधित पाठकों का विश्वास सबसे उपयुक्त है, पर यूनानी शब्द की निकटवर्ती अर्थ-संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: आधुनिक मानक हिंदी; पद 3 से जुड़े कारणसूचक प्रवाह के लिए 'क्योंकि हमने ... सुना है' चुना गया है। भाषा सहज और गरिमापूर्ण है तथा मूल की संबंधात्मक अभिव्यक्ति और अर्थगत अस्पष्टता सुरक्षित रखती है।
