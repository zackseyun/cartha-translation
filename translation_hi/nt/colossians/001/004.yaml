revisions:
- from: क्योंकि हमने मसीह यीशु में आपके विश्वास[a] और उस प्रेम के बारे में सुना है, जो आप सभी पवित्र लोगों से रखते हैं,
  to: मसीह यीशु में आपके विश्वास[a] और उस प्रेम के बारे में सुनकर, जो आप सभी पवित्र लोगों के प्रति रखते हैं,
  rationale: The revision preserves the Greek participial linkage with the preceding verse, improves the natural Hindi expression for love directed toward all the saints, and corrects the Greek-term transliteration in the footnote. It retains the established rendering “मसीह यीशु” and preserves the stated alternatives for πίστις.
