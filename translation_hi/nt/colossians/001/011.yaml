lexical_decisions:
- source_word: ἐν πάσῃ δυνάμει δυναμούμενοι
  choice: हर प्रकार की शक्ति से बल पाते हुए
  rationale: यह वाक्यांश निरन्तर चल रही निष्क्रिय प्रक्रिया और परमेश्वर को निहित कर्ता के रूप में बनाए रखता है। ‘हर प्रकार की शक्ति’ πᾶς की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὸ κράτος τῆς δόξης αὐτοῦ
  choice: उसकी महिमा के सामर्थ्य के अनुसार
  rationale: यह κατά के मानक या माप के भाव तथा यूनानी के सघन संबंधवाचक विन्यास ‘उसकी महिमा का सामर्थ्य’ को निकटता से सुरक्षित रखता है।
- source_word: εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν
  choice: ताकि तुम पूरे धीरज और सहनशीलता के साथ
  rationale: εἰς का प्रयोजन/परिणाम ‘ताकि’ से स्पष्ट होता है। ‘धीरज’ कठिनाई में टिके रहने और ‘सहनशीलता’ दीर्घकाल तक संयम रखने के निकटवर्ती किंतु अलग भावों को व्यक्त करते हैं।
- source_word: μετὰ χαρᾶς
  choice: आनन्दित रहो
  rationale: यह χαρά के आनन्द-भाव को सहज हिन्दी में व्यक्त करता है; पर अगले पद के साथ इसके संभावित संबंध के कारण एक पाठ-टिप्पणी दी गई है।
theological_decisions:
- issue: विश्वासियों को मिलने वाली सामर्थ्य और परमेश्वर की महिमा का संबंध
  choice: ‘उसकी महिमा के सामर्थ्य के अनुसार’
  alternative: ‘उसकी महिमामय सामर्थ्य के अनुसार’
  rationale: मुख्य पाठ यूनानी संबंधवाचक संरचना को बचाता है और ‘महिमा’ को केवल विशेषण में बदलकर उसके धार्मिक भार को कम नहीं करता।
- issue: μετὰ χαρᾶς का वाक्यगत संबंध
  choice: इसे धीरज और सहनशीलता के साथ जोड़ा गया है
  alternative: इसे अगले पद के धन्यवाद देने से जोड़ा जा सकता है
  rationale: यूनानी पांडुलिपियों में आधुनिक विराम-चिह्न नहीं थे; दोनों संबंध व्याकरणतः संभव हैं। मुख्य पाठ प्रचलित निकट-संबंध को अपनाता है, जबकि टिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। यह पद 1:9 से आरम्भ प्रार्थना-वाक्य की निरन्तर कड़ी है, इसलिए कृदन्तीय प्रवाह बनाए रखा गया है और उद्देश्य को स्पष्ट करने के लिए ‘ताकि तुम’ जोड़ा गया है।
