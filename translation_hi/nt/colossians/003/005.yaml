source:
  edition: SBLGNT
  text: Νεκρώσατε οὖν τὰ ⸀μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/005.yaml
  text: 'Therefore[a], put to death the members that are on the earth: sexual immorality, impurity, passion, evil desire, and greed[b], which is idolatry.'
translation:
  language: hi
  text: इसलिए जो पृथ्वी पर हैं, उन अंगों को मार डालो[a]—यौन अनैतिकता, अशुद्धता, वासना, बुरी इच्छा और लोभ[b], जो मूर्तिपूजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुममें जो कुछ सांसारिक है, उसे मार डालो।” यूनानी में अधिक शाब्दिक रूप से, “जो पृथ्वी पर हैं, उन अंगों” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “लालच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Νεκρώσατε
  choice: मार डालो
  rationale: यह निर्णायक कार्रवाई की आज्ञा है। ‘मार डालो’ मूल क्रिया की तीव्रता बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को सूचित करता है।
- source_word: μέλη
  choice: अंगों
  rationale: ‘अंग’ शारीरिक रूपक को बनाए रखता है; इसे ‘सांसारिक स्वभाव’ जैसे अमूर्त अर्थ में बदलना मूल पाठ से अधिक व्याख्यात्मक होता।
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: पृथ्वी पर के
  rationale: यह स्थान-संबंधी रूपक को निकटता से सुरक्षित रखता है, यद्यपि हिन्दी में इसका अर्थ असामान्य लग सकता है; इसलिए पादटिप्पणी में अर्थगत विकल्प दिया गया है।
- source_word: πορνείαν
  choice: यौन अनैतिकता
  rationale: यह πορνεία के व्यापक नैतिक अर्थ को वर्तमान और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀκαθαρσίαν
  choice: अशुद्धता
  rationale: यह पौलुस के व्यापक नैतिक अशुद्धता-संबंधी शब्द का सीधा और स्वाभाविक समतुल्य है।
- source_word: πάθος
  choice: वासना
  rationale: इस संदर्भ में शब्द अनियंत्रित या विकृत कामुक आवेग को दर्शाता है; ‘वासना’ हिन्दी में इस नकारात्मक अर्थ को स्वाभाविक ढंग से पहुँचाता है।
- source_word: ἐπιθυμίαν κακήν
  choice: बुरी अभिलाषा
  rationale: विशेषण κακήν की नैतिक नकारात्मकता को स्पष्ट रखते हुए यह पद इच्छा/लालसा का अर्थ देता है।
- source_word: πλεονεξίαν
  choice: लोभ
  rationale: अधिक पाने की अतृप्त और हड़पने वाली इच्छा के लिए ‘लोभ’ संक्षिप्त, स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: ἥτις ἐστὶν εἰδωλολατρία
  choice: जो मूर्तिपूजा है
  rationale: यह पौलुस की तीखी पहचान को बिना नरम किए रखता है और स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम को निकटतम पूर्वपद ‘लोभ’ से जोड़ता है।
theological_decisions:
- issue: ‘जो मूर्तिपूजा है’ का पूर्वपद
  choice: यह उपवाक्य विशेष रूप से ‘लोभ’ को मूर्तिपूजा बताता है।
  alternative: यह पूरी पिछली दुर्गुण-सूची को मूर्तिपूजा बताता है।
  rationale: ἥτις स्त्रीलिंग एकवचन है और निकटतम स्त्रीलिंग एकवचन संज्ञा πλεονεξίαν से स्वाभाविक रूप से मेल खाता है। हिन्दी में अल्पविराम और निकटता इसी संबंध को बनाए रखते हैं।
- issue: ‘पृथ्वी पर के अंग’ की व्याख्या
  choice: मुख्य पाठ में देह-अंग का रूपक बनाए रखा गया है।
  alternative: ‘तुममें जो कुछ सांसारिक है’ या ‘तुम्हारा सांसारिक स्वभाव।’
  rationale: मूल पाठ में μέλη, अर्थात ‘अंग’, है। इसके बाद आने वाली कर्मकारक संज्ञाएँ उन अंगों का व्याख्यात्मक विवरण मानी जा सकती हैं; रूपक हटाना अनावश्यक व्याख्यात्मक विस्तार होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। मुख्य पाठ में मूल यूनानी का ‘अंग’ और ‘पृथ्वी पर’ वाला रूपक सुरक्षित है; उसकी संभावित अर्थगत व्याख्या पादटिप्पणी में दी गई है।
