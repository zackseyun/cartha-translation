lexical_decisions:
- source_word: τὰ ἄνω
  choice: ऊपर की बातें
  rationale: नपुंसकलिंग बहुवचन पदबंध यहाँ संज्ञा के रूप में प्रयुक्त है और ऊपर की वास्तविकताओं या विषयों की ओर संकेत करता है। यह चयन मूल के बहुवचन और पृथ्वी की बातों के साथ उसके स्थानगत विरोध को बनाए रखता है।
- source_word: φρονεῖτε
  choice: अपना मन लगाए रखो
  rationale: क्रिया केवल विचार करने के बजाय मनोवृत्ति, ध्यान और सरोकार को किसी ओर लगाए रखने का भाव देती है। वर्तमान काल की आज्ञा के निरंतर अभिमुखता वाले भाव को ‘लगाए रखो’ स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: μὴ
  choice: नहीं
  rationale: यह दूसरे विषय को निषेध करके दोनों क्षेत्रों के बीच सीधा विरोध स्थापित करता है।
- source_word: τὰ ἐπὶ τῆς γῆς
  choice: पृथ्वी की बातें
  rationale: यह ‘ऊपर की बातें’ का समांतर प्रतिपक्ष है। हिंदी में ‘पृथ्वी की बातें’ मूल के ठोस स्थानगत विरोध को सहज रूप में बनाए रखता है; ‘सांसारिक बातें’ अधिक व्याख्यात्मक और नैतिक रंग वाला होता।
- source_word: γῆς
  choice: पृथ्वी
  rationale: ‘ऊपर’ के ब्रह्मांडीय विरोध में γῆ किसी विशेष भूमि या देश के बजाय पृथ्वी को दर्शाता है।
theological_decisions:
- issue: φρονεῖτε में पौलुस के आग्रह का स्वरूप
  choice: अपनी मनोवृत्ति और सरोकार को ऊपर की वास्तविकताओं की ओर निरंतर लगाए रखने का आग्रह
  alternative: केवल स्वर्ग के विषय में बौद्धिक रूप से सोचने की संकीर्ण आज्ञा
  rationale: φρονέω की अर्थ-सीमा में सोच के साथ मनोवृत्ति, दृष्टिकोण और सरोकार भी सम्मिलित हैं। ‘अपना मन लगाए रखो’ इस व्यापक नैतिक और आत्मिक बल को व्यक्त करता है, बिना अतिरिक्त सिद्धांत जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और आज्ञार्थक रूप। ‘अपना मन लगाए रखो’ सामान्य पाठक के लिए स्वाभाविक है और निरंतर अभिमुखता का भाव देता है। ‘सांसारिक’ से बचा गया है क्योंकि वह मूल स्थानगत विरोध में अनावश्यक नैतिक व्याख्या जोड़ सकता है।
