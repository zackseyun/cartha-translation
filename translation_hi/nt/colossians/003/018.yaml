  text: Wives[a], submit yourselves to your husbands[b], as is fitting in the Lord.
translation:
  language: hi
  text: हे पत्नियो, अपने पतियों के अधीन रहो[a], जैसा कि प्रभु में उचित है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने पतियों के प्रति अधीनता स्वीकार करो।”
    reason: lexical_alternative
  - marker: b
    text: या “जैसा प्रभु में उचित था”; यूनानी क्रिया का रूप भूतकाल का है, पर इस संदर्भ में उसका अर्थ संभवतः सामान्य वर्तमान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γυναῖκες
  choice: पत्नियो
  rationale: घरेलू संबंधों के इस प्रसंग में, और ἀνδράσιν के साथ जोड़े जाने के कारण, यह शब्द सामान्यतः स्त्रियों को नहीं बल्कि पत्नियों को संबोधित करता है। संबोधन के लिए ‘पत्नियो’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ὑποτάσσεσθε
  choice: अधीन रहो
  rationale: वर्तमान आज्ञार्थक रूप संबंध के भीतर अपने को अधीन रखने की निरंतर वृत्ति व्यक्त करता है। ‘अधीन रहो’ हिन्दी में स्वाभाविक है और इसे जबरन अधीन किए जाने के निष्क्रिय अर्थ में नहीं बदलता।
- source_word: τοῖς ἀνδράσιν
  choice: अपने-अपने पतियों के
  rationale: घरेलू निर्देश के संदर्भ में ἀνήρ का अर्थ ‘पति’ है। बहुवचन संबोधन में ‘अपने-अपने’ प्रत्येक पत्नी और उसके पति के संबंध को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὡς
  choice: जैसा
  rationale: यहाँ ὡς कारण नहीं, बल्कि उस मानक या अनुरूपता का परिचय देता है जिसके अनुसार यह आचरण उचित है।
- source_word: ἀνῆκεν
  choice: उचित है
  rationale: रूप की दृष्टि से यह imperfect है, पर इस नीतिपरक कथन में सामान्य वर्तमान अर्थ ग्रहण करता है। ‘उचित है’ नैतिक उपयुक्तता को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: शाब्दिक संबंध बनाए रखने से निर्देश की उपयुक्तता प्रभु के साथ संबंध के दायरे में स्थित रहती है; इसे केवल अस्पष्ट धार्मिक विशेषण या ‘प्रभु के सामने’ में नहीं बदला गया।
theological_decisions:
- issue: निर्देश की सीमा और उसका आधार
  choice: ‘जैसा प्रभु में उचित है’ रखकर निर्देश को प्रभु के साथ संबंध द्वारा योग्य और सीमाबद्ध दिखाया गया है।
  alternative: इसे बिना किसी धार्मिक योग्यता के सामान्य सामाजिक नियम मानना, अथवा ‘प्रभु में’ को केवल पत्नियों का विशेषण समझना।
  rationale: यूनानी वाक्य में ἐν κυρίῳ उपयुक्त होने के कथन से जुड़ा है। अनुवाद इसी तनाव को बनाए रखता है और पद से परे जाकर इसकी सीमाओं या व्यापक धर्मशास्त्रीय व्यवस्था की व्याख्या नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे पत्नियो’ प्रत्यक्ष संबोधन को स्पष्ट करता है; ‘अपने-अपने’ बहुवचन संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ संक्षिप्त है और कालगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
