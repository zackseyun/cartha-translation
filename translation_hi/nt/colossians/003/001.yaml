source:
  edition: SBLGNT
  text: Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/001.yaml
  text: If[a], then, you were raised with the Messiah, seek the things above[b], where the Messiah is, seated at the right hand of God.
translation:
  language: hi
  text: अतः, यदि आप मसीह के साथ जी उठाए गए हैं,[a] तो ऊपर की बातों को खोजते रहें, जहाँ मसीह परमेश्वर के दाहिने हाथ पर बैठा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अतः, चूँकि आप मसीह के साथ जी उठाए गए हैं, तो ऊपर की बातों को खोजते रहें।” यूनानी वाक्य शर्त के रूप में है, पर प्रसंग में यह शर्त सत्य मानकर कही गई जान पड़ती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εἰ οὖν
  choice: इसलिए, यदि
  rationale: εἰ की शर्तात्मक बनावट और οὖν के निष्कर्षसूचक बल—दोनों को बनाए रखता है। प्रसंग इस शर्त को सत्य मानता जान पड़ता है, फिर भी यूनानी वाक्य को सीधे ‘क्योंकि’ में नहीं बदला गया।
- source_word: συνηγέρθητε τῷ Χριστῷ
  choice: आप मसीह के साथ जिलाए गए हैं
  rationale: सहभागिता सूचक संयुक्त क्रिया और दत्तिव τῷ Χριστῷ को ‘मसीह के साथ’ से व्यक्त किया गया है। ‘जिलाए गए हैं’ दिव्य कर्म को सूचित करने वाले कर्मवाच्य और उसके वर्तमान परिणाम को स्वाभाविक हिन्दी में रखता है।
- source_word: τὰ ἄνω
  choice: ऊपर की वस्तुओं
  rationale: नपुंसकलिंग बहुवचन संज्ञीकृत पद की व्यापकता और बहुवचन रूप को बनाए रखता है; इसे व्याख्यात्मक रूप से केवल ‘स्वर्गीय बातें’ तक सीमित नहीं करता।
- source_word: ζητεῖτε
  choice: खोज में लगे रहें
  rationale: वर्तमान काल की आज्ञा में निहित सतत अभिमुखता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὗ ὁ Χριστός ἐστιν
  choice: जहाँ मसीह ... है
  rationale: οὗ के स्थानवाचक अर्थ को सीधे ‘जहाँ’ से व्यक्त किया गया है।
- source_word: ἐν δεξιᾷ τοῦ θεοῦ καθήμενος
  choice: परमेश्वर के दाहिने हाथ विराजमान है
  rationale: राजकीय उच्चता के परिचित बाइबलीय बिंब को बनाए रखते हुए καθήμενος की वर्तमान अवस्था को dignified और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Εἰ की शर्तात्मक शक्ति
  choice: ‘यदि’ को मुख्य पाठ में बनाए रखा
  alternative: ‘चूँकि’ / ‘जबकि यह सच है कि’
  rationale: यद्यपि प्रसंग में पौलुस संभवतः शर्त को सत्य मानकर चल रहा है, यूनानी पाठ औपचारिक रूप से शर्तात्मक है। इसलिए निहित निश्चितता को अनुवाद में चुपचाप पूर्ण कथन नहीं बनाया गया।
- issue: Χριστός का हिन्दी रूप
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: ‘मसीह’ आधुनिक हिन्दी बाइबल-पाठकों के लिए स्वाभाविक और प्रतिष्ठित है तथा मूल के अभिषिक्त-राजा संबंधी पदवीगत अर्थ को वहन करता है।
- issue: ‘परमेश्वर के दाहिने हाथ’ का अर्थ
  choice: स्थानात्मक-राजकीय बिंब को यथावत रखा
  alternative: ‘परमेश्वर के साथ सर्वोच्च अधिकार में’
  rationale: व्याख्यात्मक भावार्थ के बजाय मूल के राजकीय और सम्मानसूचक रूपक को सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक बहुवचन ‘आप’ रखा गया है। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। ‘विराजमान’ राजकीय-सम्मानसूचक प्रसंग में स्वाभाविक है; मुख्य पाठ का एकमात्र पाद-टिप्पणी चिह्न [a] संबंधित वाक्यांश के बाद दिया गया है।
