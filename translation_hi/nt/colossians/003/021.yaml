  to: हे पिताओ, अपने बच्चों को तंग न करो, ताकि वे निराश न हों।
  rationale: The revision replaces a potentially misleading rendering of ἐρεθίζετε with an idiomatic Hindi expression for harmful, exasperating parental treatment and renders ἀθυμῶσιν directly as becoming discouraged. It preserves the source text’s specific address to fathers, the inclusive reference to children, and the purpose/result relation.
