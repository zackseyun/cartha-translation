  text: οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/021.yaml
  text: Fathers[a], do not provoke your children, so that they may not become discouraged.
translation:
  language: hi
  text: हे पिताओ, अपने बच्चों को तंग न करो, ताकि वे निराश न हों।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ πατέρες
  choice: हे पिताओ
  rationale: πατέρες का सीधा और संदर्भानुकूल अर्थ ‘पिता’ है। संबोधन का बहुवचन ‘हे पिताओ’ यूनानी की विशिष्ट पुरुष-संबोधित भाषा को बनाए रखता है; इसे सामान्यीकृत करके ‘माता-पिताओ’ नहीं किया गया।
- source_word: μὴ ἐρεθίζετε
  choice: न उकसाओ
  rationale: ἐρεθίζω यहाँ ऐसे व्यवहार को दर्शाता है जो बच्चों में नकारात्मक प्रतिक्रिया भड़काता है। ‘न उकसाओ’ संक्षिप्त, स्वाभाविक और सक्रिय अर्थ के निकट है।
- source_word: τὰ τέκνα ὑμῶν
  choice: अपने बच्चों को
  rationale: τέκνα संतान के लिए समावेशी शब्द है। हिन्दी में ‘अपने बच्चों को’ स्वाभाविक रूप से पुत्र और पुत्रियों दोनों को समेटता है।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: ἵνα μή के प्रयोजन अथवा अपेक्षित परिणाम के भाव को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀθυμῶσιν
  choice: वे हिम्मत न हारें
  rationale: ἀθυμέω मन टूटने, निरुत्साहित होने या साहस खो देने का भाव देता है। ‘हिम्मत न हारें’ साधारण आधुनिक हिन्दी में इस आंतरिक निराशा को सजीव और सटीक ढंग से व्यक्त करता है।
theological_decisions:
- issue: गृहस्थी-संबंधी निर्देश में πατέρες का दायरा
  choice: विशेष रूप से पिताओं को संबोधन
  alternative: सामान्य रूप से माता-पिताओं को संबोधन
  rationale: यूनानी पाठ स्पष्टतः ‘पिताओं’ कहता है। शिक्षा का व्यापक अनुप्रयोग संभव होने पर भी अनुवाद में मूल संबोधन को सामान्यीकृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हे पिताओ’ प्रत्यक्ष संबोधन को स्पष्ट करता है, जबकि ‘हिम्मत न हारें’ ἀθυμέω के भाव को स्वाभाविक हिन्दी में व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में दिया गया फुटनोट वास्तव में उसी यूनानी क्रिया का वैकल्पिक अंग्रेज़ी रूप था; हिन्दी मुख्य पाठ में ‘हिम्मत न हारें’ स्वयं उस अर्थ को सीधे व्यक्त करता है, इसलिए अलग हिन्दी फुटनोट आवश्यक नहीं है।
