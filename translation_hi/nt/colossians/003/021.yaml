review_pass:
  verdict: revise
  source_fidelity: ‘हे पिताओ’ correctly retains the specific address to fathers, and ‘अपने बच्चों को’ accurately renders τὰ τέκνα ὑμῶν. However, ‘उकसाओ’ commonly means inciting someone to undertake an action; in this context ἐρεθίζετε concerns exasperating or provoking children by parental treatment. ‘तंग न करो’ more naturally conveys this contextual sense without narrowing it to anger. ‘निराश न हों’ accurately expresses ἀθυμῶσιν (‘become discouraged/lose heart’).
  naturalness: The draft is generally clear, but ‘बच्चों को न उकसाओ’ is somewhat semantically misleading in modern Hindi. The revised wording is idiomatic, direct, and appropriate to the dignified register of the household instruction.
  terminology: ‘पिताओ’ preserves the masculine-specific plural address and must not be generalized to ‘माता-पिताओ.’ ‘बच्चों’ remains inclusive. No theological terminology requires alteration.
  issues:
  - severity: medium
    issue: ‘न उकसाओ’ does not naturally convey the contextual force of ἐρεθίζετε in Hindi.
    rationale: In contemporary Hindi, ‘उकसाना’ primarily denotes inciting someone to do something. The Greek here warns fathers against treatment that wears children down or exasperates them; ‘तंग न करो’ conveys that effect more naturally while retaining appropriate breadth.
  revised_text: हे पिताओ, अपने बच्चों को तंग न करो, ताकि वे निराश न हों।
  revised_footnotes: []
