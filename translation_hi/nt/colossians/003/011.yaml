reference: Colossians 3:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ ⸀τὰ πάντα καὶ ἐν πᾶσιν Χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/011.yaml
  text: where there is no Greek and Jew[a], circumcision and uncircumcision, barbarian, Scythian, servant, free, but Messiah is all[c][b], and in all.
translation:
  language: hi
  text: जहाँ न यूनानी है न यहूदी, न खतना न खतनारहित, न बर्बर न स्कूती, न दास न स्वतंत्र; बल्कि मसीह ही सब कुछ है और सब में[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी का ‘सब में’ संक्षिप्त है। संदर्भ में इसका अर्थ नए किए गए समुदाय के ‘सब लोगों में’ या ‘हर एक में’ हो सकता है, पर शब्दावली व्यापक अर्थ की गुंजाइश भी रखती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου οὐκ ἔνι
  choice: जहाँ न…है
  rationale: यह पिछले पद में वर्णित नए मनुष्य के क्षेत्र को सूचित करता है और उस क्षेत्र में इन भेदों के निर्णायक न रहने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἕλλην καὶ Ἰουδαῖος
  choice: यूनानी…यहूदी
  rationale: मूल में व्यापक ‘गैर-यहूदी’ नहीं, विशेष रूप से ‘यूनानी’ है; इसलिए जातीय-सांस्कृतिक जोड़ी को यथावत रखा गया है।
- source_word: περιτομὴ καὶ ἀκροβυστία
  choice: खतना…खतनारहित
  rationale: ये सामाजिक-धार्मिक पहचान के संक्षिप्त संकेत हैं। ‘खतनारहित’ मूल के विपरीत पद को स्पष्ट रखता है, बिना लोगों का उल्लेख जोड़े।
- source_word: βάρβαρος
  choice: बर्बर
  rationale: यह प्राचीन यूनानी-सांस्कृतिक दृष्टि से बाहरी समझे जाने वाले व्यक्ति का प्रबल पहचान-सूचक पद है; ‘विदेशी’ इसका आलंकारिक और ऐतिहासिक बल घटा देता।
- source_word: Σκύθης
  choice: स्कूती
  rationale: यह एक विशिष्ट जातिनाम है, इसलिए उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: δοῦλος, ἐλεύθερος
  choice: दास…स्वतंत्र
  rationale: यहाँ सामाजिक और कानूनी स्थिति का सीधा विरोध है; ‘दास’ बंधी हुई स्थिति को और ‘स्वतंत्र’ उसके विपरीत को स्पष्ट करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: मसीह की सर्वसमावेशी महत्ता को स्वाभाविक हिन्दी में व्यक्त करता है और अनावश्यक दार्शनिक विस्तार नहीं जोड़ता।
- source_word: ἐν πᾶσιν
  choice: सब में
  rationale: मूल यूनानी की संक्षिप्तता और उसके व्यक्तिगत अथवा व्यापक संदर्भ की संभावित गुंजाइश को सुरक्षित रखता है।
- source_word: Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी में उसका स्थापित अर्थवाही रूप है।
theological_decisions:
- issue: ἐν πᾶσιν का दायरा
  choice: सब में
  alternative: सब लोगों में / हर एक में / सब वस्तुओं में
  rationale: निकट संदर्भ नया किए गए समुदाय के सदस्यों की ओर संकेत करता है, पर यूनानी पद स्वयं संक्षिप्त और कुछ हद तक खुला है। मुख्य पाठ उसे अनावश्यक रूप से केवल व्यक्तियों या केवल वस्तुओं तक सीमित नहीं करता।
- issue: τὰ πάντα और ἐν πᾶσιν के बीच संबंध
  choice: मसीह ही सब कुछ है और सब में है
  alternative: मसीह सब है और सब में
  rationale: दोनों कथनों को अलग किंतु समन्वित विधेयों के रूप में स्पष्ट किया गया है। ‘ही’ विरोधात्मक ἀλλά के बल को हिन्दी में स्वाभाविक रूप से सामने लाता है।
- issue: सामाजिक पहचानों के निषेध का अर्थ
  choice: जहाँ न…न…
  alternative: जहाँ…का कोई भेद नहीं
  rationale: मूल का कथन इन पहचानों के अस्तित्व का दार्शनिक निषेध नहीं, नए मनुष्य के क्षेत्र में उनकी निर्णायक विभाजक भूमिका का निषेध है। अधिक व्याख्यात्मक ‘कोई भेद नहीं’ जोड़ने के बजाय मूल की तीखी सूची रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और संक्षिप्त हिन्दी रखी गई है। समानांतर ‘न…न…’ संरचना यूनानी सूची की लय और सामाजिक, धार्मिक तथा जातीय विरोधों को बनाए रखती है। ‘बर्बर’ ऐतिहासिक सांस्कृतिक पद के रूप में और ‘स्कूती’ जातिनाम के रूप में सुरक्षित हैं।
