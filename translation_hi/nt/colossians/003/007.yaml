  text: In these things you too once walked[a], when you were living in them.
translation:
  language: hi
  text: इन्हीं बातों में तुम भी पहले चला करते थे[a], जब तुम इनमें जीवन बिताते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन बातों में तुम भी पहले चला करते थे, जब तुम इनमें जीवन बिताते थे।” यूनानी संबंधवाचक सर्वनाम का अधिक शाब्दिक अनुवाद “जिन बातों में” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν οἷς
  choice: इन्हीं बातों में
  rationale: संबंधवाचक सर्वनाम पिछली आयत में बताई गई बुराइयों की ओर संकेत करता है। ‘इन्हीं बातों में’ हिन्दी में संदर्भ स्पष्ट करता है और ἐν के क्षेत्रगत भाव को बनाए रखता है।
- source_word: καὶ ὑμεῖς
  choice: तुम भी
  rationale: καὶ और स्पष्ट सर्वनाम ὑμεῖς इस बात पर बल देते हैं कि कुलुस्से के विश्वासी भी पहले इसी जीवन-रीति में सहभागी थे।
- source_word: περιεπατήσατε
  choice: चला करते थे
  rationale: περιπατέω यहाँ जीवन-चाल के लिए प्रयुक्त रूपक है। ‘चला करते थे’ उस रूपक और भूतकालीन अभ्यस्त आचरण को बनाए रखता है तथा आगे के ἐζῆτε से भेद करता है।
- source_word: ποτε
  choice: पहले
  rationale: ποτε बीते हुए समय को दर्शाता है। ‘पहले’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ὅτε
  choice: जब
  rationale: यह सीधा कालवाचक संबंध व्यक्त करता है।
- source_word: ἐζῆτε
  choice: जीवन बिताते थे
  rationale: अपूर्ण भूतकाल जारी पुरानी अवस्था को दर्शाता है। ‘जीवन बिताते थे’ केवल जैविक रूप से जीवित होने के बजाय उन बातों के दायरे में रहने का भाव देता है और ‘चला करते थे’ से शब्दगत भेद बनाए रखता है।
- source_word: ἐν τούτοις
  choice: इनमें
  rationale: τούτοις पिछली बुराइयों की ओर फिर संकेत करता है। ‘इनमें’ अनावश्यक पुनरावृत्ति से बचते हुए उसी संदर्भ को बनाए रखता है।
theological_decisions:
- issue: ‘चलना’ और ‘जीवन बिताना’ के बीच संबंध
  choice: पहले पद को जीवन-चाल के रूपक के रूप में और दूसरे को उन बातों के दायरे में जारी जीवन के रूप में अलग रखा गया है।
  alternative: दोनों क्रियाओं का अनुवाद केवल ‘जीते थे’ करना।
  rationale: यह περιπατέω और ζάω के शब्दगत अंतर और पौलुस के आचरण तथा जीवन-क्षेत्र के स्तरित वर्णन को सुरक्षित रखता है, बिना कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘चला करते थे’ पौलुस के नैतिक ‘चलने’ के रूपक को रखता है; ‘जीवन बिताते थे’ पास-पास आई दोनों यूनानी क्रियाओं को अलग सुनाई देता है।
