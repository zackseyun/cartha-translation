source:
  edition: SBLGNT
  text: μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/009.yaml
  text: Do not lie to one another[a], since you have stripped off the old man with his practices[b],
translation:
  language: hi
  text: एक-दूसरे से झूठ मत बोलो, क्योंकि[a] तुमने पुराने मनुष्य[b] को उसके कामों समेत उतार दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी कृदन्त का अनुवाद अधिक शाब्दिक रूप से ‘पुराने मनुष्य को उसके कामों समेत उतारकर’ या ‘उतार चुके होने के कारण’ भी हो सकता है। यहाँ वह सम्भवतः इस आज्ञा का आधार बताता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पुराने स्वभाव’। यूनानी में शाब्दिक रूप से ‘पुराना मनुष्य’ है, जो अगले पद के ‘नए मनुष्य’ के साथ पौलुस के विरोध को सुरक्षित रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ ψεύδεσθε
  choice: झूठ मत बोलो
  rationale: μή के साथ वर्तमानकालिक आज्ञार्थक यहाँ सीधे निषेध को व्यक्त करता है। ‘झूठ मत बोलो’ स्वाभाविक और सटीक हिन्दी है; प्रसंग यह अनिवार्य नहीं करता कि इसे ‘झूठ बोलना छोड़ दो’ कहा जाए।
- source_word: εἰς ἀλλήλους
  choice: एक-दूसरे से
  rationale: यह परस्पर संबंध को दर्शाता है। हिन्दी में किसी से झूठ बोलना स्वाभाविक प्रयोग है।
- source_word: ἀπεκδυσάμενοι
  choice: क्योंकि तुमने … उतार दिया है
  rationale: अओरिस्ट मध्यवाच्य कृदन्त को यहाँ आज्ञा का आधार बताने वाला माना गया है। पूर्ण हो चुके कार्य का भाव रखते हुए ‘उतार दिया है’ वस्त्र उतारने के रूपक को भी बनाए रखता है।
- source_word: τὸν παλαιὸν ἄνθρωπον
  choice: पुराने मनुष्य
  rationale: शाब्दिक ‘पुराने मनुष्य’ से अगले पद के ‘नए मनुष्य’ के साथ पौलुस का मानवीय और प्रतिनिधिक विरोध सुरक्षित रहता है। अधिक व्याख्यात्मक ‘पुराने स्वभाव’ को मुख्य पाठ में नहीं रखा गया।
- source_word: σὺν ταῖς πράξεσιν αὐτοῦ
  choice: उसके कामों समेत
  rationale: σύν का साथ होने का भाव ‘समेत’ से और πράξεις का नैतिक कार्य-व्यवहार संबंधी भाव ‘कामों’ से सरल, स्वाभाविक हिन्दी में व्यक्त होता है। ‘उसके’ यूनानी के पुल्लिंग एकवचन संबंध को बनाए रखता है।
theological_decisions:
- issue: τὸν παλαιὸν ἄνθρωπον का अर्थ
  choice: पुराने मनुष्य
  alternative: पुराने स्वभाव / पुराने व्यक्तित्व
  rationale: मुख्य पाठ में मूल का एकवचन मानवीय रूपक और अगले पद के ‘नए मनुष्य’ से उसका संबंध सुरक्षित रखा गया है। व्याख्यात्मक विकल्प पाठक की सहायता के लिए पादटिप्पणी में दिया गया है।
- issue: ἀπεκδυσάμενοι और मुख्य आज्ञा का संबंध
  choice: 'कारण या आधार: ‘क्योंकि तुमने … उतार दिया है’'
  alternative: 'सहगामी या कालगत: ‘… उतारकर’ / ‘… उतार चुके होने के कारण’'
  rationale: निकटवर्ती प्रसंग में कृदन्त आज्ञा को विश्वासियों की बदली हुई स्थिति पर आधारित करता जान पड़ता है, पर यूनानी व्याकरण की अन्य सम्भव छायाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘पुराने मनुष्य’ सामान्य बोलचाल में कुछ असामान्य है, पर मूल रूपक और अगले पद से उसका संबंध बनाए रखने के लिए इसे जानबूझकर रखा गया है; पादटिप्पणी अधिक सहज व्याख्यात्मक विकल्प देती है।
