translation:
  language: hi
  text: हे पतियो, अपनी पत्नियों से प्रेम करो और उनके प्रति कठोर न बनो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके प्रति मन में कड़वाहट न पालो।” यूनानी क्रिया का अर्थ कड़वा या कटु हो जाना भी हो सकता है; यहाँ यह कटुता से भरे कठोर व्यवहार की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ ἄνδρες
  choice: हे पतियो
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ हो सकता है, पर घरेलू निर्देश के संदर्भ और ‘पत्नियों’ के साथ इसके संबंध से यहाँ ‘पति’ स्पष्ट अर्थ है। संबोधन को स्वाभाविक हिन्दी में ‘हे पतियो’ रखा गया है।
- source_word: ἀγαπᾶτε
  choice: प्रेम करो
  rationale: ἀγαπάω के वर्तमान आज्ञार्थक रूप का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप; यह निरंतर आचरण की आज्ञा को व्यक्त करता है।
- source_word: τὰς γυναῖκας
  choice: अपनी पत्नियों से
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; पारिवारिक संदर्भ में ‘पत्नियाँ’ अपेक्षित है। सम्बन्ध स्पष्ट और हिन्दी वाक्य स्वाभाविक बनाने के लिए ‘अपनी’ जोड़ा गया है।
- source_word: μὴ πικραίνεσθε
  choice: कठोर न बनो
  rationale: πικραίνω में ‘कड़वा होना/बनना’ का मूल भाव है, पर πρὸς αὐτάς के साथ यहाँ पत्नियों के प्रति कटु या कठोर रवैया रखने का संबंधपरक अर्थ प्रमुख है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πρὸς αὐτάς
  choice: उनके प्रति
  rationale: πρός तथा कर्मकारक यहाँ व्यवहार या मनोभाव की दिशा बताता है; ‘उनके प्रति’ हिन्दी में इसका स्पष्ट और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: लिंग-विशिष्ट वैवाहिक संबोधन
  choice: ‘पतियो’ और ‘पत्नियों’ के रूप में स्पष्ट वैवाहिक संबोधन बनाए रखा गया।
  alternative: ‘पुरुषो’ और ‘स्त्रियों’ जैसे व्यापक शब्द
  rationale: यूनानी शब्द संदर्भ में विवाहित पुरुषों को उनकी पत्नियों के संबंध में संबोधित करते हैं; इसे सामान्य पुरुष-स्त्री कथन बनाना मूल आशय को व्यापक कर देता।
- issue: πικραίνεσθε में भीतरी कटुता और बाहरी कठोरता का संबंध
  choice: मुख्य पाठ में ‘कठोर न बनो’, और पादटिप्पणी में ‘मन में कड़वाहट न पालो’ का विकल्प।
  alternative: केवल ‘उनके विरुद्ध कटु न हो जाओ’
  rationale: क्रिया कटु या कड़वा होने का भाव रखती है और संदर्भ में उससे उत्पन्न कठोर व्यवहार भी इंगित हो सकता है। पादटिप्पणी मूल की अर्थ-व्याप्ति और अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष आज्ञार्थक प्रयोग किया गया है। ‘हे पतियो’ बाइबलीय संबोधन की गरिमा रखता है, जबकि शेष वाक्य सामान्य पाठक के लिए सहज है।
