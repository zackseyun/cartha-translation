  yaml_path: translation/nt/colossians/003/003.yaml
  text: For you died, and your life has been hidden with the Messiah in God.
translation:
  language: hi
  text: क्योंकि तुम मर गए, और तुम्हारा जीवन मसीह[a] के साथ परमेश्वर में छिपा हुआ है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त के साथ।” यूनानी उपाधि Χριστός का अनुवाद ‘मसीह’ या ‘ख्रीस्त’ किया जा सकता है; यहाँ उसके अर्थ को बनाए रखने के लिए ‘मसीह’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: या, “छिपाया गया है।” यूनानी परफेक्ट काल पूरी हुई क्रिया से बनी वर्तमान अवस्था पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεθάνετε
  choice: तुम मर गए
  rationale: द्वितीय पुरुष बहुवचन के अओरिस्ट को एक निर्णायक बीती घटना के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ ζωὴ ὑμῶν
  choice: तुम्हारा जीवन
  rationale: मूल पाठ की सरल अभिव्यक्ति और एकवचन ‘जीवन’ को बनाए रखता है।
- source_word: κέκρυπται
  choice: छिपा हुआ है
  rationale: परफेक्ट पैसिव के परिणामस्वरूप बनी वर्तमान अवस्था को सहज हिन्दी में व्यक्त करता है, बिना यह तय किए कि छिपाने वाला कौन है।
- source_word: σὺν τῷ Χριστῷ
  choice: मसीह के साथ
  rationale: σύν के साहचर्य/संयुक्तता के अर्थ को ‘के साथ’ से और Χριστός की उपाधि को प्रचलित हिन्दी ‘मसीह’ से व्यक्त किया गया है।
- source_word: ἐν τῷ θεῷ
  choice: परमेश्वर में
  rationale: ἐν के स्थान अथवा क्षेत्र-सूचक अर्थ को सीधे बनाए रखता है; इसे ‘परमेश्वर के साथ’ कहकर σύν के समान नहीं बनाया गया।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में व्यक्त करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: ‘मसीह’ हिन्दी में उस अभिषिक्त जन की उपाधि का अर्थ वहन करता है और सामान्य पाठकों के लिए परिचित है; इसे केवल नाम मान लेने से बचाने के लिए पादटिप्पणी दी गई है।
- issue: κέκρυπται में पूर्ण हुई क्रिया और वर्तमान अवस्था का संबंध
  choice: छिपा हुआ है
  alternative: छिपाया गया है
  rationale: मुख्य पाठ वर्तमान परिणामी अवस्था पर बल देता है, जबकि विकल्प निष्पन्न निष्क्रिय क्रिया को अधिक स्पष्ट करता है; यूनानी परफेक्ट में दोनों पहलू उपस्थित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और निकटवर्ती संदर्भ से जुड़ा वाक्य। ‘तुम’ बहुवचन समुदाय को संबोधित करता है। ‘छिपा हुआ है’ स्वाभाविक हिन्दी रखते हुए मूल की परिणामी अवस्था और धर्मवैचारिक तनाव को सुरक्षित रखता है।
