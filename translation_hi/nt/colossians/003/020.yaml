base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/020.yaml
  text: Children[a], obey your parents in everything[b], for this is pleasing in the Lord.
translation:
  language: hi
  text: बच्चों, हर बात में अपने माता-पिता की आज्ञा मानो, क्योंकि प्रभु में[b] यह स्वीकार्य[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनभावना है।”
    reason: lexical_alternative
  - marker: b
    text: “प्रभु में” का अर्थ प्रभु के साथ संबंध के दायरे में स्वीकार्य होना भी समझा जा सकता है; इसका अर्थ केवल “प्रभु को” स्वीकार्य होना आवश्यक नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τὰ τέκνα
  choice: बच्चो
  rationale: τέκνα संतान के लिए सामान्य बहुवचन संबोधन है और केवल पुत्रों तक सीमित नहीं है। ‘बच्चो’ आधुनिक हिन्दी में सीधा और स्वाभाविक संबोधन है।
- source_word: ὑπακούετε
  choice: आज्ञा मानो
  rationale: ὑπακούω यहाँ माता-पिता के अधिकार के प्रति आज्ञापालन या अनुपालन का आदेश देता है। ‘आज्ञा मानो’ हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῖς γονεῦσιν
  choice: अपने माता-पिता की
  rationale: γονεῦσιν का अर्थ ‘माता-पिता’ है। हिन्दी वाक्य-विन्यास के अनुसार ‘आज्ञा मानो’ के साथ संबंधकारक प्रयोग हुआ है और प्रत्यक्ष संबोधन के कारण ‘अपने’ स्वाभाविक रूप से जोड़ा गया है।
- source_word: κατὰ πάντα
  choice: हर बात में
  rationale: κατὰ πάντα आज्ञापालन के विस्तार को दर्शाता है—‘सब बातों में।’ ‘हर बात में’ वर्तमान हिन्दी में स्पष्ट और सहज है तथा इसे केवल समयसूचक ‘हमेशा’ नहीं बनाता।
- source_word: τοῦτο
  choice: यह
  rationale: τοῦτο पिछले आदेश की ओर संकेत करता है। ‘यह’ यूनानी की संक्षिप्त संकेतवाचक रचना को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले आदेश का कारण बताता है; हिन्दी में ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὐάρεστόν ἐστιν
  choice: मनभावना है
  rationale: εὐάρεστος का अर्थ प्रसन्न करनेवाला या स्वीकार्य होना है। ‘मनभावना है’ मूल्यांकन के इस भाव को संक्षिप्त, dignified और समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: ἐν κυρίῳ
  choice: प्रभु में
  rationale: ἐν का मूल संबंधपरक या क्षेत्रसूचक भाव बनाए रखने के लिए ‘प्रभु में’ रखा गया है। इसे ‘प्रभु को’ कहना यूनानी वाक्यांश को अधिक संकीर्ण रूप से व्याख्यायित कर देता।
theological_decisions:
- issue: ‘हर बात में’ आज्ञापालन और ‘प्रभु में’ का परस्पर संबंध
  choice: दोनों वाक्यांशों को बिना अतिरिक्त अपवाद या व्याख्यात्मक सीमा जोड़े रखा गया है; ‘प्रभु में’ को प्रसन्नता/स्वीकार्यता वाले कथन के साथ प्रस्तुत किया गया है।
  alternative: ‘प्रभु में’ को केवल उन्हीं आदेशों तक आज्ञापालन सीमित करने वाला मानना जो प्रभु की इच्छा के अनुरूप हों, या इसे ‘क्योंकि यह प्रभु को प्रसन्न करता है’ के अर्थ में लेना।
  rationale: यूनानी पाठ ‘हर बात में’ के बाद कोई स्पष्ट अपवाद नहीं जोड़ता और ἐν κυρίῳ को सीधे आज्ञार्थक क्रिया से जोड़ना भी निश्चित नहीं है। इसलिए अनुवाद व्यापक आज्ञा और प्रभु-संबंधी क्षेत्र—दोनों को बनाए रखता है तथा धार्मिक तनाव को व्याख्या द्वारा समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सीधे पारिवारिक संबोधन और गरिमापूर्ण धार्मिक शैली के साथ रखी गई है। ‘मनभावना’ सामान्य ‘अच्छा लगता है’ से अधिक गरिमापूर्ण है, जबकि ‘सुप्रसन्नकारी’ जैसे कृत्रिम या अत्यधिक संस्कृतनिष्ठ रूप से बचा गया है।
