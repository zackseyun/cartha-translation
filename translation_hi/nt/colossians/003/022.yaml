id: COL.3.22
reference: Colossians 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ⸀ὀφθαλμοδουλίαις, ὡς ἀνθρωπάρεσκοι, ἀλλ’ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν ⸀κύριον.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/022.yaml
  text: Servants[a], obey in everything those who are your masters according to the flesh, not with eye-service, as people-pleasers, but with sincerity of heart[b][c], fearing the Lord.
translation:
  language: hi
  text: हे दासो,[a] हर बात में उन स्वामियों की आज्ञा मानो जो शरीर के अनुसार तुम्हारे स्वामी हैं।[b] केवल दिखावे की सेवा न करो[c], मानो मनुष्यों को प्रसन्न करने वाले हो; बल्कि निष्कपट हृदय से, प्रभु का भय मानते हुए, आज्ञा मानो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ यहाँ दासत्व में रखा गया व्यक्ति है; इसका अनुवाद “सेवक” भी किया जा सकता है, पर उससे प्राचीन दासत्व की वास्तविकता कम स्पष्ट हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: “शरीर के अनुसार स्वामी” से आशय इस संसार के मानवीय संबंधों में अधिकार रखने वाले स्वामियों से है; अनुवाद “सांसारिक स्वामी” भी संभव है।
    reason: lexical_alternative
  - marker: c
    text: “दिखावे की सेवा” का अर्थ है केवल तब मन लगाकर काम करना जब कोई देख रहा हो।
    reason: cultural_note
lexical_decisions:
- source_word: οἱ δοῦλοι
  choice: हे दासो
  rationale: घर-परिवार संबंधी इस निर्देश में δοῦλοι दासत्व में रखे गए व्यक्तियों को सूचित करता है; ‘सेवक’ कहने से ऐतिहासिक सामाजिक वास्तविकता नरम पड़ सकती है।
- source_word: ὑπακούετε κατὰ πάντα
  choice: हर बात में ... आज्ञा मानो
  rationale: आज्ञार्थक क्रिया और κατὰ πάντα के व्यापक दायरे को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τοῖς κατὰ σάρκα κυρίοις
  choice: अपने शरीर के अनुसार स्वामियों
  rationale: ‘शरीर के अनुसार’ मूल के पौलुसी पद को सुरक्षित रखता और इन मानवीय स्वामियों को अंत में आए दिव्य ‘प्रभु’ से अलग करता है; हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने’ जोड़ा गया है।
- source_word: μὴ ἐν ὀφθαλμοδουλίαις
  choice: केवल दिखावे की सेवा न करो
  rationale: दुर्लभ यौगिक शब्द का आशय ऐसी सेवा से है जो देखे जाते समय की जाए; शब्दशः अस्वाभाविक ‘आँख-सेवा’ के बजाय अर्थ-स्पष्ट अभिव्यक्ति चुनी गई है।
- source_word: ὡς ἀνθρωπάρεσκοι
  choice: मानो मनुष्यों को प्रसन्न करने वाले हो
  rationale: मानवीय अनुमोदन पाने की नकारात्मक प्रेरणा को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐν ἁπλότητι καρδίας
  choice: निष्कपट हृदय से
  rationale: ἁπλότης यहाँ भोलेपन के बजाय एकनिष्ठ ईमानदारी और निष्कपटता का भाव रखता है।
- source_word: φοβούμενοι τὸν κύριον
  choice: प्रभु का भय मानते हुए
  rationale: ‘प्रभु का भय’ की बाइबलीय अवधारणा और कृदन्त की प्रेरक/रीतिसूचक भूमिका दोनों सुरक्षित रहती हैं।
theological_decisions:
- issue: दासत्व की सामाजिक पृष्ठभूमि
  choice: ‘दास’ और ‘स्वामी’ द्वारा प्राचीन दासत्व की वास्तविकता को स्पष्ट रखना
  alternative: इसे आधुनिक रोजगार-संबंध बनाकर ‘सेवक’ या ‘कर्मचारी’ कहना
  rationale: मूल पद सामाजिक दासत्व की तनावपूर्ण वास्तविकता में निर्देश देता है; अनुवाद संस्था का अनुमोदन जोड़े बिना उसे छिपाता भी नहीं है।
- issue: मानवीय स्वामियों और दिव्य प्रभु का अंतर
  choice: मानवीय अधिकारियों के लिए ‘स्वामी’ और τὸν κύριον के लिए ‘प्रभु’
  alternative: दोनों स्थानों पर एक ही हिन्दी पद का प्रयोग
  rationale: संदर्भ में मौजूद भेद को स्पष्ट करता है और मानवीय अधिकार को प्रभु के समान नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हे दासो’ संबोधन को प्रत्यक्ष बनाता है; ‘शरीर के अनुसार’ मूल की अर्थपूर्ण अस्पष्टता और पौलुसी शब्दावली को सुरक्षित रखता है, जबकि पादटिप्पणी उसका संदर्भ स्पष्ट करती है।
