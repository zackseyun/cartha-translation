review_pass:
  verdict: revise
  source_fidelity: Draft correctly identifies δοῦλοι as enslaved persons and preserves the command, the contrast with human masters, sincerity of heart, and fear of the Lord. However, “अपने शरीर के अनुसार स्वामियों” is syntactically unclear in Hindi and can sound as though the masters are related to the slaves’ bodies. The added final “सेवा करो” is not required by the Greek and shifts the repeated governing idea from obedience to service.
  naturalness: Most wording is clear and appropriately formal, but the placement of the eye-service note anchor at the end is misleading, and the sentence can be made more idiomatic by explicitly repeating “आज्ञा मानो” after the contrast.
  terminology: “दास,” “स्वामी,” and “प्रभु” appropriately preserve the ancient slavery setting and distinguish human masters from the Lord. “निष्कपट हृदय” suitably renders ἁπλότης καρδίας. “शरीर के अनुसार” should be retained but recast for comprehensibility without reducing it merely to modern employment language.
  issues:
  - severity: medium
    issue: “अपने शरीर के अनुसार स्वामियों” is ambiguous and unnatural.
    rationale: κατὰ σάρκα qualifies the human masters, not the slaves’ bodies or their possession of the masters. A relative clause makes this relation clear while retaining the source expression.
  - severity: low
    issue: The final imperative “सेवा करो” is supplied where the Greek’s operative command is “obey.”
    rationale: The contrast introduced by μὴ...ἀλλά continues the command ὑπακούετε. Repeating “आज्ञा मानो” is closer to the syntax and avoids adding a distinct command.
  - severity: low
    issue: Footnote c is anchored after the final clause rather than at “दिखावे की सेवा.”
    rationale: The note explains ὀφθαλμοδουλίαις and should be attached to its translated expression.
