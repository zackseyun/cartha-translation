base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/017.yaml
  text: And whatever you do[a], in word or in deed, do everything in the name of the Lord Jesus[b], giving thanks to God the Father through him.
translation:
  language: hi
  text: और आप जो कुछ भी करें[a], चाहे बात में हो या काम में, सब कुछ प्रभु यीशु के नाम से[b] करें और उसके द्वारा परमेश्वर पिता को धन्यवाद देते रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, जो कुछ आप कहें या करें।
    reason: lexical_alternative
  - marker: b
    text: ‘नाम से’ का अर्थ ‘अधिकार के अधीन’ या ‘प्रतिनिधि के रूप में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶν ὅ τι ἐὰν ποιῆτε
  choice: जो कुछ भी करें
  rationale: यह अनिश्चित और सर्वसमावेशी यूनानी अभिव्यक्ति है। ‘जो कुछ भी करें’ सहज आधुनिक हिन्दी में उसके खुले और व्यापक अर्थ को बनाए रखता है।
- source_word: ἐν λόγῳ ἢ ἐν ἔργῳ
  choice: बात या काम में
  rationale: यह व्यक्ति के मौखिक और व्यावहारिक आचरण का संतुलित युग्म है। ‘बात’ यहाँ ‘वचन’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है और पवित्रशास्त्र वाले विशेष अर्थ का भ्रम नहीं पैदा करता।
- source_word: πάντα
  choice: वह सब
  rationale: यह पहले कही गई हर बात और हर काम को समेटता है। ‘वह सब’ हिन्दी में पुनरुक्ति से बचते हुए यूनानी के सर्वसमावेशी बल को स्पष्ट करता है।
- source_word: ἐν ὀνόματι κυρίου Ἰησοῦ
  choice: प्रभु यीशु के नाम में
  rationale: सीधी बाइबलीय अभिव्यक्ति बनाए रखी गई है, क्योंकि इसमें प्रभु यीशु के अधिकार, प्रतिनिधित्व और उनसे जुड़ी पहचान—सभी की अर्थ-छायाएँ हो सकती हैं।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ κύριος यीशु की उपाधि है। ‘प्रभु’ नए नियम के प्रयोग और इस उपाधि के धर्मवैचारिक भार, दोनों को सुरक्षित रखता है।
- source_word: εὐχαριστοῦντες
  choice: धन्यवाद देते रहें
  rationale: वर्तमान कृदंत मुख्य आज्ञा के साथ चलते रहने वाले धन्यवाद को व्यक्त करता है। हिन्दी में ‘देते रहें’ उसकी निरंतरता और उपदेशात्मक बल को स्वाभाविक रूप से प्रकट करता है।
- source_word: τῷ θεῷ πατρὶ
  choice: परमेश्वर पिता को
  rationale: πατρί, θεῷ के समानाधिकरण में है; ‘परमेश्वर पिता’ स्पष्ट, प्रचलित और स्रोत के अनुरूप हिन्दी है।
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: सर्वनाम का निकटतम पूर्वपद ‘प्रभु यीशु’ है। ‘उसके द्वारा’ यूनानी सर्वनाम और मध्यस्थता के भाव को बिना अनावश्यक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: ‘प्रभु यीशु के नाम में’ का अर्थ-बल
  choice: मुख्य पाठ में ‘प्रभु यीशु के नाम में’ मुहावरा बनाए रखा गया है।
  alternative: ‘प्रभु यीशु के अधिकार के अधीन’ अथवा ‘प्रभु यीशु का प्रतिनिधित्व करते हुए’
  rationale: इस अभिव्यक्ति में अधिकार, प्रतिनिधित्व, पहचान और निष्ठा की व्यापक अर्थ-सीमा हो सकती है। किसी एक व्याख्या को मुख्य पाठ में रखने से मूल की समृद्धि संकुचित हो जाती।
- issue: ‘उसके द्वारा’ का संदर्भ
  choice: सर्वनाम प्रभु यीशु की ओर संकेत करता है, जिनके द्वारा पिता परमेश्वर को धन्यवाद दिया जाता है।
  alternative: पूर्ववर्ती कथन से जुड़ा कोई अस्पष्ट या सामान्य संदर्भ
  rationale: व्याकरण की दृष्टि से निकटतम पूर्वपद ‘प्रभु यीशु’ है। अनुवाद सर्वनाम को बनाए रखता है, जबकि वाक्य-संदर्भ उसके स्वाभाविक संकेत को स्पष्ट रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामुदायिक उपदेश के अनुकूल रूप अपनाया गया है। ‘बात या काम’ सामान्य पाठकों के लिए स्पष्ट है; ‘प्रभु यीशु के नाम में’ मूल बाइबलीय मुहावरे और उसकी बहुअर्थी धर्मवैचारिक गहराई को बनाए रखता है।
