  text: ὁ ⸀γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/025.yaml
  text: For the wrongdoer will be repaid for what he has done wrong[b][a], and there is no partiality.
translation:
  language: hi
  text: क्योंकि जो अन्याय करता है, उसने जो अन्याय किया है, उसका फल उसे मिलेगा[a]; और किसी के साथ पक्षपात नहीं होता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अन्याय करता है, उसने जो अन्याय किया है, वही उसे वापस मिलेगा।”
    reason: κομίσεται में अपने किए का प्रतिफल वापस पाने का भाव अधिक प्रत्यक्ष रूप से दिखाने वाला शाब्दिक विकल्प।
  - marker: b
    text: अर्थात बाहरी पद या हैसियत देखकर किसी का पक्ष नहीं लिया जाता; शाब्दिक भाव है, “चेहरा ग्रहण करना।”
    reason: προσωπολημψία के मुहावरेदार अर्थ और उसकी शाब्दिक पृष्ठभूमि को स्पष्ट करना।
lexical_decisions:
- source_word: ὁ γὰρ ἀδικῶν
  choice: क्योंकि जो अन्याय करता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदंत किसी भी अन्याय करने वाले व्यक्ति के लिए सामान्य कथन है। ‘क्योंकि’ γάρ के व्याख्यात्मक आधार-सूचक अर्थ को व्यक्त करता है।
- source_word: κομίσεται
  choice: उसका फल उसे मिलेगा
  rationale: यहाँ क्रिया अपने किए के अनुरूप प्रतिफल पाने का भाव रखती है। ‘फल मिलेगा’ स्वाभाविक हिन्दी में प्रतिफल का अर्थ स्पष्ट करता है, पर प्रतिफल की रीति या समय निर्धारित नहीं करता।
- source_word: ὃ ἠδίκησεν
  choice: उसने जो अन्याय किया है
  rationale: यह पद किए गए अन्याय की ओर लौटता है और ἀδικέω की पुनरावृत्ति को हिन्दी में ‘अन्याय’ द्वारा बनाए रखता है।
- source_word: οὐκ ἔστιν προσωπολημψία
  choice: किसी के साथ पक्षपात नहीं होता
  rationale: προσωπολημψία पद, प्रतिष्ठा या बाहरी हैसियत देखकर भेदभावपूर्ण अनुग्रह करने को दर्शाता है। ‘पक्षपात’ आधुनिक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला शब्द है।
theological_decisions:
- issue: न्याय और निष्पक्ष प्रतिफल का स्वरूप
  choice: यह पद अन्याय के निष्पक्ष प्रतिफल का सामान्य सिद्धांत बताता है, पर न्याय की रीति और समय को अनिर्दिष्ट छोड़ता है।
  alternative: इसे केवल अंतिम न्याय या केवल दास-मालिक संबंधों तक सीमित कथन मानना।
  rationale: यूनानी कथन व्यापक है। अनुवाद उसके गंभीर आशय को बनाए रखता है, लेकिन उसके दायरे या समय को मूल पाठ से अधिक संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। सामान्य कर्ता को ‘जो … करता है’ से व्यक्त किया गया है, जिससे यूनानी एकवचन का सामान्य मानवीय संदर्भ स्वाभाविक हिन्दी में बना रहता है।
