  edition: SBLGNT
  text: εἰδότες ὅτι ἀπὸ κυρίου ⸀ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· ⸀τῷ κυρίῳ Χριστῷ δουλεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/024.yaml
  text: knowing that from the Lord you will receive the reward of the inheritance[b][a]. Serve the Lord Messiah.
translation:
  language: hi
  text: यह जानते हुए कि तुम्हें प्रभु से विरासत का प्रतिफल मिलेगा। तुम प्रभु मसीह की सेवा करते हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का रूप ‘तुम सेवा करते हो’ है, न कि सीधी आज्ञा ‘सेवा करो’; फिर भी प्रसंग में इस कथन का उपदेशात्मक बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδότες
  choice: यह जानते हुए कि
  rationale: कृदन्त रूप और पिछले उपदेश से उसके संबंध को बनाए रखता है; इसे स्पष्टतः कारणवाचक बनाकर अर्थ को सीमित नहीं करता।
- source_word: ἀπὸ κυρίου
  choice: प्रभु से
  rationale: ἀπό के साथ संबंधकारक प्रतिफल के स्रोत को व्यक्त करता है। दास-स्वामी प्रसंग के बावजूद यहाँ ‘प्रभु’ मसीही उपाधि को भी सुरक्षित रखता है।
- source_word: ἀπολήμψεσθε
  choice: तुम्हें ... मिलेगा
  rationale: भविष्यकालीन प्राप्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रत्युत्तर या बदले की छाया ‘प्रतिफल’ में आती है।
- source_word: ἀνταπόδοσιν
  choice: प्रतिफल
  rationale: सकारात्मक भाव में मिलने वाले recompense/reward के लिए स्पष्ट, गरिमापूर्ण और प्रचलित हिन्दी शब्द।
- source_word: τῆς κληρονομίας
  choice: विरासत का
  rationale: यूनानी संबंधकारक की संक्षिप्तता और यह संभावित अस्पष्टता बनाए रखता है कि विरासत प्रतिफल का स्वरूप है या उससे निकटता से जुड़ी है।
- source_word: τῷ κυρίῳ Χριστῷ
  choice: प्रभु मसीह की
  rationale: δουλεύετε के साथ सेवा के पात्र को व्यक्त करता है। Χριστός को नाम मात्र न बनाकर उसकी उपाधिगत शक्ति ‘मसीह’ से सुरक्षित रखी गई है।
- source_word: δουλεύετε
  choice: तुम ... सेवा कर रहे हो
  rationale: यह वर्तमानकाल, कर्तृवाच्य, निर्देशार्थक रूप है; इसलिए इसे प्रत्यक्ष आज्ञा के बजाय प्रेरक स्मरण के रूप में रखा गया है।
theological_decisions:
- issue: δουλεύετε का वाच्यार्थ और वाक्य-बल
  choice: निर्देशार्थक—‘तुम ... सेवा कर रहे हो’
  alternative: आज्ञार्थक भाव—‘प्रभु मसीह की सेवा करो’
  rationale: यूनानी रूप व्याकरणतः वर्तमान निर्देशार्थक है। प्रसंग में आज्ञात्मक प्रभाव संभव है, पर अनुवाद में उसे प्रत्यक्ष आज्ञा बना देना मूल रूप की महत्त्वपूर्ण विशेषता मिटा देता।
- issue: Χριστῷ का उपाधिगत अर्थ
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ Χριστός प्रभु के साथ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त राजा वाले अर्थ को सामान्य हिन्दी पाठक के लिए अधिक स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘विरासत का प्रतिफल’ मूल यूनानी संबंधकारक की संक्षिप्तता और संभावित अर्थ-तनाव को बनाए रखता है; ‘प्रभु मसीह’ परिचित धार्मिक भाषा है, पर अनावश्यक सांप्रदायिक शब्दावली से बचता है।
