- source_word: τοὺς υἱοὺς τῆς ἀπειθείας
  choice: अवज्ञा की सन्तानों
  rationale: यह सामी शैली का मुहावरा उन लोगों को दर्शाता है जिनकी पहचान अवज्ञा से होती है। हिन्दी में ‘सन्तान’ सामूहिक रूप से लोगों को समेटते हुए मूल मुहावरे की बनावट भी बनाए रखता है।
theological_decisions:
- issue: ‘अवज्ञा की सन्तान’ मुहावरे को बनाए रखना या उसका अर्थ सीधे खोल देना
  choice: मुख्य पाठ में ‘अवज्ञा की सन्तानों’ रखना
  alternative: अवज्ञाकारी लोगों
  rationale: मूल यूनानी की सामी मुहावरेदार अभिव्यक्ति को सुरक्षित रखा गया है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है। इससे पाठ की स्रोत-भाषायी बनावट और उसका वास्तविक अर्थ दोनों बने रहते हैं।
