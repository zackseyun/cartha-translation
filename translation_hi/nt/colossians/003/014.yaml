source:
  edition: SBLGNT
  text: ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ⸀ὅ ἐστιν σύνδεσμος τῆς τελειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/014.yaml
  text: And above all these[a], put on love, which is the bond of perfection.
translation:
  language: hi
  text: और इन सबके ऊपर प्रेम को पहन लो, जो पूर्णता का बंधन है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सम्पूर्णता का बंधन’ अथवा ‘परिपक्वता का बंधन।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὶ πᾶσιν δὲ τούτοις
  choice: और इन सबके ऊपर
  rationale: 'यह वाक्यांश पद 12 से चले आ रहे वस्त्र पहनने के रूपक को बनाए रखता है: प्रेम अन्य सद्गुणों के ऊपर पहना जाता है। साथ ही इसमें प्रेम की प्रधानता का भाव भी बना रहता है।'
- source_word: τὴν ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη के लिए स्वाभाविक और व्यापक हिन्दी शब्द ‘प्रेम’ है; यहाँ यह बाकी सद्गुणों को पूर्ण करने वाला प्रमुख गुण है।
- source_word: '[संदर्भ से निहित क्रिया: ἐνδύσασθε, पद 12]'
  choice: पहन लो
  rationale: यूनानी में इस उपवाक्य की क्रिया पद 12 के आदेश से समझी जाती है। हिन्दी में वाक्य पूरा और स्वाभाविक बनाने तथा वस्त्र-रूपक सुरक्षित रखने के लिए इसे स्पष्ट किया गया है।
- source_word: ὅ
  choice: जो
  rationale: नपुंसकलिंग सम्बन्धवाचक सर्वनाम प्रेम की धारणा अथवा पूरे पूर्ववर्ती निर्देश पर टिप्पणी करता है। ‘जो’ इस अस्पष्टता को अनावश्यक रूप से हल किए बिना सहज हिन्दी देता है।
- source_word: σύνδεσμος
  choice: बंधन
  rationale: शब्द का मूल भाव वह वस्तु या सम्बन्ध है जो चीज़ों को एक साथ बाँधता है। ‘बंधन’ संक्षिप्त है और एकता के रूपक को बनाए रखता है।
- source_word: τῆς τελειότητος
  choice: सिद्धता का
  rationale: τελειότης में पूर्णता, समग्रता और परिपक्वता के अर्थ-संकेत हैं। ‘सिद्धता’ संक्षिप्त सम्बन्धकारक अभिव्यक्ति को बनाए रखती है और यह तय नहीं करती कि प्रेम सिद्धता से सम्बन्धित है या उसे उत्पन्न करता है।
theological_decisions:
- issue: प्रेम को σύνδεσμος τῆς τελειότητος कहने का अर्थ
  choice: ‘सिद्धता का बंधन’ के रूप में यूनानी की संक्षिप्त और अर्थगत रूप से खुली अभिव्यक्ति सुरक्षित रखी गई है।
  alternative: ‘वह बंधन जो सबको पूर्णता में बाँधता है’ अथवा ‘परिपक्वता का बंधन’।
  rationale: सम्बन्धकारक τῆς τελειότητος प्रेम को सिद्धता से सम्बन्धित बंधन, सिद्धता उत्पन्न करने वाला बंधन, या सद्गुणों को पूर्ण समग्रता में बाँधने वाला बंधन बता सकता है। अनुवाद इस तनाव को किसी एक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पहन लो’ आसपास के वस्त्र-रूपक को स्पष्ट रखता है; ‘सिद्धता का बंधन’ मूल की संक्षिप्तता और धर्मवैचारिक खुलापन बनाए रखता है।
