  text: bearing with one another and forgiving each other[a], if anyone has a complaint against anyone; just as the Lord also forgave you[b], so also you must do.
translation:
  language: hi
  text: एक-दूसरे को सहते रहो और आपस में क्षमा करते रहो। यदि किसी को किसी के विरुद्ध कोई शिकायत हो[a], तो जैसे प्रभु ने तुम्हें क्षमा किया, वैसे ही तुम भी क्षमा करो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि किसी को किसी के विरुद्ध कोई दोष देने का कारण हो।”
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में अंतिम खंड में “क्षमा करो” क्रिया निहित है; वह प्रसंग से समझी जाती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνεχόμενοι
  choice: एक-दूसरे को सहते रहो
  rationale: वर्तमानकालिक कृदंत का समुदाय के लिए जारी नैतिक निर्देश वाला भाव है। ‘सहते रहो’ निरंतर धैर्य और पारस्परिक सहनशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χαριζόμενοι ἑαυτοῖς
  choice: आपस में क्षमा करते रहो
  rationale: यहाँ χαρίζομαι अपराध क्षमा करने के अर्थ में है और ἑαυτοῖς का बल पारस्परिक है। ‘आपस में’ समुदाय के भीतर एक-दूसरे के प्रति की जाने वाली क्रिया को स्पष्ट करता है।
- source_word: ἐάν τις πρός τινα ἔχῃ μομφήν
  choice: यदि किसी को किसी के विरुद्ध कोई शिकायत हो
  rationale: अनिश्चित शर्त और μομφή के शिकायत अथवा दोषारोपण के कारण वाले भाव को बिना औपचारिक अभियोग का अर्थ थोपे सुरक्षित रखता है।
- source_word: καθὼς καὶ
  choice: जैसे ... वैसे ही
  rationale: प्रभु की क्षमा और विश्वासियों की क्षमा के बीच तुलना तथा अनुकरण के सम्बन्ध को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: κύριος की उपाधि को सुरक्षित रखता है और उसके अभिप्रेत व्यक्ति को अनुवाद में आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: ἐχαρίσατο
  choice: क्षमा किया
  rationale: पूर्ववर्ती χαριζόμενοι के साथ अर्थगत समानता बनाए रखता है और इस सन्दर्भ में स्वाभाविक हिन्दी है।
- source_word: οὕτως καὶ ὑμεῖς
  choice: वैसे ही तुम भी क्षमा करो
  rationale: यूनानी में क्रिया अध्याहृत है; हिन्दी में वाक्य को स्वाभाविक और स्पष्ट बनाने के लिए सन्दर्भ से ‘क्षमा करो’ पूरा किया गया है।
theological_decisions:
- issue: ὁ κύριος का अभिप्रेत व्यक्ति
  choice: मूल उपाधि को ‘प्रभु’ के रूप में रखा गया
  alternative: ‘मसीह’ या ‘परमेश्वर’ कहकर अभिप्रेत व्यक्ति को स्पष्ट करना
  rationale: कुलुस्सियों के सन्दर्भ में यह सम्भवतः मसीह की ओर संकेत करता है, पर यूनानी केवल उपाधि देता है। ‘प्रभु’ वास्तविक पाठगत व्यापकता को बनाए रखता है।
- issue: अन्तिम खण्ड में अध्याहार
  choice: ‘क्षमा करो’ क्रिया को स्पष्ट रूप से पूरा किया गया
  alternative: ‘वैसे ही तुम भी’ कहकर वाक्य को मूल की तरह अपूर्ण छोड़ना
  rationale: यूनानी में अपेक्षित क्रिया निकटवर्ती क्षमा के कथन से स्पष्ट है। हिन्दी में उसे जोड़ना अर्थ नहीं बदलता और निर्देश को स्वाभाविक बनाता है; पादटिप्पणी मूल की संक्षिप्तता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामुदायिक उपदेश वाला रूप अपनाया गया है। ‘सहते रहो’ और ‘क्षमा करते रहो’ निरंतर आचरण का भाव रखते हैं; ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है।
