base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/015.yaml
  text: And let the peace of Messiah rule in your hearts[a], to which indeed you were called in one body[c][b]. And be thankful.
translation:
  language: hi
  text: और मसीह[a] की शांति तुम्हारे हृदयों में शासन करे[b]; उसी शांति के लिए तुम एक देह में बुलाए भी गए थे[c]। और कृतज्ञ बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ के लिए प्रयुक्त यूनानी उपाधि Χριστός का अर्थ ‘अभिषिक्त जन’ है; इसे ‘ख्रीस्त’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘शासन करे’ के लिए प्रयुक्त यूनानी क्रिया का अर्थ ‘निर्णायक बने’ या ‘पंच की तरह निर्णय करे’ भी हो सकता है। इससे समुदाय के भीतरी जीवन में मसीह की शांति की निर्णायक भूमिका पर बल पड़ता है।
    reason: lexical_alternative
  - marker: c
    text: 'संभव अनुवाद: ‘एक देह होने के लिए बुलाए गए थे।’ इससे एक ही देह में सम्मिलित किए जाने पर बल पड़ता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰρήνη
  choice: शांति
  rationale: यह पौलुस के संदर्भ में परमेश्वर के उद्धारकारी कार्य से उपजी पारस्परिक और सामुदायिक शांति को व्यक्त करता है; आधुनिक हिंदी में यही स्वाभाविक समतुल्य है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह की
  rationale: Χριστός यहां उपाधि के रूप में प्रयुक्त है। हिंदी का प्रचलित शब्द ‘मसीह’ अभिषिक्त जन की उपाधि को बनाए रखता है।
- source_word: βραβευέτω
  choice: शासन करे
  rationale: मूल क्रिया निर्णायक या पंच की तरह निर्णय करने का बिंब रखती है। ‘शासन करे’ हिंदी में उसके नियंत्रक और निर्णायक प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: तुम्हारे हृदयों में
  rationale: बहुवचन को बनाए रखते हुए यह समुदाय के सदस्यों के भीतरी जीवन, भावनाओं और इच्छाशक्ति की ओर संकेत करता है।
- source_word: εἰς ἣν
  choice: उसी शांति के लिए
  rationale: संबंधवाचक पद का पूर्वपद ‘शांति’ है और εἰς यहां बुलाहट के लक्ष्य को व्यक्त कर सकता है। स्पष्टता के लिए हिंदी में पूर्वपद दोहराया गया है।
- source_word: καὶ ἐκλήθητε
  choice: बुलाए भी गए थे
  rationale: यहां καί बल देने वाला है; ‘भी’ उस बल को संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐν ἑνὶ σώματι
  choice: एक देह में
  rationale: यह ἐν और रूपक दोनों को सीधे बनाए रखता है तथा ‘देह’ को व्याख्यात्मक रूप से ‘कलीसिया’ में नहीं बदलता।
- source_word: εὐχάριστοι γίνεσθε
  choice: कृतज्ञ बने रहो
  rationale: γίνεσθε में ऐसी अवस्था अपनाने और उसमें बने रहने का भाव हो सकता है; ‘बने रहो’ इस सतत आग्रह को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यह पद यहां उपाधि है; ‘मसीह’ हिंदी में प्रचलित रहते हुए ‘अभिषिक्त जन’ का मसीही अर्थ सुरक्षित रखता है।
- issue: βραβευέτω की निर्णायक छवि
  choice: शासन करे
  alternative: निर्णायक बने / पंच की तरह निर्णय करे
  rationale: मुख्य पाठ में सुबोध exhortation रखी गई है, जबकि मूल क्रिया की निर्णायक या मध्यस्थ छवि पादटिप्पणी में सुरक्षित है।
- issue: एक देह का आशय
  choice: रूपक को ‘एक देह में’ के रूप में बनाए रखना
  alternative: एक देह होने के लिए / कलीसिया में
  rationale: सामुदायिक एकता और कलीसियाई संदर्भ निहित हैं, पर मूल पाठ रूपक की स्पष्ट व्याख्या नहीं करता; इसलिए अनुवाद उसे खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘हृदयों’ और ‘एक देह’ जैसे पौलुसी बिंबों को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखा गया है; ‘कृतज्ञ बने रहो’ निरंतर आचरण के आग्रह को व्यक्त करता है।
