base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/004.yaml
  text: When Messiah[a], who is your life, is revealed[c][b], then you also will be revealed with him in glory.
translation:
  language: hi
  text: जब मसीह[a]—आपका जीवन[b]—प्रकट होगा, तब आप भी उसके साथ महिमा में प्रकट होंगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ के स्थान पर ‘क्राइस्ट’ भी कहा जा सकता है। यूनानी Χριστός एक उपाधि है, जिसका अर्थ ‘अभिषिक्त’ है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, ‘मसीह, आपका जीवन।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘प्रकट किए जाएँगे।’ इसी यूनानी क्रिया का रूप इस पद में पहले मसीह के प्रकट होने के लिए भी आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह भविष्य में अपेक्षित घटना का समय बताता है; हिन्दी में ‘जब’ स्वाभाविक और सटीक है।
- source_word: ὁ Χριστὸς
  choice: मसीह
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है। ‘मसीह’ उसके अभिषिक्त जन के अर्थ और हिन्दी की प्रचलित बाइबलीय शब्दावली—दोनों को सुरक्षित रखता है।
- source_word: φανερωθῇ / φανερωθήσεσθε
  choice: प्रकट होगा / प्रकट होंगे
  rationale: दोनों रूप एक ही यूनानी क्रिया से हैं। ‘प्रकट’ की पुनरावृत्ति मसीह और विश्वासियों के बीच मूल पाठ का समानांतर संबंध बनाए रखती है; हिन्दी में अकर्मक रूप प्रसंगानुकूल और स्वाभाविक है।
- source_word: ἡ ζωὴ ὑμῶν
  choice: आपका जीवन
  rationale: मूल में यह ‘मसीह’ के समानाधिकरण में है। डैश के बीच रखकर उस संक्षिप्त और बलपूर्ण पहचान को सुरक्षित रखा गया है, बिना व्याख्यात्मक संबंधवाचक उपवाक्य जोड़े।
- source_word: τότε καὶ ὑμεῖς
  choice: तब आप भी
  rationale: ‘तब’ समयगत परिणाम और ‘भी’ विश्वासियों की सहभागिता तथा यूनानी के स्पष्ट सर्वनाम का बल व्यक्त करता है।
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: यह मसीह के साथ निकट सहभागिता को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν δόξῃ
  choice: महिमा में
  rationale: यह मूल पूर्वसर्गीय संरचना और उसके संभावित क्षेत्र अथवा रीति—दोनों अर्थों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: Χριστός को उपाधि या नाम-जैसे रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: सप्रत्यय ὁ Χριστός यहाँ उपाधिगत बल रखता है। ‘मसीह’ हिन्दी में अर्थपूर्ण और प्रचलित रूप है; इसे केवल व्यक्तिनाम मानकर उसका उपाधिगत अर्थ दबाया नहीं गया।
- issue: मसीह को विश्वासियों का जीवन बताने वाला समानाधिकरण
  choice: मसीह—आपका जीवन—
  alternative: मसीह, जो आपका जीवन है
  rationale: डैश मूल के संक्षिप्त समानाधिकरण और उसकी धर्मवैचारिक तीव्रता को बनाए रखते हैं; संबंधवाचक रूप अधिक स्पष्ट है, पर मूल से कुछ अधिक व्याख्यात्मक होता।
- issue: φανερόω के कर्मवाच्य रूपों का हिन्दी निरूपण
  choice: प्रकट होगा / प्रकट होंगे
  alternative: प्रकट किया जाएगा / प्रकट किए जाएँगे
  rationale: यूनानी रूप व्याकरणतः कर्मवाच्य हैं, पर यहाँ उनका अर्थ दिखाई देने या खुले रूप में प्रकट होने का है। हिन्दी का अकर्मक प्रयोग स्वाभाविक है और किसी अनिर्दिष्ट कर्ता को अनावश्यक रूप से सामने नहीं लाता; पादटिप्पणी में अधिक शाब्दिक कर्मवाच्य विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण सामुदायिक संबोधन के लिए ‘आप’ का प्रयोग किया गया है। वाक्य में डैश मूल के संक्षिप्त समानाधिकरण को स्पष्ट रखते हैं, और ‘प्रकट’ की पुनरावृत्ति यूनानी पाठ की जानबूझकर की गई शब्दगत समानता बचाती है।
