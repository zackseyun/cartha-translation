lexical_decisions:
- source_word: Ἐνδύσασθε
  choice: पहन लो
  rationale: यह रूपकात्मक आज्ञा सद्गुणों को वस्त्र की तरह धारण करने की बात करती है। ‘पहन लो’ सहज हिन्दी में वस्त्र-रूपक को बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निष्कर्ष और संबंध प्रकट करता है; ‘इसलिए’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: ὡς ἐκλεκτοὶ τοῦ θεοῦ
  choice: परमेश्वर के चुने हुए ... लोगों के समान
  rationale: यह पाठकों को परमेश्वर द्वारा चुने गए लोगों के रूप में उनकी पहचान के अनुरूप आचरण करने को कहता है। ‘चुने हुए’ मूल अर्थ रखता है और किसी विशिष्ट धर्मवैज्ञानिक प्रणाली को नहीं जोड़ता।
- source_word: ἅγιοι καὶ ἠγαπημένοι
  choice: पवित्र और प्रिय
  rationale: दोनों शब्द पाठकों की पहचान बताते हैं। ‘प्रिय’ ἠγαπημένοι में निहित प्रेम पाए हुए होने की स्थायी स्थिति को सहज रूप में व्यक्त करता है।
- source_word: σπλάγχνα οἰκτιρμοῦ
  choice: करुणामय हृदय
  rationale: शाब्दिक अर्थ ‘करुणा के अंतरंग अंग’ है, जो गहरी, भीतर से उठने वाली करुणा का सामी मुहावरा है। हिन्दी में ‘करुणामय हृदय’ उसी आंतरिक भाव को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: χρηστότητα
  choice: दयालुता
  rationale: इस सद्गुण-सूची में यह दूसरों के प्रति भलाई और कृपालु व्यवहार को दर्शाता है; ‘दयालुता’ सामान्य और स्पष्ट हिन्दी है।
- source_word: ταπεινοφροσύνην
  choice: नम्रता
  rationale: यह स्वयं को दीन समझने वाली विनीत मनोवृत्ति का द्योतक है; ‘नम्रता’ इसका स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: πραΰτητα
  choice: कोमलता
  rationale: यह विनम्र, अनाक्रामक और संयमित व्यवहार को व्यक्त करता है। ‘कोमलता’ आधुनिक पाठक के लिए स्पष्ट है और ‘दीनता’ से होने वाली कमजोरी की संभावित गलत धारणा से बचता है।
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यह विशेषतः लोगों के प्रति देर तक सहनशील बने रहने को दर्शाता है। ‘धीरज’ संक्षिप्त, स्वाभाविक और सद्गुण-सूची के अनुकूल है।
theological_decisions:
- issue: ἐκλεκτοὶ τοῦ θεοῦ में चुनाव की भाषा को किसी विशिष्ट मत-पद्धति से जोड़े बिना सुरक्षित रखना
  choice: परमेश्वर के चुने हुए ... लोग
  alternative: परमेश्वर के निर्वाचित जन
  rationale: यह पद परमेश्वर की पहल से हुई चुनी हुई पहचान बताता है, पर चुनाव की प्रक्रिया या क्रम की व्याख्या नहीं करता। ‘चुने हुए’ मूल अर्थ को स्पष्ट रखता है और बाद की पारिभाषिक मतगत धारणाएँ नहीं जोड़ता।
- issue: πραΰτης का आधुनिक और नैतिक रूप से सार्थक अनुवाद
  choice: कोमलता
  alternative: दीनता
  rationale: ‘कोमलता’ संयमित और विनम्र आचरण का भाव देता है; ‘दीनता’ आज कमजोरी या हीनता का भ्रामक संकेत दे सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सहज शैली। वस्त्र पहनने का मूल रूपक बनाए रखा गया है। पहचान-सूचक पदों को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है और चुनाव संबंधी भाषा को मतगत विस्तार दिए बिना अनूदित किया गया है।
