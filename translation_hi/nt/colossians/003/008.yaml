source:
  edition: SBLGNT
  text: νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/008.yaml
  text: 'But now you also must put away all these things: anger, rage, malice, slander, and filthy speech from your mouth.'
translation:
  language: hi
  text: 'पर अब तुम भी इन सबको उतार फेंको: क्रोध, तैश, दुर्भावना, निंदा, और मुँह से अश्लील बातें कहना।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόθεσθε
  choice: उतार फेंको
  rationale: यह कपड़ा उतारने के मूल बिंब को बनाए रखता है और कुलुस्सियों 3:9-10 में पुराने मनुष्य को उतारने के निकटवर्ती संदर्भ से मेल खाता है।
- source_word: ὀργήν
  choice: क्रोध
  rationale: यह अपेक्षाकृत स्थायी या भीतर बसे रोष के लिए स्वाभाविक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: θυμόν
  choice: तैश
  rationale: यह भड़क उठने वाले तीव्र गुस्से को व्यक्त करता है और ὀργή से अर्थगत भेद बनाए रखता है।
- source_word: κακίαν
  choice: द्वेष
  rationale: इस संदर्भ में यह दूसरों का बुरा चाहने वाली दुर्भावना को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βλασφημίαν
  choice: निंदा
  rationale: यहाँ सूची मानवीय संबंधों और वाणी के दोषों की है, इसलिए अपमानजनक या बदनाम करने वाली वाणी का सामान्य अर्थ उपयुक्त है।
- source_word: αἰσχρολογίαν
  choice: अश्लील बातें
  rationale: यह लज्जाजनक, अभद्र या अशोभनीय वाणी को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐκ τοῦ στόματος ὑμῶν
  choice: अपने मुँह से निकली
  rationale: वाणी के मुँह से निकलने के स्रोत को स्वाभाविक हिन्दी में स्पष्ट रखते हुए मूल वाक्यांश को सूची की अंतिम वाणी-संबंधी वस्तु से जोड़ता है।
theological_decisions:
- issue: βλασφημία का आशय
  choice: मनुष्यों की निंदा या अपमानजनक वाणी
  alternative: परमेश्वर की निंदा
  rationale: शब्द दोनों अर्थों में प्रयुक्त हो सकता है, पर इस वचन में दुर्भावना और अश्लील वाणी के साथ इसका स्थान पारस्परिक, हानिकारक बोलचाल की ओर संकेत करता है; अनुवाद में कोई सांप्रदायिक अर्थ नहीं जोड़ा गया।
- issue: आज्ञा का बल
  choice: सीधी आज्ञा—“उतार फेंको”
  alternative: कर्तव्यसूचक रूप—“त्याग देना चाहिए”
  rationale: ἀπόθεσθε स्पष्ट विधिलिंग आज्ञा है; इसलिए प्रत्यक्ष आज्ञार्थक रूप मूल के बल को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण है। “क्रोध” और “तैश” से ὀργή तथा θυμός के बीच का संभावित अंतर बचाया गया है। “उतार फेंको” निकटवर्ती वस्त्र-परिवर्तन के रूपक को बनाए रखता है, जबकि पूरी पंक्ति सामान्य पाठक के लिए सहज रहती है।
