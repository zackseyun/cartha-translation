lexical_decisions:
- source_word: ἐνδυσάμενοι
  choice: पहन लिया है
  rationale: अोरिस्ट मध्यम कृदंत को निकटवर्ती संदर्भ से जोड़ते हुए पूर्ण हुई क्रिया के रूप में व्यक्त किया गया है; वस्त्र पहनने का रूपक भी सुरक्षित रहता है।
- source_word: τὸν νέον
  choice: नए मनुष्य
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और संदर्भ के ‘पुराने मनुष्य’ के विपरीत है। ‘मनुष्य’ हिन्दी में मानव-व्यक्ति को दर्शाता है और यूनानी अभिव्यक्ति के मानवशास्त्रीय तथा संभावित सामूहिक आयाम को खुला रखता है।
- source_word: ἀνακαινούμενον
  choice: नया किया जा रहा है
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत लगातार चल रही प्रक्रिया और कर्मवाच्य—दोनों को व्यक्त करता है।
- source_word: εἰς ἐπίγνωσιν
  choice: ज्ञान की ओर
  rationale: εἰς नवीकरण की दिशा या परिणति बताता है। ἐπίγνωσις में गहरे या पूर्ण ज्ञान का भाव हो सकता है, पर मुख्य पाठ में ‘पूर्ण’ जोड़ना अपेक्षा से अधिक स्पष्ट कर देगा।
- source_word: κατ’ εἰκόνα
  choice: स्वरूप के अनुसार
  rationale: κατά के अनुरूपता या मानक वाले अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और उत्पत्ति की स्वरूप-भाषा की संभावित प्रतिध्वनि सुरक्षित रखता है।
- source_word: τοῦ κτίσαντος αὐτόν
  choice: अपने रचने वाले के
  rationale: यह कृदंतीय वाक्यांश नए मनुष्य के रचयिता को नवीकरण का प्रतिरूप बताता है। ‘अपने’ से αὐτόν का संबंध स्वाभाविक हिन्दी में बना रहता है।
theological_decisions:
- issue: τὸν νέον का मानवशास्त्रीय अर्थ
  choice: नए मनुष्य
  alternative: नया स्वभाव / नया व्यक्ति
  rationale: ‘नए मनुष्य’ से निकटवर्ती ‘पुराने मनुष्य’ के साथ स्पष्ट समानांतर बना रहता है और व्यक्तिगत तथा सामूहिक दोनों संभावनाएँ खुली रहती हैं। ‘नया स्वभाव’ अर्थ को एक मनोवैज्ञानिक गुण तक सीमित कर सकता है।
- issue: ἐπίγνωσις के अर्थ की तीव्रता
  choice: ज्ञान
  alternative: पूरा ज्ञान / गहरा ज्ञान
  rationale: पौलुस के प्रयोग में अधिक पूर्ण या गहरे ज्ञान की छाया संभव है, पर यूनानी शब्द के इस भाव को मुख्य पाठ में अनिवार्य बनाना अतिअनुवाद हो सकता है; विकल्प पादटिप्पणी में दिया गया है।
- issue: εἰς का संबंध
  choice: ज्ञान की ओर
  alternative: ज्ञान में / ज्ञान के लिए
  rationale: ‘की ओर’ नवीकरण के लक्ष्य या परिणति को खुला रखता है; ‘में’ इसे केवल क्षेत्र के रूप में और ‘के लिए’ केवल उद्देश्य के रूप में अधिक निश्चित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पहन लिया’ वस्त्र का मूल रूपक बनाए रखता है। ‘ज्ञान की ओर’ सामान्य बोलचाल से थोड़ा अधिक औपचारिक है, पर εἰς की दिशात्मकता और पद की वास्तविक अस्पष्टता को सुरक्षित रखता है।
