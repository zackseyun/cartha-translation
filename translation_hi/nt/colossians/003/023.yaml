  text: तुम जो कुछ भी करो, उसे पूरे मन से करो, प्रभु के लिए, न कि मनुष्यों के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃ ἐὰν ποιῆτε
  choice: तुम जो कुछ भी करो
  rationale: अनिश्चित सामान्य संबंधवाचक संरचना का स्वाभाविक हिन्दी रूप; यह हर प्रकार के काम को समेटती है।
- source_word: ἐκ ψυχῆς
  choice: पूरे मन से
  rationale: यूनानी में शाब्दिक अर्थ ‘प्राण/आत्मा से’ है और भाव भीतरी सच्चाई तथा पूर्ण लगन का है। ‘पूरे मन से’ आधुनिक हिन्दी में इसी भाव को सहजता से व्यक्त करता है; शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: ἐργάζεσθε
  choice: करो
  rationale: आज्ञार्थक क्रिया काम में सक्रिय परिश्रम का निर्देश देती है। पहले आए ‘जो कुछ भी’ और जोड़े गए ‘उसे’ के साथ ‘करो’ हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए स्वाभाविक है।
- source_word: ὡς
  choice: मानो … के लिए
  rationale: यह काम करने की दृष्टि और ढंग बताता है—ऐसे काम करना जैसे वह प्रभु के लिए हो।
- source_word: τῷ κυρίῳ
  choice: प्रभु के लिए
  rationale: κύριος यहाँ सबसे स्वाभाविक रूप से मसीही उपाधि ‘प्रभु’ को सूचित करता है; दास और स्वामी के निकटवर्ती प्रसंग में ‘मालिक’ की छाया पादटिप्पणी में दी गई है।
- source_word: ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: यह बहुवचन सामान्य रूप से मानव प्राणियों को प्रभु के विपरीत रखता है; ‘मनुष्यों’ स्रोत की मानव-संदर्भित शब्दावली को बनाए रखता है और केवल पुरुषों तक सीमित नहीं है।
theological_decisions:
- issue: गृहस्थी-संबंधी निर्देशों के प्रसंग में κύριος का अनुवाद
  choice: प्रभु
  alternative: मालिक/स्वामी
  rationale: निकटवर्ती प्रसंग दासों और मालिकों का है, फिर भी यहाँ κύριος का प्रमुख संकेत सर्वोच्च प्रभु की ओर है। ‘प्रभु’ उस उपाधि को सुरक्षित रखता है, जबकि ‘मालिक’ का प्रसंगगत अर्थ-पुट पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूरे मन से’ सामान्य पाठक के लिए स्वाभाविक है, जबकि यूनानी ‘प्राण/आत्मा’ का अधिक शाब्दिक बिंब पादटिप्पणी में संरक्षित किया गया है।
