id: COL.3.16
reference: Colossians 3:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ⸀ψαλμοῖς, ⸀ὕμνοις, ᾠδαῖς πνευματικαῖς ⸀ἐν χάριτι, ᾄδοντες ἐν ⸂ταῖς καρδίαις⸃ ὑμῶν τῷ ⸀θεῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/003/016.yaml
  text: Let the word of Messiah dwell in you richly in all wisdom[a], teaching and admonishing one another with psalms, hymns, and spiritual songs[b], singing with grace in your hearts to God.
translation:
  language: hi
  text: मसीह का वचन तुममें[a] भरपूरी से वास करे। सारी बुद्धि के साथ एक-दूसरे को सिखाओ और चेताओ; भजनों, स्तुतिगानों और आत्मिक गीतों से अपने हृदयों में अनुग्रह सहित[b] परमेश्वर के लिए गाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम्हारे बीच’ भी संभव है। यूनानी सर्वनाम बहुवचन है; इससे पूरे समुदाय में वचन के वास करने या प्रत्येक विश्वासी के भीतर उसके वास करने पर बल समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘कृतज्ञता के साथ।’ यूनानी पदबंध का अर्थ इस प्रसंग में अनुग्रह, अनुग्रहपूर्ण भाव या कृतज्ञता हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ λόγος τοῦ Χριστοῦ
  choice: मसीह का वचन
  rationale: ‘वचन’ λόγος की व्यापकता को बनाए रखता है और ‘मसीह का’ संबंध को केवल मसीह द्वारा बोले गए वचन या मसीह के विषय के संदेश तक सीमित नहीं करता। Χριστός यहाँ उपाधि के रूप में ‘मसीह’ है।
- source_word: ἐνοικείτω
  choice: वास करे
  rationale: वर्तमान आज्ञार्थक क्रिया निरंतर निवास की कल्पना व्यक्त करती है; ‘वास करे’ इस रूपक को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुममें
  rationale: यह यूनानी बहुवचन का सीधा और स्वाभाविक अनुवाद है। हिन्दी में यह समुदाय के बीच सामूहिक वास और विश्वासियों के भीतर व्यक्तिगत वास—दोनों अर्थों के लिए खुला रहता है।
- source_word: πλουσίως
  choice: भरपूरी से
  rationale: यह वचन की प्रचुर और पूर्ण उपस्थिति को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἐν πάσῃ σοφίᾳ
  choice: सारी बुद्धि के साथ
  rationale: यह मूल पदबंध को निकटता से रखता है। वाक्य-विन्यास में इसका संबंध वचन के वास करने अथवा आगे आने वाले सिखाने और चेताने—दोनों से समझा जा सकता है।
- source_word: διδάσκοντες καὶ νουθετοῦντες ἑαυτούς
  choice: एक-दूसरे को सिखाओ और चेताओ
  rationale: बहुवचन आत्मवाचक सर्वनाम यहाँ पारस्परिक क्रिया व्यक्त करता है। ‘चेताओ’ νουθετέω के सुधारात्मक और सावधान करने वाले भाव को संक्षिप्त, सहज हिन्दी में रखता है।
- source_word: ψαλμοῖς, ὕμνοις, ᾠδαῖς πνευματικαῖς
  choice: भजनों, स्तुतिगानों और आत्मिक गीतों से
  rationale: तीनों संगीत-वाचक शब्दों का भेद बनाए रखा गया है और दत्तिव को साधनवाचक ‘से’ द्वारा व्यक्त किया गया है। πνευματικαῖς को निकटतम संज्ञा ‘गीतों’ के साथ रखा गया है।
- source_word: ἐν χάριτι
  choice: अनुग्रह सहित
  rationale: χάρις के मूल ‘अनुग्रह’ भाव को बनाए रखते हुए पदबंध को कृतज्ञता के संभावित अर्थ के लिए भी पादटिप्पणी में खुला रखा गया है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ
  choice: अपने हृदयों में ... परमेश्वर के लिए
  rationale: बहुवचन ‘हृदयों’ और परमेश्वर की ओर निर्देशित गायन—दोनों को मूल के अनुरूप स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त / क्राइस्ट
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके अभिषिक्त जन और यहूदी मसीहाई संदर्भ को सुरक्षित रखता है।
- issue: ἐν ὑμῖν का सामुदायिक अथवा व्यक्तिगत बल
  choice: तुममें
  alternative: तुम्हारे बीच
  rationale: बहुवचन और परस्पर शिक्षा का प्रसंग सामुदायिक अर्थ को बल देता है, पर ‘तुममें’ मूल पूर्वसर्ग को निकटता से रखकर व्यक्तिगत और सामूहिक दोनों संभावनाओं को सुरक्षित रखता है।
- issue: ἐν χάριτι का अर्थ
  choice: अनुग्रह सहित
  alternative: कृतज्ञता के साथ
  rationale: χάρις यहाँ अनुग्रह, अनुग्रहपूर्ण भाव या कृतज्ञता का बोध करा सकता है। मुख्य पाठ में शाब्दिक निकटता रखी गई है और प्रासंगिक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: ἐν πάσῃ σοφίᾳ का वाक्यगत संबंध
  choice: इसे अगले वाक्य के आरंभ में रखते हुए संबंध को अपेक्षाकृत खुला रखा गया है
  alternative: इसे केवल ‘वास करे’ या केवल ‘सिखाओ और चेताओ’ से स्पष्ट रूप से जोड़ना
  rationale: यूनानी में यह पदबंध पिछले कथन और अगले कृदंतों के बीच है; अनुवाद को किसी एक संबंध को अनिवार्य नहीं बनाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘तुममें’, ‘वास करे’, ‘स्तुतिगान’ और ‘आत्मिक गीत’ कलीसियाई संदर्भ में परिचित हैं, फिर भी सामान्य पाठक के लिए समझने योग्य हैं। अर्धविराम परस्पर शिक्षा और संगीतमय आराधना के निकट संबंध को दिखाता है।
