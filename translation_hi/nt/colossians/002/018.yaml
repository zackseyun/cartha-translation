source:
  edition: SBLGNT
  text: μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ⸀ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/018.yaml
  text: Let no one disqualify you[a], delighting in humility and the worship of angels, dwelling on what he has seen, vainly puffed up by the mind of his flesh[c][b],
translation:
  language: hi
  text: कोई तुम्हें पुरस्कार से वंचित न करे, जो दीनता और स्वर्गदूतों की उपासना[a] में आनंद लेता है, जो कुछ उसने देखा है उसकी चर्चा में लगा रहता है[b][c], और अपनी देह की सोच के कारण व्यर्थ ही फूल उठता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वर्गदूतों का धर्म” अथवा “स्वर्गदूतों के साथ उपासना।” यूनानी वाक्यांश को एक से अधिक ढंग से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “जो कुछ उसने देखा है, उसी पर विस्तार से बातें करता है” अथवा “जो कुछ उसने देखा है, उसमें प्रवेश करता है।” यहाँ प्रयुक्त यूनानी क्रिया दुर्लभ और अर्थ की दृष्टि से कठिन है।
    reason: lexical_alternative
  - marker: c
    text: कुछ पांडुलिपियों में “जो उसने नहीं देखा है” पाठ मिलता है; तब अर्थ होगा, “जो उसने नहीं देखा, उसके विषय में बातें करता रहता है।”
    reason: textual_variant
lexical_decisions:
- source_word: καταβραβευέτω
  choice: पुरस्कार से वंचित न करे
  rationale: क्रिया में निर्णायक द्वारा किसी के विरुद्ध फैसला देकर उसे पुरस्कार से वंचित करने का भाव है। यह हिन्दी में मूल रूपक और संदर्भ दोनों को स्पष्ट रखता है।
- source_word: θέλων
  choice: आनंद लेता है
  rationale: यहाँ कृदन्त केवल इच्छा नहीं, बल्कि बताई गई धार्मिक प्रथाओं में रुचि या प्रसन्नता लेने का भाव व्यक्त करता है।
- source_word: ταπεινοφροσύνῃ
  choice: दीनता
  rationale: शब्द का सामान्य अर्थ नम्रता या दीनता है। विवादात्मक संदर्भ में यह दिखावटी या तपस्वी दीनता हो सकती है, पर मुख्य पाठ उस व्याख्या को आरोपित नहीं करता।
- source_word: θρησκείᾳ τῶν ἀγγέλων
  choice: स्वर्गदूतों की उपासना
  rationale: सम्बन्धकारक को मुख्य पाठ में स्वर्गदूतों की ओर निर्देशित उपासना समझा गया है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: ἃ ἑόρακεν ἐμβατεύων
  choice: जो कुछ उसने देखा है उसमें मग्न रहता है
  rationale: दुर्लभ क्रिया ἐμβατεύω का अर्थ किसी विषय में प्रवेश करने, उस पर विस्तार से टिके रहने या उसमें मग्न होने से जुड़ा हो सकता है। यह रूप स्वाभाविक हिन्दी में उसकी कठिनता को अत्यधिक निर्णायक ढंग से हल नहीं करता।
- source_word: εἰκῇ
  choice: व्यर्थ ही
  rationale: यह घमंड के निराधार और निष्फल होने का भाव देता है।
- source_word: φυσιούμενος
  choice: फूल उठता है
  rationale: यह पौलुस के घमंड से फूलने के रूपक को हिन्दी में बनाए रखता है।
- source_word: νοὸς
  choice: बुद्धि
  rationale: यहाँ मन, समझ या सोचने की शक्ति का अर्थ है; 'बुद्धि' 'देह की बुद्धि' वाक्यांश में संक्षिप्त और गरिमापूर्ण है।
- source_word: σαρκὸς
  choice: देह
  rationale: σάρξ को किसी व्यवस्थित धर्मवैज्ञानिक व्याख्या जैसे 'पापी स्वभाव' में बदलने के बजाय ठोस शब्द से व्यक्त किया गया है। 'देह' आधुनिक हिन्दी में 'मांस' की तुलना में इस मानव-केंद्रित मानसिकता के वाक्यांश में अधिक स्वाभाविक है।
theological_decisions:
- issue: θρησκείᾳ τῶν ἀγγέλων का अर्थ
  choice: स्वर्गदूतों की उपासना, अर्थात उनकी ओर निर्देशित उपासना
  alternative: स्वर्गदूतों का धर्म या स्वर्गदूतों के साथ उपासना
  rationale: यूनानी सम्बन्धकारक वस्तुवाचक, कर्तृवाचक या साहचर्यपरक समझा जा सकता है। मुख्य पाठ सामान्य और संदर्भतः सम्भावित अर्थ अपनाता है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: τῆς σαρκὸς αὐτοῦ में σάρξ
  choice: उसकी देह की बुद्धि
  alternative: उसके पापी स्वभाव की बुद्धि या उसकी सांसारिक सोच
  rationale: शाब्दिक तनाव को बनाए रखने और अधिक विकसित धर्मवैज्ञानिक अर्थ को पाठ में न जोड़ने के लिए 'देह' रखा गया है।
- issue: ἃ ἑόρακεν का पाठ
  choice: जो कुछ उसने देखा है
  alternative: जो उसने नहीं देखा है
  rationale: SBLGNT के मुख्य पाठ का अनुवाद किया गया है; 'नहीं' वाला प्राचीन पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। वाक्य की चेतावनीपूर्ण शैली और पौलुस के 'फूल उठने' के रूपक को रखा गया है। कठिन यूनानी पदों की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
