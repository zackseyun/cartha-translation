base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/022.yaml
  text: These all perish with use[c][b][a], according to the commandments and teachings of men.
translation:
  language: hi
  text: ये सब वस्तुएँ उपयोग में आते-आते नष्ट हो जाती हैं[a]; ये निषेध मनुष्यों की आज्ञाओं और शिक्षाओं के अनुसार हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये सब उपयोग के साथ नष्ट हो जाती हैं।” यूनानी पद का आशय है कि जिन वस्तुओं पर ये निषेध लागू होते हैं, वे अस्थायी हैं और इस्तेमाल में समाप्त हो जाती हैं।
    reason: lexical_alternative
  - marker: b
    text: “मनुष्यों की आज्ञाओं और शिक्षाओं” में संभवतः यशायाह 29:13 की प्रतिध्वनि है; इससे इन निषेधों के मानवीय स्रोत पर जोर पड़ता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἅ
  choice: ये सब वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम पिछली आयत में निषिद्ध वस्तुओं की ओर संकेत करता है। हिंदी में संदर्भ स्पष्ट और स्वाभाविक रखने के लिए ‘वस्तुएँ’ जोड़ा गया है।
- source_word: εἰς φθορὰν
  choice: नष्ट हो जाती हैं
  rationale: φθορά यहाँ नाश, क्षय या समाप्त हो जाने का भाव देता है; उपभोग की वस्तुओं के संदर्भ में यह स्वाभाविक हिंदी है।
- source_word: τῇ ἀποχρήσει
  choice: उपयोग में आते-आते
  rationale: ἀπόχρησις किसी वस्तु के इस्तेमाल या खप जाने को बताता है। यह रूप स्पष्ट करता है कि वस्तुएँ उपयोग की प्रक्रिया में समाप्त होती हैं।
- source_word: ἐντάλματα καὶ διδασκαλίας
  choice: आज्ञाओं और शिक्षाओं
  rationale: यह औपचारिक नियामक अर्थ बनाए रखता है और यशायाह 29:13 की संभावित प्रतिध्वनि के अनुकूल है।
- source_word: τῶν ἀνθρώπων
  choice: मनुष्यों की
  rationale: संबंधकारक रूप इन आज्ञाओं और शिक्षाओं के मानवीय स्रोत को दिखाता है और उन्हें परमेश्वर की ओर से आई आज्ञाओं से अलग रखता है।
theological_decisions:
- issue: नश्वर वस्तुओं और तपस्वी नियमों के बीच वाक्यगत संबंध
  choice: मुख्य पाठ वस्तुओं के उपयोग में नष्ट होने की बात कहता है और फिर मानव आज्ञाओं तथा शिक्षाओं के अनुसार होने की आलोचना जोड़ता है।
  alternative: 'अंतिम वाक्यांश को सीधे नियमों का वर्णन मानते हुए अनुवाद किया जा सकता है: ‘ये नियम मनुष्यों की आज्ञाओं और शिक्षाओं के अनुसार हैं।’'
  rationale: यूनानी वाक्य नश्वर वस्तुओं पर जोर देता है, जबकि κατὰ वाला वाक्यांश मानवीय नियमों की आलोचना करता है। अनुवाद संबंध को अत्यधिक स्पष्ट करके मूल की वाक्यगत कसावट को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उपयोग में आते-आते’ सामान्य पाठक के लिए उपभोग और समाप्ति का संयुक्त भाव स्पष्ट करता है; ‘आज्ञाओं और शिक्षाओं’ से बाइबलीय औपचारिकता बनी रहती है।
