lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पूर्ववर्ती चेतावनी का कारण बताता है; ‘क्योंकि’ यूनानी के कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यह मसीह की ओर संकेत करने वाला सीधा स्थानवाचक पद है; यूनानी में निहित न होने के कारण ‘केवल’ जैसा बल नहीं जोड़ा गया।
- source_word: κατοικεῖ
  choice: वास करती है
  rationale: यह स्थायी और निरंतर निवास का भाव बनाए रखता है तथा आधुनिक गरिमामय हिन्दी में स्वाभाविक है।
- source_word: πᾶν τὸ πλήρωμα
  choice: सारी परिपूर्णता
  rationale: यह समग्रता को स्पष्ट करता है और हिन्दी में ‘पूरी परिपूर्णता’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: τῆς θεότητος
  choice: ईश्वरत्व की
  rationale: θεότης परमेश्वर होने की वास्तविकता या स्वरूप को व्यक्त करता है, केवल सामान्य दैवी गुण को नहीं; ‘ईश्वरत्व’ इसका संक्षिप्त और सशक्त हिन्दी रूप है।
- source_word: σωματικῶς
  choice: सशरीर
  rationale: यह क्रियाविशेषण के संक्षिप्त शारीरिक अर्थ को बनाए रखता है और उसे केवल किसी विशेष व्याख्यात्मक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: θεότης और σωματικῶς का मसीह-संबंधी बल
  choice: पद यह कहता है कि ईश्वरत्व की समस्त वास्तविकता मसीह में सशरीर वास करती है।
  alternative: इसे केवल दैवी गुणों या परमेश्वर की सामान्य उपस्थिति के मसीह में होने के रूप में समझना।
  rationale: θεότης सामान्य दैवी गुण की अपेक्षा ईश्वरत्व का अधिक प्रबल बोध देता है, और σωματικῶς उस वास को सशरीर बताता है। अनुवाद इस प्रबल कथन को घटाता नहीं और न उसके आशय को आवश्यकता से अधिक खोलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमामय और कलीसियाई पाठ के अनुकूल है। ‘ईश्वरत्व’, ‘परिपूर्णता’ और ‘सशरीर’ जैसे सटीक शब्द मूल कथन का धर्मवैचारिक भार बनाए रखते हैं।
