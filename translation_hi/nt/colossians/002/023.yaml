source:
  edition: SBLGNT
  text: ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/023.yaml
  text: These indeed have an appearance of wisdom in self-made religion and humility and harsh treatment of the body[d][c][b][a], but are of no value against the indulgence of the flesh.
translation:
  language: hi
  text: इन नियमों में मनुष्य की अपनी बनाई हुई उपासना[b], विनम्रता और शरीर के प्रति कठोर व्यवहार के कारण बुद्धिमानी का आभास[a] तो होता है, पर शारीरिक अभिलाषाओं को तृप्त करने से रोकने में इनका कोई मूल्य नहीं है[c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “बुद्धिमानी की प्रतिष्ठा होती है।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “स्वनिर्मित उपासना”; परंपरागत रूप से “इच्छा-उपासना।”'
    reason: lexical_alternative
  - marker: c
    text: 'अंतिम खंड का अर्थ कठिन है। इसका अनुवाद यह भी हो सकता है: “इनका किसी प्रकार का सम्मान नहीं, जो शरीर की तृप्ति के लिए हो,” या “शारीरिक अभिलाषाओं की तृप्ति के विरुद्ध इनका कोई सम्मान नहीं।”'
    reason: alternative_reading
  - marker: d
    text: यहाँ “शारीरिक” यूनानी शब्द ‘flesh’ के संदर्भगत अर्थ को दर्शाता है; यह पतित मानवीय इच्छाओं की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἅτινά
  choice: इन बातों में
  rationale: यह पद 21–22 के नियमों की ओर संकेत करता है; हिंदी में यह प्रयोग उस पूर्वसंदर्भ को स्वाभाविक रूप से जोड़ता है।
- source_word: λόγον μὲν ἔχοντα σοφίας
  choice: बुद्धिमानी का आभास तो होता है
  rationale: λόγον ἔχειν यहाँ प्रतिष्ठा या प्रतीत होने का भाव देता है, और μέν का रियायती बल ‘तो’ से व्यक्त होता है।
- source_word: ἐθελοθρησκίᾳ
  choice: अपनी इच्छा से गढ़ी हुई उपासना
  rationale: यह दुर्लभ शब्द मनुष्य की अपनी इच्छा से निर्मित या स्वयं थोपी गई धार्मिक उपासना का संकेत देता है; यह अनुवाद उसके नकारात्मक संदर्भ को स्पष्ट रखता है।
- source_word: ταπεινοφροσύνῃ
  choice: दीनता
  rationale: मूल शब्द का सामान्य अर्थ विनम्रता या दीनता है; संदर्भ में उसके दिखावटी या तपस्वी रूप की संभावना को बिना अनावश्यक विस्तार के खुला रखा गया है।
- source_word: ἀφειδίᾳ σώματος
  choice: शरीर के साथ कठोर व्यवहार
  rationale: यह वाक्यांश शरीर को न बख्शने वाली तपस्वी कठोरता व्यक्त करता है; चुना हुआ रूप आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: οὐκ ἐν τιμῇ τινι
  choice: इनका कोई मूल्य नहीं है
  rationale: कठिन अंतिम उपवाक्य में τιμή को प्रभाव या उपयोगिता के अर्थ में लिया गया है, जिससे ऊपर बताए गए ज्ञान के आभास और वास्तविक निष्फलता का विरोध स्पष्ट होता है।
- source_word: πρὸς πλησμονὴν
  choice: तृप्त करने से रोकने में
  rationale: संदर्भानुसार πρός और πλησμονή को शरीरगत इच्छाओं की तृप्ति पर अंकुश लगाने के संबंध में समझा गया है; ‘रोकने में’ निहित अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τῆς σαρκός
  choice: शरीर की अभिलाषाओं
  rationale: σάρξ का शाब्दिक संबंध शरीर से बनाए रखते हुए यहाँ अभिलाषाओं का उल्लेख संदर्भगत नैतिक बल स्पष्ट करता है; इसे किसी व्यवस्थित धर्मवैज्ञानिक पद में नहीं बदला गया।
theological_decisions:
- issue: कठिन अंतिम खंड οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός का अर्थ
  choice: ये तपस्वी प्रथाएँ शरीर की अभिलाषाओं की तृप्ति रोकने में वास्तव में निष्फल हैं।
  alternative: ‘शरीर की तृप्ति के लिए इनका कोई सम्मान नहीं,’ अथवा ‘शरीर की अभिलाषाओं की तृप्ति के विरुद्ध इनका कोई मूल्य नहीं।’
  rationale: यूनानी वाक्य-विन्यास संक्षिप्त और विवादित है। संदर्भ में पौलुस मनुष्य-निर्मित तपस्वी नियमों के ज्ञान जैसे दिखने पर भी उनकी अक्षमता बता रहा है। मुख्य पाठ इस प्रवाह को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: σάρξ का संदर्भगत बल
  choice: ‘शरीर की अभिलाषाओं’ के रूप में प्रस्तुत किया गया।
  alternative: ‘देह’ या ‘पापमय मानवीय इच्छाएँ।’
  rationale: यहाँ शब्द संभवतः पतित मानवीय इच्छाओं की ओर संकेत करता है, पर ‘पापी स्वभाव’ जैसा पूर्ण धर्मवैज्ञानिक अर्थ आरोपित नहीं किया गया। पादटिप्पणी अर्थ-सीमा को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और सामान्य पाठक के लिए बोधगम्य शैली। ‘आभास तो… पर’ से यूनानी concessive संरचना सुरक्षित रखी गई है। कठिन अंतिम खंड की मुख्य व्याख्या पाठ में स्पष्ट है और वैकल्पिक व्याख्याएँ पादटिप्पणी में रखी गई हैं।
