- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त/क्राइस्ट
  rationale: यहाँ शब्द को नाम मात्र नहीं, अभिषिक्त जन की उपाधि के रूप में प्रस्तुत करना उपयुक्त है और आधुनिक हिन्दी बाइबलीय प्रयोग में ‘मसीह’ सहज है।
