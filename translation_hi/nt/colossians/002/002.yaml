- source_word: συμβιβασθέντες
  choice: आपस में घनिष्ठता से जुड़े हुए
  rationale: यहाँ प्रेम के संदर्भ में क्रिया का प्रमुख भाव लोगों का निकटता से जोड़ा या एक किया जाना है। पुरुषवाचक बहुवचन कृदंत का संबंध लोगों से है, ‘हृदयों’ से नहीं; इसलिए ‘वे’ स्पष्ट किया गया है।
- source_word: ἐν ἀγάπῃ
  choice: प्रेम में
  rationale: उस क्षेत्र या बंधन को व्यक्त करता है जिसमें वे परस्पर जुड़े हैं।
- source_word: εἰς πᾶν πλοῦτος
  choice: सारी समृद्धि तक पहुँचें
  rationale: εἰς के लक्ष्य अथवा परिणाम की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है; πᾶν πλοῦτος की परिमाणात्मक व्यापकता भी बनी रहती है।
- source_word: τῆς πληροφορίας τῆς συνέσεως
  choice: समझ से मिलने वाले पूरे निश्चय की
  rationale: πληροφορία को दृढ़ और पूर्ण आश्वस्तता तथा σύνεσις को समझ के रूप में प्रस्तुत करता है; हिन्दी में इनके संबंध को सहज बनाने के लिए ‘से मिलने वाले’ प्रयोग किया गया है।
- source_word: ἐπίγνωσιν
