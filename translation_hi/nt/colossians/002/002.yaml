  text: ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, ⸀συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς ⸂πᾶν πλοῦτος⸃ τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ ⸀θεοῦ, Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/002.yaml
  text: so that their hearts may be encouraged[a], having been knit together in love and unto all the riches of the full assurance of understanding, unto the knowledge of the mystery of God, Messiah[d][c][b],
translation:
  language: hi
  text: ताकि उनके हृदय प्रोत्साहित हों, वे प्रेम में आपस में घनिष्ठता से जुड़े हुए[a] हों, और समझ के पूर्ण निश्चय की सारी समृद्धि तक तथा परमेश्वर के रहस्य—मसीह—के ज्ञान तक पहुँचें[b][c][d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रेम में एक किए गए।” यूनानी क्रिया का अर्थ लोगों को एक साथ लाना या निकटता से जोड़ना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “ज्ञान” के लिए प्रयुक्त यूनानी शब्द में “भली-भाँति ज्ञान” या “पूरा ज्ञान” का गहन भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'यहाँ यूनानी वाक्यांश संक्षिप्त और कुछ कठिन है: “परमेश्वर का रहस्य, मसीह।” इस अनुवाद में “मसीह” को समानाधिकरण में समझा गया है—अर्थात् परमेश्वर का रहस्य मसीह है।'
    reason: alternative_reading
  - marker: d
    text: कुछ पांडुलिपियों में यहाँ विस्तृत पाठ मिलता है, जैसे “परमेश्वर, अर्थात् पिता, और मसीह का रहस्य।” अनुवाद प्रदत्त यूनानी पाठ के छोटे पाठांतर का अनुसरण करता है।
    reason: textual_variant
