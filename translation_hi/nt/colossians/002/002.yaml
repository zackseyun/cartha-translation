- source_word: μυστηρίου
  choice: रहस्य
  rationale: पौलुस के प्रयोग में परमेश्वर की वह योजना अभिप्रेत है जो पहले छिपी थी और अब प्रकट हुई है; ‘रहस्य’ इस धर्मवैचारिक अर्थ को बनाए रखता है।
- source_word: τοῦ θεοῦ, Χριστοῦ
  choice: परमेश्वर के रहस्य—मसीह—
  rationale: दिए गए संक्षिप्त यूनानी पाठ की समानाधिकरणात्मक बनावट को डैश द्वारा सुरक्षित रखा गया है; ‘अर्थात्’ जोड़कर संबंध को आवश्यकता से अधिक स्पष्ट नहीं किया गया। Χριστός को उपाधि के रूप में ‘मसीह’ कहा गया है।
