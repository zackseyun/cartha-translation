  naturalness: ‘गाड़े जाकर’ is understandable but somewhat awkward in modern standard Hindi, where ‘गाड़े गए’ is more idiomatic for burial imagery. The revised phrasing is fluent while retaining the participial connection.
  terminology: ‘बपतिस्मा,’ ‘विश्वास,’ and ‘जिलाए गए’ are suitable established biblical terms. ‘सामर्थी कार्य’ conveys ἐνέργεια adequately as God's effective activity. The alternative referent of ‘उसी में’ is correctly preserved in the footnote.
  issues:
