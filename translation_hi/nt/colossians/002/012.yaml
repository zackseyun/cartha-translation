  to: बपतिस्मा में उसके साथ गाड़े गए, और उसी में आप परमेश्वर के सामर्थी कार्य पर विश्वास के द्वारा उसके साथ जिलाए भी गए। परमेश्वर ने उसे मरे हुओं में से जिलाया।
