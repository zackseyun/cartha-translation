id: COL.2.12
reference: Colossians 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: συνταφέντες αὐτῷ ἐν τῷ ⸀βαπτισμῷ, ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ⸀ἐκ νεκρῶν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/012.yaml
  text: having been buried with him in baptism[a], in which you also were raised with him through faith in the working of God[b], who raised him from the dead.
translation:
  language: hi
  text: बपतिस्मा में उसके साथ गाड़े गए, और उसी में आप परमेश्वर के सामर्थी कार्य पर विश्वास के द्वारा उसके साथ जिलाए भी गए। परमेश्वर ने उसे मरे हुओं में से जिलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνταφέντες αὐτῷ
  choice: उसके साथ गाड़े जाकर
  rationale: अओरिस्ट कर्मवाच्य कृदन्त और συν- उपसर्ग, दोनों को रखते हुए मसीह के साथ दफनाए जाने का पूर्ण हुआ भाव व्यक्त करता है।
- source_word: ἐν τῷ βαπτισμῷ
  choice: बपतिस्मा में
  rationale: ἐν के स्थानिक और साधनात्मक विस्तार को अनावश्यक रूप से सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: निकटतम पूर्वपद βαπτισμῷ को मुख्य सन्दर्भ मानता है; वैकल्पिक रूप से इसका सन्दर्भ मसीह हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: συνηγέρθητε
  choice: उसके साथ जिलाए भी गए
  rationale: कर्मवाच्य तथा συν- के ‘साथ’ वाले अर्थ को स्पष्ट करता है और पुनरुत्थान के प्रसंग में प्रचलित, सहज हिन्दी ‘जिलाए गए’ का प्रयोग करता है।
- source_word: διὰ τῆς πίστεως
  choice: विश्वास करने के द्वारा
  rationale: πίστις का यहाँ प्रमुख अर्थ विश्वास/भरोसा है; क्रियात्मक हिन्दी वाक्यांश सम्बन्ध को सहज बनाता है।
- source_word: τῆς ἐνεργείας τοῦ θεοῦ
  choice: परमेश्वर के सामर्थी कार्य
  rationale: ἐνέργεια परमेश्वर की सक्रिय, प्रभावकारी क्रिया को बताता है; ‘सामर्थी कार्य’ केवल अमूर्त शक्ति के बजाय कार्यरत सामर्थ्य को व्यक्त करता है।
- source_word: τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν
  choice: परमेश्वर ने ही उसे मरे हुओं में से जिलाया
  rationale: कर्तृवाचक कृदन्त को स्वाभाविक हिन्दी वाक्य में खोलता है और ἐκ νεκρῶν का सामूहिक अर्थ ‘मरे हुओं में से’ बनाए रखता है।
theological_decisions:
- issue: ἐν ᾧ का सन्दर्भ
  choice: ‘उसी में’—बपतिस्मा की ओर संकेत
  alternative: ‘उसी में’—मसीह की ओर संकेत
  rationale: व्याकरण में निकटतम पूर्वपद βαπτισμῷ है, इसलिए मुख्य पाठ में बपतिस्मा सन्दर्भ अधिक सम्भावित है; फिर भी यूनानी रूप मसीह को सम्भावित सन्दर्भ मानने की गुंजाइश देता है।
- issue: बपतिस्मा और मसीह के साथ सहभागिता
  choice: बपतिस्मा, विश्वास, साथ गाड़े जाने और साथ जिलाए जाने की निकट कड़ी को यथावत रखना
  alternative: इसे स्पष्ट रूप से संस्कारगत प्रभाव या केवल प्रतीकात्मकता के रूप में समझाना
  rationale: पद इन बातों को निकटता से जोड़ता है, पर बाद के मतगत विवाद का निर्णय स्वयं नहीं देता; इसलिए अनुवाद किसी सम्प्रदायगत सिद्धान्त को नहीं जोड़ता।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इस रचना में परमेश्वर के कार्य पर विश्वास मुख्य अर्थ है; ‘विश्वासयोग्यता’ सन्दर्भ में कम सम्भावित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। ‘गाड़े जाकर’ दफनाए जाने के बिंब को और ‘जिलाए गए’ पुनरुत्थान की बाइबलीय भाषा को स्वाभाविक रूप में रखता है। मुख्य पाठ में एक ही पादटिप्पणी-चिह्न [a] है और वही पादटिप्पणी सूची में दिया गया है।
