  rationale: μή यहाँ निषेध आरम्भ करता है; तीन समानांतर क्रियाओं के साथ दोहराया गया ‘न’ हिन्दी में संक्षिप्त और स्वाभाविक निषेध व्यक्त करता है।
- source_word: ἅψῃ
  choice: इसे हाथ में लो
  rationale: ἅπτω का यह रूप ‘छूना’ या ‘पकड़ना/हाथ में लेना’ हो सकता है। बाद के θίγῃς से भेद बनाए रखने के लिए ‘हाथ में लो’ चुना गया है; कर्म का संकेत हिन्दी में वाक्य को स्वाभाविक बनाता है, पर किसी विशिष्ट वस्तु की व्याख्या नहीं जोड़ता।
- source_word: μηδὲ
  choice: न
  rationale: बार-बार आया μηδέ निषेधों को जोड़ता है। हिन्दी में प्रत्येक क्रिया से पहले ‘न’ संचयी लय और संक्षिप्तता बनाए रखता है।
- source_word: γεύσῃ
  choice: चखो
  rationale: γεύομαι का सीधा अर्थ ‘चखना’ है; यह मूल की संक्षिप्तता और संभावित तपस्वी नियम के स्वर को सुरक्षित रखता है।
- source_word: θίγῃς
  choice: छुओ
  rationale: θιγγάνω का सामान्य अर्थ ‘छूना’ है। इसे ‘छुओ’ कहना पहले ἅψῃ के ‘हाथ में लो’ से शब्दगत अंतर बनाए रखता है।
