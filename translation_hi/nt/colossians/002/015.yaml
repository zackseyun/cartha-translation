  text: ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/015.yaml
  text: Having disarmed the rulers and the authorities, he made a public spectacle of them, triumphing over them in him.
translation:
  language: hi
  text: उसने शासकों और अधिकारियों को निहत्था करके सबके सामने उनका तमाशा बनाया और उसी में[a] उन पर विजय पाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसी में” का अर्थ “मसीह में” भी हो सकता है; या पिछले पद के अनुसार “क्रूस पर/क्रूस के द्वारा।”
    reason: ἐν αὐτῷ के संभावित संदर्भ और अर्थ की वास्तविक अस्पष्टता बताना।
lexical_decisions:
- source_word: ἀπεκδυσάμενος
  choice: निहत्था करके
  rationale: संदर्भ में विरोधी शक्तियों से उनके हथियार या सामर्थ्य छीन लेने का भाव व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τὰς ἀρχὰς καὶ τὰς ἐξουσίας
  choice: शासकों और अधिकारियों
  rationale: इन शब्दों के सत्ता और अधिकार से जुड़े अर्थ को बनाए रखता है तथा संदर्भ में अलौकिक विरोधी शक्तियों की ओर संकेत को अनावश्यक रूप से स्पष्ट करके मूल की व्यापकता सीमित नहीं करता।
- source_word: ἐδειγμάτισεν ἐν παρρησίᾳ
  choice: सबके सामने उनका तमाशा बनाया
  rationale: सार्वजनिक रूप से अपमानजनक प्रदर्शन किए जाने का प्रबल भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θριαμβεύσας αὐτοὺς
  choice: उन पर विजय पाई
  rationale: विजयी जुलूस से जुड़े रूपक का परिणाम—विरोधियों पर खुली विजय—स्पष्ट करता है, बिना अनावश्यक रोमी सांस्कृतिक विवरण जोड़े।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: यूनानी पदबंध के स्थानवाचक/साधनवाचक खुलेपन और उसके संभावित पूर्वपद की अस्पष्टता को हिन्दी में यथासंभव बनाए रखता है।
theological_decisions:
- issue: ἐν αὐτῷ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में “उसी में” रखकर संदर्भ को खुला छोड़ा गया है।
  alternative: “मसीह में,” “क्रूस पर,” या “उसके द्वारा”
  rationale: यूनानी αὐτῷ व्याकरण की दृष्टि से मसीह अथवा पिछले पद के क्रूस की ओर समझा जा सकता है; किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाना मूल की वास्तविक अस्पष्टता को मिटा देगा।
- issue: क्रिया का कर्ता
  choice: पिछले वाक्य के प्रवाह के अनुसार “उसने” रखा गया है, जिसका निकटवर्ती कर्ता परमेश्वर है।
  alternative: स्पष्ट रूप से “परमेश्वर ने” या “मसीह ने”
  rationale: यूनानी पद में कर्ता दोहराया नहीं गया है; सर्वनाम से प्रवाह बना रहता है और पद को उसके संदर्भ से अनावश्यक रूप से अलग नहीं किया जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। “तमाशा बनाया” सार्वजनिक अपमान की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है; फुटनोट मूल यूनानी की संदर्भगत अस्पष्टता सुरक्षित रखता है।
