  yaml_path: translation/nt/colossians/002/004.yaml
  text: I say this so that no one may deceive you with persuasive argument.
translation:
  language: hi
  text: मैं यह इसलिए कहता हूँ कि कोई तुम्हें प्रभावशाली तर्क से धोखा न दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वसनीय लगने वाले तर्क से”; अथवा “मनाने वाली बातों से।”
    reason: πιθανολογία ऐसे तर्क या कथन को सूचित करता है जो सुनने में विश्वसनीय या मनाने वाला लगे, पर आवश्यक नहीं कि सत्य हो।
lexical_decisions:
- source_word: τοῦτο λέγω
  choice: मैं यह इसलिए कह रहा हूँ
  rationale: ‘यह’ पिछले कथन या विचार-क्रम की ओर संकेत करता है। वर्तमान काल के λέγω को स्वाभाविक हिन्दी में ‘कह रहा हूँ’ किया गया है; ἵνα के प्रयोजनार्थक बल को ‘इसलिए...कि’ व्यक्त करता है।
- source_word: μηδεὶς ὑμᾶς
  choice: कोई तुम्हें ... न दे
  rationale: μηδείς का अर्थ ‘कोई नहीं/कोई ... न’ है। ὑμᾶς बहुवचन है; हिन्दी में ‘तुम्हें’ समुदाय को संबोधित करने का स्वाभाविक रूप है।
- source_word: παραλογίζηται
  choice: धोखा न दे
  rationale: क्रिया यहाँ दोषपूर्ण या भ्रामक तर्क के द्वारा बहकाने अथवा छलने का भाव रखती है। ‘धोखा देना’ सामान्य आधुनिक हिन्दी में स्पष्ट है और साधन को अगले पदबंध के लिए खुला रखता है।
- source_word: ἐν πιθανολογίᾳ
  choice: लुभावनी दलीलों से
  rationale: ἐν यहाँ साधन या रीति बताता है। πιθανολογία ऐसे तर्क या कथन को सूचित करता है जो सुनने में विश्वासयोग्य और मनाने वाला लगे, पर आवश्यक नहीं कि सत्य हो। ‘लुभावनी दलीलें’ उसकी आकर्षक किन्तु संभावित रूप से भ्रामक शक्ति को स्वाभाविक हिन्दी में व्यक्त करती हैं।
theological_decisions:
- issue: παραλογίζηται ἐν πιθανολογίᾳ में चेतावनी का स्वरूप
  choice: सुनने में प्रभावशाली या विश्वसनीय लगने वाली दलीलों द्वारा धोखा दिए जाने के विरुद्ध सामान्य चेतावनी
  alternative: विशेष रूप से किसी नामित दर्शन, मत-प्रणाली या केवल वाक्पटुता के विरुद्ध चेतावनी
  rationale: इस पद में खतरे का कोई विशिष्ट सिद्धान्त या मत नामित नहीं है। इसलिए अनुवाद सामान्य चेतावनी को बनाए रखता है और निकटवर्ती संदर्भ से अधिक बात इसमें नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘लुभावनी दलीलें’ सामान्य पाठक के लिए बोधगम्य है और तर्क की आकर्षक पर भ्रामक प्रकृति बताती है। मुख्य पाठ में पाद-टिप्पणी चिह्न [a] सम्मिलित है।
