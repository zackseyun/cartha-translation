  text: ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα ⸀τοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/017.yaml
  text: These are a shadow of the things to come[b][a], but the body is Messiah's.
translation:
  language: hi
  text: ये आने वाली बातों की छाया हैं, पर देह मसीह की है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, भावार्थ में, “पर वास्तविकता मसीह की है।”
    reason: σῶμα का सामान्य अर्थ “देह” है, किन्तु “छाया” के विरोध में यह उस ठोस या पूर्ण वास्तविकता को सूचित कर सकता है जिससे छाया सम्बन्धित है।
lexical_decisions:
- source_word: ἅ
  choice: ये
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम पिछले पद में बताए गए खान-पान, पर्व, नए चाँद और सब्त के विषयों की ओर संकेत करता है। हिन्दी में “ये” उस पूर्वसन्दर्भ को सहज रूप से व्यक्त करता है।
- source_word: σκιὰ
  choice: छाया
  rationale: मूल रूपक को सीधे बनाए रखता है और आगे आनेवाली बातों तथा देह के बीच के विरोध को सुरक्षित रखता है।
- source_word: τῶν μελλόντων
  choice: आनेवाली बातों की
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त के भविष्याभिमुख अर्थ को बनाए रखता है, बिना यह तय किए कि संकेत केवल मसीही पूर्णता, अन्तकालीन वास्तविकताओं या दोनों की ओर है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ छाया और देह के बीच स्पष्ट विरोध है; “पर” आधुनिक, स्वाभाविक हिन्दी में उस विरोध को व्यक्त करता है।
- source_word: σῶμα
  choice: देह
  rationale: σῶμα का सीधा अर्थ “देह” है। छाया के साथ इसका रूपकीय विरोध पाठक के लिए खुला रहता है; “वास्तविकता” अर्थ को स्पष्ट करती, पर मूल रूपक को कुछ हद तक व्याख्यायित कर देती।
- source_word: τοῦ Χριστοῦ
  choice: मसीह की
  rationale: सम्बन्धकारक की संक्षिप्त, कुछ हद तक लुप्त-क्रियायुक्त रचना को स्वामित्व के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है। “मसीह” Χριστός के पदवीगत अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: छाया के विरोध में σῶμα का अर्थ
  choice: “देह” रखकर मूल रूपक और उसकी व्याख्यात्मक खुलावट को सुरक्षित रखा गया है।
  alternative: “वास्तविकता” या “सार-वस्तु,” अर्थात वह पूर्ण वास्तविकता जिसकी छाया पहले के विधान हैं।
  rationale: छाया और देह का विरोध ठोस वस्तु तथा उसकी छाया का बोध करा सकता है, पर “देह” का औपचारिक अनुवाद सम्भावित कलीसियाई या अन्य साहित्यिक प्रतिध्वनियों को समय से पहले समाप्त नहीं करता। स्पष्टार्थक विकल्प पादटिप्पणी में दिया गया है।
- issue: τοῦ Χριστοῦ का सम्बन्ध
  choice: “देह मसीह की है”
  alternative: “वास्तविकता मसीह में है” या “वास्तविकता मसीह की है”
  rationale: यूनानी सम्बन्धकारक को स्वामित्व के रूप में प्रस्तुत करना सबसे सीधा है। “मसीह में” कहना एक सम्भव धर्मवैचारिक अर्थ को व्याकरण में जोड़ देता, जो मूल पाठ में स्पष्ट रूप से नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। “देह” औपचारिक निष्ठा और रूपकीय तनाव बनाए रखती है; पादटिप्पणी अर्थ-स्पष्ट विकल्प देती है।
