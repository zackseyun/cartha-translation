translation:
  language: hi
  text: और उसी में तुम परिपूर्ण किए गए हो[a]। वही हर प्रधानता और अधिकार का सिर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भर दिए गए हो” अथवा “पूर्णता तक पहुँचाए गए हो।”
    reason: lexical_alternative
  - marker: b
    text: “सिर” यूनानी रूपक को सुरक्षित रखता है; यहाँ आशय यह है कि मसीह हर प्रधानता और अधिकार से सर्वोच्च है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: पिछले पद के तर्क से संबंध बनाए रखने के लिए सामान्य संयोजक को रखा गया है।
- source_word: ἐστὲ ... πεπληρωμένοι
  choice: तुम परिपूर्ण किए गए हो
  rationale: पूर्णकालिक कर्मवाच्य कृदंत के साथ वर्तमान क्रिया उस वर्तमान अवस्था को व्यक्त करती है जो किए गए कार्य का परिणाम है। यह अनुवाद कर्मवाच्य भाव और ‘परिपूर्णता’ की उस ध्वनि को बनाए रखता है जो पिछले पद से जुड़ी है।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: यह मसीह के साथ विश्वासियों के संबंध और सहभागिता को पौलुस की संक्षिप्त अभिव्यक्ति में ही सुरक्षित रखता है; ‘उसी’ पिछले पद के संदर्भ को स्वाभाविक रूप से जोड़ता है।
- source_word: ὅς ἐστιν
  choice: वही ... है
  rationale: यूनानी संबंधवाचक उपवाक्य को स्वाभाविक आधुनिक हिन्दी में स्वतंत्र वाक्य के रूप में व्यक्त किया गया है, और उसका संदर्भ मसीह ही बना रहता है।
- source_word: ἡ κεφαλή
  choice: सिर
  rationale: यूनानी रूपक को व्याख्यात्मक शब्द ‘शासक’ से बदलने के बजाय ज्यों का त्यों रखा गया है।
- source_word: πάσης ἀρχῆς καὶ ἐξουσίας
  choice: हर प्रधानता और अधिकार
  rationale: एकवचन πάσης की व्यापकता के लिए ‘हर’ और इस पौलुसी युग्म के लिए प्रचलित, गरिमापूर्ण शब्दावली चुनी गई है। ‘प्रधानता’ ἀρχή की सत्ता अथवा शासकीय शक्ति की श्रेणी को खुला रखती है, जबकि ‘अधिकार’ ἐξουσία के मानक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: मसीह में विश्वासियों की परिपूर्णता
  choice: विश्वासी मसीह में परिपूर्ण किए गए हैं
  alternative: विश्वासी मसीह में भर दिए गए हैं; अथवा उद्धार के लिए उन्हें किसी बात की कमी नहीं है
  rationale: मुख्य पाठ परिपूर्णता के रूपक, कर्मवाच्य भाव और कथन की व्यापक धर्मवैज्ञानिक गुंजाइश को बनाए रखता है; यह न तो पापरहित सिद्धता का कोई तकनीकी सिद्धांत जोड़ता है, न इसे केवल उद्धार-संबंधी पर्याप्तता तक सीमित करता है।
- issue: आत्मिक सत्ताओं के संबंध में κεφαλή का आशय
  choice: ‘सिर’ का रूपक रखते हुए मसीह की सर्वोच्चता व्यक्त करना
  alternative: मसीह को हर प्रधानता और अधिकार का स्रोत बताना
  rationale: कुलुस्सियों के इस संदर्भ में प्रधानताओं और अधिकारों पर मसीह की सर्वोच्चता प्रमुख है, पर मुख्य पाठ ‘सिर’ का मूल रूपक सुरक्षित रखता है और उसे पूरी तरह व्याख्यात्मक पद से नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। लंबे यूनानी संबंधवाचक वाक्य को दो हिन्दी वाक्यों में बाँटा गया है। ‘परिपूर्ण किए गए हो’ fullness motif और कर्मवाच्य अर्थ दोनों को सुरक्षित रखता है; ‘प्रधानता और अधिकार’ पौलुसी ब्रह्मांडीय-सत्ता संबंधी शब्दयुग्म की औपचारिकता बनाए रखता है।
