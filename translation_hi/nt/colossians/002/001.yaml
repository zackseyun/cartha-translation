  text: Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ⸀ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/001.yaml
  text: For I want you to know how great a struggle I have for you and for those in Laodicea[a], and for all who have not seen my face in the flesh,
translation:
  language: hi
  text: क्योंकि मैं चाहता हूँ कि तुम जानो कि तुम्हारे लिए, लौदीकिया में रहनेवालों के लिए, और उन सभी के लिए जिन्होंने मुझे सशरीर नहीं देखा है[a], मैं कितना बड़ा संघर्ष कर रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे व्यक्तिगत रूप से नहीं देखा है।” यूनानी में शाब्दिक रूप से, “मेरे चेहरे को देह में नहीं देखा है”; यहाँ आशय शारीरिक उपस्थिति में देखने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θέλω γὰρ ὑμᾶς εἰδέναι
  choice: क्योंकि मैं चाहता हूँ कि तुम जानो
  rationale: γάρ पिछले कथन से कारणात्मक संबंध जोड़ता है; θέλω और infinitive εἰδέναι का यह सीधा और स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἡλίκον ἀγῶνα ἔχω
  choice: कितना बड़ा संघर्ष कर रहा हूँ
  rationale: ἡλίκον संघर्ष की तीव्रता और परिमाण पर बल देता है। ἀγών यहाँ शाब्दिक खेल-प्रतियोगिता नहीं, बल्कि कठिन प्रयत्न या संघर्ष है; हिन्दी में प्रगतिशील क्रिया वर्तमान में जारी संलग्नता को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ὑπὲρ ὑμῶν
  choice: तुम्हारे लिए
  rationale: ὑπέρ यहाँ पाठकों की ओर से और उनके हित में किए जा रहे संघर्ष को दर्शाता है।
- source_word: τῶν ἐν Λαοδικείᾳ
  choice: लौदीकिया में रहनेवालों
  rationale: लेखयुक्त prepositional phrase व्यक्तियों के समूह को सूचित करता है; ‘में रहनेवालों’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ὅσοι οὐχ ἑόρακαν
  choice: उन सभी के लिए जिन्होंने … नहीं देखा है
  rationale: ὅσοι की समावेशी व्यापकता ‘सभी’ से सुरक्षित रहती है, और perfect ἑόρακαν का वर्तमान-संबद्ध प्रभाव ‘नहीं देखा है’ में व्यक्त होता है।
- source_word: τὸ πρόσωπόν μου ἐν σαρκί
  choice: मेरा चेहरा आमने-सामने
  rationale: πρόσωπον के ‘चेहरा’ बिंब को बनाए रखते हुए ἐν σαρκί का आशय—शारीरिक, प्रत्यक्ष उपस्थिति—स्वाभाविक हिन्दी मुहावरे ‘आमने-सामने’ से व्यक्त किया गया है। शाब्दिक रूप और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: गैर-नैतिक संदर्भ में σάρξ का अनुवाद
  choice: आमने-सामने
  alternative: सशरीर; देह में
  rationale: यहाँ σάρξ पापी स्वभाव की नहीं, पौलुस की भौतिक उपस्थिति की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक हिन्दी मुहावरा रखा गया है, जबकि ‘देह में’ का शाब्दिक आधार पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘संघर्ष’ पौलुस के गहन प्रयत्न को व्यक्त करता है, और ‘आमने-सामने’ भौतिक उपस्थिति के आशय को स्वाभाविक बनाते हुए ‘चेहरा’ की मूल छवि भी बनाए रखता है।
