id: COL.2.6
reference: Colossians 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/006.yaml
  text: Therefore[a], just as you received Messiah Jesus the Lord, walk in him,
translation:
  language: hi
  text: इसलिए, जिस प्रकार तुमने प्रभु मसीहा यीशु[a] को ग्रहण किया, उसी प्रकार उसमें चलते रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “मसीह यीशु।”
    reason: Χριστός का पारंपरिक हिंदी रूप ‘मसीह’ भी संभव है; मुख्य पाठ में उपाधि का अर्थ स्पष्ट करने के लिए ‘मसीहा’ रखा गया है।
lexical_decisions:
- source_word: Ὡς οὖν
  choice: इसलिए, जिस प्रकार ... उसी प्रकार
  rationale: οὖν पिछले तर्क से निष्कर्ष प्रकट करता है, जबकि ὡς उनके पहले ग्रहण करने और अब निरंतर आचरण करने के बीच तुलना स्थापित करता है। यह हिंदी संरचना दोनों संबंधों को स्वाभाविक रूप से स्पष्ट रखती है।
- source_word: παρελάβετε
  choice: ग्रहण किया
  rationale: यह उनके द्वारा पहले मसीहा यीशु और उनसे संबंधित प्रेरितीय संदेश को स्वीकार करने की घटना बताता है। ‘ग्रहण किया’ व्यक्ति और शिक्षा—दोनों को समेटने वाली व्यापक अभिव्यक्ति है।
- source_word: τὸν Χριστὸν Ἰησοῦν
  choice: मसीहा यीशु
  rationale: यहाँ Χριστός उपाधि के रूप में प्रयुक्त है; इसलिए उसके अर्थ को व्यक्त करने वाला ‘मसीहा’ रखा गया है और Ἰησοῦν को नाम ‘यीशु’ के रूप में लिप्यंतरित किया गया है।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος यहाँ यीशु की मसीही उपाधि है। हिंदी में ‘प्रभु’ इसका स्वाभाविक और स्थापित रूप है। वाक्य की सहजता के लिए इसे ‘मसीहा यीशु’ से पहले रखा गया है।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: यह पौलुस की संक्षिप्त और अर्थगर्भित ‘मसीह में’ भाषा को सुरक्षित रखता है तथा उसे ‘उसके साथ एकता में’ जैसे व्याख्यात्मक विस्तार से सीमित नहीं करता।
- source_word: περιπατεῖτε
  choice: चलते रहो
  rationale: वर्तमानकालीन आज्ञा निरंतर आचरण का भाव देती है। ‘चलते रहो’ पौलुस के जीवन-आचरण संबंधी रूपक को बनाए रखता है और केवल ‘जीवन बिताओ’ कहकर उसे सपाट नहीं करता।
theological_decisions:
- issue: पौलुस की उपाधि-शृंखला में Χριστός का अनुवाद
  choice: मसीहा यीशु
  alternative: मसीह यीशु
  rationale: इस प्रसंग में Χριστός केवल नाम का स्थिर भाग नहीं, बल्कि उपाधि का बल रखता है। इसलिए मुख्य पाठ में उसका अर्थ ‘मसीहा’ दिया गया है; हिंदी में अधिक परिचित पारंपरिक रूप ‘मसीह यीशु’ पादटिप्पणी में सुरक्षित है।
- issue: ἐν αὐτῷ में मसीह के साथ संबंध की भाषा
  choice: उसमें
  alternative: उसके साथ एकता में
  rationale: मूल यूनानी संक्षिप्त है और स्थान, संबंध तथा सहभागिता की समृद्ध धार्मिक अर्थच्छाया रखता है। ‘उसमें’ इस अर्थगत तनाव को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधा, गरिमापूर्ण और सामुदायिक संबोधन रखा गया है। ‘तुमने’ और ‘चलते रहो’ बहुवचन पाठक-समुदाय को संबोधित करते हैं। वाक्य-विन्यास स्वाभाविक हिंदी के लिए समायोजित है, पर मूल के निष्कर्ष, तुलना, आज्ञा और ‘उसमें’ वाली धार्मिक अर्थगर्भिता सुरक्षित हैं।
