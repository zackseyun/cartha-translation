source:
  edition: SBLGNT
  text: ἐξαλείψας τὸ καθ’ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/014.yaml
  text: having wiped out the record of debt against us in decrees[a], which was opposed to us, and he has taken it out of the way[b], having nailed it to the cross.
translation:
  language: hi
  text: उसने हमारे विरुद्ध उस ऋणपत्र को, जो विधि-विधानों में निहित था[a] और हमारे विरोध में था, मिटा दिया; और उसे क्रूस पर कीलों से जड़कर बीच में से हटा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विधि-विधानों के साथ,” “विधि-विधानों से बना हुआ,” अथवा “विधि-विधानों के द्वारा [हमारे विरुद्ध]।” यूनानी वाक्यांश का व्याकरणिक संबंध कठिन और विवादित है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “बीच में से हटा दिया।” यह मुहावरा किसी बाधा या वस्तु को पूरी तरह मार्ग से दूर कर देने का भाव देता है।
    reason: idiom_clarification
lexical_decisions:
- source_word: ἐξαλείψας
  choice: मिटा दिया
  rationale: यह लिखी हुई चीज़ को मिटाने या पूरी तरह निरस्त करने की छवि बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: χειρόγραφον
  choice: ऋणपत्र
  rationale: यह हस्तलिखित ऋण-स्वीकृति या बाध्यकारी लिखित दायित्व का भाव संक्षेप में व्यक्त करता है; व्यापक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: καθ’ ἡμῶν
  choice: हमारे विरुद्ध लिखे
  rationale: यह दस्तावेज़ के हमारे विरुद्ध होने का सीधा भाव देता है; 'लिखे' को ऋणपत्र की दस्तावेज़ी प्रकृति स्पष्ट करने के लिए जोड़ा गया है।
- source_word: τοῖς δόγμασιν
  choice: अपने विधि-विधानों के कारण
  rationale: कठिन संबंधवाचक चतुर्थी को ऐसे प्रस्तुत किया गया है कि विधि-विधान ऋणपत्र को हमारे विरोध में खड़ा करते हैं; यूनानी की अन्य सम्भव संरचना पादटिप्पणी में सुरक्षित है और इसे केवल मूसा की व्यवस्था तक सीमित नहीं किया गया।
- source_word: ὑπεναντίον
  choice: हमारे विरोध में था
  rationale: यह प्रतिकूलता को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनावश्यक रूप से अधिक तीखा अर्थ देने के।
- source_word: ἦρκεν ἐκ τοῦ μέσου
  choice: हमारे बीच से हटा दिया
  rationale: पूर्ण काल की स्थायी परिणति और बाधा को बीच से दूर कर देने वाले मुहावरे, दोनों को व्यक्त करता है।
- source_word: προσηλώσας αὐτὸ τῷ σταυρῷ
  choice: उसे क्रूस पर कीलों से जड़कर
  rationale: कृदन्त को साधनसूचक रूप में प्रस्तुत करता है और क्रूस पर कील लगाने की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: χειρόγραφον τοῖς δόγμασιν का अर्थ
  choice: विधि-विधानों से प्रतिकूल बना हमारे विरुद्ध ऋणपत्र
  alternative: मूसा की व्यवस्था स्वयं; पापों का ऋणलेख; कानूनी अभियोग; विधि-विधानों में निहित लिखित अभिलेख
  rationale: अनुवाद दस्तावेज़ और ऋण-दायित्व की रूपकात्मक छवि बनाए रखता है, पर इसे किसी एक व्यवस्था, वाचा या प्रायश्चित्त-सिद्धान्त के साथ समान नहीं ठहराता।
- issue: ἦρκεν का कर्ता
  choice: उसने—संदर्भ में परमेश्वर—उसे हटा दिया
  alternative: कर्ता को अस्पष्ट रखते हुए केवल हटाए जाने का भाव
  rationale: पिछले संदर्भ में परमेश्वर क्रिया का कर्ता है; हिन्दी में सर्वनाम से उसी कर्ता को जारी रखा गया है, बिना इस पद में नाम जोड़ने के।
- issue: προσηλώσας का संबंध
  choice: क्रूस पर कीलों से जड़ना ऋणपत्र को हटाने का साधन/साथ घटित कार्य है
  alternative: 'केवल क्रमिक क्रिया: उसे क्रूस पर कीलों से जड़ दिया'
  rationale: यूनानी कृदन्त साधन या साथ घटित परिस्थिति दोनों व्यक्त कर सकता है; '-कर' इस संबंध को स्वाभाविक रूप से खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। 'ऋणपत्र' कानूनी-दस्तावेज़ी रूपक को संक्षेप में रखता है; 'विधि-विधान' को किसी विशिष्ट धार्मिक व्यवस्था तक सीमित नहीं किया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
