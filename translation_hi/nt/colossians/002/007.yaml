  yaml_path: translation/nt/colossians/002/007.yaml
  text: having been rooted and being built up in him[a], and being established in the faith just as you were taught, overflowing with thanksgiving.
translation:
  language: hi
  text: उसमें जड़ पकड़े हुए और उसी में निर्माण पाते हुए, उस विश्वास में दृढ़ किए जाते हुए जैसा तुम्हें सिखाया गया था, और धन्यवाद से भरपूर होते हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐρριζωμένοι
  choice: जड़ पकड़े हुए
  rationale: पूर्ण कृदन्त बीते हुए कार्य के वर्तमान स्थायी परिणाम को व्यक्त करता है; यह रूप कृषि-संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐποικοδομούμενοι
  choice: बनाए जाते हुए
  rationale: वर्तमान कर्मवाच्य कृदन्त जारी प्रक्रिया को दर्शाता है। यह निर्माण का रूपक रखता है और किसी अनुल्लिखित नींव को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐν αὐτῷ
  choice: उसी में
  rationale: सर्वनाम निकट संदर्भ में मसीह की ओर संकेत करता है; ‘उसी में’ मूल के सर्वनाम और उसके बल, दोनों को बनाए रखता है।
- source_word: βεβαιούμενοι
  choice: दृढ़ होते हुए
  rationale: यह विश्वास में स्थिर और पक्का किए जाने का भाव सहज हिन्दी में व्यक्त करता है; कर्मवाच्य का आशय संदर्भ में बना रहता है।
- source_word: τῇ πίστει
  choice: विश्वास में
  rationale: सपद πίστις यहाँ संभवतः सिखाए गए विश्वास या विश्वास-संदेश के क्षेत्र को सूचित करता है। हिन्दी में ‘विश्वास में’ इस अर्थ को रखता है, जबकि संदर्भ-विरुद्ध अतिविशिष्ट पारिभाषिक पद से बचता है।
- source_word: καθὼς ἐδιδάχθητε
  choice: जैसा तुम्हें सिखाया गया था
  rationale: यह तुलना और पूर्व में मिली शिक्षा के कर्मवाच्य, दोनों को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περισσεύοντες
  choice: भरपूर होते जाओ
  rationale: वर्तमान कृदन्त प्रचुरता में लगातार बढ़ते रहने का भाव देता है; आज्ञार्थक मुख्य संदर्भ के साथ ‘होते जाओ’ चलती हुई अवस्था को स्वाभाविक बनाता है।
- source_word: ἐν εὐχαριστίᾳ
  choice: धन्यवाद से
  rationale: ‘धन्यवाद से भरपूर’ आधुनिक हिन्दी में स्वाभाविक है और εὐχαριστία के आभार तथा धन्यवाद व्यक्त करने के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: τῇ πίστει का अर्थ
  choice: विश्वास में—संभवतः वह सिखाया गया विश्वास या विश्वास-संदेश
  alternative: व्यक्तिगत भरोसे में; अथवा विश्वासयोग्यता में
  rationale: सपद रूप और उसके बाद ‘जैसा तुम्हें सिखाया गया था’ कथन विश्वास की सिखाई गई विषयवस्तु या क्षेत्र की ओर संकेत करते हैं। फिर भी πίστις की अर्थ-सीमा के कारण वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। कृषि और निर्माण के मिले-जुले मूल रूपकों को जानबूझकर बनाए रखा गया है। पद पिछले वाक्य की आज्ञा पर निर्भर है, इसलिए अंतिम ‘होते जाओ’ उसके प्रवाह को हिन्दी में स्पष्ट करता है।
