id: COL.2.8
reference: Colossians 2:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/008.yaml
  text: See to it that no one takes you captive through philosophy and empty deceit[a], according to human tradition, according to the elemental principles of the world[b], and not according to Messiah.
translation:
  language: hi
  text: सावधान रहो कि कोई तुम्हें दर्शनशास्त्र और खोखे धोखे के द्वारा बंदी बनाकर न ले जाए—मनुष्यों की परंपरा के अनुसार, संसार के मूल तत्त्वों[a] के अनुसार, न कि मसीह[b] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संसार की मूल आत्मिक शक्तियाँ।” यूनानी पद का अर्थ मूल तत्त्वों या आरंभिक सिद्धांतों का भी हो सकता है, और ब्रह्मांडीय आत्मिक शक्तियों का भी।
    reason: alternative_reading
  - marker: b
    text: 'यूनानी: “ख्रिस्तोस”; यहाँ इसे उपाधि के अर्थ में “मसीह” कहा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε μή τις
  choice: सावधान रहो कि कोई … न
  rationale: वर्तमान काल की आज्ञा और μή τις मिलकर संभावित खतरे के प्रति चेतावनी देते हैं; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: ἔσται ὁ συλαγωγῶν
  choice: बंदी बनाकर न ले जाए
  rationale: συλαγωγέω का मूल बिंब किसी को लूट के माल की तरह पकड़कर ले जाने का है; यह चयन उस बिंब को सहज हिंदी में बनाए रखता है।
- source_word: διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης
  choice: दर्शनशास्त्र और खोखले छल के द्वारा
  rationale: διά साधन को व्यक्त करता है। दोनों संज्ञाओं को अलग किंतु संबद्ध रखा गया है; उन्हें अनिवार्य रूप से एक-दूसरे का समानार्थक नहीं बनाया गया।
- source_word: κατὰ τὴν παράδοσιν τῶν ἀνθρώπων
  choice: मनुष्यों की परंपरा के अनुसार
  rationale: κατά यहाँ मानक या अनुरूपता बताता है; ἀνθρώπων सभी मनुष्यों के लिए सामान्य बहुवचन है।
- source_word: κατὰ τὰ στοιχεῖα τοῦ κόσμου
  choice: संसार के मूल तत्त्वों के अनुसार
  rationale: στοιχεῖα के अर्थ में मूल तत्त्व, आरंभिक सिद्धांत या ब्रह्मांडीय आत्मिक शक्तियाँ संभव हैं। मुख्य पाठ का चयन इस अर्थ-क्षेत्र को अपेक्षाकृत खुला रखता है।
- source_word: οὐ κατὰ Χριστόν
  choice: न कि मसीह के अनुसार
  rationale: Χριστός यहाँ उस व्यक्ति की उपाधि है जो मनुष्य-निर्मित परंपरा और सांसारिक तत्त्वों के विपरीत निर्णायक मानक है; ‘मसीह’ हिंदी में इसका स्वाभाविक उपाधिपरक रूप है।
theological_decisions:
- issue: στοιχεῖα τοῦ κόσμου का आशय
  choice: संसार के मूल तत्त्व
  alternative: संसार की मूल आत्मिक शक्तियाँ
  rationale: पौलुस के प्रयोग में यह पद विवादित है। मुख्य पाठ किसी एक विशिष्ट आध्यात्मिक व्याख्या को निर्णायक नहीं बनाता, जबकि पादटिप्पणी आत्मिक शक्तियों वाली महत्वपूर्ण संभावना सुरक्षित रखती है।
- issue: Χριστός का उपाधिपरक अर्थ
  choice: मसीह
  alternative: ख्रिस्त
  rationale: इस संदर्भ में Χριστός केवल नाम की तरह नहीं, बल्कि उस अभिषिक्त जन की उपाधि के रूप में प्रमुख है जिसके अनुसार शिक्षा का मूल्यांकन होना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में चेतावनी का स्वर स्पष्ट रखा गया है। ‘दर्शनशास्त्र’ प्रचलित और व्यापक शब्द है; ‘खोखला छल’ मूल की निरर्थकता और धोखे दोनों को व्यक्त करता है। वाक्य की क्रमिक ‘के अनुसार’ संरचना यूनानी विरोध को बनाए रखती है।
