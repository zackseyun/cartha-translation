reference: Colossians 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/020.yaml
  text: 'If you died with the Messiah from the elemental principles of the world[a], why, as if living in the world[b], are you submitting yourselves to decrees:'
translation:
  language: hi
  text: 'यदि तुम मसीह के साथ संसार के आधारभूत सिद्धांतों के प्रति मर गए हो[a], तो मानो संसार में जी रहे हो, नियमों के अधीन क्यों होते हो[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संसार की तत्त्व-शक्तियों के प्रति”; अथवा “संसार के मूल तत्त्वों के प्रति।”
    reason: στοιχεῖα के आत्मिक, नियामक और भौतिक अर्थों की वास्तविक अनिश्चितता को बनाए रखने के लिए।
  - marker: b
    text: या “तुम अपने आप को नियमों के अधीन क्यों करते हो?”
    reason: δογματίζεσθε के मध्यवाच्य या कर्मवाच्य अर्थ की संभावना को दिखाने के लिए।
lexical_decisions:
- source_word: Εἰ
  choice: यदि
  rationale: यह यूनानी की शर्तात्मक रचना को बनाए रखता है; प्रसंग में शर्त को सत्य माना गया हो सकता है, पर अनुवाद उसे स्पष्ट कथन में नहीं बदलता।
- source_word: ἀπεθάνετε
  choice: मर गए हो
  rationale: यह निर्णायक अतीत की घटना को व्यक्त करता है और आधुनिक हिन्दी में उसके वर्तमान संबंध को भी स्वाभाविक रूप से बनाए रखता है।
- source_word: σὺν Χριστῷ
  choice: मसीह के साथ
  rationale: ‘मसीह’ Χριστός के अभिषिक्त जन के पदवीगत अर्थ को हिन्दी की प्रचलित बाइबलीय भाषा में व्यक्त करता है।
- source_word: ἀπὸ τῶν στοιχείων τοῦ κόσμου
  choice: संसार के आधारभूत सिद्धांतों से
  rationale: ‘से’ अलगाव का भाव देता है। ‘आधारभूत सिद्धांत’ στοιχεῖα के आरंभिक या नियामक तत्त्वों के अर्थ को सामने रखता है, जबकि इसकी संभावित आत्मिक या भौतिक ध्वनि पादटिप्पणी में सुरक्षित है।
- source_word: ὡς ζῶντες ἐν κόσμῳ
  choice: संसार में जीवित लोगों की तरह
  rationale: यह ὡς और कृदंत की तुलनात्मक, व्यंग्यात्मक शक्ति को सहज हिन्दी में बनाए रखता है।
- source_word: δογματίζεσθε
  choice: अपने आप को नियमों के अधीन क्यों करते हो
  rationale: यह मध्यवाच्य/कर्मवाच्य रूप के आत्मवाची संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है; कर्मवाच्य संभावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: पौलुस के प्रयोग में στοιχεῖα का अर्थ
  choice: मुख्य पाठ में ‘आधारभूत सिद्धांत’
  alternative: ‘संसार की तत्त्व-शक्तियाँ’ या ‘संसार के मूल तत्त्व’
  rationale: यह शब्द बुनियादी व्यवस्थाओं, भौतिक तत्त्वों या ब्रह्मांडीय/आत्मिक शक्तियों की ओर संकेत कर सकता है। मुख्य पाठ किसी एक ब्रह्मांड-विज्ञान को निर्णायक नहीं बनाता और विकल्प पादटिप्पणी में रखता है।
- issue: δογματίζεσθε का वाच्य
  choice: आत्मवाची भाव—‘अपने आप को ... अधीन करते हो’
  alternative: कर्मवाच्य भाव—‘तुम्हें ... अधीन किया जाता है’
  rationale: यूनानी रूप दोनों भावों की गुंजाइश देता है। प्रसंग में पाठकों की सहभागिता को व्यक्त करने वाला आत्मवाची अनुवाद सहज है, पर कर्मवाच्य विकल्प भी सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अगले पदों में आने वाले नियमों की सूची से वाक्य जुड़ा होने के कारण अंत में द्विबिंदु रखा गया है।
