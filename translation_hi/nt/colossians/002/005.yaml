reference: Colossians 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/005.yaml
  text: For even if I am absent in the flesh[a], yet I am with you in spirit[c][b], rejoicing and seeing your good order and the firmness of your faith in Messiah.
translation:
  language: hi
  text: क्योंकि भले ही मैं शरीर से[a] अनुपस्थित हूँ, फिर भी आत्मा में[b] तुम्हारे साथ हूँ, और आनन्दित हूँ तथा तुम्हारी सुव्यवस्था और मसीह पर तुम्हारे विश्वास की दृढ़ता[c] देख रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “शरीर में”; यहाँ आशय शारीरिक रूप से अनुपस्थित होने का है।'
    reason: lexical_alternative
  - marker: b
    text: अथवा सम्भवतः, “पवित्र आत्मा में।” यूनानी में “आत्मा” और “पवित्र आत्मा” के लिए एक ही शब्द हो सकता है; यहाँ शरीर से अनुपस्थिति के साथ विरोध होने के कारण पौलुस की अपनी अशारीरिक उपस्थिति अधिक सम्भावित है।
    reason: alternative_reading
  - marker: c
    text: अथवा, “मसीह के प्रति तुम्हारी विश्वासयोग्यता की दृढ़ता।”
    reason: alternative_reading
lexical_decisions:
- source_word: σαρκί
  choice: शरीर से
  rationale: सन्दर्भ में पौलुस की शारीरिक अनुपस्थिति अभिप्रेत है, न कि σάρξ का नैतिक अर्थ। स्वाभाविक हिन्दी के लिए ‘शरीर में’ के बजाय मुख्य पाठ में ‘शरीर से’ रखा गया है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: πνεύματι
  choice: आत्मा में
  rationale: यह ‘शरीर से’ के विपरीत पौलुस की अशारीरिक व्यक्तिगत उपस्थिति को सबसे स्वाभाविक रूप से व्यक्त करता है और पवित्र आत्मा के सम्भावित संकेत को पादटिप्पणी में सुरक्षित रखता है।
- source_word: χαίρων καὶ βλέπων
  choice: देखकर आनन्दित होता हूँ
  rationale: दोनों वर्तमान कृदन्तों का अर्थ सुरक्षित रखते हुए हिन्दी में स्वाभाविक कारणात्मक सम्बन्ध व्यक्त किया गया है; पौलुस उनकी दशा देखकर आनन्दित है।
- source_word: τάξιν
  choice: सुव्यवस्था
  rationale: यह समुदाय की प्रशंसनीय व्यवस्था और अनुशासन को संक्षेप तथा गरिमापूर्ण ढंग से व्यक्त करता है, बिना अनावश्यक सैन्य भाव लाए।
- source_word: στερέωμα
  choice: दृढ़ता
  rationale: शब्द का मूल भाव स्थिरता, मजबूती और अडिगपन है; ‘विश्वास की दृढ़ता’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πίστεως
  choice: विश्वास
  rationale: यहाँ πίστις का सामान्य और सन्दर्भानुकूल अर्थ ‘विश्वास’ है; ‘विश्वासयोग्यता’ की सम्भावित छाया पादटिप्पणी में रखी गई है।
- source_word: εἰς Χριστόν
  choice: मसीह पर
  rationale: εἰς विश्वास के लक्ष्य को सूचित करता है और हिन्दी में ‘मसीह पर विश्वास’ स्वाभाविक है। Χριστός यहाँ उपाधि के रूप में ‘मसीह’ अनूदित है।
theological_decisions:
- issue: ‘शरीर ... आत्मा’ में आत्मा का सन्दर्भ
  choice: पौलुस शरीर से अनुपस्थित, पर अपनी आत्मा में उनके साथ है।
  alternative: वह पवित्र आत्मा के द्वारा या पवित्र आत्मा में उनके साथ है।
  rationale: तात्कालिक विरोध शारीरिक और अशारीरिक व्यक्तिगत उपस्थिति की ओर संकेत करता है। फिर भी यूनानी रूप अपने आप में पवित्र आत्मा की सम्भावना को पूर्णतः बन्द नहीं करता, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द विश्वास के लक्ष्य की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसका अर्थपूर्ण और हिन्दी में स्थापित रूप है।
- issue: πίστις का अर्थ
  choice: मसीह पर विश्वास
  alternative: मसीह के प्रति विश्वासयोग्यता
  rationale: εἰς Χριστόν के साथ वस्तुगत विश्वास सर्वाधिक स्वाभाविक है, पर πίστις में विश्वासयोग्यता का अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘सुव्यवस्था’ और ‘दृढ़ता’ मूल के समानान्तर संज्ञात्मक बल को बनाए रखते हैं, जबकि ‘देखकर आनन्दित होता हूँ’ हिन्दी वाक्य-विन्यास को सहज बनाता है।
