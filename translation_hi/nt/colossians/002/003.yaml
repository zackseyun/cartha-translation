- source_word: ἀπόκρυφοι
  choice: छिपे हुए
  rationale: यह विशेषण के मूल अर्थ को पारदर्शी ढंग से व्यक्त करता है, बिना यह तय किए कि भंडार गुप्त, अप्राप्य या सुरक्षित रखे हुए हैं।
- source_word: εἰσιν ... ἀπόκρυφοι
  choice: छिपे हुए हैं
  rationale: यूनानी सहायक क्रिया और विधेय विशेषण को स्वाभाविक हिन्दी विधेय-रचना में प्रस्तुत करता है।
