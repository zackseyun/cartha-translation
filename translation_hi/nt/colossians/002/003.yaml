- issue: क्या ἀπόκρυφοι रहस्यवादी गोपनीयता या मसीह में सुरक्षित रखे होने का बोध देता है
  choice: ‘छिपे हुए’—अर्थ को तटस्थ रखा गया है
  alternative: ‘संचित हैं’ या ‘गुप्त हैं’
  rationale: यूनानी शब्द छिपे होने और सुरक्षित रखे होने, दोनों की ओर संकेत कर सकता है; इसलिए अनुवाद संदर्भ के धर्मवैचारिक तनाव को किसी एक व्याख्या में सीमित नहीं करता।
- issue: ἐν ᾧ का पूर्वपद मसीह हैं या अधिक व्यापक रूप से परमेश्वर का भेद
  choice: ‘जिसमें’ द्वारा अस्पष्टता सुरक्षित रखी गई
  alternative: व्यक्ति को स्पष्ट करने के लिए ‘जिनमें’
  rationale: निकटतम व्यक्तिगत संदर्भ मसीह हैं, फिर भी यूनानी रूप व्यापक ‘भेद’ की ओर लौटने की संभावना को पूर्णतः समाप्त नहीं करता। हिन्दी ‘जिसमें’ दोनों पाठ-संभावनाओं को स्वाभाविक रूप से रहने देता है।
