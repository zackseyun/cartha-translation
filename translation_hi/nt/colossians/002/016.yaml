  text: Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ⸀ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/016.yaml
  text: Therefore[a], let no one judge you in food or in drink[c][b], or with regard to a festival or a new moon or Sabbaths.
translation:
  language: hi
  text: इसलिए खाने या पीने, अथवा किसी पर्व, नए चाँद या सब्तों के संबंध में कोई तुम्हारा न्याय न करे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् खाने-पीने से जुड़े नियमों या आचरण के आधार पर।
    reason: cultural_note
  - marker: b
    text: ‘पर्व, नया चाँद और सब्त’ की शृंखला यहूदी पवित्र पंचांग के वार्षिक, मासिक और साप्ताहिक अवसरों की ओर संकेत करती है।
    reason: cross_reference
lexical_decisions:
- source_word: Μὴ οὖν τις ὑμᾶς κρινέτω
  choice: इसलिए कोई भी ... तुम्हारा न्याय न करे
  rationale: οὖν का निष्कर्षसूचक संबंध ‘इसलिए’ से व्यक्त होता है; निषेधात्मक आज्ञा और अनिश्चित कर्ता को स्वाभाविक हिन्दी में ‘कोई भी ... न करे’ कहा गया है। κρίνω के न्याय/दोष ठहराने के अर्थ को ‘न्याय न करे’ सुरक्षित रखता है।
- source_word: ἐν βρώσει ἢ ἐν πόσει
  choice: खाने या पीने के विषय में
  rationale: βρῶσις और πόσις क्रिया अथवा वस्तु—दोनों का बोध करा सकते हैं। हिन्दी में ‘खाने या पीने’ से मूल की यह निकटता बनी रहती है, जबकि ‘के विषय में’ यहाँ ἐν का संबंधपरक अर्थ स्पष्ट करता है।
- source_word: ἐν μέρει ἑορτῆς
  choice: किसी पर्व ... के विषय में
  rationale: ἐν μέρει यहाँ मुहावरे के रूप में ‘के विषय में/के संबंध में’ है, न कि ‘पर्व के किसी भाग में’। ἑορτή के लिए आधुनिक और गरिमापूर्ण ‘पर्व’ चुना गया है।
- source_word: νουμηνίας
  choice: नए चाँद के उत्सव
  rationale: νουμηνία मासिक नवचंद्र-अनुष्ठान का द्योतक है। केवल ‘नया चाँद’ खगोलीय घटना समझा जा सकता है, इसलिए संदर्भ स्पष्ट करने हेतु ‘उत्सव’ जोड़ा गया है।
- source_word: σαββάτων
  choice: सब्तों
  rationale: यूनानी बहुवचन को सुरक्षित रखा गया है और यह वार्षिक, मासिक तथा साप्ताहिक पवित्र समयों की पारंपरिक शृंखला से मेल खाता है।
theological_decisions:
- issue: सूचीबद्ध आहार और पवित्र दिनों की प्रथाओं का स्वरूप
  choice: पद का केंद्र इन विषयों के आधार पर विश्वासियों का न्याय न करने पर रखा गया है।
  alternative: इसे सभी ऐसी प्रथाओं का पूर्ण उन्मूलन, अथवा केवल मनुष्य-निर्मित तपस्वी नियमों का निषेध घोषित करना।
  rationale: इस पद का यूनानी पाठ स्वयं इन प्रथाओं की स्थायी वैधता या अवैधता का पूरा निर्णय नहीं देता; वह इनके विषय में न्याय करने से रोकता है। अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘न्याय न करे’ मूल के κρίνω को सीधे रखता है; ‘के विषय में’ दोहराए गए यूनानी संबंध-सूचक पदबंधों का स्वाभाविक हिन्दी रूप है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
