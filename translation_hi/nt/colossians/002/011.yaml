  text: ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ ⸀σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/011.yaml
  text: In him you also were circumcised with a circumcision not made by hands[a], in the removal of the body of flesh, in the circumcision of Messiah[e][d][c][b],
translation:
  language: hi
  text: उसी में तुम लोगों का भी ऐसा खतना हुआ जो हाथों से नहीं किया गया था[a]—मांस की देह को उतार देने में[b], मसीह के खतने में[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाथों से बना हुआ नहीं।”
    reason: lexical_alternative
  - marker: b
    text: या, “मांस की देह को उतार फेंकने में।” ‘मांस’ को व्याख्यात्मक रूप से “पापी स्वभाव” भी समझा जा सकता है, पर यहाँ यूनानी शब्द का अधिक शाब्दिक रूप रखा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “मसीह द्वारा किए गए खतने में” या “मसीह के अपने खतने में।” यूनानी पदबंध मसीह द्वारा किए गए, मसीह के अपने, या मसीह से सम्बन्धित खतने का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν ᾧ
  choice: उसी में
  rationale: सम्बन्धवाचक सर्वनाम पिछले प्रसंग के मसीह की ओर संकेत करता है। ‘उसी में’ मसीह के साथ एकता का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περιετμήθητε
  choice: तुम्हारा ... खतना हुआ
  rationale: अओरिस्ट कर्मवाच्य को पूर्ण हुई क्रिया के रूप में रखा गया है और रूपक को समझाकर समाप्त करने के बजाय ‘खतना’ शब्द बनाए रखा गया है।
- source_word: περιτομῇ ἀχειροποιήτῳ
  choice: ऐसा खतना ... जो हाथों से नहीं किया गया था
  rationale: यह दैवी, गैर-मानवीय कार्य और मनुष्य द्वारा किए जाने वाले शारीरिक संस्कार के बीच विरोध को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: ἐν τῇ ἀπεκδύσει
  choice: उतार देने में
  rationale: ἀπέκδυσις कपड़े की तरह उतारने या पूरी तरह अलग करने का बिंब रखता है; ‘उतार देने’ में यह बिंब ‘हटा देने’ की अपेक्षा अधिक स्पष्ट रहता है।
- source_word: τοῦ σώματος τῆς σαρκός
  choice: मांस की देह को
  rationale: कठिन सम्बन्धकारक पदबंध को अपेक्षाकृत शाब्दिक रखा गया है, ताकि इसे केवल भौतिक शरीर या केवल पापी स्वभाव मानकर अर्थ सीमित न किया जाए।
- source_word: σαρκός
  choice: मांस
  rationale: पौलुस के σάρξ शब्द की अर्थगत और धर्मवैज्ञानिक व्यापकता को बनाए रखने के लिए व्याख्यात्मक ‘पापी स्वभाव’ नहीं अपनाया गया।
- source_word: ἐν τῇ περιτομῇ τοῦ Χριστοῦ
  choice: मसीह के खतने में
  rationale: दोहराए गए ἐν को ‘में’ से और Χριστός को उपाधि ‘मसीह’ से व्यक्त किया गया है। सम्बन्धकारक ‘के’ इस खतने के कर्ता, स्वामित्व या मसीह से सम्बन्ध की सम्भावनाओं को खुला रखता है।
theological_decisions:
- issue: ‘मसीह के खतने’ का अर्थ
  choice: सम्बन्धकारक को खुला रखते हुए ‘मसीह के खतने में’
  alternative: मसीह द्वारा किए गए खतने में; मसीह के अपने खतने में; मसीह से सम्बन्ध रखने वाले खतने में
  rationale: τοῦ Χριστοῦ व्याकरणतः एक से अधिक सम्बन्ध व्यक्त कर सकता है। प्रसंग विश्वासियों के आत्मिक खतने को मसीह के साथ उनकी एकता से जोड़ता है, इसलिए अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक नहीं बनाता।
- issue: ‘मांस की देह’ का आशय
  choice: मुहावरे को ‘मांस की देह’ के रूप में बनाए रखा
  alternative: मांसमय देह; पापी स्वभाव; पापमय शरीर
  rationale: मूल पाठ का पदबंध अर्थ की दृष्टि से कठिन है। ‘पापी स्वभाव’ जैसी व्याख्या जोड़ना पौलुस की मानव-सम्बन्धी बात को समय से पहले सीमित कर देता, जबकि ‘पापमय शरीर’ मूल पाठ में ‘पापों’ का विचार जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण लेकिन सहज रूप अपनाया गया है। ‘खतना’, ‘मांस’ और ‘देह’ जैसे बाइबलीय शब्द मूल के रूपक और अर्थगत तनाव को बनाए रखते हैं; वाक्य की पुनरावृत्त संरचना भी यूनानी पाठ के अनुरूप यथासम्भव सुरक्षित है।
