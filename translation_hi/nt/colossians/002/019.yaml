source:
  edition: SBLGNT
  text: καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/colossians/002/019.yaml
  text: and not holding fast to the Head[a], from whom the whole body, being supplied and held together through the joints and ligaments[c][b], grows with the growth of God.
translation:
  language: hi
  text: और वह सिर को दृढ़ता से थामे नहीं रहता; उसी से सारा शरीर जोड़ों और स्नायुबंधनों के द्वारा आपूर्ति और पोषण पाता और एक साथ जोड़ा जाता है, और परमेश्वर से होने वाली वृद्धि के साथ बढ़ता है।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सिर से चिपका नहीं रहता।’
    reason: κρατέω दृढ़ता से पकड़ने के साथ लगातार जुड़े रहने का भाव भी दे सकता है।
  - marker: b
    text: या, ‘आपूर्ति पाता’; यहाँ प्रयुक्त शब्द पोषण के साथ आवश्यक सहायता या साधन उपलब्ध कराए जाने का व्यापक अर्थ भी रखता है।
    reason: ἐπιχορηγούμενον का अर्थ केवल भोजन या पोषण तक सीमित नहीं है।
  - marker: c
    text: शाब्दिक रूप से, ‘परमेश्वर की बढ़ोतरी से बढ़ता है।’ सम्भवतः आशय उस बढ़ोतरी से है जो परमेश्वर की ओर से आती है।
    reason: यूनानी सम्बन्धकारक τοῦ θεοῦ संक्षिप्त है और स्रोत के अर्थ के साथ अन्य व्याकरणिक सूक्ष्मताओं की गुंजाइश भी रखता है।
lexical_decisions:
- source_word: κρατῶν
  choice: दृढ़ता से थामे रहता
  rationale: यह केवल छूने या पकड़ने के बजाय लगातार दृढ़ता से जुड़े रहने का भाव व्यक्त करता है। नकार οὐ के साथ मुख्य पाठ में ‘दृढ़ता से थामे नहीं रहता’ स्वाभाविक है।
- source_word: κεφαλήν
  choice: सिर
  rationale: शरीर के रूपक को बनाए रखता है; संदर्भ में इसका संकेत मसीह की ओर है, पर हिन्दी में विशेष रूप से बड़े अक्षर का भेद उपलब्ध नहीं है।
- source_word: ἐξ οὗ
  choice: उसी से
  rationale: पुल्लिंग सम्बन्धवाचक सर्वनाम ‘सिर’ की ओर लौटता है और शरीर की आपूर्ति तथा वृद्धि के स्रोत को दर्शाता है।
- source_word: πᾶν τὸ σῶμα
  choice: सारा शरीर
  rationale: एक सम्पूर्ण शरीर की सामूहिक छवि को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἁφῶν
  choice: जोड़ों
  rationale: शारीरिक रूपक में सम्पर्क या जुड़ाव के स्थानों के लिए यह सबसे स्पष्ट और स्वाभाविक विकल्प है।
- source_word: συνδέσμων
  choice: स्नायुबंधनों
  rationale: जो अंगों को बाँधते और स्थिर रखते हैं उनके लिए यह सटीक शारीरिक शब्द है तथा ‘जोड़ों’ के साथ रूपक को स्पष्ट रखता है।
- source_word: ἐπιχορηγούμενον
  choice: पोषण पाता
  rationale: मध्य/कर्मवाच्य कृदन्त शरीर को मिलने वाली आपूर्ति और सहारे को दर्शाता है; शरीर के संदर्भ में ‘पोषण पाता’ स्वाभाविक है, जबकि टिप्पणी में व्यापक अर्थ भी बताया गया है।
- source_word: συμβιβαζόμενον
  choice: एक साथ बँधा रहता
  rationale: शरीर के विभिन्न अंगों के एकीकृत और परस्पर जुड़े रहने का संरचनात्मक भाव बनाए रखता है।
- source_word: αὔξει
  choice: बढ़ता है
  rationale: क्रिया शरीर के सजीव रूपक को आगे बढ़ाती है; ‘वृद्धि करता है’ की तुलना में यह अधिक स्वाभाविक है।
- source_word: τὴν αὔξησιν τοῦ θεοῦ
  choice: उस बढ़ोतरी से ... जो परमेश्वर देता है
  rationale: सम्बन्धकारक को सम्भावित स्रोत के अर्थ में स्पष्ट, सहज हिन्दी में व्यक्त करता है, जबकि पाद-टिप्पणी यूनानी की अधिक शाब्दिक और व्याकरणतः खुली अभिव्यक्ति को सुरक्षित रखती है।
theological_decisions:
- issue: τὴν αὔξησιν τοῦ θεοῦ में सम्बन्धकारक का अर्थ
  choice: 'बढ़ोतरी का स्रोत परमेश्वर है: ‘उस बढ़ोतरी से ... जो परमेश्वर देता है’'
  alternative: ‘परमेश्वर की बढ़ोतरी से बढ़ता है’
  rationale: निकटवर्ती संदर्भ में शरीर को सिर से जीवन, पोषण और एकता मिलती है; इसलिए स्रोत का अर्थ सबसे सम्भावित है। फिर भी यूनानी वाक्यांश अधिक संक्षिप्त और कुछ हद तक अस्पष्ट है, जिसे पाद-टिप्पणी में शाब्दिक रूप देकर सुरक्षित रखा गया है।
- issue: ‘सिर’ का संदर्भ
  choice: रूपक को सीधे ‘सिर’ के रूप में रखना
  alternative: मुख्य पाठ में ‘मसीह, जो सिर है’ जोड़ना
  rationale: संदर्भ मसीह की ओर संकेत करता है, लेकिन इस पद में उनका नाम जोड़ना मूल पाठ से अधिक व्याख्यात्मक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘सिर’, ‘शरीर’, ‘जोड़ों’ और ‘स्नायुबंधनों’ से मूल शारीरिक रूपक सुरक्षित है। पद पिछले वाक्य से व्याकरणतः जुड़ा है, फिर भी उपलब्ध स्वतंत्र पद के रूप में ‘वह’ जोड़कर हिन्दी वाक्य को पठनीय बनाया गया है।
