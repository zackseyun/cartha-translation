  text: और तुम्हें भी, जो अपने अपराधों[a] में और अपनी देह की खतनारहित दशा[b] में मरे हुए थे, उसने उसके साथ जीवित कर दिया—हमारे[c] सारे अपराधों को क्षमा करके।
  philosophy: optimal-equivalence
  footnotes:
