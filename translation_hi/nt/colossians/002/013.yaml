lexical_decisions:
- source_word: νεκροὺς ὄντας
  choice: जो ... मरे हुए थे
  rationale: यह कृदन्तीय पद तुम्हें का वर्णन करता है। हिन्दी में सम्बन्धवाचक उपवाक्य स्वाभाविक है और मृत्यु की अवस्था को बनाए रखता है।
- source_word: ἐν τοῖς παραπτώμασιν
  choice: अपने अपराधों में
  rationale: ‘में’ यूनानी ἐν को और अपराधों के बीच विद्यमान मृत्यु की अवस्था को सुरक्षित रखता है; इसे केवल कारणसूचक ‘के कारण’ नहीं बनाया गया।
- source_word: ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν
  choice: अपनी देह की खतनारहित दशा
  rationale: ἀκροβυστία यहाँ खतना न हुई होने की दशा बताता है। ‘देह’ शारीरिक अर्थ को बनाए रखता है और ‘पापी स्वभाव’ जैसी व्याख्या को मुख्य पाठ में नहीं थोपता।
- source_word: συνεζωοποίησεν ... σὺν αὐτῷ
  choice: उसने उसके साथ जीवित कर दिया
  rationale: संयुक्त क्रिया और σύν दोनों साथ जीवित किए जाने पर बल देते हैं। सर्वनाम ‘उसके’ मूल की अस्पष्टता को बनाए रखता है, यद्यपि निकटवर्ती सन्दर्भ मसीह की ओर संकेत करता है।
- source_word: χαρισάμενος
  choice: क्षमा करके
  rationale: कृदन्त को हिन्दी के पूर्वकालिक कृदन्त से प्रस्तुत किया गया है, जिससे क्षमा और जीवित किए जाने का निकट सम्बन्ध बना रहता है।
- source_word: ἡμῖν
  choice: हमारे
  rationale: मूल पाठ में ‘तुम्हें/तुम्हारे’ से ‘हमारे’ की ओर हुआ पुरुष-परिवर्तन सुरक्षित रखा गया है।
- source_word: πάντα τὰ παραπτώματα
  choice: सारे अपराधों
  rationale: ‘सारे’ क्षमा की पूर्णता व्यक्त करता है और पहले आए παράπτωμα के लिए ‘अपराध’ की शब्दगत संगति बनाए रखता है।
theological_decisions:
- issue: τῆς σαρκὸς ὑμῶν में σάρξ का अर्थ
  choice: शाब्दिक ‘देह’, जिसमें प्रसंगगत आत्मिक संकेत की सम्भावना बनी रहती है
  alternative: ‘पापी स्वभाव’
  rationale: खतने की निकटवर्ती चर्चा के कारण वाक्यांश सबसे सीधे शारीरिक खतनारहित दशा को बताता है। ‘पापी स्वभाव’ अनावश्यक रूप से एक व्याख्या निश्चित कर देता।
- issue: σὺν αὐτῷ में αὐτῷ का सन्दर्भ
  choice: मुख्य पाठ में सर्वनाम ‘उसके’
  alternative: स्पष्ट करके ‘मसीह के साथ’
  rationale: 2:12 का प्रसंग मसीह के साथ गाड़े और जिलाए जाने की ओर संकेत करता है, फिर भी मूल पाठ सर्वनाम रखता है; इसलिए हिन्दी में भी सर्वनाम रखा गया है।
- issue: दूसरे पुरुष से पहले पुरुष बहुवचन की ओर परिवर्तन
  choice: ‘तुम्हें/अपनी’ से ‘हमारे’ का परिवर्तन बनाए रखना
  alternative: पूरे वाक्य में ‘तुम्हारे’ करके सामंजस्य बैठाना
  rationale: यह परिवर्तन यूनानी पाठ में वास्तविक है और सम्भवतः कथन का दायरा लेखक तथा अन्य विश्वासियों तक बढ़ाता है; इसे चुपचाप समतल नहीं किया गया।
