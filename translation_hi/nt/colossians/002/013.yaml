    text: या, ‘अपने उल्लंघनों में’।
    reason: lexical_alternative
  - marker: b
    text: ‘अपनी देह की खतनारहित दशा’ सबसे सीधे उनकी शारीरिक रूप से खतनारहित अवस्था को बताती है, यद्यपि इस प्रसंग में इसका आत्मिक महत्त्व भी है।
