  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। ‘खतनारहित दशा’ सामान्य पाठक के लिए समझने योग्य रहते हुए मूल सांस्कृतिक अभिव्यक्ति को सुरक्षित रखती है। दीर्घ विराम-चिह्न क्षमा करने वाले कृदन्त को मुख्य क्रिया से स्पष्ट रूप से जोड़ता है।
