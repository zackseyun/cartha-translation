  text: καὶ διεστέλλετο αὐτοῖς λέγων· Ὁρᾶτε, βλέπετε ἀπὸ τῆς ζύμης τῶν Φαρισαίων καὶ τῆς ζύμης Ἡρῴδου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/015.yaml
  text: And he kept instructing them[a], saying, “Watch out[b]; beware of the leaven of the Pharisees and the leaven of Herod.”
translation:
  language: hi
  text: और वह उन्हें चेतावनी देता रहा, “सतर्क रहो; फ़रीसियों के ख़मीर[a] और हेरोदेस के ख़मीर से सावधान रहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘ख़मीर’ यहाँ फैलने वाले प्रभाव की उपमा है; इस पद में उस प्रभाव का ठीक स्वरूप स्पष्ट नहीं किया गया है। तुलना करें: मत्ती 16:6, 12; लूका 12:1।'
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: διεστέλλετο
  choice: बार-बार चेतावनी देता रहा
  rationale: अपूर्ण भूतकाल चलती या दोहराई गई क्रिया को दर्शाता है। प्रसंग में यह गंभीर चेतावनी है, इसलिए यह रूप कालगत और प्रसंगगत दोनों बल व्यक्त करता है।
- source_word: Ὁρᾶτε, βλέπετε
  choice: सावधान रहो! ... चौकन्ने रहो
  rationale: दोनों आज्ञार्थक क्रियाएँ निकटार्थी हैं और मिलकर चेतावनी पर बल देती हैं। दो अलग किंतु संबद्ध हिन्दी अभिव्यक्तियाँ इस पुनरुक्ति को स्वाभाविक ढंग से बनाए रखती हैं।
- source_word: ἀπὸ
  choice: से
  rationale: चेतावनी के प्रसंग में ἀπό से अलग रहने या बचने का भाव देता है; हिन्दी में ‘से चौकन्ने रहो’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ζύμης
  choice: ख़मीर
  rationale: ‘ख़मीर’ आधुनिक हिन्दी में समझ में आने वाला शब्द है और पूरे आटे में फैलने वाले प्रभाव की मूल उपमा को सुरक्षित रखता है।
- source_word: τῶν Φαρισαίων
  choice: फ़रीसियों के
  rationale: समूह के नाम का प्रचलित हिन्दी रूप रखा गया है और संबंधकारक को मूल पाठ के अनुरूप बनाए रखा गया है।
- source_word: Ἡρῴδου
  choice: हेरोदेस के
  rationale: मूल पाठ सीधे हेरोदेस का नाम लेता है; इसे उसके दल, घराने या विचारधारा के रूप में विस्तार देना अनावश्यक व्याख्या होता।
theological_decisions:
- issue: ‘ख़मीर’ की उपमा का अर्थ
  choice: मुख्य पाठ में उपमा को बिना खोले ‘ख़मीर’ के रूप में रखना
  alternative: शिक्षा, कपट, या बिगाड़ने वाला प्रभाव
  rationale: इस पद में उपमा का सटीक आशय स्पष्ट नहीं किया गया है। निकटवर्ती और समानांतर प्रसंग नकारात्मक प्रभाव का संकेत देते हैं, पर मुख्य पाठ में किसी एक अर्थ को निश्चित कर देना मूल की अर्थगत खुलावट को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बार-बार ... देता रहा’ अपूर्ण भूतकाल का पुनरावृत्त बल व्यक्त करता है। ‘सावधान’ और ‘चौकन्ने’ से यूनानी की दोहरी चेतावनी सुरक्षित रहती है।
