lexical_decisions:
- source_word: ἦσαν
  choice: वे … थे
  rationale: यहाँ क्रिया उपस्थित लोगों की संख्या बताती है; हिन्दी में ‘वे लगभग चार हज़ार थे’ स्वाभाविक और स्पष्ट है।
- source_word: δὲ
  choice: फिर
  rationale: δέ एक हल्का कथात्मक संयोजक है। यहाँ ‘फिर’ प्रसंग को आगे बढ़ाता है, बिना किसी प्रबल विरोध का भाव जोड़े।
- source_word: ὡς
  choice: लगभग
  rationale: संख्या के साथ ὡς अनुमान सूचित करता है; ‘लगभग’ आधुनिक मानक हिन्दी में सटीक और स्वाभाविक है।
- source_word: τετρακισχίλιοι
  choice: चार हज़ार
  rationale: यह उपस्थित भीड़ की अनुमानित संख्या बताता है।
- source_word: ἀπέλυσεν
  choice: विदा कर दिया
  rationale: इस प्रसंग में ἀπολύω का अर्थ भीड़ को जाने देना या विदा करना है; ‘विदा कर दिया’ हिन्दी कथा-शैली में स्वाभाविक है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: सर्वनाम का संकेत पहले उल्लिखित भीड़ के लोगों की ओर है।
