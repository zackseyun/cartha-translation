source:
  edition: SBLGNT
  text: Καὶ προσκαλεσάμενος τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ εἶπεν αὐτοῖς· ⸂Εἴ τις⸃ θέλει ὀπίσω μου ⸀ἐλθεῖν, ἀπαρνησάσθω ἑαυτὸν καὶ ἀράτω τὸν σταυρὸν αὐτοῦ καὶ ἀκολουθείτω μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/034.yaml
  text: And after calling the crowd together with his disciples[a], he said to them, “If anyone wants to come after me, let him deny himself, take up his cross[b], and follow me.”
translation:
  language: hi
  text: और उसने भीड़ को अपने चेलों समेत पास बुलाकर उनसे कहा, “यदि कोई मेरे पीछे आना चाहता है, तो वह अपने आप का इनकार करे, अपना क्रूस उठाए[a] और मेरा अनुसरण करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपना क्रूस उठाए” क्रूस की शाब्दिक छवि को बनाए रखता है; यहाँ इसे केवल कोई बोझ या कठिनाई सहने के लिए किया गया रूपक नहीं कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: पास बुलाकर
  rationale: यह क्रिया लोगों को अपने पास बुलाने का भाव देती है। कृदंत की पूर्ववर्ती क्रिया को सहज हिन्दी में ‘पास बुलाकर’ से व्यक्त किया गया है।
- source_word: τὸν ὄχλον σὺν τοῖς μαθηταῖς αὐτοῦ
  choice: भीड़ को अपने चेलों समेत
  rationale: σύν साथ होने का भाव देता है; ‘समेत’ स्पष्ट करता है कि यीशु ने भीड़ और अपने चेलों, दोनों को संबोधित किया।
- source_word: Εἴ τις θέλει ὀπίσω μου ἐλθεῖν
  choice: यदि कोई मेरे पीछे आना चाहता है
  rationale: यह सामान्य और खुली शर्त को व्यक्त करता है तथा ὀπίσω μου की शिष्यत्व-संबंधी स्थानिक उपमा को बनाए रखता है।
- source_word: ἀπαρνησάσθω ἑαυτόν
  choice: वह अपने आप से इनकार करे
  rationale: ‘इनकार करे’ ἀπαρνέομαι के प्रबल अस्वीकार के भाव को बनाए रखता है; ‘अपने आप से’ आत्म-त्याग की माँग व्यक्त करता है, केवल किसी सुविधा को छोड़ना नहीं।
- source_word: ἀράτω τὸν σταυρὸν αὐτοῦ
  choice: अपना क्रूस उठाए
  rationale: क्रूस की ऐतिहासिक और रूपकात्मक छवि को किसी सामान्य ‘बोझ’ में बदले बिना अक्षुण्ण रखा गया है।
- source_word: ἀκολουθείτω μοι
  choice: मेरे पीछे चले
  rationale: वर्तमान आज्ञार्थक निरंतर शिष्यत्व का संकेत दे सकता है। स्वाभाविक हिन्दी में ‘मेरे पीछे चले’ आज्ञा और अनुसरण, दोनों को व्यक्त करता है।
theological_decisions:
- issue: शिष्यत्व की शर्त और आज्ञाओं का बल
  choice: खुली शर्त ‘यदि कोई...चाहता है’ के बाद तीन आज्ञार्थक माँगें रखी गई हैं।
  alternative: हर क्रिया के साथ ‘अवश्य’ या ‘ज़रूर’ जोड़ना।
  rationale: यूनानी पाठ इच्छा को खुला रखता है, पर उसके बाद आज्ञार्थक रूपों में शिष्यत्व की बाध्यकारी माँगें देता है। हिन्दी में विधिलिंग इन्हें बिना अतिरिक्त धर्मसैद्धांतिक बल जोड़े व्यक्त करता है।
- issue: σταυρός का अर्थ
  choice: क्रूस
  alternative: बोझ, दुःख या केवल शहादत
  rationale: पाठ रोमी दंड के वास्तविक साधन की ठोस और गंभीर छवि का उपयोग करता है। इसे सामान्य बोझ या दुःख कहने से अर्थ अनुचित रूप से संकुचित और हल्का हो जाएगा।
- issue: ἀπαρνησάσθω ἑαυτόν का आशय
  choice: अपने आप से इनकार करे
  alternative: अपनी इच्छाओं को दबाए या केवल आत्म-संयम करे
  rationale: यूनानी अभिव्यक्ति स्वयं के दावे और स्वामित्व के व्यापक त्याग की ओर संकेत करती है; इसे केवल संयम या तपस्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चेला’ सामान्य पाठक के लिए शिष्यत्व-संबंधी प्रसंग में स्वाभाविक है। ‘क्रूस’ ऐतिहासिक और धर्मग्रंथीय छवि को सुरक्षित रखता है। अंग्रेज़ी परामर्श-पाठ की पहली पाद-टिप्पणी मुख्य वाक्य का वैकल्पिक अंग्रेज़ी रूप जान पड़ती है और हिन्दी पाठ में अलग अर्थगत विकल्प नहीं देती, इसलिए उसे नहीं रखा गया; प्रयुक्त [a] क्रूस संबंधी आवश्यक सांस्कृतिक टिप्पणी से जुड़ा है।
