  text: τί γὰρ ⸀ὠφελεῖ ⸀ἄνθρωπον ⸂κερδῆσαι τὸν κόσμον ὅλον καὶ ζημιωθῆναι⸃ τὴν ψυχὴν αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/036.yaml
  text: For what does it profit a man to gain the whole world and forfeit his life?[a][b]
translation:
  language: hi
  text: क्योंकि किसी मनुष्य को सारे संसार को पा लेने पर भी अपना जीवन खो देने से क्या लाभ होगा?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी आत्मा।” यूनानी शब्द ψυχή का अर्थ प्रसंग के अनुसार “जीवन,” “आत्मा,” या “स्वयं व्यक्ति” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “किसी मनुष्य” यहाँ सामान्य रूप से किसी भी व्यक्ति को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: τί γὰρ
  choice: क्योंकि ... तो ... क्या
  rationale: γάρ पिछले कथन से व्याख्यात्मक संबंध जोड़ता है, और τί अलंकारिक प्रश्न प्रस्तुत करता है। हिन्दी की स्वाभाविक शर्तीय प्रश्न-रचना में दोनों का भाव सुरक्षित रहता है।
- source_word: ὠφελεῖ
  choice: क्या लाभ होगा
  rationale: यह लाभ या फायदा पहुँचने का अर्थ देता है और κερδῆσαι तथा ζημιωθῆναι के लाभ-हानि संबंधी रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄνθρωπον
  choice: कोई मनुष्य
  rationale: मूल यूनानी में एकवचन ἄνθρωπος यहाँ सामान्य अर्थ में किसी भी मानव को दर्शाता है। 'कोई मनुष्य' उसके प्रतिनिधिक और सार्वत्रिक प्रयोग को स्पष्ट रखता है।
- source_word: κερδῆσαι
  choice: पा ले
  rationale: इसका अर्थ प्राप्त करना या लाभ कमाना है। 'पा ले' पूरे संसार को हासिल करने की कल्पना को सहज हिन्दी में व्यक्त करता और लाभ-हानि के विरोध को बनाए रखता है।
- source_word: τὸν κόσμον ὅλον
  choice: सारे संसार को
  rationale: κόσμος के व्यापक अर्थ और ὅλον की समग्रता को यह स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: ζημιωθῆναι
  choice: खो दे
  rationale: मध्य/निष्क्रिय रूप हानि उठाने या किसी मूल्यवान वस्तु को गँवा देने का भाव देता है। 'खो दे' यहाँ पाने और खोने के तीखे विरोध को सरल हिन्दी में रखता है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपना जीवन
  rationale: मरकुस 8:35–37 में ψυχή जीवन, प्राण या स्वयं व्यक्ति की ओर संकेत कर सकता है। 'अपना जीवन' निकटवर्ती प्रसंग के विरोधाभास को स्पष्ट रखता है; 'प्राण' को पादटिप्पणी में वास्तविक विकल्प के रूप में दिया गया है।
theological_decisions:
- issue: शिष्यत्व-संबंधी कथन में ψυχή का जीवन/प्राण संबंधी अर्थ
  choice: अपना जीवन
  alternative: अपने प्राण
  rationale: निकटवर्ती प्रसंग में ψυχή उस जीवन को दर्शाता है जिसे कोई बचाना चाहे या यीशु और सुसमाचार के कारण खो दे। 'जीवन' प्रसंगगत संगति बनाए रखता है और किसी संकीर्ण मानवशास्त्रीय मत को आरोपित नहीं करता; 'प्राण' शब्द की पारंपरिक और धर्मवैचारिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शर्तीय रचना हिन्दी में अलंकारिक प्रश्न को स्वाभाविक बनाती है, जबकि 'पा ले/खो दे' मूल के लाभ-हानि संबंधी तनाव को स्पष्ट बनाए रखते हैं।
