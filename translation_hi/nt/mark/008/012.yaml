source:
  edition: SBLGNT
  text: καὶ ἀναστενάξας τῷ πνεύματι αὐτοῦ λέγει· Τί ἡ γενεὰ αὕτη ⸂ζητεῖ σημεῖον⸃; ἀμὴν λέγω ⸀ὑμῖν, εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/012.yaml
  text: And sighing deeply in his spirit[a], he says, “Why does this generation seek a sign? Truly I say to you, no sign will be given to this generation.”
translation:
  language: hi
  text: और अपने मन में गहरी आह भरकर वे कहते हैं, “यह पीढ़ी चिन्ह क्यों खोजती है? मैं तुमसे सच कहता हूँ, इस पीढ़ी को कोई चिन्ह नहीं दिया जाएगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “यदि इस पीढ़ी को कोई चिन्ह दिया जाएगा।” यह यूनानी में शपथ-सदृश अभिव्यक्ति है, जिसका अर्थ है कि कोई चिन्ह नहीं दिया जाएगा।'
    reason: मूल यूनानी की शपथ-सदृश संरचना और उसके नकारात्मक आशय को स्पष्ट करना।
lexical_decisions:
- source_word: ἀναστενάξας
  choice: गहरी आह भरकर
  rationale: यह ἀνα- से व्यक्त तीव्रता को स्वाभाविक आधुनिक हिन्दी में प्रकट करता है, बिना भाव को अनावश्यक रूप से बढ़ाए।
- source_word: τῷ πνεύματι αὐτοῦ
  choice: अपनी आत्मा में
  rationale: यह यूनानी के दायरे अथवा संबंध-सूचक भाव और उसकी मानव-स्वभाव संबंधी भाषा को बनाए रखता है; केवल ‘मन ही मन’ कहना अर्थ को मनोवैज्ञानिक अनुभूति तक सीमित कर देता।
- source_word: λέγει
  choice: वे कहते हैं
  rationale: वर्तमानकालीन ऐतिहासिक क्रिया को बनाए रखकर मरकुस की सजीव कथन-शैली सुरक्षित रखी गई है। हिन्दी में यीशु के लिए आदरसूचक बहुवचन स्वाभाविक और गरिमापूर्ण है।
- source_word: Τί
  choice: क्यों
  rationale: इस क्रियात्मक प्रयोग में τί कारण पूछता है; ‘क्यों’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: γενεὰ
  choice: पीढ़ी
  rationale: यह शब्द के सामूहिक और कालगत दोनों संकेतों को सुरक्षित रखता है।
- source_word: ζητεῖ
  choice: खोजती है
  rationale: यह ζητέω का सीधा समतुल्य है और ‘माँगती’ या ‘दावा करती’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यह प्रमाणित करने वाले अद्भुत कार्य के धार्मिक आशय को बनाए रखता है, पर मुख्य पाठ में ‘चमत्कारी’ जैसा अतिरिक्त विशेषण नहीं जोड़ता।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु के गंभीर और प्रामाणिक कथन-सूत्र की शक्ति को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰ δοθήσεται τῇ γενεᾷ ταύτῃ σημεῖον
  choice: इस पीढ़ी को कोई चिन्ह नहीं दिया जाएगा
  rationale: εἰ वाला वाक्यांश सामी शैली की शपथ-सदृश, अपूर्ण अभिव्यक्ति है जिसका आशय प्रबल निषेध है। स्पष्ट नकार हिन्दी पाठक तक उसका वास्तविक बल पहुँचाता है।
theological_decisions:
- issue: ἀμὴν λέγω ὑμῖν के बाद आने वाले शपथ-सदृश εἰ वाक्यांश का अनुवाद
  choice: 'इसे स्पष्ट और प्रबल निषेध के रूप में प्रस्तुत किया गया: ‘इस पीढ़ी को कोई चिन्ह नहीं दिया जाएगा।’'
  alternative: 'अत्यधिक शब्दशः पर अस्पष्ट रूप: ‘यदि इस पीढ़ी को कोई चिन्ह दिया जाएगा।’'
  rationale: यूनानी अभिव्यक्ति में शाप का परिणाम अनकहा छोड़ दिया गया है और उसका व्यावहारिक अर्थ दृढ़ निषेध है। मुख्य पाठ में नकार स्पष्ट करने से मूल आशय संप्रेषित होता है, जबकि पादटिप्पणी मूल संरचना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। यीशु के लिए स्वाभाविक आदरसूचक ‘वे’ का प्रयोग किया गया है। ऐतिहासिक वर्तमान को ‘कहते हैं’ से बनाए रखा गया है। पादटिप्पणी का चिह्न उसी निषेधात्मक वाक्य के बाद रखा गया है जिसकी वह व्याख्या करती है।
