  text: εἶτα πάλιν ⸀ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ, καὶ ⸂διέβλεψεν καὶ ἀπεκατέστη καὶ ἐνέβλεπεν⸃ τηλαυγῶς ⸀ἅπαντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/025.yaml
  text: Then again he laid his hands on his eyes[a], and he saw clearly and was restored[b], and he was seeing everything distinctly.
translation:
  language: hi
  text: फिर उसने उसकी आँखों पर अपने हाथ रखे[a]। तब उसने साफ़ देखा, उसकी दृष्टि बहाल हो गई, और वह सब कुछ स्पष्ट रूप से देख रहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों में ऐसी शब्दावली मिलती है जिसका अनुवाद इस प्रकार किया जा सकता है: ‘और उसने ध्यान से देखा, उसकी दृष्टि बहाल हो गई, और वह सब कुछ साफ़ देखने लगा।’'
    reason: textual_variant
  - marker: b
    text: या, ‘और वह सब कुछ साफ़ देख सकता था।’ अंतिम उपवाक्य में अपूर्ण भूतकाल की क्रिया के साथ स्पष्ट दृष्टि बताने वाला क्रियाविशेषण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶτα πάλιν
  choice: तब...फिर
  rationale: εἶτα क्रम को और πάλιν क्रिया की पुनरावृत्ति को व्यक्त करता है; हिन्दी में विभाजित रूप ‘तब...फिर’ स्वाभाविक रहते हुए दोनों अर्थ सुरक्षित रखता है।
- source_word: ἐπέθηκεν τὰς χεῖρας ἐπὶ τοὺς ὀφθαλμοὺς αὐτοῦ
  choice: उस मनुष्य की आँखों पर अपने हाथ रखे
  rationale: यह वाक्यांश हाथ रखने की ठोस शारीरिक क्रिया बताता है। ‘अपने’ से स्पष्ट होता है कि हाथ यीशु के हैं, और ‘उस मनुष्य’ से हिन्दी में संदर्भ सहज बनता है।
- source_word: διέβλεψεν
  choice: वह साफ़ देखने लगा
  rationale: διαβλέπω यहाँ स्पष्ट दृष्टि प्राप्त होने को दर्शाता है। ‘साफ़ देखने लगा’ चरणबद्ध चंगाई के संदर्भ में परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी अन्य पाठ-परंपरा के ‘ध्यान से देखा’ अर्थ को आयात किए।
- source_word: ἀπεκατέστη
  choice: उसकी दृष्टि बहाल हो गई
  rationale: ἀποκαθίστημι किसी वस्तु को उचित या पूर्व दशा में लौटाने का भाव देता है। हिन्दी में केवल ‘वह बहाल हो गया’ अस्पष्ट होता; ‘दृष्टि’ कथानक में निहित विषय को स्पष्ट करती है।
- source_word: ἐνέβλεπεν
  choice: वह...देख रहा था
  rationale: अपूर्ण भूतकाल रूप निरंतर या परिणामी अवस्था को दर्शाता है। ‘देख रहा था’ इस पक्ष को साधारण पूर्ण भूतकाल में समतल नहीं करता।
- source_word: τηλαυγῶς
  choice: स्पष्ट रूप से
  rationale: क्रियाविशेषण साफ़ और भेदपूर्ण दृष्टि का भाव देता है; सम्भावित दूर तक देखने की व्युत्पत्तिगत छाया को मुख्य पाठ में आवश्यकता से अधिक नहीं उभारा गया।
- source_word: ἅπαντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन यहाँ समग्रता के अर्थ में मुहावरेदार है; ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
theological_decisions:
- issue: दो चरणों में हुई चंगाई का कथात्मक चित्रण
  choice: 'क्रियाओं के क्रम तथा अंतिम अपूर्ण भूतकाल को अलग-अलग बनाए रखा गया: साफ़ देखने लगा, दृष्टि बहाल हुई, और देख रहा था।'
  alternative: सभी क्रियाओं को एक ही पूर्ण घटना बनाकर केवल ‘वह पूरी तरह चंगा होकर सब कुछ साफ़ देखने लगा’ कहना।
  rationale: यूनानी पाठ क्रमिक क्रियाएँ और अंत में imperfect ἐνέβλεπεν रखता है। अनुवाद इस प्रगति और परिणामी अवस्था को सुरक्षित रखता है तथा कथानक के तनाव की व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘साफ़’ और ‘स्पष्ट रूप से’ निकटार्थी होने पर भी दो अलग यूनानी पदों तथा उनकी क्रियात्मक भूमिकाओं को दर्शाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
