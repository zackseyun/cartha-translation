id: MRK.8.31
reference: Mark 8:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο διδάσκειν αὐτοὺς ὅτι δεῖ τὸν υἱὸν τοῦ ἀνθρώπου πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ⸀ὑπὸ τῶν πρεσβυτέρων καὶ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ ἀποκτανθῆναι καὶ μετὰ τρεῖς ἡμέρας ἀναστῆναι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/031.yaml
  text: And he began to teach them that the Son of Man must suffer many things[a], and be rejected by the elders and the chief priests and the scribes, and be killed, and after three days rise again.
translation:
  language: hi
  text: और वह उन्हें सिखाने लगा कि मनुष्य के पुत्र को बहुत दुःख सहना, पुरनियों, प्रधान याजकों और शास्त्रियों के द्वारा ठुकराया जाना, मार डाला जाना, और तीन दिन के बाद जी उठना अवश्य है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξατο διδάσκειν
  choice: सिखाने लगा
  rationale: आरम्भसूचक क्रिया और infinitive का यह स्वाभाविक हिन्दी रूप है तथा कथा में आए नए मोड़ को बनाए रखता है।
- source_word: δεῖ
  choice: अवश्य है
  rationale: यह कथन दुःख, अस्वीकृति, मृत्यु और पुनरुत्थान की प्रबल आवश्यकता व्यक्त करता है, पर उस आवश्यकता का आधार अनुवाद में अतिरिक्त रूप से नहीं समझाता।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह उपाधि का स्थापित, सीधा अनुवाद है और उसके बाइबिलीय अंतर्संबंध को सुरक्षित रखता है।
- source_word: πολλὰ παθεῖν
  choice: बहुत दुःख सहना
  rationale: πολλά यहाँ दुःख की व्यापकता और तीव्रता बताता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἀποδοκιμασθῆναι
  choice: ठुकराया जाना
  rationale: यह विचार-विमर्श या जाँच के बाद अस्वीकार किए जाने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τῶν πρεσβυτέρων
  choice: पुरनियों के द्वारा
  rationale: यह आयु में केवल वृद्ध पुरुषों के बजाय मान्य यहूदी नेतृत्व-समूह को सूचित करने वाला पारंपरिक ऐतिहासिक पद है।
- source_word: τῶν ἀρχιερέων
  choice: प्रधान याजकों
  rationale: बहुवचन में यह मुख्य याजकीय वर्ग या अगुआ याजकों को दर्शाता है, न कि एक ही समय में अनेक महायाजकों को।
- source_word: τῶν γραμματέων
  choice: शास्त्रियों
  rationale: यह ऐतिहासिक धार्मिक-कानूनी वर्ग के लिए मान्य और संक्षिप्त हिन्दी पद है।
- source_word: ἀποκτανθῆναι
  choice: मार डाला जाना
  rationale: यह यूनानी कर्मवाच्य का सीधा, स्पष्ट और गंभीर हिन्दी रूप है।
- source_word: μετὰ τρεῖς ἡμέρας
  choice: तीन दिन के बाद
  rationale: μετά के साथ accusative का स्पष्ट कालगत अर्थ ‘के बाद’ है; इसे समानांतर वचनों के ‘तीसरे दिन’ से नहीं मिलाया गया।
- source_word: ἀναστῆναι
  choice: जी उठना
  rationale: यूनानी रूप अकर्मक है; ‘जी उठना’ पुनरुत्थान के संदर्भ में स्वाभाविक हिन्दी है और इसे कर्मवाच्य ‘जिलाया जाना’ में नहीं बदलता।
theological_decisions:
- issue: δεῖ के साथ यीशु की दुःखभोग-वाणी
  choice: अवश्य है
  alternative: आवश्यक है
  rationale: यह ईश्वरीय आवश्यकता का भार बनाए रखता है, लेकिन उस आवश्यकता की कार्यप्रणाली या doctrinal व्याख्या पाठ में नहीं जोड़ता।
- issue: μετὰ τρεῖς ἡμέρας का कालगत अर्थ
  choice: तीन दिन के बाद
  alternative: तीसरे दिन
  rationale: मार्क के यूनानी पाठ की अपनी अभिव्यक्ति को सुरक्षित रखा गया है और समानांतर सुसमाचारों से सामंजस्य स्थापित करने के लिए इसे बदला नहीं गया।
- issue: ἀναστῆναι की voice
  choice: जी उठना
  alternative: जिलाया जाना
  rationale: मूल यूनानी infinitive अकर्मक है; अनुवाद उसी रूप को रखता है, बिना पुनरुत्थान के कर्तृत्व पर अतिरिक्त निर्णय आरोपित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरनियों’, ‘प्रधान याजकों’ और ‘शास्त्रियों’ जैसे पद ऐतिहासिक समूहों की पहचान सुरक्षित रखते हैं। वाक्य के अंत में ‘अवश्य है’ रखकर यूनानी δεῖ के अंतर्गत आने वाली पूरी श्रृंखला—दुःख सहना, ठुकराया जाना, मारा जाना और जी उठना—को एक साथ बाँधा गया है। अंग्रेज़ी परत में दिया गया footnote marker पाठ के ‘many things’ पर स्थानगत रूप से असंगत है और उसका नोट कालगत पद पर है; हिन्दी मुख्य पाठ स्वयं स्पष्ट रूप से ‘तीन दिन के बाद’ कहता है, इसलिए कोई अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
