  text: Καὶ ἐξῆλθον οἱ Φαρισαῖοι καὶ ἤρξαντο συζητεῖν αὐτῷ, ζητοῦντες παρ’ αὐτοῦ σημεῖον ἀπὸ τοῦ οὐρανοῦ, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/011.yaml
  text: And the Pharisees came out and began to argue with him[a], seeking from him a sign from heaven, testing him.
translation:
  language: hi
  text: और फरीसी बाहर आए और उनसे बहस करने लगे; वे उन्हें परखने के इरादे से उनसे स्वर्ग की ओर से एक चिन्ह[a] माँग रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आकाश की ओर से एक चिन्ह”; अधिक संभावना है कि इसका अर्थ स्वर्गीय, अर्थात ईश्वरीय स्रोत वाला चिन्ह है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: बाहर आए
  rationale: क्रिया के बाहर निकलकर दृश्य में आने के भाव को बिना स्थान का अनावश्यक अनुमान लगाए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤρξαντο συζητεῖν αὐτῷ
  choice: उनसे बहस करने लगे
  rationale: ἤρξαντο आरम्भ का भाव देता है और विरोधपूर्ण प्रसंग में συζητεῖν के लिए ‘बहस करने’ उपयुक्त है; αὐτῷ को सर्वनाम ‘उनसे’ के रूप में रखा गया है।
- source_word: ζητοῦντες παρ’ αὐτοῦ
  choice: उनसे … माँग रहे थे
  rationale: समकालिक कृदन्त और παρά के स्रोत-संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘माँगना’ यहाँ संकेत की चुनौतीपूर्ण माँग के अनुकूल है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यह केवल चमत्कार नहीं, प्रमाण या ईश्वरीय प्रामाणिकता दिखाने वाले संकेत का भाव रखता है।
- source_word: ἀπὸ τοῦ οὐρανοῦ
  choice: स्वर्ग की ओर से
  rationale: ἀπό के उद्गम-भाव को स्पष्ट करता है और इस प्रसंग में चिन्ह के स्वर्गीय अथवा ईश्वरीय स्रोत का अर्थ स्वाभाविक रूप से संप्रेषित करता है, जबकि मूल रूपक बना रहता है।
- source_word: πειράζοντες αὐτόν
  choice: उन्हें परखने के लिए
  rationale: यहाँ विरोधी उद्देश्य से परीक्षा लेने का भाव है, न कि पाप के लिए लुभाने का; उद्देश्यवाचक हिन्दी वाक्यांश कृदन्त का संबंध स्पष्ट करता है।
theological_decisions:
- issue: ‘स्वर्ग से’ माँगे गए चिन्ह का अर्थ
  choice: स्वर्गीय अर्थात ईश्वरीय स्रोत या प्रामाणिकता वाला चिन्ह
  alternative: आकाश से दिखाई देने वाला चिन्ह
  rationale: सुसमाचार के यहूदी धार्मिक संदर्भ में वाक्यांश मुख्यतः परमेश्वर की ओर से प्रमाणीकरण का संकेत देता है। फिर भी पादटिप्पणी भौतिक ‘आकाश’ की शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सम्मानसूचक बहुवचन सर्वनाम यीशु के लिए प्रयुक्त हैं। मुख्य पाठ में कारण और उद्देश्य का संबंध हिन्दी के स्वाभाविक क्रम में रखा गया है।
