  text: καὶ παρρησίᾳ τὸν λόγον ἐλάλει. καὶ προσλαβόμενος ⸂ὁ Πέτρος αὐτὸν⸃ ἤρξατο ἐπιτιμᾶν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/032.yaml
  text: And he was speaking the word openly[a]. And Peter took him aside and began to rebuke him.
translation:
  language: hi
  text: और वह यह बात साफ़-साफ़ कह रहा था।[a] पतरस उसे अलग ले जाकर डाँटने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खुलकर” अथवा “बेबाकी से।” यूनानी शब्द स्पष्ट, खुलकर और बिना लाग-लपेट के बोलने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρρησίᾳ
  choice: साफ़-साफ़
  rationale: यह शब्द खुलकर, स्पष्ट और बिना लाग-लपेट बोलने का भाव देता है। प्रसंग में यीशु द्वारा अपने दुःख और मृत्यु के विषय में स्पष्ट रूप से बताना प्रमुख है; इसलिए यह सहज आधुनिक हिन्दी में उपयुक्त है।
- source_word: τὸν λόγον
  choice: इस बात को
  rationale: यह पद पिछले वचन में कही गई यीशु की दुःखभोग संबंधी भविष्यवाणी की विषयवस्तु की ओर संकेत करता है। हिन्दी में ‘इस बात को’ संबंध स्पष्ट रखता है और ‘वचन को’ की संभावित कृत्रिमता से बचता है।
- source_word: ἐλάλει
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल चल रही क्रिया को व्यक्त करता है। ‘कह रहा था’ उस प्रगतिशील पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προσλαβόμενος
  choice: अलग ले गया
  rationale: प्रसंग में पतरस यीशु को अलग करके निजी तौर पर संबोधित करता है। यह अनुवाद कृदंत के प्रसंगगत आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: ἤρξατο ἐπιτιμᾶν αὐτῷ
  choice: उसे डाँटने लगा
  rationale: ἤρξατο और infinitive आरम्भ का भाव देते हैं, जबकि ἐπιτιμάω कड़ी झिड़की या डाँट को व्यक्त करता है। ‘डाँटने लगा’ संक्षिप्त, स्वाभाविक और बलयुक्त है।
theological_decisions:
- issue: यीशु के दुःखभोग संबंधी कथन में παρρησίᾳ का बल
  choice: साफ़-साफ़
  alternative: खुलकर; निडरता से
  rationale: यहाँ मुख्य बल कथन की स्पष्टता और बेबाकी पर है, जिससे पतरस की प्रतिक्रिया समझ में आती है। ‘निडरता से’ साहस के भाव को आवश्यकता से अधिक प्रमुख कर सकता है; पादटिप्पणी वास्तविक अर्थ-विस्तार को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘इस बात को’ पूर्ववर्ती भविष्यवाणी से स्पष्ट संबंध जोड़ता है, और ‘डाँटने लगा’ पतरस की तीखी प्रतिक्रिया को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
