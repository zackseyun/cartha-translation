id: MRK.8.38
reference: Mark 8:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς γὰρ ἐὰν ἐπαισχυνθῇ με καὶ τοὺς ἐμοὺς λόγους ἐν τῇ γενεᾷ ταύτῃ τῇ μοιχαλίδι καὶ ἁμαρτωλῷ, καὶ ὁ υἱὸς τοῦ ἀνθρώπου ἐπαισχυνθήσεται αὐτὸν ὅταν ἔλθῃ ἐν τῇ δόξῃ τοῦ πατρὸς αὐτοῦ μετὰ τῶν ἀγγέλων τῶν ἁγίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/038.yaml
  text: For whoever is ashamed of me and of my words in this adulterous and sinful generation[a], the Son of Man will also be ashamed of him when he comes in the glory of his Father with the holy angels.
translation:
  language: hi
  text: क्योंकि जो कोई इस व्यभिचारी[a] और पापी पीढ़ी में मुझसे और मेरी बातों से लज्जित होगा, मनुष्य का पुत्र भी उससे लज्जित होगा, जब वह पवित्र स्वर्गदूतों के साथ अपने पिता की महिमा में आएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘व्यभिचारी’ का अर्थ यहाँ ‘अविश्वासी’ या ‘वाचा के प्रति अविश्वासी’ भी समझा जा सकता है। यूनानी में यह भविष्यद्वक्ताओं की ठोस रूपक-भाषा है, जिसमें व्यभिचार परमेश्वर के प्रति अविश्वासयोग्यता का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπαισχυνθῇ / ἐπαισχυνθήσεται
  choice: लजाएगा / लजाएगा
  rationale: ‘से लजाना’ व्यक्ति या उसकी बातों के कारण लज्जा अनुभव करने और उनसे सार्वजनिक रूप से जुड़ने में संकोच का सीधा, स्वाभाविक हिन्दी रूप है। दोनों प्रयोगों में एक ही क्रिया रखकर वर्तमान मानवीय प्रतिक्रिया और भावी प्रत्युत्तर की पारस्परिकता सुरक्षित रहती है।
- source_word: λόγους
  choice: बातों
  rationale: बहुवचन ‘बातों’ यूनानी बहुवचन को बनाए रखता है और हिन्दी में ‘मेरी बातों’ के रूप में स्वाभाविक है; ‘संदेश’ अर्थ को एक सामूहिक संज्ञा में बदल देता।
- source_word: γενεᾷ
  choice: पीढ़ी
  rationale: ‘पीढ़ी’ वर्तमान समय के लोगों और उनके नैतिक-सामाजिक परिवेश दोनों की ओर संकेत कर सकती है और γενεά का प्रचलित समतुल्य है।
- source_word: μοιχαλίδι
  choice: व्यभिचारी
  rationale: यह यूनानी के ठोस व्यभिचार-संबंधी रूपक को सुरक्षित रखता है, जो भविष्यद्वक्ताओं की भाषा में परमेश्वर के प्रति विश्वासघात का संकेत भी दे सकता है।
- source_word: ἁμαρτωλῷ
  choice: पापी
  rationale: ‘पापी’ विशेषण का सीधा और सुबोध समतुल्य है तथा ‘व्यभिचारी’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: स्थापित मसीही उपाधि और उसके दानिय्येली तथा अंतकालीन संकेतों को सुरक्षित रखता है; इसे ‘मैं’ या ‘मसीह’ कहना मूल की विशिष्ट उपाधि को मिटा देता।
- source_word: δόξῃ
  choice: महिमा
  rationale: ‘महिमा’ ईश्वरीय आदर, तेज और गौरव के व्यापक बाइबलीय अर्थ को बनाए रखने वाला मानक हिन्दी रूप है।
- source_word: μετὰ τῶν ἀγγέλων τῶν ἁγίων
  choice: पवित्र स्वर्गदूतों के साथ
  rationale: यह विशेषणात्मक यूनानी संरचना का स्वाभाविक हिन्दी रूप है। मूल में स्वामित्वसूचक सर्वनाम नहीं है, इसलिए ‘अपने पवित्र स्वर्गदूतों’ नहीं जोड़ा गया।
- source_word: ὃς γὰρ ἐὰν
  choice: क्योंकि जो कोई
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को और ‘जो कोई’ सामान्य शर्त के व्यापक, अनिश्चित संदर्भ को व्यक्त करता है।
- source_word: ἐν τῇ γενεᾷ ταύτῃ
  choice: इस ... पीढ़ी में
  rationale: यह उस सामाजिक और नैतिक परिवेश को स्वाभाविक हिन्दी में व्यक्त करता है जिसमें लजाने की क्रिया घटित होती है।
theological_decisions:
- issue: ‘व्यभिचारी’ का रूपकात्मक बल
  choice: मुख्य पाठ में ‘व्यभिचारी’ रखा गया है, और पादटिप्पणी में ‘विश्वासघाती’ का अर्थ बताया गया है।
  alternative: मुख्य पाठ में ‘विश्वासघाती’
  rationale: यूनानी μοιχαλίδι भविष्यद्वक्ताओं की ठोस वैवाहिक रूपक-भाषा को प्रतिध्वनित करता है। उसे बनाए रखने से वाचा-संबंधी और नैतिक दोनों आयाम खुले रहते हैं।
- issue: ‘मनुष्य का पुत्र’ का संदर्भ
  choice: विशिष्ट उपाधि ‘मनुष्य का पुत्र’ सुरक्षित रखी गई है।
  alternative: ‘मैं’ अथवा ‘मसीह’
  rationale: मूल पाठ स्वयं-संदर्भ को एक विशिष्ट मसीही और अंतकालीन उपाधि द्वारा व्यक्त करता है। प्रतिस्थापन उस संकेत और पाठ की धार्मिक गहराई को घटा देता।
- issue: αὐτόν का सामान्य एकवचन संदर्भ
  choice: ‘उससे’
  alternative: ‘उनसे’
  rationale: ‘जो कोई ... उससे’ हिन्दी में स्वाभाविक सामान्य एकवचन है और यूनानी की एकवचन संरचना को बनाए रखता है, बिना अनावश्यक रूप से लिंग को उभारने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘बातों’, ‘लजाएगा’ और ‘पीढ़ी’ सहज हिन्दी रखते हैं; ‘मनुष्य का पुत्र’ तथा ‘महिमा’ जैसी स्थापित बाइबलीय अभिव्यक्तियाँ धार्मिक और अंतर्पाठीय अर्थ सुरक्षित रखती हैं। पादटिप्पणी-चिह्न [a] उसी पदांश के तुरंत बाद रखा गया है जिसे वह स्पष्ट करता है।
