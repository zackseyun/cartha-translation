  naturalness: The sentence is clear, but ‘मुझसे ... लजाएगा’ and ‘उससे लजाएगा’ can suggest shyness rather than shame. ‘मुझसे और मेरी बातों से लज्जित होगा’ is natural, dignified modern Hindi and retains the reciprocal wording. The footnote marker should attach to ‘व्यभिचारी’ (or the immediately relevant phrase), rather than the end of the verse.
  terminology: ‘व्यभिचारी,’ ‘पापी,’ ‘पीढ़ी,’ ‘मनुष्य का पुत्र,’ ‘महिमा,’ and ‘पवित्र स्वर्गदूत’ are appropriate established terms. The footnote’s ‘विश्वासघाती’ is a possible explanatory paraphrase but is somewhat stronger and more personal than the metaphor’s basic sense of unfaithfulness; wording it as covenantal unfaithfulness avoids overstatement.
  issues:
  - severity: medium
    issue: The rendering ‘लजाएगा’ is semantically less precise in this reciprocal shame saying.
    rationale: ἐπαισχύνομαι means ‘be ashamed of,’ not merely be shy or reticent before. ‘लज्जित होगा’ directly represents the source and works idiomatically with both ‘मुझसे’ and ‘उससे।’
  - severity: low
    issue: The footnote anchor is placed at the end of the verse instead of at the expression it explains.
    rationale: The note addresses μοιχαλίδι (‘व्यभिचारी’), so its anchor should follow that word or the adjective phrase.
  - severity: low
    issue: The footnote explanation can state the prophetic metaphor without making ‘विश्वासघाती’ appear to be a complete lexical equivalent.
    rationale: The metaphor conveys covenantal unfaithfulness; ‘विश्वासघाती’ may imply a more specific act of betrayal than the Greek adjective itself requires.
