  yaml_path: translation/nt/mark/008/030.yaml
  text: And he warned them to tell no one about him[a].
translation:
  language: hi
  text: और उसने उन्हें कड़ी चेतावनी दी कि वे किसी को उसके विषय में न बताएं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसने उन्हें डाँटा”; अथवा “उसने उन्हें कड़ा आदेश दिया।”
    reason: ἐπετίμησεν के अर्थ-क्षेत्र में डाँटना, कड़ी चेतावनी देना और दृढ़ आदेश देना शामिल हो सकते हैं।
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: कड़ी चेतावनी दी
  rationale: ἐπιτιμάω का सामान्य अर्थ ‘डाँटना’ भी हो सकता है, पर यहाँ यह किसी बात को प्रकट न करने के लिए दिए गए गंभीर और दृढ़ निर्देश को व्यक्त करता है। ‘कड़ी चेतावनी दी’ प्रसंगानुकूल स्वाभाविक हिन्दी है और क्रिया की प्रबलता बनाए रखती है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह बहुवचन संप्रदानवाचक सर्वनाम निकटवर्ती प्रसंग के शिष्यों की ओर संकेत करता है।
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: कि वे ... किसी से कुछ न कहें
  rationale: आदेश या चेतावनी बताने वाली क्रिया के बाद ἵνα और विधिलिंग यहाँ निर्देश की विषयवस्तु व्यक्त करते हैं। यह हिन्दी रचना निषेध को स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करती है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί के साथ संबंधकारक का अर्थ ‘उसके विषय में’ या ‘उसके बारे में’ है। चुना गया रूप गरिमापूर्ण, स्पष्ट और अर्थ की व्यापकता को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के निषेध की प्रबलता और तथाकथित मसीही गोपनीयता
  choice: किसी से उसके विषय में कुछ न कहने की कड़ी चेतावनी के रूप में प्रस्तुत किया गया है।
  alternative: ‘उन्हें डाँटा’ या ‘उन्हें कड़ा आदेश दिया’ के रूप में अनुवाद किया जा सकता है।
  rationale: मूल पाठ का निषेध स्पष्ट और प्रबल है, पर वह यहाँ इस गोपनीयता का कारण नहीं बताता। इसलिए अनुवाद आदेश की गंभीरता बनाए रखता है, बिना किसी व्यापक धर्मवैज्ञानिक सिद्धांत को पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठकों के लिए स्पष्ट, स्वाभाविक और गरिमापूर्ण शैली। ‘उसके विषय में’ मूल की संदर्भगत व्यापकता बनाए रखता है और केवल ‘उसकी पहचान’ जैसा व्याख्यात्मक विस्तार नहीं जोड़ता।
