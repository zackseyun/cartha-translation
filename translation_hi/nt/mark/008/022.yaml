  yaml_path: translation/nt/mark/008/022.yaml
  text: And they came to Bethsaida. And they brought a blind man to him and begged him to touch him.
translation:
  language: hi
  text: और वे बैतसैदा आए। और वे एक अंधे आदमी को यीशु के पास लाए और उनसे विनती की कि वे उसे छूएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχονται
  choice: आए
  rationale: यूनानी में यह ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथा में भूतकाल घटना-क्रम को स्पष्ट रखता है।
- source_word: εἰς Βηθσαϊδάν
  choice: बैतसैदा आए
  rationale: εἰς यहाँ गंतव्य बताता है। बैतसैदा स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: φέρουσιν
  choice: लाए
  rationale: ऐतिहासिक वर्तमान को हिन्दी में भूतकाल में रखा गया है। ‘लाए’ क्रिया के व्यापक अर्थ को बनाए रखता है और यह नहीं जोड़ता कि उसे उठाकर लाया गया था।
- source_word: τυφλὸν
  choice: एक अंधे आदमी को
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त पुल्लिंग एकवचन है; ‘अंधे आदमी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: παρακαλοῦσιν
  choice: विनती की
  rationale: यह साधारण अनुरोध से अधिक आग्रहपूर्ण निवेदन व्यक्त करता है; ‘विनती की’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: ἵνα αὐτοῦ ἅψηται
  choice: कि वे उसे छूएँ
  rationale: ἵνα और विधिलिंग अनुरोध की विषय-वस्तु बताते हैं। ‘छूएँ’ ἅπτομαι का सीधा अर्थ देता है; आदरसूचक बहुवचन हिन्दी में यीशु के लिए स्वाभाविक है।
- source_word: καὶ
  choice: और
  rationale: आरंभिक καί को ‘और’ से रखा गया है ताकि मरकुस की संयोजक कथा-शैली बनी रहे; दूसरे καί के स्थान पर नया स्पष्ट कर्ता आने से हिन्दी में अनावश्यक पुनरावृत्ति टाली गई है।
- source_word: αὐτῷ / αὐτόν
  choice: यीशु के पास / उनसे
  rationale: यूनानी सर्वनामों का संदर्भ पिछले प्रसंग से यीशु है। स्वतंत्र पद के रूप में हिन्दी में अस्पष्ट ‘उसके पास’ से बचने के लिए नाम स्पष्ट किया गया है और फिर आदरसूचक सर्वनाम रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथा-शैली। यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी भूतकाल में प्रस्तुत किया गया है। यीशु के लिए आदरसूचक बहुवचन का प्रयोग किया गया है; इससे मूल के एकवचन संदर्भ में कोई अर्थगत परिवर्तन नहीं होता।
