  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य का क्रम यूनानी के निकट है, पर हिन्दी की स्वाभाविकता बनाए रखता है। ‘निढाल हो जाएँगे’ मूल क्रिया की कमजोरी से लेकर संभावित रूप से गिर पड़ने तक की अर्थ-सीमा को बिना अनावश्यक रूप से निश्चित किए व्यक्त करता है।
