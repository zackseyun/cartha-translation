  verdict: revise
  source_fidelity: The draft accurately conveys the conditional sending away, the state of being without food, the risk of becoming physically spent on the journey, and the statement that some have come from far away. However, “भूखा ही” is singular and adds the emphatic particle “ही,” neither of which is warranted by νήστεις; the plural “भूखे” directly and naturally agrees with “उन्हें.”
  naturalness: The sentence is otherwise clear, modern, and appropriately dignified. “उन्हें भूखे उनके घर भेज दूँ” is idiomatic Hindi and avoids the unnecessary emphasis created by “भूखा ही.” “निढाल हो जाएँगे” is a suitably broad rendering of ἐκλυθήσονται.
  terminology: “भूखे,” “उनके घर,” “रास्ते में,” “निढाल हो जाएँगे,” and “बहुत दूर से आए हैं” are accurate, natural choices. The footnote appropriately preserves alternatives for the physical-exhaustion verb without making one alternative the sole meaning.
  issues:
  - severity: low
    issue: “भूखा ही” is singular and includes unwarranted emphasis.
    rationale: νήστεις modifies the plural object αὐτούς and means that they are without food/hungry. Hindi “भूखे” is the normal plural agreement; “ही” adds an emphasis not present in the Greek.
