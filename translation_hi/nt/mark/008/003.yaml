base_translation:
  language: en
  yaml_path: translation/nt/mark/008/003.yaml
  text: And if I send them away hungry to their homes[a], they will collapse on the way, and some of them have come from far away.
translation:
  language: hi
  text: और यदि मैं उन्हें भूखे उनके घर भेज दूँ, तो वे रास्ते में निढाल हो जाएँगे[a]; और उनमें से कुछ बहुत दूर से आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रास्ते में कमजोर पड़ जाएँगे” या “गिर पड़ेंगे।” यूनानी क्रिया थककर इतना कमजोर हो जाने का भाव दे सकती है कि व्यक्ति गिर पड़े।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολύσω
  choice: भेज दूँ
  rationale: भोजन कराने के प्रसंग में इसका अर्थ भीड़ को विदा कर देना है; ‘भेज दूँ’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: νήστεις
  choice: भूखा ही
  rationale: यहाँ शब्द धार्मिक उपवास के बजाय बिना भोजन किए होने की अवस्था बताता है; एकवचन विशेषण समूह के प्रत्येक व्यक्ति पर लागू होता है।
- source_word: εἰς οἶκον αὐτῶν
  choice: उनके घर
  rationale: यह वितरणात्मक अर्थ देता है—हर व्यक्ति अपने घर जाए; हिन्दी में ‘उनके घर’ स्वाभाविक है।
- source_word: ἐκλυθήσονται
  choice: निढाल हो जाएँगे
  rationale: क्रिया थककर कमजोर पड़ जाने या गिर पड़ने तक की शारीरिक शिथिलता व्यक्त कर सकती है; ‘निढाल हो जाएँगे’ अर्थ की व्यापकता को बनाए रखता है।
- source_word: ἐν τῇ ὁδῷ
  choice: रास्ते में
  rationale: यात्रा के दौरान होने वाली बात के लिए यह स्पष्ट और स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: καί τινες αὐτῶν
  choice: और उनमें से कुछ
  rationale: यह यूनानी समुच्चय और भीड़ के एक हिस्से—दोनों को सीधे बनाए रखता है।
- source_word: ἀπὸ μακρόθεν
  choice: बहुत दूर से
  rationale: प्रसंग में लोगों द्वारा तय की गई लंबी दूरी अभिप्रेत है; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἥκασιν
  choice: आए हैं
  rationale: पूर्णकालिक रूप उनके दूर से आकर अब वहाँ उपस्थित होने की अवस्था पर बल देता है; हिन्दी पूर्ण भूतकाल इसे स्वाभाविक ढंग से व्यक्त करता है।
