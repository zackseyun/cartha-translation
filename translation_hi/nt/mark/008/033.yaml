source:
  edition: SBLGNT
  text: ὁ δὲ ἐπιστραφεὶς καὶ ἰδὼν τοὺς μαθητὰς αὐτοῦ ἐπετίμησεν ⸀Πέτρῳ ⸂καὶ λέγει⸃· Ὕπαγε ὀπίσω μου, Σατανᾶ, ὅτι οὐ φρονεῖς τὰ τοῦ θεοῦ ἀλλὰ τὰ τῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/033.yaml
  text: But turning around and seeing his disciples[a], he rebuked Peter and said, “Get behind me, Satan, because you are not setting your mind on the things of God, but on the things of men.”
translation:
  language: hi
  text: पर यीशु ने मुड़कर अपने चेलों को देखा और पतरस को डाँटकर कहा, “मेरे पीछे हो जा, शैतान! क्योंकि तू परमेश्वर की बातों पर नहीं, बल्कि मनुष्यों की बातों पर ध्यान देता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστραφεὶς
  choice: मुड़कर
  rationale: यह यीशु के शारीरिक रूप से मुड़ने को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ἰδὼν τοὺς μαθητὰς αὐτοῦ
  choice: अपने चेलों की ओर देखा
  rationale: ἰδών के देखने के भाव और चेलों की ओर यीशु के ध्यान को स्वाभाविक हिन्दी में रखता है; μαθητής के लिए ‘चेला’ सुसमाचारों में प्रचलित और आम पाठकों के लिए बोधगम्य है।
- source_word: ἐπετίμησεν
  choice: डाँटकर
  rationale: क्रिया की कड़ी मौखिक फटकार का बल बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: καὶ λέγει
  choice: कहा
  rationale: λέγει यहाँ ऐतिहासिक वर्तमान है; हिन्दी कथन-शैली में भूतकाल ‘कहा’ प्रसंग के क्रम को स्वाभाविक बनाता है।
- source_word: Ὕπαγε ὀπίσω μου
  choice: मेरे पीछे हट जा
  rationale: आदेश की तीव्रता और ὀπίσω μου के स्थानगत ‘मेरे पीछे’ दोनों को रखता है; इसे केवल ‘दूर हो जा’ बनाकर पीछे होने की छवि नहीं मिटाई गई।
- source_word: Σατανᾶ
  choice: शैतान
  rationale: यह सम्बोधन के रूप में प्रयुक्त पारंपरिक नाम/उपाधि है; केवल ‘विरोधी’ करने से इस प्रसंग का व्यक्तिगत और धर्मवैचारिक तनाव कम हो सकता है।
- source_word: φρονεῖς
  choice: मन लगाता है
  rationale: यह केवल विचार करने के बजाय मानसिक रुझान, चिंता और अभिमुखता का व्यापक भाव व्यक्त करता है।
- source_word: τὰ τοῦ θεοῦ
  choice: परमेश्वर की बातें
  rationale: यूनानी पद की व्यापकता बनाए रखता है और उसे केवल योजनाओं, हितों या चिंताओं तक सीमित नहीं करता।
- source_word: τὰ τῶν ἀνθρώπων
  choice: मनुष्यों की बातें
  rationale: ἄνθρωποι यहाँ समस्त मानवजाति के लिए सामान्य अर्थ में है; ‘मनुष्यों’ से वह अर्थ स्पष्ट रहता है और परमेश्वर के साथ मूल विरोध भी सुरक्षित रहता है।
theological_decisions:
- issue: पतरस को ‘शैतान’ कहकर सम्बोधित करने का आशय
  choice: वचन में यीशु पतरस को सीधे ‘शैतान’ कहकर सम्बोधित करते हैं, पर अनुवाद यह अतिरिक्त निष्कर्ष नहीं जोड़ता कि पतरस स्वयं अक्षरशः शैतान है।
  alternative: यीशु पतरस के पीछे उपस्थित शैतान को सम्बोधित कर रहे हैं; अथवा ‘शैतान’ का अर्थ यहाँ केवल ‘विरोधी’ है।
  rationale: ἐπετίμησεν Πέτρῳ स्पष्ट रूप से पतरस को फटकार का लक्ष्य बताता है और उसके बाद सीधा सम्बोधन आता है। अनुवाद कथन की तीक्ष्णता रखता है, पर उसकी आध्यात्मिक कार्यप्रणाली की व्याख्या नहीं जोड़ता।
- issue: ‘परमेश्वर की बातें’ और ‘मनुष्यों की बातें’ का विरोध
  choice: दोनों व्यापक पदों को समानांतर रूप में रखा गया है।
  alternative: ‘परमेश्वर के हित’ और ‘मनुष्यों के हित’ अथवा ‘परमेश्वर की चिंताएँ’ और ‘मानवीय चिंताएँ’।
  rationale: मूल के नपुंसकलिंग बहुवचन पद व्यापक हैं। ‘बातें’ उस खुलेपन को सुरक्षित रखता है और अर्थ को किसी एक प्रकार के हित या योजना तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चेलों’, ‘डाँटकर’, और ‘मन लगाता है’ जैसे शब्द बोलचाल में समझ आने वाले हैं, फिर भी कथन की गंभीरता बनाए रखते हैं। ‘मनुष्यों’ से यूनानी ἀνθρώπων का सार्वमानवीय अर्थ बिना किसी अतिरिक्त टिप्पणी के स्पष्ट हो जाता है।
