  yaml_path: translation/nt/mark/008/018.yaml
  text: Having eyes[a], do you not see? And having ears, do you not hear? And do you not remember?
translation:
  language: hi
  text: आँखें होते हुए भी[a] क्या तुम देखते नहीं? और कान होते हुए भी क्या तुम सुनते नहीं? और क्या तुम्हें याद नहीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आँखें होने पर भी क्या तुम पहचानते नहीं? और कान होने पर भी क्या तुम समझते नहीं?” यूनानी में सामान्य क्रियाएँ “देखना” और “सुनना” प्रयुक्त हुई हैं, जो इस प्रसंग में आत्मिक रूप से पहचानने और समझने का संकेत भी दे सकती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀφθαλμοὺς ἔχοντες
  choice: आँखें होते हुए भी
  rationale: यूनानी कृदन्तीय रचना को प्रसंगानुसार रियायती अर्थ में व्यक्त किया गया है। ‘होते हुए भी’ यीशु के आलंकारिक प्रश्न और उलाहने को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: βλέπετε
  choice: देखते
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ है। मुख्य पाठ में इसी ठोस क्रिया को रखकर उसके प्रसंगगत आत्मिक बोध के संकेत को खुला छोड़ा गया है।
- source_word: ὦτα ἔχοντες
  choice: कान होते हुए भी
  rationale: पहले कृदन्तीय वाक्यांश के समानांतर संरचना बनाए रखते हुए इसे उसी प्रकार रियायती भाव में अनूदित किया गया है।
- source_word: ἀκούετε
  choice: सुनते
  rationale: मूल क्रिया का सीधा अर्थ ‘सुनना’ है। ‘समझते’ या ‘ध्यान देते’ कहने से निहित अर्थ स्पष्ट तो होता, पर मूल की ठोस और बहुअर्थी भाषा सीमित हो जाती।
- source_word: μνημονεύετε
  choice: तुम्हें याद
  rationale: ‘क्या तुम्हें याद नहीं?’ आधुनिक हिन्दी में ‘क्या तुम याद नहीं करते?’ की अपेक्षा अधिक स्वाभाविक है और पिछले अनुभवों को स्मरण न रखने के उलाहने को स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: हर अगले प्रश्न को जोड़ते हुए मूल की संचयी और समानांतर लय बनाए रखता है।
- source_word: οὐ / οὐκ
  choice: नहीं
  rationale: तीनों आलंकारिक प्रश्नों की सामान्य नकारात्मकता को स्वाभाविक हिन्दी प्रश्न-रचना में व्यक्त करता है।
theological_decisions:
- issue: देखने और सुनने का शारीरिक अथवा आत्मिक-बोध संबंधी अर्थ
  choice: मुख्य पाठ में ‘देखते’ और ‘सुनते’ जैसी सामान्य इन्द्रियबोधक क्रियाएँ रखी गई हैं, ताकि प्रसंग आत्मिक जड़ता का गहरा आशय प्रकट करे।
  alternative: ‘पहचानते’ और ‘समझते’ द्वारा लाक्षणिक अर्थ को मुख्य पाठ में स्पष्ट करना।
  rationale: यूनानी पाठ सामान्यतः देखने और सुनने वाली क्रियाओं का प्रयोग करता है, जबकि प्रसंग उनसे आत्मिक ग्रहणशीलता का संकेत देता है। ठोस शब्दावली बनाए रखने से भविष्यद्वक्ताओं की भाषा की प्रतिध्वनि और मूल का अर्थगत तनाव दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। समानांतर प्रश्न-रचना मूल के तीखे आलंकारिक उलाहने को बनाए रखती है; ‘होते हुए भी’ हिन्दी में कृदन्तों के रियायती भाव को स्वाभाविक ढंग से व्यक्त करता है।
