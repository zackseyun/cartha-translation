    reason: textual_variant
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेज दिया
  rationale: यहाँ क्रिया यीशु द्वारा उस व्यक्ति को वहाँ से उसके घर भेजने को व्यक्त करती है। ‘भेज दिया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग से अधिक कोई उद्देश्य नहीं जोड़ता।
- source_word: εἰς οἶκον αὐτοῦ
  choice: उसके घर
  rationale: शाब्दिक दिशा-बोध को स्वाभाविक हिन्दी में ‘उसके घर’ से व्यक्त किया गया है; इससे उसके अपने निवास की ओर लौटने का भाव बना रहता है।
- source_word: λέγων
  choice: और कहा
  rationale: यूनानी वर्तमान कृदंत मुख्य क्रिया के साथ जुड़ी हुई वाणी का परिचय देता है। हिन्दी कथा-शैली में ‘और कहा’ इसका सहज और स्पष्ट रूप है।
- source_word: Μηδὲ
  choice: भी मत
  rationale: μηδέ निषेध पर बल देता है। ‘जाना भी मत’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है कि गाँव में प्रवेश तक न किया जाए।
- source_word: κώμην
  choice: गाँव
  rationale: κώμη सामान्यतः छोटी बस्ती या गाँव को दर्शाता है; ‘गाँव’ इसका सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: εἰσέλθῃς
  choice: जाना
  rationale: εἰς के साथ यह क्रिया भीतर प्रवेश करने का अर्थ देती है। हिन्दी में ‘गाँव में जाना’ सहज है और निषेध में प्रवेश का आशय स्पष्ट रखता है।
theological_decisions:
- issue: गाँव के विषय में यीशु की मनाही का दायरा
  choice: आज्ञा को केवल गाँव में न जाने की स्पष्ट मनाही के रूप में रखा गया है।
  alternative: कुछ पांडुलिपियाँ गाँव में किसी को न बताने की मनाही भी जोड़ती हैं।
  rationale: SBLGNT के मुख्य पाठ में केवल गाँव में प्रवेश न करने की मनाही है। इसलिए विस्तृत पाठ को मुख्य वाक्य में नहीं मिलाया गया, बल्कि पाठांतर के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। ‘तब’ प्रसंगगत क्रम को स्वाभाविक बनाता है; प्रत्यक्ष कथन में ‘जाना भी मत’ निषेध के बल को सामान्य पाठक के लिए स्पष्ट रखता है।
