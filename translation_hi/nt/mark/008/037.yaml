lexical_decisions:
- source_word: τί γὰρ
  choice: क्योंकि ... क्या
  rationale: τί प्रश्नवाचक ‘क्या’ है और γάρ पिछले कथन से कारणात्मक/व्याख्यात्मक संबंध जोड़ता है; हिन्दी में ‘क्योंकि’ और प्रश्न की यह रचना दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: δοῖ
  choice: दे सकता है
  rationale: δίδωμι का यह aorist subjunctive आलंकारिक प्रश्न में व्यावहारिक संभावना को सामने रखता है; ‘दे सकता है’ आधुनिक हिन्दी में प्रश्न का बल स्पष्ट करता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ ἄνθρωπος प्रतिनिधिक और सामान्य अर्थ में है। ‘मनुष्य’ स्रोत के एकवचन रूप को रखते हुए स्त्री-पुरुष दोनों के लिए लागू सामान्य अर्थ देता है।
- source_word: ἀντάλλαγμα
  choice: के बदले
  rationale: यह संज्ञा बदले में दी जाने वाली वस्तु या कीमत को सूचित करती है। ‘के बदले’ हिन्दी में ‘देना’ के साथ इसका सहज और सटीक रूप है।
- source_word: τῆς ψυχῆς αὐτοῦ
  choice: अपने जीवन
  rationale: निकटवर्ती संदर्भ में ψυχή जीवन के साथ पूरे व्यक्तित्व/स्व को भी समेटती है। ‘अपने जीवन’ स्पष्ट और संदर्भानुकूल है, जबकि व्यापक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: उद्धार-संबंधी कथन में ψυχή का अनुवाद
  choice: जीवन
  alternative: प्राण; आत्मा; स्वयं
  rationale: मरकुस 8:35–37 में ψυχή सांसारिक जीवन से जुड़ी है, पर केवल जैविक जीवन तक सीमित नहीं; इसमें व्यक्ति का पूरा अस्तित्व निहित है। मुख्य पाठ में ‘जीवन’ संदर्भगत प्रवाह बनाए रखता है और पादटिप्पणी इसकी वास्तविक अर्थ-व्याप्ति को बिना किसी एक धर्मवैज्ञानिक अर्थ पर सीमित किए सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। आलंकारिक प्रश्न की तीव्रता तथा पिछले पद से γάρ का संबंध बनाए रखा गया है; ‘मनुष्य’ सामान्य मानव-संदर्भ में प्रयुक्त है।
