  yaml_path: translation/nt/mark/008/016.yaml
  text: And they were discussing with one another that they had no bread[a].
translation:
  language: hi
  text: और वे आपस में चर्चा कर रहे थे कि उनके पास रोटियाँ नहीं हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζοντο
  choice: चर्चा करने लगे
  rationale: अपूर्ण काल चल रही पारस्परिक बातचीत को दर्शाता है। प्रसंग में स्वाभाविक हिन्दी के लिए ‘चर्चा करने लगे’ चुना गया है; ‘विचार-विमर्श कर रहे थे’ भी संभव है, पर अधिक औपचारिक है।
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: यह पारस्परिक अभिव्यक्ति है; ‘आपस में’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ὅτι
  choice: कि
  rationale: यह उनकी चर्चा की विषय-वस्तु का परिचय देता है, कारण का नहीं; इसलिए ‘कि’ उपयुक्त है, ‘क्योंकि’ नहीं।
- source_word: ἄρτους
  choice: रोटी
  rationale: यूनानी बहुवचन का शाब्दिक अर्थ ‘रोटियाँ’ है, किंतु हिन्दी में भोजन-सामग्री के सामान्य अर्थ में एकवचन भाववाचक ‘रोटी’ अधिक स्वाभाविक है। निकटवर्ती प्रसंग में रोटियों की गिनती महत्त्वपूर्ण होने पर भी यहाँ अर्थ नहीं खोता।
- source_word: οὐκ ἔχουσιν
  choice: उनके पास ... नहीं है
  rationale: मूल में अप्रत्यक्ष कथन के भीतर वर्तमान काल है। हिन्दी में इसे वर्तमान रूप में रखना स्वाभाविक है और यूनानी काल को अनावश्यक रूप से भूतकाल में नहीं बदलता।
