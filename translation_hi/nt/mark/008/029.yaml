  text: καὶ αὐτὸς ⸂ἐπηρώτα αὐτούς⸃· Ὑμεῖς δὲ τίνα με λέγετε εἶναι; ⸀ἀποκριθεὶς ὁ Πέτρος λέγει αὐτῷ· Σὺ εἶ ὁ χριστός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/029.yaml
  text: And he was asking them[a], “But who do you say that I am?” Peter answered him, “You are the Messiah.”
translation:
  language: hi
  text: और वह उनसे पूछ रहा था, “लेकिन तुम क्या कहते हो—मैं कौन हूँ?” पतरस ने उसे उत्तर दिया, “आप मसीह[a] हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।”
    reason: χριστός के पारंपरिक वैकल्पिक रूप को बिना अतिरिक्त व्याख्यात्मक अर्थ जोड़े दर्शाने के लिए।
lexical_decisions:
- source_word: ἐπηρώτα
  choice: पूछ रहा था
  rationale: अपूर्ण भूतकाल के निरंतर या पृष्ठभूमिक पक्ष को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; केवल ‘पूछा’ कहने पर यह पक्ष लुप्त हो जाता।
- source_word: Ὑμεῖς δὲ
  choice: लेकिन तुम
  rationale: δέ पिछले प्रश्न में बताए गए अन्य लोगों के मत और अब शिष्यों के उत्तर के बीच विरोध दिखाता है; स्पष्ट बहुवचन सर्वनाम Ὑμεῖς पर बल ‘तुम’ से बना रहता है।
- source_word: τίνα με λέγετε εἶναι
  choice: तुम क्या कहते हो—मैं कौन हूँ?
  rationale: यूनानी के कर्मकारक और infinitive वाले विन्यास का स्वाभाविक हिन्दी रूप है। विराम-चिह्न प्रश्न के दोनों संबंधित भागों को स्पष्ट रखते हैं।
- source_word: ἀποκριθεὶς ... λέγει αὐτῷ
  choice: पतरस ने उसे उत्तर दिया
  rationale: कृदन्त और मरकुस के ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन में एक भूतकालीन क्रिया के रूप में व्यक्त करता है।
- source_word: Σὺ εἶ
  choice: आप ... हैं
  rationale: पतरस के सीधे संबोधन को आधुनिक, सम्मानपूर्ण हिन्दी में व्यक्त करता है; यूनानी का स्पष्ट सर्वनाम बना रहता है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ χριστός नाम नहीं, अपेक्षित अभिषिक्त राजा की उपाधि है। ‘मसीह’ हिन्दी में इस यहूदी मसीहाई उपाधि का सर्वाधिक परिचित और स्वाभाविक रूप है।
theological_decisions:
- issue: χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रिस्त; परमेश्वर का अभिषिक्त जन
  rationale: पतरस की घोषणा में यह शब्द उपाधि है। ‘मसीह’ उसके यहूदी मसीहाई संदर्भ को बनाए रखता है; वैकल्पिक पारंपरिक रूप और उपाधि का अर्थ पादटिप्पणी में दिए गए हैं, बिना पद में अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण संवाद। यीशु का शिष्यों के लिए ‘तुम’ और पतरस का यीशु के लिए सम्मानसूचक ‘आप’ स्वाभाविक हिन्दी सामाजिक प्रयोग के अनुसार है।
