- source_word: ἔφαγον
  choice: उन्होंने खाया
  rationale: ἐσθίω का सामान्य कथात्मक भूतकाल; सरल हिंदी मूल के सीधे अर्थ को सुरक्षित रखती है।
- source_word: ἐχορτάσθησαν
  choice: तृप्त हो गए
  rationale: यहाँ χορτάζω पर्याप्त भोजन पाकर भर जाने का भाव देता है; ‘तृप्त हो गए’ स्वाभाविक और गरिमापूर्ण हिंदी है।
- source_word: ἦραν
  choice: उठा लीं
  rationale: αἴρω का मूल भाव उठाने का है; संग्रह के संदर्भ में टोकरियाँ भरकर उठा लेने की अभिव्यक्ति स्वाभाविक है।
- source_word: περισσεύματα κλασμάτων
  choice: बचे हुए टुकड़ों से
  rationale: περισσεύματα शेष बची मात्रा और κλασμάτων टूटे हुए खाद्य-टुकड़ों को दर्शाता है; संयुक्त पदबंध हिंदी में अर्थ स्पष्ट करता है।
- source_word: ἑπτὰ σπυρίδας
  choice: सात बड़े टोकरियाँ
  rationale: σπυρίς टोकरी, संभवतः बड़ी टोकरी या झाबे को सूचित करता है और मरकुस 6:43 के κόφινος से भिन्न शब्द है; ‘बड़ी टोकरियाँ’ इस संभावित आकार-भेद को पाठ में सहज रूप से व्यक्त करता है।
