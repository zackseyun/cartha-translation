    text: यहाँ यूनानी शब्द σπυρίδες ऐसी टोकरियों के लिए है जो संभवतः बड़ी, झाबे-जैसी थीं। पाँच हज़ार लोगों को खिलाने के वर्णन में मरकुस ने एक अलग यूनानी शब्द (κόφινοι; 6:43) इस्तेमाल किया है।
