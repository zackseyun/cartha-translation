source:
  edition: SBLGNT
  text: Καὶ ἐξῆλθεν ὁ Ἰησοῦς καὶ οἱ μαθηταὶ αὐτοῦ εἰς τὰς κώμας Καισαρείας τῆς Φιλίππου· καὶ ἐν τῇ ὁδῷ ἐπηρώτα τοὺς μαθητὰς αὐτοῦ λέγων αὐτοῖς· Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/027.yaml
  text: And Jesus went out[a], with his disciples, to the villages of Caesarea Philippi. And on the way he was asking his disciples, saying to them, “Who do people say that I am?”
translation:
  language: hi
  text: और यीशु अपने शिष्यों के साथ कैसरिया फिलिप्पी के गाँवों में गए। मार्ग में वह अपने शिष्यों से पूछ रहे थे, “लोग कहते हैं कि मैं कौन हूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकल पड़े
  rationale: यह ἐξέρχομαι की गति को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग से अधिक अर्थ जोड़ने वाला ‘प्रस्थान किया’ अपेक्षाकृत औपचारिक है।
- source_word: κώμας
  choice: गाँवों
  rationale: κώμη सामान्यतः छोटे ग्रामीण निवास-स्थानों को दर्शाता है, इसलिए ‘गाँव’ ‘नगर’ से अधिक सटीक है।
- source_word: Καισαρείας τῆς Φιλίππου
  choice: कैसरिया फिलिप्पी
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण रखा गया है।
- source_word: ἐν τῇ ὁδῷ
  choice: मार्ग में
  rationale: यह यात्रा के दौरान होने वाली घटना को संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है तथा मरकुस की यात्रा-गतिशीलता बनाए रखता है।
- source_word: ἐπηρώτα
  choice: पूछ रहे थे
  rationale: अपूर्ण भूतकाल ongoing action को सूचित कर सकता है; ‘पूछ रहे थे’ उस पक्ष को ‘पूछा’ की तुलना में बेहतर बनाए रखता है।
- source_word: λέγων αὐτοῖς
  choice: प्रत्यक्ष प्रश्न में समाहित
  rationale: यूनानी का शाब्दिक ‘उनसे यह कहते हुए’ हिन्दी में अनावश्यक पुनरुक्ति उत्पन्न करता; ‘पूछ रहे थे’ के बाद उद्धृत प्रश्न वही आशय स्वाभाविक रूप से देता है।
- source_word: Τίνα με λέγουσιν οἱ ἄνθρωποι εἶναι;
  choice: लोग मेरे विषय में क्या कहते हैं—मैं कौन हूँ?
  rationale: यह पहचान-संबंधी τίνα ... εἶναι को स्पष्ट रखते हुए आधुनिक हिन्दी की स्वाभाविक प्रश्न-रचना देता है; ‘लोग’ ἄνθρωποι के सामान्य, गैर-लिंग-विशिष्ट प्रयोग को सही रूप में व्यक्त करता है।
- source_word: οἱ μαθηταὶ αὐτοῦ / τοὺς μαθητὰς αὐτοῦ
  choice: अपने शिष्यों / अपने शिष्यों से
  rationale: αὐτοῦ का संबंध स्पष्ट रखा गया है; हिन्दी में कर्ता यीशु होने पर ‘अपने’ स्वाभाविक निजवाचक रूप है।
theological_decisions:
- issue: यीशु के प्रश्न में सामान्य अर्थ वाला ἄνθρωποι
  choice: लोग
  alternative: मनुष्य / पुरुष
  rationale: यहाँ शब्द व्यापक जनसमुदाय के लिए प्रयुक्त है, केवल पुरुषों के लिए नहीं। ‘लोग’ स्रोत के सामान्य अर्थ को बिना लिंग-सीमा जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘रास्ते में’ भी संभव था, पर ‘मार्ग में’ प्रकाशन-योग्य गरिमा और सहजता का संतुलन रखता है। किसी पादटिप्पणी की आवश्यकता नहीं है, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं जोड़ा गया।
