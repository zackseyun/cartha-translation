  text: καὶ ἀναβλέψας ἔλεγεν· Βλέπω τοὺς ἀνθρώπους ὅτι ὡς δένδρα ὁρῶ περιπατοῦντας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/024.yaml
  text: And looking up, he said, “I see people, because I see them walking around like trees.”
translation:
  language: hi
  text: उसने नज़र उठाकर कहा, “मुझे लोग दिखाई दे रहे हैं, क्योंकि मैं उन्हें पेड़ों के समान चलते-फिरते देख रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: नज़र उठाकर
  rationale: संदर्भ में आँखें खोलकर ऊपर देखने या फिर से देखने का भाव हो सकता है; यहाँ स्वाभाविक हिंदी में दृश्य क्रिया को बिना अनावश्यक चिकित्सकीय व्याख्या के व्यक्त किया गया है।
- source_word: τοὺς ἀνθρώπους
  choice: लोग
  rationale: सामान्य मनुष्यों के लिए आधुनिक और सहज हिंदी शब्द।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यूनानी पाठ के कारणसूचक संबंध को सुरक्षित रखता है, भले ही कथन में दृष्टि की अस्पष्ट अवस्था झलकती हो।
- source_word: ὡς δένδρα
  choice: पेड़ों के समान
  rationale: दिखाई देने वाले लोगों की पेड़ों से स्पष्ट तुलना को बनाए रखता है।
- source_word: περιπατοῦντας
  choice: चलते-फिरते
  rationale: लोगों को गति करते देखने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: चंगाई के बीच के चरण में व्यक्ति की अपूर्ण दृष्टि
  choice: कथन की असामान्य तुलना और कारणसूचक संरचना को ज्यों का त्यों बनाए रखा गया
  alternative: वाक्य को स्पष्ट करके कहना कि लोग पेड़ों जैसे दिखते हैं, पर चल रहे हैं
  rationale: पाठ की वास्तविक अस्पष्टता और क्रमिक चंगाई के वर्णन को व्याख्यात्मक रूप से सुलझाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक कथन के अनुरूप। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
