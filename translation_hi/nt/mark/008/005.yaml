base_translation:
  language: en
  yaml_path: translation/nt/mark/008/005.yaml
  text: And he asked them, “How many loaves do you have?” They said, “Seven.”
translation:
  language: hi
  text: और उसने उनसे पूछा, “तुम्हारे पास कितनी रोटियाँ हैं?” उन्होंने कहा, “सात।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: साधारण कथात्मक संयोजक; मरकुस की प्रवाहपूर्ण शैली को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
- source_word: ἠρώτα
  choice: उसने पूछा
  rationale: अपूर्ण भूतकाल का रूप होते हुए भी यहाँ एक कथात्मक प्रश्न के लिए स्वाभाविक आधुनिक हिन्दी में साधारण भूतकाल उपयुक्त है।
- source_word: αὐτούς
  choice: उनसे
  rationale: यह बहुवचन सर्वनाम शिष्यों की ओर संकेत करता है; हिन्दी में ‘पूछना’ के साथ ‘से’ स्वाभाविक कारक है।
- source_word: Πόσους
  choice: कितनी
  rationale: यह परिमाण पूछने वाला शब्द है और हिन्दी में स्त्रीलिंग बहुवचन ‘रोटियाँ’ के अनुरूप ‘कितनी’ आता है।
- source_word: ἔχετε
  choice: तुम्हारे पास ... हैं
  rationale: द्वितीय पुरुष बहुवचन वर्तमान रूप को स्वाभाविक हिन्दी अधिकार-संरचना से व्यक्त किया गया है।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: गिनने योग्य अलग-अलग रोटियों को दर्शाता है; ‘रोटियाँ’ सामान्य आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: उत्तर देने वाले समूह को स्पष्ट करता है; δέ को हिन्दी में अलग संयोजक लगाए बिना वाक्य-परिवर्तन से पर्याप्त रूप से व्यक्त किया गया है।
- source_word: Ἑπτά
  choice: सात
  rationale: मूल का सीधा संख्यात्मक उत्तर।
