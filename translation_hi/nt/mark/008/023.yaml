source:
  edition: SBLGNT
  text: καὶ ἐπιλαβόμενος τῆς χειρὸς τοῦ τυφλοῦ ⸀ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης, καὶ πτύσας εἰς τὰ ὄμματα αὐτοῦ, ἐπιθεὶς τὰς χεῖρας αὐτῷ, ἐπηρώτα αὐτόν· Εἴ τι ⸀βλέπεις;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/023.yaml
  text: And taking the blind man by the hand[a], he led him out of the village; and after spitting on his eyes and laying his hands on him, he asked him, “Do you see anything?”
translation:
  language: hi
  text: और उसने उस अंधे व्यक्ति का हाथ पकड़कर उसे गाँव से बाहर ले गया। उसकी आँखों पर थूककर[a] और उस पर अपने हाथ रखकर उसने उससे पूछा, “क्या तुम्हें कुछ दिखाई देता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक अक्षरशः, “उसकी आँखों में थूककर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιλαβόμενος τῆς χειρὸς
  choice: हाथ पकड़कर
  rationale: यह प्रयोग किसी का हाथ थामकर उसे साथ ले जाने की ठोस क्रिया बताता है। ‘हाथ पकड़कर’ स्वाभाविक हिन्दी है और यूनानी मुहावरे का अर्थ बनाए रखता है।
- source_word: τοῦ τυφλοῦ
  choice: उस अंधे आदमी का
  rationale: τυφλός यहाँ संज्ञा के रूप में प्रयुक्त पुल्लिंग एकवचन विशेषण है। ‘अंधे आदमी’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐξήνεγκεν αὐτὸν ἔξω τῆς κώμης
  choice: उसे गाँव से बाहर ले गया
  rationale: ἐκφέρω का मूल भाव बाहर ले जाना है। हाथ पकड़ने के संदर्भ में ‘ले गया’ स्वाभाविक है, और ἔξω के दिशात्मक अर्थ को भी व्यक्त करता है।
- source_word: πτύσας εἰς τὰ ὄμματα αὐτοῦ
  choice: उसकी आँखों पर थूकने
  rationale: εἰς का अधिक अक्षरशः अर्थ ‘में’ हो सकता है, पर इस शारीरिक क्रिया के लिए हिन्दी में ‘आँखों पर थूकना’ अधिक स्वाभाविक है। अधिक अक्षरशः विकल्प को पादटिप्पणी में रखा गया है।
- source_word: ἐπιθεὶς τὰς χεῖρας αὐτῷ
  choice: अपने हाथ उस पर रखने
  rationale: यह यीशु द्वारा किए गए वास्तविक शारीरिक स्पर्श का वर्णन है। बहुवचन ‘हाथ’ को बनाए रखते हुए अनावश्यक रीति-संबंधी अर्थ नहीं जोड़ा गया है।
- source_word: ἐπηρώτα αὐτόν
  choice: उसने उससे पूछा
  rationale: यूनानी अपूर्णकाल यहाँ प्रश्न पूछने की कथा-क्रिया को व्यक्त करता है। हिन्दी में सामान्य भूतकाल स्वाभाविक और पर्याप्त है।
- source_word: Εἴ τι βλέπεις;
  choice: क्या तुम्हें कुछ दिखाई देता है?
  rationale: यह अनिश्चित रूप से पूछता है कि उसे किसी प्रकार का दृश्य-बोध हो रहा है या नहीं। यह हिन्दी प्रश्न स्वाभाविक है और उत्तर को पहले से निर्धारित नहीं करता।
theological_decisions:
- issue: चंगाई की क्रियाओं की भौतिकता
  choice: आँखों पर थूकने और हाथ रखने की ठोस क्रियाओं को स्पष्ट रखा गया है।
  alternative: इन असहज लग सकने वाले विवरणों को नरम करके सामान्य रूप से चंगा करने की बात कहना।
  rationale: मूल पाठ चंगाई की देहगत और चौंकाने वाली प्रक्रिया को जानबूझकर बताता है; अनुवाद में इसे शिष्ट बनाने के लिए मिटाना उचित नहीं है।
- issue: हाथ रखने का संभावित अनुष्ठानिक अर्थ
  choice: इसे सीधे शारीरिक स्पर्श के रूप में ‘अपने हाथ उस पर रखने’ कहा गया है।
  alternative: इसे किसी औपचारिक धार्मिक संस्कार या कलीसियाई विधि के रूप में व्यक्त करना।
  rationale: इस संदर्भ में वाक्यांश चंगाई के दौरान यीशु के स्पर्श का वर्णन करता है; मूल पाठ बाद की किसी विशेष धार्मिक विधि को स्पष्ट रूप से निर्दिष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में घटनाओं का मूल क्रम सुरक्षित है और असामान्य शारीरिक विवरण को नरम नहीं किया गया। पादटिप्पणी का चिह्न उसी वाक्यांश पर लगाया गया है जिससे वह संबंधित है।
