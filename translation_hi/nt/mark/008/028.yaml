  text: They told him[a], saying, “John the Baptist; and others, Elijah; but others, one of the prophets.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “कुछ लोग कहते हैं कि आप यूहन्ना बपतिस्मा देनेवाले हैं; कुछ, कि एलिय्याह हैं; और कुछ, कि भविष्यद्वक्ताओं में से एक हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “उन्होंने उससे कहा, ‘यूहन्ना बपतिस्मा देनेवाला; और दूसरे, एलिय्याह; और दूसरे, भविष्यद्वक्ताओं में से एक।’” यूनानी में उत्तर को संक्षिप्त सूची के रूप में रखा गया है; बाद के खंडों में ‘कहते हैं’ और ‘आप हैं’ निहित हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: उन्होंने
  rationale: यह पद पिछले संदर्भ के शिष्यों को फिर से कर्ता बनाता है। हिन्दी में ‘उन्होंने’ स्वाभाविक है; δέ का हल्का संयोजक बल अलग शब्द के बिना भी संदर्भ से स्पष्ट है।
- source_word: εἶπαν αὐτῷ λέγοντες
  choice: उन्होंने उससे कहा
  rationale: एक ही मूल के सीमित क्रियापद और कृदन्त को हिन्दी में शब्दशः दुहराने पर ‘कहा, कहते हुए’ अस्वाभाविक होगा। ‘उससे कहा’ कथन-सूत्र का अर्थ सहज रूप में देता है।
- source_word: Ἰωάννην τὸν βαπτιστήν
  choice: यूहन्ना बपतिस्मा देनेवाला
  rationale: यह व्यक्तिवाचक पहचान को बनाए रखते हुए βαπτιστής के कार्यगत अर्थ को साफ और गैर-सांप्रदायिक हिन्दी में व्यक्त करता है।
- source_word: ἄλλοι ... ἄλλοι δὲ
  choice: कुछ ... और कुछ ... पर कुछ
  rationale: यह अलग-अलग समूहों की राय और अंतिम δέ के हल्के विरोध को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: Ἠλίαν
  choice: एलिय्याह
  rationale: यह हिन्दी बाइबल-परंपरा में प्रचलित इब्रानी नाम-रूप है।
- source_word: ὅτι εἷς τῶν προφητῶν
  choice: भविष्यद्वक्ताओं में से एक
  rationale: मूल यूनानी की संक्षिप्त, अध्याहृत रचना को सुरक्षित रखा गया है; ‘तुम हो’ जोड़े बिना आशय हिन्दी में स्पष्ट रहता है।
- source_word: προφητῶν
  choice: भविष्यद्वक्ताओं
  rationale: इस्राएल के नबियों के लिए यह मानक और व्यापक रूप से समझा जाने वाला हिन्दी पद है।
theological_decisions:
- issue: यीशु के विषय में लोगों की अलग-अलग पहचानों का प्रस्तुतीकरण
  choice: रायों को संक्षिप्त उद्धृत सूची के रूप में रखा गया है और हर खंड में अध्याहृत ‘आप हैं’ नहीं जोड़ा गया।
  alternative: उन्होंने उससे कहा, “लोग कहते हैं कि आप यूहन्ना बपतिस्मा देनेवाले हैं; दूसरे कहते हैं, एलिय्याह; और दूसरे, भविष्यद्वक्ताओं में से एक।”
  rationale: यूनानी पाठ बाद के खंडों में क्रिया और विधेय को अध्याहृत छोड़ता है। संक्षिप्त सूची पाठ की अस्पष्ट-संक्षिप्त शैली और जनमत की विविधता दोनों बनाए रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘कुछ कहते हैं’ को प्रत्येक पहचान के साथ आवश्यक सीमा तक रखा गया है ताकि हिन्दी में वक्ताओं और उनकी राय का संबंध साफ रहे, जबकि मूल की संक्षिप्तता भी पर्याप्त रूप से बनी रहे।
