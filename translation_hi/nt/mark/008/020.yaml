  text: ὅτε ⸀καὶ τοὺς ἑπτὰ εἰς τοὺς τετρακισχιλίους, πόσων σπυρίδων πληρώματα κλασμάτων ἤρατε; ⸂καὶ λέγουσιν αὐτῷ⸃· Ἑπτά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/020.yaml
  text: And when the seven were for the four thousand[a], how many large baskets full of broken pieces did you pick up? They said to him, “Seven.”
translation:
  language: hi
  text: और जब सात रोटियाँ चार हज़ार लोगों के लिए थीं, तब तुमने टूटे हुए टुकड़ों से भरी कितनी बड़ी टोकरियाँ[a] उठाईं? उन्होंने उससे कहा, “सात।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त यूनानी शब्द σπυρίς बड़ी टोकरी को दर्शाता है; यह मरकुस 8:19 में छोटी टोकरियों के लिए प्रयुक्त यूनानी शब्द से भिन्न है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτε καὶ
  choice: और जब… तब
  rationale: दूसरे भोजन-वृत्तांत को पहले वाले प्रश्न से जोड़ते हुए संयोजक और कालगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ἑπτὰ
  choice: सात रोटियाँ
  rationale: यूनानी में केवल ‘वे सात’ है, पर सन्दर्भ में रोटियाँ स्पष्टतः अभिप्रेत हैं; हिन्दी में संज्ञा जोड़ने से अर्थ सहज और स्पष्ट रहता है।
- source_word: εἰς τοὺς τετρακισχιλίους
  choice: चार हज़ार लोगों के लिए
  rationale: εἰς यहाँ उन लोगों के सम्बन्ध में, विशेषतः उन्हें खिलाए जाने के अर्थ में है; ‘के लिए’ इस भाव को स्वाभाविक ढंग से रखता है।
- source_word: πόσων σπυρίδων
  choice: कितनी बड़ी टोकरियाँ
  rationale: σπυρίς बड़ी टोकरी को सूचित करता है और 8:19 के κόφινος से शब्दगत भेद बनाए रखता है।
- source_word: πληρώματα κλασμάτων
  choice: टूटे हुए टुकड़ों से भरी
  rationale: भराव और रोटी के टूटे बचे टुकड़ों—दोनों ठोस भावों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤρατε
  choice: उठाईं
  rationale: सन्दर्भ में बचे हुए टुकड़ों से भरी टोकरियाँ इकट्ठी करके उठा लेने का अर्थ है; ‘उठाईं’ संक्षिप्त और स्वाभाविक है।
- source_word: καὶ λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को आधुनिक हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Ἑπτά
  choice: सात
  rationale: यीशु के प्रश्न का सीधा संख्यात्मक उत्तर।
