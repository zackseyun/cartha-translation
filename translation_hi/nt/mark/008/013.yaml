lexical_decisions:
- source_word: ἀφεὶς
  choice: छोड़कर
  rationale: ἀφίημι का कृदन्त यहाँ उन लोगों से विदा होने या उन्हें पीछे छोड़ने का सीधा भाव देता है। ‘छोड़कर’ स्वाभाविक हिन्दी है और मुख्य क्रिया से कृदन्त का संबंध बनाए रखता है।
- source_word: αὐτοὺς
  choice: उन्हें
  rationale: यह निकटवर्ती प्रसंग के फरीसियों की ओर संकेत करता है; साधारण सर्वनाम पर्याप्त और सटीक है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν का अर्थ ‘फिर/दोबारा’ या वापसी के भाव में ‘वापस’ हो सकता है। हिन्दी में ‘फिर नाव पर चढ़ा’ पुनरावृत्ति को स्वाभाविक रूप से व्यक्त करता है और यूनानी शब्द के स्थान को भी निकटता से सुरक्षित रखता है।
- source_word: ἐμβὰς
  choice: नाव पर चढ़ा
  rationale: कृदन्त का अर्थ भीतर जाने या सवार होने से है। नाव मूल पाठ में स्पष्ट नहीं कही गई, पर तत्काल यात्रा-प्रसंग से निहित है; हिन्दी में उसे व्यक्त करने से वाक्य साफ और सहज बनता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: ἀπέρχομαι यहाँ प्रस्थान को दर्शाता है। ‘चला गया’ आधुनिक हिन्दी में स्वाभाविक है और अगले गंतव्य-वाचक पद के साथ सुचारु बैठता है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: यह झील के दूसरी ओर जाने के लिए मरकुस में प्रयुक्त सामान्य अभिव्यक्ति है। ‘उस पार’ संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी है।
