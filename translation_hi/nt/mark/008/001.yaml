  text: Ἐν ἐκείναις ταῖς ἡμέραις ⸂πάλιν πολλοῦ⸃ ὄχλου ὄντος καὶ μὴ ἐχόντων τί φάγωσιν, ⸀προσκαλεσάμενος τοὺς ⸀μαθητὰς λέγει αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/001.yaml
  text: In those days[a], when again a large crowd was present and they had nothing to eat, he called his disciples and says to them[b],
translation:
  language: hi
  text: 'उन दिनों, जब फिर एक बड़ी भीड़ मौजूद थी[a] और लोगों के पास खाने को कुछ नहीं था, वह अपने शिष्यों को बुलाकर उनसे कहता है[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उन दिनों फिर एक बड़ी भीड़ थी’ भी हो सकता है। यूनानी में यहाँ संबंधकारक निरपेक्ष रचना है, जिसका भाव है, ‘फिर एक बड़ी भीड़ उपस्थित होने पर।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘उनसे कहता है’ है। मरकुस बीती घटनाओं का वर्णन करते हुए अक्सर सजीव ऐतिहासिक वर्तमान का प्रयोग करता है; हिन्दी में ‘उनसे कहा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: यह यूनानी काल-सूचक मुहावरे का सहज और सीधा हिन्दी रूप है।
- source_word: πάλιν πολλοῦ ὄχλου ὄντος
  choice: जब फिर एक बड़ी भीड़ इकट्ठी हुई थी
  rationale: πάλιν की पुनरावृत्ति और πολλοῦ ὄχλου की बड़ी संख्या दोनों सुरक्षित रहती हैं; सम्बन्धवाचक उपवाक्य यूनानी genitive absolute की परिस्थितिजन्य भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ μὴ ἐχόντων τί φάγωσιν
  choice: और लोगों के पास खाने को कुछ नहीं था
  rationale: बहुवचन कर्ता भीड़ के लोगों को सूचित करता है। ‘लोगों’ कहने से हिन्दी में ‘उनके’ का सम्भावित संदर्भ-भ्रम दूर होता है, जबकि अर्थ नहीं बदला जाता।
- source_word: προσκαλεσάμενος τοὺς μαθητάς
  choice: अपने शिष्यों को बुलाकर
  rationale: कृदन्त की पूर्वकालिक क्रिया को ‘बुलाकर’ व्यक्त करता है। ‘अपने’ प्रसंग में स्वाभाविक है और शिष्यों का सम्बन्ध यीशु से स्पष्ट करता है।
- source_word: λέγει αὐτοῖς
  choice: उनसे कहता है
  rationale: वर्तमान काल यूनानी ऐतिहासिक वर्तमान को सुरक्षित रखता है और मरकुस की सजीव कथन-शैली दर्शाता है।
theological_decisions:
- issue: मरकुस के ऐतिहासिक वर्तमान का कथात्मक काल
  choice: ‘उनसे कहता है’ के रूप में वर्तमान काल बनाए रखा गया
  alternative: ‘उनसे कहा’ के रूप में सामान्य भूतकाल
  rationale: यह कोई सिद्धान्तगत निष्कर्ष नहीं, बल्कि मूल यूनानी की कथन-शैली को बनाए रखने का निर्णय है। वर्तमान काल पाठक को मरकुस की सजीव कथा-प्रस्तुति सुनाता है।
- issue: भीड़ के पास भोजन न होने का संदर्भ
  choice: ‘लोगों के पास’ कहकर भीड़ के सदस्यों को स्पष्ट किया गया
  alternative: ‘उनके पास’, जिसका निकटवर्ती संदर्भ अस्पष्ट हो सकता है
  rationale: यूनानी बहुवचन कृदन्त का कर्ता भीड़ के लोग हैं; हिन्दी में स्पष्ट संज्ञा प्रयोग करने से आशय सुरक्षित रहता है और शिष्यों से भ्रम नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। ‘शिष्य’ व्यापक रूप से समझा जाने वाला औपचारिक-बाइबलीय शब्द है। ऐतिहासिक वर्तमान के कारण ‘वह ... कहता है’ जानबूझकर रखा गया है; पद के बाद आने वाले प्रत्यक्ष कथन के लिए अन्त में द्विबिन्दु है।
