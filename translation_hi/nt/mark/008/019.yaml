id: MRK.8.19
reference: Mark 8:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτε τοὺς πέντε ἄρτους ἔκλασα εἰς τοὺς πεντακισχιλίους, πόσους κοφίνους ⸂κλασμάτων πλήρεις⸃ ἤρατε; λέγουσιν αὐτῷ· Δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/019.yaml
  text: When I broke the five loaves for the five thousand[a], how many baskets full of broken pieces did you pick up?” They said to him[c][b], “Twelve.”
translation:
  language: hi
  text: “जब मैंने पाँच हज़ार लोगों[a] के लिए पाँच रोटियाँ तोड़ी थीं, तब तुमने टुकड़ों से भरी कितनी टोकरियाँ उठाईं[b]?” उन्होंने उससे कहा, “बारह।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से ‘पाँच हज़ार’ है; इसे ‘पाँच हज़ार पुरुष’ भी समझा जा सकता है।
    reason: मूल में संज्ञा अनुक्त है और पुल्लिंग रूप के प्रतिनिधिक अथवा लिंग-विशिष्ट बल को खुला रखना आवश्यक है।
  - marker: b
    text: या ‘इकट्ठी कीं’।
    reason: इस प्रसंग में ἤρατε उठाने के साथ-साथ एकत्र कर लेने का भाव भी दे सकता है।
lexical_decisions:
- source_word: ὅτε
  choice: जब
  rationale: यह बीती हुई घटना का समय बताने वाला स्वाभाविक हिन्दी संयोजक है और यीशु के सीधे प्रश्न की शैली बनाए रखता है।
- source_word: τοὺς πέντε ἄρτους
  choice: पाँच रोटियाँ
  rationale: गिनती के प्रसंग में ἄρτους अलग-अलग रोटियों को दर्शाता है; आधुनिक हिन्दी में ‘पाँच रोटियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: ἔκλασα
  choice: मैंने … तोड़ी थीं
  rationale: κλάω रोटी तोड़ने की ठोस क्रिया है। ‘तोड़ी थीं’ उस पहले घट चुकी घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τοὺς πεντακισχιλίους
  choice: पाँच हज़ार लोगों के लिए
  rationale: εἰς यहाँ उस समूह की ओर लक्षित कार्य को दर्शाता है। हिन्दी में केवल ‘पाँच हज़ार’ की अपेक्षा ‘लोगों’ जोड़ना अर्थ को सहज बनाता है, जबकि पाद-टिप्पणी मूल की शाब्दिक बनावट स्पष्ट करती है।
- source_word: κοφίνους
  choice: टोकरियाँ
  rationale: κόφινος एक प्रकार की टोकरी है। इस पद में अधिक तकनीकी भेद आवश्यक नहीं, इसलिए सामान्य और स्पष्ट हिन्दी शब्द चुना गया है।
- source_word: κλασμάτων πλήρεις
  choice: टुकड़ों से भरी
  rationale: κλάσματα तोड़ी गई रोटियों के टुकड़ों को दर्शाता है और πλήρεις टोकरियों के भरे होने का वर्णन करता है। यह वाक्यांश मूल क्रम और संबंध को स्पष्ट रखता है।
- source_word: ἤρατε
  choice: तुमने … उठाईं
  rationale: αἴρω यहाँ बचे हुए टुकड़ों से भरी टोकरियाँ उठा लेने या एकत्र करने के अर्थ में है। ‘उठाईं’ मूल क्रिया का सीधा अर्थ सुरक्षित रखता है।
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने उससे कहा
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Δώδεκα
  choice: बारह
  rationale: सीधा संख्यात्मक उत्तर है; प्रश्न से इसका संदर्भ स्पष्ट है।
theological_decisions:
- issue: τοὺς πεντακισχιλίους का प्रतिनिधिक या लिंग-विशिष्ट अर्थ
  choice: पाँच हज़ार लोगों
  alternative: पाँच हज़ार पुरुषों
  rationale: यूनानी में पुल्लिंग बहुवचन रूप है और शब्दशः संज्ञा व्यक्त नहीं की गई। यह पहले वर्णित भीड़ का प्रचलित संख्यात्मक नाम भी हो सकता है। मुख्य पाठ में ‘लोगों’ स्वाभाविक हिन्दी देता है, जबकि पाद-टिप्पणी ‘पुरुषों’ की सम्भावना को बिना निर्णायक रूप से थोपे सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के स्मरणात्मक प्रश्न का मौखिक प्रवाह बनाए रखने के लिए ‘जब … तब’ संरचना अपनाई गई है। ‘रोटियाँ’, ‘टुकड़े’ और ‘टोकरियाँ’ सामान्य पाठक के लिए ठोस और तुरंत समझ आने वाले शब्द हैं।
