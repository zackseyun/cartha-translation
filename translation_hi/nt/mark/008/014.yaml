  text: And they had forgotten to take bread[a], and except for one loaf they had no bread with them in the boat.
translation:
  language: hi
  text: वे रोटियाँ साथ लेना भूल गए थे, और नाव में उनके पास एक रोटी के सिवा कोई रोटी नहीं थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπελάθοντο
  choice: भूल गए थे
  rationale: एओरिस्ट क्रिया यहाँ नाव में उनकी वर्तमान कमी की पिछली वजह बताती है; हिन्दी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: λαβεῖν
  choice: लेना
  rationale: पूरक अनंत क्रिया का सीधा और स्वाभाविक अर्थ है कि वे रोटियाँ साथ लेना भूल गए।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους अलग-अलग रोटियों को सूचित कर सकता है और आगे आने वाली ‘एक रोटी’ के साथ स्पष्ट गणनीय संबंध बनाए रखता है।
- source_word: εἰ μὴ ἕνα ἄρτον
  choice: एक रोटी को छोड़कर
  rationale: εἰ μή यहाँ शर्त नहीं बल्कि अपवाद व्यक्त करता है; एकमात्र उपलब्ध रोटी को स्पष्ट रूप से दर्शाया गया है।
- source_word: οὐκ εἶχον μεθ’ ἑαυτῶν
  choice: उनके पास ... और कुछ नहीं था
  rationale: हिन्दी की स्वाभाविक ‘के पास’ रचना साथ मौजूद वस्तु के अभाव को व्यक्त करती है; ‘और कुछ नहीं’ अपवादात्मक वाक्यांश के साथ सहज है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में
  rationale: स्थानवाचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions: []
