  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। ‘रोटियाँ’ और ‘एक रोटी’ से मूल के बहुवचन तथा एकवचन का अंतर सुरक्षित रखा गया है; अनावश्यक पुनरुक्ति से बचने के लिए दूसरे खंड में ‘और कुछ नहीं’ रखा गया है।
