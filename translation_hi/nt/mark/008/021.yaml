  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: साधारण समन्वयकारी संयोजक; यह कथानक की कड़ी को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल क्रिया का अपूर्णतापरक पक्ष व्यक्त करता है और हिन्दी में निरंतर या बार-बार कहने का स्वाभाविक संकेत देता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: बहुवचन सर्वनाम का सीधा और स्वाभाविक हिन्दी रूप; संदर्भ से ‘चेलों’ को मूल पाठ में जोड़ने से बचता है।
- source_word: Οὔπω
  choice: अब तक नहीं
  rationale: ‘अभी तक नहीं/अब तक नहीं’ का भाव रखता है कि अपेक्षित समझ इस बिंदु तक भी नहीं आई है। प्रश्न में ‘अब तक नहीं’ सहज और स्पष्ट है।
- source_word: συνίετε
  choice: समझते
  rationale: मानसिक बोध या बात की पकड़ को सामान्य आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: क्या यीशु के प्रश्न में ‘यह’ या ‘इसे’ जैसा कर्म जोड़ा जाए
  choice: 'कर्म को अनकहा रखा गया: ‘क्या तुम अब तक नहीं समझते?’'
  alternative: ‘क्या तुम अब तक यह नहीं समझते?’
  rationale: यूनानी पाठ में कर्म व्यक्त नहीं है। उसे अनकहा रखने से प्रश्न का खुलापन और फटकार का व्यापक बल बना रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘कहता रहा’ यूनानी अपूर्ण भूतकाल के पक्ष को दर्शाता है; प्रश्न में कोई ऐसा कर्म नहीं जोड़ा गया जो मूल में नहीं है।
