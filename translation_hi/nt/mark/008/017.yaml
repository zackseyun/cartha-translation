  text: καὶ ⸀γνοὺς λέγει αὐτοῖς· Τί διαλογίζεσθε ὅτι ἄρτους οὐκ ἔχετε; οὔπω νοεῖτε οὐδὲ συνίετε; ⸀πεπωρωμένην ἔχετε τὴν καρδίαν ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/017.yaml
  text: And knowing[a], he says to them[c][b], “Why are you discussing that you have no bread? Do you not yet perceive or understand? Do you have your heart hardened?”
translation:
  language: hi
  text: यह जानकर उसने उनसे कहा, “तुम इस बात पर क्यों चर्चा कर रहे हो कि तुम्हारे पास रोटियाँ नहीं हैं? क्या तुम अब भी नहीं समझते-बूझते? क्या तुम्हारा हृदय कठोर हो गया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνοὺς
  choice: यह जानकर
  rationale: अओरिस्ट कृदंत यीशु द्वारा शिष्यों की चर्चा जान लेने को व्यक्त करता है। हिन्दी में संदर्भ से निहित विषय को ‘यह’ द्वारा व्यक्त करना स्वाभाविक और संक्षिप्त है।
- source_word: διαλογίζεσθε
  choice: चर्चा कर रहे हो
  rationale: यह रूप यहाँ शिष्यों के आपसी विचार-विमर्श को सूचित करता है; ‘चर्चा’ प्रसंगानुकूल और आधुनिक हिन्दी में सहज है।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: यूनानी बहुवचन को हिन्दी में स्वाभाविक बहुवचन ‘रोटियाँ’ से व्यक्त किया गया है; इससे वास्तविक खाद्य-वस्तु और उसकी कमी दोनों स्पष्ट रहती हैं।
- source_word: νοεῖτε … συνίετε
  choice: समझते-बूझते
  rationale: दो निकटार्थी क्रियाओं की आलंकारिक जोड़ी को हिन्दी के स्वाभाविक युग्म ‘समझते-बूझते’ से सुरक्षित रखा गया है, बिना अनावश्यक रूप से कृत्रिम भेद थोपे।
- source_word: πεπωρωμένην
  choice: कठोर हो गया है
  rationale: पूर्ण निष्पन्न कर्मवाच्य कृदंत वर्तमान कठोर अवस्था को दर्शाता है। यह अभिव्यक्ति हिन्दी में सहज रहते हुए आध्यात्मिक असंवेदनशीलता के रूपक को बनाए रखती है।
- source_word: καρδίαν
  choice: हृदय
  rationale: यहाँ ‘हृदय’ मनुष्य के भीतरी बोध और प्रत्युत्तरशीलता का रूपक है; स्रोत का बाइबलीय रूपक सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम प्रश्न में हृदय की कठोर अवस्था का निरूपण
  choice: क्या तुम्हारा हृदय कठोर हो गया है?
  alternative: क्या तुमने अपने हृदय को कठोर कर रखा है?
  rationale: ἔχετε + कर्म + कृदंत का शब्दशः रूप हिन्दी में असहज और संभावित रूप से कर्तृवाच्य अर्थ देने वाला होता। चुना हुआ पाठ परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और यह निर्धारित नहीं करता कि कठोरता का कर्ता कौन है। एकवचन ‘हृदय’ यूनानी के सामूहिक/वितरणात्मक एकवचन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक प्रश्नोत्तर के अनुकूल है। ‘समझते-बूझते’ स्रोत की दो निकटार्थी क्रियाओं को स्वाभाविक हिन्दी युग्म में रखता है। सर्वनाम और क्रियारूप प्रसंग के बहुवचन श्रोताओं के अनुसार हैं।
