  edition: SBLGNT
  text: ὃς γὰρ ⸀ἐὰν θέλῃ τὴν ⸂ψυχὴν αὐτοῦ⸃ σῶσαι ἀπολέσει αὐτήν· ὃς δ’ ἂν ⸀ἀπολέσει τὴν ⸄ψυχὴν αὐτοῦ⸅ ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου ⸀σώσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/035.yaml
  text: For whoever wants to save his life will lose it[b][a], but whoever loses his life for my sake and for the gospel will save it.
translation:
  language: hi
  text: क्योंकि जो कोई अपना जीवन बचाना चाहता है, वह उसे खो देगा; पर जो कोई मेरे और सुसमाचार के लिए अपना जीवन खो देता है, वह उसे बचाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जीवन’ के स्थान पर पूरे पद में ‘प्राण’ भी सम्भव है; यूनानी शब्द व्यक्ति के जीवन या स्वयं को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ψυχή
  choice: जीवन
  rationale: इस शिष्यत्व-संबंधी कथन में यह शब्द व्यक्ति के जीवन या स्वयं को सूचित करता है। ‘जीवन’ बचाने और खोने के विरोधाभास को स्वाभाविक हिन्दी में बनाए रखता है; ‘प्राण’ भी सम्भव है और उसे पादटिप्पणी में रखा गया है।
- source_word: σῶσαι / σώσει
  choice: बचाना / बचाएगा
  rationale: एक ही क्रिया को दोनों स्थानों पर रखकर मूल का शाब्दिक संबंध और विरोधाभास सुरक्षित रहता है।
- source_word: ἀπολέσει
  choice: खो देगा
  rationale: ψυχή के साथ यहाँ ‘खोना’ प्रसंगानुकूल है और बचाने के विपरीत अर्थ को स्पष्ट रखता है; ‘नष्ट करना’ अनावश्यक रूप से अधिक प्रबल होगा।
- source_word: ἕνεκεν ἐμοῦ καὶ τοῦ εὐαγγελίου
  choice: मेरे और सुसमाचार के कारण
  rationale: ἕνεκεν कारण या हेतु व्यक्त करता है और एक साथ ‘मेरे’ तथा ‘सुसमाचार’ दोनों से जुड़ा है। यह रूप हिन्दी में स्वाभाविक रहते हुए उस संयुक्त संबंध को स्पष्ट करता है।
- source_word: εὐαγγέλιον
  choice: सुसमाचार
  rationale: यह मरकुस का प्रमुख शब्द है; ‘सुसमाचार’ आधुनिक हिन्दी में स्थापित और अर्थपूर्ण रूप है।
- source_word: ὃς ... ὃς
  choice: जो कोई ... जो कोई
  rationale: यह सामान्य और अनिश्चित कथन है; ‘जो कोई’ उसके सार्वभौमिक, लोकोक्तिपरक बल को व्यक्त करता है।
- source_word: θέλῃ
  choice: चाहता है
  rationale: यह इच्छा या संकल्प को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ψυχή का मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘जीवन’
  alternative: ‘प्राण’ या ‘आत्मा’
  rationale: तात्कालिक प्रसंग आत्मत्याग और यीशु तथा सुसमाचार के कारण जीवन खोने की बात करता है। ‘जीवन’ अर्थ को केवल अभौतिक ‘आत्मा’ तक सीमित नहीं करता। ‘प्राण’ शब्द की पारंपरिक और व्यापक अनुगूँज को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἕνεκεν के अधीन संयुक्त पद
  choice: ‘मेरे और सुसमाचार के कारण’
  alternative: ‘मेरे कारण और सुसमाचार के कारण’
  rationale: मूल में एक ही संबंधसूचक शब्द दोनों पदों पर लागू होता है। चुना हुआ रूप इसे संक्षिप्त और स्पष्ट रखता है, जबकि वैकल्पिक रूप हिन्दी में सम्भव पर अधिक पुनरुक्तिपूर्ण है।
- issue: सामान्य पुल्लिंग एकवचन
  choice: ‘जो कोई अपना जीवन’
  alternative: बहुवचन या लिंग-विशिष्ट सर्वनाम
  rationale: हिन्दी में ‘जो कोई अपना’ एकवचन की संरचना और कथन के सभी लोगों पर लागू होने का सामान्य बल, दोनों स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जो कोई’ कथन की सार्वभौमिकता और ‘बचाना—खोना—बचाना’ मूल विरोधाभास को बनाए रखते हैं। पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित है।
