language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀπεκρίθησαν αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ὅτι Πόθεν τούτους δυνήσεταί τις ὧδε χορτάσαι ἄρτων ἐπ’ ἐρημίας;
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/004.yaml
  text: And his disciples answered him[a], “From where will anyone be able to satisfy these people with bread here in a desolate place?”
translation:
  language: hi
  text: उसके शिष्यों ने उसे उत्तर दिया[a], “इस सुनसान जगह में इन लोगों को तृप्त करने के लिए कोई रोटी कहाँ से ला सकेगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके शिष्यों ने उसे उत्तर दिया, ‘इस जंगल में इन लोगों को रोटी खिलाकर कोई कैसे तृप्त कर सकता है?’”
    reason: Πόθεν का मूल अर्थ ‘कहाँ से’ है, पर प्रसंग में प्रश्न को साधन या संभावना के अर्थ में ‘कैसे’ भी व्यक्त किया जा सकता है; ἐρημία के लिए ‘जंगल’ एक प्रचलित वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: ἀπεκρίθησαν
  choice: उत्तर दिया
  rationale: कथात्मक प्रसंग में बोलकर प्रत्युत्तर देने के लिए यह सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी प्रयोग है।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के आरम्भ का उद्धरण-चिह्न
  rationale: यहाँ ὅτι उत्तर के बाद प्रत्यक्ष कथन प्रस्तुत करता है; आधुनिक हिन्दी में इसे अलग शब्द के बजाय उद्धरण-चिह्न से स्वाभाविक रूप से व्यक्त किया जाता है।
- source_word: Πόθεν
  choice: कहाँ से
  rationale: यह स्रोत या उत्पत्ति पूछता है। ‘कहाँ से’ मूल प्रश्न को बनाए रखता है, जबकि ‘कैसे’ अधिक व्याख्यात्मक होगा।
- source_word: τούτους
  choice: इन लोगों को
  rationale: सर्वनाम भीड़ की ओर संकेत करता है। ‘इन लोगों’ से उसका आशय स्पष्ट होता है और इसे केवल पुरुषों तक सीमित नहीं किया जाता।
- source_word: δυνήσεταί τις
  choice: कोई ... ला सकेगा
  rationale: ‘कोई ... सकेगा’ अनिश्चित कर्ता और भविष्यकालीन सामर्थ्य दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ला’ रोटी के स्रोत से भोजन उपलब्ध कराने का निहित भाव संप्रेषित करता है।
- source_word: ὧδε
  choice: इस ... जगह में
  rationale: ‘इस जगह में’ निकट स्थान का बोध स्वाभाविक हिन्दी में देता है; ἐπ’ ἐρημίας के साथ मिलकर अनावश्यक ‘यहाँ’ की पुनरुक्ति से बचाता है।
- source_word: χορτάσαι
  choice: तृप्त करने
  rationale: यह केवल भोजन देने के बजाय भरपेट खिलाने अथवा पर्याप्त भोजन से संतुष्ट करने का भाव सुरक्षित रखता है।
- source_word: ἄρτων
  choice: रोटी
  rationale: यह ἄρτος का सीधा और सामान्य हिन्दी समतुल्य है; ‘भोजन’ मूल की विशिष्टता घटाता और ‘रोटियाँ’ यहाँ अनावश्यक रूप से गिनती पर बल देता।
- source_word: ἐπ’ ἐρημίας
  choice: सुनसान जगह में
  rationale: यह निर्जन या आबादी से दूर स्थान का अर्थ स्पष्ट, वर्तमान और सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सहज, गरिमापूर्ण और कथात्मक है। ‘सुनसान जगह’ सामान्य पाठक के लिए स्पष्ट है, और ‘तृप्त करने’ से χορτάσαι में निहित भरपेट खिलाने का बल बना रहता है।
