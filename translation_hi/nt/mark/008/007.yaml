base_translation:
  language: en
  yaml_path: translation/nt/mark/008/007.yaml
  text: And they had a few small fish[a]; and after blessing them[b], he said to set these also before them.
translation:
  language: hi
  text: और उनके पास कुछ छोटी मछलियाँ भी थीं; उन्हें आशीष देने के बाद, उसने इन्हें भी परोसने को कहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन्हें भी लोगों के सामने रखने को कहा।”
    reason: παρατιθέναι का अधिक शाब्दिक अर्थ ‘सामने रखना’ है; भोजन के इस प्रसंग में ‘परोसना’ स्वाभाविक अर्थ देता है।
lexical_decisions:
- source_word: ἰχθύδια ὀλίγα
  choice: कुछ छोटी मछलियाँ
  rationale: ἰχθύδια का लघुतासूचक रूप मछलियों के छोटे आकार की ओर संकेत करता है, और ὀλίγα उनकी कम संख्या बताता है। यह हिन्दी में स्वाभाविक रूप से दोनों अर्थों को बनाए रखता है।
- source_word: εὐλογήσας αὐτά
  choice: उन पर आशीष देने के बाद
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। αὐτά का संदर्भ छोटी मछलियों से है; ‘आशीष देने’ से εὐλογέω का मूल भाव सुरक्षित रहता है।
- source_word: εἶπεν
  choice: उसने कहा
  rationale: यह λέγω के सामान्य अर्थ के निकट है और निर्देश का भाव आगे आने वाली कथन-वस्तु से स्पष्ट होने देता है।
- source_word: καὶ ταῦτα
  choice: इन्हें भी
  rationale: ‘भी’ καί के योगात्मक बल को और ‘इन्हें’ ταῦτα के संकेतात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρατιθέναι
  choice: लोगों को परोसें
  rationale: भोजन के प्रसंग में παρατίθημι का अर्थ किसी के सामने भोजन रखना, अर्थात परोसना है। बहुवचन क्रिया का कर्ता प्रसंग से शिष्य समझे जाते हैं, यद्यपि यूनानी में वे स्पष्ट रूप से नहीं लिखे गए।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘उसने कहा कि … परोसें’ मूल के εἶπεν के साथ आए infinitive की निर्देशात्मक शक्ति को व्यक्त करता है, जबकि शिष्यों को अनावश्यक रूप से मुख्य पाठ में स्पष्ट कर्ता नहीं बनाता।
