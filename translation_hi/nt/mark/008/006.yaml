source:
  edition: SBLGNT
  text: καὶ ⸀παραγγέλλει τῷ ὄχλῳ ἀναπεσεῖν ἐπὶ τῆς γῆς· καὶ λαβὼν τοὺς ἑπτὰ ἄρτους εὐχαριστήσας ἔκλασεν καὶ ἐδίδου τοῖς μαθηταῖς αὐτοῦ ἵνα ⸀παρατιθῶσιν καὶ παρέθηκαν τῷ ὄχλῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/008/006.yaml
  text: And he instructed the crowd to recline on the ground[a]. Then, taking the seven loaves, after giving thanks he broke them and kept giving them to his disciples so that they might set them before the crowd[b], and they set them before the crowd.
translation:
  language: hi
  text: उसने भीड़ को ज़मीन पर बैठ जाने का निर्देश दिया[a]। फिर सात रोटियाँ लेकर, धन्यवाद देकर, उसने उन्हें तोड़ा और अपने शिष्यों को देता रहा, ताकि वे उन्हें भीड़ के सामने रखें[b]। और उन्होंने उन्हें भीड़ के सामने रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘ज़मीन पर टिककर बैठ जाने।’ यूनानी क्रिया विशेष रूप से भोजन के लिए अधलेटे होकर बैठने का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उन्हें परोसें।’ यूनानी का शाब्दिक अर्थ है ‘सामने रखें।’
    reason: lexical_alternative
lexical_decisions:
- source_word: παραγγέλλει
  choice: निर्देश दिया
  rationale: यह क्रिया अधिकारपूर्वक आदेश या निर्देश देने को दर्शाती है। आधुनिक हिन्दी में ‘निर्देश दिया’ स्वाभाविक है और अनावश्यक कठोरता के बिना अधिकार का भाव रखता है। यूनानी के ऐतिहासिक वर्तमान को हिन्दी कथाशैली के सामान्य भूतकाल में रखा गया है।
- source_word: ἀναπεσεῖν
  choice: भोजन के लिए ... बैठ जाने
  rationale: यूनानी क्रिया विशेष रूप से भोजन के लिए टिककर या अधलेटे होने का संकेत देती है। आधुनिक हिन्दी में ‘भोजन के लिए बैठ जाने’ से प्रसंग स्वाभाविक रहता है; अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐπὶ τῆς γῆς
  choice: ज़मीन पर
  rationale: यहाँ γῆ उस धरातल को दर्शाता है जिस पर लोग बैठते हैं; ‘ज़मीन पर’ आधुनिक हिन्दी का स्वाभाविक रूप है।
- source_word: τοὺς ἑπτὰ ἄρτους
  choice: वे सात रोटियाँ
  rationale: भोजन कराने के इस प्रसंग में ἄρτοι रोटी की अलग-अलग इकाइयों को दर्शाता है। ‘सात रोटियाँ’ सामान्य हिन्दी में स्पष्ट और परिचित है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद दिया
  rationale: यूनानी में धन्यवाद का पात्र स्पष्ट रूप से नहीं कहा गया है, इसलिए हिन्दी में भी ‘परमेश्वर को’ जोड़कर निहित अर्थ को स्पष्ट कथन नहीं बनाया गया।
- source_word: ἔκλασεν
  choice: उन्हें तोड़ा
  rationale: ‘उन्हें’ का संकेत पहले उल्लिखित रोटियों की ओर है और हिन्दी में वाक्य को स्पष्ट बनाता है।
- source_word: ἐδίδου
  choice: देता गया
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली क्रिया का संकेत दे सकता है। ‘देता गया’ उस निरंतर वितरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα παρατιθῶσιν
  choice: ताकि वे उन्हें भीड़ के सामने रखें
  rationale: παρατίθημι का ठोस अर्थ भोजन को किसी के सामने रखना है। ‘सामने रखें’ इस बिंब को बनाए रखता है और उद्देश्यसूचक ἵνα को ‘ताकि’ से व्यक्त करता है।
- source_word: παρέθηκαν
  choice: उन्होंने उन्हें भीड़ के सामने रख दिया
  rationale: यह पूर्ण कथात्मक क्रिया शिष्यों द्वारा निर्देश पूरा किए जाने को बताती है। पहले आए παρατιθῶσιν के साथ शब्दगत संबंध भी बनाए रखा गया है।
- source_word: ὄχλος
  choice: भीड़
  rationale: इस कथा-प्रसंग में ‘भीड़’ आधुनिक मानक हिन्दी का सहज और सटीक शब्द है।
theological_decisions:
- issue: धन्यवाद और संभावित प्रभु-भोज संबंधी प्रतिध्वनि
  choice: εὐχαριστήσας का सीधा अनुवाद ‘धन्यवाद दिया’ किया गया है।
  alternative: ऐसी धार्मिक शब्दावली अपनाना जो इसे स्पष्ट रूप से प्रभु-भोज की विधि बताए।
  rationale: शब्दावली बाद की मसीही प्रथा की याद दिला सकती है, पर यह पद स्वयं यहाँ कोई संस्कार-सिद्धांत स्पष्ट नहीं करता। इसलिए साधारण भोजन की भाषा और उसकी संभावित धार्मिक प्रतिध्वनि—दोनों को बिना विस्तार जोड़े रहने दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथाशैली अपनाई गई है। ‘ज़मीन’, ‘रोटियाँ’ और ‘देता गया’ जैसे सामान्य शब्द पाठ को साधारण पाठकों के लिए स्पष्ट रखते हैं; पादटिप्पणियाँ यूनानी की अधिक विशिष्ट भोजन-संबंधी भाषा को सुरक्षित रखती हैं।
