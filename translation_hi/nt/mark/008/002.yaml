  yaml_path: translation/nt/mark/008/002.yaml
  text: I have compassion on the crowd, because they have already remained with me for three days and have nothing to eat.
translation:
  language: hi
  text: मुझे इस भीड़ पर दया आती है, क्योंकि ये लोग अब तीन दिन से मेरे साथ बने हुए हैं और इनके पास खाने को कुछ नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σπλαγχνίζομαι
  choice: मुझे … पर तरस आता है
  rationale: यह वर्तमानकालीन क्रिया गहरी करुणा को व्यक्त करती है। आधुनिक मानक हिन्दी में ‘तरस आता है’ स्वाभाविक है और भाव को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: ἐπὶ τὸν ὄχλον
  choice: इस भीड़ पर
  rationale: ἐπί के साथ कर्मवाचक रूप करुणा के लक्ष्य को बताता है। हिन्दी में ‘भीड़ पर तरस’ इसका सहज रूप है; संकेतवाचक ‘इस’ प्रसंग में सामने उपस्थित भीड़ को दर्शाता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι यीशु की करुणा का कारण प्रस्तुत करता है।
- source_word: ἤδη ἡμέραι τρεῖς
  choice: तीन दिन से
  rationale: ἤδη और समयावधि का भाव हिन्दी में ‘तीन दिन से’ द्वारा सहज रूप से आता है; जारी रहने की क्रिया के साथ ‘से’ यह भी स्पष्ट करता है कि अवधि अब तक पहुँच चुकी है।
- source_word: προσμένουσίν μοι
  choice: मेरे साथ हैं
  rationale: προσμένω किसी के साथ बने रहने या टिके रहने का भाव रखता है। समयसूचक ‘तीन दिन से’ के साथ ‘मेरे साथ हैं’ हिन्दी में स्वाभाविक है और निरंतर उपस्थिति को व्यक्त करता है।
- source_word: οὐκ ἔχουσιν τί φάγωσιν
  choice: इनके पास खाने को कुछ नहीं है
  rationale: यह अभिव्यक्ति भोजन के अभाव को बताती है। हिन्दी का ‘खाने को कुछ नहीं’ मूल अर्थ को स्पष्ट और सहज रूप में व्यक्त करता है।
