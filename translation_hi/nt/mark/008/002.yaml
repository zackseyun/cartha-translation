revisions:
- from: मुझे इस भीड़ पर तरस आता है, क्योंकि ये लोग तीन दिन से मेरे साथ हैं और इनके पास खाने को कुछ नहीं है।
  to: मुझे इस भीड़ पर दया आती है, क्योंकि ये लोग अब तीन दिन से मेरे साथ बने हुए हैं और इनके पास खाने को कुछ नहीं है।
  rationale: The revision explicitly represents ἤδη with ‘अब,’ renders the continuing sense of προσμένουσιν with ‘बने हुए हैं,’ and uses ‘दया आती है’ for a more fitting, non-condescending expression of compassion. No footnote is needed.
