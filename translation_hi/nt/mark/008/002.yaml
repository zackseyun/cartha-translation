  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘ये लोग/इनके’ का प्रयोग सामूहिक ‘भीड़’ के सदस्यों के लिए स्वाभाविक बहुवचन-संदर्भ देता है। कोई पाद-टिप्पणी आवश्यक नहीं है।
