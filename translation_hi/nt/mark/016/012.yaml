  text: Μετὰ δὲ ταῦτα δυσὶν ἐξ αὐτῶν περιπατοῦσιν ἐφανερώθη ἐν ἑτέρᾳ μορφῇ πορευομένοις εἰς ἀγρόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/012.yaml
  text: After these things[b][a], he appeared in a different form to two of them as they were walking on their way into the countryside.
translation:
  language: hi
  text: इन बातों के बाद वह उनमें से दो को भिन्न रूप में[a] दिखाई दिया, जब वे पैदल देहात जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दूसरे रूप में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: इसके बाद
  rationale: μετά के साथ कर्मकारक कालक्रम को व्यक्त करता है और δέ कथन को आगे बढ़ाता है। ‘इसके बाद’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दोनों का संयुक्त भाव देता है।
- source_word: δυσὶν ἐξ αὐτῶν
  choice: उनमें से दो को
  rationale: द्विवचन δυσίν और ἐξ αὐτῶν मिलकर बड़े समूह में से दो व्यक्तियों को प्राप्तकर्ता बताते हैं। यह हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: περιπατοῦσιν
  choice: जब वे पैदल चलते हुए
  rationale: वर्तमान कृदन्त मुख्य क्रिया के साथ चल रही गतिविधि बताता है। ‘पैदल चलते हुए’ περιπατέω के चलने के अर्थ को स्पष्ट रखता है।
- source_word: ἐφανερώθη
  choice: दिखाई दिया
  rationale: इस पुनरुत्थान-प्रकटन के प्रसंग में φανερόω का कर्मवाच्य रूप किसी के सामने प्रकट या दृश्यमान होने का भाव देता है। ‘दिखाई दिया’ सहज हिन्दी है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: ἐν ἑτέρᾳ μορφῇ
  choice: एक भिन्न रूप में
  rationale: ἑτέρᾳ भिन्नता और μορφή रूप या बाहरी स्वरूप दर्शाता है। यह अनुवाद कथन को वर्णनात्मक रखता है, बिना यह समझाए कि भिन्नता किस प्रकार की थी।
- source_word: πορευομένοις
  choice: की ओर जा रहे थे
  rationale: यह कृदन्त उद्देश्यपूर्ण यात्रा को बताता है। पहले से आए ‘चलते हुए’ की अस्वाभाविक पुनरावृत्ति से बचते हुए ‘जा रहे थे’ गमन का भाव सुरक्षित रखता है।
- source_word: εἰς ἀγρόν
  choice: देहात की ओर
  rationale: ἀγρός का अर्थ ‘खेत’ भी हो सकता है, पर इस प्रसंग में ग्रामीण क्षेत्र या देहात संभावित है। ‘देहात की ओर’ आधुनिक हिन्दी में गंतव्य को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ἐν ἑτέρᾳ μορφῇ में पुनरुत्थान के बाद दिखाई देने की प्रकृति
  choice: ‘एक भिन्न रूप में’ कहकर वर्णनात्मक और खुला रखा गया है।
  alternative: ‘भिन्न स्वरूप के साथ’ या ‘दूसरे रूप में’
  rationale: पद यह नहीं बताता कि भिन्नता यीशु के बाहरी स्वरूप में थी, देखने वालों की पहचान में थी, या किसी अन्य रीति से। अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार है, जबकि मूल पाठ का कालक्रम, दोनों व्यक्तियों का समूह से संबंध, साथ-साथ चल रही क्रियाएँ और ‘भिन्न रूप’ की अस्पष्टता सुरक्षित हैं।
