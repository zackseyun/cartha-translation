  text: ⟦Ἀναστὰς δὲ πρωῒ πρώτῃ σαββάτου ἐφάνη πρῶτον Μαρίᾳ τῇ Μαγδαληνῇ, ⸀παρ’ ἧς ἐκβεβλήκει ἑπτὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/009.yaml
  text: After he had risen[a], early on the first day of the week, he appeared first to Mary Magdalene, from whom he had cast out seven demons.
translation:
  language: hi
  text: वह जी उठने के बाद[a], सप्ताह के पहले दिन भोर को, सबसे पहले मरियम मगदलीनी को दिखाई दिया, जिसमें से उसने सात दुष्टात्माएँ निकाली थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मरकुस 16:9–20 कुछ प्राचीन हस्तलिपियों में नहीं मिलते; अन्य हस्तलिपियों में ये पद पाए जाते हैं, कभी-कभी कुछ भिन्नताओं के साथ।
    reason: textual_variant
lexical_decisions:
- source_word: Ἀναστὰς
  choice: जी उठने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया ἐφάνη से पहले घटित क्रिया को व्यक्त करता है; यह रूप स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट रखता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: यह हल्का प्रसंग-संयोजक है। हिन्दी में यहाँ अतिरिक्त ‘अब’ या विरोधसूचक ‘परन्तु’ जोड़ना कृत्रिम अथवा अधिक प्रबल होता; वाक्य-प्रवाह स्वयं संयोजन व्यक्त करता है।
- source_word: πρωῒ πρώτῃ σαββάτου
  choice: सप्ताह के पहले दिन भोर को
  rationale: यह यहूदी-यूनानी काल-सूचक मुहावरा सप्ताह के पहले दिन के आरम्भिक समय को दर्शाता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: ἐφάνη
  choice: दिखाई दिया
  rationale: पुनरुत्थान के बाद प्रकट होने के प्रसंग में यह स्वाभाविक हिन्दी समतुल्य है और क्रिया के दृश्य रूप से उपस्थित होने के भाव को बनाए रखता है।
- source_word: πρῶτον
  choice: सबसे पहले
  rationale: यह प्रकट होने की घटनाओं का क्रम बताता है; ‘सबसे पहले’ हिन्दी में यह क्रम स्पष्ट करता है।
- source_word: Μαρίᾳ τῇ Μαγδαληνῇ
  choice: मरियम मगदलीनी को
  rationale: नाम और स्थान-संबंधी उपाधि के लिए प्रचलित, सहज हिन्दी रूप अपनाया गया है; सम्प्रदान कारक को ‘को’ से व्यक्त किया गया है।
- source_word: παρ’ ἧς ἐκβεβλήκει
  choice: जिसमें से उसने … निकाली थीं
  rationale: यह मरियम को उस व्यक्ति के रूप में पहचानता है जिसमें से दुष्टात्माएँ निकाली गई थीं। पूर्णभूत क्रिया उस घटना का इस दर्शन से पहले होना बनाए रखती है।
- source_word: ἑπτὰ δαιμόνια
  choice: सात दुष्टात्माएँ
  rationale: संख्या को अक्षरशः रखा गया है और सुसमाचारों के झाड़-फूँक संबंधी प्रसंग में δαιμόνια के लिए सामान्य, समझने योग्य हिन्दी शब्द चुना गया है।
theological_decisions:
- issue: मरकुस 16:9 का पाठालोचनात्मक स्थान
  choice: दिए गए यूनानी पाठ के अनुसार पद का अनुवाद किया गया और 16:9–20 की पाठगत स्थिति पाद-टिप्पणी में बताई गई।
  alternative: कुछ प्राचीन हस्तलिपियों में मरकुस 16:8 पर समाप्त होता है; अन्य में 16:9–20 मिलता है, कभी-कभी भिन्नताओं सहित।
  rationale: SBLGNT इस अंश को कोष्ठकित/विवादित रूप में देता है। पद को हटाने या निर्विवाद मानने के बजाय मुख्य पाठ में उसका अनुवाद और पाद-टिप्पणी में साक्ष्य की स्थिति देना पाठगत तनाव को सुरक्षित रखता है।
- issue: πρωῒ का वाक्यगत संबंध
  choice: ‘भोर को’ को मुख्य क्रिया ‘दिखाई दिया’ के समय-संदर्भ के साथ सहज रूप से रखा गया।
  alternative: इसे ‘सप्ताह के पहले दिन भोर को जी उठकर’ कहकर विशेष रूप से पुनरुत्थान के समय से जोड़ा जा सकता है।
  rationale: यूनानी शब्द-क्रम दोनों तत्वों को निकट रखता है और विराम-चिह्न मूल हस्तलिपि का निश्चित भाग नहीं है। चुना हुआ हिन्दी विन्यास अनावश्यक रूप से पुनरुत्थान की ठीक घड़ी निर्धारित नहीं करता, जबकि पूरे वाक्य का भोर का समय बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘वह’ का संदर्भ प्रसंग से यीशु है; मूल में नाम न होने के कारण उसे जोड़ा नहीं गया। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में उसी स्थान पर रखा गया है जहाँ विवादित दीर्घ समापन की पाठगत सूचना पाठक को शीघ्र मिल सके।
