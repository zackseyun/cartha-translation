source:
  edition: SBLGNT
  text: ἀλλὰ ὑπάγετε εἴπατε τοῖς μαθηταῖς αὐτοῦ καὶ τῷ Πέτρῳ ὅτι Προάγει ὑμᾶς εἰς τὴν Γαλιλαίαν· ἐκεῖ αὐτὸν ὄψεσθε, καθὼς εἶπεν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/007.yaml
  text: But go[a], tell his disciples and Peter, ‘He is going ahead of you into Galilee. There you will see him[b], just as he told you.’
translation:
  language: hi
  text: पर तुम जाओ और उसके चेलों और पतरस से कहो[a], ‘वह तुमसे पहले गलील जा रहा है। वहीं तुम उसे देखोगे[b], जैसा उसने तुमसे कहा था।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पतरस का नाम ‘उसके चेलों’ से अलग लेकर कहा गया है। यह उसके इन्कार के बाद उसकी पुनर्स्थापना की ओर संकेत कर सकता है, पर यूनानी पाठ स्पष्ट रूप से ‘विशेषकर पतरस’ नहीं कहता।
    reason: alternative_reading
  - marker: b
    text: या, ‘गलील की ओर।’ यूनानी पूर्वसर्ग यहाँ गमन के गन्तव्य को सूचित करता है; मुख्य पाठ में ‘गलील’ उसी अर्थ का स्वाभाविक हिन्दी रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह पिछले प्रसंग के विपरीत एक स्पष्ट मोड़ दिखाता है और आधुनिक हिन्दी में संक्षिप्त व स्वाभाविक है।
- source_word: ὑπάγετε
  choice: तुम जाओ
  rationale: बहुवचन आज्ञा का सीधा और स्वाभाविक रूप; आदेश की तत्परता बनाए रखता है।
- source_word: εἴπατε
  choice: कहो
  rationale: संदेश सुनाने के संदर्भ में दत्तिवाचक प्राप्तकर्ताओं के साथ स्वाभाविक हिन्दी प्रयोग।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: उसके चेलों
  rationale: यीशु के शिष्यों के लिए सामान्य, सुबोध और बाइबिलीय हिन्दी; सम्बन्धसूचक भाव स्पष्ट है।
- source_word: καὶ τῷ Πέτρῳ
  choice: और पतरस से
  rationale: καί के साधारण समन्वय को बनाए रखता है और ‘विशेषकर’ या ‘जिसमें पतरस भी है’ जैसी व्याख्या नहीं जोड़ता।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण
  rationale: ὅτι द्वारा आरम्भ संदेश-विषय को हिन्दी में प्रत्यक्ष कथन के रूप में स्पष्ट और स्वाभाविक ढंग से प्रस्तुत किया गया है।
- source_word: Προάγει ὑμᾶς
  choice: वह तुमसे पहले ... जा रहा है
  rationale: प्रचलित वर्तमान क्रिया तथा आगे जाने के दिशात्मक अर्थ, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील जा रहा है
  rationale: εἰς यहाँ गन्तव्य सूचित करता है; हिन्दी में ‘गलील जा रहा है’ ‘गलील में जा रहा है’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: गलील की ओर स्पष्ट स्थान-संकेत देता है; बलयुक्त ‘वहीं’ प्रसंग में स्वाभाविक है।
- source_word: αὐτὸν ὄψεσθε
  choice: तुम उसे देखोगे
  rationale: भविष्यकालीन दर्शन अथवा भेंट के अर्थ को बिना अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
- source_word: καθὼς εἶπεν ὑμῖν
  choice: ठीक जैसा उसने तुमसे कहा था
  rationale: पूर्व कथन के साथ सटीक अनुरूपता तथा भूतकालीन सन्दर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: चेलों के बाद पतरस का अलग उल्लेख
  choice: ‘उसके चेलों और पतरस’ का सीधा समन्वित रूप
  alternative: ‘उसके चेलों, विशेषकर पतरस’ अथवा ‘उसके चेलों—पतरस सहित’
  rationale: यूनानी पाठ पतरस को अलग से नामित करता है, पर व्याकरणतः ‘विशेषकर’ या ‘सहित’ नहीं कहता। सीधा रूप सम्भावित पुनर्स्थापना-संकेत और कथा के तनाव को बिना निश्चित व्याख्या थोपे सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘चेला’ सामान्य पाठक और मरकुस की कथाभाषा के लिए सुबोध है। प्रत्यक्ष उद्धरण मूल संदेश की जीवंतता रखता है; अनावश्यक धर्मवैज्ञानिक स्पष्टीकरण मुख्य पाठ में नहीं जोड़ा गया।
