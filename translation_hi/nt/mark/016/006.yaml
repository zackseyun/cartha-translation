source:
  edition: SBLGNT
  text: ὁ δὲ λέγει αὐταῖς· Μὴ ἐκθαμβεῖσθε· Ἰησοῦν ζητεῖτε τὸν Ναζαρηνὸν τὸν ἐσταυρωμένον· ἠγέρθη, οὐκ ἔστιν ὧδε· ἴδε ὁ τόπος ὅπου ἔθηκαν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/006.yaml
  text: But he says to them[a], “Do not be alarmed. You are looking for Jesus the Nazarene, the one who has been crucified. He has been raised; he is not here[b]. Look—the place where they laid him.”
translation:
  language: hi
  text: पर वह उनसे कहता है, “घबराओ मत। तुम नासरी[a] यीशु को ढूँढ़ रही हो, जिसे क्रूस पर चढ़ाया गया था। उसे पुनर्जीवित किया गया है[b]; वह यहाँ नहीं है। देखो, यह वह स्थान है जहाँ उन्होंने उसे रखा था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नासरत का निवासी।” यूनानी में नासरत से बना एक विशेषण पहचान के रूप में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: 'या, “वह जी उठा है।” यूनानी क्रिया निष्क्रिय वाच्य में है: “उसे पुनर्जीवित किया गया है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: λέγει αὐταῖς
  choice: वह उनसे कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखकर मरकुस की सजीव वर्णन-शैली सुरक्षित रखी गई है।
- source_word: ἐκθαμβεῖσθε
  choice: घबराओ मत
  rationale: यह क्रिया केवल आश्चर्य नहीं, बल्कि तीव्र व्याकुलता या भयमिश्रित घबराहट व्यक्त करती है; आधुनिक हिन्दी में यह स्वाभाविक और प्रसंगानुकूल है।
- source_word: ζητεῖτε
  choice: ढूँढ़ रही हो
  rationale: वर्तमान काल की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया है; स्त्रीलिंग बहुवचन प्रसंग में संबोधित स्त्रियों के अनुरूप है।
- source_word: Ναζαρηνὸν
  choice: नासरी
  rationale: नासरत से बना यूनानी विशेषण यहाँ यीशु की प्रचलित पहचान या उपाधि के रूप में प्रयुक्त है; ‘नासरी’ उसके संक्षिप्त विशेषणात्मक रूप को बनाए रखता है।
- source_word: ἐσταυρωμένον
  choice: जिसे क्रूस पर चढ़ाया गया था
  rationale: यह यीशु की पहचान कराने वाले पूर्ण हुए क्रूसारोहण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠγέρθη
  choice: उसे जिलाया गया है
  rationale: यह यूनानी के निष्क्रिय वाच्य को बनाए रखता है और कर्ता को स्पष्ट रूप से जोड़े बिना निहित दिव्य कार्य की गुंजाइश सुरक्षित रखता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἴδε
  choice: देखो
  rationale: यह सुनने वालों का ध्यान सामने के प्रमाण की ओर दृढ़ता से खींचता है और आधुनिक हिन्दी में सहज है।
- source_word: τόπος
  choice: स्थान
  rationale: कब्र के भीतर उस निश्चित जगह के लिए गरिमापूर्ण और सामान्य हिन्दी शब्द है।
- source_word: ἔθηκαν
  choice: उन्होंने उसे रखा था
  rationale: यह उन लोगों के कार्य को व्यक्त करता है जिन्होंने यीशु का शरीर कब्र में रखा; ‘रखा था’ इस प्रसंग में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: पुनरुत्थान के कथन का वाच्य
  choice: उसे जिलाया गया है
  alternative: वह जी उठा है
  rationale: यूनानी ἠγέρθη निष्क्रिय वाच्य में है। मुख्य पाठ में निष्क्रिय वाच्य रखने से मूल रूप और निहित दिव्य कर्तृत्व सुरक्षित रहते हैं; सक्रिय भाव वाला स्वाभाविक विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ऐतिहासिक वर्तमान ‘कहता है’ से मरकुस की सजीव शैली बनी रहती है। संबोधित जन स्त्रियाँ हैं, इसलिए ‘ढूँढ़ रही हो’ स्त्रीलिंग बहुवचन में है।
