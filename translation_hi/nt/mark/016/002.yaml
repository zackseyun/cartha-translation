  yaml_path: translation/nt/mark/016/002.yaml
  text: And very early on the first day of the week[c][b][a], they come to the tomb when the sun had risen.
translation:
  language: hi
  text: और सप्ताह के पहले दिन बहुत सवेरे, जब सूरज निकल चुका था,[a] वे कब्र पर आती हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूरज निकलने के बाद।” यूनानी की संबंधकारक निरपेक्ष रचना उनके पहुँचने का समय बताती है।
    reason: lexical_alternative
  - marker: b
    text: मरकुस यहाँ ऐतिहासिक वर्तमान काल, “आती हैं,” का प्रयोग करते हैं; हिन्दी में इसे “आईं” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λίαν πρωῒ
  choice: बहुत सवेरे
  rationale: λίαν, πρωῒ की तीव्रता बढ़ाता है। ‘बहुत सवेरे’ आधुनिक हिन्दी में स्वाभाविक है और समय पर दिए गए बल को बनाए रखता है।
- source_word: τῇ μιᾷ τῶν σαββάτων
  choice: सप्ताह के पहले दिन
  rationale: शाब्दिक रूप ‘सब्तों के पहले [दिन]’ एक सामी/कोइने मुहावरा है, जिसका अर्थ सप्ताह का पहला दिन है। हिन्दी में अर्थानुकूल मुहावरेदार रूप रखा गया है।
- source_word: ἔρχονται
  choice: वे ... आते हैं
  rationale: मरकुस के ऐतिहासिक वर्तमान को बनाए रखा गया है, जिससे कथा की सजीवता सुरक्षित रहती है।
- source_word: ἐπὶ τὸ μνημεῖον
  choice: कब्र पर
  rationale: दफ़नाने के प्रसंग में μνημεῖον के लिए ‘कब्र’ सामान्य, स्पष्ट हिन्दी है; ἐπί के साथ कर्मकारक यहाँ गंतव्य की ओर गति व्यक्त करता है।
- source_word: ἀνατείλαντος τοῦ ἡλίου
  choice: जब सूरज निकल चुका था
  rationale: संबंधकारक निरपेक्ष रचना आगमन के समय की परिस्थिति बताती है। ‘जब’ यूनानी से अधिक कठोर ‘बाद’ का संबंध जोड़े बिना कालगत अर्थ देता है, और ‘निकल चुका था’ उदय की पूर्ण हुई क्रिया को दर्शाता है।
