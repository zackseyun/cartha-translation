  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सप्ताह के पहले दिन’ यूनानी मुहावरे का स्पष्ट हिन्दी अर्थ है। ऐतिहासिक वर्तमान को मुख्य पाठ में सुरक्षित रखा गया है।
