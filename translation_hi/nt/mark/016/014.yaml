source:
  edition: SBLGNT
  text: Ὕστερον ⸀δὲ ἀνακειμένοις αὐτοῖς τοῖς ἕνδεκα ἐφανερώθη, καὶ ὠνείδισεν τὴν ἀπιστίαν αὐτῶν καὶ σκληροκαρδίαν ὅτι τοῖς θεασαμένοις αὐτὸν ⸀ἐγηγερμένον οὐκ ἐπίστευσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/014.yaml
  text: Later[a], he appeared to the eleven themselves as they were reclining at the table, and he rebuked their unbelief and hardness of heart[c][b], because they had not believed those who had seen him after he had been raised.
translation:
  language: hi
  text: बाद में[a], जब वे ग्यारहों टेक लगाकर भोजन कर रहे थे[b], तब यीशु उन्हें प्रकट हुआ। उसने उनके अविश्वास और हृदय की कठोरता के कारण उन्हें फटकारा, क्योंकि उन्होंने उन लोगों पर विश्वास नहीं किया था जिन्होंने उसे जिलाए जाने के बाद देखा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इसके बाद।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द भोजन करते समय प्रचलित ढंग से मेज़ के पास टेक लगाकर लेटने को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: या, ‘जिन्होंने उसे जी उठा हुआ देखा था।’ यूनानी में अधिक शाब्दिक रूप से, ‘जिन्होंने उसे जिलाया गया था, देखा था’; क्रिया का रूप पूर्ण निष्क्रिय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕστερον
  choice: बाद में
  rationale: यह कालवाचक क्रियाविशेषण बाद की घटना को सूचित करता है। ‘बाद में’ सहज आधुनिक हिन्दी है और घटनाक्रम को स्पष्ट रखता है।
- source_word: ἀνακειμένοις
  choice: जब वे भोजन के लिए लेटे हुए थे
  rationale: यह कृदंत प्राचीन काल में भोजन करते समय मेज़ के पास टेक लगाकर लेटने की प्रथा को दर्शाता है। भोजन का संदर्भ स्पष्ट करने से आधुनिक पाठक आशय समझ सकता है।
- source_word: τοῖς ἕνδεκα
  choice: वे ग्यारहों
  rationale: यह यहूदा के चले जाने के बाद शेष प्रेरितों के समूह को सूचित करता है। ‘ग्यारहों’ पूरे निर्दिष्ट समूह पर बल देता है।
- source_word: ἐφανερώθη
  choice: उनके सामने प्रकट हुआ
  rationale: पुनरुत्थान के बाद दिखाई देने के संदर्भ में ‘प्रकट हुआ’ स्वाभाविक और अर्थ-सटीक है।
- source_word: ὠνείδισεν
  choice: फटकारा
  rationale: यह शब्द कड़ी मौखिक भर्त्सना व्यक्त करता है; ‘फटकारा’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἀπιστίαν
  choice: अविश्वास
  rationale: यहाँ आशय दिए गए साक्ष्य पर विश्वास न करने से है; ‘अविश्वास’ संज्ञा के सीधे बल को बनाए रखता है।
- source_word: σκληροκαρδίαν
  choice: हृदय की कठोरता
  rationale: यह अनुवाद मूल बाइबलीय रूपक और भीतर से प्रतिरोध करने के भाव को बनाए रखता है।
- source_word: θεασαμένοις
  choice: जिन्होंने ... देखा था
  rationale: यह कृदंत प्रत्यक्षदर्शियों को सूचित करता है। ‘देखा था’ सरल हिन्दी में साक्षी होने का अर्थ पर्याप्त रूप से व्यक्त करता है।
- source_word: ἐγηγερμένον
  choice: जिलाए जाने के बाद
  rationale: यूनानी पूर्ण निष्क्रिय कृदंत के पुनरुत्थान-संबंधी अर्थ और निष्क्रिय भाव को स्वाभाविक हिन्दी में सुरक्षित रखा गया है। अधिक शाब्दिक रचना को पादटिप्पणी में दिया गया है।
- source_word: οὐκ ἐπίστευσαν
  choice: विश्वास नहीं किया था
  rationale: भूतपूर्ण रूप यह स्पष्ट करता है कि यीशु के इस प्रकटन से पहले वे प्रत्यक्षदर्शियों की गवाही स्वीकार नहीं कर चुके थे।
theological_decisions:
- issue: ἐγηγερμένον में पुनरुत्थान का निष्क्रिय रूप
  choice: उसे जिलाए जाने के बाद देखा था
  alternative: उसे जी उठा हुआ देखा था
  rationale: मुख्य पाठ निष्क्रिय रूप को बनाए रखता है और यह नहीं बताता कि कर्ता कौन था; इस प्रकार मूल की अभिव्यक्ति और उसका धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: σκληροκαρδία का रूपक
  choice: हृदय की कठोरता
  alternative: हठ
  rationale: मूल का रूपक आध्यात्मिक प्रतिरोध का व्यापक बाइबलीय भाव रखता है; केवल ‘हठ’ कहने से वह अर्थ संकुचित हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली अपनाई गई है। सांस्कृतिक रूप से अपरिचित भोजन-मुद्रा को मुख्य पाठ में संक्षेप से स्पष्ट किया गया है और पादटिप्पणी में उसका संदर्भ दिया गया है। ‘यीशु’ नाम स्पष्टता के लिए जोड़ा गया है, क्योंकि यूनानी सर्वनाम का संदर्भ वही है।
