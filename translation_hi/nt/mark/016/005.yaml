source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσαι εἰς τὸ μνημεῖον εἶδον νεανίσκον καθήμενον ἐν τοῖς δεξιοῖς περιβεβλημένον στολὴν λευκήν, καὶ ἐξεθαμβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/005.yaml
  text: And when they entered the tomb, they saw a young man sitting on the right, clothed in a white robe, and they were alarmed.
translation:
  language: hi
  text: और जब वे कब्र में प्रवेश कर गईं, तो उन्होंने दाहिनी ओर बैठा हुआ एक युवक[a] देखा, जो सफेद वस्त्र पहने हुए था, और वे बहुत घबरा गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक अनुवाद: ‘स्वर्गदूत।’ मरकुस यहाँ उसका वर्णन ‘एक युवक’ के रूप में करता है; फिर भी व्यापक प्रसंग और समानांतर वृत्तांत उसे स्वर्गदूत-संदेशवाहक के रूप में समझने का आधार देते हैं।'
    reason: मुख्य पाठ में मरकुस की वर्णनात्मक शब्दावली और उसकी अस्पष्टता बनाए रखते हुए संभावित पहचान को फुटनोट में प्रस्तुत करना।
lexical_decisions:
- source_word: εἰσελθοῦσαι
  choice: जब वे ... भीतर गईं
  rationale: स्त्रीलिंग बहुवचन अओरिस्ट कृदंत का संबंध प्रसंग में स्त्रियों से है। हिंदी में मुख्य क्रिया के साथ इसका कालगत संबंध स्वाभाविक रूप से व्यक्त करने के लिए ‘जब ... गईं’ चुना गया।
- source_word: μνημεῖον
  choice: कब्र
  rationale: यह शब्द यहाँ यीशु के शव को रखे जाने वाले दफन-स्थान को दर्शाता है। आधुनिक हिंदी में ‘कब्र’ सबसे सहज और स्पष्ट शब्द है।
- source_word: νεανίσκον
  choice: युवक
  rationale: यूनानी शब्द सीधे एक युवा पुरुष को दर्शाता है। पद में उसे स्पष्ट रूप से ‘स्वर्गदूत’ नहीं कहा गया है, इसलिए वर्णनात्मक शब्द ‘युवक’ रखा गया।
- source_word: καθήμενον ἐν τοῖς δεξιοῖς
  choice: दाहिनी ओर बैठे
  rationale: इससे कब्र के भीतर युवक की मुद्रा और स्थान दोनों संक्षिप्त तथा स्वाभाविक हिंदी में व्यक्त होते हैं।
- source_word: περιβεβλημένον στολὴν λευκήν
  choice: जिसने सफेद लंबा वस्त्र पहन रखा था
  rationale: परिपूर्ण कृदंत पहने हुए होने की वर्तमान अवस्था बताता है। ‘लंबा वस्त्र’ στολή के विशिष्ट, लहराते बाहरी परिधान के भाव को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: ἐξεθαμβήθησαν
  choice: वे बहुत घबरा गईं
  rationale: क्रिया तीव्र विस्मय और व्याकुलता की प्रतिक्रिया व्यक्त करती है। ‘बहुत घबरा गईं’ केवल आश्चर्य से अधिक तीव्रता दिखाता है, पर अनावश्यक रूप से पूर्ण आतंक नहीं जोड़ता।
theological_decisions:
- issue: νεανίσκος की पहचान
  choice: मुख्य पाठ में ‘युवक’
  alternative: ‘स्वर्गदूत’
  rationale: श्वेत वस्त्र, व्यापक पुनरुत्थान-प्रसंग और समानांतर वृत्तांत स्वर्गदूतीय संदेशवाहक की ओर संकेत करते हैं, किंतु मरकुस 16:5 स्वयं νεανίσκος, अर्थात ‘युवक’, कहता है। मुख्य पाठ मरकुस की वर्णनात्मक शब्दावली और उसकी अंतर्निहित अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पहन रखा था’ स्वाभाविक हिंदी में परिपूर्ण अवस्था व्यक्त करता है, और स्त्रीलिंग बहुवचन क्रियाएँ पिछले प्रसंग की स्त्रियों को स्पष्ट रूप से सूचित करती हैं।
