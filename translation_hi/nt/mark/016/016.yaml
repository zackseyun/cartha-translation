  yaml_path: translation/nt/mark/016/016.yaml
  text: The one who has believed and been baptized will be saved[b][a], but the one who has disbelieved will be condemned.
translation:
  language: hi
  text: जिसने विश्वास किया और बपतिस्मा लिया, वह उद्धार पाएगा[b][a]; पर जिसने विश्वास नहीं किया, वह दोषी ठहराया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक सामान्य शैली में: “जो विश्वास करता और बपतिस्मा लेता है, वह उद्धार पाएगा; पर जो विश्वास नहीं करता, वह दोषी ठहराया जाएगा।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “जिसने विश्वास किया है और बपतिस्मा लिया है।”'
    reason: previous_rendering
lexical_decisions:
- source_word: ὁ πιστεύσας
  choice: जिसने विश्वास किया
  rationale: लेखयुक्त एओरिस्ट कृदंत यहाँ संज्ञा के समान प्रयुक्त होकर किसी प्रतिनिधि व्यक्ति को उसके विश्वास करने के कार्य से पहचानता है। हिंदी में ‘जिसने विश्वास किया’ एकवचन और पूर्ण हुए कार्य—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: βαπτισθεὶς
  choice: बपतिस्मा लिया है
  rationale: एओरिस्ट कर्मवाच्य कृदंत भावी परिणाम से पहले हुए कार्य को सूचित करता है। हिंदी में प्रचलित ‘बपतिस्मा लिया है’ स्वाभाविक है और अर्थतः बपतिस्मा ग्रहण करने को व्यक्त करता है; शाब्दिक कर्मवाच्य ‘बपतिस्मा दिया गया है’ यहाँ अनावश्यक रूप से भारी होता।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: इस संदर्भ में σῴζω का धार्मिक अर्थ उद्धार है। ‘उद्धार पाएगा’ भविष्य और ग्रहण किए जाने वाले उद्धार, दोनों को स्पष्ट तथा प्रतिष्ठित हिंदी में व्यक्त करता है।
- source_word: ὁ δὲ ἀπιστήσας
  choice: पर जिसने विश्वास नहीं किया
  rationale: ἀπιστέω, πιστεύω का नकारात्मक प्रतिपक्ष है। ‘विश्वास नहीं किया’ आधुनिक हिंदी में ‘अविश्वास किया’ की अपेक्षा अधिक स्वाभाविक है और लेखयुक्त एकवचन कृदंत की प्रतिनिधिक संरचना बनाए रखता है।
- source_word: κατακριθήσεται
  choice: दोषी ठहराया जाएगा
  rationale: भविष्य कर्मवाच्य रूप प्रतिकूल न्याय और दंडादेश को सूचित करता है। ‘दोषी ठहराया जाएगा’ न्यायिक आशय को स्पष्ट और सहज हिंदी में रखता है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों कृदंतों को सीधे जोड़ता है; ‘और’ बिना अतिरिक्त बल जोड़े वही संबंध सुरक्षित रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह सकारात्मक और नकारात्मक परिणामों के बीच विरोध दिखाता है; ‘पर’ संक्षिप्त और स्वाभाविक विरोधसूचक है।
theological_decisions:
- issue: विश्वास और बपतिस्मा का उद्धार से संबंध
  choice: विश्वास और बपतिस्मा—दोनों को उद्धार पाने वाले व्यक्ति के वर्णन में सीधे जोड़ा गया है, पर किसी एक की कारणात्मक भूमिका को अनुवाद में अतिरिक्त रूप से परिभाषित नहीं किया गया।
  alternative: बपतिस्मा को उद्धार का स्पष्ट साधन बताना, या उसे कथन से लगभग असंबद्ध कर देना।
  rationale: यूनानी पाठ पहले उपवाक्य में विश्वास और बपतिस्मा दोनों को जोड़ता है, जबकि दूसरे उपवाक्य में दोषी ठहराए जाने का संबंध केवल विश्वास न करने से व्यक्त करता है। अनुवाद इस तनाव को बिना सांप्रदायिक निष्कर्ष जोड़े सुरक्षित रखता है।
- issue: प्रतिनिधिक पुल्लिंग एकवचन रचना
  choice: ‘जिसने … वह’ की एकवचन रचना
  alternative: ‘जो लोग … वे’ अथवा सामान्य बहुवचन परिभाषा।
  rationale: यूनानी में पुल्लिंग एकवचन संज्ञात्मक कृदंत सामान्य प्रतिनिधिक अर्थ में हैं। हिंदी की ‘जिसने … वह’ रचना एकवचन बनाए रखते हुए स्वाभाविक रूप से किसी भी व्यक्ति पर लागू होती है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिंदी। ‘बपतिस्मा’ और ‘उद्धार’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं। मुख्य पाठ में एकवचन कृदंतों और पहले उपवाक्य के पूर्णतामूलक भाव को यथासंभव स्वाभाविक हिंदी में सुरक्षित रखा गया है।
