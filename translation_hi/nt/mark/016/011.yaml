  text: κἀκεῖνοι ἀκούσαντες ὅτι ζῇ καὶ ἐθεάθη ὑπ’ αὐτῆς ἠπίστησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/011.yaml
  text: And they[a], when they heard that he was alive and had been seen by her[b], did not believe.
translation:
  language: hi
  text: और जब उन्होंने सुना कि वह जीवित है[a] और उसे उस स्त्री ने देखा था,[b] तो उन्होंने विश्वास नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जी रहा है” अथवा “वह जीता है।” यूनानी क्रिया वर्तमान-काल में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह उसके द्वारा देखा गया था।”
    reason: voice_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: और उन्होंने
  rationale: καί और ἐκεῖνοι का संयुक्त रूप पिछले प्रसंग से कथा को जोड़ता और पहले बताए गए लोगों की ओर संकेत करता है। हिंदी में ‘और उन्होंने’ स्वाभाविक रूप से दोनों कार्य करता है।
- source_word: ἀκούσαντες
  choice: जब उन्होंने सुना
  rationale: यह एओरिस्ट कृदंत यहाँ समय-संबंधी है और मुख्य क्रिया से पहले सुनी गई बात को दर्शाता है।
- source_word: ὅτι ζῇ
  choice: कि वह जीवित है
  rationale: ζῇ वर्तमान-काल में है और मृत्यु के बाद उसके जीवित होने की बात व्यक्त करता है। हिंदी में भूतकालीन ‘सुना’ के बाद भी ‘जीवित है’ स्वाभाविक है और जारी जीवन का भाव बनाए रखता है।
- source_word: ἐθεάθη ὑπ’ αὐτῆς
  choice: उसने उसे देखा था
  rationale: यूनानी में क्रिया कर्मवाच्य है—‘वह उसके द्वारा देखा गया था।’ आधुनिक हिंदी में सक्रिय रचना अधिक स्वाभाविक है और देखने वाली स्त्री तथा देखे गए पुरुष का वही संबंध रखती है; कर्मवाच्य विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἠπίστησαν
  choice: उन्होंने विश्वास नहीं किया
  rationale: यह सीधा और सहज अनुवाद है, जो अविश्वास बताता है पर ‘मानने से इनकार किया’ जैसा अतिरिक्त इच्छापूर्वक विरोध का भाव नहीं जोड़ता।
theological_decisions:
- issue: पुनरुत्थान के बाद जीवन को वर्तमान-काल में व्यक्त करना
  choice: वह जीवित है
  alternative: वह जी रहा है / वह जीता है
  rationale: यूनानी ζῇ वर्तमान-काल में है। ‘जीवित है’ यीशु के मृत्यु के बाद जीवित होने और उस जीवन के जारी रहने—दोनों को सहज हिंदी में व्यक्त करता है।
- issue: मरियम द्वारा यीशु को देखने का वर्णन
  choice: उसने उसे देखा था
  alternative: वह उसके द्वारा देखा गया था / वह उसे दिखाई दिया था
  rationale: सक्रिय हिंदी वाक्य स्वाभाविक है और यूनानी कर्मवाच्य का मूल संबंध सुरक्षित रखता है। ‘दिखाई दिया’ संभव है, पर वह स्वयं को प्रकट करने का भाव कुछ अधिक प्रमुख कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सर्वनामों को मूल पाठ के अनुसार बनाए रखा गया है; इसी पद में स्त्री का नाम जोड़कर स्पष्ट नहीं किया गया।
