- source_word: ἀναβλέψασαι
  choice: ऊपर नज़र उठाकर
  rationale: यह क्रिया-विशेषणीय प्रयोग स्त्रियों के कब्र की ओर दृष्टि उठाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: θεωροῦσιν
  choice: देखा
  rationale: वर्तमानकालीन ऐतिहासिक कथन को हिन्दी की स्वाभाविक भूतकालीन कथा-शैली में रखा गया है; यहाँ दृश्य रूप से ध्यान देने का सामान्य अर्थ है।
- source_word: ἀποκεκύλισται
  choice: लुढ़काकर हटा दिया गया था
  rationale: पूर्ण निष्क्रिय रूप पहले पूरी हो चुकी क्रिया और उसकी बनी हुई अवस्था दोनों बताता है; हिन्दी का भूतपूर्ण काल इस कथा-दृष्टि को स्पष्ट रखता है।
- source_word: ὁ λίθος
  choice: पत्थर
  rationale: संदर्भ में यह कब्र के द्वार को बंद करने वाला पत्थर है, पर मूल में केवल ‘पत्थर’ है, इसलिए अनावश्यक व्याख्या नहीं जोड़ी गई।
- source_word: ἦν γὰρ μέγας σφόδρα
  choice: क्योंकि वह बहुत ही बड़ा था
  rationale: γάρ का कारणसूचक संबंध और σφόδρα का प्रबल जोर स्वाभाविक, गरिमापूर्ण हिन्दी में सुरक्षित है।
- source_word: καὶ
  choice: और
  rationale: कथा की साधारण संयोजक निरंतरता को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
