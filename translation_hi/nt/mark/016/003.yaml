lexical_decisions:
- source_word: ἔλεγον
  choice: कह रही थीं
  rationale: अपूर्ण भूतकाल जारी या बार-बार हो रही बातचीत का भाव देता है; स्त्रीलिंग बहुवचन कर्ता के अनुसार यह स्वाभाविक हिन्दी है।
- source_word: πρὸς ἑαυτάς
  choice: आपस में
  rationale: शाब्दिक अर्थ ‘अपने-आप से’ है, पर बहुवचन और प्रसंग में पारस्परिक बातचीत अभिप्रेत है; ‘आपस में’ आधुनिक हिन्दी में सहज है।
- source_word: ἀποκυλίσει
  choice: लुढ़काएगा
  rationale: क्रिया पत्थर को लुढ़काकर उसके स्थान से हटाने की ठोस छवि व्यक्त करती है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: सम्प्रदान कारक यहाँ लाभार्थक अर्थ देता है—उनकी ओर से यह काम करना।
- source_word: τὸν λίθον
  choice: पत्थर
  rationale: मूल में केवल निश्चित ‘पत्थर’ है; आकार का कोई विशेषण इस पद में नहीं जोड़ा गया।
- source_word: ἐκ τῆς θύρας τοῦ μνημείου
  choice: कब्र के द्वार से
  rationale: θύρα का अर्थ ‘द्वार’ या ‘प्रवेश-द्वार’ हो सकता है; ‘कब्र के द्वार’ से पत्थर हटाने की स्थिति हिन्दी में स्पष्ट रहती है और मूल रूपक संरक्षित होता है।
- source_word: μνημεῖον
  choice: कब्र
  rationale: इस प्रसंग में यह शव रखने की कब्र को दर्शाता है; ‘कब्र’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
