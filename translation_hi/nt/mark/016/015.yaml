  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἰς τὸν κόσμον ἅπαντα κηρύξατε τὸ εὐαγγέλιον πάσῃ τῇ κτίσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/015.yaml
  text: And he said to them[b][a], “Go into all the world and proclaim the good news to all creation.”
translation:
  language: hi
  text: और उसने उनसे कहा, “सारे संसार में जाओ और सारी सृष्टि[b] को शुभ समाचार[a] सुनाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुसमाचार।” यूनानी εὐαγγέλιον का शाब्दिक अर्थ “शुभ समाचार” है।
    reason: lexical_alternative
  - marker: b
    text: या “हर प्राणी को।” यूनानी वाक्यांश का अर्थ सामूहिक रूप से “सारी सृष्टि को” या वितरणात्मक रूप से “हर प्राणी को” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Πορευθέντες
  choice: जाओ
  rationale: मुख्य आज्ञार्थक क्रिया κηρύξατε से पहले आया यह कृदंत सहगामी परिस्थिति का भाव रखता है; स्वाभाविक हिन्दी में आज्ञार्थक ‘जाओ’ आदेश की शक्ति को स्पष्ट रूप से व्यक्त करता है।
- source_word: κόσμον ἅπαντα
  choice: सारे संसार में
  rationale: κόσμος यहाँ मिशन के क्षेत्र के रूप में संसार को और ἅπαντα उसकी संपूर्णता को व्यक्त करता है; ‘सारे संसार में’ स्वाभाविक और व्यापक है।
- source_word: κηρύξατε
  choice: सुनाओ
  rationale: κηρύσσω का मूल भाव सार्वजनिक रूप से घोषणा करना है। ‘शुभ समाचार सुनाओ’ आधुनिक हिन्दी में स्वाभाविक है और संदेश के प्रसार का भाव स्पष्ट रखता है; ‘प्रचार करो’ अधिक धार्मिक-संस्थागत सुन सकता है।
- source_word: τὸ εὐαγγέλιον
  choice: शुभ समाचार
  rationale: εὐαγγέλιον का प्रत्यक्ष अर्थ ‘शुभ समाचार’ है। यह अर्थ को सामान्य पाठक तक सहजता से पहुँचाता है, जबकि स्थापित धार्मिक विकल्प ‘सुसमाचार’ पादटिप्पणी में रखा गया है।
- source_word: πάσῃ τῇ κτίσει
  choice: सारी सृष्टि को
  rationale: κτίσις का अर्थ ‘सृष्टि’ अथवा ‘प्राणी’ हो सकता है। ‘सारी सृष्टि को’ यूनानी वाक्यांश की व्यापकता और सामूहिक/ब्रह्मांडीय अनुगूँज को बनाए रखता है।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यह सामान्य कथात्मक भूमिका है और αὐτοῖς सहित यूनानी का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: πάσῃ τῇ κτίσει में आदेश का दायरा
  choice: सारी सृष्टि को
  alternative: हर प्राणी को
  rationale: यूनानी वाक्यांश को सामूहिक रूप से ‘सारी सृष्टि’ या वितरणात्मक रूप से ‘हर प्राणी’ समझा जा सकता है। मुख्य पाठ व्यापक अभिव्यक्ति को सुरक्षित रखता है और पादटिप्पणी वास्तविक वैकल्पिक अर्थ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘शुभ समाचार सुनाओ’ सामान्य पाठक के लिए स्पष्ट है, जबकि पारंपरिक ‘सुसमाचार’ को पादटिप्पणी में सुरक्षित रखा गया है।
