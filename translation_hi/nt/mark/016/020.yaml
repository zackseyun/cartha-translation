source:
  edition: SBLGNT
  text: ἐκεῖνοι δὲ ἐξελθόντες ἐκήρυξαν πανταχοῦ, τοῦ κυρίου συνεργοῦντος καὶ τὸν λόγον βεβαιοῦντος διὰ τῶν ἐπακολουθούντων ⸀σημείων.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/020.yaml
  text: And they went out and proclaimed everywhere[b][a], while the Lord worked with them and confirmed the message through the accompanying signs.
translation:
  language: hi
  text: और वे निकलकर हर जगह प्रचार करते गए[a]। प्रभु उनके साथ कार्य कर रहा था और साथ आनेवाले चिह्नों[b] के द्वारा संदेश की पुष्टि कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सार्वजनिक रूप से घोषणा की।’
    reason: κηρύσσω का मूल भाव सार्वजनिक घोषणा करना है; ‘प्रचार करते गए’ हिन्दी में स्वाभाविक है, पर इसका धार्मिक अर्थ अपेक्षाकृत संकरा समझा जा सकता है।
  - marker: b
    text: या ‘पीछे आनेवाले चिह्नों’ या ‘साथ होनेवाले चिह्नों’।
    reason: ἐπακολουθούντων का अर्थ ‘पीछे आना’ या ‘साथ होना’ हो सकता है; मुख्य पाठ का ‘साथ आनेवाले’ प्रसंगानुकूल रहते हुए इस व्यापकता को सुरक्षित रखता है।
lexical_decisions:
- source_word: ἐκεῖνοι δὲ ἐξελθόντες
  choice: और उन्होंने निकलकर
  rationale: δέ कथा को आगे बढ़ाता है, और अओरिस्ट कृदंत ἐξελθόντες को मुख्य क्रिया के साथ स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: ἐκήρυξαν πανταχοῦ
  choice: हर जगह प्रचार किया
  rationale: κηρύσσω सार्वजनिक घोषणा या प्रचार को व्यक्त करता है; ‘प्रचार किया’ आधुनिक हिन्दी में सहज है और ‘हर जगह’ πανταχοῦ का सीधा अर्थ देता है।
- source_word: τοῦ κυρίου συνεργοῦντος
  choice: प्रभु उनके साथ काम करता रहा
  rationale: जननात्मक स्वतंत्र वाक्यांश को समकालिक पृष्ठभूमि-क्रिया के रूप में व्यक्त किया गया है; ‘प्रभु’ पिछले पद में यीशु के लिए प्रयुक्त उपाधि को बनाए रखता है।
- source_word: τὸν λόγον βεβαιοῦντος
  choice: उस संदेश को प्रमाणित करता रहा
  rationale: यहाँ λόγος प्रचारित संदेश की ओर संकेत करता है और βεβαιόω उसके सत्य या प्रामाणिकता की पुष्टि को व्यक्त करता है।
- source_word: διὰ τῶν ἐπακολουθούντων σημείων
  choice: साथ-साथ होनेवाले चिह्नों के द्वारा
  rationale: διά साधन बताता है। ἐπακολουθούντων में ‘पीछे आने’ और ‘साथ होने’ दोनों की संभावना है; मुख्य पाठ में प्रसंगानुकूल ‘साथ-साथ होनेवाले’ रखा गया और विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘प्रभु’ का संदर्भ
  choice: उपाधि ‘प्रभु’ को बिना विस्तार के रखा गया; निकटवर्ती संदर्भ में यह जी उठे यीशु की ओर संकेत करती है।
  alternative: इसे सामान्य रूप से परमेश्वर के संदर्भ में समझना।
  rationale: मरकुस 16:19 का निकट संदर्भ ‘प्रभु’ को यीशु से जोड़ता है, पर अनुवाद मूल उपाधि से अधिक स्पष्ट पहचान नहीं जोड़ता।
- issue: चिह्नों का कार्य
  choice: चिह्न प्रभु द्वारा संदेश को प्रमाणित करने का साधन हैं।
  alternative: चिह्न केवल प्रचारकों या प्रचार के पीछे हुए, बिना प्रमाणित करने के आशय के।
  rationale: वाक्य-विन्यास ‘संदेश को प्रमाणित करने’ को ‘चिह्नों के द्वारा’ से जोड़ता है; इससे आगे उनकी अवधि या मानकता के विषय में कोई निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘काम करता रहा’ और ‘प्रमाणित करता रहा’ यूनानी वर्तमान कृदंतों की मुख्य प्रचार-क्रिया के साथ चलती हुई क्रिया को दर्शाते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
