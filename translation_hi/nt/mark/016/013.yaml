  yaml_path: translation/nt/mark/016/013.yaml
  text: And they went away and reported it to the rest[a], but they did not believe them either.
translation:
  language: hi
  text: और वे जाकर बाकी लोगों को यह समाचार देने लगे[a], पर बाकी लोगों ने भी उनकी बात पर विश्वास नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरे लोगों को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κἀκεῖνοι
  choice: और उन्होंने
  rationale: यह संयुक्त रूप ‘और वे’ अथवा ‘उन्होंने भी’ का भाव देता है। संदर्भ में इसका संकेत उन दो चेलों की ओर है; हिन्दी में केवल ‘उन्होंने’ कहना स्वाभाविक है और यूनानी से अधिक स्पष्टता नहीं जोड़ता।
- source_word: ἀπελθόντες
  choice: जाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले उनके वहाँ से जाने को दर्शाता है। ‘जाकर’ हिन्दी में घटनाक्रम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπήγγειλαν
  choice: यह समाचार दिया
  rationale: ἀπαγγέλλω का अर्थ सूचना देना, बताना या समाचार पहुँचाना है। यूनानी में कर्म निहित है; ‘यह’ पिछले प्रसंग में वर्णित घटना की ओर संकेत करता है।
- source_word: τοῖς λοιποῖς
  choice: बाकी लोगों को
  rationale: λοιπός यहाँ समूह के शेष लोगों को दर्शाता है। ‘बाकी लोगों’ का प्रयोग आधुनिक हिन्दी में सहज है और यह अनावश्यक रूप से उन्हें ‘चेलों’ के रूप में स्पष्ट नहीं करता।
- source_word: οὐδὲ
  choice: पर ... भी ... नहीं
  rationale: οὐδέ पिछले अविश्वास के साथ इस प्रतिक्रिया को जोड़ता है और ‘इन पर भी विश्वास नहीं किया’ का योगात्मक भाव देता है। प्रसंग में ‘पर’ विरोधी मोड़ को स्वाभाविक बनाता है।
- source_word: ἐκείνοις
  choice: उनकी बात पर
  rationale: दत्तिव बहुवचन सर्वनाम उन दो समाचार देने वालों की ओर लौटता है। हिन्दी में ‘उन पर विश्वास नहीं किया’ व्यक्ति के प्रति भरोसे का अर्थ दे सकता है; ‘उनकी बात पर’ यहाँ उनकी गवाही को न मानने का प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: ἐπίστευσαν
  choice: विश्वास नहीं किया
  rationale: πιστεύω यहाँ सुनाई गई गवाही को सच न मानने के सामान्य कथात्मक अर्थ में है। ‘विश्वास नहीं किया’ इसका मानक और स्पष्ट हिन्दी रूप है।
theological_decisions:
- issue: गवाही के कथात्मक संदर्भ में πιστεύω का अनुवाद
  choice: उनकी बात पर विश्वास नहीं किया
  alternative: उन पर भरोसा नहीं किया
  rationale: इस पद में क्रिया किसी व्यापक धर्मवैज्ञानिक सिद्धान्त के बजाय सुनाई गई बात को स्वीकार न करने का वर्णन करती है। ‘भरोसा’ व्यक्तिगत निर्भरता का अतिरिक्त अर्थ ला सकता है, इसलिए ‘विश्वास’ और ‘उनकी बात पर’ मूल आशय को बेहतर बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बाकी लोगों’ के लिए बोलचाल में प्रचलित रूप चुना गया है, जबकि पादटिप्पणी में सम्भव विकल्प ‘दूसरे लोगों’ दिया गया है। सर्वनामों के संकेत को मूल पाठ और निकटवर्ती संदर्भ से अधिक निश्चित नहीं बनाया गया।
