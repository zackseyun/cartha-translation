  text: ⸀ὄφεις ἀροῦσιν κἂν θανάσιμόν τι πίωσιν οὐ μὴ αὐτοὺς βλάψῃ, ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν καὶ καλῶς ἕξουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/018.yaml
  text: They will pick up snakes[a], and if they drink anything deadly, it will certainly not harm them; they will lay hands on the sick[d][c][b], and they will recover.
translation:
  language: hi
  text: वे साँपों को उठा लेंगे[a][b], और यदि वे कोई प्राणघातक चीज़[c] पी लें, तो उससे उन्हें बिल्कुल हानि नहीं होगी; वे बीमारों पर हाथ रखेंगे, और बीमार लोग ठीक हो जाएँगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पांडुलिपियों में मरकुस 16:9–20 नहीं है; यह पद मरकुस के लंबे अंत का भाग है।
    reason: textual_variant
  - marker: b
    text: या “सर्पों को।”
    reason: lexical_alternative
  - marker: c
    text: या “कोई भी प्राणघातक वस्तु”; यह अभिव्यक्ति व्यापक है और केवल विष तक सीमित नहीं है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से, “वे अच्छे रहेंगे” या “उनकी दशा अच्छी होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄφεις
  choice: साँपों
  rationale: आधुनिक हिन्दी में साँप सबसे सहज और स्पष्ट शब्द है; सर्प अधिक साहित्यिक विकल्प है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἀροῦσιν
  choice: उठा लेंगे
  rationale: αἴρω के उठाने या उठा लेने के सामान्य भौतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी पाठ यह स्पष्ट नहीं करता कि ऐसा जानबूझकर होगा या संयोग से, इसलिए कोई अतिरिक्त आशय नहीं जोड़ा गया।
- source_word: κἂν
  choice: और यदि
  rationale: καὶ ἐάν की शर्तसूचक संरचना को सहज रूप से व्यक्त करता है; अगले खंड की प्रबल नकारात्मकता अलग से बिल्कुल द्वारा सुरक्षित रखी गई है।
- source_word: θανάσιμόν τι
  choice: कोई प्राणघातक चीज़
  rationale: वाक्यांश का अर्थ ऐसी कोई वस्तु है जो मृत्यु का कारण बन सकती हो। यह अनुवाद अर्थ को केवल विष तक सीमित नहीं करता।
- source_word: οὐ μὴ ... βλάψῃ
  choice: बिल्कुल हानि नहीं होगी
  rationale: οὐ μή की प्रबल नकारात्मक शक्ति को केवल नहीं के बजाय बिल्कुल नहीं से व्यक्त किया गया है, जबकि βλάπτω के व्यापक अर्थ के लिए हानि चुना गया है।
- source_word: ἐπὶ ἀρρώστους χεῖρας ἐπιθήσουσιν
  choice: बीमारों पर हाथ रखेंगे
  rationale: यह यूनानी क्रिया-विन्यास का हिन्दी में प्रचलित और स्पष्ट रूप है तथा किसी विशेष धार्मिक विधि का अतिरिक्त विवरण नहीं जोड़ता।
- source_word: καλῶς ἕξουσιν
  choice: ठीक हो जाएँगे
  rationale: शाब्दिक रूप से उनकी दशा अच्छी होगी के अर्थ को बीमारी के प्रसंग में स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रतिज्ञात सुरक्षा और चंगाई का स्वरूप
  choice: पद में बताए गए कार्यों और परिणामों को सीधे भविष्यकालीन कथनों के रूप में रखा गया है।
  alternative: इन्हें हर विश्वासी और हर युग के लिए अनिवार्य नियम, केवल प्रेरितकाल तक सीमित चिन्ह, या पूर्णतः प्रतीकात्मक भाषा मानना।
  rationale: यूनानी पाठ इन व्याख्यात्मक सीमाओं में से किसी को स्पष्ट रूप से नहीं जोड़ता; इसलिए अनुवाद धर्म-सांप्रदायिक निष्कर्ष थोपे बिना कथन का तनाव बनाए रखता है।
- issue: मरकुस 16:9–20 की पाठालोचनात्मक स्थिति
  choice: दिए गए SBLGNT पाठ का अनुवाद किया गया है और दीर्घ समापन की पांडुलिपीय स्थिति पादटिप्पणी में बताई गई है।
  alternative: पद को छोड़ देना या मुख्य पाठ में कोष्ठक लगाना।
  rationale: स्रोत में पद उपस्थित है, पर कुछ प्राचीन पांडुलिपियों में मरकुस 16:9–20 नहीं है; पाठकों के प्रति पारदर्शिता के लिए इस तथ्य को पादटिप्पणी में रखना उचित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। साँप, प्राणघातक चीज़, बिल्कुल हानि नहीं होगी और ठीक हो जाएँगे सामान्य पाठक के लिए स्पष्ट हैं; साथ ही पादटिप्पणियाँ पाठालोचनात्मक और शाब्दिक सूक्ष्मताओं को सुरक्षित रखती हैं।
