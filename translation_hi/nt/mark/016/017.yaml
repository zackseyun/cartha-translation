source:
  edition: SBLGNT
  text: σημεῖα δὲ τοῖς πιστεύσασιν ⸂ταῦτα παρακολουθήσει⸃, ἐν τῷ ὀνόματί μου δαιμόνια ἐκβαλοῦσιν, γλώσσαις λαλήσουσιν ⸀καιναῖς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/017.yaml
  text: 'And these signs will accompany those who have believed: in my name they will cast out demons[b][a]; they will speak in new tongues.'
translation:
  language: hi
  text: 'और जिन लोगों ने विश्वास किया है, उनके साथ ये चिन्ह होंगे[b]: वे मेरे नाम से दुष्टात्माओं को निकालेंगे और नई भाषाएँ बोलेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘जीभें’ या ‘भाषाएँ’ हो सकता है। यहाँ यह स्पष्ट नहीं किया गया है कि इनका आशय किन प्रकार की भाषाओं या वाणी से है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘पीछे-पीछे आएँगे’ भी किया जा सकता है। यहाँ यूनानी क्रिया का अर्थ साथ होना या साथ बने रहना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖα
  choice: चिन्ह
  rationale: ‘चिन्ह’ यूनानी शब्द के प्रमाणसूचक आशय को बनाए रखता है; केवल ‘चमत्कार’ कहना उसके अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: τοῖς πιστεύσασιν
  choice: विश्वास कर चुके लोगों
  rationale: यह रूप विश्वास करने की घटित क्रिया को दर्शाते हुए लोगों के एक सामान्य वर्ग की ओर संकेत करता है।
- source_word: ταῦτα παρακολουθήσει
  choice: ये चिन्ह ... के साथ होंगे
  rationale: यह स्वाभाविक हिन्दी में चिन्हों के विश्वासियों के साथ रहने या उनका साथ देने का भाव व्यक्त करता है और केवल बाद में आने का क्रम नहीं सुझाता।
- source_word: ἐν τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: हिन्दी में यह यीशु के नाम और अधिकार के आधार पर काम करने का स्वाभाविक मुहावरा है।
- source_word: δαιμόνια ἐκβαλοῦσιν
  choice: दुष्टात्माओं को निकालेंगे
  rationale: यह दुष्ट आत्मिक सत्ताओं को बलपूर्वक बाहर करने का अर्थ स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: γλώσσαις λαλήσουσιν καιναῖς
  choice: नई भाषाएँ बोलेंगे
  rationale: γλῶσσα का अर्थ ‘जीभ’ और उससे ‘भाषा’ दोनों हो सकता है। ‘नई भाषाएँ बोलेंगे’ हिन्दी में स्वाभाविक है, जबकि घटना की ठीक प्रकृति को पादटिप्पणी में खुला रखा गया है।
theological_decisions:
- issue: ‘नई भाषाएँ’ कहे जाने की घटना का स्वरूप
  choice: मुख्य पाठ में ‘नई भाषाएँ बोलेंगे’ रखा गया है और घटना की प्रकृति को अधिक स्पष्ट नहीं किया गया।
  alternative: नई जीभों से बोलेंगे; अथवा विशेष आत्मिक वाणी बोलेंगे
  rationale: यूनानी γλώσσαις अपने आप यह निश्चित नहीं करता कि यहाँ पहले से अज्ञात मानवीय भाषाएँ अभिप्रेत हैं या किसी अन्य प्रकार की आत्मिक वाणी। अस्वाभाविक शाब्दिक हिन्दी से बचते हुए पादटिप्पणी इस अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘मेरे नाम से’ अधिकार के भाव को स्वाभाविक रूप में व्यक्त करता है; ‘नई जीभों’ जैसी अस्वाभाविक शब्दावली से बचते हुए मूल की अर्थगत खुलावट पादटिप्पणी में सुरक्षित है।
