source:
  edition: SBLGNT
  text: Ὁ μὲν οὖν κύριος ⸀Ἰησοῦς μετὰ τὸ λαλῆσαι αὐτοῖς ἀνελήμφθη εἰς τὸν οὐρανὸν καὶ ἐκάθισεν ἐκ δεξιῶν τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/019.yaml
  text: So then, the Lord Jesus, after speaking to them, was taken up into heaven and sat down at the right hand of God.
translation:
  language: hi
  text: इसलिए प्रभु यीशु, उनसे बात करने के बाद, स्वर्ग में उठा लिए गए और परमेश्वर के दाहिने हाथ पर बैठ गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मरकुस 16:9–20 कुछ सबसे प्राचीन यूनानी पांडुलिपियों में नहीं मिलता; अन्य पांडुलिपियों में यह दीर्घ समापन के रूप में मिलता है।
    reason: इस पद की महत्वपूर्ण पाठालोचनात्मक स्थिति को पारदर्शी रूप से बताना आवश्यक है।
lexical_decisions:
- source_word: μὲν οὖν
  choice: इसलिए
  rationale: यह कण-समूह पिछले कथन से निष्कर्ष और कथा में संक्रमण दोनों दर्शाता है। ‘इसलिए’ आधुनिक हिन्दी में इसके अनुमानात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κύριος Ἰησοῦς
  choice: प्रभु यीशु
  rationale: ‘प्रभु’ κύριος के मसीही उपाधि-संबंधी भार को बनाए रखता है; हिन्दी में इस उपाधि के साथ निश्चित लेख अलग से व्यक्त नहीं होता।
- source_word: μετὰ τὸ λαλῆσαι αὐτοῖς
  choice: उनसे बात करने के बाद
  rationale: μετά के साथ articular infinitive समयगत क्रम, अर्थात ‘के बाद’, बताता है। αὐτοῖς को ‘उनसे’ और λαλῆσαι को सहज आधुनिक हिन्दी में ‘बात करने’ से व्यक्त किया गया है।
- source_word: ἀνελήμφθη
  choice: उठा लिए गए
  rationale: यह रूप कर्मवाच्य है। ‘उठा लिए गए’ उस कर्मवाच्य को सुरक्षित रखता है और अगले वाक्यांश से गंतव्य स्पष्ट होने देता है। आदरसूचक बहुवचन हिन्दी में यीशु के लिए स्वाभाविक है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग में
  rationale: εἰς गति और गंतव्य बताता है। ‘स्वर्ग में उठा लिए गए’ हिन्दी में स्वाभाविक ढंग से ‘into heaven’ का अर्थ देता है।
- source_word: ἐκάθισεν
  choice: विराजमान हो गए
  rationale: यह बैठने की पूर्ण हुई क्रिया को व्यक्त करता है। ‘विराजमान हो गए’ सम्मानपूर्ण, सुबोध हिन्दी है और यहाँ के राजकीय तथा महिमामय संदर्भ के अनुकूल है, बिना पाठ में कोई अतिरिक्त पदवी जोड़े।
- source_word: ἐκ δεξιῶν τοῦ θεοῦ
  choice: परमेश्वर के दाहिने हाथ
  rationale: ἐκ δεξιῶν एक मुहावरा है जिसका अर्थ ‘दाहिनी ओर/दाहिने हाथ’ है। पारंपरिक बाइबलीय अभिव्यक्ति ‘परमेश्वर के दाहिने हाथ’ उसके स्थान और महिमा के संकेत को बनाए रखती है।
theological_decisions:
- issue: स्वर्गारोहण और महिमामय स्थान की भाषा
  choice: स्वर्ग में उठा लिए गए और परमेश्वर के दाहिने हाथ विराजमान हो गए
  alternative: स्वर्ग में ग्रहण किए गए और परमेश्वर की दाहिनी ओर बैठ गए
  rationale: मुख्य पाठ यूनानी के कर्मवाच्य स्वर्गारोहण तथा बैठने की पूर्ण क्रिया को स्पष्ट रखता है। ‘विराजमान’ सम्मान और उच्च स्थान के प्रसंग के अनुकूल है, पर यह पद में न कही गई किसी व्यवस्थित धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
- issue: κύριος को मसीही उपाधि के रूप में प्रस्तुत करना
  choice: प्रभु यीशु
  alternative: स्वामी यीशु
  rationale: ‘प्रभु’ नए नियम में κύριος की स्थापित हिन्दी धार्मिक अभिव्यक्ति है और उपाधि के मसीही भार को ‘स्वामी’ की अपेक्षा बेहतर सुरक्षित रखती है।
- issue: दीर्घ समापन की पाठालोचनात्मक स्थिति
  choice: पद का अनुवाद मुख्य पाठ में रखा गया और पाठालोचनात्मक सूचना पादटिप्पणी में दी गई
  alternative: पद को कोष्ठकों में रखना या मुख्य पाठ से हटाना
  rationale: दिए गए SBLGNT पाठ का अनुवाद किया गया है, किंतु मरकुस 16:9–20 की प्राचीन पांडुलिपियों में असमान उपस्थिति पाठकों के लिए प्रासंगिक वास्तविक अस्पष्टता है; इसे दबाए बिना पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सरल बाइबलीय शैली। यीशु के लिए आदरसूचक बहुवचन रखा गया है। ‘विराजमान हो गए’ सामान्य ‘बैठ गए’ की तुलना में संदर्भ की गरिमा व्यक्त करता है, जबकि वाक्य को सहज बनाए रखता है।
