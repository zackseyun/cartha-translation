  text: Καὶ διαγενομένου τοῦ σαββάτου ⸀Μαρία ἡ Μαγδαληνὴ καὶ Μαρία ⸂ἡ τοῦ⸃ Ἰακώβου καὶ Σαλώμη ἠγόρασαν ἀρώματα ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/001.yaml
  text: And when the Sabbath was over[a], Mary Magdalene, Mary the mother of James, and Salome bought spices so that they might come and anoint him.
translation:
  language: hi
  text: जब सब्त बीत गया, तब मरियम मगदलीनी, याकूब की मरियम[a] और सलोमी ने सुगंध-द्रव्य खरीदे, ताकि वे जाकर उसका अभिषेक करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “याकूब की मरियम” है—अर्थात याकूब के साथ संबंध के द्वारा पहचानी गई मरियम। परंपरागत रूप से इसे याकूब की माँ समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαγενομένου τοῦ σαββάτου
  choice: जब सब्त बीत गया
  rationale: यह संबंधकारक निरपेक्ष रचना मुख्य क्रिया से पहले का समय बताती है। यह हिंदी में स्वाभाविक रूप से वही कालगत अर्थ व्यक्त करती है।
- source_word: Μαρία ἡ Μαγδαληνὴ
  choice: मरियम मगदलीनी
  rationale: नाम और स्थान-संबंधी उपाधि का यह प्रचलित और आसानी से पहचाना जाने वाला हिंदी रूप है।
- source_word: Μαρία ἡ τοῦ Ἰακώβου
  choice: याकूब की मरियम[a]
  rationale: यूनानी पाठ का शाब्दिक आशय केवल इतना है कि मरियम की पहचान याकूब के संबंध से की गई है; संबंध का प्रकार स्पष्ट नहीं है। मुख्य पाठ में इस वास्तविक अस्पष्टता को सुरक्षित रखा गया है और पाद-टिप्पणी में प्रचलित समझ दी गई है।
- source_word: Σαλώμη
  choice: सलोमी
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: ἠγόρασαν
  choice: खरीदे
  rationale: सरल कथा-वर्णन में क्रय करने की पूर्ण हुई क्रिया का स्वाभाविक आधुनिक हिंदी रूप।
- source_word: ἀρώματα
  choice: सुगंध-द्रव्य
  rationale: यह दफ़न की तैयारी में प्रयुक्त सुगंधित पदार्थों को दर्शाता है। ‘सुगंध-द्रव्य’ ‘मसाले’ की तुलना में इस संदर्भ में अधिक स्पष्ट है और ‘इत्र’ से अधिक व्यापक।
- source_word: ἵνα ἐλθοῦσαι ἀλείψωσιν αὐτόν
  choice: ताकि वे जाकर यीशु के शरीर पर उन्हें लगाएँ
  rationale: ἵνα उद्देश्य व्यक्त करता है और ἐλθοῦσαι पहले जाकर पहुँचने की क्रिया। सर्वनाम ‘उसे’ के स्थान पर ‘यीशु के शरीर पर’ हिंदी में अंतिम संस्कार के प्रसंग और बहुवचन सुगंध-द्रव्यों के प्रयोग को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἀλείψωσιν
  choice: शरीर पर उन्हें लगाएँ
  rationale: क्रिया का मूल अर्थ मलना या लगाना है। यहाँ कर्मकांडी ‘अभिषेक करना’ की अपेक्षा शव पर सुगंध-द्रव्य लगाने का ठोस अर्थ अधिक सीधे व्यक्त होता है।
theological_decisions:
- issue: Μαρία ἡ τοῦ Ἰακώβου में मरियम और याकूब के बीच संबंध की पूर्ति
  choice: मुख्य पाठ में ‘याकूब की मरियम’ रखकर संबंध को अनिर्धारित छोड़ना
  alternative: ‘याकूब की माँ मरियम’
  rationale: यूनानी वाक्यांश में संबंध सूचक संज्ञा लुप्त है। सुसमाचार की परंपरा में इसे सामान्यतः मातृत्व का संबंध माना जाता है, पर इस पद के शब्द स्वयं ‘माँ’ नहीं कहते। इसलिए मुख्य पाठ वास्तविक अस्पष्टता बचाता है और पाद-टिप्पणी पाठक को प्रचलित अर्थ बताती है।
- issue: αὐτόν का संदर्भ
  choice: ‘यीशु के शरीर पर’
  alternative: ‘उस पर’ अथवा ‘उसका अभिषेक करें’
  rationale: संदर्भ में सर्वनाम यीशु को सूचित करता है, और स्त्रियाँ उनके मृत शरीर पर सुगंध-द्रव्य लगाने जा रही थीं। यह अभिव्यक्ति कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जोड़ती, बल्कि हिंदी में क्रिया का आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘सब्त’, ‘मरियम मगदलीनी’ और ‘सलोमी’ जैसे परिचित बाइबलीय रूप बनाए गए हैं। यूनानी की अस्पष्ट संबंध-सूचना को मुख्य पाठ में नहीं सुलझाया गया; आवश्यक स्पष्टीकरण पाद-टिप्पणी में है।
