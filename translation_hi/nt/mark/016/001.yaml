review_pass:
  verdict: revise
  source_fidelity: The temporal clause, named women, purchase of aromatic substances, and purpose are substantially represented. However, the draft expands αὐτόν (“him”) to “यीशु के शरीर” and adds “उन्हें” (“them,” referring to the spices). Neither specification is present in this verse; the context may support burial usage, but the translation should retain the source’s direct personal object.
  naturalness: The prose is generally clear and appropriately dignified. “याकूब की मरियम” is serviceable as a deliberately literal, footnoted rendering of the elliptical Greek identifier. “उसका अभिषेक करें” is natural Hindi and retains the direct object without importing “body.”
  terminology: “सब्त,” “मरियम मगदलीनी,” “सलोमी,” and “सुगंध-द्रव्य” suit modern standard Hindi biblical register. “अभिषेक” directly represents ἀλείφω and is preferable here to the expanded phrase “शरीर पर उन्हें लगाएँ.”
  issues:
  - severity: medium
    issue: The translation adds “यीशु के शरीर” for αὐτόν.
    rationale: The Greek says only “him.” Although the immediate narrative concerns Jesus’ burial, explicitly naming Jesus and specifying his body goes beyond the wording of this verse.
  - severity: medium
    issue: The translation adds “उन्हें” as an explicit object of “लगाएँ.”
    rationale: The Greek construction has “anoint him,” not “apply them [the spices] to his body.” The added pronoun restructures and narrows the source expression.
  revised_text: जब सब्त बीत गया, तब मरियम मगदलीनी, याकूब की मरियम[a] और सलोमी ने सुगंध-द्रव्य खरीदे, ताकि वे जाकर उसका अभिषेक करें।
