source:
  edition: SBLGNT
  text: καὶ ἐξελθοῦσαι ἔφυγον ἀπὸ τοῦ μνημείου, εἶχεν ⸀γὰρ αὐτὰς τρόμος καὶ ἔκστασις· καὶ οὐδενὶ οὐδὲν εἶπαν, ἐφοβοῦντο ⸁γάρ. ⟦Πάντα δὲ τὰ παρηγγελμένα τοῖς περὶ τὸν Πέτρον συντόμως ἐξήγγειλαν. μετὰ δὲ ταῦτα καὶ αὐτὸς ὁ Ἰησοῦς ἀπὸ ἀνατολῆς καὶ ἄχρι δύσεως ἐξαπέστειλεν δι’ αὐτῶν τὸ ἱερὸν καὶ ἄφθαρτον κήρυγμα τῆς αἰωνίου σωτηρίας. ἀμήν.⟧
base_translation:
  language: en
  yaml_path: translation/nt/mark/016/008.yaml
  text: And they went out and fled from the tomb[a], for trembling and astonishment had seized them. And they said nothing to anyone, for they were afraid.
translation:
  language: hi
  text: और वे बाहर निकलकर कब्र से भाग गईं[a], क्योंकि थरथराहट और विस्मय ने उन्हें जकड़ लिया था। उन्होंने किसी से कुछ नहीं कहा, क्योंकि वे भयभीत थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ हस्तलिपियों में यहाँ तथाकथित लघु समाप्ति जोड़ी गई है: “और जिन बातों की उन्हें आज्ञा दी गई थी, वे सब उन्होंने पतरस के आसपास के लोगों को संक्षेप में बता दीं। इसके बाद स्वयं यीशु ने भी उनके द्वारा पूर्व से पश्चिम तक अनंत उद्धार की पवित्र और अविनाशी घोषणा भेजी। आमीन।”'
    reason: textual_variant
lexical_decisions:
- source_word: ἐξελθοῦσαι
  choice: बाहर निकलकर
  rationale: स्त्रीलिंग बहुवचन एओरिस्ट कृदंत को स्वाभाविक हिन्दी में पूर्ववर्ती क्रिया के रूप में व्यक्त करता है और मुख्य क्रिया ἔφυγον से उसका क्रम बनाए रखता है।
- source_word: ἔφυγον
  choice: भाग गईं
  rationale: φεύγω की तीव्रता और दृश्य की आकस्मिकता को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μνημείου
  choice: कब्र
  rationale: दफनाने के स्थान के लिए आधुनिक हिन्दी का सहज और सटीक शब्द है।
- source_word: εἶχεν αὐτὰς
  choice: उन्हें जकड़ लिया था
  rationale: भाववाचक संज्ञाओं के साथ यूनानी मुहावरे का अर्थ किसी अवस्था के प्रबल रूप से गिरफ्त में लेने का है; यह अनुवाद उसकी तीव्रता बनाए रखता है।
- source_word: τρόμος
  choice: थरथराहट
  rationale: शारीरिक काँपने के ठोस भाव को व्यक्त करता है और अंतिम ἐφοβοῦντο से अनावश्यक समानता नहीं पैदा करता।
- source_word: ἔκστασις
  choice: विस्मय
  rationale: यहाँ सदमे और आश्चर्य से अपने-आपे से बाहर होने की दशा सूचित है; ‘विस्मय’ आधुनिक पाठक के लिए स्पष्ट है और ‘परमानंद’ जैसी भ्रामक ध्वनि से बचता है।
- source_word: οὐδενὶ οὐδὲν
  choice: किसी से कुछ नहीं
  rationale: यूनानी के व्यापक और बलयुक्त निषेध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἐφοβοῦντο
  choice: वे डर गई थीं
  rationale: स्त्रियों की भयभीत अवस्था को सहज हिन्दी में व्यक्त करता है; प्रसंग में यह भय के आरम्भ और बने रहने दोनों को संप्रेषित करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: दोनों स्थानों पर कारणसूचक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अंतिम वाक्य की आकस्मिक समाप्ति बनी रहती है।
theological_decisions:
- issue: मरकुस 16:8 के बाद कोष्ठकित लघु समाप्ति का व्यवहार
  choice: कोष्ठकित अंश को मुख्य पाठ में न रखकर पाठांतर के रूप में पादटिप्पणी में देना
  alternative: लघु समाप्ति को मुख्य पाठ में सम्मिलित करना या दोनों समाप्तियाँ मुख्य पाठ में छापना
  rationale: SBLGNT इस अंश को दुहरे कोष्ठकों में रखता है, जो उसे स्थापित मुख्य पाठ का भाग न मानने का संकेत है। पारदर्शिता के लिए उसका पूरा अनुवाद पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। स्त्री पात्रों के कारण स्त्रीलिंग बहुवचन रूप प्रयुक्त हैं। ‘कब्र’, ‘थरथराहट’, ‘विस्मय’ और ‘जकड़ लिया’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की तीव्रता बनाए रखते हैं।
