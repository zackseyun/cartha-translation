  text: She went and reported it to those who had been with him[a], who were mourning and weeping.
translation:
  language: hi
  text: वह गई और उसने उन लोगों को यह समाचार सुनाया[a], जो यीशु के साथ रहे थे और उस समय शोक मना रहे और रो रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह बात बताई।”
    reason: ἀπαγγέλλω का अर्थ ‘समाचार सुनाना/रिपोर्ट करना’ या सामान्य रूप से ‘बताना’ हो सकता है; यूनानी में कर्म संदर्भ से निहित है।
lexical_decisions:
- source_word: ἐκείνη
  choice: वह
  rationale: यह संकेतवाचक सर्वनाम पिछले पद की मरियम मगदलीनी की ओर संकेत करता है; आधुनिक हिन्दी में ‘वह’ स्वाभाविक है।
- source_word: πορευθεῖσα
  choice: गई
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई गति को बताता है; ‘वह गई और...’ क्रम को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπήγγειλεν
  choice: यह समाचार दिया
  rationale: क्रिया का अर्थ सूचना देना या घोषणा करना है। यूनानी में कर्म निहित है; ‘यह’ पिछले पद में वर्णित दर्शन के समाचार की ओर संकेत करता है।
- source_word: τοῖς μετ’ αὐτοῦ γενομένοις
  choice: उन लोगों को, जो यीशु के साथ रहे थे
  rationale: यह वाक्यांश यीशु से जुड़े रहे समूह की पहचान करता है। हिन्दी में केवल ‘उसके साथ’ कहने पर निकटवर्ती स्त्री-संदर्भ के कारण भ्रम हो सकता है, इसलिए संदर्भित व्यक्ति का नाम स्पष्ट किया गया है।
- source_word: πενθοῦσι
  choice: शोक मना रहे
  rationale: यह क्रिया मृत्यु या हानि के कारण शोक की अवस्था को व्यक्त करती है।
- source_word: καὶ κλαίουσιν
  choice: और रो रहे थे
  rationale: κλαίω रोने या विलाप करने को दर्शाता है; ‘रो रहे थे’ आधुनिक सामान्य हिन्दी में स्पष्ट और गरिमापूर्ण है।
