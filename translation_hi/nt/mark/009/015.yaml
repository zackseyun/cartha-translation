  text: καὶ ⸀εὐθὺς πᾶς ὁ ὄχλος ⸂ἰδόντες αὐτὸν ἐξεθαμβήθησαν⸃, καὶ προστρέχοντες ἠσπάζοντο αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/015.yaml
  text: And immediately the whole crowd[a], when they saw him, were greatly amazed, and running up to him, greeted him.
translation:
  language: hi
  text: और तुरन्त सारी भीड़ उसे देखकर बहुत चकित हो गई[a] और उसकी ओर दौड़कर उसका अभिवादन करने लगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहुत विस्मित हो गई’ अथवा ‘घबरा गई।’ यूनानी क्रिया प्रसंग के अनुसार तीव्र आश्चर्य, विस्मय या घबराहट व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: मरकुस में यह बार-बार आने वाला कथात्मक संकेत है, जो घटनाक्रम की तात्कालिकता और गति व्यक्त करता है।
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: एकवचन सामूहिक संज्ञा के साथ πᾶς भीड़ की समग्रता बताता है; ‘सारी भीड़’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἰδόντες αὐτόν
  choice: उसे देखकर
  rationale: अओरिस्ट कृदन्त यहाँ मुख्य प्रतिक्रिया को प्रेरित करने वाली समयगत परिस्थिति व्यक्त करता है।
- source_word: ἐξεθαμβήθησαν
  choice: बहुत चकित हो गई
  rationale: क्रिया तीव्र विस्मय, स्तब्धता या कभी-कभी घबराहट व्यक्त कर सकती है। प्रसंग में दौड़कर अभिवादन करना भय की अपेक्षा तीव्र आश्चर्य का समर्थन करता है, पर पादटिप्पणी व्यापक अर्थ-सीमा सुरक्षित रखती है।
- source_word: προστρέχοντες
  choice: उसकी ओर दौड़कर
  rationale: कृदन्त यीशु की दिशा में उत्सुक और तीव्र गति को सजीव ढंग से व्यक्त करता है।
- source_word: ἠσπάζοντο αὐτόν
  choice: उसका अभिवादन करने लगी
  rationale: ἀσπάζομαι का यहाँ तटस्थ अर्थ अभिवादन करना है। अपूर्णकालिक रूप को हिन्दी में ‘करने लगी’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु को देखकर भीड़ की प्रतिक्रिया में ἐξεθαμβήθησαν का भाव
  choice: तीव्र आश्चर्य या विस्मय
  alternative: घबरा जाना; अथवा मूसा के समान किसी अलौकिक तेज के कारण चकित होना
  rationale: पद केवल इतना कहता है कि यीशु को देखकर भीड़ ने तीव्र प्रतिक्रिया की और फिर उसकी ओर दौड़कर उसका अभिवादन किया। अनुवाद किसी अनकहे अलौकिक कारण को नहीं जोड़ता और शब्द की संभावित घबराहट वाली छाया को पादटिप्पणी में बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, प्रवाहपूर्ण और गरिमापूर्ण कथात्मक शैली। स्त्रीलिंग एकवचन क्रियाएँ ‘भीड़’ के व्याकरणिक लिंग और सामूहिक अर्थ के अनुरूप हैं।
