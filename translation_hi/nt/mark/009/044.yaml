lexical_decisions:
- source_word: σκώληξ
  choice: कीड़ा
  rationale: यह सड़ती हुई वस्तु को खाने वाले कृमि या कीड़े को दर्शाता है। ‘कीड़ा’ आधुनिक हिन्दी में स्वाभाविक और सीधा है तथा यशायाह 66:24 की उद्धृत छवि को बनाए रखता है।
- source_word: τελευτᾷ
  choice: मरता
  rationale: जीवित प्राणी के संदर्भ में τελευτάω का स्वाभाविक अर्थ ‘मरना’ है; वर्तमान काल का रूप निरंतर निषेध को व्यक्त करता है।
- source_word: σβέννυται
  choice: बुझती
  rationale: यह वर्तमान कर्मवाच्य रूप है, जिसका अर्थ आग का बुझाया जाना या बुझना है। हिन्दी में आग के साथ ‘नहीं बुझती’ स्वाभाविक है और मूल की अनवरतता बनाए रखता है।
