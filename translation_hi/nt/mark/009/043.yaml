id: MRK.9.43
reference: Mark 9:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐὰν ⸀σκανδαλίζῃ σε ἡ χείρ σου, ἀπόκοψον αὐτήν· καλόν ⸂ἐστίν σε⸃ κυλλὸν ⸂εἰσελθεῖν εἰς τὴν ζωὴν⸃ ἢ τὰς δύο χεῖρας ἔχοντα ἀπελθεῖν εἰς τὴν γέενναν, εἰς τὸ πῦρ τὸ ⸀ἄσβεστον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/043.yaml
  text: And if your hand causes you to stumble[a], cut it off. It is better for you to enter into life crippled than, having two hands, to go away into Gehenna[b], into the unquenchable fire.
translation:
  language: hi
  text: यदि तुम्हारा हाथ तुम्हें ठोकर खिलाए[a], तो उसे काट डालो। तुम्हारे लिए एक हाथ से वंचित होकर जीवन में प्रवेश करना इस बात से अच्छा है कि दोनों हाथों के साथ गेहन्ना[b] में, उस आग में जो बुझाई नहीं जा सकती, चले जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “तुमसे पाप करवाए।” यूनानी क्रिया का अर्थ किसी को ठोकर खिलाना, गिराना या पाप में डालना हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: गेहन्ना एक स्थान-नाम का यूनानी रूप है, जो परमेश्वर के न्याय से जुड़ा हुआ है; परंपरागत रूप से इसका अनुवाद “नरक” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ठोकर खिलाए
  rationale: यह रूपकात्मक भाषा को बनाए रखता है और क्रिया को केवल नैतिक पाप तक सीमित नहीं करता; संदर्भ में इसका आशय पाप या पतन का कारण बनना भी हो सकता है।
- source_word: ἀπόκοψον
  choice: काट डालो
  rationale: आज्ञार्थक क्रिया की तीव्रता और ठोस शारीरिक चित्र को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: καλόν
  choice: अच्छा
  rationale: ἤ के साथ यह तुलनात्मक अर्थ देता है; हिन्दी की रचना ‘इससे अच्छा है कि’ उस तुलना को स्वाभाविक रूप से व्यक्त करती है।
- source_word: κυλλόν
  choice: एक हाथ से वंचित होकर
  rationale: शब्द अंग-भंग या अंग से वंचित दशा को दर्शाता है। संदर्भ में हाथ काटने की बात होने के कारण यह स्पष्ट, स्वाभाविक और बिना अपमानजनक शब्दावली के अर्थ प्रकट करता है।
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: जीवन में प्रवेश करना
  rationale: मूल की प्रवेश-संबंधी भाषा और भावी पूर्ण जीवन के गंभीर धार्मिक संकेत, दोनों को बनाए रखता है।
- source_word: ἀπελθεῖν
  choice: चले जाओ
  rationale: यह जीवन में ‘प्रवेश’ करने के विपरीत दिशा में जाने का भाव व्यक्त करता है और हिन्दी में सहज है।
- source_word: γέενναν
  choice: गेहन्ना
  rationale: विशिष्ट यूनानी स्थान-नाम और उससे जुड़ी न्याय की यहूदी पृष्ठभूमि को सुरक्षित रखता है; प्रचलित अर्थ ‘नरक’ पादटिप्पणी में दिया गया है।
- source_word: ἄσβεστον
  choice: जो बुझती नहीं
  rationale: आग के न बुझने या न बुझाए जा सकने के अर्थ को स्पष्ट, सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰς δύο χεῖρας ἔχοντα
  choice: दोनों हाथ रहते हुए
  rationale: दो हाथों के बने रहने और एक हाथ से वंचित होने के बीच मूल पाठ का स्पष्ट विरोध सुरक्षित रहता है।
theological_decisions:
- issue: न्याय के कथन में γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: विशिष्ट स्रोत-शब्द को व्यापक धार्मिक पद ‘नरक’ में विलीन करने के बजाय उसे सुरक्षित रखा गया है; परिचित समतुल्य को पादटिप्पणी में बताया गया है।
- issue: हाथ काट डालने की चेतावनी की तीव्र शारीरिक भाषा
  choice: ठोस शारीरिक भाषा को बिना नरम किए बनाए रखना
  alternative: इसे केवल पाप से बचने की सामान्य व्याख्या के रूप में कहना
  rationale: मूल कथन जानबूझकर चौंकाने वाला शारीरिक चित्र प्रस्तुत करता है। मुख्य पाठ में उसकी तीव्रता को समझाकर कम नहीं किया गया।
- issue: σκανδαλίζῃ में रूपक और नैतिक आशय
  choice: मुख्य पाठ में ‘ठोकर खिलाए’ और पादटिप्पणी में ‘पाप करवाए’
  alternative: मुख्य पाठ में केवल ‘पाप करवाए’
  rationale: इससे यूनानी क्रिया का ठोकर, पतन और पाप—इनसे जुड़ा अर्थ-विस्तार बना रहता है और पाठक को प्रमुख नैतिक आशय भी मिलता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘ठोकर खिलाए’ मूल रूपक को बचाता है, जबकि पादटिप्पणी उसका नैतिक आशय स्पष्ट करती है। ‘एक हाथ से वंचित’ अंगभंग के अर्थ को बिना पुराने या अपमानजनक विशेषण के व्यक्त करता है।
