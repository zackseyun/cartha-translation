language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πολλάκις ⸂καὶ εἰς πῦρ αὐτὸν⸃ ἔβαλεν καὶ εἰς ὕδατα ἵνα ἀπολέσῃ αὐτόν· ἀλλ’ εἴ τι ⸀δύνῃ, βοήθησον ἡμῖν σπλαγχνισθεὶς ἐφ’ ἡμᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/022.yaml
  text: And many times it has thrown him both into fire and into waters to destroy him[a]. But if you can do anything, help us[b], having compassion on us.
translation:
  language: hi
  text: और उसने उसे नष्ट करने के लिए कई बार आग में और पानी में फेंका है। लेकिन यदि आप कुछ कर सकते हैं, तो हम पर करुणा करके हमारी सहायता कीजिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλάκις
  choice: कई बार
  rationale: यह बार-बार हुई घटनाओं को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔβαλεν
  choice: फेंका है
  rationale: यूनानी अओरिस्ट यहाँ अब तक बार-बार हुई घटनाओं का सार देता है; हिन्दी का पूर्ण वर्तमान इस संदर्भ में उपयुक्त है।
- source_word: εἰς πῦρ ... καὶ εἰς ὕδατα
  choice: आग में और पानी में
  rationale: दोहराए गए संबंध को बनाए रखा गया है। यूनानी ὕδατα बहुवचन है, पर इस प्रसंग में हिन्दी में भाववाचक एकवचन ‘पानी’ अधिक स्वाभाविक है।
- source_word: ἵνα ἀπολέσῃ αὐτόν
  choice: उसे नष्ट करने के लिए
  rationale: यह उद्देश्य को स्पष्ट रखता है और ἀπόλλυμι को केवल शारीरिक हत्या तक सीमित नहीं करता।
- source_word: ἀλλ’ εἴ τι δύνῃ
  choice: लेकिन यदि आप कुछ कर सकते हैं
  rationale: τι को ‘कुछ’ के रूप में व्यक्त करते हुए पिता की हिचक और यीशु की सामर्थ्य के विषय में उसकी अनिश्चितता सुरक्षित रखी गई है।
- source_word: βοήθησον ἡμῖν
  choice: हमारी सहायता कीजिए
  rationale: आज्ञार्थक निवेदन की तात्कालिकता को सम्मानपूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σπλαγχνισθεὶς ἐφ’ ἡμᾶς
  choice: हम पर करुणा करके
  rationale: यह गहरी दया के भाव और कृदन्तीय संबंध, दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पिता की विनती का स्वर और यीशु की सामर्थ्य के विषय में निहित अनिश्चितता
  choice: ‘यदि आप कुछ कर सकते हैं’ को सीधे बनाए रखा गया है।
  alternative: ‘यदि आपके लिए संभव हो’ अथवा अधिक विश्वासपूर्ण विनती
  rationale: यूनानी पाठ पिता की हिचक स्पष्ट रूप से व्यक्त करता है; इसे नरम करके या अधिक विश्वासपूर्ण बनाकर धार्मिक तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक ‘आप’ और ‘कीजिए’ का प्रयोग। शैली सहज, गरिमापूर्ण और मौखिक विनती के अनुरूप है।
