revisions:
- from: तब एक बादल आया और उन पर छा गया। उस बादल में से यह आवाज़ आई, “यह मेरा प्रिय पुत्र है; इसकी सुनो।”[a]
  to: और एक बादल आया और उन पर छा गया, और बादल में से एक आवाज़ आई, “यह मेरा प्रिय पुत्र है; इसकी सुनो[a]।”
  rationale: The revision restores the Greek’s simple connective, retains the eventive arrival of both the cloud and the voice, and preserves the indefinite introduction of the voice. The footnote continues to give the natural Hindi alternative while avoiding an over-specific claim that the command explicitly means obedience.
