  text: καὶ ἐγένετο νεφέλη ἐπισκιάζουσα αὐτοῖς, καὶ ⸀ἐγένετο φωνὴ ἐκ τῆς νεφέλης· Οὗτός ἐστιν ὁ υἱός μου ὁ ἀγαπητός, ⸂ἀκούετε αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/007.yaml
  text: 'And a cloud came[a], overshadowing them, and a voice came out of the cloud: “This is my beloved Son; listen to him.”'
translation:
  language: hi
  text: और एक बादल आया और उन पर छा गया, और बादल में से एक आवाज़ आई, “यह मेरा प्रिय पुत्र है; इसकी सुनो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसकी बात ध्यान से सुनो।” इस आज्ञा में केवल ध्वनि सुनने के बजाय ध्यानपूर्वक सुनने और उस पर ध्यान देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο νεφέλη
  choice: एक बादल आया
  rationale: γίνομαι यहाँ बादल के अचानक उपस्थित होने की घटना बताता है। ‘आया’ स्वाभाविक हिन्दी है और ‘वहाँ एक बादल था’ की अपेक्षा क्रियात्मक बल को बेहतर बनाए रखता है।
- source_word: ἐπισκιάζουσα αὐτοῖς
  choice: उन पर छा गया
  rationale: ἐπισκιάζω का अर्थ छाया डालना अथवा ढकते हुए छा जाना है। ‘उन पर छा गया’ दृश्यात्मक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: φωνὴ ἐκ τῆς νεφέλης
  choice: उस बादल में से यह आवाज़ आई
  rationale: φωνή यहाँ स्पष्ट वाणी को सूचित करता है, और ἐκ भीतर से निकलने का भाव देता है। ‘आवाज़ आई’ दूसरे ἐγένετο का सहज हिन्दी रूप है; पाठ में अलग से ‘बोली’ क्रिया नहीं जोड़ी गई।
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: मेरा प्रिय पुत्र
  rationale: ‘प्रिय पुत्र’ ἀγαπητός के प्रेम और विशिष्ट संबंध के भाव को संक्षिप्त, गरिमापूर्ण और सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀκούετε αὐτοῦ
  choice: इसकी सुनो
  rationale: यह हिन्दी मुहावरा केवल ध्वनि सुनने के बजाय ध्यान देकर मानने का भाव भी रखता है, फिर भी इसे सीधे ‘आज्ञा मानो’ कहकर अर्थ को अनावश्यक रूप से संकुचित नहीं करता। निकट उपस्थित और अभी पहचाने गए पुत्र के लिए ‘इसकी’ स्वाभाविक है।
theological_decisions:
- issue: यीशु की पहचान की दिव्य घोषणा
  choice: “यह मेरा प्रिय पुत्र है”
  alternative: “यह मेरा परमप्रिय पुत्र है”
  rationale: यूनानी पाठ सीधे पुत्रत्व और प्रेम की घोषणा करता है। ‘प्रिय’ इस कथन को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
- issue: ἀκούετε αὐτοῦ की आज्ञा का बल
  choice: “इसकी सुनो”
  alternative: “इसकी आज्ञा मानो” अथवा “इसे सुनो”
  rationale: आज्ञा ध्यानपूर्वक सुनने और उस पर ध्यान देने का भाव रखती है, पर मूल में स्पष्टतः ‘आज्ञा मानना’ अर्थ वाला अलग क्रिया-पद नहीं है। ‘इसकी सुनो’ दोनों पहलुओं के बीच का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य छोटे, मौखिक रूप से सहज और गरिमापूर्ण रखे गए हैं। ‘बादल’, ‘आवाज़’ और ‘प्रिय पुत्र’ जैसे सामान्य शब्द मूल की प्रत्यक्षता बनाए रखते हैं।
