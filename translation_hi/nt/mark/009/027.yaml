id: MRK.9.27
reference: Mark 9:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς κρατήσας ⸂τῆς χειρὸς αὐτοῦ⸃ ἤγειρεν αὐτόν, καὶ ἀνέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/027.yaml
  text: But Jesus[a], taking hold of his hand, raised him up[b], and he stood up.
translation:
  language: hi
  text: परन्तु यीशु ने उसका हाथ पकड़कर उसे उठाया[a], और वह खड़ा हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे उठ खड़ा किया’; यहाँ प्रयुक्त यूनानी क्रिया नींद से जगाने या मृतकों में से उठाने के प्रसंगों में भी आ सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह उठ खड़ा हुआ’ अथवा ‘वह उठ गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन—लोगों का यह कहना कि लड़का मर गया है—और यीशु की अगली कार्रवाई के बीच हल्का विरोध दर्शाता है।
- source_word: κρατήσας
  choice: पकड़कर
  rationale: यह यीशु द्वारा लड़के का हाथ सचमुच थामने की ठोस क्रिया व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τῆς χειρὸς αὐτοῦ
  choice: उसका हाथ
  rationale: मूल पाठ में शरीर का विशिष्ट अंग ‘हाथ’ है; इसे ‘बाँह’ जैसे व्यापक अर्थ में नहीं बदला गया।
- source_word: ἤγειρεν
  choice: उसे उठाया
  rationale: संदर्भ में यीशु लड़के को भूमि से उठाते हैं। ‘उठाया’ सामान्य शारीरिक अर्थ को स्पष्ट रखता है, साथ ही यूनानी क्रिया के जगाने अथवा मृतकों में से उठाने से जुड़े व्यापक प्रयोग की संभावना को मिटाता नहीं।
- source_word: ἀνέστη
  choice: वह खड़ा हो गया
  rationale: यह यीशु द्वारा उठाए जाने के बाद लड़के के स्वयं खड़े हो जाने का परिणामी कार्य स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἤγειρεν और ἀνέστη में पुनरुत्थान-संबंधी शब्दावली की संभावित प्रतिध्वनि
  choice: संदर्भ के अनुसार सामान्य शारीरिक रूप से उठने की भाषा रखी गई है, और व्यापक अर्थ-संभावना पादटिप्पणियों में सुरक्षित है।
  alternative: ‘उसे जिलाया, और वह जी उठा’ जैसे शब्दों से पुनरुत्थान का अर्थ प्रमुख करना।
  rationale: तात्कालिक प्रसंग दुष्टात्मा निकलने के बाद लड़के को भूमि से उठाने का है; पाठ स्पष्ट रूप से मृतकों में से पुनरुत्थान नहीं कहता। फिर भी ये यूनानी क्रियाएँ अन्य प्रसंगों में जगने या मृतकों में से उठने के लिए प्रयुक्त हो सकती हैं, इसलिए उस प्रतिध्वनि को पूरी तरह दबाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परन्तु’ हल्के विरोध को व्यक्त करता है; ‘उसका हाथ पकड़कर’ ठोस स्पर्श की क्रिया को बनाए रखता है। पादटिप्पणी-चिह्न उन्हीं क्रियाओं के बाद लगाए गए हैं जिनकी अर्थ-संभावनाएँ वे स्पष्ट करते हैं।
