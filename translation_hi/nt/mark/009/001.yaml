source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι εἰσίν τινες ⸂τῶν ὧδε⸃ ἑστηκότων οἵτινες οὐ μὴ γεύσωνται θανάτου ἕως ἂν ἴδωσιν τὴν βασιλείαν τοῦ θεοῦ ἐληλυθυῖαν ἐν δυνάμει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/001.yaml
  text: And he was saying to them[a], “Truly I say to you[d][c][b], there are some standing here who will certainly not taste death until they see the kingdom of God having come in power.”
translation:
  language: hi
  text: और वह उनसे कह रहा था, “मैं तुमसे सच कहता हूँ, यहाँ खड़े लोगों में से कुछ ऐसे हैं जो तब तक मृत्यु का स्वाद चखेंगे[a] ही नहीं, जब तक वे परमेश्वर के राज्य को सामर्थ्य के साथ आया हुआ[b] न देख लें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मृत्यु का स्वाद चखना” एक मुहावरा है, जिसका अर्थ है “मृत्यु का अनुभव करना” या “मरना।”
    reason: lexical_alternative
  - marker: b
    text: “परमेश्वर के राज्य को सामर्थ्य के साथ आया हुआ” किस घटना की ओर संकेत करता है, पाठ यह स्पष्ट नहीं करता। इसे रूपांतरण, पुनरुत्थान, पिन्तेकुस्त, यरूशलेम के न्याय, या राज्य की भावी पूर्णता से जोड़ा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘कहा’ की अपेक्षा यूनानी पक्ष को बेहतर सुरक्षित रखता है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु की गंभीर उद्घोषणा का स्वाभाविक और प्रतिष्ठित हिन्दी रूप; ‘आमीन’ का लिप्यंतरण सामान्य पाठक के लिए यहाँ कम स्पष्ट होता।
- source_word: τινες τῶν ὧδε ἑστηκότων
  choice: यहाँ खड़े लोगों में से कुछ ऐसे हैं
  rationale: τῶν का अंशवाचक भाव स्पष्ट रखता है और बताता है कि उपस्थित लोगों में से कुछ की बात है।
- source_word: οὐ μὴ γεύσωνται θανάτου
  choice: मृत्यु का स्वाद चखेंगे ही नहीं
  rationale: οὐ μή की प्रबल निषेधात्मकता ‘ही नहीं’ से और मूल रूपक ‘मृत्यु का स्वाद चखना’ यथावत व्यक्त होते हैं।
- source_word: ἕως ἂν ἴδωσιν
  choice: जब तक वे ... न देख लें
  rationale: भविष्य की सीमा और पूर्ण देख लेने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: सुसमाचारों में प्रचलित और अर्थ की राजकीय तथा युगांत-संबंधी दोनों परतों को सुरक्षित रखने वाला रूप।
- source_word: ἐληλυθυῖαν ἐν δυνάμει
  choice: सामर्थ्य के साथ आया हुआ
  rationale: पूर्ण कृदंत के परिणामकारी भाव और ἐν δυνάμει को बिना किसी खास घटना से बाँधे निकटता से व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर के राज्य को सामर्थ्य के साथ आया हुआ’ किस घटना की ओर संकेत करता है
  choice: अनुवाद में घटना को अनिर्दिष्ट रखा गया है।
  alternative: इसे रूपांतरण, पुनरुत्थान/महिमारोपण, पिन्तेकुस्त, यरूशलेम के न्याय, या राज्य की अंतिम पूर्णता के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ स्वयं संदर्भित घटना को निश्चित नहीं करता; इसलिए वास्तविक व्याख्यात्मक तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में सहज ‘तुम’, पर समग्र शैली गरिमापूर्ण। ‘सामर्थ्य’ बाइबलीय परिचितता और सामान्य बोध के बीच उपयुक्त संतुलन रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
