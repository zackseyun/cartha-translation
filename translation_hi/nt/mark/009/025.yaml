source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ὅτι ἐπισυντρέχει ὄχλος ἐπετίμησεν τῷ πνεύματι τῷ ἀκαθάρτῳ λέγων αὐτῷ· Τὸ ⸂ἄλαλον καὶ κωφὸν πνεῦμα⸃, ἐγὼ ⸂ἐπιτάσσω σοι⸃, ἔξελθε ἐξ αὐτοῦ καὶ μηκέτι εἰσέλθῃς εἰς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/025.yaml
  text: But when Jesus saw that a crowd was quickly gathering[a], he rebuked the unclean spirit, saying to it, “You mute and deaf spirit, I command you, come out of him and never enter him again.”
translation:
  language: hi
  text: पर जब यीशु ने देखा कि भीड़ तेज़ी से इकट्ठी हो रही है[a], तो उन्होंने अशुद्ध आत्मा को डाँटा और उससे कहा, “हे गूँगी और बहरी आत्मा, मैं तुझे आज्ञा देता हूँ, उसमें से निकल जा और फिर कभी उसमें प्रवेश मत करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीड़ दौड़ती हुई एक साथ आ रही है।” यूनानी क्रिया लोगों के तेज़ी से एक जगह जुटने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: पर जब यीशु ने देखा
  rationale: ἰδών परिस्थिति बताने वाला भूतकालिक कृदंत है और δέ हल्का कथात्मक संयोजक। ‘पर जब’ प्रसंग के मोड़ और कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπισυντρέχει ὄχλος
  choice: भीड़ तेज़ी से इकट्ठी हो रही है
  rationale: ἐπισυντρέχω लोगों के दौड़कर या शीघ्रता से एक जगह जुटने का भाव रखता है। यह अनुवाद अपूर्ण पक्ष और तात्कालिकता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπετίμησεν
  choice: डाँटा
  rationale: ἐπιτιμάω सुसमाचारों में यीशु की अधिकारपूर्ण फटकार के लिए प्रयुक्त होता है। ‘डाँटा’ सामान्य पाठक के लिए स्पष्ट है और कठोर, अधिकारपूर्ण संबोधन का भाव बनाए रखता है।
- source_word: τῷ πνεύματι τῷ ἀκαθάρτῳ
  choice: अशुद्ध आत्मा
  rationale: ἀκάθαρτος के धार्मिक और नैतिक अशुद्धता-संबंधी अर्थ को ‘अशुद्ध’ सुरक्षित रखता है और सुसमाचार की पारिभाषिक भाषा के अनुरूप है।
- source_word: Τὸ ἄλαλον καὶ κωφὸν πνεῦμα
  choice: हे गूँगी और बहरी आत्मा
  rationale: ἄλαλος और κωφός को अलग-अलग ‘गूँगी’ और ‘बहरी’ रखा गया है। ‘हे’ प्रत्यक्ष संबोधन को हिन्दी में स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: ἐγὼ ἐπιτάσσω σοι
  choice: मैं तुझे आज्ञा देता हूँ
  rationale: ἐπιτάσσω अधिकारपूर्ण आदेश है और स्पष्ट ἐγώ वक्ता पर बल देता है। ‘मैं तुझे आज्ञा देता हूँ’ उस प्रत्यक्ष अधिकार को बनाए रखता है।
- source_word: ἔξελθε ἐξ αὐτοῦ
  choice: इसमें से निकल जा
  rationale: ἔξελθε का आज्ञार्थक बल ‘निकल जा’ में स्पष्ट है। αὐτοῦ उसी लड़के की ओर संकेत करता है; ‘इसमें से’ निकटवर्ती व्यक्ति के प्रति प्रत्यक्ष संबोधन के अनुरूप है।
- source_word: μηκέτι εἰσέλθῃς εἰς αὐτόν
  choice: फिर कभी इसमें प्रवेश न करना
  rationale: μηκέτι भविष्य में दोबारा प्रवेश पर निर्णायक रोक लगाता है। यह हिन्दी रूप उस निषेध की स्थायी और प्रबल प्रकृति व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्मा-संबंधी शब्दावली और यीशु का अधिकार
  choice: πνεῦμα ἀκάθαρτον को ‘अशुद्ध आत्मा’ और ἐπετίμησεν/ἐπιτάσσω को क्रमशः ‘डाँटा’ तथा ‘आज्ञा देता हूँ’ कहना
  alternative: ‘दुष्ट आत्मा’ या ‘अपवित्र आत्मा’; अथवा अधिकारपूर्ण भाषा को केवल ‘कठोरता से कहा’ बनाना
  rationale: मूल पाठ आत्मा को सीधे संबोधित एक व्यक्तिगत सत्ता के रूप में प्रस्तुत करता है, जो यीशु के आदेश के अधीन है। अनुवाद न तो इसे केवल बीमारी में बदलता है, न मूल से आगे कोई दार्शनिक या सांप्रदायिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। यीशु के लिए आदरसूचक बहुवचन और आत्मा के लिए अधिकारपूर्ण एकवचन ‘तू’ का प्रयोग किया गया है। मुख्य पाठ में पादटिप्पणी चिह्न [a] सम्मिलित है।
