    reason: cross_reference
lexical_decisions:
- source_word: ὅπου
  choice: जहाँ
  rationale: यह स्थान का बोध कराने वाला संबंधवाचक क्रियाविशेषण है; ‘जहाँ’ सीधा, स्वाभाविक और मूल के अनुरूप है।
- source_word: ὁ σκώληξ αὐτῶν
  choice: उनका कीड़ा
  rationale: ‘कीड़ा’ σκώληξ का व्यापक और स्वाभाविक हिन्दी रूप है तथा यशायाह 66:24 की प्रतिध्वनि बनाए रखता है। αὐτῶν के संबंधवाचक अर्थ को ‘उनका’ से सुरक्षित रखा गया है।
- source_word: οὐ τελευτᾷ
  choice: नहीं मरता
  rationale: τελευτάω का अर्थ ‘अंत होना’ भी हो सकता है, पर जीवधारी ‘कीड़ा’ के साथ ‘नहीं मरता’ हिन्दी में सहज है और चित्र की तीव्रता बनाए रखता है।
- source_word: τὸ πῦρ
  choice: आग
  rationale: यह संज्ञा का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: οὐ σβέννυται
  choice: नहीं बुझती
  rationale: वर्तमानकालीन कर्मवाच्य भाव को हिन्दी में स्वाभाविक रूप से ‘नहीं बुझती’ व्यक्त करता है; इससे आग के लगातार न बुझने की अवस्था बनी रहती है।
theological_decisions:
- issue: न्याय के चित्र का स्वरूप
  choice: कीड़े और आग के ठोस चित्र को बिना doctrinal व्याख्या जोड़े बनाए रखा गया है।
  alternative: इसे केवल निरंतर सचेत यातना, पूर्ण विनाश, अथवा मात्र लज्जा और अपवित्रता का रूपक बताना।
  rationale: पद यशायाह 66:24 की प्रतिध्वनि के साथ न्याय का प्रबल चित्र प्रस्तुत करता है, पर स्वयं व्यापक धर्मवैज्ञानिक विवादों का स्पष्ट निर्णय नहीं करता; इसलिए अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गंभीर और सामान्य पाठक के लिए सहज शैली। ‘कीड़ा’ और ‘आग’ की मूल ठोस छवि तथा वाक्य की समानांतर संरचना सुरक्षित रखी गई है।
