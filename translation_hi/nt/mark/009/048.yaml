translation:
  language: hi
  text: जहाँ उनका कीड़ा नहीं मरता[a][b] और आग नहीं बुझती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका कीड़ा समाप्त नहीं होता और आग बुझाई नहीं जाती।”
