  text: καὶ ⸂κράξας καὶ πολλὰ σπαράξας⸃ ἐξῆλθεν· καὶ ἐγένετο ὡσεὶ νεκρὸς ὥστε ⸀τοὺς πολλοὺς λέγειν ὅτι ἀπέθανεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/026.yaml
  text: And after crying out and convulsing him greatly[a], it came out; and he became like a dead man, so that many were saying[b], “He is dead.”
translation:
  language: hi
  text: और वह चिल्लाकर और लड़के को बुरी तरह मरोड़कर[a] बाहर निकल गया। लड़का मरे हुए के समान हो गया[b], यहाँ तक कि बहुत-से लोग कहने लगे, “वह मर गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लड़के को भयंकर ऐंठन में डालकर।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में तुलना का भाव है: “मानो मरा हुआ”; अर्थात देखने वालों को वह मरा हुआ दिखाई दे रहा था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας
  choice: चिल्लाया
  rationale: यह क्रिया अशुद्ध आत्मा के ऊँची आवाज़ निकालने को व्यक्त करती है; ‘चीखा’ संभव है, पर वह आवाज़ के स्वर को कुछ अधिक विशिष्ट बना देता है।
- source_word: πολλὰ σπαράξας
  choice: लड़के को बुरी तरह मरोड़कर
  rationale: इस प्रसंग में σπαράσσω का अर्थ सचमुच फाड़ना नहीं, बल्कि शरीर को तीव्र रूप से मरोड़ना या ऐंठन उत्पन्न करना है। πολλὰ की तीव्रता ‘बुरी तरह’ से स्वाभाविक हिन्दी में व्यक्त होती है; ‘लड़के को’ प्रसंग से स्पष्ट कर्म है।
- source_word: ἐξῆλθεν
  choice: बाहर निकल गया
  rationale: इसका अप्रकट कर्ता पिछले प्रसंग का अशुद्ध आत्मा है। हिन्दी में पुल्लिंग ‘गया’ आत्मा के व्याकरणिक लिंग के अनुरूप है।
- source_word: ἐγένετο ὡσεὶ νεκρός
  choice: लड़का मरे हुए के समान हो गया
  rationale: ὡσεὶ तुलना या प्रतीति बताता है, वास्तविक मृत्यु का कथन नहीं। ‘मरे हुए के समान’ उस तुलना को बनाए रखता है। स्पष्टता के लिए प्रसंगगत कर्ता ‘लड़का’ व्यक्त किया गया है।
- source_word: ὥστε τοὺς πολλοὺς λέγειν
  choice: यहाँ तक कि बहुत-से लोग कहने लगे
  rationale: यह परिणामस्वरूप भीड़ की प्रतिक्रिया दिखाता है। τοὺς πολλούς को अनिवार्यतः ‘अधिकतर’ मानने के बजाय ‘बहुत-से लोग’ रखा गया है, और λέγειν की चलती हुई प्रतिक्रिया ‘कहने लगे’ से व्यक्त हुई है।
- source_word: ὅτι ἀπέθανεν
  choice: “वह मर गया है।”
  rationale: भीड़ के निष्कर्ष को स्वाभाविक प्रत्यक्ष कथन में रखा गया है। हिन्दी का पूर्ण पक्ष ‘मर गया है’ तत्काल दिखाई देने वाली दशा पर उनके निष्कर्ष को व्यक्त करता है।
theological_decisions:
- issue: लड़का सचमुच मरा था या केवल मरा हुआ दिखाई दिया
  choice: वर्णन लड़के को मरे हुए के समान बताता है, जबकि मृत्यु भीड़ का निष्कर्ष है।
  alternative: लड़का कुछ समय के लिए वास्तव में मर गया था।
  rationale: ὡσεὶ (‘के समान/मानो’) और ‘बहुत-से लोग कहने लगे’ वास्तविक मृत्यु को कथाकार का स्पष्ट दावा नहीं बनाते। अनुवाद इस अंतर को बनाए रखता है और यहाँ पुनरुत्थान की धारणा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बुरी तरह मरोड़कर’ आम पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी चिकित्सकीय-सदृश ‘ऐंठन’ वाला विकल्प देती है। पहले वाक्य में ‘वह’ का संदर्भ निकटवर्ती प्रसंग के अशुद्ध आत्मा से है; ‘लड़के को’ जोड़ने से कर्ता और कर्म का भ्रम कम होता है।
