  text: और उसने उनसे पूछा, “तुम आपस में किस बात पर चर्चा[a] कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम आपस में किस बात पर बहस कर रहे हो?” यहाँ प्रयुक्त क्रिया प्रसंग के अनुसार चर्चा, वाद-विवाद या बहस का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: यहाँ क्रिया सीधे प्रश्न को प्रस्तुत करती है; ‘पूछा’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक औपचारिकता या तीव्रता नहीं जोड़ता।
- source_word: αὐτούς
  choice: उनसे
  rationale: यूनानी सर्वनाम बहुवचन है, पर इस पद में उसका संदर्भ स्पष्ट रूप से सीमित नहीं किया गया; ‘उनसे’ उसी अनिर्दिष्टता को बनाए रखता है।
- source_word: Τί
  choice: किस बात पर
  rationale: यह प्रश्न चर्चा के विषय के बारे में है, कारण के बारे में नहीं; हिन्दी में ‘किस बात पर’ इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: συζητεῖτε
  choice: चर्चा कर रहे हो
  rationale: क्रिया का अर्थ चर्चा, वाद-विवाद या बहस हो सकता है। मुख्य पाठ में अपेक्षाकृत व्यापक और तटस्थ ‘चर्चा’ रखा गया है, जबकि विवादात्मक अर्थ को पाद-टिप्पणी में सुरक्षित किया गया है।
- source_word: πρὸς αὑτούς
  choice: आपस में
  rationale: इस पाठ-रूप में वाक्यांश पारस्परिक बातचीत को व्यक्त करता है; ‘आपस में’ उसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले वर्णन से साधारण संयोजन करता है; ‘और’ बिना अतिरिक्त कालगत अर्थ जोड़े उस संबंध को बनाए रखता है।
