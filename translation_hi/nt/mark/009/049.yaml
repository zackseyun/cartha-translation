    reason: textual_variant
lexical_decisions:
- source_word: Πᾶς
  choice: हर व्यक्ति
  rationale: एकवचन पुल्लिंग कर्तृकारक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। प्रसंग व्यक्तियों से संबंधित है, इसलिए ‘हर व्यक्ति’ स्वाभाविक और स्पष्ट है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस तार्किक संबंध को बनाए रखता है।
- source_word: πυρὶ
  choice: आग से
  rationale: करण कारक साधन या संबद्ध तत्व का भाव दे सकता है। ‘आग से’ हिन्दी में स्वाभाविक है और प्रक्रिया के साधन की सम्भावना को खुला रखता है।
- source_word: ἁλισθήσεται
  choice: नमकीन किया जाएगा
  rationale: ἁλίζω के भविष्यत् कर्मवाच्य का सीधा अर्थ नमक लगाना या नमकीन करना है। यह चयन कठिन और प्रभावशाली रूपक को समझाकर समाप्त करने के बजाय सुरक्षित रखता है।
theological_decisions:
- issue: ‘आग से नमकीन किए जाने’ के रूपक की व्याख्या
  choice: मुख्य पाठ में शाब्दिक-रूपकात्मक अभिव्यक्ति को बनाए रखा गया है।
  alternative: इसे आग द्वारा न्याय, शुद्धीकरण, परीक्षा, या नमक लगे बलिदान के समान समर्पण के रूप में स्पष्ट किया जा सकता था।
  rationale: यूनानी कथन संक्षिप्त और संकेतात्मक है तथा प्रसंग एक से अधिक परस्पर संबंधित अर्थों की सम्भावना देता है। किसी एक धर्मवैज्ञानिक अर्थ को मुख्य पाठ में थोपने के बजाय उसकी वास्तविक अस्पष्टता और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और स्रोत के निकट भाषा रखी गई है। असामान्य ‘आग से नमकीन’ रूपक को जानबूझकर बनाए रखा गया है; ‘हर व्यक्ति’ सामान्य पाठक के लिए Πᾶς का स्पष्ट मानवीय संदर्भ देता है।
