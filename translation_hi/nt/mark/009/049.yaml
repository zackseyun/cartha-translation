translation:
  language: hi
  text: क्योंकि हर व्यक्ति को आग से नमक लगाया जाएगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर व्यक्ति को आग से स्वाद दिया जाएगा।” यह चित्र न्याय, शुद्धीकरण या बलिदान की भाषा की ओर संकेत कर सकता है; लैव्यव्यवस्था 2:13 से तुलना करें।
