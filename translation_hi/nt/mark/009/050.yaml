base_translation:
  language: en
  yaml_path: translation/nt/mark/009/050.yaml
  text: Salt is good[a]; but if the salt becomes unsalty, with what will you season it? Have salt in yourselves[c][b], and be at peace with one another.
translation:
  language: hi
  text: नमक अच्छा है; लेकिन यदि नमक का खारापन चला जाए[a], तो तुम उसे किससे स्वाद दोगे? अपने भीतर नमक रखो[b], और आपस में शान्ति से रहो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नमक बेस्वाद हो जाए’ अथवा ‘नमक अपना स्वाद खो दे’।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने भीतर नमक रखो’ मूल भाषा के रूपक को बनाए रखता है। सम्भव अर्थों में शुद्धता, बुद्धि, वाचा के प्रति निष्ठा या संरक्षणकारी प्रभाव शामिल हैं, परन्तु पाठ स्वयं किसी एक अर्थ को स्पष्ट रूप से निर्धारित नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: καλὸν
  choice: अच्छा
  rationale: यहाँ καλός नमक का व्यापक सकारात्मक मूल्यांकन करता है। ‘अच्छा’ सरल, स्वाभाविक और सूक्तिपरक है तथा उपयोगिता का अनावश्यक विशेषीकरण नहीं करता।
- source_word: ἅλας / ἅλα
  choice: नमक
  rationale: दोनों स्थानों पर रूपक और मूल पाठ की शब्द-पुनरावृत्ति बनाए रखने के लिए ‘नमक’ रखा गया है।
- source_word: ἄναλον γένηται
  choice: खारापन चला जाए
  rationale: ἄναλος का अर्थ नमकहीन या बेस्वाद होना और γένηται का अर्थ अवस्था-परिवर्तन है। आधुनिक हिन्दी में ‘नमक का खारापन चला जाए’ इस भाव और शब्द-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν τίνι
  choice: किससे
  rationale: शाब्दिक ‘किसमें’ के बजाय प्रसंग में यह साधन पूछता है; ‘किससे’ हिन्दी में सहज और अर्थ-सटीक है।
- source_word: ἀρτύσετε
  choice: स्वादिष्ट बनाओगे
  rationale: ἀρτύω का अर्थ मसाला या नमक डालकर स्वाद देना है। ‘स्वादिष्ट बनाओगे’ पाक-संबंधी रूपक को प्राकृतिक हिन्दी में बनाए रखता है।
- source_word: ἔχετε
  choice: रखो
  rationale: वर्तमान आज्ञार्थक निरन्तर अवस्था का निर्देश देता है। ‘अपने भीतर नमक रखो’ हिन्दी में ‘नमक हो’ की अपेक्षा अधिक स्वाभाविक आज्ञा है।
- source_word: ἐν ἑαυτοῖς
  choice: अपने भीतर
  rationale: यह reflexive पद रूपक की आन्तरिक दिशा को सुरक्षित रखता है; इसे ‘आपस में’ करने से सम्भावित अर्थ समय से पहले निर्धारित हो सकता था।
- source_word: εἰρηνεύετε
  choice: शान्ति से रहो
  rationale: क्रिया का अर्थ शान्ति में होना या रहना है। ‘शान्ति से रहो’ जारी आचरण को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν ἀλλήλοις
  choice: एक-दूसरे के साथ
  rationale: यह पारस्परिक सम्बन्ध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अन्तिम आज्ञा में ‘नमक’ के रूपक का अर्थ
  choice: रूपक को अक्षुण्ण रखते हुए ‘अपने भीतर नमक रखो’
  alternative: मुख्य पाठ में इसे ‘पवित्रता’, ‘बुद्धि’, ‘वाचा की निष्ठा’ या ‘संरक्षणकारी प्रभाव’ के रूप में स्पष्ट करना
  rationale: मूल पद स्वयं रूपक का एक निश्चित अर्थ नहीं बताता। इसलिए अनुवाद किसी एक धार्मिक व्याख्या को पाठ में आरोपित नहीं करता।
- issue: εἰρηνεύετε की कालगत और नैतिक शक्ति
  choice: ‘शान्ति से रहो’
  alternative: ‘शान्ति में रहो’ या ‘मेल रखो’
  rationale: चुना हुआ रूप वर्तमान आज्ञार्थक के निरन्तर आचरण को स्वाभाविक हिन्दी में व्यक्त करता है और पारस्परिक शान्ति की नैतिक आज्ञा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल से ऊपर का सहज स्तर रखा गया है। ‘खारापन चला जाए’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्पों को सुरक्षित रखती है। ‘शान्ति’ की वर्तनी प्रकाशन-शैली के अनुरूप रखी गई है।
