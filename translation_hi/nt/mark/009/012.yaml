  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀ἔφη αὐτοῖς· Ἠλίας μὲν ἐλθὼν πρῶτον ⸀ἀποκαθιστάνει πάντα, καὶ πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου ἵνα πολλὰ πάθῃ καὶ ⸀ἐξουδενηθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/012.yaml
  text: He said to them[a], “Elijah indeed, having come first, restores all things. And how is it written about the Son of Man that he should suffer many things and be treated with contempt?”
translation:
  language: hi
  text: उसने उनसे कहा, “एलिय्याह सचमुच पहले आकर सब कुछ बहाल करता है। और मनुष्य के पुत्र के विषय में यह कैसे लिखा है कि वह बहुत दुःख उठाए और तुच्छ समझा जाए?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका तिरस्कार किया जाए” अथवा “उसे कुछ न समझा जाए।” यूनानी क्रिया में किसी को नगण्य मानने या उसके साथ तिरस्कारपूर्ण व्यवहार करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔφη
  choice: उसने कहा
  rationale: सामान्य कथात्मक वाणी-क्रिया के लिए यह स्वाभाविक और अर्थनिष्ठ हिन्दी है; αὐτοῖς को ‘उनसे’ के रूप में व्यक्त किया गया है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: ἐλθὼν πρῶτον
  choice: पहले आकर
  rationale: यह मुख्य क्रिया से पहले होने वाली सहभागी क्रिया और πρῶτον की प्राथमिकता—दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: ἀποκαθιστάνει
  choice: फिर से ठीक करता है
  rationale: यह किसी वस्तु को उसकी उचित दशा में लौटाने या पुनर्स्थापित करने का भाव सामान्य आधुनिक हिन्दी में स्पष्ट करता है और यूनानी वर्तमान काल को भी बनाए रखता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन की व्यापकता को बिना अनावश्यक व्याख्या के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πῶς γέγραπται ἐπὶ τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र के विषय में यह कैसे लिखा है
  rationale: γέγραπται की शास्त्रीय उद्धरण-सूचक अभिव्यक्ति ‘लिखा है’ और ἐπί का ‘के विषय में’ अर्थ सुरक्षित रहता है।
- source_word: υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: सुसमाचारों के अर्थपूर्ण पदनाम का स्थापित हिन्दी अनुवाद रखा गया है; इसे ‘मसीह’ जैसे व्याख्यात्मक पद से नहीं बदला गया।
- source_word: ἵνα πολλὰ πάθῃ
  choice: कि वह बहुत दुःख उठाए
  rationale: ἵνα यहाँ लिखी हुई बात की विषयवस्तु या अपेक्षित परिणाम प्रस्तुत करता है; πολλὰ का बहुविध या अत्यधिक दुःख का भाव सहज हिन्दी में ‘बहुत दुःख’ से व्यक्त होता है।
- source_word: ἐξουδενηθῇ
  choice: तुच्छ समझा जाए
  rationale: किसी को नगण्य या किसी गिनती का न मानने के निष्क्रिय भाव को यह निकटता से व्यक्त करता है।
theological_decisions:
- issue: एलिय्याह की पुनर्स्थापना और मनुष्य के पुत्र के दुःख के बीच संबंध
  choice: दूसरे वाक्य को वास्तविक आलंकारिक प्रश्न के रूप में रखा गया है और ‘और’ से मूल जुड़ाव सुरक्षित है।
  alternative: ‘फिर भी ऐसा कैसे...’ जैसे विरोधसूचक शब्द जोड़कर संबंध की व्याख्या करना।
  rationale: यूनानी पाठ πῶς के साथ प्रश्न प्रस्तुत करता है और पुनर्स्थापना तथा दुःख को साथ रखता है; अनुवाद इस तनाव को समझाकर समाप्त नहीं करता।
- issue: ‘मनुष्य का पुत्र’ का संदर्भ
  choice: पदनाम को ज्यों का त्यों अनूदित रखा गया है।
  alternative: इसे ‘मसीह’ या ‘मानव-पुत्र’ जैसी व्याख्यात्मक अभिव्यक्ति से बदलना।
  rationale: मूल पद स्वयं अपने मसीही और प्रकाशनात्मक संकेतों सहित खड़ा रहता है; विस्तार जोड़ना पाठ से आगे जाना होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फिर से ठीक करता है’ औपचारिक ‘पुनर्स्थापित करता है’ की अपेक्षा अधिक सुलभ है, जबकि मूल अर्थ को बनाए रखता है। पाद-टिप्पणी का चिह्न उसी पद के बाद रखा गया है जिससे वह संबंधित है।
