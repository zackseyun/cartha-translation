source:
  edition: SBLGNT
  text: καὶ ἤνεγκαν αὐτὸν πρὸς αὐτόν. καὶ ἰδὼν αὐτὸν ⸂τὸ πνεῦμα εὐθὺς⸃ ⸀συνεσπάραξεν αὐτόν, καὶ πεσὼν ἐπὶ τῆς γῆς ἐκυλίετο ἀφρίζων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/020.yaml
  text: And they brought him to him[a]. And when the spirit saw him, it immediately convulsed him, and he fell on the ground and rolled about[b], foaming.
translation:
  language: hi
  text: वे उस लड़के को यीशु के पास ले आए। उस आत्मा[a] ने यीशु को देखते ही लड़के को तुरंत ऐंठन से तड़पाया[b]। वह ज़मीन पर गिर पड़ा और झाग छोड़ते हुए लोटता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस अशुद्ध आत्मा।” व्यापक प्रसंग आत्मा को अशुद्ध बताता है, पर इस पद में मूल पाठ केवल “आत्मा” कहता है।
    reason: alternative_reading
  - marker: b
    text: या, “उसे बुरी तरह ऐंठ दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκαν
  choice: ले आए
  rationale: यहाँ क्रिया का अर्थ लड़के को यीशु के पास लाना है; ‘ले आए’ आधुनिक हिन्दी की स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: πρὸς αὐτόν
  choice: यीशु के पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर गति बताता है। हिन्दी में अस्पष्ट दोहरे सर्वनाम से बचने के लिए प्रसंगानुसार यीशु का नाम स्पष्ट किया गया है।
- source_word: ἰδὼν αὐτόν
  choice: यीशु को देखते ही
  rationale: कालवाचक कृदन्त को ‘देखते ही’ कहना उसके तत्काल बाद होने वाली प्रतिक्रिया और मरकुस की तीव्र कथाशैली को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: उस आत्मा
  rationale: मूल पद में केवल ‘आत्मा’ है; इस पद में ‘अशुद्ध’ या ‘दुष्टात्मा’ जोड़ना व्याख्यात्मक विस्तार होता। ‘उस’ पूर्वप्रसंग में उल्लिखित आत्मा की ओर संकेत करता है।
- source_word: εὐθὺς
  choice: तुरंत
  rationale: यह εὐθύς की तात्कालिकता को सामान्य आधुनिक हिन्दी में बनाए रखता है।
- source_word: συνεσπάραξεν
  choice: बुरी तरह ऐंठ दिया
  rationale: क्रिया तीव्र ऐंठन या मरोड़ उत्पन्न करने का बोध कराती है। यह चयन हिंसक शारीरिक प्रतिक्रिया को स्पष्ट करता है, बिना फाड़ने का भ्रामक अर्थ दिए।
- source_word: πεσὼν ἐπὶ τῆς γῆς
  choice: वह जमीन पर गिर पड़ा
  rationale: कृदन्तीय क्रम को हिन्दी में पूर्ण क्रिया के रूप में रखना स्वाभाविक है और स्पष्ट करता है कि लड़का गिरा, आत्मा नहीं।
- source_word: ἐκυλίετο
  choice: लोटने लगा
  rationale: अपूर्ण भूतकाल जारी गति का संकेत देता है; ‘लोटने लगा’ जमीन पर बार-बार घूमने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀφρίζων
  choice: मुँह से झाग निकालते हुए
  rationale: मूल में केवल ‘झाग बनाते/निकालते हुए’ है; हिन्दी में शरीरगत क्रिया को समझने योग्य बनाने के लिए ‘मुँह से’ निहित अर्थ को स्पष्ट किया गया है।
theological_decisions:
- issue: πνεῦμα की पहचान
  choice: मुख्य पाठ में ‘उस आत्मा’
  alternative: ‘उस अशुद्ध आत्मा’ या ‘उस दुष्टात्मा’
  rationale: व्यापक प्रसंग इस सत्ता को अशुद्ध आत्मा के रूप में पहचानता है, पर इस पद में यूनानी पाठ केवल τὸ πνεῦμα कहता है। इसलिए मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति और उसकी सीमा को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। हिन्दी में सर्वनामों की संभावित अस्पष्टता दूर करने के लिए ‘लड़के’ और ‘यीशु’ को प्रसंगानुसार स्पष्ट किया गया है। ‘मुँह से’ यूनानी में अलग से नहीं है, पर ἀφρίζων का स्वाभाविक और सहज हिन्दी बोध देता है।
