id: MRK.9.31
reference: Mark 9:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐδίδασκεν γὰρ τοὺς μαθητὰς αὐτοῦ καὶ ἔλεγεν αὐτοῖς ὅτι Ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται εἰς χεῖρας ἀνθρώπων, καὶ ἀποκτενοῦσιν αὐτόν, καὶ ἀποκτανθεὶς ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/031.yaml
  text: For he was teaching his disciples and telling them[a], “The Son of Man is being handed over into the hands of men, and they will kill him, and after he is killed[b], after three days he will rise.”
translation:
  language: hi
  text: क्योंकि वह अपने शिष्यों को शिक्षा दे रहा था और उनसे कह रहा था, “मनुष्य का पुत्र मनुष्यों के हाथों में सौंपा जा रहा है[a], और वे उसे मार डालेंगे; और मारे जाने के बाद वह तीन दिन बाद जी उठेगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “मनुष्यों के हाथों में।” यहाँ “हाथों में” किसी के अधिकार या नियंत्रण में होने का मुहावरा है।'
    reason: idiom_clarification
  - marker: b
    text: या “तीन दिनों में।” यूनानी पाठ यहाँ शाब्दिक रूप से “तीन दिन के बाद” कहता है; अन्य स्थानों पर इसी संदर्भ में “तीसरे दिन” भी कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐδίδασκεν
  choice: शिक्षा दे रहा था
  rationale: अपूर्ण भूतकाल चल रही अथवा बार-बार होने वाली शिक्षा को कथात्मक पृष्ठभूमि में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले प्रसंग का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: अपने शिष्यों को
  rationale: ‘शिष्य’ सुसमाचारों में μαθητής का प्रचलित, संबंधपरक और शिक्षार्थी भाव रखने वाला रूप है।
- source_word: ἔλεγεν αὐτοῖς
  choice: उनसे कह रहा था
  rationale: अपूर्ण भूतकाल निरंतर कथन को सूचित करता है और हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: Ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह स्थापित पदवी मूल अभिव्यक्ति और उसकी संभावित दानिय्येली प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के बनाए रखती है।
- source_word: παραδίδοται
  choice: सौंपा जा रहा है
  rationale: वर्तमान कर्मवाच्य निकट आती या घटती हुई सुपुर्दगी दर्शाता है; यह ‘विश्वासघात किया जा रहा है’ की अपेक्षा व्यापक अर्थ और अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
- source_word: εἰς χεῖρας ἀνθρώπων
  choice: मनुष्यों के हाथों में
  rationale: यह अधिकार और नियंत्रण के ठोस यूनानी मुहावरे को बनाए रखता तथा ‘मनुष्य का पुत्र’ और सामान्य मनुष्यों के बीच शब्दगत संबंध को प्रकट करता है।
- source_word: ἀποκτενοῦσιν αὐτόν
  choice: वे उसे मार डालेंगे
  rationale: भविष्यकालीन बहुवचन क्रिया के अनिर्दिष्ट मानवीय कर्ताओं और सीधे अर्थ को स्पष्ट, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀποκτανθεὶς
  choice: मारे जाने के बाद
  rationale: अओरिस्ट कर्मवाच्य कृदन्त मुख्य क्रिया से पहले घटने वाली हत्या को दर्शाता है; हिन्दी में यह क्रम सहज और स्पष्ट है।
- source_word: μετὰ τρεῖς ἡμέρας
  choice: तीन दिन के बाद
  rationale: μετά के साथ द्वितीया सामान्यतः ‘के बाद’ का अर्थ देती है; इसे ‘तीसरे दिन’ बनाकर अन्य कथनों से समन्वित नहीं किया गया।
- source_word: ἀναστήσεται
  choice: वह जी उठेगा
  rationale: भविष्य मध्यम रूप यहाँ अकर्मक ‘उठना’ का समर्थन करता है; ‘जी उठना’ हिन्दी में पुनरुत्थान का स्वाभाविक और प्रचलित कथन है, कर्मवाच्य अर्थ आरोपित किए बिना।
theological_decisions:
- issue: παραδίδοται का कर्मवाच्य और उसका अभिप्राय
  choice: सौंपा जा रहा है
  alternative: विश्वासघात करके पकड़वाया जा रहा है
  rationale: यूनानी पाठ कर्ता को निर्दिष्ट नहीं करता और विश्वासघात, अधिकारियों को सुपुर्दगी तथा ईश्वरीय अनुमति जैसे अर्थों को एक साथ खुला रख सकता है; चुना हुआ रूप इस तनाव को नहीं मिटाता।
- issue: Ὁ υἱὸς τοῦ ἀνθρώπου और ἀνθρώπων का शब्दगत संबंध
  choice: मनुष्य का पुत्र … मनुष्यों के हाथों में
  alternative: मनुष्य का पुत्र … लोगों के हाथों में
  rationale: ‘मनुष्य/मनुष्यों’ की पुनरावृत्ति मूल के शब्दगत और आलंकारिक संबंध को अधिक पारदर्शी ढंग से सुरक्षित रखती है।
- issue: ἀναστήσεται की वाच्यगत अभिव्यक्ति
  choice: जी उठेगा
  alternative: जिलाया जाएगा
  rationale: मूल का भविष्य मध्यम रूप अकर्मक अर्थ देता है; कर्मवाच्य अनुवाद अन्य पुनरुत्थान कथनों की भाषा को यहाँ आयात कर सकता है।
- issue: μετὰ τρεῖς ἡμέρας की समय-संबंधी भाषा
  choice: तीन दिन के बाद
  alternative: तीसरे दिन
  rationale: यहाँ मूल पाठ का सीधा अर्थ ‘तीन दिन के बाद’ है। अन्य स्थानों की ‘तीसरे दिन’ वाली भाषा से मौन समन्वय नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज कथात्मक शैली रखी गई है। निरंतर क्रियाओं के लिए ‘शिक्षा दे रहा था’ और ‘कह रहा था’ प्रयुक्त हैं। ‘सौंपा जा रहा है’ वर्तमान कर्मवाच्य और अनिर्दिष्ट कर्ता को सुरक्षित रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
