reference: Mark 9:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὃς γὰρ ἂν ποτίσῃ ὑμᾶς ποτήριον ὕδατος ἐν ⸀ὀνόματι ὅτι χριστοῦ ἐστε, ἀμὴν λέγω ὑμῖν ⸀ὅτι οὐ μὴ ⸀ἀπολέσῃ τὸν μισθὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/041.yaml
  text: For whoever gives you a cup of water to drink in the name that you are Messiah's[a], truly I say to you, he will certainly not lose his reward.
translation:
  language: hi
  text: क्योंकि जो कोई तुम्हें एक प्याला पानी पीने को इस नाम से दे कि तुम मसीह के हो[a], मैं तुमसे सच कहता हूँ, वह अपना प्रतिफल निश्चय ही नहीं खोएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तुम मसीह के हो।” यूनानी में “नाम” वाला पद और इसके बाद का वाक्यांश असामान्य ढंग से जुड़े हुए हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὃς γὰρ ἂν
  choice: क्योंकि जो कोई
  rationale: अनिश्चित संबंधवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है और γάρ द्वारा पिछले कथन से संबंध बनाए रखता है।
- source_word: ποτίσῃ ὑμᾶς ποτήριον ὕδατος
  choice: तुम्हें ... एक प्याला पानी पीने को दे
  rationale: ποτίζω के ‘पीने को देना’ अर्थ और ποτήριον ὕδατος की सरल ठोस छवि, दोनों सुरक्षित रहते हैं।
- source_word: ἐν ὀνόματι ὅτι χριστοῦ ἐστε
  choice: इस कारण ... कि तुम मसीह के हो
  rationale: यह कठिन यूनानी विन्यास संभवतः पहचान या संबद्धता के आधार को बताता है। हिन्दी में कारणवाचक रूप अर्थ को स्पष्ट करता है, पर स्रोत में न पाए जाने वाले ‘मेरे नाम से’ को नहीं जोड़ता।
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यीशु के गंभीर आश्वासन-सूत्र का गरिमापूर्ण और स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: οὐ μὴ ἀπολέσῃ
  choice: निश्चय ही नहीं खोएगा
  rationale: οὐ μή के प्रबल निषेध को स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸν μισθὸν αὐτοῦ
  choice: अपना प्रतिफल
  rationale: μισθός यहाँ नैतिक अथवा भावी प्रतिदान के अर्थ में है; ‘प्रतिफल’ गरिमापूर्ण और संदर्भानुकूल है।
theological_decisions:
- issue: χριστοῦ को उपाधि अथवा नाम-जैसे रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस संबंधसूचक प्रयोग में Χριστός यीशु की मसीही उपाधि को धारण करता है; ‘मसीह’ आधुनिक हिन्दी में स्थापित और अर्थपूर्ण रूप है।
- issue: ἐν ὀνόματι ὅτι χριστοῦ ἐστε का संबंध
  choice: इस कारण ... कि तुम मसीह के हो
  alternative: इस नाम पर कि तुम मसीह के हो / नाम के कारण, क्योंकि तुम मसीह के हो
  rationale: वाक्य-विन्यास असामान्य है, किंतु ὅτι को कारणवाचक समझना सबसे स्वाभाविक है। यह अनुवाद सेवा का आधार मसीह से शिष्यों की संबद्धता बताता है और पाठ में अनुपस्थित ‘मेरे’ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के योग्य। ‘प्याला पानी’ स्रोत की ठोस अभिव्यक्ति बनाए रखता है; ‘निश्चय ही नहीं’ मूल के प्रबल निषेध को उभारता है।
