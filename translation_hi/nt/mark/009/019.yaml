base_translation:
  language: en
  yaml_path: translation/nt/mark/009/019.yaml
  text: And answering them[a], he says, “O unbelieving generation[b], how long will I be with you? How long will I put up with you? Bring him to me.”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया और कहा, “हे अविश्वासी पीढ़ी[a], मैं कब तक तुम्हारे साथ रहूँगा? कब तक तुम्हें सहता रहूँगा?[b] उसे मेरे पास लाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्वासहीन पीढ़ी।” यूनानी शब्द ἄπιστος विश्वास की कमी या निष्ठा की कमी—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “कब तक तुम्हें बर्दाश्त करता रहूँगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: तब वह उन्हें उत्तर देता है
  rationale: यह अनुवाद उत्तर देने वाले कृदंत और मरकुस के सजीव ऐतिहासिक वर्तमान ‘कहता है’ का स्वाभाविक हिन्दी रूप बनाए रखता है।
- source_word: γενεὰ ἄπιστος
  choice: अविश्वासी पीढ़ी
  rationale: संदर्भ में ἄπιστος मुख्यतः विश्वास की कमी को व्यक्त करता है। ‘अविश्वासी पीढ़ी’ आधुनिक हिन्दी में स्पष्ट है; निष्ठाहीनता की संभावित छाया पाद-टिप्पणी में सुरक्षित है।
- source_word: ἕως πότε
  choice: कब तक
  rationale: यूनानी कालवाचक अभिव्यक्ति का स्वाभाविक और सीधा हिन्दी समतुल्य।
- source_word: πρὸς ὑμᾶς ἔσομαι
  choice: मैं कब तक तुम्हारे साथ रहूँगा
  rationale: πρός यहाँ उनके साथ निरंतर उपस्थिति और संबंध को व्यक्त करता है; ‘तुम्हारे साथ’ हिन्दी में सहज है।
- source_word: ἀνέξομαι ὑμῶν
  choice: कब तक तुम्हें सहता रहूँगा
  rationale: यह यीशु की खिन्नता और सहते रहने या बरदाश्त करने के अर्थ को गरिमापूर्ण, सहज हिन्दी में व्यक्त करता है।
- source_word: φέρετε αὐτὸν πρός με
  choice: उसे मेरे पास लाओ
  rationale: आज्ञार्थक क्रिया, पुरुषवाचक कर्म और दिशा—तीनों को संक्षिप्त तथा स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: यीशु के संबोधन में ἄπιστος का अर्थ
  choice: अविश्वासी
  alternative: निष्ठाहीन
  rationale: तात्कालिक प्रसंग में विश्वास की कमी प्रमुख है, पर यूनानी शब्द विश्वासयोग्यता या निष्ठा की कमी भी सूचित कर सकता है। वैकल्पिक अर्थ को पाद-टिप्पणी में रखकर धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट है। ‘उत्तर देता है’ मरकुस के ऐतिहासिक वर्तमान की सजीवता बनाए रखता है, जबकि ‘सहता रहूँगा’ बोलचाल और अत्यधिक संस्कृतनिष्ठ शैली के बीच संतुलन रखता है।
