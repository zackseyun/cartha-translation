  text: καὶ ὤφθη αὐτοῖς Ἠλίας σὺν Μωϋσεῖ, καὶ ἦσαν συλλαλοῦντες τῷ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/004.yaml
  text: And Elijah appeared to them with Moses[a], and they were talking with Jesus.
translation:
  language: hi
  text: और उन्हें मूसा के साथ एलिय्याह दिखाई दिया, और वे यीशु से बातचीत कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘यीशु से बात कर रहे थे।’
    reason: συλλαλοῦντες के लिए स्वाभाविक हिन्दी में निकटवर्ती शाब्दिक विकल्प।
lexical_decisions:
- source_word: ὤφθη
  choice: दिखाई दिया
  rationale: यह ὁράω का अओरिस्ट कर्मवाच्य रूप है, जो यहाँ अकर्मक अर्थ में ‘प्रकट हुआ/दिखाई दिया’ व्यक्त करता है। ‘दिखाई दिया’ स्वाभाविक हिन्दी है और उन लोगों की दृष्टि में आने के भाव को बनाए रखता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: सम्प्रदान कारक उन व्यक्तियों को सूचित करता है जिन्हें यह दृश्य दिखाई दिया; हिन्दी में ‘उन्हें’ सीधा और स्वाभाविक है।
- source_word: Ἠλίας
  choice: एलिय्याह
  rationale: बाइबलीय नाम का हिन्दी में प्रचलित रूप।
- source_word: σὺν Μωϋσεῖ
  choice: मूसा के साथ
  rationale: σύν साथ होने का सीधा भाव देता है; ‘के साथ’ इसे स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: συλλαλοῦντες
  choice: बातचीत कर रहे थे
  rationale: यह कृदन्त परस्पर बोलने या वार्तालाप करने का भाव रखता है। ‘बातचीत कर रहे थे’ उस पारस्परिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τῷ Ἰησοῦ
  choice: यीशु से
  rationale: यद्यपि यह रूप सम्प्रदान कारक है, συλλαλέω के साथ इसका अर्थ किसी के साथ वार्तालाप करना है। हिन्दी में ‘यीशु से बातचीत’ अधिक स्वाभाविक है और पारस्परिक भाव बनाए रखता है।
theological_decisions:
- issue: रूपान्तरण के दृश्य में एलिय्याह और मूसा की पहचान तथा उपस्थिति की वास्तविकता
  choice: पद को सीधे रूप में प्रस्तुत किया गया है कि एलिय्याह मूसा के साथ दिखाई दिया और दोनों यीशु से बातचीत कर रहे थे।
  alternative: इसे केवल दर्शन, व्यक्तिपरक अनुभव या प्रतीकात्मक प्रतिनिधित्व के रूप में स्पष्ट करना।
  rationale: यूनानी कथन उन्हें दिखाई देने और यीशु से बातचीत करने वालों के रूप में प्रस्तुत करता है। अनुवाद न तो इस प्रस्तुति को कमजोर करता है, न पाठ से आगे कोई सैद्धान्तिक व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘बातचीत’ परस्पर वार्तालाप का भाव स्पष्ट करती है, जबकि नामों के प्रचलित हिन्दी रूप रखे गए हैं।
