source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Μὴ κωλύετε αὐτόν, οὐδεὶς γάρ ἐστιν ὃς ποιήσει δύναμιν ἐπὶ τῷ ὀνόματί μου καὶ δυνήσεται ταχὺ κακολογῆσαί με·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/039.yaml
  text: But Jesus said[a], “Do not stop him[b], for there is no one who will do a mighty work in my name and soon be able to speak evil of me.”
translation:
  language: hi
  text: पर यीशु ने कहा, “उसे मत रोको, क्योंकि ऐसा कोई नहीं जो मेरे नाम से कोई सामर्थ्यपूर्ण कार्य करे[a] और शीघ्र ही मेरे विरुद्ध बुरा बोल सके[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चमत्कार करे” अथवा “सामर्थ्य का कार्य करे”; यूनानी शब्द δύναμिन का मूल अर्थ “सामर्थ्य” है और यह सामर्थ्य से किए गए असाधारण कार्य के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरी बुराई कर सके,” “मुझे अपशब्द कह सके,” या “मेरी निंदा कर सके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: κωλύετε
  choice: मत रोको
  rationale: μή के साथ वर्तमान आज्ञार्थक यहाँ रोकने के निषेध को व्यक्त करता है; ‘उसे मत रोको’ प्रसंगानुकूल और स्वाभाविक हिन्दी है।
- source_word: δύναμιν
  choice: सामर्थ्य का काम
  rationale: यह संज्ञा सामर्थ्य तथा उससे प्रकट होने वाले असाधारण कार्य दोनों का बोध कराती है। यह रूप ‘चमत्कार’ की अपेक्षा मूल शब्द की व्यापकता को अधिक सुरक्षित रखता है।
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: इस प्रसंग में वाक्यांश यीशु के नाम का आह्वान करके अथवा उसके अधिकार के आधार पर कार्य करने को दर्शाता है; ‘मेरे नाम से’ सहज हिन्दी है और दोनों भावों को खुला रखता है।
- source_word: ταχὺ
  choice: शीघ्र ही
  rationale: क्रियाविशेषण समय की निकटता बताता है; ‘शीघ्र ही’ वर्तमान मानक हिन्दी में स्पष्ट है।
- source_word: κακολογῆσαί
  choice: मेरी बुराई कर सके
  rationale: क्रिया किसी के विरुद्ध बुरा बोलने या उसे अपशब्द कहने का व्यापक अर्थ रखती है। ‘बुराई करना’ इस विस्तार को बनाए रखता है और ‘निंदा’ जैसे अधिक विशिष्ट धार्मिक अर्थ से बचता है।
- source_word: οὐδεὶς γάρ ἐστιν ὃς
  choice: क्योंकि ऐसा कोई नहीं जो
  rationale: यह मूल यूनानी की संरचना और बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: δυνήσεται
  choice: कर सके
  rationale: भविष्यकालीन सामर्थ्य को हिन्दी की संभाव्य रचना ‘सके’ से स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु के नाम से किए गए कार्य का स्वरूप
  choice: δύναμιν का अनुवाद ‘सामर्थ्य का काम’ किया गया है।
  alternative: ‘चमत्कार’ या ‘सामर्थ्यशाली काम’
  rationale: मूल शब्द सामर्थ्य और असाधारण सामर्थ्यपूर्ण कार्य दोनों को सूचित कर सकता है। चुना हुआ रूप इसे केवल आधुनिक अर्थ वाले ‘चमत्कार’ तक सीमित नहीं करता।
- issue: यीशु से उस व्यक्ति के संबंध का निहितार्थ
  choice: कथन को उसके सीमित, वर्णनात्मक आशय में रखा गया है।
  alternative: उस व्यक्ति को स्पष्ट रूप से सच्चा शिष्य या केवल अवसरवादी ठहराना
  rationale: पद केवल इतना कहता है कि यीशु के नाम से सामर्थ्य का काम करने वाला शीघ्र ही उसकी बुराई नहीं कर सकेगा; इससे आगे उसकी आत्मिक स्थिति निर्धारित नहीं की गई है।
- issue: ταχὺ और κακολογῆσαί के बीच संबंध
  choice: ‘शीघ्र ही मेरी बुराई कर सके’
  alternative: ‘जल्दी से मेरी बुराई कर सके’
  rationale: ‘शीघ्र ही’ को समयगत अर्थ में रखा गया है, न कि बोलने की गति के अर्थ में।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज स्तर रखा गया है। ‘मत रोको’ सीधा निषेध है; ‘सामर्थ्य का काम’ मूल की शब्दार्थगत व्यापकता बचाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
