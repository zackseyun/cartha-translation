review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the Greek conditional clause, the forceful imperative, the comparison, 'life,' lameness, and Gehenna. However, 'तुम्हें ठोकर खिलाता है' is not idiomatic Hindi for a foot metaphorically causing someone to stumble; it ordinarily suggests making someone trip and is awkward with one's own foot as agent. 'तुम्हें ठोकर लगती है' would shift the agency and meaning. 'तुम्हारे लिए ठोकर का कारण बनता है' preserves σκανδαλίζῃ's metaphor and causative sense naturally. The passive βληθῆναι is properly retained.
  naturalness: The proposed revision is fluent modern standard Hindi and keeps the sober, vivid register. 'दोनों पैर रहते हुए' is understandable, but 'दोनों पैर होने पर' is more idiomatic in this comparative construction. Using singular 'तुम्हारा पैर' and then 'दोनों पैर' follows the source's deliberate contrast.
  terminology: '''जीवन में प्रवेश करना,'' ''लँगड़े होकर,'' and transliterated ''गेहन्ना'' are suitable. The footnote correctly supplies ''नरक'' as an interpretive alternative and appropriately identifies the Valley of Hinnom and divine-judgment associations. ''ईश्वरीय'' is acceptable, though ''परमेश्वर के न्याय'' is somewhat more direct; no theological expansion is introduced.'
  issues:
  - severity: medium
    issue: ‘तुम्हारा पैर तुम्हें ठोकर खिलाता है’ is an awkward and potentially misleading rendering of σκανδαλίζῃ.
    rationale: In current Hindi, 'ठोकर खिलाना' usually means causing someone to trip physically. With one's own foot as the subject it sounds unnatural, while the Greek retains a broader metaphor of being a cause of stumbling. ‘तुम्हारे लिए ठोकर का कारण बनता है’ preserves both metaphor and causation without narrowing it to sin.
  - severity: low
    issue: ‘दोनों पैर रहते हुए’ is less idiomatic than needed.
    rationale: The meaning is correct, but ‘दोनों पैर होने पर’ is more natural modern Hindi and retains the participial contrast with entering life lame.
  revised_text: और यदि तुम्हारा पैर तुम्हारे लिए ठोकर का कारण बनता है, तो उसे काट डालो। तुम्हारे लिए लँगड़े होकर जीवन में प्रवेश करना इससे अच्छा है कि दोनों पैर होने पर गेहन्ना[a] में फेंक दिए जाओ।
