  to: और यदि तुम्हारा पैर तुम्हारे लिए ठोकर का कारण बनता है, तो उसे काट डालो। तुम्हारे लिए लँगड़े होकर जीवन में प्रवेश करना इससे अच्छा है कि दोनों पैर होने पर गेहन्ना[a] में फेंक दिए जाओ।
