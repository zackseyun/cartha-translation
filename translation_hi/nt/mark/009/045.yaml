source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ πούς σου σκανδαλίζῃ σε, ἀπόκοψον αὐτόν· καλόν ἐστίν ⸀σε εἰσελθεῖν εἰς τὴν ζωὴν χωλὸν ἢ τοὺς δύο πόδας ἔχοντα βληθῆναι εἰς τὴν ⸀γέενναν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/045.yaml
  text: And if your foot causes you to stumble[a], cut it off. It is better for you to enter into life lame than, having both feet, to be thrown into Gehenna.
translation:
  language: hi
  text: और यदि तुम्हारा पैर तुम्हारे लिए ठोकर का कारण बनता है, तो उसे काट डालो। तुम्हारे लिए लँगड़े होकर जीवन में प्रवेश करना इससे अच्छा है कि दोनों पैर होने पर गेहन्ना[a] में फेंक दिए जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “नरक।” यूनानी शब्द ‘गेहन्ना’ है, जो हिन्नोम की घाटी और उससे जुड़े परमेश्वर के न्याय के बिंबों की याद दिलाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: ठोकर खिलाता है
  rationale: यह यूनानी क्रिया ठोकर, पतन या पाप में फँसने की रूपकात्मक धारणा रखती है। ‘ठोकर खिलाता है’ मूल रूपक और उसकी अर्थगत व्यापकता को बनाए रखता है; ‘पाप करवाता है’ अर्थ को अनावश्यक रूप से संकुचित कर देता।
- source_word: ἀπόκοψον
  choice: काट डालो
  rationale: अओरिस्ट आज्ञार्थक का आदेश तीखा और ठोस है। ‘काट डालो’ कथन की जानबूझकर चौंकाने वाली तीव्रता को नरम नहीं करता।
- source_word: καλόν ἐστίν
  choice: इससे अच्छा है
  rationale: ἤ से बने तुलनात्मक वाक्य में καλόν का स्वाभाविक अर्थ ‘अच्छा’ मात्र नहीं, बल्कि ‘इससे अच्छा’ है।
- source_word: εἰσελθεῖν εἰς τὴν ζωὴν
  choice: जीवन में प्रवेश करना
  rationale: यह अनुवाद प्रवेश के मूल बिंब और युगांतकारी जीवन के संकेत को सुरक्षित रखता है। यूनानी में केवल ζωή है, इसलिए ‘अनन्त’ नहीं जोड़ा गया।
- source_word: χωλὸν
  choice: लँगड़े होकर
  rationale: χωλός विशेष रूप से चलने की अक्षमता या लँगड़ेपन को दर्शाता है और पैर के संदर्भ में यही सबसे सटीक, स्वाभाविक हिन्दी है।
- source_word: βληθῆναι
  choice: फेंक दिए जाओ
  rationale: यह βάλλω के कर्मवाच्य अनन्तरूप की शक्ति और न्याय के अधीन किए जाने की धारणा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γέενναν
  choice: गेहन्ना
  rationale: यह विशिष्ट यूनानी नाम को सुरक्षित रखता है, जो हिन्नोम की घाटी और ईश्वरीय न्याय से जुड़े बिंब जगाता है; सामान्य पारंपरिक समानार्थ ‘नरक’ को पादटिप्पणी में दिया गया है।
- source_word: τοὺς δύο πόδας ἔχοντα
  choice: दोनों पैर रहते हुए
  rationale: यह सहभागी पदबंध को सहज हिन्दी में व्यक्त करता है और लँगड़े होकर जीवन में प्रवेश करने के साथ उसका स्पष्ट विरोध बनाए रखता है।
theological_decisions:
- issue: न्याय के संदर्भ में γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: मूल पाठ सामान्य परलोक-संज्ञा नहीं, बल्कि विशिष्ट शब्द γέεννα का प्रयोग करता है। ‘गेहन्ना’ स्रोत की ऐतिहासिक और युगांतकारी विशिष्टता बचाता है, जबकि परिचित व्याख्यात्मक समानार्थ ‘नरक’ पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर, स्पष्ट और सामान्य पाठक के लिए सुबोध शैली। ‘ठोकर खिलाता है’ मूल रूपक को बनाए रखता है; ‘काट डालो’ कथन की तीव्रता सुरक्षित रखता है।
