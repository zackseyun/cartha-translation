  text: καὶ λαβὼν παιδίον ἔστησεν αὐτὸ ἐν μέσῳ αὐτῶν καὶ ἐναγκαλισάμενος αὐτὸ εἶπεν αὐτοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/036.yaml
  text: 'And taking a child[a], he set him in their midst, and taking him in his arms[b], he said to them:'
translation:
  language: hi
  text: 'और उसने एक बच्चे को लेकर उनके बीच खड़ा कर दिया[a] और उसे बाँहों में भरकर[b] उनसे कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे उनके बीच रख दिया।’ यूनानी क्रिया का शाब्दिक अर्थ ‘खड़ा कर दिया’ है, पर प्रसंग में इसका अर्थ किसी को बीच में रख देना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसे अपनी बाँहों में ले लिया।’ यूनानी क्रिया बाँहों में लेने या आलिंगन करने, दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: लेकर
  rationale: अओरिस्ट कृदन्त पहले किए गए कार्य को मुख्य क्रिया से जोड़ता है; ‘लेकर’ हिन्दी में इस क्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: παιδίον
  choice: एक बच्चे को
  rationale: यह शब्द बच्चे को दर्शाता है; प्रसंग उसकी बहुत छोटी आयु पर विशेष बल नहीं देता, इसलिए ‘छोटे बच्चे’ की अपेक्षा ‘एक बच्चे’ अधिक तटस्थ है।
- source_word: ἔστησεν
  choice: खड़ा कर दिया
  rationale: ἵστημι का यहाँ सकर्मक अर्थ ‘खड़ा करना’ है। यह अनुवाद यूनानी क्रिया की ठोस शारीरिक मुद्रा को सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐν μέσῳ αὐτῶν
  choice: उनके बीच
  rationale: यह पद समूह के मध्य स्थित होने को व्यक्त करता है; ‘उनके बीच’ सहज हिन्दी है और स्थान-संबंधी भाव बनाए रखता है।
- source_word: ἐναγκαλισάμενος
  choice: उसे बाँहों में भरकर
  rationale: क्रिया किसी को बाँहों में लेने अथवा आलिंगन करने का संकेत दे सकती है। ‘बाँहों में भरकर’ दोनों भावों को स्वाभाविक हिन्दी में समेटता है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: यह λέγω और उसके अप्रत्यक्ष कर्म का सीधा, सामान्य हिन्दी रूप है।
