  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τὸ Εἰ ⸀δύνῃ, πάντα δυνατὰ τῷ πιστεύοντι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/023.yaml
  text: But Jesus said to him[b][a], “ ‘If you can’? All things are possible for the one who believes.”
translation:
  language: hi
  text: पर यीशु ने उससे कहा, “‘यदि आप कर सकते हैं’?[a] विश्वास करने वाले के लिए सब कुछ संभव है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में उद्धृत शब्दों के पहले का लेख “यदि आप कर सकते हैं” वाक्यांश पर विशेष बल देता है। यीशु पिछले पद में पिता के कहे शब्दों को दोहराकर उन्हें चुनौती देते हैं।
    reason: lexical_alternative
  - marker: b
    text: “विश्वास करने वाले” का अनुवाद “भरोसा रखने वाले” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Τὸ Εἰ δύνῃ
  choice: यह क्या, ‘यदि आप कुछ कर सकते हैं’?
  rationale: नपुंसकलिंग लेख Τὸ पिता के पिछले कथन को उद्धृत करके उस पर बल देता है। हिन्दी में यह प्रश्नवाचक रूप यीशु द्वारा उन्हीं शब्दों को दोहराकर चुनौती देने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δύνῃ
  choice: आप कुछ कर सकते हैं
  rationale: δύναμαι का सामान्य अर्थ ‘सकना/समर्थ होना’ है। पिछले पद के आशय से जुड़ने के कारण ‘कुछ कर सकते हैं’ स्वाभाविक हिन्दी है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन πάντα को आधुनिक हिन्दी में ‘सब कुछ’ स्वाभाविक और व्यापक रूप से व्यक्त करता है।
- source_word: δυνατὰ
  choice: सम्भव है
  rationale: इस विधेयात्मक प्रयोग में δυνατός का अर्थ ‘सम्भव’ है। ‘सब कुछ’ के साथ हिन्दी में एकवचन ‘है’ व्याकरणसम्मत है।
- source_word: τῷ πιστεύοντι
  choice: विश्वास करने वाले के लिए
  rationale: वर्तमान कृदन्त सामान्य रूप से उस व्यक्ति को सूचित करता है जो विश्वास करता है; यह अनुवाद उसे स्थायी उपाधि ‘विश्वासी’ बनाने के बजाय क्रियात्मक भाव बनाए रखता है।
- source_word: πιστεύοντι
  choice: विश्वास करने वाले
  rationale: πιστεύω का सीधा अर्थ ‘विश्वास करना’ है। सन्दर्भ में ‘भरोसा रखने वाले’ भी सम्भव है, पर मुख्य पाठ में शब्द-परिवार की पारदर्शिता रखी गई है।
theological_decisions:
- issue: ‘सब कुछ सम्भव है’ का दायरा
  choice: मुख्य पाठ में कथन को बिना किसी व्याख्यात्मक सीमा के रखा गया है।
  alternative: ‘परमेश्वर के द्वारा विश्वास करने वाले के लिए सब कुछ सम्भव है।’
  rationale: यूनानी पाठ यहाँ ‘परमेश्वर के द्वारा’ नहीं जोड़ता। व्यापक सन्दर्भ अर्थ को दिशा दे सकता है, पर अनुवाद में जोड़ देने से मूल कथन का संक्षिप्त बल और उसका धर्मवैचारिक तनाव समाप्त हो जाएगा।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पिता द्वारा यीशु को सम्बोधित करते समय प्रयुक्त भाव के अनुरूप उद्धरण में ‘आप’ रखा गया है। ‘सम्भव’ dignified standard Hindi है; ‘मुमकिन’ की अपेक्षा बाइबलीय प्रकाशन-शैली के अधिक अनुकूल है।
