  yaml_path: translation/nt/mark/009/010.yaml
  text: And they kept the matter to themselves[b][a], discussing what it meant to rise from the dead.
translation:
  language: hi
  text: और उन्होंने उस बात को अपने तक ही रखा और आपस में चर्चा करते रहे कि “मरे हुओं में से जी उठने” का क्या अर्थ है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν λόγον
  choice: उस बात
  rationale: यहाँ λόγος यीशु के पिछले कथन की ओर संकेत करता है। आधुनिक हिन्दी में ‘उस बात’ स्वाभाविक है और संदर्भ को स्पष्ट रखता है; ‘वचन’ यहाँ अनावश्यक रूप से तकनीकी या धार्मिक अर्थ दे सकता है।
- source_word: ἐκράτησαν πρὸς ἑαυτοὺς
  choice: अपने ही बीच रखा
  rationale: κρατέω और πρὸς ἑαυτούς का संयुक्त भाव है कि उन्होंने उस बात को अपने समूह तक सीमित रखा। यह हिन्दी प्रयोग निजी रूप से बात रखने और उसे बाहर न फैलाने—दोनों भावों को व्यक्त करता है।
- source_word: συζητοῦντες
  choice: आपस में चर्चा करते रहे
  rationale: कृदन्त चलती हुई पारस्परिक विचार-विमर्श की क्रिया बताता है। ‘चर्चा’ असहमति या झगड़े का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: τί ἐστιν
  choice: का क्या अर्थ है
  rationale: शाब्दिक ‘क्या है’ की अपेक्षा यहाँ शिष्य उस अभिव्यक्ति का आशय समझने का प्रयास कर रहे हैं; ‘क्या अर्थ है’ स्वाभाविक हिन्दी में यही प्रश्न व्यक्त करता है।
- source_word: τὸ ἐκ νεκρῶν ἀναστῆναι
  choice: “मरे हुओं में से जी उठने”
  rationale: ἐκ νεκρῶν का ‘मरे हुओं में से’ अनुवाद स्रोत की ‘among/out from the dead’ संरचना को बनाए रखता है, जबकि ‘जी उठना’ पुनरुत्थान के लिए सहज और व्यापक रूप से समझा जाने वाला हिन्दी पद है। उद्धरण-चिह्न इसे उस अभिव्यक्ति के रूप में दिखाते हैं जिस पर वे विचार कर रहे थे।
theological_decisions:
- issue: शिष्यों द्वारा पुनरुत्थान-संबंधी अभिव्यक्ति पर विचार
  choice: “मरे हुओं में से जी उठने” का क्या अर्थ है
  alternative: “मृतकों में से पुनरुत्थान” क्या है
  rationale: चुना हुआ रूप मूल पुनरुत्थान-भाषा और शिष्यों की अनिश्चितता दोनों को बनाए रखता है, पर बाद की धर्मवैज्ञानिक व्याख्या जोड़कर प्रश्न को हल नहीं करता। ‘जी उठना’ सामान्य पाठक के लिए ‘पुनरुत्थान’ की अपेक्षा अधिक सहज है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘अपने ही बीच’ निजी दायरे का भाव रखता है और ‘आपस में चर्चा करते रहे’ निरंतर विचार-विमर्श को व्यक्त करता है। स्रोत के प्रमुख अर्थभेद को मुख्य पाठ में स्वाभाविक रूप से सुरक्षित रखने के कारण पादटिप्पणी आवश्यक नहीं मानी गई।
