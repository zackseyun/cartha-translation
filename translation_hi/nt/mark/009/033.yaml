  text: Καὶ ⸀ἦλθον εἰς Καφαρναούμ. καὶ ἐν τῇ οἰκίᾳ γενόμενος ἐπηρώτα αὐτούς· Τί ἐν τῇ ⸀ὁδῷ διελογίζεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/033.yaml
  text: And they came to Capernaum. And when he was in the house, he was asking them, “What were you discussing on the way?”
translation:
  language: hi
  text: और वे कफरनहूम आए। जब वह घर में था, तो वह उनसे पूछ रहा था, “रास्ते में तुम किस बात पर चर्चा कर रहे थे?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रास्ते में तुम किस बात पर बहस कर रहे थे?” इस क्रिया का अर्थ चर्चा, विचार-विमर्श या विवाद करना हो सकता है; अगले पद से पता चलता है कि विषय यह था कि उनमें सबसे बड़ा कौन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθον
  choice: वे ... आए
  rationale: बहुवचन क्रिया समूह के कफरनहूम पहुँचने को बताती है; ‘आए’ सहज और सीधा कथात्मक रूप है।
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ἐν τῇ οἰκίᾳ
  choice: घर में
  rationale: यह ठोस स्थान को सहज हिन्दी में व्यक्त करता है; यूनानी निश्चित उपपद के लिए ‘उस घर में’ कहना यहाँ अनावश्यक रूप से किसी खास घर की पहचान पर बल देगा।
- source_word: γενόμενος
  choice: जब वह ... था
  rationale: कृदन्त का कालवाचक संबंध स्पष्ट करता है और यीशु को निहित एकवचन कर्ता के रूप में स्वाभाविक ढंग से सामने रखता है।
- source_word: ἐπηρώτα
  choice: वह ... पूछ रहा था
  rationale: अपूर्णकाल की जारी अथवा पुनरावृत्त क्रिया का पक्ष सुरक्षित रखा गया है, यद्यपि हिन्दी में ‘उसने पूछा’ भी संभव है।
- source_word: Τί
  choice: किस बात पर
  rationale: हिन्दी में चर्चा के विषय के बारे में पूछने का यह स्वाभाविक रूप है और यूनानी प्रश्न का आशय स्पष्ट रखता है।
- source_word: ἐν τῇ ὁδῷ
  choice: रास्ते में
  rationale: यात्रा के प्रसंग में यह प्रचलित और स्वाभाविक हिन्दी समतुल्य है।
- source_word: διελογίζεσθε
  choice: चर्चा कर रहे थे
  rationale: क्रिया विचार-विमर्श, बहस या विवाद को सूचित कर सकती है। ‘चर्चा’ मूल की व्यापकता बनाए रखती है; अगले पद के कारण संभावित विवादात्मक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बहुवचन आगमन के बाद एकवचन कर्ता
  choice: ‘वे ... आए’ के बाद ‘वह ... उनसे पूछ रहा था’
  alternative: ‘वे ... आए, और यीशु ने घर में पहुँचकर उनसे पूछा’
  rationale: यूनानी पाठ का बहुवचन से निहित एकवचन कर्ता की ओर स्वाभाविक परिवर्तन सुरक्षित है। संदर्भ में ‘वह’ यीशु है; नाम जोड़ना स्पष्ट तो होता, पर मूल से अधिक स्पष्टता आयात करता।
- issue: διελογίζεσθε का स्वर
  choice: ‘चर्चा कर रहे थे’
  alternative: ‘बहस कर रहे थे’
  rationale: अगला पद शिष्यों के बीच महानता को लेकर विवाद का संकेत देता है, फिर भी इस पद की क्रिया अपने आप में चर्चा, विचार-विमर्श या विवाद—सभी अर्थ दे सकती है। मुख्य पाठ में तटस्थ व्यापकता और पादटिप्पणी में तीखा विकल्प रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘वह’ संदर्भानुसार यीशु को सूचित करता है। अपूर्णकाल को ‘पूछ रहा था’ और ‘चर्चा कर रहे थे’ से व्यक्त किया गया है।
