  text: Ὃς ⸀ἂν ἓν τῶν τοιούτων παιδίων δέξηται ἐπὶ τῷ ὀνόματί μου, ἐμὲ δέχεται· καὶ ὃς ⸁ἂν ἐμὲ ⸀δέχηται, οὐκ ἐμὲ δέχεται ἀλλὰ τὸν ἀποστείλαντά με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/037.yaml
  text: Whoever receives one of such children in my name receives me; and whoever receives me receives not me, but the one who sent me.
translation:
  language: hi
  text: “जो कोई मेरे नाम पर ऐसे बालकों में से एक को ग्रहण करता है,[a] वह मुझे ग्रहण करता है; और जो कोई मुझे ग्रहण करता है, वह मुझे नहीं, बल्कि उसे ग्रहण करता है जिसने मुझे भेजा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसे एक बालक का स्वागत करता है।” यूनानी में शाब्दिक रूप से “ऐसे बालकों में से एक” है; यह “इन बालकों” के बजाय इस प्रकार के बालक पर बल देता है। पूरे पद में एक ही यूनानी क्रिया प्रयुक्त है, जिसका अनुवाद “स्वागत करता है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὃς ἂν
  choice: जो कोई
  rationale: सापेक्ष सर्वनाम के साथ ἄν एक सामान्य अनिश्चित कथन बनाता है; आधुनिक हिन्दी में ‘जो कोई’ इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: ἓν τῶν τοιούτων παιδίων
  choice: ऐसे बालकों में से किसी एक को
  rationale: यह रूप ἓν के एकवचन, παιδίων की अंशसूचक बहुवचन संबंध-रचना और τοιούτων के ‘इस प्रकार के/ऐसे’ गुणात्मक भाव—तीनों को बनाए रखता है; ‘इन बालकों’ कहने से मूल में निहित न होने वाला स्पष्ट संकेत जुड़ सकता है।
- source_word: δέξηται / δέχεται / δέχηται
  choice: ग्रहण करता है
  rationale: δέχομαι के ‘ग्रहण करना, स्वागत करना, स्वीकार करना’ अर्थों में ‘ग्रहण करना’ वस्तु-श्रृंखला और प्रत्येक उपवाक्य में क्रिया की पुनरावृत्ति सुरक्षित रखता है। ‘स्वागत करता है’ अधिक बोलचाल का वैकल्पिक अर्थ है।
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम में
  rationale: यह संक्षिप्त पारंपरिक रूप यीशु के नाम, व्यक्ति और अधिकार के संबंध में किए गए ग्रहण का भाव खुला रखता है; संदर्भानुसार ‘मेरे नाम के कारण’ भी संभव है।
- source_word: ἐμὲ
  choice: मुझे
  rationale: बलयुक्त कर्मकारक सर्वनाम का सीधा हिन्दी रूप है; पुनरावृत्ति से मूल की आलंकारिक संरचना बनी रहती है।
- source_word: οὐκ ἐμὲ δέχεται ἀλλὰ
  choice: वह मुझे नहीं, बल्कि उसे ग्रहण करता है
  rationale: ‘नहीं…बल्कि’ मूल विरोध को बिना ‘न केवल…बल्कि’ जोड़कर समझाए सुरक्षित रखता है। हिन्दी में दोहराया गया कर्म ‘उसे’ वाक्य को स्पष्ट बनाता है।
- source_word: τὸν ἀποστείλαντά με
  choice: उसे … जिसने मुझे भेजा है
  rationale: संज्ञात्मक कृदंत का यह स्वाभाविक हिन्दी रूप भेजने वाले के साथ संबंध और यीशु के मिशन, दोनों को बनाए रखता है।
theological_decisions:
- issue: 'अंतिम विरोध: ‘मुझे नहीं, बल्कि उसे जिसने मुझे भेजा है’'
  choice: मूल के ‘नहीं…बल्कि’ विरोध को ज्यों का त्यों रखा गया है।
  alternative: ‘न केवल मुझे, बल्कि उसे भी जिसने मुझे भेजा है’
  rationale: वैकल्पिक रूप आशय समझा सकता है, पर मूल में ‘केवल’ और ‘भी’ नहीं हैं। मुख्य पाठ यीशु को ग्रहण करने की वास्तविकता का निषेध समझाने के बजाय इस धर्मवैचारिक तनाव को सुरक्षित रखता है कि यीशु का ग्रहण करना उसे भेजने वाले तक पहुँचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। ‘बालक’ संदर्भ की गरिमा और παιδίον के सामान्य अर्थ को रखता है; ‘ग्रहण करना’ कुछ औपचारिक है, पर मूल की चार बार दोहराई गई क्रिया और बालक—यीशु—भेजने वाले की संबंध-श्रृंखला को स्पष्ट रूप से सुरक्षित रखता है।
