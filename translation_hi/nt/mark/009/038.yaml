source:
  edition: SBLGNT
  text: ⸂Ἔφη αὐτῷ ὁ Ἰωάννης⸃· Διδάσκαλε, εἴδομέν τινα ⸀ἐν τῷ ὀνόματί σου ἐκβάλλοντα δαιμόνια, ⸂καὶ ἐκωλύομεν αὐτόν, ὅτι οὐκ ἠκολούθει ἡμῖν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/038.yaml
  text: John said to him[a], “Teacher, we saw someone casting out demons in your name, and we tried to stop him because he was not following us.”
translation:
  language: hi
  text: यूहन्ना ने उनसे कहा, “गुरु, हमने किसी को आपके नाम से दुष्टात्माएँ निकालते देखा, और हमने उसे रोकने का प्रयास किया[a], क्योंकि वह हमारा अनुसरण नहीं करता था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम उसे रोकते रहे।” यूनानी अपूर्ण भूतकाल बार-बार या लगातार किए गए कार्य के साथ-साथ प्रयास किए गए कार्य को भी व्यक्त कर सकता है।
    reason: क्रिया के पक्ष की वैकल्पिक सम्भावना
lexical_decisions:
- source_word: Ἔφη αὐτῷ ὁ Ἰωάννης
  choice: यूहन्ना ने उनसे कहा
  rationale: ἔφη सामान्य कथात्मक वाणी-क्रिया है, इसलिए सहज हिन्दी भूतकाल ‘कहा’ उपयुक्त है। αὐτῷ को आदरसूचक ‘उनसे’ के रूप में रखा गया है और स्पष्ट कर्ता ὁ Ἰωάννης को बनाए रखा गया है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन διδάσκαλε का सीधा अर्थ ‘शिक्षक’ है; यीशु के लिए सम्बोधन में ‘गुरु’ आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है, जबकि ‘रब्बी’ मूल यूनानी से अधिक विशिष्ट व्याख्या जोड़ता।
- source_word: εἴδομέν τινα
  choice: हमने किसी को ... देखा
  rationale: τινα अनिश्चित व्यक्ति को दर्शाता है; ‘किसी को’ लिंग या पहचान के बारे में अनावश्यक जानकारी नहीं जोड़ता।
- source_word: ἐν τῷ ὀνόματί σου
  choice: आपके नाम से
  rationale: यह वाक्यांश यीशु के नाम और अधिकार के आधार पर किए गए कार्य को व्यक्त करता है। हिन्दी में ‘आपके नाम से’ इस बाइबलीय भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἐκβάλλοντα δαιμόνια
  choice: दुष्टात्माएँ निकालते
  rationale: ἐκβάλλω और δαιμόνια का संयोजन दुष्टात्माओं को निकालने की क्रिया बताता है। ‘दुष्टात्माएँ निकालना’ आधुनिक हिन्दी में स्पष्ट और प्रचलित है।
- source_word: καὶ ἐκωλύομεν αὐτόν
  choice: और हमने उसे रोकने का प्रयास किया
  rationale: अपूर्ण भूतकाल ἐκωλύομεν चल रहे, बार-बार किए गए या प्रयत्न किए गए कार्य का संकेत दे सकता है। ‘रोकने का प्रयास किया’ इस पक्षगत सूक्ष्मता को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: ὅτι οὐκ ἠκολούθει ἡμῖν
  choice: क्योंकि वह हमारे पीछे नहीं चलता था
  rationale: ἡμῖν स्पष्ट रूप से ‘हमारे’ है, न कि ‘आपके’। ‘हमारे पीछे नहीं चलता था’ ἀκολουθέω की ‘पीछे चलने/अनुसरण करने’ की छवि और शिष्य-समूह पर यूहन्ना के जोर, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में उस व्यक्ति के अनुसरण का लक्ष्य
  choice: ἡμῖν का अनुवाद सीधे ‘हमारे’ किया गया है।
  alternative: ‘वह आपके पीछे नहीं चलता था’ या ‘वह हममें से एक नहीं था’
  rationale: यूनानी पाठ में स्पष्ट रूप से ἡμῖν (‘हम/हमारे’) है। इसे बनाए रखने से वह कथात्मक तनाव सुरक्षित रहता है जिसमें यूहन्ना चिंता को शिष्यों के समूह से जुड़ाव के रूप में प्रस्तुत करता है; ‘आपके’ करना पाठ में निहित न होने वाली व्याख्या जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक सर्वनाम और सहज किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘हमारे पीछे’ को जानबूझकर बनाए रखा गया है ताकि समूहगत निष्ठा से जुड़ा मूल कथात्मक तनाव धुँधला न हो।
