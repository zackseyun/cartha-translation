  yaml_path: translation/nt/mark/009/014.yaml
  text: And when they came to the disciples[a], they saw a large crowd around them, and scribes arguing with them.
translation:
  language: hi
  text: जब वे चेलों के पास आए, तो उन्होंने चेलों के चारों ओर एक बड़ी भीड़ और शास्त्रियों को चेलों से बहस[a] करते हुए देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चर्चा करते हुए।” यूनानी क्रिया का अर्थ चर्चा या वाद-विवाद हो सकता है, पर इस प्रसंग में बहस का अर्थ अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθόντες πρὸς τοὺς μαθητάς
  choice: जब वे बाकी चेलों के पास आए
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी कालवाचक उपवाक्य से व्यक्त किया गया है। प्रसंग में यीशु के साथ तीन चेले हैं और वे अन्य चेलों के पास लौटते हैं; इसलिए ‘बाकी’ निहित भेद को स्पष्ट करता है।
- source_word: εἶδον
  choice: उन्होंने ... देखा
  rationale: सरल कथात्मक अओरिस्ट का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὄχλον πολύν
  choice: एक बड़ी भीड़
  rationale: πολύν यहाँ भीड़ के बड़े आकार को बताता है; ‘बड़ी भीड़’ सहज आधुनिक हिन्दी है।
- source_word: περὶ αὐτούς
  choice: उनके चारों ओर
  rationale: περί का स्थानवाचक अर्थ सुरक्षित रखा गया है और सर्वनाम का संकेत चेलों की ओर है।
- source_word: γραμματεῖς
  choice: कुछ शास्त्रियों
  rationale: ‘शास्त्री’ सुसमाचारों में यहूदी धर्मशास्त्र और व्यवस्था के विशेषज्ञों के लिए स्थापित हिन्दी पद है। यूनानी में अनिश्चित बहुवचन होने के कारण हिन्दी में स्वाभाविकता हेतु ‘कुछ’ जोड़ा गया है।
- source_word: συζητοῦντας πρὸς αὐτούς
  choice: उनसे बहस करते
  rationale: συζητέω चर्चा या वाद-विवाद दोनों सूचित कर सकता है; इस संघर्षपूर्ण प्रसंग में ‘बहस’ उपयुक्त है, जबकि ‘उनसे’ का संकेत चेलों की ओर है।
