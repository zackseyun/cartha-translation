  yaml_path: translation/nt/mark/009/034.yaml
  text: But they kept silent[a], because on the road they had argued with one another about who was greater.
translation:
  language: hi
  text: पर वे चुप रहे, क्योंकि रास्ते में उन्होंने आपस में इस बात पर बहस की थी कि कौन बड़ा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “कौन सबसे बड़ा था।” यूनानी विशेषण तुलनात्मक है: “बड़ा”; पर समूह में तुलना होने के कारण इसे भाव की दृष्टि से “सबसे बड़ा” भी समझा जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: पर वे
  rationale: δέ पिछले पद में यीशु के प्रश्न के प्रति शिष्यों की प्रतिक्रिया में हल्का विरोध दिखाता है; “पर वे” आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐσιώπων
  choice: चुप रहे
  rationale: अपूर्ण भूतकाल लगातार बनी हुई चुप्पी को व्यक्त करता है; “चुप रहे” उस जारी प्रतिक्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ उनकी चुप्पी का कारण बताता है; “क्योंकि” इस कारणात्मक संबंध को स्पष्ट करता है।
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: यह पारस्परिक क्रिया को व्यक्त करने वाला स्वाभाविक और संक्षिप्त हिन्दी मुहावरा है।
- source_word: διελέχθησαν
  choice: बहस की थी
  rationale: यहाँ बातचीत का विषय आपसी पद-प्रतिष्ठा था, इसलिए तटस्थ “चर्चा” की अपेक्षा “बहस” संदर्भ की प्रतिस्पर्धात्मक धार को बेहतर व्यक्त करता है। “की थी” उस घटना को वर्तमान दृश्य में उनकी चुप्पी से पहले की घटना के रूप में रखता है।
- source_word: ἐν τῇ ὁδῷ
  choice: रास्ते में
  rationale: यात्रा के प्रसंग में यह यूनानी पदबंध का सहज आधुनिक हिन्दी रूप है।
- source_word: τίς μείζων
  choice: कौन बड़ा है
  rationale: यूनानी में क्रिया लुप्त है और μείζων तुलनात्मक विशेषण है। हिन्दी में “कौन बड़ा है” तुलना को बनाए रखता है और चल रहे पद-संबंधी प्रश्न को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: तुलनात्मक μείζων को तुलनात्मक या भाववाचक सर्वोत्तम रूप में देना
  choice: कौन बड़ा है
  alternative: कौन सबसे बड़ा है
  rationale: यूनानी पाठ में तुलनात्मक रूप “बड़ा” है, यद्यपि अनेक भाषाओं में समूह के भीतर तुलना को स्वाभाविक रूप से “सबसे बड़ा” कहा जा सकता है। मुख्य पाठ स्रोत की तुलनात्मक बनावट को सुरक्षित रखता है और पादटिप्पणी प्रचलित वैकल्पिक अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और बोलचाल में सहज। “चुप रहे,” “आपस में,” और “बहस की थी” सामान्य पाठक के लिए स्पष्ट हैं, जबकि “कौन बड़ा है” मूल यूनानी की तुलनात्मक अभिव्यक्ति को बनाए रखता है।
