source:
  edition: SBLGNT
  text: Καὶ μετὰ ἡμέρας ἓξ παραλαμβάνει ὁ Ἰησοῦς τὸν Πέτρον καὶ τὸν Ἰάκωβον ⸀καὶ Ἰωάννην, καὶ ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν κατ’ ἰδίαν μόνους. καὶ μετεμορφώθη ἔμπροσθεν αὐτῶν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/002.yaml
  text: And after six days[a], Jesus takes Peter and James and John, and brings them up onto a high mountain by themselves. And he was transfigured before them[c][b],
translation:
  language: hi
  text: छह दिन बाद[a], यीशु पतरस, याकूब और यूहन्ना को अपने साथ लेकर अलग से एक ऊँचे पहाड़ पर ले गए, जहाँ केवल वे ही थे[b]। और उनके सामने यीशु का रूप बदल गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “छह दिनों के बाद।”
    reason: lexical_alternative
  - marker: b
    text: या, “निजी रूप से, अकेले।” यूनानी में दो अभिव्यक्तियाँ हैं, जो इस बात पर ज़ोर देती हैं कि यीशु केवल इन तीनों को अपने साथ ले गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: μετὰ ἡμέρας ἓξ
  choice: छह दिन बाद
  rationale: यह आधुनिक हिन्दी में कालक्रम को स्वाभाविक रूप से व्यक्त करता है; अधिक शब्दानुरूप विकल्प ‘छह दिनों के बाद’ पादटिप्पणी में दिया गया है।
- source_word: παραλαμβάνει
  choice: अपने साथ ले गए
  rationale: क्रिया का आशय चुने हुए शिष्यों को साथ लेना है। यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली के स्वाभाविक भूतकाल में व्यक्त किया गया है।
- source_word: ἀναφέρει αὐτοὺς εἰς ὄρος ὑψηλὸν
  choice: एक ऊँचे पहाड़ पर ले गए
  rationale: ἀναφέρει में ऊपर की ओर ले जाने का भाव और εἰς में गंतव्य का भाव है; हिन्दी में ‘ऊँचे पहाड़ पर ले गए’ दोनों को सहज रूप में संप्रेषित करता है।
- source_word: κατ’ ἰδίαν μόνους
  choice: केवल उन्हें अलग से
  rationale: 'दोनों यूनानी अभिव्यक्तियों का संयुक्त बल सुरक्षित रखा गया है: यीशु इन तीनों को ही दूसरों से अलग ले गए।'
- source_word: μετεμορφώθη
  choice: उनका रूप बदल गया
  rationale: यह μετεμορφώθη के दृश्य परिवर्तन के अर्थ को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है, बिना परिवर्तन की प्रकृति की ऐसी व्याख्या जोड़े जिसे पद स्वयं स्पष्ट नहीं करता।
- source_word: ἔμπροσθεν αὐτῶν
  choice: उनके सामने
  rationale: यह शिष्यों की प्रत्यक्ष उपस्थिति और दृष्टि में घटना घटने का सीधा हिन्दी रूप है।
theological_decisions:
- issue: मसीही प्रसंग में μετεμορφώθη का अनुवाद
  choice: उनका रूप बदल गया
  alternative: उनका रूपान्तरण हुआ
  rationale: ‘रूप बदल गया’ मूल क्रिया के दृश्य परिवर्तन को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है। ‘रूपान्तरण हुआ’ पारंपरिक और संभव है, पर अपेक्षाकृत तकनीकी तथा संस्कृतनिष्ठ है। चुना हुआ पाठ घटना की महत्ता को घटाए बिना उसकी प्रक्रिया के विषय में अतिरिक्त धर्मवैज्ञानिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। यूनानी ऐतिहासिक वर्तमान को हिन्दी में स्वाभाविक कथात्मक भूतकाल से व्यक्त किया गया है।
