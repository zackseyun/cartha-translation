  text: καὶ ἀποκριθεὶς ὁ Πέτρος λέγει τῷ Ἰησοῦ· Ῥαββί, καλόν ἐστιν ἡμᾶς ὧδε εἶναι, καὶ ποιήσωμεν ⸂τρεῖς σκηνάς⸃, σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/005.yaml
  text: 'And Peter answered and said to Jesus[a], “Rabbi, it is good for us to be here, and let us make three shelters: one for you, one for Moses, and one for Elijah.”'
translation:
  language: hi
  text: पतरस ने उत्तर देते हुए यीशु से कहा, “रब्बी, हमारा यहाँ होना अच्छा है। आओ, हम तीन तम्बू[a] बनाएँ—एक आपके लिए, एक मूसा के लिए और एक एलिय्याह के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झोंपड़ियाँ” अथवा “मंडप।” यूनानी शब्द अस्थायी आश्रयों के लिए प्रयुक्त होता है; यहाँ किसी विशेष पर्व या पवित्र निवास का संकेत स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... λέγει
  choice: ने ... कहा
  rationale: यह यूनानी कथात्मक मुहावरा है। कोई स्पष्ट प्रश्न न होने के कारण हिन्दी में केवल ‘कहा’ स्वाभाविक है; ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता। ऐतिहासिक वर्तमान λέγει को हिन्दी कथन-शैली के अनुसार भूतकाल में रखा गया है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: सम्बोधन का सेमिटिक रूप बनाए रखता है और ‘शिक्षक’ की अपेक्षा मूल सांस्कृतिक परिवेश को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: καλόν ἐστιν ἡμᾶς ὧδε εἶναι
  choice: हमारा यहाँ रहना अच्छा है
  rationale: मूल के मूल्यांकन और infinitival construction को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना ‘अद्भुत’ या ‘उचित’ जैसी व्याख्यात्मक तीव्रता जोड़े।
- source_word: ποιήσωμεν
  choice: आओ, हम ... बनाएँ
  rationale: प्रथम पुरुष बहुवचन exhortative subjunctive का स्वाभाविक हिन्दी आग्रह; ‘बनाएँ’ मूल ποιέω के सामान्य अर्थ को ‘निर्माण करें’ से अधिक सहजता से रखता है।
- source_word: σκηνάς
  choice: मंडप
  rationale: अस्थायी ढाँचे का अर्थ देता है और हिन्दी बाइबलीय परिचय में समझने योग्य है। सम्भव अर्थ ‘झोंपड़ियाँ’ और ‘तम्बू’ पादटिप्पणी में दिए गए हैं, क्योंकि मूल शब्द अपने आप किसी विशेष पर्व या पवित्रस्थान-संबंधी अर्थ को निश्चित नहीं करता।
- source_word: σοὶ μίαν καὶ Μωϋσεῖ μίαν καὶ Ἠλίᾳ μίαν
  choice: एक आपके लिए, एक मूसा के लिए और एक एलिय्याह के लिए
  rationale: μίαν की तीन बार की गई वितरणात्मक पुनरावृत्ति और मूल की समानांतर रचना सुरक्षित रखी गई है।
theological_decisions:
- issue: σκηνάς के सम्भावित पर्व-संबंधी या पवित्रस्थान-संबंधी संकेत
  choice: मुख्य पाठ में तटस्थ ‘मंडप’
  alternative: ‘झोंपड़ियाँ’, ‘तम्बू’ अथवा अधिक तकनीकी ‘निवास-तम्बू’
  rationale: पद स्वयं इन संरचनाओं को झोंपड़ियों के पर्व या पवित्र निवास की धर्मवैज्ञानिक छवि से स्पष्ट रूप से नहीं जोड़ता। इसलिए मुख्य पाठ सम्भावित संकेत को सिद्ध अर्थ नहीं बनाता, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सहज मानक हिन्दी। यीशु के लिए आदरसूचक ‘आपके’ रखा गया है। ‘तब’ कथानक में प्रतिक्रिया का संबंध दिखाता है, जबकि अस्वाभाविक ‘उत्तर देकर’ से बचा गया है। पादटिप्पणी-चिह्न [a] संबंधित शब्द के तुरंत बाद रखा गया है।
