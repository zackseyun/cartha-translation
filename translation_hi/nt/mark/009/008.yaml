base_translation:
  language: en
  yaml_path: translation/nt/mark/009/008.yaml
  text: And suddenly, looking around, they no longer saw anyone except Jesus alone with them.
translation:
  language: hi
  text: और अचानक, चारों ओर देखने पर, उन्हें अपने साथ केवल यीशु ही दिखाई दिए; अब और कोई नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάπινα
  choice: अचानक
  rationale: यह क्रिया-विशेषण घटना के सहसा घटने को व्यक्त करता है; आधुनिक हिन्दी में ‘अचानक’ स्वाभाविक और सटीक है।
- source_word: περιβλεψάμενοι
  choice: उन्होंने चारों ओर देखा
  rationale: मध्यवाच्य कृदन्त का आशय आसपास सब ओर दृष्टि डालना है; हिन्दी में कर्ता को स्पष्ट करके यह वाक्य सहज बनता है।
- source_word: οὐκέτι οὐδένα εἶδον
  choice: किसी को नहीं देखा
  rationale: οὐκέτι का ‘अब और नहीं’ वाला भाव प्रसंग और परिणामसूचक ‘तो’ में पर्याप्त रूप से प्रकट होता है; अनावश्यक भारीपन से बचते हुए किसी अन्य व्यक्ति के न दिखने का आशय सुरक्षित है।
- source_word: ἀλλὰ τὸν Ἰησοῦν μόνον
  choice: केवल यीशु को छोड़कर
  rationale: ἀλλά यहाँ अपवादसूचक है और μόνον यीशु के अकेले रह जाने पर बल देता है; ‘केवल…को छोड़कर’ दोनों पहलुओं को स्वाभाविक हिन्दी में रखता है।
- source_word: μεθ’ ἑαυτῶν
  choice: अपने साथ
  rationale: यह शिष्यों के साथ यीशु की उपस्थिति बताता है; ‘अपने साथ’ संक्षिप्त और स्पष्ट है।
