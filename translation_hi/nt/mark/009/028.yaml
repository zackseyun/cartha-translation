language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸂εἰσελθόντος αὐτοῦ⸃ εἰς οἶκον οἱ μαθηταὶ αὐτοῦ ⸂κατ’ ἰδίαν ἐπηρώτων αὐτόν⸃· Ὅτι ἡμεῖς οὐκ ἠδυνήθημεν ἐκβαλεῖν αὐτό;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/028.yaml
  text: And when he had entered the house[a], his disciples were asking him privately, “Why were we not able to cast it out?”
translation:
  language: hi
  text: जब वह घर में आ गया, तो उसके शिष्य एकांत में उससे पूछने लगे, “हम उसे[a] क्यों नहीं निकाल सके?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ नपुंसकलिंग सर्वनाम है, जो अधिक स्वाभाविक रूप से अशुद्ध आत्मा की ओर संकेत करता है; पर इसे लड़के के लिए भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εἰσελθόντος αὐτοῦ
  choice: जब वह ... आ गया
  rationale: जनन-संबंधी स्वतंत्र वाक्यांश में एओरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई पृष्ठभूमि की घटना बताता है; यह रूप हिन्दी में स्वाभाविक है।
- source_word: εἰς οἶκον
  choice: घर में
  rationale: यूनानी में संज्ञा अनिर्दिष्ट होते हुए भी कथात्मक संदर्भ किसी परिचित घर की ओर संकेत करता है; हिन्दी में ‘घर में’ स्वाभाविक है और अनावश्यक रूप से ‘एक घर’ नहीं जोड़ता।
- source_word: μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: ‘शिष्य’ सुसमाचारों के शिक्षार्थी-अनुयायी संबंध को सटीक और प्रचलित ढंग से व्यक्त करता है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: यह दूसरों से अलग निजी परिस्थिति को दर्शाता है; ‘एकांत में’ आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: ἐπηρώτων
  choice: पूछने लगे
  rationale: अपूर्णकालीन क्रिया की प्रगतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना बार-बार पूछने का भाव आवश्यकता से अधिक उभारने के।
- source_word: Ὅτι
  choice: क्यों
  rationale: इस प्रश्नवाचक प्रयोग में ὅτι कारण पूछता है; ‘क्यों’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἠδυνήθημεν
  choice: नहीं ... सके
  rationale: δύναμαι की सामर्थ्य संबंधी धारणा को हिन्दी की स्वाभाविक क्षमता-सूचक क्रिया ‘सकना’ से व्यक्त किया गया है।
- source_word: ἐκβαλεῖν
  choice: निकाल
  rationale: प्रसंग में इसका अर्थ अशुद्ध आत्मा को किसी व्यक्ति से बाहर निकालना है; ‘निकालना’ सामान्य पाठक के लिए स्पष्ट है और भूत-प्रेत संबंधी धार्मिक मुहावरे को अनावश्यक रूप से भारी नहीं बनाता।
- source_word: αὐτό
  choice: उसे
  rationale: यूनानी सर्वनाम नपुंसकलिंग एकवचन है और अधिक स्वाभाविक रूप से अशुद्ध आत्मा की ओर संकेत करता है। हिन्दी में आत्मा व्याकरणतः स्त्रीलिंग है, इसलिए मुख्य पाठ का ‘उसे’ संदर्भ को खुला रखते हुए स्वाभाविक रहता है; पादटिप्पणी संभावित संदर्भ स्पष्ट करती है।
theological_decisions:
- issue: अंतिम सर्वनाम αὐτό का संदर्भ
  choice: मुख्य पाठ में ‘उसे’, जिसे संदर्भतः अशुद्ध आत्मा समझना अधिक स्वाभाविक है।
  alternative: इसे पीड़ित लड़के के लिए भी समझा जा सकता है।
  rationale: यूनानी नपुंसकलिंग सर्वनाम लड़के के पुल्लिंग रूप की अपेक्षा अशुद्ध आत्मा/दुष्टात्मा की ओर अधिक स्वाभाविक संकेत करता है। फिर भी हिन्दी ‘उसे’ दोनों के लिए प्रयुक्त हो सकता है, इसलिए वास्तविक संदर्भगत अस्पष्टता को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘पूछने लगे’ अपूर्णकाल का स्वाभाविक संकेत देता है। ‘उसे’ हिन्दी की स्वाभाविकता बनाए रखते हुए यूनानी सर्वनाम के संदर्भ की संभावित अस्पष्टता को पादटिप्पणी में सुरक्षित रखता है।
