id: MRK.9.21
reference: Mark 9:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησεν τὸν πατέρα αὐτοῦ· Πόσος χρόνος ἐστὶν ὡς τοῦτο γέγονεν αὐτῷ; ὁ δὲ εἶπεν· ⸀Ἐκ παιδιόθεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/021.yaml
  text: And he asked his father[a], “How long has this been happening to him?” And he said, “From childhood.”
translation:
  language: hi
  text: और उसने उसके पिता से पूछा, “उसे यह कितने समय से हो रहा है?” उसने कहा, “बचपन से।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह छोटा बच्चा था, तभी से।”
    reason: मूल अभिव्यक्ति को हिन्दी में अधिक विस्तृत रूप से भी कहा जा सकता है।
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: यहाँ क्रिया सामान्य प्रश्न पूछने को व्यक्त करती है; ‘पूछा’ सहज और सटीक आधुनिक हिन्दी है।
- source_word: τὸν πατέρα αὐτοῦ
  choice: उसके पिता से
  rationale: αὐτοῦ प्रसंग में पीड़ित लड़के की ओर संकेत करता है। यह अनुवाद मूल के सर्वनाम को बनाए रखता है और अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ता।
- source_word: Πόσος χρόνος ἐστὶν ὡς
  choice: कितने समय से
  rationale: यूनानी पदबंध वर्तमान तक चली आ रही अवधि पूछता है; ‘कितने समय से’ स्वाभाविक हिन्दी में यही अर्थ देता है।
- source_word: τοῦτο γέγονεν αὐτῷ
  choice: उसे यह ... हो रहा है
  rationale: γέγονεν का पूर्णकालिक रूप ऐसी दशा की ओर संकेत करता है जो आरम्भ होकर अब तक बनी हुई है; ‘हो रहा है’ उस निरंतरता को स्पष्ट करता है।
- source_word: ὁ δὲ εἶπεν
  choice: उसने कहा
  rationale: δέ यहाँ सामान्य कथात्मक क्रम को आगे बढ़ाता है; हिन्दी में अलग संयोजक जोड़े बिना वाक्य स्वाभाविक रहता है।
- source_word: Ἐκ παιδιόθεν
  choice: बचपन से
  rationale: ἐκ और παιδιόθεν मिलकर आरम्भ-बिंदु के रूप में बचपन को व्यक्त करते हैं; ‘बचपन से’ संक्षिप्त, स्वाभाविक और अर्थसंगत है।
theological_decisions: []
