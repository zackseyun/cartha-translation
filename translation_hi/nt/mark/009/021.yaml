  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के सर्वनाम बनाए गए हैं, जबकि अवधि और जारी दशा को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
