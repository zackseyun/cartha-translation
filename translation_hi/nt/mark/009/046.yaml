lexical_decisions:
- source_word: σκώληξ
  choice: कीड़ा
  rationale: यह शब्द सड़ते पदार्थ को खाने वाले कीड़े या कृमि का बोध करा सकता है। ‘कीड़ा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है और यशायाह 66:24 के उद्धरण से सीधा संबंध बनाए रखता है।
- source_word: τελευτᾷ
  choice: नहीं मरता
  rationale: τελευτάω का अर्थ अंत होना या मरना है। इस प्रसंग में वर्तमान काल के साथ ‘नहीं मरता’ सरल और सटीक है।
- source_word: σβέννυται
  choice: नहीं बुझती
  rationale: σβέννυμι आग के बुझने या बुझाए जाने को व्यक्त करता है। हिन्दी में ‘आग नहीं बुझती’ स्वाभाविक है और यूनानी कर्मवाच्य रूप का आशय सुरक्षित रखता है।
