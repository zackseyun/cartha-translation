id: MRK.9.18
reference: Mark 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν αὐτὸν καταλάβῃ ῥήσσει αὐτόν, καὶ ἀφρίζει καὶ τρίζει τοὺς ⸀ὀδόντας καὶ ξηραίνεται· καὶ εἶπα τοῖς μαθηταῖς σου ἵνα αὐτὸ ἐκβάλωσιν, καὶ οὐκ ἴσχυσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/018.yaml
  text: And wherever it seizes him[a], it throws him down, and he foams and grinds his teeth and becomes rigid. And I told your disciples to cast it out, but they were not able.
translation:
  language: hi
  text: और जहाँ कहीं भी वह उसे पकड़ता है, उसे पटक देता है; और वह मुँह से झाग निकालता है, दाँत पीसता है और अकड़ जाता है[a]। मैंने आपके शिष्यों से उसे निकालने को कहा, पर वे ऐसा नहीं कर सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, ‘सूख जाता है,’ ‘मुरझा जाता है,’ या ‘क्षीण हो जाता है।’
    reason: ξηραίνεται के अर्थ पर विवाद है। प्रसंग में ‘अकड़ जाता है’ उपयुक्त हो सकता है, पर क्रिया का मूल अर्थ सूखने या मुरझाने से संबंधित है।
lexical_decisions:
- source_word: ὅπου ἐὰν
  choice: जब कभी
  rationale: यह संयोजन अनिश्चित और बार-बार होने वाली परिस्थिति व्यक्त करता है। हिन्दी में ‘जब कभी’ प्रसंगानुकूल और स्वाभाविक है; यहाँ स्थान से अधिक अवसर का भाव प्रमुख है।
- source_word: καταλάβῃ
  choice: पकड़ता है
  rationale: यह शत्रुतापूर्ण ढंग से वश में करने या धर दबोचने का भाव देता है। ‘पकड़ता है’ सरल, सजीव और स्वाभाविक है।
- source_word: ῥήσσει
  choice: पटक देता है
  rationale: प्रसंग में क्रिया उस आत्मा द्वारा लड़के को हिंसापूर्वक गिराने का संकेत देती है। ‘पटक देता है’ शारीरिक हिंसा स्पष्ट करता है और ‘फाड़ता है’ जैसी भ्रामक धारणा से बचाता है।
- source_word: ἀφρίζει
  choice: मुँह से झाग निकालता
  rationale: मूल क्रिया का अर्थ ‘झाग निकालना’ है। हिन्दी में लक्षण को स्वाभाविक और स्पष्ट बनाने के लिए ‘मुँह से’ जोड़ा गया है।
- source_word: τρίζει τοὺς ὀδόντας
  choice: दाँत पीसता
  rationale: यह दाँत रगड़ने या पीसने की शारीरिक क्रिया को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: ξηραίνεται
  choice: अकड़ जाता है
  rationale: मूलतः यह क्रिया ‘सूख जाना’ या ‘मुरझा जाना’ कह सकती है, पर इस लक्षण-क्रम में शरीर के अकड़ जाने का अर्थ संभव है। ठीक अर्थ विवादित होने के कारण विकल्प पादटिप्पणी में देना उचित होता, पर प्रस्तुत अंग्रेज़ी पादटिप्पणी का चिह्न मुख्य पाठ में गलत शब्द के बाद रखा गया है; इसलिए बिना भ्रामक चिह्न के मुख्य अर्थ चुना गया है।
- source_word: ἐκβάλωσιν
  choice: उसे निकालने
  rationale: यहाँ क्रिया दुष्ट आत्मा को बाहर निकालने के लिए प्रयुक्त है। हिन्दी में ‘उसे निकालने’ उसी भूत-निष्कासन संबंधी अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἴσχυσαν
  choice: वे ऐसा नहीं कर सके
  rationale: यह सामर्थ्य या क्षमता के अभाव को व्यक्त करता है, उसके कारण का अतिरिक्त अर्थ लगाए बिना।
theological_decisions:
- issue: ἐκβάλωσιν के साथ αὐτό का संकेत
  choice: ‘उसे’ का संकेत लड़के को पीड़ित करने वाली आत्मा की ओर रखा गया है।
  alternative: इसे अधिक सामान्य रूप से उस पीड़ा या व्याधि की ओर संकेत मानना।
  rationale: निकटवर्ती कथा में एक शत्रुतापूर्ण आत्मा लड़के को पकड़ती है और शिष्य उसे बाहर निकालने का प्रयत्न करते हैं। फिर भी ‘उसे’ मूल सर्वनाम की संक्षिप्तता बनाए रखता है।
- issue: ξηραίνεται का सटीक शारीरिक अर्थ
  choice: ‘अकड़ जाता है’
  alternative: ‘सूख जाता है,’ ‘मुरझा जाता है,’ या ‘क्षीण हो जाता है।’
  rationale: दौरे जैसे लक्षणों के क्रम में अकड़ना प्रसंगानुकूल है, पर यूनानी क्रिया का मूल बिंब ‘सूखने’ का है; इसलिए अर्थ की अनिश्चितता को स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘आपके’ द्वारा सम्मानसूचक रूप रखा गया है। वाक्य को मौखिक वर्णन जैसा स्वाभाविक, पर गरिमापूर्ण रखा गया है।
