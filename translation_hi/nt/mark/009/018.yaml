  verdict: revise
  source_fidelity: The draft accurately conveys the hostile seizure, violent throwing down, foaming, teeth-grinding, attempted expulsion, and the disciples’ inability. However, ὅπου ἐάν is locative and indefinite (“wherever”), not primarily temporal (“whenever”); ‘जब कभी’ therefore loses the explicit spatial element. ξηραίνεται can be rendered contextually as ‘अकड़ जाता है,’ but its disputed, more literal sense must be retained in an anchored footnote.
  naturalness: The Hindi is generally fluent and appropriately dignified. ‘मुँह से झाग निकालता है’ is natural in this symptom description, and ‘पटक देता है’ vividly communicates ῥήσσει. ‘जहाँ कहीं भी’ is both natural and more faithful than ‘जब कभी.’
  terminology: ‘उसे निकालने’ naturally expresses expulsion of the afflicting spirit while preserving the Greek neuter pronoun’s brevity. ‘आपके शिष्यों’ appropriately reflects respectful address to Jesus. The footnote is needed specifically on ‘अकड़ जाता है,’ not omitted because of an unrelated English-anchor problem.
  issues:
  - severity: medium
    issue: ‘जब कभी’ renders ὅπου ἐάν temporally rather than locatively.
    rationale: ὅπου means ‘where,’ and with ἐάν means ‘wherever/wherever it may.’ The translation should preserve the location-indefinite force as ‘जहाँ कहीं भी.’
  - severity: medium
    issue: The lexical ambiguity of ξηραίνεται has no anchored Hindi footnote.
    rationale: ‘अकड़ जाता है’ is a reasonable contextual rendering, but ξηραίνεται more literally denotes drying up, withering, or wasting away. The main text needs a footnote marker immediately after the phrase it qualifies.
