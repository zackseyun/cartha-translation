source:
  edition: SBLGNT
  text: ἀλλὰ λέγω ὑμῖν ὅτι καὶ Ἠλίας ἐλήλυθεν, καὶ ἐποίησαν αὐτῷ ὅσα ⸀ἤθελον, καθὼς γέγραπται ἐπ’ αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/013.yaml
  text: But I tell you that Elijah also has come[a], and they did to him whatever they wanted, just as it is written about him.
translation:
  language: hi
  text: पर मैं तुमसे कहता हूँ कि एलिय्याह भी आ चुका है[a], और उन्होंने उसके साथ जो कुछ चाहा, वही किया—ठीक जैसा उसके विषय में लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् एलिय्याह यूहन्ना बपतिस्मा देनेवाले के व्यक्तित्व और सेवा-कार्य में पहले ही आ चुका था; मरकुस 9:11–12 देखें और मत्ती 11:14; 17:12–13 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλὰ
  choice: पर
  rationale: यह शिष्यों की एलिय्याह-संबंधी अपेक्षा के साथ स्पष्ट विरोध दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन की गंभीरता दोनों को सुरक्षित रखता है।
- source_word: ὅτι καὶ Ἠλίας ἐλήλυθεν
  choice: कि एलिय्याह आ भी चुका है
  rationale: ‘आ चुका है’ पूर्ण काल की संपन्नता और वर्तमान प्रासंगिकता व्यक्त करता है; ‘भी’ καὶ के बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐποίησαν αὐτῷ ὅσα ἤθελον
  choice: उन्होंने उसके साथ जो चाहा, किया
  rationale: मूल के खुले और कठोर अर्थ को बनाए रखते हुए हिन्दी में ‘उसके साथ’ अप्राकृतिक ‘उसे किया’ से अधिक स्पष्ट है।
- source_word: καθὼς γέγραπται
  choice: ठीक जैसा ... लिखा है
  rationale: यह शास्त्रीय लेख का परिचित सूत्र है; ‘ठीक’ καθὼς के अनुरूपता-सूचक बल को व्यक्त करता है।
- source_word: ἐπ’ αὐτόν
  choice: उसके विषय में
  rationale: γράφω के साथ इसका सर्वाधिक संभावित अर्थ ‘उसके बारे में/विषय में’ है; ‘उसके विरुद्ध’ की कम संभावित अस्पष्टता को मुख्य पाठ में नहीं अपनाया गया।
theological_decisions:
- issue: इस कथन में एलिय्याह की पहचान
  choice: मुख्य पाठ में केवल ‘एलिय्याह’ रखा गया है।
  alternative: मुख्य पाठ में एलिय्याह को यूहन्ना बपतिस्मा देनेवाला बताना।
  rationale: मूल पद स्पष्ट रूप से एलिय्याह कहता है। संदर्भ में यूहन्ना से उसका संबंध समझा जाता है, पर उस व्याख्यात्मक पहचान को पद के शब्दों में जोड़ना उचित नहीं; इसे पादटिप्पणी में रखा गया है।
- issue: καὶ का बल
  choice: ‘आ भी चुका है’
  alternative: ‘निश्चय ही आ चुका है’ या केवल ‘आ चुका है’।
  rationale: यह अनुवाद एलिय्याह के भी आ चुकने का अर्थ रखता है, बिना इस कण को अनावश्यक रूप से अत्यधिक बल दिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधी और सामान्य पाठकों के लिए सुबोध शैली। ‘उसके विषय में’ अपेक्षाकृत औपचारिक है, पर शास्त्रीय लेख के संदर्भ में स्वाभाविक और सटीक है।
