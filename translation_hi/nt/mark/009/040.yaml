  yaml_path: translation/nt/mark/009/040.yaml
  text: For whoever is not against us is for us[a].
translation:
  language: hi
  text: क्योंकि जो हमारे विरुद्ध नहीं है, वह हमारे पक्ष में है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह हमारे लिए है।’ यूनानी पदबंध ὑπὲρ ἡμῶν का अर्थ ‘हमारी ओर से’ या ‘हमारे पक्ष में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: जो
  rationale: यह सम्बन्धवाचक सर्वनाम यहाँ सामान्य और अनिश्चित अर्थ में प्रयुक्त है। हिन्दी में ‘जो’ इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस सम्बन्ध को सामान्य आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: οὐκ ἔστιν
  choice: नहीं है
  rationale: नकारात्मक वर्तमानकालीन संयोजक क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: καθ’ ἡμῶν
  choice: हमारे विरुद्ध
  rationale: सम्बन्धकारक के साथ κατά यहाँ विरोध का भाव देता है। ‘हमारे विरुद्ध’ अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारे पक्ष में
  rationale: सम्बन्धकारक के साथ ὑπέρ का अर्थ ‘के लिए’, ‘की ओर से’ या ‘के पक्ष में’ हो सकता है। इस विरोधात्मक कथन में ‘हमारे पक्ष में’ καθ’ ἡμῶν के साथ स्वाभाविक समानान्तरता बनाए रखता है।
- source_word: ἐστιν
  choice: है
  rationale: यह विरोधात्मक वाक्य को पूरा करने वाली सरल संयोजक क्रिया है, इसलिए इसका सीधा अनुवाद किया गया है।
theological_decisions:
- issue: ‘हमारे विरुद्ध’ और ‘हमारे पक्ष में’ द्वारा व्यक्त सहभागिता का दायरा
  choice: पहले पुरुष बहुवचन की सम्बन्धपरक भाषा को ज्यों का त्यों रखा गया है।
  alternative: इसे ‘हमारे काम के विरुद्ध नहीं’ या ‘परमेश्वर के पक्ष में’ कहकर स्पष्ट करना।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘हमारे’ कहता है। अनुवाद में इसे ‘परमेश्वर’, ‘राज्य’ या ‘मिशन’ तक विस्तृत करने से सन्दर्भ की व्याख्या मूल कथन में जोड़ दी जाती; इसलिए उसका दायरा सन्दर्भ पर छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘विरुद्ध’ और ‘पक्ष में’ से मूल यूनानी की तीखी विरोधात्मक समानान्तरता स्वाभाविक हिन्दी में बनी रहती है।
