source:
  edition: SBLGNT
  text: καὶ ἐὰν ὁ ὀφθαλμός σου σκανδαλίζῃ σε, ἔκβαλε αὐτόν· καλόν ⸀σέ ἐστιν μονόφθαλμον εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ ἢ δύο ὀφθαλμοὺς ἔχοντα βληθῆναι εἰς ⸀τὴν ⸀γέενναν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/047.yaml
  text: And if your eye causes you to stumble[a], throw it out. It is better for you to enter the kingdom of God with one eye than, having two eyes, to be thrown into Gehenna,
translation:
  language: hi
  text: और यदि तुम्हारी आँख तुम्हें ठोकर खिलाए, तो उसे निकाल फेंको। तुम्हारे लिए एक आँख से परमेश्वर के राज्य में प्रवेश करना इससे अच्छा है कि दो आँखें होते हुए तुम गेहन्ना[a] में फेंके जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नरक।” यूनानी पाठ में “गेहन्ना” है। यह नाम हिन्नोम की घाटी से जुड़ा है और अंतिम न्याय के लिए प्रयुक्त होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σκανδαλίζῃ
  choice: तुम्हारे ठोकर खाने का कारण बने
  rationale: यह अनुवाद यूनानी क्रिया में निहित ठोकर के रूपक को बनाए रखता है और अर्थ को केवल ‘पाप कराना’ तक सीमित नहीं करता; प्रसंग में नैतिक पतन का भाव स्वाभाविक रूप से स्पष्ट रहता है।
- source_word: ἔκβαλε αὐτόν
  choice: उसे निकाल फेंको
  rationale: ἐκβάλλω का मूल बल बाहर फेंकने या निकाल देने का है। आँख के संदर्भ में ‘निकाल फेंको’ आधुनिक हिन्दी में सजीव और स्वाभाविक है, पर क्रिया में निहित न होने वाली किसी खास प्रक्रिया का अनावश्यक वर्णन नहीं करता।
- source_word: καλόν ... ἢ
  choice: इससे अच्छा है कि
  rationale: καλόν का शाब्दिक अर्थ ‘अच्छा’ है, किंतु ἢ के साथ इस तुलना में हिन्दी का स्वाभाविक तुलनात्मक प्रयोग ‘इससे अच्छा है कि’ है।
- source_word: μονόφθαλμον
  choice: एक आँख के साथ
  rationale: यह ‘एक-आँख वाला’ होने की ठोस छवि को सरल, वर्तमान हिन्दी में सुरक्षित रखता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह वाक्यांश का पारदर्शी और प्रचलित हिन्दी अनुवाद है तथा उसके धर्मवैचारिक महत्व को बनाए रखता है।
- source_word: βληθῆναι
  choice: फेंके जाओ
  rationale: यह βάλλω के कर्मवाच्य अनंत रूप का सीधा अनुवाद है और मूल पाठ के बलपूर्ण चित्र को सुरक्षित रखता है।
- source_word: γέενναν
  choice: गेहन्ना
  rationale: लिप्यंतरण उस विशिष्ट यूनानी पद को सुरक्षित रखता है, जिसकी पृष्ठभूमि हिन्नोम की घाटी और अंतिम न्याय की यहूदी धारणा में है; इसे सामान्यीकृत ‘नरक’ में विलीन नहीं किया गया।
theological_decisions:
- issue: न्याय के प्रसंग में γέεννα का अनुवाद
  choice: गेहन्ना
  alternative: नरक
  rationale: मूल पाठ अधोलोक या दंड के लिए कोई सामान्य शब्द नहीं, बल्कि विशिष्ट γέεννα प्रयोग करता है। ‘गेहन्ना’ ऐतिहासिक और धर्मवैचारिक विशिष्टता को बनाए रखता है, जबकि पाठकों के लिए परिचित विकल्प ‘नरक’ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘ठोकर खाने का कारण बने’ मूल रूपक और उसकी नैतिक गंभीरता दोनों को सुरक्षित रखता है। ‘गेहन्ना’ को मुख्य पाठ में रखकर उसका अर्थ पादटिप्पणी में समझाया गया है।
