    reason: textual_variant
lexical_decisions:
- source_word: Τοῦτο τὸ γένος
  choice: यह जाति
  rationale: γένος किसी वर्ग या प्रकार को दर्शाता है। निकट संदर्भ में अशुद्ध आत्मा अभिप्रेत है, पर यूनानी पाठ यहाँ ‘आत्मा’ शब्द दोहराता नहीं; इसलिए ‘यह जाति’ संक्षिप्तता और संदर्भगत अर्थ दोनों बनाए रखता है।
- source_word: ἐν οὐδενὶ
  choice: किसी और उपाय से
  rationale: ἐν यहाँ साधन का बोध कराता है। निषेध और εἰ μὴ के साथ ‘किसी और उपाय से नहीं…के सिवा’ स्वाभाविक हिन्दी में यह स्पष्ट करता है कि कोई दूसरा साधन प्रभावी नहीं है।
- source_word: δύναται ἐξελθεῖν
  choice: नहीं निकल सकती
  rationale: δύναται और ἐξελθεῖν का मेल बाहर निकलने की असमर्थता व्यक्त करता है। हिन्दी में आत्मा के किसी व्यक्ति से बाहर आने के लिए ‘निकलना’ स्वाभाविक है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: εἰ μὴ एकमात्र अपवाद प्रस्तुत करता है; नकारात्मक वाक्य में ‘के सिवा’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: ἐν προσευχῇ
  choice: प्रार्थना के सिवा
  rationale: ἐν προσευχῇ साधन का अर्थ देता है। पूरे वाक्य की हिन्दी संरचना में ‘प्रार्थना के सिवा किसी और उपाय से’ उसी साधनात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: क्या ‘और उपवास’ को मुख्य पाठ में शामिल किया जाए
  choice: केवल ‘प्रार्थना’
  alternative: ‘प्रार्थना और उपवास’
  rationale: SBLGNT के दिए गए यूनानी पाठ में केवल προσευχῇ (‘प्रार्थना’) है। ‘और उपवास’ कुछ बाद की पांडुलिपियों में मिलता है; इसलिए उसे मुख्य पाठ में न जोड़कर पाठांतर के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जाति’ संदर्भ में आत्माओं के एक प्रकार को सूचित करती है, बिना मूल में अनुपस्थित ‘आत्मा’ शब्द जोड़े।
