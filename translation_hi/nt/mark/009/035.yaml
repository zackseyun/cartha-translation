  text: καὶ καθίσας ἐφώνησεν τοὺς δώδεκα καὶ λέγει αὐτοῖς· Εἴ τις θέλει πρῶτος εἶναι ἔσται πάντων ἔσχατος καὶ πάντων διάκονος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/035.yaml
  text: And sitting down, he called the twelve and says to them, “If anyone wants to be first, he will be last of all and servant of all.”
translation:
  language: hi
  text: और बैठकर उसने बारहों को बुलाया और उनसे कहा, “यदि कोई पहला होना चाहता है, तो वह सबमें अंतिम और सबका सेवक होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθίσας
  choice: बैठ गया
  rationale: शिक्षक के रूप में बैठने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐφώνησεν
  choice: बुलाया
  rationale: यहाँ क्रिया का अर्थ बारहों को अपने पास बुलाना है; ‘पुकारा’ की अपेक्षा ‘बुलाया’ अधिक स्वाभाविक है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथानक की स्वाभाविक भूतकालीन शैली में रखा गया है; घटना के अर्थ में कोई परिवर्तन नहीं होता।
- source_word: πρῶτος
  choice: पहला
  rationale: पद, प्रतिष्ठा या प्रमुखता में प्रथम होने की व्यापक अर्थ-सीमा सुरक्षित रहती है।
- source_word: ἔσχατος
  choice: अंतिम
  rationale: ‘पहला’ के साथ मूल पाठ का स्पष्ट विरोध बनाए रखता है।
- source_word: διάκονος
  choice: सेवक
  rationale: संदर्भ में दूसरों की सेवा करने वाले व्यक्ति का सामान्य अर्थ है; बाद की कलीसियाई पदवी को अनावश्यक रूप से आरोपित नहीं करता।
theological_decisions:
- issue: ἔσται को आदेश या परिणाम के रूप में प्रस्तुत करना
  choice: ‘होगा’—भविष्य/घोषणा के रूप में
  alternative: ‘बने’ या ‘हो जाए’—आदेश के रूप में
  rationale: मूल में भविष्यकालीन ἔσται है। अनुवाद यीशु के कथन की तीक्ष्णता और उसके संभावित नियम/परिणाम की अस्पष्टता को सुरक्षित रखता है, उसे सीधे आज्ञा में नहीं बदलता।
- issue: ‘सबमें अंतिम’ और ‘सबका सेवक’ की सार्वभौमिकता
  choice: दोनों πάντων को स्पष्ट रूप से ‘सबमें’ और ‘सबका’ कहना
  alternative: एक ‘सब’ को निहित छोड़ देना
  rationale: मूल की पुनरुक्ति इस शिक्षा के व्यापक और बलपूर्ण स्वर को रेखांकित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल। वाक्य की शुरुआत में ‘तब’ प्रसंगगत कथानक-संबंध को स्वाभाविक बनाता है। ‘बारहों’ से निश्चित बारह शिष्यों का समूह स्पष्ट है। कोई फुटनोट आवश्यक नहीं।
