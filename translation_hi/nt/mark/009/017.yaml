  text: καὶ ⸂ἀπεκρίθη αὐτῷ εἷς ἐκ τοῦ ὄχλου⸃· Διδάσκαλε, ἤνεγκα τὸν υἱόν μου πρὸς σέ, ἔχοντα πνεῦμα ἄλαλον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/017.yaml
  text: And one from the crowd answered him[a], “Teacher, I brought my son to you, having a mute spirit.”
translation:
  language: hi
  text: और भीड़ में से एक ने उसे उत्तर दिया, “गुरुजी, मैं अपने बेटे को आपके पास लाया हूँ; उसमें एक गूँगी आत्मा[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसी आत्मा जो उसे बोलने नहीं देती।”
    reason: ἄλαλον का सीधा अर्थ ‘गूँगी’ है, पर प्रसंग में यह आत्मा के कारण पुत्र के बोल न पाने को भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: यह सामान्य कथात्मक क्रिया का निकट और गरिमापूर्ण हिन्दी रूप है; यूनानी पाठ के ‘उत्तर देने’ के भाव को बनाए रखता है।
- source_word: εἷς ἐκ τοῦ ὄχλου
  choice: भीड़ में से एक व्यक्ति
  rationale: यह अंशवाचक रचना और अनिश्चित एकवचन को स्वाभाविक हिन्दी में व्यक्त करता है। ‘व्यक्ति’ स्पष्टता देता है, बिना उसकी पहचान के बारे में अतिरिक्त बात जोड़े।
- source_word: Διδάσκαλε
  choice: गुरुजी
  rationale: आधुनिक हिन्दी में किसी शिक्षक को आदर से संबोधित करने का स्वाभाविक रूप; यह ‘स्वामी’ जैसे अधिक अधिकारसूचक अर्थ को नहीं जोड़ता।
- source_word: ἤνεγκα
  choice: लाया हूँ
  rationale: यूनानी एओरिस्ट एक घटित कार्य बताता है; वर्तमान परिस्थिति में पुत्र को यीशु के पास लाने का परिणाम बना हुआ है, इसलिए हिन्दी का पूर्ण वर्तमान स्वाभाविक है।
- source_word: υἱόν
  choice: बेटे
  rationale: यह पारिवारिक संबंध को सीधे व्यक्त करता है; ‘बालक’ आयु पर अनावश्यक बल देता।
- source_word: πρὸς σέ
  choice: आपके पास
  rationale: लाने की क्रिया के साथ πρός का स्वाभाविक हिन्दी रूप।
- source_word: ἔχοντα
  choice: उसमें … है
  rationale: कृदंत व्याकरणतः ‘बेटे’ को विशेषित करता है। हिन्दी में अलग उपवाक्य उस संबंध को स्पष्ट और सहज बनाता है।
- source_word: πνεῦμα ἄλαλον
  choice: एक गूँगी आत्मा
  rationale: यह यूनानी पद का सीधा रूप है और मुख्य पाठ में यह तय नहीं करता कि आत्मा स्वयं बोल नहीं सकती या पुत्र को बोलने नहीं देती।
theological_decisions:
- issue: झाड़-फूँक के इस प्रसंग में πνεῦμα का आशय
  choice: आत्मा; प्रसंग से दुष्ट या अशुद्ध आत्मा का संकेत
  alternative: मुख्य पाठ में ‘दुष्टात्मा’ या ‘दुष्ट आत्मा’ जोड़ना
  rationale: इस पद का यूनानी पाठ केवल ‘आत्मा’ कहता है। प्रसंग उसके हानिकारक और दुष्ट स्वरूप का संकेत देता है, पर मुख्य पाठ में ‘दुष्ट’ जोड़ना मूल से अधिक स्पष्ट निर्धारण होता।
- issue: ἄλαλον आत्मा की दशा बताता है या पुत्र पर उसका प्रभाव
  choice: मुख्य पाठ में ‘गूँगी आत्मा’ रखकर शाब्दिक अस्पष्टता बनाए रखना
  alternative: ‘ऐसी आत्मा जो उसे बोलने नहीं देती’
  rationale: विशेषण व्याकरणतः आत्मा के साथ है, किंतु प्रसंग में इसका आशय पुत्र को मूक कर देने वाली आत्मा भी हो सकता है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक रखी गई है। ‘गुरुजी’ सामान्य पाठक के लिए संबोधन को स्वाभाविक बनाता है। अर्धविराम पुत्र को लाने और उसकी दशा बताने वाले निकट जुड़े वाक्यांशों को जोड़ता है।
