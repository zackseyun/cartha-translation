  text: But they did not understand the statement[a], and they were afraid to ask him.
translation:
  language: hi
  text: पर वे उस बात[a] को समझ नहीं रहे थे, और उससे पूछने से डरते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस कथन’ अथवा ‘उस वचन’। यूनानी शब्द ῥῆμα किसी बोली हुई बात, कथन या वचन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: पर वे
  rationale: δέ यहाँ यीशु की पिछली भविष्यवाणी और चेलों की प्रतिक्रिया के बीच हल्का विरोध दिखाता है; निहित कर्ता चेलों को स्वाभाविक रूप से ‘वे’ कहा गया है।
- source_word: ἠγνόουν
  choice: समझ नहीं रहे थे
  rationale: ἀγνοέω यहाँ कही गई बात को न समझ पाने का अर्थ देता है। अपूर्ण काल की जारी अवस्था को ‘समझ नहीं रहे थे’ व्यक्त करता है।
- source_word: τὸ ῥῆμα
  choice: उस बात
  rationale: ῥῆμα यीशु द्वारा अभी कही गई बात या कथन को सूचित करता है। आधुनिक हिन्दी में ‘उस बात’ स्वाभाविक है और पिछले कथन की ओर स्पष्ट संकेत करता है; ‘वचन’ संभव है, पर यहाँ अधिक धार्मिक या तकनीकी अर्थ दे सकता है।
- source_word: ἐφοβοῦντο
  choice: डरते थे
  rationale: अपूर्ण काल में φοβέομαι उनकी बनी हुई भयावस्था बताता है; हिन्दी में ‘डरते थे’ इसे सहजता से व्यक्त करता है।
- source_word: αὐτὸν
  choice: उससे
  rationale: सर्वनाम यीशु की ओर संकेत करता है और ‘पूछना’ के साथ हिन्दी में अपादान कारक ‘से’ स्वाभाविक है।
- source_word: ἐπερωτῆσαι
  choice: पूछने
  rationale: ἐπερωτάω का यहाँ सामान्य अर्थ प्रश्न करना या पूछना है; ‘उससे पूछने से डरते थे’ सहज और सटीक हिन्दी है।
