  text: ⸀εὐθὺς κράξας ὁ πατὴρ τοῦ ⸀παιδίου ἔλεγεν· ⸀Πιστεύω· βοήθει μου τῇ ἀπιστίᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/024.yaml
  text: Immediately the father of the child cried out and said[a], “I believe[b]; help my unbelief!”
translation:
  language: hi
  text: तुरंत उस बालक का पिता पुकार उठा और बोला, “मैं विश्वास करता हूँ; मेरे अविश्वास को दूर करने में मेरी सहायता कर!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे विश्वास की कमी को दूर करने में मेरी सहायता कर!” यूनानी शब्द ἀπιστία का अर्थ “अविश्वास” या “विश्वास की कमी” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθύς
  choice: तुरन्त
  rationale: यह पिता की तत्काल प्रतिक्रिया और मरकुस के वर्णन की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κράξας
  choice: पुकार उठा
  rationale: यह कृदन्त ऊँची, भावपूर्ण और अत्यावश्यक पुकार सूचित करता है; ‘पुकार उठा’ उसकी तीव्रता को बिना अनावश्यक अतिशयोक्ति के व्यक्त करता है।
- source_word: ὁ πατὴρ τοῦ παιδίου
  choice: उस बालक का पिता
  rationale: सन्दर्भ में παιδίον पुत्र के लिए प्रयुक्त है, इसलिए ‘बालक’ स्वाभाविक और सन्दर्भानुकूल है; सम्बन्धवाचक रचना भी स्पष्ट बनी रहती है।
- source_word: ἔλεγεν
  choice: बोला
  rationale: यद्यपि यूनानी अपूर्णकाल चलती हुई वाणी का संकेत दे सकता है, प्रत्यक्ष कथन आरम्भ कराने के लिए हिन्दी में ‘बोला’ स्वाभाविक है।
- source_word: Πιστεύω
  choice: मैं विश्वास करता हूँ
  rationale: यह πιστεύω का सीधा अनुवाद है और विश्वास तथा अविश्वास के बीच मूल पाठ की जानबूझकर रखी गई विडम्बनापूर्ण तनातनी को बनाए रखता है।
- source_word: βοήθει
  choice: सहायता कर
  rationale: वर्तमान आज्ञार्थक यहाँ सहायता के लिए सीधी और अत्यावश्यक विनती है।
- source_word: μου τῇ ἀπιστίᾳ
  choice: मेरे अविश्वास में मेरी सहायता कर
  rationale: सम्प्रदान कारक τῇ ἀπιστίᾳ को केवल प्रत्यक्ष कर्म बना देने के बजाय ‘में’ द्वारा उस क्षेत्र या दशा को व्यक्त किया गया है जिसमें पिता सहायता माँगता है; ‘अविश्वास’ मूल विरोधाभास को सुरक्षित रखता है।
theological_decisions:
- issue: Πιστεύω और ἀπιστίᾳ के बीच तनाव
  choice: “मैं विश्वास करता हूँ; मेरे अविश्वास में मेरी सहायता कर!”
  alternative: “मैं विश्वास करता हूँ; मेरे विश्वास की कमी में मेरी सहायता कर!”
  rationale: मुख्य पाठ विश्वास और अविश्वास को साथ रखकर मूल की धार्मिक और मानवीय तनातनी को बिना सुलझाए सुरक्षित रखता है।
- issue: μου τῇ ἀπιστίᾳ में सहायता के निवेदन का व्याकरणिक सम्बन्ध
  choice: अविश्वास को वह दशा/क्षेत्र माना गया है जिसमें सहायता माँगी गई है
  alternative: “मेरे अविश्वास को दूर करने में सहायता कर”
  rationale: वैकल्पिक रूप अर्थ को स्पष्ट करता, पर ‘दूर करने’ का विचार मूल में स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, भावपूर्ण और गरिमापूर्ण शैली। ‘पुकार उठा’ तात्कालिक भावावेग रखता है, और मुख्य वाक्य में विश्वास-अविश्वास का मूल विरोधाभास जानबूझकर अक्षुण्ण रखा गया है।
