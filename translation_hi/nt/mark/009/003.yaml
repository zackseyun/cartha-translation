  yaml_path: translation/nt/mark/009/003.yaml
  text: And his clothes became gleaming[a], very white, such as no launderer on earth is able to whiten.
translation:
  language: hi
  text: और उसके कपड़े चमकीले और बहुत ही उजले हो गए—इतने उजले कि पृथ्वी पर कोई धोबी[a] उन्हें वैसा उजला नहीं कर सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात कपड़े साफ़ करने और उजला करने वाला कारीगर।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἱμάτια
  choice: कपड़े
  rationale: यह वस्त्रों के लिए सामान्य शब्द है; ‘कपड़े’ आधुनिक हिन्दी में स्वाभाविक है और ‘चोगे’ जैसा अनावश्यक रूप से विशिष्ट अर्थ नहीं जोड़ता।
- source_word: ἐγένετο
  choice: हो गए / लगे
  rationale: यह रूपान्तरण के समय अवस्था में आए परिवर्तन को व्यक्त करता है; हिन्दी में संयुक्त वाक्य के दोनों वर्णनों के साथ ‘चमकने लगे’ और ‘उजले हो गए’ इस परिवर्तन को स्वाभाविक ढंग से बताते हैं।
- source_word: στίλβοντα
  choice: चमकने लगे
  rationale: यह तेज़, झिलमिलाती चमक का दृश्य बोध कराता है, पर ‘महिमा से दीप्त’ जैसी व्याख्यात्मक धर्मवैज्ञानिक भाषा नहीं जोड़ता।
- source_word: λευκὰ
  choice: उजले
  rationale: सन्दर्भ में यह सफ़ेदी का वर्णन करता है। कपड़ों के लिए ‘उजले’ स्वाभाविक हिन्दी है और आगे आने वाली उजला करने की क्रिया से अर्थगत संबंध भी बनाए रखता है।
- source_word: λίαν
  choice: बहुत ही
  rationale: यह तीव्र मात्रा को स्पष्ट, सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἷα
  choice: इतने ... कि
  rationale: यह तुलना को हिन्दी की स्वाभाविक परिणामात्मक-तुलनात्मक रचना में प्रस्तुत करता है।
- source_word: γναφεύς
  choice: धोबी
  rationale: यह कपड़े साफ़ करने और उजला करने वाले व्यक्ति के कार्य को सामान्य पाठक के लिए सीधे और संक्षेप में व्यक्त करता है। प्राचीन पेशे की व्यापकता पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: यह तुलना को सांसारिक मानवीय क्षमता के दायरे में रखता है और यूनानी पदबंध का सीधा अर्थ सुरक्षित रखता है।
- source_word: οὐ δύναται
  choice: नहीं कर सकता
  rationale: यह सामर्थ्य के अभाव को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: οὕτως
  choice: वैसा
  rationale: यह पहले वर्णित असाधारण सफ़ेदी की मात्रा की ओर लौटकर संकेत करता है।
- source_word: λευκᾶναι
  choice: उजला करना
  rationale: यह ‘सफ़ेद/उजला बना देना’ का क्रियात्मक अर्थ सीधे रखता है; ‘उन्हें’ कपड़ों के स्पष्ट सन्दर्भ से हिन्दी में आवश्यक रूप से जोड़ा गया है।
theological_decisions:
- issue: रूपान्तरण के दृश्य प्रभाव का वर्णन
  choice: यीशु के कपड़ों की अलौकिक चमक और असाधारण सफ़ेदी का सजीव वर्णन करना, बिना उसकी धर्मवैज्ञानिक व्याख्या पाठ में जोड़ने के
  alternative: ‘महिमा से दमकने लगे’ जैसी अधिक व्याख्यात्मक भाषा
  rationale: पद स्वयं कपड़ों के दिखाई देने वाले रूप का वर्णन करता है; वह यहाँ स्पष्ट रूप से ‘महिमा’ शब्द या कोई सिद्धान्तगत व्याख्या नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘बहुत ही’ λίαν की तीव्रता को सहज रूप से व्यक्त करता है, और ‘इतने उजले कि ... वैसा उजला नहीं कर सकता’ मूल की तुलना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
