  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂Καὶ καταβαινόντων⸃ αὐτῶν ⸀ἐκ τοῦ ὄρους διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸂ἃ εἶδον διηγήσωνται⸃, εἰ μὴ ὅταν ὁ υἱὸς τοῦ ἀνθρώπου ἐκ νεκρῶν ἀναστῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/009.yaml
  text: And as they were coming down from the mountain[a], he ordered them to tell no one what they had seen[b], except when the Son of Man had risen from among the dead.
translation:
  language: hi
  text: जब वे पहाड़ से नीचे उतर रहे थे, तब उसने उन्हें आज्ञा दी कि वे जो कुछ उन्होंने देखा था, उसके विषय में किसी को न बताएँ, जब तक मनुष्य का पुत्र मरे हुओं में से[a] जी न उठे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में: “मरे हुए लोगों के बीच में से।”'
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में यहाँ अपवादसूचक संरचना है, जिसका इस संदर्भ में स्वाभाविक अर्थ है: “जब तक मनुष्य का पुत्र मरे हुओं में से जी न उठे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: καταβαινόντων
  choice: नीचे उतर रहे थे
  rationale: वर्तमान कृदंत समकालीन और जारी क्रिया को व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से उसी अर्थ को बनाए रखता है।
- source_word: ὄρους
  choice: पहाड़
  rationale: ὄρος सामान्यतः पहाड़ को दर्शाता है और रूपान्तरण के प्रसंग के अनुकूल है।
- source_word: διεστείλατο
  choice: आदेश दिया
  rationale: यह क्रिया स्पष्ट निर्देश या आज्ञा देने का भाव रखती है; ‘आदेश दिया’ आधुनिक हिन्दी में उसके बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἵνα μηδενὶ
  choice: कि ... किसी को न बताएँ
  rationale: यह आज्ञा की विषयवस्तु और μηδενί के निषेध, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ἃ εἶδον
  choice: जो कुछ उन्होंने देखा था
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक पद का स्वाभाविक सामूहिक अनुवाद ‘जो कुछ’ है; ‘देखा था’ आदेश से पहले पूर्ण हुई घटना को स्पष्ट करता है।
- source_word: διηγήσωνται
  choice: बताएँ
  rationale: क्रिया का अर्थ किसी बात का वर्णन या वृत्तान्त सुनाना है; इस प्रसंग में ‘बताएँ’ संक्षिप्त और स्वाभाविक है।
- source_word: εἰ μὴ ὅταν
  choice: सिवाय उस समय के, जब
  rationale: यह यूनानी रचना के शाब्दिक अपवादसूचक रूप को बनाए रखती है, यद्यपि प्रसंग में इसका व्यावहारिक अर्थ ‘जब तक ... न’ के निकट है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्व-पदवी का पारंपरिक और अर्थपूर्ण अनुवाद है तथा उसके शास्त्रीय संकेतों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἐκ νεκρῶν
  choice: मरे हुओं में से
  rationale: यह केवल मृत्यु की अवस्था से नहीं, बल्कि मृत लोगों के बीच से उठने की यूनानी अभिव्यक्ति को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἀναστῇ
  choice: जी उठे
  rationale: ὅταν के बाद आया अओरिस्ट सब्जंक्टिव भविष्य में घटने वाली घटना को दर्शाता है; ‘जी उठे’ हिन्दी में इस भाव को स्वाभाविक और पारंपरिक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ पदवी के रूप और सम्भावित दानिय्येली संकेत को सुरक्षित रखता है, जबकि इसे केवल सामान्य मानव-संज्ञा में नहीं बदलता।
- issue: εἰ μὴ ὅταν का कालगत बल
  choice: सिवाय उस समय के, जब मनुष्य का पुत्र ... जी उठे
  alternative: जब तक मनुष्य का पुत्र ... न जी उठे
  rationale: चुना हुआ रूप यूनानी के अपवादसूचक गठन को बनाए रखता है; वैकल्पिक रूप उसके प्रसंगगत कालगत अर्थ को अधिक मुहावरेदार हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सिवाय उस समय के, जब’ स्रोत की वास्तविक संरचना को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक मुहावरेदार हिन्दी विकल्प देती है।
