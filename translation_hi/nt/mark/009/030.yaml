  text: Κἀκεῖθεν ἐξελθόντες ⸀παρεπορεύοντο διὰ τῆς Γαλιλαίας, καὶ οὐκ ἤθελεν ἵνα τις γνοῖ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/030.yaml
  text: And from there[a] they went on through Galilee[b], and he did not want anyone to know.
translation:
  language: hi
  text: और वहाँ से निकलकर वे गलील से होकर जा रहे थे, और वह नहीं चाहता था कि किसी को पता चले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντες
  choice: और वहाँ से निकलकर
  rationale: यह अनुवाद καί की कथात्मक निरंतरता, ἐκεῖθεν के स्थानगत अर्थ और ἐξελθόντες में निहित पिछले स्थान से प्रस्थान—तीनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παρεπορεύοντο
  choice: जा रहे थे
  rationale: अपूर्ण भूतकाल यात्रा की जारी प्रक्रिया दिखाता है; διά के साथ मिलकर ‘में से होकर जा रहे थे’ क्षेत्र से होकर गुजरने का अर्थ देता है।
- source_word: διὰ τῆς Γαλιλαίας
  choice: गलील में से होकर
  rationale: संबंधकारक के साथ διά किसी क्षेत्र के भीतर से होकर जाने को दर्शाता है।
- source_word: οὐκ ἤθελεν
  choice: वह नहीं चाहता था
  rationale: θέλω यहाँ इच्छा को व्यक्त करता है; एकवचन कर्ता संदर्भ में यीशु है, पर मूल की तरह नाम दोहराए बिना सर्वनाम रखा गया है।
- source_word: ἵνα τις γνοῖ
  choice: कि किसी को पता चले
  rationale: ἵνα और संभावनार्थक क्रिया इच्छित रोक को व्यक्त करते हैं। γινώσκω का कर्म मूल यूनानी में अनकहा है, इसलिए हिन्दी में भी यह नहीं जोड़ा गया कि किस बात का पता चले।
theological_decisions:
- issue: ἤθελεν का निहित कर्ता
  choice: ‘वह’—संदर्भानुसार यीशु
  alternative: अव्यक्त या सामूहिक कर्ता
  rationale: एकवचन क्रिया का स्वाभाविक संदर्भ यीशु है; हिन्दी वाक्य की स्पष्टता के लिए सर्वनाम आवश्यक है।
- issue: γνοῖ का अनकहा कर्म
  choice: जिस बात का पता न चले, उसे अनकहा रखा गया
  alternative: ‘कि वह वहाँ है’ या ‘उनके मार्ग का’ स्पष्ट रूप से जोड़ना
  rationale: मूल पाठ जानने की बात का कर्म नहीं बताता। संभवतः आशय यीशु की उपस्थिति या यात्रा से है, पर उसे मुख्य पाठ में जोड़ना वास्तविक अस्पष्टता को मिटा देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘गलील में से होकर जा रहे थे’ चलती हुई यात्रा और क्षेत्र के भीतर से गुजरने—दोनों को स्पष्ट करता है। मूल पाठ में γνοῖ का कर्म न होने के कारण ‘पता चले’ को जानबूझकर अकर्मक रखा गया है।
