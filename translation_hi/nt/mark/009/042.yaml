source:
  edition: SBLGNT
  text: Καὶ ὃς ⸀ἂν σκανδαλίσῃ ἕνα τῶν μικρῶν ⸀τούτων τῶν πιστευόντων ⸂εἰς ἐμέ⸃, καλόν ἐστιν αὐτῷ μᾶλλον εἰ περίκειται ⸂μύλος ὀνικὸς⸃ περὶ τὸν τράχηλον αὐτοῦ καὶ βέβληται εἰς τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/042.yaml
  text: And whoever causes one of these little ones who believe in me to stumble[a], it is better for him if a donkey millstone is put around his neck and he is thrown into the sea.
translation:
  language: hi
  text: और जो कोई मुझ पर विश्वास करनेवाले इन छोटों में से किसी एक के ठोकर खाने का कारण बनता है, उसके लिए बेहतर होता कि गधे से चलाए जाने वाला चक्की का पाट[a] उसके गले में डाल दिया जाता और उसे समुद्र में फेंक दिया जाता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् एक बड़ा चक्की का पाट, जिसे गधा चलाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκανδαλίσῃ
  choice: ठोकर खिलाता है
  rationale: यह प्रयोग ठोकर, पाप या पतन का कारण बनने की यूनानी रूपकात्मक व्यापकता बनाए रखता है; केवल ‘पाप करवाता है’ कहना अर्थ को संकरा कर देता।
- source_word: μικρῶν τούτων
  choice: इन छोटों
  rationale: यह अभिव्यक्ति केवल आयु में छोटे बच्चों तक सीमित नहीं है; इसमें छोटे, निर्बल या कम महत्त्व के समझे जानेवाले विश्वासियों की व्यापक सम्भावना बनी रहती है।
- source_word: τῶν πιστευόντων εἰς ἐμέ
  choice: मुझ पर विश्वास करनेवाले
  rationale: व्यक्तिवाचक कर्म के साथ πιστεύω εἰς का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: καλόν ἐστιν αὐτῷ μᾶλλον
  choice: उसके लिए यह अच्छा होता
  rationale: 'यह तुलनात्मक चेतावनी व्यक्त करता है: आगामी परिणाम की अपेक्षा यह भयानक मृत्यु भी उसके लिए अधिक अच्छी होती। ‘अच्छा होता’ हिन्दी में अप्रकट तुलना को स्वाभाविक रूप से वहन करता है।'
- source_word: μύλος ὀνικός
  choice: गधे से चलाए जानेवाले चक्की के पाट
  rationale: यह छोटे हाथ के पाट के विपरीत उस भारी पाट को स्पष्ट करता है जिसे गधा चलाता था।
- source_word: περίκειται ... περὶ τὸν τράχηλον
  choice: उसके गले में बाँध दिया जाता
  rationale: सन्दर्भ में भारी पाट को गले के चारों ओर लगाए जाने का स्वाभाविक हिन्दी वर्णन है।
- source_word: βέβληται εἰς τὴν θάλασσαν
  choice: उसे समुद्र में फेंक दिया जाता
  rationale: यूनानी पूर्णकाल के परिणामी और सजीव भाव को यहाँ स्वाभाविक हिन्दी निष्क्रिय रचना में व्यक्त किया गया है।
theological_decisions:
- issue: ‘इन छोटों’ का सन्दर्भ
  choice: अनुवाद को इतना व्यापक रखा गया है कि इसमें छोटे या निर्बल समझे जानेवाले विश्वासी सम्मिलित हों; इसे केवल बच्चों तक सीमित नहीं किया गया।
  alternative: इसे विशेष रूप से छोटे बच्चे, अथवा सामान्य रूप से नम्र शिष्य समझना।
  rationale: ‘मुझ पर विश्वास करनेवाले’ वाक्यांश केवल आयु के आधार पर अर्थ तय नहीं करता। व्यापक अनुवाद मूल की सम्भावित अर्थ-सीमा और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘इन छोटों’ मूल अभिव्यक्ति की व्यापकता बचाता है, और ‘ठोकर खिलाता है’ यूनानी रूपक को बनाए रखता है।
