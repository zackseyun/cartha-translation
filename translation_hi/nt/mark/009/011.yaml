  text: καὶ ἐπηρώτων αὐτὸν λέγοντες· Ὅτι λέγουσιν οἱ γραμματεῖς ὅτι Ἠλίαν δεῖ ἐλθεῖν πρῶτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/009/011.yaml
  text: And they were asking him[a], saying, “Why do the scribes say that Elijah must come first?”
translation:
  language: hi
  text: और वे उनसे पूछते रहे[a], “शास्त्री क्यों कहते हैं कि एलिय्याह को पहले आना ही होगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह कैसे है कि शास्त्री कहते हैं कि एलिय्याह को पहले आना ही होगा?”
    reason: Ὅτι के प्रश्नवाचक प्रयोग का अधिक शाब्दिक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: ἐπηρώτων
  choice: पूछते रहे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होने वाली पूछताछ का संकेत देता है; ‘पूछते रहे’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λέγοντες
  choice: प्रत्यक्ष प्रश्न में समाहित
  rationale: यूनानी कृदंत प्रश्न की विषयवस्तु प्रस्तुत करता है। हिन्दी में अलग से ‘कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता, इसलिए उसका कार्य सीधे उद्धृत प्रश्न में समाहित किया गया है।
- source_word: Ὅτι
  choice: क्यों
  rationale: इस प्रश्नवाचक प्रसंग में ὅτι का भाव ‘क्यों’ अथवा ‘यह कैसे है कि’ है। मुख्य पाठ में ‘क्यों’ सहज और स्पष्ट है, जबकि वैकल्पिक रूप पादटिप्पणी में रखा गया है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह उस ऐतिहासिक यहूदी वर्ग के लिए प्रचलित और संक्षिप्त हिन्दी पद है जो धर्मशास्त्र की व्याख्या और शिक्षा से जुड़ा था।
- source_word: Ἠλίαν
  choice: एलिय्याह
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: δεῖ
  choice: आना ही होगा
  rationale: δεῖ की आवश्यकता और अनिवार्यता को ‘ही होगा’ स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है, बिना उसके आधार की अतिरिक्त व्याख्या किए।
- source_word: ἐλθεῖν
  choice: आना
  rationale: भविष्यद्वाणी-संबंधी इस प्रसंग में यह सीधा और स्वाभाविक अनुवाद है।
- source_word: πρῶτον
  choice: पहले
  rationale: यह समयगत प्राथमिकता को सीधे व्यक्त करता है।
theological_decisions:
- issue: Ὅτι से आरम्भ हुए प्रश्न का बल
  choice: सीधे ‘क्यों’ वाले प्रश्न के रूप में अनुवाद
  alternative: ‘यह कैसे है कि शास्त्री कहते हैं...?’
  rationale: यह शास्त्रियों की शिक्षा के विषय में प्रश्न है। ‘क्यों’ प्रश्नवाचक बल को स्पष्ट करता है, जबकि अधिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: एलिय्याह के आने का स्वरूप
  choice: ‘एलिय्याह को पहले आना ही होगा’
  alternative: ‘एलिय्याह को फिर से पहले आना होगा’ अथवा ‘मसीह से पहले आना होगा’
  rationale: यूनानी पाठ केवल पहले आने की आवश्यकता बताता है। ‘फिर से’ या ‘मसीह से पहले’ जोड़ना इस पद में स्पष्ट न की गई व्याख्या को पाठ में ले आता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पूछते रहे’ कथात्मक अपूर्ण भूतकाल को दर्शाता है; प्रश्न में अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया है।
