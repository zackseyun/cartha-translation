lexical_decisions:
- source_word: ᾔδει
  choice: नहीं जानता था
  rationale: οἶδα यहाँ ज्ञान या समझ की अवस्था बताता है; अपूर्ण भूतकालीन हिन्दी में ‘नहीं जानता था’ स्वाभाविक और सटीक है।
- source_word: τί ἀποκριθῇ
  choice: क्या उत्तर दे
  rationale: ἀποκρίνομαι का विशिष्ट अर्थ उत्तर देना है; deliberative subjunctive को ‘क्या उत्तर दे’ सहज हिन्दी में बनाए रखता है।
- source_word: ἔκφοβοι
  choice: अत्यन्त भयभीत
  rationale: ἔκφοβος साधारण भय से अधिक तीव्र भय व्यक्त करता है; ‘अत्यन्त भयभीत’ उसका बल स्पष्ट करता है।
- source_word: ἐγένοντο
  choice: हो गए थे
  rationale: γίνομαι यहाँ किसी अवस्था में आने का संकेत देता है; ‘हो गए थे’ केवल स्थिर ‘थे’ की अपेक्षा इस परिवर्तनशील बल को सुरक्षित रखता है।
- source_word: γὰρ ... γὰρ
  choice: क्योंकि ... क्योंकि
  rationale: दोनों γάρ व्याख्यात्मक कारण प्रस्तुत करते हैं; दोनों ‘क्योंकि’ रखकर यूनानी वाक्य की दोहरी कारणात्मक संरचना सुरक्षित की गई है।
theological_decisions:
- issue: बहुवचन खंड का कर्ता
  choice: वे अत्यन्त भयभीत हो गए थे
  alternative: वह अत्यन्त भयभीत हो गया था
  rationale: बहुवचन विशेषण ἔκφοβοι और बहुवचन क्रिया ἐγένοντο बहुवचन कर्ता की माँग करते हैं। प्रसंग में यह पतरस और उसके साथियों की ओर संकेत करता है; एकवचन करना यूनानी व्याकरण के विरुद्ध होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उत्तर दे’ क्रिया के विशिष्ट अर्थ को और ‘हो गए थे’ γίνομαι के अवस्था-परिवर्तन को सुरक्षित रखता है।
