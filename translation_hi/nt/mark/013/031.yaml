  text: ὁ οὐρανὸς καὶ ἡ γῆ ⸀παρελεύσονται, οἱ δὲ λόγοι μου οὐ ⸀μὴ ⸁παρελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/031.yaml
  text: Heaven and earth will pass away[a], but my words will certainly not pass away.
translation:
  language: hi
  text: आकाश और पृथ्वी टल जाएँगे, पर मेरी बातें कभी नहीं टलेंगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ οὐρανὸς
  choice: आकाश
  rationale: पृथ्वी के साथ युग्म में यह समूचे सृष्टिगत आकाश को दर्शाता है, केवल दिखाई देने वाले नभ को नहीं; हिंदी का प्रचलित युग्म ‘आकाश और पृथ्वी’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἡ γῆ
  choice: पृथ्वी
  rationale: ‘आकाश और पृथ्वी’ के स्थिर युग्म में γῆ किसी विशेष भूभाग के बजाय पृथ्वी को सूचित करता है।
- source_word: παρελεύσονται
  choice: टल जाएँगे
  rationale: यहाँ παρέρχομαι का अर्थ बीत जाना अथवा अस्तित्व की वर्तमान दशा से हट जाना है। ‘टल जाना’ हिंदी बाइबलीय प्रयोग में स्वाभाविक है और उसके ढंग को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: δέ आकाश-पृथ्वी की अस्थिरता और यीशु की बातों के स्थायित्व के बीच स्पष्ट विरोध दिखाता है।
- source_word: οἱ λόγοι μου
  choice: मेरी बातें
  rationale: λόγοι यहाँ यीशु के कहे हुए वचनों या कथनों को दर्शाता है। आधुनिक हिंदी में ‘मेरी बातें’ प्रत्यक्ष, सहज और बहुवचन के अनुरूप है।
- source_word: οὐ μὴ παρελεύσονται
  choice: कभी नहीं टलेंगी
  rationale: भविष्यकाल के साथ οὐ μή प्रबल निषेध है। ‘कभी नहीं’ उसका जोर स्वाभाविक आधुनिक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: यीशु की बातों के विषय में प्रबल निषेध का बल
  choice: ‘कभी नहीं टलेंगी’ कहकर निषेध का जोर स्पष्ट रखा गया।
  alternative: ‘कदापि नहीं टलेंगी’ अथवा ‘निश्चय ही नहीं टलेंगी।’
  rationale: यूनानी οὐ μή सृष्टिगत व्यवस्था के टल जाने और यीशु की बातों के स्थायी अधिकार के बीच तीखा विरोध व्यक्त करता है। ‘कभी नहीं’ इस बल को आधुनिक और सामान्य हिंदी में बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण है। ‘आकाश और पृथ्वी’ परिचित विश्वात्मक युग्म है; ‘टल जाएँगे/टलेंगी’ दोनों खंडों में मूल क्रिया की पुनरावृत्ति और विरोध को सुरक्षित रखता है।
