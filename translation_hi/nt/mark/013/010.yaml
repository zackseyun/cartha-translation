- from: और यह आवश्यक है कि शुभ समाचार पहले सभी जातियों में सुनाया जाए।[a][b]
  to: और शुभ समाचार का पहले सभी राष्ट्रों में प्रचार किया जाना आवश्यक है।[a][b]
  rationale: The revision replaces ‘जातियों’ with ‘राष्ट्रों’ to avoid an unintended caste sense while retaining the comprehensive scope of ἔθνη. It replaces ‘सुनाया जाए’ with ‘प्रचार किया जाना’ to convey the public-proclamation force of κηρυχθῆναι. The placement of ‘पहले’ and ‘आवश्यक’ preserves πρῶτον and δεῖ, and the footnote anchors remain attached to the relevant terms.
