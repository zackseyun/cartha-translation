review_pass:
  verdict: revise
  source_fidelity: The draft preserves the connective, temporal priority, necessity, passive proclamation, and broad scope of the Greek. However, ‘जातियों’ in contemporary Hindi commonly suggests caste communities and can misrepresent ἔθνη in this global-national context. ‘सुनाया जाए’ is understandable but is less precise than a term denoting public proclamation.
  naturalness: The clause is grammatical, but ‘शुभ समाचार का ... प्रचार किया जाना आवश्यक है’ is more idiomatic for a necessary public proclamation. ‘सभी राष्ट्रों में’ is clear modern standard Hindi and avoids the caste-related ambiguity of ‘जातियों में.’
  terminology: ‘शुभ समाचार’ is a transparent rendering of εὐαγγέλιον, with ‘सुसमाचार’ appropriately retained as an alternative. ‘प्रचार’ adequately conveys κηρυχθῆναι without adding theological interpretation. The footnote concerning ἔθνη should be updated to match the revised main-text wording.
  issues:
  - severity: medium
    issue: ‘जातियों’ may be understood as caste groups rather than nations/peoples.
    rationale: In modern Hindi, जाति has a strong and common caste association. In Mark 13:10, πάντα τὰ ἔθνη has the broad international/ethnic sense represented best here by ‘सभी राष्ट्रों,’ without narrowing it to non-Jews.
  - severity: low
    issue: ‘सुनाया जाए’ understates the public-proclamation sense of κηρυχθῆναι.
    rationale: The verb denotes proclamation/heralding. ‘प्रचार किया जाना’ more directly preserves that sense in natural Hindi.
  revised_text: और शुभ समाचार का पहले सभी राष्ट्रों में प्रचार किया जाना आवश्यक है।[a][b]
