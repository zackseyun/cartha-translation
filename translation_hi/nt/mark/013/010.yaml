  yaml_path: translation/nt/mark/013/010.yaml
  text: And the good news must first be proclaimed to all the nations[a][b].
translation:
  language: hi
  text: और शुभ समाचार का पहले सभी राष्ट्रों में प्रचार किया जाना आवश्यक है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सुसमाचार’। यूनानी εὐαγγέλιον का शाब्दिक अर्थ ‘शुभ समाचार’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सभी राष्ट्रों को’। यूनानी शब्द ἔθνη का अर्थ कुछ संदर्भों में ‘गैर-यहूदी’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से संवाद की निरंतरता बनाए रखता है, बिना विरोध का भाव जोड़े।
- source_word: εἰς πάντα τὰ ἔθνη
  choice: सभी जातियों में
  rationale: εἰς यहाँ प्रचार के विस्तार या क्षेत्र को व्यक्त कर सकता है। ‘सभी जातियों में’ व्यापक मानव-समुदायों का भाव रखता है और इसे केवल गैर-यहूदियों तक सीमित नहीं करता।
- source_word: πρῶτον
  choice: पहले
  rationale: यह समय अथवा क्रम की प्राथमिकता को सरल और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δεῖ
  choice: यह आवश्यक है कि
  rationale: यह δεῖ की अनिवार्यता को सुरक्षित रखता है, पर उस अनिवार्यता के स्रोत को स्पष्ट करके पाठ से अधिक नहीं कहता।
- source_word: κηρυχθῆναι
  choice: सुनाया जाए
  rationale: निष्क्रिय रूप और संदेश की सार्वजनिक घोषणा का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
- source_word: τὸ εὐαγγέλιον
  choice: शुभ समाचार
  rationale: यह यूनानी शब्द का मूल अर्थ सीधे और समझने योग्य हिन्दी में देता है; पारंपरिक ‘सुसमाचार’ को पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: ἔθνη का दायरा
  choice: सभी जातियों में
  alternative: सभी राष्ट्रों को; सभी गैर-यहूदियों में
  rationale: यह वैश्विक विस्तार को बनाए रखता है और ἔθνη के अर्थ को केवल ‘गैर-यहूदी’ मानकर संकीर्ण नहीं करता।
- issue: δεῖ की अनिवार्यता
  choice: यह आवश्यक है कि
  alternative: अवश्य
  rationale: यह कथन की अनिवार्यता को व्यक्त करता है, लेकिन उसे स्पष्ट रूप से ‘ईश्वरीय’ कहकर ऐसी व्याख्या नहीं जोड़ता जो इस पद में कही नहीं गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘शुभ समाचार’ अर्थ को पारदर्शी रखता है, जबकि ‘सुनाया जाए’ सार्वजनिक घोषणा का स्वाभाविक भाव देता है।
