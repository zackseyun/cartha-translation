  text: Be on guard; stay awake[a], for you do not know when the time is.
translation:
  language: hi
  text: सावधान रहो; जागते रहो, क्योंकि तुम नहीं जानते कि वह समय कब होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλέπετε
  choice: सावधान रहो
  rationale: यह बहुवचन आज्ञार्थक रूप यहाँ केवल देखने के नहीं, बल्कि सतर्क रहने की चेतावनी देता है। ‘सावधान रहो’ स्वाभाविक हिन्दी में यह अर्थ व्यक्त करता है और अगले आदेश से अनावश्यक दोहराव नहीं करता।
- source_word: ἀγρυπνεῖτε
  choice: जागते रहो
  rationale: यह बहुवचन आज्ञार्थक रूप जागे रहने अथवा चौकस बने रहने का अर्थ देता है। ‘जागते रहो’ जागरण के रूपक को बनाए रखता है।
- source_word: οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: जानने की क्रिया का सीधा निषेध है; यूनानी पाठ से परे कोई अतिरिक्त निश्चितता-सूचक भाव नहीं जोड़ा गया।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पहले दिए गए आदेशों का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: πότε
  choice: कब
  rationale: समय के विषय में प्रश्नवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: ὁ καιρός
  choice: वह समय
  rationale: καιρός यहाँ किसी निर्णायक या नियत अवसर की ओर संकेत कर सकता है। ‘वह समय’ संदर्भगत विशिष्टता बनाए रखते हुए मुख्य पाठ में अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐστιν
  choice: है
  rationale: वाक्य को पूरा करने वाली साधारण संयोजक क्रिया का सीधा अनुवाद।
theological_decisions:
- issue: अंत-समय संबंधी संदर्भ में καιρός की अर्थ-छाया
  choice: वह समय
  alternative: वह नियत समय; वह अवसर
  rationale: यीशु के अंत-समय संबंधी उपदेश में καιρός किसी निर्णायक या ठहराए हुए समय का बोध करा सकता है। मुख्य पाठ व्यापक अर्थ रखता है, जबकि अधिक स्पष्ट संभावनाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। दो निकटवर्ती आज्ञाओं का भेद ‘सावधान रहो’ और ‘जागते रहो’ से सुरक्षित है; बहुवचन संबोधन के लिए ‘तुम’ प्रयोग किया गया है।
