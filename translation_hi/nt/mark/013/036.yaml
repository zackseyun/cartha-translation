  text: μὴ ἐλθὼν ἐξαίφνης εὕρῃ ὑμᾶς καθεύδοντας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/036.yaml
  text: lest, coming suddenly, he find you sleeping.
translation:
  language: hi
  text: कहीं ऐसा न हो कि वह अचानक आकर तुम्हें सोते हुए पाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξαίφνης
  choice: अचानक
  rationale: क्रिया-विशेषण के आकस्मिकता के भाव को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καθεύδοντας
  choice: सोते हुए
  rationale: वर्तमान कृदन्त का सतत अवस्था वाला अर्थ बनाए रखता है और प्रसंग में जागते रहने के प्रत्यक्ष रूपक को अनावश्यक व्याख्या के बिना सुरक्षित रखता है।
- source_word: εὕρῃ
  choice: पाए
  rationale: यूनानी संभावनार्थक क्रिया को ‘कहीं ऐसा न हो कि’ के साथ स्वाभाविक हिन्दी आशंका-वाक्य में प्रस्तुत करता है।
theological_decisions:
- issue: सोने का प्रत्यक्ष या रूपकात्मक अर्थ
  choice: ‘सोते हुए’ रखकर अर्थ को खुला रखा गया
  alternative: ‘असावधान’ या ‘आत्मिक रूप से सोए हुए’
  rationale: मूल पाठ नींद की छवि का प्रयोग करता है; व्याख्यात्मक आध्यात्मिक अर्थ जोड़ना वास्तविक रूपक और उसकी व्यापकता को सीमित कर देता।
- issue: कर्ता की पहचान
  choice: सर्वनाम ‘वह’
  alternative: ‘स्वामी’ या ‘मनुष्य का पुत्र’
  rationale: इस पद में कर्ता अंतर्निहित है और निकटवर्ती प्रसंग से समझा जाता है; कोई स्पष्ट पदवी जोड़ना मूल से अधिक विशिष्ट होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘कहीं ऐसा न हो कि’ निषेधात्मक आशंका को व्यक्त करता है, जबकि ‘अचानक आकर’ यूनानी कृदन्तीय संरचना को सहज हिन्दी क्रम में रखता है।
