  text: καὶ ὁ εἰς τὸν ⸀ἀγρὸν μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω ἆραι τὸ ἱμάτιον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/016.yaml
  text: And the one in the field must not turn back to get his cloak[a].
translation:
  language: hi
  text: और जो खेत में हो, वह अपना लबादा लेने के लिए पीछे न लौटे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ऊपरी वस्त्र।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ εἰς τὸν ἀγρόν
  choice: जो खेत में हो
  rationale: यह विशेषणयुक्त पदबंध व्यक्ति को खेत में होने के आधार पर व्यक्त करता है। हिंदी में ‘जो खेत में हो’ स्वाभाविक है और यूनानी के एकवचन सामान्य संदर्भ को बनाए रखता है।
- source_word: ἀγρός
  choice: खेत
  rationale: यहाँ ἀγρός खेती की भूमि या खेत को दर्शाता है; पलायन की चेतावनी के संदर्भ में ‘खेत’ सीधा और उपयुक्त है।
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: पीछे न लौटे
  rationale: μή के साथ आज्ञार्थक रूप तत्काल निषेध व्यक्त करता है, और εἰς τὰ ὀπίσω लौटने की दिशा को स्पष्ट करता है। ‘पीछे न लौटे’ आधुनिक हिंदी में संक्षिप्त और प्रभावी है।
- source_word: ἆραι
  choice: लेने के लिए
  rationale: अनंत क्रिया लौटने का उद्देश्य बताती है। इस प्रसंग में वस्त्र को वापस जाकर प्राप्त करने के अर्थ में ‘लेने के लिए’ स्वाभाविक है।
- source_word: ἱμάτιον
  choice: लबादा
  rationale: ἱμάτιον प्रायः ऊपर पहने जाने वाले बाहरी वस्त्र को दर्शाता है। ‘लबादा’ उस ठोस अर्थ को संक्षेप में व्यक्त करता है; व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: αὐτοῦ
  choice: अपना
  rationale: यूनानी सर्वनाम उसी एकवचन कर्ता की वस्तु बताता है। हिंदी में सहसंदर्भ स्पष्ट करने के लिए ‘अपना’ व्याकरणतः स्वाभाविक है और अर्थ को ठीक रखता है।
theological_decisions:
- issue: एकवचन सामान्य मानवीय संदर्भ
  choice: ‘जो खेत में हो, वह अपना...’ के द्वारा एकवचन सामान्य संदर्भ बनाए रखा गया।
  alternative: ‘जो लोग खेतों में हों, वे अपने...’ कहकर बहुवचन करना।
  rationale: यूनानी पाठ एकवचन विशेषणयुक्त पुल्लिंग पदबंध और एकवचन सर्वनाम प्रयोग करता है। हिंदी की यह रचना किसी पुरुष तक अर्थ सीमित किए बिना स्रोत का एकवचन प्रतिनिधिक बल बनाए रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘पीछे न लौटे’ चेतावनी की तात्कालिकता रखता है; ‘लबादा’ सामान्य पाठक के लिए समझने योग्य ठोस वस्त्र-संज्ञा है।
