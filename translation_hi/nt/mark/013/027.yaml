id: MRK.13.27
reference: Mark 13:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τότε ἀποστελεῖ τοὺς ⸀ἀγγέλους καὶ ἐπισυνάξει τοὺς ⸀ἐκλεκτοὺς ἐκ τῶν τεσσάρων ἀνέμων ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/027.yaml
  text: And then he will send out the angels and gather the chosen ones from the four winds[c][b][a], from the end of the earth to the end of heaven.
translation:
  language: hi
  text: और तब वह स्वर्गदूतों को भेजेगा और चुने हुओं[a] को चारों पवनों[b] से—पृथ्वी के छोर से आकाश के छोर तक[c]—इकट्ठा करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत रूप से: “निर्वाचितों।”'
    reason: lexical_alternative
  - marker: b
    text: “चारों पवनों से” का अर्थ है हर दिशा से।
    reason: cultural_note
  - marker: c
    text: या, “पृथ्वी के दूर से दूर छोर से स्वर्ग के दूर से दूर छोर तक।” कुछ अनुवाद इसे “आकाश के एक छोर से दूसरे छोर तक” भी कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण घटनाक्रम में अगली घटना को दर्शाता है; ‘तब’ संक्षिप्त, स्वाभाविक और सटीक है।
- source_word: ἀποστελεῖ
  choice: भेजेगा
  rationale: भविष्यकाल की क्रिया है। प्रसंग से स्पष्ट है कि स्वर्गदूत किसी कार्य के लिए भेजे जाते हैं; हिन्दी में ‘भेजेगा’ ही इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: इस प्रलय-संबंधी प्रसंग में अलौकिक दूत अभिप्रेत हैं, इसलिए सामान्य ‘दूतों’ के बजाय ‘स्वर्गदूतों’ चुना गया है।
- source_word: ἐπισυνάξει
  choice: इकट्ठा करेगा
  rationale: क्रिया का अर्थ अलग-अलग स्थानों से लोगों को एक साथ एकत्र करना है; ‘इकट्ठा करेगा’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἐκλεκτούς
  choice: चुने हुओं
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है और परमेश्वर द्वारा चुने गए लोगों की ओर संकेत करता है। ‘चुने हुए’ अर्थ को स्पष्ट रखता है और किसी बाद की विशिष्ट धर्मवैज्ञानिक प्रणाली की तकनीकी शब्दावली नहीं थोपता।
- source_word: ἐκ τῶν τεσσάρων ἀνέμων
  choice: चारों पवनों से
  rationale: यह सभी दिशाओं का मुहावरा है। ‘चारों पवनों’ से मूल बिंब सुरक्षित रहता है; अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: ἀπ’ ἄκρου γῆς ἕως ἄκρου οὐρανοῦ
  choice: पृथ्वी के छोर से आकाश के छोर तक
  rationale: समानांतर पदबंध समूचे विस्तार को व्यक्त करता है। ‘छोर’ ἄκρον का स्वाभाविक समतुल्य है और ‘आकाश’ यहाँ οὐρανός के स्थानगत अर्थ को स्पष्ट रखता है।
- source_word: καὶ τότε ... καὶ
  choice: और तब ... और
  rationale: दोनों संयोजकों को रखकर मरकुस की क्रमिक कथन-शैली और दोनों भावी कार्यों का समन्वय सुरक्षित रखा गया है।
theological_decisions:
- issue: ἐκλεκτούς का प्रलय-संबंधी अर्थ
  choice: चुने हुओं
  alternative: निर्वाचितों
  rationale: ‘चुने हुओं’ परमेश्वर के चुनाव का भाव बनाए रखता है, पर पद को बाद की किसी मत-पद्धति का तकनीकी कथन नहीं बनाता।
- issue: एकत्र किए जाने का भौगोलिक और ब्रह्मांडीय विस्तार
  choice: चारों पवनों से—पृथ्वी के छोर से आकाश के छोर तक
  alternative: चारों दिशाओं से, पृथ्वी के एक छोर से आकाश के दूसरे छोर तक
  rationale: मूल यूनानी दिशाओं के मुहावरे और पृथ्वी-आकाश के व्यापक बिंब को साथ रखता है। इसे केवल ‘हर जगह से’ कहकर उसका काव्यात्मक और प्रलय-संबंधी तनाव समाप्त नहीं किया गया।
- issue: οὐρανός का अनुवाद
  choice: आकाश
  alternative: स्वर्ग
  rationale: यहाँ पदबंध स्थानगत विस्तार दिखाता है, इसलिए ‘आकाश’ अधिक स्वाभाविक है। फिर भी यूनानी शब्द ‘स्वर्ग’ भी दर्शा सकता है; इस वैकल्पिक अर्थ को फुटनोट में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चारों पवनों’ जैसे मूल बाइबलीय बिंब को बनाए रखते हुए उसका मुहावरेदार अर्थ फुटनोट में बताया गया है। वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम के अनुसार है, जबकि मूल के दोनों समन्वित कार्य—भेजना और इकट्ठा करना—स्पष्ट बने रहते हैं।
