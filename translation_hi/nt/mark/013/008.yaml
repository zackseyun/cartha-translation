source:
  edition: SBLGNT
  text: ἐγερθήσεται γὰρ ἔθνος ἐπ’ ἔθνος καὶ βασιλεία ἐπὶ βασιλείαν, ⸀ἔσονται σεισμοὶ κατὰ τόπους, ⸁ἔσονται ⸀λιμοί· ⸀ἀρχὴ ὠδίνων ταῦτα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/008.yaml
  text: For nation will rise against nation[a], and kingdom against kingdom. There will be earthquakes in various places; there will be famines. These are the beginning of birth pains.
translation:
  language: hi
  text: क्योंकि राष्ट्र राष्ट्र के विरुद्ध और राज्य राज्य के विरुद्ध उठ खड़े होंगे। जगह-जगह भूकंप होंगे और अकाल पड़ेंगे। ये प्रसव-पीड़ाओं की शुरुआत हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερθήσεται
  choice: चढ़ाई करेगा
  rationale: यहाँ क्रिया एक समुदाय के दूसरे के विरुद्ध युद्ध या आक्रमण के लिए उठ खड़े होने का भाव देती है। ‘चढ़ाई करेगा’ आधुनिक हिन्दी में संघर्ष का आशय स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔθνος ... ἐπ’ ἔθνος
  choice: जाति पर जाति
  rationale: ἔθνος किसी जाति, जनसमुदाय या राष्ट्र को सूचित कर सकता है। βασιλεία के समानांतर यहाँ सामूहिक राजनीतिक-सामाजिक संघर्ष है; ‘जाति पर जाति’ प्रचलित, संक्षिप्त और पर्याप्त व्यापक है।
- source_word: βασιλεία ... ἐπὶ βασιλείαν
  choice: राज्य पर राज्य
  rationale: यहाँ βασιλεία अमूर्त राजसत्ता के बजाय राजनीतिक राज्य या राज्यक्षेत्र को दर्शाता है। यह चयन पहले खंड के समानांतर विन्यास को बनाए रखता है।
- source_word: σεισμοὶ
  choice: भूकंप
  rationale: इस प्रसंग में σεισμός का सीधा अर्थ भूकंप है।
- source_word: κατὰ τόπους
  choice: जगह-जगह
  rationale: बहुवचन के साथ κατά का वितरणात्मक भाव अनेक अलग-अलग स्थानों में होने को दर्शाता है; ‘जगह-जगह’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: λιμοί
  choice: अकाल
  rationale: λιμός केवल भूख नहीं, व्यापक खाद्य-अभाव या अकाल को दर्शाता है। हिन्दी में ‘अकाल पड़ेंगे’ इसका स्वाभाविक प्रयोग है।
- source_word: ἀρχὴ
  choice: शुरुआत
  rationale: यह इन घटनाओं को आगे आने वाली अवस्था का आरंभ बताता है, उसकी संपूर्णता नहीं।
- source_word: ὠδίνων
  choice: प्रसव-पीड़ाओं
  rationale: ὠδίν प्रसव से जुड़ी पीड़ा को दर्शाता है और यहाँ रूपक के रूप में प्रयुक्त है। ‘प्रसव-पीड़ाएँ’ चित्र को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: ταῦτα
  choice: ये
  rationale: यह बहुवचन संकेतवाचक पूर्वोक्त घटनाओं की ओर संकेत करता है; हिन्दी में ‘ये ... हैं’ स्वाभाविक है।
theological_decisions:
- issue: ἀρχὴ ὠδίνων में प्रलय-संबंधी रूपक
  choice: इन घटनाओं को प्रसव-पीड़ाओं की शुरुआत कहा गया है।
  alternative: इन्हें सामान्य कष्ट कहना, या किसी विशिष्ट अंतकालीन क्रम से स्पष्टतः बाँध देना।
  rationale: अनुवाद पीड़ा और उसके बाद आने वाली बात के बीच निहित रूपकात्मक तनाव को बनाए रखता है, पर पाठ से परे कोई विस्तृत अंतकालीन व्यवस्था आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘जाति पर जाति और राज्य पर राज्य’ मूल के समानांतर वाक्य-विन्यास को बचाता है; ‘जगह-जगह’ सामान्य पाठक के लिए सहज है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि प्रसव का रूपक मुख्य पाठ में स्पष्ट है।
