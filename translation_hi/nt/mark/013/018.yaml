  verdict: approve
  source_fidelity: ‘पर प्रार्थना करो कि यह सर्दियों में न हो।’ faithfully renders the mild connective δέ, the plural imperative προσεύχεσθε, the negative ἵνα-clause, and Mark’s deliberately elliptical γένηται. ‘यह’ appropriately retains the unspecified, contextually understood event rather than importing ‘flight’ from Matthew.
  naturalness: The Hindi is concise, modern, and idiomatic. ‘प्रार्थना करो’ is a natural plural imperative in this register, and ‘सर्दियों में’ is clear and natural for the seasonal expression.
  terminology: ‘प्रार्थना’ is the standard appropriate term. The footnote accurately identifies the more explicit contextual interpretation without presenting it as wording in Mark, and its comparison with Matthew 24:20 is accurate.
