  text: προσεύχεσθε δὲ ἵνα μὴ ⸀γένηται χειμῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/018.yaml
  text: But pray that it may not happen in winter[a].
translation:
  language: hi
  text: पर प्रार्थना करो कि यह सर्दियों में न हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, संदर्भ को अधिक स्पष्ट करते हुए, “तुम्हारा भागना सर्दियों में न हो।” मरकुस का यूनानी पाठ मत्ती 24:20 के समानांतर कथन की अपेक्षा अधिक संक्षिप्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: προσεύχεσθε
  choice: प्रार्थना करो
  rationale: वर्तमानकालिक आज्ञार्थक, मध्यम/डिपोनेंट, बहुवचन रूप है। आधुनिक हिन्दी में सरल आज्ञा ‘प्रार्थना करो’ स्वाभाविक है; ‘प्रार्थना करते रहो’ पक्षगत निरंतरता को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: δὲ
  choice: पर
  rationale: यह हल्का संयोजक अथवा संक्रमणसूचक अव्यय है। पिछले पद की चेतावनी के बाद ‘पर’ स्वाभाविक रहते हुए हल्का विरोध बनाए रखता है।
- source_word: ἵνα μὴ
  choice: कि ... न
  rationale: यह निषेध के साथ प्रार्थना की विषय-वस्तु अथवा उद्देश्य प्रस्तुत करता है। ‘प्रार्थना करो कि ... न’ आधुनिक हिन्दी की स्वाभाविक रचना है।
- source_word: γένηται
  choice: यह ... न हो
  rationale: γίνομαι का एओरिस्ट मध्यम सब्जंक्टिव रूप है। यूनानी में अभिप्रेत घटना स्पष्ट संज्ञा के बिना कही गई है; ‘यह ... न हो’ उसी संक्षिप्तता और संदर्भगत अस्पष्टता को बनाए रखता है।
- source_word: χειμῶνος
  choice: सर्दियों में
  rationale: समय/ऋतु बताने वाला संबंधकारक प्रयोग है। ‘सर्दियों में’ साधारण आधुनिक हिन्दी में सहज और स्पष्ट है।
theological_decisions:
- issue: γένηται का अप्रकट कर्ता अथवा संदर्भ
  choice: यूनानी की संदर्भ-निर्भर संक्षिप्तता को ‘यह ... न हो’ के रूप में बनाए रखा गया।
  alternative: ‘तुम्हारा भागना सर्दियों में न हो’
  rationale: मरकुस के यूनानी पाठ में ‘तुम्हारा भागना’ स्पष्ट रूप से नहीं है, जबकि मत्ती 24:20 में वह अधिक स्पष्ट है। समानांतर पाठ की भाषा जोड़ने के बजाय मूल पाठ की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह’ पिछले संदर्भ की ओर संकेत करता है और मूल यूनानी की दीर्घवृत्तात्मक अभिव्यक्ति को अनावश्यक रूप से नहीं खोलता।
