id: MRK.13.11
reference: Mark 13:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ ὅταν⸃ ⸀ἄγωσιν ὑμᾶς παραδιδόντες, μὴ προμεριμνᾶτε τί ⸀λαλήσητε, ἀλλ’ ὃ ἐὰν δοθῇ ὑμῖν ἐν ἐκείνῃ τῇ ὥρᾳ τοῦτο λαλεῖτε, οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες ἀλλὰ τὸ πνεῦμα τὸ ἅγιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/011.yaml
  text: And when they lead you away and hand you over[a], do not worry beforehand about what you should say; but whatever is given to you in that hour, speak that. For it is not you who are speaking[b], but the Holy Spirit.
translation:
  language: hi
  text: और जब वे तुम्हें ले जाकर हवाले करें, तो पहले से इस बात की चिंता मत करना कि तुम्हें क्या बोलना है। बल्कि उस घड़ी तुम्हें जो कुछ दिया जाए, वही बोलना; क्योंकि बोलनेवाले तुम नहीं, बल्कि पवित्र आत्मा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὅταν
  choice: और जब
  rationale: यह जुड़े हुए कथन में आने वाली परिस्थिति को प्रस्तुत करता है; ‘और जब’ कथानक का संबंध और अपेक्षित घटना दोनों बनाए रखता है।
- source_word: ἄγωσιν ὑμᾶς παραδιδόντες
  choice: वे तुम्हें ले जाकर अधिकारियों के हवाले करें
  rationale: मुख्य क्रिया और सहभागी कृदन्त मिलकर गिरफ्तारी तथा सौंपे जाने की एक सतत घटना बताते हैं। ‘अधिकारियों’ को अर्थ-स्पष्टता के लिए जोड़ा गया है, क्योंकि प्रसंग में सौंपना न्यायिक अधिकारियों को है।
- source_word: μὴ προμεριμνᾶτε
  choice: पहले से चिंता मत करना
  rationale: क्रिया में अग्रिम रूप से व्याकुल होने का भाव है; यह हिंदी में स्वाभाविक ढंग से कालगत उपसर्ग और चिंता दोनों व्यक्त करता है।
- source_word: τί λαλήσητε
  choice: क्या बोलना है
  rationale: λαλέω का सामान्य अर्थ ‘बोलना/कहना’ है। यहाँ ‘क्या बोलना है’ स्वाभाविक हिंदी है और आगे उसी क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: ὃ ἐὰν δοθῇ ὑμῖν
  choice: जो कुछ तुम्हें दिया जाए
  rationale: कर्मवाच्य अज्ञात/अव्यक्त दाता को स्पष्ट रूप से नाम दिए बिना ईश्वरीय प्रबंध का संकेत बनाए रखता है।
- source_word: ἐν ἐκείνῃ τῇ ὥρᾳ
  choice: उस घड़ी
  rationale: यह निर्णायक समय के लिए मूल का गंभीर और प्रचलित बाइबिलीय मुहावरा सुरक्षित रखता है।
- source_word: τοῦτο λαλεῖτε
  choice: वही बोलना
  rationale: '‘वही’ τοῦτο के बल को व्यक्त करता है: उन्हें ठीक वही बोलना है जो दिया जाए।'
- source_word: οὐ γάρ ἐστε ὑμεῖς οἱ λαλοῦντες
  choice: क्योंकि बोलनेवाले तुम नहीं
  rationale: यह ὑμεῖς पर दिए गए जोर और अगले खंड के विरोध को संक्षिप्त, स्वाभाविक हिंदी में बनाए रखता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक मानक हिंदी में इस उपाधि का स्थापित और गरिमापूर्ण रूप है।
theological_decisions:
- issue: सताव के समय प्रेरित वाणी में कर्तृत्व
  choice: शिष्य सचमुच बोलते हैं, पर उस निर्णायक समय उनकी वाणी का मूल स्रोत पवित्र आत्मा बताया गया है।
  alternative: या तो शिष्यों को केवल निष्क्रिय यंत्र मानना, अथवा पवित्र आत्मा को मात्र सामान्य धार्मिक प्रेरणा समझना।
  rationale: आज्ञा शिष्यों को बोलने की है, फिर भी विरोधात्मक कथन अंतिम कर्तृत्व पवित्र आत्मा को देता है। अनुवाद इस तनाव को किसी एक चरम में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन के लिए बहुवचन ‘तुम’; भाषा सहज, गरिमापूर्ण और मौखिक पाठ में स्पष्ट है। ‘अधिकारियों’ प्रसंगगत अर्थ को स्पष्ट करता है, जबकि मूल के कर्मवाच्य और पवित्र आत्मा के कर्तृत्व को यथावत रखा गया है।
