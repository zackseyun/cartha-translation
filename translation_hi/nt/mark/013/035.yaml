source:
  edition: SBLGNT
  text: γρηγορεῖτε οὖν, οὐκ οἴδατε γὰρ πότε ὁ κύριος τῆς οἰκίας ἔρχεται, ⸀ἢ ὀψὲ ἢ ⸀μεσονύκτιον ἢ ἀλεκτοροφωνίας ἢ πρωΐ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/035.yaml
  text: 'Therefore stay awake[a], for you do not know when the master of the house is coming: whether in the evening, or at midnight, or at cockcrow[b], or in the morning.'
translation:
  language: hi
  text: इसलिए जागते रहो[a], क्योंकि तुम नहीं जानते कि घर का स्वामी कब आएगा—शाम को, आधी रात को, मुर्गे के बाँग देने के समय[b], या सुबह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चौकस रहो।” इस आज्ञा में सचेत और सतर्क बने रहने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: “मुर्गे के बाँग देने का समय” उस रात्रि-पहर को दर्शाता है जिसकी पहचान मुर्गे की बाँग से होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: बहुवचन आज्ञार्थक क्रिया यहाँ लगातार सचेत और चौकस रहने का भाव देती है। निकटवर्ती संदर्भ रात में जागते रहने की छवि को भी सक्रिय रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले उपदेश से निकलने वाले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: न जानने के सीधे निषेध को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: πότε
  choice: कब
  rationale: अप्रत्यक्ष कालवाचक प्रश्न का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: ὁ κύριος τῆς οἰκίας
  choice: घर का स्वामी
  rationale: घरेलू दृष्टांत में κύριος घर पर अधिकार रखने वाले व्यक्ति को दर्शाता है। ‘स्वामी’ अधिकार और दृष्टांत के व्यापक संकेत—दोनों को बनाए रखता है।
- source_word: ἔρχεται
  choice: आएगा
  rationale: यूनानी वर्तमान रूप संदर्भ में प्रत्याशित भावी आगमन बताता है; हिन्दी में सामान्य भविष्यकाल स्वाभाविक है।
- source_word: ὀψὲ
  choice: शाम को
  rationale: रात के पहरों की क्रमिक सूची में यह शाम के पहर को सूचित करता है।
- source_word: μεσονύκτιον
  choice: आधी रात को
  rationale: समय-सूचक पद का सीधा, प्रचलित हिन्दी रूप।
- source_word: ἀλεκτοροφωνίας
  choice: मुर्गे के बाँग देने के समय
  rationale: यह मुर्गे की बाँग से पहचाने जाने वाले रात्रि-पहर को बताता है; यह हिन्दी में स्पष्ट और सांस्कृतिक रूप से समझने योग्य है।
- source_word: πρωΐ
  choice: सुबह
  rationale: रात के अंतिम पहर से सुबह की ओर संकेत करता है और मूल की व्यापकता को बनाए रखता है।
theological_decisions:
- issue: घरेलू दृष्टांत में κύριος का अनुवाद, जो अप्रत्यक्ष रूप से यीशु की ओर संकेत कर सकता है
  choice: घर का स्वामी
  alternative: घर का प्रभु; घर का मालिक; गृहस्वामी
  rationale: वाक्य के भीतर पद का सीधा अर्थ घर पर अधिकार रखने वाला व्यक्ति है। ‘स्वामी’ घरेलू छवि और अधिकार को सुरक्षित रखता है, साथ ही दृष्टांत के व्यापक मसीही संकेत को न तो जबरन प्रत्यक्ष उपाधि बनाता है, न नकारता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में है। भाषा सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। रात के चार समय-सूचकों की क्रमिक लय सुरक्षित है।
