  text: ⸀ὁ ἐπὶ τοῦ δώματος μὴ ⸀καταβάτω μηδὲ εἰσελθάτω ⸂τι ἆραι⸃ ἐκ τῆς οἰκίας αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/015.yaml
  text: Let the one on the housetop not go down[a], nor enter to take anything out of his house.
translation:
  language: hi
  text: जो छत पर हो, वह नीचे न उतरे[a] और न अपने घर से कुछ लेने के लिए भीतर जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘छत’ से घर की प्रायः समतल और सुलभ छत अभिप्रेत है, जिसका उपयोग रहने-बैठने और अन्य कामों के लिए भी होता था।
    reason: cultural_note
lexical_decisions:
- source_word: ὁ ἐπὶ τοῦ δώματος
  choice: जो छत पर हो
  rationale: संज्ञा के रूप में प्रयुक्त पदबंध उस व्यक्ति को बताता है जो उस स्थान पर है। हिन्दी में यह स्वाभाविक रूप से सामान्य निर्देश भी व्यक्त करता है।
- source_word: δώματος
  choice: छत
  rationale: यह घर की प्रायः समतल और उपयोग में आने वाली छत को दर्शाता है; सांस्कृतिक जानकारी पादटिप्पणी में स्पष्ट की गई है।
- source_word: μὴ καταβάτω
  choice: नीचे न उतरे
  rationale: तीसरे पुरुष की निषेधात्मक आज्ञा को हिन्दी में इस रूप में सहज और स्पष्ट ढंग से व्यक्त किया गया है।
- source_word: μηδὲ εἰσελθάτω
  choice: और न ... भीतर जाए
  rationale: μηδέ दूसरी निषेधात्मक आज्ञा को जोड़ता है। 'भीतर जाए' घर में प्रवेश करने की गति को स्वाभाविक हिन्दी में रखता है।
- source_word: τι ἆραι
  choice: कुछ लेने के लिए
  rationale: अनिश्चित सर्वनाम और infinitive उद्देश्य बताते हैं—किसी वस्तु को लेने के लिए भीतर जाना। 'कुछ' मूल की अनिश्चितता बनाए रखता है।
- source_word: ἐκ τῆς οἰκίας αὐτοῦ
  choice: अपने घर में ... भीतर
  rationale: संदर्भ में घर के भीतर प्रवेश करके वहाँ से कोई वस्तु लेने का आशय है। हिन्दी का निजवाचक 'अपने' उसी कर्ता के घर को स्पष्ट और स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: सामान्य अर्थ वाला पुल्लिंग एकवचन निर्देश
  choice: अपने घर
  alternative: उसके घर / उनके घर
  rationale: यूनानी में प्रतिनिधिक पुल्लिंग एकवचन है। हिन्दी में 'जो ... हो, वह ... अपने घर' एकवचन और सामान्य बल दोनों बनाए रखता है तथा स्वामित्व को उसी व्यक्ति से स्वाभाविक रूप से जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। 'छत' सामान्य हिन्दी पाठक के लिए 'घर की छत' या कृत्रिम 'छत के ऊपर' से अधिक सहज है; पादटिप्पणी प्राचीन यहूदी घरों की समतल, उपयोगी छत का सांस्कृतिक संदर्भ देती है।
