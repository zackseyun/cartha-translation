source:
  edition: SBLGNT
  text: Περὶ δὲ τῆς ἡμέρας ἐκείνης ἢ ⸀τῆς ὥρας οὐδεὶς οἶδεν, οὐδὲ οἱ ἄγγελοι ⸀ἐν οὐρανῷ οὐδὲ ὁ υἱός, εἰ μὴ ὁ πατήρ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/032.yaml
  text: But concerning that day or hour[a], no one knows—not even the angels in heaven, nor the Son, but only the Father.
translation:
  language: hi
  text: पर उस दिन या उस घड़ी के विषय में कोई नहीं जानता—स्वर्ग के दूत भी नहीं, न पुत्र; केवल पिता ही जानता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ व्याख्याकार ‘न पुत्र’ को पुत्र के देहधारण के कार्य या उसके मानवीय स्वभाव के संदर्भ में समझते हैं; अनुवाद मुख्य पाठ में यह व्याख्या जोड़े बिना यूनानी पाठ के शब्दों को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Περὶ δὲ
  choice: पर ... के विषय में
  rationale: περί के साथ संबंधकारक विषय का परिचय देता है, और δέ पिछले कथन से हल्का संक्रमण या विरोध दर्शाता है। यह रूप दोनों बातों को स्वाभाविक हिन्दी में रखता है।
- source_word: τῆς ἡμέρας ἐκείνης ἢ τῆς ὥρας
  choice: उस दिन या उस घड़ी
  rationale: दोनों संबंधकारक पद विचाराधीन समय को बताते हैं; दोहराया गया निर्धारक हिन्दी में ‘उस दिन या उस घड़ी’ द्वारा स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: οὐδεὶς οἶδεν
  choice: कोई नहीं जानता
  rationale: οὐδείς पूर्ण निषेध व्यक्त करता है और οἶδα का यहाँ वर्तमान अर्थ ‘जानता है’ है।
- source_word: οὐδὲ οἱ ἄγγελοι ἐν οὐρανῷ
  choice: न स्वर्ग के दूत
  rationale: οὐδέ निषेध की श्रृंखला को बलपूर्वक आगे बढ़ाता है; ἐν οὐρανῷ को स्थानसूचक मानकर दूतों से जोड़ा गया है।
- source_word: οὐδὲ ὁ υἱός
  choice: न पुत्र
  rationale: दोहराया गया οὐδέ निषेध की उसी श्रृंखला को जारी रखता है। ‘पुत्र’ को मसीही उपाधि के रूप में बिना व्याख्यात्मक विस्तार के रखा गया है।
- source_word: εἰ μὴ ὁ πατήρ
  choice: केवल पिता
  rationale: निषेध के बाद εἰ μή एकमात्र अपवाद बताता है; ‘केवल पिता’ हिन्दी में इसकी विशिष्टता स्पष्ट करता है।
theological_decisions:
- issue: यह मसीह-विषयक कथन कि पुत्र उस दिन या घड़ी को नहीं जानता
  choice: ‘न पुत्र’ के स्पष्ट कथन को बिना नरम किए या मुख्य पाठ में व्याख्या जोड़े बनाए रखना।
  alternative: मुख्य पाठ में ‘अपने मानवीय स्वभाव में’ या ‘अपने देहधारण के कार्य में’ जैसा व्याख्यात्मक विशेषण जोड़ना।
  rationale: यूनानी पाठ में οὐδὲ ὁ υἱός स्पष्ट रूप से उपस्थित है। अनुवाद वास्तविक धर्मवैज्ञानिक तनाव को बनाए रखता है और मुख्य पंक्ति में बाद की धर्मसैद्धांतिक व्याख्या नहीं मिलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘घड़ी’ समय की विशिष्ट इकाई का भाव बनाए रखती है, और ‘पुत्र’ को उपाधि के रूप में रखा गया है।
