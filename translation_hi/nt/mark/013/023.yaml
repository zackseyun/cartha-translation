translation:
  language: hi
  text: पर तुम[a] सावधान रहो; मैंने तुम्हें सब कुछ पहले ही बता दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम स्वयं’; मूल में ‘तुम’ स्पष्ट रूप से प्रयुक्त है और बलयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς
  choice: तुम
  rationale: बहुवचन सर्वनाम स्पष्ट रूप से प्रयुक्त है और विरोधात्मक बल रखता है; हिन्दी में ‘तुम’ उसे स्वाभाविक ढंग से बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से विरोध अथवा चेतावनी की ओर संक्रमण दिखाता है; ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: βλέπετε
  choice: सावधान रहो
  rationale: वर्तमान काल का बहुवचन आज्ञार्थक रूप यहाँ लगातार चौकस रहने की चेतावनी देता है; शाब्दिक ‘देखो’ की अपेक्षा ‘सावधान रहो’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: προείρηκα
  choice: पहले ही बता दी हैं
  rationale: क्रिया पहले से कह देने और उसके वर्तमान महत्त्व—दोनों को व्यक्त करती है; हिन्दी में यह पूर्ण पक्ष के साथ स्वाभाविक है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: बोलने की क्रिया का अप्रत्यक्ष कर्म है, जिसे हिन्दी में ‘तुम्हें’ से व्यक्त किया जाता है।
- source_word: πάντα
  choice: सब बातें
  rationale: नपुंसकलिंग बहुवचन का अर्थ ‘सब कुछ/सारी बातें’ हो सकता है; यहाँ यीशु द्वारा बताई गई बातों के संदर्भ में ‘सब बातें’ सहज है और दायरे को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: यीशु की चेतावनी और पहले से किए गए प्रकाशन का दायरा
  choice: ‘सब बातें’ रखकर कथन की व्यापकता और संदर्भगत अनिश्चितता को बनाए रखा गया है।
  alternative: ‘यह सब’ कहकर इसे केवल निकटवर्ती चेतावनियों तक सीमित करना, या इसे भविष्य के हर विवरण का सर्वांगीण प्रकाशन मानना।
  rationale: πάντα व्यापक है, पर पद स्वयं उसके दायरे को स्पष्ट रूप से निर्धारित नहीं करता। अनुवाद को न तो दायरा संकुचित करना चाहिए, न ही उससे भविष्य के प्रत्येक विवरण के पूर्ण प्रकटीकरण का दावा बनाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और चेतावनी की तात्कालिकता के अनुरूप। ‘सावधान रहो’ को βλέπετε का स्वाभाविक प्रसंगगत रूप चुना गया है।
