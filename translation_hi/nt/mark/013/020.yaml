reference: Mark 13:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἰ μὴ ⸂ἐκολόβωσεν κύριος⸃ τὰς ἡμέρας, οὐκ ἂν ἐσώθη πᾶσα σάρξ. ἀλλὰ διὰ τοὺς ἐκλεκτοὺς οὓς ἐξελέξατο ἐκολόβωσεν τὰς ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/020.yaml
  text: And if the Lord had not cut short the days[a], no flesh would have been saved. But for the sake of the elect, whom he chose, he cut short the days.
translation:
  language: hi
  text: और यदि प्रभु ने उन दिनों को घटाया न होता, तो कोई भी मनुष्य जीवित न बचता[a]। परन्तु चुने हुओं के लिए, जिन्हें उसने चुना, उसने उन दिनों को घटा दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कोई देह न बचती”; अर्थात कोई मनुष्य जीवित न बचता।
    reason: मूल यूनानी मुहावरे πᾶσα σάρξ (‘समस्त देह’) के शाब्दिक रूप को सुरक्षित रखने और उसके प्रसंगगत अर्थ को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ἐκολόβωσεν
  choice: घटा दिए
  rationale: क्रिया का अर्थ किसी अवधि को छोटा करना या सीमित कर देना है। ‘दिन घटा दिए’ स्वाभाविक हिन्दी है और दोनों प्रयोगों में एक ही भाव बनाए रखता है। शर्तवाले पहले खंड में यही अर्थ ‘घटाए न होते’ के रूप में व्यक्त हुआ है।
- source_word: κύριος
  choice: प्रभु
  rationale: यहाँ κύριος एक निश्चित व्यक्ति के लिए प्रयुक्त है। हिन्दी में ‘प्रभु’ स्वाभाविक और स्थापित बाइबलीय संबोधन है।
- source_word: τὰς ἡμέρας
  choice: वे दिन
  rationale: ‘वे दिन’ इससे पहले वर्णित संकट के समय की ओर संकेत करता है और मूल पाठ की बहुवचन काल-संज्ञा को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: οὐκ ἂν ἐσώθη
  choice: जीवित न बचता
  rationale: ἄν सहित यह रूप अवास्तविक संभावित परिणाम बताता है। इस प्रसंग में σῴζω का तात्कालिक आशय विनाश के बीच जीवन का बचना है; ‘जीवित न बचता’ हिन्दी में इसे स्पष्ट करता है, बिना इसे केवल आत्मिक उद्धार का कथन बनाए।
- source_word: πᾶσα σάρξ
  choice: कोई भी मनुष्य
  rationale: नकारात्मक वाक्य में यह यूनानी-बाइबलीय मुहावरा समस्त मानवजाति के अर्थ में है। मुख्य पाठ में स्वाभाविक हिन्दी ‘कोई भी मनुष्य’ रखी गई है, जबकि शाब्दिक ‘कोई देह’ पादटिप्पणी में सुरक्षित है।
- source_word: διὰ τοὺς ἐκλεκτούς
  choice: चुने हुओं के कारण
  rationale: διά के साथ कर्मकारक यहाँ उन लोगों के कारण अथवा उनके हित में किए गए कार्य को बताता है। यह रूप अर्थ को स्वाभाविक ढंग से व्यक्त करता है और आगे आने वाली ‘जिन्हें उसने चुना है’ से शब्दगत संबंध भी बनाए रखता है।
- source_word: ἐκλεκτούς
  choice: चुने हुए
  rationale: ‘चुने हुए’ सामान्य आधुनिक हिन्दी में स्पष्ट है और किसी विशिष्ट साम्प्रदायिक निर्वाचन-सिद्धान्त को आरोपित किए बिना मूल पद का अर्थ रखता है।
- source_word: οὓς ἐξελέξατο
  choice: जिन्हें उसने चुना है
  rationale: यह सापेक्ष उपवाक्य मूल पाठ की पुनरुक्ति को जानबूझकर बनाए रखता है और यह स्पष्ट करता है कि चुने हुए वही हैं जिन्हें उसने चुना।
theological_decisions:
- issue: इस प्रसंग में ‘बचने’ का अर्थ
  choice: विपत्ति में मानव जीवन का जीवित बचना
  alternative: केवल आत्मिक या अनन्त उद्धार
  rationale: आसपास का प्रसंग ऐसे संकट की बात करता है जिसमें दिन न घटाए जाते तो मनुष्य नष्ट हो जाते। इसलिए मुख्य तात्कालिक अर्थ शारीरिक जीवन की रक्षा है; अनुवाद इस पद को अनन्त उद्धार पर प्रत्यक्ष सिद्धान्तात्मक कथन नहीं बनाता।
- issue: ‘चुने हुओं’ की पहचान और निर्वाचन का स्वरूप
  choice: पाठ के पदनाम ‘चुने हुए’ को बिना अतिरिक्त परिभाषा के बनाए रखना
  alternative: इसे स्पष्ट रूप से केवल सामूहिक निर्वाचन या केवल व्यक्तिगत पूर्वनियति के रूप में परिभाषित करना
  rationale: पद बताता है कि प्रभु ने इन लोगों को चुना है और उनके कारण दिन घटाए हैं, पर यहाँ निर्वाचन के व्यापक सिद्धान्त या उसके स्वरूप की व्याख्या नहीं करता। इसलिए मूल धार्मिक तनाव खुला रखा गया है।
- issue: दिन घटाने वाला कर्ता
  choice: दूसरे वाक्य के ‘उसने’ को पहले वाक्य के ‘प्रभु’ से संबद्ध रखना
  alternative: स्पष्ट रूप से ‘परमेश्वर’ जोड़ना
  rationale: यूनानी पाठ दूसरे प्रयोग में कर्ता को सर्वनाम में निहित रखता है। हिन्दी में ‘उसने’ उसी संदर्भ को सुरक्षित रखता है और पाठ में अनुपस्थित नया नाम नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वे दिन’, ‘प्रभु’ और ‘चुने हुए’ जैसे बाइबलीय पद सामान्य पाठक के लिए समझने योग्य हैं। शर्तवाले वाक्य में ‘घटाए न होते’ और ‘न बचता’ से यूनानी के अवास्तविक परिणाम का स्वाभाविक हिन्दी रूप दिया गया है।
