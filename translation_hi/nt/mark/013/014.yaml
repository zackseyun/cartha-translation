reference: Mark 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν δὲ ἴδητε τὸ βδέλυγμα τῆς ἐρημώσεως ⸀ἑστηκότα ὅπου οὐ δεῖ, ὁ ἀναγινώσκων νοείτω, τότε οἱ ἐν τῇ Ἰουδαίᾳ φευγέτωσαν εἰς τὰ ὄρη,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/014.yaml
  text: But when you see the abomination of desolation standing where it ought not to be (let the reader understand)[a], then let those in Judea flee to the mountains[b],
translation:
  language: hi
  text: पर जब तुम “उजाड़ की घृणित वस्तु” को वहाँ खड़ी देखो जहाँ उसे नहीं होना चाहिए—पढ़ने वाला समझ ले[a]—तब जो यहूदिया में हों, वे पहाड़ों की ओर भाग जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘खड़ी’ के लिए आया कृदंत पुल्लिंग है। इसलिए इसका संबंध किसी पुरुष या व्यक्तिगत संदर्भ से भी हो सकता है: “जहाँ उसे [अर्थात् उसे, पुरुष-संदर्भ में] नहीं होना चाहिए।”'
    reason: alternative_reading
  - marker: b
    text: “उजाड़ की घृणित वस्तु” दानिय्येल की भाषा की प्रतिध्वनि है; देखें दानिय्येल 9:27; 11:31; 12:11।
    reason: cross_reference
lexical_decisions:
- source_word: Ὅταν δὲ
  choice: पर जब
  rationale: Ὅταν एक संभावित समय की स्थिति बताता है और δέ पिछले कथन से हल्का संक्रमण करता है; ‘पर जब’ इस प्रवाह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἴδητε
  choice: तुम ... देखो
  rationale: ὁράω के अओरिस्ट सब्जंक्टिव को ὅταν वाले कालवाचक उपवाक्य में हिन्दी में सामान्यतः ‘जब तुम ... देखो’ कहना स्वाभाविक है।
- source_word: τὸ βδέλυγμα τῆς ἐρημώσεως
  choice: “उजाड़ की घृणित वस्तु”
  rationale: यह दानिय्येल से जुड़ी एक विशिष्ट सर्वनाश-संबंधी अभिव्यक्ति है। ‘उजाड़ की घृणित वस्तु’ संबंधवाचक रचना को बनाए रखती है और यह तय नहीं करती कि वह वस्तु उजाड़ लाती है, उजाड़ से संबंधित है, या किसी अन्य अर्थ में कही गई है।
- source_word: ἑστηκότα
  choice: खड़ी
  rationale: ἵστημι का परफेक्ट कृदंत पहले से खड़े किए जाने के फलस्वरूप वर्तमान में खड़े होने की अवस्था दिखाता है। मुख्य पाठ में ‘वस्तु’ के साथ स्वाभाविक हिन्दी स्त्रीलिंग रूप रखा गया है; यूनानी के पुल्लिंग रूप का संकेत पादटिप्पणी में दिया गया है।
- source_word: ὅπου οὐ δεῖ
  choice: जहाँ उसे नहीं होना चाहिए
  rationale: δεῖ यहाँ उचित या आवश्यक होने का भाव देता है। यह अनुवाद निषिद्ध अथवा अनुचित स्थान का अर्थ स्पष्ट रखता है, पर उस स्थान या संदर्भ की पहचान नहीं करता।
- source_word: ὁ ἀναγινώσκων νοείτω
  choice: पढ़ने वाला समझ ले
  rationale: यह पाठक को संबोधित एक कोष्ठकीय आग्रह है। ‘समझ ले’ νοέω की बोध करने की आज्ञा को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: τότε
  choice: तब
  rationale: यह पहले बताए गए संकेत के बाद होने वाली कार्रवाई का परिणामसूचक क्रम दर्शाता है।
- source_word: οἱ ἐν τῇ Ἰουδαίᾳ
  choice: जो यहूदिया में हों
  rationale: यह भौगोलिक क्षेत्र में उपस्थित लोगों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φευγέτωσαν
  choice: वे ... भाग जाएँ
  rationale: तीसरे पुरुष बहुवचन की वर्तमान आज्ञा तत्काल और अत्यावश्यक निर्देश देती है। ‘भाग जाएँ’ हिन्दी में उस आज्ञार्थक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰς τὰ ὄρη
  choice: पहाड़ों की ओर
  rationale: ὄρη का सीधा अर्थ पहाड़ या पर्वतीय क्षेत्र है। ‘पहाड़ों की ओर’ पलायन की दिशा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दानिय्येल से जुड़ी अभिव्यक्ति βδέλυγμα τῆς ἐρημώσεως का अर्थ और ऐतिहासिक संदर्भ
  choice: मुख्य पाठ में “उजाड़ की घृणित वस्तु” रखकर उसके संकेतित व्यक्ति, वस्तु या घटना की पहचान खुली रखी गई है।
  alternative: “उजाड़ने वाली घृणित वस्तु” अथवा “विनाशकारी अपवित्रता”।
  rationale: इस पदबंध का ऐतिहासिक और धर्मवैचारिक संदर्भ विवादित है। संबंधवाचक अनुवाद दानिय्येल की प्रतिध्वनि और मूल की अस्पष्टता को बचाता है तथा कारणसूचक व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- issue: नपुंसकलिंग βδέλυγμα के साथ पुल्लिंग कृदंत ἑστηκότα
  choice: स्वाभाविक हिन्दी के लिए मुख्य पाठ में ‘वस्तु ... खड़ी’ रखा गया है और यूनानी पुल्लिंग से संभव व्यक्तिगत संकेत को पादटिप्पणी में बताया गया है।
  alternative: “जहाँ उसे नहीं होना चाहिए वहाँ वह खड़ा हो” या किसी पुरुष-संदर्भ को मुख्य पाठ में स्पष्ट करना।
  rationale: यूनानी व्याकरण में लिंग का असामंजस्य किसी व्यक्ति या मानवीकृत संदर्भ का संकेत दे सकता है, पर उसे निश्चित नहीं करता। मुख्य पाठ को अस्वाभाविक बनाए बिना वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दानिय्येल-संबंधी विशिष्ट पदबंध को उद्धरण-चिह्नों में रखा गया है ताकि उसके सूत्रवत और अंतर्पाठीय स्वरूप का संकेत मिले। ‘यहूदिया’ और ‘पहाड़ों’ जैसे परिचित बाइबलीय-भौगोलिक शब्द बनाए रखे गए हैं।
