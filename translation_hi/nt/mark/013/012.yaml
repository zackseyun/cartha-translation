source:
  edition: SBLGNT
  text: ⸂καὶ παραδώσει⸃ ἀδελφὸς ἀδελφὸν εἰς θάνατον καὶ πατὴρ τέκνον, καὶ ἐπαναστήσονται τέκνα ἐπὶ γονεῖς καὶ θανατώσουσιν αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/012.yaml
  text: And brother will hand over brother to death[a], and a father his child[b], and children will rise up against parents and put them to death.
translation:
  language: hi
  text: भाई अपने भाई को मारे जाने के लिए सौंप देगा[a], और पिता अपनी संतान को; संतानें माता-पिता के विरुद्ध उठ खड़ी होंगी और उन्हें मार डालेंगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासघात करके पकड़वा देगा।” यूनानी क्रिया का अर्थ “सौंप देना,” “अधिकार में दे देना,” अथवा इस संदर्भ में “विश्वासघात करके पकड़वा देना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्हें मृत्यु के घाट उतारेंगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: παραδώσει
  choice: सौंप देगा
  rationale: यह παραδίδωμι के ठोस अर्थ ‘किसी के अधिकार में दे देना’ को सुरक्षित रखता है। उत्पीड़न के इस संदर्भ में इससे अधिकारियों अथवा मृत्यु के लिए सौंपे जाने का भाव आता है, जबकि मुख्य पाठ में अधिक व्याख्यात्मक ‘विश्वासघात करेगा’ थोपना आवश्यक नहीं है।
- source_word: ἀδελφὸς ἀδελφὸν
  choice: भाई अपने भाई को
  rationale: यूनानी के एकवचन और स्पष्ट पुरुषवाची पारिवारिक संबंध को बनाए रखते हुए ‘अपने’ स्वाभाविक हिन्दी में संबंध को स्पष्ट करता है।
- source_word: εἰς θάνατον
  choice: मारे जाने के लिए
  rationale: यह वाक्यांश सौंपे जाने के लक्ष्य अथवा परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘मृत्यु को’ या ‘मृत्यु के लिए’ की अपेक्षा अधिक सहज है।
- source_word: πατὴρ τέκνον
  choice: पिता अपनी संतान को
  rationale: πατήρ को ‘पिता’ और लिंग की दृष्टि से व्यापक τέκνον को ‘संतान’ कहना मूल के भेद को बनाए रखता है। दूसरे खंड में ‘सौंप देगा’ क्रिया पहले खंड से स्वाभाविक रूप से समझी जाती है।
- source_word: τέκνα
  choice: संतानें
  rationale: यह τέκνα के पारिवारिक और लिंग-व्यापक अर्थ को बनाए रखता है तथा ‘बच्चे’ की तुलना में वयस्क संतान को भी सहजता से समेटता है।
- source_word: ἐπαναστήσονται ἐπὶ
  choice: के विरुद्ध उठ खड़ी होंगी
  rationale: यह शत्रुतापूर्ण ढंग से किसी के विरुद्ध उठने की यूनानी छवि और बल को सुरक्षित रखता है।
- source_word: γονεῖς
  choice: माता-पिता
  rationale: बहुवचन γονεῖς का स्वाभाविक और स्पष्ट हिन्दी समतुल्य है।
- source_word: θανατώσουσιν αὐτούς
  choice: उन्हें मरवा डालेंगी
  rationale: θανατόω किसी को मृत्यु दिलाने अथवा मौत के घाट उतारने का भाव दे सकता है। ‘मरवा डालेंगी’ उत्पीड़न के संदर्भ में यह संभावना बनाए रखता है कि संतानें स्वयं हत्या करें या दूसरों के हाथों मृत्यु दिलाएँ।
theological_decisions:
- issue: प्रतिनिधिक कथन में लिंग-सूचक पारिवारिक शब्द
  choice: ἀδελφός और πατήρ के लिए क्रमशः ‘भाई’ और ‘पिता’ रखा गया है, जबकि व्यापक τέκνον/τέκνα और γονεῖς के लिए ‘संतान/संतानें’ तथा ‘माता-पिता’ हैं।
  alternative: पहले दो खंडों को भी लिंग-निरपेक्ष बनाकर ‘सहोदर’ और ‘माता या पिता’ कहना।
  rationale: मूल में जहाँ शब्द पुरुषवाची हैं वहाँ उस विशिष्टता को, और जहाँ वे व्यापक हैं वहाँ उस व्यापकता को बनाए रखना पाठ में अनावश्यक संकीर्णता या विस्तार जोड़ने से बचाता है।
- issue: परिवार द्वारा मृत्यु दिलाने में प्रत्यक्ष और परोक्ष भूमिका
  choice: ‘मरवा डालेंगी’ रखा गया है।
  alternative: ‘मार डालेंगी।’
  rationale: यूनानी क्रिया परिणामतः मृत्यु कराने पर बल देती है और यह अनिवार्य रूप से तय नहीं करती कि संतानें अपने हाथ से हत्या करेंगी या अधिकारियों के द्वारा करवाएँगी। मुख्य पाठ इस तनाव को खुला रखता है और पादटिप्पणी अधिक प्रत्यक्ष विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘संतान’ पारिवारिक व्यापकता बनाए रखता है; ‘उठ खड़ी होंगी’ मूल की सजीव छवि को स्वाभाविक हिन्दी में व्यक्त करता है। अर्धविराम दूसरे, क्रिया-विहीन खंड को पहले खंड की क्रिया से जोड़ता है।
