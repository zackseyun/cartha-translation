base_translation:
  language: en
  yaml_path: translation/nt/mark/013/037.yaml
  text: 'And what I say to you I say to all: stay awake[a].'
translation:
  language: hi
  text: 'और जो मैं तुमसे कहता हूँ, वही सबसे कहता हूँ: जागते रहो[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहरा देते रहो” या “सचेत रहो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: जो
  rationale: नपुंसकलिंग एकवचन संबंधवाचक सर्वनाम यहाँ संज्ञार्थक है। हिंदी में ‘जो’ स्वाभाविक रूप से ‘जो बात’ का व्यापक, पुनरुक्तिपरक अर्थ व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्का संयोजक है, प्रबल विरोधसूचक नहीं; इसलिए ‘और’ पिछले कथन से सहज संबंध बनाता है।
- source_word: ὑμῖν
  choice: तुमसे
  rationale: यह द्वितीय पुरुष बहुवचन है और तत्काल शिष्यों को संबोधित करता है। ‘तुमसे’ आधुनिक हिंदी में λέγω के साथ स्वाभाविक है।
- source_word: λέγω ... λέγω
  choice: कहता हूँ ... कहता हूँ
  rationale: यूनानी की पुनरावृत्ति को बनाए रखने से कथन की बलाघातपूर्ण संरचना सुरक्षित रहती है।
- source_word: πᾶσιν
  choice: सबसे
  rationale: दत्तिव बहुवचन का व्यापक समावेशी अर्थ संक्षेप में व्यक्त होता है और मूल में निहित सार्वभौमिक विस्तार बना रहता है।
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक निरंतर सजगता का आह्वान करता है। ‘जागते रहो’ संदर्भ के जीवंत रूपक को बनाए रखता है।
theological_decisions:
- issue: यीशु की चेतावनी का दायरा
  choice: शिष्यों से कही गई बात स्पष्ट रूप से सब तक विस्तृत की गई है।
  alternative: इसे कथा के भीतर केवल तत्काल श्रोताओं पर लागू समझा जा सकता है।
  rationale: यूनानी पाठ ‘तुमसे’ और ‘सबसे’ के बीच स्पष्ट विस्तार दिखाता है; अनुवाद इसे न तो सीमित करता है, न इसकी व्याख्या अनावश्यक रूप से बढ़ाता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘वही’ हिंदी में संबंधवाचक-वाक्य की स्वाभाविक पूर्ति करता है, जबकि मूल के ‘जो ... सब’ संबंध और बल को बनाए रखता है।
