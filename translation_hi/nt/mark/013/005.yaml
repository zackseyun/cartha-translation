  text: ὁ δὲ Ἰησοῦς ⸂ἤρξατο λέγειν αὐτοῖς⸃· Βλέπετε μή τις ὑμᾶς πλανήσῃ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/005.yaml
  text: Then Jesus began to say to them[a], “See to it that no one leads you astray.”
translation:
  language: hi
  text: तब यीशु उनसे कहने लगा, “सावधान रहो कि कोई तुम्हें भटका न दे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: तब
  rationale: यह हल्का कथात्मक संयोजक है। ‘तब’ प्रसंग की प्रगति को स्वाभाविक रूप से दिखाता है और अनावश्यक विरोध का भाव नहीं जोड़ता।
- source_word: ἤρξατο λέγειν
  choice: कहने लगा
  rationale: यह यूनानी आरंभसूचक रचना का निकट और स्वाभाविक हिन्दी रूप है; इसमें मूल पाठ में अनुपस्थित ‘उत्तर दिया’ नहीं जोड़ा गया।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: मूल पाठ केवल सर्वनाम प्रयोग करता है। प्रसंग से शिष्य अभिप्रेत हैं, पर मुख्य पाठ में व्याख्यात्मक संज्ञा जोड़ने के बजाय सर्वनाम बनाए रखा गया है।
- source_word: Βλέπετε
  choice: सावधान रहो
  rationale: वर्तमान आज्ञार्थक निरंतर चौकसी की चेतावनी देता है। ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक और गंभीर है।
- source_word: μή τις ὑμᾶς πλανήσῃ
  choice: कि कोई तुम्हें भटका न दे
  rationale: μή के साथ संभावनार्थक क्रिया ऐसी बात से बचने की चेतावनी व्यक्त करती है। ‘भटका न दे’ छल और सही मार्ग से हटा दिए जाने—दोनों भावों को समेटता है।
theological_decisions:
- issue: πλανήσῃ में चेतावनी का स्वरूप
  choice: ऐसे छल से सावधान रहने की चेतावनी जो सही मार्ग से भटका देता है
  alternative: केवल बौद्धिक धोखे के विरुद्ध चेतावनी
  rationale: πλανάω केवल गलत सूचना देने तक सीमित नहीं, बल्कि किसी को मार्ग से भटका देने का व्यापक अर्थ भी रखता है। ‘भटका न दे’ इस नैतिक और दिशात्मक तनाव को बिना अतिरिक्त सिद्धान्त जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। एकवचन ‘तुम’ समूह को संबोधित करने वाली हिन्दी की स्वाभाविक शैली में प्रयुक्त है।
