  text: Ἀπὸ δὲ τῆς συκῆς μάθετε τὴν παραβολήν· ὅταν ⸂ἤδη ὁ κλάδος αὐτῆς⸃ ἁπαλὸς γένηται καὶ ἐκφύῃ τὰ φύλλα, γινώσκετε ὅτι ἐγγὺς τὸ θέρος ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/028.yaml
  text: 'Learn the parable from the fig tree: when its branch has already become tender and puts out leaves[a], you know that summer is near.'
translation:
  language: hi
  text: 'अंजीर के पेड़ से यह दृष्टान्त[a] सीखो: जब उसकी डाल कोमल हो चुकी हो और उस पर पत्ते निकल आते हों, तब तुम जानते हो कि ग्रीष्म निकट है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिक्षा’ अथवा ‘उदाहरण’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀπὸ δὲ τῆς συκῆς
  choice: अंजीर के पेड़ से
  rationale: ἀπό के साथ संबंधकारक सीखने के स्रोत को दर्शाता है। δέ हल्का संयोजक है; हिन्दी में वाक्य को स्वाभाविक रखने के लिए अलग संयोजक जोड़ना आवश्यक नहीं है।
- source_word: μάθετε
  choice: सीखो
  rationale: यह μανθάνω का बहुवचन आज्ञार्थक रूप है और सीधे तौर पर शिक्षा ग्रहण करने का आह्वान करता है।
- source_word: τὴν παραβολήν
  choice: यह दृष्टान्त
  rationale: παραβολή यहाँ अंजीर के पेड़ से ली गई तुलना या शिक्षाप्रद मिसाल है। ‘दृष्टान्त’ सुसमाचारों की प्रमुख शब्दावली से संगति रखते हुए इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅταν
  choice: जब
  rationale: ὅταν के साथ संभावनार्थक क्रिया सामान्य कालगत परिस्थिति बताती है; हिन्दी में ‘जब’ स्वाभाविक है।
- source_word: ἤδη ὁ κλάδος αὐτῆς ἁπαλὸς γένηται
  choice: जब उसकी डाल कोमल हो चुकी होती है
  rationale: ἤδη उस अवस्था के पहले ही आ चुकने का भाव देता है, जिसे ‘हो चुकी होती है’ व्यक्त करता है; ἁπαλός नई बढ़त की कोमलता बताता है।
- source_word: ἐκφύῃ τὰ φύλλα
  choice: उसमें पत्ते निकल आते हैं
  rationale: ἐκφύω पत्तों के फूटने या निकलने को दर्शाता है। हिन्दी में पेड़ की डाल के विषय में ‘उसमें पत्ते निकल आते हैं’ सहज और स्पष्ट है।
- source_word: γινώσκετε
  choice: तुम जान जाते हो
  rationale: यहाँ रूप वर्तमान निर्देशार्थक है, आज्ञार्थक नहीं; संकेत देखकर होने वाली पहचान को ‘जान जाते हो’ व्यक्त करता है।
- source_word: ἐγγὺς τὸ θέρος ἐστίν
  choice: गरमी का मौसम निकट है
  rationale: θέρος का सामान्य अर्थ ग्रीष्म या गरमी का मौसम है और ἐγγύς कालगत निकटता बताता है। यह पाठ अनावश्यक रूप से ‘कटनी’ का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: इस प्रसंग में παραβολή का अर्थ
  choice: मुख्य पाठ में ‘दृष्टान्त’
  alternative: ‘शिक्षा’ या ‘उदाहरण’
  rationale: ‘दृष्टान्त’ यीशु की शिक्षण-शैली से जुड़ी मूल शब्दावली को बनाए रखता है, जबकि पादटिप्पणी इसके व्यापक अर्थ की सूचना देती है और किसी अतिरिक्त रूपकात्मक व्याख्या को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘गरमी का मौसम’ अपेक्षाकृत सामान्य बोलचाल का है, जबकि वाक्य-विन्यास शास्त्रीय गरिमा बनाए रखता है।
