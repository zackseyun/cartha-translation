id: MRK.13.21
reference: Mark 13:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καὶ τότε ἐάν τις ὑμῖν εἴπῃ· ⸀Ἴδε ὧδε ὁ ⸀χριστός, ⸁Ἴδε ἐκεῖ, μὴ πιστεύετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/021.yaml
  text: And then[a], if anyone says to you, ‘Look, here is the Messiah!’ or, ‘Look, there!’ do not believe it.
translation:
  language: hi
  text: और तब यदि कोई तुमसे कहे, “देखो, मसीह[a] यहाँ है!” या, “देखो, वहाँ है!” तो विश्वास मत करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “ख्रीष्ट।”
    reason: Χριστός के परंपरागत लिप्यंतरित विकल्प को दर्ज करने के लिए।
lexical_decisions:
- source_word: καὶ τότε
  choice: और तब
  rationale: ‘और’ पिछले कथन से संबंध बनाए रखता है और ‘तब’ समय-संबंधी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: यदि कोई तुमसे कहे
  rationale: यह सामान्य शर्त व्यक्त करता है; ‘कोई’ अनिश्चित τις को और ‘तुमसे’ बहुवचन ὑμῖν को प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान खींचने वाला सीधा और वर्तमान हिन्दी का उद्गार है।
- source_word: ὧδε
  choice: यहाँ
  rationale: यह निकट स्थान बताने वाले क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ पद निश्चित उपाधि के रूप में अभिषिक्त उद्धारकर्ता के दावे को सूचित करता है; ‘मसीह’ हिन्दी में इसके यहूदी और उपाधिमूलक भाव को स्वाभाविक रूप से रखता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह ‘यहाँ’ के विपरीत दूर स्थान का संक्षिप्त और सटीक संकेत है।
- source_word: μὴ πιστεύετε
  choice: विश्वास मत करना
  rationale: यूनानी में विश्वास की वस्तु अनकही है; हिन्दी में भी उसे अनकहा रखकर यह अस्पष्टता बनी रहती है कि निषेध वक्ता पर विश्वास करने का है या उसके दावे पर।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: इस अंतकालीन प्रसंग में Χριστός नाम-सदृश प्रयोग नहीं, बल्कि निश्चित उपाधि है। ‘मसीह’ उस उपाधिमूलक अर्थ को रखता है; परंपरागत विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘देखो’ दावे की तात्कालिकता व्यक्त करता है, और दूसरे कथन में यूनानी की तरह ‘मसीह है’ को दोहराए बिना संक्षिप्तता बनाए रखी गई है।
