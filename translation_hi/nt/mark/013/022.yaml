  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐγερθήσονται γὰρ ψευδόχριστοι καὶ ψευδοπροφῆται καὶ δώσουσιν σημεῖα καὶ τέρατα πρὸς τὸ ἀποπλανᾶν εἰ ⸀δυνατὸν τοὺς ἐκλεκτούς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/022.yaml
  text: For false messiahs and false prophets will arise and will give signs and wonders in order to lead astray[a], if possible[c][b], the elect.
translation:
  language: hi
  text: क्योंकि झूठे मसीह[a] और झूठे भविष्यद्वक्ता उठ खड़े होंगे और चिन्ह तथा अद्भुत काम दिखाएँगे, ताकि यदि संभव हो[b], चुने हुओं को भटका दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झूठे ख्रीस्त।’ यहाँ यूनानी शब्द ‘ख्रीस्त’ से बना है, जो उपाधि के रूप में ‘मसीह’ का अर्थ देता है।
    reason: alternative_reading
  - marker: b
    text: या ‘यदि ऐसा संभव होता।’ यूनानी शब्दावली स्पष्ट रूप से यह तय नहीं करती कि चुने हुए वास्तव में भटकाए जा सकते हैं या नहीं; वह भटकाने वालों का उद्देश्य बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγερθήσονται
  choice: उठ खड़े होंगे
  rationale: यहाँ भविष्यकालीन कर्मवाच्य रूप व्यक्तियों के उभरने या सामने आने के अर्थ में मुहावरेदार है। ‘उठ खड़े होंगे’ चेतावनी के भाव को बनाए रखता है और किसी विशेष दैवी कर्ता का संकेत नहीं जोड़ता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण या व्याख्या प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका संबंध स्पष्ट और स्वाभाविक बनाता है।
- source_word: ψευδόχριστοι
  choice: झूठे मसीह
  rationale: यौगिक शब्द में Χριστός उपाधि के रूप में ‘मसीह’ है। ‘झूठे मसीह’ यहूदी मसीहाई संदर्भ और बहुवचन दोनों को स्पष्ट रखता है।
- source_word: ψευδοπροφῆται
  choice: झूठे भविष्यद्वक्ता
  rationale: यह यौगिक संज्ञा का मानक, स्पष्ट और सहज हिन्दी रूप है।
- source_word: δώσουσιν σημεῖα καὶ τέρατα
  choice: चिन्ह तथा अद्भुत काम दिखाएँगे
  rationale: ग्रीक में क्रिया का शाब्दिक अर्थ ‘देंगे’ है, पर हिन्दी में चिन्हों और अद्भुत कामों के साथ ‘दिखाएँगे’ अधिक स्वाभाविक है और असाधारण प्रदर्शनों का आशय सुरक्षित रखता है।
- source_word: πρὸς τὸ ἀποπλανᾶν
  choice: ताकि … भटका दें
  rationale: यह रचना उद्देश्य व्यक्त करती है। ‘भटका दें’ केवल मानसिक छल नहीं, बल्कि सत्य के मार्ग से दूर ले जाने की छवि भी बनाए रखता है।
- source_word: εἰ δυνατόν
  choice: यदि सम्भव हो
  rationale: यह ग्रीक की संक्षिप्त शर्त को सीधे व्यक्त करता है और इस प्रश्न का निर्णय नहीं करता कि चुने हुए वास्तव में भटकाए जा सकते हैं या नहीं।
- source_word: τοὺς ἐκλεκτούς
  choice: चुने हुओं
  rationale: यह ἐκλεκτούς का सहज हिन्दी रूप है और किसी विशिष्ट सम्प्रदायगत व्याख्या को जोड़े बिना चुने जाने का धार्मिक महत्व बनाए रखता है।
theological_decisions:
- issue: ψευδόχριστοι में Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: झूठे मसीह
  alternative: झूठे ख्रीस्त
  rationale: इस प्रसंग में शब्द कथित मसीहाई दावेदारों को सूचित करता है; इसलिए ‘मसीह’ अर्थ और यहूदी संदर्भ को अधिक स्पष्ट रखता है।
- issue: εἰ δυνατόν से चुने हुओं के भटकाए जा सकने की सम्भावना
  choice: यदि सम्भव हो
  alternative: यदि ऐसा सम्भव होता
  rationale: ग्रीक शर्त रखता है, पर स्वयं स्पष्ट रूप से यह तय नहीं करता कि उसका पूरा होना सम्भव है या असम्भव। चुना हुआ रूप इसी धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘झूठे मसीह’, ‘भविष्यद्वक्ता’, ‘चिन्ह’ और ‘चुने हुए’ जैसे परिचित बाइबलीय पद बनाए गए हैं; वाक्य-विन्यास हिन्दी के स्वाभाविक प्रवाह के अनुसार है, जबकि ‘यदि सम्भव हो’ की मूल अस्पष्टता सुरक्षित है।
