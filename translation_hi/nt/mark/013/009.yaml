source:
  edition: SBLGNT
  text: βλέπετε δὲ ὑμεῖς ἑαυτούς· ⸀παραδώσουσιν ὑμᾶς εἰς συνέδρια καὶ εἰς συναγωγὰς δαρήσεσθε καὶ ἐπὶ ἡγεμόνων καὶ βασιλέων σταθήσεσθε ἕνεκεν ἐμοῦ εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/009.yaml
  text: But watch yourselves. They will hand you over to councils[a], and you will be beaten in synagogues, and you will stand before governors and kings because of me, as a testimony to them.
translation:
  language: hi
  text: पर तुम स्वयं सावधान रहो। लोग तुम्हें परिषदों के हवाले कर देंगे, और आराधनालयों में तुम्हें पीटा जाएगा। मेरे कारण तुम राज्यपालों और राजाओं के सामने खड़े किए जाओगे, उनके लिए गवाही के रूप में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके लिए एक साक्ष्य के रूप में’; ‘उनके विरुद्ध गवाही’ का अर्थ भी संभव है।
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε δὲ ὑμεῖς ἑαυτούς
  choice: पर तुम अपने विषय में सावधान रहो
  rationale: वर्तमान आज्ञार्थक निरंतर सतर्कता का आह्वान करता है; स्पष्ट कर्ता और आत्मवाचक रूप का बल ‘तुम अपने विषय में’ से सुरक्षित रखा गया है।
- source_word: παραδώσουσιν
  choice: हवाले कर देंगे
  rationale: सताव और न्यायिक संदर्भ में इसका अर्थ अधिकारियों के अधिकार में सौंपना है; ‘हवाले करना’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: συνέδρια
  choice: महासभाओं
  rationale: बहुवचन स्थानीय यहूदी शासकीय या न्यायिक परिषदों को सूचित कर सकता है; ‘महासभाओं’ बहुवचन को बनाए रखता और केवल यरूशलेम की एक महासभा तक सीमित नहीं करता।
- source_word: συναγωγάς
  choice: आराधनालयों
  rationale: यह यहूदी सभास्थल और वहाँ की संस्थागत व्यवस्था दोनों के लिए प्रचलित, बोधगम्य हिन्दी पद है।
- source_word: δαρήσεσθε
  choice: तुम्हें पीटा जाएगा
  rationale: भविष्यत् कर्मवाच्य शारीरिक मार को व्यक्त करता है; ‘पीटा जाएगा’ किसी विशिष्ट दंड-साधन का अनावश्यक अनुमान नहीं लगाता।
- source_word: ἐπὶ ἡγεμόνων καὶ βασιλέων
  choice: राज्यपालों और राजाओं के सामने
  rationale: पदाधिकारियों के समक्ष औपचारिक उपस्थिति का भाव व्यक्त होता है और दोनों अलग पद सुरक्षित रहते हैं।
- source_word: σταθήσεσθε
  choice: खड़े किए जाओगे
  rationale: भविष्यत् कर्मवाच्य होने के कारण बाध्य होकर अधिकारियों के सामने प्रस्तुत किए जाने का भाव ‘खड़े किए जाओगे’ से स्पष्ट रहता है।
- source_word: ἕνεκεν ἐμοῦ
  choice: मेरे कारण
  rationale: यीशु से संबंध ही सताव का कारण है; यह आधुनिक, सीधा और स्वाभाविक प्रयोग है।
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ताकि उनके लिए गवाही हो सके
  rationale: εἰς उद्देश्य अथवा परिणाम और μαρτύριον गवाही को व्यक्त करता है। ‘उनके लिए’ αὐτοῖς की दिशात्मक व्यापकता बनाए रखता है और ‘उनके विरुद्ध’ का न्यायात्मक अर्थ मुख्य पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς में गवाही की दिशा और बल
  choice: शासकों के सामने चेलों की उपस्थिति उनके लिए गवाही का अवसर या साधन बनती है।
  alternative: यह गवाही उन शासकों के विरुद्ध दोष सिद्ध करने वाली गवाही है।
  rationale: αὐτοῖς स्वयं विरोधात्मक अर्थ को अनिवार्य नहीं करता। इसलिए मुख्य पाठ व्यापक ‘उनके लिए’ रखता है, जबकि संभावित न्यायात्मक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। न्यायिक और धार्मिक संस्थाओं के लिए परिचित शब्द चुने गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के साथ यूनानी पाठ की कर्मवाच्यता, बहुवचन और गवाही-वाक्यांश की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
