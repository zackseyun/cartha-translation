  text: ἀμὴν λέγω ὑμῖν ὅτι οὐ μὴ παρέλθῃ ἡ γενεὰ αὕτη μέχρις οὗ ⸂ταῦτα πάντα⸃ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/030.yaml
  text: Truly I say to you that this generation will certainly not pass away until all these things happen[a][b].
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ कि जब तक ये सब बातें घटित न हो जाएँ, तब तक यह पीढ़ी निश्चय ही समाप्त नहीं होगी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये लोग” अथवा “यह जाति”; यूनानी γενεά के अर्थ व्यापक हो सकते हैं, हालाँकि यहाँ “पीढ़ी” सबसे स्वाभाविक अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: “निश्चय ही समाप्त नहीं होगी” यूनानी के अत्यंत प्रबल निषेध को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह यीशु के गंभीर और अधिकारपूर्ण कथन का परिचायक है; ‘सच’ आधुनिक हिन्दी में स्वाभाविक है और सूत्र का बल बनाए रखता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन को निकटता से और स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: οὐ μὴ παρέλθῃ
  choice: निश्चय ही समाप्त नहीं होगी
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘निश्चय ही ... नहीं’ व्यक्त करता है; παρέρχομαι का यहाँ पीढ़ी के बीत जाने या समाप्त हो जाने का भाव है।
- source_word: ἡ γενεὰ αὕτη
  choice: यह पीढ़ी
  rationale: तात्कालिक काल-संदर्भ में γενεά का सबसे स्वाभाविक अर्थ ‘पीढ़ी’ है; यह विवादित व्याख्यात्मक तनाव को हल किए बिना सुरक्षित रखता है।
- source_word: μέχρις οὗ
  choice: जब तक ... तब तक
  rationale: यह समय की सीमा बताता है; हिन्दी में सहसंबंधी रचना अर्थ को स्पष्ट और स्वाभाविक बनाती है।
- source_word: ταῦτα πάντα
  choice: ये सब बातें
  rationale: बहुवचन संकेतवाचक और πᾶς दोनों को स्पष्ट रखता है तथा पूर्वोक्त घटनाओं की ओर संकेत करता है।
- source_word: γένηται
  choice: पूरी हो जाएँ
  rationale: इस भविष्यसूचक संदर्भ में γίνομαι घटनाओं के घटित या संपन्न होने को दर्शाता है; ‘पूरी हो जाएँ’ स्वाभाविक हिन्दी है, यद्यपि ‘घटित हो जाएँ’ अधिक शब्दानुगामी विकल्प है।
theological_decisions:
- issue: अंत-काल संबंधी कथन में ἡ γενεὰ αὕτη का अर्थ
  choice: ‘यह पीढ़ी’ के रूप में सीधा अनुवाद
  alternative: ‘ये लोग/यह जाति’ अथवा चिन्हों को देखने वाली भावी पीढ़ी
  rationale: यूनानी पदबंध का सबसे स्वाभाविक अर्थ ‘यह पीढ़ी’ है। अर्थ को किसी विशेष अंत-काल संबंधी व्यवस्था के अनुसार तय करने के बजाय मूल पाठ का तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘सच कहता हूँ’ पारंपरिक धार्मिक सूत्र से परिचित रहते हुए भी वर्तमान प्रयोग में स्वाभाविक है।
