review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal clause, the plural ‘wars,’ the broad sense of ἀκοὰς as reports/news, the prohibition against alarm, the necessity in δεῖ γενέσθαι, and the qualification that the end is not yet. The final Hindi future ‘नहीं होगा,’ however, slightly recasts the Greek’s elliptical present-state assertion (‘not yet the end’).
  naturalness: The draft is generally clear, but ‘युद्धों और युद्धों की खबरें’ is unnecessarily repetitive in modern Hindi, and ‘जब ... सुनो’ is less idiomatic here than a future temporal clause. The revision keeps the meaning while reading more naturally.
  terminology: ‘युद्ध,’ ‘समाचार,’ ‘घबराओ मत,’ ‘आवश्यक,’ and ‘अन्त’ are suitable modern-standard Hindi choices. ‘अन्त’ retains the eschatological reference without imposing a particular interpretation. The footnote appropriately preserves ‘अफ़वाहें’ as a lexical alternative.
  issues:
  - severity: low
    issue: The phrase ‘युद्धों और युद्धों की खबरें’ is stylistically repetitive.
    rationale: Although literal, it is awkward in contemporary Hindi. ‘युद्धों और उनके समाचार’ conveys the same relation without obscuring the distinction between wars and reports concerning wars.
  - severity: low
    issue: ‘पर अन्त अभी नहीं होगा’ changes the source’s ‘not yet the end’ into an explicitly future formulation.
    rationale: The sense is close, but ‘पर अभी अन्त नहीं है’ more directly preserves the Greek elliptical assertion and οὔπω (‘not yet’).
  - severity: low
    issue: ‘जब ... सुनो’ is less natural than a future temporal construction in this context.
    rationale: The Greek aorist subjunctive under ὅταν is future-oriented. ‘जब ... सुनोगे’ is idiomatic Hindi and preserves that contingency.
  revised_text: और जब तुम युद्धों और उनके समाचारों[a] को सुनोगे, तो घबराओ मत; इन बातों का होना आवश्यक है, पर अभी अन्त नहीं है।
