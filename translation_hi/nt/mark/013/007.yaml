  rationale: The revision improves idiomatic modern Hindi, avoids needless repetition, and renders the final clause more closely as ‘the end is not yet,’ while retaining the source’s ambiguity and the force of necessity without adding an interpretive theological framework. The existing footnote anchor and lexical alternative are retained.
