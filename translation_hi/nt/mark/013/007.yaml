  text: ὅταν δὲ ⸀ἀκούσητε πολέμους καὶ ἀκοὰς πολέμων, μὴ θροεῖσθε· ⸀δεῖ γενέσθαι, ἀλλ’ οὔπω τὸ τέλος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/007.yaml
  text: And when you hear of wars and reports of wars[a], do not be alarmed; these things must happen, but the end is not yet.
translation:
  language: hi
  text: और जब तुम युद्धों और उनके समाचारों[a] को सुनोगे, तो घबराओ मत; इन बातों का होना आवश्यक है, पर अभी अन्त नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्धों की अफ़वाहें।” यूनानी शब्द युद्धों के बारे में सुनी गई खबरों, समाचारों या अफ़वाहों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν δὲ
  choice: और जब
  rationale: ὅταν भविष्य-संदर्भ में समयगत परिस्थिति व्यक्त करता है, और δέ हल्का संयोजक है। ‘और जब’ प्रसंग का स्वाभाविक प्रवाह बनाए रखता है।
- source_word: ἀκούσητε
  choice: तुम ... सुनो
  rationale: ὅταν के साथ प्रयुक्त एओरिस्ट सब्जंक्टिव को हिन्दी में भविष्य-संदर्भ वाले सामान्य समयवाचक रूप ‘जब ... सुनो’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: πολέμους
  choice: युद्धों
  rationale: πόλεμος के बहुवचन का सीधा और मानक हिन्दी रूप।
- source_word: ἀκοὰς πολέμων
  choice: युद्धों की खबरें
  rationale: ἀκοή यहाँ सुनी गई खबर, समाचार या चर्चा को सूचित कर सकता है। ‘खबरें’ आधुनिक हिन्दी में व्यापक और सहज है तथा आवश्यक रूप से अपुष्ट अफ़वाह का अर्थ नहीं लगाता।
- source_word: μὴ θροεῖσθε
  choice: घबराना मत
  rationale: θροέομαι व्याकुल, आतंकित या घबराया हुआ होने का भाव देता है। ‘घबराना मत’ साधारण आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: δεῖ γενέσθαι
  choice: इन बातों का होना अवश्य है
  rationale: δεῖ की आवश्यकता और γενέσθαι के ‘घटित होना’ वाले अर्थ को सुरक्षित रखता है। ‘इन बातों’ से निकटवर्ती युद्धों और उनकी खबरों की ओर संकेत स्पष्ट होता है, बिना आवश्यकता के कारण को निर्धारित किए।
- source_word: ἀλλ’ οὔπω τὸ τέλος
  choice: पर अन्त अभी नहीं होगा
  rationale: οὔπω का ‘अभी नहीं’ और τέλος का युगान्त-संबंधी ‘अन्त’ सुरक्षित है। हिन्दी में भविष्यगत प्रसंग के कारण ‘नहीं होगा’ स्वाभाविक है।
theological_decisions:
- issue: δεῖ γενέσθαι में युगान्त-संबंधी आवश्यकता
  choice: ‘होना अवश्य है’ के द्वारा आवश्यकता को स्पष्ट रखना
  alternative: ‘होंगी’ या ‘होना ही है’
  rationale: मूल पाठ घटना की आवश्यकता बताता है, पर उसका तंत्र या विस्तृत अन्त-समय व्यवस्था नहीं समझाता। ‘अवश्य है’ इस बल को बनाए रखता है; ‘होना ही है’ अनावश्यक रूप से अधिक नियतिवादी सुन सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘अन्त’ को युगान्त-संबंधी संकेत के रूप में खुला रखा गया है और किसी विशिष्ट अन्त-समय मत को पाठ में नहीं जोड़ा गया।
