  text: ⸀πολλοὶ ἐλεύσονται ἐπὶ τῷ ὀνόματί μου λέγοντες ὅτι Ἐγώ εἰμι, καὶ πολλοὺς πλανήσουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/006.yaml
  text: Many will come in my name[a], saying, ‘I am he,’ and they will lead many astray.
translation:
  language: hi
  text: बहुत-से लोग मेरे नाम से आएँगे और कहेंगे, ‘मैं वही हूँ,’[a] और वे बहुतों को भटका देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, ‘मैं हूँ।’ यूनानी में विधेय स्पष्ट रूप से नहीं दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और अनिश्चित रूप से बड़ी संख्या में व्यक्तियों को दर्शाता है; ‘बहुत-से लोग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἐλεύσονται
  choice: आएँगे
  rationale: ἔρχομαι के भविष्यत् रूप का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: ἐπὶ τῷ ὀνόματί μου
  choice: मेरे नाम से
  rationale: यह पदबंध यीशु के नाम का दावा करके अथवा उससे अधिकार या संबंध जताते हुए आने का भाव रखता है; ‘मेरे नाम से’ इस अर्थ-व्याप्ति को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: λέγοντες
  choice: और कहेंगे
  rationale: कृदन्त आने के साथ घटने वाली वाणी को व्यक्त करता है; हिन्दी में समन्वित क्रिया-वाक्य अधिक स्वाभाविक है।
- source_word: ὅτι Ἐγώ εἰμι
  choice: ‘मैं वही हूँ’
  rationale: यूनानी में विधेय व्यक्त नहीं है। प्रसंग में यह यीशु की पहचान या भूमिका का दावा है; ‘वही’ हिन्दी में निहित विधेय को सहज रूप से व्यक्त करता है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: πολλοὺς
  choice: बहुतों को
  rationale: यह क्रिया का कर्म है; ‘बहुतों को’ संक्षिप्त, स्वाभाविक और आरम्भिक πολλοὶ के अनुरूप है।
- source_word: πλανήσουσιν
  choice: भटका देंगे
  rationale: πλανάω किसी को सत्य या सही मार्ग से भटकाने का अर्थ देता है; यह चयन मूल के मार्ग से विचलित करने वाले रूपक को बनाए रखता है।
theological_decisions:
- issue: झूठे दावेदारों के प्रसंग में Ἐγώ εἰμι का अनुवाद
  choice: मैं वही हूँ
  alternative: मैं हूँ
  rationale: प्रसंग में वक्ता यीशु के नाम से आकर उसकी पहचान या भूमिका पर दावा करते हैं। ‘मैं वही हूँ’ निहित दावे को स्वाभाविक हिन्दी में व्यक्त करता है, पर यूनानी में विधेय न होने के कारण अधिक शाब्दिक और खुला पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भटका देंगे’ सामान्य पाठक के लिए सहज है और मूल रूपक को भी बनाए रखता है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
