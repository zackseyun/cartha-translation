  text: καὶ ἔσεσθε μισούμενοι ὑπὸ πάντων διὰ τὸ ὄνομά μου. ὁ δὲ ὑπομείνας εἰς τέλος οὗτος σωθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/013.yaml
  text: And you will be hated by all because of my name[d][c][b][a]. But the one who endures to the end will be saved.
translation:
  language: hi
  text: और मेरे नाम के कारण सब लोग तुमसे घृणा करेंगे। लेकिन जो अंत तक धीरज धरेगा, वही उद्धार पाएगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो अंत तक दृढ़ बना रहेगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “वही बचाया जाएगा” अथवा “वही छुटकारा पाएगा।” यूनानी शब्द बचाव और उद्धार—दोनों अर्थ दे सकता है; प्रसंग इसकी पूरी अर्थ-छाया को खुला छोड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μισούμενοι ὑπὸ πάντων
  choice: सब लोग तुमसे घृणा करेंगे
  rationale: ἔσεσθε के साथ μισούμενοι भविष्यकालीन भाव देता है। कर्तृवाच्य हिंदी अधिक स्वाभाविक है और πάντων की व्यापकता को बनाए रखती है।
- source_word: διὰ τὸ ὄνομά μου
  choice: मेरे नाम के कारण
  rationale: διά के साथ कर्मकारक कारण व्यक्त करता है। ‘नाम’ को बनाए रखने से यीशु के व्यक्तित्व, अधिकार और उनके प्रति निष्ठा का बाइबलीय भाव खुला रहता है।
- source_word: ὁ δὲ ὑπομείνας
  choice: लेकिन जो ... धीरज धरेगा
  rationale: संज्ञार्थक कृदंत उस व्यक्ति को बताता है जो दबाव में स्थिर बना रहता है। ‘धीरज धरेगा’ आधुनिक हिंदी में स्वाभाविक है और सहते रहने का भाव देता है।
- source_word: εἰς τέλος
  choice: अंत तक
  rationale: यह किसी अंतिम बिंदु तक बने रहने को दर्शाता है, पर यह तय नहीं करता कि वह संकट का अंत, जीवन का अंत या युगांत है।
- source_word: οὗτος
  choice: वही
  rationale: पुनरुक्त सर्वनाम का जोर हिंदी के स्वाभाविक ‘वही’ से सुरक्षित रहता है, बिना यूनानी वाक्य-विन्यास की असहज नकल किए।
- source_word: σωθήσεται
  choice: उद्धार पाएगा
  rationale: σῴζω बचाए जाने या छुटकारा पाने दोनों का अर्थ दे सकता है। ‘उद्धार पाएगा’ इसके व्यापक और धर्मवैचारिक भार को सुरक्षित रखता है।
theological_decisions:
- issue: σωθήσεται का आशय
  choice: उद्धार पाएगा
  alternative: बचाया जाएगा / छुटकारा पाएगा
  rationale: प्रसंग सताव में धीरज को अंतिम उद्धार से जोड़ता है, पर यूनानी शब्द को केवल सांसारिक रक्षा या किसी विशिष्ट सांप्रदायिक सिद्धांत तक सीमित नहीं करता।
- issue: πάντων का दायरा
  choice: सब लोग
  alternative: सभी के द्वारा
  rationale: मूल की व्यापक और तीखी अभिव्यक्ति को बिना नरम या सीमित किए रखा गया है; उसके प्रसंगगत आलंकारिक दायरे का निर्णय पाठक पर छोड़ा गया है।
- issue: धीरज और उद्धार का संबंध
  choice: मूल कथन के क्रम और तनाव को यथावत रखा
  alternative: धीरज को उद्धार का तकनीकी कारण या केवल प्रमाण बताना
  rationale: वचन दोनों को निकटता से जोड़ता है, किंतु उनके संबंध को किसी विशिष्ट धर्मवैचारिक सूत्र में स्पष्ट नहीं करता; अनुवाद भी ऐसा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक पठन में स्वाभाविक। ‘वही’ से οὗτος का जोर रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
