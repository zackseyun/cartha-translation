  yaml_path: translation/nt/mark/013/001.yaml
  text: And as he was going out of the temple[a], one of his disciples says to him, “Teacher[b], look—what wonderful stones and what wonderful buildings!”
translation:
  language: hi
  text: जब वह मंदिर-परिसर[a] से बाहर निकल रहा था, तो उसके शिष्यों में से एक उससे कहता है, “गुरु, देखिए, कैसे अद्भुत पत्थर और कैसी अद्भुत इमारतें हैं!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν पूरे मंदिर-परिसर या उसके अहाते को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ
  choice: जब वह ... बाहर निकल रहा था
  rationale: वर्तमान कृदन्त वाली सम्बन्धवाचक निरपेक्ष रचना साथ-साथ चल रही क्रिया को व्यक्त करती है; यह हिन्दी रूप उसकी जारी अवस्था को स्वाभाविक ढंग से बनाए रखता है।
- source_word: τοῦ ἱεροῦ
  choice: मन्दिर-परिसर
  rationale: ἱερόν केवल भीतरी पवित्र भवन नहीं, बल्कि पूरे मन्दिर-क्षेत्र को सूचित करता है; इसलिए ‘मन्दिर-परिसर’ अधिक सटीक है।
- source_word: λέγει
  choice: कहता है
  rationale: मरकुस के ऐतिहासिक वर्तमान को वर्तमान काल में रखा गया है, जिससे वृत्तान्त की सजीवता बनी रहती है।
- source_word: εἷς τῶν μαθητῶν αὐτοῦ
  choice: उसके शिष्यों में से एक
  rationale: मूल के अंशवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में Διδάσκαλος का स्वाभाविक, प्रतिष्ठित और सामान्य हिन्दी पर्याय; यहाँ इसका अर्थ शिक्षक है।
- source_word: ἴδε
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाली आज्ञा को गुरु के प्रति शिष्य के सम्मानानुकूल हिन्दी में व्यक्त किया गया है।
- source_word: ποταποὶ ... καὶ ποταπαὶ
  choice: कैसे विशाल ... और कैसी भव्य ...
  rationale: ποταπός यहाँ विस्मय और प्रशंसा प्रकट करता है। संज्ञाओं के अनुसार ‘विशाल’ पत्थरों के आकार और ‘भव्य’ इमारतों के प्रभाव को स्वाभाविक हिन्दी में सामने लाते हैं, बिना प्रशंसात्मक भाव खोए।
- source_word: λίθοι
  choice: पत्थर
  rationale: मन्दिर के निर्माण में लगे बड़े पत्थरों का सीधा अर्थ।
- source_word: οἰκοδομαί
  choice: इमारतें
  rationale: मन्दिर-परिसर की अनेक निर्मित संरचनाओं के लिए स्पष्ट और सामान्य आधुनिक हिन्दी शब्द।
