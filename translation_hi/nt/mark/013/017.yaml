  text: But woe to those who are pregnant and to those who are nursing infants in those days[a][b].
translation:
  language: hi
  text: परन्तु उन दिनों गर्भवती स्त्रियों और दूध पिलानेवाली स्त्रियों के लिए हाय!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ
  choice: हाय
  rationale: यह शब्द आनेवाले संकट के कारण शोक और चेतावनी की भविष्यवाणी-सदृश तीव्रता व्यक्त करता है; हिन्दी में संक्षिप्त और गंभीर समतुल्य है।
- source_word: δὲ
  choice: पर
  rationale: पिछली चेतावनी से हल्का संक्रमण और प्रसंग का विकास दिखाता है, बिना प्रबल विरोध का अर्थ थोपे।
- source_word: ταῖς ἐν γαστρὶ ἐχούσαις
  choice: गर्भवती स्त्रियों
  rationale: यूनानी मुहावरे का स्वाभाविक आधुनिक हिन्दी अर्थ देता है और स्त्रीलिंग बहुवचन संदर्भ को स्पष्ट रखता है।
- source_word: θηλαζούσαις
  choice: दूध पिलानेवाली स्त्रियों
  rationale: शिशु को स्तनपान कराने का आशय स्वाभाविक, सम्मानजनक और सामान्य हिन्दी में व्यक्त करता है; यूनानी में कर्म निहित है।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: सीधा और स्वाभाविक कालवाचक पद है, जो आसपास के प्रसंग से संबंध बनाए रखता है।
theological_decisions:
- issue: οὐαί का भाव
  choice: इसे आनेवाले संकट पर शोक और चेतावनी व्यक्त करनेवाले विस्मयादिबोधक रूप में रखा गया है।
  alternative: इसे प्रभावित स्त्रियों की निंदा या उन पर शाप के रूप में प्रस्तुत करना।
  rationale: प्रसंग में कठिन परिस्थितियों के कारण उनकी दुर्दशा पर विलाप है; पाठ उन्हें नैतिक दोषी नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गंभीर और मौखिक रूप से सहज। ‘दूध पिलानेवाली’ सामान्य पाठक के लिए ‘स्तनपान करानेवाली’ से कम चिकित्सकीय और अधिक स्वाभाविक है।
