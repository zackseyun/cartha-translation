source:
  edition: SBLGNT
  text: Ἀλλὰ ἐν ἐκείναις ταῖς ἡμέραις μετὰ τὴν θλῖψιν ἐκείνην ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/024.yaml
  text: But in those days[a], after that tribulation, the sun will be darkened, and the moon will not give its light,
translation:
  language: hi
  text: पर उन दिनों में, उस क्लेश[a] के बाद, सूर्य अंधकारमय हो जाएगा और चन्द्रमा अपना प्रकाश नहीं देगा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस संकट के बाद” अथवा “उस पीड़ा के बाद।”
    reason: θλῖψις के वैध अर्थ-विकल्पों को दिखाना और मूल की अर्थ-व्याप्ति को खुला रखना।
lexical_decisions:
- source_word: Ἀλλὰ
  choice: पर
  rationale: यह पिछले कथन से प्रबल विरोध अथवा नए मोड़ को दिखाता है; आधुनिक हिन्दी में ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों में
  rationale: यह यूनानी कालवाचक अभिव्यक्ति की संरचना और उसके भविष्यसूचक स्वर, दोनों को बनाए रखता है।
- source_word: μετὰ τὴν θλῖψιν ἐκείνην
  choice: उस क्लेश के बाद
  rationale: μετά यहाँ कालवाचक ‘के बाद’ है। θλῖψις के लिए ‘क्लेश’ प्रसंग की गंभीरता बनाए रखता है, जबकि ἐκείνην की विशिष्टता ‘उस’ से व्यक्त होती है।
- source_word: ὁ ἥλιος σκοτισθήσεται
  choice: सूर्य अंधकारमय हो जाएगा
  rationale: यह भावी निष्क्रिय रूप का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है और कर्ता को अनिर्दिष्ट ही रहने देता है।
- source_word: ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς
  choice: चन्द्रमा अपना प्रकाश नहीं देगा
  rationale: ‘अपना प्रकाश नहीं देगा’ मूल की सजीव छवि और δίδωμι के ‘देना’ अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रलय-विषयक कथन में θλῖψις का अनुवाद
  choice: क्लेश
  alternative: संकट; पीड़ा
  rationale: ‘क्लेश’ शब्द प्रसंग की तीव्रता और धर्मग्रन्थीय प्रतिध्वनि को बनाए रखता है, पर किसी विशेष अंत-समय संबंधी व्यवस्था को पाठ में नहीं जोड़ता। विकल्प पादटिप्पणी में दिए गए हैं।
- issue: σκοτισθήσεται में निहित कर्ता
  choice: अंधकारमय हो जाएगा
  alternative: अंधकारमय कर दिया जाएगा
  rationale: मूल निष्क्रिय रूप कार्य करने वाले को स्पष्ट नहीं करता। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए किसी कर्ता का नाम जोड़ने से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चन्द्रमा’ और ‘अंधकारमय’ भविष्यसूचक कथन की गंभीर शैली के अनुकूल हैं; अनावश्यक तकनीकी या सम्प्रदायगत शब्दावली से बचा गया है।
