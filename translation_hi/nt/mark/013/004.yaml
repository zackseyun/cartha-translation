  text: Εἰπὸν ἡμῖν πότε ταῦτα ἔσται, καὶ τί τὸ σημεῖον ὅταν μέλλῃ ⸂ταῦτα συντελεῖσθαι πάντα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/004.yaml
  text: Tell us[a], when will these things be, and what will be the sign when all these things are about to be accomplished?
translation:
  language: hi
  text: “हमें बताइए, ये बातें कब होंगी, और जब ये सब बातें पूरी होने को होंगी[a], तब क्या चिन्ह होगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब ये सब बातें पूरी होंगी।” यूनानी में μέλλῃ के साथ infinitive प्रयुक्त है, जिसका अधिक विशिष्ट अर्थ “पूरी होने को होंगी” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰπὸν ἡμῖν
  choice: हमें बताइए
  rationale: आज्ञार्थक रूप को प्रसंगानुसार आदरयुक्त अनुरोध के रूप में स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ἡμῖν का अप्रत्यक्ष कर्म ‘हमें’ सुरक्षित है।
- source_word: πότε ταῦτα ἔσται
  choice: ये बातें कब होंगी
  rationale: ταῦτα के बहुवचन और पिछले कथन से उसके संबंध को बनाए रखता है; ἔσται का निकट और स्वाभाविक रूप ‘होंगी’ है।
- source_word: σημεῖον
  choice: चिन्ह
  rationale: σημεῖον के लिए मानक बाइबिलीय हिन्दी शब्द है और आने वाली घटना का संकेत व्यक्त करता है।
- source_word: ὅταν μέλλῃ ταῦτα συντελεῖσθαι πάντα
  choice: जब ये सब बातें पूरी होने को होंगी
  rationale: ‘होने को’ μέλλῃ के आसन्न या निकट संभावित कार्य के भाव को बनाए रखता है; ‘पूरी’ συντελεῖσθαι के निष्पन्नता और पूर्णता के भाव को बिना ‘भविष्यवाणी पूरी होने’ का अतिरिक्त अर्थ जोड़े व्यक्त करता है।
- source_word: πάντα
  choice: सब
  rationale: πάντα की समावेशी शक्ति को ‘ये सब बातें’ में स्वाभाविक हिन्दी क्रम के साथ सुरक्षित रखता है।
theological_decisions:
- issue: μέλλῃ और infinitive का युगांत-संबंधी भाव
  choice: ‘पूरी होने को होंगी’ द्वारा आसन्नता का भाव बनाए रखा गया है।
  alternative: ‘पूरी होंगी’
  rationale: μέλλω साधारण भविष्य से अधिक, किसी कार्य के होने की ओर बढ़ने या निकट होने का भाव दे सकता है। अनुवाद उस तनाव को रखता है, पर इससे किसी विशेष अंत-समय कालक्रम को निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है। यीशु से संबोधन में ‘बताइए’ आदरयुक्त बहुवचन के कारण स्वाभाविक है। ‘चिन्ह’ सामान्य पाठक के लिए बोधगम्य रहते हुए बाइबिलीय संदर्भ से मेल खाता है।
