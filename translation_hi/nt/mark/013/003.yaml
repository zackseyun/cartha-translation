lexical_decisions:
- source_word: καθημένου αὐτοῦ
  choice: जब वह ... बैठा था
  rationale: वर्तमान कृदन्त वाला सम्बन्धवाचक निरपेक्ष प्रयोग जारी परिस्थिति को व्यक्त करता है; हिन्दी में यह स्वाभाविक रूप से पृष्ठभूमि की चल रही अवस्था बताता है।
- source_word: εἰς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: जैतून पहाड़ पर
  rationale: स्थिति बताने वाले इस प्रयोग में εἰς स्थान का बोध कराता है। ‘जैतून पहाड़’ इस भौगोलिक नाम का सरल और प्रचलित हिन्दी रूप है।
- source_word: κατέναντι τοῦ ἱεροῦ
  choice: मन्दिर के सामने
  rationale: κατέναντι आमने-सामने या सम्मुख स्थिति दर्शाता है। ἱερόν पूरे मन्दिर-परिसर का संकेत करता है, जिसे मुख्य पाठ में स्वाभाविक हिन्दी ‘मन्दिर’ और पादटिप्पणी में अधिक स्पष्ट किया गया है।
- source_word: ἐπηρώτα
  choice: पूछने लगे
  rationale: अपूर्ण भूतकाल प्रश्न करने की आरम्भिक अथवा जारी क्रिया दिखा सकता है। बहुवचन कर्ताओं के साथ ‘पूछने लगे’ इस पहलू और हिन्दी की स्वाभाविकता दोनों को बनाए रखता है।
- source_word: κατ’ ἰδίαν
  choice: एकान्त में
  rationale: यह वाक्यांश दूसरों से अलग, निजी रूप से पूछने का अर्थ देता है; ‘एकान्त में’ वर्तमान मानक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: Πέτρος καὶ Ἰάκωβος καὶ Ἰωάννης καὶ Ἀνδρέας
  choice: पतरस, याकूब, यूहन्ना और अन्द्रियास
  rationale: नामों के परिचित हिन्दी बाइबलीय रूप रखे गए हैं। यूनानी के बार-बार आए καί को हिन्दी में स्वाभाविक सूची-विन्यास के अनुसार अल्पविरामों और अंतिम ‘और’ से व्यक्त किया गया है।
