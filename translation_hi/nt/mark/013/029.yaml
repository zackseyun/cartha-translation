review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the discourse link, the plural “these things,” the imperative inference, and the unstated subject of ἐγγύς ἐστιν. However, “द्वारों पर” is not a natural Hindi equivalent of the Greek idiom ἐπὶ θύραις and can suggest being physically on the doors rather than immediately by them.
  naturalness: “इसी तरह तुम भी” and “जब इन बातों को होते देखो” are clear modern Hindi. “द्वारों के पास” preserves the Greek plural while naturally expressing extreme nearness. The footnote should explain the possible personal sense rather than present “वह व्यक्ति” as though it were a distinct Hindi wording supplied by the Greek.
  terminology: “निकट है” is accurate. The demonstrative “वह” can retain the Greek subject ambiguity in Hindi; no theological referent should be specified in the text or note.
  issues:
  - severity: medium
    issue: The phrase “द्वारों पर” is semantically awkward in Hindi.
    rationale: For ἐπὶ θύραις, the intended idiom is proximity (“at/by the doors”), not location on the surface of doors. “द्वारों के पास” is idiomatic Hindi and retains the plural θύραις.
  - severity: low
    issue: The footnote’s quoted alternative “वह व्यक्ति निकट है” adds an explicit noun not present in the Greek and does not clearly function as an alternative Hindi rendering.
    rationale: Greek leaves the subject unstated. Since Hindi “वह” may be personal or impersonal/contextual, the note should state that a personal sense is also possible, without introducing “व्यक्ति” into a purported translation.
  revised_text: इसी तरह तुम भी, जब इन बातों को होते देखो, तो जान लो कि वह[a] निकट है—द्वारों के पास।
  revised_footnotes:
