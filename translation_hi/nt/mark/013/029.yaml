    text: 'यूनानी में कर्ता स्पष्ट रूप से नहीं बताया गया है; इसका व्यक्तिगत अर्थ भी हो सकता है: “वह निकट है।”'
    reason: alternative_reading
  revision_rationale: The revision changes only the Hindi rendering of the door idiom and clarifies the footnote. “वह” is retained in the main text because it can preserve the source’s unstated subject without deciding whether the reference is personal or impersonal.
