  text: οὕτως καὶ ὑμεῖς, ὅταν ⸂ἴδητε ταῦτα⸃ γινόμενα, γινώσκετε ὅτι ἐγγύς ἐστιν ἐπὶ θύραις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/029.yaml
  text: So also you[a], when you see these things happening, know that it is near, at the doors.
translation:
  language: hi
  text: इसी तरह तुम भी, जब इन बातों को होते देखो, तो जान लो कि वह[a] निकट है—द्वारों के पास।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में कर्ता स्पष्ट रूप से नहीं बताया गया है; इसका व्यक्तिगत अर्थ भी हो सकता है: “वह निकट है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: इसी तरह तुम भी
  rationale: οὕτως पिछली अंजीर के पेड़ की उपमा से संबंध जोड़ता है, और καὶ ὑμεῖς शिष्यों को समान रूप से देखने और निष्कर्ष निकालने वालों के रूप में उभारता है। यह हिन्दी में स्वाभाविक रहते हुए दोनों तत्वों को बनाए रखता है।
- source_word: ὅταν ἴδητε
  choice: जब ... देखो
  rationale: ὅταν के साथ एओरिस्ट सब्जंक्टिव भविष्य की संभावित स्थिति बताता है। इस भविष्यसूचक प्रसंग में ‘जब ... देखो’ सहज और सटीक है।
- source_word: ταῦτα γινόμενα
  choice: इन बातों को होते
  rationale: ταῦτα का बहुवचन ‘इन बातों’ में सुरक्षित है और γινόμενα घटनाओं के घटित होने को व्यक्त करता है। ‘होते’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: γινώσκετε
  choice: जान लो
  rationale: वर्तमान आज्ञार्थक यहाँ चिह्न देखकर उचित निष्कर्ष निकालने का निर्देश देता है। ‘जान लो’ हिन्दी में इस आज्ञात्मक और निष्कर्षात्मक भाव को स्पष्ट करता है।
- source_word: ὅτι ἐγγύς ἐστιν
  choice: कि वह निकट है
  rationale: यूनानी में ἐστιν का कर्ता स्पष्ट नहीं है। हिन्दी में ‘वह’ व्यक्ति और पूर्वकथित घटना या समय—दोनों की ओर संकेत कर सकता है, इसलिए मूल की अस्पष्टता को ‘यह’ या ‘वह व्यक्ति’ की अपेक्षा बेहतर बनाए रखता है; पादटिप्पणी इसे स्पष्ट करती है।
- source_word: ἐπὶ θύραις
  choice: द्वारों पर
  rationale: θύραις बहुवचन है; ‘द्वारों पर’ उस रूप को सुरक्षित रखते हुए अत्यन्त निकटता के मुहावरे को व्यक्त करता है। एकवचन ‘द्वार पर’ अधिक प्रचलित हिन्दी विकल्प है, पर वह मूल के बहुवचन को मिटा देता।
theological_decisions:
- issue: ἐστιν (‘निकट है’) का अनकहा कर्ता
  choice: मुख्य पाठ में संदर्भतः खुला ‘वह’ रखा गया है।
  alternative: ‘यह निकट है’ अथवा व्यक्तिगत अर्थ में ‘वह निकट है।’
  rationale: यूनानी वाक्य कर्ता नहीं बताता। ‘वह’ हिन्दी में पूर्वकथित घटना/परिणति अथवा पुत्र-ए-मनुष्य के व्यक्तिगत संदर्भ—दोनों की संभावना खुली रखता है। पादटिप्पणी पाठक को इस वास्तविक अस्पष्टता से अवगत कराती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘द्वारों पर’ जानबूझकर मूल यूनानी के बहुवचन को सुरक्षित रखता है; डैश निकटता की व्याख्यात्मक पुनरुक्ति को सहज बनाता है।
