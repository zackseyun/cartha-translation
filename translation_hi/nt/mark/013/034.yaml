id: MRK.13.34
reference: Mark 13:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς ἄνθρωπος ἀπόδημος ἀφεὶς τὴν οἰκίαν αὐτοῦ καὶ δοὺς τοῖς δούλοις αὐτοῦ τὴν ἐξουσίαν, ⸀ἑκάστῳ τὸ ἔργον αὐτοῦ, καὶ τῷ θυρωρῷ ἐνετείλατο ἵνα γρηγορῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/034.yaml
  text: It is like a man away on a journey[a], who left his house and gave authority to his servants, to each one his work, and commanded the doorkeeper to stay awake.
translation:
  language: hi
  text: यह ऐसा है जैसे कोई मनुष्य परदेश गया हो। उसने अपना घर छोड़कर अपने दासों[a] को अधिकार दिया, हर एक को उसका काम सौंपा, और द्वारपाल को जागते रहने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवकों”; यूनानी शब्द उन घरेलू दासों को दर्शाता है जो स्वामी के अधिकार के अधीन थे।
    reason: δοῦλος के सामाजिक अर्थ को स्पष्ट करते हुए प्रचलित वैकल्पिक अनुवाद देना।
lexical_decisions:
- source_word: ὡς
  choice: यह ऐसा है जैसे
  rationale: यूनानी में तुलना संक्षिप्त और प्रसंग से जुड़ी हुई है। यह हिंदी अभिव्यक्ति निहित तुलना को स्वाभाविक ढंग से स्पष्ट करती है।
- source_word: ἄνθρωπος ἀπόδημος
  choice: कोई मनुष्य परदेश गया हो
  rationale: ἀπόδημος अपने घर या स्थान से दूर, विशेषतः यात्रा पर अथवा परदेश में होने का भाव देता है। ‘परदेश गया हो’ उसकी अनुपस्थिति और यात्रा—दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἀφεὶς τὴν οἰκίαν αὐτοῦ
  choice: उसने अपना घर छोड़कर
  rationale: अओरिस्ट कृदंत को हिंदी में पूर्वकालिक क्रिया ‘छोड़कर’ से स्वाभाविक रूप दिया गया है; οἰκία यहाँ घर और उससे संबद्ध गृहस्थी का संकेत देता है।
- source_word: τοῖς δούλοις αὐτοῦ
  choice: अपने दासों
  rationale: δοῦλος स्वामी के अधिकार के अधीन बंधुआ घरेलू दास को दर्शाता है। ‘दास’ ऐतिहासिक संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: τὴν ἐξουσίαν
  choice: अधिकार
  rationale: ἐξουσία सौंपे गए अधिकार या कार्य करने की वैध शक्ति को दर्शाता है; ‘अधिकार’ इसका सीधा और प्रचलित हिंदी समतुल्य है।
- source_word: ἑκάστῳ τὸ ἔργον αὐτοῦ
  choice: हर एक को उसका काम सौंपा
  rationale: यूनानी वाक्यांश संक्षिप्त है और पिछली क्रिया के साथ जुड़ा है। हिंदी में ‘सौंपा’ निहित वितरण को स्पष्ट करता है, जबकि ‘उसका काम’ मूल की व्यक्तिगत जिम्मेदारी बनाए रखता है।
- source_word: τῷ θυρωρῷ
  choice: द्वारपाल
  rationale: θυρωρός द्वार पर निगरानी रखने वाले व्यक्ति को बताता है; ‘द्वारपाल’ स्पष्ट, सम्मानित और प्रचलित हिंदी शब्द है।
- source_word: ἐνετείλατο ἵνα γρηγορῇ
  choice: जागते रहने की आज्ञा दी
  rationale: ἐνετείλατο की आधिकारिक शक्ति ‘आज्ञा दी’ में और γρηγορῇ का शाब्दिक जागते रहने तथा प्रसंगगत सतर्क रहने का भाव इस वाक्यांश में सुरक्षित है।
theological_decisions:
- issue: घरेलू दृष्टांत में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: चित्र में स्वामी के अधीन व्यक्तियों को अधिकार और काम दिए जाते हैं; इसलिए ‘दास’ यूनानी शब्द में निहित सामाजिक और अधिकार-संबंधी वास्तविकता को बिना नरम किए व्यक्त करता है। पाठकों के लिए अधिक परिचित ‘सेवक’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- issue: γρηγορέω का शाब्दिक और रूपकगत भाव
  choice: जागते रहने
  alternative: सतर्क रहने
  rationale: इस अध्याय में जागते रहने का चित्र सतर्कता की शिक्षा भी देता है। मुख्य पाठ शाब्दिक रूपक को बनाए रखता है और उसे केवल अमूर्त ‘सतर्कता’ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परदेश गया हो’ यात्रा के कारण घर से दूर होने का भाव देता है; ‘द्वारपाल’ और ‘आज्ञा’ जैसे शब्द सामान्य पाठक के लिए समझने योग्य होते हुए भी बाइबलीय कथन की गंभीरता बनाए रखते हैं।
