source:
  edition: SBLGNT
  text: καὶ οἱ ἀστέρες ⸂ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες⸃, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/025.yaml
  text: And the stars will be falling from heaven[b][a], and the powers in the heavens will be shaken.
translation:
  language: hi
  text: और तारे स्वर्ग से गिरते रहेंगे[a], और आकाश में स्थित शक्तियाँ[b] हिला दी जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश से।’ यूनानी शब्द οὐρανός का अर्थ प्रसंग के अनुसार ‘स्वर्ग’ या ‘आकाश’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘आकाश में स्थित शक्तियाँ’ से स्वर्गीय शक्तियाँ, ब्रह्मांडीय बल, या आकाशीय व्यवस्था की संरचनाएँ अभिप्रेत हो सकती हैं; यूनानी पाठ इससे अधिक स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀστέρες
  choice: तारे
  rationale: यह सामान्य खगोलीय अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है; इस प्रलय-दर्शी प्रसंग में किसी अन्य अर्थ की आवश्यकता नहीं है।
- source_word: ἔσονται ... πίπτοντες
  choice: गिरते रहेंगे
  rationale: εἰμί के भविष्यत् रूप और वर्तमान कृदंत का यह परिप्रयुक्त निर्माण भावी क्रिया की जारी अथवा सजीव प्रकृति दिखाता है; ‘गिरेंगे’ की अपेक्षा ‘गिरते रहेंगे’ इस पहलू को बेहतर बनाए रखता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: οὐρανός का अर्थ ‘स्वर्ग’ या ‘आकाश’ दोनों हो सकता है। ‘स्वर्ग’ यहाँ प्रलय-दर्शी कथन के ऊँचे, ब्रह्मांडीय स्वर को बनाए रखता है; ‘आकाश’ को पाद-टिप्पणी में वैध विकल्प के रूप में दिया गया है।
- source_word: δυνάμεις
  choice: शक्तियाँ
  rationale: बहुवचन δυνάμεις स्वर्गीय शक्तियों, ब्रह्मांडीय बलों या आकाशीय व्यवस्था की शक्तियों की ओर संकेत कर सकता है। ‘शक्तियाँ’ मूल की व्यापकता और अस्पष्टता को सुरक्षित रखता है।
- source_word: αἱ ἐν τοῖς οὐρανοῖς
  choice: आकाशों में जो ... हैं
  rationale: यह यूनानी के बहुवचन ‘आकाशों’ को बनाए रखता है और हिन्दी में संबंध को स्पष्ट तथा स्वाभाविक बनाता है।
- source_word: σαλευθήσονται
  choice: हिला दी जाएँगी
  rationale: यह σαλεύω के भविष्यत् कर्मवाच्य को स्वाभाविक हिन्दी में व्यक्त करता है और ब्रह्मांडीय उथल-पुथल का भाव बनाए रखता है।
theological_decisions:
- issue: ‘आकाशों में जो शक्तियाँ हैं’ का अभिप्राय
  choice: ‘शक्तियाँ’ को सामान्य और अनिर्दिष्ट रखा गया है।
  alternative: इसे विशेष रूप से स्वर्गदूत-सदृश प्राणी, खगोलीय पिंड, ब्रह्मांडीय बल या आकाशीय संरचनाएँ समझना।
  rationale: यूनानी पदबंध अर्थ की दृष्टि से व्यापक है और प्रलय-दर्शी संदर्भ भी इसे किसी एक वर्ग तक सीमित नहीं करता; इसलिए अनुवाद मूल की धर्मवैचारिक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘गिरते रहेंगे’ भावी क्रिया की जारी प्रकृति को व्यक्त करता है, जबकि ‘आकाशों’ यूनानी बहुवचन और कथन के ब्रह्मांडीय विस्तार को सुरक्षित रखता है।
