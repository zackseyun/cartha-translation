review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the principal elements: ἀστέρες as “तारे,” the future periphrastic ἔσονται ... πίπτοντες with an ongoing future sense, ἐκ τοῦ οὐρανοῦ as “स्वर्ग से,” and σαλευθήσονται as a future passive. “शक्तियाँ” appropriately preserves the deliberate breadth of δυνάμεις. The Greek plural τοῖς οὐρανοῖς need not be reproduced by an unnatural Hindi plural.'
  naturalness: “आकाशों में जो शक्तियाँ हैं” is intelligible but noticeably literal and cumbersome in modern standard Hindi. “आकाश में स्थित शक्तियाँ” is more idiomatic, keeps the cosmic location, and does not specify what the powers are.
  terminology: “स्वर्ग” and “आकाश” retain the viable lexical range of οὐρανός, with the alternative properly supplied in the note. “शक्तियाँ” is suitably noncommittal and should not be narrowed to angels, celestial objects, or impersonal forces. “हिला दी जाएँगी” is an idiomatic Hindi future passive for σαλευθήσονται.
  issues:
  - severity: low
    issue: The phrase “आकाशों में जो शक्तियाँ हैं” is overly calqued from Greek and less natural than necessary.
    rationale: Hindi ordinarily uses singular “आकाश” for the cosmic sky/heavens. Retaining Greek plurality here produces awkward phrasing without preserving a meaning distinction that Hindi naturally marks.
