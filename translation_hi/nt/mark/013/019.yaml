reference: Mark 13:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔσονται γὰρ αἱ ἡμέραι ἐκεῖναι θλῖψις οἵα οὐ γέγονεν τοιαύτη ἀπ’ ἀρχῆς κτίσεως ⸀ἣν ἔκτισεν ὁ θεὸς ἕως τοῦ νῦν καὶ οὐ μὴ γένηται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/019.yaml
  text: For those days will be a tribulation such as has not been from the beginning of the creation that God created until now[a], and never will be.
translation:
  language: hi
  text: क्योंकि उन दिनों ऐसा क्लेश होगा, जैसा परमेश्वर की रची हुई सृष्टि के आरम्भ से अब तक कभी नहीं हुआ[a], और न कभी होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा परमेश्वर की रची हुई सृष्टि के आरम्भ से अब तक ऐसा क्लेश कभी नहीं रहा, और न कभी रहेगा।”
    reason: γίνομαι के पूर्णकाल और भविष्यपरक रूपों को यहाँ घटना (‘हुआ/होगा’) या अवस्था (‘रहा/रहेगा’) के रूप में व्यक्त किया जा सकता है; वैकल्पिक पाठ मूल की ‘होने’ वाली भाषा को अधिक निकटता से दिखाता है।
lexical_decisions:
- source_word: θλῖψις
  choice: क्लेश
  rationale: ‘क्लेश’ अत्यन्त गंभीर पीड़ा और संकट को व्यक्त करता है, इस युगान्त-संबंधी प्रसंग की गम्भीरता बनाए रखता है, और आधुनिक हिन्दी में स्वाभाविक तथा परिचित है।
- source_word: οἵα οὐ γέγονεν τοιαύτη
  choice: ऐसा ... जैसा ... कभी नहीं हुआ
  rationale: यह हिन्दी तुलना यूनानी की कुछ दोहरावयुक्त तुलनात्मक रचना और आने वाले क्लेश की अद्वितीयता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: सृष्टि के आरम्भ से
  rationale: यह κτίσεως के सृष्टि-संबंधी अर्थ को स्पष्ट रखता है और हिन्दी में सहज है।
- source_word: ἣν ἔκτισεν ὁ θεὸς
  choice: परमेश्वर की रची हुई
  rationale: इससे परमेश्वर को सृष्टिकर्ता बताने वाला मूल संबंध स्पष्ट बना रहता है, जबकि हिन्दी में अस्वाभाविक ‘जिस सृष्टि को परमेश्वर ने सृजा’ से बचा जाता है।
- source_word: ἕως τοῦ νῦν
  choice: अब तक
  rationale: यह काल-सूचक पद का संक्षिप्त, स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: οὐ μὴ γένηται
  choice: न कभी होगा
  rationale: οὐ μή की प्रबल भावी निषेधात्मक शक्ति को ‘न कभी’ व्यक्त करता है; ‘फिर’ न जोड़ने से मूल से अनावश्यक अर्थ नहीं आता।
- source_word: ἔσονται ... αἱ ἡμέραι ἐκεῖναι θλῖψις
  choice: वे दिन ऐसा क्लेश होंगे
  rationale: मूल की संक्षिप्त विधेयात्मक रचना को निकटता से रखते हुए हिन्दी में समझने योग्य रूप दिया गया है; दिन स्वयं उस क्लेशमय काल को बनाते हैं।
theological_decisions:
- issue: ‘सृष्टि’ की भाषा का दायरा
  choice: ‘परमेश्वर की रची हुई सृष्टि’ कहकर सृजे हुए समस्त जगत का व्यापक संकेत बनाए रखा गया।
  alternative: ‘संसार के आरम्भ से’ अथवा इसे किसी स्थानीय या केवल वाचागत आरम्भ तक सीमित करना।
  rationale: मूल पाठ κτίσις और κτίζω दोनों का प्रयोग करता है तथा परमेश्वर को कर्ता बताता है। अनुवाद इसी सृष्टि-विषयक भाषा को रखता है और किसी विशेष युगान्त-सिद्धान्त को आरोपित नहीं करता।
- issue: अन्तिम निषेध की व्याख्या
  choice: ‘न कभी होगा’
  alternative: ‘फिर कभी नहीं होगा’
  rationale: ‘फिर’ प्रसंग से समझा जा सकता है, पर यूनानी में अलग से उपस्थित नहीं है। चुना हुआ रूप भविष्य की प्रबल असंभवता बनाए रखता है और पाठ को अधिक स्पष्ट करने के नाम पर अतिरिक्त तत्व नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘क्लेश’, ‘सृष्टि’ और ‘आरम्भ’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
