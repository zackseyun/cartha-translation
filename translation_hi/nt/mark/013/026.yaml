  text: καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης·
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/026.yaml
  text: And then they will see the Son of Man coming in the clouds with great power and glory[a].
translation:
  language: hi
  text: और तब वे मनुष्य के पुत्र को बड़े सामर्थ्य और महिमा के साथ बादलों में[a] आते हुए देखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बादलों के साथ।’ यूनानी में शाब्दिक रूप से ‘बादलों में’ है, पर यह वैकल्पिक अनुवाद दानिय्येल 7:13 की संभावित प्रतिध्वनि को अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄψονται
  choice: वे…देखेंगे
  rationale: यह ὁράω का भविष्यकालीन रूप है। ‘वे…देखेंगे’ सहज आधुनिक हिन्दी है और घटना के प्रत्यक्ष दिखाई देने के भाव को बिना किसी अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह इस यूनानी उपाधि का स्थापित बाइबलीय हिन्दी रूप है और दानिय्येल 7 से उसके संबंध तथा उसके मसीही और प्रलय-संबंधी संकेतों को सुरक्षित रखता है।
- source_word: ἐρχόμενον
  choice: आते हुए
  rationale: वर्तमान कृदंत को ‘आते हुए’ से व्यक्त किया गया है; यह उस दृश्य की प्रगतिशीलता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν νεφέλαις
  choice: बादलों में
  rationale: ἐν का सीधा अर्थ ‘में’ है और बहुवचन νεφέλαις का स्वाभाविक हिन्दी रूप ‘बादलों’ है। मुख्य पाठ यूनानी वाक्यरचना के निकट रहता है; दानिय्येल 7:13 की संभावित प्रतिध्वनि दर्शाने वाला ‘बादलों के साथ’ पादटिप्पणी में दिया गया है।
- source_word: μετὰ δυνάμεως πολλῆς
  choice: बड़े सामर्थ्य के साथ
  rationale: μετά सहचर्य व्यक्त करता है और δύναμις πολλή का ‘बड़ा सामर्थ्य’ गरिमापूर्ण तथा स्वाभाविक बाइबलीय हिन्दी रूप है। संयुक्त पद ‘बड़े सामर्थ्य और महिमा के साथ’ हिन्दी में अधिक प्रवाहपूर्ण है।
- source_word: καὶ δόξης
  choice: और महिमा
  rationale: इस प्रसंग में δόξα प्रकट वैभव और प्रताप का बाइबलीय भाव रखता है। ‘महिमा’ इस अंतरपाठीय और धर्मवैचारिक अर्थ को ‘वैभव’ की अपेक्षा अधिक अच्छी तरह सुरक्षित रखता है।
theological_decisions:
- issue: प्रलय-संबंधी उपाधि और बादलों का बिंब
  choice: ‘मनुष्य का पुत्र’ और बादलों में आने का बिंब बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: उपाधि को ‘मानव’ जैसे गतिशील रूप में देना, या मुख्य पाठ में दानिय्येल 7:13 के संकेत को स्पष्ट करके कहना।
  rationale: यह पद दानिय्येल 7:13 की प्रबल प्रतिध्वनि रखता है, पर अनुवाद को उस संकेत की व्याख्या करने के बजाय उसे सुरक्षित रखना चाहिए। पारंपरिक उपाधि मसीही और अंतकाल-संबंधी तनाव को भी बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मनुष्य के पुत्र’, ‘सामर्थ्य’ और ‘महिमा’ जैसे स्थापित बाइबलीय पद अंतरपाठीय संबंधों को सुरक्षित रखते हैं, जबकि वाक्य-विन्यास साधारण हिन्दी पाठक के लिए स्वाभाविक है।
