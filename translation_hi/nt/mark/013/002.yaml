  text: καὶ ὁ ⸀Ἰησοῦς εἶπεν αὐτῷ· Βλέπεις ταύτας τὰς μεγάλας οἰκοδομάς; οὐ μὴ ἀφεθῇ ⸀ὧδε λίθος ἐπὶ ⸀λίθον ὃς οὐ μὴ καταλυθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/013/002.yaml
  text: And Jesus said to him[c][b][a], “Do you see these great buildings? Not one stone will be left here upon another that will not be torn down.”
translation:
  language: hi
  text: और यीशु ने उससे कहा, “क्या तुम इन विशाल भवनों[a] को देखते हो? यहाँ एक भी पत्थर दूसरे पत्थर पर नहीं छोड़ा जाएगा जो ढाया न जाए[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मंदिर के इन विशाल भवनों।” प्रसंग मंदिर-परिसर का है, यद्यपि यूनानी में केवल “भवन” कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: या, “गिरा दिया जाएगा,” “नष्ट किया जाएगा,” अथवा “ढहा दिया जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπεις
  choice: क्या तुम ... को देखते हो?
  rationale: वर्तमानकालीन निर्देशात्मक क्रिया को प्रश्न के रूप में स्वाभाविक हिन्दी में रखा गया है; इससे इसे आज्ञा ‘देखो’ नहीं बनाया जाता।
- source_word: μεγάλας οἰκοδομάς
  choice: विशाल भवनों
  rationale: ‘विशाल’ आकार और प्रभावशाली भव्यता, दोनों की ओर संकेत कर सकता है; ‘भवन’ मूल के सामान्य बहुवचन को बनाए रखता है और मुख्य पाठ में ‘मंदिर’ नहीं जोड़ता।
- source_word: οὐ μὴ ἀφεθῇ ὧδε
  choice: यहाँ ... भी नहीं छोड़ा जाएगा
  rationale: ‘οὐ μή’ की प्रबल भावी निषेधात्मकता को ‘भी नहीं’ से स्पष्ट किया गया है, और ὧδε को सीधे ‘यहाँ’ अनूदित किया गया है।
- source_word: λίθος ἐπὶ λίθον
  choice: पत्थर पर पत्थर
  rationale: यह हिन्दी में स्वाभाविक और मूल बिंब के निकट है तथा पूर्ण विध्वंस के मुहावरे को बनाए रखता है।
- source_word: ὃς οὐ μὴ καταλυθῇ
  choice: हर पत्थर ढा दिया जाएगा
  rationale: यूनानी संबंधवाचक उपवाक्य को शब्दशः रखने पर हिन्दी असहज होती; यह रूप उसके आशय—कोई पत्थर ढाए बिना नहीं बचेगा—को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτῷ
  choice: और यीशु ने उससे कहा
  rationale: καί का कथात्मक संबंध ‘और’ से तथा εἶπεν αὐτῷ का सीधा अर्थ ‘उससे कहा’ से व्यक्त किया गया है; ‘उत्तर दिया’ जैसा अतिरिक्त संवादात्मक भाव नहीं जोड़ा गया।
theological_decisions:
- issue: भविष्यवाणी में उल्लिखित भवनों का दायरा
  choice: मुख्य पाठ में सामान्य शब्द ‘भवन’ रखा गया है।
  alternative: ‘मंदिर के विशाल भवन’
  rationale: निकटवर्ती प्रसंग मंदिर-परिसर को स्पष्ट करता है, पर यूनानी में संज्ञा केवल ‘भवन’ है। सामान्य शब्द रखने से प्रसंगगत संकेत बना रहता है और मूल में न आया हुआ ‘मंदिर’ मुख्य पाठ में नहीं जोड़ा जाता।
- issue: विध्वंस की पूर्णता
  choice: ‘पत्थर पर पत्थर भी नहीं ... हर पत्थर ढा दिया जाएगा’
  alternative: केवल ‘भवन नष्ट कर दिए जाएँगे’
  rationale: मूल की प्रबल दोहरी निषेधात्मक रचना और पत्थरों का ठोस बिंब बनाए रखना आवश्यक है; इसे सामान्यीकृत करके केवल भवनों के नाश तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘विशाल भवन’, ‘पत्थर पर पत्थर’ और ‘ढा दिया जाएगा’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य के दूसरे भाग को स्वाभाविक हिन्दी के लिए दो समन्वित खंडों में रखा गया है, जबकि मूल की पूर्ण विध्वंस वाली शक्ति सुरक्षित है।
