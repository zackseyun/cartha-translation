source:
  edition: SBLGNT
  text: καὶ ἐδίδασκεν ⸂καὶ ἔλεγεν⸃ ⸀αὐτοῖς· Οὐ γέγραπται ὅτι Ὁ οἶκός μου οἶκος προσευχῆς κληθήσεται πᾶσιν τοῖς ἔθνεσιν; ὑμεῖς δὲ ⸀πεποιήκατε αὐτὸν σπήλαιον λῃστῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/017.yaml
  text: And he was teaching and saying to them[a], “Is it not written[b], ‘My house will be called a house of prayer for all the nations’? But you have made it a den of robbers.”
translation:
  language: hi
  text: और वह उन्हें सिखा रहा था और कह रहा था, “क्या यह नहीं लिखा है, ‘मेरा घर सभी राष्ट्रों[a] के लिए प्रार्थना का घर कहलाएगा’? पर तुमने इसे लुटेरों की माँद[b] बना दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सभी राष्ट्रों” का अनुवाद “सभी लोगों” भी हो सकता है। यूनानी में “सभी राष्ट्रों” है; यह यशायाह 56:7 की प्रतिध्वनि है और इस्राएल से परे भी लोगों के लिए परमेश्वर के घर की अभिप्रेत पहुँच को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: “लुटेरों की माँद” यिर्मयाह 7:11 की प्रतिध्वनि है। यहाँ प्रयुक्त यूनानी शब्द का अर्थ कुछ संदर्भों में “डाकू” या “बटमार” भी हो सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐδίδασκεν καὶ ἔλεγεν
  choice: शिक्षा देते हुए कह रहा था
  rationale: दोनों अपूर्णकालिक क्रियाओं के चलते हुए या लगातार कार्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οὐ γέγραπται
  choice: क्या यह नहीं लिखा है
  rationale: पूर्ण निष्क्रिय रूप और पवित्रशास्त्र के लिखित अधिकार की ओर संकेत करने वाले पारंपरिक प्रश्नसूचक सूत्र को बनाए रखता है।
- source_word: Ὁ οἶκός μου
  choice: मेरा घर
  rationale: यशायाह 56:7 के उद्धरण की शब्दावली और उसके पवित्र-स्थान संबंधी रूपक को सुरक्षित रखता है; इसे केवल ‘मंदिर’ कहकर संकुचित नहीं करता।
- source_word: οἶκος προσευχῆς
  choice: प्रार्थना का घर
  rationale: सम्बन्धकारक पदबंध का स्पष्ट, स्वाभाविक और परिचित हिन्दी रूप।
- source_word: πᾶσιν τοῖς ἔθνεσιν
  choice: सब जातियों के लिए
  rationale: दत्तिव पदबंध के प्रयोजन/लाभार्थ भाव और ἔθνη के सामूहिक अर्थ को बनाए रखते हुए यशायाह के सार्वभौमिक विस्तार को व्यक्त करता है।
- source_word: ὑμεῖς δὲ
  choice: पर तुमने
  rationale: परमेश्वर के घोषित उद्देश्य और श्रोताओं के कार्य के बीच तीखा विरोध तथा बलयुक्त ‘तुम’ सुरक्षित रहता है।
- source_word: πεποιήκατε
  choice: बना दिया है
  rationale: पूर्णकाल से सूचित पूर्व कार्य के वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σπήλαιον λῃστῶν
  choice: लुटेरों की माँद
  rationale: यिर्मयाह 7:11 की प्रतिध्वनि में छिपने के ठिकाने का भाव देता है; λῃσταί को अनावश्यक रूप से राजनीतिक ‘विद्रोही’ नहीं बनाता।
theological_decisions:
- issue: भविष्यवाणी के उद्धरण का सार्वभौमिक विस्तार
  choice: सब जातियों के लिए
  alternative: सब लोगों के लिए; सब जातियों द्वारा
  rationale: यह ἔθνη का सीधा सामूहिक अर्थ और इस्राएल से परे परमेश्वर के घर की अभिप्रेत पहुँच बनाए रखता है, पर किसी बाद की धर्मवैज्ञानिक व्यवस्था को पाठ में नहीं जोड़ता।
- issue: λῃστῶν के आरोप का आशय
  choice: लुटेरों
  alternative: डाकुओं; बटमारों; विद्रोहियों
  rationale: यिर्मयाह 7:11 की पृष्ठभूमि में लूट करने वालों का अर्थ उपयुक्त है; ‘विद्रोहियों’ से ऐसा राजनीतिक अर्थ जुड़ सकता है जिसकी इस पद में आवश्यकता नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिक्षा देते हुए कह रहा था’ निरंतर क्रिया को दर्शाता है; उद्धरणों में पहचानी जाने वाली बाइबिलीय अभिव्यक्तियाँ बनाए रखी गई हैं।
