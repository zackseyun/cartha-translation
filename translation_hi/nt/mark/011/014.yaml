  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτῇ· Μηκέτι ⸂εἰς τὸν αἰῶνα ἐκ σοῦ⸃ μηδεὶς καρπὸν φάγοι. καὶ ἤκουον οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/014.yaml
  text: And answering[a], he said to it[c][b], “May no one ever eat fruit from you again.” And his disciples were listening.
translation:
  language: hi
  text: और उत्तर में उसने उस पेड़ से कहा, “अब फिर कभी कोई तुझसे फल न खाए।” और उसके चेले यह सुन रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुन रहे थे” का अनुवाद “उन्होंने यह सुना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: उत्तर देते हुए
  rationale: यूनानी का प्रचलित कथात्मक मुहावरा बनाए रखता है, यद्यपि पेड़ की ओर से कोई कथन दर्ज नहीं है।
- source_word: αὐτῇ
  choice: उस पेड़ से
  rationale: यूनानी सर्वनाम स्त्रीलिंग है क्योंकि अंजीर के पेड़ के लिए संज्ञा स्त्रीलिंग है; हिन्दी में स्पष्ट और स्वाभाविक संदर्भ हेतु ‘उस पेड़ से’ कहा गया है।
- source_word: Μηκέτι … εἰς τὸν αἰῶνα
  choice: अब फिर कभी … न
  rationale: ‘अब और नहीं’ तथा ‘युग तक/सदा’ की संयुक्त, स्थायी निषेधात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ σοῦ
  choice: तुझसे
  rationale: पेड़ को किए गए प्रत्यक्ष एकवचन संबोधन की जीवंतता सुरक्षित रखता है।
- source_word: μηδεὶς καρπὸν φάγοι
  choice: कोई … फल न खाए
  rationale: ऑप्टेटिव क्रिया के शापसूचक अथवा इच्छासूचक भाव को भविष्यवाणी में बदले बिना हिन्दी के विधिलिंग-सदृश निषेध से व्यक्त करता है।
- source_word: ἤκουον
  choice: सुन रहे थे
  rationale: इम्परफेक्ट की जारी क्रिया को सुरक्षित रखता है; प्रसंग में इसका अर्थ ‘उन्होंने सुना’ भी हो सकता है।
- source_word: μαθηταὶ αὐτοῦ
  choice: उसके चेले
  rationale: आधुनिक सामान्य हिन्दी में यीशु के अनुयायियों के लिए परिचित और स्वाभाविक पद।
theological_decisions:
- issue: अंजीर के पेड़ के प्रति यीशु के वचन का स्वरूप
  choice: “अब फिर कभी कोई तुझसे फल न खाए।”
  alternative: “अब फिर कभी कोई तुझसे फल नहीं खाएगा।”
  rationale: φάγοι ऑप्टेटिव है, इसलिए इसे केवल भविष्य की सपाट भविष्यवाणी न बनाकर शापसूचक/इच्छासूचक घोषणा के रूप में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उत्तर देते हुए’ मूल यूनानी की किंचित औपचारिक कथात्मक बनावट को सुरक्षित रखता है; ‘तुझसे’ पेड़ के प्रत्यक्ष संबोधन को दर्शाता है।
