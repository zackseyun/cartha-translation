id: MRK.11.29
reference: Mark 11:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ⸀Ἰησοῦς εἶπεν αὐτοῖς· Ἐπερωτήσω ⸀ὑμᾶς ἕνα λόγον, καὶ ἀποκρίθητέ μοι, καὶ ἐρῶ ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/029.yaml
  text: But Jesus said to them[a], “I will ask you one question. Answer me[b], and I will tell you by what authority I do these things.”
translation:
  language: hi
  text: पर यीशु ने उनसे कहा, “मैं तुमसे एक बात[a] पूछूँगा। मुझे उत्तर दो, और मैं तुम्हें बताऊँगा कि मैं ये काम किस अधिकार से करता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक प्रश्न”; अधिक शाब्दिक रूप से, “एक वचन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में अगुओं द्वारा पूछे गए प्रश्न के उत्तर में हल्का विरोध या संवाद का मोड़ दिखाता है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम का प्रचलित मानक हिन्दी रूप।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: λέγω और उसके अप्रत्यक्ष कर्म का सहज तथा स्रोत-संगत हिन्दी रूप।
- source_word: Ἐπερωτήσω ὑμᾶς
  choice: मैं तुमसे ... पूछूँगा
  rationale: भविष्यकाल में एक प्रत्युत्तर-प्रश्न प्रस्तुत किया गया है; यह हिन्दी में स्वाभाविक है।
- source_word: ἕνα λόγον
  choice: एक बात
  rationale: λόγος का मूल अर्थ ‘वचन/बात’ है, पर यहाँ उत्तर माँगे जाने के कारण वह पूछे जाने वाले विषय या प्रश्न को सूचित करता है। ‘एक बात’ मूल की व्यापकता बनाए रखते हुए हिन्दी मुहावरे के अनुकूल है।
- source_word: ἀποκρίθητέ μοι
  choice: मुझे उत्तर दो
  rationale: यह सीधी आज्ञा है; अनुवाद उसकी आज्ञार्थक शक्ति और संक्षिप्तता बनाए रखता है।
- source_word: ἐρῶ ὑμῖν
  choice: मैं तुम्हें बताऊँगा
  rationale: इस संदर्भ में भविष्यकालीन λέγω का स्वाभाविक हिन्दी अर्थ सूचना देने का वादा है।
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: यह यीशु के कार्यों के वैध आधार या अधिकार के विषय में प्रश्न को व्यक्त करता है।
- source_word: ταῦτα ποιῶ
  choice: मैं ये काम ... करता हूँ
  rationale: वर्तमानकाल उन कार्यों को दर्शाता है जिन पर विवाद चल रहा है; हिन्दी का सामान्य वर्तमानकाल इसे सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: संदर्भ में ἐξουσία का आशय
  choice: अधिकार
  alternative: सामर्थ्य; हक
  rationale: मंदिर के अगुओं के साथ इस विवाद में प्रश्न केवल कार्य करने की क्षमता का नहीं, बल्कि यीशु के वैध अधिकार का है। ‘अधिकार’ इस संस्थागत और धर्मवैचारिक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और सम्मानपूर्ण है। संबोधन में ‘तुम’ बहुवचन श्रोताओं के लिए स्वाभाविक है। यूनानी के क्रमिक संयोजन को हिन्दी की स्पष्टता के लिए पहले कथन के बाद पूर्ण विराम देकर रखा गया है, जबकि आज्ञा और उसके बाद की प्रतिज्ञा को ‘और’ से जोड़ा गया है।
