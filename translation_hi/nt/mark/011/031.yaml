  text: καὶ ⸀διελογίζοντο πρὸς ἑαυτοὺς λέγοντες· ⸂Τί εἴπωμεν;⸃ ἐὰν εἴπωμεν· Ἐξ οὐρανοῦ, ἐρεῖ· Διὰ τί ⸀οὖν οὐκ ἐπιστεύσατε αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/031.yaml
  text: And they were reasoning among themselves[a], saying, “What should we say? If we say, ‘From heaven,’ he will say, ‘Why then did you not believe him?’”
translation:
  language: hi
  text: और वे आपस में विचार-विमर्श कर रहे थे और कह रहे थे, “हम क्या कहें? यदि हम कहें, ‘स्वर्ग की ओर से,’[a] तो वह कहेगा, ‘फिर तुमने उसकी बात पर विश्वास क्यों नहीं किया?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्वर्ग की ओर से” यहूदी श्रद्धापूर्ण ढंग से “परमेश्वर की ओर से” या “ईश्वरीय उद्गम का” कहने का एक तरीका है।
    reason: cultural_note
lexical_decisions:
- source_word: διελογίζοντο πρὸς ἑαυτοὺς
  choice: वे आपस में विचार करने लगे
  rationale: अपूर्ण भूतकाल चल रहे विचार-विमर्श को दिखाता है, और πρὸς ἑαυτούς समूह के भीतर पारस्परिक चर्चा को व्यक्त करता है। यह हिन्दी में स्वाभाविक रूप से दोनों भावों को समेटता है।
- source_word: Τί εἴπωμεν;
  choice: हम क्या कहें?
  rationale: विचारार्थक संभावनार्थक क्रिया उस उत्तर पर मंथन व्यक्त करती है जो उन्हें देना चाहिए; यह संक्षिप्त हिन्दी उसी भाव को रखती है।
- source_word: ἐὰν εἴπωμεν
  choice: यदि हम कहें
  rationale: यह शर्तसूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: Ἐξ οὐρανοῦ
  choice: स्वर्ग की ओर से
  rationale: मूल में आए ‘स्वर्ग’ को बनाए रखते हुए यह किसी स्वर्गीय या ईश्वरीय स्रोत अथवा अधिकार का भाव स्पष्ट करता है।
- source_word: ἐρεῖ
  choice: वह कहेगा
  rationale: λέγω के भविष्यकाल का सीधा अनुवाद है; आगे का उद्धरण स्वयं प्रश्नात्मक उत्तर को स्पष्ट करता है।
- source_word: Διὰ τί οὖν
  choice: फिर ... क्यों
  rationale: यह काल्पनिक उत्तर से निकलने वाले तार्किक निष्कर्ष को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἐπιστεύσατε αὐτῷ
  choice: तुमने उस पर विश्वास क्यों नहीं किया
  rationale: πιστεύω के साथ संप्रदान कारक यहाँ यूहन्ना की बात या गवाही को विश्वसनीय मानने का भाव देता है। हिन्दी में ‘उस पर विश्वास करना’ व्यक्ति की बात मानने के अर्थ में स्वाभाविक है और ‘उसमें विश्वास’ जैसी अधिक प्रबल धार्मिक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: यूहन्ना के बपतिस्मे या अधिकार के विषय में ‘स्वर्ग की ओर से’ का अर्थ
  choice: मुख्य पाठ में ‘स्वर्ग की ओर से’ मुहावरे को बनाए रखना
  alternative: परमेश्वर की ओर से
  rationale: यहूदी श्रद्धापूर्ण प्रयोग में ‘स्वर्ग’ ईश्वरीय स्रोत या अधिकार की ओर संकेत कर सकता है। मूल शब्दावली रखने से अर्थ को व्याख्यात्मक रूप से सीमित किए बिना उसका धार्मिक संकेत और कथात्मक तनाव दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल शैली अपनाई गई है। ‘आपस में विचार करने लगे’ चल रहे सामूहिक विचार-विमर्श को स्वाभाविक रूप से व्यक्त करता है; ‘स्वर्ग की ओर से’ मूल धार्मिक मुहावरे को सुरक्षित रखता है।
