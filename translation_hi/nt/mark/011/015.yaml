  text: Καὶ ἔρχονται εἰς Ἱεροσόλυμα. καὶ ⸀εἰσελθὼν εἰς τὸ ἱερὸν ἤρξατο ἐκβάλλειν τοὺς πωλοῦντας καὶ ⸀τοὺς ἀγοράζοντας ἐν τῷ ἱερῷ, καὶ τὰς τραπέζας τῶν κολλυβιστῶν καὶ τὰς καθέδρας τῶν πωλούντων τὰς περιστερὰς κατέστρεψεν
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/015.yaml
  text: And they came to Jerusalem. And entering the temple[a], he began to drive out those who were selling and those who were buying in the temple, and he overturned the tables of the money changers and the seats of those who were selling doves.
translation:
  language: hi
  text: और वे यरूशलेम पहुँचे। और मन्दिर-परिसर[a] में प्रवेश करके उसने वहीं बेचनेवालों और खरीदनेवालों को बाहर निकालना शुरू किया, और मुद्रा बदलनेवालों की मेज़ें और कबूतर बेचनेवालों के आसन उलट दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मन्दिर’; यूनानी शब्द यहाँ पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: पहुँचे
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन में भूतकाल से व्यक्त किया गया है; ‘पहुँचे’ आगमन को स्पष्ट करता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: εἰσελθὼν
  choice: प्रवेश करके
  rationale: अओरिस्ट कृदन्त को मुख्य क्रिया से पहले हुई निकट-संबद्ध क्रिया के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἱερὸν / ἐν τῷ ἱερῷ
  choice: मन्दिर-परिसर / वहाँ
  rationale: ἱερόν भीतरी पवित्रस्थान के बजाय व्यापक मन्दिर-क्षेत्र को सूचित करता है; दूसरी आवृत्ति को ‘वहाँ’ कहना हिन्दी में अनावश्यक पुनरुक्ति से बचाता है।
- source_word: ἤρξατο ἐκβάλλειν
  choice: बाहर निकालना शुरू किया
  rationale: आरम्भसूचक रचना और ἐκβάλλω की बलपूर्ण दिशा—बाहर करना—दोनों सुरक्षित रहते हैं।
- source_word: τοὺς πωλοῦντας καὶ τοὺς ἀγοράζοντας
  choice: बेचने और खरीदनेवालों
  rationale: दोनों substantival participles की समानान्तरता और जारी गतिविधि को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: κολλυβιστῶν
  choice: मुद्रा बदलनेवालों
  rationale: मन्दिर में सिक्कों या मुद्राओं का विनिमय करनेवालों के लिए स्पष्ट आधुनिक पद।
- source_word: τραπέζας
  choice: मेज़ें
  rationale: संदर्भ में विनिमयकारों की मेज़ों के लिए सीधा और स्वाभाविक रूप।
- source_word: καθέδρας
  choice: चौकियाँ
  rationale: बैठने के स्थान का सामान्य अर्थ रखता है और हिन्दी बाज़ार-संदर्भ में स्वाभाविक है; आकार या बनावट अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: περιστερὰς
  choice: कबूतर
  rationale: बलिदानी संदर्भ में περιστερά के लिए प्रचलित और बोधगम्य हिन्दी शब्द।
- source_word: κατέστρεψεν
  choice: उलट दीं
  rationale: मेज़ों और चौकियों के साथ क्रिया की प्रत्यक्ष, बलपूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मन्दिर-शुद्धिकरण वृत्तान्त में ἱερόν का क्षेत्र
  choice: मुख्य पाठ में ‘मन्दिर-परिसर’
  alternative: ‘मन्दिर’, साथ में पादटिप्पणी; अथवा ‘मन्दिर के आँगन’
  rationale: ἱερόν व्यापक मन्दिर-क्षेत्र को दर्शाता है, विशेष रूप से भीतरी पवित्रस्थान को नहीं। ‘मन्दिर-परिसर’ स्थानगत अर्थ को सीधे स्पष्ट करता है, जबकि पादटिप्पणी मानक संक्षिप्त विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मन्दिर-परिसर’ स्थानगत सटीकता देता है; ‘वहाँ’ दूसरी बार उसी पद की भारी पुनरावृत्ति से बचाता है। पारम्परिक वर्तनी ‘मन्दिर’ अपनाई गई है।
