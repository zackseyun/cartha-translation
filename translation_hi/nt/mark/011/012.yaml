  text: And on the next day, when they had gone out from Bethany, he was hungry.
translation:
  language: hi
  text: और अगले दिन, जब वे बैतनिय्याह से निकले, तो उसे भूख लगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह कथा की अगली घटना को पिछली घटना से जोड़ता है और मरकुस की संयोजक शैली को बनाए रखता है।
- source_word: τῇ ἐπαύριον
  choice: अगले दिन
  rationale: यह पदबंध समय की अगली अवस्था बताता है; ‘अगले दिन’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ἐξελθόντων αὐτῶν
  choice: जब वे ... से निकले
  rationale: सम्बन्धवाचक स्वतंत्र कृदन्त-रचना मुख्य क्रिया से पहले घटित सामूहिक कार्य का समय बताती है। ‘वे’ यूनानी के बहुवचन को सुरक्षित रखता है।
- source_word: ἀπὸ Βηθανίας
  choice: बैतनिय्याह से
  rationale: ἀπό किसी स्थान से बाहर अथवा दूर जाने का बोध कराता है; स्थान-नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: ἐπείνασεν
  choice: उसे भूख लगी
  rationale: यह हिन्दी में भूख की अवस्था आरम्भ होने की स्वाभाविक अभिव्यक्ति है और यूनानी अओरिस्ट के प्रसंगगत भाव को ‘भूखा था’ की अपेक्षा अधिक सीधे ढंग से व्यक्त करती है।
theological_decisions:
- issue: ἐπείνασεν का निहित एकवचन कर्ता
  choice: नाम जोड़े बिना ‘उसे’ द्वारा यीशु की ओर संकेत
  alternative: स्पष्टता के लिए ‘यीशु को भूख लगी’
  rationale: यूनानी में कर्ता का नाम नहीं दिया गया, पर प्रसंग में वह स्पष्ट है। सर्वनाम स्रोत की संक्षिप्तता बनाए रखता है और यीशु की वास्तविक मानवीय भूख को बिना व्याख्यात्मक विस्तार के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में ‘और’ द्वारा मूल की कथात्मक कड़ी तथा ‘वे’ और एकवचन ‘उसे’ के बीच का मूलभूत भेद सुरक्षित है।
