  yaml_path: translation/nt/mark/011/019.yaml
  text: And whenever evening came, they would go out of the city.
translation:
  language: hi
  text: और जब-जब शाम होती, वे नगर से बाहर चले जाते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅταν
  choice: जब-जब
  rationale: ὅταν के साथ यहाँ आने वाली क्रियाएँ बार-बार होने वाली अथवा प्रथागत घटना व्यक्त करती हैं; ‘जब-जब’ इस पुनरावृत्त भाव को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ὀψὲ ἐγένετο
  choice: शाम होती
  rationale: यह यूनानी अभिव्यक्ति शाम होने अथवा देर हो जाने को दर्शाती है। संदर्भ में ‘शाम होती’ सहज है और प्रथागत क्रिया के भाव से मेल खाती है।
- source_word: ἐξεπορεύοντο
  choice: वे ... बाहर चले जाते थे
  rationale: अपूर्ण भूतकाल का रूप संदर्भ में नियमित रूप से दोहराई जाने वाली क्रिया व्यक्त करता है; ‘चले जाते थे’ उस प्रथागत भाव और नगर से बाहर की ओर गति—दोनों को बनाए रखता है।
- source_word: ἔξω τῆς πόλεως
  choice: नगर से बाहर
  rationale: यह अनुवाद बाहर की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πόλεως
  choice: नगर
  rationale: मूल पाठ में नगर का नाम नहीं, केवल ‘नगर’ है; इसलिए संदर्भ से यरूशलेम समझे जाने पर भी उसका नाम पाठ में नहीं जोड़ा गया।
