source:
  edition: SBLGNT
  text: καὶ ὅταν ⸀στήκετε προσευχόμενοι, ἀφίετε εἴ τι ἔχετε κατά τινος, ἵνα καὶ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφῇ ὑμῖν τὰ παραπτώματα ⸀ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/025.yaml
  text: And whenever you stand praying[a], forgive, if you have anything against anyone[b], so that your Father who is in the heavens may also forgive you your trespasses.
translation:
  language: hi
  text: और जब कभी तुम प्रार्थना करते हुए खड़े हो, तो यदि तुम्हें किसी के विरुद्ध कोई शिकायत हो, तो क्षमा करो, ताकि तुम्हारा पिता, जो स्वर्गों में है,[a] तुम्हारे अपराधों[b] को भी क्षमा करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जो स्वर्ग में है।’ यूनानी में ‘स्वर्गों में’ बहुवचन है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उल्लंघनों’ अथवा ‘चूकों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: στήκετε προσευχόμενοι
  choice: खड़े होकर प्रार्थना करते हो
  rationale: यह अनुवाद प्रार्थना के समय खड़े होने की ठोस मुद्रा और दोनों क्रियाओं की समकालिकता को बनाए रखता है।
- source_word: ἀφίετε
  choice: क्षमा कर दो
  rationale: पारस्परिक संबंध के इस संदर्भ में क्रिया का अर्थ अपराध या शिकायत को छोड़ देना, अर्थात क्षमा करना है; आज्ञार्थक भाव को स्पष्ट रखा गया है।
- source_word: εἴ τι ἔχετε κατά τινος
  choice: यदि तुम्हारे मन में किसी के विरुद्ध कुछ हो
  rationale: यह स्वाभाविक हिन्दी में τι और τινος की व्यापक अनिश्चितता को बनाए रखता है और किसी व्यक्ति के प्रति शिकायत या विरोध का भाव व्यक्त करता है।
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: तुम्हारा पिता भी, जो स्वर्गों में है
  rationale: ‘स्वर्गों’ बहुवचन मूल यूनानी οὐρανοῖς को सुरक्षित रखता है; ‘भी’ को पिता की क्षमा से जोड़ते हुए वाक्य को हिन्दी में सहज बनाया गया है।
- source_word: ἀφῇ
  choice: क्षमा करे
  rationale: ἵνα के बाद आया संभावनार्थक रूप उद्देश्य/परिणाम व्यक्त करता है; हिन्दी में ‘ताकि ... क्षमा करे’ इस संबंध को स्वाभाविक रूप से प्रकट करता है।
- source_word: παραπτώματα
  choice: अपराधों
  rationale: यह शब्द चूक, उल्लंघन या अपराध का अर्थ देता है। ‘अपराध’ सामान्य पाठक के लिए स्पष्ट है और इसे व्यापक शब्द ‘पाप’ में विलीन नहीं करता।
theological_decisions:
- issue: मनुष्यों द्वारा क्षमा करने और पिता से क्षमा पाने का संबंध
  choice: ‘ताकि ... क्षमा करे’ के द्वारा दोनों के बीच मूल पाठ में व्यक्त वास्तविक उद्देश्यात्मक संबंध बनाए रखा गया है।
  alternative: इसे केवल इस बात का प्रमाण बताना कि व्यक्ति पहले ही क्षमा पा चुका है।
  rationale: यूनानी ἵνα ... ἀφῇ दूसरों को क्षमा करने और पिता की क्षमा के बीच सीधा संबंध रखता है। अनुवाद इस धर्मवैज्ञानिक तनाव को किसी व्यापक सिद्धान्त के द्वारा न तो कम करता है, न समझाकर समाप्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘खड़े होकर’ मूल पाठ की प्रार्थना-मुद्रा को बनाए रखता है, जबकि ‘तुम्हारे मन में किसी के विरुद्ध कुछ हो’ हिन्दी में व्यापक और स्वाभाविक ढंग से शिकायत या विरोध को व्यक्त करता है।
