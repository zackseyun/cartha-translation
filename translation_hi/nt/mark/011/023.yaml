reference: Mark 11:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀμὴν λέγω ὑμῖν ὅτι ὃς ἂν εἴπῃ τῷ ὄρει τούτῳ· Ἄρθητι καὶ βλήθητι εἰς τὴν θάλασσαν, καὶ μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ ἀλλὰ ⸀πιστεύῃ ὅτι ⸂ὃ λαλεῖ γίνεται, ἔσται αὐτῷ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/023.yaml
  text: Truly I tell you[a], whoever says to this mountain, ‘Be lifted up and be thrown into the sea,’ and does not doubt in his heart but believes that what he says is happening[b], it will be so for him.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, जो कोई इस पहाड़ से कहे, ‘उठाया जा और समुद्र में फेंक दिया जा,’ और अपने हृदय में संदेह न करे[a], बल्कि विश्वास करे कि जो वह कहता है, वह हो रहा है[b], तो उसके लिए वैसा ही होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने हृदय में न डगमगाए’ अथवा ‘अपने भीतर बँटा हुआ न हो’; यूनानी क्रिया में संदेह के साथ-साथ भीतर से विभाजित होने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो वह कहता है, वह होता है’ अथवा ‘पूरा होता है।’ भावी परिणाम बताने वाले अगले खंड से पहले यूनानी में यहाँ वर्तमान काल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: आरम्भिक ἀμήν को यीशु के गंभीर और प्रामाणिक कथन की स्वाभाविक हिन्दी अभिव्यक्ति ‘सच’ से व्यक्त किया गया है; λέγω ὑμῖν का सीधा संबोधन भी सुरक्षित है।
- source_word: ὃς ἂν εἴπῃ
  choice: जो कोई ... कहे
  rationale: सापेक्ष सर्वनाम, ἄν और संभावनार्थक क्रिया का अनिश्चित तथा सर्वसामान्य भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: τῷ ὄρει τούτῳ
  choice: इस पहाड़ से
  rationale: ὄρος का सामान्य अर्थ ‘पहाड़’ और τούτῳ का निकटवाची संकेत दोनों बनाए रखे गए हैं।
- source_word: Ἄρθητι καὶ βλήθητι
  choice: उठा लिया जा और ... फेंक दिया जा
  rationale: दोनों यूनानी क्रियाओं के कर्मवाच्य आज्ञार्थ को बनाए रखा गया है। यह हिन्दी में कुछ असामान्य किंतु समझने योग्य है और पहाड़ को स्थान से उठाकर समुद्र में फेंके जाने की सजीव छवि सुरक्षित रखता है।
- source_word: εἰς τὴν θάλασσαν
  choice: समुद्र में
  rationale: θάλασσα का सीधा अर्थ ‘समुद्र’ है; अतिशयोक्तिपूर्ण चित्र को नरम नहीं किया गया।
- source_word: μὴ διακριθῇ ἐν τῇ καρδίᾳ αὐτοῦ
  choice: अपने हृदय में संदेह न करे
  rationale: इस संदर्भ में διακρίνω आंतरिक संदेह या डगमगाहट सूचित करता है। καρδία के बाइबलीय आंतरिक-केंद्र के भाव हेतु ‘हृदय’ रखा गया है।
- source_word: ἀλλὰ πιστεύῃ
  choice: बल्कि विश्वास करे
  rationale: πιστεύω के विश्वास-संबंधी सीधे अर्थ और पिछले निषेध के साथ विरोध को सुरक्षित रखा गया है।
- source_word: ὅτι ὃ λαλεῖ γίνεται
  choice: कि जो वह कहता है, वह हो रहा है
  rationale: γίνεται के वर्तमान काल को भावी काल में बदलने के बजाय वर्तमान रूप ‘हो रहा है’ से व्यक्त किया गया है। λαλεῖ के लिए यहाँ स्वाभाविक ‘कहता है’ पर्याप्त है।
- source_word: ἔσται αὐτῷ
  choice: तो उसके लिए वैसा ही होगा
  rationale: भविष्यकालीन परिणाम को व्यक्त करते हुए यूनानी वाक्यांश की अपेक्षाकृत खुली प्रकृति रखी गई है; परिणाम की प्रक्रिया को अतिरिक्त रूप से परिभाषित नहीं किया गया।
theological_decisions:
- issue: विश्वास से कही बात और उसके परिणाम के विषय में प्रतिज्ञा का स्वरूप
  choice: कथन को बिना नरम किए विश्वास और संदेह न करने से जुड़ी शर्तयुक्त प्रतिज्ञा के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल अलंकार मानना, या इसे हर इच्छा की निरपेक्ष गारंटी के रूप में विस्तार देना।
  rationale: पद स्वयं पहाड़ के समुद्र में फेंके जाने की अत्यंत सशक्त छवि देता है, पर बाद की धर्मवैज्ञानिक सीमाएँ या प्रणालियाँ स्पष्ट नहीं करता। अनुवाद उस तनाव को यथावत रखता है।
- issue: αὐτοῦ और αὐτῷ का व्याकरणिक एकवचन
  choice: ‘अपने’ और ‘उसके’ द्वारा एकवचन प्रतिनिधिक संदर्भ बनाए रखा गया है।
  alternative: बहुवचन या स्पष्ट रूप से लिंग-निरपेक्ष पुनर्गठन।
  rationale: यूनानी पाठ एकवचन है। हिन्दी में ‘जो कोई’ के साथ ये रूप स्वाभाविक हैं और अनावश्यक लिंग-निर्धारण के बिना व्याकरणिक संख्या सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। कर्मवाच्य आज्ञाएँ मूल की असामान्य तीव्रता बचाती हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के तुरंत बाद दिए गए हैं।
