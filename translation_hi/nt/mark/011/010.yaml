lexical_decisions:
- source_word: Εὐλογημένη
  choice: धन्य है
  rationale: यह कर्तृवाचक विशेषण जयघोष के रूप में प्रयुक्त है। ‘धन्य है’ मूल के आशीर्वादात्मक और स्तुतिपरक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡ ἐρχομένη βασιλεία
  choice: आनेवाला राज्य
  rationale: वर्तमान कृदन्त ἐρχομένη के आगमनशील भाव को स्पष्ट रखता है और उसे केवल दूर-भविष्य के निश्चित पारिभाषिक विचार में नहीं बदलता।
- source_word: βασιλεία
  choice: राज्य
  rationale: दाऊदी राजवंश के संदर्भ में ‘राज्य’ स्वाभाविक है और राजकीय शासन तथा उसके क्षेत्र की मूलगत व्यापकता को खुला रखता है।
- source_word: τοῦ πατρὸς ἡμῶν Δαυίδ
  choice: हमारे पूर्वज दाऊद का
  rationale: यहाँ πατήρ वंशगत आदर-सूचक अर्थ में है। आधुनिक हिन्दी में ‘पूर्वज’ उस आशय को ‘पिता’ की अपेक्षा अधिक स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: Ὡσαννὰ
  choice: होशाना
  rationale: नए नियम के प्रयोग में यह स्थापित धार्मिक जयघोष है; इसलिए मुख्य पाठ में लिप्यंतरण रखा गया है और इसके मूल विनतीपरक अर्थ को पादटिप्पणी में बताया गया है।
- source_word: ἐν τοῖς ὑψίστοις
  choice: सर्वोच्च लोक में
  rationale: बहुवचन विशेषण के संज्ञात्मक प्रयोग से सर्वोच्च स्वर्गीय क्षेत्र का संकेत मिलता है। ‘सर्वोच्च लोक में’ अर्थ को संक्षिप्त और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना ‘स्वर्ग’ को मूल पाठ में जोड़ने के।
theological_decisions:
- issue: दाऊद के आनेवाले राज्य संबंधी जयघोष का स्वरूप
  choice: वाक्य को सीधे ‘हमारे पूर्वज दाऊद का आनेवाला राज्य’ के रूप में रखा गया है।
  alternative: ‘हमारे पूर्वज दाऊद का आनेवाला मसीही राज्य’
  rationale: संदर्भ में मसीही अपेक्षा प्रबल है, पर यूनानी पाठ ‘मसीही’ नहीं कहता। सीधा अनुवाद संकेत और धर्मवैचारिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, सामूहिक जयघोष की लय रखी गई है। ‘पूर्वज’ वंशगत अर्थ को सहज बनाता है; ‘होशाना’ परिचित धार्मिक लिप्यंतरण है।
