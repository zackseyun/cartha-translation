  text: καὶ ⸀ἔλεγον αὐτῷ· Ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς; ⸀ἢ τίς σοι ⸂ἔδωκεν τὴν ἐξουσίαν ταύτην⸃ ἵνα ταῦτα ποιῇς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/028.yaml
  text: And they were saying to him[b][a], “By what authority are you doing these things? Or who gave you this authority to do these things?”
translation:
  language: hi
  text: और वे उससे कह रहे थे, “तुम ये काम किस अधिकार से कर रहे हो?[a] या तुम्हें यह अधिकार किसने दिया कि तुम ये काम करो?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “तुम ये काम किस अधिकार में कर रहे हो?”
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि तुम ये काम करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया का पक्ष बनाए रखता है; सामान्य हिन्दी में प्रसंग के अनुरूप स्वाभाविक है।
- source_word: Ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: ἐν के साथ संबंधवाचक प्रयोग यहाँ कार्य करने के आधार या अधिकृत हैसियत के विषय में पूछता है। ‘किस अधिकार से’ आधुनिक हिन्दी में स्वाभाविक रूप से वही चुनौती व्यक्त करता है।
- source_word: ἐξουσίᾳ / ἐξουσίαν
  choice: अधिकार
  rationale: यहाँ शब्द सामर्थ्य मात्र नहीं, बल्कि किसी कार्य को करने के वैध हक या प्राधिकरण को दर्शाता है; इसलिए ‘अधिकार’ उपयुक्त है।
- source_word: ταῦτα ποιεῖς / ταῦτα ποιῇς
  choice: ये काम कर रहे हो / ये काम करो
  rationale: बहुवचन ταῦτα को ‘ये काम’ के रूप में रखा गया है, जिससे यीशु की हाल की गतिविधियों की व्यापक ओर संकेत बना रहता है।
- source_word: ἢ
  choice: या
  rationale: दूसरा प्रश्न पहले प्रश्न का निकट-संबंधित वैकल्पिक रूप है; ‘या’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τίς σοι ἔδωκεν
  choice: तुम्हें ... किसने दिया
  rationale: अओरिस्ट क्रिया को हिन्दी के सामान्य पूर्ण भूत रूप में प्रस्तुत किया गया है, और हिन्दी की स्वाभाविक प्रश्नवाचक शब्द-व्यवस्था अपनाई गई है।
- source_word: ἵνα ταῦτα ποιῇς
  choice: कि तुम ये काम करो
  rationale: ἵνα और संभावनार्थक क्रिया यहाँ दिए गए अधिकार के अभिप्रेत कार्य को व्यक्त करते हैं। ‘कि ... करो’ हिन्दी में स्वाभाविक है और उद्देश्य तथा अधिकृत कार्य के संबंध को अत्यधिक संकीर्ण नहीं करता।
theological_decisions:
- issue: यीशु के अधिकार का स्रोत
  choice: धार्मिक अगुओं के प्रश्न को तटस्थ चुनौती के रूप में रखा गया है; अधिकार के स्रोत को अनुवाद में स्पष्टतः परमेश्वर से आया हुआ नहीं कहा गया।
  alternative: प्रसंग के आधार पर ‘परमेश्वर से मिला अधिकार’ जैसा व्याख्यात्मक संकेत जोड़ा जा सकता था।
  rationale: यह पद प्रश्न प्रस्तुत करता है, उसका उत्तर नहीं। इसलिए मूल पाठ की धार्मिक तनातनी और अनिर्णीतता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष संबोधन में ‘तुम’ चुना गया है, जो यहाँ चुनौतीपूर्ण संवाद में स्वाभाविक है और अनावश्यक आदरसूचक व्याख्या नहीं जोड़ता।
