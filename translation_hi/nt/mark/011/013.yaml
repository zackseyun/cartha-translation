  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἰδὼν συκῆν ⸀ἀπὸ μακρόθεν ἔχουσαν φύλλα ἦλθεν εἰ ἄρα ⸂τι εὑρήσει⸃ ἐν αὐτῇ, καὶ ἐλθὼν ἐπ’ αὐτὴν οὐδὲν εὗρεν εἰ μὴ φύλλα, ⸂ὁ γὰρ καιρὸς οὐκ ἦν⸃ σύκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/013.yaml
  text: And seeing from a distance a fig tree having leaves[a], he went to see whether perhaps he would find anything on it. But when he came to it, he found nothing except leaves, for it was not the season for figs.
translation:
  language: hi
  text: और दूर से एक अंजीर का पेड़, जिस पर पत्ते थे, देखकर वह यह देखने उसके पास गया कि शायद उसे उस पर कुछ मिल जाए। लेकिन जब वह उसके पास पहुँचा, तो उसे पत्तों के सिवा कुछ नहीं मिला, क्योंकि अंजीरों का मौसम नहीं था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि यह अंजीरों का समय नहीं था।”
    reason: καιρός का अर्थ यहाँ ‘मौसम’ या ‘उचित समय’ दोनों रूपों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἰδὼν
  choice: देखकर
  rationale: कालवाचक-परिस्थितिजन्य कृदंत को स्वाभाविक हिन्दी में व्यक्त करता है और घटनाक्रम को अनावश्यक रूप से अधिक निश्चित नहीं बनाता।
- source_word: συκῆν
  choice: अंजीर का एक पेड़
  rationale: इस संदर्भ में συκῆ का मानक और सहज हिन्दी अर्थ।
- source_word: ἀπὸ μακρόθεν
  choice: दूर से
  rationale: स्थानगत अर्थ का संक्षिप्त और स्वाभाविक हिन्दी रूप।
- source_word: ἔχουσαν φύλλα
  choice: पत्तों से भरा
  rationale: पेड़ पर पत्ते होने की बात को सहज आधुनिक हिन्दी में व्यक्त करता है; इससे फल होने का कोई अतिरिक्त दावा नहीं जुड़ता।
- source_word: ἦλθεν εἰ ἄρα τι εὑρήσει ἐν αὐτῇ
  choice: वह उसके पास गया कि शायद उस पर कुछ मिल जाए
  rationale: εἰ ἄρα की अनिश्चित और संभावनात्मक छाया को ‘शायद’ बनाए रखता है तथा उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν αὐτῇ
  choice: उस पर
  rationale: फल के पेड़ पर मिलने के लिए हिन्दी का स्वाभाविक प्रयोग; मूल के स्थानगत आशय को सुरक्षित रखता है।
- source_word: ἐλθὼν ἐπ’ αὐτὴν
  choice: जब वह उसके पास पहुँचा
  rationale: कृदंत और पूर्वसर्गीय पदबंध का स्पष्ट, स्वाभाविक कालवाचक अनुवाद।
- source_word: οὐδὲν εὗρεν εἰ μὴ φύλλα
  choice: उसे पत्तों के सिवा कुछ नहीं मिला
  rationale: εἰ μὴ के अपवादसूचक बल को सीधी और मुहावरेदार हिन्दी में बनाए रखता है।
- source_word: ὁ γὰρ καιρὸς οὐκ ἦν σύκων
  choice: क्योंकि अंजीरों का मौसम नहीं था
  rationale: καιρός के प्रसंगानुकूल अर्थ ‘मौसम/उचित समय’ को व्यक्त करता है और कथन में मौजूद तनाव को बिना समझाए ज्यों का त्यों रखता है।
theological_decisions:
- issue: अंजीरों के मौसम के विषय में कथावाचक की व्याख्या का अर्थबल
  choice: 'उपवाक्य को सीधे कारणसूचक कथन के रूप में रखा गया: ‘क्योंकि अंजीरों का मौसम नहीं था।’'
  alternative: ‘क्योंकि यह अंजीरों का समय नहीं था’ अथवा कृषि-संबंधी अपेक्षाओं की विस्तारपूर्वक व्याख्या।
  rationale: यीशु के फल खोजने और कथावाचक के यह कहने के बीच कि अंजीरों का मौसम नहीं था, मूल पाठ में वास्तविक व्याख्यात्मक तनाव है। अनुवाद उसे नरम करने या कृषि-विवरण जोड़कर सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शायद’ से मूल की अनिश्चितता और अंतिम कारणसूचक वाक्य से उसका व्याख्यात्मक तनाव सुरक्षित है।
