lexical_decisions:
- source_word: παραπορευόμενοι
  choice: वहाँ से गुजरते हुए
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रही पृष्ठभूमि की क्रिया बताता है। ‘गुजरते हुए’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है; प्रसंग के कारण ‘वहाँ से’ जोड़ा गया है।
- source_word: πρωῒ
  choice: सुबह-सवेरे
  rationale: यह क्रियाविशेषण दिन के आरंभिक समय को सूचित करता है। ‘सुबह-सवेरे’ आधुनिक हिन्दी में समय और उसके जल्दी होने, दोनों को सहज रूप से व्यक्त करता है।
- source_word: εἶδον
  choice: उन्होंने देखा
  rationale: दृष्टि-बोध की इस सामान्य भूतकालीन क्रिया का सीधा और न्यूनतम व्याख्यात्मक अनुवाद है।
- source_word: συκῆν
  choice: अंजीर का पेड़
  rationale: कथा के संदर्भ में συκῆ के लिए यह प्रचलित और स्पष्ट हिन्दी पद है।
- source_word: ἐξηραμμένην
  choice: मुरझा चुका था
  rationale: पूर्ण निष्क्रिय कृदंत पूर्व घटना के फलस्वरूप पेड़ की वर्तमान दशा बताता है। ‘मुरझा चुका था’ उस परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐκ ῥιζῶν
  choice: जड़ों से
  rationale: यह पद सूखने या मुरझाने के मूल-स्रोत अथवा विस्तार को जड़ों से आरंभ हुआ बताता है। ‘जड़ों से’ यूनानी की संक्षिप्तता और संभावित अर्थ-व्याप्ति को बनाए रखता है।
