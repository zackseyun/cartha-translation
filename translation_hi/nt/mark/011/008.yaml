  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ओढ़ने के कपड़े’ सामान्य पाठक के लिए बाहरी वस्त्र का आशय स्पष्ट करता है। मुख्य पाठ में ‘हरी डालियाँ’ पठनीयता देता है, जबकि पादटिप्पणी στιβάδας की व्यापक अर्थ-सीमा और वास्तविक अस्पष्टता सुरक्षित रखती है।
