  yaml_path: translation/nt/mark/011/008.yaml
  text: And many spread their cloaks on the road, and others spread leafy branches cut from the fields.
translation:
  language: hi
  text: और बहुतों ने अपने बाहरी वस्त्र सड़क पर बिछा दिए, और दूसरों ने खेतों से काटी हुई डालियाँ बिछा दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोगों
  rationale: यह सामान्य परिमाणसूचक अर्थ को सहज हिन्दी में व्यक्त करता है और यूनानी से अधिक जोर नहीं जोड़ता।
- source_word: ἱμάτια
  choice: ओढ़ने के कपड़े
  rationale: इस प्रसंग में शब्द बाहरी वस्त्रों को सूचित करता है; यह साधारण पाठक के लिए स्पष्ट है और केवल आधुनिक पश्चिमी प्रकार के ‘चोगे’ की छवि नहीं बनाता।
- source_word: ἔστρωσαν
  choice: बिछा दिए
  rationale: सड़क की सतह पर वस्त्र और वनस्पति फैलाने की क्रिया के लिए स्वाभाविक हिन्दी अभिव्यक्ति। दूसरे खंड में यूनानी क्रिया अध्याहृत है, इसलिए उसे हिन्दी में दोहराया गया है।
- source_word: εἰς τὴν ὁδόν
  choice: सड़क पर
  rationale: στρώννυμι के साथ εἰς का आशय सड़क की सतह पर रखे जाने से है; ‘सड़क पर’ स्पष्ट और स्वाभाविक है।
- source_word: ἄλλοι δὲ
  choice: और कुछ दूसरों ने
  rationale: δέ यहाँ हल्का भेद जोड़ता है; यह अभिव्यक्ति पहले समूह से दूसरे समूह की ओर स्वाभाविक संक्रमण करती है।
- source_word: στιβάδας
  choice: हरी डालियाँ
  rationale: शब्द कटी हुई वनस्पति, पत्तों या डालियों के ढेर/परत को व्यापक रूप से सूचित करता है। ‘हरी डालियाँ’ प्रसंग में स्वाभाविक है, पर ‘खजूर की डालियाँ’ जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: κόψαντες
  choice: काटी हुई
  rationale: कृदन्त मुख्य क्रिया से पहले हुई काटने की क्रिया बताता है; हिन्दी में यह रूप संक्षिप्त और स्वाभाविक है।
- source_word: ἐκ τῶν ἀγρῶν
  choice: खेतों से
  rationale: ἀγροί का सीधा अर्थ खेत या खुला ग्रामीण क्षेत्र है; यहाँ पास की वनस्पति काटकर लाने के चित्र के लिए ‘खेतों से’ उपयुक्त है।
