  text: Καὶ ἔρχονται πάλιν εἰς Ἱεροσόλυμα. καὶ ἐν τῷ ἱερῷ περιπατοῦντος αὐτοῦ ἔρχονται πρὸς αὐτὸν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς καὶ οἱ πρεσβύτεροι
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/027.yaml
  text: And they came again to Jerusalem. And as he was walking in the temple courts[a], the chief priests and the scribes and the elders came to him.
translation:
  language: hi
  text: वे फिर यरूशलेम आए। जब वह मंदिर-परिसर[a] में चल रहे थे, तब प्रधान याजक, शास्त्री और बुज़ुर्ग उनके पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मंदिर में’ अथवा ‘मंदिर के क्षेत्र में’; यूनानी शब्द पूरे मंदिर-परिसर को दर्शाता है, केवल भीतरी पवित्र भवन को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: आए
  rationale: यूनानी में ऐतिहासिक वर्तमान है; स्वाभाविक हिन्दी कथन में सामान्य भूतकाल घटनाक्रम को स्पष्ट और सहज रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह यरूशलेम में दोबारा आने को दर्शाता है और आधुनिक हिन्दी में सहज है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर-परिसर
  rationale: ἱερόν से पूरे मंदिर-क्षेत्र का बोध होता है, केवल भीतरी पवित्र भवन का नहीं; ‘मंदिर-परिसर’ इस स्थानिक अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: περιπατοῦντος αὐτοῦ
  choice: जब वह … टहल रहे थे
  rationale: सम्बन्धवाचक कृदन्तीय संरचना पृष्ठभूमि में जारी क्रिया बताती है; यह हिन्दी रूप उस कालगत परिस्थिति को स्वाभाविक ढंग से रखता है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन में यह प्रमुख याजकीय अधिकारियों को सूचित करता है; ‘प्रधान याजक’ बाइबलीय हिन्दी में स्थापित और अर्थतः उपयुक्त है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह सीधा और प्रचलित हिन्दी समतुल्य है तथा केवल ‘व्यवस्था के शिक्षक’ कहकर पद की अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: πρεσβύτεροι
  choice: पुरनिए
  rationale: इस संस्थागत प्रसंग में मान्य अगुओं का संकेत है, केवल अधिक आयु वाले पुरुषों का नहीं; ‘पुरनिए’ इस पदनाम का प्रतिष्ठित हिन्दी रूप है।
- source_word: πρὸς αὐτόν
  choice: उनके पास
  rationale: यह यीशु की ओर बढ़कर निकट आने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἱερόν का स्थानिक अर्थ
  choice: मंदिर-परिसर
  alternative: मंदिर; मंदिर का क्षेत्र
  rationale: यह अनुवाद पाठकों को केवल भीतरी पवित्र भवन समझने से बचाता है और उस व्यापक मंदिर-क्षेत्र को दर्शाता है जहाँ सार्वजनिक आवागमन और बातचीत हो सकती थी। यह मुख्यतः शब्दार्थ और स्थान से जुड़ा निर्णय है, कोई साम्प्रदायिक व्याख्या नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘मंदिर-परिसर’ सामान्य पाठक के लिए स्थान को स्पष्ट करता है; ‘प्रधान याजक’, ‘शास्त्री’ और ‘पुरनिए’ पारंपरिक किन्तु अब भी बोधगम्य पदनाम हैं।
