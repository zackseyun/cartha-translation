  text: διὰ τοῦτο λέγω ὑμῖν, πάντα ὅσα ⸂προσεύχεσθε καὶ αἰτεῖσθε⸃, πιστεύετε ὅτι ⸀ἐλάβετε, καὶ ἔσται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/024.yaml
  text: For this reason I tell you[a], whatever you pray and ask for, believe that you have received it[b], and it will be yours.
translation:
  language: hi
  text: 'इसलिए मैं तुमसे कहता हूँ: जो कुछ तुम प्रार्थना में माँगते हो, विश्वास करो कि वह तुम्हें मिल चुका है[a], और वह तुम्हें मिल जाएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पांडुलिपियों या पाठ-रूपों के अनुसार इसका अनुवाद “विश्वास करो कि वह तुम्हें मिल रहा है” किया जा सकता है। यहाँ अपनाए गए यूनानी पाठ में क्रिया पूर्ण हो चुके कार्य को व्यक्त करती है: “मिल चुका है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह पद को पिछले प्रसंग से जोड़ने वाला स्वाभाविक कारणात्मक/निष्कर्षात्मक पद है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: प्रत्यक्ष और अधिकारपूर्ण संबोधन को सहज आधुनिक हिन्दी में रखता है।
- source_word: πάντα ὅσα
  choice: जो कुछ
  rationale: यूनानी अभिव्यक्ति की व्यापकता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσεύχεσθε καὶ αἰτεῖσθε
  choice: तुम प्रार्थना में माँगते हो
  rationale: 'दोनों क्रियाओं का अर्थ सहज हिन्दी में समेटता है: माँगना प्रार्थना के संदर्भ में है; शाब्दिक ''प्रार्थना करते और माँगते हो'' हिन्दी में अनावश्यक रूप से दोहरावपूर्ण लगता है।'
- source_word: πιστεύετε
  choice: विश्वास करो
  rationale: आदेशात्मक बल और आगे आने वाले कथन की विषयवस्तु दोनों को स्पष्ट रखता है।
- source_word: ἐλάβετε
  choice: तुम्हें मिल चुका है
  rationale: अओरिस्ट के पूर्ण हो चुके कार्य के चौंकाने वाले कालगत बल को हिन्दी के पूर्ण पक्ष से सुरक्षित रखता है।
- source_word: ἔσται ὑμῖν
  choice: वह तुम्हें मिल जाएगा
  rationale: भविष्य के आश्वासन को स्वाभाविक हिन्दी में व्यक्त करता है और पहले कथन के साथ निहित कालगत तनाव बनाए रखता है।
theological_decisions:
- issue: विश्वास और प्रार्थना के उत्तर के बीच कालगत संबंध
  choice: “विश्वास करो कि वह तुम्हें मिल चुका है, और वह तुम्हें मिल जाएगा” के विरोधाभास-जैसे क्रम को बनाए रखा गया।
  alternative: “विश्वास करो कि वह तुम्हें मिलता है” या वर्तमान काल में कोई सरल रूप।
  rationale: SBLGNT में ἐλάβετε अओरिस्ट है। अनुवाद इसे वर्तमान काल बनाकर धार्मिक तनाव को हल नहीं करता और प्रार्थना के विषय में कोई विशिष्ट सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल। “तुम” बहुवचन शिष्यों को संबोधित करता है। मूल पाठ की दोनों क्रियाओं को हिन्दी मुहावरे में “प्रार्थना में माँगते हो” द्वारा व्यक्त किया गया है।
