  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς λέγει αὐτοῖς· Ἔχετε πίστιν θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/022.yaml
  text: And Jesus answered them[a], “Have faith in God.”
translation:
  language: hi
  text: तब यीशु ने उन्हें उत्तर दिया[a], “परमेश्वर पर विश्वास रखो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “परमेश्वर का विश्वास रखो।” इसे “परमेश्वर की विश्वासयोग्यता पर भरोसा रखो” या “परमेश्वर से मिला विश्वास रखो” भी समझा जा सकता है।
    reason: 'वैकल्पिक पाठ-अर्थ: πίστιν θεοῦ का संबंधकारक व्याकरणतः अस्पष्ट है।'
lexical_decisions:
- source_word: ἀποκριθεὶς … λέγει
  choice: तब यीशु ने उन्हें उत्तर दिया
  rationale: यूनानी में कृदंत ἀποκριθεὶς और ऐतिहासिक वर्तमान λέγει मिलकर प्रत्युत्तर देने की क्रिया व्यक्त करते हैं। आधुनिक हिन्दी कथा-शैली में भूतकाल का यह रूप स्वाभाविक है; ‘तब’ प्रसंगगत प्रत्युत्तर-संबंध को स्पष्ट करता है।
- source_word: Ἔχετε
  choice: रखो
  rationale: वर्तमान आज्ञार्थक यहाँ निरंतर मनोवृत्ति का आह्वान करता है। ‘विश्वास रखो’ आधुनिक हिन्दी का स्वाभाविक और संक्षिप्त प्रयोग है।
- source_word: πίστιν
  choice: विश्वास
  rationale: इस प्रसंग में πίστις का सामान्य और स्वाभाविक हिन्दी प्रतिशब्द ‘विश्वास’ है। ‘विश्वासयोग्यता’ सम्भव अर्थ-छाया है, पर मुख्य पाठ के लिए कम सम्भावित है।
- source_word: θεοῦ
  choice: परमेश्वर पर
  rationale: πίστιν θεοῦ में संबंधकारक व्याकरणतः अस्पष्ट है। आगे प्रार्थना और विश्वास की शिक्षा के प्रसंग में उद्देश्यवाचक अर्थ—परमेश्वर पर विश्वास—सबसे स्वाभाविक है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: πίστιν θεοῦ में अस्पष्ट संबंधकारक
  choice: 'उद्देश्यवाचक अर्थ: ‘परमेश्वर पर विश्वास’'
  alternative: 'अधिक शाब्दिक: ‘परमेश्वर का विश्वास’; इसे ‘परमेश्वर की विश्वासयोग्यता’ या ‘परमेश्वर से मिला विश्वास’ भी समझा जा सकता है।'
  rationale: मरकुस 11:23–24 में आने वाली प्रार्थना और विश्वास की शिक्षा शिष्यों को परमेश्वर पर भरोसा रखने की आज्ञा के अनुकूल है। फिर भी यूनानी रचना अन्य अर्थों को पूरी तरह निरस्त नहीं करती, इसलिए उसकी वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘परमेश्वर’ सामान्य बाइबलीय पदावली के अनुरूप है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी मूल यूनानी की अर्थगत अस्पष्टता को सुरक्षित रखती है।
