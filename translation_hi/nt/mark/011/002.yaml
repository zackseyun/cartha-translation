  text: καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν κώμην τὴν κατέναντι ὑμῶν, καὶ ⸀εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν εὑρήσετε πῶλον δεδεμένον ἐφ’ ὃν οὐδεὶς ⸀οὔπω ἀνθρώπων ⸀ἐκάθισεν· ⸂λύσατε αὐτὸν καὶ φέρετε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/002.yaml
  text: And he says to them[a], “Go into the village opposite you, and as soon as you enter it, you will find a colt tied there, on which no one has yet sat[b]. Untie it and bring it.”
translation:
  language: hi
  text: और वह उनसे कहता है, “तुम्हारे सामने वाले गाँव में जाओ। उसमें प्रवेश करते ही तुम्हें गधे का एक बच्चा[a] बँधा हुआ मिलेगा, जिस पर अब तक कोई मनुष्य नहीं बैठा है[b]। उसे खोलकर ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द πῶλον का अर्थ किसी पशु का बच्चा, विशेषकर घोड़े या गधे का बच्चा, हो सकता है; इस प्रसंग में गधे का बच्चा अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जिस पर मनुष्यों में से कोई अब तक नहीं बैठा।” कथन विशेष रूप से यह बताता है कि किसी मनुष्य ने उसकी सवारी नहीं की थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὑπάγετε
  choice: जाओ
  rationale: गति की आज्ञा के लिए यह सरल, स्वाभाविक और अर्थानुरूप हिन्दी है।
- source_word: κώμην τὴν κατέναντι ὑμῶν
  choice: अपने सामने के गाँव में
  rationale: κατέναντι स्थानगत रूप से सामने या सम्मुख होने का बोध देता है; यह हिन्दी में सहज है और अनावश्यक रूप से ‘उस पार’ का अर्थ नहीं जोड़ता।
- source_word: εὐθὺς εἰσπορευόμενοι εἰς αὐτὴν
  choice: उसमें प्रवेश करते ही
  rationale: εὐθύς की तात्कालिकता और सहभागी क्रिया की कालगत भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πῶλον
  choice: गधे का एक बच्चा
  rationale: πῶλος अपने आप में किसी बड़े पशु के बच्चे को सूचित कर सकता है, पर इस प्रसंग और आगे की सवारी के संदर्भ में गधे का बच्चा अभिप्रेत है; हिन्दी में ‘बछेड़ा’ प्रायः घोड़े से जोड़ा जाता है।
- source_word: δεδεμένον
  choice: बँधा हुआ
  rationale: पूर्ण निष्क्रिय कृदंत पशु की वर्तमान बँधी हुई अवस्था व्यक्त करता है।
- source_word: οὐδεὶς οὔπω ἀνθρώπων ἐκάθισεν
  choice: जिस पर अब तक कोई मनुष्य नहीं बैठा है
  rationale: ἀνθρώπων के स्पष्ट मानवीय संदर्भ और οὔπω के ‘अब तक नहीं’ भाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: λύσατε αὐτὸν καὶ φέρετε
  choice: उसे खोलकर ले आओ
  rationale: बँधे पशु के लिए λύω का स्वाभाविक अर्थ ‘खोलना’ है और φέρω का यहाँ प्रसंगानुकूल अर्थ ‘ले आना’ है, बिना यह निर्धारित किए कि उसे खींचकर, हाँककर या उठाकर लाया जाए।
