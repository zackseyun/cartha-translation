  yaml_path: translation/nt/mark/011/007.yaml
  text: And they brought the colt to Jesus, and they threw their cloaks on it, and he sat on it.
translation:
  language: hi
  text: वे उस बछेड़े को यीशु के पास लाए, और उन्होंने अपने वस्त्र उस पर डाल दिए, और यीशु उस पर बैठ गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶλον
  choice: बछेड़ा
  rationale: यह शब्द किसी छोटे सवारी-पशु को सूचित करता है; प्रसंग में गदहे का बच्चा अभिप्रेत है, पर इस पद में केवल सामान्य संज्ञा आई है, इसलिए संक्षिप्त और स्वाभाविक ‘बछेड़ा’ रखा गया।
- source_word: ἱμάτια
  choice: कपड़े
  rationale: बहुवचन शब्द बाहरी वस्त्रों को दर्शाता है। सामान्य आधुनिक हिन्दी में ‘कपड़े’ स्पष्ट और सहज है।
- source_word: ἐπιβάλλουσιν
  choice: डाल दिए
  rationale: मूल क्रिया का अर्थ किसी वस्तु पर रखना या डालना है। ‘डाल दिए’ क्रिया की सक्रियता बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: ἐκάθισεν ἐπ’ αὐτόν
  choice: उस पर बैठ गए
  rationale: एकवचन कर्ता यीशु हैं और सर्वनाम बछेड़े की ओर संकेत करता है। आदरसूचक हिन्दी के अनुसार बहुवचन क्रिया-रूप प्रयुक्त हुआ है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। अंतिम उपवाक्य में अस्पष्ट सर्वनाम-कर्ता को हिन्दी की स्पष्टता के लिए ‘यीशु’ कहा गया है; इससे मूल आशय नहीं बदलता।
