    text: या, “बाहर एक द्वार के पास, गली में।” यूनानी वाक्यांश को इस अर्थ में भी समझा जा सकता है कि द्वार गली की ओर था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθον
  choice: चले गए
  rationale: यह यीशु से निर्देश मिलने के स्थान से उनके प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὗρον
  choice: पाया
  rationale: कथात्मक प्रसंग में εὑρίσκω का सीधा और सहज हिन्दी समतुल्य है।
- source_word: πῶλον
  choice: बछेड़ा
  rationale: यह शब्द किसी सवारी योग्य पशु के छोटे बच्चे को दर्शाता है; इस पद में पशु की जाति को अलग से स्पष्ट न करके यूनानी की व्यापकता बनाए रखी गई है।
- source_word: δεδεμένον
  choice: बँधा हुआ
  rationale: पूर्ण कृदन्त पशु की उस समय विद्यमान बँधी हुई अवस्था को व्यक्त करता है।
- source_word: πρὸς θύραν
  choice: एक द्वार के पास
  rationale: πρός यहाँ निकटता या स्थान का बोध देता है; यह हिन्दी में स्वाभाविक स्थानीय अभिव्यक्ति है।
- source_word: ἔξω
  choice: बाहर
  rationale: यह स्थान को किसी भवन के भीतर नहीं, बाहर बताता है।
- source_word: ἐπὶ τοῦ ἀμφόδου
  choice: गली में
  rationale: ἄμφοδον सड़क, गली या खुले मार्ग को सूचित कर सकता है; इस दृश्य में 'गली में' सहज है, जबकि स्थानगत संबंध में कुछ अस्पष्टता बनी रहती है।
- source_word: λύουσιν αὐτόν
  choice: उसे खोल दिया
  rationale: ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है; बँधे पशु के लिए 'खोल दिया' स्वाभाविक है।
