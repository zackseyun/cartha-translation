  text: And they went away and found a colt tied at a door outside on the street[a], and they untied it.
translation:
  language: hi
  text: और वे चले गए और बाहर गली में एक द्वार के पास बँधा हुआ एक बछेड़ा पाया[a], और उसकी रस्सी खोल दी।
  philosophy: optimal-equivalence
  footnotes:
