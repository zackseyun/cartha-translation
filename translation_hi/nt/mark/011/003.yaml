id: MRK.11.3
reference: Mark 11:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐάν τις ὑμῖν εἴπῃ· Τί ποιεῖτε τοῦτο; εἴπατε ⸀ὅτι Ὁ κύριος αὐτοῦ χρείαν ἔχει· καὶ ⸀εὐθὺς αὐτὸν ἀποστέλλει ⸀πάλιν ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/003.yaml
  text: And if anyone says to you[a], ‘Why are you doing this?’ say[b], ‘The Lord has need of it,’ and he will send it back here immediately.
translation:
  language: hi
  text: और यदि कोई तुमसे कहे, “तुम यह क्यों कर रहे हो?” तो कहना, “प्रभु[a] को इसकी आवश्यकता है,” और वह इसे तुरन्त फिर यहाँ भेज देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मालिक।” यूनानी κύριος का अर्थ “प्रभु” या “मालिक” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “भेजता है।” यूनानी क्रिया वर्तमान काल में है, जिसे यहाँ भावी परिणाम बताने वाला जीवंत वर्तमान समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐάν τις ὑμῖν εἴπῃ
  choice: यदि कोई तुमसे कहे
  rationale: ἐάν के साथ संभावनार्थक क्रिया भविष्य की खुली शर्त व्यक्त करती है; ‘यदि कोई…कहे’ स्वाभाविक हिन्दी में इसी अनिश्चितता को बनाए रखता है।
- source_word: Τί ποιεῖτε τοῦτο;
  choice: तुम यह क्यों कर रहे हो?
  rationale: शाब्दिक ‘तुम यह क्या कर रहे हो?’ सम्भव है, पर प्रसंग में प्रश्न कार्य पर आपत्ति या उसका कारण पूछता है; ‘क्यों’ हिन्दी में इस प्रयोग को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἴπατε
  choice: तो कहना
  rationale: बहुवचन अओरिस्ट आज्ञार्थक का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: Ὁ κύριος
  choice: प्रभु
  rationale: κύριος का अर्थ ‘प्रभु’ या ‘मालिक’ हो सकता है। मरकुस के इस प्रसंग में यह यीशु के लिए अधिकारसूचक संबोधन के रूप में अधिक स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: αὐτοῦ χρείαν ἔχει
  choice: को इसकी आवश्यकता है
  rationale: χρείαν ἔχει का अर्थ ‘आवश्यकता होना’ है, और αὐτοῦ पिछले पद के बछेड़े को दर्शाता है; हिन्दी में पशु के लिए ‘इसकी’ सहज है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस में मिलने वाली तात्कालिकता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀποστέλλει
  choice: भेज देगा
  rationale: यूनानी रूप वर्तमान काल में है, पर इस शर्तात्मक प्रसंग में उसे भावी परिणाम के रूप में समझना स्वाभाविक है; वर्तमानकालीन विकल्प पादटिप्पणी में दिया गया है।
- source_word: πάλιν ὧδε
  choice: फिर यहाँ
  rationale: πάλιν वापसी का भाव और ὧδε ‘यहाँ’ का स्थानसूचक भाव देता है; ‘फिर यहाँ भेज देगा’ हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: κύριος का अभिप्राय और अर्थ-बल
  choice: ‘प्रभु’ को यीशु के अधिकारसूचक संबोधन के रूप में रखा गया है।
  alternative: ‘मालिक’—साधारण स्वामी या अधिकार रखने वाले व्यक्ति के अर्थ में।
  rationale: वक्ता यीशु हैं और सुसमाचार के कथानक में κύριος का शीर्षकात्मक अर्थ स्वाभाविक है। फिर भी यूनानी शब्द का सामान्य अर्थ ‘मालिक’ भी हो सकता है, इसलिए वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में दी गई है।
- issue: ἀποστέλλει के वर्तमान काल का अर्थ
  choice: भावी परिणाम के रूप में ‘भेज देगा’।
  alternative: जीवंत या वास्तविक वर्तमान के रूप में ‘भेजता है’।
  rationale: शर्त पूरी होने के बाद अपेक्षित कार्य का उल्लेख होने के कारण हिन्दी में भविष्य काल सहज है, पर यूनानी वर्तमान रूप की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘आवश्यकता है’ मूल अभिव्यक्ति की गरिमा बनाए रखता है, जबकि प्रश्न और आज्ञा सहज हिन्दी में हैं।
