source:
  edition: SBLGNT
  text: Καὶ εἰσῆλθεν εἰς ⸀Ἱεροσόλυμα εἰς τὸ ἱερόν· καὶ περιβλεψάμενος πάντα ⸀ὀψὲ ἤδη οὔσης τῆς ὥρας ἐξῆλθεν εἰς Βηθανίαν μετὰ τῶν δώδεκα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/011.yaml
  text: And he entered Jerusalem[a], into the temple courts; and after looking around at everything, since it was already late[c][b], he went out to Bethany with the twelve.
translation:
  language: hi
  text: और वह यरूशलेम में मन्दिर-परिसर[a] में प्रवेश किया। सब कुछ चारों ओर देखकर, क्योंकि देर हो चुकी थी[b], वह बारहों[c] के साथ बैतनियाह चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मन्दिर’; यूनानी शब्द पूरे मन्दिर-क्षेत्र के लिए है, केवल भीतरी पवित्र भवन के लिए नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘जब देर हो चुकी थी’ अथवा ‘क्योंकि दिन काफ़ी ढल चुका था।’
    reason: lexical_alternative
  - marker: c
    text: अर्थात् यीशु के बारह शिष्य।
    reason: referent_clarification
lexical_decisions:
- source_word: εἰσῆλθεν
  choice: आया ... गया
  rationale: एक ही यूनानी क्रिया के साथ यरूशलेम और मन्दिर-परिसर की ओर गति व्यक्त हुई है। हिन्दी में ‘यरूशलेम में आया और मन्दिर-परिसर में गया’ दोनों गन्तव्यों को स्वाभाविक और स्पष्ट रखता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: τὸ ἱερόν
  choice: मन्दिर-परिसर
  rationale: ἱερόν पूरे मन्दिर-क्षेत्र को दर्शाता है, केवल भीतरी पवित्र भवन (ναός) को नहीं; इसलिए यह स्थानिक भेद बनाए रखता है।
- source_word: περιβλεψάμενος πάντα
  choice: वहाँ सब कुछ चारों ओर देखने के बाद
  rationale: περιβλέπομαι के चारों ओर दृष्टि डालने और πάντα की व्यापकता, दोनों को रखते हुए पूर्वकालिक कृदन्त का क्रम ‘के बाद’ से व्यक्त किया गया है। ‘वहाँ’ हिन्दी में सन्दर्भ स्पष्ट करता है, यद्यपि यूनानी में निहित है।
- source_word: ὀψὲ ἤδη οὔσης τῆς ὥρας
  choice: क्योंकि दिन काफ़ी ढल चुका था
  rationale: समय-सूचक genitive absolute को स्वाभाविक हिन्दी में प्रस्तुत करता है और प्रस्थान की परिस्थितिजन्य/कारणात्मक संगति बनाए रखता है। ‘दिन ढलना’ देर हो जाने का सामान्य, गरिमापूर्ण मुहावरा है।
- source_word: ἐξῆλθεν
  choice: चला गया
  rationale: सन्दर्भ में मन्दिर/नगर से निकलकर बैतनियाह की ओर प्रस्थान अभिप्रेत है। ‘चला गया’ हिन्दी में गन्तव्य के साथ स्वाभाविक है; निकलने का भाव प्रसंग से स्पष्ट है।
- source_word: Βηθανίαν
  choice: बैतनियाह
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: μετὰ τῶν δώδεκα
  choice: उन बारहों के साथ
  rationale: निश्चित लेख के कारण पहचाने हुए बारह व्यक्तियों का संकेत ‘उन बारहों’ से स्पष्ट होता है, बिना इसे औपचारिक उपाधि बना देने के।
theological_decisions:
- issue: τὸ ἱερόν का स्थानिक सन्दर्भ
  choice: मन्दिर-परिसर
  alternative: मन्दिर
  rationale: यह शब्द व्यापक मन्दिर-क्षेत्र के लिए है, न कि विशेषतः भीतरी पवित्र भवन के लिए। अनुवाद इस भेद को सुरक्षित रखता है और यीशु द्वारा चारों ओर सब कुछ देखने के वर्णन से मेल खाता है।
- issue: οἱ δώδεκα की समूह-पहचान
  choice: उन बारहों
  alternative: बारह शिष्य / बारह प्रेरित
  rationale: मूल पाठ केवल ‘बारह’ कहता है। ‘शिष्य’ या ‘प्रेरित’ जोड़ने के बजाय मुख्य पाठ मूल की संक्षिप्तता रखता है; पादटिप्पणी सन्दर्भित व्यक्तियों को स्पष्ट करती है।
- issue: ὀψὲ ἤδη οὔσης τῆς ὥρας का सम्बन्ध
  choice: क्योंकि दिन काफ़ी ढल चुका था
  alternative: जब दिन काफ़ी ढल चुका था
  rationale: genitive absolute समय-परिस्थिति देता है और प्रस्थान के कारण का संकेत भी दे सकता है। ‘क्योंकि’ अंग्रेज़ी परामर्श-पाठ के अनुरूप कारणात्मक छाया व्यक्त करता है, जबकि पादटिप्पणी अधिक शुद्ध कालगत विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, कथात्मक और गरिमापूर्ण रूप अपनाया गया है। ‘मन्दिर-परिसर’ स्थानिक शुद्धता देता है; ‘दिन काफ़ी ढल चुका था’ सामान्य पाठक के लिए स्वाभाविक है। ‘उन बारहों’ मूल की संक्षिप्तता और निश्चित समूह-सन्दर्भ दोनों को बनाए रखता है।
