  choice: और उन्होंने
  rationale: संदर्भ में यह शिष्यों की ओर संकेत करता है; δέ को सहज कथा-प्रवाह के लिए ‘और’ से व्यक्त किया गया है।
- source_word: εἶπαν αὐτοῖς
  choice: उन्होंने उनसे ... कहा
  rationale: यह सामान्य रूप से किसी से कुछ कहने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: καθὼς εἶπεν ὁ Ἰησοῦς
  choice: ठीक वही ... जो यीशु ने कहा था
  rationale: καθώς उत्तर और यीशु के पूर्व निर्देश के बीच ठीक अनुरूपता बताता है; ‘कहा था’ पहले हुई बात को स्पष्ट करता है।
- source_word: ἀφῆκαν αὐτούς
  choice: उन्होंने उन्हें जाने दिया
  rationale: संदर्भ में उपस्थित लोगों ने शिष्यों को गधी के बच्चे को ले जाने से रोकना छोड़ दिया; यह ἀφίημι के अनुमति देने/छोड़ देने वाले अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
