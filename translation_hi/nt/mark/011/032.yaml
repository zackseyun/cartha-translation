  text: ἀλλὰ εἴπωμεν· Ἐξ ἀνθρώπων;— ἐφοβοῦντο τὸν ⸀ὄχλον, ἅπαντες γὰρ εἶχον τὸν Ἰωάννην ⸂ὄντως ὅτι⸃ προφήτης ἦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/032.yaml
  text: But if we say[a], ‘From men’?”—they were afraid of the crowd[b], for everyone held that John truly was a prophet.
translation:
  language: hi
  text: पर यदि हम कहें[a], ‘मनुष्यों से’?”—वे भीड़ से डरते थे, क्योंकि सभी यूहन्ना को सचमुच एक भविष्यद्वक्ता मानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर क्या हम कहें, ‘मनुष्यों से’?”
    reason: यूनानी संभाव्य क्रिया को इस विचार-विमर्श के प्रसंग में प्रश्नवाचक ढंग से भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἀλλὰ εἴπωμεν
  choice: पर यदि हम कहें
  rationale: यह उनके विचार-विमर्श में दूसरे विकल्प को सामने लाता है और यूनानी के विरोध तथा संभाव्य भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Ἐξ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: ἐξ स्रोत को दर्शाता है। यह पदबंध यूहन्ना के बपतिस्मे या अधिकार के मानवीय स्रोत की बात करता है और ‘मानवीय उत्पत्ति का’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: ἐφοβοῦντο τὸν ὄχλον
  choice: वे भीड़ से डरते थे
  rationale: अपूर्णकालीन क्रिया उस परिस्थिति में बने हुए भय को व्यक्त करती है; ‘भीड़’ मरकुस में ὄχλος का सहज आधुनिक हिन्दी रूप है।
- source_word: ἅπαντες γὰρ
  choice: क्योंकि सभी
  rationale: γὰρ उनके डर का कारण देता है और ἅπαντες का व्यापक अर्थ ‘सभी’ से संक्षेप में सुरक्षित रहता है।
- source_word: εἶχον
  choice: मानते थे
  rationale: यहाँ ἔχω किसी के विषय में दृढ़ धारणा रखने के अर्थ में है; ‘मानते थे’ हिन्दी में स्वाभाविक रूप से वही भाव देता है।
- source_word: ὄντως ὅτι προφήτης ἦν
  choice: सचमुच मानते थे कि यूहन्ना एक भविष्यद्वक्ता था
  rationale: ‘सचमुच’ ὄντως की बलवत्ता को रखता है, जबकि ‘कि ... था’ उस विश्वास की कथ्य-वस्तु को स्पष्ट करता है। ‘एक भविष्यद्वक्ता’ हिन्दी में अनिश्चित विधेय का स्वाभाविक रूप है।
theological_decisions:
- issue: Ἐξ ἀνθρώπων में यूहन्ना के बपतिस्मे या अधिकार के स्रोत का वर्णन
  choice: मनुष्यों की ओर से
  alternative: मानवीय स्रोत से / मनुष्यों से
  rationale: मुख्य पाठ स्रोत के मानवीय होने को व्यक्त करता है, लेकिन ‘केवल मनुष्य-निर्मित’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: ὄντως का संबंध और यूहन्ना के भविष्यद्वक्ता होने का कथन
  choice: सभी सचमुच मानते थे कि यूहन्ना एक भविष्यद्वक्ता था
  alternative: सभी यूहन्ना को सचमुच एक भविष्यद्वक्ता मानते थे
  rationale: दोनों वाक्य-विन्यास जनता की दृढ़ धारणा बताते हैं। चुना हुआ रूप कथन को उनके मत के भीतर रखता है और इसे कथावाचक की अलग, नई घोषणा नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मनुष्यों की ओर से’ मूल के स्रोत-संबंधी रूप को बचाता है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
