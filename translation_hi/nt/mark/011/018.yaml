  text: καὶ ἤκουσαν οἱ ⸂ἀρχιερεῖς καὶ οἱ γραμματεῖς⸃, καὶ ἐζήτουν πῶς αὐτὸν ἀπολέσωσιν· ἐφοβοῦντο γὰρ αὐτόν, ⸂πᾶς γὰρ⸃ ὁ ὄχλος ἐξεπλήσσετο ἐπὶ τῇ διδαχῇ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/018.yaml
  text: And the chief priests and the scribes heard it[a], and they were seeking how they might destroy him, for they feared him, because the whole crowd was astonished at his teaching.
translation:
  language: hi
  text: और प्रधान याजकों और शास्त्रियों ने यह सुना, और वे उसे नष्ट करने का उपाय ढूँढ़ रहे थे, क्योंकि वे उससे डरते थे; क्योंकि सारी भीड़ उसकी शिक्षा से चकित थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤκουσαν
  choice: यह सुना
  rationale: क्रिया का अर्थ ‘सुना’ या ‘इस बात का समाचार पाया’ हो सकता है। हिन्दी में ‘यह’ पिछले प्रसंग में यीशु के मन्दिर में किए और कहे गए कार्यों की ओर स्वाभाविक संकेत करता है, बिना विषय को आवश्यकता से अधिक निश्चित किए।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह यरूशलेम के प्रमुख याजकीय नेतृत्व के लिए प्रचलित सामूहिक पदनाम है; बहुवचन में ‘महायाजक’ कहना एक ही पद के अनेक समकालीन धारकों का भ्रामक संकेत दे सकता है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों में यह यहूदी धर्मशास्त्रीय और व्यवस्था-विशेषज्ञ वर्ग का स्थापित, संक्षिप्त हिन्दी पद है।
- source_word: ἐζήτουν
  choice: उपाय ढूँढ़ने लगे
  rationale: अपूर्ण भूतकाल चल रहे प्रयास को व्यक्त करता है। πῶς के साथ यह वाक्यांश उन्हें उसे समाप्त करने का तरीका खोजते हुए स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: ἀπολέσωσιν
  choice: उसे नष्ट करने
  rationale: ἀπόλλυμι का अर्थ व्यापक रूप से ‘नष्ट करना’ और प्रसंगानुसार ‘मार डालना’ हो सकता है। मुख्य पाठ व्यापक शाब्दिक अर्थ रखता है, जबकि पादटिप्पणी प्रसंग में निहित घातक आशय स्पष्ट करती है।
- source_word: ἐφοβοῦντο
  choice: वे उससे डरते थे
  rationale: अपूर्ण भूतकाल लगातार बने हुए भय को दर्शाता है; हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: यह सामूहिक और बलयुक्त अभिव्यक्ति है, जो भीड़ की व्यापक प्रतिक्रिया दिखाती है।
- source_word: ἐξεπλήσσετο
  choice: चकित थी
  rationale: यह तीव्र आश्चर्य की जारी अवस्था व्यक्त करता है। ‘चकित थी’ आधुनिक हिन्दी में स्वाभाविक है और प्रतिक्रिया की शक्ति बनाए रखता है।
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: उसकी शिक्षा से
  rationale: ἐπί तथा सम्प्रदान यहाँ आश्चर्य के आधार या कारण को दिखाते हैं; ‘शिक्षा से’ हिन्दी में स्वाभाविक कारण-संबंध व्यक्त करता है।
theological_decisions:
- issue: ἀπολέσωσιν में अगुओं के आशय का दायरा
  choice: मुख्य पाठ में ‘उसे नष्ट करने’ रखा गया है।
  alternative: ‘उसे मार डालने’ या ‘उसकी हत्या करने’
  rationale: निकटवर्ती प्रसंग घातक षड्यंत्र की ओर संकेत करता है, पर यूनानी क्रिया का शब्दार्थ इससे व्यापक है। इसलिए मुख्य पाठ उसकी व्यापकता बनाए रखता है और पादटिप्पणी प्रसंगगत घातक आशय बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘प्रधान याजक’ और ‘शास्त्री’ जैसे स्थापित बाइबलीय पदनाम बनाए गए हैं; वाक्य के कारण-संबंध को स्पष्ट करने के लिए γάρ के दूसरे प्रयोग को ‘कारण यह था कि’ से व्यक्त किया गया है।
