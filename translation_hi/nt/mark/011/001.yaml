  text: Καὶ ὅτε ἐγγίζουσιν εἰς Ἱεροσόλυμα εἰς Βηθφαγὴ καὶ Βηθανίαν πρὸς τὸ Ὄρος τῶν Ἐλαιῶν, ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/001.yaml
  text: And when they were approaching Jerusalem[a], at Bethphage and Bethany, near the Mount of Olives[b], he sends two of his disciples
translation:
  language: hi
  text: जब वे यरूशलेम के निकट पहुँच रहे थे—बैतफगे और बैतनिय्याह के पास, जैतून का पहाड़ के निकट[a]—तब वह अपने शिष्यों में से दो को भेजता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम के निकट पहुँच रहे थे—बैतफगे और बैतनिय्याह की ओर, जैतून के पहाड़ की ओर।” यूनानी स्थान-सूचक पूर्वसर्ग निकटता या दिशा, दोनों ढंग से समझे जा सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: मरकुस वर्णन में प्रायः ऐतिहासिक वर्तमान काल का प्रयोग करता है; इसलिए “भेजता है” का अनुवाद “भेजा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγγίζουσιν
  choice: निकट पहुँच रहे थे
  rationale: यूनानी वर्तमान काल मरकुस की ऐतिहासिक-वर्तमान कथन-शैली का भाग है। हिंदी में अपूर्ण भूतकाल यहाँ यात्रा की जारी गति और स्वाभाविक कथाप्रवाह दोनों व्यक्त करता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम के निकट
  rationale: ἐγγίζω के साथ εἰς उस स्थान को बताता है जिसके निकट वे आ रहे थे; हिंदी में ‘यरूशलेम के निकट पहुँचना’ स्वाभाविक है।
- source_word: εἰς Βηθφαγὴ καὶ Βηθανίαν
  choice: बैतफगे और बैतनियाह के पास
  rationale: दूसरा εἰς मार्ग में पहुँचे हुए क्षेत्र या दिशा को सूचित कर सकता है। ‘के पास’ हिंदी में दोनों स्थानों की भौगोलिक निकटता को सहज रूप से व्यक्त करता है, जबकि दिशात्मक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: πρὸς τὸ Ὄρος τῶν Ἐλαιῶν
  choice: जैतून के पहाड़ के निकट
  rationale: πρός यहाँ स्थानगत निकटता या अभिमुखता व्यक्त कर सकता है। मुख्य पाठ में ‘के निकट’ प्रसंग के स्थानगत अर्थ को सहज रखता है; ‘की ओर’ पादटिप्पणी में दिया गया है।
- source_word: ἀποστέλλει
  choice: भेजता है
  rationale: ऐतिहासिक वर्तमान को बनाए रखने से मरकुस की जीवंत कथन-शैली सुनाई देती है; हिंदी में इसे भूतकाल से भी व्यक्त किया जा सकता है।
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: अपने शिष्यों में से दो को
  rationale: यह अंशात्मक संबंध और यीशु से उनका संबंध दोनों को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: Βηθφαγὴ
  choice: बैतफगे
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: Βηθανίαν
  choice: बैतनियाह
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: Ὄρος τῶν Ἐλαιῶν
  choice: जैतून का पहाड़
  rationale: यूनानी संबंधकारक पदबंध का स्पष्ट और हिंदी में प्रचलित भौगोलिक नाम।
