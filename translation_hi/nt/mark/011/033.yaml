  revision_rationale: The revision removes the added inferential force of “तो,” retains the Greek negative symmetry, and supplies a correctly anchored Hindi lexical-alternative footnote. No change is made to the passage’s meaning, its plural reference to Jesus’ actions, or its modern formal Hindi register.
