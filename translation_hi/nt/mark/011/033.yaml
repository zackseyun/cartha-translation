  text: καὶ ἀποκριθέντες ⸂τῷ Ἰησοῦ λέγουσιν⸃· Οὐκ οἴδαμεν. καὶ ὁ ⸀Ἰησοῦς λέγει αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/033.yaml
  text: And answering Jesus[a], they say, “We do not know.” And Jesus says to them, “Neither do I tell you by what authority I do these things.”
translation:
  language: hi
  text: उन्होंने यीशु को उत्तर दिया, “हम नहीं जानते।” और यीशु ने उनसे कहा, “मैं भी तुम्हें नहीं बताता कि मैं ये काम किस अधिकार[a] से करता हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किस अधिकार के बल पर।”
    reason: ἐν ποίᾳ ἐξουσίᾳ can idiomatically express the authority by which or with which an action is done; the note preserves this lexical alternative and is anchored to “अधिकार.”
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: उत्तर दिया
  rationale: यह कृदन्त उनके प्रत्युत्तर को सीधे कथन से जोड़ता है। हिन्दी में ‘उत्तर दिया’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: Οὐκ οἴδαμεν
  choice: हम नहीं जानते
  rationale: यूनानी पूर्णकाल यहाँ वर्तमान अवस्था का बोध कराता है; हिन्दी का सामान्य वर्तमान इसे स्पष्ट रूप से व्यक्त करता है।
- source_word: Οὐδὲ ἐγὼ λέγω ὑμῖν
  choice: तो मैं भी तुम्हें नहीं बताता
  rationale: ‘तो…भी नहीं’ उनके उत्तर के प्रत्युत्तर में यीशु के समानान्तर निषेध को स्वाभाविक हिन्दी में बनाए रखता है। परोक्ष प्रश्न से पहले λέγω के लिए ‘बताता’ हिन्दी में अधिक सहज है।
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: यह कार्य करने के आधार, अधिकार या प्राधिकरण को व्यक्त करने वाला स्वाभाविक हिन्दी प्रयोग है और यूनानी वाक्यांश की पर्याप्त व्यापकता बनाए रखता है।
- source_word: ταῦτα ποιῶ
  choice: मैं ये काम…करता हूँ
  rationale: ‘ये काम’ बहुवचन ταῦτα को सुरक्षित रखता है और यीशु के हाल के कार्यों तथा गतिविधियों की ओर संकेत करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। यूनानी ऐतिहासिक वर्तमान को कठोरता से दोहराने के बजाय हिन्दी कथन-शैली के अनुसार ‘कहा’ रखा गया है, जबकि यीशु के अंतिम कथन में वर्तमान ‘बताता/करता हूँ’ सुरक्षित है।
