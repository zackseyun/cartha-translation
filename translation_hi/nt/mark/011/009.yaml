  text: καὶ οἱ προάγοντες καὶ οἱ ἀκολουθοῦντες ⸀ἔκραζον· Ὡσαννά· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/009.yaml
  text: And those going ahead and those following were crying out[b][a], “Hosanna! Blessed is the one who comes in the name of the Lord!”
translation:
  language: hi
  text: और जो लोग आगे चल रहे थे और जो पीछे आ रहे थे, वे पुकार रहे थे, “होशाना![a] धन्य है वह जो प्रभु के नाम से आता है!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “होशाना” इब्रानी/अरामी उपासना-संबंधी पुकार है, जिसका अर्थ लगभग “कृपया बचा ले” या “अब बचा ले” है; यहाँ यह स्तुति की जय-पुकार के रूप में भी प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: यह जयघोष भजन 118:26 की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: οἱ προάγοντες
  choice: जो लोग आगे चल रहे थे
  rationale: वर्तमान कृदंत जुलूस में यीशु के आगे चल रहे समूह को दर्शाता है; यह रूप जारी क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ ἀκολουθοῦντες
  choice: जो पीछे आ रहे थे
  rationale: यह पहले कृदंत के समानांतर है और यीशु के पीछे आते लोगों को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: ἔκραζον
  choice: पुकार रहे थे
  rationale: अपूर्ण भूतकाल लगातार या बार-बार की जा रही सार्वजनिक जय-पुकार का भाव देता है।
- source_word: Ὡσαννά
  choice: होशाना
  rationale: इब्रानी/अरामी से आया यह उपासना-संबंधी उद्गार पहली सदी तक विनती और स्तुति की जय-पुकार—दोनों का भाव रखता था; लिप्यंतरण उसके पारंपरिक और शास्त्रीय स्वर को सुरक्षित रखता है।
- source_word: Εὐλογημένος
  choice: धन्य है
  rationale: आशीर्वचन के इस सूत्र और भजन 118:26 की प्रतिध्वनि के लिए यह सटीक तथा प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: ὁ ἐρχόμενος
  choice: वह जो ... आता है
  rationale: संज्ञा की तरह प्रयुक्त वर्तमान कृदंत का स्वाभाविक अनुवाद है; इसमें कोई अतिरिक्त मसीही उपाधि नहीं जोड़ी गई।
- source_word: ἐν ὀνόματι κυρίου
  choice: प्रभु के नाम से
  rationale: यह प्रभु के अधिकार और प्रतिनिधित्व में आने का बाइबलीय मुहावरा है और भजन की प्रतिध्वनि को बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के लिए मानक, गरिमापूर्ण हिन्दी पद।
theological_decisions:
- issue: क्या जयघोष में मसीही पहचान को अनुवाद में स्पष्ट किया जाए
  choice: “धन्य है वह जो प्रभु के नाम से आता है” के उद्धरण-सदृश शब्द बनाए रखे गए।
  alternative: “धन्य है वह मसीह जो प्रभु के नाम से आता है” या कोई राजकीय उपाधि जोड़ना।
  rationale: संदर्भ में कथन का मसीही महत्त्व है, पर यूनानी पाठ इस पद में “मसीह” या “राजा” नहीं जोड़ता। भजन 118:26 की भाषा बनाए रखने से धार्मिक अर्थ सुरक्षित रहता है, बिना व्याख्यात्मक विस्तार के।
- issue: “होशाना” को विनती मानें या स्तुति
  choice: मुख्य पाठ में पारंपरिक जयघोष “होशाना” रखा और उसके मूल विनतीपरक अर्थ को पाद-टिप्पणी में बताया।
  alternative: मुख्य पाठ में केवल “कृपया बचा” या “अभी बचा” अनुवाद करना।
  rationale: यह शब्द मूलतः उद्धार की विनती है, पर इस प्रसंग में उत्सवी स्तुति और अभिनंदन की पुकार भी है; लिप्यंतरण इस दोहरे भाव को समय से पहले सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। समानांतर समूहों तथा अपूर्ण भूतकाल की जारी क्रिया को बनाए रखा गया है। पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं और जिस विषय को समझाते हैं उसके निकट रखे गए हैं।
