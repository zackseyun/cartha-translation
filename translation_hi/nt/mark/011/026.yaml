source:
  edition: robinson-pierpont-2005-byzantine
  text: Εἰ δὲ ὑμεῖς οὐκ ἀφίετε, οὐδὲ ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς ἀφήσει τὰ παραπτώματα ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/nt/mark/011/026.yaml
  text: But[a] if you do not forgive, neither will your Father who is in heaven forgive your trespasses.
translation:
  language: hi
  text: परन्तु[a] यदि तुम क्षमा नहीं करते, तो तुम्हारा पिता भी, जो स्वर्ग में है, तुम्हारे अपराध क्षमा नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद सबसे प्राचीन यूनानी पाण्डुलिपियों में नहीं मिलता—इनमें चौथी शताब्दी की सीनैटिकस और वैटिकनस पाण्डुलिपियाँ भी शामिल हैं—और आरम्भिक कॉप्टिक अनुवादों में भी अनुपस्थित है। परन्तु यह बीजान्टिन बहुसंख्यक पाठ-परम्परा, लैटिन परम्परा और अधिकांश सीरियाई साक्षियों में मिलता है। सम्भवतः बाद के नकलनवीसों ने इसे मत्ती 6:15 में यीशु के वचनों के अनुरूप बनाने के लिए जोड़ा।
    reason: textual_critical
lexical_decisions:
- source_word: ἀφίημι
  choice: क्षमा करना
  rationale: मनुष्यों के अपराधों और परमेश्वर की क्षमा—दोनों के संदर्भ में यह प्रचलित, स्वाभाविक और सटीक हिन्दी अभिव्यक्ति है।
- source_word: παράπτωμα
  choice: अपराध
  rationale: यह गलत कदम, चूक या मर्यादा-भंग से उत्पन्न दोष का भाव व्यक्त करता है और सामान्य शब्द ‘पाप’ से यूनानी शब्द का भेद यथासंभव बनाए रखता है।
- source_word: ὁ πατὴρ ὑμῶν ὁ ἐν τοῖς οὐρανοῖς
  choice: तुम्हारा पिता भी, जो स्वर्ग में है
  rationale: सम्बन्धवाचक यूनानी वाक्यांश को स्पष्ट और स्वाभाविक हिन्दी में रखते हुए पिता की पहचान तथा स्थान-सूचक कथन दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: मानवीय क्षमा और पिता की क्षमा के बीच सम्बन्ध
  choice: 'मूल पाठ की स्पष्ट शर्त को ज्यों का त्यों रखा गया है: ‘यदि तुम क्षमा नहीं करते ... क्षमा नहीं करेगा।’'
  alternative: इसे केवल क्षमा पाए हुए व्यक्ति के प्रमाण या सामान्य नैतिक सिद्धान्त के रूप में समझाकर नरम करना।
  rationale: यूनानी वाक्य सीधे शर्त और परिणाम बताता है; किसी विशिष्ट धर्मवैज्ञानिक प्रणाली के अनुसार इस तनाव को हल करना अनुवाद का कार्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली अपनाई गई है। ‘परन्तु’ δέ के विरोधसूचक बल को व्यक्त करता है; ‘स्वर्ग में’ हिन्दी में स्वाभाविक है, यद्यपि यूनानी रूप शाब्दिक रूप से बहुवचन ‘स्वर्गों में’ है।
