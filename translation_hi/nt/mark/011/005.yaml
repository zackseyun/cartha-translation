  verdict: revise
  source_fidelity: The draft accurately represents the unspecified subset, those present, the addressed plural, and the action of untying. However, it adds the motive-question «क्यों» (“why”), whereas τί ποιεῖτε asks what they are doing, and the Greek participle λύοντες specifies the action without introducing a separate why-question.
  naturalness: «वहाँ खड़े लोगों में से कुछ उनसे कहने लगे» and the direct speech are natural modern Hindi. Recasting the question as «उस बछेड़े को खोलते हुए तुम क्या कर रहे हो?» is both idiomatic and closer to the Greek’s single question.
  terminology: «बछेड़ा» suitably renders «colt» in the main text, while the footnote supplies the contextually likely «गधे का बच्चा». The note should not imply that πῶλος intrinsically means only a young donkey; it is a broader term for a young animal, though the context identifies this one as a donkey.
  issues:
  - severity: medium
    issue: The translation adds «क्यों» in «इस बछेड़े को क्यों खोल रहे हो?»
    rationale: τί ποιεῖτε means “What are you doing?” The participle λύοντες (“untying”) describes the action being questioned. Adding “why” narrows or alters the question’s force and is not explicit in the source.
  - severity: low
    issue: The Greek’s one-question construction is rendered as two questions.
    rationale: This is not inherently wrong in Hindi, but a participial construction more directly preserves the relationship between τί ποιεῖτε and λύοντες.
