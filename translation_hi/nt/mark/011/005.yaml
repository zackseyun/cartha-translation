    reason: lexical_alternative
lexical_decisions:
- source_word: τινες
  choice: कुछ
  rationale: यह उपस्थित लोगों के एक अनिर्दिष्ट समूह को दर्शाता है; ‘कुछ’ स्वाभाविक हिन्दी है और अनिश्चितता बनाए रखता है।
- source_word: τῶν ἐκεῖ ἑστηκότων
  choice: वहाँ खड़े लोगों में से
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदंत और ἐκεῖ दोनों को स्वाभाविक हिन्दी में निकटता से व्यक्त करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल को हिन्दी में आरंभ होती हुई वाणी के रूप में स्वाभाविक ढंग से व्यक्त करता है, बिना बार-बार कहने का अर्थ थोपे।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: बहुवचन सर्वनाम उन शिष्यों को सूचित करता है जिन्हें वहाँ खड़े लोग संबोधित कर रहे थे।
- source_word: Τί ποιεῖτε
  choice: तुम यह क्या कर रहे हो?
  rationale: प्रत्यक्ष प्रश्न और वर्तमान में चल रही क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘यह’ प्रसंगगत क्रिया की ओर संकेत करता है।
- source_word: λύοντες
  choice: खोल रहे हो
  rationale: बँधे हुए पशु की रस्सी खोलने के प्रसंग में यह सबसे स्वाभाविक हिन्दी प्रयोग है।
- source_word: τὸν πῶλον
  choice: इस बछेड़े को
  rationale: πῶλος मूलतः किसी पशु के बच्चे को कह सकता है; ‘बछेड़ा’ इस सामान्यता को काफी हद तक बनाए रखता है और प्रसंग में गधे के बच्चे के लिए समझा जा सकता है।
