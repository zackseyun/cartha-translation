  text: ὁ δὲ Πιλᾶτος βουλόμενος τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι ἀπέλυσεν αὐτοῖς τὸν Βαραββᾶν, καὶ παρέδωκεν τὸν Ἰησοῦν φραγελλώσας ἵνα σταυρωθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/015.yaml
  text: So Pilate[a], wanting to satisfy the crowd, released Barabbas to them; and after having Jesus flogged, he handed him over to be crucified.
translation:
  language: hi
  text: तब पिलातुस ने भीड़ को संतुष्ट करने की इच्छा से[a] उनके लिए बरअब्बा को रिहा कर दिया; और यीशु को कोड़े लगवाकर क्रूस पर चढ़ाए जाने के लिए सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “भीड़ को प्रसन्न करने की इच्छा से।” शाब्दिक अर्थ: “भीड़ के लिए जो पर्याप्त था वह करना।”'
    reason: मूल यूनानी मुहावरे के वैकल्पिक और शाब्दिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: βουλόμενος
  choice: चाहा
  rationale: यह कृदंत पिलातुस की इच्छा या मंशा व्यक्त करता है। ‘चाहा’ सहज आधुनिक हिन्दी है और अनावश्यक रूप से गहरी योजना का भाव नहीं जोड़ता।
- source_word: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι
  choice: भीड़ को संतुष्ट करना
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘भीड़ के लिए पर्याप्त काम करना’ है; प्रसंग में इसका अर्थ उनकी माँग मानकर उन्हें संतुष्ट करना है। यह ‘प्रसन्न करना’ की अपेक्षा राजनीतिक दबाव और नैतिक तनाव को बेहतर बनाए रखता है।
- source_word: ἀπέλυσεν
  choice: छोड़ दिया
  rationale: न्यायिक प्रसंग में इसका अर्थ किसी बंदी को रिहा करना है। ‘छोड़ दिया’ सामान्य, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: सम्प्रदान कारक भीड़ की माँग के पक्ष में किए गए रिहाई के निर्णय को दर्शाता है। हिन्दी में ‘उनके लिए’ यह संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: παρέδωκεν
  choice: सौंप दिया
  rationale: यह क्रिया यीशु को दूसरों के अधिकार में दिए जाने का भाव रखती है और दुःखभोग-वर्णन की महत्त्वपूर्ण शब्दावली को स्पष्ट हिन्दी में सुरक्षित करती है।
- source_word: φραγελλώσας
  choice: कोड़े लगवाकर
  rationale: पूर्वकालिक कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है। प्रसंग में पिलातुस ने स्वयं कोड़े नहीं लगाए, बल्कि लगवाए; अतः प्रेरणार्थक रूप क्रम और भूमिका दोनों स्पष्ट करता है।
- source_word: ἵνα σταυρωθῇ
  choice: क्रूस पर चढ़ाए जाने के लिए
  rationale: ἵνα-उपवाक्य यहाँ सौंपे जाने का उद्देश्य या अपेक्षित परिणाम बताता है। कर्मवाच्य रूप मूल पाठ के कर्मवाच्य को सुरक्षित रखता है।
- source_word: Βαραββᾶν
  choice: बरअब्बा
  rationale: नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: नाम को मानक हिन्दी बाइबलीय रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: τῷ ὄχλῳ τὸ ἱκανὸν ποιῆσαι में पिलातुस की मंशा
  choice: पिलातुस ने भीड़ की माँग पूरी करके उसे संतुष्ट करना चाहा
  alternative: पिलातुस ने भीड़ को प्रसन्न करना चाहा; अथवा भीड़ के लिए पर्याप्त काम करना चाहा
  rationale: मुहावरा राजनीतिक तुष्टीकरण की ओर संकेत करता है, केवल सद्भावपूर्ण प्रसन्नता की ओर नहीं। ‘संतुष्ट करना’ मूल की नैतिक और राजनीतिक तनावपूर्ण स्थिति को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘कोड़े लगवाकर’ पिलातुस की आदेशात्मक भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है; ‘क्रूस पर चढ़ाए जाने’ से मूल का कर्मवाच्य सुरक्षित रहता है।
