lexical_decisions:
- source_word: ἐπιγραφή
  choice: लेख
  rationale: यह क्रूस पर या उसके ऊपर लगाए गए लिखित आरोप-सूचक पाठ को दर्शाता है। ‘लेख’ संक्षिप्त, स्वाभाविक और औपचारिक अर्थ को बनाए रखता है।
- source_word: αἰτία
  choice: उस पर लगाए गए आरोप
  rationale: इस न्यायिक संदर्भ में यह शब्द अभियोग या दोषारोपण का आधार बताता है। यह अभिव्यक्ति कानूनी भाव को स्पष्ट करती है, पर मूल से अधिक विस्तार नहीं करती।
- source_word: ἐπιγεγραμμένη
  choice: लिखा था
  rationale: ἦν के साथ पूर्ण कृदंत यह बताता है कि लेख लिखी हुई अवस्था में वहाँ मौजूद था। ‘लिखा था’ आधुनिक हिन्दी में सहज है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: यह आरोप में प्रयुक्त राजकीय पदवी है; हिन्दी में ‘राजा’ स्वाभाविक और सटीक है।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: मरकुस के दुःखभोग-वृत्तांत में यह यीशु के लिए प्रयुक्त स्थापित जनसमूह-सूचक पदवी का भाग है। ‘यहूदियों’ परिचित और व्यापक अर्थ को बनाए रखता है; भौगोलिक विकल्प फुटनोट में दिया गया है।
theological_decisions:
- issue: क्रूस के शीर्षक में Ἰουδαίων का अनुवाद
  choice: यहूदियों
  alternative: यहूदिया-वासियों
  rationale: यह पद रोमी आरोप अथवा राजकीय दावे के रूप में प्रस्तुत है। ‘यहूदियों का राजा’ सुसमाचारों में पहचानी जाने वाली पदवी को बनाए रखता है और संदर्भ में अनकहे संकुचित भौगोलिक अर्थ को मुख्य पाठ में नहीं थोपता। फिर भी Ἰουδαῖος के संभव क्षेत्रीय अर्थ को फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। वाक्य-विन्यास यूनानी की सूचना-रचना के निकट है, किंतु हिन्दी में स्वाभाविक बनाया गया है।
