revisions:
- from: जब छठा घंटा आया[a], तो सारे देश[b] पर अन्धकार छा गया और नौवें घंटे तक रहा।
  to: जब छठा घंटा आया[a], तब पूरी भूमि[b] पर अंधकार छा गया, और वह नौवें घंटे तक रहा।
  rationale: Revision replaces the politically specific ‘देश’ with ‘भूमि’ to preserve the Greek term’s scope ambiguity more faithfully and updates the associated alternative-reading note. The time note is recast as a single interval for clarity. No theological conclusion about the geographical extent of the darkness is imposed.
