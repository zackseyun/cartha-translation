  text: ⸂Καὶ γενομένης⸃ ὥρας ἕκτης σκότος ἐγένετο ἐφ’ ὅλην τὴν γῆν ἕως ὥρας ἐνάτης.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/033.yaml
  text: And when the sixth hour had come[b][a], darkness came over the whole land until the ninth hour.
translation:
  language: hi
  text: जब छठा घंटा आया[a], तब पूरी भूमि[b] पर अंधकार छा गया, और वह नौवें घंटे तक रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात लगभग दोपहर बारह बजे से दोपहर तीन बजे तक।
    reason: cultural_note
  - marker: b
    text: या “पूरी पृथ्वी।” यूनानी शब्द का अर्थ “भूमि” या “पृथ्वी” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: γενομένης ὥρας ἕκτης
  choice: जब छठा घंटा आया
  rationale: सम्बन्धकारक स्वतंत्र रचना का समयसूचक भाव स्वाभाविक हिन्दी में व्यक्त होता है और मूल की समय-गणना बनी रहती है। आधुनिक समय का अनुमान पादटिप्पणी में दिया गया है।
- source_word: σκότος
  choice: अन्धकार
  rationale: यह शब्द σκότος का सीधा, स्पष्ट और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: ἐγένετο
  choice: छा गया ... और ... रहा
  rationale: ‘अन्धकार छा गया’ हिन्दी में घटना के आरम्भ को स्वाभाविक ढंग से व्यक्त करता है; ‘नौवें घंटे तक रहा’ ἕως के साथ उसकी अवधि स्पष्ट करता है।
- source_word: ἐφ’ ὅλην τὴν γῆν
  choice: सारे देश पर
  rationale: γῆ के ‘देश/भूमि’ और ‘पृथ्वी’ दोनों अर्थ सम्भव हैं। प्रसंग में ‘देश’ अनावश्यक रूप से विश्वव्यापी अर्थ निश्चित नहीं करता; दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἕως ὥρας ἐνάτης
  choice: नौवें घंटे तक
  rationale: मूल की समय-अभिव्यक्ति को छठे घंटे के समान रूप में बनाए रखता है; आधुनिक समय का स्पष्टीकरण पादटिप्पणी में है।
theological_decisions:
- issue: क्रूसारोपण के समय हुए अन्धकार में γῆ का भौगोलिक विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: यूनानी γῆ दोनों अर्थ दे सकता है। मुख्य पाठ में ‘देश’ वैश्विक विस्तार को सिद्ध मानने से बचता है, जबकि वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। मूल की प्राचीन समय-गणना मुख्य पाठ में सुरक्षित है और सामान्य पाठक के लिए आधुनिक समय पादटिप्पणी में स्पष्ट किया गया है।
