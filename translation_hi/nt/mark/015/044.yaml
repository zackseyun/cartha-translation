  text: ὁ δὲ Πιλᾶτος ἐθαύμασεν εἰ ἤδη τέθνηκεν, καὶ προσκαλεσάμενος τὸν κεντυρίωνα ἐπηρώτησεν αὐτὸν εἰ ⸀πάλαι ἀπέθανεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/044.yaml
  text: But Pilate was amazed that he had already died[a], and summoning the centurion, he asked him whether he had died already.
translation:
  language: hi
  text: पर पिलातुस को आश्चर्य हुआ कि वह पहले ही मर चुका था। उसने रोमी सूबेदार को बुलाकर उससे पूछा कि क्या उसे मरे हुए कुछ समय हो चुका था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वह कुछ समय पहले मर गया था।”
    reason: πάλαι का भाव मृत्यु के बाद कुछ समय बीत जाने का है; यह विकल्प उसी भाव को घटना-केंद्रित ढंग से व्यक्त करता है।
lexical_decisions:
- source_word: ἐθαύμασεν
  choice: आश्चर्य हुआ
  rationale: यह क्रिया यीशु की असामान्य रूप से शीघ्र मृत्यु पर पिलातुस के आश्चर्य को व्यक्त करती है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰ ἤδη τέθνηκεν
  choice: कि वह इतनी जल्दी मर चुका था
  rationale: εἰ मूलतः परोक्ष प्रश्न प्रस्तुत करता है, जबकि τέθνηκεν पूर्ण काल में मृत्यु के बाद की अवस्था पर बल देता है। प्रसंग में ἤδη का आशय अपेक्षा से पहले मृत्यु होने से है, इसलिए ‘इतनी जल्दी मर चुका था’ स्वाभाविक रूप से आश्चर्य का कारण स्पष्ट करता है।
- source_word: προσκαλεσάμενος
  choice: बुलाकर
  rationale: कृदन्त उस कार्य को बताता है जो पूछताछ से पहले हुआ; ‘बुलाकर’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: κεντυρίωνα
  choice: सूबेदार
  rationale: यह रोमी सेना में लगभग सौ सैनिकों के अधिकारी का पद था। ‘सूबेदार’ सामान्य हिन्दी पाठकों के लिए सहज और प्रचलित बाइबलीय पदनाम है।
- source_word: ἐπηρώτησεν αὐτόν
  choice: उससे पूछा
  rationale: यह सीधी और स्वाभाविक हिन्दी में पूछताछ का भाव व्यक्त करता है।
- source_word: εἰ πάλαι ἀπέθανεν
  choice: क्या उसे मरे कुछ समय हो चुका था
  rationale: πάλαι यहाँ बहुत लंबे बीते समय को नहीं, बल्कि मृत्यु के बाद कुछ समय बीत चुकने को दर्शाता है। यह रूप उस अवधि के विषय में पिलातुस की पूछताछ को सुरक्षित रखता है।
