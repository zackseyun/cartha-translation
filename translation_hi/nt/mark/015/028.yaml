  text: और[a] पवित्रशास्त्र का वह वचन पूरा हुआ, जो कहता है, “और वह अपराधियों के साथ गिना गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद सबसे प्राचीन यूनानी पांडुलिपियों (चौथी शताब्दी की सीनैटिकस और वैटिकनस सहित) और आरंभिक कॉप्टिक अनुवादों में नहीं मिलता, पर बीजान्टिन बहुसंख्यक पाठ-परंपरा और लैटिन परंपरा में सुरक्षित है। संभवतः बाद के नकलनवीसों ने इसे लूका 22:37 के अनुरूप बनाने के लिए जोड़ा था, जहाँ यशायाह 53:12 उद्धृत है।
    reason: textual_critical
lexical_decisions:
- source_word: πληρόω
  choice: पूरा हुआ
  rationale: भविष्यवाणी से संबंधित पवित्रशास्त्र के वचन के सत्य हो जाने को व्यक्त करने के लिए यह स्वाभाविक और सटीक हिन्दी है।
- source_word: γραφή
  choice: पवित्रशास्त्र का वह वचन
  rationale: यहाँ γραφή किसी लिखित पवित्रशास्त्रीय कथन को दर्शाता है; ‘वचन’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है और आशय स्पष्ट रहता है।
- source_word: ἄνομος
  choice: अपराधियों
  rationale: शाब्दिक अर्थ ‘व्यवस्था-विहीन’ या ‘व्यवस्था तोड़नेवाले’ है; उद्धृत यशायाह 53:12 के संदर्भ में ‘अपराधियों’ स्वाभाविक हिन्दी में उन लोगों को दर्शाता है जिन्हें व्यवस्था का उल्लंघन करनेवाला माना गया है।
- source_word: λογίζομαι
  choice: गिना गया
  rationale: कर्मवाच्य रूप यहाँ किसी को एक वर्ग के लोगों के साथ गिनने या उसी श्रेणी में रखने का अर्थ देता है।
theological_decisions:
- issue: यशायाह 53:12 के उद्धरण में ἀνόμων का अर्थ
  choice: अपराधियों
  alternative: अधर्मियों / व्यवस्था तोड़नेवालों
  rationale: ‘अपराधियों’ कानूनी और नैतिक उल्लंघन दोनों का भाव रखता है, पर यह उससे आगे कोई विशिष्ट सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दोनों καί को ‘और’ के रूप में रखा गया है; आरंभिक ‘और’ कथानक से संबंध और उद्धरण का ‘और’ मूल भविष्यवाणी की संरचना बनाए रखता है।
