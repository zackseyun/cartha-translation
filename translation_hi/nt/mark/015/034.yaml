source:
  edition: SBLGNT
  text: καὶ τῇ ⸂ἐνάτῃ ὥρᾳ⸃ ἐβόησεν ὁ Ἰησοῦς φωνῇ ⸀μεγάλῃ· Ἐλωῒ ἐλωῒ ⸀λεμὰ σαβαχθάνι; ὅ ἐστιν μεθερμηνευόμενον Ὁ θεός μου ὁ θεός μου, εἰς τί ⸂ἐγκατέλιπές με⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/034.yaml
  text: And at the ninth hour Jesus cried out with a loud voice[a], “Eloi, Eloi, lema sabachthani?” which is translated, “My God, my God[c][b], for what reason have you forsaken me?”
translation:
  language: hi
  text: और दिन के नौवें घंटे में यीशु ने ऊँचे स्वर में पुकारा, “एलोई, एलोई, लेमा सबख्थानी?”[a] इसका अनुवाद है, “मेरे परमेश्वर, मेरे परमेश्वर,[b] किस कारण तूने मुझे छोड़ दिया?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों और अनेक अनुवाद-परंपराओं में ‘लेमा सबख्थानी’ के स्थान पर ‘लामा सबख्थानी’ मिलता है।
    reason: textual_variant
  - marker: b
    text: यीशु के ये शब्द भजन 22:1 की प्रतिध्वनि हैं।
    reason: cross_reference
  - marker: c
    text: या ‘तूने मुझे क्यों छोड़ दिया?’
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ ἐνάτῃ ὥρᾳ
  choice: दिन के नौवें घंटे में
  rationale: यह यहूदी दिन-गणना की मूल अभिव्यक्ति को बनाए रखता है; ‘दिन के’ जोड़ने से आधुनिक हिन्दी पाठक इसे नौ घंटे की अवधि नहीं समझता। इसका समय लगभग दोपहर तीन बजे था।
- source_word: ἐβόησεν ... φωνῇ μεγάλῃ
  choice: ऊँचे स्वर में पुकारा
  rationale: यह क्रिया और उसकी क्रियाविशेषणात्मक अभिव्यक्ति, दोनों की तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: Ἐλωῒ ἐλωῒ λεμὰ σαβαχθάνι
  choice: एलोई, एलोई, लेमा सबख्तानी?
  rationale: मरकुस पहले यीशु के सामी शब्दों को सुरक्षित रखता है और फिर उनका अनुवाद देता है। ‘लेमा’ SBLGNT के λεμά का अनुसरण करता है और पाठ को मत्ती के अधिक परिचित रूप से नहीं मिलाता।
- source_word: μεθερμηνευόμενον
  choice: इसका अनुवाद है
  rationale: यह सामी उक्ति के बाद दिए गए यूनानी अर्थानुवाद को सीधे और सहज रूप में दर्शाता है।
- source_word: εἰς τί
  choice: किस कारण
  rationale: यह अभिव्यक्ति कारण पूछती है। ‘किस कारण’ स्रोत के रूप के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक है और केवल ‘क्यों’ की तुलना में उसकी औपचारिकता को कुछ अधिक सुरक्षित रखता है।
- source_word: ἐγκατέλιπές με
  choice: तूने मुझे छोड़ दिया
  rationale: ‘छोड़ दिया’ परित्याग का गंभीर भाव व्यक्त करता है और भजन 22:1 की प्रतिध्वनि को स्वाभाविक हिन्दी में बनाए रखता है। परमेश्वर से प्रत्यक्ष एकवचन संबोधन के कारण ‘तूने’ चुना गया है।
theological_decisions:
- issue: यीशु की पुकार और भजन 22:1 का संबंध
  choice: पुकार को उसके परित्याग-बोध और शास्त्रीय प्रतिध्वनि सहित ज्यों का त्यों रखा गया है।
  alternative: मुख्य पाठ में इसे भजन 22 का स्पष्ट उद्धरण बताना या परित्याग के अर्थ को धर्मसैद्धांतिक व्याख्या से हल्का करना।
  rationale: पद स्वयं पुकार और उसका अनुवाद देता है तथा भजन 22:1 को प्रतिध्वनित करता है। अनुवाद इस धार्मिक तनाव को किसी अतिरिक्त मसीह-विज्ञान संबंधी व्याख्या से हल नहीं करता।
- issue: यीशु के सामी शब्दों का रूप
  choice: लिप्यंतरित उक्ति और उसके तुरन्त बाद हिन्दी अनुवाद—दोनों रखे गए हैं।
  alternative: केवल अर्थ देना या इसे मत्ती के ‘एली, एली’ रूप में सामान्यीकृत करना।
  rationale: यह मरकुस की साहित्यिक प्रस्तुति को सुरक्षित रखता और समानांतर सुसमाचार से सामंजस्य बैठाने से बचता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दिन के नौवें घंटे’ में प्राचीन समय-गणना सुरक्षित है; यह लगभग दोपहर तीन बजे को सूचित करती है। सामी पुकार का देवनागरी लिप्यंतरण हिन्दी उच्चारण-सुलभता और यूनानी पाठ—दोनों को ध्यान में रखकर किया गया है।
