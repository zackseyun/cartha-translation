reference: Mark 15:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ⸂πάλιν ἀποκριθεὶς ἔλεγεν⸃ αὐτοῖς· Τί οὖν ⸀θέλετε ποιήσω ⸂ὃν λέγετε⸃ ⸀τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/012.yaml
  text: Pilate answered them again[a], “Then what do you want me to do with the one you call the king of the Jews?”
translation:
  language: hi
  text: पिलातुस ने फिर उनसे पूछा, “तो तुम चाहते हो कि जिसे तुम यहूदियों का राजा कहते हो, उसके साथ मैं क्या करूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रियाविशेषण चल रहे संवाद में पिलातुस के दोबारा बोलने को दर्शाता है; ‘फिर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἀποκριθεὶς ἔλεγεν
  choice: ने ... पूछा
  rationale: कृदंत और अपूर्णकालीन क्रिया का यह संयोजन उत्तर में बोलने का परिचय देता है। चूँकि आगे प्रत्यक्ष प्रश्न है, हिन्दी में ‘पूछा’ प्रसंगानुकूल और स्वाभाविक है तथा संवाद में प्रत्युत्तर देने का भाव बना रहता है।
- source_word: Τί οὖν
  choice: तो ... क्या
  rationale: οὖν पिछली माँग से निष्कर्ष या अगला प्रश्न जोड़ता है। ‘तो ... क्या’ उस तार्किक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: θέλετε
  choice: तुम चाहते हो
  rationale: यहाँ θέλω इच्छा या पसंद को व्यक्त करता है। ‘तुम चाहते हो’ भीड़ से सीधे संबोधन और उसके द्वारा माँगी जा रही कार्रवाई को स्पष्ट रखता है।
- source_word: ποιήσω
  choice: मैं क्या करूँ
  rationale: θέλετε के बाद आया प्रथम पुरुष एकवचन एओरिस्ट सब्जंक्टिव हिन्दी में स्वाभाविक रूप से ‘मैं क्या करूँ’ के रूप में व्यक्त होता है।
- source_word: ὃν λέγετε
  choice: जिसे तुम ... कहते हो
  rationale: यह संबंधवाचक उपवाक्य उपाधि को भीड़ के कथन के रूप में रखता है और पिलातुस की ओर से उसकी पुष्टि नहीं जोड़ता।
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: यहूदियों का राजा
  rationale: यह दुःखभोग-वृत्तांत की स्थापित राजनीतिक उपाधि है। हिन्दी में यह रूप स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: क्या पिलातुस के शब्द यीशु की राजकीय पहचान की पुष्टि करते हैं या भीड़ द्वारा दी गई उपाधि को दोहराते हैं
  choice: ‘जिसे तुम यहूदियों का राजा कहते हो’ के द्वारा उपाधि को भीड़ के कथन के दायरे में रखा गया है।
  alternative: ‘यहूदियों के राजा के साथ मैं क्या करूँ?’
  rationale: ὃν λέγετε में ‘तुम कहते हो’ पर स्पष्ट बल है। चुना हुआ रूप पिलातुस की व्यक्तिगत स्वीकृति या अस्वीकृति आरोपित किए बिना मूल की आलंकारिक दूरी और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘उसके साथ’ उस संबंध को स्पष्ट करता है जो यूनानी वाक्य में क्रिया और संबंधवाचक सर्वनाम से समझा जाता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
