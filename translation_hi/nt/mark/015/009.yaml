  text: ὁ δὲ Πιλᾶτος ἀπεκρίθη αὐτοῖς λέγων· Θέλετε ἀπολύσω ὑμῖν τὸν βασιλέα τῶν Ἰουδαίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/009.yaml
  text: But Pilate answered them[a], saying, “Do you want me to release to you the King of the Jews?”
translation:
  language: hi
  text: पर पिलातुस ने उन्हें उत्तर दिया, “क्या तुम चाहते हो कि मैं तुम्हें यहूदियों के राजा[a] को रिहा कर दूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदिया-निवासियों के राजा को।” यूनानी शब्द Ἰουδαίων का अर्थ “यहूदी” या “यहूदिया-निवासी,” दोनों हो सकता है; पर दुखभोग-वृत्तांत में प्रयुक्त इस स्थिर उपाधि में “यहूदियों के राजा” परंपरागत और प्रसंगानुकूल अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का विरोध और कथा में नया मोड़ दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: ἀπεκρίθη αὐτοῖς λέγων
  choice: ने उनसे कहा
  rationale: यूनानी में शाब्दिक रूप से ‘उन्हें उत्तर देते हुए कहा’ है। हिन्दी में ‘ने उनसे कहा’ उत्तर की क्रिया को प्रसंगतः स्पष्ट रखते हुए अनावश्यक पुनरुक्ति से बचाता है।
- source_word: Θέλετε
  choice: क्या तुम चाहते हो
  rationale: θέλω यहाँ इच्छा या चाह व्यक्त करता है; यह स्पष्ट और वर्तमान हिन्दी का स्वाभाविक प्रयोग है।
- source_word: ἀπολύσω ὑμῖν
  choice: मैं तुम्हारे लिए ... रिहा कर दूँ
  rationale: न्यायिक प्रसंग में ἀπολύω बंदी को मुक्त अथवा रिहा करने का अर्थ देता है। ὑμῖν को ‘तुम्हारे लिए’ कहना भीड़ के अनुरोध पर उसके लाभार्थ की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν βασιλέα τῶν Ἰουδαίων
  choice: यहूदियों के राजा
  rationale: यह दुखभोग-वृत्तांत में प्रयुक्त राजनीतिक और विडंबनापूर्ण उपाधि है। हिन्दी में स्थापित और प्रसंगानुकूल रूप ‘यहूदियों का राजा’ है; विभक्ति के कारण यहाँ ‘यहूदियों के राजा को’ हुआ है।
theological_decisions:
- issue: τὸν βασιλέα τῶν Ἰουδαίων उपाधि का अर्थ
  choice: यहूदियों के राजा
  alternative: यहूदिया-निवासियों के राजा
  rationale: Ἰουδαῖοι जातीय-धार्मिक ‘यहूदियों’ या भौगोलिक ‘यहूदिया-निवासियों’ की ओर संकेत कर सकता है। दुखभोग-वृत्तांत की इस निश्चित राजकीय उपाधि में परंपरागत और प्रसंगानुकूल ‘यहूदियों के राजा’ रखा गया है, बिना पिलातुस के कथन को अनुवादक की धर्मवैज्ञानिक पुष्टि बनाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में भीड़ के लिए ‘तुम’ स्वाभाविक बहुवचन संबोधन है। ‘रिहा कर दूँ’ न्यायिक प्रसंग को स्पष्ट करता है।
