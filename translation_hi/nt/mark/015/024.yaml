  text: καὶ ⸂σταυροῦσιν αὐτὸν καὶ⸃ διαμερίζονται τὰ ἱμάτια αὐτοῦ, βάλλοντες κλῆρον ἐπ’ αὐτὰ τίς τί ἄρῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/024.yaml
  text: And they crucify him and divide his garments among themselves[a], casting lots for them to decide what each would take.
translation:
  language: hi
  text: और वे उसे क्रूस पर चढ़ाते हैं और उसके वस्त्र बाँटते हैं, और यह तय करने के लिए उन पर चिट्ठी डालते हैं कि कौन क्या ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σταυροῦσιν
  choice: क्रूस पर चढ़ाते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी के वर्तमान काल में रखा गया है, जिससे मरकुस के वर्णन की सजीवता बनी रहती है।
- source_word: διαμερίζονται
  choice: आपस में बाँट लेते हैं
  rationale: यह क्रिया वस्तुओं को अलग-अलग हिस्सों में बाँटने या वितरित करने का बोध देती है; ‘आपस में बाँट लेते हैं’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: ἱμάτια
  choice: वस्त्र
  rationale: यह बहुवचन में पहने जाने वाले कपड़ों की अलग-अलग वस्तुओं को सूचित करता है; ‘वस्त्र’ गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है।
- source_word: βάλλοντες κλῆρον
  choice: चिट्ठी डालकर
  rationale: यह किसी वस्तु के बँटवारे का निर्णय संयोग-आधारित चिट्ठी द्वारा करने की प्रचलित अभिव्यक्ति है।
- source_word: ἐπ’ αὐτὰ
  choice: उन पर
  rationale: सर्वनाम पीछे उल्लिखित वस्त्रों की ओर संकेत करता है; ‘उन पर’ यूनानी संबंध को संक्षेप में बनाए रखता है।
- source_word: τίς τί ἄρῃ
  choice: कौन क्या ले
  rationale: 'दोनों प्रश्नवाचक सर्वनामों का वितरणात्मक बल बना रहता है: कौन-सा व्यक्ति कौन-सी वस्तु पाए।'
theological_decisions:
- issue: दुःखभोग-वर्णन में ऐतिहासिक वर्तमान काल
  choice: ‘क्रूस पर चढ़ाते हैं’ और ‘बाँट लेते हैं’ के द्वारा वर्तमान काल बनाए रखा गया है।
  alternative: ‘क्रूस पर चढ़ाया’ और ‘बाँट लिए’ के रूप में सामान्य भूतकाल।
  rationale: मरकुस के यूनानी वर्णन में वर्तमान काल घटना को सजीव बनाता है। हिन्दी में इसे बनाए रखना अर्थ में कोई धर्मवैज्ञानिक निष्कर्ष जोड़े बिना मूल की कथात्मक बनावट को दर्शाता है।
- issue: τίς τί ἄρῃ का कार्य
  choice: 'इसे चिट्ठी डालने से तय होने वाले परिणाम के रूप में व्यक्त किया गया है: ‘यह तय करते हैं कि कौन क्या ले।’'
  alternative: 'अधिक शाब्दिक रूप: ‘कि कौन क्या उठाए।’'
  rationale: यूनानी वाक्यांश का आशय प्रत्येक व्यक्ति को मिलने वाले वस्त्र का निर्धारण है। ‘ले’ हिन्दी में स्वाभाविक है और ‘उठाए’ से उत्पन्न संभावित भौतिक अर्थ-संकुचन से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘क्रूस’, ‘वस्त्र’ और ‘चिट्ठी डालना’ परिचित बाइबलीय शब्दावली हैं, फिर भी वाक्य-विन्यास वर्तमान पाठक के लिए स्वाभाविक रखा गया है।
