  text: But Jesus no longer answered anything[a], so that Pilate was amazed.
translation:
  language: hi
  text: पर यीशु ने फिर कोई उत्तर नहीं दिया[a], जिससे पिलातुस चकित रह गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर यीशु ने फिर कुछ भी उत्तर नहीं दिया, जिसके परिणामस्वरूप पिलातुस अचंभित हुआ।”
    reason: शाब्दिक और शैलीगत वैकल्पिक अनुवाद
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: पिछले संदर्भ में लगाए जा रहे आरोपों और यीशु की प्रतिक्रिया के बीच हल्का विरोध दर्शाता है।
- source_word: οὐκέτι
  choice: फिर ... नहीं
  rationale: यह बताता है कि इसके बाद यीशु ने आगे कोई उत्तर नहीं दिया; आधुनिक हिन्दी में यह ‘अब और नहीं’ की अपेक्षा अधिक सहज है।
- source_word: οὐδὲν
  choice: कोई उत्तर नहीं
  rationale: निषेध के साथ उत्तर की पूर्ण अनुपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: न्यायिक पूछताछ के संदर्भ में सामान्य, स्पष्ट और उपयुक्त अनुवाद है।
- source_word: ὥστε
  choice: जिससे
  rationale: यीशु की चुप्पी के परिणामस्वरूप पिलातुस की प्रतिक्रिया को व्यक्त करता है।
- source_word: θαυμάζειν
  choice: चकित रह गया
  rationale: परिणामस्वरूप हुए गहरे आश्चर्य को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना अवधि पर अनावश्यक बल दिए।
- source_word: Πιλᾶτον
  choice: पिलातुस
  rationale: नाम का हिन्दी बाइबलीय प्रचलनानुसार लिप्यंतरण किया गया है।
