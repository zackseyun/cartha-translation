  yaml_path: translation/nt/mark/015/047.yaml
  text: And Mary Magdalene and Mary the mother of Joses were watching where he was laid[a].
translation:
  language: hi
  text: और मरियम मगदलीनी और योसेस की माँ मरियम यह देख रही थीं कि उसे कहाँ रखा गया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “योसेस की मरियम।” यूनानी पाठ इस मरियम की पहचान योसेस के साथ उसके संबंध से कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्के संयोजक के रूप में दफ़न की कथा को आगे बढ़ाता है; ‘और’ स्वाभाविक हिन्दी निरंतरता देता है।
- source_word: Μαρία ἡ Μαγδαληνή
  choice: मरियम मगदलीनी
  rationale: यह नाम और पहचानसूचक उपाधि का प्रचलित, गरिमापूर्ण हिन्दी रूप है।
- source_word: Μαρία ἡ Ἰωσῆτος
  choice: योसेस की माँ मरियम
  rationale: यूनानी में शाब्दिक रूप से ‘योसेस की मरियम’ है। मरकुस के संदर्भ में यह संबंध सबसे स्वाभाविक रूप से मातृत्व का है, इसलिए मुख्य पाठ में उसे स्पष्ट किया गया है, जबकि मूल की संक्षिप्तता पादटिप्पणी में सुरक्षित है।
- source_word: ἐθεώρουν
  choice: देख रही थीं
  rationale: अपूर्ण भूतकाल चलती हुई क्रिया को व्यक्त करता है; यह रूप दोनों स्त्रियों के लगातार ध्यान देने का भाव रखता है।
- source_word: ποῦ
  choice: कहाँ
  rationale: यह स्थान पूछने या बताने वाला सीधा क्रियाविशेषण है और हिन्दी में स्वाभाविक है।
- source_word: τέθειται
  choice: उसे कहाँ रखा गया था
  rationale: τίθημι के पूर्ण निष्क्रिय रूप में रखे जाने की पूर्ण क्रिया और उससे बनी अवस्था दोनों निहित हैं। हिन्दी कथन में ‘रखा गया था’ इसे स्वाभाविक ढंग से व्यक्त करता है; ‘उसे’ का संदर्भ यीशु है।
theological_decisions:
- issue: निष्क्रिय क्रिया का निहित कर्म
  choice: ‘उसे’ स्पष्ट रूप से जोड़ा गया
  alternative: कर्म को अव्यक्त छोड़ना, या ‘उसके शरीर को’ कहना
  rationale: यूनानी में कर्म संदर्भ से स्पष्ट है, पर हिन्दी में ‘उसे’ वाक्य को स्वाभाविक और स्पष्ट बनाता है। ‘उसके शरीर को’ कहना मूल से अधिक व्याख्यात्मक होता।
- issue: Μαρία ἡ Ἰωσῆτος में संबंध की पहचान
  choice: मुख्य पाठ में ‘योसेस की माँ मरियम’
  alternative: ‘योसेस की मरियम’
  rationale: संदर्भ और मरकुस की पहचान-पद्धति मातृत्व के संबंध का समर्थन करते हैं, किंतु यूनानी स्वयं केवल संबंधसूचक संबंधकारक देता है; इसलिए अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘देख रही थीं’ से यूनानी अपूर्ण भूतकाल की निरंतरता और ‘रखा गया था’ से पूर्ण निष्क्रिय क्रिया की परिणामी अवस्था व्यक्त की गई है।
