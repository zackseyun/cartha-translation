translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी अपनाई गई है। अभ्यस्त भूतकाल को स्पष्ट करने के लिए ‘छोड़ दिया करता था’ रखा गया है; किसी अतिरिक्त धार्मिक या न्यायिक व्याख्या को पाठ में नहीं जोड़ा गया।
