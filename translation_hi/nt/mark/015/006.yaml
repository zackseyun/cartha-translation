  yaml_path: translation/nt/mark/015/006.yaml
  text: At the feast he would release for them one prisoner whom they asked for[a].
translation:
  language: hi
  text: पर्व के समय वह उनके लिए एक कैदी को रिहा किया करता था, जिसे वे माँगते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसे वे अनुरोध करके माँगते थे।”
    reason: παρῃτοῦντο के ‘माँगना/अनुरोध करना’ संबंधी शाब्दिक विकल्प को व्यक्ति-वाचक कर्म के साथ स्पष्ट करता है।
lexical_decisions:
- source_word: Κατὰ δὲ ἑορτὴν
  choice: पर्व के अवसर पर
  rationale: κατά के साथ कर्मकारक यहाँ समय का बोध कराता है। यह वाक्यांश पर्व के समय प्रचलित रीति की ओर संकेत करता है; δέ को हिंदी में अलग शब्द देकर व्यक्त करना आवश्यक नहीं है।
- source_word: ἀπέλυεν
  choice: छोड़ दिया करता था
  rationale: अपूर्ण भूतकालीन क्रिया यहाँ बार-बार होने वाली प्रथा को दर्शाती है, इसलिए साधारण ‘छोड़ दिया’ के बजाय अभ्यस्त क्रिया का रूप रखा गया है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: सम्प्रदान कारक उन लोगों को दर्शाता है जिनके लाभ या अनुरोध पर कैदी छोड़ा जाता था।
- source_word: ἕνα δέσμιον
  choice: एक कैदी
  rationale: ἕνα की संख्या ‘एक’ को स्पष्ट रखा गया है और न्यायिक प्रसंग में δέσμιον के लिए ‘कैदी’ स्वाभाविक तथा सटीक है।
- source_word: ὃν παρῃτοῦντο
  choice: जिसे वे माँगते थे
  rationale: παραιτέομαι यहाँ किसी व्यक्ति को माँगने या उसके लिए अनुरोध करने के अर्थ में है। हिंदी का यह रूप संक्षिप्त है और यूनानी वाक्य की सापेक्ष संरचना को बनाए रखता है।
