  edition: SBLGNT
  text: καὶ ἐπηρώτησεν αὐτὸν ὁ Πιλᾶτος· Σὺ εἶ ὁ βασιλεὺς τῶν Ἰουδαίων; ὁ δὲ ἀποκριθεὶς ⸂αὐτῷ λέγει⸃· Σὺ λέγεις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/002.yaml
  text: And Pilate asked him[a], “Are you the king of the Jews?” And he answered him[b], “You say so.”
translation:
  language: hi
  text: और पिलातुस ने उससे पूछा, “क्या तुम यहूदियों[a] के राजा हो?” उसने उत्तर दिया, “तुम कहते हो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोग।” यहाँ “यहूदियों का राजा” पिलातुस के सामने लाए गए प्रचलित राजनीतिक आरोप को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या अधिक स्पष्ट रूप में, “यह तुम्हारा कहना है।” यीशु का उत्तर संक्षिप्त है और उसमें कुछ अस्पष्टता बनी रहती है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: क्रिया का सामान्य अर्थ ‘पूछना’ या ‘प्रश्न करना’ है। यहाँ ‘पूछा’ स्वाभाविक है और औपचारिक पूछताछ का अनावश्यक भाव नहीं जोड़ता।
- source_word: Σὺ εἶ
  choice: क्या तुम ... हो
  rationale: प्रत्यक्ष प्रश्न को स्वाभाविक हिन्दी प्रश्न-विन्यास में रखा गया है; ‘तुम’ यूनानी के स्पष्ट सर्वनाम को बनाए रखता है।
- source_word: βασιλεὺς
  choice: राजा
  rationale: यह पद राजकीय उपाधि और आरोप के राजनीतिक-मसीही अर्थ को सुरक्षित रखता है; ‘शासक’ इसकी विशिष्टता घटा देता।
- source_word: Ἰουδαίων
  choice: यहूदियों
  rationale: पिलातुस के सामने प्रस्तुत राजनीतिक आरोप में ‘यहूदियों का राजा’ प्रचलित और प्रसंगानुकूल पद है। भौगोलिक अर्थ पर बल देने पर ‘यहूदिया-वासियों’ का विकल्प संभव है।
- source_word: ἀποκριθεὶς αὐτῷ λέγει
  choice: उसने उत्तर दिया
  rationale: यूनानी कृदंत और ऐतिहासिक वर्तमान को हिन्दी की स्वाभाविक कथात्मक शैली में संक्षिप्त किया गया है, बिना उत्तर देने की क्रिया या संबोधन का अर्थ बदले।
- source_word: Σὺ λέγεις
  choice: तुम ही कहते हो
  rationale: स्पष्ट सर्वनाम Σὺ के बल को ‘ही’ से व्यक्त किया गया है और उत्तर की संक्षिप्तता तथा अस्पष्टता बनाए रखी गई है; इसे सीधे ‘हाँ’ नहीं बनाया गया।
theological_decisions:
- issue: यीशु के उत्तर Σὺ λέγεις का आशय
  choice: ‘तुम ही कहते हो’—एक संयत और कुछ हद तक अस्पष्ट प्रत्युत्तर
  alternative: ‘हाँ, जैसा तुम कहते हो’ अथवा अधिक शाब्दिक ‘तुम कहते हो’
  rationale: यूनानी में स्पष्ट ‘हाँ’ नहीं है। इसलिए अनुवाद न तो इसे बिना शर्त स्वीकारोक्ति बनाता है, न इनकार; वह कथन के शब्द पिलातुस के मुख पर ही रहने देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पिलातुस’ और ‘यहूदियों का राजा’ जैसे परिचित बाइबलीय रूप बनाए गए हैं। कथात्मक प्रवाह के लिए ऐतिहासिक वर्तमान को हिन्दी के सामान्य भूतकाल में व्यक्त किया गया है।
