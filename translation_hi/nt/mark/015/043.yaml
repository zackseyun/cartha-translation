source:
  edition: SBLGNT
  text: ⸀ἐλθὼν Ἰωσὴφ ⸀ὁ ἀπὸ Ἁριμαθαίας εὐσχήμων βουλευτής, ὃς καὶ αὐτὸς ἦν προσδεχόμενος τὴν βασιλείαν τοῦ θεοῦ, τολμήσας εἰσῆλθεν πρὸς ⸀τὸν Πιλᾶτον καὶ ᾐτήσατο τὸ σῶμα τοῦ Ἰησοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/043.yaml
  text: Joseph of Arimathea[a], a respected council member who was himself also waiting for the kingdom of God[d][c][b], boldly went in to Pilate and asked for the body of Jesus.
translation:
  language: hi
  text: अरिमतिया का यूसुफ आया। वह एक प्रतिष्ठित परिषद-सदस्य था और स्वयं भी परमेश्वर के राज्य की प्रतीक्षा कर रहा था। उसने साहस करके पिलातुस के सामने उपस्थित होकर यीशु का शरीर माँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: आया
  rationale: पूर्वकालिक कृदंत को स्पष्ट मुख्य क्रिया के रूप में रखा गया है; यह यूसुफ के घटनास्थल पर आने को व्यक्त करता है और यूनानी पाठ का यह तत्व लुप्त नहीं होने देता।
- source_word: ὁ ἀπὸ Ἁριμαθαίας
  choice: अरिमतिया का
  rationale: हिंदी में स्थान-संबंधी पहचान का स्वाभाविक और प्रचलित रूप है; अर्थ है कि यूसुफ अरिमतिया से था।
- source_word: εὐσχήμων
  choice: प्रतिष्ठित
  rationale: यह सामाजिक मान-सम्मान और प्रमुख हैसियत दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: βουλευτής
  choice: महासभा का ... सदस्य
  rationale: संदर्भ में यह यहूदी शासकीय परिषद के सदस्य को दर्शाता है। 'महासभा' हिंदी पाठकों के लिए परिचित है, यद्यपि मूल संज्ञा परिषद का नाम स्पष्ट रूप से नहीं देती; इसीलिए टिप्पणी में सामान्य विकल्प दिया गया है।
- source_word: ὃς καὶ αὐτὸς
  choice: और स्वयं भी
  rationale: καὶ αὐτός के बलाघात को बनाए रखता है कि यूसुफ व्यक्तिगत रूप से भी इस प्रतीक्षा में सम्मिलित था।
- source_word: ἦν προσδεχόμενος
  choice: प्रतीक्षा कर रहा था
  rationale: परिधीय अपूर्ण रचना निरंतर और अपेक्षापूर्ण प्रतीक्षा की अवस्था दिखाती है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: सुसमाचारों के केंद्रीय पदबंध का सीधा, मानक और धर्मशास्त्रीय रूप से तटस्थ अनुवाद।
- source_word: τολμήσας
  choice: साहस करके
  rationale: यूसुफ के जोखिमपूर्ण कदम में निहित साहस को व्यक्त करता है और यूनानी कृदंत की क्रियात्मकता को मात्र रीति-वाचक क्रियाविशेषण में नहीं घटाता।
- source_word: εἰσῆλθεν πρὸς τὸν Πιλᾶτον
  choice: पिलातुस के पास भीतर जाकर
  rationale: εἰσῆλθεν के भीतर प्रवेश करने और πρὸς के किसी व्यक्ति की उपस्थिति में जाने, दोनों भावों को स्वाभाविक हिंदी में रखता है।
- source_word: ᾐτήσατο
  choice: माँगा
  rationale: किसी व्यक्ति से वस्तु माँगने का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: τὸ σῶμα τοῦ Ἰησοῦ
  choice: यीशु का शव
  rationale: मृत्यु के तत्काल संदर्भ में 'शव' हिंदी में मृत देह को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है; शाब्दिक 'शरीर' भी संभव है।
theological_decisions:
- issue: βουλευτής से परिषद की पहचान
  choice: मुख्य पाठ में 'महासभा का सदस्य'
  alternative: '''परिषद का सदस्य'''
  rationale: मरकुस के मुकदमे वाले निकट संदर्भ में यह यहूदी महासभा को सूचित करता है। फिर भी यूनानी शब्द स्वयं परिषद का नाम नहीं देता, इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: τολμήσας का बल
  choice: '''साहस करके'''
  alternative: '''हिम्मत बाँधकर'' या ''साहसपूर्वक'''
  rationale: यह पिलातुस के पास जाने में जोखिम और साहस को उभारता है, बिना यह तय किए कि यूसुफ पहले भयभीत था।
- issue: σῶμα का मृत्युसंदर्भ में अर्थ
  choice: '''शव'''
  alternative: '''शरीर'' या ''देह'''
  rationale: संदर्भ यीशु की मृत्यु के बाद दफनाने के लिए माँगी गई देह का है; 'शव' इसे स्पष्ट करता है, जबकि मूल शब्द सामान्यतः 'शरीर/देह' भी हो सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। वाक्य को तीन छोटे वाक्यों में बाँटकर वर्णन और मुख्य कार्रवाई स्पष्ट की गई है। 'और स्वयं भी' से मूल का बलाघात तथा 'साहस करके' से यूसुफ के कदम का जोखिम सुरक्षित रखा गया है।
