  text: And after learning from the centurion[a], he granted the body to Joseph.
translation:
  language: hi
  text: और सूबेदार से जान लेने के बाद, उसने शव[a] यूसुफ़ को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मृत शरीर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γνοὺς
  choice: यह जान लेने के बाद
  rationale: अओरिस्ट कृदंत यहाँ कालगत/परिस्थितिजन्य है और बताता है कि पिलातुस ने सूबेदार से सूचना मिलने के बाद कार्रवाई की। प्रसंग से ज्ञात सूचना को स्वाभाविक हिन्दी के लिए ‘यह’ से व्यक्त किया गया है।
- source_word: ἀπὸ τοῦ κεντυρίωνος
  choice: सूबेदार से
  rationale: ἀπό के साथ संबंधकारक सूचना के स्रोत को दर्शाता है। ‘सूबेदार’ रोमी centurion के लिए हिन्दी बाइबलीय प्रयोग में परिचित और संक्षिप्त पद है।
- source_word: ἐδωρήσατο
  choice: सौंप दिया
  rationale: मध्यवाच्य δωρέομαι किसी कृपा या अधिकार के रूप में दे देने की भावना रखता है। यहाँ पिलातुस द्वारा शव यूसुफ़ के अधिकार में दिए जाने के आधिकारिक प्रसंग में ‘सौंप दिया’ स्वाभाविक है।
- source_word: πτῶμα
  choice: शव
  rationale: πτῶμα जीवित देह नहीं, मृत शरीर को स्पष्ट रूप से सूचित करता है। ‘शव’ आधुनिक हिन्दी में सटीक, गरिमापूर्ण और संक्षिप्त है।
- source_word: τῷ Ἰωσήφ
  choice: यूसुफ़ को
  rationale: सम्प्रदान कारक प्राप्तकर्ता को दर्शाता है; अतः ‘यूसुफ़ को’ सीधा और स्वाभाविक अनुवाद है।
