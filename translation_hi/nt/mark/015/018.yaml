  text: 'And they began to salute him: “Hail[b][a], King of the Jews!”'
translation:
  language: hi
  text: 'और वे उसे सलाम[a] करने लगे: “जय हो, यहूदियों[b] के राजा!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका अभिवादन करने लगे।” यूनानी क्रिया सामान्य अभिवादन के लिए भी प्रयुक्त हो सकती है; यहाँ प्रसंग में यह उपहासपूर्ण औपचारिक सलामी का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहूदिया-निवासियों के राजा।” यूनानी शब्द का अर्थ ‘यहूदी’ या ‘यहूदिया-निवासी’ दोनों हो सकता है; दुःखभोग-वृत्तांत की इस उपाधि में “यहूदी” अधिक प्रचलित अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ἤρξαντο
  choice: और वे ... करने लगे
  rationale: यह मरकुस की सरल संयोजक शैली और ἄρχομαι के आरंभसूचक भाव—‘करने लगे’—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀσπάζεσθαι
  choice: उपहास करते हुए अभिवादन करने
  rationale: क्रिया का मूल अर्थ ‘अभिवादन करना’ है; प्रसंग में सैनिक राजकीय अभिवादन की नकल करके उपहास कर रहे हैं। ‘उपहास करते हुए’ प्रसंगगत भाव स्पष्ट करता है, जबकि मूल क्रिया का सामान्य अर्थ भी सुरक्षित रहता है।
- source_word: Χαῖρε
  choice: प्रणाम
  rationale: यहाँ शब्द ‘आनन्दित हो’ के शाब्दिक अर्थ में नहीं, अभिवादनसूचक उद्गार के रूप में प्रयुक्त है। ‘प्रणाम’ आधुनिक हिन्दी में औपचारिक और इस प्रसंग में व्यंग्यपूर्ण अभिवादन को स्वाभाविक रूप देता है।
- source_word: βασιλεῦ τῶν Ἰουδαίων
  choice: हे यहूदियों के राजा
  rationale: सम्बोधन कारक को ‘हे’ से व्यक्त किया गया है। Ἰουδαίων के लिए दुःखभोग-वृत्तांत में प्रचलित और प्रसंगानुकूल ‘यहूदियों’ रखा गया है; ‘यहूदिया-निवासियों’ की भौगोलिक सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: यीशु के प्रति सैनिकों के व्यंग्यपूर्ण राजकीय अभिवादन को कैसे व्यक्त किया जाए
  choice: वर्णन में उपहास का प्रसंग स्पष्ट रखते हुए सीधी उक्ति को औपचारिक अभिवादन के रूप में रखना
  alternative: केवल ‘अभिवादन करने लगे’ कहना, अथवा सीधी उक्ति में ‘जय हो’ रखना
  rationale: मूल उक्ति औपचारिक राजकीय सम्मान की नकल है, पर वक्ताओं का आशय उपहास है। यह रूप विडम्बना और राजकीय अर्थ दोनों को बनाए रखता है, बिना यीशु के राजत्व के विषय में अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘प्रणाम’ औपचारिक अभिवादन को सामान्य पाठक के लिए बोधगम्य रखता है। दोनों पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
