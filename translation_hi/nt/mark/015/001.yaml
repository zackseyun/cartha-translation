reference: Mark 15:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς πρωῒ συμβούλιον ποιήσαντες οἱ ἀρχιερεῖς μετὰ τῶν πρεσβυτέρων καὶ γραμματέων καὶ ὅλον τὸ συνέδριον δήσαντες τὸν Ἰησοῦν ἀπήνεγκαν καὶ ⸀παρέδωκαν Πιλάτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/001.yaml
  text: And immediately[a], early in the morning, the chief priests held a consultation with the elders and scribes and the whole council; then they bound Jesus, led him away, and handed him over to Pilate.
translation:
  language: hi
  text: और भोर होते ही प्रधान याजकों ने बुज़ुर्गों, शास्त्रियों और पूरी महासभा[a] के साथ विचार-विमर्श किया। फिर उन्होंने यीशु को बाँधकर उसे ले गए और पिलातुस के हवाले कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी सनहेद्रिन।” यूनानी शब्द συνέδριον यहूदियों की शासकीय परिषद को सूचित करता है।
    reason: ऐतिहासिक संस्थागत नाम का वैकल्पिक रूप
lexical_decisions:
- source_word: εὐθὺς πρωῒ
  choice: भोर होते ही
  rationale: यह स्वाभाविक हिन्दी में सुबह के आरम्भिक समय और तत्काल की गई कार्रवाई—दोनों को व्यक्त करता है तथा मरकुस की कथात्मक तत्परता बनाए रखता है।
- source_word: συμβούλιον ποιήσαντες
  choice: विचार-विमर्श किया
  rationale: यूनानी मुहावरा औपचारिक परामर्श या मंत्रणा करने को दर्शाता है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद अग्रणी याजकीय अधिकारियों के लिए है, न कि एक ही समय पदासीन अनेक महायाजकों के लिए।
- source_word: πρεσβυτέρων
  choice: पुरनियों
  rationale: यहाँ शब्द आयु मात्र नहीं, समुदाय के मान्य अगुओं को सूचित करता है; 'पुरनिये' प्रचलित बाइबलीय हिन्दी पद है।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: धर्मशास्त्र के विशेषज्ञ और व्याख्याता के संस्थागत पद के लिए संक्षिप्त, परिचित हिन्दी रूप।
- source_word: ὅλον τὸ συνέδριον
  choice: पूरी महासभा
  rationale: संस्थागत अर्थ को केवल लिप्यंतरित करने के बजाय स्पष्ट करता है; ऐतिहासिक नाम 'सनहेद्रिन' पादटिप्पणी में रखा गया है।
- source_word: δήσαντες
  choice: बाँधा
  rationale: यीशु को ले जाने से पहले बाँधने की क्रमिक कार्रवाई को सीधा और गंभीर रूप देता है।
- source_word: ἀπήνεγκαν
  choice: ले गए
  rationale: हिरासत में एक स्थान से दूसरे स्थान तक ले जाने के प्रसंग में यह सहज हिन्दी है और अनावश्यक रूप से 'उठाकर ले जाने' का भाव नहीं देता।
- source_word: παρέδωκαν
  choice: हवाले कर दिया
  rationale: यह रोमी अधिकारी को हिरासत और अधिकार के औपचारिक हस्तांतरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Πιλάτῳ
  choice: पिलातुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी बाइबल परम्परा में प्रचलित रूप।
theological_decisions:
- issue: συνέδριον का संस्थागत संदर्भ
  choice: पूरी महासभा
  alternative: पूरी सनहेद्रिन
  rationale: मुख्य पाठ में अर्थ स्पष्ट रखने के लिए संस्था का अनुवाद किया गया है, जबकि अधिक विशिष्ट ऐतिहासिक नाम को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दुःखभोग-वृत्तांत में παρέδωκαν का बल
  choice: हवाले कर दिया
  alternative: सौंप दिया
  rationale: यह न्यायिक अथवा हिरासती हस्तांतरण को सुरक्षित रखता है, पर इस एक पद में उससे आगे कोई विशेष धर्मवैज्ञानिक आशय नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'महासभा' के साथ पादटिप्पणी का चिह्न रखा गया है, क्योंकि पादटिप्पणी उसी यूनानी संस्थागत पद की व्याख्या करती है।
