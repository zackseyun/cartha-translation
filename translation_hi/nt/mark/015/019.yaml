  text: καὶ ἔτυπτον αὐτοῦ τὴν κεφαλὴν καλάμῳ καὶ ἐνέπτυον αὐτῷ, καὶ τιθέντες τὰ γόνατα προσεκύνουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/019.yaml
  text: And they were striking his head with a reed and spitting on him[a], and kneeling down they were bowing down to him.
translation:
  language: hi
  text: और वे उसके सिर पर सरकंडे से बार-बार मारते, उस पर थूकते, और घुटने टेककर उसके सामने झुकते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आराधना करते थे।” यूनानी क्रिया का अर्थ किसी के सामने झुकना, उसे सम्मान देना, या उसकी आराधना करना हो सकता है; यहाँ सैनिक राजकीय सम्मान की उपहासपूर्ण नकल कर रहे थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτυπτον
  choice: बार-बार मारते
  rationale: अपूर्ण काल बारंबार या जारी क्रिया का संकेत देता है; यह प्रयोग उस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτοῦ τὴν κεφαλήν
  choice: उसके सिर पर
  rationale: यूनानी संबंधवाचक रचना स्वाभाविक हिन्दी में अधिकारसूचक सर्वनाम से व्यक्त होती है; ‘पर’ मारने के लक्ष्य को स्पष्ट करता है।
- source_word: καλάμῳ
  choice: सरकंडे से
  rationale: κάλαμος का सामान्य अर्थ सरकंडा या सरकंडे की छड़ी है; ‘सरकंडा’ वस्तु और निकटवर्ती उपहासपूर्ण राजदंड-संबंध दोनों को बनाए रखता है।
- source_word: ἐνέπτυον αὐτῷ
  choice: उस पर थूकते
  rationale: अपूर्ण काल जारी या बारंबार दुर्व्यवहार दर्शाता है; समांतर क्रियाओं के साथ यह रूप हिन्दी में स्वाभाविक है।
- source_word: τιθέντες τὰ γόνατα
  choice: घुटने टेककर
  rationale: शाब्दिक रूप से ‘घुटने रखते हुए’ घुटने टेकने का मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: προσεκύνουν αὐτῷ
  choice: उसके सामने झुकते थे
  rationale: προσκυνέω यहां दंडवत होने, सम्मान प्रकट करने या आराधना करने की बाहरी मुद्रा बताता है। सैनिकों के उपहासपूर्ण अभिनय के संदर्भ में ‘सामने झुकते’ क्रिया को सीधे व्यक्त करता है, बिना उनकी निष्ठा मान लेने के।
theological_decisions:
- issue: उपहास के संदर्भ में προσκυνέω का अनुवाद
  choice: उसके सामने झुकते थे
  alternative: उसकी आराधना करते थे / उसे प्रणाम करते थे
  rationale: संदर्भ सैनिकों द्वारा राजकीय सम्मान की उपहासपूर्ण नकल का है। मुख्य पाठ शारीरिक अधीनता की मुद्रा को सुरक्षित रखता है और सच्ची भक्ति का दावा नहीं करता; व्यापक अर्थ ‘आराधना’ को पादटिप्पणी में रखा गया है ताकि शब्द की धर्मवैचारिक संभाव्यता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। अपूर्ण काल की बारंबारता पहली क्रिया में स्पष्ट की गई है और समांतर क्रियारूपों से पूरे क्रम की जारी प्रकृति बनी रहती है।
