- from: तब सैनिक यीशु को आँगन के भीतर ले गए—अर्थात प्रैटोरियम[a] में—और उन्होंने पूरी रोमी सैन्य टुकड़ी[b] को बुलाकर इकट्ठा किया।
  to: तब सैनिक यीशु को आँगन के भीतर, अर्थात् प्रैटोरियम[a] में, ले गए और उन्होंने पूरी कोहोर्ट[b] को बुलाकर इकट्ठा किया।
  rationale: संशोधन σπεῖρα के तकनीकी सैन्य अर्थ को ‘कोहोर्ट’ द्वारा मुख्य पाठ में बनाए रखता है, जबकि टिप्पणी सामान्य पाठक के लिए उसका अर्थ स्पष्ट करती है। ‘प्रैटोरियम’ के लिए टिप्पणी को एक सावधान वैकल्पिक अर्थ तक सीमित किया गया है। शेष वाक्य स्रोत के स्थानगत, व्याख्यात्मक और कथात्मक अर्थ के प्रति विश्वसनीय है।
