review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the soldiers leading Jesus inside the courtyard and identifies it as the praetorium. It also conveys the summoning of the entire military unit. However, rendering σπεῖρα merely as ‘रोमी सैन्य टुकड़ी’ loses the source’s technical term, while the note itself identifies that term as ‘कोहोर्ट.’ Retaining ‘कोहोर्ट’ in the text better reflects the Greek without sacrificing comprehension, since the note explains it.
  naturalness: The Hindi is generally modern and clear. Recasting the appositional phrase with commas rather than dashes gives a more direct, fluent correspondence to the Greek explanatory clause. ‘बुलाकर इकट्ठा किया’ is natural Hindi for ‘called together.’
  terminology: ‘प्रैटोरियम’ appropriately preserves the Roman administrative term. ‘कोहोर्ट’ should be retained in the main text as the technical equivalent of σπεῖρα; the cultural footnote supplies the needed explanation. The praetorium note should not state one historically disputed identification as exclusive, so it is phrased as an alternative gloss (‘राज्यपाल का मुख्यालय’).
  issues:
  - severity: low
    issue: The main text uses the general expression ‘रोमी सैन्य टुकड़ी’ for σπεῖρα, but the footnote identifies the underlying technical term as ‘कोहोर्ट.’
    rationale: Using ‘कोहोर्ट’ in the text preserves the Roman military designation present in the source and aligns the text with its explanatory note.
  - severity: low
    issue: The praetorium footnote presents ‘मुख्यालय या आधिकारिक निवास’ as a categorical historical definition.
    rationale: The precise referent of πραιτώριον can vary by context. A lexical alternative note is more appropriately limited to ‘राज्यपाल का मुख्यालय,’ without asserting a single reconstruction.
  revised_text: तब सैनिक यीशु को आँगन के भीतर, अर्थात् प्रैटोरियम[a] में, ले गए और उन्होंने पूरी कोहोर्ट[b] को बुलाकर इकट्ठा किया।
