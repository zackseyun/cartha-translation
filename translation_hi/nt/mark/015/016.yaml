  text: Οἱ δὲ στρατιῶται ἀπήγαγον αὐτὸν ἔσω τῆς αὐλῆς, ὅ ἐστιν πραιτώριον, καὶ συγκαλοῦσιν ὅλην τὴν σπεῖραν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/016.yaml
  text: Then the soldiers led him inside the courtyard[a], which is the praetorium[b], and they call together the whole cohort.
translation:
  language: hi
  text: तब सैनिक यीशु को आँगन के भीतर, अर्थात् प्रैटोरियम[a] में, ले गए और उन्होंने पूरी कोहोर्ट[b] को बुलाकर इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘राज्यपाल का मुख्यालय।’
    reason: lexical_alternative
  - marker: b
    text: ‘कोहोर्ट’ रोमी सेना की एक इकाई थी; यहाँ यह रोमी अधिकार के अधीन इकट्ठे किए गए सैनिकों को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: Οἱ δὲ
  choice: तब
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि कथा की अगली घटना की ओर बढ़ने का संकेत देता है; ‘तब’ स्वाभाविक हिन्दी प्रवाह देता है।
- source_word: στρατιῶται
  choice: सैनिक
  rationale: यह व्यक्तिगत सैनिकों के लिए सामान्य और सीधा आधुनिक हिन्दी शब्द है।
- source_word: ἀπήγαγον αὐτὸν
  choice: यीशु को ... ले गए
  rationale: ἀπάγω का यहाँ अर्थ किसी को एक स्थान की ओर ले जाना है। हिन्दी में सर्वनाम की जगह ‘यीशु’ कहने से संदर्भ स्पष्ट रहता है, जबकि कोई अतिरिक्त अर्थ नहीं जुड़ता।
- source_word: ἔσω τῆς αὐλῆς
  choice: आँगन के भीतर
  rationale: ἔσω संबंधवाचक रूप के साथ ‘भीतर’ का स्थानगत अर्थ देता है; αὐλή यहाँ किसी आधिकारिक भवन का आँगन है, पर मुख्य पाठ में उससे अधिक विशिष्टता नहीं जोड़ी गई।
- source_word: ὅ ἐστιν πραιτώριον
  choice: अर्थात प्रैटोरियम में
  rationale: ग्रीक व्याख्यात्मक उपवाक्य को ‘अर्थात’ से दर्शाया गया है और रोमी प्रशासनिक शब्द की ऐतिहासिक विशिष्टता बनाए रखने के लिए उसका लिप्यंतरण किया गया है।
- source_word: συγκαλοῦσιν
  choice: बुलाकर इकट्ठा किया
  rationale: यह संयुक्त क्रिया बुलाने और एकत्र करने दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करती है। ग्रीक का ऐतिहासिक वर्तमान हिन्दी कथा-शैली में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: ὅλην τὴν σπεῖραν
  choice: पूरी रोमी सैन्य टुकड़ी
  rationale: σπεῖρα रोमी सैन्य इकाई का तकनीकी शब्द है। ‘सैन्य टुकड़ी’ सामान्य पाठक के लिए सुबोध है; ‘रोमी’ संदर्भगत ऐतिहासिक अर्थ स्पष्ट करता है, और टिप्पणी इसकी तकनीकी पृष्ठभूमि बताती है।
