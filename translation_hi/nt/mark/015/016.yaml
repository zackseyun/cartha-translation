  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रैटोरियम’ की ऐतिहासिक विशिष्टता मुख्य पाठ में सुरक्षित है और टिप्पणी में समझाई गई है। यूनानी ऐतिहासिक वर्तमान को हिन्दी की स्वाभाविक कथा-शैली के अनुसार भूतकाल में प्रस्तुत किया गया है।
