id: MRK.15.21
reference: Mark 15:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἀγγαρεύουσιν παράγοντά τινα Σίμωνα Κυρηναῖον ἐρχόμενον ἀπ’ ἀγροῦ, τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου, ἵνα ἄρῃ τὸν σταυρὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/021.yaml
  text: And they compelled a certain passerby[a], Simon of Cyrene, who was coming from the country, the father of Alexander and Rufus[c][b], to carry his cross.
translation:
  language: hi
  text: उन्होंने वहाँ से गुजर रहे एक आदमी, कुरेनेवासी शमौन को—जो देहात से आ रहा था[a] और सिकन्दर तथा रूफुस का पिता था—जबरन सेवा में लगा दिया[b], ताकि वह उसका क्रूस[c] उठाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खेत से आ रहा था’; यूनानी शब्द खेत, ग्रामीण क्षेत्र या देहात के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त यूनानी क्रिया अधिकारपूर्वक किसी को बलात सेवा या बेगार में लगाने का भाव रखती है।
    reason: cultural_note
  - marker: c
    text: कुछ लोग यहाँ ‘क्रूस’ को विशेष रूप से उसकी आड़ी बल्ली समझते हैं, पर यूनानी पाठ केवल ‘क्रूस’ कहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγγαρεύουσιν
  choice: जबरन सेवा में लगा दिया
  rationale: यह क्रिया किसी से अधिकारपूर्वक बलात सेवा लेने या उसे बेगार में लगाने का भाव व्यक्त करती है; यह अनुवाद अनुरोध के बजाय बाध्यता को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: παράγοντά τινα
  choice: वहाँ से गुजर रहे एक आदमी
  rationale: παράγοντα का अर्थ पास से या मार्ग से गुजरना है और τινα अनिश्चितता व्यक्त करता है; हिन्दी वाक्यांश घटना में उस व्यक्ति की आकस्मिक उपस्थिति बनाए रखता है।
- source_word: Σίμωνα Κυρηναῖον
  choice: कुरेनेवासी शमौन
  rationale: व्यक्तिनाम को प्रचलित हिन्दी रूप में और भौगोलिक पहचान को संक्षिप्त, स्वाभाविक विशेषण के रूप में रखा गया है।
- source_word: ἐρχόμενον ἀπ’ ἀγροῦ
  choice: जो देहात से आ रहा था
  rationale: ἀγρός खेत, ग्रामीण क्षेत्र या देहात का संकेत कर सकता है। प्रसंग में ‘देहात से’ स्वाभाविक है, जबकि पादटिप्पणी वास्तविक शाब्दिक विस्तार सुरक्षित रखती है।
- source_word: τὸν πατέρα Ἀλεξάνδρου καὶ Ῥούφου
  choice: सिकन्दर तथा रूफुस का पिता था
  rationale: शमौन की यह परिचयात्मक पहचान बिना यह अनुमान लगाए ज्यों की त्यों रखी गई है कि पाठकों को उसके पुत्र क्यों ज्ञात रहे होंगे।
- source_word: ἵνα ἄρῃ
  choice: ताकि वह ... उठाए
  rationale: ἵνα के साथ संभावनार्थक क्रिया यहाँ उद्देश्य बताती है। ‘ताकि’ उस उद्देश्य-संबंध को स्पष्ट रखता है और ἄρῃ के उठाने अथवा वहन करने के भाव को व्यक्त करता है।
- source_word: σταυρὸν
  choice: क्रूस
  rationale: σταυρός के लिए दुःखभोग-वृत्तांतों में प्रचलित और पाठानुरूप शब्द ‘क्रूस’ रखा गया है; मुख्य पाठ इसे अधिक विशिष्ट करके ‘आड़ी बल्ली’ नहीं कहता।
- source_word: αὐτοῦ
  choice: उसका
  rationale: मूल का सर्वनाम बनाए रखा गया है; प्रसंग में इसका स्वाभाविक संदर्भ यीशु है, पर अनुवाद मूल में अनुपस्थित स्पष्ट नाम नहीं जोड़ता।
theological_decisions:
- issue: शमौन से ली गई सेवा का स्वरूप
  choice: शमौन को अधिकारपूर्वक और जबरन सेवा में लगाया गया।
  alternative: उससे केवल अनुरोध किया गया या उसने स्वेच्छा से सहायता की।
  rationale: ἀγγαρεύω बलात सेवा अथवा बेगार में लगाने का अर्थ देता है; इसलिए बाध्यता को नरम नहीं किया गया।
- issue: शमौन ने क्या उठाया
  choice: σταυρός को ‘क्रूस’ कहा गया।
  alternative: इसे अधिक विशिष्ट रूप से ‘क्रूस की आड़ी बल्ली’ कहा जाए।
  rationale: ऐतिहासिक पुनर्निर्माण आड़ी बल्ली का सुझाव दे सकता है, पर यूनानी पाठ केवल σταυρός कहता है; इसलिए मुख्य पाठ को उससे अधिक संकीर्ण नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘जबरन सेवा में लगा दिया’ ने अपेक्षाकृत पुराने ‘बेगार में पकड़ा’ की अपेक्षा अर्थ को अधिक स्पष्ट बनाया है। वाक्य के मध्य डैश द्वारा शमौन के पुत्रों वाली परिचयात्मक सूचना अलग की गई है, जिससे मूल वाक्य-संबंध और पठनीयता दोनों बने रहें।
