  text: δραμὼν δέ ⸂τις καὶ⸃ γεμίσας σπόγγον ὄξους ⸀περιθεὶς καλάμῳ ἐπότιζεν αὐτόν, λέγων· Ἄφετε ἴδωμεν εἰ ἔρχεται Ἠλίας καθελεῖν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/036.yaml
  text: Then someone ran[a], filled a sponge with sour wine, put it on a reed, and gave him a drink, saying, “Leave him alone[b]. Let us see whether Elijah is coming to take him down.”
translation:
  language: hi
  text: तब कोई दौड़ा, एक स्पंज को खट्टे दाखरस[a] से भरकर उसे सरकंडे पर लगाया और यीशु को पिलाता रहा। वह कह रहा था, “उसे रहने दो।[b] आओ, देखें कि एलिय्याह उसे नीचे उतारने आता है या नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खट्टे दाखरस” से आशय सस्ती, अम्लीय दाखरस से है; यह आवश्यक नहीं कि आधुनिक अर्थ वाला सिरका हो।
    reason: cultural_note
  - marker: b
    text: या, “ठहरो। आओ, देखें कि एलिय्याह उसे नीचे उतारने आता है या नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δραμὼν
  choice: दौड़कर आया
  rationale: अओरिस्ट कृदंत आरंभिक क्रिया को दर्शाता है; हिन्दी में ‘दौड़कर आया’ आगामी क्रियाओं से स्वाभाविक रूप से जुड़ता है।
- source_word: τις καὶ
  choice: एक व्यक्ति
  rationale: अनिश्चित सर्वनाम किसी अज्ञात व्यक्ति की ओर संकेत करता है। यहाँ καί को अलग से ‘भी’ कहना हिन्दी में अनावश्यक और भ्रामक होगा।
- source_word: γεμίσας σπόγγον ὄξους
  choice: एक स्पंज को खट्टी दाखमधु से भरा
  rationale: ὄξος सस्ती, अम्लीय दाखमधु को सूचित करता है; ‘खट्टी दाखमधु’ आधुनिक घरेलू सिरके का भ्रामक बोध नहीं कराती।
- source_word: περιθεὶς καλάμῳ
  choice: उसे सरकंडे पर लगाया
  rationale: κάλαμος का ठोस अर्थ ‘सरकंडा’ सुरक्षित रहता है और स्पंज को ऊपर पहुँचाने की क्रिया स्पष्ट होती है।
- source_word: ἐπότιζεν αὐτόν
  choice: यीशु को पिलाने लगा
  rationale: अपूर्ण भूतकाल क्रिया को जारी अथवा प्रयत्नरत रूप में दिखाता है। स्पष्टता के लिए सर्वनाम के स्थान पर ‘यीशु’ रखा गया है।
- source_word: Ἄφετε
  choice: उसे छोड़ दो
  rationale: आज्ञार्थक रूप का मूल भाव किसी क्रिया से रुकने या उसे रहने देने का है; प्रसंग में श्रोताओं से यीशु को फिलहाल छोड़ देने को कहा जा रहा है। ‘ठहरो’ की मुहावरेदार संभावना पाद-टिप्पणी में रखी गई है।
- source_word: ἴδωμεν εἰ ἔρχεται Ἠλίας
  choice: आओ देखें कि एलिय्याह ... आता है या नहीं
  rationale: यह रचना देखने या परखने के लिए सामूहिक आग्रह व्यक्त करती है; ‘आता है या नहीं’ εἰ की अनिश्चितता और वर्तमानकाल की निकटता बनाए रखता है।
- source_word: καθελεῖν αὐτόν
  choice: उसे नीचे उतारने
  rationale: क्रूस के प्रसंग में καθαιρέω ऊँचे स्थान से नीचे उतारने को सूचित करता है।
theological_decisions:
- issue: Ἄφετε में वक्ता की मंशा
  choice: मुख्य पाठ में ‘उसे छोड़ दो’ रखा गया है, अर्थात कुछ समय यीशु को रहने दो ताकि देखा जाए कि एलिय्याह हस्तक्षेप करता है या नहीं।
  alternative: इसे मुहावरेदार ढंग से ‘ठहरो’ भी समझा जा सकता है।
  rationale: यह व्याख्यात्मक अस्पष्टता है। मुख्य पाठ मूल क्रिया के निकट रहता है और वैकल्पिक मुहावरेदार अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘स्पंज’, ‘खट्टी दाखमधु’ और ‘सरकंडा’ मूल प्रसंग की ठोस वस्तुओं को स्पष्ट रखते हैं; पाद-टिप्पणियाँ सांस्कृतिक जानकारी और वास्तविक भाषिक अस्पष्टता सुरक्षित करती हैं।
