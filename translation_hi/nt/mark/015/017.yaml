  text: καὶ ⸀ἐνδιδύσκουσιν αὐτὸν πορφύραν καὶ περιτιθέασιν αὐτῷ πλέξαντες ἀκάνθινον στέφανον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/017.yaml
  text: And they dress him in purple[a], and after weaving a crown of thorns, they place it on him.
translation:
  language: hi
  text: और वे उसे बैंगनी रंग का वस्त्र पहनाते हैं और काँटों का मुकुट गूँथकर उस पर रख देते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνδιδύσκουσιν
  choice: पहनाते हैं
  rationale: यह क्रिया किसी को वस्त्र पहनाने का भाव व्यक्त करती है। ‘उसे ... पहनाते हैं’ आधुनिक हिन्दी में स्वाभाविक है और कर्मवाचक-प्रेरणार्थक अर्थ को बनाए रखता है।
- source_word: πορφύραν
  choice: बैंगनी वस्त्र
  rationale: संज्ञा बैंगनी कपड़े या बैंगनी परिधान को सूचित कर सकती है। हिन्दी में केवल ‘बैंगनी’ पहनाने की बात अस्पष्ट लगेगी, इसलिए ‘वस्त्र’ अर्थ को स्पष्ट करता है; ‘चोगा’ जैसा अधिक विशिष्ट रूप मूल में स्पष्ट नहीं है।
- source_word: περιτιθέασιν
  choice: उसके सिर पर रख देते हैं
  rationale: क्रिया का अर्थ किसी वस्तु को चारों ओर रखना या ऊपर रखना है। मुकुट के सामान्य स्थान को स्पष्ट करने के लिए ‘सिर पर’ स्वाभाविक हिन्दी है, यद्यपि यूनानी में ‘सिर’ शब्द प्रत्यक्ष रूप से नहीं है।
- source_word: πλέξαντες
  choice: गूँथकर
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले सम्पन्न कार्य को दिखाता है। ‘गूँथकर’ इस क्रम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀκάνθινον
  choice: काँटों का
  rationale: विशेषण काँटों से बनी वस्तु को दर्शाता है; ‘काँटों का मुकुट’ हिन्दी का सहज प्रयोग है।
- source_word: στέφανον
  choice: मुकुट
  rationale: शब्द पुष्पमाला या विजय-माला भी सूचित कर सकता है, पर सैनिकों द्वारा किए जा रहे राजकीय उपहास के प्रसंग में ‘मुकुट’ अभिप्रेत व्यंग्य को सबसे स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के अपमान में राजकीय उपहास की छवि
  choice: στέφανος के लिए ‘मुकुट’ और πορφύρα के लिए ‘बैंगनी वस्त्र’
  alternative: ‘माला’ और ‘बैंगनी कपड़ा’
  rationale: बैंगनी परिधान और काँटों का मुकुट सैनिकों द्वारा राजत्व की नकल करके किए गए उपहास को दिखाते हैं। यह शब्दावली उस कथात्मक भार को सुरक्षित रखती है, पर कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वर्तमानकालीन कथन-शैली मूल यूनानी के ऐतिहासिक वर्तमान को बनाए रखती है। ‘चोगा’ से बचकर मूल की शब्दगत व्यापकता सुरक्षित रखी गई है।
