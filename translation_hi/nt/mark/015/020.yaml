source:
  edition: SBLGNT
  text: καὶ ὅτε ἐνέπαιξαν αὐτῷ, ἐξέδυσαν αὐτὸν τὴν πορφύραν καὶ ἐνέδυσαν αὐτὸν τὰ ἱμάτια ⸂τὰ ἴδια⸃. καὶ ἐξάγουσιν αὐτὸν ἵνα ⸀σταυρώσωσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/020.yaml
  text: And when they had mocked him, they stripped the purple robe off him and put his own clothes on him. And they lead him out to crucify him.
translation:
  language: hi
  text: और जब वे उसका उपहास कर चुके थे, तब उन्होंने उसके शरीर से बैंगनी वस्त्र[a] उतार दिया और उसे उसके अपने कपड़े[c] पहना दिए। फिर वे उसे क्रूस पर चढ़ाने के लिए[b] बाहर ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बैंगनी चोगा’। यूनानी में केवल ‘बैंगनी’ कहा गया है; प्रसंग से कोई परिधान अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ताकि वे उसे क्रूस पर चढ़ाएँ।’ यूनानी में उद्देश्य बताने वाला उपवाक्य है।
    reason: lexical_alternative
  - marker: c
    text: कुछ प्राचीन पांडुलिपियों में ‘अपने’ शब्द नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐνέπαιξαν
  choice: उपहास कर चुके
  rationale: क्रिया तिरस्कारपूर्ण मज़ाक या उपहास को व्यक्त करती है। कालसूचक उपवाक्य में पूर्ण हो चुकी कार्रवाई को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἐξέδυσαν αὐτὸν τὴν πορφύραν
  choice: उस पर से बैंगनी वस्त्र उतार दिया
  rationale: क्रिया किसी के शरीर से कपड़ा उतारने को दर्शाती है। πορφύραν शाब्दिक रूप से ‘बैंगनी’ है, पर प्रसंग में बैंगनी परिधान अभिप्रेत है।
- source_word: ἐνέδυσαν αὐτὸν τὰ ἱμάτια τὰ ἴδια
  choice: उसके अपने कपड़े उसे पहना दिए
  rationale: ‘अपने’ से τὰ ἴδια का बल सुरक्षित रहता है और ‘कपड़े’ आधुनिक हिन्दी में ἱμάτια का सहज समतुल्य है।
- source_word: ἐξάγουσιν αὐτόν
  choice: वे उसे ... बाहर ले गए
  rationale: यूनानी ऐतिहासिक वर्तमान कथा को सजीव बनाता है; हिन्दी की स्वाभाविक भूतकालीन कथा-शैली में ‘ले गए’ उपयुक्त है।
- source_word: ἵνα σταυρώσωσιν αὐτόν
  choice: उसे क्रूस पर चढ़ाने के लिए
  rationale: ἵνα और संभावनार्थक क्रिया यहाँ उद्देश्य व्यक्त करते हैं; हिन्दी में ‘के लिए’ वही अर्थ संक्षेप और स्वाभाविक ढंग से देता है।
- source_word: σταυρώσωσιν
  choice: क्रूस पर चढ़ाने
  rationale: यह क्रिया विशेष रूप से क्रूस-दंड देने को दर्शाती है; प्रचलित हिन्दी बाइबलीय अभिव्यक्ति सटीक और सुबोध है।
theological_decisions:
- issue: क्रूस पर चढ़ाए जाने से पहले यीशु के अपमान का वर्णन
  choice: उपहास, बैंगनी परिधान उतारे जाने, अपने कपड़े पहनाए जाने और क्रूस पर चढ़ाने के लिए बाहर ले जाए जाने को सीधे कथात्मक रूप में रखा गया है।
  alternative: राजकीय उपहास या प्रायश्चित के धर्मवैज्ञानिक अर्थ को अनुवाद में स्पष्ट जोड़ना।
  rationale: मूल पद घटनाओं का सीधा वर्णन करता है; निहित अपमान सुरक्षित है, पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। ‘उपहास’ गंभीर प्रसंग के अनुकूल है; ‘कपड़े’ सामान्य पाठक के लिए स्वाभाविक है। यूनानी ऐतिहासिक वर्तमान को हिन्दी में स्वाभाविक भूतकाल से प्रस्तुत किया गया है।
