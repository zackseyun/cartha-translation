  yaml_path: translation/nt/mark/015/038.yaml
  text: And the curtain of the temple was torn in two[b][a], from top to bottom.
translation:
  language: hi
  text: और मंदिर[a] का परदा[b] ऊपर से नीचे तक दो भागों में फट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द अधिक विशेष रूप से मंदिर के भीतरी पवित्र स्थान को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, ‘आवरण।’
    reason: lexical_alternative
lexical_decisions:
- source_word: καταπέτασμα
  choice: परदा
  rationale: यह शब्द मन्दिर के भीतर लटके हुए परदे या आवरण को दर्शाता है। ‘परदा’ आधुनिक हिन्दी में स्वाभाविक और ठोस है तथा उसके प्रतीकात्मक अर्थ की व्याख्या पाठ में नहीं जोड़ता।
- source_word: ναοῦ
  choice: मन्दिर
  rationale: ναός यहाँ व्यापक मन्दिर-परिसर की अपेक्षा विशेष रूप से भीतरी पवित्रस्थान का संकेत दे सकता है। मुख्य पाठ में परिचित और सहज ‘मन्दिर’ रखा गया है, और अधिक विशिष्ट अर्थ को पादटिप्पणी में बताया गया है।
- source_word: ἐσχίσθη
  choice: फटकर … हो गया
  rationale: यूनानी क्रिया कर्मवाच्य है और परदे के फटने की घटना बताती है। हिन्दी की यह अकर्मक रचना किसी कर्ता को जोड़े बिना घटना को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: εἰς δύο
  choice: दो भाग
  rationale: यह यूनानी पद दो हिस्सों में विभाजन बताता है। ‘दो भाग हो गया’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: ἀπ’ ἄνωθεν ἕως κάτω
  choice: ऊपर से नीचे तक
  rationale: यह फटने की दिशा और पूरी सीमा दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक को बिना अतिरिक्त कालगत अर्थ जोड़े सुरक्षित रखता है।
theological_decisions:
- issue: मन्दिर के परदे के फटने का सम्भावित प्रतीकात्मक अर्थ
  choice: घटना को केवल वर्णनात्मक रूप में प्रस्तुत किया गया है।
  alternative: इसे परमेश्वर तक पहुँच खुलने या मन्दिर-व्यवस्था पर न्याय के स्पष्ट संकेत के रूप में अनुवाद में समझाना।
  rationale: पद घटना बताता है, पर उसका प्रतीकात्मक अर्थ स्वयं स्पष्ट नहीं करता। इसलिए सम्भावित धर्मवैज्ञानिक अर्थों में से किसी एक को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘ऊपर से नीचे तक’ सामान्य पाठक के लिए सहज है। ‘मन्दिर’ परिचित पद है, जबकि उसके अधिक विशिष्ट सम्भावित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
