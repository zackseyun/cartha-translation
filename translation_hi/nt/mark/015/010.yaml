lexical_decisions:
- source_word: ἐγίνωσκεν
  choice: वह जानता था
  rationale: अपूर्ण भूतकाल यहाँ पिलातुस की बनी हुई या स्थिर जानकारी को व्यक्त करता है; स्वाभाविक हिन्दी में ‘जानता था’ इस भाव को ठीक रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण देता है; हिन्दी में ‘क्योंकि’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात की विषय-वस्तु आरम्भ करता है जिसे पिलातुस जानता था।
- source_word: διὰ φθόνον
  choice: ईर्ष्या के कारण
  rationale: διά के साथ कर्मकारक कारण बताता है, और φθόνος यहाँ ईर्ष्या या जलन से प्रेरित होने का भाव रखता है।
- source_word: παραδεδώκεισαν
  choice: सौंपा था
  rationale: पूर्णभूत रूप उस कार्य को पिलातुस के जानने से पहले पूरा हुआ दिखाता है। ‘सौंपा था’ न्यायिक संदर्भ को बनाए रखता है और ‘विश्वासघात किया’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह यीशु की ओर संकेत करने वाला प्रत्यक्ष कर्म सर्वनाम है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: बहुवचन पद उस समय के प्रमुख याजकीय अधिकारियों को सूचित करता है; ‘प्रधान याजक’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्थापित है।
theological_decisions:
- issue: प्रधान याजकों को दिया गया प्रेरक कारण
  choice: पद कहता है कि उन्होंने यीशु को ईर्ष्या के कारण सौंपा था।
  alternative: जलन के कारण
  rationale: अनुवाद इसे पिलातुस की समझ के रूप में सीधे प्रस्तुत करता है और φθόνος के अर्थ से आगे बढ़कर उनके उद्देश्य की कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कारणसूचक संबंध, पूर्णभूत काल और न्यायिक रूप से ‘सौंपे जाने’ का भाव सुरक्षित रखा गया है।
