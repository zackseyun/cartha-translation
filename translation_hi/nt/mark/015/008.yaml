  yaml_path: translation/nt/mark/015/008.yaml
  text: And the crowd came up and began to ask him to do as he used to do for them[a].
translation:
  language: hi
  text: और भीड़ ऊपर आई और उससे वैसा करने का अनुरोध करने लगी जैसा वह उनके लिए किया करता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक: ‘और भीड़, ऊपर आकर, उससे वैसा करने की माँग करने लगी जैसा वह उनके लिए किया करता था।’'
    reason: मूल यूनानी की कृदन्तीय रचना (‘ऊपर आकर’) और καθώς (‘जैसा’) की तुलनात्मक संरचना को अधिक औपचारिक रूप में दिखाने वाला विकल्प।
lexical_decisions:
- source_word: ἀναβὰς
  choice: ऊपर आई
  rationale: यह ἀναβαίνω का अओरिस्ट कृदन्त है, जिसका मूल अर्थ ‘ऊपर आना/जाना’ है। भीड़ स्त्रीलिंग होने के कारण ‘ऊपर आई’ स्वाभाविक हिन्दी है और पिलातुस की ओर उसके बढ़ने का भाव बनाए रखती है।
- source_word: ὁ ὄχλος
  choice: भीड़
  rationale: ὄχλος के लिए ‘भीड़’ आधुनिक मानक हिन्दी का सहज और प्रसंगानुकूल शब्द है।
- source_word: ἤρξατο αἰτεῖσθαι
  choice: अनुरोध करने लगी
  rationale: ἄρχομαι के साथ infinitive आरम्भ का भाव देता है, और αἰτέω यहाँ माँगने या अनुरोध करने को व्यक्त करता है। ‘अनुरोध करने लगी’ विनम्र किन्तु स्पष्ट आधुनिक हिन्दी है।
- source_word: καθὼς
  choice: वही … जो
  rationale: καθώς का मूल भाव ‘जैसा’ है। हिन्दी में इस अपूर्ण तुलनात्मक वाक्य को ‘वही … जो’ से व्यक्त करना अधिक स्वाभाविक है और उस प्रचलित कार्य की ओर संकेत बनाए रखता है जिसकी भीड़ माँग कर रही थी।
- source_word: ἐποίει
  choice: किया करता था
  rationale: ποιέω का imperfect रूप यहाँ भूतकाल की नियमित या प्रचलित क्रिया को दर्शाता है; ‘किया करता था’ इस पक्ष को ठीक प्रकार व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: यह dative सर्वनाम यहाँ लाभार्थक अर्थ रखता है; ‘उनके लिए’ उस कृपा को स्वाभाविक रूप से व्यक्त करता है जो शासक लोगों के लिए किया करता था।
