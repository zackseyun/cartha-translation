  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले वृत्तांत से पद को जोड़ता है और मरकुस की सरल कथात्मक प्रवाह-शैली बनाए रखता है।
- source_word: κατηγόρουν
  choice: आरोप लगा रहे थे
  rationale: अपूर्ण भूतकाल का रूप चलती या बार-बार की जा रही कार्रवाई दिखाता है; इसलिए यह प्रयोग केवल ‘आरोप लगाया’ से अधिक उपयुक्त है।
- source_word: αὐτοῦ
  choice: उस पर
  rationale: κατηγορέω के साथ संबंधकारक उस व्यक्ति को बताता है जिसके विरुद्ध आरोप लगाए जा रहे थे; हिन्दी में ‘उस पर आरोप लगाना’ स्वाभाविक है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: यह बहुवचन पद तत्कालीन प्रमुख याजकीय अधिकारियों के लिए है, न कि अनेक महायाजकों के लिए; ‘प्रधान याजक’ प्रचलित और सटीक पद है।
- source_word: πολλά
  choice: बहुत-से आरोप
  rationale: नपुंसकलिंग बहुवचन यहाँ अनेक बातों या आरोपों की व्यापकता बताता है। हिन्दी में ‘बहुत-से आरोप’ स्वाभाविक है, यद्यपि यूनानी केवल अनेक विषयों पर दोषारोपण का अर्थ भी दे सकता है।
