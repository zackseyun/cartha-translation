  yaml_path: translation/nt/mark/015/037.yaml
  text: But Jesus[a], uttering a loud cry[b], breathed his last.
translation:
  language: hi
  text: पर यीशु ने ऊँची पुकार लगाई[a] और अंतिम साँस ली।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक बड़ी पुकार की’ अथवा ‘ऊँची आवाज़ निकाली।’
    reason: lexical_alternative
  - marker: b
    text: या ‘दम तोड़ दिया’ अथवा केवल ‘मर गए’; शाब्दिक अर्थ, ‘साँस बाहर छोड़ी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह हल्का कथात्मक संयोजक है। यहाँ ‘पर’ पिछले दृश्य से गंभीर मोड़ और हल्का विरोध दिखाता है, बिना अत्यधिक बल जोड़े।
- source_word: ἀφεὶς
  choice: लगाई
  rationale: ἀφίημι का यह प्रयोग आवाज़ या पुकार निकालने के अर्थ में है। ‘पुकार लगाई’ आधुनिक हिन्दी में स्वाभाविक रूप से उस मुखर उद्गार को व्यक्त करता है।
- source_word: φωνὴν μεγάλην
  choice: ऊँची पुकार
  rationale: φωνή यहाँ ‘आवाज़’ या ‘पुकार’ हो सकता है और μεγάλη तीव्रता अथवा ऊँचे स्वर को बताता है। क्रूस-मृत्यु के प्रसंग में ‘ऊँची पुकार’ स्वाभाविक और सटीक है।
- source_word: ἐξέπνευσεν
  choice: अंतिम साँस ली
  rationale: ἐκπνέω का शाब्दिक संबंध साँस बाहर छोड़ने से और मुहावरेदार अर्थ मृत्यु से है। ‘अंतिम साँस ली’ मृत्यु को स्पष्ट करते हुए यूनानी की शारीरिक साँस वाली छवि बनाए रखता है।
- source_word: ὁ δὲ Ἰησοῦς
  choice: पर यीशु ने
  rationale: यूनानी में व्यक्तिवाचक नाम से पहले आए लेख का हिन्दी में अलग अनुवाद आवश्यक नहीं है; δέ को ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: यीशु की मृत्यु का वर्णन करते समय अतिरिक्त धर्मवैज्ञानिक अर्थ न जोड़ना
  choice: अंतिम साँस ली
  alternative: प्राण त्याग दिए
  rationale: मुख्य अनुवाद यूनानी क्रिया की साँस संबंधी छवि और मृत्यु के सामान्य अर्थ, दोनों को सुरक्षित रखता है। ‘प्राण त्याग दिए’ स्वेच्छा अथवा आत्मा सौंपने का ऐसा अतिरिक्त संकेत दे सकता है जो इस क्रिया में स्वयं स्पष्ट नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गंभीर कथात्मक शैली में है। ‘ऊँची पुकार लगाई’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘अंतिम साँस ली’ मूल की साँस संबंधी छवि और प्रसंग की गरिमा बनाए रखता है।
