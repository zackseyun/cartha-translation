source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος πάλιν ⸀ἐπηρώτα αὐτὸν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; ἴδε πόσα σου ⸀κατηγοροῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/004.yaml
  text: But Pilate again questioned him, saying, “Do you give no answer? Look how many charges they are bringing against you.”
translation:
  language: hi
  text: पर पिलातुस ने उससे फिर पूछा, “क्या तुम कोई उत्तर नहीं देते? देखो, वे तुम पर कितने आरोप लगा रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: कथा में हल्का विरोध और अगली कार्रवाई का संकेत देता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: πάλιν
  choice: फिर
  rationale: पूछने की क्रिया दोहराए जाने को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐπηρώτα
  choice: पूछा
  rationale: न्यायिक प्रसंग में पिलातुस के प्रश्न करने को व्यक्त करता है। यूनानी अपूर्ण काल में जारी या दोहराई गई क्रिया की छाया है, जिसे ‘फिर’ के साथ हिन्दी में पर्याप्त रूप से संप्रेषित किया गया है।
- source_word: λέγων
  choice: पूछा, “…”
  rationale: यूनानी का शाब्दिक ‘कहते हुए’ हिन्दी में अनावश्यक रूप से भारी होता; प्रत्यक्ष कथन को ‘पूछा’ के बाद रखना स्वाभाविक है।
- source_word: Οὐκ ἀποκρίνῃ οὐδέν;
  choice: क्या तुम कोई उत्तर नहीं देते?
  rationale: नकारात्मक प्रश्न यीशु की चुप्पी पर दबाव डालता है; यह रूप उसी बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἴδε
  choice: देखो
  rationale: सामने हो रही बात की ओर ध्यान खींचने वाला आज्ञार्थक रूप है; ‘निहारो’ या ‘देख’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: πόσα
  choice: कितने आरोप
  rationale: शाब्दिक अर्थ ‘कितनी बातें’ है, पर κατηγοροῦσιν और न्यायिक प्रसंग से आरोप निहित हैं; हिन्दी में उन्हें स्पष्ट करना स्वाभाविक है।
- source_word: σου
  choice: तुम पर
  rationale: κατηγορέω के साथ संबंध आरोपी व्यक्ति को दर्शाता है; हिन्दी में ‘तुम पर आरोप लगाना’ मुहावरेदार प्रयोग है।
- source_word: κατηγοροῦσιν
  choice: आरोप लगा रहे हैं
  rationale: कानूनी प्रसंग में इसका अर्थ दोषारोपण करना है; प्रगतिशील रूप वर्तमान में जारी आरोपों को स्पष्ट करता है।
theological_decisions: []
