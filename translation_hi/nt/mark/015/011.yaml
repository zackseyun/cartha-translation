base_translation:
  language: en
  yaml_path: translation/nt/mark/015/011.yaml
  text: But the chief priests stirred up the crowd so that he would release Barabbas to them instead[a][b].
translation:
  language: hi
  text: पर प्रधान याजकों ने भीड़ को उकसाया कि वह उन्हें बरअब्बा ही रिहा कर दे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भीड़ को भड़काया।’ यूनानी क्रिया का अर्थ किसी समूह को इच्छित कार्रवाई के लिए उत्तेजित या उकसाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘बल्कि।’ यहाँ भाव यह है कि प्रसंग में निहित दूसरे विकल्प की अपेक्षा बरअब्बा को रिहा किया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ
  choice: पर
  rationale: δέ यहाँ पिछले प्रसंग के साथ हल्का विरोध दिखाता है; आधुनिक कथा-शैली में ‘पर’ स्वाभाविक और स्पष्ट है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजकों
  rationale: यह यरूशलेम के वरिष्ठ याजकीय नेतृत्व के लिए प्रचलित और सटीक हिन्दी पद है।
- source_word: ἀνέσεισαν
  choice: उकसाया
  rationale: ἀνασείω भीड़ को किसी इच्छित कार्रवाई की ओर भड़काने या उत्तेजित करने का भाव रखता है; ‘उकसाया’ यहाँ संक्षिप्त और स्वाभाविक है।
- source_word: τὸν ὄχλον
  choice: भीड़ को
  rationale: ὄχλος का सीधा और वर्तमान हिन्दी पर्याय ‘भीड़’ है।
- source_word: ἵνα
  choice: कि
  rationale: हिन्दी में ‘उकसाया कि...’ उद्देश्यित परिणाम को सहज रूप से व्यक्त करता है।
- source_word: μᾶλλον
  choice: ही
  rationale: यह कण प्रसंग में निहित दूसरे विकल्प के बजाय बरअब्बा को चुनने पर बल देता है; ‘ही’ उस प्राथमिकता को बिना अनकहे विकल्प को पाठ में जोड़े व्यक्त करता है।
- source_word: τὸν Βαραββᾶν
  choice: बरअब्बा को
  rationale: व्यक्तिनाम का हिन्दी में प्रचलित लिप्यंतरण रखा गया है।
- source_word: ἀπολύσῃ
  choice: रिहा करे
  rationale: ἵνα के बाद आया एओरिस्ट सब्जंक्टिव इच्छित परिणाम बताता है; ‘रिहा करे’ हिन्दी में उद्देश्य और अप्रत्यक्ष आग्रह दोनों को स्वाभाविक रखता है।
- source_word: αὐτοῖς
  choice: उनके लिए
  rationale: दत्तिव सर्वनाम यहाँ लाभार्थी संबंध व्यक्त कर सकता है; ‘उनके लिए’ हिन्दी में ‘उनके पक्ष में/उनकी मांग पर’ के भाव को स्वाभाविक रूप से देता है।
