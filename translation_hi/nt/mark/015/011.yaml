translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘पर’ हल्का विरोध, ‘उकसाया’ जानबूझकर भीड़ को प्रेरित करने का भाव, और ‘ही’ μᾶλλον की तुलनात्मक प्राथमिकता व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
