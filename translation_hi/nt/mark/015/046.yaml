source:
  edition: SBLGNT
  text: καὶ ἀγοράσας ⸀σινδόνα καθελὼν αὐτὸν ἐνείλησεν τῇ σινδόνι καὶ ⸀ἔθηκεν αὐτὸν ἐν ⸀μνημείῳ ὃ ἦν λελατομημένον ἐκ πέτρας, καὶ προσεκύλισεν λίθον ἐπὶ τὴν θύραν τοῦ μνημείου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/046.yaml
  text: And after buying a linen cloth[a], he took him down, wrapped him in the linen cloth, and laid him in a tomb that had been cut out of rock[c][b]. Then he rolled a stone against the entrance of the tomb.
translation:
  language: hi
  text: उसने सन का एक कपड़ा[a] खरीदा, फिर यीशु को नीचे उतारकर उसे उस कपड़े में लपेटा और एक कब्र में रख दिया, जो चट्टान में से काटकर बनाई गई थी[b]। फिर उसने कब्र के प्रवेश-द्वार[c] पर एक पत्थर लुढ़का दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सन की चादर’ अथवा ‘कफ़न का कपड़ा’; यूनानी शब्द σινδών सन के कपड़े को दर्शाता है, जो यहाँ शव लपेटने के काम आया।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘चट्टान में से काटी गई थी।’
    reason: lexical_alternative
  - marker: c
    text: या ‘कब्र के द्वार’; यूनानी θύρα का अर्थ ‘द्वार’ या ‘प्रवेश-स्थान’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σινδόνα / σινδόνι
  choice: मलमल का एक कपड़ा / उस कपड़े
  rationale: σινδών एक महीन सन के कपड़े को दर्शाता है, जो यहाँ शव लपेटने के काम आया। ‘मलमल का कपड़ा’ आधुनिक हिन्दी में सामग्री और वस्तु दोनों को सहज रूप से व्यक्त करता है; दूसरी बार संकेतवाचक रूप स्वाभाविक हिन्दी देता है।
- source_word: καθελών
  choice: नीचे उतारकर
  rationale: संदर्भ में क्रूस से यीशु के शरीर को नीचे उतारना अभिप्रेत है। हिन्दी में कर्म स्पष्ट करने के लिए ‘यीशु को’ रखा गया है।
- source_word: ἐνείλησεν
  choice: लपेटा
  rationale: क्रिया का अर्थ लपेटना या चारों ओर कपड़ा डालना है; ‘लपेटा’ स्वाभाविक है और अतिरिक्त अंत्येष्टि-विवरण नहीं जोड़ता।
- source_word: ἔθηκεν
  choice: रख दिया
  rationale: τίθημι यहाँ शव को कब्र में रखने को व्यक्त करता है। ‘रख दिया’ सरल, स्वाभाविक और संदर्भानुकूल है।
- source_word: μνημείῳ / μνημείου
  choice: कब्र / कब्र के
  rationale: यह शब्द यहाँ चट्टान काटकर बनाए गए दफ़न-स्थान को दर्शाता है। हिन्दी में ‘कब्र’ सामान्य पाठक के लिए सर्वाधिक स्पष्ट और प्रचलित है।
- source_word: λελατομημένον ἐκ πέτρας
  choice: जो चट्टान को काटकर बनाई गई थी
  rationale: पूर्ण निष्क्रिय कृदंत कब्र की बनी हुई अवस्था बताता है। यह वाक्यांश πέτρα को ‘चट्टान’ और निर्माण को सुबोध आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσεκύλισεν
  choice: लुढ़का दिया
  rationale: क्रिया पत्थर को लुढ़काकर कब्र के मुँह तक ले जाने और वहाँ लगा देने का भाव देती है; दिशा अगले पदबंध से स्पष्ट होती है।
- source_word: ἐπὶ τὴν θύραν τοῦ μνημείου
  choice: कब्र के मुँह पर
  rationale: θύρα का अर्थ द्वार या प्रवेश-स्थान दोनों हो सकता है। चट्टानी कब्र के लिए ‘कब्र का मुँह’ स्वाभाविक हिन्दी है और भौतिक किवाड़ होने का अनावश्यक संकेत नहीं देता।
- source_word: ἀγοράσας
  choice: खरीदा, फिर
  rationale: अोरिस्ट कृदंत मुख्य क्रियाओं से पहले कपड़ा खरीदने की घटना बताता है। ‘खरीदा, फिर’ क्रम को सहज आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: αὐτόν के लिए नाम की स्पष्टता
  choice: पहली बार ‘यीशु को’, फिर प्रसंगानुसार निहित कर्म
  alternative: दोनों स्थानों पर ‘उसे’
  rationale: यूनानी सर्वनाम का संदर्भ यीशु से है। स्वतंत्र पद के रूप में हिन्दी में अस्पष्टता से बचने के लिए पहली बार नाम देना अर्थ को नहीं बदलता; बाद की क्रियाओं में हिन्दी स्वाभाविक रूप से कर्म को दोहराए बिना भी वही संदर्भ बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। घटनाओं का क्रम ‘फिर’ से स्पष्ट किया गया है। ‘कब्र के मुँह’ को बोलचाल और साहित्यिक हिन्दी दोनों में स्वाभाविक मानते हुए चुना गया है; पद में सभी पादटिप्पणी चिह्न [a], [b], [c] उपस्थित हैं।
