  text: ἦν δὲ ὁ λεγόμενος Βαραββᾶς μετὰ τῶν ⸀στασιαστῶν δεδεμένος οἵτινες ἐν τῇ στάσει φόνον πεποιήκεισαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/007.yaml
  text: The man called Barabbas was bound with the rebels who had committed murder in the rebellion[a].
translation:
  language: hi
  text: बरअब्बा कहलाने वाला व्यक्ति उन विद्रोहियों के साथ बँधा हुआ था, जिन्होंने उस विद्रोह[a] में हत्या की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विद्रोहियों’ के लिए ‘बगावत करने वालों’ और ‘विद्रोह’ के लिए ‘बगावत’ भी अनुवाद किया जा सकता है। यूनानी में विद्रोह में भाग लेने वालों और विद्रोह के लिए एक ही शब्द-परिवार के शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν δὲ
  choice: था
  rationale: δέ हल्का कथात्मक संयोजक है; इस एक वचन में अलग से ‘अब’ या ‘और’ जोड़ना आवश्यक नहीं। ἦν का भाव हिंदी की मुख्य क्रिया ‘था’ में स्वाभाविक रूप से व्यक्त है।
- source_word: ὁ λεγόμενος
  choice: कहलाने वाला व्यक्ति
  rationale: यह पद बरअब्बा की पहचान उसके प्रचलित नाम से कराता है। यह स्वाभाविक हिंदी है और ‘तथाकथित’ जैसा नकारात्मक भाव नहीं लाता।
- source_word: Βαραββᾶς
  choice: बरअब्बा
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: μετὰ τῶν στασιαστῶν
  choice: उन विद्रोहियों के साथ
  rationale: στασιασταί सशस्त्र या राजनीतिक विद्रोह में भाग लेने वालों को दर्शाता है। ‘विद्रोही’ आधुनिक पाठक के लिए स्पष्ट और प्रसंगानुकूल है।
- source_word: δεδεμένος
  choice: बँधा हुआ था
  rationale: δέω का पूर्ण निष्क्रिय कृदंत निरंतर बँधी हुई अवस्था बताता है। कारावास प्रसंग में निहित है, पर ‘बँधा हुआ’ यूनानी शब्दचित्र को सुरक्षित रखता है।
- source_word: οἵτινες
  choice: जिन्होंने
  rationale: संबंधवाचक सर्वनाम विद्रोहियों के बारे में वर्णनात्मक उपवाक्य आरंभ करता है।
- source_word: ἐν τῇ στάσει
  choice: उस विद्रोह में
  rationale: στάσις यहाँ केवल उपद्रव नहीं, बल्कि विद्रोह या बगावत को दर्शाता है। निश्चित उपपद का संकेत ‘उस’ से सुरक्षित रहता है।
- source_word: φόνον πεποιήκεισαν
  choice: हत्या की थी
  rationale: यह पूर्व में पूरी हो चुकी हत्या को दर्शाता है। ‘हत्या की थी’ अपराधात्मक अर्थ और काल-संबंध दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
