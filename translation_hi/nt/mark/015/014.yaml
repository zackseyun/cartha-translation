id: MRK.15.14
reference: Mark 15:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Πιλᾶτος ἔλεγεν αὐτοῖς· Τί γὰρ ⸂ἐποίησεν κακόν⸃; οἱ δὲ ⸀περισσῶς ἔκραξαν· Σταύρωσον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/014.yaml
  text: But Pilate was saying to them[a], “For what evil has he done?” But they cried out all the more, “Crucify him!”
translation:
  language: hi
  text: पर पिलातुस उनसे कह रहा था, “आखिर उसने कौन-सी बुराई की है?”[a] लेकिन वे और भी ज़ोर से चिल्लाए, “उसे क्रूस पर चढ़ा दो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भला उसने क्या गलत किया है?”
    reason: प्रश्नात्मक मुहावरे और κακόν के अधिक बोलचाल वाले वैकल्पिक अनुवाद को दर्शाता है।
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल की जारी या दोहराई जा रही क्रिया का भाव रखता है, पर अनावश्यक रूप से बार-बार कहने का अर्थ नहीं जोड़ता।
- source_word: Τί γὰρ ἐποίησεν κακόν
  choice: आखिर उसने कौन-सी बुराई की है?
  rationale: ‘आखिर’ γάρ के प्रश्नात्मक, कारण पूछने वाले बल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कौन-सी बुराई’ आरोप के आधार और κακόν की नैतिक गंभीरता दोनों को बनाए रखता है।
- source_word: κακόν
  choice: बुराई
  rationale: यह ‘गलती’ की अपेक्षा मूल शब्द के नैतिक बल को अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: περισσῶς
  choice: और भी ज़ोर से
  rationale: भीड़ की प्रतिक्रिया के बढ़ते हुए तीखेपन और ऊँची पुकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔκραξαν
  choice: चिल्लाए
  rationale: सार्वजनिक रूप से ऊँची आवाज़ में पुकारने का अर्थ संक्षिप्त और सहज हिन्दी में देता है।
- source_word: Σταύρωσον αὐτόν
  choice: उसे क्रूस पर चढ़ा दो!
  rationale: प्रत्यक्ष आज्ञा की तीव्रता बनाए रखता है और हिन्दी बाइबलीय प्रयोग में स्पष्ट तथा प्रचलित है।
- source_word: δὲ
  choice: पर / लेकिन
  rationale: दोनों स्थानों पर विरोध और कथन के मोड़ को स्वाभाविक हिन्दी संयोजकों से स्पष्ट किया गया है।
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: नाम का मानक हिन्दी बाइबलीय लिप्यंतरण है।
theological_decisions:
- issue: पिलातुस के प्रश्न में κακόν का नैतिक बल
  choice: ‘बुराई’
  alternative: ‘गलत काम’ या ‘गलती’
  rationale: ‘बुराई’ कानूनी और नैतिक आरोप की गंभीरता को कम किए बिना मूल शब्द का बल बनाए रखती है; इससे कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘क्रूस पर चढ़ा दो’ परिचित बाइबलीय अभिव्यक्ति है, जबकि शेष वाक्य सामान्य पाठक के लिए स्वाभाविक रखा गया है।
