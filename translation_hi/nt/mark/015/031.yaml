  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁμοίως καὶ οἱ ἀρχιερεῖς ἐμπαίζοντες πρὸς ἀλλήλους μετὰ τῶν γραμματέων ἔλεγον· Ἄλλους ἔσωσεν, ἑαυτὸν οὐ δύναται σῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/031.yaml
  text: In the same way the chief priests[a], mocking among themselves with the scribes, were saying, “He saved others; he cannot save himself.”
translation:
  language: hi
  text: इसी प्रकार प्रधान याजक भी शास्त्रियों के साथ आपस में उसका उपहास करते हुए कह रहे थे, “उसने दूसरों को बचाया, पर अपने आपको नहीं बचा सकता।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁμοίως
  choice: इसी प्रकार
  rationale: यह पिछले पदों में हुए उपहास के समानांतर उपहास को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद leading priestly authorities को सूचित करता है; ‘प्रधान याजक’ स्थापित और सटीक हिन्दी पद है।
- source_word: ἐμπαίζοντες
  choice: उसका उपहास करते हुए
  rationale: क्रिया का लक्ष्य सन्दर्भ से यीशु है; हिन्दी में कर्म जोड़ने से वाक्य स्वाभाविक होता है और तिरस्कारपूर्ण मज़ाक का भाव स्पष्ट रहता है।
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: यह पारस्परिक संवाद को व्यक्त करता है—वे एक-दूसरे का नहीं, बल्कि आपस में यीशु का उपहास कर रहे थे।
- source_word: μετὰ τῶν γραμματέων
  choice: शास्त्रियों के साथ
  rationale: यह बताता है कि शास्त्री भी प्रधान याजकों के साथ इस उपहास में सम्मिलित थे।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल जारी या दोहराए जा रहे कथन का भाव देता है, जिसे हिन्दी का अपूर्ण पक्ष सुरक्षित रखता है।
- source_word: Ἄλλους ἔσωσεν
  choice: इसने दूसरों को बचाया
  rationale: ‘बचाया’ σῴζω के उद्धार, रक्षा या छुड़ाने के व्यापक और विडंबनापूर्ण अर्थ को बनाए रखता है; निकट उपस्थित व्यक्ति के लिए ‘इसने’ ताने के स्वर में स्वाभाविक है।
- source_word: ἑαυτὸν οὐ δύναται σῶσαι
  choice: पर अपने आपको नहीं बचा सकता
  rationale: ‘बचा’ की पुनरावृत्ति यूनानी शब्द-संबंध और कथन की विडंबना को बनाए रखती है; ‘पर’ मूल में निहित तीखे विरोध को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दोनों उपवाक्यों में σῴζω का समान अनुवाद
  choice: बचाया ... बचा सकता
  alternative: छुड़ाया ... छुड़ा सकता
  rationale: एक ही हिन्दी धातु की पुनरावृत्ति यूनानी की शब्दगत कड़ी और ताने में निहित उद्धार-संबंधी विडंबना को सुरक्षित रखती है, बिना अर्थ को केवल शारीरिक बचाव या किसी संकीर्ण धर्मवैज्ञानिक अर्थ तक सीमित किए।
- issue: ‘नहीं बचा सकता’ में सामर्थ्य का कथन
  choice: उनके उपहासपूर्ण कथन के रूप में यथावत
  alternative: अपने आपको नहीं बचाता
  rationale: οὐ δύναται स्पष्ट रूप से असमर्थता का आरोप व्यक्त करता है। अनुवाद इसे वक्ताओं के ताने के रूप में रखता है और इसे वर्णनकर्ता का धर्मवैज्ञानिक निर्णय नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। वाक्य-विन्यास यूनानी की पारस्परिक अभिव्यक्ति को ‘आपस में’ द्वारा स्पष्ट करता है। किसी पाद-टिप्पणी की आवश्यकता नहीं, क्योंकि मुख्य पाठ में अर्थगत अस्पष्टता को स्वाभाविक रूप से पर्याप्त रूप में रखा गया है।
