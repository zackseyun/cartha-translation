    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδίδουν
  choice: दे रहे थे
  rationale: अपूर्ण भूतकाल चल रहे या प्रयास किए जा रहे कार्य को दर्शाता है; यह रूप साधारण ‘दिया’ की अपेक्षा यूनानी पक्ष को बेहतर बनाए रखता है। संदर्भ में इसका अर्थ ‘पिला रहे थे’ नहीं, क्योंकि उसने लिया ही नहीं।
- source_word: ἐσμυρνισμένον οἶνον
  choice: गन्धरस मिला हुआ दाखरस
  rationale: कृदन्त का अर्थ गन्धरस से तैयार या मिश्रित किया हुआ है। ‘गन्धरस मिला हुआ दाखरस’ पदार्थ और मिश्रण दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃς δὲ
  choice: पर उसने
  rationale: ὃς रूपतः सम्बन्धवाचक सर्वनाम है, पर यहाँ यीशु को फिर से विषय बनाता है; δέ का हल्का विरोध ‘पर’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: ἔλαβεν
  choice: उसे नहीं लिया
  rationale: λαμβάνω का सीधा अर्थ ‘लेना/ग्रहण करना’ है। हिन्दी में प्रसंगगत कर्म ‘उसे’ जोड़ने से वाक्य स्पष्ट रहता है और अस्वीकार का कारण नहीं जोड़ा जाता।
theological_decisions:
- issue: यीशु द्वारा पेय न लेने का कारण
  choice: 'घटना को केवल वर्णनात्मक रूप में रखना: उसने उसे नहीं लिया।'
  alternative: इसे पीड़ा घटाने वाले मादक पेय का सचेत अस्वीकार या किसी प्रथा का निषेध बताना।
  rationale: यूनानी पाठ केवल पेय दिए जाने और यीशु के उसे न लेने की बात कहता है; उसके उद्देश्य या अस्वीकार के कारण की व्याख्या पद में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘दाखरस’ बाइबलीय संदर्भ में परिचित है, जबकि ‘गन्धरस’ μύρρα को सटीक रूप से व्यक्त करता है। मुख्य पाठ में अपूर्ण क्रिया का पक्ष ‘दे रहे थे’ से सुरक्षित रखा गया है।
