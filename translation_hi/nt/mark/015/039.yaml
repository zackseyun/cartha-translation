source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ κεντυρίων ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ ὅτι ⸀οὕτως ἐξέπνευσεν εἶπεν· Ἀληθῶς ⸂οὗτος ὁ ἄνθρωπος⸃ υἱὸς ⸂θεοῦ ἦν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/039.yaml
  text: When the centurion[a], who was standing opposite him, saw that he breathed his last in this way, he said, “Truly this man was God's Son.”
translation:
  language: hi
  text: जब रोमी सेंचुरियन ने, जो यीशु के सामने खड़ा था, यह देखा कि उन्होंने इस प्रकार प्राण छोड़े, तो उसने कहा, “सचमुच यह मनुष्य परमेश्वर का पुत्र था।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सचमुच यह मनुष्य परमेश्वर का एक पुत्र था।” यूनानी अभिव्यक्ति को गुणवाचक या अनिश्चित अर्थ में भी समझा जा सकता है, पर मरकुस के प्रसंग में संभवतः इसका बल “परमेश्वर का पुत्र” पदवी पर है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν δὲ
  choice: जब ... ने ... देखा
  rationale: ἰδών को यहाँ समय-सूचक रूप में स्वाभाविक हिन्दी ‘जब ... देखा’ से व्यक्त किया गया है। हल्के संयोजक δέ के लिए अलग शब्द जोड़ना आवश्यक नहीं है; ‘तो’ वाक्य के संबंध को स्पष्ट करता है।
- source_word: κεντυρίων
  choice: सूबेदार
  rationale: यह रोमी सेना में लगभग सौ सैनिकों की टुकड़ी के अधिकारी का पद था। ‘सूबेदार’ आधुनिक हिन्दी पाठकों के लिए संक्षिप्त और परिचित पदनाम है, यद्यपि ऐतिहासिक पदों में पूर्ण समानता नहीं है।
- source_word: ὁ παρεστηκὼς ἐξ ἐναντίας αὐτοῦ
  choice: जो यीशु के सामने खड़ा था
  rationale: παρεστηκώς पहले से बनी हुई खड़े रहने की स्थिति बताता है, और ἐξ ἐναντίας आमने-सामने की स्थानगत स्थिति। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए ‘उसके’ के स्थान पर ‘यीशु के’ कहा गया है।
- source_word: ὅτι οὕτως ἐξέπνευσεν
  choice: यह देखा कि उन्होंने इस प्रकार प्राण छोड़े
  rationale: ἐκπνέω का शाब्दिक संबंध अंतिम साँस छोड़ने से और मुहावरेदार अर्थ मृत्यु से है। ‘प्राण छोड़े’ दोनों का सजीव और गरिमापूर्ण हिन्दी रूप है; οὕτως को ‘इस प्रकार’ से स्पष्ट रूप से रखा गया है।
- source_word: Ἀληθῶς
  choice: सचमुच
  rationale: यह ἀληθῶς की दृढ़ और गंभीर घोषणा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὗτος ὁ ἄνθρωπος
  choice: यह मनुष्य
  rationale: ἄνθρωπος यहाँ यीशु को एक मनुष्य के रूप में निर्दिष्ट करता है। ‘यह मनुष्य’ मूल की स्पष्टता और कथन की गंभीरता बनाए रखता है।
- source_word: υἱὸς θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: मरकुस के व्यापक कथानक में यह अभिव्यक्ति एक महत्त्वपूर्ण मसीही पदवी का बल रखती है। फिर भी यूनानी में पदबंध के व्याकरणिक रूप से उत्पन्न गुणात्मक अथवा अनिश्चित अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἦν
  choice: था
  rationale: εἰμί का अपूर्ण भूतकाल यहाँ सीधे भूतकालीन कथन है; इसलिए ‘था’ रखा गया है, ‘है’ नहीं।
theological_decisions:
- issue: सूबेदार के कथन में υἱὸς θεοῦ का बल
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का एक पुत्र
  rationale: मरकुस के सुसमाचार में ‘परमेश्वर का पुत्र’ यीशु की पहचान से जुड़ी एक प्रमुख पदवी है, इसलिए मुख्य पाठ में यही कथानक-संगत अर्थ रखा गया है। यूनानी पदबंध में निश्चयवाचक उपपद न होने के कारण अनिश्चित या गुणात्मक पाठ की वास्तविक संभावना को पादटिप्पणी में बताया गया है; उसे चुपचाप समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। यीशु के लिए आदरसूचक बहुवचन (‘उन्होंने’) और सूबेदार के लिए एकवचन (‘उसने’) प्रयोग किया गया है। ‘सूबेदार’ परिचित है, जबकि अत्यधिक पुराना ‘शतपति’ टाला गया है।
