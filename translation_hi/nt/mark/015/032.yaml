id: MRK.15.32
reference: Mark 15:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ χριστὸς ὁ ⸀βασιλεὺς Ἰσραὴλ καταβάτω νῦν ἀπὸ τοῦ σταυροῦ, ἵνα ἴδωμεν καὶ ⸀πιστεύσωμεν. καὶ οἱ συνεσταυρωμένοι ⸀σὺν αὐτῷ ὠνείδιζον αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/032.yaml
  text: Let the Messiah[a], the King of Israel, come down now from the cross[b], so that we may see and believe.” And those who were crucified with him were also insulting him.
translation:
  language: hi
  text: मसीह[a], इस्राएल का राजा, अब क्रूस पर से उतर आए, ताकि हम देखें और विश्वास करें।” और जो उसके साथ क्रूस पर चढ़ाए गए थे, वे भी उसका अपमान[b] कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी Χριστός का अर्थ “अभिषिक्त जन” है और यहाँ यह राजकीय उपाधि के रूप में प्रयुक्त हुआ है।
    reason: alternative_reading
  - marker: b
    text: या, “उसकी निन्दा कर रहे थे” अथवा “उसे ताने दे रहे थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ यह नाम-जैसा प्रयोग नहीं, बल्कि इस्राएल के अभिषिक्त राजा की उपाधि के रूप में उपहासपूर्ण चुनौती का भाग है। ‘मसीह’ आधुनिक हिन्दी में इस उपाधि का स्वाभाविक और प्रचलित रूप है।
- source_word: ὁ βασιλεὺς Ἰσραήλ
  choice: इस्राएल का राजा
  rationale: यह सम्बन्धवाचक पदबंध को सीधे और स्वाभाविक ढंग से व्यक्त करता है तथा राजकीय दावे पर किए जा रहे उपहास को बनाए रखता है।
- source_word: καταβάτω νῦν ἀπὸ τοῦ σταυροῦ
  choice: अब क्रूस पर से उतर आए
  rationale: तीसरे पुरुष की आज्ञार्थक चुनौती और νῦν की तात्कालिकता दोनों सुरक्षित हैं। ‘उतर आए’ हिन्दी में ऊपर स्थित स्थान से नीचे आने की स्वाभाविक अभिव्यक्ति है।
- source_word: ἵνα ἴδωμεν καὶ πιστεύσωμεν
  choice: ताकि हम देखें और विश्वास करें
  rationale: ἵνα के प्रयोजनात्मक भाव तथा दोनों सहगामी क्रियाओं को संक्षिप्त और स्पष्ट रूप में रखा गया है; वक्ताओं की व्यंग्यपूर्ण शर्त को न तो समझाया गया है, न नरम किया गया है।
- source_word: οἱ συνεσταυρωμένοι σὺν αὐτῷ
  choice: जो उसके साथ क्रूस पर चढ़ाए गए थे
  rationale: पूर्ण कृदन्त के निष्क्रिय भाव और यीशु के साथ उसी दण्ड में सहभागी लोगों का अर्थ स्पष्ट रहता है।
- source_word: ὠνείδιζον αὐτόν
  choice: उसका अपमान कर रहे थे
  rationale: अपूर्ण काल के चलते रहने वाले कार्य को ‘कर रहे थे’ से व्यक्त किया गया है। ὀνειδίζω में अपमान, निन्दा और ताना देने की अर्थ-छाया है; मुख्य पाठ में सहज आधुनिक हिन्दी चुनी गई है।
- source_word: καί
  choice: भी
  rationale: यह पिछले पदों में वर्णित उपहास से इन क्रूसित लोगों के व्यवहार को जोड़ता है।
theological_decisions:
- issue: उपहास के प्रसंग में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रसंग में Χριστός इस्राएल के प्रत्याशित अभिषिक्त राजा की उपाधि है। ‘मसीह’ राजकीय-अभिषिक्त अर्थ को पाठक के लिए अधिक स्पष्ट रखता है, जबकि ‘ख्रीस्त’ ध्वन्यात्मक रूप है।
- issue: ‘देखें और विश्वास करें’ में विश्वास का आशय
  choice: अकर्मक ‘विश्वास करें’
  alternative: ‘उस पर विश्वास करें’
  rationale: यूनानी पाठ πιστεύσωμεν के साथ कर्म या εἰς-वाक्यांश नहीं देता। इसलिए अनुवाद उस व्यक्ति या विषय को स्पष्ट करके मूल की खुली संरचना को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘क्रूस,’ ‘मसीह’ और ‘इस्राएल’ जैसे स्थापित बाइबलीय पद बनाए गए हैं। वाक्य की चुनौतीपूर्ण, व्यंग्यात्मक ध्वनि तथा अंतिम क्रिया का सतत पक्ष सुरक्षित है। आरम्भिक उद्धरण-चिह्न नहीं जोड़ा गया, क्योंकि कथन पिछले पद से जारी है; समापन उद्धरण-चिह्न इस पद में वाणी की समाप्ति दिखाता है।
