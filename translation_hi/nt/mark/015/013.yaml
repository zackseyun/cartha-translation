lexical_decisions:
- source_word: οἱ
  choice: वे
  rationale: यह बहुवचन संबंधवाचक लेख यहाँ संज्ञा के समान प्रयुक्त होकर पहले से संदर्भित समूह को दर्शाता है; हिन्दी में स्वाभाविक रूप से ‘वे’ उपयुक्त है।
- source_word: δὲ
  choice: पर
  rationale: δέ पिलातुस की पिछली बात के उत्तर में हल्का विरोध या कथानक का मोड़ दिखाता है; ‘पर’ इस बल को स्वाभाविक और बिना अतिशयोक्ति के व्यक्त करता है।
- source_word: πάλιν
  choice: फिर
  rationale: πάλιν पुकार की पुनरावृत्ति स्पष्ट करता है; ‘फिर’ संक्षिप्त और सहज हिन्दी है।
- source_word: ἔκραξαν
  choice: चिल्ला उठे
  rationale: κράζω ऊँची और तीव्र पुकार को दर्शाता है; ‘चिल्ला उठे’ उस तीव्रता तथा तत्काल प्रतिक्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Σταύρωσον
  choice: क्रूस पर चढ़ा
  rationale: यह द्वितीय पुरुष एकवचन का सीधा आदेश है, जो पिलातुस को संबोधित है। ‘क्रूस पर चढ़ा’ प्रत्यक्ष आज्ञार्थक रूप को बनाए रखता है; ‘चढ़वा दे’ अनावश्यक रूप से परोक्ष कारकता जोड़ देता।
- source_word: αὐτόν
  choice: उसे
  rationale: यह यीशु की ओर संकेत करने वाला कर्मकारक एकवचन सर्वनाम है; हिन्दी में ‘उसे’ इसका सीधा और स्वाभाविक रूप है।
