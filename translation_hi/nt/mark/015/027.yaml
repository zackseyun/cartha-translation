  yaml_path: translation/nt/mark/015/027.yaml
  text: And with him they crucify two robbers[a], one at his right and one at his left.
translation:
  language: hi
  text: और उसके साथ वे दो लुटेरों[a] को क्रूस पर चढ़ाते हैं—एक को उसकी दाहिनी ओर और एक को उसकी बाईं ओर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “डाकुओं”; यदि इस शब्द में राजनीतिक निहितार्थ हो, तो “बाग़ी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σὺν αὐτῷ
  choice: उसके साथ
  rationale: सύν के साथ संबंधकारक यहाँ संगति या साथ होने का भाव देता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: σταυροῦσιν
  choice: वे ... क्रूस पर चढ़ाते हैं
  rationale: यूनानी क्रिया वर्तमानकाल, कर्तृवाच्य, बहुवचन में है। मरकुस के ऐतिहासिक वर्तमान की कथात्मक सजीवता बनाए रखने के लिए हिन्दी में वर्तमानकाल रखा गया है।
- source_word: δύο λῃστάς
  choice: दो लुटेरों
  rationale: λῃστής का अर्थ लुटेरा, डाकू या सशस्त्र बाग़ी हो सकता है। मुख्य पाठ में 'लुटेरे' व्यापक, सहज और प्रसंगानुकूल है; अधिक विशिष्ट संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: ἕνα ἐκ δεξιῶν
  choice: एक को उसकी दाहिनी ओर
  rationale: इस स्थान-सूचक मुहावरे का अर्थ दाहिनी तरफ़ रखा जाना है; 'उसकी दाहिनी ओर' आधुनिक हिन्दी में स्पष्ट है।
- source_word: ἕνα ἐξ εὐωνύμων αὐτοῦ
  choice: एक को बाईं ओर
  rationale: εὐώνυμος यहाँ दाहिनी ओर के विपरीत बाईं ओर को सूचित करता है। समानांतर रचना और निकटवर्ती 'उसकी' से संबंध स्पष्ट रहता है, इसलिए अनावश्यक पुनरावृत्ति नहीं की गई।
theological_decisions:
- issue: क्रूस पर चढ़ाए गए लोगों के लिए λῃσταί का अनुवाद
  choice: लुटेरे
  alternative: डाकू; संभवतः बाग़ी
  rationale: शब्द हिंसक लुटेरों या डाकुओं को बता सकता है और कुछ प्रसंगों में राजनीतिक विद्रोहियों के लिए भी प्रयुक्त हो सकता है। यह पद अकेले राजनीतिक अर्थ को निश्चित नहीं करता, इसलिए मुख्य पाठ व्यापक अर्थ रखता है और विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ऐतिहासिक वर्तमान को बनाए रखा गया है। 'क्रूस पर चढ़ाते हैं' सामान्य पाठक के लिए स्पष्ट बाइबिलीय अभिव्यक्ति है।
