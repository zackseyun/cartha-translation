  yaml_path: translation/nt/mark/015/022.yaml
  text: And they bring him to the place Golgotha[a], which is translated, “Place of a Skull.”
translation:
  language: hi
  text: और वे उसे गुलगुता नामक स्थान तक ले आते हैं, जिसका अनुवाद “खोपड़ी का स्थान” है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φέρουσιν
  choice: लाते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथन में वर्तमान काल से रखा गया है। ‘लाते हैं’ गंतव्य तक ले जाने का भाव देता है, बिना यह अनावश्यक रूप से बताए कि उसे उठाकर ले जाया गया था।
- source_word: ἐπὶ τὸν Γολγοθᾶν τόπον
  choice: गुलगुता नाम के स्थान पर
  rationale: ἐπί के साथ कर्मकारक यहाँ किसी गंतव्य की ओर गति बताता है। हिन्दी में τόπον और स्थान-नाम दोनों को स्वाभाविक ढंग से बनाए रखने के लिए ‘नाम के स्थान पर’ कहा गया है; यद्यपि ‘नाम के’ का भाव यूनानी में अलग शब्द के रूप में नहीं है, हिन्दी में पदबंध की स्पष्टता के लिए यह आवश्यक है।
- source_word: Γολγοθᾶν
  choice: गुलगुता
  rationale: स्थान-नाम का अनुवाद नहीं, देवनागरी में लिप्यंतरण किया गया है; हिन्दी बाइबल-परंपरा में प्रचलित रूप ‘गुलगुता’ रखा गया है।
- source_word: μεθερμηνευόμενον
  choice: जिसका अनुवाद है
  rationale: यह कृदंत एक भाषा की अभिव्यक्ति का दूसरी भाषा में अनुवाद या अर्थ स्पष्ट करने को बताता है। ‘जिसका अनुवाद है’ इसकी व्याख्यात्मक भूमिका को स्पष्ट और निकट रूप से व्यक्त करता है।
- source_word: Κρανίου Τόπος
  choice: खोपड़ी का स्थान
  rationale: जननवाचक रचना को स्वाभाविक आधुनिक हिन्दी में रखा गया है। हिन्दी में ‘खोपड़ी का स्थान’ निश्चित और अनिश्चित दोनों प्रकार के संदर्भ के लिए खुला रह सकता है, इसलिए यूनानी में article के अभाव से उत्पन्न अस्पष्टता को अलग कृत्रिम रूप से नहीं सुलझाया गया।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ऐतिहासिक वर्तमान बनाए रखा गया है। ‘गुलगुता नाम के स्थान’ हिन्दी में स्वाभाविकता और मूल के τόπον दोनों को सुरक्षित रखता है। Κρανίου Τόπος की article-संबंधी अस्पष्टता हिन्दी में ‘खोपड़ी का स्थान’ द्वारा स्वाभाविक रूप से बनी रहती है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
