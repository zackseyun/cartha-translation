  yaml_path: translation/nt/mark/015/030.yaml
  text: Save yourself[a], coming down from the cross!
translation:
  language: hi
  text: क्रूस से नीचे उतरकर अपने आप को बचा[a]!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: ‘अपने आप को बचा, क्रूस से नीचे उतरकर’; या, ‘अपने आप को बचा; क्रूस से नीचे उतर आ!’'
    reason: καταβάς कृदन्त का मुख्य आज्ञार्थक σῶσον से संबंध एक से अधिक ढंग से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: σῶσον
  choice: बचा
  rationale: यह द्वितीय पुरुष एकवचन का अओरिस्ट आज्ञार्थक है। उपहासपूर्ण चुनौती के प्रसंग में ‘बचा’ सीधा और स्वाभाविक है तथा उद्धार/बचाव से जुड़ी अर्थ-छाया को बनाए रखता है।
- source_word: σεαυτόν
  choice: अपने आप को
  rationale: यह कर्मकारक आत्मवाचक सर्वनाम है और σῶσον का सीधा कर्म है। ‘अपने आप को’ उपहास में निहित आत्म-निर्देशित चुनौती को स्पष्ट रखता है।
- source_word: καταβάς
  choice: नीचे उतरकर
  rationale: यह καταβαίνω का अओरिस्ट सक्रिय कृदन्त है। हिन्दी का ‘उतरकर’ मुख्य आज्ञा से जुड़ी पूर्ववर्ती अथवा सहगामी क्रिया को संक्षेप में व्यक्त करता है, बिना उसे अलग स्पष्ट आज्ञा बनाए।
- source_word: ἀπὸ τοῦ σταυροῦ
  choice: क्रूस से
  rationale: ἀπό यहाँ क्रूस से दूर होने की गति दर्शाता है। इस दुःखभोग-प्रसंग में σταυρός के लिए ‘क्रूस’ हिन्दी का प्रचलित और सटीक शब्द है।
theological_decisions:
- issue: कृदन्त καταβάς और आज्ञार्थक σῶσον का संबंध
  choice: ‘क्रूस से नीचे उतरकर अपने आप को बचा!’
  alternative: ‘अपने आप को बचा; क्रूस से नीचे उतर आ!’
  rationale: यूनानी में एक आज्ञार्थक क्रिया के साथ अओरिस्ट कृदन्त की संक्षिप्त रचना है। ‘उतरकर’ उस संबंध को हिन्दी में स्वाभाविक ढंग से रखता है, पर उसे अनिवार्य रूप से साधन, परिणाम या दूसरी स्वतंत्र आज्ञा घोषित नहीं करता। पादटिप्पणी समन्वित आज्ञाओं की सम्भावना भी सामने रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। एकवचन अनौपचारिक आज्ञा ‘बचा’ विरोधियों की तिरस्कारपूर्ण चुनौती के स्वर के अनुकूल है।
