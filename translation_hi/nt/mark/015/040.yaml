    text: यहाँ यूनानी नाम योसेस है, जो यूसुफ नाम से भिन्न रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἦσαν δὲ καὶ
  choice: वहाँ कुछ स्त्रियाँ भी
  rationale: हिन्दी कथन-शैली में अस्तित्वसूचक वाक्य स्वाभाविक बनाया गया है; ‘भी’ καί का योगात्मक भाव रखता है, जबकि δέ को अलग संयोजक से व्यक्त करना आवश्यक नहीं।
- source_word: ἀπὸ μακρόθεν θεωροῦσαι
  choice: दूर से देख रही थीं
  rationale: यह स्थानगत दूरी और वर्तमान कृदन्त में निहित लगातार देखने—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐν αἷς
  choice: जिनमें
  rationale: यह आगे नामित स्त्रियों को पहले बताए गए बड़े समूह के भीतर रखता है।
- source_word: Μαρία ἡ Μαγδαληνή
  choice: मरियम मगदलीनी
  rationale: नए नियम की हिन्दी परंपरा में पहचाना जाने वाला नामरूप है और मगदला से संबद्ध उपनाम का भाव बनाए रखता है।
- source_word: Μαρία ἡ Ἰακώβου τοῦ μικροῦ καὶ Ἰωσῆτος μήτηρ
  choice: छोटे याकूब और योसेस की माता मरियम
  rationale: μήτηρ का संबंध दोनों संबंधकारक नामों से है। τοῦ μικροῦ की अस्पष्टता को ‘छोटे’ रखता है, जो आयु, कद या महत्त्व में तुलना को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Ἰωσῆτος
  choice: योसेस
  rationale: यूनानी नाम Ἰωσῆς के विशिष्ट रूप को ‘यूसुफ’ में समरूप किए बिना सुरक्षित रखता है।
- source_word: Σαλώμη
  choice: सलोमी
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित और स्पष्ट हिन्दी लिप्यंतरण।
theological_decisions:
- issue: τοῦ μικροῦ से याकूब का वर्णन
  choice: छोटे याकूब
  alternative: छोटे भाई/कम उम्र के याकूब; लघु याकूब
  rationale: मूल विशेषण आयु, कद या अपेक्षाकृत कम प्रमुख होने का संकेत दे सकता है, पर प्रसंग इसे निश्चित नहीं करता। ‘छोटे’ इस वास्तविक अस्पष्टता को बनाए रखता है; ‘छोटे भाई’ संबंध जोड़ देता और ‘लघु’ आधुनिक पाठक के लिए अस्वाभाविक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली। ‘स्त्रियाँ’, ‘माता’ और बाइबिलीय नामों के परिचित रूप सामान्य पाठकों के लिए स्पष्ट हैं। मूल पाठ की नाम-संबंधी और τοῦ μικροῦ की अर्थगत सूक्ष्मता को बिना सांप्रदायिक व्याख्या के सुरक्षित रखा गया है।
