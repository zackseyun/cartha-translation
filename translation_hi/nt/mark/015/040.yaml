  text: स्त्रियाँ भी दूर से देख रही थीं,[a] जिनमें मरियम मगदलीनी, छोटे याकूब और योसेस की माता मरियम,[b][c] और सलोमी थीं।
  philosophy: optimal-equivalence
  footnotes:
