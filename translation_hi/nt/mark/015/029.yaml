  text: Καὶ οἱ παραπορευόμενοι ἐβλασφήμουν αὐτὸν κινοῦντες τὰς κεφαλὰς αὐτῶν καὶ λέγοντες· Οὐὰ ὁ καταλύων τὸν ναὸν καὶ ⸂οἰκοδομῶν ἐν τρισὶν ἡμέραις⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/029.yaml
  text: And those passing by were reviling him[a], shaking their heads and saying[b], “Aha! You who would tear down the temple and build it in three days,”
translation:
  language: hi
  text: और वहाँ से गुजरने वाले लोग सिर हिलाते हुए उसे बुरा-भला कह रहे थे और कहते थे, “वाह! तू जो मन्दिर[a] को ढाने और तीन दिनों में उसे बनाने वाला[b] है,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशिष्ट रूप से, “पवित्रस्थान।” यूनानी शब्द मन्दिर के भीतरी पवित्र भवन को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे फिर से बनाने वाला।” यूनानी क्रिया का सीधा अर्थ “बनाना” है, यद्यपि मन्दिर को ढाने के संदर्भ में फिर से बनाने का भाव निहित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παραπορευόμενοι
  choice: वहाँ से आने-जाने वाले
  rationale: यह कृदन्त घटनास्थल के पास से गुजर रहे लोगों की जारी गतिविधि दर्शाता है; यह हिन्दी में स्वाभाविक है।
- source_word: ἐβλασφήμουν
  choice: उसका अपमान कर रहे थे
  rationale: यहाँ क्रिया यीशु के विरुद्ध निन्दापूर्ण और अपमानजनक वाणी बताती है। ‘परमेश्वर की निन्दा’ कहना सन्दर्भ से अधिक संकीर्ण धार्मिक अर्थ थोप देता। अपूर्ण भूतकाल को जारी क्रिया के रूप में रखा गया है।
- source_word: κινοῦντες τὰς κεφαλὰς αὐτῶν
  choice: सिर हिला-हिलाकर
  rationale: यह तिरस्कारसूचक भाव-भंगिमा का स्वाभाविक आधुनिक हिन्दी रूप है और साथ-साथ चल रही क्रिया को व्यक्त करता है।
- source_word: Οὐὰ
  choice: अहा!
  rationale: सन्दर्भ में यह उपहास और ताने का उद्गार है; ‘अहा!’ उस व्यंग्यात्मक बल को बनाए रखता है।
- source_word: ὁ καταλύων
  choice: ढा देने ... वाले
  rationale: संज्ञीकृत कृदन्त प्रत्यक्ष सम्बोधन जैसा है। ‘ढा देना’ भवन के प्रसंग में स्वाभाविक है और आरोप के भाव को अनावश्यक रूप से नहीं समझाता।
- source_word: ναὸν
  choice: मन्दिर
  rationale: सामान्य पाठक के लिए ‘मन्दिर’ स्पष्ट है; यूनानी शब्द के अधिक विशिष्ट ‘पवित्रस्थान’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: οἰκοδομῶν ἐν τρισὶν ἡμέραις
  choice: तीन दिनों में उसे बनाने वाले
  rationale: यूनानी क्रिया का सीधा अर्थ ‘बनाना’ है। ‘फिर से बनाना’ प्रसंग से सम्भव है, पर वह क्रिया में स्पष्ट नहीं, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मन्दिर-विषयक कथन का आशय
  choice: राहगीरों के शब्दों को उनके आरोप और उपहास के रूप में सीधे अनूदित किया गया है।
  alternative: मुख्य पाठ में यह स्पष्ट करना कि ‘मन्दिर’ से यीशु की देह का रूपकात्मक संकेत है।
  rationale: मरकुस यहाँ क्रूस पर उपस्थित लोगों का ताना प्रस्तुत करता है। इस पद में निहित कथा-दृष्टिकोण और धर्मवैचारिक तनाव को बनाए रखना उचित है; यूहन्ना के कथन की व्याख्या को इसमें आयात नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मन्दिर’ की प्रचलित वर्तनी और बोलचाल में स्पष्ट ‘ढा देना’ चुना गया है। पद अगले वाक्य में जारी रहने वाला उपहासपूर्ण सम्बोधन है, इसलिए अन्त में अल्पविराम रखा गया है।
