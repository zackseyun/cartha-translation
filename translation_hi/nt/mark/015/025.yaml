lexical_decisions:
- source_word: Ἦν
  choice: था
  rationale: εἰμί का अपूर्णकाल यहाँ समय बताने वाले मुहावरे में है; हिन्दी में ‘तीसरा पहर था’ स्वाभाविक और संक्षिप्त है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ प्रबल विरोध नहीं, बल्कि कथानक को आगे बढ़ाने वाला हल्का संयोजक है। हिन्दी वाक्य-विन्यास में पहले खंड के बाद ‘और’ से यह प्रवाह सहज रूप में व्यक्त होता है।
- source_word: ὥρα τρίτη
  choice: तीसरा पहर
  rationale: यह प्राचीन समय-सूचक अभिव्यक्ति को मुख्य पाठ में बनाए रखता है और आधुनिक घड़ी के अनुसार उसका अर्थ पाठ में आरोपित नहीं करता।
- source_word: ἐσταύρωσαν
  choice: उन्होंने ... क्रूस पर चढ़ाया
  rationale: क्रूस पर चढ़ाकर दंड देने की क्रिया के लिए यह हिन्दी में प्रचलित, सटीक और गरिमापूर्ण अभिव्यक्ति है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह प्रत्यक्ष कर्म सर्वनाम है, जिसका संदर्भ यीशु से है; हिन्दी में ‘उसे’ स्वाभाविक है।
theological_decisions:
- issue: समय-सूचक अभिव्यक्ति और कालक्रम
  choice: मुख्य पाठ में ‘तीसरा पहर’ बनाए रखना
  alternative: ‘सुबह लगभग नौ बजे’ लिखना
  rationale: मूल पद प्राचीन समय-सूचक अभिव्यक्ति देता है। उसे यथावत रखने से किसी कालक्रम-सामंजस्य या व्याख्यात्मक ढाँचे को मुख्य पाठ में आरोपित नहीं किया जाता; आधुनिक समय का अनुमान पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘क्रूस पर चढ़ाया’ परिचित बाइबलीय अभिव्यक्ति है। ‘तीसरा पहर’ स्रोत की सांस्कृतिक समय-पद्धति को सुरक्षित रखता है, जबकि पादटिप्पणी आधुनिक समय स्पष्ट करती है।
