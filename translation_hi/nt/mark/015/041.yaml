  text: ⸀αἳ ὅτε ἦν ἐν τῇ Γαλιλαίᾳ ἠκολούθουν αὐτῷ καὶ διηκόνουν αὐτῷ, καὶ ἄλλαι πολλαὶ αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/041.yaml
  text: These women[a], when he was in Galilee, used to follow him and minister to him[b]; and there were many other women who had gone up with him to Jerusalem.
translation:
  language: hi
  text: जब वह गलील में था, तब ये स्त्रियाँ उसका अनुसरण करती थीं और उसकी सेवा[a] करती थीं; और बहुत-सी दूसरी स्त्रियाँ भी उसके साथ यरूशलेम गई थीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सहायता और देखभाल करती थीं।” यूनानी क्रिया व्यावहारिक सेवा या सहयोग को व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके साथ यरूशलेम ऊपर गई थीं।” यरूशलेम जाने को ‘ऊपर जाना’ कहना बाइबल का प्रचलित मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: αἳ
  choice: ये स्त्रियाँ
  rationale: सम्बन्धवाचक सर्वनाम पिछली आयत में नामित स्त्रियों की ओर संकेत करता है; ‘ये स्त्रियाँ’ हिन्दी में उस पूर्वसन्दर्भ को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: ὅτε ἦν ἐν τῇ Γαλιλαίᾳ
  choice: जब वह गलील में था
  rationale: कालवाचक उपवाक्य और स्थानवाचक पद को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἠκολούθουν
  choice: उसके पीछे चला करती थीं
  rationale: अपूर्ण भूतकाल यहाँ बीते समय में नियमित या निरन्तर क्रिया का भाव देता है; ‘चला करती थीं’ उस आदतन अनुसरण को व्यक्त करता है।
- source_word: διηκόνουν αὐτῷ
  choice: उसकी सेवा करती थीं
  rationale: क्रिया व्यावहारिक देखभाल, सहायता और सहयोग को समेट सकती है। ‘सेवा करती थीं’ हिन्दी में व्यापक और गरिमापूर्ण है तथा किसी औपचारिक कलीसियाई पद का संकेत नहीं देती।
- source_word: ἄλλαι πολλαὶ
  choice: बहुत-सी दूसरी स्त्रियाँ
  rationale: स्त्रीलिंग बहुवचन को हिन्दी में स्पष्ट करने के लिए ‘स्त्रियाँ’ व्यक्त किया गया है।
- source_word: αἱ συναναβᾶσαι αὐτῷ εἰς Ἱεροσόλυμα
  choice: जो उसके साथ यरूशलेम आई थीं
  rationale: कृदन्त की क्रिया मुख्य वर्णन से पहले की है। वर्तमान कथास्थल यरूशलेम होने के कारण ‘आई थीं’ स्वाभाविक है; ‘ऊपर जाने/चढ़ने’ का मूल बाइबलीय मुहावरा पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: διηκόνουν द्वारा व्यक्त स्त्रियों की सेवा का स्वरूप
  choice: उसकी सेवा करती थीं
  alternative: उसकी देखभाल करती थीं / उसकी सहायता करती थीं
  rationale: मूल क्रिया व्यावहारिक सेवा और सहयोग दोनों को व्यक्त कर सकती है। चुना हुआ रूप अर्थ की व्यापकता और स्त्रियों की सक्रिय भूमिका को बनाए रखता है, पर उसे घरेलू काम या बाद के औपचारिक धार्मिक पद तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चला करती थीं’ से अपूर्ण भूतकाल का नियमित क्रिया-भाव आता है। ‘सेवा’ सामान्य पाठक के लिए परिचित है, जबकि पादटिप्पणी उसके सम्भावित व्यावहारिक अर्थ को स्पष्ट करती है।
