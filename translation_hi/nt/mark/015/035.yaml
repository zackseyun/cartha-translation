  text: καί τινες τῶν παρεστηκότων ἀκούσαντες ἔλεγον· ⸀Ἴδε Ἠλίαν φωνεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/015/035.yaml
  text: And some of those standing there[a], when they heard it, were saying, “Look, he is calling Elijah.”
translation:
  language: hi
  text: और वहाँ खड़े लोगों में से कुछ यह सुनकर कह रहे थे, “देखो, वह एलिय्याह को बुला रहा है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एलिय्याह को पुकार रहा है।”
    reason: φωνεῖ का अर्थ किसी को बुलाना या पुकारना हो सकता है; वैकल्पिक हिन्दी इस सूक्ष्म भेद को सुरक्षित रखती है।
lexical_decisions:
- source_word: καί
  choice: और
  rationale: यह सामान्य संयोजक पिछले वृत्तांत से प्रतिक्रिया को जोड़ता है और कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता।
- source_word: τινες τῶν παρεστηκότων
  choice: वहाँ खड़े लोगों में से कुछ
  rationale: यह अनिश्चित समूह और घटनास्थल पर उपस्थित होकर खड़े रहने के ठोस स्थानगत भाव—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: अोरिस्ट कृदंत मुख्य क्रिया से पहले हुई क्रिया बताता है। ‘यह’ प्रसंग में यीशु की पिछली पुकार की ओर संकेत करता है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल के जारी या पुनरावृत्त वचन के पक्ष को बिना अनावश्यक बल दिए व्यक्त करता है।
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाली आज्ञा है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: Ἠλίαν
  choice: एलिय्याह
  rationale: यह इस भविष्यद्वक्ता के नाम का प्रचलित हिन्दी बाइबलीय रूप है।
- source_word: φωνεῖ
  choice: बुला रहा है
  rationale: वर्तमानकालीन क्रिया को प्रत्यक्ष कथन में प्रगतिशील रूप से व्यक्त किया गया है। सकर्मक प्रयोग के कारण ‘एलिय्याह को बुला रहा है’ स्रोत की सतही अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: क्या स्पष्ट किया जाए कि वहाँ खड़े लोगों ने यीशु की पुकार को एलिय्याह के लिए सहायता की पुकार समझा
  choice: 'मुख्य पाठ में केवल उनका कथन रखा गया है: ‘वह एलिय्याह को बुला रहा है।’'
  alternative: ‘वे समझे कि वह एलिय्याह को सहायता के लिए पुकार रहा है।’
  rationale: यूनानी पाठ केवल वहाँ खड़े लोगों के शब्द दर्ज करता है; वह उनकी गलत समझ की व्याख्या या सहायता माँगने का भाव स्पष्ट रूप से नहीं जोड़ता। इसलिए प्रसंगगत तनाव को व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वहाँ खड़े लोगों’ से दृश्य का स्थानगत भाव बना रहता है, जबकि ‘कह रहे थे’ यूनानी अपूर्ण भूतकाल का पक्ष दर्शाता है।
