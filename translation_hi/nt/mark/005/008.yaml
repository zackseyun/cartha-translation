  text: ἔλεγεν γὰρ αὐτῷ· Ἔξελθε τὸ πνεῦμα τὸ ἀκάθαρτον ἐκ τοῦ ἀνθρώπου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/008.yaml
  text: For he was saying to him[a], “Come out of the man, unclean spirit.”
translation:
  language: hi
  text: क्योंकि वह उससे कह रहा था, “हे अशुद्ध आत्मा, उस मनुष्य में से निकल जा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल चल रही अथवा बार-बार हो रही क्रिया का संकेत दे सकता है; प्रसंग में ‘कह रहा था’ इसकी पृष्ठभूमिमूलक प्रकृति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: सम्प्रदानवाचक सर्वनाम को हिन्दी में ‘उससे कह रहा था’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है। कथात्मक स्तर पर संकेत उस व्यक्ति की ओर है, जबकि आज्ञा उसके भीतर की अशुद्ध आत्मा को संबोधित है।
- source_word: Ἔξελθε
  choice: निकल जा
  rationale: एकवचन आज्ञार्थक रूप तत्काल और सीधी आज्ञा देता है। ‘निकल जा’ भीतर से बाहर जाने की गति तथा आदेश की शक्ति दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: हे अशुद्ध आत्मा
  rationale: यद्यपि यूनानी पदबंध रूपतः निश्चित लेख सहित है, यहाँ वह प्रत्यक्ष संबोधन का कार्य करता है। हिन्दी का ‘हे’ इस संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: ἐκ τοῦ ἀνθρώπου
  choice: इस मनुष्य में से
  rationale: ἐκ भीतर से बाहर आने की गति बताता है। निश्चित व्यक्ति के लिए ‘इस मनुष्य में से’ प्रसंगगत निर्देश और स्रोत—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον का अनुवाद
  choice: अशुद्ध आत्मा
  alternative: दुष्ट आत्मा
  rationale: मूल यूनानी में स्पष्टतः ‘अशुद्ध आत्मा’ है। ‘दुष्ट आत्मा’ अर्थ की व्याख्या तो करता है, पर शुद्धता-अशुद्धता की मूल शब्दावली को खो देता है।
- issue: आज्ञा का संबोधन किससे है
  choice: अशुद्ध आत्मा को प्रत्यक्ष संबोधन
  alternative: ‘अशुद्ध आत्मा निकल जाए’ जैसा अप्रत्यक्ष कथन
  rationale: आज्ञार्थक Ἔξελθε और उसके बाद का पदबंध प्रत्यक्ष संबोधन के रूप में कार्य करते हैं; इसलिए अनुवाद में आज्ञा और संबोधन दोनों बनाए गए हैं।
- issue: αὐτῷ का संदर्भ
  choice: कथात्मक रूप से उस व्यक्ति से कहा जा रहा था
  alternative: सर्वनाम को सीधे आत्मा के लिए स्त्रीलिंग ‘उससे’ मानना
  rationale: यूनानी सर्वनाम का व्याकरणिक पुल्लिंग निकट कथात्मक व्यक्ति के अनुरूप है, जबकि उद्धृत आदेश उसके भीतर की आत्मा को लक्ष्य करता है। अनुवाद इस तनाव को हल किए बिना ‘उससे’ बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। ‘हे’ प्रत्यक्ष संबोधन को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
