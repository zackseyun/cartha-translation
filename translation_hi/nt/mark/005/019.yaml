source:
  edition: SBLGNT
  text: ⸀καὶ οὐκ ἀφῆκεν αὐτόν, ἀλλὰ λέγει αὐτῷ· Ὕπαγε εἰς τὸν οἶκόν σου πρὸς τοὺς σούς, καὶ ⸀ἀπάγγειλον αὐτοῖς ὅσα ⸂ὁ κύριός σοι⸃ πεποίηκεν καὶ ἠλέησέν σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/019.yaml
  text: And he did not permit him[a], but said to him, “Go to your home, to your own people[c][b], and report to them how much the Lord has done for you and has shown mercy to you.”
translation:
  language: hi
  text: पर उसने उसे अनुमति नहीं दी, बल्कि उससे कहा, “अपने घर, अपने लोगों[a] के पास जाओ और उन्हें बताओ कि प्रभु[b] ने तुम्हारे लिए कितना कुछ किया है और तुम पर दया की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘अपनों के पास’। इसका आशय परिवार, संबंधियों और अन्य निकट लोगों से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रभु’ से यहाँ विशेष रूप से परमेश्वर का आशय समझा जा सकता है; साथ ही मरकुस परमेश्वर की दया और यीशु के अपने कार्य तथा अधिकार के बीच संबंध खुला रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀφῆκεν
  choice: अनुमति नहीं दी
  rationale: यहाँ ἀφίημι का अर्थ क्षमा करना या छोड़ देना नहीं, बल्कि अनुमति देना है। यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिंदी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और अर्थ में परिवर्तन नहीं करता।
- source_word: Ὕπαγε
  choice: जाओ
  rationale: आज्ञार्थक क्रिया किसी स्थान की ओर जाने को कहती है; ‘जाओ’ इसका सहज आधुनिक हिंदी रूप है।
- source_word: εἰς τὸν οἶκόν σου
  choice: अपने घर
  rationale: οἶκος यहाँ केवल भवन नहीं, व्यक्ति के घरेलू परिवेश की ओर लौटने का भाव रखता है; ‘अपने घर’ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πρὸς τοὺς σούς
  choice: अपने लोगों के पास
  rationale: शाब्दिक अर्थ ‘अपनों के पास’ है। ‘अपने लोगों’ में परिवार, संबंधी और निकट सहयोगी सम्मिलित हो सकते हैं, इसलिए इसे केवल ‘परिवार’ तक सीमित नहीं किया गया।
- source_word: ἀπάγγειλον
  choice: उन्हें बताओ
  rationale: ἀπαγγέλλω किसी बात का समाचार या विवरण पहुँचाने को दर्शाता है। इस प्रसंग में ‘बताओ’ सरल, सटीक और स्वाभाविक है।
- source_word: ὅσα
  choice: कितना कुछ
  rationale: यह रूप किए गए कार्यों की विषय-वस्तु और व्यापकता दोनों व्यक्त कर सकता है। ‘कितना कुछ’ हिंदी में इस बल को सहज रूप से बनाए रखता है।
- source_word: ὁ κύριός σοι πεποίηκεν
  choice: प्रभु ने तुम्हारे लिए ... किया है
  rationale: σοι को क्रिया के साथ हितसूचक रूप में ‘तुम्हारे लिए’ लिया गया है। κύριος का सामान्य धार्मिक रूप ‘प्रभु’ रखा गया है।
- source_word: ἠλέησέν σε
  choice: तुम पर कैसी दया की है
  rationale: ἐλεάω दया दिखाने को व्यक्त करता है। ‘दया की है’ मूल क्रिया का धार्मिक और भावात्मक बल बनाए रखता है; ‘कैसी’ पिछले ‘कितना कुछ’ के साथ उसकी महत्ता उभारता है।
theological_decisions:
- issue: यीशु के कथन में κύριος की पहचान
  choice: प्रभु
  alternative: परमेश्वर
  rationale: ‘प्रभु’ κύριος का सीधा और परंपरागत समतुल्य है। यहाँ इसे ‘परमेश्वर’ कर देने से यह प्रश्न पहले ही तय हो जाता कि संदर्भ केवल परमेश्वर की ओर है; ‘प्रभु’ परमेश्वर की दया और यीशु के अपने कार्य तथा अधिकार के बीच उपस्थित कथात्मक-धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। संबोधन में ‘तुम’ के सम्मानसूचक बहुवचन क्रियारूप ‘जाओ’ और ‘बताओ’ रखे गए हैं, जो आधुनिक पाठक के लिए स्वाभाविक हैं।
