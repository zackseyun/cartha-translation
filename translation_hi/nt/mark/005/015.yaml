source:
  edition: SBLGNT
  text: καὶ ἔρχονται πρὸς τὸν Ἰησοῦν, καὶ θεωροῦσιν τὸν δαιμονιζόμενον ⸀καθήμενον ἱματισμένον καὶ σωφρονοῦντα, τὸν ἐσχηκότα τὸν ⸀λεγιῶνα, καὶ ἐφοβήθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/015.yaml
  text: And they came to Jesus and saw the demon-possessed man sitting there[b][a], clothed and in his right mind—the one who had the legion—and they were afraid.
translation:
  language: hi
  text: और वे यीशु के पास आए और उन्होंने उस दुष्टात्मा-ग्रस्त मनुष्य को बैठे हुए, कपड़े पहने हुए और पूरी सुध-बुध में देखा—उसी को, जिसमें दुष्टात्माओं की वह पलटन[a] थी—और वे डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसमें ‘पलटन’ थी।” यहाँ इस शब्द को दुष्टात्माओं के पहले बताए गए नाम के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔρχονται
  choice: आए
  rationale: ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: θεωροῦσιν
  choice: देखा
  rationale: यहाँ भी ऐतिहासिक वर्तमान है; ‘देखा’ दृश्य को ध्यान से देखने का अर्थ प्रसंगानुसार स्वाभाविक रूप से देता है।
- source_word: δαιμονιζόμενον
  choice: दुष्टात्मा-ग्रस्त मनुष्य
  rationale: कृदन्त यहाँ संज्ञा के समान उस परिचित मनुष्य को सूचित करता है; यह अनुवाद वास्तविक दुष्टात्मिक वश को न तो केवल बीमारी बनाता है, न पुरातन भाषा अपनाता है।
- source_word: καθήμενον
  choice: बैठे
  rationale: उस मनुष्य की प्रत्यक्ष बदली हुई दशा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἱματισμένον
  choice: कपड़े पहने
  rationale: पहले की नग्न दशा के विपरीत अब वस्त्र धारण किए होने को साधारण आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: σωφρονοῦντα
  choice: सुध-बुध में
  rationale: मानसिक स्थिरता और आत्म-संयम की बहाली को सहज हिन्दी मुहावरे में व्यक्त करता है, बिना इसे केवल चिकित्सकीय निदान बनाने के।
- source_word: ἐσχηκότα
  choice: जिसमें ... थी
  rationale: परिपूर्ण कृदन्त उस व्यक्ति की पूर्व दशा से उसकी पहचान कराता है; हिन्दी में भूतकाल ‘थी’ स्पष्ट करता है कि वह दशा अब समाप्त हो चुकी है।
- source_word: λεγιῶνα
  choice: दुष्टात्माओं की पलटन
  rationale: λεγιών मूलतः रोमी सैन्य इकाई है और प्रसंग में अनेक दुष्टात्माओं की सामूहिक पहचान है; ‘पलटन’ सैन्य रूपक और बहुलता दोनों को सामान्य हिन्दी में रखता है।
- source_word: ἐφοβήθησαν
  choice: डर गए
  rationale: अओरिस्ट की आरंभिक प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दुष्टात्मिक वश का वर्णन
  choice: दुष्टात्मा-ग्रस्त मनुष्य
  alternative: दुष्टात्मा के वश में रहा मनुष्य
  rationale: पाठ वास्तविक दुष्टात्मिक अधीनता बताता है; चुना हुआ रूप इसे बीमारी तक सीमित नहीं करता और न ही अनावश्यक रूप से इसकी प्रकृति की व्याख्या करता है।
- issue: λεγιών को वर्णनात्मक पद या नाम मानना
  choice: दुष्टात्माओं की पलटन
  alternative: ‘पलटन’ नाम की दुष्टात्माएँ
  rationale: यूनानी में सव्यंजक पद के साथ निश्चित उपपद है और यह पहले कही गई सामूहिक आत्म-पहचान की ओर लौटता है। मुख्य पाठ सैन्य रूपक और अनेकता स्पष्ट करता है; नाम के रूप में समझने की संभावना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘सुध-बुध में’ सामान्य पाठक के लिए स्वाभाविक है; ‘दुष्टात्माओं की पलटन’ रोमी सैन्य पृष्ठभूमि को शब्दशः तकनीकी बनाए बिना सैन्य रूपक और सामूहिकता बचाती है।
