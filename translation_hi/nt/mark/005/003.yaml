    reason: lexical_alternative
lexical_decisions:
- source_word: κατοίκησιν εἶχεν
  choice: रहता था
  rationale: यूनानी मुहावरे का अर्थ उसके लगातार निवास करने से है। शाब्दिक ‘उसका निवास था’ की अपेक्षा ‘रहता था’ आधुनिक हिन्दी में स्वाभाविक है और अपूर्ण भूतकाल का भाव बनाए रखता है।
- source_word: ἐν τοῖς μνήμασιν
  choice: कब्रों के बीच
  rationale: μνῆμα दफ़नाने के स्थान या कब्र को दर्शाता है। हिन्दी में ‘कब्रों के बीच’ दृश्य को स्वाभाविक रूप से व्यक्त करता है और यह अनावश्यक रूप से नहीं ठहराता कि वह हर समय कब्रों के भीतर ही रहता था।
- source_word: οὐδὲ ἁλύσει
  choice: जंजीर से भी
  rationale: ἅλυσις एकवचन है; ‘जंजीर’ उसका रूप बनाए रखता है, और ‘भी’ οὐδέ के बलाघात को व्यक्त करता है।
- source_word: οὐκέτι
  choice: अब ... नहीं
  rationale: यह पहले संभव रही स्थिति के समाप्त हो जाने का भाव देता है; हिन्दी में ‘अब ... नहीं’ स्वाभाविक और सटीक है।
- source_word: οὐδεὶς ἐδύνατο αὐτὸν δῆσαι
  choice: कोई उसे ... बाँध नहीं सकता था
  rationale: यह बीते समय में जारी असमर्थता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘बाँध’ शारीरिक बंधन के अर्थ को सुरक्षित रखता है।
