  text: καὶ ⸀εὐθὺς ἀνέστη τὸ κοράσιον καὶ περιεπάτει, ἦν γὰρ ἐτῶν δώδεκα. καὶ ἐξέστησαν ⸁εὐθὺς ἐκστάσει μεγάλῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/042.yaml
  text: And immediately the girl stood up and began walking[a], for she was twelve years old[b]. And immediately they were overcome with great amazement.
translation:
  language: hi
  text: और वह लड़की तुरन्त उठ खड़ी हुई और चलने लगी,[a] क्योंकि वह बारह वर्ष की थी। और वे तुरन्त बड़े विस्मय में पड़ गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उठी।” यूनानी क्रिया का अनुवाद “उठ गई” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे बड़े आश्चर्य से आश्चर्यचकित हो गए।” यूनानी में तीव्र विस्मय व्यक्त करने के लिए एक ही मूल से बने शब्दों का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: मरकुस की विशिष्ट तीव्र कथात्मक गति और घटना की तत्कालता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀνέστη
  choice: उठ खड़ी हुई
  rationale: यहाँ लड़की के सचमुच उठने को स्वाभाविक रूप से व्यक्त करता है और मुख्य पाठ में पुनरुत्थान-संबंधी अर्थ को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: τὸ κοράσιον
  choice: वह लड़की
  rationale: कोράσιον के सामान्य अर्थ को रखता है; इसी पद में बारह वर्ष की आयु दी गई है, इसलिए 'छोटी' जोड़ना आवश्यक नहीं।
- source_word: περιεπάτει
  choice: चलने लगी
  rationale: अपूर्ण भूतकाल चलने की आरम्भ हुई और जारी क्रिया दिखाता है; 'चलने लगी' आधुनिक हिन्दी में इसे सहजता से व्यक्त करता है।
- source_word: ἦν γὰρ ἐτῶν δώδεκα
  choice: क्योंकि वह बारह वर्ष की थी
  rationale: γάρ के व्याख्यात्मक संबंध और आयु बताने की यूनानी अभिव्यक्ति को सरल, स्वाभाविक हिन्दी में रखता है।
- source_word: ἐξέστησαν
  choice: चकित रह गए
  rationale: ἐξίστημι यहाँ तीव्र विस्मय की दशा व्यक्त करता है; यह हिन्दी मुहावरा उस प्रतिक्रिया को स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: ἐκστάσει μεγάλῃ
  choice: बहुत ही चकित
  rationale: सजातीय यूनानी अभिव्यक्ति की तीव्रता को हिन्दी में अनावश्यक और अस्वाभाविक पुनरुक्ति के बिना व्यक्त करता है।
theological_decisions:
- issue: ἀνέστη में सम्भावित पुनरुत्थान-संबंधी अर्थछाया
  choice: '''उठ खड़ी हुई'' के रूप में शारीरिक रूप से उठने का अनुवाद'
  alternative: '''जी उठी'' या ''उठी'''
  rationale: संदर्भ जीवन की पुनर्स्थापना स्पष्ट करता है, पर क्रिया स्वयं खड़े होने या उठने का सामान्य अर्थ भी रखती है। चुना हुआ अनुवाद घटना को दबाता नहीं और शब्द में आवश्यकता से अधिक धर्मवैज्ञानिक विशिष्टता भी नहीं जोड़ता।
- issue: ἐξέστησαν ἐκστάσει μεγάλῃ की सजातीय अभिव्यक्ति
  choice: स्वाभाविक हिन्दी में 'बहुत ही चकित रह गए'
  alternative: '''बड़े आश्चर्य से आश्चर्यचकित हो गए'''
  rationale: यूनानी की तीव्रता सुरक्षित रहती है, जबकि हिन्दी में कृत्रिम पुनरुक्ति से बचा जाता है; पाद-टिप्पणी मूल अभिव्यक्ति का रूप बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'तुरन्त' दोनों स्थानों पर रखा गया है, क्योंकि उपलब्ध यूनानी पाठ में दोनों बार εὐθύς है। मुख्य पाठ में स्वाभाविकता बनाए रखते हुए यूनानी सजातीय अभिव्यक्ति की जानकारी पाद-टिप्पणी में दी गई है।
