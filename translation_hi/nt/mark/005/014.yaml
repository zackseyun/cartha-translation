source:
  edition: SBLGNT
  text: ⸂Καὶ οἱ⸃ βόσκοντες ⸀αὐτοὺς ἔφυγον καὶ ⸀ἀπήγγειλαν εἰς τὴν πόλιν καὶ εἰς τοὺς ἀγρούς· καὶ ⸀ἦλθον ἰδεῖν τί ἐστιν τὸ γεγονός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/014.yaml
  text: And those who were tending them fled and reported it in the city and in the countryside[a], and they came to see what had happened.
translation:
  language: hi
  text: और उन्हें चरा रहे लोग भाग गए और उन्होंने नगर और देहात[a] में यह समाचार सुनाया, और लोग यह देखने आए कि क्या हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खेतों में।’ यूनानी शब्द का अधिक शाब्दिक अनुवाद ऐसा हो सकता है, किंतु यहाँ संभवतः नगर के आसपास के ग्रामीण क्षेत्रों का आशय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βόσκοντες
  choice: चरा रहे लोग
  rationale: यह कृदंत सूअरों की देखभाल और उन्हें चराने वालों को दर्शाता है; हिंदी में ‘चरा रहे’ प्रसंगानुकूल और सहज है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: सर्वनाम का संकेत पिछले पद के सूअरों की ओर है। ‘उन्हें’ यूनानी सर्वनाम को बनाए रखता है और संदर्भ से आशय स्पष्ट है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: यह अचानक भयवश चले जाने की कथात्मक शक्ति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀπήγγειλαν
  choice: यह समाचार सुनाया
  rationale: क्रिया किसी घटना की खबर देने या उसका समाचार पहुँचाने को दर्शाती है; ‘यह समाचार सुनाया’ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: εἰς τὴν πόλιν
  choice: नगर में
  rationale: εἰς का मूल भाव ‘नगर को/में’ है, पर समाचार सुनाने की क्रिया के साथ हिंदी में उस स्थान के लिए ‘नगर में’ अधिक स्वाभाविक है जहाँ समाचार फैलाया गया।
- source_word: εἰς τοὺς ἀγρούς
  choice: देहात में
  rationale: ἀγροί का शाब्दिक अर्थ ‘खेत’ है, किंतु नगर के साथ विरोध में यह आसपास के ग्रामीण क्षेत्र को सूचित करता है; ‘देहात’ आधुनिक हिंदी में इस अर्थ को सहजता से व्यक्त करता है।
- source_word: ἦλθον
  choice: लोग ... आए
  rationale: यूनानी में कर्ता बहुवचन क्रिया में निहित है। हिंदी में केवल ‘वे’ कहने पर निकटतम संज्ञा चरवाहों की ओर संकेत कर सकती है; ‘लोग’ स्पष्ट करता है कि समाचार सुनने वाले आए, बिना किसी विशेष समूह को निर्धारित किए।
- source_word: ἰδεῖν
  choice: यह देखने
  rationale: यह उद्देश्यसूचक अनंत क्रिया है; ‘यह देखने’ हिंदी में स्वाभाविक रूप से आगमन का उद्देश्य बताता है।
- source_word: τί ἐστιν τὸ γεγονός
  choice: कि क्या हुआ था
  rationale: यह वाक्यांश घट चुकी घटना के विषय में पूछता है; कथात्मक क्रम में ‘क्या हुआ था’ पूर्णता और पूर्वकालिकता दोनों को सहजता से व्यक्त करता है।
