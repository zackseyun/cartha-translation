lexical_decisions:
- source_word: ἰδὼν
  choice: देखकर
  rationale: ὁράω का एओरिस्ट कृदन्त है। ‘देखकर’ यूनानी की क्रिया-श्रृंखला को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπὸ μακρόθεν
  choice: दूर से
  rationale: स्थानिक दूरी का सीधा, सहज और आधुनिक हिन्दी रूप।
- source_word: ἔδραμεν
  choice: दौड़ा
  rationale: τρέχω के सामान्य अर्थ को बिना अतिरिक्त तीव्रता जोड़े व्यक्त करता है।
- source_word: προσεκύνησεν αὐτόν
  choice: उनके सामने दण्डवत् किया
  rationale: προσκυνέω झुककर दण्डवत् करने, श्रद्धा प्रकट करने या आराधना करने का अर्थ दे सकता है। यह रूप दृश्य शारीरिक कृत्य को व्यक्त करता है, पर प्रसंग में उसके पूर्ण धार्मिक आशय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: καὶ
  choice: और
  rationale: मरकुस की सरल समन्वयात्मक कथा-शैली को बनाए रखता है।
- source_word: τὸν Ἰησοῦν
  choice: यीशु को
  rationale: व्यक्तिवाचक नाम को हिन्दी में कर्म-चिह्न ‘को’ के साथ स्वाभाविक रूप से प्रस्तुत किया गया है।
