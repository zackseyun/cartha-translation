  choice: मुख्य पाठ में ‘उनके सामने दण्डवत् किया’
  alternative: ‘उनकी आराधना की’ या ‘उन्हें श्रद्धापूर्वक प्रणाम किया’
  rationale: यूनानी क्रिया आराधना तथा दण्डवत्/श्रद्धा-प्रदर्शन—दोनों अर्थ दे सकती है। मुख्य पाठ दृश्य कृत्य को सामने रखता है और धार्मिक आशय की वास्तविक संदिग्धता को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘दण्डवत् किया’ सामान्य पाठक के लिए परिचित है और शारीरिक विनय को स्पष्ट करता है। यीशु के लिए आदरसूचक बहुवचन सर्वनाम का प्रयोग किया गया है।
