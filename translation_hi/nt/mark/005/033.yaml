id: MRK.5.33
reference: Mark 5:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ δὲ γυνὴ φοβηθεῖσα καὶ τρέμουσα, εἰδυῖα ὃ γέγονεν ⸀αὐτῇ, ἦλθεν καὶ προσέπεσεν αὐτῷ καὶ εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/033.yaml
  text: But the woman[a], fearing and trembling, knowing what had happened to her[b], came and fell down before him and told him the whole truth.
translation:
  language: hi
  text: पर वह स्त्री डरती और काँपती हुई, यह जानते हुए कि उसके साथ क्या हुआ था, आई और उसके सामने गिर पड़ी[a] और उसे सारी सच्चाई बता दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके आगे गिर पड़ी”; या “उसके सामने दंडवत हो गई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध और कथा में अगली प्रतिक्रिया दोनों दिखाता है।
- source_word: ἡ γυνὴ
  choice: वह स्त्री
  rationale: संदर्भ में पहले से उल्लिखित स्त्री की ओर संकेत है; हिन्दी में ‘वह स्त्री’ स्वाभाविक और निश्चित है।
- source_word: φοβηθεῖσα καὶ τρέμουσα
  choice: डरती और काँपती हुई
  rationale: दोनों यूनानी कृदंतों की क्रियात्मकता और स्त्री की तीव्र भाव-दशा को बनाए रखता है।
- source_word: εἰδυῖα
  choice: यह जानते हुए
  rationale: कृदंत की परिस्थितिजन्य अस्पष्टता बनाए रखता है और संबंध को अनावश्यक रूप से स्पष्ट कारण नहीं बनाता।
- source_word: ὃ γέγονεν αὐτῇ
  choice: कि उसके साथ क्या हुआ था
  rationale: दत्तिव αὐτῇ और पूर्णकालीन घटना का स्वाभाविक हिन्दी रूप; यह उसके अनुभव में हुई चंगाई की ओर संकेत करता है।
- source_word: ἦλθεν
  choice: आई
  rationale: सरल कथात्मक भूतकाल और स्त्रीलिंग कर्ता के अनुरूप सीधा अनुवाद।
- source_word: προσέπεσεν αὐτῷ
  choice: उसके सामने गिर पड़ी
  rationale: शारीरिक रूप से यीशु के आगे गिरने की क्रिया व्यक्त होती है, पर आराधना या ठीक-ठीक देह-मुद्रा का अतिरिक्त दावा नहीं जोड़ा जाता।
- source_word: εἶπεν αὐτῷ πᾶσαν τὴν ἀλήθειαν
  choice: उसे सारी सच्चाई बता दी
  rationale: ‘कहा’ की तुलना में हिन्दी में कर्म-वाक्यांश के साथ ‘बता दी’ अधिक स्वाभाविक है; πᾶσαν का पूर्णता-बोध ‘सारी’ से सुरक्षित है।
theological_decisions:
- issue: προσέπεσεν αὐτῷ में यीशु के सामने स्त्री की मुद्रा
  choice: उसके सामने गिर पड़ी
  alternative: उसके चरणों में गिर पड़ी / उसके सामने दंडवत हो गई
  rationale: मूल क्रिया श्रद्धा, विनती या भय में किसी के आगे गिरने को व्यक्त कर सकती है। चुना हुआ रूप क्रिया को बनाए रखता है, लेकिन मूल से अधिक स्पष्ट रूप से आराधना या किसी निश्चित शारीरिक मुद्रा का अर्थ नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। कृदंतों की क्रमिकता तथा कारण-संबंध की मूल अस्पष्टता यथासंभव सुरक्षित रखी गई है।
