  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ⸀παρακούσας τὸν λόγον λαλούμενον λέγει τῷ ἀρχισυναγώγῳ· Μὴ φοβοῦ, μόνον πίστευε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/036.yaml
  text: But Jesus[a], overhearing the word being spoken, says to the synagogue leader, “Do not be afraid[b]; only believe.”
translation:
  language: hi
  text: पर यीशु कही जा रही बात सुनकर[a] आराधनालय के अगुए से कहते हैं, “मत डरो; केवल विश्वास रखो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कही गई बात की उपेक्षा करके” अथवा “उसे अनसुना करके।” यूनानी शब्द का अर्थ यहाँ सुन लेना या कही गई बात की उपेक्षा करना—दोनों हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “केवल भरोसा रखो” अथवा “बस विश्वास करते रहो।” यूनानी क्रिया πιστεύω है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρακούσας
  choice: सुनकर
  rationale: संदर्भ में यीशु अभी-अभी कही गई सूचना को सुनते हैं और तुरंत आराधनालय के अगुए को संबोधित करते हैं। यूनानी शब्द का अर्थ ‘अनसुना करना/ध्यान न देना’ भी हो सकता है; इसलिए वह विकल्प पादटिप्पणी में रखा गया है।
- source_word: τὸν λόγον λαλούμενον
  choice: कही जा रही बात
  rationale: यह स्वाभाविक आधुनिक हिन्दी में यूनानी कृदंत रचना और अभी बोली जा रही सूचना—दोनों को व्यक्त करता है।
- source_word: λέγει
  choice: कहते हैं
  rationale: वर्तमान काल का प्रयोग मरकुस की सजीव ऐतिहासिक-वर्तमान शैली को बनाए रखता है; यीशु के लिए आदरसूचक बहुवचन आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: ἀρχισυναγώγῳ
  choice: आराधनालय के अगुए
  rationale: यह पद आराधनालय के प्रमुख या अध्यक्षीय अधिकारी को दर्शाता है। ‘अगुआ’ भूमिका को स्पष्ट और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: यह एक व्यक्ति को दिए गए निषेधात्मक आदेश का सीधा, स्वाभाविक और प्रभावशाली हिन्दी रूप है।
- source_word: μόνον
  choice: केवल
  rationale: यह यीशु द्वारा अपेक्षित प्रतिक्रिया पर स्पष्ट प्रतिबंधात्मक बल रखता है।
- source_word: πίστευε
  choice: विश्वास रख
  rationale: यह πιστεύω के आदेशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। वर्तमान आज्ञार्थक में निरंतरता का भाव संभव है, पर ‘विश्वास रख’ उसे अनावश्यक रूप से अधिक स्पष्ट किए बिना समेटता है।
theological_decisions:
- issue: παρακούσας का अर्थ
  choice: यीशु ने कही जा रही बात सुनी
  alternative: यीशु ने कही गई बात पर ध्यान नहीं दिया अथवा उसे अनसुना कर दिया
  rationale: दोनों अर्थ शब्दकोशीय रूप से संभव हैं। तत्काल कथा-प्रवाह में सूचना सुनकर अगुए को संबोधित करना अधिक स्वाभाविक है, जबकि दूसरा अर्थ वास्तविक व्याख्यात्मक विकल्प होने के कारण पादटिप्पणी में सुरक्षित है।
- issue: πίστευε का अनुवाद
  choice: विश्वास रख
  alternative: भरोसा रख; विश्वास करता रह
  rationale: ‘विश्वास रख’ यूनानी क्रिया का सीधा और प्रचलित हिन्दी समतुल्य है। ‘भरोसा रख’ संबंधपरक भाव को उभारता है और ‘विश्वास करता रह’ वर्तमान आज्ञार्थक की संभावित निरंतरता को स्पष्ट करता है; मुख्य पाठ किसी एक अतिरिक्त सूक्ष्मता को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘कहते हैं’ मरकुस के ऐतिहासिक वर्तमान को बनाए रखता है। संबोधन में ‘मत डर’ एकवचन की निकटता और मूल आज्ञार्थक की सीधाई को सुरक्षित रखता है; ‘आराधनालय’ और ‘अगुआ’ सामान्य हिन्दी बाइबलीय प्रयोग के अनुरूप हैं।
