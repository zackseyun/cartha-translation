  yaml_path: translation/nt/mark/005/025.yaml
  text: And there was a woman who had been suffering from a flow of blood for twelve years,[a]
translation:
  language: hi
  text: और एक स्त्री थी, जिसे बारह वर्षों से रक्तस्राव हो रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उसका रक्त बह रहा था; शाब्दिक रूप से, वह रक्त के बहाव की अवस्था में थी।
    reason: ग्रीक पद रक्त के बहाव या रक्तस्राव की अवस्था बताता है; वैकल्पिक रूप उसके अधिक शाब्दिक अर्थ को दिखाते हैं।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ मरकुस की समन्वयी कथन-शैली को बनाए रखता है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: अनिश्चित संज्ञा कथा में एक नए पात्र का परिचय देती है; आधुनिक हिन्दी में ‘एक स्त्री’ स्वाभाविक है।
- source_word: οὖσα
  choice: थी, जिसे … हो रहा था
  rationale: शाब्दिक अर्थ ‘होते हुए’ है, पर यहाँ यह स्त्री की लगातार बनी हुई अवस्था बताता है; हिन्दी का यह संबंधवाचक वाक्य-विन्यास उस निरंतरता को सहज रूप से व्यक्त करता है।
- source_word: ἐν ῥύσει αἵματος
  choice: रक्तस्राव हो रहा था
  rationale: यह पद रक्त बहने की अवस्था को व्यक्त करता है। ‘रक्तस्राव’ संक्षिप्त, स्पष्ट और सम्मानजनक है तथा स्रोत में अस्पष्ट रक्तस्राव को किसी विशेष चिकित्सीय निदान तक सीमित नहीं करता।
- source_word: δώδεκα ἔτη
  choice: बारह वर्षों से
  rationale: समयावधि बताने वाला कर्मकारक है। चलती आ रही अवस्था के साथ हिन्दी में ‘बारह वर्षों से’ अवधि और निरंतरता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
