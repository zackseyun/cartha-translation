  text: καὶ διὰ παντὸς νυκτὸς καὶ ἡμέρας ἐν τοῖς ⸂μνήμασιν καὶ ἐν τοῖς ὄρεσιν⸃ ἦν κράζων καὶ κατακόπτων ἑαυτὸν λίθοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/005.yaml
  text: And continually[a], night and day, among the tombs and on the mountains, he was crying out and cutting himself with stones.
translation:
  language: hi
  text: और वह रात-दिन लगातार कब्रों के बीच और पहाड़ों पर चिल्लाता और पत्थरों से अपने को काटता रहता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पत्थरों से अपने को बुरी तरह काटता रहता था।’
    reason: κατακόπτω केवल सामान्य रूप से काटने की तुलना में अधिक गंभीर चोट या गहरे घाव करने का भाव भी दे सकता है।
lexical_decisions:
- source_word: διὰ παντὸς νυκτὸς καὶ ἡμέρας
  choice: रात-दिन लगातार
  rationale: διά + संबंधकारक वाला यह मुहावरा पूरे समय जारी रहने का भाव देता है। ‘रात-दिन लगातार’ समय की व्यापकता और निरंतरता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μνήμασιν
  choice: कब्रों
  rationale: μνῆμα दफनाने के स्थान या कब्र को दर्शाता है। बहुवचन और ἐν के स्थानवाचक अर्थ को ‘कब्रों के बीच’ स्पष्ट रूप से व्यक्त करता है।
- source_word: ὄρεσιν
  choice: पहाड़ों
  rationale: ὄρος का सीधा अर्थ ‘पहाड़’ है; ‘पहाड़ों पर’ यूनानी स्थानवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: ἦν κράζων
  choice: चिल्लाता ... रहता था
  rationale: अपूर्ण भूतकालीन εἰμί और वर्तमान कृदंत का संयोजन अतीत में जारी क्रिया दिखाता है। ‘चिल्लाता रहता था’ उसके निरंतर व्यवहार को स्पष्ट करता है।
- source_word: κατακόπτων ἑαυτὸν
  choice: अपने को काटता रहता था
  rationale: κατακόπτω काटने या प्रहार करके घायल करने का प्रबल अर्थ रखता है। ‘अपने को काटता’ आत्म-हानि को स्पष्ट और संयत ढंग से व्यक्त करता है, जबकि ‘रहता था’ जारी क्रिया को सुरक्षित रखता है।
- source_word: λίθοις
  choice: पत्थरों से
  rationale: यहाँ संबंधकारक नहीं बल्कि साधनसूचक दत्तिव है; ‘पत्थरों से’ हिन्दी में साधन को स्वाभाविक रूप से दर्शाता है।
