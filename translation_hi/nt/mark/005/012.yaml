  text: καὶ παρεκάλεσαν ⸀αὐτὸν λέγοντες· Πέμψον ἡμᾶς εἰς τοὺς χοίρους, ἵνα εἰς αὐτοὺς εἰσέλθωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/012.yaml
  text: And they begged him[a], saying, “Send us into the pigs, so that we may enter them.”
translation:
  language: hi
  text: 'और उन्होंने उससे विनती की: “हमें उन सूअरों में भेज दे, ताकि हम उनमें प्रवेश कर जाएँ।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκάλεσαν
  choice: विनती की
  rationale: संदर्भ में यह क्रिया साधारण अनुरोध से अधिक आग्रहपूर्ण याचना व्यक्त करती है। ‘विनती की’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: αὐτὸν
  choice: उससे
  rationale: सर्वनाम यीशु की ओर संकेत करता है। हिन्दी में ‘विनती करना’ के साथ ‘से’ स्वाभाविक कारक है।
- source_word: λέγοντες
  choice: करते हुए कहा
  rationale: यह यूनानी कृदन्त विनती की विषयवस्तु प्रस्तुत करता है; ‘विनती करते हुए कहा’ उसकी क्रियात्मक संबद्धता को सहज हिन्दी में बनाए रखता है।
- source_word: Πέμψον
  choice: भेज दे
  rationale: πέμπω का प्रत्यक्ष अर्थ ‘भेजना’ है। व्यापक संदर्भ में अनुमति निहित है, पर अनुवाद में उसे स्पष्ट रूप से जोड़ने के बजाय मूल आज्ञार्थक अभिव्यक्ति रखी गई है।
- source_word: ἡμᾶς
  choice: हमें
  rationale: प्रथम पुरुष बहुवचन कर्मवाचक सर्वनाम का सीधा हिन्दी रूप।
- source_word: εἰς τοὺς χοίρους
  choice: उन सूअरों में
  rationale: χοῖρος के लिए ‘सूअर’ आधुनिक मानक हिन्दी का सामान्य शब्द है। निश्चित पदबंध को संदर्भानुकूल ‘उन सूअरों’ से व्यक्त किया गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य सूचक संबंध को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτοὺς εἰσέλθωμεν
  choice: हम उनमें प्रवेश कर जाएँ
  rationale: εἰσέρχομαι के ‘प्रवेश करना’ अर्थ को सुरक्षित रखते हुए संभाव्य उपवाक्य को ‘जाएँ’ से व्यक्त किया गया है।
theological_decisions:
- issue: वक्ताओं के अनुरोध और यीशु के अधिकार का स्वरूप
  choice: वक्ताओं को यीशु से आग्रहपूर्वक विनती करते और उससे अपने को सूअरों में भेजने को कहते हुए प्रस्तुत किया गया है।
  alternative: इसे केवल स्थान बदलने के सामान्य अनुरोध के रूप में हल्का करना, या ‘भेज’ को स्पष्ट रूप से ‘अनुमति दे’ बनाना।
  rationale: ‘विनती’ और ‘भेज दे’ मूल पाठ की तीव्रता तथा यीशु के अधीन उनकी स्थिति को व्यक्त करते हैं, पर पाठ से आगे बढ़कर कोई अतिरिक्त धर्मसैद्धान्तिक दावा नहीं जोड़ते।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘सूअर’ सामान्य पाठक के लिए ‘शूकर’ या किसी पुरातन विकल्प से अधिक स्वाभाविक है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
