  text: And he allowed no one to accompany him except Peter and James and John, the brother of James.
translation:
  language: hi
  text: और उसने पतरस, याकूब और याकूब के भाई यूहन्ना के सिवा किसी को भी अपने साथ चलने की अनुमति नहीं दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφῆκεν
  choice: अनुमति नहीं दी
  rationale: अनंत क्रिया के साथ ἀφίημι यहाँ अनुमति देने के अर्थ में है; नकार सहित यह स्वाभाविक आधुनिक हिन्दी में क्रिया का निषेध स्पष्ट करता है।
- source_word: οὐδένα
  choice: किसी को भी
  rationale: नकारात्मक क्रिया के साथ यह यूनानी पद पूर्ण बहिष्कार व्यक्त करता है; ‘किसी को भी ... नहीं’ हिन्दी में स्वाभाविक है।
- source_word: μετ’ αὐτοῦ
  choice: अपने साथ
  rationale: यह यीशु के साथ जाने का संबंध स्पष्ट करता है; हिन्दी में ‘अपने’ का संदर्भ वाक्य के कर्ता यीशु से स्वाभाविक रूप से जुड़ता है।
- source_word: συνακολουθῆσαι
  choice: आने
  rationale: संदर्भ में इसका अर्थ यीशु के साथ आगे जाना है; ‘अपने साथ आने’ से संयुक्त साथ चलने का भाव सहज हिन्दी में व्यक्त होता है।
- source_word: εἰ μὴ
  choice: को छोड़
  rationale: यहाँ पद शर्त नहीं बल्कि अपवाद प्रस्तुत करता है; ‘को छोड़’ हिन्दी में उसी अपवाद को स्पष्ट करता है।
- source_word: τὸν Πέτρον καὶ Ἰάκωβον καὶ Ἰωάννην
  choice: पतरस, याकूब और ... यूहन्ना
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं; हिन्दी सूची-शैली में अल्पविराम और अंतिम ‘और’ स्वाभाविक हैं।
- source_word: τὸν ἀδελφὸν Ἰακώβου
  choice: याकूब के भाई यूहन्ना
  rationale: यह विशेषणात्मक पद यूहन्ना की पहचान याकूब के भाई के रूप में करता है; हिन्दी में संज्ञा से पहले संबंध रखना अधिक सहज है।
