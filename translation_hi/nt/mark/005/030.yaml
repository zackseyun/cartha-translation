source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ὁ Ἰησοῦς ἐπιγνοὺς ἐν ἑαυτῷ τὴν ἐξ αὐτοῦ δύναμιν ἐξελθοῦσαν ἐπιστραφεὶς ἐν τῷ ὄχλῳ ἔλεγεν· Τίς μου ἥψατο τῶν ἱματίων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/030.yaml
  text: And immediately Jesus[a], perceiving in himself that power had gone out from him, turned around in the crowd and said, “Who touched my garments?”
translation:
  language: hi
  text: यीशु ने तुरन्त अपने भीतर जान लिया कि उसमें से सामर्थ्य निकल चुकी थी। तब उसने भीड़ में मुड़कर कहा, “मेरे वस्त्रों को किसने छुआ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की तीव्र कथा-गति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐπιγνοὺς ἐν ἑαυτῷ
  choice: अपने भीतर जान लिया
  rationale: यह यीशु की आन्तरिक और स्पष्ट अनुभूति को व्यक्त करता है, न कि बाहरी निरीक्षण को।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यह चंगाई से जुड़ी प्रभावकारी शक्ति का सीधा और पर्याप्त व्यापक अनुवाद है; ‘चंगाई की सामर्थ्य’ कहना मूल से अधिक स्पष्ट कर देना होता।
- source_word: ἐξελθοῦσαν
  choice: निकल चुकी है
  rationale: कृदन्त उस क्रिया को दर्शाता है जो यीशु के जानने तक घट चुकी थी; यह हिन्दी में पूर्वपूर्णता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιστραφεὶς ἐν τῷ ὄχλῳ
  choice: भीड़ में मुड़कर
  rationale: यह भीड़ के बीच यीशु के शारीरिक रूप से मुड़ने को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔλεγεν
  choice: कहा
  rationale: संवाद आरम्भ करने के लिए सामान्य हिन्दी भूतकाल स्वाभाविक है; प्रसंग बार-बार कहने पर बल नहीं देता।
- source_word: ἥψατο τῶν ἱματίων
  choice: मेरे वस्त्रों को किसने छुआ
  rationale: ‘छुआ’ इस प्रसंग में क्रिया का सामान्य अर्थ है और बहुवचन ἱμάτια के लिए ‘वस्त्रों’ सटीक, गरिमापूर्ण तथा सहज है।
theological_decisions:
- issue: यीशु का अपने में से सामर्थ्य निकलने को जानना
  choice: कथन को वास्तविक घटना के रूप में सीधे बनाए रखा गया है
  alternative: इसे ‘चंगाई की सामर्थ्य’ कहकर अधिक व्याख्यात्मक बनाना, या केवल व्यक्तिपरक अनुभूति के रूप में प्रस्तुत करना
  rationale: मूल पाठ कहता है कि यीशु ने अपने में से सामर्थ्य निकल चुकी होने को जाना। अनुवाद चमत्कार की प्रक्रिया की अटकल लगाए बिना इस कथात्मक दावे और उसके रहस्य को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण रूप अपनाया गया है। ‘सामर्थ्य’ और ‘वस्त्र’ सामान्य पाठक के लिए बोधगम्य रहते हुए बाइबलीय प्रसंग के अनुरूप हैं।
