review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Jesus' immediate inward awareness, the power going out from him, his turning amid the crowd, and his question about who touched his garments. However, ‘निकल चुकी है’ is present perfect and does not naturally mark the power's departure as prior to his past act of recognition; the Greek perfective participle calls for an anterior past expression in this context.
  naturalness: The Hindi is clear, modern, and suitably dignified. Changing the tense to ‘निकल चुकी थी’ makes the sequence idiomatic and precise. ‘सामर्थ्य’ and ‘वस्त्रों’ are natural in a formal biblical register.
  terminology: ‘सामर्थ्य’ appropriately renders δύναμις without importing an explanatory phrase such as ‘चंगाई की शक्ति.’ ‘वस्त्रों’ faithfully preserves the plural ἱματίων and fits the register. ‘अपने भीतर जान लिया’ adequately conveys inward recognition.
  issues:
  - severity: low
    issue: Anterior action is rendered with present perfect.
    rationale: ‘कि उसमें से सामर्थ्य निकल चुकी है’ can suggest a present-state assertion. Since Jesus recognized that the power had already gone out, ‘निकल चुकी थी’ more faithfully and naturally expresses the prior completed event.
  revised_text: यीशु ने तुरन्त अपने भीतर जान लिया कि उसमें से सामर्थ्य निकल चुकी थी। तब उसने भीड़ में मुड़कर कहा, “मेरे वस्त्रों को किसने छुआ?”
  revised_footnotes: []
  revision_rationale: 'Only the verb tense has been adjusted to preserve the Greek temporal relationship: Jesus perceived that power had already gone out from him. The wording otherwise retains the draft''s accurate, natural rendering and does not add doctrinal explanation.'
