source:
  edition: SBLGNT
  text: ⸀καὶ ἔρχεται εἷς τῶν ἀρχισυναγώγων, ὀνόματι Ἰάϊρος, καὶ ἰδὼν αὐτὸν πίπτει πρὸς τοὺς πόδας αὐτοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/022.yaml
  text: And one of the synagogue rulers[a], named Jairus, came, and when he saw him[b], he fell at his feet.
translation:
  language: hi
  text: आराधनालय के प्रधानों में से एक, जिसका नाम याईर था, आया और उसे देखकर उसके चरणों में गिर पड़ा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔρχεται
  choice: आया
  rationale: यूनानी में ऐतिहासिक वर्तमान काल कथा को सजीव बनाता है; हिन्दी में स्वाभाविक प्रवाह के लिए इसे सामान्य भूतकाल में रखा गया है।
- source_word: εἷς τῶν ἀρχισυναγώγων
  choice: आराधनालय के अधिकारियों में से ... एक व्यक्ति
  rationale: यह अंश ऐसे व्यक्तियों में से एक को बताता है जो आराधनालय की व्यवस्था और नेतृत्व से जुड़े थे। ‘अधिकारियों’ आधुनिक हिन्दी में भूमिका को स्पष्ट करता है और बहुवचन संबंध को बनाए रखता है।
- source_word: ὀνόματι Ἰάϊρος
  choice: याईर नाम का
  rationale: यह नाम बताने की यूनानी अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: Ἰάϊρος
  choice: याईर
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार लिखा गया है।
- source_word: ἰδὼν αὐτὸν
  choice: यीशु को देखते ही
  rationale: पूर्ववर्ती संदर्भ में सर्वनाम यीशु की ओर संकेत करता है। नाम का प्रयोग हिन्दी में संदर्भ स्पष्ट करता है; ‘देखते ही’ देखने और उसके बाद गिरने के निकट क्रम को सहज रूप से व्यक्त करता है।
- source_word: πίπτει πρὸς τοὺς πόδας αὐτοῦ
  choice: वह उनके चरणों में गिर पड़ा
  rationale: दूसरे ऐतिहासिक वर्तमान को भी स्वाभाविक हिन्दी कथा के लिए भूतकाल में रखा गया है। ‘चरणों में गिर पड़ा’ शारीरिक क्रिया और विनतीपूर्ण मुद्रा को व्यक्त करता है, पर उसे स्पष्ट रूप से आराधना नहीं ठहराता।
theological_decisions:
- issue: यीशु के सामने याईर की मुद्रा का अर्थ
  choice: उनके चरणों में गिर पड़ा
  alternative: उसने उनकी आराधना की
  rationale: यूनानी पाठ शारीरिक रूप से चरणों के पास गिरने का वर्णन करता है। यह आदर, व्याकुलता या विनती प्रकट कर सकता है, पर यहाँ आराधना के लिए कोई स्पष्ट क्रिया नहीं है; इसलिए अनुवाद धार्मिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, प्रवाहपूर्ण और गरिमापूर्ण रखी गई है। ‘आराधनालय’ परिचित धार्मिक शब्द है, जबकि ‘अधिकारी’ नेतृत्व तथा प्रशासनिक भूमिका को साधारण पाठक के लिए स्पष्ट करता है।
