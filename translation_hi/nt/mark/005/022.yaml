revisions:
- from: तब आराधनालय के अधिकारियों में से याईर नाम का एक व्यक्ति आया। यीशु को देखते ही वह उनके चरणों में गिर पड़ा।
  to: आराधनालय के प्रधानों में से एक, जिसका नाम याईर था, आया और उसे देखकर उसके चरणों में गिर पड़ा।
  rationale: The revision more precisely renders the synagogue-leadership designation, removes an unwarranted temporal connective, and keeps the participial sequence natural without intensifying it. It retains the historical-present actions in Hindi past narrative and does not add a theological interpretation to the act of falling at Jesus’ feet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:16:55Z'
review_pass:
  verdict: revise
  source_fidelity: ‘आराधनालय के अधिकारियों में से’ broadly conveys the partitive plural, but ‘प्रधानों में से’ more directly represents ἀρχισυναγώγων, synagogue leaders/rulers. The added ‘तब’ is not required by καί and can imply a temporal link stronger than the simple connective. ‘उसे देखकर’ accurately preserves the aorist participle without adding emphasis beyond the source.
  naturalness: The revision is idiomatic, concise modern Hindi. ‘उसके चरणों में गिर पड़ा’ is a natural narrative expression; singular pronouns referring to यीशु avoid an unnecessary shift to honorific plural in a clause where the antecedent is clear.
  terminology: ‘आराधनालय’ is appropriate. ‘प्रधान’ is more precise than the administratively broad ‘अधिकारी’ for synagogue rulers. The established Hindi biblical form ‘याईर’ is retained. The physical posture is retained without interpreting it as worship.
  issues:
  - severity: medium
    issue: ‘अधिकारियों’ is broader than the Greek synagogue-leadership term.
    rationale: ἀρχισυνάγωγος denotes a synagogue ruler/leader. ‘आराधनालय के प्रधानों’ preserves this leadership sense more specifically while retaining the plural partitive construction.
  - severity: low
    issue: ‘तब’ adds an unnecessary temporal nuance to καί.
    rationale: The Greek simply joins the next event with ‘and’; Hindi can express this naturally without a temporal adverb.
  - severity: low
    issue: ‘देखते ही’ slightly heightens the immediacy of the participial clause.
    rationale: ἰδὼν is adequately and more neutrally rendered ‘उसे देखकर’; the subsequent finite verb supplies the narrative sequence.
  revised_text: आराधनालय के प्रधानों में से एक, जिसका नाम याईर था, आया और उसे देखकर उसके चरणों में गिर पड़ा।
