id: MRK.5.35
reference: Mark 5:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἔτι αὐτοῦ λαλοῦντος ἔρχονται ἀπὸ τοῦ ἀρχισυναγώγου λέγοντες ὅτι Ἡ θυγάτηρ σου ἀπέθανεν· τί ἔτι σκύλλεις τὸν διδάσκαλον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/035.yaml
  text: While he was still speaking[a], people came from the synagogue leader's house, saying, “Your daughter has died[b]. Why do you still trouble the Teacher?”
translation:
  language: hi
  text: वह अभी भी बोल रहा था कि आराधनालय के अगुए के घर से कुछ लोग आए और कहने लगे, “आपकी बेटी मर गई है। अब गुरु को और क्यों कष्ट देते हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔτι αὐτοῦ λαλοῦντος
  choice: वह अभी बोल ही रहा था कि
  rationale: यह संबंधकारक निरपेक्ष रचना उसी समय जारी क्रिया को व्यक्त करती है; यह हिन्दी रूप ἔτι की ‘अभी भी’ वाली शक्ति और अगले घटनाक्रम की तत्क्षणता दोनों को स्वाभाविक ढंग से रखता है।
- source_word: ἔρχονται
  choice: कुछ लोग आए
  rationale: यूनानी में ऐतिहासिक वर्तमान है, जिसे सहज हिन्दी कथा में भूतकाल से व्यक्त किया गया है। बहुवचन क्रिया और λέγοντες से अनिर्दिष्ट लोगों का बोध होता है, इसलिए ‘कुछ लोग’ जोड़ा गया है।
- source_word: ἀπὸ τοῦ ἀρχισυναγώγου
  choice: आराधनालय के अगुए के घर से
  rationale: शाब्दिक रूप ‘आराधनालय के अगुए से’ है, पर प्रसंग में अगुआ यीशु के साथ है; यह वाक्यांश स्वाभाविक रूप से उसके घराने या निवास से आए संदेशवाहकों को सूचित करता है। ‘घर’ प्रसंगगत निहितार्थ स्पष्ट करता है।
- source_word: λέγοντες ὅτι
  choice: और कहने लगे
  rationale: कृदंत प्रत्यक्ष कथन का परिचय देता है; हिन्दी कथा में यह सहज और स्पष्ट है।
- source_word: Ἡ θυγάτηρ σου
  choice: आपकी बेटी
  rationale: σου का सम्मानसूचक हिन्दी रूप प्रसंगानुकूल है; ‘बेटी’ आधुनिक सामान्य हिन्दी है।
- source_word: ἀπέθανεν
  choice: मर गई है
  rationale: अओरिस्ट एक पूर्ण हुई घटना बताता है जिसका वर्तमान परिस्थिति पर तत्काल प्रभाव है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τί ἔτι
  choice: अब ... और क्यों
  rationale: यह हिन्दी मुहावरा जारी कार्रवाई की अब आवश्यकता न रहने का प्रश्न व्यक्त करता है और ἔτι का भाव बनाए रखता है।
- source_word: σκύλλεις
  choice: कष्ट देते हैं
  rationale: यहाँ क्रिया किसी को अनावश्यक रूप से परेशान करने या उस पर बोझ डालने के अर्थ में है। ‘कष्ट देना’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: τὸν διδάσκαλον
  choice: गुरु को
  rationale: διδάσκαλος का अर्थ शिक्षक/गुरु है। ‘गुरु’ इस संबोधन के प्रति निहित सम्मान को स्वाभाविक हिन्दी में व्यक्त करता है, बिना नाम या अतिरिक्त मसीही पदवी जोड़े।
theological_decisions:
- issue: τὸν διδάσκαλον में यीशु का उल्लेख
  choice: ‘गुरु’ पदवी को रखा गया, यीशु का नाम नहीं जोड़ा गया।
  alternative: ‘शिक्षक’ अथवा ‘यीशु’
  rationale: मूल पाठ वक्ताओं के दृष्टिकोण से पदवी का प्रयोग करता है। उसे बनाए रखने से पाठ में उपस्थित दृष्टिकोण सुरक्षित रहता है और कोई अतिरिक्त मसीह-विषयक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। प्रत्यक्ष कथन में याईर के प्रति सम्मानसूचक ‘आप’ और बहुवचन क्रिया-रूप रखे गए हैं। ‘आराधनालय’ συναγωγή की धार्मिक-सामुदायिक संस्था को व्यक्त करता है और ‘अगुआ’ ἀρχισυνάγωγος के नेतृत्वकारी पद को अनावश्यक प्रशासनिक विशिष्टता के बिना बताता है।
