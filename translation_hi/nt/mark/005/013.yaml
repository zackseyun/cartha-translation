source:
  edition: SBLGNT
  text: καὶ ἐπέτρεψεν ⸀αὐτοῖς. καὶ ἐξελθόντα τὰ πνεύματα τὰ ἀκάθαρτα εἰσῆλθον εἰς τοὺς χοίρους, καὶ ὥρμησεν ἡ ἀγέλη κατὰ τοῦ κρημνοῦ εἰς τὴν θάλασσαν, ⸀ὡς δισχίλιοι, καὶ ἐπνίγοντο ἐν τῇ θαλάσσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/013.yaml
  text: And he permitted them[a]. Then the unclean spirits came out and entered the pigs, and the herd—about two thousand—rushed down the steep bank into the sea[b], and they drowned in the sea.
translation:
  language: hi
  text: और उसने उन्हें अनुमति दे दी। तब अशुद्ध आत्माएँ निकलकर सूअरों में समा गईं। और सूअरों का वह झुंड—लगभग दो हज़ार—खड़ी ढलान[a] से तेजी से नीचे समुद्र[b] में जा गिरा, और वे समुद्र में डूब गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खड़ी चट्टान’ अथवा ‘कगार’; यूनानी शब्द खड़ी ढलान या चट्टानी कगार के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘समुद्र’। यहाँ गलील का समुद्र, अर्थात गलील की झील, अभिप्रेत है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπέτρεψεν αὐτοῖς
  choice: उसने उन्हें अनुमति दे दी
  rationale: ἐπιτρέπω अनुमति देने को व्यक्त करता है। यह स्वाभाविक हिन्दी है और कर्ता तथा ‘उन्हें’—दोनों के संदर्भ को प्रसंग पर छोड़ता है।
- source_word: τὰ πνεύματα τὰ ἀκάθαρτα
  choice: अशुद्ध आत्माएँ
  rationale: यह मरकुस में प्रयुक्त व्यक्तिगत आत्मिक सत्ताओं की भाषा को बनाए रखता है और ἀκάθαρτος के अशुद्धता-संबंधी अर्थ को अनावश्यक व्याख्या के बिना व्यक्त करता है।
- source_word: ἐξελθόντα
  choice: निकलकर
  rationale: अओरिस्ट कृदन्त आत्माओं के बाहर निकलने और फिर सूअरों में प्रवेश करने का क्रम संक्षेप में व्यक्त करता है।
- source_word: εἰσῆλθον εἰς τοὺς χοίρους
  choice: सूअरों में समा गईं
  rationale: यह आधुनिक हिन्दी में किसी आत्मा के भीतर प्रवेश करने का सहज और स्पष्ट कथन है तथा यूनानी εἰσέρχομαι εἰς का आशय बनाए रखता है।
- source_word: χοίρους
  choice: सूअर
  rationale: χοῖρος के लिए यह सामान्य, स्पष्ट और आधुनिक हिन्दी शब्द है।
- source_word: ὥρμησεν ἡ ἀγέλη
  choice: वह झुंड ... जा झपटा
  rationale: ὁρμάω की आकस्मिक और प्रबल गति को ‘झपटा’ व्यक्त करता है; एकवचन सामूहिक कर्ता ἡ ἀγέλη को हिन्दी में भी एकवचन रखा गया है।
- source_word: κατὰ τοῦ κρημνοῦ
  choice: खड़ी ढलान से नीचे
  rationale: κρημνός खड़ी ढलान, कगार या प्रपात को सूचित कर सकता है। मुख्य पाठ किसी बिल्कुल सीधी चट्टान का दावा किए बिना तीखी उतराई व्यक्त करता है।
- source_word: εἰς τὴν θάλασσαν
  choice: समुद्र में
  rationale: यद्यपि यहाँ गलील की झील अभिप्रेत है, यूनानी पाठ θάλασσα अर्थात ‘समुद्र’ कहता है; इसलिए मूल अभिव्यक्ति मुख्य पाठ में रखी गई है।
- source_word: ὡς δισχίλιοι
  choice: लगभग दो हज़ार सूअर
  rationale: संख्या के साथ ὡς अनुमान दर्शाता है। ‘सूअर’ की पुनरावृत्ति हिन्दी में संख्या का संदर्भ स्पष्ट करती है।
- source_word: ἐπνίγοντο
  choice: डूब गए
  rationale: अपूर्णकालीन रूप पानी में डूबने की घटना को चित्रित करता है; हिन्दी कथा में ‘डूब गए’ स्वाभाविक रूप से उनके पानी में मर जाने का परिणाम बताता है, बिना किसी बाहरी कर्ता का संकेत दिए।
theological_decisions:
- issue: ‘उन्हें’ का संदर्भ
  choice: सर्वनाम को मुख्य पाठ में बनाए रखा गया है; प्रसंग में यह अशुद्ध आत्माओं को सूचित करता है
  alternative: ‘अशुद्ध आत्माओं को’ स्पष्ट रूप से दोहराना
  rationale: निकटवर्ती प्रसंग संदर्भ को पर्याप्त रूप से स्पष्ट करता है। सर्वनाम बनाए रखने से मूल पाठ की संक्षिप्तता बनी रहती है और अनावश्यक व्याख्यात्मक विस्तार नहीं होता।
- issue: ‘अशुद्ध आत्माएँ’ की प्रकृति
  choice: व्यक्तिगत आत्मिक सत्ताओं की भाषा बनाए रखना
  alternative: ‘बुरी शक्तियाँ’
  rationale: πνεύματα कथानक में व्यक्तिगत रूप से अनुमति माँगने और प्रवेश करने वाली सत्ताओं को दर्शाता है। ‘शक्तियाँ’ कहना मूल पाठ की प्रस्तुति को बदल देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अनुमति दे दी’, ‘समा गईं’ और ‘जा झपटा’ कथा की गति को स्वाभाविक हिन्दी में व्यक्त करते हैं। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद मुख्य पाठ में दिए गए हैं।
