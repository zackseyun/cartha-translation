lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य संयोजक मरकुस की क्रमबद्ध, सरल कथाशैली को बनाए रखता है; इसे अनावश्यक रूप से ‘तब’ बनाकर समय-सूचक अर्थ नहीं जोड़ा गया।
- source_word: ἦλθον
  choice: वे पहुँचे
  rationale: बहुवचन क्रिया यीशु और उनके साथियों को सूचित करती है। प्रसंग में यात्रा के गंतव्य तक आने के लिए ‘पहुँचे’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: यह मुहावरा जलाशय के दूसरी ओर जाने को व्यक्त करता है; ‘उस पार’ संक्षिप्त, सहज और दिशात्मक अर्थ के अनुरूप है।
- source_word: τῆς θαλάσσης
  choice: झील के
  rationale: θάλασσα का सामान्य अर्थ ‘समुद्र’ है, पर यहाँ संदर्भ गलील की झील का है। आधुनिक हिन्दी पाठक के लिए भौगोलिक आशय स्पष्ट रखने हेतु ‘झील’ चुना गया।
- source_word: εἰς τὴν χώραν
  choice: के क्षेत्र में
  rationale: χώρα यहाँ किसी आधुनिक राष्ट्र के बजाय इलाके या भूभाग को दर्शाता है; ‘क्षेत्र’ यही अर्थ स्वाभाविक रूप से देता है।
- source_word: Γερασηνῶν
  choice: गिरासेनियों के
  rationale: यह स्थान-नाम से बना जननाम है। हिन्दी में ‘गिरासेनी’ का बहुवचन संबंधकारक रूप मूल यूनानी पाठ के जनसमूह-सूचक अर्थ को बनाए रखता है।
theological_decisions:
- issue: दुष्टात्माग्रस्त व्यक्ति की कथा में स्थान-नाम संबंधी पाठांतर
  choice: गिरासेनियों
  alternative: गदरेनियों; गिरगेसियों
  rationale: SBLGNT में Γερασηνῶν पाठ है, इसलिए मुख्य पाठ में ‘गिरासेनियों’ रखा गया। महत्वपूर्ण प्राचीन पाठांतरों को पाठ-टिप्पणी में सुरक्षित रखा गया है, जिससे भौगोलिक और पाठालोचनात्मक तनाव को चुपचाप समाप्त न किया जाए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मरकुस की सरल संयोजक शैली के लिए ‘और’ रखा गया है। संदर्भगत भौगोलिक स्पष्टता के लिए ‘समुद्र’ के बजाय ‘झील’ प्रयुक्त है; स्थान-नाम का प्रमुख पाठ मुख्य वाक्य में और अन्य प्राचीन पाठ फुटनोट में दिए गए हैं।
