source:
  edition: SBLGNT
  text: καὶ ἀπῆλθεν καὶ ἤρξατο κηρύσσειν ἐν τῇ Δεκαπόλει ὅσα ἐποίησεν αὐτῷ ὁ Ἰησοῦς, καὶ πάντες ἐθαύμαζον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/020.yaml
  text: And he went away and began to proclaim in the Decapolis how much Jesus had done for him[a], and everyone was amazed.
translation:
  language: hi
  text: और वह चला गया और दिकापुलिस में यह प्रचार करने लगा कि यीशु ने उसके लिए कितना कुछ किया था[a]; और सभी चकित होते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ने उसके लिए जो कुछ किया था।”
    reason: ὅσα का वैकल्पिक, समान रूप से सम्भव अर्थ।
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह दृश्य-स्थल से उसके चले जाने को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἤρξατο κηρύσσειν
  choice: प्रचार करने लगा
  rationale: ἤρξατο के आरंभसूचक अर्थ और κηρύσσειν की सार्वजनिक घोषणा—दोनों को व्यक्त करता है, बिना किसी औपचारिक उपदेश-सभा का भाव जोड़े।
- source_word: ἐν τῇ Δεκαπόλει
  choice: दिकापुलिस में
  rationale: ἐν का सीधा स्थानवाचक अर्थ बनाए रखा गया है। दिकापुलिस उस क्षेत्र का प्रचलित ऐतिहासिक नाम है।
- source_word: ὅσα
  choice: कितना कुछ
  rationale: यह किए गए कार्य की व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वह सब जो’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: ἐποίησεν αὐτῷ
  choice: उसके लिए ... किया था
  rationale: सम्प्रदान αὐτῷ को हितार्थक ‘उसके लिए’ से व्यक्त किया गया है। ‘किया था’ प्रचार से पहले हुए कार्य को हिन्दी में स्वाभाविक रूप से दिखाता है।
- source_word: πάντες
  choice: सभी
  rationale: यह πάντες के सामूहिक मानवीय संदर्भ को बिना अतिरिक्त संज्ञा जोड़े व्यक्त करता है।
- source_word: ἐθαύμαζον
  choice: चकित होते रहे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली प्रतिक्रिया को दर्शाता है; केवल क्षणिक ‘चकित हुए’ की अपेक्षा स्रोत के पक्ष को बेहतर बनाए रखता है।
- source_word: ὁ Ἰησοῦς
  choice: यीशु
  rationale: नाम का मानक हिन्दी बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: मनुष्य की घोषणा और यीशु की पहचान के बीच संबंध
  choice: उसने यीशु द्वारा अपने लिए किए गए काम का प्रचार किया—इतना ही स्पष्ट रूप से कहा गया है।
  alternative: यीशु के दैवी अधिकार को स्पष्ट करने वाला व्याख्यात्मक विस्तार।
  rationale: पद यीशु के असाधारण कार्य और लोगों के चकित होने की सूचना देता है, पर स्वयं कोई प्रत्यक्ष सिद्धान्तगत निष्कर्ष नहीं जोड़ता; इसलिए निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘प्रचार’ सार्वजनिक घोषणा का भाव देता है; ‘दिकापुलिस’ ऐतिहासिक भौगोलिक नाम के रूप में रखा गया है।
