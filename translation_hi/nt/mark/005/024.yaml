  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। यीशु के लिए सम्मानसूचक बहुवचन का प्रयोग किया गया है, जबकि साथ जा रहे व्यक्ति के लिए एकवचन रखा गया है। पहले वाक्य में प्रसंगगत कर्ता ‘यीशु’ स्पष्ट किया गया है ताकि हिन्दी में सर्वनाम-संदर्भ अस्पष्ट न हो।
