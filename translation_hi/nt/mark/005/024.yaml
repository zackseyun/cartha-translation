  text: And he went with him[a]. And a large crowd was following him and pressing around him.
translation:
  language: hi
  text: यीशु उसके साथ चल पड़े। एक बड़ी भीड़ उनके पीछे चली आ रही थी और उन्हें चारों ओर से दबा रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे सटकर उन्हें दबा रही थी।” यूनानी क्रिया भीड़ द्वारा यीशु को शारीरिक रूप से चारों ओर से दबाने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπῆλθεν
  choice: चल पड़े
  rationale: यह क्रिया याईर के साथ यीशु के आगे बढ़ने को बताती है। ‘चल पड़े’ प्रसंग में स्वाभाविक है और यूनानी एओरिस्ट की कथात्मक गति को स्पष्ट करता है।
- source_word: μετ’ αὐτοῦ
  choice: उसके साथ
  rationale: μετά के साथ संबंधकारक संगति या साथ जाने का अर्थ देता है; ‘उसके साथ’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἠκολούθει
  choice: पीछे चली आ रही थी
  rationale: अपूर्णकाल जारी क्रिया को दर्शाता है। ‘चली आ रही थी’ भीड़ के लगातार पीछे चलने का भाव बनाए रखता है।
- source_word: ὄχλος πολύς
  choice: एक बड़ी भीड़
  rationale: ὄχλος का अर्थ ‘भीड़’ और πολύς का यहाँ अर्थ उसके बड़े आकार से है।
- source_word: συνέθλιβον
  choice: चारों ओर से दबाए जा रही थी
  rationale: συνθλίβω शारीरिक रूप से सटकर दबाने या भींचने का भाव देता है। यह चयन भीड़ के लगातार दबाव को व्यक्त करता है, पर वास्तविक चोट या कुचले जाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: αὐτόν
  choice: उन्हें
  rationale: यह सर्वनाम यीशु की ओर संकेत करता है। आधुनिक सम्मानसूचक हिन्दी में यीशु के लिए ‘उन्हें’ स्वाभाविक है।
