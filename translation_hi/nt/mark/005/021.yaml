translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उस पार’ और ‘चारों ओर इकट्ठी हो गई’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘समुद्र’ मूल यूनानी शब्दावली को बनाए रखता है।
