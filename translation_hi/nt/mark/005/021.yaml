  text: Καὶ διαπεράσαντος τοῦ Ἰησοῦ ἐν τῷ πλοίῳ πάλιν εἰς τὸ πέραν συνήχθη ὄχλος πολὺς ἐπ’ αὐτόν, καὶ ἦν παρὰ τὴν θάλασσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/021.yaml
  text: And after Jesus had crossed over again in the boat to the other side[a], a large crowd gathered around him, and he was beside the sea.
translation:
  language: hi
  text: यीशु नाव में फिर से उस पार चले गए, तो एक बड़ी भीड़ उनके चारों ओर इकट्ठी हो गई; और वे समुद्र[a] के किनारे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात गलील का समुद्र, जो एक झील है, पर सुसमाचारों में उसे “समुद्र” कहा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: διαπεράσαντος
  choice: पार चले जाने के बाद
  rationale: अओरिस्ट कृदंत वाले संबंधवाचक स्वतंत्र वाक्यांश को पूर्वकालिक परिस्थिति के रूप में व्यक्त किया गया है; इससे मुख्य घटना से पहले पार जाने का क्रम स्पष्ट रहता है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में
  rationale: मूल पूर्वसर्गीय वाक्यांश को स्पष्ट रूप से बनाए रखा गया है; इस प्रसंग में आधुनिक हिन्दी का ‘नाव’ स्वाभाविक है।
- source_word: πάλιν
  choice: फिर से
  rationale: यह क्रिया की पुनरावृत्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: झील पार करने के प्रसंग में यह सामने वाले किनारे का स्वाभाविक और संक्षिप्त हिन्दी रूप है।
- source_word: συνήχθη
  choice: इकट्ठी हो गई
  rationale: यूनानी क्रिया रूपतः कर्मवाच्य है, पर यहाँ भीड़ के एकत्र होने को हिन्दी में अकर्मक रूप से कहना अधिक स्वाभाविक है।
- source_word: ὄχλος πολὺς
  choice: एक बड़ी भीड़
  rationale: यह भीड़ की संख्या/आकार को स्पष्ट, सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπ’ αὐτόν
  choice: उनके चारों ओर
  rationale: συνάγω के साथ यह वाक्यांश यीशु की ओर आकर उनके आसपास जुटने का स्थानिक भाव देता है।
- source_word: παρὰ τὴν θάλασσαν
  choice: समुद्र के किनारे
  rationale: παρά यहाँ तट के पास की स्थिति बताता है; ‘किनारे’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: θάλασσαν
  choice: समुद्र
  rationale: मूल यूनानी शब्द का सामान्य अर्थ ‘समुद्र’ है। गलील का यह जलाशय भौगोलिक रूप से झील है, जिसकी स्पष्टता पादटिप्पणी में दी गई है।
