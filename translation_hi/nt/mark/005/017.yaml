  yaml_path: translation/nt/mark/005/017.yaml
  text: And they began to beg him to leave their region[a].
translation:
  language: hi
  text: और वे उससे विनती करने लगे कि वह उनके इलाके से चला जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उससे आग्रह करने लगे कि वह उनके क्षेत्र से चला जाए।”
    reason: παρακαλεῖν के लिए ‘आग्रह’ और ὅρια के लिए ‘क्षेत्र’ समान रूप से संभव शाब्दिक विकल्प हैं।
lexical_decisions:
- source_word: ἤρξαντο
  choice: लगे
  rationale: सहायक क्रिया ‘लगे’ infinitive के साथ आरंभिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: παρακαλεῖν
  choice: विनती करने
  rationale: इस प्रसंग में यह केवल पूछने नहीं, बल्कि आग्रहपूर्वक निवेदन करने का भाव रखता है; ‘विनती’ उसकी तीव्रता और सम्मानपूर्ण स्वर दोनों को व्यक्त करती है।
- source_word: αὐτὸν
  choice: उससे
  rationale: सर्वनाम यीशु की ओर संकेत करता है; हिन्दी में ‘विनती करना’ के साथ संबंधवाचक ‘से’ स्वाभाविक है।
- source_word: ἀπελθεῖν
  choice: चला जाए
  rationale: यह उनकी विनती की विषय-वस्तु बताता है और आधुनिक हिन्दी में ‘वहाँ से चले जाने’ का स्वाभाविक रूप है।
- source_word: ἀπὸ τῶν ὁρίων αὐτῶν
  choice: उनके इलाके से
  rationale: ὅρια का मूल अर्थ सीमाएँ है, पर बहुवचन मुहावरे में इससे सीमाओं के भीतर का क्षेत्र अभिप्रेत है; ‘इलाका’ सामान्य पाठक के लिए सहज है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले वृत्तांत से साधारण संयोजक संबंध बनाए रखता है और इसमें अनावश्यक कालगत अर्थ नहीं जोड़ता।
