  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘इलाका’ सामान्य बोलचाल में स्पष्ट है, जबकि पादटिप्पणी में अपेक्षाकृत औपचारिक ‘क्षेत्र’ दिया गया है।
