source:
  edition: SBLGNT
  text: καὶ ⸀παρακαλεῖ αὐτὸν πολλὰ λέγων ὅτι Τὸ θυγάτριόν μου ἐσχάτως ἔχει, ἵνα ἐλθὼν ἐπιθῇς ⸂τὰς χεῖρας αὐτῇ⸃ ⸀ἵνα σωθῇ καὶ ⸀ζήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/023.yaml
  text: And he begged him earnestly[a], saying, “My little daughter is at the point of death. Come and lay your hands on her, so that she may be healed and live.”
translation:
  language: hi
  text: और वह उससे बहुत विनती करते हुए कहने लगा, “मेरी छोटी बेटी मृत्यु के निकट है। आकर उस पर अपने हाथ रख दें, ताकि वह बच जाए[a] और जीवित रहे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठीक हो जाए” अथवा “चंगी हो जाए।” यूनानी क्रिया का अर्थ बचाना, छुड़ाना या चंगा करना हो सकता है; यहाँ तत्काल प्रसंग शारीरिक चंगाई का है।
    reason: alternative_reading
lexical_decisions:
- source_word: παρακαλεῖ ... πολλὰ
  choice: बहुत विनती करके
  rationale: क्रिया के साथ πολλὰ आग्रह की तीव्रता को बढ़ाता है; यह हिन्दी में उसकी व्याकुल और प्रबल विनती को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: θυγάτριόν
  choice: छोटी बेटी
  rationale: लघुतासूचक रूप बेटी की कम आयु और पिता के स्नेह—दोनों की छाया रख सकता है; ‘छोटी बेटी’ इसे बिना अतिव्याख्या के व्यक्त करता है।
- source_word: ἐσχάτως ἔχει
  choice: मरने पर है
  rationale: यह मुहावरा अत्यन्त गंभीर, अंतिम अवस्था को बताता है; प्रसंग में अर्थ है कि वह मृत्यु के निकट है।
- source_word: ἐλθὼν ἐπιθῇς τὰς χεῖρας αὐτῇ
  choice: आकर उस पर अपने हाथ रख दे
  rationale: ग्रीक कृदन्त और क्रिया को स्वाभाविक हिन्दी अनुरोध में रखा गया है तथा χεῖρας का बहुवचन ‘हाथ’ सुरक्षित है।
- source_word: σωθῇ
  choice: बच जाए
  rationale: σῴζω के व्यापक अर्थ—बचाना, उद्धार करना और चंगा करना—में से ‘बच जाए’ इस मृत्यु-संकट के प्रसंग में स्वाभाविक है और केवल चिकित्सकीय अर्थ तक शब्द को सीमित नहीं करता।
- source_word: ζήσῃ
  choice: जीवित रहे
  rationale: यह क्रिया सीधे जीवन का परिणाम व्यक्त करती है और σωθῇ के बाद उद्देश्य को स्पष्ट करती है।
theological_decisions:
- issue: चंगाई के प्रसंग में σωθῇ का अनुवाद
  choice: बच जाए
  alternative: चंगी हो जाए / भली-चंगी हो जाए
  rationale: तत्काल प्रसंग शारीरिक चंगाई का है, पर यूनानी क्रिया का अर्थ-क्षेत्र बचाव और उद्धार तक व्यापक है। ‘बच जाए’ मृत्यु से रक्षा का स्वाभाविक अर्थ देता है और स्रोत की व्यापकता को बनाए रखता है; प्रसंगानुकूल चिकित्सकीय अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। पिता की व्याकुलता ‘बहुत विनती करके’ और ‘मरने पर है’ से स्पष्ट होती है। प्रत्यक्ष कथन में ‘रख दे’ निकट संबोधन के स्वाभाविक एकवचन रूप को बनाए रखता है।
