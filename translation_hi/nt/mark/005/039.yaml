source:
  edition: SBLGNT
  text: καὶ εἰσελθὼν λέγει αὐτοῖς· Τί θορυβεῖσθε καὶ κλαίετε; τὸ παιδίον οὐκ ἀπέθανεν ἀλλὰ καθεύδει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/039.yaml
  text: And after entering, he says to them, “Why are you making a commotion and weeping? The child has not died, but is sleeping.”
translation:
  language: hi
  text: और भीतर जाने के बाद वह उनसे कहता है, “तुम क्यों शोर मचा रहे हो और रो रहे हो? बच्ची मरी नहीं है, बल्कि सो रही है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बच्ची नहीं मरी, बल्कि सोती है।” आगे होने वाले जिलाए जाने के आलोक में, यीशु यहाँ मृत्यु के लिए ‘नींद’ का रूपक इस्तेमाल कर रहे हो सकते हैं।
    reason: क्रियात्मक रूप का वैकल्पिक अनुवाद और रूपकात्मक अर्थ की वास्तविक अस्पष्टता।
lexical_decisions:
- source_word: εἰσελθὼν
  choice: भीतर जाने के बाद
  rationale: यह पूर्वकालिक एओरिस्ट कृदंत मुख्य क्रिया से पहले हुए प्रवेश को दर्शाता है; यह हिन्दी में स्वाभाविक रूप से उस संबंध को व्यक्त करता है।
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखने से मरकुस की जीवंत कथन-शैली सुरक्षित रहती है।
- source_word: Τί
  choice: क्यों
  rationale: इस प्रश्नात्मक फटकार में हिन्दी का ‘क्यों’ यूनानी मुहावरे का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: θορυβεῖσθε
  choice: शोर मचा रहे हो
  rationale: क्रिया ऊँची आवाज़ वाले उपद्रव या कोलाहल में लगे होने को दर्शाती है; यह पद शोक के दृश्य में स्पष्ट और सामान्य हिन्दी है।
- source_word: κλαίετε
  choice: रो रहे हो
  rationale: यह वर्तमान क्रिया को सरल, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना विधिवत विलाप का अतिरिक्त अर्थ जोड़े।
- source_word: παιδίον
  choice: बच्ची
  rationale: संज्ञा का अर्थ ‘बच्चा/बालक’ है; हिन्दी में ज्ञात स्त्री संदर्भ के अनुसार ‘बच्ची’ कहना स्वाभाविक है, यद्यपि यूनानी रूप अपने आप में लिंग-विशिष्ट नहीं है।
- source_word: οὐκ ἀπέθανεν
  choice: मरी नहीं है
  rationale: एओरिस्ट क्रिया मृत्यु की घटना का निषेध करती है; ‘मरी नहीं है’ तत्काल वर्तमान संदर्भ में उसका स्वाभाविक हिन्दी रूप है और इसे केवल ‘मृत नहीं है’ जैसी अवस्थासूचक अभिव्यक्ति में नहीं बदलता।
- source_word: καθεύδει
  choice: सो रही है
  rationale: वर्तमान क्रिया को स्वाभाविक हिन्दी में व्यक्त करते हुए यीशु की नींद संबंधी भाषा को व्याख्या द्वारा हटाया नहीं गया है।
theological_decisions:
- issue: क्या यीशु के कथन को मृत्यु का शाब्दिक निषेध माना जाए या मृत्यु के लिए रूपकात्मक नींद की भाषा
  choice: मुख्य पाठ में ‘मरी नहीं है, बल्कि सो रही है’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘बच्ची स्थायी रूप से नहीं मरी है’ अथवा ‘वह मानो सो रही है, क्योंकि यीशु उसे जिलाने वाला है।’
  rationale: यूनानी कथन जानबूझकर सीधा और तनावपूर्ण है। अनुवाद यह तय नहीं करता कि भाषा शाब्दिक, रूपकात्मक या आने वाले जिलाए जाने की दृष्टि से कही गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ऐतिहासिक वर्तमान ‘कहता है’ और कथन में निहित धर्मवैज्ञानिक तनाव दोनों बनाए रखे गए हैं।
