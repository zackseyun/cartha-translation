lexical_decisions:
- source_word: ἦν δὲ
  choice: था
  rationale: ἦν अस्तित्व या उपस्थित होने का भाव देता है; δέ हल्का कथात्मक संयोजक है, जिसे स्वाभाविक हिन्दी वाक्य-प्रवाह में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: स्थानसूचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: πρὸς τῷ ὄρει
  choice: पहाड़ के पास
  rationale: दत्तिव के साथ πρός यहाँ निकटता या समीप स्थित होने का भाव देता है; यह रूप अनावश्यक स्थानिक अतिनिर्धारण नहीं करता।
- source_word: ἀγέλη
  choice: झुंड
  rationale: पशुओं के समूह के लिए सामान्य, स्पष्ट और वर्तमान हिन्दी शब्द।
- source_word: χοίρων
  choice: सूअरों का
  rationale: χοῖρος का सहज आधुनिक हिन्दी समतुल्य 'सूअर' है।
- source_word: μεγάλη
  choice: बड़ा
  rationale: यह झुंड के आकार या संख्या की अधिकता बताता है; 'बड़ा' सामान्य और स्वाभाविक है।
- source_word: βοσκομένη
  choice: चर रहा था
  rationale: वर्तमान कृदन्त झुंड की उस समय जारी चरने/खाने की क्रिया बताता है; हिन्दी में 'चर रहा था' पशुओं के लिए सहज है।
