  yaml_path: translation/nt/mark/005/009.yaml
  text: And he was asking him, “What is your name?” And he says to him, “My name is Legion,[a] because we are many.”
translation:
  language: hi
  text: और वह उससे पूछता रहा, “तुम्हारा नाम क्या है?” और वह उससे कहता है, “मेरा नाम लीजन[a] है, क्योंकि हम बहुत हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “लीजन” लैटिन का एक सैन्य शब्द है, जिसे यूनानी में अपनाया गया था। यह रोमी सेना की एक बड़ी टुकड़ी को दर्शाता था; यहाँ यह दुष्टात्मा के बताए हुए नाम के रूप में प्रयुक्त है और बड़ी संख्या का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπηρώτα
  choice: पूछता रहा
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Τί ὄνομά σοι
  choice: तेरा नाम क्या है?
  rationale: यूनानी मुहावरे का सीधा और स्वाभाविक हिन्दी रूप; प्रसंग के प्रत्यक्ष संबोधन को बनाए रखता है।
- source_word: λέγει αὐτῷ
  choice: उसने उससे कहा
  rationale: ऐतिहासिक वर्तमान को हिन्दी की स्वाभाविक कथा-शैली में भूतकाल से व्यक्त किया गया है; इससे घटनाक्रम स्पष्ट रहता है।
- source_word: Λεγιὼν
  choice: लीजियन
  rationale: इसे सामान्य संज्ञा के रूप में अनूदित करने के बजाय नाम/उपाधि के रूप में लिप्यंतरित किया गया है।
- source_word: ὄνομά μοι
  choice: मेरा नाम ... है
  rationale: यूनानी दत्तिवाचक नाम-वाक्यांश का स्वाभाविक हिन्दी समतुल्य है।
- source_word: ὅτι πολλοί ἐσμεν
  choice: क्योंकि हम बहुत हैं
  rationale: ὅτι द्वारा दिए गए कारण और एकवचन से बहुवचन में अर्थपूर्ण बदलाव—‘मेरा’ से ‘हम’—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: वक्ता के आत्म-संदर्भ में एकवचन से बहुवचन का बदलाव
  choice: “मेरा नाम लीजियन है” और “हम बहुत हैं” दोनों को यथावत रखना
  alternative: तनाव को समतल करके “हमारा नाम लीजियन है” कहना
  rationale: मूल यूनानी में एकवचन आत्म-परिचय और बहुवचन व्याख्या साथ-साथ हैं। यह दुष्टात्माओं की बहुलता से जुड़ा अर्थपूर्ण तनाव है, जिसे अनुवाद में सुलझाया नहीं जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सहज कथा-शैली। यीशु के सीधे संबोधन में ‘तेरा’ प्रसंगानुकूल और स्वाभाविक है। मुख्य पाठ में फुटनोट चिह्न [a] सम्मिलित है।
