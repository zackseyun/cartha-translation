  text: καὶ πολλὰ παθοῦσα ὑπὸ πολλῶν ἰατρῶν καὶ δαπανήσασα τὰ παρ’ αὐτῆς πάντα καὶ μηδὲν ὠφεληθεῖσα ἀλλὰ μᾶλλον εἰς τὸ χεῖρον ἐλθοῦσα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/026.yaml
  text: and after suffering much under many physicians[a], and after spending all that she had and benefiting nothing, but rather becoming worse[b],
translation:
  language: hi
  text: और उसने बहुत-से वैद्यों के हाथों बहुत दुःख सहा था[a] और अपना सब कुछ खर्च कर दिया था[b], फिर भी उसे कुछ लाभ नहीं हुआ था, बल्कि उसकी दशा और भी बिगड़ गई थी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुत-से वैद्यों से” अथवा “बहुत-से वैद्यों के उपचारों के अधीन।” यूनानी वाक्यांश वैद्यों की भूमिका या उनके उपचारों के अधीन उसके होने—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उसके पास की सभी वस्तुएँ,” अर्थात उसके पास जो कुछ था।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ παθοῦσα
  choice: बहुत दुःख सहा था
  rationale: यह भूतकालिक कृदन्त स्त्री के पहले के अनुभव को बताता है; यह चयन πάσχω के वास्तविक कष्ट और मुख्य कथन से पहले की परिस्थिति, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ὑπὸ πολλῶν ἰατρῶν
  choice: बहुत-से वैद्यों के हाथों
  rationale: ὑπό के साथ संबंधकारक यहाँ कर्तृत्व अथवा उपचार के अधीन होने का भाव देता है। यह हिन्दी प्रयोग उस अस्पष्टता को बनाए रखता है कि कष्ट वैद्यों से अथवा उनके उपचारों के दौरान हुआ।
- source_word: δαπανήσασα
  choice: खर्च कर दिया था
  rationale: यह समानान्तर भूतकालिक कृदन्त है। 'खर्च कर दिया था' धन लगा देने का अर्थ स्पष्ट करता है, बिना मूल क्रिया से अधिक अर्थ जोड़ने के।
- source_word: τὰ παρ’ αὐτῆς πάντα
  choice: अपना सब कुछ
  rationale: यह स्वाभाविक हिन्दी में उसके पास उपलब्ध अथवा उसकी अपनी सारी संपत्ति को व्यक्त करता है और πάντα की समग्रता बनाए रखता है।
- source_word: μηδὲν ὠφεληθεῖσα
  choice: उसे कुछ लाभ नहीं हुआ था
  rationale: ὠφελέω का कर्मवाच्य रूप किसी प्रकार की सहायता या लाभ न मिलने को बताता है; यह चयन हिन्दी में स्पष्ट और मूल के निकट है।
- source_word: ἀλλὰ μᾶλλον
  choice: बल्कि
  rationale: यह विरोध और उलटे परिणाम की तीव्रता को संक्षेप में व्यक्त करता है; 'और भी' अगले पद के तुलनात्मक भाव को सामने लाता है।
- source_word: εἰς τὸ χεῖρον ἐλθοῦσα
  choice: उसकी दशा और भी बिगड़ गई थी
  rationale: यह मुहावरा बदतर अवस्था में पहुँचने का अर्थ देता है। चुना हुआ वाक्यांश आधुनिक हिन्दी में स्वाभाविक रूप से क्रमिक गिरावट और परिणामी दशा व्यक्त करता है।
