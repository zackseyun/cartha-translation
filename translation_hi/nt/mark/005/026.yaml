translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। 'वैद्य' प्राचीन परिवेश के चिकित्सकों के लिए सामान्य पाठक को समझ आने वाला शब्द है। पद अगले वाक्य से जुड़ा है, इसलिए अंत में अल्पविराम रखा गया है।
