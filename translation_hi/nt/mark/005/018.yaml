  text: καὶ ⸀ἐμβαίνοντος αὐτοῦ εἰς τὸ πλοῖον παρεκάλει αὐτὸν ὁ δαιμονισθεὶς ἵνα ⸂μετ’ αὐτοῦ ᾖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/018.yaml
  text: And as he was getting into the boat[a], the man who had been demon-possessed kept begging him that he might be with him.
translation:
  language: hi
  text: जब वह नाव पर चढ़ रहा था, तब वह व्यक्ति, जो दुष्टात्मा-ग्रस्त था, उससे विनती करता रहा कि वह उसके साथ रह सके।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβαίνοντος αὐτοῦ
  choice: जब वह नाव पर चढ़ रहा था
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रही प्रक्रिया को व्यक्त करता है; यह अनुवाद नाव में चढ़ने की जारी क्रिया का कालगत भाव बनाए रखता है।
- source_word: πλοῖον
  choice: नाव
  rationale: गलील झील के प्रसंग में आधुनिक हिन्दी का स्वाभाविक शब्द ‘नाव’ है; ‘जहाज़’ अनावश्यक रूप से बड़े जलयान का बोध करा सकता है।
- source_word: παρεκάλει
  choice: बार-बार विनती करने लगा
  rationale: अपूर्ण भूतकाल विनती की जारी अथवा दोहराई गई क्रिया और उसकी आग्रहपूर्णता को व्यक्त करता है।
- source_word: ὁ δαιμονισθείς
  choice: वह व्यक्ति, जो दुष्टात्मा से ग्रस्त रहा था
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत पहले दुष्टात्मा से पीड़ित और अब छुड़ाए जा चुके व्यक्ति की ओर संकेत करता है। ‘रहा था’ कथा के पूर्ववर्ती चरण को स्पष्ट करता है, जबकि ‘दुष्टात्मा से ग्रस्त’ मूल पद के व्यक्तिगत दुष्टात्मिक प्रभाव को बनाए रखता है।
- source_word: ἵνα μετ’ αὐτοῦ ᾖ
  choice: कि वह उसके साथ रह सके
  rationale: ἵνα और संभावनार्थक क्रिया विनती की विषय-वस्तु व्यक्त करते हैं। यह रूप साथ रहने के व्यक्तिगत और संबंधपरक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: δαιμονισθείς को इस प्रकार व्यक्त करना कि वास्तविक दुष्टात्मिक अधीनता प्रकट हो, पर आधुनिक चिकित्सकीय या केवल रूपकात्मक अर्थ न जोड़ा जाए
  choice: दुष्टात्मा से ग्रस्त रहा था
  alternative: दुष्टात्मा के वश में रहा था
  rationale: ‘दुष्टात्मा से ग्रस्त’ सामान्य हिन्दी पाठकों के लिए स्पष्ट और प्रचलित है तथा सुसमाचार के वर्णन में वास्तविक दुष्टात्मिक प्रभाव को व्यक्त करता है। ‘के वश में’ भी संभव है, पर मूल पद की स्थापित अभिव्यक्ति से कुछ अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वह’ और ‘उसके’ की सर्वनामिक रचना मूल यूनानी की संरचना तथा उसके सीमित संदर्भगत अस्पष्टता को बनाए रखती है; संदर्भ से पहला सर्वनाम उस व्यक्ति और दूसरा यीशु की ओर संकेत करता है।
