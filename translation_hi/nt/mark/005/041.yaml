source:
  edition: SBLGNT
  text: καὶ κρατήσας τῆς χειρὸς τοῦ παιδίου λέγει αὐτῇ· Ταλιθα ⸀κουμ, ὅ ἐστιν μεθερμηνευόμενον· Τὸ κοράσιον, σοὶ λέγω, ⸀ἔγειρε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/041.yaml
  text: And taking the child's hand[a], he says to her, “Talitha koum,” which is translated, “Little girl, I say to you, get up.”
translation:
  language: hi
  text: और बच्ची का हाथ पकड़कर वह उससे कहता है, “तलीथा कूम”[a], जिसका अनुवाद है, “छोटी बच्ची, मैं तुझसे कहता हूँ, उठ जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ परंपरागत लिप्यंतरणों में अरामी वाक्यांश को “तलीथा कुम” लिखा जाता है; यहाँ यूनानी पाठ के κουμ को अधिक सीधे दर्शाने के लिए “तलीथा कूम” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρατήσας τῆς χειρὸς τοῦ παιδίου
  choice: बच्ची का हाथ पकड़कर
  rationale: κρατέω के साथ संबंधकारक पद हाथ थामने या पकड़ने की ठोस क्रिया व्यक्त करता है। संदर्भ से बालक स्त्रीलिंग है, इसलिए स्वाभाविक हिन्दी में ‘बच्ची’ रखा गया है; ‘पकड़कर’ क्रिया की शक्ति को बिना अनावश्यक कठोरता के व्यक्त करता है।
- source_word: λέγει αὐτῇ
  choice: वह उससे कहता है
  rationale: मरकुस के ऐतिहासिक वर्तमान को बनाए रखने के लिए वर्तमानकाल ‘कहता है’ रखा गया है, जिससे वर्णन की सजीवता बनी रहती है।
- source_word: Ταλιθα κουμ
  choice: तलीता कूम
  rationale: स्रोत पाठ यीशु के अरामी शब्दों को सुरक्षित रखकर स्वयं उनका अनुवाद देता है। देवनागरी लिप्यंतरण ‘तलीता कूम’ यूनानी κουμ के स्वरूप को दर्शाता है।
- source_word: μεθερμηνευόμενον
  choice: जिसका अनुवाद है
  rationale: यह शब्द अरामी कथन के अनुवाद अथवा अर्थ-स्पष्टीकरण का स्पष्ट संकेत देता है; आधुनिक हिन्दी में यह सीधा और स्वाभाविक है।
- source_word: Τὸ κοράσιον
  choice: छोटी बच्ची
  rationale: κοράσιον एक कम आयु की लड़की को सूचित करने वाला लघुतासूचक शब्द है। ‘छोटी बच्ची’ उम्र और स्नेहपूर्ण संबोधन दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: σοὶ λέγω
  choice: मैं तुझसे कहता हूँ
  rationale: यूनानी में बलपूर्वक उपस्थित σοὶ को छोड़ा नहीं गया है। प्रत्यक्ष, व्यक्तिगत संबोधन के लिए ‘तुझसे’ स्वाभाविक है और यहाँ अनादर व्यक्त नहीं करता।
- source_word: ἔγειρε
  choice: उठ जा
  rationale: ἐγείρω का आज्ञार्थक रूप यहाँ उठ खड़े होने या जाग उठने की आज्ञा देता है। ‘उठ जा’ बोलचाल की स्पष्ट, स्वाभाविक और संदर्भानुकूल हिन्दी है।
theological_decisions:
- issue: यीशु के अरामी शब्दों को मुख्य पाठ में बनाए रखना
  choice: ‘तलीता कूम’ का लिप्यंतरण रखा गया है और उसके तुरंत बाद मरकुस का दिया हुआ अनुवाद भी रखा गया है।
  alternative: 'केवल हिन्दी अर्थ देना: ‘छोटी बच्ची, मैं तुझसे कहता हूँ, उठ जा।’'
  rationale: यूनानी स्रोत स्वयं अरामी कथन को सुरक्षित रखता और फिर उसका अर्थ बताता है। दोनों को रखना वर्णन की विशिष्ट बनावट को सुरक्षित रखता है और अर्थ भी स्पष्ट करता है।
- issue: σοὶ के व्यक्तिगत बल को व्यक्त करना
  choice: ‘मैं तुझसे कहता हूँ’
  alternative: ‘मैं कहता हूँ’ अथवा केवल ‘उठ जा’
  rationale: मूल पाठ में स्पष्ट रूप से उपस्थित ‘तुझसे’ को बनाए रखने से आज्ञा का व्यक्तिगत संबोधन सुरक्षित रहता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, सजीव कथात्मक वर्तमान और गरिमापूर्ण किंतु सहज प्रत्यक्ष वचन अपनाया गया है। ‘तुझसे’ आयु में छोटी बच्ची के प्रति निकट, व्यक्तिगत संबोधन है; इसे अपमानसूचक न समझा जाए। फुटनोट चिह्न वाक्य के अंत में रखा गया है क्योंकि टिप्पणी अरामी वाक्यांश के लिप्यंतरण से संबंधित है।
