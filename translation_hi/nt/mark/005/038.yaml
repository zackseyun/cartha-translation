  text: καὶ ⸀ἔρχονται εἰς τὸν οἶκον τοῦ ἀρχισυναγώγου, καὶ θεωρεῖ θόρυβον ⸀καὶ κλαίοντας καὶ ἀλαλάζοντας πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/038.yaml
  text: And they come to the house of the synagogue leader[a], and he sees a commotion, and people weeping and wailing loudly.
translation:
  language: hi
  text: और वे आराधनालय के प्रधान के घर आते हैं। वह देखता है कि वहाँ कोलाहल[a] मचा है और लोग रो रहे हैं और ज़ोर-ज़ोर से विलाप कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हंगामा”; यूनानी शब्द शोर-शराबे वाली अव्यवस्था या भारी हलचल को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: आते हैं
  rationale: ऐतिहासिक वर्तमान काल को बनाए रखता है और घटनाक्रम को सजीव बनाता है।
- source_word: οἶκον
  choice: घर
  rationale: οἶκος का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἀρχισυναγώγου
  choice: आराधनालय के प्रधान
  rationale: यह पद आराधनालय के नेतृत्व या अध्यक्षता करने वाले अधिकारी को सूचित करता है; यह अनुवाद भूमिका को स्पष्ट और संक्षिप्त रखता है।
- source_word: θεωρεῖ
  choice: वह देखता है
  rationale: एकवचन क्रिया का संदर्भ प्रसंग में यीशु से है; ‘देखता है’ सरल और प्रत्यक्ष है।
- source_word: θόρυβον
  choice: कोलाहल
  rationale: यह शब्द केवल ध्वनि नहीं, बल्कि शोक से जुड़े शोर और हलचल को व्यक्त करता है।
- source_word: κλαίοντας
  choice: लोग रो रहे हैं
  rationale: कृदंत यहाँ लोगों की जारी क्रिया का वर्णन करता है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘लोग’ व्यक्त किया गया है।
- source_word: ἀλαλάζοντας πολλά
  choice: ज़ोर-ज़ोर से विलाप कर रहे हैं
  rationale: ἀλαλάζω ऊँची आवाज़ में शोकपूर्ण पुकार को और πολλά उसकी तीव्रता को व्यक्त करता है; यह वाक्यांश दोनों भावों को स्वाभाविक हिन्दी में रखता है।
