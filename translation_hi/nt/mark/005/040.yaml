base_translation:
  language: en
  yaml_path: translation/nt/mark/005/040.yaml
  text: And they were laughing at him[a]. But he, after putting them all outside, takes the child's father and mother and those with him[b], and goes in where the child was.
translation:
  language: hi
  text: और वे उस पर हँस रहे थे[a]। परन्तु वह सबको बाहर निकालकर बच्ची के पिता और माता को, और जो उसके साथ थे उन्हें, अपने साथ लेता है और जहाँ बच्ची थी वहाँ भीतर जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका उपहास कर रहे थे।” यूनानी क्रिया उपहासपूर्ण ढंग से हँसने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεγέλων
  choice: उस पर हँस रहे थे
  rationale: अपूर्ण काल चल रही या बार-बार हो रही उपहासपूर्ण हँसी को व्यक्त करता है; यह हिन्दी में स्वाभाविक भी है और क्रिया के मूल अर्थ को बनाए रखता है।
- source_word: ἐκβαλὼν πάντας
  choice: सबको बाहर निकालकर
  rationale: पूर्वकालिक कृदन्त पहले हुई कार्रवाई दिखाता है। ‘बाहर निकालकर’ स्वाभाविक है और प्रसंग में लोगों को स्थान से बाहर करने का अर्थ देता है।
- source_word: παραλαμβάνει
  choice: साथ लेता है
  rationale: ऐतिहासिक वर्तमान को बनाए रखते हुए παραλαμβάνω के किसी को अपने साथ लेने के भाव को स्पष्ट करता है।
- source_word: παιδίου / παιδίον
  choice: बच्ची
  rationale: पैदीओन व्याकरणिक रूप से नपुंसकलिंग और अर्थतः ‘बच्चा’ है, पर निकटवर्ती स्पष्ट प्रसंग में यह याईर की बेटी को सूचित करता है; हिन्दी में ‘बच्ची’ स्वाभाविक और संदर्भानुकूल है।
- source_word: τοὺς μετ’ αὐτοῦ
  choice: अपने साथ वालों को
  rationale: यूनानी अभिव्यक्ति की अनिर्दिष्टता को मुख्य पाठ में बनाए रखता है; प्रसंग से इनका संकेत साथ आए शिष्यों की ओर है।
- source_word: εἰσπορεύεται
  choice: भीतर जाता है
  rationale: ऐतिहासिक वर्तमान और स्थान के भीतर प्रवेश करने की गति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅπου ἦν τὸ παιδίον
  choice: जहाँ बच्ची थी
  rationale: मूल पाठ केवल स्थान बताता है; ‘पड़ी थी’ जैसी प्रसंग-संगत परन्तु अव्यक्त सूचना नहीं जोड़ी गई।
theological_decisions:
- issue: कथात्मक काल और सजीवता
  choice: मुख्य क्रियाओं ‘साथ लेता है’ और ‘भीतर जाता है’ में ऐतिहासिक वर्तमान बनाए रखा गया
  alternative: 'पूरे वाक्य को सामान्य भूतकाल में देना: ‘साथ लिया’ और ‘भीतर गया’'
  rationale: मरकुस की कथा-शैली में ऐतिहासिक वर्तमान घटनाओं को सजीव बनाता है; आधुनिक हिन्दी में भी यह कथात्मक प्रयोग बोधगम्य है।
- issue: παιδίον का लिंग-संदर्भ
  choice: ‘बच्ची’
  alternative: ‘बच्चा’ या ‘बालक’
  rationale: शब्द अपने आप में लिंग-निरपेक्ष है, किन्तु इस प्रसंग में संदर्भित संतान स्पष्ट रूप से बेटी है। हिन्दी में ‘बच्चा’ पुल्लिंग-सदृश सुनाई पड़ सकता है, इसलिए संदर्भ-सटीक स्वाभाविक रूप चुना गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘परन्तु’ विरोध को स्पष्ट करता है; ऐतिहासिक वर्तमान मूल यूनानी की कथात्मक सजीवता बनाए रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
