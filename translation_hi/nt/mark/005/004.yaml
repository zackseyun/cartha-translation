source:
  edition: SBLGNT
  text: διὰ τὸ αὐτὸν πολλάκις πέδαις καὶ ἁλύσεσι δεδέσθαι καὶ διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις καὶ τὰς πέδας συντετρῖφθαι, καὶ οὐδεὶς ⸂ἴσχυεν αὐτὸν⸃ δαμάσαι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/004.yaml
  text: because he had often been bound with shackles and chains[a], and the chains had been torn apart by him and the shackles smashed to pieces, and no one was strong enough to subdue him.
translation:
  language: hi
  text: क्योंकि उसे कई बार बेड़ियों और ज़ंजीरों से बाँधा गया था, और उसने ज़ंजीरों को तोड़ दिया था और बेड़ियों को चकनाचूर कर दिया था, और कोई भी इतना शक्तिशाली नहीं था कि उसे काबू में कर सके।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे वश में कर सके।” यूनानी क्रिया का अर्थ “पालतू बनाना” अथवा अधिक व्यापक रूप से “वश में करना” या “नियंत्रण में लाना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τὸ αὐτὸν
  choice: क्योंकि उसे ... बाँधा गया था
  rationale: διά के साथ articular infinitive पिछले कथन का कारण बताता है। हिन्दी में कर्मवाच्य रचना मूल यूनानी के ‘उसे बाँधा गया था’ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: πολλάκις
  choice: कई बार
  rationale: बार-बार हुई घटना को सहज और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: πέδαις
  choice: बेड़ियों
  rationale: πέδη विशेष रूप से पैरों में लगाए जाने वाले बंधन को दर्शाता है; ‘बेड़ियाँ’ इसे ज़ंजीरों से अलग रखते हुए सटीक और सुबोध है।
- source_word: ἁλύσεσι / τὰς ἁλύσεις
  choice: ज़ंजीरों / ज़ंजीरों को
  rationale: ἅλυσις सामान्यतः chain को दर्शाता है। ‘ज़ंजीर’ πέδαις के लिए प्रयुक्त ‘बेड़ियों’ से इसका भेद बनाए रखती है।
- source_word: δεδέσθαι
  choice: बाँधा गया था
  rationale: पूर्ण infinitive पहले से किए गए बंधन और उसके परिणामी बँधे होने की अवस्था को सूचित करता है; हिन्दी भूतकालीन कर्मवाच्य इसे स्पष्ट करता है।
- source_word: διεσπάσθαι ὑπ’ αὐτοῦ τὰς ἁλύσεις
  choice: उसने ज़ंजीरों को तोड़ डाला
  rationale: διασπάω हिंसापूर्वक अलग तोड़ने का भाव देता है। सक्रिय हिन्दी वाक्य ‘उसने’ ὑπ’ αὐτοῦ की कर्तृता को स्वाभाविक और स्पष्ट रखता है।
- source_word: τὰς πέδας συντετρῖφθαι
  choice: बेड़ियों को चकनाचूर कर दिया था
  rationale: συντρίβω कुचलकर या टुकड़े-टुकड़े करके तोड़ने का प्रबल भाव रखता है; ‘चकनाचूर’ उस तीव्रता को संक्षिप्त रूप में व्यक्त करता है।
- source_word: οὐδεὶς ἴσχυεν
  choice: कोई भी इतना शक्तिशाली नहीं था
  rationale: ἰσχύω केवल सामान्य सामर्थ्य नहीं, बल या ताकत पर भी जोर देता है; यह अनुवाद उस अर्थ-छाया को बनाए रखता है।
- source_word: δαμάσαι
  choice: काबू में कर सके
  rationale: δαμάζω का अर्थ वश में करना, नियंत्रित करना या पालतू बनाना हो सकता है। मनुष्य के इस प्रसंग में ‘काबू में करना’ स्वाभाविक है और पशु-प्रशिक्षण का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: मनुष्य की दशा और असाधारण शक्ति का कारण
  choice: पद केवल उसे बाँधने के बार-बार विफल हुए प्रयास और उसे काबू में न कर पाने का वर्णन करता है।
  alternative: भाषा में सीधे ‘दुष्टात्मा की शक्ति’ जोड़कर कारण को स्पष्ट करना।
  rationale: यूनानी पाठ इस पद में असाधारण शक्ति और असफल नियंत्रण का वर्णन करता है, पर स्वयं इस वाक्य में उसका कारण नहीं खोलता। इसलिए अनुवाद आसपास की कथा से संगत रहते हुए कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: δαμάσαι में ‘पालतू बनाने’ और ‘वश में करने’ की अर्थ-सीमा
  choice: मुख्य पाठ में ‘काबू में कर सके’
  alternative: ‘वश में कर सके’ या ‘पालतू बना सके’
  rationale: ‘काबू में करना’ प्रसंगानुकूल व्यापक अर्थ देता है, जबकि ‘पालतू बनाना’ मनुष्य के संदर्भ में अनचाहा पशु-संबंधी भाव पैदा कर सकता है। पादटिप्पणी यूनानी क्रिया की व्यापक अर्थ-सीमा बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘बेड़ियों’ और ‘ज़ंजीरों’ द्वारा यूनानी के दो अलग बंधन-शब्दों का भेद सुरक्षित है। ‘चकनाचूर’ असाधारण बल का सजीव वर्णन करता है, पर पद में उसके कारण की अतिरिक्त व्याख्या नहीं जोड़ता।
