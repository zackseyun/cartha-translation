base_translation:
  language: en
  yaml_path: translation/nt/mark/005/043.yaml
  text: And he strictly ordered them that no one should know this[c][b][a], and he said that she should be given something to eat.
translation:
  language: hi
  text: उसने उन्हें सख्ती से आदेश दिया कि यह बात किसी को मालूम न हो,[a] और कहा कि उसे कुछ खाने को दिया जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उन्हें बार-बार कड़ा आदेश दिया” या “उन्हें बहुत सख्ती से चेतावनी दी।” यूनानी में तीव्रता बढ़ाने वाला शब्द है, जिसका शाब्दिक अर्थ “बहुत” या “अनेक” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “उसे खाने के लिए दिया जाए।” क्या दिया जाए, यह स्पष्ट नहीं कहा गया है; “कुछ” हिन्दी में स्वाभाविक रूप से निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διεστείλατο αὐτοῖς πολλὰ
  choice: उसने उन्हें कड़ी आज्ञा दी
  rationale: διαστέλλομαι यहाँ प्रबल आदेश या चेतावनी देता है, और πολλά उसकी तीव्रता बढ़ाता है। संयुक्त अनुवाद स्वाभाविक हिन्दी में इस बल को व्यक्त करता है।
- source_word: ἵνα μηδεὶς γνοῖ τοῦτο
  choice: कि यह बात किसी को मालूम न हो
  rationale: ἵνα और संभावनार्थक क्रिया आदेश के अभिप्रेत परिणाम को व्यक्त करते हैं। हिन्दी में यह निषेधात्मक आशय स्पष्ट और स्वाभाविक है।
- source_word: εἶπεν
  choice: कहा
  rationale: सरल अर्थ 'कहा' रखा गया है; प्रसंग से कथन का निर्देशात्मक बल स्पष्ट हो जाता है।
- source_word: δοθῆναι αὐτῇ φαγεῖν
  choice: उसे कुछ खाने को दिया जाए
  rationale: δοθῆναι के कर्मवाच्य को 'दिया जाए' से सुरक्षित रखा गया है। 'कुछ' यूनानी में व्यक्त नहीं है, पर हिन्दी मुहावरे में φαγεῖν के निहित खाद्य-पदार्थ को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: यीशु की आज्ञा का गोपनीयता-संबंधी आशय
  choice: घटना को किसी पर प्रकट न होने देने की कड़ी आज्ञा के रूप में अनुवाद
  alternative: मरकुस के व्यापक 'मसीही रहस्य' विषय की व्याख्या को पद में जोड़ना
  rationale: मूल पाठ केवल कड़ी आज्ञा और उसके उद्देश्य को बताता है; उसके व्यापक धर्मवैज्ञानिक कारण को स्पष्ट नहीं करता। इसलिए तनाव और संक्षिप्तता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है। 'कड़ी आज्ञा' मूल आदेश की प्रबलता रखता है, जबकि दूसरे खंड में कर्मवाच्य संरचना सुरक्षित है।
