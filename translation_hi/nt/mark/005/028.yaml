  text: ἔλεγεν γὰρ ὅτι ⸂Ἐὰν ἅψωμαι κἂν τῶν ἱματίων αὐτοῦ⸃ σωθήσομαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/028.yaml
  text: For she was saying[a], "If I touch even his garments, I will be healed."
translation:
  language: hi
  text: क्योंकि वह कहती थी, “यदि मैं उसके कपड़ों को ही छू लूँ, तो ठीक हो जाऊँगी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ है, “बचाई जाऊँगी।” यहाँ प्रयुक्त क्रिया का अर्थ “बचाया जाना,” “चंगा होना” या “स्वस्थ हो जाना” हो सकता है; इस प्रसंग में इसका संकेत शारीरिक चंगाई की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: वह कहती थी
  rationale: अपूर्ण काल भूतकाल में जारी या बार-बार होने वाली बात/सोच को दर्शाता है; यह अनुवाद उस पक्ष को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद में किए गए कार्य का कारण बताता है; हिन्दी कथा में ‘क्योंकि’ स्पष्ट और स्वाभाविक संबंधसूचक है।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के रूप में उद्धरण-चिह्न
  rationale: यह उसके कथन या विचार की विषयवस्तु प्रस्तुत करता है; हिन्दी में प्रत्यक्ष उद्धरण स्वाभाविक है।
- source_word: ἐὰν ἅψωμαι
  choice: यदि मैं … छू लूँ
  rationale: शर्तसूचक ἐὰν और संभावनार्थक क्रिया को ‘यदि … छू लूँ’ स्वाभाविक हिन्दी में ठीक व्यक्त करता है।
- source_word: κἂν
  choice: ही
  rationale: यहाँ καὶ ἐάν का संक्षिप्त रूप न्यूनतम कार्य पर बल देता है—‘बस/केवल छू लेना’; ‘ही’ उस बल को सहज हिन्दी में प्रकट करता है।
- source_word: τῶν ἱματίων αὐτοῦ
  choice: उसके कपड़ों को
  rationale: ἱμάτια बहुवचन में सामान्यतः वस्त्र या कपड़े हैं। ‘कपड़ों’ आधुनिक, साधारण और सटीक हिन्दी है; किसी खास चोगे का संकेत देना आवश्यकता से अधिक विशिष्ट होगा।
- source_word: σωθήσομαι
  choice: चंगी हो जाऊँगी
  rationale: इस रक्तस्राव-चंगाई के प्रसंग में σῴζω शारीरिक रूप से स्वस्थ होने का अर्थ देता है। व्यापक ‘बचाई जाऊँगी’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: चंगाई के प्रसंग में σωθήσομαι का अनुवाद
  choice: चंगी हो जाऊँगी
  alternative: बचा ली जाऊँगी / स्वस्थ हो जाऊँगी
  rationale: तात्कालिक प्रसंग स्त्री की शारीरिक चंगाई की आशा है, इसलिए मुख्य पाठ में ‘चंगी हो जाऊँगी’ सर्वाधिक स्पष्ट है। फिर भी यूनानी क्रिया में ‘बचाए जाने’ का व्यापक अर्थ भी संभव है; इस अर्थगत और धर्मवैचारिक तनाव को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘कपड़ों’ को अधिक प्रचलित और स्वाभाविक होने के कारण ‘वस्त्रों’ पर प्राथमिकता दी गई है। पादटिप्पणी-चिह्न संबंधित कथन के अंत में रखा गया है।
