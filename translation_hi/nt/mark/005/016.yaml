  text: ⸂καὶ διηγήσαντο⸃ αὐτοῖς οἱ ἰδόντες πῶς ἐγένετο τῷ δαιμονιζομένῳ καὶ περὶ τῶν χοίρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/016.yaml
  text: And those who had seen it told them how it had happened to the demon-possessed man[a], and about the pigs.
translation:
  language: hi
  text: जिन लोगों ने यह देखा था, उन्होंने उन्हें बताया कि दुष्टात्मा से ग्रस्त उस मनुष्य के साथ यह सब कैसे हुआ था और सूअरों के बारे में भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διηγήσαντο
  choice: बताया
  rationale: यह क्रिया किसी घटना का क्रमपूर्वक वर्णन करने या उसे सुनाने का भाव रखती है। यहाँ सरल और स्वाभाविक हिन्दी में ‘बताया’ उपयुक्त है; वाक्य का शेष भाग विवरण की विषयवस्तु स्पष्ट करता है।
- source_word: οἱ ἰδόντες
  choice: जिन लोगों ने यह देखा था
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत घटना को देखने वाले लोगों को दर्शाता है। यह अनुवाद उनके प्रत्यक्षदर्शी होने का भाव रखता है, पर मुख्य पाठ में अधिक व्याख्यात्मक ‘प्रत्यक्षदर्शी’ शब्द नहीं जोड़ता।
- source_word: πῶς ἐγένετο
  choice: यह सब कैसे हुआ था
  rationale: πῶς घटना के ढंग या क्रम की ओर संकेत करता है। पूर्वकालिक कथानक-संबंध को ‘हुआ था’ व्यक्त करता है, और ‘यह सब’ हिन्दी में संदर्भित घटना को स्वाभाविक रूप से जोड़ता है।
- source_word: τῷ δαιμονιζομένῳ
  choice: दुष्टात्मा से ग्रस्त उस मनुष्य
  rationale: यह कृदंत दुष्टात्मिक प्रभाव या वश में होने की दशा वाले व्यक्ति को सूचित करता है। ‘दुष्टात्मा से ग्रस्त’ आधुनिक हिन्दी में स्पष्ट है और व्यक्ति को केवल एक लेबल में सीमित नहीं करता।
- source_word: περὶ τῶν χοίρων
  choice: सूअरों के बारे में
  rationale: περί के साथ संबंधकारक का अर्थ ‘के बारे में’ है। χοῖροι के लिए ‘सूअर’ सामान्य, वर्तमान हिन्दी का स्वाभाविक शब्द है।
theological_decisions:
- issue: δαιμονιζομένῳ का अनुवाद और दुष्टात्मिक पीड़ा का स्वरूप
  choice: दुष्टात्मा से ग्रस्त उस मनुष्य
  alternative: दुष्टात्मा के वश में रहे उस मनुष्य
  rationale: मरकुस का कथानक दुष्टात्मिक पीड़ा को वास्तविक रूप में प्रस्तुत करता है। चुना गया अनुवाद इसे केवल मनोवैज्ञानिक अवस्था बनाकर नहीं दिखाता, फिर भी यूनानी कृदंत से आगे बढ़कर किसी विशेष दार्शनिक या संप्रदायगत सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दुष्टात्मा से ग्रस्त’ सामान्य पाठक के लिए स्पष्ट है; ‘प्रेतग्रस्त’ या ‘दुष्टात्माग्रस्त’ की अपेक्षा यह अधिक स्वाभाविक और कम तकनीकी है।
