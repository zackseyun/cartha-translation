- source_word: Βλέπεις
  choice: आप देख रहे हैं
  rationale: वर्तमानकालीन प्रत्यक्ष कथन को आदरसूचक और स्वाभाविक हिन्दी में व्यक्त करता है तथा सामने की स्पष्ट स्थिति पर बल बनाए रखता है।
- source_word: ὄχλον
  choice: भीड़
  rationale: आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल शब्द।
- source_word: συνθλίβοντά
  choice: चारों ओर से दबा रही है
  rationale: यह कृदन्त यीशु के चारों ओर भीड़ के शारीरिक दबाव और सघनता को व्यक्त करता है; यह रूप ‘कुचल रही है’ जितना अतिरंजित हुए बिना अर्थ संप्रेषित करता है।
- source_word: λέγεις
  choice: आप कहते हैं
  rationale: यूनानी वर्तमानकाल को चेलों की विस्मयभरी आपत्ति में स्वाभाविक हिन्दी के सामान्य वर्तमान से व्यक्त किया गया है।
- source_word: Τίς μου ἥψατο
  choice: मुझे किसने छुआ?
  rationale: ἅπτομαι यहाँ किसी अभी-अभी हुई विशिष्ट छुअन को बताता है; हिन्दी में ‘मुझे छुआ’ इसका सीधा और स्वाभाविक रूप है।
- source_word: μου
  choice: मुझे
  rationale: ἅπτομαι के साथ आए यूनानी संबंधकारक का हिन्दी में स्वाभाविक कर्मरूप ‘मुझे’ है।
