- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार कही जा रही बात को दर्शाता है; ‘कह रहे थे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μαθηταὶ
