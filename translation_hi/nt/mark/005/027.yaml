translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। दोनों यूनानी कृदंतों के क्रम को ‘सुनकर … आई’ से रखा गया है; मुख्य घटना ‘छुआ’ पर वाक्य का बल बना रहता है। सर्वनामों का निकटतम और प्रसंगगत संकेत यीशु है।
