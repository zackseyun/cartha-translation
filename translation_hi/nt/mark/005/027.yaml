  yaml_path: translation/nt/mark/005/027.yaml
  text: having heard about Jesus[a], she came up behind him in the crowd and touched his garment.
translation:
  language: hi
  text: वह यीशु के विषय में सुनकर भीड़ में उसके पीछे से आई और उसके वस्त्र[a] को छुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ओढ़ने के कपड़े’ अथवा ‘पहनावे’। यूनानी शब्द ἱμάτιον सामान्य रूप से किसी वस्त्र को, और प्रायः बाहरी वस्त्र को, दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσασα
  choice: सुनकर
  rationale: स्त्रीलिंग एकवचन एओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया बताता है। ‘सुनकर’ हिन्दी में इस क्रम को स्वाभाविक और संक्षिप्त रूप से बनाए रखता है।
- source_word: περὶ τοῦ Ἰησοῦ
  choice: यीशु के विषय में
  rationale: सम्बन्धकारक के साथ περί का अर्थ यहाँ यीशु के बारे में मिली जानकारी है। ‘के विषय में’ सटीक, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: ἐλθοῦσα
  choice: आई
  rationale: स्त्रीलिंग एकवचन एओरिस्ट कृदंत उसके यीशु के पीछे से पहुँचने की गति बताता है। हिन्दी वाक्य-प्रवाह में इसे समापिका क्रिया ‘आई’ और अगली मुख्य क्रिया से ‘और’ द्वारा जोड़ना स्वाभाविक है।
- source_word: ἐν τῷ ὄχλῳ
  choice: भीड़ में
  rationale: ἐν और सम्प्रदान कारक यहाँ स्थान अथवा आसपास की परिस्थिति व्यक्त करते हैं; ‘भीड़ में’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ὄπισθεν
  choice: उसके पीछे से
  rationale: यह पीछे की ओर से आने की स्थिति या दिशा बताता है। प्रसंग के अनुसार ‘उसके’ का संकेत यीशु की ओर है, जबकि ‘से’ पीछे की दिशा से पास आने को व्यक्त करता है।
- source_word: ἥψατο
  choice: छुआ
  rationale: इस प्रसंग में ἅπτω का मध्यम एओरिस्ट रूप स्पर्श करने को दर्शाता है। ‘छुआ’ अनावश्यक रूप से पकड़ने या देर तक थामे रहने का भाव नहीं जोड़ता।
- source_word: τοῦ ἱματίου αὐτοῦ
  choice: उसके वस्त्र
  rationale: ἱμάτιον किसी पहनावे, प्रायः बाहरी वस्त्र, को दर्शाता है। ‘वस्त्र’ यूनानी शब्द की व्यापकता और एकवचन को बनाए रखता है।
