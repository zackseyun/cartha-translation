  text: And he begged him repeatedly not to send them out of the region[a].
translation:
  language: hi
  text: और वह उससे बार-बार विनती करता रहा कि वह उन्हें उस क्षेत्र से बाहर न भेजे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वह उससे बहुत विनती करता रहा कि वह उन्हें उस इलाके के बाहर न भेजे।’
    reason: πολλὰ के प्रबलता-सूचक अर्थ और χώρα के वैकल्पिक स्वाभाविक अनुवाद को दिखाने के लिए।
lexical_decisions:
- source_word: παρεκάλει
  choice: विनती करता रहा
  rationale: इस भूत-निष्कासन प्रसंग में क्रिया आग्रहपूर्ण याचना व्यक्त करती है; अपूर्णकाल के निरंतर भाव को ‘करता रहा’ स्वाभाविक रूप से दिखाता है।
- source_word: πολλὰ
  choice: बार-बार
  rationale: क्रिया-विशेषण रूप में यह विनती की प्रबलता या पुनरावृत्ति दर्शाता है; यहाँ ‘बार-बार’ सहज हिन्दी में पुनरावृत्त आग्रह को व्यक्त करता है।
- source_word: ἵνα μὴ
  choice: कि ... न
  rationale: यह विनती की विषयवस्तु को व्यक्त करता है; हिन्दी में ‘कि ... न’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: αὐτὰ
  choice: उन्हें
  rationale: यूनानी सर्वनाम नपुंसकलिंग बहुवचन है और अशुद्ध आत्माओं की बहुलता की ओर संकेत करता है; हिन्दी में सजीव कर्ताओं के लिए ‘उन्हें’ उपयुक्त है।
- source_word: ἀποστείλῃ
  choice: भेजे
  rationale: मूल क्रिया का सीधा अर्थ ‘भेजना’ है; ‘खदेड़े’ जैसी अभिव्यक्ति मूल में निहित न होने वाला बल जोड़ सकती है।
- source_word: ἔξω τῆς χώρας
  choice: उस क्षेत्र से बाहर
  rationale: χώρα यहाँ स्थानीय भूभाग या इलाके को सूचित करता है, आधुनिक राष्ट्र को नहीं; ‘क्षेत्र’ गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट है।
theological_decisions:
- issue: एकवचन क्रियाओं के कर्ता और बहुवचन सर्वनाम के बीच संख्या-परिवर्तन
  choice: एकवचन वक्ता के लिए ‘वह’ और बहुवचन अशुद्ध आत्माओं के लिए ‘उन्हें’ रखा गया है।
  alternative: संख्या-परिवर्तन को सरल बनाकर पूरे कथन को सामूहिक बहुवचन में प्रस्तुत करना।
  rationale: यूनानी पाठ एक प्रवक्ता के एकवचन और अनेक दुष्टात्माओं के बहुवचन के बीच तनाव बनाए रखता है; अनुवाद इसे समरूप बनाकर मिटाता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘विनती करता रहा’ अपूर्णकाल की निरंतरता को और ‘बार-बार’ आग्रह की पुनरावृत्ति को व्यक्त करता है; एकवचन और बहुवचन का मूल तनाव सुरक्षित रखा गया है।
