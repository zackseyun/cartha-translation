  text: καὶ ⸀εὐθὺς ἐξηράνθη ἡ πηγὴ τοῦ αἵματος αὐτῆς, καὶ ἔγνω τῷ σώματι ὅτι ἴαται ἀπὸ τῆς μάστιγος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/029.yaml
  text: And immediately the flow of her blood dried up[b][a], and she knew in her body that she had been healed of the affliction.
translation:
  language: hi
  text: और उसी क्षण उसके रक्तस्राव का स्रोत सूख गया,[a] और उसे अपने शरीर में पता चल गया कि वह उस व्याधि से चंगी हो चुकी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके लहू का सोता सूख गया।” यूनानी में सोते या जल-स्रोत का सजीव बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस कोड़े से” अथवा “उस महामारी से।” यहाँ यह शब्द उसकी पीड़ादायक व्याधि के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: उसी क्षण
  rationale: मरकुस की कथन-शैली की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξηράνθη
  choice: सूख गया
  rationale: मूल क्रिया के निष्क्रिय और सजीव बिंब को बनाए रखता है; केवल ‘रुक गया’ कहना उसके चित्रात्मक प्रभाव को घटा देता।
- source_word: πηγὴ τοῦ αἵματος αὐτῆς
  choice: उसके रक्तस्राव का स्रोत
  rationale: πηγή के ‘सोता/स्रोत’ वाले बिंब को सुरक्षित रखते हुए प्रसंग में चल रहे रक्तस्राव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔγνω τῷ σώματι
  choice: उसे अपने शरीर में पता चल गया
  rationale: ἔγνω के जानने और τῷ σώματι की शारीरिक अनुभूति—दोनों को जोड़ता है, बिना इसे केवल ‘महसूस किया’ तक सीमित किए।
- source_word: ἴαται
  choice: चंगी हो चुकी है
  rationale: यूनानी पूर्णकाल में पूरी हो चुकी चंगाई और उसके बने हुए परिणाम—दोनों को हिन्दी के ‘चुकी है’ से व्यक्त किया गया है।
- source_word: ἀπὸ τῆς μάστιγος
  choice: उस पीड़ा से
  rationale: μάστιξ के शाब्दिक अर्थ ‘कोड़ा’ से निकले गंभीर कष्ट/व्याधि के रूपक को इस प्रसंग में स्पष्ट करता है, जहाँ वास्तविक कोड़े की बात नहीं है।
theological_decisions:
- issue: चंगाई का स्वरूप
  choice: रक्तस्राव के तत्काल रुकने और स्त्री द्वारा वास्तविक शारीरिक चंगाई जान लेने—दोनों को व्यक्त किया गया है।
  alternative: वाक्य को केवल उसकी निजी अनुभूति या आभास के रूप में प्रस्तुत करना।
  rationale: यूनानी पाठ बाहरी शारीरिक परिवर्तन और स्त्री की आंतरिक शारीरिक पहचान दोनों बताता है; अनुवाद किसी अतिरिक्त कारण या प्रक्रिया को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘रक्तस्राव’ प्रसंग को स्पष्ट करता है, जबकि ‘स्रोत सूख गया’ मूल यूनानी का सजीव रूपक बनाए रखता है।
