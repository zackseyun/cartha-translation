id: MRK.5.7
reference: Mark 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κράξας φωνῇ μεγάλῃ ⸀λέγει· Τί ἐμοὶ καὶ σοί, Ἰησοῦ υἱὲ τοῦ θεοῦ τοῦ ὑψίστου; ὁρκίζω σε τὸν θεόν, μή με βασανίσῃς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/007.yaml
  text: And crying out with a loud voice[a], he says, “What have I to do with you, Jesus, Son of the Most High God? I adjure you by God[c][b], do not torment me.”
translation:
  language: hi
  text: और वह ऊँचे स्वर से चिल्लाकर कहता है, “हे यीशु, परमप्रधान परमेश्वर के पुत्र, मेरा तुझसे क्या लेना-देना है?[a] मैं तुझे परमेश्वर की शपथ दिलाता हूँ,[b] मुझे यातना मत दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक मुहावरा: “मुझे और तुझे क्या?” इसका भाव पक्षों के बीच दूरी, विरोध या कोई सरोकार न होने को व्यक्त करता है।'
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर के नाम पर मैं तुझसे विनती करता हूँ,” अथवा “मैं तुझे परमेश्वर के सामने शपथ से बाँधता हूँ।” यूनानी क्रिया गंभीर आग्रह या शपथ दिलाने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κράξας φωνῇ μεγάλῃ
  choice: ऊँचे स्वर से चिल्लाकर
  rationale: यह अनुवाद क्रिया की तीव्रता और ‘बड़े/ऊँचे स्वर से’ वाली दत्तिव अभिव्यक्ति—दोनों को बनाए रखता है और स्वाभाविक हिन्दी भी है।
- source_word: λέγει
  choice: कहता है
  rationale: मरकुस की जीवंत ऐतिहासिक वर्तमान-काल शैली को वर्तमान काल में रखा गया है।
- source_word: Τί ἐμοὶ καὶ σοί
  choice: मेरा तुझसे क्या लेना-देना है?
  rationale: यह सामी मुहावरे के दूरी, असंबंध और विरोध जताने वाले तीखे भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: υἱὲ τοῦ θεοῦ τοῦ ὑψίστου
  choice: परमप्रधान परमेश्वर के पुत्र
  rationale: सम्बोधन और परमेश्वर के लिए प्रयुक्त ‘परमप्रधान’ उपाधि दोनों स्पष्ट रहते हैं; हिन्दी पदक्रम स्वाभाविक है।
- source_word: ὁρκίζω σε τὸν θεόν
  choice: मैं तुझे परमेश्वर की शपथ दिलाता हूँ
  rationale: ‘शपथ दिलाता हूँ’ यूनानी क्रिया के गंभीर, शपथ से बाँधने या दृढ़ आग्रह करने वाले बल को व्यक्त करता है और केवल सामान्य विनती बनाकर उसकी असामान्य तीव्रता को नहीं मिटाता।
- source_word: μή με βασανίσῃς
  choice: मुझे यातना मत दे
  rationale: ‘यातना’ βασανίζω के तीव्र कष्ट देने वाले अर्थ को बिना कष्ट की विधि अनावश्यक रूप से निश्चित किए व्यक्त करती है।
theological_decisions:
- issue: अशुद्ध आत्मा द्वारा यीशु की पहचान
  choice: परमप्रधान परमेश्वर के पुत्र
  alternative: परमप्रधान के पुत्र, परमेश्वर के पुत्र
  rationale: मूल पाठ में व्यक्त पुत्र-संबंध और परमेश्वर की ‘परमप्रधान’ उपाधि को स्पष्ट रखा गया है, पर पद में बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
- issue: अशुद्ध आत्मा का परमेश्वर के नाम पर यीशु को शपथ दिलाना
  choice: मैं तुझे परमेश्वर की शपथ दिलाता हूँ
  alternative: परमेश्वर के नाम पर मैं तुझसे विनती करता हूँ
  rationale: चुना हुआ पाठ उस विस्मयकारी तनाव को सुरक्षित रखता है जिसमें अशुद्ध आत्मा परमेश्वर का नाम लेकर यीशु पर गंभीर आग्रह करती है; इसे साधारण विनती में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। यीशु के लिए ‘तू’ का प्रयोग उद्धृत वक्ता के सीधे, तीखे एकवचन सम्बोधन को व्यक्त करता है; यह अनादर जोड़ने के लिए नहीं, बल्कि दृश्य की निकटता और टकराव बनाए रखने के लिए है।
