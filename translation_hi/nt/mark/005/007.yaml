  terminology: “परमप्रधान परमेश्वर के पुत्र” faithfully preserves both θεὸς ὕψιστος and the filial title. “परमेश्वर की शपथ दिलाता हूँ” appropriately retains the unusual solemn, oath-like appeal rather than reducing it to an ordinary request. Footnotes accurately explain the idiom and the semantic range of ὁρκίζω.
