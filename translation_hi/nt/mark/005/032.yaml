translation:
  language: hi
  text: और वह उस स्त्री को देखने के लिए चारों ओर देखता रहा, जिसने यह किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सामान्य कथात्मक संयोजक; यह बिना किसी अतिरिक्त निष्कर्षात्मक भाव के कथा-प्रवाह बनाए रखता है।
- source_word: περιεβλέπετο
  choice: चारों ओर देखता रहा
  rationale: अपूर्ण भूतकाल का रूप अतीत में जारी क्रिया दर्शाता है; यह अनुवाद आसपास लगातार दृष्टि दौड़ाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἰδεῖν
  choice: देखने के लिए
  rationale: यह उद्देश्य व्यक्त करने वाला अनंत क्रियारूप है; ‘देखने के लिए’ सीधा और स्वाभाविक अनुवाद है।
- source_word: τὴν ... ποιήσασαν
  choice: उस स्त्री को ... जिसने ... किया था
  rationale: मूल यूनानी में संज्ञा व्यक्त नहीं है, पर स्त्रीलिंग लेख और कृदंत किसी स्त्री व्यक्ति को स्पष्ट रूप से सूचित करते हैं। हिन्दी में ‘उस स्त्री’ इस व्याकरणिक सूचना को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: τοῦτο
  choice: यह
  rationale: संकेतवाचक सर्वनाम ठीक पहले वर्णित कार्य की ओर संकेत करता है; ‘यह’ पर्याप्त स्पष्ट है।
