source:
  edition: SBLGNT
  text: καὶ ⸂ἐξελθόντος αὐτοῦ⸃ ἐκ τοῦ πλοίου ⸂εὐθὺς ὑπήντησεν⸃ αὐτῷ ἐκ τῶν μνημείων ἄνθρωπος ἐν πνεύματι ἀκαθάρτῳ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/002.yaml
  text: And when he got out of the boat[a], immediately a man with an unclean spirit came out from the tombs to meet him,
translation:
  language: hi
  text: और जैसे ही वह नाव से उतरा, कब्रों में से अशुद्ध आत्मा से ग्रस्त[a] एक मनुष्य निकलकर उससे मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में अधिक शाब्दिक रूप से, “अशुद्ध आत्मा में” या “अशुद्ध आत्मा के साथ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ ἐκ τοῦ πλοίου
  choice: जैसे ही वह नाव से उतरा
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्वाभाविक कालवाचक उपवाक्य के रूप में व्यक्त किया गया है। अओरिस्ट कृदन्त और εὐθύς के साथ ‘जैसे ही’ घटनाओं की तात्कालिक क्रमबद्धता को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: εὐθὺς
  choice: जैसे ही
  rationale: मरकुस की तीव्र कथात्मक गति को बनाए रखने के लिए इसे अलग से ‘तुरन्त’ कहने के बजाय कालवाचक रचना में समाहित किया गया है।
- source_word: ἐκ τῶν μνημείων
  choice: कब्रों में से
  rationale: μνημεῖον यहाँ दफनाने की कब्र या कब्रगाह को दर्शाता है। बहुवचन और बाहर निकलने की दिशा दोनों को ‘कब्रों में से’ बनाए रखता है।
- source_word: ὑπήντησεν αὐτῷ
  choice: निकलकर उससे मिला
  rationale: ὑπαντάω का मूल अर्थ ‘मिलना/सामना करना’ है। ‘निकलकर’ को ἐκ τῶν μνημείων के साथ जोड़ने से मनुष्य की यीशु की ओर गति स्वाभाविक हिन्दी में स्पष्ट होती है।
- source_word: ἄνθρωπος
  choice: एक मनुष्य
  rationale: संज्ञा पुल्लिंग एकवचन है और प्रसंग में पुरुष व्यक्ति को सूचित करती है; ‘मनुष्य’ dignified और सामान्य हिन्दी है।
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: अशुद्ध आत्मा से ग्रस्त
  rationale: हिन्दी में केवल ‘अशुद्ध आत्मा के साथ’ अस्पष्ट और अस्वाभाविक हो सकता है। ‘से ग्रस्त’ उस दशा/प्रभाव को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी यूनानी की अधिक शाब्दिक रचना सुरक्षित रखती है।
theological_decisions:
- issue: दुष्टात्मिक पीड़ा की भाषा
  choice: अशुद्ध आत्मा से ग्रस्त
  alternative: अशुद्ध आत्मा के साथ / अशुद्ध आत्मा में
  rationale: ‘से ग्रस्त’ आधुनिक हिन्दी में अर्थ को स्पष्ट करता है, पर ‘अधीन’ या किसी अधिक व्यवस्थित दुष्टात्म-विज्ञान संबंधी पद को नहीं जोड़ता। पादटिप्पणी बताती है कि यूनानी अधिक शाब्दिक रूप से ‘अशुद्ध आत्मा में/के साथ’ कहता है, जिससे मूल अभिव्यक्ति का तनाव बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘जैसे ही’ मरकुस की तात्कालिक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
