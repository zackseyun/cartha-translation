  text: ὁ δὲ εἶπεν αὐτῇ· ⸀Θυγάτηρ, ἡ πίστις σου σέσωκέν σε· ὕπαγε εἰς εἰρήνην, καὶ ἴσθι ὑγιὴς ἀπὸ τῆς μάστιγός σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/005/034.yaml
  text: But he said to her[a], “Daughter, your faith has saved you. Go in peace[b], and be well from your affliction.”
translation:
  language: hi
  text: पर उसने उससे कहा, “बेटी, तुम्हारे विश्वास ने तुम्हें बचाया है[a]। शांति से जाओ, और इस पीड़ा से पूरी तरह स्वस्थ रहो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें स्वस्थ किया है” अथवा “तुम्हें चंगा किया है।” यूनानी क्रिया बचाव, उद्धार या चंगाई का अर्थ दे सकती है।
    reason: alternative_reading
  - marker: b
    text: या “भली-चंगी रहो” अथवा “पूरी तरह स्वस्थ रहो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Θυγάτηρ
  choice: बेटी
  rationale: सम्बोधन की कोमलता और पारिवारिक भाव बनाए रखता है तथा यूनानी में न होने वाला ‘मेरी’ नहीं जोड़ता।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ स्त्री के यीशु पर भरोसा करके उनके पास आने को दर्शाता है; ‘विश्वास’ प्रमुख धार्मिक शब्द के साथ संगति भी बनाए रखता है।
- source_word: σέσωκέν
  choice: बचाया है
  rationale: σῴζω के व्यापक अर्थ—बचाना, उद्धार करना और चंगा करना—को खुला रखता है। पूर्णकाल का वर्तमान परिणाम ‘बचाया है’ से व्यक्त होता है, जबकि अगला खंड शारीरिक स्वास्थ्य का अलग उल्लेख करता है।
- source_word: ὕπαγε εἰς εἰρήνην
  choice: शान्ति से जाओ
  rationale: प्रस्थान करते समय शान्ति और कुशल की अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἴσθι ὑγιὴς
  choice: स्वस्थ रहो
  rationale: यह क्रियापद-संरचना स्वस्थ या भली-चंगी अवस्था में बने रहने का भाव देती है; इसलिए इसे केवल घटना के रूप में ‘चंगी हो जाओ’ नहीं बनाया गया।
- source_word: μάστιγός
  choice: पीड़ा
  rationale: मूल शब्द का शाब्दिक अर्थ कोड़ा या मार है, पर यहाँ रूपकतः उस कष्टदायक रोग-दशा को सूचित करता है। ‘पीड़ा’ इस रूपक की तीव्रता को बनाए रखती है।
theological_decisions:
- issue: σῴζω में उद्धार और चंगाई का संबंध
  choice: तुम्हें बचाया है
  alternative: तुम्हें चंगा किया है / तुम्हें स्वस्थ किया है
  rationale: मुख्य पाठ में व्यापक ‘बचाया’ रखने से उद्धार और शारीरिक चंगाई के बीच मूल यूनानी का अर्थगत तनाव बना रहता है; अगले खंड में स्वास्थ्य का स्पष्ट और अलग उल्लेख है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा
  rationale: सन्दर्भ में सक्रिय भरोसा निहित है, पर ‘विश्वास’ मूल धार्मिक पद की व्यापकता और अन्य प्रसंगों से उसकी शब्दगत संगति बनाए रखता है।
- issue: ἴσθι ὑγιὴς की अवस्थात्मक शक्ति
  choice: स्वस्थ रहो
  alternative: चंगी हो जाओ / भली-चंगी रहो
  rationale: ‘रहो’ वर्तमान स्वस्थ अवस्था की निरन्तरता को दर्शाता है और इसे σέσωκέν की पूर्ण क्रिया से अलग रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘बेटी’ की आत्मीयता, ‘विश्वास’ की प्रमुख शब्दावली और ‘बचाया है’ में निहित उद्धार/चंगाई की अर्थगत व्यापकता सुरक्षित रखी गई है। ‘अपनी इस पीड़ा से मुक्त होकर’ ἀπὸ τῆς μάστιγός σου के अलगाव के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
