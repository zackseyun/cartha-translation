  text: καὶ ὑπερπερισσῶς ἐξεπλήσσοντο λέγοντες· Καλῶς πάντα πεποίηκεν, καὶ τοὺς κωφοὺς ποιεῖ ἀκούειν ⸀καὶ ἀλάλους λαλεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/037.yaml
  text: And they were utterly astonished[a], saying, “He has done everything well[b]. He makes even the deaf hear and the mute speak.”
translation:
  language: hi
  text: और वे अत्यन्त विस्मित थे[a] और कह रहे थे, “उसने सब कुछ भली-भाँति किया है। वह बधिरों को सुनने और वाणीहीनों को बोलने की सामर्थ्य देता है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अत्यन्त’ के लिए प्रयुक्त यूनानी शब्द असाधारण तीव्रता व्यक्त करता है; अधिक शाब्दिक भाव है, ‘हद से भी बढ़कर।’
    reason: lexical_alternative
  - marker: b
    text: यह कथन यशायाह 35:5–6 की याद दिलाता है, जहाँ परमेश्वर की पुनर्स्थापना में बहरे सुनते और गूँगे बोलते हैं। ‘उसने सब कुछ भली-भाँति किया है’ परमेश्वर के उत्तम कार्यों से जुड़ी शास्त्रीय भाषा की प्रतिध्वनि भी हो सकती है।
    reason: cross_reference
lexical_decisions:
- source_word: ὑπερπερισσῶς
  choice: अत्यन्त
  rationale: यह असाधारण रूप से तीव्र परिमाण बताने वाला क्रियाविशेषण है। ‘अत्यन्त’ आधुनिक हिन्दी में इसके प्रबल बल को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: ἐξεπλήσσοντο
  choice: चकित हो रहे थे
  rationale: अपूर्णकाल भीड़ की लगातार बनी हुई विस्मय की दशा दिखाता है; ‘चकित हो रहे थे’ इस पक्ष को बनाए रखता है।
- source_word: λέγοντες
  choice: और कह रहे थे
  rationale: वर्तमान कृदन्त भीड़ की प्रतिक्रिया के साथ-साथ कही जा रही बात का परिचय देता है। हिन्दी में समन्वित क्रिया-वाक्य अधिक स्वाभाविक है।
- source_word: Καλῶς
  choice: भली-भाँति
  rationale: यह यीशु के कामों की गुणवत्ता का सकारात्मक मूल्यांकन करता है। ‘भली-भाँति’ ‘अच्छी तरह’ से अधिक गरिमापूर्ण है और संभावित शास्त्रीय प्रतिध्वनि को दबाता नहीं।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ आधुनिक हिन्दी में स्वाभाविक रूप से ‘सब कुछ’ है।
- source_word: πεποίηκεν
  choice: किया है
  rationale: पूर्णकाल पूरे किए गए काम और उसके वर्तमान परिणाम दोनों की ओर संकेत करता है; हिन्दी का ‘किया है’ इसे सहज रूप में व्यक्त करता है।
- source_word: κωφοὺς
  choice: बहरों को
  rationale: इस प्रसंग में शब्द सुनने में असमर्थ लोगों को दर्शाता है; ‘बहरों’ का प्रयोग संक्षिप्त और अर्थ-सटीक है।
- source_word: ποιεῖ ἀκούειν
  choice: सुनने ... योग्य कर देता है
  rationale: ποιεῖ के साथ क्रियार्थक रूप कारणवाचक अर्थ देता है। यह अनुवाद अनुमति नहीं, बल्कि सुन सकने की वास्तविक सामर्थ्य प्रदान किए जाने को स्पष्ट करता है।
- source_word: ἀλάλους
  choice: गूँगों को
  rationale: यह बोलने में असमर्थ लोगों के लिए प्रयुक्त है। ‘गूँगों’ का प्रयोग ‘बहरों’ के समानान्तर, संक्षिप्त और इस चंगाई-प्रसंग में स्पष्ट है।
- source_word: λαλεῖν
  choice: बोलने
  rationale: λαλεῖν का सामान्य अर्थ ‘बोलना’ है, जो यहाँ वाणी लौटने का सीधा वर्णन करता है।
- source_word: καὶ
  choice: भी
  rationale: अंतिम कथन में ‘भी’ चमत्कारों की विस्मयकारी व्यापकता पर बल देता है, पर केवल किसी एक समूह को अनावश्यक रूप से केंद्र में नहीं रखता।
theological_decisions:
- issue: यशायाह 35:5–6 की संभावित प्रतिध्वनि और ‘सब कुछ भली-भाँति किया है’ में परमेश्वर के कार्यों की भाषा
  choice: मुख्य पाठ में भीड़ की बात को सीधे और मूल यूनानी के निकट रखा गया है; शास्त्रीय प्रतिध्वनि पादटिप्पणी में बताई गई है।
  alternative: मुख्य पाठ में यशायाह की पुनर्स्थापना या सृष्टि-वर्णन का संबंध स्पष्ट रूप से जोड़ देना।
  rationale: मूल पाठ संकेत देता है, पर उस संकेत की व्याख्या स्वयं नहीं करता। इसलिए अनुवाद प्रतिध्वनि को सुरक्षित रखता है, पर उसे निश्चित धर्मवैज्ञानिक घोषणा में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘अत्यन्त चकित हो रहे थे’ यूनानी की तीव्रता और अपूर्णकाल दोनों को रखता है। ‘योग्य कर देता है’ कारणवाचक अर्थ को स्पष्ट करता है, जबकि संभावित यशायाही और सृष्टि-संबंधी प्रतिध्वनियों को मुख्य पाठ में बढ़ा-चढ़ाकर नहीं बताया गया।
