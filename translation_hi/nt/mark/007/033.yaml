base_translation:
  language: en
  yaml_path: translation/nt/mark/007/033.yaml
  text: And taking him aside from the crowd privately[a], he put his fingers into his ears, and after spitting[b], he touched his tongue.
translation:
  language: hi
  text: और वह उसे भीड़ से अलग, एकांत में[a] ले गया। फिर उसने अपनी उँगलियाँ उसके कानों में डालीं और थूकने के बाद[b] उसकी जीभ को छुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अलग से।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ कहता है, ‘और थूककर उसने उसकी जीभ को छुआ’; वह स्पष्ट रूप से यह नहीं कहता कि यीशु ने उस व्यक्ति की जीभ पर थूक लगाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπολαβόμενος αὐτὸν ἀπὸ τοῦ ὄχλου
  choice: उसे भीड़ से अलग ... ले गया
  rationale: यह कृदन्त उस व्यक्ति को भीड़ से अलग ले जाने का भाव देता है। हिंदी में यह स्वाभाविक है और केवल दूरी नहीं, समूह से अलग किए जाने को भी व्यक्त करता है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: यह पद अलग, निजी स्थान या परिस्थिति का संकेत देता है। ‘एकांत में’ आधुनिक हिंदी में सहज है; ‘अकेले’ कहने से यह अनचाहा अर्थ निकल सकता है कि वहाँ कोई और था ही नहीं।
- source_word: ἔβαλεν τοὺς δακτύλους αὐτοῦ εἰς τὰ ὦτα αὐτοῦ
  choice: उसने अपनी उँगलियाँ उसके कानों में डालीं
  rationale: संदर्भ में βάλλω का अर्थ ‘डालना/रखना’ है, न कि ‘फेंकना’। ‘अपनी’ और ‘उसके’ से स्पष्ट होता है कि उँगलियाँ यीशु की और कान उस व्यक्ति के थे।
- source_word: πτύσας
  choice: थूकने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले या उसके साथ घटित क्रिया को बताता है। यह रूप क्रम को सहजता से व्यक्त करता है, पर यह नहीं जोड़ता कि थूक कहाँ लगाया गया।
- source_word: ἥψατο τῆς γλώσσης αὐτοῦ
  choice: उसकी जीभ को छुआ
  rationale: ἅπτομαι के साथ संबंधकारक यहाँ स्पर्श की वस्तु बताता है। ‘छुआ’ सटीक, संयत और स्वाभाविक हिंदी है।
theological_decisions:
- issue: यीशु के चंगाई-संबंधी संकेत और थूक का उपयोग
  choice: 'क्रियाओं को सीधे वर्णित किया गया है: उसने थूका और उस व्यक्ति की जीभ को छुआ।'
  alternative: यह स्पष्ट करना कि यीशु ने अपना थूक उस व्यक्ति की जीभ पर लगाया।
  rationale: यूनानी पाठ थूकने और जीभ छूने का वर्णन करता है, लेकिन स्पष्ट रूप से यह नहीं कहता कि थूक जीभ पर लगाया गया। अनुवाद उस अस्पष्टता और कथात्मक संयम को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य को हिंदी की स्वाभाविक प्रवाह-रचना के अनुसार दो वाक्यों में बाँटा गया है। ‘एकांत में’ निजी रूप से अलग ले जाने का भाव देता है और ‘थूकने के बाद’ मूल पाठ से अधिक विवरण नहीं जोड़ता।
