  text: μάτην δὲ σέβονταί με, διδάσκοντες διδασκαλίας ἐντάλματα ἀνθρώπων·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/007.yaml
  text: But they worship me in vain[a], teaching as doctrines the commandments of men.
translation:
  language: hi
  text: “पर वे व्यर्थ ही मेरी उपासना करते हैं; वे मनुष्यों की आज्ञाओं को सिद्धांतों के रूप में सिखाते हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे जो शिक्षाएँ सिखाते हैं, वे मनुष्यों की आज्ञाएँ हैं।”
    reason: यूनानी में ‘शिक्षाओं’ और ‘मनुष्यों की आज्ञाओं’ का संबंध संक्षिप्त और समानाधिकरण-सदृश है; यह विकल्प उस रचना को दूसरे स्वाभाविक ढंग से व्यक्त करता है।
lexical_decisions:
- source_word: μάτην
  choice: व्यर्थ ही
  rationale: यह क्रियाविशेषण निष्फलता और उद्देश्यहीनता व्यक्त करता है। ‘व्यर्थ ही’ आधुनिक हिन्दी में स्वाभाविक है और भविष्यद्वाणी के कथन की तीव्रता बनाए रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में होंठों से आदर करने और हृदय के दूर होने के बीच विरोध को आगे बढ़ाता है; ‘पर’ उस विरोध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: σέβονταί με
  choice: मेरी उपासना करते हैं
  rationale: σέβομαι यहाँ परमेश्वर के प्रति धार्मिक श्रद्धा और आराधना को दर्शाता है। ‘उपासना’ हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: διδάσκοντες
  choice: सिखाते हैं
  rationale: वर्तमान कृदन्त उनकी व्यर्थ उपासना की रीति या विशेषता बताता है। हिन्दी में स्वतंत्र क्रिया-वाक्य इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: διδασκαλίας
  choice: सिद्धांत के रूप में
  rationale: यहाँ संज्ञा ἐντάλματα के साथ निकट संबंध में है और बताती है कि मानवीय आज्ञाएँ प्रामाणिक शिक्षाओं या सिद्धांतों के रूप में प्रस्तुत की जा रही हैं।
- source_word: ἐντάλματα ἀνθρώπων
  choice: मनुष्यों की आज्ञाओं
  rationale: ἐντάλματα अधिकारपूर्ण आदेशों को और संबंधकारक ἀνθρώπων उनके मानवीय स्रोत को दर्शाता है। ‘मनुष्यों’ का प्रयोग समस्त मानवों के सामान्य अर्थ में है, न कि केवल पुरुषों के लिए।
theological_decisions:
- issue: मानवीय आज्ञाओं और प्रामाणिक धार्मिक शिक्षा के बीच संबंध
  choice: मनुष्यों की आज्ञाओं को सिद्धांत के रूप में सिखाते हैं
  alternative: वे जो शिक्षाएँ सिखाते हैं, वे मनुष्यों की आज्ञाएँ हैं
  rationale: यूनानी वाक्य रचना संक्षिप्त है और διδασκαλίας तथा ἐντάλματα के संबंध को एक से अधिक ढंग से व्यक्त किया जा सकता है। मुख्य पाठ यह स्पष्ट करता है कि मानवीय आज्ञाओं को सिद्धांत का दर्जा दिया जा रहा है, जबकि पादटिप्पणी अधिक संरचनात्मक विकल्प सुरक्षित रखती है; किसी विशेष सम्प्रदायगत अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उपासना’, ‘आज्ञाएँ’ और ‘सिद्धांत’ धार्मिक संदर्भ की गंभीरता बनाए रखते हैं, जबकि वाक्य-संरचना सामान्य हिन्दी पाठक के लिए स्पष्ट है। उद्धरण-चिह्न यह दर्शाते हैं कि यह भविष्यद्वाणी का उद्धरण है।
