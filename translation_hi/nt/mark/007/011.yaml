source:
  edition: SBLGNT
  text: ὑμεῖς δὲ λέγετε· Ἐὰν εἴπῃ ἄνθρωπος τῷ πατρὶ ἢ τῇ μητρί· Κορβᾶν, ὅ ἐστιν Δῶρον, ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/011.yaml
  text: But you say[a], ‘If a man says to his father or his mother, “Corban” (that is, a gift)[b], whatever you might have benefited from me—’
translation:
  language: hi
  text: पर तुम कहते हो, ‘यदि कोई अपने पिता या अपनी माता से कहे, “कुरबान”[a] (अर्थात् उपहार[b])—वह सब जिससे आपको मुझ से लाभ मिल सकता था—’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कुरबान’ उस वस्तु के लिए प्रयुक्त शब्द था जो परमेश्वर को उपहार के रूप में समर्पित कर दी गई हो और इसलिए परिवार के सामान्य उपयोग से अलग रखी जाती थी।
    reason: cultural_note
  - marker: b
    text: या, ‘अर्थात् एक भेंट।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς δὲ λέγετε
  choice: पर तुम कहते हो
  rationale: δὲ पिछले कथन के साथ विरोध दिखाता है; वर्तमानकालीन λέγετε को सामान्य वर्तमान के रूप में स्वाभाविक ढंग से रखा गया है।
- source_word: Ἐὰν εἴπῃ ἄνθρωπος
  choice: यदि कोई ... कहे
  rationale: ἐὰν के साथ aorist subjunctive संभावित शर्त व्यक्त करता है। ἄνθρωπος यहाँ प्रतिनिधिक अर्थ में है; आधुनिक हिन्दी में ‘कोई’ उसी व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: अपने पिता या अपनी माता से
  rationale: सम्प्रदान कारक सम्बोधित व्यक्ति बताता है। ‘से कहे’ हिन्दी की स्वाभाविक वाक्य-रचना है और दोनों पारिवारिक सम्बन्धों का समानांतर रूप सुरक्षित रखता है।
- source_word: Κορβᾶν
  choice: कुरबान
  rationale: यूनानी पाठ सामी धार्मिक शब्द को लिप्यन्तरित करके स्वयं उसका अर्थ बताता है; इसलिए ऐतिहासिक शब्द को देवनागरी में सुरक्षित रखा गया है।
- source_word: ὅ ἐστιν Δῶρον
  choice: अर्थात परमेश्वर को दिया गया उपहार
  rationale: δῶρον का मूल अर्थ ‘उपहार’ है। इस प्रसंग में समर्पण का धार्मिक आशय स्पष्ट करने के लिए ‘परमेश्वर को दिया गया’ जोड़ा गया है, जबकि वैकल्पिक ‘भेंट’ पादटिप्पणी में रखा गया है।
- source_word: ὃ ἐὰν ἐξ ἐμοῦ ὠφεληθῇς
  choice: वह, जिससे तुम्हें मेरी ओर से सहायता मिल सकती थी
  rationale: ὃ ἐὰν अनिश्चित सम्बन्धवाचक अर्थ देता है और ὠφεληθῇς सहायता अथवा लाभ पाने को सूचित करता है। यह हिन्दी माता-पिता को मिलने वाली सहायता का अर्थ रखती है, पर उसे केवल धन तक सीमित नहीं करती। अन्त का डैश दिखाता है कि वाक्य पद 12 में पूरा होता है।
theological_decisions:
- issue: Κορβᾶν को धार्मिक समर्पण की प्रतिज्ञा के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘कुरबान’ बनाए रखकर मार्क द्वारा दिए गए अर्थ को कोष्ठक में स्पष्ट किया गया है।
  alternative: मुख्य पाठ में केवल ‘भेंट’ या ‘परमेश्वर को समर्पित वस्तु’ कहना।
  rationale: मूल यूनानी स्वयं सामी शब्द को सुरक्षित रखता और फिर उसका अर्थ बताता है। यही संरचना ऐतिहासिक-धार्मिक विशिष्टता बनाए रखती है और प्रतिज्ञा की बाद की व्यवस्थाओं को अनावश्यक रूप से पाठ में नहीं लाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुरबान’ को धार्मिक पारिभाषिक शब्द के रूप में सुरक्षित किया गया है; इसे सामान्य हिन्दी विशेषण ‘कुर्बान’ से अलग पहचान देने के लिए मूल सामी/यूनानी ध्वनि के निकट लिखा गया है।
