  text: καὶ ἀναβλέψας εἰς τὸν οὐρανὸν ἐστέναξεν, καὶ λέγει αὐτῷ· Εφφαθα, ὅ ἐστιν Διανοίχθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/034.yaml
  text: And looking up to heaven[a], he sighed and said to him, “Ephphatha,” that is[b], “Be opened.”
translation:
  language: hi
  text: उसने स्वर्ग की ओर आँखें उठाकर आह भरी और उससे कहा, “इफ्फथा,” अर्थात्, “खुल जा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβλέψας
  choice: आँखें उठाकर
  rationale: यह क्रिया ऊपर देखने के भाव को स्वाभाविक हिन्दी में व्यक्त करती है और मुख्य क्रिया से पहले की साथ जुड़ी हुई क्रिया को बनाए रखती है।
- source_word: εἰς τὸν οὐρανόν
  choice: स्वर्ग की ओर
  rationale: इस प्रार्थना-सदृश प्रसंग में οὐρανός का अर्थ केवल आकाश नहीं, बल्कि स्वर्ग है; ‘की ओर’ ऊपर की दिशा को सहज रूप से व्यक्त करता है।
- source_word: ἐστέναξεν
  choice: गहरी साँस ली
  rationale: στενάζω गहरी साँस लेने, आह भरने या कराहने का भाव दे सकता है। यहाँ यह चयन भाव की गंभीरता रखता है, पर अनिश्चित रूप से तीव्र कराह का अर्थ नहीं थोपता।
- source_word: λέγει αὐτῷ
  choice: उससे कहा
  rationale: ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथन में भूतकाल से व्यक्त किया गया है; सर्वनाम उस व्यक्ति को संबोधन बनाए रखता है।
- source_word: Εφφαθα
  choice: इफ्फथा
  rationale: मरकुस द्वारा सुरक्षित अरामी उच्चारण को देवनागरी लिप्यंतरण में रखा गया है और उसके बाद लेखक का दिया अर्थ आता है।
- source_word: Διανοίχθητι
  choice: खुल जा
  rationale: एकवचन निष्क्रिय आज्ञार्थक का अर्थ हिन्दी के स्वाभाविक आदेश ‘खुल जा’ से व्यक्त होता है; हिन्दी में यही रूप स्रोत के ‘खोला जा’ की अपेक्षा अधिक सहज है।
theological_decisions:
- issue: αὐτῷ का संदर्भ
  choice: उससे—अर्थात् उस बहरे व्यक्ति से
  alternative: उसके कानों या वाणी की क्षमता को अप्रत्यक्ष संबोधन
  rationale: यूनानी पुल्लिंग एकवचन सर्वनाम स्वाभाविक रूप से उस व्यक्ति की ओर संकेत करता है, यद्यपि आज्ञा उसके अवरुद्ध अंगों के खुलने से संबंधित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘फिर’ वाक्य को पिछले घटनाक्रम से जोड़ता है। अरामी शब्द को स्रोत-पाठ की सांस्कृतिक बनावट बनाए रखने के लिए लिप्यंतरित किया गया है।
