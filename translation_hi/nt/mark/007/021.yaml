source:
  edition: SBLGNT
  text: ἔσωθεν γὰρ ἐκ τῆς καρδίας τῶν ἀνθρώπων οἱ διαλογισμοὶ οἱ κακοὶ ἐκπορεύονται, ⸂πορνεῖαι, κλοπαί, φόνοι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/021.yaml
  text: 'For from within[a], out of the heart of men, evil thoughts come out: sexual immoralities, thefts, murders[b],'
translation:
  language: hi
  text: क्योंकि मनुष्यों के हृदय के भीतर से बुरे विचार निकलते हैं—यौन अनैतिकताएँ, चोरियाँ और हत्याएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσωθεν
  choice: भीतर से
  rationale: यह आंतरिक स्रोत को स्पष्ट करता है और प्रसंग में बाहरी तथा भीतरी अशुद्धता के विरोध को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्वाभाविक है।
- source_word: καρδίας
  choice: हृदय
  rationale: मूल रूपक को बनाए रखते हुए मनुष्य के नैतिक, इच्छात्मक और आंतरिक केंद्र का संकेत देता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों
  rationale: यहाँ बहुवचन शब्द समस्त मानवजाति के लिए सामान्य अर्थ में प्रयुक्त है; ‘मनुष्यों’ आधुनिक हिन्दी में समावेशी और स्रोत-संगत है।
- source_word: διαλογισμοὶ οἱ κακοὶ
  choice: बुरे विचार
  rationale: यह भीतर उठने वाले नैतिक रूप से दूषित विचारों और मनन को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκπορεύονται
  choice: निकलते हैं
  rationale: वर्तमान काल और भीतर से बाहर आने की स्थानिक-रूपकात्मक छवि दोनों सुरक्षित रहते हैं।
- source_word: πορνεῖαι
  choice: व्यभिचार के काम
  rationale: बहुवचन को ठोस कृत्यों के रूप में व्यक्त करता है और निषिद्ध यौन आचरण का व्यापक संकेत देता है, यद्यपि हिन्दी ‘व्यभिचार’ कभी-कभी संकुचित अर्थ में भी समझा जा सकता है।
- source_word: κλοπαί
  choice: चोरियाँ
  rationale: बहुवचन अपराध-कृत्यों के लिए सहज और सटीक हिन्दी समतुल्य है।
- source_word: φόνοι
  choice: हत्याएँ
  rationale: यह सामान्य ‘मार डालने’ के बजाय नैतिक रूप से दोषपूर्ण या अवैध वध का अर्थ प्रकट करता है।
theological_decisions:
- issue: ἀνθρώπων का सामान्य मानव-संदर्भ
  choice: मनुष्यों
  alternative: लोगों / मनुष्यों के पुरुषवाची प्रतिनिधि रूप का अनुवाद
  rationale: यूनानी व्याकरणिक रूप पुल्लिंग बहुवचन है, पर यहाँ आशय सभी मनुष्यों से है। हिन्दी ‘मनुष्यों’ संख्या और सामान्य मानव-संदर्भ दोनों को बिना अनावश्यक लैंगिक संकुचन के सुरक्षित रखता है।
- issue: πορνεῖαι का अर्थ और बहुवचन
  choice: व्यभिचार के काम
  alternative: यौन अनैतिकताएँ / यौन अनैतिकता
  rationale: मूल शब्द विविध निषिद्ध यौन कृत्यों को व्यापक रूप से सूचित करता है। ‘के काम’ बहुवचन और ठोस आचरण को व्यक्त करता है तथा किसी एक विशिष्ट श्रेणी तक अर्थ को सीमित करने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। ‘हृदय’ बाइबिलीय मानव-विज्ञान की परिचित छवि को बनाए रखता है; सूची की लय के लिए दीर्घ विराम चिह्न का प्रयोग किया गया है।
