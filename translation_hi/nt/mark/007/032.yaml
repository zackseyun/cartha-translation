base_translation:
  language: en
  yaml_path: translation/nt/mark/007/032.yaml
  text: And they brought to him a man who was deaf and had difficulty speaking[a], and they begged him to lay his hand on him.
translation:
  language: hi
  text: और लोग उसके पास एक बहरे व्यक्ति को लाए, जिसे बोलने में कठिनाई थी,[a] और उससे विनती की कि वह उस पर अपना हाथ रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “एक बहरे और कठिनाई से बोलने वाले व्यक्ति को।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: φέρουσιν
  choice: लाए
  rationale: मरकुस में ऐतिहासिक वर्तमान सामान्य है; हिन्दी कथा-शैली में पूर्ण भूतकाल ‘लाए’ घटना-क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κωφόν
  choice: एक बहरे व्यक्ति को
  rationale: यहाँ κωφός का अर्थ बहरापन है; अगला विशेषण वाणी की कठिनाई को अलग से बताता है। ‘व्यक्ति’ भाषा को सहज और सम्मानजनक रखता है।
- source_word: μογιλάλον
  choice: जिसे बोलने में कठिनाई होती थी
  rationale: दुर्लभ शब्द μογιλάλος कठिनाई से बोलने को दर्शाता है, पूरी तरह मूक होने को नहीं। यह वाक्यांश उसी भेद को स्पष्ट और आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: παρακαλοῦσιν
  choice: विनती करने लगे
  rationale: चंगाई के इस प्रसंग में क्रिया साधारण अनुरोध से अधिक आग्रह व्यक्त करती है; ऐतिहासिक वर्तमान का कथात्मक प्रभाव ‘करने लगे’ से स्वाभाविक रूप में आता है।
- source_word: ἵνα ἐπιθῇ αὐτῷ τὴν χεῖρα
  choice: कि वह उस पर अपना हाथ रखे
  rationale: ‘कि’ अनुरोध की विषय-वस्तु बताता है और एकवचन χεῖρα को ‘हाथ’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: व्यक्ति की शारीरिक कठिनाइयों का स्वरूप
  choice: वह बहरा था और उसे बोलने में कठिनाई होती थी, पर उसे पूर्णतः मूक नहीं कहा गया है।
  alternative: वह बहरा और गूँगा था।
  rationale: κωφός और μογιλάλος दो अलग विशेषताएँ बताते हैं। μογιλάλος बाधित या कठिन वाणी को सूचित करता है; ‘गूँगा’ कहना मूल पाठ से अधिक निश्चित और व्यापक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। ‘बहरे व्यक्ति’ तथा ‘बोलने में कठिनाई’ मूल के अर्थ-भेद को बनाए रखते हैं और अनावश्यक रूप से उसे ‘गूँगा’ नहीं ठहराते।
