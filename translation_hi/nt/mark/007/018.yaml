source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Οὕτως καὶ ὑμεῖς ἀσύνετοί ἐστε; οὐ νοεῖτε ὅτι πᾶν τὸ ἔξωθεν εἰσπορευόμενον εἰς τὸν ἄνθρωπον οὐ δύναται αὐτὸν κοινῶσαι,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/018.yaml
  text: And he said to them[b][a], “So are you also without understanding? Do you not understand that everything that enters into the man from outside is not able to defile him,”
translation:
  language: hi
  text: उसने उनसे कहा, “क्या तुम भी इतने नासमझ हो? क्या तुम नहीं समझते कि बाहर से मनुष्य के भीतर जाने वाली कोई भी वस्तु उसे अशुद्ध नहीं कर सकती?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसे अपवित्र नहीं कर सकती।” यहाँ यूनानी क्रिया धार्मिक शुद्धता और अशुद्धता से जुड़ी है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: उसने ... कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथा-शैली में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: Οὕτως καὶ ὑμεῖς
  choice: क्या तुम भी ऐसे
  rationale: οὕτως, καί और बलयुक्त ὑμεῖς से व्यक्त आश्चर्यपूर्ण फटकार को सहज हिन्दी में रखता है।
- source_word: ἀσύνετοί
  choice: नासमझ
  rationale: यह विवेक या समझ की कमी व्यक्त करता है और अगले νοεῖτε के साथ अर्थगत संबंध बनाए रखता है।
- source_word: νοεῖτε
  choice: समझते
  rationale: संदर्भ में बौद्धिक ग्रहण का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: πᾶν τὸ ἔξωθεν εἰσπορευόμενον
  choice: बाहर से ... भीतर जाने वाली कोई भी वस्तु
  rationale: संज्ञात्मक कृदन्त की सार्वत्रिकता और ἔξωθεν के बाहरी स्रोत—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸν ἄνθρωπον
  choice: मनुष्य के भीतर
  rationale: ἄνθρωπος यहाँ सामान्य मानव के अर्थ में एकवचन है; ‘मनुष्य’ उसी प्रतिनिधिक अर्थ को बनाए रखता है।
- source_word: κοινῶσαι
  choice: अशुद्ध ... कर सकती
  rationale: शुद्धता-विवाद के संदर्भ में κοινόω का अर्थ किसी को अशुद्ध ठहराना या बनाना है; यह हिन्दी में धार्मिक-शुद्धता का संकेत सुरक्षित रखता है।
theological_decisions:
- issue: κοινόω में शुद्धता-संबंधी अर्थ
  choice: अशुद्ध करना
  alternative: अपवित्र करना
  rationale: संदर्भ धार्मिक शुद्धता का है, केवल नैतिक भ्रष्टता का नहीं। ‘अशुद्ध’ इस अर्थ को अधिक सीधे व्यक्त करता है, जबकि ‘अपवित्र’ नैतिक अथवा पवित्र-वस्तु संबंधी अर्थ भी जगा सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। प्रश्नों की फटकारपूर्ण धार बनाए रखी गई है; ‘वस्तु’ से खाद्य-संदर्भ स्पष्ट होता है, पर पद के व्यापक व्याकरणिक रूप को अनावश्यक रूप से केवल किसी खास भोजन तक सीमित नहीं किया गया।
