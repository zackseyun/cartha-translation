source:
  edition: SBLGNT
  text: καὶ ἀπ’ ⸀ἀγορᾶς ἐὰν μὴ ⸀βαπτίσωνται οὐκ ἐσθίουσιν, καὶ ἄλλα πολλά ἐστιν ἃ παρέλαβον κρατεῖν, βαπτισμοὺς ποτηρίων καὶ ξεστῶν καὶ χαλκίων ⸂καὶ κλινῶν⸃—
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/004.yaml
  text: 'And when they come from the marketplace[a], they do not eat unless they wash themselves[b], and there are many other things that they have received to keep: washings of cups and pitchers and copper vessels and dining couches—'
translation:
  language: hi
  text: और बाज़ार से आने पर वे तब तक नहीं खाते, जब तक अपने को धो न लें।[a] और भी बहुत-सी दूसरी बातें हैं जिन्हें उन्होंने ग्रहण किया है और उनका पालन करते हैं—जैसे प्यालों, घड़ों, ताँबे के बर्तनों और लेटकर भोजन करने के आसनों को धोना—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक अपने को डुबो न लें।” यहाँ यूनानी में उस क्रिया का एक रूप है जिसका अनुवाद प्रायः “बपतिस्मा देना” किया जाता है, लेकिन इस प्रसंग में यह शुद्धता की रीति के अनुसार धोने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγορᾶς
  choice: बाज़ार
  rationale: ἀγορά यहाँ सार्वजनिक बाज़ार-क्षेत्र को दर्शाता है। ‘बाज़ार से लौटकर’ हिन्दी में गमन-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: βαπτίσωνται
  choice: अपने को धो न लें
  rationale: इस शुद्धता-संबंधी प्रसंग में क्रिया धार्मिक रीति से अपने शरीर को धोने की ओर संकेत करती है। यह अनुवाद मध्यमवाच्य अर्थ को रखता है और मसीही बपतिस्मे का अनपेक्षित अर्थ नहीं जोड़ता; डुबोने की सम्भावना पादटिप्पणी में दी गई है।
- source_word: παρέλαβον κρατεῖν
  choice: जिन्हें उन्होंने ग्रहण किया है और जिनका वे पालन करते हैं
  rationale: यह पदबंध प्राप्त की हुई प्रथाओं को बनाए रखने या मानने का भाव देता है। ‘ग्रहण किया’ और ‘पालन करते हैं’ दोनों पहलुओं को स्पष्ट रखते हैं।
- source_word: βαπτισμοὺς
  choice: धोना
  rationale: बर्तनों और आसनों के संदर्भ में बहुवचन संज्ञा विभिन्न रीति-संबंधी धुलाई की प्रथाओं को दर्शाती है। हिन्दी सूची में ‘को धोना’ स्वाभाविक और स्पष्ट है।
- source_word: ξεστῶν
  choice: घड़ों
  rationale: ξέστης किसी घड़े या सुराही जैसे पात्र को दर्शाता है; ‘घड़ा’ सामान्य आधुनिक हिन्दी में स्पष्ट है और पात्र का प्रकार अनावश्यक रूप से निश्चित नहीं करता।
- source_word: χαλκίων
  choice: ताँबे के बर्तनों
  rationale: χαλκίον ताँबे या ताँबे की मिश्रधातु से बनी वस्तु के लिए प्रयुक्त होता है। ‘ताँबे के बर्तन’ सरल और स्रोत के निकट है।
- source_word: κλινῶν
  choice: भोजन के आसनों
  rationale: κλίνη पलंग या लेटने के आसन को कह सकता है; इस भोजन-संदर्भ में उन आसनों का संकेत है जिन पर टिककर या लेटकर भोजन किया जाता था। ‘भोजन के आसन’ सांस्कृतिक उपयोग को संक्षेप में स्पष्ट करता है।
- source_word: ἄλλα πολλά
  choice: ऐसी बहुत-सी दूसरी बातें
  rationale: यूनानी पद व्यापक है और केवल ‘परंपराएँ’ नहीं कहता; यह चयन उसी व्यापकता को बनाए रखता है।
theological_decisions:
- issue: शुद्धता के प्रसंग में βαπτίσωνται और βαπτισμοὺς का अर्थ
  choice: ‘अपने को धो न लें’ और ‘धोना’
  alternative: ‘अपने को डुबो न लें’ और ‘डुबोना’; अथवा ‘बपतिस्मा लेना’
  rationale: प्रसंग फरीसियों की रीति-संबंधी शुद्धता का है, मसीही बपतिस्मे का नहीं। ‘धोना’ प्रसंग को स्वाभाविक रखता है, जबकि सम्भावित डुबोने का अर्थ पादटिप्पणी में सुरक्षित है।
- issue: κλινῶν की पाठ-भिन्नता
  choice: ‘भोजन के आसनों’ को मुख्य पाठ में रखना
  alternative: इस वाक्यांश को छोड़ देना
  rationale: SBLGNT के प्रस्तुत पाठ में वाक्यांश है, पर कुछ हस्तलिपियाँ इसे छोड़ती हैं; इसलिए मुख्य पाठ में रखते हुए पाठ-भिन्नता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘अपने को धोना’ सामान्य पाठक के लिए स्पष्ट है; ‘ग्रहण किया है और जिनका वे पालन करते हैं’ स्रोत के ग्रहण और बनाए रखने—दोनों भावों को व्यक्त करता है। प्राचीन भोजन-प्रथा को समझाने के लिए κλινῶν का अनुवाद ‘भोजन के आसन’ किया गया है।
