  text: Καὶ συνάγονται πρὸς αὐτὸν οἱ Φαρισαῖοι καί τινες τῶν γραμματέων ἐλθόντες ἀπὸ Ἱεροσολύμων
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/001.yaml
  text: And the Pharisees and some of the scribes[a], who had come from Jerusalem, gather around him.
translation:
  language: hi
  text: और फ़रीसी तथा शास्त्रियों में से कुछ लोग, जो यरूशलेम से आए थे, उसके पास इकट्ठे होते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके चारों ओर इकट्ठे होते हैं।” यूनानी पदबंध का अधिक सीधा अर्थ “उसके पास इकट्ठे होते हैं” है।
    reason: स्थान-संबंधी पदबंध πρὸς αὐτόν के सम्भव स्वाभाविक अनुवाद को दर्ज करना।
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: मरकुस की सतत कथा में καί अगले घटनाक्रम को पहले से जोड़ता है; ‘और’ इसके संयोजक बल को सीधे बनाए रखता है।
- source_word: συνάγονται πρὸς αὐτὸν
  choice: उसके पास इकट्ठे होते हैं
  rationale: συνάγονται के वर्तमानकालीन कथात्मक रूप को ‘इकट्ठे होते हैं’ से और πρός + कर्मकारक के दिशा/संबंध के भाव को ‘उसके पास’ से व्यक्त किया गया है। यह हिन्दी में स्वाभाविक है और ‘चारों ओर’ जैसा अतिरिक्त स्थानिक संकेत अनिवार्य नहीं बनाता।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसी
  rationale: यह इस यहूदी समूह के लिए आधुनिक हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण है।
- source_word: τινες τῶν γραμματέων
  choice: शास्त्रियों में से कुछ लोग
  rationale: τῶν γραμματέων की अंशवाचक संबंध-रचना को स्पष्ट रखते हुए बताया गया है कि सभी नहीं, बल्कि उनमें से कुछ आए थे।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: ‘शास्त्री’ γραμματεύς का स्थापित और संक्षिप्त हिन्दी प्रतिशब्द है; यह केवल उनकी व्याख्यात्मक भूमिका बताने के बजाय पदनाम को बनाए रखता है।
- source_word: ἐλθόντες ἀπὸ Ἱεροσολύμων
  choice: जो यरूशलेम से आए थे
  rationale: पूर्वकालिक कृदंत को स्वाभाविक हिन्दी संबंधवाचक उपवाक्य में व्यक्त किया गया है, जिससे उनके पहले यरूशलेम से आने और फिर इकट्ठे होने का क्रम बना रहता है।
