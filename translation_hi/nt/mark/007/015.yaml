source:
  edition: SBLGNT
  text: οὐδέν ἐστιν ἔξωθεν τοῦ ἀνθρώπου εἰσπορευόμενον εἰς αὐτὸν ὃ δύναται ⸂κοινῶσαι αὐτόν⸃· ἀλλὰ τὰ ⸂ἐκ τοῦ ἀνθρώπου ἐκπορευόμενά⸃ ἐστιν τὰ κοινοῦντα τὸν ⸀ἄνθρωπον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/015.yaml
  text: There is nothing outside a man that by going into him is able to defile him; rather, the things that come out from the man are what defile the man.
translation:
  language: hi
  text: ऐसी कोई वस्तु नहीं जो मनुष्य के बाहर से उसके भीतर जाकर उसे अशुद्ध कर सके; बल्कि मनुष्य से निकलने वाली बातें ही मनुष्य को अशुद्ध करती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अशुद्ध करती हैं’ का अनुवाद ‘अपवित्र करती हैं’ भी हो सकता है। यूनानी क्रिया किसी को शुद्धता के अर्थ में अशुद्ध करने का संकेत दे सकती है; इस प्रसंग में इसका नैतिक बल भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδέν
  choice: ऐसी कोई वस्तु नहीं
  rationale: नपुंसकलिंग एकवचन का निरपेक्ष प्रयोग है; हिन्दी में ‘कोई वस्तु नहीं’ बाहरी, भीतर जाने वाली चीज़ का स्वाभाविक बोध देता है।
- source_word: ἔξωθεν τοῦ ἀνθρώπου
  choice: मनुष्य के बाहर से
  rationale: ‘बाहर से’ बाहरी स्रोत को स्पष्ट करता है और आगे के ‘मनुष्य के भीतर से निकलने’ के साथ जानबूझकर रखे गए विरोध को बनाए रखता है।
- source_word: τοῦ ἀνθρώπου / τὸν ἄνθρωπον
  choice: मनुष्य
  rationale: ἄνθρωπος यहाँ सामान्य अर्थ में किसी मानव को दर्शाता है। हिन्दी का ‘मनुष्य’ इस प्रतिनिधिक एकवचन को स्वाभाविक और लिंग-समावेशी ढंग से व्यक्त करता है।
- source_word: εἰσπορευόμενον εἰς αὐτόν
  choice: उसके भीतर जाकर
  rationale: यह कृदन्त बाहरी वस्तु के भीतर प्रवेश करने की क्रिया बताता है; यह रूप हिन्दी में संक्षिप्त और सहज है।
- source_word: δύναται
  choice: कर सके
  rationale: सामर्थ्य या क्षमता के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κοινῶσαι / κοινοῦντα
  choice: अशुद्ध कर सके / अशुद्ध करती हैं
  rationale: शुद्धता-विवाद के संदर्भ में κοινόω किसी को अशुद्ध ठहराने या बनाने का भाव रखता है, और आगे के नैतिक संदर्भ को भी खुला रखता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: बाहरी वस्तुओं और भीतर से निकलने वाली वस्तुओं के बीच प्रबल सुधारात्मक विरोध को व्यक्त करता है।
- source_word: τὰ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενα
  choice: मनुष्य के भीतर से निकलने वाली वस्तुएँ
  rationale: नपुंसकलिंग बहुवचन substantival participle को बहुवचन रूप में रखा गया है। ‘भीतर से’ संदर्भगत आशय स्पष्ट करता है, जबकि स्रोत का मुख्य ‘मनुष्य से बाहर निकलने’ का भाव बना रहता है।
theological_decisions:
- issue: शुद्धता-विवाद में κοινόω का अर्थ
  choice: अशुद्ध करना
  alternative: अपवित्र करना
  rationale: ‘अशुद्ध’ शुद्ध-अशुद्ध की धार्मिक-सामाजिक श्रेणी को सीधे व्यक्त करता है, पर इसे केवल कर्मकाण्ड तक सीमित नहीं करता; अगले पदों में नैतिक अशुद्धता का विस्तार भी संभव रहता है।
- issue: ἄνθρωπος का सामान्य प्रतिनिधिक प्रयोग
  choice: मनुष्य
  alternative: व्यक्ति
  rationale: ‘मनुष्य’ एकवचन और सामान्य मानवीय संदर्भ दोनों को बनाए रखता है तथा हिन्दी में स्त्री-पुरुष दोनों को समेटता है।
- issue: बाहर और भीतर का विरोध
  choice: मनुष्य के बाहर से / मनुष्य के भीतर से
  alternative: मनुष्य के बाहर / मनुष्य से
  rationale: स्रोत में ἔξωθεν और ἐκ के बीच का विरोध मूलतः बाहरी स्रोत बनाम मनुष्य से निकलने वाली चीज़ों का है। हिन्दी में ‘भीतर से’ अगले संदर्भ के अनुसार इस विरोध को सहज बनाता है, बिना यह तय किए कि केवल शारीरिक या केवल नैतिक बातें अभिप्रेत हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखा गया है। ‘चीज़’ की अपेक्षा ‘वस्तु’ शुद्धता-विवाद के प्रसंग में अधिक संतुलित लगी। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] दिया गया है।
