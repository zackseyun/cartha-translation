    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: उन्होंने देखा
  rationale: अओरिस्ट कृदंत का कर्ता पिछले पद के फरीसी और कुछ शास्त्री हैं। स्वतंत्र पद के रूप में सहज हिन्दी के लिए इसे सीमित क्रिया से व्यक्त किया गया है, जबकि आगे के वाक्य से इसका संबंध अंतिम डैश द्वारा खुला रखा गया है।
- source_word: τινὰς τῶν μαθητῶν αὐτοῦ
  choice: उसके कुछ चेले
  rationale: τινάς और अंशवाचक संबंधकारक का स्वाभाविक अर्थ ‘उसके चेलों में से कुछ’ है; संक्षिप्त और प्रचलित हिन्दी में ‘उसके कुछ चेले’ यही अर्थ देता है।
- source_word: κοιναῖς χερσίν
  choice: अशुद्ध हाथों से
  rationale: यहूदी शुद्धता-संदर्भ में κοινός का आशय केवल ‘सामान्य’ नहीं, बल्कि धार्मिक रीति से अशुद्ध या अपवित्र माना गया है। ‘अशुद्ध’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है; मूल का शाब्दिक ‘सामान्य’ पादटिप्पणी में सुरक्षित है।
- source_word: τοῦτ’ ἔστιν ἀνίπτοις
  choice: अर्थात बिना धोए हाथों से
  rationale: लेखक की व्याख्यात्मक टिप्पणी को स्पष्ट रखा गया है। ‘बिना धोए’ ἀνίπτοις का सीधा अर्थ है और ‘हाथों से’ दोहराने से हिन्दी में संबंध साफ रहता है।
- source_word: ἐσθίουσιν
  choice: खा रहे थे
  rationale: वर्णन में वर्तमान काल की क्रिया देखे जा रहे समकालीन कार्य को बताती है; हिन्दी का अपूर्ण भूतकाल इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοὺς ἄρτους
  choice: रोटी
  rationale: यूनानी बहुवचन का आशय यहाँ भोजन के रूप में रोटी है। हिन्दी में द्रव्य/भोजनवाचक एकवचन ‘रोटी’ अधिक स्वाभाविक है और अनावश्यक रूप से अलग-अलग रोटियों पर जोर नहीं देता।
theological_decisions:
- issue: κοινός में धार्मिक शुद्धता का भाव
  choice: मुख्य पाठ में ‘अशुद्ध’
  alternative: ‘सामान्य’ या ‘अपवित्र’
  rationale: ‘सामान्य हाथ’ शाब्दिक तो है, पर आधुनिक हिन्दी में इस संदर्भ का धार्मिक-रीतिगत अर्थ संप्रेषित नहीं करता। ‘अशुद्ध’ शारीरिक गंदगी तक सीमित न होकर धार्मिक अशुद्धता भी व्यक्त कर सकता है; लेखक की अपनी व्याख्या ‘बिना धोए’ साथ रखी गई है और शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेले’ सामान्य पाठक के लिए परिचित है। पद के अंत का डैश मूल वाक्य के अगले पदों में जारी रहने का संकेत देता है।
