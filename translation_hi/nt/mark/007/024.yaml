source:
  edition: SBLGNT
  text: ⸂Ἐκεῖθεν δὲ⸃ ἀναστὰς ἀπῆλθεν εἰς τὰ ⸀ὅρια ⸀Τύρου. καὶ εἰσελθὼν εἰς οἰκίαν οὐδένα ἤθελεν γνῶναι, καὶ οὐκ ἠδυνήθη λαθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/024.yaml
  text: From there he got up and went away to the region of Tyre[a]. After entering a house, he wanted no one to know it[c][b], yet he could not remain hidden.
translation:
  language: hi
  text: वहाँ से उठकर वह सूर के इलाके[a] में चला गया। वह एक घर में गया और नहीं चाहता था कि किसी को उसके वहाँ होने का पता चले[b], फिर भी वह छिपा न रह सका[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूर के क्षेत्र में”; यूनानी शब्द सूर से जुड़े भूभाग या सीमावर्ती इलाके का संकेत दे सकता है, केवल उसकी सीमा-रेखा का नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह नहीं चाहता था कि कोई जाने”; यूनानी में जानने का विषय निहित है और उसके वहाँ होने या उसके ठिकाने की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: या, “वह लोगों की नज़र से बच न सका।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐκεῖθεν δὲ
  choice: वहाँ से
  rationale: Ἐκεῖθεν पिछले स्थान से आगे बढ़ने को बताता है; δέ हल्का कथात्मक संयोजक है, जिसे स्वाभाविक हिन्दी में अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: ἀναστὰς ἀπῆλθεν
  choice: उठकर ... चला गया
  rationale: ἀναστὰς अगले कार्य का आरम्भ कराता है और ἀπῆλθεν प्रस्थान का भाव रखता है; यह प्रयोग हिन्दी कथा-शैली में सहज और अर्थनिष्ठ है।
- source_word: εἰς τὰ ὅρια Τύρου
  choice: सूर के इलाके में
  rationale: ὅρια यहाँ केवल सीमा-रेखा नहीं, सूर से संबंधित क्षेत्र या भूभाग को सूचित कर सकता है। 'इलाका' सामान्य आधुनिक हिन्दी में स्पष्ट है और मूल की अर्थ-सीमा बनाए रखता है।
- source_word: καὶ εἰσελθὼν εἰς οἰκίαν
  choice: वह एक घर में गया
  rationale: कृदन्त क्रमिक कार्य व्यक्त करता है और अनिश्चित οἰκίαν के लिए 'एक घर' उपयुक्त है।
- source_word: οὐδένα ἤθελεν γνῶναι
  choice: नहीं चाहता था कि किसी को उसके वहाँ होने का पता चले
  rationale: यूनानी में 'जानने' का विषय निहित है। हिन्दी में अर्थ स्पष्ट करने के लिए उसकी उपस्थिति को व्यक्त किया गया है, पर किसी अधिक विशिष्ट कारण को नहीं जोड़ा गया।
- source_word: καὶ οὐκ ἠδυνήθη λαθεῖν
  choice: फिर भी वह छिपा न रह सका
  rationale: λανθάνω का अर्थ ध्यान में आए बिना रहना या छिपा रहना है; 'फिर भी' उसकी इच्छा और वास्तविक परिणाम के बीच विरोध को सहज रूप से दर्शाता है।
