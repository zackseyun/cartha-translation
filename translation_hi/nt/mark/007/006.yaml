id: MRK.7.6
reference: Mark 7:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ ⸀δὲ εἶπεν ⸀αὐτοῖς· Καλῶς ἐπροφήτευσεν Ἠσαΐας περὶ ὑμῶν τῶν ὑποκριτῶν, ὡς γέγραπται ⸀ὅτι Οὗτος ὁ λαὸς τοῖς χείλεσίν με τιμᾷ, ἡ δὲ καρδία αὐτῶν πόρρω ἀπέχει ἀπ’ ἐμοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/006.yaml
  text: 'But he said to them[a], “Isaiah prophesied well about you hypocrites, as it is written: ‘This people honors me with their lips, but their heart is far from me.’”'
translation:
  language: hi
  text: 'पर उसने उनसे कहा, “यशायाह ने तुम कपटियों के विषय में ठीक ही भविष्यवाणी की थी, जैसा लिखा है: ‘ये लोग[a] अपने होंठों से मेरा आदर करते हैं, पर उनका हृदय मुझसे बहुत दूर है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल यूनानी में “लोग” सामूहिक एकवचन में है: “यह प्रजा अपने होंठों से मेरा आदर करती है, पर उसका हृदय मुझसे बहुत दूर है।”'
    reason: मूल पाठ के सामूहिक एकवचन और स्वाभाविक हिन्दी बहुवचन के बीच का अंतर स्पष्ट करना।
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले संवाद से हल्का विरोध और यीशु के प्रत्युत्तर की ओर मोड़ प्रकट करता है।
- source_word: Καλῶς ἐπροφήτευσεν
  choice: ठीक ही भविष्यवाणी की थी
  rationale: Καλῶς के सकारात्मक मूल्यांकन और ἐπροφήτευσεν के भविष्यद्वाणी-संबंधी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है; “ही” कथन की उपयुक्तता पर बल देता है।
- source_word: περὶ ὑμῶν τῶν ὑποκριτῶν
  choice: तुम कपटियों के विषय में
  rationale: περὶ ὑμῶν का संदर्भात्मक अर्थ और τῶν ὑποκριτῶν का श्रोताओं की सीधी पहचान के रूप में कठोर बल, दोनों सुरक्षित रहते हैं।
- source_word: ὡς γέγραπται ὅτι
  choice: 'जैसा लिखा है:'
  rationale: यह शास्त्रीय उद्धरण आरम्भ करने का स्वाभाविक हिन्दी सूत्र है; यूनानी ὅτι को हिन्दी में अलग “कि” से दोहराना आवश्यक नहीं।
- source_word: Οὗτος ὁ λαὸς
  choice: ये लोग
  rationale: सामूहिक λαός का आधुनिक, सरल और स्वाभाविक हिन्दी रूप; यूनानी के व्याकरणिक एकवचन की सूचना पादटिप्पणी में दी गई है।
- source_word: τοῖς χείλεσίν με τιμᾷ
  choice: अपने होंठों से मेरा आदर करते हैं
  rationale: χείλεσιν के साधनवाचक प्रयोग और τιμάω के ‘आदर करना’ अर्थ को स्पष्ट तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἡ δὲ καρδία αὐτῶν
  choice: पर उनका हृदय
  rationale: δὲ का विरोध और καρδία का एकवचन सामूहिक रूपक सुरक्षित रखा गया है; बहुवचन संबंधसूचक सर्वनाम हिन्दी में ‘ये लोग’ के साथ स्वाभाविक है।
- source_word: πόρρω ἀπέχει ἀπ’ ἐμοῦ
  choice: मुझसे बहुत दूर है
  rationale: यह वाक्यांश केवल भौतिक दूरी नहीं, बल्कि संबंधगत और आत्मिक दूरी बताता है; ‘बहुत दूर’ πόρρω के बल को व्यक्त करता है।
theological_decisions:
- issue: यशायाह 29:13 के कथन को यीशु द्वारा अपने श्रोताओं पर सीधे लागू करना
  choice: “तुम कपटियों” और उद्धरण के प्रत्यक्ष अभियोग को बिना नरम किए रखा गया है।
  alternative: कथन को सामान्य बनाकर केवल कपटपूर्ण उपासना के बारे में कहना
  rationale: यूनानी पाठ में यीशु स्पष्ट रूप से श्रोताओं को कपटी कहकर यशायाह की भविष्यवाणी उनके विषय में बताते हैं; अनुवाद को इस प्रत्यक्ष तनाव को बनाए रखना चाहिए।
- issue: λαός और καρδία की सामूहिक एकवचन भाषा
  choice: मुख्य पाठ में स्वाभाविक बहुवचन “ये लोग” के साथ एकवचन रूपक “हृदय” रखा और शाब्दिक सामूहिक एकवचन को पादटिप्पणी में बताया गया है।
  alternative: “यह प्रजा अपने होंठों से मेरा आदर करती है, पर उसका हृदय...”
  rationale: मुख्य पाठ साधारण आधुनिक पाठक के लिए सहज रहता है, जबकि पादटिप्पणी मूल की व्याकरणिक बनावट और सामूहिक चित्र को सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। “कपटी,” “भविष्यवाणी” और “हृदय” जैसे परिचित बाइबिलीय शब्द मूल के धार्मिक और अलंकारिक बल को बनाए रखते हैं; अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है।
