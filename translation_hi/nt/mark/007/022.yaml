base_translation:
  language: en
  yaml_path: translation/nt/mark/007/022.yaml
  text: adulteries[a], greed, wickedness, deceit, sensuality, an evil eye, slander, pride[b], foolishness.
translation:
  language: hi
  text: व्यभिचार के काम, लोभ, दुष्टताएँ, छल, उच्छृंखलता, बुरी नज़र[a], निंदा[b], घमंड और मूर्खता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘बुरी आँख’; यह ईर्ष्यालु, द्वेषपूर्ण, या कृपण और देने में अनिच्छुक दृष्टिकोण के लिए एक मुहावरा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ईशनिंदा’; यूनानी शब्द मनुष्यों के विरुद्ध बदनामी या अपमानजनक वाणी, और परमेश्वर के विरुद्ध ईशनिंदा, दोनों के लिए प्रयुक्त हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μοιχεῖαι
  choice: व्यभिचार के काम
  rationale: यूनानी बहुवचन बार-बार या विभिन्न रूपों में किए गए व्यभिचार के कृत्यों की ओर संकेत करता है; यह पदबंध हिन्दी में स्वाभाविक रहते हुए उस बहुवचन भाव को बनाए रखता है।
- source_word: πλεονεξίαι
  choice: लोभ
  rationale: यह शब्द अधिक पाने की लालसा और स्वार्थी हड़पने की प्रवृत्ति बताता है; ‘लोभ’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: πονηρίαι
  choice: दुष्टताएँ
  rationale: मूल में बहुवचन है और यह नैतिक बुराई की अनेक अभिव्यक्तियों को सूचित कर सकता है; ‘दुष्टताएँ’ उस रूप को सुरक्षित रखता है।
- source_word: δόλος
  choice: छल
  rationale: यह जान-बूझकर धोखा देने या कपट करने का भाव व्यक्त करता है; ‘छल’ संक्षिप्त, वर्तमान और सूची के अनुकूल है।
- source_word: ἀσέλγεια
  choice: निर्लज्ज भोग-विलास
  rationale: शब्द निर्लज्ज और बेलगाम आचरण को दर्शाता है, जो प्रायः यौन अनैतिकता से जुड़ा होता है; यह अनुवाद उसके निर्लज्ज और भोगप्रधान दोनों पहलुओं को व्यक्त करता है।
- source_word: ὀφθαλμὸς πονηρός
  choice: बुरी नज़र
  rationale: मूल रूपक को हिन्दी में बनाए रखा गया है; सन्दर्भगत अर्थ ईर्ष्यालु, द्वेषपूर्ण या कृपण दृष्टि हो सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: βλασφημία
  choice: निंदा
  rationale: यह हानि पहुँचाने वाली अपमानजनक वाणी के लिए प्रयुक्त हो सकता है; हिन्दी ‘निंदा’ मनुष्यों और परमेश्वर के विरुद्ध वाणी, दोनों की सम्भावना को खुला रखती है।
- source_word: ὑπερηφανία
  choice: घमंड
  rationale: यह अहंकारी आत्म-श्रेष्ठता को दर्शाता है; ‘घमंड’ सामान्य आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ἀφροσύνη
  choice: मूर्खता
  rationale: यह केवल कम बुद्धि नहीं, बल्कि नैतिक और व्यावहारिक विवेकहीनता को दर्शाता है; ‘मूर्खता’ सूची में स्वाभाविक है।
theological_decisions:
- issue: βλασφημία का लक्ष्य—मनुष्य या परमेश्वर
  choice: निंदा
  alternative: परमेश्वर की निंदा; बदनामी या अपमानजनक वाणी
  rationale: यूनानी शब्द मनुष्यों के विरुद्ध अपमानजनक निंदा और परमेश्वर के विरुद्ध ईशनिंदा, दोनों को व्यक्त कर सकता है। मुख्य पाठ में व्यापक ‘निंदा’ और पादटिप्पणी में दोनों सम्भावनाएँ देकर तनाव को अनिर्णीत रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। सूची की संक्षिप्त लय तथा जहाँ सम्भव हो वहाँ यूनानी बहुवचन का भाव सुरक्षित रखा गया है। ‘बुरी नज़र’ और ‘निंदा’ की वास्तविक अर्थगत व्यापकता पादटिप्पणियों में दी गई है।
