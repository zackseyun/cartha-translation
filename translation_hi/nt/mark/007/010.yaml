id: MRK.7.10
reference: Mark 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Μωϋσῆς γὰρ εἶπεν· Τίμα τὸν πατέρα σου καὶ τὴν μητέρα σου, καί· Ὁ κακολογῶν πατέρα ἢ μητέρα θανάτῳ τελευτάτω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/010.yaml
  text: For Moses said[a], ‘Honor your father and your mother,’ and[b], ‘Whoever speaks evil of father or mother must surely die.’
translation:
  language: hi
  text: क्योंकि मूसा ने कहा, “अपने पिता और अपनी माता का आदर करना,” और, “जो कोई पिता या माता को बुरा कहे,[a] वह निश्चय मर जाए।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शाप दे।” इस क्रिया का अर्थ बुरा कहना, अपमान करना या शाप देना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'या, “उसे अवश्य मार डाला जाए।” यूनानी में शाब्दिक रूप से एक विधिक सूत्र है: “वह मृत्यु से मरे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: यह इस बाइबलीय नाम का हिन्दी में मानक और सर्वमान्य रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह यीशु के पिछले कथन के समर्थन में कारण या व्याख्या प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἶπεν
  choice: ने कहा
  rationale: उद्धरण प्रस्तुत करने वाले साधारण भूतकालीन क्रिया-रूप का स्वाभाविक हिन्दी समतुल्य।
- source_word: Τίμα
  choice: आदर करना
  rationale: आज्ञार्थक रूप में यह माता-पिता को उचित मान और सम्मान देने की नैतिक आज्ञा व्यक्त करता है तथा हिन्दी में परिचित आज्ञात्मक शैली बनाए रखता है।
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα σου
  choice: अपने पिता और अपनी माता का
  rationale: दोनों संबंधों को मूल यूनानी की तरह स्पष्ट रूप से अलग-अलग रखता है; ‘अपने’ आज्ञा के संबोधित व्यक्ति से संबंध स्वाभाविक बनाता है।
- source_word: Ὁ κακολογῶν
  choice: जो कोई ... को बुरा कहे
  rationale: आर्टिकलयुक्त कृदंत की सामान्य, सार्वभौमिक शक्ति ‘जो कोई’ से व्यक्त होती है। ‘बुरा कहे’ κακολογέω के निन्दा करने, अपशब्द कहने या शाप देने के अर्थ-क्षेत्र को अनावश्यक रूप से केवल औपचारिक शाप तक सीमित नहीं करता।
- source_word: πατέρα ἢ μητέρα
  choice: पिता या माता को
  rationale: मूल में स्पष्ट स्वत्ववाचक सर्वनाम नहीं है; हिन्दी में भी यह सामान्य विधिक कथन बिना उसे जोड़े स्वाभाविक है।
- source_word: θανάτῳ τελευτάτω
  choice: वह निश्चय मर जाए
  rationale: यूनानी का यह सामी प्रभाव वाला गंभीर विधिक सूत्र शाब्दिक रूप से ‘मृत्यु से मरे’ जैसा है। ‘निश्चय मर जाए’ उसकी निश्चितता और तीसरे पुरुष की आज्ञार्थक विधिक शक्ति को बनाए रखता है, जबकि कर्तृवाच्य दण्ड-विधान को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: θανάτῳ τελευτάτω में विधिक मृत्युदण्ड सूत्र
  choice: वह निश्चय मर जाए
  alternative: उसे अवश्य मार डाला जाए
  rationale: मूल यूनानी मृत्यु की निश्चितता वाला रूढ़ विधिक सूत्र देता है, पर स्वयं निष्पादन करने वाले कर्ता को व्यक्त नहीं करता। मुख्य पाठ में अपेक्षाकृत रूप-सन्निकट वाक्य रखा गया है और दण्ड दिए जाने की सम्भावित व्याख्या पादटिप्पणी में दी गई है।
- issue: κακολογῶν का अर्थ-क्षेत्र
  choice: बुरा कहे
  alternative: शाप दे
  rationale: क्रिया में बुरा कहना, निन्दा करना, अपमान करना या शाप देना सम्मिलित हो सकता है। मुख्य पाठ व्यापक अर्थ रखता है और अधिक संकीर्ण ‘शाप दे’ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। आज्ञाओं के उद्धरण में परिचित बाइबलीय लय बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
