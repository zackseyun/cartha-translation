  text: And he was saying, “What comes out from the man—that defiles the man.”
translation:
  language: hi
  text: और वह कहता रहा, “जो मनुष्य के भीतर से निकलता है, वही मनुष्य को अशुद्ध करता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मनुष्य को अपवित्र करता है।” यूनानी क्रिया शुद्धता-अशुद्धता से जुड़ी भाषा है और किसी को अशुद्ध या अपवित्र बनाने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: वह कहता रहा
  rationale: अपूर्ण भूतकाल चल रहे या बार-बार दिए जा रहे कथन का संकेत करता है; ‘कहता रहा’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ बिना अनावश्यक विरोध जोड़े निरंतरता रखता है।
- source_word: Τὸ ἐκ τοῦ ἀνθρώπου ἐκπορευόμενον
  choice: जो मनुष्य के भीतर से निकलता है
  rationale: संज्ञात्मक कृदन्त-वाक्यांश को सहज हिन्दी में ‘जो ... निकलता है’ कहा गया है। प्रसंग में बाहर निकलने की तुलना भीतर से आने वाली वस्तु से है, इसलिए ‘भीतर से’ आशय स्पष्ट करता है।
- source_word: ἀνθρώπου / ἄνθρωπον
  choice: मनुष्य
  rationale: ἄνθρωπος यहाँ सामान्य, प्रतिनिधिक अर्थ में है। ‘मनुष्य’ आधुनिक मानक हिन्दी में इस व्यापक मानवीय संदर्भ और दोनों प्रयोगों की शब्दगत समानता को बनाए रखता है।
- source_word: ἐκεῖνο
  choice: वही
  rationale: 'संकेतवाचक सर्वनाम का बल ‘वही’ से व्यक्त होता है: बाहर निकलने वाली वही वस्तु मनुष्य को अशुद्ध करती है।'
- source_word: κοινοῖ
  choice: अशुद्ध करता है
  rationale: शुद्धता-अशुद्धता के इस प्रसंग में κοινόω का अर्थ ‘अपवित्र/अशुद्ध करना’ है; ‘अशुद्ध करता है’ धार्मिक शुद्धता की पृष्ठभूमि को स्पष्ट और सहज रूप में रखता है।
theological_decisions:
- issue: κοινόω में शुद्धता-संबंधी भाषा
  choice: अशुद्ध करता है
  alternative: अपवित्र करता है
  rationale: ‘अशुद्ध करता है’ यहूदी शुद्धता-व्यवस्था की वैचारिक पृष्ठभूमि को सीधे व्यक्त करता है, जबकि ‘अपवित्र करता है’ नैतिक या पवित्रता-संबंधी अर्थ में भी समझा जा सकता है। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मनुष्य’ से यूनानी के सामान्य मानवीय अर्थ और वाक्य के दोहराव को सुरक्षित रखा गया है; ‘वही’ मूल के बलाघात को दर्शाता है।
