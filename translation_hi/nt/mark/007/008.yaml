  text: ⸀ἀφέντες τὴν ἐντολὴν τοῦ θεοῦ κρατεῖτε τὴν παράδοσιν τῶν ⸀ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/008.yaml
  text: Leaving the commandment of God[a], you hold fast to the tradition of men.
translation:
  language: hi
  text: परमेश्वर की आज्ञा को छोड़कर तुम मनुष्यों[a] की परंपरा को दृढ़ता से थामे रहते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोगों की’; यूनानी शब्द सामान्यतः मनुष्यों को सूचित करता है और यहाँ मानवीय बात का परमेश्वर से आने वाली बात के साथ विरोध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφέντες (ἀφίημι)
  choice: छोड़कर
  rationale: क्रियाविशेषणीय कृदंत मुख्य क्रिया के साथ जुड़ी हुई पूर्ववर्ती या सहवर्ती क्रिया व्यक्त करता है। ‘छोड़कर’ स्वाभाविक हिंदी में किसी बात को अलग रख देने का भाव देता है, बिना ‘त्याग देने’ की अधिक तीखी व्याख्या जोड़े।
- source_word: ἐντολὴν
  choice: आज्ञा
  rationale: धार्मिक और दैवी दायित्व के संदर्भ में ‘आज्ञा’ औपचारिकता तथा अधिकार दोनों को स्वाभाविक हिंदी में सुरक्षित रखती है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: यह संबंधकारक आज्ञा के दैवी स्रोत या संबंध को व्यक्त करता है; ‘परमेश्वर की’ हिंदी में सीधा और स्पष्ट रूप है।
- source_word: κρατεῖτε
  choice: दृढ़ता से थामे रहते हो
  rationale: κρατέω यहाँ केवल मानने नहीं, बल्कि मजबूती से चिपके रहने या पालन पकड़े रहने का भाव देता है। यह पदबंध उस दृढ़ आसक्ति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παράδοσιν
  choice: परंपरा
  rationale: παράδοσις के लिए ‘परंपरा’ प्रचलित और सटीक शब्द है तथा यहाँ पीढ़ी-दर-पीढ़ी सौंपी गई मानवीय प्रथा का संकेत देता है।
- source_word: ἀνθρώπων
  choice: मनुष्यों
  rationale: बहुवचन ἀνθρώπων सामान्य रूप से मानवों को सूचित करता है, केवल पुरुषों को नहीं। ‘मनुष्यों’ परमेश्वर से आने वाली आज्ञा और मानव-स्रोत वाली परंपरा के तीखे विरोध को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर की आज्ञा और मानवीय परंपरा के बीच विरोध
  choice: ‘परमेश्वर की आज्ञा’ के सामने ‘मनुष्यों की परंपरा’ रखकर मूल का स्पष्ट विरोध सुरक्षित रखा गया है।
  alternative: ‘लोगों की परंपरा’ कहना या वाक्य को सामान्यतः हर परंपरा की निंदा के रूप में विस्तार देना।
  rationale: पद का बल मानव-स्रोत वाली परंपरा को परमेश्वर की आज्ञा से ऊपर रखने की भर्त्सना पर है। अनुवाद इस विरोध को बनाए रखता है, पर मूल से आगे बढ़कर सभी परंपराओं के विरुद्ध सार्वभौमिक दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन संबोधन के रूप में संदर्भानुकूल है। ‘दृढ़ता से थामे रहते हो’ मूल क्रिया की प्रबल आसक्ति को व्यक्त करता है, जबकि वाक्य-विन्यास हिंदी में स्वाभाविक है।
