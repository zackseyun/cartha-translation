  text: All these evil things come out from within and defile the man[a].
translation:
  language: hi
  text: ये सभी बुरी बातें भीतर से निकलती हैं और मनुष्य[a] को अशुद्ध करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में एकवचन ‘मनुष्य’ है, जिसका प्रयोग यहाँ सामान्य रूप से किसी भी मानव व्यक्ति के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα ταῦτα τὰ πονηρά
  choice: ये सभी बुरी बातें
  rationale: यह पदबंध पिछले पदों में गिनाई गई बुराइयों की ओर संकेत करते हुए उनकी समग्रता पर बल देता है। ‘बुरी बातें’ विशेषण के संज्ञात्मक प्रयोग और ठोस बहुवचन भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔσωθεν
  choice: भीतर से
  rationale: यह क्रियाविशेषण आंतरिक उद्गम बताता है और प्रसंग में बाहरी तथा भीतरी अशुद्धता के बीच के विरोध को सुरक्षित रखता है।
- source_word: ἐκπορεύεται
  choice: निकलती हैं
  rationale: यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ क्रिया एकवचन है, पर हिन्दी में बहुवचन क्रिया स्वाभाविक और व्याकरणसम्मत है। ‘निकलती हैं’ भीतर से बाहर आने की गति को स्पष्ट करता है।
- source_word: κοινοῖ
  choice: अशुद्ध करती हैं
  rationale: मरकुस 7 के शुद्धता-संबंधी प्रसंग में κοινόω का अर्थ किसी को अपवित्र या अशुद्ध करना है। ‘अशुद्ध करती हैं’ सामान्य पाठक के लिए स्पष्ट है और धार्मिक तथा नैतिक अशुद्धता के अर्थ को खुला रखता है।
- source_word: τὸν ἄνθρωπον
  choice: मनुष्य
  rationale: ἄνθρωπος यहाँ किसी एक पुरुष तक सीमित न होकर सामान्य रूप से मानव व्यक्ति के लिए प्रयुक्त है। हिन्दी का ‘मनुष्य’ व्याकरणिक एकवचन और सार्वत्रिक आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: सामान्य मानव के लिए τὸν ἄνθρωπον का अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति; आदमी
  rationale: कथन समस्त मानव व्यक्तियों पर लागू होने वाला सामान्य कथन है। ‘मनुष्य’ यूनानी एकवचन को बनाए रखते हुए हिन्दी में स्त्री और पुरुष दोनों को समेटता है; ‘आदमी’ आधुनिक प्रयोग में पुरुष-विशेष भी समझा जा सकता है।
- issue: κοινοῖ में अशुद्धता का स्वरूप
  choice: अशुद्ध करती हैं
  alternative: अपवित्र करती हैं
  rationale: आसपास का प्रसंग धार्मिक शुद्धता से जुड़ा है, जबकि सूचीबद्ध बुराइयाँ नैतिक आयाम भी रखती हैं। ‘अशुद्ध’ दोनों आयामों को समेटता है और किसी एक धर्मवैधानिक व्याख्या तक अर्थ को सीमित नहीं करता।
