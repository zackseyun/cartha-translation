source:
  edition: SBLGNT
  text: ⸂ἀλλ’ εὐθὺς ἀκούσασα⸃ γυνὴ περὶ αὐτοῦ, ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον, ἐλθοῦσα προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/025.yaml
  text: But immediately a woman whose little daughter had an unclean spirit[a], having heard about him[c][b], came and fell at his feet.
translation:
  language: hi
  text: पर उसके विषय में सुनते ही, एक स्त्री—जिसकी छोटी बेटी में अशुद्ध आत्मा थी—आई और उसके पाँवों पर गिर पड़ी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλ’
  choice: पर
  rationale: यह पिछले प्रसंग से जुड़ा हल्का विरोधात्मक अथवा संक्रमणात्मक भाव बनाए रखता है और हिन्दी कथा में स्वाभाविक है।
- source_word: εὐθὺς ἀκούσασα ... περὶ αὐτοῦ
  choice: उसके विषय में सुनते ही
  rationale: εὐθύς और कृदन्त ἀκούσασα के निकट संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और सुनने के तुरंत बाद हुई प्रतिक्रिया का भाव देता है; वाक्य-विन्यास की दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: अनिश्चित, पहली बार प्रस्तुत पात्र को हिन्दी में स्वाभाविक ढंग से सामने लाता है।
- source_word: ἧς εἶχεν τὸ θυγάτριον αὐτῆς πνεῦμα ἀκάθαρτον
  choice: जिसकी छोटी बेटी में एक अशुद्ध आत्मा थी
  rationale: सम्बन्धवाचक उपवाक्य और ‘अशुद्ध आत्मा होना’ का मूल भाव सुरक्षित रखते हुए हिन्दी में स्पष्ट संरचना देता है।
- source_word: θυγάτριον
  choice: छोटी बेटी
  rationale: लघुतासूचक रूप का भाव और स्त्री के साथ पारिवारिक संबंध—दोनों सुरक्षित रहते हैं।
- source_word: πνεῦμα ἀκάθαρτον
  choice: अशुद्ध आत्मा
  rationale: मरकुस की पारिभाषिक अभिव्यक्ति का सीधा अनुवाद है; ‘दुष्टात्मा’ या ‘दुष्टात्मा-ग्रस्त’ कहने से मूल में निहित ‘अशुद्ध’ का भाव दब जाता।
- source_word: ἐλθοῦσα
  choice: आई
  rationale: कृदन्त को हिन्दी कथा में स्वाभाविक क्रमिक क्रिया के रूप में व्यक्त करता है।
- source_word: προσέπεσεν πρὸς τοὺς πόδας αὐτοῦ
  choice: उसके पाँवों पर गिर पड़ी
  rationale: विनती और दीनता की शारीरिक मुद्रा को बिना अनावश्यक व्याख्या के स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πνεῦμα ἀκάθαρτον का अनुवाद
  choice: अशुद्ध आत्मा
  alternative: अपवित्र आत्मा; दुष्टात्मा
  rationale: ‘अशुद्ध आत्मा’ मूल शब्दावली तथा उसके शुद्ध-अशुद्ध संबंधी अर्थ-संकेत को बनाए रखता है। ‘दुष्टात्मा’ सम्भावित अभिप्राय बताता है, पर वह अधिक व्याख्यात्मक है।
- issue: εὐθύς का संबंध
  choice: सुनते ही
  alternative: तुरन्त एक स्त्री ... सुनकर आई
  rationale: शब्दक्रम εὐθὺς ἀκούσασα को निकटता से जोड़ता है, इसलिए मुख्य पाठ सुनने और तत्क्षण प्रतिक्रिया के संबंध को दर्शाता है; फिर भी यूनानी वाक्य में क्रियाविशेषण का व्यापक कथात्मक प्रभाव सम्भव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘पर’, ‘सुनते ही’ और ‘गिर पड़ी’ कथा को सहज रखते हैं, जबकि ‘अशुद्ध आत्मा’ मूल की धार्मिक शब्दावली और गरिमा सुरक्षित रखता है।
