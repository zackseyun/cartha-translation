review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the imperfect ἔλεγεν, the ironic force of καλῶς, the purposive ἵνα clause, and the contrast between God's command and the audience's tradition. However, ‘टाल देते हो’ commonly suggests postponement in modern Hindi and can understate ἀθετεῖτε (‘set aside/reject/nullify’). ‘बनाए रखो’ may mean preserving a tradition rather than keeping/observing it.
  naturalness: The wording is broadly understandable, but ‘ताकि अपनी परंपरा को बनाए रखो’ is less idiomatic for observing a tradition. ‘ताकि अपनी परंपरा का पालन कर सको’ is natural and directly expresses the intended contrast. An exclamation mark is not required by the Greek and is omitted.
  terminology: ‘परमेश्वर की आज्ञा’ and ‘परंपरा’ are suitable, dignified modern Hindi equivalents. ‘किनारे कर देते हो’ accurately conveys deliberate setting aside without importing the stronger technical sense of ‘रद्द करना.’
  issues:
  - severity: medium
    issue: ‘टाल देते हो’ for ἀθετεῖτε
    rationale: In current Hindi this often means delaying or evading something temporarily. The Greek denotes setting aside, rejecting, or nullifying God's command, not merely postponing it.
  - severity: low
    issue: ‘अपनी परंपरा को बनाए रखो’ for τηρήσητε
    rationale: This can suggest maintaining the continued existence of a tradition. In this context τηρέω more directly means keeping or observing the tradition.
  - severity: low
    issue: Added exclamation mark
    rationale: The irony is conveyed lexically; the Greek punctuation and wording do not require an exclamation mark.
