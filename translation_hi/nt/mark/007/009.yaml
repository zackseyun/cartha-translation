  text: Καὶ ἔλεγεν αὐτοῖς· Καλῶς ἀθετεῖτε τὴν ἐντολὴν τοῦ θεοῦ, ἵνα τὴν παράδοσιν ὑμῶν ⸀τηρήσητε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/009.yaml
  text: And he was saying to them[a], “You neatly set aside the commandment of God so that you may keep your tradition.”
translation:
  language: hi
  text: और वह उनसे कहता रहा, “तुम बड़ी कुशलता से परमेश्वर की आज्ञा को किनारे कर देते हो, ताकि अपनी परंपरा का पालन कर सको।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अच्छा करते हो कि परमेश्वर की आज्ञा को किनारे कर देते हो, ताकि अपनी परंपरा का पालन कर सको।” यहाँ यूनानी शब्द व्यंग्य में प्रयुक्त है, प्रशंसा के रूप में नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण काल वचन के जारी रहने या दोहराए जाने का भाव दे सकता है; ‘कहता रहा’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Καλῶς
  choice: बड़ी कुशलता से
  rationale: यहाँ क्रियाविशेषण व्यंग्यात्मक है। यह चुनाव प्रशंसा का भ्रम पैदा किए बिना उनके द्वारा परमेश्वर की आज्ञा को हटाने की विडंबनापूर्ण ‘कुशलता’ व्यक्त करता है।
- source_word: ἀθετεῖτε
  choice: टाल देते हो
  rationale: इस क्रिया का अर्थ अस्वीकार करना, अलग कर देना या निष्प्रभावी करना हो सकता है। ‘टाल देते हो’ जानबूझकर आज्ञा को किनारे करने का सहज भाव देता है और आगे ‘बनाए रखो’ से स्पष्ट विरोध बनाता है।
- source_word: ἐντολὴν τοῦ θεοῦ
  choice: परमेश्वर की आज्ञा
  rationale: यह स्वाभाविक हिन्दी में ईश्वरीय अधिकार और सामने रखी मानवीय परंपरा के बीच औपचारिक विरोध को सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा अभिप्रेत परिणाम का अर्थ संक्षेप और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: παράδοσιν ὑμῶν
  choice: अपनी परंपरा
  rationale: παράδοσις के सौंपे चले आने वाले प्रचलन के अर्थ को सामान्य आधुनिक हिन्दी में ‘परंपरा’ ठीक व्यक्त करता है; ‘अपनी’ परमेश्वर की आज्ञा से इसका विरोध उभारता है।
- source_word: τηρήσητε
  choice: बनाए रखो
  rationale: यह पाठ के τηρήσητε के ‘सुरक्षित रखना/कायम रखना’ भाव को व्यक्त करता है और आज्ञा को टालने के साथ तीखा विरोध रचता है।
theological_decisions:
- issue: यीशु के कथन का स्वर
  choice: सीधी प्रशंसा नहीं, बल्कि व्यंग्यपूर्ण फटकार
  alternative: 'शाब्दिक प्रशंसा: ‘तुम अच्छा करते हो कि...’'
  rationale: संदर्भ में यीशु परमेश्वर की आज्ञा पर मानवीय परंपरा को प्रधान करने की निंदा कर रहे हैं। ‘बड़ी कुशलता से’ καλῶς के व्यंग्य को दिखाता है, पर उसे अनुमोदन में नहीं बदलता।
- issue: ἵνα का संबंध
  choice: अपनी परंपरा बनाए रखने के उद्देश्य को व्यक्त करना
  alternative: 'केवल परिणाम: ‘जिससे तुम्हारी परंपरा बनी रहती है’'
  rationale: ἵνα उद्देश्य और अभिप्रेत परिणाम दोनों की छाया रख सकता है। ‘ताकि’ प्राथमिक उद्देश्यगत बल को बचाता है, जबकि प्रसंग में परिणाम का संकेत भी खुला रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘बड़ी कुशलता से’ व्यंग्य को साधारण पाठक के लिए सुनाई देने योग्य बनाता है; विस्मयादिबोधक चिह्न फटकार के तीखे स्वर का संकेत देता है।
