source:
  edition: SBLGNT
  text: ⸀καὶ ἐπερωτῶσιν αὐτὸν οἱ Φαρισαῖοι καὶ οἱ γραμματεῖς· Διὰ τί ⸂οὐ περιπατοῦσιν οἱ μαθηταί σου⸃ κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων, ἀλλὰ ⸀κοιναῖς χερσὶν ἐσθίουσιν τὸν ἄρτον;
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/005.yaml
  text: And the Pharisees and the scribes asked him[a], “Why do your disciples not walk according to the tradition of the elders, but eat bread with unclean hands?”
translation:
  language: hi
  text: तब फ़रीसियों और शास्त्रियों ने उससे पूछा, “तुम्हारे शिष्य पूर्वजों की परंपरा के अनुसार क्यों नहीं चलते, बल्कि अशुद्ध हाथों से[a] रोटी खाते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “साधारण हाथों से”; यहाँ आशय धार्मिक रीति से अशुद्ध माने गए हाथों से है, न कि केवल मैले हाथों से।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπερωτῶσιν
  choice: पूछा
  rationale: वर्तमान काल यहाँ ऐतिहासिक वर्तमान है; हिन्दी कथा-शैली में सामान्य भूतकाल स्वाभाविक है।
- source_word: γραμματεῖς
  choice: शास्त्रियों
  rationale: सुसमाचारों के संदर्भ में यह मान्य धार्मिक-कानूनी विद्वानों के वर्ग का प्रचलित और संक्षिप्त हिन्दी नाम है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाले यूनानी पद का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: περιπατοῦσιν
  choice: चलते
  rationale: मूल के ‘चलना’ रूपक को बनाए रखता है; संदर्भ में इसका अर्थ आचरण करना है।
- source_word: κατὰ τὴν παράδοσιν τῶν πρεσβυτέρων
  choice: पुरखों की परंपरा के अनुसार
  rationale: κατά के अनुरूप होने के भाव को ‘के अनुसार’ व्यक्त करता है। πρεσβύτεροι यहाँ पहले के परंपरागत प्राधिकारियों को दर्शाता है; ‘पुरखे’ आधुनिक हिन्दी में वर्तमान कलीसियाई पद ‘प्राचीन’ से होने वाली भ्रांति से बचाता है।
- source_word: κοιναῖς χερσὶν
  choice: अशुद्ध हाथों से
  rationale: κοινός का यहाँ अर्थ साधारण या गंदा नहीं, बल्कि धार्मिक रीति से अपवित्र ठहराया हुआ है। ‘अशुद्ध’ सहज हिन्दी में इस अनुष्ठानिक भाव को व्यक्त करता है।
- source_word: τὸν ἄρτον
  choice: रोटी
  rationale: मूल में ‘रोटी’ है, जो भोजन के लिए भी प्रयुक्त हो सकती है; इसे ‘भोजन’ बनाकर अर्थ का विस्तार नहीं किया गया।
theological_decisions:
- issue: κοινός से सूचित शुद्ध-अशुद्ध की स्थिति
  choice: ‘अशुद्ध’ रखा गया और पादटिप्पणी में अनुष्ठानिक आशय स्पष्ट किया गया।
  alternative: अपवित्र; साधारण; बिना धोए हुए
  rationale: विवाद स्वच्छता या नैतिक बुराई पर नहीं, परंपरा के अनुसार धार्मिक शुद्धता पर है। अनुवाद उस तनाव को बनाए रखता है और आगे के कथन का निष्कर्ष पहले से आरोपित नहीं करता।
- issue: τῶν πρεσβυτέρων की पहचान
  choice: ‘पुरखों’
  alternative: प्राचीनों; बुज़ुर्गों; धर्मगुरुओं
  rationale: यह वाक्य पूर्वकालीन यहूदी परंपरागत प्राधिकारियों की ओर संकेत करता है। ‘पुरखों’ उस ऐतिहासिक परंपरा को सहजता से व्यक्त करता है, बिना किसी आधुनिक कलीसियाई पद का संकेत दिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने वाली हिन्दी। ‘चलते’ मूल रूपक को बनाए रखता है, जबकि ‘पुरखों की परंपरा’ और ‘अशुद्ध हाथ’ संदर्भ को सामान्य पाठक के लिए स्पष्ट रखते हैं। पादटिप्पणी-चिह्न [a] उसी पदबंध के तुरंत बाद रखा गया है जिसे वह समझाता है।
