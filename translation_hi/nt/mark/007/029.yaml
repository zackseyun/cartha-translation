  text: καὶ εἶπεν αὐτῇ· Διὰ τοῦτον τὸν λόγον ὕπαγε, ἐξελήλυθεν ⸂ἐκ τῆς θυγατρός σου τὸ δαιμόνιον⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/029.yaml
  text: And he said to her[a], “Because of this word, go; the demon has gone out of your daughter.”
translation:
  language: hi
  text: और उसने उससे कहा, “इस बात के कारण[a], जाओ; दुष्टात्मा तुम्हारी बेटी में से निकल चुकी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस कथन के कारण।”
    reason: λόγος का यहाँ ‘बात’ या ‘कथन’ दोनों रूपों में अनुवाद संभव है।
lexical_decisions:
- source_word: Διὰ τοῦτον τὸν λόγον
  choice: इस बात के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण प्रकट करता है, और λόγος स्त्री के ठीक पहले दिए गए उत्तर की ओर संकेत करता है। ‘इस बात के कारण’ यूनानी की कारणवाचकता और एकवचन भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ὕπαγε
  choice: जाओ
  rationale: यह वर्तमानकालीन आज्ञार्थक रूप यहाँ विदा करने की आज्ञा देता है। ‘जाओ’ संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ἐξελήλυθεν
  choice: निकल चुकी है
  rationale: यूनानी पूर्णकाल ऐसी पूरी हो चुकी क्रिया बताता है जिसका परिणाम वर्तमान में बना हुआ है। ‘निकल चुकी है’ इस पूर्णता और बने हुए परिणाम, दोनों को स्पष्ट करता है।
- source_word: ἐκ τῆς θυγατρός σου
  choice: तुम्हारी बेटी में से
  rationale: ἐκ उस व्यक्ति के भीतर से बाहर निकलने का भाव देता है। ‘में से’ मूल की स्थान-संबंधी छवि को हिन्दी में सुरक्षित रखता है।
- source_word: τὸ δαιμόνιον
  choice: दुष्टात्मा
  rationale: δαιμόνιον यहाँ एक व्यक्तिगत दुष्ट आत्मिक सत्ता को दर्शाता है। ‘दुष्टात्मा’ सामान्य हिन्दी बाइबलीय प्रयोग में स्वाभाविक है और इसे बीमारी या केवल बुरे प्रभाव के रूप में हल्का नहीं करता।
- source_word: καὶ εἶπεν αὐτῇ
  choice: और उसने उससे कहा
  rationale: यह सीधा कथात्मक परिचय है। ‘और’ καί को अनावश्यक कालक्रमिक अर्थ जोड़े बिना दर्शाता है।
theological_decisions:
- issue: दुष्टात्मा के निकलने संबंधी कथन को अलौकिक अर्थ से खाली न करना
  choice: दुष्टात्मा तुम्हारी बेटी में से निकल चुकी है
  alternative: बुरी शक्ति ने तुम्हारी बेटी को छोड़ दिया है
  rationale: मूल पाठ स्पष्ट रूप से δαιμόνιον का उल्लेख करता है और उसके बेटी में से निकल जाने की बात कहता है। चुना हुआ रूप व्यक्तिगत दुष्ट आत्मिक सत्ता तथा निष्कासन की भाषा, दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘तुम्हारी’ और ‘जाओ’ सामान्य आधुनिक संबोधन देते हैं; मूल यूनानी सम्मान-स्तर को अलग से निर्धारित नहीं करता।
