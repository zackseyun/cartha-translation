  text: ὅτι οὐκ εἰσπορεύεται αὐτοῦ εἰς τὴν καρδίαν ἀλλ’ εἰς τὴν κοιλίαν, καὶ εἰς τὸν ἀφεδρῶνα ἐκπορεύεται; —⸀καθαρίζων πάντα τὰ βρώματα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/019.yaml
  text: because it does not enter into his heart but into his stomach[a], and goes out into the latrine"—thus cleansing all foods.
translation:
  language: hi
  text: क्योंकि वह उसके हृदय में नहीं, बल्कि पेट में जाता है और शौच-स्थान में निकल जाता है।” (इस प्रकार सभी खाद्य पदार्थों को शुद्ध करते हुए।)[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और शौच-स्थान में निकलकर सभी खाद्य पदार्थों को शुद्ध करता है।” इस पाठ में अंतिम वाक्यांश को मरकुस की व्याख्यात्मक टिप्पणी के बजाय पाचन और मल-त्याग की प्रक्रिया से जोड़ा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: καρδίαν
  choice: हृदय
  rationale: शारीरिक पाचन-तंत्र के विपरीत मनुष्य के भीतरी व्यक्तित्व का बाइबलीय चित्र बनाए रखने के लिए मूल रूपक को सुरक्षित रखा गया है।
- source_word: κοιλίαν
  choice: पेट
  rationale: पाचन के इस संदर्भ में यह आधुनिक हिन्दी का सहज और स्पष्ट शारीरिक शब्द है।
- source_word: ἀφεδρῶνα
  choice: शौच-स्थान
  rationale: यह मल-त्याग के स्थान को ठोस किंतु गरिमापूर्ण ढंग से व्यक्त करता है और आधुनिक नलसाजी की अनावश्यक कल्पना नहीं जोड़ता।
- source_word: καθαρίζων
  choice: शुद्ध कर रहा था
  rationale: वर्तमान कृदन्त के सतत भाव और ‘शुद्ध करने’ के सीधे अर्थ को रखा गया है; मुख्य पाठ इसे मरकुस की व्याख्यात्मक टिप्पणी के रूप में पढ़ता है, बिना ‘घोषित किया’ जैसा अतिरिक्त क्रियार्थ जोड़े।
- source_word: βρώματα
  choice: सभी भोजनों
  rationale: बहुवचन विभिन्न प्रकार की खाद्य वस्तुओं को सूचित करता है; ‘भोजन’ का आदरसूचक बहुवचन नहीं, बल्कि श्रेणीगत बहुवचन यहाँ उपयुक्त है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: सर्वनाम संदर्भ में उस व्यक्ति की ओर लौटता है जिसके भीतर भोजन जाता है।
- source_word: εἰσπορεύεται / ἐκπορεύεται
  choice: जाता है / निकल जाता है
  rationale: अंदर जाने और बाहर निकलने की विपरीत गतियों को सरल, स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: καθαρίζων πάντα τὰ βρώματα की वाक्यगत व्याख्या
  choice: 'मरकुस की व्याख्यात्मक टिप्पणी: ‘इस प्रकार वह सभी भोजनों को शुद्ध कर रहा था’'
  alternative: 'पाचन-क्रिया से संबंधित अर्थ: ‘और शौच-स्थान में निकलकर सभी भोजनों को साफ कर देता है’'
  rationale: पुल्लिंग एकवचन कृदन्त को यीशु की शिक्षा के निहितार्थ पर मरकुस की टिप्पणी मानना व्याकरण और व्यापक प्रसंग के अनुकूल है। फिर भी इसे पाचन और मल-त्याग की प्रक्रिया से जोड़ना व्याकरणतः संभव है, इसलिए वास्तविक और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘हृदय’ और ‘शुद्ध’ जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं, जबकि शारीरिक प्रक्रिया के लिए सहज आधुनिक शब्दावली अपनाई गई है।
