  text: Καὶ πάλιν ἐξελθὼν ἐκ τῶν ὁρίων Τύρου ⸂ἦλθεν διὰ Σιδῶνος εἰς⸃ τὴν θάλασσαν τῆς Γαλιλαίας ἀνὰ μέσον τῶν ὁρίων Δεκαπόλεως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/031.yaml
  text: And again[a], after departing from the region of Tyre, he came through Sidon to the Sea of Galilee[b], through the midst of the region of the Decapolis.
translation:
  language: hi
  text: फिर वह सूर के क्षेत्र से निकलकर सीदोन से होते हुए[a] गलील झील तक आया, दिकापुलिस के क्षेत्र के बीच से होकर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सीदोन के रास्ते।’ यूनानी वाक्यांश का अर्थ सीदोन से होकर या उसके मार्ग से यात्रा करना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘दिकापुलिस के क्षेत्र या क्षेत्रों के बीच से।’ यूनानी अभिव्यक्ति का अधिक शाब्दिक अर्थ ‘बीच में/मध्य से’ हो सकता है, और यहाँ बताए गए यात्रा-मार्ग को भौगोलिक रूप से समझना कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह कथा में नए सिरे से होने वाली गतिविधि को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ἐξελθὼν
  choice: निकलकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की गतिविधि बताता है; ‘निकलकर’ क्रम को स्पष्ट रखते हुए हिंदी में सहज है।
- source_word: ἐκ τῶν ὁρίων Τύρου
  choice: सूर के क्षेत्र से
  rationale: यहाँ ὅρια सीमा-रेखा से अधिक किसी भूभाग या इलाके को सूचित करता है; ‘क्षेत्र’ उसी अर्थ को स्वाभाविक ढंग से देता है।
- source_word: ἦλθεν
  choice: आया
  rationale: यह ἔρχομαι का सामान्य अर्थ सुरक्षित रखता है और यूनानी कथन के दृष्टिकोण को अनावश्यक रूप से ‘गया’ में नहीं बदलता।
- source_word: διὰ Σιδῶνος
  choice: सीदोन से होते हुए
  rationale: संबंधकारक के साथ διά किसी स्थान से होकर या उसके रास्ते यात्रा को दर्शाता है।
- source_word: εἰς τὴν θάλασσαν τῆς Γαλιλαίας
  choice: गलील झील पर
  rationale: θάλασσα का शाब्दिक अर्थ ‘समुद्र’ है, पर यह जलाशय झील है; ‘गलील झील’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक भौगोलिक नाम है।
- source_word: ἀνὰ μέσον
  choice: के बीच से होकर
  rationale: यह असामान्य स्थानवाचक अभिव्यक्ति बीच या मध्य से होकर जाने का भाव रखती है; अनुवाद उस स्थानिक तनाव को सपाट नहीं करता।
- source_word: τῶν ὁρίων Δεκαπόλεως
  choice: दिकापुलिस के क्षेत्र
  rationale: ὅρια यहाँ प्रादेशिक भूभाग को दर्शाता है और Δεκάπολις को ऐतिहासिक क्षेत्र के उचित नाम के रूप में लिप्यंतरित किया गया है।
