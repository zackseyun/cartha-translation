  yaml_path: translation/nt/mark/007/013.yaml
  text: thus nullifying the word of God by your tradition that you have handed down[c][b][a]. And you do many other similar things.
translation:
  language: hi
  text: इस प्रकार तुम परमेश्वर के वचन को अपनी उस परंपरा के द्वारा निष्प्रभावी करते हो, जिसे तुमने आगे पहुँचाया है।[a][b] और तुम ऐसी और भी बहुत-सी बातें करते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अमान्य कर देते हो’ अथवा ‘व्यर्थ कर देते हो’।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिसे तुमने आगे सौंपा है’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκυροῦντες
  choice: निष्प्रभावी कर देते हो
  rationale: यह क्रिया परमेश्वर के वचन को प्रभावहीन या अमान्य कर देने का भाव रखती है। यह हिंदी अभिव्यक्ति आरोप की तीव्रता को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: ‘वचन’ λόγος का सीधा और इस शास्त्रीय विवाद के संदर्भ में उपयुक्त अनुवाद है; संबंधकारक रचना भी बनी रहती है।
- source_word: τῇ παραδόσει ὑμῶν
  choice: अपनी उस परंपरा के द्वारा
  rationale: 'करणवाचक दत्तिव का अर्थ स्पष्ट किया गया है: उनकी परंपरा वह साधन है जिसके द्वारा वे परमेश्वर के वचन को निष्प्रभावी करते हैं। ‘अपनी’ यूनानी के ‘तुम्हारी’ को स्वाभाविक हिंदी में व्यक्त करता है।'
- source_word: ᾗ παρεδώκατε
  choice: जिसे तुमने आगे पहुँचाया है
  rationale: παραδίδωμι के परंपरा को दूसरों तक संचारित करने के भाव को सहज आधुनिक हिंदी में व्यक्त करता है और παράδοσις के साथ शब्दार्थ-संबंध बनाए रखता है।
- source_word: παρόμοια τοιαῦτα πολλὰ
  choice: ऐसे ही बहुत-से दूसरे काम
  rationale: यूनानी की कुछ हद तक पुनरुक्त और जोरदार अभिव्यक्ति को मुहावरेदार हिंदी में रखा गया है; ‘ऐसे ही’ समानता और ‘बहुत-से दूसरे’ बहुलता तथा अतिरिक्त उदाहरणों का भाव देता है।
- source_word: ποιεῖτε
  choice: करते हो
  rationale: वर्तमान काल यहाँ आदतन और लगातार किए जाने वाले आचरण को दर्शाता है; सामान्य वर्तमान हिंदी में यही भाव स्वाभाविक है।
theological_decisions:
- issue: यीशु के आरोप में ‘परंपरा’ का स्वरूप
  choice: मूल के अनुसार ‘अपनी ... परंपरा’ रखा गया है और संदर्भ को यह दिखाने दिया गया है कि यह परंपरा परमेश्वर के वचन के विरुद्ध खड़ी है।
  alternative: ‘मनुष्यों की परंपरा’ कहना।
  rationale: इस पद में यूनानी पाठ ‘तुम्हारी परंपरा’ कहता है, ‘मनुष्यों की’ नहीं। अतिरिक्त विशेषण जोड़ने से बचते हुए मूल पाठ का धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘निष्प्रभावी’ अपेक्षाकृत औपचारिक है, पर सामान्य पाठक के लिए बोधगम्य है और ἀκυρόω की वैधानिक तथा प्रभाव-संबंधी शक्ति को संक्षेप में व्यक्त करता है।
