  text: ⸀καὶ ⸀ἠνοίγησαν αὐτοῦ αἱ ἀκοαί, καὶ ἐλύθη ὁ δεσμὸς τῆς γλώσσης αὐτοῦ, καὶ ἐλάλει ὀρθῶς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/035.yaml
  text: And his ears were opened[a], and the bond of his tongue was released[c][b], and he spoke plainly.
translation:
  language: hi
  text: और उसके कान खुल गए[a], उसकी जीभ का बंधन खुल गया[b], और वह ठीक से बोलने लगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सुनने की शक्ति बहाल हो गई।’ यूनानी शब्द का अर्थ कानों के साथ-साथ सुनने की क्षमता भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘उसकी जीभ का बंधन खुल गया’; अर्थात उसकी बोलने की बाधा दूर हो गई।
    reason: lexical_alternative
  - marker: c
    text: या ‘सही ढंग से’ अथवा ‘स्पष्ट रूप से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠνοίγησαν
  choice: खुल गए
  rationale: यूनानी क्रिया भूतकालीन कर्मवाच्य और बहुवचन में है। ‘खुल गए’ उसके कानों के अचानक खुलने और सुनने की क्षमता लौट आने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἱ ἀκοαί
  choice: उसके कान
  rationale: ἀκοαί का अर्थ सुनने की शक्ति भी हो सकता है, पर बहुवचन और चंगाई के ठोस संदर्भ में ‘कान’ सहज और स्पष्ट है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐλύθη
  choice: खुल गया
  rationale: λύω का मूल भाव खोलने, ढीला करने या बंधन से मुक्त करने का है। ‘बंधन खुल गया’ हिन्दी में कर्मवाच्य अर्थ को स्वाभाविक रूप से बनाए रखता है।
- source_word: ὁ δεσμὸς τῆς γλώσσης αὐτοῦ
  choice: उसकी जीभ का बंधन
  rationale: यह चयन यूनानी के ठोस रूपक को सुरक्षित रखता है और उसे सीधे ‘बोलने की बाधा’ कहकर व्याख्यात्मक बनाने से बचता है।
- source_word: ἐλάλει
  choice: वह ... बोलने लगा
  rationale: अपूर्ण भूतकालीन क्रिया चंगाई के बाद जारी बोलने की क्रिया बताती है। हिन्दी कथा-शैली में ‘बोलने लगा’ उसकी नई बहाल हुई क्षमता को सहजता से व्यक्त करता है, यद्यपि आरंभ का भाव क्रिया में अलग से स्पष्ट नहीं है।
- source_word: ὀρθῶς
  choice: ठीक से
  rationale: ὀρθῶς का अर्थ सही, उचित या स्पष्ट ढंग से है। इस संदर्भ में ‘ठीक से’ स्वाभाविक रूप से सामान्य और बोधगम्य वाणी की बहाली बताता है, बिना इसे केवल व्याकरणिक शुद्धता तक सीमित किए।
theological_decisions:
- issue: जीभ की चंगाई को शाब्दिक रूपक या व्याख्यात्मक भाषा में प्रस्तुत करना
  choice: मुख्य पाठ में ‘उसकी जीभ का बंधन खुल गया’ रूपक बनाए रखा गया है।
  alternative: ‘उसकी बोलने की बाधा दूर हो गई’ या ‘उसकी जीभ मुक्त हो गई।’
  rationale: यूनानी पाठ चिकित्सकीय विवरण देने के बजाय बंधन खुलने का ठोस रूपक इस्तेमाल करता है। उसे बनाए रखना चमत्कारी चंगाई को स्पष्ट रखते हुए स्रोत से अधिक व्याख्या जोड़ने से बचाता है।
- issue: ὀρθῶς में सही बोलने और स्पष्ट बोलने के बीच अर्थ-बल
  choice: ‘ठीक से’ चुना गया है, जो सामान्य और सुबोध वाणी की बहाली को समेटता है।
  alternative: ‘सही ढंग से’ या ‘स्पष्ट रूप से।’
  rationale: संदर्भ वाणी की शारीरिक बहाली का है; ‘ठीक से’ नैतिक या केवल व्याकरणिक शुद्धता का अनावश्यक अर्थ दिए बिना वास्तविक अर्थ-सीमा बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथा-शैली रखी गई है। ‘जीभ का बंधन’ स्रोत का रूपक सुरक्षित रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है। सभी पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद रखे गए हैं।
