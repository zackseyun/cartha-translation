base_translation:
  language: en
  yaml_path: translation/nt/mark/007/027.yaml
  text: And he was saying to her[a], “Let the children be fed first, for it is not good to take the children’s bread and throw it to the little dogs.”
translation:
  language: hi
  text: और वह उससे कह रहा था, “पहले बच्चों को पेट भर खाने दो, क्योंकि बच्चों की रोटी लेकर छोटे कुत्तों[a] के आगे डालना अच्छा नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घर के कुत्तों” अथवा केवल “कुत्तों।” यूनानी में लघु रूप प्रयुक्त हुआ है, जो जंगली आवारा कुत्तों पर जोर देने के बजाय छोटे या घर में पाले जाने वाले कुत्तों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण भूतकाल की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἄφες
  choice: खाने दो
  rationale: यहाँ ἀφίημι अनुमति देने के अर्थ में है; χορτασθῆναι के साथ हिन्दी में यह स्वाभाविक रूप बनता है।
- source_word: πρῶτον
  choice: पहले
  rationale: क्रम और प्राथमिकता का भाव सुरक्षित रखता है, बिना बाद में दूसरों को मिलने की संभावना को नकारे।
- source_word: χορτασθῆναι
  choice: पेट भर खाने
  rationale: निष्क्रिय अनंत रूप का आशय तृप्त होकर खिलाए जाने से है; यह भोजन और रोटी के बिंब के अनुरूप सहज हिन्दी है।
- source_word: τὰ τέκνα
  choice: बच्चों
  rationale: सामान्य पारिवारिक रूपक को आयु या लिंग अधिक निर्दिष्ट किए बिना बनाए रखता है।
- source_word: καλόν ἐστιν
  choice: अच्छा नहीं है
  rationale: καλός के ‘अच्छा/उचित’ भाव को सीधे रखता है और मूल कथन की नैतिक-सामाजिक उपयुक्तता को अनावश्यक रूप से कठोर नहीं करता।
- source_word: λαβεῖν
  choice: लेकर
  rationale: सरल और प्रत्यक्ष अर्थ ‘लेना’ है; हिन्दी वाक्य में कृदंत रूप स्वाभाविक है।
- source_word: ἄρτον
  choice: रोटी
  rationale: ठोस घरेलू भोजन-बिंब को सुरक्षित रखने वाला सीधा हिन्दी समतुल्य है।
- source_word: κυναρίοις
  choice: छोटे कुत्तों
  rationale: लघु रूप κυνάριον को व्यक्त करता है और घरेलू या छोटे कुत्तों की संभावना बनाए रखता है, बिना ‘पिल्लों’ का अतिरिक्त प्यारा भाव जोड़े।
- source_word: βαλεῖν
  choice: के आगे डालना
  rationale: βάλλω के ‘डालना/फेंकना’ भाव को घरेलू भोजन के प्रसंग में स्वाभाविक हिन्दी से व्यक्त करता है।
theological_decisions:
- issue: ‘बच्चों’ और ‘छोटे कुत्तों’ के रूपक का आशय
  choice: मुख्य पाठ में घरेलू रूपक को बिना उसके संदर्भित समूहों की व्याख्या किए बनाए रखा गया।
  alternative: ‘बच्चों’ को इस्राएली/यहूदी और ‘छोटे कुत्तों’ को गैर-यहूदी कहकर व्याख्यात्मक अनुवाद करना।
  rationale: यूनानी पाठ स्वयं रूपक देता है; उसके ऐतिहासिक संदर्भ की व्याख्या को मुख्य पाठ में मिलाना अर्थ का अनावश्यक विस्तार होता।
- issue: πρῶτον (‘पहले’) की क्रमसूचक बारीकी
  choice: ‘पहले’ को मुख्य पाठ में रखा गया।
  alternative: प्रवाह के लिए क्रमसूचक शब्द छोड़ देना।
  rationale: यह बच्चों की प्राथमिकता और दूसरों के स्थायी बहिष्कार के बीच मूल पाठ की कथात्मक तथा धर्मवैज्ञानिक तनावपूर्ण संभावना को सुरक्षित रखता है।
