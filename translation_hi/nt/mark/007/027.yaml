  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। ‘पेट भर खाने दो’ तृप्ति का भाव स्पष्ट करता है, जबकि ‘के आगे डालना’ घरेलू दृश्य में स्वाभाविक है।
