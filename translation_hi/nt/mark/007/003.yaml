  text: οἱ γὰρ Φαρισαῖοι καὶ πάντες οἱ Ἰουδαῖοι ἐὰν μὴ πυγμῇ νίψωνται τὰς χεῖρας οὐκ ἐσθίουσιν, κρατοῦντες τὴν παράδοσιν τῶν πρεσβυτέρων,
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/003.yaml
  text: For the Pharisees and all the Jews do not eat unless they wash their hands with a fist[a], holding to the tradition of the elders.
translation:
  language: hi
  text: क्योंकि फ़रीसी और सभी यहूदी तब तक भोजन नहीं करते, जब तक वे मुट्ठी से[a] अपने हाथ न धो लें, पूर्वजों की परंपरा को मानते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मुट्ठी से’; इसका अर्थ ‘कलाई तक’, ‘अच्छी तरह’ या किसी प्रचलित रीति के अनुसार हाथ धोना भी हो सकता है। यूनानी शब्द का ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन की व्याख्या करने वाली टिप्पणी आरंभ करता है; हिन्दी में ‘क्योंकि’ इसका कारणसूचक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: इस यहूदी समुदाय के नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: πάντες οἱ Ἰουδαῖοι
  choice: सभी यहूदी
  rationale: यूनानी की व्यापक जातीय-धार्मिक अभिव्यक्ति को बिना संकुचित किए रखा गया है; यह प्रसंग में सामान्यीकरण है।
- source_word: ἐὰν μὴ
  choice: जब तक ... न
  rationale: नकारात्मक शर्त को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πυγμῇ
  choice: मुट्ठी से
  rationale: विवादित यूनानी पद का निकट और जानबूझकर कुछ अस्पष्ट अनुवाद; संभावित रीति या धुलाई की सीमा को पाद-टिप्पणी में रखा गया है।
- source_word: νίψωνται τὰς χεῖρας
  choice: अपने हाथ ... धो लें
  rationale: शरीर के किसी अंग को धोने के लिए प्रयुक्त क्रिया और स्पष्ट कर्म ‘हाथों’ का सहज हिन्दी अनुवाद।
- source_word: οὐκ ἐσθίουσιν
  choice: भोजन नहीं करते
  rationale: अभ्यस्त क्रिया को सामान्य वर्तमान अर्थ में व्यक्त करता है; हिन्दी में ‘भोजन करना’ सहज है।
- source_word: κρατοῦντες
  choice: थामे रहते हैं
  rationale: परंपरा से दृढ़ता से जुड़े रहने का भाव बचाता है और कृदंत का संबंध स्पष्ट करने के लिए ‘इस प्रकार’ जोड़ा गया है।
- source_word: παράδοσιν
  choice: परंपरा
  rationale: पीढ़ियों से सौंपे गए शिक्षण और आचरण के लिए मानक हिन्दी शब्द।
- source_word: τῶν πρεσβυτέρων
  choice: पुरनियों की
  rationale: यहाँ पूर्वज धार्मिक अगुओं और शिक्षकों से संबंधित परंपरा अभिप्रेत है; ‘पुरनिये’ बाइबलीय गरिमा के साथ इस सामुदायिक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: ‘सभी यहूदी’ का विस्तार
  choice: मूल की व्यापक अभिव्यक्ति ‘सभी यहूदी’ को बनाए रखा गया।
  alternative: यहूदिया के सभी लोग; बहुत-से यहूदी
  rationale: मूल पाठ πάντες οἱ Ἰουδαῖοι कहता है। इसे सीमित या नरम करना स्रोत से आगे बढ़ना होता; फिर भी यह वर्णनात्मक सामान्यीकरण है, प्रत्येक व्यक्ति के विषय में सांख्यिक दावा नहीं।
- issue: πυγμῇ का अर्थ
  choice: मुख्य पाठ में ‘मुट्ठी से’, तथा पाद-टिप्पणी में अन्य संभावनाएँ।
  alternative: कलाई तक; अच्छी तरह; विधिपूर्वक
  rationale: शब्द का सटीक आशय विवादित है और संभवतः धार्मिक रीति से हाथ धोने के ढंग या सीमा को बताता है। अस्पष्टता को व्याख्यात्मक शब्द चुनकर समाप्त नहीं किया गया।
- issue: हाथ धोने का स्वरूप
  choice: पाठ में केवल क्रिया का वर्णन, पाद-टिप्पणी में अनुष्ठानिक संदर्भ की संभावना।
  alternative: शुद्धि के लिए हाथ धोना
  rationale: संदर्भ रीति-संबंधी धुलाई बताता है, पर पद में उद्देश्य स्पष्ट रूप से नहीं कहा गया; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘मुट्ठी से’ की असामान्यता मूल यूनानी की वास्तविक कठिनाई को दर्शाती है और [a] में समझाई गई है। ‘पुरनियों’ से समकालीन बुज़ुर्ग मात्र नहीं, बल्कि परंपरा से जुड़े पूर्ववर्ती धार्मिक अगुवे अभिप्रेत हैं।
