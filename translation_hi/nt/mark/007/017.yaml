source:
  edition: SBLGNT
  text: Καὶ ὅτε εἰσῆλθεν ⸀εἰς οἶκον ἀπὸ τοῦ ὄχλου, ἐπηρώτων αὐτὸν οἱ μαθηταὶ αὐτοῦ ⸂τὴν παραβολήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/017.yaml
  text: And when he entered a house away from the crowd[a], his disciples asked him about the parable.
translation:
  language: hi
  text: और जब वह भीड़ से अलग होकर एक घर में गया, तो उसके शिष्यों ने उससे उस दृष्टान्त[a] के बारे में पूछा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस कथन” अथवा “उस उदाहरण।” यूनानी शब्द παραβολή है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: मरकुस की कथात्मक प्रवाह-शैली में प्रयुक्त सामान्य संयोजक को बनाए रखता है।
- source_word: ὅτε
  choice: जब
  rationale: यह उस समय और परिस्थिति को प्रस्तुत करता है जिसमें शिष्यों ने यीशु से प्रश्न किया।
- source_word: εἰσῆλθεν εἰς οἶκον
  choice: एक घर में गया
  rationale: οἶκον के साथ निश्चित उपपद नहीं है, इसलिए ‘एक घर’ उपयुक्त है; हिन्दी में ‘घर में गया’ स्वाभाविक रूप से भीतर प्रवेश करने का अर्थ देता है।
- source_word: ἀπὸ τοῦ ὄχλου
  choice: भीड़ से अलग होकर
  rationale: घर में जाने के साथ भीड़ से दूरी और पृथक्करण के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐπηρώτων
  choice: पूछा
  rationale: यूनानी अपूर्णकाल जारी या बार-बार पूछने का संकेत दे सकता है, पर कथात्मक हिन्दी में साधारण भूतकाल स्वाभाविक है और प्रसंग में अर्थ नहीं खोता।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्यों
  rationale: यूनानी संबंधवाचक रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: τὴν παραβολήν
  choice: उस दृष्टान्त
  rationale: παραβολή के सामान्य अर्थ को बनाए रखता है और मरकुस द्वारा यीशु की आलंकारिक शिक्षा को दी गई श्रेणी को संकुचित नहीं करता।
theological_decisions:
- issue: ऐसे प्रसंग में παραβολή का अनुवाद जहाँ इसका आशय व्यापक रूप से आलंकारिक कथन भी हो सकता है
  choice: दृष्टान्त
  alternative: कथन; उदाहरण
  rationale: ‘दृष्टान्त’ यूनानी पद के पारंपरिक और स्वाभाविक अर्थ को सुरक्षित रखता है, जबकि पादटिप्पणी प्रसंगानुकूल व्यापक अर्थ की वास्तविक संभावना बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘एक घर’ यूनानी में निश्चित उपपद के अभाव को दर्शाता है और ‘भीड़ से अलग होकर’ ἀπὸ τοῦ ὄχλου के पृथक्करण-भाव को स्वाभाविक ढंग से व्यक्त करता है।
