  text: ⸂ἡ δὲ γυνὴ ἦν⸃ Ἑλληνίς, Συροφοινίκισσα τῷ γένει· καὶ ἠρώτα αὐτὸν ἵνα τὸ δαιμόνιον ἐκβάλῃ ἐκ τῆς θυγατρὸς αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/026.yaml
  text: The woman was a Greek[a], a Syrophoenician by birth[b], and she kept asking him to cast the demon out of her daughter.
translation:
  language: hi
  text: वह स्त्री यूनानी[a] थी और जन्म से सुरोफीनीकी[b] थी। वह उससे बार-बार आग्रह कर रही थी कि वह उसकी बेटी में से दुष्टात्मा को निकाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गैर-यहूदी”; यूनानी मूलपाठ में “यूनानी” है, जो इस प्रसंग में संभवतः उसके गैर-यहूदी होने के साथ-साथ उसकी यूनानी सांस्कृतिक पहचान का भी संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “वंश/मूल से सुरोफीनीकी”; अर्थात वह सुरोफीनीकी वंश की थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑλληνίς
  choice: यूनानी
  rationale: मूल शब्द का सीधा अर्थ ‘यूनानी स्त्री’ है; प्रसंग में इससे उसके गैर-यहूदी होने का संकेत भी मिलता है, पर मुख्य पाठ में अधिक व्यापक अर्थ थोपने के बजाय मूल जातीय-सांस्कृतिक पद रखा गया है।
- source_word: Συροφοινίκισσα τῷ γένει
  choice: जन्म से सूरुफ़ीनीकी
  rationale: यह पद उसके वंशीय-भौगोलिक मूल को बताता है। ‘जन्म से’ τῷ γένει का स्वाभाविक आधुनिक हिन्दी रूप है और ‘नस्ल’ जैसे आधुनिक रूप से समस्याग्रस्त शब्द से बचता है।
- source_word: ἠρώτα
  choice: बार-बार विनती कर रही थी
  rationale: अपूर्ण भूतकाल जारी या दोहराए जाते अनुरोध को व्यक्त करता है। प्रसंग में ‘विनती’ अनुरोध की गंभीरता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἵνα ... ἐκβάλῃ
  choice: कि वह ... निकाल दे
  rationale: ἵνα-वाक्य अनुरोध की विषय-वस्तु बताता है; ‘निकाल दे’ ἐκβάλλω को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸ δαιμόνιον
  choice: दुष्टात्मा
  rationale: यहाँ δαιμόνιον एक अलौकिक दुष्ट सत्ता को दर्शाता है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘दुष्टात्मा’ स्पष्ट और स्वाभाविक है, यद्यपि अधिक शाब्दिक विकल्प ‘दानव’ है।
- source_word: ἐκ τῆς θυγατρὸς αὐτῆς
  choice: उसकी बेटी में से
  rationale: ‘में से’ ἐκ के भीतर से बाहर आने के स्थानिक भाव को सुरक्षित रखता है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ हल्का कथात्मक संयोजन/संक्रमण है, प्रबल विरोध नहीं; हिन्दी में ‘और’ पिछले प्रसंग से स्वाभाविक संबंध बनाता है।
theological_decisions:
- issue: स्त्री की जातीय-सांस्कृतिक पहचान
  choice: 'दोनों परिचय रखे गए हैं: ‘यूनानी’ और ‘जन्म से सूरुफ़ीनीकी’।'
  alternative: ‘गैर-यहूदी, सूरुफ़ीनीकी मूल की’
  rationale: मूल पाठ पहचान के दो स्तरों को साथ रखता है। ‘गैर-यहूदी’ प्रसंगगत आशय स्पष्ट करता, पर Ἑλληνίς की विशिष्ट शब्दावली को सामान्य बना देता।
- issue: बेटी की पीड़ा का स्वरूप
  choice: दुष्टात्मा को वास्तविक अलौकिक सत्ता के रूप में व्यक्त किया गया है।
  alternative: ‘बुरी आत्मा’ या मनोवैज्ञानिक/रूपक व्याख्या
  rationale: δαιμόνιον का सीधा अर्थ सुरक्षित रखा गया है; पाठ के दावे को न तो नरम किया गया है और न पुनर्व्याख्यायित।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सूरुफ़ीनीकी’ ऐतिहासिक जातीय-भौगोलिक नाम को सुरक्षित रखता है। निरंतर अनुरोध को ‘बार-बार विनती कर रही थी’ से व्यक्त किया गया है।
