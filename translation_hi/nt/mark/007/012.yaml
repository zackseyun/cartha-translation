  text: तुम अब उसे अपने पिता या माता के लिए कुछ भी करने नहीं देते।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पिता या माता की सहायता के लिए कुछ भी करने।” इस संदर्भ में व्यापक यूनानी अभिव्यक्ति में व्यावहारिक या आर्थिक सहायता भी शामिल हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐκέτι
  choice: तो फिर … नहीं
  rationale: οὐκέτι का अर्थ ‘अब और नहीं’ है। पिछले पद से परिणामसूचक संबंध को स्वाभाविक हिन्दी में ‘तो फिर’ व्यक्त करता है, और ‘नहीं देते’ जारी निषेध का भाव बनाए रखता है।
- source_word: ἀφίετε
  choice: करने नहीं देते
  rationale: यहाँ ἀφίημι का अर्थ क्षमा करना या छोड़ना नहीं, बल्कि अनुमति देना है। हिन्दी में नकारात्मक वाक्य-विन्यास ‘करने नहीं देते’ सर्वाधिक स्वाभाविक है।
- source_word: αὐτόν
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्म का संदर्भ उस व्यक्ति से है जिसने अपनी संपत्ति को कोरबान कहा है; हिन्दी सर्वनाम ‘उसे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐδέν
  choice: कुछ भी
  rationale: अनुमति के निषेध के साथ ‘कुछ भी’ यूनानी के सर्वसमावेशी नकारात्मक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ποιῆσαι
  choice: करने
  rationale: सामान्य क्रिया ‘करना’ मूल पाठ की व्यापकता बनाए रखती है और सहायता या आर्थिक भरण-पोषण तक अर्थ को अनावश्यक रूप से सीमित नहीं करती।
- source_word: τῷ πατρὶ ἢ τῇ μητρί
  choice: अपने पिता या माता के लिए
  rationale: सम्प्रदान कारक यहाँ माता-पिता के हित में किए जाने वाले कार्य का भाव देता है। ‘अपने’ संबंध को स्पष्ट करता है, जबकि ‘के लिए’ व्यापक लाभार्थक अर्थ बनाए रखता है।
theological_decisions:
- issue: कोरबान के संदर्भ से आर्थिक या व्यावहारिक सहायता का अर्थ स्पष्ट किया जाए या नहीं
  choice: मुख्य पाठ में व्यापक वाक्यांश ‘अपने पिता या माता के लिए कुछ भी करने’ रखा गया
  alternative: अपने पिता या माता की कोई सहायता करने
  rationale: संदर्भ में भौतिक सहायता निहित है, पर यूनानी ποιῆσαι … τῷ πατρὶ ἢ τῇ μητρί स्वयं व्यापक है। मुख्य पाठ मूल की व्यापकता रखता है और पादटिप्पणी संभावित संदर्भगत अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘करने नहीं देते’ अनुमति रोकने का स्वाभाविक हिन्दी रूप है।
