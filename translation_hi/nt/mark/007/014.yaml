  yaml_path: translation/nt/mark/007/014.yaml
  text: And calling the crowd to him again, he was saying to them, “Listen to me, all of you, and understand.”
translation:
  language: hi
  text: फिर उसने भीड़ को दोबारा अपने पास बुलाया और उनसे कहा, “तुम सब मेरी बात सुनो और समझो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: यह मध्यमवाच्य कृदन्त भीड़ को अपनी ओर बुलाने का भाव व्यक्त करता है; हिन्दी में यह स्वाभाविक और अर्थ-सटीक है।
- source_word: πάλιν
  choice: फिर
  rationale: यह संकेत करता है कि यीशु ने भीड़ को दोबारा संबोधित करने के लिए पास बुलाया।
- source_word: ἔλεγεν
  choice: कहा
  rationale: यूनानी अपूर्णकाल का यहाँ मुख्य वचन के परिचय में स्वाभाविक हिन्दी रूप ‘कहा’ है; ‘कह रहा था’ प्रसंग के बिना अनावश्यक रूप से जारी क्रिया पर बल देगा।
- source_word: Ἀκούσατέ μου πάντες
  choice: तुम सब मेरी बात सुनो
  rationale: ‘मेरी बात सुनो’ हिन्दी में संबंधकारक μου के आशय को स्वाभाविक ढंग से व्यक्त करता है, और πάντες को ‘तुम सब’ स्पष्ट करता है।
- source_word: σύνετε
  choice: समझो
  rationale: आज्ञार्थक क्रिया सुनाई गई शिक्षा को ग्रहण और बोध करने का आह्वान करती है; ‘समझो’ सीधा और वर्तमान हिन्दी में सहज है।
