  text: καὶ διεστείλατο αὐτοῖς ἵνα μηδενὶ ⸀λέγωσιν· ὅσον δὲ ⸂αὐτοῖς διεστέλλετο, αὐτοὶ⸃ μᾶλλον περισσότερον ἐκήρυσσον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/036.yaml
  text: And he ordered them to tell no one. But the more he ordered them[a], the more abundantly they proclaimed it.
translation:
  language: hi
  text: और उसने उन्हें कड़ा आदेश दिया कि वे किसी से न कहें। पर जितना अधिक वह उन्हें आदेश देता रहा, उतना ही अधिक वे इस बात का प्रचार करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διεστείλατο
  choice: कड़ा आदेश दिया
  rationale: मध्यवाच्य διαστέλλομαι यहाँ दृढ़ निर्देश या निषेध व्यक्त करता है। ‘कड़ा आदेश दिया’ आधुनिक हिन्दी में इसके बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἵνα μηδενὶ λέγωσιν
  choice: कि वे किसी से न कहें
  rationale: यह उपवाक्य आदेश की विषयवस्तु बताता है। यह सहज हिन्दी है और किसी को घटना न बताने का आशय स्पष्ट रखता है।
- source_word: ὅσον ... διεστέλλετο
  choice: जितना अधिक वह उन्हें मना करता रहा
  rationale: ὅσον और अपूर्णकालीन क्रिया मिलकर लगातार किए गए निषेध और तुलनात्मक वृद्धि का भाव देते हैं। ‘मना करता रहा’ पहले आदेश की निषेधात्मक विषयवस्तु को स्वाभाविक हिन्दी में आगे बढ़ाता है।
- source_word: μᾶλλον περισσότερον
  choice: उतना ही अधिक
  rationale: दोनों तुलनात्मक क्रियाविशेषण बढ़ती हुई तीव्रता पर जोर देते हैं। हिन्दी की ‘जितना अधिक… उतना ही अधिक’ संरचना इस संबंध और बल को पठनीय ढंग से व्यक्त करती है।
- source_word: ἐκήρυσσον
  choice: वे इसका प्रचार करते रहे
  rationale: κηρύσσω सार्वजनिक रूप से घोषणा करने का भाव रखता है। ‘प्रचार करते रहे’ अपूर्णकाल की निरंतरता और सार्वजनिक प्रसार, दोनों को व्यक्त करता है; ‘इसका’ यूनानी में निहित घटना-विषय को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: मसीही रहस्य और यीशु के आदेश का बल
  choice: आदेश को वास्तविक और दृढ़ निषेध के रूप में प्रस्तुत किया गया है, उसके कारण की व्याख्या जोड़े बिना।
  alternative: ‘कड़ी चेतावनी दी’ कहना या चुप रहने के आदेश के पीछे कोई धर्मवैज्ञानिक उद्देश्य अनुवाद में जोड़ना।
  rationale: पद दृढ़ आदेश और लोगों द्वारा उसके विपरीत अधिक प्रचार करने के बीच तनाव रखता है। अनुवाद इस तनाव को सुरक्षित रखता है और यीशु की मंशा के बारे में कोई सांप्रदायिक अथवा अनुमानित व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रचार’ सार्वजनिक घोषणा के अर्थ में है, न कि अनिवार्य रूप से औपचारिक उपदेश के अर्थ में। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि यूनानी की तुलनात्मक तीव्रता मुख्य पाठ में स्वाभाविक रूप से सुरक्षित है।
