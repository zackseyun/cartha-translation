  text: ἡ δὲ ἀπεκρίθη καὶ λέγει αὐτῷ· ⸀Κύριε, ⸀καὶ τὰ κυνάρια ὑποκάτω τῆς τραπέζης ⸀ἐσθίουσιν ἀπὸ τῶν ψιχίων τῶν παιδίων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/028.yaml
  text: But she answered and said to him[a], “Lord[b], even the little dogs under the table eat from the children's crumbs.”
translation:
  language: hi
  text: पर उसने उसे उत्तर देते हुए कहा, “प्रभु[a], मेज़ के नीचे छोटे कुत्ते[b] भी बच्चों के खाने के टुकड़ों में से खाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महोदय।” यूनानी κύριε आदरसूचक संबोधन भी हो सकता है और “प्रभु” की उपाधि भी।
    reason: alternative_reading
  - marker: b
    text: यूनानी शब्द छोटे या घर में पाले जाने वाले कुत्तों का बोध करा सकता है; “छोटे कुत्ते” उसके लघुतासूचक भाव को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπεκρίθη καὶ λέγει αὐτῷ
  choice: उसने उत्तर में उससे कहा
  rationale: यह स्वाभाविक हिन्दी में उत्तर देने और उससे कहने—दोनों कथात्मक क्रियाओं को व्यक्त करता है; यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली के सामान्य भूतकाल में रखा गया है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को संबोधित करने के लिए κύριε का प्रचलित और गरिमापूर्ण हिन्दी रूप; प्रसंग में सम्मानसूचक ‘महोदय’ भी संभव है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ καί स्त्री के इस तर्क को उभारता है कि छोटे कुत्तों को भी कुछ मिलता है।
- source_word: κυνάρια
  choice: छोटे कुत्ते
  rationale: κυνάρια का लघुतासूचक भाव सुरक्षित रहता है और घरेलू अथवा छोटे कुत्तों का संकेत मिलता है; ‘पिल्ले’ कहना आयु को अनावश्यक रूप से निश्चित कर देता।
- source_word: ὑποκάτω τῆς τραπέζης
  choice: मेज़ के नीचे रहने वाले
  rationale: स्थान-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; ‘रहने वाले’ वाक्य में कुत्तों और स्थान के संबंध को स्पष्ट करता है, बिना स्थायी निवास का दावा किए।
- source_word: ἐσθίουσιν
  choice: खाते हैं
  rationale: वर्तमान काल यहाँ सामान्य अथवा प्रचलित क्रिया बताता है, जिसे हिन्दी का सामान्य वर्तमान ठीक प्रकार व्यक्त करता है।
- source_word: ἀπὸ τῶν ψιχίων τῶν παιδίων
  choice: बच्चों के खाने के टुकड़ों में से
  rationale: ψιχίων के छोटे खाद्य टुकड़ों या चूरे के अर्थ को सहज हिन्दी में व्यक्त करता है; ‘खाने के’ जोड़ने से ‘बच्चों के टुकड़े’ जैसी भ्रामक अभिव्यक्ति से बचा जाता है, जबकि ἀπό की अंशात्मकता ‘में से’ द्वारा बनी रहती है।
theological_decisions:
- issue: यीशु को संबोधित करते हुए Κύριε का अनुवाद
  choice: प्रभु
  alternative: महोदय
  rationale: κύριε उपाधि ‘प्रभु’ और आदरसूचक संबोधन ‘महोदय’—दोनों अर्थ दे सकता है। मुख्य पाठ में पारंपरिक और प्रसंगानुकूल ‘प्रभु’ रखा गया है, पर पादटिप्पणी तत्काल प्रसंग की वास्तविक भाषिक अनिश्चितता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद की प्रत्युत्तरात्मक धार और दृष्टांत की घरेलू मेज़ वाली छवि सुरक्षित है; ‘पिल्ले’ से बचकर यूनानी शब्द को आयु-सूचक अर्थ में सीमित नहीं किया गया।
