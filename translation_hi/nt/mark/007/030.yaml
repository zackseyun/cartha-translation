source:
  edition: SBLGNT
  text: καὶ ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς εὗρεν τὸ ⸂παιδίον βεβλημένον ἐπὶ τὴν κλίνην καὶ τὸ δαιμόνιον ἐξεληλυθός⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/007/030.yaml
  text: And when she went away to her house, she found the child lying on the bed[a], and the demon gone.
translation:
  language: hi
  text: और अपने घर जाकर उसने देखा कि बच्ची बिस्तर पर पड़ी थी और दुष्टात्मा निकल चुका था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπελθοῦσα εἰς τὸν οἶκον αὐτῆς
  choice: अपने घर जाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की गति को दर्शाता है। ‘अपने घर जाकर’ इस क्रम को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: εὗρεν
  choice: उसने देखा कि
  rationale: कथा-संदर्भ में εὗρεν का भाव किसी स्थिति को वैसा पाना या देखना है। ‘उसने देखा कि’ हिन्दी में आगे आने वाली दो स्थितियों के साथ अधिक स्वाभाविक है।
- source_word: παιδίον
  choice: बच्ची
  rationale: शब्द का मूल अर्थ ‘बच्चा’ है, पर निकटवर्ती संदर्भ स्पष्ट करता है कि वह स्त्री की बेटी है। हिन्दी में ‘बच्ची’ स्वाभाविक रूप से उसी ज्ञात संदर्भ को व्यक्त करता है।
- source_word: βεβλημένον ἐπὶ τὴν κλίνην
  choice: बिस्तर पर पड़ी थी
  rationale: पूर्ण निष्क्रिय कृदन्त यहाँ बच्चे की परिणामी अवस्था बताता है; इसका आशय हिंसापूर्वक फेंके जाने पर बल देना नहीं है। ‘पड़ी थी’ स्वाभाविक हिन्दी में उस अवस्था को व्यक्त करता है।
- source_word: δαιμόνιον
  choice: दुष्टात्मा
  rationale: δαιμόνιον के लिए ‘दुष्टात्मा’ आधुनिक हिन्दी में स्पष्ट और प्रचलित पद है तथा इसे केवल सामान्य ‘आत्मा’ कहकर अर्थ को धुंधला नहीं करता।
- source_word: ἐξεληλυθός
  choice: निकल चुका था
  rationale: पूर्ण कृदन्त इस बात पर बल देता है कि दुष्टात्मा बाहर निकल गया था और अब उपस्थित नहीं था। ‘निकल चुका था’ क्रिया और उसकी पूर्ण परिणामी अवस्था दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: दुष्टात्मा के निकलने का पूर्ण परिणाम
  choice: दुष्टात्मा निकल चुका था
  alternative: दुष्टात्मा वहाँ नहीं था
  rationale: चुना हुआ पाठ केवल अनुपस्थिति नहीं, बल्कि ἐξέρχομαι के अनुसार उसके बाहर निकल जाने को भी स्पष्ट रखता है; साथ ही पूर्ण काल से व्यक्त पूरी हो चुकी और वर्तमान में प्रभावी अवस्था सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शय्या’ के स्थान पर सामान्य ‘बिस्तर’ और अस्वाभाविक शाब्दिक ‘डाली हुई’ के स्थान पर परिणामी अवस्था बताने वाला ‘पड़ी थी’ चुना गया है।
