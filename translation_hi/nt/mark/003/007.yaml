translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हटकर … चले गए’ विरोध या दबाव से पीछे हटने की संभावित छाया को बचाता है, जबकि ‘समुद्र’ मूल शब्दावली को बनाए रखता है। दोनों समुद्र-संबंधी टिप्पणियों के चिह्न संबंधित शब्द के तुरंत बाद रखे गए हैं।
