  text: Καὶ ὁ Ἰησοῦς ⸂μετὰ τῶν μαθητῶν αὐτοῦ ἀνεχώρησεν⸃ πρὸς τὴν θάλασσαν· καὶ πολὺ πλῆθος ἀπὸ τῆς Γαλιλαίας ⸀ἠκολούθησεν, καὶ ἀπὸ τῆς Ἰουδαίας
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/007.yaml
  text: And Jesus withdrew with his disciples to the sea[a], and a great crowd from Galilee followed, and from Judea[b],
translation:
  language: hi
  text: और यीशु अपने चेलों के साथ हटकर समुद्र[a][b] की ओर चले गए। गलील से एक बड़ी भीड़ उनके पीछे चली, और यहूदिया से भी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समुद्र तक।” यूनानी पूर्वसर्ग समुद्र की दिशा में जाने या वहाँ तक पहुँचने—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात गलील का समुद्र। यूनानी पाठ में केवल “समुद्र” कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: हटकर … चले गए
  rationale: यह क्रिया केवल चले जाने का नहीं, बल्कि दबाव या विरोध से हट जाने का भाव भी दे सकती है। यह प्रयोग उस भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: μετὰ τῶν μαθητῶν αὐτοῦ
  choice: अपने चेलों के साथ
  rationale: सुसमाचारों के संदर्भ में ‘चेले’ सीखने और यीशु के अनुयायी होने—दोनों संबंधों को सहज और प्रचलित ढंग से व्यक्त करता है।
- source_word: πρὸς τὴν θάλασσαν
  choice: समुद्र की ओर
  rationale: πρός यहाँ दिशा की ओर गति बताता है और θάλασσα का शाब्दिक अर्थ ‘समुद्र’ है। इसलिए भौगोलिक पहचान को मुख्य पाठ में ‘झील’ बनाकर स्पष्ट नहीं किया गया।
- source_word: πολὺ πλῆθος
  choice: एक बड़ी भीड़
  rationale: यह वाक्यांश लोगों के बहुत बड़े जमाव को दर्शाता है; ‘बड़ी भीड़’ वर्तमान हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἠκολούθησεν
  choice: उनके पीछे चली
  rationale: यहाँ क्रिया मुख्यतः स्थानगत रूप से यीशु के पीछे जाने को बताती है। यह अनुवाद अनावश्यक रूप से शिष्यत्व का धार्मिक अर्थ आरोपित नहीं करता।
- source_word: ἀπὸ τῆς Γαλιλαίας
  choice: गलील से
  rationale: यह भीड़ के आने के स्थान को सीधे और संक्षेप में व्यक्त करता है।
- source_word: ἀπὸ τῆς Ἰουδαίας
  choice: और यहूदिया से भी,
  rationale: यह सूची अगले पद में जारी रहती है। अंत का अल्पविराम स्रोत के अधूरे वाक्य-विन्यास और आगे की निरंतरता को बनाए रखता है।
