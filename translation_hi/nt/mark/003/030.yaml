    reason: ‘उसमें ... है’ के निहित मुहावरेदार अर्थ का वैकल्पिक प्रस्तुतीकरण; मुख्य पाठ के कारणसूचक शब्द या अपूर्णकालीन क्रिया को अनावश्यक रूप से नहीं दोहराता।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; इसलिए हिन्दी में स्पष्ट कारणसूचक शब्द चुना गया है।
- source_word: ἔλεγον
  choice: वे कहते रहते थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार कही जा रही बात का संकेत देता है; ‘कहते रहते थे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Πνεῦμα ἀκάθαρτον
  choice: एक अशुद्ध आत्मा
  rationale: यह सुसमाचारों में दुष्ट आत्मा के लिए प्रयुक्त मानक अभिव्यक्ति है और ἀκάθαρτος के मूल अर्थ को सुरक्षित रखती है।
- source_word: ἔχει
  choice: उसमें ... है
  rationale: यूनानी क्रिया का शाब्दिक अर्थ ‘रखता/पास है’ है। व्यक्ति के भीतर आत्मा होने के इस आरोप को हिन्दी में ‘उसमें ... है’ स्वाभाविक और स्रोत के निकट रूप में व्यक्त करता है।
theological_decisions:
- issue: यीशु पर लगाए गए आरोप का स्वरूप
  choice: “उसमें एक अशुद्ध आत्मा है” के सीधे आरोप को बनाए रखा गया।
  alternative: “वह एक अशुद्ध आत्मा के वश में है।”
  rationale: मुख्य पाठ स्रोत की सीधी और आपत्तिजनक शब्दावली को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है। वैकल्पिक मुहावरेदार रूप आरोप के निहित अर्थ को स्पष्ट करता है, पर उसे मुख्य पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘अशुद्ध आत्मा’ नए नियम की परिचित शब्दावली को बनाए रखता है; ‘उसमें ... है’ मूल के सीधे कथन को स्वाभाविक हिन्दी में प्रस्तुत करता है।
