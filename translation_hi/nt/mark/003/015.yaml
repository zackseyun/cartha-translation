  text: and to have authority to cast out demons[a].
translation:
  language: hi
  text: और दुष्टात्माओं को निकालने का अधिकार रखने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह संयोजक इस उद्देश्यसूचक क्रियार्थक वाक्यांश को पिछले नियुक्ति-वचनों से जोड़ता है।
- source_word: ἔχειν
  choice: रखने के लिए
  rationale: वर्तमान सक्रिय infinitive को हिन्दी में प्रसंगानुकूल उद्देश्यसूचक रूप में व्यक्त किया गया है; यह पिछले वाक्य की क्रिया पर निर्भर है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह केवल सामर्थ्य नहीं, बल्कि यीशु से मिला हुआ अधिकृत अधिकार और कार्य करने की क्षमता सूचित करता है।
- source_word: ἐκβάλλειν
  choice: निकालने
  rationale: यह बलपूर्वक बाहर करने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और झाड़-फूँक जैसी सांस्कृतिक रूप से सीमित अभिव्यक्ति से बचता है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं
  rationale: मूल में विशेष रूप से δαιμόνια है; ‘दुष्टात्माएँ’ इसका प्रचलित, स्पष्ट हिन्दी समतुल्य है और पास के पदों से ‘अशुद्ध आत्माएँ’ उधार नहीं लेता।
theological_decisions:
- issue: चेलों को दी गई ἐξουσία का स्वरूप
  choice: अधिकार
  alternative: सामर्थ्य
  rationale: प्रसंग यीशु द्वारा सौंपे गए अधिकृत कार्य पर बल देता है, न कि केवल निराकार चमत्कारी शक्ति पर; फिर भी इस कार्य में निहित सामर्थ्य को नकारता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और पिछले पद से जुड़ने वाला उद्देश्यसूचक वाक्यांश। ‘दुष्टात्माओं’ को सामान्य पाठक के लिए ‘दानवों’ से अधिक स्वाभाविक बाइबलीय शब्द माना गया है।
