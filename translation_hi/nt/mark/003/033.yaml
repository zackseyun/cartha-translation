    reason: source_structure
lexical_decisions:
- source_word: ἀποκριθεὶς αὐτοῖς λέγει
  choice: उन्हें उत्तर देते हुए वह कहता है
  rationale: यह अनुवाद यूनानी कृदंत ‘उत्तर देते हुए’ और मरकुस के ऐतिहासिक वर्तमान ‘वह कहता है’—दोनों को बनाए रखता है और हिन्दी में भी स्पष्ट है।
- source_word: μήτηρ
  choice: माता
  rationale: ‘माता’ आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और पारिवारिक संबोधन का सटीक समतुल्य है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग बहुवचन है और निकटवर्ती प्रसंग में यीशु के पुरुष सहोदरों की ओर संकेत करता है; इसलिए इसे ‘भाई-बहन’ कहकर विस्तृत नहीं किया गया।
- source_word: Τίς ἐστιν ... ἢ
  choice: कौन हैं ... और
  rationale: मुख्य पाठ में हिन्दी की स्वाभाविक प्रश्न-रचना अपनाई गई है। यूनानी में एकवचन क्रिया पहले पद ‘माता’ से मेल खाती है और ἢ दूसरे पद को जोड़ता है; इस अधिक शाब्दिक रचना को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ἀδελφοί का पारिवारिक अर्थ
  choice: भाई
  alternative: भाई-बहन; सहोदर
  rationale: पुल्लिंग बहुवचन को उसी रूप में रखने से पाठ में निहित ठोस पारिवारिक संदर्भ बना रहता है और यीशु के परिवार के विषय में कोई सांप्रदायिक निष्कर्ष अनुवाद में नहीं जोड़ा जाता।
- issue: माता और भाइयों से संबंधित प्रश्न की संख्या और संयोजक
  choice: मेरी माता और मेरे भाई कौन हैं?
  alternative: मेरी माता कौन है, या मेरे भाई?
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी दी गई है, जबकि यूनानी की असमान संख्या और ‘या’ वाली रचना को पादटिप्पणी में दर्ज कर वास्तविक भाषिक तनाव को छिपाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उत्तर देते हुए वह कहता है’ मरकुस की सजीव वर्णन-शैली को सुरक्षित रखता है; प्रश्न को मुख्य पाठ में स्वाभाविक हिन्दी व्याकरण के अनुसार रखा गया है।
