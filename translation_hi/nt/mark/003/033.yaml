  text: And answering them[a], he says[b], “Who are my mother and my brothers?”
translation:
  language: hi
  text: और उत्तर में वह उनसे कहता है[a], “मेरी माता और मेरे भाई कौन हैं?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज हिन्दी में: “उसने उन्हें उत्तर देकर कहा।” यूनानी में ‘उत्तर देकर/उत्तर में’ के अर्थ वाला कृदंत और ऐतिहासिक वर्तमान ‘कहता है’ है।'
