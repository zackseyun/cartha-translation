lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सूची के अंतिम नाम को पिछले नामों से जोड़ने वाला सामान्य संयोजक है।
- source_word: Ἰούδαν
  choice: यहूदा
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुसार मानक लिप्यंतरण।
- source_word: Ἰσκαριώθ
  choice: इस्करियोती
  rationale: इस उपनाम अथवा पदनाम की व्युत्पत्ति संदर्भ में अनिश्चित है, इसलिए अनुमानित अर्थ देने के बजाय प्रचलित हिन्दी रूप में लिप्यंतरण किया गया है।
- source_word: ὃς
  choice: जिसने
  rationale: यह यहूदा का परिचय देने वाला संबंधवाचक सर्वनाम है; हिन्दी में कर्ता और पूर्ण क्रिया के साथ ‘जिसने’ स्वाभाविक है।
- source_word: καὶ
  choice: भी
  rationale: संबंधवाचक उपवाक्य में यह यहूदा के बारे में जोड़ी गई निर्णायक पहचान को रेखांकित करता है।
- source_word: παρέδωκεν
  choice: पकड़वा दिया
  rationale: मूल क्रिया का आधारभूत अर्थ किसी को दूसरे के अधिकार में सौंपना है। यहूदा के प्रसंग में ‘पकड़वा दिया’ उसके विश्वासघाती कृत्य को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखे गए हैं।
- source_word: αὐτόν
  choice: उसे
  rationale: यह कर्मवाचक सर्वनाम यीशु की ओर संकेत करता है; निकट संदर्भ में ‘उसे’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: यहूदा द्वारा यीशु के प्रति किए गए कार्य के लिए παραδίδωμι का अनुवाद
  choice: पकड़वा दिया
  alternative: सौंप दिया; हवाले कर दिया; विश्वासघात किया
  rationale: क्रिया अपने आप में ‘सौंप देना’ या ‘हवाले कर देना’ कह सकती है, जबकि यहूदा के साथ इसका प्रसंग विश्वासघात का भाव देता है। ‘पकड़वा दिया’ घटना और उसके नकारात्मक आशय को सहज हिन्दी में रखता है, और पादटिप्पणी मूल क्रिया की व्यापकता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पकड़वा दिया’ सामान्य पाठक के लिए घटना को स्पष्ट करता है; पादटिप्पणी अधिक शाब्दिक अर्थों और मूल की अर्थगत व्यापकता को बनाए रखती है।
