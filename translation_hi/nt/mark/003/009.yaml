  text: καὶ εἶπεν τοῖς μαθηταῖς αὐτοῦ ἵνα πλοιάριον προσκαρτερῇ αὐτῷ διὰ τὸν ὄχλον ἵνα μὴ θλίβωσιν αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/009.yaml
  text: And he told his disciples that a small boat should stay ready for him because of the crowd[a], so that they might not crush him.
translation:
  language: hi
  text: उन्होंने अपने चेलों से कहा कि भीड़ के कारण एक छोटी नाव उनके लिए तैयार रहे, ताकि लोग उन्हें दबा[a] न दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें कुचल न दें।” यूनानी क्रिया दबाने, भीड़ में भींचने या दबाव से कुचलने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: कहा
  rationale: अप्रत्यक्ष कथन के साथ ‘अपने चेलों से कहा कि’ स्वाभाविक हिन्दी है और यूनानी λέγω का अर्थ ठीक से व्यक्त करता है।
- source_word: μαθηταῖς
  choice: चेलों
  rationale: सुसमाचारों के शिक्षक-अनुयायी संबंध के लिए ‘चेले’ प्रचलित, स्पष्ट और प्रसंगानुकूल शब्द है।
- source_word: πλοιάριον
  choice: एक छोटी नाव
  rationale: यह रूप नाव के छोटे होने का संकेत देता है; ‘छोटी नाव’ उस व्यावहारिक बारीकी को सहज हिन्दी में बनाए रखता है।
- source_word: προσκαρτερῇ
  choice: तैयार रहे
  rationale: यहाँ क्रिया निरंतर उपलब्ध और तत्पर रहने का भाव देती है; ‘तैयार रहे’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: αὐτῷ
  choice: उनके लिए
  rationale: इस प्रसंग में सम्प्रदान कारक यीशु की आवश्यकता के लिए नाव उपलब्ध रहने को दर्शाता है।
- source_word: διὰ τὸν ὄχλον
  choice: भीड़ के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है।
- source_word: θλίβωσιν
  choice: दबा न दें
  rationale: क्रिया शारीरिक रूप से दबाने, भींचने या दबाव से कुचलने का भाव रखती है। ‘दबा न दें’ प्रसंग में स्वाभाविक है और मूल की अर्थ-सीमा को अत्यधिक तीव्र किए बिना बनाए रखता है।
