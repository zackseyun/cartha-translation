  text: καὶ εἰ ὁ Σατανᾶς ἀνέστη ἐφ’ ἑαυτὸν καὶ ⸀ἐμερίσθη, οὐ δύναται ⸀στῆναι ἀλλὰ τέλος ἔχει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/026.yaml
  text: And if Satan has risen up against himself and is divided[a], he cannot stand, but has come to an end.
translation:
  language: hi
  text: और यदि शैतान अपने ही विरुद्ध उठ खड़ा हुआ है और बँट गया है, तो वह टिक नहीं सकता, बल्कि उसका अंत आ गया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “बल्कि उसका अंत है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σατανᾶς
  choice: शैतान
  rationale: यह व्यक्तिगत नाम का हिन्दी में प्रचलित और मानक रूप है।
- source_word: ἀνέστη ἐφ’ ἑαυτὸν
  choice: अपने ही विरुद्ध उठ खड़ा हुआ है
  rationale: ἀνέστη यहाँ विरोध में उठने का भाव रखता है, और ἐφ’ ἑαυτόν उस विरोध को स्वयं की ओर निर्देशित करता है। यह अनुवाद उस विरोधात्मक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐμερίσθη
  choice: बँट गया है
  rationale: निष्क्रिय क्रिया आंतरिक विभाजन और उससे उत्पन्न अवस्था को व्यक्त करती है; ‘बँट गया है’ सरल और प्रसंगानुकूल है।
- source_word: οὐ δύναται στῆναι
  choice: टिक नहीं सकता
  rationale: यह वाक्यांश यहाँ बने रहने या कायम रहने में असमर्थता बताता है। ‘टिक नहीं सकता’ हिन्दी में इस मुहावरे का स्वाभाविक अर्थ देता है।
- source_word: ἀλλὰ τέλος ἔχει
  choice: बल्कि उसका अंत आ गया है
  rationale: यूनानी का अधिक शाब्दिक अर्थ ‘उसका अंत है’ है। चुना गया रूप विभाजित राज्य के कायम न रह सकने के तार्किक परिणाम को स्पष्ट करता है, पर इसे इस पद से आगे बढ़ाकर पूर्ण युगांत-संबंधी घोषणा नहीं बनाता।
theological_decisions:
- issue: शैतान के पतन के विषय में कथन का स्वरूप
  choice: इसे यीशु के तर्क में एक विभाजित सत्ता के अनिवार्य परिणाम के रूप में व्यक्त किया गया है।
  alternative: इसे इस पद में ही शैतान की अंतिम युगांत-संबंधी पराजय की पूर्ण घोषणा के रूप में व्यक्त करना।
  rationale: प्रसंग में यीशु इस आरोप का खंडन कर रहे हैं कि वह शैतान की शक्ति से दुष्टात्माओं को निकालते हैं। पद का तर्क यह है कि अपने ही विरुद्ध बँटी हुई शैतानी सत्ता टिक नहीं सकती; इससे अधिक विकसित धर्मवैज्ञानिक निष्कर्ष अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने ही विरुद्ध उठ खड़ा हुआ’ विरोध की तीव्रता को बनाए रखता है, जबकि ‘टिक नहीं सकता’ साधारण पाठक के लिए στῆναι का प्रसंगानुकूल अर्थ स्पष्ट करता है।
