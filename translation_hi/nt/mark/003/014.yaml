lexical_decisions:
- source_word: ἐποίησεν
  choice: नियुक्त किया
  rationale: क्रिया का मूल अर्थ ‘बनाया’ है, पर यहाँ ‘बारह’ को एक समूह के रूप में ठहराने या नियुक्त करने का भाव है। ‘नियुक्त किया’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के संस्थापनात्मक अर्थ को व्यक्त करता है।
- source_word: δώδεκα
  choice: बारह
  rationale: यूनानी पाठ में केवल संख्या ‘बारह’ है; कोई स्पष्ट संज्ञा या निश्चित उपपद नहीं है। हिन्दी में भी ‘बारह को’ कहकर इस संक्षिप्तता को बनाए रखा जा सकता है।
- source_word: ἵνα ὦσιν μετ’ αὐτοῦ
  choice: ताकि वे उसके साथ रहें
  rationale: ἵνα और विधिलिंग उद्देश्य प्रकट करते हैं। यह अनुवाद उस उद्देश्य को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἀποστέλλῃ
  choice: वह उन्हें … भेजे
  rationale: क्रिया का अर्थ भेजना है और प्रसंग में कार्य के लिए भेजे जाने का भाव भी है। ‘भेजे’ मूल क्रिया के निकट रहता है और यहाँ पाठ में अनुपस्थित तकनीकी पद ‘प्रेरित’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: κηρύσσειν
  choice: प्रचार करने
  rationale: यह क्रिया सार्वजनिक रूप से संदेश सुनाने या घोषणा करने को दर्शाती है। सुसमाचार के इस प्रसंग में ‘प्रचार करने’ संक्षिप्त और सामान्य हिन्दी अभिव्यक्ति है; ‘घोषणा करने’ भी संभव है।
theological_decisions:
- issue: क्या मुख्य पाठ में ‘प्रेरित’ की उपाधि जोड़ी जाए
  choice: मुख्य पाठ में ‘प्रेरित’ नहीं जोड़ा गया।
  alternative: 'कुछ पांडुलिपियों के अनुसार: ‘जिन्हें उसने प्रेरित भी नाम दिया।’'
  rationale: दिए गए SBLGNT पाठ में केवल ‘उसने बारह को नियुक्त किया’ है। अतः मुख्य पाठ में अनुपस्थित उपाधि जोड़ना उचित नहीं; महत्त्वपूर्ण पाठांतर को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। दोनों ἵνα उपवाक्यों को ‘ताकि … और ताकि …’ से अलग-अलग रखा गया है, जिससे शिष्य उसके साथ रहें और वह उन्हें भेजे—इन दोनों उद्देश्यों की संरचना स्पष्ट बनी रहे।
