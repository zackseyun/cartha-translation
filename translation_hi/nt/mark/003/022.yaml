source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς οἱ ἀπὸ Ἱεροσολύμων καταβάντες ἔλεγον ὅτι Βεελζεβοὺλ ἔχει καὶ ὅτι ἐν τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/022.yaml
  text: And the scribes who had come down from Jerusalem were saying[a], “He has Beelzebul,” and[c][b], “By the ruler of the demons he casts out the demons.”
translation:
  language: hi
  text: और यरूशलेम से उतरकर आए शास्त्री कह रहे थे, “उसमें बेलज़ेबूल[b] है[a],” और “वह दुष्टात्माओं के शासक के द्वारा[c] दुष्टात्माओं को निकालता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “वह बेलज़ेबूल के वश में है।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी बेलज़ेबूल; पारंपरिक रूप “बेलज़ेबूब।”
    reason: alternative_reading
  - marker: c
    text: या, “दुष्टात्माओं के प्रधान के द्वारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के यहूदी संदर्भ में यह मान्य धार्मिक-कानूनी विद्वानों को सूचित करता है; आधुनिक हिन्दी बाइबल-पाठकों के लिए प्रचलित और पर्याप्त रूप से स्पष्ट पद है।
- source_word: ἀπὸ Ἱεροσολύμων καταβάντες
  choice: यरूशलेम से उतरकर आए
  rationale: यरूशलेम से भौगोलिक रूप से ‘नीचे आने’ का दिशात्मक भाव बचाता है और हिन्दी में स्वाभाविक कृदंत-रचना देता है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चलती या दोहराई जा रही बात का संकेत देता है; ‘कह रहे थे’ उस पक्ष को सहज हिन्दी में बनाए रखता है।
- source_word: Βεελζεβοὺλ
  choice: बेलज़ेबूल
  rationale: SBLGNT के यूनानी रूप Βεελζεβούλ का सीधा देवनागरी लिप्यंतरण है; ‘बेलज़ेबूब’ पाठांतर नहीं बल्कि पारंपरिक रूप है, इसलिए टिप्पणी में दिया गया है।
- source_word: ἔχει
  choice: उसमें … है
  rationale: यूनानी का शाब्दिक अर्थ ‘रखता/है’ है। हिन्दी में ‘उसमें बेलज़ेबूल है’ आरोप को समझने योग्य रखते हुए ‘वह बेलज़ेबूल के वश में है’ जैसी स्पष्ट व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
- source_word: ἐν τῷ ἄρχοντι τῶν δαιμονίων
  choice: दुष्टात्माओं के शासक के द्वारा
  rationale: यहाँ ἐν साधन या प्रभाव के क्षेत्र को व्यक्त करता है; ‘के द्वारा’ हिन्दी में आरोपित शक्ति/माध्यम को स्पष्ट करता है। ἄρχων के लिए आधुनिक और सामान्य ‘शासक’ चुना गया है।
- source_word: δαιμονίων / δαιμόνια
  choice: दुष्टात्माओं / दुष्टात्माओं को
  rationale: δαιμόνιον के लिए प्रचलित, सुबोध हिन्दी समतुल्य है और ‘अशुद्ध आत्मा’ जैसे भिन्न यूनानी पद को आयात नहीं करता।
- source_word: ἐκβάλλει
  choice: निकालता है
  rationale: झाड़ने अथवा निष्कासन के संदर्भ में बलपूर्वक बाहर करने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: Βεελζεβοὺλ ἔχει आरोप का अनुवाद
  choice: उसमें बेलज़ेबूल है
  alternative: वह बेलज़ेबूल के वश में है
  rationale: मुख्य पाठ यूनानी मुहावरे की संक्षिप्तता और अंतर्निहित अस्पष्टता को बचाता है; अधिक स्पष्ट भावार्थ पादटिप्पणी में दिया गया है ताकि दुष्टात्मिक अधिकार/वश के अर्थ को चुपचाप निर्णीत न किया जाए।
- issue: ἄρχων का पद
  choice: शासक
  alternative: प्रधान
  rationale: ‘शासक’ आधुनिक पाठक को अधिकार का अर्थ सीधे देता है। ‘प्रधान’ भी संभव है, पर मुख्य पाठ में अधिक सामान्य शब्द उपयुक्त है।
- issue: ἐν का संबंध
  choice: के द्वारा
  alternative: की शक्ति से
  rationale: साधनार्थक अर्थ संदर्भ में सर्वाधिक स्वाभाविक है, पर ‘की शक्ति से’ कहने पर मूल में स्पष्ट न किए गए ‘शक्ति’ शब्द का विस्तार जुड़ जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शास्त्री’, ‘दुष्टात्मा’ और ‘निकालना’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं, जबकि वाक्य-विन्यास को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
