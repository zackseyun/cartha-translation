  text: καὶ τὰ πνεύματα τὰ ἀκάθαρτα, ὅταν αὐτὸν ⸂ἐθεώρουν, προσέπιπτον⸃ αὐτῷ καὶ ⸀ἔκραζον ⸀λέγοντα ὅτι Σὺ εἶ ὁ υἱὸς τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/011.yaml
  text: And whenever the unclean spirits saw him[a], they fell down before him and cried out, saying, “You are the Son of God.”
translation:
  language: hi
  text: और जब-जब अशुद्ध आत्माएँ उसे देखतीं, वे उसके सामने गिर पड़तीं[a] और चिल्लाकर कहतीं, “तुम परमेश्वर के पुत्र हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको उसके सामने गिरा देतीं।” यूनानी क्रिया किसी के सामने अधीनता या विनती में गिर पड़ने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πνεύματα τὰ ἀκάθαρτα
  choice: अशुद्ध आत्माएँ
  rationale: यह मूल पदबंध का सीधा और प्रचलित सुसमाचारी शब्दावली के अनुरूप अनुवाद है; ‘दुष्ट आत्माएँ’ कहना ἀκάθαρτα के अशुद्धता-संबंधी अर्थ को अधिक व्याख्यात्मक बना देता।
- source_word: ὅταν
  choice: जब-जब
  rationale: इसके साथ आए अपूर्णकालीन क्रियारूप बार-बार होने वाली घटना दिखाते हैं; ‘जब-जब’ प्रत्येक अवसर पर हुई समान प्रतिक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐθεώρουν
  choice: देखतीं
  rationale: सन्दर्भ में साधारण ‘देखतीं’ पर्याप्त और स्वाभाविक है; पुनरावृत्ति का भाव ‘जब-जब’ से स्पष्ट है।
- source_word: προσέπιπτον αὐτῷ
  choice: उसके सामने गिर पड़तीं
  rationale: यह शारीरिक रूप से सामने गिरने या स्वयं को उसके आगे डाल देने का भाव सुरक्षित रखता है, पर उसे सीधे ‘आराधना’ नहीं कहता।
- source_word: ἔκραζον
  choice: चिल्लाकर
  rationale: यह κράζω की तीव्र और ऊँची पुकार को वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: λέγοντα
  choice: कहतीं
  rationale: नपुंसकलिंग बहुवचन कर्ता के साथ यूनानी सहभागी रूप का आशय हिन्दी में मुख्य क्रिया के साथ ‘चिल्लाकर कहतीं’ से स्वाभाविक रूप में आता है।
- source_word: Σὺ εἶ
  choice: तू ... है
  rationale: स्पष्ट यूनानी सर्वनाम का बल हिन्दी के प्रत्यक्ष संबोधन ‘तू’ से स्वाभाविक रूप में बना रहता है; आत्माएँ सामूहिक कर्ता होते हुए भी यीशु को एकवचन में संबोधित करती हैं।
- source_word: ὁ υἱὸς τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: यह पदवीगत और मसीह-संबंधी भार को स्पष्ट, पहचानने योग्य तथा सटीक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: अशुद्ध आत्माओं के यीशु के सामने गिरने को आराधना कहना या केवल दण्डवत्/गिर पड़ना
  choice: ‘उसके सामने गिर पड़तीं’ रखा गया, ‘उसकी आराधना करतीं’ नहीं।
  alternative: ‘उसे दण्डवत् करतीं’ या ‘उसकी आराधना करतीं’
  rationale: προσπίπτω श्रद्धा, विनती या विवश अधीनता में किसी के सामने गिरने को सूचित कर सकता है। पद स्वयं स्पष्ट रूप से आराधना नहीं कहता, इसलिए अनुवाद दृश्य शारीरिक क्रिया को रखता और उसके धार्मिक अर्थ को सन्दर्भ के लिए खुला छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘जब-जब ... देखतीं ... गिर पड़तीं ... कहतीं’ से यूनानी के पुनरावृत्त अपूर्णकालीन भाव को व्यक्त किया गया है। प्रत्यक्ष वचन में ‘तू’ बाइबलीय हिन्दी के परिचित एकवचन संबोधन को बनाए रखता है।
