review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the iterative force of ὅταν with the imperfect verbs ('जब-जब'), the unclean spirits, their falling before Jesus, and their crying out. It appropriately avoids interpreting προσέπιπτον as worship. The footnote responsibly preserves the stronger physical alternative, 'threw themselves down.'
  naturalness: The narrative is clear and idiomatic modern Hindi. In this target register, however, 'तू' can sound markedly intimate or disparaging in contemporary usage. 'तुम ... हो' is the normal respectful singular address and retains the Greek's direct second-person assertion without importing a social tone not specified by the source.
  terminology: '''अशुद्ध आत्माएँ'' correctly retains the established Gospel expression and the semantic range of ἀκάθαρτα. ''परमेश्वर का पुत्र'' faithfully preserves the titular expression ὁ υἱὸς τοῦ θεοῦ. ''उसके सामने गिर पड़तीं'' is suitably noninterpretive for προσπίπτω.'
  issues:
  - severity: low
    issue: The direct address 'तू परमेश्वर का पुत्र है' is not the most natural neutral-respectful form in modern standard Hindi.
    rationale: Greek Σὺ εἶ is singular and emphatic, but it does not itself encode the potentially derogatory or overly intimate social coloring that 'तू' may carry in contemporary Hindi. 'तुम परमेश्वर के पुत्र हो' is a natural singular respectful address and preserves the assertion.
