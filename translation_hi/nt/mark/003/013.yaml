  text: Καὶ ἀναβαίνει εἰς τὸ ὄρος καὶ προσκαλεῖται οὓς ἤθελεν αὐτός, καὶ ἀπῆλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/013.yaml
  text: And he went up on the mountain and called to himself those whom he wanted[b][a], and they came to him.
translation:
  language: hi
  text: फिर वह पहाड़ पर चढ़ गया और जिन्हें वह स्वयं चाहता था, उन्हें अपने पास बुलाया; और वे उसके पास गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναβαίνει
  choice: चढ़ गया
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर स्वाभाविक हिन्दी कथन में भूतकाल उचित है; ‘चढ़ गया’ ऊपर जाने की दिशा को स्पष्ट रखता है।
- source_word: εἰς τὸ ὄρος
  choice: पहाड़ पर
  rationale: ἀναβαίνει के साथ यह पद पहाड़ पर ऊपर जाने का भाव देता है; ‘पहाड़ पर’ सहज और सटीक हिन्दी है।
- source_word: προσκαλεῖται
  choice: अपने पास बुलाया
  rationale: मध्यवाच्य रूप यीशु की व्यक्तिगत सहभागिता और अपने निकट बुलाने का भाव देता है; यह केवल सामान्य ‘बुलाया’ से अधिक स्पष्ट है।
- source_word: οὓς ἤθελεν αὐτός
  choice: जिन्हें वह स्वयं चाहता था
  rationale: स्पष्ट αὐτός के बलाघात को ‘स्वयं’ सुरक्षित रखता है, जबकि ‘चाहता था’ θέλω का स्वाभाविक हिन्दी रूप है।
- source_word: ἀπῆλθον πρὸς αὐτόν
  choice: वे उसके पास गए
  rationale: ἀπέρχομαι के जाने के भाव और πρὸς αὐτόν की यीशु की ओर गति—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बुलाए गए लोगों के चुनाव में यीशु की अपनी इच्छा पर बल
  choice: ‘जिन्हें वह स्वयं चाहता था’ कहकर αὐτός का बल बनाए रखा गया।
  alternative: ‘जिन्हें वह चाहता था’
  rationale: पद यीशु की अपनी पहल पर बल देता है, पर अनुवाद इससे आगे बढ़कर चुनाव के किसी व्यापक धर्मवैज्ञानिक सिद्धांत को स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘फिर’ आरंभिक Καὶ को हिन्दी कथा-प्रवाह में स्वाभाविक रूप देता है।
