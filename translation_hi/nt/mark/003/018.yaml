  text: καὶ Ἀνδρέαν καὶ Φίλιππον καὶ Βαρθολομαῖον καὶ Μαθθαῖον καὶ Θωμᾶν καὶ Ἰάκωβον τὸν τοῦ Ἁλφαίου καὶ Θαδδαῖον καὶ Σίμωνα τὸν ⸀Καναναῖον
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/018.yaml
  text: and Andrew[a], and Philip, and Bartholomew, and Matthew, and Thomas, and James the son of Alphaeus, and Thaddaeus, and Simon the Cananaean.
translation:
  language: hi
  text: और अन्द्रियास, फिलिप्पुस, बरतुलमै, मत्ती, थोमा, हलफई का पुत्र याकूब, तद्दय, और शमौन कनानी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी Καναναῖος। संभवतः यह अरामी मूल के शब्द का यूनानी रूप है, जिसका अर्थ “उत्साही” हो सकता है; लूका 6:15 में इसी शमौन को “उत्साही” कहा गया है। यहाँ इसका अर्थ कनान देश का निवासी होना संभवतः नहीं है।
    reason: शमौन के उपनाम Καναναῖος का संभावित अर्थ स्पष्ट करना और इसे जातीय या भौगोलिक पहचान समझे जाने से बचाना।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यूनानी की संयोजक सूची-रचना को स्वाभाविक हिन्दी में बनाए रखता है; प्रत्येक नाम से पहले इसे दोहराने के बजाय सूची के आरम्भ और अंतिम सदस्य के पहले रखना आधुनिक हिन्दी में अधिक सहज है।
- source_word: Ἀνδρέαν
  choice: अन्द्रियास
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Φίλιππον
  choice: फिलिप्पुस
  rationale: यूनानी नाम के निकट और हिन्दी में प्रचलित लिप्यंतरण।
- source_word: Βαρθολομαῖον
  choice: बरतुलमै
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Μαθθαῖον
  choice: मत्ती
  rationale: नाम का स्थापित और सहज हिन्दी रूप।
- source_word: Θωμᾶν
  choice: थोमा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ἰάκωβον τὸν τοῦ Ἁλφαίου
  choice: हलफई का पुत्र याकूब
  rationale: लेख और संबंधकारक पदबंध यहाँ पिता के द्वारा याकूब की पहचान कराते हैं; हिन्दी में ‘का पुत्र’ अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: Θαδδαῖον
  choice: तद्दै
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: Σίμωνα τὸν Καναναῖον
  choice: शमौन कनानी
  rationale: विशेषण Καναναῖον के मार्कुस-विशिष्ट रूप को मुख्य पाठ में सीधे सुरक्षित रखा गया है; संभावित अरामी अर्थ और भ्रामक जातीय अर्थ से बचाव पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: शमौन के लिए Καναναῖος उपनाम का अर्थ
  choice: मुख्य पाठ में ‘कनानी’, साथ में अर्थ-स्पष्टीकरण वाली पादटिप्पणी
  alternative: ‘उत्साही शमौन’ अथवा ‘ज़ीलोती शमौन’
  rationale: यूनानी पाठ का रूप Καναναῖος है, जबकि लूका 6:15 का ζηλωτής संभवतः उसके अरामी आशय ‘उत्साही’ को स्पष्ट करता है। मुख्य पाठ में रूप को सुरक्षित रखना मूल की विशिष्टता और कुछ lexical ambiguity बनाए रखता है; पादटिप्पणी यह रोकती है कि इसे कनान-निवासी जातीय पहचान समझ लिया जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। यूनानी की लगातार καὶ-श्रृंखला को शब्दशः हर नाम के पहले दोहराने के बजाय स्वाभाविक हिन्दी सूची-विन्यास अपनाया गया है।
