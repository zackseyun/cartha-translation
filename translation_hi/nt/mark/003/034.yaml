  text: καὶ περιβλεψάμενος ⸂τοὺς περὶ αὐτὸν κύκλῳ⸃ καθημένους λέγει· Ἴδε ἡ μήτηρ μου καὶ οἱ ἀδελφοί μου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/034.yaml
  text: And looking around at those seated around him in a circle[a], he says, “Behold, my mother and my brothers!”
translation:
  language: hi
  text: और उसके चारों ओर घेरे में बैठे लोगों की ओर नज़र दौड़ाकर वह कहता है, “देखो, मेरी माता और मेरे भाई[a]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई-बहन।” यूनानी शब्द का शाब्दिक अर्थ “भाई” है, पर यीशु के चारों ओर बैठे व्यापक समूह में स्त्रियाँ भी शामिल हो सकती थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: नज़र दौड़ाकर
  rationale: यह अभिव्यक्ति यीशु के जान-बूझकर चारों ओर देखने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है और कृदन्त का मुख्य क्रिया से संबंध बनाए रखती है।
- source_word: τοὺς περὶ αὐτὸν κύκλῳ καθημένους
  choice: अपने चारों ओर घेरे में बैठे लोगों
  rationale: ‘चारों ओर’ περὶ αὐτόν का और ‘घेरे में’ κύκλῳ का स्थानिक बल बनाए रखता है; ‘बैठे लोगों’ καθημένους का स्वाभाविक हिन्दी रूप है।
- source_word: λέγει
  choice: वह कहता है
  rationale: वर्तमान काल मरकुस के ऐतिहासिक वर्तमान की सजीव कथन-शैली को सुरक्षित रखता है।
- source_word: Ἴδε
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले आदेश का स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी रूप है।
- source_word: μήτηρ
  choice: माता
  rationale: मानक अर्थ; ‘माता’ प्रसंगानुकूल, सहज और गरिमापूर्ण है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। मुख्य पाठ में स्रोत का रूप रखा गया है, जबकि संभावित व्यापक अर्थ को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: ऐसे शिष्य-समूह के संदर्भ में ἀδελφοί का लिंगसूचक पारिवारिक अर्थ, जिसमें स्त्रियाँ भी रही होंगी
  choice: भाई
  alternative: भाई-बहन
  rationale: मुख्य पाठ में यूनानी के स्पष्ट पुल्लिंग बहुवचन को सुरक्षित रखा गया है। फिर भी आसपास बैठे व्यापक समूह में स्त्रियाँ शामिल हो सकती थीं, इसलिए इस संभावित समावेशी अर्थ को बिना निर्णायक बनाए पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नज़र दौड़ाकर’ दृश्य क्रिया को स्वाभाविक बनाता है, जबकि ‘वह कहता है’ मरकुस के सजीव ऐतिहासिक वर्तमान को बनाए रखता है।
