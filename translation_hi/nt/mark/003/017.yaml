  text: καὶ Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν τοῦ Ἰακώβου (καὶ ἐπέθηκεν αὐτοῖς ⸀ὀνόματα Βοανηργές, ὅ ἐστιν Υἱοὶ Βροντῆς),
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/017.yaml
  text: and James the son of Zebedee[a], and John the brother of James (he gave them the name Boanerges, which means Sons of Thunder),
translation:
  language: hi
  text: और ज़बदी के पुत्र याकूब और याकूब के भाई यूहन्ना को (उसने उन्हें बोअनर्गेस नाम दिया[a], जिसका अर्थ है “गर्जन के पुत्र”),
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “नाम” बहुवचन है; संभवतः यह दोनों भाइयों को दिए गए एक साझा उपनाम के लिए सामूहिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἰάκωβον
  choice: याकूब
  rationale: Ἰάκωβος का प्रचलित और स्रोत-निकट हिन्दी रूप; हिन्दी बाइबल परंपरा में इस प्रेरित के लिए यही नाम सामान्य है।
- source_word: τὸν τοῦ Ζεβεδαίου
  choice: ज़बदी के पुत्र
  rationale: लेख + संबंधकारक की यूनानी रचना यहाँ पिता-पुत्र के संबंध से पहचान कराती है; हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: Ἰωάννης का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: τὸν ἀδελφὸν τοῦ Ἰακώβου
  choice: याकूब के भाई
  rationale: ἀδελφός यहाँ वास्तविक पारिवारिक भाई को दर्शाता है।
- source_word: ἐπέθηκεν αὐτοῖς ὀνόματα
  choice: उसने उन्हें … नाम दिया
  rationale: ἐπιτίθημι का ὀνόματα के साथ मुहावरेदार अर्थ नाम रखना या देना है। हिन्दी में एक साझा उपनाम के लिए एकवचन अधिक स्वाभाविक है; यूनानी बहुवचन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: Βοανηργές
  choice: बोअनर्गेस
  rationale: वर्णन स्वयं सामी उपनाम को ध्वन्यंतरित करके फिर उसका अर्थ बताता है, इसलिए दोनों स्तर बनाए रखे गए हैं।
- source_word: ὅ ἐστιν
  choice: जिसका अर्थ है
  rationale: यह सूत्र अगले पदबंध को उपनाम की व्याख्या के रूप में प्रस्तुत करता है।
- source_word: Υἱοὶ Βροντῆς
  choice: गर्जन के पुत्र
  rationale: उपाधि की सजीव छवि और बहुवचन दोनों को निकटता से सुरक्षित रखता है।
theological_decisions:
- issue: याकूब और यूहन्ना के व्याख्यात्मक उपनाम का रूप
  choice: ध्वन्यंतरित “बोअनर्गेस” और उसका अर्थ “गर्जन के पुत्र”—दोनों रखना
  alternative: केवल अर्थ का अनुवाद करना
  rationale: यूनानी पाठ स्वयं विदेशी रूप और उसकी व्याख्या दोनों देता है; दोनों को रखना पाठ की शैली और संभावित अर्थगत तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। पद को उसके पूर्ववर्ती वाक्य की सूची से जुड़े अंश के रूप में रखा गया है। नामों के लिए हिन्दी बाइबल में परिचित रूप अपनाए गए हैं और अनावश्यक धर्म-सांप्रदायिक व्याख्या से बचा गया है।
