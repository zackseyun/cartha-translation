  edition: SBLGNT
  text: καὶ ἐὰν βασιλεία ἐφ’ ἑαυτὴν μερισθῇ, οὐ δύναται σταθῆναι ἡ βασιλεία ἐκείνη·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/024.yaml
  text: And if a kingdom is divided against itself, that kingdom cannot stand.
translation:
  language: hi
  text: और यदि कोई राज्य अपने ही विरुद्ध बँट जाए, तो वह राज्य टिक नहीं सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक है और पिछले तर्क के साथ वाक्य का सीधा संबंध बनाए रखता है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह संभाव्य शर्त प्रस्तुत करता है; गरिमापूर्ण आधुनिक हिन्दी में ‘यदि’ स्वाभाविक है।
- source_word: βασιλεία
  choice: राज्य
  rationale: यहाँ राजनीतिक-सामुदायिक इकाई का रूपक है; ‘राज्य’ अमूर्त ‘शासन’ की अपेक्षा अधिक उपयुक्त है।
- source_word: ἐφ’ ἑαυτὴν
  choice: अपने ही विरुद्ध
  rationale: इस प्रसंग में ἐπί और आत्मवाचक सर्वनाम का अर्थ आंतरिक विरोध है; ‘ही’ उस आत्म-विरोध को स्पष्ट और स्वाभाविक ढंग से उभारता है।
- source_word: μερισθῇ
  choice: बँट जाए
  rationale: यह μερίζω का कर्मवाच्य संभाव्य रूप है। ‘बँट जाए’ कारण को अनिर्धारित रखते हुए आंतरिक विभाजन को सहज हिन्दी में व्यक्त करता है।
- source_word: οὐ δύναται
  choice: नहीं सकता
  rationale: यह असमर्थता को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: σταθῆναι
  choice: टिक
  rationale: यहाँ क्रिया का आशय स्थापित बने रहने या कायम रहने से है; ‘टिक नहीं सकता’ मूल रूपक और मुहावरेदार हिन्दी दोनों को बनाए रखता है।
- source_word: ἡ βασιλεία ἐκείνη
  choice: वह राज्य
  rationale: संज्ञा की पुनरावृत्ति और संकेतवाचक शब्द मूल यूनानी की बलाघातपूर्ण संरचना को सहज हिन्दी में सुरक्षित रखते हैं।
theological_decisions:
- issue: कथन का स्वरूप
  choice: इसे यीशु के तर्क के भीतर एक सामान्य सिद्धांत के रूप में रखा गया है।
  alternative: इसे सभी राजनीतिक या सामाजिक संस्थाओं पर लागू व्यापक सिद्धांत के रूप में स्पष्ट करना।
  rationale: पद स्वयं एक उपमा-सदृश तर्क प्रस्तुत करता है; अनुवाद इसके कथन को न तो शैतान के विषय में अतिरिक्त सिद्धांत तक फैलाता है, न व्यापक राजनीतिक निष्कर्ष जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘अपने ही विरुद्ध बँट जाए’ आंतरिक विरोध को स्पष्ट करता है, और ‘टिक नहीं सकता’ मूल के ‘खड़े रहने’ वाले रूपक का स्वाभाविक हिन्दी समतुल्य है।
