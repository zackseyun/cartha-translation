  yaml_path: translation/nt/mark/003/012.yaml
  text: And he sternly warned them many times not to make him known[a].
translation:
  language: hi
  text: और वह उन्हें बार-बार कड़ी चेतावनी देता रहा कि वे उसे प्रकट न करें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे जाहिर न करें” या “उसे सार्वजनिक न करें”; अधिक औपचारिक रूप में, “उसे प्रकट न करें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλὰ
  choice: बार-बार
  rationale: नपुंसकलिंग बहुवचन का क्रियाविशेषणीय प्रयोग यहाँ चेतावनी की पुनरावृत्ति या तीव्रता दिखाता है। अपूर्णकालीन क्रिया के साथ ‘बार-बार’ प्रसंग में स्वाभाविक रूप से पुनरावृत्ति व्यक्त करता है।
- source_word: ἐπετίμα
  choice: कड़ी चेतावनी देता रहा
  rationale: ἐπιτιμάω की अधिकारपूर्ण और कठोर रोक को व्यक्त करता है। ‘देता रहा’ यूनानी अपूर्णकाल के जारी या दोहराए गए कार्य को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह निकटवर्ती प्रसंग के अशुद्ध आत्माओं की ओर संकेत करने वाला दत्तिव बहुवचन सर्वनाम है; पद में उन्हें फिर से नाम देना आवश्यक नहीं।
- source_word: ἵνα μὴ
  choice: कि वे ... न करें
  rationale: यह चेतावनी की निषेधात्मक विषय-वस्तु या उद्देश्य को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτὸν φανερὸν ποιήσωσιν
  choice: वे उसे प्रकट न करें
  rationale: φανερὸν ποιέω का अर्थ किसी को प्रकट, जाहिर या लोगों पर विदित करना है। ‘उसे प्रकट न करें’ मूल की संक्षिप्तता और इस अस्पष्टता को बनाए रखता है कि उसके विषय में ठीक क्या प्रकट नहीं करना था।
theological_decisions:
- issue: अशुद्ध आत्माओं को यीशु की आज्ञा का आशय
  choice: आज्ञा को यीशु को प्रकट न करने की मनाही के रूप में रखा गया है, बिना यह जोड़े कि उसकी कौन-सी पहचान या उपाधि प्रकट नहीं करनी थी।
  alternative: इसे विशेष रूप से ‘परमेश्वर का पुत्र’ होने की पहचान बताने की मनाही के रूप में स्पष्ट करना।
  rationale: निकटवर्ती प्रसंग यीशु की पहचान के उद्घाटन की ओर संकेत करता है, पर इस पद में केवल उसे प्रकट न करने की बात है। इसलिए अनुवाद पद से अधिक विशिष्ट मसीही उपाधि नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘बार-बार ... देता रहा’ πολλὰ और अपूर्णकाल, दोनों की पुनरावृत्त या जारी क्रिया को उभारता है। मुख्य पाठ में [a] का चिह्न संबंधित वाक्यांश के तुरंत बाद रखा गया है।
