  text: καὶ ⸂ἐποίησεν τοὺς δώδεκα, καὶ⸃ ἐπέθηκεν ⸂ὄνομα τῷ Σίμωνι⸃ Πέτρον,
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/016.yaml
  text: And he appointed the twelve[a], and he gave Simon the name Peter,
translation:
  language: hi
  text: और उसने बारहों को नियुक्त किया और शमौन का नाम पतरस[a] रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पतरस’ नाम का अर्थ ‘चट्टान’ है।
    reason: नाम के यूनानी अर्थ को स्पष्ट करना, जबकि मुख्य पाठ में व्यक्तिनाम का लिप्यंतरण बनाए रखना।
lexical_decisions:
- source_word: ἐποίησεν
  choice: नियुक्त किया
  rationale: क्रिया का मूल अर्थ ‘बनाया’ है, पर यहाँ यीशु द्वारा बारह जनों को एक विशिष्ट समूह के रूप में ठहराने का भाव है। ‘नियुक्त किया’ इस प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς δώδεκα
  choice: बारहों को
  rationale: यह यीशु के चुने हुए बारह जनों के पहचाने हुए समूह को सूचित करता है। ‘बारहों’ संक्षिप्त, स्वाभाविक और यूनानी निश्चित पदबंध के अनुरूप है।
- source_word: ἐπέθηκεν ὄνομα
  choice: नाम दिया
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘नाम रखा/ऊपर नाम रखा’ है। ‘नाम दिया’ नामकरण की क्रिया को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: Σίμωνι
  choice: शमौन
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय परंपरा और मूल उच्चारण के निकट प्रचलित रूप में लिप्यंतरित किया गया है।
- source_word: Πέτρον
  choice: पतरस
  rationale: यहाँ शब्द शमौन को दिए गए व्यक्तिनाम के रूप में प्रयुक्त है, इसलिए उसका अनुवाद मुख्य पाठ में ‘चट्टान’ न करके प्रचलित हिन्दी रूप ‘पतरस’ रखा गया है; नाम का अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बारह जनों के प्रति यीशु की क्रिया
  choice: बारहों को नियुक्त किया
  alternative: बारहों को बनाया / बारहों को ठहराया
  rationale: यह कथन बारह जनों को एक विशिष्ट समूह के रूप में स्थापित करने का संकेत देता है। ‘नियुक्त किया’ उस औपचारिक भाव को रखता है, पर बाद की कलीसियाई पदावली पाठ में नहीं जोड़ता।
- issue: Πέτρος का निर्वाह
  choice: पतरस
  alternative: चट्टान
  rationale: Πέτρος यहाँ दिए गए व्यक्तिनाम के रूप में कार्य करता है। इसलिए मुख्य पाठ में नाम का लिप्यंतरण किया गया है और उसके अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले कथन से जुड़ा हुआ है, इसलिए आरंभ का ‘और’ मूल यूनानी संयोजक को बनाए रखता है।
