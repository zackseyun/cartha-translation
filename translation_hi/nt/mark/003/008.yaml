  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। आरंभिक ‘और’ तथा भौगोलिक सूची में दोहराया गया ‘और’ पिछले पद से संबंध और मरकुस की संचयी शैली को सुरक्षित रखते हैं। ‘यह सुनकर’ स्वाभाविक हिन्दी है, पर टिप्पणी में कृदंत की समय/कारण संबंधी हल्की अस्पष्टता स्वीकार की गई है।
