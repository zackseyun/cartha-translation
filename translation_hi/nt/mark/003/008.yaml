  text: καὶ ἀπὸ Ἱεροσολύμων καὶ ἀπὸ τῆς Ἰδουμαίας ⸀καὶ πέραν τοῦ Ἰορδάνου ⸁καὶ περὶ Τύρον καὶ Σιδῶνα, πλῆθος πολύ, ⸀ἀκούοντες ὅσα ⸀ἐποίει ἦλθον πρὸς αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/008.yaml
  text: and from Jerusalem[a], and from Idumea, and beyond the Jordan, and around Tyre and Sidon, a great crowd, hearing what he was doing[c][b], came to him.
translation:
  language: hi
  text: और यरूशलेम से, और इदूमिया से, और यरदन के पार से[a], और सूर और सैदा के आसपास के इलाके से[b], एक बड़ी भीड़, जो कुछ वह कर रहा था उसे सुनकर[c], उसके पास आई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन की दूसरी ओर के इलाके से।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “सूर और सैदा के आसपास”; आशय इन नगरों के निकटवर्ती क्षेत्र से भी हो सकता है, केवल नगरों से नहीं।
    reason: lexical_alternative
  - marker: c
    text: या, “वह जो कुछ कर रहा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ Ἱεροσολύμων
  choice: यरूशलेम से
  rationale: ἀπό के साथ संबंधकारक उद्गम या प्रस्थान-स्थान बताता है; स्थान-नाम का प्रचलित हिन्दी रूप ‘यरूशलेम’ रखा गया है।
- source_word: ἀπὸ τῆς Ἰδουμαίας
  choice: इदूमिया से
  rationale: क्षेत्र के नाम को मानक हिन्दी लिप्यंतरण में रखते हुए ἀπό का उद्गम-सूचक अर्थ व्यक्त किया गया है।
- source_word: πέραν τοῦ Ἰορδάνου
  choice: यरदन के पार से
  rationale: πέραν के स्थानिक अर्थ और सूची में निहित ‘से’ को स्वाभाविक हिन्दी में स्पष्ट करता है; इसका संकेत यरदन नदी की दूसरी ओर के क्षेत्र से है।
- source_word: περὶ Τύρον καὶ Σιδῶνα
  choice: सूर और सैदा के आसपास के इलाके से
  rationale: περί यहाँ नगरों के निकटवर्ती क्षेत्र को सूचित करता है, केवल नगरों को नहीं; ‘इलाके से’ सूची के उद्गम-सूचक ढाँचे को स्पष्ट करता है।
- source_word: πλῆθος πολύ
  choice: एक बड़ी भीड़
  rationale: बहुत बड़ी संख्या में एकत्र लोगों के लिए सरल, आधुनिक और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: ἀκούοντες
  choice: यह सुनकर
  rationale: वर्तमान कृदंत मुख्य क्रिया से जुड़ी परिस्थिति बताता है। हिन्दी में ‘यह सुनकर’ स्वाभाविक है, यद्यपि यूनानी व्याकरण समय और कारण के बीच संबंध को पूर्णतः निश्चित नहीं करता।
- source_word: ὅσα ἐποίει
  choice: वह क्या-क्या कर रहा था
  rationale: ὅσα कार्यों की बहुलता अथवा व्यापकता व्यक्त कर सकता है और अपूर्ण भूतकाल ἐποίει जारी गतिविधि को दर्शाता है; ‘क्या-क्या कर रहा था’ दोनों पहलुओं को सहज हिन्दी में रखता है।
- source_word: ἦλθον πρὸς αὐτόν
  choice: उसके पास आई
  rationale: πρός के साथ यह वाक्यांश किसी व्यक्ति की ओर जाकर उसके पास पहुँचने को बताता है। ‘भीड़’ हिन्दी में स्त्रीलिंग एकवचन है, इसलिए ‘आई’ स्वाभाविक व्याकरणिक सामंजस्य है।
- source_word: καὶ … καὶ … καὶ
  choice: और … और … और
  rationale: बार-बार आए καί को बनाए रखने से मरकुस की संचयी भौगोलिक सूची और उसकी लय सुरक्षित रहती है।
