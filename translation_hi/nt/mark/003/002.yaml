base_translation:
  language: en
  yaml_path: translation/nt/mark/003/002.yaml
  text: And they were watching him closely to see whether he would heal him on the Sabbath[a], so that they might accuse him.
translation:
  language: hi
  text: और वे उस पर कड़ी नज़र रख रहे थे कि वह सब्त के दिन[a] उस मनुष्य को चंगा करेगा या नहीं, ताकि वे उस पर आरोप लगा सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ बहुवचन रूप ‘सब्तों’ है, जो एक सब्त-दिन के लिए भी मुहावरेदार रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρετήρουν
  choice: कड़ी नज़र रखे हुए थे
  rationale: अपूर्ण काल लगातार चल रही निगरानी को व्यक्त करता है, और संदर्भ में παρατηρέω संदेहपूर्ण तथा विरोधी मंशा से ध्यानपूर्वक देखने का भाव रखता है।
- source_word: εἰ
  choice: कि ... या नहीं
  rationale: देखने या निगरानी रखने की क्रिया के बाद εἰ यहाँ परोक्ष प्रश्न प्रस्तुत करता है; हिन्दी में ‘कि ... या नहीं’ स्वाभाविक रूप से ‘whether’ का भाव देता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन[a]
  rationale: यूनानी में यह बहुवचन रूप है, पर कोइने यूनानी में यह किसी एक सब्त-दिन के लिए मुहावरेदार ढंग से प्रयुक्त हो सकता है। संदर्भ और स्वाभाविक हिन्दी के लिए एकवचन अर्थ रखा गया है तथा रूपगत जानकारी पादटिप्पणी में दी गई है।
- source_word: θεραπεύσει
  choice: चंगा करेगा
  rationale: भविष्यत् सूचक रूप परोक्ष प्रश्न में अपेक्षित कार्य को बताता है। हिन्दी में ‘करेगा या नहीं’ काल और प्रश्नात्मक अनिश्चितता दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: αὐτόν
  choice: उस मनुष्य को
  rationale: इस पद में दो अलग पुरुषवाचक सर्वनाम यीशु और रोगी के लिए आए हैं। केवल ‘उसे’ कहने से हिन्दी में संदर्भ अस्पष्ट हो सकता था; ‘उस मनुष्य को’ पूर्वपद में उल्लिखित रोगी को स्पष्ट करता है, कोई नई पहचान नहीं जोड़ता।
- source_word: ἵνα κατηγορήσωσιν αὐτοῦ
  choice: ताकि वे उस पर आरोप लगा सकें
  rationale: ἵνα उद्देश्य बताता है और κατηγορέω दोषारोपण का अर्थ देता है। यह अनुवाद उनकी विरोधी मंशा रखता है, पर औपचारिक मुकदमे या अभियोजन का अनावश्यक संकेत नहीं जोड़ता।
theological_decisions:
- issue: निगरानी करने वालों की मंशा
  choice: उनकी निगरानी का उद्देश्य यीशु पर आरोप लगाने का आधार पाना था।
  alternative: ‘उस पर मुकदमा चला सकें’ जैसे अधिक विधिक शब्द
  rationale: κατηγορέω का न्यायिक प्रयोग हो सकता है, पर इस पद में औपचारिक कानूनी कार्यवाही निर्दिष्ट नहीं है। इसलिए ‘आरोप’ मूल पाठ की विरोधी मंशा को रखता है और उससे आगे नहीं जाता।
- issue: सब्त का वचन और यूनानी बहुवचन
  choice: मुख्य पाठ में स्वाभाविक हिन्दी ‘सब्त के दिन’, साथ में पादटिप्पणी में यूनानी बहुवचन की सूचना
  alternative: मुख्य पाठ में ‘सब्तों के दिनों में’
  rationale: τοῖς σάββασιν रूपतः बहुवचन है, किंतु कोइने में एक सब्त-दिन के लिए मुहावरेदार हो सकता है। निकट संदर्भ एक विशेष अवसर की ओर संकेत करता है; पादटिप्पणी वास्तविक रूपगत अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘कड़ी नज़र रखे हुए थे’ निरंतर तथा शत्रुतापूर्ण निगरानी को सहज भाषा में व्यक्त करता है। ‘सब्त’ बाइबिलीय सांस्कृतिक पद के रूप में रखा गया है; अस्पष्ट सर्वनाम से बचने के लिए रोगी को ‘उस मनुष्य’ कहा गया है।
