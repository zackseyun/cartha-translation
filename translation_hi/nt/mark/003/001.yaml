  text: And he entered a synagogue again[c][b][a], and a man was there with a withered hand.
translation:
  language: hi
  text: फिर वह एक आराधनालय[a] में गया। वहाँ एक आदमी था, जिसका हाथ सूखा हुआ था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस आराधनालय में,” यदि मरकुस का संकेत उसी आराधनालय की ओर है जिसका प्रसंग पहले आ चुका है।
    reason: alternative_reading
  - marker: b
    text: या, “जिसका हाथ सूख गया था” अथवा “जिसका हाथ सिकुड़ गया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: फिर …। वहाँ
  rationale: पहला Καὶ कथा की अगली घटना को जोड़ता है; हिन्दी में ‘फिर’ स्वाभाविक है। दूसरे Καὶ को अलग वाक्य बनाकर प्रसंग का संबंध बनाए रखा गया है।
- source_word: εἰσῆλθεν πάλιν
  choice: फिर वह … में गया
  rationale: πάλιν पुनरावृत्ति बताता है। गति-सूचक εἰς के साथ εἰσῆλθεν का स्वाभाविक हिन्दी रूप ‘में गया’ है; ‘प्रवेश किया’ भी संभव है, पर यहाँ अपेक्षाकृत औपचारिक लगता है।
- source_word: εἰς συναγωγήν
  choice: एक आराधनालय में
  rationale: संज्ञा यूनानी में बिना निश्चित उपपद के है। ‘एक आराधनालय’ इस रूप को दर्शाता है, जबकि पादटिप्पणी संदर्भ से संभव निश्चित अर्थ को सुरक्षित रखती है।
- source_word: ἦν ἐκεῖ ἄνθρωπος
  choice: वहाँ एक आदमी था
  rationale: यह व्यक्ति की वहाँ उपस्थिति का सहज हिन्दी परिचय है और ἐκεῖ को स्पष्ट रूप से ‘वहाँ’ कहता है।
- source_word: ἐξηραμμένην ἔχων τὴν χεῖρα
  choice: जिसका हाथ सूख गया था
  rationale: Perfect participle हाथ की बनी हुई अवस्था को बताता है। ‘सूख गया था’ ξηραίνω के मूल चित्र और रोगग्रस्त हाथ की स्थायी दशा—दोनों को सरल हिन्दी में रखता है।
