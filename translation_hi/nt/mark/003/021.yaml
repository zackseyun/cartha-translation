revisions:
- from: जब उसके निकट के लोगों ने यह सुना[a], तो वे उसे पकड़ने के लिए निकल पड़े, क्योंकि वे कह रहे थे, “उसका दिमाग़ ठिकाने पर नहीं है।”[b]
  to: जब उसके अपने लोगों ने यह सुना[a], तो वे उसे पकड़ने के लिए निकल पड़े, क्योंकि वे कह रहे थे, “वह अपने आपे में नहीं है।”[b]
  rationale: The revision improves idiomatic modern Hindi and narrative register while preserving the ambiguity of the referent and the accusatory force of the Greek. It does not identify the group as Jesus’ family in the main text or turn the statement into a clinical diagnosis.
