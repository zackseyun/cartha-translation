source:
  edition: SBLGNT
  text: καὶ ἀκούσαντες οἱ παρ’ αὐτοῦ ἐξῆλθον κρατῆσαι αὐτόν, ἔλεγον γὰρ ὅτι ἐξέστη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/021.yaml
  text: And when those close to him heard[a], they went out to seize him, for they were saying[b], “He is out of his mind.”
translation:
  language: hi
  text: जब उसके अपने लोगों ने यह सुना[a], तो वे उसे पकड़ने के लिए निकल पड़े, क्योंकि वे कह रहे थे, “वह अपने आपे में नहीं है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके परिवार के लोगों ने” अथवा “उसके निकट के लोगों ने”; यूनानी अभिव्यक्ति मुहावरेदार है और यीशु के घराने या उसके निकट के लोगों की ओर विशेष रूप से संकेत कर सकती है।
    reason: alternative_reading
  - marker: b
    text: या “वह अपना मानसिक संतुलन खो बैठा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ παρ’ αὐτοῦ
  choice: उसके निकट के लोग
  rationale: यह यूनानी मुहावरा यीशु से जुड़े लोगों की ओर संकेत करता है और प्रसंग में उसके परिवार को भी सूचित कर सकता है, पर स्वयं स्पष्ट संबंधसूचक शब्द नहीं है। यह चयन उस अस्पष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀκούσαντες
  choice: जब ... ने यह सुना
  rationale: एओरिस्ट कृदन्त को समयसूचक रूप में प्रस्तुत किया गया है; ‘यह’ पिछले प्रसंग की खबर की ओर स्वाभाविक संकेत करता है।
- source_word: ἐξῆλθον
  choice: निकल पड़े
  rationale: यह कथानक में उद्देश्यपूर्ण प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उनके आरंभिक स्थान को अनावश्यक रूप से निश्चित किए।
- source_word: κρατῆσαι
  choice: उसे पकड़ने के लिए
  rationale: κρατέω के बलपूर्वक हाथ में लेने के भाव को रखता है, पर कानूनी गिरफ्तारी या केवल रोकने का अर्थ आरोपित नहीं करता।
- source_word: ἔλεγον
  choice: वे कह रहे थे
  rationale: अपूर्णकाल के जारी या बार-बार कहे जाने वाले पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐξέστη
  choice: उसका दिमाग़ ठिकाने पर नहीं है
  rationale: मानसिक संतुलन खो देने के आरोप को स्पष्ट, वर्तमान और सामान्य हिन्दी में व्यक्त करता है; अत्यधिक चिकित्सकीय शब्दावली से बचता है।
theological_decisions:
- issue: οἱ παρ’ αὐτοῦ की पहचान
  choice: मुख्य पाठ में ‘उसके निकट के लोग’
  alternative: ‘उसका परिवार’ या ‘उसके अपने लोग’
  rationale: आगे का प्रसंग परिवार की संभावना को मजबूत करता है, फिर भी यूनानी पद स्वयं सीधे ‘परिवार’ नहीं कहता। इसलिए मुख्य पाठ में संबंध को व्यापक रखा गया और विशिष्ट विकल्प पादटिप्पणी में दिया गया।
- issue: ἐξέστη के कथन का आशय
  choice: इसे यीशु के मानसिक संतुलन के विषय में निकट के लोगों के कथन के रूप में रखा गया
  alternative: ‘वह अपने आपे में नहीं है’
  rationale: कथन का आरोपात्मक बल सुरक्षित रहता है, पर इसे किसी आधुनिक चिकित्सकीय निदान में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज और गरिमापूर्ण कथात्मक रूप। ‘दिमाग़ ठिकाने पर नहीं’ सामान्य पाठक के लिए स्पष्ट है; पादटिप्पणी अधिक शाब्दिक वैकल्पिक अभिव्यक्ति देती है।
