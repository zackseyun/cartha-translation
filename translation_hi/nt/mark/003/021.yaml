review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the temporal participle, the purposeful departure, the forceful yet non-legal sense of κρατῆσαι, and the ongoing force of ἔλεγον. It also appropriately avoids deciding whether οἱ παρ’ αὐτοῦ means Jesus’ family or a wider associated group. The rendering of ἐξέστη conveys the accusation, but the chosen Hindi wording is more colloquial than the narrative register and shifts attention to ‘his brain’ rather than retaining the idiomatic personal-state expression.
  naturalness: ‘उसके निकट के लोग’ is understandable but somewhat calqued and less idiomatic in modern Hindi. ‘उसके अपने लोग’ is more natural while retaining the source’s ambiguity. ‘उसका दिमाग़ ठिकाने पर नहीं है’ is common speech, but is unnecessarily colloquial for this register. ‘वह अपने आपे में नहीं है’ is idiomatic, dignified, and closely reflects the Greek expression.
  terminology: No theological terminology is at issue. ‘उसके अपने लोग’ preserves the ambiguity of οἱ παρ’ αὐτοῦ without prematurely identifying them as family. The footnote should retain family and close-circle possibilities as alternatives.
  issues:
  - severity: low
    issue: ‘उसके निकट के लोग’ is awkwardly literal Hindi.
    rationale: Modern standard Hindi more naturally uses ‘उसके अपने लोग’ here; it can denote those belonging to his household or close circle without resolving the referent.
  - severity: low
    issue: ‘उसका दिमाग़ ठिकाने पर नहीं है’ is overly colloquial in this narrative context.
    rationale: Although it communicates the accusation, ‘वह अपने आपे में नहीं है’ is more idiomatic at a dignified register and better preserves the personal idiom underlying ἐξέστη.
  revised_text: जब उसके अपने लोगों ने यह सुना[a], तो वे उसे पकड़ने के लिए निकल पड़े, क्योंकि वे कह रहे थे, “वह अपने आपे में नहीं है।”[b]
