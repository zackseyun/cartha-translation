    text: ‘घर’ के स्थान पर ‘घराना’ या ‘परिवार’ भी संभव है; लेकिन ‘खड़ा रहने’ का रूपक ‘घर’ के अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἰκία
  choice: घर
  rationale: οἰκία का प्राथमिक अर्थ ‘घर’ है। यहाँ ‘खड़ा रहना’ वास्तु-संबंधी रूपक को आगे बढ़ाता है, यद्यपि ‘घराना/परिवार’ का अर्थ भी संभव है।
- source_word: ἐφ’ ἑαυτὴν
  choice: अपने ही विरुद्ध
  rationale: इस प्रयोग में ἐπί और निजवाचक सर्वनाम आंतरिक विरोध का भाव देते हैं; ‘अपने ही विरुद्ध’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: μερισθῇ
  choice: बँट जाए
  rationale: ἐὰν के साथ प्रयुक्त एओरिस्ट कर्मवाच्य संभावनार्थक रूप सामान्य शर्त व्यक्त करता है। ‘बँट जाए’ आंतरिक विभाजन और कर्मवाच्य भाव को सहज हिन्दी में रखता है।
- source_word: δυνήσεται
  choice: रह सकेगा
  rationale: δύναμαι का भविष्यकाल सामर्थ्य को व्यक्त करता है; सहायक क्रिया ‘सकेगा’ इस भाव को सुरक्षित रखती है।
- source_word: σταθῆναι
  choice: खड़ा रह
  rationale: यहाँ अर्थ केवल खड़े होने का नहीं, बल्कि टिके या अक्षुण्ण बने रहने का है। ‘खड़ा रह’ मूल रूपक और उसके निहित स्थायित्व—दोनों को बनाए रखता है।
- source_word: ἡ οἰκία ἐκείνη
  choice: वह घर
  rationale: ἐκείνη का संकेतात्मक बल ‘वह’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: καὶ ἐὰν
  choice: और यदि
  rationale: ‘और’ पिछले कथन से तर्क-संबंध बनाए रखता है और ‘यदि’ शर्त को स्पष्ट करता है।
