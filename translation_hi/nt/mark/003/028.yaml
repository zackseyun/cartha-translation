  text: Ἀμὴν λέγω ὑμῖν ὅτι πάντα ἀφεθήσεται ⸂τοῖς υἱοῖς τῶν ἀνθρώπων, τὰ ἁμαρτήματα⸃ καὶ ⸂αἱ βλασφημίαι ὅσα ἐὰν⸃ βλασφημήσωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/028.yaml
  text: Truly I tell you that all sins will be forgiven to the sons of men[a], and whatever blasphemies they may utter;
translation:
  language: hi
  text: “मैं तुमसे सच कहता हूँ कि मनुष्यों के पुत्रों[a] को सभी पाप और वे जितनी भी निन्दाएँ करें, क्षमा किए जाएँगे;”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मानव मात्र या लोग। यूनानी अभिव्यक्ति “मनुष्यों के पुत्र” पूरी मानवजाति के लिए सामान्य रूप से प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु के गंभीर और अधिकारपूर्ण कथन-सूत्र का स्वाभाविक आधुनिक हिन्दी रूप है; ‘आमीन’ का लिप्यंतरण हिन्दी पाठक के लिए यहाँ उसके कथनात्मक अर्थ को उतनी स्पष्टता से व्यक्त नहीं करता।
- source_word: πάντα ... τὰ ἁμαρτήματα
  choice: सभी पाप
  rationale: πάντα अगले बहुवचन संज्ञा-पदों के व्यापक परिमाण को व्यक्त करता है। ‘सभी पाप’ हिन्दी में स्वाभाविक है और इसे ‘सब वस्तुओं’ जैसा अत्यधिक व्यापक अर्थ नहीं देता।
- source_word: ἀφεθήσεται
  choice: क्षमा किए जाएँगे / क्षमा की जाएँगी
  rationale: पाप और निन्दा के प्रसंग में ἀφίημι का भाव ‘क्षमा करना’ है। हिन्दी में संबंधित संज्ञाओं के लिंग के अनुसार निष्क्रिय क्रिया दोहराई गई है ताकि वाक्य स्पष्ट रहे।
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: मनुष्यों के पुत्रों
  rationale: यह स्रोत की सेमिटिक शैली और उसके पुरुषवाची रूप को बनाए रखता है। मूल अभिव्यक्ति मानवजाति के लिए सामान्यतः प्रयुक्त है, जिसे पाद-टिप्पणी स्पष्ट करती है।
- source_word: αἱ βλασφημίαι
  choice: निन्दाएँ
  rationale: βλασφημία में अपमानजनक या निन्दात्मक वचन का भाव है। ‘निन्दाएँ’ धार्मिक प्रसंग के लिए उपयुक्त है, जबकि केवल ‘बदनामियाँ’ कहना इसके धार्मिक और नैतिक बल को कमजोर कर देता।
- source_word: ὅσα ἐὰν βλασφημήσωσιν
  choice: वे जितनी भी निन्दाएँ करें
  rationale: ἐάν के साथ विधिलिंग इस कथन को अनिश्चित और व्यापक बनाता है। ‘जितनी भी’ उसकी खुली हुई सीमा को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पवित्र आत्मा की निन्दा के विषय में अगले पद की चेतावनी के संबंध में क्षमा के कथन का विस्तार
  choice: इस पद को अपने शब्दों में क्षमा की व्यापक घोषणा के रूप में रखा गया है।
  alternative: अगले पद के अपवाद को इसी पद के अनुवाद में पहले से जोड़ देना।
  rationale: यह पद पहले क्षमा की व्यापकता बताता है और अगला पद अपवाद प्रस्तुत करता है। अनुवाद उस साहित्यिक और धर्मवैचारिक तनाव को समय से पहले हल नहीं करता।
- issue: τοῖς υἱοῖς τῶν ἀνθρώπων का सामान्य पुरुषवाची प्रयोग
  choice: मुख्य पाठ में ‘मनुष्यों के पुत्रों’ रखा गया और समावेशी अर्थ पाद-टिप्पणी में स्पष्ट किया गया।
  alternative: ‘मनुष्यों’, ‘लोगों’ या ‘मानवजाति’ को सीधे मुख्य पाठ में रखना।
  rationale: मूल की पुरुषवाची सेमिटिक अभिव्यक्ति सुरक्षित रहती है, जबकि पाद-टिप्पणी यह स्पष्ट करती है कि आशय केवल पुरुषों से नहीं, मानव मात्र से है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। स्रोत की सेमिटिक अभिव्यक्ति को मुख्य पाठ में बनाए रखने के कारण पाद-टिप्पणी दी गई है। पद के अंत का अर्धविराम अगले पद से इसके निकट वाक्यगत संबंध को दर्शाता है।
