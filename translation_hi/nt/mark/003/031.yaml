base_translation:
  language: en
  yaml_path: translation/nt/mark/003/031.yaml
  text: Then his mother and his brothers came[a], and standing outside they sent word to him[b], calling him.
translation:
  language: hi
  text: तब उसकी माँ और उसके भाई आए, और बाहर खड़े होकर उन्होंने उसे बुलाने के लिए उसके पास संदेश भेजा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘भेजा’ का कर्म स्पष्ट नहीं है; इसका अर्थ संदेश या दूत भेजना हो सकता है।
    reason: यूनानी ἀπέστειλαν में भेजी गई वस्तु या व्यक्ति स्पष्ट रूप से नहीं बताया गया है।
lexical_decisions:
- source_word: Καὶ
  choice: तब
  rationale: वाक्य के आरम्भ का καί कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ इस कथात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔρχονται
  choice: आए
  rationale: यह यूनानी कथात्मक वर्तमान है; हिन्दी में साधारण भूतकाल अधिक स्वाभाविक है।
- source_word: ἡ μήτηρ αὐτοῦ
  choice: उसकी माँ
  rationale: यह सरल संबंधसूचक पद है; ‘माँ’ आधुनिक, स्वाभाविक और अर्थतः सटीक है।
- source_word: οἱ ἀδελφοὶ αὐτοῦ
  choice: उसके भाई
  rationale: ἀδελφοί यहाँ पुल्लिंग बहुवचन है। ‘भाई’ मूल शब्द का सीधा अनुवाद है और पारिवारिक संबंध की प्रकृति पर कोई अतिरिक्त सांप्रदायिक निष्कर्ष नहीं थोपता।
- source_word: ἔξω στήκοντες
  choice: वे बाहर खड़े रहे
  rationale: वर्तमान कृदन्त उनकी उस समय की स्थिति बताता है; अलग हिन्दी वाक्य में इसे व्यक्त करना स्पष्ट और स्वाभाविक है।
- source_word: ἀπέστειλαν πρὸς αὐτὸν
  choice: उसके पास संदेश भिजवाया
  rationale: प्रसंग में क्रिया किसी व्यक्ति अथवा संदेश को यीशु के पास भेजने का भाव रखती है। हिन्दी का यह मुहावरा निहित संप्रेषण को सहज रूप से व्यक्त करता है।
- source_word: καλοῦντες αὐτόν
  choice: उसे बुलाने के लिए
  rationale: कृदन्त भेजे गए संदेश या दूत का उद्देश्य बताता है—उसे अपने पास बुलाना।
theological_decisions:
- issue: ‘उसके भाई’ का सटीक पारिवारिक संबंध
  choice: मूल के अनुसार केवल ‘उसके भाई’ कहा गया है।
  alternative: इसे जैविक भाई या व्यापक अर्थ में निकट संबंधी मानना।
  rationale: पद में ἀδελφοί है, पर यह पद अकेले संबंध की विस्तृत प्रकृति तय नहीं करता; इसलिए अनुवाद को किसी सांप्रदायिक व्याख्या को जोड़ना नहीं चाहिए।
- issue: भेजे गए व्यक्ति अथवा संदेश का निहित होना
  choice: मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘संदेश भिजवाया’ और पादटिप्पणी में ‘किसी को भेजा’ दिया गया है।
  alternative: ‘उन्होंने उसके पास किसी को भेजा, जो उसे बुलाने लगा।’
  rationale: यूनानी में भेजी गई वस्तु या व्यक्ति स्पष्ट नहीं है और καλοῦντες उद्देश्य/सहगामी क्रिया दोनों की छाया रख सकता है; पादटिप्पणी इस वास्तविक अभिव्यक्तिगत भिन्नता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, कथात्मक और गरिमापूर्ण रखी गई है। ‘माँ’ सामान्य पाठक के लिए ‘माता’ से अधिक स्वाभाविक है, जबकि ‘भाई’ मूल के पारिवारिक पद को बिना अतिरिक्त व्याख्या के बनाए रखता है।
