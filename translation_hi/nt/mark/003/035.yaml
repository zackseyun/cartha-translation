source:
  edition: SBLGNT
  text: ὃς ⸀γὰρ ἂν ποιήσῃ τὸ θέλημα τοῦ θεοῦ, οὗτος ἀδελφός μου καὶ ⸀ἀδελφὴ καὶ μήτηρ ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/035.yaml
  text: For whoever does the will of God, this one is my brother and sister and mother.
translation:
  language: hi
  text: क्योंकि जो कोई परमेश्वर की इच्छा पूरी करता है, वही[a] मेरा भाई, मेरी बहन और मेरी माँ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यही व्यक्ति”; यूनानी में संकेतवाचक शब्द पर विशेष बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς ... ἂν ποιήσῃ
  choice: जो कोई ... पूरी करता है
  rationale: सापेक्ष सर्वनाम, ἄν और एओरिस्ट सब्जंक्टिव मिलकर एक सामान्य अनिश्चित शर्त व्यक्त करते हैं। हिन्दी में ‘जो कोई ... करता है’ इसका स्वाभाविक और कालातीत रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: परमेश्वर की इच्छा
  rationale: यह यूनानी संबंधवाचक पदबंध का सीधा और प्रचलित हिन्दी रूप है।
- source_word: οὗτος
  choice: वही
  rationale: संकेतवाचक οὗτος यहाँ बलयुक्त है। ‘वही’ उस बल को बनाए रखता है और किसी पुरुषवाचक सर्वनाम से अर्थ को अनावश्यक रूप से केवल पुरुष तक सीमित नहीं करता।
- source_word: ἀδελφός μου καὶ ἀδελφὴ καὶ μήτηρ
  choice: मेरा भाई, मेरी बहन और मेरी माँ
  rationale: तीनों ठोस पारिवारिक संबोधन अलग-अलग सुरक्षित रखे गए हैं। हिन्दी व्याकरण के अनुसार प्रत्येक संज्ञा के साथ उचित लिंग वाला संबंधसूचक रूप दिया गया है।
- source_word: ἐστίν
  choice: है
  rationale: एकवचन संकेतवाचक कर्ता के अनुरूप सरल एकवचन संयोजक क्रिया है।
theological_decisions:
- issue: मिश्रित लिंग वाले पारिवारिक पदों के साथ एकवचन कर्ता
  choice: वही
  alternative: वह
  rationale: यूनानी कर्ता व्याकरण की दृष्टि से पुल्लिंग एकवचन है, पर विधेय में भाई, बहन और माँ—पुरुष और स्त्री दोनों संबंध—आते हैं। ‘वही’ एकवचन और संकेतवाचक बल दोनों रखता है, बिना कथन को पुरुष-मात्र तक सीमित किए।
- issue: यीशु की पारिवारिक भाषा का स्वरूप
  choice: भाई, बहन और माँ जैसे ठोस संबंधवाचक शब्द बनाए रखना
  alternative: परिवार का सदस्य
  rationale: यीशु परमेश्वर की इच्छा पूरी करने के आधार पर परिवार की धारणा को नए ढंग से व्यक्त करते हैं। सामान्यीकृत पद के बजाय मूल के तीनों संबंधवाचक शब्द उसके अलंकारिक और धर्मवैचारिक बल को बनाए रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और सम्मानपूर्ण रखी गई है। ‘इच्छा पूरी करता है’ सामान्य हिन्दी में स्वाभाविक है, और ‘माँ’ वर्तमान बोलचाल तथा साहित्यिक प्रयोग दोनों में स्पष्ट और गरिमापूर्ण है।
