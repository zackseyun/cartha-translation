id: MRK.3.4
reference: Mark 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἔξεστιν τοῖς σάββασιν ⸀ἀγαθοποιῆσαι ἢ κακοποιῆσαι, ψυχὴν σῶσαι ἢ ἀποκτεῖναι; οἱ δὲ ἐσιώπων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/004.yaml
  text: And he said to them[a], “Is it lawful on the Sabbath to do good or to do harm[b], to save a life or to kill?” But they were silent.
translation:
  language: hi
  text: और उसने उनसे कहा, “क्या सब्त के दिन[a] भलाई करना उचित है या बुराई करना, किसी का जीवन बचाना या उसे मार डालना?” पर वे चुप रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “सब्तों में”; यह “सब्त के दिन” के अर्थ में प्रचलित मुहावरा है।
    reason: मूल यूनानी के बहुवचन रूप और उसके मुहावरेदार एकवचन अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: Ἔξεστιν
  choice: उचित है
  rationale: यहाँ प्रश्न सब्त के नियम के अंतर्गत स्वीकार्य आचरण का है। ‘उचित है’ आधुनिक हिन्दी में स्वाभाविक है और अनुमति तथा विधिसंगतता—दोनों का भाव देता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी बहुवचन रूप यहाँ प्रचलित मुहावरे के रूप में एक सब्त-दिन को सूचित करता है; हिन्दी में एकवचन अर्थ अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: ἀγαθοποιῆσαι
  choice: भलाई करना
  rationale: यह क्रिया अच्छे अथवा हितकारी काम करने को बताती है; ‘भलाई करना’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: κακοποιῆσαι
  choice: बुराई करना
  rationale: यह ‘भलाई करना’ के साथ स्पष्ट नैतिक समानांतर बनाए रखता है। ‘हानि पहुँचाना’ भी संभव है, पर मूल क्रिया का व्यापक बुराई करने का भाव यहाँ सुरक्षित रखा गया है।
- source_word: ψυχὴν σῶσαι
  choice: किसी का जीवन बचाना
  rationale: हत्या के साथ विरोध में ψυχή यहाँ अमूर्त आत्मा नहीं, किसी व्यक्ति के जीवन को दर्शाता है। हिन्दी में ‘किसी का जीवन’ अपेक्षित आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἀποκτεῖναι
  choice: उसे मार डालना
  rationale: यह मूल क्रिया के सामान्य अर्थ ‘मारना/जान से मारना’ को व्यक्त करता है और ‘हत्या करना’ जैसी अतिरिक्त वैधानिक धारणा नहीं जोड़ता।
- source_word: ἐσιώπων
  choice: वे चुप रहे
  rationale: अपूर्ण भूतकाल उनकी जारी प्रतिक्रिया—उत्तर न देकर चुप बने रहने—को दर्शाता है; ‘चुप रहे’ हिन्दी कथन में स्वाभाविक है।
theological_decisions:
- issue: सब्त के यूनानी बहुवचन मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘सब्त के दिन’
  alternative: ‘सब्तों में’ अथवा ‘सब्त के दिनों में’
  rationale: बहुवचन रूप को यांत्रिक रूप से रखने पर हिन्दी में अनेक सब्तों का भ्रामक अर्थ निकल सकता है। एकवचन संदर्भगत अर्थ देता है, जबकि स्रोत-रूप की जानकारी पादटिप्पणी में सुरक्षित है।
- issue: ἀγαθοποιῆσαι और κακοποιῆσαι का नैतिक विरोध
  choice: ‘भलाई करना’ और ‘बुराई करना’
  alternative: ‘भला करना’ और ‘हानि पहुँचाना’
  rationale: मुख्य अनुवाद मूल क्रियाओं के व्यापक नैतिक तनाव को बनाए रखता है और उसे केवल शारीरिक लाभ या हानि तक सीमित नहीं करता, यद्यपि निकट संदर्भ चंगाई का है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी अपनाई गई है। ‘सब्त’ बाइबिल-संदर्भ का परिचित पद है। प्रश्न की समांतर रचना और उत्तर में विरोधियों की लगातार चुप्पी को संक्षिप्त रूप में बनाए रखा गया है।
