id: MRK.3.5
reference: Mark 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ περιβλεψάμενος αὐτοὺς μετ’ ὀργῆς, συλλυπούμενος ἐπὶ τῇ πωρώσει τῆς καρδίας αὐτῶν, λέγει τῷ ἀνθρώπῳ· Ἔκτεινον τὴν ⸀χεῖρα· καὶ ἐξέτεινεν, καὶ ἀπεκατεστάθη ἡ χεὶρ ⸀αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/005.yaml
  text: And after looking around at them with anger[a], grieved at the hardness of their hearts, he says to the man, “Stretch out your hand.” And he stretched it out, and his hand was restored.
translation:
  language: hi
  text: और उसने क्रोध से उन पर चारों ओर दृष्टि डाली, और उनके हृदय[a] की कठोरता पर दुःखी होकर उस मनुष्य से कहा, “अपना हाथ आगे बढ़ाओ।” उसने अपना हाथ आगे बढ़ाया, और उसका हाथ बहाल हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके हृदयों की कठोरता।” यूनानी में “हृदय” एकवचन है, संभवतः सामूहिक अर्थ में।
    reason: मूल के सामूहिक एकवचन और स्वाभाविक व्यक्तिगत बहुवचन, दोनों संभावनाओं को स्पष्ट करना।
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: चारों ओर दृष्टि डाली
  rationale: क्रिया पूरे समूह पर घूमती हुई दृष्टि का भाव देती है; यह हिंदी में स्वाभाविक रहते हुए यूनानी कृदंत की मुख्य क्रिया से पूर्वता को वाक्यक्रम द्वारा व्यक्त करता है।
- source_word: μετ’ ὀργῆς
  choice: क्रोध से
  rationale: μετά के साथ षष्ठी यहाँ साथ रहने वाली मनोदशा या ढंग बताती है। ‘क्रोध से’ सीधा और वर्तमान हिंदी में स्वाभाविक है।
- source_word: συλλυπούμενος
  choice: दुःखी होकर
  rationale: यह उनके हृदय की कठोरता के कारण पीड़ा और शोक को व्यक्त करता है। ‘दुःखी होकर’ भाव को बिना अनावश्यक तीव्रता जोड़े स्पष्ट करता है।
- source_word: ἐπὶ τῇ πωρώσει
  choice: कठोरता पर
  rationale: ἐπί के साथ चतुर्थी यहाँ दुःख के आधार या कारण को दर्शाती है। ‘कठोरता’ πώρωσις के रूपक को बनाए रखती है।
- source_word: τῆς καρδίας αὐτῶν
  choice: उनके हृदय की
  rationale: यूनानी में ‘हृदय’ एकवचन और संबंधवाचक सर्वनाम बहुवचन है। हिंदी में ‘उनके हृदय’ सामूहिक एकवचन को स्वाभाविक रूप से सुरक्षित रखता है; व्यक्तिगत बहुवचन ‘उनके हृदयों’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान मरकुस की सजीव कथा-शैली का अंग है, पर इस हिंदी वाक्य में पूर्ववर्ती पूर्ण क्रियाओं के साथ ‘कहा’ अधिक सहज और स्पष्ट कथात्मक प्रवाह देता है।
- source_word: τῷ ἀνθρώπῳ
  choice: उस मनुष्य से
  rationale: यह प्रसंग के विशिष्ट पुरुष को सूचित करता है; ‘उस मनुष्य’ सटीक और गरिमापूर्ण है।
- source_word: Ἔκτεινον τὴν χεῖρα
  choice: अपना हाथ आगे बढ़ाओ
  rationale: यह निर्णायक आज्ञा को स्वाभाविक हिंदी में व्यक्त करता है और अगली क्रिया में होने वाली पुनरावृत्ति बनाए रखता है।
- source_word: ἐξέτεινεν
  choice: उसने उसे आगे बढ़ाया
  rationale: सर्वनाम पूर्वोक्त हाथ को स्पष्ट रूप से संदर्भित करता है और मूल की क्रियात्मक पुनरावृत्ति सुरक्षित रखता है।
- source_word: ἀπεκατεστάθη
  choice: फिर ठीक हो गया
  rationale: क्रिया हाथ के पूर्व उचित दशा में लौट आने को व्यक्त करती है। ‘फिर ठीक हो गया’ हिंदी में स्वाभाविक है और मात्र सामान्य ‘चंगा हुआ’ की अपेक्षा पुनर्स्थापन का भाव स्पष्ट करता है।
theological_decisions:
- issue: यीशु का क्रोध और दुःख
  choice: दोनों भावों को सीधे ‘क्रोध’ और ‘दुःखी’ के रूप में रखा गया है।
  alternative: क्रोध को नरम करके ‘रोष’ या ‘अप्रसन्नता’ कहना, अथवा दुःख को अधिक तीव्र करके ‘बहुत व्यथित’ कहना।
  rationale: मूल पाठ दोनों भावों को साथ रखता है। अनुवाद को इस नैतिक और धर्मवैज्ञानिक तनाव को न तो नरम करना चाहिए, न बढ़ाना चाहिए।
- issue: ‘हृदय’ का सामूहिक एकवचन
  choice: ‘उनके हृदय की कठोरता’
  alternative: ‘उनके हृदयों की कठोरता’
  rationale: मूल में καρδία एकवचन है, यद्यपि αὐτῶν बहुवचन है। सामूहिक एकवचन मूल रूप को सुरक्षित रखता है, जबकि बहुवचन अर्थ की वैध व्याख्या है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘दृष्टि डाली’ तथा ‘मनुष्य’ औपचारिकता का हल्का स्तर रखते हैं, पर सामान्य पाठक के लिए स्पष्ट हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
