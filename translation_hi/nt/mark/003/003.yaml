  text: And he says to the man with the withered hand[a], “Rise and come to the middle.”
translation:
  language: hi
  text: और वह उस आदमी से, जिसका हाथ सूख गया था, कहता है, “उठो और बीच में आओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखकर मरकुस की जीवंत कथन-शैली सुरक्षित रखी गई है।
- source_word: ἀνθρώπῳ
  choice: आदमी
  rationale: संदर्भ में एक पुरुष व्यक्ति अभिप्रेत है; ‘आदमी’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: τὴν χεῖρα ἔχοντι ξηράν
  choice: सूखे हाथ वाले
  rationale: यह सहभागी पदबंध हिन्दी में सहज विशेषणात्मक रूप लेता है और व्यक्ति की शारीरिक दशा को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: ξηράν
  choice: सूखे
  rationale: यह ξηρός के मूल अर्थ ‘सूखा’ को सीधे सुरक्षित रखता है; यहाँ संदर्भ से हाथ की निष्क्रिय या सिकुड़ी दशा स्पष्ट होती है।
- source_word: Ἔγειρε
  choice: उठो
  rationale: आज्ञार्थक क्रिया की संक्षिप्तता और सीधापन बना रहता है; इसका अर्थ उठ खड़े होना है।
- source_word: εἰς τὸ μέσον
  choice: बीच में आओ
  rationale: εἰς की गमन-दिशा और τὸ μέσον के ‘बीच’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘बीच में खड़े हो जाओ’ कहने से गति का भाव कुछ कम हो सकता था।
