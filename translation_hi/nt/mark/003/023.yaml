source:
  edition: SBLGNT
  text: καὶ προσκαλεσάμενος αὐτοὺς ἐν παραβολαῖς ἔλεγεν αὐτοῖς· Πῶς δύναται Σατανᾶς Σατανᾶν ἐκβάλλειν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/023.yaml
  text: 'And after calling them to himself, he was speaking to them in parables: “How can Satan cast out Satan?”'
translation:
  language: hi
  text: और उन्हें अपने पास बुलाकर, यीशु दृष्टान्तों में उनसे कहने लगा, “शैतान शैतान को कैसे बाहर निकाल सकता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: एओरिस्ट मध्यवाच्य कृदन्त यीशु द्वारा उन्हें अपने पास बुलाने और फिर बोलने का क्रम दिखाता है; हिन्दी में ‘अपने पास बुलाकर’ इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: बहुवचन παραβολαῖς को बनाए रखते हुए यीशु की उदाहरणात्मक तुलनाओं या कथनों का परिचित और गरिमापूर्ण हिन्दी रूप दिया गया है।
- source_word: ἔλεγεν
  choice: कहा
  rationale: ग्रीक अपूर्ण काल बोलने की जारी क्रिया दिखा सकता है, पर इस छोटे कथात्मक परिचय में हिन्दी का ‘कहा’ अधिक स्वाभाविक है; इसके बाद प्रत्यक्ष वचन उस भाषण को सामने रखता है।
- source_word: Πῶς δύναται
  choice: कैसे ... सकता है
  rationale: यह संभावना अथवा सामर्थ्य पर प्रश्न उठाने वाला अलंकारिक प्रश्न है; ‘कैसे ... सकता है’ हिन्दी में उसका बल सहज रूप से बनाए रखता है।
- source_word: Σατανᾶς
  choice: शैतान
  rationale: नाम/उपाधि का हिन्दी में प्रचलित लिप्यन्तरण चुना गया है; कर्ता और कर्म दोनों के लिए वही रूप रखा गया है।
- source_word: ἐκβάλλειν
  choice: निकाल सकता है
  rationale: मरकुस के प्रसंग में यह दुष्टात्माओं को बाहर निकालने का मानक क्रियापद है। ‘निकालना’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग से अर्थ स्वतः समझ आता है।
theological_decisions:
- issue: शैतान के अपने ही विरुद्ध कार्य करने संबंधी यीशु के प्रश्न का बल
  choice: “शैतान शैतान को कैसे निकाल सकता है?” के रूप में असम्भवता उजागर करने वाला अलंकारिक प्रश्न
  alternative: “शैतान शैतान को निकालने में कैसे समर्थ है?”
  rationale: ग्रीक प्रश्न सामर्थ्य/सम्भावना को चुनौती देता है। अनुवाद आरोप की असंगति को उभरने देता है, पर मुख्य पाठ में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल। स्पष्टता के लिए कर्ता ‘यीशु’ जोड़ा गया है, जो निकटवर्ती प्रसंग में निहित है। कोई पादटिप्पणी आवश्यक नहीं।
