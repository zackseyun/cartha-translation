review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus’ summoning of the group, his use of parables, and the rhetorical question about Satan casting out Satan. However, “तब” introduces a sequential nuance not expressed by καί, and “कहा” does not reflect the imperfect ἔλεγεν as well as an ongoing/introduction-to-speech form can.
  naturalness: The Hindi is clear and suitable for modern standard usage. “दृष्टान्तों में उनसे कहने लगा” is natural in biblical narrative and better represents the discourse-introducing imperfect than the simple perfective “कहा.”
  terminology: “यीशु,” “दृष्टान्त,” and “शैतान” are appropriate established Hindi biblical terms. “बाहर निकाल सकता है” more explicitly reflects ἐκβάλλειν while retaining the contextual exorcism sense without adding interpretation.
  issues:
  - severity: low
    issue: “तब” is not represented in the Greek text.
    rationale: The source begins with καί (“and”), followed by an aorist participle that supplies the prior action. “तब” can imply a stronger temporal transition than the source states.
  - severity: low
    issue: “कहा” underrepresents the imperfect ἔλεγεν.
    rationale: While simple “said” can be idiomatic, “कहने लगा” better retains the imperfect’s ongoing/discourse-introducing force in this context.
  - severity: low
    issue: “निकाल सकता है” is somewhat less explicit than ἐκβάλλειν.
    rationale: Adding “बाहर” reflects the directional force of “cast out” and is idiomatic Hindi in the immediate exorcism context.
  revised_text: और उन्हें अपने पास बुलाकर, यीशु दृष्टान्तों में उनसे कहने लगा, “शैतान शैतान को कैसे बाहर निकाल सकता है?”
  revised_footnotes: []
