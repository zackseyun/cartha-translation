revisions:
- from: तब यीशु ने उन्हें अपने पास बुलाकर दृष्टान्तों में उनसे कहा, “शैतान शैतान को कैसे निकाल सकता है?”
  to: और उन्हें अपने पास बुलाकर, यीशु दृष्टान्तों में उनसे कहने लगा, “शैतान शैतान को कैसे बाहर निकाल सकता है?”
  rationale: The revision replaces the non-source-based transition “तब” with “और,” represents ἔλεγεν with a natural imperfect-compatible speech introduction, and renders ἐκβάλλειν more fully as “बाहर निकाल.” It preserves the rhetorical question and does not add theological explanation.
  reviewer_model: gpt-5.6-terra
