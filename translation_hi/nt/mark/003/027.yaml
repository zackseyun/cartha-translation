  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἀλλ’ οὐδεὶς δύναται⸃ ⸂εἰς τὴν οἰκίαν τοῦ ἰσχυροῦ εἰσελθὼν τὰ σκεύη⸃ αὐτοῦ διαρπάσαι ἐὰν μὴ πρῶτον τὸν ἰσχυρὸν δήσῃ, καὶ τότε τὴν οἰκίαν αὐτοῦ ⸀διαρπάσει.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/027.yaml
  text: But no one can enter the house of the strong man and plunder his goods unless he first ties up the strong man[b][a]; then indeed he will plunder his house.
translation:
  language: hi
  text: परन्तु कोई भी उस बलवान[b] के घर में प्रवेश करके उसकी वस्तुएँ[a] नहीं लूट सकता, जब तक कि वह पहले उस बलवान को बाँध न दे; तब वह उसका घर लूट लेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी सम्पत्ति”; अधिक शाब्दिक रूप से “उसके पात्र/सामान।”
    reason: lexical_alternative
  - marker: b
    text: “बलवान” यीशु के उस रूपक का भाग है जिसमें शैतान को परास्त करने की बात है; मुख्य पाठ रूपक को स्पष्ट व्याख्या से नहीं बदलता।
    reason: cross_reference
lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: यह पिछले आरोप और यीशु के प्रत्युत्तर के बीच विरोध प्रकट करता है; ‘परन्तु’ गरिमापूर्ण और स्वाभाविक है।
- source_word: οὐδεὶς δύναται
  choice: कोई भी ... नहीं ... सकता
  rationale: यूनानी में व्यक्त असमर्थता को स्वाभाविक हिन्दी निषेधात्मक रचना में सुरक्षित रखता है।
- source_word: εἰς τὴν οἰκίαν ... εἰσελθὼν
  choice: घर में घुसकर
  rationale: सन्दर्भ अनधिकृत प्रवेश और लूट का है; ‘घुसकर’ प्रवेश की उस छाया को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦ ἰσχυροῦ / τὸν ἰσχυρόν
  choice: उस बलवान
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘बलवान’ रूपक को बनाए रखता और दोनों occurrences में पुनरावृत्ति सुरक्षित करता है।
- source_word: τὰ σκεύη αὐτοῦ
  choice: उसकी वस्तुएँ
  rationale: σκεύη का मूल अर्थ पात्र, उपकरण या चीज़ें हो सकता है; घरेलू लूट के सन्दर्भ में ‘वस्तुएँ’ अर्थ-विस्तार और अस्पष्टता दोनों को पर्याप्त रूप से बनाए रखता है।
- source_word: διαρπάσαι / διαρπάσει
  choice: लूट सकता / लूट लेगा
  rationale: क्रिया बलपूर्वक छीन लेने या लूटने का बोध देती है; ‘लूटना’ हिन्दी में स्पष्ट और चित्रात्मक है।
- source_word: ἐὰν μὴ πρῶτον
  choice: जब तक कि ... पहले ... न
  rationale: यह आवश्यक पूर्वशर्त और कार्यों के समय-क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δήσῃ
  choice: बाँध न दे
  rationale: δέω का सीधा अर्थ बाँधना है; यह घर में सेंध और लूट के रूपक की ठोस छवि बनाए रखता है।
- source_word: καὶ τότε
  choice: तब
  rationale: बलवान को पहले बाँधने के बाद होने वाले परिणाम का स्पष्ट क्रम प्रकट करता है।
- source_word: τὴν οἰκίαν αὐτοῦ διαρπάσει
  choice: वह उसका घर लूट लेगा
  rationale: भविष्यकाल और ‘घर’ की दोहराई गई छवि को सुरक्षित रखता है; यहाँ घर से पूरे गृह-क्षेत्र या सम्पत्ति का संकेत भी हो सकता है।
theological_decisions:
- issue: यीशु के तर्क में ‘बलवान’ रूपक का आशय
  choice: मुख्य पाठ में ‘बलवान’ की रूपकात्मक छवि को ज्यों का त्यों रखा गया है।
  alternative: मुख्य पाठ में बलवान को सीधे शैतान कहना।
  rationale: सन्दर्भ में रूपक शैतान पर अधिकार पाने की ओर संकेत करता है, किन्तु यूनानी पाठ स्वयं व्यक्ति की पहचान को व्याख्यात्मक रूप से नहीं जोड़ता। इसलिए अर्थ को पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। ‘घुसकर’, ‘बाँध’ और ‘लूट’ से मूल दृष्टान्त की ठोस तथा तीखी छवि बनी रहती है; ‘बलवान’ को व्याख्यात्मक रूप से ‘शैतान’ नहीं बनाया गया।
