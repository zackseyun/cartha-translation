  text: πολλοὺς γὰρ ἐθεράπευσεν, ὥστε ἐπιπίπτειν αὐτῷ ἵνα αὐτοῦ ἅψωνται ὅσοι εἶχον μάστιγας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/010.yaml
  text: For he had healed many, so that all who had afflictions were pressing in on him in order to touch him.
translation:
  language: hi
  text: क्योंकि उसने बहुतों को चंगा किया था, इसलिए जितने लोग पीड़ाओं[b] से ग्रस्त थे, वे उसे छूने के लिए उस पर उमड़ पड़ते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर टूटे पड़ते थे”—यूनानी अभिव्यक्ति अधिक शाब्दिक रूप से बलपूर्ण है और लोगों के उसकी ओर उमड़ने का चित्र प्रस्तुत करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “रोगों से ग्रस्त थे” अथवा “व्याधियाँ थीं”; यूनानी शब्द गंभीर कष्टों के लिए प्रयुक्त हो सकता है और उसका शाब्दिक अर्थ “कोड़े” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὺς γὰρ ἐθεράπευσεν
  choice: क्योंकि उसने बहुतों को चंगा किया था
  rationale: γάρ पिछले वर्णन का कारण बताता है। अओरिस्ट ἐθεράπευσεν यहाँ भीड़ के वर्तमान व्यवहार की व्याख्या करने वाली पूर्व चंगाई को दर्शाता है; इसलिए हिंदी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: ὥστε ἐπιπίπτειν αὐτῷ
  choice: इसलिए ... वे उस पर उमड़े पड़ते थे
  rationale: ὥστε परिणाम प्रकट करता है और ἐπιπίπτω भीड़ के बलपूर्वक यीशु की ओर बढ़ने का जीवंत चित्र देता है। 'उमड़े पड़ते थे' इस तीव्रता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἵνα αὐτοῦ ἅψωνται
  choice: उसे छूने के लिए
  rationale: ἵνα उद्देश्य और ἅπτομαι शारीरिक स्पर्श को व्यक्त करता है; संक्षिप्त हिंदी पदबंध दोनों अर्थ स्पष्ट करता है।
- source_word: ὅσοι εἶχον μάστιγας
  choice: जितने लोग पीड़ाओं से ग्रस्त थे
  rationale: ὅσοι की व्यापकता 'जितने लोग' से आती है। μάστιξ का शाब्दिक अर्थ कोड़ा है, पर यहाँ रूपकतः गंभीर रोग या कष्ट है; 'पीड़ाओं' इसकी व्यापकता और तीव्रता को बिना केवल चिकित्सकीय रोग तक सीमित किए रखता है।
theological_decisions:
- issue: μάστιγας से अभिप्रेत कष्टों का स्वरूप
  choice: '''पीड़ाओं''—गंभीर शारीरिक कष्टों का व्यापक वर्णन'
  alternative: '''रोगों'', ''व्याधियों'' या शाब्दिक ''कोड़ों'''
  rationale: चंगाई का प्रसंग शारीरिक बीमारी की ओर संकेत करता है, फिर भी यूनानी शब्द केवल नैदानिक रोग से अधिक व्यापक और तीखा है। 'पीड़ाओं' मूल की रूपकात्मक शक्ति और अर्थगत विस्तार को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। 'चंगा किया' बाइबलीय संदर्भ में परिचित है; 'उमड़े पड़ते थे' भीड़ की तीव्र शारीरिक गति को स्वाभाविक रूप से व्यक्त करता है।
