  naturalness: “उमड़ पड़ते थे” is idiomatic modern Hindi. Moving each footnote marker immediately after the word or expression it annotates also makes the lexical notes clear and usable.
  terminology: “चंगा किया था” is appropriate in biblical Hindi, and “पीड़ाओं से ग्रस्त” preserves the broad, vivid sense of μάστιγες without reducing it to a narrowly medical diagnosis. No doctrinal interpretation is added.
