  text: καὶ ἐξελθόντες οἱ Φαρισαῖοι ⸀εὐθὺς μετὰ τῶν Ἡρῳδιανῶν συμβούλιον ⸀ἐδίδουν κατ’ αὐτοῦ ὅπως αὐτὸν ἀπολέσωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/006.yaml
  text: And the Pharisees went out and immediately began plotting with the Herodians against him[a], how they might destroy him.
translation:
  language: hi
  text: तब फ़रीसी बाहर निकले और तुरंत हेरोदियों के साथ मिलकर यीशु के विरुद्ध षड्यंत्र रचने लगे कि उन्हें कैसे नष्ट कर दें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इस प्रसंग में अधिक स्पष्ट रूप से, “उन्हें मार डालें” या “उन्हें मृत्यु के घाट उतारें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξελθόντες
  choice: बाहर निकले
  rationale: क्रियाविशेषणात्मक एओरिस्ट कृदन्त को हिन्दी कथा-शैली में स्वाभाविक समापिका क्रिया के रूप में व्यक्त किया गया है; इससे आराधनालय से बाहर जाने की गति बनी रहती है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: मरकुस की कथा में बार-बार आने वाली तात्कालिकता और गति को आधुनिक मानक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: μετὰ τῶν Ἡρῳδιανῶν
  choice: हेरोदियों के साथ मिलकर
  rationale: μετά सम्बन्ध और सहभागिता बताता है। 'साथ मिलकर' संयुक्त परामर्श को स्वाभाविक हिन्दी में स्पष्ट करता है; 'हेरोदी' हेरोदेस के समर्थक दल का प्रचलित नाम है।
- source_word: συμβούλιον ἐδίδουν
  choice: षड्यंत्र रचने लगे
  rationale: यह यूनानी मुहावरा परामर्श या योजना बनाने को दर्शाता है। विरोधी उद्देश्य के कारण 'षड्यंत्र' प्रसंगानुकूल है, और 'लगे' अपूर्णकाल के आरम्भिक/प्रगतिशील पक्ष को व्यक्त करता है।
- source_word: κατ’ αὐτοῦ
  choice: यीशु के विरुद्ध
  rationale: κατά यहाँ विरोधी अर्थ रखता है। अस्पष्ट हिन्दी सर्वनाम से बचने के लिए प्रसंगगत व्यक्ति 'यीशु' का नाम दोहराया गया है।
- source_word: ὅπως
  choice: कि ... कैसे
  rationale: अगले संभावनार्थक क्रियारूप के साथ यह उद्देश्य और उपाय—दोनों की छाया रखता है। हिन्दी में 'यह षड्यंत्र ... कि उन्हें कैसे' इस विचार-विमर्शात्मक भाव को सहजता से व्यक्त करता है।
- source_word: ἀπολέσωσιν
  choice: नष्ट करें
  rationale: ἀπόλλυμι के व्यापक अर्थ—नष्ट करना, मिटा देना, मार डालना—को मुख्य पाठ में संकुचित किए बिना रखा गया है; इस प्रसंग में प्राण लेने का आशय पादटिप्पणी में स्पष्ट है।
theological_decisions:
- issue: क्या अगुवों की मंशा को मुख्य पाठ में सीधे हत्या के रूप में व्यक्त किया जाए
  choice: मुख्य पाठ में व्यापक अभिव्यक्ति 'नष्ट करें' रखी गई है।
  alternative: '''मार डालें'' अथवा ''मृत्यु के घाट उतारें'''
  rationale: यूनानी ἀπόλλυμι केवल हत्या तक सीमित नहीं है, यद्यपि इस प्रसंग में आशय स्पष्टतः यीशु का प्राण लेना है। व्यापक शब्दावली मूल की अर्थ-सीमा और तनाव बचाती है, जबकि पादटिप्पणी प्रसंगगत स्पष्ट अर्थ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप। 'फ़रीसी' और 'हेरोदी' जैसे परिचित बाइबलीय समूह-नाम रखे गए हैं। सम्मानसूचक प्रयोग के कारण यीशु के लिए 'उन्हें' प्रयुक्त है।
