base_translation:
  language: en
  yaml_path: translation/nt/mark/003/032.yaml
  text: And a crowd was sitting around him[a], and they said to him, “Look, your mother and your brothers are outside looking for you.”
translation:
  language: hi
  text: और एक भीड़ उसके चारों ओर बैठी थी। भीड़ ने उससे कहा, “देखो, तुम्हारी माँ और तुम्हारे भाई बाहर तुम्हें ढूँढ़ रहे हैं[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें खोज रहे हैं।” यूनानी क्रिया का अर्थ “खोजना” या “ढूँढ़ना” हो सकता है; यहाँ इसका अर्थ संभवतः उन्हें शारीरिक रूप से ढूँढ़ना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκάθητο
  choice: बैठी हुई थी
  rationale: अपूर्ण भूतकाल चल रही पृष्ठभूमि की स्थिति दिखाता है; यह प्रयोग उस दृश्य की निरंतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: περὶ αὐτὸν ὄχλος
  choice: एक भीड़ उसके चारों ओर
  rationale: περί के साथ कर्मकारक यहाँ चारों ओर स्थित होने का स्थानिक भाव देता है।
- source_word: λέγουσιν
  choice: लोगों ने उससे कहा
  rationale: यूनानी का वर्तमानकाल यहाँ ऐतिहासिक वर्तमान है; हिन्दी कथा-प्रवाह में भूतकाल स्वाभाविक है। कर्ता बहुवचन निहित है, इसलिए ‘लोगों ने’ स्पष्ट और सहज है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला कथन-सूचक शब्द है; ‘देखो’ आधुनिक हिन्दी में इसके संकेतात्मक बल को बनाए रखता है।
- source_word: μήτηρ
  choice: माता
  rationale: यह सामान्य निकट पारिवारिक संबंध का सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἀδελφοί
  choice: भाई
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है; बिना किसी धर्मवैचारिक विस्तार के इसका सीधा अर्थ रखा गया है।
- source_word: ἔξω
  choice: बाहर
  rationale: स्थान बताने वाले इस क्रियाविशेषण का प्रसंगानुकूल सीधा अर्थ है।
- source_word: ζητοῦσίν σε
  choice: तुम्हें ढूँढ़ रहे हैं
  rationale: ζητέω का अर्थ खोजना या ढूँढ़ना हो सकता है; इस दृश्य में किसी व्यक्ति तक पहुँचने का प्रयत्न अभिप्रेत है। वर्तमानकाल की जारी क्रिया को ‘रहे हैं’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘भाइयों’ का संबंध
  choice: ἀδελφοί का अनुवाद बिना व्याख्यात्मक विस्तार के ‘भाई’ किया गया है।
  alternative: भाई/निकट संबंधी; भाई-बहन
  rationale: पद सामान्य पारिवारिक शब्द का प्रयोग करता है, पर यीशु के साथ उस संबंध की धर्मवैचारिक व्याख्या नहीं करता। सीधा शब्द अनुवाद सांप्रदायिक निष्कर्ष जोड़े बिना मूल की खुली स्थिति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष संबोधन में ‘तुम्हारी/तुम्हें’ मूल के एकवचन संबोधन को स्पष्ट रखता है।
