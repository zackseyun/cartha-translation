  edition: SBLGNT
  text: ὃς δ’ ἂν βλασφημήσῃ εἰς τὸ πνεῦμα τὸ ἅγιον, οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα, ἀλλὰ ἔνοχός ἐστιν αἰωνίου ⸀ἁμαρτήματος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/003/029.yaml
  text: but whoever blasphemes against the Holy Spirit never has forgiveness[c][b][a], but is guilty of an eternal sin.
translation:
  language: hi
  text: पर जो कोई पवित्र आत्मा के विरुद्ध निंदा करता है, उसे कभी क्षमा नहीं मिलती[a], बल्कि वह अनन्त पाप का दोषी है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “युग तक उसके पास क्षमा नहीं है”; अर्थात्, “उसे कभी क्षमा नहीं मिलती” या “उसे सदा के लिए क्षमा नहीं मिलती।”
    reason: lexical_alternative
  - marker: b
    text: या, “वह अनन्त पाप के लिए उत्तरदायी है।”
    reason: lexical_alternative
  - marker: c
    text: कुछ हस्तलिखित प्रतियों में “अनन्त पाप” के स्थान पर “अनन्त न्याय” या “अनन्त दण्ड” है।
    reason: textual_variant
lexical_decisions:
- source_word: ὃς δ’ ἂν
  choice: पर जो कोई
  rationale: ὃς के साथ ἄν अनिश्चित सम्बन्धवाचक अर्थ देता है, जिसे हिन्दी में स्वाभाविक रूप से ‘जो कोई’ कहा जाता है; δέ पिछले कथन से विरोध दर्शाता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: βλασφημήσῃ
  choice: निन्दा करता है
  rationale: यहाँ एओरिस्ट सब्जंक्टिव सामान्य शर्त व्यक्त करता है। हिन्दी का वर्तमानकालीन रूप उस सामान्य अर्थ को सहजता से देता है, और ‘निन्दा’ धार्मिक अपराध की गंभीरता बनाए रखता है।
- source_word: εἰς τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा के विरुद्ध
  rationale: βλασφημέω के साथ εἰς अपराध के लक्ष्य को सूचित करता है; हिन्दी में ‘के विरुद्ध’ स्पष्ट और स्वाभाविक है।
- source_word: οὐκ ἔχει ἄφεσιν εἰς τὸν αἰῶνα
  choice: उसे कभी क्षमा नहीं मिलती
  rationale: ἄφεσις का अर्थ ‘क्षमा’ है और नकारात्मक वाक्य में εἰς τὸν αἰῶνα का मुहावरेदार अर्थ ‘कभी नहीं’ या ‘सदा के लिए नहीं’ है। ‘क्षमा नहीं मिलती’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: ἀλλά पहले निषेध के बाद प्रबल विरोध या आगे का प्रतिपादन करता है; इस वाक्य-विन्यास में ‘बल्कि’ स्वाभाविक है।
- source_word: ἔνοχός ἐστιν
  choice: दोषी है
  rationale: ἔνοχος दोषी होने या दायित्व के अधीन होने, दोनों का भाव दे सकता है। ‘दोषी है’ मुख्य पाठ में स्पष्ट है, जबकि वैकल्पिक ‘उत्तरदायी है’ पादटिप्पणी में सुरक्षित है।
- source_word: αἰωνίου ἁμαρτήματος
  choice: अनन्त पाप का
  rationale: दिए गए SBLGNT पाठ में ἁμαρτήματος ‘पाप’ है और αἰωνίου उसका विशेषण है। इसलिए ‘अनन्त पाप’ मूल पाठ का सीधा और धर्मवैचारिक तनाव बनाए रखने वाला अनुवाद है।
theological_decisions:
- issue: अक्षम्य अपराध का स्वरूप
  choice: पद के सीधे कथन ‘पवित्र आत्मा के विरुद्ध निन्दा’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे आत्मा की गवाही का जान-बूझकर और लगातार तिरस्कार करने अथवा आत्मा के कार्य को दुष्टात्मिक ठहराने के रूप में मुख्य पाठ में स्पष्ट करना।
  rationale: निकटवर्ती प्रसंग अर्थ समझने में सहायक है, पर यह पद स्वयं अपराध को ‘पवित्र आत्मा के विरुद्ध निन्दा’ कहता है। अनुवाद में अतिरिक्त धर्मसैद्धान्तिक परिभाषा जोड़ने से बचना उचित है।
- issue: पद के अन्त में पाठान्तर
  choice: SBLGNT के αἰωνίου ἁμαρτήματος के अनुसार ‘अनन्त पाप’ रखा गया है।
  alternative: ‘अनन्त न्याय’ या ‘अनन्त दण्डाज्ञा’।
  rationale: प्रदान किए गए यूनानी मूलपाठ में ‘पाप’ है। अन्य हस्तलिखित प्रतियों का प्रसिद्ध पाठान्तर पारदर्शिता के लिए पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘पवित्र आत्मा’, ‘क्षमा’ और ‘अनन्त पाप’ जैसे परिचित धार्मिक पद मूल यूनानी की गंभीरता बनाए रखते हैं; किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ी गई है।
