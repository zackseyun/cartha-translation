lexical_decisions:
- source_word: Ἀκούετε
  choice: सुनो!
  rationale: वर्तमान काल का बहुवचन आज्ञार्थक रूप श्रोताओं का ध्यान खींचता है। ‘सुनो!’ आधुनिक हिन्दी में स्वाभाविक है और आदेश का बल बनाए रखता है।
- source_word: ἰδού
  choice: देखो,
  rationale: यह आगे कही जाने वाली बात पर विशेष ध्यान दिलाने वाला कथन-सूचक शब्द है। ‘देखो’ हिन्दी में इसका चिह्नित किंतु स्वाभाविक बल व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: निकला
  rationale: यह बाहर जाने की क्रिया बताता है। उद्देश्यसूचक वाक्यांश के साथ ‘बोने निकला’ आधुनिक हिन्दी में स्वाभाविक रूप से वही गति और प्रयोजन व्यक्त करता है।
- source_word: ὁ σπείρων
  choice: बोनेवाला
  rationale: लेखयुक्त वर्तमान कृदंत यहाँ व्यक्ति की भूमिका बताने वाली संज्ञा के रूप में प्रयुक्त है। ‘बोनेवाला’ इस रूप को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: σπεῖραι
  choice: बीज बोने
  rationale: अनंत क्रिया बाहर निकलने का उद्देश्य बताती है। हिन्दी में केवल ‘बोने’ की अपेक्षा ‘बीज बोने’ अर्थ को अधिक स्वाभाविक और स्पष्ट बनाता है; ‘बीज’ क्रिया में निहित कर्म को प्रकट करता है।
