  text: Καὶ ἔλεγεν ⸀αὐτοῖς· Μήτι ⸂ἔρχεται ὁ λύχνος⸃ ἵνα ὑπὸ τὸν μόδιον τεθῇ ἢ ὑπὸ τὴν κλίνην, οὐχ ἵνα ἐπὶ τὴν λυχνίαν ⸀τεθῇ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/021.yaml
  text: And he was saying to them[a], “A lamp does not come to be put under a basket or under a bed[b], does it? Is it not to be put on the lampstand?”
translation:
  language: hi
  text: और वह उनसे कहा करता था, “दीया नापने के बरतन के नीचे या पलंग के नीचे रखने के लिए तो नहीं आता, है न?[a] क्या वह दीवट पर रखने के लिए नहीं आता?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से दीया ‘आता’ है; यह एक सजीव, मानवीकृत अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहा करता था
  rationale: अपूर्ण भूतकाल का रूप जारी या बार-बार कही जाने वाली बात का संकेत दे सकता है; यह हिंदी प्रयोग उस पक्ष को सहज रूप से व्यक्त करता है।
- source_word: Μήτι
  choice: क्या ...?
  rationale: यह प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। पहले प्रश्न की असंगति और उसके बाद आने वाला सकारात्मक प्रत्युत्तर हिंदी में अपेक्षित उत्तर को स्पष्ट रखते हैं।
- source_word: ἔρχεται ὁ λύχνος
  choice: क्या दीया इसलिए आता है
  rationale: मूल यूनानी में दीये को मानवीय ढंग से ‘आता’ हुआ कहा गया है। हिंदी में भी इस सजीव, लोकोक्तिपरक अभिव्यक्ति को बनाए रखा गया है।
- source_word: λύχνος
  choice: दीया
  rationale: यह शब्द प्रकाश की अमूर्त धारणा नहीं, बल्कि हाथ में उठाया जा सकने वाला तेल का दीपक बताता है; ‘दीया’ आधुनिक हिंदी में स्वाभाविक और ठोस है।
- source_word: μόδιον
  choice: नापने का बरतन
  rationale: μόδιος सूखी वस्तुएँ नापने की माप और उस माप के बरतन को दर्शाता है। ‘नापने का बरतन’ किसी आधुनिक या विदेशी माप-इकाई को थोपे बिना वस्तु का कार्य स्पष्ट करता है।
- source_word: κλίνην
  choice: पलंग
  rationale: κλίνη पलंग या लेटने की चौकी को सूचित कर सकता है; घरेलू दृश्य में ‘पलंग’ सहज और व्यापक रूप से समझा जाता है।
- source_word: λυχνίαν
  choice: दीवट
  rationale: यह विशेष रूप से दीया रखने के आधार को दर्शाता है। ‘दीवट’ संक्षिप्त है और चित्र की ठोसता बनाए रखता है।
- source_word: τεθῇ
  choice: रखा जाए / रखे जाने
  rationale: τίθημι के कर्मवाच्य रूप और ἵνα के प्रयोजनार्थक संबंध को स्वाभाविक हिंदी में इन कर्मवाच्य रूपों से व्यक्त किया गया है।
- source_word: ἵνα ... τεθῇ
  choice: इसलिए ... कि ... रखा जाए / रखे जाने के लिए
  rationale: दोनों प्रश्नों में प्रयोजन का भाव स्पष्ट रखा गया है, बिना उसे केवल सामान्य क्रिया या परिणाम में बदलने के।
theological_decisions:
- issue: दीये के ‘आने’ वाली सजीव अभिव्यक्ति को रखना या उसे ‘लाया जाता है’ में बदलना
  choice: 'सक्रिय और मानवीकृत चित्र को बनाए रखना: ‘दीया ... आता है’'
  alternative: ‘क्या दीया ... रखने के लिए लाया जाता है?’
  rationale: मूल कथन जानबूझकर सजीव और लोकोक्तिपरक है। सक्रिय भाषा को रखने से कोई व्याख्यात्मक निष्कर्ष थोपे बिना उसकी अलंकारिक शक्ति बनी रहती है।
- issue: ὁ λύχνος के निश्चित उपपद को हिंदी में कैसे व्यक्त किया जाए
  choice: जातिवाचक रूप में ‘दीया’
  alternative: ‘वह दीया’
  rationale: यह किसी पहले उल्लिखित विशेष दीये की नहीं, दीये के सामान्य प्रयोजन की बात है। हिंदी में बिना संकेतवाचक शब्द के ‘दीया’ स्वाभाविक रूप से जातिवाचक अर्थ देता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘दीया’, ‘पलंग’ और ‘नापने का बरतन’ सामान्य पाठक के लिए सहज हैं; ‘दीवट’ मूल घरेलू चित्र को संक्षिप्त और सटीक रूप में सुरक्षित रखता है।
