base_translation:
  language: en
  yaml_path: translation/nt/mark/004/039.yaml
  text: And having awakened[a], he rebuked the wind and said to the sea, “Be silent! Be still!” And the wind ceased[b], and there was a great calm.
translation:
  language: hi
  text: और वह जाग उठा[a], और उसने हवा को डाँटा और समुद्र से कहा, “चुप हो जा! थम जा!”[b] तब हवा थम गई, और बड़ी शान्ति हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसे जगाया गया।” यूनानी रूप व्याकरण की दृष्टि से कर्मवाच्य है; प्रसंग में वह नींद से जागने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, “मुँह बन्द किया जा” या “लगाम लगाया जा।”
    reason: lexical_alternative
