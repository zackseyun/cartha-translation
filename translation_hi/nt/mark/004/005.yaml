base_translation:
  language: en
  yaml_path: translation/nt/mark/004/005.yaml
  text: And other seed fell on the rocky ground[a], where it did not have much soil, and it sprang up at once because it had no depth of soil.
translation:
  language: hi
  text: और दूसरा बीज पथरीली भूमि पर गिरा,[a] जहाँ अधिक मिट्टी नहीं थी; और मिट्टी गहरी न होने के कारण वह तुरन्त उग आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पत्थरीली जमीन पर।” यूनानी शब्द ऐसी चट्टानी जगह का वर्णन करता है जिसके ऊपर मिट्टी की केवल एक उथली परत होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: कुछ बीज
  rationale: नपुंसकलिंग एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और पिछले प्रसंग के बीज की ओर संकेत करता है। हिन्दी में ‘कुछ बीज’ निहित संज्ञा को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: πετρῶδες
  choice: पथरीली भूमि
  rationale: यह ऐसी चट्टानी या पत्थरयुक्त जमीन को दर्शाता है जिसके ऊपर मिट्टी की परत उथली है; ‘पथरीली भूमि’ आधुनिक हिन्दी में इस कृषि-दृश्य को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: γῆν πολλήν
  choice: अधिक मिट्टी
  rationale: यहाँ γῆ का अर्थ खेती के योग्य मिट्टी है, व्यापक अर्थ में देश या भूमि नहीं। ‘अधिक मिट्टी’ मूल के परिमाण-संबंधी भाव को बनाए रखता है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह शीघ्रता को चिह्नित करता है; ‘तुरन्त’ सामान्य और स्पष्ट आधुनिक हिन्दी है।
- source_word: ἐξανέτειλεν
  choice: उग आया
  rationale: कृषि-संदर्भ में क्रिया बीज के अंकुरित होकर निकल आने को बताती है। ‘उग आया’ सहज हिन्दी है और आकस्मिक शीघ्र वृद्धि के संदर्भ में उपयुक्त है।
- source_word: διὰ τὸ μὴ ἔχειν βάθος γῆς
  choice: मिट्टी गहरी न होने के कारण
  rationale: διά के साथ प्रयुक्त infinitival construction कारण व्यक्त करता है। यह हिन्दी रूप कारण को स्पष्ट रखते हुए मिट्टी की उथली परत का चित्र सुरक्षित रखता है।
- source_word: ὅπου
  choice: जहाँ
  rationale: सरल स्थानवाचक सम्बन्धसूचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
