  text: The sower sows the word[a].
translation:
  language: hi
  text: बोने वाला वचन[a] बोता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संदेश।’ यूनानी शब्द λόγος का अर्थ प्रसंग के अनुसार ‘वचन’ या ‘संदेश’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ σπείρων
  choice: बोनेवाला
  rationale: लेखयुक्त वर्तमान कृदन्त यहाँ संज्ञा के रूप में उस व्यक्ति को दर्शाता है जिसकी पहचान बोने के काम से है। ‘बोनेवाला’ संक्षिप्त और स्वाभाविक है तथा दृष्टान्त का चित्र बनाए रखता है; ‘किसान’ कहना अधिक व्याख्यात्मक होता।
- source_word: τὸν λόγον
  choice: वचन
  rationale: λόγος का अर्थ प्रसंग के अनुसार ‘वचन’, ‘शब्द’ या ‘संदेश’ हो सकता है। यहाँ ‘वचन’ उद्घोषित बात की ओर संकेत करता है और मूल पाठ की संक्षिप्तता बनाए रखता है, जबकि ‘संदेश’ भी सम्भव अर्थ है।
- source_word: σπείρει
  choice: बोता है
  rationale: वर्तमान काल यहाँ दृष्टान्त की सामान्य क्रिया बताता है। ‘बोनेवाला’ और ‘बोता है’ के द्वारा σπείρω की पुनरावृत्ति भी सुरक्षित रहती है।
theological_decisions:
- issue: दृष्टान्त की व्याख्या में ‘वचन’ का आशय
  choice: मूल पाठ के अनुरूप केवल ‘वचन’ रखा गया है।
  alternative: ‘संदेश’ या ‘परमेश्वर का वचन’
  rationale: यूनानी पाठ में केवल τὸν λόγον है। व्यापक प्रसंग में यह परमेश्वर की घोषित बात की ओर संकेत करता है, पर ‘परमेश्वर का’ जोड़ना इस पद में स्पष्ट न की गई बात को अनुवाद में सम्मिलित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘बोनेवाला…बोता है’ मूल यूनानी की शब्द-पुनरावृत्ति और दृष्टान्तात्मक लय को सुरक्षित रखता है।
