  text: Καὶ λέγει αὐτοῖς· Οὐκ οἴδατε τὴν παραβολὴν ταύτην, καὶ πῶς πάσας τὰς παραβολὰς γνώσεσθε;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/013.yaml
  text: And he says to them[a], “Do you not understand this parable? Then how will you understand all the parables?”
translation:
  language: hi
  text: और वह उनसे कहता है, “क्या तुम इस दृष्टान्त को नहीं समझते?[a] फिर तुम सब दृष्टान्तों को कैसे समझोगे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “क्या तुम इस दृष्टान्त को नहीं जानते? और सब दृष्टान्तों को कैसे जानोगे?” यूनानी में दो अलग क्रियाएँ हैं जिनका अनुवाद ‘जानना’ किया जा सकता है, पर यहाँ उनका भाव समझने का है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: मरकुस की विशिष्ट ऐतिहासिक वर्तमान-काल शैली और कथा की सजीवता बनाए रखने के लिए वर्तमान काल रखा गया है।
- source_word: οἴδατε
  choice: समझते
  rationale: मूल क्रिया का सामान्य अर्थ ‘जानना’ हो सकता है, पर यहाँ दृष्टान्त के अर्थ को ग्रहण करना अभिप्रेत है; इसलिए ‘समझते’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: यीशु की इस शिक्षण-विधा के लिए यह प्रचलित, गरिमापूर्ण और सटीक हिन्दी शब्द है।
- source_word: ταύτην
  choice: इस
  rationale: यह संकेतवाचक शब्द ठीक पहले सुनाए गए दृष्टान्त की ओर संकेत करता है।
- source_word: καὶ πῶς
  choice: फिर ... कैसे
  rationale: दूसरा प्रश्न पहले प्रश्न से निकलने वाला निष्कर्ष है; हिन्दी में ‘फिर ... कैसे’ इस तार्किक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πάσας τὰς παραβολὰς
  choice: सब दृष्टान्तों को
  rationale: बहुवचन के साथ πᾶς का व्यापक अर्थ सुरक्षित रहता है और यीशु की दृष्टान्तमय शिक्षा की ओर संकेत होता है।
- source_word: γνώσεσθε
  choice: समझोगे
  rationale: यहाँ भविष्यकालीन क्रिया दृष्टान्तों का अर्थ ग्रहण करने की बात करती है; ‘समझोगे’ प्रसंग तथा पहले प्रश्न के समानांतर है।
theological_decisions:
- issue: οἴδατε और γνώσεσθε का परस्पर संबंध
  choice: दोनों क्रियाओं का अनुवाद ‘समझना’ से किया गया है।
  alternative: पहली या दोनों क्रियाओं के लिए ‘जानना’ रखा जा सकता है।
  rationale: प्रसंग में प्रश्न केवल दृष्टान्त से परिचित होने का नहीं, उसका आशय ग्रहण करने का है। फिर भी मूल में प्रयुक्त दो अलग यूनानी क्रियाओं और ‘जानना’ वाले अधिक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथन; ‘दृष्टान्त’ बाइबलीय संदर्भ में व्यापक रूप से पहचाना जाने वाला शब्द है। ऐतिहासिक वर्तमान और दोनों प्रश्नों की तीखी आलंकारिक शक्ति सुरक्षित रखी गई है।
