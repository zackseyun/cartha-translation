  text: And other seed fell among the thorns[a], and the thorns came up and choked it[b], and it yielded no fruit.
translation:
  language: hi
  text: और कुछ बीज काँटों के बीच[a] गिरा। काँटे बढ़े और उन्होंने उसे दबा दिया, और उसने फल नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘काँटों में’। यूनानी पूर्वसर्ग का मूल दिशात्मक अर्थ ‘काँटों में/के भीतर’ की ओर या प्रवेश करके है, पर इस संदर्भ में ‘काँटों के बीच’ अधिक स्वाभाविक हिन्दी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλο
  choice: कुछ बीज
  rationale: नपुंसकलिंग एकवचन विशेषण पिछले संदर्भ में बोए जा रहे बीज को सूचित करता है। हिन्दी में स्वाभाविक और स्पष्ट अभिव्यक्ति के लिए ‘बीज’ जोड़ा गया है; ‘कुछ’ बीज को सामूहिक अर्थ में ग्रहण करता है।
- source_word: ἔπεσεν
  choice: गिरा
  rationale: πίπτω के सामान्य अर्थ ‘गिरना’ को सीधे रखता है; ‘बोया गया’ कहने से क्रिया में वह व्याख्या जुड़ती जो मूल शब्द में नहीं है।
- source_word: εἰς τὰς ἀκάνθας
  choice: काँटों के बीच
  rationale: εἰς का मूल दिशात्मक भाव ‘में/के भीतर’ है, पर इस कृषि-दृश्य में आधुनिक हिन्दी का स्वाभाविक प्रयोग ‘काँटों के बीच’ है।
- source_word: ἀνέβησαν
  choice: बढ़े
  rationale: पौधों के ऊपर आने और बढ़ने के लिए ἀναβαίνω का प्रसंगानुकूल अर्थ है। ‘बढ़े’ सहज हिन्दी है और काँटों की वृद्धि स्पष्ट करता है।
- source_word: συνέπνιξαν
  choice: दबा दिया
  rationale: συμπνίγω यहाँ काँटों द्वारा पौधे की बढ़त रोक देने का चित्र देता है। हिन्दी में वनस्पति के संदर्भ में ‘दबा दिया’ स्वाभाविक है और केवल शाब्दिक ‘गला घोंट दिया’ की अपेक्षा दृश्य को ठीक व्यक्त करता है।
- source_word: αὐτό
  choice: उसे
  rationale: एकवचन सर्वनाम निहित बीज/उससे उगे पौधे की ओर लौटता है। ‘उसे’ मूल की सर्वनामिक अभिव्यक्ति बनाए रखता है।
- source_word: καρπὸν οὐκ ἔδωκεν
  choice: उसने फल नहीं दिया
  rationale: मूल वाक्यांश का निकट और स्वाभाविक हिन्दी रूप है; कृषि-संदर्भ में फल उत्पन्न न होने का परिणाम स्पष्ट रहता है।
