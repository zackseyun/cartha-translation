lexical_decisions:
- source_word: ἐγένετο ἐν τῷ σπείρειν
  choice: बोते समय
  rationale: यह यूनानी रचना किसी काम के दौरान हुई घटना को कथात्मक ढंग से प्रस्तुत करती है। ‘बोते समय’ इसके कालगत अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: ὃ μὲν
  choice: कुछ बीज
  rationale: नपुंसकलिंग संबंधवाचक रूप और μέν बोए जा रहे बीज के एक हिस्से की ओर संकेत करते हैं; हिन्दी में स्पष्ट कर्ता के लिए ‘कुछ बीज’ स्वाभाविक है।
- source_word: ἔπεσεν
  choice: गिरा
  rationale: इस प्रसंग में πίπτω का सीधा और स्वाभाविक हिन्दी रूप। ‘बीज’ को सामूहिक एकवचन मानकर क्रिया एकवचन रखी गई है।
- source_word: παρὰ τὴν ὁδόν
  choice: रास्ते के किनारे
  rationale: παρά के साथ कर्मकारक यहाँ रास्ते के पास या उसके साथ लगे स्थान को दर्शाता है। खेत के प्रसंग में ‘रास्ते के किनारे’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: τὰ πετεινὰ
  choice: पक्षियों
  rationale: πετεινά का सामान्य अर्थ पक्षी है; मूल में ‘आकाश के’ जैसा कोई अतिरिक्त विशेषण नहीं है।
- source_word: κατέφαγεν
  choice: चट कर लिया
  rationale: κατεσθίω साधारण खाने से अधिक पूर्णतः खा जाने का भाव देता है। ‘चट कर लिया’ उस तीव्रता को साधारण आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτό
  choice: उसे
  rationale: सर्वनाम सामूहिक रूप में उल्लिखित बीज के उस हिस्से की ओर संकेत करता है; हिन्दी में ‘उसे’ स्वाभाविक है।
