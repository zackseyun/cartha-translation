  text: καὶ ἐφοβήθησαν φόβον μέγαν, καὶ ἔλεγον πρὸς ἀλλήλους· Τίς ἄρα οὗτός ἐστιν ὅτι καὶ ὁ ἄνεμος καὶ ἡ θάλασσα ⸀ὑπακούει αὐτῷ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/041.yaml
  text: And they feared a great fear[a], and they said to one another, “Who then is this, that even the wind and the sea obey him?”
translation:
  language: hi
  text: और वे बहुत डर गए[a], और आपस में कहने लगे, “आखिर यह कौन है कि हवा और समुद्र भी उसकी आज्ञा मानते हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे बड़ा भय डरे।” यूनानी में एक ही मूल के शब्दों को साथ रखकर भय की तीव्रता प्रकट की गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: वे बहुत डर गए
  rationale: क्रिया के साथ उसी मूल की कर्मवाचक संज्ञा भय की तीव्रता बढ़ाती है। शाब्दिक ‘वे बड़ा भय डरे’ आधुनिक हिन्दी में अस्वाभाविक है; ‘बहुत डर गए’ उसी प्रबल भाव को सहज रूप से व्यक्त करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल चलती हुई प्रतिक्रिया या बातचीत का संकेत दे सकता है। प्रसंग में ‘कहने लगे’ स्वाभाविक हिन्दी कथा-शैली में इस पक्ष को बनाए रखता है।
- source_word: πρὸς ἀλλήλους
  choice: आपस में
  rationale: यह परस्पर एक-दूसरे से बोलने का भाव संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Τίς ἄρα οὗτός ἐστιν
  choice: आखिर यह कौन है
  rationale: ἄρα में घटना से निकले चकित निष्कर्ष का भाव है; ‘आखिर’ उस विस्मय और प्रश्नात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह आगे के कथन को प्रश्न के आधार अथवा आश्चर्य की विषय-वस्तु के रूप में जोड़ता है; हिन्दी में ‘कि’ सहज संयोजक है।
- source_word: καὶ ὁ ἄνεμος καὶ ἡ θάλασσα
  choice: हवा और झील भी
  rationale: पहला καὶ ‘भी/यहाँ तक कि’ का बल देता है और दूसरा दोनों कर्ताओं को जोड़ता है। ‘भी’ को संयुक्त पद के बाद रखना हिन्दी में दोनों—हवा और झील—पर आश्चर्य का बल डालता है। गलील की θάλασσα के लिए प्रसंगानुकूल ‘झील’ भौगोलिक रूप से स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑπακούει αὐτῷ
  choice: इसकी आज्ञा मानती हैं
  rationale: ὑπακούω का अर्थ सुनना मानना अथवा आज्ञापालन करना है। यहाँ हवा और जल का यीशु की आज्ञा के अधीन होना व्यक्त है; बहुवचन संयुक्त कर्ता के अनुसार ‘मानती हैं’ रखा गया है।
theological_decisions:
- issue: सृष्टि पर यीशु के अधिकार का चित्रण
  choice: शिष्यों के विस्मयपूर्ण प्रश्न और हवा तथा झील के आज्ञापालन को सीधे बनाए रखा गया है।
  alternative: वाक्य में यीशु की दिव्य पहचान की स्पष्ट व्याख्या जोड़ना।
  rationale: मूल पाठ असाधारण अधिकार का प्रबल संकेत देता है, पर निष्कर्ष को व्याख्यात्मक सिद्धान्त-वाक्य में नहीं बदलता। अनुवाद उसी तनाव और प्रश्न को सुरक्षित रखता है।
- issue: αὐτῷ के लिए सर्वनाम का स्तर
  choice: इसकी
  alternative: उनकी
  rationale: मूल यूनानी में सम्मानसूचकता का व्याकरणिक भेद नहीं है। शिष्यों के तत्काल विस्मित प्रश्न में ‘यह…इसकी’ निकटवर्ती संकेत-सर्वनाम की संगति रखता है और अनुवाद में बाद की भक्तिपरक सम्मानसूचकता नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘बहुत डर गए’ मूल की तीव्रता को स्वाभाविक ढंग से व्यक्त करता है; [a] शाब्दिक यूनानी अभिव्यक्ति दर्ज करता है। ‘समुद्र’ के बजाय ‘झील’ प्रसंग की वास्तविक जलराशि को सामान्य पाठक के लिए स्पष्ट करता है, जबकि मूल θάλασσα की व्यापक शब्द-सीमा को स्वीकार करता है।
