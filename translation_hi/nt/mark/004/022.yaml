    issue: Footnote a describes ‘प्रकट किया जाए’ as an alternative reading.
    rationale: The Greek φανερωθῇ is already passive, so this is not a substantive alternative to ‘प्रकट हो जाए.’ The footnote should instead identify the possible purposive rendering of ἵνα (‘ताकि’), while noting its possible result nuance.
  - severity: low
