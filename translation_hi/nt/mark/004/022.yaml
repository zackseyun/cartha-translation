reference: Mark 4:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γάρ ἐστιν ⸀κρυπτὸν ἐὰν μὴ ⸀ἵνα φανερωθῇ, οὐδὲ ἐγένετο ἀπόκρυφον ἀλλ’ ἵνα ⸂ἔλθῃ εἰς φανερόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/022.yaml
  text: For nothing is hidden except to be revealed[b][a], nor has anything become concealed except to come to light.
translation:
  language: hi
  text: क्योंकि कुछ भी छिपा हुआ नहीं है, सिवाय इसके कि वह प्रकट हो जाए[a]; और कुछ भी गुप्त नहीं हुआ है, सिवाय इसके कि वह खुले में आ जाए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिवाय इसके कि वह प्रकट हो जाए” के स्थान पर, “ताकि वह प्रकट हो जाए।” यूनानी ἵνα यहाँ प्रयोजन (“ताकि”) अथवा परिणाम (“जिससे अंततः”)—दोनों का भाव दे सकता है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक अर्थ: “दृश्य या खुले स्थान में आ जाए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: κρυπτόν
  choice: छिपा हुआ
  rationale: यह मूल विशेषण के सामान्य अर्थ को स्वाभाविक हिन्दी में रखता है और जानबूझकर रहस्य बनाए रखने का अतिरिक्त भाव नहीं जोड़ता।
- source_word: ἐὰν μὴ ἵνα
  choice: सिवाय इसके कि
  rationale: यह अपवाद की संरचना को बनाए रखता है और ἵνα में निहित प्रयोजन तथा परिणाम—दोनों संभावित भावों के लिए स्थान छोड़ता है।
- source_word: φανερωθῇ
  choice: प्रकट हो जाए
  rationale: यह φανερόω के निष्क्रिय भाव—दिखाई या ज्ञात हो जाना—को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπόκρυφον
  choice: गुप्त
  rationale: यह दृष्टि से ओझल या छिपी हुई वस्तु का अर्थ देता है और पहले खंड के ‘छिपा हुआ’ से समानता रखते हुए शब्दगत भिन्नता भी बचाता है।
- source_word: ἐγένετο
  choice: हुआ है
  rationale: यह γίνομαι के किसी अवस्था में आने के भाव को रखता है; ‘रखा गया’ कहने से किसी स्पष्ट कर्ता और जानबूझकर किए गए कार्य का अनावश्यक संकेत मिलता।
- source_word: ἔλθῃ εἰς φανερόν
  choice: खुलकर सामने आ जाए
  rationale: यह ἔλθῃ की गति तथा εἰς φανερόν के खुले या दृश्य क्षेत्र में आने के चित्र—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह कथन को पिछले प्रसंग की व्याख्या के रूप में जोड़ने वाले γάρ के संबंध को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: दोनों ἵνα उपवाक्यों में प्रयोजन और परिणाम का संबंध
  choice: ‘सिवाय इसके कि … हो जाए/आ जाए’ के द्वारा दोनों अर्थ-छायाओं को खुला रखा गया है।
  alternative: ‘… होने के लिए ही’ कहकर स्पष्ट प्रयोजन, अथवा ‘… अंततः होगा’ कहकर स्पष्ट परिणाम व्यक्त करना।
  rationale: कोइने यूनानी में ἵνα सामान्यतः प्रयोजन बताता है, पर यहाँ परिणाम का भाव भी सुना जा सकता है। अनुवाद यह दावा नहीं करता कि परमेश्वर ने हर छिपी बात को किसी विशेष कारण से छिपाया, और न यह कहावत के प्रकटीकरण की ओर झुकाव को मिटाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर यूनानी वाक्य-विन्यास को अर्धविराम तथा दोहराए गए ‘सिवाय इसके कि’ से सुरक्षित रखा गया है; ‘कुछ भी/कुछ’ नपुंसकलिंग एकवचन के सामान्य, सर्वसमावेशी प्रयोग को हिन्दी में स्वाभाविक बनाता है।
