  text: ⸂Καὶ ὅτε⸃ ἐγένετο κατὰ μόνας, ⸀ἠρώτων αὐτὸν οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα ⸂τὰς παραβολάς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/010.yaml
  text: And when he was alone[a], those around him with the Twelve were asking him about the parables.
translation:
  language: hi
  text: और जब वह एकांत में था, तब उसके आसपास रहनेवाले लोग बारहों के साथ उससे दृष्टान्तों के विषय में पूछ रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὅτε
  choice: और जब
  rationale: καί के कथात्मक संयोजन और ὅτε के समय-संबंधी अर्थ—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγένετο κατὰ μόνας
  choice: वह एकांत में था
  rationale: κατὰ μόνας यहाँ सार्वजनिक भीड़ से अलग, निजी स्थिति का बोध कराता है। ‘एकांत में’ इस आशय को व्यक्त करता है और साथ में उपस्थित शिष्यों के उल्लेख से अनावश्यक विरोध भी उत्पन्न नहीं करता।
- source_word: ἠρώτων
  choice: पूछ रहे थे
  rationale: अपूर्ण भूतकाल की जारी या पुनरावृत्त क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ περὶ αὐτὸν
  choice: उसके आस-पास के लोग
  rationale: यीशु के निकट रहनेवाले अनुयायियों के व्यापक समूह को दर्शाता है और उसे केवल बारहों तक सीमित नहीं करता।
- source_word: σὺν τοῖς δώδεκα
  choice: बारहों के साथ
  rationale: σύν के सहभागिता-सूचक अर्थ को संक्षेप और स्पष्टता से रखता है तथा व्यापक समूह और बारहों के बीच पाठ में उपस्थित भेद बचाए रखता है।
- source_word: τὰς παραβολάς
  choice: दृष्टान्तों के विषय में
  rationale: यूनानी पाठ के बहुवचन को सुरक्षित रखता है और प्रश्नों के विषय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रश्न पूछनेवाले समूह की पहचान
  choice: यीशु के आस-पास के व्यापक अनुयायी-समूह ने बारहों के साथ उससे पूछा।
  alternative: केवल बारहों ने उससे पूछा।
  rationale: οἱ περὶ αὐτὸν σὺν τοῖς δώδεκα की रचना सबसे स्वाभाविक रूप से यीशु के आस-पास के लोगों और उनके साथ बारहों को दर्शाती है। अनुवाद इस भेद को मिटाए बिना रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली अपनाई गई है। ‘दृष्टान्त’ बाइबिलीय संदर्भ में प्रचलित और सामान्य पाठकों के लिए समझने योग्य शब्द है; ‘एकांत में’ निजी परिस्थिति को व्यक्त करता है, पूर्णतः अकेले होने का अनावश्यक दावा नहीं करता।
