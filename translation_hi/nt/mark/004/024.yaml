  text: καὶ ἔλεγεν αὐτοῖς· Βλέπετε τί ἀκούετε. ἐν ᾧ μέτρῳ μετρεῖτε μετρηθήσεται ὑμῖν καὶ προστεθήσεται ⸀ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/024.yaml
  text: And he was saying to them[a], “Pay attention to what you hear. With the measure you use, it will be measured to you[b], and more will be added to you.”
translation:
  language: hi
  text: और वह उनसे कह रहा था, “इस बात पर ध्यान दो कि तुम क्या सुनते हो। जिस माप से तुम मापते हो, उसी से तुम्हारे लिए मापा जाएगा, और तुम्हें और दिया जाएगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘तुम्हें और दिया जाएगा’ का अर्थ कुछ लोग यह समझते हैं कि जो यीशु की शिक्षा ग्रहण करते हैं, उनकी समझ में और वृद्धि होगी।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली वाणी का संकेत दे सकता है; ‘कहता रहा’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Βλέπετε
  choice: ध्यान दो
  rationale: शाब्दिक अर्थ ‘देखो’ है, पर यहाँ यह सावधानी से सुनने और ग्रहण करने का आग्रह है।
- source_word: τί ἀκούετε
  choice: कि तुम क्या सुनते हो
  rationale: τί का स्वाभाविक अर्थ ‘क्या’ है। इससे मरकुस की अभिव्यक्ति बनी रहती है और इसे लूका 8:18 के ‘कैसे’ से नहीं मिलाया जाता।
- source_word: ἐν ᾧ μέτρῳ μετρεῖτε
  choice: जिस माप से तुम मापते हो
  rationale: यह माप के रूपक और साधन/मानक के भाव को निकट और सुबोध हिन्दी में सुरक्षित रखता है।
- source_word: μετρηθήσεται ὑμῖν
  choice: उसी से तुम्हारे लिए मापा जाएगा
  rationale: भविष्यकालीन कर्मवाच्य और पारस्परिक प्रतिफल का रूपक सुरक्षित है; ‘वापस’ जैसा अनुल्लिखित अर्थ नहीं जोड़ा गया।
- source_word: προστεθήσεται ὑμῖν
  choice: तुम्हें और भी दिया जाएगा
  rationale: मूल क्रिया का अर्थ ‘जोड़ा जाएगा’ है, पर हिन्दी में व्यक्ति के साथ ‘और भी दिया जाएगा’ अधिक स्वाभाविक है और संदर्भगत वृद्धि का भाव व्यक्त करता है।
theological_decisions:
- issue: पारस्परिक माप के कथन का आशय
  choice: कथन को सुनने और ग्रहण करने के प्रसंग में व्यापक पारस्परिक सिद्धांत के रूप में रहने दिया गया है।
  alternative: इसे केवल न्याय, उदारता, या आत्मिक समझ की वृद्धि के सिद्धांत तक सीमित करना।
  rationale: निकटवर्ती संदर्भ यीशु की शिक्षा सुनने से जुड़ा है, फिर भी रूपक किसी एक संकीर्ण धर्मवैज्ञानिक प्रयोग को स्पष्ट रूप से निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘जिस माप से तुम मापते हो’ जानबूझकर रूपक को बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पद 24 के पहले खंड पर लगा [a] उसके दिए हुए पादटिप्पणी-पाठ से असंगत प्रतीत होता है; इसलिए मूल यूनानी के आधार पर वहाँ अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
