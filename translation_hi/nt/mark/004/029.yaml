  text: ὅταν δὲ ⸀παραδοῖ ὁ καρπός, ⸀εὐθὺς ἀποστέλλει τὸ δρέπανον, ὅτι παρέστηκεν ὁ θερισμός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/029.yaml
  text: But when the crop is ready[a], he immediately sends in the sickle, because the harvest has come.
translation:
  language: hi
  text: पर जब फसल तैयार हो जाती है[a], तो वह तुरन्त हँसिया लगा देता है, क्योंकि कटनी का समय आ गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने को सौंप देती है’ अथवा ‘पक जाती है।’ यूनानी में एक असामान्य सक्रिय अभिव्यक्ति है, जिसका अधिक शाब्दिक अर्थ है, ‘फसल अपने को सौंप देती है।’
    reason: παραδοῖ के असामान्य सक्रिय प्रयोग और उसके अर्थ-विकल्पों को बिना यह संकेत दिए सुरक्षित रखना कि फसल अब उपज उत्पन्न करने लगी है।
lexical_decisions:
- source_word: ὅταν δὲ
  choice: पर जब
  rationale: ὅταν अनिश्चित काल-संबंधी उपवाक्य आरम्भ करता है और δέ हल्का संक्रमण अथवा विरोध दिखाता है; ‘पर जब’ प्रसंग की गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παραδοῖ
  choice: तैयार हो जाती है
  rationale: παραδίδωμι का सामान्य अर्थ ‘सौंपना’ है, पर यहाँ फसल कर्ता है और भाव यह है कि वह कटाई के लिए अपने को उपलब्ध कराती है। मुख्य पाठ में स्वाभाविक अर्थ दिया गया है, जबकि असामान्य सक्रिय यूनानी अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὁ καρπός
  choice: फसल
  rationale: कार्पोस का अर्थ फल या उपज हो सकता है; हँसिए और कटनी के संदर्भ में ‘फसल’ पर्याप्त व्यापक और स्वाभाविक कृषि-संबंधी शब्द है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की विशिष्ट शीघ्रता को स्पष्ट और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: ἀποστέλλει τὸ δρέπανον
  choice: हँसिया लगा देता है
  rationale: यूनानी में शाब्दिक रूप से ‘हँसिया भेजता है’ है, जो कटाई आरम्भ करने का मुहावरा है। हिन्दी में ‘हँसिया लगा देता है’ उसी चित्र को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह तत्काल की गई क्रिया का कारण बताता है।
- source_word: παρέστηκεν
  choice: आ गया है
  rationale: पूर्णकालीन रूप उस घटना और उसकी वर्तमान परिणति—कटनी के समय का अब उपस्थित होना—दोनों को व्यक्त करता है।
- source_word: ὁ θερισμός
  choice: कटनी का समय
  rationale: θερισμός कटाई अथवा फसल काटने के अवसर को दर्शाता है; हिन्दी में ‘कटनी का समय आ गया है’ स्पष्ट और मुहावरेदार है।
theological_decisions:
- issue: राज्य के दृष्टान्त में फसल की तैयारी का रूपक
  choice: कृषि-चित्र को ‘फसल तैयार हो जाती है’ के रूप में रखा गया और उसके असामान्य यूनानी रूप को पादटिप्पणी में बताया गया।
  alternative: ‘फसल अपने को सौंप देती है’ जैसा अधिक शाब्दिक रूप, अथवा ‘फसल पक जाती है’ जैसा अधिक व्याख्यात्मक रूप।
  rationale: यह वचन रूपक के धर्मवैज्ञानिक संकेत—न्याय, मिशन या अंतिम पूर्णता—को स्वयं स्पष्ट नहीं करता। इसलिए अनुवाद उनमें से किसी एक को पाठ में आरोपित किए बिना फसल और कटनी के चित्र तथा मूल अभिव्यक्ति की अर्थगत खिंचाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और ग्रामीण कृषि-चित्र के अनुकूल रूप। ‘हँसिया लगा देता है’ हिन्दी में स्वाभाविक है और कटाई तुरन्त आरम्भ करने का भाव रखता है; पादटिप्पणी मूल यूनानी की असामान्यता स्पष्ट करती है।
