  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐκ ἔχουσιν ῥίζαν ἐν ἑαυτοῖς ἀλλὰ πρόσκαιροί εἰσιν, εἶτα γενομένης θλίψεως ἢ διωγμοῦ διὰ τὸν λόγον ⸀εὐθὺς σκανδαλίζονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/017.yaml
  text: and they have no root in themselves[a], but are temporary; then, when affliction or persecution arises because of the word, they immediately fall away.
translation:
  language: hi
  text: और उनके भीतर जड़ नहीं होती, बल्कि वे केवल कुछ समय तक टिकते हैं। फिर वचन के कारण क्लेश या सताव आते ही वे तुरंत ठोकर खाकर गिर जाते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पीछे हट जाते हैं,” “ठोकर खाते हैं,” अथवा “ठोकर खिलाए जाते हैं।” यूनानी क्रिया में किसी बात से अप्रसन्न होकर विमुख हो जाने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ῥίζαν ἐν ἑαυτοῖς
  choice: उनके भीतर जड़
  rationale: बीज और भूमि के दृष्टांत की कृषि-संबंधी उपमा को ज्यों का त्यों रखता है और आत्मवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρόσκαιροί
  choice: केवल कुछ समय तक टिकते हैं
  rationale: मूल विशेषण का अर्थ सीमित अवधि तक बने रहना है। हिन्दी में यह वाक्यांश सहज है और अस्थिर स्वभाव जैसी अतिरिक्त मनोवैज्ञानिक धारणा नहीं जोड़ता।
- source_word: γενομένης θλίψεως ἢ διωγμοῦ
  choice: क्लेश या सताव आते ही
  rationale: जननात्मक निरपेक्ष रचना को समयसूचक रूप में व्यक्त करता है। ‘क्लेश’ दबाव और कष्ट का भाव रखता है, जबकि ‘सताव’ विरोध के कारण किए जाने वाले उत्पीड़न को स्पष्ट करता है।
- source_word: διὰ τὸν λόγον
  choice: वचन के कारण
  rationale: दृष्टांत में बार-बार आने वाले λόγος के लिए ‘वचन’ रखकर शब्दावली और धार्मिक-साहित्यिक संदर्भ की निरंतरता बनाए रखी गई है।
- source_word: εὐθὺς
  choice: तुरंत
  rationale: मरकुस में इस क्रिया-विशेषण की विशिष्ट तात्कालिकता को स्पष्ट और आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: σκανδαλίζονται
  choice: ठोकर खाकर गिर जाते हैं
  rationale: यूनानी क्रिया की ठोकर की उपमा और दबाव में पहले के ग्रहण से हट जाने की गंभीरता—दोनों को व्यक्त करता है। संभावित कर्मवाच्य तथा अप्रसन्न होकर विमुख होने के अर्थ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: शिष्यत्व और विमुखता के संदर्भ में σκανδαλίζονται का अनुवाद
  choice: ठोकर खाकर गिर जाते हैं
  alternative: पीछे हट जाते हैं; ठोकर खाते हैं; ठोकर खिलाए जाते हैं; अप्रसन्न होकर विमुख हो जाते हैं
  rationale: संदर्भ में लोग वचन को आरंभ में ग्रहण करते हैं, पर कष्ट या सताव में टिक नहीं पाते। चुना हुआ पाठ इस विफलता की गंभीरता और मूल उपमा को बनाए रखता है, पर उनके अंतिम उद्धार के विषय में मूल पाठ से अधिक निर्णायक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘जड़,’ ‘वचन,’ ‘क्लेश’ और ‘सताव’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य-संरचना को सामान्य पाठकों के लिए स्वाभाविक बनाया गया है।
