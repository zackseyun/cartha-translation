source:
  edition: SBLGNT
  text: καὶ ἔλεγεν αὐτοῖς· Ὑμῖν ⸂τὸ μυστήριον δέδοται⸃ τῆς βασιλείας τοῦ θεοῦ· ἐκείνοις δὲ τοῖς ἔξω ἐν παραβολαῖς τὰ πάντα γίνεται,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/011.yaml
  text: And he was saying to them, “To you the mystery of the kingdom of God has been given, but to those outside everything comes in parables,”
translation:
  language: hi
  text: और वह उनसे कहता था, “तुम्हें परमेश्वर के राज्य का रहस्य दिया गया है, पर बाहर वालों के लिए सब कुछ दृष्टान्तों के रूप में आता है,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μυστήριον
  choice: भेद
  rationale: यह उस दैवी सत्य को व्यक्त करता है जो पहले छिपा था और अब दिया या प्रकट किया गया है; आधुनिक हिन्दी में ‘रहस्य’ की तुलना में ‘भेद’ यहाँ अधिक स्वाभाविक है।
- source_word: τοῖς ἔξω
  choice: जो बाहर के हैं
  rationale: यूनानी स्थानिक रूपक को बनाए रखता है और यह स्पष्ट नहीं करता कि बाहर होना सामाजिक, शिष्यत्व-संबंधी या आत्मिक किस अर्थ में है।
- source_word: ἐν παραβολαῖς
  choice: दृष्टान्तों में
  rationale: बहुवचन और माध्यम/रूप की अभिव्यक्ति को निकटता से सुरक्षित रखता है।
- source_word: τὰ πάντα γίνεται
  choice: सब कुछ ... होता है
  rationale: γίνεται के गतिशील अर्थ को ‘होता है’ द्वारा रखा गया है; इसे केवल स्थिर ‘है’ नहीं बनाया गया।
theological_decisions:
- issue: राज्य के भेद का दिया जाना
  choice: तुम्हें ... भेद दिया गया है
  alternative: तुम्हें ... भेद जानने को दिया गया है
  rationale: मूल पाठ में ‘जानने को’ नहीं है; संक्षिप्त कर्मवाच्य वाक्य दैवी दाता को अनकहा रहने देता है और मूल की धार्मिक गहनता बनाए रखता है।
- issue: बाहर वालों के लिए दृष्टान्तों की भूमिका
  choice: उनके लिए सब कुछ दृष्टान्तों में होता है
  alternative: उनसे सब कुछ दृष्टान्तों में कहा जाता है
  rationale: मूल γίνεται व्यापक और कुछ हद तक अस्पष्ट है; ‘कहा जाता है’ जोड़ने से अर्थ अनावश्यक रूप से संकरा हो जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप। ‘परन्तु’ कथन के स्पष्ट विरोध को बनाए रखता है; वाक्य की पुनरावृत्तिमूलक भूमिका के कारण ἔλεγεν को ‘कहता था’ किया गया है।
