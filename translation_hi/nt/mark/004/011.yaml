review_pass:
  verdict: revise
  source_fidelity: The draft accurately retains the imperfect introduction, the passive ‘has been given,’ the spatial-metaphorical ‘those outside,’ and the broad, somewhat opaque scope of ‘everything.’ However, ‘उनके लिए सब कुछ दृष्टान्तों में होता है’ is not a natural Hindi rendering of γίνεται and weakens the source’s ‘comes/is presented’ sense.
  naturalness: ‘जो बाहर के हैं’ is less idiomatic than ‘बाहर वालों,’ and ‘दृष्टान्तों में होता है’ is awkward in modern standard Hindi. ‘दृष्टान्तों के रूप में आता है’ is natural while retaining the source’s broad formulation rather than supplying ‘कहा जाता है.’
  terminology: ‘परमेश्वर का राज्य’ is appropriate. ‘रहस्य’ is the standard modern Hindi equivalent for μυστήριον and better preserves the term’s sense of a divine secret now disclosed than the somewhat archaic and potentially ambiguous ‘भेद.’ ‘दृष्टान्त’ appropriately renders παραβολή.
  issues:
  - severity: medium
    issue: Unnatural rendering of τὰ πάντα γίνεται ἐν παραβολαῖς
    rationale: ‘सब कुछ दृष्टान्तों में होता है’ is grammatically understandable but not idiomatic Hindi and does not clearly convey that everything reaches the outsiders in parabolic form. ‘सब कुछ दृष्टान्तों के रूप में आता है’ preserves the source’s breadth and dynamic wording without adding a verb of speaking.
  - severity: low
    issue: Less idiomatic designation for τοῖς ἔξω
    rationale: ‘जो बाहर के हैं’ is possible, but ‘बाहर वालों’ is the normal modern Hindi expression and preserves the deliberately unspecified ‘outside’ category.
  - severity: low
    issue: μυστήριον rendered as ‘भेद’
    rationale: ‘भेद’ can mean a distinction, difference, or secret and has an older biblical tone. ‘रहस्य’ is clearer in modern Hindi and retains the technical-but-unexplained theological resonance of μυστήριον.
  revised_text: और वह उनसे कहता था, “तुम्हें परमेश्वर के राज्य का रहस्य दिया गया है, पर बाहर वालों के लिए सब कुछ दृष्टान्तों के रूप में आता है,”
  revised_footnotes: []
  revision_rationale: The revision improves modern Hindi idiom and aligns the final clause with the Greek γίνομαι and the English audit trail’s ‘comes,’ while preserving the original’s ambiguity about who ‘the outsiders’ are and what exactly occurs ‘in parables.’ No interpretive explanation or additional object of speech has been introduced.
