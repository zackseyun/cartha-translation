lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले कथन से सरल संबंध बनाए रखता है और ऐसा कालक्रम नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: ἔλεγεν
  choice: वह कहता था
  rationale: अपूर्ण भूतकाल के पक्ष को स्वाभाविक हिन्दी में बनाए रखता है; ‘उसने कहा’ की अपेक्षा चल रहे या प्रसंगगत कथन का भाव अधिक स्पष्ट है, जबकि ‘कहा करता था’ अनावश्यक रूप से बार-बार कहने पर बल दे सकता है।
- source_word: Ὃς ἔχει
  choice: जिसके … हों
  rationale: यूनानी का एकवचन संबंधवाचक प्रयोग सामान्य अर्थ रखता है। हिन्दी का ‘जिसके … हों’ उसी सार्वत्रिक, लोकोक्तिपरक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὦτα
  choice: कान
  rationale: बहुवचन अर्थ हिन्दी के स्वाभाविक रूप ‘कान’ में बना रहता है और कथन की लोकोक्तिपरक शैली सुरक्षित रहती है।
- source_word: ἀκούειν
  choice: सुनने के
  rationale: ‘सुनने के कान’ यूनानी ‘सुनना’ की पुनरावृत्ति को अगले आदेश के साथ बनाए रखता है और केवल शारीरिक श्रवण से आगे ध्यान देकर ग्रहण करने की संभावना को खुला रखता है।
- source_word: ἀκουέτω
  choice: सुन ले
  rationale: तीसरे पुरुष के आदेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और ‘सुनने’ के साथ मूल शब्द की आलंकारिक पुनरावृत्ति बनाए रखता है।
theological_decisions:
- issue: लोकोक्तिपरक कथन में व्याकरणिक पुल्लिंग एकवचन
  choice: ‘जिसके … हों, वह …’ के सामान्य प्रयोग से अनुवाद
  alternative: ‘जिस पुरुष के … हों, वह …’ अथवा बहुवचन ‘जिनके … हों, वे …’
  rationale: यूनानी पुल्लिंग एकवचन यहाँ किसी पुरुष-विशेष तक अर्थ सीमित नहीं करता। हिन्दी का ‘जिसके … वह’ स्रोत के एकवचन ढाँचे और सबके लिए लागू होने वाले अर्थ—दोनों को बनाए रखता है।
- issue: ‘सुनने’ का अर्थ
  choice: व्याख्या जोड़े बिना ‘सुनने … सुन ले’
  alternative: ‘ध्यान से सुने’ अथवा ‘समझ ले’
  rationale: प्रसंग में ध्यान देने और ग्रहण करने का संकेत हो सकता है, पर मूल शब्द स्वयं ‘सुनना’ है। अनुवाद उस अर्थगत तनाव को खुला रखता है और उसे केवल समझने या आज्ञा मानने तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुनने के कान’ की जानबूझकर की गई पुनरावृत्ति मूल कथन की स्मरणीय, लोकोक्तिपरक शैली को सुरक्षित रखती है।
