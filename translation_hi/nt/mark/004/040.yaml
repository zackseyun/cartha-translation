  yaml_path: translation/nt/mark/004/040.yaml
  text: And he said to them[c][b][a], “Why are you so fearful? Do you still have no faith?”
translation:
  language: hi
  text: और उसने उनसे कहा, “तुम इतने भयभीत क्यों हो?[a] क्या तुम्हें अब तक विश्वास नहीं है?”[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम इतने डरपोक क्यों हो?”
    reason: ‘डरपोक’ यूनानी शब्द δειλοί की अधिक कठोर नकारात्मक छाया व्यक्त करता है; संदर्भ में साधारण भय पर बल देने वाला अनुवाद भी संभव है।
  - marker: b
    text: या, “क्या तुम्हें अभी भी कोई विश्वास नहीं है?”
    reason: यह οὔπω के कालगत और आलंकारिक बल को हिन्दी में व्यक्त करने का वैकल्पिक ढंग है।
  - marker: c
    text: यहाँ “विश्वास” का अर्थ “भरोसा” भी हो सकता है।
    reason: इस प्रसंग में πίστις यीशु पर संकट के बीच भरोसा रखने को सूचित कर सकता है।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: पूर्ववर्ती घटना से इस कथन को जोड़ने वाला सामान्य संयोजक।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: कथात्मक संदर्भ में λέγω प्रत्यक्ष कथन का परिचय देता है; αὐτοῖς संबोधित व्यक्तियों को दर्शाता है।
- source_word: Τί
  choice: क्यों
  rationale: विशेषण और ‘होना’ क्रिया के साथ यह प्रश्नवाचक रूप कारण पूछने वाली फटकार के रूप में प्रयुक्त हुआ है।
- source_word: δειλοί
  choice: डरपोक
  rationale: यह शब्द केवल भयभीत होने से अधिक, भय के आगे दब जाने की नकारात्मक छाया रखता है; आधुनिक हिन्दी में ‘डरपोक’ उस फटकार को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὔπω
  choice: अब तक ... नहीं
  rationale: οὔπω का सीधा कालगत अर्थ ‘अभी/अब तक नहीं’ है; यह घटनाओं के बाद भी विश्वास के अभाव पर बल देता है।
- source_word: ἔχετε πίστιν
  choice: तुम्हें ... विश्वास है
  rationale: हिन्दी में अवस्था या गुण के अर्थ में ‘विश्वास होना’ स्वाभाविक है। πίστις के लिए ‘विश्वास’ सामान्य और संदर्भानुकूल चयन है।
theological_decisions:
- issue: तूफ़ान के प्रसंग में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा
  rationale: πίστις का सामान्य धार्मिक अर्थ ‘विश्वास’ सुरक्षित रखा गया है, जबकि इस प्रसंग में यीशु पर व्यावहारिक भरोसे की छाया भी मौजूद है; उसे पादटिप्पणी में रखा गया है।
- issue: οὔπω वाले प्रश्न का स्वरूप
  choice: क्या तुम्हें अब तक विश्वास नहीं है?
  alternative: क्या तुम्हें अभी भी कोई विश्वास नहीं है?
  rationale: ‘अब तक ... नहीं’ यूनानी οὔπω के कालगत अर्थ को सीधे सुरक्षित रखता है। ‘अभी भी कोई ... नहीं’ प्रश्न की तीखी आलंकारिक शक्ति को उभारता है, पर यूनानी संरचना से कुछ अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तुम’ शिष्यों के लिए स्वाभाविक बहुवचन संबोधन है। ‘डरपोक’ फटकार की तीव्रता बनाए रखता है, जबकि संभावित नरम अर्थ पादटिप्पणी में दिया गया है।
