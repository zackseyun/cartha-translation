  text: καὶ ἀφέντες τὸν ὄχλον παραλαμβάνουσιν αὐτὸν ὡς ἦν ἐν τῷ πλοίῳ, καὶ ἄλλα ⸀πλοῖα ἦν μετ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/036.yaml
  text: And leaving the crowd[a], they take him with them just as he was, in the boat[b], and other boats were with him.
translation:
  language: hi
  text: और वे भीड़ को छोड़कर उसे, जैसा वह था, नाव में अपने साथ ले गए[a][b]; और अन्य नावें भी उसके साथ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसे जिस अवस्था में था, उसी अवस्था में अपने साथ ले गए।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे उसे, जैसा वह नाव में था, वैसे ही अपने साथ ले गए।”
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: यह क्रिया मुख्य कार्य से पहले की सहायक क्रिया को व्यक्त करती है। यहाँ अर्थ भीड़ से अलग होकर चल देने का है; औपचारिक रूप से विदा करने का भाव आवश्यक नहीं।
- source_word: τὸν ὄχλον
  choice: भीड़ को
  rationale: ὄχλος एकत्र लोगों की भीड़ को दर्शाता है; आधुनिक हिन्दी में ‘भीड़’ स्पष्ट और स्वाभाविक है।
- source_word: παραλαμβάνουσιν αὐτόν
  choice: उसे … अपने साथ ले गए
  rationale: παραλαμβάνω का आशय किसी को अपने साथ ले चलना है। हिन्दी कथा-शैली में भूतकाल स्वाभाविक है, यद्यपि यूनानी में ऐतिहासिक वर्तमान है।
- source_word: ὡς ἦν
  choice: जैसा वह था
  rationale: यह वाक्यांश यीशु को उसी अवस्था में साथ ले जाने का भाव रखता है और बिना अतिरिक्त तैयारी के निकलने की सम्भावना को खुला रखता है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में ही
  rationale: πλοῖον के लिए इस झील-संबंधी प्रसंग में ‘नाव’ उपयुक्त है। ‘ही’ से यह स्पष्ट होता है कि यीशु पहले से नाव में थे, न कि उस समय उन्हें नाव में चढ़ाया गया।
- source_word: ἄλλα πλοῖα
  choice: दूसरी नावें
  rationale: मूल पाठ में नावों के छोटे होने का कोई विशेषण नहीं है, इसलिए केवल ‘दूसरी नावें’ रखा गया है।
- source_word: ἦν μετ’ αὐτοῦ
  choice: उसके साथ थीं
  rationale: नपुंसकलिंग बहुवचन कर्ता के साथ यूनानी में क्रिया एकवचन है, पर हिन्दी में अर्थानुसार बहुवचन ‘थीं’ आवश्यक है। यह अन्य नावों के साथ चलने का सीधा वर्णन है।
theological_decisions:
- issue: ὡς ἦν ἐν τῷ πλοίῳ का संबंध
  choice: मुख्य पाठ में ‘जैसा वह था’ और ‘नाव में ही’ दोनों को पास रखते हुए यीशु के पहले से नाव में होने का संकेत दिया गया है।
  alternative: इसे केवल उनकी अवस्था या बिना तैयारी के प्रस्थान पर बल देते हुए पढ़ा जा सकता है।
  rationale: यूनानी शब्दक्रम अवस्था और स्थान दोनों को निकटता से जोड़ता है; अनुवाद किसी एक सम्भव अर्थ को इतना निश्चित नहीं बनाता कि दूसरा अर्थ लुप्त हो जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यीशु’ नाम मूल पद में नहीं है, इसलिए सर्वनाम ‘उसे/वह/उसके’ ही बनाए रखे गए हैं। यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथात्मक भूतकाल में व्यक्त किया गया है।
