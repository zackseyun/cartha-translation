base_translation:
  language: en
  yaml_path: translation/nt/mark/004/037.yaml
  text: And a great windstorm arose[a], and the waves were breaking into the boat[c][b], so that the boat was already filling.
translation:
  language: hi
  text: और एक बड़ा आँधी-तूफ़ान उठा[a], और लहरें बार-बार नाव के भीतर आ रही थीं[b], यहाँ तक कि नाव पहले ही भर रही थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, ‘हवा का एक बड़ा तूफ़ान उठा।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘लहरें बार-बार नाव पर प्रहार करके भीतर आ रही थीं।’ यूनानी अपूर्ण भूतकाल बार-बार होती क्रिया को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘नाव पहले ही भरी जा रही थी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: γίνεται
  choice: उठा
  rationale: मरकुस की सजीव ऐतिहासिक-वर्तमान शैली में यह क्रिया तूफ़ान के अचानक आरम्भ होने को बताती है; हिन्दी कथन में ‘उठा’ स्वाभाविक है।
- source_word: λαῖλαψ μεγάλη ἀνέμου
  choice: हवा का एक बड़ा तूफ़ान
  rationale: यह अनुवाद λαῖλαψ के प्रचंड तूफ़ान, μεγάλη के ‘बड़ा’, और ἀνέμου के वायु-संबंधी अर्थ—तीनों को बनाए रखता है।
- source_word: κύματα
  choice: लहरें
  rationale: κῦμα का सामान्य, स्पष्ट और प्रसंगानुकूल आधुनिक हिन्दी रूप।
- source_word: ἐπέβαλλεν εἰς τὸ πλοῖον
  choice: बार-बार नाव के भीतर आ रही थीं
  rationale: अपूर्ण भूतकाल की निरन्तर अथवा पुनरावृत्त क्रिया और εἰς से व्यक्त नाव के भीतर जाने की दिशा को स्पष्ट करता है; प्रहार का भाव वैकल्पिक पादटिप्पणी में रखा गया है।
- source_word: πλοῖον
  choice: नाव
  rationale: गलील झील के प्रसंग और सम्भावित जलयान के आकार के लिए ‘नाव’ आधुनिक हिन्दी में ‘जहाज़’ से अधिक उपयुक्त है।
- source_word: ὥστε
  choice: यहाँ तक कि
  rationale: यह पद लहरों के भीतर आने के परिणामस्वरूप नाव के भरने की परिणति को सहज हिन्दी में व्यक्त करता है।
- source_word: ἤδη
  choice: लगी थी
  rationale: सहायक रचना के साथ यह दर्शाता है कि भरने की प्रक्रिया उस समय तक आरम्भ हो चुकी थी; ‘पहले ही’ विकल्प पादटिप्पणी में स्पष्ट किया गया है।
- source_word: γεμίζεσθαι τὸ πλοῖον
  choice: नाव भरने लगी थी
  rationale: वर्तमान infinitive से व्यक्त चल रही परिणामी प्रक्रिया को स्वाभाविक हिन्दी में रखता है, जबकि यूनानी रूप की कर्मवाच्य सम्भावना पादटिप्पणी में सुरक्षित है।
