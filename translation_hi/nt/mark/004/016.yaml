source:
  edition: SBLGNT
  text: καὶ οὗτοί εἰσιν ⸀ὁμοίως οἱ ἐπὶ τὰ πετρώδη σπειρόμενοι, οἳ ὅταν ἀκούσωσιν τὸν λόγον ⸀εὐθὺς μετὰ χαρᾶς λαμβάνουσιν αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/016.yaml
  text: 'And these are likewise the ones sown on the rocky ground: when they hear the word[a], they immediately receive it with joy,'
translation:
  language: hi
  text: 'और इसी तरह, पथरीली भूमि[a] पर बोए गए लोग ये हैं: जब वे वचन सुनते हैं, तो तुरन्त आनन्द के साथ उसे ग्रहण कर लेते हैं,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पथरीली जगहों पर।’
    reason: ἐπὶ τὰ πετρώδη के स्थान-सूचक अनुवाद का सम्भव विकल्प।
lexical_decisions:
- source_word: ὁμοίως
  choice: इसी तरह
  rationale: यह क्रियाविशेषण इस समूह को दृष्टान्त की पिछली व्याख्या से समान रीति से जोड़ता है; ‘इसी तरह’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐπὶ τὰ πετρώδη
  choice: पथरीली भूमि पर
  rationale: यह खेती के उस स्थान को दर्शाता है जिसकी सतह के नीचे चट्टानी आधार है; ‘पथरीली भूमि’ कृषि-संबंधी बिंब को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: σπειρόμενοι
  choice: बोए गए लोग
  rationale: वर्तमान कृदन्त यहाँ दृष्टान्त में उन लोगों की पहचान कराता है जिन्हें उस भूमि पर बोए गए बीज से दर्शाया गया है; ‘लोग’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, जबकि बोने का मूल बिंब बना रहता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: मरकुस के इस प्रसंग में λόγος घोषित संदेश को सूचित करता है। ‘वचन’ निकटवर्ती पदों की पारिभाषिक पुनरावृत्ति और बाइबलीय अनुगूँज को बनाए रखता है।
- source_word: εὐθύς
  choice: तुरन्त
  rationale: यह मरकुस की विशिष्ट तात्कालिकता को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: यह ग्रहण करने की रीति को मूल पूर्वसर्गीय संरचना के निकट रहते हुए सीधे व्यक्त करता है।
- source_word: λαμβάνουσιν αὐτόν
  choice: उसे ग्रहण कर लेते हैं
  rationale: ‘ग्रहण करना’ सुनकर वचन को स्वीकार करने का भाव देता है, पर स्थायी विश्वास या अंतिम फल के विषय में मूल से अधिक दावा नहीं करता।
theological_decisions:
- issue: ‘बोए गए’ का अभिप्रेत संदर्भ
  choice: दृष्टान्त की भाषा को रखते हुए ‘पथरीली भूमि पर बोए गए लोग’
  alternative: ‘वे लोग जिनके हृदय पथरीली भूमि जैसे हैं’
  rationale: यूनानी पाठ बोने के बिंब को कायम रखते हुए दर्शाए गए लोगों की पहचान करता है। ‘हृदय’ जोड़ना ऐसी व्याख्या होती जो इस पद में स्पष्ट रूप से नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वचन,’ ‘आनन्द’ और ‘ग्रहण’ जैसे परिचित बाइबलीय शब्द प्रयुक्त हैं, पर वाक्य-विन्यास स्वाभाविक हिन्दी का है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न ‘word’ के बाद था, किन्तु पादटिप्पणी वास्तव में ἐπὶ τὰ πετρώδη से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [a] को ‘पथरीली भूमि’ के बाद रखा गया है।
