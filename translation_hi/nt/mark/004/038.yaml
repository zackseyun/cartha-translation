  text: καὶ ⸂αὐτὸς ἦν⸃ ⸀ἐν τῇ πρύμνῃ ἐπὶ τὸ προσκεφάλαιον καθεύδων· καὶ ⸀ἐγείρουσιν αὐτὸν καὶ λέγουσιν αὐτῷ· Διδάσκαλε, οὐ μέλει σοι ὅτι ἀπολλύμεθα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/038.yaml
  text: But he himself was in the stern[a], asleep on the cushion; and they woke him and said to him, “Teacher, do you not care that we are perishing?”
translation:
  language: hi
  text: पर वह स्वयं नाव के पिछले भाग में तकिए[a] पर सो रहा था। उन्होंने उसे जगाया और उससे कहा, “गुरु, क्या आपको परवाह नहीं कि हम नष्ट हो रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिर टिकाने की गद्दी पर।” यूनानी शब्द सिर टिकाने के लिए प्रयुक्त गद्दी या तकिए को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς ἦν
  choice: वह स्वयं ... था
  rationale: स्पष्ट सर्वनाम αὐτός के बल और शिष्यों की व्याकुलता के विपरीत यीशु की स्थिति को बनाए रखने के लिए ‘स्वयं’ रखा गया है।
- source_word: πρύμνῃ
  choice: नाव के पिछले भाग में
  rationale: πρύμνα नाव के पिछले सिरे को सूचित करता है। सामान्य हिन्दी पाठक के लिए यह ‘पिछला भाग’ तकनीकी शब्द ‘पिछाड़ी’ की अपेक्षा अधिक सहज है।
- source_word: ἐπὶ τὸ προσκεφάλαιον
  choice: सिरहाने पर
  rationale: προσκεφάλαιον सिर टिकाने के लिए प्रयुक्त गद्दी या तकिए को सूचित कर सकता है। ‘सिरहाना’ इस अर्थ-सीमा को स्वाभाविक हिन्दी में पर्याप्त रूप से बनाए रखता है; विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: καθεύδων
  choice: सो रहा था
  rationale: वर्तमान कृदंत यीशु की जारी अवस्था बताता है; हिन्दी में अपूर्ण भूतकाल इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐγείρουσιν
  choice: जगाया
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा-शैली में स्वाभाविक भूतकाल से व्यक्त किया गया है।
- source_word: λέγουσιν
  choice: कहा
  rationale: यूनानी ऐतिहासिक वर्तमान का हिन्दी कथा में स्वाभाविक भूतकालीन रूप।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: διδάσκαλος का अर्थ शिक्षक है; संबोधन में ‘गुरु’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है, बिना ‘स्वामी’ का अलग अर्थ जोड़ने के।
- source_word: οὐ μέλει σοι
  choice: क्या आपको परवाह नहीं
  rationale: यह वाक्यांश चिंता या सरोकार न होने का तीखा आरोप व्यक्त करता है। ‘परवाह’ प्रश्न की सीधी और भावनात्मक शक्ति बनाए रखता है।
- source_word: ἀπολλύμεθα
  choice: हम नाश हुए जा रहे हैं
  rationale: यह रूप आसन्न विनाश या मृत्यु की जारी स्थिति व्यक्त करता है। ‘नाश हुए जा रहे हैं’ उसकी तात्कालिकता और व्यापक अर्थ को बनाए रखता है।
theological_decisions:
- issue: यीशु से शिष्यों के प्रश्न का कथात्मक और भावात्मक बल
  choice: “क्या आपको परवाह नहीं कि हम नाश हुए जा रहे हैं?” के रूप में तीखा, आरोपपूर्ण प्रश्न
  alternative: “क्या आपको चिंता नहीं कि हम मरने वाले हैं?” जैसा अपेक्षाकृत कोमल रूप
  rationale: यूनानी प्रश्न व्याकुल और आरोपपूर्ण है। अनुवाद शिष्यों की भावनात्मक तीव्रता बनाए रखता है, पर यीशु के उद्देश्य या शिष्यों के विश्वास के विषय में कोई व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठकों के लिए सहज और गरिमापूर्ण रखी गई है। समुद्री तकनीकी शब्द के बजाय ‘नाव के पिछले भाग’ का प्रयोग स्पष्टता के लिए किया गया है। संबोधन में आदरसूचक ‘आपको’ स्वाभाविक हिन्दी संवाद के अनुरूप है।
