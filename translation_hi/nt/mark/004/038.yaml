review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the emphatic ‘he himself,’ the stern/rear section of the boat, Jesus’ sleeping state, the disciples’ waking him, and the urgent, accusatory question. However, ‘सिरहाने पर’ normally denotes ‘by/at the head of a bed’ rather than the object on which one rests one’s head, and ‘नाश हुए जा रहे हैं’ is not idiomatic modern Hindi for the ongoing danger expressed by ἀπολλύμεθα.
  naturalness: ‘नाव के पिछले भाग’ and the dialogue are natural modern Hindi. Replacing ‘सिरहाने पर’ with ‘तकिए पर’ and ‘नाश हुए जा रहे हैं’ with ‘नष्ट हो रहे हैं’ improves clarity and idiomatic flow while retaining the source sense.
  terminology: ‘गुरु’ is an acceptable natural address for Διδάσκαλε here and does not require alteration. ‘तकिया’ is a clear primary rendering of προσκεφάλαιον; the footnote preserves the viable ‘head-cushion’ alternative.
  issues:
  - severity: medium
    issue: ‘सिरहाने पर’ does not naturally identify a pillow or head-cushion.
    rationale: In current Hindi, सिरहाना commonly means the head-side/head of a bed, so the wording can suggest that Jesus was sleeping at the head end rather than on a cushion. The Greek names the object itself.
  - severity: medium
    issue: ‘हम नाश हुए जा रहे हैं’ is awkward and semantically imprecise in modern Hindi.
    rationale: The construction ‘हुए जा रहे हैं’ does not idiomatically express the present danger of perishing. ‘हम नष्ट हो रहे हैं’ retains the ongoing, urgent sense without adding a specific means such as drowning.
  revised_text: पर वह स्वयं नाव के पिछले भाग में तकिए[a] पर सो रहा था। उन्होंने उसे जगाया और उससे कहा, “गुरु, क्या आपको परवाह नहीं कि हम नष्ट हो रहे हैं?”
