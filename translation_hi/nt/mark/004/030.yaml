  text: Καὶ ἔλεγεν· ⸀Πῶς ὁμοιώσωμεν τὴν βασιλείαν τοῦ θεοῦ, ἢ ἐν ⸀τίνι ⸂αὐτὴν παραβολῇ θῶμεν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/030.yaml
  text: And he was saying[a], “How should we compare the kingdom of God, or in what parable should we set it forth?”
translation:
  language: hi
  text: और वह कहता रहा, “हम परमेश्वर के राज्य की तुलना कैसे करें, या उसे किस दृष्टान्त के माध्यम से प्रस्तुत करें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल क्रिया के जारी या पुनरावृत्त पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘कहा’ की अपेक्षा यूनानी पक्ष को अधिक स्पष्ट रखता है।
- source_word: Πῶς ὁμοιώσωμεν
  choice: हम ... की तुलना किससे करें
  rationale: विचार-विमर्शसूचक प्रश्न में प्रयुक्त संभावनार्थक रूप को ‘करें’ स्वाभाविक ढंग से व्यक्त करता है। यद्यपि Πῶς का शाब्दिक अर्थ ‘कैसे’ है, तुलना के इस प्रसंग में हिन्दी का ‘किससे तुलना करें’ अपेक्षित तुलना-वस्तु को सहज रूप से प्रकट करता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: स्थापित, पारदर्शी और प्रसंगानुकूल पदावली है, जो राज्य और शासन—दोनों से जुड़ी मूल बिम्ब-सम्भावना को बनाए रखती है।
- source_word: ἐν τίνι παραβολῇ
  choice: किस दृष्टान्त के द्वारा
  rationale: ἐν के सम्भव साधनवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और बताता है कि राज्य को किस दृष्टान्त के माध्यम से सामने रखा जाए।
- source_word: παραβολῇ
  choice: दृष्टान्त
  rationale: सुसमाचारों की इस साहित्यिक शिक्षा-विधा के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: αὐτὴν ... θῶμεν
  choice: उसे प्रस्तुत करें
  rationale: τίθημι का मूल अर्थ ‘रखना’ है, पर इस मुहावरे में आशय किसी बात को दृष्टान्त के माध्यम से सामने रखने या व्यक्त करने का है; ‘प्रस्तुत करें’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ में राज्य और शासन की अर्थ-सम्भावना
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: ‘राज्य’ पारम्परिक बिम्ब और व्यापक अर्थ-क्षेत्र को सुरक्षित रखता है; ‘शासन’ सक्रिय राजकीय क्रिया पर बल देता, पर यहाँ अर्थ को अनावश्यक रूप से संकरा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘कहता रहा’ से कथात्मक अपूर्ण पक्ष बचाया गया है, और प्रश्न की सामूहिक ‘हम’ शैली को मूल के अनुसार रखा गया है।
