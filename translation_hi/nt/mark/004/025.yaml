source:
  edition: SBLGNT
  text: ὃς γὰρ ⸀ἔχει, δοθήσεται αὐτῷ· καὶ ὃς οὐκ ἔχει, καὶ ⸀ὃ ἔχει ἀρθήσεται ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/025.yaml
  text: For whoever has[a], more will be given to him; and whoever does not have, even what he has will be taken away from him.
translation:
  language: hi
  text: क्योंकि जिसके पास है, उसे और दिया जाएगा[a]; और जिसके पास नहीं है, उससे वह भी ले लिया जाएगा जो उसके पास है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल ‘उसे दिया जाएगा’ है; कथन के विरोध से ‘और’ का भाव निहित है और स्वाभाविक हिन्दी के लिए इसे पाठ में जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃς
  choice: जिसके
  rationale: यह अनिश्चित संबंधवाचक सर्वनाम सामान्य और लोकोक्तिपरक अर्थ देता है; ‘जिसके’ आधुनिक हिन्दी में स्वाभाविक है और अगले ‘उसे/उससे’ के साथ संबंध स्थापित करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उसके संयोजक बल को स्पष्ट रखता है।
- source_word: ἔχει
  choice: पास है
  rationale: यहाँ सामान्य अधिकार या प्राप्त वस्तु का भाव है; हिन्दी में निरपेक्ष ‘रखता है’ की अपेक्षा ‘जिसके पास है’ अधिक स्वाभाविक है।
- source_word: δοθήσεται αὐτῷ
  choice: उसे और दिया जाएगा
  rationale: यूनानी में कर्म व्यक्त नहीं है, पर विरोधात्मक कथन वृद्धि का संकेत देता है; हिन्दी में ‘और’ जोड़ने से वाक्य स्वाभाविक बनता है, और इसकी सूचना पाद-टिप्पणी में दी गई है।
- source_word: καὶ ὃς οὐκ ἔχει
  choice: और जिसके पास नहीं है
  rationale: ‘और’ दोनों विरोधी भागों को जोड़ता है; ‘जिसके पास नहीं है’ निषेध और सामान्य संदर्भ को सहज हिन्दी में बनाए रखता है।
- source_word: καὶ ὃ ἔχει
  choice: वह भी ... जो उसके पास है
  rationale: दूसरा καὶ यहाँ ‘भी’ का बल देता है; संबंधवाचक रचना वस्तु को जानबूझकर अनिर्दिष्ट रखती है।
- source_word: ἀρθήσεται ἀπ’ αὐτοῦ
  choice: उससे ... ले लिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य और अलग कर दिए जाने के भाव को ‘ले लिया जाएगा’ स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: δοθήσεται में अव्यक्त कर्म
  choice: ‘उसे और दिया जाएगा’
  alternative: ‘उसे दिया जाएगा’
  rationale: मूल यूनानी कर्म को स्पष्ट नहीं करता। कथन के विरोधात्मक ढाँचे में वृद्धि निहित है, और ‘और’ हिन्दी में आवश्यक स्वाभाविकता देता है; पाद-टिप्पणी मूल की संक्षिप्तता स्पष्ट करती है।
- issue: कथन में ‘पास होने’ की अनिर्दिष्ट वस्तु
  choice: ‘जिसके पास है’ और ‘जो उसके पास है’ के रूप में संदर्भ को खुला रखना
  alternative: इसे विशेष रूप से समझ, विश्वास, प्रकाश या आत्मिक ग्रहणशीलता कहना
  rationale: निकटवर्ती संदर्भ अर्थ की दिशा सुझा सकता है, पर इस पद का लोकोक्तिपरक रूप वस्तु को नाम नहीं देता; किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ना उचित नहीं।
- issue: सामान्य एकवचन व्यक्ति-संदर्भ
  choice: ‘जिसके ... उसे/उससे ... उसके’
  alternative: बहुवचन ‘जिनके ... उन्हें/उनसे’
  rationale: यह रचना यूनानी के सामान्य एकवचन बल को बनाए रखते हुए हिन्दी में स्त्री और पुरुष दोनों पर स्वाभाविक रूप से लागू होती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संबंधवाचक-सहसंबंधी रचना (‘जिसके ... उसे/उससे’) मूल के लोकोक्तिपरक सामान्य कथन को बनाए रखती है; किसी विशेष धर्मवैज्ञानिक वस्तु को स्पष्ट नहीं किया गया है।
