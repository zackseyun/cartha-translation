  yaml_path: translation/nt/mark/004/023.yaml
  text: If anyone has ears to hear[a], let him hear.
translation:
  language: hi
  text: यदि किसी के सुनने के कान हों, तो वह सुने।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἴ
  choice: यदि
  rationale: यह शर्तसूचक कथन का आरम्भ करता है और यूनानी रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τις
  choice: किसी
  rationale: यह अनिश्चित सर्वनाम है जिसका आशय सामान्य और सबके लिए खुला है; ‘किसी के’ हिन्दी वाक्य-विन्यास में स्वाभाविक है।
- source_word: ἔχει
  choice: हों
  rationale: यूनानी में साधारण वर्तमानकालीन अधिकार/होने का भाव है; हिन्दी के शर्तसूचक वाक्य में ‘किसी के ... हों’ इसका स्वाभाविक रूप है।
- source_word: ὦτα
  choice: कान
  rationale: मूल का बहुवचन अर्थ हिन्दी के सामान्य शब्द ‘कान’ में संदर्भतः बना रहता है।
- source_word: ἀκούειν
  choice: सुनने के
  rationale: यह सुनने की क्षमता या प्रयोजन बताने वाला क्रियारूप है और ‘कान’ के साथ स्वाभाविक हिन्दी मुहावरा बनाता है।
- source_word: ἀκουέτω
  choice: वह सुने
  rationale: तीसरे पुरुष एकवचन आज्ञार्थक भाव को बनाए रखता है और ἀκούειν के साथ ‘सुन’ धातु की पुनरावृत्ति भी सुरक्षित रखता है।
theological_decisions:
- issue: आज्ञार्थक क्रिया का सामान्य एकवचन संदर्भ
  choice: वह सुने
  alternative: वे सुनें
  rationale: यूनानी में अनिश्चित सर्वनाम और आज्ञार्थक क्रिया दोनों एकवचन हैं। हिन्दी का ‘वह’ लिंग-निरपेक्ष रहते हुए इस प्रतिनिधिक एकवचन को स्वाभाविक ढंग से सुरक्षित रखता है।
translation_notes:
  register: भाषा सरल, वर्तमान और गरिमापूर्ण है। ‘सुनने के कान’ मूल की ठोस अभिव्यक्ति तथा ग्रहणशील होकर सुनने के निहित आह्वान—दोनों को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
