base_translation:
  language: en
  yaml_path: translation/nt/mark/004/033.yaml
  text: And with many such parables he was speaking the word to them[b][a], as they were able to hear it.
translation:
  language: hi
  text: और वह ऐसे बहुत-से दृष्टान्तों के द्वारा उन्हें वचन सुनाता था[a], जितना वे सुन सकते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वचन’ के स्थान पर ‘सन्देश’ या ‘शिक्षा’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी सुनने की क्षमता के अनुसार’।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοιαύταις
  choice: ऐसे ही
  rationale: यह विशेषण पिछले दृष्टान्तों जैसे प्रकार की ओर संकेत करता है; ‘ऐसे ही’ उस तुलनात्मक और निर्देशात्मक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παραβολαῖς
  choice: दृष्टान्तों
  rationale: यीशु की तुलना और कथा के माध्यम से दी गई शिक्षा के लिए ‘दृष्टान्त’ मानक, सटीक और परिचित बाइबलीय शब्द है।
- source_word: πολλαῖς
  choice: बहुत-से
  rationale: यह दृष्टान्तों की बड़ी संख्या को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: ἐλάλει
  choice: सुनाता था
  rationale: अपूर्ण काल की जारी या प्रचलित क्रिया को ‘सुनाता था’ व्यक्त करता है; साथ ही हिन्दी में ‘उन्हें वचन बोलता था’ की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: λαλέω के साथ प्रयुक्त सम्प्रदान कारक को हिन्दी में स्वाभाविक अप्रत्यक्ष कर्म के रूप में व्यक्त किया गया है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: यह यीशु द्वारा सुनाए जा रहे संदेश या शिक्षण-विषय को दर्शाता है। ‘वचन’ मूल यूनानी अभिव्यक्ति और मरकुस की शब्दावली की प्रतिध्वनि को बनाए रखता है।
- source_word: καθὼς
  choice: जितना
  rationale: यहाँ यह मात्रा या क्षमता के अनुरूपता-संबंध को व्यक्त करता है; ‘जितना’ अगले ‘सुन सकते थे’ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: ἠδύναντο
  choice: सकते थे
  rationale: यह उनकी जारी क्षमता को सहज हिन्दी में व्यक्त करता है और यूनानी अपूर्ण काल के भाव के अनुकूल है।
- source_word: ἀκούειν
  choice: सुन
  rationale: मूल अर्थ ‘सुनना’ है। सन्दर्भ में ग्रहण या समझ निहित हो सकती है, पर ‘समझना’ कहने से पाठ की सम्भावित अर्थ-व्याप्ति अनावश्यक रूप से सीमित हो जाती।
theological_decisions:
- issue: यीशु की शिक्षा में τὸν λόγον का अर्थ
  choice: मुख्य पाठ में ‘वचन’
  alternative: ‘सन्देश’ या ‘शिक्षा’
  rationale: यह पद यीशु की घोषणा अथवा शिक्षा की विषय-वस्तु को दर्शाता है। ‘वचन’ यूनानी पद और बाइबलीय मुहावरे को सुरक्षित रखता है, पर उसे किसी संकीर्ण पारिभाषिक सिद्धान्त तक सीमित नहीं करता।
- issue: ἀκούειν में निहित ग्रहण या समझ
  choice: ‘सुन सकते थे’
  alternative: ‘समझ सकते थे’ या ‘ग्रहण कर सकते थे’
  rationale: पाठ स्पष्ट रूप से सुनने की क्षमता कहता है। सुनने में समझ का भाव निहित हो सकता है, पर मुख्य पाठ में ‘सुन’ रखने से वास्तविक अस्पष्टता और धार्मिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण रखी गई है। ‘दृष्टान्त’ और ‘वचन’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं, जबकि वाक्य-रचना को स्वाभाविक हिन्दी के अनुरूप रखा गया है।
