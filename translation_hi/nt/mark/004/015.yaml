source:
  edition: SBLGNT
  text: οὗτοι δέ εἰσιν οἱ παρὰ τὴν ὁδὸν ὅπου σπείρεται ὁ λόγος, καὶ ὅταν ἀκούσωσιν ⸀εὐθὺς ἔρχεται ὁ Σατανᾶς καὶ αἴρει τὸν λόγον τὸν ἐσπαρμένον ⸂εἰς αὐτούς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/015.yaml
  text: 'And these are the ones along the road where the word is sown: when they hear[a], Satan immediately comes and takes away the word that was sown in them.'
translation:
  language: hi
  text: और ये वे लोग हैं जो मार्ग के किनारे की भूमि जैसे हैं, जहाँ वचन बोया जाता है। जब वे सुनते हैं, तो शैतान तुरन्त आकर उनमें बोए गए वचन को उठा ले जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτοι δέ εἰσιν
  choice: और ... वे हैं
  rationale: यह पद को पिछले कथन से हल्के ढंग से जोड़ते हुए दृष्टान्त में बताए लोगों की पहचान कराता है; δέ को प्रबल विरोध के रूप में नहीं लिया गया।
- source_word: οἱ παρὰ τὴν ὁδόν
  choice: मार्ग के किनारे वाले
  rationale: παρά के स्थानवाचक अर्थ और ὁδός की ग्रामीण छवि को स्वाभाविक हिन्दी में बनाए रखता है, साथ ही स्पष्ट करता है कि व्याख्या लोगों के विषय में है।
- source_word: σπείρεται ὁ λόγος
  choice: वचन बोया जाता है
  rationale: कर्मवाच्य रूप और दृष्टान्त की बोने की छवि सुरक्षित रहती है; λόγος की पद में पुनरावृत्ति के लिए 'वचन' एकरूप रखा गया है।
- source_word: ὅταν ἀκούσωσιν
  choice: जब वे सुनते हैं
  rationale: ὅταν और संभावनार्थक क्रिया के सामान्य, बार-बार लागू होने वाले कालगत भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εὐθύς
  choice: तुरन्त
  rationale: मरकुस की शैली में निहित तात्कालिकता को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: ὁ Σατανᾶς
  choice: शैतान
  rationale: यूनानी पाठ में प्रयुक्त व्यक्तिगत नाम/उपाधि का प्रचलित हिन्दी रूप है।
- source_word: αἴρει
  choice: उठा ले जाता है
  rationale: αἴρω के उठाने और दूर ले जाने के व्यापक अर्थ को सुरक्षित रखता है, बिना 'छीनने' की अतिरिक्त तीव्रता जोड़े।
- source_word: τὸν ἐσπαρμένον εἰς αὐτούς
  choice: उनमें बोए गए वचन को
  rationale: विशेषणवत कृदन्त का 'वचन' से संबंध स्पष्ट करता है और εἰς αὐτούς को आन्तरिक ग्रहण के स्वाभाविक हिन्दी भाव 'उनमें' से व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त की व्याख्या में शैतान की व्यक्तिगत कर्तृता
  choice: '''शैतान'' को एक व्यक्तिगत कर्ता के रूप में रखना, जो आता और वचन उठा ले जाता है'
  alternative: '''विरोधी'' जैसा अधिक सामान्य या निर्वैयक्तिक अनुवाद'
  rationale: ὁ Σατανᾶς यहाँ निश्चित व्यक्तिगत नाम/उपाधि के रूप में आता है; पाठ की धार्मिक धारणा को अमूर्त या मनोवैज्ञानिक शक्ति में बदलना उचित नहीं।
- issue: εἰς αὐτούς का स्थानगत रूपक
  choice: '''उनमें बोए गए'''
  alternative: '''उनके बीच बोए गए'' या ''उनके भीतर बोए गए'''
  rationale: '''उनमें'' यूनानी की दिशा/अन्तःस्थिति की गुंजाइश बनाए रखते हुए हिन्दी में स्वाभाविक है; ''उनके बीच'' सामूहिक अर्थ की ओर झुका सकता है और ''भीतर'' अनावश्यक रूप से अधिक स्पष्ट कर सकता है।'
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। 'वचन' को दृष्टान्त की प्रमुख शब्द-पुनरावृत्ति बनाए रखा गया है। वाक्य-विन्यास को समझने योग्य बनाने के लिए यूनानी के लंबे वाक्य को दो वाक्यों में बाँटा गया है।
