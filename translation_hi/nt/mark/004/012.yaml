  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἵνα βλέποντες βλέπωσι καὶ μὴ ἴδωσιν, καὶ ἀκούοντες ἀκούωσι καὶ μὴ συνιῶσιν, μήποτε ἐπιστρέψωσιν καὶ ἀφεθῇ ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/012.yaml
  text: so that seeing they may see and not perceive[a], and hearing they may hear and not understand[c][b], lest they turn back and it be forgiven them.
translation:
  language: hi
  text: ताकि वे देखते हुए देखें, और न पहचानें[a], और सुनते हुए सुनें, और न समझें[b]; कहीं ऐसा न हो कि वे लौट आएँ[c] और उन्हें क्षमा मिल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाँपें’ अथवा ‘वास्तव में देखें।’
    reason: lexical_alternative
  - marker: b
    text: यीशु यहाँ यशायाह 6:9–10 की गूँज दे रहे हैं; कथन दिव्य न्याय और लोगों के प्रत्युत्तर न देने के बीच तनाव को बनाए रखता है।
    reason: cross_reference
  - marker: c
    text: ‘लौट आएँ’ का अनुवाद ‘मुड़ें’ या प्रसंगानुसार ‘मन फिराएँ’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह यूनानी के उद्देश्य/परिणामसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βλέποντες βλέπωσι
  choice: वे देखते हुए देखें
  rationale: कृदन्त और मुख्य क्रिया दोनों को रखकर मूल की जानबूझकर की गई पुनरुक्ति और विरोधाभासी बल सुरक्षित रहता है।
- source_word: ἴδωσιν
  choice: पहचानें
  rationale: यह βλέπω से भेद रखते हुए केवल आँखों से देखने के बजाय वास्तविक बोध या पहचान का भाव देता है; ‘भाँपें’ भी संभव है।
- source_word: ἀκούοντες ἀκούωσι
  choice: सुनते हुए सुनें
  rationale: दोहरी अभिव्यक्ति को बनाए रखने से यशायाह की गूँज और उसका अलंकारिक बल सुरक्षित रहता है।
- source_word: συνιῶσιν
  choice: समझें
  rationale: मानसिक और आत्मिक बोध के लिए यह स्पष्ट, सामान्य और स्वाभाविक आधुनिक हिन्दी है।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह नकारात्मक संभाव्य आशंका को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπιστρέψωσιν
  choice: लौट आएँ
  rationale: यह मुड़ने/लौटने की मूल क्रियात्मक छवि को रखता है और मुख्य पाठ में ‘मन फिराएँ’ जैसा अधिक स्पष्ट धार्मिक अर्थ नहीं थोपता।
- source_word: ἀφεθῇ αὐτοῖς
  choice: उन्हें क्षमा मिल जाए
  rationale: यह कर्मवाच्य और निहित दिव्य कर्ता को बनाए रखते हुए हिन्दी में स्वाभाविक है; यूनानी में क्षमा की वस्तु व्यक्त नहीं की गई है।
theological_decisions:
- issue: यशायाह के उद्धरण में उद्देश्य/परिणाम और इस निहितार्थ के बीच तनाव कि दृष्टान्त पश्चाताप को रोकते हैं
  choice: ‘ताकि ... कहीं ऐसा न हो कि’ द्वारा मूल का उद्देश्य-जैसा कथन बनाए रखा गया है।
  alternative: इसे केवल परिणाम के रूप में नरम करना, जैसे ‘जिसके परिणामस्वरूप’ या ‘वरना शायद’।
  rationale: यूनानी पाठ दिव्य न्याय और लोगों की अनुत्तरदायिता के बीच तनाव को खुला छोड़ता है; अनुवाद इसे किसी एक धर्मवैज्ञानिक समाधान की ओर नहीं मोड़ता।
- issue: ἐπιστρέψωσιν में पश्चाताप का भाव
  choice: मुख्य पाठ में ‘लौट आएँ’; पादटिप्पणी में ‘मुड़ें’ और प्रसंगानुसार ‘मन फिराएँ’।
  alternative: मुख्य पाठ में सीधे ‘मन फिराएँ’।
  rationale: भविष्यद्वाणी के प्रसंग में पश्चाताप का भाव वास्तविक है, पर क्रिया का अर्थ उससे व्यापक है; इसलिए मूल रूपक और वास्तविक अस्पष्टता दोनों रखे गए हैं।
- issue: ἀφεθῇ αὐτοῖς का दिव्य कर्मवाच्य
  choice: ‘उन्हें क्षमा मिल जाए’।
  alternative: ‘परमेश्वर उन्हें क्षमा कर दे’ या ‘उनके पाप क्षमा हो जाएँ’।
  rationale: मूल में न कर्ता स्पष्ट है, न क्षमा की वस्तु; उन्हें जोड़ना अनावश्यक व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। मूल की समानांतर पुनरुक्ति को जानबूझकर रखा गया है। ‘फिर भी’ यूनानी καὶ ... μὴ के विरोधात्मक आशय को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना धर्मवैज्ञानिक तनाव को हल किए।
