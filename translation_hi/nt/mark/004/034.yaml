source:
  edition: SBLGNT
  text: χωρὶς δὲ παραβολῆς οὐκ ἐλάλει αὐτοῖς, κατ’ ἰδίαν δὲ τοῖς ⸂ἰδίοις μαθηταῖς⸃ ἐπέλυεν πάντα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/034.yaml
  text: And he was not speaking to them without a parable[b][a], but in private he was explaining everything to his own disciples.
translation:
  language: hi
  text: और वह दृष्टान्त के बिना उनसे कुछ नहीं कहता था, पर एकान्त में अपने ही शिष्यों को सब कुछ समझाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρὶς δὲ παραβολῆς
  choice: दृष्टान्त के बिना
  rationale: χωρίς का अर्थ ‘बिना/से अलग’ है और एकवचन παραβολῆς यीशु के बोलने के ढंग को ठोस रूप में व्यक्त करता है। ‘दृष्टान्त के बिना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: οὐκ ἐλάλει αὐτοῖς
  choice: वह उनसे कुछ नहीं कहता था
  rationale: अपूर्णकालीन ἐλάλει यहाँ प्रचलित या बार-बार होने वाली क्रिया बताता है। हिन्दी में ‘कुछ नहीं कहता था’ नकार का स्वाभाविक रूप है और ‘उनसे’ श्रोताओं की ओर संकेत करता है।
- source_word: κατ’ ἰδίαν
  choice: एकान्त में
  rationale: यह मुहावरा सार्वजनिक शिक्षा के विपरीत निजी परिस्थिति को दर्शाता है। ‘एकान्त में’ आधुनिक, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: τοῖς ἰδίοις μαθηταῖς
  choice: अपने ही शिष्यों को
  rationale: ἰδίοις के विशेष बल को केवल ‘अपने शिष्यों’ के बजाय ‘अपने ही शिष्यों’ सुरक्षित रखता है।
- source_word: ἐπέλυεν
  choice: समझाता था
  rationale: यहाँ क्रिया का अर्थ समझाना, अर्थ खोलना या व्याख्या करना है। ‘समझाता था’ सामान्य पाठक के लिए सहज है और अपूर्णकालीन, प्रचलित क्रिया को भी व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: मूल में कर्म का दायरा स्पष्ट रूप से सीमित नहीं किया गया। ‘सब कुछ’ उसकी व्यापकता और वास्तविक अस्पष्टता दोनों बनाए रखता है।
theological_decisions:
- issue: यीशु द्वारा एकान्त में समझाई गई बातों का दायरा
  choice: ‘सब कुछ’ कहकर πάντα का व्यापक और अनिर्दिष्ट दायरा बनाए रखा गया।
  alternative: ‘सारे दृष्टान्त’ या ‘अपनी कही हुई सारी बातें’
  rationale: सन्दर्भ दृष्टान्तों की ओर संकेत कर सकता है, पर यूनानी पाठ केवल πάντα कहता है। अनुवाद में दायरे को सन्दर्भ के आधार पर अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। अपूर्णकाल की आदतन क्रिया के लिए ‘कहता था’ और ‘समझाता था’ रखा गया है। ‘अपने ही’ मूल यूनानी के स्वामित्व-संबंधी बल को दर्शाता है।
