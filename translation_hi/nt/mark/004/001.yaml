  text: Καὶ πάλιν ἤρξατο διδάσκειν παρὰ τὴν θάλασσαν. καὶ ⸀συνάγεται πρὸς αὐτὸν ὄχλος ⸀πλεῖστος, ὥστε αὐτὸν ⸂εἰς πλοῖον ἐμβάντα⸃ καθῆσθαι ἐν τῇ θαλάσσῃ, καὶ πᾶς ὁ ὄχλος πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς ⸀ἦσαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/001.yaml
  text: And again he began to teach beside the sea. And a very large crowd gathers to him, so that he got into a boat and sat on the sea, and the whole crowd was by the sea on the land.
translation:
  language: hi
  text: और वह फिर समुद्र के किनारे शिक्षा देने लगा। एक बहुत बड़ी भीड़ उसके पास इकट्ठी होती है[a], इतनी कि वह नाव में चढ़कर समुद्र पर बैठ गया, और सारी भीड़ समुद्र के किनारे की ज़मीन पर थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पास इकट्ठी हो रही है”; मरकुस सजीव वर्णन के लिए प्रायः भूतकाल की घटनाओं को वर्तमान काल में सुनाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह पानी पर नाव में बैठा था, जबकि भीड़ किनारे की ज़मीन पर थी।
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यीशु की शिक्षा देने की गतिविधि की पुनरावृत्ति को सहज और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἤρξατο διδάσκειν
  choice: शिक्षा देने लगा
  rationale: आरम्भसूचक यूनानी रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: παρὰ τὴν θάλασσαν
  choice: झील के किनारे
  rationale: παρά यहाँ जलाशय के पास की स्थिति बताता है। मरकुस के भौगोलिक संदर्भ में θάλασσα गलील की झील है; हिन्दी पाठक के लिए 'झील' भौगोलिक अर्थ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: συνάγεται
  choice: इकट्ठी हो जाती है
  rationale: वर्तमान काल रखकर मरकुस के सजीव ऐतिहासिक वर्तमान को सुरक्षित किया गया है।
- source_word: ὄχλος πλεῖστος
  choice: एक बहुत बड़ी भीड़
  rationale: πλεῖστος की तीव्रता को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: πρὸς αὐτόν
  choice: उसके पास
  rationale: यीशु की ओर आकर उसके निकट एकत्र होने का भाव व्यक्त करता है।
- source_word: ὥστε
  choice: इसलिए
  rationale: भीड़ के अत्यधिक बड़े होने और यीशु के नाव में बैठने के बीच परिणाम का स्वाभाविक हिन्दी संबंध बनाता है।
- source_word: εἰς πλοῖον ἐμβάντα
  choice: नाव में चढ़कर
  rationale: कृदन्तीय रचना और मुख्य क्रिया से पहले नाव में प्रवेश करने की क्रिया दोनों को संक्षेप में बनाए रखता है।
- source_word: καθῆσθαι ἐν τῇ θαλάσσῃ
  choice: झील में बैठ गया
  rationale: मूल की स्थानसूचक अभिव्यक्ति को निकटता से रखता है; संदर्भ से स्पष्ट है कि वह नाव में बैठा था, न कि पानी के भीतर।
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: यूनानी सामूहिक एकवचन का स्वाभाविक हिन्दी समतुल्य है।
- source_word: πρὸς τὴν θάλασσαν ἐπὶ τῆς γῆς
  choice: झील के किनारे भूमि पर
  rationale: जल में नाव पर बैठे यीशु और किनारे की सूखी भूमि पर खड़ी भीड़ के स्थानिक विरोध को बनाए रखता है।
