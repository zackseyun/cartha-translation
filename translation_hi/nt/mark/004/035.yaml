  text: And he says to them on that day[a], when evening had come, “Let us go across to the other side.”
translation:
  language: hi
  text: उसी दिन, जब शाम हो गई, वह उनसे कहता है, “आओ, हम उस पार चलें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: मरकुस की कथा-शैली में प्रयुक्त ऐतिहासिक वर्तमान को बनाए रखने के लिए वर्तमान काल रखा गया है; आधुनिक हिन्दी में भी यह स्वाभाविक कथात्मक प्रभाव देता है।
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उसी दिन
  rationale: यह कालवाचक पदबंध का स्वाभाविक हिन्दी रूप है और पहले वर्णित घटनाक्रम से उसी दिन का संबंध स्पष्ट करता है।
- source_word: ὀψίας γενομένης
  choice: जब शाम हो गई
  rationale: समय बताने वाले संबंधरहित षष्ठी-वाक्यांश का सरल और स्वाभाविक हिन्दी रूप, जो शाम हो चुकने का भाव सुरक्षित रखता है।
- source_word: Διέλθωμεν
  choice: आओ, हम ... चलें
  rationale: प्रथम पुरुष बहुवचन के प्रोत्साहनात्मक संभावनार्थक भाव को बोलचाल में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: झील के विपरीत किनारे की ओर जाने का प्रसंगगत अर्थ संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
