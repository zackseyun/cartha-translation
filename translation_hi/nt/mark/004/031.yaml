revisions:
- from: यह राई के एक दाने[a] के समान है, जो भूमि पर बोए जाने पर भूमि पर पाए जानेवाले सब बीजों से छोटा होता है—
  to: यह राई के एक दाने[a] के समान है, जो भूमि पर बोए जाने पर भूमि पर के सभी बीजों से छोटा होता है—
  rationale: The revision removes the added ‘found’ sense, retains both occurrences of the Greek land qualifier, preserves the comparative rather than changing it to a superlative, and corrects the Hindi grammatical form in the lexical-alternative footnote.
