    reason: lexical_alternative
  revision_rationale: The revision removes the added ‘found’ sense, retains both occurrences of the Greek land qualifier, preserves the comparative rather than changing it to a superlative, and corrects the Hindi grammatical form in the lexical-alternative footnote.
