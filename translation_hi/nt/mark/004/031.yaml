  text: ὡς ⸀κόκκῳ σινάπεως, ὃς ὅταν σπαρῇ ἐπὶ τῆς γῆς, ⸂μικρότερον ὂν⸃ πάντων τῶν ⸀σπερμάτων τῶν ἐπὶ τῆς γῆς—
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/031.yaml
  text: It is like a mustard seed[a], which, when it is sown on the ground[b], being smaller than all the seeds on the ground—
translation:
  language: hi
  text: यह राई के एक दाने[a] के समान है, जो भूमि पर बोए जाने पर भूमि पर के सभी बीजों से छोटा होता है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राई का एक बीज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: यह ... के समान है
  rationale: यह पिछले पद के प्रश्न पर निर्भर उपमा आरम्भ करता है; स्वाभाविक हिन्दी के लिए निहित कर्ता और क्रिया जोड़े गए हैं।
- source_word: κόκκῳ σινάπεως
  choice: राई के एक दाने
  rationale: κόκκος का अर्थ ‘दाना’ या ‘बीज’ हो सकता है। ‘राई का दाना’ आधुनिक हिन्दी में इस वनस्पति-चित्र के लिए स्वाभाविक है और ‘बीज’ से होने वाली पुनरुक्ति भी घटाता है।
- source_word: ὅταν σπαρῇ
  choice: बोए जाने पर
  rationale: ὅταν के साथ aorist subjunctive सामान्य कालगत परिस्थिति व्यक्त करता है; यह प्रयोग हिन्दी में उस अर्थ को संक्षेप और स्वाभाविक रूप से देता है।
- source_word: ἐπὶ τῆς γῆς
  choice: भूमि पर
  rationale: कृषि-संदर्भ में γῆ का आशय पृथ्वी-जगत नहीं, भूमि या मिट्टी है; ‘पर’ ἐπί को निकटता से दर्शाता है।
- source_word: μικρότερον ὂν
  choice: छोटा होता है
  rationale: तुलनात्मक μικρότερον को ‘छोटा’ तथा तुलना के ‘से’ के साथ रखा गया है; सामान्य कथन के लिए participial construction को हिन्दी की स्वाभाविक finite clause में व्यक्त किया गया है।
- source_word: πάντων τῶν σπερμάτων τῶν ἐπὶ τῆς γῆς
  choice: भूमि पर पाए जानेवाले सब बीजों से
  rationale: तुलनात्मक genitive को ‘सब बीजों से’ द्वारा व्यक्त किया गया है और यूनानी में दोहराया गया भूमि-संबंध सुरक्षित रखा गया है।
theological_decisions:
- issue: राई के दाने के आकार का तुलनात्मक अथवा उत्कृष्टतम वर्णन
  choice: ‘सब बीजों से छोटा’
  alternative: ‘सब बीजों में सबसे छोटा’
  rationale: मूल यूनानी में स्पष्ट superlative नहीं, comparative μικρότερον है। चुना गया पाठ उसी व्याकरणिक रूप को सुरक्षित रखता है और आरम्भिक लघुता के दृष्टान्तगत बिंदु को भी व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य के अंत का दीर्घ डैश अगले पद में जारी मूल यूनानी वाक्य-संरचना को संकेत करता है।
