review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the simile, mustard seed imagery, generic temporal clause, comparative μικρότερον, and the repeated ground/land qualifier. However, “भूमि पर पाए जानेवाले” adds the sense ‘found/occurring on the ground,’ which is not expressed by τῶν ἐπὶ τῆς γῆς and is less direct than the Greek locative qualifier.
  naturalness: “भूमि पर बोए जाने पर भूमि पर पाए जानेवाले” is noticeably repetitive and cumbersome. Retaining the Greek repetition while using “भूमि पर के सभी बीजों” is more idiomatic Hindi.
  terminology: “राई के एक दाने” is an appropriate modern Hindi rendering of κόκκος σινάπεως. The lexical-alternative footnote should use the grammatically complete noun phrase “राई का एक बीज,” not “राई के एक बीज.”
  issues:
  - severity: medium
    issue: “पाए जानेवाले” introduces an unwarranted nuance.
    rationale: The Greek repeated phrase τῶν ἐπὶ τῆς γῆς means ‘[the seeds] on the ground/land’; it does not use a verb meaning ‘be found.’
  - severity: low
    issue: The footnote alternative is grammatically awkward.
    rationale: For the alternative noun phrase, standard Hindi is “राई का एक बीज,” whereas “राई के एक बीज” is only appropriate when followed by a governing expression such as “के समान.”
  revised_text: यह राई के एक दाने[a] के समान है, जो भूमि पर बोए जाने पर भूमि पर के सभी बीजों से छोटा होता है—
  revised_footnotes:
