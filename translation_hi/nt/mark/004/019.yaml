source:
  edition: SBLGNT
  text: καὶ αἱ μέριμναι τοῦ ⸀αἰῶνος καὶ ἡ ἀπάτη τοῦ πλούτου καὶ αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι εἰσπορευόμεναι συμπνίγουσιν τὸν λόγον, καὶ ἄκαρπος γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/019.yaml
  text: and the cares of the age[a], and the deceitfulness of riches, and the desires for other things entering in choke the word[d][c][b], and it becomes unfruitful.
translation:
  language: hi
  text: और इस युग की चिंताएँ[a], धन का छलावा[b] और अन्य वस्तुओं की लालसाएँ भीतर आकर वचन को दबा देती हैं; और वह निष्फल हो जाता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस संसार की चिंताएँ।’ यूनानी शब्द का अर्थ ‘युग’ और विस्तार से वर्तमान संसार-व्यवस्था भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘धन का धोखा।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘और वह निष्फल हो जाता है।’ निकटतम संदर्भ ‘वचन’ है; रूपक में इसे बीज/पौधे या सुनने वाले से संबद्ध भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μέριμναι
  choice: चिंताएँ
  rationale: यह शब्द चिंता और जीवन की उलझाने वाली परवाहों को व्यक्त करता है; आधुनिक हिन्दी में ‘चिंताएँ’ स्वाभाविक और स्पष्ट है।
- source_word: αἰῶνος
  choice: इस युग की
  rationale: αἰών का मूल कालगत अर्थ ‘युग’ है। संकेतवाचक पद के कारण ‘इस युग’ वर्तमान व्यवस्था की ओर संकेत करता है और स्रोत की कालगत बारीकी बनाए रखता है।
- source_word: ἀπάτη τοῦ πλούτου
  choice: धन का छलावा
  rationale: यह पद धन के भ्रामक और धोखा देने वाले स्वरूप को बताता है। ‘छलावा’ संक्षिप्त, स्वाभाविक और चित्रात्मक है।
- source_word: αἱ περὶ τὰ λοιπὰ ἐπιθυμίαι
  choice: दूसरी वस्तुओं की लालसाएँ
  rationale: यह व्यापक रूप से अन्य वस्तुओं की ओर लगी इच्छाओं को दर्शाता है। ‘लालसाएँ’ साधारण इच्छा से अधिक प्रबल आकांक्षा का भाव रखता है।
- source_word: εἰσπορευόμεναι
  choice: भीतर आकर
  rationale: कृदन्त इन प्रभावों के व्यक्ति अथवा रूपक की भूमि में प्रवेश करने का सजीव चित्र देता है। हिन्दी में ‘भीतर आकर’ स्वाभाविक रूप से अगले क्रियापद से जुड़ता है।
- source_word: συμπνίγουσιν
  choice: दबा देती हैं
  rationale: कृषि-रूपक में इसका अर्थ पौधे को घेरकर उसका दम रोक देना है। ‘दबा देती हैं’ हिन्दी में खरपतवार द्वारा पौधे को बढ़ने न देने का स्वाभाविक चित्र प्रस्तुत करता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: मरकुस के संदर्भ में यह घोषित संदेश को सूचित करता है। ‘वचन’ बाइबलीय अनुगूँज को बनाए रखते हुए हिन्दी पाठकों के लिए परिचित है।
- source_word: ἄκαρπος γίνεται
  choice: वह निष्फल हो जाता है
  rationale: यह यूनानी के परिणामसूचक भाव को निकटता से रखता है और निकटतम एकवचन पूर्वपद ‘वचन’ को सर्वनाम से पुनः ग्रहण करता है।
theological_decisions:
- issue: अंतिम एकवचन क्रिया और विशेषण का संदर्भ
  choice: ‘वह’ का निकटतम व्याकरणिक संदर्भ ‘वचन’ है।
  alternative: सुनने वाला निष्फल हो जाता है; अथवा बीज/पौधा निष्फल हो जाता है।
  rationale: τὸν λόγον निकटतम स्पष्ट एकवचन पूर्वपद है, इसलिए मुख्य पाठ उसी को ग्रहण करता है। फिर भी रूपक के स्तर पर बीज/पौधे या सुनने वाले का आशय संभव है; पादटिप्पणी इस वास्तविक अर्थगत खुलापन को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में तीनों कर्ताओं—चिंताएँ, छलावा और लालसाएँ—को ‘भीतर आकर’ तथा ‘दबा देती हैं’ से संयुक्त रूप में जोड़ा गया है। ‘वचन’ बाइबलीय पदावली बनाए रखता है, जबकि पादटिप्पणियाँ αἰών और अंतिम एकवचन संदर्भ की वास्तविक अस्पष्टता सुरक्षित रखती हैं।
