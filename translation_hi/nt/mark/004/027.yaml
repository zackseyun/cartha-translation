  text: καὶ καθεύδῃ καὶ ἐγείρηται νύκτα καὶ ἡμέραν, καὶ ὁ σπόρος ⸀βλαστᾷ καὶ μηκύνηται ὡς οὐκ οἶδεν αὐτός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/027.yaml
  text: and he sleeps and rises night and day[a], and the seed sprouts and grows[b], though he himself does not know how.
translation:
  language: hi
  text: और वह रात-दिन सोता और उठता है, और बीज अंकुरित होता और बढ़ता जाता है[a], यद्यपि वह स्वयं नहीं जानता कि यह कैसे होता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बढ़ता जाता है’ का अनुवाद ‘लम्बा होता जाता है’ या ‘ऊँचा होता जाता है’ भी हो सकता है; यूनानी क्रिया विशेष रूप से लम्बाई या कद बढ़ने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: मूल में संक्षिप्त रूप से, ‘जिस प्रकार/कैसे वह स्वयं नहीं जानता’ है; यहाँ आशय है कि वह स्वयं नहीं जानता कि यह कैसे होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθεύδῃ καὶ ἐγείρηται
  choice: सोता और जागता रहता है
  rationale: वर्तमान काल के संभावनार्थक रूप इस दृष्टान्त में बार-बार चलने वाली सामान्य क्रिया बताते हैं। ‘रहता है’ उस निरन्तर क्रम को स्वाभाविक हिन्दी में व्यक्त करता है; ἐγείρηται यहाँ नींद से जागने के अर्थ में है।
- source_word: νύκτα καὶ ἡμέραν
  choice: रात-दिन
  rationale: यह समय के निरन्तर चक्र को बताने वाली अभिव्यक्ति है। ‘रात-दिन’ संक्षिप्त, स्वाभाविक और मूल क्रम के अनुरूप है।
- source_word: ὁ σπόρος
  choice: बीज
  rationale: निश्चित उपपद पहले बोए गए बीज की ओर संकेत करता है। हिन्दी में प्रसंग के कारण अलग से ‘वह बीज’ कहना आवश्यक नहीं है।
- source_word: βλαστᾷ
  choice: अंकुरित होता
  rationale: यह पौधे की वृद्धि के आरम्भ, अर्थात अंकुर निकलने, को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μηκύνηται
  choice: बढ़ता जाता है
  rationale: क्रिया में लम्बा या ऊँचा होने की विशेष छाया है, पर कृषि-सन्दर्भ में ‘बढ़ता जाता है’ अधिक स्वाभाविक है और क्रमिक वृद्धि को बनाए रखता है। विशेष अर्थ-छाया पादटिप्पणी में दी गई है।
- source_word: ὡς οὐκ οἶδεν αὐτός
  choice: कैसे, यह वह स्वयं नहीं जानता
  rationale: मूल यूनानी संरचना संक्षिप्त है और वृद्धि की रीति के विषय में मनुष्य की अनभिज्ञता बताती है। ‘स्वयं’ αὐτός के बल को सुरक्षित रखता है और ‘कैसे’ हिन्दी में आशय स्पष्ट करता है।
theological_decisions:
- issue: दृष्टान्त में बीज की वृद्धि का कर्ता
  choice: वृद्धि की प्रक्रिया को बोने वाले की समझ से परे रखा गया है; इस पद में उसका कर्ता स्पष्ट रूप से नहीं बताया गया।
  alternative: यहाँ स्पष्ट रूप से जोड़ना कि परमेश्वर बीज को बढ़ाता है, अथवा इसे केवल प्राकृतिक प्रक्रिया कहना।
  rationale: मूल पाठ बीज की वृद्धि और मनुष्य की अनभिज्ञता पर बल देता है। अनुवाद न तो दैवी कर्तृत्व को स्पष्ट रूप से जोड़ता है, न उसे नकारकर केवल प्राकृतिक व्याख्या थोपता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रात-दिन’ तथा ‘सोता और जागता रहता है’ दृष्टान्त की लय और निरन्तर समय-क्रम को व्यक्त करते हैं। अर्धविराम और डैश बीज की वृद्धि तथा बोने वाले की अनभिज्ञता के बीच मूल पाठ का निकट सम्बन्ध बनाए रखते हैं।
