base_translation:
  language: en
  yaml_path: translation/nt/mark/004/008.yaml
  text: And other seed fell into the good soil[a], and it was producing fruit, growing up and increasing, and bearing thirtyfold and sixtyfold and a hundredfold.
translation:
  language: hi
  text: और कुछ बीज अच्छी मिट्टी में गिरा, और फल देता हुआ उगता और बढ़ता गया, और उसने तीस गुना, साठ गुना और सौ गुना उपज दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλα
  choice: कुछ बीज
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और संदर्भ में पहले बताए गए बीज की ओर संकेत करता है। स्पष्ट और स्वाभाविक हिन्दी के लिए ‘बीज’ जोड़ा गया है।
- source_word: γῆν τὴν καλήν
  choice: अच्छी मिट्टी
  rationale: खेती और बोआई के इस संदर्भ में γῆ का अर्थ भौगोलिक ‘भूमि’ नहीं, बल्कि उपजाऊ मिट्टी है।
- source_word: ἐδίδου καρπὸν
  choice: फल देने लगा
  rationale: अपूर्ण भूतकाल निरंतर फलोत्पादन की प्रक्रिया दिखाता है। हिन्दी में ‘फल देने लगा’ उस आरंभ और जारी प्रक्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀναβαίνοντα
  choice: उगता
  rationale: कृषि-संदर्भ में यह ऊपर निकलने या उगने को दर्शाता है।
- source_word: αὐξανόμενα
  choice: बढ़ता गया
  rationale: यह निरंतर वृद्धि का भाव रखता है और ‘उगता’ से अलग विकास की अगली अवस्था को व्यक्त करता है।
- source_word: ἔφερεν
  choice: फल दिया
  rationale: क्रिया उपज देने का अर्थ रखती है; अनुपातों के साथ ‘फल दिया’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: किसी ने तीस गुना, किसी ने साठ गुना और किसी ने सौ गुना
  rationale: यूनानी की वितरणात्मक अभिव्यक्ति अलग-अलग बीजों की उपज का अनुपात बताती है। ‘किसी ने… किसी ने…’ इस भेद को स्पष्ट रखता है और ‘गुना’ उपज की वृद्धि दर्शाता है।
