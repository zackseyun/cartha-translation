source:
  edition: SBLGNT
  text: καὶ ὅταν σπαρῇ, ἀναβαίνει καὶ γίνεται ⸂μεῖζον πάντων τῶν λαχάνων⸃ καὶ ποιεῖ κλάδους μεγάλους, ὥστε δύνασθαι ὑπὸ τὴν σκιὰν αὐτοῦ τὰ πετεινὰ τοῦ οὐρανοῦ κατασκηνοῦν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/032.yaml
  text: and when it is sown[a], it comes up and becomes larger than all the garden plants, and it produces large branches[b], so that the birds of the sky are able to nest under its shade.
translation:
  language: hi
  text: और जब वह बोया जाता है, तो उग आता है और बगीचे के सब पौधों से बड़ा हो जाता है। वह बड़ी-बड़ी डालियाँ निकालता है, यहाँ तक कि आकाश के पक्षी[a] उसकी छाया में बसेरा कर सकें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वर्ग के पक्षी’; οὐρανός का अर्थ प्रसंग के अनुसार ‘आकाश’ या ‘स्वर्ग’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘रह सकें’ अथवा ‘ठहर सकें।’ यह कथन किसी विशाल वृक्ष में पक्षियों के आश्रय पाने की पुराने नियम की छवि की प्रतिध्वनि हो सकता है (जैसे यहेजकेल 17:23; दानिय्येल 4:12)।
    reason: cross_reference
lexical_decisions:
- source_word: σπαρῇ
  choice: बोया जाता है
  rationale: ὅταν के साथ यह अनिश्चित कालवाची भाव व्यक्त करता है—‘जब वह बोया जाता है।’ ‘लगाया जाता है’ संभव है, पर ‘बोया’ बीज और बोने की दृष्टांत-संबंधी शब्दावली बनाए रखता है।
- source_word: ἀναβαίνει
  choice: उग आता है
  rationale: खेती के संदर्भ में क्रिया का अर्थ भूमि से ऊपर निकलना है। ‘उग आता है’ आधुनिक हिन्दी में स्वाभाविक है और पौधे के अंकुरित होकर ऊपर आने का भाव देता है।
- source_word: γίνεται
  choice: हो जाता है
  rationale: यह विकास के फलस्वरूप प्राप्त अवस्था को व्यक्त करता है; पौधा अन्य पौधों से बड़ा ‘हो जाता है।’
- source_word: μεῖζον πάντων τῶν λαχάνων
  choice: बगीचे के सब पौधों से बड़ा
  rationale: λάχανα यहाँ बगीचे में उगाए जाने वाले शाकीय पौधों को दर्शाता है, केवल आधुनिक अर्थ के ‘सब्ज़ियों’ को नहीं। तुलनात्मक रचना को ‘सब ... से बड़ा’ के रूप में बनाए रखा गया है।
- source_word: ποιεῖ κλάδους μεγάλους
  choice: बड़ी-बड़ी डालियाँ निकालता है
  rationale: ποιέω और κλάδους का मेल शाखाएँ उत्पन्न करने के अर्थ में है। हिन्दी में ‘डालियाँ निकालता है’ स्वाभाविक है; ‘बनाता है’ अत्यधिक शब्दशः होता।
- source_word: ὥστε δύνασθαι
  choice: यहाँ तक कि ... कर सकें
  rationale: ὥστε के परिणामसूचक बल और δύνασθαι की सामर्थ्य—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ τὴν σκιὰν αὐτοῦ
  choice: उसकी छाया में
  rationale: हिन्दी में आश्रय या ठंडक के लिए ‘छाया में’ कहना ‘छाया के नीचे’ से अधिक स्वाभाविक है, यद्यपि ὑπό का स्थानगत भाव बना रहता है।
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षी
  rationale: यह οὐρανός का सीधा और आधुनिक हिन्दी रूप है तथा शास्त्रीय बिंब को सुरक्षित रखता है।
- source_word: κατασκηνοῦν
  choice: बसेरा कर सकें
  rationale: क्रिया का अर्थ बसना, ठहरना या डेरा डालना हो सकता है। पक्षियों के संदर्भ में ‘बसेरा करना’ स्वाभाविक है और ‘घोंसला बनाना’ की अपेक्षा मूल की व्यापकता को बेहतर बनाए रखता है।
theological_decisions:
- issue: बड़ी डालियों में पक्षियों के आश्रय का पुराना नियम-संबंधी बिंब
  choice: मुख्य पाठ में बिंब को बिना व्याख्या जोड़े सीधे बनाए रखा गया है।
  alternative: ‘निवास कर सकें’ जैसा अधिक शब्दशः रूप लेकर यहेजकेल 17:23 और दानिय्येल 4:12 की संभावित प्रतिध्वनि को और स्पष्ट रखा जा सकता था।
  rationale: यह पद महान वृक्ष में आश्रय पाने वाले पक्षियों की पुराने नियम की राजकीय या राष्ट्र-संबंधी छवियों की प्रतिध्वनि कर सकता है, पर यूनानी पाठ स्वयं उसका अर्थ स्पष्ट नहीं करता। इसलिए मुख्य पाठ संभावित धर्मवैज्ञानिक संकेत का निर्णय पाठक पर छोड़ता है और टिप्पणी केवल पादटिप्पणी में देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बगीचे के पौधे,’ ‘डालियाँ निकालता है’ और ‘बसेरा’ सामान्य पाठक के लिए स्वाभाविक हैं। दो वाक्यों में विभाजन हिन्दी पठनीयता बढ़ाता है, जबकि यूनानी वाक्य का क्रम और परिणाम-संबंध सुरक्षित रहता है।
