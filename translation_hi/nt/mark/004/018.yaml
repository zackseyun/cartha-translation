source:
  edition: SBLGNT
  text: καὶ ⸀ἄλλοι εἰσὶν οἱ εἰς τὰς ἀκάνθας σπειρόμενοι· ⸂οὗτοί εἰσιν⸃ οἱ τὸν λόγον ⸀ἀκούσαντες,
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/018.yaml
  text: And others are those sown among the thorns[a]; these are the ones who have heard the word[b],
translation:
  language: hi
  text: और दूसरे वे हैं जो काँटों के बीच बोए गए हैं[a]; ये वे हैं जिन्होंने वचन[b] सुना है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काँटों में।”
    reason: lexical_alternative
  - marker: b
    text: या, “संदेश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλλοι
  choice: दूसरे
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और पहले बताए गए समूहों से एक अन्य समूह का भेद दिखाता है।
- source_word: εἰς τὰς ἀκάνθας
  choice: काँटों के बीच
  rationale: εἰς का मूल दिशात्मक अर्थ ‘में/के भीतर’ है, पर कृषि-संदर्भ में ‘काँटों के बीच’ स्वाभाविक हिन्दी है और काँटों से भरी भूमि में बीज बोए जाने का भाव रखती है।
- source_word: ἀκάνθας
  choice: काँटों
  rationale: यह सामान्य, ठोस और दृष्टान्त के संदर्भ में सहज हिन्दी अभिव्यक्ति है।
- source_word: σπειρόμενοι
  choice: बोए गए हैं
  rationale: वर्तमान काल के कर्मवाच्य कृदन्त को हिन्दी में स्वाभाविक पहचान-वाक्य के रूप में व्यक्त किया गया है; इससे लोगों की बीज से की गई उपमा बनी रहती है।
- source_word: οὗτοί εἰσιν
  choice: ये वे हैं
  rationale: यह दृष्टान्त की व्याख्या में प्रयुक्त पुनः-पहचान कराने वाली अभिव्यक्ति को स्पष्ट और स्वाभाविक रूप से दर्शाता है।
- source_word: οἱ ... ἀκούσαντες
  choice: जिन्होंने ... सुना है
  rationale: एओरिस्ट कृदन्त आगे होने वाली बात से पहले सुनने की पूर्ण हुई क्रिया बताता है; ‘सुना है’ हिन्दी में इस पूर्ववर्ती क्रिया को सहजता से व्यक्त करता है।
- source_word: τὸν λόγον
  choice: वचन
  rationale: मरकुस के संदर्भ में यह घोषित संदेश को दर्शाता है। ‘वचन’ बाइबलीय प्रतिध्वनि बनाए रखता है, जबकि ‘संदेश’ अर्थगत विकल्प है।
theological_decisions:
- issue: दृष्टान्त की व्याख्या में लोगों की बीज के साथ रूपकात्मक पहचान
  choice: 'शाब्दिक रूपक बनाए रखना: ‘जो काँटों के बीच बोए गए हैं’'
  alternative: जो काँटों वाली भूमि में बोए गए हैं; जो काँटों के बीच लगाए गए हैं
  rationale: यूनानी पाठ लोगों को बीज के रूप में प्रस्तुत करने वाला दृष्टान्तात्मक रूपक स्पष्ट रूप से जारी रखता है। उसे बनाए रखने से यीशु की व्याख्या की साहित्यिक संरचना सुरक्षित रहती है और अनावश्यक व्याख्यात्मक विस्तार नहीं जुड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
