source:
  edition: SBLGNT
  text: καὶ ⸀ἐκεῖνοί εἰσιν οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες, οἵτινες ἀκούουσιν τὸν λόγον καὶ παραδέχονται καὶ καρποφοροῦσιν ⸂ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν⸃ ἑκατόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/020.yaml
  text: 'And those are the ones sown on the good soil: they hear the word and receive it and bear fruit—thirtyfold and sixtyfold and a hundredfold[a].'
translation:
  language: hi
  text: और अच्छी भूमि में बोए गए लोग वे हैं, जो वचन सुनते हैं, उसे स्वीकार करते हैं[a] और फल देते हैं—तीस गुना और साठ गुना और सौ गुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे ग्रहण करते हैं” अथवा “उसका स्वागत करते हैं।”
    reason: παραδέχονται में अनुकूल रूप से ग्रहण करने, स्वीकार करने या स्वागत करने का अर्थ हो सकता है।
lexical_decisions:
- source_word: ἐκεῖνοί
  choice: वे
  rationale: यह संकेतवाचक सर्वनाम दृष्टान्त में बताए गए अंतिम वर्ग की ओर लौटकर संकेत करता है; ‘वे’ पिछले वर्गों से उसका भेद बनाए रखता है।
- source_word: οἱ ἐπὶ τὴν γῆν τὴν καλὴν σπαρέντες
  choice: अच्छे खेत में बोए गए लोग
  rationale: निष्क्रिय कृदन्त और बोने के कृषि-बिम्ब को बनाए रखा गया है। हिन्दी में बीज के सन्दर्भ में ‘खेत में बोए गए’ स्वाभाविक है; ‘लोग’ स्पष्ट करता है कि व्याख्या अब सुनने वालों की है।
- source_word: γῆν τὴν καλὴν
  choice: अच्छा खेत
  rationale: γῆ यहाँ खेती योग्य भूमि/मिट्टी को दर्शाता है। ‘अच्छा खेत’ आधुनिक हिन्दी में सहज है और विभिन्न प्रकार की भूमि के बीच मूल्यांकनात्मक विरोध को सुरक्षित रखता है।
- source_word: οἵτινες
  choice: जो
  rationale: सम्बन्धवाचक रूप इस वर्ग की पहचान बताने वाले गुणों का परिचय देता है; हिन्दी ‘जो’ इस व्याख्यात्मक सम्बन्ध को स्वाभाविक ढंग से रखता है।
- source_word: ἀκούουσιν τὸν λόγον
  choice: वचन सुनते हैं
  rationale: ‘वचन’ मरकुस 4 में बार-बार आने वाले λόγος के शब्दगत और धार्मिक अनुनाद को बनाए रखता है, बिना उसे विस्तार देकर किसी विशेष सिद्धान्त से बाँधे।
- source_word: παραδέχονται
  choice: उसे स्वीकार करते हैं
  rationale: क्रिया अनुकूल ग्रहण या स्वीकृति व्यक्त करती है। ‘उसे’ का संकेत पहले आए ‘वचन’ की ओर है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: καρποφοροῦσιν
  choice: फल लाते हैं
  rationale: यह प्रचलित और सहज हिन्दी कृषि-बिम्ब है, जो उसके आत्मिक संकेत को अनावश्यक रूप से स्पष्ट किए बिना मूल रूपक बनाए रखता है।
- source_word: ἓν τριάκοντα καὶ ἓν ἑξήκοντα καὶ ἓν ἑκατόν
  choice: तीस गुना, साठ गुना और सौ गुना
  rationale: यह उपज की मात्रा दर्शाता है। ‘गुना’ हिन्दी में इस अर्थ को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है; तीनों बढ़ती मात्राएँ अलग-अलग रखी गई हैं।
theological_decisions:
- issue: अच्छी भूमि द्वारा वचन के प्रति प्रतिक्रिया का स्वरूप
  choice: पद को वास्तविक सकारात्मक ग्रहण और उसके फल के वर्णन तक सीमित रखा गया है।
  alternative: इसे अनिवार्य अंतिम स्थिरता का प्रमाण मानना, या केवल आरम्भिक प्रतिक्रिया तक सीमित मानना।
  rationale: यूनानी पाठ केवल सुनने, स्वीकार करने और फल लाने की बात कहता है; अनन्त स्थिरता या बाद में विमुख होने के विषय में किसी सम्प्रदायगत निष्कर्ष को इसमें जोड़ा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘वचन’, ‘बोए गए’ और ‘फल लाते हैं’ दृष्टान्त की शब्दावली और कृषि-बिम्ब को बनाए रखते हैं।
