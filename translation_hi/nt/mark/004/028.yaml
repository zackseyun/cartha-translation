  text: ⸀αὐτομάτη ἡ γῆ καρποφορεῖ, πρῶτον χόρτον, ⸂εἶτα στάχυν, εἶτα⸃ ⸂πλήρης σῖτον⸃ ἐν τῷ στάχυϊ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/028.yaml
  text: 'The soil bears fruit by itself: first the stalk[a], then the head, then the full grain in the head.'
translation:
  language: hi
  text: भूमि अपने-आप उपज देती है—पहले अंकुर, फिर बाली, और फिर बाली में भरा हुआ अनाज।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐτομάτη
  choice: अपने-आप
  rationale: यह भूमि द्वारा बिना दिखाई देने वाली मानवीय क्रिया के उपज देने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘स्वतः’ अधिक औपचारिक और ‘अपने आप ही’ अनावश्यक रूप से बलयुक्त होता।
- source_word: ἡ γῆ
  choice: भूमि
  rationale: कृषि-संदर्भ में यह बोई हुई जमीन को दर्शाता है। ‘भूमि’ dignified और सहज है; ‘मिट्टी’ भी संभव है, पर यहाँ उत्पादक खेत का भाव अपेक्षाकृत संकरा कर सकती है।
- source_word: καρποφορεῖ
  choice: उपज देती है
  rationale: क्रिया का अर्थ फल या फसल उत्पन्न करना है। अनाज की खेती के संदर्भ में ‘उपज देती है’ प्राकृतिक है और ‘फल लाती है’ से अधिक स्पष्ट कृषि-बिंब देता है।
- source_word: πρῶτον χόρτον
  choice: पहले अंकुर
  rationale: χόρτος यहाँ अनाज के पौधे की आरंभिक दिखाई देने वाली हरी बढ़त है। ‘अंकुर’ आधुनिक पाठक के लिए स्पष्ट है; ‘डंठल’ इस प्रारंभिक अवस्था को कुछ अधिक विकसित दिखा सकता है।
- source_word: εἶτα στάχυν
  choice: फिर बाल
  rationale: στάχυς अनाज की बाली या बाल को दर्शाता है। ‘बाल’ कृषि-संदर्भ में संक्षिप्त और मानक है; ‘बाली’ भी स्वाभाविक विकल्प है।
- source_word: πλήρης σῖτον
  choice: भरा हुआ अनाज
  rationale: पाठ में πλήρης को ‘पका’ बनाकर परिपक्वता का अतिरिक्त अर्थ जोड़ने के बजाय अनाज के भर जाने या पूर्ण होने का भाव रखा गया है। हिन्दी में वाक्यांश को स्वाभाविक बनाने के लिए ‘भरा हुआ अनाज’ प्रयोग किया गया है।
- source_word: ἐν τῷ στάχυϊ
  choice: बाल में
  rationale: यह अनाज के स्थान को उसी बाल के भीतर बताता है और στάχυς के पहले अनुवाद से शब्दगत संगति रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कृषि-भाषा। वृद्धि के तीन क्रमिक चरणों और भूमि की मनुष्य से स्वतंत्र दिखाई देने वाली उत्पादकता को बनाए रखा गया है। किसी धार्मिक व्याख्या को पद में नहीं जोड़ा गया।
