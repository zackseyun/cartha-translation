    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ ὅτε ἀνέτειλεν ὁ ἥλιος
  choice: और जब सूरज निकला
  rationale: सरल संयोजक और कालवाचक उपवाक्य को स्वाभाविक हिन्दी में रखा गया है; सूर्य के लिए ἀνατέλλω का सामान्य अर्थ ‘निकलना’ है।
- source_word: ἐκαυματίσθη
  choice: झुलस गया
  rationale: यह निष्क्रिय क्रिया सूर्य की गर्मी से हुई क्षति दर्शाती है; ‘झुलस गया’ उस अर्थ को बिना अतिशयोक्ति के व्यक्त करता है।
- source_word: διὰ τὸ μὴ ἔχειν ῥίζαν
  choice: जड़ न होने के कारण
  rationale: διά के साथ सप्रत्यय क्रियारूप यहाँ स्पष्ट कारण बताता है; एकवचन ῥίζαν के अनुरूप ‘जड़’ रखा गया है।
- source_word: ἐξηράνθη
  choice: मुरझा गया
  rationale: ξηραίνω यहाँ सूखने या मुरझाने की प्रक्रिया और परिणति बता सकता है; कृषि-संदर्भ में ‘मुरझा गया’ सहज है, जबकि ‘सूख गया’ को पादटिप्पणी में वास्तविक विकल्प के रूप में सुरक्षित रखा गया है।
