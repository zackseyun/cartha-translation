  text: Καὶ ἔλεγεν· Οὕτως ἐστὶν ἡ βασιλεία τοῦ θεοῦ ⸀ὡς ἄνθρωπος βάλῃ τὸν σπόρον ἐπὶ τῆς γῆς
base_translation:
  language: en
  yaml_path: translation/nt/mark/004/026.yaml
  text: 'And he was saying[c][b][a], “The kingdom of God is like this: as when a man casts the seed upon the ground,”'
translation:
  language: hi
  text: फिर वह कहता था, “परमेश्वर का राज्य ऐसा है, जैसे कोई मनुष्य भूमि पर बीज डाले[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का राज्य ऐसा है मानो कोई मनुष्य भूमि पर बीज डाले।” यूनानी में तुलना संक्षिप्त है और अगले पद में जारी रहती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ ἔλεγεν
  choice: फिर वह कहता था
  rationale: Καί कथा को आगे बढ़ाता है, इसलिए यहाँ स्वाभाविक हिन्दी में ‘फिर’ उपयुक्त है। अपूर्ण भूतकाल ἔλεγεν चलती या बार-बार होने वाली वाणी का संकेत दे सकता है; ‘कहता था’ इस पक्ष को बनाए रखता है।
- source_word: Οὕτως
  choice: ऐसा
  rationale: यह आगे आने वाली तुलना की रीति प्रस्तुत करता है। ‘ऐसा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह प्रचलित और अर्थपूर्ण अनुवाद है, जिसमें परमेश्वर के शासन और उसके राज्य-क्षेत्र—दोनों की अर्थ-संभावना खुली रहती है।
- source_word: ὡς
  choice: जैसे
  rationale: यह तुलना आरम्भ करता है, जिसका वाक्यगत प्रवाह अगले पद में जारी रहता है। ‘जैसे’ यूनानी की संक्षिप्त, खुली हुई रचना को हिन्दी में बनाए रखता है।
- source_word: ἄνθρωπος
  choice: कोई मनुष्य
  rationale: ἄνθρωπος पुल्लिंग एकवचन का प्रतिनिधि पात्र है। ‘कोई मनुष्य’ अनिश्चितता और स्रोत के मानवीय पात्र, दोनों को व्यक्त करता है।
- source_word: βάλῃ
  choice: डाले
  rationale: βάλλω का मूल बिंब डालने या फेंकने का है। कृषि-संदर्भ में ‘बीज डाले’ स्वाभाविक है और ‘बोए’ की अपेक्षा मूल क्रिया के चित्र को अधिक निकटता से रखता है।
- source_word: τὸν σπόρον
  choice: बीज
  rationale: हिन्दी में द्रव्य या सामूहिक अर्थ में ‘बीज’ बिना निश्चित उपपद के स्वाभाविक है; यूनानी का पद यहाँ सामान्य रूप से बोए जाने वाले बीज को दर्शाता है।
- source_word: ἐπὶ τῆς γῆς
  choice: भूमि पर
  rationale: कृषि-संदर्भ में γῆ का आशय पृथ्वी-जगत नहीं, जमीन या भूमि है; ἐπί का स्थानगत अर्थ ‘पर’ से स्पष्ट होता है।
theological_decisions:
- issue: तुलना का वाक्य अगले पद तक खुला रखना
  choice: ‘ऐसा है, जैसे…’ के साथ तुलना को इस पद में पूरा न करना
  alternative: ‘परमेश्वर का राज्य उस मनुष्य के समान है जो भूमि पर बीज बोता है।’
  rationale: यूनानी Οὕτως…ὡς की तुलना संक्षिप्त है और उसका पूरा वर्णन अगले पद में जारी रहता है। खुले वाक्य-प्रवाह को बनाए रखने से स्रोत की साहित्यिक और अर्थगत तनावपूर्ण रचना अनावश्यक व्याख्या द्वारा पूरी नहीं की जाती।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘कहता था’ कथात्मक अपूर्ण भूतकाल को दर्शाता है; ‘भूमि’ कृषि-संदर्भ में स्पष्ट है। पद के अंत में अल्पविराम जानबूझकर रखा गया है, क्योंकि यीशु का वाक्य अगले पद में जारी रहता है।
