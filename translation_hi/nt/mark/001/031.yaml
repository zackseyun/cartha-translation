base_translation:
  language: en
  yaml_path: translation/nt/mark/001/031.yaml
  text: And coming near[a], he raised her up, taking her by the hand; and the fever left her, and she served them.
translation:
  language: hi
  text: और उसने पास आकर उसका हाथ पकड़कर उसे उठाया; तब बुखार उसे छोड़ गया, और वह उनकी सेवा करती रही।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनकी सेवा करने लगी।” यूनानी अपूर्ण भूतकाल उसकी जारी सेवा का वर्णन कर सकता है; प्रसंग चंगाई के तत्काल परिणाम के रूप में सेवा के आरंभ का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσελθὼν
  choice: पास आकर
  rationale: यह aorist participle मुख्य क्रिया से पहले यीशु के उसके निकट आने को दिखाता है; ‘पास आकर’ स्वाभाविक हिन्दी है और अनावश्यक विवरण नहीं जोड़ता।
- source_word: ἤγειρεν αὐτὴν
  choice: उसे उठाया
  rationale: ἐγείρω यहाँ बिस्तर से उठाने के ठोस कार्य को व्यक्त करता है। ‘उसे उठाया’ सामान्य हिन्दी में स्पष्ट है और क्रिया के ‘उठाने’ वाले बल को बनाए रखता है।
- source_word: κρατήσας τῆς χειρός
  choice: उसका हाथ पकड़कर
  rationale: κρατέω का अर्थ पकड़ना या थामना है; यूनानी संबंधकारक संरचना को हिन्दी में स्वाभाविक रूप से ‘उसका हाथ पकड़कर’ कहा जाता है।
- source_word: ἀφῆκεν αὐτὴν ὁ πυρετός
  choice: बुखार उसे छोड़ गया
  rationale: यह बीमारी के उससे दूर हो जाने को व्यक्त करता है और यूनानी वाक्य में बुखार को कर्ता बनाए रखने वाली अभिव्यक्ति को भी सुरक्षित रखता है।
- source_word: διηκόνει αὐτοῖς
  choice: वह उनकी सेवा करने लगी
  rationale: διακονέω का अपूर्ण भूतकाल चलती हुई सेवा को व्यक्त कर सकता है; चंगाई के तुरंत बाद के संदर्भ में हिन्दी का ‘करने लगी’ आरंभ और आगे जारी क्रिया को स्वाभाविक रूप से बताता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: αὐτοῖς
  choice: उनकी
  rationale: बहुवचन सर्वनाम उपस्थित समूह की ओर संकेत करता है; ‘उनकी सेवा’ हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ἐγείρω में पुनरुत्थान-संबंधी संभावित प्रतिध्वनि
  choice: उसे उठाया
  alternative: उसे सहारा देकर उठाया
  rationale: ‘उठाया’ मरकुस की क्रिया के बल को बनाए रखता है, पर इस चंगाई-वृत्तांत में स्पष्ट रूप से पुनरुत्थान का अर्थ आरोपित नहीं करता।
- issue: διηκόνει के अपूर्ण भूतकाल का पक्ष
  choice: सेवा करने लगी
  alternative: सेवा करती रही / सेवा की
  rationale: संदर्भ तत्काल आरंभ का समर्थन करता है, पर यूनानी अपूर्ण भूतकाल केवल चलती हुई सेवा भी बता सकता है; इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘सेवा’ घरेलू आतिथ्य के प्रसंग में स्वाभाविक है और अनावश्यक रूप से कलीसियाई पद का संकेत नहीं देती।
