translation:
  language: hi
  text: यूहन्ना ऊँट के बालों का बना वस्त्र पहने हुए था और उसकी कमर पर चमड़े का पट्टा बँधा हुआ था[a], और वह टिड्डियाँ और जंगली शहद खाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूहन्ना का पहनावा 2 राजा 1:8 में एलिय्याह के वर्णन की याद दिलाता है और मरकुस में उसके भविष्यद्वक्तीय अग्रदूत के रूप में प्रस्तुतिकरण में योगदान देता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐνδεδυμένος
  choice: वस्त्र पहने रहता था
  rationale: पूर्णकालिक कृदन्त यूहन्ना के वस्त्र पहने होने की अवस्था बताता है। यह प्रयोग उस स्थायी वर्णनात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τρίχας καμήλου
  choice: ऊँट के बालों का वस्त्र
  rationale: यूनानी में शाब्दिक रूप से ‘ऊँट के बाल’ हैं; प्रसंग में यह उन बालों से बने पहनावे को सूचित करता है, न कि ऊँट की खाल को। हिन्दी में ‘वस्त्र’ जोड़ने से आशय स्पष्ट होता है।
- source_word: ζώνην δερματίνην
  choice: चमड़े का पट्टा
  rationale: ζώνη कमर में बाँधे जाने वाले पट्टे या कमरबंद को दर्शाता है और δερματίνην उसकी सामग्री चमड़ा बताता है। ‘पट्टा’ साधारण आधुनिक हिन्दी में सहज है।
- source_word: περὶ τὴν ὀσφὺν αὐτοῦ
  choice: अपनी कमर पर
  rationale: ὀσφύς कमर या कटि-प्रदेश को दर्शाता है। ‘अपनी कमर पर’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἔσθων
  choice: खाता था
  rationale: वर्तमानकालिक कृदन्त यहाँ यूहन्ना के सामान्य या निरंतर आहार का वर्णन करता है; हिन्दी का अपूर्ण भूतकाल ‘खाता था’ इस आदतन भाव को सहजता से व्यक्त करता है।
- source_word: ἀκρίδας
  choice: टिड्डियाँ
  rationale: ἀκρίς का सामान्य और प्रसंगानुकूल अर्थ खाने योग्य टिड्डी कीट है; किसी वनस्पति या रूपक अर्थ का आधार नहीं है।
- source_word: μέλι ἄγριον
  choice: जंगली शहद
  rationale: यह सीधा विशेषणीय पद है, जिसका अर्थ जंगल या वन में पाया जाने वाला शहद है। ‘जंगली शहद’ प्रचलित और संक्षिप्त हिन्दी रूप है।
- source_word: καὶ ἦν
  choice: था
  rationale: καί वर्णन को पिछले प्रसंग से जोड़ता है, पर हिन्दी में आरम्भिक ‘और’ अनिवार्य नहीं है। ἦν का वर्णनात्मक बल ‘था’ और ‘रहता था’ से व्यक्त होता है।
theological_decisions:
- issue: यूहन्ना के पहनावे और एलिय्याह-संबंधी भविष्यद्वक्तीय छवि का संबंध
  choice: मुख्य पाठ में केवल यूहन्ना के पहनावे और आहार का वर्णन रखा गया है।
  alternative: मुख्य पाठ में यूहन्ना को स्पष्ट रूप से एलिय्याह-जैसा या भविष्यद्वक्ता कहना।
  rationale: वर्णन 2 राजा 1:8 में एलिय्याह के रूप की याद दिलाता है, पर मरकुस 1:6 स्वयं यह पहचान स्पष्ट नहीं करता। इसलिए संकेत को पादटिप्पणी में बताया गया है, मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और वर्णनात्मक रूप अपनाया गया है। ‘कटि’, ‘मेखला’ और ‘ऊँट के रोम’ जैसे अधिक संस्कृतनिष्ठ विकल्पों से बचते हुए ‘कमर’, ‘पट्टा’ और ‘बाल’ चुने गए हैं। दोनों कृदन्तों के वर्णनात्मक और आदतन पक्ष को ‘पहने रहता था’, ‘बाँधता था’ और ‘खाता था’ से व्यक्त किया गया है।
