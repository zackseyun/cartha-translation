  - severity: low
    issue: ‘रास्ते सीधे बनाओ’ is less idiomatic than a direct Hindi expression for straightening paths.
    rationale: ‘उसके रास्ते सीधे करो’ naturally conveys ποιεῖτε … εὐθείας while preserving the imperative and road metaphor.
