  text: φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/003.yaml
  text: 'A voice of one crying out in the wilderness: ‘Prepare the way of the Lord[b][a]; make his paths straight,’'
translation:
  language: hi
  text: 'निर्जन प्रदेश में पुकारने वाले की आवाज़: “प्रभु[b] का मार्ग तैयार करो; उसके रास्ते सीधे करो।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यशायाह के उद्धरण में दूसरी विराम-व्यवस्था के अनुसार यह भी हो सकता है: “पुकारने वाले की आवाज़: ‘निर्जन प्रदेश में प्रभु का मार्ग तैयार करो…।’”'
    reason: alternative_reading
  - marker: b
    text: ‘प्रभु’ यूनानी शब्द क्यूरिउ (κυρίου) का अनुवाद है; यह उद्धरण यशायाह 40:3 की प्रतिध्वनि है, जहाँ इब्रानी पाठ में यहोवा (YHWH) का उल्लेख है।
    reason: cross_reference
lexical_decisions:
- source_word: φωνὴ
  choice: आवाज़
  rationale: यहाँ φωνή किसी पुकारने वाले की सुनाई देने वाली वाणी को दर्शाता है; आधुनिक हिन्दी में ‘आवाज़’ स्वाभाविक और स्पष्ट है।
- source_word: βοῶντος
  choice: पुकारने वाले की
  rationale: संबंधवाचक कृदंत φωνή पर निर्भर है। ‘पुकारने वाले की आवाज़’ यूनानी संरचना का अर्थ स्वाभाविक हिन्दी में रखता है और ऊँची, सार्वजनिक घोषणा का भाव देता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: जंगल में
  rationale: ἔρημος निर्जन या वीरान प्रदेश को दर्शा सकता है। ‘जंगल’ मरकुस के वर्णन में यूहन्ना के निर्जन स्थान वाले परिवेश के लिए सामान्य, प्रचलित बाइबलीय हिन्दी है; इसका अर्थ केवल पेड़ों वाला वन नहीं, बल्कि बस्ती से दूर उजाड़ क्षेत्र भी हो सकता है।
- source_word: Ἑτοιμάσατε
  choice: तैयार करो
  rationale: बहुवचन आज्ञार्थक क्रिया निर्णायक तैयारी का आह्वान करती है। ‘तैयार करो’ सीधा और आधुनिक है।
- source_word: τὴν ὁδὸν
  choice: मार्ग
  rationale: ὁδός वास्तविक रास्ते और रूपकात्मक मार्ग—दोनों का बोध करा सकता है। ‘मार्ग’ इस द्विअर्थी भविष्यवाणी-संबंधी प्रतिध्वनि को बनाए रखता है।
- source_word: κυρίου
  choice: प्रभु का
  rationale: κύριος का सामान्य हिन्दी धार्मिक समतुल्य ‘प्रभु’ है। संबंधकारक रूप को ‘प्रभु का मार्ग’ के रूप में निकटता से रखा गया है।
- source_word: εὐθείας
  choice: सीधे
  rationale: यहाँ εὐθύς मार्गों के टेढ़ेपन के विपरीत ‘सीधा’ बताता है, न कि नैतिक ईमानदारी।
- source_word: ποιεῖτε
  choice: बनाओ
  rationale: वर्तमान बहुवचन आज्ञार्थक को हिन्दी में स्वाभाविक आज्ञा ‘बनाओ’ से व्यक्त किया गया है।
- source_word: τὰς τρίβους αὐτοῦ
  choice: उसके रास्ते
  rationale: τρίβος पगडंडी या रास्ते को दर्शाता है और बहुवचन है। ‘उसके रास्ते’ अर्थ और संख्या दोनों को सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: यशायाह के उस उद्धरण में κύριος का अनुवाद जहाँ इब्रानी पाठ YHWH को सूचित करता है
  choice: प्रभु
  alternative: यहोवा / याहवे
  rationale: मुख्य पाठ यूनानी κύριος का अनुवाद करता है, इसलिए ‘प्रभु’ रखा गया है। यशायाह 40:3 में इसकी YHWH-संबंधी पृष्ठभूमि को पादटिप्पणी में स्पष्ट किया गया है, ताकि उसे यूनानी मुख्य पाठ में आरोपित न किया जाए।
- issue: ‘जंगल में’ का वाक्यगत संबंध
  choice: '‘पुकारने वाले’ के साथ: ‘जंगल में पुकारने वाले की आवाज़’'
  alternative: 'आज्ञा के साथ: ‘जंगल में प्रभु का मार्ग तैयार करो’'
  rationale: मरकुस के यूनानी शब्दक्रम और निकटतम वाक्य-संबंध के अनुसार इसे पुकारने वाले से जोड़ना सबसे स्वाभाविक है। यशायाह के उद्धरण की दूसरी विराम-व्यवस्था संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मार्ग’ भविष्यवाणी के रूपकात्मक आयाम को बनाए रखता है, जबकि ‘रास्ते’ बहुवचन चित्र को सहज हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
