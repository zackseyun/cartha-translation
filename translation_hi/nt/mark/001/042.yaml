  text: And immediately the leprosy left him[a], and he was cleansed.
translation:
  language: hi
  text: और तुरन्त उसका कोढ़ दूर हो गया, और वह शुद्ध हो गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे शुद्ध कर दिया गया।” यहाँ प्रयुक्त क्रिया शारीरिक रोग-मुक्ति के साथ-साथ अशुद्धता से शुद्ध होने का भाव भी रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की शैली में घटना की तात्कालिकता और तीव्र गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: उसका ... दूर हो गया
  rationale: यूनानी पदबंध का शाब्दिक भाव ‘उससे चला गया’ है। रोग को कर्ता बनाते हुए ‘उसका कोढ़ दूर हो गया’ हिन्दी में स्वाभाविक है और रोग के उससे अलग हो जाने का अर्थ बनाए रखता है।
- source_word: λέπρα
  choice: कोढ़
  rationale: यह बाइबलीय परंपरा में प्रचलित और संक्षिप्त हिन्दी शब्द है। मूल शब्द त्वचा के उन रोगों के लिए भी प्रयुक्त हो सकता है जो आधुनिक हैन्सन रोग तक सीमित नहीं हैं; इसलिए अनुवाद किसी अधिक विशिष्ट चिकित्सकीय निदान का दावा नहीं करता।
- source_word: ἐκαθαρίσθη
  choice: वह शुद्ध हो गया
  rationale: καθαρίζω का निष्क्रिय रूप यहाँ शारीरिक रोग-मुक्ति और अशुद्धता से शुद्ध होने—दोनों भावों को समेटता है। ‘शुद्ध हो गया’ आधुनिक हिन्दी में स्वाभाविक है और केवल ‘चंगा हो गया’ कहने की अपेक्षा इस दोहरे अर्थ को बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: ἐκαθαρίσθη में शारीरिक आरोग्य और धार्मिक शुद्धता का संबंध
  choice: वह शुद्ध हो गया
  alternative: वह चंगा हो गया / उसे शुद्ध कर दिया गया
  rationale: संदर्भ में रोग का दूर होना ही नहीं, उससे जुड़ी अशुद्धता का हटना भी निहित है। ‘शुद्ध’ इस धार्मिक-सामाजिक आयाम को बनाए रखता है, जबकि ‘चंगा’ अर्थ को केवल आरोग्य तक सीमित कर सकता है। हिन्दी में स्वाभाविकता के लिए ‘हो गया’ रखा गया है; पादटिप्पणी मूल के निष्क्रिय रूप को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य में मरकुस की तात्कालिकता बनी रहती है और ‘शुद्ध’ शब्द रोग-मुक्ति तथा धार्मिक शुद्धता के बीच मूल पाठ की अर्थ-परतों को सुरक्षित रखता है।
