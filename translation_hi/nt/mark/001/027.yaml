source:
  edition: SBLGNT
  text: καὶ ἐθαμβήθησαν ⸀ἅπαντες, ὥστε συζητεῖν ⸂πρὸς ἑαυτοὺς⸃ λέγοντας· Τί ἐστιν τοῦτο; ⸂διδαχὴ καινή⸃· κατ’ ἐξουσίαν καὶ τοῖς πνεύμασι τοῖς ἀκαθάρτοις ἐπιτάσσει, καὶ ὑπακούουσιν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/027.yaml
  text: And they were all amazed[a], so that they discussed among themselves, saying, “What is this? A new teaching with authority! He even commands the unclean spirits, and they obey him.”
translation:
  language: hi
  text: और वे सब इतने चकित हुए कि आपस में चर्चा करते हुए कहने लगे, “यह क्या है? अधिकार के साथ एक नई शिक्षा![a] वह अशुद्ध आत्माओं को भी आज्ञा देता है, और वे उसकी आज्ञा मानती हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह क्या है? अधिकार के साथ यह कैसी नई शिक्षा है?” यूनानी पाठ में विराम-चिह्न इस प्रकार भी लगाए जा सकते हैं कि “नई शिक्षा” सीधे प्रश्न का भाग हो।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐθαμβήθησαν
  choice: चकित रह गए
  rationale: यह कर्मवाच्य रूप अचानक और गहरे विस्मय से प्रभावित होने का भाव देता है; ‘चकित रह गए’ स्वाभाविक आधुनिक हिन्दी में वही प्रतिक्रिया व्यक्त करता है।
- source_word: ἅπαντες
  choice: वे सब
  rationale: यह उपस्थित लोगों की समग्र प्रतिक्रिया पर बल देता है।
- source_word: ὥστε συζητεῖν πρὸς ἑαυτούς
  choice: और आपस में चर्चा करते हुए कहने लगे
  rationale: ὥστε परिणाम सूचित करता है और συζητεῖν परस्पर विचार-विमर्श को; हिन्दी में यह रचना विस्मय से उपजी सामूहिक चर्चा को स्वाभाविक ढंग से व्यक्त करती है, बिना उसे विवाद का रूप दिए।
- source_word: Τί ἐστιν τοῦτο;
  choice: यह क्या है?
  rationale: यह मूल के संक्षिप्त और विस्मयपूर्ण प्रश्न को सीधे बनाए रखता है।
- source_word: διδαχὴ καινή
  choice: एक नई शिक्षा
  rationale: ‘शिक्षा’ यहाँ διδαχή का सहज, गैर-तकनीकी हिन्दी समतुल्य है; ‘नई’ उसकी नवीनता सुरक्षित रखता है।
- source_word: κατ’ ἐξουσίαν
  choice: अधिकार के साथ
  rationale: यह यीशु की शिक्षा और कार्य में प्रकट अधिकार को व्यक्त करता है और वाक्यगत संबंध की कुछ लचक भी बनाए रखता है।
- source_word: τοῖς πνεύμασι τοῖς ἀκαθάρτοις
  choice: अशुद्ध आत्माओं को
  rationale: ‘अशुद्ध’ ἀκάθαρτος के धार्मिक और नैतिक अर्थ-क्षेत्र को ‘बुरी’ जैसे अधिक व्याख्यात्मक विकल्प से बेहतर सुरक्षित रखता है।
- source_word: ἐπιτάσσει
  choice: आज्ञा देता है
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने को दर्शाती है और प्रसंग के ‘अधिकार’ विषय से मेल खाती है।
- source_word: ὑπακούουσιν αὐτῷ
  choice: वे उसकी आज्ञा मानती हैं
  rationale: यह आदेश के प्रति वास्तविक आज्ञापालन का स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘अधिकार के साथ’ का वाक्यगत संबंध
  choice: इसे विस्मयादिबोधक खंड ‘अधिकार के साथ एक नई शिक्षा!’ में रखा गया है, जबकि अगला वाक्य उस अधिकार को अशुद्ध आत्माओं पर उसकी आज्ञा में भी दिखाता है।
  alternative: 'पूरे अंश को प्रश्न बनाया जा सकता है: ‘यह क्या है? अधिकार के साथ यह कैसी नई शिक्षा है?’ अथवा ‘अधिकार के साथ’ को मुख्यतः ‘आज्ञा देता है’ से जोड़ा जा सकता है।'
  rationale: यूनानी शब्दक्रम और विराम-चिह्न एक से अधिक संबंधों की अनुमति देते हैं। चुना हुआ पाठ शिक्षा के नएपन और अधिकार दोनों को सामने रखता है, पर अधिकार को केवल शिक्षा या केवल आत्माओं को दी गई आज्ञा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक दृश्य के अनुरूप रखी गई है। ‘अशुद्ध आत्माएँ’ बाइबिलीय अर्थ को सुरक्षित रखता है, और स्त्रीलिंग सर्वनाम/क्रिया ‘आत्माओं’ के हिन्दी व्याकरण के अनुसार हैं।
