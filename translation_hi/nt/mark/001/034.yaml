  text: καὶ ἐθεράπευσεν πολλοὺς κακῶς ἔχοντας ποικίλαις νόσοις, καὶ δαιμόνια πολλὰ ἐξέβαλεν, καὶ οὐκ ἤφιεν λαλεῖν τὰ δαιμόνια, ὅτι ᾔδεισαν ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/034.yaml
  text: And he healed many who were sick with various diseases[a], and he cast out many demons, and he would not allow the demons to speak, because they knew him.
translation:
  language: hi
  text: और उसने बहुत-से लोगों को, जो तरह-तरह की बीमारियों से पीड़ित थे, चंगा किया और बहुत-सी दुष्टात्माओं को निकाला। वह दुष्टात्माओं को बोलने नहीं देता था, क्योंकि वे उसे जानती थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे जानती थीं कि वह कौन है।” यूनानी में केवल “वे उसे जानती थीं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: θεραπεύω यहाँ रोग से स्वस्थ करने को व्यक्त करता है; ‘चंगा किया’ स्वाभाविक, गरिमापूर्ण और बाइबिलीय प्रसंग में परिचित हिंदी है।
- source_word: πολλοὺς κακῶς ἔχοντας
  choice: बहुत-से लोगों को, जो ... पीड़ित थे
  rationale: κακῶς ἔχω बीमारी की अवस्था के लिए एक यूनानी मुहावरा है; हिंदी में ‘पीड़ित थे’ इसे सहज ढंग से व्यक्त करता है।
- source_word: ποικίλαις νόσοις
  choice: तरह-तरह की बीमारियों से
  rationale: ποικίλος विविधता और νόσος बीमारी को दर्शाता है; यह रूप मूल अर्थ और स्वाभाविक हिंदी दोनों को बनाए रखता है।
- source_word: δαιμόνια πολλὰ ἐξέβαλεν
  choice: बहुत-से दुष्टात्माओं को निकाला
  rationale: ἐκβάλλω बलपूर्वक बाहर निकालने का भाव रखता है; झाड़-फूँक जैसे सांस्कृतिक रूप से संकुचित शब्दों से बचे बिना ‘निकाला’ स्पष्ट और स्वाभाविक है।
- source_word: οὐκ ἤφιεν
  choice: नहीं देता था
  rationale: अपूर्ण भूतकाल ἤφιεν दृश्य में जारी या बार-बार रोके जाने की क्रिया दर्शाता है; ‘नहीं देता था’ इस पक्ष को सहज हिंदी में सुरक्षित रखता है।
- source_word: λαλεῖν
  choice: बोलने
  rationale: λαλέω का सामान्य अर्थ बोलना है; ‘बोलने’ प्रसंग के लिए सीधा और उपयुक्त है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ ὅτι सबसे स्वाभाविक रूप से यीशु द्वारा दुष्टात्माओं को चुप रखने का कारण बताता है।
- source_word: ᾔδεισαν αὐτόν
  choice: वे उसे जानते थे
  rationale: यूनानी में सीधा कर्म केवल αὐτόν, ‘उसे’, है; यह अनुवाद मूल की संक्षिप्तता और निहित पहचान-संबंधी अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: क्या दुष्टात्माओं के ज्ञान को स्पष्ट मसीही पहचान-कथन के रूप में विस्तार दिया जाए
  choice: वे उसे जानते थे
  alternative: वे जानते थे कि वह कौन है
  rationale: मूल पाठ केवल यह कहता है कि वे ‘उसे जानते थे’; निकटवर्ती प्रसंग से ‘मसीह’ या ‘परमेश्वर का पुत्र’ जोड़ना इस पद की बात से आगे जाना होगा। संक्षिप्त रूप वास्तविक धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; साधारण पाठकों के लिए सहज, किंतु कथात्मक गरिमा बनाए रखी गई है। ‘दुष्टात्मा’ को δαιμόνιον के लिए स्पष्ट और प्रचलित धार्मिक शब्द के रूप में चुना गया है।
