  text: καὶ ⸀εὐθὺς ἐκάλεσεν αὐτούς. καὶ ἀφέντες τὸν πατέρα αὐτῶν Ζεβεδαῖον ἐν τῷ πλοίῳ μετὰ τῶν μισθωτῶν ἀπῆλθον ὀπίσω αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/020.yaml
  text: And immediately he called them[a], and leaving their father Zebedee in the boat with the hired workers, they went after him.
translation:
  language: hi
  text: और उसने तुरंत उन्हें बुलाया। और वे अपने पिता जब्दी को मज़दूरों के साथ नाव में छोड़कर उसके पीछे चल दिए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके पीछे हो लिए” अथवा “उसका अनुसरण करने लगे।” यूनानी वाक्यांश किसी के पीछे जाने और उसका शिष्य बनकर अनुसरण करने—दोनों भाव रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरंत
  rationale: यह मरकुस की विशेष तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐκάλεσεν
  choice: बुलाया
  rationale: यह καλέω का सीधा अर्थ है और न तो ‘आदेश देकर बुलाया’ जितना कठोर है, न ‘निमंत्रण दिया’ जितना कोमल।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: यह मुख्य क्रिया से पहले हुई सहगामी क्रिया को सहज हिन्दी में व्यक्त करता है और अनावश्यक रूप से ‘त्यागकर’ जैसा कठोर भाव नहीं जोड़ता।
- source_word: Ζεβεδαῖον
  choice: जब्दी
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप है।
- source_word: πλοίῳ
  choice: नाव
  rationale: गलील के मछली पकड़ने के प्रसंग में ‘नाव’ स्वाभाविक और उपयुक्त है।
- source_word: μισθωτῶν
  choice: मज़दूरों
  rationale: संदर्भ स्पष्ट करता है कि ये वे लोग थे जो मज़दूरी पर काम करते थे; संक्षिप्त हिन्दी शब्द मूल का आशय स्वाभाविक रूप से देता है।
- source_word: ἀπῆλθον ὀπίσω αὐτοῦ
  choice: उसके पीछे चल दिए
  rationale: यह वहाँ से प्रस्थान करने की क्रिया और यीशु के पीछे जाने—दोनों को व्यक्त करता है, साथ ही शिष्यत्व का निहित भाव खुला रखता है।
theological_decisions:
- issue: ὀπίσω αὐτοῦ में शिष्यत्व का भाव
  choice: उसके पीछे चल दिए
  alternative: उसका अनुसरण करने लगे
  rationale: यूनानी वाक्यांश वास्तविक रूप से पीछे जाने और शिष्य बनकर अनुसरण करने, दोनों अर्थ-संभावनाएँ रखता है। चुना गया रूप किसी एक भाव को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दो समन्वित वाक्य-रचना को दोनों स्थानों पर ‘और’ से बनाए रखा गया है; शिष्यत्व की अर्थ-संभावना को स्पष्ट व्याख्या बनाकर मुख्य पाठ में नहीं जोड़ा गया।
