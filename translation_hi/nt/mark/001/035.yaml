  source_fidelity: The draft accurately retains the emphatic early timing (πρωῒ ... λίαν with ἔννυχα), the sequential actions of rising, going out, and going away (ἀναστὰς, ἐξῆλθεν, ἀπῆλθεν), the location’s deserted character (εἰς ἔρημον τόπον), and the durative sense of προσηύχετο. However, “भोर को” can suggest that dawn had already arrived, which sits less naturally with “जब अभी अँधेरा ही था.”
  naturalness: “भोर को बहुत तड़के” is somewhat redundant and creates a slight temporal tension with the continuing darkness. “बहुत तड़के, जब अभी अँधेरा था” is more idiomatic modern Hindi and conveys all three Greek temporal elements without that tension. The remaining phrasing is clear and suitably dignified.
  terminology: “प्रार्थना कर रहा था” appropriately represents the imperfect and is the standard Hindi expression. “सुनसान जगह” naturally communicates the relevant sense of ἔρημος; the footnote properly preserves “निर्जन” and “उजाड़” as alternatives.
