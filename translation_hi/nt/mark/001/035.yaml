  text: Καὶ πρωῒ ἔννυχα λίαν ἀναστὰς ἐξῆλθεν καὶ ἀπῆλθεν εἰς ἔρημον τόπον κἀκεῖ προσηύχετο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/035.yaml
  text: And very early[a], while it was still dark, he got up, went out, and went away to a desolate place, and there he was praying.
translation:
  language: hi
  text: और बहुत तड़के, जब अभी अँधेरा था, वह उठा, बाहर निकला और एक सुनसान जगह[a] चला गया; वहाँ वह प्रार्थना कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्जन जगह” अथवा “उजाड़ जगह।” यूनानी शब्द किसी लोगों से खाली, सुनसान या जंगल-जैसे स्थान का वर्णन कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρωῒ … λίαν
  choice: भोर को बहुत तड़के
  rationale: πρωῒ के प्रातःकालीन समय और λίαν की तीव्रता, दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔννυχα
  choice: जब अभी अँधेरा ही था
  rationale: यह दुर्लभ क्रियाविशेषण बताता है कि रात का अँधेरा अभी बना हुआ था; हिन्दी में यह स्पष्ट और सहज अभिव्यक्ति है।
- source_word: ἀναστὰς
  choice: वह उठा
  rationale: पूर्वकालिक सहभागी क्रिया को मुख्य घटनाओं से पहले हुई सहज क्रमिक क्रिया के रूप में प्रस्तुत करता है।
- source_word: ἐξῆλθεν
  choice: बाहर निकला
  rationale: वर्तमान स्थान से बाहर आने की ठोस गति को बनाए रखता है और अगली क्रिया ἀπῆλθεν से उसका भेद स्पष्ट करता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: वहाँ से दूर दूसरे स्थान की ओर जाने का भाव व्यक्त करता है और मरकुस की दो-चरणीय गति को नहीं मिलाता।
- source_word: εἰς ἔρημον τόπον
  choice: एक सुनसान जगह
  rationale: ἔρημος के निर्जन, उजाड़ अथवा लोगों से खाली स्थान के अर्थ को सामान्य आधुनिक हिन्दी में व्यक्त करता है, बिना किसी निश्चित भौगोलिक जंगल का संकेत अनिवार्य किए।
- source_word: κἀκεῖ
  choice: वहाँ
  rationale: καὶ ἐκεῖ का स्थानसूचक अर्थ संक्षेप और स्वाभाविक रूप से देता है; वाक्य-संबंध अर्धविराम से स्पष्ट है।
- source_word: προσηύχετο
  choice: वह प्रार्थना कर रहा था
  rationale: अपूर्ण भूतकाल की जारी अथवा कालावधि वाली क्रिया को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की प्रार्थना पर कथात्मक बल
  choice: यीशु के एक सुनसान स्थान पर जाकर प्रार्थना करते रहने की घटना को सीधे कथन के रूप में रखा गया है।
  alternative: इसे शिष्यत्व के आदर्श या मसीह-विज्ञान संबंधी किसी विशेष निष्कर्ष के रूप में विस्तार देना।
  rationale: यूनानी पाठ घटना का वर्णन करता है, पर उसके धार्मिक निहितार्थों की व्याख्या इस पद में स्वयं नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “भोर को बहुत तड़के” और “जब अभी अँधेरा ही था” समय-संबंधी संयुक्त बल को बनाए रखते हैं। “बाहर निकला और … चला गया” मूल की दोनों गति-सूचक क्रियाओं को अलग रखता है।
