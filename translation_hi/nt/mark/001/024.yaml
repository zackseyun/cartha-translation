base_translation:
  language: en
  yaml_path: translation/nt/mark/001/024.yaml
  text: saying[a], “What have you to do with us[b], Jesus the Nazarene? Have you come to destroy us? I know who you are—the Holy One of God.”
translation:
  language: hi
  text: वह बोला, “यीशु नासरी, हमारा तुमसे क्या लेना-देना है?[a] क्या तुम हमें नष्ट करने आए हो? मैं जानता हूँ कि तुम कौन हो—परमेश्वर का पवित्र जन।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम दोनों का एक-दूसरे से क्या संबंध?” यह यूनानी मुहावरा अलगाव या विरोध का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का पवित्र व्यक्ति।” यूनानी में यह व्यक्ति के लिए प्रयुक्त एक पदवी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: वह कहने लगा
  rationale: वर्तमान कृदंत को प्रसंगानुकूल ढंग से मुख्य कथन से जोड़ता है और हिन्दी में स्वाभाविक कथात्मक प्रवाह देता है।
- source_word: Τί ἡμῖν καὶ σοί
  choice: हमारा तुमसे क्या लेना-देना है?
  rationale: यह सामी प्रभाव वाला यूनानी मुहावरा दूरी, असंबंध या विरोध व्यक्त करता है। प्रचलित हिन्दी मुहावरा उसके टकरावपूर्ण भाव को बनाए रखता है।
- source_word: Ἰησοῦ Ναζαρηνέ
  choice: हे नासरी यीशु
  rationale: सम्बोधन रूप और Ναζαρηνός के विशेषणात्मक स्वरूप को सुरक्षित रखता है; ‘नासरत के यीशु’ अर्थगत विकल्प है।
- source_word: ἦλθες ἀπολέσαι ἡμᾶς
  choice: क्या तुम हमें नष्ट करने आए हो?
  rationale: आगमन के वर्तमान परिणाम और ἀπόλλυμι के विनाशकारी अर्थ को सहज हिन्दी में सीधे व्यक्त करता है; प्रथम पुरुष बहुवचन ‘हमें’ सुरक्षित है।
- source_word: οἶδά σε τίς εἶ
  choice: मैं जानता हूँ कि तुम कौन हो
  rationale: पहचान की स्पष्ट घोषणा का स्वाभाविक और निकट हिन्दी रूप।
- source_word: ὁ ἅγιος τοῦ θεοῦ
  choice: परमेश्वर के पवित्र जन
  rationale: निश्चित पदवी और τοῦ θεοῦ के संबंध को सुरक्षित रखता है। ‘जन’ हिन्दी में व्यक्ति-सूचक पदवी को स्पष्ट करता है, बिना उसे किसी अधिक विस्तृत मसीही सिद्धान्त में बदलने के।
theological_decisions:
- issue: दुष्टात्मा द्वारा मसीह की पहचान की पदवी
  choice: परमेश्वर के पवित्र जन
  alternative: परमेश्वर का पवित्र जन; परमेश्वर का पवित्र
  rationale: इसे पहचान-सूचक पदवी के रूप में रखा गया है, पर यूनानी से आगे बढ़कर कोई विस्तृत धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। सम्बोधन के लिए ‘हे’ औपचारिकता और यूनानी vocative को स्पष्ट करता है। मुहावरे का शाब्दिक अनुवाद न करके उसके विरोधपूर्ण अर्थ को प्रचलित हिन्दी में व्यक्त किया गया है।
