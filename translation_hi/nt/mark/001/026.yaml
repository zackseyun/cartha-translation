  text: καὶ σπαράξαν αὐτὸν τὸ πνεῦμα τὸ ἀκάθαρτον καὶ ⸀φωνῆσαν φωνῇ μεγάλῃ ἐξῆλθεν ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/026.yaml
  text: And the unclean spirit[a], after convulsing him and crying out with a loud voice[b], came out of him.
translation:
  language: hi
  text: और अशुद्ध आत्मा उसे ऐंठन में डालकर और ऊँची आवाज़ में चिल्लाकर उसमें से निकल गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπαράξαν αὐτόν
  choice: उस मनुष्य को मरोड़कर
  rationale: क्रिया तीव्र ऐंठन या मरोड़े जाने को व्यक्त करती है। कृदन्त को मुख्य क्रिया से पहले की सहायक क्रिया के रूप में रखना यूनानी घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है; αὐτόν को स्पष्टता के लिए ‘उस मनुष्य को’ कहा गया है।
- source_word: τὸ πνεῦμα τὸ ἀκάθαρτον
  choice: अशुद्ध आत्मा
  rationale: यह मरकुस में दुष्ट आत्मिक सत्ता के लिए प्रचलित पद है। ‘अशुद्ध’ ἀκάθαρτος के धार्मिक और नैतिक दोनों संकेतों को बनाए रखता है।
- source_word: φωνῆσαν
  choice: चिल्लाकर
  rationale: यह ऊँची और तीव्र ध्वनि निकालने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना किसी अतिरिक्त भावना को आरोपित किए।
- source_word: φωνῇ μεγάλῃ
  choice: ऊँची आवाज़ में
  rationale: यह रीति सूचक दत्तिवाचक पद का स्वाभाविक अनुवाद है और यूनानी के ‘बड़ी/ऊँची आवाज़’ वाले ठोस बिंब को बनाए रखता है।
- source_word: ἐξῆλθεν ἐξ αὐτοῦ
  choice: उसमें से निकल गई
  rationale: यह आत्मा के उस पुरुष को छोड़ने का स्थानगत और व्यक्तिगत अर्थ सीधे व्यक्त करता है। ‘गई’ का स्त्रीलिंग ‘आत्मा’ के हिन्दी व्याकरण के अनुरूप है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: आरम्भिक ‘और’ मरकुस की सतत कथात्मक शैली को बनाए रखता है; दूसरा संयोजक दोनों कृदन्तीय क्रियाओं को जोड़ता है।
theological_decisions:
- issue: अधिकार करने वाली सत्ता का स्वरूप
  choice: ‘अशुद्ध आत्मा’ को व्यक्तिगत कर्ता के रूप में रखा गया है
  alternative: इसे कोई अवैयक्तिक बुरी शक्ति समझना
  rationale: वाक्य में वही मनुष्य को मरोड़ती, चिल्लाती और उसमें से निकलती है। अनुवाद इस व्यक्तिगत कर्तृत्व को सुरक्षित रखता है, पर पाठ से आगे कोई धर्मसैद्धान्तिक विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मरोड़कर’ सामान्य पाठक के लिए स्पष्ट है और तीव्र शारीरिक ऐंठन का भाव देता है। वाक्य में आत्मा को कर्ता बनाए रखने हेतु ‘अशुद्ध आत्मा’ के बाद अल्पविराम नहीं लगाया गया है।
