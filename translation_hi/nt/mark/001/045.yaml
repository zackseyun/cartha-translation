reference: Mark 1:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἐξελθὼν ἤρξατο κηρύσσειν πολλὰ καὶ διαφημίζειν τὸν λόγον, ὥστε μηκέτι αὐτὸν δύνασθαι φανερῶς εἰς πόλιν εἰσελθεῖν, ἀλλὰ ἔξω ⸀ἐπ’ ἐρήμοις τόποις ἦν· καὶ ἤρχοντο πρὸς αὐτὸν ⸀πάντοθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/045.yaml
  text: But after he went out, he began to proclaim widely and to spread the message, so that Jesus could no longer enter a town openly, but stayed outside in deserted places; and people were coming to him from everywhere.
translation:
  language: hi
  text: पर वह निकलकर बहुत प्रचार करने और संदेश को चारों ओर फैलाने लगा। परिणाम यह हुआ कि यीशु फिर किसी नगर में खुले तौर पर प्रवेश नहीं कर सकते थे, बल्कि बाहर सुनसान जगहों में रहते थे; और लोग हर ओर से उनके पास आते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κηρύσσειν πολλὰ
  choice: इस बात का बहुत प्रचार करने
  rationale: κηρύσσειν को ‘प्रचार करना’ और adverbial πολλὰ को प्रचार की व्यापकता/बहुलता के रूप में ‘बहुत’ दिया गया है। संदर्भ से विषय चंगाई की घटना और उससे जुड़ी खबर है।
- source_word: διαφημίζειν τὸν λόγον
  choice: इसे चारों ओर फैलाने
  rationale: διαφημίζειν में व्यापक प्रसार का भाव है; τὸν λόγον यहाँ कही जाने वाली बात/खबर को सूचित करता है, जिसे हिंदी में सर्वनाम से स्वाभाविक रूप से जोड़ा गया है।
- source_word: φανερῶς
  choice: खुले तौर पर
  rationale: क्रिया-विशेषण का सार्वजनिक और प्रत्यक्ष रूप से प्रवेश करने का भाव सुरक्षित रखा गया है।
- source_word: ἐπ’ ἐρήμοις τόποις
  choice: सुनसान जगहों में
  rationale: ἐρήμοις का अर्थ यहाँ निर्जन या आबादी से दूर स्थान है; ‘सुनसान’ साधारण आधुनिक हिंदी में स्वाभाविक है।
- source_word: πάντοθεν
  choice: हर ओर से
  rationale: सभी दिशाओं/स्थानों से आने का व्यापक अर्थ संक्षेप में व्यक्त होता है।
theological_decisions:
- issue: αὐτόν के स्पष्ट संदर्भ की पहचान
  choice: यीशु
  alternative: वह/उन्हें
  rationale: यूनानी सर्वनाम का संदर्भ यीशु है; हिंदी में पूर्ववर्ती पुरुष के कारण संभावित अस्पष्टता से बचने हेतु नाम स्पष्ट किया गया है, बिना अर्थ में वृद्धि किए।
- issue: ἦν का संदर्भानुकूल अनुवाद
  choice: रहते थे
  alternative: थे
  rationale: स्थान-सूचक वाक्य में अपूर्णकालीन ἦν निरंतर बाहर रहने का भाव देता है; ‘रहते थे’ इसे स्वाभाविक हिंदी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। वाक्य की कारण-परिणाम संरचना तथा यूनानी अपूर्णकाल की चलती हुई गतिविधियाँ सुरक्षित रखी गई हैं।
