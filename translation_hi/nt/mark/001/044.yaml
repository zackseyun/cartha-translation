id: MRK.1.44
reference: Mark 1:44
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ· Ὅρα μηδενὶ μηδὲν εἴπῃς, ἀλλὰ ὕπαγε σεαυτὸν δεῖξον τῷ ἱερεῖ καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου ἃ προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/044.yaml
  text: And he says to him[a], “See that you say nothing to anyone; rather, go, show yourself to the priest, and offer for your cleansing what Moses commanded, as a testimony to them.”
translation:
  language: hi
  text: और उसने उससे कहा, “ध्यान रखना, किसी से कुछ न कहना; बल्कि जाकर अपने आपको याजक को दिखाओ और अपनी शुद्धि के लिए वे भेंटें चढ़ाओ जो मूसा ने ठहराई हैं, उनके लिए गवाही के रूप में।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके लिए गवाही के तौर पर।” यह वाक्यांश याजकों या अन्य लोगों के लिए प्रस्तुत प्रमाण का अर्थ दे सकता है; कुछ लोग इसे अधिक तीखे अर्थ में “उनके विरुद्ध गवाही” समझते हैं।
    reason: ‘εἰς μαρτύριον αὐτοῖς’ के संदर्भ तथा उसके सकारात्मक या विरोधात्मक अर्थ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: Ὅρα
  choice: ध्यान रखना
  rationale: यह दृष्टि का साधारण आदेश नहीं, बल्कि आगे आने वाले निषेध पर सावधान करने वाला आदेश है। ‘ध्यान रखना’ आधुनिक हिन्दी में इसकी चेतावनी और आग्रह दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μηδενὶ μηδὲν εἴπῃς
  choice: किसी से कुछ न कहना
  rationale: दोनों नकारात्मक सर्वनाम निषेध को व्यापक बनाते हैं—न किसी व्यक्ति से और न कोई बात। हिन्दी में यह विन्यास संक्षिप्त और स्वाभाविक है।
- source_word: ἀλλὰ ὕπαγε
  choice: बल्कि जाकर
  rationale: ἀλλά निषिद्ध कार्य और अपेक्षित कार्य के बीच सुधारात्मक विरोध दिखाता है; ‘बल्कि’ इसे स्पष्ट रखता है, और ὕπαγε का सीधा अर्थ ‘जाना’ है।
- source_word: σεαυτὸν δεῖξον τῷ ἱερεῖ
  choice: अपने आप को याजक को दिखाओ
  rationale: यह प्रतिवर्ती सर्वनाम और तोराह के अनुसार याजकीय निरीक्षण, दोनों को निकटता से व्यक्त करता है। निश्चित पद उस उपयुक्त याजक की ओर संकेत करता है जिसके सामने व्यक्ति को उपस्थित होना था।
- source_word: προσένεγκε περὶ τοῦ καθαρισμοῦ σου
  choice: अपने शुद्ध होने के लिए वह चढ़ावा चढ़ाओ
  rationale: प्रसंग बलिदानी भेंट का है, इसलिए προσένεγκε के लिए ‘चढ़ावा चढ़ाओ’ केवल ‘लाओ’ से अधिक स्पष्ट है। ‘शुद्ध होने’ से धार्मिक शुद्धि का भाव साधारण पाठक के लिए बोधगम्य रहता है।
- source_word: ἃ προσέταξεν Μωϋσῆς
  choice: जिसकी आज्ञा मूसा ने दी थी
  rationale: यूनानी नपुंसकलिंग बहुवचन उन निर्धारित वस्तुओं/भेंटों को सामूहिक रूप से बताता है; हिन्दी में ‘वह चढ़ावा ... जिसकी आज्ञा’ इसी संदर्भ को सहज रूप देता है।
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ताकि उनके लिए गवाही हो
  rationale: εἰς यहाँ उद्देश्य या परिणाम बता सकता है। ‘उनके लिए गवाही’ साक्ष्य के भाव को बनाए रखता है और यह तय नहीं करता कि गवाही केवल प्रमाण है या विरोधात्मक भी।
theological_decisions:
- issue: ‘εἰς μαρτύριον αὐτοῖς’ में ‘उनके’ का संदर्भ और गवाही का स्वर
  choice: ‘ताकि उनके लिए गवाही हो’—संदर्भ और स्वर को जानबूझकर व्यापक रखा गया है।
  alternative: ‘उनके सामने प्रमाण के रूप में’ या ‘उनके विरुद्ध गवाही के रूप में’
  rationale: यूनानी पाठ में ‘विरुद्ध’ स्पष्ट रूप से नहीं है और αὐτοῖς किन लोगों को समेटता है, यह भी पूरी तरह निर्दिष्ट नहीं। इसलिए मुख्य पाठ याजकों और/या समुदाय के सामने साक्ष्य तथा संभावित विरोधात्मक अर्थ—दोनों की गुंजाइश रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और साधारण पाठकों के लिए सहज। ‘याजक’, ‘चढ़ावा’ और ‘गवाही’ बाइबलीय-सांस्कृतिक संदर्भ को बनाए रखते हैं, पर वाक्य-विन्यास वर्तमान हिन्दी का है।
