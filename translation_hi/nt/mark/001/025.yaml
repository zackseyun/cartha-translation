  text: καὶ ἐπετίμησεν αὐτῷ ὁ Ἰησοῦς λέγων· Φιμώθητι καὶ ἔξελθε ἐξ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/025.yaml
  text: And Jesus rebuked him[a], saying, “Be silent, and come out of him!”
translation:
  language: hi
  text: यीशु ने उसे डाँटा और कहा, “चुप हो जा[a] और उसमें से निकल आ!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “मुँह बंद कर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμησεν
  choice: डाँटकर
  rationale: यह क्रिया कड़ी फटकार और अधिकारपूर्ण निषेध व्यक्त करती है। ‘डाँटा’ आधुनिक हिन्दी में स्वाभाविक है और यीशु के अधिकार की तीक्ष्णता बनाए रखता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: पुल्लिंग एकवचन सर्वनाम का संकेत प्रसंग के अशुद्ध आत्मा की ओर है; अगले आदेश ‘उसमें से निकल आ’ से पीड़ित मनुष्य और संबोधित आत्मा का भेद स्पष्ट रहता है।
- source_word: λέγων
  choice: कहा
  rationale: यूनानी वर्तमान कृदंत डाँट की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘डाँटकर कहा’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: Φιμώθητι
  choice: चुप हो जा
  rationale: शाब्दिक अर्थ ‘मुँह बाँध दिया जाना’ है, पर यहाँ बलपूर्वक मौन रहने की आज्ञा है। ‘चुप हो जा’ संक्षिप्त, तीखा और वर्तमान हिन्दी में सहज है; शाब्दिक बिंब पादटिप्पणी में रखा गया है।
- source_word: ἔξελθε
  choice: निकल आ
  rationale: झाड़ने के इस प्रसंग में क्रिया भीतर से बाहर आने का आदेश देती है। ‘निकल आ’ हिन्दी में सीधी और स्वाभाविक आज्ञा है।
- source_word: ἐξ αὐτοῦ
  choice: उसमें से
  rationale: ἐξ भीतर से बाहर की गति दर्शाता है। ‘उसमें से’ स्पष्ट करता है कि आत्मा को उस मनुष्य के भीतर से निकलने की आज्ञा दी गई।
theological_decisions:
- issue: यीशु की डाँट किसे संबोधित है
  choice: यीशु सीधे अशुद्ध आत्मा को संबोधित करते हैं, मनुष्य को नहीं।
  alternative: व्याकरणिक संबोधन को उस मनुष्य के लिए समझना।
  rationale: निकटवर्ती प्रसंग में मनुष्य अशुद्ध आत्मा से ग्रस्त है, और ‘उसमें से निकल आ’ संबोधित सत्ता को उस मनुष्य से अलग ठहराता है। अनुवाद इस कथात्मक भेद को बनाए रखता है, बिना अतिरिक्त धर्मसैद्धांतिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘चुप हो जा’ तथा ‘निकल आ’ आदेशों की आकस्मिकता और अधिकारपूर्ण स्वर को बनाए रखते हैं; ‘तब’ καί को इस कथात्मक क्रम में स्वाभाविक हिन्दी संयोजक के रूप में व्यक्त करता है।
