source:
  edition: SBLGNT
  text: καὶ ἐκήρυσσεν λέγων· Ἔρχεται ὁ ἰσχυρότερός μου ὀπίσω μου, οὗ οὐκ εἰμὶ ἱκανὸς κύψας λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/007.yaml
  text: And he was proclaiming[a], saying, “The one stronger than I is coming after me[c][b], of whom I am not worthy to stoop down and untie the strap of his sandals.”
translation:
  language: hi
  text: और वह घोषणा करता था, “मेरे बाद मुझसे अधिक सामर्थी व्यक्ति आ रहा है, जिसके सैंडलों के पट्टे मैं झुककर खोलने के भी योग्य नहीं हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκήρυσσεν
  choice: घोषणा करता रहा
  rationale: अपूर्ण भूतकाल जारी या बार-बार होने वाली घोषणा को व्यक्त करता है; ‘घोषणा’ κηρύσσω के सार्वजनिक उद्घोष की शक्ति बनाए रखती है।
- source_word: Ἔρχεται
  choice: आ रहा है
  rationale: वर्तमान काल आने की निकटता और सजीवता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ ἰσχυρότερός μου
  choice: मुझसे अधिक सामर्थी व्यक्ति
  rationale: संज्ञा के रूप में प्रयुक्त तुलनात्मक विशेषण को स्पष्ट रखता है; ‘सामर्थी’ बल और सामर्थ्य दोनों की व्यापकता बनाए रखता है।
- source_word: ὀπίσω μου
  choice: मेरे बाद
  rationale: यहाँ यूहन्ना के पश्चात आने का कालगत और उत्तरवर्ती भाव प्रमुख है, यद्यपि यूनानी में ‘पीछे’ का स्थानगत भाव भी संभव है।
- source_word: ἱκανὸς
  choice: इस योग्य
  rationale: सन्दर्भ में केवल क्षमता नहीं, आने वाले व्यक्ति के सामने गहरी अयोग्यता और विनम्रता व्यक्त होती है।
- source_word: κύψας λῦσαι
  choice: झुककर ... खोलूँ
  rationale: अओरिस्ट कृदन्त की सहायक क्रिया को हिन्दी में ‘झुककर’ स्वाभाविक रूप से व्यक्त करता है और खोलने से जुड़ी शारीरिक क्रिया बनाए रखता है।
- source_word: τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: उसकी जूतियों के पट्टे
  rationale: ‘पट्टा’ चमड़े की बाँधने वाली पट्टी का स्पष्ट आधुनिक शब्द है; ‘जूतियाँ’ प्राचीन खुले पादत्राण के लिए सामान्य हिन्दी पाठक को समझ आने वाला शब्द है।
theological_decisions:
- issue: यूहन्ना की विनम्रता में ἱκανός का आशय
  choice: मैं इस योग्य भी नहीं
  alternative: मैं इतना समर्थ/उपयुक्त नहीं
  rationale: मुहावरा मात्र व्यावहारिक असमर्थता के बजाय आने वाले अधिक सामर्थी व्यक्ति के सामने यूहन्ना की निम्न स्थिति और गहरी अयोग्यता को प्रकट करता है; ‘भी’ दास के अत्यन्त साधारण कार्य तक के लिए अयोग्य होने का बल व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और मौखिक घोषणा के अनुकूल हिन्दी। वाक्यरचना सहज रखी गई है; ‘अधिक सामर्थी’ पारम्परिक ‘सामर्थवान’ की तुलना में तुलनात्मक अर्थ को अधिक स्पष्ट बनाता है।
