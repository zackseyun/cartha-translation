  text: Καὶ ⸀εὐθὺς ἐκ τῆς συναγωγῆς ⸂ἐξελθόντες ἦλθον⸃ εἰς τὴν οἰκίαν Σίμωνος καὶ Ἀνδρέου μετὰ Ἰακώβου καὶ Ἰωάννου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/029.yaml
  text: And immediately, after leaving the synagogue, they came into the house of Simon and Andrew, with James and John.
translation:
  language: hi
  text: और वे तुरन्त आराधनालय से निकलकर याकूब और यूहन्ना के साथ शमौन और अन्द्रियास के घर में आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: मरकुस की तीव्र कथात्मक गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ τῆς συναγωγῆς
  choice: आराधनालय से
  rationale: ἐκ के बाहर निकलने अथवा वहाँ से प्रस्थान करने के भाव को संक्षेप और स्पष्ट रूप से रखता है; निकलकर क्रिया इसे पूरा करती है।
- source_word: ἐξελθόντες ἦλθον
  choice: निकलकर ... आए
  rationale: पहले निकलने और फिर घर में आने की क्रमिक क्रियाओं को हिन्दी के स्वाभाविक पूर्वकालिक कृदन्त-विन्यास में सुरक्षित रखता है।
- source_word: ἦλθον
  choice: आए
  rationale: ἔρχομαι के यहाँ सम्भव आगमन-दृष्टिकोण को बनाए रखता है; हिन्दी कथन में गन्तव्य के साथ यह स्वाभाविक है।
- source_word: εἰς τὴν οἰκίαν
  choice: घर में
  rationale: εἰς की भीतर की ओर गति और οἰκία के निवास-स्थान दोनों को व्यक्त करता है।
- source_word: Σίμωνος καὶ Ἀνδρέου
  choice: शमौन और अन्द्रियास के
  rationale: सम्बन्धकारक रूप घर के साथ दोनों व्यक्तियों का सम्बन्ध स्पष्ट करता है, बिना यह अनावश्यक रूप से तय किए कि स्वामित्व की कानूनी प्रकृति क्या थी।
- source_word: μετὰ Ἰακώβου καὶ Ἰωάννου
  choice: याकूब और यूहन्ना के साथ
  rationale: μετά के संगति अथवा साथ होने के सामान्य अर्थ का सीधा और स्वाभाविक अनुवाद है।
- source_word: Σίμωνος / Ἀνδρέου / Ἰακώβου / Ἰωάννου
  choice: शमौन / अन्द्रियास / याकूब / यूहन्ना
  rationale: हिन्दी बाइबलीय परम्परा में पहचाने जाने वाले मानक नाम-रूप अपनाए गए हैं।
