  text: ⸂καὶ ἐξῆλθεν⸃ ἡ ἀκοὴ αὐτοῦ εὐθὺς ⸀πανταχοῦ εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/028.yaml
  text: And the news about him went out at once everywhere into the whole surrounding region of Galilee[a][b].
translation:
  language: hi
  text: और उसके विषय में खबर[a] तुरन्त गलील के आस-पास के पूरे इलाके में हर जगह फैल गई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके विषय में समाचार’; या ‘उसकी ख्याति’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से मूल में खबर के ‘निकल जाने’ का भाव है।
    reason: source_form
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: फैल गई
  rationale: शाब्दिक अर्थ ‘निकल गई’ है, पर खबर के प्रसार के संदर्भ में ‘फैल गई’ स्वाभाविक हिन्दी है और बाहर की ओर जाने के भाव को स्पष्ट रखता है।
- source_word: ἀκοὴ
  choice: खबर
  rationale: यहाँ शब्द का अर्थ सुनी जाने वाली बात, अर्थात खबर या समाचार है। ‘ख्याति’ संभव है, लेकिन वह मूल शब्द से अधिक प्रतिष्ठा या प्रसिद्धि का भाव जोड़ सकती है।
- source_word: αὐτοῦ
  choice: उसके विषय में
  rationale: ἀκοὴ के साथ संबंधवाचक रूप खबर की विषय-वस्तु बताता है; इसलिए ‘उसके विषय में’ स्वाभाविक और सटीक है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस में बार-बार आने वाली तात्कालिकता को संक्षिप्त और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πανταχοῦ
  choice: हर जगह
  rationale: यह क्रियाविशेषण व्यापक भौगोलिक प्रसार को सीधे व्यक्त करता है।
- source_word: περίχωρον
  choice: आस-पास का इलाका
  rationale: शब्द निकटवर्ती क्षेत्र या जिले को दर्शाता है। ‘आस-पास का इलाका’ साधारण पाठक के लिए स्पष्ट है और ग्रामीण क्षेत्र होने का अनावश्यक संकेत नहीं देता।
- source_word: εἰς ὅλην τὴν περίχωρον τῆς Γαλιλαίας
  choice: गलील के आस-पास के पूरे इलाके में
  rationale: हिन्दी में ‘में’ प्रसार के गंतव्य और व्यापक पहुँच दोनों को स्वाभाविक ढंग से व्यक्त करता है; ‘पूरे’ मूल के ὅλην को बनाए रखता है।
theological_decisions:
- issue: ἀκοὴ αὐτοῦ का आशय
  choice: उसके विषय में खबर
  alternative: उसकी ख्याति
  rationale: संदर्भ यीशु के विषय में सुनी गई बात के तेज प्रसार का है। ‘ख्याति’ संभव है, पर वह प्रसिद्धि या प्रतिष्ठा का अधिक प्रबल भाव जोड़ती है; ‘खबर’ कथात्मक अस्पष्टता को बेहतर बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फैल गई’ समाचार के प्रसार के लिए स्वाभाविक हिन्दी है, जबकि पादटिप्पणी मूल क्रिया की गतिशील छवि बताती है।
