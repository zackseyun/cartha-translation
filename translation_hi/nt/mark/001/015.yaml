source:
  edition: SBLGNT
  text: καὶ λέγων ὅτι Πεπλήρωται ὁ καιρὸς καὶ ἤγγικεν ἡ βασιλεία τοῦ θεοῦ· μετανοεῖτε καὶ πιστεύετε ἐν τῷ εὐαγγελίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/015.yaml
  text: and saying[a], “The time has been fulfilled, and the kingdom of God has drawn near[b]. Repent and believe in the good news.”
translation:
  language: hi
  text: और उसने कहा, “समय पूरा हो चुका है, और परमेश्वर का राज्य[a] निकट आ गया है। मन फिराओ और शुभ समाचार[b] पर विश्वास करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का शासन।”
    reason: lexical_alternative
  - marker: b
    text: या, “सुसमाचार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Πεπλήρωται
  choice: पूरा हो चुका है
  rationale: पूर्णकाल के पूरे हुए कार्य और उसके वर्तमान परिणाम—दोनों को व्यक्त करता है।
- source_word: καιρὸς
  choice: समय
  rationale: यह निर्णायक, ठहराए हुए अवसर को सूचित करता है; ‘समय’ सहज है और संदर्भ उसकी विशेषता स्पष्ट करता है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: पूर्णकाल से व्यक्त वर्तमान निकटता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित, व्यापक अभिव्यक्ति है, जिसमें परमेश्वर के शासन और उसके राज्य-क्षेत्र दोनों की अर्थ-संभावना बनी रहती है।
- source_word: μετανοεῖτε
  choice: मन फिराओ
  rationale: यह केवल विचार बदलने नहीं, बल्कि मन और जीवन की निर्णायक दिशा बदलने की पुकार व्यक्त करता है।
- source_word: πιστεύετε
  choice: विश्वास करो
  rationale: आज्ञार्थक क्रिया का सीधा और प्रचलित हिन्दी समतुल्य है; भरोसे और स्वीकार—दोनों की गुंजाइश रखता है।
- source_word: ἐν τῷ εὐαγγελίῳ
  choice: शुभ समाचार पर
  rationale: εὐαγγέλιον का सुलभ अर्थ ‘शुभ समाचार’ है; πιστεύω के साथ ἐν को हिन्दी में स्वाभाविक रूप से ‘पर विश्वास’ कहा गया है।
- source_word: λέγων
  choice: और वह कहता था
  rationale: यह कृदंत पिछले पद की चलती हुई कथा और यीशु की घोषणा को जोड़ता है; हिन्दी में अपूर्ण भूतकाल इसे सहज बनाता है।
theological_decisions:
- issue: βασιλεία τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: ‘राज्य’ मूल पद की व्यापकता और बाइबलीय प्रतिध्वनि को बनाए रखता है तथा अर्थ को केवल शासन-क्रिया तक सीमित नहीं करता।
- issue: εὐαγγέλιον का अनुवाद
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: ‘शुभ समाचार’ आधुनिक पाठक के लिए सीधे अर्थ-सुलभ है; ‘सुसमाचार’ भी प्रचलित कलीसियाई विकल्प है, पर मुख्य पाठ में पारिभाषिकता से बचा गया है।
- issue: μετανοεῖτε καὶ πιστεύετε का बल
  choice: मन फिराओ और ... विश्वास करो
  alternative: मन फिराते रहो और विश्वास करते रहो
  rationale: वर्तमानकालीन आज्ञाओं की संभावित निरंतरता को हिन्दी में स्पष्ट जोड़ना अतिव्याख्या हो सकता है; साधारण आज्ञार्थक रूप पुकार की तात्कालिकता और खुलापन दोनों रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन फिराओ’ धार्मिक परंपरा से परिचित होते हुए भी ‘पश्चाताप करो’ की तुलना में मूल क्रिया के दिशा-परिवर्तन के भाव को अधिक प्रत्यक्ष करता है।
