  text: Καὶ ἔρχεται πρὸς αὐτὸν λεπρὸς παρακαλῶν αὐτὸν καὶ ⸀γονυπετῶν λέγων αὐτῷ ὅτι Ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/040.yaml
  text: And a man with leprosy comes to him[a], pleading with him and kneeling, and saying to him, “If you are willing[d][c][b], you are able to make me clean.”
translation:
  language: hi
  text: और कोढ़ से पीड़ित एक व्यक्ति[a] उसके पास आता है और उससे विनती करते हुए घुटने टेककर कहता है, “यदि आप चाहें, तो मुझे शुद्ध कर सकते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “एक कोढ़ी।” यहाँ प्रयुक्त यूनानी शब्द विभिन्न त्वचा-रोगों के लिए भी इस्तेमाल हो सकता था; यह आवश्यक नहीं कि उससे आधुनिक हैन्सन रोग ही अभिप्रेत हो।'
    reason: lexical_alternative
  - marker: b
    text: या “मुझे निर्मल कर सकते हैं।” यहाँ “शुद्ध करना” शारीरिक रोगमुक्ति के साथ धार्मिक अशुद्धता से मुक्त किए जाने का भाव भी रख सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λεπρὸς
  choice: कोढ़ से पीड़ित एक व्यक्ति
  rationale: यूनानी विशेषण यहाँ संज्ञा के रूप में एक त्वचा-रोग से पीड़ित व्यक्ति को दर्शाता है। व्यक्ति-केंद्रित अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक और सम्मानजनक है; ‘कोढ़ी’ अधिक पारंपरिक है, पर व्यक्ति की पहचान को रोग तक सीमित कर सकता है।
- source_word: παρακαλῶν
  choice: विनती करते हुए
  rationale: इस प्रसंग में शब्द का अर्थ आग्रहपूर्वक निवेदन करना है। ‘विनती’ earnest appeal को व्यक्त करता है, बिना मूल पाठ से अधिक निराशा आरोपित किए।
- source_word: γονυπετῶν
  choice: घुटने टेककर
  rationale: यह कृदंत घुटने के बल होने की मुद्रा बताता है। हिन्दी में ‘घुटने टेककर’ संक्षिप्त और स्वाभाविक है।
- source_word: Ἐὰν θέλῃς
  choice: यदि आप चाहें
  rationale: θέλω यहाँ इच्छा अथवा तत्परता दर्शाता है। हिन्दी में आदरसूचक ‘आप’ प्रसंगानुकूल है और ‘चाहें’ शर्त की वास्तविकता को बनाए रखता है।
- source_word: δύνασαί
  choice: कर सकते हैं
  rationale: यह सामर्थ्य या क्षमता व्यक्त करता है। ‘कर सकते हैं’ आधुनिक हिन्दी में स्वाभाविक रूप से वही अर्थ देता है।
- source_word: καθαρίσαι
  choice: मुझे शुद्ध कर सकते हैं
  rationale: καθαρίζω शारीरिक रोगमुक्ति और धार्मिक अशुद्धता से शुद्ध किए जाने—दोनों अर्थ-क्षेत्रों को छूता है। ‘शुद्ध’ दोनों संभावनाओं को खुला रखता है; केवल ‘चंगा’ कहना अर्थ को शारीरिक उपचार तक सीमित कर देता।
- source_word: ἔρχεται
  choice: आता है
  rationale: यूनानी का ऐतिहासिक वर्तमान मरकुस की जीवंत कथन-शैली का अंग है। हिन्दी वर्तमान काल भी यहाँ स्वाभाविक रहते हुए उस शैली को सुरक्षित रखता है।
theological_decisions:
- issue: त्वचा-रोग के प्रसंग में ‘शुद्ध करने’ का स्वरूप
  choice: मुझे शुद्ध कर सकते हैं
  alternative: मुझे चंगा कर सकते हैं
  rationale: मूल पाठ सामान्य उपचारवाची क्रिया के बजाय καθαρίζω का प्रयोग करता है। ‘शुद्ध’ शारीरिक बहाली और धार्मिक शुद्धता के बीच के संबंध और तनाव को बिना संकुचित किए बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक वर्तमान ‘आता है’ मरकुस की जीवंत कथन-शैली को बनाए रखता है। यीशु को संबोधित करते समय हिन्दी की सामाजिक-भाषिक आवश्यकता के अनुसार आदरसूचक ‘आप’ चुना गया है; इससे मूल यूनानी में कोई अतिरिक्त पदवी या सैद्धांतिक दावा नहीं जोड़ा गया।
