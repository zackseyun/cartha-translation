  text: Καὶ εἰσπορεύονται εἰς Καφαρναούμ. καὶ ⸀εὐθὺς τοῖς σάββασιν ⸂ἐδίδασκεν εἰς τὴν συναγωγήν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/021.yaml
  text: And they went into Capernaum, and immediately on the Sabbath he began teaching in the synagogue.
translation:
  language: hi
  text: वे कफरनहूम में आए। और तुरन्त, सब्त के दिन, वह आराधनालय में शिक्षा दे रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσπορεύονται
  choice: वे ... में आए
  rationale: यूनानी में ऐतिहासिक वर्तमान है, जिसका मरकुस सजीव वर्णन में बार-बार प्रयोग करता है। स्वाभाविक हिन्दी कथन में भूतकाल रखा गया है, जबकि εἰς के साथ भीतर आने का भाव ‘में आए’ से व्यक्त होता है।
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: यह इस स्थान के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और सहज नाम-रूप है।
- source_word: εὐθύς
  choice: तुरन्त
  rationale: यह मरकुस की कथा में तत्परता और शीघ्रता का भाव स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी रूप बहुवचन है, पर यह कालवाचक मुहावरा यहाँ एक सब्त के दिन को सूचित करता है; हिन्दी में ‘सब्त के दिन’ स्पष्ट और स्वाभाविक है।
- source_word: ἐδίδασκεν
  choice: शिक्षा देने लगे
  rationale: अपूर्ण भूतकालीन क्रिया का प्रवाहमय पहलू बना रहता है और प्रसंग में आरम्भ का सम्भव भाव स्वाभाविक हिन्दी में व्यक्त होता है; अन्य पक्षगत सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: συναγωγήν
  choice: आराधनालय
  rationale: इस यहूदी प्रसंग में शब्द स्थानीय यहूदी उपासना और शिक्षा के स्थान को बताता है। ‘आराधनालय’ सामान्य हिन्दी पाठक के लिए अर्थपूर्ण है, जबकि मूल पद ‘सिनागॉग’ पादटिप्पणी में दिया गया है।
