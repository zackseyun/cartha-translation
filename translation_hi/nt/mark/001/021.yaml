  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘फिर’ दूसरी καί को स्वाभाविक कथानुक्रम में व्यक्त करता है। ‘जाकर’ यूनानी वाक्य में निहित आराधनालय में प्रवेश के स्थानगत भाव को सहज हिन्दी में स्पष्ट करता है; कोई संप्रदायगत व्याख्या नहीं जोड़ी गई।
