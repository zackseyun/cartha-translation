- from: और वे कफरनहूम में आए। फिर सब्त के दिन वे तुरन्त आराधनालय में जाकर शिक्षा देने लगे।[a][b][c]
  to: वे कफरनहूम में आए। और तुरन्त, सब्त के दिन, वह आराधनालय में शिक्षा दे रहा था।
  rationale: The revision corrects the singular subject required by the Greek, removes the unsupported addition “जाकर,” and uses an ongoing Hindi imperfect construction that does not decide the disputed inceptive nuance. Footnotes are retained with their proper lexical scope; in the typeset text, place [a] after “आए,” [b] after “दिन,” and [c] after “था.”
