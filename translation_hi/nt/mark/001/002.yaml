  text: ⸀Καθὼς γέγραπται ἐν ⸂τῷ Ἠσαΐᾳ τῷ προφήτῃ⸃· ⸀Ἰδοὺ ἀποστέλλω τὸν ἄγγελόν μου πρὸ προσώπου σου, ὃς κατασκευάσει τὴν ὁδόν ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/002.yaml
  text: 'Just as it is written in Isaiah the prophet: ‘Behold[a], I send my messenger before your face[c][b], who will prepare your way.’'
translation:
  language: hi
  text: 'जैसा कि यशायाह नबी की पुस्तक में लिखा है[a]: “देखो, मैं अपने दूत को तुम्हारे आगे भेजता हूँ[c]; वह तुम्हारा मार्ग तैयार करेगा।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “यशायाह नबी की पुस्तक में” के स्थान पर “नबियों में” है।
    reason: textual_variant
  - marker: b
    text: इस उद्धरण में मलाकी 3:1 और यशायाह 40:3 की शब्दावली सम्मिलित है।
    reason: cross_reference
  - marker: c
    text: या “तुम्हारे सामने।” शाब्दिक अर्थ, “तुम्हारे चेहरे के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Καθὼς
  choice: जैसा
  rationale: यह आगे दिए गए पवित्रशास्त्रीय उद्धरण के साथ अनुरूपता प्रकट करता है; ‘जैसा’ सहज और संक्षिप्त है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्णकालीन कर्मवाच्य सूत्र किसी लिखित वचन की वर्तमान और स्थायी स्थिति बताता है; हिन्दी में ‘लिखा है’ इसका स्वाभाविक रूप है।
- source_word: ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ
  choice: नबी यशायाह में
  rationale: यह नामित नबी के ग्रंथ में लिखे होने का सामान्य हिन्दी उद्धरण-सूत्र है और मूल पाठ में यशायाह के स्पष्ट उल्लेख को बनाए रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला भविष्यद्वाणी-संबंधी उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्पष्ट रहते हुए उसकी गंभीरता बनाए रखता है।
- source_word: ἀποστέλλω
  choice: भेजता हूँ
  rationale: मूल वर्तमान काल को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है तथा उद्धरण की सजीवता बनाए रखता है।
- source_word: ἄγγελόν
  choice: दूत
  rationale: इस संदर्भ में शब्द संदेश लेकर या अग्रदूत के रूप में भेजे गए व्यक्ति को दर्शाता है; ‘दूत’ मानव या स्वर्गीय होने का अनावश्यक निर्णय नहीं थोपता।
- source_word: πρὸ προσώπου σου
  choice: तुम्हारे आगे
  rationale: मुहावरे का आशय ‘तुम्हारे सामने/तुमसे पहले’ है। ‘तुम्हारे आगे’ दिशात्मक अर्थ को सहज हिन्दी में रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: κατασκευάσει
  choice: तैयार करेगा
  rationale: क्रिया का अर्थ किसी वस्तु को तैयार या सुगम करना है; मार्ग के साथ ‘तैयार करेगा’ स्पष्ट और स्वाभाविक है।
- source_word: τὴν ὁδόν σου
  choice: तुम्हारा मार्ग
  rationale: ‘मार्ग’ वास्तविक रास्ते की छवि और उसके रूपकात्मक भविष्यद्वाणी-संबंधी अर्थ—दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: उद्धरण का आरंभ मलाकी 3:1 से संबंधित है, फिर भी पाठ केवल नबी यशायाह का नाम देता है।
  choice: मुख्य पाठ में ‘नबी यशायाह में’ रखा गया है।
  alternative: ‘नबियों में’
  rationale: SBLGNT का पाठ ἐν τῷ Ἠσαΐᾳ τῷ προφήτῃ है। संयुक्त उद्धरण के कारण उत्पन्न तनाव को सामंजस्य बैठाकर मिटाने के बजाय मुख्य पाठ और पादटिप्पणियों में ज्यों का त्यों सुरक्षित रखा गया है।
- issue: ἄγγελος का अर्थ मानव दूत या स्वर्गदूत हो सकता है।
  choice: दूत
  alternative: स्वर्गदूत
  rationale: उद्धरण के संदर्भ में अग्रदूत अभिप्रेत है। ‘दूत’ मूल शब्द की व्यापकता बनाए रखता है और अनावश्यक रूप से स्वर्गीय प्राणी का अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘नबी’, ‘दूत’ और ‘मार्ग’ जैसे परिचित बाइबलीय शब्द प्रयुक्त हैं; अत्यधिक शाब्दिक किन्तु असहज ‘तुम्हारे मुख के सामने’ को पादटिप्पणी में सुरक्षित रखा गया है।
