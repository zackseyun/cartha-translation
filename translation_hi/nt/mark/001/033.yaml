  text: और सारा नगर द्वार पर इकट्ठा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦν
  choice: था
  rationale: अपूर्ण भूतकाल की क्रिया यहाँ कृदंत के साथ उस समय जारी स्थिति का वर्णन करती है; हिन्दी में ‘इकट्ठा था’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὅλη ἡ πόλις
  choice: सारा नगर
  rationale: यह यूनानी अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप है। सम्भवतः यह प्रभावपूर्ण सामान्यीकरण है, फिर भी मूल की व्यापक अभिव्यक्ति को कमज़ोर नहीं किया गया।
- source_word: ἐπισυνηγμένη
  choice: इकट्ठा
  rationale: पूर्ण कर्मवाच्य कृदंत एकत्र हो चुकी भीड़ की परिणामी स्थिति बताता है; ‘इकट्ठा था’ आधुनिक हिन्दी में सरल और सटीक है।
- source_word: πρὸς τὴν θύραν
  choice: द्वार पर
  rationale: स्थिर अवस्था के इस संदर्भ में πρός घर के प्रवेश-द्वार के पास स्थित भीड़ को सूचित करता है; ‘द्वार पर’ हिन्दी में स्वाभाविक है।
- source_word: θύραν
  choice: द्वार
  rationale: θύρα का मूल अर्थ दरवाज़ा अथवा प्रवेश-द्वार है। ‘द्वार’ संक्षिप्त, गरिमापूर्ण और इस प्रसंग में स्पष्ट है।
