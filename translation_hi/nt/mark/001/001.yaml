  text: The beginning of the good news of Jesus the Messiah[a][b].
translation:
  language: hi
  text: यीशु मसीह[b] के शुभ समाचार[a] का आरम्भ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा ‘सुसमाचार’। यूनानी शब्द εὐαγγέλιον का अर्थ ‘शुभ समाचार’ है; परम्परागत रूप से इसका अनुवाद ‘सुसमाचार’ भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘यीशु ख्रीष्ट’। यूनानी Χριστός पदवी के रूप में ‘मसीह’, अर्थात ‘अभिषिक्त जन’, का अर्थ रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἀρχὴ
  choice: आरम्भ
  rationale: यह संज्ञात्मक आरम्भिक पंक्ति को बिना पूर्ण वाक्य बनाए स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है। यूनानी में निश्चित उपपद नहीं है; हिन्दी में यहाँ उसकी अलग से आवश्यकता नहीं पड़ती।
- source_word: εὐαγγελίου
  choice: शुभ समाचार
  rationale: यह यूनानी शब्द का मूल अर्थ सामान्य आधुनिक पाठक के लिए स्पष्ट करता है; पारम्परिक विकल्प ‘सुसमाचार’ पादटिप्पणी में दिया गया है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिनाम का प्रचलित मानक हिन्दी रूप।
- source_word: χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός यीशु की मसीही पदवी बताता है। ‘मसीह’ हिन्दी में इस पदवी का प्रचलित रूप है और नाम-जैसे लिप्यंतरण ‘ख्रीष्ट’ की अपेक्षा उसके अर्थ को बेहतर बनाए रखता है।
theological_decisions:
- issue: Χριστοῦ को पदवी के रूप में अनूदित किया जाए या पारम्परिक नाम-जैसे रूप में रखा जाए
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: मरकुस 1:1 में यह पदवी यीशु की पहचान मसीह के रूप में कराती है। ‘मसीह’ स्रोत की पदवीगत और यहूदी पृष्ठभूमि को सुरक्षित रखता है, जबकि वैकल्पिक पारम्परिक रूप पादटिप्पणी में उपलब्ध है।
translation_notes:
  register: आधुनिक, सुबोध और गरिमापूर्ण मानक हिन्दी। संक्षिप्त संज्ञात्मक शैली को मूल यूनानी की शीर्षक-जैसी आरम्भिक संरचना के अनुरूप रखा गया है।
