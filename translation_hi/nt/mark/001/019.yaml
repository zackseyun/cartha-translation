  text: καὶ ⸀προβὰς ὀλίγον εἶδεν Ἰάκωβον τὸν τοῦ Ζεβεδαίου καὶ Ἰωάννην τὸν ἀδελφὸν αὐτοῦ, καὶ αὐτοὺς ἐν τῷ πλοίῳ καταρτίζοντας τὰ δίκτυα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/019.yaml
  text: And going on a little farther[a], he saw James the son of Zebedee and John his brother, and they were in the boat mending the nets,
translation:
  language: hi
  text: थोड़ा आगे बढ़कर उसने जब्दी के पुत्र याकूब और उसके भाई यूहन्ना को देखा कि वे नाव में जालों को ठीक कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जालों की मरम्मत कर रहे थे” अथवा “जालों को तैयार कर रहे थे”; यूनानी क्रिया का अर्थ किसी वस्तु को व्यवस्थित करना या उसे फिर से उचित दशा में लाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προβὰς ὀλίγον
  choice: थोड़ा आगे बढ़कर
  rationale: यह कृदन्त मुख्य क्रिया से पहले थोड़ी दूरी आगे जाने की परिस्थिति बताता है; यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: εἶδεν
  choice: उसने ... देखा
  rationale: साधारण आख्यानात्मक भूतकाल है; इसमें ध्यान से देखने या अचानक पहचानने जैसा अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: Ἰάκωβον τὸν τοῦ Ζεβεδαίου
  choice: जब्दी के पुत्र याकूब
  rationale: सम्बन्धकारक रचना याकूब की पहचान उसके पिता जब्दी के द्वारा कराती है।
- source_word: Ἰωάννην τὸν ἀδελφὸν αὐτοῦ
  choice: उसके भाई यूहन्ना
  rationale: αὐτοῦ का स्वाभाविक पूर्वपद याकूब है; हिन्दी पदक्रम इस सम्बन्ध को स्पष्ट और सहज बनाता है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में
  rationale: निश्चित उपपद दृश्य की विशिष्ट नाव की ओर संकेत करता है, पर हिन्दी में यहाँ अलग से ‘उस नाव’ कहना अनावश्यक रूप से भारी होता।
- source_word: καταρτίζοντας
  choice: ठीक कर रहे थे
  rationale: क्रिया का अर्थ किसी वस्तु को उचित दशा में लाना, व्यवस्थित करना या सुधारना हो सकता है। मछली पकड़ने के जालों के सन्दर्भ में ‘ठीक करना’ स्वाभाविक है और ‘मरम्मत’ तथा ‘तैयार करने’ के बीच की वास्तविक अर्थ-व्याप्ति को बहुत अधिक संकीर्ण नहीं करता।
- source_word: τὰ δίκτυα
  choice: जाल
  rationale: यह मछली पकड़ने के जाल हैं। हिन्दी में बहुवचन का अर्थ प्रसंग से स्पष्ट है; ‘जालों’ की अपेक्षा ‘जाल ठीक करना’ अधिक स्वाभाविक है और कोई स्वामित्व नहीं जोड़ता।
- source_word: καὶ αὐτούς
  choice: वे भी
  rationale: αὐτούς देखने की क्रिया का कर्म है और सहभागी कृदन्त उनकी अवस्था बताता है। हिन्दी में इसे नए वाक्य में ‘वे भी ... कर रहे थे’ कहना सहज है; ‘भी’ यूनानी καὶ की समावेशी शक्ति को रखता है।
