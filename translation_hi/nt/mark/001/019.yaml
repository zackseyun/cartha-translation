  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी अपनाई गई है। परिचित बाइबलीय नाम-रूप ‘याकूब’, ‘यूहन्ना’ और ‘जब्दी’ रखे गए हैं। अर्थ-स्पष्टता और हिन्दी की स्वाभाविकता के लिए यूनानी के एक वाक्य को दो छोटे वाक्यों में प्रस्तुत किया गया है।
