base_translation:
  language: en
  yaml_path: translation/nt/mark/001/013.yaml
  text: And he was in the wilderness forty days[a], being tempted by Satan; and he was with the wild animals, and the angels were ministering to him.
translation:
  language: hi
  text: और वह चालीस दिन तक निर्जन प्रदेश में रहा और शैतान उसे प्रलोभन देता रहा[a]; वह जंगली पशुओं के साथ था, और स्वर्गदूत उसकी सेवा करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शैतान उसकी परीक्षा लेता रहा।” यूनानी क्रिया का अर्थ “प्रलोभन देना” या “परीक्षा लेना,” दोनों हो सकता है; यहाँ शैतान के कर्ता होने के कारण “प्रलोभन देना” विशेष रूप से उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρήμῳ
  choice: निर्जन प्रदेश
  rationale: यह अभिव्यक्ति ऐसे उजाड़ और आबादी से दूर स्थान का स्वाभाविक आधुनिक हिन्दी रूप है; यह केवल रेतीले 'रेगिस्तान' का अनावश्यक संकेत नहीं देती और बाइबलीय वन-प्रदेश की व्यापक छवि बनाए रखती है।
- source_word: τεσσεράκοντα ἡμέρας
  choice: चालीस दिन तक
  rationale: अवधि सूचक यूनानी कर्मकारक का हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: πειραζόμενος
  choice: उसकी परीक्षा लेता रहा
  rationale: πειράζω में 'परीक्षा लेना' और 'प्रलोभन देना' दोनों अर्थ संभव हैं। यहाँ शैतान कर्ता है, इसलिए 'प्रलोभन देता रहा' भी प्रबल विकल्प है; मुख्य पाठ का चयन मूल की व्यापक अर्थ-सीमा को बनाए रखता है और पादटिप्पणी नैतिक प्रलोभन का विकल्प स्पष्ट करती है।
- source_word: ὑπὸ τοῦ Σατανᾶ
  choice: शैतान
  rationale: Σατανᾶς के लिए हिन्दी में प्रचलित व्यक्तिगत नाम/उपाधि है और इस प्रसंग में स्वाभाविक है।
- source_word: μετὰ τῶν θηρίων
  choice: जंगली पशुओं के साथ
  rationale: θηρία के अनियंत्रित वन्य जीवों के अर्थ को स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; मूल पाठ उनके खतरे या मैत्रीपूर्ण व्यवहार को स्पष्ट नहीं करता।
- source_word: ἄγγελοι
  choice: स्वर्गदूत
  rationale: प्रसंग अलौकिक, स्वर्गीय संदेशवाहकों की ओर संकेत करता है; 'स्वर्गदूत' आधुनिक हिन्दी बाइबल भाषा में स्पष्ट है।
- source_word: διηκόνουν αὐτῷ
  choice: उसकी सेवा करते रहे
  rationale: अपूर्ण भूतकाल की जारी क्रिया को 'करते रहे' से व्यक्त किया गया है; 'सेवा' διακονέω का सीधा और स्वाभाविक अर्थ देता है।
- source_word: καὶ ἦν ... καὶ ἦν ... καὶ
  choice: और वह ... रहा ...। वह ... था, और ...
  rationale: आरंभिक और अंतिम संयोजक रखकर मरकुस की क्रमबद्ध शैली का पर्याप्त संकेत दिया गया है, जबकि बीच में वाक्य-विभाजन हिन्दी की पठनीयता और स्वाभाविकता बनाए रखता है।
theological_decisions:
- issue: 'πειραζόμενος का अर्थ: परीक्षा या प्रलोभन'
  choice: परीक्षा लेता रहा
  alternative: प्रलोभन देता रहा
  rationale: यूनानी क्रिया दोनों अर्थ दे सकती है। शैतान का कर्ता होना 'प्रलोभन' के पक्ष में है, पर 'परीक्षा' घटना के परीक्षणात्मक पक्ष को भी सुरक्षित रखता है। वास्तविक अर्थगत तनाव को पादटिप्पणी में स्पष्ट किया गया है, किसी एक धर्मवैज्ञानिक व्याख्या को अंतिम मानकर नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। 'निर्जन प्रदेश' भौगोलिक अर्थ को अनावश्यक रूप से रेतीले मरुस्थल तक सीमित नहीं करता। जारी क्रियाओं के लिए 'लेता रहा' और 'करते रहे' से यूनानी अपूर्ण/वर्तमान कृदंत का कालगत भाव व्यक्त किया गया है।
