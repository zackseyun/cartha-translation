  text: ⸂Καὶ παράγων⸃ παρὰ τὴν θάλασσαν τῆς Γαλιλαίας εἶδεν Σίμωνα καὶ Ἀνδρέαν τὸν ⸀ἀδελφὸν Σίμωνος ⸀ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ, ἦσαν γὰρ ἁλιεῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/016.yaml
  text: And as he was passing along beside the Sea of Galilee, he saw Simon and Andrew, Simon’s brother, casting a net into the sea, for they were fishermen.
translation:
  language: hi
  text: जब यीशु गलील की झील के किनारे-किनारे जा रहे थे, तो उन्होंने शमौन और शमौन के भाई अन्द्रियास को झील में जाल फेंकते देखा, क्योंकि वे मछुआरे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παράγων παρὰ τὴν θάλασσαν
  choice: झील के किनारे-किनारे जा रहे थे
  rationale: वर्तमान कृदन्त παράγων मुख्य क्रिया के साथ जारी क्रिया व्यक्त करता है, और παρά के साथ कर्मकारक तट के पास-साथ गति का भाव देता है। यह हिन्दी प्रयोग दोनों बातों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὴν θάλασσαν τῆς Γαλιλαίας
  choice: गलील की झील
  rationale: θάλασσα का सामान्य अर्थ ‘समुद्र’ है, पर यह भौगोलिक जलाशय वास्तव में झील है; आधुनिक हिन्दी में ‘गलील की झील’ स्पष्ट और प्रचलित रूप है।
- source_word: εἶδεν
  choice: देखा
  rationale: ὁράω के साधारण भूतकाल रूप को बिना अतिरिक्त व्याख्यात्मक भाव जोड़े सीधे ‘देखा’ कहा गया है।
- source_word: Σίμωνα καὶ Ἀνδρέαν τὸν ἀδελφὸν Σίμωνος
  choice: शमौन और उसके भाई अन्द्रियास को
  rationale: सम्बन्धसूचक पद अन्द्रियास की पहचान शमौन के भाई के रूप में कराता है। हिन्दी में सर्वनाम के द्वारा यह सम्बन्ध संक्षिप्त और स्वाभाविक ढंग से स्पष्ट होता है।
- source_word: ἀμφιβάλλοντας ἐν τῇ θαλάσσῃ
  choice: झील में जाल डालते
  rationale: ἀμφιβάλλω विशेष रूप से मछली पकड़ने का जाल फेंकने या डालने को सूचित करता है। ‘जाल’ क्रिया के अर्थ में निहित है, और ἐν को हिन्दी मुहावरे में स्वाभाविक ‘में’ से व्यक्त किया गया है।
- source_word: ἦσαν γὰρ ἁλιεῖς
  choice: क्योंकि वे मछुआरे थे
  rationale: γάρ उनके जाल डालने का कारण या व्याख्यात्मक पृष्ठभूमि देता है; आधुनिक हिन्दी में ‘क्योंकि’ इस सम्बन्ध को स्पष्ट और सहज बनाता है।
