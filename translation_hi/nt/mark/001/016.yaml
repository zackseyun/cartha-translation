  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्वर रखा गया है। यीशु का नाम यूनानी वाक्य में व्यक्त नहीं है, पर पिछले संदर्भ का कर्ता हिन्दी में स्पष्ट रखने के लिए नाम जोड़ा गया है; इससे कोई नई पहचान या धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा जाता।
