source:
  edition: SBLGNT
  text: ⸀ἐγὼ ἐβάπτισα ⸀ὑμᾶς ὕδατι, αὐτὸς δὲ βαπτίσει ὑμᾶς ⸀ἐν πνεύματι ἁγίῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/008.yaml
  text: I baptized you with water[a], but he will baptize you with the Holy Spirit.
translation:
  language: hi
  text: मैंने तुम्हें पानी से बपतिस्मा दिया, पर वह तुम्हें पवित्र आत्मा से[a] बपतिस्मा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा में।” यूनानी पूर्वसर्ग का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγὼ
  choice: मैंने
  rationale: स्पष्ट कर्तृवाचक सर्वनाम को रखा गया है, ताकि आगे के αὐτός (‘वह’) के साथ यूहन्ना और आनेवाले व्यक्ति का बलयुक्त विरोध बना रहे।
- source_word: ἐβάπτισα
  choice: बपतिस्मा दिया
  rationale: यह βαπτίζω का प्रचलित और स्वाभाविक हिन्दी धार्मिक पद है; ‘डुबोया’ क्रिया की विधि को अनावश्यक रूप से सीमित कर देती।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: बहुवचन संबोधन को प्रसंगानुकूल सामान्य हिन्दी रूप में व्यक्त किया गया है; आधुनिक हिन्दी में ‘तुम्हें’ वचन की दृष्टि से संदर्भ पर निर्भर हो सकता है।
- source_word: ὕδατι
  choice: पानी से
  rationale: करणवाचक दत्तिव को स्वाभाविक आधुनिक हिन्दी में ‘से’ द्वारा व्यक्त किया गया है। ‘पानी’ साधारण पाठकों के लिए ‘जल’ से अधिक सहज है।
- source_word: αὐτὸς
  choice: वह
  rationale: ἐγώ के साथ मूल का विरोध ‘मैंने ... पर वह’ संरचना से स्पष्ट होता है; ‘वही’ जोड़ने से पहचान या विशिष्टता का अतिरिक्त भाव आ सकता था।
- source_word: δὲ
  choice: पर
  rationale: यहाँ यूहन्ना के बपतिस्मे और आनेवाले के बपतिस्मे के बीच स्पष्ट विरोध है; ‘पर’ इसे संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: βαπτίσει
  choice: बपतिस्मा देगा
  rationale: भविष्यकाल को सुरक्षित रखा गया है और ἐβάπτισα के साथ शब्दगत निरंतरता बनाए रखी गई है।
- source_word: ἐν
  choice: से
  rationale: ἐν और दत्तिव यहाँ साधन अथवा क्षेत्र—दोनों भाव दे सकते हैं। मुख्य पाठ में ‘से’ पानी के साथ समानांतरता और स्वाभाविक हिन्दी बनाए रखता है; ‘में’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πνεύματι ἁγίῳ
  choice: पवित्र आत्मा
  rationale: मरकुस के इस मसीह-संबंधी प्रसंग में यह पद सबसे स्वाभाविक रूप से परमेश्वर के पवित्र आत्मा को सूचित करता है; हिन्दी की मानक मसीही शब्दावली भी यही है।
theological_decisions:
- issue: क्या πνεύματι ἁγίῳ परमेश्वर के पवित्र आत्मा को दर्शाता है या किसी अवैयक्तिक पवित्र शक्ति को
  choice: पवित्र आत्मा
  alternative: पवित्र आत्मिक शक्ति
  rationale: यूहन्ना द्वारा अपने पानी के बपतिस्मे की आनेवाले सामर्थी व्यक्ति के बपतिस्मे से तुलना करने के संदर्भ में यह पद परमेश्वर के पवित्र आत्मा को सबसे स्वाभाविक रूप से दर्शाता है। फिर भी अनुवाद मूल पाठ से आगे जाकर आत्मा के कार्य की प्रकृति का विवरण नहीं जोड़ता।
- issue: ἐν πνεύματι ἁγίῳ में ἐν का अर्थ साधन है या क्षेत्र
  choice: पवित्र आत्मा से
  alternative: पवित्र आत्मा में
  rationale: यूनानी पूर्वसर्ग दोनों अर्थों की अनुमति देता है। ‘से’ मुख्य पाठ में स्वाभाविक है और ‘पानी से’ के समानांतर रहता है, जबकि ‘में’ को पादटिप्पणी में रखकर वास्तविक अर्थगत तनाव सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘बपतिस्मा देना’ प्रचलित धार्मिक अभिव्यक्ति होने के साथ मूल क्रिया की संस्कारगत और अंतरपाठीय शक्ति को भी बनाए रखता है। ‘मैंने ... पर वह’ मूल के बलयुक्त विरोध को बिना अस्वाभाविक जोर के व्यक्त करता है।
