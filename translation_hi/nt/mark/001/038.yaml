source:
  edition: SBLGNT
  text: καὶ λέγει αὐτοῖς· Ἄγωμεν ⸀ἀλλαχοῦ εἰς τὰς ἐχομένας κωμοπόλεις, ἵνα καὶ ἐκεῖ κηρύξω, εἰς τοῦτο γὰρ ⸀ἐξῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/038.yaml
  text: And he said to them[a], “Let us go elsewhere, to the neighboring towns, so that I may preach there also[b], for that is why I came out.”
translation:
  language: hi
  text: और उसने उनसे कहा, “आओ, हम आस-पास के दूसरे कस्बों[a] में चलें, ताकि मैं वहाँ भी प्रचार करूँ, क्योंकि मैं इसी लिए निकला हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ जिस यूनानी शब्द का अनुवाद “कस्बों” किया गया है, वह गाँवों और नगरों के बीच की छोटी बस्तियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि मैं इसी उद्देश्य से निकला हूँ।” यह वाक्यांश यीशु के उस स्थान से निकलने या, अधिक व्यापक अर्थ में, प्रचार करने के लिए निकलने के उद्देश्य की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἄγωμεν
  choice: आओ, हम ... चलें
  rationale: प्रथम पुरुष बहुवचन के आग्रहसूचक भाव को स्वाभाविक हिन्दी निमंत्रण के रूप में व्यक्त करता है।
- source_word: ἀλλαχοῦ
  choice: कहीं और
  rationale: वर्तमान स्थान से किसी दूसरे स्थान की ओर जाने का अर्थ संक्षिप्त और सहज ढंग से देता है।
- source_word: τὰς ἐχομένας
  choice: आस-पास के
  rationale: यहाँ कृदन्त निकटवर्ती या अगले स्थानों को सूचित करता है; ‘आस-पास के’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: κωμοπόλεις
  choice: कस्बों
  rationale: यह शब्द गाँव और नगर के बीच के छोटे आबादी-केंद्रों को सूचित कर सकता है; ‘कस्बे’ इस अर्थ को सहज हिन्दी में निकटता से व्यक्त करता है।
- source_word: ἵνα καὶ ἐκεῖ κηρύξω
  choice: ताकि मैं वहाँ भी प्रचार करूँ
  rationale: ἵνα के उद्देश्य और καὶ ἐκεῖ के ‘वहाँ भी’ वाले बल, दोनों को बनाए रखता है; κηρύσσω के लिए ‘प्रचार करना’ प्रचलित और स्पष्ट है।
- source_word: εἰς τοῦτο
  choice: इसी लिए
  rationale: उद्देश्य अथवा कारण बताने वाले यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξῆλθον
  choice: मैं ... निकला हूँ
  rationale: मूल क्रिया के ‘बाहर निकलने’ के अर्थ को बनाए रखते हुए यह खुला छोड़ता है कि संकेत तत्कालीन स्थान से निकलने का है या प्रचार के व्यापक उद्देश्य से निकलने का।
- source_word: λέγει αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथाशैली में भूतकाल से व्यक्त किया गया है; अर्थ में कोई बदलाव नहीं होता।
theological_decisions:
- issue: ἐξῆλθον का अभिप्राय
  choice: ‘मैं इसी लिए निकला हूँ’—स्थान या व्यापक सेवकाई को स्पष्ट किए बिना
  alternative: ‘मैं यहाँ से इसी लिए निकला हूँ’ अथवा ‘मैं इसी उद्देश्य से आया हूँ’
  rationale: यूनानी वाक्यांश निकट संदर्भ में वर्तमान स्थान से निकलने की ओर संकेत कर सकता है, पर प्रचार के व्यापक उद्देश्य का भाव भी संभव है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कस्बे’ दुर्लभ शाब्दिक रूप की अपेक्षा अधिक स्वाभाविक है, जबकि पादटिप्पणी उसका अर्थ-क्षेत्र स्पष्ट करती है।
