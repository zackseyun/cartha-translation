  - marker: a
    text: या, “सब लोग आपको खोज रहे हैं।” यूनानी शब्द ζητοῦσίν का अनुवाद “खोज रहे हैं” भी हो सकता है; इस प्रसंग में आशय संभवतः यीशु को ढूँढ़कर उनके पास पहुँचने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और जब … तो
  rationale: पहला καί पिछले वृत्तांत से संबंध बनाए रखता है; हिन्दी में ‘जब … तो’ εὗρον और λέγουσιν की क्रमिक क्रियाओं को स्वाभाविक ढंग से जोड़ता है।
- source_word: εὗρον
  choice: पा लिया
  rationale: εὑρίσκω का एओरिस्ट यहाँ खोज के सफल परिणाम को बताता है। ‘पा लिया’ आधुनिक हिन्दी में इस पूर्ण परिणाम को सहजता से व्यक्त करता है।
- source_word: λέγουσιν
  choice: कहा
  rationale: यूनानी का ऐतिहासिक वर्तमान हिन्दी कथावाचन में स्वाभाविक भूतकाल ‘कहा’ से व्यक्त किया गया है।
- source_word: ὅτι
  choice: प्रत्यक्ष कथन के उद्धरण-चिह्न
  rationale: ὅτι यहाँ कथन की विषयवस्तु आरम्भ करता है; हिन्दी में प्रत्यक्ष वचन को उद्धरण-चिह्नों से देना अधिक स्वाभाविक है।
- source_word: Πάντες
  choice: सब लोग
  rationale: संदर्भ में यह यीशु को खोज रहे लोगों के समूह के लिए प्रयुक्त है। ‘सब लोग’ सहज हिन्दी है और प्रसंग से बाहर पूर्ण सार्वभौमिकता को अनावश्यक रूप से नहीं थोपता।
- source_word: ζητοῦσίν σε
  choice: आपको ढूँढ़ रहे हैं
  rationale: ζητέω यहाँ यीशु का भौतिक ठिकाना जानने और उन्हें पाने का प्रयत्न सूचित करता है। ‘ढूँढ़ रहे हैं’ वर्तमान चल रही खोज को स्वाभाविक रूप से व्यक्त करता है; ‘आपको’ संबोधन में सम्मानजनक आधुनिक हिन्दी के अनुरूप है।
- source_word: αὐτὸν / αὐτῷ / σε
  choice: उसे / उससे / आपको
  rationale: तीसरे पुरुष के वर्णन में ‘उसे/उससे’ और यीशु से प्रत्यक्ष संबोधन में सम्मानसूचक ‘आपको’ चुना गया है।
