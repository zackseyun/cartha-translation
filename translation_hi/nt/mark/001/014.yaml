source:
  edition: SBLGNT
  text: ⸂Καὶ μετὰ⸃ τὸ παραδοθῆναι τὸν Ἰωάννην ἦλθεν ὁ Ἰησοῦς εἰς τὴν Γαλιλαίαν κηρύσσων τὸ ⸀εὐαγγέλιον τοῦ θεοῦ
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/014.yaml
  text: And after John was handed over[a], Jesus came into Galilee[c][b], proclaiming the good news of God.
translation:
  language: hi
  text: 'यूहन्ना को सौंप दिए जाने[a] के बाद यीशु गलील में आए और परमेश्वर के शुभ समाचार[b][c] का प्रचार करते हुए कहने लगे:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूहन्ना के गिरफ़्तार किए जाने के बाद।” यूनानी में अधिक शाब्दिक अर्थ “यूहन्ना को सौंप दिए जाने” का है; यही शब्दावली मरकुस में आगे यीशु के सौंपे जाने के वर्णन में भी आती है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का सुसमाचार।”
    reason: lexical_alternative
  - marker: c
    text: “परमेश्वर के” का अर्थ परमेश्वर से आने वाला, परमेश्वर का अपना, अथवा परमेश्वर पर केंद्रित शुभ समाचार हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μετὰ τὸ παραδοθῆναι
  choice: के पकड़वा दिए जाने के बाद
  rationale: μετά के साथ भाववाचक क्रिया-रूप समय का अर्थ देता है। ‘पकड़वा दिए जाने’ में विरोधियों के हाथ सौंपे जाने का भाव बना रहता है और मरकुस में यीशु के पकड़वाए जाने के लिए प्रयुक्त इसी शब्दावली की आगे की प्रतिध्वनि भी सुरक्षित रहती है।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: हिन्दी बाइबल परंपरा में स्थापित और आधुनिक पाठकों के लिए परिचित नाम-रूप।
- source_word: ἦλθεν
  choice: आए
  rationale: ἔρχομαι के सामान्य आगमन-सूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। आदरसूचक बहुवचन हिन्दी में यीशु के उल्लेख का प्रचलित, गरिमापूर्ण रूप है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील में
  rationale: εἰς की दिशात्मकता प्रसंग में गलील आने से स्पष्ट है; ‘गलील में आए’ आधुनिक हिन्दी में ‘गलील के भीतर आए’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: κηρύσσων
  choice: घोषित करने लगे
  rationale: κηρύσσω सार्वजनिक रूप से संदेश सुनाने या घोषित करने का भाव रखता है। ‘घोषित करने लगे’ आगमन के बाद आरम्भ हुई निरंतर सेवकाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εὐαγγέλιον
  choice: शुभ समाचार
  rationale: यह εὐαγγέλιον का पारदर्शी अर्थ है और आधुनिक सामान्य पाठक के लिए ‘सुसमाचार’ जैसे पारिभाषिक शब्द की अपेक्षा तुरंत समझ में आता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का
  rationale: 'सम्बन्धकारक यूनानी पदबंध की व्यापकता सुरक्षित रखता है: यह परमेश्वर से आने वाला, परमेश्वर का अपना, अथवा परमेश्वर पर केंद्रित शुभ समाचार हो सकता है।'
theological_decisions:
- issue: मरकुस में παραδοθῆναι और आगे आने वाली दुःखभोग-संबंधी शब्दावली का संबंध
  choice: पकड़वा दिए जाने
  alternative: गिरफ़्तार किए जाने
  rationale: मुख्य पाठ का रूप विरोधी सत्ता के हाथ सौंपे जाने का भाव तथा यीशु के आगे पकड़वाए जाने से कथात्मक संबंध बचाता है; केवल ‘गिरफ़्तार’ कहना कानूनी घटना को स्पष्ट करता, पर शब्द की व्यापक प्रतिध्वनि घटा देता।
- issue: τὸ εὐαγγέλιον τοῦ θεοῦ में सम्बन्धकारक का आशय
  choice: परमेश्वर का शुभ समाचार
  alternative: परमेश्वर की ओर से शुभ समाचार / परमेश्वर के विषय में शुभ समाचार
  rationale: यूनानी सम्बन्धकारक स्रोत, स्वामित्व और विषय-केंद्र—इन परस्पर जुड़े अर्थों में से किसी एक को अनिवार्य रूप से नहीं चुनता। हिन्दी का ‘परमेश्वर का’ वही सार्थक खुलापन बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शुभ समाचार’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी में पारंपरिक ‘सुसमाचार’ दिया गया है। ‘घोषित करने लगे’ सार्वजनिक उद्घोषणा और आरम्भ हुई सेवकाई—दोनों भाव व्यक्त करता है।
