- source_word: κατεδίωξεν
  choice: ढूँढ़ निकाला
  rationale: क्रिया καταδιώκω यहाँ किसी के पीछे लगकर उसे खोजने का भाव रखती है। संदर्भ में ‘ढूँढ़ निकाला’ स्वाभाविक हिन्दी है और खोज की सक्रियता तथा उसके सफल परिणाम को व्यक्त करता है; अधिक शाब्दिक ‘पीछे लग गए’ भी संभव है।
- source_word: αὐτὸν
  choice: यीशु को
  rationale: सर्वनाम का संकेत तत्काल पूर्ववर्ती संदर्भ में यीशु की ओर है। हिन्दी में अस्पष्टता से बचने के लिए नाम दोहराना स्वाभाविक है।
- source_word: Σίμων
  choice: शमौन
  rationale: यूनानी Σίμων के लिए मानक हिन्दी बाइबलीय लिप्यंतरण ‘शमौन’ रखा गया है।
- source_word: οἱ μετ’ αὐτοῦ
  choice: उसके साथी
  rationale: शाब्दिक अर्थ ‘जो उसके साथ थे’ है। ‘उसके साथी’ संक्षिप्त और स्वाभाविक है तथा समूह की पहचान के बारे में अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: καὶ
  choice: और
  rationale: यह संयोजक पिछले वृत्तांत से वाक्य को जोड़ता है और मरकुस की समन्वयी कथन-शैली को बनाए रखता है।
