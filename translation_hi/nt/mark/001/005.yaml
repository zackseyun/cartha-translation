revisions:
- from: और यहूदिया के पूरे इलाके के लोग और यरूशलेम के सभी निवासी उसके पास निकलकर जा रहे थे। वे अपने पापों को स्वीकार करते हुए यरदन नदी में उससे बपतिस्मा ले रहे थे।
  to: और यहूदिया के पूरे प्रदेश से और यरूशलेम के सभी निवासी निकलकर उसके पास जा रहे थे। वे अपने पापों को स्वीकार करते हुए यरदन नदी में उससे बपतिस्मा ले रहे थे।
  rationale: The revision retains the durative force of both imperfect verbs (‘जा रहे थे,’ ‘ले रहे थे’), the narrative-wide scope of the Judean region and Jerusalem’s inhabitants, the passive/agent relationship expressed idiomatically by ‘उससे बपतिस्मा ले रहे थे,’ and the attendant confession of sins. ‘यहूदिया के पूरे प्रदेश से’ is a natural Hindi way to express the Greek regional collective without over-specifying that every individual in Judea came.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T19:45:57Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly reflects the two imperfect verbs as ongoing past action, retains the collective force of πᾶσα/πάντες, identifies the Jordan as a river, and preserves the accompanying confession of sins. However, ‘यहूदिया के पूरे इलाके के लोग’ shifts πᾶσα from the Judean region itself to every person in it more directly than the Greek wording does. A wording that retains the regional collective expression is preferable.
  naturalness: The Hindi is generally clear and modern. ‘निकलकर जा रहे थे’ is somewhat heavy; ‘निकलकर उसके पास जा रहे थे’ is smoother and keeps the outward-going nuance. ‘बपतिस्मा ले रहे थे’ is idiomatic Hindi in this context.
  terminology: ‘बपतिस्मा,’ ‘यरदन नदी,’ and ‘अपने पापों को स्वीकार करते हुए’ are suitable, neutral, and readily understandable. No doctrinal interpretation has been added.
  issues:
  - severity: low
    issue: Scope and syntactic representation of πᾶσα ἡ Ἰουδαία χώρα
    rationale: ‘यहूदिया के पूरे इलाके के लोग’ makes ‘all’ modify the people explicitly, whereas the Greek literally presents ‘the whole Judean region’ as a collective geographical expression. ‘यहूदिया के पूरे प्रदेश से’ conveys the intended people coming from throughout the region without unnecessarily making an absolute claim about every individual.
  - severity: low
    issue: Awkward placement of ‘निकलकर’
    rationale: In ‘उसके पास निकलकर जा रहे थे,’ the participial sense is understandable but less fluent. Placing it before the destination reads more naturally in modern Hindi while preserving ἐξεπορεύετο.
  revised_text: और यहूदिया के पूरे प्रदेश से और यरूशलेम के सभी निवासी निकलकर उसके पास जा रहे थे। वे अपने पापों को स्वीकार करते हुए यरदन नदी में उससे बपतिस्मा ले रहे थे।
  revised_footnotes: []
  revision_rationale: The revision retains the durative force of both imperfect verbs (‘जा रहे थे,’ ‘ले रहे थे’), the narrative-wide scope of the Judean region and Jerusalem’s inhabitants, the passive/agent relationship expressed idiomatically by ‘उससे बपतिस्मा ले रहे थे,’ and the attendant confession of sins. ‘यहूदिया के पूरे प्रदेश से’ is a natural Hindi way to express the Greek regional collective without over-specifying that every individual in Judea came.
