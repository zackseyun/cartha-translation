id: MRK.1.5
reference: Mark 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐξεπορεύετο πρὸς αὐτὸν πᾶσα ἡ Ἰουδαία χώρα καὶ οἱ Ἱεροσολυμῖται ⸂πάντες, καὶ ἐβαπτίζοντο⸃ ⸂ὑπ’ αὐτοῦ ἐν τῷ Ἰορδάνῃ ποταμῷ⸃ ἐξομολογούμενοι τὰς ἁμαρτίας αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/005.yaml
  text: And all the Judean countryside and all the people of Jerusalem were going out to him, and they were being baptized by him in the Jordan River, confessing their sins.
translation:
  language: hi
  text: और यहूदिया के पूरे प्रदेश से और यरूशलेम के सभी निवासी निकलकर उसके पास जा रहे थे। वे अपने पापों को स्वीकार करते हुए यरदन नदी में उससे बपतिस्मा ले रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξεπορεύετο
  choice: निकलकर जा रहे थे
  rationale: अपूर्ण भूतकाल ongoing अथवा बार-बार होने वाली क्रिया दिखाता है; यह पदबंध उस निरंतर प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶσα ἡ Ἰουδαία χώρα
  choice: यहूदिया के पूरे इलाके के लोग
  rationale: χώρα का अर्थ क्षेत्र या इलाका है। यूनानी में स्थान का प्रयोग वहाँ के लोगों के लिए लाक्षणिक रूप से हुआ है; हिन्दी में ‘लोग’ स्पष्ट करना स्वाभाविक है, जबकि ‘पूरे’ πᾶσα की व्यापकता बनाए रखता है।
- source_word: οἱ Ἱεροσολυμῖται πάντες
  choice: यरूशलेम के सभी निवासी
  rationale: Ἱεροσολυμῖται यरूशलेम के निवासियों को सूचित करता है; ‘सभी निवासी’ आधुनिक हिन्दी में स्वाभाविक है और πάντες का सामूहिक बल बनाए रखता है।
- source_word: ἐβαπτίζοντο
  choice: बपतिस्मा ले रहे थे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार घटने वाली क्रिया को ‘ले रहे थे’ व्यक्त करता है। हिन्दी में यह प्रयोग स्वाभाविक है और कर्मवाच्य भाव तथा कर्ता से भिन्न बपतिस्मा देने वाले को अगले पदबंध में बनाए रखता है।
- source_word: ὑπ’ αὐτοῦ
  choice: उससे
  rationale: सर्वनाम का संकेत प्रसंग में यूहन्ना की ओर है; ‘उससे’ यूनानी सर्वनाम को सुरक्षित रखता है और अनावश्यक रूप से नाम नहीं जोड़ता।
- source_word: ἐν τῷ Ἰορδάνῃ ποταμῷ
  choice: यरदन नदी में
  rationale: ποταμός को ‘नदी’ के रूप में स्पष्ट रखा गया है और ἐν को स्थानवाचक ‘में’ से व्यक्त किया गया है।
- source_word: ἐξομολογούμενοι
  choice: स्वीकार करते हुए
  rationale: सहभागी कृदंत बपतिस्मे के साथ चल रही क्रिया बताता है; अपने पापों के संदर्भ में ‘स्वीकार करना’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: τὰς ἁμαρτίας αὐτῶν
  choice: अपने पापों को
  rationale: कर्ता की ओर लौटने वाले स्वामित्व को हिन्दी में ‘अपने’ स्वाभाविक रूप से व्यक्त करता है, और ‘पापों को’ क्रिया का सीधा कर्म है।
theological_decisions:
- issue: ‘पूरे’ और ‘सभी’ की व्यापकता
  choice: मूल के व्यापक सामूहिक कथन को ‘पूरे’ और ‘सभी’ के साथ बनाए रखना
  alternative: ‘बहुत-से लोग’ कहना
  rationale: यूनानी में πᾶσα और πάντες स्पष्ट रूप से हैं। कथन को गणितीय सार्वभौमिकता के रूप में बाध्य किए बिना उसकी कथात्मक व्यापकता सुरक्षित रखी गई है।
- issue: बपतिस्मे की रीति या धार्मिक महत्ता
  choice: स्थापित शब्द ‘बपतिस्मा’ रखना
  alternative: ‘डुबकी देना’ या ‘धोना’
  rationale: यह पद क्रिया की रीति अथवा बाद की धर्मवैज्ञानिक व्याख्या स्पष्ट नहीं करता। ‘बपतिस्मा’ किसी संप्रदाय-विशेष की धारणा आरोपित किए बिना मूल क्रिया को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यूनानी के अपूर्ण भूतकाल को दोनों मुख्य क्रियाओं में ‘जा रहे थे’ और ‘ले रहे थे’ से व्यक्त किया गया है। ‘यहूदिया का प्रदेश जा रहा था’ जैसी अस्वाभाविक हिन्दी से बचने के लिए मूल के स्थानवाचक लक्षणा को ‘इलाके के लोग’ के रूप में स्पष्ट किया गया है।
