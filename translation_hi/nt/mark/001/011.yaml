  text: καὶ φωνὴ ἐγένετο ἐκ τῶν οὐρανῶν· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν ⸀σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/011.yaml
  text: 'And a voice came from the heavens: “You are my beloved Son[b][a]; in you I am well pleased.”'
translation:
  language: hi
  text: 'और आकाशों[a] से एक वाणी आई: “तुम मेरे प्रिय पुत्र हो; तुमसे मैं प्रसन्न हूँ।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में “आकाशों” बहुवचन है; “आकाश से” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुममें मैंने आनंद पाया है” अथवा “तुमसे मुझे प्रसन्नता है।”
    reason: alternative_reading
lexical_decisions:
- source_word: φωνὴ ἐγένετο
  choice: यह वाणी हुई
  rationale: यूनानी मुहावरा किसी वाणी के सुनाई देने की घटना बताता है। हिंदी में “यह वाणी हुई” प्रसंग से जुड़ा, स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐκ τῶν οὐρανῶν
  choice: आकाशों से
  rationale: मूल यूनानी में बहुवचन है। “आकाशों से” उस रूप को बनाए रखता है और आधुनिक हिंदी में समझ में आता है।
- source_word: Σὺ εἶ
  choice: तू ... है
  rationale: प्रत्यक्ष दिव्य संबोधन में एकवचन “तू” निकटता और स्पष्टता व्यक्त करता है; अलग से बलवाचक शब्द जोड़ना आवश्यक नहीं है।
- source_word: ὁ υἱός μου ὁ ἀγαπητός
  choice: मेरा प्रिय पुत्र
  rationale: यह रूप पुत्र-संबंध और प्रेम—दोनों को संक्षेप, स्वाभाविकता और गरिमा के साथ व्यक्त करता है।
- source_word: ἐν σοὶ εὐδόκησα
  choice: तुझसे मैं प्रसन्न हूँ
  rationale: ἐν σοὶ का शाब्दिक रूप “तुझमें” संभव है, पर εὐδοκέω के साथ हिंदी में “तुझसे प्रसन्न” अधिक स्वाभाविक है। अओरिस्ट यहाँ वर्तमान में घोषित स्थायी अनुमोदन को व्यक्त कर सकता है; अन्य संभावनाएँ टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: यीशु को संबोधित दिव्य घोषणा में पुत्रत्व और प्रेम का संबंध
  choice: मेरा प्रिय पुत्र
  alternative: मेरा पुत्र, वह प्रिय
  rationale: चुना हुआ रूप मूल के पुत्रत्व और प्रेम दोनों को रखता है, पर बाद की धर्मशास्त्रीय शब्दावली नहीं जोड़ता।
- issue: εὐδόκησα के अओरिस्ट काल और ἐν σοὶ के अर्थ को हिंदी में व्यक्त करना
  choice: तुझसे मैं प्रसन्न हूँ
  alternative: तुझमें मैंने आनंद पाया है
  rationale: मुख्य पाठ वर्तमान घोषणा की स्वाभाविक हिंदी देता है, जबकि पूर्णतासूचक तथा अधिक शाब्दिक अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की कालगत और अर्थगत संभावना दबे नहीं।
- issue: οὐρανῶν के बहुवचन को बनाए रखना
  choice: आकाशों से
  alternative: आकाश से
  rationale: मूल भाषा की प्राथमिकता के अनुसार यूनानी बहुवचन रखा गया है; परिचित हिंदी एकवचन को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। प्रत्यक्ष दिव्य संबोधन में “तू/तुझसे” अपनाया गया है। मूल के οὐρανῶν बहुवचन को मुख्य पाठ में सुरक्षित रखा गया है और εὐδόκησα की वैकल्पिक कालगत छाया पादटिप्पणी में दी गई है।
