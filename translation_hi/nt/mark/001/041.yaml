  text: ⸀καὶ ⸀ὀργισθεὶς ἐκτείνας τὴν χεῖρα ⸂αὐτοῦ ἥψατο⸃ καὶ λέγει αὐτῷ· Θέλω, καθαρίσθητι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/041.yaml
  text: And being angry[a], he stretched out his hand, touched him, and said to him, “I am willing; be cleansed.”
translation:
  language: hi
  text: और क्रोधित होकर[a] उसने हाथ बढ़ाया, उसे छुआ और उससे कहा, “मैं चाहता हूँ; शुद्ध हो जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “क्रोधित होकर” के स्थान पर “करुणा से भरकर” है।
    reason: textual_variant
lexical_decisions:
- source_word: ὀργισθεὶς
  choice: क्रोधित होकर
  rationale: SBLGNT के मुद्रित पाठ में ὀργισθείς है, जिसका सीधा अर्थ क्रोधित होना है। यह अनुवाद उस कठिन पाठ को नरम किए बिना स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκτείνας τὴν χεῖρα
  choice: उसने हाथ बढ़ाया
  rationale: कृदन्तीय वाक्यांश को हिन्दी कथन-शैली में क्रमिक क्रिया के रूप में व्यक्त किया गया है; इससे ठोस शारीरिक क्रिया स्पष्ट रहती है।
- source_word: ἥψατο
  choice: उसे छुआ
  rationale: इस प्रसंग में ἅπτω का मध्य रूप स्पर्श करने को दर्शाता है। यह कोढ़ी के साथ यीशु के प्रत्यक्ष शारीरिक संपर्क को स्पष्ट रखता है।
- source_word: λέγει αὐτῷ
  choice: उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली के अनुसार भूतकाल में व्यक्त किया गया है।
- source_word: Θέλω
  choice: मैं चाहता हूँ
  rationale: यहाँ θέλω तत्पर इच्छा या सहमति व्यक्त करता है। हिन्दी में “मैं चाहता हूँ” सीधे और स्वाभाविक रूप से उसी उत्तर को व्यक्त करता है, यद्यपि प्रसंगगत भाव “मैं तैयार हूँ” भी हो सकता है।
- source_word: καθαρίσθητι
  choice: शुद्ध हो जा
  rationale: निष्क्रिय आज्ञार्थक रूप को स्वाभाविक हिन्दी में रखा गया है। “शुद्ध” रोग से चंगाई और धार्मिक शुद्धता—दोनों से जुड़े अर्थ-संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु की भावावस्था बताने वाले कृदन्त का पाठांतर
  choice: मुख्य पाठ में SBLGNT के ὀργισθείς का अनुवाद “क्रोधित होकर”
  alternative: करुणा से भरकर
  rationale: मूल-भाषा के दिए गए आलोचनात्मक पाठ को प्राथमिकता दी गई है। यह पाठ यीशु के क्रोध का कारण निर्दिष्ट नहीं करता, इसलिए अनुवाद भी उसे नहीं समझाता। अर्थपूर्ण पाठांतर को पादटिप्पणी में रखा गया है ताकि पाठगत और धर्मवैचारिक तनाव बना रहे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। छोटे वाक्य और प्रचलित शब्द रखे गए हैं; साथ ही “शुद्ध” के द्वारा प्रसंग के शारीरिक और धार्मिक दोनों अर्थ-संकेत सुरक्षित हैं।
