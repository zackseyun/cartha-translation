  text: Ὀψίας δὲ γενομένης, ὅτε ⸀ἔδυ ὁ ἥλιος, ἔφερον πρὸς αὐτὸν πάντας τοὺς κακῶς ἔχοντας καὶ τοὺς δαιμονιζομένους·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/032.yaml
  text: When evening came[a], when the sun had set[d][c][b], they brought to him all who were sick and those who were demon-possessed.
translation:
  language: hi
  text: शाम होने पर, जब सूरज डूब गया, लोग सभी बीमारों और दुष्टात्माओं से ग्रस्त लोगों को उसके पास ला रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὀψίας δὲ γενομένης
  choice: जब शाम हुई
  rationale: यह संबंधवाचक स्वतंत्र रचना समय के परिवर्तन को सूचित करती है। ‘जब शाम हुई’ आधुनिक हिन्दी में स्वाभाविक है और मूल का कालगत अर्थ बनाए रखती है।
- source_word: ὅτε ἔδυ ὁ ἥλιος
  choice: और सूरज डूब गया
  rationale: ὅτε यहाँ सूर्यास्त के समय को और स्पष्ट करता है। ‘सूरज डूब गया’ सरल और स्वाभाविक हिन्दी है; ‘और’ शाम होने तथा सूर्य डूबने के निकट-समानांतर समय-सूचकों को बिना अनावश्यक कारणात्मक व्याख्या के जोड़ता है।
- source_word: ἔφερον
  choice: लाने लगे
  rationale: अपूर्ण भूतकालीन क्रिया चलती हुई या बार-बार होने वाली गतिविधि दिखाती है। ‘लाने लगे’ कथा में आरम्भ और जारी प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς αὐτὸν
  choice: यीशु के पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर गति बताता है। हिन्दी में केवल ‘उसके पास’ का संदर्भ अस्पष्ट लग सकता है, इसलिए निकटवर्ती संदर्भ के व्यक्ति यीशु का नाम स्पष्टता के लिए रखा गया है।
- source_word: πάντας τοὺς κακῶς ἔχοντας
  choice: सभी बीमारों
  rationale: मुहावरे का अर्थ ‘जो अस्वस्थ थे’ है। ‘सभी बीमारों’ πάντας की व्यापकता को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: τοὺς δαιμονιζομένους
  choice: उन लोगों को, जो दुष्टात्माओं के वश में थे
  rationale: यह अभिव्यक्ति व्यक्तियों पर दुष्टात्माओं की वास्तविक सत्ता या प्रभाव को दर्शाती है। यह हिन्दी रूप उस अर्थ को बनाए रखता है, पर मूल से आगे बढ़कर उस दशा की विस्तृत प्रकृति निर्धारित नहीं करता।
theological_decisions:
- issue: δαιμονιζομένους का ऐसा अनुवाद जो दुष्टात्मिक गतिविधि को नकारे भी नहीं और मूल से अधिक विशिष्ट भी न हो
  choice: जो दुष्टात्माओं के वश में थे
  alternative: दुष्टात्मा-ग्रस्त; जिन्हें दुष्टात्माएँ सताती थीं
  rationale: ‘दुष्टात्माओं के वश में’ पाठ में निहित वास्तविक दुष्टात्मिक प्रभाव को स्पष्ट रखता है। ‘ग्रस्त’ कुछ पाठकों को पूर्ण स्वामित्व का अधिक निश्चित अर्थ दे सकता है, जबकि ‘सताती थीं’ यूनानी पद की शक्ति को कम कर सकता है।
- issue: ἔφερον का क्रियापक्ष
  choice: लाने लगे
  alternative: लाए; ला रहे थे
  rationale: मूल का imperfect चलती या पुनरावृत्त गतिविधि दिखाता है। ‘लाने लगे’ हिन्दी कथा-प्रवाह में लोगों के लगातार आने की शुरुआत को सहजता से व्यक्त करता है।
- issue: शाम और सूर्यास्त के दोहरे समय-सूचक का संबंध
  choice: जब शाम हुई, और सूरज डूब गया
  alternative: शाम होने पर, सूरज डूबने के बाद
  rationale: मूल में ὅτε है, जो सामान्यतः ‘जब’ का अर्थ देता है। इसे अनिवार्य रूप से ‘बाद’ बनाना संभावित क्रम को अधिक निश्चित कर देगा; चुना हुआ रूप मूल की कुछ हद तक दोहरावपूर्ण और कालगत संरचना बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथा-शैली। ‘लोग’ यूनानी क्रिया में निहित अनिश्चित बहुवचन कर्ता को स्वाभाविक हिन्दी में स्पष्ट करता है। ‘यीशु’ संदर्भगत स्पष्टता के लिए प्रयुक्त है; फुटनोट अधिक शब्दानुरूप ‘उसके’ को सुरक्षित रखता है।
