  text: καὶ ⸀εὐθὺς ἀφέντες τὰ ⸀δίκτυα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/018.yaml
  text: And immediately they left the nets and followed him[a].
translation:
  language: hi
  text: और वे तुरन्त जाल छोड़कर उसके पीछे चल पड़े।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: मरकुस के सरल कथात्मक प्रवाह को बनाए रखने के लिए सामान्य संयोजक के रूप में अनूदित।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह शब्द बिना विलंब की तत्परता व्यक्त करता है; ‘तुरन्त’ स्वाभाविक और आधुनिक हिन्दी है।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले की क्रिया बताता है; हिन्दी में ‘छोड़कर’ इस क्रम को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ δίκτυα
  choice: जाल
  rationale: मछली पकड़ने के जाल के लिए हिन्दी में ‘जाल’ स्वाभाविक है। यूनानी में स्वामित्व स्पष्ट नहीं किया गया, इसलिए ‘अपने’ नहीं जोड़ा गया।
- source_word: ἠκολούθησαν
  choice: पीछे हो लिए
  rationale: यह प्रयोग वास्तविक रूप से यीशु के पीछे चलने और उभरते शिष्यत्व—दोनों संकेतों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: αὐτῷ
  choice: उसके
  rationale: मूल पाठ में सर्वनाम है, जिसका निकट संदर्भ में संकेत यीशु की ओर है; इसलिए नाम जोड़ने के बजाय सर्वनाम रखा गया।
theological_decisions:
- issue: ἠκολούθησαν में शिष्यत्व का भाव
  choice: ‘उसके पीछे हो लिए’ रखा गया, बिना ‘उसके शिष्य बन गए’ जैसे विस्तार के।
  alternative: ‘उसके पीछे चले’ या ‘उसके अनुयायी बन गए’
  rationale: मूल क्रिया भौतिक रूप से पीछे चलने और शिष्यत्व के व्यापक अर्थ—दोनों के लिए खुली है। चुना हुआ अनुवाद इस अर्थ-स्तर को बनाए रखता है और बाद की धर्मवैज्ञानिक व्याख्या को वाक्य में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘तुरन्त’ मरकुस की तात्कालिकता को व्यक्त करता है। पद में किसी पाठगत या अर्थगत विकल्प के लिए आवश्यक पाद-टिप्पणी नहीं है; अंग्रेज़ी पाद-टिप्पणी ‘at once’ उसी अर्थ का शैलीगत पर्याय है, अलग अर्थ नहीं।
