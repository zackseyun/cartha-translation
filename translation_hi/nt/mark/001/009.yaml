  text: Καὶ ἐγένετο ἐν ἐκείναις ταῖς ἡμέραις ἦλθεν Ἰησοῦς ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας καὶ ἐβαπτίσθη ⸂εἰς τὸν Ἰορδάνην ὑπὸ Ἰωάννου⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/009.yaml
  text: And it happened in those days that Jesus came from Nazareth of Galilee and was baptized in the Jordan by John[a].
translation:
  language: hi
  text: उन दिनों ऐसा हुआ कि यीशु गलील के नासरत से आए और यूहन्ना से यरदन में बपतिस्मा लिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के भीतर।” यूनानी पूर्वसर्ग का अधिक शाब्दिक अर्थ “के भीतर” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह यूनानी कथात्मक संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘और ऐसा हुआ’ हिन्दी में अनावश्यक रूप से भारी लगता।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों
  rationale: समय-सूचक वाक्यांश का सीधा, स्वाभाविक और गरिमापूर्ण अनुवाद।
- source_word: ἦλθεν
  choice: आए
  rationale: मूल गति-क्रिया का सामान्य हिन्दी रूप; यीशु के लिए प्रचलित आदरसूचक बहुवचन रखा गया है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: आधुनिक हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: ἀπὸ Ναζαρὲτ τῆς Γαλιλαίας
  choice: गलील के नासरत से
  rationale: यूनानी संबंधवाचक संरचना को स्वाभाविक हिन्दी स्थान-पहचान के रूप में रखा गया है।
- source_word: ἐβαπτίσθη
  choice: बपतिस्मा लिया
  rationale: यूनानी कर्मवाच्य का हिन्दी में स्वाभाविक समतुल्य है। ‘डुबकी ली’ विधि को आवश्यकता से अधिक निश्चित कर देता, जबकि ‘बपतिस्मा दिया गया’ कम स्वाभाविक है।
- source_word: εἰς τὸν Ἰορδάνην
  choice: यरदन नदी में
  rationale: बपतिस्मा के स्थान को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी में केवल स्थान-नाम है, पर हिन्दी में ‘नदी’ जोड़ना पहचान स्पष्ट करता है और कोई विवादित अर्थ नहीं जोड़ता; εἰς के दिशात्मक भाव को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὑπὸ Ἰωάννου
  choice: यूहन्ना से
  rationale: 'कर्मवाच्य में व्यक्तिगत कर्ता को हिन्दी के स्वाभाविक प्रयोग द्वारा व्यक्त करता है: किसी से बपतिस्मा लेना।'
theological_decisions:
- issue: संप्रदायगत संवेदनशीलता वाले संदर्भ में βαπτίζω का अनुवाद
  choice: बपतिस्मा लिया
  alternative: डुबकी ली
  rationale: ‘बपतिस्मा’ घटना को विश्वसनीय रूप से नाम देता है, लेकिन विधि के विषय में मूल पाठ से अधिक संकीर्ण दावा नहीं करता।
- issue: εἰς में स्थान अथवा भीतर की ओर गति
  choice: यरदन नदी में
  alternative: यरदन नदी में जाकर
  rationale: मुख्य पाठ में हिन्दी का स्वाभाविक स्थान-सूचक प्रयोग रखा गया है, जबकि यूनानी पूर्वसर्ग में संभावित दिशात्मक भाव को पादटिप्पणी में बताया गया है।
