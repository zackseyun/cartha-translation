  text: Καὶ εὐθὺς τὸ πνεῦμα αὐτὸν ἐκβάλλει εἰς τὴν ἔρημον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/012.yaml
  text: And immediately the Spirit drives him out into the wilderness[a].
translation:
  language: hi
  text: और तुरन्त आत्मा ने उसे निर्जन प्रदेश में धकेल दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बलपूर्वक भेज दिया” अथवा “निकाल दिया।” यूनानी क्रिया बलपूर्ण है; मरकुस इसी क्रिया का प्रयोग प्रायः दुष्टात्माओं को निकालने के लिए भी करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सरल संयोजक के रूप में मरकुस की प्रवाहपूर्ण कथा-शैली को बनाए रखता है; इसे केवल कालक्रमसूचक ‘तब’ बनाकर अधिक अर्थ नहीं जोड़ा गया।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: मरकुस की कथा में तीव्र गति और तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: निश्चित लेख और निकटवर्ती बपतिस्मा-प्रसंग से अभिप्राय परमेश्वर के आत्मा से है; मूल में ‘पवित्र’ शब्द न होने के कारण उसे नहीं जोड़ा गया।
- source_word: αὐτὸν
  choice: उसे
  rationale: प्रत्यक्ष कर्मवाचक सर्वनाम है, जिसका संदर्भ पिछले प्रसंग के यीशु से है।
- source_word: ἐκβάλλει
  choice: धकेल दिया
  rationale: क्रिया की प्रबलता को ‘ले गया’ या केवल ‘भेजा’ की अपेक्षा अधिक स्पष्ट रखता है। हिन्दी की पूर्ण भूतकालीन कथा-शैली में ‘दिया’ स्वाभाविक है, यद्यपि यूनानी में ऐतिहासिक वर्तमान है।
- source_word: εἰς τὴν ἔρημον
  choice: निर्जन प्रदेश में
  rationale: ἔρημος का आशय सुनसान, अनावाद स्थान है; ‘निर्जन प्रदेश’ इसे केवल रेतीले मरुस्थल तक सीमित नहीं करता। ‘में’ गमन की दिशा को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: यीशु के प्रति आत्मा की क्रिया का बल
  choice: ‘धकेल दिया’ कहकर ἐκβάλλει की प्रबलता बनाए रखी गई।
  alternative: ‘ले गया’ या ‘भेज दिया’
  rationale: मूल क्रिया असामान्य रूप से बलपूर्ण है और मरकुस में दुष्टात्माओं को निकालने के लिए भी प्रयुक्त होती है। इसे नरम करने से जंगल की परीक्षा के पीछे आत्मा की पहल से उत्पन्न पाठगत तनाव दब जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘निर्जन प्रदेश’ भौगोलिक अर्थ को अनावश्यक रूप से रेतीले ‘रेगिस्तान’ तक सीमित नहीं करता। मुख्य पाठ में ‘धकेल दिया’ जानबूझकर तीखा है, ताकि मूल क्रिया का बल बना रहे।
