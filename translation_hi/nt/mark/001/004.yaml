  text: ἐγένετο Ἰωάννης ⸀ὁ βαπτίζων ἐν τῇ ⸀ἐρήμῳ κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/004.yaml
  text: John the Baptist appeared in the wilderness[a], proclaiming a baptism of repentance for the forgiveness of sins.
translation:
  language: hi
  text: यूहन्ना बपतिस्मा देनेवाला निर्जन प्रदेश में प्रकट हुआ और पापों की क्षमा के लिए पश्चाताप के बपतिस्मे की घोषणा करता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यूहन्ना बपतिस्मा देनेवाला निर्जन प्रदेश में आया, और पापों की क्षमा के लिए पश्चाताप के बपतिस्मे की घोषणा करता था।”
    reason: ἐγένετο के कथात्मक प्रयोग को ‘प्रकट हुआ’ या ‘आया’ दोनों रूपों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἐγένετο
  choice: प्रकट हुआ
  rationale: मरकुस के वृत्तांत में यह प्रयोग यूहन्ना के दृश्य पर आने का संकेत देता है; ‘प्रकट हुआ’ इस कथात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Ἰωάννης
  choice: यूहन्ना
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित और व्यापक रूप से पहचाना जानेवाला नाम-रूप है।
- source_word: ὁ βαπτίζων
  choice: बपतिस्मा देनेवाला
  rationale: संज्ञा-सदृश सविशेष कृदंत यूहन्ना को उसके बपतिस्मा देने के कार्य से पहचानता है। यह रूप अर्थ को स्पष्ट रखता है और केवल परंपरागत उपाधि पर निर्भर नहीं रहता।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἔρημος किसी निर्जन या वीरान क्षेत्र को सूचित करता है; यह अनुवाद रेतीले मरुस्थल का अनावश्यक भौगोलिक अर्थ आरोपित नहीं करता।
- source_word: κηρύσσων
  choice: घोषित करने लगा
  rationale: κηρύσσω के सार्वजनिक, संदेशवाहक-सदृश ऐलान के भाव को सामान्य आधुनिक हिन्दी में व्यक्त करता है और मुख्य क्रिया के साथ जारी गतिविधि दर्शाता है।
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: यह मूल शब्द के धार्मिक-सांस्कृतिक अर्थ का प्रचलित और पहचाना हुआ हिन्दी रूप है; ‘धुलाई’ या ‘डुबकी’ कहना यहाँ अनावश्यक रूप से अर्थ सीमित करेगा।
- source_word: μετανοίας
  choice: मन-फिराव का
  rationale: μετάνοια केवल खेद या बौद्धिक मत-परिवर्तन नहीं, बल्कि भीतर से दिशा बदलने को व्यक्त करता है। ‘मन-फिराव’ यह सक्रिय नैतिक और आत्मिक भाव बनाए रखता है।
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा के लिए
  rationale: यह स्वाभाविक हिन्दी में उद्देश्य अथवा परिणाम की खुली हुई संबंध-संभावना बनाए रखता है और εἰς को किसी एक बाद की धर्मवैज्ञानिक व्याख्या तक सीमित नहीं करता।
- source_word: ἁμαρτιῶν
  choice: पापों
  rationale: मूल यूनानी का बहुवचन सुरक्षित रखा गया है।
theological_decisions:
- issue: बपतिस्मा, मन-फिराव और पापों की क्षमा का संबंध
  choice: ‘पापों की क्षमा के लिए मन-फिराव का बपतिस्मा’
  alternative: ‘मन-फिराव दर्शानेवाला बपतिस्मा’, या ‘ऐसा बपतिस्मा जो मन-फिराव के द्वारा क्षमा लाता है’
  rationale: यूनानी वाक्य इन बातों को निकटता से जोड़ता है, पर यह स्पष्ट नहीं करता कि बपतिस्मा साधन, चिह्न या घोषणा है। अनुवाद इस धर्मवैज्ञानिक तनाव को बिना सुलझाए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘निर्जन प्रदेश’ भौगोलिक अर्थ को खुला रखता है; ‘मन-फिराव’ पश्चाताप से आगे जीवन-दिशा बदलने का भाव स्पष्ट करता है। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
