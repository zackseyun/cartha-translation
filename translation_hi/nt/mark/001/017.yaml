  yaml_path: translation/nt/mark/001/017.yaml
  text: And Jesus said to them, “Come after me, and I will make you become fishers of men.”
translation:
  language: hi
  text: यीशु ने उनसे कहा, “मेरे पीछे आओ, और मैं तुम्हें मनुष्यों के मछुआरे बनाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε ὀπίσω μου
  choice: मेरे पीछे आओ
  rationale: यह यूनानी पदबंध शिष्य बनकर यीशु के पीछे चलने का आह्वान करता है; हिन्दी में यह रूप स्वाभाविक रहते हुए मूल बिंब को बनाए रखता है।
- source_word: ποιήσω ὑμᾶς γενέσθαι
  choice: मैं तुम्हें ... बनाऊँगा
  rationale: यूनानी में शाब्दिक भाव ‘मैं तुम्हें ऐसा बनाऊँगा कि तुम बन जाओ’ है। हिन्दी का संक्षिप्त रूप उसी परिवर्तनकारी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἁλιεῖς ἀνθρώπων
  choice: मनुष्यों के मछुए
  rationale: ‘मछुए’ मूल रूपक को सुरक्षित रखता है, और ἀνθρώπων यहाँ समस्त मनुष्यों को सूचित करता है, इसलिए ‘मनुष्यों’ चुना गया है, न कि केवल पुरुषों को सूचित करने वाला शब्द।
theological_decisions:
- issue: यीशु के आह्वान और भावी रूपांतरण के बीच संबंध
  choice: “मेरे पीछे आओ, और मैं तुम्हें ... बनाऊँगा”
  alternative: “मेरे पीछे चलो, ताकि मैं तुम्हें ... बनाऊँ”
  rationale: मूल पाठ में दो आज्ञार्थक/भावी कथनों का समन्वय है, स्पष्ट उद्देश्यसूचक ‘ताकि’ नहीं; इसलिए उस संबंध को अधिक स्पष्ट करके नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। परिचित बाइबलीय रूपक ‘मनुष्यों के मछुए’ को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
