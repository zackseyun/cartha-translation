  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘कड़ी चेतावनी’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणियाँ यूनानी क्रियाओं की भावात्मक और बलपूर्ण व्यापकता सुरक्षित रखती हैं। कर्ता यूनानी में निहित है; प्रसंगगत स्पष्टता के लिए ‘यीशु’ व्यक्त किया गया है।
