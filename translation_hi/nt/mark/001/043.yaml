- source_word: εὐθύς
  choice: तुरन्त
  rationale: यह मरकुस की कथा में तत्कालता और तेज गति को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: ἐξέβαλεν
  choice: वहाँ से निकाल दिया
  rationale: ἐκβάλλω तटस्थ रूप से ‘भेजने’ की अपेक्षा अधिक बलपूर्ण क्रिया है। ‘निकाल दिया’ उस बल को बनाए रखता है; प्रसंग के आधार पर ‘वहाँ से’ हिन्दी में क्रिया की दिशा स्पष्ट करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: कर्मकारक सर्वनाम उसी चंगे किए गए व्यक्ति की ओर संकेत करता है।
theological_decisions:
- issue: चंगे किए गए व्यक्ति के प्रति यीशु के व्यवहार का स्वर
  choice: यीशु की चेतावनी और विदाई की स्पष्ट कठोरता को बनाए रखा गया है, पर इसे पापपूर्ण क्रोध या उस व्यक्ति के प्रति शत्रुता नहीं कहा गया।
  alternative: इसे केवल भावहीन दृढ़ निर्देश मानना, अथवा व्यक्ति को ही डाँटने और दोषी ठहराने के अर्थ में लेना।
  rationale: ἐμβριμησάμενος और ἐξέβαλεν दोनों तीव्र शब्द हैं। अनुवाद उस तनाव को सुरक्षित रखता है, जबकि पाठ से आगे बढ़कर यीशु की मनोदशा या नैतिक दोष के विषय में निष्कर्ष नहीं जोड़ता।
