- source_word: καὶ
  choice: और
  rationale: यह साधारण संयोजक मरकुस की प्रवाहपूर्ण कथा-शैली को बनाए रखता है।
- source_word: ἐμβριμησάμενος
  choice: कड़ी चेतावनी देकर
  rationale: यह कृदन्त तीव्र भाव के साथ कठोरतापूर्वक निर्देश देने या चेताने का अर्थ व्यक्त कर सकता है। यह चयन उसकी कठोरता और निर्देशात्मक बल—दोनों को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
