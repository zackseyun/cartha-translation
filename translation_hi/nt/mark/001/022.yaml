  text: καὶ ἐξεπλήσσοντο ἐπὶ τῇ διδαχῇ αὐτοῦ, ἦν γὰρ διδάσκων αὐτοὺς ὡς ἐξουσίαν ἔχων καὶ οὐχ ὡς οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/022.yaml
  text: And they were astonished at his teaching[a], for he was teaching them as one having authority, and not as the scribes.
translation:
  language: hi
  text: और वे उसकी शिक्षा[a] से चकित हो रहे थे, क्योंकि वह उन्हें अधिकार रखने वाले की तरह सिखा रहा था, न कि शास्त्रियों की तरह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके उपदेश से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεπλήσσοντο
  choice: चकित होते थे
  rationale: अपूर्णकालीन रूप उनकी लगातार या बार-बार होनेवाली प्रबल प्रतिक्रिया दिखाता है; ‘चकित होते थे’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπὶ τῇ διδαχῇ αὐτοῦ
  choice: उसके उपदेश से
  rationale: यह पद उसके सिखाने की विषय-वस्तु अथवा ढंग पर हुई प्रतिक्रिया को दर्शाता है। ‘उपदेश’ यहाँ संज्ञा διδαχή का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἦν γὰρ διδάσκων
  choice: क्योंकि वह ... सिखा रहा था
  rationale: ἦν के साथ वर्तमान कृदंत जारी क्रिया पर बल देता है; ‘सिखा रहा था’ उस पक्ष को बनाए रखता है।
- source_word: ὡς ἐξουσίαν ἔχων
  choice: अधिकार रखनेवाले के समान
  rationale: यह अनुवाद ὡς द्वारा व्यक्त तुलना और ἐξουσία के ‘अधिकार’ अर्थ, दोनों को स्पष्ट रखता है।
- source_word: γραμματεῖς
  choice: शास्त्रियों
  rationale: यह यहूदी व्यवस्था के लेखकीय विद्वानों के लिए प्रचलित और सीधा बाइबलीय हिन्दी पद है; ‘व्यवस्था के शिक्षक’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: शास्त्रियों के विपरीत यीशु के अधिकार का स्वरूप
  choice: कथन को वर्णनात्मक रखते हुए ‘अधिकार रखनेवाले के समान’ अनुवाद किया गया है।
  alternative: ‘दिव्य अधिकार के साथ’ जैसे अधिक व्याख्यात्मक शब्द जोड़े जा सकते थे।
  rationale: यह वाक्य यीशु के सिखाने के ढंग को शास्त्रियों से अलग बताता है, पर इसी वाक्य में उस अधिकार के स्रोत या स्वरूप को स्पष्ट नहीं करता; इसलिए अनुवाद कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण कथात्मक शैली। ‘शास्त्री’ पारंपरिक बाइबलीय पद है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए स्पष्ट रखा गया है।
