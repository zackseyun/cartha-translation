  text: καὶ ⸀εὐθὺς ἀναβαίνων ⸀ἐκ τοῦ ὕδατος εἶδεν σχιζομένους τοὺς οὐρανοὺς καὶ τὸ πνεῦμα ⸀ὡς περιστερὰν καταβαῖνον ⸀εἰς αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/010.yaml
  text: And immediately[a], as he was coming up out of the water[b], he saw the heavens being torn open and the Spirit descending like a dove upon him.
translation:
  language: hi
  text: और तुरंत, पानी में से ऊपर आते समय, उसने आकाशों को फटते हुए[a] और आत्मा को कबूतर के समान उसके ऊपर[b] उतरते देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाशों को चीरकर खुलते हुए।’ यहाँ प्रयुक्त यूनानी क्रिया केवल ‘खुलने’ से अधिक प्रबल है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके भीतर।’ यूनानी εἰς का अर्थ ‘भीतर’ हो सकता है, पर यहाँ आत्मा के उतरने के प्रसंग में ‘उसके ऊपर’ अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरंत
  rationale: यह मरकुस की कथा की तात्कालिकता और सजीव गति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀναβαίνων ἐκ τοῦ ὕδατος
  choice: पानी में से ऊपर आते ही
  rationale: वर्तमान कृदन्त की मुख्य क्रिया के साथ समकालिकता और ἐκ के ‘में से बाहर’ भाव को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἶδεν
  choice: उसने ... देखा
  rationale: दृष्टि की साधारण भूतकालिक क्रिया का सीधा अनुवाद है।
- source_word: σχιζομένους τοὺς οὐρανούς
  choice: आकाशों को फटते हुए
  rationale: σχίζω की प्रबल और नाटकीय छवि को केवल ‘खुलते हुए’ की अपेक्षा अधिक ठीक से सुरक्षित रखता है; बहुवचन οὐρανούς के कारण ‘आकाशों’ रखा गया है।
- source_word: τὸ πνεῦμα
  choice: आत्मा
  rationale: संदर्भ में यह परमेश्वर के आत्मा का संकेत है, पर मूल पाठ स्पष्ट रूप से ‘पवित्र आत्मा’ नहीं कहता; इसलिए स्रोत की अभिव्यक्ति बनाए रखी गई है।
- source_word: ὡς περιστερὰν
  choice: कबूतर के समान
  rationale: तुलना को बनाए रखता है और यह निश्चित नहीं करता कि समानता रूप, गति या किसी अन्य बात में थी।
- source_word: καταβαῖνον
  choice: उतरते
  rationale: καταβαίνω की नीचे आने की गति को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: εἰς αὐτόν
  choice: अपने ऊपर
  rationale: आत्मा के उतरने के इस प्रसंग में यह स्वाभाविक हिन्दी प्रयोग है, जबकि ‘अपने भीतर’ की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ‘आत्मा’ का संदर्भ
  choice: ईश्वरीय आत्मा, पर अनुवाद में केवल ‘आत्मा’
  alternative: ‘पवित्र आत्मा’
  rationale: बपतिस्मा का प्रसंग ईश्वरीय आत्मा की ओर संकेत करता है, किंतु यूनानी पाठ τὸ πνεῦμα कहता है, न कि स्पष्ट रूप से ‘पवित्र आत्मा’; इसलिए अतिरिक्त विशेषण नहीं जोड़ा गया।
- issue: कबूतर से तुलना का आशय
  choice: ‘कबूतर के समान’ कहकर तुलना को खुला रखना
  alternative: आत्मा ने कबूतर का रूप लिया या कबूतर जैसी गति से उतरा
  rationale: ὡς तुलना प्रकट करता है, पर समानता का सटीक बिंदु निर्धारित नहीं करता; अनुवाद इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: εἰς αὐτόν की दिशा
  choice: ‘अपने ऊपर’
  alternative: ‘अपने भीतर’
  rationale: εἰς में ‘भीतर’ का अर्थ संभव है, पर आत्मा के उतरने के साथ ‘ऊपर’ प्रसंगानुकूल और स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आकाशों’ सामान्य बोलचाल की अपेक्षा कुछ अधिक बाइबिलीय है, किंतु मूल के स्पष्ट बहुवचन और धर्मवैचारिक अनुगूँज को सुरक्षित रखता है।
