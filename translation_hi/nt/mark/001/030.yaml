  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य में अनावश्यक आरंभिक संयोजक नहीं जोड़ा गया। मुख्य पाठ में स्वाभाविक हिन्दी भूतकाल रखा गया है, जबकि ऐतिहासिक वर्तमान को पादटिप्पणी में बताया गया है।
