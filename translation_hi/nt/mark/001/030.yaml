  yaml_path: translation/nt/mark/001/030.yaml
  text: Simon’s mother-in-law was lying sick with a fever[b][a], and immediately they told him about her.
translation:
  language: hi
  text: शमौन की सास बुखार में पड़ी हुई थी, और उन्होंने तुरन्त यीशु को उसके बारे में बताया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल यूनानी में यहाँ ऐतिहासिक वर्तमान है: “वे उसे उसके बारे में बताते हैं।”'
    reason: मूल यूनानी की कथात्मक काल-विशेषता को सुरक्षित रखने वाला वैकल्पिक शाब्दिक रूप।
lexical_decisions:
- source_word: πενθερὰ Σίμωνος
  choice: शमौन की सास
  rationale: πενθερά का सामान्य अर्थ ‘सास’ है; संबंधवाचक Σίμωνος के साथ यह स्वाभाविक और सटीक हिन्दी है।
- source_word: κατέκειτο
  choice: पड़ी हुई थी
  rationale: अपूर्णकालीन रूप लगातार बनी हुई अवस्था को व्यक्त करता है; ‘पड़ी हुई थी’ इस स्थिति को सहज हिन्दी में रखता है और ‘बिस्तर से लगी’ जैसी अधिक प्रबल व्याख्या नहीं जोड़ता।
- source_word: πυρέσσουσα
  choice: बुखार में
  rationale: यह कृदन्त बुखार से पीड़ित होने को दर्शाता है। ‘बुखार में पड़ी हुई थी’ आधुनिक हिन्दी में स्वाभाविक संयुक्त अभिव्यक्ति है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह तत्परता और बिना विलंब के होने का भाव सुरक्षित रखता है तथा मरकुस की तीव्र कथाशैली के अनुरूप है।
- source_word: λέγουσιν αὐτῷ
  choice: उन्होंने यीशु को ... बताया
  rationale: यूनानी में शाब्दिक रूप से ‘वे उससे कहते हैं’ ऐतिहासिक वर्तमान है। हिन्दी कथन-प्रवाह में भूतकाल ‘बताया’ अधिक स्वाभाविक है; स्पष्टता के लिए संदर्भगत सर्वनाम ‘उसे’ को ‘यीशु को’ किया गया है।
- source_word: περὶ αὐτῆς
  choice: उसके बारे में
  rationale: περί के संबंधकारक के साथ सामान्य अर्थ ‘के बारे में’ है।
