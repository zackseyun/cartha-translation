  alternative: एक अशुद्ध आत्मा के वश में था
  rationale: चुना हुआ पाठ यूनानी अभिव्यक्ति के संबंधात्मक भाव को स्पष्ट करता है, किंतु ‘वश में’ कहकर नियंत्रण या अधिकार की मात्रा को स्रोत से अधिक निश्चित नहीं करता।
