  rationale: अनिश्चित कर्ता के साथ अस्तित्व या उपस्थिति का भाव हिन्दी में ‘एक मनुष्य था’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: συναγωγῇ αὐτῶν
  choice: उनकी आराधनालय में
  rationale: συναγωγή यहाँ यहूदी आराधनालय को सूचित करता है और αὐτῶν को ‘उनकी’ के रूप में सुरक्षित रखा गया है।
- source_word: ἄνθρωπος
  choice: एक मनुष्य
  rationale: यह पद कथा में एक विशिष्ट पुरुष व्यक्ति की ओर संकेत करता है; ‘मनुष्य’ गरिमापूर्ण और स्रोत-समीप है।
- source_word: ἐν πνεύματι ἀκαθάρτῳ
  choice: जिसमें एक अशुद्ध आत्मा थी
  rationale: यह स्वाभाविक हिन्दी में आत्मा और मनुष्य के संबंध को व्यक्त करता है, पर ‘वश में था’ या ‘ग्रस्त था’ जैसी अधिक व्याख्यात्मक भाषा नहीं जोड़ता।
- source_word: ἀκαθάρτῳ
  choice: अशुद्ध
  rationale: यह शब्द धार्मिक, नैतिक और आत्मिक अशुद्धता की अर्थ-छाया को बनाए रखता है।
- source_word: ἀνέκραξεν
  choice: वह चिल्ला उठा
  rationale: क्रिया ऊँची आवाज़ में अचानक पुकारने का भाव देती है; ‘चिल्ला उठा’ हिन्दी में इस तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
