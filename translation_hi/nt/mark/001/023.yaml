lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की तीव्र कथा-गति को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: ἦν
