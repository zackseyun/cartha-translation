  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘आराधनालय’ यहूदी synagogue के लिए प्रचलित बाइबिलीय शब्द है। वाक्य के अंत का अल्पविराम अगले पद में आने वाली पुकार से इसके सीधे संबंध को बनाए रखता है।
