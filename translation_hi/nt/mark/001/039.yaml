source:
  edition: SBLGNT
  text: καὶ ⸀ἦλθεν κηρύσσων ⸂εἰς τὰς συναγωγὰς⸃ αὐτῶν εἰς ὅλην τὴν Γαλιλαίαν καὶ τὰ δαιμόνια ἐκβάλλων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/001/039.yaml
  text: And he went throughout all Galilee[a], preaching in their synagogues and casting out demons.
translation:
  language: hi
  text: और वह पूरे गलील प्रदेश में गया[a] और उनके आराधनालयों में प्रचार करता तथा दुष्टात्माओं को निकालता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आया।’ यूनानी क्रिया का अनुवाद ‘आया’ भी किया जा सकता है, पर इस प्रसंग में संभवतः वह पूरे क्षेत्र में यीशु के घूम-घूमकर सेवा करने का वर्णन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθεν
  choice: गया
  rationale: ἔρχομαι का सामान्य अर्थ ‘आया’ भी हो सकता है, पर यहाँ पूरे गलील क्षेत्र के उल्लेख और साथ आए कृदंतों के कारण ‘गया’ प्रसंगानुकूल भ्रमणशील गतिविधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κηρύσσων
  choice: प्रचार करता
  rationale: यह शब्द सार्वजनिक घोषणा को सूचित करता है। आराधनालय के प्रसंग में ‘प्रचार करता’ सहज, प्रचलित और अर्थानुकूल है।
- source_word: εἰς τὰς συναγωγὰς αὐτῶν
  choice: उनके आराधनालयों में
  rationale: यद्यपि εἰς का मूल स्थानिक अर्थ ‘में/की ओर’ है, यहाँ यह प्रचार की गतिविधि का स्थान बताता है। αὐτῶν को ‘उनके’ के रूप में बनाए रखा गया है।
- source_word: εἰς ὅλην τὴν Γαλιλαίαν
  choice: पूरे गलील प्रदेश में
  rationale: यह वाक्यांश गतिविधि के भौगोलिक विस्तार को व्यक्त करता है। ‘पूरे’ से ὅλην और ‘प्रदेश में’ से क्षेत्रभर की गति स्वाभाविक हिन्दी में सामने आती है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में ‘दुष्टात्मा’ δαιμόνιον का स्पष्ट और सुबोध समतुल्य है; ‘दानव’ यहाँ भ्रामक सांस्कृतिक अर्थ ला सकता है।
- source_word: ἐκβάλλων
  choice: निकालता रहा
  rationale: दुष्टात्मा निकालने के प्रसंग में ἐκβάλλω का अर्थ बाहर निकालना है। ‘रहा’ प्रचार और निकालने की जारी/दोहराई जाने वाली गतिविधि को हिन्दी में सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: τὰ δαιμόνια का स्वरूप
  choice: ‘दुष्टात्माओं’ के रूप में अनुवाद किया गया, अर्थात पाठ में प्रस्तुत व्यक्तिगत आत्मिक सत्ताएँ।
  alternative: ‘बुरी आत्माओं’ या ‘दानवों’
  rationale: ‘दुष्टात्माएँ’ मूल शब्द का सीधा और प्रचलित हिन्दी समतुल्य है तथा पाठ से आगे कोई अतिरिक्त धर्मसैद्धांतिक दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उनके आराधनालयों’ में मूल सर्वनाम सुरक्षित है। मुख्य पाठ में भ्रमण का अर्थ अत्यधिक स्पष्ट करके जोड़ने के बजाय ‘गया’ रखा गया है और वास्तविक शाब्दिक विकल्प को पादटिप्पणी में दिया गया है।
