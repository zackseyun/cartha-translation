language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἀποκριθεὶς ὁ Ἰησοῦς ἔλεγεν διδάσκων ἐν τῷ ἱερῷ· Πῶς λέγουσιν οἱ γραμματεῖς ὅτι ὁ χριστὸς υἱὸς ⸂Δαυίδ ἐστιν⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/035.yaml
  text: And Jesus answered and said[a], as he was teaching in the temple, “How do the scribes say that the Messiah is the son of David?”
translation:
  language: hi
  text: यीशु ने मंदिर में शिक्षा देते हुए उत्तर दिया, “शास्त्री कैसे कहते हैं कि मसीह[a] दाऊद का पुत्र है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ख्रीस्त।” यूनानी उपाधि ख़्रिस्तोस यहाँ ‘मसीह’ के अर्थ में प्रयुक्त हुई है।
    reason: Χριστός के पारंपरिक वैकल्पिक रूप को सुरक्षित रखना और यहाँ उसके उपाधि-संबंधी, मसीही अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: तब ... कहा
  rationale: यह कृदन्त प्रायः किसी प्रश्न या परिस्थिति के प्रत्युत्तर में बोलने का संकेत देता है। यहाँ कोई प्रत्यक्ष प्रश्न नहीं है, इसलिए शाब्दिक ‘उत्तर देते हुए’ के बजाय ‘तब ... कहा’ स्वाभाविक हिन्दी में प्रसंगगत प्रतिक्रिया को व्यक्त करता है।
- source_word: ἔλεγεν
  choice: कहा
  rationale: यूनानी अपूर्णकाल बोलने की जारी क्रिया दिखा सकता है, पर प्रत्यक्ष प्रश्न के परिचय में हिन्दी का ‘कहा’ स्वाभाविक है; चल रही गतिविधि का भाव ‘शिक्षा देते हुए’ से बना रहता है।
- source_word: διδάσκων
  choice: शिक्षा देते हुए
  rationale: वर्तमान कृदन्त यीशु के बोलने के साथ-साथ चल रही गतिविधि बताता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर में
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित कर सकता है। ‘मंदिर में’ संक्षिप्त और प्रचलित है तथा अनावश्यक रूप से भीतरी पवित्रस्थान का अर्थ नहीं थोपता।
- source_word: Πῶς
  choice: कैसे
  rationale: ‘कैसे’ प्रश्न की अलंकारिक चुनौती को बनाए रखता है, पर मूल से आगे बढ़कर स्पष्टतः ‘कैसे कह सकते हैं’ नहीं बनाता।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह सुसमाचारों के ऐतिहासिक धार्मिक-विद्वान वर्ग के लिए प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द व्यक्तिगत नाम की तरह नहीं, यहूदी मसीही उपाधि के रूप में प्रयुक्त है।
- source_word: υἱὸς Δαυίδ
  choice: दाऊद का पुत्र
  rationale: यह स्वाभाविक हिन्दी में मान्य मसीही पदवी और दाऊदी वंश-संबंध दोनों को व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: प्रसंग यहूदी मसीही अपेक्षा पर केंद्रित है, इसलिए मुख्य पाठ में ‘मसीह’ अर्थ और ऐतिहासिक संदर्भ को स्पष्ट करता है; वैकल्पिक पारंपरिक रूप पादटिप्पणी में रखा गया है।
- issue: ‘दाऊद का पुत्र’ कथन पर यीशु के प्रश्न का बल
  choice: कैसे कहते हैं
  alternative: कैसे कह सकते हैं
  rationale: मूल Πῶς कथन को चुनौती देता है, पर अपने आप उसका निषेध या असंभवता घोषित नहीं करता। ‘कैसे’ उस तनाव और आगे आने वाली व्याख्या के लिए खुलापन बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मंदिर’, ‘शास्त्री’, ‘मसीह’ और ‘दाऊद का पुत्र’ जैसे परिचित बाइबलीय पद बनाए गए हैं। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिसे वह स्पष्ट करता है।
