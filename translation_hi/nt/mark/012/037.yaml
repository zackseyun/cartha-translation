  text: ⸀αὐτὸς Δαυὶδ λέγει αὐτὸν κύριον, καὶ πόθεν ⸂αὐτοῦ ἐστιν υἱός⸃; καὶ ὁ πολὺς ὄχλος ἤκουεν αὐτοῦ ἡδέως.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/037.yaml
  text: David himself calls him Lord[b][a], so how is he his son? And the large crowd was listening to him gladly.
translation:
  language: hi
  text: दाऊद स्वयं उसे प्रभु कहता है, तो वह उसका पुत्र कैसे है?[a][b] और बड़ी भीड़ उसे आनन्द से सुन रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तो वह कहाँ से उसका पुत्र है?”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “पुत्र” ‘दाऊद का पुत्र’ वाले मसीहा-संबंधी शीर्षक की प्रतिध्वनि है; इसका व्यापक अर्थ “वंशज” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: दाऊद स्वयं
  rationale: αὐτός का बलवाचक प्रयोग दाऊद पर विशेष जोर देता है; इसलिए ‘स्वयं’ रखा गया है।
- source_word: λέγει αὐτὸν κύριον
  choice: उसे प्रभु कहता है
  rationale: इस रचना में λέγει नामकरण या संबोधन का भाव देता है; ‘प्रभु’ κύριος के शास्त्रीय और मसीही शीर्षक का बल बनाए रखता है।
- source_word: πόθεν αὐτοῦ ἐστιν υἱός
  choice: तो वह उसका पुत्र कैसे है?
  rationale: πόθεν का शाब्दिक अर्थ ‘कहाँ से’ है, पर यहाँ वह तर्कगत आधार पूछता है; स्वाभाविक हिन्दी में ‘कैसे’ उस प्रश्न का बल स्पष्ट रखता है।
- source_word: υἱός
  choice: पुत्र
  rationale: ‘पुत्र’ दाऊद के पुत्र वाले मसीही शीर्षक और प्रश्न में निहित विरोधाभास दोनों को सुरक्षित रखता है; केवल ‘वंशज’ कहना शब्दगत प्रतिध्वनि घटा देता।
- source_word: ὁ πολὺς ὄχλος
  choice: बड़ी भीड़
  rationale: वाक्यांश संख्या में बड़ी भीड़ को सूचित करता है; यह आधुनिक और सहज हिन्दी है।
- source_word: ἤκουεν αὐτοῦ
  choice: उसकी सुन रही थी
  rationale: अपूर्ण भूतकाल ἤκουεν जारी क्रिया को दर्शाता है; हिन्दी का ‘सुन रही थी’ उस पक्ष को व्यक्त करता है।
- source_word: ἡδέως
  choice: आनन्द से
  rationale: ἡδέως प्रसन्नता और रुचि के साथ सुनने का भाव देता है; ‘आनन्द से’ गरिमापूर्ण और सहज है।
theological_decisions:
- issue: दाऊद द्वारा मसीह को ‘प्रभु’ कहने का मसीह-सम्बन्धी बल
  choice: ‘प्रभु’ शीर्षक और अलंकारिक प्रश्न को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: ‘दाऊद स्वयं मसीह को प्रभु कहता है’ अथवा ‘तो किस अर्थ में वह उसका पुत्र है?’
  rationale: मूल पाठ मसीह की दाऊदी पुत्रता और उसके प्रभुत्व के बीच तनाव प्रस्तुत करता है, पर उसका पूरा धर्मवैज्ञानिक समाधान इस पद में नहीं जोड़ता।
- issue: मसीही सन्दर्भ में υἱός
  choice: पुत्र
  alternative: वंशज
  rationale: यहाँ ‘पुत्र’ व्यापक रूप से वंशज का अर्थ रख सकता है, फिर भी शब्द को बनाए रखने से ‘दाऊद का पुत्र’ शीर्षक और यीशु के तर्क की धार सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य-विन्यास सहज और गरिमापूर्ण रखा गया है। ‘प्रभु’ तथा ‘पुत्र’ जैसे प्रमुख शास्त्रीय शब्द सुरक्षित हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
