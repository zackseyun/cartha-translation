    issue: ‘सारे हृदय’ is grammatically and idiomatically awkward.
    rationale: In this singular expression, modern Hindi normally says ‘पूरे हृदय से’ (or ‘अपने पूरे हृदय से’). The Greek does not require adding ‘अपने,’ so ‘पूरे हृदय’ best retains both naturalness and the draft’s generic phrasing.
