id: MRK.12.33
reference: Mark 12:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὸ ἀγαπᾶν αὐτὸν ἐξ ὅλης ⸀τῆς καρδίας καὶ ἐξ ὅλης τῆς ⸀συνέσεως καὶ ἐξ ὅλης τῆς ἰσχύος καὶ τὸ ἀγαπᾶν τὸν πλησίον ὡς ἑαυτὸν ⸀περισσότερόν ἐστιν πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/033.yaml
  text: and to love him with all the heart and with all the understanding and with all the strength[a], and to love one’s neighbor as oneself, is more than all burnt offerings and sacrifices.
translation:
  language: hi
  text: और उससे पूरे हृदय, पूरी समझ और पूरी शक्ति से प्रेम करना, और अपने पड़ोसी से अपने समान प्रेम करना, सभी होमबलियों और बलिदानों से बढ़कर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶν
  choice: प्रेम करना
  rationale: संज्ञार्थक क्रियारूप के मौखिक बल और दोनों समानांतर पदबंधों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αὐτόν
  choice: उससे
  rationale: सर्वनाम पूर्ववर्ती प्रसंग में परमेश्वर की ओर संकेत करता है; ‘उससे’ यूनानी सर्वनाम को बनाए रखता है और नाम को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐξ ὅλης τῆς καρδίας
  choice: सारे हृदय से
  rationale: पूर्ण आंतरिक समर्पण व्यक्त करता है और हिन्दी में सहज है; यूनानी में यहाँ स्पष्ट द्वितीय पुरुष सर्वनाम न होने के कारण ‘अपने सारे हृदय से’ नहीं जोड़ा गया।
- source_word: συνέσεως
  choice: समझ
  rationale: बोध और विवेक की धारणा व्यक्त करता है तथा इसे केवल ‘मन’ में सीमित नहीं करता।
- source_word: ἰσχύος
  choice: शक्ति
  rationale: व्यक्ति की पूरी सामर्थ्य को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: πλησίον
  choice: अपने पड़ोसी
  rationale: एकवचन पद का अर्थ सामान्य है; ‘अपने पड़ोसी’ हिन्दी में इस नैतिक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς ἑαυτόν
  choice: अपने समान
  rationale: सामान्य आत्मवाचक तुलना को बिना सीधे पाठक-संबोधन में बदले व्यक्त करता है।
- source_word: περισσότερόν ἐστιν
  choice: से बढ़कर है
  rationale: तुलनात्मक श्रेष्ठता को स्पष्ट रखता है, पर उसके निहितार्थ को ‘निरस्त करना’ जैसे अतिरिक्त अर्थ से नहीं भरता।
- source_word: πάντων τῶν ὁλοκαυτωμάτων καὶ θυσιῶν
  choice: सभी होमबलियों और बलिदानों
  rationale: ‘होमबलि’ ऐसी बलि के लिए स्थापित हिन्दी बाइबलीय शब्द है जो वेदी पर पूरी तरह जलाई जाती थी; ‘बलिदानों’ दूसरे व्यापक बलि-पद से भेद बनाए रखता है।
theological_decisions:
- issue: प्रेम की आज्ञाओं और बलिदानी उपासना का संबंध
  choice: परमेश्वर से पूर्ण प्रेम और पड़ोसी से प्रेम को सभी होमबलियों और बलिदानों से श्रेष्ठ बताया गया है।
  alternative: यह कथन बलिदान-व्यवस्था को पूर्णतः निरस्त करता है।
  rationale: περισσότερόν ἐστιν स्पष्ट रूप से श्रेष्ठता बताता है, पर पद स्वयं बलिदान-व्यवस्था को औपचारिक रूप से समाप्त घोषित नहीं करता; इसलिए तुलना और धर्मवैचारिक तनाव दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘होमबलि’ की कुछ धार्मिक-शब्दावलीगत विशिष्टता है, किंतु यह ὁλοκαύτωμα की पूर्णतः जलाई जाने वाली बलि का सटीक और प्रचलित हिन्दी प्रतिरूप है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
