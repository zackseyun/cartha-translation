  naturalness: The phrase ‘सारे हृदय’ is not idiomatic modern standard Hindi for singular ‘हृदय.’ ‘पूरे हृदय’ is natural and retains the intended totality. The remaining syntax is clear, dignified, and suitable for the register.
  terminology: ‘प्रेम करना,’ ‘समझ,’ ‘शक्ति,’ ‘पड़ोसी,’ ‘होमबलियाँ,’ and ‘बलिदान’ are appropriate. ‘होमबलियाँ’ maintains the distinction between ὁλοκαυτώματα and θυσίαι; no explanatory footnote is necessary in this Hindi rendering.
  issues:
