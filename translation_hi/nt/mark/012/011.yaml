id: MRK.12.11
reference: Mark 12:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: παρὰ κυρίου ἐγένετο αὕτη, καὶ ἔστιν θαυμαστὴ ἐν ὀφθαλμοῖς ἡμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/011.yaml
  text: This came from the Lord[b][a], and it is marvelous in our eyes.
translation:
  language: hi
  text: यह प्रभु की ओर से हुआ[a][b], और यह हमारी दृष्टि में अद्भुत है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह प्रभु के द्वारा हुआ।” यूनानी वाक्यांश स्रोत या कर्तृत्व, दोनों व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति भजन 118:23 का उद्धरण है।
    reason: cross_reference
lexical_decisions:
- source_word: παρὰ κυρίου
  choice: प्रभु की ओर से
  rationale: παρά के साथ संबंधकारक यहाँ स्रोत या कर्तृत्व व्यक्त कर सकता है। ‘प्रभु की ओर से’ मूल उद्गम को स्वाभाविक हिन्दी में व्यक्त करता है और कर्तृत्व की संभावना को पूरी तरह बंद नहीं करता।
- source_word: κυρίου
  choice: प्रभु
  rationale: यद्यपि यह भजन 118:23 का उद्धरण है और उसके इब्रानी पाठ में परमेश्वर का नाम आता है, मरकुस का यूनानी पाठ κύριος कहता है; इसलिए नए नियम के सामान्य प्रयोग के अनुरूप ‘प्रभु’ रखा गया है।
- source_word: ἐγένετο
  choice: हुआ
  rationale: इस वाक्य-विन्यास में γίνομαι किसी बात के घटित या अस्तित्व में आने को बताता है। ‘हुआ’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है; इसे दुर्घटनावश घटने का भाव नहीं देता।
- source_word: αὕτη
  choice: यह
  rationale: स्त्रीलिंग संकेतवाचक शब्द पिछली पंक्ति में बताए गए पत्थर के कोने का प्रधान पत्थर बन जाने की पूरी घटना की ओर संकेत करता है। ‘यह’ उस संदर्भ को खुला रखता है और पाठ में ‘पत्थर’ जैसा अतिरिक्त संज्ञा-पद नहीं जोड़ता।
- source_word: θαυμαστὴ
  choice: अद्भुत
  rationale: θαυμαστός विस्मयकारी और आश्चर्यजनक वस्तु या घटना को व्यक्त करता है। ‘अद्भुत’ उद्धरण की गरिमा बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: ἐν ὀφθαλμοῖς ἡμῶν
  choice: हमारी दृष्टि में
  rationale: शाब्दिक अर्थ ‘हमारी आँखों में’ है, पर यह मुहावरा ‘हमारी निगाह में’ या ‘हमें’ के अर्थ में प्रयुक्त है। ‘हमारी दृष्टि में’ दृश्य-बिंब और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए भजन-संबंधी उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: पुराने नियम के इब्रानी आधार में संभवतः परमेश्वर का विशिष्ट नाम है, किंतु यहाँ अनुवाद का प्रत्यक्ष स्रोत यूनानी नए नियम का κυρίου है। ‘प्रभु’ उसी रूप को प्रस्तुत करता है और पुराने नियम की पृष्ठभूमि को मुख्य पाठ में आयात नहीं करता।
- issue: παρὰ κυρίου में स्रोत और कर्तृत्व का संबंध
  choice: प्रभु की ओर से हुआ
  alternative: प्रभु के द्वारा हुआ
  rationale: यूनानी वाक्यांश स्रोत और कर्तृत्व दोनों का संकेत दे सकता है। ‘की ओर से’ स्रोत को प्रमुख रखता है, जबकि ‘के द्वारा’ कर्तृत्व को अधिक स्पष्ट करता; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हमारी दृष्टि में’ मूल के नेत्र-संबंधी बिंब को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है। अंतिम प्रश्नचिह्न यूनानी पाठ में उस प्रश्न की निरंतरता दर्शाता है जो पिछले पद में आरंभ हुआ था; आरंभिक उद्धरण-चिह्न पिछले पद से चल रहे उद्धरण के कारण यहाँ नहीं जोड़ा गया।
