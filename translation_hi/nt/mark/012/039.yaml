  yaml_path: translation/nt/mark/012/039.yaml
  text: and the best seats in the synagogues and the places of honor at banquets[b][a],
translation:
  language: hi
  text: और आराधनालयों में सबसे प्रतिष्ठित आसन और भोजों में सम्मान के स्थान चाहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρωτοκαθεδρίας
  choice: सबसे प्रतिष्ठित आसन
  rationale: यह शब्द सभा में सर्वोच्च दर्जे या प्रमुखता वाले आसनों को दर्शाता है। ‘सबसे प्रतिष्ठित आसन’ सामाजिक मान-सम्मान को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: συναγωγαῖς
  choice: आराधनालयों
  rationale: इस प्रसंग में यहूदी सभास्थलों का उल्लेख है। ‘आराधनालय’ आधुनिक हिन्दी बाइबलीय प्रयोग में सहज और समझने योग्य है।
- source_word: πρωτοκλισίας
  choice: सम्मान के स्थान
  rationale: यह प्राचीन भोज में सबसे सम्मानित बैठने या लेटकर भोजन करने के स्थानों को दर्शाता है। ‘सम्मान के स्थान’ ऐतिहासिक भोजन-मुद्रा को अनावश्यक रूप से थोपे बिना उसके सामाजिक अर्थ को स्पष्ट करता है।
- source_word: δείπνοις
  choice: भोजों
  rationale: यहाँ औपचारिक अथवा सामाजिक भोजन का प्रसंग है, जहाँ प्रतिष्ठा प्रकट होती थी; इसलिए ‘भोजों’ उपयुक्त है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: दोनों समानांतर वस्तुओं को जोड़ने वाली पुनरावृत्ति बनाए रखी गई है।
- source_word: ἐν ταῖς συναγωγαῖς ... ἐν τοῖς δείπνοις
  choice: आराधनालयों में ... भोजों में
  rationale: ἐν को दोनों पदों में सहज हिन्दी के अनुसार ‘में’ कहा गया है।
theological_decisions:
- issue: क्रिया का इस पदांश में लुप्त होना
  choice: चाहते हैं
  alternative: पिछले पद की क्रिया पर निर्भर अधूरा पदांश रखना
  rationale: यूनानी पाठ पद 38 की φιλοῦντες (‘वे पसंद करते/चाहते हैं’) पर निर्भर सूची जारी रखता है। स्वतंत्र पद के रूप में स्पष्ट हिन्दी हेतु ‘चाहते हैं’ जोड़ा गया है; इससे निहित अर्थ व्यक्त होता है, कोई नया धर्मवैज्ञानिक निष्कर्ष नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रतिष्ठित’ और ‘सम्मान’ के माध्यम से दोनों यूनानी पदों का सामाजिक दर्जे वाला अर्थ सुरक्षित है, जबकि उनकी हल्की भिन्नता भी बनी रहती है।
