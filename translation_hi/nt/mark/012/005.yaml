source:
  edition: SBLGNT
  text: ⸀καὶ ἄλλον ἀπέστειλεν· κἀκεῖνον ἀπέκτειναν, καὶ πολλοὺς ἄλλους, ⸂οὓς μὲν δέροντες οὓς δὲ ἀποκτέννοντες⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/005.yaml
  text: And he sent another[a], and they killed that one; and many others—some they beat, and some they killed.
translation:
  language: hi
  text: फिर उसने एक और दास को भेजा; उन्होंने उसे भी मार डाला। उसने और भी बहुत-से दासों को भेजा—उनमें से कुछ को उन्होंने पीटा और कुछ को मार डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλλον
  choice: एक और दास
  rationale: क्रम में भेजे गए व्यक्ति का उल्लेख है; संदर्भ से उसके दास होने की बात स्पष्ट है। हिन्दी में केवल ‘एक और’ की अपेक्षा ‘एक और दास’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἀπέστειλεν
  choice: उसने ... भेजा
  rationale: साधारण कथात्मक भूतकाल यूनानी aorist की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κἀκεῖνον
  choice: उसे भी
  rationale: καί और ἐκεῖνον, दोनों का संयुक्त अर्थ लेकर पूर्ववर्ती सेवकों के समान उसके साथ हुए व्यवहार की योगात्मक भावना सुरक्षित रखी गई है।
- source_word: ἀπέκτειναν / ἀποκτέννοντες
  choice: मार डाला / मार डाला
  rationale: दोनों रूप हत्या को व्यक्त करते हैं। हिन्दी में ‘मार डाला’ हिंसा और परिणाम को स्वाभाविक ढंग से व्यक्त करता है; दूसरे प्रयोग में वितरणात्मक सारांश के कारण बहुवचन कर्ता के साथ यही वाक्यांश रखा गया है।
- source_word: πολλοὺς ἄλλους
  choice: और भी बहुत-से दासों को
  rationale: यह पहले भेजे गए दासों के अतिरिक्त अनेक सेवकों की ओर संकेत करता है। संदर्भगत संज्ञा जोड़ने से हिन्दी में आशय स्पष्ट रहता है।
- source_word: οὓς μὲν ... οὓς δὲ
  choice: उनमें से कुछ ... और कुछ
  rationale: यूनानी वितरणात्मक संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है और दो अलग-अलग प्रकार के व्यवहार को स्पष्ट करता है।
- source_word: δέροντες
  choice: पीटा
  rationale: δέρω यहाँ सामान्य रूप से हिंसक पिटाई को दर्शाता है; ‘पीटा’ न्यायिक कोड़े लगाने जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
theological_decisions:
- issue: वर्तमानकालिक कृदंतों वाले वितरणात्मक सारांश का हिन्दी रूप
  choice: 'सीमित क्रियाओं के रूप में: ‘उनमें से कुछ को उन्होंने पीटा और कुछ को मार डाला’'
  alternative: ‘कुछ को पीटते और कुछ को मार डालते हुए’
  rationale: यूनानी कृदंत अनेक दासों के साथ किए गए अलग-अलग व्यवहार का संक्षिप्त वितरणात्मक सारांश देते हैं। हिन्दी में सीमित क्रियाएँ अर्थ को अधिक साफ और स्वाभाविक बनाती हैं, बिना किसी धर्मवैज्ञानिक निष्कर्ष को जोड़े।
- issue: ‘दास’ संज्ञा की पुनःपूर्ति
  choice: अध्याय के दृष्टान्त-संदर्भ के अनुसार ‘दास’ को स्पष्ट रूप से रखा गया
  alternative: ‘एक और’ तथा ‘और भी बहुतों को’
  rationale: यूनानी में संज्ञा पूर्वपद से समझी जाती है। आधुनिक हिन्दी में उसे दोहराना स्वाभाविक स्पष्टता देता है और पात्रों की पहचान नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। ‘फिर’, ‘उसे भी’ और ‘और भी’ से घटनाओं का क्रम तथा योगात्मक बल स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि यूनानी वितरणात्मक वाक्यरचना मुख्य पाठ में स्वाभाविक और अर्थनिष्ठ रूप से व्यक्त हो जाती है।
