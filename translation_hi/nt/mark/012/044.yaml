  text: πάντες γὰρ ἐκ τοῦ περισσεύοντος αὐτοῖς ἔβαλον, αὕτη δὲ ἐκ τῆς ὑστερήσεως αὐτῆς πάντα ὅσα εἶχεν ἔβαλεν, ὅλον τὸν βίον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/044.yaml
  text: For they all gave out of their abundance[a], but she, out of her poverty, put in everything she had—her whole livelihood.
translation:
  language: hi
  text: क्योंकि उन सबने अपनी बहुतायत में से डाला, पर उसने अपनी तंगी में से वह सब कुछ डाल दिया जो उसके पास था—अपने जीवन-निर्वाह के सारे साधन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάντες γὰρ
  choice: क्योंकि उन सबने
  rationale: γάρ पिछले पद में यीशु के आकलन का कारण बताता है, और πάντες धनी दान देने वालों की समग्रता पर बल देता है।
- source_word: ἐκ τοῦ περισσεύοντος αὐτοῖς
  choice: अपनी बहुतायत में से
  rationale: यह वाक्यांश उनकी आवश्यकताओं से अधिक उपलब्ध साधनों में से देने को दर्शाता है। ‘बहुतायत’ मूल की प्रचुरता और विपरीतता को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔβαλον / ἔβαλεν
  choice: डाला / डाल दिया
  rationale: मन्दिर के भंडार में सिक्के डालने की ठोस क्रिया को बनाए रखा गया है; एकवचन में ‘डाल दिया’ कार्य की पूर्णता और उसके सर्वस्व देने के बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὕτη δὲ
  choice: पर इसने
  rationale: δέ स्पष्ट विरोध स्थापित करता है। स्त्री और संदर्भ पहले से स्पष्ट होने के कारण ‘इसने’ संक्षिप्त तथा स्रोत के निकट है।
- source_word: ἐκ τῆς ὑστερήσεως αὐτῆς
  choice: अपनी तंगी में से
  rationale: ὑστέρησις अभाव और जरूरत की दशा दर्शाता है। ‘तंगी’ आधुनिक हिन्दी में आर्थिक अभाव को सहजता से व्यक्त करती है, बिना उसकी दशा को अनावश्यक रूप से अधिक निश्चित करने के।
- source_word: πάντα ὅσα εἶχεν
  choice: वह सब कुछ जो उसके पास था
  rationale: मूल की व्यापक और बलयुक्त समग्रता सुरक्षित रहती है।
- source_word: ὅλον τὸν βίον αὐτῆς
  choice: अपनी पूरी जीविका
  rationale: इस आर्थिक संदर्भ में βίος जीवन-निर्वाह के साधनों को दर्शाता है, न कि जैविक जीवन को। ‘पूरी जीविका’ संक्षिप्त रूप में यही अर्थ रखती है।
theological_decisions:
- issue: विधवा के दान के कथन में βίος का अर्थ
  choice: जीवन-निर्वाह के पूरे साधन (‘पूरी जीविका’)
  alternative: उसका पूरा जीवन
  rationale: संदर्भ धन चढ़ाने का है और βίος आजीविका अथवा निर्वाह के साधनों को सूचित कर सकता है। ‘पूरा जीवन’ हिन्दी में जैविक जीवन का भ्रामक अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। ‘बहुतायत’ और ‘तंगी’ मूल के तीखे आर्थिक विरोध को बनाए रखते हैं; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
