id: MRK.12.32
reference: Mark 12:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καὶ εἶπεν αὐτῷ ὁ γραμματεύς· Καλῶς, διδάσκαλε, ἐπ’ ἀληθείας εἶπες ὅτι εἷς ἐστιν καὶ οὐκ ἔστιν ἄλλος πλὴν αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/032.yaml
  text: And the scribe said to him[a], “Well said, Teacher. You have spoken truly that he is one, and there is no other besides him.”
translation:
  language: hi
  text: तब शास्त्री ने उससे कहा, “ठीक कहा, गुरु! तुमने सच कहा कि वह एक ही है[a] और उसके सिवा कोई दूसरा नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंग को अधिक स्पष्ट करते हुए, “परमेश्वर एक ही है।” यूनानी में केवल “वह एक ही है” कहा गया है; ‘वह’ किसके लिए है, यह पिछले प्रसंग से समझ में आता है।
    reason: alternative_reading
lexical_decisions:
- source_word: γραμματεύς
  choice: शास्त्री
  rationale: सुसमाचारों के संदर्भ में यह मूसा की व्यवस्था के मान्य विद्वान के लिए प्रचलित और संक्षिप्त हिन्दी पद है; ‘व्यवस्था का शिक्षक’ अधिक व्याख्यात्मक होता।
- source_word: Καλῶς
  choice: ठीक कहा
  rationale: यह यीशु के पिछले उत्तर पर सहमति और प्रशंसा व्यक्त करता है तथा आधुनिक हिन्दी संवाद में स्वाभाविक है।
- source_word: διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में διδάσκαλος का स्वाभाविक, संक्षिप्त और गरिमापूर्ण हिन्दी समतुल्य है।
- source_word: ἐπ’ ἀληθείας
  choice: सच
  rationale: यह पद क्रियाविशेषण की तरह कथन की सत्यता की पुष्टि करता है; ‘सच कहा’ आधुनिक हिन्दी में सहज है।
- source_word: εἶπες
  choice: तुमने ... कहा
  rationale: यूनानी एओरिस्ट का सीधा भूतकालीन अर्थ हाल में कहे गए कथन के लिए हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ὅτι
  choice: कि
  rationale: यहाँ यह शास्त्री द्वारा दोहराई गई बात की विषयवस्तु आरम्भ करता है, कारण नहीं।
- source_word: εἷς ἐστιν
  choice: वह एक ही है
  rationale: यूनानी में θεός को दोहराया नहीं गया है; पूर्ववर्ती प्रसंग से पुरुषवाचक कर्ता समझा जाता है। यह रूप स्रोत की संक्षिप्तता और निहित कर्ता को बनाए रखता है।
- source_word: οὐκ ἔστιν ἄλλος
  choice: कोई दूसरा नहीं
  rationale: यह यूनानी निषेध का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: πλὴν αὐτοῦ
  choice: उसके सिवा
  rationale: πλήν के अपवाद और अनन्यता के अर्थ को बिना विस्तार के स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: εἷς ἐστιν में निहित कर्ता
  choice: मुख्य पाठ में ‘वह एक ही है’
  alternative: ‘परमेश्वर एक ही है’ या ‘एक ही परमेश्वर है’
  rationale: निकटवर्ती प्रसंग स्पष्ट करता है कि संकेत परमेश्वर की ओर है, पर इस पद के यूनानी पाठ में θεός नहीं दोहराया गया। निहित रूप बनाए रखने से मूल की अभिव्यक्ति और उसका सन्दर्भ-निर्भर अर्थ सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद सहज किंतु गरिमापूर्ण रखा गया है। ‘शास्त्री’ और ‘गुरु’ सुसमाचार-संदर्भ में परिचित पद हैं। स्रोत की निहित ईश्वर-संज्ञा को मुख्य पाठ में स्पष्ट करके नहीं जोड़ा गया।
