id: MRK.12.28
reference: Mark 12:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ προσελθὼν εἷς τῶν γραμματέων ἀκούσας αὐτῶν συζητούντων, ⸀ἰδὼν ὅτι καλῶς ⸂ἀπεκρίθη αὐτοῖς⸃, ἐπηρώτησεν αὐτόν· Ποία ἐστὶν ⸂ἐντολὴ πρώτη πάντων⸃;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/028.yaml
  text: And one of the scribes came up and heard them debating, and seeing that he had answered them well, he asked him, “Which commandment is the first of all?”
translation:
  language: hi
  text: तब शास्त्रियों में से एक पास आया। उसने उन्हें आपस में वाद-विवाद करते सुना और यह देखकर कि यीशु ने उन्हें अच्छा उत्तर दिया था, उसने यीशु से पूछा, “सब आज्ञाओं में पहली[a] आज्ञा कौन-सी है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे प्रमुख” अथवा “सबसे महत्त्वपूर्ण।”
    reason: πρώτη क्रम में ‘पहली’ और पद या महत्त्व में ‘प्रमुख’—दोनों अर्थ दे सकता है।
lexical_decisions:
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: सुसमाचारों के यहूदी संदर्भ में यह शब्द धर्मशास्त्र और व्यवस्था के मान्य विशेषज्ञों के लिए प्रयुक्त है; ‘शास्त्री’ इसका प्रचलित और सीधा हिन्दी रूप है।
- source_word: προσελθὼν
  choice: पास आया
  rationale: यह यीशु की ओर निकट आने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀκούσας αὐτῶν συζητούντων
  choice: उन्हें आपस में वाद-विवाद करते सुना
  rationale: συζητέω यहाँ प्रश्नों पर सार्वजनिक बहस या विचार-विमर्श को सूचित करता है; ‘वाद-विवाद’ मतभेद को व्यक्त करता है, पर अनावश्यक शत्रुता नहीं जोड़ता।
- source_word: ἰδὼν ὅτι καλῶς ἀπεκρίθη αὐτοῖς
  choice: यह देखकर कि यीशु ने उन्हें अच्छा उत्तर दिया था
  rationale: ‘अच्छा उत्तर दिया’ καλῶς का सीधा अर्थ रखता है। स्पष्टता के लिए दोनों सर्वनामों की जगह ‘यीशु’ रखा गया है, जिससे हिन्दी में कर्ता और कर्म को लेकर भ्रम न हो।
- source_word: ἐπηρώτησεν
  choice: पूछा
  rationale: यह सामान्य और स्वाभाविक हिन्दी क्रिया है तथा मूल के प्रश्न करने के अर्थ को ठीक से व्यक्त करती है।
- source_word: Ποία
  choice: कौन-सी
  rationale: यह अनेक आज्ञाओं में से एक की पहचान पूछने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐντολή
  choice: आज्ञा
  rationale: मूसा की व्यवस्था के संदर्भ में ‘आज्ञा’ स्पष्ट, प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: πρώτη πάντων
  choice: सब आज्ञाओं में पहली
  rationale: ‘पहली’ मूल यूनानी के क्रम और प्रधानता—दोनों संभव भावों को खुला रखती है; ‘सब आज्ञाओं में’ हिन्दी में तुलना का संबंध स्पष्ट करता है।
theological_decisions:
- issue: 'πρώτη का आशय: क्रम में पहली या पद में प्रमुख'
  choice: मुख्य पाठ में ‘सब आज्ञाओं में पहली’
  alternative: ‘सबसे प्रमुख’, ‘सबसे बड़ी’ या ‘सबसे महत्त्वपूर्ण’
  rationale: πρώτη का शाब्दिक अर्थ ‘पहली’ है, पर यहाँ इसका आशय पद या महत्त्व में प्रधान भी हो सकता है। मुख्य पाठ मूल की अभिव्यक्ति और उसकी अर्थगत व्यापकता बनाए रखता है; पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबे यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है ताकि सामान्य पाठक घटनाक्रम आसानी से समझ सके। ‘शास्त्री’ बाइबलीय संदर्भ का स्थापित पदनाम बनाए रखता है।
