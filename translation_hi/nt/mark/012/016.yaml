  yaml_path: translation/nt/mark/012/016.yaml
  text: And they brought one. And he says to them[a], “Whose image is this, and whose inscription?” And they said to him, “Caesar’s.”
translation:
  language: hi
  text: तब वे एक सिक्का ले आए।[a] यीशु उनसे कहते हैं, “यह छवि किसकी है और यह लेख किसका है?” उन्होंने यीशु से कहा, “कैसर का।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में केवल “वे ले आए” है; पिछले प्रसंग से समझ में आता है कि वे एक दीनार का सिक्का ले आए।
    reason: मूल में कर्म के अव्यक्त होने और प्रसंग से उसकी पहचान स्पष्ट करने के लिए।
lexical_decisions:
- source_word: ἤνεγκαν
  choice: एक सिक्का ले आए
  rationale: क्रिया का अर्थ ‘ले आए’ है और यूनानी में कर्म व्यक्त नहीं किया गया। पिछले पद के दीनार-संबंधी प्रसंग को सहज हिन्दी में स्पष्ट करने के लिए ‘एक सिक्का’ रखा गया है; पादटिप्पणी मूल की इस अंतर्निहितता को बताती है।
- source_word: λέγει
  choice: कहते हैं
  rationale: यह मरकुस की जीवंत ऐतिहासिक वर्तमान-काल शैली को बनाए रखता है। कर्ता को प्रसंगानुसार ‘यीशु’ कहने से हिन्दी में संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: εἰκών
  choice: छवि
  rationale: सिक्के पर बने रूप के लिए ‘छवि’ सटीक, सुबोध और व्यापक बाइबलीय प्रयोग के अनुकूल है।
- source_word: ἐπιγραφή
  choice: लेख
  rationale: सिक्के पर लिखे शब्दों के लिए ‘लेख’ संक्षिप्त और आम पाठक के लिए सहज है; ‘अभिलेख’ अधिक तकनीकी होता।
- source_word: Καίσαρος
  choice: कैसर का
  rationale: संबंधसूचक रूप प्रश्न ‘किसका’ का सीधा उत्तर देता है और शासकीय उपाधि/नाम ‘कैसर’ को सुरक्षित रखता है।
