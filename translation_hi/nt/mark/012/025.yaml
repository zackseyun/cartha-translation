  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅταν γὰρ ἐκ νεκρῶν ἀναστῶσιν, οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται, ἀλλ’ εἰσὶν ὡς ⸀ἄγγελοι ἐν τοῖς οὐρανοῖς·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/025.yaml
  text: For when they rise from the dead[a], they neither marry nor are given in marriage, but are like angels in heaven.
translation:
  language: hi
  text: क्योंकि जब वे मरे हुओं में से जी उठेंगे, तब न तो विवाह करेंगे और न ही उनका विवाह कराया जाएगा, बल्कि वे स्वर्ग[a] में स्वर्गदूतों के समान होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में ‘स्वर्गों’ बहुवचन है।
    reason: मूल रूप की वैकल्पिक शाब्दिक अभिव्यक्ति
lexical_decisions:
- source_word: ὅταν γὰρ
  choice: क्योंकि जब
  rationale: γάρ पिछले कथन का कारण स्पष्ट करता है और ὅταν समय बताता है; इसलिए ‘क्योंकि जब’ दोनों भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκ νεκρῶν ἀναστῶσιν
  choice: मरे हुओं में से जी उठेंगे
  rationale: ἐκ νεκρῶν का ‘मरे हुओं में से’ मूल यूनानी की सामूहिक अभिव्यक्ति को बनाए रखता है, और सक्रिय ἀναστῶσιν के लिए ‘जी उठेंगे’ स्वाभाविक तथा रूपानुकूल है।
- source_word: οὔτε γαμοῦσιν οὔτε γαμίζονται
  choice: न तो विवाह करेंगे और न ही उनका विवाह कराया जाएगा
  rationale: οὔτε ... οὔτε का सहसंबंध ‘न तो ... न ही’ से व्यक्त हुआ है। पहले क्रियापद का सक्रिय और दूसरे का निष्क्रिय रूप बनाए रखते हुए, हिन्दी में अस्वाभाविक ‘विवाह में दिए जाएँगे’ के बजाय ‘उनका विवाह कराया जाएगा’ कहा गया है।
- source_word: ὡς ἄγγελοι
  choice: स्वर्गदूतों के समान
  rationale: ὡς तुलना व्यक्त करता है, पहचान नहीं; ‘के समान’ यह स्पष्ट रखता है कि जी उठे लोग स्वर्गदूत बन नहीं जाते।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्ग में
  rationale: यूनानी में संज्ञा बहुवचन है, पर आधुनिक हिन्दी में इस स्थान-संबंधी अर्थ के लिए एकवचन ‘स्वर्ग में’ अधिक स्वाभाविक है; मूल बहुवचन को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: जी उठे लोगों और स्वर्गदूतों की तुलना का स्वरूप
  choice: जी उठे लोग स्वर्गदूतों के समान होंगे
  alternative: जी उठे लोग स्वर्गदूत बन जाएँगे
  rationale: तुलनात्मक ὡς समानता बताता है, अस्तित्वगत रूपांतरण नहीं। अनुवाद तुलना की सीमा को आगे समझाकर संकुचित नहीं करता, पर मनुष्यों के स्वर्गदूत बन जाने का अर्थ भी नहीं देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उनका विवाह कराया जाएगा’ निष्क्रिय भाव को प्राकृतिक हिन्दी में व्यक्त करता है; ‘स्वर्गदूतों के समान’ तुलना को स्पष्ट रखता है।
