source:
  edition: SBLGNT
  text: οὐδὲ τὴν γραφὴν ταύτην ἀνέγνωτε· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/010.yaml
  text: 'Have you not even read this Scripture: ‘The stone that the builders rejected[a], this has become the cornerstone’?”'
translation:
  language: hi
  text: 'क्या तुमने पवित्रशास्त्र का यह वचन भी नहीं पढ़ा?


    ‘जिस पत्थर को भवन बनाने वालों ने ठुकरा दिया,

    वही कोने का प्रधान पत्थर बन गया।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γραφὴν
  choice: पवित्र शास्त्र का यह वचन
  rationale: नए नियम में γραφή प्रायः पवित्र और प्रामाणिक धर्मग्रंथ को सूचित करता है। यहाँ एक निश्चित उद्धरण सामने है, इसलिए सहज हिन्दी में ‘पवित्र शास्त्र का यह वचन’ कहा गया है।
- source_word: οὐδὲ
  choice: भी नहीं
  rationale: यह केवल निषेध नहीं, बल्कि प्रश्न में तीखा बल जोड़ता है; हिन्दी में ‘भी नहीं’ उस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνέγνωτε
  choice: तुमने ... पढ़ा
  rationale: अओरिस्ट रूप को हिन्दी के पूर्ण भूतकालीन प्रश्न में स्वाभाविक रूप से व्यक्त किया गया है, जबकि उसका आलंकारिक प्रश्नात्मक बल बना रहता है।
- source_word: Λίθον
  choice: जिस पत्थर को
  rationale: यूनानी में पद निरुपपद है, पर भजन 118 के निश्चित और पहचाने हुए पत्थर की ओर संकेत करता है; सम्बन्धवाचक संरचना हिन्दी में उद्धरण को सहज बनाती है।
- source_word: ἀπεδοκίμασαν
  choice: ठुकरा दिया था
  rationale: ἀποδοκιμάζω जाँच या मूल्यांकन के बाद अस्वीकार करने का भाव रख सकता है। ‘ठुकरा दिया’ स्पष्ट, वर्तमान हिन्दी है और रूपक की तीव्रता बनाए रखता है।
- source_word: οἱ οἰκοδομοῦντες
  choice: भवन बनाने वालों
  rationale: कृदन्त यहाँ संज्ञा के रूप में प्रयुक्त है। ‘भवन बनाने वालों’ से निर्माण का रूपक स्पष्ट रहता है और यह किसी एक आधुनिक पेशे तक सीमित नहीं होता।
- source_word: οὗτος
  choice: वही
  rationale: प्रदर्शक सर्वनाम पहले ठुकराए गए उसी पत्थर पर जोर देता है; ‘वही’ इस विरोधाभास और बल को सुरक्षित रखता है।
- source_word: ἐγενήθη
  choice: बन गया
  rationale: यह पत्थर की बदली हुई प्रतिष्ठा या भूमिका बताता है। ‘बन गया’ न तो किसी अतिरिक्त कर्ता को जोड़ता है, न परिणाम को कमजोर करता है।
- source_word: εἰς κεφαλὴν γωνίας
  choice: कोने का प्रधान पत्थर
  rationale: शाब्दिक घटक ‘कोने का सिर/प्रधान भाग’ हैं। ‘कोने का प्रधान पत्थर’ प्रमुखता और स्थापत्य-रूपक दोनों रखता है, जबकि नींव के पत्थर और ऊपरी कोने के पत्थर के बीच संभावित अस्पष्टता को पूरी तरह समाप्त नहीं करता।
theological_decisions:
- issue: भजन 118:22 के पत्थर का मसीही प्रयोग
  choice: मुख्य पाठ में पत्थर, भवन बनाने वालों और कोने के प्रधान पत्थर का रूपक ज्यों का त्यों रखा गया है।
  alternative: पत्थर को सीधे ‘मसीह’ या ‘यीशु’ कहकर स्पष्ट करना।
  rationale: सन्दर्भ इस वचन को यीशु पर लागू करता है, पर मूल उद्धरण स्वयं रूपक में बोलता है। अनुवाद में पहचान जोड़ देना व्याख्या को मूल कथन में मिला देता; इसलिए अर्थगत और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: κεφαλὴ γωνίας की स्थापत्यगत पहचान
  choice: ‘कोने का प्रधान पत्थर’ रखा गया है और विकल्प पादटिप्पणी में बताए गए हैं।
  alternative: इसे निश्चित रूप से केवल ‘नींव का कोने का पत्थर’ या केवल ‘सबसे ऊपर का पत्थर’ कहना।
  rationale: यूनानी पद पत्थर की प्रधानता स्पष्ट करता है, पर उसकी सटीक स्थापत्य स्थिति पर चर्चा संभव है। मुख्य पाठ को किसी एक विवादित चित्र तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और मौखिक पाठ के लिए सहज रखी गई है। ‘राजमिस्त्री’ की अपेक्षा ‘भवन बनाने वालों’ से मूल कृदन्त की व्यापकता बनी रहती है। पद्य-उद्धरण को अलग पंक्तियों में रखकर उसके शास्त्रीय और आलंकारिक स्वर को स्पष्ट किया गया है।
