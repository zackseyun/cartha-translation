source:
  edition: SBLGNT
  text: ⸀καὶ ἐλθόντες λέγουσιν αὐτῷ· Διδάσκαλε, οἴδαμεν ὅτι ἀληθὴς εἶ καὶ οὐ μέλει σοι περὶ οὐδενός, οὐ γὰρ βλέπεις εἰς πρόσωπον ἀνθρώπων, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις· ἔξεστιν ⸂δοῦναι κῆνσον Καίσαρι⸃ ἢ οὔ; δῶμεν ἢ μὴ δῶμεν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/014.yaml
  text: And they came and said to him[a], “Teacher, we know that you are truthful and do not care about anyone, for you do not look at the face of men, but truly teach the way of God. Is it lawful to pay the poll tax to Caesar or not? Should we pay it[b], or should we not pay it?”
translation:
  language: hi
  text: और वे आकर उससे कहने लगे, “गुरु, हम जानते हैं कि आप सत्यवादी हैं और किसी की परवाह नहीं करते, क्योंकि आप लोगों का मुँह देखकर नहीं चलते[a], बल्कि परमेश्वर का मार्ग सच्चाई से सिखाते हैं। क्या कैसर को कर[b] देना उचित है या नहीं? हम दें या न दें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, “आप लोगों के साथ पक्षपात नहीं करते” या “आप लोगों की हैसियत अथवा बाहरी रूप-रंग से प्रभावित नहीं होते।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी शब्द κῆνσος रोमी जनगणना से जुड़े प्रति-व्यक्ति कर को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सुसमाचारों में सम्मानपूर्वक संबोधन के रूप में यह आधुनिक हिन्दी में स्वाभाविक है और शिक्षा देने की भूमिका व्यक्त करता है।
- source_word: ἀληθὴς
  choice: सत्यवादी
  rationale: यह यीशु के चरित्र और सत्य बोलने की विश्वसनीयता को व्यक्त करता है; व्यक्ति के लिए केवल ‘सच्चा’ से अधिक स्पष्ट है।
- source_word: οὐ μέλει σοι περὶ οὐδενός
  choice: किसी की परवाह करके नहीं चलते
  rationale: यह हिन्दी मुहावरा उदासीनता के बजाय लोगों के दबाव या प्रभाव से संचालित न होने का भाव देता है, जिसे अगला कारण-वाक्य स्पष्ट करता है।
- source_word: οὐ ... βλέπεις εἰς πρόσωπον ἀνθρώπων
  choice: लोगों का मुँह देखकर बात नहीं करते
  rationale: मूल के ‘चेहरे की ओर देखने’ वाले ठोस मुहावरे को स्वाभाविक हिन्दी मुहावरे में रखता है; इसका आशय पक्षपात न करना या हैसियत से प्रभावित न होना है।
- source_word: ἐπ’ ἀληθείας
  choice: सच्चाई से
  rationale: क्रियाविशेषणात्मक प्रयोग को सहज हिन्दी में व्यक्त करता है और सत्यपूर्वक शिक्षा देने का भाव बनाए रखता है।
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: परमेश्वर का मार्ग
  rationale: मूल के परिचित बाइबलीय रूपक को बिना सपाट किए सुरक्षित रखता है।
- source_word: ἔξεστιν
  choice: उचित है
  rationale: इस संदर्भ में अनुमति और धार्मिक-नैतिक वैधता के प्रश्न को सामान्य आधुनिक हिन्दी में व्यक्त करता है; ‘वैध’ की संकीर्ण आधुनिक कानूनी ध्वनि से बचता है।
- source_word: δοῦναι κῆνσον Καίσαρι
  choice: कैसर को कर देना
  rationale: δοῦναι का ‘देना’ प्रश्न के अंतिम दोहराव को सुरक्षित रखता है; κῆνσος की ऐतिहासिक विशिष्टता पादटिप्पणी में स्पष्ट की गई है।
- source_word: Καίσαρι
  choice: कैसर
  rationale: रोमी शासक की उपाधि का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: δῶμεν ἢ μὴ δῶμεν
  choice: हम दें या न दें?
  rationale: मूल की संक्षिप्तता और दोहराए गए क्रिया-रूप से उत्पन्न तीखे फँसाने वाले प्रश्न को बनाए रखता है।
theological_decisions:
- issue: मानवीय प्रभाव और पक्षपात से संबंधित मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘किसी की परवाह करके नहीं चलते’ और ‘लोगों का मुँह देखकर बात नहीं करते’ रखा गया।
  alternative: आप किसी के प्रभाव में नहीं आते; आप लोगों के साथ पक्षपात नहीं करते।
  rationale: चुना गया पाठ मूल की दोहरी अभिव्यक्ति और चेहरे से जुड़े ठोस मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है; इससे कोई सांप्रदायिक व्याख्या आरोपित नहीं होती।
- issue: ἔξεστιν में अनुमति, कानून और नैतिक उचितता का संबंध
  choice: उचित है
  alternative: वैध है; अनुमति है; जायज़ है।
  rationale: प्रश्न रोमी शासन के कानून मात्र तक सीमित नहीं, बल्कि परमेश्वर के मार्ग के संदर्भ में क्या करना अनुमत या उचित है, यह भी पूछता है। ‘उचित’ इस व्यापकता को बिना अनावश्यक रूप से तय किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन में ‘आप’ का प्रयोग हिन्दी के स्वाभाविक आदर-स्तर के अनुसार है। ‘मुँह देखकर बात करना’ मूल के चेहरे वाले मुहावरे को जीवित रखता है, और अंतिम ‘हम दें या न दें?’ मूल प्रश्न की तीक्ष्ण पुनरावृत्ति सुरक्षित करता है।
