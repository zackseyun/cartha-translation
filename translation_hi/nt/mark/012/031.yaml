  text: ⸀δευτέρα αὕτη· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν. μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/031.yaml
  text: 'The second is this: ‘You shall love your neighbor as yourself.’ There is no other commandment greater than these[a].'
translation:
  language: hi
  text: 'दूसरी यह है: ‘तुम अपने पड़ोसी से अपने समान प्रेम रखना।’ इनसे बड़ी कोई और आज्ञा नहीं है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δευτέρα αὕτη
  choice: दूसरी यह है
  rationale: यूनानी वाक्य में ‘आज्ञा’ अध्याहृत है। यह संक्षिप्त हिन्दी पिछले प्रसंग की पहली आज्ञा से स्पष्ट संबंध बनाए रखते हुए मूल के बलाघात को सुरक्षित रखती है।
- source_word: Ἀγαπήσεις
  choice: तुम ... प्रेम रखना
  rationale: यह भविष्यकालीन रूप शास्त्रीय उद्धरण में आज्ञार्थक बल रखता है। ‘प्रेम रखना’ लैव्यव्यवस्था 19:18 की उद्धरणात्मक और वाचा-संबंधी गरिमा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν πλησίον σου
  choice: अपने पड़ोसी से
  rationale: ‘पड़ोसी’ πλησίον का मानक, प्रसंगानुकूल अनुवाद है और लैव्यव्यवस्था 19:18 के अंतर्पाठीय संबंध को बनाए रखता है।
- source_word: ὡς σεαυτόν
  choice: अपने समान
  rationale: यह मूल की संक्षिप्त तुलना को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखता है।
- source_word: μείζων τούτων ἄλλη ἐντολὴ οὐκ ἔστιν
  choice: इनसे बड़ी कोई और आज्ञा नहीं है
  rationale: यह तुलनात्मक μείζων, बहुवचन τούτων और अस्तित्वसूचक वाक्य-विन्यास—तीनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐντολή
  choice: आज्ञा
  rationale: ‘आज्ञा’ बाइबलीय और वाचा-संबंधी प्रसंग के अनुरूप है तथा सामान्य पाठक के लिए भी स्पष्ट है।
theological_decisions:
- issue: अंतिम उपवाक्य में τούτων (‘इनसे’) का संदर्भ
  choice: प्रसंग की दोनों आज्ञाओं का संयुक्त बहुवचन संदर्भ
  alternative: केवल तुरंत पहले कही गई दूसरी आज्ञा की ओर सामान्यीकृत संकेत
  rationale: बहुवचन संकेतवाचक स्वाभाविक रूप से प्रसंग में कही गई दोनों आज्ञाओं की ओर लौटता है। ‘इनसे’ मूल की बहुवचनता और उससे जुड़ा धर्मवैचारिक तनाव बिना उसे एकवचन में सीमित किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शास्त्रीय उद्धरण की संक्षिप्तता बनाए रखने के लिए ‘दूसरी आज्ञा यह है’ के बजाय मूल के निकट ‘दूसरी यह है’ रखा गया है।
