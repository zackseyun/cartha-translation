base_translation:
  language: en
  yaml_path: translation/nt/mark/012/013.yaml
  text: And they send to him some of the Pharisees and some of the Herodians[a], so that they might trap him by a word.
translation:
  language: hi
  text: और वे फ़रीसियों में से कुछ और हेरोदियों में से कुछ को उसके पास भेजते हैं, ताकि वे उसे उसकी बात के द्वारा फँसा सकें[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे उसकी कही हुई बात से फँसा सकें।” यूनानी क्रिया में शिकार पकड़ने का रूपक है, और यह पद बताता है कि वे उसकी बातों के माध्यम से उसे फँसाना चाहते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποστέλλουσιν
  choice: भेजते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखते हुए हिन्दी कथा में वर्तमानकालीन सजीवता व्यक्त होती है।
- source_word: τινας τῶν Φαρισαίων καὶ τῶν Ἡρῳδιανῶν
  choice: फ़रीसियों में से कुछ और हेरोदियों में से कुछ
  rationale: τινας के साथ दोनों संबंधकारक समूहों की अंशसूचक रचना को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: Φαρισαίων
  choice: फ़रीसियों
  rationale: यह इस यहूदी समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: Ἡρῳδιανῶν
  choice: हेरोदियों
  rationale: हेरोद से संबद्ध इस समूह के नाम का स्वाभाविक हिन्दी रूप है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक उपवाक्य को आधुनिक और स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἀγρεύσωσιν
  choice: फँसा सकें
  rationale: शिकार पकड़ने के रूपक से निकले इस क्रियापद का प्रसंगानुकूल शत्रुतापूर्ण आशय व्यक्त करता है।
- source_word: λόγῳ
  choice: उसकी किसी बात में
  rationale: साधनवाचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और बताता है कि उसे उसके बोले हुए उत्तर के आधार पर फँसाने का प्रयत्न था; λόγῳ के एकवचन को ‘किसी बात’ से यथासंभव बनाए रखता है।
theological_decisions:
- issue: यूनानी बहुवचन क्रिया का अव्यक्त कर्ता
  choice: वे
  alternative: प्रधान याजक, शास्त्री और पुरनिये; अधिकारी
  rationale: इस पद में कर्ता का नाम दोबारा नहीं दिया गया है, इसलिए पिछले संदर्भ से अधिक विशिष्ट पहचान मुख्य पाठ में जोड़ने के बजाय अव्यक्त बहुवचन को ‘वे’ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘उसकी किसी बात में उसे फँसा सकें’ शाब्दिक शिकार-रूपक और वाणी के माध्यम—दोनों को स्वाभाविक हिन्दी में समेटता है।
