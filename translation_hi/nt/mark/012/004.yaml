source:
  edition: SBLGNT
  text: καὶ πάλιν ἀπέστειλεν πρὸς αὐτοὺς ἄλλον δοῦλον· ⸀κἀκεῖνον ⸀ἐκεφαλίωσαν καὶ ⸀ἠτίμασαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/004.yaml
  text: And again he sent another servant to them[c][b][a], and they struck him on the head and dishonored him.
translation:
  language: hi
  text: फिर उसने उनके पास एक और दास[a] को भेजा। उन्होंने उसके सिर पर वार किया[b] और उसका अपमान किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक और सेवक।” यूनानी शब्द δοῦλος का अर्थ प्रसंग के अनुसार “दास” या “सेवक” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ प्रयुक्त दुर्लभ क्रिया सिर पर की गई हिंसा को दर्शाती है; इसका अर्थ “उसके सिर पर वार किया” या “उसके सिर को घायल किया” हो सकता है, न कि “उसका सिर काट दिया।”
    reason: lexical_alternative
  - marker: c
    text: या, “उसके साथ अपमानजनक व्यवहार किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: दृष्टान्त में बार-बार होने वाली अगली घटना को सहज और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀπέστειλεν
  choice: उसने ... भेजा
  rationale: एओरिस्ट कथात्मक भूतकाल की एक पूर्ण घटना बताता है; हिन्दी में सामान्य भूतकाल स्वाभाविक है।
- source_word: πρὸς αὐτούς
  choice: उनके पास
  rationale: भेजने की क्रिया के साथ πρὸς और कर्मकारक का स्वाभाविक हिन्दी रूप है।
- source_word: ἄλλον δοῦλον
  choice: एक और दास
  rationale: दृष्टान्त के स्वामी-दास सामाजिक संबंध को स्पष्ट रखता है। आधुनिक हिन्दी में ‘दास’ गरिमापूर्ण और परिचित है; ‘सेवक’ संभावित अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: κἀκεῖνον
  choice: उन्होंने उसके
  rationale: κἀκεῖνον का संयोजक और संकेतात्मक बल हिन्दी में नए वाक्य के कर्ता तथा ‘उसके’ से स्वाभाविक रूप में व्यक्त होता है; उसका आशय है कि उस दूसरे दास के साथ भी ऐसा किया गया।
- source_word: ἐκεφαλίωσαν
  choice: उसके सिर पर वार किया
  rationale: दुर्लभ क्रिया सिर की ओर की गई हिंसा दर्शाती है। यह रूप सिर काटने का भ्रामक अर्थ नहीं देता और मूल की कुछ अनिश्चितता बनाए रखता है।
- source_word: ἠτίμασαν
  choice: उसका अपमान किया
  rationale: क्रिया किसी को अनादर और लज्जा के साथ बरतने का भाव देती है; यह आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
