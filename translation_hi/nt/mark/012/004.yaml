  register: भाषा आधुनिक मानक हिन्दी, कथात्मक, सहज और गरिमापूर्ण रखी गई है। ‘दास’ प्राचीन सामाजिक संबंध को बनाए रखता है, जबकि पादटिप्पणी ‘सेवक’ विकल्प देती है। सभी पादटिप्पणी चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
