  text: καὶ ⸂οἱ ἑπτὰ⸃ οὐκ ἀφῆκαν σπέρμα· ⸀ἔσχατον πάντων ⸂καὶ ἡ γυνὴ ἀπέθανεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/022.yaml
  text: And the seven left no offspring. Last of all[a], the woman also died.
translation:
  language: hi
  text: और सातों ने कोई संतान नहीं छोड़ी। सबसे अंत में वह स्त्री भी मर गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἑπτὰ
  choice: सातों
  rationale: यह पदबंध पिछले संदर्भ में आए सात भाइयों की ओर संकेत करता है। ‘सातों’ संक्षिप्त, स्वाभाविक और समावेशी है।
- source_word: οὐκ ἀφῆκαν σπέρμα
  choice: कोई संतान नहीं छोड़ गए
  rationale: शाब्दिक अर्थ ‘बीज नहीं छोड़ा’ है, पर यहाँ σπέρμα वंश या संतान के अर्थ में प्रयुक्त है। आधुनिक हिन्दी में ‘कोई संतान नहीं छोड़ गए’ आशय को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἔσχατον πάντων
  choice: सबसे अंत में
  rationale: यह क्रम में सबसे अंतिम घटना को दर्शाने वाला मुहावरेदार पदबंध है; ‘सबसे अंत में’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: καὶ ἡ γυνὴ
  choice: वह स्त्री भी
  rationale: καί का योगात्मक बल ‘भी’ से व्यक्त होता है, और ‘वह स्त्री’ पहले से उल्लिखित स्त्री की ओर स्पष्ट संकेत करता है।
- source_word: ἀπέθανεν
  choice: मर गई
  rationale: क्रिया मृत्यु को सीधे बताती है; ‘मर गई’ यूनानी की स्पष्टता बनाए रखती है और अनावश्यक शिष्टोक्ति से बचती है।
