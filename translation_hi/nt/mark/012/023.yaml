base_translation:
  language: en
  yaml_path: translation/nt/mark/012/023.yaml
  text: In the resurrection[a], when they rise, whose wife will she be? For the seven had her as wife.
translation:
  language: hi
  text: पुनरुत्थान में, जब वे जी उठेंगे,[a] तब वह उनमें से किसकी पत्नी होगी? क्योंकि वह सातों की पत्नी रह चुकी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वे फिर जी उठेंगे।” यूनानी में शाब्दिक रूप से “जब वे उठेंगे” है; पुनरुत्थान का प्रसंग इसका आशय स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνάστασις
  choice: पुनरुत्थान
  rationale: यहाँ यह संज्ञा सदूकियों के साथ चर्चा में भावी मृतकों के जी उठने को दर्शाती है। ‘पुनरुत्थान’ आधुनिक हिन्दी में प्रचलित और प्रसंगानुकूल धार्मिक शब्द है।
- source_word: ὅταν ἀναστῶσιν
  choice: जब वे जी उठेंगे
  rationale: ὅταν के साथ aorist subjunctive भावी समय का बोध कराता है। ‘जी उठेंगे’ स्वाभाविक हिन्दी है; यूनानी में ‘फिर’ अलग से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: τίνος αὐτῶν
  choice: उनमें से किसकी
  rationale: प्रश्नवाचक संबंध और अंशवाचक genitive को यह हिन्दी अभिव्यक्ति स्पष्ट और सहज रूप से व्यक्त करती है।
- source_word: ἔσται γυνή
  choice: पत्नी होगी
  rationale: यह predicate construction उस वैवाहिक संबंध के विषय में पूछता है जिसमें वह स्त्री पुनरुत्थान में होगी।
- source_word: γυνή
  choice: पत्नी
  rationale: दोनों प्रयोगों में विवाह-संबंध स्पष्ट है, इसलिए व्यापक अर्थ वाले ‘स्त्री’ के बजाय ‘पत्नी’ उपयुक्त है।
- source_word: οἱ γὰρ ἑπτὰ
  choice: क्योंकि सातों
  rationale: γάρ प्रश्न का आधार बताता है और पूर्व प्रसंग सात भाइयों को पहचान चुका है। ‘सातों’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: उसे पत्नी के रूप में रखा था
  rationale: यह ἔχω + accusative + γυναῖκα की संबंध/स्थिति सूचक अभिव्यक्ति को बनाए रखता है और केवल विवाह करने की घटना तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: सदूकियों के साथ विवाद में पुनरुत्थान की भाषा
  choice: पुनरुत्थान में, जब वे जी उठेंगे
  alternative: मरे हुओं के पुनरुत्थान में, जब वे फिर जी उठेंगे
  rationale: मुख्य पाठ भावी पुनरुत्थान को स्पष्ट रखता है, पर यूनानी में प्रत्यक्ष रूप से न आए ‘मरे हुओं के’ और ‘फिर’ को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘पुनरुत्थान’ स्थापित धार्मिक शब्द है, जबकि ‘जी उठेंगे’ क्रिया को सहज बनाता है।
