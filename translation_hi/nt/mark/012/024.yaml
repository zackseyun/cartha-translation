  text: ⸂ἔφη αὐτοῖς ὁ Ἰησοῦς⸃· Οὐ διὰ τοῦτο πλανᾶσθε μὴ εἰδότες τὰς γραφὰς μηδὲ τὴν δύναμιν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/024.yaml
  text: 'Jesus said to them[a], “Is this not why you are mistaken: because you know neither the Scriptures nor the power of God?”'
translation:
  language: hi
  text: यीशु ने उनसे कहा[a], “क्या तुम इसी कारण भूल में नहीं हो कि तुम न तो पवित्र शास्त्रों को जानते हो, न परमेश्वर की सामर्थ्य को?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम इसीलिए नहीं भटकते कि तुम न तो पवित्र शास्त्रों को जानते हो, न परमेश्वर की सामर्थ्य को?”
    reason: πλανᾶσθε और वाक्य-विन्यास का वैकल्पिक, अधिक क्रियात्मक अनुवाद।
lexical_decisions:
- source_word: ἔφη αὐτοῖς ὁ Ἰησοῦς
  choice: यीशु ने उनसे कहा
  rationale: φημί प्रत्यक्ष कथन का सामान्य परिचय देता है; ‘कहा’ बिना अनावश्यक रूप से ‘उत्तर दिया’ का भाव जोड़े स्वाभाविक और सटीक है।
- source_word: Οὐ διὰ τοῦτο
  choice: क्या तुम इसी कारण ... नहीं हो
  rationale: οὐ से आरम्भ हुआ प्रश्न सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है, और διὰ τοῦτο कारण को सूचित करता है।
- source_word: πλανᾶσθε
  choice: भटके हुए हो
  rationale: यह रूप गलती में होने या भटक जाने—दोनों का भाव रख सकता है। ‘भटके हुए’ मूल की गतिशीलता और फटकार को बनाए रखता है, पर बाहरी छल को अनिवार्य नहीं बनाता।
- source_word: μὴ εἰδότες
  choice: कि तुम ... नहीं जानते
  rationale: नकारात्मक कृदन्त उनकी भूल का आधार बताता है; हिन्दी में ‘कि’ वाला उपवाक्य कारण-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰς γραφὰς
  choice: पवित्र शास्त्र
  rationale: बहुवचन γραφαί यहाँ मान्य पवित्र लेखों को दर्शाता है; हिन्दी बाइबिलीय प्रयोग में ‘पवित्र शास्त्र’ स्पष्ट और प्रतिष्ठित पद है।
- source_word: μηδὲ τὴν δύναμιν τοῦ θεοῦ
  choice: न परमेश्वर की सामर्थ्य को
  rationale: μηδέ पहले नकार के साथ ‘न तो...न’ की समानांतर रचना बनाता है; δύναμις के लिए ‘सामर्थ्य’ गरिमापूर्ण और सामान्यतः समझा जाने वाला शब्द है।
theological_decisions:
- issue: πλανᾶσθε में वर्णित भूल का स्वरूप
  choice: भटके हुए हो
  alternative: गलती में हो / धोखा खाए हुए हो
  rationale: यूनानी शब्द बौद्धिक भूल, मार्ग से भटकने या बहकाए जाने की सीमा में अर्थ दे सकता है। संदर्भ पुनरुत्थान, पवित्र शास्त्र और परमेश्वर की सामर्थ्य की गलत समझ का है; चुना हुआ रूप फटकार और मूल अस्पष्टता को बनाए रखता है, पर किसी बाहरी धोखेबाज़ को नहीं मान लेता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आलंकारिक प्रश्न तथा ‘न तो...न’ की समानांतर रचना सुरक्षित है।
