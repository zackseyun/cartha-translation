lexical_decisions:
- source_word: ἐλθοῦσα
  choice: आई
  rationale: यूनानी में यह एओरिस्ट कृदंत है; हिन्दी कथन-शैली में मुख्य क्रिया के साथ समन्वित सीमित क्रिया ‘आई और…डाल दिए’ स्वाभाविक है।
- source_word: μία
  choice: एक
  rationale: यहाँ μία कथा में एक व्यक्ति का परिचय कराता है। हिन्दी में ‘एक गरीब विधवा’ अनिश्चित परिचय को स्वाभाविक रूप से व्यक्त करता है, बिना संख्यात्मक बल दिए।
- source_word: χήρα πτωχὴ
  choice: गरीब विधवा
  rationale: χήρα का सामान्य अर्थ ‘विधवा’ और πτωχή का ‘गरीब’ है। निकट प्रसंग उसकी अत्यंत दीन दशा स्पष्ट करता है, पर इस पद में ‘कंगाल’ कहना अर्थ को आवश्यकता से अधिक तीखा कर सकता है।
- source_word: ἔβαλεν
  choice: डाल दिए
  rationale: दानपात्र के प्रसंग में ‘डालना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है। दो सिक्कों के कारण ‘दिए’ का बहुवचन हिन्दी व्याकरण के अनुरूप है।
- source_word: λεπτὰ δύο
  choice: दो लेप्टा
  rationale: ऐतिहासिक यूनानी सिक्के का नाम सुरक्षित रखा गया है; साथ की टिप्पणी उसके छोटे मूल्य को समझाती है। ‘दो छोटे ताँबे के सिक्के’ अर्थ-स्पष्ट विकल्प है, पर सिक्के की विशिष्ट पहचान खो देता है।
- source_word: ὅ ἐστιν κοδράντης
  choice: जो मिलकर एक क्वाड्रान्स होता है
  rationale: नपुंसक एकवचन ὅ पूरे ‘दो लेप्टा’ की संयुक्त मूल्य-समता बताता है। ‘मिलकर’ हिन्दी पाठक के लिए स्पष्ट करता है कि दोनों सिक्कों का कुल मूल्य एक क्वाड्रान्स था।
