  text: And a poor widow came and put in two lepta[c][b][a], which is a quadrans.
translation:
  language: hi
  text: और एक गरीब विधवा आई और उसने दो लेप्टा[a] डाल दिए, अर्थात् एक क्वाड्रान्स।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
