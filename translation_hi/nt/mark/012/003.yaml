  yaml_path: translation/nt/mark/012/003.yaml
  text: And they took him[a], beat him, and sent him away empty-handed.
translation:
  language: hi
  text: तब उन्होंने उसे पकड़कर पीटा और खाली हाथ लौटा दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαβόντες
  choice: पकड़कर
  rationale: यह भूतकालिक कृदन्त आगे की क्रियाओं से पहले हुई कार्रवाई बताता है। प्रसंग में ‘पकड़कर’ स्वाभाविक है और यूनानी शब्द से अधिक बल प्रयोग नहीं जोड़ता।
- source_word: ἔδειραν
  choice: पीटा
  rationale: δέρω यहाँ मारने-पीटने का अर्थ देता है; ‘पीटा’ स्पष्ट है और औपचारिक कोड़े लगाए जाने जैसी अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: ἀπέστειλαν
  choice: लौटा दिया
  rationale: दास को उसके स्वामी के पास बिना फल के वापस भेजे जाने के प्रसंग में ‘लौटा दिया’ स्वाभाविक हिन्दी है और ἀποστέλλω की प्रेषण-वाचक क्रिया को व्यक्त करता है।
- source_word: κενόν
  choice: खाली हाथ
  rationale: विशेषण का प्रयोग यहाँ इस अर्थ में है कि दास को कुछ भी दिए बिना भेजा गया। ‘खाली हाथ’ आधुनिक हिन्दी में इस आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: καὶ ... καὶ
  choice: तब ... और
  rationale: दोहराया गया καί घटनाओं को सरल क्रम में जोड़ता है। हिन्दी में पहले संबंध को ‘तब’ और अगले को ‘और’ से व्यक्त करना कथा-क्रम को स्पष्ट रखते हुए स्वाभाविक प्रवाह देता है।
