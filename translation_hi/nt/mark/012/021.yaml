  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भाई’ प्रसंग में निहित होने पर भी मूल के इस वाक्यांश में स्पष्ट नहीं है, इसलिए नहीं जोड़ा गया। मुख्य पाठ में मुहावरेदार ‘विवाह किया’ रखा गया और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया।
