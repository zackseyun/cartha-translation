  yaml_path: translation/nt/mark/012/021.yaml
  text: And the second took her[a], and died, leaving no offspring, and the third likewise.
translation:
  language: hi
  text: दूसरे ने उससे विवाह किया[a] और वह कोई संतान छोड़े बिना[b] मर गया; तीसरे ने भी ऐसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे लिया”; यहाँ अर्थ है, उससे विवाह किया या उसे पत्नी बनाया।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में “छोड़े बिना” के शब्दों की पाठ-साक्ष्य अनिश्चित है।
    reason: textual_uncertainty
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: दूसरे ने
  rationale: सवर्णक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। प्रसंग से भाई अभिप्रेत है, पर इस उपवाक्य में ‘भाई’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἔλαβεν αὐτήν
  choice: उससे विवाह किया
  rationale: λαμβάνω का मूल अर्थ ‘लेना/ग्रहण करना’ है, पर इस देवर-विवाह के प्रसंग में इसका स्वाभाविक आशय उस स्त्री को पत्नी बनाना है। आधुनिक हिन्दी में ‘उससे विवाह किया’ अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: ἀπέθανεν
  choice: मर गया
  rationale: साधारण कथात्मक क्रिया का सीधा अनुवाद; किसी शिष्टोक्ति की आवश्यकता नहीं है।
- source_word: μὴ καταλιπὼν σπέρμα
  choice: बिना कोई संतान छोड़े
  rationale: नकारात्मक कृदन्त मृत्यु के साथ जुड़ी परिस्थिति या परिणाम बताता है। σπέρμα यहाँ शाब्दिक ‘बीज’ नहीं, बल्कि वंशज अथवा संतान के अर्थ में है; ‘संतान’ आधुनिक हिन्दी में स्वाभाविक और संख्या की दृष्टि से पर्याप्त रूप से व्यापक है।
- source_word: ὁ τρίτος ὡσαύτως
  choice: तीसरे के साथ भी ऐसा ही हुआ
  rationale: यूनानी वाक्य जानबूझकर संक्षिप्त और लुप्तक्रियात्मक है। हिन्दी में यह रूप उसी संक्षिप्तता को रखते हुए स्पष्ट करता है कि तीसरे का परिणाम भी वही रहा।
