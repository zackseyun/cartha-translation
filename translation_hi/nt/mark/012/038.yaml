  text: Καὶ ⸂ἐν τῇ διδαχῇ αὐτοῦ ἔλεγεν⸃· Βλέπετε ἀπὸ τῶν γραμματέων τῶν θελόντων ἐν στολαῖς περιπατεῖν καὶ ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/038.yaml
  text: And in his teaching he was saying[b][a], “Beware of the scribes who want to walk around in long robes and receive greetings in the marketplaces,”
translation:
  language: hi
  text: और अपनी शिक्षा देते समय वह कहता था, “उन शास्त्रियों से सावधान रहो[a], जो लंबे वस्त्र[b] पहनकर घूमना और बाज़ारों में आदरपूर्ण अभिवादन पाना चाहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शास्त्रियों से चौकन्ने रहो” अथवा “शास्त्रियों से बचकर रहो।”
    reason: lexical_alternative
  - marker: b
    text: “लंबे वस्त्र” ऐसे विशिष्ट बाहरी परिधानों को दर्शाते हैं जो प्रतिष्ठा और सार्वजनिक सम्मान से जुड़े थे।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν τῇ διδαχῇ αὐτοῦ
  choice: अपनी शिक्षा में
  rationale: यह वाक्यांश यीशु के बोलने का प्रसंग या क्षेत्र बताता है और यूनानी संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔλεγεν
  choice: कहता था
  rationale: अपूर्ण भूतकाल चल रही या बार-बार होने वाली वाणी का भाव देता है; ‘कहता था’ उसे सहज हिन्दी में व्यक्त करता है।
- source_word: Βλέπετε ἀπὸ
  choice: से सावधान रहो
  rationale: आज्ञार्थक क्रिया और ἀπό का मेल किसी से चौकन्ना रहने या बचने की गंभीर चेतावनी देता है।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: सुसमाचारों के यहूदी संदर्भ में γραμματεῖς के लिए यह प्रचलित और स्रोत से निकट हिन्दी पद है।
- source_word: τῶν θελόντων
  choice: जो ... चाहते हैं
  rationale: कृदन्त उनकी विशिष्ट इच्छा या प्रवृत्ति बताता है; यह अनुवाद इच्छाशक्ति के भाव को सुरक्षित रखता है।
- source_word: ἐν στολαῖς περιπατεῖν
  choice: लम्बे वस्त्र पहनकर घूमना
  rationale: στολή लम्बे या प्रतिष्ठासूचक बाहरी वस्त्र को दर्शा सकता है; यह रूप दृश्य अर्थ देता है, जबकि सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀσπασμοὺς
  choice: आदर से अभिवादन
  rationale: शब्द का मूल अर्थ ‘अभिवादन’ है, पर इस प्रसंग में सार्वजनिक सम्मान की स्वीकृति निहित है; ‘आदर से’ उसी प्रसंगगत भाव को संक्षेप में प्रकट करता है।
- source_word: ἐν ταῖς ἀγοραῖς
  choice: बाज़ारों में
  rationale: ἀγοραί सार्वजनिक बाज़ार और सभा-स्थल थे; ‘बाज़ारों में’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
theological_decisions:
- issue: शास्त्रियों के विषय में यीशु की चेतावनी का संदर्भ और विस्तार
  choice: चेतावनी उन शास्त्रियों के विरुद्ध है जिनकी पहचान सार्वजनिक प्रतिष्ठा चाहने वाली प्रवृत्ति से होती है।
  alternative: इसे बिना किसी भेद के प्रत्येक शास्त्री की सामूहिक निन्दा मानना।
  rationale: यूनानी पाठ में ‘शास्त्रियों’ के बाद ‘जो ... चाहते हैं’ वाला कृदन्तीय वाक्यांश आता है। हिन्दी में अल्पविराम न रखकर इस विशेषक संबंध को सुरक्षित रखा गया है, बिना पाठ की वास्तविक व्यापकता को कृत्रिम रूप से सीमित या विस्तृत किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शास्त्री’ बाइबलीय संदर्भ का प्रचलित पद है। ‘कहता था’ यूनानी अपूर्ण भूतकाल का पक्ष व्यक्त करता है। पादटिप्पणी [a] चेतावनी की वैकल्पिक अभिव्यक्तियाँ और [b] वस्त्रों का सांस्कृतिक संकेत देती है।
