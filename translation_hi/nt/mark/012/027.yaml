base_translation:
  language: en
  yaml_path: translation/nt/mark/012/027.yaml
  text: He is not God of the dead[a], but of the living[b]. You are greatly mistaken.
translation:
  language: hi
  text: वह मरे हुओं का परमेश्वर नहीं, बल्कि जीवितों का परमेश्वर है। तुम बहुत बड़ी भूल में हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θεὸς
  choice: परमेश्वर
  rationale: संदर्भ में यह अब्राहम, इसहाक और याकूब के एकमात्र परमेश्वर की उपाधि है; इसलिए अनिश्चित अर्थ ‘कोई देवता’ उचित नहीं।
- source_word: νεκρῶν
  choice: मरे हुओं का
  rationale: संज्ञा के रूप में प्रयुक्त बहुवचन विशेषण मृत लोगों को सूचित करता है और ‘जीवितों’ के साथ स्पष्ट विरोध बनाए रखता है।
- source_word: ἀλλὰ ζώντων
  choice: बल्कि जीवितों का
  rationale: कृदंत संज्ञा के रूप में जीवित लोगों को सूचित करता है; यह संक्षिप्त और स्वाभाविक हिन्दी में मूल विरोध को सुरक्षित रखता है।
- source_word: πολὺ
  choice: बहुत बड़ी
  rationale: यह πλανᾶσθε की तीव्रता बताता है; ‘बहुत बड़ी भूल’ आधुनिक हिन्दी में कड़ी फटकार का स्वाभाविक रूप है।
- source_word: πλανᾶσθε
  choice: भूल में हो
  rationale: यह रूप भटकने, धोखा खाने या गलत होने की अर्थ-सीमा रखता है। यहाँ सदूकियों की गंभीर वैचारिक गलती के लिए ‘भूल में हो’ स्वाभाविक है और बाहरी धोखे को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: οὐκ ἔστιν
  choice: वह ... नहीं ... है
  rationale: यूनानी में कर्ता प्रसंग से समझा जाता है। पिछले कथन में उल्लिखित परमेश्वर के लिए हिन्दी में ‘वह’ जोड़ना स्वाभाविक है।
theological_decisions:
- issue: यीशु के तर्क में परमेश्वर के सामने निरंतर जीवन और पुनरुत्थान का निहितार्थ
  choice: ‘मरे हुओं’ और ‘जीवितों’ का सीधा विरोध रखा गया है।
  alternative: इसे पुनरुत्थान या मृत्यु के बाद की अवस्था की स्पष्ट व्याख्या बनाकर प्रस्तुत करना।
  rationale: यह वचन पुनरुत्थान के पक्ष में यीशु के तर्क का अंग है, पर अनुवाद को मूल शब्दों से आगे बढ़कर किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को निश्चित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक। ‘परमेश्वर’ बाइबलीय संदर्भ में स्पष्ट है, और ‘बहुत बड़ी भूल में हो’ मूल की तीखी फटकार को सहज हिन्दी में व्यक्त करता है।
