  edition: SBLGNT
  text: ὁ δὲ εἰδὼς αὐτῶν τὴν ὑπόκρισιν εἶπεν αὐτοῖς· Τί με πειράζετε; φέρετέ μοι δηνάριον ἵνα ἴδω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/015.yaml
  text: But knowing their hypocrisy[a], he said to them[b], “Why are you testing me? Bring me a denarius so that I may see it.”
translation:
  language: hi
  text: पर उसने उनका कपट जानकर उनसे कहा, “तुम मुझे क्यों आज़मा रहे हो?[b] मेरे पास एक दीनार[a] लाओ, ताकि मैं उसे देखूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार एक रोमी चाँदी का सिक्का था, जो सामान्यतः एक दिन की मजदूरी के बराबर माना जाता था।
    reason: cultural_note
  - marker: b
    text: या, “तुम मुझे परीक्षा में क्यों डाल रहे हो?”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: जानकर
  rationale: यह कृदन्त यीशु की उनके कपट के विषय में पहले से स्पष्ट जानकारी व्यक्त करता है; ‘जानकर’ हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: ὑπόκρισιν
  choice: कपट
  rationale: सन्दर्भ में उनकी दिखाई हुई निष्कपटता के पीछे छिपी चाल को व्यक्त करता है। ‘कपट’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक तीव्रता बनाए रखता है।
- source_word: Τί με πειράζετε
  choice: तुम मुझे क्यों परख रहे हो?
  rationale: Τί यहाँ कारण पूछने के अर्थ में है। ‘परख रहे हो’ वर्तमान, विरोधपूर्ण जाँच और फँसाने के प्रयास को व्यक्त करता है, पर पाप के लिए लुभाने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: φέρετέ μοι
  choice: मेरे पास ... लाओ
  rationale: आज्ञार्थक क्रिया और यीशु की ओर वस्तु लाने की दिशा को सहज हिन्दी में व्यक्त करता है।
- source_word: δηνάριον
  choice: एक दीनार
  rationale: ऐतिहासिक सिक्के का नाम बनाए रखा गया है; पादटिप्पणी उसके रोमी सांस्कृतिक मूल्य को स्पष्ट करती है।
- source_word: ἵνα ἴδω
  choice: ताकि मैं उसे देखूँ
  rationale: उद्देश्यवाचक उपवाक्य को बनाए रखता है; ‘उसे’ का संकेत दीनार की ओर है और हिन्दी में स्पष्टता देता है।
theological_decisions:
- issue: πειράζετε में विरोधपूर्ण परीक्षा और प्रलोभन की सम्भावित अर्थ-सीमा
  choice: मुझे क्यों परख रहे हो
  alternative: मुझे परीक्षा में क्यों डाल रहे हो
  rationale: प्रसंग में प्रश्न निष्पक्ष जिज्ञासा नहीं, बल्कि यीशु को फँसाने का प्रयास है। मुख्य पाठ का ‘परख’ यह विरोधपूर्ण भाव बनाए रखता है; पादटिप्पणी यूनानी क्रिया की व्यापक अर्थ-सीमा भी सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कपट’ धार्मिक सन्दर्भ में परिचित होते हुए भी सामान्य पाठक के लिए स्पष्ट है। पादटिप्पणी-चिह्न सम्बन्धित शब्दों के ठीक बाद रखे गए हैं।
