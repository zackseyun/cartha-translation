source:
  edition: SBLGNT
  text: Καὶ ἐζήτουν αὐτὸν κρατῆσαι, καὶ ἐφοβήθησαν τὸν ὄχλον, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς τὴν παραβολὴν εἶπεν. καὶ ἀφέντες αὐτὸν ἀπῆλθον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/012.yaml
  text: And they were seeking to seize him[a], but they feared the crowd, for they knew that he had spoken the parable against them. So they left him and went away.
translation:
  language: hi
  text: वे उसे पकड़ने की कोशिश कर रहे थे, पर वे भीड़ से डर गए, क्योंकि वे समझ गए थे कि उसने वह दृष्टान्त उनके विरुद्ध[a] कहा था। तब वे उसे छोड़कर चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके विषय में’ अथवा ‘उनसे।’
    reason: यूनानी πρὸς αὐτούς का अर्थ इस संदर्भ में ‘उनके विरुद्ध’ हो सकता है, पर उसका अधिक शाब्दिक और तटस्थ अर्थ ‘उनके विषय में’ या ‘उनसे’ भी सम्भव है।
lexical_decisions:
- source_word: ἐζήτουν
  choice: कोशिश कर रहे थे
  rationale: अपूर्ण काल जारी या प्रयास की जा रही कार्रवाई को दर्शाता है; यह प्रयोग स्वाभाविक हिन्दी में उस पक्ष को बनाए रखता है।
- source_word: κρατῆσαι
  choice: पकड़ने
  rationale: κρατέω का मूल भाव किसी को पकड़ लेना या अपने काबू में करना है। ‘गिरफ़्तार करने’ की अपेक्षा ‘पकड़ने’ से ऐसा औपचारिक कानूनी अर्थ नहीं जुड़ता जो यूनानी पाठ में स्पष्ट नहीं है।
- source_word: ἐφοβήθησαν τὸν ὄχλον
  choice: वे भीड़ से डर गए
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और भीड़ के प्रति उनके भय को सीधे व्यक्त करता है।
- source_word: ἔγνωσαν
  choice: वे समझ गए थे
  rationale: संदर्भ में यह क्रिया इस पहचान या बोध को व्यक्त करती है कि दृष्टान्त उन्हीं को लक्ष्य करके कहा गया था; ‘समझ गए’ हिन्दी में इस अर्थ को स्वाभाविक रूप से देता है।
- source_word: πρὸς αὐτοὺς
  choice: उनके विरुद्ध
  rationale: विरोधपूर्ण संदर्भ में यह दृष्टान्त के उनके विरुद्ध निर्देशित होने का भाव देता है, जबकि अधिक तटस्थ सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: τὴν παραβολὴν
  choice: वह दृष्टान्त
  rationale: निश्चित उपपद पिछले कथित दृष्टान्त की ओर संकेत करता है; ‘वह दृष्टान्त’ हिन्दी में संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ἀφέντες αὐτὸν
  choice: उसे छोड़कर
  rationale: यहाँ भाव है कि उन्होंने यीशु को वहीं छोड़ दिया और अपना प्रयास आगे नहीं बढ़ाया; कृदन्त का स्वाभाविक हिन्दी रूप यही है।
- source_word: ἀπῆλθον
  choice: चले गए
  rationale: यह सरल आधुनिक हिन्दी में स्थान से दूर चले जाने की कथात्मक गति को व्यक्त करता है।
