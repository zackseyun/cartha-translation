  naturalness: The register is modern and dignified. Revising the first clause and using “भेजा और कहा” produces more idiomatic, precise Hindi.
  terminology: “प्रिय पुत्र” appropriately preserves ἀγαπητός and its Markan resonance without doctrinal expansion. “आदर करेंगे” is a sound contextual rendering of ἐντραπήσονται; the note responsibly retains the wider semantic range.
  issues:
