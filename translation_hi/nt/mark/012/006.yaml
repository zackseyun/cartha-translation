  text: ἔτι ⸂ἕνα εἶχεν, υἱὸν ἀγαπητόν· ἀπέστειλεν⸃ αὐτὸν ⸂ἔσχατον πρὸς αὐτοὺς⸃ λέγων ὅτι Ἐντραπήσονται τὸν υἱόν μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/006.yaml
  text: He still had one[a], a beloved son. He sent him last to them, saying[c][b], ‘They will respect my son.’
translation:
  language: hi
  text: उसके पास अब भी एक था—एक प्रिय पुत्र।[a] उसने उसे सबसे अंत में उनके पास भेजा और कहा, ‘वे मेरे पुत्र का आदर करेंगे।’[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पास अब भी एक और था—उसका अत्यंत प्रिय पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी क्रिया का अर्थ किसी के सामने लज्जित होना, उसका लिहाज़ करना, या उसके प्रति आदर दिखाना भी हो सकता है। यहाँ प्रसंग में ‘आदर करेंगे’ उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι ἕνα εἶχεν
  choice: उसके पास अब भी एक और था
  rationale: यह वाक्यांश पहले भेजे गए सेवकों के बाद एक व्यक्ति के शेष होने का भाव देता है। ‘अब भी एक और था’ आधुनिक हिन्दी में स्वाभाविक है और उस अंतिम व्यक्ति की ओर कथा को बढ़ाता है।
- source_word: υἱὸν ἀγαπητόν
  choice: उसका प्रिय पुत्र
  rationale: ‘प्रिय पुत्र’ प्रेम और विशेष संबंध का भार बनाए रखता है तथा मरकुस में प्रिय पुत्र संबंधी प्रतिध्वनि को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἀπέστειλεν ... ἔσχατον πρὸς αὐτούς
  choice: उसने सबसे अंत में उसे उनके पास भेजते हुए
  rationale: ‘सबसे अंत में’ पुत्र के क्रमगत और चरम स्थान को स्पष्ट करता है; ‘उनके पास भेजा’ प्रेषण के प्रसंग में स्वाभाविक हिन्दी है।
- source_word: λέγων ὅτι
  choice: कहा
  rationale: यूनानी परिचय प्रत्यक्ष कथन की ओर ले जाता है; हिन्दी में प्रत्यक्ष उद्धरण के साथ ‘कहा’ सहज और सटीक है।
- source_word: Ἐντραπήσονται
  choice: आदर करेंगे
  rationale: इस प्रसंग में क्रिया किसी के सामने संकोच या लज्जा अनुभव करके उसके प्रति सम्मान अथवा लिहाज़ दिखाने का अर्थ देती है। ‘आदर करेंगे’ मुख्य प्रसंगगत अर्थ को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν υἱόν μου
  choice: मेरे पुत्र का
  rationale: साधारण संबंधसूचक अनुवाद मूल कथन की सादगी और पुत्र-संबंधी धार्मिक प्रतिध्वनि दोनों को बनाए रखता है।
theological_decisions:
- issue: दृष्टान्त में ‘प्रिय पुत्र’ की मसीह-संबंधी प्रतिध्वनि
  choice: मुख्य पाठ में ‘उसका प्रिय पुत्र’ रखा गया है, बिना अर्थ को विस्तार देकर समझाए।
  alternative: उसका अत्यंत प्यारा पुत्र
  rationale: यह पद मरकुस में यीशु को प्रिय पुत्र कहे जाने की प्रतिध्वनि उत्पन्न करता है, पर अनुवाद को उस निहितार्थ को पाठ में खुलकर जोड़ना नहीं चाहिए।
- issue: मालिक की अपेक्षा में आदर और लज्जा का अर्थ-संबंध
  choice: मुख्य पाठ में ‘आदर करेंगे’
  alternative: उसके सामने लज्जित होंगे / उसका लिहाज़ करेंगे
  rationale: ἐντρέπομαι में लज्जा, संकोच और सम्मान दिखाने के अर्थ आपस में जुड़े हो सकते हैं। दृष्टान्त में मालिक की अपेक्षा व्यवहारगत सम्मान की है, फिर भी पादटिप्पणी व्यापक अर्थ-सीमा सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश समानाधिकरण को स्पष्ट करता है, और ‘प्रिय पुत्र’ को धार्मिक व्याख्या से भारी किए बिना उसकी कथात्मक तथा मसीह-संबंधी प्रतिध्वनि बनाए रखता है।
