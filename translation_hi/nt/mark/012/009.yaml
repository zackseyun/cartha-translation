  text: ⸀τί ποιήσει ὁ κύριος τοῦ ἀμπελῶνος; ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργούς, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/009.yaml
  text: What will the owner of the vineyard do? He will come and destroy the tenant farmers[a], and give the vineyard to others.
translation:
  language: hi
  text: दाख की बारी का मालिक क्या करेगा? वह आएगा और उन किरायेदार किसानों[a] का नाश कर देगा और दाख की बारी दूसरों को दे देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काश्तकारों”; यूनानी शब्द खेती करने वालों को दर्शाता है। इस दृष्टान्त में वे किसी और की दाख की बारी लेकर उसे जोतने वाले लोग हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ποιήσει
  choice: क्या करेगा
  rationale: प्रश्नवाचक सर्वनाम और भविष्यकालीन क्रिया का सीधा, स्वाभाविक हिन्दी रूप; यूनानी पाठ में निहित न होने वाला अतिरिक्त निष्कर्षसूचक भाव नहीं जोड़ा गया।
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: दाख की बारी का मालिक
  rationale: दृष्टान्त के भीतर κύριος उस संपत्ति के स्वामी को दर्शाता है। ‘मालिक’ प्रसंगानुकूल है और यहाँ अनावश्यक ईश्वरीय उपाधि का संकेत नहीं देता।
- source_word: ἀμπελῶνος / ἀμπελῶνα
  choice: दाख की बारी
  rationale: ἀμπελών के लिए सामान्य, स्पष्ट और कृषि-संदर्भ के अनुकूल हिन्दी अभिव्यक्ति।
- source_word: ἐλεύσεται
  choice: वह आएगा
  rationale: भविष्यकाल को सीधे व्यक्त करता है और मालिक के हस्तक्षेप की सजीवता बनाए रखता है।
- source_word: ἀπολέσει
  choice: नाश कर देगा
  rationale: ἀπόλλυμι की कठोर और निर्णायक कार्रवाई को व्यक्त करता है, पर इसे केवल ‘मार डालेगा’ के संकुचित अर्थ तक सीमित नहीं करता।
- source_word: τοὺς γεωργούς
  choice: उन बटाईदारों
  rationale: इस दृष्टान्त में ये केवल खेतिहर मजदूर नहीं, बल्कि दूसरे के दाख की बारी को लेकर उसे जोतने वाले काश्तकार हैं। ‘बटाईदार’ खेती और किरायेदारी, दोनों संबंधों को संक्षेप में व्यक्त करता है।
- source_word: δώσει
  choice: दे देगा
  rationale: δίδωμι का सीधा समतुल्य; ‘सौंप देगा’ या ‘पट्टे पर देगा’ जैसी अधिक विशिष्ट व्याख्या नहीं जोड़ी गई।
- source_word: ἄλλοις
  choice: दूसरों को
  rationale: यूनानी के समान प्राप्तकर्ताओं की पहचान खुली रखता है; ‘दूसरे बटाईदारों’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: दृष्टान्त में गैर-ईश्वरीय संदर्भ वाले κύριος का अनुवाद
  choice: मालिक
  alternative: प्रभु; स्वामी
  rationale: तात्कालिक कथानक में यह शब्द दाख की बारी के स्वत्वधारी के लिए है। ‘मालिक’ मूल संदर्भ को स्पष्ट करता है और दृष्टान्त के व्यापक धर्मवैज्ञानिक संकेतों को शब्द में पहले से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज लेकिन गरिमापूर्ण शैली। ‘दाख की बारी’ सामान्य बाइबलीय-कृषि पदावली के रूप में रखा गया है। प्रारम्भ का ‘तब’ यूनानी में अलग शब्द के रूप में नहीं है, पर पिछले दृष्टान्त से उठते प्रश्न को हिन्दी में स्वाभाविक रूप से जोड़ता है।
