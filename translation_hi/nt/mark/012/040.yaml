  text: οἱ κατεσθίοντες τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσευχόμενοι· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/040.yaml
  text: who devour widows’ houses and for appearance’s sake pray at length—these will receive greater condemnation[a][b].
translation:
  language: hi
  text: जो विधवाओं के घरों को निगल जाते हैं और दिखावे के लिए[a] लंबी प्रार्थनाएँ करते हैं—उन्हें और भी कठोर दण्ड मिलेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बहाने के रूप में’ अथवा ‘दिखावे के तौर पर’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘और भी बड़ा न्याय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατεσθίοντες
  choice: निगल जाते हैं
  rationale: यह रूपक दूसरों की संपत्ति को लालच से हड़प लेने की सजीव और कठोर छवि बनाए रखता है; केवल ‘शोषण करते हैं’ कहना मूल की चित्रात्मक शक्ति को घटा देता।
- source_word: οἰκίας
  choice: घरों
  rationale: मूल शब्द का सीधा अर्थ ‘घर’ है। प्रसंग में इसमें विधवाओं की गृहस्थी या संपत्ति भी निहित हो सकती है, पर अनुवाद उस अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: χηρῶν
  choice: विधवाओं के
  rationale: संबंधकारक बहुवचन को स्वाभाविक हिन्दी में अधिकार-संबंध के रूप में व्यक्त किया गया है।
- source_word: προφάσει
  choice: दिखावे के लिए
  rationale: यह प्रार्थना के बाहरी प्रदर्शन और कपटपूर्ण उद्देश्य को सहज आधुनिक हिन्दी में व्यक्त करता है; ‘बहाने के रूप में’ भी संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: μακρὰ προσευχόμενοι
  choice: लंबी-लंबी प्रार्थनाएँ करते हैं
  rationale: μακρὰ यहाँ प्रार्थना की अवधि बताता है। यह हिन्दी प्रयोग दीर्घ प्रार्थना का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: λήμψονται
  choice: मिलेगा
  rationale: भविष्यकालीन प्राप्ति को हिन्दी के स्वाभाविक कर्मवाच्य-सदृश विधान ‘उन्हें ... मिलेगा’ से व्यक्त किया गया है।
- source_word: περισσότερον
  choice: और भी कठोर
  rationale: तुलनात्मक अर्थ को दण्ड की अधिक गंभीर मात्रा के रूप में सहज हिन्दी में व्यक्त किया गया है।
- source_word: κρίμα
  choice: दण्ड
  rationale: इस चेतावनी के प्रसंग में शब्द का अर्थ केवल मूल्यांकन नहीं, बल्कि दोष के फलस्वरूप मिलने वाला प्रतिकूल न्यायिक परिणाम है। ‘न्याय-दण्ड’ संभावित विकल्प के रूप में पाद-टिप्पणी में रखा गया है।
theological_decisions:
- issue: धार्मिक कपट के विरुद्ध चेतावनी में κρίμα का बल
  choice: दण्ड
  alternative: न्याय-दण्ड
  rationale: प्रसंग दण्डात्मक ईश्वरीय लेखे-जोखे की चेतावनी देता है। ‘दण्ड’ इस बल को स्पष्ट करता है, जबकि पाद-टिप्पणी व्यापक न्यायिक अर्थ को सुरक्षित रखती है; अनुवाद अंतिम न्याय के विषय में पाठ से आगे कोई विस्तृत सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘निगल जाते हैं’ मूल रूपक की तीव्रता बनाए रखता है, और वाक्य का ‘जो ... उन्हें’ ढाँचा यूनानी कृदन्तीय वर्णन को स्वतंत्र पद के रूप में स्पष्ट बनाता है।
