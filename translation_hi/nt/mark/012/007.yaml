base_translation:
  language: en
  yaml_path: translation/nt/mark/012/007.yaml
  text: But those tenant farmers said to one another[a], ‘This is the heir. Come, let us kill him[b], and the inheritance will be ours.’
translation:
  language: hi
  text: पर उन पट्टेदार किसानों ने आपस में कहा[a], ‘यही वारिस है। आओ, हम इसे मार डालें, और विरासत हमारी हो जाएगी[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने बीच कहा।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘और विरासत हमारी होगी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκεῖνοι δὲ οἱ γεωργοὶ
  choice: पर उन बटाईदार किसानों ने
  rationale: δέ के हल्के विरोधात्मक बल को ‘पर’ से, ἐκεῖνοι को ‘उन’ से, और दाखबारी को पट्टे पर लेकर काम करने वाले γεωργοί की सामाजिक भूमिका को स्वाभाविक हिन्दी में ‘बटाईदार किसानों’ से व्यक्त किया गया है।
- source_word: πρὸς ἑαυτοὺς εἶπαν
  choice: आपस में कहा
  rationale: यह समूह के भीतर परस्पर विचार-विमर्श को व्यक्त करता है और ‘अपने आप से कहा’ जैसी केवल मन में बोलने की सम्भावना से बचाता है।
- source_word: Οὗτός ἐστιν ὁ κληρονόμος
  choice: यही वारिस है
  rationale: ‘यही’ संकेतवाचक शब्द के तात्कालिक और पहचानसूचक बल को स्वाभाविक हिन्दी में रखता है; κληρονόμος के लिए ‘वारिस’ सामान्य और स्पष्ट शब्द है।
- source_word: δεῦτε ἀποκτείνωμεν αὐτόν
  choice: आओ, हम इसे मार डालें
  rationale: δεῦτε के आह्वान और प्रथम पुरुष बहुवचन के प्रस्तावात्मक भाव को सीधे व्यक्त किया गया है; ‘हत्या करें’ क्रिया में निहित न होने वाला अतिरिक्त कानूनी रंग जोड़ सकता है।
- source_word: καὶ ἡμῶν ἔσται ἡ κληρονομία
  choice: और विरासत हमारी हो जाएगी
  rationale: यह ἡμῶν के अधिकारसूचक बल और भावी अपेक्षा को स्वाभाविक हिन्दी में रखता है; यूनानी में स्पष्ट न होने के कारण ‘उसकी विरासत’ नहीं जोड़ा गया।
theological_decisions:
- issue: दृष्टान्त में γεωργοί की भूमिका
  choice: बटाईदार किसान
  alternative: किसान; दाख की बारी के रखवाले; पट्टेदार
  rationale: सन्दर्भ में ये केवल खेतिहर मजदूर नहीं, बल्कि मालिक की दाखबारी पर अधिकार लेकर उसे चलाने वाले लोग हैं। ‘बटाईदार किसान’ मालिक के प्रति उनकी जवाबदेही स्पष्ट करता है, पर कोई अतिरिक्त रूपकात्मक पहचान नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘वारिस’ और ‘विरासत’ सामान्य पाठक के लिए परिचित हैं। मुख्य पाठ के सभी पादटिप्पणी चिह्न [a], [b] के रूप में दिए गए हैं।
