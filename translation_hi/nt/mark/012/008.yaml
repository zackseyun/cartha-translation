  text: καὶ λαβόντες ⸂ἀπέκτειναν αὐτόν, καὶ ἐξέβαλον αὐτὸν⸃ ἔξω τοῦ ἀμπελῶνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/008.yaml
  text: And they took him[a], killed him, and threw him out of the vineyard.
translation:
  language: hi
  text: और उन्होंने उसे पकड़ लिया[a], उसे मार डाला और दाख की बारी से बाहर फेंक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ पाठक समानांतर दृष्टान्त की परंपरा के कारण यह क्रम अपेक्षित समझ सकते हैं कि उन्होंने पहले उसे दाख की बारी से बाहर फेंका और फिर मार डाला; पर यहाँ मरकुस के यूनानी पाठ में क्रम है: “उसे मार डाला और दाख की बारी से बाहर फेंक दिया।”'
    reason: cross_reference
lexical_decisions:
- source_word: λαβόντες
  choice: उन्होंने उसे पकड़ लिया
  rationale: यह λαμβάνω के एओरिस्ट कृदंत को स्वाभाविक हिन्दी कथात्मक क्रम में व्यक्त करता है। प्रसंग में ‘पकड़ लिया’ पर्याप्त बल रखता है, पर मूल शब्द से अनिवार्य रूप से अत्यधिक हिंसक अर्थ नहीं जोड़ता।
- source_word: ἀπέκτειναν
  choice: उसे मार डाला
  rationale: ἀποκτείνω का सीधा अर्थ किसी को मार डालना है; यह आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: ἐξέβαλον
  choice: बाहर फेंक दिया
  rationale: ἐκβάλλω यहाँ बलपूर्वक बाहर किए जाने को दर्शाता है। ‘बाहर फेंक दिया’ मूल की तीव्रता और आधुनिक हिन्दी की स्वाभाविकता दोनों बनाए रखता है।
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: दाख की बारी से बाहर
  rationale: ἔξω के साथ संबंधकारक यहाँ भीतर से बाहर की ओर गति बताता है; ‘से बाहर’ उसी दिशा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀμπελῶνος
  choice: दाख की बारी
  rationale: ἀμπελών अंगूर की खेती वाली बारी को दर्शाता है। ‘दाख की बारी’ हिन्दी बाइबलीय संदर्भ में परिचित, स्पष्ट और गरिमापूर्ण पद है।
theological_decisions:
- issue: हत्या और दाख की बारी से बाहर फेंकने का क्रम
  choice: 'यूनानी पाठ का क्रम रखा गया है: पहले उसे मार डाला, फिर दाख की बारी से बाहर फेंक दिया।'
  alternative: समानांतर दृष्टान्त की परंपरा के अनुसार पहले बाहर फेंकना और फिर मार डालना।
  rationale: SBLGNT में मरकुस 12:8 का स्पष्ट कथात्मक क्रम λαβόντες—ἀπέκτειναν—ἐξέβαλον है। समानांतर पाठों या व्याख्यात्मक अपेक्षाओं से सामंजस्य बैठाने के बजाय इसी क्रम को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और तीव्र कथात्मक शैली। ‘दाख की बारी’ परिचित बाइबलीय पदावली है; वाक्य ने मूल यूनानी की क्रियाओं का क्रम जानबूझकर सुरक्षित रखा है।
