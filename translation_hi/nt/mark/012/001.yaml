id: MRK.12.1
reference: Mark 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤρξατο αὐτοῖς ἐν παραβολαῖς ⸀λαλεῖν· Ἀμπελῶνα ⸂ἄνθρωπος ἐφύτευσεν⸃, καὶ περιέθηκεν φραγμὸν καὶ ὤρυξεν ὑπολήνιον καὶ ᾠκοδόμησεν πύργον, καὶ ἐξέδετο αὐτὸν γεωργοῖς, καὶ ἀπεδήμησεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/001.yaml
  text: 'And he began to speak to them in parables: “A man planted a vineyard[a], and put a fence around it, and dug a winepress pit, and built a tower, and leased it to tenant farmers[d][c][b], and went away.”'
translation:
  language: hi
  text: 'और वह उनसे दृष्टान्तों में बातें करने लगा: “एक मनुष्य ने एक दाखबारी लगाई, उसके चारों ओर बाड़ लगाई[a], दाखरस का एक कुंड खोदा[b], एक मीनार बनाई, और उसे किसानों को पट्टे पर दे दिया[c][d]; फिर वह चला गया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके चारों ओर घेरा बनाया।” यूनानी शब्द φραγμός बाड़, झाड़ी की बाड़, या किसी भी घेरने वाली रुकावट को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दाखरस निचोड़ने के लिए एक गड्ढा खोदा।” यूनानी ὑπολήνιον विशेष रूप से अंगूर रौंदने की जगह के नीचे के उस कुंड या गड्ढे को सूचित करता है जिसमें रस इकट्ठा होता था।
    reason: lexical_alternative
  - marker: c
    text: या “उसे किसानों को किराए पर दे दिया” अथवा “अंगूर की खेती करने वालों को पट्टे पर दे दिया।”
    reason: lexical_alternative
  - marker: d
    text: यह शब्दचित्र यशायाह 5:1–2 की प्रतिध्वनि है, जहाँ दाखबारी लगाई जाती है, उसे घेरा जाता है, और उसके लिए आवश्यक संरचनाएँ बनाई जाती हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἤρξατο αὐτοῖς ἐν παραβολαῖς λαλεῖν
  choice: वह उनसे दृष्टान्तों में बातें करने लगा
  rationale: आरम्भसूचक ἤρξατο और infinitive λαλεῖν को स्वाभाविक हिन्दी में ‘बातें करने लगा’ से व्यक्त किया गया है; बहुवचन παραβολαῖς को ‘दृष्टान्तों में’ रखा गया है।
- source_word: Ἀμπελῶνα ἄνθρωπος ἐφύτευσεν
  choice: एक मनुष्य ने अंगूरों का एक बाग लगाया
  rationale: ἀμπελών के लिए आधुनिक पाठक को स्पष्ट ‘अंगूरों का बाग’ चुना गया; ἄνθρωπος कहानी के पुरुष भूमिस्वामी को सूचित करता है, इसलिए ‘एक मनुष्य’ उपयुक्त है।
- source_word: περιέθηκεν φραγμόν
  choice: उसके चारों ओर बाड़ लगाई
  rationale: φραγμός किसी बाड़, बाड़े या घेरने वाली रुकावट को सूचित कर सकता है; मुख्य पाठ में सहज और व्यापक ‘बाड़’ रखा गया है।
- source_word: ὤρυξεν ὑπολήνιον
  choice: दाखरस के कुण्ड के लिए एक गड्ढा खोदा
  rationale: ὑπολήνιον अंगूर रौंदने की ऊपरी जगह नहीं, बल्कि नीचे रस जमा करने वाले पात्र या कुण्ड को सूचित करता है। यह अनुवाद उस कृषि-संरचना को स्पष्ट रखते हुए मूल की विशिष्टता बचाता है।
- source_word: ᾠκοδόμησεν πύργον
  choice: एक मीनार बनाई
  rationale: πύργος का सीधा अर्थ मीनार है, जो दाखबारी की निगरानी और सुरक्षा की संरचना थी; उद्देश्य को पाठ में जोड़े बिना केवल संरचना का नाम दिया गया है।
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: उसे बटाईदार किसानों को ठेके पर दे दिया
  rationale: ἐκδίδομαι यहाँ संपत्ति ठेके पर देने और γεωργοί दूसरे के खेत पर खेती करने वालों को दर्शाता है। ‘बटाईदार किसान’ स्वामित्व और काश्तकारी के भेद को स्पष्ट करता है, जबकि ‘ठेके पर’ लेन-देन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπεδήμησεν
  choice: परदेश चला गया
  rationale: क्रिया अपने स्थान या देश से कुछ समय के लिए दूर जाने का भाव रखती है। ‘परदेश चला गया’ केवल ‘चला गया’ से इसे अधिक स्पष्ट करता है, बिना यात्रा की अवधि या दूरी निर्धारित किए।
theological_decisions:
- issue: ἄνθρωπος की लैंगिक और कथात्मक विशिष्टता
  choice: एक मनुष्य
  alternative: एक व्यक्ति / किसी ने
  rationale: यह सामान्य मानवजाति का उल्लेख नहीं, बल्कि दृष्टान्त के पुरुष भूमिस्वामी का परिचय है; इसलिए मूल की कथात्मक विशिष्टता रखी गई है।
- issue: γεωργοῖς का सामाजिक संबंध
  choice: बटाईदार किसानों
  alternative: किसानों / अंगूर की खेती करने वालों
  rationale: दाखबारी पहले मालिक की है और फिर उन्हें ठेके पर दी जाती है। चुना हुआ पद इस स्वामित्व-काश्तकारी संबंध को उजागर करता है, जो आगे के दृष्टान्त के तनाव के लिए महत्त्वपूर्ण है, पर किसी विशेष धार्मिक पहचान को पाठ में नहीं जोड़ता।
- issue: यशायाह 5:1–2 की प्रतिध्वनि
  choice: मुख्य पाठ में कृषि-विवरण को ज्यों का त्यों रखना और पादटिप्पणी में संबंध बताना
  alternative: मुख्य पाठ में इस्राएल या परमेश्वर की दाखबारी की व्याख्या जोड़ना
  rationale: शब्दचित्र यशायाह 5 से स्पष्ट साम्य रखता है, किन्तु मरकुस के इस वाक्य में उसका अर्थ प्रत्यक्ष रूप से नहीं खोला गया। अतः संकेत दिया गया है, व्याख्या मुख्य पाठ में नहीं मिलाई गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘दृष्टान्त’, ‘दाखरस’ और ‘मीनार’ जैसे परिचित बाइबलीय शब्द बनाए रखे गए हैं, जबकि कृषि-संबंधी दुर्लभ ὑπολήνιον को स्पष्ट वाक्यांश से व्यक्त किया गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
