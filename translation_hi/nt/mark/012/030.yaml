source:
  edition: SBLGNT
  text: καὶ ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ἐξ ὅλης τῆς ψυχῆς σου καὶ ἐξ ὅλης τῆς διανοίας σου καὶ ἐξ ὅλης τῆς ἰσχύος ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/030.yaml
  text: And you shall love the Lord your God with all your heart and with all your soul and with all your mind and with all your strength[a][b][c].
translation:
  language: hi
  text: और तुम अपने प्रभु परमेश्वर से अपने पूरे हृदय से, अपने पूरे प्राण से[a], अपनी पूरी बुद्धि से[b] और अपनी पूरी शक्ति से[c] प्रेम रखना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने पूरे जीवन से’ (ψυχῆς)।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी सारी समझ से’ (διανοίας)।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपने सारे सामर्थ्य से’ (ἰσχύος)।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπήσεις
  choice: प्रेम रखना
  rationale: भविष्यत् सूचक रूप यहाँ उद्धृत आज्ञा का बल रखता है। ‘प्रेम रखना’ हिंदी में आज्ञात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है और इसे केवल भावनात्मक लगाव तक सीमित नहीं करता।
- source_word: κύριον τὸν θεόν σου
  choice: प्रभु अपने परमेश्वर
  rationale: यह वाचा-संबंधी सूत्र को सुरक्षित रखता है; κύριος का मानक रूप ‘प्रभु’ और θεός का ‘परमेश्वर’ किया गया है।
- source_word: ἐξ
  choice: से
  rationale: अंगों और क्षमताओं के साथ प्रयुक्त यह यूनानी पूर्वसर्ग यहाँ संपूर्ण व्यक्तित्व के द्वारा प्रेम करने का भाव देता है; हिंदी में ‘से’ इस पुनरावृत्त संरचना को स्वाभाविक रूप से बनाए रखता है।
- source_word: ὅλης
  choice: सारे / सारी
  rationale: हर पद में संपूर्णता पर दिए गए बल को दोहराकर सुरक्षित रखा गया है; लिंग के अनुसार हिंदी रूप बदला है।
- source_word: καρδίας
  choice: हृदय
  rationale: यह व्यक्ति के भीतरी केंद्र—भावना, इच्छा और संकल्प—के लिए स्थापित, गरिमापूर्ण और व्यापक हिंदी शब्द है।
- source_word: ψυχῆς
  choice: प्राण
  rationale: ψυχή के ‘प्राण/जीवन/स्व’ जैसे अर्थ हो सकते हैं। ‘प्राण’ सूची में अन्य क्षमताओं से भेद बनाए रखता है और हिंदी बाइबलीय शैली में समझने योग्य है।
- source_word: διανοίας
  choice: बुद्धि
  rationale: यह सोचने और समझने की क्षमता को दर्शाता है तथा ‘हृदय’ और ‘प्राण’ से इसका भेद बनाए रखता है।
- source_word: ἰσχύος
  choice: शक्ति
  rationale: ἰσχύς की सामर्थ्य या बल की धारणा के लिए ‘शक्ति’ स्पष्ट और आधुनिक हिंदी है।
- source_word: καὶ ... καὶ ... καὶ ... καὶ
  choice: और ... से, ... से, ... से और ... से
  rationale: हिंदी वाक्य-विन्यास के अनुरूप संयोजनों को स्वाभाविक रखा गया है, जबकि हर अंग के साथ ‘से’ दोहराकर यूनानी की संचयी और बलपूर्ण संरचना सुरक्षित की गई है।
theological_decisions:
- issue: आज्ञा में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा / स्वामी
  rationale: यूनानी पाठ में κύριος है। ‘प्रभु’ नए नियम की शब्दावली और पुराने नियम की वाचा-संबंधी प्रतिध्वनि, दोनों को सुरक्षित रखता है, जबकि अनूदित पाठ में इब्रानी रूप को सीधे आरोपित नहीं करता।
- issue: मनुष्य के चार पक्षों का पृथक उल्लेख
  choice: हृदय / प्राण / बुद्धि / शक्ति
  alternative: हृदय / जीवन / मन / सामर्थ्य
  rationale: चारों यूनानी शब्दों को एक सामान्य कथन में समेटने के बजाय अलग रखा गया है, ताकि संपूर्ण समर्पण की बहुआयामी अभिव्यक्ति और उसमें निहित अर्थगत तनाव बना रहे।
- issue: दूसरे पुरुष एकवचन का हिंदी रूप
  choice: तुम
  alternative: तू / आप
  rationale: यूनानी में संबोधन एकवचन है। आधुनिक मानक हिंदी में ‘तुम’ सामान्य, सीधा और सम्मानहीन न लगने वाला रूप है; ‘तू’ कुछ पाठकों को कठोर या अत्यधिक अंतरंग लग सकता है, जबकि ‘आप’ मूल की सीधी आज्ञात्मक निकटता को बदल देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, पर उद्धृत आज्ञा की गरिमा बनाए रखती है। ‘हृदय, प्राण, बुद्धि, शक्ति’ की चारfold संरचना और प्रत्येक पद में संपूर्णता तथा साधनसूचक ‘से’ की पुनरावृत्ति सुरक्षित रखी गई है।
