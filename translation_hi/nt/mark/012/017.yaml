base_translation:
  language: en
  yaml_path: translation/nt/mark/012/017.yaml
  text: But Jesus said to them[a], “Give back to Caesar the things that are Caesar’s, and to God the things that are God’s.” And they were utterly amazed at him.
translation:
  language: hi
  text: परन्तु यीशु ने उनसे कहा, “जो कैसर का है, वह कैसर को लौटा दो[a], और जो परमेश्वर का है, वह परमेश्वर को।” और वे उस पर अत्यन्त चकित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दे दो’ अथवा ‘चुका दो’। मूल क्रिया का अर्थ किसी को उसका देय देना, वापस करना या चुकाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόδοτε
  choice: लौटा दो
  rationale: ἀποδίδωμι यहाँ किसी को उसका देय या उससे सम्बन्धित वस्तु देने, वापस करने अथवा चुकाने का भाव रखता है। ‘लौटा दो’ इस प्रत्यावर्तन और देयता के भाव को व्यक्त करता है, पर इसे केवल कर चुकाने तक सीमित नहीं करता।
- source_word: Τὰ Καίσαρος ... Καίσαρι
  choice: जो कैसर का है, वह कैसर को
  rationale: नपुंसकलिंग बहुवचन लेख के साथ सम्बन्धकारक कैसर से सम्बन्धित या उसके अधिकार की वस्तुओं को सूचित करता है। हिन्दी में एकवचन सामूहिक वाक्यांश ‘जो ... का है’ स्वाभाविक है और कथन को अनावश्यक रूप से किसी एक नागरिक दायित्व तक सीमित नहीं करता।
- source_word: τὰ τοῦ θεοῦ ... τῷ θεῷ
  choice: जो परमेश्वर का है, वह परमेश्वर को
  rationale: यह पहले खण्ड की जानबूझकर रची गई समानान्तर संरचना को सुरक्षित रखता है और परमेश्वर के दावे का विस्तार अनिर्धारित छोड़ता है।
- source_word: ἐξεθαύμαζον
  choice: अत्यन्त चकित हुए
  rationale: ἐκθαυμάζω साधारण आश्चर्य से अधिक प्रबल विस्मय व्यक्त करता है। ‘अत्यन्त चकित’ उसकी तीव्रता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπ’ αὐτῷ
  choice: उस पर
  rationale: ἐπί के साथ दत्तिव यहाँ विस्मय के विषय या आधार को सूचित कर सकता है। ‘उस पर’ मूल की प्रत्यक्षता और सम्भावित व्यापकता को बनाए रखता है; इसे केवल उसके उत्तर तक सीमित नहीं करता।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ संवाद में हल्का विरोध या संक्रमण दिखाता है। यहाँ ‘परन्तु’ विरोधियों की परीक्षा के प्रत्युत्तर को स्वाभाविक रूप से जोड़ता है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: यह कथन की भूमिका का सीधा और स्वाभाविक हिन्दी रूप है, जिसमें कोई अतिरिक्त व्याख्यात्मक अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: यीशु के कथन में नागरिक दायित्व और परमेश्वर के प्रति दायित्व का सम्बन्ध
  choice: दोनों समानान्तर खण्डों का सीधा अनुवाद किया गया है और उनके बीच का तनाव खुला रखा गया है।
  alternative: इसे नागरिक सत्ता का व्यापक समर्थन मानना, या कैसर के दावे को लगभग निरस्त करने वाला कथन मानना।
  rationale: पद कैसर और परमेश्वर—दोनों के प्रति कुछ देय होने की बात कहता है, किन्तु उनके दावों की सीमा या पूर्ण राजनीतिक धर्मशास्त्र निर्धारित नहीं करता। इसलिए अनुवाद बाद की किसी विशिष्ट व्याख्या को पाठ में नहीं डालता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘कैसर’ बाइबलीय नाम-रूप के रूप में रखा गया है; ‘जो ... का है, वह ... को’ यूनानी समानान्तरता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
