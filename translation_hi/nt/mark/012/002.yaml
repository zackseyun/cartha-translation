  text: καὶ ἀπέστειλεν πρὸς τοὺς γεωργοὺς τῷ καιρῷ δοῦλον, ἵνα παρὰ τῶν γεωργῶν λάβῃ ἀπὸ ⸂τῶν καρπῶν⸃ τοῦ ἀμπελῶνος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/002.yaml
  text: And at the proper time he sent a servant to the vine-growers[b][a], so that he might receive from the vine-growers some of the fruit of the vineyard.
translation:
  language: hi
  text: और उचित समय पर उसने अंगूर-बाग़ के किसानों[a] के पास एक दास[b] को भेजा, ताकि मालिक उनसे उस बाग़ के फलों में से कुछ प्राप्त करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंगूर उगाने वाले,” “खेती करने वाले,” अथवा “पट्टेदार।” यूनानी शब्द भूमि पर काम करने वालों को दर्शाता है; अंगूर-बाग़ के प्रसंग में इसका अर्थ अधिक विशिष्ट हो जाता है। “पट्टेदार” इस दृष्टांत में निहित सामाजिक भूमिका को व्यक्त करता है, पर शब्द का मूल अर्थ नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “सेवक।” यूनानी शब्द दास की सामाजिक अधीनता को भी सूचित करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: सामान्य कथात्मक क्रिया के रूप में यह स्वाभाविक और सटीक है।
- source_word: γεωργούς / γεωργῶν
  choice: अंगूर के बाग़ के किसान
  rationale: γεωργός भूमि पर काम करने वाले को दर्शाता है; अंगूर के बाग़ के प्रसंग में यह अभिव्यक्ति कृषि-संबंधी अर्थ को स्पष्ट रखती है, जबकि 'पट्टेदार' सामाजिक व्यवस्था को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: τῷ καιρῷ
  choice: उचित समय पर
  rationale: καιρός यहाँ उपयुक्त या नियत समय को सूचित करता है; संभवतः फसल का समय, पर मुख्य पाठ उससे अधिक विशिष्ट नहीं होता।
- source_word: δοῦλον
  choice: दास
  rationale: δοῦλος की सामाजिक अधीनता को 'दास' सीधे व्यक्त करता है; अधिक पारंपरिक 'सेवक' को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: ἵνα ... λάβῃ
  choice: ताकि वह ... पाए
  rationale: यह ἵνα-वाक्यांश के उद्देश्यबोध को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: παρὰ τῶν γεωργῶν
  choice: उनसे
  rationale: παρά के संबंधकारक प्रयोग का स्रोत-बोध व्यक्त होता है और पहले आए किसानों की अनावश्यक पुनरावृत्ति से बचता है।
- source_word: ἀπὸ τῶν καρπῶν τοῦ ἀμπελῶνος
  choice: अंगूर के बाग़ के फलों में से कुछ
  rationale: ἀπό + संबंधकारक का अंशवाचक भाव स्पष्ट होता है, बिना 'उसका हिस्सा' जैसी अप्रकट धारणा जोड़े।
- source_word: ἀμπελῶνος
  choice: अंगूर का बाग़
  rationale: ἀμπελών का प्रचलित, स्पष्ट हिन्दी रूप।
