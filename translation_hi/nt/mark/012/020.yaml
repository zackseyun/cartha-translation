  yaml_path: translation/nt/mark/012/020.yaml
  text: There were seven brothers; and the first took a wife[a], and when he died he left no offspring.
translation:
  language: hi
  text: सात भाई थे। पहले भाई ने विवाह किया और मरने पर कोई संतान नहीं छोड़ी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτὰ ἀδελφοὶ ἦσαν
  choice: सात भाई थे
  rationale: अस्तित्वसूचक यूनानी वाक्य का स्वाभाविक हिन्दी रूप; संदर्भ में पुरुष सहोदर ही अभिप्रेत हैं।
- source_word: ὁ πρῶτος
  choice: पहले ने
  rationale: यह भाइयों के क्रम को दर्शाता है; ‘सबसे बड़े’ कहने से आयु का ऐसा भाव जुड़ता जो यूनानी में आवश्यक नहीं है।
- source_word: ἔλαβεν γυναῖκα
  choice: विवाह किया
  rationale: शाब्दिक ‘एक स्त्री को लिया’ आधुनिक हिन्दी में अस्वाभाविक और भ्रामक हो सकता है; प्रसंग में यह मुहावरा विवाह करने का अर्थ देता है।
- source_word: ἀποθνῄσκων
  choice: जब वह मरा
  rationale: वर्तमान कृदन्त का स्वाभाविक कालवाचक हिन्दी रूप, जो मुख्य क्रिया से उसका संबंध स्पष्ट करता है।
- source_word: οὐκ ἀφῆκεν σπέρμα
  choice: कोई संतान नहीं छोड़ी
  rationale: मृत्यु के समय पीछे वंशज न छोड़ने का अर्थ स्पष्ट करता है; σπέρμα का इस पारिवारिक-कानूनी संदर्भ में स्वाभाविक अर्थ ‘संतान’ है।
