  edition: SBLGNT
  text: Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν ὅτι ἐάν τινος ἀδελφὸς ἀποθάνῃ καὶ καταλίπῃ γυναῖκα καὶ ⸂μὴ ἀφῇ τέκνον⸃, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν ⸀γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/019.yaml
  text: Teacher[a], Moses wrote for us that if someone's brother dies and leaves behind a wife and leaves no child[c][b], his brother should take the wife and raise up offspring for his brother.
translation:
  language: hi
  text: “गुरु, मूसा ने हमारे लिए लिखा है कि यदि किसी का भाई मर जाए और अपने पीछे पत्नी छोड़ जाए, पर कोई संतान न छोड़े[a], तो उसका भाई उस पत्नी से विवाह करे[b] और अपने मृत भाई के लिए संतान उत्पन्न करे[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक संतान न छोड़े”; इसे “कोई संतान न छोड़े” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ मूसा की व्यवस्था के लिए व्यवस्थाविवरण 25:5 देखें। “उस पत्नी से विवाह करे” का शाब्दिक रूप “उस पत्नी को ले” है।
    reason: cross_reference_and_lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अपने भाई के लिए बीज खड़ा करे”; यह देवर-विवाह के दायित्व के अनुसार मृत भाई के लिए संतान उत्पन्न करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: यीशु को सीधे संबोधित करने के लिए आधुनिक हिन्दी में यह स्वाभाविक और सम्मानपूर्ण शब्द है; यहाँ इसका अर्थ शिक्षक है, स्वामी नहीं।
- source_word: ἔγραψεν ἡμῖν
  choice: हमारे लिए लिखा है
  rationale: सम्प्रदान कारक यहाँ इस्राएल को दी गई व्यवस्था के लाभ या संबंध को व्यक्त करता है; ‘हमारे लिए’ इसे स्वाभाविक ढंग से रखता है।
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: यदि किसी का भाई मर जाए
  rationale: τινος अनिश्चित संबंधवाचक रूप है; ‘किसी का’ कथन को सामान्य रखता है और ἀδελφός के पुरुष-संबंध को बनाए रखता है।
- source_word: καταλίπῃ γυναῖκα
  choice: अपने पीछे पत्नी छोड़ जाए
  rationale: καταλείπω मृत्यु के समय किसी को पीछे छोड़ जाने का भाव देता है; हिन्दी में यह विधवा हो जाने की परिस्थिति स्पष्ट करता है।
- source_word: μὴ ἀφῇ τέκνον
  choice: कोई संतान न छोड़े
  rationale: τέκνον एकवचन है, पर निषेध के साथ हिन्दी में ‘कोई संतान’ स्वाभाविक है और संख्या को अनावश्यक रूप से बहुवचन नहीं बनाता।
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: तो उसका भाई उस पत्नी से विवाह करे
  rationale: इस वैधानिक वैवाहिक संदर्भ में ‘पत्नी को लेना’ विवाह करने का मुहावरा है; अर्थ को आधुनिक हिन्दी में स्पष्ट किया गया है।
- source_word: ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई के लिए वंश चलाए
  rationale: शाब्दिक ‘बीज खड़ा करे’ हिन्दी में अस्पष्ट होता; ‘वंश चलाए’ संतान उत्पन्न करके मृत भाई की वंशावली बनाए रखने के वैधानिक मुहावरे को स्वाभाविक रूप देता है।
theological_decisions:
- issue: देवर-विवाह संबंधी वैधानिक मुहावरे का अनुवाद
  choice: ‘उस पत्नी से विवाह करे और अपने भाई के लिए वंश चलाए’
  alternative: ‘उस पत्नी को ग्रहण करे और अपने भाई के लिए संतान उत्पन्न करे’
  rationale: मुख्य पाठ कानूनी और पारिवारिक आशय को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है, जबकि ‘अपने भाई के लिए’ बनाए रखकर मृत भाई के नाम पर वंश स्थापित करने की धारणा को अति-व्याख्यायित नहीं करता।
- issue: लिंग-सूचक पारिवारिक शब्द
  choice: ‘भाई’ और ‘पत्नी’ को बनाए रखा
  alternative: लिंग-निरपेक्ष ‘सहोदर’ और ‘जीवनसाथी’
  rationale: यूनानी पाठ पुरुष भाई और उसकी पत्नी से संबंधित विशेष वैवाहिक व्यवस्था की बात करता है; लिंग-निरपेक्ष करना स्रोत के कानूनी संदर्भ को बदल देता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘गुरु’ संबोधन धार्मिक संदर्भ में स्वाभाविक है; ‘अपने पीछे पत्नी छोड़ जाए’ मृत्यु-संदर्भ को स्पष्ट करता है; और प्राचीन वैधानिक मुहावरों को मुख्य पाठ में बोधगम्य हिन्दी तथा पादटिप्पणियों में अधिक शाब्दिक रूप दिया गया है।
