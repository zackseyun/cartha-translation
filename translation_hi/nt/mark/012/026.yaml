  terminology: ‘परमेश्वर,’ ‘मूसा,’ ‘अब्राहम,’ ‘इसहाक,’ ‘याकूब,’ and ‘जिलाए जाते हैं’ are consistent, dignified, and suitable for modern standard Hindi. Repetition of ‘परमेश्वर’ in the quotation properly reflects the Greek emphasis.
