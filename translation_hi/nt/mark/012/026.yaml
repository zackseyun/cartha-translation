reference: Mark 12:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: περὶ δὲ τῶν νεκρῶν ὅτι ἐγείρονται οὐκ ἀνέγνωτε ἐν τῇ βίβλῳ Μωϋσέως ἐπὶ τοῦ βάτου ⸀πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων· Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ⸂ὁ θεὸς Ἰσαὰκ καὶ ὁ⸃ θεὸς Ἰακώβ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/026.yaml
  text: And concerning the dead[a], that they are raised, have you not read in the book of Moses, in the passage about the bush, how God spoke to him, saying, ‘I am the God of Abraham and the God of Isaac and the God of Jacob’?”
translation:
  language: hi
  text: 'और मरे हुओं के विषय में—कि वे जिलाए जाते हैं—क्या तुमने मूसा की पुस्तक में झाड़ी वाले प्रसंग में[a] नहीं पढ़ा कि परमेश्वर ने उससे क्या कहा था: ‘मैं अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर हूँ’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झाड़ी के पास”; यूनानी अभिव्यक्ति झाड़ी की घटना के आधार पर शास्त्र के उस अंश की पहचान भी करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περὶ δὲ τῶν νεκρῶν
  choice: और मरे हुओं के विषय में
  rationale: περί के साथ संबंधकारक चर्चा का विषय प्रस्तुत करता है। δέ को हल्के संयोजक ‘और’ से व्यक्त किया गया है, ताकि अनावश्यक विरोध न जोड़ा जाए।
- source_word: ὅτι ἐγείρονται
  choice: कि वे जिलाए जाते हैं
  rationale: ἐγείρονται वर्तमानकालीन कर्मवाच्य रूप है और यहाँ मृतकों के पुनरुत्थान का बोध कराता है। ‘जिलाए जाते हैं’ कर्मवाच्य को बनाए रखता है और परमेश्वर द्वारा किए जाने वाले कार्य का निहित संकेत सुरक्षित रखता है।
- source_word: οὐκ ἀνέγνωτε
  choice: क्या तुमने ... नहीं पढ़ा
  rationale: यह शास्त्र की ओर संकेत करने वाला आलंकारिक प्रश्न है। हिन्दी में पूर्ण क्रिया ‘पढ़ा’ इस संदर्भ में स्वाभाविक है।
- source_word: ἐν τῇ βίβλῳ Μωϋσέως
  choice: मूसा की पुस्तक में
  rationale: βίβλος पुस्तक या ग्रंथ-पत्र का अर्थ दे सकता है; ‘मूसा की पुस्तक’ आधुनिक पाठक के लिए सहज है और मूसा से संबद्ध शास्त्रीय लेखन को दर्शाता है।
- source_word: ἐπὶ τοῦ βάτου
  choice: झाड़ी वाले प्रसंग में
  rationale: यह अभिव्यक्ति जलती झाड़ी की घटना से पहचाने जाने वाले शास्त्रीय अंश का संकेत देती है। ‘प्रसंग’ उसके उद्धरण-सूचक कार्य को स्पष्ट करता है; अधिक शाब्दिक स्थानवाचक अर्थ पादटिप्पणी में रखा गया है।
- source_word: πῶς εἶπεν αὐτῷ ὁ θεὸς λέγων
  choice: कि परमेश्वर ने उससे कैसे कहा
  rationale: πῶς उद्धृत कथन को प्रस्तुत करता है और λέγων का कार्य हिन्दी में प्रत्यक्ष उद्धरण की संरचना द्वारा स्वाभाविक रूप से समाहित हो जाता है।
- source_word: Ἐγὼ ὁ θεὸς Ἀβραὰμ καὶ ὁ θεὸς Ἰσαὰκ καὶ ὁ θεὸς Ἰακώβ
  choice: मैं अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर हूँ
  rationale: हर पूर्वज के साथ ‘परमेश्वर’ की पुनरावृत्ति यूनानी की बलात्मक संरचना को बनाए रखती है। हिन्दी वाक्य-विन्यास के अनुसार ‘हूँ’ अंत में रखा गया है, पर वर्तमानकाल स्पष्ट रूप से सुरक्षित है।
theological_decisions:
- issue: ὅτι ἐγείρονται में पुनरुत्थान की कर्मवाच्य भाषा
  choice: कि वे जिलाए जाते हैं
  alternative: कि वे जी उठते हैं
  rationale: ‘जिलाए जाते हैं’ यूनानी कर्मवाच्य रूप को सुरक्षित रखता है और यह निहित रहने देता है कि जिलाने वाला परमेश्वर है, बिना इस बात को मूल से अधिक स्पष्ट किए।
- issue: परमेश्वर के आत्म-परिचय का वर्तमानकाल और दोहराव
  choice: मैं अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर हूँ
  alternative: मैं अब्राहम, इसहाक और याकूब का परमेश्वर हूँ
  rationale: ‘हूँ’ वर्तमानकाल को स्पष्ट रखता है और ‘परमेश्वर’ की पुनरावृत्ति उस उद्धरण की बलात्मक संरचना को बचाती है जिस पर आगे का तर्क आधारित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘झाड़ी वाले प्रसंग’ से प्राचीन उद्धरण-पद्धति स्पष्ट होती है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है। उद्धरण में वर्तमानकाल और ‘परमेश्वर’ की पुनरावृत्ति जानबूझकर बनाए रखी गई है।
