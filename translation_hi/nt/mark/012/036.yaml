  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀αὐτὸς Δαυὶδ εἶπεν ἐν ⸂τῷ πνεύματι τῷ⸃ ἁγίῳ· ⸀Εἶπεν ⸀κύριος τῷ κυρίῳ μου· ⸀Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ⸀ὑποκάτω τῶν ποδῶν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/036.yaml
  text: David himself said in the Holy Spirit[a], ‘The Lord said to my Lord[b], “Sit at my right hand until I put your enemies under your feet.”’
translation:
  language: hi
  text: दाऊद ने स्वयं पवित्र आत्मा में कहा था,[a] “प्रभु ने मेरे प्रभु से कहा, ‘मेरे दाहिने बैठ, जब तक कि मैं तेरे शत्रुओं को तेरे पैरों के नीचे न रख दूँ।’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र आत्मा के द्वारा कहा था।”
    reason: alternative_reading
  - marker: b
    text: यह उद्धरण भजन 110:1 से है। इब्रानी पाठ में पहले ‘प्रभु’ के पीछे परमेश्वर का नाम (YHWH, ‘याहवे’) है, जिसे परंपरागत रूप से ‘यहोवा’ या ‘प्रभु’ के रूप में प्रस्तुत किया जाता है; दूसरा ‘प्रभु’ दाऊद के प्रभु को दर्शाता है।
    reason: cross_reference
lexical_decisions:
- source_word: αὐτὸς Δαυὶδ
  choice: दाऊद ने स्वयं
  rationale: αὐτός की बलात्मकता को स्वाभाविक हिन्दी में ‘स्वयं’ से व्यक्त किया गया है, जिससे दाऊद के अपने कथन होने पर जोर बना रहता है।
- source_word: ἐν τῷ πνεύματι τῷ ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: ἐν के मूल रूप को बनाए रखते हुए प्रेरणा की ठीक-ठीक रीति को अनावश्यक रूप से निश्चित नहीं किया गया; अधिक स्वाभाविक साधनवाचक अर्थ ‘पवित्र आत्मा के द्वारा’ पाद-टिप्पणी में दिया गया है।
- source_word: κύριος … τῷ κυρίῳ μου
  choice: प्रभु ने मेरे प्रभु से
  rationale: दोनों स्थानों पर κύριος की पुनरावृत्ति सुरक्षित रखी गई है। भजन के इब्रानी मूल में पहले पद के पीछे परमेश्वर का नाम है, पर वह जानकारी मुख्य यूनानी पाठ में जोड़े बिना पाद-टिप्पणी में स्पष्ट की गई है।
- source_word: Κάθου
  choice: बैठ
  rationale: राजकीय प्रतिष्ठापन के प्रसंग में यह संक्षिप्त आज्ञार्थक रूप स्वाभाविक है और यूनानी आदेश की सीधाई बनाए रखता है।
- source_word: ἐκ δεξιῶν μου
  choice: मेरे दाहिने
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है और सम्मान तथा अधिकार के स्थान का चित्र बनाए रखता है।
- source_word: ἕως ἂν θῶ
  choice: जब तक कि मैं … न रख दूँ
  rationale: यह रचना भविष्य में होने वाली सीमा को व्यक्त करती है; हिन्दी का ‘जब तक कि … न’ उसी संबंध को सहज रूप से प्रस्तुत करता है।
- source_word: ὑποκάτω τῶν ποδῶν σου
  choice: तेरे पैरों के नीचे
  rationale: मरकुस के यूनानी पाठ में ‘पाँवों की चौकी’ नहीं, बल्कि सीधे ‘पैरों के नीचे’ है; इसलिए अधीनता का मूल चित्र उसी रूप में रखा गया है।
theological_decisions:
- issue: दाऊद के आत्मा-प्रेरित कथन का स्वरूप
  choice: दाऊद ने स्वयं पवित्र आत्मा में कहा था
  alternative: दाऊद ने स्वयं पवित्र आत्मा के द्वारा कहा था
  rationale: मुख्य पाठ यूनानी ἐν की अभिव्यक्ति और उसकी संभावित व्यापकता बनाए रखता है; वैकल्पिक साधनवाचक अर्थ को पाद-टिप्पणी में रखा गया है।
- issue: भजन 110:1 में ‘प्रभु’ के दो प्रयोग
  choice: प्रभु ने मेरे प्रभु से कहा
  alternative: याहवे ने मेरे प्रभु से कहा
  rationale: मरकुस के यूनानी पाठ में दोनों जगह κύριος है, इसलिए मुख्य पाठ उस पुनरावृत्ति को सुरक्षित रखता है। इब्रानी भजन में पहले पद के पीछे परमेश्वर का निजी नाम होने की महत्वपूर्ण जानकारी पाद-टिप्पणी में दी गई है, ताकि उसे यूनानी मुख्य पाठ में आयात न किया जाए।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धरण के भीतर संबोधन के लिए ‘तेरे/तेरे’ का एकवचन रूप मूल पाठ की निकटता और काव्यात्मक गरिमा दोनों बनाए रखता है। पाद-टिप्पणी चिह्न अर्थ-संबंध के अनुसार लगाए गए हैं: [a] पवित्र आत्मा वाली अभिव्यक्ति पर और [b] भजन के उद्धरण तथा ‘प्रभु’ की पुनरावृत्ति पर।'
