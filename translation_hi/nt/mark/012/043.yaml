  text: καὶ προσκαλεσάμενος τοὺς μαθητὰς αὐτοῦ ⸀εἶπεν αὐτοῖς· Ἀμὴν λέγω ὑμῖν ὅτι ἡ χήρα αὕτη ἡ πτωχὴ πλεῖον πάντων ⸀ἔβαλεν τῶν βαλλόντων εἰς τὸ γαζοφυλάκιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/043.yaml
  text: And calling his disciples to himself[a], he said to them, “Truly I say to you that this poor widow has put in more than all those who are putting into the treasury.”
translation:
  language: hi
  text: अपने चेलों को पास बुलाकर उसने उनसे कहा, “मैं तुमसे सच कहता हूँ कि इस गरीब विधवा ने मन्दिर के भंडार[a] में डालनेवाले सभी लोगों से अधिक डाला है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दान-पात्र” अथवा “भंडार-पेटी।” यूनानी शब्द मन्दिर के कोष के पात्र या उस भंडार-क्षेत्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: पास बुलाकर
  rationale: मध्यवाच्य कृदन्त का यह स्वाभाविक हिन्दी रूप यीशु द्वारा चेलों को अपने पास बुलाने और फिर उनसे कहने का क्रम व्यक्त करता है।
- source_word: μαθητὰς
  choice: चेलों
  rationale: नए नियम के सन्दर्भ में μαθητής के लिए यह प्रचलित, सहज और सम्बन्धपरक हिन्दी शब्द है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु की गम्भीर और प्रामाणिक उद्घोषणा का बल आधुनिक, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: χήρα
  choice: विधवा
  rationale: यह χήρα का सीधा और मानक अर्थ है।
- source_word: πτωχὴ
  choice: गरीब
  rationale: यह मूल शब्द का सामान्य अर्थ देता है और स्त्री की दशा को मूल पाठ से अधिक तीव्र बनाकर प्रस्तुत नहीं करता।
- source_word: πλεῖον πάντων
  choice: सभी लोगों से अधिक
  rationale: यह तुलना को खुला रखता है और अगले पद की व्याख्या को इस पद में मिलाए बिना यूनानी वाक्य का बल व्यक्त करता है।
- source_word: ἔβαλεν
  choice: डाला है
  rationale: दान देने के प्रसंग में βάλλω का स्वाभाविक हिन्दी रूप है; पूर्ण हो चुके कार्य की वर्तमान प्रासंगिकता भी व्यक्त होती है।
- source_word: τῶν βαλλόντων
  choice: डालनेवाले सभी लोगों
  rationale: वर्तमान कृदन्त उस समय जारी दूसरे दानदाताओं की क्रिया को दर्शाता है; हिन्दी में यह कृदन्तीय रूप संक्षिप्त और स्वाभाविक है।
- source_word: γαζοφυλάκιον
  choice: मन्दिर के भंडार
  rationale: यह शब्द मन्दिर के कोष, दान-पात्र अथवा उस भंडार-क्षेत्र का संकेत कर सकता है। मुख्य पाठ में संक्षिप्त प्रचलित रूप रखा गया है और अधिक ठोस विकल्प पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: विधवा के दान का मूल्यांकन
  choice: “सभी लोगों से अधिक” के शाब्दिक तुलनात्मक कथन को बनाए रखा गया है।
  alternative: इसे स्पष्ट व्याख्यात्मक रूप से ‘उसके दान का मूल्य सबसे अधिक था’ कहना, या इसे केवल धनराशि की संख्यात्मक तुलना मानना।
  rationale: अगला पद इस कथन को उसकी गरीबी और दूसरों की बहुतायत के प्रकाश में समझाता है। यहाँ अनुवाद न तो केवल संख्यात्मक अर्थ थोपता है, न गुणात्मक अर्थ को व्याख्यात्मक परिभाषा बनाकर मूल पाठ की तनावपूर्ण संक्षिप्तता मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘पास बुलाकर’ मूल कृदन्त की क्रिया और ‘सभी लोगों से अधिक’ मूल तुलना की अर्थगत खुलावट को बनाए रखते हैं।
