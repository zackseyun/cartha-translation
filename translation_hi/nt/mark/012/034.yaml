review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys Jesus' observation of the scribe's sensible answer, the metaphorical proximity to God's kingdom without asserting entry, and the subsequent cessation of questioning. The temporal expression 'इसके बाद' is somewhat more event-sequencing than the Greek οὐκέτι ('no longer/any longer').
  naturalness: The Hindi is clear and appropriately dignified. In the final clause, 'फिर किसी ने ... प्रश्न करने का साहस नहीं किया' is more idiomatic and directly represents the continuing negative force of οὐκέτι than 'इसके बाद किसी ने भी ... और ... नहीं किया.'
  terminology: '''परमेश्वर के राज्य'' is a well-established, suitable rendering of βασιλεία τοῦ θεοῦ. ''समझदारी से'' adequately represents νουνεχῶς, and ''प्रश्न करने का साहस नहीं किया'' accurately conveys ἐτόλμα ... ἐπερωτῆσαι. The footnote correctly preserves the distinction between proximity and entry.'
  issues:
  - severity: low
    issue: The wording 'इसके बाद' slightly narrows οὐκέτι to a mere next-event sequence.
    rationale: οὐκέτι means 'no longer/any longer,' indicating that from that point onward no one dared question him. 'फिर' with the negative verb naturally carries this continuing force in Hindi.
  revised_text: और यीशु ने यह देखकर कि उसने समझदारी से उत्तर दिया था, उससे कहा, “तुम परमेश्वर के राज्य से दूर नहीं हो।”[a] फिर किसी ने उनसे प्रश्न करने का साहस नहीं किया।
  revised_footnotes:
  - marker: a
    text: या, “तुम परमेश्वर के राज्य के निकट हो।” यूनानी में निकटता व्यक्त की गई है; राज्य में प्रवेश स्पष्ट रूप से नहीं कहा गया है।
    reason: lexical_alternative
  revision_rationale: The revision is limited to the final temporal clause, making the ongoing force of οὐκέτι more natural and precise in modern Hindi. The footnote is lightly polished for idiomatic clarity while retaining the source-based theological restraint.
