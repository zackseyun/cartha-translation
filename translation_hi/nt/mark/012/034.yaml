  text: καὶ ὁ Ἰησοῦς ἰδὼν ⸀αὐτὸν ὅτι νουνεχῶς ἀπεκρίθη εἶπεν αὐτῷ· Οὐ μακρὰν εἶ ἀπὸ τῆς βασιλείας τοῦ θεοῦ. καὶ οὐδεὶς οὐκέτι ἐτόλμα αὐτὸν ἐπερωτῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/034.yaml
  text: And Jesus[a], seeing that he had answered wisely, said to him, “You are not far from the kingdom of God.” And no one any longer dared to question him.
translation:
  language: hi
  text: और यीशु ने यह देखकर कि उसने समझदारी से उत्तर दिया था, उससे कहा, “तुम परमेश्वर के राज्य से दूर नहीं हो।”[a] फिर किसी ने उनसे प्रश्न करने का साहस नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम परमेश्वर के राज्य के निकट हो।” यूनानी में निकटता व्यक्त की गई है; राज्य में प्रवेश स्पष्ट रूप से नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: यह देखकर
  rationale: यूनानी कृदंत को स्वाभाविक हिन्दी में परिस्थितिजन्य अवलोकन के रूप में व्यक्त करता है और अगले कथन से उसका संबंध बनाए रखता है।
- source_word: νουνεχῶς
  choice: समझदारी से
  rationale: यह विचारपूर्ण सूझ-बूझ और विवेक का भाव देता है; आधुनिक हिन्दी में स्वाभाविक है और केवल बौद्धिक योग्यता तक सीमित नहीं रहता।
- source_word: ἀπεκρίθη
  choice: उत्तर दिया था
  rationale: यीशु के कथन से पहले हो चुके उत्तर का क्रम हिन्दी में स्पष्ट करता है।
- source_word: Οὐ μακρὰν εἶ ἀπὸ
  choice: तुम ... से दूर नहीं हो
  rationale: मूल स्थान-संबंधी रूपक और निकटता को सुरक्षित रखता है, पर राज्य में प्रवेश की घोषणा नहीं करता।
- source_word: βασιλείας τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: परिचित बाइबलीय अभिव्यक्ति है, जो परमेश्वर के शासन और उसके राज्य-क्षेत्र दोनों की संभावित छवियों को खुला रखती है।
- source_word: οὐκέτι
  choice: इसके बाद ... और
  rationale: उस समय से आगे किसी के प्रश्न न करने के कालगत भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: ἐτόλμα
  choice: साहस नहीं किया
  rationale: यूनानी क्रिया के ‘हिम्मत करना’ वाले अर्थ को सीधी और प्रतिष्ठित आधुनिक हिन्दी में देता है।
- source_word: ἐπερωτῆσαι
  choice: प्रश्न करने
  rationale: संदर्भ में यीशु से पूछताछ अथवा उन्हें परखने के लिए प्रश्न रखने का भाव बनाए रखता है, बिना ‘पूछताछ करना’ जैसे अत्यधिक कठोर अर्थ के।
theological_decisions:
- issue: शास्त्री की परमेश्वर के राज्य के संबंध में स्थिति
  choice: “परमेश्वर के राज्य से दूर नहीं हो”
  alternative: “परमेश्वर के राज्य के निकट हो”
  rationale: यूनानी पाठ निकटता बताता है, राज्य में प्रवेश या अधिकार को स्पष्ट रूप से घोषित नहीं करता। यह रूप प्रशंसा और अभी शेष दूरी—दोनों के बीच की धार्मिक तनावपूर्ण स्थिति को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। यीशु के लिए आदरसूचक बहुवचन सर्वनाम रखा गया है, जबकि संबोधित शास्त्री के लिए मूल के एकवचन के अनुरूप “तुम” प्रयोग हुआ है।
