  text: Καὶ ⸀καθίσας ⸀κατέναντι τοῦ γαζοφυλακίου ἐθεώρει πῶς ὁ ὄχλος βάλλει χαλκὸν εἰς τὸ γαζοφυλάκιον· καὶ πολλοὶ πλούσιοι ἔβαλλον πολλά·
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/041.yaml
  text: And sitting opposite the treasury[a], he was watching how the crowd was putting money into the treasury; and many rich people were putting in much.
translation:
  language: hi
  text: और वह भंडार[a] के सामने बैठकर देख रहा था कि भीड़ किस तरह भंडार में पैसे डाल रही थी; और बहुत-से धनी लोग बहुत-सा धन डाल रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर का भंडार” अथवा “दान-पेटी”; यूनानी शब्द मंदिर के कोष-स्थान या उससे जुड़े भेंट-पात्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθίσας
  choice: बैठकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की दृश्य-स्थापक क्रिया बताता है; ‘बैठकर’ स्वाभाविक हिंदी में दोनों क्रियाओं का क्रम बनाए रखता है।
- source_word: κατέναντι
  choice: के सामने
  rationale: यह सीधे सामने या आमने-सामने की स्थिति व्यक्त करता है; आधुनिक हिंदी में ‘के सामने’ सहज है।
- source_word: γαζοφυλάκιον
  choice: भेंट-पात्रों
  rationale: मंदिर के उस स्थान में दान ग्रहण करने वाले पात्र अभिप्रेत हो सकते हैं। बहुवचन संदर्भगत दृश्य को स्वाभाविक बनाता है, जबकि पादटिप्पणी यूनानी शब्द की व्यापक और अस्पष्ट अर्थ-सीमा सुरक्षित रखती है।
- source_word: ἐθεώρει
  choice: देख रहा था
  rationale: अपूर्ण भूतकाल चल रही और ध्यानपूर्वक की जा रही निगरानी को दर्शाता है।
- source_word: πῶς
  choice: किस तरह
  rationale: यह केवल देने के तथ्य के बजाय देने के ढंग या प्रक्रिया पर ध्यान बनाए रखता है।
- source_word: ὄχλος
  choice: भीड़
  rationale: सामूहिक जनसमूह के लिए संक्षिप्त और वर्तमान हिंदी प्रयोग।
- source_word: βάλλει / ἔβαλλον
  choice: डाल रही है / डाल रहे थे
  rationale: धन को पात्र में रखने के संदर्भ में βάλλω का स्वाभाविक हिंदी रूप ‘डालना’ है; कालगत प्रवाह भी रखा गया है।
- source_word: χαλκόν
  choice: पैसे
  rationale: शाब्दिक अर्थ ताँबा या काँसे की मुद्रा है, पर यहाँ सामान्य मौद्रिक अर्थ प्रमुख है; ‘पैसे’ हिंदी में स्वाभाविक है और अनावश्यक सिक्का-विशिष्टता से बचता है।
- source_word: πολλοὶ πλούσιοι
  choice: बहुत-से धनी लोग
  rationale: यह संख्या और संपन्नता दोनों व्यक्त करता है तथा व्याकरणिक पुल्लिंग को केवल पुरुषों तक सीमित नहीं करता।
- source_word: πολλά
  choice: बड़ी-बड़ी रकम
  rationale: धन के संदर्भ में नपुंसक बहुवचन का अर्थ बड़ी मात्रा है; यह ‘बहुत’ की अपेक्षा हिंदी में स्पष्ट और स्वाभाविक है।
