  edition: SBLGNT
  text: ⸂ἀπεκρίθη ὁ Ἰησοῦς⸃ ὅτι Πρώτη ⸀ἐστίν· Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/012/029.yaml
  text: 'Jesus answered[a], “The first is: Hear, O Israel, the Lord our God[b], the Lord is one.'
translation:
  language: hi
  text: 'यीशु ने उत्तर दिया, “पहली आज्ञा यह है: ‘हे इस्राएल, सुन! प्रभु[b] हमारा परमेश्वर है; प्रभु एक ही है।’[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “प्रभु हमारा परमेश्वर एक ही प्रभु है,” अथवा “प्रभु हमारा परमेश्वर है, प्रभु ही अकेला है।” यूनानी पाठ व्यवस्थाविवरण 6:4 की प्रतिध्वनि है और परमेश्वर की एकता, उसकी अनन्यता, या दोनों पर बल दे सकता है।'
    reason: alternative_reading
  - marker: b
    text: यह पंक्ति शमा (व्यवस्थाविवरण 6:4) से उद्धृत है। यहाँ “प्रभु” यूनानी κύριος का अनुवाद है, जिसे सेप्टुआजेंट में परमेश्वर के नाम YHWH के स्थान पर प्रयुक्त किया गया था।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπεκρίθη
  choice: उत्तर दिया
  rationale: संवाद में ἀποκρίνομαι का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप; उत्तर देने की प्रतिक्रियात्मक शक्ति बनाए रखता है।
- source_word: Πρώτη
  choice: सबसे पहली
  rationale: यह स्त्रीलिंग विशेषण प्रसंग में निहित ‘आज्ञा’ को सूचित करता है। ‘सबसे पहली’ उसकी प्रधानता स्पष्ट करता है, जबकि ‘आज्ञा’ को अनावश्यक रूप से दोहराता नहीं।
- source_word: Ἄκουε
  choice: सुन
  rationale: व्यवस्थाविवरण 6:4 के शमा का आरम्भिक आह्वान है। ‘सुन’ मूल आज्ञार्थक रूप और वाचा-संबंधी प्रतिध्वनि दोनों को सहज हिन्दी में रखता है।
- source_word: Ἰσραήλ
  choice: हे इस्राएल
  rationale: सम्बोधन को ‘हे’ के साथ स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखा गया है।
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος का मानक हिन्दी धार्मिक रूप। इस उद्धरण में यह सेप्टुआजेंट में परमेश्वर के नाम YHWH के स्थान पर प्रयुक्त शब्द को प्रतिबिंबित करता है; यह पृष्ठभूमि पादटिप्पणी में दी गई है।
- source_word: ὁ θεὸς ἡμῶν
  choice: हमारा परमेश्वर
  rationale: सम्बन्धसूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: εἷς
  choice: एक ही
  rationale: ‘एक ही’ यूनानी εἷς की एकता को स्वाभाविक हिन्दी में व्यक्त करता है और प्रसंग में निहित अनन्यता को सम्भव रहने देता है, बिना उसे केवल ‘अकेला’ अर्थ तक सीमित किए।
theological_decisions:
- issue: शमा के अंतिम कथन की संरचना और परमेश्वर की एकता/अनन्यता
  choice: प्रभु हमारा परमेश्वर है; प्रभु एक ही है
  alternative: “प्रभु हमारा परमेश्वर एक ही प्रभु है,” अथवा “प्रभु ही हमारा परमेश्वर है, केवल प्रभु”
  rationale: κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν व्यवस्थाविवरण 6:4 की यूनानी प्रतिध्वनि है और इसकी वाक्य-संरचना एकता, अनन्यता, या दोनों पर बल दे सकती है। चुना हुआ पाठ यूनानी क्रम के निकट रहते हुए इस धर्मवैचारिक तनाव को खुला रखता है; अन्य सम्भव पाठ पादटिप्पणी में सुरक्षित हैं।
- issue: शमा में κύριος और परमेश्वर के वाचा-नाम का सम्बन्ध
  choice: मुख्य पाठ में ‘प्रभु’, पादटिप्पणी में YHWH की पृष्ठभूमि
  alternative: मुख्य पाठ में ‘यहोवा’
  rationale: मरकुस के यूनानी पाठ में κύριος है, इसलिए मुख्य पाठ में उसी का अनुवाद ‘प्रभु’ किया गया है। साथ ही, व्यवस्थाविवरण 6:4 और सेप्टुआजेंट की पृष्ठभूमि के कारण दिव्य नाम का सम्बन्ध पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। शमा की पहचान बनाए रखने के लिए ‘हे इस्राएल, सुन!’ रखा गया है। उद्धरण के भीतर उद्धरण को एकहरे उद्धरण-चिह्नों से दिखाया गया है; अर्धविराम अंतिम कथन के सम्भावित वाक्यखंडों को स्पष्ट करता है, पर उनकी धर्मवैचारिक बहुअर्थता को समाप्त नहीं करता।
