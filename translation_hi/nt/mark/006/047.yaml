    text: या, “किनारे पर।” यूनानी में “भूमि पर” है, जो समुद्र में नाव की स्थिति के विपरीत उसकी स्थिति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀψίας γενομένης
  choice: जब शाम हो गई
  rationale: यह संबंधकारक निरपेक्ष रचना समय की परिस्थिति बताती है। यह हिन्दी में स्वाभाविक है और शाम हो चुकने का भाव रखती है।
- source_word: πλοῖον
  choice: नाव
  rationale: गलील के संदर्भ में आधुनिक हिन्दी का ‘नाव’ उपयुक्त है; ‘जहाज़’ अनावश्यक रूप से बड़े जलयान का बोध कराएगा।
- source_word: ἐν μέσῳ τῆς θαλάσσης
  choice: झील के बीच में
  rationale: वाक्यांश तट से दूर जल के मध्य स्थित होने को दर्शाता है। ‘के बीच में’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: θάλασσα
  choice: झील
  rationale: यद्यपि यूनानी शब्द सामान्यतः ‘समुद्र’ है, यहाँ संदर्भ गलील झील का है; आधुनिक हिन्दी के पाठक के लिए ‘झील’ भौगोलिक अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: αὐτὸς μόνος
  choice: वह अकेला
  rationale: यह यीशु के अकेले होने पर बल देता है। हिन्दी में ‘वह अकेला’ सहज रूप से वही बल प्रकट करता है।
- source_word: ἐπὶ τῆς γῆς
  choice: भूमि पर
  rationale: यह नाव की जल में स्थिति के विपरीत यीशु की स्थल पर स्थिति बताता है। ‘भूमि पर’ यूनानी की शाब्दिक संरचना और विरोध दोनों बनाए रखता है।
