- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले यात्रा-निर्देशों के साथ विरोध दिखाता है; यहाँ ‘बल्कि’ संक्षिप्त और स्वाभाविक है।
- source_word: ὑποδεδεμένους
  choice: चप्पलें पहनें
  rationale: यह ὑποδέομαι का पूर्णकालिक कृदंत है, जो यहाँ आज्ञार्थक भाव में पैरों में चप्पलें बँधी होने का अर्थ देता है। आधुनिक हिन्दी में ‘चप्पलें पहनें’ स्वाभाविक और स्पष्ट है।
- source_word: σανδάλια
  choice: चप्पलें
  rationale: यह उस समय पैरों में पहने जाने वाले खुले पादत्राण का सीधा और सामान्य हिन्दी रूप है।
- source_word: μὴ ἐνδύσησθε
  choice: न पहन लें
  rationale: μή के साथ प्रयुक्त अओरिस्ट मध्यम सब्जंक्टिव निषेध व्यक्त करता है। ‘न पहन लें’ वस्त्र धारण करने की क्रिया को उभारता है, यद्यपि यूनानी में अवस्था का भाव भी समझा जा सकता है।
- source_word: δύο
  choice: दो
  rationale: मूल संख्या को सीधे बनाए रखा गया है।
- source_word: χιτῶνας
  choice: कुरते
  rationale: χιτών शरीर पर पहना जाने वाला मूल वस्त्र था। ‘कुरते’ सामान्य पाठक के लिए समझने योग्य है और ‘कपड़े’ से अधिक विशिष्ट है।
