  yaml_path: translation/nt/mark/006/044.yaml
  text: And those who ate the loaves were five thousand men[a][b].
translation:
  language: hi
  text: और जिन पुरुषों ने रोटियाँ खाईं, वे पाँच हज़ार थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ विशेष रूप से पुरुषों के लिए प्रयुक्त शब्द है, सामान्य रूप से ‘लोगों’ के लिए नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦσαν
  choice: की संख्या ... थी
  rationale: यूनानी में εἰμί का अपूर्णकाल यहाँ कुल संख्या बताने वाला साधारण संयोजक है। हिन्दी में संख्यावाचक विधेय के साथ ‘की संख्या ... थी’ स्वाभाविक है; यह अलग से ‘गिने गए’ का भाव नहीं जोड़ता।
- source_word: οἱ φαγόντες
  choice: खानेवाले
  rationale: संज्ञा के रूप में प्रयुक्त अओरिस्ट कृदन्त उस समूह को खाने की पूरी हुई क्रिया से पहचानता है। ‘खानेवाले’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा अनावश्यक रूप से पूर्वपूर्ण काल नहीं जोड़ता।
- source_word: τοὺς ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους इस प्रसंग में बाँटी गई निश्चित रोटियों को दर्शाता है। ‘रोटियाँ’ ठोस कथात्मक विवरण और बहुवचन दोनों को सुरक्षित रखता है।
- source_word: πεντακισχίλιοι
  choice: पाँच हज़ार
  rationale: यह सीधी संख्या है और हिन्दी में किसी अर्थगत समायोजन की आवश्यकता नहीं है।
- source_word: ἄνδρες
  choice: पुरुषों
  rationale: ἀνήρ यहाँ सामान्य ‘लोग’ नहीं, बल्कि पुरुषों के लिए विशिष्ट शब्द है। ‘पुरुषों’ मूल की लैंगिक विशिष्टता बनाए रखता है।
theological_decisions:
- issue: गिनती में प्रयुक्त लैंगिक रूप से विशिष्ट शब्द
  choice: ἄνδρες का अनुवाद ‘पुरुषों’ किया गया है।
  alternative: लोगों
  rationale: यूनानी पाठ सामान्य व्यक्तियों के लिए शब्द न लेकर पुरुषों के लिए विशिष्ट ἀνήρ का प्रयोग करता है। इसलिए अनुवाद में इस विशिष्टता को बनाए रखा गया है और इसे समावेशी कुल संख्या में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘रोटियाँ’ प्रसंग के निश्चित बहुवचन को व्यक्त करता है; हिन्दी में ‘रोटी’ सामूहिक अर्थ भी दे सकती है, इसलिए अलग शब्दार्थ-पादटिप्पणी आवश्यक नहीं समझी गई। मुख्य पाठ में ‘पुरुषों की संख्या’ मूल की लैंगिक विशिष्टता स्पष्ट करता है।
