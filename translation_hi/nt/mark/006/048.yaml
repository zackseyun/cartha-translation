source:
  edition: SBLGNT
  text: καὶ ⸀ἰδὼν αὐτοὺς βασανιζομένους ἐν τῷ ἐλαύνειν, ἦν γὰρ ὁ ἄνεμος ἐναντίος ⸀αὐτοῖς, περὶ τετάρτην φυλακὴν τῆς νυκτὸς ἔρχεται πρὸς αὐτοὺς περιπατῶν ἐπὶ τῆς θαλάσσης· καὶ ἤθελεν παρελθεῖν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/048.yaml
  text: And seeing them straining at the oars[a], because the wind was against them, about the fourth watch of the night he comes to them, walking on the sea[d][c][b]; and he intended to pass by them.
translation:
  language: hi
  text: और उन्हें नाव खेते हुए बहुत संघर्ष करते देखकर—क्योंकि हवा उनके विरुद्ध थी—वह रात के चौथे पहर के आसपास[a] समुद्र पर चलते हुए उनके पास आया।[b] वह उनके पास से आगे निकल जाना चाहता था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रात का चौथा पहर’ रोमी समय-गणना के अनुसार लगभग सुबह 3 से 6 बजे तक था।
    reason: cultural_note
  - marker: b
    text: या, ‘पानी पर चलते हुए।’ यूनानी में ‘समुद्र पर’ है।
    reason: lexical_alternative
  - marker: c
    text: इसका सीधा अर्थ यह हो सकता है कि वह उनके पास से आगे जाना चाहता था। यह पुराने नियम की उन घटनाओं की ओर संकेत भी कर सकता है जिनमें परमेश्वर अपने को प्रकट करते हुए ‘पास से निकलता’ है (जैसे निर्गमन 33:19, 22; 34:6; 1 राजा 19:11)।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδὼν
  choice: देखकर
  rationale: एओरिस्ट कृदंत का स्वाभाविक हिन्दी रूप; यह देखने और आगे की क्रिया का संबंध बनाए रखता है, बिना क्रम को अनावश्यक रूप से निश्चित किए।
- source_word: βασανιζομένους ἐν τῷ ἐλαύνειν
  choice: खेते-खेते कठिन संघर्ष करते
  rationale: βασανιζομένους की तीव्रता को ‘कठिन संघर्ष’ से और ἐν τῷ ἐλαύνειν की समकालिकता को ‘खेते-खेते’ से व्यक्त किया गया है। यहाँ नाव खेना संदर्भ से स्पष्ट है।
- source_word: ἐναντίος αὐτοῖς
  choice: उनके विरुद्ध
  rationale: विपरीत दिशा से चलती हवा के लिए स्वाभाविक हिन्दी अभिव्यक्ति, जो यूनानी के विरोधी बल को बनाए रखती है।
- source_word: περὶ τετάρτην φυλακὴν τῆς νυκτός
  choice: रात के चौथे पहर के लगभग
  rationale: प्राचीन समय-विभाजन को मुख्य पाठ में सुरक्षित रखा गया है; περὶ को ‘लगभग’ से व्यक्त किया गया है।
- source_word: ἔρχεται πρὸς αὐτούς
  choice: वह ... उनके पास आया
  rationale: यूनानी में ऐतिहासिक वर्तमान है। हिन्दी कथन में ‘आया’ अधिक स्वाभाविक है; वर्तमान काल का यांत्रिक अनुकरण यहाँ असहज होता।
- source_word: περιπατῶν ἐπὶ τῆς θαλάσσης
  choice: समुद्र पर चलते हुए
  rationale: θάλασσα का सीधा अर्थ ‘समुद्र’ और ἐπί का संदर्भगत अर्थ ‘पर’ रखा गया है; ‘पानी पर’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: ἤθελεν παρελθεῖν αὐτούς
  choice: वह उनके पास से आगे निकल जाना चाहता था
  rationale: θέλω के अपूर्ण भूतकाल को इच्छा/अभिप्राय के खुले भाव में रखा गया है और παρέρχομαι की ‘पास से आगे जाने’ वाली छवि सुरक्षित है। वाक्य संभावित पुराने नियमीय संकेत को स्पष्ट व्याख्या में नहीं बदलता।
theological_decisions:
- issue: ‘उनके पास से आगे निकल जाना चाहता था’ का आशय
  choice: मुख्य पाठ में गति और अभिप्राय की सीधी, किंतु अर्थगत रूप से खुली अभिव्यक्ति
  alternative: वह उनके सामने अपने को परमेश्वर के दिव्य प्रकट होने के ढंग में प्रकट करना चाहता था
  rationale: यूनानी कथन स्वयं इस आशय की व्याख्या नहीं करता। पुराने नियम में परमेश्वर के ‘पास से निकलने’ की घटनाओं की प्रतिध्वनि संभव है, पर उसे मुख्य पाठ में निश्चित करना वास्तविक अस्पष्टता को मिटा देगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘नाव खेना’, ‘चौथा पहर’ और ‘समुद्र पर’ स्रोत की सांस्कृतिक तथा शब्दगत विशेषताओं को रखते हैं; आवश्यक स्पष्टीकरण पादटिप्पणियों में दिए गए हैं।
