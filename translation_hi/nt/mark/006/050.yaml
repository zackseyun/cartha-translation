  text: πάντες γὰρ αὐτὸν εἶδον καὶ ἐταράχθησαν. ⸂ὁ δὲ εὐθὺς⸃ ἐλάλησεν μετ’ αὐτῶν, καὶ λέγει αὐτοῖς· Θαρσεῖτε, ἐγώ εἰμι, μὴ φοβεῖσθε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/050.yaml
  text: For they all saw him and were troubled. But he immediately spoke with them and says to them, “Take courage; I am; do not be afraid.”
translation:
  language: hi
  text: क्योंकि उन सबने उसे देखा और वे घबरा गए। पर उसने तुरंत उनसे बात की और उनसे कहा, “हिम्मत रखो! मैं हूँ; मत डरो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐταράχθησαν
  choice: घबरा गए
  rationale: यह क्रिया अचानक भय और भीतर की व्याकुलता को व्यक्त करती है; प्रसंग में स्वाभाविक आधुनिक हिन्दी।
- source_word: Θαρσεῖτε
  choice: हिम्मत रखो
  rationale: आज्ञार्थक रूप साहस बँधाने का आह्वान है; यह सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: ἐγώ εἰμι
  choice: मैं हूँ
  rationale: यूनानी वाक्यांश का निकट और जानबूझकर खुला अनुवाद, जो साधारण आत्म-पहचान और संभावित धर्मवैज्ञानिक अनुगूँज—दोनों को बिना निर्णायक व्याख्या के बनाए रखता है।
- source_word: μὴ φοβεῖσθε
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा का सीधा, स्वाभाविक बहुवचन हिन्दी रूप।
theological_decisions:
- issue: ἐγώ εἰμι में आत्म-पहचान और संभावित ईश्वरीय अनुगूँज
  choice: मैं हूँ
  alternative: मैं ही हूँ / यह मैं हूँ
  rationale: ‘मैं हूँ’ स्रोत की संक्षिप्तता और वास्तविक अस्पष्टता को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प इसे केवल सामान्य पहचान तक सीमित कर सकते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, वर्तमान और गरिमापूर्ण शैली। यूनानी के ऐतिहासिक वर्तमान ‘λέγει’ को हिन्दी कथन-प्रवाह में स्वाभाविक भूतकाल ‘कहा’ से व्यक्त किया गया है।
