  text: καὶ παρήγγειλεν αὐτοῖς ἵνα μηδὲν αἴρωσιν εἰς ὁδὸν εἰ μὴ ῥάβδον μόνον, μὴ ⸂ἄρτον, μὴ πήραν⸃, μὴ εἰς τὴν ζώνην χαλκόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/008.yaml
  text: And he instructed them to take nothing for the journey except a staff only—no bread[a], no bag[b], no copper in their belt—
translation:
  language: hi
  text: उन्होंने उन्हें निर्देश दिया कि वे यात्रा के लिए एक लाठी के सिवा कुछ न लें—न रोटी, न थैला[a], न अपने कमरबंद में ताँबा[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात यात्रा की रसद रखने का थैला।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘ताँबा’; यहाँ इसका आशय ताँबे के सिक्कों या कमरबंद में रखे धन से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρήγγειλεν
  choice: निर्देश दिया
  rationale: यह क्रिया अधिकारपूर्वक निर्देश देने का भाव रखती है। ‘निर्देश दिया’ यात्रा-संबंधी आदेशों के प्रसंग में स्वाभाविक है और क्रिया की अधिकारपूर्ण शक्ति भी बनाए रखती है।
- source_word: μηδὲν αἴρωσιν
  choice: कुछ न लें
  rationale: यहाँ αἴρω का अर्थ यात्रा के लिए सामान साथ लेना या उठाकर चलना है। ‘कुछ न लें’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: εἰς ὁδὸν
  choice: यात्रा के लिए
  rationale: यह पदबंध रास्ते के लिए तैयारी और यात्रा के प्रयोजन को व्यक्त करता है।
- source_word: εἰ μὴ ῥάβδον μόνον
  choice: केवल एक लाठी के सिवा
  rationale: ῥάβδος यात्री की लाठी है और μόνον अपवाद को सीमित करता है। यह रूप यूनानी के जोर को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἄρτον
  choice: रोटी
  rationale: यूनानी में सामान्य भोजन नहीं, ठोस रूप से रोटी कही गई है; इसलिए इसे व्यापक करके ‘खाना’ नहीं किया गया।
- source_word: πήραν
  choice: थैला
  rationale: πήρα यात्रा में रसद रखने के थैले को दर्शाता है। ‘थैला’ आधुनिक और समझने योग्य है; उसका विशिष्ट प्रयोजन पादटिप्पणी में दिया गया है।
- source_word: ζώνην
  choice: कमरबंद
  rationale: प्राचीन संदर्भ में ζώνη कमर पर बाँधा जाने वाला वह पट्टा था जिसमें धन रखा जा सकता था; ‘कमरबंद’ इस अर्थ को ‘बेल्ट’ से अधिक स्पष्ट करता है।
- source_word: χαλκόν
  choice: ताँबे के सिक्के
  rationale: χαλκόν का शाब्दिक अर्थ ‘ताँबा’ है, पर यहाँ कमरबंद में रखे जाने के कारण यह ताँबे की मुद्रा का लक्षणात्मक प्रयोग है। ‘ताँबे के सिक्के’ आधुनिक पाठक के लिए आशय स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
