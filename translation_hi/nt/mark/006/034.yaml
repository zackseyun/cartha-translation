  text: καὶ ἐξελθὼν ⸀εἶδεν πολὺν ὄχλον, καὶ ἐσπλαγχνίσθη ἐπ’ ⸀αὐτοὺς ὅτι ἦσαν ὡς πρόβατα μὴ ἔχοντα ποιμένα, καὶ ἤρξατο διδάσκειν αὐτοὺς πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/034.yaml
  text: And when he went ashore[a], he saw a large crowd, and he had compassion on them, because they were like sheep without a shepherd[b]. And he began to teach them many things.
translation:
  language: hi
  text: जब वह नाव से उतरा[a], तो उसने एक बड़ी भीड़ देखी। वह उन पर करुणा से भर गया, क्योंकि वे ऐसी भेड़ों के समान थे जिनका कोई चरवाहा नहीं था[b]। तब वह उन्हें बहुत-सी बातें सिखाने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘बाहर निकलकर’; पिछले संदर्भ में आशय नाव से उतरना है।
    reason: lexical_alternative
  - marker: b
    text: ‘चरवाहे के बिना भेड़ें’ की छवि उन लोगों के लिए प्रयुक्त बाइबलीय भाषा की प्रतिध्वनि है जिन्हें विश्वासयोग्य नेतृत्व नहीं मिला; गिनती 27:17; 1 राजा 22:17; यहेजकेल 34:5 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: ἐξελθὼν
  choice: जब वह नाव से उतरा
  rationale: शाब्दिक अर्थ ‘बाहर निकलकर’ है। पिछले संदर्भ में यीशु नाव से यात्रा कर रहा था, इसलिए यहाँ नाव से उतरना स्वाभाविक आशय है; ‘नाव से’ संदर्भ से स्पष्ट किया गया है।
- source_word: εἶδεν πολὺν ὄχλον
  choice: उसने एक बड़ी भीड़ देखी
  rationale: εἶδεν का सीधा अर्थ ‘देखा’ और πολὺν ὄχλον का अर्थ ‘बड़ी भीड़’ है; यह आधुनिक हिन्दी में सहज और स्रोत के परिमाणात्मक बल के अनुरूप है।
- source_word: ἐσπλαγχνίσθη ἐπ’ αὐτοὺς
  choice: वह उन पर करुणा से भर गया
  rationale: क्रिया गहरी, भीतर तक अनुभव की गई करुणा व्यक्त करती है। यह हिन्दी प्रयोग उसकी तीव्रता को स्वाभाविक ढंग से व्यक्त करता है और मात्र सतही दया का भाव नहीं देता।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह यीशु की करुणा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट कारणसूचक है।
- source_word: ὡς πρόβατα μὴ ἔχοντα ποιμένα
  choice: ऐसी भेड़ों के समान थे जिनका कोई चरवाहा न हो
  rationale: मूल उपमा को बिना आध्यात्मिक नेतृत्व जैसी व्याख्यात्मक वृद्धि के सुरक्षित रखा गया है। सम्भावनात्मक ‘न हो’ हिन्दी में उपमात्मक वर्णन के साथ सहज है।
- source_word: ἤρξατο διδάσκειν αὐτοὺς πολλά
  choice: तब वह उन्हें बहुत-सी बातें सिखाने लगा
  rationale: ἤρξατο ingressive भाव देता है, जिसे ‘सिखाने लगा’ स्वाभाविक रूप से व्यक्त करता है। πολλά को ‘बहुत-सी बातें’ कहने से शिक्षा की विस्तृत विषय-वस्तु बनी रहती है।
theological_decisions:
- issue: चरवाहे के बिना भेड़ों की पासबानी-संबंधी छवि
  choice: मुख्य पाठ में ‘ऐसी भेड़ों के समान थे जिनका कोई चरवाहा न हो’ रूपक को ज्यों का त्यों रखा गया है।
  alternative: ‘ऐसे लोग जिनके पास आत्मिक अगुवा न हो’ कहकर रूपक की व्याख्या करना।
  rationale: यह छवि इस्राएल और उसके नेतृत्व से संबंधित पुराने नियम की भाषा की प्रतिध्वनि हो सकती है, पर मुख्य पाठ में उसका अर्थ निश्चित करके रूपक को सीमित करना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘करुणा से भर गया’ गहरी संवेदना व्यक्त करता है, जबकि ‘तरस आया’ में आ सकने वाले उपेक्षापूर्ण भाव से बचता है। अंग्रेज़ी परामर्श-पाठ में [a] की टिप्पणी और उसका स्थान परस्पर असंगत थे; इसलिए यूनानी पद ἐξελθὼν के अनुरूप सही शाब्दिक विकल्प दिया गया है।
