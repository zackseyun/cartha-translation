  text: और सबने खाया और तृप्त हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφαγον
  choice: खाया
  rationale: ἐσθίω के सामान्य अर्थ ‘खाना’ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है। ‘पेट भरकर खाया’ कहना अगले क्रियापद के परिणाम को पहले ही जोड़ देता।
- source_word: πάντες
  choice: सबने
  rationale: यह विशेषण यहाँ संज्ञा के रूप में प्रयुक्त होकर पूरे समूह को सूचित करता है। ‘सबने’ उसके सार्वभौमिक विस्तार और कर्ता-भूमिका दोनों को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐχορτάσθησαν
  choice: तृप्त हो गए
  rationale: χορτάζω का निष्क्रिय रूप भरपेट खिलाए जाने और संतुष्ट होने का भाव रखता है। भोजन के प्रसंग में ‘तृप्त हो गए’ पूर्ण रूप से खा लेने के परिणाम को गरिमापूर्ण और सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ ... καὶ
  choice: और ... और ...
  rationale: दोनों καί घटनाओं को सरल समन्वय में जोड़ते हैं। दोनों स्थानों पर ‘और’ मरकुस की क्रमबद्ध, संयोजक कथन-शैली को बनाए रखता है।
