lexical_decisions:
- source_word: ἐπέταξεν
  choice: आज्ञा दी
  rationale: यह क्रिया अधिकारपूर्वक आदेश देने का भाव रखती है; ‘आज्ञा दी’ आधुनिक, स्वाभाविक हिन्दी में उसकी शक्ति बनाए रखता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: दत्तिव सर्वनाम उन लोगों को दर्शाता है जिन्हें आदेश दिया गया—संदर्भ में शिष्य—पर मुख्य पाठ सर्वनाम की अनिर्दिष्टता बनाए रखता है।
- source_word: ἀνακλῖναι πάντας
  choice: कि वे सब लोगों को … बैठा दें
  rationale: यूनानी वाक्य-विन्यास में ‘उन्हें’ आदेश पाने वाले हैं और ‘सब लोगों को’ बैठाए जाने वाले; यह हिन्दी रचना दोनों समूहों को स्पष्टतः अलग रखती है। भोजन के लिए टिककर बैठने का प्राचीन भाव पादटिप्पणी में दिया गया है।
- source_word: συμπόσια συμπόσια
  choice: समूह-समूह में
  rationale: यूनानी पद की पुनरावृत्ति वितरणात्मक भाव देती है—अलग-अलग व्यवस्थित समूहों में—जिसे हिन्दी की पुनरुक्ति स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐπὶ τῷ χλωρῷ χόρτῳ
  choice: हरी घास पर
  rationale: यह ‘हरी/ताज़ी घास पर’ का सीधा और स्वाभाविक हिन्दी अनुवाद है।
