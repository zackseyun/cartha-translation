base_translation:
  language: en
  yaml_path: translation/nt/mark/006/036.yaml
  text: Send them away[a], so that they may go into the surrounding countryside and villages and buy themselves something to eat.
translation:
  language: hi
  text: उन्हें विदा कर दीजिए[a], ताकि वे आस-पास के खेतों और गाँवों में जाकर अपने लिए खाने को कुछ खरीद लें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “उन्हें जाने दीजिए, ताकि वे आस-पास के खेतों और गाँवों में जाकर अपने लिए वह खरीद लें जो वे खाएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπόλυσον
  choice: विदा कर दीजिए
  rationale: यहाँ क्रिया का अर्थ भीड़ को वहाँ से जाने देना या भेज देना है। विनम्र आज्ञार्थक बहुवचन संदर्भ में शिष्यों द्वारा यीशु को संबोधित करने के अनुरूप है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक संबंध को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἀπελθόντες
  choice: जाकर
  rationale: यूनानी भूतकालिक कृदन्त की क्रमिक क्रिया—पहले जाना, फिर खरीदना—को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοὺς κύκλῳ ἀγροὺς καὶ κώμας
  choice: आस-पास के खेतों और गाँवों में
  rationale: κύκλῳ को ‘आस-पास के’ और ἀγρούς को उसके ग्रामीण भूभाग/खेत के अर्थ में प्रस्तुत किया गया है; κώμας स्पष्टतः गाँवों को सूचित करता है।
- source_word: ἀγοράσωσιν
  choice: खरीद लें
  rationale: क्रय करने के सामान्य अर्थ को उद्देश्यसूचक उपवाक्य में स्वाभाविक हिन्दी रूप देता है।
- source_word: ἑαυτοῖς
  choice: अपने लिए
  rationale: लाभार्थक आत्मवाचक सर्वनाम का अर्थ स्पष्ट रूप से बनाए रखता है।
- source_word: τί φάγωσιν
  choice: खाने को कुछ
  rationale: अनिश्चित τί और खाने की वस्तु के आशय को सहज आधुनिक हिन्दी में व्यक्त करता है।
