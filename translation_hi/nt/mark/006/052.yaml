  yaml_path: translation/nt/mark/006/052.yaml
  text: for they did not understand about the loaves[b][a], but their hearts were hardened.
translation:
  language: hi
  text: क्योंकि वे रोटियों के विषय में समझ नहीं पाए थे,[a] बल्कि उनके हृदय कठोर थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे रोटियों का महत्त्व नहीं समझ पाए थे।”
    reason: lexical_alternative
  - marker: b
    text: या, “उनके हृदय संवेदनहीन थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνῆκαν
  choice: समझ नहीं पाए थे
  rationale: यह συνίημι के समझने या किसी बात का अर्थ ग्रहण करने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ τοῖς ἄρτοις
  choice: रोटियों के विषय में
  rationale: यहाँ ἐπί सहित पदबंध पिछली घटना की रोटियों और उनके निहित अर्थ की ओर संकेत करता है; यह अनुवाद उस संबंध को स्पष्ट रखता है, पर अर्थ को अत्यधिक व्याख्यायित नहीं करता।
- source_word: ἄρτοις
  choice: रोटियों
  rationale: बहुवचन उस विशेष भोजन-वृद्धि की घटना की रोटियों को सूचित करता है; हिन्दी में ‘रोटियाँ’ सामान्य और सहज समतुल्य है।
- source_word: ἀλλ’ ἦν
  choice: बल्कि ... हो गए थे
  rationale: ἀλλά पिछले कथन के विपरीत अथवा उसकी गहरी वजह बताता है। हिन्दी में ‘बल्कि’ इस तीखे विरोध को बनाए रखता है; पूर्ण कृदन्त के साथ ἦν को स्वाभाविक परिणामी अवस्था के रूप में व्यक्त किया गया है।
- source_word: αὐτῶν ἡ καρδία
  choice: उनके हृदय
  rationale: यूनानी में ‘हृदय’ सामूहिक एकवचन है। आधुनिक हिन्दी में बहुवचन लोगों की व्यक्तिगत भीतरी दशा को अधिक स्वाभाविक ढंग से व्यक्त करता है, जबकि सामूहिक आशय बना रहता है।
- source_word: πεπωρωμένη
  choice: कठोर हो गए थे
  rationale: πωρόω कठोर या संवेदनहीन हो जाने की रूपकात्मक दशा बताता है। यह चुनाव आत्मिक मंदता को व्यक्त करता है, बिना यह तय किए कि कठोरता का कर्ता कौन था।
theological_decisions:
- issue: πεπωρωμένη में शिष्यों की दशा और उसका कारण
  choice: उनके हृदय कठोर हो गए थे
  alternative: उनके हृदय संवेदनहीन हो गए थे
  rationale: पाठ आत्मिक और बोधगत कठोरता बताता है, पर उसके अंतिम कर्ता या कारण को स्पष्ट नहीं करता। ‘हो गए थे’ इस अस्पष्टता और धार्मिक तनाव को बनाए रखता है।
- issue: रोटियों के संबंध में समझ की कमी
  choice: रोटियों के विषय में समझ नहीं पाए थे
  alternative: रोटियों का महत्त्व नहीं समझ पाए थे
  rationale: मुख्य पाठ यूनानी पदबंध के खुले अर्थ को बनाए रखता है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है ताकि यह अनिवार्य न ठहराया जाए कि लेखक केवल ‘महत्त्व’ ही कह रहा है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘रोटियाँ’ भारतीय पाठक के लिए स्वाभाविक है; ‘हृदय’ बाइबलीय अर्थ-क्षेत्र—समझ, इच्छा और भीतरी प्रवृत्ति—को बनाए रखता है।
