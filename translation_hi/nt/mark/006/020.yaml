  to: क्योंकि हेरोदेस यूहन्ना से डरता था, यह जानते हुए कि वह एक धर्मी और पवित्र मनुष्य है, और वह उसकी रक्षा करता था। जब वह उसे सुनता था, तो बहुत उलझन में पड़ जाता था[a], फिर भी उसे खुशी से सुनता था।
