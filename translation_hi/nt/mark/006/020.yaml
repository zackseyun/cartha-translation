source:
  edition: SBLGNT
  text: ὁ γὰρ Ἡρῴδης ἐφοβεῖτο τὸν Ἰωάννην, εἰδὼς αὐτὸν ἄνδρα δίκαιον καὶ ἅγιον, καὶ συνετήρει αὐτόν, καὶ ἀκούσας αὐτοῦ πολλὰ ⸀ἠπόρει, καὶ ἡδέως αὐτοῦ ἤκουεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/020.yaml
  text: For Herod feared John[a], knowing that he was a righteous and holy man, and he kept him safe. And when he heard him, he was greatly perplexed, and yet he listened to him gladly.
translation:
  language: hi
  text: क्योंकि हेरोदेस यूहन्ना से डरता था, यह जानते हुए कि वह एक धर्मी और पवित्र मनुष्य है, और वह उसकी रक्षा करता था। जब वह उसे सुनता था, तो बहुत उलझन में पड़ जाता था[a], फिर भी उसे खुशी से सुनता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “बहुत उलझन में पड़ जाता था” के स्थान पर “वह बहुत-से काम करता था” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐφοβεῖτο
  choice: डरता था
  rationale: अपूर्णकाल ongoing attitude को व्यक्त करता है। ‘डरता था’ क्रिया के सीधे अर्थ को बनाए रखता है और संदर्भ में निहित आदर को केवल ‘सम्मान करता था’ कहकर नरम नहीं करता।
- source_word: εἰδὼς
  choice: जानता था
  rationale: कृदन्त हेरोदेस के भय और सुरक्षात्मक व्यवहार का कारण बताता है; हिन्दी में संयोजित वाक्य इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἄνδρα δίκαιον καὶ ἅγιον
  choice: एक धर्मी और पवित्र मनुष्य
  rationale: ‘धर्मी’ नैतिक खराई और ‘पवित्र’ परमेश्वर-संबंधी विशिष्ट चरित्र को व्यक्त करता है; ‘मनुष्य’ ἄνδρα का स्पष्ट और गरिमापूर्ण अनुवाद है।
- source_word: συνετήρει αὐτόν
  choice: उसे सुरक्षित रखता था
  rationale: संदर्भ में क्रिया यूहन्ना को हानि से बचाए रखने का भाव देती है। यह केवल ‘उसे रखता था’ की अपेक्षा अधिक स्पष्ट है।
- source_word: ἀκούσας αὐτοῦ
  choice: जब वह उसकी बात सुनता
  rationale: यूनानी में व्यक्ति को सुनने का मुहावरा है; ‘उसकी बात सुनता’ आधुनिक हिन्दी में स्वाभाविक है और आशय को अनावश्यक विस्तार के बिना स्पष्ट करता है।
- source_word: πολλὰ ἠπόρει
  choice: बहुत उलझन में पड़ जाता
  rationale: SBLGNT के ἠπόρει का अर्थ असमंजस या उलझन में होना है और πολλὰ उसकी तीव्रता बढ़ाता है।
- source_word: ἡδέως αὐτοῦ ἤκουεν
  choice: फिर भी आनन्द से उसकी सुनता था
  rationale: ἡδέως प्रसन्नता या रुचि से सुनने का भाव देता है। ‘फिर भी’ उसकी उलझन और प्रसन्नतापूर्वक सुनने के बीच निहित विरोध को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
- issue: यूहन्ना को सुनने के बाद हेरोदेस की प्रतिक्रिया से संबंधित पाठांतर
  choice: आलोचनात्मक पाठ ἠπόρει के अनुसार ‘बहुत उलझन में पड़ जाता’
  alternative: ἐποίει के अनुसार ‘बहुत-से काम करता था’
  rationale: SBLGNT में ἠπόρει है, जो हेरोदेस के आंतरिक असमंजस तथा फिर भी आनन्द से सुनने के तनाव को बनाए रखता है। अर्थ में बड़ा अंतर डालने वाला प्रसिद्ध वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। अपूर्णकालीन क्रियाओं से हेरोदेस के लगातार रवैये और बार-बार सुनने की स्थिति व्यक्त की गई है। ‘आनन्द से’ सामान्य पाठक के लिए बोधगम्य रहते हुए ἡδέως का सकारात्मक भाव बनाए रखता है।
