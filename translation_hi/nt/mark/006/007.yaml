  yaml_path: translation/nt/mark/006/007.yaml
  text: And he called the Twelve and began to send them out two by two[c][b][a], and he was giving them authority over the unclean spirits.
translation:
  language: hi
  text: उसने बारहों को अपने पास बुलाया[a] और उन्हें दो-दो के दलों में भेजना शुरू किया, और वह उन्हें अशुद्ध आत्माओं पर अधिकार[b] देता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में क्रिया ऐतिहासिक वर्तमान में है: “अपने पास बुलाता है।”'
    reason: source_form
  - marker: b
    text: या, “अशुद्ध आत्माओं पर सामर्थ्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: προσκαλεῖται
  choice: अपने पास बुलाया
  rationale: मध्यवाच्य रूप में किसी को अपने पास बुलाने का भाव है। मरकुस के ऐतिहासिक वर्तमान को सहज हिन्दी कथन के लिए भूतकाल में रखा गया है, जबकि पादटिप्पणी में उसके वर्तमान-काल रूप का संकेत दिया गया है।
- source_word: τοὺς δώδεκα
  choice: बारहों
  rationale: संदर्भ में यह यीशु द्वारा चुने गए विशिष्ट बारह जनों का स्थापित सामूहिक पदनाम है। हिन्दी में ‘बारहों’ संक्षिप्त और स्वाभाविक है तथा ‘चेले’ जैसा शब्द मूल में जोड़े बिना समूह को दर्शाता है।
- source_word: ἤρξατο ... ἀποστέλλειν
  choice: भेजना शुरू किया
  rationale: ἄρχομαι के साथ धातुरूप किसी कार्य के आरम्भ को व्यक्त करता है। हिन्दी में यह वाक्यांश स्वाभाविक रूप से उसी अर्थ को रखता है।
- source_word: δύο δύο
  choice: दो-दो करके
  rationale: दो की पुनरावृत्ति वितरणात्मक है, अर्थात् प्रत्येक दल में दो व्यक्ति। ‘दो-दो करके’ हिन्दी में अर्थ और मूल की लय दोनों को बनाए रखता है।
- source_word: ἐδίδου
  choice: देता गया
  rationale: अपूर्ण भूतकालीन क्रिया को केवल एक बार के ‘दिया’ की अपेक्षा जारी अथवा क्रमिक क्रिया के रूप में व्यक्त करता है और भेजने की प्रक्रिया के साथ उसकी समकालिकता बनाए रखता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह शब्द केवल शक्ति नहीं, बल्कि प्रदान किया हुआ अधिकार भी व्यक्त करता है। संदर्भ में यीशु बारहों को अशुद्ध आत्माओं पर कार्य करने का अधिकार देता है।
- source_word: τῶν πνευμάτων τῶν ἀκαθάρτων
  choice: अशुद्ध आत्माओं
  rationale: यह मरकुस की शब्दावली का सीधा और प्रचलित हिन्दी रूप है। इसे ‘दुष्टात्माओं’ में बदलने से बचाया गया है ताकि मूल अभिव्यक्ति बनी रहे।
theological_decisions:
- issue: ἐξουσίαν का अर्थ—प्रदान किया हुआ अधिकार या केवल सामर्थ्य
  choice: अशुद्ध आत्माओं पर अधिकार
  alternative: अशुद्ध आत्माओं पर सामर्थ्य
  rationale: ‘अधिकार’ उस संबंधपरक और प्रत्यायोजित अधिकार को बेहतर ढंग से व्यक्त करता है जो यीशु बारहों को देता है। पादटिप्पणी ‘सामर्थ्य’ की सम्भव अर्थछाया को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बारहों’, ‘दो-दो करके’ और ‘देता गया’ सामान्य पाठक के लिए स्वाभाविक हैं। ऐतिहासिक वर्तमान की असहज काल-भिन्नता मुख्य पाठ में समतल की गई है, पर पादटिप्पणी में मूल रूप सुरक्षित है।
