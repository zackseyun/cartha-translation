  text: ἀκούσας δὲ ⸀ὁ Ἡρῴδης ⸀ἔλεγεν· Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην, οὗτος ⸀ἠγέρθη.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/016.yaml
  text: But when Herod heard it[a], he said, “John, whom I beheaded[b], has been raised.”
translation:
  language: hi
  text: पर जब हेरोदेस ने यह सुना, तो उसने कहा[a], “जिस यूहन्ना का सिर मैंने कटवाया था, वही जिलाया गया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कहता रहा।” ग्रीक क्रिया का अपूर्ण भूतकाल जारी रहने या बार-बार कहने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उठाया गया है” या “जी उठा है।” ग्रीक क्रिया कर्मवाच्य है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: जब ... ने यह सुना
  rationale: कालवाचक कृदन्त को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है; ‘यह’ पिछले प्रसंग में यीशु के विषय में सुनाई पड़ी बातों की ओर संकेत करता है।
- source_word: δὲ
  choice: पर
  rationale: यह कथा में हल्का मोड़ और हेरोदेस की प्रतिक्रिया की ओर वापसी दिखाता है।
- source_word: ἔλεγεν
  choice: वह कहता था
  rationale: अपूर्ण भूतकाल की जारी रहने या बार-बार कहे जाने की सम्भावना को हिन्दी में स्वाभाविक रूप से बनाए रखता है।
- source_word: Ὃν ἐγὼ ἀπεκεφάλισα Ἰωάννην
  choice: जिस यूहन्ना का मैंने सिर कटवाया था
  rationale: ग्रीक में कर्म को आगे रखने से आए बल को ‘जिस यूहन्ना... वही’ संरचना से रखा गया है। प्रसंग के अनुसार हेरोदेस ने दण्ड दिलवाया था, इसलिए हिन्दी का प्रेरणार्थक ‘कटवाया’ उसकी जिम्मेदारी और मध्यस्थ क्रिया दोनों व्यक्त करता है।
- source_word: οὗτος
  choice: वही
  rationale: संकेतवाचक और बलात्मक अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἠγέρθη
  choice: जीवित किया गया है
  rationale: मृत्यु के बाद जीवित किए जाने का प्रसंगगत अर्थ और ग्रीक का कर्मवाच्य दोनों सुरक्षित रहते हैं; इसे सक्रिय ‘जी उठा है’ में नहीं बदला गया।
theological_decisions:
- issue: ἠγέρθη में पुनरुत्थान-संबंधी कर्मवाच्य
  choice: जीवित किया गया है
  alternative: जी उठा है / उठाया गया है
  rationale: ग्रीक रूप कर्मवाच्य है। चुना हुआ अनुवाद किसी कर्ता का नाम जोड़े बिना कर्मवाच्य बनाए रखता है और आधुनिक हिन्दी में मृत्यु से जीवन में लौटाए जाने का आशय स्पष्ट करता है। पादटिप्पणी अधिक शब्दानुरूप विकल्प भी देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सिर कटवाया’ सामान्य पाठक के लिए स्वाभाविक है और हेरोदेस की उत्तरदायी भूमिका को प्रसंगानुसार व्यक्त करता है; ‘वही’ मूल संकेतवाचक बल को बनाए रखता है।
