lexical_decisions:
- source_word: ἀνέπεσαν
  choice: भोजन के लिए बैठ गए
  rationale: यूनानी क्रिया भोजन करने के लिए स्थान लेने या टिककर बैठने का भाव देती है। हिंदी में ‘भोजन के लिए बैठ गए’ प्रसंग और भोजन-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त करता है; ‘लेट गए’ अनचाहा शारीरिक चित्र उत्पन्न कर सकता है।
- source_word: πρασιαὶ πρασιαὶ
  choice: समूहों में
  rationale: प्रशिया का शाब्दिक अर्थ बगीचे की क्यारी है, पर यहाँ पुनरुक्त रूप व्यवस्थित अलग-अलग समूहों का चित्र प्रस्तुत करता है। मुख्य पाठ में स्वाभाविक ‘समूहों में’ रखा गया है और मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: κατὰ ἑκατὸν
  choice: सौ-सौ
  rationale: κατά और संख्या का संयोजन यहाँ वितरण का अर्थ देता है। ‘सौ-सौ’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक वितरणात्मक रूप है।
- source_word: κατὰ πεντήκοντα
  choice: पचास-पचास
  rationale: यह भी वितरणात्मक संख्या है; ‘पचास-पचास’ पहले पद के समानांतरता और समूहों की संख्या दोनों को स्पष्ट रखता है।
