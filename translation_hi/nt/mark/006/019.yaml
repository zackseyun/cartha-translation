  yaml_path: translation/nt/mark/006/019.yaml
  text: But Herodias held a grudge against him and wanted to kill him[a], but she could not.
translation:
  language: hi
  text: पर हेरोदियास उससे मन में बैर रखती थी[a] और उसे मार डालना चाहती थी, लेकिन ऐसा कर नहीं सकती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके प्रति मन में द्वेष पाल रही थी।’ यूनानी मुहावरा लगातार बनी हुई शत्रुता का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन के साथ विरोध या कथा में नया मोड़ दिखाता है; यहाँ ‘पर’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: Ἡρῳδιὰς
  choice: हेरोदियास
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: ἐνεῖχεν αὐτῷ
  choice: उससे मन में बैर रखती थी
  rationale: यह यूनानी मुहावरा उसके प्रति लगातार बनी हुई शत्रुता और द्वेष को व्यक्त करता है। अपूर्ण काल की निरंतरता को ‘रखती थी’ से दर्शाया गया है।
- source_word: ἤθελεν
  choice: चाहती थी
  rationale: यह उसकी लगातार बनी हुई इच्छा या मंशा को सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτὸν ἀποκτεῖναι
  choice: उसे मार डालना
  rationale: यह क्रिया के सीधे अर्थ को सुरक्षित रखता है; ‘हत्या करना’ कहने से ऐसा कानूनी-नैतिक अर्थ जुड़ सकता था जो यूनानी क्रिया में स्वयं स्पष्ट नहीं है।
- source_word: καὶ οὐκ ἠδύνατο
  choice: लेकिन ऐसा कर नहीं सकती थी
  rationale: 'यहाँ καὶ प्रसंग में विरोधात्मक भाव देता है: इच्छा होने के बावजूद वह ऐसा करने में समर्थ नहीं थी। अपूर्ण काल की स्थिति ‘नहीं सकती थी’ से व्यक्त होती है।'
