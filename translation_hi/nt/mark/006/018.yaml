  text: ἔλεγεν γὰρ ὁ Ἰωάννης τῷ Ἡρῴδῃ ὅτι Οὐκ ἔξεστίν σοι ἔχειν τὴν γυναῖκα τοῦ ἀδελφοῦ σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/018.yaml
  text: For John had been saying to Herod[a], “It is not lawful for you to have your brother’s wife.”
translation:
  language: hi
  text: क्योंकि यूहन्ना हेरोदेस से बार-बार कहता था, “तुम्हारे लिए अपने भाई की पत्नी को पत्नी के रूप में रखना वैध नहीं है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें अपने भाई की पत्नी को पत्नी के रूप में रखने की अनुमति नहीं है।”
    reason: ἔξεστιν वैधता अथवा अनुमति व्यक्त कर सकता है।
lexical_decisions:
- source_word: ἔλεγεν
  choice: बार-बार कहता था
  rationale: अपूर्ण काल भूतकाल में जारी या दोहराई जाती क्रिया सूचित करता है; यह हिन्दी में उसके पुनरावृत्त पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले प्रसंग का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: Ἡρῴδῃ
  choice: हेरोदेस
  rationale: व्यक्ति के नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: Οὐκ ἔξεστίν σοι
  choice: तेरे लिए व्यवस्था के अनुसार उचित नहीं है
  rationale: ἔξεστιν अनुमति या वैधता व्यक्त करता है। यहाँ वैवाहिक निषेध और भविष्यद्वक्तात्मक फटकार के संदर्भ में यह नैतिक-विधिक बल रखता है; ‘व्यवस्था के अनुसार उचित’ उसे सामान्य नैतिक पसंद तक सीमित नहीं करता।
- source_word: ἔχειν
  choice: रखना
  rationale: मूल अर्थ ‘रखना/अपने पास होना’ है; वैवाहिक संदर्भ में हिन्दी का यह प्रयोग स्रोत की सीधी अभिव्यक्ति को बनाए रखता है।
- source_word: γυναῖκα
  choice: पत्नी
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है, पर ‘तेरे भाई की’ पदबंध वैवाहिक अर्थ स्पष्ट करता है।
- source_word: τοῦ ἀδελφοῦ σου
  choice: अपने भाई की
  rationale: सम्बन्धकारक पदबंध का स्वाभाविक हिन्दी रूप, जो हेरोदेस को संबोधित वाक्य में निजवाचक ‘अपने’ की माँग करता है।
theological_decisions:
- issue: यूहन्ना की फटकार का स्वरूप
  choice: ‘व्यवस्था के अनुसार उचित नहीं है’ के रूप में नैतिक-विधिक निषेध
  alternative: ‘तुझे इसकी अनुमति नहीं है’ या अधिक सामान्य ‘यह तेरे लिए ठीक नहीं है’
  rationale: ἔξεστιν वैधता अथवा अनुमति से संबंधित है और संभवतः लैव्यव्यवस्था की वैवाहिक निषेधाज्ञाओं की पृष्ठभूमि रखता है। अनुवाद उस विधिक-नैतिक बल को बनाए रखता है, पर पद में न दिया गया कोई स्पष्ट मूसा-संबंधी उल्लेख नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तेरे’ का प्रयोग यूहन्ना के सीधे, एकवचन संबोधन को दर्शाता है; ‘बार-बार’ यूनानी अपूर्ण काल की पुनरावृत्त या जारी क्रिया को स्पष्ट करता है।
