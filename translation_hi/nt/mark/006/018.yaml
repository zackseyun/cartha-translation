- from: क्योंकि यूहन्ना हेरोदेस से बार-बार कहता था, “अपने भाई की पत्नी को रखना तेरे लिए व्यवस्था के अनुसार उचित नहीं है।”[a]
  to: क्योंकि यूहन्ना हेरोदेस से बार-बार कहता था, “तुम्हारे लिए अपने भाई की पत्नी को पत्नी के रूप में रखना वैध नहीं है।”[a]
  rationale: मुख्य पाठ से “व्यवस्था के अनुसार” हटाया गया है, क्योंकि वह यूनानी पद में स्पष्ट रूप से नहीं है। वैवाहिक संदर्भ को आधुनिक, स्पष्ट हिन्दी में व्यक्त करने के लिए “पत्नी के रूप में” जोड़ा गया है।
