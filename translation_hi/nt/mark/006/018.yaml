review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents γάρ, the imperfect force of ἔλεγεν, Herod’s direct address, and the brother-wife relationship. However, “व्यवस्था के अनुसार” explicitly introduces a legal standard not stated in the Greek, even if it is likely part of the background. The source’s juridical-permissive force can be conveyed without this addition.
  naturalness: “अपने भाई की पत्नी को रखना” is not sufficiently natural in modern Hindi when used of a marital relationship. Adding “पत्नी के रूप में” makes the intended sense clear and idiomatic. “तुम्हारे” maintains a dignified direct address more naturally than “तेरे” in this register.
  terminology: “वैध नहीं है” preserves the legal/moral sense of οὐκ ἔξεστίν without inserting an explicit reference to the Law. The footnote retains the legitimate alternative of permission.
  issues:
  - severity: medium
    issue: “व्यवस्था के अनुसार” adds an explicit reference absent from the Greek.
    rationale: Although Torah prohibitions likely inform John’s rebuke, the verse itself says only that it is not permitted/lawful. The translation should not make the implicit background explicit in the main text.
  - severity: medium
    issue: “अपने भाई की पत्नी को रखना” is unclear and unnatural as a marital expression.
    rationale: Hindi readers may understand ordinary possession or retention rather than maintaining her as one’s wife. “पत्नी के रूप में रखना” conveys the contextual marital sense of ἔχειν.
  revised_text: क्योंकि यूहन्ना हेरोदेस से बार-बार कहता था, “तुम्हारे लिए अपने भाई की पत्नी को पत्नी के रूप में रखना वैध नहीं है।”[a]
