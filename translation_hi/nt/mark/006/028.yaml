  text: And he brought his head on a platter and gave it to the girl[a], and the girl gave it to her mother.
translation:
  language: hi
  text: और वह उसका सिर एक थाल[a] पर लाया और लड़की को दे दिया; और लड़की ने उसे अपनी माँ को दे दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तश्तरी’ अथवा ‘परोसने की थाली’। यूनानी शब्द πίναξ भोजन परोसने के थाल या तश्तरी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤνεγκεν
  choice: लाया
  rationale: यहाँ क्रिया भोज के स्थान पर कटे हुए सिर को भौतिक रूप से लाने की क्रिया बताती है; ‘लाया’ स्वाभाविक और सटीक है।
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: उसका सिर
  rationale: सर्वनाम का संकेत पिछले प्रसंग में वर्णित यूहन्ना की ओर है; हिन्दी में ‘उसका सिर’ सहज रूप है।
- source_word: ἐπὶ πίνακι
  choice: एक बड़े थाल पर
  rationale: πίναξ परोसने के काम आने वाले थाल, तश्तरी या पात्र को दर्शा सकता है। भोज के प्रसंग में ‘बड़ा थाल’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: ἔδωκεν
  choice: दे दिया
  rationale: दोनों उपवाक्यों में δίδωμι की पुनरावृत्ति को ‘दे दिया’ से बनाए रखा गया है; पूर्ण क्रिया क्रमिक हस्तांतरण को स्पष्ट करती है।
- source_word: τῷ κορασίῳ / τὸ κοράσιον
  choice: लड़की
  rationale: κοράσιον कम उम्र की लड़की को सूचित करता है; ‘लड़की’ आधुनिक, स्पष्ट और अनार्ष है।
- source_word: τῇ μητρὶ αὐτῆς
  choice: अपनी माँ को
  rationale: कर्ता लड़की होने के कारण आत्मवाचक ‘अपनी’ हिन्दी में स्वाभाविक रूप से उसी की माँ का बोध कराता है।
