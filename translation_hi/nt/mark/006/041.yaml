source:
  edition: SBLGNT
  text: καὶ λαβὼν τοὺς πέντε ἄρτους καὶ τοὺς δύο ἰχθύας ἀναβλέψας εἰς τὸν οὐρανὸν εὐλόγησεν καὶ κατέκλασεν τοὺς ἄρτους καὶ ἐδίδου τοῖς μαθηταῖς ⸀αὐτοῦ ἵνα ⸀παρατιθῶσιν αὐτοῖς, καὶ τοὺς δύο ἰχθύας ἐμέρισεν πᾶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/041.yaml
  text: And taking the five loaves and the two fish[a], looking up to heaven, he blessed and broke the loaves, and kept giving them to his disciples to set before them[b], and he divided the two fish among them all.
translation:
  language: hi
  text: फिर उसने पाँच रोटियाँ और दो मछलियाँ लीं और स्वर्ग की ओर आँखें उठाकर आशीष दी[a]। उसने रोटियाँ तोड़ीं और उन्हें अपने शिष्यों को देता रहा, ताकि वे उन्हें लोगों के सामने परोसें; और उसने दोनों मछलियाँ सब लोगों में बाँट दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद दिया।” यूनानी क्रिया का मूल अर्थ “आशीष देना” है, पर भोजन के प्रसंग में इसका अर्थ धन्यवाद देना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: लीं
  rationale: अओरिस्ट कृदंत आगे की क्रियाओं की भूमिका बाँधता है; हिन्दी में क्रमबद्ध मुख्य क्रिया के रूप में ‘लीं’ स्वाभाविक है।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: गिनी हुई अलग-अलग ἄρτοι के लिए आधुनिक हिन्दी में ‘रोटियाँ’ सहज और ठोस शब्द है।
- source_word: ἰχθύας
  choice: मछलियाँ
  rationale: बहुवचन वस्तु का सीधा और स्वाभाविक अनुवाद।
- source_word: ἀναβλέψας εἰς τὸν οὐρανὸν
  choice: स्वर्ग की ओर आँखें उठाकर
  rationale: ऊपर की ओर दृष्टि करने की क्रिया और οὐρανός की धार्मिक अनुगूँज दोनों सुरक्षित रहती हैं।
- source_word: εὐλόγησεν
  choice: आशीष दी
  rationale: मूल क्रिया εὐλογέω को सीधे व्यक्त करता है और किसी अनुल्लिखित प्रत्यक्ष कर्म—भोजन या परमेश्वर—को जोड़कर अर्थ निश्चित नहीं करता।
- source_word: κατέκλασεν τοὺς ἄρτους
  choice: रोटियाँ तोड़ीं
  rationale: मूल में स्पष्ट कर्म को बनाए रखते हुए ठोस क्रिया व्यक्त की गई है।
- source_word: ἐδίδου
  choice: देता रहा
  rationale: अपूर्ण काल वितरण के दौरान चलती या बार-बार होती क्रिया का संकेत देता है।
- source_word: μαθηταῖς αὐτοῦ
  choice: अपने शिष्यों को
  rationale: αὐτοῦ के संबंध को स्वाभाविक हिन्दी में ‘अपने’ से स्पष्ट किया गया है।
- source_word: ἵνα παρατιθῶσιν αὐτοῖς
  choice: ताकि वे लोगों के सामने परोसें
  rationale: ἵνα का प्रयोजन और παρατίθημι का भोजन सामने रखने/परोसने वाला ठोस अर्थ व्यक्त होता है; ‘लोगों’ से αὐτοῖς का प्रसंगगत संकेत स्पष्ट होता है।
- source_word: ἐμέρισεν πᾶσιν
  choice: सबमें बाँट दीं
  rationale: ἐμέρισεν के बाँटने/हिस्सा देने के अर्थ और πᾶσιν की सर्वसमावेशिता को सहज हिन्दी में रखा गया है।
theological_decisions:
- issue: भोजन के प्रसंग में εὐλόγησεν का अर्थ
  choice: आशीष दी
  alternative: धन्यवाद दिया
  rationale: मूल क्रिया εὐλογέω है, εὐχαριστέω नहीं। ‘आशीष दी’ मूल शब्द के अधिक निकट है, जबकि पादटिप्पणी भोजन के प्रसंग में ‘धन्यवाद दिया’ की संभावित अर्थच्छाया बताती है। किसी कर्म को न जोड़ने से यह तय नहीं किया जाता कि आशीष सीधे भोजन पर दी गई थी।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। क्रियाओं के क्रम को छोटे वाक्यों में रखा गया है; ‘देता रहा’ से यूनानी अपूर्ण काल का निरंतर/पुनरावृत्त भाव व्यक्त किया गया है।
