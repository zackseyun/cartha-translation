source:
  edition: SBLGNT
  text: Αὐτὸς γὰρ ὁ Ἡρῴδης ἀποστείλας ἐκράτησεν τὸν Ἰωάννην καὶ ἔδησεν αὐτὸν ἐν φυλακῇ διὰ Ἡρῳδιάδα τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ, ὅτι αὐτὴν ἐγάμησεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/017.yaml
  text: For Herod himself had sent and seized John[a], and bound him in prison because of Herodias, the wife of Philip his brother[b], because he had married her.
translation:
  language: hi
  text: क्योंकि हेरोदेस ने स्वयं लोगों को भेजकर यूहन्ना को पकड़वा लिया था और उसे कारागार में बाँध दिया था। उसने यह हेरोदियास के कारण किया था, जो उसके भाई फिलिप्पुस की पत्नी थी, क्योंकि हेरोदेस ने उससे विवाह कर लिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ Ἡρῴδης
  choice: क्योंकि हेरोदेस ने स्वयं
  rationale: γὰρ पिछले कथन का कारण स्पष्ट करता है, इसलिए ‘क्योंकि’ रखा गया है; Αὐτός का बल ‘स्वयं’ से व्यक्त होता है और हेरोदेस की जिम्मेदारी पर जोर बना रहता है।
- source_word: ἀποστείλας ἐκράτησεν τὸν Ἰωάννην
  choice: अपने आदमी भेजकर यूहन्ना को पकड़वा लिया था
  rationale: पहले आए aorist participle ἀποστείλας से किसी को भेजने की पूर्ववर्ती कार्रवाई व्यक्त होती है। हिंदी का causative ‘पकड़वा लिया’ स्वाभाविक रूप से बताता है कि हेरोदेस ने भेजे गए लोगों के द्वारा यूहन्ना को हिरासत में लिया; ‘अपने आदमी’ संदर्भ में निहित, पर यूनानी में अव्यक्त, कर्ताओं को स्पष्ट करता है।
- source_word: ἔδησεν αὐτὸν ἐν φυλακῇ
  choice: उसे बंदीगृह में बाँध दिया था
  rationale: δέω के ठोस अर्थ ‘बाँधना’ को बनाए रखा गया है और φυλακή को प्रसंगानुसार कारावास के स्थान के रूप में ‘बंदीगृह’ कहा गया है; ‘जंजीरों’ जैसी अनुल्लिखित वस्तु नहीं जोड़ी गई।
- source_word: διὰ Ἡρῳδιάδα
  choice: हेरोदियास के कारण
  rationale: διά के साथ accusative यहाँ कारण बताता है; ‘के कारण’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: τὴν γυναῖκα Φιλίππου τοῦ ἀδελφοῦ αὐτοῦ
  choice: जो उसके भाई फिलिप्पुस की पत्नी थी
  rationale: γυνή संबंधसूचक रचना में ‘पत्नी’ है। संबंधवाचक उपवाक्य हिंदी में पहचान को स्पष्ट और सहज ढंग से प्रस्तुत करता है।
- source_word: ὅτι αὐτὴν ἐγάμησεν
  choice: क्योंकि हेरोदेस ने उससे विवाह कर लिया था
  rationale: γαμέω का सीधा अर्थ ‘विवाह करना’ है। हिंदी में अस्पष्ट पुरुषवाचक सर्वनाम से बचने के लिए कर्ता ‘हेरोदेस’ दोहराया गया है; पूर्ण भूतकाल उस विवाह को यूहन्ना की गिरफ्तारी से पहले की घटना के रूप में स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: हेरोदेस के विवाह और यूहन्ना की गिरफ्तारी का नैतिक-ऐतिहासिक चित्रण
  choice: 'पद को वर्णनात्मक रखा गया है: गिरफ्तारी का कारण हेरोदियास और उससे हेरोदेस का विवाह बताया गया है।'
  alternative: मुख्य पाठ में ही विवाह को अवैध या अनैतिक कहना।
  rationale: इस वाक्य में विवाह पर स्पष्ट नैतिक निर्णय नहीं दिया गया; वह अगले संदर्भ में सामने आता है। इसलिए यहाँ स्रोत से अधिक धर्मवैचारिक टिप्पणी नहीं जोड़ी गई।
- issue: ἀποστείλας के निहित माध्यम को हिंदी में व्यक्त करना
  choice: ‘अपने आदमी भेजकर … पकड़वा लिया’
  alternative: ‘भेजकर … पकड़ लिया’, जिससे यह आभास हो सकता है कि हेरोदेस ने स्वयं जाकर यूहन्ना को पकड़ा।
  rationale: यूनानी रचना हेरोदेस को पूरी कार्रवाई के लिए उत्तरदायी ठहराती है, पर भेजने की क्रिया उसके अधीन लोगों द्वारा गिरफ्तारी का संकेत देती है। हिंदी causative इस agency को बिना ऐतिहासिक विवरण बढ़ाए स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘बंदीगृह’ औपचारिक किंतु सामान्यतः बोधगम्य है। नामों के प्रचलित हिंदी बाइबलीय रूप—हेरोदेस, हेरोदियास, फिलिप्पुस और यूहन्ना—अपनाए गए हैं।
