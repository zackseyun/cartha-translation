  text: καὶ οὐκ ἐδύνατο ἐκεῖ ⸂ποιῆσαι οὐδεμίαν δύναμιν⸃, εἰ μὴ ὀλίγοις ἀρρώστοις ἐπιθεὶς τὰς χεῖρας ἐθεράπευσεν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/005.yaml
  text: And he was not able to do any mighty work there[a], except that he laid his hands on a few sick people and healed them.
translation:
  language: hi
  text: और वह वहाँ सामर्थ्य का कोई कार्य नहीं कर सका[a], सिवाय इसके कि उसने कुछ बीमार लोगों पर हाथ रखकर उन्हें चंगा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई चमत्कार” अथवा “सामर्थ्य का कोई कार्य”; यूनानी में शाब्दिक रूप से “कोई सामर्थ्य” है—मरकुस में यह चमत्कारी कार्यों के लिए प्रयुक्त अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐδύνατο
  choice: नहीं कर सका
  rationale: नकार के साथ δύναμαι की वास्तविक असमर्थता को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है; इसे केवल अनिच्छा के अर्थ में नरम नहीं करता।
- source_word: ποιῆσαι οὐδεμίαν δύναμιν
  choice: कोई सामर्थ्य का काम
  rationale: मरकुस में δύναμις चमत्कारी सामर्थ्य के कार्य को सूचित करता है। यह रूप ‘चमत्कार’ की अपेक्षा मूल शब्द ‘सामर्थ्य’ से संबंध बनाए रखता है, जबकि ‘काम’ ποιῆσαι के व्यापक अर्थ को व्यक्त करता है।
- source_word: εἰ μὴ
  choice: केवल
  rationale: पूर्ववर्ती निषेध के बाद आने वाले अपवाद को संक्षिप्त और स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ὀλίγοις ἀρρώστοις
  choice: कुछ बीमार लोगों
  rationale: मात्रा और बीमारी दोनों को साधारण आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐπιθεὶς τὰς χεῖρας
  choice: पर हाथ रखकर
  rationale: अओरिस्ट कृदंत की पूर्ववर्ती शारीरिक क्रिया को स्वाभाविक हिन्दी संयोजक कृदंत से व्यक्त करता है।
- source_word: ἐθεράπευσεν
  choice: चंगा किया
  rationale: चंगाई के प्रसंग में θεραπεύω का परिचित, गरिमापूर्ण और पुनर्स्थापनात्मक हिन्दी प्रतिरूप है।
theological_decisions:
- issue: क्या οὐκ ἐδύνατο को यीशु की सीमा का संकेत देने से बचाने के लिए नरम किया जाए
  choice: वह वहाँ कोई सामर्थ्य का काम नहीं कर सका
  alternative: उसने वहाँ कोई सामर्थ्य का काम करना नहीं चाहा
  rationale: यूनानी पाठ नकार सहित δύναμαι द्वारा स्पष्ट असमर्थता कहता है। अनुवाद को इस धर्मवैज्ञानिक तनाव को बनाए रखना चाहिए, न कि इसे केवल अनिच्छा में बदलकर व्याख्यात्मक रूप से सुलझाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘नहीं कर सका’ मूल पाठ की स्पष्ट असमर्थता को सुरक्षित रखता है, और ‘सामर्थ्य का काम’ δύναμις की शब्दगत छवि को बनाए रखता है।
