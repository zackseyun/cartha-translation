  rationale: आदेश और क्रियार्थक रूप के बल को स्वाभाविक हिन्दी वाक्य-रचना में सुरक्षित रखता है।
- source_word: τὴν κεφαλὴν αὐτοῦ
  choice: उसका सिर
  rationale: यह सहज हिन्दी है और प्रसंग में सर्वनाम यूहन्ना की ओर संकेत करता है।
- source_word: ἀπεκεφάλισεν
  choice: उसका सिर काट दिया
  rationale: क्रिया का स्पष्ट और स्वाभाविक हिन्दी रूप, जो अत्यधिक तकनीकी भाषा से बचता है।
- source_word: ἐν τῇ φυλακῇ
  choice: बन्दीगृह में
  rationale: पहले से स्थापित ठोस स्थान को गरिमापूर्ण और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
