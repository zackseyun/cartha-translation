base_translation:
  language: en
  yaml_path: translation/nt/mark/006/055.yaml
  text: They ran throughout that whole region and began carrying those who were sick on mats to wherever they heard he was[a].
translation:
  language: hi
  text: वे उस सारे इलाके में दौड़ पड़े और बीमार लोगों को चटाइयों पर लिटाकर वहाँ ले जाने लगे, जहाँ वे सुनते कि वह मौजूद है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिछौनों पर’ या ‘खाटों पर’; यूनानी शब्द साधारण, उठाकर ले जाने योग्य बिछावन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: περιέδραμον
  choice: दौड़ते फिरते
  rationale: यह संयुक्त क्रिया पूरे इलाके में तेज़ी और तत्परता से इधर-उधर जाने का भाव देती है; यह प्रयोग हिन्दी में स्वाभाविक ढंग से दोनों पक्ष व्यक्त करता है।
- source_word: ὅλην τὴν χώραν ἐκείνην
  choice: उस सारे इलाके में
  rationale: χώρα यहाँ आधुनिक राष्ट्र नहीं, आसपास का भूभाग या क्षेत्र है; ‘इलाका’ सामान्य पाठक के लिए सहज है और ἐκείνην का संकेत ‘उस’ से बना रहता है।
- source_word: ἤρξαντο ... περιφέρειν
  choice: उठाकर ... ले जाने लगे
  rationale: ἤρξαντο क्रिया के आरम्भ को व्यक्त करता है, जबकि περιφέρειν बीमारों को एक स्थान से दूसरे स्थान तक शारीरिक रूप से ढोकर पहुँचाने का अर्थ देता है।
- source_word: ἐπὶ τοῖς κραβάττοις
  choice: चटाइयों पर
  rationale: κράβαττος साधारण, उठाकर ले जाने योग्य बिछावन, खाट या पलंगड़ी को सूचित कर सकता है; मुख्य पाठ में ‘चटाइयाँ’ सरल और संदर्भानुकूल है, जबकि व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: τοὺς κακῶς ἔχοντας
  choice: बीमारों को
  rationale: यह यूनानी मुहावरा उन लोगों के लिए है जिनकी तबीयत खराब है; ‘बीमारों’ इसका स्पष्ट और संक्षिप्त हिन्दी रूप है।
- source_word: ὅπου ἤκουον ὅτι ἐστίν
  choice: जहाँ कहीं वे सुनते कि वह है
  rationale: यह रूप अप्रत्यक्ष सूचना और अनिश्चित स्थान—जिस किसी जगह उसके होने की खबर मिलती—दोनों को बनाए रखता है; यूनानी वर्तमान ἐστίν को भी अनावश्यक रूप से भूतकाल में नहीं बदलता।
