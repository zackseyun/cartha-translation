  text: Καὶ συνάγονται οἱ ἀπόστολοι πρὸς τὸν Ἰησοῦν, καὶ ἀπήγγειλαν αὐτῷ ⸀πάντα ὅσα ἐποίησαν καὶ ὅσα ἐδίδαξαν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/030.yaml
  text: And the apostles gathered to Jesus[a], and they reported to him all that they had done and taught.
translation:
  language: hi
  text: प्रेरित यीशु के पास इकट्ठे हुए और उन्होंने जो कुछ किया और सिखाया था, वह सब उन्हें बताया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने जो कुछ किया था और जो कुछ सिखाया था, वह सब उन्हें बताया।”
    reason: यूनानी में ‘जो कुछ’ के समतुल्य संबंधवाचक पद दोनों क्रियाओं के साथ अलग-अलग दोहराया गया है; मुख्य पाठ अधिक सहज हिन्दी में उसे संयुक्त रूप से प्रस्तुत करता है।
lexical_decisions:
- source_word: συνάγονται
  choice: इकट्ठे हुए
  rationale: वर्णन में वर्तमान काल ऐतिहासिक वर्तमान है; हिन्दी में सामान्य भूतकाल स्वाभाविक है। ‘इकट्ठे हुए’ सामूहिक रूप से यीशु के पास लौटने का भाव रखता है।
- source_word: ἀπόστολοι
  choice: प्रेरित
  rationale: मरकुस में यह भेजे गए बारह शिष्यों की पहचानी हुई भूमिका का पद है; ‘प्रेरित’ आधुनिक हिन्दी बाइबलीय प्रयोग में सटीक और प्रचलित है।
- source_word: πρὸς τὸν Ἰησοῦν
  choice: यीशु के पास
  rationale: πρός के साथ कर्मकारक यहाँ किसी व्यक्ति की ओर आने और उसके पास पहुँचने का अर्थ देता है।
- source_word: ἀπήγγειλαν
  choice: बताया
  rationale: यह क्रिया लौटकर विवरण देने को व्यक्त करती है। ‘बताया’ सामान्य हिन्दी में सहज है और प्रसंग में अपनी गतिविधियों का पूरा वृत्तांत देने का भाव रखता है।
- source_word: πάντα ὅσα
  choice: जो कुछ … वह सब
  rationale: यह हिन्दी संरचना πάντα की समग्रता और ὅσα के संबंधवाचक अर्थ दोनों को स्वाभाविक ढंग से सुरक्षित रखती है।
- source_word: ἐποίησαν καὶ ἐδίδαξαν
  choice: किया और सिखाया था
  rationale: दोनों समानांतर गतिविधियाँ उस मिशन में पहले पूरी हो चुकी थीं, इसलिए ‘था’ रिपोर्ट देने से पूर्व की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शिष्यों के लिए ἀπόστολοι का वर्णन
  choice: भूमिका/पद के रूप में ‘प्रेरित’
  alternative: दूत / भेजे हुए लोग
  rationale: पाठ लौटकर आने वाले उस नियुक्त समूह को ἀπόστολοι कहता है। केवल ‘दूत’ कहना मरकुस में उनकी विशेष रूप से भेजी गई सेवकाई और पहचाने हुए पद को अस्पष्ट कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रेरित’ स्थापित बाइबलीय पद है; शेष वाक्य अनावश्यक रूप से औपचारिक नहीं बनाया गया।
