  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅπου ἂν εἰσεπορεύετο εἰς κώμας ἢ ⸂εἰς πόλεις ἢ εἰς⸃ ἀγροὺς ἐν ταῖς ἀγοραῖς ⸀ἐτίθεσαν τοὺς ἀσθενοῦντας, καὶ παρεκάλουν αὐτὸν ἵνα κἂν τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ ἅψωνται· καὶ ὅσοι ἂν ⸀ἥψαντο αὐτοῦ ἐσῴζοντο.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/056.yaml
  text: And wherever he entered villages or cities or countryside[a], they were laying the sick in the marketplaces and begged him that they might even touch the fringe of his garment[c][b]; and as many as touched it were being healed.
translation:
  language: hi
  text: और वह जहाँ कहीं गाँवों, नगरों या देहातों में जाता, लोग बीमारों को बाज़ारों में लिटा देते और उससे विनती करते थे कि वे उसके वस्त्र की झालर को ही छू लें[a]; और जितनों ने उसे छुआ, वे स्वस्थ हो जाते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके वस्त्र के किनारे को’ अथवा ‘उसके वस्त्र की लटकन को’। यूनानी शब्द वस्त्र के किनारे या झालर को सूचित कर सकता है और यहूदी वस्त्र की लटकनों की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में ‘बचाए जाते थे’; इस प्रसंग में इसका अर्थ बीमारी से स्वस्थ किया जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅπου ἂν εἰσεπορεύετο
  choice: जहाँ कहीं ... जाता
  rationale: ὅπου ἄν का अनिश्चित और सामान्यीकृत भाव तथा अपूर्णकाल εἰσεπορεύετο की बार-बार होने वाली क्रिया—दोनों इस स्वाभाविक हिन्दी रचना में व्यक्त होते हैं।
- source_word: κώμας ἢ εἰς πόλεις ἢ εἰς ἀγρούς
  choice: गाँवों, नगरों या देहातों में
  rationale: यह क्रम गाँव, नगर और ग्रामीण इलाकों को दर्शाता है; यहाँ ἀγρούς को अलग-अलग खेतों के बजाय व्यापक ग्रामीण क्षेत्र के अर्थ में लिया गया है।
- source_word: ἐν ταῖς ἀγοραῖς
  choice: बाज़ारों में
  rationale: ἀγορά सार्वजनिक बाज़ार या बाज़ार-चौक को सूचित कर सकता है। ‘बाज़ारों में’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: ἐτίθεσαν τοὺς ἀσθενοῦντας
  choice: लोग बीमारों को ... लिटा देते
  rationale: अपूर्णकाल बार-बार होने वाली प्रथा बताता है। बीमारों के संदर्भ में ‘लिटा देते’ केवल ‘रखते’ से अधिक स्वाभाविक है; यूनानी का अव्यक्त कर्ता हिन्दी में ‘लोग’ से स्पष्ट किया गया है।
- source_word: παρεκάλουν αὐτόν
  choice: उससे विनती करते थे
  rationale: παρακαλέω यहाँ आग्रहपूर्ण निवेदन को व्यक्त करता है; ‘विनती’ उसकी गंभीरता को बनाए रखता है।
- source_word: ἵνα κἂν ... ἅψωνται
  choice: कि वे ... को ही छू लें
  rationale: κἄν न्यूनतम अपेक्षा—कम-से-कम इतना कर पाने—का भाव देता है। हिन्दी का ‘ही’ इसे सहज रूप से व्यक्त करता है।
- source_word: τοῦ κρασπέδου τοῦ ἱματίου αὐτοῦ
  choice: उसके वस्त्र की झालर
  rationale: κράσπεδον वस्त्र के किनारे, पल्ले या लटकती झालर को सूचित कर सकता है। ‘झालर’ ठोस चित्र बनाए रखते हुए यहूदी वस्त्र की लटकन की संभावित पृष्ठभूमि को भी खुला छोड़ता है।
- source_word: ὅσοι ἂν ἥψαντο αὐτοῦ
  choice: जितनों ने उसे छुआ
  rationale: यूनानी αὐτοῦ का प्रत्यक्ष व्याकरणिक संदर्भ ‘उसे’ है। पहले वाक्यांश से स्पष्ट है कि यह स्पर्श उसके वस्त्र की झालर के माध्यम से भी हो सकता था; अनुवाद इस संबंध को अनावश्यक रूप से ‘उसे’ से ‘उसे/उस वस्त्र को’ नहीं बदलता।
- source_word: ἐσῴζοντο
  choice: स्वस्थ हो जाते थे
  rationale: σῴζω का व्यापक अर्थ बचाना, सुरक्षित करना या चंगा करना हो सकता है। यहाँ बीमारों का तत्काल संदर्भ शारीरिक स्वास्थ्य-लाभ को प्रमुख बनाता है; अपूर्णकाल की पुनरावृत्ति ‘हो जाते थे’ में बनी रहती है।
theological_decisions:
- issue: ἐσῴζοντο में ‘बचाए जाने’ और ‘चंगे होने’ का अर्थ-संबंध
  choice: स्वस्थ हो जाते थे
  alternative: बचाए जाते थे / चंगे हो जाते थे
  rationale: संदर्भ प्रत्यक्ष रूप से बीमारों के शारीरिक स्वास्थ्य-लाभ का है, इसलिए मुख्य पाठ में सहज अर्थ दिया गया है। फिर भी पादटिप्पणी मूल क्रिया के व्यापक ‘बचाना’ अर्थ को सुरक्षित रखती है और उसके संभावित धार्मिक अर्थ को न तो थोपती है, न छिपाती है।
- issue: ἥψαντο αὐτοῦ का संदर्भ
  choice: उसे छुआ
  alternative: उसकी झालर को छुआ / उसके वस्त्र को छुआ
  rationale: यूनानी पाठ का सर्वनाम पुल्लिंग एकवचन में ‘उसका/उसे’ है। निकटवर्ती संदर्भ वस्त्र की झालर का स्पर्श बताता है, पर मुख्य पाठ में सर्वनाम को वस्त्र में बदल देना मूल की व्याकरणिक अभिव्यक्ति को संकरा कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वर्णनात्मक ढंग अपनाया गया है। ‘लोग’ अव्यक्त बहुवचन कर्ता को स्वाभाविक हिन्दी में स्पष्ट करता है। पुनरावृत्त क्रियाओं के लिए ‘जाता’, ‘लिटा देते’, ‘विनती करते थे’ और ‘हो जाते थे’ रखा गया है।
