  text: Καὶ ἤδη ὥρας πολλῆς γενομένης προσελθόντες αὐτῷ οἱ μαθηταὶ αὐτοῦ ⸀ἔλεγον ὅτι Ἔρημός ἐστιν ὁ τόπος, καὶ ἤδη ὥρα πολλή·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/035.yaml
  text: And when it was already very late[a], his disciples came to him and were saying, “This place is deserted[b], and it is already very late.”
translation:
  language: hi
  text: जब पहले ही बहुत देर हो चुकी थी[a], तब उसके शिष्य उसके पास आए और कहने लगे, “यह जगह निर्जन है, और अब बहुत देर हो चुकी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जब बहुत देर का समय हो चुका था।”
    reason: मूल यूनानी का जनिटिव एब्सोल्यूट पदबंध समय के बहुत बीत जाने को व्यक्त करता है; ‘पहले ही’ ἤδη का अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: ἤδη
  choice: अब / हो चुकी थी
  rationale: यह समय के पहले ही काफी आगे बढ़ जाने को दिखाता है। पहले वाक्य में हिन्दी की स्वाभाविक पूर्णकालिक रचना ‘हो चुकी थी’ और सीधे कथन में ‘अब’ इसी भाव को स्पष्ट करते हैं।
- source_word: ὥρας πολλῆς γενομένης
  choice: जब बहुत देर हो चुकी थी
  rationale: यह संबंधवाचक स्वतंत्र पदबंध दिन का काफी देर हो जाना व्यक्त करता है। चुना हुआ अनुवाद मूल अर्थ को स्वाभाविक आधुनिक हिन्दी में देता है।
- source_word: προσελθόντες αὐτῷ
  choice: उसके पास आए
  rationale: यह यीशु के निकट आने को सहज और सीधे ढंग से व्यक्त करता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके शिष्य
  rationale: यह स्वामित्व-संबंध को संक्षिप्त और मानक हिन्दी में व्यक्त करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण भूतकाल की आरंभिक अथवा जारी क्रिया का भाव रखता है, पर अनावश्यक रूप से बार-बार कहने का अर्थ नहीं जोड़ता।
- source_word: Ἔρημός ἐστιν ὁ τόπος
  choice: यह जगह सुनसान है
  rationale: ἔρημος यहाँ निर्जन या आबादी से दूर स्थान बताता है। ‘सुनसान’ आधुनिक हिन्दी में स्वाभाविक है और भावनात्मक वीरानी का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: καὶ ἤδη ὥρα πολλή
  choice: और अब बहुत देर हो चुकी है
  rationale: सीधे कथन में समय काफी बीत जाने पर बल को स्पष्ट और मुहावरेदार हिन्दी में बनाए रखता है।
