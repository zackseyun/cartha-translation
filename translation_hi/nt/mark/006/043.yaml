translation:
  language: hi
  text: और उन्होंने टूटे हुए टुकड़ों से भरी बारह टोकरियाँ[a] और मछलियों में से भी कुछ बटोर लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘टूटे हुए टुकड़ों की बारह भरी टोकरियाँ।’ यूनानी पदबंध में ‘टूटे हुए टुकड़े,’ ‘बारह टोकरियाँ’ और ‘भराव/पूरी मात्राएँ’—इन तीनों भावों का मेल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦραν
  choice: बटोरे
  rationale: यहाँ αἴρω का अर्थ भोजन के बाद बचे हुए अंशों को इकट्ठा करना है। ‘बटोरे’ इस ठोस क्रिया को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: κλάσματα
  choice: टूटे हुए टुकड़े
  rationale: κλάσματα उन टुकड़ों को दर्शाता है जो तोड़े गए थे; ‘टूटे हुए टुकड़े’ इस भाव को स्पष्ट रखता है और केवल सामान्य ‘टुकड़े’ कहने से अधिक सटीक है।
- source_word: δώδεκα κοφίνων πληρώματα
  choice: जिनसे बारह टोकरियाँ भर गईं
  rationale: यूनानी पदबंध में ‘बारह टोकरियाँ’ और ‘भराव/पूरी मात्रा’ का मेल है। यह हिन्दी रूप मात्रा और टोकरियों के भर जाने—दोनों को सहज ढंग से व्यक्त करता है।
- source_word: κόφινος
  choice: टोकरियाँ
  rationale: κόφινος एक टोकरी को दर्शाता है। आकार के बारे में स्रोत से अधिक निश्चित विवरण जोड़े बिना ‘टोकरी’ इसका सामान्य और स्पष्ट हिन्दी पर्याय है।
- source_word: πληρώματα
  choice: भर गईं
  rationale: πλήρωμα यहाँ भराव या पूरी भरी मात्रा का बोध कराता है। क्रियात्मक हिन्दी अभिव्यक्ति ‘भर गईं’ इस अर्थ को बिना अस्वाभाविक शाब्दिकता के सुरक्षित रखती है।
- source_word: ἀπὸ τῶν ἰχθύων
  choice: मछलियों में से भी कुछ
  rationale: 'ἀπό यहाँ स्रोत अथवा अंश का भाव रखता है: मछलियों में से भी बचा हुआ भाग बटोरा गया। हिन्दी में ‘में से भी कुछ’ इस अंशात्मक अर्थ को स्वाभाविक रूप से स्पष्ट करता है।'
