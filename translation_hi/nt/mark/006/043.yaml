  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बटोरे’ ग्रामीण या अत्यधिक औपचारिक हुए बिना बचे हुए अंश इकट्ठा करने की क्रिया बताता है। वाक्य-विन्यास यूनानी की सघन संरचना को स्वाभाविक हिन्दी में खोलता है, जबकि पादटिप्पणी उसका अधिक निकट संरचनात्मक विकल्प देती है।
