base_translation:
  language: en
  yaml_path: translation/nt/mark/006/024.yaml
  text: And after going out, she said to her mother, “What should I ask for?” And she said, “The head of John the Baptizer.”
translation:
  language: hi
  text: और वह बाहर जाकर अपनी माँ से बोली, “मैं क्या माँगूँ?” उसने कहा, “बपतिस्मा देनेवाले यूहन्ना का सिर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθοῦσα
  choice: बाहर जाकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले की क्रिया दिखाता है; ‘बाहर जाकर’ इस क्रम को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: Τί αἰτήσωμαι
  choice: मैं क्या माँगूँ?
  rationale: विचारात्मक अओरिस्ट मिडिल सब्जंक्टिव इस प्रश्न को व्यक्त करता है कि उसे क्या माँगना चाहिए; हिन्दी का ‘मैं क्या माँगूँ?’ वही विचारात्मक भाव सहज रूप से देता है।
- source_word: μητρὶ αὐτῆς
  choice: अपनी माँ से
  rationale: कर्ता स्त्री है और माँ उसी की है; हिन्दी में सहसंदर्भी संबंध के लिए ‘अपनी’ स्वाभाविक और स्पष्ट है।
- source_word: Τὴν κεφαλήν
  choice: सिर
  rationale: माँगी गई वस्तु का प्रत्यक्ष और कठोर उल्लेख मूल के अनुसार बिना शिष्टोक्ति के सुरक्षित रखा गया है।
- source_word: Ἰωάννου τοῦ βαπτίζοντος
  choice: बपतिस्मा देनेवाले यूहन्ना का
  rationale: वर्तमान कृदंत यूहन्ना को उसकी विशिष्ट गतिविधि से पहचानता है। ‘बपतिस्मा देनेवाला’ अर्थ को सीधे व्यक्त करता है और किसी आधुनिक सम्प्रदाय का संकेत नहीं देता।
theological_decisions:
- issue: यूहन्ना के विशेषण βαπτίζων का अनुवाद
  choice: बपतिस्मा देनेवाला
  alternative: बपतिस्मा देनेवाला यूहन्ना / यूहन्ना बपतिस्मा देनेवाला
  rationale: कृदंत को अर्थानुसार गतिविधि-सूचक पद के रूप में रखा गया है, न कि ऐसे आधुनिक सम्प्रदाय-सूचक नाम के रूप में जो मूल में नहीं है। हिन्दी वाक्य-विन्यास में संबंधकारक के कारण ‘बपतिस्मा देनेवाले यूहन्ना का’ स्वाभाविक रूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक संवाद के अनुरूप। दो स्त्री पात्रों के क्रमिक कथनों में मूल की पुनरावृत्ति बनाए रखी गई है।
