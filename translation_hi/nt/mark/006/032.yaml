lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह मरकुस की सीधी कथात्मक कड़ी को बनाए रखता है और ‘तब’ या ‘इसलिए’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἀπῆλθον
  choice: चले गए
  rationale: ἀπέρχομαι का यह रूप पहले स्थान से प्रस्थान व्यक्त करता है; ‘चले गए’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: ἐν τῷ πλοίῳ
  choice: नाव में बैठकर
  rationale: यूनानी वाक्यांश का शाब्दिक अर्थ ‘नाव में’ है। हिन्दी में गमन के साथ ‘नाव में बैठकर’ अधिक स्वाभाविक है और यात्रा के साधन को स्पष्ट करता है।
- source_word: εἰς ἔρημον τόπον
  choice: एक सुनसान जगह की ओर
  rationale: ἔρημος τόπος आबादी से दूर, निर्जन या एकांत स्थान को दर्शाता है। ‘सुनसान जगह’ साधारण आधुनिक हिन्दी में स्वाभाविक है और किसी विशिष्ट रेगिस्तानी भूगोल का अनावश्यक संकेत नहीं देता।
- source_word: κατ’ ἰδίαν
  choice: अलग से
  rationale: यह मुहावरा दूसरों से अलग या निजी रूप से होने का भाव देता है। ‘अलग से’ उस पृथकता को बनाए रखता है, जबकि बहुवचन कर्ता के कारण इसका अर्थ अकेले-अकेले जाना नहीं है।
