  text: Καὶ ἐξῆλθεν ἐκεῖθεν, καὶ ⸀ἔρχεται εἰς τὴν πατρίδα αὐτοῦ, καὶ ἀκολουθοῦσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/001.yaml
  text: And he went out from there and came to his hometown[a], and his disciples followed him.
translation:
  language: hi
  text: यीशु वहाँ से निकलकर अपने नगर में आए, और उनके चेले उनके पीछे-पीछे चले।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने गृहस्थान में आते हैं, और उनके चेले उनके पीछे-पीछे चलते हैं।” यूनानी में “आते हैं” और “चलते हैं” ऐतिहासिक वर्तमान हैं, जो कथन को सजीव बनाते हैं। “अपने नगर” का अनुवाद “अपने गृहस्थान” भी हो सकता है।
    reason: कालगत और शब्दार्थगत विकल्प
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: निकलकर
  rationale: क्रिया ἐξέρχομαι पिछले स्थान से बाहर जाने या प्रस्थान करने को व्यक्त करती है। ‘वहाँ से निकलकर’ यूनानी क्रियात्मक चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह स्थानवाचक क्रियाविशेषण प्रस्थान-बिंदु बताता है; ‘वहाँ से’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: ἔρχεται
  choice: आए
  rationale: यूनानी में जीवंत कथन के लिए ऐतिहासिक वर्तमान है; हिन्दी कथा-शैली में आदरसूचक सामान्य भूतकाल ‘आए’ अधिक स्वाभाविक है और गंतव्य की ओर गति को व्यक्त करता है।
- source_word: πατρίδα
  choice: अपने नगर
  rationale: इस संदर्भ में πατρίς यीशु के अपने गृहस्थान, अर्थात नासरत, की ओर संकेत करता है। ‘अपने नगर’ आधुनिक हिन्दी में स्वाभाविक है और इसे व्यापक अर्थ वाले ‘देश’ के रूप में लेने से बचाता है।
- source_word: ἀκολουθοῦσιν
  choice: उनके पीछे हो लिए
  rationale: ἀκολουθέω का मूल भाव किसी के पीछे चलना है और सुसमाचारों में यह चेलापन भी संकेतित कर सकता है। ‘पीछे हो लिए’ यहाँ यात्रा और शिष्य-संबंध दोनों के लिए स्वाभाविक है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: μαθηταί उन लोगों को दर्शाता है जो गुरु से सीखते और उसका अनुसरण करते हैं। ‘चेले’ साधारण आधुनिक हिन्दी में परिचित बाइबलीय शब्द है।
theological_decisions:
- issue: ἔρχεται और ἀκολουθοῦσιν के ऐतिहासिक वर्तमान का अनुवाद
  choice: 'हिन्दी कथन में भूतकाल: ‘आए’ और ‘पीछे हो लिए’'
  alternative: 'ऐतिहासिक वर्तमान बनाए रखना: ‘आते हैं ... पीछे हो लेते हैं’'
  rationale: यह सैद्धांतिक नहीं, कथाशैली का निर्णय है। यूनानी का ऐतिहासिक वर्तमान दृश्य को जीवंत बनाता है, पर अकेले इस पद में हिन्दी वर्तमान काल कालक्रम को अस्वाभाविक या अस्पष्ट कर सकता है; इसलिए मुख्य पाठ में सहज भूतकाल रखा गया और विकल्प पादटिप्पणी में दिया गया।
- issue: πατρίς का भौगोलिक विस्तार
  choice: अपने नगर
  alternative: अपना गृहप्रदेश / अपनी मातृभूमि
  rationale: मरकुस 6 के प्रसंग में नासरत और वहाँ के स्थानीय लोगों की प्रतिक्रिया सामने है। फिर भी यूनानी शब्द नगर से व्यापक गृहक्षेत्र भी दर्शा सकता है, इसलिए इस संभाव्यता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘यीशु’ नाम स्पष्टता के लिए प्रयुक्त है, क्योंकि यूनानी सर्वनाम का संदर्भ पिछले प्रसंग से यीशु हैं। आदरसूचक बहुवचन (‘आए’, ‘उनके’) सामान्य हिन्दी बाइबल-प्रयोग और वर्तमान शिष्ट भाषा के अनुरूप है।
