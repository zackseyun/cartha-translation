id: MRK.6.2
reference: Mark 6:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γενομένου σαββάτου ἤρξατο ⸂διδάσκειν ἐν τῇ συναγωγῇ⸃· καὶ ⸀οἱ πολλοὶ ἀκούοντες ἐξεπλήσσοντο λέγοντες· Πόθεν τούτῳ ταῦτα, καὶ τίς ἡ σοφία ἡ δοθεῖσα ⸀τούτῳ, καὶ ⸀αἱ δυνάμεις τοιαῦται διὰ τῶν χειρῶν αὐτοῦ ⸀γινόμεναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/002.yaml
  text: And when the Sabbath came[a], he began to teach in the synagogue. And many who heard him were astonished, saying, “Where did this man get these things? And what is this wisdom given to him, and such mighty works happening through his hands?”
translation:
  language: hi
  text: जब सब्त का दिन आया, तो वह आराधनालय में शिक्षा देने लगा। उसकी बातें सुनकर बहुत-से लोग चकित हो गए और कहने लगे, “इसे ये सब बातें कहाँ से मिलीं? यह कैसी बुद्धि है जो इसे दी गई है, और इसके हाथों से ऐसे सामर्थ्य के काम[a] कैसे हो रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऐसे आश्चर्यकर्म” अथवा “सामर्थ्य के ऐसे कार्य।” यूनानी बहुवचन δυνάμεις चमत्कारी कामों या सामर्थ्य के प्रदर्शनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γενομένου σαββάτου
  choice: जब सब्त का दिन आया
  rationale: यह संबंधकारक निरपेक्ष रचना समय-संबंधी परिस्थिति बताती है। हिंदी में यह स्वाभाविक है और यूनानी के ‘आने/होने’ के भाव को बनाए रखती है।
- source_word: ἤρξατο διδάσκειν
  choice: शिक्षा देने लगा
  rationale: ἄρχομαι के साथ अनंत क्रिया आरंभ का भाव देती है; ‘शिक्षा देने लगा’ आधुनिक कथात्मक हिंदी में सहज है।
- source_word: συναγωγῇ
  choice: आराधनालय
  rationale: यहाँ यहूदी सभा-स्थान अभिप्रेत है। ‘आराधनालय’ प्रचलित, बोधगम्य और प्रसंगानुकूल हिंदी पद है।
- source_word: οἱ πολλοὶ ἀκούοντες
  choice: उसकी बातें सुनकर बहुत-से लोग
  rationale: यह पद उन अनेक श्रोताओं को दर्शाता है जो यीशु को सुन रहे थे। ‘उसकी बातें’ संदर्भगत कर्म को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ἐξεπλήσσοντο
  choice: चकित हो गए
  rationale: क्रिया तीव्र विस्मय की प्रतिक्रिया व्यक्त करती है। ‘चकित हो गए’ सामान्य आधुनिक हिंदी में स्पष्ट है और प्रतिक्रिया के कथात्मक स्वर को रखता है।
- source_word: Πόθεν τούτῳ ταῦτα
  choice: इसे ये सब बातें कहाँ से मिलीं?
  rationale: Πόθεν स्रोत पूछता है और τούτῳ में कुछ दूरी का भाव हो सकता है। ‘इसे’ उस संकेतवाचक दूरी को बिना अनावश्यक तिरस्कार जोड़े व्यक्त करता है।
- source_word: τίς ἡ σοφία ἡ δοθεῖσα τούτῳ
  choice: यह कैसी बुद्धि है जो इसे दी गई है
  rationale: यह प्रश्न बुद्धि के स्वरूप और आश्चर्यजनक गुण पर केंद्रित है। कर्मवाच्य ‘दी गई है’ मूल के δοθεῖσα को सुरक्षित रखता है और देने वाले को अनिर्दिष्ट रहने देता है।
- source_word: δυνάμεις
  choice: सामर्थ्य के काम
  rationale: बहुवचन δυνάμεις यहाँ असाधारण अथवा चमत्कारी कार्यों का संकेत देता है। ‘सामर्थ्य के काम’ मूल के शक्ति-संबंधी अर्थ को बनाए रखता है, जबकि अधिक व्याख्यात्मक ‘चमत्कार’ को पादटिप्पणी में विकल्प के रूप में देता है।
- source_word: διὰ τῶν χειρῶν αὐτοῦ γινόμεναι
  choice: इसके हाथों से ... हो रहे हैं
  rationale: διά के साथ संबंधकारक साधन का भाव देता है और ‘हाथों’ की यूनानी छवि को सुरक्षित रखता है। ‘हो रहे हैं’ γινόμεναι के घटित होने वाले भाव को दर्शाता है।
theological_decisions:
- issue: δυνάμεις का आशय
  choice: ‘सामर्थ्य के काम’ रखा गया, जिससे शक्ति के प्रकटीकरण और असाधारण कार्य—दोनों भाव बने रहें।
  alternative: ‘चमत्कार’ या ‘आश्चर्यकर्म’
  rationale: मरकुस में बहुवचन प्रायः चमत्कारी कार्यों को दर्शाता है, पर मूल शब्द स्वयं ‘सामर्थ्य’ का अर्थ भी वहन करता है। मुख्य पाठ व्यापक शब्दार्थ रखता है और पादटिप्पणी स्पष्ट विकल्प देती है।
- issue: τούτῳ का सामाजिक स्वर
  choice: ‘इसे’
  alternative: ‘इस मनुष्य को’ या केवल ‘उसे’
  rationale: ‘इसे’ संकेतवाचक दूरी को बनाए रखता है, पर भीड़ के स्वर को निश्चित रूप से अपमानजनक ठहराकर अस्पष्टता समाप्त नहीं करता।
- issue: बुद्धि दिए जाने का कर्ता
  choice: कर्मवाच्य ‘इसे दी गई है’
  alternative: ‘परमेश्वर ने इसे दी है’
  rationale: यूनानी पाठ देने वाले का नाम नहीं लेता। इसलिए अनिर्दिष्ट कर्मवाच्य रखा गया है और कोई धर्मवैज्ञानिक निष्कर्ष पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथन में ‘तो’ और ‘उसकी बातें सुनकर’ हिंदी प्रवाह के लिए हैं। प्रश्नों की आश्चर्यपूर्ण लय बनाए रखते हुए यूनानी के कुछ असंपूर्ण समन्वित वाक्य-विन्यास को स्वाभाविक हिंदी में व्यवस्थित किया गया है।
