  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἤκουσεν ὁ βασιλεὺς Ἡρῴδης, φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ, καὶ ⸀ἔλεγον ὅτι Ἰωάννης ὁ βαπτίζων ⸂ἐγήγερται ἐκ νεκρῶν⸃, καὶ διὰ τοῦτο ἐνεργοῦσιν αἱ δυνάμεις ἐν αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/014.yaml
  text: And King Herod heard of it[a], for his name had become well known, and people were saying, “John the Baptizer has been raised from the dead[c][b], and because of this these powers are at work in him.”
translation:
  language: hi
  text: राजा हेरोदेस ने यह सुना, क्योंकि यीशु का नाम प्रसिद्ध हो गया था। लोग कह रहे थे, “बपतिस्मा देनेवाला यूहन्ना[a] मरे हुओं में से जिलाया गया है[b], और इसी कारण शक्तियाँ[c] उसमें काम कर रही हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या पारंपरिक रूप में, “यूहन्ना बपतिस्मा देनेवाला।”
    reason: lexical_alternative
  - marker: b
    text: 'या “मरे हुओं में से जी उठा है।” यूनानी क्रिया कर्मवाच्य है: “जिलाया गया है।”'
    reason: alternative_reading
  - marker: c
    text: या “चमत्कारी शक्तियाँ” अथवा “सामर्थ्य के काम।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ βασιλεὺς Ἡρῴδης
  choice: राजा हेरोदेस
  rationale: βασιλεύς का सीधा अर्थ ‘राजा’ है; हिन्दी में उपाधि को नाम से पहले रखना स्वाभाविक है।
- source_word: ἤκουσεν
  choice: यह सुना
  rationale: क्रिया का कर्म यूनानी में निहित है और पिछले प्रसंग में यीशु के कार्यों तथा प्रसिद्धि की ओर संकेत करता है; ‘यह सुना’ हिन्दी में स्वाभाविक रूप से उस संदर्भ को ग्रहण करता है।
- source_word: φανερὸν γὰρ ἐγένετο τὸ ὄνομα αὐτοῦ
  choice: क्योंकि यीशु का नाम प्रसिद्ध हो गया था
  rationale: शाब्दिक ‘उसका नाम’ हिन्दी में निकटवर्ती ‘हेरोदेस’ की ओर भ्रामक संकेत कर सकता है। पिछले प्रसंग के स्पष्ट संदर्भ के अनुसार ‘यीशु’ कहना अर्थ को स्वाभाविक और स्पष्ट बनाता है; ‘नाम प्रसिद्ध होना’ यूनानी मुहावरे का सहज हिन्दी रूप है।
- source_word: ἔλεγον
  choice: लोग कह रहे थे
  rationale: बहुवचन क्रिया का कर्ता अनिश्चित है; ‘लोग’ हिन्दी में इस अनिश्चित बहुवचन को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Ἰωάννης ὁ βαπτίζων
  choice: बपतिस्मा देनेवाला यूहन्ना
  rationale: वर्तमान कृदंत का क्रियात्मक अर्थ सीधे व्यक्त होता है और पारंपरिक पदवी मात्र पर निर्भर नहीं रहता।
- source_word: ἐγήγερται ἐκ νεκρῶν
  choice: मरे हुओं में से जिलाया गया है
  rationale: पूर्णकालिक कर्मवाच्य रूप को हिन्दी में कर्मवाच्य रखता है और पुनरुत्थान के परिणाम की वर्तमान स्थिति भी व्यक्त करता है।
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह आगे कही गई बात का कारण बताता है और यूनानी संबंध को संक्षेप तथा स्पष्टता से रखता है।
- source_word: ἐνεργοῦσιν
  choice: काम कर रही हैं
  rationale: वर्तमान काल जारी सक्रियता बताता है; ‘काम कर रही हैं’ शक्तियों के विषय में स्वाभाविक हिन्दी है।
- source_word: αἱ δυνάμεις
  choice: ये शक्तियाँ
  rationale: बहुवचन संज्ञा को सीधे सुरक्षित रखता है और उसे पहले से केवल ‘चमत्कार’ या ‘सामर्थ्य के काम’ मानकर सीमित नहीं करता।
- source_word: ἐν αὐτῷ
  choice: उसमें
  rationale: ἐν का निकटतम अर्थ ‘में’ है; ‘उसके द्वारा’ कहने से साधनात्मक अर्थ अधिक स्पष्ट हो जाता, जो मूल में अनिवार्य नहीं है।
theological_decisions:
- issue: पुनरुत्थान के संदर्भ में ἐγήγερται का कर्मवाच्य
  choice: जिलाया गया है
  alternative: जी उठा है
  rationale: यूनानी क्रिया स्पष्ट रूप से कर्मवाच्य है। ‘जिलाया गया है’ उस रूप और निहित बाहरी कर्ता की संभावना को सुरक्षित रखता है, जबकि ‘जी उठा है’ सक्रिय/अकर्मक भाव देता।
- issue: Ἰωάννης ὁ βαπτίζων का अनुवाद
  choice: बपतिस्मा देनेवाला यूहन्ना
  alternative: यूहन्ना बपतिस्मा देनेवाला
  rationale: कृदंत के क्रियात्मक बल को स्पष्ट रखा गया है; वैकल्पिक पारंपरिक हिन्दी रूप भी अर्थतः संभव है।
- issue: αἱ δυνάμεις का आशय
  choice: शक्तियाँ
  alternative: चमत्कारी शक्तियाँ / सामर्थ्य के काम
  rationale: δύναμις यहाँ शक्ति अथवा चमत्कारपूर्ण कार्य का बोध करा सकता है। मुख्य पाठ में व्यापक शब्द रखकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य-क्रम हिन्दी के अनुरूप है, पर कर्मवाच्य पुनरुत्थान, बहुवचन ‘शक्तियाँ’ और ‘उसमें’ जैसे मूल-पाठ के महत्वपूर्ण रूप सुरक्षित रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के तुरंत बाद दिए गए हैं।
