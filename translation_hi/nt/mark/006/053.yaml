  yaml_path: translation/nt/mark/006/053.yaml
  text: And after crossing over to the land[b][a], they came to Gennesaret and moored there.
translation:
  language: hi
  text: और पार करके वे गन्नेसरत की भूमि[a] पर पहुँचे और वहाँ नाव किनारे लगाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गन्नेसरत के तट पर पहुँचे”; यूनानी में शाब्दिक रूप से “भूमि पर” है, जो नाव से जमीन पर पहुँचने का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वहाँ नाव बाँधी,” “वहाँ लंगर डाला,” अथवा “वहाँ उतरे”; यूनानी क्रिया विशेष रूप से नाव को किनारे लगाकर ठहराने या बाँधने के अर्थ में है।
    reason: lexical_alternative
