- source_word: Καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: διαπεράσαντες
  choice: पार करके
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले पूरी हुई क्रिया बताता है; ‘पार करके’ समय-क्रम को सहज और संक्षिप्त रूप में व्यक्त करता है।
- source_word: ἐπὶ τὴν γῆν ... ἦλθον εἰς Γεννησαρὲτ
  choice: गन्नेसरत के भूभाग में आए
  rationale: γῆ का मूल अर्थ ‘भूमि/भूभाग’ है और नौका-प्रसंग में तट पर पहुँचने का संकेत देता है। यह वाक्यांश गन्तव्य को स्पष्ट रखते हुए यूनानी अभिव्यक्ति का भूमि-संबंधी अर्थ बचाता है।
- source_word: Γεννησαρὲτ
  choice: गन्नेसरत
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: προσωρμίσθησαν
  choice: नाव किनारे लगा दी
  rationale: क्रिया का विशिष्ट नौकायन-संबंधी अर्थ नाव को तट या ठहरने के स्थान पर लगाने का है। हिन्दी में कर्ता-सापेक्ष सक्रिय रूप अधिक स्वाभाविक है; ‘नाव’ प्रसंग से स्पष्ट पूरक के रूप में जोड़ी गई है।
