  text: καὶ ⸀ἐθαύμαζεν διὰ τὴν ἀπιστίαν αὐτῶν. Καὶ περιῆγεν τὰς κώμας κύκλῳ διδάσκων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/006.yaml
  text: And he was amazed because of their unbelief[a]. And he went around among the villages[b], teaching.
translation:
  language: hi
  text: और वह उनके अविश्वास पर चकित था। और वह आसपास के गाँवों में घूम-घूमकर शिक्षा देता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐθαύμαζεν
  choice: चकित था
  rationale: अपूर्ण भूतकाल चलती या बनी हुई प्रतिक्रिया को व्यक्त करता है; ‘चकित था’ आधुनिक हिन्दी में स्वाभाविक ढंग से θαυμάζω की शक्ति बनाए रखता है।
- source_word: διὰ τὴν ἀπιστίαν αὐτῶν
  choice: उनके अविश्वास पर
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है। हिन्दी में ‘अविश्वास पर चकित था’ कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है और ἀπιστία को केवल कमजोर विश्वास बनाकर नरम नहीं करता।
- source_word: περιῆγεν
  choice: घूम-घूमकर ... देता रहा
  rationale: अपूर्ण भूतकाल एक स्थान से दूसरे स्थान तक निरंतर जाने की क्रिया बताता है; ‘घूम-घूमकर’ और ‘देता रहा’ इस पुनरावृत्त तथा जारी गतिविधि को सहज हिन्दी में व्यक्त करते हैं।
- source_word: τὰς κώμας
  choice: गाँवों
  rationale: κώμη ग्रामीण बस्ती या गाँव को सूचित करता है; ‘गाँव’ इसका स्पष्ट और सामान्य हिन्दी समतुल्य है।
- source_word: κύκλῳ
  choice: आसपास के
  rationale: κύκλῳ आसपास के क्षेत्र या चक्कर लगाकर भ्रमण का भाव देता है। ‘आसपास के गाँवों में घूम-घूमकर’ दोनों अर्थ-छायाओं को स्वाभाविक रूप से साथ रखता है।
- source_word: διδάσκων
  choice: शिक्षा देता रहा
  rationale: वर्तमान कृदंत मुख्य क्रिया के साथ चल रही गतिविधि बताता है। ‘शिक्षा देता रहा’ यात्रा के दौरान निरंतर शिक्षण को स्पष्ट करता है।
theological_decisions:
- issue: यीशु के अविश्वास पर चकित होने के कथन को बिना धर्मवैज्ञानिक तनाव मिटाए प्रस्तुत करना
  choice: वह उनके अविश्वास पर चकित था
  alternative: वह उनके अविश्वास के कारण अचम्भा करता रहा
  rationale: पाठ स्पष्ट रूप से यीशु की चकित प्रतिक्रिया बताता है। अनुवाद न इसे नरम करता है, न उसके ज्ञान या स्वभाव के विषय में पाठ से बाहर कोई व्याख्या जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक। ‘चकित था’ तथा ‘घूम-घूमकर शिक्षा देता रहा’ अपूर्ण भूतकाल और समकालिक कृदंत के पक्ष को स्वाभाविक हिन्दी में व्यक्त करते हैं।
