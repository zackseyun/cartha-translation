  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘तब’ कथानक के अगले चरण को सहज बनाता है; ‘लोगों’ और बाद के ‘वे’ मूल यूनानी के संज्ञा-रूप विशेषण तथा निहित कर्ता को हिन्दी में स्पष्ट करते हैं।
