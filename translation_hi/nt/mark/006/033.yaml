  text: καὶ εἶδον αὐτοὺς ὑπάγοντας καὶ ⸀ἐπέγνωσαν πολλοί, καὶ πεζῇ ἀπὸ πασῶν τῶν πόλεων συνέδραμον ἐκεῖ καὶ προῆλθον ⸀αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/033.yaml
  text: And many saw them going and recognized them[b][a], and on foot from all the towns they ran there together and got there ahead of them.
translation:
  language: hi
  text: बहुत-से लोगों ने उन्हें जाते हुए देखा और पहचान लिया। तब वे सब नगरों[a] से पैदल[b] दौड़कर वहाँ एक साथ पहुँचे और उनसे पहले पहुँच गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सब शहरों से’; यूनानी शब्द संदर्भ के अनुसार नगर या शहर, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘ज़मीन के रास्ते’; यहाँ नाव से यात्रा के साथ अंतर दिखाया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶδον
  choice: देखा
  rationale: यह कथानक में सामान्य दृश्य-बोध को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὑπάγοντας
  choice: जाते हुए
  rationale: कृदन्त का चालू क्रिया-भाव बना रहता है और नाव से जाने की रीति को पिछले संदर्भ पर छोड़ दिया गया है।
- source_word: ἐπέγνωσαν
  choice: पहचान लिया
  rationale: इस संदर्भ में क्रिया का अर्थ उन्हें देखकर उनकी पहचान जान लेना है, न कि सामान्य रूप से नया ज्ञान पाना।
- source_word: πολλοί
  choice: बहुत-से लोगों
  rationale: मूल में विशेषण संज्ञा के रूप में प्रयुक्त है; हिन्दी में ‘लोगों’ जोड़ने से वाक्य स्वाभाविक और स्पष्ट बनता है।
- source_word: πεζῇ
  choice: पैदल
  rationale: यह नाव की यात्रा के विपरीत जमीन पर पैरों से जाने को संक्षेप और ठीक ढंग से व्यक्त करता है।
- source_word: ἀπὸ πασῶν τῶν πόλεων
  choice: सब नगरों से
  rationale: ‘सब’ πασῶν को सुरक्षित रखता है; πόλις के लिए ‘नगर’ ऐसा व्यापक और गरिमापूर्ण शब्द है जो छोटे या बड़े आबादी-केंद्र दोनों के संदर्भ में चल सकता है।
- source_word: συνέδραμον
  choice: दौड़कर वहाँ एक साथ पहुँचे
  rationale: यह संयुक्त रूप से दौड़ने और एक स्थान पर आ मिलने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: स्थान-सूचक क्रियाविशेषण का सीधा और मुहावरेदार अनुवाद है।
- source_word: προῆλθον αὐτούς
  choice: उनसे पहले पहुँच गए
  rationale: संदर्भ में इसका अर्थ यात्रा में आगे निकलकर पहले गंतव्य पर पहुँच जाना है।
