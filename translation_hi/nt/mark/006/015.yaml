source:
  edition: SBLGNT
  text: ἄλλοι ⸀δὲ ἔλεγον ὅτι Ἠλίας ἐστίν· ἄλλοι δὲ ἔλεγον ὅτι ⸀προφήτης ὡς εἷς τῶν προφητῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/015.yaml
  text: But others were saying[a], “He is Elijah,” and others were saying, “He is a prophet, like one of the prophets.”
translation:
  language: hi
  text: पर दूसरे लोग कह रहे थे, “यह एलिय्याह है,” और दूसरे कह रहे थे, “यह एक भविष्यद्वक्ता है, भविष्यद्वक्ताओं में से किसी एक के समान।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, इसकी संभावना कम है, “वह भविष्यद्वक्ता,” यदि इसे अंत समय में आने वाले किसी विशिष्ट व्यक्ति के अर्थ में लिया जाए। यहाँ यूनानी पाठ का अधिक स्वाभाविक अर्थ “एक भविष्यद्वक्ता” है, क्योंकि आगे कहा गया है, “भविष्यद्वक्ताओं में से किसी एक के समान।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἄλλοι δὲ
  choice: पर दूसरे लोग
  rationale: ἄλλοι अलग समूह को और δέ हल्के विरोध अथवा कथन की अगली कड़ी को दिखाता है; ‘पर दूसरे लोग’ आधुनिक हिन्दी में दोनों भाव स्वाभाविक रूप से रखता है।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती चर्चा का संकेत देता है; ‘कह रहे थे’ इस पक्ष को बिना अतिशयोक्ति के व्यक्त करता है।
- source_word: ὅτι Ἠλίας ἐστίν
  choice: “यह एलिय्याह है”
  rationale: कहने की क्रिया के बाद प्रत्यक्ष कथन हिन्दी में स्वाभाविक है। Ἠλίας के लिए प्रचलित बाइबलीय हिन्दी रूप ‘एलिय्याह’ रखा गया है।
- source_word: προφήτης
  choice: एक भविष्यद्वक्ता
  rationale: यहाँ संज्ञा के साथ निश्चित उपपद नहीं है और आगे की तुलना इसे सामान्य अर्थ में किसी भविष्यद्वक्ता के रूप में पहचानती है।
- source_word: ὡς εἷς τῶν προφητῶν
  choice: पुराने भविष्यद्वक्ताओं में से किसी एक के समान
  rationale: ὡς तुलना व्यक्त करता है और εἷς τῶν προφητῶν का अर्थ ‘भविष्यद्वक्ताओं में से एक’ है। ‘पुराने’ शब्द ऐतिहासिक भविष्यद्वक्ताओं का अभिप्राय स्वाभाविक हिन्दी में स्पष्ट करता है, यद्यपि यह यूनानी में अलग शब्द के रूप में उपस्थित नहीं है।
theological_decisions:
- issue: προφήτης का अर्थ सामान्य ‘एक भविष्यद्वक्ता’ है या विशिष्ट युगान्तकारी उपाधि ‘वह भविष्यद्वक्ता’
  choice: एक भविष्यद्वक्ता
  alternative: वह भविष्यद्वक्ता
  rationale: यूनानी में निश्चित उपपद का अभाव और तुरंत बाद आया वाक्यांश ‘भविष्यद्वक्ताओं में से किसी एक के समान’ सामान्य भविष्यद्वक्ता वाली पहचान का अधिक स्वाभाविक समर्थन करता है; फिर भी वैकल्पिक विशिष्ट-पद वाले पाठ की संभावना टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भविष्यद्वक्ता’ प्रचलित बाइबलीय शब्दावली है। ‘पुराने’ को तुलना का ऐतिहासिक संदर्भ स्पष्ट करने के लिए जोड़ा गया है।
