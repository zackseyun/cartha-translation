  text: καὶ ἀκούσαντες οἱ μαθηταὶ αὐτοῦ ἦλθον καὶ ἦραν τὸ πτῶμα αὐτοῦ καὶ ἔθηκαν αὐτὸ ἐν μνημείῳ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/029.yaml
  text: And when his disciples heard[a], they came and took up his body and laid it in a tomb.
translation:
  language: hi
  text: जब उसके चेलों ने यह सुना, तो वे आए और उसका शव उठा ले गए और उसे एक कब्र में रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσαντες
  choice: जब ... ने यह सुना
  rationale: संदर्भ में एओरिस्ट कृदंत घटनाओं का समय और क्रम बताता है। हिन्दी में “जब ... ने यह सुना” स्वाभाविक है; “यह” यूहन्ना की मृत्यु के समाचार की ओर संकेत करता है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उसके चेले
  rationale: μαθηταί का प्रचलित और संबंधसूचक हिन्दी रूप “चेले” है। निकटवर्ती संदर्भ में “उसके” का संकेत बपतिस्मा देने वाले यूहन्ना की ओर है।
- source_word: ἦλθον
  choice: वे आए
  rationale: ἔρχομαι के सामान्य कथात्मक अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἦραν
  choice: उठा ले गए
  rationale: αἴρω यहाँ शव को उठाकर वहाँ से ले जाने की क्रिया व्यक्त करता है; संयुक्त क्रिया दोनों पहलुओं को स्पष्ट और सहज हिन्दी में रखती है।
- source_word: πτῶμα
  choice: शव
  rationale: πτῶμα विशेष रूप से मृत देह को दर्शाता है। “शव” आधुनिक हिन्दी में सटीक, संक्षिप्त और गरिमापूर्ण है, इसलिए अस्पष्ट “देह” की आवश्यकता नहीं है।
- source_word: ἔθηκαν
  choice: रख दिया
  rationale: τίθημι का मूल अर्थ “रखना” है। दफनाने के प्रसंग में “रख दिया” स्वाभाविक हिन्दी है और मूल से अधिक विधिवत दफनाने की धारणा नहीं जोड़ता।
- source_word: ἐν μνημείῳ
  choice: एक कब्र में
  rationale: μνημεῖον यहाँ शव रखने के दफन-स्थान को दर्शाता है। “कब्र” साधारण आधुनिक हिन्दी में सहज और इस संदर्भ के अनुकूल है।
theological_decisions:
- issue: “उसके चेलों” में सर्वनाम का संदर्भ
  choice: बपतिस्मा देने वाले यूहन्ना के चेले
  alternative: यीशु के चेले
  rationale: तत्काल पूर्ववर्ती वृत्तांत यूहन्ना की हत्या का है, और इसी पद में उसके शव को लेने और कब्र में रखने की बात है; इसलिए सर्वनाम का स्वाभाविक पूर्वपद यूहन्ना है। नाम जोड़कर मूल की सर्वनामात्मक अभिव्यक्ति को अनावश्यक रूप से स्पष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “शव” मूल यूनानी की स्पष्टता को सीधे व्यक्त करता है, इसलिए अंग्रेज़ी परामर्श-पाठ की तरह ‘corpse’ संबंधी पादटिप्पणी आवश्यक नहीं रही।
