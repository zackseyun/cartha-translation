  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Δότε αὐτοῖς ὑμεῖς φαγεῖν. καὶ λέγουσιν αὐτῷ· Ἀπελθόντες ἀγοράσωμεν δηναρίων διακοσίων ἄρτους καὶ ⸀δώσομεν αὐτοῖς φαγεῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/037.yaml
  text: But he answered and said to them[a], “You yourselves give them something to eat.” And they said to him[b], “Should we go and buy bread for two hundred denarii and give it to them to eat?”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “तुम ही उन्हें खाने के लिए कुछ दो।” उन्होंने उससे कहा, “क्या हम जाकर दो सौ दीनार[a] की रोटियाँ[b] खरीदें और उन्हें खाने के लिए दे दें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार उस समय एक मज़दूर या सैनिक का सामान्य दैनिक वेतन था।
    reason: cultural_note
  - marker: b
    text: यूनानी शब्द का अर्थ “रोटी” या “रोटियाँ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: यूनानी युग्म का स्वाभाविक हिन्दी अर्थ ‘उत्तर दिया’ है; ‘उत्तर देकर कहा’ अधिक शाब्दिक, पर आधुनिक हिन्दी में अनावश्यक रूप से बोझिल है।
- source_word: Δότε ... ὑμεῖς
  choice: तुम ही ... दो
  rationale: स्पष्ट सर्वनाम ὑμεῖς के बलाघात को हिन्दी के ‘ही’ से व्यक्त किया गया है, जबकि आज्ञार्थक ‘दो’ की सीधाई बनी रहती है।
- source_word: φαγεῖν
  choice: खाने को
  rationale: δίδωμι के साथ प्रयुक्त उद्देश्यसूचक अनन्त क्रिया का यह सहज और संक्षिप्त हिन्दी रूप है।
- source_word: Ἀπελθόντες ἀγοράσωμεν
  choice: क्या हम जाकर ... मोल लें
  rationale: परामर्शात्मक प्रश्न में कृदन्त और subjunctive का संयुक्त बल आधुनिक हिन्दी में ‘क्या हम जाकर ... लें’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: δηναρίων διακοσίων
  choice: दो सौ दीनार की
  rationale: सम्बन्धकारक यहाँ मूल्य बताता है; हिन्दी में ‘दो सौ दीनार की’ खरीद की लागत स्पष्ट करता है।
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: बहुवचन ἄρτους को गिनने योग्य रोटियों के रूप में रखा गया है; व्यापक अर्थ ‘रोटी/भोजन’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: δώσομεν αὐτοῖς φαγεῖν
  choice: उन्हें खाने को दें
  rationale: यीशु की आज्ञा के साथ ‘देना’ की मौखिक समानता बनाए रखी गई है और ‘खिलाएँ’ जैसे अधिक व्याख्यात्मक संक्षेप से बचा गया है।
