source:
  edition: SBLGNT
  text: καὶ εἰσελθοῦσα ⸀εὐθὺς μετὰ σπουδῆς πρὸς τὸν βασιλέα ᾐτήσατο λέγουσα· Θέλω ἵνα ⸂ἐξαυτῆς δῷς μοι⸃ ἐπὶ πίνακι τὴν κεφαλὴν Ἰωάννου τοῦ βαπτιστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/025.yaml
  text: And she immediately went in with haste to the king and asked[a], saying, “I want you to give me at once, on a platter, the head of John the Baptizer.”
translation:
  language: hi
  text: और वह तुरन्त ही जल्दी से राजा के पास गई और राजा से यह कहकर माँगा, “मैं चाहती हूँ कि आप अभी इसी समय मुझे एक थाल पर बपतिस्मा देनेवाले यूहन्ना का सिर दें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσελθοῦσα
  choice: भीतर गई
  rationale: अओरिस्ट कृदन्त उसके भोज-स्थल में या राजा की उपस्थिति में प्रवेश करने की क्रिया बताता है; ‘भीतर गई’ स्वाभाविक हिन्दी में इस गति को बनाए रखता है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: मरकुस की शैली में यह शब्द तत्कालता और कथानक की तीव्र गति दिखाता है।
- source_word: μετὰ σπουδῆς
  choice: जल्दी से
  rationale: यह पदबंध तत्पर गति और हड़बड़ी व्यक्त करता है; ‘जल्दी से’ अनावश्यक रूप से उत्साह या प्रसन्नता का भाव नहीं जोड़ता।
- source_word: βασιλέα
  choice: राजा
  rationale: ऐतिहासिक रूप से हेरोदेस अन्तिपास चौथाई देश का शासक था, फिर भी यूनानी पाठ βασιλεύς कहता है; इसलिए कथानक का पदनाम ज्यों का त्यों रखा गया है।
- source_word: ᾐτήσατο
  choice: माँगा
  rationale: αἰτέω यहाँ निवेदन या माँग करने को दर्शाता है। प्रसंग में माँगी गई वस्तु स्पष्ट है, इसलिए ‘माँगा’ हिन्दी में सीधा और स्वाभाविक है; कथन की कठोरता उद्धृत वाक्य में प्रकट होती है।
- source_word: Θέλω
  choice: मैं चाहती हूँ
  rationale: θέλω स्पष्ट इच्छा व्यक्त करता है। वक्ता स्त्रीलिंग है, इसलिए ‘चाहती’ प्रयोग किया गया है।
- source_word: ἵνα ... δῷς μοι
  choice: कि आप ... मुझे ... दें
  rationale: ἵνα-वाक्य यहाँ इच्छा की विषयवस्तु बताता है; हिन्दी में यह संरचना स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐξαυτῆς
  choice: अभी इसी समय
  rationale: यह माँग को तत्काल पूरा करने पर बल देता है। पहले आए εὐθύς से इसका अलग बल बनाए रखने के लिए पृथक अभिव्यक्ति चुनी गई है।
- source_word: ἐπὶ πίνακι
  choice: एक थाल पर
  rationale: πίναξ भोज में उपयोग होनेवाले बड़े परोसने के पात्र या थाल को दर्शाता है; ‘थाल’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: κεφαλὴν
  choice: सिर
  rationale: मूल पाठ की वीभत्स विशिष्टता को बिना नरम किए सीधे रूप में रखा गया है।
- source_word: Ἰωάννου τοῦ βαπτιστοῦ
  choice: बपतिस्मा देनेवाले यूहन्ना
  rationale: βαπτιστής यूहन्ना की क्रिया या भूमिका बतानेवाली उपाधि है। ‘बपतिस्मा देनेवाला’ उसका वर्णनात्मक अर्थ स्पष्ट करता है, जबकि नाम ‘यूहन्ना’ प्रचलित हिन्दी बाइबलीय रूप में रखा गया है।
theological_decisions:
- issue: Ἰωάννου τοῦ βαπτιστοῦ का अनुवाद
  choice: बपतिस्मा देनेवाले यूहन्ना
  alternative: यूहन्ना बपतिस्मा देनेवाला / यूहन्ना बपतिस्मा देनेवाला कहलाने वाला
  rationale: यह मुख्यतः अनुवाद-दर्शन का प्रश्न है, कोई सम्प्रदायगत सिद्धान्त नहीं। चुना गया रूप βαπτιστής की वर्णनात्मक भूमिका को स्वाभाविक हिन्दी में स्पष्ट रखता है और इसे किसी सम्प्रदाय के नाम की तरह नहीं दर्शाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तुरन्त’ और ‘अभी इसी समय’ दोनों रखकर εὐθύς तथा ἐξαυτῆς की अलग-अलग तत्कालता सुरक्षित की गई है। संबोधन के लिए आदरसूचक ‘आप’ राजा के प्रति सामाजिक व्यवहार के अनुकूल है।
