  text: καὶ ⸀λέγει αὐτοῖς· Δεῦτε ὑμεῖς αὐτοὶ κατ’ ἰδίαν εἰς ἔρημον τόπον καὶ ⸀ἀναπαύσασθε ὀλίγον. ἦσαν γὰρ οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί, καὶ οὐδὲ φαγεῖν εὐκαίρουν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/031.yaml
  text: And he said to them[a], “Come away by yourselves to a desolate place and rest a little.” For many were coming and going[b], and they did not even have an opportunity to eat.
translation:
  language: hi
  text: और उसने उनसे कहा, “तुम लोग स्वयं अलग होकर किसी निर्जन स्थान[a] में चले आओ और थोड़ा विश्राम कर लो।” क्योंकि बहुत-से लोग आ-जा रहे थे, और उन्हें भोजन करने का अवसर भी नहीं मिल पाता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुनसान स्थान” अथवा “एकांत स्थान।” यूनानी शब्द किसी अलग-थलग या निर्जन जगह को दर्शाता है; इसका अर्थ आधुनिक अर्थ में मरुस्थल होना आवश्यक नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें भोजन करने का समय भी नहीं मिलता था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: उसने कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथन-शैली में भूतकाल स्वाभाविक है और प्रसंग का कथात्मक प्रवाह बनाए रखता है।
- source_word: Δεῦτε
  choice: चले आओ
  rationale: यह बुलावे के रूप में प्रयुक्त आज्ञार्थक है। ‘चले आओ’ भीड़ से हटकर दूसरी जगह जाने के निहित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑμεῖς αὐτοὶ κατ’ ἰδίαν
  choice: तुम लोग स्वयं अलग होकर
  rationale: बलसूचक सर्वनाम और ‘अलग/एकांत में’ के अर्थ वाली पदावली, दोनों को बनाए रखते हुए यह अनुवाद शिष्यों के भीड़ से पृथक होने पर बल देता है।
- source_word: ἔρημον τόπον
  choice: किसी निर्जन स्थान
  rationale: ἔρημος यहाँ किसी सुनसान, अलग-थलग या निर्जन जगह का बोध कराता है; इसका अर्थ अनिवार्य रूप से रेतीला मरुस्थल नहीं है।
- source_word: ἀναπαύσασθε ὀλίγον
  choice: थोड़ा विश्राम कर लो
  rationale: मध्यवाच्य आज्ञार्थक काम से विराम लेकर स्वयं विश्राम पाने का भाव देता है; ὀλίγον विश्राम की छोटी अवधि दर्शाता है।
- source_word: οἱ ἐρχόμενοι καὶ οἱ ὑπάγοντες πολλοί
  choice: बहुत-से लोग आ-जा रहे थे
  rationale: वर्तमान कृदंतों की जोड़ी लोगों की निरंतर आवाजाही दर्शाती है, जिसे ‘आ-जा रहे थे’ संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: οὐδὲ φαγεῖν εὐκαίρουν
  choice: उन्हें भोजन करने का अवसर भी नहीं मिल पाता था
  rationale: εὐκαιρέω का मूल भाव अवसर या अवकाश मिलने का है। अपूर्ण भूतकाल के साथ ‘नहीं मिल पाता था’ उस बार-बार बनी रहने वाली स्थिति को व्यक्त करता है और ‘भी’ οὐδέ को दर्शाता है।
