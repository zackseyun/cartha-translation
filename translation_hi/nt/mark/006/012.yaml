  yaml_path: translation/nt/mark/006/012.yaml
  text: And they went out and proclaimed that people should repent[a].
translation:
  language: hi
  text: और उन्होंने निकलकर प्रचार किया कि लोग मन फिराएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: साधारण संयोजक के रूप में यह पिछले प्रसंग से स्वाभाविक कथात्मक संबंध बनाए रखता है।
- source_word: ἐξελθόντες
  choice: उन्होंने निकलकर
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में पूर्ववर्ती/सहवर्ती क्रिया के रूप में व्यक्त किया गया है; कर्ता शिष्य हैं।
- source_word: ἐκήρυξαν
  choice: प्रचार किया
  rationale: κηρύσσω सार्वजनिक रूप से संदेश घोषित करने को दर्शाता है। हिन्दी बाइबलीय संदर्भ में ‘प्रचार किया’ सहज और व्यापक रूप से बोधगम्य है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ यह प्रचार की अपेक्षित विषयवस्तु अथवा लक्ष्य का परिचय देता है; हिन्दी में ‘कि’ दोनों के बीच की संभावित छाया को खुला रखता है।
- source_word: μετανοῶσιν
  choice: मन फिराएँ
  rationale: μετανοέω केवल विचार बदलने तक सीमित नहीं, बल्कि मन और जीवन की दिशा बदलने का भाव रखता है। ‘मन फिराएँ’ इस व्यापक बाइबलीय अर्थ को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: μετανοέω के अर्थ को केवल मानसिक परिवर्तन मानना या जीवन-दिशा के परिवर्तन सहित व्यक्त करना
  choice: मन फिराएँ
  alternative: अपनी सोच बदलें / पश्चाताप करें
  rationale: ‘अपनी सोच बदलें’ अर्थ को अत्यधिक मानसिक बना सकता है, जबकि ‘पश्चाताप करें’ कभी-कभी केवल दुःख अनुभव करने के अर्थ में समझा जाता है। ‘मन फिराएँ’ सोच, इच्छा और दिशा के परिवर्तन को समेटता है, बिना उसे किसी सम्प्रदायगत सूत्र में बाँधे।
- issue: बहुवचन क्रिया के निहित कर्ता को स्पष्ट करना
  choice: लोग
  alternative: वे
  rationale: यूनानी क्रिया में कर्ता निहित है और संदर्भ में प्रचार सुनने वाले लोग अभिप्रेत हैं। हिन्दी में ‘वे’ शिष्यों की ओर संकेत करता हुआ समझा जा सकता था; ‘लोग’ अपेक्षित श्रोताओं को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘प्रचार किया’ तथा ‘मन फिराएँ’ परिचित बाइबलीय भाषा हैं, पर वाक्य-संरचना वर्तमान हिन्दी के अनुरूप रखी गई है।
