  yaml_path: translation/nt/mark/006/038.yaml
  text: But he said to them, “How many loaves do you have? Go and see.” And when they found out, they said, “Five, and two fish.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “तुम्हारे पास कितनी रोटियाँ हैं? जाकर देखो।” जब उन्होंने पता कर लिया, तो उन्होंने कहा, “पाँच, और दो मछलियाँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄρτους
  choice: रोटियाँ
  rationale: संदर्भ में गिनी जा सकने वाली साधारण रोटियों के लिए स्वाभाविक आधुनिक हिन्दी शब्द।
- source_word: ὑπάγετε ἴδετε
  choice: जाकर देखो
  rationale: दोनों आज्ञार्थक क्रियाओं की संक्षिप्तता और क्रम को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γνόντες
  choice: पता लगाने के बाद
  rationale: यह केवल आँखों से देखने के बजाय जाँचकर जान लेने का भाव व्यक्त करता है।
- source_word: ἰχθύας
  choice: मछलियाँ
  rationale: बहुवचन और भोजन के सामान्य अर्थ को सीधे व्यक्त करता है।
