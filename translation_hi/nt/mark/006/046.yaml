  text: καὶ ἀποταξάμενος αὐτοῖς ἀπῆλθεν εἰς τὸ ὄρος προσεύξασθαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/046.yaml
  text: And after saying goodbye to them[a], he went away to the mountain to pray.
translation:
  language: hi
  text: और उनसे विदा लेने के बाद[a] वह प्रार्थना करने के लिए पहाड़ पर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे विदा होकर।”
    reason: ἀποταξάμενος के लिए निकटवर्ती, अधिक संक्षिप्त शाब्दिक विकल्प।
lexical_decisions:
- source_word: ἀποταξάμενος
  choice: विदा लेने के बाद
  rationale: मध्यवाच्य कृदन्त का यहाँ स्वाभाविक अर्थ ‘उनसे विदा लेना’ है। यह हिन्दी में सहज है और αὐτοῖς के साथ संबंध को स्पष्ट रखता है; ‘उन्हें विदा करने’ से अर्थ उनके प्रस्थान की ओर मुड़ सकता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: सम्प्रदान बहुवचन सर्वनाम प्रसंग में पहले उल्लिखित लोगों को सूचित करता है और हिन्दी मुहावरे ‘उनसे विदा लेना’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: यह पहले स्थान या समूह से प्रस्थान को व्यक्त करता है। ‘चला गया’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: εἰς τὸ ὄρος
  choice: पहाड़ पर
  rationale: ὄρος का सीधा अर्थ पहाड़ है। हिन्दी में किसी पहाड़ पर जाने के लिए ‘पहाड़ पर’ स्वाभाविक प्रयोग है; निश्चित उपपद को अनावश्यक व्याख्या के बिना प्रसंग-सिद्ध ‘पहाड़’ से व्यक्त किया गया है।
- source_word: προσεύξασθαι
  choice: प्रार्थना करने के लिए
  rationale: यह प्रयोजनसूचक अनन्त क्रिया है और उसके जाने का उद्देश्य बताती है।
- source_word: καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ यूनानी के निकट रहते हुए कथा की निरन्तरता बनाए रखता है।
theological_decisions:
- issue: τὸ ὄρος में निश्चित उपपद और पहाड़ का संदर्भ
  choice: ‘पहाड़’ के रूप में ठोस कथात्मक स्थान बनाए रखना, बिना किसी प्रतीकात्मक अर्थ के
  alternative: ‘एक पहाड़’ कहना या इसे विशेष प्रकाशन के स्थान के रूप में व्याख्यायित करना
  rationale: यूनानी पाठ में निश्चित उपपद है, पर हिन्दी में ‘वह पहाड़’ कहने से ऐसा लग सकता है मानो कोई पहाड़ पहले स्पष्ट रूप से पहचाना गया हो। केवल ‘पहाड़ पर’ स्वाभाविक हिन्दी में प्रसंग-सिद्ध स्थान को व्यक्त करता है और पाठ में अनुपस्थित धार्मिक प्रतीकवाद नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, स्वाभाविक और गरिमापूर्ण कथात्मक शैली। ‘उनसे विदा लेना’ को ‘उन्हें विदा करना’ पर प्राथमिकता दी गई है ताकि कर्ता के स्वयं उनसे अलग होने का भाव स्पष्ट रहे।
