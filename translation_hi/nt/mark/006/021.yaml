  text: और जब एक अनुकूल दिन आया[a], तब हेरोदेस ने अपने जन्मदिन पर अपने उच्च पदस्थ लोगों, सेनापतियों और गलील के प्रमुख पुरुषों के लिए भोज दिया[b][c]।
  philosophy: optimal-equivalence
