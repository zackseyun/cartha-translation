  text: καὶ ἐξελθόντων αὐτῶν ἐκ τοῦ πλοίου ⸀εὐθὺς ἐπιγνόντες αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/054.yaml
  text: And when they got out of the boat[a], immediately they recognized him.
translation:
  language: hi
  text: जब वे नाव से उतरे[a], तो लोगों ने तुरन्त उसे पहचान लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “और जब वे नाव से उतरे, तो तुरन्त उसे पहचानकर…” यूनानी में ‘पहचानने’ वालों की संज्ञा स्पष्ट नहीं की गई है; प्रसंग से वे उस स्थान के लोग हैं।'
    reason: मूल यूनानी की कृदन्तीय रचना और उसमें निहित कर्ता की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: ἐξελθόντων αὐτῶν
  choice: जब वे … उतरे
  rationale: सम्बन्धकारक स्वतंत्र पदबंध को स्वाभाविक हिन्दी की कालवाचक उपवाक्य-रचना में व्यक्त किया गया है। नाव से बाहर आने के प्रसंग में ‘उतरे’ सहज और सटीक है।
- source_word: πλοίου
  choice: नाव
  rationale: गलील की झील के प्रसंग में πλοῖον छोटी जलयान अथवा मछली पकड़ने की नाव को सूचित करता है; आधुनिक हिन्दी में ‘नाव’ सबसे स्वाभाविक है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की शैली में बार-बार आने वाले क्रियाविशेषण की तात्कालिकता को स्पष्ट रूप से बनाए रखता है।
- source_word: ἐπιγνόντες
  choice: पहचान लिया
  rationale: यहाँ ἐπιγινώσκω का अर्थ यीशु को देखकर पहचानना है; ‘पहचान लिया’ आधुनिक हिन्दी में इसका स्वाभाविक पूर्णताबोधक रूप है।
- source_word: αὐτὸν
  choice: उसे
  rationale: सर्वनाम का संदर्भ कथा में यीशु से है; मूल के सर्वनामिक रूप को हिन्दी में बनाए रखा गया है।
- source_word: implicit subject of ἐπιγνόντες
  choice: लोगों ने
  rationale: यूनानी में कर्ता संज्ञा व्यक्त नहीं है, पर ἐπιγνόντες का कर्ता बहुवचन है और अगले पद में आसपास के लोगों की गतिविधि से उसका संकेत मिलता है। हिन्दी में भ्रम से बचने के लिए ‘लोगों ने’ जोड़ा गया है।
theological_decisions:
- issue: यीशु को पहचानने वालों की पहचान
  choice: स्थानीय लोगों को ‘लोगों ने’ के रूप में स्पष्ट करना
  alternative: ‘उन्होंने उसे पहचान लिया’ कहकर कर्ता को सर्वनाम के रूप में छोड़ना
  rationale: यह मुख्यतः वाक्य-विन्यास और प्रसंग का प्रश्न है, न कि सिद्धान्त का। ἐπιγνόντες कर्ताकारक बहुवचन है और सम्बन्धकारक αὐτῶν का स्वाभाविक व्याकरणिक कर्ता नहीं हो सकता। अगले पद में क्षेत्र के लोगों का दौड़ना इस पहचान की पुष्टि करता है; फिर भी मूल में संज्ञा न होने की बात पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तो’ कालवाचक उपवाक्य और मुख्य वाक्य का सम्बन्ध सहज बनाता है; ‘तुरन्त’ को पहचानने की क्रिया के साथ रखा गया है।
