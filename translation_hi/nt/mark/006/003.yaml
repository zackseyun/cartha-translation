id: MRK.6.3
reference: Mark 6:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐχ οὗτός ἐστιν ὁ τέκτων, ὁ υἱὸς ⸀τῆς Μαρίας ⸂καὶ ἀδελφὸς⸃ Ἰακώβου καὶ ⸀Ἰωσῆτος καὶ Ἰούδα καὶ Σίμωνος; καὶ οὐκ εἰσὶν αἱ ἀδελφαὶ αὐτοῦ ὧδε πρὸς ἡμᾶς; καὶ ἐσκανδαλίζοντο ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/003.yaml
  text: Is this not the carpenter[b][a], the son of Mary and brother of James and Joses and Judas and Simon? And are not his sisters here with us? And they took offense at him.
translation:
  language: hi
  text: क्या यह वही बढ़ई नहीं, जो मरियम का बेटा और याकूब, योसेस, यहूदा और शमौन का भाई[a] है? और क्या उसकी बहनें[a] यहाँ हमारे बीच नहीं हैं? और उन्होंने उसके कारण ठोकर खाई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ और ‘बहनें’ के लिए ‘निकट संबंधी’ भी संभव है; यूनानी शब्दों का सामान्य अर्थ भाई-बहन है, लेकिन कुछ मसीही परंपराएँ यहाँ उन्हें व्यापक रिश्तेदारी या सौतेले भाई-बहन के अर्थ में समझती हैं।
    reason: alternative_reading
  - marker: b
    text: या, ‘वे उससे ठोकर खा गए’ अथवा ‘उन्होंने उसका बुरा माना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τέκτων
  choice: बढ़ई
  rationale: यद्यपि यूनानी शब्द का व्यापक अर्थ कारीगर या निर्माण-कर्मी हो सकता है, इस ग्रामीण पहचान-प्रसंग में पारंपरिक और सर्वाधिक संभावित अर्थ ‘बढ़ई’ है।
- source_word: υἱὸς τῆς Μαρίας
  choice: मरियम का बेटा
  rationale: यह नगरवासियों द्वारा यीशु की उसकी माता के आधार पर की गई चिह्नित पहचान को सीधे बनाए रखता है, बिना उसके सामाजिक आशय की व्याख्या जोड़े।
- source_word: ἀδελφὸς / ἀδελφαὶ
  choice: भाई / बहनें
  rationale: इन यूनानी शब्दों के सामान्य अर्थ यही हैं; व्यापक रिश्तेदारी या सौतेले भाई-बहन की व्याख्या मुख्य पाठ में थोपने के बजाय पादटिप्पणी में रखी गई है।
- source_word: Ἰωσῆτος
  choice: योसेस
  rationale: स्रोत में आए विशिष्ट यूनानी नामरूप को ‘यूसुफ़’ में सामान्यीकृत करने के बजाय लिप्यंतरित किया गया है।
- source_word: ὧδε πρὸς ἡμᾶς
  choice: यहाँ हमारे बीच
  rationale: यह वक्ताओं के साथ स्थानीय और सामाजिक निकटता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐσκανδαλίζοντο ἐν αὐτῷ
  choice: उन्होंने उसके कारण ठोकर खाई
  rationale: यह वाक्यांश के रूपक को सुरक्षित रखता है और केवल भावनात्मक नाराज़गी तक अर्थ को सीमित नहीं करता; प्रसंग में इसका आशय यीशु को स्वीकार न कर पाना है।
theological_decisions:
- issue: यीशु के ‘भाई’ और ‘बहनों’ का ठीक पारिवारिक संबंध
  choice: मुख्य पाठ में सामान्य पारिवारिक शब्द ‘भाई’ और ‘बहनें’ रखे गए हैं।
  alternative: इन्हें निकट संबंधी अथवा सौतेले भाई-बहन समझना।
  rationale: ἀδελφός और ἀδελφή सामान्यतः भाई और बहन का अर्थ देते हैं, पर पाठ यह निश्चित नहीं करता कि यहाँ सगे, सौतेले या व्यापक रिश्तेदारी के संबंध अभिप्रेत हैं; अतः विवाद को अनुवाद में निर्णीत नहीं किया गया।
- issue: ‘मरियम का बेटा’ कहने का सामाजिक आशय
  choice: वाक्यांश को सीधे अनूदित किया गया है।
  alternative: इसे स्पष्ट रूप से तिरस्कारपूर्ण या पूर्णतः तटस्थ बताना।
  rationale: इस संबोधन में सामाजिक चुभन संभव है, लेकिन यूनानी पाठ उसे स्पष्ट नहीं करता; इसलिए अतिरिक्त भाव मुख्य पाठ में नहीं जोड़ा गया।
- issue: σκανδαλίζομαι का रूपक और प्रतिक्रिया
  choice: ‘उसके कारण ठोकर खाई’
  alternative: ‘उससे नाराज़ हुए’ या ‘उसे लेकर बुरा माना’।
  rationale: ‘ठोकर खाना’ मूल रूपक और धार्मिक-संबंधी बाधा दोनों को खुला रखता है, जबकि केवल ‘नाराज़ होना’ अर्थ को संकुचित कर सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। नगरवासियों की बोलचाल का प्रश्नात्मक स्वर रखा गया है। ‘यह’ से आरम्भ होने वाली पहचान और बाद में ‘उसके’ का प्रयोग हिन्दी में स्वाभाविक दूरी तथा कथात्मक संदर्भ बनाए रखता है।
