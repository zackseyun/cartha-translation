  text: Καὶ ⸀εὐθὺς ἠνάγκασεν τοὺς μαθητὰς αὐτοῦ ἐμβῆναι εἰς τὸ πλοῖον καὶ προάγειν ⸂εἰς τὸ πέραν⸃ πρὸς Βηθσαϊδάν, ἕως αὐτὸς ⸀ἀπολύει τὸν ὄχλον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/045.yaml
  text: And immediately he compelled his disciples to get into the boat and go ahead to the other side[a], toward Bethsaida[b], until he himself dismissed the crowd.
translation:
  language: hi
  text: और तुरंत उसने अपने चेलों को विवश किया कि वे नाव में चढ़ें और उससे पहले उस पार, बैतसैदा की ओर[a] चले जाएँ, जब तक कि वह स्वयं भीड़ को विदा न कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बैतसैदा तक।’ यूनानी पूर्वसर्ग दिशा (‘की ओर’) अथवा अधिक निश्चित गंतव्य (‘तक’) व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरंत
  rationale: यह मरकुस की कथा में घटनाओं की तीव्र गति को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: ἠνάγκασεν
  choice: विवश किया
  rationale: यह क्रिया प्रबल दबाव या अनिवार्यता व्यक्त करती है; ‘विवश किया’ उस बल को बनाए रखता है, पर शारीरिक बल-प्रयोग का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: τοὺς μαθητὰς αὐτοῦ
  choice: अपने चेलों को
  rationale: ‘चेले’ सुसमाचारों में गुरु-शिष्य संबंध के लिए प्रचलित, सहज और सटीक हिन्दी शब्द है; ‘अपने’ यीशु के साथ उनके संबंध को व्यक्त करता है।
- source_word: ἐμβῆναι εἰς τὸ πλοῖον
  choice: नाव में चढ़ें
  rationale: यह नाव में प्रवेश करने की क्रिया को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προάγειν
  choice: उससे पहले ... चले जाएँ
  rationale: यह बताता है कि चेलों को यीशु से पहले आगे रवाना होना था, न कि केवल सामान्य रूप से आगे बढ़ना था।
- source_word: εἰς τὸ πέραν
  choice: उस पार
  rationale: झील के विपरीत तट की ओर जाने के लिए यह सहज और संदर्भानुकूल हिन्दी मुहावरा है।
- source_word: πρὸς Βηθσαϊδάν
  choice: बैतसैदा की ओर
  rationale: πρός यहाँ दिशा को दर्शा सकता है; ‘की ओर’ निश्चित आगमन का दावा किए बिना उस दिशात्मक भाव को सुरक्षित रखता है।
- source_word: ἕως
  choice: जब तक
  rationale: यह चेलों के पहले रवाना होने और यीशु द्वारा भीड़ को विदा किए जाने के बीच की समय-सीमा को यथासंभव सीधे रूप में रखता है।
- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: स्पष्ट सर्वनाम पर दिए गए बल को बनाए रखता है कि यीशु स्वयं पीछे रहकर भीड़ को विदा करेगा।
- source_word: ἀπολύει
  choice: विदा कर दे
  rationale: वर्तमान-कालीन यूनानी रूप को हिन्दी के काल-सापेक्ष उपवाक्य में स्वाभाविक पूर्णतासूचक क्रिया से व्यक्त किया गया है; आशय भीड़ को भेज देने का है।
- source_word: τὸν ὄχλον
  choice: भीड़ को
  rationale: ὄχλος के लिए ‘भीड़’ सामान्य, आधुनिक और प्रसंगानुकूल हिन्दी है।
