  source_fidelity: Draft accurately represents εὐθύς, ἠνάγκασεν, the emphatic αὐτός, the directional force of πρὸς Βηθσαϊδάν, and the crowd’s dismissal. The temporal clause should be made idiomatic in Hindi without weakening its relation to Jesus’ remaining behind.
  naturalness: The wording is generally clear and contemporary. However, “जब तक वह स्वयं ... विदा कर दे” is less idiomatic than the standard correlative/subjunctive construction “जब तक कि ... न कर दे.” A comma also clarifies that “बैतसैदा की ओर” qualifies the destination/direction.
  terminology: “चेले,” “विवश किया,” “नाव,” “बैतसैदा,” and “भीड़” are suitable modern-standard Hindi renderings. “विवश किया” appropriately retains the strong force of ἠνάγκασεν without asserting physical force.
