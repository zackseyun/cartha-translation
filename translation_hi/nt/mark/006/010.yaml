  text: καὶ ἔλεγεν αὐτοῖς· Ὅπου ⸀ἐὰν εἰσέλθητε εἰς οἰκίαν, ἐκεῖ μένετε ἕως ἂν ἐξέλθητε ἐκεῖθεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/010.yaml
  text: And he was saying to them[a], “Wherever you enter a house, stay there until you leave that place.”
translation:
  language: hi
  text: और वह उनसे कहता था, “जहाँ भी तुम किसी घर में प्रवेश करो, वहीं ठहरे रहो, जब तक तुम वहाँ से न चले जाओ।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक: “जब तक तुम वहाँ से बाहर न निकल जाओ।” यूनानी में “वहाँ से निकल जाओ” है; प्रसंग में इसका आशय सम्भवतः उस स्थान या क्षेत्र से प्रस्थान करना है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता था
  rationale: अपूर्ण भूतकाल कथन की जारी या प्रसंगगत पुनरावृत्त प्रकृति को व्यक्त कर सकता है; ‘कहता था’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: Ὅπου ἐὰν
  choice: जहाँ कहीं
  rationale: यह अनिश्चित स्थानवाचक अर्थ, अर्थात ‘जहाँ भी’, व्यक्त करता है; ‘जहाँ कहीं’ निर्देशात्मक वाक्य में स्वाभाविक और स्पष्ट है।
- source_word: εἰσέλθητε εἰς οἰκίαν
  choice: किसी घर में प्रवेश करो
  rationale: εἰς के साथ क्रिया घर के भीतर जाने की दिशा बताती है। ‘घर में प्रवेश करो’ इस अर्थ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οἰκίαν
  choice: किसी घर
  rationale: यहाँ मुख्य संदर्भ ठहरने के भौतिक स्थान का है; इसलिए ‘घर’ उपयुक्त है, जबकि ‘परिवार’ या ‘गृहस्थी’ अधिक व्याख्यात्मक होते।
- source_word: ἐκεῖ μένετε
  choice: वहीं ... ठहरे रहना
  rationale: μένω का अर्थ यहाँ उसी आवास में बने रहना है। ‘ठहरे रहना’ यात्रा और आतिथ्य के संदर्भ में स्वाभाविक है तथा निरंतरता भी प्रकट करता है।
- source_word: ἕως ἂν ἐξέλθητε ἐκεῖθεν
  choice: जब तक उस जगह से चले न जाओ
  rationale: शाब्दिक संरचना ‘जब तक वहाँ से निकल न जाओ’ हो सकती है। संदर्भ में ‘उस जगह से चले न जाओ’ स्थानीय क्षेत्र से प्रस्थान का संभावित आशय सहजता से देता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
theological_decisions:
- issue: ἐκεῖθεν के संकेत-क्षेत्र का दायरा
  choice: शिष्यों को उसी घर में तब तक ठहरना है जब तक वे उस जगह या क्षेत्र से प्रस्थान न करें।
  alternative: जब तक वे उस घर से बाहर न निकलें या वहाँ से निकल न जाएँ।
  rationale: मिशन और आतिथ्य के प्रसंग में यह निर्देश एक घर छोड़कर दूसरे, सम्भवतः अधिक सुविधाजनक, घर में न जाने से संबंधित प्रतीत होता है। फिर भी यूनानी ‘वहाँ से’ कहता है और उसका दायरा व्याकरण मात्र से पूर्णतः निश्चित नहीं, इसलिए अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक निर्देश के अनुकूल। ‘कहता था’ यूनानी अपूर्ण भूतकाल का पक्ष बनाए रखता है, और ‘वहीं ... ठहरे रहना’ एक ही घर में बने रहने पर स्वाभाविक बल देता है।
