  yaml_path: translation/nt/mark/006/051.yaml
  text: And he got into the boat with them[a], and the wind stopped. And they were utterly astonished within themselves[b],
translation:
  language: hi
  text: तब वह नाव में उनके पास चढ़ गया, और हवा थम गई। वे मन-ही-मन अत्यन्त[a] विस्मित हो रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से यूनानी में तीव्रता बताने वाले शब्द एक साथ आए हैं: “बहुत ही अधिक, हद से बढ़कर।”'
    reason: lexical_alternative
  - marker: b
    text: “विस्मित हो रहे थे” का अनुवाद “अपने आपे से बाहर हो रहे थे” भी किया जा सकता है; इससे उनके विस्मय की अत्यधिक तीव्रता व्यक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνέβη πρὸς αὐτοὺς εἰς τὸ πλοῖον
  choice: वह उनके पास नाव में चढ़ गया
  rationale: ἀνέβη का मूल अर्थ ‘ऊपर चढ़ा’ है, पर εἰς τὸ πλοῖον के साथ इसका स्वाभाविक अर्थ नाव में चढ़ना है। πρὸς αὐτούς को ‘उनके पास’ रखने से यह स्पष्ट रहता है कि चेले पहले से नाव में थे और यीशु उनके पास आया।
- source_word: ἐκόπασεν ὁ ἄνεμος
  choice: हवा थम गई
  rationale: κοπάζω हवा या तूफ़ान के शान्त पड़ने अथवा रुक जाने को दर्शाता है। ‘थम गई’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: λίαν ἐκ περισσοῦ
  choice: अत्यन्त
  rationale: दोनों यूनानी पद मिलकर आश्चर्य की तीव्रता पर असाधारण बल देते हैं। मुख्य पाठ में ‘अत्यन्त’ पठनीय और गरिमापूर्ण है; पदों के संयुक्त बल को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἐν ἑαυτοῖς
  choice: मन-ही-मन
  rationale: यह उनकी भीतरी प्रतिक्रिया को व्यक्त करता है। ‘मन-ही-मन’ आधुनिक हिन्दी में स्वाभाविक रूप से प्रतिवर्ती और आन्तरिक भाव सुरक्षित रखता है।
- source_word: ἐξίσταντο
  choice: विस्मित हो रहे थे
  rationale: मध्यवाच्य/अकर्मक प्रयोग अत्यधिक चकित या स्तब्ध होने का भाव देता है। अपूर्णकालिक ‘हो रहे थे’ यूनानी क्रिया के चलते हुए प्रतिक्रिया-भाव को बनाए रखता है।
theological_decisions:
- issue: यीशु के कार्य पर चेलों की प्रतिक्रिया की तीव्रता
  choice: वे मन-ही-मन अत्यन्त विस्मित हो रहे थे
  alternative: वे मन-ही-मन अपने आपे से बाहर हो रहे थे
  rationale: मुख्य पाठ चेलों के प्रबल आन्तरिक विस्मय को स्पष्ट और पठनीय ढंग से रखता है। वैकल्पिक वाक्यांश ἐξίσταντο की अधिक तीखी सम्भावना दिखाता है, पर मुख्य पाठ में ऐसा मुहावरा भ्रम पैदा कर सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रजिस्टर रखा गया है। ‘नाव’, ‘हवा थम गई’ और ‘मन-ही-मन’ सामान्य पाठक के लिए सहज हैं, जबकि ‘अत्यन्त विस्मित’ मूल की प्रबल प्रतिक्रिया को बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के व्यक्त करता है।
