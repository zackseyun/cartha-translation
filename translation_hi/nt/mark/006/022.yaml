source:
  edition: SBLGNT
  text: καὶ εἰσελθούσης τῆς θυγατρὸς ⸂αὐτῆς τῆς⸃ Ἡρῳδιάδος καὶ ὀρχησαμένης ⸂καὶ ἀρεσάσης⸃ τῷ Ἡρῴδῃ καὶ τοῖς συνανακειμένοις, ⸂εἶπεν ὁ βασιλεὺς⸃ τῷ κορασίῳ· Αἴτησόν με ὃ ἐὰν θέλῃς, καὶ δώσω σοι·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/022.yaml
  text: And when Herodias's daughter came in and danced[a], and pleased Herod and those reclining at the table with him, the king said to the girl, “Ask me for whatever you want[b], and I will give it to you.”
translation:
  language: hi
  text: जब हेरोदियास की बेटी[a] भीतर आई और नाची, और उसने हेरोदेस और उसके साथ भोजन पर टेक लगाए हुए लोगों[b] को प्रसन्न किया, तो राजा ने उस लड़की से कहा, “तुम मुझसे जो चाहो माँगो, और मैं तुम्हें दे दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों या पाठ-परंपराओं में इसे ‘उसकी बेटी हेरोदियास’ के अर्थ में समझा जाता है। यहाँ अपनाए गए यूनानी पाठ में ‘हेरोदियास की बेटी’ है।
    reason: textual_variant
  - marker: b
    text: अथवा, ‘उसके साथ भोजन कर रहे लोगों’। यूनानी में उन साथी भोज-अतिथियों का उल्लेख है जो प्राचीन रीति के अनुसार मेज़ पर टेक लगाए हुए थे।
    reason: cultural_note
lexical_decisions:
- source_word: εἰσελθούσης
  choice: जब ... भीतर आई
  rationale: अओरिस्ट कृदंत वाले संबंध-विरहित संबंधकारक वाक्यांश को समयसूचक रूप में प्रस्तुत किया गया है। ‘भीतर आई’ भोज के स्थान में प्रवेश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τῆς θυγατρὸς αὐτῆς τῆς Ἡρῳδιάδος
  choice: हेरोदियास की बेटी
  rationale: संबंधकारक रचना का सबसे स्वाभाविक अर्थ लड़की को हेरोदियास की बेटी बताता है। पाठगत/व्याख्यात्मक वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ὀρχησαμένης
  choice: नाची
  rationale: सरल भूतकालीन क्रिया हिन्दी में कृदंतीय घटनाक्रम को सहज रूप से व्यक्त करती है और मूल क्रिया का सीधा अर्थ बनाए रखती है।
- source_word: ἀρεσάσης
  choice: प्रसन्न किया
  rationale: ἀρέσκω का सीधा अर्थ ‘प्रसन्न करना’ है; इससे अनावश्यक रूप से अधिक तीव्र भाव नहीं जुड़ता।
- source_word: τοῖς συνανακειμένοις
  choice: भोज में उसके साथ टेक लगाकर बैठे लोगों
  rationale: यह भोज में साथ लेटकर या टेक लगाकर भोजन करनेवालों को दर्शाता है। यह अनुवाद प्राचीन भोज-मुद्रा की ठोस छवि को पठनीय हिन्दी में बनाए रखता है।
- source_word: εἶπεν ὁ βασιλεὺς
  choice: राजा ने ... कहा
  rationale: βασιλεύς का अर्थ ‘राजा’ है। हेरोदेस अन्तिपास की ऐतिहासिक तकनीकी पदवी डालकर मरकुस की शब्दावली को बदला नहीं गया है।
- source_word: τῷ κορασίῳ
  choice: उस लड़की से
  rationale: κοράσιον के लिए ‘लड़की’ आधुनिक, स्वाभाविक और पर्याप्त हिन्दी है; अधिक पुरातन या अनावश्यक रूप से विशिष्ट शब्द से बचा गया है।
- source_word: Αἴτησόν με ὃ ἐὰν θέλῃς
  choice: तुम मुझसे जो चाहो माँगो
  rationale: यह खुले विकल्प वाली माँग को सहज समकालीन हिन्दी में व्यक्त करता है और आज्ञार्थक बल बनाए रखता है।
- source_word: δώσω σοι
  choice: मैं तुम्हें दे दूँगा
  rationale: भविष्यकालीन प्रतिज्ञा को स्वाभाविक हिन्दी में व्यक्त किया गया है; माँगी जानेवाली वस्तु पूर्ववर्ती वाक्यांश से निहित है।
theological_decisions:
- issue: हेरोदेस अन्तिपास के लिए βασιλεύς का अनुवाद
  choice: राजा
  alternative: चौथाई प्रदेश का शासक; शासक
  rationale: मरकुस के मूल कथन ‘राजा’ को ऐतिहासिक रूप से अधिक तकनीकी पदवी से नहीं बदला गया। इससे मूल-पाठ की प्रधानता बनी रहती है और बाहरी ऐतिहासिक सुधार अनुवाद में नहीं घुसता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘टेक लगाकर बैठे’ प्राचीन भोज-मुद्रा को ‘लेटे हुए’ की संभावित अस्वाभाविकता के बिना व्यक्त करता है। पादटिप्पणी-चिह्न संबंधित शब्दों के ठीक बाद लगाए गए हैं।
