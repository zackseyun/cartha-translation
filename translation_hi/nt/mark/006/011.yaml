  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸂ὃς ἂν τόπος μὴ δέξηται⸃ ὑμᾶς μηδὲ ἀκούσωσιν ὑμῶν, ἐκπορευόμενοι ἐκεῖθεν ἐκτινάξατε τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν εἰς μαρτύριον ⸀αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/011.yaml
  text: And whatever place does not receive you or listen to you, as you leave there, shake off the dust that is under your feet as a testimony against them.
translation:
  language: hi
  text: और जो भी स्थान तुम्हें स्वीकार न करे और तुम्हारी बात न सुने, वहाँ से निकलते समय अपने पैरों के नीचे की धूल झाड़ देना[b]—उनके लिए गवाही के रूप में।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके विरुद्ध गवाही के रूप में” अथवा “उनके सामने गवाही के रूप में।” यूनानी वाक्यांश का अधिक शाब्दिक अर्थ “उनके लिए गवाही के रूप में” है; प्रसंग अस्वीकार करने वालों के विरुद्ध गवाही का संकेत दे सकता है।
    reason: alternative_reading
  - marker: b
    text: पैरों की धूल झाड़ना अस्वीकार किए जाने पर उनसे अपना संबंध तोड़ने और उन्हें चेतावनी देने का प्रतीकात्मक कार्य था।
    reason: cultural_note
lexical_decisions:
- source_word: ὃς ἂν τόπος
  choice: जो भी स्थान
  rationale: यह अनिश्चित और सामान्य अर्थ व्यक्त करता है तथा τόπος के स्पष्ट संज्ञात्मक अर्थ ‘स्थान’ को बनाए रखता है।
- source_word: δέξηται
  choice: स्वीकार न करे
  rationale: यह दूतों को ग्रहण करने और आतिथ्य देने के व्यापक भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘स्वागत न करे’ सम्भव है, पर अपेक्षाकृत संकीर्ण है।
- source_word: ἀκούσωσιν ὑμῶν
  choice: तुम्हारी बात न सुने
  rationale: यह केवल आवाज़ सुनने के बजाय संदेश पर ध्यान देने का भाव देता है, पर ‘माने’ की तरह आज्ञापालन का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐκπορευόμενοι ἐκεῖθεν
  choice: वहाँ से निकलते समय
  rationale: कृदन्त का परिस्थितिजन्य-कालिक अर्थ सहज और स्पष्ट हिन्दी में सुरक्षित रहता है।
- source_word: ἐκτινάξατε
  choice: झाड़ देना
  rationale: पैरों से धूल हटाने की क्रिया के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति है।
- source_word: τὸν χοῦν τὸν ὑποκάτω τῶν ποδῶν ὑμῶν
  choice: अपने पैरों के नीचे की धूल
  rationale: मूल वाक्यांश की स्थान-सूचक संरचना को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: उनके विरुद्ध गवाही के लिए
  rationale: सन्दर्भ में यह संकेत अस्वीकार करने वालों के लिए प्रतिकूल गवाही का कार्य करता है; αὐτοῖς की अधिक शाब्दिक ‘उनके लिए/उनके सामने’ सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: धूल झाड़ने के संकेत और εἰς μαρτύριον αὐτοῖς का बल
  choice: अस्वीकार करने वालों के विरुद्ध चेतावनीपूर्ण गवाही
  alternative: उनके लिए अथवा उनके सामने गवाही; मुख्यतः उनसे अलगाव का संकेत
  rationale: अस्वीकार के प्रसंग में संकेत का प्रतिकूल बल प्रबल है, फिर भी यूनानी αὐτοῖς स्वयं ‘विरुद्ध’ शब्द का स्पष्ट प्रयोग नहीं करता। इसलिए मुख्य पाठ में प्रसंगगत अर्थ और पादटिप्पणी में शाब्दिक अस्पष्टता दोनों रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘तुम’ का बहुवचन रूप शिष्यों को दिए गए सम्बोधन के अनुरूप है। मुख्य पाठ में विरामचिह्न संकेतात्मक परिणाम को स्पष्ट करता है; दोनों पादटिप्पणी-चिह्न सम्बद्ध अंतिम कथन के बाद दिए गए हैं।
