  text: καὶ δαιμόνια πολλὰ ἐξέβαλλον, καὶ ἤλειφον ἐλαίῳ πολλοὺς ἀρρώστους καὶ ἐθεράπευον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/013.yaml
  text: And they were casting out many demons[a], and were anointing many sick people with oil and healing them.
translation:
  language: hi
  text: और वे बहुत-सी दुष्टात्माओं को निकालते थे, और बहुत-से बीमारों को तेल[a] लगाते थे और उन्हें चंगा करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जैतून का तेल।’
    reason: मूल शब्द सामान्यतः तेल को दर्शाता है, जो उस सांस्कृतिक परिवेश में प्रायः जैतून का तेल होता था।
lexical_decisions:
- source_word: δαιμόνια
  choice: दुष्टात्माओं
  rationale: δαιμόνιον यहाँ बुरी अलौकिक आत्माओं का द्योतक है। ‘दुष्टात्माओं’ आधुनिक हिन्दी में स्वाभाविक है और इस पद में प्रयुक्त यूनानी शब्द को निकटवर्ती ‘अशुद्ध आत्माओं’ की शब्दावली से नहीं मिलाता।
- source_word: πολλὰ / πολλοὺς
  choice: बहुत-सी / बहुत-से
  rationale: दोनों रूप साधारण मात्रात्मक अर्थ ‘बहुत’ को बनाए रखते हैं और अपने-अपने हिन्दी संज्ञा-रूप के अनुसार लिंग-सामंजस्य रखते हैं।
- source_word: ἐξέβαλλον
  choice: निकालते थे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया को हिन्दी का ‘ते थे’ रूप स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἤλειφον
  choice: तेल लगाकर
  rationale: ἀλείφω का अर्थ तेल लगाना या मलना है। ‘तेल लगाकर’ सामान्य पाठक के लिए स्वाभाविक है और ‘अभिषेक’ से जुड़ी बाद की धार्मिक धारणाएँ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἐλαίῳ
  choice: तेल
  rationale: ἔλαιον सामान्यतः तेल, और प्राचीन भूमध्यसागरीय संदर्भ में प्रायः जैतून का तेल, दर्शाता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἀρρώστους
  choice: बीमारों
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का सहज आधुनिक हिन्दी समतुल्य ‘बीमारों’ है।
- source_word: ἐθεράπευον
  choice: चंगा करते थे
  rationale: θεραπεύω का अर्थ रोगमुक्त या स्वस्थ करना है। ‘चंगा करते थे’ बाइबिलीय संदर्भ में परिचित होने के साथ सामान्य हिन्दी में बोधगम्य है और अपूर्ण भूतकाल की पुनरावृत्त क्रिया को भी दर्शाता है।
- source_word: καὶ
  choice: और
  rationale: दोहराया गया καί क्रियाओं को सरल कथात्मक क्रम में जोड़ता है; ‘और’ उसी समन्वयी शैली को बनाए रखता है।
theological_decisions:
- issue: तेल लगाने और चंगा करने के बीच संबंध
  choice: 'घटना को वर्णनात्मक रूप में प्रस्तुत किया गया है: वे बीमारों को तेल लगाकर चंगा करते थे।'
  alternative: तेल को स्वयं चंगाई का प्रभावकारी साधन बताना, या उसे पूर्णतः प्रतीकात्मक घोषित करना।
  rationale: पद तेल लगाने और चंगा करने दोनों क्रियाओं का वर्णन करता है, पर उनके धार्मिक या कारणात्मक संबंध की व्याख्या नहीं करता। अनुवाद इस तनाव को खुला रखता है और किसी बाद की संस्कार-संबंधी धारणा को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। अपूर्ण भूतकाल की पुनरावृत्त क्रियाओं के लिए ‘निकालते थे’ और ‘चंगा करते थे’ प्रयुक्त हैं। पादटिप्पणी-चिह्न को अर्थतः संबंधित ‘तेल’ के बाद रखा गया है।
