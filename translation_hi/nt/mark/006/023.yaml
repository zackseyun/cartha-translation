  text: καὶ ὤμοσεν ⸀αὐτῇ· ⸂Ὅ τι⸃ ἐάν με αἰτήσῃς δώσω σοι ἕως ἡμίσους τῆς βασιλείας μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/023.yaml
  text: And he swore to her[a], “Whatever you ask me, I will give you[b], up to half of my kingdom.”
translation:
  language: hi
  text: और उसने उससे शपथ खाकर कहा, “तुम मुझसे जो कुछ माँगोगी, मैं तुम्हें दूँगा—अपने आधे राज्य तक।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपने आधे राज्य तक” एक प्रचलित अतिशयोक्तिपूर्ण राजकीय प्रस्ताव था।
    reason: cultural_note
lexical_decisions:
- source_word: ὤμοσεν
  choice: शपथ खाकर कहा
  rationale: क्रिया ὀμνύω यहाँ गंभीर शपथ लेने को व्यक्त करती है। हिंदी में ‘उसने उससे शपथ खाकर कहा’ स्वाभाविक है और प्रतिज्ञा की गंभीरता बनाए रखता है।
- source_word: αὐτῇ
  choice: उससे
  rationale: स्त्रीलिंग एकवचन संबंधवाचक कर्म, जो प्रसंग में उस लड़की की ओर संकेत करता है।
- source_word: Ὅ τι ἐάν
  choice: जो कुछ
  rationale: यह अनिश्चित और व्यापक शर्त व्यक्त करता है। ‘जो कुछ’ आधुनिक हिंदी में स्वाभाविक रूप से ‘जो भी/कुछ भी’ का भाव देता है।
- source_word: με αἰτήσῃς
  choice: तुम मुझसे … माँगोगी
  rationale: αἰτέω का अर्थ यहाँ किसी व्यक्ति से कुछ माँगना है; हिंदी वाक्य-विन्यास के अनुसार कर्म ‘जो कुछ’ पहले रखा गया है।
- source_word: δώσω σοι
  choice: मैं तुम्हें दूँगा
  rationale: भविष्यकालीन प्रतिज्ञा को सीधे और स्पष्ट रूप में व्यक्त करता है।
- source_word: ἕως ἡμίσους
  choice: आधे … तक भी
  rationale: ἕως यहाँ समय नहीं, सीमा या परिमाण बताता है। ‘तक भी’ प्रस्ताव की अत्यधिक सीमा और जोर दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: τῆς βασιλείας μου
  choice: अपने … राज्य
  rationale: βασιλεία का अर्थ राज्य, शासन या राजसत्ता हो सकता है। इस राजदरबारी कथन में भौगोलिक-राजकीय क्षेत्र का अर्थ ‘राज्य’ सबसे सहज है; कर्ता के संदर्भ में ‘अपने’ प्राकृतिक हिंदी है।
theological_decisions:
- issue: हेरोदेस के कथन में βασιλεία का अर्थ
  choice: राज्य
  alternative: शासन / राजसत्ता
  rationale: शब्द में शासन या राजसत्ता का अर्थ संभव है, पर इस अतिशयोक्तिपूर्ण राजकीय प्रस्ताव में ‘अपने आधे राज्य’ की अभिव्यक्ति प्रसंग और प्रचलित राजकीय कथन-शैली के अनुकूल है। इससे कोई तकनीकी धर्मवैज्ञानिक अर्थ आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में लड़की के लिए स्त्रीलिंग ‘माँगोगी’ और हेरोदेस के लिए पुल्लिंग ‘दूँगा’ प्रयुक्त है। यूनानी की परिमाण-सूचक सीमा को ‘तक भी’ से बनाए रखते हुए हिंदी वाक्य को स्वाभाविक रखा गया है।
