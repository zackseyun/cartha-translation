  text: οἱ δὲ ἰδόντες αὐτὸν ⸂ἐπὶ τῆς θαλάσσης περιπατοῦντα⸃ ἔδοξαν ⸂ὅτι φάντασμά ἐστιν⸃ καὶ ἀνέκραξαν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/049.yaml
  text: But when they saw him walking on the sea[a], they thought that it was a ghost, and they cried out,
translation:
  language: hi
  text: लेकिन जब उन्होंने उसे समुद्र पर चलते देखा, तो उन्होंने सोचा कि वह कोई प्रेत है, और वे चिल्ला उठे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: लेकिन ... उन्होंने
  rationale: δέ का हल्का विरोधात्मक और कथानक को आगे बढ़ाने वाला भाव ‘लेकिन’ से व्यक्त होता है; οἱ पहले से उल्लिखित चेलों की ओर संकेत करता है।
- source_word: ἰδόντες αὐτὸν
  choice: जब उन्होंने उसे ... देखा
  rationale: अओरिस्ट कृदन्त को स्वाभाविक हिन्दी में कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: ἐπὶ τῆς θαλάσσης περιπατοῦντα
  choice: झील के ऊपर चलते
  rationale: ἐπί के साथ सम्बन्धकारक यहाँ पानी की सतह पर चलने का भाव देता है। प्रसंग गलील की झील का है, इसलिए आधुनिक हिन्दी में ‘झील’ अधिक स्वाभाविक है; ‘ऊपर’ सतह पर होने का असाधारण भाव स्पष्ट रखता है।
- source_word: ἔδοξαν
  choice: उन्होंने समझा
  rationale: δοκέω यहाँ उनकी भूलपूर्ण धारणा को व्यक्त करता है; ‘समझा’ सहज और स्पष्ट हिन्दी है।
- source_word: ὅτι φάντασμά ἐστιν
  choice: कि वह कोई प्रेत है
  rationale: φάντασμα किसी भुतही आकृति या अलौकिक आभास को सूचित करता है। ‘प्रेत’ संक्षिप्त और सामान्य हिन्दी समतुल्य है। यूनानी अप्रत्यक्ष कथन में वर्तमान काल रखता है, जिसे हिन्दी में स्वाभाविक रूप से बनाए रखा जा सकता है।
- source_word: καὶ ἀνέκραξαν
  choice: और वे चिल्ला उठे
  rationale: ἀνακράζω ऊँची और अचानक निकली पुकार दर्शाता है; ‘चिल्ला उठे’ उसकी तीव्रता और आरम्भिकता दोनों को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पानी पर यीशु के चलने का स्वरूप
  choice: झील के ऊपर चलते
  alternative: झील के किनारे चलते
  rationale: ἐπὶ τῆς θαλάσσης और निकटवर्ती कथानक का सीधा अर्थ पानी की सतह पर चलना है, न कि केवल उसके किनारे चलना।
- issue: φάντασμα की प्रकृति
  choice: प्रेत
  alternative: आभास / भुतही आकृति
  rationale: मूल शब्द देखी गई आकृति के बारे में चेलों की भयपूर्ण धारणा बताता है, पर उसकी तत्त्वमीमांसात्मक प्रकृति को निश्चित नहीं करता; पादटिप्पणी यह अर्थ-सीमा सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘समुद्र’ के बजाय प्रसंगानुकूल ‘झील’ चुना गया है, जबकि ‘ऊपर’ से मूल के पानी की सतह पर चलने का अर्थ स्पष्ट रखा गया है।
