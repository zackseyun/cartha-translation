source:
  edition: SBLGNT
  text: καὶ περίλυπος γενόμενος ὁ βασιλεὺς διὰ τοὺς ὅρκους καὶ τοὺς ⸀ἀνακειμένους οὐκ ἠθέλησεν ⸂ἀθετῆσαι αὐτήν⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/026.yaml
  text: And the king[a], becoming deeply grieved, because of his oaths and those reclining at the table[c][b], did not want to refuse her.
translation:
  language: hi
  text: राजा बहुत दुःखी हुआ, और अपनी शपथों और साथ भोजन कर रहे लोगों के कारण वह उसकी माँग अस्वीकार करना नहीं चाहता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίλυπος
  choice: बहुत दुःखी
  rationale: यह तीव्र दुःख को सहज और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γενόμενος
  choice: हुआ
  rationale: कृदन्त में निहित अवस्था-परिवर्तन को हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ βασιλεὺς
  choice: राजा
  rationale: यूनानी पद का मानक और मरकुस की कथन-शैली के अनुरूप अनुवाद है।
- source_word: διὰ τοὺς ὅρκους
  choice: अपनी शपथों के कारण
  rationale: διά के कारणवाचक अर्थ और बहुवचन ὅρκους को स्पष्ट रखता है; ‘अपनी’ प्रसंग से स्वाभाविक रूप से पूरित है।
- source_word: τοὺς ἀνακειμένους
  choice: साथ भोजन कर रहे लोगों
  rationale: भोजन के अवसर पर उपस्थित और मेज़ पर टिककर/लेटकर भोजन करने वालों का आशय स्वाभाविक हिन्दी में देता है, बिना उन्हें केवल सामान्य अतिथि कहने तक सीमित किए।
- source_word: οὐκ ἠθέλησεν
  choice: नहीं करना चाहता था
  rationale: यह असमर्थता के बजाय इच्छा या अनिच्छा को ठीक प्रकार व्यक्त करता है।
- source_word: ἀθετῆσαι αὐτήν
  choice: उसे मना करना
  rationale: इस प्रसंग में लड़की की माँग को अस्वीकार करने या उससे किए वचन को टालने का भाव है; ‘उसे मना करना’ सहज हिन्दी है।
theological_decisions:
- issue: कृदन्त γενόμενος और मुख्य कथन के बीच संबंध
  choice: ‘फिर भी’ द्वारा निहित विरोध व्यक्त किया गया
  alternative: 'किसी विरोधसूचक शब्द के बिना: ‘राजा बहुत दुःखी होकर ... उसे मना नहीं करना चाहता था’'
  rationale: यूनानी कृदन्त का संबंध व्याकरणतः खुला है, पर प्रसंग में राजा के गहरे दुःख और उसके इनकार न करने के बीच स्पष्ट रियायती विरोध है। ‘फिर भी’ इसे स्वाभाविक हिन्दी में सामने लाता है, बिना कोई सांप्रदायिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। प्राचीन भोज की शाब्दिक लेटकर खाने की मुद्रा को मुख्य पाठ में बोझिल बनाने के बजाय ‘साथ भोजन कर रहे लोगों’ से प्रसंगगत अर्थ दिया गया है।
