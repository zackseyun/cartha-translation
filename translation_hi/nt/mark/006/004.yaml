  edition: SBLGNT
  text: ⸂καὶ ἔλεγεν⸃ αὐτοῖς ὁ Ἰησοῦς ὅτι Οὐκ ἔστιν προφήτης ἄτιμος εἰ μὴ ἐν τῇ πατρίδι αὐτοῦ καὶ ἐν τοῖς ⸂συγγενεῦσιν αὐτοῦ⸃ καὶ ἐν τῇ οἰκίᾳ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/006/004.yaml
  text: And Jesus was saying to them[c][b][a], “A prophet is not without honor except in his hometown and among his relatives and in his household.”
translation:
  language: hi
  text: यीशु उनसे कह रहे थे, “नबी अपने नगर[a] में, अपने रिश्तेदारों[b] के बीच और अपने घराने[c] में ही आदर से वंचित होता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने मूल स्थान’ अथवा ‘अपनी जन्मभूमि’। यूनानी शब्द व्यक्ति के अपने उद्गम-स्थान को सूचित करता है; यहाँ नासरत के स्थानीय प्रसंग में ‘अपने नगर’ उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने कुटुंबियों’। यूनानी शब्द नातेदारी या एक ही कुल से जुड़े लोगों को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपने घर’। यूनानी शब्द भौतिक घर और उसमें रहने वाले परिवार या घराने—दोनों को सूचित कर सकता है। यहाँ ‘घराना’ इसे ‘रिश्तेदारों’ से अलग निकटतम पारिवारिक दायरे के रूप में व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहे थे
  rationale: अपूर्ण भूतकालिक रूप बोलने की जारी या पृष्ठभूमिगत क्रिया को दर्शा सकता है; ‘कह रहे थे’ इस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προφήτης
  choice: नबी
  rationale: यह προφήτης का प्रचलित, संक्षिप्त और आधुनिक हिन्दी में सहज धार्मिक पद है।
- source_word: ἄτιμος
  choice: आदर से वंचित
  rationale: यह सम्मान के अभाव को व्यक्त करता है और यूनानी की निषेधात्मक लोकोक्तिपरक रचना ‘आदर से वंचित नहीं... सिवाय’ को बनाए रखता है।
- source_word: εἰ μὴ
  choice: सिवाय
  rationale: निषेधात्मक कथन में यह शर्त नहीं, बल्कि अपवाद प्रकट करता है।
- source_word: πατρίδι
  choice: अपने नगर
  rationale: नासरत के स्थानीय प्रसंग में यह व्यक्ति के अपने मूल स्थान को सूचित करता है; ‘नगर’ आधुनिक हिन्दी में ‘देश’ से अधिक सटीक है।
- source_word: συγγενεῦσιν
  choice: अपने रिश्तेदारों
  rationale: यह समान कुल या नातेदारी के लोगों को दर्शाता है; ‘रिश्तेदार’ आधुनिक हिन्दी में स्वाभाविक है और अगले ‘घराने’ से अलग दायरा रखता है।
- source_word: οἰκίᾳ
  choice: अपने घराने
  rationale: οἰκία भौतिक घर या उसमें रहने वाले परिवार/घराने को सूचित कर सकता है। यहाँ क्रमशः संकुचित होते सामाजिक दायरों में ‘घराना’ उपयुक्त है, जबकि अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: καὶ ... καὶ ... καὶ
  choice: अपने नगर, अपने रिश्तेदारों और अपने घराने
  rationale: हिन्दी की स्वाभाविक सूची-रचना अपनाते हुए तीनों संचयी क्षेत्रों को स्पष्ट रखा गया है और प्रत्येक के साथ ‘अपने’ दोहराकर यूनानी बल को सुरक्षित रखा गया है।
theological_decisions:
- issue: यीशु द्वारा नबी के आदर के विषय में कही गई लोकोक्ति का दायरा
  choice: कथन को एक सामान्य लोकोक्ति के रूप में रखा गया है, जिसे प्रसंग यीशु पर लागू करता है; अनुवाद में कोई अतिरिक्त मसीही पहचान या अविश्वास-संबंधी व्याख्या नहीं जोड़ी गई।
  alternative: इसे स्पष्ट व्याख्यात्मक रूप से यीशु की मसीहा के रूप में अस्वीकृति या सामान्य अविश्वास के विषय में कथन बनाना।
  rationale: यूनानी पाठ परिचित परिवेश में नबी को आदर न मिलने की लोकोक्ति प्रस्तुत करता है। प्रसंगगत अनुप्रयोग स्पष्ट है, पर पद स्वयं उससे आगे की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नबी’ और ‘आदर से वंचित’ लोकोक्तिपरक तथा सम्मान-असम्मान के भाव को बनाए रखते हैं। वाक्य में ‘अपने’ की पुनरावृत्ति मूल पाठ के क्रमिक संकुचन—नगर, रिश्तेदार, घराना—को उभारती है।
