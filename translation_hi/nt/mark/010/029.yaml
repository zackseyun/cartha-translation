id: MRK.10.29
reference: Mark 10:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂ἔφη ὁ Ἰησοῦς⸃· Ἀμὴν λέγω ὑμῖν, οὐδείς ἐστιν ὃς ἀφῆκεν οἰκίαν ἢ ἀδελφοὺς ἢ ἀδελφὰς ἢ ⸂μητέρα ἢ πατέρα⸃ ἢ τέκνα ἢ ἀγροὺς ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/029.yaml
  text: Jesus said, “Truly I say to you, there is no one who has left house or brothers or sisters or mother or father or children or fields for my sake and for the sake of the gospel,”
translation:
  language: hi
  text: यीशु ने कहा, “मैं तुमसे सच कहता हूँ, ऐसा कोई नहीं है जिसने मेरे कारण और सुसमाचार के कारण घर या भाइयों या बहनों या माता या पिता या बच्चों या खेतों को छोड़ा हो,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: कहा
  rationale: यहाँ φημί का रूप यीशु के कथन का सरल परिचय देता है; ‘कहा’ स्वाभाविक है और कोई अतिरिक्त भाव नहीं जोड़ता।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: आरंभिक Ἀμήν कथन की सत्यता और गंभीरता पर बल देता है। यह हिंदी रूप सूत्रवत गंभीरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οὐδείς ἐστιν ὃς
  choice: ऐसा कोई नहीं है जिसने
  rationale: यह यूनानी अस्तित्वसूचक और सार्वभौमिक नकारात्मक रचना का स्पष्ट, स्वाभाविक हिंदी रूप है।
- source_word: ἀφῆκεν
  choice: छोड़ा हो
  rationale: सामान्य कथन में यह पूर्ण किए गए त्याग को व्यक्त करता है, पर ‘त्याग दिया’ या ‘परित्याग किया’ जैसी अधिक कठोर ध्वनि नहीं जोड़ता।
- source_word: οἰκίαν
  choice: घर
  rationale: यह निवास अथवा संपत्ति के ठोस अर्थ को स्वाभाविक रूप से रखता है; ‘परिवार’ अर्थ को अनावश्यक रूप से बदल देता।
- source_word: ἀδελφοὺς / ἀδελφὰς
  choice: भाइयों / बहनों
  rationale: मूल पाठ पुरुष और स्त्री सहोदरों का अलग-अलग उल्लेख करता है, इसलिए दोनों को अलग रखा गया है।
- source_word: τέκνα
  choice: बच्चों
  rationale: यह लिंग-निरपेक्ष रूप से संतान का सामान्य और सहज हिंदी शब्द है।
- source_word: ἀγρούς
  choice: खेतों
  rationale: ἀγρός खेती की भूमि या खेत को दर्शाता है; ‘खेत’ इसका निकट और ठोस हिंदी समतुल्य है।
- source_word: ἕνεκεν ἐμοῦ καὶ ἕνεκεν τοῦ εὐαγγελίου
  choice: मेरे कारण और सुसमाचार के कारण
  rationale: ‘कारण’ दोनों बार रखकर मूल पाठ की पुनरुक्ति और शिष्यत्व की दोहरी प्रेरणा को स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: परिवार और संपत्ति छोड़ने की भाषा को आवश्यकता से अधिक कठोर न बनाना
  choice: घर ... या बच्चों या खेतों को छोड़ा हो
  alternative: घर ... या बच्चों या खेतों का परित्याग किया हो
  rationale: ἀφῆκεν अलग होने अथवा पीछे छोड़ने की वास्तविक कीमत बताता है, पर यह अपने आप में पारिवारिक नैतिक दायित्वों के पूर्ण परित्याग का दावा नहीं करता। ‘छोड़ा हो’ शिष्यत्व के तनाव को बनाए रखता है, बिना उसे चुपचाप कठोर बनाने के।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गंभीर और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘सुसमाचार’ स्थापित और अर्थ-सटीक धार्मिक शब्द है। संबंधों तथा संपत्ति की सूची मूल क्रम में सुरक्षित रखी गई है।
