  text: οἱ δὲ εἶπαν αὐτῷ· Δυνάμεθα. ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· ⸀Τὸ ποτήριον ὃ ἐγὼ πίνω πίεσθε καὶ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθήσεσθε,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/039.yaml
  text: And they said to him[a], “We are able.” But Jesus said to them, “The cup that I drink, you will drink; and the baptism with which I am baptized[b], you will be baptized,”
translation:
  language: hi
  text: उन्होंने उससे कहा, “हम कर सकते हैं।”[a] लेकिन यीशु ने उनसे कहा, “जो प्याला मैं पीता हूँ, उसे तुम भी पियोगे; और जिस बपतिस्मे से मेरा बपतिस्मा हो रहा है,[b] उसी से तुम्हारा भी बपतिस्मा होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम समर्थ हैं।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “प्याला” और “बपतिस्मा” उस दुःख और नियति के रूपक हैं जिनसे यीशु शीघ्र ही गुज़रेंगे और जिनमें उनके शिष्य भी भागी होंगे।
    reason: cross_reference
lexical_decisions:
- source_word: Δυνάμεθα
  choice: हम कर सकते हैं
  rationale: यह वर्तमान काल में सामर्थ्य का स्वाभाविक और स्पष्ट हिन्दी कथन है। ‘हम समर्थ हैं’ अधिक औपचारिक विकल्प है, पर सामान्य पाठक के लिए कम सहज है।
- source_word: ποτήριον
  choice: प्याला
  rationale: मूल रूपक को बनाए रखता है और दुःख अथवा नियत अनुभव की व्याख्या को मुख्य पाठ में सीधे जोड़ने से बचता है।
- source_word: πίνω / πίεσθε
  choice: मैं पीता हूँ / तुम भी पियोगे
  rationale: यूनानी के वर्तमान और भविष्य काल तथा दोनों क्रियाओं के समानांतर संबंध को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: मानक बाइबलीय शब्द को रखते हुए उस रूपक को सुरक्षित रखता है जिसमें किसी अभिभूत कर देने वाले अनुभव से होकर गुजरना निहित है।
- source_word: βαπτίζομαι / βαπτισθήσεσθε
  choice: मैं बपतिस्मा पा रहा हूँ / तुम भी बपतिस्मा पाओगे
  rationale: ‘पाना’ हिन्दी में निष्क्रिय भाव को सहज ढंग से व्यक्त करता है और संज्ञा ‘बपतिस्मा’ के साथ मूल की शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: लेकिन यीशु ने उनसे कहा
  rationale: ‘लेकिन’ शिष्यों के आत्मविश्वासी उत्तर और यीशु के गंभीर प्रत्युत्तर के बीच δέ के हल्के विरोध को व्यक्त करता है।
theological_decisions:
- issue: प्याले और बपतिस्मे की रूपकात्मक भाषा
  choice: मुख्य पाठ में दोनों रूपकों को यथावत रखा गया है; टिप्पणी में उन्हें यीशु के आगामी दुःख और नियति से जोड़ा गया है।
  alternative: मुख्य पाठ में ही इन्हें ‘दुःख’, ‘मृत्यु’ या ‘शहादत’ कह देना।
  rationale: यूनानी पाठ स्वयं सशक्त बाइबलीय रूपकों का प्रयोग करता है। उन्हें व्याख्यात्मक शब्दों से बदलना उनके अर्थ-क्षेत्र और धर्मवैज्ञानिक तनाव को अनावश्यक रूप से सीमित कर देता।
- issue: बपतिस्मे का संस्कारात्मक अथवा रूपकात्मक आशय
  choice: βάπτισμα का अनुवाद ‘बपतिस्मा’ किया गया है, जबकि प्रसंग में उसके दुःख-संबंधी रूपकात्मक आशय को टिप्पणी स्पष्ट करती है।
  alternative: संस्कारात्मक भ्रम से बचने के लिए ‘डुबकी’, ‘विपत्ति’ या ‘कठिन परीक्षा’ कहना।
  rationale: मूल शब्द और उसकी प्रतिध्वनि को बनाए रखना उचित है; साथ ही तत्काल प्रसंग दिखाता है कि यहाँ भाषा रूपकात्मक है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘कर सकते हैं’ बोलचाल में स्वाभाविक है; ‘प्याला’ और ‘बपतिस्मा पाना’ बाइबलीय प्रतिध्वनि तथा मूल के रूपकों को सुरक्षित रखते हैं।
