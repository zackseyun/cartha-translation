lexical_decisions:
- source_word: Καὶ
  choice: जब
  rationale: ग्रीक संयोजक को कृदंत ἀκούσαντες के साथ स्वाभाविक हिन्दी कालवाचक उपवाक्य में समाहित किया गया; इससे कथा का क्रम बना रहता है।
- source_word: ἀκούσαντες
  choice: जब ... ने यह सुना
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले की घटना बताता है। हिन्दी में ‘जब ... ने यह सुना’ स्वाभाविक है; ‘यह’ का संकेत पिछली बातचीत की ओर है।
- source_word: οἱ δέκα
  choice: उन दसों
  rationale: मूल का अर्थ ‘वे दस’ है। ‘उन दसों’ प्रसंग में पहले से पहचाने गए शेष दस जनों को दर्शाता है, बिना मुख्य पाठ में ‘चेले’ जोड़ने के।
- source_word: ἤρξαντο
  choice: लगे
  rationale: ἄρχομαι का आरंभसूचक भाव हिन्दी की संयुक्त रचना ‘क्रोधित होने लगे’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἀγανακτεῖν
  choice: क्रोधित होने
  rationale: यह क्रिया प्रबल अप्रसन्नता और रोष व्यक्त करती है। ‘क्रोधित’ साधारण आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है; केवल ‘नाराज़’ की अपेक्षा इसकी तीव्रता अधिक है।
- source_word: περὶ Ἰακώβου καὶ Ἰωάννου
  choice: याकूब और यूहन्ना पर
  rationale: भाववाचक क्रिया के साथ περί रोष के लक्ष्य अथवा कारण को सूचित कर सकता है। ‘पर’ लक्षित क्रोध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: Ἰακώβου
  choice: याकूब
  rationale: Ἰάκωβος नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: Ἰωάννου
  choice: यूहन्ना
  rationale: Ἰωάννης नाम का प्रचलित हिन्दी बाइबलीय रूप।
