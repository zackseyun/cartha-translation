id: MRK.10.12
reference: Mark 10:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂αὐτὴ ἀπολύσασα τὸν ἄνδρα αὐτῆς γαμήσῃ ἄλλον⸃ μοιχᾶται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/012.yaml
  text: and if she divorces her husband and marries another man[a], she commits adultery.
translation:
  language: hi
  text: और यदि वह अपने पति को तलाक देकर किसी दूसरे पुरुष से विवाह करे,[a] तो वह व्यभिचार करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “अपने पति को विदा करके।” इस वैवाहिक संदर्भ में इसका अर्थ “तलाक देकर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पद इस कथन को पद 11 के समानांतर कथन से जोड़ता है।
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य का परिचय देता है; इस नैतिक कथन में ‘यदि’ स्वाभाविक और सटीक है।
- source_word: αὐτὴ
  choice: वह
  rationale: यूनानी में स्त्रीलिंग सर्वनाम स्पष्ट है। हिन्दी में प्रसंग से स्त्री का संदर्भ स्पष्ट रहता है; ‘वह स्वयं’ अनावश्यक रूप से बलाघाती होता।
- source_word: ἀπολύσασα
  choice: तलाक देकर
  rationale: शाब्दिक अर्थ ‘विदा करके/छोड़कर’ हो सकता है, पर वैवाहिक संदर्भ में इसका अर्थ विवाह-विच्छेद करना है। ‘तलाक देकर’ आधुनिक हिन्दी में यही कानूनी-वैवाहिक भाव स्पष्ट करता है।
- source_word: τὸν ἄνδρα αὐτῆς
  choice: अपने पति को
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ हो सकता है; वैवाहिक संदर्भ ‘पति’ को निर्धारित करता है। कर्ता के साथ संबंध के लिए ‘अपने’ स्वाभाविक हिन्दी है।
- source_word: γαμήσῃ ἄλλον
  choice: किसी दूसरे पुरुष से विवाह करे
  rationale: ἄλλον पुल्लिंग है; ‘दूसरे पुरुष’ मूल की लिंग-विशिष्टता को स्पष्ट रखता है। ‘विवाह करे’ आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: μοιχᾶται
  choice: व्यभिचार करती है
  rationale: वर्तमान काल के इस क्रियापद का सीधा और स्वाभाविक हिन्दी रूप यही है; यह किसी स्थायी पहचान का लेबल लगाने के बजाय कर्म को व्यक्त करता है।
theological_decisions:
- issue: कथन की लिंग-विशिष्ट भाषा को बनाए रखना
  choice: स्त्री कर्ता, उसके पति और दूसरे पुरुष का स्पष्ट उल्लेख
  alternative: यदि कोई पत्नी अपने पति को तलाक देकर किसी दूसरे से विवाह करे
  rationale: यूनानी पाठ स्त्री कर्ता और पुरुष पति/दूसरे पुरुष के विषय में स्पष्ट है। यह पद 11 में पुरुष के विषय में दिए गए समानांतर कथन को भी बनाए रखता है; इसे लिंग-निरपेक्ष नहीं किया गया।
- issue: ἀπολύω को शाब्दिक रूप में या वैवाहिक कानूनी पद के रूप में व्यक्त करना
  choice: तलाक देकर
  alternative: अपने पति को छोड़कर / विदा करके
  rationale: यहाँ प्रसंग विवाह के विघटन का है, केवल अलग रहने या घर से भेज देने का नहीं। इसलिए ‘तलाक’ स्रोत के वैवाहिक अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘तलाक देकर’ बोलचाल और कानूनी दोनों संदर्भों में समझ में आता है; ‘व्यभिचार करती है’ बाइबलीय नैतिक शब्दावली को स्पष्ट रखता है।
