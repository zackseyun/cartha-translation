source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ υἱὸς τοῦ ἀνθρώπου οὐκ ἦλθεν διακονηθῆναι ἀλλὰ διακονῆσαι καὶ δοῦναι τὴν ψυχὴν αὐτοῦ λύτρον ἀντὶ πολλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/045.yaml
  text: For even the Son of Man did not come to be served[a], but to serve, and to give his life as a ransom for many.
translation:
  language: hi
  text: क्योंकि मनुष्य का पुत्र भी सेवा पाने नहीं, बल्कि सेवा करने और बहुतों के लिए छुड़ौती के रूप में अपना जीवन देने आया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुतों के बदले छुड़ौती के रूप में अपना जीवन देने।” “के लिए” के पीछे का यूनानी पूर्वसर्ग स्थानापन्नता या विनिमय का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि ... भी
  rationale: γάρ पिछले कथन का आधार देता है और καί बल जोड़ता है; हिंदी में ‘क्योंकि ... भी’ दोनों कार्य स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी है और दानिय्येल-संबंधी प्रतिध्वनि को बनाए रखती है।
- source_word: διακονηθῆναι / διακονῆσαι
  choice: अपनी सेवा करवाने / सेवा करने
  rationale: एक ही हिंदी मूल से निष्क्रिय और सक्रिय रूप देने पर मूल का तीखा अलंकारिक विरोध स्पष्ट रहता है। ‘अपनी’ हिंदी में स्वाभाविकता और अभिप्रेत संबंध स्पष्ट करती है।
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: अपना जीवन
  rationale: यहाँ ψυχή मृत्यु तक अर्पित किए जाने वाले जीवन को दर्शाता है, केवल अमूर्त ‘आत्मा’ को नहीं।
- source_word: λύτρον
  choice: छुड़ौती
  rationale: यह रिहाई के लिए दिए जाने वाले मूल्य को संक्षेप में व्यक्त करता है और पद के धार्मिक भार को बनाए रखता है।
- source_word: ἀντὶ πολλῶν
  choice: बहुतों के लिए
  rationale: मुख्य पाठ में यह सहज और परिचित हिंदी है; ἀντί की अधिक स्पष्ट स्थानापन्नता या विनिमय की भावना पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: छुड़ौती के कथन में ἀντί का बल
  choice: मुख्य पाठ में ‘बहुतों के लिए’ और पादटिप्पणी में ‘बहुतों के बदले’
  alternative: मुख्य पाठ में ‘बहुतों के बदले’
  rationale: ἀντί स्वाभाविक रूप से विनिमय या स्थानापन्नता का भाव रखता है। सहज हिंदी मुख्य पाठ में रखी गई है, जबकि अधिक स्पष्ट अर्थ को पादटिप्पणी में देकर मूल की धार्मिक अर्थ-गहनता को न तो दबाया गया है, न उससे अधिक निश्चित बनाया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है। ‘सेवा करवाने/सेवा करने’ का समानांतर मूल की वक्तृता को बनाए रखता है।
