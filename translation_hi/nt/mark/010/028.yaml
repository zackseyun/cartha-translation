base_translation:
  language: en
  yaml_path: translation/nt/mark/010/028.yaml
  text: Peter began to say to him[a], “Look, we have left everything and followed you.”
translation:
  language: hi
  text: पतरस उससे कहने लगा, “देखिए, हम तो सब कुछ छोड़ दिया है और आपके पीछे हो लिए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤρξατο λέγειν
  choice: कहने लगा
  rationale: यह आरंभसूचक यूनानी रचना का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: ὁ Πέτρος
  choice: पतरस
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: αὐτῷ
  choice: उससे
  rationale: मूल के सर्वनाम को बनाए रखता है; संदर्भ से उसका संकेत यीशु की ओर स्पष्ट है।
- source_word: Ἰδοὺ
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने वाला संवाद-सूचक है; आदरसूचक रूप यीशु से संबोधन के अनुरूप और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἡμεῖς
  choice: हम तो
  rationale: स्पष्ट यूनानी सर्वनाम के बलाघात को हिन्दी के ‘तो’ से स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: ἀφήκαμεν πάντα
  choice: सब कुछ छोड़कर
  rationale: समग्र त्याग के दावे को बिना बढ़ाए या घटाए सहज हिन्दी में व्यक्त करता है।
- source_word: ἠκολουθήκαμέν σοι
  choice: आपके पीछे हो लिए हैं
  rationale: सिद्धकालीन क्रिया के आरंभ हो चुके और वर्तमान तक महत्त्व रखने वाले शिष्यत्व को व्यक्त करता है; ‘पीछे होना’ ἀκολουθέω के संबंधपरक अर्थ को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: शिष्यत्व में त्याग के विषय में पतरस का दावा
  choice: कथन को पतरस के अपने बलयुक्त दावे के रूप में सीधे प्रस्तुत किया गया है।
  alternative: ‘हमने सब कुछ त्याग दिया है’ कहना या यीशु के आगामी उत्तर की व्याख्या इसमें पहले से जोड़ना।
  rationale: पद स्वयं पतरस का कथन दर्ज करता है, उस पर कथावाचक का निर्णय नहीं देता; इसलिए न उसके दावे का समर्थन जोड़ा गया है, न उसे नरम किया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सहज मानक हिन्दी। यीशु के लिए आदरसूचक ‘आप’ रखा गया है। ‘हम तो’ मूल के स्पष्ट ἡμεῖς का बलाघात बचाता है।
