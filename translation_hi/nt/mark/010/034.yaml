source:
  edition: SBLGNT
  text: καὶ ἐμπαίξουσιν αὐτῷ καὶ ⸂ἐμπτύσουσιν αὐτῷ καὶ μαστιγώσουσιν αὐτὸν⸃ καὶ ⸀ἀποκτενοῦσιν, καὶ ⸂μετὰ τρεῖς ἡμέρας⸃ ἀναστήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/034.yaml
  text: And they will mock him[a], and spit on him, and flog him, and kill him, and after three days he will rise.
translation:
  language: hi
  text: वे उसका उपहास करेंगे, उस पर थूकेंगे, उसे कोड़े मारेंगे और उसे मार डालेंगे; फिर तीन दिन के बाद[a] वह जी उठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तीन दिन में।’ मरकुस के यूनानी पाठ में ‘तीन दिन के बाद’ है, जबकि अन्य पदों में यही समय ‘तीसरे दिन’ कहा गया है।
    reason: वैकल्पिक अनुवाद और समानांतर पदों की भिन्न समय-अभिव्यक्ति को स्पष्ट करना।
lexical_decisions:
- source_word: ἐμπαίξουσιν
  choice: उपहास करेंगे
  rationale: यह क्रिया तिरस्कारपूर्ण हँसी और अपमान को व्यक्त करती है। ‘उपहास करेंगे’ आधुनिक, गरिमापूर्ण और अर्थ की दृष्टि से सटीक है।
- source_word: ἐμπτύσουσιν αὐτῷ
  choice: उस पर थूकेंगे
  rationale: यह पदबंध उसके विरुद्ध अपमानजनक ढंग से थूकने को दर्शाता है; ‘उस पर थूकेंगे’ स्वाभाविक हिन्दी में इसकी तीव्रता बनाए रखता है।
- source_word: μαστιγώσουσιν
  choice: उसे कोड़े मारेंगे
  rationale: यह न्यायिक या दंडात्मक पिटाई का बोध कराता है। ‘कोड़े मारेंगे’ सामान्य पाठक के लिए स्पष्ट है और पुरातन शब्दावली से बचता है।
- source_word: ἀποκτενοῦσιν
  choice: उसे मार डालेंगे
  rationale: मूल क्रिया सीधे हत्या या जान लेने को व्यक्त करती है। ‘मार डालेंगे’ सहज हिन्दी है और ‘मृत्युदंड देंगे’ जैसी अतिरिक्त कानूनी छाया नहीं जोड़ती।
- source_word: μετὰ τρεῖς ἡμέρας
  choice: तीन दिन के बाद
  rationale: कर्मकारक के साथ μετά का सामान्य अर्थ ‘के बाद’ है। यह मरकुस की विशिष्ट अभिव्यक्ति को समानांतर पदों के ‘तीसरे दिन’ से मिलाने का प्रयास किए बिना सुरक्षित रखता है।
- source_word: ἀναστήσεται
  choice: जी उठेगा
  rationale: भविष्यकालीन मध्य रूप यहाँ अकर्मक अर्थ में उठने को व्यक्त करता है। पुनरुत्थान के संदर्भ में ‘जी उठेगा’ स्वाभाविक और स्पष्ट हिन्दी है; इसे कर्मवाच्य ‘जिलाया जाएगा’ नहीं बनाया गया है।
theological_decisions:
- issue: पुनरुत्थान की वाच्य-रचना
  choice: वह जी उठेगा
  alternative: उसे जिलाया जाएगा
  rationale: ἀναστήσεται का रूप यहाँ अकर्मक ‘उठेगा’ का समर्थन करता है। यह अनुवाद इस पद की अपनी अभिव्यक्ति बनाए रखता है और परमेश्वर द्वारा यीशु को जिलाए जाने संबंधी अन्य नए नियम के कथनों के साथ उपस्थित धर्मवैचारिक तनाव को मिटाता नहीं है।
- issue: पुनरुत्थान का समय
  choice: तीन दिन के बाद
  alternative: तीन दिन में; तीसरे दिन
  rationale: मुख्य पाठ μετά के सामान्य अर्थ ‘के बाद’ को सीधे व्यक्त करता है। ‘तीसरे दिन’ लिखना समानांतर सुसमाचार-पदों के अनुरूप सामंजस्य बैठाना होता, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल रूप अपनाया गया है। लगातार क्रियाओं में मूल यूनानी की तीव्र क्रमबद्धता रखी गई है, पर स्वाभाविक हिन्दी के लिए अंतिम दो घटनाओं से पहले ‘और’ तथा अंतिम परिणाम के लिए ‘फिर’ रखा गया है।
