  text: ⸀Καὶ ⸀ἐπηρώτων αὐτὸν εἰ ἔξεστιν ἀνδρὶ γυναῖκα ἀπολῦσαι, πειράζοντες αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/002.yaml
  text: And they were asking him whether it is lawful for a man to divorce a wife[a], testing him.
translation:
  language: hi
  text: और वे उसे परखते हुए उससे पूछ रहे थे, “क्या किसी पुरुष के लिए अपनी पत्नी को तलाक देना वैध है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या किसी पति के लिए अपनी पत्नी को तलाक देना वैध है?”
    reason: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ दोनों हो सकता है; यह विकल्प वैवाहिक अर्थ को अधिक प्रत्यक्ष बनाता है।
lexical_decisions:
- source_word: ἐπηρώτων
  choice: पूछ रहे थे
  rationale: अपूर्ण भूतकाल चल रही या बार-बार की जा रही पूछताछ का संकेत देता है; इसलिए साधारण ‘पूछा’ की अपेक्षा ‘पूछ रहे थे’ अधिक सटीक है।
- source_word: ἔξεστιν
  choice: वैध है
  rationale: यहाँ प्रश्न केवल अनुमति का नहीं, बल्कि व्यवस्था के अधीन कानूनी-धार्मिक वैधता का है; ‘वैध’ इस न्यायिक भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνδρὶ
  choice: किसी पुरुष के लिए
  rationale: ἀνήρ का अर्थ ‘पुरुष’ या ‘पति’ दोनों हो सकता है। मूल के सामान्य, प्रतिनिधिक एकवचन को बनाए रखने के लिए ‘किसी पुरुष’ चुना गया है; वैवाहिक संदर्भ ‘अपनी पत्नी’ से स्पष्ट है।
- source_word: γυναῖκα
  choice: अपनी पत्नी को
  rationale: तलाक के संदर्भ में γυνή का अर्थ स्पष्टतः ‘पत्नी’ है। हिन्दी में ‘अपनी पत्नी को तलाक देना’ स्वाभाविक मुहावरा है और वैवाहिक संबंध को स्पष्ट करता है।
- source_word: ἀπολῦσαι
  choice: तलाक देना
  rationale: यद्यपि क्रिया का सामान्य अर्थ ‘छोड़ देना’ या ‘विदा कर देना’ हो सकता है, इस वैवाहिक-कानूनी संदर्भ में इसका रूढ़ अर्थ ‘तलाक देना’ है।
- source_word: πειράζοντες
  choice: उसे परखते हुए
  rationale: कृदन्त यीशु की परीक्षा लेने वाली, संभवतः विरोधपूर्ण पूछताछ बताता है। ‘परखते हुए’ मूल भाव को रखता है, पर ‘फँसाने की कोशिश करते हुए’ जैसी व्याख्यात्मक वृद्धि नहीं करता।
- source_word: Καὶ
  choice: और
  rationale: सरल संयोजक कथा के प्रवाह को बनाए रखता है और ऐसा कोई अतिरिक्त कालगत अर्थ नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
theological_decisions:
- issue: वैवाहिक कानूनी प्रश्न में ἀνδρὶ का अर्थ
  choice: किसी पुरुष के लिए
  alternative: किसी पति के लिए
  rationale: यूनानी शब्द ‘पुरुष’ और ‘पति’ दोनों अर्थ दे सकता है। मुख्य पाठ सामान्य पुरुषवाचक रूप को सुरक्षित रखता है, जबकि ‘अपनी पत्नी’ वैवाहिक अर्थ स्पष्ट कर देता है; पादटिप्पणी वास्तविक शब्दार्थ-विकल्प बताती है।
- issue: πειράζοντες में विरोधपूर्ण आशय की अभिव्यक्ति
  choice: उसे परखते हुए
  alternative: उसे फँसाने की कोशिश करते हुए
  rationale: प्रसंग में विरोधपूर्ण उद्देश्य संभव है, पर मूल कृदन्त स्वयं ‘फँसाने’ को स्पष्ट रूप से नहीं कहता। अतः कम व्याख्यात्मक अनुवाद चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कानूनी-विवाद के प्रसंग के अनुरूप है। ‘तलाक’ सामान्य आधुनिक शब्द है, और ‘वैध’ ἔξεστιν की विधिक सूक्ष्मता को बनाए रखता है।
