  source_fidelity: The translation accurately represents the imperfect ἐπηρώτων with “पूछ रहे थे,” the legal-permissive force of ἔξεστιν with “वैध है,” the marital sense of γυναῖκα/ἀπολῦσαι with “अपनी पत्नी को तलाक देना,” and the accompanying participle πειράζοντες with “उसे परखते हुए.” The generic-singular sense of ἀνδρί is retained as “किसी पुरुष के लिए.”
  naturalness: The Hindi is fluent, modern, and appropriately restrained for a legal-religious dispute. “क्या किसी पुरुष के लिए अपनी पत्नी को तलाक देना वैध है?” is idiomatic and clear. The participial opening naturally conveys that their questioning was a test.
  terminology: “तलाक देना” is the appropriate contemporary equivalent in this marital-legal context, and “वैध” suitably conveys the question of permissibility. The footnote gives the genuine lexical alternative “पति” without forcing an interpretive choice into the main text.
