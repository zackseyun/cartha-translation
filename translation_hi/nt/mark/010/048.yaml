  text: καὶ ἐπετίμων αὐτῷ πολλοὶ ἵνα σιωπήσῃ· ὁ δὲ πολλῷ μᾶλλον ἔκραζεν· Υἱὲ Δαυίδ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/048.yaml
  text: And many were rebuking him so that he would be silent[a], but he was crying out all the more, “Son of David, have mercy on me!”
translation:
  language: hi
  text: बहुत से लोग उसे डाँट रहे थे कि वह चुप हो जाए; पर वह और भी अधिक पुकारता रहा, “दाऊद के पुत्र[a], मुझ पर दया कीजिए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दाऊद का पुत्र” एक राजकीय-मसीहाई उपाधि है। इसके भाव को “मसीह” भी कहा जा सकता है, पर यहाँ यूनानी पाठ के शब्दों को सुरक्षित रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπετίμων
  choice: डाँट रहे थे
  rationale: अपूर्ण काल जारी या बार-बार की जा रही कार्रवाई दिखाता है। ‘डाँट रहे थे’ भीड़ के कठोरता से चुप कराने के प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πολλοὶ
  choice: बहुत से लोग
  rationale: यह विशेषण संज्ञा की तरह प्रयुक्त है। ‘बहुत से लोग’ मूल के अनिश्चित बहुवचन को बनाए रखता है और ‘भीड़’ जैसी अधिक विशिष्ट धारणा नहीं जोड़ता।
- source_word: ἵνα σιωπήσῃ
  choice: कि वह चुप हो जाए
  rationale: यह डाँटने का उद्देश्य व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: πολλῷ μᾶλλον
  choice: और भी अधिक
  rationale: यह तुलनात्मक मुहावरे को बनाए रखता है और मूल में स्पष्ट रूप से न कही गई ऊँची आवाज़ की धारणा नहीं जोड़ता।
- source_word: ἔκραζεν
  choice: पुकारता रहा
  rationale: अपूर्ण काल निरंतर पुकारने का भाव देता है। ‘पुकारता रहा’ आग्रह और जारी कार्रवाई दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: Υἱὲ Δαυίδ
  choice: दाऊद के पुत्र
  rationale: सम्बोधन के रूप में शाब्दिक उपाधि सुरक्षित रखी गई है, ताकि उसके राजकीय और मसीहाई अर्थ को व्याख्यात्मक शब्द ‘मसीह’ से प्रतिस्थापित न किया जाए।
- source_word: ἐλέησόν με
  choice: मुझ पर दया कीजिए
  rationale: यह विनती को स्वाभाविक, सम्मानपूर्ण और धर्मवैचारिक रूप से अनावश्यक विस्तार के बिना व्यक्त करता है।
theological_decisions:
- issue: ‘दाऊद के पुत्र’ का मसीहाई महत्त्व
  choice: उपाधि को ‘दाऊद के पुत्र’ के रूप में बनाए रखना
  alternative: ‘हे मसीह’ कहकर अर्थ स्पष्ट करना
  rationale: यूनानी पाठ सीधे Υἱὲ Δαυίδ कहता है। मूल उपाधि को सुरक्षित रखने से उसका राजवंशीय-मसीहाई संकेत बना रहता है और अनुवाद व्याख्या को पाठ का स्थान नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। जारी कार्रवाइयों को ‘डाँट रहे थे’ और ‘पुकारता रहा’ से व्यक्त किया गया है। यीशु को की गई विनती में सम्मानसूचक ‘कीजिए’ सामान्य हिन्दी प्रयोग के अनुरूप है।
