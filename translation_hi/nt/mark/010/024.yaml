source:
  edition: SBLGNT
  text: οἱ δὲ μαθηταὶ ἐθαμβοῦντο ἐπὶ τοῖς λόγοις αὐτοῦ. ὁ δὲ Ἰησοῦς πάλιν ἀποκριθεὶς λέγει αὐτοῖς· Τέκνα, πῶς δύσκολόν ⸀ἐστιν εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/024.yaml
  text: But the disciples were astonished at his words. Jesus answered again and said to them[a], “Children, how difficult it is to enter the kingdom of God!”
translation:
  language: hi
  text: पर चेले उसकी बातों पर चकित हो रहे थे। तब यीशु ने फिर उनसे कहा[a], “बच्चो, परमेश्वर के राज्य में प्रवेश करना कितना कठिन है!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “बच्चो, जो धन पर भरोसा रखते हैं, उनके लिए परमेश्वर के राज्य में प्रवेश करना कितना कठिन है!”
    reason: textual_variant
lexical_decisions:
- source_word: ἐθαμβοῦντο
  choice: चकित हो रहे थे
  rationale: अपूर्ण काल उनकी चल रही विस्मयपूर्ण प्रतिक्रिया को दिखाता है; ‘चकित हो रहे थे’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया की तीव्रता को बनाए रखता है।
- source_word: ἐπὶ τοῖς λόγοις αὐτοῦ
  choice: उसकी बातों पर
  rationale: ἐπί के साथ दत्तिव यहाँ उनके चकित होने के आधार या विषय को सूचित करता है; यह प्रयोग हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: πάλιν ἀποκριθεὶς λέγει αὐτοῖς
  choice: तब यीशु ने फिर उनसे कहा
  rationale: ‘फिर’ पुनः बोलने का भाव सुरक्षित रखता है। यूनानी का शाब्दिक ‘उत्तर देकर कहता है’ हिन्दी में बोझिल होता; प्रसंग में ‘कहा’ उत्तरात्मक कथन को पर्याप्त रूप से व्यक्त करता है।
- source_word: Τέκνα
  choice: बच्चो
  rationale: यह स्नेहपूर्ण प्रत्यक्ष संबोधन है। ‘बच्चो’ आत्मीयता को बनाए रखता है, पर मूल में न होने वाला ‘मेरे’ नहीं जोड़ता।
- source_word: πῶς δύσκολόν ἐστιν
  choice: कितना कठिन है
  rationale: ‘कितना’ विस्मयादिबोधक πῶς की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν
  choice: परमेश्वर के राज्य में प्रवेश करना
  rationale: यह उद्देश्य/गति और infinitive की विषयवस्तु को स्पष्ट, प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ‘जो धन पर भरोसा रखते हैं’ वाला विस्तृत पाठ मुख्य पाठ में शामिल किया जाए
  choice: 'SBLGNT के संक्षिप्त पाठ का अनुसरण: ‘परमेश्वर के राज्य में प्रवेश करना कितना कठिन है’'
  alternative: ‘जो धन पर भरोसा रखते हैं, उनके लिए परमेश्वर के राज्य में प्रवेश करना कितना कठिन है’
  rationale: दिया गया यूनानी स्रोत संक्षिप्त पाठ रखता है। विस्तृत पाठ कथन को धन पर भरोसा रखने वालों तक सीमित करके व्याख्यात्मक तनाव कम करता है; इसलिए उसे मुख्य पाठ में न जोड़कर पाठांतर के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘चेले’ सामान्य पाठकों के लिए परिचित है; संबोधन ‘बच्चो’ आत्मीय है। वाक्य-विन्यास हिन्दी की स्वाभाविक कथात्मक शैली के अनुसार रखा गया है।
