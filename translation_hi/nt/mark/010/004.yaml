  text: They said[b][a], “Moses permitted us to write a certificate of divorce and send her away.”
translation:
  language: hi
  text: उन्होंने कहा, “मूसा ने तलाक़ का पत्र लिखकर पत्नी को विदा कर देने की अनुमति दी।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पत्नी को विदा कर देने” का अर्थ यहाँ “उसे तलाक़ दे देने” से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ εἶπαν
  choice: उन्होंने कहा
  rationale: यह पहले उल्लिखित फरीसियों के उत्तर को स्वाभाविक हिन्दी में व्यक्त करता है। δέ का हल्का संयोजक अथवा विरोधसूचक भाव यहाँ अलग शब्द के बिना भी संदर्भ से स्पष्ट है।
- source_word: Ἐπέτρεψεν
  choice: अनुमति दी
  rationale: ἐπιτρέπω स्पष्ट रूप से अनुमति देने का अर्थ रखता है; इससे आगे के संदर्भ में मूसा की रियायत और परमेश्वर की सृष्टि-संबंधी मंशा के बीच का अंतर बना रहता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: व्यक्तिनाम का मानक हिन्दी रूप।
- source_word: βιβλίον ἀποστασίου
  choice: तलाक़ का पत्र
  rationale: यह व्यवस्थाविवरण 24:1 में उल्लिखित तलाक़ के लिखित कानूनी दस्तावेज़ को दर्शाता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: γράψαι
  choice: लिखकर
  rationale: ग्रीक अनंत क्रिया ‘लिखना’ बताती है; हिन्दी में ‘लिखकर ... विदा कर देने’ से दोनों संबंधित कार्य स्वाभाविक ढंग से जुड़ते हैं।
- source_word: καὶ ἀπολῦσαι
  choice: पत्नी को विदा कर देने
  rationale: विवाह-विच्छेद के संदर्भ में ἀπολύω पत्नी को छोड़ने या तलाक़ देने का कानूनी भाव रखता है। ‘विदा कर देने’ मूल क्रिया की ‘भेज देने’ वाली छवि बचाता है; ‘पत्नी को’ संदर्भ से स्पष्ट पूरक है।
theological_decisions:
- issue: तलाक़ संबंधी मूसा के निर्देश का स्वरूप
  choice: मूसा ने अनुमति दी
  alternative: मूसा ने तलाक़ का पत्र लिखने की आज्ञा दी
  rationale: Ἐπέτρεψεν का अर्थ ‘अनुमति दी’ है, ‘आज्ञा दी’ नहीं। यह अगले पदों में कठोर हृदय के कारण दी गई रियायत और परमेश्वर की आरंभिक मंशा के बीच के तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। कानूनी भाव के लिए ‘तलाक़ का पत्र’ और मूल क्रियात्मक बिंब को बनाए रखने के लिए ‘विदा कर देने’ चुना गया है।
