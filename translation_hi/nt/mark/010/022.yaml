  text: ὁ δὲ στυγνάσας ἐπὶ τῷ λόγῳ ἀπῆλθεν λυπούμενος, ἦν γὰρ ἔχων κτήματα πολλά.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/022.yaml
  text: But he[a], becoming gloomy at the word, went away grieving[c][b], for he had many possessions.
translation:
  language: hi
  text: पर इस बात पर[b] उसका चेहरा उतर गया[a], और वह दुःखी होकर चला गया, क्योंकि उसके पास बहुत सारी संपत्ति थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह मायूस हो गया”; यूनानी शब्द ऐसी उदासी का संकेत देता है जो चेहरे पर दिखाई पड़ती है।
    reason: lexical_alternative
  - marker: b
    text: या “इस कथन के कारण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: στυγνάσας
  choice: उसका चेहरा उतर गया
  rationale: यह स्वाभाविक आधुनिक हिन्दी में दिखाई देनेवाली उदासी या मुख-मुद्रा के बुझ जाने को व्यक्त करता है; यूनानी कृदंत की भावात्मक और दृश्य दोनों छायाएँ बनी रहती हैं।
- source_word: ἐπὶ τῷ λόγῳ
  choice: इस बात पर
  rationale: यह प्रतिक्रिया के अवसर या कारण—दोनों संभावित अर्थों को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: ἀπῆλθεν
  choice: चला गया
  rationale: कथा में वहाँ से चले जाने की गति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λυπούμενος
  choice: दुःखी होकर
  rationale: जाते समय बनी हुई उसकी गहरी उदासी को व्यक्त करता है, बिना उसमें क्रोध या विद्रोह जोड़ने के।
- source_word: κτήματα πολλά
  choice: बहुत सारी संपत्ति
  rationale: κτήματα उसकी बहुतायत में मौजूद संपत्ति और मिल्कियत को सूचित करता है; हिन्दी में यह प्रयोग स्वाभाविक और व्यापक है।
- source_word: ἦν γὰρ ἔχων
  choice: क्योंकि उसके पास … थी
  rationale: यूनानी परिप्रयुक्त रचना द्वारा व्यक्त लगातार स्वामित्व की स्थिति को सहज हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: यीशु की बात पर उस व्यक्ति की भावात्मक प्रतिक्रिया
  choice: दिखाई देनेवाली उदासी और दुःख को रखा गया है, पर कोई नैतिक निर्णय नहीं जोड़ा गया।
  alternative: उसे क्रोधित, विद्रोही या केवल निराश बताना।
  rationale: यूनानी पाठ उसके मुख के उतरने और दुःखी होकर जाने का वर्णन करता है; वह स्पष्ट रूप से क्रोध या उसके मन की कोई और नैतिक अवस्था नहीं बताता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। “उसका चेहरा उतर गया” बोलचाल में समझ आनेवाला है, फिर भी प्रसंग के गंभीर भाव और यूनानी के दृश्य बिंब को बनाए रखता है।
