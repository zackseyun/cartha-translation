  text: ἕνεκεν τούτου καταλείψει ἄνθρωπος τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα ⸂καὶ προσκολληθήσεται πρὸς τὴν γυναῖκα αὐτοῦ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/007.yaml
  text: For this reason a man will leave his father and mother and be joined to his wife,[a]
translation:
  language: hi
  text: इस कारण पुरुष अपने पिता और माता को छोड़ देगा और अपनी पत्नी से जुड़ जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी पत्नी से लिपट जाएगा।” यूनानी क्रिया निकट और दृढ़ लगाव पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕνεκεν τούτου
  choice: इस कारण
  rationale: यह स्वाभाविक आधुनिक हिन्दी में कारणसूचक अभिव्यक्ति है और यूनानी पद का व्याख्यात्मक बल बनाए रखती है।
- source_word: καταλείψει
  choice: छोड़ देगा
  rationale: भविष्यकाल के सीधे अर्थ को व्यक्त करता है; प्रसंग माता-पिता का परित्याग करने की निंदा नहीं, बल्कि उनके घर से अलग होकर नया वैवाहिक संबंध स्थापित करने का है।
- source_word: ἄνθρωπος
  choice: पुरुष
  rationale: यद्यपि यह शब्द सामान्यतः ‘मनुष्य’ भी हो सकता है, यहाँ ‘अपनी पत्नी’ के साथ जोड़ी जाने के कारण पुरुष विशेष अभिप्रेत है।
- source_word: τὸν πατέρα αὐτοῦ καὶ τὴν μητέρα
  choice: अपने पिता और माता को
  rationale: दोनों संबंधों को स्पष्ट और सहज हिन्दी में प्रस्तुत करता है; ‘अपने’ दोनों संज्ञाओं पर लागू होता है।
- source_word: προσκολληθήσεται
  choice: जुड़ा रहेगा
  rationale: यह वैवाहिक संबंध में घनिष्ठ और स्थायी लगाव का भाव सहज हिन्दी में देता है। केवल ‘जुड़ जाएगा’ की तुलना में ‘जुड़ा रहेगा’ निरंतर संबंध को अधिक स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: πρὸς τὴν γυναῖκα αὐτοῦ
  choice: अपनी पत्नी से
  rationale: विवाह के प्रसंग में γυνή का अर्थ स्पष्टतः ‘पत्नी’ है; हिन्दी में ‘जुड़ना’ के साथ ‘से’ स्वाभाविक परसर्ग है।
theological_decisions:
- issue: विवाह-संबंधी उद्धरण में लिंग-विशिष्ट प्रतिनिधि भाषा
  choice: पुरुष … अपनी पत्नी
  alternative: मनुष्य … अपने जीवनसाथी
  rationale: प्रसंग पुरुष और उसकी पत्नी की जोड़ी को स्पष्ट करता है; इसलिए मूल की लिंग-विशिष्ट भाषा को सामान्यीकृत नहीं किया गया।
- issue: प्रसκολληθήσεται में वैवाहिक लगाव का स्वरूप
  choice: जुड़ा रहेगा
  alternative: अपनी पत्नी से लिपटा रहेगा / अपनी पत्नी से मिल जाएगा
  rationale: अनुवाद घनिष्ठ और स्थायी वैवाहिक संबंध को व्यक्त करता है, पर पद में निहित अर्थ को किसी विशिष्ट सांप्रदायिक वैवाहिक सिद्धांत तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘पुरुष’ और ‘पत्नी’ मूल प्रसंग की लिंग-विशिष्टता रखते हैं। ‘जुड़ा रहेगा’ सामान्य पाठक के लिए स्वाभाविक है और पादटिप्पणी अधिक शाब्दिक ‘लिपटा रहेगा’ का विकल्प देती है।
