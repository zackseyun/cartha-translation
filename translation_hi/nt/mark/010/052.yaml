  text: ⸂καὶ ὁ⸃ Ἰησοῦς εἶπεν αὐτῷ· Ὕπαγε, ἡ πίστις σου σέσωκέν σε. καὶ ⸀εὐθὺς ἀνέβλεψεν, καὶ ἠκολούθει ⸀αὐτῷ ἐν τῇ ὁδῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/052.yaml
  text: And Jesus said to him[a], “Go[c][b]; your faith has saved you.” And immediately he regained his sight and followed him on the road.
translation:
  language: hi
  text: और यीशु ने उससे कहा, “जा; तेरे विश्वास[a] ने तुझे बचा लिया है[b]।” वह तुरन्त फिर देखने लगा और रास्ते पर[c] उसके पीछे चलता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे भरोसे ने।” यहाँ “विश्वास” का अर्थ यीशु पर भरोसा करना भी है।
    reason: alternative_reading
  - marker: b
    text: या, “तुझे चंगा कर दिया है” अथवा “तुझे स्वस्थ कर दिया है।” यूनानी क्रिया चंगाई के साथ-साथ बचाव या उद्धार को भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: c
    text: या, “मार्ग में।” यूनानी अभिव्यक्ति ठोस रास्ते के साथ यात्रा या ‘मार्ग’ का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὕπαγε
  choice: जा
  rationale: एकवचन आज्ञार्थक का सीधा और स्वाभाविक हिन्दी रूप; इसमें यूनानी पाठ में निहित न होने वाला कोई अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ उस व्यक्ति का यीशु पर भरोसा अभिप्रेत है। ‘विश्वास’ प्रमुख अर्थ को बनाए रखता है, जबकि ‘भरोसा’ सम्भव विकल्प है।
- source_word: σέσωκέν σε
  choice: तुझे बचा लिया है
  rationale: σῴζω चंगा करने, संकट से बचाने और व्यापक उद्धार—इन अर्थों को समेट सकता है। ‘बचा लिया है’ शारीरिक चंगाई तक अर्थ को सीमित किए बिना इस व्यापकता को बनाए रखता है; पूर्णकालिक रूप के परिणामकारी भाव को ‘लिया है’ से व्यक्त किया गया है।
- source_word: εὐθύς
  choice: तुरन्त
  rationale: मरकुस की तीव्र कथात्मक गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀνέβλεψεν
  choice: फिर देखने लगा
  rationale: अंधे व्यक्ति के प्रसंग में क्रिया का अर्थ दृष्टि वापस पाना है; यह अनुवाद केवल ‘ऊपर देखा’ जैसे भ्रामक शाब्दिक अर्थ से बचता है।
- source_word: ἠκολούθει
  choice: पीछे चलता रहा
  rationale: अपूर्ण भूतकाल चलती हुई क्रिया दिखाता है; ‘चलता रहा’ उस निरन्तरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῇ ὁδῷ
  choice: रास्ते पर
  rationale: ठोस यात्रा-स्थल को स्पष्ट रखता है और साथ ही ‘मार्ग’ के सम्भावित शिष्यत्व-संबंधी संकेत को नकारता नहीं है।
- source_word: καὶ ὁ Ἰησοῦς
  choice: और यीशु
  rationale: καί को ‘और’ के रूप में रखकर कथा का संयोजक प्रवाह सुरक्षित किया गया है।
theological_decisions:
- issue: यीशु की घोषणा में σῴζω का अर्थ
  choice: तुझे बचा लिया है
  alternative: तुझे चंगा कर दिया है / तुझे स्वस्थ कर दिया है
  rationale: अगला वाक्य दृष्टि लौटने की शारीरिक चंगाई स्पष्ट करता है, पर यीशु की घोषणा में प्रयुक्त यूनानी क्रिया बचाव, चंगाई और उद्धार की व्यापक अर्थ-सीमा रखती है। मुख्य पाठ उसे केवल शारीरिक उपचार तक सीमित नहीं करता।
- issue: πίστις का आशय
  choice: विश्वास
  alternative: भरोसा
  rationale: प्रसंग में यह यीशु पर भरोसे को दर्शाता है। ‘विश्वास’ मूल धार्मिक शब्दावली और उसके व्यापक अर्थ को बनाए रखता है, जबकि पादटिप्पणी अधिक बोलचाल का सम्भव रूप देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के एकवचन आज्ञार्थक के लिए संक्षिप्त ‘जा’ रखा गया है। ‘बचा लिया है’ जानबूझकर ‘उद्धार किया है’ की अपेक्षा अधिक सामान्य और अर्थ-व्यापक है, ताकि चंगाई और व्यापक उद्धार के बीच मूल पाठ का तनाव बना रहे।
