source:
  edition: SBLGNT
  text: Καὶ ἐκπορευομένου αὐτοῦ εἰς ὁδὸν προσδραμὼν εἷς καὶ γονυπετήσας αὐτὸν ἐπηρώτα αὐτόν· Διδάσκαλε ἀγαθέ, τί ποιήσω ἵνα ζωὴν αἰώνιον κληρονομήσω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/017.yaml
  text: And as he was going out onto the road[a], one man ran up and knelt before him and asked him, “Good Teacher, what must I do so that I may inherit eternal life?”
translation:
  language: hi
  text: जब वह मार्ग पर निकल रहा था[a], तो एक आदमी दौड़कर उसके पास आया और उसके सामने घुटने टेक दिए। उसने उससे पूछा, “हे भले गुरु, मैं क्या करूँ कि अनन्त जीवन का वारिस होऊँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह यात्रा पर निकल रहा था।” यूनानी अभिव्यक्ति का अर्थ मार्ग पर निकलना या यात्रा आरम्भ करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπορευομένου αὐτοῦ εἰς ὁδόν
  choice: जब वह मार्ग पर निकल रहा था
  rationale: सम्बन्धकारक निरपेक्ष रचना मुख्य घटना के साथ चल रही पृष्ठभूमि की क्रिया बताती है। यह हिन्दी अभिव्यक्ति मार्ग पर जाने और यात्रा आरम्भ करने—दोनों सम्भावित भावों को स्वाभाविक रूप से समेटती है।
- source_word: προσδραμὼν
  choice: दौड़कर उसके पास आया
  rationale: यह उस आदमी के शीघ्र और उत्सुकतापूर्ण ढंग से निकट आने की सजीवता बनाए रखता है।
- source_word: εἷς
  choice: एक आदमी
  rationale: पुल्लिंग एकवचन का संज्ञावत् प्रयोग किसी एक पुरुष का परिचय देता है; इसलिए अस्पष्ट ‘कोई’ के बजाय ‘एक आदमी’ उपयुक्त है।
- source_word: γονυπετήσας αὐτόν
  choice: उसके सामने घुटने टेके
  rationale: मूल क्रिया आदर या विनती की मुद्रा में घुटने टेकने को बताती है; यह अनुवाद क्रिया को स्पष्ट रखता है, पर उसकी तीव्रता नहीं बढ़ाता।
- source_word: ἐπηρώτα αὐτόν
  choice: उससे पूछा
  rationale: अपूर्णकाल यहाँ पूछने की घटना प्रस्तुत करता है। स्वाभाविक हिन्दी कथन में ‘पूछा’ अधिक सहज है और अर्थ सुरक्षित रखता है।
- source_word: Διδάσκαλε ἀγαθέ
  choice: हे उत्तम गुरु
  rationale: ‘गुरु’ διδάσκαλος के शिक्षक-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और ‘उत्तम’ ἀγαθός को बनाए रखता है, जो अगले पद के संवाद के लिए महत्त्वपूर्ण है।
- source_word: τί ποιήσω
  choice: मैं क्या करूँ
  rationale: यह विचार-विमर्शात्मक प्रश्न आवश्यक कार्य के बारे में पूछता है। हिन्दी में ‘मैं क्या करूँ’ बिना अनावश्यक व्याख्या जोड़े वही व्यावहारिक बल देता है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ ‘कि’ उद्देश्य या अपेक्षित परिणाम को स्वाभाविक रूप से अगले खंड से जोड़ता है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह अवधि और धर्मवैचारिक प्रतिध्वनि दोनों को सुरक्षित रखने वाला प्रचलित, स्पष्ट हिन्दी पद है।
- source_word: κληρονομήσω
  choice: वारिस बनूँ
  rationale: यह विरासत पाने के भाव को हिन्दी मुहावरे में स्वाभाविक रूप से रखता है और अर्थ को केवल ‘प्राप्त करूँ’ तक सपाट नहीं करता।
theological_decisions:
- issue: यीशु के लिए उस आदमी का संबोधन
  choice: हे उत्तम गुरु
  alternative: हे भले गुरु
  rationale: मूल में διδάσκαλε है, κύριε नहीं; अतः ‘गुरु’ पाठ से अधिक प्रबल उपाधि नहीं जोड़ता। ‘उत्तम’ अगले पद में ‘उत्तम’ होने पर यीशु की प्रतिक्रिया से शब्दगत संबंध भी बनाए रखता है।
- issue: εἷς का लिंग-सटीक अनुवाद
  choice: एक आदमी
  alternative: कोई व्यक्ति
  rationale: पुल्लिंग एकवचन रूप और कथा-प्रसंग ‘आदमी’ का समर्थन करते हैं; इसे लिंग-निरपेक्ष बनाना मूल की सूचना को अनावश्यक रूप से धुंधला करेगा।
- issue: अनन्त जीवन और विरासत का संबंध
  choice: अनन्त जीवन का वारिस बनूँ
  alternative: अनन्त जीवन प्राप्त करूँ
  rationale: ‘वारिस’ κληρονομέω की विरासत-संबंधी धारणा को बनाए रखता है, बिना यह निर्धारित किए कि उस विरासत को पाने का धर्मवैचारिक ढंग क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘हे उत्तम गुरु’ संबोधन की औपचारिकता और अगले पद से उसके शब्दगत संबंध को बनाए रखता है; शेष वाक्य सामान्य पाठक के लिए सहज रखा गया है।
