  text: καὶ ἀποκριθεὶς ⸂αὐτῷ ὁ Ἰησοῦς εἶπεν⸃· Τί ⸂σοι θέλεις ποιήσω⸃; ὁ δὲ τυφλὸς εἶπεν αὐτῷ· Ραββουνι, ἵνα ἀναβλέψω.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/051.yaml
  text: And answering him[a], Jesus said, “What do you want me to do for you?” And the blind man said to him, “Rabboni, that I may see again.”
translation:
  language: hi
  text: और यीशु ने उसे उत्तर दिया, “तुम क्या चाहते हो कि मैं तुम्हारे लिए करूँ?” अंधे व्यक्ति ने उससे कहा, “रब्बूनी[a], कि मैं फिर से देख सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रब्बूनी’ अरामी भाषा का एक संबोधन है, जिसका अर्थ ‘मेरे गुरु’ या ‘मेरे स्वामी’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς
  choice: ने ... कहा
  rationale: यूनानी में उत्तर देने का भाव कृदन्त से व्यक्त है, पर हिंदी में अलग से ‘उत्तर देते हुए ... कहा’ इस संदर्भ में भारी और अनावश्यक लगता है। संवाद के प्रत्युत्तर को स्वाभाविक हिंदी ‘ने ... कहा’ पर्याप्त रूप से व्यक्त करती है।
- source_word: Τί σοι θέλεις ποιήσω
  choice: तुम क्या चाहते हो कि मैं तुम्हारे लिए करूँ?
  rationale: यह रूप σοι के हितार्थक भाव को ‘तुम्हारे लिए’ और θέλεις की इच्छा को ‘चाहते हो’ से स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τυφλὸς
  choice: अंधे व्यक्ति
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘अंधे व्यक्ति’ आधुनिक हिंदी में व्यक्तिगत संदर्भ को स्पष्ट रखते हुए सम्मानजनक और सहज है।
- source_word: Ραββουνι
  choice: रब्बूनी
  rationale: यूनानी पाठ अरामी संबोधन का लिप्यंतरण सुरक्षित रखता है; इसलिए उसकी ऐतिहासिक और भावात्मक विशिष्टता बनाए रखने के लिए हिंदी में भी लिप्यंतरण रखा गया है। अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἵνα ἀναβλέψω
  choice: कि मैं फिर से देखने लगूँ
  rationale: चंगाई के इस संदर्भ में ἀναβλέπω का अर्थ दृष्टि पाना या फिर से देखना है। ‘फिर से देखने लगूँ’ ἵνα की आशयात्मक संरचना को बनाए रखते हुए सहज हिंदी देता है।
theological_decisions:
- issue: Ραββουνι को संबोधन के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘रब्बूनी’ रखकर पादटिप्पणी में अर्थ बताना
  alternative: ‘मेरे गुरु’ या ‘स्वामी’ लिखना
  rationale: मूल यूनानी ने सामान्य यूनानी उपाधि के स्थान पर लिप्यंतरित अरामी संबोधन सुरक्षित रखा है। उसी पाठगत रंग और संबोधन की आत्मीयता को बनाए रखने हेतु लिप्यंतरण उचित है, जबकि पादटिप्पणी पाठक को उसका अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अंधे व्यक्ति’ सम्मानजनक अभिव्यक्ति है; ‘रब्बूनी’ मूल पाठ की सेमिटिक विशेषता को सुरक्षित रखता है।
