  yaml_path: translation/nt/mark/010/009.yaml
  text: Therefore[a], what God has joined together, man must not separate.
translation:
  language: hi
  text: इसलिए, जिसे परमेश्वर ने एक साथ जोड़ा है, उसे मनुष्य[a] अलग न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई व्यक्ति।” मूल यूनानी में ‘मनुष्य’ एकवचन है और सामान्य मानवीय अर्थ में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὃ
  choice: जिसे…उसे
  rationale: नपुंसकलिंग एकवचन संबंधवाचक सर्वनाम पहले बताए गए वैवाहिक मिलन को समष्टिगत रूप से दर्शाता है। हिन्दी में ‘जिसे…उसे’ स्वाभाविक संबंधवाचक रचना है और मूल वाक्य का कर्म-संबंध बनाए रखती है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को चिह्नित करता है; ‘इसलिए’ आधुनिक हिन्दी में इस तार्किक संबंध को स्पष्ट करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यह कर्ता के रूप में प्रयुक्त सामान्य ईश्वरीय संबोधन है; हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट, प्रतिष्ठित और स्वाभाविक है।
- source_word: συνέζευξεν
  choice: एक साथ जोड़ा है
  rationale: क्रिया का अर्थ साथ जोड़ना या एक जुए में बाँधना है। ‘एक साथ जोड़ा है’ रूपक को अनावश्यक रूप से उभारने के बजाय पूर्ण हुए ईश्वरीय कार्य और उसकी वर्तमान प्रासंगिकता दोनों व्यक्त करता है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यह बिना उपपद का एकवचन शब्द सामान्य मानवीय अर्थ में प्रयुक्त है। ‘मनुष्य’ उसके प्रतिनिधिक एकवचन और स्त्री-पुरुष दोनों पर लागू व्यापक अर्थ को बनाए रखता है।
- source_word: μὴ χωριζέτω
  choice: अलग न करे
  rationale: μή के साथ वर्तमान आज्ञार्थक निषेध व्यक्त करता है। ‘अलग न करे’ आधुनिक हिन्दी में स्पष्ट निषेध है और वैवाहिक संदर्भ में χωρίζω के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: वैवाहिक कथन में ἄνθρωπος का सामान्य मानवीय अर्थ
  choice: मुख्य पाठ में ‘मनुष्य’ रखा गया है, जिसका आशय किसी भी मनुष्य से है।
  alternative: ‘कोई व्यक्ति’ या ‘कोई मनुष्य’
  rationale: यूनानी एकवचन प्रतिनिधिक भाषा का प्रयोग करता है। ‘मनुष्य’ इस रूप को बनाए रखते हुए हिन्दी में स्वाभाविक रूप से समावेशी है; पादटिप्पणी स्पष्ट करती है कि निषेध केवल पुरुषों तक सीमित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अलग न करे’ आज्ञार्थक निषेध की शक्ति बनाए रखता है, जबकि ‘एक साथ जोड़ा है’ मूल क्रिया के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
