  text: καὶ ἀκούσας ὅτι Ἰησοῦς ὁ ⸀Ναζαρηνός ἐστιν ἤρξατο κράζειν καὶ λέγειν· ⸀Υἱὲ Δαυὶδ Ἰησοῦ, ἐλέησόν με.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/047.yaml
  text: And when he heard that it was Jesus the Nazarene[a], he began to cry out and say, “Jesus, Son of David, have mercy on me!”
translation:
  language: hi
  text: जब उसने सुना कि यीशु नासरी[a] है, तो वह ज़ोर से पुकारने और कहने लगा, “यीशु, दाऊद के पुत्र, मुझ पर दया कीजिए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “नासरत का यीशु।” यूनानी पाठ में “यीशु नासरी” है, जो अधिक स्पष्ट भौगोलिक अभिव्यक्ति के बजाय उपाधि-सदृश विशेषण को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσας
  choice: जब उसने सुना
  rationale: पूर्वकालिक एओरिस्ट कृदंत को स्वाभाविक हिन्दी में कालसूचक उपवाक्य के रूप में रखा गया है; इससे मुख्य क्रिया से पहले सुनने का क्रम स्पष्ट रहता है।
- source_word: Ναζαρηνός
  choice: नासरी
  rationale: यह यूनानी में विशेषणात्मक उपाधि है। ‘नासरी’ उसके उपाधि-सदृश रूप को बनाए रखता है, जबकि ‘नासरत का’ अधिक स्पष्ट भौगोलिक व्याख्या होती।
- source_word: ἤρξατο κράζειν καὶ λέγειν
  choice: ज़ोर से पुकारकर कहने लगा
  rationale: ‘कहने लगा’ आरम्भ का भाव व्यक्त करता है और ‘ज़ोर से पुकारकर’ सार्वजनिक तथा अत्यावश्यक पुकार को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: κράζειν
  choice: ज़ोर से पुकारकर
  rationale: यह ऊँची, अत्यावश्यक पुकार का भाव देता है, पर क्रोध का अनावश्यक संकेत नहीं जोड़ता।
- source_word: Υἱὲ Δαυὶδ
  choice: हे दाऊद के पुत्र
  rationale: शाब्दिक संबोधन और उसके राजकीय-मसीही अनुनाद दोनों सुरक्षित रहते हैं; इसे केवल ‘दाऊद के वंशज’ कहकर सामान्य नहीं बनाया गया।
- source_word: ἐλέησόν με
  choice: मुझ पर दया कीजिए
  rationale: आज्ञार्थक विनती की गंभीरता और स्पष्टता को आधुनिक, सम्मानसूचक हिन्दी में व्यक्त करता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप रखा गया है।
theological_decisions:
- issue: ‘दाऊद के पुत्र’ का मसीही महत्व
  choice: मुख्य पाठ में यीशु को संबोधित उपाधि ‘दाऊद के पुत्र’ बनाए रखी गई।
  alternative: ‘दाऊद के वंशज’
  rationale: मरकुस के कथा-संदर्भ में यह संबोधन राजकीय-मसीही अर्थ रखता है; शाब्दिक उपाधि उस अर्थगत तनाव को सुरक्षित रखती है।
- issue: Ναζαρηνός का रूप
  choice: ‘नासरी’
  alternative: ‘नासरत का यीशु’
  rationale: यूनानी पाठ स्पष्ट भौगोलिक पदबंध के बजाय उपाधि-सदृश विशेषण प्रयोग करता है; मुख्य पाठ उसी रूप को दर्शाता है और अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘दया कीजिए’ सम्मानसूचक विनती है; ‘ज़ोर से पुकारकर कहने लगा’ मरकुस की आरम्भसूचक अभिव्यक्ति और ऊँची, अत्यावश्यक पुकार दोनों को स्वाभाविक हिन्दी में प्रस्तुत करता है।
