id: MRK.10.38
reference: Mark 10:38
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς· Οὐκ οἴδατε τί αἰτεῖσθε· δύνασθε πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω, ⸀ἢ τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/038.yaml
  text: But Jesus said to them[a], “You do not know what you are asking. Are you able to drink the cup that I drink[b], or to be baptized with the baptism with which I am baptized?”
translation:
  language: hi
  text: पर यीशु ने उनसे कहा, “तुम नहीं जानते कि तुम क्या माँग रहे हो। क्या तुम वह प्याला पी सकते हो जो मैं पीता हूँ[a], या जिस बपतिस्मे से मैं बपतिस्मा ले रहा हूँ, उससे बपतिस्मा ले सकते हो[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्याला’ बाइबल में किसी व्यक्ति के लिए ठहराए गए भाग या अनुभव का रूपक है; यहाँ यह विशेष रूप से यीशु के आने वाले दुःख की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: 'अधिक व्याख्यात्मक अनुवाद: ‘या उस बपतिस्मे से गुजर सकते हो जिससे मैं गुजर रहा हूँ?’ यूनानी में बल देने के लिए ‘बपतिस्मा’ शब्द-समूह की पुनरावृत्ति हुई है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐκ οἴδατε
  choice: तुम नहीं जानते
  rationale: οἶδα का मूल अर्थ ‘जानना’ है। प्रसंग में समझ की कमी भी निहित है, पर ‘नहीं जानते’ यूनानी के अधिक निकट और स्वाभाविक है।
- source_word: τί αἰτεῖσθε
  choice: तुम क्या माँग रहे हो
  rationale: αἰτέω यहाँ किसी बात की माँग या विनती करने को दर्शाता है; ‘माँग रहे हो’ शिष्यों के अनुरोध के प्रसंग में सीधा और स्वाभाविक है।
- source_word: δύνασθε
  choice: क्या तुम ... सकते हो
  rationale: δύναμαι सामर्थ्य या क्षमता व्यक्त करता है। हिंदी में प्रश्नवाचक ‘क्या तुम ... सकते हो’ इसी अर्थ को सहजता से प्रकट करता है।
- source_word: πιεῖν τὸ ποτήριον ὃ ἐγὼ πίνω
  choice: वह प्याला पी सकते हो जो मैं पीता हूँ
  rationale: ‘प्याला’ रूपक को व्याख्यात्मक रूप से ‘दुःख’ में बदलने के बजाय मूल रूप में रखा गया है, जिससे उसका बाइबलीय और प्रसंगगत प्रभाव बना रहता है।
- source_word: ἢ
  choice: या
  rationale: SBLGNT में ἢ विकल्पसूचक है; इसलिए समानांतर कथन से सामंजस्य बैठाने हेतु इसे ‘और’ नहीं किया गया।
- source_word: τὸ βάπτισμα ὃ ἐγὼ βαπτίζομαι βαπτισθῆναι
  choice: उस बपतिस्मे से बपतिस्मा ले सकते हो जिससे मैं बपतिस्मा लेता हूँ
  rationale: मूल में βάπτισμα और βαπτίζω की जानबूझकर की गई पुनरावृत्ति को हिंदी में भी बनाए रखा गया है। ‘बपतिस्मा लेना’ आधुनिक हिंदी मसीही प्रयोग में स्वाभाविक है, यद्यपि यूनानी रूप व्याकरणतः कर्मवाच्य हैं।
- source_word: ὁ δὲ Ἰησοῦς εἶπεν αὐτοῖς
  choice: पर यीशु ने उनसे कहा
  rationale: δέ यहाँ पिछले अनुरोध के प्रति सुधारात्मक मोड़ दिखाता है; ‘पर’ इस हल्के विरोध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘प्याला’ और ‘बपतिस्मा’ के रूपक
  choice: दोनों रूपकों को मुख्य पाठ में यथावत रखा गया है।
  alternative: इन्हें सीधे ‘दुःख सहना’, ‘मृत्यु से गुजरना’ या ‘ईश्वरीय क्रोध उठाना’ कहना।
  rationale: यह पद इन रूपकों की पूरी व्याख्या नहीं करता। वे यीशु के आने वाले दुःख की ओर संकेत करते हैं, पर उन्हें किसी एक अधिक संकीर्ण धर्मवैज्ञानिक अर्थ में बदलना मूल की अर्थगत गहराई और तनाव को समय से पहले सुलझा देता।
- issue: βαπτίζομαι और βαπτισθῆναι के कर्मवाच्य रूप
  choice: स्वाभाविक हिंदी मुहावरे ‘बपतिस्मा लेना’ का प्रयोग, साथ में पुनरावृत्ति सुरक्षित।
  alternative: अधिक शाब्दिक पर अस्वाभाविक ‘बपतिस्मा दिया जाना’ या व्याख्यात्मक ‘उस अनुभव से गुजरना’।
  rationale: हिंदी में ‘बपतिस्मा लेना’ अनुष्ठान और रूपक दोनों के लिए स्थापित अभिव्यक्ति है। मुख्य धर्मवैज्ञानिक रूपक तथा संज्ञा-क्रिया संबंध बचा रहता है, जबकि अस्वाभाविक वाक्य-विन्यास से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और संवादोचित रूप अपनाया गया है। ‘प्याला’ और ‘बपतिस्मा’ जैसे प्रमुख बाइबलीय रूपकों को बनाए रखते हुए फुटनोटों में आवश्यक संकेत दिया गया है। सर्वनाम ‘तुम’ शिष्यों से सीधे संबोधन के लिए स्वाभाविक है।
