id: MRK.10.32
reference: Mark 10:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἦσαν δὲ ἐν τῇ ὁδῷ ἀναβαίνοντες εἰς Ἱεροσόλυμα, καὶ ἦν προάγων αὐτοὺς ὁ Ἰησοῦς, καὶ ἐθαμβοῦντο, ⸂οἱ δὲ⸃ ἀκολουθοῦντες ἐφοβοῦντο. καὶ παραλαβὼν πάλιν τοὺς δώδεκα ἤρξατο αὐτοῖς λέγειν τὰ μέλλοντα αὐτῷ συμβαίνειν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/032.yaml
  text: They were on the road[a], going up to Jerusalem, and Jesus was going ahead of them; and they were astonished, while those who were following were afraid. And taking the Twelve aside again[b], he began to tell them the things that were about to happen to him.
translation:
  language: hi
  text: वे रास्ते[a] में यरूशलेम को ऊपर जा रहे थे, और यीशु उनके आगे चल रहे थे। वे चकित थे, पर जो पीछे-पीछे आ रहे थे, वे डर रहे थे। फिर यीशु बारहों को अलग ले जाकर उन्हें बताने लगे कि उनके साथ क्या-क्या होने वाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मार्ग पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῇ ὁδῷ
  choice: मार्ग में
  rationale: यह यात्रा के वास्तविक परिवेश को बनाए रखता है और साथ ही यूनानी पदबंध के ‘मार्ग/रास्ते में’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀναβαίνοντες εἰς Ἱεροσόλυμα
  choice: यरूशलेम की ओर ऊपर जा रहे थे
  rationale: ‘ऊपर’ यरूशलेम की ऊँचाई तथा वहाँ जाने के पारंपरिक यात्रा-वर्णन दोनों को बनाए रखता है।
- source_word: προάγων αὐτούς
  choice: उनके आगे चल रहे थे
  rationale: यह यीशु की समूह से आगे की स्थिति को सीधे व्यक्त करता है और ‘अगुवाई कर रहे थे’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: ἐθαμβοῦντο
  choice: चकित थे
  rationale: यह तीव्र विस्मय या व्याकुल आश्चर्य को व्यक्त करता है, पर इसे अनावश्यक रूप से आतंक नहीं बनाता।
- source_word: οἱ δὲ ἀκολουθοῦντες
  choice: जो पीछे-पीछे आ रहे थे
  rationale: यह कृदन्तीय अभिव्यक्ति को बनाए रखता है और इस समूह की पहचान को ‘शिष्य’ आदि कहकर आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ἐφοβοῦντο
  choice: डर रहे थे
  rationale: यह अपूर्णकाल में व्यक्त जारी भय को सरल, स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: παραλαβὼν ... τοὺς δώδεκα
  choice: बारहों को अलग ले गए
  rationale: संदर्भ में यीशु बारहों को विशेष रूप से आगे की बात बताने के लिए साथ लेते हैं; ‘अलग’ इस प्रसंगगत भाव को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἤρξατο αὐτοῖς λέγειν
  choice: उन्हें बताने लगे
  rationale: यह आरंभसूचक क्रिया का बल बनाए रखते हुए हिन्दी की स्वाभाविक वाक्य-रचना अपनाता है।
- source_word: τὰ μέλλοντα αὐτῷ συμβαίνειν
  choice: उनके साथ क्या-क्या होनेवाला था
  rationale: यह निकट भविष्य की घटनाओं को व्यक्त करता है और यूनानी से अधिक प्रबल नियति या पूर्वनिर्धारण का भाव नहीं जोड़ता।
theological_decisions:
- issue: कथा में दो समूहों की भावनात्मक प्रतिक्रियाओं का भेद
  choice: ἐθαμβοῦντο को ‘चकित थे’ और ἐφοβοῦντο को ‘डर रहे थे’ के रूप में अलग-अलग रखा गया है।
  alternative: दोनों को सामान्य विस्मय अथवा भय के लगभग समान शब्दों से व्यक्त करना।
  rationale: यूनानी पाठ दो भिन्न क्रियाओं का प्रयोग करता है और प्रतिक्रियाओं में अंतर दिखाता है; इस भेद को बनाए रखने से कथा का तनाव बिना सामंजस्य बैठाए सुरक्षित रहता है।
- issue: यीशु के साथ होनेवाली घटनाओं में नियति का भाव
  choice: ‘होनेवाला था’
  alternative: ‘नियत था’ या ‘ठहराया गया था’
  rationale: μέλλοντα आगामी घटनाओं को सूचित करता है, पर इस पदबंध में नियति या पूर्वनिर्धारण को स्पष्ट रूप से नहीं कहता; इसलिए अधिक प्रबल धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बारहों’ परिचित बाइबलीय पद है; ‘पीछे-पीछे आ रहे थे’ समूह की अनिश्चित पहचान को बनाए रखते हुए सामान्य पाठक के लिए सहज है।
