  text: ⸀ἐμβλέψας αὐτοῖς ὁ Ἰησοῦς λέγει· Παρὰ ἀνθρώποις ἀδύνατον ἀλλ’ οὐ παρὰ θεῷ, πάντα γὰρ ⸀δυνατὰ παρὰ τῷ θεῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/027.yaml
  text: Jesus looked at them and said, “With men it is impossible, but not with God, because all things are possible with God.”
translation:
  language: hi
  text: यीशु ने उनकी ओर गौर से देखा और कहा, “मनुष्यों के लिए यह असंभव है, पर परमेश्वर के लिए नहीं; क्योंकि परमेश्वर के लिए सब कुछ संभव है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβλέψας αὐτοῖς
  choice: उनकी ओर ध्यान से देखकर
  rationale: ἐμβλέπω साधारण ‘देखना’ से अधिक, किसी की ओर ध्यानपूर्वक या गहराई से देखने का भाव रखता है; यह हिंदी में स्वाभाविक ढंग से उसी बल को व्यक्त करता है।
- source_word: Παρὰ ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: παρά + dative यहाँ क्षमता अथवा संभावना के क्षेत्र को दर्शाता है; ‘मनुष्यों के लिए’ सहज और सटीक है।
- source_word: ἀδύνατον
  choice: असंभव
  rationale: यूनानी विशेषण का विधेयात्मक प्रयोग है; संदर्भ से निहित विषय को हिंदी में ‘यह’ से स्पष्ट किया गया है।
- source_word: πάντα ... δυνατὰ
  choice: सब कुछ संभव है
  rationale: πάντα का व्यापक अर्थ बनाए रखता है और हिंदी में प्रचलित, स्वाभाविक अभिव्यक्ति है।
- source_word: παρὰ τῷ θεῷ
  choice: परमेश्वर के लिए
  rationale: पहले παρά-वाक्यांश के साथ समानांतरता रखते हुए परमेश्वर की सामर्थ्य के क्षेत्र को व्यक्त करता है।
theological_decisions:
- issue: ‘सब कुछ संभव’ के कथन का विस्तार
  choice: मूल के व्यापक कथन को बिना अतिरिक्त सीमा या व्याख्या के रखा गया
  alternative: ‘परमेश्वर सब कुछ कर सकता है’ अथवा संदर्भगत सीमा को पाठ में स्पष्ट करना
  rationale: मूल पाठ πάντα δυνατά की संक्षिप्त व्यापकता बनाए रखता है; पाठ में कोई धार्मिक तंत्र या व्याख्यात्मक सीमा जोड़ना उचित नहीं।
- issue: γάρ का संबंध
  choice: ‘क्योंकि’
  alternative: ‘दरअसल’ या ‘इसलिए कि’
  rationale: γάρ पिछले कथन ‘परमेश्वर के लिए नहीं’ का आधार देता है; ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘परमेश्वर’ का प्रयोग θεός के लिए किया गया है। वाक्य-संरचना में मूल की मनुष्य–परमेश्वर समानांतरता सुरक्षित रखी गई है।
