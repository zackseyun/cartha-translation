  text: καὶ λέγει αὐτοῖς· Ὃς ⸀ἂν ἀπολύσῃ τὴν γυναῖκα αὐτοῦ καὶ γαμήσῃ ἄλλην μοιχᾶται ἐπ’ αὐτήν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/011.yaml
  text: And he says to them[a], “Whoever divorces his wife and marries another commits adultery against her.”
translation:
  language: hi
  text: और वह उनसे कहता है, “जो कोई अपनी पत्नी को तलाक देता है और किसी दूसरी से[a] विवाह करता है, वह अपनी पत्नी के विरुद्ध व्यभिचार करता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप से: “किसी दूसरी स्त्री से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: यूनानी ऐतिहासिक वर्तमान को बनाए रखा गया है; मरकुस की कथा-शैली में यह स्वाभाविक और अर्थपूर्ण है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: दत्तिव सर्वनाम को हिन्दी में स्वाभाविक सम्प्रदान रूप में व्यक्त किया गया है।
- source_word: Ὃς ἂν
  choice: जो कोई
  rationale: यह अनिश्चित सामान्य शर्त को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπολύσῃ
  choice: तलाक देता है
  rationale: वैवाहिक प्रसंग में क्रिया का आशय केवल विदा करना नहीं, बल्कि विवाह-विच्छेद करना है।
- source_word: τὴν γυναῖκα αὐτοῦ
  choice: अपनी पत्नी
  rationale: सन्दर्भ में γυνή का अर्थ पत्नी है; हिन्दी में कर्ता-संबंधी अधिकार के लिए ‘अपनी’ स्वाभाविक है।
- source_word: γαμήσῃ ἄλλην
  choice: किसी दूसरी से विवाह करता है
  rationale: ἄλλην स्त्रीलिंग है और दूसरी स्त्री को सूचित करता है; हिन्दी में संक्षिप्त अभिव्यक्ति स्वाभाविक है, जबकि अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: μοιχᾶται
  choice: व्यभिचार करता है
  rationale: यह वैवाहिक बेवफाई के लिए मानक, स्पष्ट और गरिमापूर्ण हिन्दी अभिव्यक्ति है।
- source_word: ἐπ’ αὐτήν
  choice: अपनी पत्नी के विरुद्ध
  rationale: यह उस दिशा और अपराध-बोध को बनाए रखता है कि पति का कार्य तलाक दी गई पत्नी के विरुद्ध किया गया अन्याय है; केवल ‘व्यभिचार करता है’ कहने से यह बल मिट जाता।
theological_decisions:
- issue: ἐπ’ αὐτήν में पत्नी के विरुद्ध किए गए अपराध का बल
  choice: ‘अपनी पत्नी के विरुद्ध व्यभिचार करता है’
  alternative: ‘व्यभिचार करता है’ या ‘दूसरी के साथ व्यभिचार करता है’
  rationale: यूनानी वाक्यांश को अनूदित रखना आवश्यक है, क्योंकि यह पत्नी के प्रति किए गए अपराध को विशेष रूप से सामने लाता है।
- issue: Ὃς ἂν का सामान्य किन्तु प्रसंगतः पति-संबंधी कथन
  choice: ‘जो कोई अपनी पत्नी को…’
  alternative: ‘जो पुरुष अपनी पत्नी को…’
  rationale: ‘जो कोई’ यूनानी अनिश्चित सामान्य रचना को सुरक्षित रखता है, जबकि ‘अपनी पत्नी’ से तत्काल वैवाहिक संदर्भ स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और मौखिक रूप से सहज प्रवाह रखा गया है। ऐतिहासिक वर्तमान ‘कहता है’ और मूल पाठ के नैतिक बल ‘अपनी पत्नी के विरुद्ध’ को सुरक्षित रखा गया है।
