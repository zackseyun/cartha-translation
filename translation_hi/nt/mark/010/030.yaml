source:
  edition: SBLGNT
  text: ἐὰν μὴ λάβῃ ἑκατονταπλασίονα νῦν ἐν τῷ καιρῷ τούτῳ οἰκίας καὶ ἀδελφοὺς καὶ ἀδελφὰς καὶ ⸀μητέρας καὶ τέκνα καὶ ἀγροὺς μετὰ διωγμῶν, καὶ ἐν τῷ αἰῶνι τῷ ἐρχομένῳ ζωὴν αἰώνιον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/030.yaml
  text: who will not receive a hundredfold now in this time—houses and brothers and sisters and mothers and children and fields[a], with persecutions—and in the age to come[b], eternal life.
translation:
  language: hi
  text: जो अभी, इसी समय, सौ गुना पाए—घर, भाई, बहनें, माताएँ, बच्चे और खेत[a], सतावों के साथ—और आने वाले युग में[b] अनन्त जीवन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सौगुना।’
    reason: ‘सौ गुना’ के लिए एक अधिक संक्षिप्त, शैलीगत वैकल्पिक रूप।
  - marker: b
    text: या ‘उस युग में जो आने वाला है।’
    reason: यूनानी पदबंध ἐν τῷ αἰῶνι τῷ ἐρχομένῳ का अधिक शब्दशः वैकल्पिक रूप।
lexical_decisions:
- source_word: λάβῃ
  choice: पाए
  rationale: प्रतिज्ञा के संदर्भ में यह दिए जाने वाले प्रतिफल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ले’ से अनावश्यक सक्रिय ग्रहण का भाव आ सकता है।
- source_word: ἑκατονταπλασίονα
  choice: सौ गुना
  rationale: यह यूनानी शब्द की परिमाणात्मक शक्ति को संक्षिप्त, सीधी और प्रचलित हिन्दी में बनाए रखता है।
- source_word: νῦν ἐν τῷ καιρῷ τούτῳ
  choice: इस समय, अभी
  rationale: ‘अभी’ और ‘इस समय’ दोनों को रखकर वर्तमान काल और आने वाले युग के बीच स्रोत का स्पष्ट विरोध सुरक्षित रहता है।
- source_word: οἰκίας
  choice: घर
  rationale: ठोस बहुवचन वस्तुओं की सूची में हिन्दी में ‘घर’ स्वाभाविक है और प्रसंगानुसार बहुवचन अर्थ देता है।
- source_word: ἀδελφοὺς καὶ ἀδελφὰς
  choice: भाई, बहनें
  rationale: स्रोत में पुरुष और स्त्री सहोदरों का अलग-अलग उल्लेख है; हिन्दी में वही भेद रखा गया है।
- source_word: μητέρας
  choice: माताएँ
  rationale: यूनानी बहुवचन का सीधा और गरिमापूर्ण समतुल्य।
- source_word: τέκνα
  choice: बच्चे
  rationale: यह पुत्र-पुत्रियों दोनों को समेटने वाला सामान्य शब्द है और τέκνα को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: ἀγρούς
  choice: खेत
  rationale: कृषि-भूमि के ठोस बिंब को स्वाभाविक और सटीक हिन्दी में व्यक्त करता है।
- source_word: μετὰ διωγμῶν
  choice: सतावों के साथ
  rationale: वर्तमान प्रतिफल के साथ दुःख की स्पष्ट उपस्थिति बनाए रखता है; न समृद्धि को निरपेक्ष करता है, न प्रतिज्ञा को केवल आध्यात्मिक।
- source_word: ἐν τῷ αἰῶνι τῷ ἐρχομένῳ
  choice: आने वाले युग में
  rationale: αἰών को भौतिक ‘संसार’ के बजाय काल-युग के रूप में रखता है और युगान्त-संबंधी विरोध को सुरक्षित करता है।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: यह प्रसंग में प्रचलित और अर्थ-संगत हिन्दी है, जो भविष्य के युग से जुड़े स्थायी जीवन को व्यक्त करती है।
theological_decisions:
- issue: वर्तमान समय में प्रतिज्ञात प्रतिफल का स्वरूप
  choice: घरों, पारिवारिक संबंधों और खेतों को वास्तविक वर्तमान प्रतिफल के रूप में सीधा रखा गया है, साथ ही ‘सतावों के साथ’ भी स्पष्ट रखा गया है।
  alternative: इसे केवल आत्मिक आशीष मानना, अथवा सताव से अलग भौतिक समृद्धि की प्रतिज्ञा बनाना।
  rationale: यूनानी पाठ प्रचुर प्रतिफल और सताव दोनों को साथ रखता है; अनुवाद इस तनाव को किसी एक सिद्धान्त की ओर नहीं मोड़ता।
- issue: पारिवारिक शब्दों में लिंग-भेद
  choice: ἀδελφοὺς और ἀδελφὰς को अलग-अलग ‘भाई, बहनें’ कहा गया है।
  alternative: दोनों को मिलाकर केवल ‘भाई-बहन’ या ‘सहोदर’ कहना।
  rationale: स्रोत दोनों वर्गों का पृथक उल्लेख करता है; अनुवाद उस स्पष्टता को सुरक्षित रखता है।
- issue: वर्तमान समय और आने वाले युग का विरोध
  choice: ‘इस समय, अभी’ और ‘आने वाले युग में’ को स्पष्ट रूप से आमने-सामने रखा गया है।
  alternative: दोनों को सामान्य वर्तमान और भविष्य के रूप में ढीला कर देना।
  rationale: पाठ का युगान्त-संबंधी ढाँचा इसी कालगत विरोध पर निर्भर है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण शैली। पद पिछले वाक्य पर आश्रित संबंधवाचक खंड है, इसलिए स्रोत के अनुरूप इसे स्वतंत्र पूर्ण वाक्य बनाने हेतु कोई अतिरिक्त कर्ता या क्रिया नहीं जोड़ी गई। सूची की लय और ‘सतावों के साथ’ का चौंकाने वाला तनाव बनाए रखा गया है।
