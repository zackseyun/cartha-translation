  yaml_path: translation/nt/mark/010/037.yaml
  text: They said to him, “Grant to us that one of us may sit at your right and one at your left in your glory.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “हमें यह वर दे कि तेरी महिमा में हममें से एक तेरे दाहिने और दूसरा तेरे बाएँ बैठें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δὸς ἡμῖν
  choice: हमें यह वर दे
  rationale: आज्ञार्थक ‘दे’ के साथ ‘वर’ अनुरोध की प्रकृति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; ‘हमें’ यूनानी के स्पष्ट अप्रत्यक्ष कर्म को बनाए रखता है।
- source_word: εἷς ... καὶ εἷς
  choice: हममें से एक ... और दूसरा
  rationale: दो वक्ताओं के संदर्भ में हिन्दी का ‘एक ... दूसरा’ स्वाभाविक है, और ‘हममें से’ अंग्रेज़ी परामर्श-पाठ में स्पष्ट किए गए आशय को ठीक प्रकार सामने लाता है।
- source_word: ἐκ δεξιῶν ... ἐξ ἀριστερῶν
  choice: तेरे दाहिने ... तेरे बाएँ
  rationale: सम्मान और अधिकार के स्थानों का स्थानिक रूपक बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
- source_word: ἐν τῇ δόξῃ σου
  choice: तेरी महिमा में
  rationale: ‘महिमा’ δόξα का स्थापित और अर्थगत रूप से व्यापक हिन्दी समतुल्य है; ‘में’ मूल की अस्पष्टता को बनाए रखता है कि यह महिमामय अवस्था, प्रकटता या राज्य-संबंधी सम्मान की ओर संकेत करता है।
theological_decisions:
- issue: ‘तेरी महिमा में’ का आशय
  choice: तेरी महिमा में
  alternative: जब तू अपनी महिमा में आए / तेरे महिमामय राज्य में
  rationale: मूल पाठ केवल ἐν τῇ δόξῃ σου कहता है। समय या ‘राज्य’ को स्पष्ट जोड़ना मूल की अर्थगत व्यापकता को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। प्रत्यक्ष संबोधन में ‘तेरी/तेरे’ का प्रयोग यीशु से शिष्यों की निकट बातचीत के अनुरूप है; वाक्य में कोई अनावश्यक व्याख्यात्मक जोड़ नहीं किया गया।
