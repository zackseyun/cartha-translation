  text: ὁ δὲ εἶπεν αὐτοῖς· Τί θέλετε ⸀ποιήσω ὑμῖν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/036.yaml
  text: And he said to them, “What do you want me to do for you?”
translation:
  language: hi
  text: तब उसने उनसे कहा, “तुम क्या चाहते हो कि मैं तुम्हारे लिए करूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: तब उसने
  rationale: लेख के साथ δέ यहाँ कथा को आगे बढ़ाते हुए पहले से ज्ञात कर्ता यीशु की ओर संकेत करता है। ‘तब उसने’ स्वाभाविक हिन्दी कथाप्रवाह देता है और अनावश्यक विरोध नहीं जोड़ता।
- source_word: εἶπεν
  choice: कहा
  rationale: λέγω का सामान्य अर्थ ‘कहना’ है। आगे के प्रश्नवाचक वाक्य से पूछने का भाव स्वयं स्पष्ट हो जाता है।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: बहुवचन सर्वनाम को सीधे ‘उनसे’ कहा गया है। निकटवर्ती प्रसंग में याकूब और यूहन्ना अभिप्रेत हैं, पर यूनानी पाठ में ‘दोनों’ स्पष्ट रूप से नहीं है।
- source_word: Τί
  choice: क्या
  rationale: नपुंसकलिंग प्रश्नवाचक सर्वनाम सीधे अपेक्षित कार्य के विषय में पूछता है; ‘क्या’ इसका सहज हिन्दी समतुल्य है।
- source_word: θέλετε
  choice: तुम क्या चाहते हो
  rationale: θέλω इच्छा या चाह व्यक्त करता है। शिष्यों को संबोधित करते हुए ‘चाहते हो’ आधुनिक, सीधी और स्वाभाविक हिन्दी है।
- source_word: ποιήσω
  choice: कि मैं ... करूँ
  rationale: θέλετε के बाद अओरिस्ट सब्जंक्टिव इच्छित कार्य को व्यक्त करता है। हिन्दी में ‘कि मैं ... करूँ’ इस रचना को स्वाभाविक रूप से सामने लाता है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: 'यहाँ सम्प्रदान कारक हितार्थक है: यीशु पूछता है कि वह उनकी ओर से या उनके लाभ के लिए क्या करे।'
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए सहज संवाद। ‘तुम’ गुरु द्वारा अपने शिष्यों को किए गए बहुवचन संबोधन को स्वाभाविक रूप से व्यक्त करता है।
