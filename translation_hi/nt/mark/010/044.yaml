  edition: SBLGNT
  text: καὶ ὃς ⸀ἂν θέλῃ ⸂ἐν ὑμῖν εἶναι⸃ πρῶτος, ἔσται πάντων δοῦλος·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/044.yaml
  text: And whoever wants to be first among you will be the servant of all[a].
translation:
  language: hi
  text: और तुम में जो कोई पहला होना चाहता है, वह सबका दास[a] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबका सेवक।” यूनानी शब्द δοῦλος पिछले पद में आए “सेवक” के शब्द διάκονος से अधिक प्रबल है; इसलिए यहाँ “दास” रखा गया है।
    reason: ‘दास’ शब्द मूल यूनानी की अधिक प्रबल, अधीन और निम्न-दर्जे वाली धारणा को सुरक्षित रखता है, जबकि ‘सेवक’ एक सम्भव किंतु अपेक्षाकृत हल्का अनुवाद है।
lexical_decisions:
- source_word: ὃς ἂν θέλῃ
  choice: जो कोई…होना चाहता है
  rationale: सापेक्ष सर्वनाम, ἄν और संभावनार्थक क्रिया मिलकर एक सामान्य तथा अनिश्चित शर्त व्यक्त करते हैं। ‘जो कोई…चाहता है’ आधुनिक हिन्दी में स्वाभाविक है और इच्छा का भाव बनाए रखता है।
- source_word: ἐν ὑμῖν
  choice: तुम में
  rationale: यहाँ शिष्यों के समूह के भीतर पद या प्रतिष्ठा की बात है; ‘तुम में’ इस सामाजिक अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρῶτος
  choice: पहला
  rationale: शब्द पद, प्रधानता या प्रतिष्ठा में प्रथम होने को दर्शाता है। ‘पहला’ सीधा अनुवाद है और प्रसंग की शब्दावली बनाए रखता है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकाल को सीधे ‘होगा’ से व्यक्त किया गया है। प्रसंग में इसका शिक्षात्मक बल है, पर उसे ‘होना ही चाहिए’ बनाकर व्याकरणिक रूप से अधिक स्पष्ट नहीं किया गया।
- source_word: πάντων
  choice: सबका
  rationale: सम्बन्धकारक बहुवचन δοῦλος के साथ अधीनता का सम्बन्ध बताता है। ‘सबका’ संक्षिप्त है और सार्वभौमिक विस्तार को बनाए रखता है।
- source_word: δοῦλος
  choice: दास
  rationale: δοῦλος बँधे हुए, निम्न सामाजिक दर्जे वाले दास को सूचित करने वाला प्रबल शब्द है। पिछले पद के διάκονος की तुलना में ‘दास’ तीव्रता को बनाए रखता है, जबकि ‘सेवक’ से दोनों शब्दों का भेद दब सकता है।
theological_decisions:
- issue: शिष्यत्व की शिक्षा में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: तत्कालीन प्रसंग सामाजिक प्रधानता की आकांक्षा के विपरीत अत्यन्त दीन स्थिति अपनाने की शिक्षा देता है। पद 43 के διάκονος और यहाँ के δοῦλος का भेद बनाए रखने के लिए ‘दास’ चुना गया है; इससे कथन की तीक्ष्णता और तनाव सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तुम’ यीशु द्वारा शिष्यों को किए गए प्रत्यक्ष सम्बोधन के लिए स्वाभाविक है। वाक्य-क्रम हिन्दी के अनुरूप रखा गया है और मूल के भविष्यकाल तथा सामाजिक उलटाव को सुरक्षित रखा गया है।
