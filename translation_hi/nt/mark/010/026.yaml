  text: οἱ δὲ περισσῶς ἐξεπλήσσοντο λέγοντες πρὸς ⸀ἑαυτούς· Καὶ τίς δύναται σωθῆναι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/026.yaml
  text: And they were exceedingly astonished[a], saying to one another, “Then who can be saved?”
translation:
  language: hi
  text: वे बहुत ही चकित थे और आपस में कह रहे थे, “तो फिर कौन उद्धार पा सकता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ δὲ
  choice: वे
  rationale: संदर्भ में यह शिष्यों/सुननेवालों की ओर संकेत करता है। हिन्दी में अलग संयोजक जोड़े बिना ‘वे’ से प्रसंग का प्रवाह स्वाभाविक बना रहता है।
- source_word: περισσῶς
  choice: और भी अधिक
  rationale: यह क्रियाविशेषण आश्चर्य की तीव्रता बढ़ाता है और संदर्भ में पहले से बढ़ी हुई प्रतिक्रिया का भाव भी दे सकता है।
- source_word: ἐξεπλήσσοντο
  choice: चकित हुए
  rationale: यह प्रबल विस्मय व्यक्त करता है। ‘चकित हुए’ आधुनिक हिन्दी में स्वाभाविक है; साथ का ‘और भी अधिक’ इसकी तीव्रता सुरक्षित रखता है।
- source_word: λέγοντες
  choice: कहने लगे
  rationale: समकालिक कृदंत को हिन्दी की स्वाभाविक कथात्मक अभिव्यक्ति में प्रस्तुत करता है और उनकी प्रतिक्रिया के जारी होने का भाव देता है।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: 'बहुवचन संवाद के संदर्भ में इसका पारस्परिक अर्थ स्वाभाविक है: वे एक-दूसरे से बात कर रहे थे।'
- source_word: Καὶ τίς
  choice: तो फिर कौन
  rationale: यहाँ καί पिछले कथन से निकले परिणाम या आश्चर्यपूर्ण निष्कर्ष को सामने लाता है; ‘तो फिर’ हिन्दी में उस तर्कगत बल को स्पष्ट करता है।
- source_word: δύναται
  choice: पा सकता है
  rationale: σωθῆναι के साथ मिलकर सामर्थ्य या संभावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: σωθῆναι
  choice: उद्धार पा
  rationale: राज्य में प्रवेश के निकट संदर्भ में यह परमेश्वर के उद्धार का धार्मिक और युगांतकारी भार सुरक्षित रखता है; केवल सामान्य बचाव तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: संदर्भ में σωθῆναι का उद्धार-संबंधी अर्थ
  choice: उद्धार पा सकता है
  alternative: बचाया जा सकता है / छुटकारा पा सकता है
  rationale: आस-पास का प्रसंग परमेश्वर के राज्य में प्रवेश की बात करता है, इसलिए ‘उद्धार’ व्यापक धार्मिक अर्थ को स्पष्ट और पारदर्शी ढंग से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक संवाद के अनुकूल। ‘तो फिर’ प्रश्न के परिणामसूचक बल को और ‘आपस में’ पारस्परिक संवाद को स्वाभाविक रूप से व्यक्त करता है।
