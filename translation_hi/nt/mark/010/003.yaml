  text: ὁ δὲ ἀποκριθεὶς εἶπεν αὐτοῖς· Τί ὑμῖν ἐνετείλατο Μωϋσῆς;
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/003.yaml
  text: But he answered them, “What did Moses command you?”
translation:
  language: hi
  text: पर उसने उन्हें उत्तर दिया, “मूसा ने तुम्हें क्या आज्ञा दी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह हल्का संयोजक संवाद में पिछले प्रश्न के प्रत्युत्तर और हल्के विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀποκριθεὶς εἶπεν
  choice: उत्तर दिया
  rationale: ग्रीक की इस प्रचलित संयुक्त अभिव्यक्ति को हिन्दी में एक स्वाभाविक क्रिया के रूप में देना प्रत्युत्तर का भाव बनाए रखता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: αὐτοῖς
  choice: उन्हें
  rationale: यह उत्तर पाने वालों को सूचित करने वाला अप्रत्यक्ष कर्म है और हिन्दी में ‘उन्हें उत्तर दिया’ स्वाभाविक है।
- source_word: Τί
  choice: क्या
  rationale: यह प्रश्न मूसा की आज्ञा की विषय-वस्तु पूछता है; ‘क्या’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: सम्बन्धित व्यक्तियों को आज्ञा के प्राप्तकर्ता के रूप में व्यक्त करता है। प्रसंग में सीधा बहुवचन सम्बोधन ‘तुम्हें’ उपयुक्त है।
- source_word: ἐνετείλατο
  choice: आज्ञा दी
  rationale: यह अधिकारपूर्वक आदेश देने या निर्देश देने का अर्थ रखता है; व्यवस्था-संबंधी चर्चा में ‘आज्ञा दी’ उसके प्राधिकारिक भाव को सुरक्षित रखता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: नाम का मानक हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: यीशु के उत्तर में मूसा के अधिकार का उल्लेख
  choice: मूसा को आज्ञा देने वाले नामित मानवीय मध्यस्थ के रूप में यथावत रखा गया।
  alternative: ‘मूसा की व्यवस्था ने तुम्हें क्या आज्ञा दी?’ अथवा ‘परमेश्वर ने मूसा के द्वारा तुम्हें क्या आज्ञा दी?’
  rationale: ग्रीक पाठ स्पष्टतः मूसा का नाम लेता है, पर ‘व्यवस्था’ या ‘मूसा के द्वारा परमेश्वर’ जैसा विस्तार नहीं करता। मूल कथन बनाए रखने से ऐसी धर्मवैचारिक व्याख्या नहीं जुड़ती जो इस पद में व्यक्त नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘उत्तर दिया’ स्वाभाविक हिन्दी के लिए ग्रीक की शाब्दिक पुनरुक्ति ‘उत्तर देकर कहा’ को संक्षिप्त करता है; प्रत्यक्ष प्रश्न और उसका प्राधिकारिक भाव सुरक्षित हैं।
