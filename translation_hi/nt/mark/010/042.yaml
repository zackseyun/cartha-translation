id: MRK.10.42
reference: Mark 10:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂καὶ προσκαλεσάμενος αὐτοὺς ὁ Ἰησοῦς⸃ λέγει αὐτοῖς· Οἴδατε ὅτι οἱ δοκοῦντες ἄρχειν τῶν ἐθνῶν κατακυριεύουσιν αὐτῶν καὶ οἱ μεγάλοι αὐτῶν κατεξουσιάζουσιν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/042.yaml
  text: And Jesus called them to himself and said to them[a], “You know that those who are considered rulers of the Gentiles lord it over them[b], and their great ones exercise authority over them.”
translation:
  language: hi
  text: यीशु ने उन्हें अपने पास बुलाकर कहा, “तुम जानते हो कि जिन्हें गैर-यहूदियों[a] के शासक माना जाता है[b], वे उन पर प्रभुत्व जमाते हैं, और उनके बड़े लोग उन पर अधिकार चलाते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राष्ट्रों।”
    reason: lexical_alternative
  - marker: b
    text: या “जो गैर-यहूदियों पर शासन करते जान पड़ते हैं।”
    reason: alternative_reading
lexical_decisions:
- source_word: προσκαλεσάμενος
  choice: अपने पास बुलाकर
  rationale: मध्यवाच्य क्रिया का आशय किसी को अपने पास बुलाना है। कृदन्त का पूर्वकालिक संबंध ‘बुलाकर’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी कथात्मक शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और कथन की भूमिका को यथावत रखता है।
- source_word: Οἴδατε
  choice: तुम जानते हो
  rationale: οἶδα का पूर्ण रूप यहाँ वर्तमान अर्थ में स्थिर ज्ञान को व्यक्त करता है; ‘जानते हो’ इसका सीधा और सहज अनुवाद है।
- source_word: οἱ δοκοῦντες ἄρχειν
  choice: जिन्हें ... के शासक माना जाता है
  rationale: δοκοῦντες सार्वजनिक मान्यता या समझे जाने का भाव दे सकता है। यह अनुवाद उनकी सत्ता को केवल दिखावटी ठहराए बिना उस भाव को सुरक्षित रखता है।
- source_word: τῶν ἐθνῶν
  choice: गैर-यहूदियों
  rationale: इस यहूदी संदर्भ में ἔθνη सामान्यतः अन्यजातीय, अर्थात गैर-यहूदी लोगों को सूचित करता है। ‘गैर-यहूदी’ आधुनिक हिन्दी में स्पष्ट है; व्यापक अर्थ ‘राष्ट्र’ पादटिप्पणी में रखा गया है।
- source_word: κατακυριεύουσιν
  choice: प्रभुत्व जमाते हैं
  rationale: यह पद केवल शासन नहीं, बल्कि दबदबे और वर्चस्व के साथ शासन करने का नकारात्मक भाव व्यक्त करता है।
- source_word: οἱ μεγάλοι αὐτῶν
  choice: उनके बड़े लोग
  rationale: μέγαλοι सामाजिक रूप से प्रमुख और शक्तिशाली व्यक्तियों को दर्शाता है। ‘बड़े लोग’ किसी विशिष्ट पद का अनावश्यक अनुमान लगाए बिना इस अर्थ को रखता है।
- source_word: κατεξουσιάζουσιν
  choice: अधिकार चलाते हैं
  rationale: यह अधिकार या शक्ति का प्रयोग करने को व्यक्त करता है। ‘अधिकार चलाते हैं’ स्वाभाविक हिन्दी है और पहले पद ‘प्रभुत्व जमाते हैं’ से अर्थगत समानता रखते हुए दोनों क्रियाओं को पूरी तरह एक नहीं बनाता।
theological_decisions:
- issue: τῶν ἐθνῶν का संदर्भ
  choice: गैर-यहूदियों
  alternative: राष्ट्रों
  rationale: मरकुस के यहूदी संदर्भ में यह पद गैर-यहूदी संसार की सत्ता-व्यवस्था की ओर संकेत करता है। फिर भी मूल शब्द का व्यापक अर्थ ‘राष्ट्र’ हो सकता है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: δοκοῦντες का भाव
  choice: जिन्हें ... शासक माना जाता है
  alternative: जो ... पर शासन करते जान पड़ते हैं
  rationale: मुख्य पाठ सार्वजनिक मान्यता का भाव व्यक्त करता है और यह आवश्यक नहीं मानता कि उनकी सत्ता केवल दिखावटी है। वैकल्पिक अनुवाद यूनानी पद में संभव ‘जान पड़ने’ के भाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक शिक्षण के अनुकूल शैली रखी गई है। ‘प्रभुत्व जमाते हैं’ और ‘अधिकार चलाते हैं’ सत्ता के दमनकारी प्रयोग को स्वाभाविक हिन्दी में व्यक्त करते हुए यूनानी की दो समानांतर क्रियाओं के बीच हल्का भेद बनाए रखते हैं। पादटिप्पणी-चिह्न संबंधित शब्दसमूहों के तुरंत बाद लगाए गए हैं।
