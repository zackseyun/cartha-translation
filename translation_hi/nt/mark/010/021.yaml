source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς ἐμβλέψας αὐτῷ ἠγάπησεν αὐτὸν καὶ εἶπεν αὐτῷ· Ἕν ⸀σε ὑστερεῖ· ὕπαγε ὅσα ἔχεις πώλησον καὶ δὸς ⸀τοῖς πτωχοῖς, καὶ ἕξεις θησαυρὸν ἐν οὐρανῷ, καὶ δεῦρο ἀκολούθει ⸀μοι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/021.yaml
  text: 'And Jesus[a], looking at him, loved him and said to him, “One thing you lack: go, sell whatever you have and give to the poor, and you will have treasure in heaven; and come, follow me.”'
translation:
  language: hi
  text: 'यीशु ने उसकी ओर ध्यान से देखा, उससे प्रेम किया और उससे कहा, “तुम्हें एक बात की कमी है: जाओ, जो कुछ तुम्हारे पास है[a] उसे बेच दो और गरीबों को दे दो, और तुम्हें स्वर्ग में खजाना मिलेगा; और आओ, मेरे पीछे चलो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पास जो कुछ भी है।” यूनानी अभिव्यक्ति ὅσα ἔχεις का अनुवाद “जो कुछ तुम्हारे पास है” या “तुम्हारे पास जो कुछ भी है” किया जा सकता है; प्रसंग उसकी सारी संपत्ति की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμβλέψας
  choice: उसकी ओर ध्यान से देखा
  rationale: यह क्रिया किसी की ओर सीधे और ध्यानपूर्वक देखने का भाव रखती है। यह अनुवाद उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर अनावश्यक रूप से ‘टकटकी बाँधकर’ जैसी तीव्रता नहीं जोड़ता।
- source_word: ἠγάπησεν αὐτόν
  choice: उससे प्रेम किया
  rationale: मूल पाठ सीधे यीशु के प्रेम को व्यक्त करता है। ‘प्रेम किया’ इसे न तो केवल दयालु व्यवहार तक सीमित करता है, न किसी विशेष धर्मवैज्ञानिक अर्थ से भरता है।
- source_word: Ἕν σε ὑστερεῖ
  choice: तुममें एक बात की कमी है
  rationale: नपुंसकलिंग एकवचन Ἕν को हिन्दी में स्पष्ट करने के लिए ‘एक बात’ कहा गया है। वाक्य वर्तमान कमी को सीधे संबोधित करता है।
- source_word: ὅσα ἔχεις
  choice: जो कुछ तुम्हारे पास है
  rationale: यह अभिव्यक्ति ‘जो कुछ तुम्हारे पास है’ अथवा ‘तुम्हारे पास जो कुछ भी है’ का अर्थ दे सकती है; प्रसंग उसकी संपत्ति के व्यापक दायरे की ओर संकेत करता है।
- source_word: δὸς τοῖς πτωχοῖς
  choice: गरीबों को दे दो
  rationale: πτωχοῖς गरीब व्यक्तियों के सामाजिक वर्ग को सूचित करता है। ‘गरीबों’ सहज, स्पष्ट और मूल के अनुरूप है।
- source_word: θησαυρὸν ἐν οὐρανῷ
  choice: स्वर्ग में खजाना
  rationale: ‘खजाना’ θησαυρός की ठोस उपमा को बनाए रखता है और स्वर्गीय प्रतिफल की व्याख्या किए बिना मूल कथन को व्यक्त करता है।
- source_word: ἀκολούθει μοι
  choice: मेरे पीछे चलो
  rationale: वर्तमान आज्ञार्थक निरंतर शिष्यत्व का भाव रख सकता है। हिन्दी का यह प्रचलित वाक्यांश तत्काल बुलाहट और आगे चलते रहने—दोनों के लिए स्वाभाविक है।
theological_decisions:
- issue: उस मनुष्य के प्रति यीशु के प्रेम का अर्थ
  choice: ‘उससे प्रेम किया’ के रूप में वास्तविक प्रेम का सीधा कथन
  alternative: इसे केवल बाहरी सद्भाव या तकनीकी अर्थ में विशेष चुनावकारी प्रेम मानना
  rationale: ἠγάπησεν αὐτόν स्पष्ट रूप से प्रेम का कथन है। अनुवाद इस प्रेम को कमजोर भी नहीं करता और पाठ से परे कोई विशिष्ट धर्मवैज्ञानिक व्यवस्था भी उस पर आरोपित नहीं करता।
- issue: संपत्ति के विषय में आज्ञा का दायरा
  choice: ‘जो कुछ तुम्हारे पास है’ द्वारा आज्ञा की व्यापकता को बनाए रखना
  alternative: स्पष्ट विस्तार के साथ ‘अपना सब कुछ बेच दो’ कहना या इसे केवल सामान्य उदारता की सलाह बनाना
  rationale: ὅσα ἔχεις प्रसंग में उसकी संपत्ति को व्यापक रूप से समेटता है। मुख्य पाठ यूनानी संरचना के निकट रहता है और पादटिप्पणी वैकल्पिक स्वाभाविक अभिव्यक्ति बताती है।
- issue: स्वर्गीय खजाने का स्वरूप
  choice: बिना व्याख्यात्मक विस्तार के ‘स्वर्ग में खजाना’
  alternative: इसे स्पष्ट रूप से उद्धार, पुण्य, या किसी निश्चित प्रकार के प्रतिफल के रूप में परिभाषित करना
  rationale: मूल पाठ खजाने की उपमा देता है, पर इस पद में उसका स्वरूप विस्तार से नहीं बताता; इसलिए अनुवाद वही खुलापन बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानजनक किंतु सहज ‘तुम’ संबोधन रखा गया है। वाक्य को स्पष्ट और बोलचाल में स्वाभाविक रखने के लिए आज्ञार्थक रूप ‘जाओ’, ‘बेच दो’, ‘दे दो’ और ‘चलो’ प्रयुक्त हुए हैं। भाषा गरिमापूर्ण है, पर अत्यधिक संस्कृतनिष्ठ नहीं।
