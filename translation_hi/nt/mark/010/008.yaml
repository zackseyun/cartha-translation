  text: καὶ ἔσονται οἱ δύο εἰς σάρκα μίαν· ὥστε οὐκέτι εἰσὶν δύο ἀλλὰ μία σάρξ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/008.yaml
  text: and the two will become one flesh. So they are no longer two[a], but one flesh.
translation:
  language: hi
  text: और वे दोनों एक देह हो जाएँगे।’ इसलिए वे अब दो नहीं, बल्कि एक देह हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσονται
  choice: हो जाएँगे
  rationale: यद्यपि क्रिया εἰμί से है, εἰς के साथ यह परिणामी अवस्था व्यक्त करती है; आधुनिक हिन्दी में ‘हो जाएँगे’ स्वाभाविक रूप से एकता में आने का भाव रखता है।
- source_word: οἱ δύο
  choice: वे दोनों
  rationale: सव्यय संख्यावाचक पद स्पष्ट द्वित्व पर बल देता है, जिसे आगे ‘अब दो नहीं’ के विरोध में बनाए रखा गया है।
- source_word: εἰς σάρκα μίαν
  choice: एक देह
  rationale: ‘हो जाएँगे’ में परिणति का भाव समाहित है, इसलिए εἰς के लिए अलग से ‘में’ जोड़ना हिन्दी में अनावश्यक और अस्वाभाविक होगा।
- source_word: σάρκα / σάρξ
  choice: देह
  rationale: यहाँ σάρξ का शाब्दिक, मानवीय और वैवाहिक अर्थ है। ‘देह’ उत्पत्ति के अंतर्पाठीय संबंध और ‘एक देह’ की व्यापक बाइबलीय अभिव्यक्ति को सुरक्षित रखता है।
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम अथवा निष्कर्ष का स्पष्ट और स्वाभाविक हिन्दी संयोजक है।
- source_word: οὐκέτι
  choice: अब ... नहीं
  rationale: यह पूर्व अवस्था की समाप्ति को संक्षिप्त और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀλλὰ μία σάρξ
  choice: बल्कि एक देह
  rationale: ‘बल्कि’ दो और एक के केंद्रीय विरोध को स्पष्ट रखता है तथा मूल की वैवाहिक अभिव्यक्ति को बिना विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: यीशु द्वारा उद्धृत ‘एक देह’ का अर्थ
  choice: ‘एक देह’ की वैवाहिक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: एक शरीर; एक व्यक्ति; यौन रूप से संयुक्त
  rationale: मूल पद इस एकता को किसी एक आयाम तक सीमित नहीं करता। ‘एक देह’ इसकी धर्मवैज्ञानिक और मानवशास्त्रीय व्यापकता तथा उत्पत्ति से इसके संबंध को सुरक्षित रखता है।
translation_notes:
  register: 'भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उद्धरण का समापन-चिह्न दिया गया है क्योंकि पद पूर्ववर्ती वचन के उद्धरण को पूरा करता है। किसी पादटिप्पणी की आवश्यकता नहीं: हिन्दी का ‘हो जाएँगे’ मूल εἰς के परिणामी भाव को पर्याप्त रूप से व्यक्त करता है।'
