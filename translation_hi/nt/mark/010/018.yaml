  text: ὁ δὲ Ἰησοῦς εἶπεν αὐτῷ· Τί με λέγεις ἀγαθόν; οὐδεὶς ἀγαθὸς εἰ μὴ εἷς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/018.yaml
  text: But Jesus said to him[a], “Why do you call me good? No one is good except one—God.”
translation:
  language: hi
  text: पर यीशु ने उससे कहा, “तुम मुझे अच्छा क्यों[a] कहते हो? एक, अर्थात् परमेश्वर, को छोड़कर कोई अच्छा नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तुम मुझे अच्छा किस लिए कहते हो?”'
    reason: τί का औपचारिक अर्थ ‘क्या’ है, पर इस क्रिया-प्रयोग में उसका अर्थ कारण पूछना है; मुख्य पाठ में स्वाभाविक हिन्दी ‘क्यों’ है।
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले संबोधन के उत्तर में आए हल्के विरोध अथवा संवाद के मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἶπεν αὐτῷ
  choice: उससे कहा
  rationale: λέγω और अप्रत्यक्ष कर्म का सीधा, स्वाभाविक तथा कम व्याख्यात्मक हिन्दी रूप।
- source_word: Τί
  choice: क्यों
  rationale: यहाँ τί क्रिया के साथ कारण पूछने वाले क्रियाविशेषण की तरह प्रयुक्त है; आधुनिक हिन्दी में प्रश्न का स्वाभाविक रूप ‘क्यों’ है।
- source_word: με λέγεις ἀγαθόν
  choice: तुम मुझे भला कहते हो
  rationale: यह με को कर्म और ἀγαθόν को उसके विधेय-पूरक के रूप में बनाए रखता है तथा हिन्दी में सहज है।
- source_word: ἀγαθόν / ἀγαθὸς
  choice: भला
  rationale: दोनों occurrences में एक ही शब्द रखकर यूनानी की शाब्दिक पुनरावृत्ति और कथन की नैतिक-धार्मिक गूँज सुरक्षित रखी गई है; ‘नैतिक रूप से अच्छा’ जोड़ना अनावश्यक व्याख्या होती।
- source_word: οὐδεὶς
  choice: कोई ... नहीं
  rationale: यह सार्वभौमिक निषेध का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: εἰ μὴ εἷς
  choice: एक के सिवा
  rationale: यह अपवादसूचक रचना और ‘एक’ पर दिए गए बल, दोनों को संक्षेप में बनाए रखता है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: आधुनिक हिन्दी बाइबलीय गद्य में θεός के लिए यह स्पष्ट, प्रतिष्ठित और स्वाभाविक पद है; यूनानी का लेख हिन्दी में अलग से व्यक्त करना आवश्यक नहीं।
theological_decisions:
- issue: भलाई के विषय में यीशु के कथन का सम्भावित मसीह-विज्ञान संबंधी आशय
  choice: कथन को बिना किसी व्याख्यात्मक विशेषण के सीधे रूप में रखा गया है।
  alternative: ऐसा अनुवाद जो या तो यीशु द्वारा अपनी दिव्यता का निषेध कराए, या इस वाक्य में उनसे अपनी दिव्यता की प्रत्यक्ष घोषणा कराए।
  rationale: मूल कथन मनुष्य के ‘भला’ कहने पर प्रश्न उठाता और भलाई को परमेश्वर की अद्वितीयता से जोड़ता है, पर इस वाक्य में निहित धर्मवैज्ञानिक तनाव को स्वयं हल नहीं करता। इसलिए अनुवाद भी कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भला’ की पुनरावृत्ति मूल यूनानी की अलंकारिक शक्ति बचाती है, और दीर्घ डैश अंतिम पद ‘परमेश्वर’ को ‘एक’ की पहचान के रूप में स्पष्ट करता है।
