id: MRK.10.1
reference: Mark 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐκεῖθεν ἀναστὰς ἔρχεται εἰς τὰ ὅρια τῆς Ἰουδαίας ⸀καὶ πέραν τοῦ Ἰορδάνου, καὶ συμπορεύονται πάλιν ὄχλοι πρὸς αὐτόν, καὶ ὡς εἰώθει πάλιν ἐδίδασκεν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/001.yaml
  text: And from there[a], rising, he comes into the region of Judea and beyond the Jordan, and crowds gather to him again, and as was his custom[b], he again taught them.
translation:
  language: hi
  text: वहाँ से उठकर वह यहूदिया के प्रदेश और यरदन के पार के क्षेत्र[a] में आया। भीड़ फिर उसके पास इकट्ठी होने लगी, और जैसा वह किया करता था, वह उन्हें फिर शिक्षा देने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “यरदन के पार स्थित यहूदिया के प्रदेश में।” यूनानी वाक्यांश को दो क्षेत्रों के उल्लेख के रूप में या यहूदिया के प्रदेश के एक संयुक्त वर्णन के रूप में समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह पिछले स्थान से प्रस्थान बताने वाला सहज स्थानवाचक प्रयोग है।
- source_word: ἀναστὰς
  choice: उठकर
  rationale: यह मुख्य क्रिया से पहले की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; यहाँ पुनरुत्थान नहीं, उठकर चल पड़ना अभिप्रेत है।
- source_word: ἔρχεται
  choice: आया
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथा की स्वाभाविक भूतकालीन शैली में रखा गया है।
- source_word: τὰ ὅρια τῆς Ἰουδαίας
  choice: यहूदिया के प्रदेश
  rationale: ὅρια यहाँ सीमा-रेखा के बजाय भूभाग या क्षेत्र को सूचित करता है।
- source_word: καὶ πέραν τοῦ Ἰορδάνου
  choice: और यरदन के पार के इलाके
  rationale: यूनानी क्रम को बनाए रखते हुए यरदन नदी के दूसरी ओर के भूभाग का संकेत दिया गया है।
- source_word: συμπορεύονται ... ὄχλοι πρὸς αὐτόν
  choice: भीड़ फिर उसके पास इकट्ठी होने लगी
  rationale: शाब्दिक साथ चलने की धारणा के साथ प्रसंगगत रूप से लोगों के यीशु के पास जुटने का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: ὡς εἰώθει
  choice: अपनी रीति के अनुसार
  rationale: यह यीशु के अभ्यस्त या सामान्य व्यवहार का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
- source_word: πάλιν ἐδίδασκεν αὐτούς
  choice: वह फिर उन्हें शिक्षा देने लगा
  rationale: πάλιν की पुनरावृत्ति और imperfect क्रिया के जारी अथवा आरम्भ होकर चलते रहने वाले भाव को सुरक्षित रखता है।
theological_decisions:
- issue: कथात्मक ऐतिहासिक वर्तमान
  choice: हिन्दी में भूतकाल ‘आया’
  alternative: वर्तमान ‘आता है’
  rationale: मरकुस का यूनानी ऐतिहासिक वर्तमान जीवंत है, पर आधुनिक हिन्दी कथा में भूतकाल अधिक स्वाभाविक है और घटनार्थ नहीं बदलता।
- issue: भौगोलिक पदबंध καὶ πέραν τοῦ Ἰορδάνου
  choice: मुख्य पाठ में ‘यहूदिया के प्रदेश और यरदन के पार के इलाके’
  alternative: ‘यरदन के पार स्थित यहूदिया के प्रदेश’
  rationale: यूनानी वाक्य-विन्यास यह अस्पष्टता रहने देता है कि यह दूसरा भौगोलिक वर्णन है या यहूदिया को विशेषित करता है; मुख्य पाठ पहले सम्भव अर्थ को रखता है और पादटिप्पणी दूसरे को दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भीड़’ को हिन्दी में स्वाभाविक सामूहिक एकवचन के रूप में लिया गया है। पद में केवल एक पादटिप्पणी रखी गई है, क्योंकि उपलब्ध अंग्रेज़ी पादटिप्पणियों के चिह्न और विषय परस्पर असंगत थे; यूनानी से प्रमाणित वास्तविक भौगोलिक अस्पष्टता को [a] में स्पष्ट किया गया है।
