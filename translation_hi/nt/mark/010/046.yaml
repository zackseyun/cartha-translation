id: MRK.10.46
reference: Mark 10:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἔρχονται εἰς Ἰεριχώ. καὶ ἐκπορευομένου αὐτοῦ ἀπὸ Ἰεριχὼ καὶ τῶν μαθητῶν αὐτοῦ καὶ ὄχλου ἱκανοῦ ⸀ὁ υἱὸς Τιμαίου Βαρτιμαῖος ⸀τυφλὸς ⸂προσαίτης ἐκάθητο παρὰ τὴν ὁδόν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/046.yaml
  text: And they came to Jericho[a]. And as he was going out from Jericho, along with his disciples and a considerable crowd, Bartimaeus, the son of Timaeus, a blind beggar[c][b], was sitting beside the road.
translation:
  language: hi
  text: 'वे यरीहो पहुँचे[a]। जब वह अपने शिष्यों और एक बड़ी भीड़[b] के साथ यरीहो से बाहर जा रहा था, तब तिमाई का पुत्र बरतिमाई, एक अंधा भिखारी, सड़क के किनारे[c] बैठा था।


    [a] यूनानी में शाब्दिक रूप से “वे यरीहो पहुँचते हैं” है। कथा-वर्णन में प्रयुक्त इस वर्तमान काल को स्वाभाविक हिन्दी में भूतकाल से व्यक्त किया गया है।

    [b] या “काफ़ी बड़ी भीड़।”

    [c] या “मार्ग के पास।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “वे यरीहो पहुँचते हैं” है। कथा-वर्णन में प्रयुक्त इस वर्तमान काल को स्वाभाविक हिन्दी में भूतकाल से व्यक्त किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या “काफ़ी बड़ी भीड़।”
    reason: lexical_alternative
  - marker: c
    text: या “मार्ग के पास।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: पहुँचे
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर स्वाभाविक हिन्दी कथा-शैली में भूतकाल उपयुक्त है। “पहुँचे” यरीहो आने की घटना और क्रम को स्पष्ट रखता है।
- source_word: ἐκπορευομένου αὐτοῦ
  choice: जब वह ... बाहर जा रहा था
  rationale: सम्बन्धवाचक कृदन्त मुख्य घटना के साथ चल रही क्रिया बताता है। यह रूप निरन्तर गति और समकालिकता दोनों बनाए रखता है।
- source_word: ὄχλου ἱκανοῦ
  choice: एक बड़ी भीड़
  rationale: यहाँ ἱκανός भीड़ के पर्याप्त या उल्लेखनीय आकार को व्यक्त करता है। “बड़ी भीड़” सहज और स्पष्ट आधुनिक हिन्दी है।
- source_word: ὁ υἱὸς Τιμαίου Βαρτιμαῖος
  choice: तिमाई का पुत्र बरतिमाई
  rationale: मूल पाठ में नाम और उसकी व्याख्यात्मक पहचान दोनों हैं। हिन्दी का यह क्रम दोनों को संक्षेप और स्पष्टता से सुरक्षित रखता है।
- source_word: τυφλὸς προσαίτης
  choice: एक अंधा भिखारी
  rationale: दोनों शब्दों का सीधा, सामान्य और सुलभ हिन्दी अनुवाद है; व्यक्ति की दशा और जीवन-स्थिति दोनों व्यक्त होती हैं।
- source_word: παρὰ τὴν ὁδόν
  choice: सड़क के किनारे
  rationale: παρά यहाँ मार्ग से लगी हुई स्थिति बताता है। “सड़क के किनारे” आधुनिक हिन्दी में स्वाभाविक है और स्थान-संबंध को स्पष्ट करता है।
- source_word: Ἰεριχώ
  choice: यरीहो
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: बरतिमाई की कथात्मक पहचान
  choice: व्यक्तिगत नाम “बरतिमाई” और व्याख्यात्मक पद “तिमाई का पुत्र” दोनों मुख्य पाठ में रखे गए हैं।
  alternative: केवल “तिमाई का पुत्र” या केवल “बरतिमाई” लिखना।
  rationale: मूल यूनानी दोनों विवरण देता है। दोनों को रखना कथात्मक सूचना को घटाए बिना स्रोत की संरचना और सम्भव सेमिटिक नाम-व्याख्या को सुरक्षित रखता है।
- issue: यीशु के नाम के स्थान पर सर्वनाम
  choice: मूल के αὐτοῦ के अनुरूप “वह” रखा गया है।
  alternative: स्पष्टता के लिए “यीशु” जोड़ना।
  rationale: इस पद में नाम निहित रूप से नहीं, बल्कि पूर्वसंदर्भ से पहचाना जाता है। सर्वनाम रखना मूल की संदर्भ-निर्भरता को अनावश्यक रूप से स्पष्ट किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप “यरीहो,” “तिमाई,” और “बरतिमाई” रखे गए हैं। वाक्य-रचना मूल की दो क्रमिक घटनाओं—यरीहो पहुँचना और वहाँ से बाहर जाना—को बिना समतल किए सुरक्षित रखती है।
