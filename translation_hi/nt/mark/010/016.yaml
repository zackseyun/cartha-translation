  text: καὶ ἐναγκαλισάμενος αὐτὰ ⸂κατευλόγει τιθεὶς τὰς χεῖρας ἐπ’ αὐτά⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/016.yaml
  text: And he took them in his arms and blessed them[b][a], laying his hands on them.
translation:
  language: hi
  text: और उसने उन्हें अपनी बाँहों में लिया[a] और उन पर हाथ रखकर उन्हें आशीष देता रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें गले लगाया’। यूनानी क्रिया विशेष रूप से किसी को अपनी बाँहों में लेने का अर्थ देती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी क्रिया का रूप चलती या बार-बार होती क्रिया का संकेत देता है; इसमें ‘उन्हें बार-बार’ या ‘बड़े स्नेह से आशीष देता रहा’ का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐναγκαλισάμενος
  choice: अपनी बाँहों में लिया
  rationale: यह क्रिया किसी को बाँहों में लेने को विशेष रूप से व्यक्त करती है; यह सामान्य ‘गले लगाया’ से अधिक ठोस है और यीशु के स्नेहपूर्ण कार्य को स्वाभाविक आधुनिक हिन्दी में रखती है।
- source_word: κατευλόγει
  choice: आशीष देता रहा
  rationale: अपूर्ण भूतकाल चलती या बार-बार होती क्रिया का संकेत देता है, और उपसर्गयुक्त क्रिया में प्रबलता का भाव भी हो सकता है। ‘आशीष देता रहा’ कालगत पक्ष को मुख्य पाठ में स्वाभाविक रूप से दर्शाता है; प्रबलता की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: τιθεὶς τὰς χεῖρας ἐπ’ αὐτά
  choice: उन पर हाथ रखकर
  rationale: यह सहभागी पद बताता है कि आशीष देते समय उसने क्या किया। ‘हाथ रखकर’ हिन्दी में स्वाभाविक है और मूल के ठोस संकेत को बिना अतिरिक्त अनुष्ठानिक अर्थ जोड़े सुरक्षित रखता है।
- source_word: αὐτὰ ... αὐτά
  choice: उन्हें ... उन पर ... उन्हें
  rationale: सर्वनाम निकटवर्ती प्रसंग में बच्चों की ओर संकेत करते हैं। हिन्दी में सर्वनाम का प्रयोग सहज है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: καὶ
  choice: और
  rationale: सरल संयोजक मरकुस की कथात्मक शैली को बनाए रखता है और मूल में निहित न होने वाला अतिरिक्त कालगत या निष्कर्षात्मक बल नहीं जोड़ता।
theological_decisions:
- issue: बच्चों के प्रति यीशु के कार्य का स्वरूप
  choice: बाँहों में लेने, हाथ रखने और आशीष देने के ठोस कार्यों को स्पष्ट रखा गया है, पर बाद की संस्कार-संबंधी या अनुष्ठानिक शब्दावली नहीं जोड़ी गई।
  alternative: ‘उसने हाथ रखकर विधिपूर्वक उन्हें आशीष दी’ या ‘उसने उन पर आशीष का संस्कार किया।’
  rationale: मूल पाठ स्नेहपूर्ण स्वागत और आशीष का वर्णन करता है, पर इन कार्यों को किसी बाद की सैद्धान्तिक श्रेणी में परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘बाँहों’ स्नेहपूर्ण शारीरिक क्रिया को स्पष्ट करता है; ‘आशीष देता रहा’ यूनानी अपूर्ण भूतकाल को सहज हिन्दी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
