  source_fidelity: 'The Hindi accurately represents the SBLGNT: the adversative δέ is conveyed by “पर,” the circumstantial participle by “जब यीशु ने यह देखा,” ἠγανάκτησεν by the appropriately strong but controlled “बहुत नाराज़ हुए,” and both imperatives are clearly rendered. “परमेश्वर का राज्य ऐसों ही का है” preserves the genitive construction and the representative openness of τῶν τοιούτων without defining the relevant childlike quality.'
  naturalness: The text is fluent modern standard Hindi with an appropriately dignified biblical register. The honorific plural for Jesus is consistently maintained. “बच्चों को मेरे पास आने दो; उन्हें मत रोको” is idiomatic and direct.
  terminology: “यीशु,” “परमेश्वर,” and “परमेश्वर का राज्य” are standard, clear biblical Hindi terms. “ऐसों ही का” suitably retains the source’s non-specific reference to those like the children and does not introduce a doctrinal interpretation.
