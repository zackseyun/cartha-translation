  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδὼν δὲ ὁ Ἰησοῦς ἠγανάκτησεν καὶ εἶπεν αὐτοῖς· Ἄφετε τὰ παιδία ἔρχεσθαι πρός με, μὴ κωλύετε αὐτά, τῶν γὰρ τοιούτων ἐστὶν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/014.yaml
  text: But when Jesus saw it[a], he was indignant and said to them, “Let the children come to me; do not hinder them, for the kingdom of God belongs to such as these.”
translation:
  language: hi
  text: पर जब यीशु ने यह देखा, तो वे बहुत नाराज़ हुए और उनसे कहा, “बच्चों को मेरे पास आने दो; उन्हें मत रोको, क्योंकि परमेश्वर का राज्य ऐसों ही का है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδὼν δὲ ὁ Ἰησοῦς
  choice: पर जब यीशु ने यह देखा
  rationale: अओरिस्ट कृदंत यीशु की प्रतिक्रिया की परिस्थिति बताता है। हिन्दी में संदर्भगत कर्म ‘यह’ स्वाभाविक है, और δὲ पिछले पद में शिष्यों के व्यवहार के साथ हल्का विरोध दिखाता है।
- source_word: ἠγανάκτησεν
  choice: बहुत नाराज़ हुए
  rationale: यह क्रिया तीव्र अप्रसन्नता और रोष व्यक्त करती है। ‘बहुत नाराज़’ आधुनिक सामान्य हिन्दी में स्वाभाविक है और अनियंत्रित क्रोध का अनावश्यक भाव नहीं जोड़ता।
- source_word: Ἄφετε τὰ παιδία ἔρχεσθαι πρός με
  choice: बच्चों को मेरे पास आने दो
  rationale: Ἄφετε यहाँ अनुमति देने के अर्थ में आज्ञार्थक है; यह हिन्दी में सीधा और स्वाभाविक रूप है। παιδία को केवल ‘बच्चों’ से व्यक्त किया गया है, बिना ऐसा लघुतासूचक भाव जोड़े जो संज्ञा में अनिवार्य नहीं है।
- source_word: μὴ κωλύετε αὐτά
  choice: उन्हें मत रोको
  rationale: κωλύω का अर्थ बाधा देना या रोकना है। ‘मत रोको’ संक्षिप्त, वर्तमान हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: τῶν γὰρ τοιούτων ἐστὶν
  choice: क्योंकि ... ऐसों ही का है
  rationale: यह रूप यूनानी की संबंधवाचक बनावट और τοιούτων के प्रतिनिधिक अर्थ—‘इस प्रकार के लोगों’—दोनों को संक्षेप में सुरक्षित रखता है, बिना यह बताए कि बच्चों का कौन-सा गुण अभिप्रेत है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित, स्पष्ट और मूल पदबंध के निकट हिन्दी अभिव्यक्ति है।
theological_decisions:
- issue: ‘τῶν ... τοιούτων’ में परमेश्वर का राज्य किनका बताया गया है
  choice: ‘ऐसों ही का’—इन बच्चों जैसे लोगों की ओर प्रतिनिधिक संकेत
  alternative: इसे केवल उपस्थित वास्तविक बच्चों तक सीमित समझना, या किसी विशेष बाल-सदृश गुण को अनुवाद में स्पष्ट जोड़ देना
  rationale: τοιούτων स्वाभाविक रूप से ‘ऐसे लोगों’ को दर्शाता है। पाठ यह नहीं बताता कि समानता का निर्णायक गुण मासूमियत, नम्रता, निर्भरता या कुछ और है; इसलिए अनुवाद उस धार्मिक तनाव और खुलेपन को बनाए रखता है।
- issue: ἐστὶν के संबंधवाचक अर्थ का हिन्दी रूप
  choice: ‘परमेश्वर का राज्य ऐसों ही का है’
  alternative: ‘परमेश्वर का राज्य ऐसे लोगों से बना है’ या ‘ऐसे लोगों के लिए है’
  rationale: चुना हुआ रूप अधिकार/संबंध को व्यक्त करता है, पर राज्य की संरचना या प्रवेश की शर्त के विषय में मूल से अधिक निश्चित दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। यीशु के लिए आदरसूचक बहुवचन (‘वे’, ‘हुए’) प्रयुक्त है। कोई पादटिप्पणी आवश्यक नहीं, क्योंकि ‘ऐसों ही का है’ मूल की संक्षिप्तता और प्रतिनिधिक अस्पष्टता को मुख्य पाठ में सुरक्षित रखता है।
