language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ περιβλεψάμενος ὁ Ἰησοῦς λέγει τοῖς μαθηταῖς αὐτοῦ· Πῶς δυσκόλως οἱ τὰ χρήματα ἔχοντες εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελεύσονται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/023.yaml
  text: And looking around[a], Jesus says to his disciples, “How difficult it is for those who have wealth to enter the kingdom of God!”
translation:
  language: hi
  text: और यीशु ने चारों ओर देखकर अपने चेलों से कहा, “जिनके पास धन है, उनका परमेश्वर के राज्य में प्रवेश करना कितना कठिन होगा!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβλεψάμενος
  choice: चारों ओर देखकर
  rationale: क्रिया-विशेषणात्मक एओरिस्ट कृदंत यीशु के आसपास दृष्टि डालने को मुख्य क्रिया से पहले घटित दिखाता है; हिन्दी में ‘चारों ओर देखकर’ क्रम और स्वाभाविकता दोनों बनाए रखता है।
- source_word: λέγει
  choice: कहा
  rationale: यह मरकुस का ऐतिहासिक वर्तमान है। हिन्दी कथा-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है और घटना के अर्थ को नहीं बदलता।
- source_word: Πῶς δυσκόλως
  choice: कितना कठिन होगा
  rationale: यह संयोजन कठिनाई पर विस्मयात्मक बल देता है; भविष्यकालीन εἰσελεύσονται के कारण ‘होगा’ भावी अभिमुखता भी सुरक्षित रखता है।
- source_word: οἱ τὰ χρήματα ἔχοντες
  choice: जिनके पास धन है
  rationale: यह कृदंत पदबंध को किसी स्थिर सामाजिक उपाधि ‘धनी’ में बदलने के बजाय संपत्ति रखने वाले लोगों के रूप में सीधे व्यक्त करता है।
- source_word: χρήματα
  choice: धन
  rationale: ‘धन’ पैसे और भौतिक संपदा दोनों के व्यापक अर्थ को स्वाभाविक तथा संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह पारदर्शी और प्रचलित बाइबलीय पद है, जो राज्य की ठोस उपमा और परमेश्वर के शासन—दोनों आयामों को खुला रखता है।
- source_word: εἰσελεύσονται
  choice: प्रवेश करना ... कठिन होगा
  rationale: ग्रीक भविष्यकाल का अर्थ हिन्दी की संरचना ‘प्रवेश करना ... कठिन होगा’ में स्वाभाविक रूप से सुरक्षित रहता है।
theological_decisions:
- issue: क्या कथन धन रखने वालों के लिए पूर्ण असंभवता बताता है या अत्यधिक कठिनाई
  choice: 'अत्यधिक कठिनाई: ‘प्रवेश करना कितना कठिन होगा!’'
  alternative: ऐसा तीखा अनुवाद जो इसे व्यावहारिक या पूर्ण असंभवता ठहराए
  rationale: ग्रीक δυσκόλως कठिनाई व्यक्त करता है, असंभवता नहीं। अनुवाद कथन की गंभीरता बनाए रखता है, पर इस पद से अधिक कठोर धर्मवैचारिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथात्मक भूतकाल में दिया गया है। किसी पाद-टिप्पणी की आवश्यकता नहीं, क्योंकि ‘धन’ χρήματα की पर्याप्त व्यापकता व्यक्त करता है।
