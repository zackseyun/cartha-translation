lexical_decisions:
- source_word: ἀπὸ δὲ ἀρχῆς κτίσεως
  choice: परन्तु सृष्टि के आरम्भ से ही
  rationale: ‘परन्तु’ पिछले प्रसंग से विरोध दर्शाता है। ‘सृष्टि के आरम्भ से’ काल के आरम्भ-बिन्दु को व्यक्त करता है; ‘ही’ आधुनिक हिन्दी में इस मुहावरे को स्वाभाविक और बलयुक्त बनाता है।
- source_word: ἄρσεν καὶ θῆλυ
  choice: नर और नारी
  rationale: यह उत्पत्ति के सृष्टि-वर्णन में जैविक नर-मादा युग्म को दर्शाता है। मनुष्यों के लिए ‘नर और नारी’ गरिमापूर्ण और स्पष्ट है तथा ‘पुरुष और स्त्री’ की अपेक्षा मूल शब्दों के लैंगिक भेद को निकटता से रखता है।
- source_word: ἐποίησεν
  choice: बनाया
  rationale: ποιέω का सीधा अर्थ ‘बनाना’ है। उत्पत्ति की पृष्ठभूमि में ‘सृजा’ सम्भव है, पर वह यहाँ प्रयुक्त यूनानी क्रिया से अधिक विशिष्ट होगा।
- source_word: αὐτούς
  choice: उन्हें
  rationale: बहुवचन सर्वनाम को बिना अतिरिक्त ‘दोनों’ जोड़े स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: उत्पत्ति के उद्धरण में लैंगिक पदों का अनुवाद
  choice: नर और नारी
  alternative: पुरुष और स्त्री
  rationale: चुना हुआ रूप मूल के ἄρσεν–θῆλυ युग्म और उसके सृष्टिगत, जैविक संकेत को सुरक्षित रखता है; सामाजिक भूमिकाओं का अर्थ नहीं जोड़ता।
- issue: क्रिया के निहित कर्ता का निरूपण
  choice: उसने उन्हें… बनाया
  alternative: परमेश्वर ने उन्हें… बनाया
  rationale: यूनानी पाठ में कर्ता का नाम नहीं दिया गया, बल्कि तीसरे पुरुष की क्रिया से वह प्रसंग में समझा जाता है। ‘उसने’ स्पष्ट हिन्दी देता है और ‘परमेश्वर’ को व्याख्यात्मक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘आरम्भ’ तथा ‘सृष्टि’ बाइबलीय संदर्भ के अनुकूल प्रचलित शब्द हैं।
