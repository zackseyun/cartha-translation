  text: परन्तु सृष्टि के आरम्भ से[b] उसने उन्हें नर और नारी बनाया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उन्हें नर और नारी के रूप में रचा।” यहाँ यूनानी क्रिया का अर्थ “बनाया” है, यद्यपि “रचा” उत्पत्ति की पृष्ठभूमि को अधिक स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “परन्तु सृष्टि के आरम्भ से नर और नारी उसने उन्हें बनाया।” यह यूनानी शब्द-क्रम के अधिक निकट है।
