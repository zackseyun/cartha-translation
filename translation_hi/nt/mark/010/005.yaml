source:
  edition: SBLGNT
  text: ⸂ὁ δὲ⸃ Ἰησοῦς εἶπεν αὐτοῖς· Πρὸς τὴν σκληροκαρδίαν ὑμῶν ἔγραψεν ὑμῖν τὴν ἐντολὴν ταύτην·
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/005.yaml
  text: But Jesus said to them[c][b][a], “Because of your hardness of heart he wrote this commandment for you.”
translation:
  language: hi
  text: पर यीशु ने उनसे कहा, “तुम्हारे हृदय की कठोरता[b] के कारण उसने[a] तुम्हारे लिए यह आज्ञा[c] लिखी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् मूसा ने, जिसका उल्लेख पिछले पद में हुआ है।
    reason: cross_reference
  - marker: b
    text: या, ‘कठोर-हृदयता।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘आदेश।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: 'यह संवाद में हल्का विरोध या मोड़ दिखाता है: फरीसियों द्वारा मूसा का उल्लेख किए जाने पर यीशु उसका उत्तर देते हैं।'
- source_word: Πρὸς
  choice: के कारण
  rationale: यहाँ कर्मकारक के साथ πρός उनकी दशा के संबंध में कारण या आधार व्यक्त करता है; आधुनिक हिन्दी में ‘के कारण’ इसे स्वाभाविक ढंग से बताता है।
- source_word: σκληροκαρδίαν
  choice: हृदय की कठोरता
  rationale: यह यूनानी संयुक्त शब्द हृदय की कठोरता या अड़ियलपन बताता है। यह चयन बाइबलीय रूपक को बनाए रखता है और अर्थ को केवल ‘हठ’ तक सीमित नहीं करता।
- source_word: ἔγραψεν
  choice: उसने ... लिखी
  rationale: यूनानी में कर्ता निहित एकवचन है और पिछले पद के मूसा की ओर संकेत करता है। ‘उसने’ मूल पाठ की अभिव्यक्ति और संदर्भगत प्रवाह दोनों बनाए रखता है।
- source_word: ἐντολήν
  choice: आज्ञा
  rationale: यह अधिकारपूर्ण आदेश को दर्शाता है। ‘आज्ञा’ मूसा की व्यवस्था से संबंधित प्रसंग के अनुकूल, गरिमापूर्ण और सामान्य हिन्दी शब्द है।
- source_word: ταύτην
  choice: यह
  rationale: संकेतवाचक शब्द चर्चा में आई विशेष आज्ञा की ओर इशारा करता है; हिन्दी में ‘यह’ पर्याप्त और स्वाभाविक है।
theological_decisions:
- issue: ‘लिखी’ के कर्ता के रूप में मूसा का नाम स्पष्ट किया जाए या नहीं
  choice: मूल की तरह निहित कर्ता को ‘उसने’ से व्यक्त किया गया है, जिसकी पहचान पिछले पद से मूसा के रूप में होती है।
  alternative: ‘मूसा ने तुम्हारे लिए यह आज्ञा लिखी।’
  rationale: इस पद में यूनानी पाठ मूसा का नाम दोबारा नहीं देता। सर्वनाम रखने से अनावश्यक बल जोड़े बिना मूल संवाद-प्रवाह और संदर्भ पर निर्भरता सुरक्षित रहती है।
- issue: σκληροκαρδίαν के नैतिक और बाइबलीय रूपक को कैसे सुरक्षित रखा जाए
  choice: ‘हृदय की कठोरता’
  alternative: ‘कठोर हृदय’ या ‘हठ’
  rationale: यह अनुवाद मूल के हृदय-संबंधी रूपक तथा उसकी नैतिक गंभीरता को बनाए रखता है, लेकिन किसी अतिरिक्त धर्मसैद्धांतिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण संवादात्मक रूप अपनाया गया है। ‘हृदय की कठोरता’ बाइबलीय रूपक को सुरक्षित रखता है; ‘आज्ञा’ विधिक-अधिकारपूर्ण भाव देता है। सभी पाद-टिप्पणी चिह्न संबंधित शब्द या वाक्यांश के तुरंत बाद रखे गए हैं।
