  text: Καὶ προσέφερον αὐτῷ παιδία ἵνα ⸂αὐτῶν ἅψηται⸃· οἱ δὲ μαθηταὶ ⸂ἐπετίμησαν αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/013.yaml
  text: And they were bringing children to him so that he might touch them[a], but the disciples rebuked them.
translation:
  language: hi
  text: लोग बच्चों[a] को यीशु के पास ला रहे थे ताकि वह उन्हें छुए, लेकिन चेलों ने उन लोगों को डाँटा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छोटे बच्चों।” यूनानी शब्द παιδία बच्चों के लिए व्यापक रूप से प्रयुक्त हो सकता है और उसमें छोटे बच्चे भी शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ केवल “उन्हें” है। इसका सबसे स्वाभाविक संकेत बच्चों को लानेवाले लोगों की ओर है; व्याकरण की दृष्टि से इसे बच्चों के लिए भी समझा जा सकता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: προσέφερον
  choice: ला रहे थे
  rationale: अपूर्ण भूतकाल की जारी या बार-बार होने वाली क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। ‘के पास’ προσφέρω के यहाँ प्रयुक्त ‘किसी व्यक्ति के सामने/पास लाना’ अर्थ को स्पष्ट करता है।
- source_word: παιδία
  choice: बच्चों
  rationale: यह शब्द सामान्य रूप से बच्चों, जिनमें छोटे बच्चे भी शामिल हो सकते हैं, के लिए प्रयुक्त होता है; इसलिए ‘बच्चों’ व्यापक और स्वाभाविक विकल्प है।
- source_word: ἵνα αὐτῶν ἅψηται
  choice: कि वह उन्हें छुए
  rationale: ἵνα और संभावनार्थक क्रिया उद्देश्य व्यक्त करते हैं। ‘छुए’ ἅπτομαι का सीधा अर्थ रखता है और समानांतर वृत्तांतों से ‘हाथ रखे’ नहीं जोड़ता।
- source_word: ἐπετίμησαν
  choice: डाँटा
  rationale: यह ἐπιτιμάω की कड़ी फटकार को साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτοῖς
  choice: उन लोगों को
  rationale: संदर्भ में इसका सबसे स्वाभाविक संकेत उन लोगों की ओर है जो बच्चों को ला रहे थे। ‘उन लोगों’ से हिन्दी में अपेक्षित आशय स्पष्ट होता है, जबकि पाठगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: δὲ
  choice: लेकिन
  rationale: बच्चों को लाने और चेलों की विरोधी प्रतिक्रिया के बीच हल्का विरोध स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: चेलों की डाँट किसके लिए थी
  choice: बच्चों को लानेवाले लोगों के लिए
  alternative: बच्चों के लिए
  rationale: बहुवचन सर्वनाम αὐτοῖς का सबसे संगत पूर्वपद बच्चों को लानेवाला अव्यक्त बहुवचन कर्ता है। फिर भी यूनानी सर्वनाम स्वयं इस संदर्भ को नाम लेकर स्पष्ट नहीं करता, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘यीशु के पास’ में नाम जोड़ने से स्वतंत्र पद के रूप में संदर्भ स्पष्ट रहता है। ‘डाँटा’ आम पाठक के लिए ‘फटकार लगाई’ की अपेक्षा अधिक सीधा है, पर मूल क्रिया की कठोरता बनाए रखता है।
