id: MRK.10.15
reference: Mark 10:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν λέγω ὑμῖν, ὃς ⸀ἂν μὴ δέξηται τὴν βασιλείαν τοῦ θεοῦ ὡς παιδίον, οὐ μὴ εἰσέλθῃ εἰς αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/015.yaml
  text: Truly I say to you[a], whoever does not receive the kingdom of God like a child will certainly not enter it.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, जो कोई परमेश्वर के राज्य को एक बच्चे की तरह[a] ग्रहण नहीं करता, वह उसमें निश्चय ही प्रवेश नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक बच्चे के रूप में।’ यह वाक्यांश बच्चे जैसी नम्रता, भरोसे या निर्भरता की ओर संकेत कर सकता है, पर यूनानी पाठ किसी एक भाव को स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह एक गंभीर और अधिकारपूर्ण कथन का परिचय देता है। ‘सच’ आधुनिक हिन्दी में इसके बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह यूनानी क्रिया और बहुवचन सर्वनाम का सीधा, स्वाभाविक हिन्दी रूप है।
- source_word: ὃς ἂν
  choice: जो कोई
  rationale: सम्बन्धवाचक सर्वनाम के साथ ἄν अनिश्चित और सामान्य अर्थ देता है; ‘जो कोई’ उस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: μὴ δέξηται
  choice: ग्रहण नहीं करता
  rationale: δέχομαι का अर्थ ग्रहण करना, स्वीकार करना या स्वागत करना हो सकता है। ‘ग्रहण करना’ राज्य को उपलब्धि के रूप में नहीं, बल्कि विनम्रतापूर्वक पाई जाने वाली वास्तविकता के रूप में प्रस्तुत करता है, बिना किसी विशेष गुण को जोड़ने के।
- source_word: βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह सुसमाचारों में प्रचलित और प्रसंगानुकूल पद है तथा शासन और राज्य-क्षेत्र—दोनों अर्थ-आयामों को खुला रखता है।
- source_word: ὡς παιδίον
  choice: एक बच्चे की तरह
  rationale: ὡς तुलना व्यक्त करता है और παιδίον बच्चे को सूचित करता है। यह स्वाभाविक हिन्दी है और बच्चे के किस गुण की ओर संकेत है, इसे निर्धारित नहीं करता।
- source_word: οὐ μὴ εἰσέλθῃ
  choice: निश्चय ही प्रवेश नहीं करेगा
  rationale: οὐ μή के साथ एओरिस्ट सब्जंक्टिव अत्यन्त प्रबल निषेध व्यक्त करता है। ‘निश्चय ही ... नहीं करेगा’ उसी बल को स्पष्ट, आधुनिक हिन्दी में रखता है।
- source_word: εἰς αὐτήν
  choice: उसमें
  rationale: स्त्रीलिंग सर्वनाम का संकेत ‘परमेश्वर के राज्य’ की ओर है; हिन्दी में ‘उसमें प्रवेश करना’ स्वाभाविक और सटीक है।
theological_decisions:
- issue: परमेश्वर के राज्य को ‘एक बच्चे की तरह’ ग्रहण करने का अर्थ
  choice: उपमा को उसके खुले अर्थ में रखा गया है और बच्चे के किसी एक गुण को निर्दिष्ट नहीं किया गया।
  alternative: इसे विशेष रूप से बच्चे जैसी नम्रता, भरोसे या निर्भरता के अर्थ में समझाना।
  rationale: यूनानी पाठ तुलना तो करता है, पर यह नहीं बताता कि बच्चे का कौन-सा गुण अभिप्रेत है। किसी एक व्याख्यात्मक परम्परा को पाठ में जोड़ने के बजाय मूल की अर्थगत खुलावट सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ग्रहण’ बाइबलीय प्रसंग में परिचित होते हुए भी बोधगम्य है; प्रबल निषेध को पुरातन ‘कदापि’ के बजाय ‘निश्चय ही ... नहीं’ से व्यक्त किया गया है।
