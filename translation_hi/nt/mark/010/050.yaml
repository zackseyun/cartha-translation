base_translation:
  language: en
  yaml_path: translation/nt/mark/010/050.yaml
  text: And throwing off his cloak[a], he sprang up and came to Jesus.
translation:
  language: hi
  text: और वह अपना चोगा फेंककर[a] उछल पड़ा और यीशु के पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपना वस्त्र एक ओर डालकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποβαλών
  choice: फेंककर
  rationale: यह क्रिया एक निर्णायक और तत्परता-भरे ढंग से वस्त्र को उतार फेंकने या अलग डालने का भाव देती है; ‘फेंककर’ दृश्य की आकस्मिकता बनाए रखता है।
- source_word: ἱμάτιον
  choice: चोगा
  rationale: यह शब्द सामान्यतः ऊपर पहने जाने वाले वस्त्र को दर्शाता है। ‘चोगा’ संक्षिप्त, सहज और प्रसंगानुकूल है।
- source_word: ἀναπηδήσας
  choice: उछल पड़ा
  rationale: यह सहसा और उत्साह से उठने की क्रिया व्यक्त करता है। ‘उछल पड़ा’ उसकी तत्परता और ऊर्जावान गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἦλθεν πρὸς τὸν Ἰησοῦν
  choice: यीशु के पास आया
  rationale: यह वाक्यांश यीशु की ओर बढ़कर उनके पास पहुँचने को व्यक्त करता है; हिन्दी कथन में यह सबसे सहज रूप है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध का भाव जोड़े बिना प्रवाह बनाए रखता है।
