id: MRK.10.33
reference: Mark 10:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅτι Ἰδοὺ ἀναβαίνομεν εἰς Ἱεροσόλυμα, καὶ ὁ υἱὸς τοῦ ἀνθρώπου παραδοθήσεται τοῖς ἀρχιερεῦσιν καὶ ⸀τοῖς γραμματεῦσιν, καὶ κατακρινοῦσιν αὐτὸν θανάτῳ καὶ παραδώσουσιν αὐτὸν τοῖς ἔθνεσιν
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/033.yaml
  text: that[a], ‘Look, we are going up to Jerusalem, and the Son of Man will be handed over to the chief priests and the scribes[b], and they will condemn him to death and hand him over to the Gentiles.’
translation:
  language: hi
  text: कि, “देखो, हम यरूशलेम जा रहे हैं, और मनुष्य का पुत्र प्रधान याजकों और शास्त्रियों के हाथ सौंप दिया जाएगा[a]। वे उसे मृत्युदंड देंगे और अन्यजातियों के हाथ सौंप देंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “के हवाले कर दिया जाएगा।” इसी यूनानी क्रिया का प्रयोग पद के अंत में “सौंप देंगे” के लिए भी हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या “राष्ट्रों के हाथ”; यहाँ आशय गैर-यहूदियों से है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: कि
  rationale: यह पिछले पद में आरम्भ हुई यीशु की बात की विषय-वस्तु प्रस्तुत करता है; इसलिए कारणसूचक अर्थ जोड़े बिना ‘कि’ स्वाभाविक है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान आगामी गंभीर घोषणा की ओर खींचने वाला बलयुक्त, किंतु आधुनिक और स्वाभाविक संबोधन है।
- source_word: ἀναβαίνομεν
  choice: हम ... जा रहे हैं
  rationale: यरूशलेम की ओर वर्तमान यात्रा को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी क्रिया का ‘ऊपर जाना’ भौगोलिक संकेत हिन्दी में ‘यरूशलेम जा रहे हैं’ में सहज रूप से निहित रहने दिया गया है, ताकि भाषा कृत्रिम न हो।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की आत्म-पदवी का स्थापित शाब्दिक अनुवाद है और उसके शास्त्रीय तथा मसीही अर्थ-संकेतों को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: παραδοθήσεται / παραδώσουσιν
  choice: सौंप दिया जाएगा / सौंप देंगे
  rationale: दोनों रूपों में एक ही मूल क्रिया की पुनरावृत्ति सुरक्षित रखी गई है। ‘सौंपना’ किसी दूसरे के अधिकार में दिए जाने का व्यापक अर्थ रखता है और पहले प्रयोग को केवल ‘विश्वासघात’ तक सीमित नहीं करता।
- source_word: τοῖς ἀρχιερεῦσιν
  choice: प्रधान याजकों
  rationale: यह एक प्रधान याजक नहीं, बल्कि अगुवे याजकीय अधिकारियों के समूह को दर्शाता है; ‘प्रधान याजक’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और स्थापित है।
- source_word: τοῖς γραμματεῦσιν
  choice: शास्त्रियों
  rationale: यह सीधा, संक्षिप्त और स्थापित समतुल्य है; ‘व्यवस्था के शिक्षक’ मूल पद की व्याख्या का कुछ अंश जोड़ देता।
- source_word: κατακρινοῦσιν αὐτὸν θανάτῳ
  choice: वे उसे मृत्युदंड देंगे
  rationale: यूनानी पदबंध के औपचारिक न्यायिक निर्णय को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἔθνεσιν
  choice: अन्यजातियों
  rationale: इस दुःखभोग-संदर्भ में यह यहूदी अगुवों से गैर-यहूदी अधिकारियों को सौंपे जाने का ऐतिहासिक भेद व्यक्त करता है; ‘राष्ट्रों’ की अपेक्षा यह अधिक प्रसंगानुकूल है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: स्थापित शाब्दिक रूप यूनानी अभिव्यक्ति, दानिय्येल-संबंधी अनुगूँज और मसीही आत्म-पदवी को सुरक्षित रखता है, जबकि विकल्प हिन्दी में कम स्वाभाविक और कम परिचित है।
- issue: τοῖς ἔθνεσιν का संदर्भगत अर्थ
  choice: अन्यजातियों
  alternative: राष्ट्रों
  rationale: तात्कालिक प्रसंग गैर-यहूदी शासकीय अधिकारियों को सौंपे जाने की ओर संकेत करता है। यह चुनाव ऐतिहासिक यहूदी–गैर-यहूदी भेद बनाए रखता है, पर उससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: παραδίδωμι में विश्वासघात अथवा अधिकार में सौंपे जाने का प्रश्न
  choice: सौंपना
  alternative: पकड़वाना / विश्वासघात करके सौंपना
  rationale: मूल क्रिया स्वयं हर स्थान पर विश्वासघात का ढंग या कर्ता स्पष्ट नहीं करती। व्यापक ‘सौंपना’ उस वास्तविक अस्पष्टता को सुरक्षित रखता और दोनों घटनाओं की कड़ी दिखाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’, ‘जा रहे हैं’ और ‘सौंप देंगे’ बोलचाल में स्वाभाविक हैं, जबकि ‘मनुष्य का पुत्र’, ‘प्रधान याजक’, ‘शास्त्री’ और ‘अन्यजाति’ आवश्यक बाइबलीय अर्थ-सूक्ष्मता बनाए रखते हैं।
