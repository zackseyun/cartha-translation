  yaml_path: translation/nt/mark/010/031.yaml
  text: But many who are first will be last[a], and the last first.
translation:
  language: hi
  text: परन्तु बहुत-से जो पहले हैं, आखिरी होंगे; और जो आखिरी हैं, पहले होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से
  rationale: यह विशेषण यहाँ संज्ञा के समान प्रयुक्त है और सभी व्यक्तियों के बजाय एक बड़े, अनिश्चित समूह को दर्शाता है। ‘बहुत-से’ इस खुले दायरे को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले कथन के बाद हल्का विरोध या मोड़ प्रकट करता है। ‘परन्तु’ प्रतिफल की प्रतिज्ञा के बाद आने वाले उलटाव को स्पष्ट करता है।
- source_word: ἔσονται
  choice: होंगे
  rationale: यह εἰμί का साधारण भविष्यकालीन रूप है; ‘होंगे’ आधुनिक हिन्दी में सीधा और स्वाभाविक भविष्यकाल है।
- source_word: πρῶτοι
  choice: पहले
  rationale: यहाँ शब्द क्रम से अधिक पद या प्रतिष्ठा का बोध करा सकता है। ‘पहले’ इस अर्थगत खुलेपन और सूत्रात्मक समानांतरता को सुरक्षित रखता है।
- source_word: ἔσχατοι
  choice: आखिरी
  rationale: यह πρῶτοι के विपरीत पद या स्थिति को दर्शाता है। ‘आखिरी’ सीधा विरोध बनाए रखता है और ‘सबसे छोटे’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: οἱ ἔσχατοι
  choice: जो आखिरी हैं
  rationale: लेखयुक्त विशेषण संज्ञात्मक है। हिन्दी में ‘जो आखिरी हैं’ व्यक्तियों का संकेत स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: καὶ
  choice: और
  rationale: यह दोनों समानांतर खंडों को सामान्य रूप से जोड़ता है; ‘और’ बिना अतिरिक्त व्याख्या जोड़े संरचना को बनाए रखता है।
theological_decisions:
- issue: उलटाव के कथन का स्वरूप
  choice: इसे अंतिम उलटाव के एक व्यापक सिद्धान्त के रूप में रखा गया है, बिना ‘पहले’ और ‘आखिरी’ को किसी विशेष सामाजिक, नैतिक या उद्धार-संबंधी वर्ग तक सीमित किए।
  alternative: इसे विशेष रूप से धनी और निर्धन, चेलों और बाहरी लोगों, या प्रत्येक व्यक्ति पर लागू होने वाले निरपेक्ष नियम के रूप में समझाना।
  rationale: पद एक व्यापक विरोधाभासी सिद्धान्त कहता है, पर स्वयं इन वर्गों को निश्चित नहीं करता। इसलिए अनुवाद इसकी संक्षिप्तता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सूत्रात्मक वाक्य। ‘परन्तु’ हल्के विरोध को तथा ‘पहले/आखिरी’ मूल के संतुलित विरोध को बनाए रखते हैं। अनावश्यक व्याख्या या सांप्रदायिक विशिष्टता नहीं जोड़ी गई।
