  naturalness: ‘परन्तु बहुत-से जो पहले हैं, आखिरी होंगे; और जो आखिरी हैं, पहले होंगे।’ आधुनिक मानक हिन्दी में स्पष्ट, स्वाभाविक और सूत्रात्मक है। ‘जो ... हैं’ हिन्दी में संज्ञात्मक विशेषणों के व्यक्ति-संदर्भ को सहज रूप से स्पष्ट करता है, बिना मूल के अर्थ को सीमित किए।
