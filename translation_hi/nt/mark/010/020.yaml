  yaml_path: translation/nt/mark/010/020.yaml
  text: And he said to him, “Teacher, I have kept all these things from my youth.”
translation:
  language: hi
  text: उसने उससे कहा, “गुरु, मैं अपनी युवावस्था से इन सबका पालन करता आया हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔφη
  choice: कहा
  rationale: यह सामान्य कथात्मक वचन-क्रिया है; हिंदी में “कहा” स्वाभाविक और अर्थ के निकट है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: संबोधन रूप किसी शिक्षा देने वाले व्यक्ति को दर्शाता है। “गुरु” आधुनिक हिंदी में स्वाभाविक संबोधन है और यहाँ अनावश्यक रूप से अधिक अधिकार का भाव नहीं जोड़ता।
- source_word: ταῦτα πάντα
  choice: इन सब बातों को
  rationale: संकेतवाचक और πᾶς का संयुक्त अर्थ पहले बताए गए सभी आदेशों की ओर है; “इन सब बातों को” सहज हिंदी में उस समूचे संदर्भ को व्यक्त करता है।
- source_word: ἐφυλαξάμην
  choice: मानता आया हूँ
  rationale: आज्ञाओं के संदर्भ में φυλάσσω का अर्थ उनका पालन करना है। “मानता आया हूँ” आज तक जारी पिछले आचरण का सार व्यक्त करता है और हिंदी में स्वाभाविक है।
- source_word: ἐκ νεότητός μου
  choice: अपनी युवावस्था से
  rationale: ἐκ के साथ कालवाचक संबंध आरंभ-बिंदु बताता है। “अपनी युवावस्था से” मूल की आयु-संबंधी व्यापकता बनाए रखता है और इसे बचपन तक सीमित नहीं करता।
- source_word: ὁ δὲ
  choice: उसने
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। हिंदी में अलग से “और” जोड़ना आवश्यक नहीं; क्रिया से स्वाभाविक कथाप्रवाह बना रहता है।
