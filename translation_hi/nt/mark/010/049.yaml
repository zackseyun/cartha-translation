  text: καὶ στὰς ὁ Ἰησοῦς εἶπεν· ⸂Φωνήσατε αὐτόν⸃. καὶ φωνοῦσι τὸν τυφλὸν λέγοντες αὐτῷ· Θάρσει, ⸀ἔγειρε, φωνεῖ σε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/049.yaml
  text: And Jesus stopped and said[a], “Call him.” And they called the blind man, saying to him, “Take courage; get up[b], he is calling you.”
translation:
  language: hi
  text: तब यीशु रुक गए और बोले, “उसे बुलाओ।” और लोगों ने उस अंधे व्यक्ति को बुलाकर उससे कहा, “हिम्मत रखो! उठो, वे तुम्हें बुला रहे हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στὰς
  choice: रुक गए
  rationale: यद्यपि इसका शाब्दिक अर्थ ‘खड़े होकर’ है, चलते हुए यीशु के इस प्रसंग में यह उनके रुक जाने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Φωνήσατε αὐτόν
  choice: उसे बुलाओ
  rationale: φωνέω यहाँ किसी को अपने पास बुलाने का आदेश देता है; यह सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: φωνοῦσι
  choice: उन्होंने ... बुलाकर
  rationale: यह अनुवाद यीशु के आदेश में प्रयुक्त उसी क्रिया की पुनरावृत्ति बनाए रखता है और हिन्दी में अगले कथन से स्वाभाविक रूप से जुड़ता है।
- source_word: τὸν τυφλὸν
  choice: उस अंधे व्यक्ति को
  rationale: यह विशेषण यहाँ संज्ञा के रूप में एक पुरुष के लिए प्रयुक्त है; ‘अंधे व्यक्ति’ आधुनिक, स्पष्ट और सम्मानपूर्ण हिन्दी है।
- source_word: Θάρσει
  choice: हिम्मत रखो
  rationale: यह आज्ञार्थक रूप साहस और आश्वासन देता है; ‘हिम्मत रखो’ साधारण आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: ἔγειρε
  choice: उठो
  rationale: यह सामने वाले को उठने के लिए दिया गया सीधा आदेश है।
- source_word: φωνεῖ σε
  choice: वे तुम्हें बुला रहे हैं
  rationale: वर्तमान काल बुलावे की तत्कालता व्यक्त करता है। यीशु के लिए आदरसूचक बहुवचन आधुनिक मानक हिन्दी के अनुरूप है।
