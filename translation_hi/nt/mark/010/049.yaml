translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक बहुवचन (‘गए’, ‘बोले’, ‘वे’) और उस व्यक्ति से सीधे संबोधन में प्रसंगानुकूल एकवचन (‘रखो’, ‘उठो’, ‘तुम्हें’) प्रयुक्त है। यूनानी के बार-बार आए καί को हिन्दी की स्वाभाविक कथा-गति के अनुसार पहले ‘तब’ और आगे वाक्य-संयोजन से व्यक्त किया गया है।
