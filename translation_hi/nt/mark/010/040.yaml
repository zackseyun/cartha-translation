  text: τὸ δὲ καθίσαι ἐκ δεξιῶν μου ⸀ἢ ἐξ εὐωνύμων οὐκ ἔστιν ἐμὸν δοῦναι, ἀλλ’ οἷς ἡτοίμασται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/040.yaml
  text: But to sit at my right or at my left is not mine to give[a], but for those for whom it has been prepared.
translation:
  language: hi
  text: पर मेरे दाहिने या बाएँ बैठने का स्थान देना मेरे अधिकार में नहीं है[a], बल्कि यह उनके लिए है जिनके लिए इसे तैयार किया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे देना मेरे लिए नहीं है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: τὸ ... καθίσαι ἐκ δεξιῶν μου ἢ ἐξ εὐωνύμων
  choice: मेरे दाहिने या बाएँ बैठने का स्थान
  rationale: संज्ञात्मक infinitive और दोनों स्थान-सूचक मुहावरों को स्वाभाविक हिन्दी में व्यक्त करता है; 'स्थान' निहित आसन को स्पष्ट करता है, बिना 'हाथ' जोड़े।
- source_word: οὐκ ἔστιν ἐμὸν δοῦναι
  choice: देना मेरा अधिकार नहीं है
  rationale: यह हिन्दी में स्वाभाविक ढंग से बताता है कि देना यीशु का अपना विशेषाधिकार नहीं है; मूल कथन की सीमा को बनाए रखता है, उसका धर्मवैज्ञानिक कारण नहीं जोड़ता।
- source_word: ἀλλ’ οἷς
  choice: बल्कि यह उन्हीं के लिए है जिनके लिए
  rationale: यूनानी के लुप्त पदों को हिन्दी में आवश्यक रूप से पूरा करता है और विरोध तथा निर्दिष्ट प्राप्तकर्ताओं पर बल बनाए रखता है।
- source_word: ἡτοίμασται
  choice: तैयार किया गया है
  rationale: पूर्ण निष्क्रिय रूप की पूरी हो चुकी तैयारी और उसके वर्तमान परिणाम—दोनों को व्यक्त करता है; कर्ता को मूल की तरह अनकहा रखता है।
theological_decisions:
- issue: क्या कथन को यीशु के अधिकार का पूर्ण निषेध समझाया जाए या किसी अतिरिक्त धर्मवैज्ञानिक योग्यता से सीमित किया जाए
  choice: मेरा अधिकार नहीं है
  alternative: पिता की इच्छा से अलग इसे देना मेरा अधिकार नहीं है
  rationale: यूनानी पाठ सीमा बताता है, पर उसका स्पष्टीकरण नहीं देता। इसलिए अनकही धर्मवैज्ञानिक संगति जोड़े बिना मूल तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। 'दाहिने या बाएँ' समानांतर और संक्षिप्त है। 'अधिकार' प्रासंगिक विशेषाधिकार का स्वाभाविक अर्थ देता है; पादटिप्पणी अधिक शाब्दिक वैकल्पिक बोध सुरक्षित रखती है।
