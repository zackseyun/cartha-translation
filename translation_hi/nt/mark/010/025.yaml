  source_fidelity: 'The translation accurately conveys the comparative construction: it is easier for a camel to pass through a sewing needle’s opening than for a rich man to enter God’s kingdom. “ऊँट,” “सुई के छेद,” “धनी मनुष्य,” and “परमेश्वर के राज्य में प्रवेश” faithfully reflect the Greek wording and retain its deliberate hyperbolic force.'
  naturalness: The sentence is natural, clear modern standard Hindi. The paired infinitival expressions—“ऊँट का ... निकल जाना” and “धनी मनुष्य के ... प्रवेश करने”—form an idiomatic comparison. The register is appropriately dignified without becoming archaic.
  terminology: “परमेश्वर का राज्य” is an established and suitable rendering of βασιλεία τοῦ θεοῦ. “धनी मनुष्य” preserves the masculine singular representative wording without imposing an interpretation. The notes appropriately preserve the camel/rope proposal as a proposal rather than treating it as the source reading.
