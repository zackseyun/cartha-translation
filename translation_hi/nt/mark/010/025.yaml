  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εὐκοπώτερόν ἐστιν κάμηλον διὰ ⸂τῆς τρυμαλιᾶς τῆς⸃ ῥαφίδος ⸀διελθεῖν ἢ πλούσιον εἰς τὴν βασιλείαν τοῦ θεοῦ εἰσελθεῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/025.yaml
  text: It is easier for a camel to go through the eye of a needle than for a rich man to enter the kingdom of God[a][b][c].
translation:
  language: hi
  text: ऊँट का सुई के छेद में से निकल जाना[a][b], किसी धनी मनुष्य के परमेश्वर के राज्य में प्रवेश करने से आसान है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शब्दशः: “सुई के छेद से होकर निकल जाना।”'
    reason: lexical_alternative
  - marker: b
    text: कुछ लोगों ने “ऊँट” के स्थान पर “रस्सा” प्रस्तावित किया है, पर यहाँ यूनानी पाठ में “ऊँट” ही है।
    reason: alternative_reading
  - marker: c
    text: यूनानी में “धनी” पुल्लिंग एकवचन रूप में है; यहाँ एक धनी मनुष्य सभी धनवान लोगों का प्रतिनिधित्व करता है।
    reason: cultural_note
lexical_decisions:
- source_word: εὐκοπώτερόν
  choice: आसान
  rationale: तुलनात्मक अर्थ ‘अधिक सहज/कम कठिन’ है। ‘आसान’ स्वाभाविक हिन्दी में अतिशयोक्तिपूर्ण तुलना को स्पष्ट रखता है।
- source_word: κάμηλον
  choice: ऊँट
  rationale: पाठ में κάμηλος का अर्थ ‘ऊँट’ है। इससे कथन का जानबूझकर रखा गया असंभवता का सजीव चित्र सुरक्षित रहता है।
- source_word: διὰ τῆς τρυμαλιᾶς τῆς ῥαφίδος
  choice: सुई के छेद में से
  rationale: यह सिलाई की सुई के छेद को दर्शाता है। यह आधुनिक हिन्दी में स्पष्ट और मूल बिंब के निकट है।
- source_word: διελθεῖν
  choice: निकल जाना
  rationale: διέρχομαι का अर्थ किसी मार्ग या छेद ‘में से होकर जाना’ है। ऊँट और सुई के छेद के ठोस बिंब में ‘निकल जाना’ सहज हिन्दी है।
- source_word: πλούσιον
  choice: किसी धनी मनुष्य
  rationale: यूनानी में विशेषण पुल्लिंग एकवचन होकर संज्ञा के रूप में प्रयुक्त है। ‘धनी मनुष्य’ व्याकरणिक रूप को दर्शाता है, जबकि ‘किसी’ इस कथन के प्रतिनिधिक अर्थ को सहज बनाता है।
- source_word: εἰς τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: यह सुसमाचारों का केंद्रीय पदबंध है; ‘परमेश्वर का राज्य’ उसका स्थापित, स्पष्ट और अर्थसंगत हिन्दी रूप है।
- source_word: εἰσελθεῖν
  choice: प्रवेश करने
  rationale: εἰσέρχομαι का सीधा अर्थ ‘प्रवेश करना’ है और ‘राज्य में’ के साथ यह स्वाभाविक तथा गरिमापूर्ण हिन्दी है।
theological_decisions:
- issue: ऊँट और सुई के छेद के बिंब की व्याख्या
  choice: ऊँट और वास्तविक सुई के छेद वाले तीखे अतिशयोक्तिपूर्ण बिंब को ज्यों का त्यों रखा गया है।
  alternative: इसे यरूशलेम के किसी कथित छोटे ‘सुई-द्वार’ का संकेत मानना, या ‘ऊँट’ के स्थान पर ‘रस्सा’ लेकर कथन की तीव्रता घटाना।
  rationale: यूनानी पाठ स्वयं असंभवता का अत्यंत प्रबल बिंब प्रस्तुत करता है। अनुवाद को बाद की अप्रमाणित व्याख्याएँ जोड़कर इस तनाव को कम नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सुई के छेद’ सामान्य पाठक के लिए तुरंत समझ में आने वाला बिंब है। वाक्यक्रम हिन्दी की स्वाभाविक तुलना के अनुरूप है और मूल पाठ की असंभवता तथा धर्मवैचारिक तनाव को नरम नहीं करता।
