    issue: Footnote a is very close in wording to the main rendering.
    rationale: “सुई के छेद में से निकल जाना” and “सुई के छेद से होकर निकल जाना” communicate essentially the same sense in Hindi. This is not inaccurate and does not require alteration, but the distinction is less useful in Hindi than in the English audit trail.
