  text: Καὶ προσπορεύονται αὐτῷ Ἰάκωβος καὶ Ἰωάννης ⸀οἱ υἱοὶ Ζεβεδαίου λέγοντες ⸀αὐτῷ· Διδάσκαλε, θέλομεν ἵνα ὃ ἐὰν αἰτήσωμέν ⸀σε ποιήσῃς ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/035.yaml
  text: And James and John[a], the sons of Zebedee, came to him and said to him, “Teacher, we want you to do for us whatever we ask of you.”
translation:
  language: hi
  text: और ज़बदी के पुत्र याकूब और यूहन्ना उसके पास आए[a] और उससे कहा, “गुरु, हम चाहते हैं कि हम आपसे जो कुछ भी माँगें, आप हमारे लिए कर दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके निकट आए।” यूनानी क्रिया यीशु की ओर बढ़कर आने को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσπορεύονται αὐτῷ
  choice: उसके पास आए
  rationale: क्रिया यीशु की ओर बढ़कर उनके निकट आने को व्यक्त करती है। ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: οἱ υἱοὶ Ζεβεδαίου
  choice: ज़बदी के पुत्र
  rationale: यह यूनानी संबंधकारक और याकूब तथा यूहन्ना की परिचयात्मक पहचान को सीधे बनाए रखता है।
- source_word: λέγοντες αὐτῷ
  choice: उससे कहा
  rationale: यूनानी कृदंत को स्वाभाविक हिन्दी में समापिका क्रिया बनाया गया है; संबोधन का लक्ष्य भी स्पष्ट रखा गया है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: यह सामान्य आधुनिक हिन्दी में शिक्षक-संबंधी संबोधन है और प्रसंग में यीशु को संबोधित करने का स्वाभाविक रूप है।
- source_word: θέλομεν
  choice: हम चाहते हैं
  rationale: यह उनकी माँग की प्रत्यक्षता को बिना अनावश्यक विनम्रता जोड़े व्यक्त करता है।
- source_word: ὃ ἐὰν αἰτήσωμέν σε
  choice: हम तुझसे जो कुछ माँगें
  rationale: ‘जो कुछ’ सापेक्ष पद और ἐάν से व्यक्त अनिश्चित व्यापकता को बनाए रखता है।
- source_word: ποιήσῃς ἡμῖν
  choice: वह तू हमारे लिए कर दे
  rationale: ποιέω के सामान्य अर्थ ‘करना’ को बनाए रखा गया है; ‘प्रदान करना’ जैसे अधिक व्याख्यात्मक विकल्प से बचा गया है।
