- source_word: περὶ τούτου
  choice: इस विषय में
  rationale: यह पिछली चर्चा, अर्थात विवाह-विच्छेद संबंधी विषय, की ओर संकेत करता है; ‘इस विषय में’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐπηρώτων
  choice: पूछा
  rationale: यूनानी अपूर्ण भूतकाल जारी या बार-बार की जाने वाली पूछताछ का संकेत दे सकता है, पर हिन्दी में ‘पूछ रहे थे’ इस संक्षिप्त घटनाक्रम में कुछ असहज लगता है। सरल भूतकाल स्वाभाविक है; पक्षगत बारीकी पादटिप्पणी में दी गई है।
- source_word: αὐτόν
  choice: उससे
  rationale: सर्वनाम यीशु की ओर संकेत करता है; हिन्दी में ‘पूछना’ के साथ ‘उससे’ स्वाभाविक कारक-रूप है।
