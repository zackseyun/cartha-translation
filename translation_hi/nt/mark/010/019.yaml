id: MRK.10.19
reference: Mark 10:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὰς ἐντολὰς οἶδας· Μὴ ⸂φονεύσῃς, Μὴ μοιχεύσῃς⸃, Μὴ κλέψῃς, Μὴ ψευδομαρτυρήσῃς, Μὴ ἀποστερήσῃς, Τίμα τὸν πατέρα σου καὶ τὴν μητέρα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/019.yaml
  text: 'You know the commandments: Do not murder[a], do not commit adultery, do not steal, do not bear false witness, do not defraud[b], honor your father and mother.'
translation:
  language: hi
  text: 'तुम आज्ञाओं को जानते हो: ‘हत्या न करना,[a] व्यभिचार न करना, चोरी न करना, झूठी गवाही न देना, किसी को उसके हक़ से वंचित न करना,[b] अपने पिता और माता का आदर करना।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी की जान न लेना।” यहाँ प्रयुक्त यूनानी क्रिया विशेष रूप से हत्या अथवा अनुचित रूप से प्राण लेने का बोध कराती है; इसलिए मुख्य पाठ में “हत्या” रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “धोखा न देना,” “किसी का हक़ न मारना,” या “किसी से उसकी वस्तु न छीनना” भी हो सकता है। यूनानी शब्द का अर्थ है किसी व्यक्ति को उस चीज़ से वंचित करना जो उचित रूप से उसकी है, प्रायः शोषण या छल के द्वारा।
    reason: lexical_alternative
lexical_decisions:
- source_word: τὰς ἐντολὰς
  choice: आज्ञाओं
  rationale: यह दशाज्ञा की ओर स्पष्ट संकेत है; ‘आज्ञाएँ’ आधुनिक हिन्दी में स्वाभाविक और वाचा-संबंधी नैतिक आदेशों के लिए उपयुक्त है।
- source_word: οἶδας
  choice: जानते हो
  rationale: यूनानी का पूर्णकालिक रूप οἶδα कोइने यूनानी में वर्तमान अर्थ रखता है; इसलिए ‘जानते हो’ सहज समतुल्य है।
- source_word: Μὴ φονεύσῃς
  choice: हत्या न करना
  rationale: φονεύω सामान्य रूप से हर प्रकार के मारने के बजाय हत्या अथवा अनुचित रूप से प्राण लेने को अधिक विशेष रूप से दर्शाता है।
- source_word: Μὴ μοιχεύσῃς
  choice: व्यभिचार न करना
  rationale: विवाह-संबंधी कानूनी और नैतिक संदर्भ में μοιχεύω का स्थापित, संक्षिप्त हिन्दी रूप ‘व्यभिचार करना’ है।
- source_word: Μὴ κλέψῃς
  choice: चोरी न करना
  rationale: κλέπτω का सीधा और मानक हिन्दी समतुल्य है।
- source_word: Μὴ ψευδομαρτυρήσῃς
  choice: झूठी गवाही न देना
  rationale: यह ψευδομαρτυρέω के न्यायिक और साक्ष्य-संबंधी अर्थ को बनाए रखता है और इसे सामान्य झूठ बोलने तक विस्तृत नहीं करता।
- source_word: Μὴ ἀποστερήσῃς
  choice: किसी को उसके हक़ से वंचित न करना
  rationale: ἀποστερέω किसी व्यक्ति का वह रोक लेने या उससे छीन लेने को दर्शाता है जो उचित रूप से उसका है। यह हिन्दी रूप ‘धोखा न देना’ की अपेक्षा मूल क्रिया की व्यापकता और अस्पष्टता बेहतर बनाए रखता है।
- source_word: Τίμα
  choice: आदर करना
  rationale: आज्ञा के संदर्भ में τιμάω केवल शिष्ट सम्मान नहीं, बल्कि माता-पिता को उचित मान और आदर देने का भाव रखता है।
- source_word: τὸν πατέρα σου καὶ τὴν μητέρα
  choice: अपने पिता और माता
  rationale: यह दोनों अभिभावकों का स्पष्ट उल्लेख स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दशाज्ञा के उद्धरण/संकेत की शैली
  choice: पहचानी जाने वाली आज्ञात्मक हिन्दी रखते हुए यूनानी की शब्दार्थगत विशिष्टता का अनुसरण
  alternative: परंपरागत पर अधिक व्यापक ‘जान न लेना’ अथवा स्वतंत्र समकालीन भावानुवाद
  rationale: पद आज्ञाओं की सूची है, इसलिए आज्ञा-जैसी संक्षिप्त शैली उचित है। साथ ही φονεύω को ‘हत्या’ कहना सामान्य हत्या और हर प्रकार के प्राण लेने के बीच आवश्यक भेद बनाए रखता है।
- issue: ἀποστερέω की आर्थिक-नैतिक व्यापकता
  choice: किसी को उसके हक़ से वंचित न करना
  alternative: धोखा न देना; ठगी न करना; लूटना नहीं
  rationale: मूल शब्द में छल द्वारा हानि पहुँचाना शामिल हो सकता है, पर अर्थ केवल प्रत्यक्ष धोखाधड़ी तक सीमित नहीं है; किसी की उचित वस्तु या अधिकार रोक लेना भी इसमें आता है। चुना हुआ रूप इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आज्ञाओं की सूची में हिन्दी की प्रचलित अनंत-क्रियात्मक निषेध शैली (‘न करना’, ‘न देना’) अपनाई गई है। ‘हक़’ बोलचाल और मानक आधुनिक हिन्दी दोनों में स्पष्ट है; फुटनोट अधिक औपचारिक अर्थ-विस्तार देता है।
