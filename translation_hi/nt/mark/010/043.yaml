  text: οὐχ οὕτως δέ ⸀ἐστιν ἐν ὑμῖν· ἀλλ’ ὃς ⸀ἂν θέλῃ ⸂μέγας γενέσθαι⸃ ἐν ὑμῖν, ἔσται ὑμῶν διάκονος,
base_translation:
  language: en
  yaml_path: translation/nt/mark/010/043.yaml
  text: But it is not so among you[a]. Instead, whoever wants to become great among you will be your servant[b],
translation:
  language: hi
  text: पर तुम्हारे बीच ऐसा नहीं है[a]। बल्कि तुममें जो कोई बड़ा बनना चाहता है, वह तुम्हारा सेवक होगा[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर तुम्हारे बीच बात ऐसी नहीं है।”
    reason: lexical_alternative
  - marker: b
    text: 'प्रसंग में “होगा” का अर्थ “होना चाहिए” भी हो सकता है: तुममें जो कोई बड़ा बनना चाहता है, उसे तुम्हारा सेवक होना चाहिए।'
    reason: alternative_reading
lexical_decisions:
- source_word: οὐχ οὕτως δέ ἐστιν ἐν ὑμῖν
  choice: पर तुम्हारे बीच ऐसा नहीं है
  rationale: δέ के प्रसंगगत विरोध को ‘पर’ और οὐχ οὕτως को स्वाभाविक हिन्दी ‘ऐसा नहीं है’ से व्यक्त किया गया है; ἐν ὑμῖν का सामुदायिक अर्थ ‘तुम्हारे बीच’ से सुरक्षित रहता है।
- source_word: ἀλλ’
  choice: इसके बजाय
  rationale: यह सांसारिक प्रभुता के ढंग के विपरीत यीशु द्वारा बताए गए मार्ग को स्पष्ट सुधारात्मक विरोध के साथ प्रस्तुत करता है।
- source_word: ὃς ἂν θέλῃ
  choice: जो कोई ... चाहता है
  rationale: ἄν सहित संबंधवाचक उपवाक्य की अनिश्चित और सामान्य शर्त तथा θέλω की इच्छासूचकता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: μέγας γενέσθαι
  choice: बड़ा बनना
  rationale: ‘बनना’ γενέσθαι के आरंभिक/परिवर्तनसूचक भाव को सुरक्षित रखता है, जबकि ‘बड़ा’ μέγας की प्रतिष्ठा और दर्जे संबंधी भाषा को अनावश्यक व्याख्या के बिना व्यक्त करता है।
- source_word: ἐν ὑμῖν
  choice: तुममें / तुम्हारे बीच
  rationale: दोनों प्रयोगों में सामुदायिक अर्थ रखा गया है; हिन्दी की स्वाभाविकता के लिए पहले स्थान पर ‘तुम्हारे बीच’ और दूसरे पर ‘तुममें’ प्रयुक्त है।
- source_word: ἔσται ὑμῶν διάκονος
  choice: वह तुम्हारा सेवक होगा
  rationale: ‘सेवक’ διάκονος को विनम्र सेवा करने वाले व्यक्ति के रूप में व्यक्त करता है और बाद के कलीसियाई पद का अर्थ आरोपित नहीं करता। ‘होगा’ यूनानी भविष्यत् रूप को बनाए रखता है, यद्यपि प्रसंग में उसका निर्देशात्मक बल भी हो सकता है।
theological_decisions:
- issue: यीशु के निर्देश में भविष्यत् क्रिया ἔσται का बल
  choice: वह तुम्हारा सेवक होगा
  alternative: उसे तुम्हारा सेवक होना चाहिए
  rationale: भविष्यत् निर्देशात्मक या अनिवार्य भाव धारण कर सकता है, पर मुख्य पाठ यूनानी क्रियारूप को सुरक्षित रखता है; संभावित अनिवार्य अर्थ पादटिप्पणी में दिया गया है।
- issue: διάκονος का अनुवाद
  choice: सेवक
  alternative: सेवा करने वाला / परिचारक
  rationale: यहाँ शब्द समुदाय में नम्र सेवा को सूचित करता है, किसी औपचारिक कलीसियाई पद को नहीं; इसलिए ‘सेवक’ स्पष्ट और प्रसंगानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और समुदाय-केंद्रित रूप अपनाया गया है। ‘बड़ा बनना’ और ‘सेवक’ जैसे सामान्य शब्द मूल की सामाजिक तथा नैतिक तीक्ष्णता बनाए रखते हैं। पद के अगले वाक्य से जुड़ाव दिखाने के लिए अंत में अल्पविराम रखा गया है।
