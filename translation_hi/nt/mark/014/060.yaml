  text: καὶ ἀναστὰς ὁ ἀρχιερεὺς εἰς μέσον ἐπηρώτησεν τὸν Ἰησοῦν λέγων· Οὐκ ἀποκρίνῃ οὐδέν; τί οὗτοί σου καταμαρτυροῦσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/060.yaml
  text: And the high priest stood up in the middle and questioned Jesus[a], saying[c][b], “Do you answer nothing? What are these men testifying against you?”
translation:
  language: hi
  text: तब महायाजक उठकर सभा के बीच में[a] आया और यीशु से पूछा, “क्या तुम कोई उत्तर नहीं देते? ये लोग तुम्हारे विरुद्ध क्या गवाही दे रहे हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बीच में।” इसका आशय है कि महायाजक सभा के सामने एक केंद्रीय स्थान पर आया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀναστὰς
  choice: उठकर
  rationale: यह क्रिया महायाजक के अपनी जगह से उठने की शारीरिक क्रिया और आगे होने वाली कार्रवाई—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: इस न्यायिक प्रसंग में यह पद सभा की अध्यक्षता करने वाले यहूदी प्रधान याजक को सूचित करता है; हिन्दी बाइबलीय परंपरा में ‘महायाजक’ इसका स्पष्ट और प्रचलित रूप है।
- source_word: εἰς μέσον
  choice: सभा के बीच में
  rationale: मूल वाक्यांश किसी केंद्रीय स्थान की ओर आने का भाव रखता है। ‘सभा के’ जोड़ने से हिन्दी में स्थान का संदर्भ स्पष्ट होता है, जबकि केंद्रीय स्थिति का भाव सुरक्षित रहता है।
- source_word: ἐπηρώτησεν
  choice: पूछने लगा
  rationale: ἐπερωτάω यहाँ न्यायिक ढंग से प्रश्न करने को दर्शाता है। ‘पूछने लगा’ प्रसंग में स्वाभाविक है और ‘पूछताछ की’ जैसी अधिक कठोर व्याख्या से बचता है।
- source_word: ἀποκρίνῃ οὐδέν
  choice: क्या तुम कोई उत्तर नहीं देते?
  rationale: यह रूप यूनानी प्रश्न की तीखी, चुनौतीपूर्ण भाषा और उत्तर न देने पर उसके जोर को बनाए रखता है।
- source_word: οὗτοί
  choice: ये लोग
  rationale: पुल्लिंग बहुवचन संकेतवाचक उपस्थित गवाहों की ओर इशारा करता है। हिन्दी में ‘ये लोग’ प्रत्यक्ष संकेत को स्वाभाविक रूप से रखता है; ‘ये पुरुष’ अनावश्यक और कृत्रिम लगेगा।
- source_word: καταμαρτυροῦσιν
  choice: तुम्हारे विरुद्ध क्या गवाही दे रहे हैं
  rationale: यह क्रिया किसी के विरुद्ध साक्ष्य देने का न्यायिक अर्थ रखती है। यह अनुवाद वर्तमान कार्रवाई तथा कानूनी आशय दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: οὗτοί में उपस्थित गवाहों का उल्लेख
  choice: ये लोग
  alternative: ये पुरुष
  rationale: यूनानी रूप व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और प्रसंग के गवाहों की ओर संकेत करता है। आधुनिक हिन्दी में विशिष्ट उपस्थित समूह के लिए ‘ये लोग’ स्वाभाविक है और उनके लिंग के बारे में पाठ की आवश्यकता से अधिक जोर नहीं देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। ‘सभा’ संदर्भ स्पष्ट करने के लिए जोड़ा गया है; ‘खड़ा हुआ’ εἰς μέσον के साथ निहित स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है। प्रश्नों का तीखा न्यायिक स्वर बनाए रखा गया है।
