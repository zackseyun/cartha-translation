    reason: ἴση का शाब्दिक अर्थ और न्यायिक-संदर्भगत वैकल्पिक अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: καὶ οὐδὲ
  choice: फिर भी ... नहीं
  rationale: 'यह संयुक्त अभिव्यक्ति पिछले कथन से संबंध रखते हुए जोरदार निषेध व्यक्त करती है: पहले बताए गए ढंग से गवाही देने पर भी अपेक्षित सहमति नहीं थी। आधुनिक हिन्दी में ‘फिर भी ... नहीं’ इस प्रवाह को स्वाभाविक रूप से व्यक्त करता है।'
- source_word: οὕτως
  choice: इस प्रकार निहित
  rationale: यह ठीक पहले वर्णित आरोप लगाने के ढंग की ओर संकेत करता है। हिन्दी वाक्य में ‘फिर भी’ और संदर्भ से इसका आशय स्पष्ट हो जाता है; अलग से ‘इस प्रकार’ रखने पर वाक्य अपेक्षाकृत बोझिल होता।
- source_word: ἴση
  choice: आपस में मेल
  rationale: मूल अर्थ ‘बराबर’ है, पर न्यायिक संदर्भ में आशय यह है कि अलग-अलग गवाहों की बातें एक-दूसरे से सहमत नहीं थीं। ‘आपस में मेल’ इस संबंधात्मक अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: ἦν
  choice: खाती थी
  rationale: εἰμί का अपूर्ण भूतकाल यहाँ हिन्दी के स्वाभाविक अपूर्ण भूतकाल ‘थी’ द्वारा व्यक्त हुआ है।
- source_word: ἡ μαρτυρία αὐτῶν
  choice: उनकी गवाही
  rationale: न्यायिक प्रसंग में μαρτυρία के लिए ‘गवाही’ उपयुक्त है; αὐτῶν का संबंधवाचक अर्थ ‘उनकी’ से व्यक्त होता है।
