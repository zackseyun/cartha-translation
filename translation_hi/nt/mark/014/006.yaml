source:
  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἄφετε αὐτήν· τί αὐτῇ κόπους παρέχετε; καλὸν ἔργον ἠργάσατο ἐν ἐμοί·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/006.yaml
  text: But Jesus said[a], “Leave her alone[c][b]. Why are you troubling her? She has done a beautiful work for me.”
translation:
  language: hi
  text: पर यीशु ने कहा, “उसे छोड़ दो। तुम उसे क्यों परेशान कर रहे हो? उसने मेरे लिए एक सुंदर काम किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄφετε αὐτήν
  choice: उसे छोड़ दो
  rationale: अओरिस्ट आज्ञार्थक तत्काल हस्तक्षेप रोकने की मांग करता है। ‘उसे छोड़ दो’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: τί αὐτῇ κόπους παρέχετε;
  choice: तुम उसे क्यों परेशान कर रहे हो?
  rationale: κόπους παρέχετε का भाव किसी को कष्ट या परेशानी देना है। यह अनुवाद आलोचकों के चल रहे व्यवहार और यीशु की फटकार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καλὸν ἔργον
  choice: एक सुंदर काम
  rationale: καλός में ‘अच्छा’, ‘सुंदर’ और ‘उत्तम’ के अर्थ समाहित हो सकते हैं। यहाँ ‘सुंदर’ स्त्री के कार्य की प्रशंसनीयता और प्रसंगानुकूल शोभा को व्यक्त करता है, बिना उसमें अतिरिक्त धर्मशास्त्रीय अर्थ जोड़े।
- source_word: ἠργάσατο
  choice: किया है
  rationale: अओरिस्ट रूप पूर्ण किए गए कार्य को बताता है; हिन्दी का ‘किया है’ उसके वर्तमान महत्त्व को सहज रूप से व्यक्त करता है।
- source_word: ἐν ἐμοί
  choice: मेरे लिए
  rationale: शाब्दिक रूप से ‘मुझमें’ होने पर भी, यहाँ वाक्यांश यीशु की ओर निर्देशित कार्य को बताता है। ‘मेरे लिए’ हिन्दी में अर्थ को स्वाभाविक ढंग से पहुँचाता है और भौतिक क्रिया को अनावश्यक रूप से सीमित नहीं करता।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ स्त्री की आलोचना के विपरीत यीशु की प्रतिक्रिया का हल्का विरोध दर्शाता है; ‘पर’ इस कथात्मक मोड़ को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: καλὸν ἔργον में स्त्री के अभिषेक-कार्य का मूल्यांकन
  choice: ‘एक सुंदर काम’
  alternative: ‘एक अच्छा काम’ या ‘एक उत्तम कार्य’
  rationale: ‘सुंदर’ यीशु की सकारात्मक सराहना और उस कार्य की प्रसंगानुकूल शोभा को बनाए रखता है, पर इससे पुण्य, संस्कार या किसी विशिष्ट सिद्धान्त का अर्थ नहीं जोड़ा जाता।
- issue: ἐν ἐμοί का संबंधसूचक अर्थ
  choice: ‘मेरे लिए’
  alternative: ‘मुझ पर’, ‘मेरे प्रति’ या शाब्दिक ‘मुझमें’
  rationale: यह चयन कार्य को व्यक्तिगत रूप से यीशु की ओर निर्देशित बताता है। ‘मुझ पर’ अभिषेक की भौतिक क्रिया को अधिक स्पष्ट करता, जबकि मूल अभिव्यक्ति इस पद में व्यापक मूल्यांकन भी करती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। यीशु की आज्ञा और प्रश्न सीधे हैं; ‘सुंदर काम’ मूल καλόν की प्रशंसात्मक तथा सौंदर्यपरक संभाव्यता को बनाए रखता है।
