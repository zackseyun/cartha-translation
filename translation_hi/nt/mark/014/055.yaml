  text: οἱ δὲ ἀρχιερεῖς καὶ ὅλον τὸ συνέδριον ἐζήτουν κατὰ τοῦ Ἰησοῦ μαρτυρίαν εἰς τὸ θανατῶσαι αὐτόν, καὶ οὐχ ηὕρισκον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/055.yaml
  text: The chief priests and the whole council were seeking testimony against Jesus in order to put him to death, and they were not finding any.
translation:
  language: hi
  text: प्रधान याजक और पूरी परिषद[a] यीशु के विरुद्ध गवाही ढूँढ़ रहे थे, ताकि वे उसे मृत्यु-दंड दिला सकें, पर उन्हें कोई गवाही नहीं मिल रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक विशिष्ट रूप से, “पूरी सनहेद्रिन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: δέ को अलग कालसूचक शब्द से नहीं दर्शाया गया; प्रसंग का आगे बढ़ना वाक्यक्रम से स्पष्ट है। ἀρχιερεῖς यरूशलेम के उच्च पुरोहितीय नेतृत्व के लिए प्रयुक्त बहुवचन है, जिसके लिए ‘प्रधान याजक’ प्रचलित और स्वाभाविक है।
- source_word: ὅλον τὸ συνέδριον
  choice: पूरी महासभा
  rationale: ‘महासभा’ शासकीय-न्यायिक परिषद का अर्थ स्पष्ट करती है और ὅλον को ‘पूरी’ से सुरक्षित रखती है; ऐतिहासिक नाम ‘सनहेद्रिन’ पादटिप्पणी में दिया गया है।
- source_word: ἐζήτουν
  choice: ढूँढ़ रहे थे
  rationale: अपूर्ण भूतकाल जारी या बार-बार किए जा रहे प्रयास को दर्शाता है; यह रूप उस कालगत पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κατὰ τοῦ Ἰησοῦ μαρτυρίαν
  choice: यीशु के विरुद्ध ऐसी गवाही
  rationale: κατά के साथ संबंधकारक यहाँ विरोधात्मक अर्थ रखता है। ‘गवाही’ न्यायिक संदर्भ में μαρτυρία के आशय को बनाए रखती है। ‘ऐसी’ आगे आने वाले उद्देश्य-वाक्य से इसे सहज रूप से जोड़ता है।
- source_word: εἰς τὸ θανατῶσαι αὐτόν
  choice: जिसके आधार पर वे उसे मृत्युदंड दिला सकें
  rationale: यह रचना उद्देश्य व्यक्त करती है। न्यायिक प्रसंग में ‘मृत्युदंड दिला सकें’ उस गवाही द्वारा यीशु को मरवा देने के अभिप्राय को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह कहे कि परिषद स्वयं दंड का क्रियान्वयन करेगी।
- source_word: καὶ οὐχ ηὕρισκον
  choice: पर उन्हें कोई गवाही नहीं मिल रही थी
  rationale: यद्यपि καί सामान्यतः ‘और’ है, यहाँ परिणाम की विफलता के कारण हिन्दी में ‘पर’ स्वाभाविक संबंध व्यक्त करता है। अपूर्ण भूतकाल को ‘नहीं मिल रही थी’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: συνέδριον की पहचान
  choice: मुख्य पाठ में ‘पूरी महासभा’
  alternative: ‘पूरी सनहेद्रिन’ अथवा ‘पूरी परिषद’
  rationale: यूनानी शब्द परिषद को सूचित करता है; ‘महासभा’ आधुनिक पाठक को उसका संस्थागत अर्थ देता है, जबकि परिचित ऐतिहासिक नाम पादटिप्पणी में सुरक्षित है।
- issue: मृत्यु दिलाने के उद्देश्य का स्वरूप
  choice: ‘जिसके आधार पर वे उसे मृत्युदंड दिला सकें’
  alternative: ‘ताकि वे उसे मार डालें’
  rationale: स्रोत उद्देश्य को स्पष्ट करता है, पर क्रियान्वयन की प्रशासनिक प्रक्रिया नहीं बताता। चुना हुआ रूप न्यायिक प्रसंग और मृत्यु कराने के अभिप्राय—दोनों को बनाए रखता है, बिना अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। जारी खोज और लगातार निष्फलता को अपूर्ण भूतकाल के रूपों से व्यक्त किया गया है।
