  language: hi
  text: और वे सब उसे छोड़कर भाग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सरल समुच्चयबोधक के रूप में यह गिरफ्तारी के पिछले प्रसंग से घटना को जोड़ता है और कोई अतिरिक्त कालगत या परिणामसूचक अर्थ नहीं जोड़ता।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: ἀφίημι का यह कृदन्त रूप यहाँ किसी को पीछे छोड़ देने का अर्थ देता है। ‘छोड़कर’ स्वाभाविक, संक्षिप्त है और ‘त्यागकर’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: αὐτὸν
  choice: उसे
  rationale: यह सर्वनाम प्रसंग में यीशु की ओर संकेत करता है; हिन्दी में ‘उसे’ सीधा और स्पष्ट रूप है।
- source_word: ἔφυγον
  choice: भाग गए
  rationale: φεύγω यहाँ खतरे से भाग निकलने को व्यक्त करता है। ‘भाग गए’ आधुनिक हिन्दी में स्वाभाविक है और घटना की गंभीरता बनाए रखता है।
- source_word: πάντες
  choice: वे सब
  rationale: यह शब्द साथियों के भागने की समग्रता पर बल देता है। ‘वे सब’ यूनानी के निहित कर्ता को हिन्दी में स्पष्ट करते हुए उसी बल को सुरक्षित रखता है।
theological_decisions:
- issue: शिष्यों द्वारा यीशु को छोड़ने की व्यापकता
  choice: वे सब ... भाग गए
  alternative: सब-के-सब भाग गए
  rationale: पाठ इस क्षण यीशु के साथियों के पूर्णतः चले जाने पर बल देता है। ‘वे सब’ इस समग्रता को बिना अतिशयोक्ति या अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की संक्षिप्तता और तीव्र कथात्मक गति मूल यूनानी के अनुरूप है।
