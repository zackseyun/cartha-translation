  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘झूठी गवाही’ और ‘उसके विरुद्ध’ न्यायिक संदर्भ को बनाए रखते हैं; ‘आपस में मेल नहीं खाती थीं’ मूल के अर्थ को साधारण पाठक के लिए स्वाभाविक हिन्दी में व्यक्त करता है।
