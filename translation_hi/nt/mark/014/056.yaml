  text: For many were giving false testimony against him[a], and their testimonies were not consistent.
translation:
  language: hi
  text: क्योंकि बहुत-से लोग उसके विरुद्ध झूठी गवाही दे रहे थे, और उनकी गवाहियाँ आपस में मेल नहीं खाती थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में अनेक व्यक्तियों को सूचित करता है। क्रिया से उनका गवाह होना स्पष्ट है, फिर भी मूल में संज्ञा न होने के कारण ‘लोग’ जैसा सामान्य शब्द रखा गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह आसपास के वृत्तांत की व्याख्या या कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐψευδομαρτύρουν
  choice: झूठी गवाही दे रहे थे
  rationale: अपूर्ण भूतकाल दृश्य में चलती या बार-बार होती कार्रवाई को दिखाता है। यह चयन उस पक्ष और कानूनी गवाही के अर्थ दोनों को सुरक्षित रखता है।
- source_word: κατ’ αὐτοῦ
  choice: उसके विरुद्ध
  rationale: सम्बन्धकारक के साथ κατά यहाँ विरोधी कानूनी गवाही का अर्थ देता है।
- source_word: ἴσαι
  choice: आपस में मेल नहीं खाती थीं
  rationale: ἴσαι का शाब्दिक अर्थ ‘समान’ है, पर गवाहियों के संदर्भ में आशय उनका परस्पर सहमत या अनुरूप होना है। हिन्दी मुहावरे में ‘मेल खाना’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αἱ μαρτυρίαι
  choice: उनकी गवाहियाँ
  rationale: निश्चित पद पहले उल्लिखित लोगों द्वारा दी गई गवाहियों की ओर संकेत करता है; हिन्दी में ‘उनकी’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: οὐκ ἦσαν
  choice: नहीं खाती थीं
  rationale: नकारात्मक अपूर्ण भूतकाल को ἴσαι के साथ हिन्दी के स्वाभाविक संयुक्त कथन ‘मेल नहीं खाती थीं’ में व्यक्त किया गया है।
