  text: ἀμὴν λέγω ὑμῖν ὅτι οὐκέτι οὐ μὴ πίω ἐκ τοῦ γενήματος τῆς ἀμπέλου ἕως τῆς ἡμέρας ἐκείνης ὅταν αὐτὸ πίνω καινὸν ἐν τῇ βασιλείᾳ τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/025.yaml
  text: Truly I tell you[c][b][a], I will certainly not drink again from the fruit of the vine until that day when I drink it new in the kingdom of God.
translation:
  language: hi
  text: “मैं तुमसे सच कहता हूँ, अब से मैं दाख की बेल का फल[b] फिर कभी नहीं पीऊँगा[a], उस दिन तक जब मैं उसे परमेश्वर के राज्य में नए रूप में पीऊँगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में निषेध बहुत प्रबल है; अर्थ यह भी व्यक्त किया जा सकता है: “मैं दाख की बेल का फल फिर कभी कदापि नहीं पीऊँगा।”'
    reason: lexical_alternative
  - marker: b
    text: “दाख की बेल का फल” यहाँ की यूनानी अभिव्यक्ति है; अर्थात् दाख की बेल से प्राप्त वह पेय जो इस भोजन में पिया जा रहा था।
    reason: lexical_alternative
  - marker: c
    text: या, “फिर से पीऊँगा।” यूनानी विशेषण का अर्थ “नया” हो सकता है और वह परमेश्वर के आने वाले राज्य की नवीनता की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु की गंभीर घोषणा का स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है; ‘आमीन’ की अपेक्षा इसका अर्थ सामान्य पाठक को सीधे समझ में आता है।
- source_word: οὐκέτι οὐ μὴ πίω
  choice: अब ... फिर कभी नहीं पीऊँगा
  rationale: ‘अब’/‘फिर’ οὐκέτι की कालगत शक्ति और ‘कभी नहीं’ οὐ μή की प्रबल भावी निषेधात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करते हैं।
- source_word: ἐκ τοῦ γενήματος τῆς ἀμπέλου
  choice: दाखलता का फल
  rationale: यह यूनानी अभिव्यक्ति को बनाए रखता है और सीधे ‘दाखमधु’ कहकर मूल से अधिक विशिष्ट अर्थ नहीं जोड़ता। सन्दर्भ में इसका आशय दाखलता से प्राप्त और भोजन में पिया जाने वाला पेय है।
- source_word: ἕως τῆς ἡμέρας ἐκείνης
  choice: उस दिन तक
  rationale: यह कालगत सीमा और संकेतवाचक बल, दोनों को सीधे सुरक्षित रखता है।
- source_word: ὅταν αὐτὸ πίνω
  choice: जब मैं उसे ... पीऊँगा
  rationale: ὅταν के भावी आशय को हिन्दी में ‘जब’ और भावी क्रिया से स्वाभाविक ढंग से व्यक्त किया गया है; ‘उसे’ पहले उल्लिखित दाखलता के फल को संदर्भित करता है।
- source_word: καινὸν
  choice: नए रूप में
  rationale: शाब्दिक ‘नया’ हिन्दी में क्रिया के साथ अस्वाभाविक होता; ‘नए रूप में’ गुणात्मक नवीनता को व्यक्त करते हुए यह पूरी तरह तय नहीं करता कि आशय ‘फिर से’ है या आने वाले राज्य की नई वास्तविकता।
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: यह नए नियम की मानक धर्मवैचारिक अभिव्यक्ति को स्पष्ट और पूर्ण रूप में सुरक्षित रखता है।
theological_decisions:
- issue: अन्तिम उपवाक्य में καινὸν का अर्थ
  choice: ‘नए रूप में’ रखा गया है, बिना यह निश्चित किए कि नवीनता किस प्रकार की होगी।
  alternative: ‘फिर से’ अथवा ‘नए सिरे से’
  rationale: विशेषण गुण या प्रकार की नवीनता सूचित कर सकता है, जबकि सन्दर्भ आने वाले परमेश्वर-राज्य के भोज की ओर भी संकेत करता है। मूल पाठ इस नवीनता की रीति स्पष्ट नहीं करता, इसलिए अनुवाद उस तनाव को खुला रखता है।
- issue: ‘दाखलता का फल’ किस वस्तु को दर्शाता है
  choice: मूल मुहावरे को रखा गया है।
  alternative: ‘दाखमधु’ या ‘दाख का पेय’
  rationale: सन्दर्भ में यह प्याले के पेय को दर्शाता है, पर यूनानी पाठ सीधे कोई अधिक विशिष्ट पेय-नाम नहीं देता। इसलिए अनुवाद ने मूल की अभिव्यक्ति को बनाए रखा है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। गंभीर उद्घोषणा के स्वर को ‘मैं तुमसे सच कहता हूँ’ से व्यक्त किया गया है। मूल मुहावरे ‘दाखलता का फल’ को जानबूझकर बनाए रखा गया है, और उसकी व्याख्या पादटिप्पणी में दी गई है।
