  source_fidelity: The draft preserves the principal sequence and the historical title “रब्बी,” but “वह आया और तुरन्त उनके पास जाकर बोला” is syntactically awkward and does not as clearly attach εὐθύς to the immediate approach. “बहुत चूमा” is also not idiomatic Hindi for the emphatic καταφιλέω and can sound quantitatively vague. Rendering it “बार-बार चूमा” is a clear, defensible expression of the verb’s intensified sense, with the footnote retaining the lexical nuance.
  naturalness: 'The revision uses natural modern Hindi: “आते ही” clearly conveys the temporal participle plus immediacy, and “उनके पास गया और बोला” has a straightforward narrative flow. “बार-बार चूमा” is more idiomatic than “बहुत चूमा.”'
  terminology: “रब्बी” appropriately retains the Greek transliteration of the Semitic address. The respectful plural pronoun for यीशु (“उनके/उन्हें”) is consistent and suitable. No doctrinally loaded terminology is introduced.
