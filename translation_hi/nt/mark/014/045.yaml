base_translation:
  language: en
  yaml_path: translation/nt/mark/014/045.yaml
  text: And when he came[a], he immediately went up to him and said, “Rabbi!” and kissed him repeatedly.
translation:
  language: hi
  text: वह आते ही उनके पास गया और बोला, “रब्बी!” फिर उसने उन्हें बार-बार चूमा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “बड़े आग्रह से चूमा” या “बड़े स्नेह से चूमा” भी हो सकता है; यूनानी क्रिया साधारण “चूमा” से अधिक जोरदार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλθὼν
  choice: वह आया
  rationale: अओरिस्ट कृदन्त यहाँ समय और क्रम बताता है। हिन्दी में स्वतंत्र क्रिया के रूप में यह सहज है और उसके आने के बाद पास जाने का क्रम बनाए रखता है।
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की तीव्र कथात्मक गति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσελθὼν αὐτῷ
  choice: उनके पास जाकर
  rationale: यह यीशु की ओर शारीरिक रूप से बढ़कर निकट जाने का भाव रखता है और हिन्दी में अनावश्यक पुनरावृत्ति से बचता है।
- source_word: λέγει
  choice: बोला
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथन की स्वाभाविक भूतकालीन शैली में दिया गया है।
- source_word: Ῥαββί
  choice: रब्बी
  rationale: यूनानी पाठ में सुरक्षित सामी संबोधन का लिप्यंतरण ऐतिहासिक-सांस्कृतिक रंग और दृश्य की विडम्बना को बनाए रखता है।
- source_word: κατεφίλησεν
  choice: बहुत चूमा
  rationale: यह साधारण ‘चूमा’ से अधिक जोरदार क्रिया को व्यक्त करता है, पर केवल पुनरावृत्ति या निष्कपट स्नेह को निर्णायक नहीं बनाता।
theological_decisions:
- issue: यहूदा द्वारा यीशु को Ῥαββί कहकर संबोधित करना
  choice: रब्बी
  alternative: गुरु
  rationale: मूल पाठ स्वयं इस ऐतिहासिक संबोधन को लिप्यंतरित करता है। ‘रब्बी’ रखने से उसका सांस्कृतिक रूप और प्रसंग की विडम्बना बनी रहती है, बिना किसी अतिरिक्त धर्मवैज्ञानिक अर्थ के।
- issue: κατεφίλησεν में चुम्बन की प्रकृति
  choice: बहुत चूमा
  alternative: बार-बार चूमा / बड़े स्नेह से चूमा
  rationale: क्रिया का उपसर्ग साधारण चुम्बन से अधिक प्रबल या प्रदर्शनपूर्ण क्रिया का संकेत दे सकता है, लेकिन यह अनिवार्य रूप से संख्या या निष्कपट भावनात्मक स्नेह निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु के लिए आदरसूचक बहुवचन सर्वनाम प्रयुक्त हुआ है। ‘फिर’ दूसरे καί को स्वाभाविक हिन्दी क्रम के रूप में व्यक्त करता है।
