- from: वह आया और तुरन्त उनके पास जाकर बोला, “रब्बी!” फिर उसने उन्हें बहुत चूमा।[a]
  to: वह आते ही उनके पास गया और बोला, “रब्बी!” फिर उसने उन्हें बार-बार चूमा।[a]
  rationale: The text is revised only where needed for clear Hindi syntax and a natural rendering of the intensified Greek verb. “आते ही” conveys ἐλθὼν with εὐθύς, and “बार-बार चूमा” gives a transparent rendering of καταφιλέω without assigning a motive to Judas. The footnote preserves alternative intensive readings.
