  - severity: medium
    issue: “बहुत चूमा” is an unnatural and imprecise rendering of κατεφίλησεν.
    rationale: In Hindi, “बहुत चूमा” may suggest quantity or duration without naturally conveying the marked, repeated/intensive action of the Greek. “बार-बार चूमा” is clear while the note preserves the alternative intensive sense.
