  edition: SBLGNT
  text: ὁ δὲ Ἰησοῦς εἶπεν· Ἐγώ εἰμι, καὶ ὄψεσθε τὸν υἱὸν τοῦ ἀνθρώπου ἐκ δεξιῶν καθήμενον τῆς δυνάμεως καὶ ἐρχόμενον μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/062.yaml
  text: And Jesus said[a], “I am[c][b], and you will see the Son of Man seated at the right hand of Power and coming with the clouds of heaven.”
translation:
  language: hi
  text: यीशु ने कहा, “मैं हूँ[a], और तुम मनुष्य के पुत्र को सामर्थ्य[c] के दाहिने हाथ पर बैठा हुआ और स्वर्ग के बादलों के साथ आता हुआ देखोगे।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैं वही हूँ।” यूनानी में केवल “मैं हूँ” है।
    reason: alternative_reading
  - marker: b
    text: यह कथन भजन 110:1 और दानिय्येल 7:13 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: c
    text: यहाँ “सामर्थ्य” परमेश्वर के लिए प्रयुक्त एक श्रद्धापूर्ण परोक्ष संबोधन है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγώ εἰμι
  choice: मैं हूँ
  rationale: यूनानी में स्पष्ट विधेय के बिना बलयुक्त ‘मैं हूँ’ है। यह महायाजक के प्रश्न का सीधा उत्तर देता है और साथ ही वाक्य की संभावित गहरी प्रतिध्वनि को बिना निर्णायक व्याख्या थोपे सुरक्षित रखता है।
- source_word: ὄψεσθε
  choice: तुम ... देखोगे
  rationale: भविष्यकाल की सीधी भविष्यवाणी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह यीशु की स्थापित आत्म-पदवी है और दानिय्येल 7 की भाषा तथा उसके धर्मवैचारिक भार को बनाए रखती है।
- source_word: ἐκ δεξιῶν
  choice: के दाहिने
  rationale: सम्मान और अधिकार के स्थान को बताने वाले बाइबलीय मुहावरे का संक्षिप्त और परिचित हिन्दी रूप है।
- source_word: τῆς δυνάμεως
  choice: सामर्थ्य
  rationale: मूल पाठ में परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण परोक्ष संबोधन को सीधे ‘परमेश्वर’ से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: καθήμενον
  choice: बैठा हुआ
  rationale: कृदन्त का सीधा अर्थ बनाए रखता है; संदर्भ में यह सिंहासनासीन अधिकार का संकेत देता है, पर अनुवाद मूल से अधिक स्पष्ट व्याख्या नहीं जोड़ता।
- source_word: ἐρχόμενον
  choice: आता हुआ
  rationale: दानिय्येल-संबंधी और अंतिम-कालीन प्रतिध्वनि को बनाए रखते हुए सामान्य और स्पष्ट हिन्दी देता है।
- source_word: μετὰ τῶν νεφελῶν τοῦ οὐρανοῦ
  choice: आकाश के बादलों के साथ
  rationale: यूनानी वाक्यांश और दानिय्येल 7:13 की अपोकैलिप्टिक छवि के निकट रहता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: सिंहासनासीन होने और आने—इन दोनों जुड़े हुए दावों की संचयी शक्ति को बनाए रखता है।
theological_decisions:
- issue: Ἐγώ εἰμι को साधारण पुष्टि मानना या विस्तारित पहचान के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘मैं हूँ’
  alternative: ‘मैं वही हूँ’
  rationale: यूनानी में कोई स्पष्ट विधेय नहीं है। ‘मैं हूँ’ तत्काल उत्तर और संभावित गहरी धर्मवैचारिक प्रतिध्वनि—दोनों को खुला रखता है।
- issue: τῆς δυνάμεως में परमेश्वर की पहचान कितनी स्पष्ट की जाए
  choice: ‘सामर्थ्य’ के रूप में श्रद्धापूर्ण परोक्ष संबोधन बनाए रखना
  alternative: ‘परमेश्वर’ या ‘सामर्थ्यवान’
  rationale: मूल यूनानी सीधे ‘परमेश्वर’ नहीं कहता। उसी परोक्ष अभिव्यक्ति को रखने से मूल का शब्द-विन्यास, आदरपूर्ण स्वर और अर्थगत तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सामर्थ्य के दाहिने’ सामान्य बोलचाल से कुछ अधिक बाइबलीय है, पर मूल के श्रद्धापूर्ण परोक्ष संबोधन को सुरक्षित रखने के लिए इसे जानबूझकर रखा गया है। ‘मनुष्य का पुत्र’ स्थापित बाइबलीय पदवी के रूप में प्रयुक्त है।
