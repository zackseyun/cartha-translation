  text: ὁ δὲ ⸂ἐκπερισσῶς ἐλάλει⸃· Ἐὰν ⸂δέῃ με⸃ συναποθανεῖν σοι, οὐ μή σε ⸀ἀπαρνήσομαι. ὡσαύτως δὲ καὶ πάντες ἔλεγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/031.yaml
  text: But he kept insisting all the more[a], “If I must die together with you[c][b], I will certainly not deny you.” And they all were saying the same thing.
translation:
  language: hi
  text: पर वह और भी ज़ोर देकर कहता रहा[a], “यदि मुझे आपके साथ मरना पड़े[b], तो भी मैं आपको हरगिज़ नहीं नकारूँगा[c]।” और वे सब भी यही कहते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पर वह अत्यन्त दृढ़ता से कहता रहा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “आपके साथ मिलकर मरना।”
    reason: lexical_alternative
  - marker: c
    text: या, “मैं आपको कभी नहीं नकारूँगा।” यूनानी में बहुत प्रबल नकार का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκπερισσῶς
  choice: और भी ज़ोर देकर
  rationale: यह क्रियाविशेषण पतरस के कथन की बढ़ती हुई तीव्रता दिखाता है। यह हिंदी में तुलना और प्रबल आग्रह—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐλάλει
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल निरंतर या बार-बार बोलने का भाव देता है; ‘कहता रहा’ उस पक्ष को सहज हिंदी में बनाए रखता है।
- source_word: Ἐὰν δέῃ με
  choice: यदि मुझे ... भी पड़े
  rationale: δέῃ आवश्यकता का भाव व्यक्त करता है, केवल संभावना का नहीं। ‘पड़े’ इस बाध्यता को स्वाभाविक हिंदी में दर्शाता है।
- source_word: συναποθανεῖν σοι
  choice: आपके साथ मरना
  rationale: συν- का साथ मरने का स्पष्ट भाव सुरक्षित रखा गया है। संबोधन में ‘आपके’ आधुनिक गरिमापूर्ण हिंदी के अनुरूप है।
- source_word: οὐ μή
  choice: हरगिज़ नहीं
  rationale: दोहरी प्रबल यूनानी नकारात्मक अभिव्यक्ति को ‘हरगिज़ नहीं’ दृढ़ और स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: ἀπαρνήσομαι
  choice: नकारूँगा
  rationale: इस प्रसंग में इसका अर्थ यीशु से अपने संबंध या पहचान का इनकार करना है; ‘नकारना’ स्पष्ट है और आगे के कथानक से मेल खाता है।
- source_word: ὡσαύτως
  choice: यही
  rationale: यह पहले कही गई प्रतिज्ञा की समान विषयवस्तु की ओर संकेत करता है; ‘यही’ हिंदी में उस संदर्भ को संक्षेप में स्पष्ट करता है।
- source_word: πάντες
  choice: वे सब
  rationale: समस्त शिष्यों की समावेशी भागीदारी को स्पष्ट करता है।
- source_word: ἔλεγον
  choice: कहते रहे
  rationale: अपूर्ण भूतकाल की निरंतर या पुनरावृत्त क्रिया को बनाए रखता है।
theological_decisions:
- issue: पतरस की प्रतिज्ञा में नकार की तीव्रता
  choice: ‘तो भी मैं आपको हरगिज़ नहीं नकारूँगा’
  alternative: ‘मैं आपको कभी नहीं नकारूँगा’
  rationale: οὐ μή के प्रबल नकार को सुरक्षित रखा गया है, पर पतरस की आत्म-निश्चयता और उसके बाद की विफलता के बीच कथात्मक तनाव की व्याख्या जोड़कर उसे हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। यीशु के लिए आदरसूचक ‘आप’ रखा गया है। निरंतर क्रिया को ‘कहता रहा/कहते रहे’ से व्यक्त किया गया है और मूल की प्रबलता तथा कथात्मक तनाव सुरक्षित रखा गया है।
