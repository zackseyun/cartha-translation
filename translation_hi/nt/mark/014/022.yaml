source:
  edition: SBLGNT
  text: Καὶ ἐσθιόντων αὐτῶν ⸀λαβὼν ἄρτον εὐλογήσας ἔκλασεν καὶ ἔδωκεν αὐτοῖς καὶ εἶπεν· ⸀Λάβετε, τοῦτό ἐστιν τὸ σῶμά μου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/022.yaml
  text: And as they were eating[a], he took bread, blessed it, broke it, and gave it to them, and said, “Take; this is my body.”
translation:
  language: hi
  text: जब वे खा रहे थे, उसने रोटी ली, आशीष करके उसे तोड़ा और उन्हें दिया। फिर उसने कहा, “लो, यह मेरा शरीर है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “यह मेरे शरीर को दर्शाता है” या “इसका अर्थ है: ‘मेरा शरीर।’” यूनानी में शाब्दिक रूप से “यह मेरा शरीर है” लिखा है।'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐσθιόντων αὐτῶν
  choice: जब वे खा रहे थे
  rationale: वर्तमान कृदंत वाला संबंधकारक निरपेक्ष पदबंध उसी समय जारी क्रिया को दर्शाता है; यह रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: λαβὼν ἄρτον
  choice: उसने रोटी ली
  rationale: यूनानी के भूतकालिक कृदंत को हिन्दी कथा-शैली में स्वतंत्र क्रिया के रूप में रखना स्वाभाविक है। ἄρτον अनिश्चित है, इसलिए केवल ‘रोटी’ कहा गया है, ‘एक रोटी’ या ‘रोटी का टुकड़ा’ नहीं।
- source_word: εὐλογήσας
  choice: आशीष दी
  rationale: भोजन के प्रसंग में यह शब्द आशीष बोलने को सूचित करता है। यूनानी में कर्म स्पष्ट नहीं है, इसलिए हिन्दी में भी ‘उसे आशीष दी’ जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: ἔκλασεν
  choice: उसे तोड़ा
  rationale: संदर्भ से सर्वनाम ‘उसे’ रोटी की ओर संकेत करता है और हिन्दी में वाक्य को स्पष्ट तथा संक्षिप्त रखता है।
- source_word: ἔδωκεν αὐτοῖς
  choice: उन्हें दिया
  rationale: दी जाने वाली वस्तु संदर्भ से रोटी है; हिन्दी में उसे दोहराए बिना अर्थ स्पष्ट रहता है।
- source_word: Λάβετε
  choice: लो
  rationale: यह बहुवचन आज्ञार्थक रूप का सीधा, स्वाभाविक और प्रसंगानुकूल हिन्दी रूप है।
- source_word: τοῦτό ἐστιν
  choice: यह ... है
  rationale: साधारण योजक क्रिया ἐστιν का सीधा अनुवाद किया गया है; मुख्य पाठ में ‘अर्थ है’ या ‘प्रतीक है’ कहकर व्याख्यात्मक निष्कर्ष नहीं जोड़ा गया।
- source_word: τὸ σῶμά μου
  choice: मेरा शरीर
  rationale: σῶμα का सामान्य और प्रत्यक्ष अर्थ ‘शरीर’ है; प्रसंग इसे किसी व्याख्यात्मक विकल्प से बदलने की माँग नहीं करता।
theological_decisions:
- issue: प्रभु-भोज में यीशु के कथन का अर्थ
  choice: “यह मेरा शरीर है”
  alternative: “यह मेरे शरीर को दर्शाता है” अथवा “इसका अर्थ मेरा शरीर है”
  rationale: यूनानी पाठ साधारण योजक ἐστιν का प्रयोग करता है। सीधा अनुवाद मूल कथन और उससे जुड़ा धर्मवैचारिक तनाव सुरक्षित रखता है, किसी एक संस्कार-संबंधी व्याख्या का निर्णय नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। घटनाओं का क्रम छोटे, सहज क्रियापदों में व्यक्त है। फुटनोट-चिह्न संबंधित कथन के बाद रखा गया है, ताकि उसका विषय स्पष्ट रहे।
