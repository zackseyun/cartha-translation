  text: And coming again[a], he found them sleeping, for their eyes were weighed down, and they did not know what they should answer him.
translation:
  language: hi
  text: और जब वह फिर आया, तो उसने उन्हें सोते हुए पाया, क्योंकि उनकी आँखें बोझिल हो रही थीं[a]; और वे नहीं जानते थे कि उसे क्या उत्तर दें।
  philosophy: optimal-equivalence
  footnotes:
