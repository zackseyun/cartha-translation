source:
  edition: SBLGNT
  text: Καὶ ἀπήγαγον τὸν Ἰησοῦν πρὸς τὸν ἀρχιερέα, καὶ ⸀συνέρχονται πάντες οἱ ἀρχιερεῖς καὶ οἱ πρεσβύτεροι καὶ οἱ γραμματεῖς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/053.yaml
  text: And they led Jesus away to the high priest[a], and all the chief priests and the elders and the scribes gathered together.
translation:
  language: hi
  text: वे यीशु को महायाजक के पास ले गए, और सभी प्रधान याजक, पुरनिये और शास्त्री इकट्ठे हो गए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में यहाँ वर्तमान-काल का रूप है: “इकट्ठे होते हैं”; अतीत के वर्णन के बीच यह प्रयोग घटना को सजीव बनाता है।'
    reason: ऐतिहासिक वर्तमान की स्रोत-पाठ संबंधी शैली को स्पष्ट करना।
lexical_decisions:
- source_word: ἀπήγαγον
  choice: ले गए
  rationale: यह क्रिया किसी को साथ लेकर एक स्थान से दूसरे स्थान तक ले जाने को व्यक्त करती है। प्रसंग में “ले गए” स्वाभाविक है और हिरासत में ले जाए जाने का भाव बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: एकवचन में यह उस समय के प्रधान महायाजकीय पदाधिकारी को सूचित करता है; हिन्दी बाइबलीय प्रयोग में “महायाजक” स्पष्ट और प्रचलित है।
- source_word: συνέρχονται
  choice: इकट्ठे हो गए
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर हिन्दी के अतीतकालीन वर्णन में “इकट्ठे हो गए” अधिक स्वाभाविक है। वर्तमान-काल की सजीवता को पादटिप्पणी में बताया गया है।
- source_word: πάντες
  choice: सभी
  rationale: यह एकत्र हुए नेतृत्व-वर्ग की समग्रता पर बल देता है। वाक्य के अंत में “सभी” रखने से स्पष्ट होता है कि यह प्रधान याजकों, पुरनियों और शास्त्रियों—तीनों समूहों से संबंधित है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन में यह महायाजकीय नेतृत्व-वर्ग को सूचित करता है और पहले आए एकवचन “महायाजक” से उचित भेद बनाए रखता है।
- source_word: πρεσβύτεροι
  choice: पुरनिए
  rationale: इस संस्थागत प्रसंग में शब्द मान्य अगुवों के लिए है, केवल अधिक आयु के पुरुषों के लिए नहीं। “पुरनिए” हिन्दी बाइबलीय संदर्भ में इस पद का परिचित रूप है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह व्यवस्था और पवित्र लेखों के विशेषज्ञों के लिए प्रचलित, संक्षिप्त और स्रोत के निकट हिन्दी पद है।
theological_decisions:
- issue: अतीत के वर्णन में συνέρχονται का ऐतिहासिक वर्तमान
  choice: 'मुख्य पाठ में अतीतकाल: “इकट्ठे हो गए”'
  alternative: 'वर्तमानकाल: “इकट्ठे होते हैं”'
  rationale: स्वाभाविक आधुनिक हिन्दी कथन के लिए अतीतकाल चुना गया है, जबकि यूनानी की सजीव वर्तमान-कालीन शैली पादटिप्पणी में सुरक्षित रखी गई है। यह शैलीगत निर्णय है, कोई धर्मवैज्ञानिक निष्कर्ष नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी रखी गई है। “महायाजक,” “प्रधान याजक,” “पुरनिए” और “शास्त्री” जैसे परिचित बाइबलीय पद संस्थागत भेदों को स्पष्ट रखते हैं।
