  source_fidelity: 'The translation retains all major elements of the Greek: Mark''s historical present (''कहते हैं''), the solemn affirmation, both temporal expressions (''आज, इसी रात''), the two rooster crows, and the threefold denial. ''मेरा इनकार करोगे'' accurately conveys με ἀπαρνήσῃ without importing the more specific later wording about not knowing Jesus.'
