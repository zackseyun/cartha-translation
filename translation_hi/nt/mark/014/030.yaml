  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ λέγει αὐτῷ ὁ Ἰησοῦς· Ἀμὴν λέγω σοι ὅτι σὺ σήμερον ⸂ταύτῃ τῇ νυκτὶ⸃ πρὶν ἢ δὶς ἀλέκτορα φωνῆσαι τρίς ⸂με ἀπαρνήσῃ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/030.yaml
  text: And Jesus says to him[a], “Truly I tell you, today, this very night, before a rooster crows twice, you will deny me three times.”
translation:
  language: hi
  text: और यीशु उससे कहते हैं, “मैं तुमसे सच कहता हूँ, आज, इसी रात, मुर्गे के दो बार बाँग देने से पहले तुम तीन बार मेरा इनकार करोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहते हैं
  rationale: मरकुस के ऐतिहासिक वर्तमान काल को बनाए रखते हुए कथन में मूल की सजीवता सुरक्षित रखी गई है।
- source_word: Ἀμὴν λέγω σοι
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह हिन्दी में गंभीर और अधिकारपूर्ण पुष्टि को स्वाभाविक ढंग से व्यक्त करता है; यहाँ ‘आमीन’ कहना सामान्य हिन्दी पाठक के लिए आशय को कम स्पष्ट कर सकता है।
- source_word: σήμερον ταύτῃ τῇ νυκτί
  choice: आज, इसी रात
  rationale: मूल में उपस्थित दोनों काल-सूचक अभिव्यक्तियों को रखा गया है; ‘इसी’ निकटता और बल को व्यक्त करता है।
- source_word: δὶς ἀλέκτορα φωνῆσαι
  choice: मुर्गे के दो बार बाँग देने
  rationale: यूनानी अनंत क्रिया-रचना को स्वाभाविक हिन्दी कृदंत-रचना में व्यक्त किया गया है और ‘दो बार’ की विशेष मरकुसी सूचना सुरक्षित रखी गई है।
- source_word: τρίς με ἀπαρνήσῃ
  choice: तुम तीन बार मेरा इनकार करोगे
  rationale: प्रत्यक्ष कर्म ‘मेरा’ और संख्या ‘तीन बार’ दोनों सुरक्षित हैं; यह आधुनिक हिन्दी में स्पष्ट और इस प्रसंग के लिए परिचित अभिव्यक्ति है।
theological_decisions:
- issue: σήμερον और ταύτῃ τῇ νυκτί का संयुक्त काल-संकेत
  choice: दोनों को ‘आज, इसी रात’ के रूप में रखा गया है।
  alternative: केवल ‘आज रात’ कहना।
  rationale: दोनों अभिव्यक्तियाँ मूल पाठ में हैं और भविष्यवाणी की तात्कालिकता पर बल देती हैं; उन्हें मिलाकर एक कर देना मूल के जोर को घटा देता।
- issue: मरकुस का ऐतिहासिक वर्तमान λέγει
  choice: ‘कहते हैं’ वर्तमान काल में।
  alternative: ‘कहा’ भूतकाल में।
  rationale: वर्तमान काल मूल कथाशैली की सजीवता को दर्शाता है और हिन्दी में भी समझने योग्य है।
- issue: ἀπαρνέομαι का अर्थ
  choice: ‘मेरा इनकार करोगे’।
  alternative: ‘मुझे जानने से इनकार करोगे’ या ‘मुझसे मुकर जाओगे’।
  rationale: चुना गया रूप मूल की अपेक्षाकृत व्यापक भाषा को बनाए रखता है; ‘मुझे जानने से’ आगे के घटनाक्रम से अर्थ जोड़ता, जबकि ‘मुकरना’ कुछ अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सुबोध रखी गई है। वाक्य में ‘आज, इसी रात’ का हल्का असामान्य दोहराव जानबूझकर रखा गया है, क्योंकि वही मूल यूनानी के जोर को व्यक्त करता है।
