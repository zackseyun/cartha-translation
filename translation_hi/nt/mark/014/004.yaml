- source_word: ἦσαν δέ
  choice: पर ... लगे
  rationale: δέ यहाँ स्त्री के कार्य पर विपरीत प्रतिक्रिया को सामने लाता है; ‘पर’ आधुनिक हिन्दी में इस हल्के विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τινες
  choice: कुछ लोग
  rationale: अनिश्चित बहुवचन को बिना व्यक्तियों की पहचान तय किए सहज हिन्दी में व्यक्त करता है।
- source_word: ἀγανακτοῦντες
  choice: नाराज़ होकर
  rationale: शब्द तीव्र अप्रसन्नता और आक्रोश सूचित करता है; ‘नाराज़’ साधारण पाठक के लिए स्वाभाविक है और प्रसंग में केवल हल्की खीझ से अधिक कड़ी प्रतिक्रिया व्यक्त करता है।
- source_word: πρὸς ἑαυτούς
  choice: आपस में
  rationale: प्रसंग में समूह के भीतर परस्पर शिकायत का अर्थ सर्वाधिक स्वाभाविक है, जबकि यूनानी वाक्यांश आत्मगत प्रतिक्रिया की संभावना भी रखता है; उसे पादटिप्पणी में रखा गया है।
- source_word: Εἰς τί
  choice: क्यों
  rationale: उद्देश्य या परिणाम पर उठे इस प्रश्न का आधुनिक हिन्दी में सहज रूप ‘क्यों’ है।
- source_word: ἡ ἀπώλεια αὕτη
  choice: इस तरह ... बरबाद
  rationale: ἀπώλεια यहाँ महँगे सुगंधित तेल के अनुचित व्यय की वक्ताओं की धारणा व्यक्त करता है; क्रियात्मक हिन्दी वाक्य स्वाभाविक है और ‘इस तरह’ αὕτη के संकेत को रखता है।
- source_word: τοῦ μύρου
  choice: इस सुगंधित तेल को
  rationale: μύρον सुगंधित तेल अथवा मरहम-जैसे इत्र को सूचित करता है। ‘सुगंधित तेल’ वस्तु के तरल और सुगंधित स्वरूप को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: γέγονεν
  choice: किया गया
  rationale: इस प्रसंग में यूनानी मुहावरे का अर्थ यह है कि तेल की यह बरबादी कैसे या क्यों घटित हुई; हिन्दी का कर्मवाच्य शिकायत को स्वाभाविक रूप देता है, यद्यपि अधिक शाब्दिक रूप ‘हो गई’ संभव है।
