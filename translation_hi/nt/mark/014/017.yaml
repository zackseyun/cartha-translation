    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ मरकुस की क्रमबद्ध, समन्वयी शैली को बनाए रखता है।
- source_word: ὀψίας γενομένης
  choice: जब शाम हुई
  rationale: यह संबंधकारक निरपेक्ष रचना समय की परिस्थिति बताती है। ‘जब शाम हुई’ स्वाभाविक आधुनिक हिन्दी में इसका कालगत अर्थ बनाए रखता है।
- source_word: ἔρχεται
  choice: आता है
  rationale: यूनानी का वर्तमानकालिक रूप मरकुस का सजीव ऐतिहासिक वर्तमान है। ‘आता है’ उसी कथात्मक प्रभाव को सुरक्षित रखता है, बजाय इसे भूतकाल में समतल करने के।
- source_word: μετὰ τῶν δώδεκα
  choice: उन बारह के साथ
  rationale: μετά संबंधकारक के साथ संगति का अर्थ देता है। निश्चित पदबंध τῶν δώδεκα यीशु के पहचाने हुए बारह शिष्यों के समूह को सूचित करता है; ‘उन बारह’ बिना ‘शिष्य’ या ‘प्रेरित’ जोड़े इसे संक्षिप्त और स्पष्ट रखता है।
theological_decisions:
- issue: ‘उन बारह’ का संदर्भ
  choice: यह यीशु के विशेष बारह-सदस्यीय समूह को सूचित करता है, जिसमें कथा के इस बिंदु पर यहूदा भी सम्मिलित है।
  alternative: मुख्य पाठ में ‘बारह शिष्यों’ या ‘बारह प्रेरितों’ के रूप में विस्तार करना।
  rationale: मूल पाठ केवल ‘बारह’ कहता है। संक्षिप्त पदबंध को बनाए रखने से अनावश्यक व्याख्यात्मक विस्तार नहीं जुड़ता और कथा का स्पष्ट संदर्भ सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘आता है’ जानबूझकर रखा गया ऐतिहासिक वर्तमान है। ‘उन बारह’ हिन्दी में निश्चित, पहले से पहचाने गए समूह का संकेत देता है।
