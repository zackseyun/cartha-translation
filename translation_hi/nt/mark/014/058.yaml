  text: ὅτι Ἡμεῖς ἠκούσαμεν αὐτοῦ λέγοντος ὅτι Ἐγὼ καταλύσω τὸν ναὸν τοῦτον τὸν χειροποίητον καὶ διὰ τριῶν ἡμερῶν ἄλλον ἀχειροποίητον οἰκοδομήσω·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/058.yaml
  text: that[a], ‘We heard him saying, “I will destroy this temple made with hands[b], and in three days I will build another not made with hands.”’
translation:
  language: hi
  text: कि[a], “हमने उसे यह कहते सुना, ‘मैं हाथों से बने इस मंदिर को नष्ट कर दूँगा[b], और तीन दिनों के भीतर हाथों से नहीं बना हुआ दूसरा मंदिर बनाऊँगा।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कि” गवाहों के कथन की विषय-वस्तु आरम्भ करता है।
    reason: discourse_clarity
  - marker: b
    text: “हाथों से बने” और “हाथों से नहीं बना हुआ” यूनानी शब्दों χειροποίητον और ἀχειροποίητον के विरोध को बनाए रखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: कि
  rationale: यह साक्ष्य में कही गई बात की विषय-वस्तु प्रस्तुत करता है, कारण नहीं बताता।
- source_word: Ἡμεῖς
  choice: हमने
  rationale: स्पष्ट सर्वनाम के बल को बनाए रखते हुए गवाहों के आत्म-दावे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠκούσαμεν αὐτοῦ λέγοντος
  choice: हमने उसे यह कहते सुना
  rationale: कृदन्तीय रचना को स्वाभाविक हिन्दी में रखते हुए चल रहे कथन का भाव सुरक्षित करता है।
- source_word: καταλύσω
  choice: नष्ट कर दूँगा
  rationale: भवन के प्रसंग में क्रिया गिराने या नष्ट करने का बोध देती है; यह आरोप की तीव्रता भी बनाए रखती है।
- source_word: ναὸν
  choice: मन्दिर
  rationale: यहाँ यरूशलेम के मन्दिर अथवा उसके पवित्र भवन के लिए सामान्य और सहज हिन्दी शब्द उपयुक्त है।
- source_word: τοῦτον
  choice: इस
  rationale: सामने संदर्भित मन्दिर की ओर संकेत करने वाला बल सुरक्षित रहता है।
- source_word: χειροποίητον
  choice: हाथों से बनाए गए
  rationale: ἀχειροποίητον के साथ मूल का स्पष्ट शब्दगत विरोध बनाए रखता है।
- source_word: διὰ τριῶν ἡμερῶν
  choice: तीन दिनों के भीतर
  rationale: διά के साथ संबंधकारक यहाँ उस समयावधि को दर्शाता है जिसके भीतर कार्य होगा; हिन्दी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: ἄλλον
  choice: दूसरा मन्दिर
  rationale: ἄλλος का सामान्य अर्थ सुरक्षित है; हिन्दी में संज्ञा दोहराने से संदर्भ स्पष्ट रहता है।
- source_word: ἀχειροποίητον
  choice: जो हाथों से बनाया हुआ नहीं होगा
  rationale: χειροποίητον के विपरीत समान शब्दावली रखकर सम्भावित धर्मवैचारिक संकेत को बिना समझाए सुरक्षित करता है।
- source_word: οἰκοδομήσω
  choice: बनाऊँगा
  rationale: क्रिया का अर्थ बनाना है; ‘फिर से बनाऊँगा’ मूल से अधिक अर्थ जोड़ देता।
theological_decisions:
- issue: क्या कथन को झूठे या विकृत आरोप के रूप में अनुवाद के भीतर स्पष्ट किया जाए
  choice: इसे गवाहों द्वारा उद्धृत कथन के रूप में बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: ‘उसने कथित रूप से कहा’ या ‘उन्होंने उसके शब्दों को तोड़-मरोड़कर कहा’ जैसा स्पष्टीकरण जोड़ना
  rationale: पद स्वयं गवाहों के दावे को रिपोर्ट करता है; अन्य प्रसंगों से सामंजस्य बैठाने वाली व्याख्या जोड़ना उचित नहीं।
- issue: हाथों से बने और हाथों से न बने मन्दिर के विरोध का अर्थ
  choice: मूल शब्दगत विरोध को सीधे बनाए रखा गया
  alternative: ‘मनुष्य-निर्मित’ और ‘ईश्वर-निर्मित’ जैसा व्याख्यात्मक अनुवाद
  rationale: मूल में सम्भावित धर्मवैचारिक गूँज है, पर यह स्पष्ट नहीं करता कि दूसरा मन्दिर किस रीति से बना है; अनुवाद को यह तनाव सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मन्दिर’ की प्रचलित वर्तनी और प्रत्यक्ष उद्धरण की स्पष्ट संरचना रखी गई है। समय-वाक्यांश में ‘तीन दिनों के भीतर’ मूल की अवधि का भाव सुरक्षित करता है।
