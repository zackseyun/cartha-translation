  text: ὁ δὲ ἠρνήσατο λέγων· ⸂Οὔτε οἶδα οὔτε ἐπίσταμαι σὺ τί⸃ λέγεις, καὶ ἐξῆλθεν ἔξω εἰς τὸ προαύλιον ⸂καὶ ἀλέκτωρ ἐφώνησεν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/068.yaml
  text: But he denied it[a], saying, “I neither know nor understand what you are saying.” And he went out into the forecourt, and a rooster crowed.
translation:
  language: hi
  text: पर उसने इनकार किया और कहा, “न तो मैं जानता हूँ, न समझता हूँ कि तुम क्या कह रही हो।” फिर वह बाहर, बाहरी आँगन में चला गया, और एक मुर्गे ने बाँग दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘और एक मुर्गे ने बाँग दी’ नहीं है।
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνήσατο
  choice: उसने इनकार किया
  rationale: यह क्रिया पिछले कथन या आरोप को नकारने का भाव देती है। हिन्दी में बिना कर्म के ‘इनकार किया’ स्वाभाविक है और ‘यीशु का इनकार किया’ जैसी संदर्भ से अधिक स्पष्ट व्याख्या जोड़ने से बचता है।
- source_word: Οὔτε οἶδα οὔτε ἐπίσταμαι
  choice: न तो मैं जानता हूँ, न समझता हूँ
  rationale: दोनों क्रियाओं को अलग-अलग रखकर पतरस के जोरदार दोहरे इनकार को सुरक्षित रखा गया है; आधुनिक हिन्दी में ‘जानता’ और ‘समझता’ सहज और स्पष्ट हैं।
- source_word: σὺ τί λέγεις
  choice: तुम क्या कह रही हो
  rationale: शाब्दिक अर्थ ‘तुम क्या कहती हो’ है। पिछले संदर्भ में संबोधित करने वाली दासी है, इसलिए हिन्दी में आवश्यक स्त्रीलिंग रूप लिया गया है, जबकि कथन का सीधा अर्थ बनाए रखा गया है।
- source_word: ἐξῆλθεν ἔξω
  choice: वह बाहर ... चला गया
  rationale: क्रिया और क्रिया-विशेषण दोनों बाहर जाने पर बल देते हैं। हिन्दी में ‘बाहर चला गया’ इस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προαύλιον
  choice: ड्योढ़ी
  rationale: यह भीतर के मुख्य आँगन से पहले के प्रवेश-क्षेत्र या बाहरी प्रांगण को सूचित करता है। ‘ड्योढ़ी’ इस स्थानिक भेद को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: एक मुर्गे ने बाँग दी
  rationale: मुर्गे की आवाज़ के लिए यह स्वाभाविक हिन्दी मुहावरा है। यूनानी में संज्ञा के साथ निश्चित उपपद नहीं है, इसलिए ‘एक मुर्गे’ उपयुक्त है।
theological_decisions:
- issue: καὶ ἀλέκτωρ ἐφώνησεν वाक्यांश का समावेश
  choice: मुख्य पाठ में ‘और एक मुर्गे ने बाँग दी’ रखा गया है।
  alternative: कुछ पांडुलिपियों के अनुसार इस वाक्यांश को छोड़ना।
  rationale: प्रदत्त SBLGNT पाठ इस वाक्यांश को पाठगत अनिश्चितता के संकेत के साथ सम्मिलित करता है। इसलिए इसे मुख्य पाठ में अनूदित किया गया है और पांडुलिपीय भिन्नता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ड्योढ़ी’ मुख्य आँगन से बाहर के प्रवेश-क्षेत्र का स्थानिक अर्थ बनाए रखती है। पादटिप्पणी-चिह्न उसी पाठांश के बाद रखा गया है जिससे पाठगत भिन्नता संबंधित है।
