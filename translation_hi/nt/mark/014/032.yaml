  text: Καὶ ἔρχονται εἰς χωρίον οὗ τὸ ὄνομα Γεθσημανί, καὶ λέγει τοῖς μαθηταῖς αὐτοῦ· Καθίσατε ὧδε ἕως προσεύξωμαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/032.yaml
  text: And they came to a place whose name was Gethsemane[a], and he says to his disciples, “Sit here until I pray.”
translation:
  language: hi
  text: फिर वे गतसमनी नाम की एक जगह पर आए, और यीशु ने अपने शिष्यों से कहा, “जब तक मैं प्रार्थना करूँ, तुम यहीं बैठो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “वे आते हैं ... और वह कहता है,” जिससे मरकुस का सजीव ऐतिहासिक वर्तमान बना रहता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχονται
  choice: आए
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-प्रवाह में भूतकाल अधिक स्वाभाविक है।
- source_word: χωρίον
  choice: एक जगह
  rationale: यह शब्द किसी स्थान, भूखंड या संपत्ति को सूचित कर सकता है; यहाँ ‘जगह’ अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: οὗ τὸ ὄνομα Γεθσημανί
  choice: गतसमनी नाम की
  rationale: यूनानी नाम-सूचक वाक्यांश का स्वाभाविक हिन्दी रूप; व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: λέγει
  choice: कहा
  rationale: मूल का ऐतिहासिक वर्तमान आधुनिक हिन्दी में स्वाभाविक कथा-भूतकाल से व्यक्त किया गया है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: μαθηταῖς
  choice: शिष्यों
  rationale: यह शिक्षक और उसके अनुयायियों के संबंध को सटीक और प्रचलित ढंग से व्यक्त करता है।
- source_word: Καθίσατε ὧδε
  choice: तुम यहीं बैठो
  rationale: आज्ञार्थक क्रिया और स्थानवाचक क्रियाविशेषण का सहज, सीधा हिन्दी रूप।
- source_word: ἕως προσεύξωμαι
  choice: जब तक मैं प्रार्थना करूँ
  rationale: ἕως के साथ एओरिस्ट सबजंक्टिव समय की सीमा व्यक्त करता है; यह अनुवाद अवधि की बजाय उस सीमा को बनाए रखता है।
theological_decisions: []
