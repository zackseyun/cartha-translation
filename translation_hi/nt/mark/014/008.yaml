  text: ὃ ⸀ἔσχεν ἐποίησεν, προέλαβεν μυρίσαι ⸂τὸ σῶμά μου⸃ εἰς τὸν ἐνταφιασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/008.yaml
  text: She did what she could[a]; she anointed my body beforehand for burial.
translation:
  language: hi
  text: वह जो कर सकती थी, उसने किया[a]; उसने मेरे शरीर पर मेरे दफ़न के लिए पहले ही सुगंधित द्रव्य लगाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शब्दशः, “उसने जो उसके पास था, वही किया।”
    reason: मूल यूनानी अभिव्यक्ति ὃ ἔσχεν ἐποίησεν का अधिक शब्दशः विकल्प सुरक्षित रखना।
lexical_decisions:
- source_word: ὃ ἔσχεν ἐποίησεν
  choice: उसने जो कुछ कर सकती थी, किया
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है और स्त्री की सामर्थ्य के अनुसार किए गए कार्य को व्यक्त करता है। अधिक शब्दशः अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: προέλαβεν
  choice: पहले ही
  rationale: क्रिया किसी काम को समय से पहले कर लेने का भाव देती है; इसे तेल लगाने की क्रिया के साथ क्रियाविशेषण रूप में रखना हिन्दी में सहज है।
- source_word: μυρίσαι
  choice: सुगंधित तेल लगाया
  rationale: μυρίζω शरीर पर इत्र अथवा सुगंधित मरहम/तेल लगाने को दर्शाता है। 'अभिषेक किया' यहाँ धार्मिक अनुष्ठान का अनावश्यक संकेत दे सकता है, इसलिए संदर्भानुकूल स्पष्ट वाक्यांश चुना गया।
- source_word: τὸ σῶμά μου
  choice: मेरे शरीर पर
  rationale: अर्थ का सीधा और स्वाभाविक हिन्दी रूप; 'लगाया' के साथ अधिकरण कारक हिन्दी प्रयोग के अनुरूप है।
- source_word: εἰς τὸν ἐνταφιασμόν
  choice: दफ़नाए जाने के लिए
  rationale: यह पदबंध दफ़न की तैयारी के उद्देश्य को व्यक्त करता है। कर्मवाच्य रूप यीशु के शरीर को दफ़नाए जाने का आशय स्पष्ट रखता है।
theological_decisions:
- issue: यूनानी पद में व्यक्त कर्ता न होने पर स्त्रीलिंग कर्ता को स्पष्ट करना
  choice: उसने
  alternative: बिना व्यक्त सर्वनाम के अनुवाद
  rationale: निकटवर्ती प्रसंग में कार्य करने वाली स्त्री स्पष्ट है; स्वाभाविक हिन्दी के लिए सर्वनाम आवश्यक है और इससे कोई नया धर्मवैज्ञानिक आशय नहीं जुड़ता।
- issue: μυρίσαι को धार्मिक 'अभिषेक' की भाषा में प्रस्तुत करना या सामान्य सुगंधित तेल लगाने की क्रिया के रूप में
  choice: सुगंधित तेल लगाया
  alternative: अभिषेक किया
  rationale: दफ़न की तैयारी के इस संदर्भ में मूल क्रिया सुगंधित पदार्थ लगाने को बताती है। चुना गया रूप संभावित धार्मिक-पदवी संबंधी अर्थ आरोपित नहीं करता।
- issue: προέλαβεν में पूर्वक्रिया का भाव
  choice: तेल लगाने का काम पहले ही किया
  alternative: वह पहले से मेरे शरीर पर तेल लगाने आई
  rationale: मूल क्रिया पूर्व में कार्य कर लेने को व्यक्त करती है, आने या गति की क्रिया को नहीं; इसलिए अनावश्यक 'आई' नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। 'दफ़नाए जाने' सामान्य पाठक के लिए स्पष्ट है; 'सुगंधित तेल लगाया' मूल क्रिया के ठोस अर्थ को धार्मिक पारिभाषिकता के बिना व्यक्त करता है।
