source:
  edition: SBLGNT
  text: πάντοτε γὰρ τοὺς πτωχοὺς ἔχετε μεθ’ ἑαυτῶν, καὶ ὅταν θέλητε δύνασθε ⸀αὐτοῖς εὖ ποιῆσαι, ἐμὲ δὲ οὐ πάντοτε ἔχετε·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/007.yaml
  text: For you always have the poor with you[a], and whenever you want, you are able to do good to them; but you do not always have me.
translation:
  language: hi
  text: क्योंकि गरीब तो हमेशा तुम्हारे साथ हैं, और जब भी तुम चाहो, उनका भला कर सकते हो[a]; पर मैं हमेशा तुम्हारे साथ नहीं हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी मुहावरे का अर्थ है उनके हित में काम करना, केवल उनके प्रति सद्भाव रखना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντοτε
  choice: हमेशा
  rationale: यह सामान्य और स्वाभाविक हिन्दी क्रियाविशेषण है तथा पद में दोहराए गए कालगत विरोध को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस संयोजक बल को स्पष्ट रूप से व्यक्त करता है।
- source_word: πτωχούς
  choice: गरीब
  rationale: यह विशेषण संज्ञा के रूप में निर्धन लोगों के वर्ग को दर्शाता है। ‘गरीब’ आधुनिक हिन्दी में संक्षिप्त, सहज और व्यापक है।
- source_word: ἔχετε μεθ’ ἑαυτῶν
  choice: तुम्हारे साथ हैं
  rationale: हिन्दी में स्वाभाविक अभिव्यक्ति के लिए यूनानी ‘तुम अपने साथ रखते हो’ को अस्तित्वसूचक रूप दिया गया है; इससे उनकी निरंतर उपस्थिति और उपलब्धता का भाव सुरक्षित रहता है।
- source_word: ὅταν θέλητε
  choice: जब भी तुम चाहो
  rationale: ὅταν के साथ संभावनार्थक क्रिया अनिश्चित और बार-बार उपलब्ध समय को व्यक्त करती है; यह हिन्दी प्रयोग उसी खुले अवसर को बनाए रखता है।
- source_word: δύνασθε
  choice: कर सकते हो
  rationale: यह सामर्थ्य या अवसर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: αὐτοῖς εὖ ποιῆσαι
  choice: उनका भला कर सकते हो
  rationale: εὖ ποιέω किसी के हित में अच्छा कार्य करने का मुहावरा है। ‘उनका भला करना’ इसके लाभकारी कर्म के अर्थ को रखता है और इसे केवल दान देने तक सीमित नहीं करता।
- source_word: ἐμὲ δὲ
  choice: पर मैं
  rationale: δέ गरीबों की निरंतर उपस्थिति और यीशु की सीमित उपस्थिति के बीच विरोध दिखाता है; हिन्दी वाक्य-रचना में ‘पर मैं’ इसे साफ और सहज बनाता है।
- source_word: οὐ πάντοτε ἔχετε
  choice: हमेशा तुम्हारे साथ नहीं हूँ
  rationale: वर्तमान काल और πάντοτε के विरोध को बनाए रखते हुए हिन्दी में स्वाभाविक रूप दिया गया है। भविष्यकाल ‘नहीं रहूँगा’ जोड़ने से बचा गया है, क्योंकि वह स्रोत के वर्तमान रूप की व्याख्यात्मक पुनर्रचना होती।
theological_decisions:
- issue: क्या यह कथन गरीबों की सहायता को कम महत्त्व देता है?
  choice: गरीबों की निरंतर उपस्थिति और उनके लिए भला करने के सतत अवसर की तुलना यीशु की सीमित शारीरिक उपस्थिति से की गई है।
  alternative: यीशु अपने प्रति भक्ति को गरीबों की चिंता के विरुद्ध रखकर गरीबों की सहायता को खारिज कर रहे हैं।
  rationale: ‘जब भी तुम चाहो, उनका भला कर सकते हो’ गरीबों के हित में कार्य करने के अवसर की स्पष्ट पुष्टि करता है। पाठ का विरोध कालगत और परिस्थितिगत है; वह दया के दायित्व का निषेध नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और बोलचाल में सहज है। ‘गरीब’ सामान्य पाठक के लिए स्पष्ट है; ‘उनका भला करना’ मूल मुहावरे की व्यापकता रखता है। ‘तो’ पहले खंड में बल और अगले खंड के विरोध को स्वाभाविक हिन्दी में उभारता है।
