  text: Καὶ ⸂νεανίσκος τις⸃ ⸀συνηκολούθει αὐτῷ περιβεβλημένος σινδόνα ἐπὶ γυμνοῦ, καὶ κρατοῦσιν ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/051.yaml
  text: And a certain young man was following him[a], wearing only a linen cloth over his naked body, and they seize him,
translation:
  language: hi
  text: और एक युवक उसके पीछे चला आ रहा था। वह नंगे शरीर पर केवल सन का एक कपड़ा[a] लपेटे हुए था, और वे उसे पकड़ लेते हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सन की एक चादर।’ यूनानी शब्द σινδών सन के कपड़े अथवा चादर-जैसे वस्त्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νεανίσκος τις
  choice: एक युवक
  rationale: νεανίσκος का अर्थ ‘युवक’ है और τις एक अनाम, किंतु विशेष व्यक्ति का परिचय देता है। हिंदी में ‘एक युवक’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: συνηκολούθει
  choice: पीछे चला आ रहा था
  rationale: अपूर्ण भूतकाल ongoing action दर्शाता है; ‘चला आ रहा था’ उस निरंतर क्रिया को सहज हिंदी में बनाए रखता है।
- source_word: αὐτῷ
  choice: उसके
  rationale: संदर्भ में सर्वनाम यीशु की ओर संकेत करता है; ‘उसके पीछे’ हिंदी की स्वाभाविक रचना है।
- source_word: περιβεβλημένος
  choice: लपेटे हुए था
  rationale: यह कृदंत शरीर के चारों ओर कपड़ा ओढ़ने या लपेटने का भाव देता है। इस प्रसंग में ‘लपेटे हुए’ कपड़े की अनिश्चित बनावट को भी सुरक्षित रखता है।
- source_word: σινδόνα
  choice: सन का एक कपड़ा
  rationale: σινδών सन के कपड़े, चादर या चादर-जैसे वस्त्र को सूचित कर सकता है। ‘सन का एक कपड़ा’ उसके पदार्थ को बताता है, पर उसके ठीक रूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐπὶ γυμνοῦ
  choice: नंगे शरीर पर केवल
  rationale: इस वाक्यांश का आशय है कि कपड़ा सीधे नंगे शरीर पर था और नीचे कोई दूसरा वस्त्र नहीं था। ‘केवल’ निहित अर्थ को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: κρατοῦσιν
  choice: वे उसे पकड़ लेते हैं
  rationale: यूनानी ऐतिहासिक वर्तमान दृश्य को सजीव बनाता है। हिंदी का वर्तमान ‘पकड़ लेते हैं’ इस जीवंतता को बनाए रखता है और ‘गिरफ़्तार करते हैं’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
- source_word: αὐτόν
  choice: उसे
  rationale: यह सीधा कर्म अभी-अभी परिचित कराए गए युवक की ओर संकेत करता है।
