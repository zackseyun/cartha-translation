translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव, गरिमापूर्ण कथात्मक शैली रखी गई है। मरकुस के दोनों ऐतिहासिक वर्तमान—‘भेजता है’ और ‘कहता है’—सुरक्षित हैं। संबोधन बहुवचन ‘तुम’ में है, और मुख्य पाठ में अनावश्यक व्याख्या नहीं जोड़ी गई।
