  text: καὶ ἀποστέλλει δύο τῶν μαθητῶν αὐτοῦ καὶ λέγει αὐτοῖς· Ὑπάγετε εἰς τὴν πόλιν, καὶ ἀπαντήσει ὑμῖν ἄνθρωπος κεράμιον ὕδατος βαστάζων· ἀκολουθήσατε αὐτῷ,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/013.yaml
  text: And he sends two of his disciples and says to them[a], “Go into the city, and a man carrying a jar of water will meet you. Follow him,”
translation:
  language: hi
  text: और वह अपने चेलों में से दो को भेजता है और उनसे कहता है, “नगर में जाओ। वहाँ पानी का घड़ा[a] लिए हुए एक आदमी तुम्हें मिलेगा; उसके पीछे चलो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिट्टी का बना पानी का घड़ा।”
    reason: κεράμιον मिट्टी से बने पात्र को अधिक विशेष रूप से सूचित कर सकता है।
lexical_decisions:
- source_word: ἀποστέλλει
  choice: भेजता है
  rationale: यूनानी वर्तमान काल को ऐतिहासिक वर्तमान के रूप में सुरक्षित रखा गया है, जो मरकुस की सजीव कथाशैली की विशेषता है।
- source_word: δύο τῶν μαθητῶν αὐτοῦ
  choice: अपने चेलों में से दो
  rationale: भागसूचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘चेला’ μαθητής का प्रचलित और संदर्भानुकूल अनुवाद है।
- source_word: λέγει αὐτοῖς
  choice: उनसे कहता है
  rationale: ऐतिहासिक वर्तमान बनाए रखते हुए αὐτοῖς के बहुवचन अर्थ को स्पष्ट करता है।
- source_word: Ὑπάγετε εἰς τὴν πόλιν
  choice: नगर में जाओ
  rationale: आज्ञार्थक बल और εἰς द्वारा व्यक्त भीतर की ओर गति, दोनों को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἀπαντήσει ὑμῖν
  choice: तुम्हें मिलेगा
  rationale: भविष्यकाल और भेंट होने के भाव का स्वाभाविक हिन्दी रूप।
- source_word: ἄνθρωπος
  choice: एक आदमी
  rationale: यहाँ एक विशिष्ट पुरुष का उल्लेख है, इसलिए लिंग-सटीक सामान्य हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: κεράμιον ὕδατος
  choice: पानी का घड़ा
  rationale: अर्थ को स्पष्ट और संक्षिप्त रखता है; पात्र के मिट्टी के होने की संभावित विशिष्टता पादटिप्पणी में दी गई है।
- source_word: βαστάζων
  choice: लिए हुए
  rationale: चलते समय वस्तु उठाकर ले जाने की क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀκολουθήσατε αὐτῷ
  choice: उसके पीछे चलना
  rationale: सीधे आदेश को बोलचाल में स्वाभाविक हिन्दी आज्ञार्थक रूप में व्यक्त करता है।
