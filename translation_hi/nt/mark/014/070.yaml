source:
  edition: SBLGNT
  text: ὁ δὲ πάλιν ἠρνεῖτο. καὶ μετὰ μικρὸν πάλιν οἱ παρεστῶτες ἔλεγον τῷ Πέτρῳ· Ἀληθῶς ἐξ αὐτῶν εἶ, καὶ γὰρ Γαλιλαῖος εἶ ⸂καὶ ἡ λαλιά σου ὁμοιάζει⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/070.yaml
  text: But he again denied it[a]. And after a little while, those standing nearby again were saying to Peter, “Surely you are one of them, for you are also a Galilean[b], and your speech is similar.”
translation:
  language: hi
  text: पर उसने फिर इनकार किया। थोड़ी देर बाद, वहाँ खड़े लोग फिर पतरस से कहने लगे, “निश्चय ही तुम उन्हीं में से एक हो, क्योंकि तुम भी गलीली हो, और तुम्हारी बोली भी वैसी ही है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में “और तुम्हारी बोली भी वैसी ही है” नहीं मिलता।
    reason: textual_variant
lexical_decisions:
- source_word: ἠρνεῖτο
  choice: इनकार किया
  rationale: अपूर्ण काल जारी या दोहराए गए इनकार का संकेत दे सकता है; प्रसंग में ‘फिर’ यह पुनरावृत्ति स्पष्ट करता है, इसलिए स्वाभाविक हिन्दी में सरल भूतकाल रखा गया है।
- source_word: μετὰ μικρὸν
  choice: थोड़ी देर बाद
  rationale: यह मुहावरा समय के छोटे अंतराल को बताता है और आधुनिक हिन्दी में सहज है।
- source_word: οἱ παρεστῶτες
  choice: वहाँ खड़े लोग
  rationale: यह निकट उपस्थित या पास खड़े लोगों के स्थानिक भाव को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्ण काल चलती हुई या दोहराई गई वाणी दिखाता है; ‘कहने लगे’ प्रसंग में स्वाभाविक रूप से इस पहलू को व्यक्त करता है।
- source_word: Ἀληθῶς
  choice: निश्चय ही
  rationale: यह दृढ़ विश्वास के साथ किए गए कथन की शक्ति बनाए रखता है।
- source_word: ἐξ αὐτῶν εἶ
  choice: तुम उन्हीं में से एक हो
  rationale: यह यीशु से जुड़े समूह में पतरस की सदस्यता के आरोप को मुहावरेदार हिन्दी में व्यक्त करता है।
- source_word: καὶ γὰρ
  choice: क्योंकि तुम भी
  rationale: γάρ कारण देता है और καί ‘भी’ का भाव जोड़ता है।
- source_word: Γαλιλαῖος
  choice: गलीली
  rationale: यह गलील प्रदेश के व्यक्ति के लिए प्रचलित, संक्षिप्त हिन्दी रूप है।
- source_word: ἡ λαλιά σου
  choice: तुम्हारी बोली
  rationale: ‘बोली’ बोलने के ढंग, उपभाषा और उच्चारण के व्यापक भाव को हिन्दी में स्वाभाविक रूप से समेटती है।
- source_word: ὁμοιάζει
  choice: भी वैसी ही है
  rationale: क्रिया समानता दर्शाती है; तुलना का आधार प्रसंग में गलीली लोगों की बोली है, इसलिए यह हिन्दी में स्पष्ट पर अनावश्यक रूप से व्याख्यात्मक नहीं है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बोली’ को ‘लहजा’ से अधिक व्यापक चुना गया है, ताकि λαλιά के बोलने के ढंग, उपभाषा या उच्चारण संबंधी अर्थ-संभावनाएँ बनी रहें।
