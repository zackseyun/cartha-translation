  text: καὶ ὁ Πέτρος ἀπὸ μακρόθεν ἠκολούθησεν αὐτῷ ἕως ἔσω εἰς τὴν αὐλὴν τοῦ ἀρχιερέως καὶ ἦν συγκαθήμενος μετὰ τῶν ὑπηρετῶν καὶ θερμαινόμενος πρὸς τὸ φῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/054.yaml
  text: And Peter followed him from a distance[a], as far as inside the courtyard of the high priest. He was sitting with the officers and warming himself by the fire.
translation:
  language: hi
  text: और पतरस दूर से उसके पीछे-पीछे महायाजक के आँगन के भीतर तक गया। वह पहरेदारों के साथ बैठा, आग के पास[a] अपने को सेंक रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रकाश की ओर/पास।” यहाँ सम्भवतः आँगन में जलती आग का प्रकाश, और इसलिए आग के पास होने का भाव, अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπὸ μακρόθεν
  choice: दूर से
  rationale: यह स्वाभाविक आधुनिक हिन्दी में स्थानगत दूरी और पतरस के सावधानी से पीछे चलने का भाव बनाए रखता है।
- source_word: ἠκολούθησεν αὐτῷ
  choice: उसके पीछे-पीछे गया
  rationale: कथात्मक एओरिस्ट को सहज भूतकाल में व्यक्त करता है और हिन्दी में अनुसरण का अर्थ स्पष्ट करता है।
- source_word: ἕως ἔσω εἰς
  choice: आँगन के भीतर तक
  rationale: ἔσω के ‘भीतर’ और ἕως के सीमा-बोध, दोनों को सुरक्षित रखता है; घर के भीतरी कक्ष में प्रवेश का अनावश्यक संकेत नहीं देता।
- source_word: αὐλήν
  choice: आँगन
  rationale: इस प्रसंग में महायाजक के निवास का घिरा हुआ खुला प्रांगण अभिप्रेत है; ‘आँगन’ सामान्य और सुबोध हिन्दी है।
- source_word: ἀρχιερέως
  choice: महायाजक
  rationale: सुसमाचार के दुखभोग-वृत्तांत में ἀρχιερεύς का मानक और प्रसंगानुकूल हिन्दी रूप।
- source_word: ἦν συγκαθήμενος
  choice: साथ बैठा ... रहा था
  rationale: परिप्रयुक्त अपूर्णकाल से चल रही पृष्ठभूमि-क्रिया प्रकट होती है; σύν का साथ बैठने वाला भाव अगले पदबंध में सुरक्षित है।
- source_word: μετὰ τῶν ὑπηρετῶν
  choice: पहरेदारों के साथ
  rationale: इस गिरफ्तारी और सुनवाई के प्रसंग में ये केवल घरेलू सेवक नहीं, आधिकारिक सुरक्षा-कर्मी हैं; ‘पहरेदार’ उनकी भूमिका को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: θερμαινόμενος
  choice: अपने को सेंक रहा था
  rationale: मध्यवाच्य भाव और आग के पास गरम होने की क्रिया का स्वाभाविक हिन्दी रूप।
- source_word: πρὸς τὸ φῶς
  choice: आग की रोशनी में
  rationale: φῶς का मूल अर्थ ‘रोशनी’ सुरक्षित रहता है, जबकि ‘आग की’ प्रसंग से स्पष्ट उस ऊष्मा-स्रोत को बताता है जिसके पास पतरस अपने को सेंक रहा था।
