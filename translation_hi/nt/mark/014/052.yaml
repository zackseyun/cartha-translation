- source_word: σινδόνα
  choice: सन का कपड़ा
  rationale: σινδών सन से बने कपड़े को दर्शाता है, जिसकी ठीक बनावट—चादर या वस्त्र—यहाँ निश्चित नहीं है; इसलिए व्यापक अर्थ वाला ‘सन का कपड़ा’ चुना गया है।
- source_word: γυμνὸς
  choice: नंगा
  rationale: इस प्रसंग में γυμνός का सीधा अर्थ ‘नंगा’ है, क्योंकि युवक अपना ओढ़ा हुआ कपड़ा छोड़कर भागा; फिर भी शब्द अन्य संदर्भों में अपर्याप्त वस्त्र पहने होने का अर्थ दे सकता है।
- source_word: ἔφυγεν
  choice: भाग गया
  rationale: φεύγω शीघ्रता से भाग निकलने को व्यक्त करता है; ‘भाग गया’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी कथात्मक क्रिया की पूर्ण घटना को दर्शाता है।
