id: MRK.14.14
reference: Mark 14:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὅπου ⸀ἐὰν εἰσέλθῃ εἴπατε τῷ οἰκοδεσπότῃ ὅτι Ὁ διδάσκαλος λέγει· Ποῦ ἐστιν τὸ κατάλυμά ⸀μου ὅπου τὸ πάσχα μετὰ τῶν μαθητῶν μου φάγω;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/014.yaml
  text: And wherever he enters[a], say to the master of the house, ‘The Teacher says, “Where is my guest room where I may eat the Passover with my disciples?”’
translation:
  language: hi
  text: और वह जिस घर में भी जाए, उसके मालिक से कहना, ‘गुरु कहते हैं, “मेरा अतिथि-कक्ष कहाँ है जहाँ मैं अपने शिष्यों के साथ फसह का भोजन करूँ?”’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅπου ἐὰν εἰσέλθῃ
  choice: जहाँ भी भीतर जाए
  rationale: ὅπου के साथ ἐάν और संभावनार्थक क्रिया अनिश्चित संबंधवाचक अर्थ देती है; ‘जहाँ भी’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, और ‘भीतर जाए’ εἰσέρχομαι की गति को बनाए रखता है।
- source_word: εἴπατε
  choice: कहना
  rationale: यह बहुवचन आज्ञार्थक रूप है; हिन्दी में निर्देश देते समय ‘कहना’ स्वाभाविक है और आगे आने वाले प्रत्यक्ष कथन के अनुरूप है।
- source_word: οἰκοδεσπότῃ
  choice: उस घर के मुखिया
  rationale: शब्द घर या परिवार की व्यवस्था के अधिकारी व्यक्ति को दर्शाता है। ‘घर का मुखिया’ आधुनिक हिन्दी में स्पष्ट है और स्वामित्व को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Ὁ διδάσκαλος
  choice: गुरु
  rationale: διδάσκαλος का मूल अर्थ शिक्षक है, पर यीशु के लिए संबोधन या मान्य उपाधि के रूप में ‘गुरु’ आधुनिक बाइबलीय हिन्दी में स्वाभाविक और गरिमापूर्ण है; यह ‘स्वामी’ जैसा अधिक प्रबल अधिकार-सूचक अर्थ नहीं जोड़ता।
- source_word: κατάλυμά μου
  choice: मेरा अतिथि-कक्ष
  rationale: κατάλυμα यहाँ किसी निजी घर में ठहरने या अतिथि के लिए बने कमरे को सूचित करता है, व्यावसायिक सराय को नहीं। साथ का μου स्पष्टतः ‘मेरा’ है और सुरक्षित रखा गया या उपयोग के लिए ठहराया गया कमरा सूचित कर सकता है।
- source_word: τὸ πάσχα
  choice: फसह का भोजन
  rationale: πάσχα पर्व या उसके भोजन, दोनों को सूचित कर सकता है। φάγω (‘खाऊँ’) के साथ यहाँ भोजन अभिप्रेत है; हिन्दी में ‘फसह का भोजन’ अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: μετὰ τῶν μαθητῶν μου
  choice: अपने शिष्यों के साथ
  rationale: μαθηταί के लिए ‘शिष्य’ सुसंगत और प्रचलित हिन्दी पद है। कर्ता यीशु होने के कारण ‘अपने’ हिन्दी में स्वाभाविक आत्मवाचक संबंध व्यक्त करता है।
- source_word: φάγω
  choice: करूँ
  rationale: अओरिस्ट संभावनार्थक रूप खोजे जा रहे स्थान में होने वाली अभिप्रेत क्रिया को दर्शाता है। ‘भोजन करूँ’ हिन्दी में उद्देश्य या अपेक्षित क्रिया की वही छाया देता है।
theological_decisions:
- issue: διδάσκαλος के रूप में यीशु का आत्म-निर्देशन
  choice: गुरु
  alternative: शिक्षक; स्वामी
  rationale: ‘गुरु’ शिक्षण-संबंधी उपाधि को स्वाभाविक हिन्दी में रखता है। ‘स्वामी’ यूनानी शब्द से अधिक अधिकार-सूचक या मसीह-विषयक अर्थ जोड़ सकता है, जबकि ‘शिक्षक’ अधिक शाब्दिक होते हुए इस संबोधन में कुछ कम स्वाभाविक लगता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में प्रत्यक्ष कथन की दोहरी संरचना सुरक्षित है। κατάλυμα की संदर्भगत स्पष्टता मुख्य पाठ में ‘अतिथि-कक्ष’ से दी गई है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
