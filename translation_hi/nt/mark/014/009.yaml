id: MRK.14.9
reference: Mark 14:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀμὴν ⸀δὲ λέγω ὑμῖν, ὅπου ⸀ἐὰν κηρυχθῇ τὸ ⸀εὐαγγέλιον εἰς ὅλον τὸν κόσμον, καὶ ὃ ἐποίησεν αὕτη λαληθήσεται εἰς μνημόσυνον αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/009.yaml
  text: Truly I tell you[a], wherever the good news is proclaimed in the whole world[b], what this woman has done will also be spoken of in memory of her.
translation:
  language: hi
  text: मैं तुमसे सच कहता हूँ, सारे संसार में जहाँ कहीं यह शुभ समाचार[a] घोषित किया जाएगा, वहाँ इस स्त्री ने जो किया है, वह भी उसकी याद में[b] बताया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “सुसमाचार।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “उसके स्मारक के रूप में।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμὴν
  choice: सच
  rationale: यह यीशु के गंभीर और अधिकारपूर्ण कथन का परिचय देता है। ‘मैं तुमसे सच कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: δὲ
  choice: '[हिन्दी वाक्य-प्रवाह में निहित]'
  rationale: यह हल्का संयोजक है; यहाँ अलग संयोजक जोड़ना स्वाभाविक हिन्दी के लिए आवश्यक नहीं है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे ... कहता हूँ
  rationale: प्रत्यक्ष संबोधन और कथन की गंभीरता दोनों सुरक्षित रहते हैं।
- source_word: ὅπου ἐὰν
  choice: जहाँ कहीं
  rationale: यह किसी भी ऐसे स्थान का सामान्य और अनिश्चित संकेत देता है जहाँ बताई गई बात घटेगी।
- source_word: κηρυχθῇ
  choice: घोषित किया जाएगा
  rationale: यह सार्वजनिक रूप से संदेश सुनाने या घोषित करने का भाव व्यक्त करता है और इसे केवल धार्मिक उपदेश तक सीमित नहीं करता।
- source_word: τὸ εὐαγγέλιον
  choice: यह शुभ समाचार
  rationale: εὐαγγέλιον का मूल अर्थ ‘शुभ समाचार’ है। ‘यह’ प्रसंग में यीशु से जुड़े उसी संदेश को स्वाभाविक रूप से सूचित करता है; पारंपरिक ‘सुसमाचार’ को पादटिप्पणी में रखा गया है।
- source_word: εἰς ὅλον τὸν κόσμον
  choice: सारे संसार में
  rationale: यह व्यापक, विश्वव्यापी क्षेत्र को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: शुभ समाचार की घोषणा के साथ इस स्त्री के कार्य के बताए जाने का अतिरिक्त भाव स्पष्ट करता है।
- source_word: ὃ ἐποίησεν αὕτη
  choice: इस स्त्री ने जो किया है
  rationale: स्त्रीलिंग संकेतवाचक αὕτη का संदर्भ तत्काल प्रसंग की स्त्री है। ‘इस स्त्री’ हिन्दी पाठक के लिए संदर्भ स्पष्ट करता है।
- source_word: λαληθήσεται
  choice: बताया जाएगा
  rationale: भाव यह है कि उसका किया हुआ कार्य आगे बोला और सुनाया जाएगा; ‘बताया जाएगा’ आधुनिक हिन्दी में स्वाभाविक निष्क्रिय प्रयोग है।
- source_word: εἰς μνημόσυνον αὐτῆς
  choice: उसकी याद में
  rationale: यह स्मरण या स्मारक के अर्थ को सहज हिन्दी में रखता है और अधिक संज्ञात्मक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: विश्वव्यापी घोषणा के संदर्भ में εὐαγγέλιον का अनुवाद
  choice: शुभ समाचार
  alternative: सुसमाचार
  rationale: ‘शुभ समाचार’ यूनानी शब्द के सामान्य अर्थ को पारदर्शी और आधुनिक हिन्दी में व्यक्त करता है, जबकि स्थापित मसीही शब्द ‘सुसमाचार’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: αὕτη के स्त्री-संदर्भ को स्पष्ट करना
  choice: इस स्त्री ने जो किया है
  alternative: इसने जो किया है
  rationale: यूनानी संकेतवाचक स्त्रीलिंग एकवचन है और निकट प्रसंग की स्त्री की ओर संकेत करता है; संज्ञा स्पष्ट करना अर्थगत व्याख्या नहीं जोड़ता।
- issue: εἰς μνημόσυνον αὐτῆς में स्मरण और स्मारक की अर्थ-छाया
  choice: उसकी याद में
  alternative: उसके स्मारक के रूप में
  rationale: मुख्य पाठ में सहज स्मरण का भाव रखा गया है, पर यूनानी संज्ञा के अधिक ठोस ‘स्मारक’ भाव को विकल्प के रूप में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। ‘मैं तुमसे सच कहता हूँ’ गंभीर सूत्रवाक्य की शैली बनाए रखता है। दोनों पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद लगाए गए हैं।
