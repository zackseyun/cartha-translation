source:
  edition: SBLGNT
  text: Καὶ ὄντος αὐτοῦ ἐν Βηθανίᾳ ἐν τῇ οἰκίᾳ Σίμωνος τοῦ λεπροῦ κατακειμένου αὐτοῦ ἦλθεν γυνὴ ἔχουσα ἀλάβαστρον μύρου νάρδου πιστικῆς πολυτελοῦς· ⸀συντρίψασα ⸀τὴν ἀλάβαστρον κατέχεεν ⸀αὐτοῦ τῆς κεφαλῆς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/003.yaml
  text: And while he was in Bethany[a], reclining at the house of Simon the leper, a woman came with an alabaster jar of very expensive pure nard perfume; she broke the jar and poured it on his head.
translation:
  language: hi
  text: जब वह बैतनिय्याह में कोढ़ी शमौन के घर भोजन के लिए बैठा हुआ था, तब एक स्त्री अलबास्तर की शीशी में बहुत कीमती शुद्ध[a] जटामांसी का इत्र लेकर आई। उसने शीशी तोड़ी और इत्र उसके सिर पर उँडेल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “असली”; ‘शुद्ध’ के लिए प्रयुक्त यूनानी शब्द (πιστικῆς) का अर्थ विवादित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὄντος αὐτοῦ ... κατακειμένου αὐτοῦ
  choice: जब वह ... भोजन करने बैठा था
  rationale: संबंधकारक निरपेक्ष रचना पृष्ठभूमि की चल रही परिस्थिति बताती है। κατακειμένου का आशय मेज़ पर टिककर/लेटकर भोजन करना है; आधुनिक हिन्दी में ‘भोजन करने बैठा था’ स्वाभाविक है और केवल सामान्य बैठने की अपेक्षा प्रसंग को स्पष्ट करता है।
- source_word: Βηθανίᾳ
  choice: बैतनिय्याह
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा में परिचित लिप्यंतरण।
- source_word: οἰκίᾳ Σίμωνος τοῦ λεπροῦ
  choice: कोढ़ी शमौन के घर
  rationale: यूनानी पाठ शमौन को सीधे ‘कोढ़ी’ कहता है। ‘भूतपूर्व कोढ़ी’ जोड़ना पाठ में निहित नहीं है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: मरकुस यहाँ स्त्री की पहचान नहीं बताता; अनिश्चित उल्लेख को बनाए रखा गया है।
- source_word: ἀλάβαστρον
  choice: संगमरमर की शीशी
  rationale: यह सुगंधित द्रव्य रखने का अलबास्तर पात्र था। साधारण पाठक के लिए ‘शीशी’ पात्र का रूप स्पष्ट करती है; ‘संगमरमर’ पारंपरिक हिन्दी में अलबास्तर-जैसे सजावटी पत्थर को सहज रूप से व्यक्त करता है।
- source_word: μύρου
  choice: इत्र
  rationale: μύρον सुगंधित तेल या लेप को दर्शाता है। ‘इत्र’ आधुनिक हिन्दी में सुगंधित और बहुमूल्य पदार्थ का स्वाभाविक पद है, यद्यपि इससे आधुनिक अल्कोहल-आधारित इत्र अभिप्रेत नहीं।
- source_word: νάρδου
  choice: जटामांसी
  rationale: νάρδος हिमालयी सुगंधित वनस्पति और उससे बने द्रव्य को सूचित करता है; ‘जटामांसी’ इसका प्रचलित हिन्दी नाम है।
- source_word: πιστικῆς
  choice: शुद्ध
  rationale: πιστικός का अर्थ विवादित है। ‘शुद्ध’ प्रामाणिकता या मिलावट-रहित होने का संभावित भाव देता है; ‘असली’ विकल्प पादटिप्पणी में रखा गया है।
- source_word: πολυτελοῦς
  choice: बहुत कीमती
  rationale: यह उच्च मूल्य और लागत व्यक्त करता है तथा अगले पदों में होने वाली आपत्ति की आर्थिक पृष्ठभूमि को सहज हिन्दी में सामने लाता है।
- source_word: συντρίψασα τὴν ἀλάβαστρον
  choice: उसने शीशी तोड़ी
  rationale: कृदंत मुख्य क्रिया से पहले की कार्रवाई बताता है। ‘तोड़ी’ स्रोत के बल को रखता है, पर अनावश्यक रूप से ‘चकनाचूर’ नहीं कहता।
- source_word: κατέχεεν αὐτοῦ τῆς κεφαλῆς
  choice: इत्र उसके सिर पर उँडेल दिया
  rationale: क्रिया ऊपर से डालने/बहाने को व्यक्त करती है। ‘उँडेल दिया’ मात्रा और जानबूझकर किए गए कार्य को स्वाभाविक हिन्दी में बताता है।
theological_decisions:
- issue: क्या ‘कोढ़ी शमौन’ को नरम करके ‘भूतपूर्व कोढ़ी शमौन’ कहना चाहिए
  choice: मुख्य पाठ में ‘कोढ़ी शमौन’ बनाए रखा
  alternative: भूतपूर्व कोढ़ी शमौन
  rationale: मूल पाठ बिना स्पष्टीकरण के यही उपाधि देता है। रोग पहले ठीक हो चुका था—यह संभव अनुमान है, पर अनुवाद में जोड़ना स्रोत से आगे जाना होगा।
- issue: πιστικῆς की विवादित व्याख्या
  choice: शुद्ध
  alternative: असली/प्रामाणिक
  rationale: शब्द का निश्चित अर्थ विद्वानों में विवादित है। मुख्य पाठ में एक प्रचलित अर्थ लिया गया है और वास्तविक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कोढ़ी’ स्रोत की स्पष्ट उपाधि को बनाए रखता है; ‘भोजन करने बैठा’ प्राचीन मेज़-मुद्रा का शब्दशः वर्णन किए बिना प्रसंग व्यक्त करता है। पादटिप्पणी चिह्न [a] मुख्य पाठ में संबंधित शब्द के तुरंत बाद दिया गया है।
