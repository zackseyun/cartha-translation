  text: καὶ ἰδοῦσα τὸν Πέτρον θερμαινόμενον ἐμβλέψασα αὐτῷ λέγει· Καὶ σὺ μετὰ τοῦ Ναζαρηνοῦ ⸂ἦσθα τοῦ Ἰησοῦ⸃·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/067.yaml
  text: And seeing Peter warming himself, she looked at him and says, “You also were with Jesus the Nazarene.”
translation:
  language: hi
  text: और पतरस को तापते हुए देखकर, वह उसे गौर से देखती है और कहती है, “तुम भी उस नासरी यीशु के साथ थे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θερμαινόμενον
  choice: आग तापते
  rationale: संदर्भ में पतरस आग के पास स्वयं को गरम कर रहा है; आधुनिक हिन्दी में ‘आग तापना’ इसका स्वाभाविक और सटीक वर्णन है।
- source_word: ἐμβλέψασα αὐτῷ
  choice: उसे ध्यान से देखकर
  rationale: ἐμβλέπω साधारणतः देखने से अधिक, ध्यान लगाकर या गौर से देखने का भाव व्यक्त करता है।
- source_word: λέγει
  choice: कहती है
  rationale: यूनानी का ऐतिहासिक वर्तमान सुरक्षित रखा गया है, जैसा कि स्रोत-पाठ और संशोधित अंग्रेज़ी परामर्श-पाठ में है।
- source_word: τοῦ Ναζαρηνοῦ ... τοῦ Ἰησοῦ
  choice: उस नासरी यीशु
  rationale: यह यीशु की पहचान नासरत से जुड़े व्यक्ति के रूप में कराता है; ‘नासरी’ संक्षिप्त, प्रतिष्ठित और सामान्य हिन्दी बाइबलीय रूप है।
theological_decisions:
- issue: यीशु की पहचान बताने वाले पदबंध की रचना
  choice: उस नासरी यीशु के साथ
  alternative: यीशु नासरी के साथ
  rationale: यूनानी पाठ में ‘नासरी’ और ‘यीशु’ दोनों एक ही व्यक्ति की पहचान देते हैं। हिन्दी में चुना गया क्रम अर्थ स्पष्ट रखते हुए आरोपात्मक पहचान के स्वर को स्वाभाविक बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद में नौकरानी द्वारा पतरस को सीधे संबोधित करने के कारण ‘तू’ रखा गया है। वाक्य dignified किंतु बोलचाल में सहज है, और ऐतिहासिक वर्तमान ‘कहती है’ जानबूझकर सुरक्षित है।
