source:
  edition: SBLGNT
  text: Καὶ τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων, ὅτε τὸ πάσχα ἔθυον, λέγουσιν αὐτῷ οἱ μαθηταὶ αὐτοῦ· Ποῦ θέλεις ἀπελθόντες ἑτοιμάσωμεν ἵνα φάγῃς τὸ πάσχα;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/012.yaml
  text: And on the first day of Unleavened Bread[a], when they were sacrificing the Passover lamb, his disciples said to him, “Where do you want us to go and prepare so that you may eat the Passover?”
translation:
  language: hi
  text: और अख़मीरी रोटी के पर्व के पहले दिन, जब लोग फ़सह का मेमना बलि चढ़ा रहे थे,[a] उसके शिष्यों ने उससे कहा, “आप कहाँ चाहते हैं कि हम जाकर तैयारी करें, ताकि आप फ़सह का भोजन खाएँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब लोग फ़सह की बलि चढ़ा रहे थे।” यूनानी में शाब्दिक रूप से “फ़सह” है, जो इस प्रसंग में संभवतः बलि किए जाने वाले फ़सह के मेमने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τῇ πρώτῃ ἡμέρᾳ τῶν ἀζύμων
  choice: अख़मीरी रोटी के पर्व के पहले दिन
  rationale: यूनानी में ‘पर्व’ शब्द स्पष्ट रूप से नहीं है, पर τῶν ἀζύμων यहाँ स्थापित पर्व-संज्ञा है। हिन्दी में केवल ‘अख़मीरी रोटी के पहले दिन’ अस्वाभाविक और अस्पष्ट होता; ‘के पर्व’ जोड़ने से आशय स्वाभाविक ढंग से स्पष्ट होता है।
- source_word: ὅτε τὸ πάσχα ἔθυον
  choice: जब लोग फ़सह का मेमना बलि कर रहे थे
  rationale: ἔθυον अपूर्ण भूतकाल है और यहाँ चल रही प्रथागत गतिविधि दिखाता है। θύω के साथ πάσχα बलि के पशु को सूचित करता है, इसलिए ‘फ़सह का मेमना’ प्रसंगानुकूल है; अस्पष्ट कर्ता को हिन्दी में ‘लोग’ से व्यक्त किया गया है।
- source_word: λέγουσιν
  choice: ने ... कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में सामान्य भूतकाल से व्यक्त किया गया है।
- source_word: Ποῦ θέλεις
  choice: तू कहाँ चाहता है
  rationale: θέλω यहाँ इच्छा या अभिप्राय व्यक्त करता है। ‘चाहता है’ आधुनिक और सीधा हिन्दी समतुल्य है।
- source_word: ἀπελθόντες ἑτοιμάσωμεν
  choice: कि हम जाकर तैयारी करें
  rationale: पूर्वकालिक कृदन्त ἀπελθόντες को हिन्दी में ‘जाकर’ से और मुख्य क्रिया को ‘तैयारी करें’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: ἵνα φάγῃς τὸ πάσχα
  choice: ताकि तू फ़सह का भोजन खाए
  rationale: ἵνα का प्रयोजन-संबंध ‘ताकि’ से स्पष्ट होता है। यहाँ πάσχα खाने के संदर्भ में भोजन को सूचित करता है; ‘फ़सह का भोजन’ हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: पद में πάσχα के दोनों प्रयोगों का संदर्भ
  choice: पहले प्रयोग में ‘फ़सह का मेमना’ और दूसरे में ‘फ़सह का भोजन’
  alternative: दोनों स्थानों पर केवल ‘फ़सह’, अथवा दोनों स्थानों पर ‘फ़सह का मेमना’
  rationale: 'अर्थ निकटवर्ती क्रियाओं से निर्धारित होता है: θύω के साथ बलि का पशु और φάγῃς के साथ फ़सह का भोजन अभिप्रेत है। यह प्रसंगाधारित शब्दार्थ है, किसी सामंजस्यकारी धार्मिक निष्कर्ष का आरोपण नहीं।'
- issue: शिष्यों द्वारा यीशु के लिए एकवचन संबोधन
  choice: ‘तू ... खाए’
  alternative: आदरार्थी ‘आप ... खाएँ’
  rationale: यूनानी में दूसरा पुरुष एकवचन है और कोई अलग आदरसूचक सर्वनाम नहीं। बाइबिलीय हिन्दी की प्रतिष्ठित, निकट संबोधन-शैली में ‘तू’ मूल की व्याकरणिक संख्या को बनाए रखता है; इसका उद्देश्य अनादर व्यक्त करना नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली रखी गई है। ‘अख़मीरी रोटी’ और ‘फ़सह’ प्रचलित बाइबिलीय शब्द हैं। मुख्य पाठ में आवश्यक प्रसंगगत स्पष्टता दी गई है, जबकि यूनानी πάσχα की संक्षिप्तता और वैकल्पिक शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
