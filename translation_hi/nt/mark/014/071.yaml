base_translation:
  language: en
  yaml_path: translation/nt/mark/014/071.yaml
  text: But he began to call down curses and to swear[a], “I do not know this man you are talking about.”
translation:
  language: hi
  text: पर वह शाप देने और शपथ खाने लगा[a], “मैं इस मनुष्य को नहीं जानता, जिसकी तुम बात कर रहे हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शाप देने’ का अर्थ ‘शाप बुलाना’ भी हो सकता है; सम्भवतः ‘अपने ऊपर शाप बुलाना।’ यूनानी पाठ यह स्पष्ट नहीं करता कि शाप किस पर था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: पर वह
  rationale: δέ पिछले आरोप के प्रति हल्का विरोध और कथा में बढ़ती तीव्रता दिखाता है; ‘पर वह’ स्वाभाविक हिन्दी है।
- source_word: ἤρξατο
  choice: लगा
  rationale: पूरक क्रियाओं के साथ आरम्भिक अर्थ को हिन्दी की स्वाभाविक संयुक्त रचना ‘करने लगा’ से व्यक्त किया गया है।
- source_word: ἀναθεματίζειν
  choice: शाप देने
  rationale: यह केवल अपशब्द बोलने के बजाय शाप का आह्वान करने का भाव रखता है। यूनानी पाठ शाप का लक्ष्य नहीं बताता, इसलिए मुख्य पाठ में ‘अपने आपको’ या किसी अन्य लक्ष्य को नहीं जोड़ा गया।
- source_word: ὀμνύναι
  choice: शपथ खाकर कहने
  rationale: क्रिया औपचारिक शपथ लेने को व्यक्त करती है; हिन्दी में उद्धृत कथन के साथ यह रचना स्पष्ट और स्वाभाविक है।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण
  rationale: यहाँ ὅτι पतरस की शपथ और इनकार की विषय-वस्तु प्रस्तुत करता है, जिसे हिन्दी में प्रत्यक्ष कथन के रूप में स्वाभाविक ढंग से रखा गया है।
- source_word: Οὐκ οἶδα
  choice: मैं ... नहीं जानता
  rationale: यह यूनानी के सामान्य अर्थ और पतरस के इनकार की तीक्ष्णता को सीधे बनाए रखता है।
- source_word: τὸν ἄνθρωπον τοῦτον
  choice: इस मनुष्य को
  rationale: ‘इस’ से τοῦτον का संकेतवाचक बल सुरक्षित रहता है; ‘मनुष्य’ मूल के ἄνθρωπον के अनुरूप गरिमापूर्ण और तटस्थ है।
- source_word: ὃν λέγετε
  choice: जिसकी तुम बात कर रहे हो
  rationale: यह आधुनिक हिन्दी में स्वाभाविक रूप से उन लोगों द्वारा उल्लेख किए जा रहे व्यक्ति को दर्शाता है।
theological_decisions:
- issue: ἀναθεματίζειν में पतरस के शाप का स्वरूप और लक्ष्य
  choice: शाप देने की क्रिया व्यक्त की गई है, पर शाप का लक्ष्य निर्दिष्ट नहीं किया गया।
  alternative: ‘शाप देने लगा’; सम्भवतः ‘अपने ऊपर शाप बुलाने लगा।’
  rationale: शपथ के प्रसंग में यह क्रिया आत्म-शाप का संकेत दे सकती है, लेकिन यूनानी पाठ स्पष्ट रूप से ‘अपने ऊपर’ नहीं कहता। अतः अनिश्चितता को मुख्य पाठ और पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘शपथ खाकर कहने लगा’ सामान्य पाठक के लिए अर्थ खोलता है, जबकि ‘इस मनुष्य’ मूल पाठ के संकेतवाचक और तटस्थ स्वर को बनाए रखता है।
