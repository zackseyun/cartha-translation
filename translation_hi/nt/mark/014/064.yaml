  text: ἠκούσατε τῆς βλασφημίας· τί ὑμῖν φαίνεται; οἱ δὲ πάντες κατέκριναν αὐτὸν ⸂ἔνοχον εἶναι⸃ θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/064.yaml
  text: You have heard the blasphemy[b][a]. What does it seem to you? And they all condemned him as deserving death.
translation:
  language: hi
  text: “तुमने ईशनिंदा सुनी है। तुम्हें क्या लगता है?”[a] और उन सबने उसे मृत्युदण्ड के योग्य ठहराया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक मुहावरेदार ढंग से, “तुम्हारा क्या विचार है?”
    reason: lexical_alternative
  - marker: b
    text: या “उसे मृत्यु के लिए दोषी ठहराया,” “उसे मृत्यु के दण्ड का भागी ठहराया,” अथवा “उसे मृत्युदण्ड का अधिकारी ठहराया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠκούσατε
  choice: तुम लोगों ने ... सुन ली है
  rationale: अओरिस्ट यहाँ अभी-अभी सुनी गई बात की ओर संकेत करता है; हिन्दी का पूर्ण वर्तमान इस तात्कालिक प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῆς βλασφημίας
  choice: परमेश्वर की निन्दा
  rationale: यह अभिव्यक्ति आरोप के धार्मिक और न्यायिक भार को स्पष्ट रखती है। यह महासभा के आरोप को प्रस्तुत करती है, कथावाचक की ओर से उस आरोप को सही नहीं ठहराती।
- source_word: τί ὑμῖν φαίνεται
  choice: तुम्हें क्या लगता है?
  rationale: यह यूनानी वाक्य के रूप के निकट रहते हुए हिन्दी में सहज है और प्रसंग में उनकी राय अथवा निर्णय पूछता है।
- source_word: οἱ δὲ πάντες
  choice: तब उन सबने
  rationale: ‘उन सबने’ πάντες द्वारा रेखांकित सर्वसम्मति को बनाए रखता है; ‘तब’ संवाद के अगले घटनाक्रम को स्वाभाविक रूप से जोड़ता है।
- source_word: κατέκριναν
  choice: ठहराया
  rationale: ἔνοχον εἶναι θανάτου के साथ मिलकर यह दोषनिर्णय व्यक्त करता है; पूरा हिन्दी वाक्यांश न्यायिक निन्दा और दण्ड-योग्यता दोनों को संप्रेषित करता है।
- source_word: ἔνοχον εἶναι θανάτου
  choice: मृत्युदण्ड के योग्य
  rationale: यह स्पष्ट आधुनिक हिन्दी में बताता है कि उन्होंने उसे मृत्यु का दण्ड पाने योग्य अथवा उसके अधीन माना।
theological_decisions:
- issue: मुकदमे के प्रसंग में βλασφημία का अनुवाद
  choice: परमेश्वर की निन्दा
  alternative: निन्दा; ईशनिन्दा
  rationale: चुना हुआ रूप साधारण पाठक के लिए स्पष्ट रहते हुए आरोप की धार्मिक गंभीरता बनाए रखता है। यह यीशु के कथन पर महासभा का आरोप है, इसलिए अनुवाद उसके न्यायसंगत होने का निर्णय स्वयं नहीं देता।
- issue: ἔνοχον εἶναι θανάτου में दोष और दण्ड-योग्यता का सम्बन्ध
  choice: मृत्युदण्ड के योग्य ठहराया
  alternative: मृत्यु का दोषी ठहराया; मृत्युदण्ड का भागी ठहराया
  rationale: चुना हुआ रूप आधुनिक हिन्दी में न्यायिक आशय को स्पष्ट करता है, पर यह तय नहीं करता कि वाक्यांश का मुख्य बल नैतिक योग्यता, कानूनी दायित्व या दण्डादेश में से किस पर है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ईशनिन्दा’ की अपेक्षा ‘परमेश्वर की निन्दा’ अधिक पारदर्शी है। न्यायिक प्रसंग को स्पष्ट करने के लिए ‘मृत्युदण्ड’ रखा गया है, जबकि वैकल्पिक शाब्दिक रूप पादटिप्पणी में दिए गए हैं।
