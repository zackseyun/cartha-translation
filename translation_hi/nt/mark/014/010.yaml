  text: ⸀Καὶ Ἰούδας ⸂Ἰσκαριὼθ ὁ⸃ εἷς τῶν δώδεκα ἀπῆλθεν πρὸς τοὺς ἀρχιερεῖς ἵνα αὐτὸν ⸂παραδοῖ αὐτοῖς⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/010.yaml
  text: And Judas Iscariot[a], one of the Twelve, went to the chief priests in order to hand him over to them.
translation:
  language: hi
  text: और यहूदा इस्करियोती, उन बारहों में से एक, प्रधान याजकों के पास गया, ताकि यीशु को उनके हवाले कर दे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “यीशु के साथ विश्वासघात करके उसे उनके हाथ सौंप दे” भी हो सकता है। यूनानी क्रिया का अर्थ “हवाले करना” है, और यहूदा के मामले में यह कार्य विश्वासघात था।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: तब
  rationale: यह सामान्य कथात्मक संयोजक है। प्रसंग में ‘तब’ पूर्ववर्ती घटना से स्वाभाविक संबंध बनाता है, बिना अतिरिक्त कारणात्मक अर्थ जोड़े।
- source_word: Ἰούδας Ἰσκαριὼθ
  choice: यहूदा इस्करियोती
  rationale: व्यक्तिनाम और उपनाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: ὁ εἷς τῶν δώδεκα
  choice: जो उन बारहों में से एक था
  rationale: यह यीशु के स्थापित बारह शिष्यों के समूह को सूचित करता है; ‘उन बारहों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀπῆλθεν
  choice: गया
  rationale: सरल कथात्मक भूतकाल की गति को सहज हिन्दी में व्यक्त करता है; ‘चला गया’ अनावश्यक रूप से अलगाव पर बल दे सकता है।
- source_word: πρὸς τοὺς ἀρχιερεῖς
  choice: प्रधान याजकों के पास
  rationale: बहुवचन पद यरूशलेम के प्रमुख याजकीय नेतृत्व को दर्शाता है; ‘प्रधान याजक’ इसका प्रचलित और संस्थागत हिन्दी रूप है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: παραδοῖ
  choice: हवाले कर दे
  rationale: यह παραδίδωμι के व्यापक ‘सौंप देना/हवाले करना’ अर्थ को रखता है और मुख्य पाठ में तुरंत ‘विश्वासघात’ कहकर उसके अर्थ को संकीर्ण नहीं करता।
- source_word: αὐτὸν ... αὐτοῖς
  choice: यीशु को उनके
  rationale: यूनानी सर्वनामों के संदर्भ को हिन्दी में स्पष्ट करने के लिए ‘उसे’ के स्थान पर ‘यीशु को’ रखा गया है; ‘उनके’ प्रधान याजकों की ओर संकेत करता है।
theological_decisions:
- issue: विश्वासघात के प्रसंग में παραδοῖ का अनुवाद
  choice: हवाले कर दे
  alternative: उनके साथ विश्वासघात करके उसे उनके हाथ सौंप दे
  rationale: यह क्रिया मूलतः किसी को सौंपने या हवाले करने का अर्थ रखती है। यहूदा के कार्य में विश्वासघात निहित है, पर मुख्य पाठ में ‘हवाले करना’ रखने से दुःखभोग-वृत्तांत में इस क्रिया की व्यापक पुनरावृत्ति और नैतिक तनाव दोनों सुरक्षित रहते हैं; विश्वासघात का भाव पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘प्रधान याजक’, ‘उन बारहों’ और ‘हवाले कर दे’ जैसे रूप सामान्य पाठक के लिए परिचित हैं। स्पष्टता के लिए αὐτόν को ‘यीशु को’ किया गया है।
