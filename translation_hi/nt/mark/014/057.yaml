  yaml_path: translation/nt/mark/014/057.yaml
  text: And some stood up and were giving false testimony against him[a], saying,
translation:
  language: hi
  text: 'और कुछ लोग खड़े हुए और उसके विरुद्ध झूठी गवाही देने लगे, और कहने लगे:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καί
  choice: तब
  rationale: यह सामान्य कथात्मक संयोजक है। हिन्दी में प्रसंग की अगली कार्रवाई आरम्भ करने के लिए ‘तब’ स्वाभाविक है, बिना किसी प्रबल तार्किक संबंध को जोड़े।
- source_word: τινες
  choice: कुछ लोगों ने
  rationale: अनिश्चित बहुवचन को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀναστάντες
  choice: खड़े होकर
  rationale: अदालती-जैसी सुनवाई में गवाही देने के लिए उठकर खड़े होने की सहायक क्रिया को ठीक प्रकार व्यक्त करता है।
- source_word: ἐψευδομαρτύρουν
  choice: झूठी गवाही दी
  rationale: क्रिया के न्यायिक अर्थ को सरल आधुनिक हिन्दी में स्पष्ट करता है। यूनानी अपूर्णकाल जारी या बार-बार होने वाली कार्रवाई का संकेत दे सकता है, पर हिन्दी में इसी प्रसंग में ‘गवाही दी’ अधिक स्वाभाविक है।
- source_word: κατ’ αὐτοῦ
  choice: उसके विरुद्ध
  rationale: κατά के संबंधकारक के साथ यहाँ विरोधात्मक और न्यायिक भाव को सुरक्षित रखता है।
- source_word: λέγοντες
  choice: और कहा,
  rationale: अगले पद में आने वाली गवाही की विषय-वस्तु का स्वाभाविक हिन्दी परिचय देता है।
