    reason: lexical_alternative
  revision_rationale: The revision retains the narrative connective, the unspecified group, their standing up, the hostile legal sense of testimony against him, and the transition to the quoted testimony. ‘देने लगे’ better communicates the Greek imperfect in idiomatic Hindi; ‘कहने लगे:’ keeps the ongoing narrative lead-in to the next verse.
