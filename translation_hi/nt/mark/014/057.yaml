  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘झूठी गवाही’ सामान्य पाठक के लिए स्पष्ट न्यायिक अभिव्यक्ति है; फुटनोट पारंपरिक बाइबलीय शब्दावली ‘झूठी साक्षी’ सुरक्षित रखता है।
