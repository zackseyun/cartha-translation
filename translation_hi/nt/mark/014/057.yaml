revisions:
- from: तब कुछ लोगों ने खड़े होकर उसके विरुद्ध झूठी गवाही दी[a] और कहा,
  to: 'और कुछ लोग खड़े हुए और उसके विरुद्ध झूठी गवाही देने लगे, और कहने लगे:'
  rationale: The revision retains the narrative connective, the unspecified group, their standing up, the hostile legal sense of testimony against him, and the transition to the quoted testimony. ‘देने लगे’ better communicates the Greek imperfect in idiomatic Hindi; ‘कहने लगे:’ keeps the ongoing narrative lead-in to the next verse.
