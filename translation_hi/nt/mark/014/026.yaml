  text: And after singing a hymn[a], they went out to the Mount of Olives.
translation:
  language: hi
  text: और भजन गाने के बाद[a] वे जैतून पर्वत की ओर निकल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “भजन गाकर।” यूनानी कृदंत बताता है कि यह काम उनके निकलने से पहले हुआ।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ यूनानी के सरल समन्वय को बिना अतिरिक्त अर्थ जोड़े बनाए रखता है।
- source_word: ὑμνήσαντες
  choice: भजन गाने के बाद
  rationale: ὑμνέω का यह एओरिस्ट कृदंत स्तुति-गीत गाने को व्यक्त करता है और मुख्य क्रिया से पहले हुई कार्रवाई दिखाता है। ‘भजन गाने के बाद’ आधुनिक हिन्दी में स्वाभाविक है और संभावित उपासना-संबंधी भाव बनाए रखता है।
- source_word: ἐξῆλθον
  choice: वे ... निकल गए
  rationale: ἐξέρχομαι का सीधा कथात्मक अर्थ ‘बाहर जाना/निकलना’ है। प्रसंग में ‘निकल गए’ स्वाभाविक हिन्दी है।
- source_word: εἰς
  choice: की ओर
  rationale: गंतव्य के साथ εἰς दिशा या गमन को दर्शाता है। हिन्दी में इस स्थान की ओर जाने के लिए ‘की ओर’ सहज है और अनावश्यक रूप से यह नहीं बताता कि वे पर्वत के भीतर गए।
- source_word: τὸ Ὄρος τῶν Ἐλαιῶν
  choice: जैतून पर्वत
  rationale: यह उक्त भौगोलिक स्थान का प्रचलित और स्पष्ट हिन्दी नाम है; ‘पर्वत’ ὄρος और ‘जैतून’ उसके संबंधवाचक नाम को व्यक्त करता है।
