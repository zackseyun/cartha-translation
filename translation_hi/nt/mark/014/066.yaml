lexical_decisions:
- source_word: ὄντος τοῦ Πέτρου
  choice: जब पतरस … था
  rationale: संबंधकारक निरपेक्ष रचना और वर्तमान कृदंत को स्वाभाविक हिन्दी में समयसूचक उपवाक्य के रूप में व्यक्त किया गया है; इससे चल रही पृष्ठभूमि का भाव बना रहता है।
- source_word: κάτω
  choice: नीचे
  rationale: यह निचले स्थान को सूचित करता है और भवन के भीतर ऊपर चल रही कार्यवाही की तुलना में पतरस की स्थिति स्पष्ट करता है।
- source_word: ἐν τῇ αὐλῇ
  choice: आँगन में
  rationale: यहाँ αὐλή महायाजक के निवास के खुले भीतरी प्रांगण को दर्शाता है; आधुनिक हिन्दी में ‘आँगन’ सहज और स्पष्ट है।
- source_word: ἔρχεται
  choice: वहाँ आई
  rationale: यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथाशैली में भूतकाल से व्यक्त किया गया है। ‘वहाँ’ हिन्दी में आने की दिशा को सहज बनाता है, पर कोई नई कथात्मक सूचना नहीं जोड़ता।
- source_word: μία τῶν παιδισκῶν
  choice: दासियों में से एक
  rationale: παιδίσκη घरेलू सेवा करने वाली स्त्री या दासी को दर्शा सकता है। ‘दासी’ उसके अधीनस्थ घरेलू दर्जे को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, जबकि कानूनी स्थिति की संभावित अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: τοῦ ἀρχιερέως
  choice: महायाजक की
  rationale: संबंधकारक यहाँ महायाजक के घराने से संबंध बताता है; हिन्दी में संबंधसूचक ‘की’ स्वाभाविक है।
