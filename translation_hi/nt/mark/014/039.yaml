review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys πάλιν (‘फिर’), the withdrawal expressed by ἀπελθών, prayer, and the repeated content denoted by τὸν αὐτὸν λόγον. ‘वही बात’ appropriately renders λόγος here as the content of the prayer rather than a single literal word.
  naturalness: ‘वहाँ से दूर गया’ is understandable but somewhat stiff and unnecessarily specifies ‘from there.’ A more idiomatic narrative construction is ‘फिर दूर चला गया.’ Rendering εἰπών as ‘कहकर’ gives a natural Hindi link to the content of the prayer without materially altering the Greek participial relation.
  terminology: ‘प्रार्थना की’ is standard modern Hindi and suitable in register. ‘वही बात’ is clear, natural, and avoids the misleading implication that only one word was repeated.
