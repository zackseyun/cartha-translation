lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह क्रिया की पुनरावृत्ति दिखाता है और हिन्दी कथा-शैली में सहज है।
- source_word: ἀπελθὼν
  choice: वहाँ से दूर गया
  rationale: ἀπέρχομαι के दूर हटने के भाव और मुख्य क्रिया से पहले हुई गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσηύξατο
  choice: प्रार्थना की
  rationale: प्रσεύχομαι का मानक, स्पष्ट और प्रसंगानुकूल हिन्दी रूप है।
- source_word: τὸν αὐτὸν λόγον
  choice: वही बात
  rationale: λόγος यहाँ प्रार्थना की दोहराई गई विषयवस्तु या कथन को दर्शाता है। ‘वही बात’ यूनानी एकवचन का भाव रखते हुए आधुनिक हिन्दी में ‘वही शब्द’ से अधिक स्वाभाविक और कम भ्रामक है।
- source_word: εἰπών
  choice: कहते हुए
  rationale: यह कृदन्त प्रार्थना में कही गई विषयवस्तु को मुख्य क्रिया से जोड़ता है; ‘कहते हुए’ हिन्दी में उस संबंध को सहजता से व्यक्त करता है।
