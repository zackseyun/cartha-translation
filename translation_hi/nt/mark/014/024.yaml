  text: καὶ εἶπεν αὐτοῖς· Τοῦτό ἐστιν τὸ αἷμά μου ⸀τῆς διαθήκης τὸ ⸂ἐκχυννόμενον ὑπὲρ πολλῶν⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/024.yaml
  text: And he said to them[a], “This is my blood of the covenant[c][b], which is poured out for many.”
translation:
  language: hi
  text: और उसने उनसे कहा, “यह वाचा का मेरा लहू है,[a] जो बहुतों के लिए[b] उंडेला जा रहा है।[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “नई वाचा का मेरा लहू” है; समानांतर अंशों में भी “नई वाचा” की भाषा मिलती है। यहाँ मरकुस का यूनानी पाठ सम्भवतः केवल “वाचा का मेरा लहू” है।
    reason: textual_variant
  - marker: b
    text: या “बहुतों के हित में।”
    reason: lexical_alternative
  - marker: c
    text: या “जो उंडेला जाता है”; परंपरागत रूप से, “जो बहाया जाता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοῦτό ἐστιν
  choice: यह ... है
  rationale: यूनानी के सीधे संबंधसूचक कथन को बनाए रखता है और ‘इसका अर्थ है’ या ‘यह दर्शाता है’ जैसी व्याख्या नहीं जोड़ता।
- source_word: τὸ αἷμά μου
  choice: मेरा लहू
  rationale: ‘लहू’ वाचा और बलिदान की स्पष्ट बिंबावली को बनाए रखता है; इसे ‘मृत्यु’ कहकर अर्थ-विस्तार नहीं किया गया।
- source_word: τῆς διαθήκης
  choice: वाचा का
  rationale: निर्गमन 24:8 की पृष्ठभूमि में διαθήκη का अर्थ ‘वाचा’ है। स्रोत-पाठ में ‘नई’ शब्द नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἐκχυννόμενον
  choice: उंडेला जा रहा है
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत का पहलू बनाए रखता है और रक्त उंडेले जाने की बलिदानी छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ πολλῶν
  choice: बहुतों के लिए
  rationale: ὑπέρ के प्रतिनिधिक अथवा हितार्थ भाव को स्वाभाविक हिन्दी में रखता है, ‘बहुतों’ को ‘सब’ में बदलकर धर्मवैज्ञानिक विवाद का समाधान नहीं करता।
theological_decisions:
- issue: διαθήκη का वाचागत या वसीयतनामागत अर्थ
  choice: वाचा
  alternative: वसीयत
  rationale: अंतिम भोज और लहू की भाषा निर्गमन 24:8 में वाचा स्थापित किए जाने की ओर संकेत करती है; यहाँ ‘वसीयत’ संदर्भानुकूल नहीं है।
- issue: ‘वाचा’ से पहले ‘नई’ जोड़ना
  choice: वाचा का
  alternative: नई वाचा का
  rationale: दिए गए SBLGNT पाठ में καινῆς (‘नई’) नहीं है। समानांतर परंपरा या कुछ पांडुलिपियों के आधार पर मुख्य पाठ का सामंजस्य नहीं किया गया; पाठांतर को पादटिप्पणी में रखा गया है।
- issue: ὑπὲρ πολλῶν और प्रायश्चित का विस्तार
  choice: बहुतों के लिए
  alternative: सबके लिए; बहुतों की ओर से
  rationale: यीशु के कथन में ‘बहुतों’ को यथावत रखा गया है। अनुवाद व्यापक धर्मवैज्ञानिक बहस का निष्कर्ष आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लहू’ बाइबलीय वाचा-और-बलिदान की छवि को ‘खून’ की अपेक्षा अधिक स्वाभाविक धार्मिक गरिमा के साथ रखता है। ‘उंडेला जा रहा है’ यूनानी वर्तमान कृदंत को स्पष्ट करता है। पादटिप्पणी-चिह्न उसी पदांश के पास रखे गए हैं जिससे वे संबंधित हैं।
