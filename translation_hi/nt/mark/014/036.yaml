  text: καὶ ἔλεγεν· Αββα ὁ πατήρ, πάντα δυνατά σοι· παρένεγκε τὸ ποτήριον ⸂τοῦτο ἀπ’ ἐμοῦ⸃· ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/036.yaml
  text: And he was saying[a], “Abba, Father, all things are possible for you. Take this cup away from me. Yet not what I will[c][b], but what you will.”
translation:
  language: hi
  text: और वह कह रहा था[a], “अब्बा, पिता[b], आपके लिए सब कुछ संभव है। यह प्याला[c] मुझसे दूर कर दीजिए। फिर भी, वह नहीं जो मैं चाहता हूँ, बल्कि वह जो आप चाहते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने कहा।” यूनानी अपूर्ण काल लगातार या बार-बार कहे जाने का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अब्बा” पिता के लिए अरामी सम्बोधन है; मूल पाठ में इसके साथ यूनानी शब्द “पिता” भी रखा गया है।
    reason: cultural_note
  - marker: c
    text: “प्याला” यहाँ यीशु के लिए ठहराए गए दुःख का बाइबिलीय रूपक है; मरकुस 10:38 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: ἔλεγεν
  choice: कह रहा था
  rationale: अपूर्ण काल की जारी या दोहराई जाती क्रिया को व्यक्त करता है; सरल भूतकाल ‘कहा’ भी सम्भव है।
- source_word: Αββα ὁ πατήρ
  choice: अब्बा, पिता
  rationale: अरामी सम्बोधन ‘अब्बा’ को बनाए रखता है और उसके साथ आए यूनानी सम्बोधन का स्वाभाविक हिन्दी रूप ‘पिता’ देता है; ‘मेरे’ शब्द को नहीं जोड़ा गया।
- source_word: πάντα δυνατά σοι
  choice: आपके लिए सब कुछ सम्भव है
  rationale: समग्र अर्थ और परमेश्वर से आदरपूर्ण प्रत्यक्ष सम्बोधन, दोनों को सहज आधुनिक हिन्दी में रखता है।
- source_word: παρένεγκε τὸ ποτήριον τοῦτο ἀπ’ ἐμοῦ
  choice: यह प्याला मुझसे दूर कर दीजिए
  rationale: आज्ञार्थक विनती और ‘प्याले’ के रूपक को बनाए रखते हुए παραφέρω तथा ἀπ’ ἐμοῦ की दिशा-सूचक शक्ति व्यक्त करता है।
- source_word: ἀλλ’ οὐ τί ἐγὼ θέλω ἀλλὰ τί σύ
  choice: फिर भी, जो मैं चाहता हूँ वह नहीं, बल्कि जो आप चाहते हैं वही हो
  rationale: यूनानी में अन्तिम क्रिया निहित है; हिन्दी में ‘वही हो’ जोड़ने से प्रार्थना स्वाभाविक और स्पष्ट बनती है, जबकि यीशु और पिता की इच्छाओं के बीच व्यक्त तनाव बना रहता है।
theological_decisions:
- issue: परमेश्वर के लिए अरामी और यूनानी दोनों सम्बोधनों का अनुवाद
  choice: अब्बा, पिता
  alternative: अब्बा, मेरे पिता
  rationale: मूल पाठ दोनों रूपों को साथ रखता है, पर इस पद में ‘मेरे’ स्पष्ट रूप से नहीं है; इसलिए आत्मीय सम्बोधन को सुरक्षित रखते हुए अतिरिक्त स्वामित्वसूचक शब्द नहीं जोड़ा गया।
- issue: ‘प्याले’ का रूपक
  choice: यह प्याला
  alternative: यह दुःख
  rationale: रूपक को उसकी बाइबिलीय और धर्मवैचारिक प्रतिध्वनि सहित बनाए रखा गया है; उसे सीधे ‘दुःख’ कहकर व्याख्यायित नहीं किया गया।
- issue: अन्तिम विरोधात्मक वाक्य में निहित क्रिया
  choice: वही हो
  alternative: जो आप चाहते हैं
  rationale: यूनानी वाक्य में क्रिया निहित है। हिन्दी में ‘वही हो’ प्रार्थना का आशय स्पष्ट करता है, पर पिता की इच्छा की विषयवस्तु को निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए आदरपूर्ण ‘आप’; भाषा सरल, गरिमापूर्ण और मौखिक प्रार्थना के अनुकूल है। ‘सम्भव’ की मानक वर्तनी और ‘कर दीजिए’ विनम्र निवेदन को व्यक्त करते हैं।
