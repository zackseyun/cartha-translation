lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह यीशु की पिछली भविष्यवाणी के प्रति पतरस के विरोधपूर्ण उत्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔφη αὐτῷ
  choice: उससे कहा
  rationale: सामान्य कथात्मक क्रिया और यूनानी सर्वनाम, दोनों को बनाए रखता है; संदर्भ में ‘उससे’ यीशु को सूचित करता है।
- source_word: Εἰ καὶ
  choice: चाहे
  rationale: शर्त के साथ रियायत का भाव स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: πάντες
  choice: सब
  rationale: संदर्भ में सभी शिष्यों को समेटने वाली यूनानी अभिव्यक्ति का संक्षिप्त और स्वाभाविक रूप है।
- source_word: σκανδαλισθήσονται
  choice: ठोकर खाकर गिर जाएँ
  rationale: σκανδαλίζω की ठोकर खाने की मूल छवि और इस प्रसंग में यीशु का साथ छोड़ देने जैसी गंभीर विफलता—दोनों को सामने रखता है, बिना इसे अंतिम धर्मत्याग के रूप में निश्चित किए।
- source_word: ἀλλ’ οὐκ ἐγώ
  choice: पर मैं नहीं
  rationale: यूनानी की संक्षिप्त, दीर्घवृत्तीय और ‘मैं’ पर बल देने वाली विरोधात्मक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: शिष्यत्व की विफलता के संदर्भ में σκανδαλισθήσονται का अर्थ
  choice: ठोकर खाकर गिर जाएँ
  alternative: भटक जाएँ; मेरा साथ छोड़ दें; ठोकर खाएँ
  rationale: चुना हुआ अनुवाद ठोकर की रूपकात्मक छवि तथा गंभीर विफलता दोनों को सुरक्षित रखता है। यह प्रसंगानुसार साथ छोड़ने की ओर संकेत करता है, पर स्थायी धर्मत्याग का निष्कर्ष अनुवाद में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक संवाद में स्वाभाविक। ‘ठोकर खाकर गिर जाएँ’ मूल रूपक और प्रसंगगत गंभीरता के बीच संतुलन रखता है।
