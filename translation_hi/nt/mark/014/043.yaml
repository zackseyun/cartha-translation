source:
  edition: SBLGNT
  text: Καὶ ⸀εὐθὺς ἔτι αὐτοῦ λαλοῦντος παραγίνεται ⸀Ἰούδας ⸀εἷς τῶν δώδεκα καὶ μετ’ αὐτοῦ ⸀ὄχλος μετὰ μαχαιρῶν καὶ ξύλων παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/043.yaml
  text: And immediately[a], while he was still speaking, Judas arrived, one of the Twelve, and with him a crowd with swords and clubs[d][c][b], from the chief priests and the scribes and the elders.
translation:
  language: hi
  text: और तुरन्त[a], जब वह अभी बोल ही रहा था, यहूदा आ पहुँचा—जो उन बारह में से एक था—और उसके साथ तलवारें और लाठियाँ[c] लिए एक भीड़[b] थी, जो प्रधान याजकों, शास्त्रियों और बुज़ुर्गों की ओर से[d] आई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसी क्षण’। यूनानी में ‘आ पहुँचा’ के लिए क्रिया ऐतिहासिक वर्तमान (‘आ पहुँचता है’) में है, जो वर्णन को जीवंत बनाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जनसमूह’; मूल यूनानी शब्द का सामान्य अर्थ ‘भीड़’ है, यद्यपि यहाँ उसका उद्देश्य शत्रुतापूर्ण है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ ‘लकड़ी की वस्तुएँ’ है; यहाँ आशय हथियार के रूप में इस्तेमाल होने वाली लाठियों या डंडों से है।
    reason: lexical_alternative
  - marker: d
    text: या ‘प्रधान याजकों, शास्त्रियों और बुज़ुर्गों से’; भाव यह हो सकता है कि भीड़ उनके अधिकार से भेजी गई थी, पर यूनानी में केवल उनके साथ स्रोत या अधिकार का संबंध व्यक्त किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की कथा में घटना की आकस्मिकता और तीव्रता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἔτι αὐτοῦ λαλοῦντος
  choice: जब वह अभी बोल ही रहा था
  rationale: समकालिक क्रिया और ἔτι के ‘अभी भी’ वाले बल को सहज हिन्दी में सुरक्षित रखता है।
- source_word: παραγίνεται
  choice: आ पहुँचा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी कथन में स्वाभाविक भूतकाल से व्यक्त करते हुए घटनास्थल पर आने का भाव देता है।
- source_word: Ἰούδας
  choice: यहूदा
  rationale: नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: εἷς τῶν δώδεκα
  choice: उन बारह में से एक
  rationale: मूल के संक्षिप्त और विशिष्ट समूह-सूचक पद को बिना ‘चेले’ जोड़कर सुरक्षित रखता है।
- source_word: ὄχλος
  choice: एक भीड़
  rationale: मूल शब्द का सामान्य अर्थ ‘भीड़’ है; प्रसंग उसकी शत्रुता स्वयं स्पष्ट करता है, इसलिए ‘उपद्रवी दल’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: तलवारें और लाठियाँ लिए
  rationale: μάχαιραι के लिए ‘तलवारें’ और हथियार के रूप में प्रयुक्त ξύλα के लिए स्वाभाविक ‘लाठियाँ’ चुना गया है।
- source_word: παρὰ τῶν ἀρχιερέων καὶ τῶν γραμματέων καὶ τῶν πρεσβυτέρων
  choice: प्रधान याजकों, शास्त्रियों और पुरनियों की ओर से
  rationale: παρά के स्रोत अथवा अधिकार-संबंधी भाव को व्यक्त करता है, पर स्पष्ट रूप से ‘भेजी गई’ कहकर प्रेषण की प्रक्रिया नहीं जोड़ता।
- source_word: ἀρχιερέων
  choice: प्रधान याजकों
  rationale: यह बहुवचन तत्कालीन प्रधान-याजकीय नेतृत्व वर्ग का द्योतक है; हिन्दी में स्थापित सीधा समतुल्य है।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: यह सीधा और प्रचलित हिन्दी समतुल्य है, जबकि ‘व्यवस्था के शिक्षक’ अधिक व्याख्यात्मक होता।
- source_word: πρεσβυτέρων
  choice: पुरनियों
  rationale: इस संस्थागत प्रसंग में मान्य यहूदी अगुओं के लिए प्रचलित बाइबलीय हिन्दी पद, जो केवल आयु नहीं बल्कि पदगत पहचान भी बताता है।
theological_decisions:
- issue: παραγίνεται का ऐतिहासिक वर्तमान
  choice: हिन्दी कथा में ‘आ पहुँचा’ भूतकाल
  alternative: मूल की जीवंतता को हूबहू रखते हुए ‘आ पहुँचता है’
  rationale: आधुनिक हिन्दी के इस भूतकालीन कथा-प्रसंग में ‘आ पहुँचा’ अधिक स्वाभाविक है और आगमन की आकस्मिकता बनाए रखता है।
- issue: अधिकारियों के साथ παρά का संबंध
  choice: ‘की ओर से’
  alternative: ‘के द्वारा भेजी हुई’ अथवा अधिक शाब्दिक ‘के पास से’
  rationale: मूल भीड़ के स्रोत या प्राधिकरण-संबंध को बताता है, लेकिन भेजे जाने की विधि स्पष्ट नहीं करता; ‘की ओर से’ इस तनाव को अपेक्षाकृत सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘उन बारह’ समूह की विशिष्ट पहचान बनाए रखता है। ‘पुरनियों’ को संस्थागत धार्मिक-सामाजिक पद के प्रचलित हिन्दी रूप के कारण चुना गया है। सभी पाठ-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
