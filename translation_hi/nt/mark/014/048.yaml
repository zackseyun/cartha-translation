  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν αὐτοῖς· Ὡς ἐπὶ λῃστὴν ἐξήλθατε μετὰ μαχαιρῶν καὶ ξύλων συλλαβεῖν με;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/048.yaml
  text: And Jesus answered and said to them[a], “Have you come out as against a robber, with swords and clubs, to arrest me?”
translation:
  language: hi
  text: तब यीशु ने उनसे कहा, “क्या तुम मुझे डाकू[a] समझकर तलवारें और लाठियाँ लेकर पकड़ने निकले हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हिंसक लुटेरा” अथवा “विद्रोही”; यूनानी शब्द ऐसे गिरोहबंद अपराधी या बाग़ी के लिए भी प्रयुक्त हो सकता है, केवल चोर के लिए नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν
  choice: तब यीशु ने उनसे कहा
  rationale: यह यूनानी कथात्मक सूत्र वाणी का आरम्भ कराता है। हिन्दी में ‘उत्तर देकर कहा’ यहाँ अस्वाभाविक है, क्योंकि कोई स्पष्ट प्रश्न नहीं पूछा गया; ‘कहा’ उसके प्रत्युत्तरात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ὡς ἐπὶ λῃστὴν
  choice: डाकू समझकर
  rationale: यह वाक्यांश बताता है कि हथियारबंद दल यीशु के साथ ऐसे व्यवहार कर रहा था मानो वह कोई खतरनाक डाकू हो। ‘समझकर’ हिन्दी में इस तुलना का स्वाभाविक और स्पष्ट रूप है।
- source_word: λῃστὴν
  choice: डाकू
  rationale: λῃστής साधारण चोर से अधिक हिंसक लुटेरे, गिरोहबंद अपराधी या कभी-कभी विद्रोही को सूचित कर सकता है। ‘डाकू’ मुख्य पाठ में इस बल को संक्षेप और स्वाभाविक ढंग से रखता है; व्यापक अर्थ-पहलू पादटिप्पणी में दिया गया है।
- source_word: ἐξήλθατε
  choice: निकले हो
  rationale: यह गिरफ्तारी के लिए दल बनाकर बाहर आने की क्रिया को व्यक्त करता है और प्रश्न के वर्तमान प्रसंग से उसका संबंध बनाए रखता है।
- source_word: μετὰ μαχαιρῶν καὶ ξύλων
  choice: तलवारें और लाठियाँ लेकर
  rationale: μάχαιρα यहाँ धारदार हथियार और ξύλον लकड़ी के प्रहारक हथियार को दर्शाते हैं। ‘तलवारें और लाठियाँ’ आधुनिक हिन्दी में दृश्य को स्पष्ट और सहज बनाता है।
- source_word: συλλαβεῖν με
  choice: मुझे ... पकड़ने
  rationale: संदर्भ औपचारिक गिरफ्तारी का है, पर क्रिया का मूल बल पकड़ने या हिरासत में लेने का है। ‘पकड़ने’ सशस्त्र कार्रवाई और सीधे संबोधन दोनों में स्वाभाविक है।
theological_decisions:
- issue: यीशु के लिए λῃστής की उपमा का अर्थ
  choice: मुख्य पाठ में ‘डाकू’, और पादटिप्पणी में ‘हिंसक लुटेरा’ अथवा ‘विद्रोही’ की सम्भावना
  alternative: लुटेरा; अपराधी; विद्रोही
  rationale: यीशु स्वयं को ऐसा नहीं ठहराते, बल्कि गिरफ्तारी करनेवालों के सशस्त्र व्यवहार पर प्रश्न उठाते हैं। λῃστής का अर्थ केवल चोरी करनेवाला नहीं है; वह हिंसक गिरोहबंद लुटेरे या विद्रोही तक का संकेत दे सकता है। पादटिप्पणी इस ऐतिहासिक और अर्थगत तनाव को बिना मुख्य पाठ पर अनावश्यक व्याख्या थोपे सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रश्न का आरोपात्मक और विस्मयपूर्ण स्वर हिन्दी की स्वाभाविक रचना ‘क्या तुम ... निकले हो?’ से व्यक्त हुआ है।
