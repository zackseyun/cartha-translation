  text: καὶ ἡ παιδίσκη ἰδοῦσα αὐτὸν ⸂ἤρξατο πάλιν⸃ λέγειν τοῖς ⸀παρεστῶσιν ὅτι Οὗτος ἐξ αὐτῶν ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/069.yaml
  text: And the servant girl[a], seeing him, began again to say to those standing nearby, “This man is one of them.”
translation:
  language: hi
  text: और उस दासी ने उसे देखकर फिर पास खड़े लोगों से कहना शुरू किया, “यह उन्हीं में से एक है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδίσκη
  choice: दासी
  rationale: यह शब्द एक युवा स्त्री सेविका अथवा दासी को दर्शाता है। ‘दासी’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है; मूल शब्द में निहित सामाजिक अधीनता को केवल सामान्य ‘लड़की’ कहकर मिटाता नहीं।
- source_word: ἰδοῦσα
  choice: उसे देखकर
  rationale: अओरिस्ट कृदंत को हिन्दी में पूर्वकालिक क्रिया के रूप में देना स्वाभाविक है और उसके बोलना शुरू करने की परिस्थिति स्पष्ट करता है।
- source_word: ἤρξατο πάλιν λέγειν
  choice: फिर ... कहना शुरू किया
  rationale: यह अनुवाद ἤρξατο के आरंभसूचक भाव और πάλιν के ‘फिर’—दोनों को सुरक्षित रखते हुए सहज हिन्दी क्रम अपनाता है।
- source_word: τοῖς παρεστῶσιν
  choice: वहाँ पास खड़े लोगों से
  rationale: यह उपस्थित अथवा निकट खड़े लोगों को सूचित करता है। यह चयन स्थानिक भाव को बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: Οὗτος
  choice: यह
  rationale: संकेतवाचक सर्वनाम सीधे पतरस की ओर संकेत करता है। हिन्दी में ‘यह’ पर्याप्त और स्वाभाविक है; ‘यह आदमी’ जोड़ना संभव है, पर आवश्यक नहीं।
- source_word: ἐξ αὐτῶν
  choice: उन्हीं में से एक है
  rationale: यह समूह-सदस्यता व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है। ‘ही’ समूह के साथ उसके संबंध की आरोपात्मक पहचान को सहज ढंग से उभारता है।
theological_decisions:
- issue: ἐξ αὐτῶν द्वारा व्यक्त समूह की पहचान
  choice: उन्हीं में से एक
  alternative: उनका साथी है
  rationale: मूल पाठ केवल उस समूह में होने या उससे संबद्ध होने की बात कहता है; ‘साथी’ संबंध की प्रकृति को अधिक निश्चित कर देता। इसलिए मूल की सामान्य समूह-सदस्यता बनाए रखी गई है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण कथात्मक हिन्दी। वाक्य में मूल यूनानी की घटनाक्रम-संरचना—देखना, फिर कहना शुरू करना, और समूह-सदस्यता का आरोप—सुरक्षित रखी गई है।
