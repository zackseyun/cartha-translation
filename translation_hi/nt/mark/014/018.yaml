  text: καὶ ἀνακειμένων αὐτῶν καὶ ἐσθιόντων ⸂ὁ Ἰησοῦς εἶπεν⸃· Ἀμὴν λέγω ὑμῖν ὅτι εἷς ἐξ ὑμῶν παραδώσει με ὁ ἐσθίων μετ’ ἐμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/018.yaml
  text: And while they were reclining and eating[a], Jesus said, “Truly I tell you[c][b], one of you will betray me—one who is eating with me.”
translation:
  language: hi
  text: जब वे टेक लगाकर भोजन कर रहे थे,[a] तब यीशु ने कहा, “मैं तुमसे सच कहता हूँ,[b] तुममें से एक—जो मेरे साथ खा रहा है—मुझे सौंप देगा।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उस समय औपचारिक भोज में लोग मेज़ के पास टेक लगाकर भोजन करते थे।
    reason: cultural_note
  - marker: b
    text: अधिक अक्षरशः, “आमीन, मैं तुमसे कहता हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “मुझे धोखे से मेरे हवाले कर देगा” या “मुझे पकड़वा देगा।” यूनानी क्रिया का अर्थ किसी को दूसरे के अधिकार में सौंपना, हवाले करना, या प्रसंगानुसार विश्वासघात करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνακειμένων
  choice: भोजन के लिए टेक लगाकर बैठे हुए
  rationale: यह क्रिया प्राचीन भूमध्यसागरीय औपचारिक भोज में मेज़ के पास टेक लगाकर भोजन करने की मुद्रा बताती है। यह अनुवाद ऐतिहासिक दृश्य को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: ἐσθιόντων / ὁ ἐσθίων
  choice: खा रहे थे / जो ... खा रहा है
  rationale: मूल क्रिया का सीधा अर्थ ‘खाना’ है। अंतिम पदबंध में निश्चित उपपद सहित कृदन्त को सम्बन्धवाचक वाक्यांश के रूप में रखा गया है।
- source_word: Ἀμὴν λέγω ὑμῖν
  choice: मैं तुमसे सच कहता हूँ
  rationale: यह यीशु की गंभीर और प्रामाणिक उद्घोषणा है। यह रूप आधुनिक हिन्दी में स्वाभाविक है और Ἀμήν की पुष्टि-सूचक शक्ति बनाए रखता है। अधिक अक्षरशः रूप पादटिप्पणी में दिया गया है।
- source_word: εἷς ἐξ ὑμῶν
  choice: तुममें से एक
  rationale: यह अंशवाचक यूनानी अभिव्यक्ति का स्वाभाविक हिन्दी रूप है और स्पष्ट करता है कि वह व्यक्ति इसी समूह का सदस्य है।
- source_word: παραδώσει
  choice: पकड़वा देगा
  rationale: παραδίδωμι का मूल भाव किसी को दूसरे के अधिकार में सौंपना है। इस प्रसंग में ‘पकड़वा देगा’ निकट साथी के विश्वासघाती रूप से यीशु को अधिकारियों के हाथ सौंपने को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘सौंप देगा’ पादटिप्पणी में सुरक्षित है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: यह साथ होने और एक ही भोजन में सहभागी होने का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दुःखभोग के प्रसंग में παραδώσει का अनुवाद
  choice: मुझे पकड़वा देगा
  alternative: मुझे सौंप देगा
  rationale: यूनानी क्रिया अपने आप में हर स्थान पर ‘विश्वासघात करना’ नहीं बताती; उसका व्यापक अर्थ ‘सौंप देना’ है। यहाँ यीशु के साथ भोजन करने वाले निकट साथी की कपटपूर्ण कार्रवाई प्रसंग से स्पष्ट है। ‘पकड़वा देगा’ उस कार्य को व्यक्त करता है, और अधिक अक्षरशः विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘टेक लगाकर बैठे हुए’ ऐतिहासिक भोजन-मुद्रा को ‘मेज़ पर बैठे’ कहकर समतल नहीं करता। वाक्य में डैश अंतिम कृदन्तीय पदबंध को स्पष्ट करता है और इस तनाव को बनाए रखता है कि विश्वासघाती उन्हीं के साथ भोजन कर रहा है।
