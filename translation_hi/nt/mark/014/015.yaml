  text: और वह स्वयं तुम्हें एक बड़ा ऊपरी कमरा दिखाएगा, जो सजा हुआ और तैयार होगा[a]; वहीं हमारे लिए तैयारी कर लेना।
  philosophy: optimal-equivalence
