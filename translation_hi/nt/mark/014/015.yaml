- source_word: αὐτὸς
  choice: वह स्वयं
  rationale: सर्वनाम का बल बनाए रखता है, न कि केवल ‘वह’।
- source_word: δείξει
  choice: दिखाएगा
  rationale: भविष्यत्काल का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: ἀνάγαιον μέγα
  choice: ऊपर का एक बड़ा कमरा
  rationale: घर के ऊपरी भाग में स्थित बड़े कमरे को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐστρωμένον
  choice: बिछा हुआ
  rationale: στρώννυμι के ‘बिछाने/सजाकर लगाने’ के ठोस अर्थ को सुरक्षित रखता है और केवल फर्नीचर होने का अर्थ नहीं थोपता।
- source_word: ἕτοιμον
  choice: तैयार
  rationale: कमरे की तत्पर अवस्था व्यक्त करता है और अगले आदेश से अर्थगत संबंध बनाए रखता है।
- source_word: ἐκεῖ
  choice: वहीं
  rationale: निर्दिष्ट कमरे की ओर स्थानसूचक बल के साथ संकेत करता है।
- source_word: ἑτοιμάσατε
  choice: तैयारी करना
  rationale: बहुवचन आदेश को प्रसंगानुकूल रूप में व्यक्त करता है; शिष्यों को फसह की व्यवस्था करनी है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: मूल के दत्तिव सर्वनाम को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
