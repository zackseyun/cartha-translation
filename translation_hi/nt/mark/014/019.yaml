base_translation:
  language: en
  yaml_path: translation/nt/mark/014/019.yaml
  text: They began to be grieved and to say to him[a], one by one, “Surely not I?”
translation:
  language: hi
  text: वे दुःखी होने लगे और एक-एक करके उससे कहने लगे, “निश्चय ही मैं तो नहीं?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “क्या मैं नहीं?” यूनानी प्रश्न में μήτι का प्रयोग है, जो नकारात्मक उत्तर की अपेक्षा दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντο
  choice: लगे
  rationale: पूरक क्रियाओं के साथ यह क्रिया कार्य के आरम्भ को दर्शाती है; हिन्दी में ‘होने लगे’ और ‘कहने लगे’ स्वाभाविक रूप से यही भाव व्यक्त करते हैं।
- source_word: λυπεῖσθαι
  choice: दुःखी होने
  rationale: यह रूप शोक या मनोव्यथा की अवस्था में आने का भाव देता है; ‘दुःखी होने’ गंभीर प्रसंग के अनुकूल और सामान्य हिन्दी में स्पष्ट है।
- source_word: καὶ λέγειν
  choice: और ... कहने
  rationale: λέγω का मूल अर्थ ‘कहना’ है। कथन प्रश्नात्मक होने पर भी ‘पूछना’ की अपेक्षा ‘कहना’ स्रोत की शब्दावली के अधिक निकट है।
- source_word: αὐτῷ
  choice: उससे
  rationale: यूनानी पाठ में यीशु के लिए सर्वनाम है; ‘उससे’ उसी संवादात्मक रूप को बनाए रखता है और अनावश्यक स्पष्टता नहीं जोड़ता।
- source_word: εἷς κατὰ εἷς
  choice: एक-एक करके
  rationale: यह वितरणात्मक पद बताता है कि प्रत्येक ने क्रम से प्रतिक्रिया दी; ‘एक-एक करके’ सटीक और स्वाभाविक हिन्दी है।
- source_word: Μήτι ἐγώ;
  choice: निश्चय ही मैं तो नहीं?
  rationale: μήτι ऐसे प्रश्न का संकेत देता है जिसमें बोलने वाला ‘नहीं’ उत्तर की अपेक्षा करता है। यह अनुवाद उस आशंकित प्रतिवाद को बनाए रखता है और यूनानी की संक्षिप्तता के निकट है।
theological_decisions:
- issue: शिष्यों के प्रश्न का आशय
  choice: 'प्रश्न को अपेक्षित नकारात्मक उत्तर के साथ प्रस्तुत किया गया: ‘निश्चय ही मैं तो नहीं?’'
  alternative: ‘क्या वह मैं हूँ?’
  rationale: μήτι से संकेत मिलता है कि प्रत्येक शिष्य ‘नहीं’ उत्तर की आशा करता है। केवल ‘क्या वह मैं हूँ?’ कहने से यह सूक्ष्म भाव और उनकी व्याकुलता में निहित प्रतिवाद कम हो जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गंभीर और गरिमापूर्ण रूप रखा गया है। ‘निश्चय ही मैं तो नहीं?’ सामान्य पाठक के लिए स्वाभाविक है और प्रश्न में निहित नकारात्मक अपेक्षा को स्पष्ट करता है।
