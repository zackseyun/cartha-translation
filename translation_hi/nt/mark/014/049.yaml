  text: καθ’ ἡμέραν ἤμην πρὸς ὑμᾶς ἐν τῷ ἱερῷ διδάσκων καὶ οὐκ ἐκρατήσατέ με· ἀλλ’ ἵνα πληρωθῶσιν αἱ γραφαί.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/049.yaml
  text: Day after day I was with you in the temple[a], teaching, and you did not seize me[c][b]. But let the Scriptures be fulfilled.
translation:
  language: hi
  text: मैं हर दिन मन्दिर-परिसर में तुम्हारे बीच शिक्षा देता था, और तुमने मुझे नहीं पकड़ा[a]। लेकिन यह सब इसलिए हुआ कि शास्त्रों की बातें पूरी हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मुझे गिरफ़्तार नहीं किया।’
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘लेकिन ताकि शास्त्र पूरे हों’ जैसा उद्देश्य-वाक्य संक्षिप्त है और उसकी मुख्य क्रिया निहित है। ‘यह सब हुआ’ उसी निहित भाव को स्पष्ट करता है।
    reason: textual_clarity
lexical_decisions:
- source_word: καθ’ ἡμέραν
  choice: हर दिन
  rationale: यह वितरणसूचक पद प्रत्येक दिन और बार-बार होने का भाव देता है; ‘हर दिन’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἤμην πρὸς ὑμᾶς
  choice: तुम्हारे साथ रहकर
  rationale: πρός यहाँ लोगों के साथ उपस्थित रहने का भाव देता है। यह चयन हिन्दी वाक्य में διδάσκων के साथ सहज रूप से जुड़ता है।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्र स्थान को नहीं; मुख्य पाठ में प्रचलित संक्षिप्त अभिव्यक्ति रखी गई है और सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: διδάσκων
  choice: शिक्षा देता था
  rationale: वर्तमान कृदन्त यीशु की उस समय जारी सार्वजनिक गतिविधि को व्यक्त करता है; हिन्दी में इसे मुख्य क्रिया के साथ स्वाभाविक रूप दिया गया है।
- source_word: οὐκ ἐκρατήσατέ με
  choice: तुमने मुझे नहीं पकड़ा
  rationale: κρατέω में पकड़ने, काबू में करने और प्रसंगानुसार गिरफ़्तार करने का भाव हो सकता है। ‘पकड़ा’ इसकी व्यापकता बनाए रखता है।
- source_word: ἀλλ’ ἵνα πληρωθῶσιν
  choice: लेकिन यह सब इसलिए हुआ कि … पूरी हों
  rationale: ἵνα के साथ यह उद्देश्य अथवा परिणाम व्यक्त करता है, पर यूनानी वाक्य में मुख्य क्रिया लुप्त है। पठनीय हिन्दी के लिए न्यूनतम निहित कथन जोड़ा गया और पादटिप्पणी में मूल की संक्षिप्तता बताई गई है।
- source_word: αἱ γραφαί
  choice: पवित्र शास्त्र की बातें
  rationale: बहुवचन γραφαί इस्राएल के मान्य पवित्र लेखों की ओर संकेत करता है। हिन्दी में ‘की बातें’ जोड़ने से ‘पूरी हों’ के साथ अर्थ स्वाभाविक बनता है, बिना किसी खास भविष्यवाणी को निर्दिष्ट किए।
theological_decisions:
- issue: अपूर्ण उद्देश्य-वाक्य और ईश्वरीय उद्देश्य
  choice: लेकिन यह सब इसलिए हुआ कि पवित्र शास्त्र की बातें पूरी हों
  alternative: लेकिन इसलिए कि पवित्र शास्त्र की बातें पूरी हों
  rationale: यूनानी में ἀλλ’ ἵνα के बाद अपेक्षित मुख्य कथन निहित है। ‘यह सब हुआ’ प्रसंग से उसे स्पष्ट करता है, जबकि ‘इसलिए कि’ उद्देश्य/परिणाम की खुली हुई अर्थ-सीमा बनाए रखता है; इसे आज्ञार्थक ‘पूरी होने दो’ नहीं बनाया गया।
- issue: κρατέω का गिरफ्तारी-संबंधी अर्थ
  choice: पकड़ा
  alternative: गिरफ़्तार किया
  rationale: प्रसंग गिरफ़्तारी का है, फिर भी मूल क्रिया शारीरिक रूप से पकड़ने का व्यापक भाव रखती है। मुख्य पाठ में व्यापक अर्थ रखा गया और अधिक कानूनी विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी रखी गई है। ‘हर दिन’, ‘पकड़ा’ और ‘यह सब इसलिए हुआ’ सामान्य पाठक के लिए स्पष्ट हैं; मन्दिर-परिसर, गिरफ्तारी और यूनानी वाक्य की लुप्त मुख्य क्रिया से जुड़ी सूक्ष्मताएँ पादटिप्पणियों में सुरक्षित हैं।
