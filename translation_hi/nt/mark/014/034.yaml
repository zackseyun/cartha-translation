  text: καὶ λέγει αὐτοῖς· Περίλυπός ἐστιν ἡ ψυχή μου ἕως θανάτου· μείνατε ὧδε καὶ γρηγορεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/034.yaml
  text: And he says to them[a], “My soul is deeply grieved, even to death[c][b]. Remain here and keep watch.”
translation:
  language: hi
  text: और वह उनसे कहता है, “मेरा प्राण मृत्यु तक अत्यन्त दुःखी है। तुम यहीं ठहरो और जागते रहो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: कहता है
  rationale: मरकुस की सजीव ऐतिहासिक वर्तमान-काल शैली को बनाए रखने के लिए वर्तमान काल रखा गया है।
- source_word: Περίλυπός
  choice: अत्यन्त उदास
  rationale: यह गहरे और चारों ओर से घेर लेने वाले दुःख को व्यक्त करता है; यह पदबंध आधुनिक हिन्दी में स्वाभाविक रहते हुए भाव की तीव्रता बनाए रखता है।
- source_word: ψυχή
  choice: प्राण
  rationale: यहाँ शब्द यीशु के भीतरी जीवन अथवा सम्पूर्ण व्यक्तित्व को सूचित करता है। ‘प्राण’ मूल की अर्थ-व्याप्ति और वचन की गरिमा को बनाए रखता है।
- source_word: ἕως θανάτου
  choice: मृत्यु तक
  rationale: यूनानी पदबंध को संक्षिप्त और औपचारिक रूप से रखा गया है; यह दुःख की चरम सीमा व्यक्त करता है और इस बात को अनावश्यक रूप से तय नहीं करता कि अर्थ ‘मरने जैसा’ है या ‘मृत्यु की हद तक’।
- source_word: μείνατε ὧδε
  choice: तुम यहीं ठहरो
  rationale: आज्ञा का आशय इसी स्थान पर बने रहने से है; ‘यहीं ठहरो’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: यह शारीरिक रूप से न सोने और सतर्क बने रहने—दोनों अर्थों को धारण कर सकता है; प्रसंग में ‘जागते रहो’ इस द्विअर्थी तनाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ψυχή द्वारा यीशु की व्यथा का वर्णन
  choice: प्राण
  alternative: मन; जीवन
  rationale: ‘प्राण’ यीशु की वास्तविक मानवीय आन्तरिक व्यथा को व्यक्त करता है, पर बाद की किसी मानवशास्त्रीय या मसीही-सिद्धान्तगत व्याख्या को पद में नहीं जोड़ता।
- issue: ἕως θανάτου की सीमा
  choice: मृत्यु तक
  alternative: मरने की हद तक
  rationale: शाब्दिक संरचना भाव की चरमता और मृत्यु से उसके सम्बन्ध को खुला रखती है; अधिक व्याख्यात्मक विकल्प संभावित अर्थ को पहले ही निर्धारित कर देता।
- issue: γρηγορεῖτε का बल
  choice: जागते रहो
  alternative: चौकस रहो; पहरा देते रहो
  rationale: आज्ञा में वास्तविक जागरण और व्यापक सतर्कता दोनों सम्मिलित हो सकते हैं। चुना हुआ रूप प्रसंग में दोनों को सम्भव रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव ऐतिहासिक वर्तमान और गंभीर, सीधी वाणी रखी गई है। ‘अत्यन्त उदास’ सामान्य पाठक के लिए स्पष्ट है; ‘प्राण’ वचन की काव्यात्मक और धार्मिक गरिमा बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
