review_pass:
  verdict: revise
  source_fidelity: The historical present in “वह ... कहता है,” the location command “तुम यहीं ठहरो,” and “जागते रहो” faithfully reflect λέγει, μείνατε ὧδε, and γρηγορεῖτε. “मृत्यु तक” appropriately retains the compact, extreme force of ἕως θανάτου without over-explaining it. However, “अत्यन्त उदास” can denote mere low spirits or gloom and does not reliably convey the intense grief of Περίλυπος.
  naturalness: The sentence is clear and retains a suitably grave, direct register. Replacing “उदास” with “दुःखी” produces more precise and natural emotional language in this context while retaining the concise structure.
  terminology: “प्राण” is an acceptable elevated Hindi rendering of ψυχή here and preserves the expression’s sense of the speaker’s inner life without forcing a technical anthropological interpretation. “जागते रहो” appropriately leaves open both wakefulness and watchful vigilance.
  issues:
  - severity: medium
    issue: “अत्यन्त उदास” understates Περίλυπος.
    rationale: The Greek describes acute, profound sorrow/distress. In modern Hindi, “उदास” may suggest ordinary sadness, dejection, or a gloomy mood. “अत्यन्त दुःखी” better conveys the required intensity without adding interpretation.
