  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: γρηγορεῖτε καὶ προσεύχεσθε, ἵνα μὴ ⸀ἔλθητε εἰς πειρασμόν· τὸ μὲν πνεῦμα πρόθυμον ἡ δὲ σὰρξ ἀσθενής.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/038.yaml
  text: Stay awake and pray[a], so that you may not enter into temptation. The spirit indeed is willing, but the flesh is weak.
translation:
  language: hi
  text: जागते रहो और प्रार्थना करते रहो[a], ताकि तुम परीक्षा में न पड़ो। आत्मा तो तत्पर है, पर शरीर दुर्बल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रलोभन” अथवा “परख” में।
    reason: πειρασμός की अर्थ-सीमा में परीक्षा, प्रलोभन और परख सम्मिलित हो सकते हैं।
lexical_decisions:
- source_word: γρηγορεῖτε
  choice: जागते रहो
  rationale: बहुवचन वर्तमान आज्ञार्थक का अर्थ जागते रहने और सचेत रहने दोनों को समेटता है; गतसमनी के प्रसंग में यह स्वाभाविक और स्पष्ट है।
- source_word: προσεύχεσθε
  choice: प्रार्थना करते रहो
  rationale: वर्तमान आज्ञार्थक की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἵνα μὴ ἔλθητε εἰς πειρασμόν
  choice: ताकि तुम परीक्षा में न पड़ो
  rationale: ἵνα μή के निवारक उद्देश्य को स्पष्ट करता है। हिन्दी में 'परीक्षा में पड़ना' स्वाभाविक है और भीतर प्रवेश करने की यूनानी छवि का कार्यात्मक अर्थ बनाए रखता है।
- source_word: πειρασμόν
  choice: परीक्षा
  rationale: πειρασμός प्रलोभन, परख या संकटपूर्ण परीक्षा को सूचित कर सकता है। 'परीक्षा' व्यापक अस्पष्टता को बनाए रखती है; प्रलोभन का विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: τὸ μὲν πνεῦμα πρόθυμον
  choice: आत्मा तो तत्पर है
  rationale: μέν...δέ के विरोध को 'तो...पर' से व्यक्त किया गया है। 'तत्पर' πρόθυμος की इच्छा, तैयारी और उत्सुकता के संयुक्त भाव को संक्षेप में रखता है।
- source_word: ἡ δὲ σὰρξ ἀσθενής
  choice: पर शरीर दुर्बल है
  rationale: इस प्रसंग में σάρξ मनुष्य की देहगत दुर्बलता को इंगित करता है, न कि अनिवार्य रूप से किसी तकनीकी अर्थ में 'पापी स्वभाव' को। साधारण हिन्दी में 'शरीर' इस आशय को 'मांस' से अधिक स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: πνεῦμα का संदर्भ
  choice: मानवीय आत्मा अथवा भीतरी इच्छा
  alternative: पवित्र आत्मा
  rationale: सोते हुए चेलों को दिए गए संबोधन और शरीर के साथ विरोध के कारण मानवीय भीतरी तत्परता अधिक संभावित है; फिर भी अनावश्यक व्याख्या जोड़कर वाक्य को विस्तृत नहीं किया गया।
- issue: σάρξ का अर्थ
  choice: शरीर, अर्थात मानवीय देहगत दुर्बलता
  alternative: मांस; पापी स्वभाव
  rationale: यहाँ बल मानवीय कमजोरी पर है, किसी विकसित धर्मवैज्ञानिक 'पापी स्वभाव' पर नहीं। 'शरीर' आधुनिक हिन्दी में अर्थ को सहज रखता है, जबकि मूल विरोध की तनावपूर्ण संरचना बनी रहती है।
- issue: πειρασμός की अर्थ-सीमा
  choice: परीक्षा
  alternative: प्रलोभन; परख
  rationale: यूनानी शब्द नैतिक प्रलोभन और कठिन परीक्षा दोनों अर्थ ग्रहण कर सकता है। मुख्य पाठ में व्यापक 'परीक्षा' और पाद-टिप्पणी में विकल्प देकर मूल की अर्थगत खुलावट सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; बहुवचन संबोधन स्पष्ट रखा गया है। भाषा सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। वर्तमान आज्ञार्थकों की निरंतरता 'रहो' द्वारा व्यक्त की गई है।
