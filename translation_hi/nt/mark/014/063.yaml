  text: ὁ δὲ ἀρχιερεὺς διαρρήξας τοὺς χιτῶνας αὐτοῦ λέγει· Τί ἔτι χρείαν ἔχομεν μαρτύρων;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/063.yaml
  text: Then the high priest tore his garments and said[b][a], “What further need do we have of witnesses?”
translation:
  language: hi
  text: इस पर महायाजक ने अपने वस्त्र[a] फाड़कर कहा[b], “अब हमें गवाहों की और क्या आवश्यकता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने अंगरखे।”
    reason: lexical_alternative
  - marker: b
    text: 'यूनानी में यहाँ ऐतिहासिक वर्तमान काल है: “कहता है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह उस एक पदाधिकारी के लिए प्रचलित और सटीक हिन्दी पद है जो इस सुनवाई की अध्यक्षता कर रहा है।
- source_word: διαρρήξας
  choice: फाड़कर
  rationale: यह क्रिया वस्त्रों को सचमुच फाड़ने की पूर्ववर्ती क्रिया व्यक्त करती है; ‘फाड़कर’ सहज हिन्दी में क्रियाओं का क्रम बनाए रखता है।
- source_word: τοὺς χιτῶνας αὐτοῦ
  choice: अपने वस्त्र
  rationale: χίτων अधिक विशेष रूप से अंगरखे या अधोवस्त्र को सूचित कर सकता है, पर यहाँ बहुवचन ‘वस्त्र’ स्वाभाविक है और किसी विशेष याजकीय पोशाक का अनावश्यक संकेत नहीं देता।
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान ‘कहता है’ है, किंतु हिन्दी कथन-शैली में भूतकाल ‘कहा’ अधिक स्वाभाविक है; मूल रूप को पाद-टिप्पणी में दर्ज किया गया है।
- source_word: Τί ἔτι χρείαν ἔχομεν
  choice: अब हमें ... की और क्या आवश्यकता है
  rationale: यह रचना ἔτι के ‘अब भी/इसके आगे’ भाव और प्रश्न की अलंकारिक तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: μαρτύρων
  choice: गवाहों की
  rationale: χρεία के साथ प्रयुक्त संबंधकारक को हिन्दी में ‘गवाहों की आवश्यकता’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: महायाजक के वस्त्र फाड़ने के अर्थ का निरूपण
  choice: इसे केवल वस्त्र फाड़ने की वास्तविक क्रिया के रूप में अनूदित किया गया है।
  alternative: इसे कथित ईशनिंदा पर शोक या आक्रोश की स्पष्ट अभिव्यक्ति बताना।
  rationale: पद स्वयं इस संकेत का अर्थ नहीं समझाता; इसलिए अनुवाद शोक, आक्रोश या ईशनिंदा का व्याख्यात्मक भाव जोड़कर कथात्मक और धर्मवैचारिक तनाव को समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘महायाजक’ और ‘वस्त्र’ बाइबिलीय प्रसंग के अनुरूप परिचित शब्द हैं, जबकि वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट रखा गया है।
