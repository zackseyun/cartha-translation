    reason: lexical_alternative
lexical_decisions:
- source_word: παραλαμβάνει
  choice: अपने साथ ले गया
  rationale: ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है; ‘अपने साथ’ चुने हुए साथियों को साथ ले जाने का भाव स्पष्ट करता है।
- source_word: μετ’ αὐτοῦ
  choice: अपने साथ
  rationale: μετά के संबंधसूचक प्रयोग का सहज और स्पष्ट हिन्दी रूप।
- source_word: ἤρξατο
  choice: होने लगा
  rationale: क्रिया के आरंभिक भाव को स्पष्ट रखते हुए आधुनिक हिन्दी का स्वाभाविक मुहावरा अपनाया गया है।
- source_word: ἐκθαμβεῖσθαι
  choice: बहुत व्याकुल
  rationale: यहाँ क्रिया तीव्र भावनात्मक आघात, घबराहट या व्याकुलता व्यक्त करती है; केवल ‘चकित’ कहना प्रसंग में अपर्याप्त होगा।
- source_word: ἀδημονεῖν
  choice: बेचैन
  rationale: यह शब्द गहरी आंतरिक परेशानी और मानसिक संताप का बोध कराता है; ‘व्याकुल’ के साथ मिलकर दोनों यूनानी क्रियाओं का पृथक किंतु निकट अर्थ बनाए रखता है।
- source_word: καὶ ... καὶ
  choice: और ... और
  rationale: मरकुस की संयोजक, क्रमिक कथा-शैली को जहाँ हिन्दी में स्वाभाविक है वहाँ बनाए रखा गया है।
theological_decisions:
- issue: गतसमनी में यीशु की भावनात्मक अवस्था
  choice: उनकी वास्तविक और तीव्र मानवीय व्यथा को ‘बहुत व्याकुल और बेचैन’ के रूप में सीधे व्यक्त किया गया है।
  alternative: हल्का ‘चकित और परेशान’ अथवा अधिक व्याख्यात्मक ‘भय से अभिभूत और घोर पीड़ा में’ कहा जा सकता था।
  rationale: मूल के दोनों शब्द तीव्र भावात्मक संकट दर्शाते हैं। अनुवाद यीशु की वास्तविक मानवता को कम नहीं करता, पर मूल से आगे बढ़कर उस अनुभव का धर्मवैज्ञानिक कारण भी निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ऐतिहासिक वर्तमान को हिन्दी की स्वाभाविक कथा-परंपरा के अनुसार भूतकाल में रखा गया है।
