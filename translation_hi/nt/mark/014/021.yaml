id: MRK.14.21
reference: Mark 14:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ὅτι ὁ μὲν υἱὸς τοῦ ἀνθρώπου ὑπάγει καθὼς γέγραπται περὶ αὐτοῦ, οὐαὶ δὲ τῷ ἀνθρώπῳ ἐκείνῳ δι’ οὗ ὁ υἱὸς τοῦ ἀνθρώπου παραδίδοται· ⸀καλὸν αὐτῷ εἰ οὐκ ἐγεννήθη ὁ ἄνθρωπος ἐκεῖνος.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/021.yaml
  text: For the Son of Man goes just as it is written about him[a], but woe to that man through whom the Son of Man is betrayed. It would have been good for him if that man had not been born.
translation:
  language: hi
  text: क्योंकि मनुष्य का पुत्र तो जा रहा है, जैसा उसके विषय में लिखा है; पर उस मनुष्य पर हाय है, जिसके द्वारा मनुष्य के पुत्र के साथ विश्वासघात किया जाता है![a] उस मनुष्य के लिए भला होता, यदि उस मनुष्य का जन्म न हुआ होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “जिसके द्वारा मनुष्य का पुत्र सौंप दिया जाता है।”'
    reason: παραδίδοται के अधिक शाब्दिक और व्यापक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यहाँ यह यीशु के पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ μὲν ... δὲ
  choice: तो ... पर
  rationale: 'यह जोड़ी दोनों कथनों के बीच स्पष्ट विरोध रखती है: मनुष्य के पुत्र का लिखा हुआ मार्ग और उसे पकड़वाने वाले मनुष्य पर आने वाली विपत्ति।'
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की स्थापित आत्म-पदवी का रूप ज्यों का त्यों रखा गया है, ताकि उसकी शास्त्रीय और संभावित दानिय्येली प्रतिध्वनि बनी रहे।
- source_word: ὑπάγει
  choice: जा रहा है
  rationale: वर्तमान काल और नियत परिणाम की ओर बढ़ने का भाव सुरक्षित रहता है, बिना इसे केवल मृत्यु का स्पष्ट पर्याय बना देने के।
- source_word: καθὼς γέγραπται περὶ αὐτοῦ
  choice: जैसा उसके विषय में लिखा है
  rationale: καθώς की तुलना और γέγραπται के स्थायी शास्त्रीय लेख का भाव सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: οὐαὶ
  choice: हाय
  rationale: यह भविष्यसूचक शोक और न्यायसूचक चेतावनी—दोनों का गंभीर बल बनाए रखता है।
- source_word: τῷ ἀνθρώπῳ ἐκείνῳ
  choice: उस मनुष्य पर
  rationale: विशिष्ट पुरुष की ओर संकेत करने वाले यूनानी पद और उसके गंभीर बल को सुरक्षित रखता है।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: διά के माध्यम अथवा कर्तृता-संबंधी अर्थ को औपचारिक किंतु समझने योग्य हिन्दी में बनाए रखता है।
- source_word: παραδίδοται
  choice: धोखे से पकड़वाया जाता है
  rationale: इस प्रसंग में यह यहूदा के विश्वासघाती कार्य को स्वाभाविक हिन्दी में स्पष्ट करता है; मूल शब्द के अधिक व्यापक ‘सौंपे जाने’ के अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: καλὸν αὐτῷ
  choice: उस मनुष्य के लिए भला होता
  rationale: यह साधारण वर्तमान मूल्यांकन नहीं, बल्कि विपरीत-तथ्यात्मक मूल्यांकन है; ‘भला होता’ हिन्दी में उसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: εἰ οὐκ ἐγεννήθη
  choice: यदि वह जन्मा ही न होता
  rationale: विपरीत-तथ्यात्मक शर्त को ठीक रूप से व्यक्त करता है; ‘ही’ वाक्य के स्वाभाविक निषेध-बल को दर्शाता है।
- source_word: ὁ ἄνθρωπος ἐκεῖνος
  choice: वह
  rationale: पिछले वाक्यांश ‘उस मनुष्य’ के स्पष्ट संदर्भ के कारण सर्वनाम स्वाभाविक हिन्दी देता है, जबकि उसी वाक्य में ‘उस मनुष्य’ रखकर यूनानी पुनरुक्ति का गंभीर बल पर्याप्त रूप से बना रहता है।
theological_decisions:
- issue: दुःखभोग के प्रसंग में παραδίδοται का अनुवाद
  choice: धोखे से पकड़वाया जाता है
  alternative: सौंप दिया जाता है
  rationale: निकटवर्ती प्रसंग यहूदा के विश्वासघात को सामने रखता है, इसलिए मुख्य पाठ में नैतिक और घटनात्मक अर्थ स्पष्ट किया गया है। फिर भी मूल क्रिया केवल ‘विश्वासघात’ तक सीमित नहीं है; उसका अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय योजना और मानवीय उत्तरदायित्व का तनाव
  choice: लिखे हुए के अनुसार मनुष्य का पुत्र जाता है, फिर भी उसे पकड़वाने वाले मनुष्य पर हाय है
  alternative: किसी एक पक्ष को समझाकर दूसरे का बल घटाना
  rationale: 'पाठ दोनों बातों को साथ रखता है: घटना पवित्रशास्त्र के अनुसार होती है, और विश्वासघाती मनुष्य उत्तरदायी ठहरता है। अनुवाद इस तनाव को बिना किसी धर्मवैचारिक समाधान के सुरक्षित रखता है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मनुष्य का पुत्र’ पारंपरिक शास्त्रीय पदवी है; ‘उस मनुष्य पर हाय’ भविष्यसूचक गंभीरता बनाए रखता है। अर्धविराम दोनों परस्पर संबद्ध किंतु विरोधी कथनों को स्पष्ट करता है।
