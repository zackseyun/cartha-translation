  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔρχεται τὸ τρίτον καὶ λέγει αὐτοῖς· Καθεύδετε ⸀τὸ λοιπὸν καὶ ἀναπαύεσθε· ἀπέχει· ἦλθεν ἡ ὥρα, ἰδοὺ παραδίδοται ὁ υἱὸς τοῦ ἀνθρώπου εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/041.yaml
  text: And he comes the third time and says to them[a], “Are you still sleeping and resting? It is enough; the hour has come. Look[c][b], the Son of Man is being handed over into the hands of sinners.”
translation:
  language: hi
  text: और वह तीसरी बार उनके पास आता है और उनसे कहता है, “क्या तुम अब भी सो रहे हो और आराम कर रहे हो?[a] बस, बहुत हुआ![b] वह घड़ी आ पहुँची है। देखो, मनुष्य का पुत्र पापियों के हाथों में सौंपा जा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब सोते और आराम करते रहो।” यूनानी शब्दों को व्यंग्यात्मक कथन अथवा अनुमति के रूप में, या उलाहने भरे प्रश्न के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी अभिव्यक्ति कठिन है। इसका अनुवाद “अब काफी है” या “बस!” भी हो सकता है; यहाँ कम संभावित एक अन्य प्रस्ताव है, “भुगतान पूरा मिल गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔρχεται τὸ τρίτον
  choice: वह तीसरी बार आकर
  rationale: ऐतिहासिक वर्तमान की जीवंतता बनाए रखते हुए यूनानी अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: Καθεύδετε τὸ λοιπὸν καὶ ἀναπαύεσθε
  choice: क्या तुम अब भी सो रहे और आराम कर रहे हो?
  rationale: संदर्भ में इसे उलाहने भरे आलंकारिक प्रश्न के रूप में लेना सहज है; यूनानी रूप व्यंग्यात्मक अनुमति/कथन के रूप में भी समझा जा सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἀπέχει
  choice: बस, बहुत हुआ!
  rationale: यह कठिन और विवादित अभिव्यक्ति यहाँ निर्णायक क्षण की ओर तीखे संक्रमण को व्यक्त करती है। अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἦλθεν ἡ ὥρα
  choice: वह घड़ी आ पहुँची है
  rationale: ‘घड़ी’ नियत निर्णायक समय की धार्मिक और कथात्मक प्रतिध्वनि बचाती है; पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: संकेत और ध्यान आकर्षित करने वाला बल आधुनिक, सहज हिन्दी में सुरक्षित रहता है।
- source_word: παραδίδοται
  choice: सौंपा जा रहा है
  rationale: मूल क्रिया का व्यापक अर्थ रखा गया है; ‘धोखा देकर पकड़वाया जा रहा है’ कहने से अर्थ समय से पहले केवल यहूदा के विश्वासघात तक सीमित हो जाता।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की इस विशिष्ट आत्म-पदवी का मानक और अर्थपूर्ण हिन्दी रूप।
- source_word: εἰς τὰς χεῖρας τῶν ἁμαρτωλῶν
  choice: पापियों के हाथों में
  rationale: किसी के अधिकार में सौंपे जाने की ठोस यूनानी उपमा को सुरक्षित रखा गया है।
theological_decisions:
- issue: Καθεύδετε ... καὶ ἀναπαύεσθε का वाक्य-बल
  choice: उलाहने भरा आलंकारिक प्रश्न
  alternative: 'व्यंग्यात्मक अनुमति या कथन: “अब बाकी समय सोते और आराम करते रहो।”'
  rationale: प्राचीन हस्तलिपियों का विराम-चिह्न इस प्रश्न को निर्णायक रूप से हल नहीं करता। प्रसंग में प्रश्न स्वाभाविक है, पर वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ἀπέχει का अर्थ
  choice: बस, बहुत हुआ!
  alternative: “इतना पर्याप्त है” अथवा, यहाँ कम संभावित, वाणिज्यिक अर्थ “भुगतान पूरा मिल गया है”
  rationale: कठिन अभिव्यक्ति को प्रसंगानुकूल निर्णायक उद्गार के रूप में अनूदित किया गया है, बिना किसी अटकलबाज़ तकनीकी या धर्मवैज्ञानिक अर्थ को मुख्य पाठ में आरोपित किए।
- issue: παραδίδοται का अर्थ-क्षेत्र
  choice: सौंपा जा रहा है
  alternative: विश्वासघात करके पकड़वाया जा रहा है
  rationale: व्यापक निष्क्रिय अभिव्यक्ति सौंपे जाने की पूरी कथा और उसके अनेक अभिकर्ताओं के लिए स्थान रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और मौखिक कथन के योग्य रखी गई है। ‘मनुष्य का पुत्र’, ‘घड़ी’ और ‘पापियों के हाथों में’ जैसे प्रमुख बाइबलीय पदों और बिंबों को सुरक्षित रखा गया है।
