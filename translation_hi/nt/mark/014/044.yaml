  text: δεδώκει δὲ ὁ παραδιδοὺς αὐτὸν σύσσημον αὐτοῖς λέγων· Ὃν ἂν φιλήσω αὐτός ἐστιν· κρατήσατε αὐτὸν καὶ ⸀ἀπάγετε ἀσφαλῶς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/044.yaml
  text: The one betraying him had given them a signal[a], saying, “The one I kiss is he[c][b]. Seize him and lead him away securely.”
translation:
  language: hi
  text: उसे पकड़वाने वाले ने उन्हें पहले से एक संकेत[a] दे रखा था। उसने कहा था, “जिसे मैं चूमूँ, वही है। उसे पकड़ लेना और उसे सुरक्षित रूप से ले जाना।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पहले से तय किया हुआ पहचान-संकेत।
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा के शब्दों का अनुवाद “उसे पकड़ लेना और सावधानी से ले जाना” भी हो सकता है। इस गिरफ्तारी के प्रसंग में “सुरक्षित रूप से” का आशय संभवतः उसे कड़े नियंत्रण में रखकर ले जाने से है। चूमना उस समय अभिवादन का एक प्रचलित ढंग था, जिसे यहाँ पहचान-संकेत बनाया गया।
    reason: alternative_reading_and_cultural_note
lexical_decisions:
- source_word: δεδώκει
  choice: पहले से ... दे रखा था
  rationale: पूर्णभूत काल यह दिखाता है कि पहचान का संकेत गिरफ्तारी से पहले तय किया जा चुका था।
- source_word: ὁ παραδιδοὺς αὐτόν
  choice: उसे पकड़वाने वाले
  rationale: संदर्भ में यह सहभागी पद यीशु को विरोधियों के हाथ सौंपने और विश्वासघात करने की क्रिया बताता है; ‘पकड़वाने वाला’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: σύσσημον
  choice: संकेत
  rationale: यह किसी सामान्य चिह्न से अधिक, पहले से सहमत पहचान-संकेत को दर्शाता है; यह बात पादटिप्पणी में स्पष्ट की गई है।
- source_word: λέγων
  choice: उसने कहा था
  rationale: हिन्दी में अलग वाक्य के रूप में यह स्वाभाविक है और पहले से दिए गए निर्देश का कालगत संबंध बनाए रखता है।
- source_word: Ὃν ἂν φιλήσω
  choice: जिसे मैं चूमूँ
  rationale: अनिश्चित संबंधवाचक रचना को बिना ‘मनुष्य’ जैसा कोई अतिरिक्त शब्द जोड़े सहज हिन्दी में व्यक्त करता है।
- source_word: αὐτός ἐστιν
  choice: वही है
  rationale: ‘वही’ यूनानी αὐτός के पहचानसूचक बल को संक्षेप और स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: κρατήσατε
  choice: पकड़ लेना
  rationale: यह बलपूर्वक अपने नियंत्रण में लेने का अर्थ देता है और केवल औपचारिक कानूनी ‘गिरफ्तारी’ तक सीमित नहीं करता।
- source_word: ἀπάγετε ἀσφαλῶς
  choice: कड़ी निगरानी में ले जाना
  rationale: गिरफ्तारी के प्रसंग में क्रियाविशेषण का आशय उसे सुरक्षित नियंत्रण में रखकर ले जाना है, न कि मुख्यतः उसकी कुशलता की रक्षा करना।
