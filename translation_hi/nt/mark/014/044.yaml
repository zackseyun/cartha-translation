translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पकड़वाने वाले’ सामान्य पाठक के लिए स्वाभाविक है; ‘कड़ी निगरानी में’ ἀσφαλῶς की प्रसंगगत अस्पष्टता को मुख्य पाठ में समझने योग्य बनाता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
