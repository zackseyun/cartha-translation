source:
  edition: SBLGNT
  text: ὁ δὲ ἐσιώπα καὶ ⸂οὐκ ἀπεκρίνατο οὐδέν⸃. πάλιν ὁ ἀρχιερεὺς ἐπηρώτα αὐτὸν καὶ λέγει αὐτῷ· Σὺ εἶ ὁ χριστὸς ὁ υἱὸς τοῦ εὐλογητοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/061.yaml
  text: But he kept silent and answered nothing[a]. Again the high priest questioned him and says to him, “Are you the Messiah[b], the Son of the Blessed One?”
translation:
  language: hi
  text: पर वह चुप रहा और उसने कोई उत्तर नहीं दिया। फिर महायाजक ने उससे पूछा और कहा, “क्या तुम मसीह[a], परमधन्य के पुत्र[b] हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ यूनानी शब्द Χριστός (ख्रिस्तोस) का हिन्दी रूप है; इसे ‘ख्रीस्त’ भी कहा जाता है।
    reason: lexical_note
  - marker: b
    text: ‘परमधन्य’ परमेश्वर के लिए प्रयुक्त एक श्रद्धापूर्ण यहूदी परोक्ष संबोधन है।
    reason: cultural_note
lexical_decisions:
- source_word: ἐσιώπα
  choice: चुप रहा
  rationale: अपूर्णकाल निरंतर मौन रहने का भाव देता है; ‘चुप रहा’ आधुनिक हिन्दी में स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: ἀπεκρίνατο οὐδέν
  choice: उसने कोई उत्तर नहीं दिया
  rationale: यह निषेध की पूर्णता को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह महायाजक द्वारा दोबारा प्रश्न किए जाने को संक्षेप और स्वाभाविक ढंग से दर्शाता है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: यह यहूदी प्रधान याजकीय पद के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: ἐπηρώτα ... καὶ λέγει
  choice: ने उससे पूछा
  rationale: यूनानी में अपूर्णकाल और ऐतिहासिक वर्तमान का संयोजन है। हिन्दी में ‘ने उससे पूछा’ न्यायिक प्रसंग और कथन की गति को स्वाभाविक रखता है; अगले प्रत्यक्ष प्रश्न से ‘कहा’ का भाव स्वतः स्पष्ट है।
- source_word: χριστός
  choice: मसीह
  rationale: यहाँ शब्द व्यक्तिगत नाम की तरह नहीं, यहूदी मसीही उपाधि के रूप में प्रयुक्त है; हिन्दी में ‘मसीह’ इसका स्थापित रूप है।
- source_word: ὁ υἱὸς τοῦ εὐλογητοῦ
  choice: परमधन्य के पुत्र
  rationale: ‘परमधन्य’ परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण यहूदी परोक्ष संबोधन को बनाए रखता है और मूल में निहित अप्रत्यक्षता को ‘परमेश्वर’ कहकर समाप्त नहीं करता।
theological_decisions:
- issue: χριστός को प्रत्यक्ष मसीही उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: महायाजक का प्रश्न यहूदी मसीही पहचान के विषय में है। ‘मसीह’ हिन्दी पाठकों के लिए स्थापित, स्वाभाविक और शीर्षकात्मक अर्थ के अनुकूल है।
- issue: τοῦ εὐλογητοῦ का श्रद्धापूर्ण परोक्ष संबोधन
  choice: परमधन्य
  alternative: परमेश्वर
  rationale: मूल यूनानी परमेश्वर का नाम सीधे न लेकर ‘धन्य जन’ के आशय वाला श्रद्धापूर्ण संबोधन करता है। ‘परमधन्य’ उस सांस्कृतिक और धर्मवैचारिक बनावट को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। न्यायिक प्रसंग की गंभीरता बनी रहती है। ‘परमधन्य’ अपेक्षाकृत ऊँचे धार्मिक रजिस्टर का शब्द है, पर यहाँ मूल के श्रद्धापूर्ण परोक्ष संबोधन को सुरक्षित रखने के लिए उपयुक्त है।
