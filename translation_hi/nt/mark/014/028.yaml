base_translation:
  language: en
  yaml_path: translation/nt/mark/014/028.yaml
  text: But after I am raised[a], I will go ahead of you into Galilee.
translation:
  language: hi
  text: परन्तु मेरे जिलाए जाने के बाद[a], मैं तुमसे पहले गलील जाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मेरे जी उठने के बाद।’ यूनानी में ‘उठाना/जिलाना’ क्रिया का निष्क्रिय रूप है, जो पुनरुत्थान के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले कथन में शिष्यों के तितर-बितर होने की भविष्यवाणी के विपरीत आशा और आगे की योजना प्रस्तुत करता है। ‘परन्तु’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण विरोधसूचक संयोजक है।
- source_word: μετὰ τὸ ἐγερθῆναί με
  choice: मेरे जिलाए जाने के बाद
  rationale: μετά के साथ संज्ञार्थक अनंत क्रिया समयक्रम, अर्थात ‘के बाद’, व्यक्त करती है। ‘जिलाए जाने’ से ἐγερθῆναί का भूतार्थक निष्क्रिय रूप और पुनरुत्थान का आशय दोनों सुरक्षित रहते हैं।
- source_word: προάξω ὑμᾶς
  choice: मैं तुमसे पहले ... जाऊँगा
  rationale: प्रसंग में προάξω का अर्थ शिष्यों से पहले गंतव्य की ओर जाना है। यह हिन्दी में स्वाभाविक है और ‘आगे चलूँगा’ की संभावित नेतृत्व-संबंधी अस्पष्टता से बचता है। ‘तुमसे’ बहुवचन शिष्यों को संबोधित करता है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील जाऊँगा
  rationale: εἰς गलील की ओर गति और गंतव्य को दर्शाता है। हिन्दी में ‘गलील जाऊँगा’ स्वाभाविक रूप से वही गंतव्य-संबंध व्यक्त करता है; ‘गलील में जाऊँगा’ कम स्वाभाविक होता।
theological_decisions:
- issue: ἐγερθῆναί με में पुनरुत्थान और निष्क्रिय वाच्य
  choice: मेरे जिलाए जाने के बाद
  alternative: मेरे जी उठने के बाद
  rationale: मुख्य पाठ निष्क्रिय रूप को बनाए रखता है और पुनरुत्थान का अर्थ स्पष्ट करता है, बिना कर्ता को नामित किए। सक्रिय विकल्प अधिक प्रचलित हिन्दी है, पर यूनानी के निष्क्रिय वाच्य को समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। ‘जिलाए जाने’ कुछ औपचारिक है, पर पुनरुत्थान-संदर्भ और मूल के निष्क्रिय रूप को स्पष्ट तथा संक्षिप्त ढंग से सुरक्षित रखता है।
