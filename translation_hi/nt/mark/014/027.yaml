source:
  edition: SBLGNT
  text: Καὶ λέγει αὐτοῖς ὁ Ἰησοῦς ὅτι Πάντες ⸀σκανδαλισθήσεσθε, ὅτι γέγραπται· Πατάξω τὸν ποιμένα, καὶ ⸂τὰ πρόβατα διασκορπισθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/027.yaml
  text: 'And Jesus says to them[a], “You will all fall away, because it is written: ‘I will strike the shepherd, and the sheep will be scattered.’”'
translation:
  language: hi
  text: 'और यीशु उनसे कहते हैं, “तुम सब ठोकर खाओगे[a], क्योंकि लिखा है:


    ‘मैं चरवाहे पर प्रहार करूँगा,


    और भेड़ें तितर-बितर हो जाएँगी।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम सब मुझसे विमुख हो जाओगे”; अधिक शाब्दिक रूप में, “तुम सबको ठोकर लगाई जाएगी।”
    reason: यूनानी क्रिया रूपकतः डगमगाने या साथ छोड़ देने का अर्थ दे सकती है; इसका कर्मवाच्य रूप यह संभावना भी रखता है कि ठोकर का कारण बाहरी रूप से उपस्थित हो।
lexical_decisions:
- source_word: λέγει
  choice: कहा
  rationale: यूनानी में ऐतिहासिक वर्तमान है, पर आधुनिक हिन्दी कथा-वर्णन में भूतकाल ‘कहा’ अधिक स्वाभाविक है; इससे घटना का समय स्पष्ट रहता है।
- source_word: σκανδαλισθήσεσθε
  choice: ठोकर खाओगे
  rationale: यह यूनानी क्रिया की ठोकर खाने की रूपकात्मक छवि बनाए रखता है और शिष्यों के डगमगाने, विफल होने तथा साथ छोड़ने की ओर संकेत करता है, बिना अर्थ को केवल स्थायी धर्मत्याग तक सीमित किए।
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण की भूमिका देने वाला सिद्ध और स्वाभाविक हिन्दी पदबंध; यूनानी पूर्णकाल के वर्तमान प्रामाणिक बल को बनाए रखता है।
- source_word: Πατάξω
  choice: मैं ... प्रहार करूँगा
  rationale: क्रिया की शक्ति को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है और कर्ता ‘मैं’ को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: τὸν ποιμένα
  choice: चरवाहे पर
  rationale: भविष्यवाणी की झुंड-संबंधी प्रतिमा और निश्चित एकवचन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὰ πρόβατα
  choice: भेड़ें
  rationale: मूल के बहुवचन और झुंड की प्रतिमा का सीधा, स्वाभाविक अनुवाद।
- source_word: διασκορπισθήσονται
  choice: तितर-बितर हो जाएँगी
  rationale: चरवाहे पर प्रहार के बाद झुंड के अलग-अलग दिशाओं में बिखर जाने की छवि को स्पष्ट और मुहावरेदार हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: σκανδαλισθήσεσθε द्वारा शिष्यों की आगामी विफलता का स्वरूप
  choice: ठोकर खाओगे
  alternative: मुझसे विमुख हो जाओगे / ठोकर खिलाए जाओगे
  rationale: ‘ठोकर खाओगे’ मूल रूपक और उसकी अर्थगत व्यापकता को सुरक्षित रखता है। प्रसंग में इसका परिणाम शिष्यों का यीशु को छोड़कर बिखर जाना है, किंतु मुख्य पाठ में ‘मुझसे विमुख’ जोड़ना मूल में निहित कर्म को स्पष्ट करके संभावित रूप से अर्थ को अधिक निर्णीत कर देता। कर्मवाच्य की संभावना पादटिप्पणी में रखी गई है।
- issue: चरवाहे पर प्रहार करने वाले की पहचान
  choice: ‘मैं’ को यथावत रखा गया
  alternative: 'कर्तारहित कर्मवाच्य: ‘चरवाहा मारा जाएगा’'
  rationale: उद्धृत वचन में प्रथम पुरुष कर्ता स्पष्ट है। उसे हटाना ईश्वरीय कर्तृत्व से जुड़ी मूल पाठ की कठिन धार्मिक तनाव-स्थिति को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद्यात्मक पवित्रशास्त्रीय उद्धरण को अलग पंक्तियों में रखा गया है। ‘तब’ कथा-संबंध को स्वाभाविक बनाता है, जबकि ‘ठोकर खाओगे’ मूल की रूपकात्मक तथा धार्मिक अस्पष्टता सुरक्षित रखता है।
