  source_fidelity: 'The translation accurately represents the sequence of actions in the Greek: taking a cup, giving thanks, giving it to the disciples, and all of them drinking from it. “एक प्याला” appropriately reflects the anarthrous ποτήριον without asserting that the cup was indefinite in every contextual sense. “उसमें से पिया” correctly identifies the referent of ἐξ αὐτοῦ as the cup.'
