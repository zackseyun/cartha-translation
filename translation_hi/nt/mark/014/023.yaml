  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀λαβὼν ποτήριον εὐχαριστήσας ἔδωκεν αὐτοῖς, καὶ ἔπιον ἐξ αὐτοῦ πάντες.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/023.yaml
  text: And taking a cup[a], after giving thanks he gave it to them, and they all drank from it.
translation:
  language: hi
  text: और उसने एक प्याला[a] लिया, धन्यवाद दिया और उन्हें दे दिया; और उन सबने उसमें से पिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह प्याला।” यूनानी में “प्याला” निश्चित उपपद के बिना है, यद्यपि भोज का प्रसंग किसी विशिष्ट प्याले की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαβὼν
  choice: उसने ... लिया
  rationale: यूनानी अओरिस्ट कृदंत मुख्य क्रिया से पहले की सहायक क्रिया बताता है। हिन्दी में क्रमबद्ध सीमित क्रियाएँ अधिक स्वाभाविक हैं और क्रियाओं का क्रम बनाए रखती हैं।
- source_word: ποτήριον
  choice: एक प्याला
  rationale: यूनानी संज्ञा के साथ निश्चित उपपद नहीं है, इसलिए ‘एक प्याला’ सीधा समतुल्य है; फिर भी भोज का प्रसंग किसी विशिष्ट प्याले की ओर संकेत कर सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: εὐχαριστήσας
  choice: धन्यवाद दिया
  rationale: यह क्रिया धन्यवाद देने को व्यक्त करती है। हिन्दी में क्रियाओं का क्रम पूर्वकालिकता स्पष्ट कर देता है और बाद की विशिष्ट धर्मविधिक शब्दावली नहीं जोड़ता।
- source_word: ἔδωκεν αὐτοῖς
  choice: उन्हें दे दिया
  rationale: हिन्दी में पहले उल्लिखित प्याले को कर्म के रूप में दोहराए बिना यह वाक्य स्वाभाविक और स्पष्ट है; ‘दे दिया’ पूर्ण हुई क्रिया को व्यक्त करता है।
- source_word: ἔπιον
  choice: पिया
  rationale: अओरिस्ट क्रिया का सहज आधुनिक हिन्दी रूप।
- source_word: ἐξ αὐτοῦ
  choice: उसमें से
  rationale: नपुंसकलिंग सर्वनाम का पूर्वपद प्याला है; ‘उसमें से’ पात्र में से पीने का स्वाभाविक हिन्दी प्रयोग है।
- source_word: πάντες
  choice: उन सबने
  rationale: यह प्रत्येक सहभागी के पीने पर यूनानी के बल को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: εὐχαριστήσας के संभावित प्रभुभोज-संबंधी निहितार्थ
  choice: धन्यवाद दिया
  alternative: आशीष दी; धन्यवाद की प्रार्थना की
  rationale: εὐχαριστέω का सीधा अर्थ धन्यवाद देना है। पद के बाद के संस्कार-संबंधी महत्त्व को स्वीकार करते हुए भी अनुवाद यूनानी पाठ से परे कोई धर्मविधिक तकनीकी शब्द या यह अतिरिक्त विचार नहीं जोड़ता कि प्याले को ही आशीष दी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। participial संरचना को कठोर शाब्दिक ढंग से रखने के बजाय हिन्दी की स्वाभाविक क्रमबद्ध क्रियाओं में व्यक्त किया गया है।
