  text: οἱ δὲ ἀκούσαντες ἐχάρησαν καὶ ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι. καὶ ἐζήτει πῶς ⸂αὐτὸν εὐκαίρως παραδοῖ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/011.yaml
  text: When they heard it[a], they rejoiced and promised to give him money[b]. And he began seeking how he might betray him at an opportune time.
translation:
  language: hi
  text: यह सुनकर वे प्रसन्न हुए और उन्होंने उसे पैसे[a] देने का वादा किया। फिर वह यह उपाय ढूँढ़ने लगा कि वह यीशु को किसी अनुकूल अवसर पर उनके हवाले[b] कैसे करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चाँदी’। यूनानी शब्द का अर्थ शाब्दिक रूप से चाँदी या सामान्य रूप से पैसे हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘विश्वासघात करके सौंप दे’। यूनानी क्रिया का अर्थ ‘सौंपना’ या ‘हवाले करना’ है; यहाँ इसका प्रयोग यहूदा के विश्वासघाती कार्य के लिए हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ ἀκούσαντες
  choice: यह सुनकर वे
  rationale: कृदन्त की कालगत भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है; ‘यह’ पिछले पद में यहूदा के प्रस्ताव की ओर संकेत करता है।
- source_word: ἐχάρησαν
  choice: आनन्दित हुए
  rationale: उनकी प्रसन्न प्रतिक्रिया के स्पष्ट क्रियात्मक बल को बनाए रखता है और आधुनिक गरिमापूर्ण हिन्दी में स्वाभाविक है।
- source_word: ἐπηγγείλαντο αὐτῷ ἀργύριον δοῦναι
  choice: उन्होंने उसे धन देने का वादा किया
  rationale: ἐπαγγέλλομαι के प्रतिज्ञा/वचन देने के अर्थ और ἀργύριον के सामान्य आर्थिक अर्थ—धन—दोनों को स्पष्ट रूप से व्यक्त करता है; पद कोई राशि नहीं बताता।
- source_word: ἀργύριον
  choice: धन
  rationale: शाब्दिक रूप से ‘चाँदी’ संभव है, पर कोइने प्रयोग में यह सामान्यतः धन को भी दर्शाता है। ‘धन’ किसी आधुनिक मुद्रा या सिक्कों की संख्या का अनावश्यक संकेत नहीं देता।
- source_word: ἐζήτει πῶς
  choice: यह उपाय ढूँढ़ने लगा कि … कैसे
  rationale: अपूर्ण भूतकाल की आरम्भिक और जारी क्रिया को ‘ढूँढ़ने लगा’ व्यक्त करता है; πῶς के साधन/तरीके के अर्थ को ‘कैसे’ बनाए रखता है।
- source_word: εὐκαίρως
  choice: किसी उचित अवसर पर
  rationale: अनुकूल या सुविधाजनक मौके का भाव देता है, बिना यह जोड़े कि वह अवसर किन परिस्थितियों में उचित था।
- source_word: παραδοῖ
  choice: उनके हवाले करे
  rationale: παραδίδωμι के मूल ‘सौंप देना/हवाले करना’ अर्थ को सुरक्षित रखता है। यहूदा और विरोधियों के प्रसंग में हिन्दी वाक्य स्वयं विश्वासघात का भाव देता है, पर क्रिया की वास्तविक अर्थ-व्याप्ति को केवल ‘विश्वासघात करना’ तक सीमित नहीं करता।
- source_word: αὐτόν
  choice: यीशु को
  rationale: लगातार आने वाले ‘उसे’ सर्वनामों से सम्भावित भ्रम दूर करने के लिए प्रसंगगत व्यक्तिवाचक नाम स्पष्ट किया गया है; संदर्भ निर्विवाद रूप से यीशु का है।
theological_decisions:
- issue: यहूदा की क्रिया में παραδίδωμι का अनुवाद
  choice: उनके हवाले करे
  alternative: उसके साथ विश्वासघात करे / उसे पकड़वा दे
  rationale: मूल क्रिया किसी को सौंपने या हवाले करने को दर्शाती है, जबकि इस प्रसंग में वह कार्य विश्वासघाती है। ‘हवाले करे’ मूल क्रिया और प्रसंगगत नैतिक तनाव दोनों को बनाए रखता है; ‘पकड़वा दे’ गिरफ्तारी को अधिक प्रत्यक्ष बनाता, और केवल ‘विश्वासघात करे’ सौंपे जाने की क्रिया को धुंधला कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘रुपये’ से बचा गया है क्योंकि वह आधुनिक मुद्रा का संकेत दे सकता है। मुख्य पाठ में ‘हवाले करना’ मूल क्रिया की अर्थ-व्याप्ति और प्रसंग के विश्वासघाती स्वर दोनों को सुरक्षित रखता है।
