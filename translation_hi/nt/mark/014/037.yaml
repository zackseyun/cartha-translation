  text: καὶ ἔρχεται καὶ εὑρίσκει αὐτοὺς καθεύδοντας, καὶ λέγει τῷ Πέτρῳ· Σίμων, καθεύδεις; οὐκ ἴσχυσας μίαν ὥραν γρηγορῆσαι;
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/037.yaml
  text: And he comes and finds them sleeping[a], and he says to Peter, “Simon, are you sleeping? Were you not able to stay awake one hour?”
translation:
  language: hi
  text: और वह आता है और उन्हें सोते हुए पाता है। वह पतरस से कहता है, “शमौन, क्या तुम सो रहे हो? क्या तुम एक घंटा भी जागते नहीं रह सके?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम एक घंटा भी जागकर चौकसी नहीं कर सके?”
    reason: γρηγορέω में केवल नींद न लेने के साथ-साथ सतर्क होकर चौकसी करने का भाव भी हो सकता है।
lexical_decisions:
- source_word: ἔρχεται
  choice: आता है
  rationale: मरकुस की जीवंत वर्णन-शैली के ऐतिहासिक वर्तमान को बनाए रखा गया है।
- source_word: εὑρίσκει
  choice: पाता है
  rationale: यह भी ऐतिहासिक वर्तमान है; ἔρχεται के साथ वर्तमान काल की संगति रखी गई है।
- source_word: καθεύδοντας
  choice: सोते हुए
  rationale: वर्तमान कृदंत नींद की जारी अवस्था या क्रिया व्यक्त करता है।
- source_word: λέγει
  choice: कहता है
  rationale: मूल के ऐतिहासिक वर्तमान और कथात्मक तात्कालिकता को सुरक्षित रखा गया है।
- source_word: τῷ Πέτρῳ
  choice: पतरस से
  rationale: हिन्दी में किसी से बात कहने की स्वाभाविक रचना के अनुसार दत्तिव कारक को ‘से’ द्वारा व्यक्त किया गया है।
- source_word: Σίμων
  choice: शमौन
  rationale: यीशु पतरस को उसके व्यक्तिगत नाम से संबोधित करते हैं; इसलिए ‘पतरस’ से उसका भेद बनाए रखा गया है।
- source_word: καθεύδεις
  choice: क्या तुम सो रहे हो?
  rationale: वर्तमान काल के सीधे प्रश्न और तत्काल उलाहने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἴσχυσας
  choice: क्या तुम ... न रह सके?
  rationale: इस संदर्भ में ἰσχύω सामर्थ्य या क्षमता बताता है; ‘न रह सके’ शारीरिक बल का अनावश्यक संकेत दिए बिना असमर्थता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μίαν ὥραν
  choice: एक घड़ी भी
  rationale: ‘एक घड़ी’ समय की अवधि को व्यक्त करता है और प्रश्न में ‘भी’ हिन्दी में उलाहने की स्वाभाविक तीव्रता स्पष्ट करता है।
- source_word: γρηγορῆσαι
  choice: जागते रहना
  rationale: सोने के प्रत्यक्ष विरोध में यहाँ जागे रहने का ठोस अर्थ प्रमुख है, जबकि चौकसी का भाव संदर्भ में उपस्थित रहता है।
theological_decisions:
- issue: मरकुस के ऐतिहासिक वर्तमान का संरक्षण
  choice: 'मुख्य कथात्मक क्रियाएँ वर्तमान काल में रखी गईं: ‘आता है’, ‘पाता है’, ‘कहता है’।'
  alternative: सहज हिन्दी कथा के लिए सभी क्रियाएँ सामान्य भूतकाल में देना।
  rationale: वर्तमान काल यहाँ मूल यूनानी की जीवंत कथन-शैली को पठनीय हिन्दी में सुरक्षित रखता है; इससे कोई अनावश्यक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: γρηγορέω का संदर्भगत अर्थ
  choice: ‘जागते रहना’
  alternative: ‘जागकर पहरा देना’ या ‘चौकस रहना’
  rationale: तात्कालिक संदर्भ में शिष्य सो रहे हैं, इसलिए जागे रहने का अर्थ अग्रभूमि में है। फिर भी क्रिया में निहित चौकसी का व्यापक भाव पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शमौन’ और ‘पतरस’ का अंतर मूल के अनुसार बनाए रखा गया है; ऐतिहासिक वर्तमान को जानबूझकर सुरक्षित रखा गया है।
