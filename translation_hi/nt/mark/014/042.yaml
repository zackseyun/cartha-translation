  text: Get up; let us go. Look[a], the one betraying me has come near.
translation:
  language: hi
  text: उठो, चलें। देखो, मुझे धोखा देने वाला[a] पास आ गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मुझे सौंपने वाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγείρεσθε
  choice: उठो
  rationale: यह द्वितीय पुरुष बहुवचन की आज्ञा है। प्रसंग में यीशु शिष्यों को खड़े होकर आगे बढ़ने के लिए कहते हैं; इसलिए ‘उठो’ स्वाभाविक है और केवल नींद से जागने तक अर्थ को सीमित नहीं करता।
- source_word: ἄγωμεν
  choice: चलें
  rationale: यह प्रथम पुरुष बहुवचन का प्रोत्साहनसूचक प्रयोग है। ‘चलें’ संक्षिप्त, स्वाभाविक और ‘आओ, हम चलें’ के समान भाव व्यक्त करता है।
- source_word: ἰδού
  choice: देखो
  rationale: यह आगे की घटना की ओर तुरंत ध्यान खींचने वाला उद्गार है। ‘देखो’ आधुनिक हिन्दी में इसका सीधा और गरिमापूर्ण रूप है।
- source_word: ὁ παραδιδούς με
  choice: मुझे पकड़वाने वाला
  rationale: लेखयुक्त वर्तमान कृदन्त उस व्यक्ति को सूचित करता है जो यीशु को अधिकारियों के हाथ सौंप रहा है। ‘पकड़वाने वाला’ प्रसंग में विश्वासघात और गिरफ्तारी के लिए सौंपे जाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἤγγικεν
  choice: पास आ गया है
  rationale: पूर्णकालिक क्रिया पूरी हो चुकी निकटता और उसकी वर्तमान प्रासंगिकता बताती है। ‘पास आ गया है’ उस पहलू को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दुःखभोग के प्रसंग में παραδίδωμι का अनुवाद
  choice: मुझे पकड़वाने वाला
  alternative: मुझे सौंपने वाला
  rationale: यहाँ कर्ता यहूदा है और कार्य में विश्वासघात का भाव स्पष्ट है, फिर भी यूनानी क्रिया का मूल अर्थ ‘सौंपना’ है। मुख्य पाठ का रूप प्रसंगानुकूल और स्वाभाविक है, जबकि पादटिप्पणी मूल क्रिया की व्यापकता और सम्भावित अर्थ-तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; छोटे आज्ञार्थक वाक्यों से दृश्य की तात्कालिकता बनी रहती है। भाषा सामान्य पाठक के लिए सहज है, पर बोलचाल की अत्यधिक अनौपचारिकता से बचती है।
