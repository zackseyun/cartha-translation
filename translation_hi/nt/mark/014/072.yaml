source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐκ δευτέρου ἀλέκτωρ ἐφώνησεν· καὶ ἀνεμνήσθη ὁ Πέτρος τὸ ῥῆμα ⸀ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς ὅτι Πρὶν ἀλέκτορα ⸂φωνῆσαι δὶς τρίς με ἀπαρνήσῃ⸃, καὶ ἐπιβαλὼν ἔκλαιεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/072.yaml
  text: And immediately a rooster crowed a second time. And Peter remembered the word[a], how Jesus had said to him, “Before a rooster crows twice, you will deny me three times.” And breaking down, he wept.
translation:
  language: hi
  text: और तुरंत मुर्गे ने दूसरी बार बाँग दी। तब पतरस को वह बात याद आई जो यीशु ने उससे कही थी, “मुर्गे के दो बार बाँग देने से पहले तुम तीन बार मेरा इनकार करोगे।” और वह टूटकर रोने लगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह यह सोचकर रोने लगा।” यूनानी कृदन्त ἐπιβαλών का अर्थ कठिन है; इसे मन में इस बात पर विचार करने या किसी बाहरी शारीरिक भंगिमा के संकेत के रूप में भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह क्रिया-विशेषण घटना की तात्कालिकता और मरकुस के वर्णन की तीव्र गति को बनाए रखता है।
- source_word: ἐκ δευτέρου
  choice: दूसरी बार
  rationale: यूनानी पद स्पष्ट रूप से दूसरी बार होने का बोध कराता है; हिन्दी में यही स्वाभाविक और सटीक अभिव्यक्ति है।
- source_word: ἀλέκτωρ ἐφώνησεν
  choice: मुर्गे ने ... बाँग दी
  rationale: मुर्गे की आवाज़ के लिए आधुनिक हिन्दी का स्वाभाविक मुहावरा ‘बाँग देना’ है।
- source_word: ἀνεμνήσθη
  choice: याद आई
  rationale: यहाँ पतरस के पहले कही हुई बात को स्मरण करने का सीधा अर्थ है; ‘पतरस को ... याद आई’ सहज हिन्दी है।
- source_word: τὸ ῥῆμα
  choice: वह बात
  rationale: ῥῆμα यहाँ यीशु के कथन को दर्शाता है। ‘वह बात’ सामान्य पाठक के लिए ‘वह वचन’ से अधिक स्वाभाविक है और अगला उपवाक्य उसका आशय स्पष्ट करता है।
- source_word: ὡς εἶπεν αὐτῷ ὁ Ἰησοῦς
  choice: जो यीशु ने उससे कही थी
  rationale: ὡς यहाँ स्मरण की गई बात का परिचय देता है। हिन्दी में संबंधवाचक रचना पूर्वकालीन कथन को स्पष्ट और सहज ढंग से व्यक्त करती है।
- source_word: Πρὶν ἀλέκτορα φωνῆσαι δὶς
  choice: मुर्गे के दो बार बाँग देने से पहले
  rationale: πρίν और infinitive की कालवाचक रचना तथा δὶς का स्पष्ट संख्यात्मक अर्थ दोनों सुरक्षित रखे गए हैं। हिन्दी में जातिवाचक ‘मुर्गे’ किसी खास पहचाने हुए पक्षी का अनावश्यक संकेत नहीं देता।
- source_word: τρίς με ἀπαρνήσῃ
  choice: तुम तीन बार मेरा इनकार करोगे
  rationale: ἀπαρνέομαι के अस्वीकार/संबंध से मुकरने के अर्थ को ‘मेरा इनकार करना’ स्पष्ट, प्रचलित और धर्मशास्त्रीय रूप से अनिर्दिष्ट ढंग से व्यक्त करता है।
- source_word: ἐπιβαλών
  choice: फूट-फूटकर
  rationale: यह कठिन और विवादित कृदन्त यहाँ रोने के आरम्भ या तीव्रता का संकेत मानकर मुहावरेदार हिन्दी में व्यक्त किया गया है, पर इसकी अनिश्चितता पाद-टिप्पणी में सुरक्षित है।
- source_word: ἔκλαιεν
  choice: रोने लगा
  rationale: अपूर्णकालिक ἔκλαιεν की जारी क्रिया को ‘रोने लगा’ स्वाभाविक कथा-हिन्दी में व्यक्त करता है और भावनात्मक क्रिया के आरम्भ को भी संदर्भानुकूल दिखाता है।
theological_decisions:
- issue: कठिन कृदन्त ἐπιβαλών का अर्थ और पतरस की प्रतिक्रिया का चित्रण
  choice: ‘फूट-फूटकर रोने लगा’ के द्वारा भावनात्मक तीव्रता व्यक्त की गई है।
  alternative: ‘इस बात पर ध्यान करके वह रोने लगा,’ ‘सिर ढककर वह रोने लगा,’ अथवा किसी बाहरी शारीरिक भाव-भंगिमा का संकेत।
  rationale: यूनानी प्रयोग का सटीक आशय विवादित है। मुख्य पाठ प्रसंग में स्पष्ट भावनात्मक प्रभाव देता है, जबकि पाद-टिप्पणी मानसिक क्रिया या शारीरिक भंगिमा जैसी संभावनाओं को खुला रखती है; इस प्रकार पतरस के पश्चात्ताप की किसी एक विशिष्ट बाहरी अभिव्यक्ति को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण कथा-शैली। ‘बाँग दी,’ ‘याद आई,’ और ‘इनकार करोगे’ जैसे सामान्य प्रयोग चुने गए हैं। कठिन यूनानी अभिव्यक्ति को मुख्य पाठ में प्रवाहपूर्ण रखा गया है और उसकी वास्तविक अनिश्चितता पाद-टिप्पणी में दी गई है।
