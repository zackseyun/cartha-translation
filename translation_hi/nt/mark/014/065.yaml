source:
  edition: SBLGNT
  text: καὶ ἤρξαντό τινες ἐμπτύειν αὐτῷ καὶ περικαλύπτειν ⸂αὐτοῦ τὸ πρόσωπον⸃ καὶ κολαφίζειν αὐτὸν καὶ λέγειν αὐτῷ· Προφήτευσον, καὶ οἱ ὑπηρέται ῥαπίσμασιν αὐτὸν ⸀ἔλαβον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/065.yaml
  text: And some began to spit on him[a], and to cover his face, and to strike him with their fists, and to say to him[b], “Prophesy!” And the officers received him with blows.
translation:
  language: hi
  text: और कुछ लोग उस पर थूकने लगे, उसका चेहरा ढकने लगे[a], उसे घूँसे मारने लगे और उससे कहने लगे, “भविष्यवाणी कर!” और पहरेदारों ने उसे थप्पड़ों से मारा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँखों पर पट्टी बाँधने लगे।” यूनानी में शाब्दिक रूप से, “उसका चेहरा ढकने लगे” है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी अभिव्यक्ति शाब्दिक रूप से, “पहरेदारों ने उसे थप्पड़ों के साथ लिया” है; इसका अर्थ “पहरेदारों ने उसे थप्पड़ मारे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤρξαντό
  choice: लगे
  rationale: सहायक क्रिया ‘लगे’ आरंभसूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: τινες
  choice: कुछ लोग
  rationale: यह अनिश्चित बहुवचन है और समूह के अनिर्दिष्ट सदस्यों को सूचित करता है।
- source_word: ἐμπτύειν αὐτῷ
  choice: उस पर थूकने
  rationale: दत्तिव के साथ क्रिया प्रत्यक्ष अपमान को व्यक्त करती है; हिन्दी में ‘उस पर थूकना’ स्वाभाविक है।
- source_word: περικαλύπτειν αὐτοῦ τὸ πρόσωπον
  choice: उसका चेहरा ढकने
  rationale: मूल यूनानी के शब्दार्थ को सुरक्षित रखता है और प्रयोजन ‘आँखों पर पट्टी बाँधना’ को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: κολαφίζειν αὐτὸν
  choice: उसे घूँसे मारने
  rationale: κολαφίζω सामान्यतः मुट्ठी से प्रहार करने का बोध देता है; ‘घूँसे मारना’ उसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: λέγειν αὐτῷ· Προφήτευσον
  choice: उससे कहने लगे, “भविष्यवाणी कर!”
  rationale: नंगे आज्ञार्थक और उसके उपहासपूर्ण स्वर को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: ὑπηρέται
  choice: पहरेदारों
  rationale: न्यायिक प्रसंग में यह घरेलू सेवकों के बजाय अधीनस्थ अधिकारियों अथवा रक्षकों के लिए है; ‘पहरेदार’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: ῥαπίσμασιν
  choice: थप्पड़ मारते हुए
  rationale: ῥάπισμα हाथ से मारे गए प्रहार का बोध दे सकता है; यहाँ यह पहले आए घूँसों से भी स्वाभाविक भेद रखता है।
- source_word: ἔλαβον
  choice: अपने कब्ज़े में लिया
  rationale: λαμβάνω के मूल ‘लेना/पकड़ना’ भाव को हिन्दी के स्वाभाविक मुहावरे में रखता है, जबकि साथ का करणवाचक पद दुर्व्यवहार का ढंग बताता है।
theological_decisions:
- issue: उपहासपूर्ण आज्ञा Προφήτευσον और यीशु की पहचान
  choice: “भविष्यवाणी कर!”
  alternative: “हमें भविष्यवाणी करके बता!” / “दिखा कि तू नबी है!”
  rationale: यूनानी पाठ में केवल आज्ञार्थक है। संक्षिप्त रूप कथात्मक विडंबना और धार्मिक तनाव को बनाए रखता है, पर ऐसी व्याख्या नहीं जोड़ता जो पाठ में स्पष्ट नहीं है।
- issue: अंतिम वाक्यांश ῥαπίσμασιν αὐτὸν ἔλαβον का अर्थ
  choice: उसे थप्पड़ मारते हुए अपने कब्ज़े में लिया
  alternative: उसे थप्पड़ मारे / प्रहारों से उसका स्वागत किया
  rationale: यूनानी अभिव्यक्ति असामान्य है और शाब्दिक रूप से ‘प्रहारों के साथ उसे लिया’ के निकट है। मुख्य पाठ में λαμβάνω का ग्रहण/पकड़ने का भाव रखा गया है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। क्रियाओं की पुनरावृत्ति मूल की क्रमिक हिंसा को बनाए रखती है। ‘भविष्यवाणी कर’ में कोई व्याख्यात्मक पूरक नहीं जोड़ा गया।
