  text: καὶ ἐξῆλθον οἱ ⸀μαθηταὶ καὶ ἦλθον εἰς τὴν πόλιν καὶ εὗρον καθὼς εἶπεν αὐτοῖς, καὶ ἡτοίμασαν τὸ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/016.yaml
  text: And the disciples went out and came into the city[a], and found it just as he had told them, and they prepared the Passover.
translation:
  language: hi
  text: और चेले निकले और नगर में आए, और जैसा उसने उनसे कहा था, वैसा ही पाया; और उन्होंने फसह[a] की तैयारी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फसह के भोजन की तैयारी की।” यूनानी में “फसह” से सामान्य रूप से पर्व या, इस संदर्भ में, तैयार किया जाने वाला भोजन अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθον
  choice: निकलकर
  rationale: पूर्व स्थान से प्रस्थान का भाव स्वाभाविक हिन्दी में व्यक्त करता है और अगले क्रियापद से सहज रूप से जुड़ता है।
- source_word: μαθηταὶ
  choice: चेले
  rationale: सुसमाचारों में यीशु के अनुयायियों और शिक्षार्थियों के लिए प्रचलित, सामान्य हिन्दी शब्द।
- source_word: ἦλθον εἰς τὴν πόλιν
  choice: नगर में आए
  rationale: यूनानी में गति का लक्ष्य और भीतर प्रवेश दोनों व्यक्त हैं; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: πόλιν
  choice: नगर
  rationale: πόλις का सीधा अर्थ यहाँ यरूशलेम नगर है; संदर्भ में नाम जोड़े बिना निश्चितता बनाए रखी गई है।
- source_word: εὗρον
  choice: वैसा ही पाया
  rationale: यूनानी में कर्म निहित है; 'वैसा ही पाया' परिस्थितियों को बिना अनावश्यक विवरण जोड़े स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθὼς εἶπεν αὐτοῖς
  choice: जैसा उसने उनसे कहा था
  rationale: καθώς की अनुरूपता और पहले दिए गए निर्देश की कालगत प्राथमिकता दोनों सुरक्षित रहती हैं।
- source_word: ἡτοίμασαν
  choice: तैयारी की
  rationale: ἑτοιμάζω के 'तैयार करना' अर्थ को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: मूल की व्यापक अभिव्यक्ति को बनाए रखता है, जो पर्व अथवा संदर्भ में फसह के भोजन की ओर संकेत कर सकती है।
theological_decisions:
- issue: τὸ πάσχα का संदर्भगत विस्तार
  choice: मुख्य पाठ में 'फसह'
  alternative: '''फसह का भोजन'''
  rationale: मूल यूनानी अभिव्यक्ति पर्व और भोजन दोनों के लिए प्रयुक्त हो सकती है; मुख्य पाठ में व्यापक अर्थ और पादटिप्पणी में संदर्भगत विकल्प रखने से वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। 'चेले' और 'फसह' जैसे प्रचलित बाइबलीय शब्द रखे गए हैं। मुख्य पाठ में यूनानी की पुनरावृत्त संयोजक संरचना को पठनीय हिन्दी वाक्य-विन्यास में ढाला गया है।
