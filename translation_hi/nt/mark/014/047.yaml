  text: εἷς δέ ⸀τις τῶν παρεστηκότων σπασάμενος τὴν μάχαιραν ἔπαισεν τὸν δοῦλον τοῦ ἀρχιερέως καὶ ἀφεῖλεν αὐτοῦ τὸ ⸀ὠτάριον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/047.yaml
  text: But one of those standing nearby drew his sword and struck the high priest’s servant[a], and cut off his ear.
translation:
  language: hi
  text: परन्तु पास खड़े लोगों में से एक ने अपनी तलवार खींचकर महायाजक के दास[a] पर वार किया और उसका कान काट दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक”; यूनानी शब्द δοῦλος का अर्थ “दास” भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἷς δέ τις
  choice: परन्तु ... एक
  rationale: εἷς ... τις समूह में से किसी एक अनाम व्यक्ति को प्रस्तुत करता है; δέ का हल्का विरोध/कथात्मक संक्रमण ‘परन्तु’ से व्यक्त हुआ है।
- source_word: τῶν παρεστηκότων
  choice: पास खड़े लोगों में से
  rationale: पूर्णकालिक कृदन्त वहाँ उपस्थित और निकट खड़े लोगों को दर्शाता है; यह हिन्दी में स्वाभाविक रूप से स्थानिक भाव बनाए रखता है।
- source_word: σπασάμενος τὴν μάχαιραν
  choice: अपनी तलवार खींचकर
  rationale: हथियार के प्रसंग में σπάομαι का अर्थ म्यान से निकालना है। यूनानी निश्चित उपपद को हिन्दी की स्वाभाविक संबंधसूचक अभिव्यक्ति ‘अपनी’ से प्रस्तुत किया गया है।
- source_word: ἔπαισεν
  choice: पर वार किया
  rationale: παίω यहाँ हिंसक प्रहार को सूचित करता है; ‘वार किया’ तलवार के प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: τὸν δοῦλον τοῦ ἀρχιερέως
  choice: महायाजक के दास
  rationale: δοῦλος की बंधित और अधीन सामाजिक स्थिति को ‘दास’ सुरक्षित रखता है; ἀρχιερεύς के लिए प्रचलित बाइबिलीय पद ‘महायाजक’ है।
- source_word: ἀφεῖλεν αὐτοῦ τὸ ὠτάριον
  choice: उसका कान काट दिया
  rationale: ἀφαιρέω मूलतः हटाने को दर्शाता है, पर तलवार के हिंसक प्रसंग में परिणाम को स्वाभाविक हिन्दी में ‘काट दिया’ कहा जाता है। ὠτάριον का लघुतासूचक रूप यहाँ केवल ‘कान’ के अर्थ में है।
theological_decisions:
- issue: सामाजिक स्थिति के प्रसंग में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: महायाजक से संबंधित δοῦλος अधीनता और स्वामित्व-संबंध वाली स्थिति सूचित कर सकता है। ‘दास’ इस सामाजिक वास्तविकता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है, जबकि पादटिप्पणी स्वाभाविक वैकल्पिक शब्द देती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पास खड़े’, ‘तलवार खींचकर’ और ‘वार किया’ कथात्मक गति तथा मूल के स्थानिक और हिंसक भाव को बनाए रखते हैं।
