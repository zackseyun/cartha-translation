  text: καὶ ⸂προελθὼν μικρὸν ἔπιπτεν⸃ ἐπὶ τῆς γῆς, καὶ προσηύχετο ἵνα εἰ δυνατόν ἐστιν παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/035.yaml
  text: And going a little farther[a], he fell to the ground and was praying that, if it were possible, the hour might pass from him.
translation:
  language: hi
  text: और थोड़ा आगे जाकर[a] वह भूमि पर गिर पड़ा और प्रार्थना करता रहा कि यदि संभव हो, तो वह घड़ी उससे टल जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘कुछ आगे बढ़कर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: προελθὼν μικρὸν
  choice: थोड़ा आगे जाकर
  rationale: यह वाक्यांश दूसरों से थोड़ी दूरी आगे जाने को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और μικρόν की अल्प दूरी तथा προελθών की आगे बढ़ने की भावना दोनों बनाए रखता है।
- source_word: ἔπιπτεν ἐπὶ τῆς γῆς
  choice: भूमि पर गिर पड़ा
  rationale: अपूर्ण भूतकाल ἔπιπτεν यहाँ वर्णनात्मक या आरंभसूचक हो सकता है। ‘गिर पड़ा’ कथा में गति और अचानक भूमि पर जाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: προσηύχετο
  choice: प्रार्थना करता रहा
  rationale: अपूर्ण भूतकाल प्रार्थना की जारी क्रिया को दर्शाता है; ‘करता रहा’ उसके कालगत विस्तार को बनाए रखता है।
- source_word: ἵνα
  choice: कि
  rationale: यहाँ ἵνα प्रार्थना की विषय-वस्तु को प्रस्तुत करता है। हिन्दी में ‘कि’ स्वाभाविक है और अनावश्यक रूप से केवल प्रयोजन का अर्थ नहीं थोपता।
- source_word: εἰ δυνατόν ἐστιν
  choice: यदि संभव हो
  rationale: यह शर्त और संभावना दोनों को संक्षिप्त, स्वाभाविक तथा गंभीर हिन्दी में व्यक्त करता है।
- source_word: παρέλθῃ ἀπ’ αὐτοῦ ἡ ὥρα
  choice: वह घड़ी उससे टल जाए
  rationale: ‘वह घड़ी’ मूल के निश्चित पदबंध को बनाए रखती है, जबकि ‘टल जाए’ हिन्दी में आने वाले संकट या नियत दुःख के हट जाने की प्रार्थना को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ‘घड़ी’ का अर्थ
  choice: मूल रूपक को ‘वह घड़ी’ के रूप में बनाए रखा गया है।
  alternative: ‘वह समय’ या ‘दुःख का समय’
  rationale: मरकुस में यह अभिव्यक्ति यीशु के निकट आते दुःख और मृत्यु के नियत समय का गहरा संकेत देती है। इसे व्याख्यात्मक पदबंध में बदलने के बजाय पाठ की धार्मिक और कथात्मक गंभीरता तथा तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भूमि’ और ‘प्रार्थना’ औपचारिकता तथा स्पष्टता बनाए रखते हैं; वाक्य-रचना मूल यूनानी के घटनाक्रम और जारी प्रार्थना को स्वाभाविक हिन्दी में प्रस्तुत करती है।
