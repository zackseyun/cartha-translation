  text: ὁ ⸀δὲ εἶπεν αὐτοῖς· ⸀Εἷς τῶν δώδεκα, ὁ ἐμβαπτόμενος μετ’ ἐμοῦ εἰς ⸀τὸ τρύβλιον·
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/020.yaml
  text: And he said to them[a], “One of the twelve, the one dipping with me into the bowl.”
translation:
  language: hi
  text: उसने उनसे कहा, “बारहों में से एक—वही जो मेरे साथ कटोरे[a] में डुबो रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “थाली।” यूनानी शब्द τρύβλιον भोजन के लिए इस्तेमाल होने वाले कटोरे या थाली को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: उसने
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है। हिन्दी में अलग से ‘और’ जोड़ना आवश्यक नहीं; सीधे वाक्य से प्रसंग स्वाभाविक रूप से आगे बढ़ता है।
- source_word: εἶπεν αὐτοῖς
  choice: उसने उनसे कहा
  rationale: यह λέγω के सामान्य अर्थ और αὐτοῖς के संबोधन को सरल, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: Εἷς τῶν δώδεκα
  choice: बारहों में से एक
  rationale: यह यीशु के निकटतम बारह शिष्यों के समूह में से एक व्यक्ति को सूचित करता है और आधुनिक हिन्दी में सहज है।
- source_word: ὁ ἐμβαπτόμενος
  choice: वही जो ... डुबो रहा है
  rationale: वर्तमान कृदन्त की जारी और पहचान कराने वाली शक्ति को ‘वही जो ... रहा है’ से व्यक्त किया गया है; यूनानी में डुबोई जाने वाली वस्तु स्पष्ट नहीं है, इसलिए हिन्दी में भी उसे नहीं जोड़ा गया।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: μετά के संबंधवाचक रूप का साथ या सहभागिता का सीधा अर्थ सुरक्षित रहता है।
- source_word: εἰς τὸ τρύβλιον
  choice: कटोरे में
  rationale: τρύβλιον भोजन के लिए प्रयुक्त कटोरे या थाली को सूचित कर सकता है। हिन्दी में ‘में डुबोना’ लक्ष्यगत गति को स्वाभाविक रूप से व्यक्त करता है; ‘कटोरा’ मुख्य पाठ में सहज विकल्प है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘वही’ यूनानी लेखयुक्त कृदन्त की पहचान कराने वाली शक्ति को उभारता है, जबकि वाक्य की मूल संक्षिप्तता और अधूरा-सा उत्तर सुरक्षित रखा गया है।
