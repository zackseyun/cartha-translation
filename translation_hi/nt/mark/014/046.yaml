  yaml_path: translation/nt/mark/014/046.yaml
  text: Then they laid hands on him and seized him[a][b].
translation:
  language: hi
  text: तब उन्होंने उस पर हाथ डाले और उसे पकड़ लिया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस पर अपने हाथ रखे।’ यूनानी अभिव्यक्ति किसी को पकड़ लेने का मुहावरा है, प्रायः उसे बंदी बनाने के लिए।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसे बंदी बना लिया।’
    reason: alternative_reading
lexical_decisions:
- source_word: οἱ δὲ
  choice: तब उन्होंने
  rationale: οἱ सर्वनामवत् ‘उन्होंने’ के अर्थ में है, और δέ कथा में हल्का परिवर्तन या अगली घटना की ओर बढ़ना दिखाता है। ‘तब’ स्वाभाविक हिन्दी कथात्मक क्रम देता है, बिना प्रबल विरोध का भाव जोड़े।
- source_word: ἐπέβαλαν τὰς χεῖρας αὐτῷ
  choice: उस पर हाथ डाले
  rationale: यह यूनानी मुहावरा किसी को बलपूर्वक पकड़ने, विशेषकर बंदी बनाने के उद्देश्य से हाथ डालने का भाव रखता है। हिन्दी में ‘हाथ डालना’ उस प्रतिकूल और बलपूर्ण भाव को बनाए रखता है तथा अगले क्रियापद से अनावश्यक पुनरुक्ति नहीं करता।
- source_word: ἐκράτησαν αὐτόν
  choice: उसे पकड़ लिया
  rationale: κρατέω यहाँ बलपूर्वक पकड़कर अपने वश में कर लेने का अर्थ देता है। ‘पकड़ लिया’ स्वाभाविक और सटीक है; प्रसंग में गिरफ्तारी निहित है, पर अनुवाद में कानूनी प्रक्रिया का अतिरिक्त भाव नहीं जोड़ा गया।
