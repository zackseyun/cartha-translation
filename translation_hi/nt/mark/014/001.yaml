source:
  edition: SBLGNT
  text: Ἦν δὲ τὸ πάσχα καὶ τὰ ἄζυμα μετὰ δύο ἡμέρας. καὶ ἐζήτουν οἱ ἀρχιερεῖς καὶ οἱ γραμματεῖς πῶς αὐτὸν ἐν δόλῳ κρατήσαντες ἀποκτείνωσιν,
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/001.yaml
  text: The Passover and Unleavened Bread were two days away[a]. And the chief priests and the scribes were seeking how, by deceit, they might arrest him and kill him[c][b],
translation:
  language: hi
  text: फ़सह और अख़मीरी रोटी का पर्व[b] होने में दो दिन बाकी थे[a]। प्रधान याजक और शास्त्री ढूँढ़ रहे थे कि कैसे उसे छल से पकड़कर[c] मार डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “दो दिन बाद।” अभिप्राय है कि फ़सह और अख़मीरी रोटी का पर्व निकट था।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से “अख़मीरी [वस्तुएँ/रोटियाँ]”; यह अख़मीरी रोटी के पर्व का प्रचलित संक्षिप्त उल्लेख था।
    reason: cultural_note
  - marker: c
    text: या “गिरफ़्तार करके” अथवा “काबू में करके।”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἦν δὲ
  choice: थे
  rationale: δέ का हल्का कथात्मक संक्रमण हिंदी में अलग संयोजक जोड़े बिना स्वाभाविक रूप से व्यक्त होता है; समय-सूचक ‘अब’ मूल में नहीं है।
- source_word: τὸ πάσχα
  choice: फ़सह
  rationale: यह यहूदी फ़सह पर्व के लिए हिंदी में प्रचलित और स्रोत-संगत नाम है।
- source_word: τὰ ἄζυμα
  choice: अख़मीरी रोटी का पर्व
  rationale: शाब्दिक अर्थ ‘अख़मीरी [वस्तुएँ/रोटियाँ]’ है, पर पर्व-संदर्भ में यह अख़मीरी रोटी के पर्व का प्रचलित संक्षिप्त उल्लेख है।
- source_word: μετὰ δύο ἡμέρας
  choice: होने में दो दिन बाकी थे
  rationale: शाब्दिक ‘दो दिन बाद’ का आशय यह है कि पर्व निकट था; चुना हुआ रूप आधुनिक हिंदी में यही समय-संबंध स्पष्ट करता है।
- source_word: ἐζήτουν
  choice: इस खोज में थे
  rationale: अपूर्णकाल उनके जारी प्रयास और योजना को व्यक्त करता है, केवल एक क्षणिक विचार को नहीं।
- source_word: οἱ ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन पद मंदिर-व्यवस्था के प्रमुख याजकीय अधिकारियों को दर्शाता है; यह केवल एक महायाजक का उल्लेख नहीं है।
- source_word: οἱ γραμματεῖς
  choice: शास्त्री
  rationale: धर्मशास्त्र के लेखन और व्याख्या से जुड़े इस समूह के लिए यह संक्षिप्त, प्रतिष्ठित और प्रचलित हिंदी पद है।
- source_word: ἐν δόλῳ
  choice: छल से
  rationale: δόλος में धोखे और कपट का नैतिक भाव है; ‘चुपके से’ केवल गोपनीयता बताकर इस भाव को संकुचित कर देता।
- source_word: κρατήσαντες
  choice: पकड़कर
  rationale: क्रिया का मूल भाव पकड़ने या काबू में करने का है। संदर्भ में गिरफ्तारी निहित हो सकती है, पर ‘पकड़कर’ स्रोत की व्यापकता बनाए रखता है।
- source_word: ἀποκτείνωσιν
  choice: मार डालें
  rationale: यह क्रिया जान से मारने का सीधा अर्थ देती है; चुना हुआ रूप स्वाभाविक और स्पष्ट हिंदी है।
theological_decisions:
- issue: फ़सह और अख़मीरी रोटी के पर्व का संबंध
  choice: दोनों नामों को ‘फ़सह और अख़मीरी रोटी का पर्व’ के रूप में बनाए रखना
  alternative: दोनों को पूरी तरह अलग-अलग पर्वों के रूप में दोहराना, या एक संयुक्त नाम में विलीन कर देना
  rationale: यूनानी पाठ दोनों पदों का स्पष्ट उल्लेख करता है, जबकि ऐतिहासिक व्यवहार में वे निकटता से जुड़े थे। हिंदी वाक्य दोनों नाम सुरक्षित रखते हुए अनावश्यक रूप से उनके संबंध का निर्णय नहीं करता।
- issue: अगुवों की योजना का नैतिक स्वरूप
  choice: ἐν δόλῳ को ‘छल से’ कहना
  alternative: ‘चुपके से’ या ‘गुप्त रूप से’
  rationale: मूल शब्द केवल गोपनीयता नहीं, बल्कि धोखे को व्यक्त करता है; इसलिए नैतिक तनाव को स्पष्ट रूप से सुरक्षित रखा गया है।
- issue: κρατήσαντες में आधिकारिक गिरफ्तारी का भाव
  choice: मुख्य पाठ में ‘पकड़कर’
  alternative: ‘गिरफ़्तार करके’ या ‘काबू में करके’
  rationale: संदर्भ आधिकारिक गिरफ्तारी की ओर संकेत करता है, पर यूनानी पद स्वयं अधिक व्यापक है। मुख्य पाठ स्रोत की व्यापकता रखता है और पादटिप्पणी संदर्भगत विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘फ़सह,’ ‘प्रधान याजक’ और ‘शास्त्री’ जैसे परिचित बाइबलीय पद बनाए गए हैं। वाक्य-विन्यास स्वाभाविक हिंदी का है, जबकि छल, जारी षड्यंत्र और पकड़ने की क्रिया में मौजूद स्रोतगत अर्थ-सीमा सुरक्षित है।
