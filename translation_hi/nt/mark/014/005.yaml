source:
  edition: SBLGNT
  text: ἠδύνατο γὰρ τοῦτο ⸂τὸ μύρον⸃ πραθῆναι ἐπάνω ⸂δηναρίων τριακοσίων⸃ καὶ δοθῆναι τοῖς πτωχοῖς· καὶ ἐνεβριμῶντο αὐτῇ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/014/005.yaml
  text: For this perfume could have been sold for more than three hundred denarii and given to the poor.” And they scolded her[a][b].
translation:
  language: hi
  text: क्योंकि यह इत्र[a] तीन सौ दीनार से अधिक में बेचा जा सकता था और उसका धन गरीबों को दिया जा सकता था।” और वे उसे कड़ी फटकार लगाने लगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुगंधित तेल” अथवा “सुगंधित लेप।”
    reason: lexical_alternative
  - marker: b
    text: या “वे उसे कठोरता से डाँटने लगे।” यूनानी क्रिया तीव्र अप्रसन्नता और कड़ी निंदा का भाव व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μύρον
  choice: इत्र
  rationale: यह शब्द सुगंधित तेल या लेप को दर्शाता है। ‘इत्र’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग में महँगे सुगंधित पदार्थ का भाव स्पष्ट करता है।
- source_word: πραθῆναι
  choice: बेचा जा सकता था
  rationale: δύναμαι के साथ यह निष्क्रिय अनंत रूप उस संभावना को व्यक्त करता है जो पूरी नहीं हुई; हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: ἐπάνω δηναρίων τριακοσίων
  choice: तीन सौ दीनार से अधिक में
  rationale: ἐπάνω राशि के संबंध में बताता है कि मूल्य बताई गई संख्या से अधिक था; ऐतिहासिक मुद्रा ‘दीनार’ को आधुनिक मुद्रा में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: δοθῆναι τοῖς πτωχοῖς
  choice: उसका धन गरीबों को दिया जा सकता था
  rationale: ग्रीक में ‘दिया जाना’ सीधे तेल के बजाय बिक्री से प्राप्त रकम की ओर संकेत करता है। हिन्दी में ‘उसका धन’ इस निहित आशय को सहज और स्पष्ट बनाता है।
- source_word: ἐνεβριμῶντο αὐτῇ
  choice: वे उसे कड़ी फटकार लगाने लगे
  rationale: क्रिया तीव्र अप्रसन्नता और कठोर मौखिक निंदा का भाव रखती है। अपूर्णकाल निरंतर या आरंभ हुई कार्रवाई को सूचित कर सकता है, जिसे ‘लगने लगे’ व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद में की गई शिकायत का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में संबंध को साफ़ और स्वाभाविक बनाता है।
