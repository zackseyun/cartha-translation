  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ऐतिहासिक मुद्रा के लिए प्रचलित बाइबलीय रूप ‘दीनार’ रखा गया है। मुख्य पाठ में प्रत्यक्ष कथन का आरंभ पिछले पद में होने के कारण यहाँ केवल समापन उद्धरण-चिह्न है।
