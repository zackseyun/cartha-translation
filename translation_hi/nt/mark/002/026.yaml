id: MRK.2.26
reference: Mark 2:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀πῶς εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ ἐπὶ Ἀβιαθὰρ ἀρχιερέως καὶ τοὺς ἄρτους τῆς προθέσεως ἔφαγεν, οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ ⸂τοὺς ἱερεῖς⸃, καὶ ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/026.yaml
  text: how he entered into the house of God in the time of Abiathar the high priest[a], and ate the bread of the Presence, which it is not lawful to eat except for the priests[b], and also gave some to those who were with him?
translation:
  language: hi
  text: कि कैसे वह महायाजक अबियातार के समय[a] परमेश्वर के भवन में गया और उपस्थिति की रोटियाँ[b] खाईं, जिन्हें याजकों के सिवा किसी को खाने की अनुमति नहीं थी, और उसने अपने साथियों को भी दीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अबियातार के महायाजकत्व के दौरान।” इस पदबंध को अधिक व्यापक अर्थ में महायाजक अबियातार से जुड़े समय या वृत्तांत के संदर्भ के रूप में भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “उपस्थिति की रोटियाँ” वे पवित्र रोटियाँ थीं जो पवित्र स्थान में परमेश्वर के सामने रखी जाती थीं; इन्हें परंपरागत रूप से “भेंट की रोटियाँ” भी कहा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: πῶς
  choice: कि कैसे
  rationale: यह पहले से चल रहे प्रश्न में दाऊद के कार्य का विवरण प्रस्तुत करता है; हिन्दी में ‘कि कैसे’ इस आश्रित वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: εἰσῆλθεν εἰς τὸν οἶκον τοῦ θεοῦ
  choice: परमेश्वर के भवन में गया
  rationale: ‘गया’ प्रवेश के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है, जबकि ‘परमेश्वर का भवन’ यूनानी पदबंध की पवित्र-स्थान संबंधी भाषा बनाए रखता है।
- source_word: ἐπὶ Ἀβιαθὰρ ἀρχιερέως
  choice: महायाजक अबियातार के समय
  rationale: ἐπί के साथ संबंधकारक यहाँ काल-संबंधी अर्थ दे सकता है। यह अनुवाद किसी अधिक संकीर्ण कालक्रमिक दावे को थोपे बिना यूनानी की व्यापकता बनाए रखता है।
- source_word: ἄρτους τῆς προθέσεως
  choice: उपस्थिति की रोटियाँ
  rationale: यह पवित्र स्थान में परमेश्वर के सामने रखी जाने वाली रोटियों के भाव को संक्षिप्त रूप में सुरक्षित रखता है; अर्थ सांस्कृतिक टिप्पणी में स्पष्ट किया गया है।
- source_word: ἔφαγεν
  choice: खाईं
  rationale: साधारण पूर्ण भूतकाल यूनानी कथात्मक एओरिस्ट को स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन ‘रोटियाँ’ के अनुसार क्रिया स्त्रीलिंग बहुवचन है।
- source_word: οὓς οὐκ ἔξεστιν φαγεῖν εἰ μὴ τοὺς ἱερεῖς
  choice: जिन्हें याजकों को छोड़ किसी और के लिए खाना उचित नहीं है
  rationale: यह कानूनी-पवित्र अनुमति के अर्थ को स्पष्ट करता है और बताता है कि अपवाद केवल याजक हैं। ‘उचित’ यहाँ अनुमत/विधिसम्मत होने का भाव देता है।
- source_word: ἔδωκεν καὶ τοῖς σὺν αὐτῷ οὖσιν
  choice: और उसने अपने साथियों को भी दीं
  rationale: ‘अपने साथियों’ से उसके साथ उपस्थित लोगों का अर्थ सहजता से आता है; ‘दीं’ का निहित कर्म वही रोटियाँ हैं।
theological_decisions:
- issue: अबियातार से जुड़े काल-सूचक पदबंध और 1 शमूएल 21 के समानांतर वृत्तांत के बीच तनाव
  choice: मुख्य पाठ में ‘महायाजक अबियातार के समय’
  alternative: ‘अबियातार के महायाजकत्व के दौरान’ अथवा अधिक व्यापक रूप से ‘महायाजक अबियातार से जुड़े समय या वृत्तांत में’
  rationale: यूनानी पदबंध व्यापक काल-संदर्भ की अनुमति देता है। मुख्य पाठ कालक्रम को कृत्रिम रूप से सुलझाता नहीं, और पाद-टिप्पणी वास्तविक व्याख्यात्मक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध। पद पूर्ववर्ती प्रश्न का आश्रित भाग है, इसलिए आरंभ में ‘कि कैसे’ रखा गया है। सांस्कृतिक पद को मुख्य पाठ में संक्षिप्त रखा गया और पाद-टिप्पणी में स्पष्ट किया गया है।
