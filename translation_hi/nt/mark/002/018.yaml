source:
  edition: SBLGNT
  text: Καὶ ἦσαν οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀Φαρισαῖοι νηστεύοντες. καὶ ἔρχονται καὶ λέγουσιν αὐτῷ· Διὰ τί οἱ μαθηταὶ Ἰωάννου καὶ οἱ ⸀μαθηταὶ τῶν Φαρισαίων νηστεύουσιν, οἱ δὲ σοὶ μαθηταὶ οὐ νηστεύουσιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/018.yaml
  text: John's disciples and the Pharisees were fasting. And they come and say to him[a], "Why do John's disciples and the disciples of the Pharisees fast, but your disciples do not fast?"
translation:
  language: hi
  text: यूहन्ना के चेले और फरीसी उपवास कर रहे थे। और वे आकर उससे कहते हैं[a], “यूहन्ना के चेले और फरीसियों के चेले उपवास क्यों करते हैं, पर तुम्हारे चेले उपवास नहीं करते?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुछ लोग आकर उससे कहते हैं।” यूनानी पाठ में “आते हैं” और “कहते हैं” का कर्ता स्पष्ट नहीं किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἦσαν ... νηστεύοντες
  choice: उपवास कर रहे थे
  rationale: अपूर्णकालीन εἰμί और वर्तमान कृदंत की परिधीय रचना अतीत में जारी क्रिया व्यक्त करती है; हिन्दी में यह स्वाभाविक रूप से ‘कर रहे थे’ से व्यक्त होती है।
- source_word: οἱ μαθηταὶ Ἰωάννου
  choice: यूहन्ना के चेले
  rationale: सम्बन्धकारक यहाँ गुरु से संबद्धता बताता है। ‘चेले’ आधुनिक साधारण हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: οἱ Φαρισαῖοι
  choice: फरीसी
  rationale: यह इस यहूदी धार्मिक समूह के नाम का हिन्दी में प्रचलित रूप है।
- source_word: ἔρχονται καὶ λέγουσιν
  choice: वे आकर उससे कहते हैं
  rationale: दोनों यूनानी क्रियाएँ ऐतिहासिक वर्तमान में हैं। वर्तमान काल रखकर मरकुस की सजीव कथाशैली सुरक्षित की गई है; ‘आकर’ हिन्दी में क्रियाओं का स्वाभाविक संयोजन है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाली इस यूनानी अभिव्यक्ति का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: οἱ μαθηταὶ τῶν Φαρισαίων
  choice: फरीसियों के चेले
  rationale: सम्बन्धकारक को स्पष्ट रखते हुए समूह और उसके अनुयायियों का संबंध व्यक्त किया गया है।
- source_word: νηστεύουσιν
  choice: उपवास करते हैं
  rationale: वर्तमान काल यहाँ प्रचलित या नियमित अभ्यास को व्यक्त कर सकता है; ‘करते हैं’ उस अर्थ को बिना उसे केवल इसी क्षण की क्रिया बनाने के सुरक्षित रखता है।
- source_word: οἱ δὲ σοὶ μαθηταὶ
  choice: पर तेरे चेले
  rationale: δέ का विरोध ‘पर’ से और σοί का संबंध एकवचन अनौपचारिक ‘तेरे’ से व्यक्त हुआ है, जो यीशु को सीधे संबोधित करने के प्रसंग में स्वाभाविक है।
theological_decisions:
- issue: ‘वे आकर उससे कहते हैं’ में कर्ता की पहचान
  choice: मुख्य पाठ में केवल ‘वे’ रखा गया और किसी विशिष्ट समूह की पहचान नहीं जोड़ी गई।
  alternative: ‘कुछ लोग आकर उससे कहते हैं’ या संदर्भ के आधार पर किसी खास समूह को कर्ता बताना।
  rationale: यूनानी में ἔρχονται और λέγουσιν का कर्ता व्यक्त नहीं है। हिन्दी में क्रिया के लिए सर्वनाम आवश्यक होने के कारण ‘वे’ रखा गया है, पर पाद-टिप्पणी मूल की अस्पष्टता बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेले’ सामान्य पाठक के लिए ‘शिष्य’ की अपेक्षा अधिक बोलचाल-सुलभ है, जबकि ‘उपवास’ धार्मिक संदर्भ की आवश्यक स्पष्टता बनाए रखता है। ऐतिहासिक वर्तमान को हिन्दी में वर्तमान काल द्वारा सुरक्षित रखा गया है।
