  to: और जाते हुए उसने हलफई के पुत्र लेवी को चुंगी की चौकी[a] पर बैठे देखा और उससे कहा, “मेरे पीछे आओ।” तब वह उठकर उसके पीछे चल पड़ा।
  rationale: The revision removes the unsupported “वहाँ से,” replaces dated idioms with natural modern Hindi, and preserves the narrative action and the verbal connection between Jesus’ call and Levi’s response. The past-tense “कहा” remains a defensible natural Hindi rendering of Mark’s historical present. The footnote documents the lexical range of τελώνιον without over-specifying the setting.
