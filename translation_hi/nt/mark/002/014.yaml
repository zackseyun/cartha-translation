  source_fidelity: 'The draft conveys the core sequence accurately: Jesus sees Levi, calls him, and Levi rises and responds. However, “वहाँ से” introduces a specific deictic point not expressed by παράγων, and the command/response pair “मेरे पीछे हो ले ... उसके पीछे हो लिया” is less natural in contemporary standard Hindi than a direct following expression.'
  naturalness: “मेरे पीछे हो ले” and especially “उसके पीछे हो लिया” sound dated or regionally/idiomatically marked rather than idiomatic modern standard Hindi. “मेरे पीछे आओ” and “उसके पीछे चल पड़ा” are clear, natural narrative Hindi and retain the call-and-response linkage.
  terminology: “हलफई,” “लेवी,” and “चुंगी की चौकी” are suitable. A lexical footnote should be retained for “चुंगी की चौकी,” since τελώνιον may also denote a toll/customs collection point. The historical present λέγει may appropriately be regularized to past tense in Hindi.
  issues:
  - severity: medium
    issue: “वहाँ से” is not represented in the Greek text.
    rationale: παράγων means passing by/going along; it does not specify “from there.” Removing the added deictic element better preserves source precision.
  - severity: medium
    issue: The expressions “मेरे पीछे हो ले” and “उसके पीछे हो लिया” are not optimal modern standard Hindi.
    rationale: They can be understood, but are stylistically dated and less idiomatic. A natural imperative and response better serve the stated target variant without narrowing ἀκολουθέω to a purely doctrinal paraphrase.
  - severity: low
    issue: The tax-booth lexical alternative lacks a Hindi footnote anchor and note.
    rationale: The English audit trail identifies a genuine lexical alternative for τελώνιον. Supplying the anchor and note preserves the documented translation decision.
