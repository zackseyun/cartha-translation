source:
  edition: SBLGNT
  text: καὶ παράγων εἶδεν Λευὶν τὸν τοῦ Ἁλφαίου καθήμενον ἐπὶ τὸ τελώνιον, καὶ λέγει αὐτῷ· Ἀκολούθει μοι. καὶ ἀναστὰς ἠκολούθησεν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/014.yaml
  text: And as he was passing by[a], he saw Levi the son of Alphaeus sitting at the tax booth, and he says to him, “Follow me.” And he rose and followed him.
translation:
  language: hi
  text: और जाते हुए उसने हलफई के पुत्र लेवी को चुंगी की चौकी[a] पर बैठे देखा और उससे कहा, “मेरे पीछे आओ।” तब वह उठकर उसके पीछे चल पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महसूल-चौकी।” यूनानी शब्द उस स्थान को सूचित कर सकता है जहाँ कर या सीमा-शुल्क वसूला जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: παράγων
  choice: वहाँ से जाते हुए
  rationale: वर्तमान कृदंत की चल रही, मुख्य क्रिया के साथ-साथ घटित क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। संदर्भगत ‘वहाँ से’ गति को स्पष्ट करता है, बिना गंतव्य जोड़े।
- source_word: εἶδεν
  choice: देखा
  rationale: ὁράω के सामान्य अर्थ को सीधे रखता है; ‘ध्यान दिया’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: Λευὶν
  choice: लेवी
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: τὸν τοῦ Ἁλφαίου
  choice: हलफई के पुत्र
  rationale: यूनानी संबंधकारक में निहित पितृ-संबंध को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: καθήμενον
  choice: बैठे
  rationale: जब यीशु ने लेवी को देखा, उस समय उसकी अवस्था को सरल और प्रत्यक्ष ढंग से व्यक्त करता है।
- source_word: ἐπὶ τὸ τελώνιον
  choice: चुंगी की चौकी पर
  rationale: τελώνιον कर या सीमा-शुल्क वसूलने के स्थान को दर्शाता है। ‘चुंगी की चौकी’ ऐतिहासिक संदर्भ में ठोस और हिन्दी पाठकों के लिए बोधगम्य है।
- source_word: λέγει
  choice: कहा
  rationale: यद्यपि यूनानी में मरकुस का ऐतिहासिक वर्तमान है, आधुनिक हिन्दी कथन में भूतकाल अधिक स्वाभाविक है; घटना का अर्थ और जीवंतता प्रसंग से बनी रहती है।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे हो ले
  rationale: आदेश और शिष्य के रूप में अनुसरण—दोनों भावों को स्वाभाविक हिन्दी में रखता है, तथा उत्तर में प्रयुक्त उसी क्रिया से शब्द-संबंध बनाए रखता है।
- source_word: ἀναστὰς
  choice: उठकर
  rationale: पूर्ववर्ती क्रिया और मुख्य क्रिया का क्रम संक्षिप्त, सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἠκολούθησεν αὐτῷ
  choice: उसके पीछे हो लिया
  rationale: यीशु की आज्ञा और लेवी की प्रतिक्रिया के बीच क्रियात्मक शब्द-संबंध सुरक्षित रखता है; केवल शारीरिक चलने या केवल औपचारिक शिष्य बनने तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: मरकुस के ऐतिहासिक वर्तमान λέγει का कथात्मक काल
  choice: स्वाभाविक हिन्दी कथन के अनुसार ‘कहा’
  alternative: ‘कहता है’ कहकर यूनानी ऐतिहासिक वर्तमान को रूपगत रूप से बनाए रखना
  rationale: हिन्दी में बीच कथा में ‘कहता है’ संभव है, पर इस वाक्य में ‘देखा ... कहा’ अधिक स्वाभाविक और स्पष्ट है। यह काल-सामान्यीकरण कथ्य या किसी धर्मवैज्ञानिक निष्कर्ष को नहीं बदलता।
- issue: ἀκολουθέω में शारीरिक अनुसरण और शिष्यत्व का संबंध
  choice: ‘मेरे पीछे हो ले ... उसके पीछे हो लिया’
  alternative: ‘मेरा शिष्य बन ... उसका शिष्य बन गया’
  rationale: 'मूल क्रिया की वास्तविक अस्पष्टता और व्यापकता सुरक्षित रखी गई है: लेवी यीशु के साथ चला भी और उसके बुलावे को स्वीकार भी किया। ‘शिष्य बन गया’ अकेले रखने से क्रिया का दृश्य पक्ष व्याख्यात्मक रूप से दब जाता।'
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘चुंगी की चौकी’ ऐतिहासिक कर-संग्रह स्थल के लिए चुना गया है। यूनानी ऐतिहासिक वर्तमान को हिन्दी में स्वाभाविक भूतकाल से व्यक्त किया गया है।
