  text: ἦσαν δέ τινες τῶν γραμματέων ἐκεῖ καθήμενοι καὶ διαλογιζόμενοι ἐν ταῖς καρδίαις αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/006.yaml
  text: 'But some of the scribes were sitting there[a], reasoning in their hearts:'
translation:
  language: hi
  text: 'पर शास्त्रियों में से कुछ वहाँ बैठे हुए अपने मन में विचार कर रहे थे:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦσαν δέ
  choice: पर ... थे
  rationale: δέ यहाँ कथा का रुख उन लोगों की भीतरी प्रतिक्रिया की ओर मोड़ता और हल्का विरोध सूचित करता है; आधुनिक हिन्दी में ‘पर’ इसे सहज रूप से व्यक्त करता है।
- source_word: τινες τῶν γραμματέων
  choice: शास्त्रियों में से कुछ
  rationale: τινες के साथ संबंधकारक बहुवचन अंशवाचक है; यह स्पष्ट करता है कि सभी नहीं, उनमें से कुछ लोग अभिप्रेत हैं। ‘शास्त्री’ सुसमाचारों के इस धार्मिक-सामाजिक समूह के लिए प्रचलित हिन्दी शब्द है।
- source_word: ἐκεῖ καθήμενοι
  choice: वहाँ बैठे हुए
  rationale: ἐκεῖ स्थान को और καθήμενοι दृश्य में उनकी जारी मुद्रा को सीधे तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διαλογιζόμενοι
  choice: विचार कर रहे थे
  rationale: क्रिया यहाँ भीतर चल रहे सोच-विचार या तर्क-विमर्श को बताती है; ‘विचार कर रहे थे’ हिन्दी में स्वाभाविक है और अगले पद में प्रकट होने वाली आपत्ति को समय से पहले स्पष्ट नहीं करता।
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: अपने मन में
  rationale: यूनानी का शाब्दिक रूप ‘अपने हृदयों में’ है, पर यहाँ καρδία भीतरी विचार का स्थान बताने वाला बाइबलीय मुहावरा है। आधुनिक हिन्दी में ‘अपने मन में’ उसी अर्थ को सहज रूप से संप्रेषित करता है।
theological_decisions:
- issue: καρδίαις का मानव-स्वभाव संबंधी मुहावरा
  choice: अपने मन में
  alternative: अपने हृदयों में
  rationale: यहाँ ‘हृदय’ आधुनिक भावनात्मक अर्थ तक सीमित नहीं, बल्कि भीतर के विचार और विवेचना का केंद्र है। ‘मन में’ प्रसंग का अर्थ स्पष्ट रखता है और मन-हृदय के किसी कृत्रिम धर्मवैज्ञानिक विभाजन को नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विचार कर रहे थे’ आंतरिक विवेचना को व्यक्त करता है, जबकि पदांत का विराम-चिह्न अगले पद में उसके विषय की ओर ले जाता है।
