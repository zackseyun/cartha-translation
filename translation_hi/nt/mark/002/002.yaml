source:
  edition: SBLGNT
  text: ⸀καὶ συνήχθησαν πολλοὶ ὥστε μηκέτι χωρεῖν μηδὲ τὰ πρὸς τὴν θύραν, καὶ ἐλάλει αὐτοῖς τὸν λόγον.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/002.yaml
  text: And many were gathered together[a], so that there was no longer room, not even at the door, and he was speaking the word to them.
translation:
  language: hi
  text: और बहुत-से लोग इकट्ठे हो गए, यहाँ तक कि द्वार के पास भी जगह नहीं रही; और वह उन्हें वचन[a] सुना रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संदेश।” यूनानी में “वचन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: συνήχθησαν πολλοὶ
  choice: बहुत-से लोग इकट्ठे हो गए
  rationale: कर्मवाच्य रूप से व्यक्त लोगों के एक स्थान पर जमा हो जाने का परिणाम हिन्दी में स्वाभाविक ढंग से प्रकट होता है; συν- का सामूहिक भाव ‘इकट्ठे’ में बना रहता है।
- source_word: ὥστε μηκέτι χωρεῖν
  choice: यहाँ तक कि ... जगह नहीं रही
  rationale: ὥστε के परिणामसूचक अर्थ और μηκέτι के ‘अब और नहीं’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μηδὲ τὰ πρὸς τὴν θύραν
  choice: द्वार के पास भी
  rationale: यह यूनानी मुहावरा द्वार की ओर या उसके पास की जगह को सूचित करता है; ‘भी’ इस बात पर बल देता है कि वहाँ तक कोई स्थान शेष नहीं था।
- source_word: ἐλάλει αὐτοῖς
  choice: वह उन्हें ... सुना रहा था
  rationale: अपूर्ण भूतकाल की जारी क्रिया को ‘रहा था’ सुरक्षित रखता है। प्रसंग में ‘सुना रहा था’ श्रोताओं को संदेश कहने का स्वाभाविक हिन्दी प्रयोग है, बिना इसे अधिक विशिष्ट रूप से ‘प्रचार’ कहना।
- source_word: τὸν λόγον
  choice: वचन
  rationale: ‘वचन’ λόγος की पाठगत अभिव्यक्ति को सुरक्षित रखता है और यहाँ बोले जा रहे संदेश का अर्थ ग्रहण कर सकता है, जबकि ‘परमेश्वर का’ जैसे अनुपस्थित शब्द नहीं जोड़ता।
theological_decisions:
- issue: यीशु के कथन के संदर्भ में τὸν λόγον का अर्थ
  choice: वचन
  alternative: संदेश
  rationale: ‘वचन’ मूल यूनानी की अभिव्यक्ति और उसकी धार्मिक अनुगूँज को बनाए रखता है, फिर भी पद में स्पष्ट न किए गए ‘परमेश्वर का वचन’ को नहीं जोड़ता। ‘संदेश’ अर्थ की स्वाभाविक वैकल्पिक व्याख्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। ‘द्वार’ औपचारिक किन्तु सामान्य बाइबलीय शब्द है, और ‘जगह नहीं रही’ भीड़ के कारण स्थान समाप्त हो जाने को सहज रूप से बताता है।
