  source_fidelity: The draft preserves the repetition marker, the shoreline setting, the collective sense of the crowd, and the ongoing force of both Greek imperfects. However, ‘गए’ does not adequately represent ἐξῆλθεν (‘went out’); the departure/outward movement should be expressed.
