    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξῆλθεν
  choice: गए
  rationale: संदर्भ में ἐξέρχομαι का स्वाभाविक हिन्दी रूप ‘गए’ है; ‘बाहर निकले’ स्रोत की संरचना के अधिक निकट होता, पर हिन्दी में किसी स्पष्ट स्थान से निकलने का अनावश्यक बोध करा सकता है।
- source_word: πάλιν
  choice: फिर
  rationale: पुनरावृत्ति को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: παρὰ τὴν θάλασσαν
  choice: झील के किनारे
  rationale: παρά के स्थान-संबंधी अर्थ को ‘किनारे’ स्पष्ट करता है। मरकुस के भौगोलिक संदर्भ में θάλασσα गलील की झील को सूचित करता है, इसलिए हिन्दी में स्वाभाविक ‘झील’ चुना गया।
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: एकवचन सामूहिक संज्ञा के साथ πᾶς ὁ का स्वाभाविक और अर्थ-सटीक हिन्दी रूप।
- source_word: ἤρχετο
  choice: आती रही
  rationale: यूनानी अपूर्ण भूतकाल की जारी या बार-बार घटित होती क्रिया का भाव बनाए रखता है।
- source_word: πρὸς αὐτόν
  choice: उनके पास
  rationale: किसी व्यक्ति की ओर आकर उसके निकट पहुँचने का स्वाभाविक हिन्दी प्रयोग।
- source_word: ἐδίδασκεν
  choice: शिक्षा देते रहे
  rationale: अपूर्ण भूतकाल की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह सर्वनाम पीछे उल्लिखित भीड़ के लोगों की ओर संकेत करता है।
