id: MRK.2.20
reference: Mark 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος, καὶ τότε νηστεύσουσιν ἐν ⸂ἐκείνῃ τῇ ἡμέρᾳ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/020.yaml
  text: But days will come when the bridegroom is taken away from them[a], and then they will fast in that day.
translation:
  language: hi
  text: पर वे दिन आएँगे, जब दूल्हा उनसे छीन लिया जाएगा; तब वे उस दिन[a] उपवास करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “उस दिन”; यूनानी वाक्यांश एकवचन में है, “उन दिनों” नहीं।
    reason: मूल पाठ के एकवचन और पहले आए बहुवचन “दिन” के बीच का अंतर स्पष्ट करना।
lexical_decisions:
- source_word: ἐλεύσονται δὲ ἡμέραι
  choice: पर वे दिन आएँगे
  rationale: यह यूनानी मुहावरे की भावी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है। δέ को “पर” से व्यक्त किया गया है, जिससे पिछली स्थिति के साथ विरोध स्पष्ट होता है।
- source_word: ὅταν
  choice: जब
  rationale: ἀπαρθῇ के साथ यह भविष्य में होने वाली घटना का संकेत देता है; इस प्रसंग में “जब” स्वाभाविक है, न कि बार-बार होने का भाव देने वाला “जब कभी।”
- source_word: ἀπαρθῇ ἀπ’ αὐτῶν
  choice: उनसे छीन लिया जाएगा
  rationale: निष्क्रिय वाच्य और अलग किए जाने की तीव्रता दोनों सुरक्षित रहती हैं, पर कार्य करने वाले या घटना के ढंग को स्पष्ट नहीं किया जाता।
- source_word: ὁ νυμφίος
  choice: दूल्हा
  rationale: यह आधुनिक हिन्दी का सहज और सटीक शब्द है तथा विवाह का रूपक बनाए रखता है।
- source_word: καὶ τότε
  choice: तब
  rationale: दूल्हे के अलग किए जाने और उपवास के बीच का क्रम स्पष्ट करता है; हिन्दी में अलग से “और” आवश्यक नहीं है।
- source_word: νηστεύσουσιν
  choice: उपवास करेंगे
  rationale: यह νηστεύω का प्रचलित धार्मिक और सामान्य हिन्दी रूप है तथा भविष्यकाल को स्पष्ट रखता है।
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यूनानी पद एकवचन है। हिन्दी में समय के लिए “उस दिन” स्वाभाविक है और मूल की विशिष्टता बनाए रखता है।
theological_decisions:
- issue: दूल्हे के रूपक में यीशु की पहचान
  choice: “दूल्हा” रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: “जब मैं उनसे छीन लिया जाऊँगा”
  rationale: प्रसंग में यीशु अपनी ओर संकेत करते हैं, फिर भी मूल पाठ स्वयं-उल्लेख के स्थान पर रूपक का प्रयोग करता है; अनुवाद उसी साहित्यिक और धर्मवैचारिक बल को सुरक्षित रखता है।
- issue: दूल्हे को अलग किए जाने का स्वरूप
  choice: “छीन लिया जाएगा” द्वारा निष्क्रिय वाच्य रखा गया है, पर कर्ता या मृत्यु का स्पष्ट उल्लेख नहीं किया गया।
  alternative: “मार डाला जाएगा और उनसे अलग हो जाएगा”
  rationale: यह कथन यीशु के भावी हटाए जाने की ओर संकेत करता है, जिसे उनकी मृत्यु से जोड़ा जाता है, पर इस पद में न कर्ता बताया गया है, न मृत्यु स्पष्ट रूप से कही गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “दूल्हा,” “छीन लिया जाएगा,” और “उपवास” सामान्य पाठक के लिए स्पष्ट हैं। अर्धविराम घटनाक्रम के दूसरे चरण को स्वाभाविक रूप से उभारता है।
