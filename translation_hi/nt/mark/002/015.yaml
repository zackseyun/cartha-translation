source:
  edition: SBLGNT
  text: Καὶ ⸀γίνεται κατακεῖσθαι αὐτὸν ἐν τῇ οἰκίᾳ αὐτοῦ, καὶ πολλοὶ τελῶναι καὶ ἁμαρτωλοὶ συνανέκειντο τῷ Ἰησοῦ καὶ τοῖς μαθηταῖς αὐτοῦ, ἦσαν γὰρ πολλοὶ καὶ ⸀ἠκολούθουν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/015.yaml
  text: And it happened that he was reclining at table in his house[a], and many tax collectors and sinners were reclining with Jesus and his disciples, for there were many, and they were following him.
translation:
  language: hi
  text: फिर ऐसा हुआ कि वह उसके घर में भोजन करने बैठा था[a]। बहुत-से चुंगी लेनेवाले और पापी यीशु और उसके चेलों के साथ भोजन करने बैठे थे, क्योंकि वे बहुत-से थे और उसका अनुसरण करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लेवी के घर में’; कुछ लोग इसे ‘यीशु के घर में’ समझते हैं। यूनानी में केवल ‘उसके घर में’ है।
    reason: वैकल्पिक समझ; यूनानी सर्वनाम के पूर्वपद की अस्पष्टता।
lexical_decisions:
- source_word: γίνεται
  choice: फिर ऐसा हुआ
  rationale: मरकुस के ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथात्मक शैली में रखा गया है; ‘फिर’ कथा की प्रगति दिखाता है।
- source_word: κατακεῖσθαι / συνανέκειντο
  choice: भोजन करने बैठा था / भोजन करने बैठे थे
  rationale: यूनानी शब्द उस समय भोजन के लिए टेक लगाकर लेटने की मुद्रा बताते हैं। सामान्य आधुनिक हिन्दी में ‘भोजन करने बैठना’ भोजन-संदर्भ को स्वाभाविक रूप से व्यक्त करता है और इसे केवल लेटना नहीं समझने देता।
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: उसके घर में
  rationale: यूनानी सर्वनाम की अस्पष्टता बनाए रखी गई है; मुख्य पाठ में घर के स्वामी को लेवी या यीशु के रूप में निश्चित नहीं किया गया।
- source_word: τελῶναι
  choice: चुंगी लेनेवाले
  rationale: यह तत्कालीन राजस्व-वसूली करनेवालों के लिए प्रचलित और सामान्य हिन्दी पद है।
- source_word: ἁμαρτωλοὶ
  choice: पापी
  rationale: स्रोत के सीधे सामाजिक-धार्मिक संबोधन को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: μαθηταῖς
  choice: चेले
  rationale: यीशु के साथ सीखने और उनका अनुसरण करनेवालों के लिए सहज, प्रचलित हिन्दी शब्द।
- source_word: ἦσαν γὰρ πολλοὶ
  choice: क्योंकि ऐसे बहुत-से लोग थे
  rationale: γάρ के व्याख्यात्मक संबंध को ‘क्योंकि’ से रखा गया है और ‘ऐसे लोग’ निकटवर्ती चुंगी लेनेवालों और पापियों की ओर स्वाभाविक संकेत करता है।
- source_word: ἠκολούθουν αὐτῷ
  choice: वे उसके पीछे चलते थे
  rationale: अपूर्ण भूतकाल की जारी या अभ्यस्त क्रिया को ‘चलते थे’ से व्यक्त किया गया है; वाक्यांश शिष्यवत अनुसरण के अर्थ को भी खुला रखता है।
theological_decisions:
- issue: ‘उसके घर’ (αὐτοῦ) का पूर्वपद
  choice: मुख्य पाठ में ‘उसके घर’ रखकर स्वामी को अनिर्दिष्ट छोड़ा गया।
  alternative: इसे ‘लेवी के घर’ या ‘यीशु के घर’ के रूप में स्पष्ट करना।
  rationale: निकट संदर्भ के कारण बहुत-से पाठक इसे लेवी का घर समझते हैं, जबकि कुछ इसे यीशु का घर मानते हैं। यूनानी केवल ‘उसके घर’ कहता है, इसलिए अनुवाद किसी एक व्याख्या को मुख्य पाठ में स्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। प्राचीन भोजन-मुद्रा का शाब्दिक ‘लेटना’ सामान्य पाठक को भ्रमित कर सकता था, इसलिए भोजन-संदर्भ में स्वाभाविक ‘बैठना’ चुना गया। ‘उसके घर’ की वास्तविक स्रोतगत अस्पष्टता जानबूझकर सुरक्षित रखी गई है।
