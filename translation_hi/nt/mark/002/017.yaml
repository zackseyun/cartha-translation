reference: Mark 2:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἀκούσας ὁ Ἰησοῦς λέγει αὐτοῖς ⸀ὅτι Οὐ χρείαν ἔχουσιν οἱ ἰσχύοντες ἰατροῦ ἀλλ’ οἱ κακῶς ἔχοντες· οὐκ ἦλθον καλέσαι δικαίους ἀλλὰ ⸀ἁμαρτωλούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/017.yaml
  text: And when Jesus heard it, he says to them, “Those who are strong have no need of a physician, but those who are sick. I did not come to call the righteous, but sinners.”
translation:
  language: hi
  text: यह सुनकर यीशु उनसे कहते हैं, “जो स्वस्थ हैं[a], उन्हें वैद्य की आवश्यकता नहीं, बल्कि रोगियों को है। मैं धर्मियों[b] को नहीं, बल्कि पापियों को बुलाने आया हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक अर्थ ‘जो बलवान’ या ‘जो सशक्त हैं’ है; वैद्य के संदर्भ में इसका अर्थ ‘जो स्वस्थ हैं’ है।
    reason: lexical_alternative
  - marker: b
    text: प्रसंग में ‘धर्मियों’ को विडम्बनापूर्वक—अर्थात् जिन्हें धर्मी माना जाता है या जो स्वयं को धर्मी मानते हैं—समझा जा सकता है; यूनानी पाठ केवल ‘धर्मियों’ कहता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀκούσας
  choice: यह सुनकर
  rationale: अओरिस्ट कृदंत को स्वाभाविक हिन्दी में पूर्वकालिक क्रिया के रूप में रखा गया है। ‘यह’ निकटवर्ती प्रसंग में सुनी गई बात की ओर संकेत करता है, जिसे यूनानी में व्यक्त नहीं किया गया।
- source_word: λέγει
  choice: कहते हैं
  rationale: मरकुस के ऐतिहासिक वर्तमान को सुरक्षित रखते हुए वर्तमानकाल रखा गया है।
- source_word: οἱ ἰσχύοντες
  choice: जो बलवान हैं
  rationale: यह ἰσχύω के मूल अर्थ ‘बलवान/सशक्त होना’ को बनाए रखता है; चिकित्सा-संदर्भ में ‘स्वस्थ’ भी सम्भव है।
- source_word: χρείαν ἔχουσιν
  choice: आवश्यकता नहीं
  rationale: यूनानी मुहावरे का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: ἰατροῦ
  choice: वैद्य
  rationale: चिकित्सक के लिए संक्षिप्त, प्रतिष्ठित और सामान्यतः बोधगम्य शब्द, जो उक्तिपरक शैली के अनुकूल है।
- source_word: οἱ κακῶς ἔχοντες
  choice: रोगियों
  rationale: शाब्दिक अर्थ ‘जिनकी दशा बुरी है’ चिकित्सा-संदर्भ में बीमार लोगों को दर्शाता है।
- source_word: οὐκ ἦλθον ... καλέσαι
  choice: बुलाने आया हूँ
  rationale: हिन्दी में मिशन-वक्तव्य के लिए स्वाभाविक अभिव्यक्ति; ‘बुलाना’ καλέω की व्यापकता को बनाए रखता है और ‘निमंत्रित करना’ या ‘शिष्य बनाना’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: δικαίους
  choice: धर्मियों
  rationale: नैतिक-धार्मिक श्रेणी को संक्षेप में रखता है और मुख्य पाठ में विडम्बना को अनिवार्य नहीं बनाता।
- source_word: ἁμαρτωλούς
  choice: पापियों
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का मानक और प्रसंगानुकूल हिन्दी रूप।
theological_decisions:
- issue: ‘धर्मियों’ को सीधे अर्थ में लिया जाए या विडम्बनापूर्वक
  choice: मुख्य पाठ में केवल ‘धर्मियों’ रखा गया
  alternative: ‘जो अपने को धर्मी समझते हैं’
  rationale: प्रसंग में यह कथन विडम्बनापूर्ण सुनाई दे सकता है, पर यूनानी पाठ स्वयं केवल ‘धर्मियों’ कहता है। व्याख्यात्मक तनाव को बनाए रखने के लिए विस्तार को पाद-टिप्पणी में रखा गया है।
- issue: ἀκούσας का अव्यक्त कर्म
  choice: ‘यह सुनकर’ में ‘यह’ जोड़ा गया
  alternative: ‘सुनकर’
  rationale: निकटवर्ती प्रसंग स्पष्ट करता है कि यीशु ने अभी कही गई बात सुनी; ‘यह’ हिन्दी में सहज संदर्भ देता है, बिना विषय-वस्तु को अधिक निर्दिष्ट किए।
- issue: ऐतिहासिक वर्तमान λέγει
  choice: ‘कहते हैं’
  alternative: ‘कहा’
  rationale: वर्तमानकाल मरकुस की जीवंत कथन-शैली को सुरक्षित रखता है और कोई सैद्धान्तिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण और उक्तिपरक शैली अपनाई गई है। ‘वैद्य’, ‘धर्मी’ और ‘पापी’ बाइबलीय प्रसंग में परिचित हैं, फिर भी सामान्य पाठक के लिए बोधगम्य रहते हैं।
