  to: यह सुनकर यीशु उनसे कहते हैं, “जो स्वस्थ हैं[a], उन्हें वैद्य की आवश्यकता नहीं, बल्कि रोगियों को है। मैं धर्मियों[b] को नहीं, बल्कि पापियों को बुलाने आया हूँ।”
  rationale: The revision makes the medical contrast idiomatic and clear in modern standard Hindi while retaining the Greek lexical nuance in a footnote. It retains the historical present (‘कहते हैं’), does not over-specify what Jesus heard, and leaves the possible irony of ‘धर्मियों’ in the footnote rather than imposing it on the text.
