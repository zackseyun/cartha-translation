  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς· Μὴ δύνανται οἱ υἱοὶ τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν νηστεύειν; ὅσον χρόνον ⸂ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν⸃ οὐ δύνανται νηστεύειν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/019.yaml
  text: And Jesus said to them[a], “The wedding guests cannot fast while the bridegroom is with them, can they? As long as they have the bridegroom with them, they cannot fast.”
translation:
  language: hi
  text: और यीशु ने उनसे कहा, “जब तक दूल्हा उनके साथ है, क्या विवाह-उत्सव में शामिल लोग भला उपवास कर सकते हैं? जब तक दूल्हा उनके साथ है, वे उपवास नहीं कर सकते।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ δύνανται ... νηστεύειν;
  choice: क्या ... उपवास कर सकते हैं?
  rationale: μή के साथ यह आलंकारिक प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिंदी में संदर्भ सहित ‘क्या ... कर सकते हैं?’ स्वाभाविक है और अगला वाक्य अपेक्षित नकार को स्पष्ट करता है।
- source_word: οἱ υἱοὶ τοῦ νυμφῶνος
  choice: विवाह के सहभागी
  rationale: शाब्दिक मुहावरा ‘विवाह-कक्ष के पुत्र’ आधुनिक हिंदी में अस्पष्ट होगा। यह पद विवाह-उत्सव में सम्मिलित लोगों, विशेषकर दूल्हे के साथियों, को सूचित करता है; ‘सहभागी’ अतिसंकीर्ण अर्थ से बचता है।
- source_word: ἐν ᾧ ... ἐστιν
  choice: जब तक ... साथ है
  rationale: यहाँ संरचना स्थान से अधिक समय का बोध कराती है। हिंदी में ‘जब तक’ अवधि और प्रश्न का आशय स्पष्ट करता है।
- source_word: ὁ νυμφίος / τὸν νυμφίον
  choice: दूल्हा
  rationale: ‘दूल्हा’ आधुनिक मानक हिंदी में स्वाभाविक और स्पष्ट है तथा मूल रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ
  rationale: μετά यहाँ संगति या साथ होने का अर्थ देता है; ‘उनके साथ’ इसका सीधा हिंदी रूप है।
- source_word: ὅσον χρόνον
  choice: जब तक
  rationale: यह अवधि सूचक अभिव्यक्ति है; ‘जब तक’ सहज हिंदी में वही कालगत सीमा व्यक्त करता है।
- source_word: ἔχουσιν τὸν νυμφίον μετ’ αὐτῶν
  choice: दूल्हा उनके साथ है
  rationale: यद्यपि मूल में ἔχουσιν (‘वे रखते/पाते हैं’) है, हिंदी में ‘दूल्हे को अपने साथ रखते हैं’ कृत्रिम या स्वामित्वसूचक लगेगा। ‘दूल्हा उनके साथ है’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ εἶπεν αὐτοῖς ὁ Ἰησοῦς
  choice: और यीशु ने उनसे कहा
  rationale: यह सरल, गरिमापूर्ण और सामान्य कथात्मक हिंदी है।
theological_decisions:
- issue: यीशु का दूल्हे के रूप में रूपकात्मक संकेत
  choice: दूल्हे का रूपक ज्यों का त्यों रखा गया है, पर उसकी धर्मवैज्ञानिक पहचान को पाठ में स्पष्ट नहीं किया गया।
  alternative: व्याख्यात्मक अनुवाद द्वारा मसीही या दैवी दूल्हे की छवि को अधिक उभारना।
  rationale: मूल पाठ रूपक प्रस्तुत करता है और पाठक को उसके निहितार्थ ग्रहण करने देता है। अनुवाद को उससे आगे बढ़कर किसी धर्मसैद्धांतिक निष्कर्ष को पाठ में नहीं जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘विवाह के सहभागी’ व्यापक सामाजिक अर्थ को बनाए रखता है, जबकि पादटिप्पणी मूल मुहावरे की शाब्दिक छवि सुरक्षित रखती है।
