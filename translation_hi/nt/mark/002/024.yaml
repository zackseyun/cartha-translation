  text: καὶ οἱ Φαρισαῖοι ἔλεγον αὐτῷ· Ἴδε τί ⸀ποιοῦσιν τοῖς σάββασιν ὃ οὐκ ἔξεστιν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/024.yaml
  text: And the Pharisees were saying to him[a], “Look, why are they doing what is not permitted on the Sabbath?”
translation:
  language: hi
  text: और फ़रीसी उससे कह रहे थे, “देखिए, वे सब्त के दिन वह काम क्यों कर रहे हैं जिसकी अनुमति नहीं है?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखिए, वे सब्त के दिन ऐसा क्या कर रहे हैं जिसकी अनुमति नहीं है?” यूनानी में τί का अर्थ “क्या” लिया जा सकता है, हालाँकि इस प्रसंग में “क्यों” का भाव अधिक संभावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सामान्य कथात्मक संयोजक; मूल यूनानी में निहित न होने वाला अतिरिक्त कालगत अर्थ नहीं जोड़ता।
- source_word: οἱ Φαρισαῖοι
  choice: फ़रीसी
  rationale: इस यहूदी धार्मिक समूह के लिए प्रचलित और सहज हिन्दी नाम।
- source_word: ἔλεγον
  choice: कह रहे थे
  rationale: अपूर्ण भूतकाल की जारी या पुनरावृत्त क्रिया को सरल भूतकाल की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: αὐτῷ
  choice: उससे
  rationale: एकवचन दत्तिव का स्वाभाविक हिन्दी रूप; संदर्भ में इसका संकेत यीशु की ओर है।
- source_word: Ἴδε
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाली आज्ञा को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है; बहुवचन आदरसूचक रूप संबोधित व्यक्ति के प्रति सामान्य शिष्टता दिखाता है।
- source_word: τί
  choice: क्यों
  rationale: शिकायत के प्रसंग में τί क्रियाविशेषण की तरह ‘क्यों’ का भाव देता है, यद्यपि उसका शाब्दिक पाठ ‘क्या’ भी संभव है।
- source_word: ποιοῦσιν
  choice: वे ... कर रहे हैं
  rationale: प्रत्यक्ष कथन में वर्तमान काल की जारी क्रिया को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: यूनानी बहुवचन यहाँ सामी प्रभाव वाला मुहावरा है और एक सब्त-दिन को दर्शाता है; हिन्दी में एकवचन स्वाभाविक है।
- source_word: ὃ οὐκ ἔξεστιν
  choice: वह काम ... जिसकी अनुमति नहीं है
  rationale: कानूनी-धार्मिक अनुमेयता का भाव स्पष्ट रखता है, पर यह तय नहीं करता कि निषेध का स्रोत मूसा की व्यवस्था है, फ़रीसी परंपरा है या कोई अन्य व्याख्या।
theological_decisions:
- issue: फ़रीसियों की आपत्ति का आधार
  choice: “जिसकी अनुमति नहीं है” कहकर केवल अनुमेयता संबंधी आरोप व्यक्त किया गया है।
  alternative: “जो व्यवस्था के विरुद्ध है” या “जो गैरकानूनी है”
  rationale: मूल यूनानी οὐκ ἔξεστιν निषेध या अननुमति बताता है, लेकिन यह स्पष्ट नहीं करता कि उसका आधार पवित्रशास्त्रीय व्यवस्था, फ़रीसी परंपरा या व्यापक हलाखिक व्याख्या है। अनुवाद इस तनाव को खुला रखता है।
- issue: τί का प्रश्नार्थक बल
  choice: मुख्य पाठ में “क्यों”
  alternative: “क्या”
  rationale: इस शिकायतपूर्ण प्रसंग में ‘क्यों’ स्वाभाविक आशय है, लेकिन यूनानी के ‘क्या’ वाले संभावित वाक्य-विन्यास को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। “सब्त” प्रचलित बाइबलीय शब्द है। “उससे” मूल के एकवचन को बनाए रखता है, जबकि उद्धरण में “देखिए” स्वाभाविक आदरसूचक संबोधन है।
