  text: ⸂καὶ ἰδὼν⸃ ὁ Ἰησοῦς τὴν πίστιν αὐτῶν λέγει τῷ παραλυτικῷ· Τέκνον, ⸂ἀφίενταί σου⸃ αἱ ⸀ἁμαρτίαι.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/005.yaml
  text: And Jesus[a], seeing their faith, says to the paralyzed man, “Child, your sins are forgiven.”
translation:
  language: hi
  text: यीशु ने उनका विश्वास देखकर लकवे से पीड़ित व्यक्ति से कहा, “बेटे[a], तुम्हारे पाप क्षमा किए गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चे”; यूनानी τέκνον स्नेह से किया गया संबोधन है, जिसका अर्थ “बच्चा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: देखकर
  rationale: ग्रीक कृदंत को स्वाभाविक हिन्दी पूर्वकालिक क्रिया के रूप में रखा गया है; इससे देखने और कहने का संबंध बना रहता है।
- source_word: πίστιν αὐτῶν
  choice: उनका विश्वास
  rationale: πίστις यहाँ उस समूह के प्रकट भरोसे को दर्शाता है जो उस व्यक्ति को यीशु के पास लाया; बहुवचन संबंधवाचक αὐτῶν को ‘उनका’ से सुरक्षित रखा गया है।
- source_word: λέγει
  choice: कहा
  rationale: ग्रीक का ऐतिहासिक वर्तमान मरकुस की कथा-शैली का अंग है, पर आधुनिक हिन्दी कथन में सामान्य भूतकाल अधिक स्वाभाविक है और घटना के अर्थ को नहीं बदलता।
- source_word: παραλυτικῷ
  choice: लकवे से पीड़ित व्यक्ति
  rationale: यह विशेषण संज्ञा के रूप में लकवाग्रस्त व्यक्ति को दर्शाता है; यह अभिव्यक्ति आधुनिक हिन्दी में स्पष्ट और सम्मानजनक है।
- source_word: Τέκνον
  choice: बेटे
  rationale: यह स्नेहपूर्ण संबोधन है। प्रसंग में संबोधित व्यक्ति पुरुष है, और ‘बेटे’ आधुनिक हिन्दी में ‘बच्चे’ की अपेक्षा अधिक स्वाभाविक संबोधन है; मूल शब्द की व्यापकता पाद-टिप्पणी में दी गई है।
- source_word: ἀφίενταί σου αἱ ἁμαρτίαι
  choice: तुम्हारे पाप क्षमा किए जाते हैं
  rationale: वर्तमानकालीन कर्मवाच्य को यथासंभव बनाए रखा गया है। इससे क्षमा की घोषणा वर्तमान वास्तविकता के रूप में सामने आती है और क्षमा देने वाला, ग्रीक की तरह, अनकहा रहता है।
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: ἁμαρτίαι का मानक हिन्दी समतुल्य ‘पाप’ है; हिन्दी में यही रूप एकवचन और बहुवचन दोनों के लिए प्रयुक्त होता है।
theological_decisions:
- issue: यीशु द्वारा क्षमा की घोषणा का स्वरूप
  choice: “तुम्हारे पाप क्षमा किए जाते हैं” के रूप में सीधी घोषणा
  alternative: “तुम्हारे पाप क्षमा कर दिए गए हैं” अथवा “तुम्हारे पाप क्षमा हो गए हैं”
  rationale: ग्रीक वर्तमान कर्मवाच्य क्षमा को वर्तमान वास्तविकता के रूप में घोषित करता है। चुना हुआ रूप पूर्ण हो चुकी क्रिया या चल रही प्रक्रिया की अतिरिक्त व्याख्या थोपे बिना घोषणा और अनकहे दिव्य कर्ता—दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘लकवे से पीड़ित व्यक्ति’ सम्मानजनक सामान्य भाषा है; ‘बेटे’ संबोधन की आत्मीयता को स्वाभाविक हिन्दी में व्यक्त करता है।
