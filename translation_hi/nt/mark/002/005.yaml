review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents Jesus’ seeing the group’s faith, his address to the paralyzed man, and the plural sense of “sins.” “बेटे” is a natural tender address in this context; the footnote appropriately notes the broader lexical sense of τέκνον.
  naturalness: “लकवे से पीड़ित व्यक्ति” is clear, respectful modern Hindi. However, “तुम्हारे पाप क्षमा किए जाते हैं” ordinarily sounds habitual or procedural in modern Hindi (“sins are forgiven [as a practice]”), rather than a direct, effective pronouncement to this individual. A present-perfect passive is the idiomatic Hindi way to express the resulting present state without specifying the agent.
  terminology: “विश्वास,” “पाप,” and “क्षमा” are established, suitably neutral biblical terms. The revised wording retains the Greek passive’s unstated agent.
  issues:
  - severity: medium
    issue: The clause “तुम्हारे पाप क्षमा किए जाते हैं” is not idiomatic as an individual declarative pronouncement.
    rationale: Although intended to mirror the Greek present passive, this Hindi form commonly conveys a general or repeated action. “तुम्हारे पाप क्षमा किए गए हैं” naturally communicates that forgiveness is now established, while preserving the passive and leaving the agent unstated.
  revised_text: यीशु ने उनका विश्वास देखकर लकवे से पीड़ित व्यक्ति से कहा, “बेटे[a], तुम्हारे पाप क्षमा किए गए हैं।”
