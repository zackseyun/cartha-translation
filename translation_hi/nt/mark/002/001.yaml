  text: Καὶ ⸀εἰσελθὼν πάλιν εἰς Καφαρναοὺμ δι’ ⸀ἡμερῶν ἠκούσθη ὅτι ⸂ἐν οἴκῳ⸃ ἐστίν·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/001.yaml
  text: And when he entered Capernaum again after some days[a], it was heard that he was at home.
translation:
  language: hi
  text: कुछ दिनों बाद जब वह फिर कफरनहूम में आया, तो यह सुनने में आया कि वह घर पर है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घर में।”
    reason: यूनानी पदबंध का अधिक शाब्दिक अनुवाद; इससे किसी अपने घर या ठिकाने का अर्थ अनिवार्य नहीं होता।
lexical_decisions:
- source_word: εἰσελθὼν
  choice: जब वह…आया
  rationale: पूर्वकालिक कृदंत को मुख्य घटना से जुड़ी स्वाभाविक कालवाचक उपवाक्य-रचना में व्यक्त किया गया है।
- source_word: πάλιν
  choice: फिर
  rationale: यह लौटने या घटना की पुनरावृत्ति का सामान्य और संक्षिप्त हिन्दी संकेत है।
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: δι’ ἡμερῶν
  choice: कुछ दिनों बाद
  rationale: यह अनिश्चित अवधि बीतने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἠκούσθη
  choice: यह खबर फैल गई
  rationale: यूनानी का निर्वैयक्तिक कर्मवाच्य सूत्र इस अर्थ में है कि लोगों में उसके आने की बात सुनाई देने लगी; हिन्दी में यह अभिव्यक्ति उसी सार्वजनिक सूचना-भाव को सहज रूप देती है।
- source_word: ἐν οἴκῳ
  choice: घर पर
  rationale: संदर्भ में यह स्वाभाविक मुहावरा है, पर यूनानी पदबंध केवल ‘घर में’ होने का भी अर्थ दे सकता है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐστίν
  choice: है
  rationale: यूनानी के वर्तमान काल को बनाए रखा गया है; हिन्दी में खबर के कथ्य के भीतर वर्तमान काल स्वाभाविक है।
theological_decisions:
- issue: ἐν οἴκῳ किसी अपने ठिकाने को सूचित करता है या सामान्य रूप से किसी घर के भीतर होने को
  choice: घर पर
  alternative: घर में
  rationale: मुख्य पाठ में संदर्भानुकूल और स्वाभाविक हिन्दी रखी गई है, जबकि अधिक शाब्दिक तथा कम व्यक्तिगत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है ताकि पाठ की वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह खबर फैल गई’ निर्वैयक्तिक सूचना के भाव को साधारण पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है; ‘घर पर’ की संभावित अतिव्याख्या पादटिप्पणी से संतुलित की गई है।
