  text: Σοὶ λέγω, ⸀ἔγειρε ἆρον τὸν κράβαττόν σου καὶ ὕπαγε εἰς τὸν οἶκόν σου.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/011.yaml
  text: I say to you[a], get up, pick up your mat[b], and go to your house.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, उठो, अपनी चटाई[a] उठाओ और अपने घर जाओ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपना बिछौना।’ यूनानी κράβαττος साधारण चटाई या उठाकर ले जाए जा सकने वाले सोने के बिछौने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘घर चले जाओ।’ यूनानी में शाब्दिक रूप से ‘अपने घर जाओ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Σοὶ λέγω
  choice: मैं तुमसे कहता हूँ
  rationale: आरम्भ में रखे गए बलयुक्त दत्तिवाचक सर्वनाम Σοὶ को ‘तुमसे’ द्वारा व्यक्त किया गया है। ‘मैं तुमसे कहता हूँ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए व्यक्तिगत और अधिकारपूर्ण संबोधन को बनाए रखता है।
- source_word: ἔγειρε
  choice: उठो
  rationale: ἐγείρω का आज्ञार्थक रूप यहाँ लकवे के रोगी को तत्काल उठने की सीधी आज्ञा देता है। ‘उठो’ स्पष्ट, वर्तमान और स्वाभाविक हिन्दी है।
- source_word: ἆρον
  choice: उठाओ
  rationale: αἴρω का आज्ञार्थक रूप चटाई को जमीन से उठाकर साथ ले जाने की ठोस क्रिया बताता है। ‘उठाओ’ निकटवर्ती ‘उठो’ के साथ मूल के जानबूझकर आए क्रियात्मक क्रम को भी बनाए रखता है।
- source_word: κράβαττόν
  choice: चटाई
  rationale: κράβαττος किसी साधारण, हल्के और उठाकर ले जाए जा सकने वाले सोने के बिछौने को दर्शाता है। ‘चटाई’ आधुनिक पाठक को यही चित्र देती है और भारी पलंग या आधुनिक चिकित्सकीय स्ट्रेचर का बोध नहीं कराती।
- source_word: ὕπαγε
  choice: जाओ
  rationale: यह सीधी आज्ञा है; ‘जाओ’ सरल और स्वाभाविक हिन्दी है। ‘प्रस्थान करो’ अनावश्यक रूप से औपचारिक होता।
- source_word: εἰς τὸν οἶκόν σου
  choice: अपने घर
  rationale: यह चयन εἰς की दिशात्मकता और οἶκος के ठोस अर्थ ‘घर’ को सुरक्षित रखता है। हिन्दी में कर्ता के अपने घर के लिए ‘तुम्हारे घर’ की अपेक्षा ‘अपने घर’ अधिक स्वाभाविक है।
theological_decisions:
- issue: यीशु की चंगाई-संबंधी आज्ञा का स्वर और बल
  choice: 'व्यक्तिगत, सीधी और अधिकारपूर्ण आज्ञाओं का क्रम: ‘मैं तुमसे कहता हूँ, उठो, अपनी चटाई उठाओ और अपने घर जाओ।’'
  alternative: 'अधिक पारम्परिक रूप: ‘मैं तुझसे कहता हूँ, उठ, अपना बिछौना उठा और अपने घर चला जा।’'
  rationale: मूल पाठ यीशु के वचन को तत्काल प्रभाव वाली अधिकारपूर्ण आज्ञा के रूप में प्रस्तुत करता है। अनुवाद उस बल को बनाए रखता है, पर ‘तू’ के ऐसे सामाजिक भाव नहीं जोड़ता जिन्हें यूनानी सर्वनाम स्वयं व्यक्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। एक व्यक्ति के लिए संबोधन में तटस्थ और स्वाभाविक ‘तुम’ रखा गया है; इससे यूनानी एकवचन सुरक्षित रहता है और हिन्दी के ‘तू’ या ‘आप’ से जुड़ा अतिरिक्त सामाजिक स्तर आरोपित नहीं होता।
