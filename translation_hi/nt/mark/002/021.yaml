  text: ⸀Οὐδεὶς ἐπίβλημα ῥάκους ἀγνάφου ἐπιράπτει ἐπὶ ⸂ἱμάτιον παλαιόν⸃· εἰ δὲ μή, αἴρει τὸ πλήρωμα ⸀ἀπ’ αὐτοῦ τὸ καινὸν τοῦ παλαιοῦ, καὶ χεῖρον σχίσμα γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/021.yaml
  text: No one sews a patch of unshrunk cloth onto an old garment[a]; otherwise[b], the patch pulls away from it—the new from the old—and a worse tear results.
translation:
  language: hi
  text: कोई भी पुराने वस्त्र पर ऐसे कपड़े का पैबंद नहीं सीता जिसे अभी सिकोड़कर तैयार नहीं किया गया हो[a]। नहीं तो नया पैबंद पुराने वस्त्र से खिंचकर अलग हो जाएगा[b], और चीरा और भी बड़ा हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसे कपड़े का जो अभी फुलिंग-प्रक्रिया से तैयार नहीं किया गया हो।” यूनानी शब्द ऐसे कपड़े को दर्शाता है जो अभी उस प्रसंस्करण से नहीं गुज़रा था जिससे वह सिकुड़ सकता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “भरने वाला टुकड़ा उससे ले लेता है—नया, पुराने से।” भाव यह है कि नया पैबंद पुराने वस्त्र से खिंचकर अलग होता है और चीरे को बढ़ा देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπίβλημα
  choice: पैबंद
  rationale: वस्त्र की मरम्मत के लिए ऊपर लगाए जाने वाले कपड़े के टुकड़े के लिए ‘पैबंद’ स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: ῥάκους ἀγνάφου
  choice: ऐसे कपड़े का ... जिसे अभी सिकोड़कर तैयार नहीं किया गया हो
  rationale: ἄγναφος ऐसे कपड़े को दर्शाता है जिसे अभी फुलिंग जैसी प्रक्रिया द्वारा तैयार नहीं किया गया और जो बाद में सिकुड़ सकता है। यह वर्णन आधुनिक पाठक को व्यावहारिक अर्थ स्पष्ट करता है।
- source_word: ἐπιράπτει
  choice: पर ... नहीं सीता
  rationale: क्रिया का अर्थ सिलाई द्वारा किसी वस्तु पर जोड़ना है; हिन्दी में ‘पर पैबंद सीना’ सहज प्रयोग है।
- source_word: ἱμάτιον παλαιόν
  choice: पुराने वस्त्र
  rationale: ἱμάτιον को किसी विशेष प्रकार के बाहरी पहनावे तक सीमित किए बिना ‘वस्त्र’ व्यापक और गरिमापूर्ण समतुल्य है।
- source_word: εἰ δὲ μή
  choice: नहीं तो
  rationale: यह शर्त के विपरीत परिणाम को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: αἴρει
  choice: खिंचकर अलग हो जाएगा
  rationale: संदर्भ में नया पैबंद पुराने वस्त्र से अलग होकर कपड़े को और फाड़ता है; यह चयन उस क्रिया को स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: τὸ πλήρωμα
  choice: पैबंद
  rationale: यहाँ शब्द उस भरने वाले टुकड़े को सूचित करता है जो फटन को ढकता है, इसलिए ‘पैबंद’ संदर्भानुकूल है।
- source_word: τὸ καινὸν τοῦ παλαιοῦ
  choice: नया पैबंद पुराने वस्त्र से
  rationale: यूनानी के ‘नया’ और ‘पुराना’ विरोध को स्पष्ट संज्ञाओं के साथ व्यक्त किया गया है ताकि हिन्दी वाक्य सहज रहे।
- source_word: χεῖρον σχίσμα γίνεται
  choice: फटन और भी बड़ी हो जाएगी
  rationale: σχίσμα वस्त्र की फटन है और χεῖρον उसके बिगड़ने को दर्शाता है; ‘और भी बड़ी’ प्रसंग में स्वाभाविक परिणाम व्यक्त करता है।
