reference: Mark 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οἱ γραμματεῖς ⸂τῶν Φαρισαίων⸃ ⸀ἰδόντες ⸂ὅτι ἐσθίει⸃ μετὰ τῶν ⸂ἁμαρτωλῶν καὶ τελωνῶν⸃ ἔλεγον τοῖς μαθηταῖς αὐτοῦ· ⸀Ὅτι μετὰ τῶν ⸂τελωνῶν καὶ ἁμαρτωλῶν⸃ ⸀ἐσθίει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/016.yaml
  text: And the scribes of the Pharisees[a], seeing that he was eating with sinners and tax collectors, were saying to his disciples, “Why does he eat with tax collectors and sinners?”
translation:
  language: hi
  text: और फरीसियों के शास्त्रियों ने जब देखा कि वह पापियों और चुंगी लेने वालों के साथ खा रहा है,[a] तो वे उसके चेलों से कह रहे थे, “वह चुंगी लेने वालों और पापियों के साथ क्यों खाता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक भावानुसार, “चुंगी लेने वालों और पापियों के साथ भोजन करता है।” यूनानी में शाब्दिक रूप से “साथ खाता है” है, जो इस प्रसंग में साथ बैठकर भोजन करने और सामाजिक संगति का संकेत देता है।
    reason: मूल अभिव्यक्ति के शाब्दिक अर्थ और उसमें निहित मेज-संगति दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के संदर्भ में यह मान्य और संक्षिप्त पद है, जो धर्मग्रंथ और व्यवस्था के जानकार शिक्षकों को सूचित करता है।
- source_word: τῶν Φαρισαίων
  choice: फरीसियों के
  rationale: संबंधकारक रचना को सीधे रखते हुए यह उन शास्त्रियों का फरीसियों से संबंध दिखाता है, बिना यह अनावश्यक रूप से तय किए कि वे स्वयं फरीसी थे या उनसे संबद्ध थे।
- source_word: ἰδόντες
  choice: जब देखा
  rationale: यूनानी कृदंत का समय-सूचक भाव स्वाभाविक हिंदी में व्यक्त होता है और दृश्य की कथात्मक गति बनी रहती है।
- source_word: ὅτι ἐσθίει
  choice: कि वह … खा रहा है
  rationale: अपूर्णकालीन क्रिया से चल रही घटना का भाव आता है; हिंदी का अपूर्ण प्रगतिशील रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μετὰ
  choice: के साथ
  rationale: यह संगति, विशेषकर एक साथ भोजन करने, को दर्शाता है; सरल अनुवाद प्रसंग के सामाजिक अर्थ को स्वयं उभरने देता है।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: यह मूल के सामाजिक-धार्मिक ठप्पे की तीव्रता बनाए रखने वाला सीधा समतुल्य है।
- source_word: τελωνῶν
  choice: चुंगी लेने वालों
  rationale: पहली सदी के महसूल या चुंगी वसूलने वालों के लिए हिंदी बाइबलीय प्रयोग में परिचित और संदर्भानुकूल पद है।
- source_word: ἔλεγον
  choice: कहने लगे
  rationale: अपूर्णकाल की जारी शिकायत को हिंदी में स्वाभाविक कथात्मक रूप से व्यक्त करता है।
- source_word: τοῖς μαθηταῖς αὐτοῦ
  choice: उसके चेलों से
  rationale: μαθηταί के शिक्षक-शिष्य संबंध को सामान्य और परिचित हिंदी में स्पष्ट रखता है।
- source_word: Ὅτι
  choice: क्यों
  rationale: प्रश्नवाचक शिकायत के इस प्रयोग को स्वाभाविक हिंदी में ‘क्यों’ ठीक से व्यक्त करता है।
- source_word: ἐσθίει
  choice: खाता है
  rationale: सीधे प्रश्न में यह वर्तमानकालीन रूप यीशु की ऐसी संगति पर सामान्य आपत्ति का भाव रखता है।
theological_decisions:
- issue: साथ भोजन करने का सामाजिक-धार्मिक अर्थ
  choice: मुख्य पाठ में साधारण शब्दों ‘के साथ खाता है’ को बनाए रखना
  alternative: ‘के साथ भोजन की संगति रखता है’ या ‘साथ बैठकर भोजन करता है’
  rationale: मूल पाठ साधारण क्रिया ‘खाना’ और ‘साथ’ के द्वारा तनाव उत्पन्न करता है। स्पष्ट व्याख्यात्मक विस्तार मुख्य पाठ में जोड़ने के बजाय निहित मेज-संगति को पादटिप्पणी में बताया गया है।
- issue: फरीसियों और शास्त्रियों के संबंध की व्याकरणिक अस्पष्टता
  choice: ‘फरीसियों के शास्त्री’
  alternative: ‘वे शास्त्री जो फरीसी थे’
  rationale: यूनानी संबंधकारक संबद्धता दर्शाता है, पर उनकी पहचान को अनिवार्य रूप से पूरी तरह समान नहीं ठहराता; हिंदी रचना वही खुलापन बचाती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शास्त्री’, ‘चेले’ और ‘चुंगी लेने वाले’ परिचित बाइबलीय शब्द हैं; वाक्य-विन्यास आधुनिक हिंदी के अनुरूप है।
