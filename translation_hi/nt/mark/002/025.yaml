source:
  edition: SBLGNT
  text: καὶ ⸀λέγει αὐτοῖς· Οὐδέποτε ἀνέγνωτε τί ἐποίησεν Δαυὶδ ὅτε χρείαν ἔσχεν καὶ ἐπείνασεν αὐτὸς καὶ οἱ μετ’ αὐτοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/025.yaml
  text: And he said to them, “Have you never read what David did when he was in need and was hungry, he and those with him?”
translation:
  language: hi
  text: और उसने उनसे कहा, “क्या तुमने कभी नहीं पढ़ा कि जब दाऊद को आवश्यकता थी और वह तथा उसके साथी भूखे थे, तब उसने क्या किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χρείαν ἔσχεν
  choice: को आवश्यकता थी
  rationale: यूनानी मुहावरे का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप; यह दाऊद की अभावग्रस्त स्थिति को भूख के उल्लेख से अलग बनाए रखता है।
- source_word: ἐπείνασεν
  choice: भूखे थे
  rationale: एकवचन क्रिया का कर्ता निकटवर्ती αὐτός है, पर आगे ‘वह तथा उसके साथी’ भूख की स्थिति में सहभागी बताए गए हैं; हिन्दी में संयुक्त कर्ता के साथ बहुवचन स्वाभाविक है।
- source_word: οἱ μετ’ αὐτοῦ
  choice: उसके साथी
  rationale: शाब्दिक ‘उसके साथ के लोग’ की अपेक्षा यह आधुनिक, संक्षिप्त और स्पष्ट है।
- source_word: Οὐδέποτε ἀνέγνωτε
  choice: क्या तुमने कभी नहीं पढ़ा
  rationale: नकारात्मक प्रश्न की चुनौतीपूर्ण अलंकारिक शक्ति को बनाए रखता है।
theological_decisions:
- issue: दाऊद की आवश्यकता और भूख का संबंध
  choice: 'दोनों को अलग कथनों के रूप में रखा: ‘आवश्यकता थी’ और ‘भूखे थे’'
  alternative: ‘जब उसे भूख की आवश्यकता थी’ या केवल ‘जब वह भूखा था’
  rationale: मूल पाठ χρείαν ἔσχεν और ἐπείνασεν दोनों कहता है; अनुवाद किसी एक को दूसरे में विलीन नहीं करता।
- issue: भूख का अनुभव किन लोगों को था
  choice: ‘वह तथा उसके साथी भूखे थे’
  alternative: केवल दाऊद को व्याकरणिक रूप से भूखा बताना
  rationale: यूनानी में क्रिया एकवचन है, किंतु αὐτὸς καὶ οἱ μετ’ αὐτοῦ दाऊद और उसके साथियों को साथ रखता है; हिन्दी में संयुक्त समूह को बहुवचन देना अर्थ को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘तुम’ मूल बहुवचन αὐτοῖς/ἀνέγνωτε को स्वाभाविक रूप से व्यक्त करता है। वाक्य विन्यास हिन्दी की सहज कालानुक्रमिक संरचना के अनुसार रखा गया है, जबकि मूल के अलंकारिक प्रश्न और दोनों अवस्थाओं—आवश्यकता तथा भूख—को सुरक्षित रखा गया है।
