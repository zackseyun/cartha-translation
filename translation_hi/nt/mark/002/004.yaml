base_translation:
  language: en
  yaml_path: translation/nt/mark/002/004.yaml
  text: And not being able to bring him to him because of the crowd[a], they removed the roof where he was, and after digging through it[c][b], they lower the mat on which the paralyzed man was lying.
translation:
  language: hi
  text: और वे उसे भीड़ के कारण यीशु के पास नहीं ला सके, इसलिए उन्होंने जहाँ यीशु थे, उस जगह की छत उघाड़ दी। फिर उसे खोदकर उन्होंने उस चटाई को नीचे उतारा[a] जिस पर लकवे से पीड़ित व्यक्ति लेटा था।
  philosophy: optimal-equivalence
  footnotes:
