  text: Τί οὗτος οὕτως λαλεῖ; ⸀βλασφημεῖ· τίς δύναται ἀφιέναι ἁμαρτίας εἰ μὴ εἷς ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/007.yaml
  text: Why does this man speak like this? He is blaspheming! Who can forgive sins except God alone?[a][b]
translation:
  language: hi
  text: “यह आदमी इस तरह क्यों बोलता है?[a] यह परमेश्वर की निंदा कर रहा है! परमेश्वर के सिवा कौन पापों को क्षमा कर सकता है?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “यह आदमी इस तरह क्या बोलता है?” यहाँ यूनानी मुहावरे का अर्थ है, “यह आदमी इस तरह क्यों बोलता है?”
    reason: lexical_alternative
  - marker: b
    text: या, “एकमात्र परमेश्वर के सिवा।”
    reason: alternative_reading
lexical_decisions:
- source_word: Τί … οὕτως λαλεῖ
  choice: इस तरह क्यों बोलता है
  rationale: यहाँ Τί प्रश्नवाचक मुहावरे में कथन की विषयवस्तु नहीं, बल्कि इस प्रकार बोलने का कारण पूछता है; इसलिए सहज हिन्दी में ‘क्यों’ उपयुक्त है। οὕτως को ‘इस तरह’ से व्यक्त किया गया है।
- source_word: οὗτος
  choice: यह आदमी
  rationale: यह संकेतवाचक शब्द यीशु के प्रति दूरी और विरोध दिखाता है। ‘यह आदमी’ उस भाव को रखता है, पर यूनानी से अधिक तिरस्कार नहीं जोड़ता।
- source_word: βλασφημεῖ
  choice: परमेश्वर की निन्दा कर रहा है
  rationale: वर्तमान काल तत्काल चल रही क्रिया के आरोप को व्यक्त करता है। हिन्दी में ‘परमेश्वर की निन्दा’ धार्मिक आरोप का आशय स्पष्ट और स्वाभाविक रूप से बताता है।
- source_word: ἀφιέναι ἁμαρτίας
  choice: पापों को क्षमा करना
  rationale: इस प्रसंग में ἀφίημι का स्थापित अर्थ पापों को क्षमा करना है; ‘छोड़ना’ या ‘दूर भेजना’ हिन्दी में आशय को धुंधला कर देगा।
- source_word: εἰ μὴ εἷς ὁ θεός
  choice: केवल परमेश्वर के सिवा
  rationale: εἰ μή अपवाद और εἷς विशिष्टता पर बल देता है। यह हिन्दी रूप दावे की अनन्यता को सहज ढंग से रखता है, जबकि वैकल्पिक संरचना को पादटिप्पणी में सुरक्षित किया गया है।
theological_decisions:
- issue: οὗτος में तिरस्कार की मात्रा
  choice: यह आदमी
  alternative: यह व्यक्ति; यह आदमी भला
  rationale: शास्त्री विरोधी हैं, पर अनुवाद को मूल पाठ से अधिक अपमानजनक नहीं बनाना चाहिए। ‘यह आदमी’ दूरी दिखाता है, जबकि अतिरिक्त शब्द तिरस्कार को अनावश्यक रूप से बढ़ाते।
- issue: βλασφημεῖ के आरोप का स्वरूप
  choice: यह परमेश्वर की निन्दा कर रहा है
  alternative: यह निन्दा की बात कह रहा है; यह निन्दा करता है
  rationale: कथन शास्त्रियों का धार्मिक निर्णय प्रस्तुत करता है। अनुवाद उनके आरोप को स्पष्ट रखता है, पर इस पद में उससे उठने वाले मसीह-संबंधी प्रश्न का समाधान अपने शब्दों से नहीं थोपता।
- issue: εἷς ὁ θεός की अनन्यता और वैकल्पिक व्यंजना
  choice: केवल परमेश्वर के सिवा
  alternative: एक परमेश्वर के सिवा
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी द्वारा अनन्यता व्यक्त की गई है। ‘एक परमेश्वर’ वाली अधिक शाब्दिक संभावना पादटिप्पणी में रखी गई है, ताकि यूनानी संरचना की व्यंजना न खोए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर की निन्दा’ सामान्य हिन्दी पाठक के लिए स्पष्ट है और मूल आरोप का धार्मिक भार बनाए रखती है। प्रश्नों की तीव्रता तथा कथानक का धर्मवैज्ञानिक तनाव बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
