  text: καὶ ἠγέρθη ⸂καὶ εὐθὺς⸃ ἄρας τὸν κράβαττον ἐξῆλθεν ⸀ἔμπροσθεν πάντων, ὥστε ἐξίστασθαι πάντας καὶ δοξάζειν τὸν θεὸν λέγοντας ὅτι ⸂Οὕτως οὐδέποτε⸃ εἴδομεν.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/012.yaml
  text: And he got up[a], and immediately picked up the mat and went out before them all, so that they were all amazed and glorified God, saying, “We have never seen anything like this.”
translation:
  language: hi
  text: और वह उठ खड़ा हुआ, और तुरंत चटाई उठाकर सबके सामने बाहर चला गया। इस पर सभी चकित रह गए और परमेश्वर की महिमा करते हुए कहने लगे, “हमने ऐसा कभी नहीं देखा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “हमने इस प्रकार कभी नहीं देखा।” इसका आशय है कि उन्होंने ऐसी घटना पहले कभी नहीं देखी थी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγέρθη
  choice: उठ खड़ा हुआ
  rationale: चंगाई के इस प्रसंग में क्रिया उस व्यक्ति के यीशु की आज्ञा के अनुसार शारीरिक रूप से उठने को बताती है। यह हिन्दी में स्वाभाविक है और यहाँ अनावश्यक रूप से पुनरुत्थान का भाव नहीं जोड़ती।
- source_word: εὐθύς
  choice: तुरंत
  rationale: यह मरकुस की कथा में कार्य की तात्कालिकता और तीव्र गति को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἄρας
  choice: उठाकर
  rationale: कृदन्त मुख्य क्रिया से पहले चटाई उठा लेने और उसे साथ ले जाने की क्रिया बताता है; ‘उठाकर’ क्रम और अर्थ दोनों को सहज रूप से व्यक्त करता है।
- source_word: κράβαττον
  choice: चटाई
  rationale: यह साधारण बिछौने या सोने की गद्दी का संकेत करता है। ‘चटाई’ आम पाठक के लिए सुबोध है और आधुनिक पलंग या चिकित्सकीय स्ट्रेचर का अतिरिक्त अर्थ नहीं लाती।
- source_word: ἔμπροσθεν πάντων
  choice: सबके सामने
  rationale: यह चंगाई के सार्वजनिक और सबको दिखाई देने वाले स्वरूप को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὥστε ἐξίστασθαι πάντας
  choice: इस पर सभी चकित रह गए
  rationale: ὥστε परिणाम को और ἐξίστασθαι असाधारण विस्मय को व्यक्त करता है। यह रूप घटना और भीड़ की प्रतिक्रिया का संबंध साफ करता है।
- source_word: δοξάζειν τὸν θεόν
  choice: परमेश्वर की महिमा करते हुए
  rationale: ‘महिमा करना’ δοξάζω के ईश्वर की ओर निर्देशित अर्थ को बनाए रखता है और हिन्दी बाइबलीय भाषा में परिचित होते हुए भी सुबोध है।
- source_word: Οὕτως οὐδέποτε εἴδομεν
  choice: हमने ऐसा कभी नहीं देखा
  rationale: यूनानी वाक्य का शाब्दिक विन्यास ‘इस प्रकार हमने कभी नहीं देखा’ है; हिन्दी मुहावरे में ‘ऐसा कभी नहीं देखा’ उसी अभूतपूर्व अनुभव को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ἠγέρθη में संभावित पुनरुत्थान-संबंधी अनुगूँज
  choice: उठ खड़ा हुआ
  alternative: उठाया गया / जी उठा
  rationale: ἐγείρω अन्य संदर्भों में पुनरुत्थान का अर्थ दे सकता है, पर यहाँ तत्काल प्रसंग चंगे हुए लकवे के रोगी के शारीरिक रूप से उठकर आज्ञा मानने का है। चुना हुआ रूप उसी प्राथमिक अर्थ को रखता है, बिना शब्द की अन्यत्र संभव धर्मवैज्ञानिक अर्थ-सीमा का दावा किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज। ‘और’ से आरम्भ तथा अगला ‘और’ यूनानी कथा की क्रमिक गति को बनाए रखते हैं। फुटनोट का चिह्न उस वाक्यांश के बाद रखा गया है जिसकी शाब्दिक वैकल्पिक अभिव्यक्ति फुटनोट में दी गई है।
