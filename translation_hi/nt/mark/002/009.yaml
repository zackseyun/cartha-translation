  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν τῷ παραλυτικῷ· ⸀Ἀφίενταί σου αἱ ἁμαρτίαι, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ ἆρον ⸂τὸν κράβαττόν σου⸃ καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/009.yaml
  text: 'Which is easier: to say to the paralyzed man[a], ‘Your sins are forgiven,’ or to say, ‘Get up, pick up your mat, and walk’?”'
translation:
  language: hi
  text: क्या आसान है—लकवे से पीड़ित उस व्यक्ति से यह कहना, “तुम्हारे पाप क्षमा हो गए हैं[a],” या यह कहना, “उठो, अपनी चटाई उठाओ और चलो”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पाप क्षमा किए गए हैं।” यूनानी क्रिया को क्षमा की वर्तमान परिणामी अवस्था पर बल देने वाला भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: क्या आसान है
  rationale: यह तुलनात्मक प्रश्न का स्वाभाविक आधुनिक हिन्दी रूप है और दोनों कथनों के बीच तुलना बनाए रखता है।
- source_word: τῷ παραλυτικῷ
  choice: लकवे से पीड़ित उस व्यक्ति से
  rationale: यह παραλυτικός का स्पष्ट, सम्मानजनक और सामान्य पाठकों के लिए सुबोध अनुवाद है; ‘उस’ प्रसंग में पहले से उपस्थित व्यक्ति की ओर संकेत करता है।
- source_word: Ἀφίενταί σου αἱ ἁμαρτίαι
  choice: तुम्हारे पाप क्षमा हो गए हैं
  rationale: यह यूनानी वर्तमान निष्क्रिय/मध्य रूप की क्षमा की वर्तमान परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है, बिना क्षमा करने वाले कर्ता को स्पष्ट रूप से जोड़ने के।
- source_word: Ἔγειρε
  choice: उठो
  rationale: आज्ञार्थक क्रिया का सीधा, स्वाभाविक और समकालीन हिन्दी रूप।
- source_word: ἆρον τὸν κράβαττόν σου
  choice: अपनी चटाई उठाओ
  rationale: κράβαττος एक साधारण, उठाकर ले जाई जा सकने वाली सोने की चटाई या बिछौने को दर्शाता है; ‘चटाई’ आधुनिक हिन्दी में इसका ठोस और सुबोध रूप है।
- source_word: περιπάτει
  choice: चलो
  rationale: आज्ञाओं की श्रृंखला में यह क्रिया स्वाभाविक हिन्दी में चलने की आज्ञा व्यक्त करती है।
theological_decisions:
- issue: पापों की क्षमा की घोषणा का काल और वाच्य
  choice: तुम्हारे पाप क्षमा हो गए हैं
  alternative: तुम्हारे पाप क्षमा हैं / तुम्हारे पाप क्षमा किए जाते हैं
  rationale: चुना हुआ रूप क्षमा की परिणामी अवस्था और घोषणा की शक्ति को बनाए रखता है, पर क्षमा के कर्ता को पाठ में नहीं जोड़ता। पादटिप्पणी यूनानी रूप में वर्तमान अवस्था पर दिए जा सकने वाले बल को स्पष्ट करती है, ताकि समय और पक्ष की वास्तविक अस्पष्टता दब न जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संबोधन में ‘तुम्हारे/उठो’ सामान्य निकट संबोधन को व्यक्त करता है। ‘लकवे से पीड़ित व्यक्ति’ तकनीकी या व्यक्ति को उसकी दशा तक सीमित कर देने वाली संज्ञा से बचता है।
