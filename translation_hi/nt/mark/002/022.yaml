id: MRK.2.22
reference: Mark 2:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μή, ⸂ῥήξει ὁ οἶνος⸃ τοὺς ἀσκούς, καὶ ὁ οἶνος ⸂ἀπόλλυται καὶ οἱ ἀσκοί⸃. ἀλλὰ οἶνον νέον εἰς ἀσκοὺς ⸀καινούς.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/022.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the wine will burst the wineskins, and the wine is ruined, and the wineskins too[b]. But new wine is for fresh wineskins.
translation:
  language: hi
  text: और कोई भी नया दाखरस पुरानी मशकों में नहीं भरता। नहीं तो दाखरस मशकों को फाड़ देगा, और दाखरस नष्ट हो जाएगा[a] और मशकें भी। बल्कि नया दाखरस नई मशकों[b] में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाखरस बरबाद हो जाएगा।”
    reason: ἀπόλλυται के प्रसंगानुकूल अर्थ में ‘नष्ट’, ‘बरबाद’ या ‘खो जाना’ संभव है।
  - marker: b
    text: यहाँ “नई” का भाव नई अथवा अब तक अप्रयुक्त मशकों का है।
    reason: καινούς गुण या दशा की नवीनता पर बल दे सकता है और पुरानी मशकों के साथ इसका विरोध है।
lexical_decisions:
- source_word: βάλλει
  choice: भरता
  rationale: दाखरस को मशकों में रखने के प्रसंग में ‘भरता’ स्वाभाविक हिन्दी है। यह सामान्य यूनानी क्रिया के आशय को प्रसंगानुकूल व्यक्त करता है, जबकि ‘फेंकता’ यहाँ भ्रामक होगा।
- source_word: οἶνον νέον
  choice: नया दाखरस
  rationale: यह हाल में बने और अभी किण्वित हो रहे दाखरस की सांस्कृतिक छवि बनाए रखता है तथा विशेषण-संज्ञा युग्म का सीधा अनुवाद है।
- source_word: ἀσκούς
  choice: मशकों
  rationale: ‘मशक’ पशु-चर्म से बने तरल रखने के पात्र का प्रचलित और संक्षिप्त हिन्दी नाम है; प्रसंग से स्पष्ट है कि ये दाखरस की मशकें हैं।
- source_word: παλαιούς
  choice: पुरानी
  rationale: यह मूल विशेषण का सीधा अर्थ देता है और अंतिम खंड की ‘नई’ मशकों से स्पष्ट विरोध बनाए रखता है; ‘घिसी-पिटी’ कहना निहितार्थ को अनावश्यक रूप से स्पष्ट कर देता।
- source_word: ῥήξει
  choice: फाड़ देगा
  rationale: किण्वन के दबाव से चमड़े की मशकों के फटने को हिन्दी में स्वाभाविक और सजीव रूप से व्यक्त करता है।
- source_word: ἀπόλλυται
  choice: नष्ट हो जाएगा
  rationale: यह दाखरस के बरबाद या खो जाने, दोनों संभावित भावों को पर्याप्त व्यापकता से व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: καινούς
  choice: नई
  rationale: καινός यहाँ पुरानी मशकों के विपरीत नई अथवा अप्रयुक्त मशकों को सूचित करता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘नई’ रखी गई है और गुणात्मक सूक्ष्मता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: अंतिम खंड में क्रिया का लोप
  choice: ‘बल्कि नया दाखरस नई मशकों में’ के रूप में क्रियारहित लोकोक्तिपरक वाक्यांश रखा गया।
  alternative: ‘बल्कि नया दाखरस नई मशकों में भरा जाता है’ अथवा ‘भरना चाहिए।’
  rationale: यूनानी में अंतिम खंड के भीतर कोई व्यक्त क्रिया नहीं है। हिन्दी भी इस संक्षिप्त लोकोक्तिपरक लोप को स्वाभाविक रूप से सह सकती है; इससे न तो अनावश्यक आज्ञार्थक या बाध्यतामूलक भाव जोड़ा जाता है, न पहले की क्रिया को यांत्रिक ढंग से दोहराया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और लोकोक्तिपरक शैली रखी गई है। ‘दाखरस’ और ‘मशक’ बाइबिलीय सांस्कृतिक वस्तुओं को सटीकता से व्यक्त करते हैं। अंतिम यूनानी खंड की वास्तविक संक्षिप्तता और अस्पष्ट व्याकरणिक पूर्ति को हिन्दी में भी सुरक्षित रखा गया है।
