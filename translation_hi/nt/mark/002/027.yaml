base_translation:
  language: en
  yaml_path: translation/nt/mark/002/027.yaml
  text: And he was saying to them[a], “The Sabbath came into being for man, and not man for the Sabbath.”
translation:
  language: hi
  text: और वह उनसे कहता रहा, “सब्त मनुष्य[a] के लिए बना, न कि मनुष्य सब्त के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, मानवजाति के लिए। यूनानी में एकवचन ‘मनुष्य’ समस्त मनुष्यों का प्रतिनिधित्व करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: कहता रहा
  rationale: अपूर्ण भूतकाल की निरंतर या विस्तारित कथन-क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘कहा’ की तुलना में यूनानी पक्ष को अधिक स्पष्ट रखता है।
- source_word: τὸ σάββατον
  choice: सब्त
  rationale: सव्याख्यायित धार्मिक संस्था अथवा दिन का मानक हिन्दी बाइबलीय नाम; ‘दिन’ जोड़ना यहाँ आवश्यक नहीं है।
- source_word: διὰ τὸν ἄνθρωπον
  choice: मनुष्य के लिए
  rationale: διά के साथ कर्मकारक उद्देश्य अथवा हित का अर्थ देता है। एकवचन ἄνθρωπος यहाँ समस्त मानवजाति का प्रतिनिधि है।
- source_word: ἐγένετο
  choice: अस्तित्व में आया
  rationale: γίνομαι के ‘होना/अस्तित्व में आना’ अर्थ को बनाए रखता है और किसी संकीर्ण निर्माण-क्रिया का अनावश्यक संकेत नहीं देता।
- source_word: οὐχ ὁ ἄνθρωπος διὰ τὸ σάββατον
  choice: न कि मनुष्य सब्त के लिए
  rationale: मूल के संक्षिप्त, समानांतर और विरोधात्मक विन्यास को हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: सिद्धान्त-वाक्य में प्रतिनिधिक एकवचन ἄνθρωπος
  choice: मुख्य पाठ में ‘मनुष्य’, और उसके सामूहिक अर्थ को पादटिप्पणी में स्पष्ट करना
  alternative: मानवजाति / सभी मनुष्य
  rationale: यूनानी एकवचन को बनाए रखते हुए यह स्पष्ट रहता है कि कथन केवल पुरुष के विषय में नहीं, बल्कि सामान्यतः मानवजाति के विषय में है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘कहता रहा’ अपूर्ण काल का पक्ष व्यक्त करता है; ‘अस्तित्व में आया’ मूल क्रिया की व्यापकता को सुरक्षित रखता है।
