  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸀εὐθὺς ἐπιγνοὺς ὁ Ἰησοῦς τῷ πνεύματι αὐτοῦ ὅτι ⸀οὕτως διαλογίζονται ἐν ἑαυτοῖς ⸀λέγει αὐτοῖς· Τί ταῦτα διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/008.yaml
  text: And immediately Jesus[a], perceiving in his spirit that they were reasoning this way within themselves, said to them, “Why are you reasoning about these things in your hearts?”
translation:
  language: hi
  text: और यीशु ने तुरन्त अपनी आत्मा में जान लिया[a] कि वे अपने भीतर इस प्रकार विचार कर रहे हैं। उसने उनसे कहा, “तुम अपने हृदयों में इन बातों पर क्यों विचार कर रहे हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी आत्मा में पहचान लिया’ अथवा ‘अपने भीतर जान लिया।’ यूनानी पाठ यह स्पष्ट नहीं करता कि यीशु ने किस प्रकार इसे जाना।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐθὺς
  choice: तुरन्त
  rationale: यह मरकुस की शैली में कथा की तात्कालिकता और गति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐπιγνοὺς
  choice: जान लिया
  rationale: ἐπιγινώσκω यहाँ स्पष्ट रूप से पहचानने या अवगत हो जाने का भाव देता है। ‘जान लिया’ सहज हिन्दी है और ज्ञान के साधन को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τῷ πνεύματι αὐτοῦ
  choice: अपनी आत्मा में
  rationale: यह यूनानी के दत्तिवाचक प्रयोग को निकटता से दर्शाता है और उसे केवल साधन (‘आत्मा से’) या केवल आन्तरिक अनुभूति (‘अपने भीतर’) मानकर अस्पष्टता को समाप्त नहीं करता।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह उनके विचार करने के ढंग को व्यक्त करता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: διαλογίζονται / διαλογίζεσθε
  choice: विचार कर रहे हैं / विचार कर रहे हो
  rationale: διαλογίζομαι आन्तरिक तर्क-विचार या मनन को सूचित कर सकता है। ‘विचार करना’ यहाँ बोले गए विवाद का अर्थ थोपे बिना संज्ञानात्मक भाव बनाए रखता है।
- source_word: ἐν ἑαυτοῖς
  choice: अपने भीतर
  rationale: सन्दर्भ में यह आपसी बातचीत के बजाय उनके अन्दर चल रहे विचार को सूचित करता है।
- source_word: Τί ταῦτα διαλογίζεσθε
  choice: इन बातों पर क्यों विचार कर रहे हो?
  rationale: प्रश्नवाचक τί इस प्रयोग में कारण पूछता है; हिन्दी में ‘क्यों’ स्वाभाविक है। ‘इन बातों पर’ ταῦτα के आशय को स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: अपने हृदयों में
  rationale: ‘हृदय’ बाइबलीय प्रयोग में विचार और अभिप्राय सहित भीतरी मनुष्य को दर्शाता है। बहुवचन को बनाए रखा गया है और इसे केवल ‘मन’ तक सीमित नहीं किया गया।
theological_decisions:
- issue: ‘अपनी आत्मा में जान लिया’ में यीशु के ज्ञान का स्वरूप
  choice: मूल की अभिव्यक्ति ‘अपनी आत्मा में’ को बनाए रखते हुए यह कहना कि यीशु ने उनका आन्तरिक विचार जान लिया, पर ज्ञान की क्रियाविधि को निश्चित न करना।
  alternative: इसे स्पष्टतः दिव्य सर्वज्ञता, पवित्र आत्मा द्वारा मिला ज्ञान, या केवल तीक्ष्ण मानवीय अन्तर्दृष्टि बताना।
  rationale: पद स्पष्ट करता है कि यीशु उनके भीतर के विचारों से अवगत था, किन्तु τῷ πνεύματι αὐτοῦ स्वयं यह निश्चित नहीं करता कि यहाँ किस प्रकार की अनुभूति या ज्ञान पर बल है। निकट अनुवाद धर्मवैज्ञानिक तनाव और वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आत्मा’ और ‘हृदयों’ जैसे मूल बाइबलीय रूपकों को व्याख्यात्मक रूप से सरल करके हटाया नहीं गया है; साथ ही आन्तरिक विचार को स्पष्ट करने के लिए ‘अपने भीतर’ प्रयुक्त हुआ है।
