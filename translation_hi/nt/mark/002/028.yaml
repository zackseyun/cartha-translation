  yaml_path: translation/nt/mark/002/028.yaml
  text: So the Son of Man is Lord even of the Sabbath[a].
translation:
  language: hi
  text: इसलिए मनुष्य का पुत्र सब्त का भी प्रभु है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसलिए मनुष्य का पुत्र सब्त का प्रभु भी है।” यूनानी καί का अनुवाद सामान्यतः “और/भी” हो सकता है; यहाँ सम्भवतः इसका बल “सब्त तक का भी” प्रभु होने पर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पिछले कथन से निकला निष्कर्ष प्रकट करता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और तर्क-संबंध को स्पष्ट रखने वाला अनुवाद है।
- source_word: κύριος
  choice: प्रभु
  rationale: यहाँ शब्द अधिकार और प्रभुता व्यक्त करता है। ‘प्रभु’ कथन की मसीह-संबंधी शक्ति को बनाए रखता है और इसे केवल अनुमति या सीमित अधिकार तक कम नहीं करता।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह सुसमाचारों में यीशु की स्थापित आत्म-पदवी है। इसका पारंपरिक रूप अन्तर्पाठीय और मसीह-संबंधी संकेतों को बिना व्याख्या द्वारा तय किए सुरक्षित रखता है।
- source_word: καὶ
  choice: भी
  rationale: 'यहाँ καί का भाव विस्तार पर बल देने वाला है: मनुष्य के पुत्र की प्रभुता सब्त तक पर है। हिन्दी में ‘सब्त का भी प्रभु’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: σαββάτου
  choice: सब्त
  rationale: यह तत्काल प्रसंग में विश्राम-दिन और उससे जुड़ी व्यवस्था को सूचित करता है; ‘सब्त’ संक्षिप्त, प्रचलित और मूल धार्मिक-सांस्कृतिक पद को सुरक्षित रखने वाला रूप है।
theological_decisions:
- issue: सब्त पर मनुष्य के पुत्र के अधिकार का मसीह-संबंधी बल
  choice: कथन को सीधे इस रूप में रखा गया है कि मनुष्य का पुत्र सब्त का प्रभु है।
  alternative: ‘मनुष्य के पुत्र को सब्त के विषय में अधिकार है’ जैसे अपेक्षाकृत दुर्बल रूप में अनुवाद करना।
  rationale: विधेय κύριος प्रभुता व्यक्त करता है, केवल किसी विषय में सीमित अधिकार नहीं। अनुवाद मूल कथन की शक्ति बनाए रखता है, पर उसमें अतिरिक्त धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
- issue: ‘मनुष्य का पुत्र’ का सन्दर्भ
  choice: इसे यीशु की पदवी ‘मनुष्य का पुत्र’ के रूप में बनाए रखा गया है।
  alternative: इसे सामान्य अर्थ में ‘मनुष्य’ या ‘मानव’ बनाना।
  rationale: मरकुस में यह अभिव्यक्ति यीशु की आत्म-सन्दर्भित पदवी के रूप में कार्य करती है और सम्भावित दानिय्येली प्रतिध्वनि सहित अर्थगत तनाव रखती है। पदवी को बनाए रखना उस तनाव को समय से पहले हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज वाक्य। ‘मनुष्य का पुत्र,’ ‘सब्त’ और ‘प्रभु’ जैसे प्रमुख बाइबलीय पदों को उनकी अन्तर्पाठीय तथा धर्मवैचारिक गूँज के कारण बनाए रखा गया है।
