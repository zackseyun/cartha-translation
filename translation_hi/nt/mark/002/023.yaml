source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ⸂αὐτὸν ἐν τοῖς σάββασιν παραπορεύεσθαι⸃ διὰ τῶν σπορίμων, καὶ ⸂οἱ μαθηταὶ αὐτοῦ ἤρξαντο⸃ ὁδὸν ποιεῖν τίλλοντες τοὺς στάχυας.
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/023.yaml
  text: And it happened that on the Sabbath he was passing through the grainfields[a], and his disciples began to make their way[c][b], plucking the heads of grain.
translation:
  language: hi
  text: एक सब्त के दिन ऐसा हुआ कि यीशु अनाज के खेतों[a] में से होकर जा रहे थे, और उनके चेले बालें तोड़ते हुए आगे बढ़ने[b] लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खड़े अनाज के बीच से।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मार्ग बनाने।” यहाँ इसका अर्थ संभवतः बालें तोड़ते हुए खेत में आगे बढ़ना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: यूनानी कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और नई घटना आरम्भ करने का उसका बल बनाए रखता है।
- source_word: ἐν τοῖς σάββασιν
  choice: एक सब्त के दिन
  rationale: यूनानी बहुवचन रूप यहाँ कोई एक सब्त-दिन सूचित करने वाला प्रचलित सामी/कोइने प्रयोग है; ‘एक’ प्रसंग की अनिश्चितता को बनाए रखता है।
- source_word: παραπορεύεσθαι
  choice: में से होकर जा रहे थे
  rationale: चलते हुए खेतों के भीतर से गुजरने की निरन्तर क्रिया स्पष्ट करता है।
- source_word: διὰ τῶν σπορίμων
  choice: अनाज के खेतों में से
  rationale: σπόριμος बोए हुए अथवा खड़े अनाज वाले खेत को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: οἱ μαθηταὶ αὐτοῦ
  choice: उनके चेले
  rationale: μαθητής के शिष्यत्व-संबंध को सामान्य बाइबलीय हिन्दी के परिचित और सुबोध शब्द ‘चेला’ से व्यक्त करता है।
- source_word: ἤρξαντο
  choice: लगे
  rationale: पूरक क्रिया के साथ आरम्भ का भाव स्वाभाविक हिन्दी संरचना ‘आगे बढ़ने लगे’ में सुरक्षित है।
- source_word: ὁδὸν ποιεῖν
  choice: आगे बढ़ने
  rationale: शाब्दिक अर्थ ‘मार्ग बनाना’ है, पर यहाँ मुहावरे का संभावित अर्थ रास्ता तय करना या आगे बढ़ना है; यह अनावश्यक रूप से सड़क अथवा पगडंडी बनाने का अर्थ नहीं थोपता।
- source_word: τίλλοντες
  choice: तोड़ते हुए
  rationale: बालों को डंठल से नोचने या तोड़ने की साथ-साथ चल रही क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τοὺς στάχυας
  choice: बालें
  rationale: στάχυς का अर्थ अनाज की बाल है; प्रसंग में अनाज पहले ही उल्लिखित होने के कारण संक्षिप्त ‘बालें’ स्पष्ट है।
- source_word: αὐτὸν
  choice: यीशु
  rationale: यूनानी सर्वनाम का संदर्भ यीशु से है; स्वतंत्र पद के रूप में पाठ स्पष्ट रखने के लिए हिन्दी में नाम दोहराया गया है।
theological_decisions:
- issue: सब्त की शब्दावली
  choice: एक सब्त के दिन
  alternative: सब्तों में
  rationale: यूनानी बहुवचन को यहाँ प्रचलित मुहावरे के अनुसार किसी एक सब्त के रूप में समझा गया है; यह भाषिक निर्णय है और विवाद के सब्त-संबंधी संदर्भ को नहीं बदलता।
- issue: ὁδὸν ποιεῖν का अर्थ और सब्त-विवाद
  choice: आगे बढ़ने
  alternative: रास्ता बनाने
  rationale: मुहावरेदार अनुवाद चेलों को सड़क-निर्माण करते हुए नहीं दर्शाता। फिर भी शाब्दिक संभावना पाठक के लिए पादटिप्पणी में सुरक्षित रखी गई है, क्योंकि आगामी विवाद में उनकी क्रिया का वर्णन महत्त्वपूर्ण है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘सब्त’, ‘चेला’ और ‘बालें’ जैसे परिचित बाइबलीय तथा ग्रामीण शब्द सामान्य पाठकों के लिए सुबोध हैं। यूनानी वाक्य के अस्पष्ट मुहावरे ὁδὸν ποιεῖν को मुख्य पाठ में स्वाभाविक बनाया गया है और उसका शाब्दिक रूप पादटिप्पणी में रखा गया है।
