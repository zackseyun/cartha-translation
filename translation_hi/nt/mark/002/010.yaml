source:
  edition: SBLGNT
  text: ἵνα δὲ εἰδῆτε ὅτι ἐξουσίαν ἔχει ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐπὶ τῆς γῆς ἀφιέναι ἁμαρτίας⸃— λέγει τῷ παραλυτικῷ·
base_translation:
  language: en
  yaml_path: translation/nt/mark/002/010.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he says to the paralyzed man[b][a],
translation:
  language: hi
  text: लेकिन इसलिए कि तुम जान लो कि मनुष्य के पुत्र[a] को धरती पर पाप क्षमा करने का अधिकार है—वह लकवाग्रस्त व्यक्ति[b] से कहता है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानव-पुत्र।” यूनानी पदवी में मानवता का सामान्य भाव और दानिय्येल 7 की ओर संकेत—दोनों संभव हैं।
    reason: alternative_reading
  - marker: b
    text: या “लकवे का रोगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ
  choice: लेकिन इसलिए कि
  rationale: ἵνα उद्देश्य प्रकट करता है और δέ हल्का विरोध अथवा कथन में मोड़ लाता है; यह हिंदी प्रयोग दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: εἰδῆτε
  choice: तुम जान लो
  rationale: ἵνα के बाद आया यह रूप उद्देश्य अथवा अपेक्षित परिणाम बताता है; आने वाला चंगाई का कार्य इस बात को प्रत्यक्ष रूप से जानने का आधार बनेगा।
- source_word: ἐξουσίαν ἔχει
  choice: अधिकार है
  rationale: ἐξουσία यहाँ केवल सामर्थ्य नहीं, बल्कि पाप क्षमा करने का वैध अधिकार या प्राधिकार व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: हिंदी वाक्य-रचना में ‘को’ के कारण संबंधकारक रूप आया है। यह यीशु की आत्म-पदवी को सुरक्षित रखता है और उसके मानवीय मुहावरे तथा दानिय्येल 7 से संभावित संबंध को किसी एक अर्थ में सीमित नहीं करता।
- source_word: ἐπὶ τῆς γῆς
  choice: धरती पर
  rationale: यह स्वाभाविक आधुनिक हिंदी में पृथ्वी के क्षेत्र में अधिकार के प्रयोग को व्यक्त करता है और संभावित स्वर्गीय विरोध को खुला रखता है।
- source_word: ἀφιέναι ἁμαρτίας
  choice: पाप क्षमा करने
  rationale: इस प्रसंग में ἀφίημι का अर्थ पापों को छोड़ देना, माफ करना या क्षमा करना है; ‘पाप क्षमा करना’ स्पष्ट और प्रचलित हिंदी अभिव्यक्ति है।
- source_word: λέγει τῷ παραλυτικῷ
  choice: वह लकवाग्रस्त व्यक्ति से कहता है
  rationale: ‘लकवाग्रस्त व्यक्ति’ substantival παραλυτικός का सहज, व्यक्ति-केंद्रित हिंदी रूप है; ‘कहता है’ यूनानी ऐतिहासिक वर्तमान को बनाए रखता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου पदवी का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: मानव-पुत्र
  rationale: परंपरागत और मूल-पाठ-संगत पदवी रखी गई है, ताकि सामान्य मानवता, मसीही अधिकार और दानिय्येल 7 की संभावित प्रतिध्वनि के बीच का तनाव अनिर्णीत रहे।
- issue: पाप क्षमा करने के संबंध में ἐξουσία का अर्थ
  choice: अधिकार
  alternative: सामर्थ्य
  rationale: प्रसंग यीशु की केवल क्षमता नहीं, बल्कि पाप क्षमा करने की वैध प्रभुता के दावे से संबंधित है; इसलिए ‘अधिकार’ अधिक सटीक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल यूनानी की बीच में रुकी हुई वाक्य-रचना और ऐतिहासिक वर्तमान को दीर्घ विराम तथा ‘कहता है’ द्वारा सुरक्षित रखा गया है।
