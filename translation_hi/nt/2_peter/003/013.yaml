id: 2PE.3.13
reference: 2 Peter 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/013.yaml
  text: But according to his promise[a], we are waiting for new heavens and a new earth, in which righteousness dwells.
translation:
  language: hi
  text: पर उसकी प्रतिज्ञा के अनुसार हम नए आकाशों और नई पृथ्वी की प्रतीक्षा कर रहे हैं, जिनमें धार्मिकता[a] वास करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘न्याय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: καινοὺς ... οὐρανοὺς / γῆν καινὴν
  choice: नए आकाशों और नई पृथ्वी
  rationale: ‘नया’ मूल विशेषण καινός की गुणात्मक नवीनता को बिना ‘नवीकृत’ अर्थ जोड़कर व्यक्त करता है। बहुवचन ‘आकाशों’ और ‘पृथ्वी’ से यशायाह 65:17; 66:22 की बाइबलीय-ब्रह्मांडीय भाषा भी सुरक्षित रहती है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में वर्तमान आकाशों के नाश की बात के साथ हल्का विरोध प्रकट करता है; आधुनिक हिंदी में ‘पर’ संक्षिप्त और स्वाभाविक है।
- source_word: κατὰ τὸ ἐπάγγελμα αὐτοῦ
  choice: उसकी प्रतिज्ञा के अनुसार
  rationale: κατά यहाँ अनुरूपता दर्शाता है और ἐπάγγελμα का अर्थ ‘प्रतिज्ञा’ है; यह वाक्यांश परमेश्वर के प्रतिज्ञात वचन की ओर संकेत करता है।
- source_word: προσδοκῶμεν
  choice: हम ... बाट जोह रहे हैं
  rationale: वर्तमान काल की निरंतर, आशापूर्ण प्रतीक्षा को व्यक्त करता है। ‘बाट जोहना’ सामान्य हिंदी में समझ में आने वाला और प्रसंग के अनुरूप गरिमापूर्ण प्रयोग है।
- source_word: ἐν οἷς
  choice: जिनमें
  rationale: मूल में संबंधवाचक सर्वनाम बहुवचन है और नए आकाशों तथा नई पृथ्वी से बनी संयुक्त नई सृष्टि की ओर संकेत करता है; ‘जिनमें’ इस व्याकरणिक रूप को सुरक्षित रखता है।
- source_word: δικαιοσύνη
  choice: धार्मिकता
  rationale: δικαιοσύνη के व्यापक नैतिक और परमेश्वर-सापेक्ष अर्थ को सुरक्षित रखता है। ‘न्याय’ इसका संभव अर्थ-आयाम है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: κατοικεῖ
  choice: वास करती है
  rationale: κατοικέω के स्थायी निवास के भाव को स्वाभाविक, संक्षिप्त और गरिमापूर्ण हिंदी में व्यक्त करता है।
theological_decisions:
- issue: अंतकालीन नई सृष्टि के संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ शब्द नई सृष्टि में परमेश्वर के सामने सही और न्यायपूर्ण व्यवस्था की स्थायी उपस्थिति का व्यापक भाव रख सकता है। ‘धार्मिकता’ उस व्यापकता को मुख्य पाठ में सुरक्षित रखती है, जबकि ‘न्याय’ को वास्तविक वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण। ‘आकाशों’ मूल के बहुवचन और बाइबलीय ब्रह्मांडीय संकेत को बनाए रखता है; ‘बाट जोह रहे हैं’ निरंतर और आशापूर्ण प्रतीक्षा व्यक्त करता है।
