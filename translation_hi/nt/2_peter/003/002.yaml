id: 2PE.3.2
reference: 2 Peter 3:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/002.yaml
  text: to remember the words spoken beforehand by the holy prophets and the commandment of your apostles from the Lord and Savior[b][a],
translation:
  language: hi
  text: कि तुम उन वचनों को याद रखो, जो पवित्र भविष्यद्वक्ताओं ने पहले से कहे थे,[a] और उस आज्ञा को भी, जो तुम्हारे प्रेरितों ने प्रभु और उद्धारकर्ता की ओर से दी थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे वचन, जो पहले कहे गए थे।”
    reason: lexical_alternative
  - marker: b
    text: या “और तुम्हारे प्रेरितों के द्वारा दी गई प्रभु और उद्धारकर्ता की आज्ञा को भी।” यूनानी सम्बन्धकारक पदों का संबंध एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μνησθῆναι
  choice: याद रखो
  rationale: यहाँ अनंत क्रिया पिछले पद में लेखक के उद्देश्य की विषय-वस्तु बताती है। ‘याद रखो’ स्वाभाविक हिन्दी है और केवल क्षणिक स्मरण के बजाय निरंतर ध्यान में रखने का भाव भी व्यक्त करती है।
- source_word: προειρημένων ῥημάτων
  choice: वे वचन, जो ... पहले से कहे थे
  rationale: यह अनुवाद पहले कहे जाने के कालगत भाव को बनाए रखता है, पर इसे अनावश्यक रूप से केवल भविष्यवाणी करने के अर्थ तक सीमित नहीं करता।
- source_word: ῥημάτων
  choice: वचन
  rationale: भविष्यद्वक्ताओं द्वारा कहे गए प्रामाणिक कथनों के लिए ‘वचन’ आधुनिक बाइबलीय हिन्दी में स्पष्ट, गरिमापूर्ण और स्वाभाविक है।
- source_word: ὑπὸ τῶν ἁγίων προφητῶν
  choice: पवित्र भविष्यद्वक्ताओं ने
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिन्दी कर्तृवाच्य में व्यक्त किया गया है; ‘पवित्र’ उनकी विशेषता को यथावत रखता है।
- source_word: ἐντολῆς
  choice: आज्ञा
  rationale: एकवचन सुरक्षित रखा गया है और ‘आज्ञा’ ἐντολή की प्रामाणिक तथा अधिकारपूर्ण प्रकृति व्यक्त करती है।
- source_word: τῶν ἀποστόλων ὑμῶν
  choice: तुम्हारे प्रेरितों ने
  rationale: ὑμῶν को स्वाभाविक शब्द-संबंध के अनुसार ‘प्रेरितों’ से जोड़ा गया है। हिन्दी वाक्य में ‘ने ... दी थी’ माध्यम की भूमिका स्पष्ट करता है।
- source_word: τοῦ κυρίου καὶ σωτῆρος
  choice: प्रभु और उद्धारकर्ता की ओर से
  rationale: सम्बन्धकारक को आज्ञा के स्रोत के रूप में समझते हुए ‘की ओर से’ चुना गया है; इससे यह स्पष्ट होता है कि प्रेरित उस आज्ञा के वाहक थे।
- source_word: κυρίου
  choice: प्रभु
  rationale: यह κύριος के लिए स्थापित, गरिमापूर्ण और मसीही उपाधि के अनुकूल हिन्दी शब्द है।
- source_word: σωτῆρος
  choice: उद्धारकर्ता
  rationale: यह σωτήρ का मानक हिन्दी समतुल्य है और इस मसीह-संबंधी संदर्भ में उसके धार्मिक महत्व को बनाए रखता है।
theological_decisions:
- issue: τῶν ἀποστόλων ὑμῶν में ὑμῶν का संबंध
  choice: ‘तुम्हारे’ को ‘प्रेरितों’ से जोड़ा गया है
  alternative: ‘प्रेरितों द्वारा तुम्हें दी गई आज्ञा’
  rationale: यूनानी शब्दक्रम ὑμῶν को ἀποστόλων से सबसे स्वाभाविक रूप से जोड़ता है। ‘तुम्हारे प्रेरित’ से आशय पाठकों से संबद्ध या उनके पास भेजे गए प्रेरित हैं, न कि स्वामित्व।
- issue: τοῦ κυρίου καὶ σωτῆρος का वाक्यगत संबंध
  choice: आज्ञा प्रभु और उद्धारकर्ता की ओर से है और प्रेरितों ने उसे पहुँचाया
  alternative: प्रेरितों को प्रभु और उद्धारकर्ता के प्रेरित बताना; अथवा ‘तुम्हारे प्रेरितों की आज्ञा’ कहना
  rationale: सम्बन्धकारकों की शृंखला एक से अधिक विश्लेषण की अनुमति देती है। मुख्य पाठ आज्ञा के स्रोत को प्रभु और उद्धारकर्ता तथा उसके मानवीय माध्यम को प्रेरित मानता है; पादटिप्पणी वैकल्पिक स्वाभाविक निरूपण सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किन्तु गरिमापूर्ण शैली रखी गई है। यूनानी कर्मवाच्य को सहज हिन्दी कर्तृवाच्य में बदला गया है। ‘प्रेरित’, ‘प्रभु’, ‘उद्धारकर्ता’ और ‘आज्ञा’ जैसे प्रचलित बाइबलीय शब्द बनाए गए हैं।
