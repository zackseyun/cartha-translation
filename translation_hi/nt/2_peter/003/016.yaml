source:
  edition: SBLGNT
  text: ὡς καὶ ἐν πάσαις ⸀ταῖς ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν ⸀αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/016.yaml
  text: as also in all his letters[a], speaking in them about these things. In them are some things hard to understand, which the ignorant and unstable twist, as they do the rest of the Scriptures[c][b], to their own destruction.
translation:
  language: hi
  text: और वह अपने सभी पत्रों में भी इन बातों की चर्चा करता है। उन पत्रों में कुछ बातें समझने में कठिन हैं, जिन्हें अशिक्षित[a] और अस्थिर लोग तोड़-मरोड़ देते हैं[b], जैसे वे बाकी पवित्र शास्त्रों को भी तोड़-मरोड़ देते हैं—अपने ही विनाश के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनपढ़े”; यहाँ आशय ऐसे लोगों से है जिन्हें शिक्षा या सही समझ नहीं मिली है।
    reason: lexical_alternative
  - marker: b
    text: या “विकृत कर देते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπιστολαῖς
  choice: पत्रों
  rationale: आधुनिक हिन्दी में लिखित पत्राचार के लिए स्वाभाविक शब्द; ‘पत्रियों’ की अपेक्षा अधिक सामान्य और वर्तमान प्रयोग है।
- source_word: λαλῶν
  choice: चर्चा करता है
  rationale: शाब्दिक अर्थ ‘बोलता है’ है, पर पत्रों के माध्यम के संदर्भ में ‘चर्चा करता है’ स्वाभाविक हिन्दी है और संप्रेषण का भाव बनाए रखता है।
- source_word: περὶ τούτων
  choice: इन बातों की
  rationale: पूर्ववर्ती संदर्भ की ओर संकेत करने वाले यूनानी पदबंध का सीधा और सहज रूप।
- source_word: δυσνόητά τινα
  choice: कुछ बातें समझने में कठिन हैं
  rationale: τινα की अनिश्चितता और δυσνόητα की बोधगत कठिनाई, दोनों स्पष्ट रूप से सुरक्षित हैं।
- source_word: ἀμαθεῖς
  choice: अशिक्षित
  rationale: यहाँ ज्ञान या शिक्षा न पाए होने का भाव है; यह औपचारिक निरक्षरता तक अर्थ को सीमित नहीं करता।
- source_word: ἀστήρικτοι
  choice: अस्थिर
  rationale: दृढ़ता या स्थिर आधार के अभाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: στρεβλοῦσιν
  choice: तोड़-मरोड़ देते हैं
  rationale: मूल रूपक की सजीवता रखते हुए अर्थ को बिगाड़ने या विकृत करने का सामान्य हिन्दी मुहावरा है।
- source_word: τὰς λοιπὰς γραφὰς
  choice: पवित्र शास्त्र के बाकी लेखों
  rationale: γραφαί को सामान्य ‘लेखों’ तक सीमित न करके पवित्र शास्त्रीय लेखों के रूप में प्रस्तुत करता है; λοιπάς का ‘बाकी’ अर्थ तुलना और उसी वर्ग से संबंध की स्वाभाविक संभावना बनाए रखता है।
- source_word: ἀπώλειαν
  choice: विनाश
  rationale: मूल की गंभीर परिणति को बिना अतिरिक्त तकनीकी धर्मशास्त्रीय अर्थ जोड़े स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: τὰς λοιπὰς γραφὰς में पौलुस के पत्रों की शास्त्रीय स्थिति का निहितार्थ
  choice: “पवित्र शास्त्र के बाकी लेखों” रखा गया, जिससे पौलुस के पत्रों की तुलना अन्य शास्त्रीय लेखों से होने का स्वाभाविक निहितार्थ बना रहता है।
  alternative: “अन्य लेखों” या “बाकी रचनाओं”
  rationale: नए नियम में γραφαί सामान्यतः पवित्र शास्त्रीय लेखों को सूचित करता है, और λοιπάς ‘बाकी’ अथवा ‘अन्य’ उसी वर्ग से तुलना का संकेत देता है। अनुवाद इस निहितार्थ को न तो मिटाता है, न मूल से आगे बढ़ाकर कोई विस्तृत सैद्धांतिक दावा जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पत्रों’ और ‘चर्चा करता है’ सामान्य पाठक के लिए स्वाभाविक हैं। अंतिम वाक्यांश ‘अपने ही विनाश के लिए’ मूल के कठोर और गंभीर परिणाम को जानबूझकर सीधे रूप में रखता है।
