source:
  edition: SBLGNT
  text: Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/014.yaml
  text: Therefore[a], beloved, since you are waiting for these things, make every effort to be found by him spotless and blameless in peace.
translation:
  language: hi
  text: इसलिए, प्रिय लोगो, इन बातों की प्रतीक्षा करते हुए हर संभव प्रयास करो कि तुम उसके द्वारा शांति में निष्कलंक और निर्दोष पाए जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सामने शांति में निष्कलंक और निर्दोष पाए जाओ।” यूनानी दत्तिव का अर्थ “उसके द्वारा” अथवा “उसके सामने” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Διό
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले कथन—प्रभु के दिन और नई सृष्टि की आशा—से वर्तमान आग्रह को जोड़ता है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: बहुवचन सम्बोधन का स्नेह और पत्रात्मक गरिमा दोनों सुरक्षित रहते हैं।
- source_word: ταῦτα προσδοκῶντες
  choice: जब तुम इन बातों की प्रतीक्षा कर रहे हो
  rationale: वर्तमान कृदन्त निरन्तर प्रतीक्षा को दर्शाता है; ‘जब’ मुख्य आज्ञा से उसका स्वाभाविक कालगत सम्बन्ध व्यक्त करता है, बिना कारणार्थ को अत्यधिक निश्चित किए।
- source_word: σπουδάσατε
  choice: पूरा प्रयत्न करो
  rationale: आज्ञा में निहित तत्पर, गंभीर और सक्रिय प्रयास को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ἄσπιλοι
  choice: निष्कलंक
  rationale: दाग-रहित होने के रूपक और नैतिक शुद्धता दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἀμώμητοι
  choice: निर्दोष
  rationale: निन्दा या दोष के आधार से रहित होने का भाव देता है और ‘निष्कलंक’ के साथ अर्थगत निकटता रखते हुए अलग शब्दावली बनाए रखता है।
- source_word: αὐτῷ εὑρεθῆναι
  choice: उसे … पाए जाओ
  rationale: निष्क्रिय infinitive और कर्तृवाचक दत्तिव के सम्भावित अर्थ ‘उसके द्वारा पाए जाना’ को स्वाभाविक हिन्दी में व्यक्त करता है; दत्तिव का ‘उसके सामने’ अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐν εἰρήνῃ
  choice: शान्ति में
  rationale: यूनानी की व्यापकता बनाए रखता है और यह निश्चित नहीं करता कि शान्ति मुख्यतः आन्तरिक, पारस्परिक या परमेश्वर के साथ सम्बन्धित है।
theological_decisions:
- issue: αὐτῷ का दत्तिव अर्थ और अन्तकालीन सन्दर्भ
  choice: मुख्य पाठ में ‘उसे … पाए जाओ’, अर्थात ‘उसके द्वारा पाए जाओ’
  alternative: ‘उसके सामने … पाए जाओ’
  rationale: दत्तिव को कर्ता अथवा सम्बन्ध/उपस्थिति के अर्थ में समझा जा सकता है। मुख्य पाठ सम्भावित दैवी जाँचकर्ता को अनाम रखते हुए मूल सर्वनाम की संक्षिप्तता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गरिमामय पत्रात्मक शैली। ‘हे प्रियो’ बाइबलीय सम्बोधन की ऊष्मा रखता है; वाक्यरचना सामान्य पाठक के लिए सहज है और मूल की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
