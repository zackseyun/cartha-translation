id: 2PE.3.15
reference: 2 Peter 3:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν ⸂δοθεῖσαν αὐτῷ⸃ σοφίαν ἔγραψεν ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/015.yaml
  text: And regard the patience of our Lord as salvation[a], just as our beloved brother Paul also wrote to you according to the wisdom given to him[b],
translation:
  language: hi
  text: और हमारे प्रभु के धीरज को उद्धार समझो[a], ठीक वैसे ही जैसे हमारे प्रिय भाई पौलुस ने भी उसे दी गई बुद्धि के अनुसार[b] तुम्हें लिखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सहनशीलता”; आशय यह है कि प्रभु का विलंब उदासीनता नहीं, बल्कि उद्धार के उद्देश्य से है।
    reason: lexical_alternative
  - marker: b
    text: “उसे दी गई बुद्धि” से सम्भवतः परमेश्वर द्वारा दी गई बुद्धि का संकेत मिलता है, यद्यपि यूनानी पाठ देने वाले का नाम नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: μακροθυμίαν
  choice: धीरज
  rationale: यह शब्द न्याय करने में धैर्यपूर्ण संयम और विलंब को व्यक्त करता है। “धीरज” आधुनिक हिन्दी में स्वाभाविक है और प्रभु के आने में प्रतीत होने वाले विलंब के प्रसंग के अनुकूल है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: अंतकाल-संबंधी इस प्रसंग में यह परमेश्वर के बचाने वाले उद्देश्य को दर्शाता है; “उद्धार” नए नियम के धार्मिक आशय को बनाए रखता है।
- source_word: ἡγεῖσθε
  choice: समझो
  rationale: मध्यवाच्य आज्ञार्थक रूप किसी बात को एक विशेष रूप में मानने या आँकने का आग्रह करता है। “को उद्धार समझो” हिन्दी में इस विधेयात्मक संबंध को सीधे व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: प्रसंग में यह यीशु की उपाधि है; “हमारे प्रभु” शीर्षक और उसके धार्मिक महत्व दोनों को सुरक्षित रखता है।
- source_word: ἀγαπητὸς ... ἀδελφὸς
  choice: प्रिय भाई
  rationale: यह पौलुस के लिए स्नेहपूर्ण संबोधन है। “प्रिय भाई” आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν
  choice: उसे दी गई बुद्धि के अनुसार
  rationale: κατά अनुरूपता का भाव देता है। कर्मवाच्य “दी गई” मूल पाठ की अनिर्दिष्ट कर्तृता को बनाए रखता है और परमेश्वर का नाम स्पष्ट रूप से नहीं जोड़ता।
- source_word: ἔγραψεν ὑμῖν
  choice: तुम्हें लिखा
  rationale: यूनानी अनिश्चित भूतकाल को हिन्दी के सामान्य भूतकाल में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: καθὼς καὶ
  choice: ठीक वैसे ही जैसे ... भी
  rationale: यह पतरस के आग्रह को पौलुस के समान उपदेश से जोड़ते हुए तुलना और समावेश—दोनों भाव सुरक्षित रखता है।
theological_decisions:
- issue: “उसे दी गई बुद्धि” में दैवी कर्ता का निहित होना
  choice: मुख्य पाठ में “उसे दी गई” कर्मवाच्य रूप रखा गया है और “परमेश्वर द्वारा” नहीं जोड़ा गया।
  alternative: उस बुद्धि के अनुसार जो परमेश्वर ने उसे दी
  rationale: प्रसंग दैवी कर्ता की ओर संकेत कर सकता है, पर यूनानी पाठ कर्ता को स्पष्ट नहीं करता; इसलिए अनिर्दिष्टता सुरक्षित रखी गई है।
- issue: प्रभु के विलंबित कार्य का अर्थ
  choice: “धीरज को उद्धार समझो” के सीधे संबंध को बनाए रखा गया है।
  alternative: “सहनशीलता को उद्धार का अवसर समझो”
  rationale: “अवसर” जोड़ना अर्थ को व्याख्यात्मक रूप से विस्तार देता। मूल पाठ प्रभु के धीरज और उद्धार के बीच अधिक सीधा विधेयात्मक संबंध रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। “तुम्हें” बहुवचन समुदाय को संबोधित करता है। वाक्य-रचना मूल यूनानी के तर्क-संबंध को बनाए रखते हुए हिन्दी में स्वाभाविक रखी गई है।
