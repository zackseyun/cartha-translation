reference: 2 Peter 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/008.yaml
  text: 'But do not let this one thing escape your notice[a], beloved: with the Lord one day is like a thousand years[c][b], and a thousand years like one day.'
translation:
  language: hi
  text: 'पर, हे प्रियो, इस एक बात से अनजान न रहो[a]: प्रभु के यहाँ एक दिन हज़ार वर्ष के समान है[b][c], और हज़ार वर्ष एक दिन के समान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह एक बात तुम्हारी दृष्टि से ओझल न रहे।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “के समान” तुलना व्यक्त करता है; इसका अर्थ यह नहीं कि एक दिन और हज़ार वर्ष शाब्दिक रूप से बराबर हैं।
    reason: cultural_note
  - marker: c
    text: भजन 90:4 की प्रतिध्वनि।
    reason: cross_reference
lexical_decisions:
- source_word: Ἓν δὲ τοῦτο
  choice: पर ... यह एक बात
  rationale: ‘यह एक बात’ संकेतवाचक बल और एक विशिष्ट बात पर दिए गए जोर—दोनों को बनाए रखता है; δέ को प्रसंगानुकूल ‘पर’ से व्यक्त किया गया है।
- source_word: μὴ λανθανέτω ὑμᾶς
  choice: तुमसे छिपी न रहे
  rationale: यह स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है कि बात उनकी दृष्टि या जानकारी से ओझल न रहे, और निषेधात्मक आज्ञा का बल भी बनाए रखता है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: यह संबोधन स्नेहपूर्ण और विश्वासियों के समुदाय के अनुरूप है तथा आधुनिक हिन्दी में गरिमापूर्ण सुनाई देता है।
- source_word: παρὰ κυρίῳ
  choice: प्रभु के यहाँ
  rationale: 'παρά के संबंधपरक और दृष्टिकोण-संबंधी अर्थ को संक्षेप में व्यक्त करता है: प्रभु की उपस्थिति और उनके परिप्रेक्ष्य में।'
- source_word: μία ἡμέρα ... ὡς χίλια ἔτη
  choice: एक दिन हज़ार वर्ष के समान है
  rationale: ‘के समान’ ὡς के तुलनात्मक अर्थ को स्पष्ट रखता है और शाब्दिक समानता का दावा नहीं करता।
- source_word: καὶ χίλια ἔτη ὡς ἡμέρα μία
  choice: और हज़ार वर्ष एक दिन के समान
  rationale: पहले खंड के साथ संतुलित समानांतरता बनाए रखी गई है; यूनानी की तरह दूसरे खंड में क्रिया को अध्याहृत रहने देना हिन्दी में स्वाभाविक है।
- source_word: χίλια ἔτη
  choice: हज़ार वर्ष
  rationale: मूल संख्या को बिना प्रतीकात्मक व्याख्या जोड़े सीधे और स्वाभाविक रूप में प्रस्तुत करता है।
theological_decisions:
- issue: समय-संबंधी तुलना का स्वरूप
  choice: कथन को प्रभु के समय-संबंधी परिप्रेक्ष्य की उपमा के रूप में प्रस्तुत करना
  alternative: एक दिन को शाब्दिक रूप से हज़ार वर्ष के बराबर मानना या इसे भविष्यवाणी की समय-गणना का सूत्र बनाना
  rationale: दोनों खंडों में ὡς तुलना दर्शाता है, गणितीय समानता नहीं। ‘के समान’ इस तनाव को बनाए रखता है और पाठ में कोई काल-गणना पद्धति नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्नेहपूर्ण, गरिमापूर्ण और सहज शैली। ‘हे प्रियो’ ने संबोधन का सामुदायिक स्वर बनाए रखा है; ‘प्रभु के यहाँ’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल की संबंधपरक/परिप्रेक्ष्यगत व्यापकता को सुरक्षित रखता है।
