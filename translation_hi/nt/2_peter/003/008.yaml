  naturalness: The overall register is clear, dignified modern standard Hindi. The revised imperative is more direct and idiomatic in a public-scripture reading context. 'हे प्रियो' and 'प्रभु के यहाँ' are acceptable in this register.
  terminology: ‘प्रभु,’ ‘हज़ार वर्ष,’ and ‘के समान’ are appropriate. The repeated comparison is retained as analogy, not rendered as a literal equivalence or chronological formula.
