language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ⸀ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/018.yaml
  text: But grow in the grace and knowledge of our Lord and Savior Jesus the Messiah[a]. To him be the glory both now and to the day of eternity[b]. Amen.
translation:
  language: hi
  text: परन्तु हमारे प्रभु और उद्धारकर्ता यीशु मसीह के अनुग्रह और ज्ञान में बढ़ते जाओ। उसी को महिमा अब और अनन्तकाल के दिन तक हो। आमीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αὐξάνετε
  choice: बढ़ते जाओ
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक का निरन्तर भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछली चेतावनी के विपरीत सकारात्मक आग्रह की ओर हल्का विरोधात्मक संक्रमण दिखाता है।
- source_word: ἐν χάριτι καὶ γνώσει
  choice: अनुग्रह और ज्ञान में
  rationale: एक ही ἐν दोनों संज्ञाओं पर लागू है; हिन्दी में यह रचना स्वाभाविक रहते हुए उसी साझा क्षेत्र को व्यक्त करती है।
- source_word: χάριτι
  choice: अनुग्रह
  rationale: नए नियम के इस धर्मवैचारिक संदर्भ में स्थापित और अर्थ-सटीक हिन्दी शब्द।
- source_word: γνώσει
  choice: ज्ञान
  rationale: मसीह के विषय में और उनसे सम्बन्धित ज्ञान को व्यक्त करता है, बिना इसे केवल बौद्धिक समझ तक सीमित किए।
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: हमारे प्रभु और उद्धारकर्ता यीशु मसीह के
  rationale: एक ही यूनानी लेख प्रभु और उद्धारकर्ता को एक ही व्यक्ति, यीशु, से जोड़ता है। Χριστός का अर्थपरक, प्रचलित हिन्दी रूप 'मसीह' रखा गया है।
- source_word: αὐτῷ ἡ δόξα
  choice: उसी की महिमा ... होती रहे
  rationale: क्रियारहित यूनानी स्तुतिवाक्य को हिन्दी में सम्मानपूर्ण और स्वाभाविक इच्छार्थक रूप देता है। 'उसी' सर्वनाम का स्पष्ट बल बनाए रखता है।
- source_word: καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος
  choice: अब भी और अनन्तकाल के दिन तक
  rationale: असामान्य यूनानी अभिव्यक्ति में 'दिन' को सुरक्षित रखता है और उसे सामान्यीकृत करके केवल 'सदा' नहीं बनाता।
- source_word: ἀμήν
  choice: आमीन
  rationale: हिन्दी मसीही प्रयोग में स्थापित लिप्यन्तरण।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त
  rationale: Χριστός यहाँ उपाधि का अर्थ रखता है; हिन्दी का प्रचलित अर्थपरक रूप 'मसीह' इसे साधारण पाठक के लिए स्पष्ट रखता है।
- issue: '''हमारे प्रभु और उद्धारकर्ता'' का संकेत'
  choice: दोनों उपाधियाँ एक ही व्यक्ति, यीशु मसीह, के लिए
  alternative: ऐसी अस्पष्ट रचना जिसमें दो अलग संकेत सम्भव लगें
  rationale: एक लेख के अधीन κύριος और σωτήρ की यूनानी संरचना स्वाभाविक रूप से एक ही व्यक्ति की ओर संकेत करती है।
- issue: εἰς ἡμέραν αἰῶνος की असामान्य कालगत अभिव्यक्ति
  choice: अनन्तकाल के दिन तक
  alternative: सदा-सर्वदा
  rationale: मुख्य पाठ में ἡμέραν ('दिन') और αἰῶνος की तनावपूर्ण, असामान्य अभिव्यक्ति को सुरक्षित रखा गया है, न कि उसे सामान्य मुहावरे में समतल किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध। 'बढ़ते जाओ' निरन्तर आज्ञा को सहजता से व्यक्त करता है। मूल की विशिष्ट अभिव्यक्ति 'अनन्तकाल के दिन तक' जानबूझकर सुरक्षित रखी गई है।
