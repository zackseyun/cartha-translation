source:
  edition: SBLGNT
  text: τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ⸀ἐσχάτων τῶν ἡμερῶν ⸂ἐν ἐμπαιγμονῇ⸃ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/003.yaml
  text: 'knowing this first: that in the last days scoffers will come with scoffing[a], walking according to their own desires[b],'
translation:
  language: hi
  text: सबसे पहले यह जान लो कि अंतिम दिनों में ठट्ठा करने वाले, ठट्ठा करते हुए, आएँगे[a], जो अपनी ही इच्छाओं[b] के अनुसार चलते होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपहास करने वाले उपहास करते हुए आएँगे।” यूनानी में बल देने के लिए एक ही मूल से बने शब्द साथ रखे गए हैं।
    reason: lexical_alternative
  - marker: b
    text: “इच्छाओं” का अनुवाद “लालसाओं” भी हो सकता है। यूनानी शब्द केवल यौन इच्छा नहीं, बल्कि व्यापक रूप से प्रबल इच्छाओं को भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: सबसे पहले यह जान लो
  rationale: यूनानी कृदन्त का सम्बन्ध प्रसंग में संबोधित पाठकों से है। स्वाभाविक हिन्दी में आज्ञार्थक रूप अर्थ को स्पष्ट करता है और πρῶτον की प्राथमिकता बनाए रखता है।
- source_word: ἐλεύσονται
  choice: आएँगे
  rationale: भविष्यकालीन ἔρχομαι का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: ἐπ’ ἐσχάτων τῶν ἡμερῶν
  choice: अंतिम दिनों में
  rationale: यह प्रचलित काल-सूचक और युगान्त-संबंधी अभिव्यक्ति है; इसे किसी विशेष अंत-काल पद्धति तक सीमित नहीं किया गया।
- source_word: ἐν ἐμπαιγμονῇ ἐμπαῖκται
  choice: ठट्ठा करनेवाले ठट्ठा करते हुए
  rationale: संज्ञा और सजातीय अभिव्यक्ति की यूनानी पुनरुक्ति को हिन्दी में बनाए रखकर उसका बल सुरक्षित किया गया है।
- source_word: κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν
  choice: अपनी ही अभिलाषाओं के अनुसार
  rationale: ἐπιθυμίαι प्रबल इच्छाओं को व्यापक अर्थ में व्यक्त कर सकता है; ‘अभिलाषाओं’ से नकारात्मक नैतिक प्रसंग बना रहता है, पर अर्थ केवल यौन लालसा तक सीमित नहीं होता। ἰδίας αὐτῶν का बल ‘अपनी ही’ से व्यक्त किया गया है।
- source_word: πορευόμενοι
  choice: चलेंगे
  rationale: यहाँ क्रिया जीवन-चाल या आचरण की ओर संकेत करती है। ‘चलेंगे’ मूल रूपक और हिन्दी की बाइबलीय गरिमा दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ἐπ’ ἐσχάτων τῶν ἡμερῶν की युगान्त-संबंधी अभिव्यक्ति
  choice: अंतिम दिनों में
  alternative: दिनों के अंत में
  rationale: प्रचलित अभिव्यक्ति पाठ की चेतावनी को स्पष्ट रखती है, पर किसी खास सहस्राब्दीवादी या अन्य अंत-काल व्यवस्था को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘ठट्ठा करनेवाले ठट्ठा करते हुए’ जानबूझकर रखी गई पुनरुक्ति है, जो मूल यूनानी के शब्दालंकार और बल को दर्शाती है।
