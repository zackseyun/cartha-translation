language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ βραδύνει ⸀κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ⸀ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/009.yaml
  text: The Lord is not slow concerning the promise[a], as some consider slowness, but is patient toward you[c][b], not wanting any to perish but all to come to repentance.
translation:
  language: hi
  text: प्रभु प्रतिज्ञा को पूरा करने में देर नहीं करते, जैसा कि कुछ लोग इसे देर समझते हैं, बल्कि तुम्हारे प्रति धैर्य रखते हैं[a][b]। वह नहीं चाहते कि कोई भी नष्ट हो, बल्कि सभी पश्चाताप करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे साथ धैर्य रखते हैं।”
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारे,” “कोई” और “सभी” का दायरा यूनानी पाठ की तरह खुला रखा गया है। व्याख्याकारों में मतभेद है कि पतरस विशेष रूप से अपने पाठकों की बात कर रहे हैं या अधिक व्यापक रूप से मानवजाति की।
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: ईश्वरीय उपाधि के रूप में स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: οὐ βραδύνει ... τῆς ἐπαγγελίας
  choice: अपनी प्रतिज्ञा के विषय में देर नहीं कर रहे
  rationale: βραδύνει का विलंब-संबंधी अर्थ रखता है और सम्बन्धवाचक षष्ठी को स्वाभाविक हिन्दी में व्यक्त करता है; 'अपनी' हिन्दी में स्पष्टता के लिए है, यद्यपि यूनानी में सर्वनाम व्यक्त नहीं है।
- source_word: ὥς τινες βραδύτητα ἡγοῦνται
  choice: जैसा कुछ लोग देर समझते हैं
  rationale: ἡγοῦνται को 'समझते हैं' और βραδύτητα को 'देर' कहकर पहले खंड की शब्दगत पुनरावृत्ति बनाए रखी गई है।
- source_word: μακροθυμεῖ εἰς ὑμᾶς
  choice: तुम्हारे प्रति धीरज धरते हैं
  rationale: μακροθυμεῖ के दीर्घकालीन धैर्य और εἰς की दिशात्मकता दोनों को स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: μὴ βουλόμενός
  choice: नहीं चाहते
  rationale: इच्छा/अभिलाषा का अर्थ देता है, पर इसे किसी तकनीकी धर्मवैज्ञानिक प्रकार की इच्छा के रूप में अधिक निश्चित नहीं करता।
- source_word: τινας ἀπολέσθαι
  choice: कि कोई नाश हो
  rationale: ἀπολέσθαι का अकर्मक भाव और वाक्य की गंभीरता बनाए रखता है।
- source_word: πάντας εἰς μετάνοιαν χωρῆσαι
  choice: कि सभी पश्चाताप तक पहुँचें
  rationale: πάντας को बिना संकुचित या विस्तृत किए 'सभी' रखा गया है; χωρῆσαι की गमन/प्राप्ति की छाया को 'तक पहुँचें' व्यक्त करता है और μετάνοια को मानक 'पश्चाताप' से अनूदित करता है।
theological_decisions:
- issue: '''तुम्हारे'', ''कोई'' और ''सभी'' का दायरा'
  choice: सर्वनामों और परिमाणसूचक शब्दों को यूनानी के अनुसार बिना अतिरिक्त सीमा के रखा गया है।
  alternative: इन्हें केवल पत्र के विश्वासियों/चुने हुओं तक सीमित करना, या स्पष्ट रूप से समस्त मानवजाति तक विस्तृत करना।
  rationale: मूल पाठ स्वयं दायरे की आगे व्याख्या नहीं करता; अनुवाद बाद के धर्मवैज्ञानिक विवाद को निर्णीत नहीं करता।
- issue: βουλόμενός में परमेश्वर की इच्छा का स्वरूप
  choice: '''नहीं चाहते'''
  alternative: '''ठान नहीं रखा'' अथवा किसी तकनीकी अर्थ में ''इच्छा नहीं करते'''
  rationale: यह मूल के इच्छात्मक अर्थ को रखता है, बिना परमेश्वर की इच्छा के व्यवस्थित-धर्मवैज्ञानिक भेद आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक एकवचन 'प्रभु' के साथ बहुवचन क्रियारूप। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है।
