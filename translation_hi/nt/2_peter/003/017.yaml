review_pass:
  verdict: revise
  source_fidelity: The draft generally reflects the Greek exhortation, warning, and neutral force of ἐκπέσητε. However, “व्यवस्था-विहीन लोगों के भ्रम में उनके साथ बहकर” makes the people themselves too explicitly the companions in the action, whereas the dative phrase directly identifies their error/deception as that by which the readers might be carried away. A revised wording more closely joins the warning to that error while retaining the compound verb’s sense of being swept along.
  naturalness: “हे प्रियो” is possible in formal biblical Hindi, but “हे प्रिय जनो” is more natural modern standard Hindi while retaining an epistolary, affectionate register. “अपनी दृढ़ स्थिति से गिर न जाओ” is more idiomatic and semantically concrete than “अपनी दृढ़ता से गिर न जाओ.”
  terminology: “व्यवस्था-विहीन” adequately conveys ἀθέσμων without reducing it merely to “wicked.” “भ्रम” appropriately preserves πλάνη’s error/deception range. The revision does not turn the warning into a definite claim about apostasy or loss of salvation.
  issues:
  - severity: medium
    issue: The phrase “उनके साथ बहकर” gives the lawless people a more explicit role as accompanying agents than the Greek syntax directly does.
    rationale: τῇ τῶν ἀθέσμων πλάνῃ identifies the error/deception of the lawless as the relevant dative. Although συναπαχθέντες includes a ‘carried along together’ nuance, Hindi can preserve the warning more faithfully by making the error the immediate influence rather than explicitly saying the readers are carried with those people.
  - severity: low
    issue: “अपनी दृढ़ता से गिर न जाओ” is somewhat less idiomatic in Hindi.
    rationale: στηριγμός can denote a firm position or stability. “अपनी दृढ़ स्थिति से गिर न जाओ” retains the standing/falling image and reads naturally without doctrinal overstatement.
  revised_text: इसलिए, हे प्रिय जनो, यह पहले से जानते हुए सावधान रहो, ताकि व्यवस्था-विहीन लोगों के भ्रम से बहककर अपनी दृढ़ स्थिति से गिर न जाओ।[a]
  revised_footnotes:
