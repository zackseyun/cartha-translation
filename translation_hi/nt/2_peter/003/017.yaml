reference: 2 Peter 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/017.yaml
  text: Therefore[a], you, beloved, knowing this beforehand, guard yourselves so that, being carried away by the error of the lawless[b], you may not fall from your own stability.
translation:
  language: hi
  text: इसलिए, हे प्रिय जनो, यह पहले से जानते हुए सावधान रहो, ताकि व्यवस्था-विहीन लोगों के भ्रम से बहककर अपनी दृढ़ स्थिति से गिर न जाओ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपनी दृढ़ स्थिति’ का अनुवाद ‘अपनी स्थिरता’ या ‘अपनी दृढ़ता’ भी हो सकता है। यूनानी शब्द στηριγμός इन अर्थों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑμεῖς οὖν
  choice: इसलिए ... तुम
  rationale: οὖν पिछले कथन से निष्कर्षसूचक संबंध जोड़ता है; हिन्दी में क्रिया-रूप से ὑμεῖς स्पष्ट है, और सम्बोधन के साथ उसका बल स्वाभाविक रूप से बना रहता है।
- source_word: ἀγαπητοί
  choice: हे प्रियो
  rationale: यह स्नेहपूर्ण सम्बोधन है; ‘हे प्रियो’ पत्रात्मक गरिमा और आत्मीयता दोनों बनाए रखता है।
- source_word: προγινώσκοντες
  choice: जब तुम ये बातें पहले से जानते हो
  rationale: कृदन्त में पूर्वज्ञान/पूर्वचेतावनी का भाव है। प्रसंगसूचक बहुवचन ‘ये बातें’ हिन्दी में स्वाभाविक है और आसपास के उपदेशों की ओर संकेत करता है।
- source_word: φυλάσσεσθε
  choice: सावधान रहो
  rationale: वर्तमान मध्यम आज्ञार्थक लगातार सतर्क रहने का आग्रह करता है; ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: τῇ τῶν ἀθέσμων πλάνῃ
  choice: व्यवस्था-विहीन लोगों के भ्रम में
  rationale: πλάνη यहाँ भटकाने वाले भ्रम/गलती को दर्शाता है। ἀθέσμος स्थापित नैतिक व्यवस्था की अवहेलना करने वालों को बताता है; ‘व्यवस्था-विहीन’ इस भाव को केवल सामान्य ‘दुष्ट’ कहने से अधिक निकट रखता है।
- source_word: συναπαχθέντες
  choice: उनके साथ बहकर
  rationale: संयुक्त क्रिया दूसरों के साथ खिंच या बह जाने का भाव देती है; ‘उनके साथ बहकर’ निष्क्रिय प्रभाव और सहगमन दोनों को संक्षेप में व्यक्त करता है।
- source_word: ἐκπέσητε
  choice: गिर न जाओ
  rationale: ἐκπίπτω के गिरने के रूपक को बनाए रखा गया है और इसे किसी विशिष्ट धर्मवैज्ञानिक निष्कर्ष, जैसे धर्मत्याग, तक सीमित नहीं किया गया।
- source_word: τοῦ ἰδίου στηριγμοῦ
  choice: अपनी दृढ़ता से
  rationale: στηριγμός स्थिरता, दृढ़ता या दृढ़ स्थिति दर्शाता है। ‘अपनी दृढ़ता’ ἰδίου के आत्मवाचक अधिकार और मूल संज्ञा का भाव स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: क्या ἐκπέσητε उद्धार खोने अथवा धर्मत्याग का अनिवार्य संकेत है
  choice: ‘अपनी दृढ़ता से गिर न जाओ’—चेतावनी को प्रबल रखते हुए धर्मवैज्ञानिक निष्कर्ष को अनिर्धारित रखा गया।
  alternative: ‘अपने विश्वास से भटक न जाओ’ या ‘अपना उद्धार न खो दो’
  rationale: यूनानी पाठ किसी दृढ़ स्थिति से गिरने की चेतावनी देता है, पर यहाँ स्वयं यह निर्धारित नहीं करता कि उसका तात्पर्य उद्धार की हानि, पूर्ण धर्मत्याग, या सामान्य आध्यात्मिक अस्थिरता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; स्नेहपूर्ण पत्रात्मक सम्बोधन और गंभीर चेतावनी का गरिमापूर्ण किंतु साधारण पाठकों के लिए स्पष्ट रूप। ‘व्यवस्था-विहीन’ कुछ औपचारिक है, पर ἀθέσμος के स्थापित नैतिक मानकों की अवहेलना वाले भाव को सुरक्षित रखता है।
