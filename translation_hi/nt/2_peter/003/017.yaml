revisions:
- from: इसलिए, हे प्रियो, जब तुम ये बातें पहले से जानते हो, तो सावधान रहो, ताकि व्यवस्था-विहीन लोगों के भ्रम में उनके साथ बहकर अपनी दृढ़ता से गिर न जाओ।[a]
  to: इसलिए, हे प्रिय जनो, यह पहले से जानते हुए सावधान रहो, ताकि व्यवस्था-विहीन लोगों के भ्रम से बहककर अपनी दृढ़ स्थिति से गिर न जाओ।[a]
  rationale: The revision retains the inferential transition, affectionate address, advance knowledge, ongoing vigilance, and the warning against being led astray by the error of lawless people. It improves the naturalness of the Hindi and more closely relates the misleading influence to “भ्रम,” while preserving the Greek warning’s theological openness.
