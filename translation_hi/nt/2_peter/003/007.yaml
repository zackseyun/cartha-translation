  text: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ ⸀αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρὶ τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/007.yaml
  text: But the present heavens and the earth are stored up by the same word, being kept for fire until the day of judgment and destruction of ungodly men.
translation:
  language: hi
  text: परन्तु वर्तमान आकाश और पृथ्वी उसी वचन के द्वारा संचित रखे गए हैं और आग के लिए सुरक्षित रखे जा रहे हैं, न्याय और भक्तिहीन मनुष्यों[a] के विनाश के दिन तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भक्तिहीन लोग”; यूनानी “मनुष्यों” यहाँ सामान्य अर्थ में सभी लोगों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ
  choice: परन्तु वर्तमान आकाश और पृथ्वी
  rationale: δέ पिछले संसार के साथ विरोध दर्शाता है, इसलिए ‘परन्तु’; νῦν वर्तमान सृष्टि-व्यवस्था को सूचित करता है। यूनानी बहुवचन οὐρανοί के लिए हिन्दी में स्वाभाविक सामूहिक रूप ‘आकाश’ रखा गया है।
- source_word: τῷ αὐτῷ λόγῳ
  choice: उसी वचन के द्वारा
  rationale: λόγος संदर्भ में परमेश्वर के प्रभावशाली वचन की ओर लौटता है; करणवाचक दत्तिव को ‘के द्वारा’ और αὐτῷ की पूर्वसंदर्भी शक्ति को ‘उसी’ से व्यक्त किया गया है।
- source_word: τεθησαυρισμένοι εἰσὶν
  choice: संचित रखे गए हैं
  rationale: परिप्रयुक्त पूर्णकाल पहले किए गए कार्य से उत्पन्न वर्तमान अवस्था बताता है। ‘संचित रखे गए हैं’ θησαυρίζω की भंडार में रखने की छवि बनाए रखता है और आगे के τηρούμενοι से भेद भी रखता है।
- source_word: πυρὶ τηρούμενοι
  choice: आग के लिए ... सुरक्षित रखे जा रहे हैं
  rationale: τηρέω का निरंतर संरक्षण/आरक्षण भाव ‘सुरक्षित रखे जा रहे हैं’ से व्यक्त होता है; अनिर्दिष्ट πυρί को ‘आग के लिए’ कहा गया है, बिना आग के स्वरूप पर अतिरिक्त व्याख्या जोड़े।
- source_word: εἰς ἡμέραν κρίσεως
  choice: न्याय के दिन तक
  rationale: εἰς यहाँ उस भावी समय-बिंदु की ओर गति या अवधि का अंतिम बिंदु दर्शाता है; हिन्दी में ‘तक’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ ἀπωλείας
  choice: जब ... विनाश होगा
  rationale: ἀπώλεια को स्पष्ट आधुनिक हिन्दी ‘विनाश’ से व्यक्त किया गया है। वाक्य-विन्यास यह स्पष्ट करता है कि विनाश का संबंध भक्तिहीन मनुष्यों से है, जबकि κρίσεως के साथ समन्वय बना रहता है।
- source_word: τῶν ἀσεβῶν ἀνθρώπων
  choice: भक्तिहीन मनुष्यों
  rationale: ἀσεβής परमेश्वर के प्रति श्रद्धा/भक्ति के अभाव को दर्शाता है, अतः ‘भक्तिहीन’; ἄνθρωποι के मानवजाति-सामान्य अर्थ को ‘मनुष्य’ सटीक रूप से व्यक्त करता है।
theological_decisions:
- issue: आने वाली अग्निमय परिणति का स्वरूप
  choice: पद केवल यह कहता है कि वर्तमान आकाश और पृथ्वी भावी आग के लिए रखे गए हैं और भक्तिहीन मनुष्यों का विनाश होगा।
  alternative: सृष्टि का पूर्ण उन्मूलन, अथवा आग द्वारा सृष्टि का शुद्धिकरण और रूपांतरण।
  rationale: ἀπωλείας का व्याकरणिक संबंध सीधे τῶν ἀσεβῶν ἀνθρώπων से है। यह पद अपने आप में यह निर्धारित नहीं करता कि आकाश और पृथ्वी का परिणाम पूर्ण उन्मूलन होगा या रूपांतरण; इसलिए अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘संचित’ और ‘सुरक्षित’ के अलग शब्दों द्वारा τεθησαυρισμένοι तथा τηρούμενοι का भेद बनाए रखा गया है। दीर्घ यूनानी वाक्य को स्पष्ट करने के लिए डैशयुक्त उपवाक्य प्रयोग किया गया है।
