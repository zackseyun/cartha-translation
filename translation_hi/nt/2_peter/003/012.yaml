source:
  edition: SBLGNT
  text: προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/012.yaml
  text: as you wait for and hasten the coming of the day of God[a], because of which the heavens, being set on fire, will be dissolved, and the elements, burning[b], will melt.
translation:
  language: hi
  text: परमेश्वर के दिन के आगमन की प्रतीक्षा करते हुए और उसे शीघ्र करते हुए, जिसके कारण आकाश आग में जलते हुए विघटित हो जाएँगे और तत्त्व जलते हुए पिघल जाएँगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के दिन के आगमन की उत्सुकता से प्रतीक्षा करते हुए।” यूनानी क्रिया का अर्थ “शीघ्र करना” या “उत्सुकता से प्रतीक्षा करना” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “तत्त्व” संसार के आधारभूत घटकों को, या सम्भवतः आकाशीय पिंडों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσδοκῶντας
  choice: बाट जोहते
  rationale: यह अभिव्यक्ति आशाभरी और निरंतर प्रतीक्षा का भाव स्वाभाविक, गरिमापूर्ण हिन्दी में व्यक्त करती है।
- source_word: σπεύδοντας
  choice: उसे शीघ्र लाते
  rationale: कर्म के रूप में παρουσίαν के साथ क्रिया का सीधा अर्थ ‘आगमन को शीघ्र लाना’ रखा गया है; ‘उत्कंठा से प्रतीक्षा करना’ सम्भव वैकल्पिक अर्थ है और पादटिप्पणी में सुरक्षित है।
- source_word: παρουσίαν
  choice: आगमन
  rationale: अंत-कालीन प्रसंग में यह उपस्थिति/आने की घटना को स्पष्ट और प्रचलित धार्मिक हिन्दी में व्यक्त करता है।
- source_word: τῆς τοῦ θεοῦ ἡμέρας
  choice: परमेश्वर के दिन
  rationale: मूल की असामान्य अभिव्यक्ति को ‘प्रभु का दिन’ में बदले बिना औपचारिक भेद बनाए रखता है।
- source_word: δι’ ἣν
  choice: उस दिन के कारण
  rationale: διά और कर्मकारक का कारणसूचक अर्थ यहाँ आगामी ब्रह्मांडीय विघटन से स्वाभाविक रूप से जुड़ता है।
- source_word: οὐρανοὶ
  choice: आकाश
  rationale: हिन्दी में ‘आकाश’ रूप से एकवचन होते हुए भी व्यापक ब्रह्मांडीय मंडलों को स्वाभाविक रूप से व्यक्त करता है; कृत्रिम ‘आकाशों’ से बचा गया है।
- source_word: πυρούμενοι
  choice: आग में जलकर
  rationale: आग से प्रभावित होने का निष्क्रिय भाव और परिणामी दशा दोनों सहज हिन्दी में व्यक्त होते हैं।
- source_word: λυθήσονται
  choice: विलीन हो जाएँगे
  rationale: यह खुलकर बिखर जाने या विघटित होने का भाव देता है और पूर्ण तत्त्वमीमांसक विनाश का दावा नहीं करता।
- source_word: στοιχεῖα
  choice: मूल तत्त्व
  rationale: यह संसार के आधारभूत घटकों का व्यापक अर्थ रखता है, जबकि सम्भावित खगोलीय संदर्भ को पादटिप्पणी में खुला रखा गया है।
- source_word: καυσούμενα
  choice: धधकते हुए
  rationale: तीव्र ताप और जलने की जारी प्रक्रिया को संक्षिप्त तथा सजीव हिन्दी में व्यक्त करता है।
- source_word: τήκεται
  choice: पिघल जाएँगे
  rationale: ताप के कारण पिघलने का मूल अर्थ स्पष्ट करता है; प्रसंग के भविष्यकालीन ढाँचे के अनुरूप हिन्दी भविष्यकाल लिया गया है।
theological_decisions:
- issue: σπεύδοντας τὴν παρουσίαν का अर्थ
  choice: आगमन को शीघ्र लाना
  alternative: आगमन की उत्कंठा से प्रतीक्षा करना
  rationale: प्रत्यक्ष कर्म के साथ ‘शीघ्र लाना’ व्याकरणतः सीधा अर्थ है, पर क्रिया में ‘उत्सुक होना/उत्कंठा से प्रतीक्षा करना’ भी सम्भव है। मुख्य पाठ और पादटिप्पणी दोनों मिलकर वास्तविक धार्मिक तनाव को बनाए रखते हैं।
- issue: στοιχεῖα का अभिप्राय
  choice: मूल तत्त्व
  alternative: आकाशीय पिंड
  rationale: यह शब्द इस अंत-कालीन संदर्भ में विवादित है। व्यापक अनुवाद किसी एक प्राचीन ब्रह्मांड-विज्ञान को आरोपित नहीं करता और वैकल्पिक संदर्भ पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘बाट जोहना’ आशाभरी प्रतीक्षा के लिए परिचित मुहावरा है। मूल की दोनों प्रमुख अस्पष्टताएँ पादटिप्पणियों सहित सुरक्षित रखी गई हैं।
