source:
  edition: SBLGNT
  text: Τούτων ⸀οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/011.yaml
  text: Since all these things are being dissolved in this way[a], what sort of people ought you to be in holy conduct and godliness[b],
translation:
  language: hi
  text: जब ये सब बातें इस प्रकार विघटित हो रही हैं[a], तो तुम्हें पवित्र आचरण और भक्ति में किस प्रकार के व्यक्ति होना चाहिए?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नष्ट की जा रही हैं”; यूनानी शब्द का अधिक शाब्दिक अर्थ “खोली जा रही हैं” या “विघटित की जा रही हैं” है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हें कैसे लोग होना चाहिए?”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων ... πάντων
  choice: ये सब कुछ
  rationale: यह पदबंध निकटवर्ती संदर्भ में बताई गई सृष्टि की सभी वस्तुओं और व्यवस्थाओं की ओर संकेत करता है; ‘सब कुछ’ सहज हिन्दी में निहित संदर्भ को व्यक्त करता है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह क्रियाविशेषण विघटन के ढंग की ओर संकेत करता है और औपचारिकता तथा सहजता दोनों बनाए रखता है।
- source_word: λυομένων
  choice: विघटित हो रहा है
  rationale: λύω का कृदंत यहाँ खुलने, बिखरने या व्यवस्था के टूट जाने का भाव देता है। ‘विघटित’ इस मूल अर्थ को रखता है और ‘नष्ट’ जैसी अधिक व्याख्यात्मक तीव्रता नहीं जोड़ता।
- source_word: ποταποὺς
  choice: कैसे लोग
  rationale: यह प्रश्न श्रोताओं के प्रकार और नैतिक गुण के विषय में है; ‘कैसे लोग’ आधुनिक हिन्दी में इसका सीधा और स्वाभाविक रूप है।
- source_word: δεῖ ὑπάρχειν ὑμᾶς
  choice: तुम्हें ... होना चाहिए
  rationale: यह रचना नैतिक आवश्यकता व्यक्त करती है। ‘होना चाहिए’ उपदेशात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν ἁγίαις ἀναστροφαῖς
  choice: पवित्र आचरण में
  rationale: ἀναστροφή जीवन-व्यवहार या चाल-चलन को सूचित करता है। हिन्दी में सामूहिक एकवचन ‘आचरण’ यूनानी बहुवचन का स्वाभाविक समतुल्य है।
- source_word: εὐσεβείαις
  choice: भक्ति में
  rationale: εὐσέβεια श्रद्धापूर्ण, परमेश्वराभिमुख जीवन को दर्शाता है। ‘भक्ति’ सामान्य पाठक के लिए संक्षिप्त और सुबोध है, यद्यपि इसका आशय केवल भावना नहीं बल्कि जीवन में प्रकट श्रद्धा भी है।
theological_decisions:
- issue: वर्तमान संसार की अंतिम दशा
  choice: विघटित हो रहा है
  alternative: नष्ट किया जा रहा है
  rationale: यूनानी शब्द मूलतः खुलने या विघटित होने की भाषा इस्तेमाल करता है। संदर्भ अंतिम समय का है, पर अनुवाद ने उससे अधिक प्रबल ‘नाश’ का अर्थ मुख्य पाठ में नहीं थोपा।
- issue: भक्ति का आशय
  choice: भक्ति
  alternative: परमेश्वर के प्रति श्रद्धापूर्ण जीवन
  rationale: संक्षिप्त मुख्य पाठ के लिए ‘भक्ति’ स्वाभाविक है; इसे किसी विशिष्ट संप्रदाय की साधना तक सीमित न समझकर श्रद्धा से संचालित जीवन के व्यापक अर्थ में लिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्रश्नवाचक आशय को विस्मयादिबोधक रूप में रखा गया है, क्योंकि यूनानी वाक्य नैतिक आत्मपरीक्षण को तीव्र करता है और अगली आयत में आगे बढ़ता है।
