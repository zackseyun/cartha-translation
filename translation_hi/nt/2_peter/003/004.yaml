  text: καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/004.yaml
  text: and saying[a], “Where is the promise of his coming? For ever since the fathers fell asleep[b], all things continue just as they have from the beginning of creation.”
translation:
  language: hi
  text: और कहते हैं, “उसके आगमन[a] की प्रतिज्ञा कहाँ है? क्योंकि जब से पूर्वज सो गए, सब कुछ सृष्टि के आरम्भ से जैसा था, वैसा ही बना हुआ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आगमन” के लिए प्रयुक्त यूनानी शब्द का अर्थ “उपस्थिति” या “आना” भी हो सकता है। इस प्रसंग में यह मसीह के अपेक्षित भावी आगमन की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγοντες
  choice: और कहते हैं
  rationale: वर्तमान कृदन्त को पिछले पद के उपहास करने वालों के वर्णन से जोड़ते हुए हिन्दी में स्वाभाविक प्रवाह रखा गया है।
- source_word: ἐπαγγελία
  choice: प्रतिज्ञा
  rationale: यह उस आश्वासन को व्यक्त करता है जिसकी पूर्ति—प्रभु का आगमन—पर उपहास करने वाले प्रश्न उठा रहे हैं।
- source_word: παρουσίας
  choice: आगमन
  rationale: इस युगान्त-संबंधी प्रसंग में यह अपेक्षित भावी आने या पहुँचने को दर्शाता है; ‘आगमन’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: ἀφ’ ἧς
  choice: जब से ... तब से
  rationale: यह बीते हुए एक समय-बिन्दु से अब तक की अवधि व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: οἱ πατέρες
  choice: पूर्वज
  rationale: यूनानी में संबंधसूचक सर्वनाम नहीं है। ‘पूर्वज’ पहले की पीढ़ियों का अर्थ स्वाभाविक हिन्दी में देता है, बिना ‘हमारे’ जोड़े।
- source_word: ἐκοιμήθησαν
  choice: सो गए हैं
  rationale: मृत्यु के लिए प्रयुक्त मूल रूपक को बनाए रखता है; उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन की व्यापकता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: οὕτως διαμένει
  choice: वैसा ही बना हुआ है
  rationale: उपहास करने वालों के इस दावे को व्यक्त करता है कि वस्तुस्थिति में कोई परिवर्तन नहीं हुआ।
- source_word: ἀπ’ ἀρχῆς κτίσεως
  choice: सृष्टि के आरम्भ से
  rationale: यूनानी संबंधवाचक रचना का निकट, स्पष्ट और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: युगान्त-संबंधी प्रसंग में παρουσία का अर्थ
  choice: उसका आगमन
  alternative: उसकी उपस्थिति; उसका आना
  rationale: प्रसंग भावी वापसी की प्रतिज्ञा में कथित विलम्ब का उपहास करने से संबंधित है। ‘आगमन’ गतिशील अर्थ व्यक्त करता है, पर पादटिप्पणी मूल शब्द की ‘उपस्थिति’ वाली अर्थ-छाया भी सुरक्षित रखती है।
- issue: ἐκοιμήθησαν में मृत्यु के रूपक का अनुवाद
  choice: सो गए हैं
  alternative: मर गए हैं
  rationale: मूल पाठ मृत्यु को सीधे कहने के बजाय सोने का रूपक अपनाता है। रूपक बनाए रखने से पाठ की अभिव्यक्ति सुरक्षित रहती है, जबकि पादटिप्पणी उसका अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘पूर्वज’ सामान्य पाठक के लिए ‘पितर’ से अधिक स्पष्ट है। मूल के मृत्यु-संबंधी रूपक और παρουσία की अर्थ-छाया को पादटिप्पणियों सहित सुरक्षित रखा गया है।
