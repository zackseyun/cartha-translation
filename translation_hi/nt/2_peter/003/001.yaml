id: 2PE.3.1
reference: 2 Peter 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/001.yaml
  text: Beloved[a], this is now the second letter I am writing to you; in both of them I am stirring up your sincere mind by way of reminder[b],
translation:
  language: hi
  text: प्रिय जनो, अब मैं तुम्हें यह दूसरी पत्री लिख रहा हूँ। इन दोनों पत्रियों में[a] मैं स्मरण दिलाकर तुम्हारे निष्कपट मन[b] को जागृत कर रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इनमें”; यूनानी शब्द बहुवचन में है और सबसे स्वाभाविक रूप से दोनों पत्रियों की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: या, “निर्मल मन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀγαπητοί
  choice: प्रिय जनो
  rationale: बहुवचन संबोधन का स्नेहपूर्ण और गरिमापूर्ण भाव व्यक्त करता है; यह सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Ταύτην ἤδη ... δευτέραν ... ἐπιστολήν
  choice: अब मैं तुम्हें यह दूसरी पत्री लिख रहा हूँ
  rationale: यूनानी वाक्यक्रम को स्वाभाविक हिन्दी में पुनर्गठित करते हुए ἤδη का भाव ‘अब’ और δευτέραν का स्पष्ट अर्थ ‘दूसरी’ रखा गया है।
- source_word: γράφω
  choice: लिख रहा हूँ
  rationale: पत्र लिखते समय प्रयुक्त वर्तमान काल को हिन्दी में स्वाभाविक अपूर्ण वर्तमान से व्यक्त किया गया है।
- source_word: ἐν αἷς
  choice: इन दोनों पत्रियों में
  rationale: स्त्रीलिंग बहुवचन संबंधवाचक सर्वनाम का सबसे स्वाभाविक संबंध उल्लिखित दो पत्रियों से है; ‘दोनों’ इस व्याकरणिक बहुवचन को स्पष्ट करता है।
- source_word: διεγείρω
  choice: जागृत कर रहा हूँ
  rationale: क्रिया का रूपकात्मक अर्थ निष्क्रियता से जगाकर सजग करना है; ‘जागृत करना’ इसे गरिमापूर्ण और समझने योग्य हिन्दी में रखता है।
- source_word: ἐν ὑπομνήσει
  choice: स्मरण दिलाकर
  rationale: यह साधन अथवा रीति को व्यक्त करता है और हिन्दी में ‘याद दिलाने के द्वारा’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: εἰλικρινῆ διάνοιαν
  choice: निष्कपट मन
  rationale: διάνοια के मानसिक/विचारगत अर्थ और εἰλικρινής की सच्चाई अथवा शुद्धता—दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑμῶν
  choice: तुम्हारे
  rationale: समुदाय को संबोधित बहुवचन संबंधसूचक रूप को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बहुवचन संबंधवाचक सर्वनाम ἐν αἷς का संदर्भ
  choice: यह लेखक द्वारा प्राप्तकर्ताओं को लिखी गई दोनों पत्रियों की ओर संकेत करता है।
  alternative: इसे केवल वर्तमान पत्री की ओर संकेत करने वाला ढीला बहुवचन माना जाए।
  rationale: यूनानी बहुवचन का निकटतम और सबसे सीधा व्याकरणिक पूर्वपद उल्लिखित दो पत्रियाँ हैं। अनुवाद इसी सहज अर्थ को रखता है, जबकि पाद-टिप्पणी मूल की संक्षिप्त अभिव्यक्ति बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्नेहपूर्ण, गरिमापूर्ण पत्रात्मक स्वर अपनाया गया है। ‘प्रिय जनो’ और ‘पत्री’ सामान्य बाइबलीय प्रयोग से परिचित हैं, जबकि वाक्यरचना सरल और वर्तमान पाठकों के लिए सहज रखी गई है।
