source:
  edition: SBLGNT
  text: ἥξει δὲ ⸀ἡμέρα κυρίου ὡς ⸀κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα ⸀λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα ⸀εὑρεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/003/010.yaml
  text: But the day of the Lord will come like a thief[a], in which the heavens will pass away with a roar, and the elements, being burned, will be dissolved[c][b], and the earth and the works in it will be found.
translation:
  language: hi
  text: परन्तु प्रभु का दिन चोर के समान आएगा; उस दिन आकाश प्रचंड शोर के साथ मिट जाएँगे, मूल तत्त्व जलते हुए विघटित हो जाएँगे, और पृथ्वी तथा उस पर के कार्य पाए जाएँगे[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: कुछ लोग ‘पाए जाएँगे’ का अर्थ ‘उघाड़ दिए जाएँगे’ या ‘प्रकट हो जाएँगे’ समझते हैं।
    reason: alternative_reading
  - marker: c
    text: कई हस्तलिपियों में ‘पाए जाएँगे’ के स्थान पर ‘जलकर भस्म हो जाएँगे’ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἥξει
  choice: आएगा
  rationale: ἥκω के भविष्यकाल का स्वाभाविक अर्थ ‘आना’ है और यह ‘प्रभु के दिन’ के अचानक आगमन के लिए सहज हिन्दी है।
- source_word: ἡμέρα κυρίου
  choice: प्रभु का दिन
  rationale: यह भविष्यकालीन न्याय और परमेश्वर के हस्तक्षेप से जुड़ी स्थापित बाइबलीय अभिव्यक्ति है; इसे साप्ताहिक आराधना के दिन के अर्थ में नहीं लिया गया।
- source_word: κλέπτης
  choice: चोर
  rationale: उपमा अप्रत्याशित आगमन पर बल देती है; ‘चोर के समान’ हिन्दी में स्पष्ट और पारंपरिक बाइबलीय प्रयोग है।
- source_word: ἐν ᾗ
  choice: उस दिन
  rationale: शाब्दिक ‘जिसमें’ की अपेक्षा ‘उस दिन’ हिन्दी में स्वाभाविक रूप से संबंधवाचक अर्थ बनाए रखता है और घटनाओं को अभी बताए गए प्रभु के दिन से जोड़ता है।
- source_word: οἱ οὐρανοὶ
  choice: आकाश
  rationale: यूनानी बहुवचन का यहाँ व्यापक ब्रह्मांडीय अर्थ है; हिन्दी में ‘आकाश’ इसी अर्थ में स्वाभाविक सामूहिक संज्ञा है।
- source_word: ῥοιζηδόν
  choice: गरजते शब्द के साथ
  rationale: यह क्रियाविशेषण तीव्र सनसनाहट, गर्जना या प्रचंड ध्वनि का बोध कराता है; चुना हुआ वाक्यांश उसकी श्रव्य तीव्रता व्यक्त करता है, बिना किसी एक खास प्रकार की ध्वनि को अत्यधिक निश्चित किए।
- source_word: παρελεύσονται
  choice: मिट जाएँगे
  rationale: इस प्रलय-संबंधी संदर्भ में παρέρχομαι का अर्थ ‘बीत जाना/लुप्त हो जाना’ है; ‘मिट जाएँगे’ आधुनिक हिन्दी में उस समाप्ति को स्पष्ट करता है।
- source_word: στοιχεῖα
  choice: मूल तत्त्व
  rationale: शब्द ब्रह्मांड के घटकों या संभवतः आकाशीय पिंडों को सूचित कर सकता है। ‘मूल तत्त्व’ व्यापकता बनाए रखता है और संदर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: καυσούμενα
  choice: जलते हुए
  rationale: कृदन्त जलने की प्रक्रिया या अवस्था बताता है; यह रूप किसी स्पष्ट कर्ता को जोड़े बिना उसी अर्थ को व्यक्त करता है।
- source_word: λυθήσεται
  choice: विघटित हो जाएँगे
  rationale: λύω यहाँ खुल जाने, टूटकर बिखरने या घुल जाने की छवि देता है; ‘विघटित’ सामान्य ‘नष्ट’ की तुलना में इसे अधिक ठीक से व्यक्त करता है।
- source_word: γῆ
  choice: पृथ्वी
  rationale: आकाश और ब्रह्मांडीय तत्त्वों के संदर्भ में स्थानीय ‘भूमि’ के बजाय समूची ‘पृथ्वी’ अभिप्रेत है।
- source_word: τὰ ἐν αὐτῇ ἔργα
  choice: उस पर किए गए कार्य
  rationale: ἔργα कामों, कर्मों या किए गए कार्यों को सूचित करता है। यह अनुवाद अर्थ को समझने योग्य रखता है, पर उन्हें केवल नैतिक कर्म मानकर सीमित नहीं करता।
- source_word: εὑρεθήσεται
  choice: पाए जाएँगे
  rationale: प्रस्तुत SBLGNT पाठ का सीधा अर्थ ‘पाया जाना’ है। कठिन और विवादित वाक्यांश को सरल बनाकर कोई एक व्याख्या थोपने के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम वाक्यांश καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται का अर्थ
  choice: मुख्य पाठ में कठिन पाठ ‘पृथ्वी तथा उस पर किए गए कार्य पाए जाएँगे’ रखा गया है।
  alternative: ‘उघाड़ दिए जाएँगे/प्रकट हो जाएँगे’; या पाठांतर के अनुसार ‘जलकर भस्म हो जाएँगे।’
  rationale: दिए गए यूनानी पाठ में εὑρεθήσεται का सर्वाधिक सीधा अर्थ ‘पाया जाएगा’ है। वाक्यांश व्याख्यात्मक और पाठालोचनात्मक दोनों स्तरों पर विवादित है, इसलिए मुख्य पाठ में कठिन रूप रखा और विकल्प पादटिप्पणियों में दिए गए हैं।
- issue: στοιχεῖα का संदर्भ
  choice: ‘मूल तत्त्व’ कहकर व्यापक अर्थ बनाए रखा गया है।
  alternative: ‘आकाशीय पिंड’ या ‘ब्रह्मांड के मूल घटक।’
  rationale: संदर्भ ब्रह्मांडीय है, पर शब्द स्वयं इन संभावनाओं में से किसी एक को निर्विवाद रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘प्रभु का दिन’, ‘चोर के समान’ और ‘पृथ्वी’ जैसी परिचित बाइबलीय अभिव्यक्तियाँ रखी गई हैं। विवादित अंतिम वाक्यांश और στοιχεῖα की अनिश्चितता को मुख्य पाठ तथा पादटिप्पणियों के माध्यम से पारदर्शी रखा गया है।
