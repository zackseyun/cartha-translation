lexical_decisions:
- source_word: δι’ ὧν
  choice: जिनके द्वारा
  rationale: διά के साथ संबंधवाचक सर्वनाम साधन या माध्यम व्यक्त करता है। बहुवचन ‘जिनके’ पिछले पद में बताए गए साधनों की ओर संकेत करता है और उनके सटीक संदर्भ को खुला रखता है।
- source_word: ὁ τότε κόσμος
  choice: उस समय का संसार
  rationale: यह पदबंध नूह के समय विद्यमान मानव-जगत और उसकी व्यवस्था को सूचित करता है तथा आगे आने वाले ‘वर्तमान’ संसार से कालगत भेद बनाए रखता है।
- source_word: ὕδατι
  choice: पानी से
  rationale: करण कारक का भाव बाढ़ आने के साधन को दर्शाता है। ‘पानी से’ आधुनिक हिन्दी में सहज है।
- source_word: κατακλυσθεὶς
  choice: जलमग्न होकर
  rationale: अओरिस्ट कर्मवाच्य कृदंत पानी से पूरी तरह डुबो दिए जाने का भाव देता है। ‘जलमग्न होकर’ मुख्य क्रिया के साथ इसकी कृदंतीय संबंधता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀπώλετο
  choice: नष्ट हो गया
  rationale: मध्यवाच्य/अकर्मक रूप यहाँ विनाश को प्राप्त होने का अर्थ देता है। यह प्रलयकारी न्याय की गंभीरता व्यक्त करता है, पर अपने आप में पूर्ण अस्तित्व-लोप का दार्शनिक दावा नहीं करता।
theological_decisions:
- issue: जलप्रलय के न्याय का स्वरूप
  choice: नष्ट हो गया
  alternative: विनाश को प्राप्त हुआ
  rationale: यूनानी क्रिया उस समय के संसार के प्रलयकारी विनाश को बताती है, पर तत्त्वमीमांसात्मक अर्थ में संपूर्ण अस्तित्व-लोप को अनिवार्य नहीं करती। चुना हुआ अनुवाद इस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘जलमग्न’ सामान्य पाठक के लिए परिचित है, जबकि ‘नष्ट हो गया’ मूल क्रिया की गंभीरता और अर्थगत व्यापकता दोनों बनाए रखता है।
