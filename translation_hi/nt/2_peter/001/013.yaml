  yaml_path: translation/nt/2_peter/001/013.yaml
  text: But I consider it right[a], as long as I am in this tent, to stir you up by way of reminder,
translation:
  language: hi
  text: पर मैं यह उचित समझता हूँ कि, जब तक मैं इस डेरे[a] में हूँ, तब तक तुम्हें स्मरण दिलाकर सचेत करूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निवास” या “शरीर”; यूनानी शब्द का शाब्दिक अर्थ “डेरा” या “तंबू” है और यहाँ पतरस की वर्तमान नश्वर देह के लिए रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: उचित
  rationale: ἡγοῦμαι के साथ यह उस कार्य को व्यक्त करता है जिसे लेखक सही या करणीय मानता है; आधुनिक हिन्दी में “उचित समझता हूँ” स्वाभाविक और अर्थनिष्ठ है।
- source_word: δὲ
  choice: पर
  rationale: यह पिछले कथन से हल्का विरोध या विचार की अगली कड़ी दिखाता है; “पर” इस संक्रमण को संक्षेप में व्यक्त करता है।
- source_word: ἡγοῦμαι
  choice: समझता हूँ
  rationale: यह सोच-विचार से किए गए आकलन को दर्शाता है; “उचित समझता हूँ” हिन्दी में स्वाभाविक प्रयोग है।
- source_word: ἐφ’ ὅσον
  choice: जब तक … तब तक
  rationale: εἰμί के साथ यह अवधि का बोध कराता है; हिन्दी की सहसंबंधी रचना मूल के कालगत अर्थ को स्पष्ट रूप से व्यक्त करती है।
- source_word: σκηνώματι
  choice: डेरे
  rationale: σκηνώμα अस्थायी तंबू-जैसे निवास को दर्शाता है और यहाँ देहधारी नश्वर जीवन का रूपक है। “डेरा” रूपक तथा अस्थायित्व दोनों को बनाए रखता है और अगले पद में उसे उतार देने की छवि से मेल खाता है।
- source_word: διεγείρειν
  choice: जागृत करना
  rationale: क्रिया का मूल भाव जगाना या सचेत करना है। “जागृत करना” नैतिक और आत्मिक प्रेरणा के प्रसंग में उपयुक्त है तथा मूल रूपक को बनाए रखता है।
- source_word: ἐν ὑπομνήσει
  choice: याद दिलाकर
  rationale: 'यह साधन या रीति बताता है: लेखक उन्हें स्मरण कराने के द्वारा जागृत करता है। “याद दिलाकर” आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।'
theological_decisions:
- issue: “इस डेरे” का रूपकात्मक संकेत
  choice: मुख्य पाठ में देह का अर्थ खोलने के बजाय “इस डेरे” का रूपक बनाए रखा गया।
  alternative: इस शरीर में / इस निवास में
  rationale: यूनानी पाठ सीधे डेरे की छवि इस्तेमाल करता है। इसे बनाए रखने से नश्वर देहधारी जीवन की अस्थायित्वपूर्ण छवि और अगले पद से उसका संबंध सुरक्षित रहता है, जबकि व्याख्या पादटिप्पणी में दी जाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “उचित समझता हूँ” विचारपूर्ण निर्णय व्यक्त करता है, जबकि “याद दिलाकर जागृत करना” मूल के साधन और क्रिया दोनों को सुरक्षित रखता है।
