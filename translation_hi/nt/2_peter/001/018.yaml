revisions:
- from: और जब हम उसके साथ उस पवित्र पहाड़ पर थे, तब हमने स्वयं स्वर्ग से आई हुई यह वाणी सुनी।
  to: और जब हम उसके साथ उस पवित्र पहाड़ पर थे, तब हमने स्वयं स्वर्ग से लाई गई यह वाणी सुनी।
  rationale: A single lexical adjustment restores the passive-conveyance sense of ἐνεχθεῖσαν. The revision retains the draft’s natural temporal ordering, emphatic ‘हमने स्वयं,’ and noncommittal reference to the unnamed holy mountain.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T03:45:03Z'
review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the voice, the emphatic eyewitness ‘we ourselves,’ the hearing event, the association with him, and the holy mountain. However, ‘स्वर्ग से आई हुई’ principally expresses origin/arrival and does not adequately retain the passive force of ἐνεχθεῖσαν (‘having been borne/brought from heaven’).
  naturalness: The sentence order and register are natural modern standard Hindi. ‘वाणी’ is apt in this context, and ‘उस पवित्र पहाड़ पर’ is idiomatic and does not identify the mountain beyond the Greek text.
  terminology: ‘वाणी,’ ‘स्वर्ग,’ and ‘पवित्र’ are appropriate, clear biblical-register terms. Replacing ‘आई हुई’ with ‘लाई गई’ preserves the source’s passive participle without specifying the unstated agent.
  issues:
  - severity: medium
    issue: The passive nuance of ἐνεχθεῖσαν is weakened in ‘स्वर्ग से आई हुई।’
    rationale: ‘आई हुई’ is intransitive and can merely mean that the voice originated in or came from heaven. The Greek uses a passive participle of φέρω, describing the voice as conveyed/brought from heaven. ‘स्वर्ग से लाई गई’ more directly represents this while remaining natural Hindi.
  revised_text: और जब हम उसके साथ उस पवित्र पहाड़ पर थे, तब हमने स्वयं स्वर्ग से लाई गई यह वाणी सुनी।
  revised_footnotes: []
  revision_rationale: A single lexical adjustment restores the passive-conveyance sense of ἐνεχθεῖσαν. The revision retains the draft’s natural temporal ordering, emphatic ‘हमने स्वयं,’ and noncommittal reference to the unnamed holy mountain.
