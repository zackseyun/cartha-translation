id: 2PE.1.18
reference: 2 Peter 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ⸂ἁγίῳ ὄρει⸃.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/018.yaml
  text: And we ourselves heard this voice brought from heaven when we were with him on the holy mountain[a].
translation:
  language: hi
  text: और जब हम उसके साथ उस पवित्र पहाड़ पर थे, तब हमने स्वयं स्वर्ग से लाई गई यह वाणी सुनी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταύτην τὴν φωνὴν
  choice: यह वाणी
  rationale: यह पद पिछली आयत में दिए गए परमेश्वर के कथन की ओर संकेत करता है; इसलिए सामान्य ‘आवाज़’ की अपेक्षा ‘वाणी’ बोली गई बात को अधिक स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: ἡμεῖς
  choice: हमने स्वयं
  rationale: यूनानी में स्पष्ट सर्वनाम अनिवार्य नहीं है, इसलिए उसका प्रयोग बल देता है। ‘हमने स्वयं’ प्रत्यक्षदर्शी होने के इस बल को बनाए रखता है।
- source_word: ἠκούσαμεν
  choice: सुनी
  rationale: यह क्रिया उस एक घटना को बताती है जिसमें उन्होंने स्वर्गीय वाणी सुनी, न कि लगातार सुनते रहने या ध्यान से सुनने की क्रिया को।
- source_word: ἐξ οὐρανοῦ ἐνεχθεῖσαν
  choice: स्वर्ग से आई हुई
  rationale: ἐνεχθεῖσαν φέρω का कर्मवाच्य कृदंत है और वाणी के स्वर्ग से पहुँचाए जाने का भाव रखता है। हिंदी में ‘स्वर्ग से आई हुई वाणी’ स्वाभाविक है और स्रोत तथा दिशा दोनों बनाए रखती है।
- source_word: σὺν αὐτῷ ὄντες
  choice: जब हम उसके साथ ... थे
  rationale: कृदंतीय रचना को समयसूचक उपवाक्य के रूप में देना स्वाभाविक हिंदी है। संदर्भ में ‘उसके’ का संकेत यीशु की ओर है।
- source_word: ἐν τῷ ἁγίῳ ὄρει
  choice: उस पवित्र पहाड़ पर
  rationale: हिंदी में पहाड़ के संबंध में ‘पर’ स्वाभाविक है। निश्चित पदबंध के कारण ‘उस’ उपयुक्त है, और ‘पवित्र’ ἁγίῳ का मानक बाइबलीय अर्थ व्यक्त करता है।
theological_decisions:
- issue: ‘उस पवित्र पहाड़’ की पहचान
  choice: यीशु के रूपांतरण के पहाड़ का वर्णन, बिना उसका भौगोलिक नाम बताए
  alternative: इसे स्पष्ट रूप से ताबोर पर्वत या हेरमोन पर्वत कहना
  rationale: यूनानी पाठ पहाड़ को ‘पवित्र’ कहता है, पर उसका नाम नहीं बताता। इसलिए अनुवाद किसी पारंपरिक भौगोलिक पहचान को पाठ में नहीं जोड़ता।
- issue: ἐνεχθεῖσαν में वाणी के पहुँचाए जाने का कर्मवाच्य भाव
  choice: ‘स्वर्ग से आई हुई’ द्वारा स्वर्गीय स्रोत और वाणी के पहुँचने को स्वाभाविक हिंदी में व्यक्त करना
  alternative: ‘स्वर्ग से लाई/पहुँचाई गई’ कहना और निहित कर्ता को अधिक उभारना
  rationale: मूल पाठ कर्ता का नाम नहीं बताता। चुना हुआ रूप वाणी के स्वर्गीय उद्गम को स्पष्ट रखता है और किसी अतिरिक्त कर्ता या माध्यम को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। ‘वाणी’ धार्मिक संदर्भ में सुबोध है; वाक्यक्रम समय-परिस्थिति पहले रखकर हिंदी प्रवाह को सहज बनाता है।
