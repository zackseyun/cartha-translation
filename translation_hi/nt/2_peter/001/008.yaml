id: 2PE.1.8
reference: 2 Peter 1:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/008.yaml
  text: For if these things are yours and are increasing[c][b][a], they keep you from being ineffective or unfruitful in the knowledge of our Lord Jesus the Messiah.
translation:
  language: hi
  text: क्योंकि यदि ये बातें आप में मौजूद हैं और बढ़ती जाती हैं, तो ये आपको हमारे प्रभु यीशु मसीह के ज्ञान में न तो निष्क्रिय और न निष्फल होने देती हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ज्ञान” का अर्थ “पूरा ज्ञान” या “गहरा ज्ञान” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα
  choice: ये बातें
  rationale: यह संकेतवाचक पद पद 5–7 में गिनाई गई बातों की ओर लौटता है; ‘ये बातें’ मूल की व्यापक और अनिर्धारित अभिव्यक्ति बनाए रखता है।
- source_word: ὑμῖν ὑπάρχοντα
  choice: आप में मौजूद हैं
  rationale: दत्तिव ὑμῖν के साथ ὑπάρχοντα पाठकों में इन बातों की उपस्थिति या उनके पास इनके होने को व्यक्त करता है; हिन्दी में ‘आप में मौजूद हैं’ नैतिक गुणों के संदर्भ में स्वाभाविक है।
- source_word: πλεονάζοντα
  choice: बढ़ती जाती हैं
  rationale: यह वृद्धि और बहुतायत दोनों का संकेत दे सकता है; संदर्भ में निरंतर नैतिक बढ़ोतरी को व्यक्त करने के लिए यह सहज हिन्दी है।
- source_word: ἀργούς
  choice: निष्क्रिय
  rationale: यहाँ शब्द निष्फलता के समानांतर ऐसी अवस्था बताता है जिसमें व्यक्ति उपयोगी या प्रभावी कार्य नहीं करता; ‘निष्क्रिय’ मूल रूपक और सामान्य अर्थ को बनाए रखता है।
- source_word: ἀκάρπους
  choice: निष्फल
  rationale: यह फल न देने का रूपक सुरक्षित रखता है और ἀργούς के साथ स्वाभाविक युग्म बनाता है।
- source_word: καθίστησιν
  choice: होने देती हैं
  rationale: οὐκ ... οὐδὲ के साथ क्रिया परिणामसूचक है; ‘न तो ... और न ... होने देती हैं’ हिन्दी में नकारात्मक परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς τὴν ... ἐπίγνωσιν
  choice: के ज्ञान में
  rationale: εἰς यहाँ ज्ञान के संबंध या क्षेत्र को व्यक्त करता है; ‘ज्ञान में’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἐπίγνωσιν
  choice: ज्ञान
  rationale: शब्द में पूर्ण या गहरे ज्ञान की छाया हो सकती है, पर मुख्य पाठ में ‘ज्ञान’ सबसे स्वाभाविक है; विस्तृत अर्थ पादटिप्पणी में दिया गया है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος के मसीही उपाधि-प्रयोग के लिए मानक और गरिमापूर्ण हिन्दी।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός उपाधि है; हिन्दी में ‘मसीह’ उसके अर्थ और प्रचलित बाइबलीय रूप दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: Ἰησοῦ Χριστοῦ में Χριστοῦ का अनुवाद
  choice: यीशु मसीह
  alternative: यीशु ख्रीस्त/यीशु क्राइस्ट
  rationale: ‘मसीह’ Χριστός की उपाधिगत अर्थवत्ता को स्पष्ट रखता है और आधुनिक हिन्दी बाइबलीय भाषा में व्यापक रूप से समझा जाता है।
- issue: ἐπίγνωσις की तीव्रता
  choice: ज्ञान
  alternative: पूरा ज्ञान/गहरा ज्ञान
  rationale: मूल शब्द अधिक पूर्ण या गहरे ज्ञान का भाव दे सकता है, किंतु हर प्रयोग में उस तीव्रता को अनिवार्य बनाना उचित नहीं; अतः मुख्य पाठ सामान्य अर्थ रखता है और विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक बहुवचन ‘आप’; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज वाक्य-विन्यास। ‘निष्क्रिय’ और ‘निष्फल’ मूल के समानांतर नकारात्मक विशेषणों तथा फल के रूपक को बनाए रखते हैं।
