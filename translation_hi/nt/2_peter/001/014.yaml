id: 2PE.1.14
reference: 2 Peter 1:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/014.yaml
  text: knowing that the putting off of my tent is near[c][b][a], just as our Lord Jesus the Messiah made clear to me.
translation:
  language: hi
  text: यह जानते हुए कि मेरे तम्बू को उतार दिया जाना निकट है[a][b], जैसा कि हमारे प्रभु यीशु मसीह ने भी मुझे स्पष्ट किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शीघ्र है।”
    reason: ταχινή में निकटता के साथ शीघ्रता का भाव भी हो सकता है।
  - marker: b
    text: “तम्बू को उतार दिया जाना” पतरस की निकट आती मृत्यु का रूपक है; तम्बू से आशय उसकी वर्तमान देह है।
    reason: रूपक का अभिप्राय स्पष्ट करना, बिना मुख्य पाठ में उसे सीधे ‘मृत्यु’ से बदलने के।
lexical_decisions:
- source_word: εἰδὼς
  choice: मैं जानता हूँ
  rationale: यूनानी कृदन्त का पिछले वाक्य से सम्बन्ध बना रहता है; हिन्दी में स्वतंत्र उपवाक्य अधिक स्वाभाविक है और इसे स्पष्ट रूप से कारणसूचक बनाने से बचाता है।
- source_word: ταχινή
  choice: समय निकट है
  rationale: यह आसन्नता को स्वाभाविक हिन्दी में व्यक्त करता है। मूल शब्द में ‘शीघ्र’ का भाव भी सम्भव है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἀπόθεσις τοῦ σκηνώματός μου
  choice: मेरे तम्बू को उतार देने
  rationale: ‘उतार देना’ ἀπόθεσις के किसी वस्तु को अलग रख देने के भाव को और ‘तम्बू’ अस्थायी देह के रूपक को सुरक्षित रखता है।
- source_word: καθὼς καὶ
  choice: जैसा कि ... भी
  rationale: तुलना और पुष्टि, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ κύριος ἡμῶν Ἰησοῦς Χριστός
  choice: हमारे प्रभु यीशु मसीह
  rationale: κύριος को मानक उपाधि ‘प्रभु’ और Χριστός को हिन्दी में प्रचलित अर्थपूर्ण उपाधि ‘मसीह’ के रूप में रखा गया है।
- source_word: ἐδήλωσέν μοι
  choice: मुझे स्पष्ट कर दिया था
  rationale: क्रिया के ‘स्पष्ट करना/ज्ञात कराना’ अर्थ को व्यक्त करता है; भूतपूर्व घटना का हिन्दी में स्वाभाविक काल-संबंध भी बना रहता है।
theological_decisions:
- issue: पतरस की निकट आती मृत्यु का रूपक
  choice: मेरे तम्बू को उतार देने का समय निकट है
  alternative: मेरी मृत्यु निकट है
  rationale: मूल यूनानी मृत्यु को सीधे नहीं कहता, बल्कि देह को अस्थायी तम्बू मानकर उसे उतार देने का सजीव रूपक प्रयोग करता है; अनुवाद उस रूपक और उसकी धर्मवैचारिक गहराई को बनाए रखता है।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ पदवी के अर्थ को सुरक्षित रखते हुए आधुनिक मानक हिन्दी में परिचित ‘मसीह’ रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तम्बू को उतार देना’ जानबूझकर कुछ चित्रात्मक है, क्योंकि मूल पाठ भी मृत्यु को सीधे कहने के बजाय यही रूपक रखता है।
