  terminology: “भक्ति” is an appropriate established Hindi equivalent for reverent, God-directed devotion. “भाईचारे का स्नेह” naturally distinguishes φιλαδελφία from the following broader “प्रेम,” without imposing an unnecessary doctrinal definition. The footnote gives a legitimate lexical alternative and helpfully identifies the community-oriented sense.
