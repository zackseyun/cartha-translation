  source_fidelity: 'The translation accurately preserves the Greek virtue-chain structure: εὐσέβεια is rendered as “भक्ति,” φιλαδελφία as “भाईचारे का स्नेह,” and ἀγάπη as “प्रेम.” The repeated “... में ...” appropriately reflects the repeated ἐν δὲ τῇ ... τὴν ... construction, while “और” correctly conveys the mildly connective δέ.'
