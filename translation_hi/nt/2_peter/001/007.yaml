  yaml_path: translation/nt/2_peter/001/007.yaml
  text: and in godliness[a], brotherly affection; and in brotherly affection, love.
translation:
  language: hi
  text: और भक्ति में भाईचारे का स्नेह[a], और भाईचारे के स्नेह में प्रेम।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भाईचारे का प्रेम।” यूनानी शब्द का अर्थ भाइयों जैसा आत्मीय स्नेह है, विशेष रूप से साथी विश्वासियों के प्रति।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐσεβείᾳ
  choice: भक्ति
  rationale: यह शब्द परमेश्वर के प्रति श्रद्धापूर्ण समर्पण और उससे प्रकट होने वाले जीवन-आचरण, दोनों को व्यक्त करता है। ‘भक्ति’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और इस दोहरे भाव को वहन करने वाला निकटतम विकल्प है।
- source_word: φιλαδελφίαν
  choice: भाईचारे का स्नेह
  rationale: φιλαδελφία विशेष रूप से भाइयों जैसे आत्मीय संबंध और मसीही समुदाय के साथी विश्वासियों के प्रति स्नेह को दर्शाता है। ‘स्नेह’ अगले शब्द ἀγάπη के लिए प्रयुक्त ‘प्रेम’ से इसका भेद बनाए रखता है।
- source_word: ἀγάπην
  choice: प्रेम
  rationale: ἀγάπη के लिए ‘प्रेम’ व्यापक और स्वाभाविक हिन्दी प्रतिशब्द है। यहाँ यह φιλαδελφία के बाद चरम गुण के रूप में आता है; इसलिए अतिरिक्त व्याख्यात्मक विशेषण जोड़े बिना इसके व्यापक भाव को खुला रखा गया है।
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: और ... में ...
  rationale: दोहराई गई यूनानी रचना गुणों की शृंखला और प्रत्येक अगले गुण के पिछले गुण से संबंध को सामने रखती है। हिन्दी में ‘और ... में ...’ उस समानांतर संरचना को यथासंभव सुरक्षित रखता है।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ विरोध नहीं, बल्कि संचयी सूची में हल्का संयोजक है; इसलिए ‘और’ उपयुक्त है।
theological_decisions:
- issue: गुणों की शृंखला में φιλαδελφία और ἀγάπη का भेद
  choice: φιλαδελφία के लिए ‘भाईचारे का स्नेह’ और ἀγάπη के लिए ‘प्रेम’
  alternative: दोनों में ‘प्रेम’ का प्रयोग करते हुए φιλαδελφία को ‘भाईचारे का प्रेम’ कहना
  rationale: यूनानी पाठ क्रम से दो संबंधित किंतु अलग शब्द रखता है। अलग हिन्दी शब्दावली साथी विश्वासियों के प्रति पारिवारिक स्नेह से व्यापक प्रेम की ओर होने वाली आलंकारिक प्रगति को दिखाती है, बिना उसके दायरे को सिद्धांतगत रूप से सीमित किए।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद पिछले पदों से चल रही गुणों की शृंखला का अंश है, इसलिए यूनानी पाठ की समानांतर, संक्षिप्त रचना को बनाए रखा गया है। ‘भाईचारा’ का आशय केवल पुरुषों तक सीमित नहीं, बल्कि विश्वासी समुदाय के पारिवारिक संबंध से है।
