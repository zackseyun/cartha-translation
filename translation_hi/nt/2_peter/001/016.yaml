id: 2PE.1.16
reference: 2 Peter 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/016.yaml
  text: For we did not make known to you the power and coming of our Lord Jesus the Messiah by following cleverly devised myths[b][a], but by becoming eyewitnesses of his majesty.
translation:
  language: hi
  text: क्योंकि हमने तुम्हें अपने प्रभु यीशु मसीह की सामर्थ्य और आगमन[a] के विषय में चतुराई से गढ़ी हुई दंतकथाओं का अनुसरण करके नहीं बताया, बल्कि उसकी महिमा के प्रत्यक्षदर्शी होकर बताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उपस्थिति’। यूनानी παρουσία का अर्थ ‘उपस्थिति’ या ‘आगमन’ हो सकता है; नए नियम में यह शब्द अक्सर मसीह के आगमन के लिए प्रयुक्त होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: σεσοφισμένοις μύθοις
  choice: चतुराई से गढ़ी हुई दंतकथाओं
  rationale: यह पदबंध कथाओं के कुशलतापूर्वक गढ़े जाने का भाव देता है। ‘चतुराई से गढ़ी हुई’ कृत्रिम रचना और नकारात्मक आशय दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξακολουθήσαντες
  choice: अनुसरण करके
  rationale: कृदन्त मुख्य क्रिया की पृष्ठभूमि अथवा साधन बताता है और ἀλλά के बाद आने वाले प्रत्यक्षदर्शी होने से स्पष्ट विरोध बनाता है।
- source_word: ἐγνωρίσαμεν
  choice: हमने तुम्हें ... बताया था
  rationale: γνωρίζω का अर्थ किसी बात को ज्ञात कराना है। इस वाक्य में ‘बताया’ आधुनिक हिन्दी में सहज है और ὑμῖν को ‘तुम्हें’ से स्पष्ट करता है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: δύναμις का सीधा अर्थ शक्ति या सामर्थ्य है; ‘सामर्थ्य’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में सुबोध है।
- source_word: παρουσίαν
  choice: आगमन
  rationale: παρουσία का अर्थ उपस्थिति या आगमन हो सकता है और मसीह के संदर्भ में प्रायः भावी आगमन को सूचित करता है। मुख्य पाठ में ‘आगमन’ रखा गया है और वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος यहाँ यीशु की उपाधि है; ‘प्रभु’ इसका मानक, स्वाभाविक हिन्दी रूप है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: Χριστός यहाँ अभिषिक्त जन की उपाधि है। हिन्दी में ‘यीशु मसीह’ प्रचलित और स्वाभाविक है तथा शीर्षकीय अर्थ को बनाए रखता है।
- source_word: ἐπόπται
  choice: प्रत्यक्षदर्शी
  rationale: ἐπόπτης उस व्यक्ति को दर्शाता है जिसने स्वयं देखा हो। ‘प्रत्यक्षदर्शी’ दंतकथाओं के विपरीत प्रत्यक्ष साक्ष्य का बल व्यक्त करता है।
- source_word: γενηθέντες
  choice: बने थे
  rationale: γίνομαι का कृदन्त उनके प्रत्यक्षदर्शी बन जाने को व्यक्त करता है; हिन्दी वाक्य में ‘बने थे’ स्वाभाविक रूप से मुख्य कथन से जुड़ता है।
- source_word: μεγαλειότητος
  choice: ऐश्वर्य
  rationale: μεγαλειότης भव्य महानता या महिमा-संपन्न ऐश्वर्य को दर्शाता है। ‘ऐश्वर्य’ उस प्रत्यक्ष प्रकट महानता के लिए गरिमापूर्ण हिन्दी है।
- source_word: ἐκείνου
  choice: उसके
  rationale: संकेतवाचक सर्वनाम यीशु मसीह की ओर लौटता है; हिन्दी में ‘उसके’ इसका सहज संबंधसूचक रूप है।
theological_decisions:
- issue: मसीही संदर्भ में παρουσία का अनुवाद
  choice: आगमन
  alternative: उपस्थिति; आगमन करके उपस्थित होना
  rationale: नए नियम में यीशु के विषय में παρουσία प्रायः उसके भावी आगमन को दर्शाता है, पर इसका मूल अर्थ ‘उपस्थिति’ भी हो सकता है। इसलिए मुख्य पाठ संभावित प्रसंगगत अर्थ देता है और पादटिप्पणी शाब्दिक विस्तार को सुरक्षित रखती है।
- issue: Χριστοῦ को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ Χριστός यीशु की उपाधि है। ‘मसीह’ आधुनिक हिन्दी में स्थापित रूप है और किसी संप्रदाय-विशेष की व्याख्या जोड़े बिना ‘अभिषिक्त’ की पहचान बनाए रखता है।
- issue: μεγαλειότης का आशय
  choice: ऐश्वर्य
  alternative: महिमा; महानता
  rationale: शब्द उस दृश्य महानता और राजसी भव्यता को व्यक्त करता है जिसके वे प्रत्यक्षदर्शी हुए। ‘ऐश्वर्य’ इसे केवल अमूर्त महानता तक सीमित नहीं करता, जबकि रूपांतरण का संकेत स्पष्ट रूप से जोड़कर पाठ से अधिक नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी, संबोधन में बहुवचन ‘तुम्हें’, और गरिमापूर्ण किंतु सहज शब्दावली अपनाई गई है। वाक्य ने यूनानी के ‘नहीं... बल्कि...’ विरोध को बनाए रखा है। ‘दंतकथाएँ’ μῦθοι के काल्पनिक और अविश्वसनीय कथाओं वाले आशय को व्यक्त करता है।
