id: 2PE.1.17
reference: 2 Peter 1:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· ⸂Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν⸃, εἰς ὃν ἐγὼ εὐδόκησα—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/017.yaml
  text: 'For when he received honor and glory from God the Father[a], such a voice was borne to him from the Majestic Glory: “This is my Son, my Beloved[c][b], in whom I am well pleased”—'
translation:
  language: hi
  text: 'क्योंकि जब उसने परमेश्वर पिता से आदर और महिमा पाई, तब प्रतापमय महिमा की ओर से उसके पास ऐसी वाणी पहुँची: “यह मेरा पुत्र, मेरा प्रिय है,[a] जिसमें मैंने प्रसन्नता पाई”[b]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह मेरा प्रिय पुत्र है।” यूनानी में अधिक शाब्दिक रूप से “यह मेरा पुत्र, मेरा प्रिय है” आता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिससे मैं प्रसन्न हूँ,” अथवा “जिसमें मैंने आनन्द पाया।” यूनानी में क्रिया भूतकालीन रूप में है; अभिव्यक्ति का शाब्दिक भाव “जिसमें/जिसकी ओर” है।
    reason: alternative_reading
lexical_decisions:
- source_word: λαβὼν γὰρ παρὰ θεοῦ πατρὸς
  choice: क्योंकि जब उसने परमेश्वर पिता से ... पाई
  rationale: अकारान्त कृदन्त को प्रसंगानुकूल कालवाचक उपवाक्य बनाया गया है; παρά संबंधकारक के साथ स्रोत को ‘से’ व्यक्त करता है।
- source_word: τιμὴν καὶ δόξαν
  choice: आदर और महिमा
  rationale: दोनों संज्ञाओं को अलग रखा गया है; ‘आदर’ आधुनिक हिन्दी में स्वाभाविक है और ‘महिमा’ δόξα का प्रतिष्ठित समतुल्य है।
- source_word: φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε
  choice: उसके पास ऐसी वाणी पहुँची
  rationale: जननात्मक निरपेक्ष रचना को स्वाभाविक हिन्दी उपवाक्य में बदला गया है। ‘पहुँची’ φέρω के निष्क्रिय भाव को बिना कृत्रिमता के व्यक्त करता है और ‘ऐसी’ आगे आने वाले उद्धरण की ओर संकेत करता है।
- source_word: ὑπὸ τῆς μεγαλοπρεποῦς δόξης
  choice: प्रतापमय महिमा की ओर से
  rationale: ὑπό यहाँ कर्ता अथवा स्रोत का संकेत दे सकता है। ‘की ओर से’ इस द्विविधा को यथासंभव बनाए रखता है; ‘प्रतापमय महिमा’ परमेश्वर की महिमामय उपस्थिति के प्रति आदरसूचक परोक्ष अभिव्यक्ति है।
- source_word: Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν
  choice: यह मेरा पुत्र, मेरा प्रिय है
  rationale: ‘मेरा पुत्र’ और ‘मेरा प्रिय’ की समानाधिकरणात्मक रचना तथा μου की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: εἰς ὃν ἐγὼ εὐδόκησα
  choice: जिससे मैं प्रसन्न हुआ हूँ
  rationale: εἰς ὃν का हिन्दी में स्वाभाविक संबंध ‘जिससे’ है। पूर्ण वर्तमान अकारान्त क्रिया की पूर्व घटना और वर्तमान परिणाम दोनों को व्यक्त करता है, यद्यपि अन्य अनुवाद भी संभव हैं।
theological_decisions:
- issue: τῆς μεγαλοπρεποῦς δόξης का आदरसूचक दैवी संकेत
  choice: प्रतापमय महिमा
  alternative: महाप्रतापी महिमा; दिव्य प्रताप
  rationale: मूल पाठ परमेश्वर का नाम सीधे न लेकर उसकी महिमा के द्वारा संकेत करता है। अनुवाद उस परोक्षता को बनाए रखता है और व्याख्यात्मक विस्तार नहीं जोड़ता।
- issue: पुत्र के विषय में पिता की घोषणा की समानाधिकरणात्मक बनावट
  choice: यह मेरा पुत्र, मेरा प्रिय है
  alternative: यह मेरा प्रिय पुत्र है
  rationale: चुना हुआ पाठ दोहरे μου और ‘पुत्र’ तथा ‘प्रिय’ के समानाधिकरण को अधिक स्पष्ट रखता है, जबकि पादटिप्पणी अधिक प्रचलित हिन्दी विन्यास बताती है।
- issue: εὐδόκησα का काल और संबंध
  choice: जिससे मैं प्रसन्न हुआ हूँ
  alternative: जिससे मैं बहुत प्रसन्न हूँ; जिसमें मैंने आनन्द पाया
  rationale: अकारान्त क्रिया को केवल वर्तमान में समतल न करके पूर्ण वर्तमान से उसके परिणामकारी भाव को रखा गया है; पादटिप्पणी वास्तविक अनुवाद-विकल्प दर्ज करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘प्रतापमय महिमा’ मूल की उन्नत, आदरसूचक शैली को बनाए रखता है; वाक्य के अंत का दीर्घ विराम-चिह्न अगले पद में जारी विचार को दर्शाता है।
