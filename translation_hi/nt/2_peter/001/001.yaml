source:
  edition: SBLGNT
  text: ⸀Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/001.yaml
  text: 'Simeon Peter[a], a servant and apostle of Jesus the Messiah[d][c][b], to those who have obtained a faith as precious as ours in the righteousness of our God and Savior Jesus the Messiah:'
translation:
  language: hi
  text: 'सिमोन पतरस, यीशु मसीह का दास और प्रेरित, उन लोगों के नाम जिन्होंने हमारे समान बहुमूल्य विश्वास[a] हमारे परमेश्वर और उद्धारकर्ता यीशु मसीह की धार्मिकता में[b][c] पाया है:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे विश्वास के समान प्रतिष्ठा वाला विश्वास।” विशेषण समान मूल्य, सम्मान या विशेषाधिकार पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “धार्मिकता में” का अनुवाद “धार्मिकता के द्वारा” या “धार्मिकता से” भी हो सकता है; यूनानी संबंधबोधक शब्द क्षेत्र अथवा साधन व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी व्याकरण सबसे स्वाभाविक रूप से यीशु मसीह को ही “हमारा परमेश्वर और उद्धारकर्ता” बताता है। कम संभावित अर्थ में “हमारे परमेश्वर” और “हमारे उद्धारकर्ता यीशु मसीह” दो अलग व्यक्तियों को सूचित कर सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: Συμεὼν Πέτρος
  choice: शिमोन पतरस
  rationale: ‘शिमोन’ स्रोत-पाठ के Συμεὼν रूप को दर्शाता है; ‘पतरस’ हिन्दी बाइबलीय परंपरा में Πέτρος का सुस्थापित रूप है।
- source_word: δοῦλος
  choice: दास
  rationale: यह केवल सेवा करने वाला नहीं, बल्कि मसीह से पूर्णतः संबद्ध व्यक्ति होने का भाव रखता है; ‘दास’ हिन्दी में इस बंधन और समर्पण को संक्षेप में बनाए रखता है।
- source_word: ἀπόστολος
  choice: प्रेरित
  rationale: विशेष रूप से भेजे और अधिकारपूर्वक नियुक्त किए गए प्रतिनिधि के लिए यह सुस्थापित हिन्दी पद है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: ‘मसीह’ Χριστός के अभिषिक्त जन/मसीहा संबंधी पद को सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: τοῖς ... λαχοῦσιν
  choice: उन लोगों के नाम, जिन्होंने ... पाया है
  rationale: λαγχάνω प्राप्त होने या हिस्से में मिलने का संकेत देता है; ‘पाया है’ इसे मानवीय उपलब्धि के रूप में स्पष्ट किए बिना सहज हिन्दी में व्यक्त करता है।
- source_word: ἰσότιμον ἡμῖν ... πίστιν
  choice: हमारे समान बहुमूल्य विश्वास
  rationale: ἰσότιμος समान मूल्य, सम्मान या प्रतिष्ठा का भाव दे सकता है; मुख्य पाठ समान बहुमूल्यता व्यक्त करता है और अन्य संभव बल पादटिप्पणी में रखा गया है।
- source_word: πίστιν
  choice: विश्वास
  rationale: इस संदर्भ में साझा मसीही विश्वास अभिप्रेत है; ‘विश्वास’ इसका स्वाभाविक और व्यापक हिन्दी समतुल्य है।
- source_word: ἐν δικαιοσύνῃ
  choice: धार्मिकता में
  rationale: यह औपचारिक रूप से निकट है और ἐν के क्षेत्रवाचक अथवा साधनवाचक अर्थ को समय से पहले निश्चित नहीं करता।
- source_word: δικαιοσύνῃ
  choice: धार्मिकता
  rationale: यह δικαιοσύνη के नैतिक और ईशवैज्ञानिक विस्तार को बनाए रखता है; ‘न्याय’ यहाँ अपेक्षाकृत संकीर्ण लगेगा।
- source_word: τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ
  choice: हमारे परमेश्वर और उद्धारकर्ता यीशु मसीह की
  rationale: एक ही उपपद से जुड़े दोनों एकवचन व्यक्तिगत पद स्वाभाविक रूप से यीशु को ही ‘हमारा परमेश्वर और उद्धारकर्ता’ बताते हैं; कम संभावित द्वि-संदर्भीय अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: क्या ‘हमारे परमेश्वर और उद्धारकर्ता यीशु मसीह’ एक ही व्यक्ति को बताता है या पिता और यीशु को अलग-अलग?
  choice: 'एक ही व्यक्ति: यीशु को ‘हमारा परमेश्वर और उद्धारकर्ता’ कहा गया है।'
  alternative: 'दो व्यक्ति: ‘हमारे परमेश्वर’ और ‘उद्धारकर्ता यीशु मसीह’।'
  rationale: यूनानी में एक उपपद के अधीन καί से जुड़े दो एकवचन व्यक्तिगत संज्ञापद एक ही संदर्भ को प्रबल रूप से इंगित करते हैं। फिर भी ईशवैज्ञानिक महत्त्व के कारण कम संभावित विकल्प पादटिप्पणी में दिया गया है।
- issue: ἐν δικαιοσύνῃ में संबंध का प्रकार
  choice: ‘धार्मिकता में’—क्षेत्र और साधन के बीच की संभावित अस्पष्टता बनाए रखी गई है।
  alternative: ‘धार्मिकता के द्वारा’ अथवा ‘धार्मिकता से’।
  rationale: ἐν यहाँ क्षेत्र या साधन दोनों का संकेत दे सकता है; मुख्य पाठ को किसी एक अर्थ तक सीमित करना अनावश्यक होगा।
