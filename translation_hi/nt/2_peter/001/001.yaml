  register: आधुनिक मानक हिन्दी का गरिमापूर्ण पत्रात्मक आरंभ रखा गया है। ‘दास’ और ‘प्रेरित’ जैसे सुस्थापित बाइबलीय पद सामान्य पाठक के लिए बोधगम्य रहते हुए स्रोत की तीव्रता बनाए रखते हैं। वाक्य की यूनानी संरचना को हिन्दी में स्वाभाविक बनाने के लिए ‘उन लोगों के नाम’ प्रयोग किया गया है।
