  terminology: ‘चले जाना’ appropriately preserves the metaphorical character of ἔξοδος, and ‘मृत्यु’ in the footnote responsibly supplies the contextual implication. ‘स्मरण कर सको’ is suitable modern standard Hindi in this register.
