  text: σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/015.yaml
  text: And I will make every effort so that[a], after my departure, you may be able at any time to recall these things.
translation:
  language: hi
  text: और मैं हर संभव प्रयास करूँगा कि मेरे चले जाने[a] के बाद तुम किसी भी समय इन बातों को स्मरण कर सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “मेरी मृत्यु के बाद।” यूनानी में “मेरे चले जाने के बाद” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσω
  choice: मैं हर संभव प्रयास करूँगा
  rationale: भविष्यकाल का यह रूप पूरे मन से और लगनपूर्वक प्रयत्न करने का भाव देता है; यह हिन्दी में स्वाभाविक रूप से उसकी तीव्रता व्यक्त करता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ यह पिछले वाक्य के विचार को आगे बढ़ाता है, प्रबल विरोध नहीं दिखाता।
- source_word: καὶ
  choice: कि ... भी
  rationale: अनन्त क्रिया वाले वाक्य-विन्यास में यह पतरस के प्रयास का आगे का उद्देश्य सामने लाता है; हिन्दी में ‘कि’ और प्रसंगानुसार ‘भी’ इस संबंध को स्वाभाविक बनाते हैं।
- source_word: ἑκάστοτε
  choice: किसी भी समय
  rationale: यह प्रत्येक अवसर पर या जब भी आवश्यकता हो तब का भाव देता है।
- source_word: ἔχειν ὑμᾶς
  choice: तुम ... कर सको
  rationale: ἔχειν के साथ अनन्त क्रिया यहाँ सामर्थ्य या अवसर व्यक्त करती है; ‘कर सको’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: μετὰ τὴν ἐμὴν ἔξοδον
  choice: मेरे चले जाने के बाद
  rationale: ἔξοδος का मूल रूपक ‘प्रस्थान/चले जाना’ है और यहाँ वह पतरस की मृत्यु के लिए शिष्ट संकेत है। मुख्य पाठ में रूपक सुरक्षित रखा गया है।
- source_word: τὴν τούτων μνήμην ποιεῖσθαι
  choice: इन बातों को स्मरण कर सको
  rationale: यह यूनानी मुहावरा किसी बात को याद करने या मन में लाने को व्यक्त करता है; ‘स्मरण करना’ वर्तमान, गरिमापूर्ण और स्पष्ट हिन्दी है।
- source_word: τούτων
  choice: इन बातों
  rationale: यह निकटवर्ती प्रसंग में पतरस द्वारा बल दी गई बातों की ओर संकेत करता है।
theological_decisions:
- issue: पतरस के निकट आते अंत के लिए ἔξοδος का अर्थ
  choice: चले जाने
  alternative: मृत्यु; प्रस्थान
  rationale: मुख्य पाठ मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में इसका आशय मृत्यु है। इससे अर्थ स्पष्ट रहता है, पर अनावश्यक धर्मवैज्ञानिक अर्थ आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रूप। ‘चले जाने’ मूल रूपक को ‘प्रस्थान’ की अपेक्षा अधिक स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘स्मरण’ प्रसंग की गंभीरता के अनुरूप है।
