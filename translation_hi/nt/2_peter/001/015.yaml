  - severity: low
    issue: Footnote anchor is placed after ‘बाद भी’ rather than on the departure expression.
    rationale: The note concerns ἔξοδος (‘departure’), so anchoring it directly to ‘चले जाने’ more precisely identifies the word/phrase being explained.
