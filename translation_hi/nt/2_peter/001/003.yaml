id: 2PE.1.3
reference: 2 Peter 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ⸂ἰδίᾳ δόξῃ καὶ ἀρετῇ⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/003.yaml
  text: As his divine power has granted to us all things for life and godliness[a], through the knowledge of the one who called us by his own glory and excellence,
translation:
  language: hi
  text: जैसा कि उसकी ईश्वरीय सामर्थ्य ने हमें जीवन और ईश्वर-भक्ति के लिए सब कुछ उस व्यक्ति के ज्ञान के द्वारा प्रदान किया है जिसने हमें अपनी ही महिमा और श्रेष्ठता के द्वारा[a] बुलाया है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “अपनी ही महिमा और श्रेष्ठता के लिए।” यूनानी पदबंध को अलग-अलग ढंग से समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: Ὡς
  choice: क्योंकि
  rationale: यह आगे के उपदेश का आधार प्रस्तुत करता है। हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है, यद्यपि यूनानी संयोजक का भाव ‘यह देखते हुए कि’ भी हो सकता है।
- source_word: πάντα ... τὰ πρὸς ζωὴν καὶ εὐσέβειαν
  choice: जीवन और ईश्वर-भक्ति के लिए सब कुछ
  rationale: यह वाक्यांश जीवन और परमेश्वर की ओर उन्मुख आचरण से संबंधित समस्त प्रावधान को समेटता है; ‘के लिए’ संक्षिप्त और सहज है तथा ‘आवश्यक’ जैसा स्पष्टतः अनुपस्थित विशेषण नहीं जोड़ता।
- source_word: θείας δυνάμεως αὐτοῦ
  choice: उसकी ईश्वरीय सामर्थ्य
  rationale: यह स्वाभाविक हिन्दी में संबंधवाचक रचना को रखता है और θεῖος के दिव्य अर्थ को ‘ईश्वरीय’ से व्यक्त करता है।
- source_word: δεδωρημένης
  choice: दे दिया है
  rationale: पूर्णकालिक कृदंत अनुग्रहपूर्वक दिए गए ऐसे कार्य को दर्शाता है जिसका परिणाम बना हुआ है; हिन्दी पूर्ण वर्तमान इसे सहज रूप में व्यक्त करता है।
- source_word: διὰ τῆς ἐπιγνώσεως
  choice: उसके ज्ञान के द्वारा
  rationale: ἐπίγνωσις को सामान्य और पारदर्शी रूप में ‘ज्ञान’ कहा गया है; ‘पूर्ण ज्ञान’ कहने से पाठ की अपेक्षा अधिक तकनीकी बल आ सकता था।
- source_word: τοῦ καλέσαντος ἡμᾶς
  choice: जिसने ... हमें बुलाया
  rationale: संज्ञात्मक कृदंत का व्यक्तिगत और क्रियात्मक बल स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἰδίᾳ
  choice: अपनी ही
  rationale: ‘ही’ ἴδιος में निहित अपनेपन के विशेष बल को प्रकट करता है।
- source_word: δόξῃ
  choice: महिमा
  rationale: यह दिव्य वैभव और प्रकट प्रताप के लिए मानक, गरिमापूर्ण हिन्दी शब्द है।
- source_word: ἀρετῇ
  choice: श्रेष्ठता
  rationale: ἀρετή यहाँ ‘महिमा’ के साथ जुड़कर उत्कृष्ट गुण को दर्शाता है; ‘श्रेष्ठता’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल मानवीय नैतिक सद्गुण तक सीमित नहीं करता।
- source_word: ζωὴν
  choice: जीवन
  rationale: मूल में कोई विशेषक नहीं है; ‘जीवन’ वर्तमान और भावी दोनों आयामों के लिए पर्याप्त व्यापक रहता है।
- source_word: εὐσέβειαν
  choice: ईश्वर-भक्ति
  rationale: यह परमेश्वर के प्रति श्रद्धा से निर्देशित जीवन और आचरण के अर्थ को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ἰδίᾳ δόξῃ καὶ ἀρετῇ में कारक का साधनवाचक अथवा लक्ष्यवाचक अर्थ
  choice: अपनी ही महिमा और श्रेष्ठता के द्वारा
  alternative: अपनी ही महिमा और श्रेष्ठता के लिए
  rationale: 'दिए गए SBLGNT पाठ में चतुर्थी रूप को साधनवाचक समझना अधिक स्वाभाविक है: बुलाने वाला अपनी महिमा और श्रेष्ठता के द्वारा बुलाता है। लक्ष्यवाचक संभावना को पाठ में चुपचाप समाप्त करने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लम्बी यूनानी कृदंत-रचना को हिन्दी में दो वाक्यों में बाँटा गया है, जबकि पद के अंत की अल्पविराम-संलग्नता रखी गई है क्योंकि विचार अगले पद में जारी रहता है।
