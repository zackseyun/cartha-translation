translation:
  language: hi
  text: सबसे पहले यह जान लो कि पवित्र शास्त्र की हर भविष्यवाणी अपनी व्याख्या से उत्पन्न नहीं होती।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῦτο πρῶτον γινώσκοντες
  choice: सबसे पहले यह जान लो
  rationale: ग्रीक कृदंत का संबोधनात्मक बल स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है और πρῶτον की प्राथमिकता बनाए रखता है।
- source_word: πᾶσα προφητεία γραφῆς
  choice: पवित्र शास्त्र की हर भविष्यवाणी
  rationale: πᾶσα को सकारात्मक रूप में ‘हर’ रखा गया है; γραφή के बाइबलीय अर्थ को सामान्य पाठक के लिए ‘पवित्र शास्त्र’ से व्यक्त किया गया है।
- source_word: ἰδίας ἐπιλύσεως
  choice: किसी की अपनी व्याख्या से
  rationale: ἰδίας की संदर्भगत अनिश्चितता को किसी विशेष व्यक्ति—लेखक या पाठक—तक सीमित किए बिना रखा गया है; ἐπίλυσις का मूल भाव ‘व्याख्या’ है।
- source_word: οὐ γίνεται
  choice: उत्पन्न नहीं होती
  rationale: γίνεται को केवल ‘है’ न बनाकर उसके उद्भव/होने के अर्थ में रखा गया है, जिससे कथन भविष्यवाणी के स्रोत या उत्पत्ति की ओर संकेत कर सकता है।
theological_decisions:
- issue: क्या पद भविष्यवाणी की उत्पत्ति की बात करता है या पाठक द्वारा उसकी व्याख्या की?
  choice: ‘अपनी व्याख्या से उत्पन्न नहीं होती’—दोनों तत्वों को साथ रखकर वाक्य की तनावपूर्ण अस्पष्टता बनाए रखी गई है।
  alternative: ‘कोई व्यक्ति अपने आप पवित्र शास्त्र की भविष्यवाणी की व्याख्या नहीं कर सकता।’
  rationale: वैकल्पिक रूप व्याख्या करने वाले पाठक पर अर्थ को सीमित करता और γίνεται के उद्भव-संबंधी बल को खो देता। अगला पद भविष्यवाणी के आने के स्रोत की चर्चा करता है, पर ἐπίλυσις फिर भी ‘व्याख्या’ का तत्व रखता है।
- issue: πᾶσα ... οὐ की संरचना
  choice: ‘हर भविष्यवाणी ... नहीं होती’
  alternative: ‘पवित्र शास्त्र की कोई भी भविष्यवाणी ... नहीं होती’
  rationale: ग्रीक की सकारात्मक πᾶσα और उसके बाद निषेध की संरचना को यथासंभव निकट रखा गया है, बिना अर्थ को बदले।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जान लो’ प्रत्यक्ष और स्वाभाविक है; ‘पवित्र शास्त्र’ सामान्य हिन्दी मसीही प्रयोग में स्पष्ट है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
