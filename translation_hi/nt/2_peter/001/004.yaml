- source_word: τίμια καὶ μέγιστα
  choice: बहुमूल्य और अत्यन्त महान
  rationale: τίμια का भाव मूल्यवान और प्रिय होने का है; μέγιστα के उच्चतम दर्जे के बल को स्वाभाविक हिन्दी में ‘अत्यन्त महान’ व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमें
  rationale: सम्प्रदान कारक δωρέομαι के साथ प्राप्तकर्ताओं को दर्शाता है; ‘हमें ... प्रदान की हैं’ हिन्दी में स्वाभाविक है।
- source_word: ἐπαγγέλματα
  choice: प्रतिज्ञाएँ
  rationale: परमेश्वर द्वारा दिए गए आश्वासनों के लिए यह स्पष्ट, प्रचलित और गरिमापूर्ण शब्द है।
- source_word: δεδώρηται
  choice: प्रदान की हैं
  rationale: पूर्णकालीन रूप अनुग्रहपूर्वक दिए जाने और उसके बने हुए परिणाम को व्यक्त करता है। कर्ता पिछले संदर्भ से निहित है, इसलिए ‘उसने’ रखा गया है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अभिप्रेत परिणाम व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में दोनों के लिए स्वाभाविक है।
- source_word: διὰ τούτων
  choice: इनके द्वारा
  rationale: यह साधनसूचक पद निकटतम बहुवचन संज्ञा ‘प्रतिज्ञाएँ’ की ओर संकेत करता है।
- source_word: γένησθε
  choice: तुम ... बनो
  rationale: γίνομαι का यह रूप केवल अवस्था में होने के बजाय बनने या उस अवस्था में आने का भाव रखता है।
- source_word: θείας κοινωνοὶ φύσεως
  choice: ईश्वरीय स्वभाव में सहभागी
  rationale: κοινωνός वास्तविक सहभागिता बताता है और ‘सहभागी’ हिन्दी में स्पष्ट है। ‘ईश्वरीय स्वभाव’ मूल पद की प्रबलता और उसका खुलापन बनाए रखता है।
- source_word: ἀποφυγόντες
  choice: बच निकलो
  rationale: कृदन्त मुख्य कथन से जुड़ी हुई, उससे पूर्व या उसके साथ घटित मुक्ति को व्यक्त करता है। हिन्दी में समन्वित क्रिया वाक्य को स्वाभाविक रखती है।
- source_word: φθορᾶς
  choice: भ्रष्टता
  rationale: इस संदर्भ में शब्द नैतिक और आत्मिक बिगाड़ का बोध कराता है; ‘भ्रष्टता’ मात्र भौतिक क्षय से अधिक उपयुक्त है।
- source_word: ἐν τῷ κόσμῳ
  choice: जो संसार में ... है
  rationale: यह संबंधवाचक विन्यास ‘भ्रष्टता’ को विशेषित करता है और मूल वाक्य-संबंध को स्पष्ट बनाए रखता है।
- source_word: ἐν ἐπιθυμίᾳ
  choice: पापमय अभिलाषा के कारण
  rationale: ἐν यहाँ उस अभिलाषा को भ्रष्टता के क्षेत्र, साधन या कारण के रूप में रख सकता है। प्रसंग इसका नैतिक रूप से नकारात्मक अर्थ स्पष्ट करता है; ‘अभिलाषा’ को केवल यौन वासना तक सीमित नहीं करता।
theological_decisions:
- issue: θείας κοινωνοὶ φύσεως में सहभागिता
  choice: ईश्वरीय स्वभाव में सहभागी
  alternative: ईश्वरीय स्वभाव के भागीदार
  rationale: मूल का प्रबल धार्मिक कथन सुरक्षित रखा गया है, पर ऐसा विस्तार नहीं जो इसे सारतः ईश्वर बन जाने या किसी बाद की विशिष्ट धर्मवैज्ञानिक प्रणाली के रूप में निश्चित कर दे।
- issue: ἐπιθυμία का नैतिक अर्थ
  choice: पापमय अभिलाषा
  alternative: अभिलाषा; वासना
  rationale: शब्द अपने आप में सामान्य इच्छा भी बता सकता है, लेकिन यहाँ वह संसार की भ्रष्टता से जुड़ा है। ‘पापमय’ प्रसंगगत नकारात्मकता स्पष्ट करता है, जबकि ‘वासना’ अर्थ को अनावश्यक रूप से यौन इच्छा तक संकुचित कर सकती है।
- issue: ἐν ἐπιθυμίᾳ का संबंध
  choice: अभिलाषा के कारण
  alternative: अभिलाषा में; अभिलाषा के द्वारा
  rationale: ग्रीक ἐν कारण, साधन या क्षेत्र की छाया रख सकता है। मुख्य पाठ में स्वाभाविक कारणात्मक अर्थ चुना गया है और विकल्प पादटिप्पणी में सुरक्षित हैं।
