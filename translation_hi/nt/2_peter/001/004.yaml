source:
  edition: SBLGNT
  text: δι’ ὧν τὰ ⸂τίμια καὶ μέγιστα ἡμῖν⸃ ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν ⸀τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/004.yaml
  text: through which he has granted to us his precious and very great promises[a], so that through these you may become sharers in the divine nature[b], having escaped the corruption that is in the world because of sinful desire.
translation:
  language: hi
  text: जिनके द्वारा उसने हमें बहुमूल्य और अत्यन्त महान प्रतिज्ञाएँ प्रदान की हैं, ताकि इनके द्वारा तुम उस भ्रष्टता से बच निकलकर, जो संसार में पापमय अभिलाषा के कारण है, ईश्वरीय स्वभाव में सहभागी बनो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ईश्वरीय स्वभाव के भागीदार बनो।” यह पद वास्तविक सहभागिता की बात करता है; यह अपने आप में यह नहीं कहता कि मनुष्य सारतः ईश्वर बन जाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ ὧν
