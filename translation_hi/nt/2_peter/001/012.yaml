  text: Διὸ ⸀μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/012.yaml
  text: Therefore I will always be ready to remind you about these things[a], even though you know them and have been established in the present truth.
translation:
  language: hi
  text: इसलिए मैं तुम्हें इन बातों की याद दिलाने के लिए सदा तत्पर रहूँगा, यद्यपि तुम इन्हें जानते हो और उस सत्य में दृढ़ किए गए हो जो अभी तुम्हारे पास है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पूर्ववर्ती तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: μελλήσω ἀεὶ
  choice: सदा तत्पर रहूँगा
  rationale: μέλλω का भविष्यत् रूप यहाँ केवल भावी क्रिया नहीं, बल्कि निरंतर संकल्प या तत्परता प्रकट करता है; ἀεί उसकी निरंतरता को स्पष्ट करता है।
- source_word: ὑπομιμνῄσκειν περὶ τούτων
  choice: इन बातों की याद दिलाने के लिए
  rationale: यह यूनानी क्रिया के ‘स्मरण कराना’ अर्थ और περί के विषय-सूचक प्रयोग को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καίπερ εἰδότας
  choice: यद्यपि तुम इन्हें जानते हो
  rationale: καίπερ की रियायती शक्ति और εἰδότας के पूर्णावस्थात्मक ज्ञान को स्पष्ट रखता है; ‘इन्हें’ का संबंध पूर्वोक्त बातों से है।
- source_word: ἐστηριγμένους
  choice: दृढ़ किए गए हो
  rationale: पूर्ण कर्मवाच्य कृदन्त पूर्व में दृढ़ किए जाने और उसके बने हुए परिणाम—दोनों को व्यक्त करता है।
- source_word: ἐν τῇ παρούσῃ ἀληθείᾳ
  choice: उस सत्य में ... जो अभी तुम्हारे पास है
  rationale: παρούσῃ के ‘वर्तमान/उपस्थित/उपलब्ध’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे किसी विशेष धर्मवैज्ञानिक युग का तकनीकी पद बनाए।
theological_decisions:
- issue: ‘ἐν τῇ παρούσῃ ἀληθείᾳ’ का अर्थ
  choice: उस सत्य में ... जो अभी तुम्हारे पास है
  alternative: वर्तमान सत्य में; उस सत्य में जो तुम्हारे बीच उपस्थित है
  rationale: यूनानी वाक्यांश यह निर्धारित नहीं करता कि कोई विशिष्ट युगगत या सम्प्रदायगत ‘वर्तमान सत्य’ अभिप्रेत है। चुना हुआ अनुवाद पाठकों के पास अभी विद्यमान सत्य का स्वाभाविक अर्थ देता है और अनावश्यक सिद्धान्तगत विस्तार से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण और गरिमामय, किंतु सामान्य पाठक के लिए सहज। बहुवचन द्वितीय पुरुष के लिए ‘तुम’ रखा गया है। मूल की रियायती संरचना और कर्मवाच्य भाव सुरक्षित हैं।
