id: 2PE.1.11
reference: 2 Peter 1:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/011.yaml
  text: For in this way entry into the eternal kingdom of our Lord and Savior Jesus the Messiah will be richly provided for you[a][b][c].
translation:
  language: hi
  text: क्योंकि इस प्रकार हमारे प्रभु और उद्धारकर्ता यीशु मसीह के अनन्त राज्य में प्रवेश तुम्हें भरपूर रीति से प्रदान किया जाएगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रवेश का अवसर”; यूनानी शब्द भीतर जाने की क्रिया या प्रवेश की उपलब्धता, दोनों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: परम्परागत रूप में “यीशु ख्रीष्ट”; यहाँ यूनानी उपाधि Χριστός का अर्थ व्यक्त करने के लिए उसका अनुवाद “मसीह” किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह पिछले पद में बताए गए आचरण और बुलाहट को पक्का करने के ढंग की ओर संकेत करता है; ‘इस प्रकार’ यूनानी संकेतवाचक क्रियाविशेषण का स्वाभाविक और स्पष्ट रूप है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: πλουσίως
  choice: भरपूरी से
  rationale: यह प्रचुर और उदार रीति से दिए जाने का भाव रखता है और आधुनिक हिन्दी में सहज है।
- source_word: ἐπιχορηγηθήσεται
  choice: प्रदान किया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखता है और प्रवेश दिए जाने अथवा उपलब्ध कराए जाने का भाव व्यक्त करता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: मूल के सम्प्रदान कारक को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡ εἴσοδος
  choice: प्रवेश
  rationale: यह भीतर जाने की क्रिया अथवा प्राप्त पहुँच, दोनों अर्थ सम्भव रखता है।
- source_word: εἰς τὴν αἰώνιον βασιλείαν
  choice: अनन्त राज्य में
  rationale: εἰς की दिशात्मकता और αἰώνιος के अंतकालीन अर्थ को सहज हिन्दी में सुरक्षित रखता है।
- source_word: τοῦ κυρίου ἡμῶν καὶ σωτῆρος
  choice: हमारे प्रभु और उद्धारकर्ता के
  rationale: एक ही यूनानी संबंधवाचक उपपद से जुड़े दोनों पदों को एक व्यक्ति के लिए प्रयुक्त दो उपाधियों के रूप में प्रस्तुत करता है।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: Χριστός को केवल ध्वन्यंतरण के बजाय उसके उपाधिगत अर्थ ‘मसीह’ से व्यक्त किया गया है; हिन्दी में ‘यीशु मसीह’ स्वाभाविक और सुविदित रूप है।
theological_decisions:
- issue: ‘हमारे प्रभु और उद्धारकर्ता’ का संदर्भ
  choice: दोनों उपाधियाँ एक ही व्यक्ति, यीशु मसीह, के लिए हैं।
  alternative: दोनों उपाधियों को अलग-अलग संदर्भों से जोड़ना।
  rationale: एक उपपद के अधीन καί से जुड़े दो एकवचन व्यक्तिगत संज्ञापद और उनके बाद आया Ἰησοῦ Χριστοῦ यूनानी व्याकरण में एक ही संदर्भ को दृढ़ता से दर्शाते हैं।
- issue: प्रवेश का भरपूरी से प्रदान किया जाना
  choice: कर्मवाच्य रखा गया है और प्रदान करने वाले को पाठ में स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘परमेश्वर तुम्हें भरपूर प्रवेश देगा’ जैसे कर्तृवाच्य में निहित कर्ता स्पष्ट करना।
  rationale: मूल पाठ कर्ता को अनुक्त रखता है; सम्भावित दिव्य कर्मकर्ता को स्पष्ट करके जोड़ना वास्तविक व्याकरणिक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक और सार्वजनिक पाठ के योग्य शैली। ‘तुम्हें’ बहुवचन श्रोताओं के लिए है। वाक्यक्रम मूल यूनानी के प्रमुख विषय ‘प्रवेश’ और कर्मवाच्य को सुरक्षित रखते हुए हिन्दी में स्वाभाविक बनाया गया है।
