source:
  edition: SBLGNT
  text: ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ⸀ἁμαρτημάτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/009.yaml
  text: For whoever lacks these things is blind[a], being shortsighted[b], having forgotten the cleansing of his former sins.
translation:
  language: hi
  text: क्योंकि जिसमें ये बातें नहीं हैं, वह अंधा है और पास की ही चीज़ें देख पाता है,[a] और अपने पुराने पापों की शुद्धि को भूल गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निकट-दृष्टि वाला है” अथवा “केवल पास तक देखता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ γὰρ μὴ πάρεστιν ταῦτα
  choice: क्योंकि जिसमें ये बातें नहीं हैं
  rationale: यूनानी वाक्य-विन्यास का सामान्य, प्रतिनिधिक व्यक्ति की ओर संकेत बनाए रखते हुए स्वाभाविक हिन्दी रूप; ‘ये बातें’ पिछले पदों में गिनाए गए गुणों की ओर लौटता है।
- source_word: τυφλός ἐστιν
  choice: वह अंधा है
  rationale: आत्मिक दृष्टि की उपमा को सीधे और स्पष्ट रूप में सुरक्षित रखता है।
- source_word: μυωπάζων
  choice: पास की ही चीज़ें देख पाता है
  rationale: दुर्लभ क्रिया का अर्थ निकट-दृष्टि या केवल पास तक देख सकने से संबंधित है; यह रूप सामान्य हिन्दी में बोधगम्य है और ‘अंधा’ के साथ मूल का तनाव बनाए रखता है।
- source_word: λήθην λαβὼν
  choice: वह भूल गया है
  rationale: शाब्दिक अर्थ ‘भूल प्राप्त करके’ है, पर यह यूनानी मुहावरा हिन्दी में स्वाभाविक रूप से ‘भूल गया है’ व्यक्त होता है।
- source_word: τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτημάτων
  choice: कि उसके पुराने पापों से उसे शुद्ध किया गया था
  rationale: καθαρισμός को सुलभ क्रियात्मक रूप में प्रस्तुत किया गया है; पुराने पापों से शुद्ध किए जाने का संबंध स्पष्ट रहता है और प्रतिनिधिक एकवचन सुरक्षित है।
theological_decisions:
- issue: ‘अंधा’ और μυωπάζων के बीच अर्थगत तनाव
  choice: अंधा है और पास की ही चीज़ें देख पाता है
  alternative: अंधा है, अर्थात् निकट-दृष्टि है
  rationale: मूल में दोनों चित्र साथ आते हैं और उनका सटीक संबंध व्याख्यात्मक रूप से निश्चित नहीं है; ‘और’ दोनों को रखता है, बिना दूसरे को पहले की पूर्ण परिभाषा बनाए।
- issue: शुद्धि का अर्थ
  choice: उसके पुराने पापों से उसे शुद्ध किया गया था
  alternative: उसके पुराने पापों की शुद्धि
  rationale: क्रियात्मक हिन्दी सामान्य पाठक के लिए अधिक स्वाभाविक है, पर यह नहीं बताती कि शुद्धि किस रीति या संस्कार से हुई; इसलिए किसी संप्रदायगत निष्कर्ष को नहीं जोड़ा गया।
- issue: αὐτοῦ का प्रतिनिधिक एकवचन
  choice: उसके पुराने पापों
  alternative: उनके पुराने पापों
  rationale: यूनानी का एकवचन बनाए रखते हुए हिन्दी में सामान्य व्यक्ति का संकेत दिया गया है; इसका आशय केवल पुरुषों तक सीमित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमामय किंतु सामान्य पाठक के लिए सहज है। ‘ये बातें’ को जानबूझकर व्यापक रखा गया है ताकि वह पिछले पदों के गुणों की ओर संकेत करे, और दुर्लभ दृष्टि-संबंधी क्रिया के लिए मुख्य पाठ में सामान्य बोलचाल का स्पष्ट रूप दिया गया है।
