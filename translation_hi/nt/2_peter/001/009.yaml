    rationale: τοῦ καθαρισμοῦ is a noun (“cleansing/purification”), not a finite assertion that someone performed cleansing. While the draft's sense is plausible, the expansion narrows the concise Greek phrasing and adds agentive/passive verbal framing. A nominal Hindi phrase is a safer optimal-equivalence rendering.
