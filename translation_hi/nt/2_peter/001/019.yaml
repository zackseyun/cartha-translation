id: 2PE.1.19
reference: 2 Peter 1:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/019.yaml
  text: And we have the prophetic word more certain[a], to which you do well to pay attention as to a lamp shining in a dark place[b], until the day dawns and the morning star rises in your hearts.
translation:
  language: hi
  text: और हमारे पास भविष्यवाणी का वचन है, जो और अधिक निश्चित है[a]। तुम उस पर ध्यान देकर अच्छा करते हो, जैसे अँधेरे स्थान में चमकते दीपक पर, जब तक दिन न निकल आए और भोर का तारा[b] तुम्हारे हृदयों में उदय न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद यह भी हो सकता है, “हमारे पास और अधिक निश्चित भविष्यवाणी का वचन है।” यूनानी कथन का अर्थ यह हो सकता है कि प्रेरितों की प्रत्यक्षदर्शी गवाही से भविष्यवाणी का वचन पुष्ट होता है, या यह उसके अपने दृढ़ और विश्वसनीय स्वभाव पर बल दे सकता है।
    reason: alternative_reading
  - marker: b
    text: “भोर का तारा” मसीह-संबंधी छवि की प्रतिध्वनि हो सकता है; प्रकाशितवाक्य 22:16 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: βεβαιότερον
  choice: और भी अधिक दृढ़
  rationale: तुलनात्मक भाव को स्पष्ट रखता है, पर यह नहीं जोड़ता कि वचन को किसी ने ‘दृढ़ बनाया।’ संदर्भ में इसका अर्थ प्रेरितों की गवाही से भविष्यवाणी के पुष्ट होने या उसके निश्चित स्वभाव पर बल देने—दोनों रूपों में समझा जा सकता है।
- source_word: προφητικὸν λόγον
  choice: भविष्यवाणी का वचन
  rationale: λόγος और विशेषण προφητικός दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है; ‘भविष्यसूचक संदेश’ की अपेक्षा यह मूल पदावली के अधिक निकट है।
- source_word: ᾧ ... προσέχοντες
  choice: तुम उस पर ध्यान देते हो तो अच्छा करते हो
  rationale: प्रसέχω के सावधानी से ध्यान देने के भाव को वर्तमान, सहज हिन्दी में व्यक्त करता है और καλῶς ποιεῖτε की प्रशंसात्मक शक्ति बनाए रखता है।
- source_word: λύχνῳ φαίνοντι
  choice: उस दीपक के समान ... चमकता रहता है
  rationale: दीपक की उपमा तथा वर्तमान कृदंत से सूचित लगातार चमकने का भाव सुरक्षित रहता है।
- source_word: αὐχμηρῷ τόπῳ
  choice: अँधेरी जगह
  rationale: शब्द धुँधली, मलिन या अँधेरी जगह का बोध करा सकता है; दीपक की उपमा के संदर्भ में ‘अँधेरी जगह’ सबसे स्पष्ट और स्वाभाविक है।
- source_word: ἡμέρα διαυγάσῃ
  choice: दिन न निकल आए
  rationale: दिन के प्रकाशमान होकर उगने के रूपक को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: φωσφόρος
  choice: भोर का तारा
  rationale: इस खगोलीय रूपक का प्रचलित और स्पष्ट हिन्दी रूप है; मुख्य पाठ में इसके संदर्भ को मसीह के रूप में स्पष्ट करके व्याख्या नहीं जोड़ी गई।
- source_word: ἀνατείλῃ
  choice: उदय न हो
  rationale: तारे के उगने की छवि के अनुरूप औपचारिक किन्तु सामान्य हिन्दी अभिव्यक्ति है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: तुम्हारे हृदयों में
  rationale: बहुवचन और मनुष्य के भीतरी व्यक्तित्व के बाइबलीय रूपक दोनों को सीधे बनाए रखता है।
theological_decisions:
- issue: प्रेरितों की प्रत्यक्षदर्शी गवाही के संबंध में βεβαιότερον का अर्थ
  choice: ‘भविष्यवाणी का वचन ... और भी अधिक दृढ़ है’
  alternative: ‘भविष्यवाणी का वचन और भी अधिक पक्का ठहरा है’ अथवा ‘हमारे पास अधिक दृढ़ भविष्यवाणी का वचन है’
  rationale: यूनानी रचना इस बात की गुंजाइश देती है कि रूपांतरण की प्रेरितीय गवाही ने भविष्यवाणी की पुष्टि की, या कि यहाँ भविष्यवाणी के अपने दृढ़ स्वभाव पर बल दिया गया है। मुख्य पाठ तुलनात्मक भाव रखता है, जबकि पादटिप्पणी इस वास्तविक अस्पष्टता को बताती है।
- issue: ‘भोर का तारा’ किसे सूचित करता है
  choice: मुख्य पाठ में रूपक को बिना स्पष्ट पहचान के रखा गया
  alternative: इसे सीधे मसीह अथवा युगान्तकालीन आंतरिक प्रकाश के रूप में पहचानना
  rationale: अन्य बाइबलीय पाठों के कारण इसमें मसीह-संबंधी प्रतिध्वनि हो सकती है, पर इस पद में संदर्भ को स्पष्ट रूप से पहचाना नहीं गया। अतः अनुवाद छवि और उसके धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘वचन,’ ‘दीपक,’ ‘उदय’ और ‘हृदय’ जैसे परिचित बाइबलीय शब्द रूपक की औपचारिक गरिमा बनाए रखते हैं; वाक्य-विन्यास को हिन्दी की स्वाभाविकता के लिए दो वाक्यों में बाँटा गया है।
