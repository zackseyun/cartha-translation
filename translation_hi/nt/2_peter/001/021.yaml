source:
  edition: SBLGNT
  text: οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη ⸂προφητεία ποτέ⸃, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ⸀ἀπὸ θεοῦ ἄνθρωποι.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/021.yaml
  text: For prophecy was never brought forth by the will of man[c][b][a], but men spoke from God as they were carried along by the Holy Spirit.
translation:
  language: hi
  text: क्योंकि कोई भी भविष्यवाणी कभी मनुष्य की इच्छा से उत्पन्न नहीं हुई[a], बल्कि मनुष्यों ने पवित्र आत्मा के द्वारा संचालित होकर[b] परमेश्वर की ओर से बोला[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लाई गई” या “प्रस्तुत की गई।” यूनानी क्रिया कर्मवाच्य है और इसी पद में आगे प्रयुक्त “संचालित होकर” के मूल क्रिया-पद से संबंधित है।
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र आत्मा के द्वारा ले जाए जाते हुए।” यूनानी का अधिक शाब्दिक भाव “ले जाए जाते हुए” है, जो आत्मा की सक्रिय अगुवाई पर बल देता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ “मनुष्यों” यूनानी ἄνθρωποι का प्रतिनिधिक मानवीय अर्थ व्यक्त करता है; संदर्भ जहाँ सामान्य है, वहाँ इसका उद्देश्य स्त्रियों को बाहर रखना नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: θελήματι ἀνθρώπου
  choice: मनुष्य की इच्छा से
  rationale: 'करण कारक का भाव सुरक्षित रहता है: भविष्यवाणी का उद्गम मानवीय इच्छा या पहल से नहीं हुआ। एकवचन ἀνθρώπου का प्रतिनिधिक मानवीय अर्थ रखा गया है।'
- source_word: ἠνέχθη
  choice: लाई गई
  rationale: φέρω के भूतकालीन कर्मवाच्य को दर्शाता है और आगे आने वाले φερόμενοι के साथ शब्दगत संबंध बनाए रखता है। हिंदी में यह भविष्यवाणी के प्रकट या प्रस्तुत किए जाने के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: προφητεία
  choice: भविष्यवाणी
  rationale: भविष्यसूचक प्रकाशन या वचन के लिए प्रचलित, स्पष्ट और संदर्भानुकूल शब्द।
- source_word: ποτέ
  choice: कभी ... नहीं
  rationale: οὐ के साथ इसके प्रबल निषेध को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὑπὸ πνεύματος ἁγίου
  choice: पवित्र आत्मा के द्वारा
  rationale: ὑπό सहित संबंधकारक सक्रिय कर्तृत्व बताता है; हिंदी का ‘के द्वारा’ उसी एजेंसी को स्पष्ट रखता है।
- source_word: φερόμενοι
  choice: आगे बढ़ाए जाते हुए
  rationale: कर्मवाच्य वर्तमान कृदंत और आत्मा की सक्रिय अगुवाई या प्रेरक शक्ति को बनाए रखता है। ‘प्रेरित होकर’ अधिक व्याख्यात्मक होता और ἠνέχθη के साथ φέρω की पुनरावृत्ति को छिपा देता।
- source_word: ἐλάλησαν
  choice: बोले
  rationale: λαλέω का सीधा और स्वाभाविक हिंदी रूप है; अनावश्यक रूप से भाषा को ऊँचा नहीं करता।
- source_word: ἀπὸ θεοῦ
  choice: परमेश्वर की ओर से
  rationale: ἀπό के स्रोत या उद्गम का भाव व्यक्त करता है और पवित्र आत्मा की एजेंसी से भेद बनाए रखता है।
- source_word: ἄνθρωποι
  choice: मनुष्य
  rationale: मानवीय वक्ताओं को सामूहिक और प्रतिनिधिक अर्थ में व्यक्त करता है; हिंदी में ‘मनुष्य’ संदर्भानुसार बहुवचन-सामूहिक अर्थ दे सकता है और स्त्रियों को सिद्धांततः बाहर नहीं करता।
theological_decisions:
- issue: भविष्यवाणी में परमेश्वर और मनुष्य की भूमिका
  choice: भविष्यवाणी मानवीय इच्छा से उत्पन्न नहीं हुई; फिर भी वास्तविक मनुष्य बोले, और वे पवित्र आत्मा के द्वारा आगे बढ़ाए जाते हुए परमेश्वर की ओर से बोले।
  alternative: इसे या तो आत्मा द्वारा यांत्रिक शब्दशः लेखन अथवा मानवीय पहल और दैवी प्रभाव के मिश्रण के रूप में स्पष्ट कर देना।
  rationale: यूनानी पाठ ‘मनुष्य बोले’ कहकर वास्तविक मानवीय वाणी और ‘परमेश्वर की ओर से’ तथा ‘पवित्र आत्मा के द्वारा आगे बढ़ाए जाते हुए’ कहकर निर्णायक दैवी स्रोत एवं सक्रियता—दोनों को साथ रखता है। अनुवाद इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘लाई गई’ और ‘आगे बढ़ाए जाते हुए’ से φέρω की शब्दगत प्रतिध्वनि यथासंभव रखी गई है। ‘परमेश्वर की ओर से’ स्रोत और ‘पवित्र आत्मा के द्वारा’ एजेंसी के बीच अंतर सुरक्षित रखता है।
