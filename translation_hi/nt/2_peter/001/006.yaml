source:
  edition: SBLGNT
  text: ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/006.yaml
  text: and in knowledge[a], self-control; and in self-control, steadfastness; and in steadfastness, godliness[b],
translation:
  language: hi
  text: और ज्ञान के साथ आत्म-संयम, आत्म-संयम के साथ धीरज[a], और धीरज के साथ ईश्वर-भक्ति[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृढ़ता,’ ‘सहनशीलता,’ अथवा ‘धैर्यपूर्वक टिके रहना’; यूनानी ὑπομονή कठिनाई में निरंतर बने रहने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य संक्षिप्त है और पिछले पद से चली आ रही सद्गुणों की शृंखला को आगे बढ़ाता है; प्रत्येक गुण के साथ अगला गुण जोड़ा जाना समझा जाता है।
    reason: cross_reference
lexical_decisions:
- source_word: γνώσει
  choice: ज्ञान
  rationale: γνῶσις का सीधा और प्रसंगानुकूल अर्थ ‘ज्ञान’ है; सद्गुणों की इस शृंखला में यह स्वाभाविक और स्पष्ट है।
- source_word: ἐγκράτειαν / ἐγκρατείᾳ
  choice: आत्म-संयम
  rationale: ἐγκράτεια अपनी इच्छाओं और आवेगों पर नियंत्रण रखने का भाव व्यक्त करता है। ‘आत्म-संयम’ आधुनिक हिन्दी में स्पष्ट नैतिक अर्थ देता है।
- source_word: ὑπομονήν / ὑπομονῇ
  choice: धीरज
  rationale: ὑπομονή कठिनाई में टिके रहने और हार न मानने का भाव रखता है। ‘धीरज’ सहज हिन्दी है; वैकल्पिक अर्थ फुटनोट में दिए गए हैं ताकि इसे केवल निष्क्रिय प्रतीक्षा न समझा जाए।
- source_word: εὐσέβειαν
  choice: ईश्वर-भक्ति
  rationale: εὐσέβεια यहाँ ईश्वर के प्रति श्रद्धापूर्ण समर्पण और उसके अनुरूप जीवन को दर्शाता है। ‘ईश्वर-भक्ति’ साधारण पाठक के लिए ‘भक्ति’ से अधिक स्पष्ट है और किसी संप्रदाय-विशेष का अर्थ नहीं जोड़ता।
- source_word: ἐν δὲ τῇ ... τὴν ...
  choice: और ... के साथ ...
  rationale: यूनानी वाक्य पिछले पद से चली आ रही संक्षिप्त रचना है। हिन्दी में ‘के साथ’ उस सद्गुण-शृंखला को स्वाभाविक बनाता है, बिना अनावश्यक क्रिया जोड़कर अर्थ का विस्तार किए।
- source_word: δέ
  choice: और
  rationale: यहाँ δέ विरोध नहीं, बल्कि शृंखला की अगली कड़ी जोड़ता है; इसलिए ‘और’ उपयुक्त है।
theological_decisions:
- issue: सद्गुण-शृंखला की अपूर्ण/संक्षिप्त वाक्य-रचना
  choice: सूची की संक्षिप्त संरचना को बनाए रखते हुए ‘के साथ’ का प्रयोग
  alternative: ‘ज्ञान में आत्म-संयम जोड़ो; आत्म-संयम में धीरज जोड़ो; और धीरज में ईश्वर-भक्ति जोड़ो’
  rationale: यूनानी में क्रिया इस पद में व्यक्त नहीं है, बल्कि पिछले पद से समझी जाती है। संक्षिप्त रूप बनाए रखने से स्रोत की शैली सुरक्षित रहती है और अनावश्यक व्याख्यात्मक विस्तार से बचा जाता है।
- issue: εὐσέβεια का धार्मिक आशय
  choice: ईश्वर-भक्ति
  alternative: भक्ति; धर्मपरायणता
  rationale: यह शब्द ईश्वर के प्रति श्रद्धा से आकार पाए जीवन को व्यक्त करता है। ‘ईश्वर-भक्ति’ उस संबंध को स्पष्ट करता है, जबकि ‘धर्मपरायणता’ अधिक संस्थागत या केवल आचरण-केंद्रित समझी जा सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। दोहराव मूल यूनानी की सद्गुण-शृंखला को दर्शाने के लिए सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘knowledge’ के बाद था, जबकि उसका फुटनोट ὑπομονή से संबंधित है; हिन्दी में उसे सही शब्द ‘धीरज’ के बाद रखा गया है।
