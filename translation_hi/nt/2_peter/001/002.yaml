id: 2PE.1.2
reference: 2 Peter 1:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/002.yaml
  text: Grace to you and peace be multiplied in the knowledge of God and of Jesus our Lord[a][b].
translation:
  language: hi
  text: परमेश्वर और हमारे प्रभु यीशु के ज्ञान में तुम्हें अनुग्रह और शांति बहुतायत से मिलती जाएँ[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर और हमारे प्रभु यीशु के ज्ञान के द्वारा।” यूनानी पूर्वसर्ग का अर्थ यहाँ “में” या “के द्वारा/के माध्यम से” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “ज्ञान” के लिए “पूर्ण ज्ञान” भी संभव है। यूनानी शब्द ἐπίγνωσις अधिक पूर्ण या गहरे ज्ञान का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χάρις
  choice: अनुग्रह
  rationale: पत्रों की आशीष-वाणी में प्रचलित और धर्मवैचारिक रूप से समृद्ध शब्द; यह परमेश्वर की कृपा का भाव बनाए रखता है।
- source_word: εἰρήνη
  choice: शान्ति
  rationale: अभिवादन में प्रचलित अनुवाद, जो यूनानी शब्द के कल्याण और सम्भावित सामी पृष्ठभूमि के भाव को सुरक्षित रखता है।
- source_word: πληθυνθείη
  choice: बहुतायत से मिलती रहे
  rationale: अओरिस्ट कर्मवाच्य इच्छार्थक रूप को स्वाभाविक हिन्दी आशीष-वाक्य में व्यक्त करता है और प्राप्त होने/बढ़ाए जाने का भाव बनाए रखता है।
- source_word: ἐν
  choice: में
  rationale: सीधा अनुवाद, जो ज्ञान के क्षेत्र में होने का अर्थ रखता है; साधनार्थक सम्भावना पादटिप्पणी में दी गई है।
- source_word: ἐπιγνώσει
  choice: ज्ञान
  rationale: स्वाभाविक हिन्दी; अधिक पूर्ण या गहरे ज्ञान की सम्भावित तीव्रता को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: θεοῦ
  choice: परमेश्वर
  rationale: हिन्दी बाइबिलीय प्रयोग में θεός का स्पष्ट और प्रतिष्ठित समतुल्य।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: नाम का हिन्दी में मानक लिप्यन्तरण।
- source_word: κυρίου
  choice: प्रभु
  rationale: κύριος की उपाधिगत और मसीह-संबंधी गरिमा को बनाए रखने वाला मानक हिन्दी अनुवाद।
- source_word: τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν
  choice: परमेश्वर और हमारे प्रभु यीशु के ज्ञान
  rationale: हिन्दी में साझा सम्बन्धकारक ‘के ज्ञान’ दोनों व्यक्तियों से स्वाभाविक रूप से जुड़ता है और यूनानी संरचना को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ἐπίγνωσις की सम्भावित सघनता
  choice: ज्ञान
  alternative: पूर्ण ज्ञान / गहरा ज्ञान
  rationale: शब्द अधिक पूर्ण ज्ञान का भाव दे सकता है, पर मुख्य पाठ में ‘ज्ञान’ मूल की अर्थ-सीमा को खुला रखता है; विकल्प पादटिप्पणी में सुरक्षित है।
- issue: ἐν का अर्थ
  choice: ज्ञान में
  alternative: ज्ञान के द्वारा / ज्ञान के माध्यम से
  rationale: यहाँ यूनानी पूर्वसर्ग क्षेत्र या साधन दोनों सूचित कर सकता है। मुख्य पाठ अधिक सीधा ‘में’ रखता है और साधनार्थक सम्भावना पादटिप्पणी में बताता है।
- issue: आशीष-वाक्य में πληθυνθείη का कर्मवाच्य इच्छार्थक बल
  choice: बहुतायत से मिलती रहे
  alternative: बहुगुणित होती रहे / बढ़ाई जाए
  rationale: चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक आशीष है और अनुग्रह तथा शान्ति के प्राप्त और प्रचुर होने का भाव व्यक्त करता है, बिना कर्ता को स्पष्ट किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आशीष-वाक्य। ‘तुम्हें’ बहुवचन समुदाय को संबोधित करता है। ‘बहुतायत से मिलती रहे’ शाब्दिक ‘बहुगुणित हो’ की अपेक्षा अधिक स्वाभाविक है, फिर भी मूल के इच्छार्थक और कर्मवाच्य भाव को बनाए रखता है।
