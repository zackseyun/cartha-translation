  text: καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/005.yaml
  text: And for this very reason[a], making every effort, supply in your faith virtue, and in virtue knowledge[d][c][b],
translation:
  language: hi
  text: और इसी कारण, हर प्रकार का प्रयास करते हुए, अपने विश्वास के साथ सद्गुण को, और सद्गुण के साथ ज्ञान को जोड़ो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''विश्वास'' के लिए ''विश्वासयोग्यता'' या ''भरोसा'' भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: '''जोड़ो'' का अनुवाद ''उपलब्ध कराओ'' या ''भरपूर प्रदान करो'' भी किया जा सकता है; मूल क्रिया में उदारतापूर्वक उपलब्ध कराने का भाव है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ αὐτὸ τοῦτο δὲ
  choice: और इसी कारण
  rationale: यह पिछले कथन से बलपूर्ण संबंध व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: σπουδὴν πᾶσαν παρεισενέγκαντες
  choice: पूरा परिश्रम करके
  rationale: कृदन्तीय वाक्यांश पूरे मनोयोग और लगन के साथ प्रयत्न करने की सहगामी क्रिया बताता है।
- source_word: ἐπιχορηγήσατε
  choice: जोड़ते जाओ
  rationale: सद्गुणों की क्रमिक शृंखला को सहज हिन्दी में व्यक्त करता है; मूल क्रिया में उदारतापूर्वक उपलब्ध कराने या भरपूर जोड़ने का भाव भी है, जिसे पादटिप्पणी में रखा गया है।
- source_word: ἐν τῇ πίστει ὑμῶν
  choice: अपने विश्वास के साथ
  rationale: शाब्दिक 'अपने विश्वास में' हिन्दी में संदिग्ध और असहज हो सकता है; 'के साथ' गुणों के संबंध को व्यक्त करते हुए ἐν की संरचनात्मक अस्पष्टता को अत्यधिक नहीं खोलता।
- source_word: πίστει
  choice: विश्वास
  rationale: πίστις का मुख्य और प्रसंगानुकूल हिन्दी प्रतिरूप है।
- source_word: ἀρετήν
  choice: सद्गुण
  rationale: चरित्रगत नैतिक उत्कृष्टता को संक्षिप्त, प्रतिष्ठित और सामान्यतः बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: γνῶσιν
  choice: ज्ञान
  rationale: γνῶσις के मूल अर्थ और गुणों की इस शृंखला के अनुरूप सीधा प्रतिरूप है।
theological_decisions:
- issue: गुणों की शृंखला में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: इस प्रसंग में 'विश्वास' सबसे सीधा अर्थ है, पर यूनानी शब्द के अर्थ-क्षेत्र में विश्वासयोग्यता और भरोसा भी आ सकते हैं।
- issue: ἐν + संप्रदान कारक द्वारा गुणों का संबंध
  choice: '''के साथ ... भी जोड़ते जाओ'''
  alternative: '''में ... उपलब्ध कराओ'''
  rationale: यूनानी रचना प्रत्येक गुण को अगले गुण से जोड़ती है। हिन्दी में 'के साथ' क्रमिक संवर्धन को स्वाभाविक रूप से व्यक्त करता है, जबकि 'में' मूल संरचना के अधिक निकट पर असहज है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में 'भी' और 'जोड़ते जाओ' गुणों की जारी शृंखला को स्वाभाविक बनाते हैं।
