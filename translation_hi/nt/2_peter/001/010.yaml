source:
  edition: SBLGNT
  text: διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/001/010.yaml
  text: Therefore[a], brothers, be all the more diligent to make your calling and election sure, for if you do these things, you will certainly never stumble.
translation:
  language: hi
  text: इसलिए, भाइयो[a], अपनी बुलाहट और चुने जाने को पक्का करने के लिए और भी अधिक परिश्रम करो; क्योंकि यदि तुम ये काम करते रहोगे, तो तुम कभी ठोकर नहीं खाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में शब्दशः ‘भाइयो’ है, पर यह पूरी विश्वासी मण्डली को समावेशी रूप से संबोधित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले उपदेश से निकले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से जोड़ता है।
- source_word: μᾶλλον
  choice: और भी अधिक
  rationale: यह आज्ञा में निहित प्रयत्न की तीव्रता को बढ़ाता है और यूनानी तुलनात्मक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग बहुवचन है; पत्रों में यह प्रायः पूरी विश्वासी मण्डली को समावेशी रूप से संबोधित करता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: σπουδάσατε
  choice: परिश्रम करो
  rationale: यह गंभीर, तत्पर और लगनशील प्रयास की आज्ञा देता है; आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: βεβαίαν
  choice: पक्का
  rationale: यह दृढ़, सुनिश्चित या प्रमाणित होने का भाव रखता है; ‘पक्का करना’ सामान्य पाठक के लिए सहज है और कारण बनने तथा पुष्टि करने के बीच मूल पाठ की कुछ खुली अर्थ-गुंजाइश बनाए रखता है।
- source_word: κλῆσιν
  choice: बुलाहट
  rationale: यह परमेश्वर के बुलाने के अर्थ को बनाए रखता है और हिन्दी मसीही शब्दावली में समझने योग्य है।
- source_word: ἐκλογὴν
  choice: चुने जाने
  rationale: यह परमेश्वर के चुनाव को स्वाभाविक हिन्दी में व्यक्त करता है और अत्यधिक पारिभाषिक अथवा किसी सम्प्रदाय-विशेष की व्याख्या से बचता है।
- source_word: ποιεῖσθαι
  choice: करने के लिए
  rationale: βεβαίαν के साथ मिलकर ‘पक्का करने’ का अर्थ देता है; यह सीधा अनुवाद है और व्याख्या को अनावश्यक रूप से ‘प्रमाणित’ तक सीमित नहीं करता।
- source_word: ταῦτα
  choice: ये काम
  rationale: यह पिछले पदों में बताई गई बातों और गुणों की ओर संकेत करता है; हिन्दी में ‘ये काम’ संदर्भ को सहज बनाता है।
- source_word: ποιοῦντες
  choice: यदि तुम ... करते रहोगे
  rationale: कृदन्त का परिस्थितिजन्य/शर्तात्मक बल ‘यदि’ से स्पष्ट होता है, जबकि ‘करते रहोगे’ अभ्यास की निरंतरता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: οὐ μὴ ... ποτε
  choice: कभी ... नहीं
  rationale: दोहरी प्रबल निषेधात्मक रचना को हिन्दी का दृढ़ ‘कभी नहीं’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πταίσητέ
  choice: ठोकर खाओगे
  rationale: यह मूल रूपक को सुरक्षित रखता है और अर्थ को न तो पूर्ण पापरहितता और न ही केवल अंतिम धर्मत्याग तक सीमित करता है।
theological_decisions:
- issue: ‘अपनी बुलाहट और चुने जाने को पक्का’ करने का अर्थ
  choice: विश्वासी को अपनी बुलाहट और चुने जाने को जीवन में दृढ़ या सुनिश्चित करने के लिए परिश्रम करने का उपदेश
  alternative: मानवीय प्रयास द्वारा परमेश्वर की बुलाहट और चुनाव को अस्तित्व में लाना अथवा अपना दर्जा अर्जित करना
  rationale: मूल वाक्यरचना दृढ़ करने या सुनिश्चित करने की बात करती है। अनुवाद ‘पक्का करने’ को बनाए रखता है और यह निर्णायक रूप से नहीं बताता कि इसका आशय केवल प्रमाण देना है या व्यावहारिक रूप से दृढ़ करना; इस प्रकार पाठ का धार्मिक तनाव सुरक्षित रहता है।
- issue: ‘कभी ठोकर नहीं खाओगे’ का बल
  choice: इन बातों का अभ्यास करते हुए ठोकर खाने से बचने का दृढ़ आश्वासन
  alternative: कभी कोई पाप न करने की पूर्ण गारंटी, अथवा केवल अंतिम पतन से कभी न गिरने की संकीर्ण व्याख्या
  rationale: πταίω ठोकर खाने या असफल होने का रूपक रखता है। इसे उसी रूपक में रखना किसी विशिष्ट सिद्धान्त को पाठ पर थोपने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भाइयो’ स्रोत के व्याकरणिक रूप को रखता है और समावेशी अर्थ पादटिप्पणी में दिया गया है। ‘चुने जाने’ को पारिभाषिक ‘चुनाव’ पर प्राथमिकता दी गई है ताकि वाक्य स्वाभाविक रहे, जबकि परमेश्वर द्वारा चुनने का भाव बना रहे।
