source:
  edition: SBLGNT
  text: καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/002.yaml
  text: And many will follow their sensuality[c][b][a], and because of them the way of the truth will be blasphemed.
translation:
  language: hi
  text: और बहुत-से लोग उनके निर्लज्ज और उच्छृंखल आचरणों[a] का अनुसरण करेंगे, और उनके कारण सत्य के मार्ग[b] की निन्दा की जाएगी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी उच्छृंखलताओं,” “उनके बेशर्म चाल-चलनों।” यूनानी शब्द निर्लज्ज और बेलगाम व्यवहार को दर्शाता है, जिसमें प्रायः यौन अनैतिकता का भाव भी होता है।
    reason: lexical_alternative
  - marker: b
    text: या “सत्य की राह।” यह पदबंध सत्य के अनुरूप विश्वास और जीवन-पद्धति, दोनों का संकेत कर सकता है।
    reason: metaphor_clarification
  - marker: c
    text: या “को बुरा-भला कहा जाएगा” अथवा “की बदनामी होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πολλοὶ
  choice: बहुत-से लोग
  rationale: यह सामान्य परिमाणवाचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐξακολουθήσουσιν
  choice: पर चलेंगे
  rationale: क्रिया किसी के मार्ग या व्यवहार का अनुसरण करने का भाव रखती है; ‘उनके ... पर चलेंगे’ हिन्दी में अनुकरण और भावी काल दोनों को स्पष्ट करता है।
- source_word: αὐτῶν
  choice: उनके
  rationale: सन्दर्भ में यह पिछले पद के झूठे शिक्षकों की ओर संकेत करता है और अगले पदबंध के साथ स्वाभाविक सम्बन्ध बनाता है।
- source_word: ταῖς ἀσελγείαις
  choice: निर्लज्ज आचरणों
  rationale: ἀσέλγεια बेशर्म और बेलगाम व्यवहार को दर्शाता है, जिसमें प्रायः यौन अनैतिकता का भाव भी होता है। बहुवचन ‘आचरणों’ यूनानी रूप को बनाए रखता है और अर्थ को केवल कामुकता तक सीमित नहीं करता।
- source_word: δι’ οὓς
  choice: उनके कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण व्यक्त करता है; यह सहज हिन्दी में ‘because of them’ का अर्थ देता है।
- source_word: ἡ ὁδὸς τῆς ἀληθείας
  choice: सत्य का मार्ग
  rationale: यह यूनानी सम्बन्धवाचक रचना और ‘मार्ग’ के आरम्भिक मसीही रूपक को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: βλασφημηθήσεται
  choice: निन्दा की जाएगी
  rationale: भविष्यत् कर्मवाच्य को सुरक्षित रखते हुए यह किसी पवित्र या आदरणीय विषय के विरुद्ध अपमानजनक बोलने का अर्थ स्पष्ट और स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: ‘सत्य का मार्ग’ का संकेतार्थ
  choice: रूपक को ‘सत्य का मार्ग’ के रूप में बनाए रखा गया है, जो सच्चे विश्वास और उसके अनुरूप जीवन दोनों की ओर संकेत कर सकता है।
  alternative: इसे स्पष्ट करके ‘मसीही विश्वास’ या ‘सच्चा जीवन-मार्ग’ कहना।
  rationale: मूल पाठ स्वयं संकेतार्थ को पूरी तरह नहीं खोलता; रूपक बनाए रखने से उसका धार्मिक और जीवन-व्यवहार सम्बन्धी विस्तार सुरक्षित रहता है।
- issue: ἀσέλγεια का नैतिक दायरा
  choice: ‘निर्लज्ज आचरणों’
  alternative: ‘कामुकता’, ‘व्यभिचारपूर्ण चालचलन’ या ‘लुचपन’
  rationale: यूनानी शब्द में यौन उच्छृंखलता शामिल हो सकती है, पर उसका अर्थ व्यापक बेशर्म और बेलगाम व्यवहार भी है; इसलिए अनुवाद इसे अनावश्यक रूप से केवल यौन पाप तक सीमित नहीं करता।
- issue: βλασφημέω की धार्मिक तीव्रता
  choice: ‘निन्दा की जाएगी’
  alternative: ‘बदनामी होगी’, ‘भला-बुरा कहा जाएगा’ या ‘ईशनिन्दा की जाएगी’
  rationale: ‘निन्दा’ अपमानजनक वाणी की गम्भीरता बनाए रखती है, जबकि ‘ईशनिन्दा’ यहाँ वस्तु ‘सत्य का मार्ग’ होने के कारण हिन्दी में अत्यधिक संकीर्ण या अस्वाभाविक हो सकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निर्लज्ज आचरणों’ मूल के बहुवचन और व्यापक नैतिक अर्थ को सुरक्षित रखता है; ‘सत्य का मार्ग’ धार्मिक रूपक को बिना सांप्रदायिक विस्तार के बनाए रखता है।
