  text: οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/009.yaml
  text: then the Lord knows how to rescue the godly from trial[a], and to keep the unrighteous under punishment until the day of judgment[b],
translation:
  language: hi
  text: तो प्रभु जानता है कि भक्तों को परीक्षा[a] से कैसे बचाए, और अधर्मियों को दण्ड भोगते हुए न्याय के दिन तक कैसे रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रलोभन।” यूनानी शब्द का अर्थ प्रलोभन या परीक्षा/परख, दोनों हो सकता है; यहाँ प्रसंग परीक्षा से बचाए जाने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: या “अधर्मियों को न्याय के दिन दण्ड पाने के लिए रखे।” यूनानी कृदन्त का अर्थ जारी दण्ड भोगना भी हो सकता है और आने वाले न्याय से जुड़ा दण्ड भी।
    reason: alternative_reading
lexical_decisions:
- source_word: οἶδεν
  choice: जानता है कि ... कैसे
  rationale: अनन्त क्रियाओं के साथ οἶδεν व्यावहारिक ज्ञान या सामर्थ्य का भाव देता है; हिन्दी में ‘जानता है कि ... कैसे’ स्वाभाविक रूप से वही अर्थ व्यक्त करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: κύριος का प्रचलित, गरिमापूर्ण और प्रसंगानुकूल हिन्दी रूप।
- source_word: εὐσεβεῖς
  choice: भक्त लोगों
  rationale: विशेषण का संज्ञात्मक प्रयोग उन लोगों के लिए है जो परमेश्वर के प्रति श्रद्धा और भक्ति रखते हैं; ‘भक्त लोगों’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: ἐκ πειρασμοῦ
  choice: परीक्षा से
  rationale: πειρασμός परीक्षा, परख या प्रलोभन का अर्थ दे सकता है। नूह और लूत के पिछले प्रसंग में विपत्ति और परख से छुटकारे का भाव प्रमुख है।
- source_word: ῥύεσθαι
  choice: बचाए
  rationale: ῥύομαι संकट से छुड़ाने या बचाने को दर्शाता है; ‘बचाए’ सरल और स्वाभाविक हिन्दी है।
- source_word: ἀδίκους
  choice: अधर्मियों
  rationale: यह नैतिक और न्यायिक रूप से गलत लोगों को दर्शाता है; ‘अधर्मी’ बाइबलीय हिन्दी में परिचित और अर्थपूर्ण है।
- source_word: κολαζομένους
  choice: दण्ड भोगते हुए
  rationale: वर्तमान कर्मवाच्य कृदन्त की जारी अवस्था को स्पष्ट रूप से बनाए रखता है, बिना उसे केवल भावी दण्ड में बदल दिए।
- source_word: εἰς ἡμέραν κρίσεως
  choice: न्याय के दिन तक
  rationale: τηρεῖν के साथ यह आने वाले न्याय-दिन की ओर रखे जाने की समय-सीमा स्वाभाविक रूप से व्यक्त करता है।
- source_word: τηρεῖν
  choice: रखे
  rationale: τηρέω के रखने, निगरानी में रखने या सुरक्षित रखने के व्यापक अर्थ को बनाए रखता है; यहाँ प्रसंग दण्डात्मक हिरासत का संकेत देता है।
theological_decisions:
- issue: πειρασμός का प्रसंगगत अर्थ
  choice: परीक्षा/परख
  alternative: प्रलोभन
  rationale: पिछले उदाहरण विनाशकारी परिस्थितियों के बीच परमेश्वर द्वारा बचाए जाने पर केंद्रित हैं। फिर भी शब्द की वास्तविक द्विअर्थकता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: κολαζομένους का कालगत बल
  choice: न्याय के दिन तक दण्ड भोगते हुए रखा जाना
  alternative: न्याय के दिन दण्ड पाने के लिए रखा जाना
  rationale: वर्तमान कृदन्त जारी दण्ड की अवस्था का संकेत दे सकता है, पर वाक्यरचना भावी न्याय से जुड़े दण्ड की व्याख्या की भी अनुमति देती है; इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘भक्त लोगों’ सामान्य पाठक के लिए ‘धर्मपरायणों’ की अपेक्षा अधिक सुलभ है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
