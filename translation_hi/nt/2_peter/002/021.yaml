source:
  edition: SBLGNT
  text: κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ⸀ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/021.yaml
  text: For it would have been better for them not to have known the way of righteousness than[a], after knowing it[c][b], to turn back from the holy commandment delivered to them.
translation:
  language: hi
  text: क्योंकि उनके लिए धार्मिकता के मार्ग[a] को न जानना, उसे जान लेने के बाद उन्हें दी गई[c] उस पवित्र आज्ञा से मुड़ जाने[b] से बेहतर होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धार्मिकता की राह’; δικαιοσύνη का अर्थ कुछ संदर्भों में ‘न्याय’ भी हो सकता है, पर यहाँ ‘धार्मिकता’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या ‘से लौट जाना’ अथवा ‘से मुँह मोड़ लेना’।
    reason: lexical_alternative
  - marker: c
    text: या ‘जो उन्हें सौंपी गई थी’ अथवा ‘जो उन तक पहुँचाई गई थी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: κρεῖττον γὰρ ἦν
  choice: क्योंकि ... बेहतर होता
  rationale: यह पद पिछले कथन का कारण बताता है। तुलनात्मक पदबंध को स्वाभाविक हिन्दी में अवास्तविक भूतकाल की भावना सहित व्यक्त किया गया है।
- source_word: ἐπεγνωκέναι / ἐπιγνοῦσιν
  choice: न जानना / जान लेने के बाद
  rationale: एक ही यूनानी क्रिया की पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है। ‘पूरी तरह जानना’ कहना मूल से अधिक बल देना होता।
- source_word: ὁδὸν τῆς δικαιοσύνης
  choice: धार्मिकता का मार्ग
  rationale: ὁδός यहाँ जीवन-रीति या आचरण के रूपक के लिए है, और δικαιοσύνη नैतिक धार्मिकता को दर्शाती है। यह पदबंध संक्षिप्त, परिचित और मूल संरचना के निकट है।
- source_word: ὑποστρέψαι ἐκ
  choice: से फिर जाना
  rationale: यह अभिव्यक्ति पहले से ज्ञात मार्ग से पीछे हटने या उससे विमुख होने का भाव रखती है; ‘फिर जाना’ उस उलटाव को बनाए रखता है।
- source_word: παραδοθείσης αὐτοῖς
  choice: जो उन्हें दी गई थी
  rationale: सरल हिन्दी में आज्ञा के उन तक पहुँचाए या सौंपे जाने का निष्क्रिय भाव व्यक्त होता है, बिना stewardship या परंपरा का अतिरिक्त अर्थ जोड़े।
- source_word: ἁγίας ἐντολῆς
  choice: पवित्र आज्ञा
  rationale: एकवचन और धार्मिक-नैतिक गंभीरता दोनों को सीधे बनाए रखा गया है।
theological_decisions:
- issue: क्या यह पद धर्मत्याग अथवा केवल बाहरी धार्मिक परिचय के प्रश्न को निर्णायक रूप से हल करता है
  choice: वास्तविक ज्ञान और उसके बाद पवित्र आज्ञा से फिर जाने की बात को स्पष्ट रखा गया है
  alternative: शब्दों को अधिक प्रबल बनाकर उद्धार खोने का निष्कर्ष देना, या अधिक दुर्बल बनाकर केवल सतही परिचय बताना
  rationale: मूल पाठ ज्ञान और उलट जाने की गंभीरता बताता है, पर उद्धार और स्थिरता से जुड़े संप्रदायगत विवाद का स्पष्ट समाधान नहीं देता; इसलिए उस तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘बजाय इसके कि’ तुलना को स्पष्ट करता है; ‘धार्मिकता का मार्ग’ और ‘पवित्र आज्ञा’ जैसे परिचित बाइबलीय पदबंध मूल की संक्षिप्तता और गंभीरता बनाए रखते हैं।
