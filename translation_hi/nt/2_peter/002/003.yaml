source:
  edition: SBLGNT
  text: καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ ⸀νυστάζει.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/003.yaml
  text: And in greed they will exploit you with fabricated words. Their judgment from long ago is not idle[a], and their destruction is not asleep.
translation:
  language: hi
  text: और वे लोभ के कारण गढ़ी हुई बातों से तुम्हारा शोषण करेंगे[a]। उनके विरुद्ध बहुत पहले का न्याय निष्क्रिय नहीं पड़ा है, और उनका विनाश ऊँघ नहीं रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “तुमसे व्यापार करेंगे” या “तुम्हें लाभ कमाने की वस्तु बनाएँगे”—यूनानी क्रिया लोगों से लाभ कमाने के लिए व्यापार के रूपक का प्रयोग करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: लोभ के कारण
  rationale: यहाँ πλεονεξία झूठे शिक्षकों की प्रेरणा बताता है; ‘लोभ के कारण’ आधुनिक हिन्दी में स्वाभाविक है और नैतिक अर्थ को स्पष्ट रखता है।
- source_word: πλαστοῖς λόγοις
  choice: गढ़ी हुई बातों से
  rationale: πλαστός में गढ़ने या कृत्रिम रूप से बनाने का भाव है; ‘गढ़ी हुई बातें’ केवल सामान्य झूठ नहीं, बल्कि जानबूझकर रची गई बातों को व्यक्त करती हैं।
- source_word: ἐμπορεύσονται
  choice: तुम्हारा शोषण करेंगे
  rationale: क्रिया का व्यापारिक रूपक लोगों को लाभ कमाने की वस्तु मानने का भाव देता है। ‘शोषण करेंगे’ आधुनिक पाठक के लिए आशय स्पष्ट करता है; मूल व्यापारिक बिंब पादटिप्पणी में रखा गया है।
- source_word: κρίμα
  choice: न्याय
  rationale: κρίμα न्यायिक निर्णय या दण्डात्मक न्याय को सूचित करता है। ‘न्याय’ अपेक्षाकृत व्यापक है और पद से अधिक विशिष्ट दण्ड-सिद्धान्त नहीं निकालता।
- source_word: ἔκπαλαι
  choice: बहुत पहले से ठहराया गया
  rationale: ἔκπαλαι प्राचीन समय से विद्यमान होने का भाव देता है। हिन्दी वाक्य में ‘ठहराया गया’ न्यायिक संदर्भ को स्वाभाविक बनाता है, यद्यपि यह निहित भाव की स्पष्ट अभिव्यक्ति है।
- source_word: οὐκ ἀργεῖ
  choice: निष्क्रिय नहीं पड़ा है
  rationale: ἀργέω का मूल भाव निष्क्रिय या निष्फल पड़े रहने का है। यह अनुवाद केवल ‘देर नहीं करता’ कहने के बजाय मूल मानवीकरण और सक्रियता को बनाए रखता है।
- source_word: ἀπώλεια
  choice: विनाश
  rationale: ἀπώλεια विनाश या बरबादी को दर्शाता है। ‘विनाश’ स्पष्ट, गरिमापूर्ण और धर्मवैज्ञानिक रूप से अनावश्यक रूप से विशिष्ट नहीं है।
- source_word: οὐ νυστάζει
  choice: ऊँघ नहीं रहा
  rationale: νυστάζω का चित्र ऊँघने या नींद में पड़ने का है। ‘ऊँघ नहीं रहा’ विनाश के सजीव मानवीकरण को सुरक्षित रखता है।
theological_decisions:
- issue: घोषित दण्ड का स्वरूप
  choice: आने वाले न्याय और विनाश को सीधे रूप में व्यक्त करना, पर उसकी प्रक्रिया या अवधि को परिभाषित न करना
  alternative: ‘विनाश’ को या तो पूर्ण अस्तित्व-समाप्ति अथवा केवल अस्थायी बरबादी के रूप में स्पष्ट करना
  rationale: पद झूठे शिक्षकों पर निश्चित न्याय की घोषणा करता है, लेकिन उस दण्ड की प्रक्रिया और अवधि नहीं बताता। इसलिए अनुवाद चेतावनी को बनाए रखते हुए किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘गढ़ी हुई बातें’, ‘निष्क्रिय नहीं पड़ा’ और ‘ऊँघ नहीं रहा’ मूल के कृत्रिमता तथा मानवीकरण वाले चित्रों को सुरक्षित रखते हैं।
