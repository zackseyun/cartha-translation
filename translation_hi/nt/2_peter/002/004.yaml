source:
  edition: SBLGNT
  text: Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ ⸀σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/004.yaml
  text: For if God did not spare angels when they sinned[a], but cast them into Tartarus and committed them to chains of gloom, to be kept for judgment[b],
translation:
  language: hi
  text: क्योंकि यदि परमेश्वर ने स्वर्गदूतों को नहीं बख्शा, जब उन्होंने पाप किया, बल्कि उन्हें तारतरस में डाल दिया[a] और घोर अंधकार की जंजीरों के हवाले कर दिया[b], जो न्याय के लिए रखे हुए हैं,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “नरक में डाल दिया” भी किया जाता है, पर यूनानी क्रिया विशेष रूप से तारतरस में डालने का अर्थ देती है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में “घोर अंधकार की जंजीरों” के स्थान पर “घोर अंधकार के गड्ढों” का पाठ है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐφείσατο
  choice: नहीं बख्शा
  rationale: न्याय और दंड के प्रसंग में यह स्वाभाविक हिन्दी है और दया न दिखाने अथवा दंड से न छोड़ने का भाव बनाए रखती है।
- source_word: ἀγγέλων ἁμαρτησάντων
  choice: स्वर्गदूतों को भी नहीं बख्शा, जब उन्होंने पाप किया
  rationale: कालवाचक उपवाक्य अओरिस्ट कृदंत के घटनात्मक भाव को सहज हिन्दी में व्यक्त करता है; ‘भी’ इस उदाहरण की तर्कात्मक शक्ति स्पष्ट करता है।
- source_word: ταρταρώσας
  choice: उन्हें तारतरस में डाल दिया
  rationale: दुर्लभ यूनानी क्रिया विशेष रूप से तारतरस में डालने का संकेत देती है। ‘नरक’ कहने के बजाय नाम को लिप्यंतरित करने से मूल बिंब और उसकी विशिष्टता सुरक्षित रहती है।
- source_word: σειραῖς ζόφου
  choice: घोर अंधकार की जंजीरों
  rationale: ‘जंजीरें’ σειραί का सीधा अर्थ है; ‘घोर अंधकार’ ζόφος के दबावपूर्ण, अधोलोक-सदृश अंधकार को सहज और गंभीर हिन्दी में व्यक्त करता है।
- source_word: παρέδωκεν
  choice: हवाले कर दिया
  rationale: यह न्यायिक अभिरक्षा में सौंपने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और आगे आने वाले सुरक्षित रखे जाने से जुड़ता है।
- source_word: εἰς κρίσιν
  choice: न्याय के लिए
  rationale: यह आगामी न्याय को व्यक्त करता है और समय से पहले ‘दोषी ठहराने’ का संकुचित अर्थ नहीं थोपता।
- source_word: τηρουμένους
  choice: ताकि वे ... रखे जाएँ
  rationale: यह जारी निष्क्रिय अभिरक्षा का भाव व्यक्त करता है और हिन्दी में वाक्य के परिणाम अथवा उद्देश्य-संबंध को स्वाभाविक रखता है।
theological_decisions:
- issue: ταρταρώσας को बाद की धर्मवैज्ञानिक धारणाओं से अधिक विशिष्ट बनाए बिना प्रस्तुत करना
  choice: तारतरस में डाल दिया
  alternative: नरक में डाल दिया
  rationale: मूल यूनानी क्रिया सामान्य ‘नरक’ के बजाय तारतरस का विशिष्ट संकेत देती है। लिप्यंतरण मूल के विशिष्ट न्याय-बिंब को सुरक्षित रखता है और बाद की अवधारणाओं को पाठ में नहीं मिलाता।
- issue: तारतरस, अंधकार की जंजीरों और न्याय के लिए रखे जाने के बीच संबंध
  choice: तारतरस में डाल दिया और घोर अंधकार की जंजीरों के हवाले कर दिया, ताकि वे न्याय के लिए रखे जाएँ
  alternative: घोर अंधकार की जंजीरों में बाँधकर तारतरस में डाल दिया और न्याय के लिए रखा
  rationale: चुना हुआ रूप सभी बिंबों को बनाए रखता है, पर यह निश्चित नहीं करता कि जंजीरें शाब्दिक, साधनवाचक या स्थानवाचक हैं। इस प्रकार यूनानी की संक्षिप्तता और वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर किंतु सहज रूप अपनाया गया है। ‘तारतरस’ जैसे अपरिचित किंतु मूल-पाठ में विशिष्ट शब्द को बनाए रखकर पादटिप्पणी में समझाया गया है। पद अधूरे शर्तवाचक वाक्य का भाग है, इसलिए अंत में अल्पविराम रखा गया है।
