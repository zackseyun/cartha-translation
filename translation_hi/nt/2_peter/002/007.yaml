  yaml_path: translation/nt/2_peter/002/007.yaml
  text: and he rescued righteous Lot[c][b][a], who was being tormented by the sensual conduct of the lawless—
translation:
  language: hi
  text: और उसने धर्मी लूत को छुड़ा लिया, जो उन व्यवस्था-विहीन लोगों के निर्लज्ज आचरण से सताया जा रहा था[a]—
  philosophy: optimal-equivalence
  footnotes:
