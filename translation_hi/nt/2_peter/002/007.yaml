    text: या, ‘जो उत्पीड़ित किया जा रहा था,’ ‘जो बहुत व्यथित था,’ अथवा ‘जो दबाया जा रहा था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: δίκαιον
  choice: धर्मी
  rationale: यह विशेषण लूत के विषय में पाठ का स्पष्ट नैतिक मूल्यांकन व्यक्त करता है; ‘धर्मी’ मानक, स्वाभाविक और सुस्पष्ट हिन्दी है।
- source_word: Λὼτ
  choice: लूत
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: καταπονούμενον
  choice: बहुत दुःखी था
  rationale: वर्तमान निष्क्रिय कृदंत लगातार पड़ रहे गहरे मानसिक दबाव और क्लेश को दर्शाता है। स्वाभाविक हिन्दी में यह उसकी जारी दशा को व्यक्त करता है; अन्य संभावित अर्थ पाद-टिप्पणी में दिए गए हैं।
- source_word: ὑπὸ τῆς ... ἀναστροφῆς
  choice: आचरण से
  rationale: यह वाक्यांश लूत के क्लेश का कारण बताता है; ἀναστροφή यहाँ जीवन-व्यवहार या आचरण को दर्शाता है।
- source_word: τῶν ἀθέσμων
  choice: व्यवस्था-विहीन लोगों
  rationale: यह चयन ऐसे लोगों का बोध कराता है जो स्थापित नैतिक व्यवस्था या उचित मर्यादा की उपेक्षा करते हैं; ‘दुष्ट’ की अपेक्षा मूल के विधि-संबंधी संकेत को अधिक सुरक्षित रखता है।
- source_word: ἐν ἀσελγείᾳ
  choice: निर्लज्ज
  rationale: ἀσέλγεια बेलगाम, मर्यादाहीन और लज्जारहित नैतिक दुराचार का बोध देता है। ‘निर्लज्ज’ सामान्य पाठक के लिए सुबोध रहते हुए इस मुख्य भाव को व्यक्त करता है।
- source_word: ἐρρύσατο
  choice: उसने ... छुड़ा लिया
  rationale: अोरिस्ट क्रिया संकट से बचाने या छुड़ाने की पूर्ण घटना बताती है; हिन्दी में ‘छुड़ा लिया’ स्पष्ट और स्वाभाविक है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले पद से घटनाक्रम को जोड़ने वाला साधारण संयोजक है।
theological_decisions:
- issue: उत्पत्ति के वृत्तांत के संदर्भ में लूत का नैतिक वर्णन
  choice: ‘धर्मी लूत’ का स्पष्ट मूल्यांकन बिना नरम किए रखा गया।
  alternative: लूत के विवादास्पद कार्यों के कारण विशेषण को अस्पष्ट करना या छोड़ देना।
  rationale: यूनानी पाठ लूत को स्पष्टतः δίκαιος कहता है; अनुवाद को पाठ के इसी धार्मिक-नैतिक तनाव को बनाए रखना चाहिए, न कि दूसरे वृत्तांतों से सामंजस्य बैठाने के लिए इसे बदलना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘निर्लज्ज आचरण’ ἐν ἀσελγείᾳ और ἀναστροφή के संबंध को संक्षेप में व्यक्त करता है। मुख्य पाठ में पाद-टिप्पणी चिह्न [a] उपस्थित है।
