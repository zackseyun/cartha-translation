base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/022.yaml
  text: 'What the true proverb says has happened to them: “A dog returns to its own vomit,” and[b][a], “A washed sow returns to wallowing in the mud.”'
translation:
  language: hi
  text: सच्ची कहावत में कही गई बात उन पर चरितार्थ हुई है:[a] “कुत्ता अपनी ही उलटी पर लौटता है,” और “धोई हुई सूअरनी फिर कीचड़ में लोटती है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक औपचारिक अनुवाद: “सच्ची कहावत की बात उनके साथ घटित हुई है।”'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप में: “कुत्ता अपनी ही उलटी पर लौटकर … और धोई हुई सूअरनी कीचड़ में लोटने को।” पहली पंक्ति नीतिवचन 26:11 की प्रतिध्वनि है।'
    reason: cross_reference
lexical_decisions:
- source_word: συμβέβηκεν αὐτοῖς
  choice: उन पर चरितार्थ हुई है
  rationale: पूर्णकाल का भाव यह है कि कहावत में कही बात उनके मामले में घटित होकर अब सत्य सिद्ध हुई है। हिंदी मुहावरा ‘उन पर चरितार्थ हुई है’ इस प्रयोजन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὸ τῆς ἀληθοῦς παροιμίας
  choice: सच्ची कहावत में कही गई बात
  rationale: यूनानी रचना संक्षिप्त और कुछ हद तक अध्याहृत है। यह अनुवाद उसके आशय को स्पष्ट करता है, पर अधिक औपचारिक रूप को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα
  choice: कुत्ता अपनी ही उलटी के पास लौट जाता है
  rationale: यह नीतिवचन 26:11 की प्रतिध्वनि है। ‘अपनी ही’ ἴδιον पर बल बनाए रखता है और ‘उलटी के पास लौट जाता है’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: Ὗς λουσαμένη
  choice: नहलाई हुई सूअरनी
  rationale: ‘सूअरनी’ यूनानी स्त्रीलिंग संज्ञा का भेद बनाए रखती है। ‘नहलाई हुई’ कृदंत के धुले होने के भाव को बिना यह तय किए व्यक्त करता है कि किसने नहलाया।
- source_word: εἰς κυλισμὸν βορβόρου
  choice: फिर कीचड़ में लोटने लगती है
  rationale: κυλισμός लोटने और βόρβορος कीचड़ अथवा दलदली गंदगी का चित्र देते हैं। ‘फिर’ लौटने के निहित भाव को सहज हिंदी में सामने लाता है।
theological_decisions:
- issue: संक्षिप्त कहावती उद्धरण का बल
  choice: कहावत में कही बात झूठे शिक्षकों पर चरितार्थ हुई है
  alternative: सच्ची कहावत की बात उनके साथ घटित हुई है
  rationale: पद उनके पतन को कहावत के चित्रों द्वारा बताता है; अनुवाद इससे आगे बढ़कर उनके आत्मिक इतिहास या उद्धार की दशा के विषय में कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
- issue: दूसरी कहावत में अध्याहृत क्रिया
  choice: फिर कीचड़ में लोटने लगती है
  alternative: नहलाई हुई सूअरनी कीचड़ में लोटने को
  rationale: यूनानी में दूसरी पंक्ति खंडित और क्रियाविहीन है। मुख्य पाठ में स्वाभाविक हिंदी के लिए निहित क्रिया दी गई है, जबकि शाब्दिक संरचना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। घृणास्पद कहावती चित्रों की तीक्ष्णता को नरम नहीं किया गया है। मुख्य पाठ में आवश्यक अध्याहृत क्रियाएँ दी गई हैं और मूल की संक्षिप्तता पाद-टिप्पणी में दिखाई गई है।
