source:
  edition: SBLGNT
  text: οὗτοι δέ, ὡς ἄλογα ζῷα ⸂γεγεννημένα φυσικὰ⸃ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν ⸂καὶ φθαρήσονται⸃,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/012.yaml
  text: But these[a], like irrational animals—creatures of instinct, born for capture and destruction—blaspheming about things they do not understand, will also be destroyed in their destruction[d][c][b],
translation:
  language: hi
  text: पर ये लोग विवेकहीन पशुओं के समान हैं[a]—ऐसे प्राणी जो सहज प्रवृत्ति से संचालित होते हैं[b] और पकड़े जाने और नष्ट होने के लिए जन्मे हैं। जिन बातों को वे नहीं समझते, उनके विषय में निन्दा करते हुए[c], वे भी उनके विनाश में विनष्ट हो जाएंगे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुद्धिहीन पशुओं के समान।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पदबंध का शाब्दिक रूप लगभग “स्वाभाविक रूप से जन्मे” है; आशय ऐसे प्राणियों से है जो तर्क-विवेक के बजाय अपनी सहज प्रवृत्ति या प्रकृति से संचालित होते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “जिन बातों को वे नहीं जानते, उनके विषय में अपमानजनक बातें कहते हुए।”
    reason: lexical_alternative
  - marker: d
    text: यूनानी में एक ही शब्द-मूल से बने “विनाश” और “विनष्ट होना” दोहराए गए हैं। ‘उनके’ का सन्दर्भ व्याख्यात्मक रूप से कठिन है; मूल पाठ इसे अधिक स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄλογα ζῷα
  choice: विवेकहीन पशु
  rationale: ἄλογα यहाँ बोल न सकने के बजाय तर्क-विवेक से रहित होने का भाव देता है। ‘विवेकहीन पशु’ आधुनिक हिन्दी में स्पष्ट है और नैतिक विवेक के अभाव को बनाए रखता है।
- source_word: γεγεννημένα φυσικὰ
  choice: ऐसे प्राणी, जो केवल सहज प्रवृत्ति से चलते हैं
  rationale: यूनानी पदबंध अत्यन्त संक्षिप्त है और शाब्दिक ‘स्वाभाविक जन्मे’ हिन्दी में अस्पष्ट होगा। यह अनुवाद φυσικά में निहित प्राकृतिक या सहज प्रेरणा से संचालित होने का भाव व्यक्त करता है; जन्म का बिम्ब अगले पदबंध ‘जन्मे हैं’ में सुरक्षित है।
- source_word: εἰς ἅλωσιν καὶ φθοράν
  choice: पकड़े जाने और नष्ट होने के लिए जन्मे हैं
  rationale: εἰς उद्देश्य अथवा परिणति का भाव दे सकता है। ἅλωσις का अर्थ पकड़ा जाना और φθορά का अर्थ यहाँ विनाश है; पशुओं के रूपक में दोनों को स्वाभाविक हिन्दी में रखा गया है।
- source_word: ἐν οἷς ἀγνοοῦσιν
  choice: जिन बातों को वे नहीं समझते
  rationale: नपुंसकलिंग बहुवचन सम्बन्धवाचक सर्वनाम सम्भवतः व्यक्तियों के बजाय विषयों या बातों की ओर संकेत करता है। ‘नहीं समझते’ अज्ञान के प्रसंगानुकूल भाव को व्यक्त करता है।
- source_word: βλασφημοῦντες
  choice: उनकी निन्दा करते हुए
  rationale: βλασφημέω निन्दात्मक, अपमानजनक या ईशनिन्दापूर्ण वाणी को सूचित कर सकता है। वस्तु को पवित्र विषय मानकर पहले से निश्चित किए बिना ‘निन्दा’ इसकी कठोरता और व्यापकता बनाए रखती है।
- source_word: ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται
  choice: वे भी उसी विनाश में विनष्ट हो जाएंगे
  rationale: φθορά और φθαρήσονται एक ही शब्द-मूल को दोहराते हैं। ‘विनाश/विनष्ट’ इस शब्द-क्रीड़ा को बनाए रखते हैं, जबकि ‘उसी’ पशुओं के लिए बताए गए विनाश से सम्बन्ध जोड़ता है और αὐτῶν के सम्भावित सन्दर्भ को अनावश्यक रूप से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: βλασφημοῦντες का प्रसंगगत अर्थ
  choice: ‘निन्दा करते हुए’ रखा गया है।
  alternative: ‘ईशनिन्दा करते हुए’ या ‘बुरा-भला कहते हुए’
  rationale: ‘ईशनिन्दा’ कथन की वस्तु को धार्मिक रूप से अधिक निश्चित कर देती, जबकि यूनानी यहाँ उसे स्पष्ट नहीं करता; ‘बुरा-भला कहना’ शब्द की तीव्रता घटा सकता है। ‘निन्दा’ दोनों सीमाओं से बचती है।
- issue: φθορά / φθαρήσονται का अर्थ
  choice: विनाश से सम्बन्धित भाषा और दोहराव रखा गया है।
  alternative: नैतिक ‘भ्रष्टता’ या सामान्य ‘बरबादी’
  rationale: पकड़े और नष्ट किए जाने वाले पशुओं का निकटवर्ती बिम्ब दण्डात्मक विनाश की ओर संकेत करता है। फिर भी अनुवाद विनाश की प्रकृति के विषय में कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: αὐτῶν का सन्दर्भ
  choice: ‘उसी विनाश में’ के द्वारा पशु-रूपक से सम्बन्ध रखा गया है, बिना स्वामित्व को अत्यधिक स्पष्ट किए।
  alternative: ‘अपने ही विनाश में’ या ‘उन पशुओं के विनाश में’
  rationale: यूनानी सर्वनाम का सन्दर्भ व्याख्यात्मक कठिनाई रखता है। ‘अपने ही’ उसे झूठे शिक्षकों तक सीमित करता और ‘उन पशुओं के’ उसे पशुओं तक; ‘उसी विनाश में’ तुलनात्मक सम्बन्ध बनाए रखते हुए तनाव को खुला छोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में पशु-रूपक की तीक्ष्णता बनी रहती है, पर अनावश्यक धार्मिक पारिभाषिकता नहीं जोड़ी गई। ‘सहज प्रवृत्ति’, ‘निन्दा’ और ‘विनाश/विनष्ट’ स्रोत की अर्थ-सीमा तथा शब्द-क्रीड़ा को स्वाभाविक हिन्दी में संतुलित करते हैं।
