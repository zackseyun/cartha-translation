id: 2PE.2.6
reference: 2 Peter 2:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας ⸀καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ⸀ἀσεβέσιν τεθεικώς,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/006.yaml
  text: and if by reducing the cities of Sodom and Gomorrah to ashes he condemned them to destruction[a], having made them an example for those who would be ungodly[b],
translation:
  language: hi
  text: और यदि उसने सदोम और गमोरा के नगरों को राख में बदलकर[a] उन्हें विनाश का दण्ड दिया और उन्हें उन लोगों के लिए एक उदाहरण ठहराया जो भविष्य में भक्तिहीन होंगे[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें राख कर दिया।”
    reason: τεφρώσας के लिए अधिक संक्षिप्त, शाब्दिक वैकल्पिक अभिव्यक्ति।
  - marker: b
    text: या, “उन्हें भविष्य के भक्तिहीन लोगों के लिए एक उदाहरण ठहराया।”
    reason: μελλόντων ἀσεβέσιν की संक्षिप्त संज्ञात्मक वैकल्पिक अभिव्यक्ति।
lexical_decisions:
- source_word: τεφρώσας
  choice: राख कर
  rationale: यह क्रिया केवल जलाने नहीं, बल्कि राख में बदल देने के परिणाम को व्यक्त करती है; संक्षिप्त हिन्दी वाक्यांश साधन और परिणाम दोनों बताता है।
- source_word: καταστροφῇ
  choice: विनाश का दण्ड
  rationale: करण/सम्प्रदान कारक यहाँ κατέκρινεν के साथ दण्ड के परिणाम या विषय को व्यक्त करता है; हिन्दी में यह न्यायिक अर्थ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: κατέκρινεν
  choice: दण्ड दिया
  rationale: क्रिया न्यायिक दोषनिर्णय और दण्डादेश का भाव रखती है; इस प्रसंग में 'दण्ड दिया' सामान्य पाठक के लिए स्वाभाविक है।
- source_word: ὑπόδειγμα
  choice: एक उदाहरण
  rationale: शब्द का अर्थ उदाहरण या नमूना हो सकता है; न्याय के प्रसंग से चेतावनी का भाव स्वतः मिलता है, इसलिए उसे मुख्य पाठ में अतिरिक्त रूप से नहीं जोड़ा गया।
- source_word: μελλόντων ἀσεβέσιν
  choice: उन लोगों के लिए जो आगे चलकर भक्तिहीन होंगे
  rationale: μελλόντων भविष्य-सापेक्षता और ἀσεβέσιν भक्तिहीन व्यक्तियों को सूचित करता है; यह अनुवाद दोनों तत्वों को बिना जीवन-व्यवहार की अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: τεθεικώς
  choice: ठहराया
  rationale: पूर्णकालिक कृदन्त किसी वस्तु को एक स्थायी उदाहरण के रूप में स्थापित किए जाने का परिणाम व्यक्त करता है।
- source_word: πόλεις Σοδόμων καὶ Γομόρρας
  choice: सदोम और अमोरा के नगरों
  rationale: सम्बन्धकारक संरचना और बहुवचन 'नगरों' को बनाए रखते हुए हिन्दी में प्रचलित बाइबलीय नाम-रूप अपनाए गए हैं।
theological_decisions:
- issue: सन्दर्भ से निहित कर्ता
  choice: उसने
  alternative: परमेश्वर ने / प्रभु ने
  rationale: यूनानी खण्ड में कर्ता पिछले प्रसंग से समझा जाता है। सर्वनाम रखना प्रवाह बनाए रखता है और इस खण्ड में अनुपस्थित कोई उपाधि नहीं जोड़ता।
- issue: ἀσεβέσιν का आशय
  choice: भक्तिहीन होंगे
  alternative: भक्तिहीन जीवन जिएँगे / भविष्य के भक्तिहीन लोग
  rationale: मूल शब्द व्यक्तियों की भक्तिहीनता बताता है; चयनित रूप नैतिक-धार्मिक अर्थ और भविष्य-सापेक्षता को सीधे रखता है, बिना उसे केवल आचरण तक सीमित किए।
- issue: ὑπόδειγμα की चेतावनी-सूचक शक्ति
  choice: उदाहरण
  alternative: चेतावनी देने वाला उदाहरण
  rationale: न्याय का प्रसंग उदाहरण को चेतावनी का स्वर देता है, पर मूल संज्ञा में 'चेतावनी' अलग से नहीं है; इसलिए तनाव को बिना विस्तार के सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। पद पिछले वाक्य से जुड़ी शर्त का भाग है, इसलिए आरम्भ में 'और यदि' तथा अन्त में अल्पविराम रखा गया है। 'भक्तिहीन' धार्मिक अनादर और अधर्म के संयुक्त भाव को साधारण पाठक के लिए संक्षेप में व्यक्त करता है।
