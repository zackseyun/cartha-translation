  text: ⸀ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ⸀ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/013.yaml
  text: suffering the wages of unrighteousness[a], considering daytime indulgence a pleasure. They are stains and blemishes, reveling in their deceptions while feasting with you[b],
translation:
  language: hi
  text: अधर्म की मज़दूरी के रूप में कष्ट उठाते हुए[a], वे दिन के समय भोग-विलास को सुख मानते हैं। वे दाग और दोष हैं; तुम्हारे साथ भोज करते हुए, वे अपने छल-कपट[b] में विलास करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधर्म का प्रतिफल पाते हुए।”
    reason: lexical_alternative
  - marker: b
    text: 'कुछ पांडुलिपियों में “अपने छल-कपट में” के स्थान पर “अपने प्रेम-भोजों में” है: “वे तुम्हारे साथ भोज करते हुए अपने प्रेम-भोजों में विलास करते हैं।”'
    reason: textual_variant
lexical_decisions:
- source_word: ἀδικούμενοι
  choice: हानि उठाते हुए
  rationale: यह कर्मवाच्य कृदंत यहाँ उनके किए हुए अधर्म के दंड या हानिकारक प्रतिफल को व्यक्त करता है। यह अनुवाद केवल दूसरों द्वारा अन्याय किए जाने का अर्थ थोपने के बजाय संदर्भगत प्रतिदान का भाव रखता है।
- source_word: μισθὸν ἀδικίας
  choice: अपने अधर्म की मज़दूरी के रूप में
  rationale: ‘मज़दूरी’ μισθός के प्रतिफल-वाचक रूपक को बनाए रखती है, और ‘अधर्म’ ἀδικία की नैतिक गंभीरता व्यक्त करता है। ‘अपने’ संदर्भ से स्पष्ट कर्ताओं और उनके कर्म के संबंध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: ἡδονὴν ἡγούμενοι
  choice: सुख मानते हैं
  rationale: यह ἡγέομαι की ‘समझना/मानना’ और ἡδονή की ‘सुख’ वाली अर्थ-रचना को संक्षिप्त, स्वाभाविक हिन्दी में रखता है।
- source_word: τὴν ἐν ἡμέρᾳ τρυφήν
  choice: दिन के समय भोग-विलास करने को
  rationale: ‘दिन के समय’ मूल काल-सूचक वाक्यांश को स्पष्ट रखता है; ‘भोग-विलास’ τρυφή के आत्मलिप्त ऐश्वर्य और मौज का भाव व्यक्त करता है, बिना ‘दिन-दहाड़े’ की अतिरिक्त व्याख्यात्मक तीव्रता जोड़े।
- source_word: σπίλοι καὶ μῶμοι
  choice: दाग और कलंक
  rationale: यह युग्म नैतिक अशुद्धि और निंदनीय दोष की संयुक्त छवि को आधुनिक, बोधगम्य हिन्दी में बनाए रखता है।
- source_word: ἐντρυφῶντες
  choice: मौज करते हैं
  rationale: यह कृदंत आत्मतुष्ट, विलासी आनंद लेने का भाव देता है और ‘भोज करते हुए’ के साथ स्वाभाविक बैठता है।
- source_word: ἀπάταις αὐτῶν
  choice: अपने छल-कपट में
  rationale: SBLGNT के ἀπάταις पाठ के अनुसार यह उनके धोखे और कपट को बहुव्यंजक हिन्दी पद में व्यक्त करता है।
- source_word: συνευωχούμενοι ὑμῖν
  choice: तुम्हारे साथ भोज करते हुए
  rationale: यह साथ मिलकर भोजन या दावत करने के अर्थ और समकालिक कृदंत-भाव दोनों को सुरक्षित रखता है, पर भोजन के प्रकार को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: ἀπάταις / ἀγάπαις का पाठांतर
  choice: मुख्य पाठ में ἀπάταις को ‘अपने छल-कपट में’ अनूदित किया गया है।
  alternative: 'ἀγάπαις: ‘अपने प्रेम-भोजों में’'
  rationale: दिए गए SBLGNT पाठ में ἀπάταις है और यह झूठे शिक्षकों के छल के प्रसंग से मेल खाता है। अर्थपूर्ण वैकल्पिक पाठ ἀγάπαις को पाठक के लिए पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἀδικούμενοι μισθὸν ἀδικίας में प्रतिदान और अन्याय की शब्द-क्रीड़ा
  choice: ‘अपने अधर्म की मज़दूरी के रूप में हानि उठाते हुए’
  alternative: ‘गलत काम का प्रतिफल पाते हुए’ अथवा अधिक शाब्दिक ‘अन्याय की मज़दूरी के रूप में अन्याय सहते हुए’
  rationale: चुना गया रूप उनके अधर्म के दंडस्वरूप हानि पाने का संदर्भगत अर्थ व्यक्त करता है और μισθός के मज़दूरी-रूपक को रखता है; अत्यधिक शाब्दिक पुनरुक्ति हिन्दी में भ्रामक लग सकती थी।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, स्वर गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखा गया है। ‘भोग-विलास’, ‘दाग और कलंक’ तथा ‘छल-कपट’ नैतिक तीव्रता बनाए रखते हैं। पद मूल यूनानी की कृदंत-प्रधान रचना के कारण आरंभ में पिछले संदर्भ से जुड़ा हुआ है; आगे के स्वतंत्र वाक्यों से हिन्दी प्रवाह स्पष्ट किया गया है।
