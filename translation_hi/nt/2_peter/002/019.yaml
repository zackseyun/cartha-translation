  text: promising them freedom while they themselves are servants of corruption[a]; for whatever a person is overcome by[b], by this he is also enslaved.
translation:
  language: hi
  text: वे उन्हें स्वतंत्रता का वादा करते हैं, जबकि वे स्वयं भ्रष्टता के दास हैं; क्योंकि जिसके वश में कोई हो जाता है, उसी का वह दास भी बन जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλευθερίαν
  choice: स्वतंत्रता
  rationale: यह आधुनिक मानक हिन्दी में स्वाभाविक है और आगे आने वाली दासता के साथ तीखा विरोध बनाए रखता है।
- source_word: ἐπαγγελλόμενοι
  choice: देने का वादा करते हैं
  rationale: यूनानी कृदंत स्पष्ट रूप से प्रतिज्ञा करने का भाव रखता है; हिन्दी में यह अभिव्यक्ति स्वतंत्रता को दूसरों के लिए प्रस्तावित लाभ के रूप में स्वाभाविक ढंग से व्यक्त करती है।
- source_word: δοῦλοι
  choice: दास
  rationale: यहाँ स्वतंत्रता और बँधी हुई अवस्था का विरोध केंद्रीय है; इसलिए अपेक्षाकृत हल्का शब्द ‘सेवक’ उपयुक्त नहीं है।
- source_word: ὑπάρχοντες
  choice: जबकि वे स्वयं ... हैं
  rationale: यह वादा करते समय उनकी वास्तविक अवस्था का विरोधाभास स्पष्ट करता है।
- source_word: φθορᾶς
  choice: विनाशकारी भ्रष्टता
  rationale: φθορά में नैतिक भ्रष्टता के साथ क्षय और विनाश का भाव भी संभव है; संयुक्त अभिव्यक्ति दोनों पहलुओं को बिना किसी एक तक सीमित किए सँभालती है।
- source_word: ᾧ γάρ τις ἥττηται
  choice: क्योंकि जो किसी पर हावी हो जाता है
  rationale: यह सामान्य सिद्धांत को सहज हिन्दी में व्यक्त करता है और निष्क्रिय क्रिया के पराजित अथवा वश में किए जाने के भाव को संबंधवाचक रचना से सुरक्षित रखता है।
- source_word: τούτῳ καὶ δεδούλωται
  choice: उसी का वह दास भी बन चुका है
  rationale: पूर्ण निष्क्रिय रूप ऐसी दासता बताता है जो घटित होकर वर्तमान अवस्था बनी हुई है; ‘बन चुका है’ इस परिणामी दशा को व्यक्त करता है।
- source_word: τις
  choice: किसी
  rationale: अनिश्चित सर्वनाम को हिन्दी में स्वाभाविक, सामान्य और लिंग-निरपेक्ष ढंग से व्यक्त करता है।
theological_decisions:
- issue: स्वतंत्रता के झूठे वादे के विपरीत δοῦλοι/δεδούλωται का अनुवाद
  choice: ‘दास’ और ‘दास बन चुका है’
  alternative: ‘सेवक’ और ‘अधीन हो गया है’
  rationale: मूल पाठ की विडंबना और पूरी तरह वश में होने का बल बनाए रखने के लिए दासता की प्रत्यक्ष शब्दावली आवश्यक है।
- issue: φθορά के नैतिक और विनाशकारी आयाम
  choice: ‘विनाशकारी भ्रष्टता’
  alternative: केवल ‘भ्रष्टता’, ‘विनाश’ या ‘क्षय’
  rationale: इस संदर्भ में शब्द नैतिक बिगाड़ और उसके विनाशकारी स्वरूप दोनों की ओर संकेत कर सकता है; किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु साधारण पाठक के लिए स्पष्ट। वाक्य में ‘स्वतंत्रता’ और ‘दास’ का स्पष्ट विरोध तथा अंतिम सामान्य उक्ति का संक्षिप्त, स्मरणीय रूप सुरक्षित रखा गया है।
