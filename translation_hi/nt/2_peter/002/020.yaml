id: 2PE.2.20
reference: 2 Peter 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ ⸀κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/020.yaml
  text: For if[a], after escaping the defilements of the world through the knowledge of the Lord and Savior Jesus the Messiah, they are again entangled in these things and overcome[b], the last state has become worse for them than the first.
translation:
  language: hi
  text: क्योंकि यदि वे प्रभु और उद्धारकर्ता यीशु मसीह के ज्ञान के द्वारा संसार की अशुद्धियों से बच निकलने के बाद फिर उन्हीं में उलझकर उनके वश में हो जाते हैं, तो उनकी बाद की दशा पहली से भी बदतर हो गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποφυγόντες
  choice: बच निकलने के बाद
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई दिखाता है; यह वाक्यांश उस कालगत संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: μιάσματα
  choice: अशुद्धताओं
  rationale: यह शब्द नैतिक रूप से दूषित करने वाली चीज़ों को दर्शाता है; ‘अशुद्धताओं’ में अपवित्रता और दूषण दोनों का भाव बना रहता है।
- source_word: ἐν ἐπιγνώσει
  choice: ज्ञान के द्वारा
  rationale: यहाँ ἐν साधन या माध्यम का भाव दे सकता है। ‘ज्ञान’ ἐπίγνωσις का अर्थ रखता है, पर यह तय नहीं करता कि यह उद्धारकारी ज्ञान है या किसी अन्य प्रकार की वास्तविक पहचान।
- source_word: κυρίου καὶ σωτῆρος
  choice: प्रभु और उद्धारकर्ता
  rationale: दोनों पद यीशु के लिए प्रयुक्त उपाधियों के रूप में सीधे और प्रचलित ढंग से अनूदित हैं।
- source_word: Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह
  rationale: मसीह आधुनिक हिन्दी बाइबलीय प्रयोग में Χριστός की उपाधिगत शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τούτοις δὲ πάλιν ἐμπλακέντες
  choice: फिर उन्हीं में उलझकर
  rationale: ‘उन्हीं’ का संकेत पहले कही गई संसार की अशुद्धताओं की ओर है; ‘उलझकर’ दोबारा फँसने की छवि बनाए रखता है।
- source_word: ἡττῶνται
  choice: उनके वश में हो जाते हैं
  rationale: क्रिया पराजित या अधीन हो जाने का भाव देती है। यह हिन्दी में नैतिक-आध्यात्मिक अधीनता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὰ ἔσχατα χείρονα τῶν πρώτων
  choice: उनकी बाद की दशा पहली से भी बदतर
  rationale: यह मुहावरा बाद या अंतिम अवस्था की तुलना पहली अवस्था से करता है; ‘दशा’ आवश्यक निहित संज्ञा को स्वाभाविक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: ἐπίγνωσις के ज्ञान का स्वरूप और धर्मत्याग से उसका संबंध
  choice: केवल ‘ज्ञान’ कहा गया है, बिना यह निर्धारित किए कि वह उद्धारकारी पुनर्जन्म का ज्ञान है या वास्तविक किन्तु बाहरी परिचय।
  alternative: ‘पूर्ण ज्ञान’, ‘उद्धारकारी ज्ञान’ या ‘केवल बाहरी ज्ञान’
  rationale: यूनानी शब्द अपने आप इस विवादित धर्मवैज्ञानिक प्रश्न का निर्णय नहीं करता; तटस्थ अनुवाद पाठ की वास्तविक तनावपूर्ण अस्पष्टता को बनाए रखता है।
- issue: Χριστοῦ का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त या क्राइस्ट
  rationale: यहाँ शब्द यीशु की उपाधि के रूप में सुनाई देता है; ‘मसीह’ मानक, अर्थपूर्ण और स्वाभाविक हिन्दी रूप है।
- issue: ‘उनके वश में’ का संदर्भ
  choice: सर्वनाम को संसार की अशुद्धताओं की ओर लौटने दिया गया है।
  alternative: शैतान, पाप या किसी विशिष्ट शक्ति को स्पष्ट रूप से जोड़ना
  rationale: यूनानी पाठ का निकटतम संदर्भ τούτοις द्वारा उन्हीं अशुद्धताओं की ओर संकेत करता है; अतिरिक्त कारक जोड़ना व्याख्यात्मक विस्तार होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की शर्तीय संरचना और परिणामस्वरूप बनी दशा को सुरक्षित रखा गया है; अनावश्यक धर्मवैज्ञानिक स्पष्टीकरण नहीं जोड़ा गया।
