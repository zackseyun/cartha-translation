source:
  edition: SBLGNT
  text: ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/016.yaml
  text: 'But he received a rebuke for his own transgression: a mute beast of burden[a], speaking with a human voice[b], restrained the prophet’s madness.'
translation:
  language: hi
  text: 'परन्तु उसे अपने ही अपराध के लिए फटकार मिली: एक मूक बोझ ढोनेवाले पशु ने[a] मनुष्य की आवाज़ में बोलकर[b] उस भविष्यद्वक्ता के पागलपन को रोक दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘बोझ ढोनेवाला पशु’; संकेत बिलाम की गदही की ओर है (गिनती 22:28–30)।
    reason: cross_reference
  - marker: b
    text: या, ‘मानवीय आवाज़ में।’ यूनानी वाक्यांश पशु की वाणी का मानवीय होना दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγξιν
  choice: फटकार
  rationale: यह संज्ञा दोष प्रकट करनेवाली कड़ी ताड़ना या फटकार को दर्शाती है; प्रसंग में ‘फटकार’ स्वाभाविक और स्पष्ट है।
- source_word: ἰδίας παρανομίας
  choice: अपने ही अपराध के लिए
  rationale: ἰδίας व्यक्तिगत उत्तरदायित्व पर बल देता है, और παρανομία नियम-विरुद्ध आचरण को; ‘अपराध’ आधुनिक हिन्दी में इस नैतिक उल्लंघन को सहज रूप से व्यक्त करता है।
- source_word: ὑποζύγιον ἄφωνον
  choice: एक गूँगा बोझ ढोनेवाला पशु
  rationale: ὑποζύγιον सामान्य रूप से बोझ उठानेवाले पशु को कहता है, जबकि ἄφωνον उसकी बोलने में असमर्थता को रेखांकित करता है। मुख्य पाठ में ‘गधा’ कहकर मूल से अधिक विशिष्टता नहीं जोड़ी गई।
- source_word: ἐν ἀνθρώπου φωνῇ
  choice: मनुष्य की आवाज़ में
  rationale: यह पशु की आवाज़ और मानवीय वाणी के बीच विरोध दर्शाता है; यहाँ ἄνθρωπος का आशय किसी पुरुष विशेष से नहीं, मनुष्य से है।
- source_word: φθεγξάμενον
  choice: बोलकर
  rationale: कृदन्त स्पष्ट, सार्थक वाणी के उच्चारण को बताता है; ‘बोलकर’ हिन्दी वाक्य में स्वाभाविक है।
- source_word: ἐκώλυσεν
  choice: रोक दिया
  rationale: κωλύω बाधा देने या रोकने का अर्थ रखता है; यहाँ पशु की वाणी ने भविष्यद्वक्ता की उन्मत्त चाल को थामा।
- source_word: παραφρονίαν
  choice: पागलपन
  rationale: यह शब्द साधारण मूर्खता से अधिक तीव्र, विवेकहीन उन्माद को व्यक्त करता है; ‘पागलपन’ उसी प्रबलता को बनाए रखता है।
- source_word: τοῦ προφήτου
  choice: उस भविष्यद्वक्ता के
  rationale: निश्चित पद उस ज्ञात भविष्यद्वक्ता, अर्थात् प्रसंगतः बिलाम, की ओर संकेत करता है; अनुवाद यूनानी पाठ की उपाधि को बनाए रखता है।
theological_decisions:
- issue: ὑποζύγιον को पुराने नियम की पृष्ठभूमि के आधार पर सीधे ‘गधा/गदही’ कहना
  choice: मुख्य पाठ में व्यापक पद ‘बोझ ढोनेवाला पशु’ रखा गया
  alternative: गदही
  rationale: गिनती 22 में पशु बिलाम की गदही है, पर यहाँ यूनानी लेखक ने अधिक सामान्य संज्ञा ὑποζύγιον प्रयुक्त की है। मूल-पाठ की व्यापकता मुख्य पाठ में रखी गई और विशिष्ट पहचान पादटिप्पणी में दी गई।
- issue: ἐν ἀνθρώπου φωνῇ में ἀνθρώπου का लिंग-संबंधी अर्थ
  choice: ‘मनुष्य की आवाज़ में’
  alternative: ‘पुरुष की आवाज़ में’
  rationale: यहाँ विरोध पशु और मनुष्य के बीच है, स्त्री और पुरुष के बीच नहीं; इसलिए ‘मनुष्य’ स्रोत के आशय को ठीक व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘बोझ ढोनेवाला पशु’ स्रोत की सामान्य संज्ञा को बचाता है; ‘गूँगा’ और ‘पागलपन’ मूल के विडंबनापूर्ण तथा तीव्र प्रभाव को बनाए रखते हैं।
