id: 2PE.2.1
reference: 2 Peter 2:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/001.yaml
  text: But false prophets also arose among the people[a], just as there will also be false teachers among you, who will secretly bring in destructive heresies, even denying the Master who bought them[b], bringing swift destruction on themselves.
translation:
  language: hi
  text: पर लोगों में झूठे भविष्यद्वक्ता भी उठ खड़े हुए थे, वैसे ही तुम्हारे बीच भी झूठे शिक्षक होंगे, जो चुपके से विनाशकारी मतों को ले आएँगे और उस स्वामी को नकारेंगे जिसने उन्हें मोल लिया था। इस प्रकार वे अपने ही ऊपर शीघ्र विनाश ले आएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγένοντο
  choice: उठ खड़े हुए थे
  rationale: यह भूतकाल में लोगों के बीच झूठे भविष्यद्वक्ताओं के प्रकट होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ψευδοπροφῆται
  choice: झूठे भविष्यद्वक्ता
  rationale: यूनानी संयुक्त संज्ञा का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: ἐν τῷ λαῷ
  choice: लोगों में
  rationale: मूल में केवल ‘लोगों/प्रजा’ कहा गया है; सन्दर्भ में इस्राएल निहित हो सकता है, पर मुख्य पाठ उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: ψευδοδιδάσκαλοι
  choice: झूठे शिक्षक
  rationale: ‘झूठे भविष्यद्वक्ता’ के साथ समानान्तरता रखते हुए संज्ञा का सीधा अनुवाद।
- source_word: παρεισάξουσιν
  choice: चुपके से ... ले आएँगे
  rationale: क्रिया में गुप्त या छलपूर्वक भीतर लाने का भाव है, जिसे सहज आधुनिक हिन्दी में सुरक्षित रखा गया है।
- source_word: αἱρέσεις ἀπωλείας
  choice: विनाशकारी मत
  rationale: यह ऐसे विचारों या शिक्षाओं को दर्शाता है जो विनाश की ओर ले जाते हैं; ‘मत’ साधारण हिन्दी में बोधगम्य है, जबकि वैकल्पिक सामाजिक अर्थ फुटनोट में रखा गया है।
- source_word: δεσπότην
  choice: स्वामी
  rationale: δεσπότης के अधिकार और स्वामित्व के भाव को व्यक्त करता है तथा κύριος से सम्भव शब्दगत भेद बनाए रखता है।
- source_word: ἀγοράσαντα αὐτοὺς
  choice: जिसने उन्हें मोल लिया था
  rationale: मूल के खरीदने के रूपक को बनाए रखता है और उसे ‘छुड़ाया’ जैसे अधिक व्याख्यात्मक धर्मवैज्ञानिक शब्द से प्रतिस्थापित नहीं करता।
- source_word: ἀρνούμενοι
  choice: नकार देंगे
  rationale: स्वामी को अस्वीकार करने या उससे मुकरने की गंभीरता का सीधा और स्वाभाविक अनुवाद।
- source_word: ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν
  choice: अपने ऊपर शीघ्र विनाश ले आएँगे
  rationale: आत्मवाचक बल, परिणाम और विनाश के शीघ्र आने—तीनों को सुरक्षित रखता है।
theological_decisions:
- issue: इस प्रसंग में αἱρέσεις का अर्थ
  choice: विनाशकारी मत
  alternative: विनाशकारी गुट या पंथ
  rationale: गुप्त रूप से भीतर लाने और स्वामी को नकारने का निकट सन्दर्भ शिक्षागत विचलन को प्रमुख बनाता है, पर यूनानी शब्द का गुट या पंथ वाला अर्थ भी सम्भव है और फुटनोट में सुरक्षित है।
- issue: τὸν ἀγοράσαντα αὐτοὺς δεσπότην का बल
  choice: उस स्वामी ... जिसने उन्हें मोल लिया था
  alternative: उस प्रभु को जिसने उन्हें छुड़ाया था
  rationale: अनुवाद मूल के खरीदने के रूपक और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है; यह खरीद के विस्तार या स्वरूप पर चलने वाली बहस को पाठ में हल नहीं करता।
- issue: δεσπότης को κύριος से अलग प्रस्तुत करना
  choice: स्वामी
  alternative: प्रभु या सर्वाधिपति
  rationale: ‘स्वामी’ अधिकार और स्वामित्व का भाव देता है और अलग यूनानी उपाधि को सामान्यतः ‘प्रभु’ कहे जाने वाले κύριος में विलीन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। वाक्य को पठनीयता के लिए तीन वाक्यों में बाँटा गया, किन्तु मूल के तुलना, गुप्त प्रवेश, स्वामी के निषेध और आत्म-विनाश के तार्किक क्रम को बनाए रखा गया है।
