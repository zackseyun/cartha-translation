id: 2PE.2.15
reference: 2 Peter 2:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀καταλιπόντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ ⸀Βοσὸρ ὃς μισθὸν ἀδικίας ἠγάπησεν
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/015.yaml
  text: Having abandoned the straight way[a], they went astray, having followed the way of Balaam son of Bosor[b], who loved the wages of unrighteousness.
translation:
  language: hi
  text: सीधे मार्ग को छोड़कर वे भटक गए और बोसोर के पुत्र बिलाम के मार्ग पर चल पड़े। बिलाम ने अधर्म की कमाई से प्रेम किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλιπόντες
  choice: छोड़कर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुए मार्ग-त्याग को व्यक्त करता है; ‘छोड़कर’ आधुनिक हिन्दी में स्वाभाविक है और जानबूझकर अलग होने का भाव रखता है।
- source_word: εὐθεῖαν ὁδὸν
  choice: सीधे मार्ग
  rationale: यह यूनानी के ठोस मार्ग-रूपक को सुरक्षित रखता है; ‘सही मार्ग’ की अपेक्षा ‘सीधा मार्ग’ मूल अभिव्यक्ति के अधिक निकट है।
- source_word: ἐπλανήθησαν
  choice: वे भटक गए
  rationale: यह नैतिक और आत्मिक पथभ्रष्टता का स्वाभाविक हिन्दी रूप है तथा किसी अनुल्लिखित बाहरी कर्ता को नहीं जोड़ता।
- source_word: ἐξακολουθήσαντες
  choice: चल पड़े
  rationale: संदर्भ में किसी के मार्ग का अनुसरण करने को स्वाभाविक हिन्दी में व्यक्त करता है; संयोजन कृदंत के मुख्य क्रिया से निकट संबंध को बनाए रखता है।
- source_word: τῇ ὁδῷ
  choice: के मार्ग पर
  rationale: पहले आए ὁδός के साथ मार्ग-रूपक की संगति बनाए रखता है।
- source_word: τοῦ Βαλαὰμ
  choice: बिलाम
  rationale: यह पुराने नियम में प्रचलित हिन्दी नामरूप है।
- source_word: τοῦ Βοσὸρ
  choice: बओर के पुत्र
  rationale: वंश-सूचक संबंध को स्पष्ट किया गया है। यद्यपि SBLGNT में Βοσόρ है, उपलब्ध प्राचीन पाठ-साक्ष्य और गिनती 22:5 के परिचित नाम के कारण मुख्य पाठ में ‘बओर’ रखा गया है और यूनानी रूप ‘बोसोर’ को टिप्पणी में बताया गया है।
- source_word: μισθὸν ἀδικίας
  choice: अधर्म की कमाई
  rationale: ‘कमाई’ अनुचित काम के बदले मिलने वाले लाभ का नकारात्मक भाव स्वाभाविक हिन्दी में व्यक्त करती है; ‘अधर्म’ ἀδικία का नैतिक-धार्मिक भार बनाए रखता है।
- source_word: ἠγάπησεν
  choice: से प्रेम किया
  rationale: ἀγαπάω के सीधे और प्रबल भाव को बिना हल्का किए व्यक्त करता है।
theological_decisions:
- issue: εὐθεῖαν ὁδὸν / τῇ ὁδῷ का नैतिक मार्ग-रूपक
  choice: ‘सीधे मार्ग’ और ‘मार्ग पर’ द्वारा रूपक बनाए रखा गया।
  alternative: ‘सही रास्ता’ या ‘सत्य का मार्ग’
  rationale: मूल में उपस्थित मार्ग-चित्र को बचाना उचित है; ‘सत्य का’ जैसी व्याख्या यूनानी में निहित नहीं है।
- issue: Βοσόρ की पहचान और पाठरूप
  choice: मुख्य पाठ में ‘बओर’, टिप्पणी में ‘बोसोर’।
  alternative: मुख्य पाठ में ‘बोसोर’
  rationale: SBLGNT का मुद्रित रूप Βοσόρ है, पर पांडुलिपियों में Βεώρ का मजबूत और प्राचीन समर्थन है तथा पुराने नियम में यही व्यक्ति बओर का पुत्र कहलाता है। पाठगत पारदर्शिता के लिए दोनों रूप सुरक्षित रखे गए हैं।
- issue: ἐξακολουθήσαντες का मुख्य क्रिया से संबंध
  choice: ‘और ... चल पड़े’
  alternative: ‘... पर चलने के कारण भटक गए’
  rationale: कृदंत साधन, परिस्थिति या संबद्ध कार्रवाई सूचित कर सकता है। हिन्दी में संयोजन मूल की इस व्याकरणिक गुंजाइश को अनावश्यक रूप से केवल कारण-साधन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। दोनों बार मार्ग-रूपक रखा गया है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘बिलाम’ और ‘बओर’ अपनाए गए हैं; मुख्य पाठ का [a] टिप्पणी से ठीक मेल खाता है।
