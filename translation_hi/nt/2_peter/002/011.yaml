id: 2PE.2.11
reference: 2 Peter 2:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ ⸀αὐτῶν βλάσφημον κρίσιν.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/011.yaml
  text: whereas angels[a], though greater in might and power[b], do not bring a slanderous judgment against them.
translation:
  language: hi
  text: जबकि स्वर्गदूत बल और सामर्थ्य में कहीं बढ़कर होते हुए भी उनके[b] विरुद्ध निंदापूर्ण[a] निर्णय नहीं सुनाते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपमानजनक निर्णय’ अथवा ‘बदनाम करने वाला निर्णय।’ यूनानी विशेषण निंदात्मक, अपमानजनक या बदनाम करने वाली वाणी का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उनके’ संभवतः पिछले पद के ‘महिमामय प्राणियों’ की ओर संकेत करता है, पर पतरस यहाँ उनकी पहचान और अधिक स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅπου
  choice: जबकि
  rationale: यहाँ ὅπου पिछले पद के कथन के साथ स्थान से अधिक विरोध या तुलना का संबंध व्यक्त करता है; ‘जबकि’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से प्रकट करता है।
- source_word: ἄγγελοι
  choice: स्वर्गदूत
  rationale: संदर्भ में मनुष्य-दूत नहीं, बल्कि स्वर्गीय प्राणी अभिप्रेत हैं।
- source_word: ἰσχύϊ καὶ δυνάμει
  choice: बल और सामर्थ्य में
  rationale: दोनों निकटार्थी शब्दों को अलग रखते हुए यूनानी की बलाघाती युग्म-रचना और संबंधवाचक कारक का भाव सुरक्षित रखा गया है।
- source_word: μείζονες ὄντες
  choice: कहीं बढ़कर होते हुए भी
  rationale: कृदंत का संदर्भगत रियायती भाव (‘होते हुए भी’) प्रकट होता है; ‘कहीं बढ़कर’ तुलना को व्यक्त करता है, पर तुलना के पक्ष को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: οὐ φέρουσιν
  choice: नहीं सुनाते
  rationale: κρίσιν के साथ φέρω यहाँ निर्णय प्रस्तुत करने या घोषित करने के न्यायिक अर्थ में है; हिन्दी में ‘निर्णय सुनाना’ स्वाभाविक है।
- source_word: κατ’ αὐτῶν
  choice: उनके विरुद्ध
  rationale: सर्वनाम का अनिश्चित पूर्वपद ज्यों का त्यों रखा गया है और किसी विशिष्ट समूह की पहचान मुख्य पाठ में नहीं जोड़ी गई।
- source_word: βλάσφημον
  choice: निंदापूर्ण
  rationale: यह विशेषण अपमानजनक, निंदात्मक या बदनाम करने वाली वाणी का बोध करा सकता है; ‘निंदापूर्ण’ धार्मिक और सामान्य दोनों संदर्भों में पर्याप्त व्यापक है।
- source_word: κρίσιν
  choice: निर्णय
  rationale: शब्द न्यायिक आकलन या फैसले को दर्शाता है; ‘निर्णय’ हिन्दी में व्यापक और स्पष्ट समतुल्य है।
theological_decisions:
- issue: αὐτῶν (‘उनके’) का पूर्वपद
  choice: मुख्य पाठ में केवल ‘उनके’ रखकर पहचान खुली छोड़ी गई है।
  alternative: इसे गिरे हुए स्वर्गीय प्राणियों, मानवीय प्रतिष्ठित व्यक्तियों, या पिछले पद के ‘महिमामय प्राणियों’ के रूप में स्पष्ट करना।
  rationale: इस पद में सर्वनाम के पूर्वपद की स्पष्ट पहचान नहीं दी गई। उसे अधिक विशिष्ट बनाना ऐसी धर्मवैज्ञानिक व्याख्या जोड़ देता जिसे यूनानी पाठ स्वयं निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बल और सामर्थ्य’ मूल के दो निकटार्थी शब्दों को सुरक्षित रखता है, और ‘निर्णय सुनाना’ न्यायिक वाक्यांश को स्वाभाविक हिन्दी देता है।
