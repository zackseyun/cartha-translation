  text: βλέμματι γὰρ καὶ ἀκοῇ ⸀ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν—
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/008.yaml
  text: for by what he saw and heard[a], that righteous man, living among them[c][b], was tormenting his righteous soul day after day with their lawless deeds—
translation:
  language: hi
  text: क्योंकि वह धर्मी जन, उनके बीच रहते हुए, जो कुछ वह देखता और सुनता था, उसके कारण दिन-प्रतिदिन उनके व्यवस्था-विरोधी कामों से अपनी धर्मी आत्मा को सताता था—[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में “देखने और सुनने से” और “व्यवस्था-विरोधी कामों से” दोनों पद करण कारक में हैं। इसलिए इन्हें क्रिया से जोड़ने का ठीक ढंग कुछ लचीला है: धर्मी जन जो देखता-सुनता था और उन लोगों के व्यवस्था-विरोधी काम—दोनों उसके भीतर की पीड़ा से संबंधित हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: βλέμματι καὶ ἀκοῇ
  choice: जो कुछ देखता और सुनता था, उससे
  rationale: दोनों करण कारकों को स्वाभाविक हिन्दी में अनुभूत विषय के रूप में व्यक्त किया गया है; इससे देखने और सुनने, दोनों के द्वारा होने वाली पीड़ा बनी रहती है।
- source_word: ὁ δίκαιος
  choice: वह धर्मी जन
  rationale: विशेषण का संज्ञात्मक प्रयोग पिछले पद के लूत की ओर संकेत करता है; ‘जन’ गरिमापूर्ण और सहज है।
- source_word: ἐγκατοικῶν ἐν αὐτοῖς
  choice: उनके बीच रहते हुए
  rationale: वर्तमान कृदन्त उनके बीच निरन्तर निवास करने की परिस्थिति बताता है।
- source_word: ἡμέραν ἐξ ἡμέρας
  choice: दिन-प्रतिदिन
  rationale: यह मुहावरा लगातार दोहराई जाती क्रिया को व्यक्त करता है।
- source_word: ψυχὴν δικαίαν
  choice: अपनी धर्मी आत्मा
  rationale: ‘आत्मा’ यहाँ व्यक्ति के भीतरी जीवन का संकेत करती है; ‘अपनी’ हिन्दी में कर्म का कर्ता से सम्बन्ध स्पष्ट करता है।
- source_word: ἀνόμοις ἔργοις
  choice: उनके व्यवस्था-विरोधी कामों से
  rationale: ἄνομος का विधि अथवा व्यवस्था के विरुद्ध होने वाला नैतिक-वैधानिक भाव रखा गया है; करण कारक कारण या साधन की सम्भावना बनाए रखता है।
- source_word: ἐβασάνιζεν
  choice: यातना देता था
  rationale: अपूर्ण भूतकाल निरन्तर क्रिया दर्शाता है और सक्रिय वाच्य की तीव्रता को ‘व्यथित था’ कहकर हल्का नहीं किया गया।
theological_decisions:
- issue: ψυχή का मानव-स्वरूप सम्बन्धी अर्थ
  choice: ‘आत्मा’ को उसके भीतरी नैतिक जीवन के सामान्य अर्थ में रखा गया है।
  alternative: ‘अपने भीतर के मनुष्य’ या ‘अपने आपको’
  rationale: पद भीतर की नैतिक पीड़ा बताता है, शरीर और आत्मा के सम्बन्ध पर कोई व्यवस्थित सिद्धान्त नहीं देता।
- issue: ἐβασάνιζεν का सक्रिय वाच्य
  choice: ‘अपनी धर्मी आत्मा को यातना देता था’
  alternative: ‘उसकी धर्मी आत्मा यातना पाती थी’ या ‘वह भीतर से अत्यन्त व्यथित होता था’
  rationale: यूनानी पाठ का सक्रिय रूप जानबूझकर सुरक्षित रखा गया है, भले ही हिन्दी में यह असामान्य तनाव उत्पन्न करे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य रूप। ‘धर्मी’ की पुनरावृत्ति मूल पाठ के जोर के अनुसार रखी गई है। मूल वाक्य की अर्थगत अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
