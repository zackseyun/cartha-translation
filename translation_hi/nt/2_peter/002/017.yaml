  text: Οὗτοί εἰσιν πηγαὶ ἄνυδροι ⸂καὶ ὁμίχλαι⸃ ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ ⸀σκότους τετήρηται.
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/017.yaml
  text: These are waterless springs and mists driven by a storm[b][a], for whom the gloom of darkness has been kept.
translation:
  language: hi
  text: ये लोग पानी रहित सोते और तूफ़ान से उड़ाए जाते कोहरे हैं; उनके लिए घोर अंधकार का अँधियारा रख छोड़ा गया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πηγαὶ ἄνυδροι
  choice: पानी रहित सोते
  rationale: πηγή प्राकृतिक सोते या जलस्रोत को दर्शाता है, कुएँ को नहीं; यह अनुवाद उस विडंबना को बनाए रखता है कि जिससे पानी की अपेक्षा है, उसमें पानी नहीं।
- source_word: ὁμίχλαι
  choice: कोहरे
  rationale: ὁμίχλη का अधिक सटीक अर्थ कोहरा या धुंध है। यहाँ बहुवचन रूपक के अनुरूप 'कोहरे' रखा गया है।
- source_word: ὑπὸ λαίλαπος ἐλαυνόμεναι
  choice: आँधी से हाँके जाते
  rationale: λαῖλαψ प्रचंड आँधी या तूफ़ान को और ἐλαύνω किसी वस्तु को हाँकने या बहा ले जाने को व्यक्त करता है; यह पदबंध कर्मवाच्य बल और सजीव चित्र दोनों बनाए रखता है।
- source_word: οἷς
  choice: उनके लिए
  rationale: संबंधवाचक सर्वनाम का आशय रूपकों से नहीं, आरंभ के झूठे शिक्षकों से है; इसलिए व्यक्तिगत संदर्भ स्पष्ट रखा गया है।
- source_word: ὁ ζόφος τοῦ σκότους
  choice: अंधकार की घोर उदासी
  rationale: ζόφος धुँधली, भयावह गहनता और σκότος अंधकार को दर्शाता है। यह चयन दोनों यूनानी पदों को बनाए रखते हुए न्याय की अशुभ छवि व्यक्त करता है।
- source_word: τετήρηται
  choice: रख छोड़ी गई है
  rationale: τηρέω के पूर्ण कर्मवाच्य रूप से प्रकट होता है कि यह दशा सुरक्षित रखी गई और अब भी नियत है; 'रख छोड़ी गई है' उस पूर्णतामूलक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में न्याय का कर्ता
  choice: कर्मवाच्य को बनाए रखते हुए कर्ता को अनकहा रखा गया है।
  alternative: '''परमेश्वर ने उनके लिए रख छोड़ी है'' कहकर कर्ता स्पष्ट करना।'
  rationale: यूनानी पाठ ईश्वरीय न्याय का संकेत देता है, पर कर्ता का नाम नहीं लेता; इसलिए अनुवाद पाठ से आगे कोई धर्मवैज्ञानिक कथन नहीं जोड़ता।
- issue: τοῦ σκότους संबंध का अर्थ
  choice: दो संज्ञाओं वाली तीव्र छवि को 'अंधकार की घोर उदासी' के रूप में रखा गया है।
  alternative: अर्थ को समेटकर 'घोर अंधकार' कहना।
  rationale: स्रोत के ζόφος और σκότος दोनों को प्रतिबिंबित करना उसकी सघन और अशुभ न्याय-भाषा को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। 'सोते' प्राकृतिक जलस्रोत के अर्थ में है; 'कोहरे' स्रोत-पाठ के ὁμίχλαι को 'बादल' की अपेक्षा अधिक ठीक दर्शाता है। मुख्य वाक्य में रूपकों का बहुवचन और अंतिम कर्मवाच्य दोनों सुरक्षित हैं।
