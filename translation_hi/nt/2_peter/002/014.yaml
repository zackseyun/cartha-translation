source:
  edition: SBLGNT
  text: ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ⸀ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/014.yaml
  text: having eyes full of an adulteress and insatiable for sin, enticing unstable souls, having a heart trained in greed, children of a curse,
translation:
  language: hi
  text: उनकी आँखें व्यभिचारिणी से भरी हुई हैं[a] और पाप करने से कभी नहीं रुकतीं[b]; वे अस्थिर लोगों को लुभाते हैं; उनका हृदय लोभ में प्रशिक्षित है; वे शाप की संतानें हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक व्याख्यात्मक रूप में, “व्यभिचार से भरी हुई हैं” अथवा “व्यभिचारी लालसा से भरी हुई हैं।” यूनानी में शाब्दिक रूप से “व्यभिचारिणी से भरी हुई” है—यह एक सजीव और असामान्य अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “पाप करना बंद नहीं कर सकतीं” अथवा “पाप में निरंतर लगी रहती हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μεστοὺς μοιχαλίδος
  choice: व्यभिचारिणी से भरी हैं
  rationale: यूनानी में μοιχαλίδος स्त्रीलिंग एकवचन है, जिसका शाब्दिक अर्थ ‘व्यभिचारिणी’ है। असामान्य किंतु तीखे ठोस बिंब को मुख्य पाठ में रखा गया है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ἀκαταπαύστους ἁμαρτίας
  choice: पाप करने से रुकती नहीं
  rationale: यह पदबंध पाप से न रुकने या पाप करना बंद न कर पाने का भाव देता है। हिन्दी में यह वाक्य आँखों के वर्णन को स्वाभाविक ढंग से आगे बढ़ाता और यूनानी की निरंतरता को सुरक्षित रखता है।
- source_word: δελεάζοντες
  choice: फँसाते हैं
  rationale: क्रिया में चारा देकर लुभाने और जाल में फँसाने का शिकारी भाव है; ‘फँसाते हैं’ आधुनिक हिन्दी में इसे संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: ψυχὰς ἀστηρίκτους
  choice: अस्थिर लोगों को
  rationale: ψυχαί यहाँ संपूर्ण व्यक्तियों के लिए प्रयुक्त है; हिन्दी में ‘लोग’ अधिक स्वाभाविक है। ἀστηρίκτους का आशय ऐसे लोगों से है जो दृढ़ या स्थापित नहीं हैं।
- source_word: καρδίαν γεγυμνασμένην πλεονεξίας
  choice: उनका हृदय लोभ में प्रशिक्षित है
  rationale: γεγυμνασμένην अभ्यास या प्रशिक्षण से तैयार होने का सजीव भाव रखता है। πλεονεξία के लिए ‘लोभ’ सरल, वर्तमान और नैतिक अर्थ में सटीक है।
- source_word: κατάρας τέκνα
  choice: वे शाप की संतान हैं
  rationale: संबंधकारक रचना को बनाए रखकर उन लोगों को शाप से चिह्नित अथवा उसके अधीन बताया गया है; इसे केवल विशेषण ‘शापित’ बनाकर सपाट नहीं किया गया।
- source_word: ἔχοντες ... ἔχοντες
  choice: उनकी आँखें ... उनका हृदय
  rationale: यूनानी के कृदन्तों को शब्दशः दोहराने के बजाय हिन्दी के स्वाभाविक स्वतंत्र उपवाक्यों में बदला गया है, जबकि आरोपों का संचयी क्रम बना रहता है।
theological_decisions:
- issue: μοιχαλίδος के यौन बिंब को व्याख्यात्मक रूप देकर नरम करना या ठोस रूप में रखना
  choice: मुख्य पाठ में ‘व्यभिचारिणी’ का ठोस एकवचन बिंब रखा गया
  alternative: ‘व्यभिचार से भरी’ अथवा ‘व्यभिचारी लालसा से भरी’
  rationale: मूल पाठ का असामान्य और कठोर बिंब वास्तविक है। उसे मुख्य पाठ में सुरक्षित रखते हुए सम्भावित व्याख्याएँ पादटिप्पणी में दी गई हैं।
- issue: ἀκαταπαύστους ἁμαρτίας को अतृप्त लालसा या निरंतर पाप के रूप में व्यक्त करना
  choice: ‘पाप करने से रुकती नहीं’
  alternative: ‘पाप से अतृप्त हैं’ अथवा ‘पाप करना बंद नहीं कर सकतीं’
  rationale: रुकने के अभाव का मूल अर्थ सीधे व्यक्त किया गया है, पर सामर्थ्य-असामर्थ्य का प्रश्न निर्णायक रूप से नहीं जोड़ा गया।
- issue: πλεονεξία का पारंपरिक अथवा सामान्य आधुनिक पद
  choice: लोभ
  alternative: लालच अथवा लोभ-लालसा
  rationale: ‘लोभ’ सामान्य आधुनिक हिन्दी में स्पष्ट है और किसी सांप्रदायिक अर्थभेद को आयात किए बिना मूल दुर्गुण की नैतिक शक्ति बनाए रखता है।
- issue: κατάρας τέκνα की संबंधकारक उपमा
  choice: शाप की संतान
  alternative: शापित लोग अथवा शाप के अधीन लोग
  rationale: मूल की ‘संतान’ वाली सशक्त सामी-जैसी अभिव्यक्ति को बनाए रखा गया है और उसके चरित्रगत तथा न्यायगत तनाव को किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। यूनानी की तीखी निंदा और क्रमिक संचय को छोटे, स्पष्ट वाक्यों में रखा गया है। ‘व्यभिचारिणी’ और ‘शाप की संतान’ जैसे जानबूझकर असामान्य मूल बिंब सुरक्षित हैं; अस्पष्ट या वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
