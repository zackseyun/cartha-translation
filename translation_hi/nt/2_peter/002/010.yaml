source:
  edition: SBLGNT
  text: μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταί, αὐθάδεις, δόξας οὐ τρέμουσιν, βλασφημοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/010.yaml
  text: especially those who go after the flesh in the desire for defilement and despise authority[a]. Bold, self-willed, they do not tremble as they blaspheme glorious ones[d][c][b],
translation:
  language: hi
  text: विशेषकर उन्हें, जो अशुद्धता की लालसा में शरीर के पीछे चलते हैं[a] और अधिकार को तुच्छ जानते हैं[b]। वे दुस्साहसी और मनमाने हैं; महिमावान प्राणियों की निन्दा करते हुए वे काँपते तक नहीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशुद्धता की अभिलाषा में शरीर के पीछे चलते हैं।”
    reason: ἐν ἐπιθυμίᾳ μιασμοῦ की अधिक संज्ञात्मक, निकटवर्ती अभिव्यक्ति; ‘लालसा’ के स्थान पर ‘अभिलाषा’ विकल्प है।
  - marker: b
    text: या, “प्रभुत्व को तुच्छ जानते हैं” या “आधिपत्य को तुच्छ जानते हैं।”
    reason: κυριότης के शासन, प्रभुत्व या आधिपत्य संबंधी अर्थ और उसके अनिर्दिष्ट संदर्भ को सुरक्षित रखता है।
  - marker: c
    text: ‘महिमावान प्राणियों’ से सम्भवतः महिमामय स्वर्गीय प्राणी अभिप्रेत हैं; शायद स्वर्गदूत।
    reason: δόξας की संभावित व्यक्तिगत और स्वर्गीय व्याख्या बताता है, पर मुख्य पाठ में उनकी पहचान निश्चित नहीं करता।
lexical_decisions:
- source_word: μάλιστα
  choice: विशेषकर
  rationale: पिछले पद में बताए गए दण्ड के अंतर्गत इस समूह पर विशेष बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὀπίσω σαρκὸς
  choice: शरीर के पीछे
  rationale: यूनानी मुहावरे और σάρξ की ठोस छवि को बनाए रखता है; संदर्भ इसका नैतिक रूप से दूषित आशय स्पष्ट करता है, पर मुख्य पाठ में इसे ‘पापी स्वभाव’ कहकर अधिक व्याख्यायित नहीं किया गया।
- source_word: ἐν ἐπιθυμίᾳ μιασμοῦ
  choice: अशुद्ध करनेवाली अभिलाषा में
  rationale: μιασμός के अपवित्र या दूषित करने वाले प्रभाव को व्यक्त करता है और अस्वाभाविक ‘अशुद्धता की अभिलाषा’ से बचता है। वैकल्पिक अधिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: πορευομένους
  choice: चलते हैं
  rationale: आचरण के अर्थ वाले यूनानी क्रियात्मक रूप को हिन्दी के परिचित बाइबलीय मुहावरे ‘पीछे चलना’ में स्वाभाविक रूप से व्यक्त करता है।
- source_word: κυριότητος
  choice: प्रभुता
  rationale: ‘अधिकार’ की अपेक्षा मूल संज्ञा के प्रभुत्व या आधिपत्य संबंधी विस्तार और उसके अनिश्चित संदर्भ को अधिक सुरक्षित रखता है।
- source_word: καταφρονοῦντας
  choice: तुच्छ जानते हैं
  rationale: सक्रिय अवमानना का भाव स्पष्ट और सहज आधुनिक हिन्दी में देता है।
- source_word: Τολμηταί
  choice: दुस्साहसी
  rationale: संदर्भ में नकारात्मक निर्भीकता या धृष्टता को केवल ‘साहसी’ से अधिक ठीक व्यक्त करता है।
- source_word: αὐθάδεις
  choice: मनमाने
  rationale: अपनी इच्छा पर अड़े रहने और स्वेच्छाचारी व्यवहार का अर्थ साधारण आधुनिक हिन्दी में देता है।
- source_word: δόξας
  choice: महिमावानों
  rationale: बहुवचन δόξας को व्यक्तियों या सत्ताओं के रूप में ग्रहण करते हुए उनकी पहचान को ‘स्वर्गदूत’ कहकर निश्चित नहीं करता।
- source_word: οὐ τρέμουσιν
  choice: काँपते तक नहीं
  rationale: भय अथवा श्रद्धाभाव की सजीव शारीरिक छवि को बनाए रखता है; ‘तक’ आरोप की तीव्रता को स्वाभाविक हिन्दी में उभारता है।
- source_word: βλασφημοῦντες
  choice: निन्दा करते हुए
  rationale: समकालिक कृदन्त-संबंध को बनाए रखता है और हिन्दी में उन महिमावानों के विरुद्ध अपमानजनक वाणी को स्पष्ट करता है; ‘ईशनिन्दा’ कहने से वस्तु केवल परमेश्वर तक सीमित हो सकती थी।
theological_decisions:
- issue: κυριότητος का संदर्भ
  choice: मुख्य पाठ में ‘प्रभुता’, जिसका विशिष्ट धारक अनिर्दिष्ट है
  alternative: सामान्य अधिकार; प्रभु का प्रभुत्व; स्वर्गदूतीय आधिपत्य
  rationale: यह पद स्पष्ट रूप से नहीं बताता कि प्रभुता मसीह की है, सामान्य शासन-सत्ता की है या किसी स्वर्गीय आधिपत्य की। इसलिए व्यापक संज्ञा रखकर तनाव सुरक्षित रखा गया है।
- issue: δόξας का संदर्भ
  choice: ‘महिमावानों’ के रूप में अनिर्दिष्ट महिमामय व्यक्तित्व
  alternative: स्वर्गदूत; स्वर्गीय प्राणी; अमूर्त महिमाएँ
  rationale: अगला पद स्वर्गदूतों का उल्लेख करता है, जिससे स्वर्गीय प्राणियों का अर्थ संभावित है; फिर भी इस पद का शब्द स्वयं अधिक अस्पष्ट है, इसलिए पहचान पादटिप्पणी में समझाई गई है।
- issue: βλασφημοῦντες का οὐ τρέμουσιν से संबंध
  choice: ‘निन्दा करते हुए वे काँपते तक नहीं’
  alternative: वे उनकी निन्दा करने से नहीं काँपते
  rationale: कृदन्त को समकालिक क्रिया के रूप में रखना यूनानी संरचना को निकटता से दर्शाता है और इस बात को अनावश्यक रूप से तय नहीं करता कि काँपना खास तौर पर निन्दा करने की संभावना से जुड़ा है या निन्दा करते समय उनका समग्र निर्भय रवैया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। आरोपों की संक्षिप्त, तीखी लय को अर्धविराम से सँभाला गया है। ‘शरीर’, ‘प्रभुता’ और ‘महिमावान’ जैसे शब्द मूल की प्रमुख रूपकात्मक तथा धर्मवैचारिक अस्पष्टताओं को सुरक्षित रखते हैं; जहाँ मुख्य पाठ कुछ औपचारिक है, वहाँ पादटिप्पणियाँ अधिक स्पष्ट विकल्प देती हैं।
