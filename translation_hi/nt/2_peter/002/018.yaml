  text: ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ⸀ὀλίγως ⸀ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,
base_translation:
  language: en
  yaml_path: translation/nt/2_peter/002/018.yaml
  text: For[a], speaking inflated words of emptiness, they entice by fleshly desires and sensuality those who are barely escaping from those who live in error[d][c][b],
translation:
  language: hi
  text: क्योंकि वे खोखली और बड़ी-बड़ी बातें बोलकर, देह की अभिलाषाओं और कामुकता के द्वारा उन लोगों को लुभाते हैं जो भटकाव में जीवन बिताने वालों से मुश्किल से बच निकल रहे हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मुश्किल से” के स्थान पर “अभी-अभी” भी सम्भव है। कुछ प्राचीन हस्तलिपियों में “वास्तव में” पाठ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὑπέρογκα ματαιότητος
  choice: खोखली और बड़ी-बड़ी बातें
  rationale: ὑπέρογκα घमंड से फूली हुई या अतिशयोक्तिपूर्ण बातों को और ματαιότητος उनके खोखलेपन को व्यक्त करता है; यह हिन्दी में स्वाभाविक रहते हुए दोनों तत्व सुरक्षित रखता है।
- source_word: φθεγγόμενοι
  choice: बोलकर
  rationale: कृदन्त उस साधन या साथ चलने वाली क्रिया को बताता है जिसके द्वारा वे लुभाते हैं।
- source_word: δελεάζουσιν
  choice: लुभाते हैं
  rationale: क्रिया चारे से फँसाने जैसे आकर्षण का भाव रखती है; 'लुभाते हैं' आधुनिक हिन्दी में उसके प्रलोभनकारी बल को व्यक्त करता है।
- source_word: ἐν ἐπιθυμίαις σαρκὸς
  choice: देह की अभिलाषाओं के द्वारा
  rationale: ἐν को साधन के अर्थ में लिया गया है और σάρξ के रूपक को 'देह' के द्वारा बचाया गया है, बिना इसे व्याख्यात्मक रूप से 'पापी स्वभाव' बनाने के।
- source_word: ἀσελγείαις
  choice: कामुकता
  rationale: यह बेलगाम, लज्जाहीन काम-विलास का बोध देता है; यहाँ अमूर्त संज्ञा सहज हिन्दी देती है।
- source_word: ὀλίγως ἀποφεύγοντας
  choice: अभी-अभी बच निकल रहे हैं
  rationale: SBLGNT के ὀλίγως को समय-संबंधी अर्थ में ग्रहण किया गया है; वर्तमान कृदन्त चल रही प्रक्रिया को सुरक्षित रखता है।
- source_word: τοὺς ἐν πλάνῃ ἀναστρεφομένους
  choice: भटकाव में जीवन बिताने वालों
  rationale: ἀναστρεφομένους जीवन-व्यवहार को और πλάνῃ भ्रम या भटकाव की अवस्था को सूचित करता है।
theological_decisions:
- issue: नैतिक संदर्भ में σάρξ का अर्थ
  choice: '''देह'' का रूपक बनाए रखा गया'
  alternative: '''पापी स्वभाव'' अथवा ''दैहिक'''
  rationale: '''देह'' स्रोत की धर्मवैचारिक बनावट को बचाता है और किसी व्यवस्थित सांप्रदायिक व्याख्या को पाठ में नहीं जोड़ता।'
- issue: लुभाए जा रहे लोगों की स्थिति
  choice: वे भटकाव में जीने वालों से बच निकलने की प्रक्रिया में हैं
  alternative: उनका उद्धार पूर्ण हो चुका है; अथवा वे स्वयं भटकाव से बच रहे हैं
  rationale: वाक्य-विन्यास में अंतिम कर्मकारक समूह उन लोगों को बताता है जिनसे वे निकल रहे हैं; वर्तमान कृदन्त को पूर्ण या उद्धार-संबंधी निष्कर्ष में नहीं बदला गया।
- issue: ὀλίγως का पाठ और अर्थ
  choice: अभी-अभी
  alternative: मुश्किल से
  rationale: SBLGNT में ὀλίγως है, जो 'थोड़ा पहले/अभी-अभी' का अर्थ दे सकता है; प्रमुख पाठांतर ὄντως से अर्थ 'वास्तव में' हो जाता है। अर्थगत और पाठगत अनिश्चितता पादटिप्पणी में रखी गई है।
