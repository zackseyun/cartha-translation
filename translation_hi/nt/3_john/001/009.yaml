base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/009.yaml
  text: I wrote something to the church[a], but Diotrephes, who loves to be first among them[b], does not receive us.
translation:
  language: hi
  text: मैंने कलीसिया को कुछ लिखा[a], पर दियुत्रिफेस, जो उनमें प्रथम स्थान पाने की लालसा रखता है, हमें स्वीकार नहीं करता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने कलीसिया को एक संक्षिप्त पत्र लिखा।” यूनानी पाठ में अनिश्चित अभिव्यक्ति (“कुछ लिखा”) है; कुछ पांडुलिपियों में इस वाक्य को विस्तृत किया गया है।
    reason: textual_variant
  - marker: b
    text: या, “हमारा स्वागत नहीं करता” अथवा “हमें मान्यता नहीं देता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔγραψά
  choice: मैंने ... लिखा था
  rationale: यूनानी एओरिस्ट बीते हुए लेखन को बताता है। हिंदी में अगले विरोधी कथन की पृष्ठभूमि के रूप में ‘लिखा था’ स्वाभाविक है।
- source_word: τι
  choice: कुछ
  rationale: अनिश्चित सर्वनाम का सीधा अर्थ ‘कुछ’ है; इससे मूल पाठ की अनिश्चित अभिव्यक्ति बनी रहती है और कोई अस्पष्ट वस्तु नहीं जोड़ी जाती।
- source_word: τῇ ἐκκλησίᾳ
  choice: कलीसिया को
  rationale: यह स्थानीय मसीही सभा को सूचित करता है; ‘कलीसिया’ आधुनिक हिंदी बाइबलीय प्रयोग में परिचित और सटीक है।
- source_word: ἀλλ’
  choice: पर
  rationale: लेखक के लिखने और दियुत्रिफेस की प्रतिक्रिया के बीच स्पष्ट विरोध प्रकट करता है।
- source_word: ὁ φιλοπρωτεύων
  choice: जो ... प्रथम होना चाहता है
  rationale: यह प्रथम स्थान या प्रधानता चाहने का नैतिक भाव सहज हिंदी में व्यक्त करता है, बिना किसी औपचारिक पद का दावा जोड़े।
- source_word: αὐτῶν
  choice: उनमें
  rationale: यह उस समूह को दर्शाता है जिसके भीतर दियुत्रिफेस प्रथम स्थान चाहता है; ‘उन पर’ कहने से औपचारिक अधिकार का अनावश्यक संकेत मिल सकता था।
- source_word: Διοτρέφης
  choice: दियुत्रिफेस
  rationale: यूनानी व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: οὐκ ἐπιδέχεται ἡμᾶς
  choice: हमें स्वीकार नहीं करता
  rationale: ‘स्वीकार करना’ यूनानी क्रिया की व्यापकता बनाए रखता है, जिसमें स्वागत, ग्रहण करना अथवा लेखक और उसके साथियों को मान्यता देना शामिल हो सकता है।
theological_decisions:
- issue: दियुत्रिफेस के विरोध का स्वरूप
  choice: हमें स्वीकार नहीं करता
  alternative: हमारा स्वागत नहीं करता; हमें मान्यता नहीं देता
  rationale: मूल क्रिया आतिथ्य, व्यक्तिगत ग्रहण और प्रतिनिधियों अथवा उनके अधिकार की स्वीकृति—इनमें से एक या अधिक भाव रख सकती है। व्यापक अनुवाद इस तनाव को बनाए रखता है और किसी एक कलीसियाई अर्थ को अनिवार्य नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रथम होना चाहता है’ सामान्य पाठक के लिए स्पष्ट है और प्रधानता की लालसा का भाव देता है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
