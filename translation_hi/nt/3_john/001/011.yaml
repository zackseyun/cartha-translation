language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/011.yaml
  text: Beloved[a], do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.
translation:
  language: hi
  text: प्रिय[a], बुराई का अनुकरण न करो, बल्कि भलाई का। जो भलाई करता है, वह परमेश्वर से है; जो बुराई करता है, उसने परमेश्वर को नहीं देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जो भलाई करता रहता है ... जो बुराई करता रहता है’ भी संभव है; यूनानी वर्तमान कृदंत निरंतर अभ्यास या विशेषतापूर्ण आचरण पर बल दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: प्रिय
  rationale: एकवचन संबोधन में आत्मीयता और यूहन्नाई शैली की गरिमा बनाए रखता है; हिन्दी में अकेला ‘प्रिय’ स्वाभाविक पत्रात्मक संबोधन है।
- source_word: μὴ μιμοῦ
  choice: अनुकरण न करो
  rationale: वर्तमान निषेधात्मक आज्ञा और नैतिक उदाहरण का अनुसरण करने की धारणा को सीधे व्यक्त करता है।
- source_word: τὸ κακὸν
  choice: बुराई
  rationale: नपुंसकलिंग विशेषण के संज्ञात्मक, सामान्य नैतिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἀγαθόν
  choice: भलाई
  rationale: ‘बुराई’ के समानांतर सामान्य नैतिक श्रेणी को संक्षिप्त और स्वाभाविक रूप में रखता है।
- source_word: ὁ ἀγαθοποιῶν
  choice: जो भलाई करता है
  rationale: संज्ञात्मक वर्तमान कृदंत को ऐसी हिन्दी में व्यक्त करता है जो आचरण या निरंतर अभ्यास, दोनों का संकेत दे सकती है।
- source_word: ἐκ τοῦ θεοῦ ἐστιν
  choice: परमेश्वर से है
  rationale: ἐκ के स्रोत अथवा संबंध-बोध और यूहन्नाई अभिव्यक्ति को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ὁ κακοποιῶν
  choice: जो बुराई करता है
  rationale: पहले कृदंत के समानांतर वर्तमान नैतिक आचरण को स्पष्ट करता है।
- source_word: οὐχ ἑώρακεν τὸν θεόν
  choice: उसने परमेश्वर को नहीं देखा है
  rationale: ὁράω के पूर्णकाल और यूहन्नाई ‘देखने’ की धर्मवैचारिक भाषा को बनाए रखता है; इसे ‘जानता नहीं’ कहकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: नैतिक आचरण और परमेश्वर से संबंध बताने वाली यूहन्नाई अभिव्यक्ति
  choice: ‘परमेश्वर से है’ और ‘परमेश्वर को नहीं देखा है’ को मूल रूप में बनाए रखा गया है।
  alternative: इसे पुनर्जन्म, सिद्धता, या परमेश्वर के साथ किसी भी पूर्व संबंध के पूर्ण अभाव की व्यवस्थित धर्मवैचारिक भाषा में स्पष्ट करना।
  rationale: यूनानी पाठ नैतिक-आत्मिक पहचान को यूहन्नाई श्रेणियों में प्रस्तुत करता है। अनुवाद न चेतावनी को नरम करता है, न बाद की किसी सांप्रदायिक व्याख्या को पाठ में जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आत्मीय किंतु गरिमापूर्ण पत्रात्मक शैली। ‘अनुकरण’ मूल क्रिया के नैतिक उदाहरण-वाले बल को रखता है, जबकि ‘बुराई/भलाई’ सामान्य पाठक के लिए सहज हैं।
