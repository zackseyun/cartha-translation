  text: Beloved[a], you are acting faithfully in whatever you do for the brothers[b], and especially when they are strangers.
translation:
  language: hi
  text: प्रिय[a], तुम भाइयों के लिए जो कुछ भी करते हो, उसे निष्ठापूर्वक करते हो—और वह भी अपरिचितों के लिए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रिय जन।” यूनानी शब्द आत्मीय संबोधन है।
    reason: lexical_alternative
  - marker: b
    text: '“भाइयों” के लिए प्रयुक्त यूनानी शब्द पुल्लिंग बहुवचन है। यहाँ इसका आशय साथी विश्वासियों से है; उस समूह में स्त्रियाँ भी सम्मिलित रही हों, यह संभव है। अधिक शाब्दिक रूप से: “तुम भाइयों के लिए जो कुछ भी करते हो, उसे निष्ठापूर्वक करते हो—और यह अपरिचितों के लिए [भी]।”'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: प्रिय भाई
  rationale: यह ἀγαπητός का एकवचन संबोधन है, जो आत्मीयता व्यक्त करता है। हिन्दी पत्र-शैली में संदर्भानुसार ‘प्रिय भाई’ स्वाभाविक और गरिमापूर्ण है; ‘प्रिय’ मात्र भी संभव है।
- source_word: πιστὸν ποιεῖς
  choice: विश्वासयोग्यता से काम करते हो
  rationale: यूनानी मुहावरे का शाब्दिक अर्थ ‘विश्वासयोग्य काम करते हो’ है। यह रूप गयुस के आचरण की निष्ठा और भरोसेमंदी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὃ ἐὰν ἐργάσῃ
  choice: जो कुछ करते हो
  rationale: 'संबंधवाचक सर्वनाम, ἐάν और संभावनार्थक क्रिया मिलकर अनिश्चित व्यापक अर्थ देते हैं: ‘जो कुछ भी तुम करते हो।’ वर्तमान हिन्दी में ‘जो कुछ करते हो’ सहज है।'
- source_word: εἰς τοὺς ἀδελφοὺς
  choice: भाइयों के लिए
  rationale: εἰς यहाँ हितार्थक भाव रखता है। ἀδελφούς व्याकरणतः पुल्लिंग बहुवचन है और संदर्भ में साथी विश्वासियों को सूचित करता है।
- source_word: καὶ τοῦτο ξένους
  choice: और विशेष रूप से तब, जब वे तुम्हारे लिए अपरिचित होते हैं
  rationale: खंड कुछ संक्षिप्त और व्याकरणिक रूप से असामान्य है। καὶ τοῦτο पिछली बात को उभारता है, जबकि ξένους उन भाइयों को ऐसे लोगों के रूप में बताता है जिन्हें गयुस व्यक्तिगत रूप से नहीं जानता था।
- source_word: ξένους
  choice: अपरिचित
  rationale: यहाँ ξένος का आशय आवश्यक रूप से विदेशी नहीं, बल्कि मेज़बान के लिए अनजान व्यक्ति है। ‘अपरिचित’ इस आतिथ्य-संदर्भ को स्पष्ट रखता है।
theological_decisions:
- issue: ἀδελφούς का संदर्भगत विस्तार
  choice: मुख्य पाठ में ‘भाइयों’ और पादटिप्पणी में साथी विश्वासियों का संदर्भ
  alternative: ‘भाई-बहनों’
  rationale: मूल शब्द व्याकरणतः पुल्लिंग बहुवचन है। सम्भव है कि संदर्भित विश्वासी समूह में स्त्रियाँ भी रही हों, पर मुख्य पाठ में इसे स्पष्ट रूप से जोड़ना मूल की संभावित व्यापकता को निश्चित कर देगा।
- issue: ξένους का अर्थ
  choice: ‘तुम्हारे लिए अपरिचित’
  alternative: ‘परदेशी’ या ‘विदेशी’
  rationale: संदर्भ भ्रमणशील मसीही सेवकों के आतिथ्य का है। मूल शब्द यहाँ जातीय या राष्ट्रीय विदेशीपन को अनिवार्य नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का आत्मीय, गरिमापूर्ण पत्रात्मक स्वर रखा गया है। ‘तुम’ एकवचन संबोधन मूल के निकट और हिन्दी में आत्मीय है। वाक्य की यूनानी संक्षिप्तता को स्वाभाविक हिन्दी में खोला गया है, जबकि वैकल्पिक अधिक शाब्दिक संरचना पादटिप्पणी में सुरक्षित है।
