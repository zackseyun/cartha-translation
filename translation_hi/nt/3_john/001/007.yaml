  text: ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ⸀ἐθνικῶν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/007.yaml
  text: For they went out for the sake of the Name[a], taking nothing from the Gentiles.
translation:
  language: hi
  text: क्योंकि वे उस नाम की खातिर अन्यजातियों[a] से कुछ भी स्वीकार किए बिना निकले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, मूर्तिपूजकों अथवा अविश्वासियों से।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπὲρ
  choice: की खातिर
  rationale: संबंधकारक पद ‘उस नाम’ के साथ ὑπέρ यहाँ प्रतिस्थापन नहीं, बल्कि उद्देश्य या प्रेरणा व्यक्त करता है। ‘की खातिर’ आधुनिक और स्वाभाविक हिन्दी में यह भाव स्पष्ट रखता है।
- source_word: τοῦ ὀνόματος
  choice: उस नाम
  rationale: यूनानी में शब्द निश्चित है और आरम्भिक मसीही प्रयोग में आदरपूर्ण संक्षिप्त संकेत के रूप में यीशु/प्रभु की ओर इशारा करता है। ‘उस नाम’ मूल की अप्रत्यक्षता बनाए रखता है और ‘मसीह का नाम’ जैसे स्पष्ट शब्द नहीं जोड़ता।
- source_word: ἐξῆλθον
  choice: निकल पड़े
  rationale: यह क्रिया उनके किसी उद्देश्य से यात्रा पर प्रस्थान करने का संकेत देती है। ‘निकल पड़े’ मिशन-संबंधी प्रस्थान के प्रसंग में सहज है और भूतकालिक यूनानी रूप को व्यक्त करता है।
- source_word: μηδὲν λαμβάνοντες
  choice: कुछ भी स्वीकार नहीं करते थे
  rationale: वर्तमान कृदन्त उनके यात्रा-कार्य के दौरान लगातार अपनाए गए व्यवहार को बताता है। प्रसंग में λαμβάνω आर्थिक या भौतिक सहायता स्वीकार करने के अर्थ में है; इसलिए यह हिन्दी ‘कुछ भी लेते हुए नहीं’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: ἀπὸ τῶν ἐθνικῶν
  choice: अन्यजातियों से
  rationale: ἐθνικός यहाँ मसीही समुदाय के बाहर, राष्ट्रों से आए लोगों को दर्शाता है। ‘अन्यजातियों’ से मूल का जातीय-धार्मिक रंग और आरम्भिक यहूदी-मसीही दृष्टिकोण बना रहता है; प्रसंगगत विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘उस नाम’ का अभिप्राय
  choice: यीशु/प्रभु की ओर आदरपूर्ण संकेत, पर मुख्य पाठ में व्यक्ति का नाम स्पष्ट रूप से न जोड़ना
  alternative: ‘मसीह के नाम की खातिर’ या ‘उसके नाम की खातिर’
  rationale: मूल पाठ केवल ‘उस नाम’ कहता है। इसी अप्रत्यक्ष अभिव्यक्ति को बनाए रखने से उसका धार्मिक अनुनाद सुरक्षित रहता है और अनकहे शब्द पाठ में नहीं जोड़े जाते।
- issue: ἐθνικῶν का अर्थ
  choice: मुख्य पाठ में ‘अन्यजातियों’
  alternative: ‘मूर्तिपूजकों’ या ‘अविश्वासियों’
  rationale: प्रसंग में यह शब्द धार्मिक बाहरी लोगों के लिए प्रयुक्त हो सकता है, फिर भी ‘अन्यजातियों’ मूल शब्द के ऐतिहासिक जातीय-धार्मिक आयाम को बेहतर बनाए रखता है। अन्य प्रसंगगत अर्थ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘उस नाम’ की आदरपूर्ण अप्रत्यक्षता और ‘अन्यजातियों’ का ऐतिहासिक रंग जानबूझकर सुरक्षित रखा गया है। पादटिप्पणी-चिह्न उस शब्द के बाद रखा गया है जिससे उसका शब्दार्थ-संबंध है।
