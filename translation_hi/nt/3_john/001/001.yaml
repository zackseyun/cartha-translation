  yaml_path: translation/nt/3_john/001/001.yaml
  text: The elder to beloved Gaius[a], whom I love in truth.
translation:
  language: hi
  text: प्राचीन की ओर से प्रिय गयुस के नाम, जिससे मैं सत्य में प्रेम करता हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ “जिससे मैं सच्चे मन से प्रेम करता हूँ” भी हो सकता है; अथवा “जिससे मैं उस सत्य में प्रेम करता हूँ।” यूनानी पदबंध निष्कपट प्रेम, सुसमाचार के सत्य पर आधारित प्रेम, या दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὁ πρεσβύτερος
  choice: प्राचीन
  rationale: यहाँ यह पत्र भेजने वाले का आत्म-परिचय है। ‘प्राचीन’ पद अथवा सम्मानित स्थिति की सम्भावित छाया बनाए रखता है, जबकि केवल आयु बताने वाला ‘बूढ़ा व्यक्ति’ प्रसंगानुकूल नहीं है।
- source_word: Γαΐῳ
  choice: गयुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: τῷ ἀγαπητῷ
  choice: प्रिय
  rationale: सम्बोधन की आत्मीयता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आगे आने वाले प्रेम के क्रिया-रूप से अर्थगत सम्बन्ध बनाए रखता है।
- source_word: ὃν ἐγὼ ἀγαπῶ
  choice: जिससे मैं प्रेम करता हूँ
  rationale: सम्बन्धवाचक सर्वनाम को हिन्दी की स्वाभाविक संरचना में रखा गया है; स्पष्ट ἐγὼ के हल्के बल को ‘मैं’ बनाए रखता है।
- source_word: ἐν ἀληθείᾳ
  choice: सत्य में
  rationale: यह शाब्दिक और युहन्नाई प्रयोग के अनुरूप अभिव्यक्ति है, जो सच्चे मन से प्रेम और सुसमाचार के सत्य में निहित प्रेम—दोनों सम्भावनाओं को खुला रखती है।
theological_decisions:
- issue: अन्तिम पदबंध ἐν ἀληθείᾳ में ‘सत्य’ की युहन्नाई अर्थ-छाया
  choice: सत्य में
  alternative: सच्चे मन से; अथवा सत्य के दायरे में
  rationale: पदबंध केवल निष्कपटता बता सकता है या उस सत्य की ओर संकेत कर सकता है जिसमें लेखक और प्राप्तकर्ता सहभागी हैं। मुख्य पाठ किसी एक अर्थ को निर्णायक बनाकर मूल की अर्थगत व्यापकता को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और पत्रात्मक रखी गई है। ‘प्राचीन’ को तकनीकी सम्प्रदायगत पदनाम बनाए बिना प्रेषक के आत्म-परिचय के रूप में रखा गया है।
