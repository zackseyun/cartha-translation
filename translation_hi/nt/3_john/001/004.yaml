  text: μειζοτέραν τούτων οὐκ ἔχω ⸀χαράν, ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν ⸀τῇ ἀληθείᾳ περιπατοῦντα.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/004.yaml
  text: 'I have no greater joy than this: to hear that my children are walking in the truth[a][b].'
translation:
  language: hi
  text: मेरे लिए इससे बड़ा कोई आनन्द नहीं कि मैं सुनूँ कि मेरे बच्चे सत्य में चल रहे हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “इन बातों से बढ़कर कोई आनन्द मुझे नहीं है।”'
    reason: lexical_alternative
  - marker: b
    text: “मेरे बच्चे” से सम्भवतः यूहन्ना के आत्मिक बच्चे—वे विश्वासी जिनकी वह पासबानी करता था—अभिप्रेत हैं।
    reason: cultural_note
lexical_decisions:
- source_word: μειζοτέραν ... χαράν
  choice: इससे बढ़कर कोई आनन्द
  rationale: तुलनात्मक विशेषण और ‘आनन्द’ के स्वाभाविक हिन्दी मुहावरे को व्यक्त करता है, साथ ही यूनानी तुलना की शक्ति बनाए रखता है।
- source_word: τούτων
  choice: इससे
  rationale: यूनानी में शब्द बहुवचन है, पर आगे आने वाली बात को समेटते हुए हिन्दी में ‘इससे’ अधिक स्वाभाविक है; शाब्दिक बहुवचन को पादटिप्पणी में रखा गया है।
- source_word: ἵνα ἀκούω
  choice: कि मैं सुनूँ
  rationale: यहाँ ἵνα उस बात का परिचय देता है जो आनन्द का कारण या विषय है; यह रूप मूल की संरचना और भाव दोनों को निकटता से रखता है।
- source_word: τὰ ἐμὰ τέκνα
  choice: मेरे बच्चे
  rationale: पारिवारिक रूपक को बनाए रखता है और मुख्य पाठ में यह तय नहीं करता कि वे जैविक संतान हैं या आत्मिक देखभाल में आए विश्वासी।
- source_word: ἐν τῇ ἀληθείᾳ
  choice: सत्य में
  rationale: यूहन्नाई प्रयोग में सत्य के सैद्धान्तिक और आचरणगत दोनों आयाम खुले रखता है।
- source_word: περιπατοῦντα
  choice: चल रहे हैं
  rationale: जीवन-आचरण के लिए प्रयुक्त यूनानी रूपक को सुरक्षित रखता है और हिन्दी बाइबलीय भाषा में सुबोध है।
theological_decisions:
- issue: τέκνα का आशय जैविक या आत्मिक बच्चों से है
  choice: मुख्य पाठ में ‘मेरे बच्चे’
  alternative: ‘मेरे आत्मिक बच्चे’ या ‘मेरे द्वारा विश्वास में आए लोग’
  rationale: सन्दर्भ आत्मिक बच्चों की ओर संकेत करता है, पर मूल शब्द केवल पारिवारिक रूपक ‘बच्चे’ कहता है; इसलिए अर्थ को मुख्य पाठ में संकुचित नहीं किया गया।
- issue: ἐν τῇ ἀληθείᾳ का अर्थ
  choice: ‘सत्य में’
  alternative: ‘सच्चाई से’ या ‘सच्ची शिक्षा के अनुसार’
  rationale: यह अभिव्यक्ति सही विश्वास और उसके अनुरूप जीवन, दोनों को समेट सकती है; अनुवाद इस धर्मवैचारिक व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘आनन्द’, ‘सत्य में’ और ‘चल रहे हैं’ मूल के भाव तथा रूपक को बनाए रखते हैं; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
