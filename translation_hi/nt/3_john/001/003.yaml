base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/003.yaml
  text: For I rejoiced greatly when brothers came and testified to your truth[c][b][a], just as you are walking in truth.
translation:
  language: hi
  text: क्योंकि जब भाई आए और उन्होंने सत्य के प्रति तुम्हारी निष्ठा की गवाही दी, जैसा कि तुम सत्य के मार्ग पर चल रहे हो, तो मुझे बहुत आनन्द हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाई’ से आशय मसीही समुदाय के साथी विश्वासी हो सकते हैं; यूनानी में शाब्दिक रूप से ‘भाई’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐχάρην γὰρ λίαν
  choice: क्योंकि ... मुझे बहुत आनन्द हुआ
  rationale: γάρ पिछले कथन का कारण बताता है; ἐχάρην सक्रिय अर्थ में है और λίαν आनन्द की तीव्रता व्यक्त करता है। यह क्रम स्वाभाविक हिन्दी में सम्बन्ध और बल दोनों बनाए रखता है।
- source_word: ἐρχομένων ἀδελφῶν
  choice: जब भाई आए
  rationale: सम्बन्धकारक कृदन्तीय रचना को कालवाचक रूप में व्यक्त किया गया है। ἀδελφῶν का प्रत्यक्ष अर्थ ‘भाई’ रखा गया है, जबकि सामुदायिक अर्थ पादटिप्पणी में बताया गया है।
- source_word: μαρτυρούντων σου τῇ ἀληθείᾳ
  choice: उन्होंने सत्य के प्रति तुम्हारी निष्ठा की गवाही दी
  rationale: यूनानी पदबंध में μαρτυρέω के साथ सम्प्रदान कारक और σου का सम्बन्ध संक्षिप्त किन्तु अर्थगत रूप से खुला है। हिन्दी में केवल ‘तुम्हारे सत्य’ निजी सत्य का भ्रामक भाव दे सकता है; चुना हुआ रूप सत्य के साथ गयुस के निष्ठावान सम्बन्ध को व्यक्त करता है और अगले उपवाक्य से मेल खाता है।
- source_word: καθὼς
  choice: कि
  rationale: यहाँ अगला उपवाक्य भाइयों की गवाही की वास्तविक विषयवस्तु स्पष्ट करता है। हिन्दी में डैश के बाद ‘कि’ इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है; ‘ठीक जैसे’ भी सम्भव है।
- source_word: ἐν ἀληθείᾳ περιπατεῖς
  choice: तुम सत्य के मार्ग पर चल रहे हो
  rationale: περιπατέω के आचरण-सूचक रूपक को ‘चलना’ द्वारा बनाए रखा गया है। ‘सत्य के मार्ग पर’ आधुनिक हिन्दी में स्वाभाविक है और निरन्तर जीवन-व्यवहार का भाव देता है।
theological_decisions:
- issue: यूहन्नाई सन्दर्भ में ἀλήθεια का अर्थ
  choice: दोनों प्रयोगों में ‘सत्य’ को आधार बनाते हुए पहले में ‘सत्य के प्रति तुम्हारी निष्ठा’ और दूसरे में ‘सत्य के मार्ग पर चलना’
  alternative: ‘तुम्हारे सत्य की गवाही दी, ठीक जैसे तुम सत्य में चलते हो’
  rationale: यह पद सिद्धान्त, नैतिक आचरण और निष्ठा के बीच के सम्बन्ध को जानबूझकर खुला रखता है। मुख्य पाठ निजी या सापेक्ष ‘तुम्हारा सत्य’ का आभास टालता है, पर सत्य को केवल ईमानदारी या केवल मत-सिद्धान्त तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सत्य के मार्ग पर चलना’ मूल के नैतिक रूपक को बनाए रखता है; वाक्य-विन्यास हिन्दी की स्वाभाविक सूचना-रचना के अनुसार रखा गया है।
