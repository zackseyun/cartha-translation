id: 3JN.1.2
reference: 3 John 1:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/002.yaml
  text: Beloved[a], I pray that in all respects you may prosper and be healthy[d][c][b], just as your soul prospers.
translation:
  language: hi
  text: प्रिय[a], मैं प्रार्थना करता हूँ कि तुम्हारा सब प्रकार से[b] भला हो और तुम स्वस्थ रहो[c], जैसे तुम्हारी आत्मा का भला हो रहा है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हे प्रिय जन’।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर बात में’; परम्परागत अनुवाद ‘सबसे बढ़कर’ है, लेकिन यूनानी में प्राथमिकता की अपेक्षा व्यापकता का भाव अधिक स्वाभाविक है।
    reason: alternative_reading
  - marker: c
    text: या ‘तुम्हारा स्वास्थ्य अच्छा रहे’।
    reason: lexical_alternative
  - marker: d
    text: या ‘तुम्हारे अंतर्मन का भला हो रहा है’ अथवा ‘तुम्हारी आत्मा कुशल है’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγαπητέ
  choice: प्रिय
  rationale: एकवचन संबोधन में प्रेम और आत्मीयता व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और मूल में निहित ‘प्रेम किए हुए’ भाव को बनाए रखता है, बिना ‘भाई’ या ‘मित्र’ जैसा संबंध जोड़ने के।
- source_word: περὶ πάντων
  choice: हर प्रकार से
  rationale: यह पदबंध प्राथमिकता (‘सबसे बढ़कर’) के बजाय क्षेत्र या व्यापकता का भाव देता है। ‘हर प्रकार से’ हिन्दी में स्वाभाविक रूप से यही अर्थ प्रकट करता है।
- source_word: εὔχομαί
  choice: मैं प्रार्थना करता हूँ
  rationale: पत्र के धार्मिक संदर्भ में यह क्रिया प्रार्थनापूर्ण इच्छा व्यक्त करती है; ‘प्रार्थना करता हूँ’ उस भाव को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: σε εὐοδοῦσθαι
  choice: तुम्हारी उन्नति हो
  rationale: क्रिया का भाव है कि किसी का भला हो, उसका काम सुचारु चले या वह समृद्ध हो। ‘उन्नति हो’ संक्षिप्त है और बाद में इसी क्रिया की पुनरावृत्ति को बनाए रखने देता है।
- source_word: ὑγιαίνειν
  choice: तुम स्वस्थ रहो
  rationale: यहाँ शारीरिक स्वास्थ्य का सीधा भाव है। ‘स्वस्थ रहो’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: καθὼς
  choice: ठीक वैसे ही जैसे
  rationale: यह बाहरी कुशलता और आत्मा की दशा के बीच तुलना को स्पष्ट रूप से व्यक्त करता है।
- source_word: εὐοδοῦταί σου ἡ ψυχή
  choice: तुम्हारी आत्मा की उन्नति हो रही है
  rationale: वर्तमानकालीन, जारी भलाई को व्यक्त करता है और पहले आए εὐοδοῦσθαι के साथ शब्दगत प्रतिध्वनि को ‘उन्नति’ द्वारा सुरक्षित रखता है।
- source_word: ψυχή
  choice: आत्मा
  rationale: ψυχή के ‘जीवन’, ‘स्व’ और ‘आत्मा’ जैसे अर्थ हो सकते हैं। यहाँ स्वास्थ्य और सर्वांगीण उन्नति से तुलना में ‘आत्मा’ व्यक्ति के भीतरी जीवन का भाव रखती है, पर उसकी प्रकृति पर विस्तृत सिद्धान्त नहीं थोपती।
theological_decisions:
- issue: आरंभिक शुभकामना में περὶ πάντων का अर्थ
  choice: हर प्रकार से—अर्थात व्यापकता
  alternative: सबसे बढ़कर—अर्थात प्राथमिकता
  rationale: यूनानी पदबंध अधिक स्वाभाविक रूप से क्षेत्र या व्यापकता बताता है, न कि यह कि यह प्रार्थना अन्य सभी बातों से अधिक महत्त्वपूर्ण है।
- issue: ψυχή का अर्थ
  choice: आत्मा
  alternative: जीवन; अंतर्मन; भीतरी व्यक्तित्व
  rationale: ‘आत्मा’ मूल की अर्थगत व्यापकता और बाहरी/शारीरिक कुशलता के साथ उसके तुलनात्मक तनाव को सुरक्षित रखती है, बिना मानव-स्वभाव की किसी विशिष्ट सम्प्रदायगत व्याख्या को निश्चित किए।
- issue: εὐοδοῦσθαι को भौतिक समृद्धि तक सीमित करना
  choice: उन्नति होना—व्यापक कुशलता और भलाई
  alternative: धनवान या भौतिक रूप से समृद्ध होना
  rationale: क्रिया का अर्थ किसी का काम भली प्रकार चलना या उसका कुशल-मंगल होना हो सकता है। केवल आर्थिक समृद्धि कहना मूल से अधिक संकीर्ण और धर्मवैज्ञानिक रूप से भारित होता।
translation_notes:
  register: भाषा आधुनिक, आत्मीय और गरिमापूर्ण रखी गई है। एकवचन ‘तुम’ पत्र की निकटता दर्शाता है। ‘प्रिय’ मूल संबोधन को बिना अतिरिक्त संबंधसूचक शब्द जोड़े व्यक्त करता है। ‘उन्नति’ को दोनों स्थानों पर दोहराकर यूनानी εὐοδοῦσθαι/εὐοδοῦται की जानबूझकर की गई पुनरावृत्ति बचाई गई है; इसे केवल आर्थिक सम्पन्नता के अर्थ में नहीं समझना चाहिए।
