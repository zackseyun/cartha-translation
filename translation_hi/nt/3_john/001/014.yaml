  text: But I hope to see you soon[a], and we will speak face to face.
translation:
  language: hi
  text: लेकिन मुझे आशा है कि मैं शीघ्र ही तुमसे मिलूँगा, और हम आमने-सामने[a] बात करेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘मुँह से मुँह।’ इस अभिव्यक्ति का अर्थ सीधे व्यक्तिगत रूप से बातचीत करना, अर्थात् ‘आमने-सामने’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλπίζω
  choice: मुझे आशा है
  rationale: वर्तमान काल लेखक की व्यक्तिगत आशा या अपेक्षा व्यक्त करता है; पत्र के समापन में यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: δὲ
  choice: लेकिन
  rationale: यह पिछले कथन से हल्का विरोध या विचार-परिवर्तन दिखाता है; ‘लेकिन’ उस संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: εὐθέως
  choice: शीघ्र ही
  rationale: यात्रा और भेंट के प्रसंग में इसका अर्थ तत्काल उसी क्षण नहीं, बल्कि निकट भविष्य में है; ‘शीघ्र ही’ गरिमापूर्ण और सुबोध है।
- source_word: σε ἰδεῖν
  choice: तुमसे मिलूँगा
  rationale: शाब्दिक अर्थ ‘तुम्हें देखना’ है, पर इस प्रसंग में अभिप्राय व्यक्तिगत रूप से मिलने का है; हिन्दी में ‘तुमसे मिलना’ अधिक स्वाभाविक है।
- source_word: στόμα πρὸς στόμα
  choice: आमने-सामने
  rationale: यूनानी मुहावरे का शाब्दिक रूप ‘मुँह से मुँह’ है, किंतु यहाँ सीधी व्यक्तिगत बातचीत अभिप्रेत है; ‘आमने-सामने’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: λαλήσομεν
  choice: हम … बात करेंगे
  rationale: भविष्यकाल प्रत्याशित बातचीत को व्यक्त करता है; ‘बात करेंगे’ सामान्य आधुनिक हिन्दी में सहज है।
