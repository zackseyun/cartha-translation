  text: I had many things to write to you[a], but I do not want to write to you with ink and pen;
translation:
  language: hi
  text: मुझे तुम्हें बहुत-सी बातें लिखनी थीं, लेकिन मैं स्याही और कलम से तुम्हें लिखना नहीं चाहता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ
  choice: बहुत-सी बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; यह चयन बहुवचन अर्थ को स्वाभाविक हिंदी में स्पष्ट रखता है।
- source_word: εἶχον γράψαι σοι
  choice: मुझे तुम्हें ... लिखनी थीं
  rationale: यूनानी अपूर्ण भूतकाल और अनंत क्रिया मिलकर लिखने के लिए मन में मौजूद सामग्री या अभिप्रेत कार्य को व्यक्त करते हैं; यह हिंदी प्रयोग उस भूतकालीन रूपरेखा को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: ἀλλ’ οὐ θέλω
  choice: लेकिन मैं ... नहीं लिखना चाहता
  rationale: θέλω इच्छा या चाह को व्यक्त करता है; 'नहीं ... चाहता' आधुनिक, सहज और पत्र की आत्मीय शैली के अनुकूल है।
- source_word: διὰ μέλανος καὶ καλάμου
  choice: स्याही और कलम से
  rationale: διά संबंधकारक के साथ साधन बताता है। μέλαν 'स्याही' है और κάλαμος मूलतः सरकंडे की लेखनी है; मुख्य पाठ में कार्यपरक 'कलम' सहज और पर्याप्त है।
- source_word: γράφειν
  choice: लिखना
  rationale: वर्तमानकालिक अनंत क्रिया लेखन की प्रक्रिया पर संकेत कर सकती है, पर हिंदी में सामान्य 'लिखना' बिना अनावश्यक व्याख्या के अर्थ पहुँचाता है।
theological_decisions: []
