id: 3JN.1.10
reference: 3 John 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/010.yaml
  text: For this reason[a], if I come, I will call attention to the works he is doing, maliciously babbling against us with evil words; and not content with these things, he himself does not receive the brothers[c][b], and he hinders those who want to do so and throws them out of the church.
translation:
  language: hi
  text: इसी कारण, यदि मैं आऊँ, तो उसके उन कामों को सामने लाऊँगा जो वह कर रहा है—वह हमारे विरुद्ध बुरी और निरर्थक बातें करता है। और इन बातों से भी संतुष्ट न होकर, वह स्वयं भाइयों[a] का स्वागत[b] नहीं करता; जो उनका स्वागत करना चाहते हैं, उन्हें रोकता है और उन्हें कलीसिया से निकाल देता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाइयों” से संभवतः यात्रा करने वाले मसीही भाई या सेवक अभिप्रेत हैं; कुछ अनुवाद इसे “विश्वासियों” या “भाई-बहनों” के रूप में व्यक्त करते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “भाइयों को ग्रहण नहीं करता।” यूनानी क्रिया का अर्थ स्वीकार करना या आतिथ्य के साथ स्वागत करना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “उन्हें कलीसिया से बहिष्कृत करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पिछले कथन से स्पष्ट कारण-परिणाम संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐὰν ἔλθω
  choice: यदि मैं आया
  rationale: यह अनिश्चित भावी आगमन को सहज हिन्दी की शर्तवाचक रचना में व्यक्त करता है।
- source_word: ὑπομνήσω
  choice: याद दिलाऊँगा
  rationale: मूल क्रिया के ‘स्मरण कराना/ध्यान में लाना’ अर्थ को बनाए रखता है, बिना यह अनावश्यक रूप से निश्चित किए कि कार्रवाई निजी होगी या सार्वजनिक।
- source_word: αὐτοῦ τὰ ἔργα ἃ ποιεῖ
  choice: उसके उन कामों ... जो वह कर रहा है
  rationale: बहुवचन ‘कामों’ और वर्तमान में जारी आचरण—दोनों को सुरक्षित रखता है।
- source_word: λόγοις πονηροῖς φλυαρῶν ἡμᾶς
  choice: बुरी-बुरी बातें कहकर हमारे विरुद्ध निरर्थक बकवास करता है
  rationale: λόγοις πονηροῖς की दुष्ट या हानिकारक बातों और φλυαρέω की खोखली, निरर्थक बकवास—दोनों भावों को स्पष्ट करता है।
- source_word: μὴ ἀρκούμενος ἐπὶ τούτοις
  choice: इतने से भी संतुष्ट न होकर
  rationale: यह उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है कि उसका अनुचित व्यवहार केवल निंदात्मक बातों तक सीमित नहीं है।
- source_word: οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφούς
  choice: वह स्वयं भाइयों का स्वागत नहीं करता
  rationale: ἐπιδέχομαι के आतिथ्यपूर्वक ग्रहण करने के संदर्भगत अर्थ को ‘स्वागत’ स्पष्ट रूप से व्यक्त करता है; αὐτός का बल ‘स्वयं’ से बना रहता है।
- source_word: τοὺς βουλομένους κωλύει
  choice: जो उनका स्वागत करना चाहते हैं, उन्हें रोकता है
  rationale: पूर्ववर्ती क्रिया के निहित कर्म को स्पष्ट करते हुए βούλομαι की इच्छा और κωλύω की रोक—दोनों को बनाए रखता है।
- source_word: ἐκ τῆς ἐκκλησίας ἐκβάλλει
  choice: उन्हें कलीसिया से निकाल देता है
  rationale: यह स्थानीय मसीही समुदाय से बलपूर्वक बाहर किए जाने का अर्थ स्पष्ट और सहज हिन्दी में देता है।
theological_decisions:
- issue: आतिथ्य के प्रसंग में τοὺς ἀδελφούς का अर्थ
  choice: भाइयों
  alternative: विश्वासियों / भाई-बहनों
  rationale: निकटवर्ती प्रसंग भ्रमण करने वाले मसीही सेवकों की ओर संकेत करता है और यूनानी पद पुल्लिंग बहुवचन है। इसलिए अनावश्यक रूप से इसे मिश्रित-लिंग समूह में विस्तृत नहीं किया गया; संदर्भगत संभावना पादटिप्पणी में बताई गई है।
- issue: ἐκκλησία से निकाले जाने की प्रकृति
  choice: कलीसिया से निकाल देता है
  alternative: कलीसिया से बहिष्कृत करता है
  rationale: मूल पाठ समुदाय से बाहर करने की वास्तविक कार्रवाई बताता है, लेकिन उसकी औपचारिक प्रशासनिक प्रक्रिया निर्दिष्ट नहीं करता। मुख्य पाठ में व्यापक और सजीव अभिव्यक्ति रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “निरर्थक बकवास” मूल क्रिया की खोखली वाणी का तीखा भाव सुरक्षित रखता है, जबकि “बुरी-बुरी बातें” उसके दुर्भावनापूर्ण चरित्र को व्यक्त करती हैं। “कलीसिया” स्थानीय मसीही समुदाय के लिए प्रचलित हिन्दी बाइबलीय शब्द है।
