translation:
  language: hi
  text: तुम्हें शान्ति मिले। मित्र तुम्हें नमस्कार भेजते हैं। मित्रों को नाम लेकर नमस्कार कहना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰρήνη σοι
  choice: तुम्हें शान्ति मिले
  rationale: यूनानी का शाब्दिक रूप ‘तुम्हें शान्ति’ है; हिन्दी में आशीर्वचन का निहित क्रियार्थ स्पष्ट करने के लिए ‘मिले’ स्वाभाविक है।
- source_word: ἀσπάζονταί σε
  choice: तुम्हें नमस्कार कहते हैं
  rationale: पत्रात्मक अभिवादन के लिए यह वर्तमान हिन्दी में स्वाभाविक है और प्राप्तकर्ता को सूचित करने का भाव बनाए रखता है।
- source_word: οἱ φίλοι
  choice: मित्र
  rationale: φίλοι का सीधा अर्थ ‘मित्र’ है; ‘भाई’ या ‘हमारे मित्र’ कहना मूल में निहित न होने वाली बात जोड़ता।
- source_word: ἀσπάζου
  choice: नमस्कार कहना
  rationale: एकवचन आज्ञार्थक अभिवादन को सहज हिन्दी में व्यक्त करता है और पहले वाक्य के अभिवादन-वाचक अर्थ से संगति रखता है।
- source_word: κατ’ ὄνομα
  choice: हर एक को नाम लेकर
  rationale: ‘नाम लेकर’ मूल अभिव्यक्ति को बनाए रखता है, जबकि ‘हर एक को’ उसके व्यक्तिगत, एक-एक करके अभिवादन करने के आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
