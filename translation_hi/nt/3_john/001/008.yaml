  text: ἡμεῖς οὖν ὀφείλομεν ⸀ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/008.yaml
  text: Therefore[a], we ought to receive such people[b], so that we may become fellow workers for the truth.
translation:
  language: hi
  text: इसलिए हमें ऐसे लोगों का स्वागत करना चाहिए,[a] ताकि हम सत्य के लिए सहकर्मी बनें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल शब्द में ऐसे यात्रारत सेवकों का स्वागत करने के साथ-साथ उन्हें आवश्यक और भौतिक सहायता देने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “सत्य के साथ सहकर्मी” या “सत्य में सहकर्मी” भी हो सकता है। यूनानी में प्रयुक्त चतुर्थी कारक को एक से अधिक प्रकार से समझा जा सकता है; मुख्य पाठ इसे सत्य के उद्देश्य और प्रसार के लिए सहयोग के अर्थ में लेता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἡμεῖς
  choice: हमें
  rationale: स्पष्ट सर्वनाम के बल को हिन्दी के स्वाभाविक दायित्वसूचक वाक्य-विन्यास में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछले कथन से निकले निष्कर्ष को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὀφείλομεν
  choice: करना चाहिए
  rationale: नैतिक दायित्व को व्यक्त करता है, पर इसे अनावश्यक रूप से निरपेक्ष आदेश नहीं बनाता।
- source_word: ὑπολαμβάνειν
  choice: स्वागत और सहयोग करना
  rationale: संदर्भ में क्रिया केवल ग्रहण करने तक सीमित नहीं, बल्कि यात्रारत सेवकों को आतिथ्य और आवश्यक सहायता देने का भाव भी रखती है; संयुक्त हिन्दी अभिव्यक्ति इस व्यापकता को स्वाभाविक रूप से बताती है।
- source_word: τοὺς τοιούτους
  choice: ऐसे लोगों
  rationale: पहले वर्णित प्रकार के यात्रारत सेवकों की ओर संकेत करता है और वर्ग को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य को संक्षिप्त और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συνεργοὶ
  choice: सहकर्मी
  rationale: साझे कार्य और सहभागिता के भाव को गरिमापूर्ण तथा सुबोध हिन्दी में सुरक्षित रखता है।
- source_word: γινώμεθα
  choice: बनें
  rationale: 'γίνομαι के ‘हो जाना/बनना’ वाले गतिशील भाव को बनाए रखता है: सहायता के द्वारा पाठक उस कार्य में सहभागी बनते हैं।'
- source_word: τῇ ἀληθείᾳ
  choice: सत्य के लिए
  rationale: समर्पण अथवा हित के संबंध को व्यक्त करता है—सत्य के उद्देश्य और प्रसार में सहकार्य—जबकि यूनानी चतुर्थी की अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: συνεργοὶ और τῇ ἀληθείᾳ का संबंध
  choice: “सत्य के लिए ... सहकर्मी” अर्थात सत्य के उद्देश्य और प्रसार में सहभागिता
  alternative: “सत्य के साथ सहकर्मी” अथवा “सत्य में सहकर्मी”
  rationale: निकटवर्ती संदर्भ ‘नाम’ के लिए निकले सेवकों की सहायता का है। मुख्य पाठ इस मिशन-संबंधी उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि चतुर्थी कारक की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज है। ‘स्वागत और सहयोग’ संदर्भगत आतिथ्य तथा सहायता दोनों को सामने लाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
