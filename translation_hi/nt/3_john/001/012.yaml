source:
  edition: SBLGNT
  text: Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ ⸀οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/012.yaml
  text: Demetrius has received testimony from everyone[a], and from the truth itself. We also testify[b], and you know that our testimony is true.
translation:
  language: hi
  text: देमेत्रियुस के विषय में सब लोगों ने गवाही दी है[a], और स्वयं सत्य ने भी उसके विषय में गवाही दी है[b]। हम भी गवाही देते हैं, और तुम जानते हो कि हमारी गवाही सच्ची है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “देमेत्रियुस के विषय में सब लोगों द्वारा गवाही दी गई है।” यूनानी में पूर्ण निष्क्रिय क्रिया है, जो पहले से स्थापित और अब भी मान्य गवाही का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: “स्वयं सत्य” का अर्थ यह हो सकता है कि देमेत्रियुस का जीवन सत्य के अनुरूप है; अधिक व्यापक रूप से, यह भी कि सत्य या सुसमाचार उसके पक्ष में गवाही देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Δημητρίῳ
  choice: देमेत्रियुस
  rationale: यूनानी व्यक्तिगत नाम का देवनागरी में निकट और प्रचलित लिप्यंतरण।
- source_word: μεμαρτύρηται ὑπὸ πάντων
  choice: की प्रशंसा सब लोग करते हैं
  rationale: पूर्ण निष्क्रिय क्रिया स्थापित अनुकूल गवाही का बोध कराती है। स्वाभाविक हिन्दी में यह वाक्य उस भाव को स्पष्ट करता है; पादटिप्पणी अधिक शाब्दिक निष्क्रिय विकल्प देती है।
- source_word: ὑπὸ αὐτῆς τῆς ἀληθείας
  choice: स्वयं सत्य भी उसकी गवाही देता है
  rationale: αὐτῆς की बलात्मकता ‘स्वयं’ से और ἀληθείας की यूहन्नाई अर्थ-समृद्धि ‘सत्य’ से सुरक्षित रहती है; भाव को ‘सुसमाचार’ या ‘आचरण’ तक सीमित नहीं किया गया।
- source_word: καὶ ἡμεῖς δὲ μαρτυροῦμεν
  choice: हम भी उसकी गवाही देते हैं
  rationale: ‘भी’ योगात्मक बल व्यक्त करता है। हिन्दी में सकर्मक पूरक ‘उसकी’ प्रसंग से स्पष्ट है और देमेत्रियुस के पक्ष में गवाही को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἶδας
  choice: तुम जानते हो
  rationale: कोइने यूनानी में οἶδα वर्तमान अवस्था का अर्थ देता है; एकवचन संबोधन को ‘तुम’ से रखा गया है।
- source_word: ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν
  choice: हमारी गवाही सच्ची है
  rationale: ‘गवाही’ से शब्दगत संगति और ‘सच्ची’ से ἀληθής का सीधा अर्थ बना रहता है।
theological_decisions:
- issue: ‘स्वयं सत्य’ का आशय
  choice: मूल रूपकात्मक वाक्यांश ‘स्वयं सत्य’ को बनाए रखा गया और मुख्य पाठ में उसे गवाही देने वाले कर्ता के रूप में व्यक्त किया गया।
  alternative: इसे ‘सुसमाचार स्वयं’ अथवा ‘उसका सत्य के अनुसार जीवन’ कहकर स्पष्ट करना।
  rationale: यूहन्नाई प्रयोग में यह वाक्यांश सुसमाचार, प्रकट सत्य और देमेत्रियुस के सत्य-संगत जीवन की ओर संकेत कर सकता है। किसी एक अर्थ में सीमित करना मूल की सार्थक अस्पष्टता मिटा देता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘प्रशंसा’ अनुकूल गवाही को स्वाभाविक बनाती है, जबकि पादटिप्पणी यूनानी निष्क्रिय रचना सुरक्षित रखती है। ‘स्वयं सत्य’ की धर्मवैचारिक और साहित्यिक गहराई को व्याख्यात्मक रूप से संकीर्ण नहीं किया गया।
