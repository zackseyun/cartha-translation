  text: οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/3_john/001/006.yaml
  text: They testified before the church about your love[a], and you will do well to send them on their way in a manner worthy of God.
translation:
  language: hi
  text: उन्होंने कलीसिया के सामने तुम्हारे प्रेम की गवाही दी है। यदि तुम उन्हें परमेश्वर के योग्य ढंग से आगे की यात्रा के लिए विदा करोगे[a], तो अच्छा करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उनकी आगे की यात्रा के लिए आवश्यक सहायता देकर उन्हें भेजना; यूनानी क्रिया में यात्रियों को व्यावहारिक सहयोग देकर आगे विदा करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐμαρτύρησάν
  choice: गवाही दी है
  rationale: अपूर्णभूत एओरिस्ट एक घटित कार्य बताता है; हिन्दी का पूर्ण वर्तमान पत्र के वर्तमान संदर्भ में उस गवाही की प्रासंगिकता स्वाभाविक रूप से व्यक्त करता है।
- source_word: σου τῇ ἀγάπῃ
  choice: तुम्हारे प्रेम की
  rationale: यहाँ सम्प्रदान कारक गवाही के विषय को दर्शाता है; ‘प्रेम की गवाही’ स्वाभाविक हिन्दी है।
- source_word: ἐνώπιον ἐκκλησίας
  choice: कलीसिया के सामने
  rationale: यह एकत्रित मसीही समुदाय की उपस्थिति में सार्वजनिक गवाही को व्यक्त करता है।
- source_word: καλῶς ποιήσεις
  choice: तो अच्छा करोगे
  rationale: भविष्यत् रूप में विनम्र आग्रह और अनुमोदन दोनों हैं; सशर्त हिन्दी रचना इस भाव को स्वाभाविक रूप से रखती है।
- source_word: προπέμψας
  choice: आगे की यात्रा के लिए विदा करोगे
  rationale: शब्द यात्रियों को आगे भेजने का अर्थ देता है और प्रसंग में आवश्यक व्यावहारिक सहायता भी निहित हो सकती है; इस व्यापकता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἀξίως τοῦ θεοῦ
  choice: परमेश्वर के योग्य रीति से
  rationale: यह उनके विदा करने और सहायता देने की रीति का मानक परमेश्वर को ठहराता है, बिना अर्थ को अतिरिक्त रूप से परिभाषित किए।
theological_decisions:
- issue: मसीही आतिथ्य में προπέμπω का आशय
  choice: मुख्य पाठ में ‘आगे की यात्रा के लिए विदा करोगे’, और सहायता का निहित भाव पादटिप्पणी में
  alternative: उनकी यात्रा में सहायता करके आगे भेजोगे
  rationale: मूल क्रिया केवल विदाई से अधिक, यात्रियों को आगे बढ़ने के साधन देने का संकेत कर सकती है; फिर भी भौतिक सहायता को मूल पाठ में अनिवार्य रूप से स्पष्ट कहना अर्थ को जरूरत से अधिक निश्चित कर देगा।
- issue: ἀξίως τοῦ θεοῦ में सम्बन्ध
  choice: परमेश्वर के योग्य रीति से
  alternative: ऐसी रीति से जो परमेश्वर के सम्मान के अनुरूप हो
  rationale: संक्षिप्त रूप मूल की गरिमा और खुलापन बनाए रखता है तथा किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘कलीसिया’ पत्र के मसीही सामुदायिक संदर्भ को बनाए रखता है। दो वाक्यों में विभाजन हिन्दी की स्पष्टता के लिए है, जबकि विचारगत सम्बन्ध ‘यदि…तो’ से सुरक्षित है।
