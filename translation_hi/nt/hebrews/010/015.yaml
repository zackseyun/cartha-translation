review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders the connective, the additive force of καί, and the Holy Spirit as the active witness. However, it adds the unsupported and unclear object “इसकी,” and “क्योंकि पहले वह कहता है” does not represent μετὰ γὰρ τὸ εἰρηκέναι, which means “for after [having] said,” not “for first he says.”
  naturalness: “पवित्र आत्मा भी हमारे सामने गवाही देता है” is natural modern Hindi and communicates testimony directed to the readers. “क्योंकि यह कहने के बाद:” is idiomatic while retaining the source’s deliberately incomplete transition into the following quotation.
  terminology: “पवित्र आत्मा” and “गवाही देता है” are appropriate contemporary, dignified terms. The alternate “साक्ष्य देता है” is less idiomatic for a personal witness in this construction; “साक्षी देता है” preserves the formal lexical alternative.
  issues:
  - severity: medium
    issue: Unsupported object “इसकी”
    rationale: The Greek μαρτυρεῖ ἡμῖν has no expressed object. Adding “इसकी” is not needed for Hindi grammar and gives the reader an undefined referent.
  - severity: high
    issue: Temporal construction mistranslated as “पहले वह कहता है”
    rationale: 'μετὰ γὰρ τὸ εἰρηκέναι is a temporal articular infinitive: “for after having said.” The draft changes both the completed aspect and the temporal relationship.'
  - severity: low
    issue: Footnote repeats the unsupported object and uses a less fitting formulation
    rationale: “हमें इसका साक्ष्य देता है” retains “इसका” and frames the Spirit’s act as supplying evidence rather than bearing witness. A witness-language alternative is preferable.
  revised_text: 'और पवित्र आत्मा भी हमारे सामने गवाही देता है[a]; क्योंकि यह कहने के बाद:'
