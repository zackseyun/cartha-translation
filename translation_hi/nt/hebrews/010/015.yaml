base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/015.yaml
  text: And the Holy Spirit also testifies to us[a]; for after saying,
translation:
  language: hi
  text: 'और पवित्र आत्मा भी हमारे सामने गवाही देता है[a]; क्योंकि यह कहने के बाद:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे सामने साक्षी देता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: μαρτυρεῖ
  choice: गवाही देता है
  rationale: वर्तमानकालिक क्रिया का यह स्वाभाविक हिन्दी रूप साक्षी देने का भाव बनाए रखता है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध नहीं, बल्कि विचार को आगे बढ़ाने वाला हल्का संयोजक है।
- source_word: ἡμῖν
  choice: हमें
  rationale: μαρτυρέω के साथ सम्प्रदान कारक उन लोगों को दर्शाता है जिनसे गवाही कही जाती है।
- source_word: καὶ
  choice: भी
  rationale: यह पवित्र आत्मा को एक अतिरिक्त साक्षी के रूप में प्रस्तुत करने वाला योगात्मक अर्थ व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह विशिष्ट उपाधि का मानक, आधुनिक हिन्दी रूप है।
- source_word: μετὰ γὰρ τὸ εἰρηκέναι
  choice: क्योंकि पहले वह कहता है
  rationale: μετά के साथ articular infinitive क्रम को दर्शाता है—कहने के बाद आगे की बात आती है। हिन्दी में अगले पदों के उद्धरण की टूटी हुई संरचना बनाए रखते हुए 'पहले वह कहता है' अधिक स्वाभाविक है; निहित कर्ता पूर्ववर्ती 'पवित्र आत्मा' है।
- source_word: ἡμῖν (with contextual object)
  choice: हमें इसकी
  rationale: ग्रीक में गवाही की विषयवस्तु संदर्भ से निहित है। हिन्दी में 'इसकी' जोड़ने से वाक्य स्वाभाविक और स्पष्ट होता है, बिना कोई नई विषयवस्तु निर्धारित किए।
theological_decisions:
- issue: पवित्र आत्मा की व्यक्तिगत सक्रियता
  choice: पवित्र आत्मा भी हमें इसकी गवाही देता है
  alternative: पवित्र आत्मा भी हमारे पक्ष में साक्षी देता है
  rationale: ग्रीक वाक्य पवित्र आत्मा को गवाही देने वाला सक्रिय कर्ता बनाता है। 'हमें' सम्प्रदान को स्वाभाविक रूप से व्यक्त करता है और उसे 'हमारे पक्ष में' कहकर अनावश्यक रूप से नहीं सुलझाता।
- issue: εἰρηκέναι का निहित कर्ता
  choice: वह कहता है
  alternative: यह कहने के बाद
  rationale: निकटतम कर्ता पवित्र आत्मा है, पर यूनानी infinitive कर्ता को दोबारा स्पष्ट नहीं करता। हिन्दी में 'वह' संदर्भगत कर्ता को सहज रूप से व्यक्त करता है, जबकि आगामी उद्धरण से जुड़ी वाक्य-संरचना बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पाठ में सुगम। 'गवाही देता है' सामान्य पाठकों के लिए स्वाभाविक है, जबकि पादटिप्पणी अधिक औपचारिक 'साक्ष्य देता है' विकल्प सुरक्षित रखती है।
