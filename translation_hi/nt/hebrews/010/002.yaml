source:
  edition: SBLGNT
  text: ἐπεὶ οὐκ ἂν ἐπαύσαντο προσφερόμεναι, διὰ τὸ μηδεμίαν ἔχειν ἔτι συνείδησιν ἁμαρτιῶν τοὺς λατρεύοντας ἅπαξ ⸀κεκαθαρισμένους;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/002.yaml
  text: Otherwise[a], would they not have stopped being offered, because those who worship, having once been cleansed[b], would no longer have any consciousness of sins?
translation:
  language: hi
  text: नहीं तो[a], क्या वे चढ़ाए जाना बंद न हो गए होते, क्योंकि आराधना करने वाले, एक बार शुद्ध किए जा चुकने पर[b], फिर पापों का कोई बोध नहीं रखते?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तब।” यहाँ यूनानी शब्द पिछले कथन से निकलनेवाला प्रतिकल्पित निष्कर्ष प्रस्तुत करता है।
    reason: logical_alternative
  - marker: b
    text: या, “एक ही बार में शुद्ध किए जाने के बाद।” यहाँ “एक बार” का अर्थ निर्णायक और फिर न दोहराया जानेवाला शुद्धिकरण भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: नहीं तो
  rationale: यह पिछले पद के आधार पर एक प्रतिकल्पित निष्कर्ष प्रस्तुत करता है; ‘नहीं तो’ हिन्दी में तर्क का प्रवाह स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐκ ἂν ἐπαύσαντο προσφερόμεναι
  choice: क्या उनका चढ़ाया जाना बन्द न हो गया होता?
  rationale: नकारात्मक प्रतिप्रश्न और प्रतिकल्पित भाव दोनों सुरक्षित हैं; निहित कर्ता पिछले पद के बलिदान हैं।
- source_word: τοὺς λατρεύοντας
  choice: आराधना करनेवाले
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदन्त है और उपासना में लगे लोगों को दर्शाता है।
- source_word: ἅπαξ κεκαθαρισμένους
  choice: एक बार शुद्ध किए जाने के बाद
  rationale: पूर्ण निष्क्रिय कृदन्त पहले सम्पन्न शुद्धिकरण और उसके बने रहनेवाले परिणाम को सूचित करता है; ἅπαξ का मूल ‘एक बार’ अर्थ रखा गया है।
- source_word: συνείδησιν ἁμαρτιῶν
  choice: पापों का कोई बोध
  rationale: συνείδησις यहाँ पाप के प्रति नैतिक असंवेदनशीलता नहीं, बल्कि पापों की बनी रहनेवाली चेतना या दोष-बोध को दर्शा सकता है; ‘बोध’ मूल की अर्थगत व्यापकता बचाता है।
theological_decisions:
- issue: शुद्ध किए गए आराधकों में συνείδησιν ἁμαρτιῶν का अर्थ
  choice: पापों का कोई बोध न रखते
  alternative: पापों का कोई दोष-बोध न रखते / पापों के विषय में विवेक न रखते
  rationale: ‘बोध’ पापों की चेतना और दोष-बोध दोनों की सम्भावना खुली रखता है तथा यह संकेत नहीं देता कि शुद्ध व्यक्ति नैतिक विवेक ही खो देता है।
- issue: ἅπαξ की निश्चितता
  choice: मुख्य पाठ में ‘एक बार’; टिप्पणी में ‘एक ही बार में/सदा के लिए’ की सम्भावना
  alternative: एक ही बार में शुद्ध किए जाने के बाद
  rationale: ἅπαξ अपने आप में ‘एक बार’ है, यद्यपि सन्दर्भ में निर्णायक और न दोहराए जानेवाला भाव सम्भव है; उसे टिप्पणी में सुरक्षित रखा गया है।
