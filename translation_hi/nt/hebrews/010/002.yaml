  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘बलिदानों’ को दोहराने के बजाय स्त्रीलिंग बहुवचन क्रिया से पिछले पद के सन्दर्भ को जोड़ा गया है। ‘आराधना करनेवाले’ सामान्य पाठक के लिए स्पष्ट है; ‘पापों का बोध’ मूल की चेतना/अन्तःकरण सम्बन्धी अर्थगत गुंजाइश बनाए रखता है।
