  text: Ἑκουσίως γὰρ ἁμαρτανόντων ἡμῶν μετὰ τὸ λαβεῖν τὴν ἐπίγνωσιν τῆς ἀληθείας, οὐκέτι περὶ ἁμαρτιῶν ἀπολείπεται θυσία,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/026.yaml
  text: For if we go on sinning deliberately after receiving the knowledge of the truth[a], there no longer remains a sacrifice for sins,
translation:
  language: hi
  text: क्योंकि यदि सत्य का ज्ञान[a] प्राप्त कर लेने के बाद हम जान-बूझकर पाप करते रहते हैं, तो पापों के लिए कोई बलिदान बाकी नहीं रहता,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सत्य का पूरा ज्ञान।’ यूनानी शब्द अधिक पूर्ण या निर्णायक ज्ञान का भाव भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἑκουσίως
  choice: जान-बूझकर
  rationale: यह आधुनिक और स्वाभाविक हिन्दी में सचेत तथा इरादतन आचरण व्यक्त करता है; ‘स्वेच्छा से’ यहाँ कम स्वाभाविक और अपेक्षाकृत अस्पष्ट होता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन से इस चेतावनी का व्याख्यात्मक संबंध स्पष्ट करता है।
- source_word: ἁμαρτανόντων ἡμῶν
  choice: यदि ... हम ... पाप करते रहते हैं
  rationale: वर्तमान कृदन्त की जारी या लगातार क्रिया को ‘करते रहते हैं’ से व्यक्त किया गया है; शर्तसूचक ‘यदि’ यूनानी genitive absolute को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: μετὰ τὸ λαβεῖν
  choice: प्राप्त कर लेने के बाद भी
  rationale: यह पहले पूरी हो चुकी प्राप्ति और उसके बाद जारी पाप के समय-संबंध को दर्शाता है। ‘भी’ मूल में अलग शब्द नहीं है, पर हिन्दी में चेतावनी के विरोधाभासी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπίγνωσιν
  choice: ज्ञान
  rationale: ‘ज्ञान’ मुख्य अर्थ को बिना यह तय किए रखता है कि यहाँ उद्धारकारी अनुभव की कौन-सी धर्मवैज्ञानिक अवस्था अभिप्रेत है; अधिक प्रबल अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: τῆς ἀληθείας
  choice: सत्य का
  rationale: सम्बन्धकारक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: οὐκέτι
  choice: बाकी नहीं
  rationale: यह उस बिंदु के बाद किसी बलिदान के शेष न रहने का अर्थ स्पष्ट और सहज हिन्दी में देता है।
- source_word: περὶ ἁμαρτιῶν
  choice: पापों के लिए
  rationale: बलिदान-संबंधी प्रसंग में περὶ के प्रयोजन/संबंध के अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπολείπεται
  choice: रहता
  rationale: ‘बाकी नहीं रहता’ यूनानी के ‘शेष रहना’ भाव का स्वाभाविक हिन्दी रूप है।
- source_word: θυσία
  choice: कोई बलिदान
  rationale: निषेधात्मक वाक्य में अनिर्दिष्ट θυσία को हिन्दी में ‘कोई बलिदान’ कहना स्वाभाविक है और इब्रानियों के बलिदान-विषयक तर्क के अनुकूल है।
theological_decisions:
- issue: ἁμαρτανόντων का पक्ष और चेतावनी का धर्मवैज्ञानिक प्रभाव
  choice: ‘यदि ... पाप करते रहते हैं’ के द्वारा लगातार या स्थायी आचरण व्यक्त किया गया है।
  alternative: ‘यदि हम जान-बूझकर पाप करें’
  rationale: वर्तमान कृदन्त स्वाभाविक रूप से जारी क्रिया का संकेत देता है। यह चेतावनी की गंभीरता बनाए रखता है, पर इसे धर्म-परिवर्तन के बाद किए गए किसी एक अलग-थलग जानबूझकर पाप के बारे में निर्णायक कथन नहीं बनाता।
- issue: ἐπίγνωσις की शक्ति और चेतावनी पाने वालों की स्थिति
  choice: मुख्य पाठ में ‘सत्य का ज्ञान’ रखा गया है, बिना यह निर्धारित किए कि यह अनिवार्यतः उद्धारकारी पुनर्जन्म को सूचित करता है।
  alternative: ‘सत्य का पूरा ज्ञान’ अथवा ‘सत्य का उद्धारकारी ज्ञान’
  rationale: यूनानी शब्द अधिक पूर्ण या निर्णायक ज्ञान का भाव रख सकता है, लेकिन पद स्वयं उस ज्ञान की अनुभवात्मक या धर्मवैज्ञानिक गहराई को स्पष्ट नहीं करता। इसलिए विवादित पहचान को अनुवाद में तय नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘जान-बूझकर’ इरादतनता को और ‘पाप करते रहते हैं’ जारी आचरण को स्पष्ट करता है। वाक्य के अंत में अल्पविराम रखा गया है क्योंकि यह अगले पद में पूरी होने वाली चेतावनी का आरंभ है।
