id: HEB.10.1
reference: Hebrews 10:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Σκιὰν γὰρ ἔχων ὁ νόμος τῶν μελλόντων ἀγαθῶν, οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων, κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις ἃς προσφέρουσιν εἰς τὸ διηνεκὲς οὐδέποτε ⸀δύναται τοὺς προσερχομένους τελειῶσαι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/001.yaml
  text: For since the law has only a shadow of the good things to come[a], not the very form of the realities, it can never, by the same sacrifices that they continually offer year after year[c][b], perfect those who draw near.
translation:
  language: hi
  text: क्योंकि व्यवस्था में आने वाली भली वस्तुओं की छाया तो है, पर उन वास्तविक बातों का साक्षात् प्रतिरूप नहीं; वह हर वर्ष उन्हीं बलिदानों के द्वारा, जो चढ़ाए जाते रहते हैं, निकट आने वालों[a] को कभी सिद्ध[b] नहीं कर सकती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में केवल “निकट आने वालों” है; इब्रानियों में इसका भाव उपासना में परमेश्वर के निकट आने का हो सकता है।
    reason: cultural_note
  - marker: b
    text: या, “पूर्ण बना देना” अथवा “उनके अभिप्रेत लक्ष्य तक पहुँचा देना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Σκιὰν
  choice: छाया
  rationale: यह σκιά के ठोस रूपक को बनाए रखता है और आगे आनेवाली वास्तविकता के अपूर्ण, पूर्वसूचक आभास को व्यक्त करता है।
- source_word: τῶν μελλόντων ἀγαθῶν
  choice: आनेवाली अच्छी वस्तुओं की
  rationale: यह भविष्याभिमुख अर्थ को सुरक्षित रखता है और उसके समय या युगान्त-संबंधी स्वरूप को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: οὐκ αὐτὴν τὴν εἰκόνα τῶν πραγμάτων
  choice: उन वास्तविकताओं का ठीक स्वरूप नहीं
  rationale: ‘ठीक स्वरूप’ αὐτήν की बलाघातयुक्त भावना और εἰκών के स्वरूप/प्रतिरूप अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वास्तविकताओं’ से छाया और वास्तविकता का विरोध स्पष्ट रहता है।
- source_word: κατ’ ἐνιαυτὸν ταῖς αὐταῖς θυσίαις
  choice: हर वर्ष ... उन्हीं बलिदानों के द्वारा
  rationale: यह वार्षिक पुनरावृत्ति, समान बलिदानों और करण कारक—तीनों को स्पष्ट रखता है।
- source_word: ἃς προσφέρουσιν εἰς τὸ διηνεκές
  choice: निरन्तर चढ़ाए जानेवाले
  rationale: ग्रीक में कर्ता अनिर्दिष्ट है; हिन्दी का कर्मवाच्य उसे अनावश्यक रूप से पहचान दिए बिना लगातार चलनेवाली अर्पण-प्रथा व्यक्त करता है।
- source_word: τοὺς προσερχομένους
  choice: परमेश्वर के निकट आनेवालों
  rationale: इब्रानियों में यह उपासना में परमेश्वर तक पहुँचने का धार्मिक भाव रखता है। स्पष्टता के लिए निहित लक्ष्य ‘परमेश्वर’ जोड़ा गया है और इसे पादटिप्पणी में बताया गया है।
- source_word: τελειῶσαι
  choice: सिद्ध करना
  rationale: यह इब्रानियों की प्रमुख पारिभाषिक शब्दावली को बनाए रखता है; यहाँ भाव लक्ष्य तक पहुँचाने और परमेश्वर तक पूर्ण पहुँच योग्य बनाने का है, केवल नैतिक निष्पापता का नहीं।
theological_decisions:
- issue: व्यवस्था और आनेवाली वास्तविकताओं के बीच छाया–स्वरूप का विरोध
  choice: व्यवस्था को आनेवाली अच्छी वस्तुओं की छाया, पर उनकी वास्तविकताओं का ठीक स्वरूप नहीं कहा गया है।
  alternative: व्यवस्था को स्वयं पूर्ण प्रतिरूप या वास्तविकता कहना।
  rationale: ग्रीक σκιά को αὐτὴν τὴν εἰκόνα τῶν πραγμάτων से स्पष्ट रूप से अलग करता है। अनुवाद व्यवस्था की पूर्वसूचक भूमिका बनाए रखता है, पर उसे अंतिम वास्तविकता नहीं बनाता।
- issue: τελειῶσαι का बलिदान-संबंधी अर्थ
  choice: सिद्ध करना
  alternative: पूर्ण करना; लक्ष्य तक पहुँचाना
  rationale: ‘सिद्ध’ पत्र की धर्मवैज्ञानिक शब्दावली से संगति रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका आशय उपासकों को उनके अभिप्रेत लक्ष्य तक पहुँचाने से है, न कि चुपचाप केवल नैतिक निष्पापता मान लेने से।
- issue: προσερχομένους का निहित लक्ष्य
  choice: परमेश्वर के निकट आनेवाले
  alternative: निकट आनेवाले
  rationale: पत्र के धार्मिक संदर्भ में निकट आना परमेश्वर की उपासना और उनके पास पहुँच को सूचित करता है। लक्ष्य स्पष्ट करना आधुनिक हिन्दी में अर्थ खोलता है, और पादटिप्पणी इस व्याख्यात्मक पूर्ति को पारदर्शी बनाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। लम्बे यूनानी वाक्य को स्पष्टता के लिए दो हिन्दी वाक्यों में बाँटा गया है। ‘व्यवस्था’, ‘बलिदान’, ‘सिद्ध’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, पर अर्थसूचक पादटिप्पणियों से संभावित भ्रम घटाया गया है।
