review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the ongoing expectation, the passive concealment of the agent, and the concrete Psalm 110:1 footstool image. However, its clause introduced by “कि” makes the following clause chiefly the content of expectation and leaves ἕως (“until”) implicit. An explicit temporal endpoint better represents the Greek.
  naturalness: “तब से वह उस समय की प्रतीक्षा कर रहा है जब...” is fluent modern standard Hindi and clearly conveys both the continuing action and its endpoint. “पाँवों की चौकी” is understandable and suitably dignified.
  terminology: “शत्रुओं,” “पाँवों की चौकी,” and the passive “बना दिया जाएगा” faithfully retain the source imagery and do not specify the unstated agent. The Psalm quotation should include “पर” in “दाहिने हाथ पर बैठ.”
  issues:
  - severity: medium
    issue: The translation does not explicitly render ἕως (“until”).
    rationale: “इस प्रतीक्षा में है कि...” can be understood as expectation of an event, but it does not clearly mark that event as the temporal endpoint of the waiting. Recasting with “उस समय की प्रतीक्षा ... जब” preserves the relationship explicitly.
  - severity: low
    issue: The cross-reference quotation omits “पर” after “मेरे दाहिने हाथ.”
    rationale: “मेरे दाहिने हाथ पर बैठ” is the natural and complete Hindi expression.
