translation:
  language: hi
  text: तब से वह उस समय की प्रतीक्षा कर रहा है जब उसके शत्रुओं को उसके पाँवों की चौकी बना दिया जाएगा[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस समय की अपेक्षा कर रहा है” अथवा “उस समय की बाट जोह रहा है।” यूनानी कृदंत में अपेक्षापूर्ण प्रतीक्षा का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह भाषा भजन 110:1 की प्रतिध्वनि है: “मेरे दाहिने हाथ पर बैठ, जब तक मैं तेरे शत्रुओं को तेरे पाँवों की चौकी न बना दूँ।”'
    reason: cross_reference
lexical_decisions:
- source_word: τὸ λοιπὸν
  choice: तब से
  rationale: यह नपुंसकलिंगी पदबंध क्रियाविशेषण की तरह प्रयुक्त होकर पिछले संदर्भ में उसके बैठने के बाद के समय को दर्शाता है।
- source_word: ἐκδεχόμενος
  choice: इस प्रतीक्षा में है
  rationale: वर्तमान कृदंत निरंतर प्रतीक्षा के भाव को व्यक्त करता है और संदर्भ में अपेक्षापूर्ण प्रतीक्षा का संकेत भी रहने देता है।
- source_word: ἕως τεθῶσιν
  choice: कि ... बना दिया जाए
  rationale: ἕως के साथ कर्मवाच्य संभावनार्थक रूप प्रतीक्षा के अंतिम बिंदु को बताता है; हिंदी में यह रचना स्वाभाविक है और कर्मवाच्य को बनाए रखती है।
- source_word: οἱ ἐχθροὶ αὐτοῦ
  choice: उसके शत्रुओं
  rationale: मूल के संबंधसूचक सर्वनाम और बहुवचन संज्ञा का सीधा, स्वाभाविक हिंदी रूप।
- source_word: ὑποπόδιον τῶν ποδῶν αὐτοῦ
  choice: उसके पाँवों की चौकी
  rationale: यह ठोस राजकीय-विजय का बिंब बनाए रखता है और भजन 110:1 की प्रतिध्वनि को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: भजन 110:1 का मसीही राज्यारोहण-विजय बिंब
  choice: शत्रुओं को उसके पाँवों की चौकी बना दिया जाए
  alternative: उसके शत्रुओं को पराजित कर दिया जाए / उसके पाँवों तले कर दिया जाए
  rationale: ‘चौकी’ के ठोस बिंब को बनाए रखने से भजन 110:1 की जानबूझकर की गई प्रतिध्वनि और इब्रानियों में उसका मसीही महत्व सुरक्षित रहता है; इसे केवल ‘पराजित’ कहकर व्याख्यायित नहीं किया गया।
- issue: कर्म करने वाले की अप्रकट पहचान
  choice: कर्मवाच्य ‘बना दिया जाए’
  alternative: परमेश्वर उसके शत्रुओं को ... बना दे
  rationale: यद्यपि संदर्भ और भजन 110:1 परमेश्वर की ओर संकेत करते हैं, यूनानी पद में कर्ता स्पष्ट नहीं है। कर्मवाच्य मूल की इस अप्रकटता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘पाँवों की चौकी’ आम पाठक के लिए बोधगम्य है और मूल राज्यारोहण-विजय बिंब को अक्षुण्ण रखता है।
