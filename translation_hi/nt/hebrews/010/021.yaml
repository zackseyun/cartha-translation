translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘महान पुरोहित’ मूल यूनानी के गैर-तकनीकी शब्द-विन्यास को सुरक्षित रखता है। मुख्य पाठ में ‘घराने’ से सामुदायिक अर्थ स्वाभाविक बनाया गया है और ‘घर’ को पादटिप्पणी में रखा गया है।
