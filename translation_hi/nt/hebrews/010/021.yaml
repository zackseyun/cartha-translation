  alternative: महायाजक
  rationale: इब्रानियों में यीशु को बार-बार महायाजक कहा गया है, पर इस पद में ἀρχιερεύς के बजाय ἱερεύς और μέγας अलग-अलग शब्द हैं। इसलिए मूल अभिव्यक्ति को बनाए रखा गया है।
- issue: οἶκος को भवन या लोगों के समुदाय के रूप में समझना
