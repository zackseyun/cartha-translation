source:
  edition: SBLGNT
  text: μὴ ἐγκαταλείποντες τὴν ἐπισυναγωγὴν ἑαυτῶν, καθὼς ἔθος τισίν, ἀλλὰ παρακαλοῦντες, καὶ τοσούτῳ μᾶλλον ὅσῳ βλέπετε ἐγγίζουσαν τὴν ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/025.yaml
  text: not neglecting our own gathering together[a], as is the habit of some[b], but encouraging one another—and all the more as you see the Day drawing near.
translation:
  language: hi
  text: और अपनी सभा में एकत्र होना न छोड़ें[a], जैसा कि कुछ लोगों की आदत है, बल्कि एक-दूसरे को प्रोत्साहित करें; और जितना अधिक आप उस दिन[b] को निकट आते देखते हैं, उतना ही अधिक ऐसा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी सभा में एकत्र होने की उपेक्षा न करें” अथवा “अपनी सभा को न त्यागें।”
    reason: lexical_alternative
  - marker: b
    text: “उस दिन” से सम्भवतः प्रभु के आगमन का दिन या अंतिम न्याय का दिन अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγκαταλείποντες
  choice: न छोड़ें
  rationale: यह क्रिया उपेक्षा करने, साथ छोड़ने या त्याग देने का अर्थ दे सकती है। प्रसंग में “न छोड़ें” स्वाभाविक है और नियमित सामुदायिक एकत्रीकरण से विमुख न होने की बात को बिना पूर्ण धर्मत्याग का अर्थ थोपे व्यक्त करता है।
- source_word: ἐπισυναγωγὴν ἑαυτῶν
  choice: अपनी सभा में इकट्ठा होना
  rationale: यह पद विश्वासियों के सामुदायिक रूप से एकत्र होने को दर्शाता है। यह अनुवाद क्रिया और सामुदायिक संबंध दोनों को रखता है तथा किसी बाद की संस्थागत धारणा को नहीं जोड़ता।
- source_word: καθὼς ἔθος τισίν
  choice: जैसा कि कुछ लोगों की आदत है
  rationale: ἔθος रीति या आदत को दर्शाता है; चुना हुआ वाक्यांश लेखक की संयत किंतु स्पष्ट फटकार को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: παρακαλοῦντες
  choice: एक-दूसरे को प्रोत्साहित करें
  rationale: इस शब्द में आग्रह करने, उत्साहित करने और ढाढ़स देने का अर्थ-क्षेत्र है। सामुदायिक दृढ़ता के प्रसंग में “प्रोत्साहित करें” उपयुक्त है; “एक-दूसरे को” प्रसंग में निहित पारस्परिकता को स्पष्ट करता है।
- source_word: τοσούτῳ μᾶλλον ὅσῳ
  choice: ज्यों-ज्यों … त्यों-त्यों और भी अधिक
  rationale: यह सहसंबंधी रचना उस दिन के निकट आने के अनुपात में प्रोत्साहन बढ़ाने पर बल देती है। हिन्दी की यह संरचना उस तुलनात्मक तीव्रता को स्पष्ट रखती है।
- source_word: βλέπετε
  choice: आप … देखते हैं
  rationale: वर्तमानकालीन बहुवचन क्रिया का सीधा और स्वाभाविक अनुवाद है; यह इस बात को अनिर्धारित रखता है कि वे निकटता को किन संकेतों या परिस्थितियों से पहचानते हैं।
- source_word: ἐγγίζουσαν τὴν ἡμέραν
  choice: उस दिन को निकट आते
  rationale: “उस दिन” एक परिचित विशिष्ट दिन की ओर संकेत करता है, और “निकट आते” वर्तमान कृदंत की गतिशील कालगत छवि को बनाए रखता है।
theological_decisions:
- issue: ‘उस दिन’ का युगांत-संबंधी संकेत
  choice: मुख्य पाठ में “उस दिन” रखा गया और पादटिप्पणी में संभावित अभिप्राय बताया गया।
  alternative: “प्रभु का दिन” या “न्याय का दिन” लिखना
  rationale: प्रसंग संभवतः प्रभु के आगमन या अंतिम न्याय के दिन की ओर संकेत करता है, पर यूनानी पाठ केवल “दिन” कहता है। इसलिए मुख्य पाठ में विस्तार जोड़ना उचित नहीं।
- issue: παρακαλοῦντες का पारस्परिक कर्म
  choice: “एक-दूसरे को” स्पष्ट रूप से जोड़ा गया।
  alternative: कर्म को निहित छोड़कर केवल “प्रोत्साहित करें” कहना
  rationale: यूनानी में कर्म व्यक्त नहीं है, किंतु “अपनी सभा” के सामुदायिक प्रसंग से पारस्परिक अर्थ प्रबल रूप से निहित है; इसे हिन्दी में व्यक्त करना स्वाभाविक और अर्थ-संगत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक उपदेश के अनुरूप रखी गई है। “सभा में इकट्ठा होना” सामान्य पाठक के लिए स्पष्ट है और “आराधना-सभा” जैसी अधिक विशिष्ट संस्थागत व्याख्या से बचता है। सहसंबंधी “ज्यों-ज्यों … त्यों-त्यों” मूल के अनुपातिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
