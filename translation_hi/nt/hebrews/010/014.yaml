  text: μιᾷ γὰρ προσφορᾷ τετελείωκεν εἰς τὸ διηνεκὲς τοὺς ἁγιαζομένους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/014.yaml
  text: For by one offering he has perfected for all time those who are being sanctified[a].
translation:
  language: hi
  text: क्योंकि उसने एक ही भेंट के द्वारा पवित्र किए जा रहे लोगों को सदा के लिए सिद्ध कर दिया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पावन किए जा रहे लोगों को’।
    reason: lexical_alternative
lexical_decisions:
- source_word: μιᾷ
  choice: एक ही
  rationale: प्रसφορᾷ को विशेषित करने वाली संख्या है; ‘एक ही’ प्रसंग में भेंट की एकमात्रता और पुनरावृत्ति न होने पर स्वाभाविक बल देता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: προσφορᾷ
  choice: भेंट
  rationale: यह परमेश्वर को अर्पित वस्तु या अर्पण को दर्शाता है। ‘भेंट’ मूल शब्द की व्यापकता बनाए रखता है, जबकि बलिदान का संदर्भ आसपास के प्रसंग से स्पष्ट है।
- source_word: τετελείωκεν
  choice: सिद्ध कर दिया है
  rationale: पूर्णकालिक क्रिया पूरी हो चुकी कार्रवाई और उसके बने रहने वाले परिणाम—दोनों को व्यक्त करती है। ‘सिद्ध कर दिया है’ इब्रानियों में प्रयुक्त ‘सिद्ध’ शब्दावली और इस क्रिया के परिणामकारी बल को बनाए रखता है।
- source_word: εἰς τὸ διηνεκές
  choice: सदा के लिए
  rationale: यह मुहावरा स्थायी और निरंतर प्रभाव को दर्शाता है; ‘सदा के लिए’ आधुनिक हिन्दी में सहज है और एक भेंट के चिरस्थायी परिणाम को व्यक्त करता है।
- source_word: τοὺς ἁγιαζομένους
  choice: पवित्र किए जा रहे लोगों
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत जारी प्रक्रिया को बनाए रखता है। यह अनुवाद उसे पूर्ण हो चुकी क्रिया के रूप में समतल नहीं करता।
theological_decisions:
- issue: पूर्ण की गई सिद्धता और जारी पवित्रीकरण का संबंध
  choice: ‘सिद्ध कर दिया है’ और ‘पवित्र किए जा रहे’—दोनों आयाम साथ रखे गए हैं।
  alternative: वाक्य को केवल पूर्ण स्थिति (‘पवित्र कर दिया’) या केवल प्रगतिशील प्रक्रिया की ओर झुका देना।
  rationale: यूनानी पाठ τετελείωκεν के पूर्ण और स्थायी परिणाम तथा ἁγιαζομένους की जारी कर्मवाच्य प्रक्रिया को जानबूझकर साथ रखता है; अनुवाद इस तनाव को किसी धर्मसैद्धांतिक व्यवस्था के अनुसार हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘सिद्ध’ इब्रानियों की धार्मिक-साहित्यिक शब्दावली बनाए रखता है; फुटनोट ‘पवित्र किए जा रहे’ का निकटार्थी विकल्प देता है।
