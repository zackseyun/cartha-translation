  edition: SBLGNT
  text: ἀδύνατον γὰρ αἷμα ταύρων καὶ τράγων ἀφαιρεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/004.yaml
  text: For it is impossible for the blood of bulls and goats to take away sins[a].
translation:
  language: hi
  text: क्योंकि यह असंभव है कि बैलों और बकरों का लहू पापों को दूर करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापों को हटा दे।” यूनानी क्रिया का अर्थ दूर करना या हटा देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀδύνατον
  choice: यह असंभव है
  rationale: विधेय विशेषण को क्रिया के भाव के साथ स्वाभाविक हिन्दी में व्यक्त करता है और कथन की पूर्ण असमर्थता बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क का कारण अथवा स्पष्टीकरण देता है; हिन्दी में ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: αἷμα
  choice: लहू
  rationale: मूल पाठ में बलिदान के वास्तविक लहू का उल्लेख है; इसे ‘बलिदान’ या ‘मृत्यु’ कहकर व्याख्यात्मक रूप नहीं दिया गया। ‘लहू’ गरिमापूर्ण, परिचित और बाइबिलीय प्रसंग में स्वाभाविक है।
- source_word: ταύρων
  choice: बैलों
  rationale: बहुवचन संबंधकारक का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: τράγων
  choice: बकरों
  rationale: यूनानी शब्द नर बकरों को सूचित करता है; हिन्दी का ‘बकरों’ नरलिंग और बहुवचन दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀφαιρεῖν
  choice: दूर करे
  rationale: क्रिया के ‘हटा देना/दूर कर देना’ अर्थ को सहज हिन्दी में व्यक्त करता है और पापों के वास्तविक निष्कासन की धारणा को बनाए रखता है।
- source_word: ἁμαρτίας
  choice: पापों
  rationale: मूल के स्पष्ट बहुवचन को सुरक्षित रखता है और इसे अमूर्त एकवचन ‘पाप’ में नहीं बदलता।
theological_decisions:
- issue: इब्रानियों में पशु-बलियों की प्रभावशीलता
  choice: मुख्य पाठ केवल यह कहता है कि पशुओं का लहू पापों को दूर नहीं कर सकता।
  alternative: यह स्पष्ट करना कि बलियाँ पापों को अस्थायी रूप से ढाँपती थीं या केवल विधिक शुद्धि देती थीं।
  rationale: ऐसी विस्तृत धर्मवैज्ञानिक व्याख्या इस पद में प्रत्यक्ष नहीं है। अनुवाद मूल कथन की निर्णायक शक्ति और प्रसंग में उपस्थित तनाव को बिना सुलझाए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। वाक्य-विन्यास स्वाभाविक हिन्दी में है, जबकि मूल का कारणसूचक संबंध, बलिदानी शब्दावली, बहुवचन और निर्णायक कथन सुरक्षित हैं।
