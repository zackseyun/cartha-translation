source:
  edition: SBLGNT
  text: ὑπομονῆς γὰρ ἔχετε χρείαν ἵνα τὸ θέλημα τοῦ θεοῦ ποιήσαντες κομίσησθε τὴν ἐπαγγελίαν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/036.yaml
  text: For you have need of endurance[a], so that after doing the will of God you may receive the promise.
translation:
  language: hi
  text: क्योंकि तुम्हें धीरज की आवश्यकता है, ताकि परमेश्वर की इच्छा पूरी करने के बाद तुम प्रतिज्ञा प्राप्त कर सको।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπομονῆς
  choice: धीरज
  rationale: यह शब्द दबाव और परीक्षा के बीच दृढ़ बने रहने का भाव देता है। ‘धीरज’ आधुनिक हिन्दी में स्वाभाविक है और सहनशील दृढ़ता के अर्थ को अनावश्यक विस्तार के बिना व्यक्त करता है।
- source_word: χρείαν ἔχετε
  choice: तुम्हें ... की आवश्यकता है
  rationale: यूनानी मुहावरे का अर्थ ‘तुम्हें आवश्यकता है’ है; यह हिन्दी में स्पष्ट, स्वाभाविक और गरिमापूर्ण है।
- source_word: ἵνα
  choice: ताकि
  rationale: यह उद्देश्य अथवा अपेक्षित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ θέλημα τοῦ θεοῦ
  choice: परमेश्वर की इच्छा
  rationale: यह सम्बन्धकारक रचना का सीधा और प्रचलित हिन्दी रूप है।
- source_word: ποιήσαντες
  choice: पूरी करने के बाद
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले सम्पन्न होने वाली क्रिया दर्शाता है। ‘पूरी करना’ इच्छा के अनुसार आचरण करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κομίσησθε
  choice: प्राप्त करो
  rationale: इस प्रसंग में क्रिया का अर्थ प्रतिज्ञात वस्तु या फल को पाना है; ‘प्राप्त करो’ स्पष्ट और गरिमापूर्ण है।
- source_word: τὴν ἐπαγγελίαν
  choice: प्रतिज्ञा
  rationale: मूल शब्द सीधे ‘प्रतिज्ञा’ कहता है, यद्यपि प्रसंग में इसका आशय प्रतिज्ञा की पूर्ति या प्रतिज्ञात वस्तु भी हो सकता है। मुख्य पाठ स्रोत की अभिव्यक्ति बनाए रखता है और दूसरा सम्भव अर्थ पादटिप्पणी में देता है।
theological_decisions:
- issue: ἐπαγγελίαν से स्वयं प्रतिज्ञा अभिप्रेत है या प्रतिज्ञात वस्तु/उसकी पूर्ति
  choice: प्रतिज्ञा
  alternative: जिसकी प्रतिज्ञा की गई थी
  rationale: यूनानी संज्ञा का शाब्दिक अर्थ ‘प्रतिज्ञा’ है, पर κομίσησθε के साथ यह प्रतिज्ञात आशीष पाने की ओर भी संकेत कर सकती है। मूल की अर्थगत कसावट और धार्मिक तनाव बनाए रखने के लिए मुख्य पाठ में ‘प्रतिज्ञा’ रखा गया है तथा वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन बहुवचन ‘तुम’ के अनुरूप है। शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है।
