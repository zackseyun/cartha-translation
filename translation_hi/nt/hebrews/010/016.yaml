id: HEB.10.16
reference: Hebrews 10:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Αὕτη ἡ διαθήκη ἣν διαθήσομαι πρὸς αὐτοὺς μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου ἐπὶ καρδίας αὐτῶν, καὶ ἐπὶ ⸂τὴν διάνοιαν⸃ αὐτῶν ἐπιγράψω αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/016.yaml
  text: 'This is the covenant that I will make with them after those days[a], says the Lord: putting my laws upon their hearts, and I will write them on their minds,'
translation:
  language: hi
  text: “यह वह वाचा है जो मैं उन दिनों के बाद उनके साथ बाँधूँगा,” प्रभु कहता है, “अपने नियमों को उनके हृदयों पर रखते हुए, मैं उन्हें उनके मन पर लिखूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαθήκη
  choice: वाचा
  rationale: इब्रानियों में यह शब्द यिर्मयाह की वाचा-संबंधी प्रतिज्ञा को उद्धृत करता है; ‘वाचा’ इस अंतरपाठीय और धर्मवैचारिक अर्थ को स्पष्ट रूप से बनाए रखता है।
- source_word: διαθήσομαι
  choice: मैं ... वाचा बाँधूँगा
  rationale: वाचा के प्रसंग में यह क्रिया वाचा करने या स्थापित करने को व्यक्त करती है; आधुनिक हिन्दी में ‘वाचा बाँधना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: πρὸς αὐτούς
  choice: उनके साथ
  rationale: वाचा बाँधने के प्रसंग में πρὸς का संबंधपरक अर्थ ‘के साथ’ है।
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: उन दिनों के बाद
  rationale: मूल के कालवाचक वाक्यांश को बिना विस्तार के सीधे और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यूनानी κύριος का सामान्य, प्रतिष्ठित हिन्दी समतुल्य ‘प्रभु’ है।
- source_word: διδοὺς
  choice: रखते हुए
  rationale: कृदन्त रूप को सुरक्षित रखता है और नियमों को हृदयों पर रखने की रूपकात्मक छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νόμους
  choice: नियमों
  rationale: यूनानी में बहुवचन स्पष्ट है; ‘नियमों’ से νόμος का विधि-संबंधी अर्थ और संख्या दोनों बने रहते हैं।
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: उनके हृदयों पर
  rationale: ‘पर’ मूल की रूपकात्मक स्थान-संबंधी छवि को बनाए रखता है और बहुवचन καρδίας तथा αὐτῶν को दर्शाता है।
- source_word: διάνοιαν
  choice: मन
  rationale: यह समझने और विचार करने की क्षमता को सूचित करता है; सामान्य आधुनिक हिन्दी में ‘मन’ व्यापक और सहज समतुल्य है।
- source_word: ἐπιγράψω
  choice: मैं ... लिखूँगा
  rationale: क्रिया का अर्थ किसी सतह पर लिखना या अंकित करना है; साथ का ‘पर’ स्थान को पर्याप्त रूप से व्यक्त करता है।
- source_word: αὐτούς
  choice: उन्हें
  rationale: यह सर्वनाम पीछे आए ‘मेरे नियमों’ की ओर संकेत करता है; सर्वनाम बनाए रखने से यूनानी की अन्विति सुरक्षित रहती है।
theological_decisions:
- issue: यिर्मयाह-उद्धरण की आंतरिक वाक्य-रचना
  choice: कृदन्त ‘रखते हुए’ के बाद भविष्यकालीन मुख्य क्रिया ‘मैं ... लिखूँगा’ को बनाए रखा गया है।
  alternative: 'दोनों को समान भविष्यकालीन क्रियाएँ बनाना: ‘मैं ... रखूँगा और ... लिखूँगा।’'
  rationale: इब्रानियों के उपलब्ध यूनानी पाठ में पहला रूप कृदन्त और दूसरा भविष्यकालीन क्रिया है। इसे बनाए रखना उद्धरण को प्रचलित अनुवादों या यिर्मयाह के अन्य रूपों के अनुरूप चुपचाप समतल करने से बचाता है।
- issue: διάνοιαν के एकवचन और αὐτῶν के बहुवचन का हिन्दी रूप
  choice: ‘उनके मनों पर’
  alternative: ‘उनके मन पर’
  rationale: यूनानी संज्ञा एकवचन है, पर संबंधवाचक सर्वनाम बहुवचन समुदाय की ओर संकेत करता है। हिन्दी में प्रत्येक व्यक्ति के मन का भाव स्वाभाविक रूप से ‘उनके मनों’ से व्यक्त होता है; इससे अंग्रेज़ी परामर्श-पाठ का संशोधित बहुवचन भी सार्थक रूप से सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाचा-संबंधी पारंपरिक शब्दावली बनाए रखते हुए अनावश्यक संस्कृतनिष्ठता से बचा गया है। यूनानी कृदन्त की कुछ असामान्य वाक्य-रचना जानबूझकर सुरक्षित रखी गई है।
