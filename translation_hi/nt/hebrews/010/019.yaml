translation:
  language: hi
  text: इसलिए, भाइयो,[a] चूँकि हमें यीशु के लहू के द्वारा पवित्र स्थानों[b] में प्रवेश करने का साहस है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में ‘भाइयो’ है, जो प्रतिनिधिक रूप से पूरी मंडली को संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्रस्थान’; इस संदर्भ में यह वाक्यांश तम्बू की छवि के अनुसार परमेश्वर की पवित्र उपस्थिति के स्थानों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔχοντες
  choice: चूँकि हमें … है
  rationale: वर्तमान कृदन्त अगले उपदेश का आधार प्रस्तुत करता है। ‘चूँकि’ उसके कारणात्मक-तार्किक बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को दर्शाता है; ‘इसलिए’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है। मुख्य पाठ में स्रोत का संबोधन रखा गया है और पूरी मंडली के प्रतिनिधिक संबोधन की संभावना पादटिप्पणी में बताई गई है।
- source_word: παρρησίαν
  choice: साहस
  rationale: यह परमेश्वर की उपस्थिति में निर्भीक और विश्वासपूर्ण पहुँच का भाव देता है। ‘साहस’ स्वाभाविक, सशक्त और गरिमापूर्ण हिन्दी है।
- source_word: εἰς τὴν εἴσοδον
  choice: प्रवेश करने का
  rationale: संज्ञात्मक यूनानी पदबंध को हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है, जबकि प्रवेश और उपलब्ध पहुँच का अर्थ सुरक्षित है।
- source_word: τῶν ἁγίων
  choice: पवित्र स्थानों
  rationale: इब्रानियों की तम्बू-संबंधी पृष्ठभूमि में यह परमेश्वर की पवित्र उपस्थिति के स्थानों की ओर संकेत करता है। बहुवचन रूप मूल की व्यापकता बनाए रखता है और इसे केवल ‘परमपवित्र स्थान’ तक सीमित नहीं करता।
- source_word: ἐν τῷ αἵματι Ἰησοῦ
  choice: यीशु के लहू के द्वारा
  rationale: ἐν यहाँ प्रवेश के साधन या आधार को व्यक्त करता है। ‘के द्वारा’ बलिदान-संबंधी अर्थ को बिना अतिरिक्त व्याख्या के स्पष्ट करता है।
theological_decisions:
- issue: τῶν ἁγίων का आशय
  choice: परमेश्वर की उपस्थिति से जुड़े पवित्र स्थान
  alternative: पवित्रस्थान; परमपवित्र स्थान; पवित्र जन
  rationale: इब्रानियों में चल रही तम्बू और बलिदान की चर्चा स्थान-संबंधी अर्थ का समर्थन करती है। ‘परमपवित्र स्थान’ कहना मूल से अधिक संकीर्ण होगा, जबकि ‘पवित्र जन’ निकट संदर्भ से मेल नहीं खाता।
- issue: ἀδελφοί का प्रतिनिधिक विस्तार
  choice: मुख्य पाठ में ‘भाइयो’, और पादटिप्पणी में पूरी मंडली की संभावना
  alternative: भाइयो और बहनो; भाई-बहनो
  rationale: यह स्रोत के पुल्लिंग बहुवचन रूप को सुरक्षित रखता है, साथ ही यह स्पष्ट करता है कि संबोधन संभवतः स्त्री-पुरुष सहित पूरी मंडली के लिए है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। ‘लहू’ बलिदान-संबंधी बाइबिलीय संदर्भ में प्रचलित और स्पष्ट है। पद अगले वाक्यांश में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
