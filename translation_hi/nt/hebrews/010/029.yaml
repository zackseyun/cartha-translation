id: HEB.10.29
reference: Hebrews 10:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πόσῳ δοκεῖτε χείρονος ἀξιωθήσεται τιμωρίας ὁ τὸν υἱὸν τοῦ θεοῦ καταπατήσας, καὶ τὸ αἷμα τῆς διαθήκης κοινὸν ἡγησάμενος ἐν ᾧ ἡγιάσθη, καὶ τὸ πνεῦμα τῆς χάριτος ἐνυβρίσας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/029.yaml
  text: How much worse punishment do you think will be deserved by the one who has trampled underfoot the Son of God[a], and has regarded the blood of the covenant by which he was sanctified as common[c][b], and has insulted the Spirit of grace?
translation:
  language: hi
  text: आपके विचार में, वह व्यक्ति कितने अधिक कठोर दंड के योग्य ठहराया जाएगा, जिसने परमेश्वर के पुत्र को पैरों तले रौंदा, वाचा के लहू को साधारण[a] समझा जिसके द्वारा वह पवित्र किया गया था[b], और अनुग्रह की आत्मा का अपमान किया[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अशुद्ध’ अथवा ‘अपवित्र’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी वाक्य-रचना में ‘जिसके द्वारा वह पवित्र किया गया था’ स्वाभाविक रूप से उस अपराधी व्यक्ति से जुड़ता है; कुछ व्याख्याकार इसका संदर्भ अलग ढंग से समझते हैं। अनुवाद इस धर्मशास्त्रीय विवाद का निर्णय नहीं करता।
    reason: alternative_reading
  - marker: c
    text: या ‘अनुग्रह की आत्मा का घोर तिरस्कार किया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: πόσῳ ... χείρονος
  choice: कितने अधिक कठोर
  rationale: तुलनात्मक भाव वाली आलंकारिक प्रश्न-रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘कितना बुरा’ की अपेक्षा दंड की तीव्रता अधिक स्पष्ट होती है।
- source_word: ἀξιωθήσεται τιμωρίας
  choice: दंड के योग्य ठहराया जाएगा
  rationale: न्यायिक अर्थ और यूनानी के कर्मवाच्य, ‘योग्य माना जाएगा,’ दोनों को सुरक्षित रखता है।
- source_word: καταπατήσας
  choice: पैरों तले रौंदा
  rationale: घोर तिरस्कार का सजीव मूल रूपक बनाए रखता है।
- source_word: υἱὸν τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: मूल मसीही उपाधि का सीधा और प्रचलित हिन्दी रूप।
- source_word: αἷμα τῆς διαθήκης
  choice: वाचा के उस लहू
  rationale: ‘वाचा’ बाइबलीय संबंध को और ‘लहू’ बलिदान-संबंधी गंभीरता को स्वाभाविक धार्मिक हिन्दी में व्यक्त करता है।
- source_word: κοινὸν
  choice: साधारण
  rationale: पवित्र या समर्पित के विपरीत ‘आम’ समझने का मूल अर्थ बचाता है, बिना इसे अनिवार्य रूप से ‘अशुद्ध’ ठहराए।
- source_word: ἐν ᾧ ἡγιάσθη
  choice: जिसके द्वारा वह पवित्र किया गया था
  rationale: ἐν ᾧ को साधनसूचक रूप में और ἡγιάσθη को कर्मवाच्य में प्रस्तुत करता है; निकटतम व्याकरणिक व्यक्ति-संदर्भ को मुख्य पाठ में बनाए रखता है।
- source_word: τὸ πνεῦμα τῆς χάριτος
  choice: अनुग्रह के आत्मा
  rationale: यूनानी संबंधवाचक पदबंध को औपचारिक रूप से सुरक्षित रखता है और ‘अनुग्रह’ की प्रमुख धार्मिक संज्ञा बनाए रखता है।
- source_word: ἐνυβρίσας
  choice: अपमान किया
  rationale: उद्धत और तिरस्कारपूर्ण दुर्व्यवहार को स्पष्ट, वर्तमान और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἐν ᾧ ἡγιάσθη में ‘पवित्र किया गया’ का संदर्भ
  choice: मुख्य पाठ में ‘जिसके द्वारा वह पवित्र किया गया था’ रखकर व्याकरणतः अपराधी व्यक्ति से संबंध बनाए रखा गया है।
  alternative: कुछ व्याख्याएँ इसे मसीह, वाचा के लहू या वाचा-समुदाय से अन्य प्रकार से जोड़ती हैं।
  rationale: एकवचन कर्ता और कृदंत-श्रृंखला के अनुसार निकटतम स्वाभाविक संदर्भ वही व्यक्ति है; फिर भी धर्मवैज्ञानिक विवाद को निर्णायक रूप से सुलझाने के बजाय पादटिप्पणी में अन्य समझ की संभावना बताई गई है।
- issue: κοινὸν का पवित्रता-संबंधी अर्थ
  choice: साधारण
  alternative: अशुद्ध; अपवित्र
  rationale: ‘साधारण’ पवित्र के विपरीत मूल भेद को खुला रखता है; ‘अशुद्ध’ और ‘अपवित्र’ प्रसंगानुकूल व्याख्यात्मक विकल्प हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गंभीर, सार्वजनिक पाठ के योग्य और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सोचिए’ बहुवचन संबोधन को सम्मानसूचक और स्वाभाविक ढंग से व्यक्त करता है। ‘वाचा,’ ‘लहू,’ ‘पवित्र’ और ‘अनुग्रह’ जैसे स्थापित बाइबलीय शब्द मूल पाठ की धार्मिक और बलिदान-संबंधी प्रतिध्वनि सुरक्षित रखते हैं।
