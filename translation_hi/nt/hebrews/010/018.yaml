  text: Where there is forgiveness of these[a], there is no longer any offering for sin.
translation:
  language: hi
  text: और जहाँ इनकी क्षमा है[a], वहाँ अब पाप के लिए कोई भेंट नहीं रहती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘इनकी’ का संकेत पिछली आयत में बताए गए पापों और अधर्म के कामों की ओर है।
    reason: संकेतवाचक सर्वनाम का संदर्भ स्पष्ट करना
lexical_decisions:
- source_word: ὅπου
  choice: जहाँ
  rationale: यह उस स्थिति या क्षेत्र को प्रस्तुत करता है जिसमें अगला कथन सत्य है; ‘जहाँ’ स्वाभाविक और स्रोत के निकट है।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ हल्के संक्रमण या निष्कर्षसूचक संबंध को चिह्नित करता है, तीखा विरोध नहीं; ‘और’ संदर्भ में तर्क की निरंतरता बनाए रखता है।
- source_word: ἄφεσις
  choice: क्षमा
  rationale: बलिदान-संबंधी संदर्भ में इसका अर्थ पापों की क्षमा अथवा दोष-मुक्ति है; ‘क्षमा’ आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: τούτων
  choice: इनकी
  rationale: संकेतवाचक शब्द पिछली आयत में बताए गए पापों और अधर्म के कामों की ओर लौटता है; ‘इनकी’ उस संदर्भ को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: οὐκέτι
  choice: फिर कोई ... नहीं
  rationale: यह पहले की व्यवस्था के अब आगे जारी न रहने को व्यक्त करता है; हिंदी में यह संरचना स्वाभाविक रूप से ‘अब और नहीं’ का भाव देती है।
- source_word: προσφορὰ
  choice: भेंट
  rationale: यह सामान्य बलिदानी अर्पण का शब्द है; ‘भेंट’ अर्थ को ‘बलिदान’ तक अनावश्यक रूप से सीमित किए बिना उपासना-संबंधी संदर्भ बनाए रखता है।
- source_word: περὶ ἁμαρτίας
  choice: पाप के लिए
  rationale: यह बलिदानी संदर्भ में पाप के संबंध में अथवा पाप के निवारण के लिए चढ़ाई जाने वाली भेंट को दर्शाता है; अनुवाद यूनानी वाक्यांश की व्यापकता बनाए रखता है।
theological_decisions:
- issue: मसीह के बलिदान की अंतिमता का निहितार्थ
  choice: जहाँ पापों की क्षमा हो चुकी है, वहाँ पाप के लिए आगे किसी भेंट की आवश्यकता नहीं रहती।
  alternative: यह कथन हर प्रकार की भेंट को पूर्णतः समाप्त करता है; अथवा केवल लैव्यव्यवस्था की दोहराई जाने वाली रस्मी भेंटों तक सीमित है।
  rationale: इब्रानियों 10 का निकट संदर्भ बार-बार चढ़ाए जाने वाले बलिदानों की तुलना मसीह के प्रभावी, एक ही बार के बलिदान से करता है। अनुवाद पाप के लिए भेंट के अंत को कहता है, पर उससे आगे कोई व्यापक सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘हो गई है’ क्षमा को संपन्न वास्तविकता के रूप में स्वाभाविक हिंदी में व्यक्त करता है, जबकि मुख्य तर्क की सशर्त/क्षेत्रसूचक संरचना ‘जहाँ… वहाँ…’ से बनी रहती है।
