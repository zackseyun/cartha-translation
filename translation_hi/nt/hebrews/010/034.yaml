language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γὰρ τοῖς ⸀δεσμίοις συνεπαθήσατε, καὶ τὴν ἁρπαγὴν τῶν ὑπαρχόντων ὑμῶν μετὰ χαρᾶς προσεδέξασθε, γινώσκοντες ἔχειν ⸀ἑαυτοὺς κρείττονα ⸀ὕπαρξιν καὶ μένουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/034.yaml
  text: For you also suffered together with the prisoners[a], and you accepted with joy the plundering of your possessions[b], knowing that you yourselves have a better and lasting possession.
translation:
  language: hi
  text: क्योंकि तुमने भी कैदियों[b] के दुःख में सहभागिता की[a], और अपनी सम्पत्ति की लूट को आनन्द से स्वीकार किया, यह जानते हुए कि तुम स्वयं एक बेहतर और स्थायी सम्पत्ति रखते हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कैदियों पर दया दिखाई” या “कैदियों के प्रति सहानुभूति दिखाई।”
    reason: lexical_alternative
  - marker: b
    text: कुछ पाण्डुलिपियों में, “मेरी कैद” या “मेरी बेड़ियों” के प्रति सहानुभूति दिखाई।
    reason: textual_variant
  - marker: c
    text: कुछ पाण्डुलिपियों में है, “यह जानते हुए कि तुम्हारे लिए स्वर्ग में एक बेहतर और स्थायी सम्पत्ति है।”
    reason: textual_variant
lexical_decisions:
- source_word: δεσμίοις
  choice: कैदियों
  rationale: यह शब्द बन्धन या कारावास में पड़े लोगों को सूचित करता है। ‘कैदियों’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: συνεπαθήσατε
  choice: दुःख में उनका साथ दिया
  rationale: क्रिया सहानुभूति के साथ-साथ दूसरे के दुःख में सहभागी होने का भाव रखती है। यह अनुवाद केवल मन की दया के बजाय सताव झेल रहे कैदियों के साथ सक्रिय एकजुटता व्यक्त करता है।
- source_word: ἁρπαγήν
  choice: लूट
  rationale: यह जबरन और अन्यायपूर्वक छीन लिए जाने को दर्शाता है; ‘लूट’ इस तीव्रता को ‘ज़ब्ती’ से अधिक स्पष्ट रखती है।
- source_word: τῶν ὑπαρχόντων ὑμῶν
  choice: अपनी सम्पत्ति की
  rationale: यह पद उनके भौतिक सामान या माल-मत्ता को सूचित करता है। ‘सम्पत्ति’ सामान्य, गरिमापूर्ण और सहज हिन्दी है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: यूनानी पूर्वसर्गीय वाक्यांश की संरचना और बल को सीधे व्यक्त करता है।
- source_word: προσεδέξασθε
  choice: स्वीकार किया
  rationale: सन्दर्भ में इसका अर्थ उस हानि को सहर्ष सह लेना है, न कि अन्याय को उचित ठहराना।
- source_word: γινώσκοντες
  choice: यह जानते हुए
  rationale: कृदन्त की समकालिक और प्रसंगतः कारणसूचक छाया को बिना अधिक व्याख्या जोड़े बनाए रखता है।
- source_word: ἑαυτοὺς ἔχειν
  choice: तुम्हारे पास स्वयं ... है
  rationale: पाठ में समर्थित निजवाचक सर्वनाम के बल को ‘स्वयं’ द्वारा सुरक्षित रखा गया है।
- source_word: κρείττονα
  choice: उत्तम
  rationale: इब्रानियों में बार-बार आने वाली तुलनात्मक धारणा को व्यक्त करता है; ‘उत्तम’ गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: ὕπαρξιν
  choice: सम्पत्ति
  rationale: यहाँ शब्द एक श्रेष्ठ स्थायी अधिकार या सम्पदा को सामूहिक अथवा अमूर्त रूप में बताता है। समान हिन्दी शब्द रखने से सांसारिक सम्पत्ति के साथ मूल पाठ का शब्दगत सम्बन्ध भी बना रहता है।
- source_word: μένουσαν
  choice: सदा बनी रहने वाली
  rationale: यह सम्पत्ति के स्थायित्व पर बल देता है और μένω के ‘बने रहना’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: कैद विश्वासियों के साथ एकजुटता का अर्थ
  choice: उनके दुःख में उनका साथ देना
  alternative: कैदियों पर दया करना या उनसे सहानुभूति रखना
  rationale: συμπαθέω का अर्थ सहानुभूति रखना हो सकता है, पर σύν- का भाव और सताव का प्रसंग उनके दुःख में महँगी, सक्रिय सहभागिता को सामने लाते हैं।
- issue: ‘उत्तम और सदा बनी रहने वाली सम्पत्ति’ का स्वरूप
  choice: इसे सामान्य रूप में एक उत्तम और स्थायी सम्पत्ति कहा गया है
  alternative: स्वर्ग में उत्तम सम्पत्ति; उत्तम विरासत
  rationale: प्रस्तुत SBLGNT पाठ ‘स्वर्ग में’ नहीं कहता और सम्पत्ति को उद्धार या प्रतिफल के रूप में स्पष्ट नहीं करता। इसलिए मुख्य पाठ व्यापक अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किन्तु गरिमापूर्ण रखी गई है। ‘दुःख में उनका साथ दिया’ सक्रिय सहभागिता व्यक्त करता है। मुख्य पाठ SBLGNT के ἑαυτούς और बिना ‘स्वर्ग में’ वाले पाठ का अनुसरण करता है; पादटिप्पणियाँ वास्तविक पाठांतर और ἁρπαγή के वैकल्पिक निरूपण को दर्ज करती हैं।
