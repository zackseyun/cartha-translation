source:
  edition: SBLGNT
  text: τοῦτο μὲν ὀνειδισμοῖς τε καὶ θλίψεσιν θεατριζόμενοι, τοῦτο δὲ κοινωνοὶ τῶν οὕτως ἀναστρεφομένων γενηθέντες·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/033.yaml
  text: sometimes being publicly exposed to insults and afflictions[b][a], and at other times becoming partners with those who were treated that way.
translation:
  language: hi
  text: कभी तुम अपमानों और क्लेशों को सहते हुए सबके सामने तमाशा बनाए गए, और कभी तुम उन लोगों के सहभागी बने जिनके साथ ऐसा ही व्यवहार किया जाता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या संभवतः, “उन लोगों के सहभागी बने जो इस प्रकार जीवन बिताते या आचरण करते थे।” यूनानी पद जीवन-व्यवहार का संकेत दे सकता है, यद्यपि यहाँ उत्पीड़न का संदर्भ “जिनके साथ ऐसा ही व्यवहार किया जाता था” अर्थ के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦτο μὲν ... τοῦτο δὲ
  choice: कभी ... और कभी
  rationale: यह सहसंबंधी रचना पाठकों के पिछले धीरज के दो पहलुओं को व्यक्त करती है; आधुनिक हिन्दी में ‘कभी ... और कभी’ स्वाभाविक और स्पष्ट है।
- source_word: ὀνειδισμοῖς
  choice: निन्दाओं
  rationale: यह शब्द अपमानजनक वचन, तिरस्कार और भर्त्सना का बोध कराता है; ‘निन्दाओं’ गरिमापूर्ण और सामान्य हिन्दी में इस अर्थ को रखता है।
- source_word: θλίψεσιν
  choice: क्लेशों
  rationale: यह दबाव, संकट और उत्पीड़नजनित दुःख को व्यापक रूप से व्यक्त करता है; ‘क्लेशों’ इसकी गंभीरता को बिना अनावश्यक संकुचन के बनाए रखता है।
- source_word: θεατριζόμενοι
  choice: सार्वजनिक तमाशा बनाए गए
  rationale: क्रिया लोगों के सामने रंगमंचीय ढंग से प्रदर्शन और अपमान का लक्ष्य बनाए जाने की सजीव छवि रखती है; हिन्दी में यह उसका सार्वजनिक और लज्जाजनक पहलू स्पष्ट करती है।
- source_word: κοινωνοὶ
  choice: सहभागी
  rationale: यह केवल संगति नहीं, बल्कि दूसरों की परिस्थिति और दुःख में सक्रिय भागीदारी तथा एकजुटता व्यक्त करता है।
- source_word: τῶν οὕτως ἀναστρεφομένων
  choice: उन लोगों के ... जिनके साथ ऐसा ही व्यवहार किया जा रहा था
  rationale: निकट संदर्भ निन्दा, क्लेश और सताए गए लोगों के साथ एकजुटता का है। फिर भी यूनानी पद के ‘इस प्रकार जीवन बिताने/आचरण करने वाले’ अर्थ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- source_word: γενηθέντες
  choice: बने
  rationale: अओरिस्ट कृदन्त उनके ऐसे लोगों के सहभागी हो जाने को व्यक्त करता है; ‘बने’ हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ἀναστρεφομένων का संदर्भगत अर्थ
  choice: उनके साथ ऐसा ही व्यवहार किया जा रहा था
  alternative: जो इस प्रकार जीवन बिताते या आचरण करते थे
  rationale: उत्पीड़न का तत्काल संदर्भ व्यवहार-सहे जाने वाले अर्थ का पक्ष लेता है, पर पद सामान्यतः जीवन-व्यवहार का अर्थ भी दे सकता है; इसलिए मुख्य पाठ में संदर्भगत अर्थ और पादटिप्पणी में विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठ। ‘सार्वजनिक तमाशा’ मूल की रंगमंचीय और सार्वजनिक अपमान की छवि को बनाए रखता है। मुख्य पाठ संदर्भानुकूल अर्थ देता है और वास्तविक शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
