  text: इसलिए अपना साहस मत त्यागो, जिसका प्रतिफल बहुत बड़ा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μὴ ἀποβάλητε
  choice: मत त्यागो
  rationale: μή के साथ एओरिस्ट सब्जंक्टिव निषेध व्यक्त करता है। ‘त्यागो’ जान-बूझकर छोड़ देने का भाव रखता है; यह केवल अनायास खो देने से अधिक प्रबल और स्वाभाविक हिन्दी है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष और वर्तमान आग्रह का तार्किक संबंध स्पष्ट करता है।
- source_word: τὴν παρρησίαν ὑμῶν
  choice: अपना साहस
  rationale: παρρησία यहाँ विश्वास से उपजा निर्भीक साहस और खुलापन सूचित करता है। ‘अपना साहस’ आधुनिक हिन्दी में सहज है और केवल भीतरी निश्चय तक अर्थ को सीमित नहीं करता।
- source_word: ἥτις ἔχει
  choice: इसका ... है
  rationale: गुणात्मक संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में स्वतंत्र खंड के रूप में रखा गया है; संबंध और वर्तमानकालीन कथन दोनों सुरक्षित हैं।
- source_word: μεγάλην μισθαποδοσίαν
  choice: प्रतिफल बहुत बड़ा
  rationale: μισθαποδοσία सकारात्मक बदले या पुरस्कार को दर्शाता है। ‘प्रतिफल’ गरिमापूर्ण और व्यापक है तथा अनावश्यक रूप से लेन-देन का भाव नहीं थोपता; μεγάλην का बल ‘बहुत बड़ा’ से स्पष्ट होता है।
theological_decisions:
- issue: इब्रानियों 10:35 में παρρησία का आशय
  choice: विश्वास से उपजा निर्भीक साहस, जिसे ‘साहस’ कहा गया है
  alternative: भरोसा / निडरता / खुलापन
  rationale: इब्रानियों में यह शब्द परमेश्वर के निकट आने की निर्भीक स्वतंत्रता और विश्वास में डटे रहने की खुली दृढ़ता दोनों से जुड़ सकता है। ‘साहस’ आग्रह की शक्ति बनाए रखता है और अर्थ को केवल आंतरिक आश्वासन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘मत त्यागो’ जान-बूझकर फेंक देने या छोड़ देने की प्रबलता को मुहावरेदार ढंग से व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘साहस’ संदर्भ में पर्याप्त व्यापक है।
