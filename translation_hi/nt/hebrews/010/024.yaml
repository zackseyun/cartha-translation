  text: and let us consider one another[a], to stir up love and good works,
translation:
  language: hi
  text: और हम प्रेम और भले कामों के लिए एक-दूसरे को उभारने के उद्देश्य से एक-दूसरे पर ध्यान दें[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रेरित करें,” “उत्साहित करें,” अथवा “उकसाएँ।” यूनानी संज्ञा παροξυσμός प्रबल रूप से सक्रिय करने या उकसाने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοῶμεν
  choice: हम इस बात पर ध्यान दें
  rationale: वर्तमान संभावनार्थक क्रिया यहाँ सामूहिक आग्रह व्यक्त करती है। ‘ध्यान दें’ दूसरों के विषय में सोच-समझकर और सावधानी से विचार करने का भाव रखता है।
- source_word: ἀλλήλους
  choice: एक-दूसरे को
  rationale: यह पारस्परिक सर्वनाम है और समुदाय के सदस्यों की एक-दूसरे के प्रति जिम्मेदारी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς
  choice: के लिए
  rationale: यहाँ εἰς उद्देश्य या अपेक्षित परिणाम की ओर संकेत करता है।
- source_word: παροξυσμὸν
  choice: प्रेरित करें
  rationale: इस संज्ञा में प्रबल रूप से उभारने, उकसाने या सक्रिय करने का भाव है। सकारात्मक उद्देश्यों—प्रेम और भले कामों—के साथ ‘प्रेरित करें’ आधुनिक हिन्दी में स्वाभाविक है; इसकी अधिक तीखी शक्ति पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἀγάπης
  choice: प्रेम
  rationale: ἀγάπη का सीधा, वर्तमान और व्यापक हिन्दी प्रतिशब्द।
- source_word: καλῶν ἔργων
  choice: भले कामों
  rationale: विशेषण और संज्ञा का सीधा अनुवाद है; यह किसी विशिष्ट पुण्य-सिद्धांत को जोड़े बिना अच्छे कर्मों का अर्थ देता है।
- source_word: καὶ
  choice: और
  rationale: यह आग्रह को पिछले प्रसंग से जोड़ता है; पद के भीतर प्रेम और भले कामों का समन्वय भी ‘और’ से व्यक्त होता है।
theological_decisions:
- issue: παροξυσμός का तीखा या संभावित नकारात्मक भाव
  choice: मुख्य पाठ में ‘प्रेरित करें’
  alternative: ‘उभारें’ या ‘उकसाएँ’
  rationale: मूल शब्द प्रबल उत्तेजना या उकसावे को सूचित कर सकता है, पर यहाँ उसके लक्ष्य प्रेम और भले काम हैं। ‘प्रेरित करें’ सकारात्मक संदर्भ को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी मूल की तीव्रता और शब्दार्थ-विस्तार को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सामुदायिक और गरिमापूर्ण रखी गई है। ‘कैसे’ हिन्दी में विचारपूर्वक उपाय खोजने का निहित भाव स्वाभाविक बनाता है, जबकि exhortation की सामूहिक शक्ति ‘हम…ध्यान दें’ से बनी रहती है।
