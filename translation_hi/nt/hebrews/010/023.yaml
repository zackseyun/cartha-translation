  rationale: यह सार्वजनिक रूप से घोषित विश्वास या निष्ठा को सूचित करता है; इब्रानियों में दृढ़ बने रहने के संदर्भ में ‘अंगीकार’ वर्तमान हिंदी का संक्षिप्त और प्रतिष्ठित शब्द है।
- source_word: τῆς ἐλπίδος
  choice: अपनी आशा के
  rationale: यूनानी में अधिकारसूचक सर्वनाम स्पष्ट नहीं है, पर सामुदायिक आग्रह के कारण हिंदी में ‘अपनी’ स्वाभाविक है। स्रोत की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀκλινῆ
  choice: बिना डगमगाए
  rationale: यह न झुकने या न विचलित होने का भाव देता है। क्रियाविशेषणीय हिंदी अभिव्यक्ति अंगीकार को अटल बनाए रखने का आशय सहज रूप से व्यक्त करती है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह प्रतिज्ञा करने वाले की भरोसेमंदी और निष्ठा दोनों को व्यक्त करता है तथा धार्मिक संदर्भ की गंभीरता बनाए रखता है।
- source_word: ὁ ἐπαγγειλάμενος
