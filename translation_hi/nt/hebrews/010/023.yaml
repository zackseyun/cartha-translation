lexical_decisions:
- source_word: κατέχωμεν
  choice: आओ, हम ... दृढ़ता से थामे रहें
  rationale: प्रथम पुरुष बहुवचन वर्तमान संभावनार्थक यहाँ सामूहिक आग्रह व्यक्त करता है। यह हिंदी रूप आग्रह और निरंतर दृढ़ पकड़े रहने—दोनों भावों को स्वाभाविक ढंग से रखता है।
- source_word: ὁμολογίαν
