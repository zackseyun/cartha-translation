  rationale: संज्ञा की तरह प्रयुक्त कृदंत का यह स्वाभाविक हिंदी रूप है। परमेश्वर संदर्भ से समझे जाते हैं, पर स्रोत की तरह उनका नाम स्पष्ट रूप से नहीं जोड़ा गया।
theological_decisions:
- issue: ‘जिसने प्रतिज्ञा की है’ का निहित कर्ता
  choice: परमेश्वर संदर्भ से समझे जाते हैं, लेकिन अनुवाद में नाम निहित रखा गया है।
  alternative: ‘जिस परमेश्वर ने प्रतिज्ञा की है’
  rationale: संदर्भ परमेश्वर की ओर संकेत करता है, पर यूनानी पाठ केवल ‘प्रतिज्ञा करने वाला’ कहता है। निहितता बनाए रखना अनावश्यक व्याख्यात्मक विस्तार से बचाता है।
- issue: ‘आशा’ के साथ अधिकारसूचक शब्द
  choice: स्वाभाविक सामुदायिक हिंदी के लिए ‘अपनी आशा’
  alternative: ‘आशा का अंगीकार’
  rationale: यूनानी में ‘हमारी/अपनी’ स्पष्ट रूप से नहीं है। हिंदी में इसे जोड़ना संबोधित समुदाय की आशा को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक उपासना या सामान्य पठन—दोनों के लिए सुबोध रखी गई है। ‘आओ, हम’ आग्रहसूचक बल को स्पष्ट करता है; ‘दृढ़ता से थामे रहें’ धैर्यपूर्ण निरंतरता व्यक्त करता है।
