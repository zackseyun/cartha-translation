source:
  edition: SBLGNT
  text: ὁ δὲ δίκαιός ⸀μου ἐκ πίστεως ζήσεται, καὶ ἐὰν ὑποστείληται, οὐκ εὐδοκεῖ ἡ ψυχή μου ἐν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/038.yaml
  text: But my righteous one will live by faith[a], and if he shrinks back[c][b], my soul takes no pleasure in him.
translation:
  language: hi
  text: परन्तु मेरा धर्मी जन विश्वास से जीवित रहेगा[a]; और यदि वह पीछे हट जाए[b], तो मेरा प्राण उससे प्रसन्न नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विश्वासयोग्यता से’ अथवा ‘भरोसे से’। यूनानी शब्द πίστις में ये अर्थ भी हो सकते हैं; मुख्य पाठ में ‘विश्वास’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘वह’ और ‘उससे’ एकवचन रूप हैं और यहाँ प्रतिनिधिक रूप से प्रयुक्त हो सकते हैं; कथन केवल पुरुषों तक सीमित होना आवश्यक नहीं है। कुछ पाण्डुलिपियों में ‘मेरा धर्मी जन’ के स्थान पर केवल ‘धर्मी जन’ है।
    reason: cultural_note_and_textual_variant
lexical_decisions:
- source_word: ὁ δὲ δίκαιός μου
  choice: परन्तु मेरा धर्मी जन
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण δίκαιός को ‘धर्मी जन’ कहना स्वाभाविक और गरिमापूर्ण हिन्दी है। SBLGNT के μου को ‘मेरा’ के रूप में रखा गया है।
- source_word: ἐκ πίστεως
  choice: विश्वास से
  rationale: ἐκ यहाँ आधार या स्रोत दर्शाता है। πίστις के लिए मुख्य पाठ में सामान्य अनुवाद ‘विश्वास’ रखा गया है; ‘विश्वासयोग्यता’ और ‘भरोसा’ की सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: ζήσεται
  choice: जीवित रहेगा
  rationale: भविष्यकाल को सीधे व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὑποστείληται
  choice: पीछे हट जाए
  rationale: दबाव या भय के कारण लौटने अथवा पीछे हटने का भाव स्पष्ट करता है और इब्रानियों के चेतावनी-प्रसंग के अनुकूल है।
- source_word: οὐκ εὐδοκεῖ
  choice: प्रसन्न नहीं होता
  rationale: εὐδοκέω के ‘प्रसन्न होना/सन्तोष पाना’ अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: ἡ ψυχή μου
  choice: मेरा प्राण
  rationale: यूनानी के स्पष्ट ‘मेरा प्राण’ को केवल ‘मैं’ में सपाट किए बिना शास्त्रीय उद्धरण की व्यक्तिगत और सजीव अभिव्यक्ति बनाए रखता है।
- source_word: ἐν αὐτῷ
  choice: उससे
  rationale: εὐδοκέω के साथ हिन्दी में ‘उससे प्रसन्न होना’ स्वाभाविक है और यूनानी ἐν αὐτῷ का प्रसंगानुकूल अर्थ देता है।
theological_decisions:
- issue: ἐκ πίστεως में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता या भरोसा
  rationale: मुख्य पाठ में प्रचलित ‘विश्वास’ रखा गया है, जबकि हबक्कूक की प्रतिध्वनि और शब्द की अर्थ-सीमा के कारण अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- issue: ‘यदि वह पीछे हट जाए’ का कर्ता
  choice: उसी एकवचन व्यक्ति के रूप में व्याकरणिक प्रवाह बनाए रखना
  alternative: ‘कोई पीछे हट जाए’ कहकर अलग अनिश्चित व्यक्ति मानना
  rationale: यूनानी में कथन एकवचन रूप में आगे बढ़ता है और कर्ता-परिवर्तन स्पष्ट नहीं किया गया। इसलिए चेतावनी से उत्पन्न धर्मवैचारिक तनाव को हल्का या समाप्त नहीं किया गया।
- issue: एकवचन पुल्लिंग का प्रतिनिधिक प्रयोग
  choice: ‘वह’ और ‘उससे’
  alternative: बहुवचन या स्पष्ट लिंग-निरपेक्ष पुनर्लेखन
  rationale: हिन्दी का ‘वह’ संदर्भ में एकवचन बनाए रखता है, पर अपने रूप में अनावश्यक रूप से पुरुष-विशेष नहीं ठहराता; प्रतिनिधिक अर्थ पादटिप्पणी में स्पष्ट है।
- issue: μου की पाठांतर स्थिति
  choice: ‘मेरा धर्मी जन’
  alternative: ‘धर्मी जन’
  rationale: दिए गए SBLGNT पाठ में μου उपस्थित है; कुछ पाण्डुलिपियों में इसके लोप को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धर्मी जन’, ‘विश्वास से जीवित रहेगा’ और ‘मेरा प्राण’ मूल की संरचना तथा शास्त्रीय प्रतिध्वनि को सँभालते हैं; ‘पीछे हट जाए’ चेतावनी के प्रसंग में सहज आधुनिक प्रयोग है।
