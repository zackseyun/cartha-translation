  text: ἀθετήσας τις νόμον Μωϋσέως χωρὶς οἰκτιρμῶν ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν ἀποθνῄσκει·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/028.yaml
  text: Anyone who has set aside the law of Moses dies without mercy on the testimony of two or three witnesses[a].
translation:
  language: hi
  text: मूसा की व्यवस्था को ठुकराने वाला कोई भी व्यक्ति दो या तीन गवाहों की गवाही के आधार पर बिना दया के मरता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे मृत्युदंड दिया जाता है।” यूनानी में शाब्दिक रूप से “मरता है” है, पर संदर्भ मूसा की व्यवस्था के अधीन न्यायिक मृत्युदंड का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀθετήσας
  choice: ठुकराने वाला
  rationale: यह ἀθετέω के उस भाव को व्यक्त करता है जिसमें किसी अधिकारपूर्ण व्यवस्था को अस्वीकार या अमान्य किया जाता है। यह केवल किसी एक आज्ञा के उल्लंघन से अधिक व्यापक है, फिर भी हिंदी में स्वाभाविक है।
- source_word: τις
  choice: कोई भी व्यक्ति
  rationale: अनिश्चित सर्वनाम यहाँ सामान्य रूप से किसी भी व्यक्ति पर लागू होता है। यह अभिव्यक्ति आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: νόμον Μωϋσέως
  choice: मूसा की व्यवस्था
  rationale: यह यूनानी संबंधकारक रचना का निकट और हिंदी बाइबलीय संदर्भ में सहज अनुवाद है।
- source_word: χωρὶς οἰκτιρμῶν
  choice: बिना दया के
  rationale: οἰκτιρμῶν का बहुवचन यहाँ भाववाचक अर्थ देता है। न्यायिक संदर्भ में ‘बिना दया के’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἐπὶ δυσὶν ἢ τρισὶν μάρτυσιν
  choice: दो या तीन गवाहों की गवाही के आधार पर
  rationale: ἐπί के साथ संप्रदान कारक निर्णय के आधार को दर्शाता है। ‘गवाही के आधार पर’ न्यायिक आशय को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: ἀποθνῄσκει
  choice: मरता है
  rationale: यूनानी क्रिया का प्रत्यक्ष अर्थ ‘मरता है’ है और वर्तमान काल सामान्य कानूनी परिणाम बताता है। न्यायिक मृत्युदंड का आशय संदर्भ से निकलता है; उसे मुख्य पाठ में अनावश्यक रूप से अधिक स्पष्ट नहीं किया गया।
theological_decisions:
- issue: क्या ἀποθνῄσκει के न्यायिक अथवा मृत्युदंड संबंधी भाव को मुख्य पाठ में स्पष्ट किया जाए
  choice: मुख्य पाठ में अधिक शाब्दिक ‘मरता है’ रखा गया है।
  alternative: उसे मृत्युदंड दिया जाता है
  rationale: मूसा की व्यवस्था और दो या तीन गवाहों का संदर्भ न्यायिक मृत्युदंड की ओर संकेत करता है, पर यूनानी में स्पष्ट कारक अथवा कर्मवाच्य अभिव्यक्ति के बजाय केवल ‘मरता है’ है। इसलिए स्रोत की संयमित अभिव्यक्ति मुख्य पाठ में सुरक्षित रखी गई और अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘व्यवस्था,’ ‘गवाह’ और ‘गवाही’ कानूनी-बाइबलीय संदर्भ को स्पष्ट रखते हैं; मुख्य पाठ स्रोत की संक्षिप्तता और न्यायिक तनाव को बनाए रखता है।
