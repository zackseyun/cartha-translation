source:
  edition: SBLGNT
  text: ⸀καὶ τῶν ἁμαρτιῶν αὐτῶν καὶ τῶν ἀνομιῶν αὐτῶν οὐ μὴ ⸀μνησθήσομαι ἔτι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/017.yaml
  text: and I will no longer remember their sins and their lawless deeds[a][b].
translation:
  language: hi
  text: और मैं उनके पापों और उनके अधर्मपूर्ण कामों को अब फिर कभी स्मरण नहीं करूँगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और मैं उनके पापों और उनके अधर्मपूर्ण कामों को निश्चय ही अब और स्मरण नहीं करूँगा।”'
    reason: मूल यूनानी में οὐ μή दृढ़ निषेध व्यक्त करता है, और ἔτι का अर्थ यहाँ ‘अब और’ या ‘फिर कभी’ है।
  - marker: b
    text: “अधर्मपूर्ण कामों” का अनुवाद “व्यवस्था-विरुद्ध कर्मों” या पारंपरिक रूप से “अधर्मों” भी किया जा सकता है।
    reason: ἀνομίαι के संभावित शाब्दिक और पारंपरिक हिन्दी रूपों को दर्शाना।
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह संयोजक इस वाक्यांश को पहले की वाचा-संबंधी प्रतिज्ञा से जोड़ता है, इसलिए आरंभ में बनाए रखा गया है।
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: उनके पापों
  rationale: बहुवचन ἁμαρτίαι का सीधा और प्रचलित हिन्दी समतुल्य ‘पाप’ है; संबंधवाचक αὐτῶν को ‘उनके’ से व्यक्त किया गया है।
- source_word: καὶ τῶν ἀνομιῶν αὐτῶν
  choice: और उनके अधर्म के कामों
  rationale: ἀνομία व्यवस्था-विरोध, अधर्म या व्यवस्था के उल्लंघन को दर्शाता है। ‘अधर्म के काम’ बहुवचन के ठोस भाव को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: οὐ μὴ μνησθήσομαι
  choice: स्मरण नहीं करूँगा
  rationale: οὐ μή के साथ भविष्यकाल दृढ़ निषेध व्यक्त करता है। ‘स्मरण’ की बाइबलीय संकल्पना को किसी व्याख्यात्मक पदबंध से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: ἔτι
  choice: फिर कभी
  rationale: निषेध के साथ ἔτι का अर्थ ‘अब और नहीं’ या ‘फिर कभी नहीं’ है। ‘फिर कभी’ दृढ़ निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा पापों का स्मरण न करना
  choice: ‘मैं ... फिर कभी स्मरण नहीं करूँगा’ के रूप में वाचा-संबंधी कथन को सीधे बनाए रखा गया है।
  alternative: ‘मैं ... को निश्चय ही फिर स्मरण नहीं करूँगा’ या अर्थ खोलकर ‘मैं ... को उनके विरुद्ध नहीं गिनूँगा।’
  rationale: मूल पाठ परमेश्वर के ‘स्मरण न करने’ की भाषा प्रयोग करता है। इसे बनाए रखने से क्षमा की वाचा-संबंधी प्रतिज्ञा और उसकी धर्मवैज्ञानिक गहराई सुरक्षित रहती है, जबकि परमेश्वर के ज्ञान के विषय में कोई अतिरिक्त दार्शनिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘स्मरण’ को बाइबलीय और धर्मवैज्ञानिक प्रतिध्वनि के कारण रखा गया है; ‘अधर्म के काम’ सामान्य पाठक के लिए ‘अधर्मों’ से अधिक स्पष्ट है।
