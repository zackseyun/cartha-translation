source:
  edition: SBLGNT
  text: ἀνώτερον λέγων ὅτι ⸂Θυσίας καὶ προσφορὰς⸃ καὶ ὁλοκαυτώματα καὶ περὶ ἁμαρτίας οὐκ ἠθέλησας οὐδὲ εὐδόκησας, αἵτινες κατὰ ⸀νόμον προσφέρονται,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/008.yaml
  text: After saying above[a], “Sacrifices and offerings and whole burnt offerings and sin offerings you did not desire[c][b], nor did you delight in”—which are offered according to the law—
translation:
  language: hi
  text: ऊपर वह कहता है, “बलिदान और भेंटें, और पूर्णतः जलाए जाने वाले बलिदान[a], और पाप-बलिदान[b] न तो तूने चाहे, न उनसे प्रसन्न हुआ”—जो व्यवस्था के अनुसार चढ़ाए जाते हैं—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “होमबलि।” यूनानी शब्द उस बलिदान को दर्शाता है जो वेदी पर पूरी तरह जला दिया जाता था।
    reason: lexical_alternative
  - marker: b
    text: या “पाप के लिए चढ़ाए जाने वाले बलिदान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀνώτερον λέγων
  choice: ऊपर वह कहता है
  rationale: यह पद पहले उद्धृत कथन की ओर संकेत करता है। यह हिन्दी में स्वाभाविक है और यूनानी वर्तमान कृदन्त के कथनात्मक कार्य को बनाए रखता है।
- source_word: Θυσίας καὶ προσφορὰς
  choice: बलिदान और भेंटें
  rationale: दोनों अलग बलिदानी शब्दों को स्पष्ट और प्रचलित धार्मिक शब्दावली में बनाए रखा गया है।
- source_word: ὁλοκαυτώματα
  choice: पूर्णतः जलाए जाने वाले बलिदान
  rationale: यह शब्द वेदी पर पूरी तरह जला दिए जाने वाले बलिदान को सूचित करता है; हिन्दी रूप उस विशिष्टता को स्पष्ट करता है।
- source_word: περὶ ἁμαρτίας
  choice: पाप-बलिदान
  rationale: बलिदानी प्रसंग में यह पाप के लिए निर्धारित बलिदान की तकनीकी श्रेणी है।
- source_word: οὐκ ἠθέλησας οὐδὲ εὐδόκησας
  choice: न तो तूने चाहे, न उनसे प्रसन्न हुआ
  rationale: दोनों यूनानी क्रियाओं का भेद रखा गया है। ‘तू’ भजन के सीधे उद्धरण में परमेश्वर के प्रति एकवचन संबोधन को दर्शाता है; ‘उनसे’ हिन्दी में दूसरे खंड का आशय स्वाभाविक रूप से स्पष्ट करता है।
- source_word: κατὰ νόμον προσφέρονται
  choice: व्यवस्था के अनुसार चढ़ाए जाते हैं
  rationale: व्यवस्था के निर्देशों के अनुरूप बलिदान चढ़ाए जाने का सामान्य वर्तमान निष्क्रिय भाव सुरक्षित है।
theological_decisions:
- issue: व्यवस्था द्वारा निर्धारित बलिदानों के प्रति परमेश्वर के नकारात्मक कथन को कैसे व्यक्त किया जाए
  choice: “न तो तूने चाहे, न उनसे प्रसन्न हुआ”—जबकि ये व्यवस्था के अनुसार चढ़ाए जाते हैं—
  alternative: “तूने न तो इन्हें चाहा, न इनमें आनंद लिया”—जो व्यवस्था के अधीन चढ़ाए जाते हैं—
  rationale: अनुवाद भजन के कथन और इस तथ्य के बीच तनाव को बनाए रखता है कि ये बलिदान व्यवस्था के अनुसार चढ़ाए जाते थे; वह यह व्याख्या नहीं जोड़ता कि व्यवस्था अवैध थी या परमेश्वर ने उसे कभी स्वीकार नहीं किया।
- issue: बलिदानी श्रेणियों की विशिष्टता
  choice: बलिदान और भेंटें, और पूर्णतः जलाए जाने वाले बलिदान, और पाप-बलिदान
  alternative: बलिदान और चढ़ावे, होमबलि और पाप के लिए भेंटें
  rationale: सूची की अलग-अलग उपासना-संबंधी श्रेणियाँ सुरक्षित रखी गई हैं, बिना आसपास के धर्मवैज्ञानिक तर्क को पद के भीतर विस्तार देने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली अपनाई गई है। बलिदानी शब्दावली स्पष्ट रखी गई है। पद की अपूर्ण, अगले वाक्य में आगे बढ़ने वाली संरचना को अंतिम दीर्घ विराम-चिह्न से बनाए रखा गया है।
