  text: Ἀναμιμνῄσκεσθε δὲ τὰς πρότερον ἡμέρας, ἐν αἷς φωτισθέντες πολλὴν ἄθλησιν ὑπεμείνατε παθημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/032.yaml
  text: But remember the former days[a], when, after you were enlightened, you endured a great struggle of sufferings[c][b],
translation:
  language: hi
  text: पर उन बीते दिनों को याद करो, जब ज्योति पाने के बाद[a] तुमने दुःखों का एक बड़ा संघर्ष[b] सहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तुमने ज्योति पाई।” यूनानी कृदन्त को मुख्य क्रिया से पहले हुई क्रिया अथवा उसी समय की परिस्थिति के रूप में समझा जा सकता है। यहाँ “ज्योति पाना” आत्मिक प्रकाश प्राप्त करने का व्यापक रूपक है; पद स्वयं इसे मन-परिवर्तन, बपतिस्मा या विश्वास की शिक्षा में से किसी एक तक सीमित नहीं करता।
    reason: lexical_alternative
  - marker: b
    text: या, “दुःखों की एक कठिन प्रतियोगिता।” यूनानी संज्ञा में संघर्ष या मुकाबले का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναμιμνῄσκεσθε
  choice: याद करो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; प्रसंग में पहले के अनुभवों को स्मरण करने का आह्वान है।
- source_word: δὲ
  choice: पर
