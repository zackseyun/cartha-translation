- source_word: τὰς πρότερον ἡμέρας
  choice: उन बीते दिनों
  rationale: पहले के समय की ओर संकेत को स्पष्ट, संक्षिप्त और वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν αἷς
  choice: जब
  rationale: शाब्दिक अर्थ ‘जिनमें’ है, पर यहाँ संबंध कालवाचक है; ‘जब’ हिन्दी में अधिक सहज है।
- source_word: φωτισθέντες
  choice: ज्योति पाने के बाद
  rationale: मूल के प्रकाश-संबंधी रूपक को बनाए रखता है और कृदन्त की मुख्य क्रिया से सामान्यतः पूर्ववर्ती क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे किसी विशिष्ट धार्मिक संस्कार या अनुभव तक सीमित किए।
- source_word: πολλὴν ἄθλησιν
  choice: एक बड़ा संघर्ष
  rationale: ἄθλησις में कठिन मुकाबले या प्रतियोगिता का भाव है; ‘बड़ा संघर्ष’ उसकी तीव्रता को सहज हिन्दी में बनाए रखता है।
- source_word: ὑπεμείνατε
  choice: सहा था
  rationale: बीते समय में कठिनाई के नीचे टिके रहने और उसे सहने का भाव व्यक्त करता है।
- source_word: παθημάτων
  choice: दुखों से भरा
  rationale: यह संबंधकारक बहुवचन संघर्ष की प्रकृति बताता है। ‘दुखों से भरा’ हिन्दी में ‘दुखों का संघर्ष’ की अपेक्षा अधिक स्वाभाविक है और अनुभव किए गए कष्टों का व्यापक अर्थ रखता है।
theological_decisions:
- issue: चेतावनी और प्रोत्साहन के प्रसंग में φωτισθέντες का आशय
  choice: ‘ज्योति पाने’ का रूपक बनाए रखा गया है।
  alternative: ‘मन-परिवर्तन के बाद’, ‘बपतिस्मा लेने के बाद’, या ‘सुसमाचार का प्रकाश पाने के बाद’।
  rationale: पद पूर्व में प्राप्त आत्मिक प्रकाश की ओर संकेत करता है, पर यह स्वयं नहीं बताता कि उसका तात्पर्य मन-परिवर्तन, बपतिस्मा, या विश्वास की शिक्षा में से विशेष रूप से किससे है। रूपक को बनाए रखने से मूल की धर्मवैचारिक व्यापकता और तनाव सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज्योति पाने’ द्वारा मूल रूपक सुरक्षित है, जबकि ‘दुखों से भरा एक बड़ा संघर्ष’ यूनानी संबंध को शब्दशः अस्वाभाविक बनाए बिना व्यक्त करता है।
