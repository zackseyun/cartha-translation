revisions:
- from: तो आओ, हम सच्चे मन से और विश्वास के पूरे भरोसे के साथ परमेश्वर के निकट जाएँ—हमारे मन बुरे विवेक से शुद्ध करने के लिए छिड़के गए हों,[a][b] और हमारे शरीर शुद्ध जल से धोए गए हों।[c]
  to: आओ, हम सच्चे हृदय[a] से और विश्वास के पूरे भरोसे के साथ निकट जाएँ—बुरे विवेक[b] से छिड़काव द्वारा शुद्ध किए हुए हृदयों और शुद्ध जल से धोए हुए शरीरों के साथ।[c]
  rationale: The revision removes an unexpressed object, restores “हृदय” for καρδία, and recasts the participial material as completed cleansing states. “छिड़काव द्वारा शुद्ध किए हुए” retains both the sprinkling image and the separation/cleansing sense of ἀπό without treating baptism as explicit. The footnotes retain the audit trail’s alternatives and are anchored at the relevant Hindi terms.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:37:15Z'
review_pass:
  verdict: revise
  source_fidelity: The hortatory force and purification imagery are substantially retained, but the draft adds “परमेश्वर” although it is not expressed in this verse, and “शुद्ध करने के लिए” can sound purposive rather than describing the completed cleansing state of the perfect participle.
  naturalness: The current wording is generally understandable, but “हमारे मन ... छिड़के गए हों” is less natural and less precise than an adjectival participial construction. “हृदय” better preserves the source’s καρδίας and is natural in this elevated exhortational register.
  terminology: “विश्वास,” “बुरा विवेक,” “शुद्ध जल,” and “बपतिस्मा” are suitable. “हृदय” should be used consistently for καρδία rather than “मन,” which can narrow or shift the source image. Footnote anchors should be placed immediately after the terms they explain.
  issues:
  - severity: medium
    issue: “परमेश्वर के” is added to the main text.
    rationale: The immediately preceding context identifies the one approached, but προσερχώμεθα in this verse has no expressed object. The Hindi should not add it in a source-focused rendering.
  - severity: medium
    issue: “बुरे विवेक से शुद्ध करने के लिए छिड़के गए” can express purpose rather than completed cleansing.
    rationale: ῥεραντισμένοι is a perfect passive participle describing a state accompanying the exhortation. The revision makes the cleansing result and sprinkling image explicit without making the phrase purposive.
  - severity: low
    issue: Footnote anchors are not attached to their respective expressions.
    rationale: Marker a belongs after “सच्चे हृदय” and marker b after “बुरे विवेक,” rather than both appearing at the end of the participial clause.
