language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσερχώμεθα μετὰ ἀληθινῆς καρδίας ἐν πληροφορίᾳ πίστεως, ῥεραντισμένοι τὰς καρδίας ἀπὸ συνειδήσεως πονηρᾶς καὶ λελουσμένοι τὸ σῶμα ὕδατι καθαρῷ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/022.yaml
  text: let us draw near with a true heart in full assurance of faith[d][c][b][a], with our hearts sprinkled clean from an evil conscience and our bodies washed with pure water.
translation:
  language: hi
  text: आओ, हम सच्चे हृदय[a] से और विश्वास के पूरे भरोसे के साथ निकट जाएँ—बुरे विवेक[b] से छिड़काव द्वारा शुद्ध किए हुए हृदयों और शुद्ध जल से धोए हुए शरीरों के साथ।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सच्चे हृदय’ का अनुवाद ‘निष्कपट हृदय’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बुरे विवेक’ का अनुवाद ‘दोषी विवेक’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह भाषा अनुष्ठानिक शुद्धि की याद दिलाती है और कुछ पाठकों को इसमें बपतिस्मा की प्रतिध्वनि भी सुनाई दे सकती है; पर यह पद स्वयं इस धोने को स्पष्ट रूप से बपतिस्मा नहीं कहता।
    reason: cultural_note
lexical_decisions:
- source_word: προσερχώμεθα
  choice: आओ, हम ... परमेश्वर के निकट जाएँ
  rationale: वर्तमान hortatory subjunctive के सामूहिक आह्वान को स्वाभाविक हिन्दी में व्यक्त करता है। संदर्भ में निकट जाना परमेश्वर की उपस्थिति तक पहुँचने का भाव रखता है; स्पष्टता के लिए कर्म ‘परमेश्वर’ व्यक्त किया गया है।
- source_word: μετὰ ἀληθινῆς καρδίας
  choice: सच्चे मन से
  rationale: ἀληθινός के ‘सच्चा, वास्तविक, निष्कपट’ अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है; ‘निष्कपट मन’ सम्भव विकल्प है।
- source_word: ἐν πληροφορίᾳ πίστεως
  choice: विश्वास के पूरे भरोसे के साथ
  rationale: πληροφορία की पूर्ण निश्चितता/आश्वस्तता और πίστις के विश्वास के भाव को आधुनिक, सुबोध हिन्दी में व्यक्त करता है।
- source_word: ῥεραντισμένοι τὰς καρδίας
  choice: हमारे मन ... छिड़के गए हों
  rationale: पूर्ण निष्क्रिय कृदन्त से प्राप्त शुद्ध अवस्था और छिड़काव की बलिदानी/अनुष्ठानिक छवि बनाए रखी गई है। हिन्दी में ‘हृदय’ की अपेक्षा ‘मन’ विवेक के साथ अधिक स्वाभाविक है।
- source_word: ἀπὸ συνειδήσεως πονηρᾶς
  choice: बुरे विवेक से शुद्ध करने के लिए
  rationale: πονηρός को संकुचित करके केवल ‘दोषी’ नहीं किया गया। ἀπό के अलगावकारी परिणाम को हिन्दी में स्पष्ट किया गया, जबकि छिड़काव की छवि सुरक्षित है।
- source_word: λελουσμένοι τὸ σῶμα
  choice: हमारे शरीर ... धोए गए हों
  rationale: पूर्ण कृदन्त की समानान्तर, प्राप्त अवस्था को रखता है। यूनानी का एकवचन σῶμα बहुवचन समुदाय के प्रत्येक व्यक्ति पर वितरणात्मक रूप से लागू होता है; हिन्दी में ‘हमारे शरीर’ स्वाभाविक है।
- source_word: ὕδατι καθαρῷ
  choice: शुद्ध जल से
  rationale: καθαρός के स्वच्छता और अनुष्ठानिक शुद्धता दोनों आयामों को ‘शुद्ध’ सुरक्षित रखता है।
theological_decisions:
- issue: क्या शरीर को शुद्ध जल से धोने को मुख्य पाठ में स्पष्ट रूप से बपतिस्मा कहा जाए
  choice: धोने और शुद्ध जल की मूल छवि रखी गई, पर बपतिस्मा का स्पष्ट नाम नहीं जोड़ा गया
  alternative: इसे सीधे बपतिस्मा कहना, अथवा केवल आन्तरिक रूपक मानना
  rationale: पद अनुष्ठानिक शुद्धि की भाषा प्रयोग करता है और पाठकों को बपतिस्मा की प्रतिध्वनि सुनाई दे सकती है, किन्तु वह स्वयं इस धोने की स्पष्ट पहचान नहीं करता।
- issue: συνειδήσεως πονηρᾶς का अर्थ
  choice: बुरा विवेक
  alternative: दोषी विवेक
  rationale: ‘दोषी’ सम्भव प्रसंगगत अर्थ है, पर πονηρός का मूल पद अधिक व्यापक रूप से ‘बुरा’ कहता है; अनुवाद उस नैतिक और अनुष्ठानिक व्यापकता को बनाए रखता है।
- issue: ῥεραντισμένοι ... ἀπό में शुद्धि के परिणाम को कितना स्पष्ट किया जाए
  choice: ‘शुद्ध करने के लिए छिड़के गए’
  alternative: शाब्दिक ‘बुरे विवेक से छिड़के गए’
  rationale: शाब्दिक संरचना हिन्दी में अस्पष्ट और अस्वाभाविक होगी। चुना गया रूप ἀπό से व्यक्त अलगाव/शुद्धि का परिणाम स्पष्ट करता है, बिना छिड़काव की छवि हटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी, सामूहिक उपदेशात्मक लहजा और गरिमापूर्ण किन्तु सहज शब्दावली। ‘निकट जाएँ’, ‘छिड़के गए’ और ‘शुद्ध जल’ से इब्रानियों के उपासना तथा शुद्धि-संबंधी बिंब सुरक्षित रखे गए हैं।
