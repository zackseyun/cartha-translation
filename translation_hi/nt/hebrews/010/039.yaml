id: HEB.10.39
reference: Hebrews 10:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡμεῖς δὲ οὐκ ἐσμὲν ὑποστολῆς εἰς ἀπώλειαν, ἀλλὰ πίστεως εἰς περιποίησιν ψυχῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/039.yaml
  text: But we are not of shrinking back to destruction[d][c][b][a], but of faith to the preservation of the soul.
translation:
  language: hi
  text: पर हम विनाश की ओर पीछे हटनेवालों[a] में से नहीं हैं, बल्कि प्राण की रक्षा[c] के लिए विश्वास[b] रखनेवालों में से हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लौट जानेवालों’। यूनानी शब्द पीछे हटने या लौट जाने को दर्शाता है; कुछ लोग यहाँ इसे अधिक तीव्र अर्थ में ‘धर्मत्याग’ समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘निष्ठा रखनेवालों’। यहाँ ‘विश्वास’ में विश्वासयोग्य बने रहने का भाव भी सम्मिलित हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘प्राण को प्राप्त करने’ अथवा ‘जीवन को बचाने के लिए’। यूनानी पद व्यक्ति के प्राण, जीवन या स्वयं के संरक्षण अथवा प्राप्ति की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡμεῖς δὲ
  choice: पर हम
  rationale: स्पष्ट सर्वनाम और विरोधसूचक δὲ दोनों को रखा गया है, ताकि पिछले प्रसंग की चेतावनी के साथ तीखा विरोध प्रकट हो।
- source_word: ὑποστολῆς
  choice: पीछे हटनेवालों
  rationale: मूल संज्ञा पीछे हटने या लौट जाने का भाव देती है। हिन्दी में श्रेणी या संबंध बतानेवाले संबंधकारक प्रयोग को स्वाभाविक बनाने के लिए इसे व्यक्ति-सूचक रूप में व्यक्त किया गया है, पर इसे निश्चित रूप से ‘धर्मत्याग’ नहीं कहा गया।
- source_word: εἰς ἀπώλειαν
  choice: विनाश की ओर
  rationale: εἰς के लक्ष्य या परिणाम के भाव और ἀπώλεια की गंभीरता को स्पष्ट तथा प्रचलित हिन्दी में व्यक्त करता है।
- source_word: πίστεως
  choice: विश्वास रखनेवालों
  rationale: πίστις का मूल अर्थ ‘विश्वास’ रखा गया है; इस प्रसंग में धीरजपूर्ण निष्ठा का संभावित भाव पादटिप्पणी में दिया गया है।
- source_word: εἰς περιποίησιν ψυχῆς
  choice: प्राण की रक्षा के लिए
  rationale: विनाश के साथ विरोध के कारण περιποίησις के ‘संरक्षण/बचाव’ वाले अर्थ को मुख्य पाठ में चुना गया। ψυχή के लिए ‘प्राण’ व्यक्ति के जीवन या स्वयं को समेटता है और आधुनिक अर्थ में केवल देह से पृथक ‘आत्मा’ तक सीमित नहीं करता।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता या निष्ठापूर्ण दृढ़ता
  rationale: मुख्य पाठ में सामान्य और प्रत्यक्ष अर्थ रखा गया है, जबकि उपदेशात्मक संदर्भ में बने रहने की निष्ठा का भाव संभव है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: περιποίησις ψυχῆς का अर्थ
  choice: प्राण की रक्षा
  alternative: प्राण को प्राप्त करना या जीवन को बचाना
  rationale: निकटवर्ती ‘विनाश’ के साथ विरोध संरक्षण के अर्थ का समर्थन करता है, पर मूल पद की प्राप्ति, अधिकार और संरक्षण संबंधी व्यापक अर्थ-सीमा को पादटिप्पणी में बताया गया है।
- issue: ὑποστολή की तीव्रता
  choice: पीछे हटना
  alternative: धर्मत्याग
  rationale: मूल शब्द पीछे हटने या लौट जाने को व्यक्त करता है; यहाँ इसे अनिवार्य रूप से पूर्ण धर्मत्याग कहना पाठ से अधिक निश्चित व्याख्या होती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। मूल यूनानी के संक्षिप्त संबंधकारक ढाँचे को हिन्दी में ‘...वालों में से’ के समानांतर रूप द्वारा स्वाभाविक बनाया गया है। ‘आत्मा’ के बजाय ‘प्राण’ चुना गया है, ताकि ψυχή को केवल देह से पृथक आध्यात्मिक तत्व मानने की संकीर्ण आधुनिक धारणा न थोपी जाए।
