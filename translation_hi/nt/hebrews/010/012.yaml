  text: ⸀οὗτος δὲ μίαν ὑπὲρ ἁμαρτιῶν προσενέγκας θυσίαν εἰς τὸ διηνεκὲς ἐκάθισεν ἐν δεξιᾷ τοῦ θεοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/012.yaml
  text: But this one[a], after offering one sacrifice for sins for all time, sat down at the right hand of God[b],
translation:
  language: hi
  text: परन्तु इस एक ने पापों के लिए एक ही बलिदान चढ़ाकर, जो सदा के लिए प्रभावी है,[a] परमेश्वर के दाहिने हाथ पर बैठ गया,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापों के लिए सदा के लिए एक ही बलिदान चढ़ाकर।” यूनानी वाक्यांश का संबंध बलिदान चढ़ाने से अधिक निकटता से भी माना जा सकता है; तब बलिदान की स्थायी प्रभावशीलता पर बल पड़ता है। इसे “सदा के लिए परमेश्वर के दाहिने हाथ पर बैठ गया” से जोड़ना भी व्याकरण की दृष्टि से सम्भव है।
    reason: alternative_reading
  - marker: b
    text: “परमेश्वर के दाहिने हाथ” भजन 110:1 की प्रतिध्वनि है, जिसे इब्रानियों का पत्र मसीहा की महिमा और अधिकार के विषय में प्रमुख रूप से प्रयोग करता है।
    reason: cross_reference
lexical_decisions:
- source_word: οὗτος
  choice: इस एक ने
  rationale: संकेतवाचक बल और पिछले पद के बार-बार बलिदान चढ़ाने वाले याजकों से विरोध बनाए रखता है; केवल “उसने” की अपेक्षा यूनानी अभिव्यक्ति के अधिक निकट है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले पद में प्रतिदिन खड़े होकर बार-बार बलिदान चढ़ाने वाले याजकों और यहाँ वर्णित एकमात्र बलिदान के बीच विरोध प्रकट करता है।
- source_word: μίαν ... θυσίαν
  choice: एक ही बलिदान
  rationale: बलिदान की अद्वितीयता और न दोहराए जाने पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: पापों के लिए
  rationale: बलिदान के प्रयोजन को सहज हिन्दी में व्यक्त करते हुए यूनानी बहुवचन को बनाए रखता है।
- source_word: προσενέγκας
  choice: चढ़ाकर
  rationale: एओरिस्ट कृदन्त की मुख्य क्रिया से पूर्व घटित क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς τὸ διηνεκές
  choice: जो सदा के लिए प्रभावी है
  rationale: इब्रानियों के प्रसंग में एक बलिदान की स्थायी वैधता को स्पष्ट करता है, जबकि पादटिप्पणी वाक्यांश के व्याकरणिक संबंध की वास्तविक अस्पष्टता सुरक्षित रखती है।
- source_word: ἐκάθισεν
  choice: बैठ गया
  rationale: पूर्ण हुई क्रिया और याजकीय कार्य की समाप्ति के प्रसंगगत संकेत को स्वाभाविक रूप में बनाए रखता है।
- source_word: ἐν δεξιᾷ τοῦ θεοῦ
  choice: परमेश्वर के दाहिने हाथ
  rationale: सम्मान और अधिकार के स्थान की पारंपरिक, स्पष्ट अभिव्यक्ति है और भजन 110:1 की प्रतिध्वनि बनाए रखती है।
theological_decisions:
- issue: εἰς τὸ διηνεκές का संबंध
  choice: 'इसे एक बलिदान की स्थायी प्रभावशीलता से जोड़ा गया है: “जो सदा के लिए प्रभावी है।”'
  alternative: इसे सीधे बलिदान चढ़ाने से जोड़ा जा सकता है—“पापों के लिए सदा के लिए एक ही बलिदान चढ़ाकर”; अथवा बैठने से—“सदा के लिए परमेश्वर के दाहिने हाथ बैठ गया।”
  rationale: निकटवर्ती तर्क बार-बार चढ़ाए जाने वाले बलिदानों के विपरीत मसीह के एक बलिदान की स्थायी प्रभावशीलता पर बल देता है। फिर भी यूनानी शब्द-क्रम दूसरे संबंध की संभावना पूर्णतः समाप्त नहीं करता, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: ἐν δεξιᾷ τοῦ θεοῦ का मसीही अभिप्राय
  choice: “परमेश्वर के दाहिने हाथ” को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: मुख्य पाठ में इसे “सम्मान के स्थान पर” या “राजकीय अधिकार के स्थान पर” समझाकर लिखा जा सकता था।
  rationale: मूल रूपक और भजन 110:1 से उसका अंतर्पाठीय संबंध बनाए रखना किसी विशिष्ट धर्मसैद्धान्तिक व्याख्या को पाठ में जोड़ने से अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। “इस एक ने” कुछ चिह्नित अभिव्यक्ति है, पर यूनानी संकेतवाचक सर्वनाम और प्रसंगगत विरोध को सुरक्षित रखने के लिए चुनी गई। “बलिदान चढ़ाना” सामान्य पाठक के लिए स्पष्ट और धार्मिक प्रसंग में स्वाभाविक है।
