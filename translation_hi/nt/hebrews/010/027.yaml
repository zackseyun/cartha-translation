language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: φοβερὰ δέ τις ἐκδοχὴ κρίσεως καὶ πυρὸς ζῆλος ἐσθίειν μέλλοντος τοὺς ὑπεναντίους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/027.yaml
  text: but a fearful expectation of judgment[a], and a fury of fire about to consume the adversaries.
translation:
  language: hi
  text: पर न्याय की एक भयानक प्रतीक्षा और अग्नि का उग्र प्रकोप है, जो विरोधियों को भस्म करने वाला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβερὰ
  choice: भयानक
  rationale: यह विशेषण आने वाले न्याय की प्रतीक्षा को भयावह बताता है; ‘भयानक’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल की तीव्रता बनाए रखता है।
- source_word: δέ
  choice: बल्कि
  rationale: पद 26 के निषेध के बाद यह उसके विपरीत बची हुई भयावह संभावना प्रस्तुत करता है; इसलिए यहाँ विरोधसूचक ‘बल्कि’ उपयुक्त है।
- source_word: τις
  choice: एक
  rationale: अनिश्चित सर्वनाम को अलग से भारी या अस्वाभाविक बनाने के बजाय हिन्दी के अनिश्चित ‘एक’ से व्यक्त किया गया है।
- source_word: ἐκδοχὴ
  choice: प्रतीक्षा
  rationale: यह शब्द किसी आने वाली घटना की बाट जोहने या उसकी अपेक्षा करने का भाव रखता है। इस चेतावनी के संदर्भ में ‘प्रतीक्षा’ उसके निकट और स्वाभाविक है।
- source_word: κρίσεως
  choice: न्याय की
  rationale: κρίσις न्यायिक निर्णय को सूचित करता है। ‘न्याय’ व्यापक अर्थ बनाए रखता है और पद में न कही गई दंड-संबंधी विशिष्टताओं को नहीं जोड़ता।
- source_word: πυρὸς ζῆλος
  choice: आग का प्रचंड रोष
  rationale: ζῆλος में तीव्र आवेग, उग्रता या जोश का भाव है। इस विनाशकारी संदर्भ में ‘प्रचंड रोष’ वाक्यांश की सजीव शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘आग का’ मूल संबंध को बनाए रखता है।
- source_word: ἐσθίειν
  choice: भस्म करने
  rationale: आग के विषय में ‘भस्म करना’ मूल के ‘खा जाना/निगल जाना’ वाले विनाशकारी भाव का स्वाभाविक हिन्दी समतुल्य है।
- source_word: μέλλοντος
  choice: करने वाला है
  rationale: यह आने वाली, निकट या निश्चित रूप से प्रत्याशित क्रिया को व्यक्त करता है। ‘करने वाला है’ हिन्दी में भावी अभिमुखता को सहज रूप से दर्शाता है।
- source_word: τοὺς ὑπεναντίους
  choice: विरोधियों को
  rationale: यह उन लोगों को दर्शाता है जो विरोध में खड़े हैं। ‘विरोधी’ औपचारिक है और ‘शत्रु’ की अपेक्षा मूल के संबंधात्मक अर्थ के अधिक निकट है।
theological_decisions:
- issue: न्याय की अग्नि का स्वरूप
  choice: भस्म करने वाली आग की सजीव और कठोर छवि को बनाए रखा गया है, पर उसे पद से आगे बढ़ाकर किसी विशिष्ट दंड-सिद्धांत के रूप में परिभाषित नहीं किया गया।
  alternative: इसे स्पष्ट रूप से ‘अनन्त दंड’ कहना या केवल रूपक मानकर इसकी तीव्रता कम कर देना।
  rationale: यह पद आने वाले ईश्वरीय न्याय की गंभीर छवि देता है, पर इसी पद में उसकी अवधि या संपूर्ण तात्त्विक प्रकृति स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘भयानक’, ‘प्रचंड रोष’, ‘भस्म’ और ‘विरोधी’ चेतावनी के औपचारिक तथा सजीव स्वर को बनाए रखते हैं; अनावश्यक सांप्रदायिक या व्याख्यात्मक विस्तार से बचा गया है।
