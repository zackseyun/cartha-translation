  text: διὸ εἰσερχόμενος εἰς τὸν κόσμον λέγει· Θυσίαν καὶ προσφορὰν οὐκ ἠθέλησας, σῶμα δὲ κατηρτίσω μοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/005.yaml
  text: 'Therefore[a], when he comes into the world, he says: “Sacrifice and offering you did not desire, but a body you prepared for me.”'
translation:
  language: hi
  text: इसलिए, जब वह संसार में आता है, तो कहता है, “बलिदान और भेंट तूने नहीं चाहे, पर मेरे लिए एक देह तैयार की।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ इब्रानियों 10:5 भजन 40:6 के यूनानी पाठ का अनुसरण करता है: “मेरे लिए एक देह तैयार की।” भजन 40:6 के इब्रानी पाठ में है: “तूने मेरे लिए कान खोदे हैं।”'
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्षात्मक संबंध दिखाता है; ‘इसलिए’ सहज और स्पष्ट है।
- source_word: εἰσερχόμενος εἰς τὸν κόσμον
  choice: जब वह संसार में आता है
  rationale: वर्तमान कृदंत को स्वाभाविक हिन्दी कालवाचक उपवाक्य में रखा गया है और उद्धरण की जीवंत वर्तमान शैली बनाए रखी गई है।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमान काल पवित्रशास्त्र के उद्धरण को वर्तमान और प्रभावी वचन के रूप में प्रस्तुत करता है।
- source_word: Θυσίαν καὶ προσφορὰν
  choice: बलिदान और भेंट
  rationale: दोनों उपासना-संबंधी पदों को अलग और सामान्य श्रेणियों के रूप में बनाए रखा गया है।
- source_word: οὐκ ἠθέλησας
  choice: तूने नहीं चाही
  rationale: θέλω की इच्छा या चाह का अर्थ सुरक्षित रहता है; संयुक्त पदों के लिए हिन्दी में निकटतम स्त्रीलिंग संज्ञा के अनुसार ‘चाही’ स्वाभाविक है।
- source_word: σῶμα δὲ κατηρτίσω μοι
  choice: पर मेरे लिए एक देह तैयार की
  rationale: δὲ का विरोध ‘पर’ से, σῶμα का ठोस अर्थ ‘एक देह’ से, और दत्तिव μοι का हितार्थ ‘मेरे लिए’ से व्यक्त किया गया है।
theological_decisions:
- issue: इब्रानियों में भजन 40:6 का यूनानी पाठ इब्रानी भजन-पाठ से भिन्न है।
  choice: मुख्य पाठ में ‘मेरे लिए एक देह तैयार की’
  alternative: ‘मेरे कान खोले/खोद दिए’
  rationale: इस पद का स्रोत यूनानी इब्रानियों है, जिसमें स्पष्ट रूप से σῶμα (‘देह’) है। इब्रानी भजन की भिन्न शब्दावली को मुख्य पाठ में मिलाए बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। परमेश्वर को संबोधित उद्धरण में ‘तू’ रखा गया है, जो हिन्दी बाइबल-काव्य और प्रत्यक्ष प्रार्थनात्मक संबोधन में स्वाभाविक है।
