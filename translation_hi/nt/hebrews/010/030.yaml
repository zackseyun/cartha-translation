  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἴδαμεν γὰρ τὸν εἰπόντα· Ἐμοὶ ἐκδίκησις, ἐγὼ ⸀ἀνταποδώσω· καὶ πάλιν· ⸂Κρινεῖ κύριος⸃ τὸν λαὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/030.yaml
  text: For we know the one who said[a], “Vengeance is mine; I will repay,” and again[b], “The Lord will judge his people.”
translation:
  language: hi
  text: क्योंकि हम उसे जानते हैं जिसने कहा, “प्रतिशोध मेरा है; मैं बदला चुकाऊँगा।”[a] और फिर, “प्रभु अपने लोगों का न्याय करेगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “प्रतिशोध मेरा है।”
    reason: lexical_alternative
  - marker: b
    text: यह उद्धरण व्यवस्थाविवरण 32:35–36 की प्रतिध्वनि है। उसके मूल प्रसंग में “न्याय करेगा” में दंड देना और अपने लोगों के पक्ष में निर्णय करना—दोनों भाव हो सकते हैं; यहाँ चेतावनी का प्रसंग ईश्वरीय न्याय पर बल देता है।
    reason: cross_reference
lexical_decisions:
- source_word: οἴδαμεν γὰρ
  choice: क्योंकि हम जानते हैं
  rationale: οἶδα का पूर्ण रूप यहाँ वर्तमान अर्थ रखता है, और γάρ पिछले कथन का कारण स्पष्ट करता है।
- source_word: τὸν εἰπόντα
  choice: उसे ... जिसने कहा
  rationale: यह परमेश्वर को पवित्रशास्त्र के उक्त वचन का व्यक्तिगत वक्ता बताता है; हिंदी में यह स्वाभाविक संबंधवाचक रचना है।
- source_word: Ἐμοὶ ἐκδίκησις
  choice: बदला लेना मेरा काम है
  rationale: यूनानी वाक्यांश संक्षिप्त है—शाब्दिक रूप से ‘मेरे लिए/मुझसे प्रतिशोध।’ यह हिंदी अभिव्यक्ति अधिकार और उत्तरदायित्व दोनों को स्पष्ट करती है, बिना मनुष्य के प्रतिशोध को उचित ठहराए।
- source_word: ἐγὼ ἀνταποδώσω
  choice: मैं ही प्रतिफल दूँगा
  rationale: ἐγώ का स्पष्ट प्रयोग बल देता है; ‘ही’ उस बल को व्यक्त करता है। ‘प्रतिफल दूँगा’ दंडात्मक प्रतिदान के साथ क्रिया के व्यापक repayment/recompense अर्थ को बनाए रखता है।
- source_word: καὶ πάλιν
  choice: और फिर
  rationale: दूसरे उद्धरण को प्रस्तुत करने वाला स्वाभाविक हिंदी सूत्र है; स्रोत में निहित से अधिक कोई क्रिया नहीं जोड़ी गई।
- source_word: Κρινεῖ κύριος
  choice: प्रभु ... न्याय करेगा
  rationale: चेतावनी के प्रसंग में κρίνω का न्यायिक अर्थ प्रमुख है; ‘न्याय करेगा’ दंड और दोषमुक्ति, दोनों की संभावित अर्थ-सीमा को पूरी तरह बंद नहीं करता।
- source_word: τὸν λαὸν αὐτοῦ
  choice: अपने लोगों का
  rationale: ‘अपने’ यूनानी αὐτοῦ के स्वामित्व-संबंध को स्वाभाविक हिंदी में व्यक्त करता है और वाचा-संबंधी संकेत बनाए रखता है।
theological_decisions:
- issue: व्यवस्थाविवरण के उद्धरण में प्रतिशोध और न्याय की भाषा
  choice: “बदला लेना मेरा काम है; मैं ही प्रतिफल दूँगा” और “प्रभु अपने लोगों का न्याय करेगा”
  alternative: “प्रतिशोध मेरा है; मैं बदला चुकाऊँगा” तथा “प्रभु अपने लोगों को निर्दोष ठहराएगा”
  rationale: इब्रानियों 10 का निकट प्रसंग गंभीर चेतावनी और ईश्वरीय न्याय पर बल देता है। फिर भी ‘न्याय करेगा’ मूल क्रिया की उस अर्थ-सीमा को बनाए रखता है जिसमें प्रसंगानुसार दंड देना या पक्ष में निर्णय देना सम्मिलित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, सार्वजनिक-पाठ योग्य शैली। ‘बदला लेना मेरा काम है’ सामान्य पाठक के लिए सहज है; ‘प्रतिफल’ न्यायिक प्रतिदान की गरिमा बनाए रखता है।
