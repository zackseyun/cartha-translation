  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। उद्धरण में परमेश्वर के लिए एकवचन ‘तू’ रखा गया है, जो बाइबिलीय काव्यात्मक संबोधन में स्वाभाविक है।
