lexical_decisions:
- source_word: ὁλοκαυτώματα
  choice: सम्पूर्ण होमबलियों
  rationale: यह शब्द ऐसी बलियों को दर्शाता है जो आग में पूरी तरह चढ़ाई जाती थीं। ‘सम्पूर्ण होमबलियाँ’ इस विशेष अर्थ को स्पष्ट करता है।
- source_word: καὶ
  choice: और
  rationale: दो प्रकार की बलियों को जोड़ने वाला सामान्य समुच्चयबोधक है।
- source_word: περὶ ἁμαρτίας
  choice: पापबलियों
  rationale: बलिदान-संबंधी प्रसंग में यह यूनानी पदबंध पाप के लिए चढ़ाई जाने वाली बलि का पारिभाषिक संकेत है; हिन्दी में ‘पापबलि’ संक्षिप्त और स्वाभाविक धार्मिक शब्द है।
- source_word: οὐκ εὐδόκησας
  choice: न तू ... से प्रसन्न हुआ
  rationale: द्वितीय पुरुष एकवचन में परमेश्वर को संबोधन और निषेध, दोनों को स्पष्ट रखता है; ‘प्रसन्न हुआ’ εὐδοκέω के अनुमोदन और संतोष के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
