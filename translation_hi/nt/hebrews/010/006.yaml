  choice: ‘सम्पूर्ण होमबलियों और पापबलियों’ के रूप में दोनों विशिष्ट बलि-श्रेणियों को बनाए रखा गया।
  alternative: ‘होमबलियों और पाप के लिए बलियों’ अथवा सामान्यीकृत ‘बलिदानों’ का प्रयोग।
  rationale: इब्रानियों के तर्क में विशिष्ट बलि-प्रकारों और पुत्र के आज्ञाकारी आत्म-समर्पण का अंतर महत्वपूर्ण है; अनुवाद उस तनाव को समझाता नहीं, बल्कि मूल शब्दावली में सुरक्षित रखता है।
