  text: But in these sacrifices there is a reminder of sins year after year,[a]
translation:
  language: hi
  text: परन्तु इन बलिदानों में हर वर्ष पापों का स्मरण होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साल-दर-साल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’
  choice: परन्तु
  rationale: 'यह पिछले कथन के विपरीत परिणाम को सामने लाता है: बलिदान उपासकों को सिद्ध नहीं करते, बल्कि पापों की याद दिलाते हैं।'
- source_word: ἐν αὐταῖς
  choice: इन बलिदानों में
  rationale: स्त्रीलिंग बहुवचन सर्वनाम का संदर्भ पिछले पदों में उल्लिखित बलिदानों से है। संज्ञा को स्पष्ट करना हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: ἀνάμνησις
  choice: स्मरण कराया जाता है
  rationale: संज्ञा ἀνάμνησις किसी बात को याद में लाने या याद दिलाने का भाव रखती है। हिन्दी का यह कर्मवाच्य वाक्यांश अर्थ को सहज ढंग से व्यक्त करता है और यह निर्धारित नहीं करता कि स्मरण विशेष रूप से किसे कराया जाता है।
- source_word: ἁμαρτιῶν
  choice: पापों का
  rationale: सम्बन्धकारक रूप को सीधे 'पापों का' रखा गया है; पाप ही स्मरण की विषय-वस्तु हैं।
- source_word: κατ’ ἐνιαυτόν
  choice: साल-दर-साल
  rationale: यह पदबंध प्रत्येक वर्ष होने वाली पुनरावृत्ति बताता है। 'साल-दर-साल' उस निरन्तर वार्षिक दोहराव को स्वाभाविक आधुनिक हिन्दी में उभारता है।
theological_decisions:
- issue: αὐταῖς का संदर्भ
  choice: सर्वनाम को 'इन बलिदानों में' कहकर स्पष्ट किया गया है।
  alternative: '''उनमें'' कहकर सर्वनाम को अस्पष्ट रहने देना।'
  rationale: निकटवर्ती संदर्भ में बार-बार चढ़ाए जाने वाले बलिदान चर्चा का विषय हैं। संदर्भ को स्पष्ट करने से लेखक का आशय नहीं बदलता।
- issue: κατ’ ἐνιαυτόν का बल
  choice: '''साल-दर-साल'' द्वारा वार्षिक पुनरावृत्ति पर बल दिया गया है।'
  alternative: '''हर साल''।'
  rationale: दोनों अर्थतः सम्भव हैं, पर 'साल-दर-साल' इब्रानियों के तर्क में बलिदानों की लगातार पुनरावृत्ति को अधिक स्पष्ट रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'बलिदान' संदर्भ को स्पष्ट करता है, जबकि 'स्मरण कराया जाता है' यूनानी संज्ञात्मक रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
