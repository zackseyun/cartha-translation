  text: ἐν ᾧ θελήματι ἡγιασμένοι ⸀ἐσμὲν διὰ τῆς προσφορᾶς τοῦ σώματος Ἰησοῦ Χριστοῦ ἐφάπαξ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/010.yaml
  text: By that will we have been sanctified through the offering of the body of Jesus the Messiah once for all[a][b].
translation:
  language: hi
  text: उसी इच्छा[a] के द्वारा हम यीशु मसीह[b] की देह के एक ही बार सदा के लिए हुए अर्पण के द्वारा पवित्र किए गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “जिस इच्छा में।” संदर्भ में यह अभी बताई गई परमेश्वर की इच्छा की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “यीशु ख्रीस्त।” यूनानी Χριστός का अनुवाद “ख्रीस्त” भी किया जा सकता है; यहाँ इसे अर्थपूर्ण उपाधि “मसीह” के रूप में दिया गया है।
    reason: alternative_rendering
lexical_decisions:
- source_word: ἐν ᾧ θελήματι
  choice: उसी इच्छा के द्वारा
  rationale: यह पद पिछले संदर्भ में बताई गई परमेश्वर की इच्छा की ओर संकेत करता है। ‘के द्वारा’ यहाँ साधन का स्वाभाविक भाव व्यक्त करता है, जबकि यूनानी की अधिक शाब्दिक रचना को पादटिप्पणी में रखा गया है।
- source_word: ἡγιασμένοι ἐσμὲν
  choice: हम ... पवित्र किए गए हैं
  rationale: कृदंत और सहायक क्रिया से बनी पूर्णकालिक रचना अतीत में पूरा हुआ कार्य और उसका बना रहने वाला परिणाम, दोनों व्यक्त करती है।
- source_word: διὰ τῆς προσφορᾶς
  choice: अर्पण के माध्यम से
  rationale: सम्बन्धकारक के साथ διά साधन या माध्यम बताता है। ‘अर्पण’ προσφορά का सीधा और बलिदान-संदर्भ के अनुकूल अर्थ है।
- source_word: τοῦ σώματος Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह की देह
  rationale: यह स्वाभाविक हिन्दी में उस देह की पहचान स्पष्ट करता है जिसे अर्पित किया गया। Χριστός को अर्थपूर्ण उपाधि ‘मसीह’ के रूप में रखा गया है।
- source_word: ἐφάπαξ
  choice: एक ही बार सदा के लिए
  rationale: यह अर्पण के निर्णायक और न दोहराए जाने वाले स्वरूप को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: पवित्रीकरण का कालगत और धर्मवैज्ञानिक बल
  choice: ‘पवित्र किए गए हैं’—पूरा हुआ कार्य जिसका परिणाम बना हुआ है
  alternative: ‘पवित्र हैं’ अथवा ‘पवित्र किए जा रहे हैं’
  rationale: यूनानी रचना पूर्णकालिक है, वर्तमान प्रगतिशील नहीं। यह अनुवाद व्याकरणिक बल को बनाए रखता है और पवित्रीकरण के विषय में किसी विशेष सम्प्रदायगत व्यवस्था को आरोपित नहीं करता।
- issue: Χριστός की मसीहाई उपाधि
  choice: मसीह
  alternative: ख्रीस्त
  rationale: इस प्रसंग में Χριστός उपाधि का अर्थ वहन करता है; ‘मसीह’ आधुनिक हिन्दी में उसके अर्थ और परिचित बाइबलीय प्रयोग, दोनों को सुरक्षित रखता है।
- issue: एक बार किए गए अर्पण का बल
  choice: एक ही बार सदा के लिए
  alternative: एक बार
  rationale: ἐφάπαξ केवल घटना की संख्या नहीं, बल्कि उसके निर्णायक और अनावर्तनीय स्वरूप पर भी बल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पवित्र किए गए हैं’ धार्मिक शब्दावली को बनाए रखते हुए यूनानी पूर्णकाल का स्थायी परिणाम व्यक्त करता है; ‘देह के ... अर्पण’ मूल पाठ की ठोस शारीरिक बलिदान-छवि को सुरक्षित रखता है।
