id: HEB.10.9
reference: Hebrews 10:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τότε εἴρηκεν· Ἰδοὺ ἥκω τοῦ ⸀ποιῆσαι τὸ θέλημά σου· ἀναιρεῖ τὸ πρῶτον ἵνα τὸ δεύτερον στήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/009.yaml
  text: Then he said[a], ‘Behold, I have come to do your will.’ He takes away the first so that he may establish the second.
translation:
  language: hi
  text: फिर उसने कहा, “देख, मैं तेरी इच्छा पूरी करने आया हूँ।” वह पहले को हटा देता है, ताकि दूसरे को स्थापित करे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहला’ और ‘दूसरा’ संभवतः क्रमशः पहली बलिदान-व्यवस्था और मसीह के अर्पण में पूरी हुई परमेश्वर की इच्छा को दर्शाते हैं। इन्हें भजन के उद्धरण के पहले और दूसरे कथन, अथवा अधिक व्यापक रूप से पुरानी और नई वाचा, के रूप में भी समझा गया है।
    reason: ‘पहले’ और ‘दूसरे’ के संदर्भ की वास्तविक संक्षिप्तता और संभावित व्याख्याएँ बताना।
lexical_decisions:
- source_word: τότε
  choice: फिर
  rationale: यह क्रमसूचक क्रिया-विशेषण पिछले कथन से आगे की बात जोड़ता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक है।
- source_word: εἴρηκεν
  choice: उसने कहा
  rationale: यूनानी पूर्णकाल पूर्व में कहे गए कथन की वर्तमान प्रासंगिकता रख सकता है; हिन्दी में प्रसंगानुकूल सामान्य भूतकाल अधिक स्वाभाविक है।
- source_word: Ἰδοὺ
  choice: देख
  rationale: यह उद्धृत घोषणा की ओर ध्यान खींचने वाला उद्गार है; ‘देख’ शास्त्रीय प्रभाव बनाए रखते हुए सहज हिन्दी है।
- source_word: ἥκω
  choice: मैं … आया हूँ
  rationale: यह आगमन और उसके फलस्वरूप उपस्थित होने का भाव व्यक्त करता है।
- source_word: τοῦ ποιῆσαι τὸ θέλημά σου
  choice: तेरी इच्छा पूरी करने
  rationale: सप्रत्यय क्रियारूप उद्देश्य बताता है। ‘इच्छा पूरी करना’ हिन्दी में स्वाभाविक है और परमेश्वर की इच्छा को कार्यरूप देने का अर्थ स्पष्ट करता है।
- source_word: ἀναιρεῖ
  choice: हटा देता है
  rationale: प्रसंग में पहले को अलग कर देने या निष्प्रभावी करने का अर्थ है; यह ‘नष्ट करता है’ या विधिवत ‘रद्द करता है’ जैसी अधिक निर्णायक व्याख्या से बचता है।
- source_word: τὸ πρῶτον
  choice: पहले को
  rationale: यूनानी में विशेषण संज्ञा के रूप में प्रयुक्त है। संक्षिप्त रूप बनाए रखने से उसका संदर्भ प्रसंग द्वारा खुलता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का संबंध सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸ δεύτερον
  choice: दूसरे को
  rationale: ‘पहले’ के समानांतर संक्षिप्त संज्ञात्मक प्रयोग मूल की अलंकारिक तुलना बनाए रखता है।
- source_word: στήσῃ
  choice: स्थापित करे
  rationale: यह किसी वस्तु को कायम करने या प्रभाव में लाने का भाव देता है और ‘हटा देता है’ के साथ मूल विरोध को बनाए रखता है।
theological_decisions:
- issue: ‘पहले’ और ‘दूसरे’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘पहले’ और ‘दूसरे’ रखा गया है।
  alternative: इन्हें क्रमशः पहली बलिदान-व्यवस्था और मसीह के आत्मबलिदान में पूरी हुई परमेश्वर की इच्छा के रूप में स्पष्ट करना; अथवा पुरानी और नई वाचा कहना।
  rationale: इब्रानियों 10:8–10 का निकट प्रसंग बलिदानों और परमेश्वर की इच्छा पूरी करने के बीच अंतर दिखाता है, पर यूनानी पाठ स्वयं संदर्भों का विस्तार नहीं करता। इसलिए मुख्य पाठ उसकी संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रखता है।
- issue: ἀναιρεῖ का कर्ता
  choice: ‘वह’ रखा गया है, जिससे मूल की व्याकरणिक संक्षिप्तता बनी रहे।
  alternative: कर्ता को स्पष्ट रूप से ‘मसीह’ या ‘परमेश्वर’ कहना।
  rationale: तात्कालिक वाक्य में कर्ता स्पष्ट नाम से दोहराया नहीं गया; किसी एक धर्मवैचारिक पहचान को पाठ में जोड़ना मूल से अधिक व्याख्यात्मक होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। उद्धरण में परमेश्वर को संबोधित एकवचन ‘तेरी’ रखा गया है, जो बाइबलीय प्रत्यक्ष संबोधन में स्वाभाविक है। ‘देख’ ध्यानाकर्षक Ἰδοὺ का सरल, वर्तमान हिन्दी समतुल्य है।
