source:
  edition: SBLGNT
  text: τότε εἶπον· Ἰδοὺ ἥκω, ἐν κεφαλίδι βιβλίου γέγραπται περὶ ἐμοῦ, τοῦ ποιῆσαι, ὁ θεός, τὸ θέλημά σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/007.yaml
  text: Then I said[a], ‘Behold, I have come—in the scroll of the book it is written about me—to do your will, O God.’
translation:
  language: hi
  text: तब मैंने कहा, “देखो, मैं आ गया हूँ—पुस्तक के स्क्रॉल[a] में मेरे विषय में लिखा है—हे परमेश्वर, तेरी इच्छा पूरी करने के लिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुस्तक के लपेटे हुए लेखपत्र में।” यहाँ आशय स्क्रॉल से है, आधुनिक बँधी हुई पुस्तक से नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह उद्धृत उत्तर का समय-संबंध बताने वाला स्वाभाविक और संक्षिप्त हिन्दी पर्याय है।
- source_word: εἶπον
  choice: मैंने कहा
  rationale: कथात्मक उद्धरण में λέγω के भूतकाल का सहज हिन्दी रूप।
- source_word: Ἰδοὺ
  choice: देख
  rationale: मूल के ध्यान आकर्षित करने वाले गंभीर उद्गार को स्पष्ट रखता है; ‘निहार’ आधुनिक सामान्य हिन्दी में अस्वाभाविक होता।
- source_word: ἥκω
  choice: मैं आ गया हूँ
  rationale: वर्तमान रूप के आगमन-सम्पन्न और वर्तमान-प्रासंगिक भाव को व्यक्त करता है।
- source_word: ἐν κεφαλίδι βιβλίου
  choice: पुस्तक के खर्रे में
  rationale: केφαλίς के इस मुहावरे में बँधी आधुनिक पुस्तक नहीं, लिखित लपेटा हुआ खर्रा अभिप्रेत है; यह पदबंध उस प्राचीन माध्यम को बनाए रखता है।
- source_word: γέγραπται
  choice: लिखा है
  rationale: यूनानी पूर्ण निष्क्रिय रूप का स्थायी परिणाम—जो लिखित रूप में विद्यमान है—स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: περὶ ἐμοῦ
  choice: मेरे विषय में
  rationale: परिष्कृत किंतु सामान्य आधुनिक हिन्दी में περί + संबंधकारक का सीधा अर्थ।
- source_word: τοῦ ποιῆσαι
  choice: पूरी करने के लिए
  rationale: यहाँ उद्देश्य व्यक्त करता है; इच्छा ‘पूरी करना’ हिन्दी में स्वाभाविक है और केवल कार्य करने से अधिक स्पष्ट रूप से वाक्य का आशय देता है।
- source_word: ὁ θεός
  choice: हे परमेश्वर
  rationale: रूप नामकारक है, पर प्रयोग सीधे संबोधन का है; ‘हे’ इसे हिन्दी में स्पष्ट करता है।
- source_word: τὸ θέλημά σου
  choice: तेरी इच्छा
  rationale: θέλημα के इच्छा/संकल्प के अर्थ को सीधे रखता है; संबोधन में एकवचन निकटता के लिए ‘तेरी’ चुना गया है।
theological_decisions:
- issue: भजन के उद्धरण का मसीह-संबंधी प्रथम-पुरुष प्रयोग
  choice: वक्ता की पहचान को पद में जोड़े बिना प्रथम-पुरुष कथन के रूप में अनुवाद
  alternative: मुख्य पाठ में वक्ता को स्पष्टतः मसीह कहना
  rationale: इब्रानियों का संदर्भ इस कथन को पुत्र/मसीह पर लागू करता है, पर इस पद के शब्द स्वयं केवल प्रथम-पुरुष घोषणा हैं; संदर्भ को पहचान स्थापित करने देना मूल की संयमित अभिव्यक्ति बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। उद्धरण की शास्त्रीय गंभीरता रखी गई है। ‘खर्रा’ प्राचीन लपेटे हुए लेखन-माध्यम को स्पष्ट करता है, इसलिए अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी हिन्दी में आवश्यक नहीं रही।
