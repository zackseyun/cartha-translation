review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the temporal response, completed arrival, what stands written concerning the speaker, direct address to God, and the purpose of doing God's will. However, “खर्रा” normally means a rough draft in modern Hindi, not a scroll; it therefore misrepresents κεφαλίς in this context.
  naturalness: The sentence is generally clear and suitably dignified. Replacing the colloquial-singular “देख” with “देखो” gives the marked introductory exclamation a more natural literary Hindi form. “इच्छा पूरी करने के लिए” is idiomatic and adequately expresses the purposive infinitive.
  terminology: “हे परमेश्वर” and “तेरी इच्छा” preserve the direct vocative and singular possessive without adding interpretation. “स्क्रॉल” is a clear contemporary term for the ancient rolled writing medium; a footnote supplies the Hindi descriptive alternative and prevents anachronistic misunderstanding.
  issues:
  - severity: medium
    issue: “खर्रा” is used for κεφαλίδι βιβλίου.
    rationale: In modern standard Hindi, “खर्रा” ordinarily denotes a draft or rough copy. The Greek idiom refers to a scroll/roll, so this wording is misleading despite the draft rationale.
  - severity: low
    issue: The lexical-alternative note for the scroll expression is omitted.
    rationale: The English audit trail retains a note explaining that the expression concerns a scroll rather than a modern bound book. A corresponding anchored Hindi note is useful, especially when using the contemporary loanword “स्क्रॉल.”
  - severity: low
    issue: “देख” has an overly colloquial singular-imperative tone.
    rationale: “देखो” more naturally carries the discourse-marking force of Ἰδού in a dignified scriptural quotation, without treating it as a literal command to a particular addressee.
  revised_text: तब मैंने कहा, “देखो, मैं आ गया हूँ—पुस्तक के स्क्रॉल[a] में मेरे विषय में लिखा है—हे परमेश्वर, तेरी इच्छा पूरी करने के लिए।”
