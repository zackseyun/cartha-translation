lexical_decisions:
- source_word: φοβερὸν
  choice: भयानक बात
  rationale: यह शब्द भय और आतंक उत्पन्न करने वाली बात को व्यक्त करता है। विधेय विशेषण और संज्ञीकृत क्रियार्थक रूप की यूनानी रचना को स्वाभाविक हिन्दी में ‘भयानक बात है’ कहा गया है; इससे चेतावनी की गंभीरता बनी रहती है।
- source_word: τὸ ἐμπεσεῖν
  choice: पड़ना
  rationale: संज्ञीकृत अओरिस्ट infinitive को हिन्दी में क्रियार्थक ‘पड़ना’ स्वाभाविक रूप से व्यक्त करता है। इसके साथ εἰς χεῖρας का मुहावरा किसी के अधिकार में आ जाने की तीव्र छवि बनाए रखता है।
- source_word: εἰς χεῖρας
  choice: हाथों में
  rationale: ‘हाथों में पड़ना’ हिन्दी में भी किसी के वश या न्यायाधिकार में आने का स्वाभाविक मुहावरा है और मूल बाइबलीय बिंब को सुरक्षित रखता है।
- source_word: θεοῦ
  choice: परमेश्वर
  rationale: θεός के लिए आधुनिक मानक हिन्दी बाइबलीय प्रयोग ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है। यह संबंधकारक अर्थ ‘परमेश्वर के हाथों’ में व्यक्त होता है।
- source_word: ζῶντος
  choice: जीवित
  rationale: 'वर्तमान कृदन्त θεοῦ को विशेषित करता है: ‘जीवित परमेश्वर’। यह प्रचलित बाइबलीय पदबंध परमेश्वर की वास्तविक और सक्रिय उपस्थिति को बनाए रखता है।'
theological_decisions:
- issue: चेतावनी के कथन का बल
  choice: जीवित परमेश्वर के हाथों में पड़ने की भयावहता के विषय में एक सामान्य और गंभीर घोषणा
  alternative: इसे केवल सांसारिक अनुशासन या न्याय से रहित अस्तित्वगत भय तक सीमित समझना
  rationale: संदर्भ में यह चेतावनी-अनुच्छेद का निष्कर्ष है और ‘हाथों में पड़ना’ न्यायाधिकार के अधीन आने का संकेत देता है। फिर भी ‘न्याय’ शब्द मूल यूनानी में प्रत्यक्ष नहीं है, इसलिए उसे मुख्य पाठ में जोड़कर धर्मवैज्ञानिक तनाव को हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हाथों में पड़ना’ मूल रूपक तथा न्याय-संबंधी निहितार्थ दोनों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
