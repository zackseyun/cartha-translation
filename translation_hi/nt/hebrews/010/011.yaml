id: HEB.10.11
reference: Hebrews 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ πᾶς μὲν ἱερεὺς ἕστηκεν καθ’ ἡμέραν λειτουργῶν καὶ τὰς αὐτὰς πολλάκις προσφέρων θυσίας, αἵτινες οὐδέποτε δύνανται περιελεῖν ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/011.yaml
  text: And every priest stands day after day ministering and offering the same sacrifices again and again[a], which can never take away sins.
translation:
  language: hi
  text: और हर याजक प्रतिदिन खड़ा रहकर सेवा करता है और वही बलिदान बार-बार चढ़ाता है, जो पापों को कभी दूर नहीं कर सकते[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापों को कभी हटा नहीं सकते।”
    reason: περιαιρέω के निकट अर्थ ‘दूर करना’ और ‘हटाना’ दोनों हैं; वैकल्पिक अभिव्यक्ति दर्ज की गई है।
lexical_decisions:
- source_word: πᾶς ... ἱερεὺς
  choice: हर याजक
  rationale: एकवचन संज्ञा के साथ πᾶς का वितरणात्मक अर्थ है—लेवीय व्यवस्था के प्रत्येक याजक की ओर संकेत। ἱερεύς का अर्थ ‘याजक’ है, ‘महायाजक’ नहीं।
- source_word: ἕστηκεν
  choice: खड़ा होकर
  rationale: पूर्णकालिक रूप खड़े रहने की अवस्था व्यक्त करता है। यह स्वाभाविक हिन्दी में याजक की लगातार खड़ी होकर की जाने वाली सेवा को दिखाता और अगले पद में मसीह के बैठने के साथ निहित विरोध बनाए रखता है।
- source_word: καθ’ ἡμέραν
  choice: दिन-प्रतिदिन
  rationale: यह लगातार प्रतिदिन दोहराई जाने वाली क्रिया को उभारता है और मूल के पुनरावृत्तिमूलक बल को बनाए रखता है।
- source_word: λειτουργῶν
  choice: सेवा करता
  rationale: संदर्भ में यह पवित्रस्थान की याजकीय सेवा है। ‘सेवा करता’ सामान्य पाठक के लिए सहज है और प्रसंग इसे याजकीय अर्थ देता है।
- source_word: τὰς αὐτὰς ... θυσίας
  choice: उन्हीं बलिदानों को
  rationale: αὐτάς उन्हीं एक जैसे बलिदानों की पुनरावृत्ति पर जोर देता है; ‘उन्हीं’ इस बल को संक्षेप में व्यक्त करता है।
- source_word: πολλάκις
  choice: बार-बार
  rationale: यह लगातार पुनरावृत्ति का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: προσφέρων
  choice: चढ़ाता है
  rationale: बलिदान के संदर्भ में προσφέρω का अर्थ अर्पित करना या चढ़ाना है; हिन्दी बाइबलीय और सामान्य धार्मिक प्रयोग में ‘बलिदान चढ़ाना’ सटीक तथा सहज है।
- source_word: αἵτινες
  choice: जो
  rationale: यह पहले बताए गए बलिदानों की ओर लौटकर उनकी अक्षमता समझाता है; हिन्दी का संबंधवाचक ‘जो’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से रखता है।
- source_word: οὐδέποτε δύνανται
  choice: कभी ... नहीं कर सकते
  rationale: यह पूर्ण अक्षमता व्यक्त करता है; हिन्दी की यह संरचना मूल के निरपेक्ष निषेध को बिना नरम किए बनाए रखती है।
- source_word: περιελεῖν ἁμαρτίας
  choice: पापों को ... दूर
  rationale: περιαιρέω का अर्थ हटाना या दूर करना है। ‘पापों को दूर करना’ स्पष्ट, स्वाभाविक और बलिदान-संबंधी आशय के अनुकूल है।
theological_decisions:
- issue: याजक के खड़े रहने और इब्रानियों 10 के तर्क का संबंध
  choice: ‘खड़ा होकर’ द्वारा याजक की निरंतर सेवा की मुद्रा को स्पष्ट रखा गया है।
  alternative: ‘सेवा में लगा रहता है’ कहना, जिसमें शारीरिक मुद्रा का संकेत लुप्त हो जाता।
  rationale: अगले पद में मसीह के बैठने के साथ जानबूझकर किया गया साहित्यिक विरोध इस शब्द में निहित है; अनुवाद उसे बनाए रखता है, पर कोई अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: बलिदानों की अक्षमता का विस्तार
  choice: ‘पापों को कभी दूर नहीं कर सकते’ कहकर मूल की पूर्ण अक्षमता को बनाए रखा गया है।
  alternative: ‘पापों को पूरी तरह दूर नहीं कर सकते’ जैसा सीमितकारी अनुवाद।
  rationale: यूनानी वाक्यांश οὐδέποτε δύνανται अक्षमता को स्पष्ट और निरपेक्ष रूप में कहता है। ‘पूरी तरह’ जोड़ना पाठ में निहित व्याख्या हो सकती है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘याजक’, ‘बलिदान’ और ‘पाप’ जैसे स्थापित शब्द रखे गए हैं; वाक्य की पुनरावृत्तिमूलक लय के लिए ‘दिन-प्रतिदिन’ और ‘बार-बार’ का प्रयोग किया गया है।
