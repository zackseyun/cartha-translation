  text: For yet a very little while[b][a], the one who is coming will come and will not delay.
translation:
  language: hi
  text: क्योंकि अभी बहुत ही थोड़ी देर है[a]; जो आने वाला है, वह आएगा और देर नहीं करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “थोड़ा, जितना-जितना”; यह अत्यंत थोड़े समय को व्यक्त करनेवाला बलपूर्ण मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι γὰρ
  choice: क्योंकि अब
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को और ‘अब’ ἔτι के प्रसंगगत समय-बोध को सहज हिन्दी में व्यक्त करता है।
- source_word: μικρὸν ὅσον ὅσον
  choice: बस बहुत ही थोड़ा समय रह गया है
  rationale: दोहराया गया ὅσον ὅσον अत्यंत थोड़े समय पर बल देता है। यह हिन्दी वाक्यांश उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἐρχόμενος
  choice: आनेवाला
  rationale: निश्चित उपपद के साथ वर्तमान कृदंत यहाँ संज्ञा की तरह प्रयुक्त है। ‘आनेवाला’ सम्भावित मसीही उपाधि और अधिक सामान्य व्याकरणिक अर्थ—दोनों को खुला रखता है।
- source_word: ἥξει
  choice: आएगा
  rationale: भविष्यकाल का सीधा अर्थ देता है और ‘आनेवाला … आएगा’ में यूनानी मूल की शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: οὐ χρονίσει
  choice: देर नहीं करेगा
  rationale: χρονίζω का यहाँ अर्थ विलंब करना है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: ὁ ἐρχόμενος को मसीही उपाधि मानकर अनूदित किया जाए या सामान्य कृदंतीय पद के रूप में
  choice: मुख्य पाठ में ‘आनेवाला’
  alternative: ‘वह जो आ रहा है’ अथवा स्पष्ट उपाधि के रूप में ‘आनेवाला जन’
  rationale: इब्रानियों के इस शास्त्रीय उद्धरण के मसीही संदर्भ में यह पद सम्भवतः लौटनेवाले मसीह को सूचित करता है, पर यूनानी रूप अपने आप में कृदंतीय भी है। ‘आनेवाला’ उपाधिगत बल को सम्भव रखता है, पर अस्पष्टता को अनावश्यक रूप से समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आनेवाला आएगा’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि वह मूल यूनानी के शब्द-संबंध और कथन के बल को सुरक्षित रखती है।
