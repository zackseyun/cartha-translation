  edition: SBLGNT
  text: ἣν ἐνεκαίνισεν ἡμῖν ὁδὸν πρόσφατον καὶ ζῶσαν διὰ τοῦ καταπετάσματος, τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/010/020.yaml
  text: which he inaugurated for us as a new and living way through the curtain—that is[a], his flesh[b],
translation:
  language: hi
  text: उसने हमारे लिए परदे[a] से होकर एक नया और जीवित मार्ग उद्घाटित किया—अर्थात् उसकी देह[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आवरण।” ‘परदा’ से तम्बू अथवा मन्दिर के पवित्र स्थान को अलग करने वाला परदा अभिप्रेत है।
    reason: ‘परदा’ καταπέτασμα का सुलभ मुख्य अनुवाद है; ‘आवरण’ एक संभावित शब्दगत विकल्प देता है।
  - marker: b
    text: “अर्थात् उसकी देह” परदे के रूपक को यीशु की देह से जोड़ता है।
    reason: यह टिप्पणी मूल पाठ के व्याख्यात्मक अपोज़ीशन को स्पष्ट करती है, बिना ‘देह से होकर’ जैसा अतिरिक्त संबंध जोड़कर रूपक को सीमित किए।
lexical_decisions:
- source_word: ἣν
  choice: जिसका / वाक्य में अंतर्निहित सम्बन्ध
  rationale: यूनानी सम्बन्धवाचक सर्वनाम ὁδόν से जुड़ा है। स्वाभाविक हिन्दी में अलग सम्बन्धवाचक उपवाक्य बनाने के बजाय उसी सम्बन्ध को मुख्य वाक्य में समाहित किया गया है।
- source_word: ἐνεκαίνισεν
  choice: उद्घाटन किया
  rationale: यह किसी नई व्यवस्था या मार्ग को पहली बार उपयोग के लिए आरम्भ करने का भाव देता है और ‘खोला’ की तुलना में अनुष्ठानिक छाया को बेहतर बनाए रखता है।
- source_word: ἡμῖν
  choice: हमारे लिए
  rationale: हित या लाभ का भाव स्पष्ट करता है।
- source_word: ὁδὸν πρόσφατον καὶ ζῶσαν
  choice: एक नए और जीवित मार्ग
  rationale: ‘नया’ πρόσφατον का प्रसंगानुकूल अर्थ देता है, जबकि ‘जीवित’ ζῶσαν की सजीव और धर्मवैचारिक रूपकता को बिना ‘जीवन देने वाला’ जोड़ने के सुरक्षित रखता है।
- source_word: διὰ τοῦ καταπετάσματος
  choice: परदे से होकर
  rationale: मन्दिर के परदे और उसके आर-पार प्रवेश की गति, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τοῦτ’ ἔστιν τῆς σαρκὸς αὐτοῦ
  choice: अर्थात् अपनी देह से होकर
  rationale: व्याख्यात्मक सूत्र और परदे के साथ यीशु की देह के रूपकात्मक सम्बन्ध को बनाए रखता है। हिन्दी में कर्ता के प्रति सम्बन्ध स्पष्ट करने के लिए ‘अपनी’ स्वाभाविक है।
theological_decisions:
- issue: परदे और मसीह की देह का रूपकात्मक सम्बन्ध
  choice: परदे से होकर—अर्थात् अपनी देह से होकर
  alternative: परदे से होकर—अर्थात् अपनी देह
  rationale: दोहराया गया ‘से होकर’ यूनानी διά के साधन/मार्ग के भाव को हिन्दी में स्पष्ट करता है, फिर भी यह तय नहीं करता कि देह केवल परदे की सीधी पहचान है या प्रवेश का माध्यम; मूल की धर्मवैचारिक तनावशीलता बनी रहती है।
- issue: σάρξ का अनुवाद
  choice: देह
  alternative: शरीर / मांस
  rationale: यहाँ σάρξ यीशु की वास्तविक मानवीय देह को सूचित करता है। ‘देह’ गरिमापूर्ण और प्रचलित है तथा ‘पापी स्वभाव’ जैसा व्याख्यात्मक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘उद्घाटन किया’ नई राह के आरम्भ तथा उपयोग के लिए स्थापित किए जाने का भाव रखता है; ‘परदे से होकर’ साधारण पाठक के लिए स्पष्ट है।
