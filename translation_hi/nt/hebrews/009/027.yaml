  text: And just as it is appointed for men to die once[a], and after this, judgment,
translation:
  language: hi
  text: और जिस प्रकार मनुष्यों के लिए एक बार मरना ठहराया गया है, और इसके बाद न्याय,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ’ ὅσον
  choice: जिस प्रकार
  rationale: यह पद अगले पद के साथ तुलना आरम्भ करता है; ‘जिस प्रकार’ हिन्दी में उस तुलनात्मक संरचना को स्वाभाविक रूप से तैयार करता है।
- source_word: ἀπόκειται
  choice: ठहराया गया है
  rationale: अनन्त क्रिया और सम्प्रदान कारक के साथ यह क्रिया मनुष्यों के लिए निश्चित या नियत बात का भाव देती है।
- source_word: τοῖς ἀνθρώποις
  choice: मनुष्यों के लिए
  rationale: यहाँ यूनानी शब्द पूरी मानवजाति के लिए सामान्य अर्थ में प्रयुक्त है; ‘मनुष्यों’ आधुनिक हिन्दी में स्त्री-पुरुष सभी को स्वाभाविक रूप से समेटता है।
- source_word: ἅπαξ
  choice: एक बार
  rationale: यह मनुष्य की मृत्यु की एकमात्र घटना को दर्शाता है; यहाँ ‘सदा के लिए’ जैसा अधिक प्रबल अर्थ जोड़ना उचित नहीं।
- source_word: ἀποθανεῖν
  choice: मरना
  rationale: यह मूल अनन्त क्रिया का सीधा और सामान्य हिन्दी रूप है।
- source_word: μετὰ δὲ τοῦτο
  choice: और उसके बाद
  rationale: यह मृत्यु के बाद आने वाले न्याय का क्रम स्पष्ट करता है और δέ को प्रसंगानुकूल संयोजक रूप में रखता है।
- source_word: κρίσις
  choice: न्याय होता है
  rationale: ‘न्याय’ न्यायिक परख का व्यापक अर्थ सुरक्षित रखता है; हिन्दी वाक्य की स्वाभाविकता के लिए निहित क्रिया को ‘होता है’ से व्यक्त किया गया है।
theological_decisions:
- issue: τοῖς ἀνθρώποις का सामान्य मानवीय संदर्भ
  choice: ‘मनुष्यों’ द्वारा पूरी मानवजाति का समावेश
  alternative: ‘पुरुषों’
  rationale: मूल यूनानी व्याकरणतः पुल्लिंग बहुवचन है, पर अर्थ पुरुषों तक सीमित नहीं है। हिन्दी ‘मनुष्य’ मूल के मानवीय संदर्भ को बिना लैंगिक भ्रम के ठीक प्रकार व्यक्त करता है।
- issue: मृत्यु के बाद κρίσις का आशय
  choice: केवल ‘न्याय’ कहा गया है
  alternative: ‘दण्डादेश’ या ‘अन्तिम न्याय’
  rationale: पद मृत्यु के बाद न्याय की बात कहता है, पर उसके परिणाम या सम्पूर्ण युगान्त-विषयक रूपरेखा को यहाँ निर्धारित नहीं करता। व्यापक शब्द मूल की धार्मिक गम्भीरता और अनिर्धारितता दोनों बनाए रखता है।
- issue: पद 28 से जुड़ी तुलनात्मक संरचना
  choice: ‘जिस प्रकार’ से आरम्भ और अन्त में अल्पविराम
  alternative: इसे स्वतन्त्र पूर्ण कथन बनाना
  rationale: καθ’ ὅσον अगले पद के अनुरूप पक्ष की भूमिका बाँधता है; इसलिए अनुवाद पद 28 की ओर खुला रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ठहराया गया है’ पारम्परिक धार्मिक गरिमा के साथ नियत अवस्था का भाव देता है, जबकि ‘मनुष्यों’ का प्रयोग स्वाभाविक रूप से समावेशी है; अतः अलग पाद-टिप्पणी आवश्यक नहीं।
