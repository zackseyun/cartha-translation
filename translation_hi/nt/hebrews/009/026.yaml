source:
  edition: SBLGNT
  text: ἐπεὶ ἔδει αὐτὸν πολλάκις παθεῖν ἀπὸ καταβολῆς κόσμου· ⸀νυνὶ δὲ ἅπαξ ἐπὶ συντελείᾳ τῶν αἰώνων εἰς ἀθέτησιν ⸀ἁμαρτίας διὰ τῆς θυσίας αὐτοῦ πεφανέρωται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/026.yaml
  text: Otherwise[a], he would have had to suffer many times since the foundation of the world. But as it is[c][b], he has appeared once for all at the consummation of the ages to put away sin through the sacrifice of himself.
translation:
  language: hi
  text: नहीं तो संसार की नींव रखे जाने से उसे बार-बार दुःख सहना पड़ता। पर अब वह युगों की परिपूर्णता पर[a] पाप को मिटा देने[b] के लिए अपने ही बलिदान के द्वारा[c] सदा के लिए एक ही बार प्रकट हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युगों के अंत में।”
    reason: lexical_alternative
  - marker: b
    text: या, “पाप को हटा देने” अथवा “पाप को निष्प्रभावी कर देने।”
    reason: lexical_alternative
  - marker: c
    text: या, “अपने बलिदान के द्वारा।” यूनानी में अधिक शाब्दिक रूप से, “स्वयं के बलिदान के द्वारा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ
  choice: नहीं तो
  rationale: संदर्भ में यह शब्द उस काल्पनिक परिणाम को प्रस्तुत करता है जो मसीह के बार-बार अपने को अर्पित करने की स्थिति में निकलता; ‘नहीं तो’ हिन्दी में इस तार्किक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἔδει
  choice: सहना पड़ता
  rationale: अपूर्णकालीन क्रिया यहाँ अतीत से जुड़ी काल्पनिक अनिवार्यता बताती है; ‘पड़ता’ उसी भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: πολλάκις ... ἅπαξ
  choice: बार-बार ... सदा के लिए एक ही बार
  rationale: यह रूप बारंबारता और मसीह के निर्णायक, न दोहराए जाने वाले कार्य के बीच स्पष्ट विरोध बनाए रखता है।
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: संसार की नींव डाले जाने के समय से
  rationale: यह यूनानी मुहावरे के आरंभ-बिंदु और वहाँ से आगे के कालगत अर्थ, दोनों को स्पष्ट रखता है।
- source_word: ἐπὶ συντελείᾳ τῶν αἰώνων
  choice: युगों की परिपूर्णता के समय
  rationale: ‘परिपूर्णता’ συντέλεια के समापन और चरम सिद्धि के भाव को रखती है तथा बहुवचन αἰώνων को ‘युगों’ के रूप में सुरक्षित रखती है।
- source_word: εἰς ἀθέτησιν ἁμαρτίας
  choice: पाप को मिटा देने के लिए
  rationale: यह सामान्य पाठक के लिए स्वाभाविक है और ἀθέτησις में निहित हटा देने अथवा निष्प्रभावी कर देने के निर्णायक भाव को संप्रेषित करता है।
- source_word: διὰ τῆς θυσίας αὐτοῦ
  choice: स्वयं अपना बलिदान देने के द्वारा
  rationale: यह वाक्यांश स्पष्ट करता है कि मसीह ने स्वयं को बलिदान के रूप में दिया, जबकि यूनानी के साधनवाचक διά को ‘के द्वारा’ से बनाए रखता है।
- source_word: πεφανέρωται
  choice: प्रकट हुआ है
  rationale: यह पूर्णकाल की उस पूर्ण घटना और उसके बने रहने वाले महत्व को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ἅπαξ में मसीह के बलिदान की एकबारगी निर्णायकता
  choice: सदा के लिए एक ही बार
  alternative: एक बार
  rationale: πολλάκις (‘बार-बार’) के प्रत्यक्ष विरोध और इब्रानियों के बलिदानी तर्क के कारण यह अनुवाद कार्य की अनावृत्ति को स्पष्ट करता है, बिना पाठ से परे कोई सिद्धान्त जोड़े।
- issue: ἁμαρτίας का एकवचन और उसका दायरा
  choice: पाप
  alternative: पापों
  rationale: यूनानी एकवचन पाप को सामूहिक अथवा व्यापक वास्तविकता के रूप में प्रस्तुत करता है; हिन्दी का एकवचन उसी व्यापकता को सुरक्षित रखता है।
- issue: ἀθέτησις की शक्ति
  choice: मिटा देना
  alternative: हटा देना; निष्प्रभावी कर देना
  rationale: मुख्य पाठ में सरल और प्रभावशाली भाषा चुनी गई है; पादटिप्पणी मूल शब्द में मौजूद हटाने अथवा निरस्त करने की अर्थ-सीमा सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘युगों की परिपूर्णता’ जैसे कुछ भारयुक्त पद मूल की युगान्त-संबंधी गहनता बनाए रखते हैं, जबकि ‘नहीं तो,’ ‘सहना पड़ता,’ और ‘मिटा देने’ तर्क को सामान्य पाठक के लिए स्पष्ट बनाते हैं। पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद रखे गए हैं।
