  text: μόνον ἐπὶ βρώμασιν καὶ πόμασιν καὶ διαφόροις βαπτισμοῖς, ⸀δικαιώματα σαρκὸς μέχρι καιροῦ διορθώσεως ἐπικείμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/010.yaml
  text: concerned only with foods and drinks and various washings, fleshly regulations imposed until the time of reformation.
translation:
  language: hi
  text: ये केवल खाने-पीने की वस्तुओं और विभिन्न प्रकार की धुलाइयों से संबंधित देह-संबंधी नियम हैं, जो सुधार के समय तक लगाए गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βρώμασιν καὶ πόμασιν
  choice: खाने-पीने की वस्तुओं
  rationale: भोजन और पेय संबंधी व्यवस्थाओं को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διαφόροις βαπτισμοῖς
  choice: तरह-तरह के धोने के विधानों
  rationale: बहुवचन βαπτισμοῖς यहाँ अनुष्ठानिक धुलाई या शुद्धिकरणों को सूचित करता है, न कि अनिवार्यतः मसीही बपतिस्मे को।
- source_word: δικαιώματα σαρκὸς
  choice: शारीरिक नियम
  rationale: δικαιώματα को 'नियम' और σαρκὸς को शरीर/बाहरी देह-संबंधी क्षेत्र के अर्थ में रखा गया है; इससे इसे स्वतः पापपूर्ण या कामुक कहने से बचा जाता है।
- source_word: καιροῦ διορθώσεως
  choice: सुधार के समय
  rationale: διορθώσεως में व्यवस्था को सीधा करने, सुधारने या पुनः सुव्यवस्थित करने का भाव है; स्रोत की संक्षिप्तता और अंतकाल-संबंधी तनाव सुरक्षित रहता है।
- source_word: ἐπικείμενα
  choice: लागू किए गए थे
  rationale: नियमों के निर्धारित/थोपे हुए दायित्व का स्वाभाविक हिन्दी रूप; व्याकरणतः यह δικαιώματα से संबंधित है।
theological_decisions:
- issue: σαρκός का आशय
  choice: शारीरिक
  alternative: देह-संबंधी / बाहरी
  rationale: यहाँ संदर्भ उपासना के बाहरी नियमों का है। 'शारीरिक' स्रोत की शब्दावली के निकट है, पर इसे नैतिक रूप से पापी ठहराने वाली व्याख्या नहीं जोड़ी गई।
- issue: διορθώσεως की पहचान
  choice: सुधार के समय
  alternative: नई व्यवस्था स्थापित होने के समय
  rationale: पद स्वयं उस समय की स्पष्ट ऐतिहासिक या वाचा-संबंधी पहचान नहीं बताता; अतः अनुवाद में उसे व्याख्यात्मक रूप से निश्चित नहीं किया गया।
- issue: मूल वाक्यांश की 9:9 से निर्भरता
  choice: स्वतंत्र हिन्दी वाक्य के रूप में 'ये' जोड़ा गया
  alternative: पिछले पद से जुड़े खंड के रूप में 'जो केवल...'
  rationale: ग्रीक पद पूर्ववर्ती वाक्य पर निर्भर है, किंतु पद-स्तर पर पठनीयता के लिए न्यूनतम संकेतक जोड़ा गया; इसका संकेत टिप्पणी में रखा जा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। 'धोने के विधान' अनुष्ठानिक धुलाई का अर्थ स्पष्ट करता है। पद ग्रीक में पिछले वाक्य से जुड़ा हुआ खंड है; प्रस्तुत रूप पद को अकेले पढ़े जाने पर भी समझने योग्य बनाता है।
