id: HEB.9.9
reference: Hebrews 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἥτις παραβολὴ εἰς τὸν καιρὸν τὸν ἐνεστηκότα, καθ’ ⸀ἣν δῶρά τε καὶ θυσίαι προσφέρονται μὴ δυνάμεναι κατὰ συνείδησιν τελειῶσαι τὸν λατρεύοντα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/009.yaml
  text: which is a parable for the present time[a], according to which both gifts and sacrifices are offered that are not able to perfect the worshiper with respect to conscience,
translation:
  language: hi
  text: यह वर्तमान समय के लिए एक दृष्टान्त[a] है, जिसके अनुसार भेंटें और बलिदान दोनों चढ़ाए जाते हैं, जो उपासना करनेवाले को विवेक की दृष्टि से सिद्ध नहीं कर सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतीक” या “प्रतिरूप”।
    reason: παραβολή के इस प्रसंग में सम्भव और प्रचलित शाब्दिक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: ἥτις
  choice: यह ... है
  rationale: पूर्ववर्ती मिलापवाले तम्बू की व्यवस्था की ओर संकेत करते हुए हिन्दी में स्वाभाविक व्याख्यात्मक संबंध रखता है।
- source_word: παραβολὴ
  choice: दृष्टान्त
  rationale: मूल शब्द के आलंकारिक अनुरूपता वाले व्यापक अर्थ को बनाए रखता है; इस प्रसंग में सम्भव ‘प्रतीक’ को पादटिप्पणी में दिया गया है।
- source_word: εἰς τὸν καιρὸν τὸν ἐνεστηκότα
  choice: वर्तमान समय के लिए
  rationale: लेखक के तर्क में उस समय विद्यमान काल की ओर संकेत को बिना उसे किसी विशिष्ट युग में सीमित किए व्यक्त करता है।
- source_word: καθ’ ἣν
  choice: जिसके अनुसार
  rationale: दृष्टान्त अथवा तम्बू की व्यवस्था और चढ़ाई जानेवाली वस्तुओं के बीच नियामक संबंध व्यक्त करता है।
- source_word: δῶρά τε καὶ θυσίαι
  choice: भेंटें और बलिदान
  rationale: दोनों उपासना-संबंधी पदों को अलग और युग्मित रूप में सुरक्षित रखता है।
- source_word: προσφέρονται
  choice: चढ़ाए जाते हैं
  rationale: वर्तमान कर्मवाच्य और धार्मिक अर्पण की निरंतर प्रथा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μὴ δυνάμεναι
  choice: नहीं कर सकते
  rationale: भेंटों और बलिदानों की असमर्थता को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κατὰ συνείδησιν
  choice: विवेक की दृष्टि से
  rationale: सिद्ध किए जाने की सीमा या क्षेत्र को बताता है और इसे केवल व्यक्तिगत निष्कपटता तक सीमित नहीं करता।
- source_word: τελειῶσαι
  choice: सिद्ध ... कर सकते
  rationale: इब्रानियों में उद्देश्यपूर्ण पूर्णता या परमेश्वर के सामने योग्य दशा तक पहुँचाने की धर्मवैचारिक गूँज को बनाए रखता है।
- source_word: τὸν λατρεύοντα
  choice: उपासना करनेवाले को
  rationale: एकवचन कृदन्त को धार्मिक सेवा में लगे व्यक्ति के रूप में स्पष्ट और समावेशी हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: उपासना-संबंधी प्रतीकात्मक प्रसंग में παραβολή का अनुवाद
  choice: दृष्टान्त
  alternative: प्रतीक या प्रतिरूप
  rationale: ‘दृष्टान्त’ पृथ्वी के पवित्रस्थान की व्यवस्था और वर्तमान समय के बीच आलंकारिक अनुरूपता को बनाए रखता है तथा अर्थ को केवल अमूर्त प्रतीक तक सीमित नहीं करता; प्रसंगानुकूल विकल्प पादटिप्पणी में सुरक्षित हैं।
- issue: τελειόω की धर्मवैचारिक शक्ति
  choice: सिद्ध करना
  alternative: पूर्ण करना / पूर्णता तक पहुँचाना
  rationale: ‘सिद्ध करना’ इब्रानियों में प्रयुक्त इस शब्द की व्यापक धार्मिक गूँज को बनाए रखता है, बिना यहाँ उसके तंत्र को अतिरिक्त रूप से समझाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘दृष्टान्त’, ‘विवेक’ और ‘सिद्ध’ जैसे परिचित बाइबिलीय पद मूल की अर्थगत तथा धर्मवैचारिक तनाव को बनाए रखते हैं।
