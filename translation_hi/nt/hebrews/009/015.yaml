id: HEB.9.15
reference: Hebrews 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ διὰ τοῦτο διαθήκης καινῆς μεσίτης ἐστίν, ὅπως θανάτου γενομένου εἰς ἀπολύτρωσιν τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων τὴν ἐπαγγελίαν λάβωσιν οἱ κεκλημένοι τῆς αἰωνίου κληρονομίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/015.yaml
  text: And for this reason he is the mediator of a new covenant[a], so that, since a death has occurred for the redemption of the transgressions committed under the first covenant, those who have been called may receive the promise of the eternal inheritance.
translation:
  language: hi
  text: और इसी कारण वह नई वाचा[a] का मध्यस्थ है, ताकि पहली वाचा के अधीन हुए अपराधों के छुटकारे के लिए मृत्यु हो जाने पर, जिन्हें बुलाया गया है वे अनन्त विरासत की प्रतिज्ञा प्राप्त करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नई वसीयत”; यूनानी शब्द διαθήκη के दोनों अर्थ हो सकते हैं। इब्रानियों 9:16–17 में “वसीयत” का अर्थ भी सामने आता है, पर इस पद में पहली वाचा से तुलना के कारण “वाचा” अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह पद को पिछले तर्क से कारणात्मक रूप से जोड़ता है और हिन्दी में स्वाभाविक है।
- source_word: διαθήκης καινῆς
  choice: नई वाचा
  rationale: आस-पास के संदर्भ और पहली वाचा से विरोध के कारण यहाँ वाचा प्राथमिक अर्थ है; वसीयत का अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: μεσίτης
  choice: मध्यस्थ
  rationale: दो पक्षों के बीच संबंध स्थापित कराने वाले व्यक्ति के लिए सटीक और प्रचलित शब्द है।
- source_word: θανάτου γενομένου εἰς ἀπολύτρωσιν
  choice: उसकी मृत्यु के द्वारा ... छुटकारा मिले
  rationale: यूनानी में केवल 'मृत्यु घटित होने पर' है, पर निकट संदर्भ में मृत्यु मसीह की है; हिन्दी वाक्य में उसका मुक्तिदायक प्रयोजन स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: τῶν ἐπὶ τῇ πρώτῃ διαθήκῃ παραβάσεων
  choice: पहली वाचा के अधीन किए गए अपराधों से
  rationale: ἐπί के दत्तिव को वाचा के अधीन या उसके काल-क्षेत्र में समझते हुए संबंध को स्पष्ट किया गया है।
- source_word: οἱ κεκλημένοι
  choice: बुलाए हुए लोग
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त बुलाए जा चुके होने की वर्तमान स्थिति व्यक्त करता है।
- source_word: τὴν ἐπαγγελίαν ... τῆς αἰωνίου κληρονομίας
  choice: अनन्त विरासत की प्रतिज्ञा
  rationale: सम्बन्धकारक रचना को सीधे रखा गया है; प्रतिज्ञा अनन्त विरासत से संबंधित है।
theological_decisions:
- issue: ἐστίν का निहित कर्ता
  choice: वह
  alternative: कर्ता को अप्रकट रखना
  rationale: हिन्दी में कर्ता आवश्यक है और पिछले संदर्भ में इसका संकेत मसीह की ओर स्पष्ट है।
- issue: διαθήκη का अर्थ
  choice: वाचा
  alternative: वसीयत
  rationale: इस पद में नई और पहली वाचा का विरोध वाचा को मुख्य अर्थ बनाता है, जबकि अगले पदों में उभरने वाली अर्थगत व्यापकता पाद-टिप्पणी में सुरक्षित है।
- issue: θανάτου का कर्ता/सम्बन्ध
  choice: उसकी मृत्यु
  alternative: एक मृत्यु घटित होने पर
  rationale: यूनानी संज्ञा स्वयं स्वामी को व्यक्त नहीं करती, पर तत्काल संदर्भ मसीह की मृत्यु को सूचित करता है; स्पष्ट हिन्दी के लिए सर्वनाम जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘वाचा’, ‘मध्यस्थ’, ‘छुटकारा’ और ‘विरासत’ जैसे परिचित बाइबलीय शब्द रखे गए हैं।
