  yaml_path: translation/nt/hebrews/009/001.yaml
  text: Even the first covenant had regulations for worship and an earthly sanctuary[a][b].
translation:
  language: hi
  text: पहली वाचा में भी उपासना के नियम थे और एक पार्थिव पवित्रस्थान था[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या केवल ‘पहली’—अर्थात पहली वाचा; कुछ लोग इसे अधिक सामान्य अर्थ में ‘पहली व्यवस्था’ समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘सांसारिक पवित्रस्थान’; यहाँ आशय संभवतः ‘पार्थिव’ है, जो इस अध्याय में आगे आने वाली स्वर्गीय वास्तविकताओं के विपरीत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶχε
  choice: था
  rationale: अपूर्ण भूतकाल यहाँ पहली व्यवस्था की विशेषताओं का वर्णन आरम्भ करता है; हिंदी में स्वाभाविक अस्तित्वसूचक रचना अर्थ को स्पष्ट रखती है।
- source_word: μὲν οὖν
  choice: भी
  rationale: यह संयोजन पिछले तर्क से संक्रमण और हल्का बल प्रकट करता है; प्रसंग में ‘भी’ उस बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἡ πρώτη
  choice: पहली वाचा
  rationale: यूनानी में संज्ञा लुप्त है, पर स्त्रीलिंग ‘पहली’ का निकटतम संदर्भ 8:13 की पहली वाचा है; स्पष्टता के लिए ‘वाचा’ जोड़ा गया है।
- source_word: δικαιώματα
  choice: नियम
  rationale: यहाँ शब्द उपासना को नियंत्रित करने वाले निर्धारित धार्मिक विधान सूचित करता है; ‘नियम’ आधुनिक पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: λατρείας
  choice: उपासना के
  rationale: इस याजकीय संदर्भ में शब्द धार्मिक सेवा अथवा आराधना को दर्शाता है; ‘उपासना के नियम’ उद्देश्य और क्षेत्र दोनों को सहजता से बताता है।
- source_word: τό τε ἅγιον
  choice: पवित्रस्थान
  rationale: यह उपासना से जुड़े पवित्र स्थल को सूचित करता है; अगले पद उसके भागों को खोलते हैं, इसलिए व्यापक शब्द ‘पवित्रस्थान’ उपयुक्त है।
- source_word: κοσμικόν
  choice: पार्थिव
  rationale: यह आगे वर्णित स्वर्गीय वास्तविकताओं के विपरीत पृथ्वी से संबंधित पवित्रस्थान को दर्शाता है; ‘पार्थिव’ नैतिक रूप से नकारात्मक ‘सांसारिक’ की अपेक्षा अधिक सटीक है।
theological_decisions:
- issue: ἡ πρώτη का निहित संदर्भ
  choice: पहली वाचा
  alternative: ‘पहली’ अर्थात पहली व्यवस्था; अथवा पहला तंबू
  rationale: इब्रानियों 8 का निकटवर्ती संदर्भ पहली और नई वाचा की तुलना करता है। फिर भी यूनानी में ‘वाचा’ स्पष्ट रूप से दोहराया नहीं गया, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- issue: κοσμικόν का अर्थ
  choice: पार्थिव
  alternative: सांसारिक
  rationale: मुख्य विरोध पृथ्वी और स्वर्ग के बीच है, नैतिक रूप से अपवित्र और पवित्र के बीच नहीं; इसलिए ‘पार्थिव’ संभावित गलत नैतिक अर्थ से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘पवित्रस्थान’ को संयुक्त रूप में रखा गया है, जो बाइबिलीय हिंदी में परिचित है; ‘पार्थिव’ सटीक विरोध को बनाए रखता है।
