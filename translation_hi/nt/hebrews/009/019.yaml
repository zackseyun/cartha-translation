source:
  edition: SBLGNT
  text: λαληθείσης γὰρ πάσης ἐντολῆς κατὰ ⸀τὸν νόμον ὑπὸ Μωϋσέως παντὶ τῷ λαῷ, λαβὼν τὸ αἷμα τῶν ⸀μόσχων μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν ἐράντισεν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/019.yaml
  text: For when every commandment according to the law had been spoken by Moses to all the people[a], he took the blood of the calves with water and scarlet wool and hyssop, and sprinkled both the scroll itself and all the people,
translation:
  language: hi
  text: क्योंकि जब मूसा ने व्यवस्था के अनुसार हर आज्ञा सारी प्रजा को सुना दी, तब उसने पानी, लाल ऊन और जूफ़े के साथ बछड़ों[a] का लहू लेकर उस पुस्तक पर भी और सारी प्रजा पर भी छिड़का,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जवान बैलों का।” यूनानी शब्द बलिदान के प्रसंग में बछड़ों या जवान बैलों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λαληθείσης γὰρ πάσης ἐντολῆς
  choice: क्योंकि जब ... हर आज्ञा सुना दी
  rationale: सम्बन्धकारक निरपेक्ष रचना को स्वाभाविक हिन्दी में कालसूचक उपवाक्य के रूप में दिया गया है। πάσης की वितरणात्मक शक्ति को ‘हर आज्ञा’ से बनाए रखा गया है।
- source_word: κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार
  rationale: κατά के अनुरूपता-सूचक अर्थ को सीधे और प्रचलित बाइबलीय हिन्दी में व्यक्त करता है।
- source_word: ὑπὸ Μωϋσέως παντὶ τῷ λαῷ
  choice: मूसा ने सारी प्रजा को
  rationale: यूनानी कर्मवाच्य को स्वाभाविक हिन्दी कर्तृवाच्य में बदला गया है, जबकि मूसा की कर्ता-भूमिका और पूरे समुदाय का श्रोता होना सुरक्षित है।
- source_word: τὸ αἷμα τῶν μόσχων
  choice: बछड़ों का लहू
  rationale: μόσχος का सीधा अर्थ ‘बछड़ा’ है; बलिदान-सन्दर्भ में ‘जवान बैल’ भी सम्भव है, जिसे पादटिप्पणी में रखा गया है। ‘लहू’ धार्मिक-बलिदानी प्रसंग में सुबोध और गरिमापूर्ण है।
- source_word: μετὰ ὕδατος καὶ ἐρίου κοκκίνου καὶ ὑσσώπου
  choice: पानी, लाल ऊन और जूफ़े के साथ
  rationale: तीनों वस्तुओं को स्पष्ट रूप से बनाए रखा गया है। κοκκίνου के लिए सहज ‘लाल’ और ὕσσωπος के लिए हिन्दी बाइबलीय वनस्पति-नाम ‘जूफ़ा’ चुना गया है।
- source_word: αὐτό τε τὸ βιβλίον καὶ πάντα τὸν λαὸν
  choice: स्वयं उस पुस्तक-पत्र तथा सारी प्रजा पर
  rationale: τε ... καί के दोनों समन्वित लक्ष्यों को ‘तथा’ से जोड़ा गया है और αὐτό का बल ‘स्वयं’ से रखा गया है। βιβλίον यहाँ लिखित वाचा-दस्तावेज़ है; ‘पुस्तक-पत्र’ प्राचीन लिखित दस्तावेज़ का संकेत देता है।
- source_word: ἐράντισεν
  choice: छिड़का
  rationale: अनुष्ठानिक sprinkling के लिए सरल, सटीक और वर्तमान हिन्दी क्रिया है।
theological_decisions:
- issue: निर्गमन 24 के वृत्तान्त से सम्बन्ध और μόσχων का अर्थ
  choice: यूनानी पाठ के संक्षिप्त वर्णन को बिना सामंजस्यकारी विस्तार के अनूदित किया गया और मुख्य पाठ में ‘बछड़ों’ रखा गया।
  alternative: ‘जवान बैलों’ कहना या निर्गमन के अनुष्ठान का अतिरिक्त विवरण जोड़ना।
  rationale: इब्रानियों के लेखक की अपनी शब्दावली और संक्षिप्त पुनर्कथा को यथावत रखना चाहिए; सम्भव शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- issue: ‘पुस्तक’ पर लहू छिड़कने का कथन
  choice: αὐτό τε τὸ βιβλίον को स्पष्ट रूप से छिड़काव के लक्ष्य के रूप में रखा गया है।
  alternative: पुराने नियम के वृत्तान्त से मिलाने के लिए इसे नरम करना या छोड़ना।
  rationale: अनुवाद को इब्रानियों के वर्तमान यूनानी पाठ का अनुसरण करना चाहिए, भले ही उसका विवरण निर्गमन 24 की अभिव्यक्ति से आगे जाता हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘व्यवस्था’, ‘लहू’ और ‘जूफ़ा’ जैसे परिचित बाइबलीय शब्दों के साथ वाक्य-विन्यास को सामान्य पाठक के लिए सहज बनाया गया है।
