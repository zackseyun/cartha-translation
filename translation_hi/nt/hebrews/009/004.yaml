source:
  edition: SBLGNT
  text: χρυσοῦν ἔχουσα θυμιατήριον καὶ τὴν κιβωτὸν τῆς διαθήκης περικεκαλυμμένην πάντοθεν χρυσίῳ, ἐν ᾗ στάμνος χρυσῆ ἔχουσα τὸ μάννα καὶ ἡ ῥάβδος Ἀαρὼν ἡ βλαστήσασα καὶ αἱ πλάκες τῆς διαθήκης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/004.yaml
  text: having the golden censer[a], and the ark of the covenant covered on all sides with gold, in which were a golden jar holding the manna, Aaron’s staff that budded, and the tablets of the covenant,
translation:
  language: hi
  text: जिसमें सोने की धूप-वेदी[a] और चारों ओर सोने से मढ़ा हुआ वाचा का संदूक था। उस संदूक में मन्ना से भरा हुआ सोने का एक पात्र, हारून की अंकुरित हुई छड़ी, और वाचा की पटियाएँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोने का धूपदान।” यूनानी शब्द धूप जलाने की वेदी या धूपदान—दोनों के अर्थ में समझा जा सकता है; यहाँ इसका अर्थ विवादित है।
    reason: alternative_reading
lexical_decisions:
- source_word: θυμιατήριον
  choice: धूप-वेदी
  rationale: यह यूनानी शब्द धूप जलाने की वेदी अथवा धूपदान का बोध करा सकता है। तंबू के साज-सामान के इस वर्णन में ‘धूप-वेदी’ स्वाभाविक मुख्य पाठ है; वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: χρυσοῦν
  choice: सोने की
  rationale: विशेषण का अर्थ ‘सुनहरा’ अथवा ‘सोने का बना’ है; पवित्र वस्तु के पदार्थ को स्पष्ट करने के लिए ‘सोने की’ सहज और सटीक है।
- source_word: κιβωτὸν τῆς διαθήκης
  choice: वाचा का संदूक
  rationale: κιβωτός एक पवित्र संदूक है और διαθήκη इस प्रसंग में ‘वाचा’ है। यह रूप आधुनिक हिन्दी में स्पष्ट है।
- source_word: περικεκαλυμμένην πάντοθεν χρυσίῳ
  choice: चारों ओर सोने से मढ़ी हुई
  rationale: यह पूर्णतः चारों ओर सोने का आवरण होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: στάμνος χρυσῆ ἔχουσα τὸ μάννα
  choice: मन्ना से भरा सोने का एक पात्र
  rationale: στάμνος के लिए सामान्य ‘पात्र’ उपयुक्त है और ἔχουσα का आशय यहाँ ‘मन्ना से भरा’ सहज रूप में व्यक्त होता है।
- source_word: ῥάβδος Ἀαρὼν ἡ βλαστήσασα
  choice: हारून की वह छड़ी जिसमें अंकुर निकले थे
  rationale: ‘छड़ी’ आधुनिक और सहज है; βλαστήσασα ज्ञात पूर्व घटना को बताता है, इसलिए ‘जिसमें अंकुर निकले थे’ सटीक है।
- source_word: πλάκες τῆς διαθήκης
  choice: वाचा की पटियाएँ
  rationale: ‘पटियाएँ’ πλάκες को और ‘वाचा’ διαθήκη को सीधे व्यक्त करता है; मूल में न होने के कारण ‘पत्थर की’ नहीं जोड़ा गया।
theological_decisions:
- issue: θυμιατήριον का अर्थ
  choice: धूप-वेदी
  alternative: सोने का धूपदान
  rationale: शब्द दोनों अर्थों में प्रयुक्त हो सकता है और इस पद में प्राचीन व्यवस्था से जुड़ा प्रश्न भी उत्पन्न होता है। मुख्य पाठ में प्रसंगानुकूल ‘धूप-वेदी’ रखा गया है, पर वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: वाचा के संदूक के साथ वस्तुओं का संबंध
  choice: ‘उस संदूक में’ के रूप में मूल ἐν ᾗ का सीधा अनुवाद
  alternative: ‘उसके साथ/उस स्थान में’
  rationale: यूनानी व्याकरण में स्त्रीलिंग संबंधवाचक सर्वनाम का निकटतम पूर्वपद ‘संदूक’ है। ऐतिहासिक सामंजस्य के लिए पाठ को बदलने के बजाय उसकी स्पष्ट वाक्यरचना बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरंभ ‘जिसमें’ से किया गया है। लंबी यूनानी सूची को पठनीय बनाने के लिए दो हिन्दी वाक्यों में बाँटा गया है।
