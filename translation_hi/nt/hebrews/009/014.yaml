source:
  edition: SBLGNT
  text: πόσῳ μᾶλλον τὸ αἷμα τοῦ Χριστοῦ, ὃς διὰ πνεύματος αἰωνίου ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ, καθαριεῖ τὴν συνείδησιν ⸀ἡμῶν ἀπὸ νεκρῶν ἔργων εἰς τὸ λατρεύειν θεῷ ζῶντι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/014.yaml
  text: how much more will the blood of Messiah—who through the eternal Spirit offered himself without blemish to God—cleanse our conscience from dead works to serve the living God[a].
translation:
  language: hi
  text: तो जिस मसीह ने अनन्त आत्मा[a] के द्वारा अपने आप को परमेश्वर को निष्कलंक अर्पित किया, उसका लहू हमारे विवेक को मरे हुए कामों से शुद्ध करके जीवित परमेश्वर की सेवा करने के लिए कितना अधिक शुद्ध करेगा!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक अनन्त आत्मा के द्वारा।” यूनानी पदबंध को अधिक सामान्य अर्थ में भी समझा जा सकता है; मुख्य पाठ में इसे पवित्र आत्मा का उल्लेख माना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: πόσῳ μᾶλλον
  choice: कितना अधिक
  rationale: पिछले पद से निकले न्यूनाधिक तर्क की आलंकारिक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τὸ αἷμα τοῦ Χριστοῦ
  choice: मसीह का लहू
  rationale: αἷμα का बलिदान-संबंधी ठोस अर्थ सुरक्षित है और Χριστός को पदवी के रूप में ‘मसीह’ कहा गया है।
- source_word: διὰ πνεύματος αἰωνίου
  choice: अनन्त आत्मा के द्वारा
  rationale: διά का माध्यमवाचक अर्थ रखा गया है; मुख्य पाठ में सम्भावित व्यक्तिगत दिव्य आत्मा का संकेत है, जबकि यूनानी की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: ἑαυτὸν προσήνεγκεν ἄμωμον τῷ θεῷ
  choice: अपने आपको निर्दोष बलि के रूप में परमेश्वर को अर्पित किया
  rationale: ‘अर्पित किया’ याजकीय-बलिदानिक प्रसंग को व्यक्त करता है; ‘बलि के रूप में’ हिन्दी में ἄμωμον के बलिदान-संबंधी भाव को स्पष्ट करता है, बिना किसी अलग वस्तु को पाठ में जोड़ने के।
- source_word: καθαριεῖ τὴν συνείδησιν ἡμῶν
  choice: हमारे विवेक को ... शुद्ध करके ... योग्य बनाएगा
  rationale: भविष्यकाल और शुद्धीकरण दोनों सुरक्षित हैं; हिन्दी वाक्य-विन्यास में उद्देश्यवाचक εἰς τὸ λατρεύειν से स्वाभाविक संबंध बनाने के लिए ‘योग्य बनाएगा’ प्रयुक्त है।
- source_word: ἀπὸ νεκρῶν ἔργων
  choice: मरे हुए कामों से
  rationale: वाक्यांश की धर्मवैचारिक सघनता और इब्रानियों 6:1 से उसका संबंध बनाए रखने वाला निकट अनुवाद।
- source_word: εἰς τὸ λατρεύειν θεῷ ζῶντι
  choice: जीवित परमेश्वर की सेवा करने के योग्य
  rationale: उद्देश्य का भाव स्पष्ट करता है; ‘सेवा’ λατρεύω के उपासना और समर्पित सेवा—दोनों आयामों के लिए पर्याप्त व्यापक है।
theological_decisions:
- issue: πνεύματος αἰωνίου का संदर्भ
  choice: ‘अनन्त आत्मा’—मुख्य पाठ में पवित्र आत्मा की सम्भावित ओर संकेत
  alternative: ‘एक अनन्त आत्मा’ अथवा मसीह की अपनी अनन्त आत्मा
  rationale: यूनानी पदबंध लेखरहित होने के कारण एक से अधिक अर्थ सम्भव करता है। मुख्य पाठ सर्वाधिक सम्भावित व्यक्तिगत संदर्भ रखता है, पर पादटिप्पणी अस्पष्टता को मिटने नहीं देती।
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द अभिषिक्त जन की पदवी के रूप में सक्रिय है; ‘मसीह’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक और अर्थवाही है।
- issue: νεκρῶν ἔργων का अर्थ
  choice: मरे हुए काम
  alternative: मृत्यु की ओर ले जाने वाले काम
  rationale: मूल पदबंध यह स्पष्ट नहीं करता कि काम स्वयं निष्प्राण हैं, मृत्यु उत्पन्न करते हैं, या मृत्यु से जुड़े हैं; निकट अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। यूनानी की लंबी संरचना को दो वाक्यों में बाँटा गया है, पर तर्क और बलिदान-संबंधी संबंध सुरक्षित रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में मौजूद है।
