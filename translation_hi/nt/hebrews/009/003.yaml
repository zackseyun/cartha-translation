lexical_decisions:
- source_word: μετὰ ... τὸ δεύτερον καταπέτασμα
  choice: दूसरे परदे के पीछे
  rationale: यहाँ μετά के साथ कर्मकारक स्थान-संबंध बताता है; पवित्रस्थान की बनावट के वर्णन में ‘पीछे’ स्वाभाविक है। καταπέτασμα उस भीतरी परदे को दर्शाता है जो दोनों भागों को अलग करता था।
- source_word: δὲ
  choice: और
  rationale: δέ वर्णन को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध का भाव नहीं जोड़ता।
- source_word: σκηνὴ
  choice: तंबू
  rationale: σκηνή मूलतः मिलापवाले तंबू और यहाँ उसके भीतरी भाग को संदर्भित करता है। ‘तंबू’ मूल रूपक और निर्गमनकालीन उपासना-व्यवस्था से संबंध बनाए रखता है।
- source_word: ἡ λεγομένη
  choice: जो ... कहलाता है
  rationale: विशेषणात्मक कृदंत का यह स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: Ἅγια Ἁγίων
  choice: परमपवित्र स्थान
  rationale: यूनानी सामी शैली की श्रेष्ठतासूचक अभिव्यक्ति का अर्थ ‘सबसे पवित्र स्थान’ है; ‘परमपवित्र स्थान’ आधुनिक हिन्दी में संक्षिप्त, गरिमापूर्ण और प्रचलित है।
theological_decisions:
- issue: Ἅγια Ἁγίων नामक भीतरी पवित्रस्थान का अनुवाद
  choice: परमपवित्र स्थान
  alternative: पवित्रों का पवित्र
  rationale: मुख्य पाठ में अर्थ-स्पष्ट आधुनिक पद रखा गया है, जबकि अधिक शब्दशः पारंपरिक अभिव्यक्ति को पादटिप्पणी में सुरक्षित रखा गया है; इससे उपासना-संबंधी पद का महत्व बना रहता है और किसी सांप्रदायिक व्याख्या का आयात नहीं होता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘तंबू’ मूल σκηνή की ठोस छवि बचाता है, यद्यपि इस प्रसंग में उसका आशय तंबू के भीतरी भाग से है।
