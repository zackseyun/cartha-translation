source:
  edition: SBLGNT
  text: τοῦτο δηλοῦντος τοῦ πνεύματος τοῦ ἁγίου, μήπω πεφανερῶσθαι τὴν τῶν ἁγίων ὁδὸν ἔτι τῆς πρώτης σκηνῆς ἐχούσης στάσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/008.yaml
  text: By this the Holy Spirit is indicating that the way into the holy places has not yet been revealed while the first tabernacle still has standing,
translation:
  language: hi
  text: इससे पवित्र आत्मा यह स्पष्ट करता है कि जब तक पहला तंबू कायम है[b], तब तक पवित्र स्थानों[a] में प्रवेश का मार्ग अभी तक प्रकट नहीं हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान में प्रवेश का मार्ग।” यूनानी पदबंध सामान्य रूप से पवित्र क्षेत्र को दर्शा सकता है; कुछ इसे अधिक विशेष रूप से “परमपवित्र स्थान में प्रवेश का मार्ग” समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या “जब तक पहला तंबू खड़ा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: δηλοῦντος
  choice: यह स्पष्ट करता है
  rationale: वर्तमान कृदन्त का प्रसंग में व्याख्यात्मक बल है। हिंदी में वर्तमानकालीन सीमित क्रिया स्वाभाविक और स्पष्ट है।
- source_word: πνεύματος τοῦ ἁγίου
  choice: पवित्र आत्मा
  rationale: यह नए नियम में इस पदबंध का मानक और स्वाभाविक हिंदी रूप है।
- source_word: μήπω πεφανερῶσθαι
  choice: अभी तक प्रकट नहीं हुआ है
  rationale: पूर्ण निष्क्रिय क्रिया उस निरंतर अवस्था को व्यक्त करती है जिसमें मार्ग अब तक प्रकट नहीं हुआ; हिंदी पूर्ण वर्तमान इस बल को सहजता से रखता है।
- source_word: τὴν τῶν ἁγίων ὁδὸν
  choice: पवित्र स्थानों में प्रवेश का मार्ग
  rationale: तंबू के प्रसंग में यह पवित्र जनों के मार्ग के बजाय पवित्र क्षेत्र तक पहुँच को दर्शाता है। बहुवचन को बनाए रखा गया है और हिंदी में आशय स्पष्ट करने के लिए ‘प्रवेश’ जोड़ा गया है।
- source_word: πρώτης σκηνῆς
  choice: पहला तंबू
  rationale: ‘तंबू’ इस्राएली उपासना-तंबू के सांस्कृतिक संदर्भ को सरल और वर्तमान हिंदी में रखता है; ‘पहला’ निकटवर्ती स्थानिक भेद का अनुसरण करता है।
- source_word: ἐχούσης στάσιν
  choice: कायम है
  rationale: यह अभिव्यक्ति तंबू के बने रहने और उसकी व्यवस्था के प्रभावी रहने—दोनों संभावित संकेतों को बिना अनावश्यक रूप से सीमित किए व्यक्त करती है।
- source_word: ἔτι
  choice: जब तक ... तब तक
  rationale: यह हिंदी संरचना उस अवधि को स्वाभाविक ढंग से व्यक्त करती है जिसमें पहले तंबू की स्थिति बनी रहती है।
theological_decisions:
- issue: τῶν ἁγίων का संदर्भ
  choice: पवित्र स्थानों में प्रवेश
  alternative: पवित्र जनों का मार्ग
  rationale: आसपास का प्रसंग तंबू की रचना और याजकीय प्रवेश के विषय में है, इसलिए अर्थ स्थानिक और उपासना-संबंधी है, न कि कलीसियाई।
- issue: पवित्र स्थान का विशिष्ट विस्तार
  choice: पवित्र स्थानों
  alternative: पवित्रस्थान अथवा परमपवित्र स्थान
  rationale: यूनानी बहुवचन व्यापक है। यद्यपि प्रसंग विशेष रूप से भीतरी परमपवित्र स्थान की ओर संकेत कर सकता है, मुख्य पाठ उस संभावित संकुचन को निर्णायक नहीं बनाता।
- issue: पहले तंबू के बने रहने का आशय
  choice: कायम है
  alternative: खड़ा है
  rationale: यूनानी पदबंध भौतिक रूप से बने रहने के साथ उसकी स्थापित स्थिति या प्रभाव के बने रहने का भी संकेत दे सकता है; ‘कायम’ इस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्र स्थानों’ द्वारा यूनानी बहुवचन सुरक्षित है, जबकि ‘कायम है’ अस्तित्व और प्रभावी स्थिति के बीच की वास्तविक अर्थगत व्यापकता को बनाए रखता है।
