id: HEB.9.23
reference: Hebrews 9:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀνάγκη οὖν τὰ μὲν ὑποδείγματα τῶν ἐν τοῖς οὐρανοῖς τούτοις καθαρίζεσθαι, αὐτὰ δὲ τὰ ἐπουράνια κρείττοσι θυσίαις παρὰ ταύτας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/023.yaml
  text: Therefore it was necessary for the copies of the things in the heavens to be cleansed with these[c][b][a], but the heavenly things themselves with better sacrifices than these.
translation:
  language: hi
  text: इसलिए यह आवश्यक था कि स्वर्गों में स्थित वस्तुओं के प्रतिरूपों[a] को इनसे शुद्ध किया जाए, पर स्वयं स्वर्गीय वस्तुओं को इनसे उत्तम बलिदानों[c] के द्वारा शुद्ध किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नमूनों” अथवा “निरूपणों।”
    reason: lexical_alternative
  - marker: c
    text: यूनानी में “उत्तम बलिदान” (एकवचन) नहीं, बल्कि “उत्तम बलिदानों” (बहुवचन) है, यद्यपि इब्रानियों के संदर्भ में मसीह के एक बार सदा के लिए दिए गए अर्पण पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνάγκη
  choice: यह आवश्यक था
  rationale: यूनानी का यह निर्वैयक्तिक पद आवश्यकता व्यक्त करता है। संदर्भ में पिछली विधियों और मसीह के कार्य की व्याख्या होने के कारण भूतकाल स्वाभाविक है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले विवेचन से निकले निष्कर्ष को स्पष्ट करता है।
- source_word: ὑποδείγματα
  choice: प्रतिरूपों
  rationale: यह शब्द उन पृथ्वी की उपासना-संबंधी वस्तुओं को दर्शाता है जो स्वर्ग की वस्तुओं के अनुरूप निरूपण हैं। ‘प्रतिरूप’ तुलना को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य है।
- source_word: τῶν ἐν τοῖς οὐρανοῖς
  choice: स्वर्ग की वस्तुओं के
  rationale: यह संबंधवाचक पद बताता है कि प्रतिरूप किन वस्तुओं के अनुरूप हैं। हिन्दी में ‘स्वर्ग की वस्तुएँ’ स्वाभाविक है और इसे बाद के विशेषण ἐπουράνια से शब्दशः एकरूप नहीं बनाता।
- source_word: τούτοις
  choice: इनसे
  rationale: संकेतवाचक सर्वनाम को संक्षिप्त रखा गया है; संदर्भ इसके द्वारा पहले बताए गए बलिदानी शुद्धीकरण के साधनों की ओर संकेत करता है।
- source_word: καθαρίζεσθαι
  choice: शुद्ध किया जाए
  rationale: क्रिया का अनुष्ठानिक अर्थ शुद्ध करने का है। ‘शुद्ध किया जाए’ धार्मिक संदर्भ को बनाए रखता है और सामान्य पाठक के लिए स्पष्ट है।
- source_word: αὐτὰ δὲ τὰ ἐπουράνια
  choice: पर स्वयं स्वर्गीय वस्तुओं को
  rationale: ‘स्वयं’ αὐτά के बलाघात को सुरक्षित रखता है और ‘स्वर्गीय वस्तुएँ’ पृथ्वी के प्रतिरूपों के साथ मूल विरोध को बनाए रखता है।
- source_word: κρείττοσι θυσίαις
  choice: उत्तम बलिदानों के द्वारा
  rationale: ‘उत्तम’ इब्रानियों में बार-बार आने वाले तुलना-सूचक κρείττων को व्यक्त करता है। θυσίαις का बहुवचन ज्यों का त्यों रखा गया है।
- source_word: παρὰ ταύτας
  choice: इनसे उत्तम
  rationale: तुलनात्मक पद के साथ παρά का अर्थ ‘इनसे उत्तम’ है और यह पहले उल्लिखित शुद्धीकरण-साधनों से तुलना करता है।
theological_decisions:
- issue: ‘स्वर्गीय वस्तुओं’ का संदर्भ और उनका शुद्ध किया जाना
  choice: मूल पाठ के कथन को बिना व्याख्यात्मक नरमी के रखा गया है कि स्वयं स्वर्गीय वस्तुएँ उत्तम बलिदानों से शुद्ध की जाती हैं।
  alternative: इसे केवल स्वर्गीय पवित्रस्थान या स्वर्ग से संबंधित लोगों के रूप में स्पष्ट कर देना, अथवा स्वर्ग के शुद्ध होने का कथन टाल देना।
  rationale: यूनानी पाठ पृथ्वी के प्रतिरूपों और स्वयं स्वर्गीय वस्तुओं में स्पष्ट विरोध करता है तथा दोनों के लिए शुद्धीकरण की भाषा लागू करता है। अनुवाद इस धर्मवैज्ञानिक तनाव को हल नहीं करता।
- issue: मसीह के एकमात्र बलिदान के संदर्भ में ‘बलिदानों’ का बहुवचन
  choice: मुख्य पाठ में ‘बलिदानों’ बहुवचन रखा गया है।
  alternative: इब्रानियों में मसीह के एक बार के अर्पण के अनुरूप इसे एकवचन ‘बलिदान’ कर देना।
  rationale: यहाँ यूनानी θυσίαις स्पष्ट रूप से बहुवचन है। इसे बनाए रखना मूल-पाठ को प्राथमिकता देता है और अन्य पदों के धर्मवैज्ञानिक कथन से कृत्रिम सामंजस्य नहीं बैठाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। वाक्य के दूसरे खंड में यूनानी की लुप्त क्रिया को हिन्दी की स्पष्टता के लिए दोहराया गया है। ‘प्रतिरूप,’ ‘शुद्ध,’ और ‘उत्तम बलिदान’ मूल की उपासना-विधि संबंधी शब्दावली और धर्मवैज्ञानिक तनाव को सुरक्षित रखते हैं।
