source:
  edition: SBLGNT
  text: διαθήκη γὰρ ἐπὶ νεκροῖς βεβαία, ἐπεὶ ⸀μήποτε ἰσχύει ὅτε ζῇ ὁ διαθέμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/017.yaml
  text: For a covenant is valid over dead ones[b][a], since it is never in force while the one who made it is living.
translation:
  language: hi
  text: वाचा मृतकों के संबंध में ही वैध होती है[b][a], क्योंकि जब तक उसे बनाने वाला जीवित है, वह कभी लागू नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वसीयत मृत्यु के बाद ही वैध होती है, क्योंकि जब तक उसे बनाने वाला जीवित है, वह कभी लागू नहीं होती।” यूनानी शब्द का अर्थ “वाचा” अथवा “वसीयत” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “मृतकों के संबंध में” यूनानी में एक संक्षिप्त पद है। इसका संकेत मृत व्यक्तियों की ओर हो सकता है—जैसे वसीयत के प्रसंग में—या वाचा की पुष्टि में सम्मिलित मृत्यु की ओर।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαθήκη
  choice: वाचा
  rationale: इब्रानियों 8–10 का व्यापक संदर्भ मूसा की वाचा, नई वाचा और बलिदान के लहू से वाचा के उद्घाटन पर केंद्रित है। फिर भी ‘वसीयत’ का अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἐπὶ νεκροῖς
  choice: मरे हुओं के ऊपर
  rationale: यह जानबूझकर संक्षिप्त और खुला अनुवाद है, जो मृत व्यक्तियों अथवा वाचा की पुष्टि में हुई मृत्यु—दोनों संभावनाओं को पूरी तरह बंद नहीं करता।
- source_word: βεβαία
  choice: प्रभावी
  rationale: यहाँ शब्द किसी वाचा या कानूनी व्यवस्था के प्रभावी और बाध्यकारी होने का भाव देता है।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है।
- source_word: μήποτε
  choice: कभी नहीं
  rationale: इस प्रसंग में यह ἰσχύει के साथ किसी भी समय प्रभावी न होने का अर्थ देता है।
- source_word: ἰσχύει
  choice: लागू होती
  rationale: यह कानूनी या वाचागत प्रभाव और क्रियाशीलता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὅτε ζῇ
  choice: जब तक ... जीवित रहता है
  rationale: यह मृत्यु के विपरीत जारी जीवन की अवधि को स्पष्ट रूप से व्यक्त करता है।
- source_word: ὁ διαθέμενος
  choice: उसे ठहराने वाला
  rationale: यह वाचा ठहराने वाले और वसीयत करने वाले—दोनों संभावित अर्थों के लिए अपेक्षाकृत खुला है।
theological_decisions:
- issue: διαθήκη को ‘वाचा’ माना जाए या ‘वसीयत’।
  choice: मुख्य पाठ में ‘वाचा’
  alternative: ‘वसीयत’
  rationale: निकट और व्यापक प्रसंग वाचागत है, पर 9:16–17 की भाषा वसीयत संबंधी अर्थ भी ग्रहण कर सकती है। वास्तविक तनाव को बनाए रखने के लिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: ἐπὶ νεκροῖς की अस्पष्टता कितनी स्पष्ट की जाए।
  choice: ‘मरे हुओं के ऊपर’ जैसा खुला अनुवाद
  alternative: ‘मृत्यु हो जाने पर’ या ‘मृत व्यक्तियों के मामले में’
  rationale: यूनानी पद संक्षिप्त और विवादित है; यह वसीयतकर्ता की मृत्यु या वाचा-पुष्टि में बलिदानी मृत्यु की ओर संकेत कर सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। मुख्य पाठ में यूनानी की वास्तविक संक्षिप्तता और व्याख्यात्मक अस्पष्टता को जानबूझकर बनाए रखा गया है; [b][a] चिह्न अंग्रेज़ी परामर्श-पाठ के क्रम के अनुरूप हैं।
