review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders διαθήκη as “वाचा” while retaining the viable testamentary alternative in a note. It also appropriately seeks to preserve the disputed ellipsis of ἐπὶ νεκροῖς. However, “मरे हुओं के ऊपर” is a calque that does not communicate a coherent meaning in modern Hindi. The wording for ὁ διαθέμενος is also less natural than necessary.
  naturalness: The repeated “क्योंकि” makes the sentence needlessly heavy, and “मरे हुओं के ऊपर” is not idiomatic Hindi. “मृतकों के संबंध में” is both intelligible and sufficiently noncommittal in this disputed phrase. “उसे बनाने वाला” naturally preserves the referential openness of the Greek participle.
  terminology: “वाचा,” “वसीयत,” “वैध,” and “लागू” are suitable. The revised text retains the covenant framing without foreclosing the will/testament reading in the footnote.
  issues:
  - severity: medium
    issue: “मरे हुओं के ऊपर” is not natural or semantically clear in Hindi.
    rationale: Although it follows the English wording closely, Hindi does not use “के ऊपर” naturally for this compressed Greek construction. It risks obscuring rather than preserving the source ambiguity.
  - severity: low
    issue: The sentence repeats “क्योंकि” in an awkward way.
    rationale: Both γάρ and ἐπεί are causal, but Hindi need not reproduce them with identical consecutive conjunctions. A smoother construction can preserve the explanatory relation.
  - severity: low
    issue: “उसे ठहराने वाला” is somewhat stiff and narrow.
    rationale: “उसे बनाने वाला” is more idiomatic and remains open enough to cover a covenant-maker or maker of a will.
  revised_text: वाचा मृतकों के संबंध में ही वैध होती है[b][a], क्योंकि जब तक उसे बनाने वाला जीवित है, वह कभी लागू नहीं होती।
