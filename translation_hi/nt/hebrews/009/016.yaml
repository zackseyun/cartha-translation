  yaml_path: translation/nt/hebrews/009/016.yaml
  text: For where there is a covenant[a], it is necessary for the death of the one who made it to be brought forward.
translation:
  language: hi
  text: क्योंकि जहाँ वाचा[a] है, वहाँ वाचा बाँधनेवाले की मृत्यु को प्रस्तुत किया जाना आवश्यक है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि जहाँ वसीयत है, वहाँ वसीयत बनानेवाले की मृत्यु सिद्ध होना आवश्यक है।” यूनानी शब्द ‘दियाथेके’ का अर्थ ‘वाचा’ या ‘वसीयत’—दोनों हो सकता है; बहुत-से लोग पद 16–17 में इसे कानूनी अर्थ में समझते हैं।
    reason: वैकल्पिक अर्थ और पाठ
lexical_decisions:
- source_word: διαθήκη
  choice: वाचा
  rationale: इब्रानियों 8–10 के व्यापक प्रसंग में यिर्मयाह 31 की वाचा और बलिदान द्वारा उसके लागू किए जाने की चर्चा प्रमुख है। फिर भी यूनानी शब्द का अर्थ ‘वसीयत’ भी हो सकता है; उस अर्थ को पादटिप्पणी में रखा गया है।
- source_word: θάνατον
  choice: मृत्यु
  rationale: यह θάνατος का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: ἀνάγκη
  choice: आवश्यक है
  rationale: यह यूनानी पद द्वारा व्यक्त अनिवार्यता को आधुनिक हिन्दी में स्वाभाविक ढंग से बताता है।
- source_word: φέρεσθαι
  choice: सामने लाया जाना
  rationale: यह φέρω के कर्मवाच्य रूप में निहित ‘लाया/प्रस्तुत किया जाना’ का भाव बनाए रखता है और केवल ‘होना’ कहकर क्रिया को लुप्त नहीं करता।
- source_word: τοῦ διαθεμένου
  choice: उसे ठहरानेवाले
  rationale: यह कृदन्त को उस व्यक्ति के रूप में व्यक्त करता है जिसने वाचा ठहराई, पर मुख्य पाठ में संकीर्ण कानूनी पद ‘वसीयतकर्ता’ नहीं थोपता।
- source_word: ὅπου γὰρ
  choice: क्योंकि जहाँ
  rationale: ‘क्योंकि’ γάρ की व्याख्यात्मक भूमिका और ‘जहाँ’ ὅπου के स्थान/परिस्थिति-सूचक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: इब्रानियों 9:16 में διαθήκη का अर्थ ‘वाचा’ है या ‘वसीयत’
  choice: मुख्य पाठ में ‘वाचा’, और पादटिप्पणी में ‘वसीयत’
  alternative: 'मुख्य पाठ: “क्योंकि जहाँ वसीयत है, वहाँ वसीयत करनेवाले की मृत्यु सिद्ध होना आवश्यक है।”'
  rationale: आसपास का व्यापक तर्क वाचा, बलिदान और लहू पर केंद्रित है, इसलिए मुख्य पाठ में ‘वाचा’ प्रसंग के साथ अधिक संगत है। किन्तु पद 16–17 को कानूनी वसीयत के अर्थ में समझना भी भाषायी रूप से संभव और व्यापक रूप से मान्य है; अतः उस वास्तविक अस्पष्टता को पादटिप्पणी में स्पष्ट रखा गया है।
- issue: φέρεσθαι को ‘सिद्ध होना’ या ‘सामने लाया जाना’ कहना
  choice: सामने लाया जाना
  alternative: सिद्ध होना
  rationale: ‘सामने लाया जाना’ यूनानी क्रिया के मूल भाव के अधिक निकट है और कानूनी अर्थ को मुख्य पाठ में निर्णायक रूप से आरोपित नहीं करता। ‘सिद्ध होना’ वसीयत-वाले वैकल्पिक पाठ में अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ठहरानेवाले’ वाचा स्थापित करनेवाले व्यक्ति को संक्षेप में व्यक्त करता है। ‘मृत्यु को सामने लाया जाना’ जानबूझकर कुछ औपचारिक है, क्योंकि यह यूनानी अभिव्यक्ति की असामान्यता और उसकी व्याख्यात्मक खुली जगह को बनाए रखता है।
