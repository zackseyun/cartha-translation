language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐδὲ δι’ αἵματος τράγων καὶ μόσχων διὰ δὲ τοῦ ἰδίου αἵματος, εἰσῆλθεν ἐφάπαξ εἰς τὰ ἅγια, αἰωνίαν λύτρωσιν εὑράμενος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/012.yaml
  text: and not through the blood of goats and calves[a], but through his own blood, he entered once for all into the holy places, having obtained eternal redemption.
translation:
  language: hi
  text: और बकरों और बछड़ों के लहू के द्वारा नहीं, बल्कि अपने ही लहू के द्वारा, अनन्त छुटकारा प्राप्त करके उसने एक ही बार, सदा के लिए पवित्र स्थानों[a] में प्रवेश किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान में।’ यूनानी में शाब्दिक रूप से ‘पवित्र स्थानों में’ है। कुछ अनुवाद इसे अधिक विशिष्ट रूप से ‘परमपवित्र स्थान में’ कहते हैं, पर यूनानी शब्दावली स्वयं इतनी विशिष्ट नहीं है।
    reason: वैकल्पिक अनुवाद और यूनानी बहुवचन की वास्तविक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: οὐδὲ
  choice: और ... नहीं
  rationale: यह पिछले कथन को आगे बढ़ाते हुए विरोध प्रस्तुत करता है; इसलिए संयोजक बल को बनाए रखा गया है।
- source_word: δι’ αἵματος τράγων καὶ μόσχων
  choice: बकरों और बछड़ों के लहू के द्वारा
  rationale: διά के साधनात्मक अर्थ को ‘के द्वारा’ स्वाभाविक हिन्दी में व्यक्त करता है; τράγων नर बकरों और μόσχων बछड़ों को सूचित करता है।
- source_word: διὰ δὲ τοῦ ἰδίου αἵματος
  choice: बल्कि अपने ही लहू के द्वारा
  rationale: दोहराए गए διά का समान अनुवाद विरोध को स्पष्ट रखता है, और ‘अपने ही’ ἰδίου के बलाघात को सुरक्षित रखता है।
- source_word: εἰσῆλθεν
  choice: उसने ... प्रवेश किया
  rationale: अनिश्चित कर्ता को हिन्दी की स्वाभाविक रचना में व्यक्त करते हुए भूतकाल की पूर्ण घटना को बनाए रखा गया है।
- source_word: ἐφάπαξ
  choice: सदा के लिए एक ही बार
  rationale: यह एकमात्र, निर्णायक और न दोहराए जाने वाले कार्य का भाव व्यक्त करता है।
- source_word: εἰς τὰ ἅγια
  choice: पवित्र स्थानों में
  rationale: यूनानी बहुवचन को सुरक्षित रखा गया है और इसे अधिक विशिष्ट ‘परमपवित्र स्थान’ बनाकर व्याख्यात्मक रूप से सीमित नहीं किया गया।
- source_word: αἰωνίαν λύτρωσιν
  choice: अनन्त छुटकारा
  rationale: यह स्थायी प्रभाव वाले redemption को सामान्य, सुबोध और धर्मशास्त्रीय रूप से पर्याप्त हिन्दी में व्यक्त करता है।
- source_word: εὑράμενος
  choice: और ... प्राप्त किया
  rationale: शाब्दिक ‘पाकर’ के बजाय प्रसंगगत अर्थ ‘प्राप्त करना’ लिया गया है; समन्वित हिन्दी वाक्य participle के पूर्णतासूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: अपने लहू के द्वारा मसीह के प्रवेश का आशय
  choice: पशुओं के लहू के विपरीत, प्रवेश के साधन के रूप में ‘अपने ही लहू के द्वारा’ कहा गया है।
  alternative: वह अपने लहू को भौतिक रूप से लेकर या प्रस्तुत करते हुए भीतर गया; अथवा केवल लहू बहाने के बाद भीतर गया।
  rationale: दोनों स्थानों पर διά + संबंधकारक का समान साधनात्मक अनुवाद बलिदानी विरोध को बनाए रखता है, पर स्वर्गीय पवित्रस्थान में लहू प्रस्तुत करने की प्रक्रिया के बारे में पाठ से अधिक निश्चित कथन नहीं करता।
- issue: τὰ ἅγια का विस्तार
  choice: पवित्र स्थानों
  alternative: पवित्रस्थान; परमपवित्र स्थान
  rationale: यूनानी पद बहुवचन है और पवित्रस्थान के लिए उपासना-संबंधी पद भी हो सकता है। ‘परमपवित्र स्थान’ चुनना पाठ की अपेक्षा अधिक विशिष्ट व्याख्या होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली अपनाई गई है। ‘लहू’, ‘पवित्र स्थान’ और ‘अनन्त छुटकारा’ बलिदानी तथा उपासना-संबंधी संदर्भ को बनाए रखते हैं। वाक्यरचना को स्वाभाविक बनाने के लिए participle को ‘और ... प्राप्त किया’ के रूप में व्यक्त किया गया है।
