  text: εἰς δὲ τὴν δευτέραν ἅπαξ τοῦ ἐνιαυτοῦ μόνος ὁ ἀρχιερεύς, οὐ χωρὶς αἵματος, ὃ προσφέρει ὑπὲρ ἑαυτοῦ καὶ τῶν τοῦ λαοῦ ἀγνοημάτων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/007.yaml
  text: But into the second room only the high priest enters once a year[a], and not without blood[b], which he offers for himself and for the people's sins committed in ignorance.
translation:
  language: hi
  text: पर दूसरे भाग में केवल महायाजक ही वर्ष में एक बार प्रवेश करता है[a], और वह भी बिना लहू के नहीं। वह उस लहू को अपने लिए और लोगों द्वारा अनजाने में किए गए पापों के लिए चढ़ाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दूसरे तंबू में’ अथवा ‘दूसरे कक्ष में’; इसका संकेत पवित्र तंबू के भीतरी भाग की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या ‘लोगों के अनजाने पापों के लिए’ अथवा ‘लोगों द्वारा अज्ञान में किए गए पापों के लिए’।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς δὲ τὴν δευτέραν
  choice: पर दूसरे भाग में
  rationale: यूनानी में संज्ञा लुप्त है और संदर्भ तंबू के दूसरे, भीतरी भाग का है। ‘भाग’ स्थानिक भेद को स्वाभाविक हिंदी में रखता है और ‘कमरा’ या ‘तंबू’ को अनिवार्य रूप से नहीं थोपता।
- source_word: ἅπαξ τοῦ ἐνιαυτοῦ
  choice: वर्ष में एक बार
  rationale: वार्षिक आवृत्ति का स्वाभाविक और सटीक हिंदी रूप।
- source_word: μόνος ὁ ἀρχιερεύς
  choice: केवल महायाजक ही
  rationale: μόνος की विशिष्टता को ‘केवल…ही’ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: οὐ χωρὶς αἵματος
  choice: और वह भी बिना लहू के नहीं
  rationale: यूनानी के नकारात्मक बल और बलिदानी बिंब दोनों को बनाए रखता है; ‘वह भी’ हिंदी में प्रवेश की शर्त को स्पष्ट करता है।
- source_word: ὃ προσφέρει
  choice: वह उस लहू को … चढ़ाता है
  rationale: προσφέρει का बलिदानी अर्थ ‘चढ़ाता है’ से स्पष्ट होता है और संबंधवाचक सर्वनाम का आशय स्वाभाविक हिंदी वाक्य में खुल जाता है।
- source_word: ὑπὲρ ἑαυτοῦ
  choice: अपने लिए
  rationale: बलिदानी संदर्भ में ὑπέρ के प्रतिनिधिक अथवा लाभार्थक संबंध को सरलता से व्यक्त करता है।
- source_word: τῶν τοῦ λαοῦ ἀγνοημάτων
  choice: लोगों से अनजाने में हुए पापों के लिए
  rationale: ἀγνοήματα को केवल जानकारी के अभाव के रूप में नहीं, बल्कि अनजाने में किए गए दोषपूर्ण कर्मों के रूप में प्रस्तुत करता है; नैतिक और बलिदानी अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: ἀγνοήματα का बलिदानी संदर्भ में स्वरूप
  choice: अनजाने में हुए पाप
  alternative: अज्ञान में किए गए पाप; अनजाने पाप
  rationale: यह पद दोषपूर्ण अपराधों की बात करता है जिनकी विशेषता अज्ञान या अनिच्छा है। चुना हुआ रूप दोषभाव को बनाए रखता है, पर पाठ से आगे जाकर जानबूझकर किए गए पापों पर कोई व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं थोपता।
- issue: ‘लहू’ की बलिदानी भूमिका
  choice: उस लहू को … चढ़ाता है
  alternative: लहू लेकर जाता है; लहू भेंट करता है
  rationale: ὃ का पूर्वपद αἵματος है और προσφέρει बलिदानी क्रिया है। हिंदी में वस्तु को दोहराने से संबंध स्पष्ट होता है, बिना बलिदान की प्रकृति पर अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण पर सहज शैली। ‘महायाजक’ और ‘लहू’ जैसे परिचित बाइबलीय शब्द बलिदानी संदर्भ को बनाए रखते हैं। यूनानी की दीर्घ वाक्य-रचना को पठनीयता के लिए दो वाक्यों में बाँटा गया है, पर अर्थ-संबंध सुरक्षित है।
