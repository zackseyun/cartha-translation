translation:
  language: hi
  text: यह कहते हुए, “यह उस वाचा का लहू है, जिसके विषय में परमेश्वर ने तुम्हें आज्ञा दी है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘यह उस वाचा का लहू है, जिसके विषय में परमेश्वर ने तुम्हारे लिए आज्ञा दी है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत पिछले वाक्य की क्रिया से जुड़कर उद्धरण का परिचय देता है; ‘यह कहते हुए’ उस व्याकरणिक संबंध को बनाए रखता है।
- source_word: Τοῦτο
  choice: यह ... है
  rationale: यूनानी में संयोजक क्रिया व्यक्त नहीं है, पर हिंदी में स्वाभाविक और स्पष्ट विधेय-वाक्य के लिए ‘है’ आवश्यक है।
- source_word: αἷμα
  choice: लहू
  rationale: यह बलिदान और वाचा की पुष्टि में प्रयुक्त वास्तविक रक्त को सूचित करता है; हिंदी बाइबलीय संदर्भ में ‘लहू’ सहज, ठोस और गरिमापूर्ण है।
- source_word: διαθήκης
  choice: वाचा
  rationale: निर्गमन 24 की पृष्ठभूमि में इसका अर्थ परमेश्वर और प्रजा के बीच वाचा है, न कि अंतिम वसीयतनामा।
- source_word: ἧς
  choice: जिसकी
  rationale: संबंधवाचक सर्वनाम संबंधकारक रूप में ‘वाचा’ की ओर लौटता है; ‘जिसकी आज्ञा’ यूनानी संरचना को स्पष्ट रूप से दर्शाता है।
- source_word: ἐνετείλατο
  choice: आज्ञा ... दी
  rationale: ἐντέλλομαι का सीधा अर्थ आदेश देना है; ‘आज्ञा दी’ आधुनिक मानक हिंदी में स्वाभाविक है।
- source_word: πρὸς ὑμᾶς
  choice: तुम्हारे लिए
  rationale: πρός + कर्मकारक यहाँ लोगों के संबंध में और उनकी ओर निर्देशित आदेश को व्यक्त करता है; ‘तुम्हारे लिए’ इस अर्थ को स्वाभाविक हिंदी में रखता है, जबकि शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण हिंदी पर्याय।
theological_decisions:
- issue: वाचा की पुष्टि के प्रसंग में διαθήκη का अनुवाद
  choice: वाचा
  alternative: वसीयतनामा
  rationale: यह पद निर्गमन 24:8 की ओर संकेत करता है और मूसा की वाचा के लहू द्वारा आरंभ किए जाने का वर्णन करता है; ‘वसीयतनामा’ तत्काल पुराने नियम की पृष्ठभूमि के अनुकूल नहीं है।
- issue: Τοῦτο के बाद निहित संयोजक क्रिया
  choice: यह ... है
  alternative: यह—वाचा का लहू
  rationale: हिंदी में स्पष्ट और स्वाभाविक कथन के लिए ‘है’ जोड़ना उचित है; इससे यूनानी में निहित विधेय संबंध से आगे कोई धर्मवैज्ञानिक अर्थ नहीं जोड़ा जाता।
- issue: πρὸς ὑμᾶς का संबंध
  choice: तुम्हारे लिए
  alternative: तुम्हें
  rationale: मुख्य पाठ में ‘तुम्हारे लिए’ वाचा संबंधी आदेश के लोगों की ओर निर्देशित होने का स्वाभाविक अर्थ देता है; ‘तुम्हें’ अधिक शाब्दिक संभावना है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण बाइबलीय स्तर रखा गया है। ‘वाचा’ प्रमुख धर्मवैज्ञानिक शब्द के रूप में सुरक्षित है और ‘लहू’ ठोस बलिदानी संदर्भ को बनाए रखता है।
