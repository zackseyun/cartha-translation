lexical_decisions:
- source_word: σκηνή
  choice: निवास
  rationale: यहाँ यह शब्द मूसा के पवित्र तम्बू अर्थात् मिलापवाले निवास को सूचित करता है। ‘निवास’ पवित्रस्थान का भाव रखता है; ‘तम्बू’ शाब्दिक विकल्प है, इसलिए पादटिप्पणी में दिया गया है।
- source_word: σκεύη
  choice: पात्रों
  rationale: अनुष्ठानिक सेवा में प्रयुक्त वस्तुओं के लिए ‘पात्र’ स्वाभाविक और गरिमापूर्ण धार्मिक शब्द है, यद्यपि अर्थ केवल बरतनों तक सीमित नहीं है।
- source_word: λειτουργία
  choice: उपासना में काम आनेवाले
  rationale: संदर्भ में यह सामान्य सेवा नहीं, पवित्रस्थान की याजकीय-अनुष्ठानिक सेवा है। यह वाक्यांश उस विशेष अर्थ को साधारण पाठक के लिए स्पष्ट रखता है।
- source_word: αἷμα
  choice: लहू
  rationale: यह बलिदान के वास्तविक रक्त का उल्लेख है। ‘लहू’ हिन्दी बाइबलीय भाषा में सहज और गरिमापूर्ण है।
- source_word: ὁμοίως
  choice: इसी प्रकार
  rationale: यह पद 19 में वर्णित पिछले छिड़काव से इस क्रिया का संबंध स्पष्ट करता है।
- source_word: ἐράντισεν
  choice: छिड़का
  rationale: अनुष्ठान में रक्त लगाने की इस विधि के लिए यह मानक और स्पष्ट हिन्दी क्रिया है।
- source_word: δὲ
  choice: और ... भी
  rationale: यहाँ δέ हल्का संयोजक है, विरोधसूचक नहीं; ‘और’ तथा ‘भी’ पिछले कथन से स्वाभाविक संबंध व्यक्त करते हैं।
- source_word: πάντα τὰ σκεύη
  choice: सभी पात्रों
  rationale: ‘सभी’ अनुष्ठानिक वस्तुओं की समग्रता को बनाए रखता है।
theological_decisions:
- issue: निर्गमन में वर्णित मूसा की अनुष्ठानिक क्रियाओं से इस कथन का संबंध
  choice: मूसा द्वारा पवित्र निवास और उसकी उपासना-संबंधी वस्तुओं पर लहू छिड़कने के सार-वर्णन के रूप में सीधे अनुवाद किया गया है।
  alternative: निर्गमन के विवरणों से इसका सामंजस्य बैठाने के लिए मुख्य पाठ में ऐतिहासिक या अनुष्ठानिक व्याख्या जोड़ना।
  rationale: यूनानी पाठ स्वयं कोई स्पष्टीकरण नहीं जोड़ता। अनुवाद को अंतर्पाठीय तनाव या विवरणगत प्रश्नों को चुपचाप हल नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और धार्मिक संदर्भ के अनुरूप शैली रखी गई है। ‘उपासना में काम आनेवाले सभी पात्रों’ से याजकीय सेवा का विशेष संदर्भ स्पष्ट होता है, जबकि पादटिप्पणी व्यापक शाब्दिक विकल्प सुरक्षित रखती है।
