source:
  edition: SBLGNT
  text: οὐ γὰρ εἰς χειροποίητα ⸂εἰσῆλθεν ἅγια⸃ Χριστός, ἀντίτυπα τῶν ἀληθινῶν, ἀλλ’ εἰς αὐτὸν τὸν οὐρανόν, νῦν ἐμφανισθῆναι τῷ προσώπῳ τοῦ θεοῦ ὑπὲρ ἡμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/024.yaml
  text: For Messiah did not enter into holy places made by hands[a], copies of the true things, but into heaven itself[c][b], now to appear in the presence of God on our behalf.
translation:
  language: hi
  text: क्योंकि मसीह हाथों से बनाए हुए पवित्र स्थानों में—जो वास्तविक वस्तुओं के प्रतिरूप हैं[a]—प्रवेश नहीं किया, बल्कि स्वर्ग में ही प्रवेश किया, ताकि अब वह हमारी ओर से परमेश्वर के सम्मुख[b] उपस्थित हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनुरूप रूप” या “प्रतिनिधि रूप।” यूनानी शब्द उन वस्तुओं के लिए प्रयुक्त है जो सच्ची या वास्तविक वस्तुओं के अनुरूप हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “परमेश्वर के मुख के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστός
  choice: मसीह
  rationale: हिन्दी में यह प्रचलित और स्वाभाविक रूप है, जो यहाँ पदवी के भाव को बनाए रखता है।
- source_word: χειροποίητα ἅγια
  choice: हाथों से बनाए हुए पवित्र स्थानों
  rationale: बहुवचन ἅγια और मनुष्य-निर्मित सांसारिक पवित्र स्थानों तथा स्वर्गीय वास्तविकता के विरोध को सुरक्षित रखता है।
- source_word: ἀντίτυπα τῶν ἀληθινῶν
  choice: वास्तविक पवित्र स्थानों के प्रतिरूप
  rationale: ἀντίτυπα के अनुरूपता/प्रतिनिधित्व के भाव को व्यक्त करता है; सन्दर्भ से निहित संज्ञा 'पवित्र स्थानों' को स्पष्टता के लिए दोहराया गया है।
- source_word: αὐτὸν τὸν οὐρανόν
  choice: स्वयं स्वर्ग में
  rationale: तीव्रतासूचक αὐτόν को 'स्वयं' से व्यक्त कर सांसारिक प्रतिरूप के बजाय स्वर्ग की वास्तविकता पर बल दिया गया है।
- source_word: νῦν ἐμφανισθῆναι
  choice: ताकि अब वह ... प्रकट हो
  rationale: प्रवेश के उद्देश्य को स्वाभाविक हिन्दी में व्यक्त करते हुए νῦν को स्पष्टतः बनाए रखता है।
- source_word: τῷ προσώπῳ τοῦ θεοῦ
  choice: परमेश्वर के सम्मुख
  rationale: शाब्दिक 'परमेश्वर के मुख के सामने' का स्वाभाविक हिन्दी मुहावरा है और प्रत्यक्ष उपस्थिति का भाव रखता है।
- source_word: ὑπὲρ ἡμῶν
  choice: हमारी ओर से
  rationale: याजकीय और प्रतिनिधिक भाव को किसी अधिक संकीर्ण प्रायश्चित-सिद्धान्त में बदले बिना सुरक्षित रखता है।
theological_decisions:
- issue: ἅγια का उपासना-संबंधी अर्थ
  choice: पवित्र स्थानों
  alternative: पवित्रस्थान
  rationale: यूनानी बहुवचन को बनाए रखता है और किसी एक कक्ष तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: Χριστός की मसीही पदवी
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: आधुनिक मानक हिन्दी में अर्थपूर्ण और व्यापक रूप से समझा जाने वाला पदवी-रूप है।
- issue: ὑπὲρ ἡμῶν का प्रतिनिधिक बल
  choice: हमारी ओर से
  alternative: हमारे लिए
  rationale: सन्दर्भ के याजकीय-मध्यस्थतापूर्ण भाव को अधिक स्पष्ट रखता है, पर कोई अतिरिक्त सिद्धान्त आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में डैश द्वारा प्रतिरूप-वाक्यांश की व्याख्यात्मक भूमिका स्पष्ट की गई है; बहुवचन और स्वर्गीय-सांसारिक विरोध सुरक्षित हैं।
