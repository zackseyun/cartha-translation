  text: Τούτων δὲ οὕτως κατεσκευασμένων, εἰς μὲν τὴν πρώτην σκηνὴν διὰ παντὸς εἰσίασιν οἱ ἱερεῖς τὰς λατρείας ἐπιτελοῦντες,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/006.yaml
  text: With these things prepared in this way[a], the priests continually enter the first tabernacle, performing the services[b],
translation:
  language: hi
  text: इन वस्तुओं के इस प्रकार व्यवस्थित हो जाने के बाद, याजक निवास-तंबू के पहले भाग[a] में नियमित रूप से प्रवेश करते और पवित्र सेवाएँ[b] संपन्न करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहले तंबू” अथवा “पहले कक्ष।” यूनानी शब्द σκηνή का अर्थ “तंबू” हो सकता है; इस संदर्भ में वह निवास-तंबू के पहले भाग को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “उपासना के कार्य” अथवा “अनुष्ठान-संबंधी कर्तव्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Τούτων δὲ οὕτως κατεσκευασμένων
  choice: जब ये वस्तुएँ इस प्रकार व्यवस्थित हो चुकी हैं
  rationale: यह संबंधवाचक निरपेक्ष रचना आगे की क्रिया की परिस्थिति बताती है। संदर्भ में तंबू और उसकी सामग्रियों की व्यवस्था का वर्णन है, इसलिए ‘व्यवस्थित’ स्वाभाविक है और ‘निर्मित’ जितना सीमित नहीं।
- source_word: εἰς μὲν τὴν πρώτην σκηνὴν
  choice: पहले तंबू में
  rationale: σκηνή मूलतः ‘तंबू’ है और यहाँ निवास-तंबू के पहले भाग को सूचित करती है। ‘पहला तंबू’ स्रोत की शब्दावली और अगले पद के ‘दूसरे’ भाग के साथ विरोध दोनों को सुरक्षित रखता है।
- source_word: διὰ παντὸς
  choice: निरंतर
  rationale: यह नियमित रूप से बार-बार होने वाली याजकीय सेवा को दर्शाता है, हर क्षण भीतर उपस्थित रहने को नहीं।
- source_word: εἰσίασιν
  choice: प्रवेश करते हैं
  rationale: वर्तमानकालीन क्रिया यहाँ प्रचलित और बार-बार होने वाली क्रिया बताती है।
- source_word: οἱ ἱερεῖς
  choice: याजक
  rationale: यह अगले पद के महायाजक के विपरीत सामान्य याजकों को संदर्भित करता है।
- source_word: τὰς λατρείας
  choice: उपासना की विधियाँ
  rationale: बहुवचन संज्ञा पवित्रस्थान में किए जाने वाले निर्धारित धार्मिक अनुष्ठानों और सेवाओं को दर्शाती है।
- source_word: ἐπιτελοῦντες
  choice: पूरी करते हैं
  rationale: कृदंत बताता है कि याजक भीतर जाकर निर्धारित उपासना-विधियों को संपन्न करते हैं। हिंदी में संयुक्त वाक्य-रचना अधिक स्वाभाविक है।
theological_decisions:
- issue: पवित्रस्थान के संदर्भ में σκηνή का अनुवाद
  choice: तंबू
  alternative: निवास-तंबू; पहला कक्ष
  rationale: ‘तंबू’ यूनानी शब्द का सीधा अर्थ और मूसा के पवित्रस्थान की ऐतिहासिक छवि बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि संदर्भ में इसका पहला भाग अभिप्रेत हो सकता है।
- issue: याजकीय सेवा में διὰ παντὸς का बल
  choice: निरंतर
  alternative: नियमित रूप से; सदा
  rationale: यह सामान्य याजकों के बार-बार प्रवेश और अगले पद में महायाजक के सीमित वार्षिक प्रवेश के बीच विरोध बनाए रखता है, बिना यह संकेत दिए कि वे हर क्षण भीतर रहते थे।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सहज रूप अपनाया गया है। ‘याजक’, ‘तंबू’ और ‘उपासना की विधियाँ’ पुराने नियम की धार्मिक पृष्ठभूमि को स्पष्ट रखते हैं, जबकि पादटिप्पणियाँ वास्तविक शब्दार्थगत विकल्प सुरक्षित रखती हैं।
