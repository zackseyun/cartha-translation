source:
  edition: SBLGNT
  text: οὕτως καὶ ὁ Χριστός, ἅπαξ προσενεχθεὶς εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας, ἐκ δευτέρου χωρὶς ἁμαρτίας ὀφθήσεται τοῖς αὐτὸν ἀπεκδεχομένοις εἰς σωτηρίαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/028.yaml
  text: so also the Messiah[a], having been offered once to bear the sins of many, will appear a second time, apart from sin, to those who eagerly await him, for salvation.
translation:
  language: hi
  text: वैसे ही मसीह भी बहुतों के पापों को उठाने के लिए एक बार अर्पित किया गया; वह दूसरी बार, पाप के संबंध में नहीं[a], उन लोगों को उद्धार के लिए प्रकट होगा जो उत्सुकता से उसकी प्रतीक्षा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पाप से अलग”; अर्थात् पहली बार के अर्पण की तरह पापों को उठाने के लिए नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ
  choice: वैसे ही … भी
  rationale: यह पद 27 की तुलना को आगे बढ़ाता है; यह हिन्दी में स्वाभाविक ढंग से तुलनात्मक और निष्कर्षात्मक बल बनाए रखता है।
- source_word: ὁ Χριστός
  choice: मसीह
  rationale: यहाँ Χριστός उद्धार-इतिहास के तर्क में एक उपाधि के रूप में प्रयुक्त है; हिन्दी का प्रचलित शीर्षक ‘मसीह’ इसी अर्थ को व्यक्त करता है।
- source_word: ἅπαξ
  choice: एक बार
  rationale: मूल शब्द सीधे तौर पर ‘एक बार’ कहता है; ‘सदा के लिए’ जोड़ना इस स्थान पर स्पष्ट शब्दार्थ से आगे जाता।
- source_word: προσενεχθεὶς
  choice: अर्पित किया गया
  rationale: भूतकालिक निष्क्रिय कृदन्त का निष्क्रिय भाव और मुख्य भविष्यकालीन क्रिया से पहले की घटना सुरक्षित रहती है; आत्म-अर्पण का प्रत्यक्ष उल्लेख नहीं जोड़ा गया।
- source_word: εἰς τὸ πολλῶν ἀνενεγκεῖν ἁμαρτίας
  choice: बहुतों के पाप उठा ले जाने के लिए
  rationale: यह उद्देश्य को व्यक्त करता है और ἀναφέρω के बलिदानी तथा पाप-वहन संबंधी अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: ἐκ δευτέρου
  choice: दूसरी बार
  rationale: पहले अर्पण के साथ कालगत विरोध और दूसरी उपस्थिति का स्पष्ट संकेत सुरक्षित रहता है।
- source_word: χωρὶς ἁμαρτίας
  choice: पाप से अलग
  rationale: यह यूनानी की संक्षिप्त अभिव्यक्ति के निकट है और उसके अर्थ को मुख्य पाठ में व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: ὀφθήσεται
  choice: प्रकट होगा
  rationale: भविष्यकालीन प्रकट होने के अर्थ में यह स्वाभाविक हिन्दी है और केवल ‘देखा जाएगा’ की अपेक्षा प्रसंग के अनुकूल है।
- source_word: τοῖς αὐτὸν ἀπεκδεχομένοις
  choice: उन लोगों के सामने … जो उत्सुकता से उसकी बाट जोहते हैं
  rationale: ἀπεκδέχομαι की उत्कंठापूर्ण, प्रत्याशापूर्ण प्रतीक्षा को ‘उत्सुकता से बाट जोहना’ स्पष्ट रूप से व्यक्त करता है।
- source_word: εἰς σωτηρίαν
  choice: उद्धार के लिए
  rationale: यह लक्ष्य अथवा परिणाम को संक्षिप्त रूप में बनाए रखता है और ‘उद्धार लेकर’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचता है।
theological_decisions:
- issue: दूसरे प्रकट होने में ‘पाप से अलग’ का अर्थ
  choice: मुख्य पाठ में शाब्दिक-संक्षिप्त ‘पाप से अलग’ रखा गया है।
  alternative: ‘पाप के संबंध के बिना,’ अर्थात् पहली बार की तरह पाप उठाने के लिए नहीं।
  rationale: दूसरा प्रकट होना पहले अर्पण के समान पाप-वहन के लिए नहीं है, पर यूनानी वाक्यांश संक्षिप्त है। मुख्य पाठ उसकी धर्मवैज्ञानिक कसावट और संभावित तनाव को सुरक्षित रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अर्पित किया गया,’ ‘बाट जोहते हैं’ और ‘प्रकट होगा’ इब्रानियों के बलिदानी तथा भविष्यकालीन संदर्भ के अनुकूल हैं। पादटिप्पणी का चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी वैकल्पिक व्याख्या दी गई है।
