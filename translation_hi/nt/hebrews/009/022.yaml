source:
  edition: SBLGNT
  text: καὶ σχεδὸν ἐν αἵματι πάντα καθαρίζεται κατὰ τὸν νόμον, καὶ χωρὶς αἱματεκχυσίας οὐ γίνεται ἄφεσις.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/022.yaml
  text: And according to the law[a], almost everything is cleansed with blood, and without the shedding of blood there is no forgiveness.
translation:
  language: hi
  text: और व्यवस्था के अनुसार लगभग सब कुछ लहू से शुद्ध किया जाता है, और लहू बहाए बिना क्षमा[a] नहीं होती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘छुटकारा’ या ‘माफी’ भी हो सकता है; यहाँ आशय पापों की क्षमा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σχεδόν
  choice: लगभग
  rationale: यह क्रिया-विशेषण कथन की सीमा को योग्य बनाता है और स्पष्ट करता है कि व्यवस्था के अधीन शुद्धिकरण की हर विधि में अनिवार्य रूप से लहू नहीं था।
- source_word: ἐν αἵματι
  choice: लहू से
  rationale: यहाँ ἐν साधन का बोध कराता है; ‘लहू से’ स्वाभाविक हिन्दी में अनुष्ठानिक शुद्धिकरण के माध्यम को व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का प्रयोग व्यापक रूप से वस्तुओं और अनुष्ठानिक विषयों के लिए है; ‘लगभग’ के साथ ‘सब कुछ’ सहज और सटीक है।
- source_word: καθαρίζεται
  choice: शुद्ध किया जाता है
  rationale: वर्तमानकालीन कर्मवाच्य व्यवस्था के अधीन प्रचलित रीति को दर्शाता है; ‘शुद्ध’ अनुष्ठानिक और धार्मिक अर्थ को बनाए रखता है।
- source_word: κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार
  rationale: κατά यहाँ मूसा की व्यवस्था के अनुरूप होने का भाव देता है; यह अनुवाद पारंपरिक संदर्भ में स्पष्ट है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: χωρὶς
  choice: बिना
  rationale: यह अभाव का सीधा और स्वाभाविक हिन्दी बोध है।
- source_word: αἱματεκχυσίας
  choice: लहू बहाए
  rationale: यह संज्ञा लहू उंडेले या बहाए जाने को दर्शाती है; हिन्दी वाक्य-विन्यास में ‘लहू बहाए बिना’ बलिदानी संदर्भ को सहज ढंग से सुरक्षित रखता है।
- source_word: οὐ γίνεται
  choice: नहीं होती
  rationale: ἄφεσις के साथ γίνεται का अर्थ किसी बात का घटित या उपलब्ध होना है; ‘क्षमा नहीं होती’ संक्षिप्त और स्वाभाविक है।
- source_word: ἄφεσις
  choice: क्षमा
  rationale: इस संदर्भ में शब्द पापों से मुक्ति अथवा पापों की माफी का बोध देता है; ‘क्षमा’ आधुनिक हिन्दी में स्पष्ट है और संदर्भ से पापों की क्षमा समझी जाती है।
theological_decisions:
- issue: बलिदानी संदर्भ में ἄφεσις का अनुवाद
  choice: क्षमा
  alternative: छुटकारा; पापों की माफी
  rationale: ‘क्षमा’ आधुनिक पाठक के लिए स्पष्ट है और यूनानी शब्द के माफी/मुक्ति संबंधी अर्थ को संप्रदायगत व्याख्या जोड़े बिना व्यक्त करता है। पादटिप्पणी व्यापक शाब्दिक अर्थ को सुरक्षित रखती है।
- issue: σχεδόν द्वारा कथन की योग्यता
  choice: लगभग सब कुछ
  alternative: प्रायः सभी वस्तुएँ
  rationale: ‘लगभग’ को बनाए रखना आवश्यक है, क्योंकि लेखक व्यवस्था के अंतर्गत हर शुद्धिकरण के लिए निरपवाद दावा नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘व्यवस्था’ मूसा की व्यवस्था के लिए, ‘लहू’ बलिदानी संदर्भ की बाइबिलीय गरिमा बनाए रखने के लिए, और ‘शुद्ध किया जाता है’ अनुष्ठानिक शुद्धि का भाव सुरक्षित रखने के लिए चुना गया है।
