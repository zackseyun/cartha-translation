source:
  edition: SBLGNT
  text: εἰ γὰρ τὸ αἷμα ⸂τράγων καὶ ταύρων⸃ καὶ σποδὸς δαμάλεως ῥαντίζουσα τοὺς κεκοινωμένους ἁγιάζει πρὸς τὴν τῆς σαρκὸς καθαρότητα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/013.yaml
  text: For if the blood of goats and bulls[a], and the ashes of a heifer that sprinkle those who have been defiled, sanctify for the purification of the flesh[d][c][b],
translation:
  language: hi
  text: क्योंकि यदि बकरों और बैलों का लहू और बछिया की राख, जो अशुद्ध हो चुके लोगों पर छिड़की जाती है, शरीर की शुद्धता के लिए उन्हें पवित्र करती है,[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, वे लोग जो धार्मिक विधि के अनुसार अशुद्ध हो गए थे।
    reason: lexical_alternative
  - marker: b
    text: यह गिनती 19 में वर्णित बछिया की राख से होने वाली शुद्धिकरण-विधि की ओर संकेत है।
    reason: cross_reference
  - marker: c
    text: यहाँ ‘शरीर की शुद्धता’ का अर्थ पुरानी वाचा की विधियों के अंतर्गत बाहरी, देहगत शुद्धता है।
    reason: cultural_note
lexical_decisions:
- source_word: αἷμα
  choice: लहू
  rationale: बलिदान-संबंधी संदर्भ में यह αἷμα का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: τράγων καὶ ταύρων
  choice: बकरों और बैलों का
  rationale: दोनों संबंधकारक ‘लहू’ पर निर्भर हैं; हिन्दी में यह सहज बलिदानी अभिव्यक्ति है।
- source_word: σποδὸς δαμάλεως
  choice: बछिया की राख
  rationale: यह गिनती 19 की बछिया-वाली शुद्धिकरण विधि की ओर संकेत करता है और मादा युवा गोवंश को स्पष्ट रखता है।
- source_word: ῥαντίζουσα
  choice: छिड़की जाकर
  rationale: यूनानी स्त्रीलिंग एकवचन कृदन्त ‘राख’ को विशेषित करता है। कर्मवाच्य हिन्दी प्रयोग वास्तविक विधि—राख-मिश्रित जल लोगों पर छिड़के जाने—को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यूनानी व्याकरण में राख को छिड़कने वाली के रूप में रखा गया है।
- source_word: τοὺς κεκοινωμένους
  choice: अशुद्ध किए गए लोगों
  rationale: यहाँ κοινόω धार्मिक-अनुष्ठानिक अशुद्धता बताता है; पूर्ण कृदन्त का परिणामगत भाव ‘किए गए’ में बना रहता है।
- source_word: ἁγιάζει
  choice: पवित्र करती है
  rationale: पंथ-संबंधी ἁγιάζω का धार्मिक अर्थ सुरक्षित रहता है; संदर्भ में यह बाहरी अनुष्ठानिक पवित्रीकरण है।
- source_word: πρὸς τὴν τῆς σαρκὸς καθαρότητα
  choice: शरीर की शुद्धता के लिए
  rationale: यहाँ σάρξ बाहरी देहगत/अनुष्ठानिक क्षेत्र को दर्शाता है, पापी स्वभाव को नहीं; ‘शरीर’ आधुनिक हिन्दी में भ्रम घटाता है और पद 14 के विवेक-विरोध को बनाए रखता है।
- source_word: εἰ γὰρ
  choice: क्योंकि यदि
  rationale: यह अगले पद में पूरी होने वाली तर्कात्मक शर्त को यथावत रखता है।
theological_decisions:
- issue: पुरानी वाचा की विधियों के संबंध में ‘पवित्र करती है’ का अर्थ
  choice: अनुष्ठानिक पवित्रीकरण, जो बाहरी शारीरिक शुद्धता तक संबंधित है
  alternative: भीतरी नैतिक या आत्मिक रूपांतरण
  rationale: वाक्य स्वयं प्रभाव को ‘शरीर की शुद्धता’ से जोड़ता है और अगला पद इसे विवेक की शुद्धि से अलग रखता है।
- issue: इस पद में σάρξ का अर्थ
  choice: शरीर—बाहरी, देहगत और अनुष्ठानिक क्षेत्र
  alternative: पापी स्वभाव
  rationale: पुरानी वाचा की शुद्धिकरण विधियों का संदर्भ शाब्दिक/देहगत अर्थ की माँग करता है।
- issue: ῥαντίζουσα की वाक्यगत संबद्धता
  choice: इसे ‘बछिया की राख’ से संबद्ध रखा गया, पर स्वाभाविक हिन्दी में ‘छिड़की जाकर’ कहा गया
  alternative: ‘जो अशुद्ध लोगों पर छिड़कती है’
  rationale: यूनानी में कृदन्त राख को विशेषित करता है। हिन्दी का कर्मवाच्य इस संबंध और विधि के वास्तविक कार्य दोनों को स्पष्ट करता है, बिना बछिया को छिड़कने वाली समझे जाने की संभावना पैदा किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘लहू’, ‘बछिया’, ‘अशुद्ध’ और ‘पवित्र’ से बलिदानी तथा अनुष्ठानिक भाव बना रहता है। वाक्य को अल्पविराम पर समाप्त किया गया है, क्योंकि यूनानी शर्त पद 14 में पूरी होती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
