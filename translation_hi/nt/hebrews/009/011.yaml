id: HEB.9.11
reference: Hebrews 9:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Χριστὸς δὲ παραγενόμενος ἀρχιερεὺς τῶν ⸀γενομένων ἀγαθῶν διὰ τῆς μείζονος καὶ τελειοτέρας σκηνῆς οὐ χειροποιήτου, τοῦτ’ ἔστιν οὐ ταύτης τῆς κτίσεως,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/011.yaml
  text: But the Messiah came as high priest of the good things that have come[a], through the greater and more perfect tabernacle not made by hands—that is[b], not of this creation—
translation:
  language: hi
  text: परन्तु मसीह उन उत्तम वस्तुओं के महायाजक के रूप में आए[b] जो आ चुकी हैं[a]; उस अधिक महान और अधिक पूर्ण तम्बू से होकर, जो हाथों से बनाया हुआ नहीं है—अर्थात् इस सृष्टि का नहीं है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “जो आने वाली हैं।”
    reason: textual_variant
  - marker: b
    text: या, “जब मसीह उन उत्तम वस्तुओं के महायाजक के रूप में प्रकट हुए जो आ चुकी हैं, तब उस अधिक महान और अधिक पूर्ण तम्बू से होकर...” वाक्य पद 12 में पूरा होता है।
    reason: previous_rendering
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: हिन्दी में Χριστός के पदवीगत और मसीहाई अर्थ को स्वाभाविक तथा परिचित रूप से व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले खंड के सांसारिक तम्बू और याजकीय सेवा के साथ विरोध और संक्रमण को स्पष्ट करता है।
- source_word: παραγενόμενος
  choice: आए
  rationale: मसीह के आगमन और महायाजक के रूप में उपस्थित होने को सरल, स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक ‘प्रकट हुए’ को पादटिप्पणी में रखा गया है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: इब्रानियों के याजकीय संदर्भ में इस पद का मानक और सटीक हिन्दी रूप है।
- source_word: τῶν γενομένων ἀγαθῶν
  choice: उन उत्तम वस्तुओं के ... जो आ चुकी हैं
  rationale: SBLGNT के γενομένων का पूर्ण हो चुके आगमन वाला अर्थ बनाए रखता है और उसे भावी वस्तुओं में नहीं बदलता।
- source_word: διὰ τῆς ... σκηνῆς
  choice: उस ... तम्बू से होकर
  rationale: διά के स्थानिक/माध्यमगत संबंध और निर्गमनकालीन पवित्र तम्बू की छवि, दोनों को सुरक्षित रखता है; वाक्य पद 12 में आगे पूरा होता है।
- source_word: μείζονος
  choice: अधिक महान
  rationale: केवल भौतिक आकार नहीं, बल्कि श्रेष्ठता का गुणात्मक भाव व्यक्त करता है।
- source_word: τελειοτέρας
  choice: अधिक सिद्ध
  rationale: इब्रानियों में सिद्धता और पूर्णता की धर्मवैज्ञानिक शब्दावली से संबंध बनाए रखता है।
- source_word: οὐ χειροποιήτου
  choice: जो हाथों से बनाया हुआ नहीं है
  rationale: मानवीय निर्माण और दिव्य/स्वर्गीय पवित्रस्थान के बीच बाइबलीय विरोध को स्पष्ट रखता है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: इसके बाद आने वाली व्याख्यात्मक स्पष्टता को संक्षिप्त और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: οὐ ταύτης τῆς κτίσεως
  choice: जो इस सृष्टि का नहीं है
  rationale: κτίσις को वर्तमान सृजित व्यवस्था के अर्थ में रखता है और अनावश्यक व्याख्यात्मक विस्तार से बचता है।
theological_decisions:
- issue: τῶν γενομένων ἀγαθῶν का पाठालोचनात्मक और कालगत अर्थ
  choice: जो आ चुकी हैं
  alternative: जो आने वाली हैं
  rationale: मुख्य पाठ SBLGNT के γενομένων का अनुसरण करता है, जो इन उत्तम वस्तुओं को आ चुका बताता है। μελλόντων वाला प्रसिद्ध वैकल्पिक पाठ पादटिप्पणी में दिया गया है ताकि पाठभेद और उससे जुड़ा धर्मवैज्ञानिक तनाव पारदर्शी रहे।
- issue: διὰ τῆς ... σκηνῆς का वाक्यगत संबंध
  choice: 'पद 12 में आने वाली मुख्य क्रिया की ओर खुला रखा गया: ‘तम्बू से होकर ...’'
  alternative: इसे मसीह के ‘आने’ का माध्यम समझना
  rationale: यूनानी वाक्य पद 12 तक चलता है और यह पदबंध सम्भवतः εἰσῆλθεν (‘प्रवेश किया’) से जुड़ता है। हिन्दी को भी अधूरा रखकर गलत ढंग से यह नहीं कहा गया कि मसीह तम्बू के माध्यम से प्रकट हुए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘तम्बू’, ‘महायाजक’ और ‘मसीह’ जैसे परिचित बाइबलीय पद रखे गए हैं। मूल यूनानी वाक्य पद 12 में पूरा होता है, इसलिए अंत में दीर्घ विराम-चिह्न द्वारा उसकी खुली संरचना सुरक्षित रखी गई है।
