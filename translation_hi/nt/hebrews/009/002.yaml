  text: σκηνὴ γὰρ κατεσκευάσθη ἡ πρώτη ἐν ᾗ ἥ τε λυχνία καὶ ἡ τράπεζα καὶ ἡ πρόθεσις τῶν ἄρτων, ἥτις λέγεται Ἅγια·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/002.yaml
  text: For a first tabernacle was prepared[a], in which were the lampstand and the table and the bread of the Presence[b], which is called the Holy Place.
translation:
  language: hi
  text: क्योंकि एक पहला कक्ष तैयार किया गया था, जिसमें दीपाधार, मेज़ और सामने रखी हुई रोटियाँ[a] थीं। यह भाग “पवित्र स्थान”[b] कहलाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “रोटियों को सामने रखना/रखना”; इन्हें “उपस्थिति की रोटियाँ” भी कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “पवित्र स्थान” के लिए प्रयुक्त शब्द बहुवचन है; यहाँ उसका आशय तम्बू का पहला कक्ष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σκηνὴ
  choice: तम्बू
  rationale: यह मूसा की व्यवस्था के पवित्र तम्बू और यहाँ उसके पहले भाग को सूचित करता है। ‘तम्बू’ मूल रूपक और पुराने नियम से संबंध बनाए रखता है।
- source_word: κατεσκευάσθη
  choice: तैयार किया गया था
  rationale: यह कर्मवाच्य अर्थ को बनाए रखता है और केवल निर्माण नहीं, पवित्र स्थान को व्यवस्थित तथा सुसज्जित किए जाने के व्यापक भाव को व्यक्त करता है।
- source_word: ἡ πρώτη
  choice: पहला
  rationale: अगले पद में दूसरे, भीतरी भाग के साथ होने वाले विरोध को बनाए रखता है।
- source_word: λυχνία
  choice: दीपाधार
  rationale: यह तेल के दीपकों को रखने वाला पवित्र उपकरण था; ‘मोमबत्तीदान’ ऐतिहासिक रूप से भ्रामक होगा।
- source_word: τράπεζα
  choice: मेज़
  rationale: पवित्र स्थान की मेज़ के लिए सरल और स्वाभाविक हिन्दी शब्द।
- source_word: ἡ πρόθεσις τῶν ἄρτων
  choice: सामने रखी हुई रोटियाँ
  rationale: πρόθεσις के ‘सामने रखने/प्रस्तुत करने’ के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और किसी पारंपरिक नाम को बिना समझाए आरोपित नहीं करता।
- source_word: Ἅγια
  choice: पवित्र स्थान
  rationale: यूनानी रूप व्याकरणतः बहुवचन है, पर प्रसंग में यह तम्बू के पहले कक्ष का नाम है; हिन्दी का प्रचलित एकवचन पद स्थानिक विरोध को स्पष्ट रखता है।
theological_decisions:
- issue: Ἅγια का व्याकरणिक बहुवचन और तम्बू के पहले कक्ष से उसका संबंध
  choice: “पवित्र स्थान” मुख्य पाठ में, और बहुवचन रूप की सूचना पादटिप्पणी में
  alternative: “पवित्र स्थानों” या “पवित्र भाग”
  rationale: अगला पद भीतरी कक्ष से स्पष्ट भेद करता है। एकवचन ‘पवित्र स्थान’ पाठक को आशय समझाता है, जबकि पादटिप्पणी मूल रूप की वास्तविक अस्पष्टता को सुरक्षित रखती है।
- issue: ἥτις का संदर्भ
  choice: “यह भाग”
  alternative: “जो” अथवा “वह तम्बू”
  rationale: यूनानी संबंधवाचक सर्वनाम निकटतम स्त्रीलिंग संज्ञा σκηνή की ओर लौटता है। हिन्दी में ‘यह भाग’ स्पष्ट करता है कि नाम पहले कक्ष का है, पूरे पवित्र तम्बू का नहीं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘दीपाधार’ और ‘पवित्र स्थान’ जैसे स्थापित उपासना-संबंधी पद रखे गए हैं; वाक्य को स्वाभाविक बनाने और संबंधवाचक सर्वनाम का आशय स्पष्ट करने के लिए ‘यह भाग’ प्रयुक्त है।
