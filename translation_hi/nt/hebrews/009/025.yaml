  text: οὐδ’ ἵνα πολλάκις προσφέρῃ ἑαυτόν, ὥσπερ ὁ ἀρχιερεὺς εἰσέρχεται εἰς τὰ ἅγια κατ’ ἐνιαυτὸν ἐν αἵματι ἀλλοτρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/025.yaml
  text: Nor was it so that he might offer himself many times[a], just as the high priest enters the holy places year by year with blood not his own,
translation:
  language: hi
  text: और न ही इसलिए कि वह अपने आप को बार-बार अर्पित करे, जैसे महायाजक प्रति वर्ष पवित्र स्थानों[a] में दूसरे के लहू के साथ प्रवेश करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र स्थान।” यूनानी में “पवित्र स्थानों” बहुवचन है; इस उपासना-संबंधी प्रसंग में कुछ लोग इसे विशेष रूप से “परमपवित्र स्थान” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδ’ ἵνα
  choice: और न ही इसलिए कि
  rationale: यह पद पिछले वाक्य के निषेधात्मक विचार को आगे बढ़ाता है और उस उद्देश्य को नकारता है कि मसीह बार-बार अपना बलिदान चढ़ाए।
- source_word: πολλάκις
  choice: बार-बार
  rationale: यह कई अवसरों पर दोहराए जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और महायाजक के वार्षिक प्रवेश से होने वाली तुलना बनाए रखता है।
- source_word: προσφέρῃ ἑαυτόν
  choice: वह अपने आप को ... चढ़ाए
  rationale: ‘चढ़ाए’ बलिदान-संबंधी अर्थ को और ‘अपने आप को’ आत्मार्पण के स्पष्ट भाव को सुरक्षित रखता है।
- source_word: ὥσπερ
  choice: जैसे
  rationale: यह मसीह और महायाजक के कार्यों के बीच तुलना को स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: ὁ ἀρχιερεὺς
  choice: महायाजक
  rationale: यह यहूदी उपासना-व्यवस्था के इस पद का मानक और सटीक हिन्दी रूप है।
- source_word: εἰσέρχεται
  choice: प्रवेश करता है
  rationale: वर्तमान काल महायाजक के प्रथागत, नियमित कार्य को दर्शाता है।
- source_word: εἰς τὰ ἅγια
  choice: पवित्र स्थानों में
  rationale: यूनानी बहुवचन को बनाए रखा गया है, जिससे सामान्यतः पवित्रस्थान और इस प्रसंग में अधिक विशिष्ट भीतरी पवित्र स्थान—दोनों की सम्भावना खुली रहती है।
- source_word: κατ’ ἐνιαυτὸν
  choice: प्रति वर्ष
  rationale: यह वार्षिक रूप से दोहराए जाने वाले प्रवेश को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν αἵματι ἀλλοτρίῳ
  choice: ऐसा लहू लेकर ... जो उसका अपना नहीं होता
  rationale: यह साधन के भाव और ἀλλότριος के ‘दूसरे का/अपना नहीं’ अर्थ, दोनों को स्पष्ट करता है तथा मसीह के आत्मार्पण के साथ निहित विरोध को बनाए रखता है।
theological_decisions:
- issue: मसीह और लेवीय महायाजक के बीच तुलना का आशय
  choice: मसीह द्वारा अपने आप को बार-बार चढ़ाने के निषेध की तुलना महायाजक के प्रति वर्ष किसी अन्य का लहू लेकर प्रवेश करने से की गई है।
  alternative: ‘पवित्र स्थानों’ को अधिक संकीर्ण अर्थ में केवल ‘परमपवित्र स्थान’ समझा जा सकता है।
  rationale: निकटवर्ती प्रसंग मसीह के आत्मार्पण की पुनरावृत्ति न होने और पुरानी वाचा के महायाजक की वार्षिक सेवा के बीच विरोध रखता है। अनुवाद इस विरोध को सुरक्षित रखते हुए ‘पवित्र स्थानों’ का अर्थ अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’ बाइबलीय बलिदान-संदर्भ में प्रचलित है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरम्भ में ‘और न ही’ रखा गया है। स्रोत-संबंधी पादटिप्पणी का चिह्न अर्थानुसार ‘पवित्र स्थानों’ के बाद रखा गया है।
