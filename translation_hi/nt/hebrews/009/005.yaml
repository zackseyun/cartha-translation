  text: ὑπεράνω δὲ αὐτῆς Χερουβὶν δόξης κατασκιάζοντα τὸ ἱλαστήριον· περὶ ὧν οὐκ ἔστιν νῦν λέγειν κατὰ μέρος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/005.yaml
  text: And above it were the cherubim of glory overshadowing the atoning sacrifice[a]; about these things it is not now possible to speak in detail.
translation:
  language: hi
  text: और उसके ऊपर महिमा के करूब थे, जो प्रायश्चित्त के ढकने[a] पर छाया किए हुए थे। इन बातों के विषय में अभी विस्तार से कहना संभव नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “दया-आसन” या “प्रायश्चित्त-स्थान” भी कहा जाता है; यह वाचा के संदूक का ऊपरी ढकना था।
    reason: ἱλαστήριον के पारंपरिक और धार्मिक अर्थों को स्पष्ट करते हुए इस प्रसंग में उसके ठोस संकेतक की पहचान बताना।
lexical_decisions:
- source_word: ὑπεράνω δὲ αὐτῆς
  choice: और उसके ऊपर
  rationale: यह वाक्यांश पिछली आयत में वर्णित वाचा के संदूक की ओर संकेत करता है और उसके ऊपर की स्थानिक स्थिति बताता है।
- source_word: Χερουβὶν δόξης
  choice: महिमा के करूब
  rationale: यह यूनानी संबंधकारक की संक्षिप्त और कुछ हद तक खुली अभिव्यक्ति को बनाए रखता है; इसे केवल ‘महिमामय करूब’ कहकर अर्थ को सीमित नहीं किया गया।
- source_word: κατασκιάζοντα
  choice: छाया किए हुए थे
  rationale: यह करूबों के पंखों द्वारा नीचे स्थित ढकने को आच्छादित करने की स्थायी मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ ἱλαστήριον
  choice: प्रायश्चित्त का ढकना
  rationale: इस पवित्र-स्थान संबंधी प्रसंग में यह शब्द वाचा के संदूक के ठोस ऊपरी ढकने को दर्शाता है, जिसका प्रायश्चित्त-विधि से विशेष संबंध था। यह अनुवाद वस्तु और उसके धार्मिक कार्य, दोनों को व्यक्त करता है।
- source_word: περὶ ὧν
  choice: इन बातों के विषय में
  rationale: यह निकटवर्ती पवित्र-स्थान की वस्तुओं के सामूहिक उल्लेख को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἔστιν νῦν λέγειν κατὰ μέρος
  choice: अभी विस्तार से कहना संभव नहीं है
  rationale: यह लेखक की वर्तमान प्रसंग में एक-एक बात का विस्तृत वर्णन न कर पाने या न करने की बात को बिना अनावश्यक रूप से कारण तय किए व्यक्त करता है।
theological_decisions:
- issue: पवित्र-स्थान के प्रसंग में ἱλαστήριον का अर्थ
  choice: प्रायश्चित्त का ढकना
  alternative: दया-आसन; प्रायश्चित्त-स्थान
  rationale: यहाँ शब्द किसी अमूर्त प्रायश्चित्तकारी बलिदान के बजाय संदूक के ढकने का ठोस संकेतक है। फिर भी उससे जुड़ी दया और प्रायश्चित्त की धार्मिक अवधारणाओं को पादटिप्पणी में वैकल्पिक पारंपरिक पदों द्वारा सुरक्षित रखा गया है।
- issue: δόξης में संबंधकारक की व्याख्या
  choice: महिमा के करूब
  alternative: महिमामय करूब
  rationale: मूल वाक्यांश यह खुला छोड़ता है कि महिमा करूबों का गुण है, उनके साथ संबद्ध दिव्य महिमा है, या उनकी भूमिका का वर्णन है; मुख्य पाठ इस तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘करूब’ और ‘प्रायश्चित्त’ जैसे स्थापित बाइबलीय पद बनाए गए हैं, जबकि वाक्य-विन्यास को सहज हिन्दी के अनुरूप रखा गया है।
