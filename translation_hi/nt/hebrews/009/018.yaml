  terminology: ‘वाचा’ अंग्रेज़ी audit trail के ‘covenant’ तथा निकटवर्ती संदर्भ के अनुकूल है। पादटिप्पणी ठीक बताती है कि यूनानी में संज्ञा स्पष्ट रूप से दोहराई नहीं गई है और ‘वसीयतनामा’ निकटवर्ती अर्थ-तनाव के कारण एक वैकल्पिक औपचारिक प्रस्तुति है; यह विकल्प को मुख्य पाठ पर नहीं थोपती।
