  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅθεν οὐδὲ ἡ πρώτη χωρὶς αἵματος ἐγκεκαίνισται·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/009/018.yaml
  text: Therefore not even the first covenant was inaugurated without blood[a].
translation:
  language: hi
  text: इसलिए पहली वाचा भी बिना लहू के आरम्भ नहीं की गई थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पहली’; अर्थात पहली वाचा। इसे ‘पहला वसीयतनामा’ भी समझा गया है।
    reason: मूल यूनानी में ‘वाचा’ संज्ञा व्यक्त नहीं है और διαθήκη के निकटवर्ती अर्थ-तनाव के कारण ‘वसीयतनामा’ एक सम्भव वैकल्पिक प्रस्तुति है।
lexical_decisions:
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले तर्क से निष्कर्ष निकालने वाला संयोजक है; ‘इसलिए’ आधुनिक हिन्दी में इसके तार्किक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐδὲ
  choice: भी ... नहीं
  rationale: इस रचना में इसका बल ‘पहली वाचा तक भी नहीं’ है; हिन्दी में ‘भी ... नहीं’ वही समावेशी और जोरदार निषेध व्यक्त करता है।
- source_word: ἡ πρώτη
  choice: पहली वाचा
  rationale: यूनानी में केवल स्त्रीलिंग विशेषण ‘पहली’ आया है, पर सन्दर्भ में निहित संज्ञा ‘वाचा’ है। स्पष्ट हिन्दी के लिए इसे व्यक्त करना उचित है।
- source_word: χωρὶς αἵματος
  choice: बिना लहू के
  rationale: यह रक्त की अनुपस्थिति बताने वाला सीधा वाक्यांश है। ‘लहू’ बाइबलीय-सांस्कारिक सन्दर्भ में गरिमापूर्ण और सामान्यतः समझ में आने वाला शब्द है।
- source_word: ἐγκεκαίνισται
  choice: आरम्भ नहीं की गई थी
  rationale: पूर्ण निष्क्रिय क्रिया वाचा के विधिवत आरम्भ/उद्घाटन को दर्शाती है। ‘आरम्भ की गई थी’ स्वाभाविक हिन्दी में उस सम्पन्न ऐतिहासिक क्रिया को व्यक्त करता है, बिना अर्थ को केवल कानूनी पुष्टि तक सीमित किए।
theological_decisions:
- issue: ‘पहली’ का अभिप्राय
  choice: पहली वाचा
  alternative: केवल ‘पहली’; अथवा ‘पहला विधान/वसीयतनामा’
  rationale: इब्रानियों 9 के निकटवर्ती सन्दर्भ और निर्गमन 24 की ओर संकेत से ‘पहली वाचा’ सबसे सम्भावित अभिप्राय है। फिर भी यूनानी में संज्ञा निहित है, इसलिए पादटिप्पणी मूल की संक्षिप्तता और वैकल्पिक औपचारिक प्रस्तुति को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘वाचा’ सन्दर्भगत धार्मिक शब्दावली को बनाए रखता है, जबकि ‘आरम्भ की गई थी’ अत्यधिक तकनीकी भाषा से बचता है।
