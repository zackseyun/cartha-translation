  text: μετατιθεμένης γὰρ τῆς ἱερωσύνης ἐξ ἀνάγκης καὶ νόμου μετάθεσις γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/012.yaml
  text: For when the priesthood is changed[a], of necessity there is also a change of law.
translation:
  language: hi
  text: क्योंकि जब पुरोहिताई में परिवर्तन होता है, तो व्यवस्था का भी परिवर्तन अनिवार्य रूप से होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा की व्यवस्था का भी परिवर्तन होता है।” संदर्भ में यह उस व्यवस्था की ओर संकेत करता है जिसने लेवीय पुरोहिताई स्थापित की थी।
    reason: वैकल्पिक अनुवाद νόμου को संदर्भानुसार अधिक स्पष्ट रूप से मूसा की व्यवस्था से जोड़ता है।
lexical_decisions:
- source_word: μετατιθεμένης
  choice: बदलती है
  rationale: यह संबंधवाचक कृदन्त पुरोहिताई के एक क्रम से दूसरे क्रम में बदलने को व्यक्त करता है। वर्तमानकालीन सामान्य कथन हिन्दी में तर्क का कारण-परिणाम संबंध स्वाभाविक रूप से रखता है।
- source_word: ἱερωσύνης
  choice: पुरोहिताई
  rationale: यह किसी एक पुरोहित के काम की नहीं, बल्कि पुरोहित-पद और उसकी संस्थागत व्यवस्था की ओर संकेत करता है।
- source_word: ἐξ ἀνάγκης
  choice: अनिवार्य रूप से
  rationale: 'यह तार्किक आवश्यकता बताता है: पुरोहिताई के बदलने पर उससे संबंधित व्यवस्था का बदलना भी आवश्यक है।'
- source_word: νόμου
  choice: व्यवस्था में
  rationale: यहाँ νόμος उस विधिक व्यवस्था को सूचित करता है जो पुरोहिताई को निर्धारित करती है। 'व्यवस्था में बदलाव' स्वाभाविक हिन्दी है और तत्काल संदर्भ में मूसा की व्यवस्था को समाहित करते हुए यूनानी की अनिर्दिष्टता बनाए रखता है।
- source_word: μετάθεσις
  choice: बदलाव
  rationale: यह μετατιθεμένης का सजातीय संज्ञा-रूप है और पुरोहिताई के परिवर्तन के अनुरूप विधिक परिवर्तन व्यक्त करता है।
- source_word: γίνεται
  choice: होता है
  rationale: यह आवश्यक परिणाम के घटित होने को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यह व्यवस्था के बदलाव को पुरोहिताई के बदलाव के साथ आवश्यक अतिरिक्त परिणाम के रूप में जोड़ता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है और हिन्दी में वाक्य-संबंध स्पष्ट रखता है।
theological_decisions:
- issue: νόμος का दायरा और पुरोहिताई से उसका संबंध
  choice: मुख्य पाठ में 'व्यवस्था में' रखा गया है, जिससे पुरोहिताई को नियंत्रित करने वाली विधिक व्यवस्था का तत्काल अर्थ सामने आता है और संदर्भ में मूसा की व्यवस्था भी स्वाभाविक रूप से शामिल रहती है।
  alternative: '''व्यवस्था का भी बदलाव होता है,'' जिसे सीधे मूसा की व्यवस्था के परिवर्तन के रूप में पढ़ा जा सकता है।'
  rationale: यूनानी में νόμου के साथ निश्चित उपपद नहीं है, इसलिए अनुवाद को आवश्यकता से अधिक संकीर्ण नहीं किया गया। फिर भी इब्रानियों 7 का संदर्भ स्पष्टतः लेवीय पुरोहिताई स्थापित करने वाली मूसा की व्यवस्था से जुड़ा है; इस विशेष अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। 'पुरोहिताई' संस्थागत पद को तथा 'व्यवस्था' νόμος के विधिक और मूसा-संबंधी संदर्भ को व्यक्त करती है।
