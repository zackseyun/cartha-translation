  alternative: मुख्य पाठ में ‘लेवीय याजक’ या ‘अपने पद पर बने रहना’ स्पष्ट रूप से जोड़ा जा सकता था।
  rationale: इस पद के यूनानी पाठ में ‘लेवीय’ और ‘पद’ प्रत्यक्ष रूप से नहीं हैं। संक्षिप्त मूल अभिव्यक्ति अगले पद के स्थायी याजकत्व के साथ विरोध की भूमिका तैयार करती है।
