- source_word: παραμένειν
  choice: बने रहने
  rationale: मूल शब्द का सामान्य अर्थ सुरक्षित रखा गया है; सन्दर्भ में इसका आशय याजकीय सेवा में बने रहना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
