base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/017.yaml
  text: 'For it is testified: “You are a priest forever according to the order of Melchizedek.”[a][b]'
translation:
  language: hi
  text: 'क्योंकि गवाही दी जाती है: “तुम मेल्कीसेदेक के क्रम के अनुसार सदा के लिए याजक हो।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक परंपरागत रूप में, “मेल्कीसेदेक की रीति के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: यह भजन 110:4 से उद्धृत है।
    reason: cross_reference
lexical_decisions:
- source_word: μαρτυρεῖται
  choice: यह गवाही दी गई है
  rationale: वर्तमानकालीन कर्मवाच्य/भाववाच्य रूप को बनाए रखते हुए यह वाक्यांश पवित्रशास्त्र की गवाही का परिचय देता है और गवाही देने वाले को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन या कारण को प्रस्तुत करने वाला संयोजक है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: ὅτι
  choice: ':'
  rationale: यह गवाही की विषयवस्तु के रूप में सीधे उद्धरण का परिचय देता है; हिन्दी में द्विबिंदु स्वाभाविक है।
- source_word: Σὺ
  choice: तुम
  rationale: द्वितीय पुरुष एकवचन के सीधे और बलयुक्त संबोधन को व्यक्त करता है।
- source_word: ἱερεὺς
  choice: याजक
  rationale: मूल पाठ केवल ‘याजक’ कहता है, ‘महायाजक’ नहीं; इसलिए स्रोत की सीमा और धार्मिक तनाव सुरक्षित रहता है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: यह निरंतर और चिरस्थायी अवधि व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी मुहावरा है।
- source_word: κατὰ τὴν τάξιν
  choice: की रीति के अनुसार
  rationale: यह मेल्कीसेदेक से जुड़े ढंग, प्रतिमान या क्रम के अनुरूपता-संबंध को व्यक्त करता है। ‘रीति’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘क्रम’ भी एक संभव अधिक शाब्दिक विकल्प है।
- source_word: Μελχισέδεκ
  choice: मेल्कीसेदेक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: भजन के उद्धरण में याजकीय पदनाम
  choice: ‘याजक’ को बिना विस्तार के रखा गया
  alternative: ‘महायाजक’ कहना
  rationale: यूनानी पाठ में इस पद में ἱερεύς अर्थात ‘याजक’ है। इब्रानियों में मसीह को महायाजक कहा गया है, पर यहाँ वह शब्द जोड़ना स्रोत से आगे जाकर व्याख्या को अनुवाद में मिला देना होगा।
- issue: κατὰ τὴν τάξιν का संबंध
  choice: ‘मेल्कीसेदेक की रीति के अनुसार’
  alternative: ‘मेल्कीसेदेक के क्रम के अनुसार’
  rationale: मूल वाक्यांश अनुरूपता, ढंग या व्यवस्थित श्रेणी का भाव दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी चुनी गई है और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है, ताकि वास्तविक अर्थ-व्याप्ति बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। उद्धरण की औपचारिकता बनाए रखते हुए अप्रचलित वाक्य-विन्यास से बचा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
