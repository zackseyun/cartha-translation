base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/019.yaml
  text: For the law perfected nothing[a], but there is the introduction of a better hope[b], through which we draw near to God.
translation:
  language: hi
  text: क्योंकि व्यवस्था ने किसी भी चीज़ को पूर्णता तक नहीं पहुँचाया[a]; पर एक उत्तम आशा लाई गई[b], जिसके द्वारा हम परमेश्वर के निकट आते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी भी चीज़ को पूर्ण नहीं किया।” यूनानी क्रिया का अर्थ किसी को उसके लक्ष्य अथवा पूर्णता तक पहुँचाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक उत्तम आशा का लाया जाना” या “एक उत्तम आशा का प्रवेश कराया जाना।” यूनानी में यहाँ कोई स्पष्ट क्रिया नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐδὲν
  choice: किसी भी बात को नहीं
  rationale: यह नपुंसकलिंग कर्म पूर्ण निषेध व्यक्त करता है। ‘किसी भी बात को नहीं’ स्वाभाविक हिन्दी में ‘कुछ भी नहीं’ का भाव रखता है और इसे केवल व्यक्तियों तक सीमित नहीं करता।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या आधार बताता है; ‘क्योंकि’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐτελείωσεν
  choice: सिद्ध किया
  rationale: इब्रानियों में यह क्रिया किसी वस्तु या व्यक्ति को उसके निर्धारित लक्ष्य अथवा पूर्णता तक पहुँचाने का गहरा धार्मिक भाव रखती है। ‘सिद्ध किया’ उस प्रमुख शब्द-संबंध को बनाए रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: ὁ νόμος
  choice: व्यवस्था
  rationale: संदर्भ में यह मूसा की व्यवस्था और उससे जुड़ी याजकीय प्रणाली को दर्शाता है। हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ स्पष्ट, प्रतिष्ठित और सामान्यतः बोधगम्य है।
- source_word: δὲ
  choice: बल्कि
  rationale: यह व्यवस्था के निषेधात्मक कथन और उत्तम आशा के प्रवेश के बीच प्रबल विरोध दिखाता है।
- source_word: ἐπεισαγωγὴ
  choice: प्रवेश
  rationale: दुर्लभ यूनानी संज्ञा किसी नई या अतिरिक्त वस्तु के लाए जाने अथवा प्रवेश कराने को व्यक्त करती है। ‘प्रवेश’ इसकी संज्ञात्मक बनावट को बनाए रखता है।
- source_word: κρείττονος ἐλπίδος
  choice: एक उत्तम आशा
  rationale: κρείττων इब्रानियों का प्रमुख तुलनात्मक शब्द है। ‘उत्तम’ उसकी श्रेष्ठता व्यक्त करता है और अनिश्चित संज्ञा-रचना के लिए ‘एक’ स्वाभाविक है।
- source_word: δι’ ἧς
  choice: जिसके द्वारा
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम का सबसे स्वाभाविक पूर्वपद ‘आशा’ है; यह वाक्यांश साधन का भाव व्यक्त करता है।
- source_word: ἐγγίζομεν
  choice: हम ... निकट आते हैं
  rationale: यह परमेश्वर तक उपासना-संबंधी पहुँच का भाव बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के
  rationale: ‘निकट आना’ के साथ ‘परमेश्वर के निकट’ मानक और स्वाभाविक हिन्दी रचना है।
theological_decisions:
- issue: व्यवस्था के संबंध में τελειόω का अर्थ
  choice: व्यवस्था ने किसी भी बात को सिद्ध नहीं किया
  alternative: व्यवस्था ने किसी भी चीज़ को पूर्णता तक नहीं पहुँचाया
  rationale: यह अनुवाद व्यवस्था को हर दृष्टि से निष्फल घोषित नहीं करता, बल्कि इब्रानियों में ‘सिद्ध करने’ के लक्ष्य, पूर्णता और परमेश्वर तक पहुँच से जुड़े तनाव को बनाए रखता है।
- issue: दूसरे खंड की क्रियारहित यूनानी रचना
  choice: ‘एक उत्तम आशा का प्रवेश हुआ’ में अर्थ की दृष्टि से ‘हुआ’ जोड़ा गया
  alternative: पर एक उत्तम आशा का प्रवेश
  rationale: यूनानी में दूसरा खंड संज्ञात्मक और दीर्घवृत्तीय है। हिन्दी में पूर्ण तथा सुबोध वाक्य के लिए न्यूनतम क्रिया जोड़ी गई है, बिना यह निर्धारित किए कि आशा किस मानवीय कर्ता ने प्रस्तुत की।
- issue: δι’ ἧς का पूर्वपद
  choice: ‘जिसके द्वारा’ को ‘उत्तम आशा’ से जोड़ा गया
  alternative: इसे आशा के प्रवेश की पूरी घटना से जोड़ना
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम व्याकरणतः ‘आशा’ से सबसे स्वाभाविक रूप से मेल खाता है, फिर भी अनुवाद व्यापक घटना-संबंधी अर्थ को पूरी तरह बंद नहीं करता।
