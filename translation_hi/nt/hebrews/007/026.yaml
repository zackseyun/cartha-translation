id: HEB.7.26
reference: Hebrews 7:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τοιοῦτος γὰρ ἡμῖν ⸀καὶ ἔπρεπεν ἀρχιερεύς, ὅσιος, ἄκακος, ἀμίαντος, κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν, καὶ ὑψηλότερος τῶν οὐρανῶν γενόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/026.yaml
  text: 'For such a high priest was indeed fitting for us: holy[a], innocent, undefiled, separated from sinners[b], and having become higher than the heavens.'
translation:
  language: hi
  text: क्योंकि हमारे लिए ऐसा ही महायाजक वास्तव में उचित था—पवित्र, निर्दोष, निष्कलंक, पापियों से अलग[a] और स्वर्गों से भी ऊँचा हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापियों से पृथक किया हुआ।” यह वाक्यांश उसकी नैतिक शुद्धता और महिमामय महायाजकीय स्थिति, दोनों की ओर संकेत कर सकता है।
    reason: मूल पूर्ण कृदंत अलगाव की स्थापित अवस्था बताता है; हिंदी में अवस्थासूचक और कर्मवाचक, दोनों अभिव्यक्तियाँ संभव हैं।
  - marker: b
    text: या, “स्वर्गों के ऊपर प्रतिष्ठित हो गया।”
    reason: यह अधिक व्याख्यात्मक विकल्प उसके महिमामय पद को सामने लाता है, जबकि मुख्य पाठ मूल की सीधी तुलना को बनाए रखता है।
lexical_decisions:
- source_word: Τοιοῦτος
  choice: ऐसा ही
  rationale: यह पहले वर्णित महायाजक की ओर संकेत करता है; ‘ऐसा ही’ उस पूर्वसंदर्भ और बल दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क के साथ व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: ἡμῖν καὶ ἔπρεπεν
  choice: हमारे लिए ... वास्तव में उचित था
  rationale: ἡμῖν उपयुक्तता का संबंध विश्वासियों से जोड़ता है और καί यहाँ बलसूचक समझा गया है; ‘वास्तव में’ उस बल को सहज हिंदी में व्यक्त करता है।
- source_word: ἀρχιερεύς
  choice: महायाजक
  rationale: इब्रानियों में इस याजकीय पद के लिए प्रचलित और सटीक हिंदी शब्द।
- source_word: ὅσιος
  choice: पवित्र
  rationale: यह नैतिक और याजकीय पवित्रता को संक्षेप में और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἄκακος
  choice: निर्दोष
  rationale: यह बुराई और दुष्ट अभिप्राय से रहित होने का भाव देता है; ‘हानिरहित’ यहाँ अपेक्षाकृत कमजोर होता।
- source_word: ἀμίαντος
  choice: निष्कलंक
  rationale: यह अशुद्धि या दूषण से रहित होने के अर्थ को बनाए रखता है और याजकीय शुद्धता की प्रतिध्वनि भी देता है।
- source_word: κεχωρισμένος ἀπὸ τῶν ἁμαρτωλῶν
  choice: पापियों से अलग
  rationale: पूर्ण कृदंत से व्यक्त स्थायी अलगाव की अवस्था को स्वाभाविक हिंदी में रखा गया है, बिना यह तय किए कि अलगाव केवल नैतिक है या स्थान-संबंधी।
- source_word: ὑψηλότερος τῶν οὐρανῶν
  choice: स्वर्गों से भी ऊँचा
  rationale: तुलनात्मक रूप और बहुवचन ‘स्वर्गों’ को सीधे बनाए रखता है; ‘भी’ हिंदी में तुलना का बल स्पष्ट करता है।
- source_word: γενόμενος
  choice: हो गया
  rationale: यह परिणामी ऊँची स्थिति में आने के भाव को रखता है, पर कर्ता या प्रक्रिया को पाठ से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: ‘पापियों से अलग’ में यीशु और पापियों का संबंध
  choice: वाक्यांश को सीधे ‘पापियों से अलग’ रखा गया है।
  alternative: इसे केवल नैतिक पृथकता, केवल स्वर्गारोहण के बाद का स्थान-संबंधी अलगाव, या पृथ्वी पर पापियों से संगति न रखने के अर्थ में स्पष्ट करना।
  rationale: आसपास के विशेषण उसकी याजकीय उपयुक्तता और शुद्धता पर बल देते हैं, पर वाक्यांश में नैतिक तथा महिमामय स्थिति दोनों की प्रतिध्वनि संभव है। अनुवाद इस तनाव को खुला रखता है और पृथ्वी पर पापियों से उसके मेल-जोल का निषेध नहीं करता।
- issue: γενόμενος और स्वर्गों से ऊँचा होने का भाव
  choice: ‘स्वर्गों से भी ऊँचा हो गया’
  alternative: ‘स्वर्गों से भी ऊँचा है’ या ‘स्वर्गों के ऊपर ऊँचा उठाया गया’
  rationale: ‘हो गया’ मूल के ऐतिहासिक और परिणामी भाव को बनाए रखता है, जबकि ‘उठाया गया’ जैसी स्पष्ट कर्मवाच्यता नहीं जोड़ता। यह उसके महिमामय याजकीय पद की बात करता है; उसके दिव्य स्वभाव में परिवर्तन का दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण पर सहज रूप अपनाया गया है। ‘महायाजक’, ‘निष्कलंक’ और ‘स्वर्गों’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं, पर वाक्य-विन्यास को सामान्य पाठक के लिए सरल बनाया गया है। दिए गए अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों की स्थिति उनकी सामग्री से मेल नहीं खाती थी; हिंदी पाठ में [a] को ‘पापियों से अलग’ और [b] को ‘स्वर्गों से भी ऊँचा हो गया’ के बाद अर्थानुसार रखा गया है।
