id: HEB.7.11
reference: Hebrews 7:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἰ μὲν οὖν τελείωσις διὰ τῆς Λευιτικῆς ἱερωσύνης ἦν, ὁ λαὸς γὰρ ἐπ’ ⸀αὐτῆς ⸀νενομοθέτηται, τίς ἔτι χρεία κατὰ τὴν τάξιν Μελχισέδεκ ἕτερον ἀνίστασθαι ἱερέα καὶ οὐ κατὰ τὴν τάξιν Ἀαρὼν λέγεσθαι;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/011.yaml
  text: If perfection had been through the Levitical priesthood—for on its basis the people had received the law—what further need was there for another priest to arise according to the order of Melchizedek and not be spoken of according to the order of Aaron?[a][b]
translation:
  language: hi
  text: अतः यदि लेवीय याजकपद के द्वारा सिद्धता होती—क्योंकि उसके आधार पर लोगों को व्यवस्था दी गई थी[a]—तो मलिकिसिदक की रीति के अनुसार एक और याजक के उठने और हारून की रीति के अनुसार न कहलाने की फिर क्या आवश्यकता थी?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसी के अधीन लोगों को व्यवस्था दी गई थी।” यूनानी वाक्यांश को अधिक औपचारिक ढंग से ऐसा कहा जा सकता है; आशय यह है कि इस्राएल की व्यवस्था लेवीय याजकपद से संबंधित प्रबंध पर आधारित थी।
    reason: lexical_alternative
  - marker: b
    text: या, “मलिकिसिदक की रीति में एक और याजक के उठने और हारून की रीति में न कहलाने की।”
    reason: alternative_reading
lexical_decisions:
- source_word: τελείωσις
  choice: सिद्धता
  rationale: यह शब्द इब्रानियों में केवल नैतिक पूर्णता नहीं, बल्कि परमेश्वर के सामने उद्देश्यपूर्ण पूर्ण अवस्था और पहुँच की याजकीय-उद्धारपरक धारणा रखता है। ‘सिद्धता’ उस अर्थभार को व्याख्यात्मक विस्तार के बिना बनाए रखता है।
- source_word: διὰ τῆς Λευιτικῆς ἱερωσύνης
  choice: लेवीय याजकपद के द्वारा
  rationale: संबंधकारक के साथ διά साधन को दर्शाता है; यह अनुवाद याजकपद को सिद्धता का परिकल्पित माध्यम बनाए रखता है।
- source_word: ἐπ’ αὐτῆς
  choice: उसी के आधार पर
  rationale: स्त्रीलिंग सर्वनाम का सबसे स्वाभाविक पूर्वपद ‘लेवीय याजकपद’ है। ‘के आधार पर’ व्यवस्था और याजकपद के बीच संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νενομοθέτηται
  choice: लोगों को व्यवस्था दी गई थी
  rationale: पूर्णकालिक निष्क्रिय क्रिया लोगों को व्यवस्था दिए जाने और उसके फलस्वरूप उस व्यवस्था के अधीन स्थापित किए जाने की अवस्था बताती है।
- source_word: τίς ἔτι χρεία
  choice: तो फिर क्या आवश्यकता थी
  rationale: यह आगे बनी रहने वाली आवश्यकता के विषय में आलंकारिक प्रश्न है; ‘तो फिर’ οὖν और ἔτι के निष्कर्षात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κατὰ τὴν τάξιν Μελχισέδεκ
  choice: मलिकिसिदक की रीति के अनुसार
  rationale: τάξις यहाँ क्रम मात्र नहीं, प्रकार, प्रतिरूप या नियुक्त श्रेणी का अर्थ रखता है। ‘रीति के अनुसार’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और अर्थगत रूप से पर्याप्त व्यापक है।
- source_word: ἕτερον ... ἱερέα
  choice: एक और याजक
  rationale: ἕτερον दूसरे अथवा भिन्न याजक को सूचित करता है; आगे हारून से किया गया विरोध उसके भिन्न प्रकार को स्पष्ट करता है।
- source_word: ἀνίστασθαι
  choice: उठे
  rationale: यहाँ क्रिया किसी याजक के प्रकट होने या नियुक्त होकर आने को दर्शाती है। ‘उठे’ संक्षिप्त है और अनावश्यक रूप से पुनरुत्थान का अर्थ निर्धारित नहीं करता।
- source_word: καὶ οὐ ... λέγεσθαι
  choice: और उसके विषय में ... न कहा जाए
  rationale: λέγεσθαι बताता है कि उस याजक का वर्णन या वर्गीकरण कैसे किया जाता है। यह रूप यूनानी निष्क्रिय वाक्य-विन्यास और अर्थ की व्यापकता को बनाए रखता है।
- source_word: Μελχισέδεκ / Ἀαρών
  choice: मलिकिसिदक / हारून
  rationale: नामों के प्रचलित मानक हिन्दी बाइबलीय लिप्यंतरण अपनाए गए हैं।
theological_decisions:
- issue: इब्रानियों के याजकीय तर्क में τελείωσις का अर्थ
  choice: ‘सिद्धता’ रखा गया है, ताकि इसका याजकीय और उद्धारपरक अर्थ खुला रहे।
  alternative: पूर्णता; परमेश्वर तक पूर्ण पहुँच
  rationale: पद का तर्क है कि यदि लेवीय याजकपद अभिप्रेत अंतिम अवस्था ला सकता, तो दूसरे याजक की आवश्यकता न होती। अनुवाद व्यापक धर्मवैज्ञानिक तनाव को प्रसंग द्वारा परिभाषित होने देता है।
- issue: ἐπ’ αὐτῆς में αὐτῆς का पूर्वपद
  choice: इसे लेवीय याजकपद की ओर संकेत माना गया है।
  alternative: व्यवस्था; व्यापक वाचागत प्रबंध
  rationale: निकटतम उपयुक्त स्त्रीलिंग पूर्वपद ‘याजकपद’ है, और कोष्ठकीय कथन बताता है कि लोगों को दी गई व्यवस्था उस याजकीय प्रबंध के आधार पर थी।
- issue: τάξις का अर्थ
  choice: ‘रीति’ द्वारा प्रतिरूप, प्रकार या नियुक्त श्रेणी का अर्थ खुला रखा गया है।
  alternative: क्रम; परंपरा; पदक्रम
  rationale: इसे संस्थागत उत्तराधिकार या किसी विशिष्ट धार्मिक पदक्रम तक सीमित करना मूल शब्द की अर्थगत व्यापकता को अनावश्यक रूप से संकुचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, पठनीय और मध्यम रूप से औपचारिक शैली रखी गई है। ‘याजकपद’, ‘व्यवस्था’ और ‘सिद्धता’ जैसे स्थापित धर्मग्रंथीय शब्द साधारण पाठक के लिए बोधगम्य रहते हुए मूल तर्क की संक्षिप्तता और धर्मवैज्ञानिक गहराई बनाए रखते हैं।
