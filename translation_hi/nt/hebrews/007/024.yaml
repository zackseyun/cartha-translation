base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/024.yaml
  text: But he[a], because he remains forever, holds the priesthood permanently.
translation:
  language: hi
  text: परन्तु वह सदा बना रहता है, इसलिए उसका याजकपद स्थायी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका याजकपद अपरिवर्तनीय है’ अथवा ‘उसका याजकपद किसी दूसरे को नहीं सौंपा जाता।’ यूनानी विशेषण में दोनों अर्थछायाएँ हो सकती हैं। संदर्भ में आशय यह है कि वह सदा जीवित रहता है, इसलिए उसका याजकपद किसी और के पास नहीं जाता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: परन्तु वह
  rationale: पूर्ववर्ती अनेक याजकों के विपरीत यीशु की ओर संकेत करने वाले संज्ञात्मक लेख और δέ के विरोधसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ τὸ μένειν αὐτὸν
  choice: वह ... बना रहता है, इसलिए
  rationale: διά के साथ प्रयुक्त संज्ञात्मक infinitive यहाँ कारण बताता है; हिन्दी में कारण-परिणाम की यह रचना सहज है और μένω की निरन्तर बने रहने की धारणा रखती है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा
  rationale: यह कालवाचक मुहावरा अंतहीन बने रहने को दर्शाता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: ἀπαράβατον
  choice: स्थायी
  rationale: यह विशेषण ऐसे याजकपद को सूचित कर सकता है जो बदलता नहीं या किसी दूसरे को हस्तांतरित नहीं होता। ‘स्थायी’ संदर्भगत अर्थ स्पष्ट करता है और अधिक संकीर्ण अर्थ को मुख्य पाठ में निर्णायक नहीं बनाता।
- source_word: ἔχει τὴν ἱερωσύνην
  choice: उसका याजकपद ... है
  rationale: ἔχω यहाँ पद के धारण या अधिकार में होने को व्यक्त करता है। हिन्दी में संबंधसूचक रचना स्वाभाविक ढंग से बताती है कि यह याजकपद उसी का बना रहता है।
- source_word: ἱερωσύνην
  choice: याजकपद
  rationale: यह शब्द याजक के पद या कार्यभार को दर्शाता है; ‘याजकपद’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: मसीह के याजकपद के संबंध में ἀπαράβατον का अर्थ
  choice: मुख्य पाठ में ‘स्थायी’, जिससे यह उभरता है कि सदा जीवित रहने के कारण उसका याजकपद बना रहता है।
  alternative: ‘अपरिवर्तनीय’ अथवा ‘किसी दूसरे को न सौंपा जाने वाला’ याजकपद।
  rationale: संदर्भ नश्वर और एक-दूसरे का स्थान लेने वाले याजकों के साथ उसका विरोध करता है। ‘स्थायी’ उस तर्क को व्यक्त करता है, जबकि वास्तविक शब्दार्थगत द्विविधा पादटिप्पणी में सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप। ‘याजकपद’ पदगत अर्थ को स्पष्ट रखता है; पादटिप्पणी मूल विशेषण की वास्तविक अर्थगत व्यापकता सुरक्षित रखती है।
