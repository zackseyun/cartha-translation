translation:
  language: hi
  text: 'परन्तु यह उसके द्वारा, जिसने उससे कहा, शपथ के साथ याजक बना: “प्रभु ने शपथ खाई है[a] और वह अपना मन नहीं बदलेगा: ‘तू सदा के लिए याजक है।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “प्रभु ने शपथ खाई और वह अपना मन नहीं बदलेगा।” यूनानी एओरिस्ट Ὤμοσεν का अनुवाद “शपथ खाई” या “शपथ खाई है”—दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
