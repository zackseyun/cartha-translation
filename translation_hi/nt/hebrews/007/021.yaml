  rationale: इब्रानियों का तर्क पहले के याजकों, जो बिना शपथ ठहराए गए थे, और शपथ से स्थापित स्थायी याजकत्व के बीच विरोध करता है। अनुवाद इसी विरोध को रखता है, पर बाद की कोई विशिष्ट धर्मसैद्धान्तिक व्याख्या नहीं जोड़ता।
