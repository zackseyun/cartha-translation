id: HEB.7.28
reference: Hebrews 7:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ νόμος γὰρ ἀνθρώπους καθίστησιν ἀρχιερεῖς ἔχοντας ἀσθένειαν, ὁ λόγος δὲ τῆς ὁρκωμοσίας τῆς μετὰ τὸν νόμον υἱόν, εἰς τὸν αἰῶνα τετελειωμένον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/028.yaml
  text: For the law appoints men as high priests who have weakness[a], but the word of the oath, which came after the law[b], appoints a Son who has been perfected forever.
translation:
  language: hi
  text: क्योंकि व्यवस्था दुर्बलता वाले मनुष्यों को महायाजक नियुक्त करती है, पर शपथ का वचन, जो व्यवस्था के बाद आया, एक पुत्र[a] को नियुक्त करता है, जिसे सदा के लिए पूर्ण बनाया गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुत्र।” यूनानी में “पुत्र” के साथ निश्चित उपपद नहीं है; इससे “मनुष्यों” के साथ विरोध पर बल पड़ता है, फिर भी संदर्भ में संकेत यीशु की ओर ही है।
    reason: alternative_reading
  - marker: b
    text: या, “सदा के लिए पूर्ण किया गया है।” इस क्रिया का अर्थ “लक्ष्य तक पहुँचाया गया” और याजकीय संदर्भ में “प्रतिष्ठित किया गया” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νόμος
  choice: व्यवस्था
  rationale: यहाँ मूसा की व्यवस्था, विशेषकर उसकी याजकीय विधियों, का संकेत है; ‘व्यवस्था’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और स्पष्ट है।
- source_word: καθίστησιν
  choice: नियुक्त करती है
  rationale: महायाजकीय पद पर औपचारिक स्थापना का भाव व्यक्त करता है और यूनानी वर्तमान काल को बनाए रखता है।
- source_word: ἀνθρώπους
  choice: मनुष्यों
  rationale: लेवीय महायाजकों के मानवीय और निर्बल होने को पुत्र के साथ विरोध में रखता है; हिन्दी में यह शब्द संदर्भानुसार पुरुष पदधारियों को भी समेटता है।
- source_word: ἀρχιερεῖς
  choice: महायाजक
  rationale: लगातार नियुक्त होने वाले अनेक पदधारियों के लिए हिन्दी में यही प्रचलित पदनाम है; बहुवचन का अर्थ ‘मनुष्यों को’ और क्रिया से स्पष्ट है।
- source_word: ἔχοντας ἀσθένειαν
  choice: निर्बलता से ग्रस्त
  rationale: ἀσθένεια को केवल शारीरिक बीमारी तक सीमित न करके मानवीय दुर्बलता और सीमितता का व्यापक भाव बनाए रखता है।
- source_word: λόγος τῆς ὁρκωμοσίας
  choice: शपथ का वचन
  rationale: परमेश्वर की शपथयुक्त घोषणा के लिए λόγος और ὁρκωμοσία दोनों को सीधे और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: τῆς μετὰ τὸν νόμον
  choice: जो व्यवस्था के बाद आया
  rationale: यह स्पष्ट करता है कि शपथ का वचन व्यवस्था दिए जाने के बाद आया, जो इब्रानियों के तर्क का कालक्रम है।
- source_word: υἱόν
  choice: एक पुत्र
  rationale: यूनानी में संज्ञा के साथ उपपद नहीं है और इसका विरोध ‘मनुष्यों’ से है; ‘एक पुत्र’ इस रूप को बनाए रखता है, जबकि संदर्भ स्पष्ट करता है कि संकेत यीशु की ओर है।
- source_word: εἰς τὸν αἰῶνα
  choice: सदा के लिए
  rationale: स्थायी और अनंत प्रभाव को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: τετελειωμένον
  choice: जिसे सिद्ध किया गया है
  rationale: 'पूर्ण निष्पन्न कर्मवाच्य कृदंत का भाव रखता है: पुत्र को अपेक्षित पूर्णता या योग्यता तक पहुँचाया गया है और वह स्थिति बनी हुई है।'
theological_decisions:
- issue: उपपदरहित υἱόν का अनुवाद
  choice: एक पुत्र
  alternative: पुत्र / उस पुत्र को
  rationale: यह व्यवस्था द्वारा नियुक्त ‘मनुष्यों’ और शपथ द्वारा नियुक्त ‘पुत्र’ के गुणात्मक विरोध को बनाए रखता है। ‘एक’ यूनानी की अनिश्चित/गुणात्मक रचना को दर्शाता है, पर पादटिप्पणी यह स्पष्ट करती है कि संदर्भ किसी अनिर्दिष्ट पुत्र की बात नहीं करता।
- issue: τετελειωμένον का याजकीय और धर्मवैज्ञानिक अर्थ
  choice: जिसे सदा के लिए सिद्ध किया गया है
  alternative: जिसे सदा के लिए पूर्ण किया गया है / अभिषिक्त किया गया है
  rationale: ‘सिद्ध’ इब्रानियों में पूर्णता, लक्ष्य-सिद्धि और याजकीय योग्यता की अर्थ-व्याप्ति को खुला रखता है; केवल ‘अभिषिक्त’ कहना संभावित याजकीय अर्थ को निर्णायक बना देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में व्यवस्था और शपथ के वचन के बीच मूल विरोध सुरक्षित है। ‘निर्बलता से ग्रस्त’ मानवीय दुर्बलता का व्यापक अर्थ रखता है, और ‘सिद्ध किया गया है’ यूनानी पूर्ण कर्मवाच्य रूप तथा इब्रानियों की धर्मवैज्ञानिक अर्थ-तनाव दोनों को बनाए रखता है।
