source:
  edition: SBLGNT
  text: Θεωρεῖτε δὲ πηλίκος οὗτος ⸀ᾧ δεκάτην Ἀβραὰμ ἔδωκεν ἐκ τῶν ἀκροθινίων ὁ πατριάρχης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/004.yaml
  text: Consider how great this man was[b][a], to whom Abraham the patriarch gave a tenth of the spoils.
translation:
  language: hi
  text: ध्यान दो कि यह व्यक्ति कितना महान था, जिसे कुलपिता अब्राहम ने युद्ध की लूट[b] में से दसवाँ भाग[a] दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दशमांश।” यूनानी में शाब्दिक रूप से “दसवाँ” है।
    reason: lexical_alternative
  - marker: b
    text: इस यूनानी शब्द का अर्थ युद्ध में प्राप्त लूट है; इसमें लूट के सबसे अच्छे भाग का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Θεωρεῖτε
  choice: ध्यान दो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक श्रोताओं को सोच-विचारपूर्वक देखने के लिए बुलाता है; ‘ध्यान दो’ आधुनिक हिन्दी में इसका स्वाभाविक आग्रह व्यक्त करता है।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यहाँ δέ हल्के संक्रमण का संकेत देता है; हिन्दी में प्रसंग का प्रवाह बिना ‘अब’ या ‘परन्तु’ जोड़े स्वाभाविक रहता है।
- source_word: πηλίκος
  choice: कितना महान
  rationale: यह पद परिमाण या महानता व्यक्त करता है और महानता के सटीक स्वरूप को आगे के तर्क के लिए खुला छोड़ता है।
- source_word: οὗτος
  choice: यह व्यक्ति
  rationale: यह पिछले प्रसंग के मलिकिसिदक को इंगित करता है; ‘व्यक्ति’ हिन्दी में स्वाभाविक है और आवश्यकता से अधिक व्याख्या नहीं करता।
- source_word: ᾧ
  choice: जिसे
  rationale: यह सम्बन्धवाचक सर्वनाम ‘दिया’ के अप्रत्यक्ष कर्म को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: δεκάτην
  choice: दसवाँ भाग
  rationale: यूनानी का शाब्दिक अर्थ ‘दसवाँ’ है; यह ‘दशमांश’ की सम्भव धार्मिक-संस्थागत ध्वनि को मुख्य पाठ में अनावश्यक रूप से नहीं लाता।
- source_word: Ἀβραὰμ
  choice: अब्राहम
  rationale: नाम का प्रचलित मानक हिन्दी रूप।
- source_word: ἔδωκεν
  choice: दिया
  rationale: δίδωμι के सामान्य अर्थ को सीधी और पर्याप्त हिन्दी में व्यक्त करता है।
- source_word: ἐκ τῶν ἀκροθινίων
  choice: युद्ध की लूट में से
  rationale: ἀκροθίνια युद्ध में प्राप्त लूट को दर्शाता है और सम्भवतः उसके उत्तम भाग का संकेत दे सकता है; मुख्य पाठ निश्चित अर्थ रखता है और सम्भव सूक्ष्मता पादटिप्पणी में देता है।
- source_word: ὁ πατριάρχης
  choice: कुलपिता
  rationale: यह अब्राहम की वंशगत पूर्वज की प्रतिष्ठित भूमिका व्यक्त करता है; ‘कुलपिता’ संक्षिप्त और गरिमापूर्ण हिन्दी पद है।
theological_decisions:
- issue: पद का संकेत और मूल्यांकनात्मक बल
  choice: पद मलिकिसिदक की महानता इस तथ्य से दिखाता है कि कुलपिता अब्राहम ने भी उसे लूट का दसवाँ भाग दिया।
  alternative: इसे मलिकिसिदक की अब्राहम पर श्रेष्ठ स्थिति का अधिक स्पष्ट कथन बनाकर अनूदित किया जा सकता था।
  rationale: यूनानी पाठ इस घटना द्वारा मलिकिसिदक की महानता पर बल देता है, पर श्रेष्ठता का पूरा धर्मवैज्ञानिक निष्कर्ष आसपास के तर्क पर छोड़ता है; अनुवाद उस तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज। ‘ध्यान दो’ बहुवचन सम्बोधन का स्वाभाविक हिन्दी रूप है। पादटिप्पणी-चिह्न सम्बद्ध पदों के तुरंत बाद रखे गए हैं।
