id: HEB.7.5
reference: Hebrews 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οἱ μὲν ἐκ τῶν υἱῶν Λευὶ τὴν ἱερατείαν λαμβάνοντες ἐντολὴν ἔχουσιν ἀποδεκατοῦν τὸν λαὸν κατὰ τὸν νόμον, τοῦτ’ ἔστιν τοὺς ἀδελφοὺς αὐτῶν, καίπερ ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/005.yaml
  text: And those from the sons of Levi who receive the priesthood have a commandment according to the law to collect a tenth from the people—that is[b][a], from their brothers—though they also have come from Abraham’s loins.
translation:
  language: hi
  text: और लेवी के पुत्रों में से जो याजकपद प्राप्त करते हैं, उन्हें व्यवस्था के अनुसार लोगों से—अर्थात अपने भाइयों से[a]—दसवाँ भाग लेने की आज्ञा है, यद्यपि वे भी अब्राहम की कटि से निकले हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने साथी इस्राएलियों से।” यूनानी में “अपने भाइयों से” है, जो उसी प्रजा के सदस्यों के लिए पुल्लिंग संबंधसूचक भाषा का प्रयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, “वे भी अब्राहम के वंशज हैं।” मूल में शाब्दिक रूप से “अब्राहम की कटि से निकले हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἱ μὲν ἐκ τῶν υἱῶν Λευὶ
  choice: लेवी के पुत्रों में से जो
  rationale: ἐκ का अंशवाचक भाव और υἱῶν की वंशगत भाषा बनी रहती है; आशय लेवी के सभी वंशजों से नहीं, बल्कि उनमें से याजकपद पाने वालों से है।
- source_word: τὴν ἱερατείαν λαμβάνοντες
  choice: याजकपद प्राप्त करते हैं
  rationale: λαμβάνοντες को ‘प्राप्त करते हैं’ कहना नियुक्ति अथवा पद मिलने का भाव देता है, न कि स्वयं उसे हथिया लेने का। ‘याजकपद’ ἱερατεία का स्वाभाविक और गरिमापूर्ण अनुवाद है।
- source_word: ἐντολὴν ἔχουσιν
  choice: उन्हें ... आज्ञा है
  rationale: हिन्दी में यह स्वाभाविक नामवाचक रचना है और ἐντολή का विधिक तथा वाचा-संबंधी बल बनाए रखती है।
- source_word: ἀποδεκατοῦν
  choice: दसवाँ भाग लेने
  rationale: क्रिया का अर्थ दूसरों से दसवाँ भाग लेना है, स्वयं दशमांश देना नहीं। यह रूप आधुनिक पाठक के लिए स्पष्ट है।
- source_word: τὸν λαὸν
  choice: लोगों से
  rationale: λαός का सीधा अनुवाद है; आगे का स्पष्टीकरण ‘अपने भाइयों से’ बताता है कि यहाँ इस्राएली समुदाय अभिप्रेत है।
- source_word: κατὰ τὸν νόμον
  choice: व्यवस्था के अनुसार
  rationale: κατά के मानक अथवा नियमानुरूप अर्थ को बनाए रखते हुए मूसा की व्यवस्था का संदर्भ स्पष्ट करता है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात
  rationale: व्याख्यात्मक समानाधिकरण को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τοὺς ἀδελφοὺς αὐτῶν
  choice: अपने भाइयों से
  rationale: यूनानी की पुल्लिंग संबंधसूचक भाषा को मुख्य पाठ में सुरक्षित रखा गया है; व्यापक सामुदायिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: καίπερ
  choice: यद्यपि
  rationale: कृदन्त के साथ प्रयुक्त concessive बल को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐξεληλυθότας ἐκ τῆς ὀσφύος Ἀβραάμ
  choice: वे भी अब्राहम की कटि से निकले हैं
  rationale: शारीरिक वंशोद्भव की मूर्त उपमा को बनाए रखता है, जो अध्याय के तर्क में महत्वपूर्ण है; ‘भी’ साझा अब्राहमी वंश पर बल देता है।
theological_decisions:
- issue: इस्राएली समुदाय के लिए संबंधसूचक भाषा
  choice: अपने भाइयों से
  alternative: अपने साथी इस्राएलियों से
  rationale: ἀδελφούς स्पष्ट रूप से ‘भाइयों’ कहता है और यहाँ वंशगत तथा वाचा-संबंधी आत्मीयता व्यक्त करता है। व्यापक संदर्भ को मुख्य पाठ में तटस्थ किए बिना पादटिप्पणी में बताया गया है।
- issue: शारीरिक वंश की उपमा को बनाए रखना
  choice: अब्राहम की कटि से निकले हैं
  alternative: अब्राहम के वंशज हैं
  rationale: लेखक का तर्क केवल सामान्य वंशावली नहीं, बल्कि साझा शारीरिक उद्गम की मूर्त भाषा पर चलता है। इसलिए मूल उपमा मुख्य पाठ में रखी गई है और सरल अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य। ‘व्यवस्था’, ‘याजकपद’ और ‘आज्ञा’ विधिक-वाचा संबंधी संदर्भ को बनाए रखते हैं। मूल की वंशगत देह-उपमा को मुख्य पाठ में रखा गया है, पर उसकी स्पष्ट व्याख्या पादटिप्पणी में दी गई है।
