theological_decisions:
- issue: क्या पद मलिकिसिदक को सचमुच माता-पिता रहित और अनन्त बताता है, या उत्पत्ति में उसके शास्त्रीय चित्रण को प्रतिरूपात्मक ढंग से उपयोग करता है?
  choice: मुख्य पाठ मूल के कठोर वर्णनों को बनाए रखता है, जबकि 'परमेश्वर के पुत्र के समान बनाया गया' समानता और प्रतिरूप का संकेत देता है; पादटिप्पणी अभिलेखित वंशावली की सम्भावना बताती है।
  alternative: मलिकिसिदक को देहधारण-पूर्व पुत्र का प्राकट्य, अथवा अपने अस्तित्व में सचमुच माता-पिता रहित और अनन्त समझना।
  rationale: ἀφωμοιωμένος पुत्र से समानता बताता है, पहचान नहीं। उत्पत्ति की कथा में वंश और मृत्यु के उल्लेख का अभाव इब्रानियों के तर्क का आधार हो सकता है; इसलिए अनुवाद तनाव को बनाए रखता है, उसे किसी एक सिद्धान्त से निर्णायक रूप से हल नहीं करता।
