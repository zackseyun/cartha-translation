- source_word: ἱερεὺς
  choice: याजक
  rationale: इब्रानियों के धार्मिक और बलिदानी संदर्भ में ἱερεύς का प्रचलित, सटीक हिन्दी प्रतिशब्द।
- source_word: εἰς τὸ διηνεκές
