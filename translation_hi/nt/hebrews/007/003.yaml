  text: ἀπάτωρ, ἀμήτωρ, ἀγενεαλόγητος, μήτε ἀρχὴν ἡμερῶν μήτε ζωῆς τέλος ἔχων, ἀφωμοιωμένος δὲ τῷ υἱῷ τοῦ θεοῦ, μένει ἱερεὺς εἰς τὸ διηνεκές.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/003.yaml
  text: without father[a], without mother, without genealogy, having neither beginning of days nor end of life, but being made like the Son of God[b], he remains a priest perpetually.
translation:
  language: hi
  text: जो पिता के बिना, माता के बिना और वंशावली के बिना है[a], जिसके दिनों का न आरम्भ है, न जीवन का अन्त; परन्तु परमेश्वर के पुत्र के समान बनाया गया वह सदा के लिए याजक बना रहता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी कोई अभिलेखित वंशावली नहीं है।” उत्पत्ति में मलिकिसिदक की वंशावली दर्ज नहीं है; इब्रानियों का लेखक इस मौन का प्रतिरूपात्मक ढंग से उपयोग करता है।
    reason: lexical_alternative
  - marker: b
    text: “सदा के लिए” का अनुवाद “सर्वदा” या “हर समय के लिए” भी हो सकता है। यह वाक्यांश शास्त्र में प्रस्तुत उसके याजकत्व के स्थायी स्वरूप पर बल देता है।
    reason: lexical_alternative
