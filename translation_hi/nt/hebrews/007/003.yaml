  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, शास्त्रीय किन्तु बोधगम्य शैली अपनाई गई है। 'आरम्भ', 'अन्त', 'परमेश्वर का पुत्र' और 'याजक' जैसे परिचित बाइबलीय पद रखे गए हैं। यूनानी की क्रमिक अभाव-सूचक रचना और प्रतिरूपात्मक तनाव को यथासम्भव सुरक्षित रखा गया है।
