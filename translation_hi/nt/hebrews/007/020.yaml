lexical_decisions:
- source_word: Καὶ καθ’ ὅσον
  choice: और जिस हद तक
  rationale: यह पद अगले वाक्यांश के ‘उसी हद तक’ वाले तुलनात्मक निष्कर्ष की भूमिका बाँधता है; इसलिए कारणसूचक ‘क्योंकि’ की अपेक्षा माप और संबंध का भाव सुरक्षित रखा गया है।
- source_word: οὐ χωρὶς ὁρκωμοσίας
  choice: शपथ के बिना नहीं हुआ
  rationale: दोहरी नकारात्मक अभिव्यक्ति को बनाए रखा गया है। ‘हुआ’ संदर्भ में याजक बनने अथवा नियुक्ति होने की घटना की ओर संकेत करता है, पर मूल की संक्षिप्तता और संकेतात्मकता को स्पष्ट संज्ञा जोड़कर सीमित नहीं किया गया।
- source_word: οἱ μὲν γὰρ
  choice: क्योंकि वे तो
  rationale: ‘क्योंकि’ व्याख्यात्मक γάρ को और ‘तो’ आगामी विरोध के लिए anticipatory μέν को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: χωρὶς ὁρκωμοσίας
  choice: बिना शपथ के
  rationale: पहले आए उसी यूनानी पदबंध के अनुरूप एकसमान अनुवाद रखा गया है।
- source_word: εἰσὶν ἱερεῖς γεγονότες
  choice: याजक बने थे
  rationale: परिप्रयुक्त पूर्णकाल उनके याजक-पद में आने की पूर्ण घटना और उससे बनी स्थिति को व्यक्त करता है; हिन्दी में ‘बने थे’ प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: ‘वे’ और शपथ द्वारा स्थापित याजकत्व के बीच विरोध
  choice: ‘वे’ को बिना शपथ याजक बने पूर्ववर्ती याजकों के रूप में अनिर्दिष्ट रखा गया है, जबकि अगली पंक्ति में आने वाले शपथ-संबंधी विरोध के लिए वाक्य खुला रहता है।
  alternative: यहाँ ही ‘लेवीय याजक’ और ‘यीशु’ को स्पष्ट रूप से नाम देना।
  rationale: तात्कालिक संदर्भ इन referents को स्पष्ट करता है, पर इस पद के यूनानी पाठ में वे नाम नहीं हैं। उन्हें जोड़ना पद की संक्षिप्तता और अगले पद में खुलने वाले विरोध को अनावश्यक रूप से पहले ही व्याख्यायित कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और तर्कप्रधान रखी गई है। पद मूल में अधूरा वाक्य है जो अगले पद में आगे बढ़ता है; इसलिए अंतिम अल्पविराम और खुला कोष्ठक सुरक्षित रखे गए हैं।
