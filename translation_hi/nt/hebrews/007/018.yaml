  text: ἀθέτησις μὲν γὰρ γίνεται προαγούσης ἐντολῆς διὰ τὸ αὐτῆς ἀσθενὲς καὶ ἀνωφελές,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/018.yaml
  text: For there is indeed a setting aside of the former commandment because of its weakness and uselessness[b][a],
translation:
  language: hi
  text: क्योंकि पहले की आज्ञा[a] को उसकी निर्बलता और निष्फलता के कारण रद्द किया जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूर्ववर्ती आज्ञा” अथवा “पहले वाली आज्ञा”।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् आसपास के प्रसंग में बताई गई सिद्धता लाने में निष्फल (देखें इब्रानियों 7:19); यह नहीं कहा जा रहा कि परमेश्वर का पहले दिया हुआ प्रकाशन अपने आप में बुरा था।
    reason: cross_reference
lexical_decisions:
- source_word: ἀθέτησις
  choice: रद्द कर दी जाती है
  rationale: यह पद किसी व्यवस्था को प्रभावहीन या निरस्त किए जाने का कानूनी भाव रखता है। यह सहज आधुनिक हिन्दी है और मूल की तीक्ष्णता बनाए रखता है।
- source_word: μὲν γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन की व्याख्या आरम्भ करता है। μέν अगले पद के विरोधी पक्ष की भूमिका बनाता है; हिन्दी में अलग से ‘एक ओर’ कहना यहाँ भारी लगता, इसलिए प्रवाह में उसका संकेत निहित रखा गया है।
- source_word: γίνεται
  choice: कर दी जाती है
  rationale: ἀθέτησις के साथ यह किसी निरस्तीकरण के घटित होने को व्यक्त करता है; हिन्दी का कर्मवाच्य निर्माण स्वाभाविक रूप से यही अर्थ देता है।
- source_word: προαγούσης ἐντολῆς
  choice: पहले की आज्ञा
  rationale: प्रयोग का शाब्दिक अर्थ आगे से चली आती अथवा पहले विद्यमान आज्ञा है। ‘पहले की’ कालगत प्राथमिकता स्पष्ट करता है और प्रसंग में पूर्व याजकीय व्यवस्था से जुड़ी आज्ञा की ओर संकेत करता है।
- source_word: ἀσθενές
  choice: निर्बलता
  rationale: यह सामर्थ्य या प्रभावशीलता के अभाव को व्यक्त करता है। संज्ञात्मक रूप यूनानी की substantival रचना को बनाए रखता है।
- source_word: ἀνωφελές
  choice: निष्फलता
  rationale: इसका अर्थ लाभ या अपेक्षित परिणाम न देने वाला है। ‘निष्फलता’ प्रसंगगत अप्रभावशीलता बताता है और ‘बेकारपन’ की अनावश्यक रूप से सर्वांगीण निन्दा से बचता है।
theological_decisions:
- issue: ‘पहले की आज्ञा’ की आलोचना का दायरा
  choice: निर्बलता और निष्फलता की स्पष्ट आलोचना को बनाए रखते हुए इसे आसपास के प्रसंग में सिद्धता लाने की उसकी अक्षमता से सम्बद्ध समझना
  alternative: इसे पूरी मूसा-व्यवस्था के सर्वथा मूल्यहीन होने का कथन मानना, अथवा मूल की नकारात्मक भाषा को नरम कर देना
  rationale: इब्रानियों 7:11 और 7:19 का निकट प्रसंग याजकीय व्यवस्था द्वारा सिद्धता न ला सकने पर केन्द्रित है। अनुवाद मूल की तीक्ष्णता को सुरक्षित रखता है; पादटिप्पणी उसके प्रसंगगत आशय को स्पष्ट करती है, उसे मिटाती नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘निर्बलता और निष्फलता’ मूल के समानान्तर तीखे शब्दों को बनाए रखते हैं; पादटिप्पणियाँ वास्तविक शाब्दिक विकल्प और प्रसंगगत धार्मिक तनाव स्पष्ट करती हैं।
