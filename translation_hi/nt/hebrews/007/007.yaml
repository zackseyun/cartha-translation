  text: χωρὶς δὲ πάσης ἀντιλογίας τὸ ἔλαττον ὑπὸ τοῦ κρείττονος εὐλογεῖται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/007.yaml
  text: Beyond all dispute[a], the lesser is blessed by the greater.
translation:
  language: hi
  text: और इसमें कोई विवाद नहीं[a] कि कमतर को श्रेष्ठतर की ओर से आशीष मिलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिना किसी विवाद के”; अथवा, “बिना किसी विरोधाभास के।”
    reason: ἀντιλογία के अर्थ-क्षेत्र में विवाद, प्रतिवाद और विरोधाभास सम्मिलित हो सकते हैं; मुख्य पाठ स्वाभाविक हिन्दी मुहावरे का प्रयोग करता है।
lexical_decisions:
- source_word: χωρὶς δὲ πάσης ἀντιλογίας
  choice: और इसमें किसी विवाद की गुंजाइश नहीं
  rationale: यह वाक्यांश किसी बात को निर्विवाद सिद्धांत के रूप में प्रस्तुत करता है। δέ के हल्के संयोजक बल को ‘और’ से व्यक्त किया गया है; ‘विवाद की गुंजाइश नहीं’ χωρὶς πάσης ἀντιλογίας का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: τὸ ἔλαττον
  choice: जो छोटा है
  rationale: नपुंसकलिंग तुलनात्मक पद यहाँ सामान्य रूप से निम्न पद या दर्जे वाले व्यक्ति को सूचित करता है। ‘छोटा’ नैतिक हीनता जोड़े बिना तुलनात्मक स्थिति बनाए रखता है।
- source_word: ὑπὸ τοῦ κρείττονος
  choice: बड़े से
  rationale: ὑπό के साथ संबंधकारक निष्क्रिय क्रिया के कर्ता को दर्शाता है। ‘बड़े से’ पद या दर्जे की तुलना को संक्षिप्त और सहज हिन्दी में व्यक्त करता है।
- source_word: εὐλογεῖται
  choice: आशीष पाता है
  rationale: वर्तमानकालीन निष्क्रिय क्रिया बताती है कि छोटा व्यक्ति आशीष ग्रहण करता है। हिन्दी में ‘आशीष पाता है’ सीधे निष्क्रिय रूप की अपेक्षा अधिक स्वाभाविक है और याजकीय आशीष का भाव सुरक्षित रखता है।
theological_decisions:
- issue: ‘छोटे’ और ‘बड़े’ के बीच तुलना का स्वरूप
  choice: 'यह दर्जे का सामान्य सिद्धांत बताता है: छोटे पद वाला बड़े पद वाले से आशीष पाता है।'
  alternative: इसे केवल एक सामाजिक प्रथा मानना, जिसका कोई धर्मवैचारिक महत्व न हो।
  rationale: इब्रानियों 7 के प्रसंग में यह कथन अब्राहम की तुलना में मलिकिसिदक की श्रेष्ठता के तर्क को सहारा देता है। अनुवाद दर्जे की तुलना को बनाए रखता है, पर उसे व्याख्यात्मक विस्तार देकर निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘छोटा’ और ‘बड़ा’ प्रसंगानुसार पद या दर्जे की तुलना हैं, आकार या नैतिक मूल्य की नहीं।
