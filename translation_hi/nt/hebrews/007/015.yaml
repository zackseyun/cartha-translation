  rationale: संदर्भ में इसका तर्कात्मक अर्थ ‘क्योंकि’ के निकट समझा जा सकता है, फिर भी यूनानी की शर्तसूचक रचना और उसकी वास्तविक अस्पष्टता बनाए रखने के लिए ‘यदि’ रखा गया है।
- source_word: κατὰ τὴν ὁμοιότητα
  choice: समानता के अनुसार
  rationale: यह मूल पूर्वसर्गीय पदबंध के निकट है और भजन 110:4 से जुड़े इस अध्याय के तर्क की शब्दावली को सुरक्षित रखता है।
- source_word: Μελχισέδεκ
  choice: मलिकिसिदक
  rationale: व्यक्तिनाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: ἀνίσταται
  choice: उठ खड़ा होता है
  rationale: यह याजक के प्रकट होने या सामने आने की क्रिया-छवि बनाए रखता है, पर अपने आप पुनरुत्थान का अर्थ आरोपित नहीं करता।
- source_word: ἱερεὺς ἕτερος
  choice: एक और याजक
  rationale: यह स्वाभाविक हिंदी है और दूसरे याजक के उदय को व्यक्त करता है; ἕτερος में निहित भिन्नता की संभावित छाया पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: याजकपद के संबंध में ἕτερος की अर्थ-छाया
  choice: एक और याजक
  alternative: एक भिन्न याजक
  rationale: पद का तर्क लेवीय क्रम से अलग, मलिकिसिदक की समानता वाला याजक प्रस्तुत करता है। मुख्य पाठ में ‘एक और याजक’ सहज और पर्याप्त है, जबकि ‘भिन्न’ की अधिक प्रबल अर्थ-छाया को पादटिप्पणी में रखा गया है ताकि विरोध को न तो दबाया जाए, न मूल से अधिक तीखा बनाया जाए।
- issue: εἰ का शर्तसूचक अथवा तर्कसूचक बल
  choice: यदि
  alternative: क्योंकि / जब
  rationale: यद्यपि तर्क में कथन को निश्चित तथ्य के रूप में लिया जाता है, यूनानी पाठ औपचारिक रूप से शर्तसूचक है। ‘यदि’ उस तनाव को बिना व्याख्यात्मक रूप से सुलझाए बनाए रखता है।
