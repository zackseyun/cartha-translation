- source_word: περισσότερον ἔτι
  choice: और भी अधिक
  rationale: यह तुलनात्मक पदबंध पिछले तर्क की स्पष्टता को और प्रबल करता है; हिंदी में यह स्वाभाविक रूप से उसी बढ़ते हुए बल को व्यक्त करता है।
- source_word: κατάδηλόν
  choice: स्पष्ट
  rationale: इसका अर्थ प्रत्यक्ष या साफ़ तौर पर प्रकट है। ‘स्पष्ट’ आधुनिक हिंदी में सहज है और अतिरिक्त तीव्रता नहीं जोड़ता, क्योंकि वह पहले ही ‘और भी अधिक’ में व्यक्त है।
- source_word: εἰ
