source:
  edition: SBLGNT
  text: καὶ ὧδε μὲν δεκάτας ἀποθνῄσκοντες ἄνθρωποι λαμβάνουσιν, ἐκεῖ δὲ μαρτυρούμενος ὅτι ζῇ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/008.yaml
  text: And here mortal men receive tithes[a], but there he is testified to be living.
translation:
  language: hi
  text: और यहाँ मरने वाले मनुष्य दशमांश पाते हैं, पर वहाँ दशमांश वह पाता है जिसके विषय में गवाही दी जाती है कि वह जीवित है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “पर वहाँ उसके विषय में गवाही दी जाती है कि वह जीवित है।” यूनानी पाठ कथन को शास्त्र की गवाही के रूप में रखता है; वह सीधे यह नहीं कहता कि मलिकिसिदक सचमुच अमर है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὧδε
  choice: यहाँ
  rationale: यह शब्द वर्तमान लेवीय व्यवस्था को शास्त्र में वर्णित मलिकिसिदक के प्रसंग से अलग करते हुए ἐκεῖ के साथ स्पष्ट विरोध बनाता है।
- source_word: δεκάτας
  choice: दशमांश
  rationale: उपासना और व्यवस्था के इस संदर्भ में प्रचलित तथा स्वाभाविक हिन्दी शब्द।
- source_word: ἀποθνῄσκοντες ἄνθρωποι
  choice: मरनेवाले मनुष्य
  rationale: वर्तमान कृदंत की शाब्दिक शक्ति और इन याजकों की मरणशीलता—दोनों को बनाए रखता है। संदर्भ पुरुष याजकों का है, फिर भी हिन्दी में 'मनुष्य' स्वाभाविक है।
- source_word: λαμβάνουσιν
  choice: पाते हैं
  rationale: दशमांश ग्रहण करने का सीधा और सहज वर्णन, बिना अतिरिक्त अर्थ जोड़े।
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: '''यहाँ...वहाँ'' का आलंकारिक विरोध सुरक्षित रखता है और उत्पत्ति में मलिकिसिदक के शास्त्रीय चित्रण की ओर संकेत करता है।'
- source_word: μαρτυρούμενος
  choice: उसके विषय में गवाही दी जाती है
  rationale: निष्क्रिय रूप और शास्त्रीय साक्ष्य की धारणा को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὅτι ζῇ
  choice: कि वह जीवित है
  rationale: वर्तमान काल और कथन की सामग्री को सीधे व्यक्त करता है, पर इसे गवाही के ढाँचे से बाहर स्वतंत्र तात्त्विक दावा नहीं बनाता।
theological_decisions:
- issue: लेवीय याजकों और मलिकिसिदक के बीच विरोध का स्वरूप
  choice: मरणशील याजकों की तुलना मलिकिसिदक से की गई है, जिसके विषय में शास्त्रीय गवाही है कि वह जीवित है।
  alternative: यह पद मलिकिसिदक की शाब्दिक, निरंतर व्यक्तिगत अमरता की सीधी शिक्षा देता है।
  rationale: यूनानी पाठ सीधे अमरता घोषित करने के बजाय निष्क्रिय 'गवाही दी जाती है' कहता है। अनुवाद इस शास्त्रीय साक्ष्य और उससे उत्पन्न धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण। 'यहाँ...वहाँ' का मूल विरोध तथा 'गवाही दी जाती है' का निष्क्रिय शास्त्रीय स्वर सुरक्षित रखा गया है।
