base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/010.yaml
  text: For he was still in the loins of his father when Melchizedek met him[a].
translation:
  language: hi
  text: क्योंकि जब मलिकिसिदक उससे मिला, तब वह अब भी अपने पिता की कमर में था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक अर्थ-स्पष्ट रूप में, “वह अब भी अपने पूर्वज की देह में था।” यूनानी में शाब्दिक रूप से “अपने पिता की कमर में” है; यह पूर्वज से वंशगत उत्पत्ति का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔτι
  choice: अब भी
  rationale: यह उस समय तक जारी अवस्था को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करने वाले संयोजक का स्पष्ट हिन्दी रूप है।
- source_word: ἐν τῇ ὀσφύϊ
  choice: कमर में
  rationale: यह यूनानी के ठोस शारीरिक रूपक को बनाए रखता है; यहाँ इसका आशय पूर्वज से वंशगत उत्पत्ति है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: τοῦ πατρὸς
  choice: अपने पिता की
  rationale: यूनानी पाठ की संबंध-संरचना को बनाए रखा गया है; सन्दर्भ में ‘पिता’ का अर्थ पूर्वज अब्राहम है।
- source_word: ἦν
  choice: था
  rationale: अपूर्णकालिक ‘होना’ का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: ὅτε
  choice: जब
  rationale: यह घटना का समय बताने वाले यूनानी संयोजक का सामान्य हिन्दी समतुल्य है।
- source_word: συνήντησεν
  choice: मिला
  rationale: क्रिया का संक्षिप्त, स्वाभाविक अर्थ ‘मिलना’ है और उत्पत्ति की घटना के संकेत के अनुकूल है।
- source_word: αὐτῷ
  choice: उससे
  rationale: दत्तिव सर्वनाम यहाँ मिलने की क्रिया के दूसरे व्यक्ति, अर्थात सन्दर्भानुसार अब्राहम, को सूचित करता है; मूल की तरह नाम के बजाय सर्वनाम रखा गया है।
- source_word: Μελχισέδεκ
  choice: मलिकिसिदक
  rationale: व्यक्तिनाम को हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरित किया गया है।
theological_decisions:
- issue: लेवी की अब्राहम से वंशगत उत्पत्ति का मुहावरेदार निरूपण
  choice: मुख्य पाठ में ठोस रूपक ‘अपने पिता की कमर में’ बनाए रखना
  alternative: वह अब भी अपने पूर्वज की देह में था
  rationale: लेखक की दलील में लेवी अपने पूर्वज अब्राहम में वंशगत या जननात्मक अर्थ में उपस्थित माना गया है। ठोस रूपक बनाए रखने से मूल तर्क दिखाई देता है और अनुवाद में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी जाती।
- issue: ‘पिता’ की पहचान
  choice: ‘अपने पिता’ कहना
  alternative: ‘अपने पूर्वज अब्राहम’ कहना
  rationale: यद्यपि सन्दर्भित व्यक्ति अब्राहम है, यूनानी पाठ में ‘पिता’ है। मूल की अभिव्यक्ति बनाए रखने से पाठ में ऐसी स्पष्टता नहीं जोड़ी जाती जो उसके शब्दों में स्वयं नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कमर में’ सामान्य पाठक के लिए ‘कटि में’ से अधिक बोधगम्य है, जबकि पादटिप्पणी असामान्य वंशगत मुहावरे का अर्थ स्पष्ट करती है।
