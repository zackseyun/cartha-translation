  text: ἐφ’ ὃν γὰρ λέγεται ταῦτα φυλῆς ἑτέρας μετέσχηκεν, ἀφ’ ἧς οὐδεὶς προσέσχηκεν τῷ θυσιαστηρίῳ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/013.yaml
  text: For the one about whom these things are said belongs to another tribe[b][a], from which no one has served at the altar.
translation:
  language: hi
  text: क्योंकि जिसके विषय में ये बातें कही जाती हैं, वह एक अन्य गोत्र से सम्बन्ध रखता है[a], और उस गोत्र में से किसी ने भी वेदी पर सेवा नहीं की है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूसरे गोत्र में सहभागी हुआ है” अथवा “दूसरे गोत्र से आया है।” यूनानी क्रिया सहभागिता या संबद्धता बता सकती है; यहाँ आशय गोत्रीय सम्बन्ध से है।
    reason: lexical_alternative
  - marker: b
    text: या, “वेदी पर उपस्थित नहीं रहा है।” यूनानी अभिव्यक्ति वेदी से जुड़ी याजकीय उपस्थिति या सेवा की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐφ’ ὃν
  choice: जिसके विषय में
  rationale: ἐπί + कर्मकारक यहाँ उन बातों के संदर्भित व्यक्ति को दर्शाता है; यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है और तर्क की कड़ी बनाए रखता है।
- source_word: λέγεται ταῦτα
  choice: ये बातें कही जाती हैं
  rationale: वर्तमानकालीन कर्मवाच्य और बहुवचन ταῦτα दोनों सुरक्षित रखे गए हैं।
- source_word: φυλῆς ἑτέρας
  choice: एक दूसरे गोत्र
  rationale: इस्राएल के जनजातीय विभाजन के लिए बाइबिलीय हिन्दी में ‘गोत्र’ परिचित है; ‘दूसरे’ से याजकीय गोत्र से भिन्नता प्रकट होती है।
- source_word: μετέσχηκεν
  choice: से सम्बन्ध रखता है
  rationale: क्रिया की सहभागिता या संबद्धता की मूल धारणा को रखते हुए प्रसंगानुसार स्थायी गोत्रीय संबद्धता व्यक्त की गई है, बिना ‘वंशज है’ जोड़ने के।
- source_word: ἀφ’ ἧς
  choice: उस गोत्र में से
  rationale: सम्बन्धवाचक सर्वनाम का पूर्वपद φυλή है; संज्ञा दोहराने से हिन्दी में संदर्भ स्पष्ट और स्वाभाविक रहता है।
- source_word: οὐδεὶς
  choice: किसी ने भी ... नहीं
  rationale: पूर्ण निषेध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσέσχηκεν τῷ θυσιαστηρίῳ
  choice: वेदी पर सेवा नहीं की है
  rationale: वेदी की ओर लगे रहने या उसकी देखभाल करने की शाब्दिक छवि इस याजकीय प्रसंग में वेदी से जुड़ी सेवा को सूचित करती है; हिन्दी में ‘वेदी पर सेवा’ स्पष्ट है।
- source_word: θυσιαστηρίῳ
  choice: वेदी
  rationale: बलिदान-संबंधी altar के लिए मानक और सर्वमान्य हिन्दी शब्द।
theological_decisions:
- issue: याजकत्व के तर्क में यीशु का लेवी से भिन्न गोत्र से सम्बन्ध
  choice: ‘दूसरे गोत्र से सम्बन्ध रखता है’
  alternative: ‘दूसरे गोत्र से उत्पन्न हुआ है’
  rationale: यूनानी पाठ यहाँ गोत्रीय सहभागिता या संबद्धता कहता है, वंशावली या उत्पत्ति को स्पष्ट रूप से नहीं कहता। इसलिए अनुवाद गैर-लेवी गोत्र से सम्बन्ध को दिखाता है, पर बाद की धर्मवैज्ञानिक व्याख्या पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। ‘गोत्र’ और ‘वेदी’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं। वाक्य तर्कसूचक ‘क्योंकि’ से आरम्भ होता है और मूल पाठ की गोत्रीय संबद्धता तथा वेदी-सेवा के बीच की तुलना को बिना अतिरिक्त सिद्धान्त जोड़े स्पष्ट करता है।
