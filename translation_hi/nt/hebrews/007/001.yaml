  text: Οὗτος γὰρ ὁ Μελχισέδεκ, βασιλεὺς Σαλήμ, ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου, ⸀ὁ συναντήσας Ἀβραὰμ ὑποστρέφοντι ἀπὸ τῆς κοπῆς τῶν βασιλέων καὶ εὐλογήσας αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/001.yaml
  text: For this Melchizedek[a], king of Salem, priest of God Most High, met Abraham as he was returning from the slaughter of the kings and blessed him[b],
translation:
  language: hi
  text: क्योंकि यह मलिकिसिदक, शालेम का राजा और परमप्रधान परमेश्वर का याजक, राजाओं के संहार[a] के बाद लौटते हुए अब्राहम से मिला और उसे आशीर्वाद दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजाओं को पराजित करने के बाद।” यूनानी में अधिक शाब्दिक रूप से, “राजाओं के संहार के बाद।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὗτος γὰρ ὁ Μελχισέδεκ
  choice: क्योंकि यही मलिकिसिदक
  rationale: γάρ पिछले तर्क से व्याख्यात्मक संबंध जोड़ता है, इसलिए ‘क्योंकि’ रखा गया है। Οὗτος के संकेतात्मक बल को ‘यही’ से व्यक्त किया गया है; नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण ‘मलिकिसिदक’ है।
- source_word: βασιλεὺς Σαλήμ
  choice: शालेम का राजा
  rationale: यह सीधा पदनाम है और ‘शालेम’ उत्पत्ति 14 से संबंध बनाए रखने वाला परिचित हिन्दी लिप्यंतरण है।
- source_word: ἱερεὺς τοῦ θεοῦ τοῦ ὑψίστου
  choice: परमप्रधान परमेश्वर का याजक
  rationale: यह आधुनिक हिन्दी में स्वाभाविक ढंग से ὕψιστος को परमेश्वर की उपाधि के रूप में सुरक्षित रखता है।
- source_word: ὁ συναντήσας Ἀβραὰμ
  choice: वह ... अब्राहम से मिला
  rationale: कृदन्त को हिन्दी के स्वाभाविक सीमित क्रिया-वाक्य में बदला गया है; ‘मिला’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: ὑποστρέφοντι
  choice: लौटते हुए
  rationale: वर्तमान कृदन्त अब्राहम की उस समय जारी वापसी को दर्शाता है; हिन्दी में ‘लौटते हुए’ यही समकालिकता व्यक्त करता है।
- source_word: ἀπὸ τῆς κοπῆς τῶν βασιλέων
  choice: राजाओं का संहार करके
  rationale: κοπή का मूल भाव काट गिराने या संहार का है। ‘संहार’ उसकी तीव्रता को बचाता है, जबकि ‘हरा कर’ अधिक व्याख्यात्मक विकल्प है।
- source_word: καὶ εὐλογήσας αὐτόν
  choice: और उसे आशीर्वाद दिया
  rationale: दूसरे समन्वित कृदन्त को हिन्दी में मुख्य क्रिया के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: τοῦ θεοῦ τοῦ ὑψίστου में दिव्य उपाधि का रूप
  choice: परमप्रधान परमेश्वर का याजक
  alternative: परमेश्वर परमप्रधान का याजक
  rationale: चुना हुआ रूप स्वाभाविक आधुनिक हिन्दी है और ‘परमप्रधान’ को परमेश्वर की उपाधि बनाए रखता है; किसी अतिरिक्त सांप्रदायिक अर्थ को नहीं जोड़ता।
- issue: κοπή का सैन्य अर्थ
  choice: राजाओं का संहार
  alternative: राजाओं को पराजित करना
  rationale: ‘संहार’ यूनानी शब्द के अधिक शाब्दिक और कठोर अर्थ को सुरक्षित रखता है। फुटनोट कम शाब्दिक, प्रसंगाधारित विकल्प बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। पद यूनानी वाक्य में आगे जारी रहता है, पर हिन्दी में पठनीयता के लिए इस पद को पूर्ण वाक्यों में प्रस्तुत किया गया है।
