id: HEB.7.25
reference: Hebrews 7:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅθεν καὶ σῴζειν εἰς τὸ παντελὲς δύναται τοὺς προσερχομένους δι’ αὐτοῦ τῷ θεῷ, πάντοτε ζῶν εἰς τὸ ἐντυγχάνειν ὑπὲρ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/025.yaml
  text: Therefore he is also able to save completely those who draw near to God through him[a], since he always lives to intercede for them.
translation:
  language: hi
  text: इसी कारण वह उन लोगों का पूरी तरह[a] उद्धार करने में भी समर्थ है, जो उसके द्वारा परमेश्वर के निकट आते हैं, क्योंकि वह उनके लिए विनती करने को सदा जीवित है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सदा के लिए”; परम्परागत रूप से, “अन्त तक।”
    reason: εἰς τὸ παντελές में पूर्णता के साथ कालगत स्थायित्व का अर्थ भी सम्भव है।
lexical_decisions:
- source_word: ὅθεν
  choice: इसी कारण
  rationale: यह पिछले तर्क—यीशु के स्थायी याजकपद—से निकले निष्कर्ष को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: καὶ
  choice: भी
  rationale: 'पिछली बात से जुड़े अतिरिक्त परिणाम को बनाए रखता है: वह स्थायी याजक है और उद्धार करने में भी समर्थ है।'
- source_word: σῴζειν
  choice: उद्धार करने
  rationale: उद्धार-संबंधी संदर्भ में यह मानक, गरिमापूर्ण और अर्थपूर्ण हिन्दी पद है।
- source_word: εἰς τὸ παντελές
  choice: पूरी तरह
  rationale: मुख्य पाठ में उद्धार की पूर्णता व्यक्त करता है, जबकि सम्भव कालगत अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δύναται
  choice: समर्थ है
  rationale: उसकी स्थायी याजकीय सेवा पर आधारित सामर्थ्य को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: τοὺς προσερχομένους
  choice: जो ... निकट आते हैं
  rationale: इब्रानियों में परमेश्वर तक उपासना-संबंधी और आत्मीय पहुँच के भाव को केवल ‘आते हैं’ की अपेक्षा बेहतर बनाए रखता है।
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: यीशु की मध्यस्थ भूमिका और उसके माध्यम से परमेश्वर तक पहुँच को व्यक्त करता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर के निकट
  rationale: προσέρχομαι के साथ लक्ष्य को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: πάντοτε ζῶν
  choice: क्योंकि वह ... सदा जीवित है
  rationale: कृदन्तीय वाक्यांश की कारणसूचक भूमिका और उसके निरन्तर जीवन, दोनों को स्पष्ट करता है।
- source_word: εἰς τὸ ἐντυγχάνειν
  choice: विनती करने को
  rationale: उसके निरन्तर जीवन के उद्देश्य—दूसरों के पक्ष में परमेश्वर से निवेदन—को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὑπὲρ αὐτῶν
  choice: उनके लिए
  rationale: उनके हित में और उनकी ओर से प्रतिनिधिक विनती का भाव संक्षेप में देता है।
theological_decisions:
- issue: εἰς τὸ παντελές का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘पूरी तरह’
  alternative: ‘सदा के लिए’; परम्परागत रूप से, ‘अन्त तक’
  rationale: वाक्यांश पूर्णतः, सर्वथा अथवा सर्वकाल के लिए का अर्थ दे सकता है। संदर्भ उद्धार की पूर्णता और स्थायी प्रभावशीलता, दोनों का समर्थन करता है; इसलिए मुख्य पाठ एक अर्थ रखता है और पादटिप्पणी दूसरे सम्भव अर्थों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण धार्मिक शैली। ‘निकट आते हैं’, ‘उद्धार’ और ‘विनती’ जैसे पद इब्रानियों के याजकीय और मध्यस्थतापरक संदर्भ को सहज रूप में बनाए रखते हैं।
