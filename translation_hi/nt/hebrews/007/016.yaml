  text: ὃς οὐ κατὰ νόμον ἐντολῆς ⸀σαρκίνης γέγονεν ἀλλὰ κατὰ δύναμιν ζωῆς ἀκαταλύτου,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/016.yaml
  text: who has become such not according to a law of a fleshly commandment[a], but according to the power of an indestructible life[c][b],
translation:
  language: hi
  text: जो शरीर-संबंधी आज्ञा की व्यवस्था के आधार पर नहीं, बल्कि अविनाशी जीवन की सामर्थ्य के आधार पर ऐसा बना है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὃς
  choice: जो
  rationale: सम्बन्धवाचक सर्वनाम पिछले पद में वर्णित व्यक्ति से वाक्य को जोड़ता है और यूनानी वाक्य-संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: κατὰ νόμον
  choice: व्यवस्था के अनुसार
  rationale: κατά यहाँ मानक या आधार व्यक्त करता है। हिन्दी में ‘के अनुसार’ दोनों अर्थों को सहजता से वहन करता है; अनिश्चितता व्यक्त करने के लिए ‘एक व्यवस्था’ जोड़ना अप्राकृतिक और अनावश्यक होता।
- source_word: ἐντολῆς σαρκίνης
  choice: शरीर से सम्बन्धित आज्ञा की
  rationale: यह पदबंध νόμον को विशेषित करता है। ‘शरीर से सम्बन्धित’ बाहरी, शारीरिक अथवा वंशगत योग्यता की ओर संकेत करता है और अनुचित नैतिक अर्थ ‘पापमय’ से बचता है।
- source_word: γέγονεν
  choice: ऐसा बना है
  rationale: पूर्णकाल पूर्व घटना से उत्पन्न वर्तमान स्थिति व्यक्त करता है। ‘ऐसा’ पिछले सन्दर्भ से याजक बनने के लुप्त भाव को ग्रहण करता है, उसे अत्यधिक स्पष्ट किए बिना।
- source_word: ἀλλὰ κατὰ δύναμιν
  choice: बल्कि ... सामर्थ्य के अनुसार
  rationale: पहले κατὰ पदबंध के साथ समानान्तर विरोध बनाए रखता है और δύναμις के सक्रिय, प्रभावकारी बल को ‘सामर्थ्य’ से व्यक्त करता है।
- source_word: ζωῆς ἀκαταλύτου
  choice: अविनाशी जीवन की
  rationale: ἀκατάλυτος उस वस्तु का बोध कराता है जिसे मिटाया, नष्ट किया या समाप्त नहीं किया जा सकता। ‘अविनाशी’ केवल अनन्त अवधि की अपेक्षा इस व्यापक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: σαρκίνης का अर्थ
  choice: शरीर से सम्बन्धित
  alternative: शारीरिक; देहगत
  rationale: सन्दर्भ में विरोध बाहरी अथवा वंशगत याजकीय नियम और अविनाशी जीवन की सामर्थ्य के बीच है। इस शब्द को ‘पापमय’ कहना मूल पाठ में निहित न होने वाला नैतिक अर्थ जोड़ देता।
- issue: ἀκαταλύτου का अर्थ
  choice: अविनाशी
  alternative: अनन्त; जिसका अन्त नहीं होता
  rationale: ‘अविनाशी’ नाश या विघटन की असम्भवता और निरन्तरता दोनों को समेटता है; ‘अनन्त’ मुख्यतः अवधि पर बल देता है।
- issue: निहित याजकीय विधेय
  choice: ऐसा बना है
  alternative: याजक बना है
  rationale: यूनानी में विधेय पिछले सन्दर्भ से समझा जाता है। ‘ऐसा’ उस सम्बन्ध को सुरक्षित रखता है और मूल पद में ‘याजक’ को दोहराए बिना हिन्दी को बोधगम्य बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘शरीर से सम्बन्धित’ को ‘शारीरिक’ पर प्राथमिकता दी गई है ताकि नैतिक रूप से नकारात्मक अर्थ न आए। वाक्य पिछले पद पर निर्भर सम्बन्धवाचक खंड है, इसलिए आरम्भ में ‘जो’ रखा गया है।
