  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘महायाजक’, ‘बलिदान’ और ‘चढ़ाना’ जैसे स्थापित बाइबलीय शब्द याजकीय प्रसंग को सुरक्षित रखते हैं।
