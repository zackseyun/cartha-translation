  text: ὃς οὐκ ἔχει καθ’ ἡμέραν ἀνάγκην, ὥσπερ οἱ ἀρχιερεῖς, πρότερον ὑπὲρ τῶν ἰδίων ἁμαρτιῶν θυσίας ἀναφέρειν, ἔπειτα τῶν τοῦ λαοῦ (τοῦτο γὰρ ἐποίησεν ἐφάπαξ ἑαυτὸν ἀνενέγκας)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/027.yaml
  text: who has no need[a], day after day, like the high priests, to offer up sacrifices first for his own sins and then for those of the people[d][c][b], for this he did once for all when he offered up himself.
translation:
  language: hi
  text: जिसे महायाजकों के समान दिन-प्रतिदिन[a] पहले अपने पापों के लिए और फिर लोगों के पापों के लिए[b] बलिदान चढ़ाने की आवश्यकता नहीं है; क्योंकि उसने यह सदा के लिए एक ही बार[c] कर दिया, स्वयं को चढ़ाकर[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रतिदिन’। यूनानी मुहावरे का अर्थ ‘दिन-प्रतिदिन’ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘फिर लोगों के [वे]’; यूनानी में ‘पापों’ शब्द पिछली बात से समझा जाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘एक ही बार, हमेशा के लिए’।
    reason: lexical_alternative
  - marker: d
    text: या ‘जब उसने स्वयं को चढ़ाया’ या ‘स्वयं को चढ़ाने के द्वारा’।
    reason: lexical_alternative
