- source_word: ὑπὲρ τῶν ἰδίων ἁμαρτιῶν
  choice: अपने पापों के लिए
  rationale: बलिदान-संबंधी प्रसंग में ὑπέρ का संक्षिप्त और स्वाभाविक अर्थ देता है।
- source_word: θυσίας ἀναφέρειν
  choice: बलिदान चढ़ाने
  rationale: याजकीय संदर्भ में ἀναφέρω के बलिदान अर्पित करने के अर्थ को हिन्दी के प्रचलित धार्मिक पद से व्यक्त करता है।
- source_word: τῶν τοῦ λαοῦ
  choice: लोगों के पापों के लिए
  rationale: यूनानी में ‘पापों’ शब्द पूर्वपद से समझा जाता है; हिन्दी में उसे स्पष्ट करना अर्थ को सहज बनाता है।
- source_word: τοῦτο γὰρ ἐποίησεν
  choice: क्योंकि यह उसने ... कर दिया
  rationale: τοῦτο के पूर्ववर्ती बलिदानी कार्य की ओर संकेत को बनाए रखता है।
- source_word: ἐφάπαξ
  choice: सदा के लिए एक ही बार
  rationale: घटना की एकबारगी और निर्णायक प्रकृति दोनों व्यक्त होती हैं।
- source_word: ἑαυτὸν ἀνενέγκας
  choice: अपने आप को बलिदान के रूप में चढ़ाकर
  rationale: कृदंत के साधनात्मक भाव तथा मसीह के स्वयं याजक और बलिदान होने के बलिदानी आशय को स्पष्ट रखता है।
theological_decisions:
- issue: ‘यह’ (τοῦτο) का दायरा
  choice: ‘यह’ को अभी वर्णित निर्णायक बलिदानी कार्य की ओर संकेत करने दिया गया है, बिना यह कहे कि यीशु ने अपने पापों के लिए बलिदान चढ़ाया।
  alternative: ‘यह’ केवल लोगों के पापों के लिए चढ़ाए गए बलिदान को सूचित करता है।
  rationale: वाक्य की तुलना महायाजकों की बार-बार की सेवा और मसीह के एकबारगी आत्म-बलिदान के बीच है। हिन्दी पाठ संकेत को बनाए रखता है और उसे अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: मसीह का आत्म-बलिदान
  choice: ‘अपने आप को बलिदान के रूप में चढ़ाकर’
  alternative: ‘अपने आप को दे दिया’ या ‘अपने आप को अर्पित करके’
  rationale: यह रूप इब्रानियों के याजकीय और बलिदानी संदर्भ को सुरक्षित रखता है और सामान्य आत्म-समर्पण तक अर्थ को सपाट नहीं करता।
