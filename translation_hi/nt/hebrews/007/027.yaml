- source_word: καθ’ ἡμέραν
  choice: दिन-प्रतिदिन
  rationale: यह यूनानी मुहावरे की बार-बार होने वाली दैनिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
