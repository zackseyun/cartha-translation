- source_word: ὥσπερ οἱ ἀρχιερεῖς
  choice: महायाजकों के समान
  rationale: तुलना और यूनानी के बहुवचन दोनों को बनाए रखता है।
- source_word: πρότερον ... ἔπειτα
  choice: पहले ... और फिर
