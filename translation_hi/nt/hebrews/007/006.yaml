source:
  edition: SBLGNT
  text: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν δεδεκάτωκεν ⸀Ἀβραάμ, καὶ τὸν ἔχοντα τὰς ἐπαγγελίας εὐλόγηκεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/006.yaml
  text: But the one who is not traced by genealogy from them has taken a tenth from Abraham and has blessed the one who had the promises[a][b].
translation:
  language: hi
  text: परन्तु जो उनसे वंशावली के अनुसार नहीं गिना जाता, उसने अब्राहम से दसवाँ भाग लिया है[a] और उस व्यक्ति को आशीष दी है जिसके पास प्रतिज्ञाएँ हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अब्राहम से दशमांश प्राप्त किया है।’ यूनानी क्रिया का अर्थ दसवाँ भाग लेना या प्राप्त करना है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिसके पास प्रतिज्ञाएँ थीं।’ यूनानी में यहाँ वर्तमान कृदन्त है; बीती घटना के कथात्मक वर्णन में हिन्दी में भूतकाल का प्रयोग भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ μὴ γενεαλογούμενος ἐξ αὐτῶν
  choice: परन्तु जिसकी वंशावली उनसे नहीं मानी जाती
  rationale: यह पदबंध मलिकिसिदक को लेवी के वंशजों से अलग रखता है। ‘वंशावली ... नहीं मानी जाती’ यूनानी के कर्मवाच्य भाव और वंशावली में गिने जाने के कानूनी/वंशगत आशय को बनाए रखता है, बिना मलिकिसिदक के अस्तित्व या उत्पत्ति के विषय में अतिरिक्त निष्कर्ष जोड़े।
- source_word: δεδεκάτωκεν
  choice: दसवाँ भाग लिया है
  rationale: यह क्रिया किसी से दसवाँ अंश लेने या प्राप्त करने को व्यक्त करती है। ‘लिया है’ यूनानी पूर्णकाल की वर्तमान प्रासंगिकता बनाए रखता है और स्पष्ट करता है कि देने वाला अब्राहम था।
- source_word: Ἀβραάμ
  choice: अब्राहम
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: τὸν ἔχοντα τὰς ἐπαγγελίας
  choice: उस व्यक्ति को ... जिसके पास प्रतिज्ञाएँ थीं
  rationale: बहुवचन ‘प्रतिज्ञाएँ’ सुरक्षित रखा गया है। प्रसंग में अब्राहम से जुड़ी बीती घटना का स्वाभाविक हिन्दी वर्णन करने के लिए ‘थीं’ रखा गया है; यूनानी में वर्तमान कृदन्त होने की जानकारी पाद-टिप्पणी में दी गई है।
- source_word: εὐλόγηκεν
  choice: आशीष दी है
  rationale: हिन्दी का पूर्ण रूप यूनानी पूर्णकाल के पूर्ण कार्य और तर्क में उसकी बनी हुई महत्ता, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मलिकिसिदक और लेवीय वंशावली का संबंध
  choice: वाक्य को वंशावली में गिने जाने और लेवी के वंश से संबंध के विरोध के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल ‘जो उनका वंशज नहीं था’ कहा जा सकता था।
  rationale: इब्रानियों के निकटवर्ती तर्क में विषय लेवीय वंशावली से बाहर याजकीय प्रतिष्ठा का है। चुना हुआ रूप इस बात को सुरक्षित रखता है, पर मलिकिसिदक की उत्पत्ति या तत्त्व के बारे में कोई अटकल नहीं जोड़ता।
- issue: अब्राहम के पास प्रतिज्ञाएँ होने का कालगत रूप
  choice: मुख्य पाठ में स्वाभाविक कथात्मक रूप ‘जिसके पास प्रतिज्ञाएँ थीं’ रखा गया है।
  alternative: यूनानी वर्तमान कृदन्त के अधिक शाब्दिक अनुरूप ‘जिसके पास प्रतिज्ञाएँ हैं’ कहा जा सकता है।
  rationale: दोनों रूप अब्राहम को प्रतिज्ञाओं का धारक बताते हैं। मुख्य पाठ हिन्दी कथा-प्रवाह को प्राथमिकता देता है, जबकि पाद-टिप्पणी मूल की कालगत अस्पष्टता को पाठक के लिए सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘दसवाँ भाग’ पारदर्शी सामान्य अभिव्यक्ति है; वैकल्पिक पारिभाषिक शब्द ‘दशमांश’ पाद-टिप्पणी में दिया गया है।
