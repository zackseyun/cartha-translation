source:
  edition: SBLGNT
  text: πρόδηλον γὰρ ὅτι ἐξ Ἰούδα ἀνατέταλκεν ὁ κύριος ἡμῶν, εἰς ἣν φυλὴν ⸂περὶ ἱερέων οὐδὲν⸃ Μωϋσῆς ἐλάλησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/014.yaml
  text: For it is evident that our Lord has arisen from Judah[a], a tribe about which Moses said nothing concerning priests.
translation:
  language: hi
  text: क्योंकि यह स्पष्ट है कि हमारे प्रभु यहूदा से उदित हुए हैं[a], और उस गोत्र के विषय में मूसा ने याजकों के बारे में कुछ नहीं कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदा से अंकुरित होकर निकले हैं।” यूनानी क्रिया में उदय होने या अंकुरित होकर निकलने का बिंब है; यहाँ मुख्य आशय यहूदा गोत्र से उनका वंशगत उद्गम है, न कि पुनरुत्थान।
    reason: lexical_alternative
lexical_decisions:
- source_word: πρόδηλον
  choice: यह स्पष्ट है
  rationale: यह पद एक प्रत्यक्ष और निर्विवाद तथ्य का परिचय देता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले तर्क का कारण अथवा स्पष्टीकरण प्रस्तुत करता है।
- source_word: ἐξ Ἰούδα
  choice: यहूदा से
  rationale: यह वंशगत उद्गम को व्यक्त करता है; आगे ‘गोत्र’ आने के कारण यहाँ उसे जोड़ना अनावश्यक होगा।
- source_word: ἀνατέταλκεν
  choice: उदित हुए हैं
  rationale: पूर्णकालिक क्रिया में उदय होने या अंकुरित होकर निकलने का बिंब है। ‘उदित हुए हैं’ उस रूपक को बनाए रखता है, यद्यपि सन्दर्भ में आशय यहूदा से वंशगत उत्पत्ति है, न कि मुख्यतः पुनरुत्थान।
- source_word: ὁ κύριος ἡμῶν
  choice: हमारे प्रभु
  rationale: उपाधि और संबंधवाचक सर्वनाम का स्वाभाविक हिन्दी रूप।
- source_word: εἰς ἣν φυλήν
  choice: उस गोत्र के विषय में
  rationale: सम्बन्धवाचक वाक्यांश अभी उल्लिखित यहूदा गोत्र की ओर संकेत करता है और हिन्दी में विषय-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περὶ ἱερέων οὐδὲν
  choice: याजकों के बारे में कुछ नहीं
  rationale: यूनानी पाठ अमूर्त ‘याजकपद’ के बजाय याजकों की बात करता है; हिन्दी में यह सटीक और सहज है।
- source_word: Μωϋσῆς ἐλάλησεν
  choice: मूसा ने ... कहा
  rationale: λαλέω का सामान्य अर्थ बोलना या कहना है; इस वाक्य में ‘कहा’ सर्वाधिक स्वाभाविक है।
theological_decisions:
- issue: ‘हमारे प्रभु’ का संदर्भ
  choice: पाठ की उपाधि ‘हमारे प्रभु’ को यथावत रखा गया है; सन्दर्भ में यह यीशु को सूचित करती है।
  alternative: स्पष्टता के लिए ‘हमारे प्रभु यीशु’ जोड़ना।
  rationale: निकटवर्ती सन्दर्भ यीशु के यहूदा-वंशीय उद्गम और गैर-लेवीय याजकत्व की चर्चा करता है, पर मूल पद में नाम नहीं है; इसलिए उसे जोड़ा नहीं गया।
- issue: ἀνατέταλκεν का आशय
  choice: उदय के रूपक के साथ यहूदा से वंशगत उत्पत्ति।
  alternative: ‘जी उठे हैं’, जिसे पुनरुत्थान का संकेत समझा जा सकता है।
  rationale: वाक्य का तर्क गोत्रीय वंश और याजकों के विषय में मूसा की चुप्पी पर आधारित है। इसलिए पुनरुत्थान को मुख्य अर्थ बनाना सन्दर्भ से परे होगा, जबकि रूपक को पूरी तरह सपाट भी नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। ‘याजक’ और ‘गोत्र’ जैसे प्रचलित बाइबलीय पद रखे गए हैं।
