  text: ᾧ καὶ δεκάτην ἀπὸ πάντων ἐμέρισεν Ἀβραάμ, πρῶτον μὲν ἑρμηνευόμενος βασιλεὺς δικαιοσύνης ἔπειτα δὲ καὶ βασιλεὺς Σαλήμ, ὅ ἐστιν βασιλεὺς εἰρήνης,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/007/002.yaml
  text: to whom Abraham also apportioned a tenth of everything[a]. First, his name is translated King of Righteousness, and then also King of Salem, that is[b], King of Peace.
translation:
  language: hi
  text: और अब्राहम ने उसे सब कुछ में से दसवाँ भाग[a] दिया। पहले, उसके नाम का अर्थ “धार्मिकता का राजा”[b] है; और फिर वह शालेम का राजा भी है, अर्थात् “शांति का राजा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दशमांश।” यूनानी में शाब्दिक अर्थ “दसवाँ भाग” है।
    reason: lexical_alternative
  - marker: b
    text: या “न्याय का राजा।” यहाँ प्रयुक्त यूनानी शब्द का अर्थ “धार्मिकता” या “न्याय” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ᾧ
  choice: उसे
  rationale: संबंधवाचक सर्वनाम मलिकिसिदक की ओर संकेत करता है; हिन्दी में पिछले पद से जुड़ते हुए ‘उसे’ स्वाभाविक है।
- source_word: δεκάτην ἀπὸ πάντων
  choice: सब वस्तुओं का दसवाँ भाग
  rationale: यूनानी में शाब्दिक रूप से ‘सबमें से दसवाँ भाग’ है; यह रूप सम्पूर्ण प्राप्ति में से दिए गए अंश को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐμέρισεν
  choice: बाँटकर दिया
  rationale: क्रिया में विभाजित करके हिस्सा निर्धारित करने का भाव है; केवल ‘दिया’ की अपेक्षा यह मूल अर्थ को अधिक सुरक्षित रखता है।
- source_word: ἑρμηνευόμενος
  choice: उसके नाम का अर्थ है
  rationale: यह कृदन्त मलिकिसिदक के नाम की व्याख्या प्रस्तुत करता है; हिन्दी में स्पष्टता के लिए ‘नाम’ को व्यक्त करना स्वाभाविक है।
- source_word: βασιλεὺς δικαιοσύνης
  choice: धार्मिकता का राजा
  rationale: δικαιοσύνη के लिए ‘धार्मिकता’ आधुनिक बाइबलीय हिन्दी में धार्मिक और नैतिक सहीपन का व्यापक भाव रखती है; वैकल्पिक न्याय-संबंधी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: βασιλεὺς Σαλήμ
  choice: शालेम का राजा
  rationale: Σαλήμ स्थान-नाम है, इसलिए इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: ὅ ἐστιν βασιλεὺς εἰρήνης
  choice: अर्थात् “शांति का राजा”
  rationale: ὅ ἐστιν व्याख्यात्मक है और εἰρήνη का स्वाभाविक हिन्दी समतुल्य ‘शांति’ है।
theological_decisions:
- issue: δικαιοσύνη का नाम-व्याख्यात्मक पदवी में अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: मूल शब्द धार्मिक सहीपन और न्याय—दोनों अर्थ धारण कर सकता है। मुख्य पाठ में व्यापक और परंपरागत ‘धार्मिकता’ रखा गया है, जबकि वास्तविक वैकल्पिक अर्थ ‘न्याय’ को पादटिप्पणी में दिया गया है।
