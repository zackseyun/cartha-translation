source:
  edition: SBLGNT
  text: τὸ δὲ Ἔτι ἅπαξ δηλοῖ ⸂τῶν σαλευομένων⸃ μετάθεσιν ὡς πεποιημένων, ἵνα μείνῃ τὰ μὴ σαλευόμενα.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/027.yaml
  text: This phrase, “Yet once more,” indicates the removal of the things being shaken—as things that have been made—so that the things not being shaken may remain.
translation:
  language: hi
  text: “एक बार और” यह कथन हिलाई जा रही वस्तुओं का हटाया जाना प्रकट करता है—बनाई हुई वस्तुओं के रूप में उनका हटाया जाना—ताकि जो वस्तुएँ नहीं हिलाई जा रही हैं[a], वे बनी रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो वस्तुएँ हिलाई नहीं जा सकतीं,” अथवा “जो अटल हैं।” यूनानी में शाब्दिक रूप से “जो वस्तुएँ नहीं हिलाई जा रही हैं” है।
    reason: alternative_reading
lexical_decisions:
- source_word: τὸ δὲ Ἔτι ἅπαξ
  choice: “एक बार और” यह कथन
  rationale: नपुंसकलिंग लेख τὸ उद्धृत पदबंध को संज्ञा का रूप देता है। हिंदी में उद्धरण को पहले रखकर ‘यह कथन’ कहना स्वाभाविक है और लेखक के व्याख्यात्मक संकेत को स्पष्ट रखता है। δέ का हल्का संयोजक बल अलग शब्द के बिना वाक्य-प्रवाह में व्यक्त होता है।
- source_word: δηλοῖ
  choice: इस बात को प्रकट करता है
  rationale: यह उद्धृत शब्दों से निकाले गए अर्थ को सूचित करता है; ‘प्रकट करता है’ आधुनिक, स्पष्ट और गरिमापूर्ण हिंदी है।
- source_word: τῶν σαλευομένων
  choice: जो वस्तुएँ हिलाई जा रही हैं
  rationale: वर्तमान कर्मवाच्य कृदंत की प्रक्रियात्मकता को बनाए रखता है और बाद के नकारात्मक समानांतर पद से मेल खाता है।
- source_word: μετάθεσιν
  choice: हटा दिया जाएगा
  rationale: संदर्भ में आशय केवल परिवर्तन नहीं, बल्कि हिलाई जाने वाली बनाई हुई वस्तुओं के हटाए जाने से है। हिंदी में क्रियात्मक रूप वाक्य को अधिक स्वाभाविक बनाता है।
- source_word: ὡς πεποιημένων
  choice: बनाई हुई वस्तुएँ होने के कारण
  rationale: पूर्ण कर्मवाच्य कृदंत वस्तुओं को बनाई हुई श्रेणी का बताता है। ὡς यहाँ उनके हटाए जाने का आधार या दृष्टि सूचित कर सकता है; यह अनुवाद उस संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἵνα μείνῃ
  choice: ताकि ... बनी रहें
  rationale: ἵνα के उद्देश्य/परिणाम को स्वाभाविक हिंदी में व्यक्त करता है। बहुवचन ‘वस्तुएँ’ के अनुरूप ‘बनी रहें’ रखा गया है।
- source_word: τὰ μὴ σαλευόμενα
  choice: जो वस्तुएँ नहीं हिलाई जा रही हैं
  rationale: यूनानी में असमर्थता का स्पष्ट शब्द नहीं है, बल्कि μή के साथ वर्तमान कर्मवाच्य कृदंत है। इसलिए ‘जो हिल नहीं सकतीं’ कहने के बजाय मूल समानांतरता और अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: τὰ μὴ σαλευόμενα को असमर्थता के रूप में समझाकर अनुवाद करना या कृदंतीय विरोध बनाए रखना
  choice: जो वस्तुएँ नहीं हिलाई जा रही हैं
  alternative: जो वस्तुएँ हिलाई नहीं जा सकतीं / जो अटल हैं
  rationale: मूल पाठ ‘हिलाई जा रही वस्तुओं’ और ‘नहीं हिलाई जा रही वस्तुओं’ का समानांतर विरोध करता है। अगली आयत के ‘न हिलनेवाले राज्य’ के प्रकाश में असमर्थता का भाव संभव है, पर उसे इस आयत में स्पष्ट करके जोड़ना मूल की धार्मिक तनावपूर्ण अस्पष्टता को समय से पहले हल कर देगा।
- issue: ὡς πεποιημένων का संबंध
  choice: बनाई हुई वस्तुएँ होने के कारण
  alternative: मानो वे बनाई हुई वस्तुएँ हों / अर्थात् बनाई हुई वस्तुएँ
  rationale: संदर्भ में बनाई हुई होना हटाई जाने वाली वस्तुओं की विशेषता और आधार बताता है। ‘होने के कारण’ हिंदी में यह संबंध स्पष्ट करता है, जबकि ‘मानो’ अवास्तविकता का अनुचित आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी और सामान्य पाठक के लिए गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘वस्तुएँ’ से सृष्ट वास्तविकताओं का व्यापक संकेत बना रहता है। उद्धृत पदबंध और दोनों समानांतर कृदंतों की संरचना यथासंभव सुरक्षित रखी गई है।
