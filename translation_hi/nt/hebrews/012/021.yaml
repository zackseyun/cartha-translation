base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/021.yaml
  text: And so terrifying was the sight that Moses said[b][a], “I am fearful and trembling.”
translation:
  language: hi
  text: और वह दृश्य इतना भयावह था कि मूसा ने कहा[b][a], “मैं अत्यन्त भयभीत हूँ और काँप रहा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो दिखाई दे रहा था” अथवा “वह प्रकट दृश्य।” यूनानी अभिव्यक्ति सीनै पर दिखाई देने वाले प्रकट रूप की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: ये शब्द पुराने नियम से शब्दशः उद्धरण नहीं हैं, पर सीनै की घटना से जुड़ी मूसा की भयभीत प्रतिक्रिया को व्यक्त करते हैं; व्यवस्थाविवरण 9:19 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: καί
  choice: और
  rationale: पिछले पद में सीनै के वर्णन को आगे बढ़ाने वाला सामान्य संयोजक।
- source_word: οὕτω φοβερὸν ἦν
  choice: इतना भयावह था
  rationale: οὕτω विशेषण की तीव्रता बताता है; यह हिंदी में स्वाभाविक रूप से भय की प्रबलता व्यक्त करता है।
- source_word: τὸ φανταζόμενον
  choice: वह दृश्य
  rationale: यह सीनै पर दिखाई देने वाली अभिव्यक्ति या दृश्य को सूचित करता है; अन्य संभव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: Μωϋσῆς εἶπεν
  choice: मूसा ने कहा
  rationale: नाम और सामान्य कथन-क्रिया का सीधा, प्रचलित हिंदी रूप।
- source_word: Ἔκφοβός εἰμι
  choice: मैं अत्यन्त भयभीत हूँ
  rationale: ἔκφοβος साधारण भय से अधिक तीव्र, अत्यधिक डर की दशा व्यक्त करता है।
- source_word: καὶ ἔντρομος
  choice: और काँप रहा हूँ
  rationale: दूसरे विशेषण को अलग रखकर मूल के भय और काँपने—दोनों भाव सुरक्षित रहते हैं तथा हिंदी स्वाभाविक रहती है।
theological_decisions:
- issue: कथन का सीनै-वृत्तांत से संबंध
  choice: मुख्य पाठ में इसे सीनै के भयावह दृश्य पर मूसा की सीधी प्रतिक्रिया के रूप में प्रस्तुत किया गया है।
  alternative: इसे सीनै से जुड़ी मूसा की भयभीत प्रतिक्रिया का स्वतंत्र सारांश मानना, न कि पुराने नियम का शब्दशः उद्धरण।
  rationale: यूनानी पाठ स्पष्ट रूप से मूसा को यह कहते हुए प्रस्तुत करता है; पुराने नियम में इसके सटीक शब्दगत स्रोत का प्रश्न पादटिप्पणी में रखा गया है, ताकि मुख्य पाठ में न सामंजस्य थोपा जाए, न तनाव मिटाया जाए।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज और गरिमापूर्ण रूप अपनाया गया है। “अत्यन्त भयभीत हूँ और काँप रहा हूँ” मूल के दो अलग विशेषणों की तीव्रता और शारीरिक प्रतिक्रिया दोनों को स्पष्ट रखता है। पादटिप्पणी-चिह्न मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में दिए गए हैं।
