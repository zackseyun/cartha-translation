base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/020.yaml
  text: 'For they could not endure what was being commanded: “If even an animal touches the mountain[a], it will be stoned.”'
translation:
  language: hi
  text: 'क्योंकि वे उस आज्ञा को सहन नहीं कर सके जो दी जा रही थी: “यदि कोई पशु भी उस पहाड़ को छूए, तो उसे पत्थरों से मार डाला जाएगा।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में इसके बाद “या तीर से मारा जाएगा” भी है, जो निर्गमन 19:12–13 की प्रतिध्वनि है।
    reason: textual_variant
lexical_decisions:
- source_word: οὐκ ἔφερον
  choice: वे ... सह नहीं सके
  rationale: नकार के साथ φέρω यहाँ किसी बात को सह पाने के अर्थ में है। यह हिंदी में स्वाभाविक है और सीनै की आज्ञा की कठोरता सह न पाने का भाव बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिंदी में इस संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: τὸ διαστελλόμενον
  choice: उस आज्ञा को ... जो दी जा रही थी
  rationale: यह वर्तमान कर्मवाच्य कृदंत अधिकारपूर्वक दिए जा रहे निर्देश को दर्शाता है। इस रूप में आज्ञा और उसकी जारी प्रक्रिया दोनों व्यक्त होते हैं।
- source_word: Κἂν
  choice: यदि ... भी
  rationale: κἄν शर्त के साथ बलाघात जोड़ता है; ‘यदि ... भी’ बताता है कि पशु तक इस निषेध से बाहर नहीं था।
- source_word: θηρίον
  choice: कोई पशु
  rationale: θηρίον यहाँ सामान्य रूप से पशु को सूचित करता है। ‘पशु’ आधुनिक हिंदी में स्पष्ट है और अनावश्यक रूप से केवल जंगली जानवर का अर्थ नहीं देता।
- source_word: θίγῃ
  choice: छूए
  rationale: शर्तवाचक उपवाक्य में अओरिस्ट सब्जंक्टिव का स्वाभाविक हिंदी रूप ‘छूए’ है।
- source_word: τοῦ ὄρους
  choice: उस पहाड़ को
  rationale: संदर्भ में निश्चित पहाड़ सीनै है, पर यूनानी पाठ नाम नहीं देता; ‘उस पहाड़’ संदर्भगत निश्चितता बनाए रखता है और नाम नहीं जोड़ता।
- source_word: λιθοβοληθήσεται
  choice: उसे पत्थरवाह किया जाएगा
  rationale: यह भविष्यकालीन कर्मवाच्य और दंडात्मक अर्थ दोनों को बनाए रखता है। ‘पत्थरवाह’ बाइबलीय संदर्भ में समझ में आने वाला, संक्षिप्त पद है।
theological_decisions:
- issue: सीनै की आज्ञा के उद्धरण का पाठ
  choice: केवल उपलब्ध SBLGNT पाठ के अनुसार ‘उसे पत्थरवाह किया जाएगा’ रखा गया है।
  alternative: निर्गमन 19:12–13 तथा कुछ पांडुलिपियों के अनुरूप ‘या तीर से बेधा जाएगा’ मुख्य पाठ में जोड़ना।
  rationale: प्रदत्त यूनानी पाठ λιθοβοληθήσεται पर समाप्त होता है। इसलिए अनुपस्थित शब्द मुख्य पाठ में जोड़कर सामंजस्य नहीं किया गया; पाठांतर को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पत्थरवाह’ दंड की विधि को ठीक-ठीक व्यक्त करता है; पाद-टिप्पणी का संकेत मुख्य पाठ में उद्धरण के बाद रखा गया है।
