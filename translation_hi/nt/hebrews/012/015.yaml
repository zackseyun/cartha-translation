language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐπισκοποῦντες μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ, μή τις ῥίζα πικρίας ἄνω φύουσα ἐνοχλῇ καὶ ⸂δι’ αὐτῆς⸃ μιανθῶσιν ⸀πολλοί,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/015.yaml
  text: watching carefully lest anyone fall short of the grace of God[a], lest any root of bitterness springing up cause trouble, and through it many be defiled[b],
translation:
  language: hi
  text: इस बात का ध्यान रखते रहो कि कोई परमेश्वर के अनुग्रह से वंचित न रह जाए[a], और न कोई कड़वाहट की जड़ फूटकर परेशानी उत्पन्न करे और उसके द्वारा बहुत-से लोग अशुद्ध हो जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का अनुग्रह पाने में चूक न जाए।” यूनानी अभिव्यक्ति उपलब्ध वस्तु को प्राप्त न कर पाने के साथ-साथ उससे वंचित रह जाने का अर्थ भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “कड़वाहट की जड़” संभवतः व्यवस्थाविवरण 29:18 की प्रतिध्वनि है, जहाँ विषैली जड़ समुदाय में फैलने वाली वाचा के प्रति बेवफाई का प्रतीक है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπισκοποῦντες
  choice: सावधानी से देखते रहो
  rationale: वर्तमान कृदंत समुदाय में सक्रिय और निरंतर चौकसी का भाव रखता है; यह हिंदी में स्वाभाविक है और अनावश्यक संस्थागत अर्थ से बचता है।
- source_word: μή τις ὑστερῶν ἀπὸ τῆς χάριτος τοῦ θεοῦ
  choice: कोई परमेश्वर के अनुग्रह से वंचित न रह जाए
  rationale: ὑστερέω ἀπό किसी उपलब्ध वस्तु तक न पहुँच पाने या उससे वंचित रह जाने का अर्थ दे सकता है। यह अनुवाद चेतावनी को बनाए रखते हुए उद्धार खोने अथवा अनुग्रह प्राप्त न करने के विवाद को निर्णीत नहीं करता।
- source_word: χάριτος
  choice: अनुग्रह
  rationale: यह χάρις का प्रचलित, गरिमापूर्ण और धर्मवैचारिक प्रतिध्वनि बनाए रखने वाला हिंदी रूप है।
- source_word: ῥίζα πικρίας
  choice: कड़वाहट की जड़
  rationale: यह संबंधकारक पदबंध का निकट अनुवाद है और व्यवस्थाविवरण 29:18 की संभावित प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἄνω φύουσα
  choice: फूटकर
  rationale: यह जड़ के ऊपर उग आने या अंकुरित होने की सजीव छवि को संक्षेप और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἐνοχλῇ
  choice: परेशानी उत्पन्न करे
  rationale: क्रिया का अर्थ परेशान करना या उपद्रव खड़ा करना है; चुना हुआ रूप समुदाय पर पड़ने वाले विघटनकारी प्रभाव को स्पष्ट करता है।
- source_word: δι’ αὐτῆς
  choice: उसके द्वारा
  rationale: स्त्रीलिंग सर्वनाम का सबसे स्वाभाविक संबंध ‘जड़’ से है और διά का साधनवाचक भाव बना रहता है।
- source_word: μιανθῶσιν πολλοί
  choice: बहुत-से लोग अशुद्ध हो जाएँ
  rationale: μιαίνω नैतिक या धार्मिक अशुद्धि का प्रबल भाव रखता है; ‘अशुद्ध’ इस बाइबलीय गंभीरता को केवल सामाजिक परेशानी तक सीमित नहीं करता।
theological_decisions:
- issue: क्या ‘परमेश्वर के अनुग्रह से वंचित’ होना उद्धार खोने, अनुग्रह प्राप्त न करने, या सामुदायिक बहिष्कार को निश्चित करता है
  choice: परमेश्वर के अनुग्रह से वंचित न रह जाए
  alternative: परमेश्वर का अनुग्रह पाने में चूक न जाए; परमेश्वर के अनुग्रह से पीछे न रह जाए
  rationale: यूनानी अभिव्यक्ति लक्ष्य तक न पहुँचने और प्रस्तुत वस्तु को प्राप्त न करने—दोनों की ओर संकेत कर सकती है। पाठ बाद की मत-संबंधी बहस का स्पष्ट निर्णय नहीं देता, इसलिए अनुवाद तनाव को खुला रखता है।
- issue: क्या μιαίνω को केवल सामाजिक नुकसान के रूप में हल्का किया जाए
  choice: अशुद्ध हो जाएँ
  alternative: दूषित हो जाएँ; भ्रष्ट हो जाएँ
  rationale: क्रिया में नैतिक और धार्मिक अशुद्धि की शक्ति है; ‘अशुद्ध’ मूल पाठ की गंभीरता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी; शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध है। सामुदायिक चेतावनी के कारण बहुवचन आज्ञार्थ ‘देखते रहो’ रखा गया है। ‘अनुग्रह’ और ‘अशुद्ध’ जैसे स्थापित बाइबलीय शब्द मूल के धर्मवैचारिक और नैतिक भार को बनाए रखते हैं।
