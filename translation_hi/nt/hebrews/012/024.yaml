id: HEB.12.24
reference: Hebrews 12:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ διαθήκης νέας μεσίτῃ Ἰησοῦ, καὶ αἵματι ῥαντισμοῦ κρεῖττον λαλοῦντι παρὰ τὸν Ἅβελ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/024.yaml
  text: and to Jesus[a], the mediator of a new covenant[b], and to the sprinkled blood that speaks better than Abel.
translation:
  language: hi
  text: और नई वाचा के मध्यस्थ यीशु के पास, और छिड़काव के उस लहू के पास, जो हाबिल से बेहतर बात कहता है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाबिल के लहू से बेहतर।” यूनानी में केवल “हाबिल से” है; सम्भवतः यह भूमि से पुकारते हाबिल के लहू की ओर संकेत है (उत्पत्ति 4:10)।
    reason: alternative_reading
  - marker: b
    text: “छिड़काव का लहू” बलिदान के उस लहू को दर्शाता है जिसे छिड़का जाता था; यह वाचा की पुष्टि और शुद्धिकरण की छवियों को स्मरण कराता है।
    reason: cultural_note
lexical_decisions:
- source_word: διαθήκης νέας
  choice: नई वाचा
  rationale: इब्रानियों में διαθήκη का अर्थ बाइबिल की वाचा-संबंधी पृष्ठभूमि में है। हिन्दी में ‘वाचा’ इस धार्मिक और संबंधपरक अर्थ को स्वाभाविक रूप से व्यक्त करता है। यूनानी में पदबंध अनिश्चित है, पर हिन्दी में बिना परिमाणवाचक शब्द के ‘नई वाचा’ वही अर्थ सहजता से रखता है।
- source_word: μεσίτῃ
  choice: मध्यस्थ
  rationale: ‘मध्यस्थ’ दो पक्षों के बीच वाचा-संबंध स्थापित कराने वाले व्यक्ति का विधिक और धर्मवैचारिक बल सुरक्षित रखता है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी रूप।
- source_word: αἵματι ῥαντισμοῦ
  choice: छिड़काव का वह लहू
  rationale: यह पदबंध अनुष्ठान में छिड़के जाने वाले लहू को दर्शाता है। ‘छिड़काव का लहू’ स्रोत की संज्ञात्मक रचना और बलिदान-वाचा की छवि को बनाए रखता है; ‘वह’ पूर्वप्रसंग में वर्णित विशिष्ट वास्तविकता को स्वाभाविक हिन्दी में संकेत करता है।
- source_word: κρεῖττον
  choice: बेहतर
  rationale: ‘बेहतर’ इब्रानियों में बार-बार आने वाली तुलनात्मक भाषा का सरल और सटीक आधुनिक हिन्दी रूप है।
- source_word: λαλοῦντι
  choice: जो ... बात कहता है
  rationale: वर्तमान कृदंत लहू को मानवीकृत ढंग से बोलते हुए दिखाता है। सम्बन्धवाचक उपवाक्य आधुनिक हिन्दी में स्वाभाविक है और निरंतर बोलने का भाव रखता है।
- source_word: παρὰ τὸν Ἅβελ
  choice: हाबिल से
  rationale: यूनानी पाठ स्पष्ट रूप से ‘हाबिल से’ कहता है, ‘हाबिल के लहू से’ नहीं। संक्षिप्त तुलना को मुख्य पाठ में सुरक्षित रखने से वास्तविक अस्पष्टता बनी रहती है।
theological_decisions:
- issue: हाबिल के साथ तुलना का आशय
  choice: मुख्य पाठ में यूनानी की संक्षिप्त अभिव्यक्ति ‘हाबिल से बेहतर’ रखी गई है।
  alternative: ‘हाबिल के लहू से बेहतर’ या ‘हाबिल के लहू की पुकार से बेहतर बात’
  rationale: सन्दर्भ उत्पत्ति 4:10 में भूमि से पुकारते हाबिल के लहू की ओर प्रबल संकेत करता है, किन्तु यूनानी यहाँ सीधे हाबिल का नाम लेता है। विस्तार न करने से धर्मवैचारिक तनाव और वाक्यगत संक्षिप्तता दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। पद पिछले वाक्य की सूची जारी रखता है, इसलिए आरम्भ में ‘और’ तथा ‘के पास’ की समानान्तर रचना रखी गई है। ‘लहू’ बाइबिलीय बलिदान-सन्दर्भ में प्रचलित और गरिमापूर्ण है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
