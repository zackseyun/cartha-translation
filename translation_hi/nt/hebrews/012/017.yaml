source:
  edition: SBLGNT
  text: ἴστε γὰρ ὅτι καὶ μετέπειτα θέλων κληρονομῆσαι τὴν εὐλογίαν ἀπεδοκιμάσθη, μετανοίας γὰρ τόπον οὐχ εὗρεν, καίπερ μετὰ δακρύων ἐκζητήσας αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/017.yaml
  text: For you know that afterward[a], when he wanted to inherit the blessing, he was rejected, for he found no opportunity for repentance[b], though he sought it with tears.
translation:
  language: hi
  text: क्योंकि तुम जानते हो कि बाद में भी, जब वह आशीष को विरासत में पाना चाहता था, तो उसे अस्वीकार कर दिया गया, क्योंकि उसे पश्चाताप के लिए कोई अवसर नहीं मिला[a], हालाँकि उसने आँसू बहाते हुए उसकी खोज की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे पश्चाताप के लिए कोई स्थान नहीं मिला।” इसका अर्थ यह हो सकता है कि परिणाम को पलटने का कोई अवसर नहीं रहा, या कि वह इसहाक का मन नहीं बदलवा सका।
    reason: alternative_reading
  - marker: b
    text: “उसकी” का संकेत “आशीष” या “पश्चाताप” की ओर हो सकता है; यूनानी वाक्य इसका संदर्भ स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἴστε
  choice: तुम जानते हो
  rationale: οἶδα का पूर्ण रूप यहाँ वर्तमान अर्थ देता है और पाठकों के पहले से ज्ञात प्रसंग की ओर संकेत करता है।
- source_word: μετέπειτα
  choice: बाद में
  rationale: यह बाद के समय को बताने वाला स्वाभाविक और संक्षिप्त हिन्दी प्रयोग है।
- source_word: θέλων
  choice: जब वह ... चाहता था
  rationale: कृदन्त को सहज हिन्दी में कालवाचक उपवाक्य के रूप में व्यक्त किया गया है।
- source_word: κληρονομῆσαι τὴν εὐλογίαν
  choice: आशीष को विरासत में पाना
  rationale: κληρονομέω के विरासत-संबंधी अर्थ और एसाव के प्रसंग की पैतृक आशीष—दोनों को बनाए रखता है।
- source_word: ἀπεδοκιμάσθη
  choice: उसे अस्वीकार कर दिया गया
  rationale: निष्क्रिय क्रिया के अस्वीकृत किए जाने के अर्थ को बिना किसी विशेष उद्धारशास्त्रीय निष्कर्ष के व्यक्त करता है।
- source_word: μετανοίας ... τόπον
  choice: मन बदलने की कोई गुंजाइश
  rationale: ‘स्थान पाना’ मुहावरे का आशय अवसर या गुंजाइश है। ‘मन बदलना’ पश्चात्ताप, परिणाम पलटने और इसहाक के निर्णय बदलने से जुड़ी व्याख्यात्मक संभावनाओं को खुला रखता है।
- source_word: καίπερ μετὰ δακρύων
  choice: हालाँकि ... आँसू बहाते हुए
  rationale: रियायती संबंध और आँसुओं के साथ किए गए प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκζητήσας αὐτήν
  choice: उसे पाने की कोशिश की
  rationale: ‘उसे’ यूनानी स्त्रीलिंग सर्वनाम के संदर्भ को खुला रखता है; वह आशीष अथवा मन-परिवर्तन की गुंजाइश की ओर संकेत कर सकता है। ‘कोशिश की’ खोजने/पाने के गंभीर प्रयास को सहज हिन्दी में देता है।
theological_decisions:
- issue: μετανοίας का अर्थ और मन किसका बदलना है
  choice: मुख्य पाठ में ‘मन बदलने की कोई गुंजाइश’ रखा गया है।
  alternative: ‘पश्चात्ताप का कोई अवसर’ या ‘इसहाक का मन बदलवाने का कोई अवसर’
  rationale: यूनानी μετανοία सामान्यतः पश्चात्ताप या मन-परिवर्तन है, पर प्रसंग में इसका संबंध एसाव द्वारा परिणाम पलटने या इसहाक का निर्णय बदलवाने से भी समझा जा सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता।
- issue: αὐτήν (‘उसे’) का संदर्भ
  choice: सर्वनाम ‘उसे’ द्वारा अस्पष्टता बनाए रखी गई है।
  alternative: स्पष्ट रूप से ‘आशीष’ या ‘मन बदलने की गुंजाइश’ कहना
  rationale: यूनानी में ‘आशीष’ और ‘मन-परिवर्तन’ दोनों स्त्रीलिंग निकटवर्ती संज्ञाएँ हैं; अतः सर्वनाम का संदर्भ व्याकरण से निर्णायक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘आशीष’, ‘विरासत’, ‘अस्वीकार’ और ‘गुंजाइश’ परिचित मानक हिन्दी शब्द हैं। वाक्य की गंभीर चेतावनीपूर्ण ध्वनि तथा मूल की संदर्भगत अस्पष्टता दोनों सुरक्षित हैं।
