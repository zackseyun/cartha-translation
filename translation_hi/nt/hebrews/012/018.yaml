source:
  edition: SBLGNT
  text: Οὐ γὰρ προσεληλύθατε ⸀ψηλαφωμένῳ καὶ κεκαυμένῳ πυρὶ καὶ γνόφῳ καὶ ⸀ζόφῳ καὶ θυέλλῃ
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/018.yaml
  text: For you have not come to what can be touched[a], and to a blazing fire, and to darkness and gloom and storm[b],
translation:
  language: hi
  text: क्योंकि तुम न तो ऐसी वस्तु के पास आए हो जिसे छुआ जा सकता है[a], न धधकती आग के पास, न घने अंधकार, घोर अँधेरे और आँधी के पास।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पहाड़ के पास जिसे छुआ जा सकता है।” आसपास के प्रसंग से सीनै पर्वत अभिप्रेत है, पर इस पद के यूनानी पाठ में “पहाड़” शब्द स्पष्ट रूप से नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है। Οὐ क्रिया का निषेध करता है।
- source_word: προσεληλύθατε
  choice: तुम ... के पास नहीं आए
  rationale: पूर्णकाल किसी के निकट आने से उत्पन्न वर्तमान स्थिति को व्यक्त करता है। ‘के पास आए’ हिन्दी में स्वाभाविक है और निकट पहुँचने के भाव को सुरक्षित रखता है।
- source_word: ψηλαφωμένῳ
  choice: ऐसी वस्तु ... जिसे छुआ जा सके
  rationale: यह कृदंत स्पर्शनीय अथवा छुई जा सकने वाली वास्तविकता बताता है। यूनानी पद में ‘पहाड़’ संज्ञा स्पष्ट रूप से नहीं है, इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया।
- source_word: κεκαυμένῳ πυρί
  choice: धधकती आग
  rationale: पूर्ण कृदंत आग के जलती हुई अवस्था में होने को दर्शाता है। ‘धधकती आग’ स्पष्ट, सजीव और स्वाभाविक आधुनिक हिन्दी है।
- source_word: γνόφῳ
  choice: घना अंधकार
  rationale: γνόφος विशेष रूप से सघन अंधकार का बोध देता है। ‘घना अंधकार’ अगले समानार्थी शब्द से कुछ भेद बनाए रखता है।
- source_word: ζόφῳ
  choice: घोर अँधेरा
  rationale: ζόφος गहरे, भयावह अथवा धुँधले अँधेरे का बोध देता है। ‘घोर अँधेरा’ γνόφος के साथ अर्थगत संचय को बनाए रखते हुए शब्दों में भेद करता है।
- source_word: θυέλλῃ
  choice: आँधी
  rationale: θύελλα प्रचंड तूफानी हवा अथवा झंझा को दर्शाता है। ‘आँधी’ साधारण आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: क्या निकट आने की वस्तु के रूप में ‘पहाड़’ जोड़ा जाए
  choice: मुख्य पाठ में ‘पहाड़’ न जोड़कर अनिर्दिष्ट स्पर्शनीय वस्तु का उल्लेख किया गया है।
  alternative: ‘उस पहाड़ के पास जिसे छुआ जा सके’
  rationale: व्यापक प्रसंग में सीनै पर्वत अभिप्रेत है, पर इस पद के यूनानी पाठ में ὄρος (‘पहाड़’) उपस्थित नहीं है। इसलिए मुख्य पाठ मूल की अनिर्दिष्ट अभिव्यक्ति बनाए रखता है और प्रासंगिक पहचान पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘घना अंधकार’ और ‘घोर अँधेरा’ समानार्थी यूनानी पदों के अलंकारिक संचय को बनाए रखते हैं। सूची में ‘और न’ हिन्दी में आरंभिक निषेध का विस्तार स्पष्ट करता है, जबकि पादटिप्पणी अधिक औपचारिक संयोजक संरचना देती है।
