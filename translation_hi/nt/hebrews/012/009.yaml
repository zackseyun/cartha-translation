source:
  edition: SBLGNT
  text: εἶτα τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας εἴχομεν παιδευτὰς καὶ ἐνετρεπόμεθα· οὐ ⸀πολὺ μᾶλλον ὑποταγησόμεθα τῷ πατρὶ τῶν πνευμάτων καὶ ζήσομεν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/009.yaml
  text: Furthermore[a], we had our earthly fathers as disciplinarians, and we respected them[c][b]. Shall we not much more submit to the Father of spirits and live?
translation:
  language: hi
  text: फिर, हमारे शरीर के पिता हमारे अनुशासक थे, और हम उनका आदर करते थे। तो क्या हम आत्माओं के पिता के और भी अधिक अधीन न होंगे और जीवित न रहेंगे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶτα
  choice: फिर
  rationale: यह पिछले विचार में एक और तर्क जोड़ता है; हिन्दी में ‘फिर’ इस तर्कगत प्रगति को सहज रूप से व्यक्त करता है।
- source_word: τοὺς μὲν τῆς σαρκὸς ἡμῶν πατέρας
  choice: हमारे शरीर के पिता
  rationale: यह मूल के ‘हमारी देह/शरीर के पिता’ को निकटता से रखता है और ‘आत्माओं के पिता’ के साथ जानबूझकर किए गए विरोध को सुरक्षित रखता है।
- source_word: παιδευτὰς
  choice: हमें अनुशासित करते थे
  rationale: ग्रीक संज्ञा का अर्थ अनुशासन या प्रशिक्षण देने वाले व्यक्ति हैं। हिन्दी में क्रियात्मक रूप अधिक स्वाभाविक है और अध्याय में चल रहे अनुशासन के विषय को बनाए रखता है।
- source_word: ἐνετρεπόμεθα
  choice: हम उनका आदर करते थे
  rationale: संदर्भ में यह माता-पिता के अनुशासन के प्रति सम्मानपूर्ण व्यवहार को दर्शाता है; ‘आदर करते थे’ स्पष्ट और स्वाभाविक है।
- source_word: οὐ πολὺ μᾶλλον
  choice: तो क्या हमें ... और भी अधिक ... नहीं
  rationale: यह ग्रीक के न्यून से अधिक की ओर जाने वाले बलयुक्त आलंकारिक प्रश्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑποταγησόμεθα
  choice: अधीन होकर
  rationale: यह परमेश्वर के अधिकार को स्वीकार कर उसके अधीन होने का भाव रखता है और भविष्यकालीन आलंकारिक प्रश्न के भीतर सहज बैठता है।
- source_word: τῷ πατρὶ τῶν πνευμάτων
  choice: आत्माओं के पिता
  rationale: यह बहुवचन और संबंधकारक रचना को बनाए रखता है तथा उसे केवल ‘हमारी आत्माओं’ तक सीमित नहीं करता।
- source_word: ζήσομεν
  choice: जीवित नहीं रहना चाहिए
  rationale: ‘अधीन होने’ के फलस्वरूप जीवन का भाव स्पष्ट करता है और हिन्दी के आलंकारिक प्रश्न में स्वाभाविक है।
theological_decisions:
- issue: ‘आत्माओं के पिता’ का अर्थ
  choice: मुख्य पाठ में व्यापक पदवी ‘आत्माओं के पिता’ को बनाए रखा गया है।
  alternative: विशेष रूप से ‘हमारी आत्माओं के पिता’ या सामान्यतः ‘आत्मिक प्राणियों के पिता’।
  rationale: ग्रीक में ‘हमारी’ नहीं है। निकट संदर्भ मानवीय पिताओं और परमेश्वर के बीच विरोध दिखाता है, पर वाक्यांश की सीमा स्पष्ट नहीं करता; इसलिए अस्पष्टता को न सुलझाकर सुरक्षित रखा गया है।
- issue: σάρξ और πνεύματα के बीच विरोध
  choice: ‘शरीर के पिता’ और ‘आत्माओं के पिता’।
  alternative: ‘सांसारिक पिता’ और ‘आत्माओं के पिता’।
  rationale: अधिक औपचारिक रचना मूल के शरीर–आत्मा विरोध को स्पष्ट रखती है और σάρξ में ‘पापी स्वभाव’ का अर्थ नहीं भरती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘शरीर के पिता’ थोड़ा औपचारिक है, पर यह मूल के निर्णायक शरीर–आत्मा विरोध और उसकी अस्पष्टता को ‘सांसारिक पिता’ से अधिक निकटता से सुरक्षित रखता है।
