  text: μή τις πόρνος ἢ βέβηλος ὡς Ἠσαῦ, ὃς ἀντὶ βρώσεως μιᾶς ἀπέδετο τὰ πρωτοτόκια ⸀ἑαυτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/016.yaml
  text: that no one be sexually immoral or godless like Esau, who sold his own birthright for a single meal.
translation:
  language: hi
  text: ऐसा न हो कि कोई यौन-अनैतिक व्यक्ति या अधार्मिक हो, जैसा एसाव था, जिसने एक ही भोजन के बदले अपना ज्येष्ठाधिकार बेच दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πόρνος
  choice: यौन-अनैतिक
  rationale: यह शब्द अवैध या अनैतिक यौन आचरण करने वाले व्यक्ति को दर्शाता है; ‘व्यभिचारी’ से अधिक व्यापक और आधुनिक हिंदी में स्पष्ट है।
- source_word: βέβηλος
  choice: परमेश्वर का अनादर करने वाला
  rationale: मूल शब्द पवित्र बातों को साधारण या तुच्छ समझने वाले, धर्मविहीन रवैये का बोध कराता है। यह अनुवाद केवल अनुष्ठानिक ‘अपवित्रता’ के बजाय एसाव के परमेश्वर-विरोधी मूल्यांकन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀντὶ βρώσεως μιᾶς
  choice: एक बार के भोजन के बदले
  rationale: मुहावरे का आशय भोजन की केवल एक बारी या एक खुराक है; यह तात्कालिक भोजन और स्थायी अधिकार के बीच विरोध को बनाए रखता है।
- source_word: τὰ πρωτοτόκια ἑαυτοῦ
  choice: पहलौठे होने का अपना अधिकार
  rationale: बहुवचन रूप यहाँ ज्येष्ठ पुत्र को मिलने वाले जन्मसिद्ध अधिकार और विशेषाधिकारों के समष्टिगत अर्थ में है।
theological_decisions:
- issue: βέβηλος का धार्मिक-नैतिक अर्थ
  choice: परमेश्वर का अनादर करने वाला
  alternative: अपवित्र / धर्मविहीन
  rationale: ‘अपवित्र’ हिंदी में नैतिक अशुद्धता या अनुष्ठानिक अपवित्रता तक सीमित समझा जा सकता है, जबकि प्रसंग में एसाव का पवित्र जन्मसिद्ध अधिकार को तुच्छ मानना प्रमुख है। चुना हुआ वाक्यांश किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़े बिना उस भाव को स्पष्ट करता है।
- issue: ὡς Ἠσαῦ का संबंध
  choice: ‘जैसा एसाव था’ को दोनों पूर्ववर्ती विशेषणों के बाद रखा गया
  alternative: इसे केवल ‘परमेश्वर का अनादर करने वाला’ से जोड़ना
  rationale: यूनानी रचना में यह कुछ हद तक अस्पष्ट है कि एसाव से तुलना केवल βέβηλος के संबंध में है या पूरे संयुक्त वर्णन के संबंध में। हिंदी में वाक्य को खुला रखा गया है और इस तनाव को किसी संकीर्ण व्याख्या से हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरंभ का ‘ऐसा न हो कि’ μή τις की निषेधात्मक और पिछले वाक्य पर निर्भर संरचना को स्वाभाविक हिंदी में बनाए रखता है।
