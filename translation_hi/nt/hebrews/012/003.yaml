source:
  edition: SBLGNT
  text: Ἀναλογίσασθε γὰρ τὸν τοιαύτην ὑπομεμενηκότα ὑπὸ τῶν ἁμαρτωλῶν εἰς ⸀ἑαυτοὺς ἀντιλογίαν, ἵνα μὴ κάμητε ταῖς ψυχαῖς ὑμῶν ἐκλυόμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/003.yaml
  text: For consider the one who endured such opposition from sinners against himself[a], so that you may not grow weary[b], becoming discouraged in your souls.
translation:
  language: hi
  text: इसलिए उस पर ध्यान से विचार करो, जिसने पापियों की ओर से अपने ही विरुद्ध[a] ऐसा विरोध सहा, ताकि तुम थककर अपने मन में हिम्मत न हारो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में ‘उसके विरुद्ध’ है; SBLGNT के पाठ में ‘अपने ही विरुद्ध’ (अर्थात पापियों के अपने विरुद्ध) है। सन्दर्भ में विरोध यीशु की ओर निर्देशित है।
    reason: textual_variant
  - marker: b
    text: या, “तुम थक न जाओ और अपने मन में शिथिल न पड़ो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀναλογίσασθε
  choice: ध्यान से विचार करो
  rationale: यह आज्ञार्थक क्रिया सोच-विचार करके मन लगाने का आह्वान करती है; यह अभिव्यक्ति उसके विचारपूर्ण और exhortative बल को स्वाभाविक हिन्दी में रखती है।
- source_word: τοιαύτην
  choice: ऐसा
  rationale: यह विरोध के प्रकार या तीव्रता की ओर संकेत करता है, पर उसे आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: ὑπομεμενηκότα
  choice: सहा
  rationale: पूर्णकालिक कृदन्त उस सहनशीलता को सामने रखता है जो पूरी हुई और जिसका महत्व बना हुआ है; ‘सहा’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: यह substantival adjective उन लोगों को दर्शाता है जिनकी पहचान पापी होने से की गई है; ‘पापियों’ नैतिक विरोध को बनाए रखता है।
- source_word: ἀντιλογίαν
  choice: विरोध
  rationale: सन्दर्भ में यह शब्द प्रतिवाद, विरोध या शत्रुतापूर्ण प्रतिरोध का व्यापक भाव रखता है; ‘विरोध’ इन अर्थों को बिना अधिक व्याख्या के समेटता है।
- source_word: κάμητε
  choice: थककर
  rationale: क्रिया थक जाने या शिथिल पड़ने को व्यक्त करती है; अगले कृदन्त के साथ ‘थककर ... हिम्मत न हारो’ स्वाभाविक हिन्दी बनती है।
- source_word: ταῖς ψυχαῖς ὑμῶν
  choice: अपने मन में
  rationale: ψυχή यहाँ भीतरी जीवन या आत्मगत व्यक्तित्व को सूचित करता है। आधुनिक हिन्दी में ‘अपने मन में’ अर्थ को स्पष्ट रखता है और अप्राकृतिक ‘अपनी आत्माओं में’ से बचता है।
- source_word: ἐκλυόμενοι
  choice: हिम्मत न हारो
  rationale: यह कृदन्त भीतर से ढीले पड़ने, निरुत्साहित होने या हार मानने का भाव देता है; निषेध के साथ ‘हिम्मत न हारो’ वर्तमान हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: ‘उस’ का अभिप्रेत व्यक्ति
  choice: व्यक्ति को सर्वनाम से व्यक्त किया गया है; निकटवर्ती सन्दर्भ से वह यीशु है।
  alternative: पद में स्पष्ट रूप से ‘यीशु’ जोड़ना।
  rationale: इब्रानियों 12:2 यीशु को सामने रखता है, पर इस पद का यूनानी पाठ नाम को दोहराता नहीं; सर्वनाम स्रोत की अभिव्यक्ति को सुरक्षित रखता है।
- issue: εἰς ἑαυτούς का पाठ और विरोध की दिशा
  choice: मुख्य पाठ में सन्दर्भगत अर्थ ‘अपने ही विरुद्ध’ रखा गया है और पाठांतर को पादटिप्पणी में बताया गया है।
  alternative: SBLGNT के बहुवचन रूप का शाब्दिक अनुवाद ‘अपने ही विरुद्ध’ अर्थात पापियों के अपने विरुद्ध करना।
  rationale: SBLGNT में बहुवचन ἑαυτούς है, जबकि एक प्रसिद्ध पाठांतर एकवचन ἑαυτόν पढ़ता है। सन्दर्भ में विरोध यीशु की ओर निर्देशित है; पादटिप्पणी वास्तविक पाठगत तनाव को छिपने नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी, मध्यम औपचारिक और गरिमापूर्ण शैली। ‘ध्यान से विचार करो’ सामूहिक बहुवचन आज्ञा को स्वाभाविक रूप में देता है। ‘अपने मन में’ साधारण पाठक के लिए ψυχή के भीतरी-जीवन वाले भाव को स्पष्ट करता है।
