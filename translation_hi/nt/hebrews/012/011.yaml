theological_decisions:
- issue: परमेश्वर के कार्य के सन्दर्भ में παιδεία का अर्थ
  choice: सुधार और प्रशिक्षण को समेटने वाला रचनात्मक अनुशासन
  alternative: केवल दण्ड; अथवा केवल शिक्षा
  rationale: इब्रानियों 12:5–10 इसे सन्तानों के प्रति पिता के व्यवहार के रूप में रखता है, जिसका लक्ष्य पवित्रता और परिपक्वता है। ‘अनुशासन’ प्रेमपूर्ण सुधार और कठिन अनुभव—दोनों के तनाव को बनाए रखता है।
- issue: δικαιοσύνης का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस पद में अनुशासन से उत्पन्न नैतिक और आत्मिक सीधाई प्रमुख है; फिर भी यूनानी शब्द में ‘न्याय’ का अर्थ सम्भव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
