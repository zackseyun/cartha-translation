base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/011.yaml
  text: All discipline seems for the present to be not joy but sorrow[a]; yet later it yields the peaceful fruit of righteousness to those who have been trained by it.
translation:
  language: hi
  text: हर प्रकार का अनुशासन उस समय आनन्ददायक नहीं, बल्कि दुःखदायी प्रतीत होता है; परन्तु बाद में, जो उसके द्वारा प्रशिक्षित हुए हैं, उन्हें वह धार्मिकता[a] का शान्तिपूर्ण फल देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्याय।” यूनानी शब्द का अर्थ धार्मिकता या न्याय हो सकता है; यहाँ सम्भवतः परमेश्वर के अनुशासन से उत्पन्न सीधा और उचित जीवन अभिप्रेत है।
    reason: lexical_alternative
