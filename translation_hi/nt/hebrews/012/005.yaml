  source_fidelity: Draft correctly reflects the perfect-force rebuke ('भूल गए हो'), the direct filial address, the prohibitions against treating the Lord’s παιδεία lightly and losing heart under his reproof. ‘अनुशासन’ adequately preserves the formative as well as corrective range of παιδεία, and ‘डाँटे’ is a suitable modern rendering of ἐλεγχόμενος in this context.
  naturalness: The phrase ‘जो तुमसे पुत्रों के समान बात करता है’ is not idiomatic Hindi for ‘which addresses you as sons’; it can suggest that the exhortation speaks in the manner of sons. Recasting it as ‘जो तुम्हें पुत्रों के रूप में संबोधित करता है’ clearly conveys the Greek relationship and is natural modern standard Hindi.
  terminology: ‘प्रभु,’ ‘अनुशासन,’ ‘पुत्रों,’ and ‘मेरे पुत्र’ retain the source’s key terms and register without importing an interpretive doctrinal conclusion. The lexical and cross-reference notes remain accurate, and their anchors are retained.
