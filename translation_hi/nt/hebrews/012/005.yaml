id: HEB.12.5
reference: Hebrews 12:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐκλέλησθε τῆς παρακλήσεως, ἥτις ὑμῖν ὡς υἱοῖς διαλέγεται, Υἱέ μου, μὴ ὀλιγώρει παιδείας κυρίου, μηδὲ ἐκλύου ὑπ’ αὐτοῦ ἐλεγχόμενος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/005.yaml
  text: 'And you have forgotten the exhortation that addresses you as sons: “My son[a], do not regard lightly the Lord’s discipline[c][b], nor lose heart when you are reproved by him.”'
translation:
  language: hi
  text: 'और तुम उस उपदेश को भूल गए हो, जो तुम्हें पुत्रों के रूप में संबोधित करता है: “मेरे पुत्र[a], प्रभु के अनुशासन[b][c] को तुच्छ न समझना, और जब वह तुम्हें डाँटे, तो हिम्मत न हारना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी सन्तान।” यूनानी में “पुत्र” है; यह नीतिवचन की शब्दावली और इस प्रसंग की प्रतिनिधिक पुत्रत्व-भाषा को प्रतिध्वनित करता है।
    reason: lexical_alternative
  - marker: b
    text: “अनुशासन” का अर्थ केवल दंड नहीं, बल्कि “प्रशिक्षण,” “शिक्षा” या “सुधार” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: नीतिवचन 3:11 का उद्धरण/संकेत।
    reason: cross_reference
lexical_decisions:
- source_word: ἐκλέλησθε
  choice: तुम भूल गए हो
  rationale: पूर्णकाल उस वर्तमान दशा को व्यक्त करता है जो भूल जाने के फलस्वरूप बनी हुई है; यह हिंदी में स्वाभाविक और भर्त्सनापूर्ण बल वाला है।
- source_word: παρακλήσεως
  choice: उस उपदेश
  rationale: यहाँ παράκλησις में प्रोत्साहन और चेतावनी दोनों की छाया है; नीतिवचन के निर्देशात्मक उद्धरण के संदर्भ में ‘उपदेश’ उपयुक्त है।
- source_word: ἥτις ... διαλέγεται
  choice: जो तुमसे ... बात करता है
  rationale: यह पवित्रशास्त्र के पाठक को सीधे संबोधित करने का भाव रखता है और यूनानी वाक्य की सजीवता बनाए रखता है।
- source_word: ὡς υἱοῖς
  choice: पुत्रों के समान
  rationale: मूल में स्पष्ट पुत्र-संबंधी भाषा है, जो नीतिवचन के उद्धरण और इब्रानियों में पुत्रत्व के प्रसंग से जुड़ी है।
- source_word: Υἱέ μου
  choice: मेरे पुत्र
  rationale: एकवचन संबोधन नीतिवचन 3:11 की शब्दावली और पिता-पुत्र संबंध को सुरक्षित रखता है।
- source_word: ὀλιγώρει
  choice: तुच्छ न समझना
  rationale: क्रिया का अर्थ किसी वस्तु को कम महत्त्व देना या नगण्य मानना है; यह हिंदी में स्पष्ट और सहज है।
- source_word: παιδείας
  choice: अनुशासन
  rationale: शब्द में प्रशिक्षण, शिक्षा और सुधारात्मक अनुशासन का व्यापक भाव है; ‘अनुशासन’ तत्काल प्रसंग के साथ-साथ इस व्यापकता को भी सम्भव रखता है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: संबंधकारक रूप को स्वाभाविक हिंदी में रखा गया है और κύριος का परंपरागत अर्थ सुरक्षित है।
- source_word: ἐκλύου
  choice: हिम्मत न हारना
  rationale: यह सुधार के अधीन भीतर से शिथिल या निरुत्साहित हो जाने के विरुद्ध चेतावनी देता है।
- source_word: ἐλεγχόμενος
  choice: जब वह तुम्हें डाँटे
  rationale: ἐλέγχω यहाँ दोष दिखाने और सुधारने के उद्देश्य से डाँटने का भाव देता है; यह सामान्य आधुनिक हिंदी में स्पष्ट है।
theological_decisions:
- issue: उपदेश में पुत्र-संबंधी लिंगवाचक भाषा
  choice: मुख्य पाठ में ‘पुत्रों’ और ‘मेरे पुत्र’
  alternative: ‘सन्तानों’ और ‘मेरी सन्तान’
  rationale: यूनानी पाठ और नीतिवचन का उद्धरण जानबूझकर पुत्र की भाषा रखते हैं; इसे बनाए रखने से इस खंड के पुत्रत्व-विषयक तर्क का संबंध स्पष्ट रहता है, जबकि पादटिप्पणी प्रतिनिधिक प्रयोग समझाती है।
- issue: परमेश्वर और मनुष्य के संबंध में παιδεία का अर्थ
  choice: अनुशासन
  alternative: प्रशिक्षण / शिक्षा / सुधार
  rationale: शब्द में निर्माणकारी प्रशिक्षण और सुधारात्मक दंड, दोनों आयाम हो सकते हैं। ‘अनुशासन’ इस तनाव को किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सीधे संबोधन वाली शैली अपनाई गई है। उद्धरण में एकवचन ‘तुम’ मूल संबोधन की व्यक्तिगत तीव्रता रखता है; बाहरी वाक्य में बहुवचन श्रोता ‘तुम’ हिंदी में उसी रूप से व्यक्त होते हैं।
