id: HEB.12.29
reference: Hebrews 12:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γὰρ ὁ θεὸς ἡμῶν πῦρ καταναλίσκον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/029.yaml
  text: For our God is a consuming fire[a][b].
translation:
  language: hi
  text: क्योंकि हमारा परमेश्वर भस्म करनेवाली आग है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह व्यवस्थाविवरण 4:24 की प्रतिध्वनि है, जहाँ परमेश्वर को “भस्म करनेवाली आग” कहा गया है।
    reason: cross_reference
  - marker: b
    text: या “ऐसी आग जो भस्म कर देती है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: γὰρ पिछले पद की चेतावनी और उपदेश का कारण बताता है। हिन्दी में “क्योंकि” इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है; καὶ का बल अलग शब्द जोड़ने के बजाय इसी संयोजन में समाहित है।
- source_word: ὁ θεὸς ἡμῶν
  choice: हमारा परमेश्वर
  rationale: यह संबंधवाचक पदबंध का स्वाभाविक हिन्दी रूप है और यूनानी की सामुदायिक तथा वाचा-संबंधी ध्वनि बनाए रखता है।
- source_word: πῦρ
  choice: आग
  rationale: मूल रूपक का सीधा अनुवाद है; इसे व्याख्यात्मक या उपमात्मक बनाकर नरम नहीं किया गया।
- source_word: καταναλίσκον
  choice: भस्म करनेवाली
  rationale: वर्तमान सक्रिय कृदंत आग के पूरी तरह नष्ट कर देने वाले प्रभाव को व्यक्त करता है। “भस्म करनेवाली” गरिमापूर्ण, बोधगम्य है और व्यवस्थाविवरण 4:24 की प्रतिध्वनि भी बनाए रखता है।
theological_decisions:
- issue: परमेश्वर का आग के रूप में रूपकात्मक वर्णन
  choice: 'सीधा रूपक: “हमारा परमेश्वर भस्म करनेवाली आग है”'
  alternative: “हमारा परमेश्वर भस्म करनेवाली आग के समान है” अथवा “हमारा परमेश्वर ऐसी आग है जो भस्म कर देती है”
  rationale: यूनानी वाक्य में तुलना सूचक कोई शब्द नहीं है। सीधा समतामूलक कथन चेतावनी की तीव्रता और व्यवस्थाविवरण 4:24 से अंतर्पाठीय संबंध को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। प्रत्यक्ष रूपक और चेतावनी का बल सुरक्षित रखा गया है।
