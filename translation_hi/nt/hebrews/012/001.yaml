id: HEB.12.1
reference: Hebrews 12:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τοιγαροῦν καὶ ἡμεῖς, τοσοῦτον ἔχοντες περικείμενον ἡμῖν νέφος μαρτύρων, ὄγκον ἀποθέμενοι πάντα καὶ τὴν εὐπερίστατον ἁμαρτίαν, δι’ ὑπομονῆς τρέχωμεν τὸν προκείμενον ἡμῖν ἀγῶνα,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/001.yaml
  text: Therefore[a], since we also have so great a cloud of witnesses surrounding us, laying aside every weight and the sin that so easily entangles, let us run with endurance the race set before us,
translation:
  language: hi
  text: इसलिए हम भी, क्योंकि गवाहों का इतना बड़ा बादल हमें चारों ओर से घेरे हुए है, हर एक बोझ और आसानी से उलझा देने वाले पाप[a] को उतार फेंककर, उस दौड़ में धीरज के साथ दौड़ें जो हमारे सामने रखी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो हमसे बहुत कसकर चिपका रहता है,’ अथवा ‘जो आसानी से फँसा लेता है।’ यूनानी विशेषण दुर्लभ है और उसका आशय उलझाने, फँसाने या कसकर चिपके रहने में से कोई हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τοιγαροῦν
  choice: इसलिए
  rationale: यह संयोजक पिछले तर्क, विशेषकर अध्याय 11, से निकला निष्कर्ष दिखाता है; ‘इसलिए’ आधुनिक हिन्दी में उसके तार्किक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ ἡμεῖς
  choice: हम भी
  rationale: ‘भी’ अध्याय 11 में वर्णित विश्वासयोग्य लोगों और वर्तमान पाठकों के बीच संबंध बनाए रखता है।
- source_word: τοσοῦτον ... νέφος μαρτύρων
  choice: गवाहों का इतना बड़ा बादल
  rationale: यह मूल रूपक और विशाल समूह पर दिए गए बल, दोनों को सुरक्षित रखता है।
- source_word: περικείμενον ἡμῖν
  choice: हमें चारों ओर से घेरे हुए
  rationale: यह सहभागी रूप में व्यक्त चारों ओर स्थित होने की स्थानिक छवि को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: μαρτύρων
  choice: गवाहों
  rationale: यह शब्द उनके साक्ष्य देने के अर्थ को बनाए रखता है और उन्हें केवल दौड़ देखने वाले दर्शक मान लेने की व्याख्या नहीं जोड़ता।
- source_word: ὄγκον ... πάντα
  choice: हर एक बोझ
  rationale: ‘बोझ’ धावक को धीमा करने वाले भार या बाधा की क्रीड़ात्मक छवि को बनाए रखता है।
- source_word: ἀποθέμενοι
  choice: उतार फेंककर
  rationale: यह दौड़ से पहले या दौड़ते समय बाधाओं को निर्णायक रूप से दूर करने का भाव देता है।
- source_word: εὐπερίστατον
  choice: आसानी से उलझा देने वाले
  rationale: दुर्लभ यूनानी विशेषण का यह संभावित अर्थ दौड़ की छवि में स्पष्ट है; इसकी वास्तविक शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: ἁμαρτίαν
  choice: पाप
  rationale: संदर्भ पाप को ठोस बाधा के रूप में प्रस्तुत करता है, पर किसी एक विशिष्ट पाप का नाम नहीं बताता; हिन्दी में ‘पाप’ इस तनाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: δι’ ὑπομονῆς
  choice: धीरज के साथ
  rationale: यह कठिनाई के बीच स्थिर बने रहने का भाव देता है और दौड़ की उपमा में स्वाभाविक है।
- source_word: τρέχωμεν
  choice: दौड़ें
  rationale: प्रथम पुरुष बहुवचन के आग्रहपूर्ण संभावनार्थक रूप को हिन्दी की सामूहिक प्रेरणा के रूप में व्यक्त करता है।
- source_word: τὸν προκείμενον ἡμῖν ἀγῶνα
  choice: उस दौड़ में ... जो हमारे सामने रखी गई है
  rationale: τρέχωμεν के कारण ἀγών का ‘दौड़’ अर्थ संदर्भानुकूल है, जबकि ‘सामने रखी गई’ निर्धारित मार्ग या चुनौती का भाव बनाए रखता है।
theological_decisions:
- issue: इब्रानियों 11 के संबंध में ‘गवाहों’ का आशय
  choice: ऐसे लोग जिनके जीवन विश्वास की गवाही देते हैं; चारों ओर होने की छवि उपदेश को बल देती है
  alternative: मुख्यतः स्वर्गीय दर्शक जो विश्वासियों को दौड़ते हुए देख रहे हैं
  rationale: निकट संदर्भ अध्याय 11 के विश्वासयोग्य उदाहरणों की ओर संकेत करता है। अनुवाद ‘गवाहों’ को बनाए रखता है और यह अतिरिक्त दावा नहीं जोड़ता कि वे सक्रिय दर्शकों के रूप में दौड़ देख रहे हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बादल’ और ‘दौड़’ के मूल रूपक सुरक्षित हैं; वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार व्यवस्थित किया गया है।
