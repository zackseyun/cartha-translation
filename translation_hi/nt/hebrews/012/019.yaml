  yaml_path: translation/nt/hebrews/012/019.yaml
  text: and to the sound of a trumpet and to a voice of words[b][a], whose hearers begged that no further word be spoken to them.
translation:
  language: hi
  text: और न तुरही की ध्वनि और शब्दों की वाणी के पास, जिसे सुनने वालों ने विनती की कि उनसे आगे कोई वचन न कहा जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σάλπιγγος ἤχῳ
  choice: तुरही की ध्वनि
  rationale: यह वाक्यांश सीनै पर सुनी गई तुरही की श्रव्य ध्वनि को दर्शाता है। ‘ध्वनि’ ἦχος के निकट है और अनावश्यक रूप से उसकी तीव्रता निर्धारित नहीं करता।
- source_word: φωνῇ ῥημάτων
  choice: शब्दों से भरी उस आवाज़
  rationale: यह स्वाभाविक हिन्दी में व्यक्त वाणी का बोध कराता है और असामान्य यूनानी पदबंध की जीवंतता भी बनाए रखता है; इसे केवल अस्पष्ट ‘आवाज़’ नहीं बनाया गया।
- source_word: ἧς
  choice: जिसे
  rationale: स्त्रीलिंग एकवचन संबंधवाचक सर्वनाम का निकटतम पूर्वपद φωνῇ है, इसलिए मुख्य पाठ में इसे ‘आवाज़’ से जोड़ा गया है। पूरे सीनै-प्रकटन की ओर व्यापक संकेत की संभावना पादटिप्पणी में रखी गई है।
- source_word: οἱ ἀκούσαντες
  choice: सुनने वालों
  rationale: यह substantival participle का संक्षिप्त और स्वाभाविक हिन्दी रूप है तथा उन इस्राएलियों को सूचित करता है जिन्होंने आवाज़ सुनी।
- source_word: παρῃτήσαντο
  choice: विनती की
  rationale: संदर्भ में यह क्रिया आगे प्रत्यक्ष संबोधन से मुक्त किए जाने की गंभीर प्रार्थना व्यक्त करती है; ‘विनती की’ आग्रह को दिखाता है, जबकि केवल ‘मना किया’ अर्थ को कठोर और भ्रामक बना सकता है।
- source_word: μὴ προστεθῆναι αὐτοῖς λόγον
  choice: कि उनसे आगे कुछ न कहा जाए
  rationale: यह προστίθημι के ‘और आगे जोड़ने’ वाले मुहावरे तथा निषेधात्मक आशय को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है और निष्क्रिय भाव को बनाए रखता है।
theological_decisions:
- issue: संबंधवाचक उपवाक्य ἧς का पूर्वपद
  choice: मुख्य पाठ में यह उपवाक्य सबसे सीधे ‘आवाज़’ की ओर संकेत करता है।
  alternative: इसे तुरही की ध्वनि और आवाज़ सहित पूरे सीनै-प्रकटन की ओर व्यापक संकेत माना जा सकता है।
  rationale: व्याकरण की दृष्टि से निकटतम स्त्रीलिंग एकवचन पूर्वपद φωνῇ है, पर प्रसंग में लोग पूरे भयावह प्रकटन से पीछे हटे थे। मुख्य पाठ निकटतम व्याकरणिक अर्थ रखता है और व्यापक संभावना को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। पद पिछले पद में आए ‘तुम न तो... के पास आए हो’ पर निर्भर है, इसलिए समन्वय बनाए रखने हेतु ‘न... के’ संरचना रखी गई। ‘आवाज़’ स्त्रीलिंग होने से ἧς का निकट संबंध हिन्दी में भी स्पष्ट है।
