source:
  edition: SBLGNT
  text: ἀφορῶντες εἰς τὸν τῆς πίστεως ἀρχηγὸν καὶ τελειωτὴν Ἰησοῦν, ὃς ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς ὑπέμεινεν σταυρὸν αἰσχύνης καταφρονήσας, ἐν δεξιᾷ τε τοῦ θρόνου τοῦ θεοῦ κεκάθικεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/002.yaml
  text: fixing our eyes on Jesus[a], the pioneer and perfecter of faith, who for the joy set before him endured the cross, despising the shame[b], and has sat down at the right hand of the throne of God.
translation:
  language: hi
  text: और यीशु पर अपनी दृष्टि टिकाए रखें[a], जो विश्वास के अग्रदूत और उसे पूर्णता तक पहुँचानेवाले हैं। उन्होंने अपने सामने रखे हुए आनंद के लिए क्रूस सहा, उसके अपमान को तुच्छ जाना[b], और परमेश्वर के सिंहासन के दाहिने बैठ गए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु पर अपनी दृष्टि टिकाए रखें, जो विश्वासयोग्यता के अग्रदूत और उसे पूर्णता तक पहुँचानेवाले हैं”; अथवा, “जो हमारे विश्वास के अग्रदूत और उसे पूर्णता तक पहुँचानेवाले हैं।” यूनानी वाक्यांश संक्षिप्त है, और “विश्वास” का अर्थ “विश्वासयोग्यता” भी हो सकता है या वह विशेष रूप से विश्वासियों के विश्वास की ओर संकेत कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “उसके अपमान की परवाह न की।” भाव यह है कि उन्होंने क्रूस के अपमान को निर्णायक महत्त्व नहीं दिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀφορῶντες
  choice: अपनी दृष्टि टिकाए रखें
  rationale: यह क्रिया दूसरी बातों से ध्यान हटाकर यीशु पर लगातार और एकाग्र दृष्टि रखने का भाव देती है; आधुनिक हिन्दी में यह स्वाभाविक भी है।
- source_word: ἀρχηγὸν
  choice: मार्ग खोलनेवाले
  rationale: ἀρχηγός आरम्भ करने और आगे चलकर राह दिखानेवाले दोनों अर्थ दे सकता है। दौड़ और धीरज के प्रसंग में ‘मार्ग खोलनेवाले’ इस अग्रणी भाव को स्पष्ट करता है।
- source_word: τελειωτὴν
  choice: पूर्णता तक पहुँचानेवाले
  rationale: यह उस व्यक्ति को सूचित करता है जो किसी बात को उसके निर्धारित लक्ष्य या सिद्धि तक ले जाता है; यह केवल समाप्त करने से अधिक अर्थ रखता है।
- source_word: τῆς πίστεως
  choice: विश्वास के
  rationale: यूनानी में न तो ‘हमारे’ स्पष्ट है, न अर्थ को केवल ‘विश्वासयोग्यता’ तक सीमित किया गया है। मुख्य पाठ में संक्षिप्त संरचना और वास्तविक अस्पष्टता रखी गई है।
- source_word: ἀντὶ τῆς προκειμένης αὐτῷ χαρᾶς
  choice: अपने सामने रखे आनंद के लिए
  rationale: प्रसंग में आगे रखे लक्ष्य से प्रेरणा लेकर कष्ट सहने का भाव अधिक उपयुक्त है; ‘के लिए’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὑπέμεινεν σταυρὸν
  choice: क्रूस सहा
  rationale: ὑπομένω कठिनाई के नीचे दृढ़ बने रहने और सहने का अर्थ देता है; यहाँ यीशु के क्रूस की निश्चित घटना अभिप्रेत है।
- source_word: αἰσχύνης καταφρονήσας
  choice: उसके अपमान को तुच्छ जाना
  rationale: भाव यह है कि यीशु ने क्रूस से जुड़े सामाजिक अपमान को निर्णायक महत्त्व नहीं दिया; सर्वनाम क्रूस से उसके संबंध को स्पष्ट करता है।
- source_word: ἐν δεξιᾷ ... τοῦ θρόνου τοῦ θεοῦ κεκάθικεν
  choice: परमेश्वर के सिंहासन के दाहिने जा बैठे हैं
  rationale: ‘दाहिने’ सम्मान और अधिकार के स्थान की प्रचलित बाइबलीय छवि को रखता है। ‘जा बैठे हैं’ पूर्ण क्रिया और उसकी वर्तमान स्थायी परिणति को हिन्दी में सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: τῆς πίστεως का संबंध और अर्थ
  choice: यीशु को ‘विश्वास के मार्ग खोलनेवाले और उसे पूर्णता तक पहुँचानेवाले’ कहा गया है।
  alternative: ‘विश्वासयोग्यता के मार्ग खोलनेवाले और उसे पूर्णता तक पहुँचानेवाले’ अथवा ‘हमारे विश्वास के आरम्भकर्ता और उसे पूर्ण करनेवाले।’
  rationale: यूनानी वाक्यांश संक्षिप्त है। πίστις विश्वास, विश्वासयोग्यता, या प्रसंगानुसार विश्वासियों के विश्वास की ओर संकेत कर सकता है; इसलिए मुख्य पाठ में ‘हमारे’ नहीं जोड़ा गया और विकल्प पादटिप्पणी में रखे गए हैं।
- issue: ἀντὶ का अर्थ
  choice: यीशु ने सामने रखे आनंद को प्रेरक लक्ष्य मानकर क्रूस सहा।
  alternative: यीशु ने अपने सामने उपलब्ध आनंद के बदले क्रूस चुना।
  rationale: ἀντί कभी ‘के बदले’ हो सकता है, पर दौड़, धीरज और आगे रखे लक्ष्य के इस प्रसंग में भावी आनंद को सामने रखकर सहने का अर्थ अधिक संगत है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। ‘मार्ग खोलनेवाले’ अग्रणी और पथप्रदर्शक अर्थ को सामान्य पाठक के लिए स्पष्ट करता है; ‘पूर्णता तक पहुँचानेवाले’ τελειωτής के लक्ष्य-सिद्धि वाले भाव को सुरक्षित रखता है। वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है, जबकि सभी यूनानी संबंध बनाए रखे गए हैं।
