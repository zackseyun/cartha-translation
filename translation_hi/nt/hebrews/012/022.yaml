source:
  edition: SBLGNT
  text: ἀλλὰ προσεληλύθατε Σιὼν ὄρει καὶ πόλει θεοῦ ζῶντος, Ἰερουσαλὴμ ἐπουρανίῳ, καὶ μυριάσιν ἀγγέλων, πανηγύρει
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/022.yaml
  text: But you have come to Mount Zion and to the city of the living God[a], the heavenly Jerusalem, and to myriads of angels in festal gathering[b],
translation:
  language: hi
  text: परन्तु तुम सिय्योन पर्वत, जीवित परमेश्वर के नगर—स्वर्गीय यरूशलेम—और उत्सवी सभा में असंख्य स्वर्गदूतों[a] के पास आ पहुँचे हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वाक्य-विन्यास का अनुवाद यह भी हो सकता है: “असंख्य स्वर्गदूतों के पास और उत्सव-सभा के पास।” “असंख्य” के लिए प्रयुक्त यूनानी शब्द का शाब्दिक अर्थ “दस-दस हज़ार” भी हो सकता है।'
    reason: वाक्यगत वैकल्पिक पाठ और शब्दार्थ की अनिश्चितता
lexical_decisions:
- source_word: ἀλλὰ
  choice: परन्तु
  rationale: यह पिछले सीनै-वर्णन के साथ प्रबल विरोध दिखाता है; ‘परन्तु’ गरिमापूर्ण और स्वाभाविक है।
- source_word: προσεληλύθατε
  choice: आ पहुँचे हो
  rationale: पूर्णकाल पहले हुए निकट आने और उससे बनी वर्तमान स्थिति—दोनों को व्यक्त करता है।
- source_word: Σιὼν ὄρει
  choice: सिय्योन पर्वत
  rationale: प्रसέρχομαι के साथ दत्तिव को हिन्दी में ‘के पास’ से व्यक्त किया गया है; पारंपरिक स्थान-नाम और पर्वत की छवि सुरक्षित हैं।
- source_word: πόλει θεοῦ ζῶντος
  choice: जीवित परमेश्वर के नगर
  rationale: θεοῦ का संबंधात्मक/अधिकारसूचक भाव और ζῶντος का धर्मवैचारिक रूप से महत्त्वपूर्ण ‘जीवित’ विशेषण दोनों बने रहते हैं।
- source_word: Ἰερουσαλὴμ ἐπουρανίῳ
  choice: स्वर्गीय यरूशलेम
  rationale: यह ‘जीवित परमेश्वर के नगर’ का समानाधिकरण है और ἐπουράνιος का सीधा, स्वाभाविक अनुवाद है।
- source_word: μυριάσιν ἀγγέλων
  choice: असंख्य स्वर्गदूतों
  rationale: μυριάς दस हज़ारों अथवा सामान्यतः अगणित विशाल संख्या बता सकता है; ‘असंख्य’ सामान्य पाठक के लिए सहज रहते हुए संख्या को अनिश्चित रखता है।
- source_word: πανηγύρει
  choice: उत्सव में इकट्ठे
  rationale: πανήγυρις उत्सवी सार्वजनिक सभा को दर्शाता है; यहाँ इसे निकटवर्ती स्वर्गदूतों से जोड़कर स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: πανηγύρει का वाक्यगत संबंध
  choice: 'इसे स्वर्गदूतों के समुदाय से जोड़ा गया है: ‘उत्सव में इकट्ठे असंख्य स्वर्गदूतों।’'
  alternative: 'इसे सूची का अलग पद माना जा सकता है: ‘असंख्य स्वर्गदूतों और उत्सव-सभा के पास’; अथवा अगले पद की ‘सभा’ से संबद्ध किया जा सकता है।'
  rationale: दत्तिव पदों की शृंखला एक से अधिक वाक्यगत संबंध की अनुमति देती है। निकटवर्ती ‘स्वर्गदूतों’ से जोड़ना सुसंगत है, पर वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर रखा गया है। ‘आ पहुँचे हो’ पूर्णकाल के वर्तमान परिणाम को उभारता है। डैश द्वारा ‘स्वर्गीय यरूशलेम’ को पूर्ववर्ती नगर का समानाधिकरण स्पष्ट किया गया है।
