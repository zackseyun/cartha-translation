reference: Hebrews 12:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Βλέπετε μὴ παραιτήσησθε τὸν λαλοῦντα· εἰ γὰρ ἐκεῖνοι οὐκ ⸀ἐξέφυγον ⸂ἐπὶ γῆς παραιτησάμενοι τὸν⸃ χρηματίζοντα, ⸀πολὺ μᾶλλον ἡμεῖς οἱ τὸν ἀπ’ οὐρανῶν ἀποστρεφόμενοι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/025.yaml
  text: See to it that you do not refuse the one who is speaking[a]. For if those did not escape when they refused the one who warned them on earth[b], much less will we if we turn away from the one who warns from heaven.
translation:
  language: hi
  text: सावधान रहो कि तुम बोलनेवाले को ठुकराओ नहीं। क्योंकि जब पृथ्वी पर चेतावनी देनेवाले को ठुकराने पर वे लोग बच न सके, तो यदि हम स्वर्ग से चेतावनी देनेवाले से मुँह मोड़ें, हम तो और भी नहीं बचेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में अंतिम खण्ड है, “तो हम कहीं अधिक, जो स्वर्ग से होनेवाले से मुँह मोड़ते हैं”; यहाँ “नहीं बचेंगे” पिछली बात से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Βλέπετε
  choice: सावधान रहो
  rationale: बहुवचन आज्ञार्थक यहाँ चेतावनी और आग्रह का भाव रखता है; यह हिन्दी में केवल ‘देखो’ से अधिक स्वाभाविक है।
- source_word: μὴ παραιτήσησθε / παραιτησάμενοι
  choice: ठुकराओ नहीं / ठुकराने पर
  rationale: दोनों स्थानों पर एक ही धातु की पुनरावृत्ति बनाए रखी गई है; ‘ठुकराना’ बोलनेवाले और उसकी बात को अस्वीकार करने का भाव व्यक्त करता है।
- source_word: τὸν λαλοῦντα
  choice: बोलनेवाले
  rationale: वर्तमान कृदन्त बोलते रहने या वर्तमान में संबोधित करने का भाव देता है; यूनानी पाठ की तरह वक्ता की पहचान स्पष्ट करके नहीं जोड़ी गई।
- source_word: ἐξέφυγον
  choice: बच न सके
  rationale: यह दण्ड या परिणाम से न बच पाने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: यह ἀπ’ οὐρανῶν के साथ पृथ्वी और स्वर्ग का स्पष्ट स्थानगत विरोध बनाए रखता है, बिना सीनै को मुख्य पाठ में जोड़ने के।
- source_word: χρηματίζοντα
  choice: चेतावनी देनेवाले
  rationale: इस संदर्भ में क्रिया ईश्वरीय अधिकार से दी गई चेतावनी या निर्देश सूचित कर सकती है; न्याय-संबंधी आग्रह के कारण ‘चेतावनी देनेवाले’ उपयुक्त है।
- source_word: πολὺ μᾶλλον
  choice: हम तो और भी नहीं
  rationale: 'नकारात्मक लघु-से-महान तर्क को हिन्दी मुहावरे में स्पष्ट करता है: यदि वे नहीं बचे, तो हम और भी नहीं बचेंगे।'
- source_word: ἀποστρεφόμενοι
  choice: यदि हम ... से मुँह मोड़ें
  rationale: कृदन्त की शर्त-सदृश भूमिका को पठनीय हिन्दी में व्यक्त करता है और जानबूझकर विमुख होने का भाव बनाए रखता है।
- source_word: τὸν ἀπ’ οὐρανῶν
  choice: स्वर्ग से चेतावनी देनेवाले
  rationale: यूनानी में संक्षिप्त वर्णन को पिछले ‘चेतावनी देनेवाले’ से जोड़कर अर्थ स्पष्ट किया गया है; ‘स्वर्गों’ के यूनानी बहुवचन को हिन्दी की स्वाभाविक धार्मिक अभिव्यक्ति ‘स्वर्ग’ से दिया गया है।
theological_decisions:
- issue: बोलने और चेतावनी देनेवाले की पहचान
  choice: मुख्य पाठ में ‘बोलनेवाला’ और ‘चेतावनी देनेवाला’ ही रखा गया है।
  alternative: स्पष्ट रूप से ‘परमेश्वर’ या ‘मसीह’ जोड़ना।
  rationale: संदर्भ दिव्य वाणी की ओर संकेत करता है, पर इस पद में कोई नाम या उपाधि नहीं दी गई; इसलिए पाठ की वास्तविक अनिर्दिष्टता सुरक्षित रखी गई है।
- issue: अंतिम खण्ड में निहित क्रिया
  choice: ‘हम तो और भी नहीं बचेंगे’ स्पष्ट रूप से जोड़ा गया है।
  alternative: 'अधिक शाब्दिक और अपूर्ण वाक्य: ‘तो हम कहीं अधिक, जो ... से मुँह मोड़ते हैं।’'
  rationale: यूनानी में ‘बचना’ पिछली उपवाक्य-रचना से समझा जाता है। स्वाभाविक हिन्दी के लिए उसे दोहराना आवश्यक है और इससे कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जुड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन संबोधन और गरिमापूर्ण चेतावनी का स्वर। ‘ठुकराना’ की पुनरावृत्ति से यूनानी शब्द-संबंध सुरक्षित है। हर पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित है।
