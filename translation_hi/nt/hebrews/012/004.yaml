translation:
  language: hi
  text: पाप के विरुद्ध संघर्ष करते हुए तुमने अब तक लहू बहने की हद तक प्रतिरोध नहीं किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने अब तक लहू तक प्रतिरोध नहीं किया है।” यूनानी में अधिक शाब्दिक रूप से, “अब तक लहू तक तुमने प्रतिरोध नहीं किया है।” यह एक मुहावरा है, जिसका अर्थ है लहू बहने की हद तक प्रतिरोध करना।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὔπω
  choice: अब तक ... नहीं
  rationale: यह कालवाचक क्रिया-विशेषण बताता है कि उल्लिखित सीमा अभी नहीं पहुँची गई है; आधुनिक हिन्दी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: μέχρις αἵματος
  choice: उस सीमा तक ... कि तुम्हारा लहू बहता
  rationale: यूनानी मुहावरा लहू बहने की हद तक प्रतिरोध करने का भाव देता है। यह हिन्दी रूप अर्थ स्पष्ट करता है, पर चोट या शहादत में से किसी एक को निश्चित नहीं करता।
- source_word: ἀντικατέστητε
  choice: तुमने ... विरोध नहीं किया
  rationale: द्वितीय पुरुष बहुवचन का यह क्रियारूप दृढ़ता से सामने खड़े होने या प्रतिरोध करने को व्यक्त करता है; ‘विरोध किया’ प्रसंग के संघर्ष-बिंब के अनुकूल है।
- source_word: πρὸς τὴν ἁμαρτίαν
  choice: पाप के विरुद्ध
  rationale: πρός और कर्मकारक यहाँ विरोध का संबंध व्यक्त करते हैं। हिन्दी में ‘पाप के विरुद्ध’ व्यापक और स्वाभाविक है।
- source_word: ἀνταγωνιζόμενοι
  choice: संघर्ष करते हुए
  rationale: वर्तमान कृदंत जारी संघर्ष या मुकाबले की परिस्थिति बताता है और मुख्य क्रिया के साथ स्वाभाविक हिन्दी में जुड़ता है।
theological_decisions:
- issue: इस प्रसंग में ‘पाप’ का अभिप्राय
  choice: इसे व्यापक रूप से ‘पाप’ ही रखा गया है।
  alternative: सताने वालों का पापपूर्ण विरोध; सामान्य रूप में पाप; विश्वास त्यागने का प्रलोभन
  rationale: निकटवर्ती प्रसंग विरोध सहने और पाप को दूर करने—दोनों की बात करता है, पर यह पद अभिप्राय को और सीमित नहीं करता। व्यापक पद रखने से मूल की धार्मिक अर्थ-तनाव और अस्पष्टता बनी रहती है।
- issue: ‘लहू तक’ की सीमा
  choice: इसे लहू बहने की सीमा के रूप में व्यक्त किया गया है।
  alternative: केवल शहादत; केवल शारीरिक चोट
  rationale: यूनानी अभिव्यक्ति चरम शारीरिक मूल्य का संकेत देती है, लेकिन अपने आप में मृत्यु या किसी खास प्रकार की चोट को अनिवार्य रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; ‘लहू’ ने मूल के रक्त-संबंधी तीखे संघर्ष-बिंब को बनाए रखा है। वाक्य सामान्य पाठक के लिए स्पष्ट है और ‘पाप’ के संदर्भ को अनावश्यक रूप से सीमित नहीं करता।
