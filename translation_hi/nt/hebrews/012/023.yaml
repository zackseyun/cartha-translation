  edition: SBLGNT
  text: καὶ ἐκκλησίᾳ πρωτοτόκων ⸂ἀπογεγραμμένων ἐν οὐρανοῖς⸃, καὶ κριτῇ θεῷ πάντων, καὶ πνεύμασι δικαίων τετελειωμένων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/023.yaml
  text: and to the assembly of the firstborn who are enrolled in the heavens[a], and to God, the judge of all, and to the spirits of righteous people made perfect,
translation:
  language: hi
  text: और पहलौठों की सभा के पास, जो स्वर्ग में पंजीकृत हैं[a], और सबका न्याय करनेवाले परमेश्वर के पास, और सिद्ध किए गए धर्मी जनों की आत्माओं के पास,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘स्वर्गों में पंजीकृत हैं।’ यूनानी में ‘स्वर्गों में’ बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκκλησίᾳ
  choice: सभा
  rationale: यह सामान्य और स्वाभाविक शब्द एकत्र समुदाय का भाव रखता है और बाद की संस्थागत धारणाएँ अनावश्यक रूप से नहीं जोड़ता।
- source_word: πρωτοτόκων
  choice: पहलौठों
  rationale: बहुवचन को सामूहिक रूप में बनाए रखता है और ज्येष्ठता से जुड़े दर्जे तथा उत्तराधिकार के भाव को व्यक्त करता है; मूल में निहित न होने के कारण ‘पुत्रों’ नहीं जोड़ा गया।
- source_word: ἀπογεγραμμένων
  choice: पंजीकृत हैं
  rationale: पूर्ण निष्क्रिय कृदंत के पूरे हो चुके पंजीकरण और उसके वर्तमान परिणाम को संक्षेप में व्यक्त करता है।
- source_word: ἐν οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी के बहुवचन को मुख्य पाठ में सुरक्षित रखता है; अधिक प्रचलित एकवचन रूप पादटिप्पणी में दिया गया है।
- source_word: κριτῇ θεῷ πάντων
  choice: सबके न्यायी परमेश्वर
  rationale: परमेश्वर की पहचान और सब पर उनके न्यायाधिकार, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πνεύμασι
  choice: आत्माओं
  rationale: इस प्रसंग में धर्मी मनुष्यों की आत्मिक अवस्था का स्वाभाविक हिन्दी संकेत है; ‘आत्मिक प्राणी’ कहने से स्वर्गदूतों का अनुचित संकेत मिल सकता था।
- source_word: δικαίων
  choice: धर्मी जनों
  rationale: मानवीय बहुवचन को स्त्री-पुरुष दोनों के लिए समावेशी और स्पष्ट रूप में व्यक्त करता है।
- source_word: τετελειωμένων
  choice: सिद्ध किए गए
  rationale: पूर्ण निष्क्रिय रूप और इब्रानियों में सिद्धता अथवा पूर्णता की प्रमुख विषयवस्तु को बनाए रखता है।
theological_decisions:
- issue: ‘पहलौठों’ की पहचान
  choice: बहुवचन में परमेश्वर के उन लोगों के लिए सामूहिक पद, जिन्हें पहलौठे का दर्जा अथवा उत्तराधिकार प्राप्त है
  alternative: केवल मसीह का उल्लेख, और सभा को उनकी सभा मानना
  rationale: πρωτοτόκων स्पष्ट रूप से बहुवचन है; अनुवाद उसी सामूहिक अर्थ को रखता है और उससे आगे कोई व्याख्या नहीं जोड़ता।
- issue: ‘सिद्ध किए गए धर्मी जनों की आत्माओं’ का संकेत
  choice: परमेश्वर की उपस्थिति में सिद्ध किए गए धर्मी मनुष्यों की आत्माएँ
  alternative: देहधारी और देहरहित सभी धर्मी जनों का व्यापक उल्लेख
  rationale: ‘आत्माओं’ का शब्द मानवीय आत्मिक अवस्था की ओर स्वाभाविक रूप से संकेत करता है, पर अनुवाद मध्यवर्ती अवस्था के विषय में पाठ से अधिक कोई विस्तृत सिद्धांत नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। पद पूर्ववर्ती वाक्य के ‘के पास आए हो’ से जुड़ी सूची का अंश है, इसलिए समानांतर ‘के पास’ संरचना और अंतिम अल्पविराम बनाए रखा गया है।
