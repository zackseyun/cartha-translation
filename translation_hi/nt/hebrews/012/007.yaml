id: HEB.12.7
reference: Hebrews 12:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς παιδείαν ὑπομένετε· ὡς υἱοῖς ὑμῖν προσφέρεται ὁ θεός· τίς ⸀γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/007.yaml
  text: Endure for discipline[a]; God is dealing with you as with sons[b]. For what son is there whom a father does not discipline?
translation:
  language: hi
  text: अनुशासन के लिए धीरज रखो[a]; परमेश्वर तुम्हारे साथ पुत्रों के समान व्यवहार कर रहा है[b]। क्योंकि ऐसा कौन-सा पुत्र है जिसे पिता अनुशासित नहीं करता?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम सह रहे हो, उसे अनुशासन समझकर धीरज रखो।” यूनानी वाक्य का अर्थ या तो अनुशासन के लिए धीरज रखना या सहन की जा रही बात को अनुशासन मानना हो सकता है।
    reason: alternative_reading
  - marker: b
    text: यूनानी में “पुत्रों।” यह शब्द तर्क में प्रयुक्त पिता-पुत्र की उपमा को दर्शाता है; इसका अनुप्रयोग केवल पुरुषों तक सीमित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς παιδείαν
  choice: अनुशासन के लिए
  rationale: εἰς को यहाँ प्रयोजन अथवा परिणाम के अर्थ में समझा जा सकता है। यह अनुवाद यूनानी की संक्षिप्तता बनाए रखता है; ‘इसे अनुशासन समझकर’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ὑπομένετε
  choice: धीरज रखो
  rationale: रूप संकेतार्थक या आज्ञार्थक दोनों समझा जा सकता है, पर प्रसंग में उपदेशात्मक आज्ञा स्वाभाविक है। बिना व्यक्त कर्म जोड़े यह सहते रहने और दृढ़ बने रहने का भाव देता है।
- source_word: παιδείαν / παιδεύει
  choice: अनुशासन / अनुशासित करता
  rationale: दोनों सजातीय शब्दों के बीच का शाब्दिक संबंध सुरक्षित रखा गया है। यहाँ भाव केवल शिक्षा नहीं, बल्कि सुधारने और गढ़ने वाले पैतृक प्रशिक्षण का है।
- source_word: ὡς υἱοῖς
  choice: पुत्रों के समान
  rationale: यह पिता-पुत्र की तुलनात्मक और संबंधपरक उपमा को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: προσφέρεται
  choice: व्यवहार कर रहा है
  rationale: इस प्रसंग में क्रिया का मुहावरेदार अर्थ किसी के साथ एक विशेष ढंग से पेश आने का है; शाब्दिक ‘प्रस्तुत किया जाता है’ भ्रामक होगा।
- source_word: τίς γὰρ υἱὸς ὃν οὐ παιδεύει πατήρ
  choice: क्योंकि ऐसा कौन-सा पुत्र है जिसे पिता अनुशासित नहीं करता?
  rationale: यह स्वाभाविक हिन्दी में आलंकारिक प्रश्न की शक्ति बनाए रखता है। यूनानी में ‘उसका पिता’ नहीं है, इसलिए केवल ‘पिता’ रखा गया है।
theological_decisions:
- issue: पिता-पुत्र उपमा में लिंगसूचक पारिवारिक भाषा
  choice: मुख्य पाठ में ‘पुत्रों’ और ‘पुत्र’ को बनाए रखा गया
  alternative: ‘सन्तानों’ अथवा ‘बच्चों’
  rationale: लेखक का तर्क पिता-पुत्र की स्पष्ट उपमा पर आधारित है। ‘सन्तान’ समावेशी अर्थ स्पष्ट कर सकती है, पर मूल की लिंगसूचक छवि को धुँधला कर देगी; व्यापक समुदाय पर इसके अनुप्रयोग को पादटिप्पणी में बताया गया है।
- issue: ὑπομένετε का व्याकरणिक बल
  choice: 'आज्ञार्थक: ‘धीरज रखो’'
  alternative: 'संकेतार्थक: ‘तुम सह रहे हो’'
  rationale: रूप दोनों तरह समझा जा सकता है, किंतु निकटवर्ती उपदेशात्मक प्रसंग में आज्ञार्थक पाठ अधिक स्वाभाविक है; फिर भी क्रिया में कोई अनकहा कर्म नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धीरज रखो’ कष्ट में दृढ़ बने रहने का स्वाभाविक हिन्दी भाव देता है, और ‘अनुशासन’ को दोनों संबंधित यूनानी पदों में समान रखकर मूल का शब्द-संबंध सुरक्षित किया गया है।
