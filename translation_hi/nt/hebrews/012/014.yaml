source:
  edition: SBLGNT
  text: Εἰρήνην διώκετε μετὰ πάντων, καὶ τὸν ἁγιασμόν, οὗ χωρὶς οὐδεὶς ὄψεται τὸν κύριον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/014.yaml
  text: Pursue peace with everyone[a], and the holiness without which no one will see the Lord.
translation:
  language: hi
  text: सबके साथ शान्ति और उस पवित्रता[a] के लिए पूरा प्रयत्न करो, जिसके बिना कोई प्रभु को नहीं देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रीकरण।’ यूनानी शब्द पवित्र जीवन की दशा या पवित्र किए जाने की प्रक्रिया—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰρήνην
  choice: शान्ति
  rationale: यहाँ μετὰ πάντων के साथ यह दूसरों के साथ शान्तिपूर्ण सम्बन्ध और व्यवहार को दर्शाता है, केवल मन की आन्तरिक शान्ति को नहीं।
- source_word: διώκετε
  choice: पूरा प्रयत्न करो
  rationale: διώκω में किसी लक्ष्य के पीछे सक्रियता और दृढ़ता से लगे रहने का भाव है। यह हिन्दी प्रयोग उस प्रबल आग्रह को स्वाभाविक ढंग से व्यक्त करता है और शान्ति तथा पवित्रता—दोनों पर लागू होता है।
- source_word: μετὰ πάντων
  choice: सबके साथ
  rationale: यह सभी व्यक्तियों को समेटने वाले यूनानी वाक्यांश का सहज और व्यापक हिन्दी रूप है।
- source_word: τὸν ἁγιασμόν
  choice: उस पवित्रता
  rationale: ἁγιασμός पवित्र होने की दशा, जीवन की पवित्रता, अथवा पवित्र किए जाने की प्रक्रिया को सूचित कर सकता है। मुख्य पाठ में ‘पवित्रता’ साधारण पाठक के लिए स्पष्ट है; ‘उस’ यूनानी निश्चित उपपद और आगे आने वाले सम्बन्धवाचक उपवाक्य से जुड़ी विशिष्टता को व्यक्त करता है।
- source_word: οὗ χωρὶς
  choice: जिसके बिना
  rationale: पुल्लिंग एकवचन सम्बन्धवाचक सर्वनाम स्वाभाविक रूप से ἁγιασμός की ओर संकेत करता है; यह अनुवाद उस सम्बन्ध को स्पष्ट रखता है।
- source_word: οὐδεὶς
  choice: कोई ... नहीं
  rationale: यह οὐδείς की पूर्ण निषेधात्मक व्यापकता का स्वाभाविक हिन्दी रूप है।
- source_word: ὄψεται
  choice: देखेगा
  rationale: भविष्यकालीन क्रिया का सीधा, स्पष्ट और गरिमापूर्ण हिन्दी समतुल्य।
- source_word: τὸν κύριον
  choice: प्रभु
  rationale: κύριος की उपाधि को बिना उसके अभिप्रेत व्यक्ति को पाठ से अधिक सीमित किए सुरक्षित रखा गया है।
theological_decisions:
- issue: उपदेशात्मक सन्दर्भ में ἁγιασμός का अर्थ
  choice: मुख्य पाठ में ‘पवित्रता’
  alternative: ‘पवित्रीकरण’
  rationale: ‘पवित्रता’ यहाँ अपेक्षित पवित्र जीवन और परमेश्वर के लिए अलग किए जाने की दशा को सहज ढंग से व्यक्त करती है। ‘पवित्रीकरण’ भी सम्भव है, पर वह हिन्दी में अधिक तकनीकी लग सकता है और प्रक्रिया पर अपेक्षा से अधिक बल दे सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: ‘प्रभु’ का अभिप्रेत व्यक्ति
  choice: सिर्फ ‘प्रभु’ रखा गया
  alternative: ‘परमेश्वर’ अथवा ‘प्रभु यीशु’
  rationale: यूनानी पाठ केवल τὸν κύριον कहता है। अनुवाद पिता परमेश्वर या यीशु मसीह में से किसी एक को स्पष्ट करके स्रोत की वास्तविक खुली सम्भावना को संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक उपदेशात्मक शैली रखी गई है। ‘पूरा प्रयत्न करो’ सक्रिय और निरन्तर लगन का भाव देता है तथा यूनानी क्रिया को दोनों कर्मों—शान्ति और पवित्रता—से जोड़ता है।
