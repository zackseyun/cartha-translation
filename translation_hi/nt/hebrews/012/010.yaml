id: HEB.12.10
reference: Hebrews 12:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἱ μὲν γὰρ πρὸς ὀλίγας ἡμέρας κατὰ τὸ δοκοῦν αὐτοῖς ἐπαίδευον, ὁ δὲ ἐπὶ τὸ συμφέρον εἰς τὸ μεταλαβεῖν τῆς ἁγιότητος αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/010.yaml
  text: For they disciplined us for a few days as seemed best to them[a], but he does so for our benefit[b], so that we may share in his holiness.
translation:
  language: hi
  text: क्योंकि वे तो थोड़े दिनों तक[a], जैसा उन्हें ठीक लगा[b], हमें अनुशासित करते थे; पर वह हमारे लाभ के लिए ऐसा करता है, ताकि हम उसकी पवित्रता में सहभागी हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘थोड़े समय तक।’ यूनानी अभिव्यक्ति सांसारिक पिताओं के अनुशासन की सीमित अवधि पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जैसा उन्हें उचित जान पड़ा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πρὸς ὀλίγας ἡμέρας
  choice: थोड़े दिनों तक
  rationale: यह यूनानी मुहावरा सांसारिक पिताओं के अनुशासन की सीमित अवधि बताता है। यह अनुवाद कालगत विरोध को सहज और निकट रूप में बनाए रखता है।
- source_word: κατὰ τὸ δοκοῦν αὐτοῖς
  choice: जैसा उन्हें ठीक लगा
  rationale: यह पद उनके अपने निर्णय या समझ के अनुसार उचित जान पड़ने का भाव व्यक्त करता है; यह उनके निर्णय को अनिवार्यतः पूर्णतः सही नहीं ठहराता।
- source_word: ἐπαίδευον
  choice: अनुशासित करते थे
  rationale: संदर्भ में इसका अर्थ केवल दंड देना नहीं, बल्कि पिता द्वारा सुधारना और प्रशिक्षण देना भी है। ‘अनुशासित’ इस व्यापक भाव को संक्षेप में व्यक्त करता है।
- source_word: ὁ δὲ
  choice: पर वह ... ऐसा करता है
  rationale: यूनानी में कर्ता स्पष्ट नाम से नहीं दिया गया है, पर संदर्भ में वह परमेश्वर है। सर्वनाम मूल की अंतर्निहितता और सांसारिक पिताओं से विरोध—दोनों को बनाए रखता है।
- source_word: ἐπὶ τὸ συμφέρον
  choice: हमारे लाभ के लिए
  rationale: यह वाक्यांश उस उद्देश्य को दर्शाता है जो हमारे हित और भलाई की ओर लक्षित है।
- source_word: εἰς τὸ μεταλαβεῖν
  choice: ताकि हम ... सहभागी हों
  rationale: यह रचना उद्देश्य या अभिप्रेत परिणाम व्यक्त करती है, और μεταλαμβάνω का अर्थ किसी वस्तु में भाग लेना या सहभागी होना है।
- source_word: ἁγιότητος αὐτοῦ
  choice: उसकी पवित्रता
  rationale: यह परमेश्वर की पवित्रता को उस गुण के रूप में प्रस्तुत करता है जिसमें उसके जन सहभागी होते हैं; अनुवाद मूल के संबंधवाचक सर्वनाम को बनाए रखता है।
theological_decisions:
- issue: ὁ δὲ में निहित एकवचन कर्ता का संदर्भ
  choice: परमेश्वर को संदर्भ से समझे जाने वाले सर्वनाम ‘वह’ द्वारा व्यक्त किया गया है।
  alternative: स्पष्टता के लिए ‘पर परमेश्वर’ जोड़ना।
  rationale: इब्रानियों 12:5–11 में सांसारिक पिताओं और परमेश्वर के पितृवत अनुशासन का विरोध स्पष्ट है। ‘वह’ यूनानी पाठ की अंतर्निहितता बनाए रखता है।
- issue: ‘उसकी पवित्रता में सहभागी’ होने का अर्थ
  choice: परमेश्वर की पवित्रता में सहभागिता को बिना उसकी प्रक्रिया को संकीर्ण रूप से परिभाषित किए व्यक्त किया गया है।
  alternative: इसे केवल प्राप्त धार्मिक स्थिति या केवल क्रमिक पवित्रीकरण के रूप में व्याख्यायित करना।
  rationale: पद ईश्वरीय अनुशासन का उद्देश्य बताता है, पर सहभागिता की धर्मवैज्ञानिक प्रक्रिया को सीमित नहीं करता; इसलिए मूल की व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रूप अपनाया गया है। ‘अनुशासित’ को पूरे प्रसंग में दंड, सुधार और प्रशिक्षण के व्यापक भाव के लिए चुना गया है।
