source:
  edition: SBLGNT
  text: καὶ τροχιὰς ὀρθὰς ⸀ποιεῖτε τοῖς ποσὶν ὑμῶν, ἵνα μὴ τὸ χωλὸν ἐκτραπῇ, ἰαθῇ δὲ μᾶλλον.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/013.yaml
  text: and make straight paths for your feet[a], so that the lame may not be turned aside[b], but rather be healed.
translation:
  language: hi
  text: और अपने पैरों के लिए सीधे मार्ग बनाओ,[a] ताकि जो लंगड़ा है वह मार्ग से हट न जाए,[b] बल्कि चंगा हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन नीतिवचन 4:26 की प्रतिध्वनि है और अनुशासित चाल चलने की इस अनुच्छेद की छवि को आगे बढ़ाता है।
    reason: cross_reference
  - marker: b
    text: या “जोड़ से न उतर जाए” अथवा “उसका जोड़ न उखड़ जाए”; शरीर की इस छवि में यूनानी क्रिया का अधिक चिकित्सकीय अर्थ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τροχιὰς
  choice: मार्ग
  rationale: इस शब्द का शाब्दिक अर्थ पहिए की लीक या पगडंडी हो सकता है, पर इस उपदेशात्मक रूपक में ‘मार्ग’ स्वाभाविक और स्पष्ट है।
- source_word: ὀρθὰς
  choice: सीधे
  rationale: यह ठीक दिशा में और उचित रीति से बनाए गए मार्ग का बोध कराता है तथा नीतिवचन 4:26 की प्रतिध्वनि बनाए रखता है।
- source_word: ποιεῖτε
  choice: बनाओ
  rationale: वर्तमानकालीन आज्ञार्थक निरंतर प्रयत्न की पुकार करता है; ‘बनाओ’ इसका सीधा और सहज रूप है।
- source_word: τοῖς ποσὶν ὑμῶν
  choice: अपने पैरों के लिए
  rationale: सम्प्रदान कारक यहाँ उन पैरों के हित या संदर्भ को व्यक्त करता है जिनके लिए मार्ग बनाए जाने हैं।
- source_word: τὸ χωλὸν
  choice: जो लंगड़ा है
  rationale: नपुंसकलिंग एकवचन विशेषण संज्ञा के रूप में प्रयुक्त है। यह अनुवाद किसी व्यक्ति, समुदाय के निर्बल सदस्य, या रूपकात्मक दुर्बलता में से किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἐκτραπῇ
  choice: मार्ग से हट न जाए
  rationale: क्रिया का सामान्य अर्थ एक ओर हटना या भटकना है; मार्ग की छवि के साथ यह स्वाभाविक है। शरीर-संबंधी प्रसंग में संभव चिकित्सकीय अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἰαθῇ
  choice: चंगा हो जाए
  rationale: यह क्रिया सामान्यतः चंगा किए जाने को व्यक्त करती है और पद की शारीरिक तथा पुनर्स्थापनात्मक छवि दोनों बनाए रखती है।
- source_word: μᾶλλον
  choice: बल्कि
  rationale: यह पिछले नकारात्मक परिणाम के विपरीत वांछित परिणाम को प्रस्तुत करता है।
theological_decisions:
- issue: शारीरिक भाषा का वास्तविक अथवा रूपकात्मक अर्थ
  choice: मुख्य पाठ में शारीरिक भाषा को बनाए रखते हुए यह निश्चित नहीं किया गया कि ‘जो लंगड़ा है’ शारीरिक रूप से दुर्बल व्यक्ति है, आत्मिक रूप से निर्बल विश्वासी है, या व्यापक रूप से कोई असुरक्षित जन।
  alternative: इसे केवल आत्मिक रूप से निर्बल विश्वासियों या केवल शारीरिक रूप से लंगड़े व्यक्तियों के लिए प्रयुक्त मानना।
  rationale: यूनानी पाठ देह की छवि को उपदेशात्मक प्रसंग में रखता है, पर उसके संकेत को स्पष्ट रूप से किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्ग’, ‘लंगड़ा’ और ‘चंगा’ जैसे सामान्य शब्द मूल की देह तथा चाल संबंधी रूपकात्मक संगति बनाए रखते हैं।
