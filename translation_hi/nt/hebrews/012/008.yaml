source:
  edition: SBLGNT
  text: εἰ δὲ χωρίς ἐστε παιδείας ἧς μέτοχοι γεγόνασι πάντες, ἄρα νόθοι ⸂καὶ οὐχ υἱοί ἐστε⸃.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/008.yaml
  text: But if you are without discipline, of which all have become sharers, then you are illegitimate children and not sons.
translation:
  language: hi
  text: पर यदि तुम अनुशासन से वंचित हो, जिसमें सभी सहभागी हुए हैं, तो तुम अवैध संतान हो, पुत्र नहीं हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παιδείας
  choice: अनुशासन
  rationale: यहाँ संदर्भ पिता द्वारा संतान को सुधारने और प्रशिक्षित करने का है; ‘अनुशासन’ दंड तक सीमित किए बिना इस अर्थ को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: μέτοχοι γεγόνασι
  choice: सहभागी हुए हैं
  rationale: यह पूर्णकालीन क्रिया और सहभागी होने के भाव—दोनों को बनाए रखता है।
- source_word: νόθοι
  choice: अवैध संतान
  rationale: यह शब्द उस संतान को दर्शाता है जिसे वैध पुत्र का पारिवारिक दर्जा प्राप्त नहीं; आधुनिक हिंदी में ‘अवैध संतान’ अपेक्षाकृत स्पष्ट और गरिमापूर्ण है।
- source_word: υἱοί
  choice: पुत्र
  rationale: पिता-पुत्र और उत्तराधिकार की मूल रूपक-भाषा बनाए रखने के लिए लिंग-विशिष्ट ‘पुत्र’ रखा गया है।
theological_decisions:
- issue: ‘सभी’ का संदर्भ
  choice: ‘सभी’ को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: ‘परमेश्वर की सभी संतानें’
  rationale: यूनानी पाठ केवल πάντες (‘सभी’) कहता है; संदर्भ इसे स्पष्ट करता है, इसलिए अनुवाद में व्याख्यात्मक शब्द नहीं जोड़े गए।
- issue: संतान और पुत्र के बीच भेद
  choice: ‘अवैध संतान ... पुत्र नहीं’
  alternative: ‘जारज ... बेटे नहीं’
  rationale: मूल की कानूनी-पारिवारिक और उत्तराधिकार-संबंधी तीव्रता सुरक्षित है, जबकि अपमानजनक या अत्यधिक बोलचाल की शब्दावली से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वाक्य की शर्तात्मक संरचना तथा मूल का पारिवारिक रूपक सुरक्षित रखा गया है।
