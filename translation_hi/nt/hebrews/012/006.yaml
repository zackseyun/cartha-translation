  text: ὃν γὰρ ἀγαπᾷ κύριος παιδεύει, μαστιγοῖ δὲ πάντα υἱὸν ὃν παραδέχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/006.yaml
  text: For the Lord disciplines the one he loves[b][a], and he scourges every son whom he receives.
translation:
  language: hi
  text: क्योंकि प्रभु जिससे प्रेम करता है, उसे अनुशासित करता है, और हर उस पुत्र को जिसे वह स्वीकार करता है[b], कोड़े लगाता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोड़े मारता है” या “कोड़े से पीटता है।” यूनानी क्रिया बहुत प्रबल है और कठोर अनुशासन को चित्रित करती है।
    reason: lexical_alternative
  - marker: b
    text: “हर पुत्र” मूल यूनानी शब्दों को दर्शाता है; संदर्भ में यह अभिव्यक्ति प्रतिनिधिक है और उन सभी को सम्मिलित करती है जिन्हें परमेश्वर अपनी संतान के रूप में स्वीकार करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है और हिन्दी में कारणसूचक संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγαπᾷ
  choice: प्रेम करता है
  rationale: यह ἀγαπάω का स्पष्ट, सामान्य और गरिमापूर्ण हिन्दी रूप है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह उपाधि के धार्मिक और साहित्यिक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: παιδεύει
  choice: अनुशासित करता है
  rationale: यह शब्द सुधार, प्रशिक्षण और दंडात्मक शिक्षा—इन संयुक्त भावों को व्यक्त करता है; केवल 'दंड देता है' कहना इसके शिक्षात्मक पक्ष को संकुचित कर देता।
- source_word: μαστιγοῖ
  choice: कोड़े भी लगाता है
  rationale: मूल क्रिया की कठोरता और शारीरिक दंड की प्रबल उपमा को बिना नरम किए सहज आधुनिक हिन्दी में रखता है।
- source_word: δὲ
  choice: और ... भी
  rationale: यह दूसरे उपवाक्य को निरंतरता और बल के साथ जोड़ता है; यहाँ तीखा विरोध आवश्यक नहीं है।
- source_word: πάντα υἱὸν
  choice: जिस किसी पुत्र को
  rationale: यह 'हर पुत्र' के व्यापक प्रतिनिधिक अर्थ और एकवचन संबंधवाचक रचना दोनों को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है, साथ ही पुत्रत्व की छवि बनाए रखता है।
- source_word: παραδέχεται
  choice: अपना लेता है
  rationale: संदर्भ में यह केवल सामान्य स्वागत नहीं, बल्कि पुत्र के रूप में स्वीकार करने का संबंधपरक भाव देता है।
theological_decisions:
- issue: υἱός में पुत्रत्व की लैंगिक और संबंधपरक छवि
  choice: पुत्र
  alternative: संतान
  rationale: इब्रानियों 12 का निकट संदर्भ पुत्रत्व की छवि पर बल देता है। 'पुत्र' मूल के स्पष्ट पुल्लिंग रूप को सुरक्षित रखता है; पादटिप्पणी इसके प्रतिनिधिक विस्तार को स्पष्ट करती है।
- issue: μαστιγοῖ द्वारा व्यक्त ईश्वरीय अनुशासन की कठोरता
  choice: कोड़े भी लगाता है
  alternative: कठोर अनुशासन देता है
  rationale: मूल में प्रयुक्त प्रबल शारीरिक उपमा को नरम नहीं किया गया है। इससे प्रेम और पीड़ादायक अनुशासन के बीच पाठ का वास्तविक तनाव बना रहता है।
- issue: παραδέχεται का संबंधपरक अर्थ
  choice: अपना लेता है
  alternative: स्वीकार करता है
  rationale: पुत्रत्व के संदर्भ में 'अपना लेता है' स्वीकार और संबंध—दोनों को व्यक्त करता है, पर इसे तकनीकी रूप से केवल दत्तक ग्रहण तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। 'अनुशासित करता है' शिक्षात्मक-सुधारात्मक अर्थ बनाए रखता है, जबकि 'कोड़े भी लगाता है' मूल उपमा की कठोरता को सुरक्षित रखता है।
