lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह संबंधसूचक निष्कर्षवाचक शब्द पहले की सहनशीलता और अनुशासन संबंधी चर्चा से इस उपदेश को जोड़ता है।
- source_word: παρειμένας χεῖρας
  choice: ढीले पड़े हाथों
  rationale: παρίημι से बना कृदन्त नीचे लटके, शिथिल या ढीले पड़ चुके हाथों का चित्र प्रस्तुत करता है। यह हिन्दी अभिव्यक्ति शारीरिक बिंब और निरुत्साह का संकेत दोनों बनाए रखती है।
- source_word: παραλελυμένα γόνατα
  choice: निर्बल घुटनों
  rationale: पूर्ण कृदन्त उन घुटनों को दर्शाता है जो दुर्बल हो गए हैं। ‘निर्बल’ प्रसंगानुकूल है और चिकित्सकीय लकवे का अनावश्यक अर्थ नहीं लाता।
- source_word: ἀνορθώσατε
  choice: सीधा करो
  rationale: आज्ञार्थक क्रिया का मूल बिंब किसी झुकी या अशक्त वस्तु को फिर सीधा करने का है। ‘सीधा करो’ यशायाह 35:3 की प्रतिध्वनि और शरीर-संबंधी रूपक को ‘बलवन्त करो’ की अपेक्षा अधिक प्रत्यक्ष रूप से सुरक्षित रखता है।
theological_decisions:
- issue: शारीरिक दुर्बलता के रूपक का अर्थ
  choice: शरीर-संबंधी बिंब को बनाए रखते हुए इसे साहस और धीरज के नवीकरण की प्रेरणा के रूप में प्रस्तुत करना
  alternative: इसे केवल शारीरिक मुद्रा सुधारने की शाब्दिक आज्ञा समझना
  rationale: इब्रानियों 12 का निकट प्रसंग धीरज, अनुशासन और दौड़ में बने रहने पर केंद्रित है; साथ ही शब्दावली यूनानी परंपरा के यशायाह 35:3 की प्रतिध्वनि करती है। इसलिए रूपक को न मिटाना और न केवल शारीरिक अर्थ तक सीमित करना उचित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘ढीले पड़े’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘सीधा करो’ मूल शारीरिक बिंब को स्पष्ट रखता है।
