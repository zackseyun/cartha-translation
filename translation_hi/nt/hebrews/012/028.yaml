source:
  edition: SBLGNT
  text: διὸ βασιλείαν ἀσάλευτον παραλαμβάνοντες ἔχωμεν χάριν, δι’ ἧς ⸀λατρεύωμεν εὐαρέστως τῷ θεῷ μετὰ ⸂εὐλαβείας καὶ δέους⸃,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/012/028.yaml
  text: Therefore[a], since we are receiving an unshakable kingdom, let us have grace, through which we may serve God acceptably with reverence and awe,
translation:
  language: hi
  text: इसलिए, चूँकि हमें ऐसा राज्य मिल रहा है जिसे हिलाया नहीं जा सकता, तो हम अनुग्रह रखें[a], जिसके द्वारा हम श्रद्धा और भय के साथ परमेश्वर की ऐसी सेवा करें जो उसे भाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम कृतज्ञ रहें।” यूनानी पद ἔχωμεν χάριν का अर्थ “हम अनुग्रह रखें” अथवा मुहावरेदार रूप में “हम कृतज्ञ रहें” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले प्रसंग में सृजी हुई वस्तुओं के हिलाए और हटाए जाने से निकले निष्कर्ष को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: βασιλείαν ἀσάλευτον
  choice: ऐसा राज्य जिसे हिलाया नहीं जा सकता
  rationale: यह ἀσάλευτον का अर्थ स्पष्ट रखता है और निकटवर्ती प्रसंग में हिलने वाली वस्तुओं के साथ उसका विरोध भी बनाए रखता है।
- source_word: παραλαμβάνοντες
  choice: जब हमें ... मिल रहा है
  rationale: वर्तमान कृदंत की जारी प्रक्रिया और मुख्य उपदेश से उसके परिस्थितिजन्य संबंध को व्यक्त करता है; इसे पूर्ण भूतकाल बनाकर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἔχωμεν χάριν
  choice: हम अनुग्रह को थामे रहें
  rationale: χάρις के मूल अर्थ ‘अनुग्रह’ को और उसके बाद के δι’ ἧς के साधनवाचक संबंध को सुरक्षित रखता है। ‘थामे रहें’ हिन्दी में ‘अनुग्रह रखें’ की अपेक्षा अधिक स्वाभाविक है, जबकि कृतज्ञता वाला संभव मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: δι’ ἧς
  choice: जिसके द्वारा
  rationale: स्त्रीलिंग संबंधवाचक सर्वनाम का पूर्ववर्ती χάριν से संबंध और διά का साधनवाचक भाव स्पष्ट करता है।
- source_word: λατρεύωμεν
  choice: हम ... परमेश्वर की ... सेवा करें
  rationale: λατρεύω की परमेश्वर को अर्पित धार्मिक सेवा की व्यापक धारणा को बनाए रखता है और इसे केवल आंतरिक आराधना तक सीमित नहीं करता।
- source_word: εὐαρέστως
  choice: जो उसे भाए
  rationale: परमेश्वर को प्रसन्न और स्वीकार्य होने के मूल्यांकनात्मक भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: μετὰ εὐλαβείας καὶ δέους
  choice: श्रद्धा और भय के साथ
  rationale: εὐλάβεια के श्रद्धापूर्ण आदर और δέος के भय अथवा विस्मययुक्त संकोच—दोनों अलग भावों को बनाए रखता है; केवल ‘आदर’ कहने से दूसरे शब्द की तीव्रता घट सकती थी।
theological_decisions:
- issue: ἔχωμεν χάριν में χάριν का अर्थ
  choice: अनुग्रह को थामे रहें
  alternative: हम कृतज्ञ रहें / धन्यवाद दें
  rationale: अगला स्त्रीलिंग संबंधवाचक वाक्यांश δι’ ἧς स्वाभाविक रूप से χάριν की ओर संकेत करता है और अनुग्रह को स्वीकार्य सेवा का साधन बताता है। फिर भी ‘कृतज्ञ रहें’ एक प्राचीन और व्याकरणतः संभव मुहावरेदार अर्थ है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिसे हिलाया नहीं जा सकता’ प्रसंगगत रूपक को स्पष्ट रखता है; ‘श्रद्धा और भय’ मूल के दोनों संज्ञात्मक भावों को अलग-अलग व्यक्त करता है।
