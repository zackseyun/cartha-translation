  text: whose voice shook the earth then[a], but now he has promised, saying[b], “Yet once more I will shake not only the earth but also the heaven.”
translation:
  language: hi
  text: 'जिसकी वाणी ने उस समय पृथ्वी को हिला दिया था, पर अब उसने यह कहते हुए प्रतिज्ञा की है: “एक बार फिर मैं न केवल पृथ्वी को, बल्कि स्वर्ग को भी[a] हिलाऊँगा।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकाश को।” यूनानी में यह शब्द एकवचन और निश्चित उपपद के साथ है।
    reason: lexical_alternative
  - marker: b
    text: हाग्गै 2:6 से उद्धरण।
    reason: cross_reference
lexical_decisions:
- source_word: οὗ ἡ φωνὴ
  choice: जिसकी वाणी
  rationale: सम्बन्धवाचक सर्वनाम पिछले प्रसंग में परमेश्वर की ओर संकेत करता है। ‘वाणी’ व्यक्तिगत ईश्वरीय बोलने और सीनै के प्रसंग, दोनों के अनुकूल है।
- source_word: ἐσάλευσεν
  choice: हिला दिया था
  rationale: भूतकाल की उस घटना का सशक्त और स्वाभाविक वर्णन करता है तथा τότε के साथ वर्तमान प्रतिज्ञा से कालगत विरोध स्पष्ट रखता है।
- source_word: τὴν γῆν
  choice: पृथ्वी को
  rationale: आकाश के साथ विरोध में यह स्थानीय भूमि नहीं, बल्कि व्यापक सृष्टिगत क्षेत्र को दर्शाता है।
- source_word: νῦν δὲ ἐπήγγελται
  choice: पर अब उसने ... प्रतिज्ञा की है
  rationale: δέ का विरोध और पूर्णकाल की वर्तमान तक बनी हुई प्रतिज्ञा—दोनों सुरक्षित रहते हैं।
- source_word: Ἔτι ἅπαξ
  choice: एक बार फिर
  rationale: भविष्य में एक और निर्णायक हिलाए जाने का स्वाभाविक हिन्दी रूप है; ἔτι और ἅπαξ की संयुक्त कालगत बलवत्ता को व्यक्त करता है।
- source_word: σείσω
  choice: हिलाऊँगा
  rationale: भविष्यकाल और सृष्टिगत कम्पन की भविष्यद्वाणी-संबंधी छवि को सीधे व्यक्त करता है।
- source_word: οὐ μόνον ... ἀλλὰ καὶ
  choice: न केवल ... बल्कि ... भी
  rationale: यूनानी सहसम्बन्धी रचना का प्रचलित और स्पष्ट हिन्दी समकक्ष है।
- source_word: τὸν οὐρανόν
  choice: आकाश को
  rationale: γῆ के साथ व्यापक पृथ्वी–आकाश युग्म को बनाए रखता है। ‘स्वर्ग’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: सम्बन्धवाचक सर्वनाम और प्रतिज्ञा करने वाले का संकेत
  choice: परमेश्वर को वह व्यक्ति माना गया है जिसकी वाणी ने पृथ्वी को हिलाया और जिसने अब प्रतिज्ञा की है।
  alternative: ऐसा अधिक निर्वैयक्तिक अनुवाद जिसमें कर्ता अस्पष्ट हो जाए।
  rationale: निकटवर्ती प्रसंग और हाग्गै का उद्धरण परमेश्वर को वक्ता बताते हैं; अनुवाद इससे आगे कोई अतिरिक्त धर्मसैद्धान्तिक पहचान नहीं जोड़ता।
- issue: पृथ्वी और आकाश की भाषा का विस्तार
  choice: γῆ और οὐρανός को व्यापक सृष्टिगत अर्थ में ‘पृथ्वी’ और ‘आकाश’ कहा गया है।
  alternative: ‘देश/भूमि’ और ‘आसमान’, अथवा ‘पृथ्वी’ और ‘स्वर्ग’।
  rationale: उद्धरण सृष्टि के दोनों व्यापक क्षेत्रों का विरोध प्रस्तुत करता है। यह चयन घटना की विधि को अनावश्यक रूप से निश्चित किए बिना उसके सृष्टिगत विस्तार को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘वाणी’, ‘प्रतिज्ञा’ और ‘पृथ्वी’ बाइबलीय प्रसंग के अनुरूप हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है। उद्धरण-सूचक λέγων को ‘यह कहते हुए’ से व्यक्त किया गया है।
