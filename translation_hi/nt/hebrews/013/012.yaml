base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/012.yaml
  text: Therefore Jesus also suffered outside the gate[b][a], so that he might sanctify the people through his own blood.
translation:
  language: hi
  text: इसलिए यीशु ने भी उस प्रजा को अपने ही लहू के द्वारा पवित्र करने के लिए[a] द्वार के बाहर[b] दुःख सहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पवित्र ठहराने’ अथवा ‘समर्पित करने’ के लिए।
    reason: lexical_alternative
  - marker: b
    text: ‘द्वार के बाहर’ से संभवतः यरूशलेम के बाहर वह स्थान अभिप्रेत है जहाँ यीशु ने दुःख सहा। यह पिछले प्रसंग में बलिदान के अवशेषों को छावनी के बाहर ले जाने की बात की भी प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यीशु के दुःख को पिछले पद में वर्णित बलिदान-संबंधी नमूने के अनुरूप जोड़ता है।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नाम का मानक हिन्दी रूप।
- source_word: ἵνα ἁγιάσῃ
  choice: पवित्र करने के लिए
  rationale: ἵνα के उद्देश्य-बोध और ἁγιάζω के पवित्रीकरण अथवा अर्पण-संबंधी अर्थ को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: διὰ τοῦ ἰδίου αἵματος
  choice: अपने ही लहू के द्वारा
  rationale: διά के साधन-बोध तथा ἰδίου के बलाघात को बनाए रखता है; ‘लहू’ इब्रानियों के बलिदान-संबंधी प्रसंग के अनुकूल है।
- source_word: τὸν λαόν
  choice: लोगों को
  rationale: मूल में निश्चित समुदाय अभिप्रेत है, पर ‘परमेश्वर के लोग’ जोड़ना पाठ से अधिक स्पष्ट व्याख्या होती; इसलिए संक्षिप्त मूल अभिव्यक्ति रखी गई है।
- source_word: ἔξω τῆς πύλης
  choice: फाटक के बाहर
  rationale: एकवचन πύλη को बनाए रखता है और मूल में अनुपस्थित ‘नगर’ या ‘यरूशलेम’ नहीं जोड़ता।
- source_word: ἔπαθεν
  choice: दुःख सहा
  rationale: πάσχω के पूर्ण हुए ऐतिहासिक दुःख को स्वाभाविक हिन्दी में सीधे व्यक्त करता है।
theological_decisions:
- issue: बलिदान-संबंधी प्रसंग में ἁγιάζω का अर्थ
  choice: पवित्र करने
  alternative: पवित्र ठहराने; समर्पित करने
  rationale: ‘पवित्र करने’ से धार्मिक और बलिदान-संबंधी अर्थ बना रहता है, पर किसी विशिष्ट सम्प्रदाय की पवित्रीकरण-विषयक व्याख्या आरोपित नहीं होती।
- issue: τὸν λαόν का दायरा
  choice: लोगों को
  alternative: परमेश्वर के लोगों को
  rationale: प्रसंग परमेश्वर की वाचा के लोगों की ओर संकेत करता है, किन्तु यूनानी पाठ में ‘परमेश्वर के’ स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- issue: ‘फाटक के बाहर’ का संकेत
  choice: फाटक के बाहर
  alternative: नगर के फाटक के बाहर; यरूशलेम के बाहर
  rationale: वाक्यांश संभवतः यीशु के यरूशलेम से बाहर दुःख सहने और पिछले प्रसंग के छावनी-बाहर वाले बलिदान-संबंधी ढाँचे को प्रतिध्वनित करता है, पर मूल की संक्षिप्तता और संकेतात्मकता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज धार्मिक शैली अपनाई गई है। ‘लहू’ बलिदान-संबंधी बाइबलीय प्रसंग को बनाए रखता है; वाक्यक्रम उद्देश्य और मुख्य घटना दोनों को स्पष्ट करता है।
