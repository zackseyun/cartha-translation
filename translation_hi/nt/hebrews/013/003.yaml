source:
  edition: SBLGNT
  text: μιμνῄσκεσθε τῶν δεσμίων ὡς συνδεδεμένοι, τῶν κακουχουμένων ὡς καὶ αὐτοὶ ὄντες ἐν σώματι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/003.yaml
  text: Remember those in prison[a], as though imprisoned with them; those who are mistreated[b], since you yourselves also are in the body.
translation:
  language: hi
  text: जो कैद में हैं, उन्हें ऐसे याद रखो मानो तुम भी उनके साथ बँधे हो[a]; और जिनके साथ दुर्व्यवहार किया जा रहा है, उन्हें भी याद रखो, क्योंकि तुम स्वयं भी शरीर में हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो तुम उनके साथ कैद में हो।” यूनानी में शाब्दिक रूप से कैदियों के साथ बँधे होने का बिम्ब है।
    reason: lexical_alternative
  - marker: b
    text: “शरीर में” का सम्भव अर्थ मसीह की देह के सदस्य होना भी हो सकता है; पर अधिक सम्भावना है कि यह सभी मनुष्यों की साझा शारीरिक असुरक्षा और कष्ट सह सकने की दशा की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μιμνῄσκεσθε
  choice: याद रखो
  rationale: वर्तमान काल की आज्ञा निरंतर स्मरण और व्यावहारिक चिंता का भाव रखती है। ‘याद रखो’ आधुनिक हिन्दी में स्वाभाविक है और इस सतत दायित्व को संदर्भ में व्यक्त करता है।
- source_word: τῶν δεσμίων
  choice: जो कैद में हैं
  rationale: δέσμιος मूलतः बन्धन में पड़े व्यक्ति, प्रायः कैदी, को दर्शाता है। यह चयन सहज हिन्दी में सामाजिक स्थिति स्पष्ट करता है।
- source_word: ὡς συνδεδεμένοι
  choice: मानो तुम भी उनके साथ बँधे हो
  rationale: συνδεδεμένοι में ‘साथ बँधे होने’ का सजीव बिम्ब है। यह अनुवाद कैदियों के साथ गहरी एकजुटता को व्यक्त करते हुए यूनानी रूपक को बनाए रखता है।
- source_word: τῶν κακουχουμένων
  choice: जिनके साथ दुर्व्यवहार किया जा रहा है
  rationale: κακουχέομαι दूसरों के हाथों बुरा व्यवहार, उत्पीड़न या कष्ट सहने का निष्क्रिय भाव देता है। यह रूप उस जारी पीड़ा और उसके बाहरी कर्ताओं को स्पष्ट रखता है।
- source_word: ὡς καὶ αὐτοὶ ὄντες ἐν σώματι
  choice: क्योंकि तुम स्वयं भी शरीर में हो
  rationale: शाब्दिक पद ‘शरीर में’ को सुरक्षित रखा गया है। ‘क्योंकि’ प्रसंग में इसके प्रेरक/कारणसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना वाक्यांश की सम्भावित बहुअर्थता मिटाए।
theological_decisions:
- issue: ἐν σώματι (‘शरीर में’) का अर्थ
  choice: साझी मानवीय शारीरिक दशा और कष्ट सहने की असुरक्षा
  alternative: मसीह की देह के सदस्य होना
  rationale: संदर्भ कैदियों और दुर्व्यवहार सहने वालों के प्रति सहानुभूति की माँग करता है, इसलिए साझा शारीरिक असुरक्षा प्रमुख अर्थ प्रतीत होती है। फिर भी मुख्य पाठ में शाब्दिक ‘शरीर में’ रखा गया है और वैकल्पिक सामुदायिक अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। समानान्तर आज्ञा को स्पष्ट करने के लिए दूसरे खंड में ‘उन्हें भी याद रखो’ दोहराया गया है। ‘साथ बँधे’ मूल यूनानी बिम्ब को बनाए रखता है; ‘शरीर में’ की धर्मवैचारिक खुली सम्भावना सुरक्षित है।
