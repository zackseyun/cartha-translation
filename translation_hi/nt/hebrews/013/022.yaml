source:
  edition: SBLGNT
  text: Παρακαλῶ δὲ ὑμᾶς, ἀδελφοί, ἀνέχεσθε τοῦ λόγου τῆς παρακλήσεως, καὶ γὰρ διὰ βραχέων ἐπέστειλα ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/022.yaml
  text: I urge you[a], brothers, bear with this word of exhortation[b], for I have written to you briefly.
translation:
  language: hi
  text: भाइयो[a], मैं तुमसे आग्रह करता हूँ कि इस उपदेशात्मक संदेश[b] को धैर्य से स्वीकार करो, क्योंकि मैंने तुम्हें संक्षेप में लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भाइयो और बहनो’; यूनानी में ‘भाइयो’ है, जो पूरी मंडली के लिए समावेशी संबोधन हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘इस उपदेशात्मक संदेश’ का अनुवाद ‘प्रोत्साहन का संदेश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Παρακαλῶ
  choice: मैं तुमसे आग्रह करता हूँ
  rationale: यहाँ παρακαλέω लेखक की गंभीर, व्यक्तिगत विनती व्यक्त करता है; ‘आग्रह करता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और आग्रह की शक्ति बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: δέ यहाँ हल्का संक्रमण सूचित करता है, प्रबल विरोध नहीं। हिन्दी में वाक्य के प्रवाह से यह संक्रमण स्पष्ट है; ‘अब’ जोड़ने पर स्रोत में निहित न होने वाला काल-संकेत आ सकता है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: सम्बोधन बहुवचन का शाब्दिक रूप ‘भाइयो’ है। यह सम्भवतः पूरी मंडली के लिए समावेशी सम्बोधन है, इसलिए वह सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: ἀνέχεσθε
  choice: धैर्य से स्वीकार करो
  rationale: ἀνέχομαι यहाँ संदेश को सहनशीलता और धैर्य के साथ ग्रहण करने का आग्रह करता है। केवल ‘सह लो’ हिन्दी में अनावश्यक रूप से नकारात्मक लग सकता है; यह रूप धैर्यपूर्ण ग्रहणशीलता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ λόγου τῆς παρακλήσεως
  choice: प्रोत्साहन के इस वचन
  rationale: λόγος संप्रेषित वचन या संदेश है, जबकि παράκλησις में प्रोत्साहन और उपदेश—दोनों अर्थ-छायाएँ हैं। मुख्य पाठ में सहज ‘प्रोत्साहन के इस वचन’ रखा गया है और वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है। ‘इस’ यूनानी में प्रत्यक्ष संकेतवाचक नहीं, पर वर्तमान रचना की ओर स्वाभाविक संकेत करता है।
- source_word: καὶ γὰρ
  choice: क्योंकि
  rationale: यह पदबंध पिछले आग्रह का कारण देता है। हिन्दी में ‘क्योंकि’ उसका व्याख्यात्मक-कारणात्मक बल पर्याप्त रूप से व्यक्त करता है।
- source_word: διὰ βραχέων
  choice: संक्षेप में
  rationale: यह यूनानी मुहावरा ‘कम शब्दों में’ या ‘संक्षेप में’ का अर्थ देता है; ‘संक्षेप में’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: ἐπέστειλα ὑμῖν
  choice: मैंने तुम्हें ... लिखा है
  rationale: ἐπέστειλα पत्र लिखने या लिखित संदेश भेजने को सूचित करता है। ‘मैंने तुम्हें लिखा है’ पाठकों के सामने उपस्थित पत्र के संदर्भ में स्वाभाविक हिन्दी है और पूर्ण क्रिया का बल बनाए रखता है।
theological_decisions:
- issue: ἀδελφοί में लिंगयुक्त सम्बोधन
  choice: भाइयो
  alternative: भाइयो और बहनो
  rationale: मुख्य पाठ यूनानी के व्याकरणिक पुल्लिंग बहुवचन को बनाए रखता है। चूँकि यह सम्बोधन सम्भवतः पूरी, मिश्रित मंडली को समावेशी रूप से संबोधित करता है, उस अर्थ को पाद-टिप्पणी में स्पष्ट किया गया है।
- issue: παράκλησις का अर्थ-क्षेत्र
  choice: प्रोत्साहन
  alternative: उपदेश
  rationale: शब्द में सांत्वना, प्रोत्साहन और आग्रहपूर्ण उपदेश की अर्थ-छायाएँ हो सकती हैं। संदर्भ लेखक की विनती और पूरे संदेश को ग्रहण करने का है; ‘प्रोत्साहन’ मुख्य पाठ में स्वाभाविक है, जबकि ‘उपदेश’ को पाद-टिप्पणी में रखा गया है ताकि तनाव समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और प्रत्यक्ष सम्बोधन रखा गया है। ‘तुम’ बहुवचन सामुदायिक सम्बोधन के रूप में प्रयुक्त है। अत्यधिक संस्कृतनिष्ठ ‘अनुनय’ या कठोर ‘सह लो’ से बचते हुए स्रोत के गंभीर आग्रह और धैर्यपूर्ण ग्रहणशीलता को बनाए रखा गया है।
