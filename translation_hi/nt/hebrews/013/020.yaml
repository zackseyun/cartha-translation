reference: Hebrews 13:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὁ δὲ θεὸς τῆς εἰρήνης, ὁ ἀναγαγὼν ἐκ νεκρῶν τὸν ποιμένα τῶν προβάτων τὸν μέγαν ἐν αἵματι διαθήκης αἰωνίου, τὸν κύριον ἡμῶν Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/020.yaml
  text: May the God of peace[a], who brought up from the dead our Lord Jesus, the great shepherd of the sheep, by the blood of an eternal covenant,
translation:
  language: hi
  text: शान्ति का परमेश्वर, जिसने अनन्त वाचा के लहू के द्वारा भेड़ों के महान चरवाहे, हमारे प्रभु यीशु को मरे हुओं में से उठा लाया,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ θεὸς τῆς εἰρήνης
  choice: शान्ति का परमेश्वर
  rationale: δέ यहाँ प्रार्थनात्मक आशीर्वचन की ओर संक्रमण कराता है; हिन्दी में अलग संयोजक जोड़े बिना यह संक्रमण स्वाभाविक है। जननात्मक पदबंध θεὸς τῆς εἰρήνης का सीधा और प्रचलित रूप ‘शान्ति का परमेश्वर’ है।
- source_word: ὁ ἀναγαγὼν ἐκ νεκρῶν
  choice: जिसने ... मरे हुओं में से उठा लाया
  rationale: ἀνάγω के ‘ऊपर/बाहर ले आना’ बिंब को ‘उठा लाया’ बनाए रखता है, जबकि ἐκ νεκρῶν के लिए स्वाभाविक पुनरुत्थान-संबंधी अभिव्यक्ति ‘मरे हुओं में से’ है।
- source_word: τὸν ποιμένα τῶν προβάτων τὸν μέγαν
  choice: भेड़ों के महान चरवाहे
  rationale: यह ποιμήν और πρόβατα के चरवाही-बिंब तथा μέγας के बल को सीधे बनाए रखता है।
- source_word: ἐν αἵματι διαθήκης αἰωνίου
  choice: अनन्त वाचा के लहू के द्वारा
  rationale: ἐν को यहाँ साधनसूचक ‘के द्वारा’ के रूप में प्रस्तुत किया गया है; διαθήκη के लिए इब्रानियों के प्रसंग में ‘वाचा’ और αἰώνιος के लिए ‘अनन्त’ उपयुक्त हैं।
- source_word: τὸν κύριον ἡμῶν Ἰησοῦν
  choice: हमारे प्रभु यीशु
  rationale: यह यूनानी संबंध और उपाधि को स्वाभाविक हिन्दी क्रम में रखता है तथा यीशु को उठाए गए महान चरवाहे के रूप में पहचानता है।
theological_decisions:
- issue: ἐν αἵματι διαθήκης αἰωνίου का वाक्यगत संबंध
  choice: इसे परमेश्वर द्वारा यीशु को मरे हुओं में से उठा लाने के साधन अथवा आधार से संबद्ध करते हुए ‘अनन्त वाचा के लहू के द्वारा’ रखा गया है।
  alternative: 'इसे मुख्यतः ‘भेड़ों के महान चरवाहे’ के साथ संबद्ध समझा जा सकता है: ‘अनन्त वाचा के लहू में/के द्वारा भेड़ों के महान चरवाहे’।'
  rationale: यूनानी शब्दक्रम दोनों संबंधों की कुछ संभावना छोड़ता है। मुख्य पाठ एक स्वाभाविक अर्थ देता है, पर पादटिप्पणी दूसरे संभावित संबंध को सुरक्षित रखती है और प्रायश्चित या पुनरुत्थान की प्रक्रिया को अनावश्यक रूप से नहीं खोलती।
- issue: आशीर्वचन की इच्छासूचक शक्ति
  choice: पद 20 को आश्रित आरंभिक उपवाक्य के रूप में रखा गया है, जिसका मुख्य इच्छासूचक क्रियापद पद 21 में आता है।
  alternative: अकेले पद को पूर्ण बनाने के लिए आरंभ में ‘ऐसा हो कि’ या ‘वह करे’ जोड़ना।
  rationale: मूल यूनानी में इस पद पर मुख्य इच्छासूचक क्रिया नहीं है; वह अगले पद में है। इसलिए यहाँ वाक्य को अल्पविराम पर खुला रखना स्रोत की संरचना को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘शान्ति’, ‘वाचा’, ‘लहू’, ‘प्रभु’ और ‘चरवाहा’ बाइबलीय संदर्भ में परिचित शब्द हैं। पद 20 मूल वाक्य का अधूरा आरंभ है, इसलिए अन्त में अल्पविराम रखा गया है।
