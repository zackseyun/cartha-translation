  text: ἔχομεν θυσιαστήριον ἐξ οὗ φαγεῖν οὐκ ἔχουσιν ἐξουσίαν οἱ τῇ σκηνῇ λατρεύοντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/010.yaml
  text: We have an altar from which those who serve at the tabernacle have no right to eat[a][b].
translation:
  language: hi
  text: हमारे पास एक वेदी है, जिस वेदी से खाने का अधिकार उन लोगों को नहीं है जो तंबू में धार्मिक सेवा करते हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “वे लोग जो तंबू में धार्मिक सेवा करते हैं।” यह वाक्यांश पुराने वाचा के पवित्रस्थान में सेवा करने वालों की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इस “वेदी” को अलग-अलग ढंग से समझा गया है—स्वयं मसीह, क्रूस, स्वर्गीय वेदी, या मसीह के बलिदान से मिलने वाले लाभ। यूनानी पाठ यहाँ इस बिंब का कोई एक विशिष्ट अर्थ निर्धारित नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔχομεν
  choice: हमारी ... है
  rationale: यूनानी वर्तमानकालीन ‘हमारे पास है’ को स्वाभाविक हिन्दी स्वामित्व-वाक्य में व्यक्त किया गया है; इसमें लेखक और पाठक दोनों सम्मिलित हैं।
- source_word: θυσιαστήριον
  choice: वेदी
  rationale: यह ‘altar’ का मानक, सीधा हिन्दी पर्याय है और मूल के धार्मिक-बलिदानी बिंब को बिना उसका तात्पर्य निर्धारित किए बनाए रखता है।
- source_word: ἐξ οὗ
  choice: जिसमें से
  rationale: ἐκ स्रोत को व्यक्त करता है। वेदी पर चढ़ाए गए अर्पण में से खाने के सांस्कृतिक बिंब के लिए हिन्दी में ‘जिसमें से’ स्वाभाविक है।
- source_word: φαγεῖν
  choice: खाने
  rationale: क्रिया का सरल अर्थ ‘खाना’ है; ‘अधिकार ... नहीं है’ के साथ हिन्दी में भाववाचक रूप स्वाभाविक बैठता है।
- source_word: οὐκ ἔχουσιν ἐξουσίαν
  choice: अधिकार ... नहीं है
  rationale: ἐξουσία यहाँ किसी वस्तु में सहभागी होने के मान्य अधिकार या विशेषाधिकार को दर्शाता है; ‘अधिकार नहीं है’ इस अर्थ को स्पष्ट रखता है।
- source_word: οἱ τῇ σκηνῇ λατρεύοντες
  choice: जो पवित्र तंबू में सेवा करते हैं
  rationale: λατρεύω यहाँ उपासना-स्थल की धार्मिक सेवा को दर्शाता है, केवल सामान्य आराधना को नहीं। ‘पवित्र तंबू’ σκηνή के पुराने वाचा के पवित्रस्थान-संबंधी आशय को साधारण पाठकों के लिए स्पष्ट करता है।
theological_decisions:
- issue: इब्रानियों 13:10 में ‘वेदी’ का तात्पर्य
  choice: मुख्य पाठ में केवल ठोस बिंब ‘वेदी’ रखा गया है और उसका विशिष्ट तात्पर्य निर्धारित नहीं किया गया।
  alternative: इसे स्वयं मसीह, क्रूस, स्वर्गीय वेदी, या मसीह के बलिदान से मिलने वाले लाभों के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ यहाँ बिंब को बिना व्याख्या के छोड़ता है। अनुवाद में किसी एक मत को स्थापित करने के बजाय मूल की वास्तविक धर्मवैचारिक खुली अवस्था और तनाव को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण धार्मिक शैली रखी गई है। ‘पवित्र तंबू’ सामान्य पाठक के लिए ‘मिलापवाला तंबू’ से अधिक तत्काल बोधगम्य है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
