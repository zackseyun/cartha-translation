lexical_decisions:
- source_word: φιλαδελφία
  choice: भाई-बहनों का प्रेम
  rationale: यह शब्द पारिवारिक स्नेह की छवि रखते हुए मसीही समुदाय के सभी विश्वासियों के बीच प्रेम को दर्शाता है। आधुनिक हिन्दी में केवल ‘भाईचारा’ पुरुषों तक सीमित या सामान्य सामाजिक बंधुत्व जैसा समझा जा सकता है; ‘भाई-बहनों का प्रेम’ मूल की पारिवारिक भाषा और समावेशी आशय दोनों को स्पष्ट करता है।
- source_word: μενέτω
  choice: बना रहे
  rationale: वर्तमानकालीन आज्ञार्थक रूप किसी जारी अवस्था को कायम रखने का आग्रह करता है। ‘बना रहे’ हिन्दी में ‘जारी रहे/स्थिर रहे’ का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: Ἡ
  choice: अलग शब्द से व्यक्त नहीं
  rationale: यूनानी निश्चित उपपद इस पहचाने हुए सद्गुण को चिह्नित करता है; हिन्दी में इस संक्षिप्त उपदेशात्मक वाक्य में उसका अलग अनुवाद अस्वाभाविक होगा।
theological_decisions:
- issue: φιλαδελφία का दायरा और पारिवारिक, लिंग-सूचक भाषा
  choice: मुख्य पाठ में ‘भाई-बहनों का प्रेम’ रखकर पारिवारिक रूपक और पूरे विश्वासी समुदाय का आशय दोनों व्यक्त किए गए हैं।
  alternative: भाईचारा; आपसी प्रेम; साथी विश्वासियों के लिए प्रेम
  rationale: यूनानी शब्द ‘भाई’ से बनी पारिवारिक भाषा रखता है, पर आरंभिक मसीही प्रयोग में केवल पुरुषों तक सीमित नहीं है। ‘भाई-बहनों’ से मूल रूपक को सामान्य ‘आपसी प्रेम’ में विलीन किए बिना उसका व्यापक सामुदायिक दायरा स्पष्ट होता है।
translation_notes:
  register: संक्षिप्त, आज्ञार्थक और गरिमापूर्ण आधुनिक मानक हिन्दी। ‘बना रहे’ निरंतरता का भाव देता है, और ‘भाई-बहनों’ सामान्य पाठक के लिए समुदाय के समावेशी पारिवारिक संबंध को स्पष्ट करता है।
