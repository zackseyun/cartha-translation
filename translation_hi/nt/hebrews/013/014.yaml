  text: οὐ γὰρ ἔχομεν ὧδε μένουσαν πόλιν, ἀλλὰ τὴν μέλλουσαν ἐπιζητοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/014.yaml
  text: For we do not have a lasting city here[a], but we seek the one that is to come.
translation:
  language: hi
  text: क्योंकि यहाँ हमारा कोई स्थायी नगर नहीं है, बल्कि हम आने वाले नगर की खोज में हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले प्रसंग के लिए कारण या व्याख्या प्रस्तुत करता है; हिंदी में “क्योंकि” इस संबंध को स्वाभाविक रूप से व्यक्त करता है, और οὐ निषेध को “नहीं” से प्रकट किया गया है।
- source_word: ἔχομεν
  choice: हमारा ... है
  rationale: शाब्दिक “हम रखते हैं” की अपेक्षा नगर के संबंध में “हमारा ... है” आधुनिक हिंदी में स्वाभाविक है और ‘हमारे पास होने’ का भाव बनाए रखता है।
- source_word: ὧδε
  choice: यहाँ
  rationale: मूल का स्थान-सूचक अर्थ सीधे रखा गया है; “पृथ्वी पर” कहना प्रसंग की संभावित व्याख्या को पाठ में जोड़ देता।
- source_word: μένουσαν
  choice: स्थायी
  rationale: वर्तमान कृदंत उस नगर को बताता है जो बना रहता या टिकता है; “स्थायी” संक्षिप्त, सहज और आने वाले नगर के साथ विरोध को स्पष्ट करता है।
- source_word: πόλιν
  choice: नगर
  rationale: ठोस संज्ञा πόλις को बिना ‘स्वदेश’, ‘स्वर्ग’ या अन्य व्याख्यात्मक विस्तार के “नगर” रखा गया है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह वर्तमान स्थायी नगर के अभाव और आने वाले नगर की खोज के बीच प्रबल विरोध व्यक्त करता है।
- source_word: τὴν μέλλουσαν
  choice: आने वाले नगर
  rationale: स्त्रीलिंग कृदंत पहले आए πόλιν की ओर संकेत करता है। हिंदी में संज्ञा को दोहराना स्वाभाविक है और भविष्याभिमुख अर्थ स्पष्ट रखता है।
- source_word: ἐπιζητοῦμεν
  choice: खोज में हैं
  rationale: ἐπιζητέω सक्रिय और निरंतर खोज का भाव दे सकता है; “खोज में हैं” आधुनिक हिंदी में स्वाभाविक है और साधारण आकांक्षा से अधिक प्रयत्नशील अभिमुखता व्यक्त करता है।
theological_decisions:
- issue: ‘नगर’ के बिंब का स्वरूप
  choice: मुख्य पाठ में “नगर” ही रखा गया है।
  alternative: “स्वर्ग”, “स्वर्गीय नगर” या “स्वर्गीय यरूशलेम”
  rationale: यह पद स्वयं वर्तमान में न टिकने वाले नगर और आने वाले नगर की बात करता है। इब्रानियों की पत्री में अन्यत्र स्वर्गीय नगर का बिंब विकसित है, पर यहाँ उसे स्पष्ट नाम नहीं दिया गया; इसलिए अनुवाद मूल रूपक और उसकी व्याख्यात्मक खुलावट को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “स्थायी नगर” और “आने वाले नगर” का समानांतर विरोध मूल वाक्य की संक्षिप्तता तथा भाव को बनाए रखता है।
