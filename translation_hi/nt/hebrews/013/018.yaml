source:
  edition: SBLGNT
  text: Προσεύχεσθε περὶ ἡμῶν, ⸀πειθόμεθα γὰρ ὅτι καλὴν συνείδησιν ἔχομεν, ἐν πᾶσιν καλῶς θέλοντες ἀναστρέφεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/018.yaml
  text: Pray for us[a], for we are convinced that we have a good conscience[c][b], since we want to conduct ourselves well in everything.
translation:
  language: hi
  text: हमारे लिए प्रार्थना करो, क्योंकि हमें विश्वास है कि हमारा विवेक अच्छा है और हम हर बात में अच्छा आचरण करना चाहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσεύχεσθε
  choice: प्रार्थना करो
  rationale: वर्तमानकालीन बहुवचन आज्ञार्थक को स्वाभाविक आधुनिक हिन्दी में रखा गया है; निरंतरता को स्पष्ट जोड़ना अनावश्यक अति-अनुवाद होता।
- source_word: περὶ ἡμῶν
  choice: हमारे लिए
  rationale: प्रार्थना के संदर्भ में περί + संबंधकारक का स्वाभाविक अर्थ ‘के लिए’ है।
- source_word: πειθόμεθα
  choice: हमें विश्वास है
  rationale: यह वक्ताओं की दृढ़ धारणा व्यक्त करता है। ‘हम आश्वस्त हैं’ अधिक औपचारिक है, जबकि यह चयन सामान्य हिन्दी में संज्ञानात्मक बल बनाए रखता है।
- source_word: καλὴν συνείδησιν
  choice: हमारा विवेक अच्छा है
  rationale: ‘अच्छा विवेक’ के मूल अर्थ को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है; ‘विवेक शुद्ध है’ अर्थ को अधिक विशिष्ट बना देता।
- source_word: ἐν πᾶσιν
  choice: हर बात में
  rationale: नपुंसकलिंग बहुवचन का यहाँ व्यापक क्रियाविशेषणात्मक अर्थ है; यह आधुनिक हिन्दी में सहज है।
- source_word: καλῶς
  choice: अच्छा
  rationale: व्यापक नैतिक अर्थ को बनाए रखता है; ‘सम्मानपूर्वक’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: θέλοντες
  choice: चाहते हैं
  rationale: वर्तमान कृदंत वक्ताओं की जारी इच्छा या अभिप्राय दर्शाता है।
- source_word: ἀναστρέφεσθαι
  choice: आचरण करना
  rationale: यह जीवन-व्यवहार के नैतिक ढंग को व्यक्त करता है और ‘जीना’ से अधिक सटीक है।
theological_decisions:
- issue: अंतिम कृदंतीय खंड का ‘अच्छे विवेक’ के दावे से संबंध
  choice: ‘और हम ... करना चाहते हैं’ के रूप में अपेक्षाकृत अनिर्धारित समन्वयी संबंध
  alternative: ‘क्योंकि हम ... करना चाहते हैं’ अथवा ‘इसलिए कि हम ... करना चाहते हैं’
  rationale: θέλοντες का ठीक तार्किक संबंध यूनानी में स्पष्ट चिह्नित नहीं है। हिन्दी में ‘और’ कृदंतीय भाव को सहज बनाते हुए कारणात्मक संबंध को आवश्यकता से अधिक निश्चित नहीं करता और अच्छे विवेक को पापहीनता का दावा भी नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विवेक’ नैतिक चेतना के लिए मानक हिन्दी शब्द है। मूल में वास्तविक पाठांतर या ऐसी अनिवार्य शब्दार्थगत अस्पष्टता नहीं है जिसके लिए पादटिप्पणी आवश्यक हो।
