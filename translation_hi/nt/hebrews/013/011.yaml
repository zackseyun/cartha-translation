id: HEB.13.11
reference: Hebrews 13:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὧν γὰρ εἰσφέρεται ζῴων τὸ αἷμα περὶ ἁμαρτίας εἰς τὰ ἅγια διὰ τοῦ ἀρχιερέως, τούτων τὰ σώματα κατακαίεται ἔξω τῆς παρεμβολῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/011.yaml
  text: For the bodies of those animals whose blood is brought into the holy places for sin by the high priest are burned outside the camp[a][b].
translation:
  language: hi
  text: क्योंकि जिन पशुओं का लहू पाप के लिए महायाजक के द्वारा पवित्र स्थानों में ले जाया जाता है, उनके शरीर छावनी के बाहर जला दिए जाते हैं[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पवित्रस्थान में।’ यूनानी में शाब्दिक रूप से ‘पवित्र स्थानों में’ है—यह पवित्रस्थान के पवित्र क्षेत्र के लिए प्रयुक्त धार्मिक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पूरी तरह जला दिए जाते हैं।’ यूनानी क्रिया पूर्णतः जला देने पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὧν ... ζῴων / τούτων τὰ σώματα
  choice: जिन पशुओं ... उनके शरीर
  rationale: सम्बन्धवाचक और पुनरारम्भकारी यूनानी रचना को स्वाभाविक हिन्दी में रखते हुए बलि के पशुओं का सन्दर्भ स्पष्ट किया गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस तार्किक सम्बन्ध को स्पष्ट रखता है।
- source_word: εἰσφέρεται
  choice: ले जाया जाता है
  rationale: वर्तमान कर्मवाच्य और पवित्र क्षेत्र के भीतर ले जाने की क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: τὸ αἷμα
  choice: लहू
  rationale: बलिदान-संबंधी प्रत्यक्ष अर्थ को बनाए रखता है और हिन्दी बाइबलीय भाषा में स्वाभाविक है।
- source_word: περὶ ἁμαρτίας
  choice: पाप के लिए
  rationale: यूनानी पद का व्यापक बलिदान-संबंधी अर्थ सुरक्षित रहता है; इसे विशेष रूप से ‘पापबलि’ कहकर आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: εἰς τὰ ἅγια
  choice: पवित्र स्थानों में
  rationale: यूनानी बहुवचन और पवित्रस्थान के व्यापक धार्मिक क्षेत्र को बनाए रखता है; केवल ‘परमपवित्र स्थान’ कहना अधिक संकीर्ण होता।
- source_word: διὰ τοῦ ἀρχιερέως
  choice: महायाजक के द्वारा
  rationale: διά और सम्बन्धकारक से व्यक्त कर्तृ-अभिकरण को स्पष्ट और औपचारिक हिन्दी में दर्शाता है।
- source_word: κατακαίεται
  choice: जला दिए जाते हैं
  rationale: बलिदान के शरीरों को आग में जलाने की क्रिया स्वाभाविक हिन्दी में व्यक्त होती है; पूर्णतः भस्म करने का सम्भावित प्रबल भाव पादटिप्पणी में दिया गया है।
- source_word: ἔξω τῆς παρεμβολῆς
  choice: छावनी के बाहर
  rationale: इस्राएली छावनी और तम्बू-आधारित बलिदान व्यवस्था के सन्दर्भ का प्रचलित और सटीक हिन्दी रूप है।
theological_decisions:
- issue: εἰς τὰ ἅγια का पवित्रस्थान-संबंधी संकेत
  choice: पवित्र स्थानों में
  alternative: पवित्रस्थान में; परमपवित्र स्थान में
  rationale: इब्रानियों में τὰ ἅγια पवित्रस्थान के व्यापक पवित्र क्षेत्र के लिए प्रयुक्त हो सकता है। यहाँ यूनानी पाठ स्वयं ‘परमपवित्र स्थान’ की संकीर्णता अनिवार्य नहीं करता, इसलिए बहुवचन और वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ‘महायाजक,’ ‘पवित्र स्थानों’ और ‘छावनी’ जैसे शब्द बलिदान-संबंधी प्रसंग को बनाए रखते हैं; वाक्य की यूनानी सम्बन्धवाचक रचना को पठनीय हिन्दी क्रम में रखा गया है।
