source:
  edition: SBLGNT
  text: καταρτίσαι ὑμᾶς ἐν ⸀παντὶ ἀγαθῷ εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ, ποιῶν ἐν ⸀ἡμῖν τὸ εὐάρεστον ἐνώπιον αὐτοῦ διὰ Ἰησοῦ Χριστοῦ, ᾧ ἡ δόξα εἰς τοὺς ⸀αἰῶνας· ἀμήν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/021.yaml
  text: may he equip you in every good thing to do his will[a], working in us what is pleasing before him through Jesus the Messiah, to whom be the glory forever and ever. Amen.
translation:
  language: hi
  text: वह हर भली बात में तुम्हें समर्थ करे, ताकि तुम उसकी इच्छा पूरी करो, और यीशु मसीह के द्वारा हमारे भीतर वह करे जो उसकी दृष्टि में भाता है। उसी की महिमा युगानुयुग होती रहे।[a] आमीन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसी” निकटवर्ती “यीशु मसीह” की ओर संकेत कर सकता है; कुछ इसे इस प्रार्थना के कर्ता, शान्ति के परमेश्वर, की ओर संकेत मानते हैं।
    reason: सम्बन्धवाचक सर्वनाम ᾧ के पूर्वपद की वास्तविक व्याकरणिक और धर्मवैज्ञानिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: καταρτίσαι
  choice: इस योग्य बनाए
  rationale: यह क्रिया यहाँ प्रार्थना के रूप में विश्वासियों को परमेश्वर की इच्छा पूरी करने के लिए तैयार और समर्थ किए जाने का भाव व्यक्त करती है। यह आधुनिक हिन्दी में स्वाभाविक है और केवल सामग्री उपलब्ध कराने से अधिक व्यापक यूनानी अर्थ को रखती है।
- source_word: ἐν παντὶ ἀγαθῷ
  choice: हर भली बात में
  rationale: यह ἐν की औपचारिक निकटता और प्रत्येक भली बात या कार्य के व्यापक क्षेत्र—दोनों को बनाए रखता है; संदर्भ में निहित संज्ञा को 'बात' से स्वाभाविक हिन्दी मिली है।
- source_word: εἰς τὸ ποιῆσαι τὸ θέλημα αὐτοῦ
  choice: कि तुम उसकी इच्छा पूरी करो
  rationale: आर्टिकुलर इनफिनिटिव का प्रयोजन स्पष्ट करता है। 'पूरी करो' हिन्दी में इच्छा के अनुसार कार्य करने का स्वाभाविक भाव देता है।
- source_word: ποιῶν ἐν ἡμῖν
  choice: हमारे भीतर वह काम करे
  rationale: ποιῶν परमेश्वर की सक्रिय क्रिया बताता है और ἐν ἡμῖν का अधिक संभावित आंतरिक अर्थ 'हमारे भीतर' से सुरक्षित रहता है।
- source_word: τὸ εὐάρεστον ἐνώπιον αὐτοῦ
  choice: जो उसकी दृष्टि में प्रसन्न करने वाला है
  rationale: संज्ञीकृत विशेषण को सहज हिन्दी में व्यक्त करते हुए परमेश्वर के मूल्यांकन और प्रसन्नता के संबंधपरक भाव को बनाए रखता है।
- source_word: διὰ Ἰησοῦ Χριστοῦ
  choice: यीशु मसीह के द्वारा
  rationale: διά के माध्यमवाचक अर्थ को स्पष्ट करता है। Χριστός के पदवीगत भाव के लिए हिन्दी का प्रचलित पद 'मसीह' उपयुक्त है।
- source_word: ᾧ ἡ δόξα
  choice: उसी की महिमा
  rationale: सम्बन्धवाचक सर्वनाम का ऐसा स्वाभाविक हिन्दी रूप चुना गया है जो निकटवर्ती यीशु मसीह अथवा प्रार्थना के मुख्य कर्ता परमेश्वर—दोनों संभावित पूर्वपदों को व्याकरणतः खुला रखता है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग
  rationale: यह यूनानी कालगत मुहावरे की अनंत अवधि को संक्षिप्त, प्रतिष्ठित और परिचित हिन्दी में व्यक्त करता है।
- source_word: ἀμήν
  choice: आमीन
  rationale: उपासना और बाइबलीय हिन्दी में स्थापित लिप्यंतरण।
theological_decisions:
- issue: सम्बन्धवाचक सर्वनाम ᾧ का पूर्वपद
  choice: '''उसी की महिमा'' द्वारा पूर्वपद को अनिर्धारित रखा गया'
  alternative: इसे विशेष रूप से यीशु मसीह या शान्ति के परमेश्वर की ओर निर्देशित करना
  rationale: निकटतम व्याकरणिक पूर्वपद यीशु मसीह है, पर पूरी प्रार्थना का कर्ता परमेश्वर है। यूनानी पाठ इस तनाव को निर्णायक रूप से नहीं सुलझाता, इसलिए मुख्य पाठ और टिप्पणी दोनों संभावनाएँ सुरक्षित रखते हैं।
- issue: καταρτίσαι में दिव्य समर्थता का स्वरूप
  choice: इस योग्य बनाए
  alternative: सिद्ध करे; सुसज्जित करे; सुधार दे
  rationale: संदर्भ आज्ञाकारिता के लिए तैयारी और समर्थता का है। चयन किसी विशेष सिद्धीकरण-सिद्धान्त को नहीं थोपता और क्रिया के व्यापक अर्थ को सहज हिन्दी में रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु आशीर्वचन और स्तुतिवचन के अनुरूप गरिमापूर्ण रखी गई है। 'इस योग्य बनाए', 'उसकी दृष्टि में' और 'युगानुयुग' सामान्य पाठकों के लिए बोधगम्य हैं तथा अत्यधिक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचते हैं।
