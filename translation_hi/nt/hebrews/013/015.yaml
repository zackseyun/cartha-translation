  edition: SBLGNT
  text: δι’ αὐτοῦ ⸀οὖν ἀναφέρωμεν θυσίαν αἰνέσεως διὰ παντὸς τῷ θεῷ, τοῦτ’ ἔστιν καρπὸν χειλέων ὁμολογούντων τῷ ὀνόματι αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/015.yaml
  text: Therefore[a], through him let us continually offer up to God a sacrifice of praise—that is[c][b], the fruit of lips confessing his name.
translation:
  language: hi
  text: इसलिए हम उसके द्वारा परमेश्वर को निरंतर[a] स्तुति का बलिदान चढ़ाते रहें—अर्थात् उसके नाम का अंगीकार करनेवाले होंठों का फल।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सदा’ अथवा ‘हर समय’।
    reason: lexical_alternative
lexical_decisions:
- source_word: δι’ αὐτοῦ
  choice: उसके द्वारा
  rationale: διά के साथ संबंधकारक यहाँ माध्यम को व्यक्त करता है। यह अनुवाद निकटवर्ती संदर्भ में मसीह की मध्यस्थ भूमिका को सुरक्षित रखता है, पर सर्वनाम को स्पष्ट नाम से नहीं बदलता।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन से निकले निष्कर्ष को दर्शाता है और हिन्दी में तर्क-संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ἀναφέρωμεν
  choice: हम ... चढ़ाते रहें
  rationale: प्रथम पुरुष बहुवचन वर्तमान संभावनार्थक क्रिया यहाँ सामूहिक आग्रह है। ‘चढ़ाते रहें’ आग्रह, निरन्तरता और बलिदान चढ़ाने की छवि—तीनों को व्यक्त करता है।
- source_word: θυσίαν αἰνέσεως
  choice: स्तुति का बलिदान
  rationale: यह संबंधकारक पदबंध का स्वाभाविक हिन्दी रूप है और मूल की बलिदान-संबंधी छवि तथा पुराने नियम की पृष्ठभूमि को बनाए रखता है।
- source_word: διὰ παντός
  choice: निरन्तर
  rationale: इस पदबंध का अर्थ लगातार या हर समय है। ‘निरन्तर’ संक्षिप्त, वर्तमान हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: τῷ θεῷ
  choice: परमेश्वर को
  rationale: सम्प्रदान कारक यहाँ बलिदान पाने वाले को दर्शाता है; ‘परमेश्वर को’ हिन्दी में सीधा और स्वाभाविक है।
- source_word: τοῦτ’ ἔστιν
  choice: अर्थात्
  rationale: यह स्तुति के बलिदान का आशय स्पष्ट करने वाली पुनर्व्याख्या प्रस्तुत करता है।
- source_word: καρπὸν χειλέων
  choice: होंठों का वह फल
  rationale: यह मूल रूपक और उसकी शास्त्रीय प्रतिध्वनि को बनाए रखता है। यूनानी पाठ में ‘हमारे’ स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ὁμολογούντων
  choice: अंगीकार करते हैं
  rationale: कृदन्त ‘होंठों’ को विशेषित करता है और खुले रूप से स्वीकार या अंगीकार करने का भाव रखता है। ‘अंगीकार’ इस अर्थ को ‘स्तुति करते हैं’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बेहतर सुरक्षित रखता है।
- source_word: τῷ ὀνόματι αὐτοῦ
  choice: उसके नाम का
  rationale: ὁμολογέω के साथ यूनानी सम्प्रदान का मुहावरेदार हिन्दी रूप ‘नाम का अंगीकार करना’ है; यह उसके व्यक्तित्व और पहचान को खुले रूप से स्वीकार करने का भाव रखता है।
theological_decisions:
- issue: δι’ αὐτοῦ में ‘उसके’ का संदर्भ
  choice: निकटवर्ती संदर्भ में ‘उसके’ का संकेत यीशु की ओर है और उसके द्वारा परमेश्वर को बलिदान चढ़ाया जाता है।
  alternative: सर्वनाम को किसी स्पष्ट धार्मिक विस्तार के बिना केवल माध्यम बताने वाला मानना।
  rationale: इब्रानियों 13 का निकटवर्ती संदर्भ यीशु और उसके बलिदान पर केंद्रित है। फिर भी मूल पाठ की तरह मुख्य पाठ में सर्वनाम रखा गया है और ‘यीशु’ जोड़कर अंतर्निहित संदर्भ को स्पष्ट कथन नहीं बनाया गया।
- issue: बलिदान-संबंधी भाषा का बल
  choice: ‘बलिदान’ और ‘चढ़ाते रहें’ के द्वारा मूल की बलिदान-संबंधी छवि बनाए रखना।
  alternative: इसे समतल करके केवल ‘स्तुति करते रहें’ कहना।
  rationale: वचन जानबूझकर स्तुति को बलिदान के रूप में प्रस्तुत करता है। इस छवि को बनाए रखने से पुराने नियम की पृष्ठभूमि और वर्तमान उपासना के बीच पाठ द्वारा बनाया गया संबंध सुरक्षित रहता है, बिना अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘स्तुति का बलिदान’, ‘चढ़ाते रहें’ और ‘होंठों का फल’ मूल की धार्मिक तथा काव्यात्मक छवियों को सुरक्षित रखते हैं। ‘अंगीकार’ कुछ औपचारिक है, पर इस प्रसंग में सार्वजनिक स्वीकारोक्ति का सटीक और प्रचलित धार्मिक शब्द है।
