    reason: lexical_alternative
lexical_decisions:
- source_word: γινώσκετε
  choice: यह जान लो
  rationale: वर्तमान सक्रिय आज्ञार्थक बहुवचन को स्वाभाविक हिन्दी में आज्ञार्थक रूप से रखा गया है; ‘यह’ आगे दी गई सूचना की ओर संकेत करता है।
- source_word: τὸν ἀδελφὸν ἡμῶν
  choice: हमारा भाई
  rationale: मसीही समुदाय के पारिवारिक संबोधन को सीधे और स्वाभाविक रूप में सुरक्षित रखता है।
- source_word: Τιμόθεον
  choice: तीमुथियुस
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ἀπολελυμένον
  choice: रिहा कर दिया गया है
  rationale: पूर्ण निष्क्रिय कृदन्त बीते हुए कार्य के वर्तमान परिणाम को व्यक्त करता है। संदर्भ में बंधन या हिरासत से रिहाई सबसे संभावित अर्थ है, जबकि अन्य शाब्दिक संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: μεθ’ οὗ
  choice: उसके साथ
  rationale: सम्बन्धवाचक यूनानी रचना का स्वाभाविक हिन्दी रूप, जो तीमुथियुस को लेखक की सम्भावित भेंट से जोड़ता है।
- source_word: ἐὰν τάχιον ἔρχηται
  choice: यदि वह शीघ्र आ गया
  rationale: शर्त को स्पष्ट रखता है। τάχιον तुलनात्मक रूप है, पर इस प्रसंग में ‘शीघ्र’ स्वाभाविक अर्थ देता है।
- source_word: ὄψομαι ὑμᾶς
  choice: मैं तुमसे मिलूँगा
  rationale: शाब्दिक अर्थ ‘मैं तुम्हें देखूँगा’ है, पर यात्रा और व्यक्तिगत भेंट के प्रसंग में ‘तुमसे मिलूँगा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय को बिना अनावश्यक विस्तार के व्यक्त करता है।
