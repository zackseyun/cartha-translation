  text: τοίνυν ἐξερχώμεθα πρὸς αὐτὸν ἔξω τῆς παρεμβολῆς, τὸν ὀνειδισμὸν αὐτοῦ φέροντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/013.yaml
  text: Therefore[a], let us go out to him outside the camp, bearing his reproach.
translation:
  language: hi
  text: इसलिए, आओ हम छावनी के बाहर उसके पास निकल चलें, उसका तिरस्कार सहते हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοίνυν
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले तर्क, विशेषकर 13:11–12, से इस exhortation को जोड़ता है। ‘इसलिए’ आधुनिक और स्वाभाविक हिन्दी में उसका तार्किक बल बनाए रखता है।
- source_word: ἐξερχώμεθα
  choice: हम ... निकल चलें
  rationale: प्रथम पुरुष बहुवचन का hortatory subjunctive सामूहिक आह्वान व्यक्त करता है। ‘निकल चलें’ बाहर जाने और आह्वान—दोनों भावों को सहज हिन्दी में रखता है।
- source_word: πρὸς αὐτὸν
  choice: उसके पास
  rationale: πρός के साथ कर्मकारक किसी व्यक्ति की ओर गति दर्शाता है। सर्वनाम को मूल पाठ के अनुसार बनाए रखा गया है; निकटवर्ती संदर्भ में उसका संकेत यीशु की ओर है।
- source_word: ἔξω τῆς παρεμβολῆς
  choice: छावनी से बाहर
  rationale: παρεμβολή का अर्थ छावनी या डेरा हो सकता है। ‘छावनी’ लैव्यव्यवस्था-संबंधी बलिदानी पृष्ठभूमि और इब्रानियों के रूपक को बिना परिभाषात्मक व्याख्या में बदले सुरक्षित रखता है।
- source_word: τὸν ὀνειδισμὸν αὐτοῦ
  choice: उसका अपमान
  rationale: ὀνειδισμός निन्दा, तिरस्कार और सामाजिक अपमान का भाव रखता है। ‘उसका अपमान’ मूल के संबंधवाचक सर्वनाम को बनाए रखते हुए यीशु के अस्वीकार किए जाने में सहभागी होने का भाव व्यक्त करता है।
- source_word: φέροντες
  choice: सहते रहें
  rationale: वर्तमानकालिक कृदन्त निरंतर अपमान उठाने या सहने का भाव देता है। हिन्दी में ‘अपमान सहना’ स्वाभाविक मुहावरा है, और ‘रहें’ उसके जारी रहने के पक्ष को व्यक्त करता है।
theological_decisions:
- issue: ‘उसके’ का संदर्भ
  choice: सर्वनाम ‘उसके’ को बनाए रखा गया; निकटवर्ती संदर्भ में यह यीशु की ओर संकेत करता है।
  alternative: सर्वनाम के स्थान पर स्पष्ट रूप से ‘यीशु’ लिखना।
  rationale: यूनानी पाठ सर्वनाम का प्रयोग करता है और 13:12 से उसका संदर्भ स्पष्ट होता है। नाम जोड़ना मूल की अभिव्यक्ति को अनावश्यक रूप से स्पष्ट कर देता।
- issue: ‘छावनी से बाहर’ का अर्थ
  choice: बलिदानी और सामुदायिक बहिष्कार से जुड़ी मूल छवि को अक्षुण्ण रखा गया।
  alternative: ‘धार्मिक व्यवस्था से बाहर’ या ‘समुदाय से बाहर’ कहकर रूपक की व्याख्या करना।
  rationale: यह वाक्यांश लैव्यव्यवस्था की बलिदानी प्रथा और यीशु के नगर के बाहर दुःख उठाने की पृष्ठभूमि जगाता है। व्याख्यात्मक प्रतिस्थापन इसकी अंतर्पाठीय और धर्मवैचारिक गहराई को सीमित कर देता।
- issue: ‘उसका अपमान’ में संबंध का स्वरूप
  choice: मूल का संबंधवाचक रूप खुला रखा गया—वह अपमान जो उसने सहा और जिसमें उसके अनुयायी उसके साथ सहभागी होते हैं।
  alternative: ‘उसके कारण होने वाला अपमान’ या ‘उस पर किया गया अपमान’ कहकर संबंध को केवल एक अर्थ में बाँधना।
  rationale: αὐτοῦ का संबंध संदर्भ में समृद्ध है; उसे एक ही व्याख्या में सीमित करना मूल की अर्थ-तनाव को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामूहिक आह्वान वाला स्वर रखा गया है। ‘छावनी’ और ‘अपमान’ जैसे शब्द मूल की ठोस छवि तथा सामाजिक लज्जा—दोनों को सामान्य पाठक के लिए समझने योग्य रखते हैं।
