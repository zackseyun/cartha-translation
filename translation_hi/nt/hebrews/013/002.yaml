  text: τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/002.yaml
  text: Do not neglect hospitality[a], for through it some have entertained angels without knowing it.
translation:
  language: hi
  text: अजनबियों का अतिथि-सत्कार करना न भूलो[a], क्योंकि ऐसा करने के द्वारा कुछ लोगों ने अनजाने में स्वर्गदूतों का अतिथि-सत्कार किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अजनबियों की मेहमाननवाज़ी की उपेक्षा न करो।” यूनानी शब्द में अजनबियों को प्रेमपूर्वक स्वीकार करने का भाव है। आगे “स्वर्गदूतों” के लिए आया यूनानी शब्द “दूतों” का अर्थ भी दे सकता है, हालाँकि यहाँ पुराने नियम के प्रसंगों की संभावित ओर संकेत के कारण “स्वर्गदूतों” का अर्थ अधिक उपयुक्त है।
    reason: शाब्दिक अर्थ और ἀγγέλους के वास्तविक शब्दार्थ-विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: φιλοξενίας
  choice: अजनबियों का अतिथि-सत्कार
  rationale: यह शब्द केवल सामान्य मेहमाननवाज़ी नहीं, बल्कि अजनबियों को प्रेमपूर्वक स्वीकार करने का भाव रखता है; यह हिंदी अभिव्यक्ति उस अर्थ को स्पष्ट और स्वाभाविक ढंग से सामने लाती है।
- source_word: μὴ ἐπιλανθάνεσθε
  choice: न भूलो
  rationale: मूल क्रिया का सीधा अर्थ ‘भूलना’ है; इस आज्ञार्थक संदर्भ में इसका आशय इस अभ्यास की उपेक्षा न करना भी है।
- source_word: διὰ ταύτης
  choice: ऐसा करने के द्वारा
  rationale: स्त्रीलिंग सर्वनाम का संकेत अतिथि-सत्कार की ओर है; यह रूप हिंदी में संदर्भ को स्पष्ट रखते हुए διά के साधनवाचक अर्थ को व्यक्त करता है।
- source_word: ἔλαθόν ... ξενίσαντες
  choice: अनजाने में ... अतिथि-सत्कार किया है
  rationale: λανθάνω और कृदंत की रचना बताती है कि यह कार्य करने वालों को उसकी वास्तविकता का ज्ञान नहीं था; हिंदी में ‘अनजाने में’ इसे सहजता से व्यक्त करता है।
- source_word: τινες
  choice: कुछ लोगों ने
  rationale: अनिश्चित बहुवचन के लिए यह सामान्य और स्वाभाविक हिंदी रूप है।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: शब्द का अर्थ ‘दूत’ भी हो सकता है, पर उत्पत्ति 18–19 की संभावित प्रतिध्वनि के कारण यहाँ अलौकिक स्वर्गदूत अधिक उपयुक्त है; वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ἀγγέλους का अभिप्राय
  choice: अलौकिक अर्थ में ‘स्वर्गदूत’
  alternative: मानवीय अर्थ में ‘दूत’
  rationale: पुराने नियम में अब्राहम और लूत द्वारा अनजाने में स्वर्गीय आगंतुकों का स्वागत किए जाने की संभावित ओर-संकेत इस अर्थ का समर्थन करता है। फिर भी यूनानी शब्द की वास्तविक वैकल्पिक संभावना पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और उपदेशात्मक स्वर। ‘अतिथि-सत्कार’ व्यापक रूप से समझा जाने वाला पद है; ‘अजनबियों का’ जोड़कर φιλοξενία की विशिष्टता स्पष्ट की गई है।
