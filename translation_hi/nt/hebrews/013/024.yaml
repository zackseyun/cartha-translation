  text: ἀσπάσασθε πάντας τοὺς ἡγουμένους ὑμῶν καὶ πάντας τοὺς ἁγίους. ἀσπάζονται ὑμᾶς οἱ ἀπὸ τῆς Ἰταλίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/024.yaml
  text: Greet all your leaders and all the saints[a]. Those from Italy greet you.
translation:
  language: hi
  text: अपने सभी अगुवों और सभी पवित्र जनों को नमस्कार कहो। इटली के लोग तुम्हें नमस्कार कहते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इटली में रहने वाले लोग तुम्हें नमस्कार कहते हैं।” यूनानी वाक्यांश का अर्थ इटली के लोग या इटली में रहने वाले लोग—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἀσπάσασθε
  choice: नमस्कार कहना
  rationale: यह आज्ञार्थक क्रिया पत्रात्मक अभिवादन पहुँचाने का भाव रखती है। ‘नमस्कार कहना’ स्वाभाविक आधुनिक हिन्दी में आज्ञा का बल बनाए रखता है।
- source_word: πάντας
  choice: सभी
  rationale: यह दोनों समूहों की समग्रता व्यक्त करता है; ‘सभी’ सीधा और सहज हिन्दी रूप है।
- source_word: τοὺς ἡγουμένους ὑμῶν
  choice: अपने सभी अगुवों
  rationale: यह समुदाय में नेतृत्व करने वाले मान्य व्यक्तियों को सूचित करता है। ‘अगुवों’ धार्मिक समुदाय के संदर्भ में स्वाभाविक है और राजनीतिक ‘शासकों’ का भ्रामक अर्थ नहीं देता।
- source_word: τοὺς ἁγίους
  choice: सभी पवित्र जनों
  rationale: ‘पवित्र जन’ विश्वासियों के लिए प्रयुक्त यूनानी पद का धार्मिक और शाब्दिक भार बनाए रखता है तथा आधुनिक हिन्दी में समझने योग्य है।
- source_word: ἀσπάζονται
  choice: नमस्कार कहते हैं
  rationale: पत्रात्मक संदर्भ में वर्तमानकालीन अभिवादन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἀπὸ τῆς Ἰταλίας
  choice: इटली से आए लोग
  rationale: ἀπό के साथ संबंधकारक सामान्यतः उद्गम या संबद्धता, अर्थात ‘इटली से’, बताता है। ‘आए’ हिन्दी में इस उद्गम-बोध को स्पष्ट करता है, जबकि स्थान-सूचक सम्भावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: οἱ ἀπὸ τῆς Ἰταλίας का संदर्भ
  choice: इटली से आए लोग
  alternative: इटली में रहने वाले लोग
  rationale: मुख्य पाठ में ἀπό का अधिक सीधा उद्गम-सूचक अर्थ रखा गया है। फिर भी यह वाक्यांश इटली में स्थित लोगों के लिए भी समझा जा सकता है; पत्र की रचना-स्थिति से जुड़ी इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामुदायिक-पत्रात्मक रजिस्टर अपनाया गया है। ‘अगुवों’ और ‘पवित्र जनों’ से मूल पदों का धार्मिक अर्थ सुरक्षित रहता है।
