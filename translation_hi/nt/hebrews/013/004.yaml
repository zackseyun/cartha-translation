source:
  edition: SBLGNT
  text: τίμιος ὁ γάμος ἐν πᾶσιν καὶ ἡ κοίτη ἀμίαντος, πόρνους ⸀γὰρ καὶ μοιχοὺς κρινεῖ ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/004.yaml
  text: Let marriage be held in honor among all[a], and the marriage bed be undefiled[b], for God will judge the sexually immoral and adulterers.
translation:
  language: hi
  text: विवाह का सभी लोगों में[a][b] आदर हो, और विवाह की शय्या अशुद्ध न हो, क्योंकि परमेश्वर यौन अनैतिकता करने वालों और व्यभिचार करने वालों का न्याय करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विवाह सभी लोगों में आदरणीय है।” यूनानी के पहले उपवाक्य में कोई स्पष्ट क्रिया नहीं है, इसलिए इसे आग्रह या कथन—दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “सभी लोगों में” के स्थान पर “सभी लोगों द्वारा” भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίμιος
  choice: आदर हो
  rationale: यह शब्द सम्मानित, बहुमूल्य या प्रतिष्ठित होने का भाव रखता है। प्रसंग के उपदेशात्मक प्रवाह में ‘आदर हो’ स्वाभाविक है और यूनानी की क्रियारहित रचना को अनावश्यक रूप से कठोर नहीं बनाता।
- source_word: γάμος
  choice: विवाह
  rationale: यहाँ अर्थ विवाह-संस्था या वैवाहिक अवस्था है, विवाह-समारोह नहीं।
- source_word: ἐν πᾶσιν
  choice: सब लोगों में
  rationale: बहुवचन रूप यहाँ व्यक्तियों की ओर संकेत करता है। ‘सब लोगों में’ व्यापकता बनाए रखता है; ‘सब लोगों द्वारा’ भी संभव है और पाद-टिप्पणी में दिया गया है।
- source_word: κοίτη
  choice: विवाह-शय्या
  rationale: शाब्दिक अर्थ ‘शय्या’ है, पर यहाँ विवाह के संदर्भ में वैवाहिक यौन-संबंध का लाक्षणिक संकेत है। यह अभिव्यक्ति गरिमापूर्ण और स्पष्ट है।
- source_word: ἀμίαντος
  choice: निष्कलंक
  rationale: यह ‘अशुद्ध न किया हुआ, बेदाग, शुद्ध’ का भाव रखता है। ‘निष्कलंक’ नैतिक तथा शुद्धता-संबंधी प्रतिध्वनि को बनाए रखता है।
- source_word: πόρνους
  choice: व्यभिचारियों
  rationale: यह व्यापक रूप से यौन अनैतिकता करने वालों को दर्शाता है। आधुनिक हिन्दी में ‘व्यभिचारी’ इस व्यापक श्रेणी के लिए संक्षिप्त और समझने योग्य है, यद्यपि अगले विशिष्ट शब्द से अंतर संदर्भ द्वारा स्पष्ट होता है।
- source_word: μοιχούς
  choice: परस्त्रीगामियों
  rationale: यह विशेष रूप से विवाहेतर संबंध द्वारा विवाह-भंग करने वालों के लिए है। ‘परस्त्रीगामी’ व्यापक ‘व्यभिचारी’ से भेद बनाए रखता है, यद्यपि हिन्दी में इसका रूप पारंपरिक रूप से पुरुषवाची सुनाई दे सकता है।
- source_word: κρινεῖ
  choice: न्याय करेगा
  rationale: भविष्यकालीन रूप आगामी ईश्वरीय न्याय बताता है। ‘दोषी ठहराएगा’ की अपेक्षा ‘न्याय करेगा’ यूनानी से अधिक न कहकर परिणाम को खुला रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पहले कथन के लिए कारण देता है और हिन्दी में तर्क-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: आरंभिक क्रियारहित उपवाक्य को कथन माना जाए या आग्रह
  choice: 'आग्रह: ‘विवाह का ... आदर हो’'
  alternative: 'कथन: ‘विवाह सब लोगों में आदरणीय है’'
  rationale: यूनानी में कोई स्पष्ट सीमित क्रिया नहीं है, इसलिए दोनों अर्थ संभव हैं। इब्रानियों 13 के लगातार नैतिक आग्रहों के प्रसंग में आग्रह अधिक उपयुक्त है; फिर भी वास्तविक व्याकरणिक अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘विवाह-शय्या’ मूल के रूपक और वैवाहिक संदर्भ दोनों को बनाए रखता है। ‘व्यभिचारी’ तथा ‘परस्त्रीगामी’ के माध्यम से व्यापक यौन अनैतिकता और विशेष रूप से विवाहेतर संबंध के बीच मूल भेद व्यक्त किया गया है।
