source:
  edition: SBLGNT
  text: Πείθεσθε τοῖς ἡγουμένοις ὑμῶν καὶ ὑπείκετε, αὐτοὶ γὰρ ἀγρυπνοῦσιν ὑπὲρ τῶν ψυχῶν ὑμῶν ὡς λόγον ἀποδώσοντες, ἵνα μετὰ χαρᾶς τοῦτο ποιῶσιν καὶ μὴ στενάζοντες, ἀλυσιτελὲς γὰρ ὑμῖν τοῦτο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/017.yaml
  text: Be persuaded by your leaders and yield to them[a], for they are keeping watch over your souls as those who will give an account, so that they may do this with joy and not with groaning, for this would be unprofitable for you.
translation:
  language: hi
  text: अपने अगुओं की बात से कायल हो और उनके प्रति झुको, क्योंकि वे तुम्हारी आत्माओं के लिए चौकसी करते रहते हैं और उन्हें लेखा देना होगा। ऐसा इसलिए कि वे यह काम आनन्द से करें, कराहते हुए नहीं; क्योंकि यह तुम्हारे लिए लाभकारी नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πείθεσθε
  choice: बात से कायल होकर उसे मानो
  rationale: मध्य/कर्मवाच्य आज्ञार्थक रूप में ‘कायल होना, विश्वास करना’ और प्रसंगानुसार ‘आज्ञा मानना’—दोनों भाव संभव हैं। यह अभिव्यक्ति केवल यांत्रिक आज्ञापालन के बजाय समझाए जाने पर भरोसे के साथ मानने का संबंधपरक भाव बचाती है।
- source_word: ἡγουμένοις
  choice: अगुओं
  rationale: यहाँ शब्द समुदाय के मान्य नेतृत्व करने वालों को दर्शाता है। ‘अगुए’ आधुनिक हिन्दी मसीही पाठकों के लिए परिचित है और ‘शासकों’ जैसी अधिक अधिकारवादी छाया से बचता है।
- source_word: ὑπείκετε
  choice: उनके आगे झुको
  rationale: क्रिया का भाव रास्ता देने, झुकने या आदरपूर्वक अधीन होने का है। यह पहले क्रियापद से अलग रहते हुए उसके साथ स्वाभाविक जोड़ी बनाता है।
- source_word: ἀγρυπνοῦσιν
  choice: रखवाली करते हैं
  rationale: मूल क्रिया जागते रहने और चौकसी करने का चित्र देती है। ‘रखवाली’ उस सतर्क, उत्तरदायी देखभाल को सहज हिन्दी में व्यक्त करती है।
- source_word: ψυχῶν
  choice: प्राणों
  rationale: ψυχή आत्मा, जीवन या व्यक्ति का संकेत दे सकता है। ‘प्राण’ अभिव्यक्ति के आध्यात्मिक भार को रखते हुए हिन्दी में स्वाभाविक बहुवचन संबंध बनाता है।
- source_word: ὡς λόγον ἀποδώσοντες
  choice: मानो ऐसे लोग जिन्हें लेखा देना होगा
  rationale: यह भविष्य में उत्तरदायित्व का सामना करने वाले अगुओं की स्थिति बताता है। परमेश्वर को लेखा देना प्रसंग में निहित है, पर मूल वाक्य में कर्म अप्रकट होने के कारण अनुवाद में भी उसे जोड़ा नहीं गया।
- source_word: μετὰ χαρᾶς
  choice: आनन्द से
  rationale: सीधा और स्वाभाविक रूप, जो कार्य करने की रीति को स्पष्ट करता है।
- source_word: στενάζοντες
  choice: कराहते हुए
  rationale: यह ठोस ‘कराहने/आह भरने’ के बिंब को बचाता है और उसे केवल दुःख जैसे अमूर्त भाव में नहीं बदलता।
- source_word: ἀλυσιτελὲς
  choice: लाभदायक नहीं
  rationale: शब्द का अर्थ अनुपयोगी या लाभ न पहुँचाने वाला है। यह ‘हानिकारक’ कहने की अपेक्षा मूल के नकारात्मक लाभ-बोध के अधिक निकट है।
theological_decisions:
- issue: समुदाय के अगुओं के प्रति exhortation का स्वरूप
  choice: समझाए जाने और भरोसा करने के लिए खुली मनोवृत्ति के साथ उनकी बात मानना तथा उनके आगे झुकना
  alternative: अगुओं की निरपेक्ष और बिना शर्त आज्ञा मानना
  rationale: Πείθεσθε और ὑπείκετε मिलकर भरोसे से बात मानने और झुकने का आग्रह करते हैं, पर निरंकुश अधिकार का अर्थ आवश्यक नहीं बनाते। आगे का कारण अगुओं की चौकस देखभाल और उनके भावी लेखे पर आधारित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘अगुए’, ‘प्राणों’ और ‘लेखा देना’ जैसे परिचित बाइबलीय पद बनाए गए हैं; साथ ही पहले दो आज्ञार्थकों के अलग-अलग भावों को एक ही ‘आज्ञापालन’ में नहीं मिलाया गया।
