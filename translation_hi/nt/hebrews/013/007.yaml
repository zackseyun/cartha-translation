source:
  edition: SBLGNT
  text: Μνημονεύετε τῶν ἡγουμένων ὑμῶν, οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ, ὧν ἀναθεωροῦντες τὴν ἔκβασιν τῆς ἀναστροφῆς μιμεῖσθε τὴν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/007.yaml
  text: Remember your leaders[a], who spoke the word of God to you. As you consider the outcome of their way of life[b], imitate their faith.
translation:
  language: hi
  text: अपने अगुवों को याद रखो, जिन्होंने तुम्हें परमेश्वर का वचन सुनाया था। उनके जीवन-आचरण के परिणाम[a] पर ध्यान करते हुए उनके विश्वास[b] का अनुकरण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परिणाम” का अनुवाद “अंत” भी किया जा सकता है; कुछ व्याख्याओं में यह विशेष रूप से उनकी मृत्यु के ढंग की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी विश्वासयोग्यता।” यूनानी शब्द का अर्थ विश्वास या विश्वासयोग्यता, दोनों हो सकता है; मुख्य पाठ में परियोजना का सामान्य अनुवाद “विश्वास” रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: Μνημονεύετε
  choice: स्मरण रखो
  rationale: वर्तमानकालीन आज्ञा निरंतर याद रखने का भाव देती है; ‘स्मरण रखो’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: τῶν ἡγουμένων ὑμῶν
  choice: अपने अगुओं को
  rationale: यह समुदाय में मान्य नेतृत्व करने वालों को सूचित करता है। ‘अगुए’ कलीसियाई संदर्भ में परिचित है और ‘शासक’ का अनावश्यक राजनीतिक भाव नहीं लाता।
- source_word: οἵτινες ἐλάλησαν ὑμῖν τὸν λόγον τοῦ θεοῦ
  choice: जिन्होंने तुम्हें परमेश्वर का वचन सुनाया था
  rationale: λαλέω के बोलने/सुनाने के सामान्य अर्थ तथा λόγον τοῦ θεοῦ की बाइबलीय अभिव्यक्ति को स्पष्ट हिन्दी में रखा गया है। भूतकालीन ‘था’ इन अगुओं की पहले की सेवा की ओर संकेत करता है, पर उनकी मृत्यु को अनिवार्य नहीं ठहराता।
- source_word: ἀναθεωροῦντες
  choice: पर ध्यान करते हुए
  rationale: यह कृदंत सावधानी से देखने और उस पर विचार करने का भाव रखता है; ‘ध्यान करते हुए’ दोनों पक्षों को सहज रूप में व्यक्त करता है।
- source_word: τὴν ἔκβασιν
  choice: परिणाम
  rationale: ἔκβασις परिणाम, निष्कर्ष या अंत को सूचित कर सकता है। ‘परिणाम’ मुख्य पाठ में पर्याप्त व्यापक है और इसे केवल मृत्यु या शहादत तक सीमित नहीं करता।
- source_word: τῆς ἀναστροφῆς
  choice: उनके जीवन-आचरण के
  rationale: ἀναστροφή जीवन बिताने के ढंग और आचरण, दोनों को समेटता है; ‘जीवन-आचरण’ इस व्यापकता को संक्षेप में बनाए रखता है।
- source_word: μιμεῖσθε
  choice: अनुकरण करो
  rationale: प्रत्यक्ष आज्ञार्थक क्रिया का औपचारिक अर्थ सुरक्षित रहता है और हिन्दी में स्पष्ट है।
- source_word: τὴν πίστιν
  choice: उनके विश्वास
  rationale: πίστις के लिए परियोजना की सामान्य मुख्य-पाठ अभिव्यक्ति ‘विश्वास’ रखी गई है; ‘विश्वासयोग्यता’ की संभव व्याख्या पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अनुकरण योग्य मानवीय गुण के संदर्भ में πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता
  rationale: इस प्रसंग में दोनों अर्थ संभव हैं। मुख्य पाठ में सामान्य अनुवाद ‘विश्वास’ रखा गया है और अर्थगत तनाव को मिटाने के बजाय दूसरा विकल्प पादटिप्पणी में दिया गया है।
- issue: क्या ἔκβασις विशेष रूप से अगुओं की मृत्यु या शहादत को दर्शाता है
  choice: परिणाम
  alternative: अंत; कुछ व्याख्याओं में उनकी मृत्यु का ढंग
  rationale: यूनानी शब्द व्यापक रूप से परिणाम या अंत बता सकता है। मुख्य पाठ कोई अप्रमाणित ऐतिहासिक विशिष्टता नहीं जोड़ता, जबकि पादटिप्पणी संकुचित संभावित अर्थ को दर्ज करती है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा आज्ञार्थक लहजा रखा गया है। ‘अगुए’ समुदाय के आध्यात्मिक नेतृत्व के लिए परिचित शब्द है। पादटिप्पणी-चिह्न अर्थ-संबंध के अनुसार लगाए गए हैं: [a] ‘परिणाम’ पर और [b] ‘विश्वास’ पर।'
