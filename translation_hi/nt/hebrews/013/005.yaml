  text: ἀφιλάργυρος ὁ τρόπος· ἀρκούμενοι τοῖς παροῦσιν· αὐτὸς γὰρ εἴρηκεν· Οὐ μή σε ἀνῶ οὐδ’ οὐ μή σε ⸀ἐγκαταλίπω·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/005.yaml
  text: Let your way of life be free from the love of money[a], being content with what you have, for he himself has said, “I will never leave you[b], nor will I ever forsake you.”
translation:
  language: hi
  text: आपका जीवन-व्यवहार धन के प्रेम से मुक्त रहे[a], और जो कुछ आपके पास है उसी में सन्तुष्ट रहें, क्योंकि उसने स्वयं कहा है, “मैं आपको कभी नहीं छोड़ूँगा और न कभी आपको त्यागूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “जीवन-व्यवहार धन के प्रेम से रहित हो।”'
    reason: lexical_alternative
  - marker: b
    text: यह प्रतिज्ञा पुराने नियम में दी गई वाचा की आश्वासनपूर्ण बातों की प्रतिध्वनि है, विशेषकर व्यवस्थाविवरण 31:6, 8 और यहोशू 1:5 की।
    reason: cross_reference
lexical_decisions:
- source_word: ἀφιλάργυρος
  choice: धन के प्रेम से मुक्त
  rationale: यह विशेषण धन से प्रेम न करने का भाव व्यक्त करता है। यह रूप मूल के विशिष्ट अर्थ को बनाए रखता है और व्यापक ‘लोभ’ तक अर्थ का अनावश्यक विस्तार नहीं करता।
- source_word: ὁ τρόπος
  choice: आपका जीवन
  rationale: यहाँ τρόπος जीवन-व्यवहार या जीने के ढंग को दर्शाता है। ‘आपका जीवन’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: ἀρκούμενοι
  choice: सन्तुष्ट रहें
  rationale: कृदन्त का यहाँ उपदेशात्मक बल है; हिन्दी में समन्वित आज्ञार्थक रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῖς παροῦσιν
  choice: जो कुछ आपके पास है उसी में
  rationale: शाब्दिक अर्थ ‘उपस्थित वस्तुओं/परिस्थितियों’ का है, पर प्रसंग में वर्तमान उपलब्ध साधनों या परिस्थितियों से सन्तुष्ट रहने की बात है। यह हिन्दी अभिव्यक्ति अर्थ को स्पष्ट और सहज रखती है।
- source_word: αὐτὸς γὰρ εἴρηκεν
  choice: क्योंकि उसने स्वयं कहा है
  rationale: ‘स्वयं’ αὐτός के बल को और ‘कहा है’ पूर्णकाल के वर्तमान तक बने रहने वाले प्रभाव को व्यक्त करता है। मूल में ‘परमेश्वर’ संज्ञा नहीं है, इसलिए सर्वनाम रखा गया है।
- source_word: Οὐ μή σε ἀνῶ
  choice: मैं तुम्हें कभी नहीं छोड़ूँगा
  rationale: οὐ μή की प्रबल निषेधात्मक शक्ति को ‘कभी नहीं’ व्यक्त करता है; उद्धरण के प्रसंग में ‘छोड़ना’ स्वाभाविक है।
- source_word: οὐδ’ οὐ μή σε ἐγκαταλίπω
  choice: और न कभी तुम्हें त्यागूँगा
  rationale: ἐγκαταλείπω का अर्थ पीछे छोड़ना या त्याग देना है। ‘त्यागूँगा’ गम्भीर वाचा-संबंधी आश्वासन के स्वर को बनाए रखता है और दोहराए गए प्रबल निषेध को ‘न कभी’ व्यक्त करता है।
theological_decisions:
- issue: उद्धरण के वक्ता की पहचान
  choice: ‘उसने स्वयं’ रखकर यूनानी सर्वनाम को बनाए रखना
  alternative: ‘परमेश्वर ने स्वयं’
  rationale: प्रसंग में वक्ता परमेश्वर है, पर मूल पाठ में θεός नहीं बल्कि αὐτός है। इसलिए मुख्य पाठ में ऐसी संज्ञा नहीं जोड़ी गई जो मूल में स्पष्ट नहीं है।
- issue: उद्धरण में प्रबल दोहरे निषेधों का अनुवाद
  choice: ‘कभी नहीं छोड़ूँगा और न कभी ... त्यागूँगा’
  alternative: ‘निश्चय ही नहीं छोड़ूँगा या त्यागूँगा’
  rationale: दोनों οὐ μή रचनाएँ आश्वासन को अत्यन्त दृढ़ बनाती हैं। हिन्दी में ‘कभी नहीं’ और ‘न कभी’ इस बल को स्वाभाविक रूप से व्यक्त करते हैं, बिना कृत्रिम पुनरुक्ति के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष उपदेशात्मक शैली अपनाई गई है। सम्मानसूचक बहुवचन ‘आपका/रहें’ के साथ उद्धरण में मूल के एकवचन σε को ‘तुम्हें’ रखा गया है, क्योंकि प्रतिज्ञा प्रत्येक श्रोता को व्यक्तिगत रूप से सम्बोधित करती है। ‘सन्तुष्ट’ की वर्तनी गरिमापूर्ण साहित्यिक प्रचलन के अनुरूप है।
