lexical_decisions:
- source_word: ἡ χάρις
  choice: अनुग्रह
  rationale: यहाँ χάρις पत्र के अंत में दी जाने वाली पारंपरिक आशीष को व्यक्त करता है। ‘अनुग्रह’ इसका स्थापित, गरिमापूर्ण और अर्थ-सटीक हिन्दी रूप है।
- source_word: μετὰ
  choice: के साथ रहे
  rationale: सम्बन्धकारक के साथ μετά का अर्थ ‘के साथ’ है। यूनानी वाक्य में क्रिया निहित है; हिन्दी आशीर्वचन में ‘रहे’ जोड़ना इस भाव को स्वाभाविक और स्पष्ट बनाता है।
- source_word: πάντων ὑμῶν
  choice: तुम सबके
  rationale: πάντων ὑμῶν पूरे सम्बोधित समुदाय को स्पष्ट रूप से समेटता है। ‘तुम सबके’ इस समावेशी बल को सहज आधुनिक हिन्दी में बनाए रखता है।
