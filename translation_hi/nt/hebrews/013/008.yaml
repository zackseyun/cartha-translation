  text: Ἰησοῦς Χριστὸς ἐχθὲς καὶ σήμερον ὁ αὐτός, καὶ εἰς τοὺς αἰῶνας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/008.yaml
  text: Jesus the Messiah is the same yesterday and today and forever[a].
translation:
  language: hi
  text: यीशु मसीह कल, आज और युगानुयुग एक-समान हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ख्रीस्त कल, आज और युगानुयुग एक-समान हैं।” यूनानी उपाधि Χριστός का अनुवाद “मसीह” किया जा सकता है या उसका लिप्यंतरण “ख्रीस्त” किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: व्यक्तिगत नाम का हिन्दी में मानक और सर्वमान्य रूप।
- source_word: Χριστὸς
  choice: मसीह
  rationale: यूनानी उपाधि का अर्थानुवाद; हिन्दी में यह यीशु की मसीही पदवी को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐχθὲς
  choice: कल
  rationale: यहाँ बीते समय को सूचित करने वाला सीधा कालवाचक शब्द; त्रिकालिक क्रम में स्वाभाविक हिन्दी।
- source_word: σήμερον
  choice: आज
  rationale: वर्तमान समय का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ὁ αὐτός
  choice: एक-समान हैं
  rationale: अर्थ है कि उनकी पहचान और स्वरूप में निरंतरता है; हिन्दी में विधेय के साथ आदरसूचक बहुवचन स्वाभाविक है।
- source_word: εἰς τοὺς αἰῶνας
  choice: युगानुयुग रहेंगे
  rationale: शाब्दिक 'युगों तक' का स्वाभाविक, गरिमापूर्ण हिन्दी रूप, जो अनंत निरंतरता व्यक्त करता है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... और ... और
  rationale: मूल के लयात्मक काल-क्रम को यथासंभव बनाए रखा गया है।
theological_decisions:
- issue: यीशु की कालातीत समानता का मसीह-विषयक आशय
  choice: कथन को यीशु मसीह की बीते, वर्तमान और आने वाले समस्त समय में निरंतर समानता के रूप में सीधे प्रस्तुत किया गया है।
  alternative: इसे मसीह की अपरिवर्तनशीलता या ईश्वरत्व की विस्तृत सैद्धांतिक व्याख्या के रूप में बढ़ाया जा सकता था।
  rationale: यूनानी पाठ निरंतर समानता की पुष्टि करता है, पर अनुवाद में उससे आगे की धर्मसैद्धांतिक व्याख्या जोड़ना उचित नहीं।
- issue: Χριστός को उपाधि या रूढ़ नाम के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त
  rationale: यहाँ अर्थानुवाद उपाधि की मसीही भूमिका स्पष्ट रखता है; वैकल्पिक प्रचलित लिप्यंतरण को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। आदरसूचक क्रिया-रूप रखा गया है। मूल के संक्षिप्त, लयात्मक काल-क्रम को बचाते हुए अंतिम पदबंध में स्वाभाविक हिन्दी के लिए ‘रहेंगे’ जोड़ा गया है।
