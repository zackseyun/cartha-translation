reference: Hebrews 13:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥστε θαρροῦντας ἡμᾶς λέγειν· Κύριος ἐμοὶ βοηθός, ⸀οὐ φοβηθήσομαι· τί ποιήσει μοι ἄνθρωπος;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/006.yaml
  text: so that we confidently say[a], “The Lord is my helper; I will not be afraid[b]. What can man do to me?”
translation:
  language: hi
  text: इसलिए हम हिम्मत के साथ कहते हैं, “प्रभु मेरा सहायक है; मैं नहीं डरूँगा। मनुष्य मेरा क्या कर सकता है?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “मनुष्य मेरा क्या करेगा?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὥστε
  choice: इसलिए
  rationale: यह पहले कही गई बात के परिणाम अथवा निष्कर्ष को प्रस्तुत करता है; हिन्दी में ‘इसलिए’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: θαρροῦντας ἡμᾶς λέγειν
  choice: हम हिम्मत के साथ कहते हैं
  rationale: θαρρέω साहस और भरोसे से बोलने का भाव देता है। यह अनुवाद कृदन्तीय रचना का अर्थ स्वाभाविक आधुनिक हिन्दी में रखता है, बिना अलग से सामर्थ्यसूचक ‘सकते हैं’ जोड़ने के।
- source_word: Κύριος
  choice: प्रभु
  rationale: κύριος के ईश्वरीय संबोधन को मानक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐμοὶ βοηθός
  choice: मेरा सहायक
  rationale: सम्प्रदान कारक ἐμοὶ के साथ βοηθός का अर्थ ‘मेरे लिए सहायक’ है; हिन्दी में संबंधसूचक ‘मेरा सहायक’ सबसे स्वाभाविक है।
- source_word: οὐ φοβηθήσομαι
  choice: मैं नहीं डरूँगा
  rationale: भविष्यकाल को सीधे और स्वाभाविक हिन्दी में रखा गया है।
- source_word: τί ποιήσει μοι ἄνθρωπος
  choice: मनुष्य मेरा क्या कर सकता है?
  rationale: ποιήσει रूपतः भविष्यकाल है, पर प्रश्न आलंकारिक रूप से मानवीय धमकी की सीमा बताता है। हिन्दी में ‘क्या कर सकता है?’ वही निहित बल स्वाभाविक रूप से व्यक्त करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ἄνθρωπος का सामान्य मानव-वाचक अर्थ
  choice: मनुष्य
  alternative: कोई इंसान / मानव
  rationale: एकवचन ἄνθρωπος यहाँ प्रतिनिधिक और सामान्य अर्थ में किसी भी मानव को सूचित करता है। ‘मनुष्य’ हिन्दी में इस एकवचन सामान्य अर्थ को बिना केवल पुरुषों तक सीमित किए सुरक्षित रखता है।
- issue: आलंकारिक भविष्यकाल ποιήσει का बल
  choice: मनुष्य मेरा क्या कर सकता है?
  alternative: मनुष्य मेरा क्या करेगा?
  rationale: मूल क्रिया भविष्यकालीन है, किंतु प्रश्न का आशय मनुष्य की अंतिम असमर्थता पर बल देना है। ‘क्या कर सकता है?’ आधुनिक हिन्दी में इस आलंकारिक आशय को स्पष्ट रखता है, जबकि औपचारिक विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हिम्मत के साथ’ सामान्य पाठक के लिए स्पष्ट है और θαρροῦντας के साहसपूर्ण विश्वास को व्यक्त करता है। पद के उद्धरणात्मक और भक्तिपूर्ण स्वर को बनाए रखा गया है।
