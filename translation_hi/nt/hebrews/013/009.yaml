source:
  edition: SBLGNT
  text: διδαχαῖς ποικίλαις καὶ ξέναις μὴ παραφέρεσθε· καλὸν γὰρ χάριτι βεβαιοῦσθαι τὴν καρδίαν, οὐ βρώμασιν, ἐν οἷς οὐκ ὠφελήθησαν οἱ ⸀περιπατοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/009.yaml
  text: Do not be carried away by various and strange teachings[a], for it is good for the heart to be strengthened by grace, not by foods[c][b], by which those who occupied themselves with them were not benefited.
translation:
  language: hi
  text: तरह-तरह की और अनजानी शिक्षाओं के बहकावे में न आओ। क्योंकि यह अच्छा है कि हृदय अनुग्रह से दृढ़ हो, न कि भोज्य पदार्थों से[a]; जो लोग इन्हीं में लगे रहे, उन्हें इनसे कोई लाभ नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “भोज्य पदार्थों” से सम्भवतः भोजन-संबंधी धार्मिक प्रथाएँ या आहार-विधियाँ अभिप्रेत हैं; यूनानी पाठ में केवल “भोज्य पदार्थों” कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: διδαχαῖς ποικίλαις καὶ ξέναις
  choice: तरह-तरह की और अनजानी शिक्षाओं
  rationale: ποικίλαις विविधता को और ξέναις ऐसी शिक्षाओं को सूचित करता है जो स्वीकृत संदेश से परायी या अपरिचित हैं। ‘अनजानी’ चेतावनी का भाव रखता है, पर किसी जातीय या भौगोलिक अर्थ को नहीं जोड़ता।
- source_word: μὴ παραφέρεσθε
  choice: बहकावे में न आओ
  rationale: वर्तमान निषेधात्मक निष्क्रिय रूप लगातार सावधान रहने का संकेत देता है। यह स्वाभाविक हिन्दी में मार्ग से बहा या भटका दिए जाने के रूपक को व्यक्त करता है।
- source_word: χάριτι βεβαιοῦσθαι τὴν καρδίαν
  choice: हृदय अनुग्रह से दृढ़ हो
  rationale: χάριτι साधन को दर्शाता है और βεβαιοῦσθαι का अर्थ दृढ़ या स्थिर किया जाना है। ‘हृदय’ को भीतरी व्यक्ति के बाइबलीय रूपक के रूप में बनाए रखा गया है।
- source_word: οὐ βρώμασιν
  choice: न कि भोज्य पदार्थों से
  rationale: βρώμασιν का प्रत्यक्ष अर्थ खाने की वस्तुएँ या भोज्य पदार्थ है। मुख्य पाठ में इसे भोजन-संबंधी नियम या अनुष्ठान कहकर अर्थ को आवश्यकता से अधिक सीमित नहीं किया गया।
- source_word: οἱ περιπατοῦντες
  choice: जो लोग इन्हीं में लगे रहे
  rationale: शाब्दिक अर्थ ‘इनमें चलते रहे’ है, पर भोज्य पदार्थों के साथ हिन्दी में यह अस्वाभाविक होगा। चुना हुआ रूप ऐसे आचरण या व्यवहार में लगे रहने का प्रसंगगत अर्थ देता है।
- source_word: οὐκ ὠφελήθησαν
  choice: उन्हें इनसे कोई लाभ नहीं हुआ
  rationale: यह सहज हिन्दी में निष्क्रिय अर्थ और लेखक का नकारात्मक मूल्यांकन दोनों स्पष्ट करता है।
theological_decisions:
- issue: ‘भोज्य पदार्थों’ का सन्दर्भ और अनुग्रह के साथ उसका विरोध
  choice: मुख्य पाठ केवल ‘भोज्य पदार्थों’ कहता है और अनुग्रह को हृदय की दृढ़ता का साधन बताता है।
  alternative: इसे विशेष रूप से बलि के भोज, यहूदी आहार-विधियों, या सामान्य भोजन-संबंधी अनुष्ठानों के रूप में स्पष्ट करना।
  rationale: βρώμασιν स्वयं व्यापक शब्द है। सन्दर्भ में आहार-संबंधी धार्मिक प्रथाएँ सम्भव हैं, पर मूल पाठ उनके ठीक स्वरूप को निश्चित नहीं करता; इसलिए यह तनाव बनाए रखा गया है।
- issue: ‘हृदय’ का रूपक
  choice: हृदय
  alternative: मन या भीतरी जीवन
  rationale: καρδία को बनाए रखने से मनुष्य के भीतरी केंद्र का बाइबलीय और धर्मवैचारिक भार सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अनुग्रह,’ ‘हृदय’ और ‘दृढ़’ जैसे स्थापित बाइबलीय शब्द सुरक्षित हैं; अंतिम उपवाक्य को शाब्दिक ‘इनमें चलते रहे’ के बजाय स्वाभाविक हिन्दी में व्यक्त किया गया है।
