  text: τῆς δὲ εὐποιΐας καὶ κοινωνίας μὴ ἐπιλανθάνεσθε, τοιαύταις γὰρ θυσίαις εὐαρεστεῖται ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/013/016.yaml
  text: And do not neglect doing good and sharing[b][a], for with such sacrifices God is pleased.
translation:
  language: hi
  text: और भलाई करना और बाँटना न भूलो[a][b], क्योंकि ऐसे बलिदानों से परमेश्वर प्रसन्न होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उपेक्षा न करो।” यूनानी क्रिया का शाब्दिक अर्थ “न भूलो” है, पर यहाँ इसका व्यावहारिक भाव इन कामों को करने में चूक न करने का भी है।
    reason: lexical_alternative
  - marker: b
    text: “बाँटना” का अनुवाद “सहभागिता” या “उदारता दिखाना” भी हो सकता है; इस संदर्भ में संभवतः इसका अर्थ दूसरों के साथ अपने संसाधन साझा करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐποιΐας
  choice: भलाई करना
  rationale: यह संज्ञा सक्रिय रूप से भला करने या हितकारी काम करने का भाव रखती है। ‘भलाई करना’ आधुनिक हिन्दी में स्वाभाविक है और क्रियात्मक बल बनाए रखता है।
- source_word: κοινωνίας
  choice: बाँटना
  rationale: εὐποιΐας के साथ और ‘ऐसे बलिदानों’ के संदर्भ में यह दूसरों के साथ अपने संसाधन साझा करने की व्यावहारिक उदारता की ओर संकेत करता है; ‘बाँटना’ इसे बिना अनावश्यक रूप से सीमित किए व्यक्त करता है।
- source_word: μὴ ἐπιλανθάνεσθε
  choice: न भूलो
  rationale: यह यूनानी क्रिया का सीधा अर्थ सुरक्षित रखता है, जबकि इस आज्ञात्मक संदर्भ में व्यवहार में इन कामों की उपेक्षा न करने का भाव भी स्वाभाविक रूप से समझ में आता है।
- source_word: τοιαύταις ... θυσίαις
  choice: ऐसे बलिदानों से
  rationale: यह भलाई और बाँटने के कार्यों के लिए प्रयुक्त स्पष्ट बलिदान-संबंधी रूपक को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εὐαρεστεῖται
  choice: प्रसन्न होता है
  rationale: यह क्रिया परमेश्वर के इन बलिदानों से प्रसन्न होने को व्यक्त करती है और आधुनिक हिन्दी में सहज है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: बाइबलीय हिन्दी में θεός का मानक, गरिमापूर्ण और व्यापक रूप से समझा जाने वाला अनुवाद।
- source_word: δὲ
  choice: और
  rationale: यहाँ δέ प्रबल विरोध के बजाय पिछले उपदेश से संबंध जोड़ता है; ‘और’ उसका सहज हिन्दी संयोजक है।
theological_decisions:
- issue: पद में ‘बलिदानों’ का स्वरूप
  choice: भलाई करने और बाँटने के कार्यों के लिए रूपकात्मक बलिदान-भाषा
  alternative: इसे केवल दान देना अथवा बलिदान-संबंधी भाव से रहित सामान्य नैतिक आचरण मानना
  rationale: यूनानी पाठ इन नैतिक कार्यों को स्पष्टतः ‘बलिदान’ कहता है। अनुवाद इस धार्मिक रूपक को बनाए रखता है, पर इसे केवल आर्थिक दान तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज। ‘न भूलो’ मूल यूनानी की सीधी अभिव्यक्ति को रखता है, जबकि पादटिप्पणी उसका व्यावहारिक अर्थ स्पष्ट करती है।
