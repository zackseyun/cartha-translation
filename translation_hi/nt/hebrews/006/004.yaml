  text: Ἀδύνατον γὰρ τοὺς ἅπαξ φωτισθέντας γευσαμένους τε τῆς δωρεᾶς τῆς ἐπουρανίου καὶ μετόχους γενηθέντας πνεύματος ἁγίου
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/004.yaml
  text: For it is impossible[a], in the case of those who were once enlightened, and who tasted the heavenly gift, and became partakers of the Holy Spirit[c][b],
translation:
  language: hi
  text: क्योंकि यह असंभव है कि जो लोग एक बार ज्योति पा चुके हैं[a], स्वर्गीय वरदान का स्वाद चख चुके हैं[b] और पवित्र आत्मा के सहभागी बन चुके हैं[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ज्योति पाना’ सामान्य रूप से आत्मिक प्रकाश या शिक्षा ग्रहण करने को सूचित कर सकता है; कुछ लोग इसे विशेष रूप से मन-परिवर्तन या बपतिस्मा से संबंधित ज्योति के अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: या ‘स्वर्गीय वरदान का अनुभव कर चुके हैं।’ मूल क्रिया का शाब्दिक अर्थ ‘स्वाद चखना’ है और वह केवल थोड़ा-सा नमूना लेने के बजाय वास्तविक अनुभव को भी दर्शा सकती है।
    reason: lexical_alternative
  - marker: c
    text: या ‘पवित्र आत्मा में हिस्सा पा चुके हैं’ अथवा ‘पवित्र आत्मा के भागी बन चुके हैं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀδύνατον γὰρ
  choice: क्योंकि यह असम्भव है
