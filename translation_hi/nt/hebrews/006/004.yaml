- source_word: ἅπαξ φωτισθέντας
  choice: जो लोग एक बार ज्योति पा चुके हैं
  rationale: ‘एक बार’ किसी पूर्व घटित अनुभव को व्यक्त करता है, जबकि ‘ज्योति पाना’ मूल रूपक को स्वाभाविक आधुनिक हिन्दी में रखता है और उसे परिवर्तन या बपतिस्मा तक सीमित नहीं करता।
- source_word: γευσαμένους ... τῆς δωρεᾶς τῆς ἐπουρανίου
  choice: स्वर्गीय वरदान का स्वाद चख चुके हैं
  rationale: ‘स्वाद चखना’ मूल ठोस रूपक को सुरक्षित रखता है; ‘स्वर्गीय वरदान’ वरदान की पहचान को अनिर्दिष्ट ही रहने देता है।
- source_word: μετόχους γενηθέντας πνεύματος ἁγίου
  choice: पवित्र आत्मा के सहभागी बन चुके हैं
  rationale: यह वाक्यांश किसी वस्तु या अनुभव में हिस्सा रखने का सशक्त भाव देता है और मूल क्रिया में निहित एक अवस्था में प्रवेश करने को ‘बन चुके हैं’ से व्यक्त करता है।
theological_decisions:
- issue: क्या φωτισθέντας को विशेष रूप से मन-परिवर्तन या बपतिस्मा के अर्थ में व्यक्त किया जाए
  choice: व्यापक रूपक ‘ज्योति पा चुके हैं’ रखा गया
  alternative: मन-परिवर्तन कर चुके हैं; बपतिस्मा के द्वारा ज्योति पा चुके हैं
  rationale: यूनानी पाठ अनुभव को स्पष्ट रूप से मन-परिवर्तन या बपतिस्मा नहीं कहता; व्यापक अभिव्यक्ति वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को बनाए रखती है।
- issue: क्या γευσαμένους केवल थोड़ा-सा चखने या पूर्ण अनुभव को दर्शाता है
  choice: शाब्दिक रूपक ‘स्वाद चख चुके हैं’ रखा गया
  alternative: अनुभव कर चुके हैं; केवल नमूना चख चुके हैं
  rationale: क्रिया वास्तविक अनुभव को सूचित कर सकती है, पर उसकी सीमा स्वयं इस पद में तय नहीं होती; अनुवाद विश्वासत्याग और धीरज के विवाद को शब्द-चयन से नहीं सुलझाता।
- issue: पवित्र आत्मा के ‘सहभागी’ होने की धर्मवैज्ञानिक सीमा
  choice: पवित्र आत्मा के सहभागी बन चुके हैं
  alternative: पवित्र आत्मा में हिस्सा पा चुके हैं; पवित्र आत्मा के भागी बन चुके हैं
  rationale: यह मूल अभिव्यक्ति की शक्ति को बनाए रखता है, पर उद्धारकारी निवास अथवा अपेक्षाकृत व्यापक सहभागिता में से किसी एक व्यवस्थित धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद यूनानी वाक्य का अधूरा भाग है जो आगे के पदों में पूरा होता है; इसलिए अन्त में अल्पविराम रखा गया है और ऐसा कोई कर्म नहीं जोड़ा गया जिसे मूल पाठ अगले पदों तक स्थगित रखता है।
