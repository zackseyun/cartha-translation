translation:
  language: hi
  text: यह कहते हुए[a], “निश्चय ही मैं तुम्हें आशीष दूँगा और निश्चय ही तुम्हारी संख्या बहुत बढ़ाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में दोनों क्रियाओं में जोर देने वाली पुनरुक्ति है: ‘आशीष देते हुए मैं तुम्हें आशीष दूँगा, और बढ़ाते हुए मैं तुम्हें बढ़ाऊँगा।’ यह रचना उत्पत्ति 22:17 की प्रतिध्वनि है।'
    reason: मूल की जोरदार पुनरुक्ति और उत्पत्ति 22:17 से उसके संबंध को सुरक्षित रखना।
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदन्त परमेश्वर की शपथ के कथन को प्रस्तुत करता है; यह हिन्दी में स्वाभाविक रूप से पिछले पद से जुड़ता है।
- source_word: Εἰ μὴν
  choice: निश्चय ही
  rationale: यह शपथ-संबंधी दृढ़ प्रतिज्ञान है, वास्तविक शर्त नहीं; ‘निश्चय ही’ इसके बल को स्पष्ट करता है।
- source_word: εὐλογῶν εὐλογήσω
  choice: मैं तुम्हें आशीष दूँगा
  rationale: कृदन्त और सीमित क्रिया की पुनरुक्ति सामी शैली का जोरदार प्रयोग है; मुख्य पाठ में सहज हिन्दी रखी गई और बल ‘निश्चय ही’ तथा पादटिप्पणी में सुरक्षित है।
- source_word: σε
  choice: तुम्हें / तुम्हारी
  rationale: एकवचन द्वितीय पुरुष सर्वनाम अब्राहम को संबोधित करता है; हिन्दी वाक्य-विन्यास के अनुसार दोनों क्रियाओं के साथ उचित कारक-रूप लिए गए हैं।
- source_word: καὶ
  choice: और
  rationale: दोनों प्रतिज्ञात कार्यों को जोड़ने वाला साधारण समुच्चयबोधक।
- source_word: πληθύνων πληθυνῶ
  choice: तुम्हारी संख्या बहुत बढ़ाऊँगा
  rationale: ‘बहुगुणित करना’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और अब्राहम की संतति को अत्यन्त बढ़ाने के आशय को व्यक्त करता है; मूल की पुनरुक्ति पादटिप्पणी में दी गई है।
theological_decisions:
- issue: अब्राहम से की गई प्रतिज्ञा में शपथ-सूचक जोर और दोनों क्रियाओं की समानान्तर पुनरुक्ति
  choice: दोनों खंडों में ‘निश्चय ही’ रखकर दृढ़ता और समानान्तरता व्यक्त करना, तथा मूल संरचना को पादटिप्पणी में बताना
  alternative: 'शब्दशः: ‘आशीष देते हुए मैं तुम्हें आशीष दूँगा और बढ़ाते हुए मैं तुम्हें बढ़ाऊँगा’'
  rationale: यूनानी पाठ उत्पत्ति 22:17 की सेप्टुआजिन्ट शैली को प्रतिध्वनित करता है। सहज आधुनिक हिन्दी में शाब्दिक पुनरुक्ति अस्वाभाविक होगी, इसलिए उसका जोर मुख्य पाठ और उसका रूप पादटिप्पणी—दोनों में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। ‘आशीष’ बाइबलीय संदर्भ में परिचित है; ‘तुम्हारी संख्या बहुत बढ़ाऊँगा’ स्वाभाविक हिन्दी में πληθύνω का आशय देता है।
