  verdict: revise
  source_fidelity: The draft accurately renders the purpose clause, the warning against becoming νωθροί, the call to imitate, and the paired means of faith and patience. However, “प्रतिज्ञाओं के वारिस होते हैं” is grammatically possible but is not idiomatic modern Hindi for inheriting promises; it can sound as though the promises themselves are heirs. “प्रतिज्ञाओं को विरासत में पाते हैं” clearly preserves κληρονομούντων and the plural τὰς ἐπαγγελίας.
  naturalness: The verse is otherwise clear, dignified, and appropriate for modern standard Hindi. The revision makes the final relative clause more natural without weakening the inheritance imagery.
  terminology: “विश्वास,” “धीरज,” and “प्रतिज्ञाएँ” are suitable and consistent. The footnote should state the alternative as a complete phrase so that its scope is unambiguous.
  issues:
  - severity: medium
    issue: “प्रतिज्ञाओं के वारिस होते हैं” is awkward and potentially ambiguous in Hindi.
    rationale: Hindi normally expresses inheriting an object with “को विरासत में पाना/मिलना.” The proposed wording retains the source’s inheritance metaphor and its present, characterizing sense.
  - severity: low
    issue: The footnote alternative is incomplete as written.
    rationale: “या ‘विश्वासयोग्यता’” leaves the relation expressed by διὰ unclear. Rendering the full alternative phrase better reflects the Greek expression while retaining the lexical note.
