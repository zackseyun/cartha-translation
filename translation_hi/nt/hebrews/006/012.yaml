  text: ἵνα μὴ νωθροὶ γένησθε, μιμηταὶ δὲ τῶν διὰ πίστεως καὶ μακροθυμίας κληρονομούντων τὰς ἐπαγγελίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/012.yaml
  text: so that you may not become sluggish[a], but imitators of those who through faith and patience inherit the promises.
translation:
  language: hi
  text: ताकि तुम सुस्त न हो जाओ, बल्कि उन लोगों का अनुकरण करो जो विश्वास[a] और धीरज के द्वारा प्रतिज्ञाओं को विरासत में पाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्यता के द्वारा।” यूनानी शब्द का अर्थ कुछ प्रसंगों में “विश्वासयोग्यता” या “भरोसा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: νωθροὶ
  choice: सुस्त
  rationale: यह शब्द प्रतिक्रिया या प्रयास में धीमे और शिथिल होने का भाव देता है। संदर्भ में यह आत्मिक तत्परता की कमी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γένησθε
  choice: हो जाओ
  rationale: यहाँ क्रिया किसी अवस्था में आ जाने की चेतावनी देती है; इसलिए केवल 'हो' की अपेक्षा 'हो जाओ' अधिक उपयुक्त है।
- source_word: μιμηταὶ
  choice: अनुकरण करो
  rationale: यूनानी संज्ञा का अर्थ अनुकरण करने वाले होना है। हिन्दी में क्रियात्मक रचना अधिक स्वाभाविक है और दूसरों के आदर्श पर चलने का स्पष्ट आह्वान बनाए रखती है।
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: πίστις का सामान्य और व्यापक हिन्दी रूप 'विश्वास' है। करणसूचक 'के द्वारा' यूनानी διά का संबंध सुरक्षित रखता है।
- source_word: μακροθυμίας
  choice: धीरज
  rationale: यह लंबे समय तक धैर्यपूर्वक बने रहने का भाव व्यक्त करता है। 'धीरज' आधुनिक, गरिमापूर्ण और संदर्भानुकूल है।
- source_word: κληρονομούντων
  choice: वारिस होते हैं
  rationale: वर्तमान कृदन्त उन लोगों की विशेषता बताता है जो प्रतिज्ञाओं को विरासत के रूप में पाते हैं। यह रूप विरासत की छवि और सामान्य वर्तमान दोनों को बनाए रखता है।
- source_word: τὰς ἐπαγγελίας
  choice: प्रतिज्ञाओं
  rationale: यूनानी में बहुवचन स्पष्ट है; 'प्रतिज्ञाओं' से वह सुरक्षित रहता है और इब्रानियों में परमेश्वर की प्रतिज्ञाओं की पुनरावृत्त धारणा से जुड़ता है।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह पिछले उपदेश से जुड़े उद्देश्य अथवा अपेक्षित परिणाम को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: विश्वासयोग्यता या भरोसा
  rationale: इस प्रसंग में परमेश्वर पर भरोसे का भाव प्रमुख हो सकता है, पर πίστης की अर्थ-व्याप्ति को संकीर्ण किए बिना 'विश्वास' मानक और व्यापक रूप है। वास्तविक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। 'सुस्त' को अनावश्यक नैतिक आरोप वाले 'आलसी' पर प्राथमिकता दी गई है; 'अनुकरण करो' मूल की स्पष्ट आदर्श-अनुसरण भाषा को बनाए रखता है।
