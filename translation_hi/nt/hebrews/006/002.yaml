  text: instruction about washings[a], the laying on of hands, the resurrection of the dead, and eternal judgment.
translation:
  language: hi
  text: शुद्धिकरण-स्नानों[a], हाथ रखने, मरे हुओं के जी उठने और अनन्त न्याय के विषय में शिक्षा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बपतिस्मों’। यूनानी बहुवचन का अर्थ अधिक व्यापक रूप से धार्मिक रीति के शुद्धिकरण-स्नान भी हो सकता है; यह आवश्यक नहीं कि यहाँ विशेष रूप से मसीही बपतिस्मे ही अभिप्रेत हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: βαπτισμῶν
  choice: शुद्धिकरण-स्नानों
  rationale: यूनानी बहुवचन धार्मिक या विधिगत धुलाई-स्नानों को व्यापक रूप से सूचित कर सकता है। यह चयन बहुवचन को बनाए रखता है और इसे केवल मसीही बपतिस्मे तक सीमित नहीं करता।
- source_word: διδαχὴν
  choice: के विषय में शिक्षा
  rationale: यह पिछले पद से चली आ रही बुनियादी विषयों की सूची का अंग है। हिन्दी में वाक्य की स्पष्टता के लिए ‘शिक्षा’ को अंत में दोहराया गया है।
- source_word: ἐπιθέσεώς τε χειρῶν
  choice: हाथ रखने
  rationale: यह यूनानी पदबंध का स्वाभाविक और प्रचलित हिन्दी रूप है, बिना उसके उद्देश्य या धार्मिक प्रयोग को अधिक विशिष्ट बनाए।
- source_word: ἀναστάσεώς τε νεκρῶν
  choice: मरे हुओं के जी उठने
  rationale: यह सरल आधुनिक हिन्दी में सामूहिक νεκρῶν और पुनरुत्थान के अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: κρίματος αἰωνίου
  choice: अनन्त न्याय
  rationale: यह न्याय को केवल दण्डादेश तक सीमित किए बिना αἰωνίου की स्थायी/अनन्त धारणा को बनाए रखता है।
- source_word: τε ... τε καὶ
  choice: …, … और …
  rationale: यूनानी संयोजक सूची को संरचित करते हैं; हिन्दी में सहज समन्वित सूची उसी संबंध को पर्याप्त रूप से व्यक्त करती है।
theological_decisions:
- issue: सूची में βαπτισμῶν का अर्थ
  choice: ‘शुद्धिकरण-स्नानों’ रखा गया है।
  alternative: ‘बपतिस्मों’
  rationale: बहुवचन रूप और शब्द का व्यापक प्रयोग विधिगत धुलाई-स्नानों की संभावना रखते हैं। मुख्य पाठ किसी विशिष्ट संस्कारवादी अर्थ को अनावश्यक रूप से नहीं थोपता, जबकि पादटिप्पणी दूसरा सम्भव अर्थ सुरक्षित रखती है।
- issue: κρίματος αἰωνίου का दायरा
  choice: ‘अनन्त न्याय’ रखा गया है।
  alternative: ‘अनन्त दण्डादेश’
  rationale: यूनानी पाठ ‘न्याय’ कहता है, केवल दोषसिद्धि या दण्डादेश नहीं; इसलिए अनुवाद उसके दायरे को संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है। ‘शुद्धिकरण-स्नान’ विधिगत संदर्भ को स्पष्ट करता है, और पादटिप्पणी वास्तविक शाब्दिक अस्पष्टता बनाए रखती है।
