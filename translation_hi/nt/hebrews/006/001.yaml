source:
  edition: SBLGNT
  text: Διὸ ἀφέντες τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον ἐπὶ τὴν τελειότητα φερώμεθα, μὴ πάλιν θεμέλιον καταβαλλόμενοι μετανοίας ἀπὸ νεκρῶν ἔργων, καὶ πίστεως ἐπὶ θεόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/001.yaml
  text: Therefore[a], leaving the elementary message about the Messiah, let us be carried on to maturity, not laying again a foundation of repentance from dead works and of faith toward God[d][c][b],
translation:
  language: hi
  text: इसलिए, मसीह के विषय में आरम्भिक शिक्षा को पीछे छोड़कर, हम परिपक्वता की ओर आगे बढ़ाए जाएँ[a], और फिर से मृत कर्मों से मन फिराने तथा परमेश्वर पर विश्वास की नींव न डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “हम परिपक्वता की ओर आगे बढ़ें।” यूनानी में क्रिया का रूप अधिक शाब्दिक रूप से निष्क्रिय है: “हम आगे बढ़ाए जाएँ।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὸ
  choice: इसलिए
  rationale: यह पिछले विचार से निष्कर्ष निकालते हुए आगे के उपदेश का परिचय देता है।
- source_word: ἀφέντες
  choice: पीछे छोड़कर
  rationale: यह वर्तमान ध्यान को आरम्भिक शिक्षा से आगे ले जाने का भाव देता है, उसे त्यागने या नकारने का नहीं।
- source_word: τὸν τῆς ἀρχῆς τοῦ Χριστοῦ λόγον
  choice: मसीह के विषय में आरम्भिक शिक्षा
  rationale: λόγος को प्रसंगानुसार ‘शिक्षा’ और τῆς ἀρχῆς को आधारभूत या प्रारम्भिक स्तर के अर्थ में व्यक्त किया गया है; कठिन संबंध-रचना को स्वाभाविक हिन्दी में रखा गया है।
- source_word: Χριστοῦ
  choice: मसीह
  rationale: यहाँ Χριστός उपाधि के रूप में समझा जाता है; ‘मसीह’ प्रचलित और अर्थपूर्ण हिन्दी रूप है।
- source_word: ἐπὶ τὴν τελειότητα
  choice: परिपक्वता की ओर
  rationale: प्रसंग आरम्भिक शिक्षा से पूर्ण विकसित समझ की ओर बढ़ने का है; ‘परिपक्वता’ निरपेक्ष निष्पाप पूर्णता का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: φερώμεθα
  choice: हम ... आगे बढ़ाए जाएँ
  rationale: वर्तमान निष्क्रिय विधिलिंग का निष्क्रिय भाव सुरक्षित रखा गया है, यद्यपि हिन्दी में इसे स्वाभाविक बनाने के लिए ‘आगे’ जोड़ा गया है।
- source_word: θεμέλιον καταβαλλόμενοι
  choice: नींव ... डालें
  rationale: मूल निर्माण-रूपक को सहज हिन्दी मुहावरे में सुरक्षित रखा गया है।
- source_word: μετανοίας ἀπὸ νεκρῶν ἔργων
  choice: निर्जीव कामों से मन फिराने
  rationale: μετάνοια का दिशा-परिवर्तन ‘मन फिराने’ से व्यक्त होता है; νεκρῶν ἔργων की रूपकात्मक अस्पष्टता को ‘निर्जीव कामों’ में बनाए रखा गया है।
- source_word: πίστεως ἐπὶ θεόν
  choice: परमेश्वर पर विश्वास करने
  rationale: ἐπί के दिशात्मक/आश्रयात्मक भाव को स्वाभाविक हिन्दी ‘पर ... विश्वास’ में व्यक्त किया गया है।
theological_decisions:
- issue: आरम्भिक मसीही शिक्षा को ‘छोड़ने’ का अभिप्राय
  choice: उसे नकारना नहीं, बल्कि उसे नींव मानकर उससे आगे बढ़ना
  alternative: मसीह की शिक्षा को त्याग देना
  rationale: अगला वाक्यांश ‘फिर से नींव न डालें’ स्पष्ट करता है कि विषय प्रगति है, परित्याग नहीं।
- issue: τελειότης का अर्थ
  choice: परिपक्वता
  alternative: पूर्णता
  rationale: आरम्भिक शिक्षा और आगे के विकास के विरोध में ‘परिपक्वता’ प्रसंगानुकूल है; ‘पूर्णता’ भी शाब्दिक विकल्प है, पर आधुनिक हिन्दी में वह निरपेक्ष सिद्धता का संकेत दे सकती है।
- issue: φερώμεθα की वाच्यता
  choice: 'निष्क्रिय भाव सुरक्षित: ‘आगे बढ़ाए जाएँ’'
  alternative: 'सक्रिय भाव: ‘आगे बढ़ें’'
  rationale: मूल यूनानी निष्क्रिय रूप में है; उसका संरक्षण प्रगति को केवल स्व-प्रेरित प्रयास के रूप में प्रस्तुत करने से बचाता है, बिना यह निर्धारित किए कि कर्ता कौन है।
- issue: νεκρὰ ἔργα का आशय
  choice: ‘निर्जीव काम’ रूपक को खुला रखना
  alternative: मृत्यु की ओर ले जाने वाले काम / पापमय काम
  rationale: मूल वाक्यांश संक्षिप्त और अर्थ की दृष्टि से खुला है; अधिक विशिष्ट अनुवाद अनावश्यक व्याख्या जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘मसीह’, ‘नींव’, ‘मन फिराना’ और ‘विश्वास’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। निष्क्रिय क्रिया की असामान्य किंतु महत्त्वपूर्ण छाया मुख्य पाठ में सुरक्षित है और पादटिप्पणी में स्वाभाविक सक्रिय विकल्प दिया गया है।
