id: HEB.6.10
reference: Hebrews 6:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ ἄδικος ὁ θεὸς ἐπιλαθέσθαι τοῦ ἔργου ὑμῶν ⸀καὶ τῆς ἀγάπης ἧς ἐνεδείξασθε εἰς τὸ ὄνομα αὐτοῦ, διακονήσαντες τοῖς ἁγίοις καὶ διακονοῦντες.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/010.yaml
  text: For God is not unjust so as to forget your work and the love that you showed for his name in having served the saints and in continuing to serve them[a][b][c].
translation:
  language: hi
  text: क्योंकि परमेश्वर अन्यायी नहीं है कि वह तुम्हारे काम और उस प्रेम को भूल जाए जो तुमने उसके नाम के प्रति[a] दिखाया है—पवित्र लोगों[b] की सेवा करके और अब भी उनकी सेवा करते हुए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके नाम की खातिर।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात साथी विश्वासी; यहाँ “पवित्र लोग” परमेश्वर के पवित्र लोगों को दर्शाता है, बाद में संत घोषित किए गए किसी विशेष वर्ग को नहीं।
    reason: cultural_note
  - marker: c
    text: या, “पवित्र लोगों की सेवा करते आए हो और अब भी उनकी सेवा कर रहे हो।”
    reason: previous_rendering
lexical_decisions:
- source_word: ἄδικος
  choice: अन्यायी
  rationale: यहाँ शब्द का अर्थ न्याय के विरुद्ध आचरण करने वाला है। ‘अन्यायी’ आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर द्वारा उनके काम की उपेक्षा न किए जाने की बात स्पष्ट करता है।
- source_word: ἐπιλαθέσθαι
  choice: भूल जाए
  rationale: यह मूल क्रिया का सीधा अर्थ सुरक्षित रखता है; प्रसंग में इसका आशय उनके काम को स्मरण में रखकर उसका उचित ध्यान देना है।
- source_word: τοῦ ἔργου ὑμῶν
  choice: तुम्हारे काम
  rationale: एकवचन ἔργον को सामूहिक अर्थ में ‘काम’ कहना स्वाभाविक है और आगे वर्णित सेवा को समेटता है।
- source_word: τῆς ἀγάπης
  choice: उस प्रेम
  rationale: ἀγάπη का सामान्य और सीधा हिन्दी प्रतिशब्द ‘प्रेम’ है; संकेतवाचक ‘उस’ आगे आने वाले संबंधवाचक उपवाक्य से इसे सहजता से जोड़ता है।
- source_word: ἐνεδείξασθε
  choice: दिखाया है
  rationale: क्रिया किसी गुण को व्यवहार में प्रकट या प्रमाणित करने को बताती है। ‘दिखाया है’ सरल और स्वाभाविक हिन्दी है।
- source_word: εἰς τὸ ὄνομα αὐτοῦ
  choice: उसके नाम के प्रति
  rationale: εἰς की दिशात्मकता और ‘नाम’ की बाइबलीय अभिव्यक्ति दोनों सुरक्षित रहती हैं। वाक्यांश में परमेश्वर के प्रति भक्ति और उसके नाम के आदर का भाव है।
- source_word: διακονήσαντες
  choice: सेवा करके
  rationale: अओरिस्ट कृदंत पूर्व में की गई सेवा की ओर संकेत करता है; ‘सेवा करके’ प्रेम दिखाने के ठोस माध्यम को व्यक्त करता है।
- source_word: τοῖς ἁγίοις
  choice: पवित्र लोगों
  rationale: शाब्दिक अर्थ ‘पवित्र जन/लोग’ है और यहाँ मसीही विश्वासियों के समुदाय को सूचित करता है। ‘पवित्र लोगों’ बाद में संत घोषित किए गए किसी विशेष वर्ग का भ्रम घटाता है।
- source_word: διακονοῦντες
  choice: अब भी उनकी सेवा करते हुए
  rationale: वर्तमान कृदंत जारी सेवा को दर्शाता है। ‘अब भी’ अओरिस्ट और वर्तमान कृदंत के पक्षगत अंतर को सहज हिन्दी में स्पष्ट करता है; ‘उनकी’ पूर्ववर्ती ‘पवित्र लोगों’ से ग्रहण किया गया है।
theological_decisions:
- issue: क्या यह पद मनुष्य के कामों द्वारा उद्धार अर्जित करने की शिक्षा देता है या परमेश्वर द्वारा विश्वासियों के काम और प्रेम को न्यायपूर्वक स्मरण रखने की बात करता है?
  choice: अनुवाद केवल यह कहता है कि परमेश्वर अन्यायी नहीं है कि उनके काम और प्रेम को भूल जाए।
  alternative: ऐसी शब्दावली अपनाना जिससे लगे कि मनुष्य के कामों के कारण परमेश्वर उद्धार या प्रतिफल देने के ऋणी हैं।
  rationale: यूनानी पाठ परमेश्वर के न्याय और उनके काम व प्रेम को न भूलने का दावा करता है, पर यहाँ अर्जित उद्धार या परमेश्वर पर मानवीय ऋण का सिद्धांत स्पष्ट रूप से नहीं कहता। इसलिए मूल कथन और उसका तनाव बिना अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के रखा गया है।
- issue: εἰς τὸ ὄνομα αὐτοῦ का संबंध
  choice: ‘उसके नाम के प्रति’ को प्रेम के साथ जोड़ा गया है।
  alternative: ‘उसके नाम की खातिर’ अर्थात सेवा के उद्देश्य या कारण के रूप में लेना।
  rationale: यूनानी संरचना प्रेम को परमेश्वर के नाम की ओर निर्देशित बताती है, पर εἰς उद्देश्य अथवा हित का भाव भी दे सकता है। मुख्य पाठ दिशात्मक अर्थ रखता है और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- issue: दोनों कृदंतों का कार्य
  choice: ‘सेवा करके और अब भी उनकी सेवा करते हुए’ को प्रेम दिखाने की ठोस अभिव्यक्ति माना गया है।
  alternative: इन्हें अधिक स्वतंत्र कालगत कथनों की तरह पढ़ना—‘तुमने सेवा की थी और अब भी करते हो।’
  rationale: दोनों कृदंत मुख्य कथन से परिस्थितिजन्य रूप में जुड़े हैं और सेवा के भूतकालीन तथा निरंतर पहलू सामने रखते हैं। हिन्दी में संबंध को स्वाभाविक रखते हुए काल-पक्ष का अंतर भी बचाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अन्यायी’, ‘प्रेम’, ‘नाम’ और ‘सेवा’ जैसे सीधे बाइबलीय शब्द सुरक्षित हैं। ‘अब भी’ जोड़कर διακονήσαντες और διακονοῦντες के बीच पूर्ण/पूर्व सेवा तथा जारी सेवा का पक्षगत अंतर स्पष्ट किया गया है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
