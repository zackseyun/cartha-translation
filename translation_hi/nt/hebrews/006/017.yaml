source:
  edition: SBLGNT
  text: ἐν ᾧ περισσότερον βουλόμενος ὁ θεὸς ἐπιδεῖξαι τοῖς κληρονόμοις τῆς ἐπαγγελίας τὸ ἀμετάθετον τῆς βουλῆς αὐτοῦ ἐμεσίτευσεν ὅρκῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/017.yaml
  text: So when God desired to show more clearly to the heirs of the promise the unchangeable character of his purpose[a], he guaranteed it with an oath[b],
translation:
  language: hi
  text: इसी कारण परमेश्वर ने, प्रतिज्ञा के वारिसों को अपने उद्देश्य की अटलता[a] और भी स्पष्ट रूप से दिखाना चाहकर, शपथ के द्वारा उन्हें पक्का आश्वासन दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी योजना की अपरिवर्तनीयता।”
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “शपथ को बीच में रखा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ
  choice: इसीलिए
  rationale: यह पद पिछले कथन से जुड़कर परमेश्वर की शपथ का कारण और प्रसंग बताता है। शाब्दिक ‘जिसमें’ हिंदी में अस्पष्ट होता; ‘इसीलिए’ इसके तार्किक संयोजक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: περισσότερον
  choice: और भी स्पष्ट रूप से
  rationale: यह क्रियाविशेषण ἐπιδεῖξαι को तीव्र करता है। संदर्भ में बात मात्रा से अधिक स्पष्ट प्रदर्शन की है, इसलिए यह आधुनिक हिंदी में सहज और अर्थानुकूल है।
- source_word: βουλόμενος
  choice: इच्छा से
  rationale: यह परमेश्वर के सोचे-समझे इरादे को व्यक्त करता है; वाक्य में ‘दिखाने की इच्छा से’ उद्देश्यपूर्ण चाह को स्वाभाविक हिंदी में रखता है।
- source_word: ἐπιδεῖξαι
  choice: दिखाने
  rationale: क्रिया का अर्थ दिखाना या प्रत्यक्ष रूप से प्रमाणित करना है। ‘और भी स्पष्ट रूप से’ के साथ ‘दिखाने’ सहज तथा पर्याप्त रूप से सशक्त है।
- source_word: κληρονόμοις τῆς ἐπαγγελίας
  choice: प्रतिज्ञा के वारिसों को
  rationale: ‘वारिस’ विरासत पाने के लिए ठहराए गए लोगों का सटीक और प्रचलित शब्द है; संबंधकारक ‘प्रतिज्ञा के’ मूल की संरचना बनाए रखता है।
- source_word: τὸ ἀμετάθετον
  choice: अटलता
  rationale: यह संज्ञा की तरह प्रयुक्त विशेषण उस गुण को बताता है जिसे बदला या हटाया नहीं जा सकता। ‘अटलता’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
- source_word: τῆς βουλῆς αὐτοῦ
  choice: अपने उद्देश्य की
  rationale: βουλή यहाँ परमेश्वर के सुविचारित निश्चय या अभिप्राय को सूचित करता है। ‘उद्देश्य’ तकनीकी दार्शनिक भाषा जोड़े बिना इसका बल व्यक्त करता है।
- source_word: ἐμεσίτευσεν
  choice: इसकी गारंटी दी
  rationale: यह दुर्लभ क्रिया मूलतः बीच में आने या मध्यस्थ रूप से आश्वासन देने का भाव रखती है। प्रसंग में शपथ द्वारा निश्चित आश्वासन देना अभिप्रेत है; ‘गारंटी दी’ आधुनिक हिंदी में उस व्यावहारिक बल को स्पष्ट करता है।
- source_word: ὅρκῳ
  choice: शपथ देकर
  rationale: साधनवाचक चतुर्थी बताती है कि आश्वासन शपथ के माध्यम से दिया गया। ‘शपथ देकर’ स्वाभाविक हिंदी है।
theological_decisions:
- issue: परमेश्वर के उद्देश्य की अपरिवर्तनीयता को बाद की दार्शनिक श्रेणियाँ जोड़े बिना व्यक्त करना
  choice: अपने उद्देश्य की अटलता
  alternative: अपने परामर्श की अपरिवर्तनीयता
  rationale: मूल पाठ परमेश्वर के निश्चय के न बदलने पर बल देता है। ‘अटलता’ उस बल को सुरक्षित रखती है, जबकि ‘अपरिवर्तनीयता’ अधिक तकनीकी और ‘परामर्श’ आधुनिक पाठक के लिए संभावित रूप से अस्पष्ट है।
- issue: ἐμεσίτευσεν और परमेश्वर की शपथ का संबंध
  choice: शपथ देकर इसकी गारंटी दी
  alternative: शपथ के साथ बीच में आया
  rationale: मूल क्रिया में ‘बीच में आने’ का चित्र है, पर संदर्भ में उसका कार्य प्रतिज्ञा के वारिसों को पक्का आश्वासन देना है। मुख्य पाठ कार्यगत अर्थ देता है और पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘गारंटी’ आधुनिक हिंदी में व्यापक रूप से समझा जाने वाला शब्द है और यहाँ दुर्लभ यूनानी क्रिया का आश्वासनकारी बल व्यक्त करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में संबंधित पदों पर लगाए गए हैं।
