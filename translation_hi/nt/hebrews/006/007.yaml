source:
  edition: SBLGNT
  text: γῆ γὰρ ἡ πιοῦσα τὸν ἐπ’ αὐτῆς ⸂ἐρχόμενον πολλάκις⸃ ὑετόν, καὶ τίκτουσα βοτάνην εὔθετον ἐκείνοις δι’ οὓς καὶ γεωργεῖται, μεταλαμβάνει εὐλογίας ἀπὸ τοῦ θεοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/007.yaml
  text: For land that drinks the rain that often comes upon it and produces vegetation useful to those for whose sake it is also cultivated receives blessing from God[a][b].
translation:
  language: hi
  text: क्योंकि जो भूमि अपने ऊपर बार-बार आने वाली वर्षा को पी लेती है और उन लोगों के लिए उपयोगी वनस्पति उपजाती है, जिनके लिए उसकी खेती भी की जाती है,[a][b] वह परमेश्वर से आशीष पाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “वनस्पति” के स्थान पर “पौधे,” “हरियाली” या “उपज” भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या “उन लोगों के द्वारा, जो उसकी खेती करते हैं”; परन्तु यहाँ यूनानी में “जिनके लिए उसकी खेती की जाती है” अधिक स्वाभाविक अर्थ है।
    reason: alternative_reading
lexical_decisions:
- source_word: γῆ
  choice: भूमि
  rationale: कृषि-रूपक में यह खेती की जाने वाली जमीन को स्वाभाविक और पर्याप्त व्यापक रूप से व्यक्त करता है।
- source_word: πιοῦσα
  choice: पी लेती है
  rationale: यह भूमि के मानवीकरण और यूनानी क्रिया के सजीव रूपक को बनाए रखता है।
- source_word: τὸν ἐπ’ αὐτῆς ἐρχόμενον πολλάκις ὑετόν
  choice: अपने ऊपर बार-बार पड़ने वाली वर्षा
  rationale: यह ἐπ’ αὐτῆς और πολλάκις दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τίκτουσα
  choice: उपजाती है
  rationale: भूमि से पौधों की पैदावार के लिए यह सहज कृषि-संबंधी क्रिया है और मूल के उत्पादन-बोध को रखती है।
- source_word: βοτάνην
  choice: वनस्पति
  rationale: यह किसी एक विशिष्ट फसल तक अर्थ को सीमित किए बिना पौधों की उपयोगी उपज के व्यापक अर्थ को बनाए रखता है।
- source_word: εὔθετον
  choice: काम की
  rationale: यह उपयोगिता और उपयुक्तता को सामान्य पाठक के लिए सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκείνοις δι’ οὓς καὶ γεωργεῖται
  choice: उन लोगों के काम की ... जिनके लिए वह जोती भी जाती है
  rationale: διά के कर्मकारक के साथ प्रयोजन/हित का प्रमुख अर्थ सुरक्षित रहता है; καί को ‘भी’ से व्यक्त किया गया है।
- source_word: γεωργεῖται
  choice: जोती ... जाती है
  rationale: यह कृषि-कार्य को स्वाभाविक हिन्दी में व्यक्त करता है; संदर्भ में केवल हल चलाने से अधिक व्यापक खेती का भाव समझ में आता है।
- source_word: μεταλαμβάνει
  choice: पाती है
  rationale: इस संदर्भ में परमेश्वर से आशीष प्राप्त करने का भाव सरल और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: εὐλογίας ἀπὸ τοῦ θεοῦ
  choice: परमेश्वर से आशीष
  rationale: यह स्रोत और वरदान दोनों को स्पष्ट रखते हुए कथन के सूक्तिपरक स्वर को बनाए रखता है।
theological_decisions:
- issue: चेतावनी के संदर्भ में कृषि-रूपक
  choice: कृषि-चित्र को सीधे रूप में रखा गया है और फलदायी भूमि को परमेश्वर से आशीष पाने वाली बताया गया है।
  alternative: अनुवाद में ही इसे सच्चे/झूठे विश्वासियों या विश्वास में बने रहने/धर्मत्याग की किसी विशिष्ट सिद्धान्तगत व्याख्या से जोड़ना।
  rationale: यह पद कृषि-दृष्टान्त का सकारात्मक पक्ष कहता है; अनुवाद को व्यापक प्रसंग की धर्मवैज्ञानिक बहस का निर्णय अपने शब्दों में नहीं जोड़ना चाहिए।
- issue: δι’ οὓς में हित/प्रयोजन बनाम कर्ता
  choice: ‘जिनके लिए’
  alternative: ‘जिनके द्वारा’
  rationale: διά के साथ कर्मकारक सामान्यतः कारण, प्रयोजन या हित बताता है; फिर भी कृषि-संदर्भ में कर्ता-सदृश समझ संभव होने से विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सजीव रूप रखा गया है। ‘पी लेती है’ मूल के मानवीकरण को बचाता है; ‘काम की’ सामान्य पाठक के लिए ‘उपयोगी’ से अधिक सहज है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
