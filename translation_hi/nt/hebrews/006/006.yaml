reference: Hebrews 6:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ παραπεσόντας, πάλιν ἀνακαινίζειν εἰς μετάνοιαν, ἀνασταυροῦντας ἑαυτοῖς τὸν υἱὸν τοῦ θεοῦ καὶ παραδειγματίζοντας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/006.yaml
  text: and having fallen away[a], to renew them again to repentance[b], since they are crucifying again for themselves the Son of God and exposing him to public shame.
translation:
  language: hi
  text: और जो भटक गए हैं[a], उन्हें पश्चाताप की ओर फिर से लौटाना[b], क्योंकि वे अपने लिए परमेश्वर के पुत्र को फिर से क्रूस पर चढ़ा रहे हैं और उसे सबके सामने अपमानित कर रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धर्मत्याग कर चुके हैं।” यूनानी क्रिया गंभीर रूप से गिर जाने या विमुख हो जाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “जब वे अपने लिए परमेश्वर के पुत्र को फिर से क्रूस पर चढ़ा रहे हैं और उसे सबके सामने अपमानित कर रहे हैं।” यूनानी कृदन्त कारण बताने के साथ-साथ उसी समय जारी परिस्थिति भी दर्शा सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: παραπεσόντας
  choice: जो पतित हो गए हैं
  rationale: यह गंभीर रूप से गिर जाने या विमुख हो जाने का भाव रखता है, पर मुख्य पाठ में बाद का तकनीकी धर्मवैज्ञानिक निष्कर्ष नहीं थोपता। संबंधवाचक उपवाक्य हिन्दी में कृदन्त का स्वाभाविक रूपांतरण है।
- source_word: πάλιν ἀνακαινίζειν εἰς μετάνοιαν
  choice: उन्हें फिर से पश्चाताप की ओर लौटा लाना
  rationale: ‘फिर से’ पुनरावृत्ति को, ‘लौटा लाना’ पूर्व दशा में बहाली को, और ‘पश्चाताप की ओर’ εἰς की लक्ष्यसूचक शक्ति को व्यक्त करता है।
- source_word: ἀνασταυροῦντας
  choice: दोबारा क्रूस पर चढ़ा रहे हैं
  rationale: वर्तमान कृदन्त की जारी क्रिया और ἀνά- में निहित पुनरावृत्ति, दोनों को स्पष्ट करता है।
- source_word: ἑαυτοῖς
  choice: अपने ही लिए
  rationale: आत्मवाचक सम्प्रदान के संदर्भ अथवा हित-अहित संबंधी भाव को यथासंभव सीधे रूप में सुरक्षित रखता है।
- source_word: τὸν υἱὸν τοῦ θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: मसीह-संबंधी उपाधि का मानक, सीधा और गरिमापूर्ण हिन्दी रूप।
- source_word: παραδειγματίζοντας
  choice: उसे सार्वजनिक अपमान का पात्र बना रहे हैं
  rationale: क्रिया में सार्वजनिक रूप से लज्जित और बदनाम किए जाने का सामाजिक भाव है; यह हिन्दी रूप उस सार्वजनिकता और अपमान दोनों को स्पष्ट करता है।
theological_decisions:
- issue: क्या इस पद में पिछले पद से ‘असंभव है’ दोहराया जाए
  choice: पद को ‘और’ से आरम्भ कर पिछले वाक्य पर निर्भर रखा गया है और नया मुख्य क्रियापद नहीं जोड़ा गया।
  alternative: ‘उन्हें फिर से ... लौटा लाना असंभव है।’
  rationale: यूनानी पाठ इब्रानियों 6:4–6 की संयुक्त वाक्य-रचना का अंश है। निर्भरता बनाए रखने से इस पद में ऐसा कथन नहीं जोड़ा जाता जो मूल में दोहराया नहीं गया।
- issue: παραπεσόντας में पतन का धर्मवैज्ञानिक स्वरूप
  choice: ‘पतित हो गए हैं’
  alternative: ‘धर्मत्याग कर चुके हैं’
  rationale: चेतावनी की गंभीरता बनाए रखी गई है, पर यह तय नहीं किया गया कि पाठ उद्धार खोने, केवल दिखाई देने वाले विश्वास, या किसी विशिष्ट वाचागत धर्मत्याग की बात करता है।
- issue: ἀνασταυροῦντας और παραδειγματίζοντας का संबंध
  choice: कारणसूचक ‘क्योंकि वे ...’
  alternative: समकालिक ‘जब तक वे ...’ अथवा ‘वे ... करते हुए’
  rationale: कृदन्त संभवतः बहाली की असंभवता का कारण समझाते हैं, फिर भी उनके समकालिक अर्थ की वास्तविक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। पद की पिछले संदर्भ पर व्याकरणिक निर्भरता बनाए रखी गई है। ‘पश्चाताप’ सामान्य पाठक के लिए ‘मन फिराव’ से अधिक स्वाभाविक है, जबकि ‘की ओर’ मूल के लक्ष्यसूचक भाव को सुरक्षित रखता है।
