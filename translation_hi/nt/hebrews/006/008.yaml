source:
  edition: SBLGNT
  text: ἐκφέρουσα δὲ ἀκάνθας καὶ τριβόλους ἀδόκιμος καὶ κατάρας ἐγγύς, ἧς τὸ τέλος εἰς καῦσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/008.yaml
  text: But if it bears thorns and thistles[a], it is worthless and near to being cursed, and its end is for burning.
translation:
  language: hi
  text: पर यदि वह काँटे और कँटीली झाड़ियाँ उगाती है, तो वह निकम्मी[a] और शापित होने के निकट है, और अन्ततः उसे जला दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अस्वीकृत।”
    reason: ἀδόκιμος का वैध वैकल्पिक अर्थ, जो अनुपयोगी ठहराए जाने के साथ अस्वीकृति का भाव भी दे सकता है।
lexical_decisions:
- source_word: ἐκφέρουσα
  choice: उगाती है
  rationale: यह स्त्रीलिंग एकवचन वर्तमान कृदन्त पिछले पद की भूमि को सूचित करता है। कृषि-संदर्भ में ‘उगाती है’ स्वाभाविक है और निरन्तर उपज का भाव रखता है।
- source_word: δὲ
  choice: पर
  rationale: यह पद 7 की फलदायक भूमि के साथ स्पष्ट विरोध प्रकट करता है।
- source_word: ἀκάνθας καὶ τριβόλους
  choice: काँटे और कँटीली झाड़ियाँ
  rationale: दोनों अलग-अलग प्रकार की हानिकारक कँटीली वनस्पति को दर्शाते हैं; यह हिंदी में कृषि-बिंब को स्पष्ट और स्वाभाविक रखता है।
- source_word: ἀδόκιμος
  choice: निकम्मी
  rationale: यह ऐसी भूमि का मूल्यांकन करता है जो उपयोगिता की कसौटी पर खरी नहीं उतरती। ‘निकम्मी’ कृषि-संदर्भ में सहज है; ‘अस्वीकृत’ वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: κατάρας ἐγγύς
  choice: शाप के निकट
  rationale: यूनानी में ἐγγύς के साथ संबंधकारक संज्ञा है। यह अनुवाद उस संक्षिप्त और कुछ तनावपूर्ण अभिव्यक्ति को बनाए रखता है, बिना उसे अनिवार्यतः ‘शापित होने के निकट’ में बदलने के।
- source_word: ἧς τὸ τέλος
  choice: उसका अन्त
  rationale: संबंधवाचक सर्वनाम पहले से निहित भूमि की ओर लौटता है; ‘उसका अन्त’ हिंदी में स्वाभाविक है और τέλος के परिणाम तथा अंतिम दशा दोनों भावों को खुला रखता है।
- source_word: εἰς καῦσιν
  choice: जलाया जाना है
  rationale: यह दहन की ओर उद्देश्य अथवा परिणाम व्यक्त करता है। हिंदी में यह स्वाभाविक रहते हुए आग के बिंब को बनाए रखता है और उसके धर्मवैज्ञानिक आशय को अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: क्या पिछले पद से निहित कर्ता ‘भूमि’ को इस पद में दोहराया जाए
  choice: मुख्य पाठ में ‘वह’ रखा गया
  alternative: पर जो भूमि काँटे और कँटीली झाड़ियाँ उगाती है…
  rationale: यूनानी में संज्ञा दोहराई नहीं गई, पर स्त्रीलिंग कृदन्त से भूमि स्पष्टतः निहित है। ‘वह’ पाठ-संबंध और मूल की संक्षिप्तता दोनों बनाए रखता है।
- issue: ἀδόκιμος का धर्मवैज्ञानिक रूप से अधिक भारयुक्त अनुवाद
  choice: मुख्य पाठ में ‘निकम्मी’, पादटिप्पणी में ‘अस्वीकृत’
  alternative: अस्वीकृत
  rationale: तात्कालिक कृषि-बिंब में अनुपयोगिता प्रमुख है, पर ‘अस्वीकृत’ वास्तविक शब्दार्थ-संभावना है और इसलिए पादटिप्पणी में सुरक्षित है।
- issue: εἰς καῦσιν को अंतिम न्याय के रूप में स्पष्ट करना
  choice: केवल जलाए जाने का बिंब रखा गया
  alternative: न्याय की आग में नष्ट होना
  rationale: पद स्वयं कृषि-बिंब से आगे उसका धर्मवैज्ञानिक संदर्भ स्पष्ट नहीं करता; अधिक विशिष्ट भाषा जोड़ना मूल के तनाव को समय से पहले सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कृषि-बिंब के अनुकूल शब्दावली। ‘शाप के निकट’ जानबूझकर मूल यूनानी की संज्ञात्मक रचना और अस्पष्टता को बनाए रखता है।
