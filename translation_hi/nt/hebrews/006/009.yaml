  text: Πεπείσμεθα δὲ περὶ ὑμῶν, ἀγαπητοί, τὰ κρείσσονα καὶ ἐχόμενα σωτηρίας, εἰ καὶ οὕτως λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/009.yaml
  text: But we are convinced of better things concerning you[a], beloved—things that belong to salvation—even though we speak in this way.
translation:
  language: hi
  text: लेकिन, प्रिय जनो, यद्यपि हम इस प्रकार बोलते हैं, हमें तुम्हारे विषय में बेहतर बातों का भरोसा है—अर्थात् ऐसी बातों का जो उद्धार से संबंधित हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उद्धार के साथ चलने वाली बातें।”
    reason: ἐχόμενα σωτηρίας का अर्थ उद्धार से संबंधित या उसके साथ रहने वाली बातें भी हो सकता है।
lexical_decisions:
- source_word: Πεπείσμεθα
  choice: हमें ... पूरा विश्वास है
  rationale: यूनानी पूर्णकाल दृढ़ और स्थापित विश्वास की अवस्था व्यक्त करता है; यह हिंदी में स्वाभाविक और आश्वस्त भाव देता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछली कठोर चेतावनी के बाद स्पष्ट विरोध और भाव-परिवर्तन दिखाता है।
- source_word: περὶ ὑμῶν
  choice: तुम्हारे विषय में
  rationale: περί और संबंधकारक का सीधा, गरिमापूर्ण तथा स्पष्ट अनुवाद।
- source_word: ἀγαπητοί
  choice: हे प्रिय लोगो
  rationale: संबोधन का स्नेह बनाए रखता है और आधुनिक पाठक के लिए 'प्रियजनों' की अपेक्षा अधिक सहज है।
- source_word: τὰ κρείσσονα
  choice: इससे अच्छी बातें
  rationale: नपुंसकलिंग बहुवचन विशेषण का संज्ञात्मक प्रयोग है; 'इससे' पूर्ववर्ती चेतावनी से निहित तुलना को हिंदी में स्पष्ट करता है।
- source_word: ἐχόμενα σωτηρίας
  choice: उद्धार से जुड़ी बातें
  rationale: σωτηρίας के साथ ἐχόμενα के व्यापक संबंधसूचक अर्थ को रखता है, बिना इन्हें उद्धार के प्रमाण, परिणाम या कारण के रूप में सीमित किए।
- source_word: εἰ καὶ
  choice: यद्यपि ... फिर भी
  rationale: मूल के रियायती भाव को स्वाभाविक हिंदी वाक्य-विन्यास में स्पष्ट करता है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: पिछले पदों में कही गई कठोर चेतावनी की रीति और विषयवस्तु, दोनों की ओर संकेत खुला रखता है।
- source_word: λαλοῦμεν
  choice: हम ... बोलते हैं
  rationale: वर्तमानकाल के सामान्य और सीधे भाव को बनाए रखता है।
theological_decisions:
- issue: चेतावनी वाले प्रसंग में ἐχόμενα और σωτηρίας का संबंध
  choice: '''उद्धार से जुड़ी बातें''—संबंध को व्यापक रखा गया है।'
  alternative: '''उद्धार के साथ चलने वाली बातें'' अथवा ''उद्धार के साथ आने वाली बातें'''
  rationale: यूनानी पाठ श्रोताओं में उद्धार से संबंधित उत्तम वास्तविकताओं के विषय में विश्वास प्रकट करता है, पर यह तय नहीं करता कि वे उद्धार के प्रमाण, सहचर या परिणाम हैं। अनुवाद इस धर्मवैज्ञानिक तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्नेहपूर्ण, गरिमामय और स्पष्ट शैली। वाक्य-विन्यास को स्वाभाविक बनाने के लिए संबोधन और रियायती उपवाक्य को आरंभ में रखा गया है। मुख्य पाठ का [a] चिह्न संबंधित पदबंध के तुरंत बाद दिया गया है।
