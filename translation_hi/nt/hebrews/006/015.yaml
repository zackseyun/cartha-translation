  yaml_path: translation/nt/hebrews/006/015.yaml
  text: And so[a], after waiting patiently, he obtained the promise.
translation:
  language: hi
  text: और इस प्रकार[a] धीरज धरकर उसने प्रतिज्ञा प्राप्त की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो प्रतिज्ञा की गई थी, उसे प्राप्त किया।” यूनानी में अधिक शाब्दिक रूप से, “प्रतिज्ञा प्राप्त की” है।
    reason: वैकल्पिक अनुवाद; यह ‘प्रतिज्ञा’ को परमेश्वर के वचन के रूप में अथवा प्रतिज्ञात वस्तु के रूप में समझने की सम्भावना दर्शाता है।
lexical_decisions:
- source_word: καὶ οὕτως
  choice: और इस प्रकार
  rationale: यह पद को पिछले कथन से जोड़ता है और पूर्ववर्णित रीति तथा उसके परिणाम की ओर संकेत करता है।
- source_word: μακροθυμήσας
  choice: धीरज धरने के बाद
  rationale: अओरिस्ट कृदंत का समयगत भाव स्वाभाविक हिन्दी में व्यक्त होता है और लम्बे समय तक धैर्य बनाए रखने का अर्थ सुरक्षित रहता है।
- source_word: ἐπέτυχεν
  choice: प्राप्त किया
  rationale: यह सफलतापूर्वक पाने या हासिल करने का भाव देता है और मूल क्रिया के अर्थ को अनावश्यक रूप से विस्तृत नहीं करता।
- source_word: τῆς ἐπαγγελίας
  choice: प्रतिज्ञा को
  rationale: यह मूल संज्ञा को सीधे बनाए रखता है, निकटवर्ती प्रसंग में परमेश्वर की अब्राहम से की गई विशिष्ट प्रतिज्ञा से शब्दगत संबंध सुरक्षित करता है, और उसकी पूर्ण पूर्ति का दावा स्वतः नहीं जोड़ता।
theological_decisions:
- issue: क्या वाक्यांश ἐπέτυχεν τῆς ἐπαγγελίας का अर्थ प्रतिज्ञा की पूरी पूर्ति पाना है या प्रतिज्ञा को प्राप्त करना।
  choice: उसने प्रतिज्ञा को प्राप्त किया
  alternative: जो प्रतिज्ञा की गई थी, उसे उसने प्राप्त किया
  rationale: यूनानी पाठ शाब्दिक रूप से ‘प्रतिज्ञा को प्राप्त किया’ कहता है। यही रूप इब्रानियों में प्रतिज्ञा और उसकी साकार विषयवस्तु के बीच मौजूद अर्थगत तनाव को बनाए रखता है और पूरी पूर्ति का अधिक प्रबल दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘धीरज धरने’ का प्रयोग सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘प्रतिज्ञा’ आसपास के धर्मवैचारिक और शब्दगत संबंध को सुरक्षित रखती है।
