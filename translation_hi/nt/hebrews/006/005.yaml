  text: καὶ καλὸν γευσαμένους θεοῦ ῥῆμα δυνάμεις τε μέλλοντος αἰῶνος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/005.yaml
  text: and have tasted the good word of God and the powers of the coming age[b][a],
translation:
  language: hi
  text: और परमेश्वर के भले वचन तथा आने वाले युग की सामर्थ्यों का स्वाद चख चुके हैं[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आने वाले युग के सामर्थ्यपूर्ण कार्यों” अथवा “चमत्कारों” का स्वाद चख चुके हैं।
    reason: 'δυνάμεις के लिए वैकल्पिक अर्थ: सामर्थ्यपूर्ण कार्य या चमत्कार।'
lexical_decisions:
- source_word: καλὸν
  choice: भले
  rationale: यहाँ καλός, ῥῆμα की विशेषता बताता है और उसका अर्थ हितकारी या उत्तम है। “भला वचन” स्वाभाविक और मूल्यांकनात्मक अर्थ को बनाए रखता है।
- source_word: γευσαμένους
  choice: स्वाद चख चुके हैं
  rationale: यह रूप पिछले पद से चली आ रही कर्मकारक बहुवचन कृदन्त-शृंखला का भाग है। “स्वाद चख चुके हैं” मूल रूपक को बनाए रखता है और अनुभव की गहराई के विषय में कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
- source_word: θεοῦ ῥῆμα
  choice: परमेश्वर के ... वचन
  rationale: ῥῆμα कथन या बोले गए वचन को सूचित कर सकता है; “परमेश्वर का वचन” हिन्दी में स्पष्ट और स्वाभाविक है तथा θεοῦ को स्रोत या संबंध के रूप में व्यक्त करता है। विभक्ति के कारण वाक्य में “परमेश्वर के भले वचन” हुआ है।
- source_word: δυνάμεις
  choice: सामर्थ्य
  rationale: बहुवचन δυνάμεις शक्ति के प्रकट रूपों, सामर्थ्यपूर्ण कार्यों या चमत्कारों को सूचित कर सकता है। हिन्दी में “सामर्थ्य” सामूहिक भाव में इस व्यापकता को बनाए रखता है और अर्थ को केवल चमत्कारों तक सीमित नहीं करता।
- source_word: τε
  choice: और ... भी
  rationale: τε पिछले कर्म के साथ δυνάμεις को जोड़ता है। “और ... भी” हिन्दी में इस संयोजक बल को सहज ढंग से व्यक्त करता है।
- source_word: μέλλοντος αἰῶνος
  choice: आने वाले युग की
  rationale: यह सम्बन्धकारक पद “सामर्थ्य” को विशेषित करता है और भावी युग की ओर संकेत करता है। “आने वाला युग” आधुनिक हिन्दी में स्वाभाविक है और भविष्याभिमुख युगान्तकारी अर्थ बनाए रखता है।
theological_decisions:
- issue: चेतावनी वाले प्रसंग में “स्वाद चखने” का अर्थ
  choice: “स्वाद चख चुके हैं” को बिना विस्तार या न्यूनता के बनाए रखा गया।
  alternative: “अनुभव कर चुके हैं” अथवा “बस थोड़ा-सा स्वाद चखा है”
  rationale: इब्रानियों 6:4–6 एक विवादित चेतावनी-प्रसंग है। मूल रूपक को बनाए रखने से सम्बद्ध लोगों की सहभागिता की गहराई पर अनुवाद स्वयं कोई धर्मवैज्ञानिक निर्णय नहीं थोपता।
- issue: युगान्तकारी प्रसंग में δυνάμεις का बल
  choice: “सामर्थ्य”
  alternative: “चमत्कार” अथवा “सामर्थ्य के कार्य”
  rationale: यह पद आने वाले युग से जुड़े चमत्कारी प्रकट रूपों को सूचित कर सकता है, पर इसका अर्थ अधिक व्यापक दिव्य शक्तियाँ भी हो सकता है। “सामर्थ्य” इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य पर निर्भर है, इसलिए आरम्भ का “और” तथा अन्त का अल्पविराम प्रसंगगत निरन्तरता दर्शाते हैं। एक संयुक्त पादटिप्पणी δυνάμεις की संभावित कार्यात्मक व्याख्याओं को देती है; मुख्य पाठ व्यापक अर्थ को सुरक्षित रखता है।
