source:
  edition: SBLGNT
  text: Τῷ γὰρ Ἀβραὰμ ἐπαγγειλάμενος ὁ θεός, ἐπεὶ κατ’ οὐδενὸς εἶχεν μείζονος ὀμόσαι, ὤμοσεν καθ’ ἑαυτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/013.yaml
  text: For when God made the promise to Abraham[a], since he could swear by no one greater, he swore by himself[b],
translation:
  language: hi
  text: क्योंकि जब परमेश्वर ने अब्राहम से प्रतिज्ञा की, तो उससे बड़ा कोई नहीं था जिसकी शपथ वह खा सकता था; इसलिए उसने अपनी ही शपथ खाई,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह शब्द पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट रखता है।
- source_word: Τῷ ... Ἀβραὰμ ἐπαγγειλάμενος
  choice: जब परमेश्वर ने अब्राहम से प्रतिज्ञा की
  rationale: कृदंत को स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है। दत्तिव अब्राहम को प्रतिज्ञा के प्राप्तकर्ता के रूप में दिखाता है; हिन्दी में ‘अब्राहम से प्रतिज्ञा की’ स्वाभाविक है।
- source_word: ἐπεὶ
  choice: तो ... के कारण
  rationale: यहाँ ἐπεί कारण बताता है कि परमेश्वर ने अपनी ही शपथ क्यों खाई।
- source_word: κατ’ οὐδενὸς ... μείζονος
  choice: अपने से बड़े किसी की
  rationale: शपथ के प्रसंग में οὐδενός का संकेत किसी उच्चतर व्यक्ति या सत्ता की ओर है; ‘अपने से बड़े किसी’ से तुलना और व्यक्तिगत संदर्भ दोनों बने रहते हैं।
- source_word: ὀμόσαι / ὤμοσεν
  choice: शपथ खाने के लिए / शपथ खाई
  rationale: एक ही यूनानी शब्द-परिवार की पुनरावृत्ति को हिन्दी में भी ‘शपथ’ की पुनरावृत्ति से सुरक्षित रखा गया है।
- source_word: καθ’ ἑαυτοῦ
  choice: अपनी ही शपथ खाई
  rationale: शपथ-सूत्र में इसका अर्थ स्वयं को शपथ का आधार बनाना है। ‘ही’ इस बात पर बल देता है कि उससे बड़ी कोई सत्ता नहीं थी।
theological_decisions:
- issue: परमेश्वर की शपथ का स्वरूप
  choice: परमेश्वर ने अपनी ही शपथ खाई, क्योंकि उससे बड़ा कोई नहीं था जिसकी वह शपथ खाता।
  alternative: परमेश्वर ने अपने नाम की शपथ खाई।
  rationale: मूल पाठ ‘अपने नाम’ नहीं कहता, बल्कि प्रतिवर्ती सर्वनाम से ‘अपने ही द्वारा/अपनी ही शपथ’ का भाव देता है। अनुवाद परमेश्वर की सर्वोच्चता को बनाए रखता है, पर पाठ से आगे कोई doctrinal विस्तार नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘प्रतिज्ञा’ और ‘शपथ खाना’ बाइबिलीय प्रसंग में प्रचलित तथा स्पष्ट हैं। वाक्य के अंत में अल्पविराम रखा गया है, क्योंकि मूल यूनानी और दिए गए अंग्रेज़ी पाठ में विचार अगले पद में जारी रहता है।
