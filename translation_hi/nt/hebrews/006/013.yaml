revisions:
- from: क्योंकि जब परमेश्वर ने अब्राहम से प्रतिज्ञा की, तो अपने से बड़े किसी की शपथ खाने के लिए न होने के कारण उसने अपनी ही शपथ खाई,
  to: क्योंकि जब परमेश्वर ने अब्राहम से प्रतिज्ञा की, तो उससे बड़ा कोई नहीं था जिसकी शपथ वह खा सकता था; इसलिए उसने अपनी ही शपथ खाई,
  rationale: The revision preserves γάρ as “क्योंकि,” the temporal participial setting (“जब ... प्रतिज्ञा की”), ἐπεί as the causal explanation, and the repetition of oath language. “इसलिए” expresses the resulting self-oath naturally, while the semicolon clarifies the long causal relationship and retains the verse-final continuation comma.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T02:36:21Z'
review_pass:
  verdict: revise
  source_fidelity: The draft conveys the promise to Abraham, the absence of anyone greater, and God's self-oath. However, “अपने से बड़े किसी की शपथ खाने के लिए न होने के कारण” is not a clear Hindi expression of εἶχεν μείζονος ὀμόσαι (“he had no one greater by whom/to swear”).
  naturalness: The causal middle clause is grammatically cumbersome and may suggest that no greater person existed merely “for swearing,” rather than that God had no greater one by whom he could swear. A finite relative clause is clearer and modern-standard Hindi.
  terminology: “परमेश्वर,” “प्रतिज्ञा,” and “शपथ खाई” are appropriate in a dignified biblical register. “अपनी ही शपथ खाई” suitably renders the oath idiom καθ’ ἑαυτοῦ without adding “name.”
  issues:
  - severity: medium
    issue: The construction “अपने से बड़े किसी की शपथ खाने के लिए न होने के कारण” is awkward and insufficiently precise.
    rationale: Greek εἶχεν + infinitive expresses having no greater person by whom one could swear. Recasting it as “उससे बड़ा कोई नहीं था जिसकी शपथ वह खा सकता था” makes both the comparative referent and oath relationship explicit.
  revised_text: क्योंकि जब परमेश्वर ने अब्राहम से प्रतिज्ञा की, तो उससे बड़ा कोई नहीं था जिसकी शपथ वह खा सकता था; इसलिए उसने अपनी ही शपथ खाई,
  revised_footnotes: []
  revision_rationale: The revision preserves γάρ as “क्योंकि,” the temporal participial setting (“जब ... प्रतिज्ञा की”), ἐπεί as the causal explanation, and the repetition of oath language. “इसलिए” expresses the resulting self-oath naturally, while the semicolon clarifies the long causal relationship and retains the verse-final continuation comma.
