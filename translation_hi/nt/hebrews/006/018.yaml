source:
  edition: SBLGNT
  text: ἵνα διὰ δύο πραγμάτων ἀμεταθέτων, ἐν οἷς ἀδύνατον ψεύσασθαι ⸀θεόν, ἰσχυρὰν παράκλησιν ἔχωμεν οἱ καταφυγόντες κρατῆσαι τῆς προκειμένης ἐλπίδος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/018.yaml
  text: so that through two unchangeable things[a], in which it is impossible for God to lie[b], we who have fled for refuge might have strong encouragement to take hold of the hope set before us.
translation:
  language: hi
  text: ताकि उन दो अपरिवर्तनीय बातों के द्वारा—जिनमें परमेश्वर का झूठ बोलना असंभव है—हम, जो शरण के लिए भागे हैं, अपने सामने रखी हुई आशा को थाम लेने के लिए प्रबल प्रोत्साहन पाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: पिछले कथन से निकलने वाले उद्देश्य अथवा परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ δύο πραγμάτων ἀμεταθέτων
  choice: उन दो अपरिवर्तनीय बातों के द्वारा
  rationale: πράγματα का व्यापक अर्थ ‘बातें’ है और संदर्भ में यह प्रतिज्ञा और शपथ की ओर संकेत करता है; ἀμεταθέτων उनके न बदले जा सकने को व्यक्त करता है।
- source_word: ἐν οἷς
  choice: जिनमें
  rationale: दो पूर्वोक्त बातों के साथ यूनानी संबंधवाचक रचना का सीधा संबंध बनाए रखता है।
- source_word: ἀδύνατον ψεύσασθαι θεόν
  choice: परमेश्वर का झूठ बोलना असंभव है
  rationale: मूल की निर्वैयक्तिक ‘असंभव’ रचना और उसके गंभीर बल को सुरक्षित रखता है।
- source_word: ἰσχυρὰν παράκλησιν
  choice: प्रबल प्रोत्साहन
  rationale: παράκλησις यहाँ आश्वासन से मिलने वाले उत्साह और संबल को व्यक्त करता है; ἰσχυράν उसकी तीव्रता बताता है।
- source_word: ἔχωμεν
  choice: पाएँ
  rationale: ἵνα के बाद आए संभावनार्थक क्रियारूप को उद्देश्य/अभिप्रेत परिणाम के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ καταφυγόντες
  choice: हम, जिन्होंने शरण पाने के लिए दौड़ लगाई है
  rationale: शरण की ओर भागने की गतिशील छवि को बनाए रखता है, न कि उसे केवल ‘शरण ली है’ जैसे अमूर्त कथन में बदलता है।
- source_word: κρατῆσαι
  choice: दृढ़ता से थामने
  rationale: क्रिया में पकड़ लेने और मजबूती से पकड़े रहने, दोनों की अर्थ-छाया है; यह हिन्दी चयन संदर्भ में दोनों को स्वाभाविक रूप से समेटता है।
- source_word: τῆς προκειμένης ἐλπίδος
  choice: अपने सामने रखी हुई आशा को
  rationale: आशा के उनके सामने प्रस्तुत और उपलब्ध होने की वस्तुगत छवि को बनाए रखता है।
theological_decisions:
- issue: शरण और आशा की संयुक्त रूपक-छवि
  choice: शरण पाने के लिए दौड़ लगाने और आशा को दृढ़ता से थामने की ठोस भाषा रखी गई।
  alternative: हम जिन्होंने शरण ली है, सामने रखी आशा पर दृढ़ बने रहें
  rationale: मूल पाठ में सुरक्षा की ओर भागने और प्रस्तुत आशा को सक्रिय रूप से पकड़ने की जीवंत छवियाँ साथ आती हैं; उन्हें अमूर्त आश्वासन में समतल नहीं किया गया।
- issue: परमेश्वर की सत्यनिष्ठा
  choice: परमेश्वर का झूठ बोलना असंभव है
  alternative: परमेश्वर झूठ नहीं बोल सकता
  rationale: मूल की व्याकरणिक संरचना और धर्मवैचारिक तनाव को सुरक्षित रखते हुए उससे आगे कोई दार्शनिक व्याख्या नहीं जोड़ी गई।
- issue: ‘दो अपरिवर्तनीय बातें’ की पहचान
  choice: मुख्य पाठ में इन्हें सामान्य रूप से ‘दो अपरिवर्तनीय बातें’ ही रखा गया।
  alternative: परमेश्वर की प्रतिज्ञा और शपथ
  rationale: निकट संदर्भ प्रतिज्ञा और शपथ की ओर संकेत करता है, पर इस पद में वे स्पष्ट रूप से नामित नहीं हैं; अनुवाद ने संकेत को व्याख्यात्मक विस्तार में नहीं बदला।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। डैश से ‘जिनमें…’ उपवाक्य की सीमा स्पष्ट की गई है। इस मसौदे में कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि κρατῆσαι की पकड़ने/थामे रहने की अर्थ-छाया मुख्य पाठ में ‘दृढ़ता से थामने’ द्वारा समाहित है।
