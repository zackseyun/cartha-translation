theological_decisions:
- issue: γενόμενος और यीशु के व्यक्तित्व का संबंध
  choice: “महायाजक बने हैं” को पद और भूमिका ग्रहण करने के कथन के रूप में रखा गया है।
  alternative: “महायाजक नियुक्त किए गए हैं” या “महायाजक बनाए गए हैं”
  rationale: यूनानी क्रियारूप को मिटाया नहीं गया, पर अनुवाद ऐसा भी नहीं कहता कि यीशु तभी अस्तित्व में आए या उनके दिव्य स्वभाव में परिवर्तन हुआ।
- issue: ὑπὲρ ἡμῶν का अर्थबल
  choice: “हमारे लिए”
  alternative: “हमारी ओर से” या “हमारे स्थान पर”
  rationale: यहाँ प्रसंग यीशु के विश्वासियों से आगे पवित्र स्थान में प्रवेश पर बल देता है। चुना हुआ रूप लाभ और प्रतिनिधित्व की वास्तविक गुंजाइश बनाए रखता है, पर पद में स्पष्ट न किए गए किसी अधिक संकीर्ण प्रायश्चित-सूत्र को आरोपित नहीं करता।
- issue: κατὰ τὴν τάξιν का याजकीय आशय
  choice: “रीति के अनुसार”
  alternative: “क्रम के अनुसार” या “श्रेणी में”
  rationale: “रीति” मलिकिसिदक के नमूने और भजन 110:4 की प्रतिध्वनि को स्वाभाविक हिन्दी में व्यक्त करती है, बिना किसी संस्थागत पुरोहित-परंपरा को आवश्यकता से अधिक निश्चित किए।
