  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “अग्रदूत” और “महायाजक” प्रसंग के तकनीकी धार्मिक अर्थों को सुरक्षित रखते हैं। यूनानी वाक्य की कृदंतीय रचना को हिन्दी में दो वाक्यों में खोला गया है ताकि अर्थ स्पष्ट और स्वाभाविक रहे।
