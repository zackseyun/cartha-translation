    text: या, “हमारी ओर से।” यूनानी पदबंध दूसरों के लाभ के लिए किए गए कार्य को व्यक्त कर सकता है; यहाँ यीशु के प्रतिनिधि रूप में प्रवेश करने पर बल है।
    reason: lexical_alternative
  - marker: b
    text: या, “मलिकिसिदक की रीति के अनुसार” या “मलिकिसिदक के क्रम में”; यह भजन 110:4 की प्रतिध्वनि है।
    reason: cross_reference
