- source_word: γενόμενος
  choice: बने हैं
  rationale: यह कृदंत द्वारा व्यक्त याजकीय पद धारण करने को बनाए रखता है, बिना यह संकेत दिए कि यीशु का अस्तित्व तभी आरम्भ हुआ या उनका स्वभाव बदल गया।
- source_word: εἰς τὸν αἰῶνα
