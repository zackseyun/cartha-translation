translation:
  language: hi
  text: जहाँ यीशु हमारे लिए[a] अग्रदूत के रूप में प्रवेश कर चुके हैं और मलिकिसिदक के क्रम के अनुसार[b] सदा के लिए महायाजक बने हैं।
  philosophy: optimal-equivalence
  footnotes:
