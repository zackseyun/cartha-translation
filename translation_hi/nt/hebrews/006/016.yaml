id: HEB.6.16
reference: Hebrews 6:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἄνθρωποι γὰρ κατὰ τοῦ μείζονος ὀμνύουσιν, καὶ πάσης αὐτοῖς ἀντιλογίας πέρας εἰς βεβαίωσιν ὁ ὅρκος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/016.yaml
  text: For people swear by one greater than themselves[b][a], and for them an oath is the end of every dispute for confirmation.
translation:
  language: hi
  text: क्योंकि लोग अपने से बड़े की शपथ खाते हैं, और उनके लिए शपथ पुष्टि के लिए हर विवाद का अंत है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄνθρωποι
  choice: मनुष्य
  rationale: यह बहुवचन सामान्य रूप से सभी मानवों को दर्शाता है, केवल पुरुषों को नहीं; ‘मनुष्य’ आधुनिक हिन्दी में इस सार्वभौमिक अर्थ को गरिमापूर्वक व्यक्त करता है।
- source_word: κατὰ τοῦ μείζονος
  choice: अपने से बड़े की
  rationale: शपथ के प्रसंग में κατά + संबंधकारक उस उच्चतर व्यक्ति या सत्ता को सूचित करता है जिसके नाम पर शपथ खाई जाती है। ‘अपने से’ तुलनात्मक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है, पर किसी अनिर्दिष्ट संदर्भ को विशेष नहीं बनाता।
- source_word: ὀμνύουσιν
  choice: शपथ खाते हैं
  rationale: यह हिन्दी में शपथ लेने के लिए प्रचलित और स्वाभाविक अभिव्यक्ति है तथा यूनानी सामान्य वर्तमान के भाव को बनाए रखती है।
- source_word: πάσης ... ἀντιλογίας
  choice: हर विवाद
  rationale: यहाँ ἀντιλογία का आशय विरोधपूर्ण विवाद या विवादित दावा है; ‘हर विवाद’ कानूनी-सामाजिक प्रसंग में स्पष्ट और सहज है।
- source_word: πέρας
  choice: अन्त कर देती है
  rationale: शाब्दिक ‘अन्त’ को बनाए रखते हुए क्रियात्मक हिन्दी वाक्यांश यह स्पष्ट करता है कि शपथ विवाद को निर्णायक समाप्ति तक पहुँचाती है।
- source_word: εἰς βεβαίωσιν
  choice: पुष्टि के लिए
  rationale: यह उद्देश्य अथवा परिणाम व्यक्त करने वाले εἰς और βεβαίωσις के पुष्टि/प्रमाणीकरण वाले अर्थ को निकटता से प्रस्तुत करता है।
- source_word: ὁ ὅρκος
  choice: शपथ
  rationale: सामान्य सूक्ति में हिन्दी को अनिश्चित उपपद की आवश्यकता नहीं होती; ‘शपथ’ स्वाभाविक रूप से सामान्य अर्थ देता है।
theological_decisions:
- issue: मानवजाति के लिए सामान्य सूक्ति
  choice: मनुष्य
  alternative: पुरुष
  rationale: ἄνθρωποι यहाँ सभी मनुष्यों की सामान्य प्रथा बताता है, न कि केवल पुरुषों की; इसलिए लिंग-विशेष अर्थ से बचा गया है।
- issue: शपथ की विवाद-समापन भूमिका
  choice: पुष्टि के लिए शपथ उनके हर विवाद का अन्त कर देती है
  alternative: शपथ उनके लिए हर आपत्ति की पुष्टि का अन्त है
  rationale: वाक्य को स्वाभाविक हिन्दी में रखते हुए शपथ को पुष्टि के साधन और विवाद के अन्त के रूप में प्रस्तुत किया गया है; इससे स्रोत का सामान्य सामाजिक-कानूनी कथन बना रहता है, बिना शपथ के विषय में कोई अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; सामान्य पाठक के लिए सहज, पर गरिमापूर्ण शैली। ‘शपथ खाते हैं’ प्रचलित मुहावरा है। वाक्य-संरचना को स्वाभाविक बनाने के लिए यूनानी संज्ञात्मक ‘विवाद का अन्त है’ को ‘विवाद का अन्त कर देती है’ किया गया है, जबकि मूल अर्थ और बल सुरक्षित हैं।
