  source_fidelity: Draft correctly renders the generic ἄνθρωποι, oath-taking by a greater authority, and the dispute-settling force of an oath. However, its causative wording, “शपथ ... अन्त कर देती है,” slightly recasts the source’s nominal assertion that the oath is the end of dispute, and the placement of “पुष्टि के लिए” is less clearly connected to the oath’s confirming function.
  naturalness: The draft is generally clear and idiomatic. The revision retains modern standard Hindi while using a nominal predicate closer to the Greek construction.
  terminology: “लोग” naturally conveys the generic sense of ἄνθρωποι. “शपथ,” “विवाद,” “पुष्टि,” and “अंत” appropriately render the principal legal/social terms without introducing theological interpretation.
  issues:
