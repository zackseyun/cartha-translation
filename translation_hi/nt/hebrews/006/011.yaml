lexical_decisions:
- source_word: ἐπιθυμοῦμεν
  choice: हम चाहते हैं
  rationale: यह क्रिया प्रबल इच्छा व्यक्त करती है; यहाँ पासबानी आग्रह है, इसलिए यह सहज और गंभीर अनुवाद है।
- source_word: δὲ
  choice: और
  rationale: यह पिछले आश्वासन से इस आग्रह की ओर हल्का संक्रमण दिखाता है, तीखा विरोध नहीं।
- source_word: ἕκαστον ὑμῶν
  choice: आप में से हर एक
  rationale: समुदाय के प्रत्येक व्यक्ति पर लागू आग्रह की वितरणात्मक शक्ति स्पष्ट रहती है।
- source_word: τὴν αὐτὴν ... σπουδὴν
  choice: वही लगन
  rationale: यह पिछले पद में दिखाई गई सेवा और प्रेम की तत्परता की ओर लौटता है; ‘लगन’ sustained earnest diligence को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐνδείκνυσθαι
  choice: दिखाता रहे
  rationale: क्रिया किसी गुण को व्यवहार में प्रकट करने का अर्थ देती है; ‘रहे’ अंत तक जारी रहने के प्रसंग को सहज बनाता है।
- source_word: πρὸς τὴν πληροφορίαν τῆς ἐλπίδος
  choice: ताकि आपकी आशा पूर्ण भरोसे तक पहुँचे
  rationale: πρός के लक्ष्यात्मक भाव और πληροφορία के परिपूर्ण निश्चय/भरोसे को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि आशा और भरोसे के संबंध को अनावश्यक रूप से किसी सिद्धान्त में सीमित नहीं करता।
- source_word: ἄχρι τέλους
  choice: अंत तक
  rationale: यह समय और निरंतरता—समापन तक बने रहने—दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ‘आशा के पूर्ण भरोसे’ और धीरज का संबंध
  choice: 'वाक्य को लक्ष्यात्मक रूप में रखा गया है: वही लगन अंत तक दिखाई जाए, ताकि आशा पूर्ण भरोसे तक पहुँचे।'
  alternative: ‘आशा का पूरा भरोसा बनाए रखने के लिए’ अथवा ‘आशा की पूर्ण सिद्धि के लिए।’
  rationale: यूनानी पदबंध व्यक्तिपरक निश्चय और आशा की परिपूर्णता, दोनों की छाया रख सकता है। चुना हुआ रूप इस तनाव को खुला रखता है और किसी बाद की मतगत व्यवस्था को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थक बहुवचन ‘आप’; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। मुख्य वाक्य में लक्ष्य-संबंध स्पष्ट करने के लिए ‘ताकि’ प्रयुक्त है।
