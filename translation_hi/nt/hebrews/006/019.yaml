source:
  edition: SBLGNT
  text: ἣν ὡς ἄγκυραν ἔχομεν τῆς ψυχῆς, ⸀ἀσφαλῆ τε καὶ βεβαίαν καὶ εἰσερχομένην εἰς τὸ ἐσώτερον τοῦ καταπετάσματος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/006/019.yaml
  text: We have this as an anchor of the soul[a], both secure and firm, and entering into the inner place behind the curtain,
translation:
  language: hi
  text: हमारे पास यह आशा है, जो हमारे प्राण का लंगर है—सुरक्षित भी और दृढ़ भी—और जो परदे के पीछे के भीतरी स्थान में प्रवेश करता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “परदे के भीतर के स्थान में” या “परदे के पीछे।”'
    reason: यूनानी वाक्यांश भीतरी पवित्र स्थान और परदे के स्थानिक सम्बन्ध को व्यक्त करता है। हिन्दी में इसे ‘परदे के पीछे’ अथवा ‘परदे के भीतर के स्थान में’ कहा जा सकता है।
lexical_decisions:
- source_word: ἣν
  choice: यह आशा
  rationale: स्त्रीलिंग सम्बन्धवाचक सर्वनाम पिछले पद की ‘आशा’ की ओर संकेत करता है। हिन्दी में ‘यह आशा’ उस सम्बन्ध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: ὡς ἄγκυραν
  choice: लंगर के समान
  rationale: ὡς तुलना व्यक्त करता है; यह रूपक को स्पष्ट रखते हुए सहज आधुनिक हिन्दी देता है।
- source_word: ἔχομεν
  choice: हमारे ... के लिए ... है
  rationale: ग्रीक के ‘हमारे पास है’ भाव को हिन्दी की स्वाभाविक वाक्य-रचना में व्यक्त किया गया है; आशा को हमारे प्राण के लंगर के रूप में रखा गया है।
- source_word: τῆς ψυχῆς
  choice: हमारे प्राण के लिए
  rationale: ‘प्राण’ ψυχή के व्यक्ति के भीतरी जीवन के भाव को बनाए रखता है और ‘आत्मा’ से उत्पन्न हो सकने वाले अधिक विशिष्ट तत्त्वमीमांसात्मक अर्थ को नहीं थोपता। ‘के लिए’ हिन्दी में लंगर-रूपक को स्वाभाविक बनाता है।
- source_word: ἀσφαλῆ τε καὶ βεβαίαν
  choice: सुरक्षित भी और दृढ़ भी
  rationale: τε καὶ की युग्मात्मक शक्ति को ‘भी ... और ... भी’ से व्यक्त किया गया है। ‘सुरक्षित’ और ‘दृढ़’ दोनों विशेषणों के अलग, पर निकट, अर्थों को बनाए रखते हैं।
- source_word: εἰσερχομένην
  choice: प्रवेश करती है
  rationale: वर्तमान कृदन्त का सम्बन्ध स्त्रीलिंग ‘आशा’ से है। हिन्दी में समापिका क्रिया अधिक स्वाभाविक है और आशा/लंगर के रूपक की गति को बनाए रखती है।
- source_word: εἰς τὸ ἐσώτερον τοῦ καταπετάσματος
  choice: परदे के भीतर के स्थान में
  rationale: यह अनुवाद पवित्रस्थान की स्थानिक छवि को बनाए रखता है, पर यह तय नहीं करता कि वाक्यांश का बल ‘भीतरी स्थान’, ‘परदे के भीतर’ या ‘परदे के पीछे’ पर है। विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: स्वर्गीय पवित्रस्थान की उपासना-संबंधी छवि
  choice: ‘परदे के भीतर के स्थान’ द्वारा पवित्रस्थान की सीमा और उसके पार प्रवेश की छवि बनाए रखना
  alternative: ‘परदे के पीछे’ या ‘परदे के भीतरी स्थान में’
  rationale: καταπέτασμα मिलापवाले तम्बू/मन्दिर के परदे की छवि जगाता है। मुख्य पाठ इसे सरल आधुनिक हिन्दी में रखता है और पादटिप्पणी ग्रीक सम्बन्धवाचक संरचना की सम्भव स्थानिक अभिव्यक्तियाँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘लंगर’, ‘परदा’, ‘सुरक्षित’ और ‘दृढ़’ जैसे प्रचलित शब्द रखे गए हैं; अनावश्यक रूप से पारिभाषिक या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
