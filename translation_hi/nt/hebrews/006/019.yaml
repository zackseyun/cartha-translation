- from: यह आशा हमारे प्राण के लिए लंगर के समान है—सुरक्षित भी और दृढ़ भी—और परदे के भीतर के स्थान में प्रवेश करती है।[a]
  to: हमारे पास यह आशा है, जो हमारे प्राण का लंगर है—सुरक्षित भी और दृढ़ भी—और जो परदे के पीछे के भीतरी स्थान में प्रवेश करता है।[a]
  rationale: संशोधन ‘हमारे पास’ के द्वारा ἔχομεν को स्पष्ट करता है, ‘प्राण का लंगर’ द्वारा τῆς ψυχῆς के सम्बन्ध को बनाए रखता है, और ‘प्रवेश करता है’ को ‘लंगर’ के साथ मिलाता है, जैसा यूनानी में है। ‘परदे के पीछे के भीतरी स्थान’ मुख्य पाठ में अभयारण्य की छवि स्पष्ट करता है, जबकि पादटिप्पणी वैकल्पिक स्थानिक अभिव्यक्तियाँ सुरक्षित रखती है।
