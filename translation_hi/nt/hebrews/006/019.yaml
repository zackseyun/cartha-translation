review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies ‘this hope’ and preserves the anchor and sanctuary imagery. However, it does not explicitly render ἔχομεν (‘we have’), and its feminine verb ‘प्रवेश करती है’ makes hope, rather than the grammatically governing ‘anchor,’ enter. The Greek participle εἰσερχομένην agrees with ἄγκυραν (‘anchor’).
  naturalness: The draft is generally clear, but ‘परदे के भीतर के स्थान में’ is somewhat heavy and can suggest a location inside the curtain itself. A concise rendering that identifies the inner place as beyond the curtain is more idiomatic and clear in Hindi.
  terminology: ‘आशा,’ ‘प्राण,’ ‘लंगर,’ ‘सुरक्षित,’ ‘दृढ़,’ and ‘परदा’ are suitable modern, dignified terms. ‘प्राण का लंगर’ retains the genitive relationship more closely than ‘प्राण के लिए लंगर.’
  issues:
  - severity: medium
    issue: The explicit sense of ἔχομεν is not represented.
    rationale: ‘यह आशा ... है’ states what hope is, but does not state that ‘we have’ this hope. The revised wording retains both assertions naturally.
  - severity: medium
    issue: ‘प्रवेश करती है’ agrees with ‘आशा,’ while the Greek participle agrees with ‘लंगर.’
    rationale: The source depicts the anchor as entering the inner place. Hindi can preserve this by using a relative clause whose verb agrees with ‘लंगर.’
  - severity: low
    issue: ‘प्राण के लिए लंगर’ shifts ‘anchor of the soul’ toward a benefactive expression.
    rationale: ‘प्राण का लंगर’ better reflects the source relationship while remaining understandable.
  revised_text: हमारे पास यह आशा है, जो हमारे प्राण का लंगर है—सुरक्षित भी और दृढ़ भी—और जो परदे के पीछे के भीतरी स्थान में प्रवेश करता है।[a]
