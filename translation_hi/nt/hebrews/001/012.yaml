  text: καὶ ὡσεὶ περιβόλαιον ἑλίξεις αὐτούς, ⸂ὡς ἱμάτιον⸃ καὶ ἀλλαγήσονται· σὺ δὲ ὁ αὐτὸς εἶ, καὶ τὰ ἔτη σου οὐκ ἐκλείψουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/012.yaml
  text: and like a cloak you will roll them up[a]; like a garment they will be changed. But you are the same[b], and your years will not fail.
translation:
  language: hi
  text: और तुम उन्हें लबादे की तरह लपेट दोगे[a]; वस्त्र की तरह वे बदल जाएँगे। परन्तु तुम वही हो, और तुम्हारे वर्ष कभी समाप्त नहीं होंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तह कर दोगे।”
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे वर्ष कभी चुकेंगे नहीं” अथवा “तुम्हारे वर्ष कभी समाप्त न होंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡσεὶ περιβόλαιον
  choice: चादर की तरह
  rationale: यह सृष्टि को लपेटे जाने वाले बाहरी आवरण से तुलना करता है। ‘चादर’ आधुनिक हिन्दी में सहज है और लपेटने की छवि को स्पष्ट रखता है।
- source_word: ἑλίξεις
  choice: लपेट दोगे
  rationale: भविष्यत्काल की क्रिया लपेटने, गोल करने या तह करने का भाव रखती है। ‘लपेट दोगे’ प्रसंग की वस्त्र-संबंधी छवि के अनुकूल है।
- source_word: ὡς ἱμάτιον
  choice: वस्त्र की तरह
  rationale: यह περιβόλαιον के समानान्तर दूसरी वस्त्र-उपमा है; ‘वस्त्र’ एकवचन और काव्यात्मक गरिमा दोनों बनाए रखता है।
- source_word: ἀλλαγήσονται
  choice: वे बदल जाएँगे
  rationale: यह भविष्यत्काल का कर्मवाच्य रूप है। हिन्दी में ‘बदल जाएँगे’ स्वाभाविक है और इस बात पर बल रखता है कि सृजित जगत परिवर्तन के अधीन है।
- source_word: σὺ δὲ ὁ αὐτὸς εἶ
  choice: परन्तु तुम वही हो
  rationale: ‘परन्तु’ बदलती सृष्टि और संबोधित व्यक्ति की स्थिरता के बीच प्रबल विरोध दिखाता है; ‘तुम वही हो’ यूनानी अभिव्यक्ति के निकट रहते हुए सहज हिन्दी है।
- source_word: τὰ ἔτη σου οὐκ ἐκλείψουσιν
  choice: तुम्हारे वर्षों का कभी अन्त नहीं होगा
  rationale: ἐκλείπω यहाँ समाप्त होने या चुक जाने का भाव देता है। यह अनुवाद कालगत रूपक और निरन्तर अस्तित्व का आशय स्पष्ट रखता है।
theological_decisions:
- issue: मसीह-संबंधी उद्धरण में अपरिवर्तनशीलता की भाषा
  choice: परन्तु तुम वही हो
  alternative: परन्तु तुम अपरिवर्तित रहते हो
  rationale: चुना हुआ रूप बदलने वाली सृष्टि के विपरीत संबोधित व्यक्ति की स्थिर पहचान को व्यक्त करता है, पर बाद की तकनीकी धर्मवैज्ञानिक शब्दावली को पद में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानान्तर वस्त्र-उपमाएँ तथा बदलती सृष्टि और स्थिर संबोधित व्यक्ति के बीच काव्यात्मक विरोध सुरक्षित रखा गया है।
