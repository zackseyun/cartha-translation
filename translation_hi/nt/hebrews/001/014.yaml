source:
  edition: SBLGNT
  text: οὐχὶ πάντες εἰσὶν λειτουργικὰ πνεύματα εἰς διακονίαν ἀποστελλόμενα διὰ τοὺς μέλλοντας κληρονομεῖν σωτηρίαν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/014.yaml
  text: Are they not all ministering spirits, being sent out for service for the sake of those who are about to inherit salvation?[a]
translation:
  language: hi
  text: क्या वे सभी सेवा करनेवाली आत्माएँ नहीं हैं, जिन्हें उद्धार के वारिस होनेवाले लोगों के लिए सेवा करने को भेजी जाती हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उद्धार के वारिस होंगे।” यूनानी अभिव्यक्ति में भविष्य की ओर संकेत करनेवाला भाव है।
    reason: μέλλοντας के भावी अर्थ को सरल भविष्य के वैकल्पिक अनुवाद सहित स्पष्ट करना।
lexical_decisions:
- source_word: οὐχὶ πάντες
  choice: क्या वे सभी ... नहीं हैं
  rationale: यह प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी की प्रश्नवाचक संरचना उस बल को स्वाभाविक रूप से व्यक्त करती है और πάντες की समग्रता को बनाए रखती है।
- source_word: λειτουργικὰ πνεύματα
  choice: सेवा करनेवाली आत्माएँ
  rationale: λειτουργικός में सेवा का, कभी-कभी पवित्र या आधिकारिक सेवा का, भाव है। यह चयन कलीसियाई पद का अनावश्यक संकेत दिए बिना अर्थ को स्पष्ट रखता है; πνεύματα यहाँ स्वर्गदूतीय प्राणियों को दर्शाता है।
- source_word: εἰς διακονίαν ἀποστελλόμενα
  choice: सेवा के लिए भेजा जाता है
  rationale: उद्देश्यसूचक εἰς διακονίαν और वर्तमान कर्मवाच्य कृदंत ἀποστελλόμενα को सहज आधुनिक हिन्दी में नियमित अथवा वर्णनात्मक भेजे जाने के रूप में व्यक्त किया गया है।
- source_word: διὰ τοὺς
  choice: उन लोगों की सेवा के लिए
  rationale: यहाँ διά के लाभार्थक भाव को हिन्दी में सीधे लाभ पानेवालों की सेवा के रूप में व्यक्त किया गया है।
- source_word: τοὺς μέλλοντας κληρονομεῖν
  choice: जो ... के वारिस होनेवाले हैं
  rationale: यह अनुवाद μέλλω के भावी और संभावित आयाम को सुरक्षित रखता है तथा κληρονομέω की विरासत संबंधी छवि को बनाए रखता है।
- source_word: σωτηρίαν
  choice: उद्धार
  rationale: इब्रानियों के प्रसंग में यह स्थापित और उपयुक्त धार्मिक शब्द है, जिसमें भावी पूर्णता का आयाम भी समा सकता है।
theological_decisions:
- issue: μέλλοντας κληρονομεῖν σωτηρίαν का कालगत और धार्मिक बल
  choice: उद्धार के वारिस होनेवाले हैं
  alternative: उद्धार के वारिस होंगे
  rationale: मुख्य पाठ μέλλω की भावी/संभावित छाया बनाए रखता है, पर इसे पूर्वनियति या उद्धार की निश्चयता संबंधी किसी विशिष्ट साम्प्रदायिक मत में नहीं बदलता। सरल भविष्य को पादटिप्पणी में वैध विकल्प के रूप में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘सेवा करनेवाली आत्माएँ’ ऊँचे धार्मिक प्रसंग को बनाए रखता है, पर किसी औपचारिक कलीसियाई पद का संकेत नहीं देता।
