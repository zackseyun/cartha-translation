  text: ἠγάπησας δικαιοσύνην καὶ ἐμίσησας ἀνομίαν· διὰ τοῦτο ἔχρισέν σε ὁ θεός, ὁ θεός σου, ἔλαιον ἀγαλλιάσεως παρὰ τοὺς μετόχους σου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/009.yaml
  text: You have loved righteousness and hated lawlessness; therefore God[a], your God, has anointed you with the oil of gladness beyond your companions.
translation:
  language: hi
  text: तूने धार्मिकता[a] से प्रेम किया और अधर्म से घृणा की; इसलिए परमेश्वर, तेरे परमेश्वर ने, तेरे साथियों से बढ़कर आनंद के तेल से तेरा अभिषेक किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, न्याय। यूनानी शब्द का अर्थ ‘धार्मिकता’ या ‘न्याय’ हो सकता है; यहाँ मुख्य पाठ में ‘धार्मिकता’ रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἠγάπησας
  choice: तूने प्रेम किया
  rationale: यूनानी एओरिस्ट को उद्धरण की काव्यात्मक शैली में स्वाभाविक पूर्ण भूतकाल से व्यक्त किया गया है।
- source_word: δικαιοσύνην
  choice: धार्मिकता
  rationale: यह नैतिक खराई और सही आचरण का भाव रखता है; हिन्दी बाइबलीय प्रयोग में ‘धार्मिकता’ स्पष्ट और प्रतिष्ठित समतुल्य है।
- source_word: ἐμίσησας
  choice: घृणा की
  rationale: मूल के प्रबल नैतिक विरोध को ‘प्रेम किया’ के समानांतर सीधे रूप में बनाए रखता है।
- source_word: ἀνομίαν
  choice: अधर्म
  rationale: संदर्भ में यह व्यवस्था-विरोधी और दुष्ट आचरण को दर्शाता है; ‘अधर्म’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और ‘धार्मिकता’ का स्पष्ट प्रतिलोम है।
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: पूर्ववर्ती नैतिक कारण और अभिषेक के परिणाम के बीच कारणात्मक संबंध को सहजता से व्यक्त करता है।
- source_word: ἔχρισέν σε
  choice: तेरा अभिषेक किया
  rationale: χρίω की राजकीय और मसीही छवि को सुरक्षित रखते हुए हिन्दी की स्वाभाविक क्रिया-रचना अपनाई गई है।
- source_word: ὁ θεός, ὁ θεός σου
  choice: परमेश्वर ने—तेरे परमेश्वर ने—
  rationale: दोहराव और संबंधसूचक बल दोनों बनाए रखे गए हैं; डैश हिन्दी में appositional स्पष्टीकरण को साफ दिखाते हैं, बिना धर्मवैज्ञानिक विस्तार जोड़े।
- source_word: ἔλαιον ἀγαλλιάσεως
  choice: आनंद के तेल
  rationale: शास्त्रीय अभिषेक की मूर्त छवि और उल्लास का भाव दोनों सीधे सुरक्षित रहते हैं।
- source_word: παρὰ τοὺς μετόχους σου
  choice: तेरे साथियों से बढ़कर
  rationale: παρά के तुलनात्मक अर्थ को स्पष्ट करता है और μέτοχοι को प्रसंगानुकूल संबंधसूचक ‘साथियों’ से व्यक्त करता है।
theological_decisions:
- issue: δικαιοσύνην का नैतिक अथवा न्यायिक बल
  choice: धार्मिकता
  alternative: न्याय
  rationale: इस राजकीय-मसीही उद्धरण में नैतिक चरित्र प्रमुख है। ‘धार्मिकता’ उस व्यापक भाव को रखती है, जबकि केवल ‘न्याय’ न्यायिक पक्ष को अधिक उभार सकता है।
- issue: पुत्र के संबंध में ‘परमेश्वर, तेरा परमेश्वर’
  choice: मूल दोहराव और संबंध को ज्यों का त्यों रखना
  alternative: त्रिएक संबंध को समझाने वाला व्याख्यात्मक विस्तार
  rationale: पाठ की मसीह-विषयक ऊँचाई और ‘तेरे परमेश्वर’ की भाषा के बीच वास्तविक धर्मवैज्ञानिक तनाव को बिना नरम किए या समझाकर हल किए सुरक्षित रखा गया है।
- issue: παρὰ τοὺς μετόχους σου में तुलना
  choice: तेरे साथियों से बढ़कर
  alternative: तेरे साथियों के ऊपर
  rationale: तुलनात्मक श्रेष्ठता को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है, बिना साथियों की पहचान को निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक उद्धरण-शैली। संबोधन के लिए ‘तू/तेरा’ मूल के एकवचन और भजन-संबंधी ऊँचे संबोधन को दर्शाता है। ‘परमेश्वर ने—तेरे परमेश्वर ने—’ में विरामचिह्न मूल पुनरुक्ति को स्पष्ट करते हैं।
