id: HEB.1.13
reference: Hebrews 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πρὸς τίνα δὲ τῶν ἀγγέλων εἴρηκέν ποτε· Κάθου ἐκ δεξιῶν μου ἕως ἂν θῶ τοὺς ἐχθρούς σου ὑποπόδιον τῶν ποδῶν σου;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/013.yaml
  text: But to which of the angels has he ever said[a], ‘Sit at my right hand until I make your enemies a footstool for your feet’?”
translation:
  language: hi
  text: 'लेकिन स्वर्गदूतों में से किससे उसने कभी कहा है, “मेरे दाहिने बैठो, जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों की चौकी न बना दूँ[a]”?


    [a] या, “जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों के नीचे न रख दूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों के नीचे न रख दूँ।”
    reason: यह वैकल्पिक रूप θῶ और ὑποπόδιον की संयुक्त छवि को लक्ष्य-भाषा में अधिक प्रत्यक्ष रूप से व्यक्त करता है, जबकि मुख्य पाठ ‘पाँवों की चौकी’ के रूपक को अधिक निकटता से सुरक्षित रखता है।
lexical_decisions:
- source_word: πρὸς τίνα δὲ τῶν ἀγγέλων
  choice: लेकिन स्वर्गदूतों में से किससे
  rationale: πρός के साथ τίνα, बोलने की क्रिया के संदर्भ में, ‘किससे’ का अर्थ देता है। δέ को ‘लेकिन’ से व्यक्त किया गया है ताकि पुत्र और स्वर्गदूतों के बीच चल रहा विरोध स्पष्ट रहे।
- source_word: εἴρηκέν ποτε
  choice: उसने कभी कहा है
  rationale: पूर्णकाल εἴρηκεν के वर्तमान तक बने रहने वाले प्रभाव को ‘कहा है’ और ποτέ को ‘कभी’ से स्वाभाविक हिंदी में व्यक्त किया गया है। कर्ता को मूल की तरह सर्वनाम से रखा गया है।
- source_word: Κάθου
  choice: बैठो
  rationale: यह प्रत्यक्ष संबोधन में एकवचन आज्ञा है। आधुनिक मानक हिंदी में ‘तुम’ के अनुरूप ‘बैठो’ सहज, सम्मानपूर्ण और अत्यधिक पुरातनता से मुक्त है।
- source_word: ἐκ δεξιῶν μου
  choice: मेरे दाहिने
  rationale: यह राजकीय प्रतिष्ठापन का प्रचलित स्थानसूचक वाक्यांश है; ‘मेरे दाहिने’ सम्मान और अधिकार के स्थान की छवि बनाए रखता है।
- source_word: ἕως ἂν θῶ
  choice: जब तक कि मैं ... न बना दूँ
  rationale: ἕως ἂν के साथ संभावनार्थक क्रिया भविष्य की सीमा बताती है। ὑποπόδιον के विधेय रूप के कारण ‘बना दूँ’ हिंदी में स्वाभाविक है।
- source_word: τοὺς ἐχθρούς σου
  choice: तुम्हारे शत्रुओं को
  rationale: बहुवचन कर्म का सीधा और गरिमापूर्ण अनुवाद।
- source_word: ὑποπόδιον τῶν ποδῶν σου
  choice: तुम्हारे पाँवों की चौकी
  rationale: अधीन किए जाने की शास्त्रीय छवि को व्याख्यात्मक रूप से सपाट किए बिना सुरक्षित रखा गया है। ‘पाँवों की चौकी’ आधुनिक हिंदी में ‘footstool’ का स्पष्ट रूप है।
theological_decisions:
- issue: भजन 110:1 के उद्धरण की मसीह-संबंधी और राजकीय शक्ति
  choice: 'उद्धरण को सीधे प्रतिष्ठापन-वचन के रूप में रखा गया है: “मेरे दाहिने बैठो ... तुम्हारे पाँवों की चौकी।”'
  alternative: इसे व्याख्यात्मक रूप से ‘जब तक मैं तुम्हारे शत्रुओं को पूरी तरह पराजित न कर दूँ’ कहना।
  rationale: इब्रानियों का तर्क पुत्र को स्वर्गदूतों से अलग ठहराने के लिए उद्धरण की ठीक इसी राजकीय और अधीनता-सूचक छवि पर निर्भर है; इसलिए रूपक को स्पष्टीकरण में विलीन नहीं किया गया।
- issue: दूसरे पुरुष एकवचन के हिंदी संबोधन का स्तर
  choice: ‘तुम/तुम्हारे’ के अनुरूप ‘बैठो’
  alternative: परंपरागत ‘तू/तेरे’ के अनुरूप ‘बैठ’
  rationale: यूनानी एकवचन संख्या बताता है, सामाजिक सम्मान-स्तर नहीं। आधुनिक हिंदी में ‘तुम’ स्वाभाविक और गरिमापूर्ण है तथा मूल में निहित न होने वाला अपमान या अत्यधिक घरेलूपन नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण। प्रश्न की अलंकारिक शक्ति, परमेश्वर के पूर्व कथन का वर्तमान तक बना प्रभाव, और राजकीय प्रतिष्ठापन की छवि सुरक्षित रखी गई है। उद्धरण में ‘तुम’ का प्रयोग आज के सामान्य पाठक के लिए सम्मानपूर्ण और स्वाभाविक है।
