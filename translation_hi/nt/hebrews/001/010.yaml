id: HEB.1.10
reference: Hebrews 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καί· Σὺ κατ’ ἀρχάς, κύριε, τὴν γῆν ἐθεμελίωσας, καὶ ἔργα τῶν χειρῶν σού εἰσιν οἱ οὐρανοί·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/010.yaml
  text: And[a], “You, Lord, in the beginning laid the foundation of the earth, and the heavens are the works of your hands.”
translation:
  language: hi
  text: और, “हे प्रभु, आरम्भ में[a] तूने पृथ्वी की नींव डाली, और आकाश तेरे हाथों के काम हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आरम्भ के समय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καί
  choice: और
  rationale: यह उद्धरण-शृंखला में एक और उद्धरण जोड़ता है; सरल ‘और’ इसके संयोजक बल को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: Σὺ
  choice: तूने / तेरे
  rationale: यूनानी में स्पष्ट सर्वनाम पर बल है। हिन्दी में सम्बोधन और क्रिया-सर्वनाम के एकवचन रूपों द्वारा इसे स्वाभाविक ढंग से सुरक्षित रखा गया है।
- source_word: κατ’ ἀρχάς
  choice: आरम्भ में
  rationale: यह सृष्टि के प्रारम्भ को दर्शाने वाला स्वाभाविक कालवाचक प्रयोग है; ‘आरम्भ में’ आधुनिक, गरिमापूर्ण और बाइबिलीय संदर्भ के अनुकूल है।
- source_word: κύριε
  choice: हे प्रभु
  rationale: सम्बोधन कारक को हिन्दी में ‘हे’ के साथ स्पष्ट किया गया है और κύριος को मानक रूप से ‘प्रभु’ अनूदित किया गया है।
- source_word: τὴν γῆν
  choice: पृथ्वी
  rationale: ‘आकाश’ के समानांतर सृष्टि-संदर्भ में γῆ किसी विशेष भूमि के बजाय पृथ्वी को सूचित करता है।
- source_word: ἐθεμελίωσας
  choice: नींव डाली
  rationale: यह θεμελιόω के स्थापत्य रूपक को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἔργα
  choice: काम
  rationale: ‘तेरे हाथों के काम’ स्रोत के ठोस निर्माण-संबंधी अर्थ और मानवीकरणात्मक बिंब को सरल हिन्दी में बनाए रखता है।
- source_word: τῶν χειρῶν σού
  choice: तेरे हाथों के
  rationale: शाब्दिक संरचना स्रोत के मानवीकरणात्मक बिंब को सुरक्षित रखती है; ‘तेरी कारीगरी’ अधिक व्याख्यात्मक होती।
- source_word: οἱ οὐρανοί
  choice: आकाश
  rationale: हिन्दी में ‘आकाश’ सामान्यतः समष्टिवाचक होकर यूनानी बहुवचन οὐρανοί का स्वाभाविक प्रतिनिधित्व करता है; ‘आकाशों’ यहाँ कम स्वाभाविक लगेगा।
theological_decisions:
- issue: इब्रानियों 1 में पुत्र पर लागू भजन 102 के प्रभु-संबोधन की मसीह-विषयक शक्ति
  choice: मुख्य पाठ में प्रत्यक्ष सम्बोधन ‘हे प्रभु’ को स्पष्ट रूप से बनाए रखना
  alternative: उद्धरण की मसीह-विषयक शक्ति को कम करने के लिए अधिक तटस्थ अनुवाद करना
  rationale: यूनानी उद्धरण में κύριε स्पष्ट प्रत्यक्ष सम्बोधन है। अनुवाद लेखक द्वारा इस भाषा को पुत्र पर लागू किए जाने को न तो कमजोर करता है, न पाठ से आगे बढ़कर उसकी व्याख्या जोड़ता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। परमेश्वर के प्रत्यक्ष सम्बोधन में पारंपरिक एकवचन ‘तू/तेरे’ स्रोत के एकवचन और काव्यात्मक निकटता को व्यक्त करता है; इसका आशय अनादर नहीं है।
