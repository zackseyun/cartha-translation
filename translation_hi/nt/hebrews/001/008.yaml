source:
  edition: SBLGNT
  text: πρὸς δὲ τὸν υἱόν· Ὁ θρόνος σου ὁ θεὸς εἰς τὸν αἰῶνα τοῦ αἰῶνος, ⸂καὶ ἡ ῥάβδος τῆς εὐθύτητος⸃ ῥάβδος τῆς βασιλείας ⸀σου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/008.yaml
  text: But of the Son he says[a], “Your throne, O God, is forever and ever[b], and the scepter of uprightness is the scepter of your kingdom.”
translation:
  language: hi
  text: परन्तु पुत्र के विषय में वह कहता है[a], “आपका सिंहासन, हे परमेश्वर, युगानुयुग है, और सीधाई का राजदण्ड आपके राज्य का राजदण्ड है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, कम सम्भावित अर्थ: “परन्तु पुत्र से वह कहता है।” यूनानी पदबंध कथन के प्राप्तकर्ता या उसके विषय—दोनों की ओर संकेत कर सकता है।'
    reason: syntactic_alternative
  - marker: b
    text: 'या “धार्मिकता का राजदण्ड।” यूनानी शब्द सीधाई, खराई या नैतिक शुद्धता का बोध करा सकता है। एक अन्य, कम सम्भावित वाक्य-विन्यास है: “परमेश्वर आपका सिंहासन युगानुयुग है।”'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: πρὸς δὲ τὸν υἱόν
  choice: परन्तु पुत्र के विषय में वह कहता है
  rationale: यहाँ πρός + कर्मकारक, कथन के निहित क्रियापद के साथ, पुत्र के विषय में कही गई बात को प्रस्तुत करता है। हिन्दी में क्रियापद स्पष्ट करना स्वाभाविक है और पिछले संदर्भ के साथ विरोध भी बनाए रखता है।
- source_word: υἱόν
  choice: पुत्र
  rationale: निश्चित और उपाधिसूचक प्रयोग को ‘पुत्र’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ὁ θρόνος σου ὁ θεὸς
  choice: हे परमेश्वर, आपका सिंहासन
  rationale: संदर्भ और उद्धरण की शक्ति के अनुसार ὁ θεός को सम्बोधन मानना सबसे स्वाभाविक है। इससे पुत्र को सीधे सम्बोधित किया जाता है; व्याकरणतः सम्भव दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: εἰς τὸν αἰῶνα τοῦ αἰῶνος
  choice: युगानुयुग बना रहेगा
  rationale: यह यूनानी मुहावरा अनन्त अवधि व्यक्त करता है। ‘युगानुयुग’ उसकी प्रबल और प्रतिष्ठित हिन्दी अभिव्यक्ति है; ‘बना रहेगा’ हिन्दी वाक्य में सिंहासन की स्थायित्व-धारणा स्पष्ट करता है।
- source_word: ῥάβδος
  choice: राजदण्ड
  rationale: राजकीय संदर्भ में यह शासकीय अधिकार के प्रतीक दण्ड को दर्शाता है; ‘राजदण्ड’ आधुनिक हिन्दी में सटीक है।
- source_word: τῆς εὐθύτητος
  choice: सीधाई
  rationale: εὐθύτης का मूल भाव सीधापन, निष्कपटता अथवा नैतिक खरापन है। ‘सीधाई’ इसे ‘धार्मिकता’ के व्यापक अर्थ में विलीन किए बिना व्यक्त करती है।
- source_word: ῥάβδος τῆς βασιλείας σου
  choice: आपके राज्य का राजदण्ड
  rationale: βασιλεία यहाँ राज्य, राजसत्ता या शासन का बोध करा सकता है। ‘राज्य’ सीधा और राजकीय बिम्ब के अनुकूल है।
theological_decisions:
- issue: क्या ὁ θεός पुत्र के लिए सीधा सम्बोधन है, या ‘परमेश्वर आपका सिंहासन है’ के रूप में विधेय?
  choice: 'सीधा सम्बोधन: ‘हे परमेश्वर, आपका सिंहासन।’'
  alternative: ‘परमेश्वर आपका सिंहासन युगानुयुग है।’
  rationale: इब्रानियों 1 का प्रसंग, उद्धरण की संरचना और भजन-स्रोत का सामान्य पठन सीधे सम्बोधन का समर्थन करते हैं। फिर भी यूनानी वाक्य-विन्यास में वैकल्पिक विश्लेषण सम्भव होने के कारण उसे पादटिप्पणी में दिया गया है।
- issue: εὐθύτης को ‘सीधाई’ या ‘धार्मिकता’ कहना
  choice: मुख्य पाठ में ‘सीधाई’
  alternative: ‘धार्मिकता’
  rationale: ‘सीधाई’ मूल शब्द के सीधेपन और नैतिक खरेपन के भाव को अधिक निकटता से रखती है; न्यायपूर्ण शासन के संदर्भ में ‘धार्मिकता’ भी सम्भव है और पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। पुत्र को सीधे सम्बोधित करते समय आदरसूचक ‘आपका’ प्रयुक्त है। ‘राजदण्ड’ राजकीय रूपक को स्पष्ट रखता है और ‘युगानुयुग’ मूल मुहावरे की अनन्त अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
