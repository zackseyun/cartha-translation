id: HEB.1.6
reference: Hebrews 1:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὅταν δὲ πάλιν εἰσαγάγῃ τὸν πρωτότοκον εἰς τὴν οἰκουμένην, λέγει· Καὶ προσκυνησάτωσαν αὐτῷ πάντες ἄγγελοι θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/006.yaml
  text: And when he again brings the Firstborn into the world[a], he says[b], “And let all God’s angels worship him.”
translation:
  language: hi
  text: और जब वह पहलौठे को फिर संसार में लाता है[a], तो वह कहता है, “और परमेश्वर के सभी स्वर्गदूत उसकी आराधना करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और फिर, जब वह पहलौठे को संसार में लाता है, तो कहता है, ‘परमेश्वर के सभी स्वर्गदूत उसकी आराधना करें।’” यूनानी में “फिर” का सम्बन्ध या तो “लाता है” से या “कहता है” से हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅταν
  choice: जब
  rationale: यह कालवाचक उपवाक्य आरम्भ करता है। यहाँ किसी विशिष्ट घटना का संकेत होने के कारण ‘जब’ स्वाभाविक है।
- source_word: δὲ
  choice: और
  rationale: यह तर्क को आगे बढ़ाने वाला हल्का संयोजक है; ‘और’ अनावश्यक विरोध जोड़े बिना प्रवाह बनाए रखता है।
- source_word: πάλιν
  choice: फिर
  rationale: मुख्य पाठ में इसे εἰσαγάγῃ (‘लाता है’) के साथ जोड़ा गया है। यूनानी में इसे λέγει (‘कहता है’) के साथ जोड़ना भी सम्भव है; यह वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: εἰσαγάγῃ
  choice: लाता है
  rationale: ὅταν के बाद यह भीतर लाने की क्रिया बताता है। ‘लाता है’ वर्तमान हिन्दी में सहज और अर्थानुकूल है।
- source_word: τὸν πρωτότοκον
  choice: पहलौठे
  rationale: यहाँ यह पुत्र के लिए उपाधि के रूप में प्रयुक्त है। ‘पहलौठा’ ज्येष्ठता, पुत्रत्व और पद-प्रतिष्ठा से जुड़े मूल शब्द के भाव को बनाए रखता है।
- source_word: εἰς τὴν οἰκουμένην
  choice: संसार में
  rationale: οἰκουμένη का अर्थ बसा हुआ जगत अथवा संसार हो सकता है। ‘संसार’ व्यापक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: λέγει
  choice: वह कहता है
  rationale: सन्दर्भ में निहित कर्ता परमेश्वर है, पर यूनानी की तरह नाम स्पष्ट रूप से जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: προσκυνησάτωσαν
  choice: आराधना करें
  rationale: यह आज्ञार्थक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। इब्रानियों 1 के सन्दर्भ में स्वर्गदूतों द्वारा पुत्र को दिए जाने वाले सम्मान के लिए ‘आराधना’ उचित है।
- source_word: αὐτῷ
  choice: उसकी
  rationale: προσκυνέω के सम्प्रदान कारक कर्म को हिन्दी में ‘उसकी आराधना करें’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: πάντες ἄγγελοι θεοῦ
  choice: परमेश्वर के सभी स्वर्गदूत
  rationale: यह सम्बन्धकारक रचना को स्पष्ट और सहज हिन्दी में रखता है तथा πάντες के ‘सभी’ पर बल को सुरक्षित रखता है।
theological_decisions:
- issue: πάλιν का वाक्यगत सम्बन्ध
  choice: '‘फिर’ को ‘लाता है’ से जोड़ा गया: ‘जब वह पहलौठे को फिर संसार में लाता है’'
  alternative: '‘फिर’ को ‘कहता है’ से जोड़ना: ‘और फिर, जब वह पहलौठे को संसार में लाता है, तो कहता है’'
  rationale: यूनानी दोनों अर्थों की अनुमति देता है। मुख्य पाठ में शब्दक्रम के निकट पठन चुना गया है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: पुत्र के प्रति προσκυνέω का बल
  choice: ‘आराधना करें’
  alternative: ‘दण्डवत् करें’ अथवा ‘श्रद्धापूर्वक झुकें’
  rationale: इब्रानियों 1 में पुत्र की स्वर्गदूतों से श्रेष्ठता और परमेश्वर के सभी स्वर्गदूतों को दी गई आज्ञा के सन्दर्भ में ‘आराधना’ क्रिया का उपयुक्त बल व्यक्त करती है, बिना पाठ से आगे कोई अतिरिक्त सिद्धान्त जोड़ने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहलौठा’ बाइबिलीय अर्थ-संबंधों को बचाता है; ‘आराधना’ प्रसंग में προσκυνέω का पूरा बल व्यक्त करती है।
