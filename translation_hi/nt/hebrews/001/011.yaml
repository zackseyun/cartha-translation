    reason: cross_reference
lexical_decisions:
- source_word: αὐτοὶ
  choice: वे तो
  rationale: यह पिछले पद में आए आकाश और पृथ्वी की ओर संकेत करता है। ‘तो’ स्पष्ट सर्वनाम और आगे के विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: ἀπολοῦνται
  choice: नाश हो जाएँगे
  rationale: यह आने वाले अंत या विनाश का प्रबल भाव रखता है, पर किसी बाहरी कर्ता या विनाश की रीति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: σὺ δὲ
  choice: परन्तु आप
  rationale: सृष्टि और सम्बोधित व्यक्ति के बीच प्रबल विरोध बनाए रखता है। ‘आप’ प्रत्यक्ष एकवचन सम्बोधन को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: διαμένεις
  choice: बने रहते हैं
  rationale: निरन्तर अस्तित्व और स्थायित्व का भाव देता है तथा नाश हो जाने वाली सृष्टि से विरोध स्पष्ट करता है।
- source_word: πάντες
  choice: वे सब
  rationale: पहले उल्लिखित सृष्ट वस्तुओं को सामूहिक रूप से संदर्भित करता है और πάντες की व्यापकता बनाए रखता है।
- source_word: ὡς ἱμάτιον
  choice: वस्त्र के समान
  rationale: ἱμάτιον के व्यापक अर्थ और उपमा को किसी विशेष प्रकार के पहनावे तक सीमित किए बिना सुरक्षित रखता है।
- source_word: παλαιωθήσονται
  choice: पुराने हो जाएँगे
  rationale: मूल निष्क्रिय रूप का ‘पुराना/जीर्ण हो जाना’ भाव सीधे व्यक्त करता है और वस्त्र की छवि बनाए रखता है; ‘घिस जाएँगे’ भी सम्भव अर्थ है।
theological_decisions:
- issue: सम्बोधित व्यक्ति और मसीह-संबंधी बल
  choice: पुत्र के प्रति प्रत्यक्ष सम्बोधन के रूप में ‘आप बने रहते हैं’
  alternative: सम्बोधित व्यक्ति की पहचान को पद के भीतर स्पष्ट करने के लिए ‘हे पुत्र’ जोड़ना
  rationale: इब्रानियों 1 के प्रसंग में यह कथन पुत्र को सम्बोधित है, किन्तु मूल पद में नाम या उपाधि दोहराई नहीं गई। इसलिए प्रत्यक्ष द्वितीय-पुरुष सम्बोधन सुरक्षित रखा गया और व्याख्यात्मक शब्द नहीं जोड़े गए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ईश्वर-पुत्र के प्रत्यक्ष सम्बोधन में आदरसूचक एकवचन ‘आप’ के साथ बहुवचन क्रिया-रूप का प्रयोग किया गया है। मूल के दो समानांतर कथनों और उनके प्रबल विरोध को बनाए रखा गया है।
