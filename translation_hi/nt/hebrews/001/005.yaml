id: HEB.1.5
reference: Hebrews 1:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε, καὶ πάλιν· Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα, καὶ αὐτὸς ἔσται μοι εἰς υἱόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/005.yaml
  text: For to which of the angels did he ever say[a], “You are my Son; today I have begotten you”? And again, “I will be to him a father[c][b], and he will be to me a son”?
translation:
  language: hi
  text: 'क्योंकि परमेश्वर ने स्वर्गदूतों में से किससे कभी कहा,


    “तुम मेरे पुत्र हो;

    आज मैंने तुम्हें जन्म दिया है”?[a]


    और फिर,


    “मैं उसका पिता होऊँगा,

    और वह मेरा पुत्र होगा”?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ भजन 2:7 उद्धृत है। “आज मैंने तुम्हें जन्म दिया है” को राजकीय सिंहासनारोहण, पुनरुत्थान या पिता के साथ पुत्र के अनन्त सम्बन्ध के सन्दर्भ में समझा गया है; अनुवाद किसी एक अर्थ का निर्णय नहीं करता।
    reason: cross_reference
  - marker: b
    text: यह 2 शमूएल 7:14 का उद्धरण है। शब्दशः, “मैं उसके लिए पिता होऊँगा, और वह मेरे लिए पुत्र होगा।”
    reason: alternative_reading
lexical_decisions:
- source_word: Τίνι γὰρ εἶπέν ποτε τῶν ἀγγέλων
  choice: क्योंकि परमेश्वर ने स्वर्गदूतों में से किससे कभी कहा
  rationale: प्रश्नवाचक दत्तिव Τίνι और अंशसूचक τῶν ἀγγέλων को स्वाभाविक हिन्दी में सुरक्षित रखा गया है। निहित कर्ता को सन्दर्भानुसार ‘परमेश्वर’ कहकर स्पष्ट किया गया है; ‘कभी’ ποτέ की सर्वथा निषेधात्मक आलंकारिक शक्ति बनाए रखता है।
- source_word: Υἱός μου εἶ σύ
  choice: तुम मेरे पुत्र हो
  rationale: सीधे सम्बोधन और पुत्रत्व की उपाधि को सहज, गरिमापूर्ण हिन्दी में रखा गया है। देवनागरी में अंग्रेज़ी जैसा बड़े-छोटे अक्षरों का भेद सम्भव नहीं है।
- source_word: σήμερον γεγέννηκά σε
  choice: आज मैंने तुम्हें जन्म दिया है
  rationale: σήμερον का सीधा कालवाचक अर्थ और γεννάω के पूर्णकाल का परिणामी भाव सुरक्षित है। ‘जन्म दिया है’ हिन्दी में बोधगम्य रहते हुए मूल रूपक को बिना व्याख्यात्मक निष्कर्ष के बनाए रखता है।
- source_word: καὶ πάλιν
  choice: और फिर
  rationale: यह सूत्र एक और शास्त्रीय उद्धरण प्रस्तुत करता है; ‘और फिर’ वर्तमान हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: Ἐγὼ ἔσομαι αὐτῷ εἰς πατέρα
  choice: मैं उसके लिए पिता ठहरूँगा
  rationale: εἰς + कर्मकारक की सम्बन्धपरक और वाचागत गम्भीरता को ‘उसके लिए ... ठहरूँगा’ से रखा गया है; यह केवल स्वामित्वसूचक ‘उसका पिता’ की अपेक्षा मूल संरचना के निकट है।
- source_word: καὶ αὐτὸς ἔσται μοι εἰς υἱόν
  choice: और वह मेरे लिए पुत्र ठहरेगा
  rationale: पहले खंड के समानान्तर सम्बन्धपरक संरचना को बनाए रखा गया है और covenantal sonship को अनावश्यक रूप से विशिष्ट सिद्धान्त में नहीं बदला गया।
theological_decisions:
- issue: “आज मैंने तुम्हें जन्म दिया है” का तात्पर्य
  choice: मूल जन्म-सम्बन्धी भाषा को बिना किसी एक व्याख्या को निश्चित किए बनाए रखना
  alternative: इसे स्पष्ट रूप से राजकीय अभिषेक, पुनरुत्थान, देहधारण अथवा पिता के साथ पुत्र के अनन्त सम्बन्ध के रूप में अनूदित करना
  rationale: भजन 2:7 के उद्धरण का इब्रानियों में मसीह-संबंधी प्रयोग है, पर पद स्वयं इन सम्भावित व्याख्याओं में से किसी एक को अनुवाद में अनिवार्य नहीं करता।
- issue: दोनों उद्धरणों में पुत्रत्व की भाषा
  choice: दोनों स्थानों पर ‘पुत्र’ रखना और साहित्यिक भेद को वाक्य-संरचना से प्रकट होने देना
  alternative: दूसरे उद्धरण में ऐसा विशिष्ट पद जोड़ना जो उसके मसीह-संबंधी अनुप्रयोग को सीधे स्पष्ट करे
  rationale: देवनागरी में अंग्रेज़ी के Son/son जैसा अक्षर-आकार भेद उपलब्ध नहीं है। इब्रानियों का सन्दर्भ दोनों उद्धरणों को पुत्र पर लागू करता है, जबकि 2 शमूएल 7:14 की वाचा-सूत्र भाषा भी अक्षुण्ण रहनी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। पद्यात्मक उद्धरणों को अलग पंक्तियों में रखा गया है। ‘ठहरूँगा’ औपचारिक वाचा-सूत्र और εἰς-रचना का स्वाद बचाता है, जबकि मुख्य प्रश्न में ‘कभी कहा’ सहज आधुनिक प्रयोग है।
