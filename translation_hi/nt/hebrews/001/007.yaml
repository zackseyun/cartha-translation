id: HEB.1.7
reference: Hebrews 1:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ πρὸς μὲν τοὺς ἀγγέλους λέγει· Ὁ ποιῶν τοὺς ἀγγέλους αὐτοῦ πνεύματα, καὶ τοὺς λειτουργοὺς αὐτοῦ πυρὸς φλόγα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/007.yaml
  text: And about the angels he says[a], “He makes his angels winds, and his ministers a flame of fire.”
translation:
  language: hi
  text: और स्वर्गदूतों के विषय में वह कहता है, “वह अपने स्वर्गदूतों को हवाएँ[a] और अपने सेवकों को आग की ज्वाला बनाता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आत्माएँ”; यूनानी शब्द के दोनों अर्थ हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: πρὸς μὲν τοὺς ἀγγέλους
  choice: स्वर्गदूतों के विषय में
  rationale: यहाँ πρός का प्रयोग कथन के विषय को बताता है, सीधे संबोधन को नहीं; उद्धरण स्वर्गदूतों से नहीं बल्कि उनके विषय में है।
- source_word: λέγει
  choice: वह कहता है
  rationale: उद्धरण-सूत्र का वर्तमान काल बनाए रखा गया है, जिससे पवित्रशास्त्र के कथन की सजीव वर्तमानता व्यक्त होती है।
- source_word: Ὁ ποιῶν
  choice: वह ... बनाता है
  rationale: कृदंत का स्वाभाविक हिन्दी क्रियात्मक रूप सक्रिय अर्थ को स्पष्ट और सहज रखता है।
- source_word: ἀγγέλους
  choice: स्वर्गदूतों
  rationale: इब्रानियों 1 के संदर्भ में ये वे स्वर्गीय प्राणी हैं जिनकी तुलना पुत्र से की जा रही है; इसलिए सामान्य ‘दूतों’ के बजाय ‘स्वर्गदूतों’ उपयुक्त है।
- source_word: πνεύματα
  choice: हवाएँ
  rationale: शब्द का अर्थ ‘हवाएँ’ या ‘आत्माएँ’ दोनों हो सकता है। भजन 104:4 की पृष्ठभूमि और ‘आग की ज्वाला’ के समानांतर काव्य-बिंब में ‘हवाएँ’ अधिक संभावित है; दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: λειτουργοὺς
  choice: सेवकों
  rationale: यह शब्द सेवा करने वालों को सूचित करता है और कभी-कभी पवित्र या आधिकारिक सेवा का भाव रखता है। आधुनिक हिन्दी में ‘सेवकों’ स्वाभाविक है और किसी बाद के कलीसियाई पद को आरोपित नहीं करता।
- source_word: πυρὸς φλόγα
  choice: आग की ज्वाला
  rationale: एकवचन रूप और काव्यात्मक अग्नि-बिंब दोनों सुरक्षित रहते हैं।
- source_word: αὐτοῦ
  choice: अपने
  rationale: हिन्दी में कर्ता की ओर लौटने वाला ‘अपने’ स्वाभाविक रूप से यूनानी संबंधवाचक सर्वनाम का अर्थ व्यक्त करता है।
theological_decisions:
- issue: भजन 104:4 के उद्धरण में πνεύματα का अर्थ
  choice: हवाएँ
  alternative: आत्माएँ
  rationale: यूनानी शब्द वास्तव में दोनों अर्थ दे सकता है। इब्रानी पृष्ठभूमि और समानांतर अग्नि-बिंब ‘हवाएँ’ का समर्थन करते हैं, पर अस्पष्टता को मिटाने के बजाय वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘स्वर्गदूत’ संदर्भ को स्पष्ट करता है; ‘सेवक’ किसी विशिष्ट कलीसियाई पद का संकेत दिए बिना λειτουργός की सेवा-संबंधी धारणा व्यक्त करता है।
