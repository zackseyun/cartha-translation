base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/002.yaml
  text: in these last days he has spoken to us in a Son[a], whom he appointed heir of all things[b], through whom he also made the ages.
translation:
  language: hi
  text: इन अंतिम दिनों में उसने हमसे पुत्र में[a] बोला है, जिसे उसने सबका वारिस ठहराया और जिसके द्वारा उसने युगों को भी बनाया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुत्र के द्वारा।” यूनानी में शब्दशः “पुत्र में” है और “पुत्र” से पहले कोई निश्चित उपपद नहीं है; इससे परमेश्वर के बोलने के ढंग और उसकी चरम अभिव्यक्ति पर बल पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: या, “ब्रह्मांड को” अथवा “संसारों को।” यूनानी में शब्दशः “युगों को” है; यह युगों और, विस्तृत अर्थ में, संपूर्ण सृष्टि-व्यवस्था का उल्लेख कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπ’ ἐσχάτου τῶν ἡμερῶν τούτων
  choice: इन अन्तिम दिनों में
  rationale: यह स्वाभाविक आधुनिक हिन्दी में यूनानी कालवाचक मुहावरे और उसके अन्त-काल सम्बन्धी बल को बनाए रखता है।
- source_word: ἐλάλησεν ἡμῖν
  choice: उसने हमसे ... बात की है
  rationale: पूर्ण हो चुकी किन्तु वर्तमान महत्त्व रखने वाली परमेश्वर की वाणी को स्वाभाविक हिन्दी में व्यक्त करता है; ‘हमसे’ श्रोताओं की दिशा स्पष्ट करता है।
- source_word: ἐν υἱῷ
  choice: पुत्र में
  rationale: ἐν का ‘में’ वाला रूप और υἱῷ के साथ उपपद का अभाव सुरक्षित रहता है। हिन्दी में ‘एक पुत्र में’ अनावश्यक रूप से किसी अनिश्चित पुत्र का बोध करा सकता है, इसलिए मुख्य पाठ में ‘पुत्र में’ रखा गया है और साधनवाचक सम्भावना पादटिप्पणी में दी गई है।
- source_word: ὃν ἔθηκεν κληρονόμον πάντων
  choice: जिसे उसने सब वस्तुओं का वारिस ठहराया
  rationale: τίθημι का भूमिकागत अर्थ ‘ठहराया’ से और πάντων का व्यापक विस्तार ‘सब वस्तुओं’ से स्पष्ट होता है।
- source_word: δι’ οὗ
  choice: जिसके द्वारा
  rationale: διά के सम्बन्धवाचक, मध्यस्थ साधन या कर्तृत्व के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐποίησεν
  choice: बनाया
  rationale: ποιέω के सामान्य अर्थ को बनाए रखता है और ‘सृजा’ जैसी अधिक विशिष्ट शब्दावली नहीं थोपता।
- source_word: τοὺς αἰῶνας
  choice: युगों को
  rationale: मूल शब्द के कालगत रूप को प्रत्यक्ष रखता है, साथ ही उसकी व्यापक सृष्टिगत सम्भावना पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ἐν υἱῷ का मसीह-विषयक बल
  choice: पुत्र में
  alternative: पुत्र के द्वारा; एक पुत्र में
  rationale: यह असामान्य, उपपद-रहित यूनानी अभिव्यक्ति को परिचित ‘अपने पुत्र के द्वारा’ में बदलकर अधिक निश्चित नहीं करता। साथ ही हिन्दी में ‘एक पुत्र’ से उत्पन्न सम्भावित भ्रामक अनिश्चितता से बचता है।
- issue: τοὺς αἰῶνας का विस्तार
  choice: युगों को
  alternative: ब्रह्माण्ड को; संसारों को
  rationale: मुख्य पाठ यूनानी पद की कालगत-सृष्टिगत व्यापकता को खुला रखता है; पादटिप्पणी स्पष्ट करती है कि इसका आशय सम्पूर्ण सृष्टि-व्यवस्था भी हो सकता है।
