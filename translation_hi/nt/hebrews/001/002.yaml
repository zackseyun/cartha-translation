  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘अन्तिम दिनों’, ‘वारिस’ और ‘युगों’ जैसे परिचित बाइबलीय पद रखे गए हैं; मूल की वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
