  text: Πολυμερῶς καὶ πολυτρόπως πάλαι ὁ θεὸς λαλήσας τοῖς πατράσιν ἐν τοῖς προφήταις
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/001.yaml
  text: Long ago[c][b][a], God spoke to the fathers in many parts and in many ways by the prophets.
translation:
  language: hi
  text: बहुत पहले[a] परमेश्वर ने पूर्वजों[b] से भविष्यवक्ताओं के द्वारा[c] अनेक अंशों में[d] और अनेक प्रकार से बात की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्राचीन काल में’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘पिताओं से’। यहाँ आशय पिछली पीढ़ियों के पूर्वजों से है।
    reason: lexical_alternative
  - marker: c
    text: या ‘भविष्यवक्ताओं के माध्यम से’; शाब्दिक रूप से ‘भविष्यवक्ताओं में’।
    reason: lexical_alternative
  - marker: d
    text: या ‘अनेक भागों में’। यूनानी में यह ‘अनेक प्रकार से’ से अलग अभिव्यक्ति है और पहले के प्रकाशन के अनेक अंशों में दिए जाने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πολυμερῶς
  choice: अनेक अंशों में
  rationale: यह यूनानी क्रियाविशेषण प्रकाशन के अनेक भागों या अंशों में दिए जाने का भाव रखता है। यह अनुवाद इसे πολυτρόπως के ‘अनेक प्रकार से’ वाले भाव से अलग बनाए रखता है।
- source_word: πολυτρόπως
  choice: अनेक प्रकार से
  rationale: यह अभिव्यक्ति बोलने के विविध ढंगों या माध्यमों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: πάλαι
  choice: बहुत पहले
  rationale: यह समय की दूरी को स्पष्ट, सहज और गैर-पुरातन हिन्दी में व्यक्त करता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: यह कर्ता के लिए प्रचलित, गरिमापूर्ण और स्पष्ट हिन्दी पद है।
- source_word: λαλήσας
  choice: बात की
  rationale: यूनानी में यह कृदंत है और पद 2 की मुख्य क्रिया से जुड़ता है; अलग पद के रूप में पठनीयता के लिए हिन्दी में पूर्ण क्रिया रखी गई है, जबकि पहले और अब के प्रकाशन का कालगत विरोध सुरक्षित रहता है।
- source_word: τοῖς πατράσιν
  choice: पूर्वजों से
  rationale: संदर्भ में ‘पिताओं’ का आशय पिछली पीढ़ियों के वाचा-सम्बन्धी पूर्वजों से है। ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: ἐν τοῖς προφήταις
  choice: भविष्यवक्ताओं के द्वारा
  rationale: ἐν का शाब्दिक अर्थ ‘में’ है, पर यहाँ वह माध्यम या प्रतिनिधि का भाव देता है। ‘के द्वारा’ परमेश्वर को वक्ता और भविष्यवक्ताओं को उसके माध्यम के रूप में स्पष्ट करता है।
theological_decisions:
- issue: इब्रानियों 1:2 के संबंध में कृदंत λαλήσας का अनुवाद
  choice: पद 1 में हिन्दी की पूर्ण क्रिया ‘बात की’ का प्रयोग
  alternative: 'अधिक रूपगत अनुवाद: ‘बात कर चुकने के बाद...’ या ‘जिस परमेश्वर ने... बात की’'
  rationale: यूनानी वाक्य पद 2 में पूरा होता है, पर पृथक पद के रूप में अत्यधिक शाब्दिक कृदंत हिन्दी में अधूरा या भ्रामक लगेगा। पूर्ण क्रिया अर्थ को बनाए रखती है और पहले के प्रकाशन तथा पुत्र में हुए प्रकाशन के बीच विरोध को बिना अतिरिक्त व्याख्या जोड़े सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण रखी गई है। ‘अनेक अंशों में’ और ‘अनेक प्रकार से’ की समानांतर रचना मूल यूनानी के दो अलग क्रियाविशेषणों का भेद बचाती है। ‘पूर्वजों’ सामान्य पाठक के लिए ‘पितरों’ से अधिक स्पष्ट है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
