id: HEB.1.3
reference: Hebrews 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς ὢν ἀπαύγασμα τῆς δόξης καὶ χαρακτὴρ τῆς ὑποστάσεως αὐτοῦ, φέρων τε τὰ πάντα τῷ ῥήματι τῆς δυνάμεως, ⸂δι’ αὑτοῦ⸃ καθαρισμὸν ⸂τῶν ἁμαρτιῶν ποιησάμενος⸃ ἐκάθισεν ἐν δεξιᾷ τῆς μεγαλωσύνης ἐν ὑψηλοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/001/003.yaml
  text: He[a], being the radiance of his glory and the exact imprint of his being, and sustaining all things by the word of his power, after making purification for sins through himself[b], sat down at the right hand of the Majesty on high[c],
translation:
  language: hi
  text: वह उसकी महिमा की आभा और उसके अस्तित्व की हूबहू छाप[a] है और अपने सामर्थ्य के वचन से सब कुछ संभाले रखता है। अपने ही द्वारा[b] पापों से शुद्धि करने के बाद, वह ऊँचाइयों में[c] महामहिम की दाहिनी ओर बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके स्वरूप/तत्व की सटीक प्रतिकृति।”
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में “अपने ही द्वारा” नहीं है; यहाँ SBLGNT के पाठ के अनुसार इसे शामिल किया गया है।
    reason: textual_variant
  - marker: c
    text: या, “ऊपर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀπαύγασμα
  choice: आभा
  rationale: यह शब्द महिमा से निकलने वाले तेज को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है; “प्रतिबिंब” मूल बिंब को अनावश्यक रूप से कमज़ोर कर सकता है।
- source_word: χαρακτήρ
  choice: हूबहू छाप
  rationale: यह मुहर से बनी सटीक छाप के ठोस बिंब और पूर्ण अनुरूपता—दोनों को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: ὑπόστασις
  choice: अस्तित्व
  rationale: यह अंतर्निहित वास्तविक सत्ता का बोध कराता है, पर बाद की दार्शनिक या धर्मवैज्ञानिक तकनीकी शब्दावली को सीधे पाठ में नहीं थोपता।
- source_word: φέρων
  choice: संभाले रखता है
  rationale: वर्तमान कृदंत के निरंतर, सक्रिय धारण और संचालन के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὰ πάντα
  choice: सब कुछ
  rationale: यूनानी पद की व्यापकता को बिना केवल भौतिक ब्रह्मांड तक सीमित किए स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τῷ ῥήματι τῆς δυνάμεως
  choice: अपने सामर्थ्य के वचन से
  rationale: मूल संबंधवाचक रचना को निकटता से रखता है और प्रभावशाली दैवी वाणी का भाव सुरक्षित करता है।
- source_word: δι’ αὑτοῦ
  choice: अपने ही द्वारा
  rationale: SBLGNT में उपस्थित आत्मवाचक पद और διά के माध्यम/कर्ता-सदृश भाव को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: καθαρισμὸν τῶν ἁμαρτιῶν
  choice: पापों का शुद्धिकरण
  rationale: यह पाप से निपटने वाली शुद्धि के बलिदान-संबंधी भाव को बनाए रखता है और मूल संबंधवाचक संरचना से निकट है।
- source_word: ἐν δεξιᾷ
  choice: दाहिने
  rationale: हिन्दी में किसी के ‘दाहिने बैठना’ स्वाभाविक है; ‘दाहिने हाथ पर’ अनावश्यक रूप से शब्दशः और असहज होता।
- source_word: ἐν ὑψηλοῖς
  choice: ऊँचे स्थान पर
  rationale: यह ‘ऊँचाइयों में/ऊपर’ के स्थानगत भाव को रखता है, पर सीधे ‘स्वर्ग में’ कहकर अर्थ को अधिक निश्चित नहीं करता।
theological_decisions:
- issue: ὑπόστασις का मसीह-विज्ञान संबंधी अर्थ
  choice: अस्तित्व
  alternative: स्वरूप / तत्व / सारतत्त्व
  rationale: ‘अस्तित्व’ सशक्त अस्तित्वगत अर्थ रखता है, जबकि बाद की महासभाई पारिभाषिकता को अनैतिहासिक ढंग से सीधे पद में नहीं डालता।
- issue: ἀπαύγασμα और χαρακτήρ की मसीह-विज्ञान संबंधी शक्ति
  choice: आभा और हूबहू छाप
  alternative: प्रतिबिंब और प्रतिनिधित्व
  rationale: चुने हुए शब्द पुत्र और परमेश्वर की महिमा तथा वास्तविकता के बीच गहरे और सटीक संबंध को सुरक्षित रखते हैं; कमज़ोर प्रतिनिधित्वात्मक भाषा मूल कथन को हल्का कर देती।
- issue: δι’ αὑτοῦ की पाठांतर समस्या
  choice: अपने ही द्वारा को मुख्य पाठ में शामिल किया
  alternative: पद को छोड़ देना
  rationale: दिए गए SBLGNT पाठ में यह पद उपस्थित है; अन्य पांडुलिपियों में इसके लोप को पाठकीय पारदर्शिता के लिए पादटिप्पणी में बताया गया है।
- issue: ‘महामहिम’ का संदर्भ
  choice: महामहिम को दैवी उपाधि के रूप में बनाए रखा
  alternative: परमेश्वर
  rationale: मूल का भाववाचक और श्रद्धापूर्ण नामकरण सुरक्षित रहता है तथा अंतर्निहित संदर्भ को व्याख्यात्मक संज्ञा से नहीं बदला जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, पठनीय रूप अपनाया गया है। लंबे यूनानी वाक्य को अर्थ-संबंध बनाए रखते हुए दो हिन्दी वाक्यों में बाँटा गया है। सर्वनाम ‘उसकी/उसके’ पिछले पद के संदर्भ को खुला रखता है; ‘परमेश्वर’ जोड़कर उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
