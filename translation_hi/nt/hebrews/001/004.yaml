  text: having become as much superior to the angels as the name he has inherited is more excellent than theirs.
translation:
  language: hi
  text: वह स्वर्गदूतों से उतना ही श्रेष्ठ हो गया, जितना वह नाम जो उसने विरासत में पाया है, उनके नाम से अधिक विशिष्ट है।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह स्वर्गदूतों से उतना ही बेहतर हो गया, जितना वह नाम जो उसने विरासत में पाया है, उनके नाम से अधिक विशिष्ट है।”
    reason: lexical_alternative
  - marker: b
    text: आगे के संदर्भ में यह “नाम” पुत्र की उपाधि और पद के रूप में स्पष्ट होता है।
    reason: cross_reference
lexical_decisions:
- source_word: τοσούτῳ ... ὅσῳ
  choice: उतना ही ... जितना
  rationale: यह सहसंबंधी रचना दोनों तुलनाओं के समानुपाती संबंध को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: κρείττων
  choice: श्रेष्ठ
  rationale: यहाँ तुलना पद और प्रतिष्ठा की है; ‘श्रेष्ठ’ नैतिक अर्थ तक सीमित हुए बिना स्वर्गदूतों पर ऊँचे स्थान को व्यक्त करता है।
- source_word: γενόμενος
  choice: हो गया
  rationale: यह यूनानी कृदंत के ‘बनने/होने’ के भाव को सीधे रखता है और ‘बनाया गया’ कहकर सृष्ट प्राणी होने का अनावश्यक संकेत नहीं देता।
- source_word: τῶν ἀγγέλων
  choice: स्वर्गदूतों से
  rationale: तुलनात्मक विशेषण के बाद यूनानी संबंधकारक का स्वाभाविक हिन्दी रूप ‘से’ है।
- source_word: διαφορώτερον
  choice: उत्तम ... बढ़कर
  rationale: ‘उत्तम’ नाम की उत्कृष्टता बताता है और ‘बढ़कर’ स्पष्ट तुलनात्मक बल देता है; केवल ‘भिन्न’ कहना संदर्भ में बहुत दुर्बल होता।
- source_word: παρ’ αὐτοὺς
  choice: उनके नाम से
  rationale: यूनानी में तुलना स्वर्गदूतों से है; हिन्दी में अस्पष्ट ‘उनसे’ के बजाय निहित तुलना-बिंदु ‘नाम’ दोहराने से आशय साफ होता है।
- source_word: κεκληρονόμηκεν
  choice: विरासत में पाया है
  rationale: पूर्णकालीन रूप से उत्पन्न वर्तमान परिणाम को ‘पाया है’ व्यक्त करता है और विरासत का भाव भी सुरक्षित रहता है।
- source_word: ὄνομα
  choice: नाम
  rationale: शाब्दिक ‘नाम’ रखा गया है; आगे का संदर्भ इसे पुत्र के नाम/पद के रूप में स्पष्ट करता है।
theological_decisions:
- issue: γενόμενος (‘हो गया’) का मसीह-संबंधी आशय
  choice: क्रिया के बनने/होने के भाव को रखते हुए इसे पुत्र की स्वर्गदूतों से श्रेष्ठ, महिमित स्थिति के संदर्भ में प्रस्तुत किया गया है।
  alternative: ‘बनाया गया’ कहना, अथवा इसे पुत्र के सृजे जाने या बाद में दिव्य बनने का कथन मानना।
  rationale: पद का निकट संदर्भ पुत्र की महिमा, राज्यारोहण और प्राप्त नाम की तुलना स्वर्गदूतों से करता है। अनुवाद को क्रिया का तनाव बनाए रखना चाहिए, पर ऐसी व्याख्या उसमें नहीं जोड़नी चाहिए जो पद स्वयं नहीं कहता।
- issue: ‘नाम’ का अर्थ
  choice: मुख्य पाठ में ‘नाम’ ही रखा गया है और अगले पदों को उसका आशय खोलने दिया गया है।
  alternative: मुख्य पाठ में सीधे ‘पुत्र की उपाधि’ या सामान्यतः ‘सम्मान/पद’ कहना।
  rationale: मूल पद केवल ‘नाम’ कहता है; आगामी उद्धरण पुत्र-संबंधी पहचान और पद को स्पष्ट करते हैं। शाब्दिक रूप साहित्यिक प्रगति और अर्थ-व्याप्ति दोनों सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। समानुपाती तुलना को ‘उतना ही ... जितना’ से रखा गया है; दूसरी उपवाक्य-रचना में ‘वह उनके नाम से बढ़कर है’ कहकर हिन्दी की स्पष्टता बनाए रखी गई है।
