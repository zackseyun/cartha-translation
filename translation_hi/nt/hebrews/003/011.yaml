  text: 'जैसा मैंने अपने क्रोध में शपथ खाई थी: “वे मेरे विश्राम में कभी प्रवेश नहीं करेंगे।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शब्दशः, “यदि वे मेरे विश्राम में प्रवेश करेंगे”; यह शपथ खाने की एक अभिव्यक्ति है, जिसका अर्थ है, “वे निश्चय ही मेरे विश्राम में प्रवेश नहीं करेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς
  choice: जैसा
  rationale: यह पिछले संदर्भ से जुड़ी उद्धरण-वाक्य की निरंतरता दिखाता है और हिन्दी में स्वाभाविक है।
- source_word: ὤμοσα
  choice: मैंने ... शपथ खाकर कहा
  rationale: ὀμνύω शपथ खाने को व्यक्त करता है; हिन्दी में उद्धृत घोषणा के साथ यह रूप स्पष्ट और सहज है।
- source_word: ἐν τῇ ὀργῇ μου
  choice: अपने क्रोध में
  rationale: ὀργή यहाँ परमेश्वर के गंभीर, न्यायपूर्ण रोष को व्यक्त करता है; ‘क्रोध’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: Εἰ εἰσελεύσονται
  choice: वे ... कभी प्रवेश नहीं करेंगे
  rationale: εἰ और भविष्यकालीन क्रिया यहाँ सामी शपथ-सूत्र हैं, जिसका आशय प्रबल निषेध है, न कि सामान्य शर्त।
- source_word: εἰς τὴν κατάπαυσίν μου
  choice: मेरे विश्राम में
  rationale: ‘विश्राम’ भजन 95 और इब्रानियों में विकसित मूल धर्मवैचारिक प्रतिमान को बनाए रखता है तथा उसे किसी एक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: Εἰ εἰσελεύσονται शपथ-सूत्र का अनुवाद
  choice: 'स्पष्ट प्रबल निषेध: “वे ... कभी प्रवेश नहीं करेंगे”'
  alternative: 'अधिक शब्दशः: “यदि वे मेरे विश्राम में प्रवेश करेंगे”'
  rationale: शब्दशः शर्तसूचक रूप हिन्दी पाठक को भ्रमित कर सकता है। स्पष्ट निषेध मूल शपथ-सूत्र का वास्तविक बल सुरक्षित रखता है।
- issue: κατάπαυσις का संदर्भगत अर्थ
  choice: विश्राम
  alternative: विश्राम-स्थान
  rationale: ‘विश्राम’ भजन और इब्रानियों के बीच अंतर्पाठीय संबंध तथा भूमि, परमेश्वर के अपने विश्राम और भावी प्रतिज्ञा से जुड़ी अर्थगत व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल है। ‘विश्राम’ को पूरे इब्रानियों में प्रमुख शब्द के रूप में बनाए रखा गया है।
