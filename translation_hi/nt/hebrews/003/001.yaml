  text: Ὅθεν, ἀδελφοὶ ἅγιοι, κλήσεως ἐπουρανίου μέτοχοι, κατανοήσατε τὸν ἀπόστολον καὶ ἀρχιερέα τῆς ὁμολογίας ἡμῶν ⸀Ἰησοῦν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/001.yaml
  text: Therefore[a], holy brothers, sharers in a heavenly calling, consider Jesus, the apostle and high priest of our confession[c][b],
translation:
  language: hi
  text: इसलिए, पवित्र भाइयो[a], स्वर्गीय बुलाहट में सहभागी[b], हमारे अंगीकार के प्रेरित और महायाजक यीशु पर ध्यान दो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘भाइयो’ का सम्बोधन पूरे विश्वासी समुदाय से है, जिसमें स्त्रियाँ भी सम्मिलित हैं।
    reason: cultural_note
  - marker: b
    text: या, ‘स्वर्ग से मिली बुलाहट में सहभागी।’
    reason: lexical_alternative
  - marker: c
    text: या, ‘जिन यीशु को हम अंगीकार करते हैं, उन प्रेरित और महायाजक पर ध्यान दो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὅθεν
  choice: इसलिए
  rationale: यह संयोजक पिछले तर्क, विशेषकर 2:17–18, से निकला निष्कर्ष व्यक्त करता है। ‘इसलिए’ आधुनिक हिन्दी में उसका तार्किक बल स्वाभाविक रूप से बनाए रखता है।
- source_word: ἀδελφοὶ ἅγιοι
  choice: पवित्र भाइयो
  rationale: सम्बोधन का यूनानी रूप पुल्लिंग बहुवचन है। ‘भाइयो’ स्रोत-रूप को बनाए रखता है, जबकि पाद-टिप्पणी स्पष्ट करती है कि सम्बोधन में पूरी विश्वासी संगति, स्त्रियाँ भी, सम्मिलित है। ‘पवित्र’ परमेश्वर के लिए अलग किए गए समुदाय को दर्शाता है।
- source_word: κλήσεως ἐπουρανίου
  choice: स्वर्गीय बुलाहट
  rationale: यह पदबंध बुलाहट के स्वर्गीय स्रोत अथवा स्वरूप—दोनों का संकेत दे सकता है। ‘स्वर्गीय बुलाहट’ इस संक्षिप्तता और सम्भावित व्यापकता को बनाए रखता है।
- source_word: μέτοχοι
  choice: सहभागी
  rationale: यह शब्द किसी वस्तु में हिस्सा रखने या भाग लेने वालों को दर्शाता है। ‘सहभागी’ वर्तमान, गरिमापूर्ण और सहज हिन्दी है।
- source_word: κατανοήσατε
  choice: ध्यान दो
  rationale: आज्ञार्थक क्रिया एकाग्र और विचारपूर्ण ध्यान की माँग करती है। ‘ध्यान दो’ सामान्य पाठक के लिए स्वाभाविक है और केवल क्षणिक देखने के बजाय सचेत मनन का भाव देता है।
- source_word: ἀπόστολον
  choice: प्रेरित
  rationale: यहाँ यह पद यीशु के लिए, परमेश्वर द्वारा भेजे गए व्यक्ति के अर्थ में, विशिष्ट रूप से प्रयुक्त है। स्थापित पद ‘प्रेरित’ उसके धार्मिक और साहित्यिक बल को सुरक्षित रखता है।
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: यह यहूदी उपासना-पद्धति के प्रधान याजकीय पद का मानक हिन्दी रूप है और इब्रानियों का एक प्रमुख विषय भी है।
- source_word: τῆς ὁμολογίας ἡμῶν
  choice: हमारे अंगीकार के
  rationale: ‘अंगीकार’ सार्वजनिक रूप से माने और घोषित किए गए विश्वास का भाव रखता है। सम्बन्धकारक पदबंध को दोनों उपाधियों—‘प्रेरित’ और ‘महायाजक’—से जुड़ा रहने दिया गया है; वैकल्पिक वाक्य-संबंध पाद-टिप्पणी में दिया गया है।
- source_word: Ἰησοῦν
  choice: यीशु
  rationale: व्यक्तिगत नाम Ἰησοῦς का मानक हिन्दी रूप।
theological_decisions:
- issue: ἀδελφοὶ का लिंग-सूचक सम्बोधन
  choice: मुख्य पाठ में ‘भाइयो’, और समावेशी आशय की व्याख्या पाद-टिप्पणी में
  alternative: ‘भाइयो और बहनो’ अथवा ‘भाई-बहनो’
  rationale: यूनानी शब्द व्याकरण की दृष्टि से पुल्लिंग बहुवचन है, पर प्रसंग में पूरी विश्वासी संगति को सम्बोधित करता है। मुख्य पाठ स्रोत-रूप को सुरक्षित रखता है और टिप्पणी उसके सामुदायिक विस्तार को स्पष्ट करती है।
- issue: यीशु के लिए ἀπόστολος का प्रयोग
  choice: ‘प्रेरित’ पद को बनाए रखना
  alternative: ‘भेजे हुए’ अथवा ‘दूत’
  rationale: लेखक स्वयं यीशु पर यह उपाधि लागू करता है। इसे बनाए रखने से पाठ की विशिष्ट धार्मिक और साहित्यिक शक्ति सुरक्षित रहती है, बिना बाद की कलीसियाई पद-व्यवस्था को इसमें आरोपित किए।
- issue: τῆς ὁμολογίας ἡμῶν का वाक्यगत सम्बन्ध
  choice: ‘हमारे अंगीकार के’ को ‘प्रेरित और महायाजक’ से जोड़ना
  alternative: ‘जिन्हें हम अंगीकार करते हैं’ के रूप में यीशु को अंगीकार का विषय मानना
  rationale: यूनानी सम्बन्धकारक दोनों उपाधियों से स्वाभाविक रूप से जुड़ सकता है, पर इसे यीशु को विश्वासियों के अंगीकार का विषय बताते हुए भी समझा जा सकता है। मुख्य पाठ औपचारिक संरचना रखता है और वैकल्पिक समझ पाद-टिप्पणी में दी गई है।
