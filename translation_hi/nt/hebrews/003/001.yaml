  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए सुबोध रखी गई है। ‘बुलाहट’, ‘प्रेरित’, ‘महायाजक’ और ‘अंगीकार’ जैसे स्थापित बाइबलीय पद प्रसंग की धार्मिक सघनता को बनाए रखते हैं; कठिन वाक्यगत सम्भावना को मुख्य पाठ में अत्यधिक सरल करने के बजाय पाद-टिप्पणी से स्पष्ट किया गया है।
