base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/015.yaml
  text: while it is being said[a], “Today, if you hear his voice, do not harden your hearts as in the rebellion.”
translation:
  language: hi
  text: 'जब यह कहा जा रहा है: “आज, यदि तुम उसकी आवाज़ सुनो, तो अपने हृदय कठोर न करो, जैसा विद्रोह[a] के समय।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उकसावे के समय।” यह भजन 95 के उद्धरण में प्रयुक्त शब्द का पारंपरिक वैकल्पिक अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγεσθαι
  choice: जब यह कहा जा रहा है
  rationale: ἐν के साथ वर्तमानकालिक कर्मवाच्य infinitive समय/परिस्थिति बताता है। यह अनुवाद कथन के जारी रहने का भाव रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: Σήμερον
  choice: आज
  rationale: यह सामान्य कालवाचक क्रियाविशेषण है और उद्धरण की तात्कालिकता बनाए रखता है।
- source_word: ἐὰν … ἀκούσητε
  choice: यदि … सुनो
  rationale: ἐὰν और aorist subjunctive की शर्त को हिन्दी में स्वाभाविक ‘यदि … सुनो’ से व्यक्त किया गया है; ‘सुनो’ में केवल ध्वनि ग्रहण करना नहीं, ध्यान देकर मानना भी संदर्भतः निहित रह सकता है।
- source_word: τῆς φωνῆς αὐτοῦ
  choice: उसकी आवाज़
  rationale: सम्बन्धकारक रचना का सीधा और आधुनिक हिन्दी रूप, जो परमेश्वर के व्यक्तिगत संबोधन को बनाए रखता है।
- source_word: Μὴ σκληρύνητε τὰς καρδίας ὑμῶν
  choice: अपने हृदय कठोर न करो
  rationale: निषेध और ‘हृदय’ की बाइबलीय आंतरिक-व्यक्ति संबंधी अर्थवत्ता दोनों सुरक्षित हैं। हिन्दी में सामूहिक श्रोताओं के लिए ‘अपने हृदय’ स्वाभाविक है।
- source_word: ὡς ἐν τῷ παραπικρασμῷ
  choice: जैसा विद्रोह के समय किया था
  rationale: παραπικρασμός जंगल में इस्राएल के परमेश्वर-विरोधी आचरण को सूचित करता है। ‘विद्रोह’ आधुनिक पाठक के लिए नैतिक बल स्पष्ट करता है; ‘किया था’ हिन्दी में तुलना को पूरा करता है, बिना अलग कर्ता या घटना जोड़े।
theological_decisions:
- issue: भजन 95 के उद्धरण में παραπικρασμός का अनुवाद
  choice: विद्रोह
  alternative: परमेश्वर को क्रोध दिलाने का समय / उकसावा
  rationale: शब्द इस्राएल की जंगल की अवज्ञा और उसके द्वारा परमेश्वर को उकसाने—दोनों पहलुओं को समेटता है। मुख्य पाठ में ‘विद्रोह’ आचरण की प्रकृति स्पष्ट करता है, जबकि वैकल्पिक पहलू पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। पद का आरंभ पिछले तर्क से जुड़ी हुई परिस्थितिजन्य रचना है, इसलिए ‘जब यह कहा जा रहा है’ रखा गया है। उद्धरण की तत्क्षणता और चेतावनी का सीधा स्वर सुरक्षित है।
