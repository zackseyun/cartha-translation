  yaml_path: translation/nt/hebrews/003/002.yaml
  text: who was faithful to the one who appointed him[b][a], just as Moses also was in all his house.
translation:
  language: hi
  text: वे उसके प्रति विश्वासयोग्य थे जिसने उन्हें नियुक्त किया था[a], जैसे मूसा भी उसके घर में विश्वासयोग्य थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने उन्हें बनाया।” यूनानी क्रिया का यह शाब्दिक अर्थ हो सकता है, पर यहाँ उसका आशय संभवतः “नियुक्त किया” या “कार्य सौंपा” है।
    reason: lexical_alternative
  - marker: b
    text: कुछ हस्तलिपियों में “उसके सारे घर में” है, जो गिनती 12:7 से निकटता से मेल खाता है। यहाँ “घर” से संभवतः परमेश्वर का घर अभिप्रेत है।
    reason: textual_variant
lexical_decisions:
- source_word: πιστὸν ὄντα
  choice: विश्वासयोग्य थे
  rationale: यह कृदन्तीय पद पद 1 के यीशु का वर्णन जारी रखता है। स्वाभाविक हिन्दी में इसे पूर्ण उपवाक्य के रूप में दिया गया है; यहाँ πιστός का अर्थ भरोसेमंद अथवा निष्ठावान होना है, न कि ‘विश्वास करनेवाला।’
- source_word: τῷ ποιήσαντι αὐτὸν
  choice: उस परमेश्वर के प्रति ... जिसने उन्हें नियुक्त किया
  rationale: ποιέω का मूल अर्थ ‘बनाना/करना’ हो सकता है, पर इस प्रसंग में यीशु के दायित्व और मूसा से तुलना के कारण ‘नियुक्त किया’ अभिप्रेत अर्थ को स्वाभाविक ढंग से व्यक्त करता है। कर्ता को ‘परमेश्वर’ कहने से हिन्दी में वाक्य स्पष्ट होता है, जबकि अगले αὐτοῦ को सर्वनाम ही रखा गया है।
- source_word: ὡς καὶ
  choice: ठीक वैसे ही जैसे ... भी
  rationale: यह रूप यीशु और मूसा की विश्वासयोग्यता के बीच तुलना को सहज आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: यह नाम का प्रचलित मानक हिन्दी रूप है।
- source_word: ἐν τῷ οἴκῳ αὐτοῦ
  choice: उसके घर में
  rationale: दिए गए SBLGNT पाठ में ‘सब/सारे’ के लिए कोई शब्द नहीं है। ‘घर’ आगे के पदों में विकसित रूपक को बनाए रखता है, और ‘उसके’ यूनानी सर्वनाम की अभिव्यक्ति तथा उसके संदर्भ की हल्की अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: पुत्र के संबंध में ποιήσαντι का अर्थ
  choice: नियुक्त किया
  alternative: बनाया
  rationale: ‘बनाया’ शब्दार्थ की दृष्टि से संभव है, पर इस प्रसंग में वह अनावश्यक रूप से पुत्र की सृष्टि किए जाने का अर्थ जता सकता है। यीशु के प्रेषित और महायाजक होने तथा मूसा की सेवकाई से तुलना के संदर्भ में ‘नियुक्त किया’ अधिक उपयुक्त है; वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: αὐτοῦ (‘उसके घर’) का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ को बनाए रखा गया
  alternative: ‘परमेश्वर के घर में’ कहकर संदर्भ स्पष्ट करना
  rationale: गिनती 12:7 की पृष्ठभूमि और प्रसंग परमेश्वर के घर की ओर संकेत करते हैं, फिर भी यूनानी पाठ सर्वनाम का प्रयोग करता है। इसलिए मुख्य पाठ में सर्वनाम रखकर मूल अभिव्यक्ति और उसकी सीमित अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘सारे’ शब्द का पाठांतर
  choice: मुख्य पाठ में ‘सारे’ नहीं रखा गया
  alternative: ‘उसके सारे घर में’
  rationale: प्रदत्त SBLGNT पाठ ἐν τῷ οἴκῳ αὐτοῦ पढ़ता है और उसमें πάντι/ὅλῳ नहीं है। विस्तृत पाठांतर गिनती 12:7 की प्रतिध्वनि को अधिक स्पष्ट करता है, इसलिए उसे पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यीशु और मूसा के लिए आदरसूचक बहुवचन क्रिया ‘थे’ प्रयुक्त हुई है। ‘घराना’ के बजाय ‘घर’ रखा गया है ताकि अगले पदों में घर और उसे बनानेवाले के रूपक का संबंध बना रहे।
