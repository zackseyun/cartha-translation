source:
  edition: SBLGNT
  text: τίνες γὰρ ἀκούσαντες παρεπίκραναν; ἀλλ’ οὐ πάντες οἱ ἐξελθόντες ἐξ Αἰγύπτου διὰ Μωϋσέως;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/016.yaml
  text: For who[a], when they heard, rebelled? Was it not all those who came out of Egypt through Moses?
translation:
  language: hi
  text: क्योंकि वे कौन थे जिन्होंने सुनकर विद्रोह किया[a]? क्या वे सभी नहीं, जो मूसा के द्वारा मिस्र से बाहर निकले थे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उकसाया” अथवा “कड़वाहट दिलाई।” यूनानी क्रिया का अधिक शाब्दिक अनुवाद इस प्रकार हो सकता है, पर यहाँ यह जंगल में इस्राएल के विद्रोह द्वारा परमेश्वर को उकसाने की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνες
  choice: वे कौन थे
  rationale: यह बहुवचन में उन लोगों की पहचान पूछने वाला आलंकारिक प्रश्न है; यह हिंदी में स्वाभाविक रहते हुए उसकी विशिष्टता बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन और स्पष्टीकरण से इस प्रश्न का तार्किक संबंध बनाए रखता है।
- source_word: ἀκούσαντες
  choice: सुनकर
  rationale: भूतकालिक कृदंत को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है तथा सुनने के बाद हुई कार्रवाई का क्रम बनाए रखता है।
- source_word: παρεπίκραναν
  choice: विद्रोह किया
  rationale: जंगल की घटना के संदर्भ में यह परमेश्वर को अपनी अवज्ञा से उकसाने वाले इस्राएल के विद्रोही आचरण को सामान्य पाठक के लिए स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἀλλ’ οὐ πάντες
  choice: क्या वे सभी नहीं
  rationale: आलंकारिक प्रश्न में अपेक्षित सकारात्मक उत्तर को स्वाभाविक हिंदी में व्यक्त करता है; ἀλλά यहाँ प्रश्न के उत्तर की ओर मोड़ लाता है।
- source_word: οἱ ἐξελθόντες ἐξ Αἰγύπτου
  choice: जो ... मिस्र से बाहर निकले थे
  rationale: निर्गमन की घटना और substantival participle दोनों को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: διὰ Μωϋσέως
  choice: मूसा के द्वारा
  rationale: διά के संबंधकारक रूप में माध्यम अथवा प्रतिनिधिक भूमिका को बनाए रखता है, बिना इसे व्याख्यात्मक रूप से ‘मूसा की अगुवाई में’ फैलाए।
theological_decisions:
- issue: जंगल की पीढ़ी के संदर्भ में παραπικραίνω का अर्थ
  choice: विद्रोह किया
  alternative: उकसाया; कटु किया
  rationale: संदर्भ में क्रिया परमेश्वर के विरुद्ध अवज्ञापूर्ण विद्रोह से उसे उकसाने को दर्शाती है। ‘विद्रोह किया’ आधुनिक पाठक को कथात्मक और धर्मवैज्ञानिक बल स्पष्ट करता है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: πάντες के व्यापक कथन का बल
  choice: सभी
  alternative: उनमें से लोग
  rationale: यूनानी पाठ का आलंकारिक और व्यापक कथन ज्यों का त्यों रखा गया है; यहोशू और कालेब जैसे अपवादों के कारण इसे अनुवाद में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। दोनों आलंकारिक प्रश्नों की संरचना और ‘सभी’ से उत्पन्न मूल पाठ का तनाव सुरक्षित रखा गया है।
