id: HEB.3.13
reference: Hebrews 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλὰ παρακαλεῖτε ἑαυτοὺς καθ’ ἑκάστην ἡμέραν, ἄχρις οὗ τὸ Σήμερον καλεῖται, ἵνα μὴ σκληρυνθῇ ⸂τις ἐξ ὑμῶν⸃ ἀπάτῃ τῆς ἁμαρτίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/013.yaml
  text: But encourage one another every day[b][a], as long as it is called “Today,” so that none of you may be hardened by the deceitfulness of sin.
translation:
  language: hi
  text: बल्कि जब तक “आज” कहा जाता है, तब तक हर दिन एक-दूसरे को प्रोत्साहित करते रहो[b][a], ताकि तुममें से कोई भी पाप के छल से कठोर न हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आज” भजन 95 की प्रतिध्वनि है और उस वर्तमान समय की ओर संकेत करता है जिसमें परमेश्वर की पुकार का उत्तर देना आवश्यक है।
    reason: cross_reference
  - marker: b
    text: या “एक-दूसरे को समझाते रहो” अथवा “आग्रह करते रहो।” यूनानी क्रिया संदर्भ के अनुसार प्रोत्साहित करने, समझाने, आग्रह करने या सांत्वना देने का अर्थ रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले पद की चेतावनी के विपरीत अपेक्षित सामुदायिक आचरण को प्रबलता से सामने रखता है।
- source_word: παρακαλεῖτε
  choice: प्रोत्साहित करते रहो
  rationale: वर्तमान काल की निरंतर आज्ञा तथा संदर्भ में उत्साह देने और आग्रह करने—दोनों भावों को सहज आधुनिक हिन्दी में व्यक्त करता है; वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: ἑαυτοὺς
  choice: एक-दूसरे को
  rationale: बहुवचन आज्ञा के साथ आत्मवाचक सर्वनाम यहाँ पारस्परिक अर्थ रखता है।
- source_word: καθ’ ἑκάστην ἡμέραν
  choice: हर दिन
  rationale: प्रतिदिन दोहराई जाने वाली क्रिया को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἄχρις οὗ ... καλεῖται
  choice: जब तक ... कहा जाता है, तब तक
  rationale: उस जारी अवधि और उसकी सीमा दोनों को सुरक्षित रखते हुए यूनानी वाक्य-विन्यास का स्वाभाविक हिन्दी रूप देता है।
- source_word: τὸ Σήμερον
  choice: “आज”
  rationale: उद्धरण-चिह्न भजन 95 की प्रतिध्वनि और शब्द के विषयगत, संज्ञात्मक प्रयोग को दर्शाते हैं।
- source_word: ἵνα μὴ σκληρυνθῇ
  choice: ताकि ... कठोर न हो जाए
  rationale: नकारात्मक उद्देश्य को स्पष्ट करता है और निष्क्रिय रूप के भाव को हिन्दी में स्वाभाविक ढंग से बनाए रखता है।
- source_word: τις ἐξ ὑμῶν
  choice: तुममें से कोई भी
  rationale: μή के साथ अनिश्चित सर्वनाम की चेतावनीपूर्ण व्यापकता को ठीक प्रकार व्यक्त करता है।
- source_word: ἀπάτῃ τῆς ἁμαρτίας
  choice: पाप के छल से
  rationale: सम्बन्धकारक को पाप से संबंधित/उत्पन्न छल और सम्प्रदान कारक को कठोर होने के साधन के रूप में संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पारस्परिक प्रोत्साहन या आत्म-निर्देश
  choice: एक-दूसरे को
  alternative: अपने आप को
  rationale: यूनानी बहुवचन आत्मवाचक सर्वनाम यहाँ पारस्परिक क्रिया बताता है; यह समुदाय के प्रत्येक सदस्य की दूसरों के प्रति जिम्मेदारी को स्पष्ट रखता है।
- issue: “आज” का अर्थ
  choice: भजन 95 से प्रतिध्वनित वर्तमान प्रत्युत्तर का समय
  alternative: साधारण कैलेंडर-दिवस मात्र
  rationale: इब्रानियों 3 के निकट संदर्भ में यह भजन 95 का उद्धरणात्मक विषय है। मुख्य पाठ में उद्धरण-चिह्न और फुटनोट इस संबंध को दिखाते हैं, बिना अवसर की अवधि के बारे में अतिरिक्त धर्मवैज्ञानिक निष्कर्ष थोपे।
- issue: कठोर होने में पाप की भूमिका
  choice: पाप का छल कठोर होने का साधन है
  alternative: पाप को प्रत्यक्ष व्यक्तिगत कर्ता मानना
  rationale: सम्प्रदान कारक का साधनार्थक पाठ सबसे स्वाभाविक है; हिन्दी अनुवाद निष्क्रियता और कारणगत अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामुदायिक संबोधन के लिए सहज ‘तुम’ रूप और गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शब्दावली के साथ रखी गई है। ‘प्रोत्साहित करते रहो’ निरंतर आज्ञा को व्यक्त करता है। फुटनोट-चिह्न मुख्य पाठ में अंग्रेज़ी परामर्श-पाठ के क्रम [b][a] में संबंधित पदांश के बाद दिए गए हैं।
