  text: πᾶς γὰρ οἶκος κατασκευάζεται ὑπό τινος, ὁ ⸀δὲ πάντα κατασκευάσας θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/004.yaml
  text: For every house is built by someone[a], but God is the one who built all things.
translation:
  language: hi
  text: क्योंकि हर घर किसी के द्वारा बनाया जाता है, पर जिसने सब कुछ बनाया, वह परमेश्वर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς
  choice: हर
  rationale: एकवचन οἶκος के साथ πᾶς का वितरणात्मक अर्थ है; आधुनिक हिन्दी में ‘हर घर’ स्वाभाविक और स्पष्ट है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछली बात का आधार या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस तार्किक संबंध को स्पष्ट रखता है।
- source_word: οἶκος
  choice: घर
  rationale: संदर्भ में οἶκος के वास्तविक और रूपकात्मक दोनों प्रयोगों की शब्द-क्रीड़ा है; ‘घर’ ठोस निर्माण-चित्र और व्यापक संकेत दोनों को सुरक्षित रखता है।
- source_word: κατασκευάζεται
  choice: बनाया जाता है
  rationale: वर्तमान कर्मवाच्य रूप किसी कर्ता द्वारा घर बनाए जाने की सामान्य सच्चाई व्यक्त करता है; यह सहज हिन्दी है।
- source_word: ὑπό τινος
  choice: किसी-न-किसी के द्वारा
  rationale: ὑπό कर्ता को और τις अनिश्चित व्यक्ति को सूचित करता है; ‘किसी-न-किसी’ सामान्य सिद्धांत में निहित अनिश्चितता पर स्वाभाविक बल देता है।
- source_word: ὁ δὲ
  choice: पर जिसने ... वह
  rationale: δέ हल्का विरोध अथवा विचार की आगे बढ़त दिखाता है, और substantival participle को हिन्दी की सहसंबंधी रचना ‘जिसने ... वह’ स्वाभाविक रूप से व्यक्त करती है।
- source_word: πάντα
  choice: सब कुछ
  rationale: πάντα व्यापक और समावेशी है; ‘सब कुछ’ हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘सारा ब्रह्मांड’ जैसी व्याख्या नहीं जोड़ता।
- source_word: κατασκευάσας
  choice: बनाया
  rationale: यह कर्तृवाचक aorist participle है; ‘बनाया’ पहले क्रियापद से शब्दगत निरंतरता बनाए रखता है और भवन-रूपक से सृष्टि की व्यापक बात तक जाता है।
- source_word: θεός
  choice: परमेश्वर
  rationale: θεός यहाँ सब कुछ बनाने वाले की स्पष्ट पहचान करता है; हिन्दी बाइबलीय गद्य में ‘परमेश्वर’ गरिमापूर्ण और सर्वमान्य विकल्प है।
theological_decisions:
- issue: अंतिम उपवाक्य में सब कुछ बनाने वाले की परमेश्वर के रूप में पहचान
  choice: जिसने सब कुछ बनाया, वह परमेश्वर है
  alternative: परमेश्वर ने ही सब कुछ बनाया है
  rationale: चुनी हुई रचना यूनानी substantival participle और विधेय θεός की पहचानात्मक संरचना को सुरक्षित रखती है। विकल्प अर्थतः निकट है, पर ‘ही’ ऐसा विशेष बल जोड़ सकता है जो यूनानी में प्रत्यक्ष नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘घर’ और ‘बनाया’ की पुनरावृत्ति मूल तर्क की निर्माण-संबंधी समानता को बनाए रखती है। अंग्रेज़ी परत की footnote ‘Or everything’ अंग्रेज़ी के दो समानार्थी विकल्पों से संबंधित है; हिन्दी में ‘सब कुछ’ स्वयं स्वाभाविक व्यापक अर्थ देता है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं।
