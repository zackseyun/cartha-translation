source:
  edition: SBLGNT
  text: τίσιν δὲ ὤμοσεν μὴ εἰσελεύσεσθαι εἰς τὴν κατάπαυσιν αὐτοῦ εἰ μὴ τοῖς ἀπειθήσασιν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/018.yaml
  text: And to whom did he swear that they would not enter his rest[a], if not to those who disobeyed?
translation:
  language: hi
  text: और परमेश्वर ने किन लोगों के विषय में शपथ खाई कि वे उसके विश्राम में प्रवेश नहीं करेंगे? क्या उन लोगों के विषय में नहीं, जिन्होंने आज्ञा नहीं मानी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आज्ञा नहीं मानी” का अर्थ “आज्ञा मानने से इनकार किया” भी हो सकता है। यहाँ अवज्ञा का अविश्वास से घनिष्ठ संबंध है (देखें 3:19)।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίσιν
  choice: किनके विषय में
  rationale: सम्प्रदान बहुवचन प्रश्नवाचक सर्वनाम व्यक्तियों की ओर संकेत करता है। शपथ के विषय को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘किनके विषय में’ चुना गया है।
- source_word: δὲ
  choice: और
  rationale: यह पिछले पद की प्रश्न-शृंखला को आगे बढ़ाता है; ‘और’ बिना अनावश्यक विरोध जोड़े संबंध बनाए रखता है।
- source_word: ὤμοσεν
  choice: शपथ खाई
  rationale: ὀμνύω के भूतकालिक रूप की गंभीरता और प्रतिज्ञात्मक बल को प्रचलित हिन्दी मुहावरे में व्यक्त करता है। कर्ता संदर्भ से परमेश्वर है, इसलिए स्पष्टता हेतु उसका नाम दिया गया है।
- source_word: μὴ εἰσελεύσεσθαι
  choice: वे ... प्रवेश नहीं करेंगे
  rationale: शपथ की विषय-वस्तु बताने वाले भावी infinitive को हिन्दी में स्वाभाविक परोक्ष कथन के रूप में प्रस्तुत किया गया है।
- source_word: εἰς τὴν κατάπαυσιν αὐτοῦ
  choice: उसके विश्राम में
  rationale: ‘विश्राम’ इब्रानियों में परमेश्वर के विश्राम की प्रमुख विषयगत संज्ञा है; ‘में प्रवेश’ ग्रीक की दिशात्मकता बनाए रखता है।
- source_word: εἰ μὴ
  choice: क्या उन्हीं ... नहीं
  rationale: नकारात्मक आलंकारिक प्रश्न अपेक्षित उत्तर को स्पष्ट करता है और εἰ μή के अपवादात्मक बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τοῖς ἀπειθήσασιν
  choice: जिन्होंने आज्ञा नहीं मानी
  rationale: Aorist participle को पूर्ण क्रिया के रूप में प्रस्तुत किया गया है। यह अवज्ञा को स्पष्ट करता है, पर उसे सीधे ‘अविश्वास’ में नहीं बदलता।
theological_decisions:
- issue: ἀπειθήσασιν में अवज्ञा और अविश्वास का संबंध
  choice: जिन्होंने आज्ञा नहीं मानी
  alternative: जिन्होंने विश्वास नहीं किया
  rationale: इस पद में ἀπειθέω प्रयुक्त है, जबकि अगले पद में अविश्वास की शब्दावली आती है। मुख्य पाठ में दोनों को मिला देने के बजाय शब्दगत भेद और संदर्भगत तनाव सुरक्षित रखा गया है।
- issue: ὤμοσεν के निहित कर्ता की पहचान
  choice: परमेश्वर ने
  alternative: उसने
  rationale: पूर्ववर्ती संदर्भ में शपथ लेने वाला परमेश्वर है। हिन्दी में पद को स्वतंत्र रूप से स्पष्ट और सहज बनाने के लिए निहित कर्ता को स्पष्ट किया गया है, बिना अर्थ में नया तत्व जोड़ने के।
- issue: κατάπαυσις का विषयगत अर्थ
  choice: उसके विश्राम
  alternative: उसके विश्राम-स्थान
  rationale: इब्रानियों 3–4 में यह शब्द केवल किसी भौतिक स्थान तक सीमित नहीं है। ‘विश्राम’ इसकी व्यापक और जानबूझकर खुली धार्मिक अर्थवत्ता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आलंकारिक प्रश्न की शक्ति और ‘विश्राम’ की विषयगत शब्दावली बनाए रखी गई है।
