  yaml_path: translation/nt/hebrews/003/017.yaml
  text: And with whom was he angry for forty years? Was it not with those who sinned[a], whose bodies fell in the wilderness?
translation:
  language: hi
  text: और चालीस वर्ष तक परमेश्वर किन लोगों से क्रोधित रहा? क्या उन्हीं से नहीं जिन्होंने पाप किया, जिनके शव जंगल में गिरे?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσώχθισεν
  choice: क्रोधित रहा
  rationale: यह क्रिया किसी के प्रति क्रोध या रोष रखने का भाव व्यक्त करती है। अवधि के साथ ‘क्रोधित रहा’ स्वाभाविक और अर्थ-संगत है।
- source_word: τεσσεράκοντα ἔτη
  choice: चालीस वर्ष तक
  rationale: यह समयावधि बताने वाला प्रयोग है; हिन्दी में ‘चालीस वर्ष तक’ स्वाभाविक है।
- source_word: ἁμαρτήσασιν
  choice: जिन्होंने पाप किया
  rationale: कृदन्त उन लोगों को उनके पाप करने के आधार पर पहचानता है; यह सीधा और सहज अनुवाद है।
- source_word: κῶλα
  choice: शव
  rationale: शब्द का मूल अर्थ शरीर के अंग हो सकता है, पर इस प्रसंग में यह मरकर गिरे हुए शरीरों को सूचित करता है। ‘शव’ न्याय की गंभीरता और मृत्यु का आशय स्पष्ट रखता है।
- source_word: ἔπεσεν
  choice: पड़े रहे
  rationale: ‘गिरे’ मूल बिंब के अधिक निकट है, पर शवों के लिए हिन्दी में ‘पड़े रहे’ अधिक स्वाभाविक है और जंगल में मृत्यु के परिणाम को व्यक्त करता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: जंगल में
  rationale: यह इस्राएल की जंगल-यात्रा के निर्जन प्रदेश को दर्शाता है; हिन्दी बाइबलीय प्रयोग में ‘जंगल’ सहज और परिचित है।
theological_decisions:
- issue: προσώχθισεν का निहित कर्ता
  choice: परमेश्वर
  alternative: वह
  rationale: आस-पास के प्रसंग में निहित कर्ता परमेश्वर है। हिन्दी में स्पष्टता के लिए नाम देना स्वाभाविक है और प्रसंग में निहित बात को ही व्यक्त करता है।
- issue: κῶλα में मृत्यु और अपमान का भाव
  choice: शव
  alternative: देहें
  rationale: ‘शव’ मृत्यु को स्पष्ट करता और यूनानी शब्द की कठोरता को कुछ हद तक सुरक्षित रखता है; ‘देहें’ अधिक कोमल, पर कम विशिष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; प्रश्नात्मक संरचना और न्याय की गंभीरता सुरक्षित रखी गई है। भाषा साधारण पाठक के लिए स्पष्ट, पर गरिमापूर्ण है।
