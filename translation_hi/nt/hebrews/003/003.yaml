  edition: SBLGNT
  text: πλείονος γὰρ ⸂οὗτος δόξης⸃ παρὰ Μωϋσῆν ἠξίωται καθ’ ὅσον πλείονα τιμὴν ἔχει τοῦ οἴκου ὁ κατασκευάσας αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/003.yaml
  text: For this one has been counted worthy of more glory than Moses, just as the one who built the house has greater honor than the house.
translation:
  language: hi
  text: क्योंकि यह मूसा से जितनी अधिक महिमा के योग्य ठहराया गया है, घर बनानेवाले का आदर भी घर से उतना ही अधिक होता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὗτος
  choice: यह
  rationale: यूनानी संकेतवाचक सर्वनाम का सीधा अनुवाद रखा गया है; संदर्भ में इसका संकेत यीशु की ओर है, पर पद में नाम जोड़कर निहित संदर्भ को स्पष्ट नहीं किया गया।
- source_word: δόξης
  choice: महिमा
  rationale: δόξα के धार्मिक और प्रतिष्ठासूचक अर्थ-क्षेत्र को सुरक्षित रखने वाला प्रचलित हिन्दी शब्द।
- source_word: ἠξίωται
  choice: योग्य समझा गया है
  rationale: 'पूर्णकालीन कर्मवाच्य का भाव सुरक्षित है: उसे अधिक महिमा पाने योग्य ठहराया गया है।'
- source_word: καθ’ ὅσον
  choice: ठीक उसी प्रकार जैसे
  rationale: यहाँ घर और उसके बनानेवाले के तुलनात्मक अनुपात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ κατασκευάσας
  choice: बनानेवाला
  rationale: κατασκευάζω के निर्माण/तैयार करने के अर्थ को संदर्भानुकूल सरल हिन्दी में व्यक्त करता है।
- source_word: τιμὴν
  choice: आदर
  rationale: δόξα से शब्दगत भेद बनाए रखते हुए सम्मान या प्रतिष्ठा का भाव व्यक्त करता है।
- source_word: τοῦ οἴκου
  choice: घर से
  rationale: तुलना के दूसरे पद को स्पष्ट रूप से दोहराया गया है, जिससे हिन्दी में अस्पष्ट सर्वनाम से बचा जा सके।
theological_decisions:
- issue: οὗτος के संदर्भ को स्पष्ट करने के लिए ‘यीशु’ या ‘मसीह’ जोड़ना
  choice: संकेतवाचक ‘यह’ रखा गया
  alternative: ‘यीशु’ या ‘मसीह’
  rationale: मूल पद स्वयं नाम नहीं दोहराता; पूर्ववर्ती संदर्भ पाठक को संकेत समझने देता है। इससे मूल की संदर्भ-निर्भरता बनी रहती है।
- issue: घर बनानेवाले की पहचान
  choice: केवल ‘घर बनानेवाला’ कहा गया
  alternative: उसे इस पद में स्पष्टतः परमेश्वर या मसीह कहना
  rationale: इस उपमा की आगे की व्याख्या अगले पद में विकसित होती है; यहाँ किसी पहचान को समय से पहले निश्चित करना theological tension को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और पाठयोग्य रूप। ‘कहीं अधिक’ πλείονος की तुलनात्मक तीव्रता को स्वाभाविक ढंग से व्यक्त करता है। ‘बनानेवाले’ संयुक्त रूप में रखा गया है।
