id: HEB.3.14
reference: Hebrews 3:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μέτοχοι γὰρ ⸂τοῦ Χριστοῦ γεγόναμεν⸃, ἐάνπερ τὴν ἀρχὴν τῆς ὑποστάσεως μέχρι τέλους βεβαίαν κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/014.yaml
  text: For we have become sharers in the Messiah, if indeed we hold the beginning of our assurance firm to the end.
translation:
  language: hi
  text: क्योंकि हम मसीह के सहभागी हो गए हैं,[a] बशर्ते कि हम अपने आरम्भिक भरोसे को अन्त तक दृढ़ बनाए रखें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मसीह में सहभागी’ अथवा ‘मसीह के भागी’।
    reason: lexical_alternative
  - marker: b
    text: '‘भरोसे’ के लिए प्रयुक्त यूनानी शब्द का अर्थ ‘आश्वस्तता’ भी हो सकता है और कुछ प्रसंगों में ‘आधार’, ‘सार’ या ‘वास्तविकता’। अधिक शाब्दिक रूप: ‘यदि हम भरोसे के आरम्भ को अन्त तक दृढ़ थामे रहें।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: μέτοχοι
  choice: सहभागी
  rationale: यह शब्द किसी व्यक्ति या वस्तु में भाग रखने वालों को दर्शाता है। ‘सहभागी’ आधुनिक, गरिमापूर्ण हिन्दी में सहभागिता का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह संयोजक पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: τοῦ Χριστοῦ
  choice: मसीह के
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक है। सम्बन्धकारक रचना μέτοχοι के साथ सहभागिता का सम्बन्ध खुला रखती है।
- source_word: γεγόναμεν
  choice: हो गए हैं
  rationale: पूर्णकाल भूतकाल में आरम्भ हुई और वर्तमान में बनी हुई अवस्था को व्यक्त करता है; ‘हो गए हैं’ दोनों पक्षों को सुरक्षित रखता है।
- source_word: ἐάνπερ
  choice: बशर्ते कि
  rationale: यह साधारण ‘यदि’ से अधिक बलयुक्त शर्त है। ‘बशर्ते कि’ उस जोर को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν ἀρχὴν τῆς ὑποστάσεως
  choice: अपने आरम्भिक भरोसे को
  rationale: शाब्दिक ‘भरोसे के आरम्भ’ हिन्दी में अस्पष्ट और अस्वाभाविक हो सकता है। ‘आरम्भिक भरोसा’ उस भरोसेमन्द रुख को दर्शाता है जो आरम्भ से था, जबकि ὑπόστασις की अर्थगत जटिलता पादटिप्पणी में सुरक्षित है।
- source_word: μέχρι τέλους
  choice: अन्त तक
  rationale: यह पूरे काल में बने रहने का बोध देता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: βεβαίαν κατάσχωμεν
  choice: दृढ़ बनाए रखें
  rationale: κατέχω थामे रहने या बनाए रखने और βέβαιος दृढ़ता का भाव देता है। संयुक्त अभिव्यक्ति हिन्दी में निरन्तर दृढ़तापूर्वक कायम रहने का अर्थ स्पष्ट करती है।
theological_decisions:
- issue: शर्त और अन्त तक बने रहना
  choice: वास्तविक और बलयुक्त शर्त को ‘बशर्ते कि’ द्वारा बनाए रखा गया है, बिना यह बताए कि दृढ़ता सहभागिता का प्रमाण है या उसकी निरन्तरता की शर्त।
  alternative: ‘यदि सचमुच’ भी ἐάνπερ का बल व्यक्त कर सकता है, पर वह हिन्दी में प्रमाण-जाँच का भाव अधिक उभार सकता है।
  rationale: यूनानी पाठ शर्त प्रस्तुत करता है, पर बाद की धर्मवैज्ञानिक बहसों—जैसे दृढ़ता केवल प्रमाण है या सहभागिता बनाए रखने की शर्त—का स्वयं निर्णायक समाधान नहीं करता।
- issue: मसीह के साथ सहभागिता का सम्बन्ध
  choice: ‘मसीह के सहभागी’
  alternative: ‘मसीह में सहभागी’ या ‘मसीह के साझेदार’
  rationale: सम्बन्धकारक τοῦ Χριστοῦ की व्यापकता सुरक्षित रखी गई है; अनुवाद यह अतिरिक्त रूप से निश्चित नहीं करता कि सहभागिता का आशय केवल आशीषों, समुदाय या किसी विशेष तात्त्विक श्रेणी से है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘सहभागी’, ‘आरम्भिक भरोसा’ और ‘दृढ़ बनाए रखें’ सामान्य पाठक के लिए बोधगम्य हैं; मूल की अर्थगत तथा धर्मवैज्ञानिक अनिर्णीतता पादटिप्पणियों और निर्णयों में सुरक्षित रखी गई है।
