    text: 'कुछ अनुवाद यहाँ विरोधसूचक अर्थ देते हैं: “फिर भी मेरे कार्यों को देखा” या “यद्यपि उन्होंने मेरे कार्यों को देखा।” यूनानी में केवल “और देखा” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὗ
  choice: जहाँ
  rationale: यह संबंधवाचक क्रियाविशेषण पिछले पद में वर्णित निर्जन प्रदेश की ओर संकेत करता है; इसलिए स्थानवाचक अर्थ को बनाए रखा गया है।
- source_word: ἐπείρασαν
  choice: मुझे परखा
  rationale: यहाँ क्रिया परमेश्वर को उकसाने वाले भाव में उसकी परीक्षा लेने को व्यक्त करती है। प्रसंग से स्पष्ट निहित कर्म ‘मुझे’ स्वाभाविक हिन्दी के लिए जोड़ा गया है।
- source_word: οἱ πατέρες ὑμῶν
  choice: तुम्हारे पूर्वजों
  rationale: शाब्दिक ‘तुम्हारे पिताओं’ की अपेक्षा ‘पूर्वजों’ आधुनिक हिन्दी में ऐतिहासिक समुदाय के पुरखों के लिए अधिक स्वाभाविक और स्पष्ट है।
- source_word: ἐν δοκιμασίᾳ
  choice: परीक्षा लेते हुए
  rationale: कठिन पदबंध को रीति या साधन दोनों से जुड़ सकने वाला रखा गया है; मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और वैकल्पिक संरचनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: καὶ εἶδον
  choice: और ... देखा
  rationale: यूनानी में साधारण संयोजक καί है; अतः मुख्य पाठ में ‘फिर भी’ अथवा ‘यद्यपि’ जोड़कर संबंध को व्याख्यायित नहीं किया गया।
- source_word: τὰ ἔργα μου
  choice: मेरे कामों
  rationale: यह परमेश्वर के किए हुए कार्यों को दर्शाता है। ‘काम’ साधारण आधुनिक हिन्दी में स्पष्ट है और मूल के बहुवचन को बनाए रखता है।
theological_decisions:
- issue: परखे जाने वाला कौन है
  choice: मुझे परखा
  alternative: परखा
  rationale: SBLGNT के इस उपवाक्य में कर्म स्पष्ट रूप से लिखा नहीं है, पर भजन 95 के उद्धरण और वक्ता के संदर्भ में परमेश्वर ही निहित कर्म है। ‘मुझे’ जोड़ना हिन्दी में अर्थ स्पष्ट करता है, बिना अतिरिक्त सिद्धान्त थोपे।
- issue: कामों को देखने और परखने का तार्किक संबंध
  choice: और मेरे कामों को देखा
  alternative: फिर भी मेरे कामों को देखा / यद्यपि उन्होंने मेरे काम देखे थे
  rationale: प्रसंग विरोधसूचक अर्थ की अनुमति देता है, पर यूनानी पाठ में केवल καί (‘और’) है। इसलिए मुख्य पाठ वास्तविक अस्पष्टता को बनाए रखता है।
