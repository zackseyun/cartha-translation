  text: जहाँ तुम्हारे पूर्वजों ने परीक्षा में मुझे परखा[a] और मेरे कार्यों को देखा[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परीक्षा के द्वारा मुझे परखा” अथवा “मेरी परीक्षा ली।” यूनानी पदबंध रीति या साधन व्यक्त कर सकता है।
    reason: lexical_alternative
