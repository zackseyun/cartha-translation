lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह पिछले पद के साथ विचार की निरंतरता बनाए रखने वाला सामान्य संयोजक है।
- source_word: Μωϋσῆς μὲν
  choice: मूसा तो
  rationale: ‘तो’ μὲν द्वारा आरंभ किए गए उस अंतर को स्वाभाविक हिंदी में संकेत करता है, जो अगले पद के δέ से पूरा होता है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: यह परमेश्वर की सेवा में मूसा की निष्ठा और भरोसेमंद होने, दोनों भावों को उपयुक्त रूप से व्यक्त करता है।
- source_word: ἐν ὅλῳ τῷ οἴκῳ αὐτοῦ
  choice: उसके सारे घर में
  rationale: यह गिनती 12:7 और इब्रानियों 3 के निकट संदर्भ में चलने वाले ‘घर’ के रूपक को बनाए रखता है और उसे केवल पारिवारिक घराने तक सीमित नहीं करता।
- source_word: ὡς θεράπων
  choice: सेवक के रूप में
  rationale: θεράπων सम्मानपूर्ण सेवा की भूमिका बताता है; ‘सेवक’ स्वाभाविक हिंदी है और δοῦλος के अधिक प्रबल दासत्व-संबंधी अर्थ को यहाँ नहीं लाता।
- source_word: εἰς μαρτύριον
  choice: ताकि ... गवाही दे
  rationale: 'यह उद्देश्य अथवा परिणाम को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है: मूसा की विश्वासयोग्य सेवा आगे कही जाने वाली बातों की गवाही थी।'
- source_word: τῶν λαληθησομένων
  choice: उन बातों ... जो आगे कही जानेवाली थीं
  rationale: भविष्यत् कर्मवाच्य कृदंत का भाव सुरक्षित है; ‘आगे’ मूसा के समय के बाद होने वाले कथन की दिशा को स्पष्ट करता है, बिना यह तय किए कि वे बातें ठीक किस माध्यम से कही गईं।
theological_decisions:
- issue: ‘उसके घर’ का अभिप्राय
  choice: ‘घर’ के बाइबलीय रूपक को बनाए रखा गया है, जिसमें मूसा ने सेवा की।
  alternative: ‘उसका पूरा घराना’
  rationale: निकट संदर्भ और गिनती 12:7 परमेश्वर के लोगों/व्यवस्था के लिए ‘घर’ की छवि विकसित करते हैं। मुख्य पाठ में इसे केवल भौतिक भवन या घरेलू परिवार के रूप में निश्चित नहीं किया गया।
- issue: θεράπων की भूमिका
  choice: सेवक
  alternative: परिचारक; सेवकाई करने वाला
  rationale: यह सम्मानपूर्ण और नियुक्त सेवा का भाव रखता है तथा अगले पद में ‘पुत्र’ के साथ होने वाले अंतर को सुरक्षित रखता है; ‘दास’ कहने से δοῦλος का अधिक प्रबल भाव आ सकता था।
- issue: आगे कही जाने वाली बातों की पहचान
  choice: वाक्य को सामान्य और भविष्याभिमुख रखा गया है।
  alternative: बाद में पुत्र के द्वारा प्रकट की जाने वाली बातें
  rationale: संदर्भ आगे के ईश्वरीय प्रकाशन, विशेषतः पुत्र-केंद्रित प्रकाशन, की ओर संकेत कर सकता है, पर यूनानी वाक्यांश स्वयं वक्ता या माध्यम को स्पष्ट नहीं करता; इसलिए मुख्य पाठ में उसे जोड़ा नहीं गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘मूसा तो’ अगले पद के साथ विरोध-संबंध का संकेत देता है। ‘घर’ रूपक को जानबूझकर अक्षुण्ण रखा गया है, जबकि उद्देश्यसूचक εἰς μαρτύριον को सहज हिंदी के लिए क्रियात्मक रूप ‘ताकि ... गवाही दे’ में व्यक्त किया गया है।
