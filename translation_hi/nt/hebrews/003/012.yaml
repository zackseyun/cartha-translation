  text: βλέπετε, ἀδελφοί, μήποτε ἔσται ἔν τινι ὑμῶν καρδία πονηρὰ ἀπιστίας ἐν τῷ ἀποστῆναι ἀπὸ θεοῦ ζῶντος,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/012.yaml
  text: Watch out[a], brothers[c][b], lest there be in any of you an evil heart of unbelief in turning away from the living God.
translation:
  language: hi
  text: भाइयो[a], सावधान रहो कि तुम में से किसी में अविश्वास से भरा कोई दुष्ट हृदय न हो, जो जीवित परमेश्वर से दूर हट जाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भाइयो’ यूनानी के पुल्लिंग बहुवचन ἀδελφοί का अनुवाद है; यह शब्द यहाँ स्त्री और पुरुष, दोनों विश्वासियों के समुदाय को संबोधित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘जीवित परमेश्वर से विमुख हो जाए’ अथवा ‘जीवित परमेश्वर से मुँह मोड़ ले।’
    reason: alternative_reading
lexical_decisions:
- source_word: βλέπετε
  choice: सावधान रहो
  rationale: वर्तमान काल का बहुवचन आज्ञार्थक रूप लगातार सतर्क रहने की चेतावनी देता है। यह आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: ἀδελφοί
  choice: भाइयो
  rationale: यह पुल्लिंग बहुवचन संबोधन का सीधा हिन्दी रूप है; यूनानी में इसका प्रयोग विश्वासियों के मिश्रित समुदाय को संबोधित करने के लिए भी हो सकता है, जिसे पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: μήποτε ἔσται ἔν τινι ὑμῶν
  choice: कि तुममें से किसी का ... न हो
  rationale: यह किसी भी श्रोता में ऐसी दशा उत्पन्न होने की आशंका और चेतावनी को सहज हिन्दी में व्यक्त करता है।
- source_word: καρδία πονηρὰ ἀπιστίας
  choice: हृदय बुरा और अविश्वास से भरा
  rationale: ‘हृदय’ व्यक्ति के विचार, इच्छा और भावनाओं के भीतरी केंद्र का बाइबलीय रूपक बनाए रखता है। ‘अविश्वास से भरा’ संबंधकारक ἀπιστίας को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν τῷ ἀποστῆναι
  choice: और ... मुँह न मोड़ ले
  rationale: हिन्दी में समन्वित चेतावनी के रूप में यह वाक्य स्वाभाविक है और परमेश्वर से हटने की गंभीरता व्यक्त करता है, बिना इसे बाद की तकनीकी धर्मवैज्ञानिक शब्दावली से बाँधे।
- source_word: ἀπὸ θεοῦ ζῶντος
  choice: जीवित परमेश्वर से
  rationale: यह निश्चित अर्थ वाले बाइबलीय पदबंध ‘जीवित परमेश्वर’ को सुरक्षित रखता है।
theological_decisions:
- issue: ἀπιστίας का अर्थ ‘अविश्वास’ हो या ‘विश्वासघात/अविश्वसनीयता’
  choice: अविश्वास से भरा
  alternative: विश्वासहीन
  rationale: इब्रानियों 3 के निकट प्रसंग में परमेश्वर की वाणी पर विश्वास न करने पर बल है; फिर भी पाद-टिप्पणी नैतिक अविश्वस्तता की संभावित छाया को खुला रखती है।
- issue: ἀποστῆναι को सामान्य ‘दूर होना/मुँह मोड़ना’ या तकनीकी ‘धर्मत्याग करना’ कहना
  choice: मुँह न मोड़ ले
  alternative: दूर न हो जाए / विमुख न हो जाए
  rationale: मूल क्रिया हटने, अलग होने या दूर चले जाने का अर्थ दे सकती है। चुना हुआ रूप चेतावनी की गंभीरता बनाए रखता है, पर किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को पाठ में आरोपित नहीं करता।
- issue: ἐν τῷ ἀποστῆναι का परिस्थिति, परिणाम या अभिव्यक्ति से संबंध
  choice: और वह ... मुँह न मोड़ ले
  alternative: जिससे वह ... दूर हो जाए
  rationale: यूनानी रचना का संबंध कुछ खुला है। हिन्दी में ‘और’ दोनों चेतावनियों को निकट जोड़ता है, पर स्पष्ट कारण-परिणाम संबंध थोपने से बचता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हृदय’ की बाइबलीय छवि सुरक्षित है; ‘मुँह मोड़ना’ स्पष्ट और स्वाभाविक है, जबकि तकनीकी ‘धर्मत्याग’ को मुख्य पाठ में नहीं लाया गया।
