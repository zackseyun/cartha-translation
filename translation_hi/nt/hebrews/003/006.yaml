  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Χριστὸς δὲ ὡς υἱὸς ἐπὶ τὸν οἶκον αὐτοῦ· ⸀ὃς οἶκός ἐσμεν ἡμεῖς, ⸀ἐὰν τὴν παρρησίαν καὶ τὸ καύχημα τῆς ⸀ἐλπίδος κατάσχωμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/006.yaml
  text: But the Messiah was faithful as a Son over his house[a], whose house we are[c][b], if we hold fast our boldness and the boast of our hope.
translation:
  language: hi
  text: परन्तु मसीह उसके घर पर पुत्र के रूप में हैं, जिसका घर हम हैं, यदि हम अपने साहस और अपनी आशा का गर्व दृढ़ता से थामे रहें।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मसीह’ के स्थान पर ‘ख्रीष्ट’ भी सम्भव है। यूनानी Χριστός यहाँ उपाधि (‘मसीह’) या नाम-सदृश पद (‘ख्रीष्ट’) के रूप में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: ‘साहस’ के स्थान पर ‘निडर भरोसा’ भी सम्भव है। यूनानी παρρησία खुलेपन, स्पष्टवादिता या भरोसे से भरे साहस का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘आशा का गर्व’ का अनुवाद ‘आशा से मिलने वाला भरोसा’ या ‘आशा का उल्लास’ भी किया जा सकता है। यूनानी καύχημα का अर्थ ‘गर्व’, ‘गर्व करने का आधार’ या ‘उल्लासपूर्ण भरोसा’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Χριστὸς
  choice: मसीह
  rationale: सन्दर्भ में यह उपाधि के रूप में प्रयुक्त है और मूसा के साथ तुलना में परमेश्वर के अभिषिक्त जन की ओर संकेत करती है।
- source_word: δὲ
  choice: परन्तु
  rationale: पद 5 में मूसा की सेवक के रूप में भूमिका और यहाँ पुत्र की भूमिका के बीच विरोध दर्शाता है।
- source_word: ὡς υἱὸς
  choice: पुत्र के रूप में
  rationale: ὡς की तुलनात्मक भूमिका को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ τὸν οἶκον αὐτοῦ
  choice: उसके घराने पर
  rationale: ἐπί यहाँ अधिकार और देखरेख का भाव देता है; 'घराना' परमेश्वर के लोगों की सामुदायिक उपमा को स्पष्ट रखता है, जबकि 'उसके' के सन्दर्भ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ὃς οἶκός ἐσμεν ἡμεῖς
  choice: और उसका घराना हम हैं
  rationale: सम्बन्धवाचक वाक्य को सहज आधुनिक हिन्दी में प्रस्तुत करते हुए घराने की उपमा बनाए रखता है।
- source_word: ἐὰν
  choice: यदि
  rationale: वास्तविक शर्त को बिना किसी धर्मसैद्धान्तिक निष्कर्ष को आरोपित किए सीधे व्यक्त करता है।
- source_word: παρρησίαν
  choice: साहस
  rationale: यहाँ खुले, निडर और भरोसेपूर्ण दृढ़भाव का अर्थ देता है; वैकल्पिक 'निडर भरोसा' पादटिप्पणी में दिया गया है।
- source_word: καύχημα
  choice: गर्व
  rationale: उस बात को दर्शाता है जिस पर कोई गर्व या उल्लास करता है; इसे केवल 'भरोसा' बनाकर समतल नहीं किया गया।
- source_word: τῆς ἐλπίδος
  choice: अपनी आशा पर
  rationale: प्रथम पुरुष बहुवचन सन्दर्भ में निहित सम्बन्ध को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; सम्बन्धकारक को यहाँ गर्व के आधार के रूप में प्रस्तुत किया गया है।
- source_word: κατάσχωμεν
  choice: दृढ़ता से थामे रहें
  rationale: लगातार दृढ़ बने रहने और न छोड़ने के आग्रहपूर्ण भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: Χριστός को उपाधि या नाम-सदृश रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीष्ट
  rationale: मूसा और पुत्र की तुलना में उपाधिगत अर्थ सक्रिय है; हिन्दी में 'मसीह' इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- issue: ἐὰν ... κατάσχωμεν की शर्त का बल
  choice: यदि हम ... दृढ़ता से थामे रहें
  alternative: बशर्ते कि हम ... दृढ़ता से थामे रहें
  rationale: '''यदि'' यूनानी की वास्तविक शर्त और उससे जुड़ी धर्मवैचारिक तनातनी को सुरक्षित रखता है, पर उद्धार, धीरज या धर्मत्याग की किसी विशिष्ट व्याख्या को आरोपित नहीं करता।'
- issue: αὐτοῦ में घराने का सम्बन्ध
  choice: उसके घराने
  alternative: परमेश्वर के घराने / मसीह के घराने
  rationale: सर्वनाम को बनाए रखने से तत्काल सन्दर्भ की सम्भावित सम्बन्धगत अस्पष्टता सुरक्षित रहती है और अनुवाद किसी एक धर्मवैचारिक निष्कर्ष को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सामान्य पाठकों के लिए सुबोध रूप। 'घराने' से οἶκος की सामुदायिक उपमा स्पष्ट होती है। पादटिप्पणी-चिह्न सम्बन्धित पदों के बाद क्रमशः लगाए गए हैं।
