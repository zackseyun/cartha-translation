  text: μὴ σκληρύνητε τὰς καρδίας ὑμῶν ὡς ἐν τῷ παραπικρασμῷ, κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ ἐν τῇ ἐρήμῳ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/008.yaml
  text: do not harden your hearts as in the rebellion[a], as on the day of testing in the wilderness,
translation:
  language: hi
  text: अपने हृदयों को कठोर न करो, जैसा विद्रोह के समय[a] हुआ था, और जैसा जंगल में परीक्षा के दिन हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, भजन 95:8 में निहित इब्रानी स्थान-नामों के अनुसार, “जैसा मरीबा में हुआ था, और जैसा जंगल में मस्सा के दिन हुआ था।”
    reason: alternative_reading
lexical_decisions:
- source_word: μὴ σκληρύνητε
  choice: कठोर न करो
  rationale: μή के साथ एओरिस्ट सक्रिय सब्जंक्टिव सीधी मनाही व्यक्त करता है। सक्रिय रूप सुनने वालों की उत्तरदायी प्रतिक्रिया को बनाए रखता है।
- source_word: τὰς καρδίας ὑμῶν
  choice: अपने हृदयों को
  rationale: καρδίας भीतरी व्यक्ति—इच्छा, विचार और प्रवृत्ति—का बाइबलीय पद है; ὑμῶν बहुवचन समुदाय को सीधे संबोधित करता है। हिंदी में ‘अपने’ स्वाभाविक रूप से इसी संबंध को व्यक्त करता है।
- source_word: ὡς
  choice: जैसा ... किया था
  rationale: यह इस्राएल के पिछले आचरण से तुलना कराता है। हिंदी में क्रिया की पूर्ति करने से तुलना स्पष्ट और स्वाभाविक रहती है।
- source_word: ἐν τῷ παραπικρασμῷ
  choice: विद्रोह के समय
  rationale: παραπικρασμός उकसावे या विद्रोह को दर्शाता है। यहाँ भजन 95 के प्रसंग में परमेश्वर के विरुद्ध इस्राएल का विद्रोही आचरण अभिप्रेत है; ‘विद्रोह’ आधुनिक हिंदी में नैतिक बल स्पष्ट रखता है।
- source_word: κατὰ τὴν ἡμέραν τοῦ πειρασμοῦ
  choice: जैसा ... परीक्षा के दिन
  rationale: κατά तुलना/अनुरूपता का भाव बनाए रखता है और τοῦ πειρασμοῦ ऐतिहासिक परीक्षा की घटना को सूचित करता है। ‘परीक्षा’ यहाँ प्रलोभन की अपेक्षा परखने की घटना के अधिक निकट है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: जंगल में
  rationale: ἔρημος इस्राएल के निर्जन प्रदेश में भटकने के बाइबलीय प्रसंग को दर्शाता है। ‘जंगल’ सामान्य हिंदी बाइबल-प्रयोग में इस अर्थ को सहजता से व्यक्त करता है, केवल रेतीले भूभाग तक सीमित नहीं करता।
theological_decisions:
- issue: भजन 95 के ऐतिहासिक संकेत का अनुवाद
  choice: यूनानी घटना-संज्ञाओं को ‘विद्रोह’ और ‘परीक्षा के दिन’ के रूप में वर्णनात्मक ढंग से अनूदित करना
  alternative: ‘मरीबा के समान, जंगल में मस्सा के दिन के समान’
  rationale: इब्रानियों में उद्धृत यूनानी पाठ हिब्रू स्थान-नामों के स्थान पर अर्थसूचक संज्ञाएँ देता है। मूल-भाषा प्रधानता के अनुसार मुख्य पाठ यूनानी रूप का अनुसरण करता है, जबकि महत्वपूर्ण हिब्रू पृष्ठभूमि पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक प्रत्यक्ष संबोधन वाली रखी गई है। ‘हृदय’ का बाइबलीय मानवीय अर्थ तथा यूनानी पाठ की दोनों तुलनात्मक संरचनाएँ सुरक्षित हैं।
