lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले तर्क से वाक्य का स्वाभाविक संबंध बनाए रखता है और यूनानी पाठ से अधिक निष्कर्षात्मक बल नहीं जोड़ता।
- source_word: βλέπομεν
  choice: हम देखते हैं
  rationale: वर्तमानकालीन प्रथम पुरुष बहुवचन क्रिया का सीधा और स्वाभाविक अनुवाद है; यह लेखक के निष्कर्ष को सजीव और प्रत्यक्ष रखता है।
- source_word: ὅτι
  choice: कि
  rationale: यह उस बात का परिचय देता है जिसे लेखक और पाठक देखते हैं तथा हिन्दी में उपवाक्य-संबंध को स्पष्ट करता है।
- source_word: οὐκ ἠδυνήθησαν
  choice: वे ... नहीं कर सके
  rationale: यह δύναμαι में व्यक्त असमर्थता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰσελθεῖν
  choice: प्रवेश
  rationale: संदर्भ में यह प्रतिज्ञात देश/विश्राम में प्रवेश करने को सूचित करता है; 'प्रवेश करना' सटीक और गरिमापूर्ण है।
- source_word: δι’
  choice: के कारण
  rationale: यहाँ διά के साथ कर्मकारक कारण या वजह व्यक्त करता है।
- source_word: ἀπιστίαν
  choice: अविश्वास
  rationale: संदर्भ इस्राएल द्वारा परमेश्वर की प्रतिज्ञा पर विश्वास और भरोसा न करने पर बल देता है। 'अविश्वास' इसका स्पष्ट मुख्य-पाठीय रूप है, जबकि विश्वासघाती भरोसा-न-करने का भाव पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: πίστις से संबंधित विवादित पद ἀπιστία का अनुवाद
  choice: अविश्वास
  alternative: विश्वासहीनता
  rationale: इब्रानियों 3 के निकट संदर्भ में परमेश्वर की बात और प्रतिज्ञा पर विश्वास न करना प्रमुख है, इसलिए 'अविश्वास' सबसे स्पष्ट है। फिर भी ἀπιστία में भरोसा करने से इनकार और विश्वासयोग्यता का अभाव भी निहित हो सकता है; इसे पादटिप्पणी में रखा गया है ताकि अर्थगत और धर्मवैचारिक तनाव बना रहे।
