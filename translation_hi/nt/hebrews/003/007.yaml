translation:
  language: hi
  text: 'इसलिए, जैसा कि पवित्र आत्मा कहता है:


    “आज यदि तुम उसकी आवाज़ सुनो,”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διό
  choice: इसलिए
  rationale: यह निष्कर्षसूचक संयोजक पिछले तर्क से इस कथन को जोड़ता है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: καθὼς
  choice: जैसा
  rationale: यह उद्धरण को तुलना-सूचक ढंग से प्रस्तुत करता है; ‘जैसा’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: λέγει
  choice: कहता है
  rationale: वर्तमान काल को बनाए रखते हुए यह पवित्रशास्त्र में आत्मा की जीवंत, वर्तमान वाणी को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह निश्चित यूनानी पदबंध का मानक और सटीक हिन्दी रूप है; मूल में निहित न होने वाला कोई अतिरिक्त बल नहीं जोड़ा गया।
- source_word: Σήμερον
  choice: आज
  rationale: भजन के उद्धरण में प्रयुक्त कालवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἐὰν
  choice: यदि
  rationale: यह शर्त आरम्भ करने वाले कण का सीधा, गरिमापूर्ण और स्पष्ट हिन्दी रूप है।
- source_word: τῆς φωνῆς αὐτοῦ
  choice: उसकी आवाज़
  rationale: ἀκούω के साथ संबंधकारक को हिन्दी में स्वाभाविक रूप से ‘उसकी आवाज़ सुनो’ कहा जाता है; इससे वाणी का व्यक्तिगत भाव बना रहता है।
- source_word: ἀκούσητε
  choice: तुम ... सुनो
  rationale: ἐὰν के साथ आए अनिश्चित भूतकालीन संभावनार्थक रूप को शर्तवाचक हिन्दी में ‘यदि तुम ... सुनो’ स्वाभाविक रूप से व्यक्त करता है और ‘ध्यान मानो’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: भजन के उद्धरण का वक्ता
  choice: उद्धरण को सीधे पवित्र आत्मा की वाणी बताया गया है।
  alternative: पवित्र आत्मा पवित्रशास्त्र अथवा भजनकार के माध्यम से बोलता है।
  rationale: यूनानी पाठ स्पष्ट रूप से ‘पवित्र आत्मा कहता है’ कहता है। अनुवाद इस प्रत्यक्ष आरोपण को बनाए रखता है, पर प्रेरणा के सिद्धान्त की कोई अतिरिक्त व्याख्या पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘आवाज़’ सामान्य पाठक के लिए ‘वाणी’ से अधिक सहज है, जबकि व्यक्तिगत संबोधन का भाव बनाए रखती है। पद अगले पद में जारी रहने वाली शर्त के कारण अल्पविराम पर समाप्त होता है।
