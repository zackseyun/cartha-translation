  text: τεσσεράκοντα ἔτη· διὸ προσώχθισα τῇ γενεᾷ ⸀ταύτῃ καὶ εἶπον· Ἀεὶ πλανῶνται τῇ καρδίᾳ· αὐτοὶ δὲ οὐκ ἔγνωσαν τὰς ὁδούς μου·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/003/010.yaml
  text: For forty years[a], therefore, I was provoked with this generation, and said, ‘They always go astray in their hearts[b], but they have not known my ways.’
translation:
  language: hi
  text: इसलिए मैं चालीस वर्षों तक इस पीढ़ी से अत्यन्त अप्रसन्न रहा[a] और मैंने कहा, “वे सदा अपने मन में भटकते रहते हैं[b], पर उन्होंने मेरे मार्गों को नहीं जाना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस पीढ़ी से क्रोधित रहा”; यूनानी क्रिया प्रबल अप्रसन्नता, यहाँ तक कि वितृष्णा, का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “मन” एकवचन है; संभवतः पूरी पीढ़ी को एक सामूहिक इकाई के रूप में देखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τεσσεράκοντα ἔτη
  choice: चालीस वर्ष तक
  rationale: समय की अवधि बताने वाले कर्मकारक को स्वाभाविक हिन्दी में ‘तक’ से व्यक्त किया गया है। वाक्य के आरम्भ में इसका स्थान यूनानी पाठ के क्रम और पूर्ववर्ती संदर्भ से इसके संबंध को बनाए रखता है।
- source_word: διὸ
  choice: इसलिए
  rationale: यह पूर्ववर्ती बात से निकलने वाला परिणाम दर्शाता है; ‘इसलिए’ औपचारिक संबंध को स्पष्ट और सहज रखता है।
- source_word: προσώχθισα
  choice: मैं ... से क्रोधित रहा
  rationale: क्रिया गहरी अप्रसन्नता और वितृष्णा तक का भाव व्यक्त कर सकती है। ‘क्रोधित रहा’ इस तीव्र दैवी अप्रसन्नता को सामान्य हिन्दी में व्यक्त करता है, बिना इसे अनिवार्य रूप से ‘घृणा’ तक सीमित किए।
- source_word: τῇ γενεᾷ ταύτῃ
  choice: इस पीढ़ी से
  rationale: सम्बन्धवाचक चतुर्थी को हिन्दी में ‘से’ के साथ स्वाभाविक रूप दिया गया है और ‘इस पीढ़ी’ का ठोस सामूहिक संदर्भ सुरक्षित रखा गया है।
- source_word: καὶ εἶπον
  choice: और मैंने कहा
  rationale: प्रथम पुरुष कर्ता को हिन्दी में स्पष्ट करना सहज है और प्रत्यक्ष कथन की भूमिका को स्पष्ट रखता है।
- source_word: Ἀεὶ πλανῶνται
  choice: सदा भटकते रहते हैं
  rationale: ‘सदा’ निरंतर दोहराए जाने वाले ढर्रे को और ‘भटकते रहते हैं’ चलती हुई नैतिक-आत्मिक पथभ्रष्टता को व्यक्त करता है।
- source_word: τῇ καρδίᾳ
  choice: अपने मन में
  rationale: καρδία यहाँ केवल भावना नहीं, बल्कि आंतरिक विचार, इच्छा और अभिमुखता का केंद्र है; आधुनिक हिन्दी में ‘मन’ इस अर्थ को सहजता से व्यक्त करता है। एकवचन रूप यूनानी के सामूहिक एकवचन के अनुरूप है।
- source_word: αὐτοὶ δὲ
  choice: पर इन्होंने
  rationale: δέ का विरोधसूचक बल ‘पर’ से व्यक्त किया गया है। ‘इन्होंने’ निकट उल्लिखित पीढ़ी की ओर संकेत करता है और αὐτοί के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐκ ἔγνωσαν
  choice: नहीं जाना
  rationale: ‘जाना’ केवल बौद्धिक समझ के बजाय अनुभवात्मक और संबंधपरक पहचान की संभावना को खुला रखता है; भूतकाल उद्धृत निर्णय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰς ὁδούς μου
  choice: मेरे मार्गों
  rationale: यह परमेश्वर के कार्य करने के ढंग और उसके बताए जीवन-पथ, दोनों को समेटने वाला स्थापित बाइबिलीय रूपक है।
theological_decisions:
- issue: προσώχθισα में दैवी अप्रसन्नता की तीव्रता
  choice: क्रोधित रहा
  alternative: अत्यन्त अप्रसन्न रहा; घृणा की
  rationale: पाठ परमेश्वर की वास्तविक और तीव्र वाचा-संबंधी अप्रसन्नता बताता है। ‘क्रोधित रहा’ उस बल को सुरक्षित रखता है, पर ‘घृणा’ चुनकर अर्थ को अधिक तीव्र दिशा में स्थिर नहीं करता।
- issue: τῇ καρδίᾳ का सामूहिक एकवचन
  choice: अपने मन में
  alternative: अपने मनों में; अपने हृदयों में
  rationale: यूनानी एकवचन संभवतः पूरी पीढ़ी को सामूहिक रूप में देखता है। हिन्दी का ‘अपने मन में’ बहुवचन कर्ता के साथ भी स्वाभाविक है और अनावश्यक व्यक्तिकरण से बचता है।
- issue: οὐκ ἔγνωσαν में ज्ञान का स्वरूप
  choice: मेरे मार्गों को नहीं जाना
  alternative: मेरे मार्गों को नहीं समझा; मेरे मार्गों को पहचान न सके
  rationale: ‘जाना’ बौद्धिक समझ और संबंधपरक/अनुभवात्मक परिचय के बीच की मूल अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मन’ सामान्य पाठक के लिए ‘हृदय’ से अधिक सहज है और यहाँ आंतरिक विचार-इच्छा के व्यापक अर्थ को वहन करता है। आरम्भिक अर्धविराम यूनानी में ‘चालीस वर्ष’ के बाद आए विराम और अगले निष्कर्षसूचक खंड के संबंध को दिखाता है।
