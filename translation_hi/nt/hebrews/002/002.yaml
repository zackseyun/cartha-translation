  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है। ‘संदेश’, ‘अटल सिद्ध हुआ’, ‘अपराध’, ‘अवज्ञा’ और ‘न्यायोचित दंड’ सामान्य पाठक के लिए स्पष्ट रहते हुए मूल के विधिक और धार्मिक भार को बनाए रखते हैं।
