lexical_decisions:
- source_word: ὁ δι’ ἀγγέλων λαληθεὶς λόγος
  choice: स्वर्गदूतों के द्वारा कहा गया संदेश
  rationale: ‘संदेश’ यहाँ संप्रेषित ईश्वरीय वचन का स्वाभाविक हिन्दी रूप है। ‘के द्वारा’ διά के माध्यम/अभिकरण के भाव को सुरक्षित रखता है, और ‘कहा गया’ λαληθείς का सीधा रूप है।
- source_word: ἀγγέλων
  choice: स्वर्गदूतों
  rationale: इब्रानियों 2 के प्रसंग में संकेत मनुष्य-दूतों की नहीं, व्यवस्था की मध्यस्थता से जुड़ी यहूदी परंपरा के स्वर्गीय दूतों की ओर है।
- source_word: ἐγένετο βέβαιος
  choice: अटल सिद्ध हुआ
  rationale: यह अभिव्यक्ति संदेश के दृढ़, मान्य और प्रभावी ठहरने का परिणामसूचक भाव देती है; ‘अटल सिद्ध हुआ’ केवल सत्यापन तक सीमित हुए बिना इसे व्यक्त करता है।
- source_word: πᾶσα παράβασις
  choice: हर अपराध
  rationale: παράβασις किसी निर्धारित सीमा या आज्ञा का उल्लंघन है। ‘अपराध’ साधारण पाठक के लिए स्वाभाविक है और यहाँ के विधिक-नैतिक भार को बनाए रखता है।
- source_word: παρακοὴ
  choice: अवज्ञा
  rationale: शब्द में न सुनने या ध्यान न देने से उपजी आज्ञा न मानने की धारणा है; ‘अवज्ञा’ इस नैतिक भाव को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: ἔλαβεν
  choice: मिला
  rationale: यूनानी में प्रत्येक अपराध और अवज्ञा को प्रतिफल मिलने की रचना है; हिन्दी में ‘दंड मिला’ इस न्यायिक कथन का स्वाभाविक रूप है।
- source_word: ἔνδικον μισθαποδοσίαν
  choice: न्यायोचित दंड
  rationale: μισθαποδοσία प्रतिफल या बदला चुकाए जाने का और ἔνδικος उसके उचित अथवा न्यायसंगत होने का भाव देता है। इस संदर्भ में ‘न्यायोचित दंड’ सहज हिन्दी में न्यायिक आशय व्यक्त करता है।
theological_decisions:
- issue: ‘स्वर्गदूतों के द्वारा कहा गया संदेश’ की पहचान
  choice: मुख्य पाठ में इसे व्यवस्था न कहकर मूल की सामान्य अभिव्यक्ति बनाए रखी गई है; पादटिप्पणी में संभावित संकेत बताया गया है।
  alternative: इसे सीधे ‘स्वर्गदूतों के द्वारा दी गई व्यवस्था’ कहना।
  rationale: प्रसंग और यहूदी परंपरा सीनै की व्यवस्था की ओर दृढ़ संकेत करते हैं, पर यूनानी पाठ स्वयं केवल ‘संदेश’ कहता है। इसलिए मुख्य पाठ में पहचान को स्पष्ट करके मूल की संभावित व्यापकता समाप्त नहीं की गई।
