  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध। 'अधीन' की पुनरावृत्ति जानबूझकर रखी गई है ताकि यूनानी ὑποτάσσω शब्द-समूह और पद का तर्क स्पष्ट रहे।
