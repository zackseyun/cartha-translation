source:
  edition: SBLGNT
  text: πάντα ὑπέταξας ὑποκάτω τῶν ποδῶν αὐτοῦ· ἐν ⸂τῷ γὰρ⸃ ⸀ὑποτάξαι τὰ πάντα οὐδὲν ἀφῆκεν αὐτῷ ἀνυπότακτον. νῦν δὲ οὔπω ὁρῶμεν αὐτῷ τὰ πάντα ὑποτεταγμένα·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/008.yaml
  text: You subjected all things under his feet.” For in subjecting all things to him[a], he left nothing not subjected to him[b]. But now we do not yet see all things subjected to him.
translation:
  language: hi
  text: “आपने सब कुछ उसके[a] पैरों के नीचे कर दिया।” क्योंकि सब कुछ उसके अधीन करने में उसने कुछ भी ऐसा नहीं छोड़ा जो उसके अधीन न हो[b]। पर अब तक हम यह नहीं देखते कि सब कुछ उसके अधीन हो चुका है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके’ और ‘उसे’ सर्वनाम भजन 8 की प्रतिध्वनि करते हैं। भजन के मूल प्रसंग में इनका संकेत मानवता की ओर हो सकता है, और इब्रानियों में इनके प्रयोग का चरम अनुप्रयोग यीशु पर है।
    reason: cross_reference
  - marker: b
    text: या, “क्योंकि जब उसने सब कुछ उसके अधीन किया।” यूनानी रचना का अर्थ कालगत रूप में भी लिया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और कथन की सार्वभौमिकता बनाए रखता है।
- source_word: ὑπέταξας
  choice: आपने ... अधीन कर दिया
  rationale: भजन 8 के उद्धरण में द्वितीय पुरुष एकवचन और अधीनता के अर्थ-क्षेत्र को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὑποκάτω τῶν ποδῶν αὐτοῦ
  choice: उसके पैरों के नीचे
  rationale: अधिकार और अधीनता का शास्त्रीय मुहावरा तथा भजन 8 की प्रतिध्वनि बनाए रखता है।
- source_word: ἐν τῷ ... ὑποτάξαι
  choice: '... अधीन करने में'
  rationale: सव्ययी क्रियार्थक रचना की वैचारिक/परिस्थितिजन्य अस्पष्टता को बनाए रखता है; कालगत अनुवाद को पादटिप्पणी में दिया गया है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पूर्ववर्ती उद्धरण की व्याख्या आरम्भ करने वाले तर्क-संबंध को सहज हिन्दी में दर्शाता है।
- source_word: οὐδὲν ἀφῆκεν ... ἀνυπότακτον
  choice: उसने कुछ भी ऐसा नहीं छोड़ा जो उसके अधीन न हो
  rationale: पूर्ण व्यापकता के दावे को स्पष्ट करता है और ὑποτάσσω शब्द-समूह की पुनरावृत्ति को 'अधीन' द्वारा बनाए रखता है।
- source_word: νῦν δὲ
  choice: पर अब तक
  rationale: घोषित अधीनता और वर्तमान अनुभव के बीच विरोध को οὔπω के साथ प्रवाही हिन्दी में व्यक्त करता है।
- source_word: οὔπω ὁρῶμεν
  choice: अब तक हम ... नहीं देखते
  rationale: वर्तमान में अभी पूर्णता दिखाई न देने की स्थिति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ὑποτεταγμένα
  choice: अधीन हुआ
  rationale: पूर्ण कर्मवाच्य कृदंत के परिणामस्वरूप बनी अवस्था को व्यक्त करता है और पद में प्रयुक्त समान यूनानी शब्द-मूल को लगातार 'अधीन' से दर्शाता है।
theological_decisions:
- issue: αὐτοῦ / αὐτῷ सर्वनामों का संकेत
  choice: '''उसके/उसके अधीन'' रखकर संकेत को अनिर्दिष्ट रखा गया'
  alternative: सर्वनामों को स्पष्ट करके 'मनुष्यजाति' अथवा 'यीशु' कहना
  rationale: भजन 8 के मूल प्रसंग में संकेत मानवता की ओर हो सकता है, जबकि इब्रानियों का तर्क इसे यीशु पर चरम रूप से लागू करता है। मूल सर्वनाम बनाए रखने से यह जानबूझकर उपस्थित धर्मवैचारिक तनाव सुरक्षित रहता है।
