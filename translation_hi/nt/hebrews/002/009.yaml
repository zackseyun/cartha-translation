reference: Hebrews 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τὸν δὲ βραχύ τι παρ’ ἀγγέλους ἠλαττωμένον βλέπομεν Ἰησοῦν διὰ τὸ πάθημα τοῦ θανάτου δόξῃ καὶ τιμῇ ἐστεφανωμένον, ὅπως ⸀χωρὶς θεοῦ ὑπὲρ παντὸς γεύσηται θανάτου.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/009.yaml
  text: But we see Jesus[a], who was made lower than the angels for a little while, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone.
translation:
  language: hi
  text: पर हम यीशु को देखते हैं, जिन्हें कुछ समय के लिए स्वर्गदूतों से नीचा किया गया था। मृत्यु की पीड़ा के कारण उन्हें महिमा और आदर से मुकुट पहनाया गया, ताकि वे परमेश्वर से अलग होकर[a] हर एक के लिए मृत्यु का स्वाद चखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन हस्तलिपियों में “परमेश्वर के अनुग्रह से” है।
    reason: textual_variant
lexical_decisions:
- source_word: βραχύ τι
  choice: थोड़े समय के लिए
  rationale: संदर्भ में यह पदावली परिमाण की अपेक्षा समय की सीमित अवधि बताती है और भजन 8 की प्रतिध्वनि को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: παρ’ ἀγγέλους
  choice: स्वर्गदूतों से
  rationale: ἐλαττόω के साथ παρά + कर्मकारक तुलनात्मक अर्थ देता है; हिन्दी में ‘से नीचा’ इसका सहज रूप है।
- source_word: ἠλαττωμένον
  choice: नीचा किया गया था
  rationale: पूर्ण निष्क्रिय कृदंत को स्वाभाविक हिन्दी निष्क्रिय रूप में प्रस्तुत किया गया है; इससे पद या स्थिति में नीचे किए जाने का भाव बना रहता है।
- source_word: διὰ τὸ πάθημα τοῦ θανάτου
  choice: मृत्यु की पीड़ा सहने के कारण
  rationale: διά + कर्मकारक यहाँ कारण व्यक्त करता है। ‘सहने’ जोड़ने से सम्बन्ध प्राकृतिक हिन्दी में स्पष्ट होता है, बिना अर्थ का विस्तार किए।
- source_word: δόξῃ καὶ τιμῇ ἐστεφανωμένον
  choice: महिमा और आदर का मुकुट पहनाया गया
  rationale: στεφανόω के मुकुट-रूपक और निष्क्रिय भाव दोनों को स्पष्ट तथा सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: ὅπως
  choice: ताकि
  rationale: उद्देश्य अथवा परिणाम का बल संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χωρὶς θεοῦ
  choice: परमेश्वर से अलग होकर
  rationale: प्रदान किए गए SBLGNT पाठ का सीधा अर्थ यही है। अधिक प्रचलित χάριτι θεοῦ पाठ को मुख्य पाठ में रखने के बजाय पादटिप्पणी में सुरक्षित किया गया है, क्योंकि अनुवाद मूल-स्रोत पाठ से किया जा रहा है।
- source_word: ὑπὲρ παντός
  choice: हर एक के लिए
  rationale: सन्दर्भ में ὑπέρ प्रतिनिधिक अथवा हितार्थ अर्थ देता है और παντός वितरणात्मक है। ‘हर एक के लिए’ व्यक्तिगत विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γεύσηται θανάτου
  choice: मृत्यु का स्वाद चखें
  rationale: मूल यूनानी रूपक को रखा गया है; यह हिन्दी में समझ में आने वाला, गरिमापूर्ण बाइबलीय मुहावरा है।
theological_decisions:
- issue: उद्देश्यवाचक उपवाक्य में पाठांतर
  choice: परमेश्वर से अलग होकर
  alternative: परमेश्वर के अनुग्रह से
  rationale: दिए गए मूल-पाठ में χωρὶς θεοῦ है, इसलिए मुख्य पाठ उसी का अनुसरण करता है। χάριτι θεοῦ एक प्राचीन और व्यापक पाठांतर है तथा अनेक आधुनिक अनुवाद उसे अपनाते हैं; अतः पाठगत और धर्मवैचारिक तनाव को मिटाने के बजाय उसे पादटिप्पणी में स्पष्ट किया गया है।
- issue: ὑπὲρ παντός का विस्तार
  choice: हर एक के लिए
  alternative: हर वस्तु के लिए
  rationale: निकटवर्ती मानव-मुक्ति सन्दर्भ व्यक्तिगत अर्थ का समर्थन करता है, पर παντός का व्याकरणिक एकवचन संक्षिप्त रखा गया है; किसी विशेष प्रायश्चित्त-सिद्धान्त को पद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘मृत्यु का स्वाद चखें’ जैसे मूल रूपक को समझने योग्य होने के कारण बनाए रखा गया है। मुख्य पाठ प्रदान किए गए यूनानी पाठ का अनुसरण करता है, जबकि महत्त्वपूर्ण पाठांतर पादटिप्पणी में दिया गया है।
