  text: ἐν ᾧ γὰρ πέπονθεν αὐτὸς πειρασθείς, δύναται τοῖς πειραζομένοις βοηθῆσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/018.yaml
  text: For because he himself suffered when he was tempted[a], he is able to help those who are being tempted.
translation:
  language: hi
  text: क्योंकि स्वयं परीक्षा में पड़कर उसने दुःख सहा, इसलिए वह उनकी सहायता कर सकता है जिनकी परीक्षा हो रही है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, दोनों स्थानों पर: “प्रलोभित होकर उसने दुःख सहा ... जो प्रलोभित किए जा रहे हैं”; अथवा: “परीक्षित होकर उसने दुःख सहा ... जिनकी परीक्षा हो रही है।” यूनानी क्रिया का अर्थ प्रसंग के अनुसार “प्रलोभित करना” या “परखना” हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ᾧ γὰρ
  choice: क्योंकि ... इसलिए
  rationale: ἐν ᾧ यहाँ कारणसूचक है और γὰρ पिछले कथन की व्याख्या करता है। हिन्दी में ‘क्योंकि ... इसलिए’ कारण और परिणाम के संबंध को स्वाभाविक तथा स्पष्ट रूप से व्यक्त करता है।
- source_word: πέπονθεν
  choice: दुःख सहा
  rationale: πάσχω के सिद्ध पूर्ण रूप में घटित अनुभव और उसकी वर्तमान प्रासंगिकता दोनों निहित हैं; प्रसंग में हिन्दी का सामान्य भूतकाल स्वाभाविक है।
- source_word: αὐτὸς
  choice: उसने स्वयं
  rationale: αὐτός की बलात्मकता बनाए रखता है और बताता है कि यह अनुभव पुत्र ने व्यक्तिगत रूप से सहा।
- source_word: πειρασθείς
  choice: परीक्षा में पड़कर
  rationale: πειράζω प्रलोभन या परख—दोनों अर्थ दे सकता है। ‘परीक्षा में पड़ना’ हिन्दी में इस व्यापकता को काफी हद तक बनाए रखता है और केवल पाप की ओर लुभाए जाने तक अर्थ को सीमित नहीं करता।
- source_word: δύναται
  choice: वह ... कर सकता है
  rationale: क्षमता का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: τοῖς πειραζομένοις
  choice: उन लोगों ... जो परीक्षा में पड़ रहे हैं
  rationale: वर्तमान कृदन्त की जारी अवस्था को ‘पड़ रहे हैं’ से व्यक्त किया गया है।
- source_word: βοηθῆσαι
  choice: सहायता कर सकता है
  rationale: βοηθέω का अर्थ संकट में सहायता देना या मदद को आना है; ‘सहायता करना’ आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
theological_decisions:
- issue: यीशु और विश्वासियों के लिए प्रयुक्त πειράζω का अर्थ
  choice: परीक्षा में पड़ना
  alternative: प्रलोभन में पड़ना / परखा जाना
  rationale: मूल क्रिया में प्रलोभन और परख दोनों की संभावना है। मुख्य पाठ का व्यापक हिन्दी पद इस तनाव को यथासंभव बनाए रखता है, और पादटिप्पणी दोनों स्पष्ट विकल्प दर्ज करती है; इससे यीशु के पाप में पड़ने का कोई संकेत नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। कारण-परिणाम को हिन्दी में स्वाभाविक ‘क्योंकि ... इसलिए’ संरचना से व्यक्त किया गया है और मूल की शब्दार्थगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
