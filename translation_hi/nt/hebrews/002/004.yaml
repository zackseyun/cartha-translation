  yaml_path: translation/nt/hebrews/002/004.yaml
  text: while God also bore witness with signs and wonders and various miracles and distributions of the Holy Spirit according to his will.
translation:
  language: hi
  text: और परमेश्वर ने भी चिन्हों, अद्भुत कार्यों, विभिन्न सामर्थ्य-प्रदर्शनों[a] और अपनी इच्छा के अनुसार पवित्र आत्मा के वितरणों[b] के द्वारा गवाही दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विभिन्न सामर्थ्य” अथवा “विभिन्न सामर्थ्य के कार्य।” यूनानी शब्द सामर्थ्य के प्रकट होने को, और इस संदर्भ में चमत्कारी कार्यों को, सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पवित्र आत्मा के बाँटे गए अंश” अथवा “पवित्र आत्मा के हिस्से।” मूल पाठ में “वरदान” शब्द स्पष्ट रूप से नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: συνεπιμαρτυροῦντος
  choice: और परमेश्वर भी ... इसकी गवाही देता रहा
  rationale: सम्बन्धसूचक कृदन्त पिछले पद की मुख्य क्रिया के साथ-साथ चलने वाली परिस्थिति बताता है। ‘भी’ συν- की योगात्मक शक्ति रखता है; ‘देता रहा’ सहवर्ती और निरंतर प्रमाणित करने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। ‘इसकी’ पिछले पद में घोषित उद्धार-संदेश की ओर संकेत स्पष्ट करती है।
- source_word: σημείοις τε καὶ τέρασιν
  choice: चिन्हों, अद्भुत कामों ... के द्वारा
  rationale: करण कारक को ‘के द्वारा’ से व्यक्त किया गया है। ‘चिन्ह’ प्रमाणसूचक कार्य और ‘अद्भुत काम’ विस्मय उत्पन्न करने वाले कार्य का भाव रखते हैं।
- source_word: ποικίλαις δυνάμεσιν
  choice: तरह-तरह के सामर्थ्य के कामों
  rationale: δύναμις यहाँ सामर्थ्य के प्रकट कार्यों को सूचित कर सकता है। यह अनुवाद संदर्भगत चमत्कारी अर्थ को समझने योग्य बनाते हुए मूल शब्द के ‘सामर्थ्य’ वाले भाव को बनाए रखता है।
- source_word: πνεύματος ἁγίου
  choice: पवित्र आत्मा के
  rationale: यह स्थापित, स्वाभाविक हिन्दी पदवी है और μερισμοῖς पर निर्भर सम्बन्धकारक रचना को सुरक्षित रखती है।
- source_word: μερισμοῖς
  choice: बँटवारों
  rationale: शब्द वितरण, बाँट या हिस्से किए जाने का अर्थ देता है। मूल में ‘वरदान’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: κατὰ τὴν αὐτοῦ θέλησιν
  choice: अपनी इच्छा के अनुसार
  rationale: κατά + कर्मकारक के अनुरूपता वाले अर्थ को व्यक्त करता है। आत्मवाचक ‘अपनी’ स्वाभाविक रूप से वाक्य के कर्ता परमेश्वर की ओर लौटती है।
theological_decisions:
- issue: ‘अपनी इच्छा’ का संदर्भ
  choice: इच्छा परमेश्वर की है, जो इस वाक्यांश का नियंत्रक कर्ता है।
  alternative: इसे अधिक ढीले रूप में पवित्र आत्मा की इच्छा से जोड़ा जा सकता है।
  rationale: वाक्य का व्याकरणिक कर्ता परमेश्वर है, जो इन साधनों से गवाही देता है; इसलिए आत्मवाचक ‘अपनी’ सबसे स्वाभाविक रूप से उसी की ओर संकेत करता है।
- issue: ποικίλαις δυνάμεσιν का स्वरूप
  choice: सामर्थ्य के विविध प्रकट काम
  alternative: सीधे ‘तरह-तरह के चमत्कार’
  rationale: ‘सामर्थ्य के काम’ मूल की शाब्दिक व्यापकता और इस संदर्भ के चमत्कारी आशय दोनों को रखता है, बिना सभी अर्थगत तनाव को केवल ‘चमत्कार’ में सीमित किए।
- issue: μερισμοῖς में निहित वस्तु
  choice: पवित्र आत्मा के बँटवारे
  alternative: पवित्र आत्मा के वरदानों का वितरण
  rationale: मूल पाठ ‘वरदान’ शब्द नहीं जोड़ता। अस्पष्टता बनाए रखने के लिए मुख्य पाठ में वितरण का ही उल्लेख है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए बोधगम्य रूप। ‘बँटवारों’ कुछ असामान्य है, पर मूल μερισμοῖς की ठोस वितरण-संबंधी अस्पष्टता बचाता है; पादटिप्पणी वैकल्पिक अर्थ खोलती है। पिछले पद से जुड़े वाक्यांश के रूप में आरम्भिक ‘और’ रखा गया है।
