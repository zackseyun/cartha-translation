  text: ὅθεν ὤφειλεν κατὰ πάντα τοῖς ἀδελφοῖς ὁμοιωθῆναι, ἵνα ἐλεήμων γένηται καὶ πιστὸς ἀρχιερεὺς τὰ πρὸς τὸν θεόν, εἰς τὸ ἱλάσκεσθαι τὰς ἁμαρτίας τοῦ λαοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/017.yaml
  text: Therefore he had to become like his brothers in every respect[a], so that he might become a merciful and faithful high priest in the things pertaining to God[b], to make atonement for the sins of the people.
translation:
  language: hi
  text: इसलिए उसे हर बात में अपने भाइयों के समान होना आवश्यक था[a], ताकि वह परमेश्वर से संबंधित मामलों में दयालु और विश्वासयोग्य महायाजक बने और लोगों के पापों का प्रायश्चित करने के लिए ऐसा करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाई-बहनों के समान।” यूनानी में “भाइयों” के लिए पुल्लिंग बहुवचन पारिवारिक शब्द है, जो इस संदर्भ में विश्वासियों के व्यापक परिवार को भी समेट सकता है।
    reason: lexical_alternative
  - marker: b
    text: “प्रायश्चित करने” के लिए प्रयुक्त यूनानी क्रिया में पापों का निवारण करने और पापों के कारण उत्पन्न क्रोध को शांत करने—दोनों भाव समाए हो सकते हैं।
    reason: alternative_reading
