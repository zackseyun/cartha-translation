  rationale: परमेश्वर के सम्मुख याजकीय कार्यक्षेत्र को स्पष्ट रखता है और मूल की औपचारिक अभिव्यक्ति को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: εἰς τὸ ἱλάσκεσθαι
  choice: प्रायश्चित करे
  rationale: पापों से याजकीय रूप से निपटने की क्रिया के लिए सुलभ और स्थापित हिन्दी शब्द है; क्रोध-शमन और पाप-निवारण के बीच की अर्थगत बहस को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὰς ἁμαρτίας τοῦ λαοῦ
