  rationale: समुदाय के पापों को प्रायश्चित की याजकीय क्रिया का विषय बनाता है और हिन्दी में स्वाभाविक लगता है।
theological_decisions:
- issue: ἱλάσκεσθαι का धर्मवैज्ञानिक रूप से विवादित अर्थ
  choice: प्रायश्चित करे
  alternative: पापों का निवारण करे; पापों के कारण उत्पन्न क्रोध को शांत करे
  rationale: मुख्य पाठ में व्यापक याजकीय अर्थ को सुरक्षित रखने वाला परिचित शब्द चुना गया है। पादटिप्पणी दोनों प्रमुख अर्थगत दिशाएँ बताती है, ताकि मूल की धर्मवैज्ञानिक कसावट को चुपचाप न सुलझाया जाए।
- issue: ἀδελφοῖς का लिंग और संदर्भगत विस्तार
  choice: अपने भाइयों
  alternative: अपने भाई-बहनों
  rationale: मुख्य पाठ यूनानी के पुल्लिंग पारिवारिक रूप को बनाए रखता है, जबकि संदर्भ में विश्वासियों के व्यापक परिवार को शामिल करने की संभावना पादटिप्पणी में स्पष्ट की गई है।
- issue: ὤφειλεν में आवश्यकता या दायित्व
  choice: यह आवश्यक था
  alternative: उसके लिए अनिवार्य था; उसे होना ही था
  rationale: यह रूप उद्धारकारी उद्देश्य के अंतर्गत आवश्यकता व्यक्त करता है, पर ऐसी बाहरी बाध्यता नहीं जोड़ता जिसका मूल पाठ स्पष्ट दावा नहीं करता।
