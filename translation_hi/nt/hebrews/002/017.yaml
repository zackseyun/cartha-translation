  choice: हर बात में
  rationale: समानता के व्यापक दायरे को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: τοῖς ἀδελφοῖς
  choice: अपने भाइयों
  rationale: यूनानी के पुल्लिंग बहुवचन पारिवारिक शब्द को मुख्य पाठ में सुरक्षित रखता है; व्यापक समावेशी संदर्भ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ὁμοιωθῆναι
  choice: के समान बने
  rationale: समान होने या बनने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है और देहधारण के संदर्भ के अनुकूल है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्य-सूचक संबंध को स्पष्टता से व्यक्त करता है।
- source_word: ἐλεήμων
  choice: दयालु
  rationale: दया दिखाने के अर्थ को सामान्य पाठक के लिए सहज रखते हुए याजकीय संदर्भ के अनुकूल है।
- source_word: πιστὸς
  choice: विश्वासयोग्य
  rationale: परमेश्वर के सम्मुख याजकीय सेवा में विश्वसनीयता और निष्ठा—दोनों का उपयुक्त भाव देता है।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: याजकीय पद का मानक और प्रचलित हिन्दी रूप है।
- source_word: τὰ πρὸς τὸν θεόν
