reference: Hebrews 2:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὐ γὰρ ἀγγέλοις ὑπέταξεν τὴν οἰκουμένην τὴν μέλλουσαν, περὶ ἧς λαλοῦμεν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/005.yaml
  text: For he did not subject the world to come to angels[a], about which we are speaking.
translation:
  language: hi
  text: क्योंकि उसने उस आने वाले संसार[a] को, जिसकी हम चर्चा कर रहे हैं, स्वर्गदूतों के अधीन नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह आबाद संसार जो आने वाला है।”
    reason: οἰκουμένη का अधिक शाब्दिक अर्थ ‘आबाद संसार’ या ‘आबाद पृथ्वी’ हो सकता है।
lexical_decisions:
- source_word: Οὐ γὰρ
  choice: क्योंकि ... नहीं
  rationale: γάρ पिछले कथन से कारणात्मक/व्याख्यात्मक संबंध जोड़ता है, जबकि οὐ पूरे कथन का निषेध करता है।
- source_word: ἀγγέλοις
  choice: स्वर्गदूतों के अधीन
  rationale: इब्रानियों के निकटवर्ती संदर्भ में ἄγγελοι मनुष्य-दूत नहीं, बल्कि स्वर्गीय प्राणी हैं; चतुर्थी कारक को ὑπέταξεν के साथ ‘के अधीन’ व्यक्त करता है।
- source_word: ὑπέταξεν
  choice: अधीन ... किया
  rationale: यह क्रिया किसी को अधिकार या शासन के नीचे रखने का भाव देती है। ‘अधीन किया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस शासकीय अर्थ को बनाए रखता है।
- source_word: τὴν οἰκουμένην
  choice: संसार
  rationale: οἰκουμένη का मूल भाव आबाद पृथ्वी/मानव-निवास का जगत है; यहाँ ‘संसार’ सहज और व्यापक हिन्दी है। अधिक शाब्दिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: τὴν μέλλουσαν
  choice: आने वाला
  rationale: μέλλουσαν भविष्य में आने वाले जगत को सूचित करता है। ‘आने वाला’ भावी और युगान्त-संबंधी संकेत को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: περὶ ἧς λαλοῦμεν
  choice: जिसकी हम चर्चा कर रहे हैं
  rationale: यह वर्तमान में चल रही लेखक की चर्चा की ओर संकेत करता है। हिन्दी में ‘जिसकी हम चर्चा कर रहे हैं’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: ‘आने वाले संसार’ का संदर्भ
  choice: भविष्य में आने वाला संसार या विश्व-व्यवस्था
  alternative: सामान्य रूप से आबाद पृथ्वी, अथवा विशेष रूप से वर्तमान सुसमाचार-युग
  rationale: τὴν οἰκουμένην τὴν μέλλουσαν स्वाभाविक रूप से भावी संसार की ओर संकेत करता है। अनुवाद यह नहीं तय करता कि वह संसार किस सटीक काल-योजना से संबंधित है, इसलिए मूल पाठ का धर्मवैज्ञानिक तनाव बना रहता है।
- issue: ὑπέταξεν का अव्यक्त कर्ता
  choice: ‘उसने’—पूर्व संदर्भ से समझा जाने वाला परमेश्वर, नाम जोड़े बिना
  alternative: स्पष्ट रूप से ‘परमेश्वर ने’
  rationale: यूनानी क्रिया में कर्ता अंतर्निहित है और इस पद में परमेश्वर का नाम नहीं आता। ‘उसने’ मूल की अभिव्यक्ति को सुरक्षित रखता है तथा संदर्भ से कर्ता समझने देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। यूनानी वाक्य का संबंधसूचक अंश हिन्दी की स्वाभाविक संरचना में रखा गया है और ‘अधीन किया’ द्वारा अधिकार/शासन का भाव सुरक्षित है।
