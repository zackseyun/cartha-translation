  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγων· Ἀπαγγελῶ τὸ ὄνομά σου τοῖς ἀδελφοῖς μου, ἐν μέσῳ ἐκκλησίας ὑμνήσω σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/012.yaml
  text: saying[a], “I will proclaim your name to my brothers[b]; in the midst of the assembly I will sing praise to you.”
translation:
  language: hi
  text: 'यह कहते हुए,


    “मैं अपने भाइयों[a] को तेरे नाम की घोषणा करूँगा;

    सभा[b] के बीच में मैं तेरी स्तुति गाऊँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाइयों और बहनों।” यूनानी में “भाइयों” है, पर प्रसंग में यह पारिवारिक संबोधन सभी साथी विश्वासियों को सम्मिलित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मण्डली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγων
  choice: यह कहते हुए
  rationale: वर्तमान कृदंत आगे दिए गए उद्धरण का परिचय देता है; यह रूप पूर्ववर्ती वाक्य से संबंध बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: Ἀπαγγελῶ
  choice: मैं … घोषणा करूँगा
  rationale: यह क्रिया खुले रूप से बताने या घोषित करने का भाव रखती है; ‘घोषणा करूँगा’ उसके सार्वजनिक और कथनात्मक बल को बनाए रखता है।
- source_word: τὸ ὄνομά σου
  choice: तेरे नाम की
  rationale: ‘नाम’ को मूल पाठ के अनुसार यथावत रखा गया है; इसमें चरित्र और प्रकट पहचान का व्यापक बाइबिलीय भाव हो सकता है, पर उसे मुख्य पाठ में खोलकर नहीं जोड़ा गया।
- source_word: τοῖς ἀδελφοῖς μου
  choice: अपने भाइयों को
  rationale: ἀδελφοῖς व्याकरणतः पुल्लिंग बहुवचन है, इसलिए ‘भाइयों’ रखा गया है; प्रसंग में इसका संकेत विश्वासियों के पूरे परिवार की ओर हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: ἐν μέσῳ
  choice: के बीच में
  rationale: यह मूल मुहावरे का निकट और स्पष्ट हिन्दी रूप है तथा उद्धरण की काव्यात्मक गरिमा बनाए रखता है।
- source_word: ἐκκλησίας
  choice: सभा
  rationale: इस भजन-उद्धरण में शब्द एकत्र हुए लोगों को दर्शाता है; ‘सभा’ इस अर्थ को व्यक्त करता है और बाद की संस्थागत धारणाएँ अनावश्यक रूप से नहीं जोड़ता।
- source_word: ὑμνήσω
  choice: मैं … स्तुति गाऊँगा
  rationale: क्रिया विशेष रूप से गीत द्वारा प्रशंसा करने का अर्थ देती है; ‘स्तुति गाऊँगा’ हिन्दी में स्वाभाविक है और संगीतात्मक भाव सुरक्षित रखता है।
- source_word: σε
  choice: तेरी
  rationale: ‘स्तुति गाना’ के साथ सम्बन्धकारक सर्वनाम हिन्दी में लक्ष्य को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ἀδελφοῖς का प्रतिनिधिक पारिवारिक अर्थ
  choice: भाइयों
  alternative: भाइयों और बहनों; भाई-बहनों
  rationale: मुख्य पाठ में यूनानी पुल्लिंग रूप को सुरक्षित रखा गया है। प्रसंग में पूरे विश्वासी परिवार के सम्मिलित होने की सम्भावना को पादटिप्पणी में रखा गया है, ताकि न तो रूप मिटे और न व्यापक संकेत दबे।
- issue: पुराने नियम के उद्धरण में ἐκκλησία का अनुवाद
  choice: सभा
  alternative: मण्डली; कलीसिया
  rationale: यहाँ भजन 22:22 के संदर्भ में परमेश्वर के एकत्र लोगों का भाव है। ‘सभा’ मूल अर्थ को बनाए रखता है और ऐसी संस्थागत कलीसियाई धारणा नहीं जोड़ता जिसकी उद्धरण में आवश्यकता नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक उद्धरण-शैली अपनाई गई है। परमेश्वर को संबोधित करते हुए एकवचन ‘तेरे/तेरी’ मूल के एकवचन सर्वनाम को स्पष्ट रखता है। पादटिप्पणी-चिह्न सम्बद्ध शब्दों ‘भाइयों’ और ‘सभा’ के तुरंत बाद रखे गए हैं।
