source:
  edition: SBLGNT
  text: Διὰ τοῦτο δεῖ περισσοτέρως ⸂προσέχειν ἡμᾶς⸃ τοῖς ἀκουσθεῖσιν, μήποτε παραρυῶμεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/001.yaml
  text: For this reason[a], we must pay much closer attention to what we have heard, lest we drift away.
translation:
  language: hi
  text: इस कारण, जो कुछ हमने सुना है उस पर हमें और भी अधिक ध्यान देना चाहिए, कहीं ऐसा न हो कि हम उससे बहकर दूर निकल जाएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “कहीं हम उसके पास से बह न निकलें” या “कहीं वह हमारे हाथ से निकल न जाए” भी हो सकता है। यूनानी क्रिया में बहकर दूर या पास से निकल जाने की छवि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: इस कारण
  rationale: यह स्वाभाविक हिन्दी में पिछले तर्क से स्पष्ट कारणात्मक और निष्कर्षात्मक संबंध बनाए रखता है।
- source_word: δεῖ
  choice: हमें ... चाहिए
  rationale: यह आवश्यक कर्तव्य का भाव सहज हिन्दी में व्यक्त करता है; प्रसंग में 'और भी अधिक' इसकी गंभीरता स्पष्ट करता है।
- source_word: περισσοτέρως
  choice: और भी अधिक
  rationale: यह तुलनात्मक बल को सुरक्षित रखता है और पहले कही बात के कारण बढ़ी हुई सावधानी को दर्शाता है।
- source_word: προσέχειν ἡμᾶς
  choice: हमें ... ध्यान देना
  rationale: यह सुनाई गई बात की ओर मन लगाए रखने के अर्थ को आधुनिक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: τοῖς ἀκουσθεῖσιν
  choice: जो कुछ हमने सुना है उस पर
  rationale: यह कृदन्त की व्यापकता और पहले सुने हुए संदेश की वर्तमान प्रासंगिकता को बनाए रखता है, बिना उसे व्याख्यात्मक रूप से केवल 'संदेश' कहने के।
- source_word: μήποτε
  choice: कहीं ऐसा न हो कि
  rationale: यह संभावित अनिष्ट के प्रति चेतावनी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παραρυῶμεν
  choice: हम उससे बहकर दूर निकल जाएँ
  rationale: यह बहने या पास से निकल जाने की यूनानी रूपक-छवि को बनाए रखता है और कर्ता के रूप में 'हम' को स्पष्ट रखता है।
theological_decisions:
- issue: παραρυῶμεν में चेतावनी के रूपक की प्रकृति
  choice: सुनाई गई बात से हमारा बहकर दूर निकल जाना
  alternative: उसके पास से बह निकलना; या उसका हमारे हाथ से निकल जाना
  rationale: व्याकरण में प्रथम पुरुष बहुवचन कर्ता और चेतावनी का प्रसंग श्रोताओं की खतरनाक गति की ओर संकेत करते हैं। फिर भी पादटिप्पणी क्रिया की वास्तविक शब्दार्थगत अस्पष्टता को सुरक्षित रखती है और धर्मत्याग के विषय में किसी विशिष्ट मत को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और उपदेशात्मक है। “बहकर दूर निकल जाएँ” मूल रूपक को बनाए रखता है, जबकि पादटिप्पणी अन्य संभव अर्थों को दर्ज करती है।
