  edition: SBLGNT
  text: διεμαρτύρατο δέ πού τις λέγων· Τί ἐστιν ἄνθρωπος ὅτι μιμνῄσκῃ αὐτοῦ, ἢ υἱὸς ἀνθρώπου ὅτι ἐπισκέπτῃ αὐτόν;
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/006.yaml
  text: But someone has testified somewhere[a], saying, “What is man, that you remember him, or the son of man[c][b], that you care for him?”
translation:
  language: hi
  text: 'परन्तु किसी ने कहीं यह गवाही दी है:

    “मनुष्य क्या है कि तू उसे स्मरण रखता है,

    या मनुष्य का पुत्र क्या है कि तू उसकी सुधि लेता है?[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्य का पुत्र” यहाँ भजन 8:4 की प्रतिध्वनि है, जहाँ यह मानवता के लिए काव्यात्मक अभिव्यक्ति है। यूनानी में “उसकी सुधि लेता है” का अनुवाद “उसकी देखभाल करता है” या “उससे भेंट करता है” भी हो सकता है; इब्रानियों का व्यापक प्रसंग इस पद को यीशु के लिए भी अर्थपूर्ण बनाता है।
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: διεμαρτύρατο
  choice: गवाही दी है
  rationale: क्रिया के बलपूर्ण ‘गवाही देना’ अर्थ और उद्धृत पवित्रशास्त्रीय साक्ष्य की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δέ
  choice: परन्तु
  rationale: यह पिछले कथन से हल्का विरोध अथवा तर्कगत मोड़ दिखाता है।
- source_word: πού τις
  choice: किसी ने कहीं
  rationale: दोनों अनिश्चित सर्वनामों को सीधे बनाए रखता है; यह लेखक की अनभिज्ञता नहीं, बल्कि स्थान और वक्ता का नाम दिए बिना परिचित उद्धरण प्रस्तुत करने की शैली है।
- source_word: Τί ἐστιν ἄνθρωπος
  choice: मनुष्य क्या है
  rationale: एकवचन प्रतिनिधिक और काव्यात्मक रूप को बनाए रखते हुए सामान्य मानवता का अर्थ देता है।
- source_word: μιμνῄσκῃ αὐτοῦ
  choice: तू उसे स्मरण रखता है
  rationale: ‘स्मरण रखना’ केवल भूली बात याद आने के बजाय किसी को ध्यान में बनाए रखने का भाव स्पष्ट करता है और काव्यात्मक शैली के अनुकूल है।
- source_word: υἱὸς ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यूनानी वाक्यांश और भजन 8 की साहित्यिक प्रतिध्वनि को सुरक्षित रखता है, जबकि मुख्य पाठ में इसे केवल मसीहाई उपाधि के रूप में निश्चित नहीं करता।
- source_word: ἐπισκέπτῃ αὐτόν
  choice: तू उसकी सुधि लेता है
  rationale: यह ध्यानपूर्ण चिंता, देखभाल और किसी की ओर कृपापूर्वक ध्यान देने का भाव स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है; शाब्दिक ‘भेंट करता है’ यहाँ भ्रामक हो सकता है।
theological_decisions:
- issue: क्या ‘मनुष्य का पुत्र’ को स्पष्ट मसीहाई उपाधि के रूप में प्रस्तुत किया जाए
  choice: भजन के उद्धरण का ‘मनुष्य का पुत्र’ रूप बनाए रखा गया और अक्षरांकन अथवा व्याख्यात्मक विस्तार से इसे केवल मसीहाई उपाधि नहीं बनाया गया।
  alternative: इसे सामान्य अर्थ में ‘मानव’ कहना, अथवा विशेष उपाधि के रूप में ऐसा रूप देना जो सीधे यीशु की ओर संकेत करे।
  rationale: भजन 8 में यह मानवता के लिए काव्यात्मक समानांतर अभिव्यक्ति है, जबकि इब्रानियों का व्यापक प्रसंग इसे यीशु पर भी लागू करता है। यह अनुवाद सामान्य मानवीय अर्थ और मसीह-केंद्रित पूर्णता के बीच वास्तविक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक उद्धरण रखा गया है। परमेश्वर को संबोधित करने के लिए ‘तू’ मूल के एकवचन निकट संबोधन और हिन्दी बाइबलीय काव्य-परंपरा के अनुरूप है। ‘सुधि लेना’ आज भी बोधगम्य साहित्यिक प्रयोग है और ἐπισκέπτομαι की ध्यानपूर्ण देखभाल को संक्षेप में व्यक्त करता है।
