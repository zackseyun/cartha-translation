source:
  edition: SBLGNT
  text: Ἐπεὶ οὖν τὰ παιδία κεκοινώνηκεν ⸂αἵματος καὶ σαρκός⸃, καὶ αὐτὸς παραπλησίως μετέσχεν τῶν αὐτῶν, ἵνα διὰ τοῦ θανάτου καταργήσῃ τὸν τὸ κράτος ἔχοντα τοῦ θανάτου, τοῦτ’ ἔστι τὸν διάβολον,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/014.yaml
  text: Therefore[a], since the children share in flesh and blood, he himself likewise partook of the same things, so that through death he might nullify the one who has the power of death—that is, the devil[b],
translation:
  language: hi
  text: इसलिए, चूँकि बच्चे लहू और मांस[a] के सहभागी हैं, वह स्वयं भी उसी प्रकार उनमें सहभागी हुआ, ताकि वह मृत्यु के द्वारा उस व्यक्ति को निष्प्रभावी[b] कर दे जिसके पास मृत्यु की शक्ति है—अर्थात् शैतान को,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मांस और लहू।” यूनानी में शब्दक्रम “लहू और मांस” है।
    reason: lexical_alternative
  - marker: b
    text: या “नाश कर दे”; इस क्रिया का अर्थ “शक्तिहीन करना,” “निष्प्रभावी करना” या “समाप्त कर देना” हो सकता है, और यह आवश्यक रूप से अस्तित्व मिटा देने का संकेत नहीं देती।
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐπεὶ οὖν
  choice: इसलिए, चूँकि
  rationale: οὖν के निष्कर्षसूचक बल और ἐπεί के कारणसूचक बल, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ παιδία
  choice: बच्चे
  rationale: आसपास के प्रसंग में पुत्र को दिए गए बच्चों की ओर संकेत करता है; यह सरल है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: κεκοινώνηκεν
  choice: सहभागी हैं
  rationale: पूर्णकाल से उत्पन्न वर्तमान सहभागिता की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: αἵματος καὶ σαρκός
  choice: लहू और मांस
  rationale: यूनानी शब्दक्रम को सुरक्षित रखता है और σάρξ को यहाँ शारीरिक अर्थ में प्रस्तुत करता है, न कि ‘पापी स्वभाव’ के रूप में।
- source_word: παραπλησίως
  choice: उसी प्रकार
  rationale: वास्तविक समान सहभागिता बताता है, पर पूर्ण अभिन्नता का अनावश्यक दावा नहीं करता।
- source_word: μετέσχεν τῶν αὐτῶν
  choice: इन्हीं का सहभागी हुआ
  rationale: पहले बताए गए लहू और मांस में उसकी वास्तविक सहभागिता को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: διὰ τοῦ θανάτου
  choice: मृत्यु के द्वारा
  rationale: διά के साधनात्मक अर्थ को स्पष्ट करता है।
- source_word: καταργήσῃ
  choice: निष्प्रभावी कर दे
  rationale: क्रिया का अर्थ किसी को अस्तित्वहीन कर देना आवश्यक रूप से नहीं, बल्कि उसकी कार्यकारी शक्ति को निष्फल करना भी हो सकता है।
- source_word: τὸ κράτος ἔχοντα τοῦ θανάτου
  choice: जिसके पास मृत्यु की शक्ति है
  rationale: κράτος के शक्ति या प्रभुत्व के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τοῦτ’ ἔστι τὸν διάβολον
  choice: अर्थात शैतान को
  rationale: पहले वर्णित व्यक्ति की स्पष्ट पहचान कराता है; ‘शैतान’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्थापित व्यक्तिगत पदनाम है।
theological_decisions:
- issue: मसीह की मानवीय दशा में सहभागिता
  choice: वह स्वयं भी उसी प्रकार इन्हीं का सहभागी हुआ
  alternative: वह भी उन्हीं के समान मनुष्य बना
  rationale: चुना हुआ रूप पाठ में व्यक्त वास्तविक सहभागिता को बनाए रखता है और साथ ही ऐसे विस्तृत धर्मवैज्ञानिक कथन नहीं जोड़ता जो इस पद में प्रत्यक्ष नहीं हैं।
- issue: καταργήσῃ का शैतान के संबंध में अर्थ
  choice: निष्प्रभावी कर दे
  alternative: नाश कर दे
  rationale: यह शैतान के अस्तित्व के तत्काल अंत का संकेत दिए बिना उसकी शक्ति को निष्फल करने का अर्थ सुरक्षित रखता है; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू और मांस’ में मूल यूनानी क्रम सुरक्षित है; वाक्य के अंत का अल्पविराम अगले पद में जारी यूनानी वाक्य-संरचना को दर्शाता है।
