  text: οὐ γὰρ δήπου ἀγγέλων ἐπιλαμβάνεται, ἀλλὰ σπέρματος Ἀβραὰμ ἐπιλαμβάνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/016.yaml
  text: For surely it is not angels that he helps[a], but the offspring of Abraham.
translation:
  language: hi
  text: क्योंकि निश्चय ही वह स्वर्गदूतों की सहायता नहीं करता है,[a] बल्कि अब्राहम के वंशजों की सहायता करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “थामता है” या “पकड़ता है”; यूनानी क्रिया का शाब्दिक अर्थ “पकड़ना” या “थामना” हो सकता है, पर यहाँ सम्भवतः इसका भाव “सहायता करना” या “मदद के लिए आगे आना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δήπου
  choice: निश्चय ही
  rationale: यह पद के कथन को ऐसी बात के रूप में बल देता है जो श्रोताओं के लिए स्पष्ट मानी गई है; ‘निश्चय ही’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀγγέλων
  choice: स्वर्गदूतों
  rationale: यह ἐπιλαμβάνεται के साथ सम्बन्धित वर्ग है और अब्राहम के वंश के विपरीत रखा गया है; ‘स्वर्गदूत’ इसका सीधा और प्रचलित हिन्दी समतुल्य है।
- source_word: ἐπιλαμβάνεται
  choice: सहायता करता है
  rationale: सन्दर्भ में क्रिया का भाव किसी को थामकर उसकी सहायता करने या उसके बचाव में आने का है। स्पष्ट हिन्दी के लिए ‘सहायता करता है’ चुना गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: σπέρματος Ἀβραὰμ
  choice: अब्राहम के वंश
  rationale: σπέρμα यहाँ सामूहिक एकवचन में संतान या वंश को दर्शाता है। ‘अब्राहम का वंश’ हिन्दी में स्वाभाविक है और सामूहिक अर्थ को बनाए रखता है।
- source_word: οὐ γὰρ ... ἀλλὰ
  choice: क्योंकि ... नहीं ..., बल्कि ...
  rationale: यह रचना स्वर्गदूतों और अब्राहम के वंश के बीच प्रबल विरोध को स्पष्ट रूप से बनाए रखती है।
theological_decisions:
- issue: मसीह के उद्धारकारी कार्य के सम्बन्ध में ἐπιλαμβάνεται का अर्थ
  choice: पद कहता है कि वह स्वर्गदूतों की नहीं, बल्कि अब्राहम के वंश की सहायता करता है।
  alternative: वह अब्राहम के वंश को थामता या पकड़ता है; इसे मानव स्वभाव धारण करने की ओर संकेत माना जा सकता है।
  rationale: निकटवर्ती सन्दर्भ मनुष्यों के साथ पुत्र की एकता और उनके लिए उसके उद्धारकारी कार्य पर बल देता है, इसलिए सहायता करने का मुहावरेदार अर्थ उपयुक्त है। फिर भी क्रिया का शाब्दिक ‘थामना’ अर्थ वास्तविक भाषिक और धर्मवैचारिक तनाव रखता है, अतः उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘वंश’ सामूहिक अर्थ देता है और ‘सहायता करता है’ सन्दर्भगत मुहावरे को स्पष्ट करता है।
