  text: καὶ ἀπαλλάξῃ τούτους, ὅσοι φόβῳ θανάτου διὰ παντὸς τοῦ ζῆν ἔνοχοι ἦσαν δουλείας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/015.yaml
  text: and free those who[a], through fear of death, were subject to slavery all their lives.
translation:
  language: hi
  text: और उन सभी को छुड़ाए, जो मृत्यु के भय के कारण जीवन भर दासता के अधीन थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπαλλάξῃ
  choice: छुड़ाए
  rationale: यह क्रिया किसी बंधनकारी दशा से मुक्त करने का अर्थ देती है। ‘छुड़ाए’ स्वाभाविक हिन्दी है और दासता के संदर्भ में मुक्ति का भाव स्पष्ट रखती है।
- source_word: τούτους, ὅσοι
  choice: उन सभी को, जो
  rationale: τούτους के संकेत और ὅσοι के वर्ग-समावेशी अर्थ को संयुक्त रूप से सहज हिन्दी में व्यक्त करता है।
- source_word: φόβῳ θανάτου
  choice: मृत्यु के भय के कारण
  rationale: यह वाक्यांश भय को दासता की परिस्थिति अथवा कारण के रूप में प्रस्तुत करता है; ‘के कारण’ हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: διὰ παντὸς τοῦ ζῆν
  choice: जीवन भर
  rationale: मूल मुहावरा जीवन की पूरी अवधि को दर्शाता है; ‘जीवन भर’ संक्षिप्त, वर्तमान और अर्थसटीक हिन्दी है।
- source_word: ἔνοχοι ἦσαν δουλείας
  choice: दासता के अधीन थे
  rationale: ἔνοχος यहाँ केवल कानूनी दायित्व नहीं, बल्कि दासता की वास्तविक अधीन दशा बताता है। यह चयन उस बल को बनाए रखता है, बिना यह जोड़े कि दासता विशेष रूप से किसकी थी।
- source_word: δουλείας
  choice: दासता
  rationale: यह शब्द गुलामी अथवा बंधुआ अधीनता की दशा दर्शाता है। ‘दासता’ गरिमापूर्ण और स्पष्ट हिन्दी है तथा रूपक का बल बनाए रखती है।
- source_word: καὶ
  choice: और
  rationale: यह पद पिछले उद्देश्य-वाक्य से इस खंड को सीधे जोड़ता है।
theological_decisions:
- issue: दासता की प्रकृति
  choice: मृत्यु के भय से जुड़ी वास्तविक दासता को सामान्य रूप में रहने दिया गया है।
  alternative: इसे शैतान की दासता, पाप की दासता, अथवा नश्वरता से उपजा अस्तित्वगत भय कहकर विशेष रूप देना।
  rationale: पद 14 का निकट संदर्भ शैतान और मृत्यु की सामर्थ्य का उल्लेख करता है, पर इस पद में स्वयं केवल मृत्यु के भय के कारण दासता के अधीन होने की बात है। अनुवाद मूल की व्यापकता और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘जीवन भर’ बोलचाल में समझ आने वाला है, जबकि ‘दासता के अधीन’ मूल की गंभीरता और अधीनता दोनों को सुरक्षित रखता है।
