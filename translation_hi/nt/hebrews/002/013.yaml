base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/013.yaml
  text: And again[a], “I will put my trust in him.” And again, “Behold[d][c][b], I and the children whom God has given me.”
translation:
  language: hi
  text: और फिर, “मैं उस पर भरोसा रखूँगा।” और फिर, “देखो, मैं और वे बच्चे जिन्हें परमेश्वर ने मुझे दिए हैं।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें परमेश्वर ने मुझे दिए।” इस पद के यूनानी पाठ में वक्ता का नाम नहीं दिया गया है; प्रसंग में इब्रानियों का लेखक इन उद्धरणों को पुत्र के संबंध में लागू करता है।
    reason: alternative_reading; cross_reference
lexical_decisions:
- source_word: καὶ πάλιν
  choice: और फिर
  rationale: यूनानी में कोई स्पष्ट कथन-क्रिया नहीं है; संक्षिप्त उद्धरण-सूत्र को बिना ‘वह कहता है’ जोड़े सुरक्षित रखा गया है।
- source_word: ἔσομαι πεποιθὼς ἐπ’ αὐτῷ
  choice: मैं उस पर भरोसा रखूँगा
  rationale: यह भविष्य में भरोसे की स्थिर मुद्रा व्यक्त करने वाला परिप्रयुक्त रूप है। ‘भरोसा रखूँगा’ स्वाभाविक हिन्दी है और ἐπί के साथ व्यक्त आश्रय को बनाए रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले उद्धरणीय संकेत की आलंकारिक शक्ति को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: τὰ παιδία
  choice: वे बच्चे
  rationale: उद्धरण में relational sense वाले बच्चों के लिए यह व्यापक और सहज हिन्दी अभिव्यक्ति है।
- source_word: ἅ μοι ἔδωκεν ὁ θεός
  choice: जिन्हें परमेश्वर ने मुझे दिया है
  rationale: व्यक्तियों के लिए हिन्दी का स्वाभाविक सम्बन्धवाचक ‘जिन्हें’ प्रयुक्त है। यूनानी aorist को यहाँ वर्तमान परिणाम वाले हिन्दी पूर्ण रूप से व्यक्त किया गया है; साधारण भूतकाल भी सम्भव है।
theological_decisions:
- issue: उद्धरणों में वक्ता की मसीह-संबंधी पहचान
  choice: मुख्य पाठ में प्रथम पुरुष के उद्धरण सीधे रखे गए हैं और वक्ता का नाम नहीं जोड़ा गया।
  alternative: ‘वह कहता है’ अथवा ‘मसीह कहता है’ जोड़ना।
  rationale: इब्रानियों का प्रसंग इन उद्धरणों को पुत्र पर लागू करता है, पर इस पद का यूनानी पाठ वक्ता को स्पष्ट रूप से नामित नहीं करता। इसलिए अनुवाद व्याख्यात्मक पहचान जोड़े बिना मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; उद्धरणों की गरिमा और सरलता दोनों बनाए रखी गई हैं। ‘देखो’ को ‘निहारो’ की अपेक्षा अधिक सहज माना गया। एक संयुक्त पाद-टिप्पणी में कालगत विकल्प और अनाम वक्ता की प्रसंगगत पहचान दी गई है।
