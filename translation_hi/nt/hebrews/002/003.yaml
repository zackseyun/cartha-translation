source:
  edition: SBLGNT
  text: πῶς ἡμεῖς ἐκφευξόμεθα τηλικαύτης ἀμελήσαντες σωτηρίας, ἥτις, ἀρχὴν λαβοῦσα λαλεῖσθαι διὰ τοῦ κυρίου, ὑπὸ τῶν ἀκουσάντων εἰς ἡμᾶς ἐβεβαιώθη,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/003.yaml
  text: How will we escape if we neglect so great a salvation? This salvation[a], having at first been spoken through the Lord, was confirmed to us by those who heard him,
translation:
  language: hi
  text: यदि हम इतने महान उद्धार की उपेक्षा करें, तो कैसे बच निकलेंगे? यह उद्धार पहले प्रभु के द्वारा सुनाया जाने लगा, और जिन्होंने उन्हें सुना था, उनके द्वारा हम तक इसकी पुष्टि की गई,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πῶς ἡμεῖς ἐκφευξόμεθα
  choice: तो कैसे बच निकलेंगे?
  rationale: भविष्यकालीन आलंकारिक प्रश्न को प्रश्न के रूप में ही रखा गया है; यह चेतावनी की प्रबलता बनाए रखता है, पर उसे सपाट निषेध-वाक्य में नहीं बदलता।
- source_word: τηλικαύτης σωτηρίας
  choice: इतने महान उद्धार
  rationale: यह अभिव्यक्ति उद्धार की असाधारण महानता पर दिए गए यूनानी बल को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: ἀμελήσαντες
  choice: यदि हम ... उपेक्षा करें
  rationale: यद्यपि यह कृदन्त है, मुख्य क्रिया के साथ इसका प्रसंगगत सम्बन्ध शर्तसूचक है; हिन्दी में यह रूप स्वाभाविक और स्पष्ट है।
- source_word: ἥτις
  choice: यह उद्धार
  rationale: सम्बन्धवाचक सर्वनाम के पूर्वपद को दोहराने से हिन्दी में सन्दर्भ स्पष्ट रहता है; वैकल्पिक अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
- source_word: ἀρχὴν λαβοῦσα λαλεῖσθαι
  choice: पहले ... सुनाया जाने लगा
  rationale: यूनानी मुहावरे के आरम्भसूचक बल और कर्मवाच्य दोनों को सहज हिन्दी में सुरक्षित रखा गया है।
- source_word: διὰ τοῦ κυρίου
  choice: प्रभु के द्वारा
  rationale: διά तथा सम्बन्धकारक के माध्यम/कर्ता-सूचक अर्थ को व्यक्त करता है और κύριος के प्रतिष्ठित मसीही पदनाम को बनाए रखता है।
- source_word: ὑπὸ τῶν ἀκουσάντων
  choice: जिन्होंने उन्हें सुना था, उनके द्वारा
  rationale: सुनने वालों को प्रत्यक्ष श्रोताओं के रूप में दिखाता है; हिन्दी में निहित कर्म को स्पष्ट करने के लिए आदरसूचक ‘उन्हें’ जोड़ा गया है।
- source_word: εἰς ἡμᾶς ἐβεβαιώθη
  choice: हम तक प्रमाणित किया गया
  rationale: εἰς की दिशात्मकता (‘हम तक’) और ἐβεβαιώθη के पुष्टि/प्रमाणीकरण के भाव दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: τοῦ κυρίου का अभिप्रेत व्यक्ति
  choice: ‘प्रभु’ से यीशु का संकेत समझते हुए ‘प्रभु’ रखा गया है।
  alternative: इसे सामान्य रूप से परमेश्वर के लिए प्रयुक्त ‘स्वामी’ मानना।
  rationale: उद्धार का प्रभु के द्वारा पहले सुनाया जाना और फिर उनके प्रत्यक्ष श्रोताओं द्वारा प्रमाणित होना यीशु की सांसारिक घोषणा की ओर दृढ़ता से संकेत करता है; अनुवाद पदनाम को बनाए रखता है, अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: चेतावनीपूर्ण प्रश्न का बल
  choice: आलंकारिक भविष्यकालीन प्रश्न को प्रश्न ही रहने दिया गया है।
  alternative: ‘हम निश्चय ही नहीं बचेंगे’ जैसे स्पष्ट निषेध में बदलना।
  rationale: मूल पाठ बच निकलने की असम्भाव्यता का प्रबल संकेत देता है, फिर भी उसे प्रश्न के रूप में प्रस्तुत करता है; इसी धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
- issue: ἥτις से आरम्भ होने वाले उपवाक्य की संरचना
  choice: मुख्य पाठ में स्पष्टता के लिए ‘यह उद्धार’ दोहराया गया है।
  alternative: ‘जो पहले प्रभु के द्वारा सुनाया जाने लगा...’ के रूप में एक ही वाक्य रखना।
  rationale: दोनों संरचनाएँ समान मूल सम्बन्ध व्यक्त करती हैं; पादटिप्पणी अधिक निकट सम्बन्धवाचक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘उद्धार’, ‘प्रभु’, ‘उपेक्षा’ और ‘प्रमाणित’ जैसे स्थापित शब्द मूल के धर्मवैचारिक तथा तर्कगत भार को रखते हैं। वचन के अगले भाग से जुड़ाव दिखाने के लिए अन्त में अल्पविराम रखा गया है।
