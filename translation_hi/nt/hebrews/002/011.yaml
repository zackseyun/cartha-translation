  text: ὅ τε γὰρ ἁγιάζων καὶ οἱ ἁγιαζόμενοι ἐξ ἑνὸς πάντες· δι’ ἣν αἰτίαν οὐκ ἐπαισχύνεται ἀδελφοὺς αὐτοὺς καλεῖν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/011.yaml
  text: For both the one who sanctifies and those who are being sanctified are all from one[a]; for this reason he is not ashamed to call them brothers[b],
translation:
  language: hi
  text: क्योंकि पवित्र करने वाला और पवित्र किए जा रहे लोग, सभी एक ही से हैं[a]। इसी कारण वह उन्हें भाई[b] कहने में लज्जित नहीं होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ही पिता से,” “एक ही स्रोत से,” अथवा “एक ही पूर्वज से।” यूनानी पाठ यह स्पष्ट नहीं करता कि “एक” किसकी ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: “भाई” यूनानी के पुल्लिंग बहुवचन ἀδελφοὺς का अनुवाद है; इस प्रसंग में यह विश्वासियों के व्यापक परिवार को सूचित कर सकता है, जिसमें स्त्रियाँ भी सम्मिलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ἁγιάζων
  choice: जो पवित्र करता है
  rationale: वर्तमानकालिक सक्रिय कृदंत को कर्तावाचक रूप में व्यक्त किया गया है। यह ἁγιάζω के धार्मिक अर्थ को बनाए रखते हुए सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: οἱ ἁγιαζόμενοι
  choice: जो पवित्र किए जा रहे हैं
  rationale: वर्तमानकालिक कर्मवाच्य कृदंत की जारी प्रक्रिया अथवा प्रगतिशील अवस्था को सुरक्षित रखता है और पहले पदबंध के साथ शब्दगत संगति बनाए रखता है।
- source_word: ἐξ ἑνὸς
  choice: एक ही से
  rationale: यूनानी पाठ यह स्पष्ट नहीं करता कि ‘एक’ से पिता, स्रोत, पूर्वज या कोई अन्य संदर्भ अभिप्रेत है। संक्षिप्त हिन्दी अभिव्यक्ति मूल की इसी अस्पष्टता को बनाए रखती है।
- source_word: πάντες
  choice: वे सभी
  rationale: दोनों समूहों के समावेश पर दिए गए बल को स्वाभाविक हिन्दी में व्यक्त करता है और निहित संयोजक क्रिया को स्पष्ट करता है।
- source_word: δι’ ἣν αἰτίαν
  choice: इसी कारण
  rationale: पिछले कथन से निकलने वाले परिणाम को सहज और स्पष्ट हिन्दी में जोड़ता है।
- source_word: οὐκ ἐπαισχύνεται
  choice: लज्जित नहीं होता
  rationale: सम्मान और लज्जा के भाव को बिना अतिरिक्त व्याख्या के सीधे बनाए रखता है।
- source_word: ἀδελφοὺς
  choice: भाई
  rationale: मूल के पुल्लिंग बहुवचन पारिवारिक संबोधन को सुरक्षित रखा गया है; व्यापक विश्वासी परिवार में स्त्रियों के सम्मिलित होने की संभावना पादटिप्पणी में स्पष्ट की गई है।
- source_word: καλεῖν
  choice: कहने
  rationale: ἐπαισχύνεται के साथ आए infinitive का ‘उन्हें भाई कहने में’ स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: ‘वह’ की पहचान और ‘एक ही से’ का संदर्भ
  choice: ‘वह’ को निकटवर्ती प्रसंग के अनुसार पवित्र करने वाले पुत्र के लिए रखा गया है, जबकि ‘एक ही से’ का संदर्भ अनिर्दिष्ट छोड़ा गया है।
  alternative: ‘एक ही पिता से,’ ‘एक ही पूर्वज से,’ अथवा ‘एक ही स्रोत से।’
  rationale: प्रसंग पवित्र करने वाले को पुत्र/यीशु के रूप में पहचानता है, पर ἐξ ἑνὸς स्वयं यह नहीं बताता कि ‘एक’ कौन या क्या है। इसलिए अनुवाद इस धर्मवैचारिक खुलेपन को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल रूप अपनाया गया है। ‘पवित्र करता है/पवित्र किए जा रहे हैं’ की समान शब्दावली मूल की सक्रिय और कर्मवाच्य समानांतरता दिखाती है। ‘एक ही से’ जानबूझकर कुछ असामान्य पर समझने योग्य रखा गया है, ताकि मूल की वास्तविक अस्पष्टता न मिटे।
