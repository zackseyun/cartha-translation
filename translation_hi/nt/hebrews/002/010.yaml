  text: Ἔπρεπεν γὰρ αὐτῷ, δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα, πολλοὺς υἱοὺς εἰς δόξαν ἀγαγόντα τὸν ἀρχηγὸν τῆς σωτηρίας αὐτῶν διὰ παθημάτων τελειῶσαι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/010.yaml
  text: For it was fitting for him—for whom are all things and through whom are all things—in bringing many sons to glory[d][c][b][a], to perfect the pioneer of their salvation through sufferings.
translation:
  language: hi
  text: क्योंकि उसके लिए—जिसके लिए सब कुछ है और जिसके द्वारा सब कुछ है—यह उचित था कि वह बहुत-से पुत्रों को महिमा तक पहुँचाते हुए[a][d] उनके उद्धार के अगुआ[b] को दुखों के द्वारा सिद्ध बनाए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहुत-से पुत्रों” में मूल यूनानी का पुत्रत्व और उत्तराधिकार पर बल बना रहता है; यहाँ यह अभिव्यक्ति केवल पुरुषों तक सीमित नहीं, बल्कि परमेश्वर की सभी संतानों को समेटती है।
    reason: lexical_alternative
  - marker: b
    text: या “मार्ग खोलने वाला,” “संस्थापक,” अथवा “नेता।”
    reason: lexical_alternative
  - marker: c
    text: यहाँ “सिद्ध बनाए” का अर्थ किसी नैतिक दोष को सुधारना नहीं, बल्कि दुखों के द्वारा निर्धारित लक्ष्य या भूमिका की पूर्णता तक पहुँचाना है।
    reason: lexical_alternative
  - marker: d
    text: 'इस वाक्यांश को उद्देश्य के रूप में भी समझा जा सकता है: “बहुत-से पुत्रों को महिमा तक पहुँचाने के लिए।”'
    reason: interpretive_ambiguity
lexical_decisions:
- source_word: Ἔπρεπεν γὰρ αὐτῷ
  choice: क्योंकि उसी के लिए यह उचित था
  rationale: यह निर्वैयक्तिक प्रयोग परमेश्वर के उद्देश्य में किसी बात की उपयुक्तता व्यक्त करता है। ‘उसी’ आगे आनेवाले संबंधवाचक वाक्यांशों से पहचाने जानेवाले व्यक्ति, अर्थात संदर्भ में परमेश्वर, की ओर संकेत करता है।
- source_word: δι’ ὃν τὰ πάντα καὶ δι’ οὗ τὰ πάντα
  choice: जिसके लिए सब कुछ है और जिसके द्वारा सब कुछ है
  rationale: 'दोनों διά-वाक्यांशों का भेद रखा गया है: पहला अंतिम लक्ष्य या प्रयोजन और दूसरा माध्यम या कर्तृत्व व्यक्त करता है। समानांतर रचना मूल के संक्षिप्त, गंभीर स्वर को बनाए रखती है।'
- source_word: πολλοὺς υἱοὺς
  choice: बहुत-से पुत्रों
  rationale: ‘पुत्रों’ से मूल का स्पष्ट पुत्रत्व और उत्तराधिकार-संबंधी बल सुरक्षित रहता है; पादटिप्पणी स्पष्ट करती है कि दायरे में परमेश्वर की सभी संतानें हैं।
- source_word: εἰς δόξαν ἀγαγόντα
  choice: महिमा तक पहुँचाते हुए
  rationale: यह अनुवाद गति और लक्ष्य दोनों को व्यक्त करता है तथा कृदंत को मुख्य अनंत क्रिया के साथ जोड़ता है, बिना उसे निश्चित रूप से केवल उद्देश्यवाचक बना देने के।
- source_word: ἀρχηγὸν
  choice: अगुआ
  rationale: यह शब्द उस व्यक्ति को सूचित कर सकता है जो आरंभ करता है और आगे चलकर दूसरों के लिए मार्ग खोलता है। ‘अगुआ’ सहज हिन्दी है; अर्थ की व्यापकता पादटिप्पणी में दी गई है।
- source_word: τῆς σωτηρίας αὐτῶν
  choice: उनके उद्धार के
  rationale: यह संबंधवाचक रचना स्वाभाविक हिन्दी में मूल के संबंध को बनाए रखती है।
- source_word: διὰ παθημάτων
  choice: दुखों के द्वारा
  rationale: बहुवचन ‘दुखों’ से παθημάτων के अनेक ठोस दुखद अनुभवों का संकेत सुरक्षित रहता है।
- source_word: τελειῶσαι
  choice: सिद्ध बनाए
  rationale: यह इब्रानियों में प्रयुक्त महत्त्वपूर्ण शब्दावली को बनाए रखता है। यहाँ आशय नैतिक दोष सुधारना नहीं, बल्कि निर्धारित लक्ष्य और भूमिका की पूर्णता तक पहुँचाना है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: पुत्र के विषय में τελειῶσαι का अर्थ
  choice: सिद्ध बनाए
  alternative: पूर्णता तक पहुँचाए
  rationale: यहाँ क्रिया पुत्र में किसी नैतिक कमी का संकेत नहीं देती, बल्कि दुखों के द्वारा उसे उसके उद्धारकारी कार्य के निर्धारित लक्ष्य और पूर्णता तक पहुँचाने की बात करती है। स्थापित शब्द-संबंध को मुख्य पाठ में रखते हुए संभावित भ्रम को पादटिप्पणी में दूर किया गया है।
- issue: πολλοὺς υἱοὺς का दायरा
  choice: बहुत-से पुत्रों
  alternative: बहुत-सी संतानों
  rationale: मूल का पुल्लिंग पुत्रत्व और उत्तराधिकार-संबंधी अर्थ मुख्य पाठ में सुरक्षित रखा गया है, जबकि पादटिप्पणी उसके समावेशी दायरे को स्पष्ट करती है।
- issue: ἀγαγόντα और τελειῶσαι का संबंध
  choice: महिमा तक पहुँचाते हुए ... सिद्ध बनाए
  alternative: बहुत-से पुत्रों को महिमा तक पहुँचाने के लिए ... सिद्ध बनाए
  rationale: ग्रीक कृदंत को स्पष्ट उद्देश्यवाचक उपवाक्य में बदलना आवश्यक नहीं है। चुनी हुई रचना साथ-साथ घटनेवाली प्रक्रिया या परिस्थिति को खुला रखती है; वैकल्पिक उद्देश्यवाचक समझ पादटिप्पणी में दी गई है।
