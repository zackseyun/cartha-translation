  text: ἠλάττωσας αὐτὸν βραχύ τι παρ’ ἀγγέλους, δόξῃ καὶ τιμῇ ἐστεφάνωσας ⸀αὐτόν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/002/007.yaml
  text: You made him lower than the angels for a little while[a]; you crowned him with glory and honor.
translation:
  language: hi
  text: तूने उसे थोड़े समय के लिए स्वर्गदूतों से नीचा किया[a]; तूने उसे महिमा और सम्मान का मुकुट पहनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने उसे स्वर्गदूतों से थोड़ा नीचा किया।” यूनानी वाक्यांश समय के बजाय स्तर की थोड़ी मात्रा भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἠλάττωσας
  choice: तूने ... नीचा किया
  rationale: यह ἐλαττόω का अओरिस्ट सक्रिय सूचक, द्वितीय पुरुष एकवचन रूप है। भजन 8 के इस उद्धरण में इसका कारक और तुलनात्मक अर्थ ‘नीचा किया’ है।
- source_word: αὐτὸν
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मवाचक सर्वनाम को बनाए रखता है और यूनानी में अनुपस्थित किसी संज्ञा को नहीं जोड़ता।
- source_word: βραχύ τι
  choice: थोड़े समय के लिए
  rationale: वाक्यांश समय (‘थोड़े समय के लिए’) अथवा मात्रा/स्तर (‘थोड़ा’) व्यक्त कर सकता है। इब्रानियों 2 के संदर्भ में समय-संबंधी अर्थ स्वाभाविक है; दूसरे अर्थ को पादटिप्पणी में रखा गया है।
- source_word: παρ’ ἀγγέλους
  choice: स्वर्गदूतों से
  rationale: ἐλαττόω के साथ παρά + कर्मकारक तुलनात्मक अर्थ देता है; हिंदी में ‘से’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: δόξῃ
  choice: महिमा
  rationale: करणार्थक भाव में यह उस वस्तु को बताता है जिससे मुकुट पहनाया गया; ‘महिमा’ स्थापित और अर्थ-सटीक शब्द है।
- source_word: τιμῇ
  choice: सम्मान
  rationale: τιμή प्रदत्त प्रतिष्ठा और आदर को सूचित करता है। ‘महिमा और सम्मान’ युग्म अर्थ को स्पष्ट और आधुनिक हिंदी में स्वाभाविक रखता है।
- source_word: ἐστεφάνωσας
  choice: तूने ... मुकुट पहनाया
  rationale: στεφανόω के अओरिस्ट सक्रिय सूचक रूप का सीधा कारक अर्थ है। ‘मुकुट पहनाया’ हिंदी में ‘crowned’ का स्वाभाविक और मूर्त रूप है।
- source_word: αὐτόν
  choice: उसे
  rationale: दोहराए गए कर्मवाचक सर्वनाम को स्पष्टता और यूनानी वाक्य-संरचना के प्रति निष्ठा के लिए बनाए रखा गया है।
theological_decisions:
- issue: भजन 8 के उद्धरण में βραχύ τι का अर्थ
  choice: 'समय-संबंधी: ‘थोड़े समय के लिए’'
  alternative: 'मात्रा/स्तर-संबंधी: ‘स्वर्गदूतों से थोड़ा नीचा’'
  rationale: यूनानी दोनों अर्थों की अनुमति देता है। इब्रानियों 2 में अस्थायी दीनता और उसके बाद महिमा के संदर्भ से समय-संबंधी अर्थ अच्छी तरह मेल खाता है, पर वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज शैली अपनाई गई है। ईश्वर को संबोधित उद्धरण होने के कारण एकवचन ‘तूने’ मूल यूनानी के द्वितीय पुरुष एकवचन को सीधे व्यक्त करता है। ‘स्वर्गदूत’ सामान्य पाठक के लिए परिचित है, और ‘महिमा और सम्मान का मुकुट पहनाया’ मूल रूपक को स्पष्ट रूप से बनाए रखता है।
