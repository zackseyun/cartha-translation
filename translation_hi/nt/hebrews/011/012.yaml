language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: διὸ καὶ ἀφ’ ἑνὸς ἐγεννήθησαν, καὶ ταῦτα νενεκρωμένου, καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει καὶ ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/012.yaml
  text: Therefore from one man[a], and this one as good as dead, descendants were born as numerous as the stars of heaven and as the innumerable sand by the seashore.
translation:
  language: hi
  text: इसलिए एक ही पुरुष से—और वह भी मानो मृतप्राय था—आकाश के तारों के समान असंख्य और समुद्र के किनारे की अनगिनत रेत के समान वंशज उत्पन्न हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὸ
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाले परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: ἀφ’ ἑνὸς
  choice: एक ही पुरुष से
  rationale: पुल्लिंग रूप और संदर्भ अब्राहम की ओर संकेत करते हैं; ‘पुरुष’ उस संदर्भ को स्पष्ट करता है, जबकि ‘एक ही’ मूल के बल को बनाए रखता है।
- source_word: ἐγεννήθησαν
  choice: वंशज उत्पन्न हुए
  rationale: बहुवचन कर्मवाच्य यहाँ अब्राहम की संतान-परंपरा के अस्तित्व में आने को दर्शाता है; यह हिंदी में सहज है और केवल तत्काल जन्मों तक अर्थ को सीमित नहीं करता।
- source_word: καὶ ταῦτα νενεκρωμένου
  choice: और वह भी मानो मृतप्राय था
  rationale: यह शाब्दिक मृत्यु नहीं, बल्कि वृद्धावस्था के कारण संतान उत्पन्न करने की मानवीय दृष्टि से समाप्त-सी क्षमता का रूपक है। ‘मानो मृतप्राय’ रूपक की तीव्रता बचाता है।
- source_word: καθὼς τὰ ἄστρα τοῦ οὐρανοῦ τῷ πλήθει
  choice: जितने आकाश के तारे
  rationale: संख्या की तुलना को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ὡς ἡ ἄμμος ἡ παρὰ τὸ χεῖλος τῆς θαλάσσης ἡ ἀναρίθμητος
  choice: समुद्र के किनारे की अनगिनत रेत
  rationale: समुद्र के ‘ओंठ/छोर’ वाले यूनानी मुहावरे को स्वाभाविक हिंदी ‘किनारे’ से व्यक्त करते हुए अगणनीयता बनाए रखी गई है।
theological_decisions:
- issue: ἀφ’ ἑνὸς का अभिप्रेत व्यक्ति
  choice: ‘एक ही पुरुष’ द्वारा अब्राहम का स्पष्ट संकेत
  alternative: ‘एक से’ या ‘एक व्यक्ति से’
  rationale: यूनानी पुल्लिंग रूप और निकट संदर्भ अब्राहम को अभिप्रेत करते हैं; यह स्पष्टता पाठ से बाहर कोई सिद्धांत नहीं जोड़ती।
- issue: νενεκρωμένου का आशय
  choice: अब्राहम की वृद्धावस्था और प्रजनन-असमर्थता के लिए रूपक—‘मानो मृतप्राय’
  alternative: शाब्दिक रूप से मृत या मृत कर दिया गया
  rationale: संदर्भ चमत्कारिक संतानोत्पत्ति का है; अब्राहम सचमुच मरा हुआ नहीं था। फिर भी रूपक की कठोरता को केवल ‘बहुत बूढ़ा’ कहकर हल्का नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में मूल यूनानी की निष्कर्षात्मक गति और प्रतिज्ञा-संबंधी काव्यात्मक तुलना को बनाए रखा गया है।
