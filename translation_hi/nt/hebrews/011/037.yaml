  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। पीड़ाओं की सूची का तीखा, क्रमिक प्रभाव बनाए रखने के लिए छोटे समानांतर वाक्यांश और अंत में कृदंत-समूह प्रयुक्त किए गए हैं।
