  text: ἐλιθάσθησαν, ⸀ἐπρίσθησαν, ἐν φόνῳ ⸀μαχαίρης ἀπέθανον, περιῆλθον ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν, ὑστερούμενοι, θλιβόμενοι, κακουχούμενοι,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/037.yaml
  text: They were stoned[a], they were sawn in two, they died by the sword; they went about in sheepskins, in goatskins, destitute, afflicted, mistreated—
translation:
  language: hi
  text: उन्हें पत्थरों से मारा गया, उन्हें आरे से चीर दिया गया, वे तलवार से मारे गए[a]; वे भेड़ों की खालों और बकरियों की खालों में इधर-उधर फिरते रहे—अभावग्रस्त, सताए हुए और दुर्व्यवहार सहते हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सरल रूप में, “वे तलवार से मरे।” यूनानी वाक्यांश में φόνῳ शब्द है, जिसका अर्थ “हत्या” या “वध” हो सकता है और जो तलवार से हुई मृत्यु की हिंसक प्रकृति पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐλιθάσθησαν
  choice: उन्हें पत्थरवाह किया गया
  rationale: यह λιθάζω के अओरिस्ट कर्मवाच्य को सीधे व्यक्त करता है और मृत्यु को अनावश्यक रूप से स्पष्ट नहीं जोड़ता।
- source_word: ἐπρίσθησαν
  choice: उन्हें आरे से चीर डाला गया
  rationale: πρίζω का मूल अर्थ आरे से चीरना है; हिंदी में यह स्वाभाविक रूप से शरीर को चीर डालने का आशय देता है, जबकि यूनानी में ‘दो टुकड़ों में’ स्पष्ट शब्दों में नहीं है।
- source_word: ἐν φόνῳ μαχαίρης ἀπέθανον
  choice: वे तलवार से निर्ममता से मार डाले गए
  rationale: ἀπέθανον का मृत्यु-संबंधी अर्थ और φόνος की हिंसक हत्या का बल दोनों सुरक्षित हैं; शाब्दिक रूप से ‘तलवार की हत्या में मरे’ हिंदी में अस्वाभाविक होता।
- source_word: περιῆλθον
  choice: इधर-उधर फिरते रहे
  rationale: यह एक स्थान से दूसरे स्थान घूमते रहने का भाव स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐν μηλωταῖς, ἐν αἰγείοις δέρμασιν
  choice: भेड़ों की खाल और बकरियों की खाल ओढ़े हुए
  rationale: इन पदों में खाल से बने वस्त्र निहित हैं; ‘ओढ़े हुए’ हिंदी में पहनावे के आशय को स्पष्ट और सहज बनाता है।
- source_word: ὑστερούμενοι
  choice: अभावग्रस्त
  rationale: यह आवश्यक वस्तुओं की कमी और दरिद्र दशा का गंभीर भाव संक्षेप में व्यक्त करता है।
- source_word: θλιβόμενοι
  choice: सताए हुए
  rationale: कर्मवाच्य कृदंत का दबाव, क्लेश और उत्पीड़न का व्यापक भाव बना रहता है।
- source_word: κακουχούμενοι
  choice: दुर्व्यवहार सहते हुए
  rationale: यह लगातार बुरे व्यवहार और कष्ट दिए जाने का अर्थ स्पष्ट आधुनिक हिंदी में देता है।
theological_decisions:
- issue: ἐν φόνῳ μαχαίρης में हिंसक हत्या की तीव्रता
  choice: मुख्य पाठ में ‘तलवार से निर्ममता से मार डाले गए’
  alternative: ‘वे तलवार से मारे गए’ या ‘वे तलवार से मरे’
  rationale: φόνος साधारण साधनवाचक ‘तलवार से’ से अधिक हिंसक हत्या का भाव रखता है। चुना हुआ रूप उस बल को बचाता है, पर इसे किसी विशिष्ट धार्मिक व्याख्या से नहीं जोड़ता।
- issue: ἐπρίσθησαν में ‘दो टुकड़े’ का आशय
  choice: ‘आरे से चीर डाला गया’
  alternative: ‘आरे से दो टुकड़ों में चीर डाला गया’
  rationale: क्रिया आरे से चीरने को स्पष्ट करती है, पर यूनानी पद में ‘दो टुकड़ों में’ अलग से नहीं लिखा; इसलिए मुख्य पाठ स्रोत के निकट रहता है।
