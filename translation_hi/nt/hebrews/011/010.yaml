  text: ἐξεδέχετο γὰρ τὴν τοὺς θεμελίους ἔχουσαν πόλιν, ἧς τεχνίτης καὶ δημιουργὸς ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/010.yaml
  text: For he was waiting for the city that has foundations[b][a], whose architect and builder is God.
translation:
  language: hi
  text: क्योंकि वह उस नगर की प्रतीक्षा कर रहा था जिसकी नींवें हैं[a] और जिसका वास्तुकार और निर्माता परमेश्वर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नींवों वाला नगर।” बहुवचन “नींवें” स्थायित्व और दृढ़ता पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसका योजनाकार और बनाने वाला परमेश्वर है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐξεδέχετο
  choice: प्रतीक्षा कर रहा था
  rationale: अपूर्ण काल अतीत में जारी और धैर्यपूर्ण प्रतीक्षा को व्यक्त करता है; यह हिंदी रूप उस कालगत पक्ष को स्वाभाविक ढंग से बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: τοὺς θεμελίους ἔχουσαν πόλιν
  choice: उस नगर ... जिसकी नींवें हैं
  rationale: यूनानी कृदंत-वाक्यांश का स्वाभाविक हिंदी रूप है; निश्चित नगर और बहुवचन ‘नींवें’ दोनों सुरक्षित रहते हैं।
- source_word: θεμελίους
  choice: नींवें
  rationale: बहुवचन को बनाए रखता है, जो संदर्भ में स्थायित्व और दृढ़ता का संकेत दे सकता है।
- source_word: πόλιν
  choice: नगर
  rationale: πόλις का मानक और इस गरिमामय संदर्भ में स्वाभाविक हिंदी अनुवाद।
- source_word: ἧς
  choice: जिसकी ... और जिसका
  rationale: संबंधवाचक सर्वनाम नगर की नींवों और उसके रचनाकार-निर्माता, दोनों से संबंध स्पष्ट करता है; हिंदी में लिंगानुसार रूप बदला गया है।
- source_word: τεχνίτης
  choice: रचनाकार
  rationale: कुशल योजना और रूप देने के पक्ष को व्यक्त करता है तथा δημιουργός से अर्थगत भेद बनाए रखता है।
- source_word: δημιουργός
  choice: निर्माता
  rationale: बनाने वाले के व्यापक अर्थ को सुरक्षित रखता है और नगर-निर्माण की छवि के अनुकूल है।
- source_word: ὁ θεός
  choice: परमेश्वर
  rationale: हिंदी बाइबलीय भाषा में θεός के लिए मानक, गरिमामय पद।
theological_decisions:
- issue: प्रतिज्ञात नगर की प्रकृति
  choice: ‘उस नगर ... जिसकी नींवें हैं’
  alternative: ‘स्वर्गीय नगर’ या ‘स्थायी नींवों वाला नगर’
  rationale: पद स्वयं नगर को ‘स्वर्गीय’ नाम नहीं देता और न स्थायित्व को खुलकर जोड़ता है; इसलिए मूल बिंब और उसकी व्याख्यात्मक खुलावट सुरक्षित रखी गई है।
- issue: परमेश्वर की दोहरी भूमिका
  choice: ‘रचनाकार और निर्माता’
  alternative: ‘वास्तुकार और बनाने वाला’
  rationale: दोनों यूनानी पदों का अंतर बनाए रखते हुए किसी विशेष सृष्टि-सिद्धांत को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमामय रूप अपनाया गया है। ‘प्रतीक्षा कर रहा था’ जारी प्रतीक्षा को, ‘नींवें’ मूल के बहुवचन को, और ‘रचनाकार और निर्माता’ दो अलग यूनानी पदों को सुरक्षित रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
