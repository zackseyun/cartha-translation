source:
  edition: SBLGNT
  text: ἔσβεσαν δύναμιν πυρός, ἔφυγον στόματα ⸀μαχαίρης, ⸀ἐδυναμώθησαν ἀπὸ ἀσθενείας, ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ, παρεμβολὰς ἔκλιναν ἀλλοτρίων·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/034.yaml
  text: quenched the power of fire[a], escaped the edge of the sword, were made strong out of weakness, became mighty in battle[b], put foreign armies to flight.
translation:
  language: hi
  text: आग की शक्ति को बुझा दिया, तलवार की धार से बच निकले[a], निर्बलता से बलवान बनाए गए, युद्ध में पराक्रमी हुए, और विदेशी सेनाओं को खदेड़ दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘तलवार के मुँह’; यह तलवार की धार के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘विदेशियों की छावनियों को पीछे हटा दिया’; यहाँ ‘छावनियाँ’ सैन्य बलों, अर्थात सेनाओं, के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσβεσαν δύναμιν πυρός
  choice: आग की शक्ति को बुझा दिया
  rationale: δύναμις πυρός आग की केवल उपस्थिति नहीं, उसकी शक्ति या प्रचंडता को व्यक्त करता है; ‘बुझा दिया’ σβέννυμι की सजीव क्रिया को बनाए रखता है।
- source_word: ἔφυγον στόματα μαχαίρης
  choice: तलवार की धार से बच निकले
  rationale: शाब्दिक ‘तलवार के मुँह’ एक मुहावरा है। आधुनिक हिन्दी में ‘तलवार की धार’ उसका स्वाभाविक अर्थ देता है, और ἔφυγον सफलतापूर्वक बच निकलने को दर्शाता है।
- source_word: ἐδυναμώθησαν ἀπὸ ἀσθενείας
  choice: निर्बलता में से बलवन्त किए गए
  rationale: निष्क्रिय क्रियारूप को ‘किए गए’ से सुरक्षित रखा गया है, जबकि ἀπό निर्बलता की दशा में से बल पाने का भाव देता है।
- source_word: ἐγενήθησαν ἰσχυροὶ ἐν πολέμῳ
  choice: युद्ध में पराक्रमी हुए
  rationale: यह युद्ध के प्रसंग में सामर्थ्यवान हो जाने को व्यक्त करता है; ‘पराक्रमी’ पिछले खंड के ‘बलवन्त’ की अनावश्यक पुनरावृत्ति से बचते हुए अर्थ बनाए रखता है।
- source_word: παρεμβολὰς ἔκλιναν ἀλλοτρίων
  choice: विदेशी सेनाओं को खदेड़ दिया
  rationale: παρεμβολή मूलतः छावनी हो सकता है, पर यहाँ उससे सैन्य बल अभिप्रेत है; ἔκλιναν युद्ध के संदर्भ में पीछे मोड़ने या भागने पर विवश करने का भाव रखता है।
theological_decisions:
- issue: विश्वास से जुड़े उद्धार और विजय के चित्रों की ठोसता
  choice: आग, तलवार, निर्बलता, युद्ध और विदेशी सेनाओं के ऐतिहासिक-सैन्य चित्रों को बनाए रखा गया
  alternative: इन्हें सामान्य या केवल आत्मिक विजय के रूप में प्रस्तुत करना
  rationale: पद ठोस संकटों और युद्ध-संबंधी कार्यों की शृंखला देता है; अनुवाद इनका आत्मिकीकरण या सामान्यीकरण नहीं करता।
- issue: ἐδυναμώθησαν का निष्क्रिय भाव
  choice: ‘बलवन्त किए गए’
  alternative: ‘बलवन्त हो गए’
  rationale: ग्रीक निष्क्रिय रूप प्राप्त सामर्थ्य की ओर संकेत करता है, पर सामर्थ्य देने वाले का नाम स्पष्ट रूप से नहीं बताता; हिन्दी अनुवाद भी इसी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और लयात्मक शैली रखी गई है। क्रियाओं की शृंखला ग्रीक पद की तीव्र गति को बनाए रखती है; ‘बलवन्त किए गए’ निष्क्रियता को और ‘पराक्रमी हुए’ युद्धगत सामर्थ्य को अलग-अलग व्यक्त करते हैं।
