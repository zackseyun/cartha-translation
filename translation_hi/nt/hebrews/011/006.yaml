source:
  edition: SBLGNT
  text: χωρὶς δὲ πίστεως ἀδύνατον εὐαρεστῆσαι, πιστεῦσαι γὰρ δεῖ τὸν προσερχόμενον τῷ θεῷ ὅτι ἔστιν καὶ τοῖς ἐκζητοῦσιν αὐτὸν μισθαποδότης γίνεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/006.yaml
  text: And without faith it is impossible to please him[c][b][a], for the one who comes to God must believe that he exists and that he is a rewarder of those who diligently seek him.
translation:
  language: hi
  text: और विश्वास[a] के बिना परमेश्वर को प्रसन्न करना असंभव है, क्योंकि जो परमेश्वर के पास आता है, उसके लिए यह विश्वास करना आवश्यक है कि वह अस्तित्व में है[b] और वह उसे लगन से खोजनेवालों के लिए प्रतिफल देनेवाला सिद्ध होता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भरोसा।’ πίστις का अर्थ कुछ प्रसंगों में ‘विश्वासयोग्यता’ भी हो सकता है, पर यहाँ आगे की व्याख्या परमेश्वर पर विश्वास करने पर केंद्रित है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, ‘कि वह है।’ यूनानी अभिव्यक्ति संक्षिप्त है।
    reason: lexical_alternative
  - marker: c
    text: या ‘प्रतिफल देनेवाला है’ अथवा ‘प्रतिफल देनेवाला बनता है।’ यूनानी में ‘होता/बनता है’ है; इस प्रसंग में आशय है कि उसे खोजनेवालों के लिए परमेश्वर प्रतिफल देनेवाला पाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: χωρὶς δὲ πίστεως
  choice: और विश्वास के बिना
  rationale: χωρίς का अर्थ ‘बिना’ है और δέ यहाँ हल्का संयोजक है। πίστις को प्रसंगानुसार स्थापित और स्वाभाविक शब्द ‘विश्वास’ से व्यक्त किया गया है; आगे πιστεῦσαι इसका अर्थ स्पष्ट करता है।
- source_word: ἀδύνατον εὐαρεστῆσαι
  choice: परमेश्वर को प्रसन्न करना असम्भव है
  rationale: यूनानी में कर्म निहित है, पर निकटवर्ती संदर्भ में परमेश्वर स्पष्ट विषय है। हिन्दी में ‘उसे’ की अपेक्षा ‘परमेश्वर को’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: πιστεῦσαι γὰρ δεῖ
  choice: क्योंकि ... उसके लिए यह विश्वास करना आवश्यक है
  rationale: γάρ कारण बताता है और δεῖ आवश्यकता व्यक्त करता है। यह संरचना दोनों ὅτι-वाक्यों को स्पष्ट रूप से ‘विश्वास करना’ के अधीन रखती है।
- source_word: τὸν προσερχόμενον τῷ θεῷ
  choice: जो उसके पास आता है
  rationale: προσέρχομαι का भाव निकट आने या पास आने का है। ‘उसके पास आता है’ सहज आधुनिक हिन्दी है और परमेश्वर की ओर संबंधपरक गति बनाए रखता है।
- source_word: ὅτι ἔστιν
  choice: कि वह अस्तित्व में है
  rationale: संक्षिप्त यूनानी वाक्यांश परमेश्वर की वास्तविकता या विद्यमानता की पुष्टि करता है। ‘अस्तित्व में है’ हिन्दी में आशय स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: τοῖς ἐκζητοῦσιν αὐτὸν
  choice: जो उसे लगन से खोजते हैं
  rationale: ἐκζητέω साधारण खोजने से अधिक गंभीर या तत्पर खोज को सूचित कर सकता है। ‘लगन से’ इस बल को सहज हिन्दी में व्यक्त करता है।
- source_word: μισθαποδότης γίνεται
  choice: उनके लिए वह प्रतिफल देनेवाला सिद्ध होता है
  rationale: μισθαποδότης प्रतिफल देनेवाले को दर्शाता है। γίνεται को केवल ‘है’ से समतल न करते हुए ‘सिद्ध होता है’ रखा गया है, जो संदर्भ में खोजनेवालों के प्रति परमेश्वर के वैसा पाया जाने का भाव देता है और उसके स्वभाव में परिवर्तन का अनपेक्षित संकेत नहीं देता।
theological_decisions:
- issue: πίστις का धर्मवैचारिक रूप से महत्त्वपूर्ण अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ आगे प्रयुक्त πιστεῦσαι परमेश्वर पर विश्वास करने की मानवीय प्रतिक्रिया पर केंद्रित है। ‘विश्वास’ स्वाभाविक और व्यापक शब्द है; ‘भरोसा’ निकट विकल्प है, जबकि ‘विश्वासयोग्यता’ इस तत्काल प्रसंग में कम संभावित है।
- issue: γίνεται और परमेश्वर के प्रतिफलदाता होने का संबंध
  choice: प्रतिफल देनेवाला सिद्ध होता है
  alternative: प्रतिफल देनेवाला है; प्रतिफल देनेवाला बनता है
  rationale: यूनानी में साधारण ‘है’ के बजाय γίνεται है। ‘सिद्ध होता है’ उसके शब्दगत तनाव को बचाता है, पर यह नहीं सुझाता कि परमेश्वर के स्वभाव में परिवर्तन आता है।
- issue: ὅτι ἔστιν का आशय
  choice: कि वह अस्तित्व में है
  alternative: कि वह है
  rationale: मुख्य पाठ में स्पष्ट आधुनिक हिन्दी चुनी गई है, जबकि यूनानी की संक्षिप्तता और संभावित अधिक शाब्दिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप। ‘असम्भव’, ‘अस्तित्व’ और ‘प्रतिफल’ जैसे स्थापित शब्दों के साथ वाक्यरचना को स्वाभाविक रखा गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध शब्दों के तुरंत बाद दिए गए हैं।
