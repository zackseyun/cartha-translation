base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/019.yaml
  text: having considered that God is able even to raise from the dead[a], from where, in a figure[b], he also received him back.
translation:
  language: hi
  text: उसने यह विचार किया कि परमेश्वर मरे हुओं में से भी जिलाने में समर्थ है। इसी कारण[a] उसने उसे प्रतीकात्मक रूप से[b] वापस भी पा लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जहाँ से।”
    reason: lexical_alternative
  - marker: b
    text: या, “दृष्टांत के रूप में”; अर्थात इसहाक को वापस पाना पुनरुत्थान के समान या उसकी मिसाल के रूप में देखा गया है, न कि पाठ में वास्तविक पुनरुत्थान का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λογισάμενος
  choice: उसने यह विचार किया
  rationale: यह अब्राहम के मन में किए गए तर्कपूर्ण विचार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐκ νεκρῶν ἐγείρειν
  choice: मरे हुओं में से भी जिलाने
  rationale: यह पुनरुत्थान-संबंधी प्रचलित हिन्दी अभिव्यक्ति है; ‘भी’ यूनानी καὶ के बलाघात को बनाए रखता है।
- source_word: δυνατὸς ὁ θεός
  choice: परमेश्वर ... समर्थ है
  rationale: विधेय विशेषण की वर्तमानकालिक सामर्थ्य और संक्षिप्तता सुरक्षित रहती है।
- source_word: ὅθεν
  choice: इसी कारण
  rationale: संदर्भ में यह पिछले विचार से निकलने वाले परिणाम को स्वाभाविक रूप से जोड़ता है, जबकि इसकी संभावित स्रोतवाचक छाया पादटिप्पणी में रखी गई है।
- source_word: ἐν παραβολῇ
  choice: दृष्टांत के रूप में
  rationale: यह παραβολή की चित्रात्मक/सादृश्यात्मक प्रकृति को बनाए रखता है और वास्तविक पुनरुत्थान का दावा नहीं करता।
- source_word: ἐκομίσατο
  choice: वापस ... पा लिया
  rationale: संदर्भ में इसहाक को बलिदान से बच जाने पर फिर से प्राप्त करने का भाव है; हिन्दी में यह सहज और स्पष्ट है।
- source_word: καὶ
  choice: वापस भी पा लिया
  rationale: ἐν παραβολῇ से पहले का दूसरा καὶ परिणाम में योगात्मक बल देता है।
theological_decisions:
- issue: इसहाक को ‘वापस पाने’ का स्वरूप
  choice: अब्राहम ने इसहाक को दृष्टांत के रूप में वापस पाया
  alternative: अब्राहम ने उसे प्रतीकात्मक रूप से मानो मृत्यु में से वापस पाया
  rationale: ἐν παραβολῇ वास्तविक पुनरुत्थान के बजाय पुनरुत्थान-सदृश वापसी बताता है। मुख्य पाठ यूनानी रूपक को सुरक्षित रखता है और व्याख्या को आवश्यकता से अधिक निश्चित नहीं करता।
- issue: ὅθεν का संबंध
  choice: इसी कारण
  alternative: जहाँ से
  rationale: ὅθεν कारणसूचक निष्कर्ष अथवा स्रोतवाचक संबंध व्यक्त कर सकता है। संदर्भ में कारणसूचक पाठ अधिक स्वाभाविक है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जिलाने’ पुनरुत्थान के संदर्भ में स्वाभाविक है, और ‘दृष्टांत के रूप में’ मूल की जानबूझकर रखी गई चित्रात्मक अस्पष्टता को सुरक्षित रखता है।
