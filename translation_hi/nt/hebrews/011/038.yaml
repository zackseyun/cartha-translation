  text: ὧν οὐκ ἦν ἄξιος ὁ κόσμος ⸀ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσι καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/038.yaml
  text: —of whom the world was not worthy—wandering in deserts and mountains[b][a], and caves and holes in the ground.
translation:
  language: hi
  text: —जिनके योग्य संसार नहीं था—वे मरुस्थलों, पहाड़ों, गुफाओं और धरती के छेदों में भटकते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὧν
  choice: जिनके
  rationale: संबंधवाचक सर्वनाम का संबंध पिछले पद में बताए गए विश्वासयोग्य पीड़ितों से है; ‘जिनके’ यूनानी संबंधसूचक रचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄξιος
  choice: योग्य
  rationale: यह संसार और उन विश्वासयोग्य लोगों के बीच स्पष्ट नैतिक मूल्यांकन व्यक्त करता है।
- source_word: κόσμος
  choice: संसार
  rationale: यहाँ शब्द उस मानव-समाज को व्यापक रूप से दर्शाता है जिसने इन लोगों को ठुकराया; ‘संसार’ अर्थ की व्यापकता बनाए रखता है।
- source_word: ἐπὶ ἐρημίαις
  choice: वीरानों में
  rationale: ἐπί के साथ यहाँ स्थानवाचक अर्थ है। ‘वीरान’ मरुस्थल और अन्य निर्जन स्थानों—दोनों की संभावित अर्थ-सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πλανώμενοι
  choice: भटकते रहे
  rationale: यह कृदंत उनके निरंतर विस्थापन और अस्थिर रूप से घूमते रहने को व्यक्त करता है; ‘रहे’ प्रसंगगत निरंतरता स्पष्ट करता है।
- source_word: ὄρεσι
  choice: पहाड़ों
  rationale: ὄρος का सीधा और सामान्य हिन्दी पर्याय है।
- source_word: σπηλαίοις
  choice: गुफाओं
  rationale: यह सामान्य, सुबोध और स्रोत के ठोस भौगोलिक चित्र के अनुरूप है।
- source_word: ὀπαῖς τῆς γῆς
  choice: धरती की दरारों
  rationale: ὀπή धरती में खुली जगह, छेद या दरार को सूचित कर सकता है। ‘धरती की दरारें’ छिपने योग्य प्राकृतिक खोहों/छिद्रों का चित्र सहज हिन्दी में देती हैं, जबकि वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ‘संसार उनके योग्य नहीं था’ का आशय
  choice: वाक्य को विश्वासयोग्य पीड़ितों के मूल्य के विपरीत संसार पर नैतिक निर्णय के रूप में बनाए रखा गया है।
  alternative: इसे केवल विश्वासियों और संसार के बीच तटस्थ असंगति के कथन के रूप में समझना।
  rationale: यूनानी वाक्य स्पष्ट मूल्यांकन करता है; अनुवाद उस तनाव को बनाए रखता है और उससे आगे कोई सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। आरंभ और मध्य के डैश मूल वाक्य के मूल्यांकनात्मक अंतःक्षेप को उभारते हैं। समन्वित स्थान-सूची के अंत में एक बार ‘में’ रखकर हिन्दी प्रवाह स्वाभाविक बनाया गया है।
