language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Πίστει καλούμενος Ἀβραὰμ ὑπήκουσεν ἐξελθεῖν εἰς ⸀τόπον ὃν ἤμελλεν λαμβάνειν εἰς κληρονομίαν, καὶ ἐξῆλθεν μὴ ἐπιστάμενος ποῦ ἔρχεται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/008.yaml
  text: By faith Abraham[a], when called, obeyed to go out to a place that he was going to receive as an inheritance, and he went out not knowing where he was going.
translation:
  language: hi
  text: विश्वास से अब्राहम ने, बुलाए जाने पर, आज्ञा मानी और एक ऐसे स्थान के लिए निकल पड़ा, जिसे वह विरासत के रूप में पाने वाला था। वह यह जाने बिना निकल पड़ा कि वह कहाँ जा रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: विश्वास के कारण
  rationale: करणवाचक दत्तिव को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग अब्राहम के भरोसे से भरे प्रत्युत्तर पर बल देता है।
- source_word: καλούμενος
  choice: बुलाए जाने पर
  rationale: वर्तमान कर्मवाच्य कृदन्त की कालगत-परिस्थितिजन्य भूमिका को बिना अनावश्यक क्रम निर्धारित किए स्वाभाविक रूप देता है।
- source_word: ὑπήκουσεν ἐξελθεῖν
  choice: आज्ञा मानी और ... निकल पड़ा
  rationale: 'यूनानी में आज्ञापालन की क्रिया के साथ पूरक infinitive है। हिन्दी में यह संयोजन अर्थ को स्पष्ट और सहज बनाता है: आज्ञापालन निकल पड़ने में प्रकट हुआ।'
- source_word: τόπον
  choice: उस स्थान
  rationale: पाठ-भेद के बावजूद सापेक्ष उपवाक्य से पहचाना गया गंतव्य हिन्दी में ‘उस स्थान’ से स्वाभाविक रूप से व्यक्त होता है, यद्यपि अब्राहम उसका ठिकाना नहीं जानता था।
- source_word: ἤμελλεν λαμβάνειν
  choice: पाने वाला था
  rationale: μέλλω और infinitive की भावी अपेक्षा को सहज हिन्दी में रखता है और नियतिवाद का अतिरिक्त भाव नहीं जोड़ता।
- source_word: εἰς κληρονομίαν
  choice: विरासत के रूप में
  rationale: स्थान को विरासत की हैसियत से प्राप्त करने का अर्थ सीधे व्यक्त करता है।
- source_word: ἐξῆλθεν
  choice: निकल पड़ा
  rationale: प्रस्थान की कथात्मक गति व्यक्त करता है; पहले ‘निकल पड़ा’ की पुनरावृत्ति लेखक की ἐξελθεῖν/ἐξῆλθεν शब्द-प्रतिध्वनि को हिन्दी में बनाए रखती है।
- source_word: μὴ ἐπιστάμενος ποῦ ἔρχεται
  choice: यह जाने बिना ... कि वह कहाँ जा रहा है
  rationale: नकारात्मक कृदन्त और अप्रत्यक्ष प्रश्न दोनों को स्वाभाविक हिन्दी में, मूल की अनिश्चितता सहित, व्यक्त करता है।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: यहाँ अब्राहम की बुलाहट के प्रति भरोसेपूर्ण प्रतिक्रिया प्रमुख है; ‘विश्वासयोग्यता’ अर्थ को अनावश्यक रूप से उसके चरित्रगत गुण की ओर मोड़ सकती है।
- issue: अब्राहम के आज्ञापालन और प्रस्थान का संबंध
  choice: आज्ञा मानी और ... निकल पड़ा
  alternative: निकल पड़कर आज्ञा मानी
  rationale: मुख्य क्रिया और पूरक infinitive का संबंध सुरक्षित रखते हुए हिन्दी में क्रिया को सहज बनाया गया है; आज्ञापालन को प्रस्थान से अलग घटना नहीं माना गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘निकल पड़ा’ प्रस्थान की तत्परता और मूल की दोहराई गई क्रिया दोनों को बनाए रखता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
