lexical_decisions:
- source_word: ἐν ταύτῃ
  choice: इसी के द्वारा
  rationale: स्त्रीलिंग एकवचन संकेतवाचक पद का स्वाभाविक संबंध पिछले पद की ‘विश्वास’ से है; ‘के द्वारा’ यहाँ साधन का भाव स्पष्ट करता है, जबकि ‘इसी’ यूनानी संकेतवाचकता को बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: ἐμαρτυρήθησαν
  choice: प्रशंसा पाई
  rationale: μαρτυρέω का कर्मवाच्य रूप यहाँ अनुकूल गवाही या सराहना मिलने का भाव देता है। ‘प्रशंसा पाई’ स्वाभाविक हिन्दी है और प्राप्त अनुकूल साक्ष्य का भाव रखती है।
- source_word: οἱ πρεσβύτεροι
  choice: प्राचीन लोगों
  rationale: इस प्रसंग में पद कलीसियाई पदधारी ‘प्राचीनों’ के बजाय बीती पीढ़ियों के विश्वासयोग्य लोगों को सूचित करता है। ‘प्राचीन लोगों’ मूल पद के कालगत भाव को संक्षेप में स्पष्ट करता है।
theological_decisions:
- issue: ταύτῃ का संदर्भ
  choice: ‘इसी’ का निकटतम संदर्भ 11:1 का विश्वास है।
  alternative: यह 11:1 में वर्णित संपूर्ण वास्तविकता की ओर अधिक व्यापक रूप से संकेत कर सकता है।
  rationale: स्त्रीलिंग एकवचन रूप πίστις से मेल खाता है और अध्याय का प्रवाह विश्वास पर केंद्रित है। फिर भी मुख्य पाठ में ‘विश्वास के द्वारा’ जोड़कर संदर्भ को पूरी तरह स्पष्ट नहीं किया गया, ताकि संकेतवाचक अभिव्यक्ति और उसकी सीमित अस्पष्टता बनी रहे।
- issue: ἐμαρτυρήθησαν में अनुकूल गवाही का स्रोत
  choice: मुख्य पाठ अनुकूल गवाही मिलने का भाव व्यक्त करता है, पर गवाही देने वाले को स्पष्ट रूप से नहीं जोड़ता।
  alternative: इसे स्पष्टतः ‘परमेश्वर की स्वीकृति पाई’ कहा जा सकता है।
  rationale: अध्याय का व्यापक संदर्भ परमेश्वर की अनुकूल गवाही की ओर संकेत करता है, पर इस पद में कर्ता व्यक्त नहीं है; इसलिए उसे मुख्य पाठ में जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘प्राचीन लोगों’ को ‘प्राचीनों’ पर वरीयता दी गई है, क्योंकि आज के पाठक ‘प्राचीन’ को कलीसियाई पद के अर्थ में समझ सकते हैं। वाक्य संक्षिप्त रखा गया है और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
