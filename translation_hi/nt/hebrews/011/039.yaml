lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले विश्वासियों की सूची को इस सार-वाक्य से जोड़ता है; इसमें अपने आप विरोध का अर्थ नहीं जोड़ा गया।
- source_word: πάντες
  choice: इन सबकी
  rationale: यह अध्याय में अभी-अभी वर्णित सभी विश्वासियों की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: μαρτυρηθέντες
  choice: सराहना हुई
  rationale: निष्क्रिय कृदंत यहाँ अनुकूल गवाही अथवा स्वीकृति मिलने का भाव रखता है। हिंदी में ‘सराहना हुई’ इस सकारात्मक साक्ष्य को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: διὰ τῆς πίστεως
  choice: उनके विश्वास के कारण
  rationale: διά और संबंधकारक यहाँ माध्यम/आधार का भाव देते हैं। यह पदबंध स्पष्ट करता है कि अनुकूल गवाही विश्वास के संबंध में मिली।
- source_word: πίστεως
  choice: विश्वास
  rationale: इब्रानियों 11 में πίστις मुख्यतः परमेश्वर पर भरोसे से भरे विश्वास को दर्शाता है; स्थापित और स्वाभाविक हिंदी शब्द ‘विश्वास’ उपयुक्त है।
- source_word: οὐκ ἐκομίσαντο
  choice: प्राप्त नहीं हुई
  rationale: मध्यवाच्य κομίζω यहाँ प्रतिज्ञात वस्तु को पा लेने या प्राप्त करने के अर्थ में है। हिंदी वाक्य-संरचना में ‘उन्हें ... प्राप्त नहीं हुई’ स्वाभाविक है।
- source_word: τὴν ἐπαγγελίαν
  choice: वह प्रतिज्ञा
  rationale: एकवचन और निश्चित पद को बनाए रखा गया है। ‘वह’ पूर्वसंदर्भित, विशिष्ट प्रतिज्ञा का संकेत देता है, बिना उसका अर्थ ‘पूर्ति’ के रूप में खोलकर निश्चित किए।
theological_decisions:
- issue: संदर्भ में ‘प्रतिज्ञा’ का अर्थ
  choice: मुख्य पाठ में ‘वह प्रतिज्ञा’ रखा गया।
  alternative: प्रतिज्ञा की पूर्ति; जो प्रतिज्ञा की गई थी; प्रतिज्ञात विरासत/आशीष
  rationale: यूनानी पाठ अभिव्यक्ति को संक्षिप्त रखता है, और पद 40 आगे उसका संदर्भ स्पष्ट करता है। मुख्य पाठ में ‘पूर्ति’ जोड़ना व्याख्यात्मक प्रश्न को समय से पहले सुलझा देता।
- issue: कृदंत और मुख्य क्रिया के बीच संबंध
  choice: ‘फिर भी’ द्वारा प्रसंगगत रियायती भाव व्यक्त किया गया।
  alternative: ‘विश्वास के कारण सराहे जाकर भी’; केवल क्रमसूचक ‘और’
  rationale: यद्यपि यूनानी कृदंत स्वयं स्पष्ट रियायती संयोजक नहीं रखता, उसके बाद ‘प्राप्त नहीं हुई’ आने से संदर्भ में स्पष्ट विरोध उभरता है। ‘फिर भी’ इसे स्वाभाविक हिंदी में व्यक्त करता है, जबकि मूल तथ्यगत तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण शैली। ‘सराहना हुई’ साधारण पाठक के लिए सहज है; पादटिप्पणी में ‘अनुकूल गवाही’ और ‘स्वीकृति’ मूल क्रिया के वैकल्पिक आयाम सुरक्षित रखते हैं। मुख्य पाठ में एकवचन ‘प्रतिज्ञा’ और पद का अंत-अल्पविराम बनाए रखा गया है, क्योंकि वाक्य पद 40 में आगे चलता है।
