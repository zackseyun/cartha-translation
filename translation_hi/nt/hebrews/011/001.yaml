translation:
  language: hi
  text: विश्वास उन बातों का दृढ़ भरोसा है जिनकी आशा की जाती है, और उन बातों का प्रमाण है जो दिखाई नहीं देतीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστις
  choice: विश्वास
  rationale: यहाँ यह शब्द परमेश्वर की प्रतिज्ञाओं पर भरोसे की स्थिति बताता है; आधुनिक हिन्दी में ‘विश्वास’ स्वाभाविक और धर्मवैचारिक रूप से तटस्थ समतुल्य है।
- source_word: ἐλπιζομένων
  choice: आशा की हुई बातों का
  rationale: सम्बन्धकारक बहुवचन कृदन्त को आशा की विषय-वस्तु के रूप में रखा गया है और ὑπόστασις के साथ उसका सम्बन्ध बनाए रखा गया है।
- source_word: ὑπόστασις
  choice: भरोसा
  rationale: इस प्रसंग में यह आश्वस्त आधार या दृढ़ निश्चय का भाव देता है। ‘भरोसा’ सामान्य पाठक के लिए सहज है, जबकि ‘वास्तविकता’ और ‘ठोस आधार’ जैसे अर्थ फुटनोट में सुरक्षित हैं।
- source_word: πραγμάτων
  choice: बातों का
  rationale: πρᾶγμα के व्यापक अर्थ—वस्तु, विषय या वास्तविकता—को हिन्दी में ‘बातों’ से स्वाभाविक रूप से व्यक्त किया गया है और दोनों खंडों का समानांतर ढाँचा बना रहता है।
- source_word: ἔλεγχος
  choice: प्रमाण
  rationale: यह शब्द प्रमाण, साक्ष्य अथवा उससे उत्पन्न दृढ़ निश्चय का अर्थ दे सकता है। ‘प्रमाण’ उसके वस्तुगत साक्ष्यात्मक बल को प्रमुख रखता है।
- source_word: οὐ βλεπομένων
  choice: न दिखाई देने वाली बातों का
  rationale: वर्तमान निष्क्रिय कृदन्त का सीधा और स्वाभाविक हिन्दी रूप है, जो अभी दृष्टिगोचर न होने का भाव बनाए रखता है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया
  rationale: यहाँ δέ हल्का संक्रमणसूचक है; हिन्दी में पद को बिना ‘अब’ या ‘परन्तु’ जोड़े आरम्भ करना अधिक स्वाभाविक है और अनावश्यक कालगत अर्थ से बचाता है।
theological_decisions:
- issue: इब्रानियों 11:1 में ὑπόστασις का अर्थ
  choice: मुख्य पाठ में ‘भरोसा’
  alternative: ‘ठोस आधार’ या ‘वास्तविकता’
  rationale: अध्याय का संदर्भ विश्वास के व्यावहारिक, आश्वस्त स्वरूप पर बल देता है; फिर भी शब्द के आधार/वास्तविकता वाले अर्थ को फुटनोट में रखा गया है ताकि वास्तविक अर्थगत तनाव न मिटे।
- issue: πίστις का अनुवाद
  choice: ‘विश्वास’
  alternative: ‘भरोसा’ या ‘विश्वासयोग्यता’
  rationale: यहाँ शब्द विश्वासी के परमेश्वर और उसकी प्रतिज्ञाओं पर विश्वास को सूचित करता है, न कि किसी व्यक्ति की विश्वासयोग्यता को; इसलिए ‘विश्वास’ उपयुक्त है।
- issue: ἔλεγχος का स्वरूप
  choice: ‘प्रमाण’
  alternative: ‘साक्ष्य’ या ‘दृढ़ निश्चय’
  rationale: मुख्य पाठ में वस्तुगत प्रमाण का बल रखा गया है, पर यूनानी शब्द उससे उत्पन्न आंतरिक दृढ़ निश्चय को भी व्यक्त कर सकता है; यह विकल्प फुटनोट में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘आशा की हुई’ स्रोत के निष्क्रिय कृदन्त को दर्शाता है; ‘बातों’ की पुनरावृत्ति यूनानी समानांतरता को स्पष्ट रखती है। सभी अर्थगत विकल्प पाठक-सुलभ फुटनोटों में दिए गए हैं।
