base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/003.yaml
  text: By faith we understand that the ages were framed by the word of God[a], so that what is seen did not come into being from things that are visible.
translation:
  language: hi
  text: विश्वास से हम समझते हैं कि परमेश्वर के वचन से युगों[a] की रचना की गई है, जिससे जो दिखाई देता है, वह दिखाई देनेवाली वस्तुओं से अस्तित्व में नहीं आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘संसारों’ अथवा ‘ब्रह्मांड’; यूनानी में ‘युगों’, जिसका अर्थ समय में फैली हुई विश्व-व्यवस्था भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: विश्वास से
  rationale: यह करणवाचक रूप है और अध्याय में बार-बार आनेवाले सूत्र को संक्षिप्त तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: νοοῦμεν
  choice: हम समझते हैं
  rationale: यह इंद्रिय-बोध से अधिक मानसिक ग्रहण और समझ को सूचित करता है।
- source_word: κατηρτίσθαι
  choice: रचा गया है
  rationale: यह पूर्ण निष्क्रिय क्रिया युगों के गठित, व्यवस्थित या स्थापित किए जाने का भाव देती है; ‘रचा गया है’ आधुनिक हिन्दी में स्वाभाविक है और केवल पदार्थ बनाने तक अर्थ को सीमित नहीं करता।
- source_word: τοὺς αἰῶνας
  choice: युगों
  rationale: मूल शब्द का प्राथमिक कालगत रूप बनाए रखते हुए यह समय में विस्तृत सृष्टि-व्यवस्था का संकेत दे सकता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: ῥήματι θεοῦ
  choice: परमेश्वर के वचन से
  rationale: करणवाचक रूप परमेश्वर के बोले हुए वचन को रचना के साधन के रूप में प्रस्तुत करता है।
- source_word: εἰς τὸ μὴ ... γεγονέναι
  choice: और इस प्रकार ... अस्तित्व में नहीं आया
  rationale: यह परिणाम का सम्बन्ध स्वाभाविक हिन्दी में व्यक्त करता है और γίνομαι के अस्तित्व में आने के भाव को बनाए रखता है।
- source_word: ἐκ φαινομένων
  choice: दिखाई देनेवाली वस्तुओं से
  rationale: यह दृश्य या प्रकट वस्तुओं को सूचित करता है और आगे के दृश्य-अदृश्य विरोध को स्पष्ट रखता है।
- source_word: τὸ βλεπόμενον
  choice: जो दिखाई देता है
  rationale: एकवचन कृदन्त का सामूहिक अर्थ है और यह सम्पूर्ण दृश्य व्यवस्था को समेट सकता है।
theological_decisions:
- issue: सृष्टि के सन्दर्भ में αἰῶνες का दायरा
  choice: मुख्य पाठ में ‘युगों’
  alternative: ‘संसारों’ या ‘ब्रह्मांड’
  rationale: यूनानी शब्द समय और विश्व-व्यवस्था दोनों की व्यापकता रख सकता है। ‘युगों’ मूल की वास्तविक अस्पष्टता को बचाता है, जबकि पादटिप्पणी पाठक को ब्रह्मांडीय अर्थ से अवगत कराती है।
- issue: दृश्य वस्तुओं से सृष्टि न होने का तात्पर्य
  choice: केवल इतना स्पष्ट कहना कि दृश्य जगत दिखाई देनेवाली वस्तुओं से अस्तित्व में नहीं आया
  alternative: इसे सीधे ‘शून्य से सृष्टि’ कहना
  rationale: यह कथन शून्य से सृष्टि की शिक्षा के अनुरूप है, पर यूनानी पाठ स्वयं उस पूर्ण पारिभाषिक सूत्र को स्पष्ट रूप से नहीं कहता; इसलिए अनुवाद उसके कथन से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अस्तित्व में नहीं आया’ दार्शनिक अतिव्याख्या के बिना मूल के होने में आने के भाव को व्यक्त करता है।
