id: HEB.11.25
reference: Hebrews 11:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μᾶλλον ἑλόμενος συγκακουχεῖσθαι τῷ λαῷ τοῦ θεοῦ ἢ πρόσκαιρον ἔχειν ἁμαρτίας ἀπόλαυσιν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/025.yaml
  text: choosing rather to be mistreated with the people of God than to have the temporary enjoyment of sin,[a]
translation:
  language: hi
  text: उसने पाप का थोड़े समय का सुख भोगने के बजाय परमेश्वर की प्रजा के साथ दुर्व्यवहार सहना चुना,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पाप का क्षणभंगुर सुख।’
    reason: πρόσκαιρον के लिए एक अधिक साहित्यिक, किंतु सटीक शाब्दिक विकल्प।
lexical_decisions:
- source_word: μᾶλλον ἑλόμενος
  choice: चुना ... के बजाय
  rationale: यह पद 24 से जुड़े कृदन्त को स्वाभाविक हिन्दी में मुख्य क्रिया के रूप में व्यक्त करता है और दो विकल्पों के बीच मूसा की सोची-समझी प्राथमिकता बनाए रखता है।
- source_word: συγκακουχεῖσθαι
  choice: के साथ दुर्व्यवहार सहना
  rationale: ‘के साथ’ συν- में निहित सहभागिता और एकजुटता को, तथा ‘दुर्व्यवहार सहना’ निष्क्रिय पीड़ा के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: τῷ λαῷ τοῦ θεοῦ
  choice: परमेश्वर की प्रजा
  rationale: यह वाचा-संबंधी अभिव्यक्ति का स्वाभाविक, गरिमापूर्ण और सामूहिक हिन्दी रूप है।
- source_word: πρόσκαιρον
  choice: थोड़े समय का
  rationale: यह उस सुख की सीमित अवधि को सीधे व्यक्त करता है, बिना उसकी अवधि या प्रकृति को आवश्यकता से अधिक निर्धारित किए।
- source_word: ἔχειν ἁμαρτίας ἀπόλαυσιν
  choice: पाप का ... सुख भोगने
  rationale: ‘सुख भोगना’ हिन्दी में ἔχειν और ἀπόλαυσιν के संयुक्त अर्थ को सहज रूप से देता है; ‘पाप का’ यूनानी संबंधवाचक संरचना की व्यापकता बनाए रखता है।
theological_decisions:
- issue: पाप के सुख का आशय
  choice: इसे सामान्य रूप से ‘पाप का थोड़े समय का सुख’ कहा गया है।
  alternative: इसे विशेष रूप से फ़िरौन के राजदरबार के विशेषाधिकारों और समझौतों, या मिस्र से जुड़े सभी पापपूर्ण सुखों के रूप में समझा जा सकता है।
  rationale: यूनानी पाठ पाप के विशिष्ट कार्यों को नहीं बताता; इसलिए अनुवाद परमेश्वर की प्रजा के साथ एकजुटता और पाप से जुड़े अल्पकालिक सुख के बीच नैतिक विरोध को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण शैली। पद 24 के मूसा-विषयक प्रवाह को स्पष्ट करने के लिए निहित कर्ता ‘उसने’ दिया गया है।
