translation:
  language: hi
  text: और दूसरों ने उपहास और कोड़ों की मार झेली,[a] और यहाँ तक कि बेड़ियाँ और कैद भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उपहास और कोड़ों की मार की परीक्षा से गुज़रे, और यहाँ तक कि बेड़ियों और कैद की भी।” यूनानी में अधिक शाब्दिक रूप से, “...की परीक्षा प्राप्त की” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἕτεροι
  choice: कुछ दूसरे लोगों
  rationale: यह अनिश्चित बहुवचन विशेषण पिछली सूची से अलग विश्वासयोग्य पीड़ितों के एक और समूह को दर्शाता है; यह हिंदी में विरोध और अनिश्चितता दोनों स्पष्ट करता है।
- source_word: ἐμπαιγμῶν
  choice: उपहास
  rationale: यह सार्वजनिक हँसी-ठट्ठे और अपमान को गरिमापूर्ण, सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: μαστίγων
  choice: कोड़े खाए जाने
  rationale: यह कोड़ों से शारीरिक दंड दिए जाने का स्पष्ट अर्थ देता है और हिंदी में अनुभव/परीक्षा की संरचना के साथ स्वाभाविक बैठता है।
- source_word: πεῖραν ἔλαβον
  choice: परीक्षा सही
  rationale: यूनानी मुहावरे का शाब्दिक भाव ‘परीक्षा का अनुभव पाया’ है। ‘परीक्षा सही’ कष्ट को झेलने और उसके द्वारा परखे जाने—दोनों भावों को बनाए रखता है।
- source_word: ἔτι δὲ
  choice: और यहाँ तक कि
  rationale: यह उपहास और कोड़ों से बेड़ियों और कैद तक बढ़ती हुई तीव्रता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: δεσμῶν
  choice: बेड़ियों
  rationale: यह बंदी बनाने के ठोस बंधनों को स्पष्ट और चित्रात्मक रूप से व्यक्त करता है।
- source_word: φυλακῆς
  choice: कैद
  rationale: इस संदर्भ में यह कारावास की दशा को संक्षिप्त, स्वाभाविक और आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: πεῖραν ἔλαβον में अनुभव और परीक्षा—दोनों का भाव
  choice: ‘परीक्षा सही’ के द्वारा परीक्षण और कष्ट सहने का संयुक्त भाव रखा गया
  alternative: ‘अनुभव किया’ या ‘झेला’
  rationale: केवल ‘अनुभव किया’ परीक्षा का भाव कमजोर करता, जबकि केवल ‘झेला’ यूनानी πεῖρα की परीक्षण-संबंधी अर्थछाया खो सकता था।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। ‘कुछ दूसरे लोगों’ से ἕτεροι का समूहगत विरोध स्पष्ट किया गया है। मुख्य पाठ में यूनानी मुहावरे की परीक्षण-संबंधी अर्थछाया रखी गई है और पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
