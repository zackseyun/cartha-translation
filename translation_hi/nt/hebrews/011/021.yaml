source:
  edition: SBLGNT
  text: πίστει Ἰακὼβ ἀποθνῄσκων ἕκαστον τῶν υἱῶν Ἰωσὴφ εὐλόγησεν, καὶ προσεκύνησεν ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/021.yaml
  text: By faith Jacob[a], as he was dying, blessed each of the sons of Joseph[b], and worshiped while leaning on the top of his staff.
translation:
  language: hi
  text: विश्वास से याकूब ने मरते समय यूसुफ के प्रत्येक पुत्र को आशीर्वाद दिया और अपनी लाठी के ऊपरी सिरे का सहारा लेकर आराधना की।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक अक्षरशः, “अपनी लाठी के ऊपरी सिरे की ओर आराधना में झुका।” यह वाक्यांश सम्भवतः याकूब की मुद्रा बताता है, न कि यह कि लाठी उसकी आराधना का लक्ष्य थी।
    reason: lexical_alternative
  - marker: b
    text: उत्पत्ति 47:31 के इब्रानी पाठ में है, “अपने बिछौने के सिरहाने पर आराधना में झुका।” इस पद का यूनानी पाठ यहाँ “लाठी” कहता है।
    reason: textual_variant
lexical_decisions:
- source_word: πίστει
  choice: विश्वास से
  rationale: इब्रानियों 11 में यह साधन अथवा रीति बताने वाला प्रयोग है; यह स्वाभाविक हिन्दी में प्रकट करता है कि याकूब के कार्य विश्वास में और विश्वास के द्वारा किए गए।
- source_word: ἀποθνῄσκων
  choice: मरते समय
  rationale: वर्तमान कृदन्त मुख्य क्रियाओं के साथ-साथ चल रही परिस्थिति बताता है। ‘मरते समय’ इस कालगत अर्थ को सहज और संक्षिप्त हिन्दी में रखता है।
- source_word: ἕκαστον τῶν υἱῶν Ἰωσὴφ
  choice: यूसुफ के पुत्रों में से हर एक को
  rationale: 'ἕκαστον और संबंधकारक बहुवचन का वितरणात्मक बल सुरक्षित रहता है: प्रत्येक पुत्र को अलग-अलग आशीर्वाद मिला।'
- source_word: εὐλόγησεν
  choice: आशीर्वाद दिया
  rationale: यह εὐλογέω का प्रचलित, स्पष्ट और उत्पत्ति-वृत्तांत के अनुकूल हिन्दी रूप है।
- source_word: προσεκύνησεν
  choice: आराधना की
  rationale: यहाँ προσκυνέω केवल शारीरिक रूप से झुकने की अपेक्षा परमेश्वर के प्रति धार्मिक श्रद्धा का कार्य व्यक्त करता है।
- source_word: ἐπὶ τὸ ἄκρον τῆς ῥάβδου αὐτοῦ
  choice: अपनी लाठी के ऊपरी सिरे का सहारा लेकर
  rationale: यूनानी वाक्यांश अक्षरशः कठिन और कुछ हद तक अस्पष्ट है। यह रूप सम्भावित शारीरिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है और लाठी को आराधना का लक्ष्य बताने से बचता है; वैकल्पिक समझ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अन्तिम उपवाक्य में याकूब की आराधना और लाठी के बीच संबंध
  choice: याकूब ने लाठी के ऊपरी सिरे का सहारा लेते हुए परमेश्वर की आराधना की।
  alternative: याकूब ने अपनी लाठी के ऊपरी सिरे की ओर आराधना में झुककर प्रणाम किया।
  rationale: यूनानी ἐπί के साथ कर्मकारक दिशा अथवा संबंध बता सकता है, पर प्रसंग में यह सम्भवतः दुर्बल याकूब की मुद्रा का वर्णन है। मुख्य पाठ में सहज अर्थ दिया गया है, जबकि अधिक अक्षरशः विकल्प पादटिप्पणी में रखा गया है ताकि वास्तविक अस्पष्टता न मिटे।
- issue: इब्रानियों 11:21 के यूनानी पाठ और उत्पत्ति 47:31 के इब्रानी पाठ का अंतर
  choice: मुख्य पाठ में SBLGNT के ῥάβδος के अनुसार ‘लाठी’ रखा गया है।
  alternative: उत्पत्ति 47:31 के इब्रानी पाठ के अनुसार ‘बिछौने का सिरहाना’।
  rationale: इब्रानियों के उपलब्ध यूनानी पाठ को प्राथमिकता देना आवश्यक है; फिर भी उत्पत्ति के इब्रानी पाठ में पाए जाने वाले भिन्न पाठ-रूप को महत्त्वपूर्ण अंतर्पाठीय जानकारी के रूप में पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘विश्वास से’, ‘आशीर्वाद दिया’ और ‘आराधना की’ जैसे परिचित धार्मिक पद रखे गए हैं, पर वाक्य को अत्यधिक परम्परागत या संस्कृतनिष्ठ नहीं बनाया गया।
