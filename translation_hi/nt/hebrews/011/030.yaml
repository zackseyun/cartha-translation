    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: विश्वास से
  rationale: यह πίστις का करण अथवा रीति-सूचक चतुर्थी-प्रयोग है। ‘विश्वास से’ इब्रानियों 11 में बार-बार आने वाली अभिव्यक्ति की लय बनाए रखता है और साधन तथा रीति—दोनों अर्थछायाओं के लिए पर्याप्त खुला है।
- source_word: τὰ τείχη Ἰεριχὼ
  choice: यरीहो की दीवारें
  rationale: τεῖχος यहाँ नगर की सुरक्षा-दीवार को दर्शाता है; बहुवचन के लिए ‘दीवारें’ स्वाभाविक है। Ἰεριχώ स्थानवाचक नाम है, जिसे प्रचलित हिन्दी रूप ‘यरीहो’ दिया गया है।
- source_word: ἔπεσαν
  choice: गिर पड़ीं
  rationale: πίπτω के सामान्य अर्थ ‘गिरना’ को व्यक्त करता है। ‘ढह गईं’ की तुलना में यह यूनानी के अधिक निकट है और हिन्दी में भी स्वाभाविक है।
- source_word: κυκλωθέντα
  choice: उनका चक्कर लगाया गया था
  rationale: κυκλόω के अओरिस्ट कर्मवाच्य कृदन्त में दीवारों के चारों ओर जाने की पूर्ववर्ती क्रिया व्यक्त होती है। यह अनुवाद कर्मवाच्य दृष्टिकोण बनाए रखता है और ‘घेराबंदी’ जैसा अधिक विशिष्ट सैन्य अर्थ नहीं जोड़ता।
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: सात दिन तक
  rationale: ἐπί और कालवाचक द्वितीया अवधि को दर्शाते हैं; आधुनिक हिन्दी में ‘सात दिन तक’ इसका सहज समतुल्य है।
theological_decisions:
- issue: इब्रानियों 11:30 में πίστις का अनुवाद
  choice: विश्वास
  alternative: निष्ठा; भरोसा
  rationale: इब्रानियों 11 की पुनरावृत्त अभिव्यक्ति और विश्वास के उदाहरणों का प्रसंग यहाँ ‘विश्वास’ का समर्थन करता है। ‘निष्ठा’ या ‘भरोसा’ चुनने से अर्थ अनावश्यक रूप से संकुचित हो सकता है।
- issue: πίστει में साधन और रीति की अर्थछाया
  choice: विश्वास से
  alternative: विश्वास के द्वारा
  rationale: ‘विश्वास से’ हिन्दी में अध्याय की परिचित सूत्रात्मक अभिव्यक्ति को बनाए रखते हुए साधन और रीति के बीच यूनानी की सम्भावित अस्पष्टता को सुरक्षित रखता है; वैकल्पिक रूप पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की संरचना यूनानी के कर्मवाच्य कृदन्त को स्वाभाविक हिन्दी में व्यक्त करती है और इब्रानियों 11 के ‘विश्वास से’ वाले सूत्र को बनाए रखती है।
