id: HEB.11.28
reference: Hebrews 11:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πίστει πεποίηκεν τὸ πάσχα καὶ τὴν πρόσχυσιν τοῦ αἵματος, ἵνα μὴ ὁ ὀλοθρεύων τὰ πρωτότοκα θίγῃ αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/028.yaml
  text: By faith he has kept the Passover and the sprinkling of the blood[a], so that the destroyer of the firstborn might not touch them.
translation:
  language: hi
  text: विश्वास से उसने फसह मनाया और लहू का छिड़काव[a] किया, ताकि पहिलौठों का नाश करने वाला उन्हें छू न सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लहू लगाना।” यूनानी शब्द अनुष्ठान के रूप में लहू लगाए जाने को दर्शाता है। “छिड़काव” पारंपरिक धार्मिक अभिव्यक्ति है, जबकि फसह के प्रसंग में “लगाना” अधिक विशिष्ट हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: विश्वास से
  rationale: यह साधनसूचक दत्तिव है और इब्रानियों 11 में बार-बार आने वाली अभिव्यक्ति को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: πεποίηκεν
  choice: मनाया ... किया
  rationale: पूर्णकालीन क्रिया यहाँ फसह के पालन और लहू लगाने की विधि को पूरा करने का बोध देती है। हिंदी में दोनों कर्मों के साथ अलग-अलग स्वाभाविक क्रियाएँ आवश्यक हैं।
- source_word: τὸ πάσχα
  choice: फसह
  rationale: यह पर्व, उसका अनुष्ठान और भोज—इन सबको समेट सकने वाला पारंपरिक और व्यापक बाइबलीय पद है।
- source_word: τὴν πρόσχυσιν τοῦ αἵματος
  choice: लहू का छिड़काव
  rationale: यह अनुष्ठानिक रूप से लहू लगाए जाने का पारंपरिक प्रतिपादन है; निर्गमन 12 के संदर्भ में 'लहू लगाना' भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἵνα μὴ
  choice: ताकि ... न सके
  rationale: यह उद्देश्यवाचक बल को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ὁ ὀλοθρεύων
  choice: नाश करने वाला
  rationale: मूल में संज्ञा के रूप में प्रयुक्त कृदंत है। 'नाश करने वाला स्वर्गदूत' कहने से वह पहचान जोड़ दी जाती जो यूनानी पाठ में स्पष्ट नहीं है।
- source_word: τὰ πρωτότοκα
  choice: पहिलौठों
  rationale: मूल का संज्ञार्थक बहुवचन व्यापक है; इसमें अपनी ओर से 'बच्चे' या 'पुत्र' नहीं जोड़ा गया।
- source_word: θίγῃ
  choice: छू न सके
  rationale: यह क्रिया के मूल अर्थ 'छूना' को सुरक्षित रखता है, जबकि संदर्भ में उस स्पर्श के घातक परिणाम निहित हैं।
- source_word: αὐτῶν
  choice: उन्हें
  rationale: मूल के संक्षिप्त सर्वनाम को बनाए रखता है और 'इस्राएलियों' जैसा स्पष्ट संज्ञापद नहीं जोड़ता।
theological_decisions:
- issue: πεποίηκεν का निहित कर्ता
  choice: सर्वनाम 'उसने' रखा गया; संदर्भ में कर्ता मूसा है।
  alternative: नाम को स्पष्ट करके 'मूसा ने' कहना।
  rationale: इब्रानियों 11:23–29 का संदर्भ मूसा की ओर संकेत करता है, पर यूनानी पाठ यहाँ नाम दोहराता नहीं है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इब्रानियों 11 का व्यापक विषय और दोहराया गया सूत्र यहाँ 'विश्वास' का समर्थन करता है; 'विश्वासयोग्यता' इस प्रसंग में कम संभावित है।
- issue: ὁ ὀλοθρεύων की पहचान
  choice: नाश करने वाला
  alternative: नाश करने वाला स्वर्गदूत
  rationale: मूल पाठ विनाश करने वाले की पहचान 'स्वर्गदूत' के रूप में स्पष्ट नहीं करता, इसलिए उस व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और पाठयोग्य शैली अपनाई गई है। 'फसह', 'लहू' और 'पहिलौठे' जैसे परिचित बाइबलीय शब्द संदर्भ और अंतरपाठीय संबंध बनाए रखने के लिए रखे गए हैं।
