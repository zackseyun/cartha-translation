  text: Πίστει διέβησαν τὴν Ἐρυθρὰν Θάλασσαν ὡς διὰ ξηρᾶς ⸀γῆς, ἧς πεῖραν λαβόντες οἱ Αἰγύπτιοι κατεπόθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/029.yaml
  text: By faith they crossed the Red Sea as through dry land[a], of which the Egyptians, when they attempted it, were swallowed up.
translation:
  language: hi
  text: विश्वास से वे लाल समुद्र[a] को ऐसे पार कर गए, मानो सूखी भूमि पर होकर जा रहे हों; और जब मिस्रियों ने उसे पार करने का प्रयास किया, तो वे निगल लिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सरकंडों का समुद्र।” यहाँ यूनानी पाठ में “लाल समुद्र” (Ἐρυθρὰν Θάλασσαν) है, जबकि निर्गमन की पुस्तक में आए मूल इब्रानी स्थान-नाम को कभी-कभी “सरकंडों का समुद्र” समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: विश्वास ही से
  rationale: करणवाचक अर्थ को व्यक्त करता है और इब्रानियों 11 में बार-बार आने वाले सूत्र को स्वाभाविक, स्पष्ट हिन्दी में बनाए रखता है।
- source_word: διέβησαν
  choice: पार कर गए
  rationale: एक ओर से दूसरी ओर जाने की पूर्ण घटना को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν Ἐρυθρὰν Θάλασσαν
  choice: लाल समुद्र
  rationale: यूनानी पाठ का सीधा अर्थ और बाइबिलीय यूनानी में प्रचलित नाम यही है; निर्गमन के इब्रानी स्थान-नाम से जुड़ा विकल्प पादटिप्पणी में रखा गया है।
- source_word: ὡς διὰ ξηρᾶς γῆς
  choice: ऐसे ... मानो सूखी भूमि पर चल रहे हों
  rationale: ὡς की तुलनात्मक शक्ति तथा सूखी भूमि का चित्र दोनों बनाए रखते हुए हिन्दी में स्वाभाविक वाक्य देता है।
- source_word: ἧς πεῖραν λαβόντες
  choice: जब मिस्रियों ने भी ऐसा करने का प्रयास किया
  rationale: यूनानी मुहावरे का अर्थ 'प्रयास करना' है; 'ऐसा' उसी समुद्र-पार करने की क्रिया की ओर संकेत करता है। 'भी' दोनों समूहों द्वारा एक ही कार्य किए जाने के प्रयास को स्पष्ट करता है।
- source_word: οἱ Αἰγύπτιοι
  choice: मिस्रियों
  rationale: निर्गमन की घटना में मिस्र की पीछा करती हुई शक्ति के लिए सामान्य और सुबोध जातिवाचक रूप।
- source_word: κατεπόθησαν
  choice: निगल लिए गए
  rationale: καταπίνω के सजीव 'निगल जाना' रूपक और उसके कर्मवाच्य बल को सुरक्षित रखता है; केवल 'डूब गए' कहना अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: इब्रानियों 11 में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: अध्याय में Πίστει बार-बार आने वाला प्रमुख सूत्र है। इस प्रसंग में उदाहरण देने वालों का विश्वास केंद्र में है; 'विश्वासयोग्यता' संदर्भानुसार कम उपयुक्त है।
- issue: मिस्रियों के अंत का चित्रण
  choice: निगल लिए गए
  alternative: डूब गए; जल में समा गए
  rationale: यूनानी पाठ के सजीव रूपक और कर्मवाच्य को बनाए रखा गया है, बिना घटना को केवल उसके परिणाम के रूप में समझाकर सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में यूनानी की तुलना और विरोध को स्वाभाविक हिन्दी क्रम में रखा गया है; रूपक तथा पाठगत स्थान-नाम की अनिश्चितता सुरक्षित है।
