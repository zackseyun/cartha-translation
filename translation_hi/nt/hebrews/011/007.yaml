source:
  edition: SBLGNT
  text: πίστει χρηματισθεὶς Νῶε περὶ τῶν μηδέπω βλεπομένων εὐλαβηθεὶς κατεσκεύασεν κιβωτὸν εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ, δι’ ἧς κατέκρινεν τὸν κόσμον, καὶ τῆς κατὰ πίστιν δικαιοσύνης ἐγένετο κληρονόμος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/007.yaml
  text: By faith Noah[a], having been warned about things not yet seen, in reverent fear constructed an ark for the salvation of his household[d][c][b], through which he condemned the world and became heir of the righteousness according to faith.
translation:
  language: hi
  text: विश्वास के द्वारा नूह ने उन बातों के विषय में, जो अभी तक दिखाई नहीं दे रही थीं, चेतावनी पाकर[a] श्रद्धापूर्ण भय के साथ[b] अपने घराने को बचाने के लिए एक जहाज़ बनाया। जिसके द्वारा[c] उसने संसार को दोषी ठहराया और विश्वास के अनुसार धार्मिकता[d] का वारिस बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दैवी निर्देश पाकर” अथवा “दैवी संदेश पाकर।”
    reason: lexical_alternative
  - marker: b
    text: या, “भक्ति-भय से प्रेरित होकर।”
    reason: lexical_alternative
  - marker: c
    text: “जिसके द्वारा” का सबसे स्वाभाविक संकेत जहाज़ की ओर है; कुछ इसे अधिक व्यापक रूप से नूह के विश्वास या उसकी आज्ञाकारी प्रतिक्रिया की ओर संकेत मानते हैं।
    reason: alternative_reading
  - marker: d
    text: “धार्मिकता” के लिए “न्याय” भी संभव है; यहाँ विश्वास और विरासत का प्रसंग “धार्मिकता” को उपयुक्त बनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: विश्वास ही से
  rationale: वाक्य के आरंभ में साधनसूचक प्रयोग है और इब्रानियों 11 की आवर्ती शैली को दर्शाता है; ‘ही’ विश्वास पर दिए गए बल को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: χρηματισθεὶς
  choice: परमेश्वर से चेतावनी पाकर
  rationale: निष्क्रिय कृदन्त किसी दैवी संदेश अथवा चेतावनी को पाने का भाव देता है। हिन्दी में दैवी स्रोत को स्पष्ट करना नूह के प्रसंग के अनुरूप है, जबकि पादटिप्पणी व्यापक ‘दैवी निर्देश’ वाले अर्थ को सुरक्षित रखती है।
- source_word: περὶ τῶν μηδέπω βλεπομένων
  choice: उन बातों के विषय में, जो तब तक दिखाई नहीं दी थीं
  rationale: μηδέπω के ‘अभी/तब तक नहीं’ वाले कालगत भाव और आने वाली अदृश्य घटनाओं, दोनों को स्पष्ट रखता है।
- source_word: εὐλαβηθεὶς
  choice: श्रद्धापूर्ण भय के साथ
  rationale: यह केवल आतंक नहीं, बल्कि परमेश्वर की चेतावनी के प्रति श्रद्धा और सावधानी से भरी प्रतिक्रिया व्यक्त करता है।
- source_word: κατεσκεύασεν
  choice: बनाया
  rationale: जहाज़ के निर्माण के लिए सहज और वर्तमान हिन्दी; ‘तैयार किया’ भी संभव है, पर ‘बनाया’ वास्तविक निर्माण को अधिक सीधे व्यक्त करता है।
- source_word: κιβωτὸν
  choice: एक जहाज़
  rationale: नूह के प्रसंग में हिन्दी पाठकों के लिए स्थापित और सहज अर्थ; शाब्दिक ‘सन्दूक’ इस संदर्भ में भ्रामक होगा।
- source_word: εἰς σωτηρίαν τοῦ οἴκου αὐτοῦ
  choice: अपने घराने को बचाने के लिए
  rationale: σωτηρία का यहाँ तत्काल अर्थ प्रलय से बचाव है, और οἶκος के लिए ‘घराना’ केवल निकट परिवार से कुछ व्यापक सामूहिक अर्थ बनाए रखता है।
- source_word: δι’ ἧς
  choice: उसी के द्वारा
  rationale: स्त्रीलिंग सम्बन्धवाचक सर्वनाम का निकटतम व्याकरणिक पूर्वपद κιβωτός है; हिन्दी में ‘उसी’ जहाज़ की ओर संकेत करता है, जबकि वैकल्पिक व्यापक समझ पादटिप्पणी में दी गई है।
- source_word: κατέκρινεν τὸν κόσμον
  choice: उसने संसार को दोषी ठहराया
  rationale: क्रिया के न्यायिक और निषेधात्मक भाव को सीधे रखता है; नूह की विश्वासपूर्ण आज्ञाकारिता संसार के दोष को उजागर करती है।
- source_word: τῆς κατὰ πίστιν δικαιοσύνης
  choice: विश्वास के अनुसार मिलने वाली धार्मिकता
  rationale: κατά को ‘के अनुसार’ के रूप में सुरक्षित रखते हुए हिन्दी में सम्बन्ध स्पष्ट किया गया है; ‘मिलने वाली’ विरासत के प्रसंग में स्वाभाविक है, पर यह साधन और आधार के प्रश्न को पूरी तरह परिभाषित नहीं करता।
- source_word: ἐγένετο κληρονόμος
  choice: वारिस बना
  rationale: परिणामी स्थिति को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: χρηματισθεὶς में दैवी स्रोत को स्पष्ट करना
  choice: परमेश्वर से चेतावनी पाकर
  alternative: दैवी निर्देश पाकर; चेतावनी पाकर
  rationale: यूनानी निष्क्रिय रूप में दैवी संप्रेषण निहित हो सकता है और उत्पत्ति के नूह-वृत्तान्त में स्रोत परमेश्वर है। फिर भी क्रिया का अर्थ केवल चेतावनी से व्यापक हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: εὐλαβηθεὶς का भाव
  choice: श्रद्धापूर्ण भय के साथ
  alternative: भक्ति-भय से प्रेरित होकर; श्रद्धा के साथ
  rationale: यह शब्द सामान्य डर तक सीमित नहीं है; इसमें दैवी चेतावनी के प्रति श्रद्धा, सावधानी और आज्ञाकारी प्रतिक्रिया सम्मिलित है।
- issue: δι’ ἧς का पूर्वपद
  choice: उसी के द्वारा—अर्थात् जहाज़ के द्वारा
  alternative: विश्वास के द्वारा; नूह की विश्वासपूर्ण आज्ञाकारिता के द्वारा
  rationale: निकटतम स्त्रीलिंग संज्ञा κιβωτός होने के कारण जहाज़ सबसे स्वाभाविक व्याकरणिक पूर्वपद है, यद्यपि पूरे विश्वासपूर्ण प्रत्युत्तर का व्यापक अर्थ भी संभव समझा गया है।
- issue: δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्यायपरायणता; धर्मी ठहराए जाने की स्थिति
  rationale: विरासत और विश्वास के सम्बन्ध वाले इस प्रसंग में ‘धार्मिकता’ यूनानी पद की नैतिक, सम्बन्धात्मक और न्यायिक व्यापकता को किसी एक व्यवस्थित सिद्धान्त में सीमित किए बिना बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सार्वजनिक पाठ के योग्य शैली। ‘जहाज़’, ‘घराना’, ‘दोषी ठहराया’ और ‘वारिस’ सामान्य पाठक के लिए सहज हैं। मूल यूनानी की दैवी चेतावनी, श्रद्धापूर्ण भय, δι’ ἧς की संदिग्धता और δικαιοσύνη की धर्मवैज्ञानिक व्यापकता को मुख्य पाठ तथा पादटिप्पणियों में संतुलित रखा गया है।
