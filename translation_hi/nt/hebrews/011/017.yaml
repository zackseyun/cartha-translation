theological_decisions:
- issue: इसहाक के लिए μονογενῆ का अनुवाद, जबकि अब्राहम का एक और जैविक पुत्र भी था
  choice: एकमात्र पुत्र
  alternative: अद्वितीय पुत्र; इकलौता पुत्र; एकलौता जन्मा पुत्र
  rationale: यह पद इसहाक को प्रतिज्ञा के विशिष्ट और अद्वितीय उत्तराधिकारी के रूप में प्रस्तुत करता है। मुख्य पाठ का संक्षिप्त रूप और पादटिप्पणी मिलकर इस बल को रखते हैं, बिना यह आग्रह किए कि अब्राहम की कोई अन्य जैविक संतान नहीं थी।
