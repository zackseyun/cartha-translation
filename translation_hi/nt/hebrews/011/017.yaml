  yaml_path: translation/nt/hebrews/011/017.yaml
  text: By faith Abraham[a], when he was being tested, offered up Isaac, and the one who had received the promises was offering up his one and only son,
translation:
  language: hi
  text: विश्वास के द्वारा अब्राहम ने, जब उसकी परीक्षा ली जा रही थी, इसहाक को अर्पित किया; और प्रतिज्ञाएँ प्राप्त करने वाला अपने अद्वितीय पुत्र[a] को अर्पित कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एकमात्र पुत्र।” यूनानी शब्द इसहाक की अनोखी और विशिष्ट स्थिति पर बल देता है। “एकलौता जन्मा” एक पारंपरिक विकल्प है, पर आधुनिक हिन्दी में इसका अर्थ भ्रामक हो सकता है।
    reason: lexical_alternative
