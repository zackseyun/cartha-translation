  text: By faith Enoch was taken away so that he should not see death[a], and he was not found because God had taken him away. For before his being taken away, he had been commended as having pleased God[c][b],
translation:
  language: hi
  text: विश्वास के द्वारा हनोक को उठा लिया गया, ताकि वह मृत्यु को न देखे[a]; और वह नहीं मिला, क्योंकि परमेश्वर ने उसे उठा लिया था। क्योंकि उठाए जाने से पहले उसके विषय में यह गवाही दी गई थी कि उसने परमेश्वर को प्रसन्न किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, मृत्यु का अनुभव न करे। ‘मृत्यु को देखना’ यूनानी का एक मुहावरा है, जिसे मुख्य पाठ में बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: विश्वास के द्वारा
  rationale: πίστις का प्रसंगानुकूल और परियोजना-संगत अर्थ ‘विश्वास’ है; करणवाचक दत्तिव को ‘के द्वारा’ स्पष्ट करता है।
- source_word: μετετέθη / μετέθηκεν / μεταθέσεως
  choice: उठा लिया गया / उठा लिया था / उठाए जाने
  rationale: यहाँ शब्द हनोक को परमेश्वर द्वारा सांसारिक जीवन से हटा लिए जाने का संकेत देता है। ‘उठा लिया’ स्वाभाविक हिंदी है, कर्मवाच्य और तीनों संबंधित रूपों की शब्दगत एकरूपता बनाए रखता है, पर गंतव्य या प्रक्रिया के बारे में अतिरिक्त बात नहीं जोड़ता।
- source_word: τοῦ μὴ ἰδεῖν θάνατον
  choice: ताकि वह मृत्यु को न देखे
  rationale: सप्रयोजन/परिणामसूचक रचना और मूल यूनानी मुहावरे ‘मृत्यु को देखना’ को सुरक्षित रखा गया है; अर्थ है मृत्यु का अनुभव करना।
- source_word: οὐχ ηὑρίσκετο
  choice: उसका पता न चला
  rationale: यह आधुनिक हिंदी में स्वाभाविक रूप से बताता है कि हनोक नहीं मिला, और खोजने वाले को मूल पाठ की तरह अनिर्दिष्ट रखता है।
- source_word: μεμαρτύρηται
  choice: उसके विषय में यह गवाही दी गई थी
  rationale: पूर्ण कर्मवाच्य को स्पष्ट रूप में सुरक्षित रखता है और ‘प्रशंसा की गई’ जैसे अधिक व्याख्यात्मक अनुवाद से बचता है।
- source_word: εὐαρεστηκέναι τῷ θεῷ
  choice: कि उसने परमेश्वर को प्रसन्न किया था
  rationale: पूर्ण infinitive के पूर्वकालिक भाव को स्वाभाविक हिंदी में व्यक्त करता है और गवाही की विषयवस्तु स्पष्ट करता है।
- source_word: γὰρ
  choice: दरअसल
  rationale: यह पिछले कथन के आधार या पुष्टि का परिचय देता है; हिंदी में ‘दरअसल’ इस संबंध को सहजता से व्यक्त करता है।
theological_decisions:
- issue: हनोक के μετατίθημι का आशय
  choice: ‘उठा लिया गया’ कहकर मूल दावे तक सीमित रहना
  alternative: ‘स्वर्ग में उठा लिया गया’ या पारंपरिक किंतु अस्पष्ट ‘स्थानांतरित किया गया’
  rationale: पद कहता है कि परमेश्वर ने हनोक को इस प्रकार हटा लिया कि उसने मृत्यु नहीं देखी, पर इसी पद में उसके गंतव्य या प्रक्रिया का विस्तार नहीं है।
- issue: ‘मृत्यु को देखना’ मुहावरे का स्वरूप
  choice: मुख्य पाठ में ‘मृत्यु को न देखे’ बनाए रखना
  alternative: ‘मृत्यु का अनुभव न करे’
  rationale: मुहावरा हिंदी में समझने योग्य है और स्रोत की साहित्यिक बनावट बनाए रखता है; अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- issue: μεμαρτύρηται में गवाही का कर्ता
  choice: कर्मवाच्य ‘गवाही दी गई थी’ रखना
  alternative: ‘परमेश्वर ने उसके विषय में गवाही दी थी’
  rationale: निकट प्रसंग में गवाही का संबंध परमेश्वर और धर्मग्रंथ दोनों से समझा जा सकता है; यूनानी यहाँ कर्ता को स्पष्ट नहीं करता, इसलिए उसे पाठ में जोड़ना उचित नहीं।
