  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘उठा लिया’ सामान्य पाठक के लिए बोधगम्य है और स्रोत से अधिक विशिष्ट धार्मिक व्याख्या नहीं जोड़ता। मुख्य पाठ का [a] चिह्न संबंधित पादटिप्पणी से मेल खाता है।
