source:
  edition: SBLGNT
  text: πίστει Ῥαὰβ ἡ πόρνη οὐ συναπώλετο τοῖς ἀπειθήσασιν, δεξαμένη τοὺς κατασκόπους μετ’ εἰρήνης.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/031.yaml
  text: By faith Rahab the prostitute did not perish with those who were disobedient[b][a], because she had welcomed the spies in peace.
translation:
  language: hi
  text: विश्वास से वेश्या राहाब उन लोगों के साथ नाश नहीं हुई जिन्होंने आज्ञा नहीं मानी, क्योंकि उसने जासूसों का शांति से स्वागत किया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: विश्वास ही से
  rationale: साधनवाचक दत्तिव और इब्रानियों 11 की आवर्ती उदाहरण-सूत्र शैली को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ही’ विश्वास पर अपेक्षित बल देता है।
- source_word: Ῥαὰβ
  choice: राहाब
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: ἡ πόρνη
  choice: वेश्या
  rationale: πόρνη का सीधा, आधुनिक और स्पष्ट अर्थ; यह मूल के सामाजिक और नैतिक बल को शिष्टोक्ति से नहीं छिपाता।
- source_word: οὐ συναπώλετο
  choice: उन लोगों के साथ नाश नहीं हुई
  rationale: συναπόλλυμι के ‘साथ नाश होना’ वाले संयुक्त अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: τοῖς ἀπειθήσασιν
  choice: जिन्होंने आज्ञा नहीं मानी
  rationale: ἀπειθέω के अवज्ञा-संबंधी नैतिक और इच्छात्मक भाव को व्यक्त करता है, बिना इसे केवल ‘अविश्वास’ तक सीमित किए।
- source_word: δεξαμένη
  choice: क्योंकि उसने ... स्वागत किया
  rationale: अओरिस्ट कृदन्त को यहाँ मुख्य कथन के कारण या संबद्ध परिस्थिति के रूप में स्वाभाविक हिन्दी में खोला गया है।
- source_word: τοὺς κατασκόπους
  choice: भेदियों
  rationale: κατάσκοπος के लिए संक्षिप्त और बाइबलीय प्रसंग में परिचित हिन्दी शब्द।
- source_word: μετ’ εἰρήνης
  choice: शान्ति से
  rationale: स्वागत के शांतिपूर्ण और मैत्रीपूर्ण ढंग को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इब्रानियों 11 के उदाहरण-सूत्र में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: πίστει और नामित उदाहरण की रचना में ‘विश्वास’ सबसे स्वाभाविक और स्थापित अर्थ है; ‘भरोसा’ निकटार्थी है, जबकि ‘विश्वासयोग्यता’ यहाँ कम संभावित है।
- issue: ἀπειθήσασιν में अवज्ञा और अविश्वास का संबंध
  choice: जिन्होंने आज्ञा नहीं मानी
  alternative: अविश्वासी लोगों
  rationale: मूल क्रिया अवज्ञा या बात न मानने को सीधे व्यक्त कर सकती है। ‘अविश्वासी’ अर्थ-संबंध को दिखाता है, पर नैतिक-इच्छात्मक पहलू को संकुचित कर सकता है।
- issue: δεξαμένη का मुख्य कथन से संबंध
  choice: क्योंकि उसने ... स्वागत किया
  alternative: उसने ... स्वागत करके; भेदियों का शान्ति से स्वागत करने पर
  rationale: कृदन्त का संबंध व्याकरणतः परिस्थिति या कारण के रूप में समझा जा सकता है। मुख्य पाठ में कारणात्मक संबंध प्रसंगानुकूल है, पर इसे उद्धार का स्वतंत्र अर्जित आधार बताने की अपेक्षा विश्वास की अभिव्यक्ति के रूप में पढ़ा जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘भेदियों’ का चयन ‘जासूसों’ की तुलना में बाइबलीय प्रसंग के अनुकूल और कम आधुनिक-राजनीतिक ध्वनि वाला है। मूल की संक्षिप्तता बनाए रखते हुए कृदन्त का संबंध स्वाभाविक हिन्दी के लिए कारणवाचक उपवाक्य में व्यक्त किया गया है।
