  text: νῦν δὲ κρείττονος ὀρέγονται, τοῦτ’ ἔστιν ἐπουρανίου. διὸ οὐκ ἐπαισχύνεται αὐτοὺς ὁ θεὸς θεὸς ἐπικαλεῖσθαι αὐτῶν, ἡτοίμασεν γὰρ αὐτοῖς πόλιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/016.yaml
  text: But as it is[a], they long for a better country—that is, a heavenly one. Therefore God is not ashamed to be called their God, for he has prepared a city for them.
translation:
  language: hi
  text: लेकिन अब वे एक बेहतर देश की लालसा रखते हैं—अर्थात् एक स्वर्गीय देश की।[a] इसलिए परमेश्वर उनका परमेश्वर कहलाने में लज्जित नहीं है, क्योंकि उसने उनके लिए एक नगर तैयार किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक बेहतर मातृभूमि—अर्थात् एक स्वर्गीय मातृभूमि।” यूनानी में संज्ञा यहाँ स्पष्ट रूप से नहीं दी गई है; दोनों स्त्रीलिंग विशेषण पिछले संदर्भ में निहित “देश/मातृभूमि” के विचार की ओर संकेत करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: νῦν δὲ
  choice: पर अब
  rationale: यह पिछले पद की काल्पनिक संभावना के विपरीत वर्तमान वास्तविकता प्रस्तुत करता है; हिंदी में ‘पर अब’ विरोध और वर्तमान स्थिति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: κρείττονος
  choice: उत्तम
  rationale: तुलनात्मक अर्थ ‘बेहतर/श्रेष्ठ’ है। ‘उत्तम’ इब्रानियों में बार-बार आने वाली श्रेष्ठता की भाषा को गरिमापूर्ण और सहज ढंग से व्यक्त करता है।
- source_word: ὀρέγονται
  choice: लालसा रखते हैं
  rationale: मध्यवाच्य क्रिया गहरी इच्छा और किसी वस्तु की ओर आकांक्षापूर्वक बढ़ने का भाव रखती है; ‘लालसा रखते हैं’ उस तीव्र आकांक्षा को व्यक्त करता है।
- source_word: κρείττονος ... ἐπουρανίου
  choice: एक उत्तम देश ... स्वर्गीय देश
  rationale: दोनों स्त्रीलिंग विशेषण पिछले संदर्भ के πατρίδα से जुड़े निहित संज्ञा की ओर संकेत करते हैं। हिंदी में ‘देश’ दोहराने से वाक्य स्पष्ट रहता है और निहित संज्ञा अनावश्यक रूप से अनिश्चित नहीं होती।
- source_word: διὸ
  choice: इसलिए
  rationale: यह उनकी स्वर्गीय देश की लालसा से परमेश्वर की प्रतिक्रिया का निष्कर्ष प्रस्तुत करता है।
- source_word: οὐκ ἐπαισχύνεται
  choice: लज्जित नहीं होता
  rationale: यह मूल क्रिया के लज्जा और मान-सम्मान संबंधी भाव को सीधे बनाए रखता है।
- source_word: θεὸς ἐπικαλεῖσθαι αὐτῶν
  choice: उनका परमेश्वर कहलाने
  rationale: यह नामित या संबोधित किए जाने का भाव तथा पुराना नियम-सदृश संबंधपरक सूत्र ‘उनका परमेश्वर’ दोनों सुरक्षित रखता है।
- source_word: ἡτοίμασεν
  choice: तैयार किया है
  rationale: ग्रीक अओरिस्ट पूर्ण की गई ऐसी तैयारी बताता है जिसकी वर्तमान प्रासंगिकता है; हिंदी पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: πόλιν
  choice: एक नगर
  rationale: अनिश्चित, बिना उपपद वाली संज्ञा का ठोस भाव सुरक्षित है और इब्रानियों की भावी नगरी की छवि बनी रहती है।
theological_decisions:
- issue: κρείττονος और ἐπουρανίου के साथ निहित स्त्रीलिंग संज्ञा
  choice: पिछले संदर्भ की πατρίς के आधार पर ‘देश’ जोड़ा गया
  alternative: ‘मातृभूमि’ जोड़ना, अथवा ‘किसी उत्तम वस्तु’ जैसा अस्पष्ट अनुवाद रखना
  rationale: ग्रीक में इस पद में संज्ञा व्यक्त नहीं है, पर पद 14 का πατρίδα अर्थ को नियंत्रित करता है। ‘देश’ स्पष्ट और तटस्थ है; ‘मातृभूमि’ अधिक भावात्मक अर्थ जोड़ सकती है।
- issue: ‘उनका परमेश्वर’ का संबंधपरक सूत्र
  choice: सूत्र को बिना विस्तार के यथावत रखा गया
  alternative: ‘उन्हें अपनी प्रजा मानने’ के रूप में व्याख्यात्मक विस्तार
  rationale: मूल पाठ विशेष रूप से परमेश्वर के ‘उनका परमेश्वर’ कहलाने की बात कहता है; प्रजा संबंधी विस्तार संदर्भानुकूल हो सकता है, पर यहाँ स्पष्ट रूप से लिखा नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘उत्तम देश’ और ‘स्वर्गीय देश’ मूल की तुलना तथा व्याख्यात्मक पुनर्निर्देशन को स्पष्ट रखते हैं। सभी सर्वनाम और संबंधपरक पद बिना सांप्रदायिक विस्तार के रखे गए हैं।
