source:
  edition: SBLGNT
  text: Καὶ τί ἔτι λέγω; ἐπιλείψει ⸂με γὰρ⸃ διηγούμενον ὁ χρόνος περὶ Γεδεών, Βαράκ, ⸀Σαμψών, Ἰεφθάε, Δαυίδ τε καὶ Σαμουὴλ καὶ τῶν προφητῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/032.yaml
  text: And what more shall I say? For time would fail me if I were telling about Gideon[a], Barak, Samson, Jephthah, David, and also Samuel and the prophets,
translation:
  language: hi
  text: और मैं और क्या कहूँ? क्योंकि यदि मैं गिदोन, बाराक, शिमशोन, यिप्तह, दाऊद, और शमूएल तथा भविष्यद्वक्ताओं के बारे में बताता जाऊँ, तो समय कम पड़ जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ τί ἔτι λέγω;
  choice: और मैं क्या कहूँ?
  rationale: यह स्वाभाविक हिन्दी में आलंकारिक प्रश्न है, जो आगे और उदाहरण होने का संकेत देता है; ‘और क्या कहूँ?’ भी संभव है, पर ‘मैं’ वक्ता की भूमिका स्पष्ट करता है।
- source_word: ἐπιλείψει με γὰρ ... ὁ χρόνος
  choice: क्योंकि ... तो समय कम पड़ जाएगा
  rationale: यूनानी भविष्यकाल और आलंकारिक भाव दोनों सुरक्षित रहते हैं। ‘समय कम पड़ जाएगा’ आधुनिक हिन्दी का सहज मुहावरा है और यह अर्थ नहीं जोड़ता कि समय पहले ही समाप्त हो चुका है।
- source_word: διηγούμενον
  choice: यदि मैं ... बताता जाऊँ
  rationale: वर्तमान कृदन्त की जारी रहने वाली, परिस्थितिजन्य क्रिया को ‘बताता जाऊँ’ व्यक्त करता है; ‘यदि’ प्रसंग के काल्पनिक-आलंकारिक भाव को स्वाभाविक बनाता है।
- source_word: περὶ
  choice: के बारे में
  rationale: वर्णन के विषय को बताने वाला सामान्य और स्पष्ट आधुनिक हिन्दी प्रयोग।
- source_word: Γεδεών, Βαράκ, Σαμψών, Ἰεφθάε, Δαυίδ, Σαμουὴλ
  choice: गिदोन, बाराक, शिमशोन, यिप्तह, दाऊद, शमूएल
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं, ताकि पाठ सामान्य पाठकों के लिए पहचाना जा सके।
- source_word: τε καὶ
  choice: और फिर
  rationale: यह दाऊद के बाद शमूएल को थोड़ा अतिरिक्त रूप से जोड़ने वाली कड़ी को पठनीय हिन्दी में व्यक्त करता है, बिना किसी कठोर समूह-विभाजन का दावा किए।
- source_word: τῶν προφητῶν
  choice: भविष्यद्वक्ताओं
  rationale: समूहवाचक बहुवचन का सीधा और प्रचलित हिन्दी समतुल्य; सम्बन्धसूचक ‘के बारे में’ पूरे नाम-सूची और इस समूह पर लागू होता है।
theological_decisions:
- issue: समय के कम पड़ने वाले कथन का आलंकारिक बल
  choice: इसे ‘यदि मैं ... बताता जाऊँ, तो समय कम पड़ जाएगा’ के रूप में रखा गया है।
  alternative: 'अधिक शब्दशः: ‘बताते हुए समय मेरा साथ छोड़ देगा।’'
  rationale: यह लेखक की संक्षेप करने वाली आलंकारिक युक्ति को बनाए रखता है और इसे समय के वस्तुतः समाप्त हो जाने का कठोर दावा नहीं बनाता।
- issue: दाऊद, शमूएल और भविष्यद्वक्ताओं का क्रम और संबंध
  choice: ‘दाऊद, और फिर शमूएल और भविष्यद्वक्ताओं’
  alternative: ‘दाऊद और शमूएल और भविष्यद्वक्ताओं’
  rationale: τε καὶ की हल्की अतिरिक्त/क्रमिक शक्ति रखी गई है, लेकिन शमूएल को भविष्यद्वक्ताओं से पूर्णतः अलग या उनमें निश्चित रूप से समाहित मानने का धर्मवैचारिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। वाक्य की यूनानी आलंकारिकता तथा जारी वर्णन का भाव सुरक्षित है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
