base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/023.yaml
  text: By faith Moses[a], when he was born, was hidden for three months by his parents, because they saw that the child was beautiful, and they were not afraid of the king’s edict.
translation:
  language: hi
  text: विश्वास से, मूसा के जन्म के समय उसके माता-पिता ने उसे तीन महीने तक छिपाकर रखा, क्योंकि उन्होंने देखा कि बालक सुन्दर था,[a] और वे राजा की राजाज्ञा से नहीं डरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उत्तम” या “असाधारण”; यूनानी शब्द ἀστεῖον निर्गमन 2:2 और प्रेरितों के काम 7:20 की प्रतिध्वनि करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πίστει
  choice: विश्वास ही से
  rationale: साधनवाचक दत्तिव को स्वाभाविक हिन्दी में व्यक्त करता है और इब्रानियों 11 के आवर्ती विश्वास-विषय पर बल बनाए रखता है।
- source_word: Μωϋσῆς
  choice: मूसा
  rationale: हिन्दी बाइबलीय परम्परा में प्रचलित नामरूप।
- source_word: γεννηθεὶς
  choice: उसके जन्म के बाद
  rationale: अओरिस्ट कर्मवाच्य कृदन्त का स्वाभाविक कालवाचक अनुवाद; मुख्य क्रिया से इसका सम्बन्ध स्पष्ट करता है।
- source_word: ἐκρύβη
  choice: छिपाए रखा
  rationale: कर्मवाच्य अर्थ और तीन महीने तक जारी रखी गई सुरक्षा—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τρίμηνον
  choice: तीन महीने तक
  rationale: अवधि-सूचक कर्मकारक का सहज हिन्दी रूप।
- source_word: ὑπὸ τῶν πατέρων αὐτοῦ
  choice: उसके माता-पिता ने
  rationale: बहुवचन πατέρων यहाँ सामूहिक रूप से माता-पिता को सूचित करता है; हिन्दी में कर्तृवाच्य रूप अधिक स्वाभाविक है, जबकि मूसा पर की गई क्रिया स्पष्ट रहती है।
- source_word: διότι
  choice: क्योंकि
  rationale: उनके कार्य का कारण सीधे प्रस्तुत करता है।
- source_word: εἶδον
  choice: उन्होंने देखा
  rationale: प्रत्यक्ष अवलोकन का साधारण अओरिस्ट अर्थ सुरक्षित रखता है।
- source_word: ἀστεῖον
  choice: सुन्दर
  rationale: शब्द आकर्षक, उत्तम या असाधारण होने का अर्थ दे सकता है; 'सुन्दर' निर्गमन 2:2 और प्रेरितों 7:20 की प्रतिध्वनि के अनुरूप है, और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: τὸ παιδίον
  choice: बालक
  rationale: गरिमापूर्ण और स्वाभाविक हिन्दी रूप, जो शिशु-सन्दर्भ में भी उपयुक्त है।
- source_word: οὐκ ἐφοβήθησαν
  choice: वे ... नहीं डरे
  rationale: विश्वास और भय के विरोध को सीधा और स्वाभाविक रूप देता है।
- source_word: τὸ διάταγμα τοῦ βασιλέως
  choice: राजा की राजाज्ञा
  rationale: διάταγμα की औपचारिक, शाही और बाध्यकारी आज्ञा का अर्थ संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: मूसा को छिपाने में माता-पिता की प्रेरणा
  choice: वचन उनके कार्य को विश्वास के रूप में प्रस्तुत करता है, जिसमें बालक को सुन्दर देखना और राजा की राजाज्ञा से न डरना दोनों सम्मिलित हैं।
  alternative: बालक की सुन्दरता ही एकमात्र प्रेरणा थी, अथवा उसके रूप में कोई विशेष ईश्वरीय चिह्न दिखाई दिया।
  rationale: वाक्य-विन्यास दोनों बातों को रखता है और पूरे कार्य को 'विश्वास ही से' के अधीन प्रस्तुत करता है; अनुवाद किसी चमत्कारी रूप या विशेष संकेत का अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रचलित बाइबलीय नाम 'मूसा' और औपचारिक आदेश के लिए 'राजाज्ञा' चुना गया है।
