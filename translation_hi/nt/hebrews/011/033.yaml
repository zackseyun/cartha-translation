  terminology: ‘विश्वास’ appropriately renders πίστις in this context. ‘धार्मिकता’ preserves the broad moral/covenantal scope of δικαιοσύνη, while the footnote responsibly supplies ‘न्याय’ as a contextual alternative. ‘प्रतिज्ञाएँ’ faithfully retains the Greek plural.
