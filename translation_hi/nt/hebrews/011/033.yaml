id: HEB.11.33
reference: Hebrews 11:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οἳ διὰ πίστεως κατηγωνίσαντο βασιλείας, εἰργάσαντο δικαιοσύνην, ἐπέτυχον ἐπαγγελιῶν, ἔφραξαν στόματα λεόντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/033.yaml
  text: who through faith conquered kingdoms[a], worked righteousness, obtained promises, shut the mouths of lions[b],
translation:
  language: hi
  text: जिन्होंने विश्वास के द्वारा[a] राज्यों को जीत लिया, धार्मिकता[b] के काम किए, प्रतिज्ञाएँ प्राप्त कीं और सिंहों के मुँह बंद कर दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वास से।”
    reason: διά के संबंधकारक रूप द्वारा व्यक्त साधन का अधिक संक्षिप्त हिंदी रूप।
  - marker: b
    text: या, “न्याय के काम किए।” यूनानी शब्द संदर्भ के अनुसार धार्मिकता या न्याय का अर्थ दे सकता है।
    reason: δικαιοσύνη की प्रासंगिक शाब्दिक वैकल्पिकता को सुरक्षित रखना।
lexical_decisions:
- source_word: διὰ πίστεως
  choice: विश्वास के द्वारा
  rationale: διά के संबंधकारक रूप के साथ यह वाक्यांश साधन को दर्शाता है। ‘विश्वास के द्वारा’ मूल संरचना को स्पष्ट रखते हुए इब्रानियों 11 के मुख्य विषय—परमेश्वर पर भरोसा रखकर कार्य करना—के अनुकूल है।
- source_word: κατηγωνίσαντο βασιλείας
  choice: राज्यों को जीत लिया
  rationale: καταγωνίζομαι संघर्ष में पराजित करने या वश में करने का बोध देता है, और βασιλείας यहाँ राजनीतिक राज्यों को सूचित करता है। यह हिंदी में स्वाभाविक और अर्थ की दृष्टि से सशक्त है।
- source_word: εἰργάσαντο δικαιοσύνην
  choice: धार्मिकता के काम किए
  rationale: ἐργάζομαι सक्रिय रूप से करने या संपन्न करने का अर्थ रखता है। δικαιοσύνη का व्यापक नैतिक अर्थ ‘धार्मिकता’ से सुरक्षित रहता है; ‘न्याय’ की संभावित छाया को पादटिप्पणी में रखा गया है।
- source_word: ἐπέτυχον ἐπαγγελιῶν
  choice: प्रतिज्ञाएँ प्राप्त कीं
  rationale: ἐπιτυγχάνω का अर्थ पाना या प्राप्त करना है। यह अनुवाद यह तय नहीं करता कि प्रतिज्ञाओं की पूर्ति किस सीमा या रूप में हुई, इसलिए इब्रानियों में उपस्थित व्यापक तनाव बना रहता है।
- source_word: ἔφραξαν στόματα λεόντων
  choice: सिंहों के मुँह बंद कर दिए
  rationale: यह मूल के सजीव बिंब को निकटता से और स्वाभाविक हिंदी में व्यक्त करता है, बिना दानिय्येल की संभावित ओर संकेत को मुख्य पाठ में स्पष्ट किए।
theological_decisions:
- issue: इब्रानियों 11 में πίστις का अनुवाद
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: इस अध्याय में शब्द मुख्यतः परमेश्वर पर भरोसा रखकर कार्य करने की प्रतिक्रिया को दर्शाता है। ‘विश्वास’ इस केंद्रीय अर्थ को सुरक्षित रखता है, जबकि ‘विश्वासयोग्यता’ यहाँ अनावश्यक रूप से गुण या चरित्र पर बल दे सकती है।
- issue: गैर-पौलुस संदर्भ में δικαιοσύνη का अनुवाद
  choice: धार्मिकता
  alternative: न्याय
  rationale: यहाँ शब्द सही और धर्मानुकूल आचरण के व्यापक अर्थ में है। ‘धार्मिकता’ उस नैतिक विस्तार को बनाए रखती है, जबकि ‘न्याय’ एक वास्तविक संभावित अर्थ है और इसलिए पादटिप्पणी में दिया गया है।
- issue: ἐπαγγελιῶν को प्राप्त करने का आशय
  choice: प्रतिज्ञाएँ प्राप्त कीं
  alternative: प्रतिज्ञा की हुई वस्तुएँ पाईं
  rationale: मूल पाठ बहुवचन ‘प्रतिज्ञाएँ’ कहता है। चुना हुआ रूप यह पूर्वनिर्धारित नहीं करता कि विश्वासियों ने प्रतिज्ञाओं के शब्द, आश्वासन, आंशिक पूर्ति या पूर्ण फल में से क्या प्राप्त किया; इस प्रकार निकटवर्ती संदर्भ से उत्पन्न तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सूचीबद्ध क्रियाओं की लय को बनाए रखने वाला रूप। ‘राज्यों को जीत लिया’ और ‘सिंहों के मुँह बंद कर दिए’ सामान्य पाठकों के लिए स्पष्ट हैं; ‘धार्मिकता’ का व्यापक बाइबलीय अर्थ पादटिप्पणी के सहारे संतुलित किया गया है।
