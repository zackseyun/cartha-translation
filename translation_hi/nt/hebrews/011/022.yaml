source:
  edition: SBLGNT
  text: πίστει Ἰωσὴφ τελευτῶν περὶ τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐμνημόνευσεν, καὶ περὶ τῶν ὀστέων αὐτοῦ ἐνετείλατο.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/022.yaml
  text: By faith Joseph, as he was nearing the end of his life, mentioned the exodus of the sons of Israel and gave instructions concerning his bones.
translation:
  language: hi
  text: विश्वास से यूसुफ ने, जब वह अपने जीवन के अंत के निकट था,[a] इस्राएल के पुत्रों के निर्गमन[b] का उल्लेख किया और अपनी हड्डियों के विषय में निर्देश दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वह मर रहा था।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “प्रस्थान” या “निकलना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: विश्वास ही से
  rationale: इब्रानियों 11 में बार-बार आने वाले सूत्र को बनाए रखते हुए करणवाचक अर्थ व्यक्त करता है; यहाँ संदर्भ पितृपुरुष के उस विश्वास पर बल देता है जिसके कारण उसने ऐसा कहा।
- source_word: τελευτῶν
  choice: जब वह अपने जीवन के अंत के निकट था
  rationale: वर्तमान कृदंत का समकालिक भाव स्वाभाविक हिन्दी में व्यक्त करता है और यह बताता है कि यूसुफ ने जीवन के अंतिम समय में यह बात कही; अधिक सीधा विकल्प ‘जब वह मरने पर था’ पादटिप्पणी में रखा गया है।
- source_word: περὶ τῆς ἐξόδου
  choice: मिस्र से निकलने
  rationale: ἔξοδος का मूल अर्थ ‘निकलना/प्रस्थान’ है। संदर्भ उत्पत्ति 50:24-25 के अनुसार मिस्र से भावी निर्गमन का है; ‘मिस्र से’ स्पष्टता के लिए निहित संदर्भ को सामने लाता है।
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: इस्राएल के पुत्रों
  rationale: यूनानी की स्पष्ट पारिवारिक अभिव्यक्ति ‘पुत्रों’ को बनाए रखता है, उसे केवल ‘इस्राएलियों’ में सामान्यीकृत नहीं करता।
- source_word: ἐμνημόνευσεν
  choice: उल्लेख किया
  rationale: περί के साथ क्रिया का अर्थ किसी बात का उल्लेख करना या उसके विषय में बोलना है, केवल मन में स्मरण करना नहीं।
- source_word: ἐνετείλατο
  choice: निर्देश दिया
  rationale: मध्यवाच्य क्रिया के आदेश अथवा निर्देश देने के अर्थ को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: περὶ τῶν ὀστέων αὐτοῦ
  choice: अपनी हड्डियों के विषय में
  rationale: यूनानी के ठोस शब्द ‘हड्डियों’ को बनाए रखता है और उसे व्यापक ‘पार्थिव अवशेषों’ में नहीं बदलता।
theological_decisions:
- issue: इब्रानियों 11 में πίστις का अनुवाद
  choice: विश्वास
  alternative: विश्वासयोग्यता; भरोसा
  rationale: अध्याय के आवर्ती सूत्र और इस प्रसंग में करणवाचक प्रयोग के कारण ‘विश्वास’ सबसे उपयुक्त है; यह यूसुफ के कार्य को प्रेरित करने वाले विश्वास पर बल देता है।
- issue: ἔξοδος का ऐतिहासिक संकेत
  choice: मिस्र से निकलना
  alternative: प्रस्थान; निर्गमन
  rationale: शब्द का सामान्य अर्थ ‘प्रस्थान’ है, पर यहाँ उत्पत्ति 50 के संदर्भ में इस्राएल के पुत्रों का मिस्र से भावी निकलना अभिप्रेत है। ‘निकलना’ सामान्य पाठक के लिए सहज है और ऐतिहासिक संकेत भी सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण किंतु सहज वाक्य-विन्यास अपनाया गया है। ‘इस्राएल के पुत्रों’ और ‘हड्डियों’ को स्रोत की ठोस भाषा के अनुरूप रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
