source:
  edition: SBLGNT
  text: πίστει παρῴκησεν εἰς γῆν τῆς ἐπαγγελίας ὡς ἀλλοτρίαν, ἐν σκηναῖς κατοικήσας μετὰ Ἰσαὰκ καὶ Ἰακὼβ τῶν συγκληρονόμων τῆς ἐπαγγελίας τῆς αὐτῆς·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/009.yaml
  text: By faith he lived as a foreigner in the land of promise[a], as in a foreign land, dwelling in tents with Isaac and Jacob, fellow heirs of the same promise.
translation:
  language: hi
  text: विश्वास ही से वह प्रतिज्ञा की भूमि में ऐसे परदेशी की तरह रहा, मानो वह परायी भूमि हो, और इसहाक और याकूब के साथ तंबुओं में रहा, जो उसी प्रतिज्ञा के सह-उत्तराधिकारी थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πίστει
  choice: विश्वास ही से
  rationale: साधनवाचक दत्तिव का अर्थ है कि उसका ऐसा रहना विश्वास के द्वारा था; इब्रानियों 11 की आवर्ती अभिव्यक्ति के अनुरूप ‘विश्वास ही से’ स्वाभाविक और बलयुक्त है।
- source_word: παρῴκησεν
  choice: परदेशी की तरह रहने लगा
  rationale: क्रिया किसी स्थान में गैर-स्थानीय और अस्थायी निवासी के रूप में रहने का भाव देती है। यह चयन सामाजिक परायेपन को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: εἰς γῆν τῆς ἐπαγγελίας
  choice: प्रतिज्ञा की भूमि में
  rationale: निवास-सूचक क्रिया के साथ εἰς यहाँ स्थान का भाव दे सकता है। ‘प्रतिज्ञा की भूमि’ परमेश्वर की प्रतिज्ञा से भूमि का निकट संबंध बनाए रखता है।
- source_word: ὡς ἀλλοτρίαν
  choice: परदेशी की तरह
  rationale: यूनानी वाक्यरचना में यह भूमि को ‘परायी’ मानकर उसमें रहने अथवा स्वयं परदेशी की दशा में रहने—दोनों निकट भाव जगा सकती है। मुख्य पाठ स्वाभाविक हिन्दी देता है और पादटिप्पणी भूमि-केंद्रित वैकल्पिक संरचना सुरक्षित रखती है।
- source_word: ἐν σκηναῖς κατοικήσας
  choice: तंबुओं में रहा
  rationale: कृदन्त मुख्य क्रिया के साथ-साथ उसके निवास की रीति बताता है। यह अस्थायी आवास की ठोस छवि को संक्षिप्त और सहज रूप में रखता है।
- source_word: μετὰ Ἰσαὰκ καὶ Ἰακὼβ
  choice: इसहाक और याकूब के साथ
  rationale: μετά के संबंधवाचक प्रयोग का सीधा अर्थ ‘के साथ’ है; नामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
- source_word: τῶν συγκληρονόμων
  choice: सह-उत्तराधिकारी
  rationale: यह शब्द एक ही विरासत में संयुक्त भागीदारी व्यक्त करता है। ‘सह-उत्तराधिकारी’ अर्थ को ठीक और संक्षिप्त रूप में सुरक्षित रखता है।
- source_word: τῆς ἐπαγγελίας τῆς αὐτῆς
  choice: उसी प्रतिज्ञा के
  rationale: αὐτῆς इस बात पर बल देता है कि इसहाक और याकूब उस ठीक उसी प्रतिज्ञा में भागी थे; ‘उसी’ इस पहचान को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अव्यक्त कर्ता का संदर्भ
  choice: ‘वह’ से अब्राहम अभिप्रेत है, जिसका उल्लेख पिछले पद में है।
  alternative: स्पष्टता के लिए मुख्य पाठ में ‘अब्राहम’ जोड़ना।
  rationale: यूनानी में कर्ता निहित है और इब्रानियों 11:8 से अब्राहम ही चलता आ रहा है। ‘वह’ मूल की संसक्ति और संक्षिप्तता बनाए रखता है।
- issue: ὡς ἀλλοτρίαν की संरचनात्मक अस्पष्टता
  choice: मुख्य पाठ में उसके परदेशी की तरह रहने का भाव।
  alternative: ‘मानो वह परायी भूमि हो’—भूमि को परायी बताने वाला पाठ।
  rationale: दोनों रूप इस बात को व्यक्त करते हैं कि प्रतिज्ञात भूमि में भी अब्राहम का स्थायी स्वामित्व नहीं था। वैकल्पिक रूप पादटिप्पणी में रखकर मूल की वास्तविक अर्थ-छाया सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘परदेशी’ सामान्य पाठक के लिए बोधगम्य है; ‘सह-उत्तराधिकारी’ विरासत की साझा स्थिति को सटीक रखता है। मुख्य पाठ में ‘वह’ संदर्भ-संसक्ति बनाए रखता है, जबकि पादटिप्पणी यूनानी की संरचनात्मक अर्थ-छाया को सुरक्षित करती है।
