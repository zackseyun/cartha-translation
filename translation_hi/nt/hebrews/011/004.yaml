reference: Hebrews 11:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Πίστει πλείονα θυσίαν Ἅβελ παρὰ Κάϊν προσήνεγκεν τῷ θεῷ, δι’ ἧς ἐμαρτυρήθη εἶναι δίκαιος, μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ ⸂τοῦ θεοῦ⸃, καὶ δι’ αὐτῆς ἀποθανὼν ἔτι ⸀λαλεῖ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/004.yaml
  text: By faith Abel offered to God a better sacrifice than Cain[a], through which he was attested as righteous, God testifying concerning his gifts; and through it, though he died[d][c][b], he still speaks.
translation:
  language: hi
  text: विश्वास से हाबिल ने कैन की अपेक्षा परमेश्वर को उत्तम बलिदान चढ़ाया[a]। उसके द्वारा उसे धर्मी होने की गवाही दी गई, जब परमेश्वर ने उसकी भेंटों के विषय में गवाही दी। और उसी के द्वारा[c] वह मर जाने पर भी अभी भी बोलता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कैन से बड़ा बलिदान।” यहाँ तुलना बलिदान की उत्तमता या उसकी अधिकता—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: “उसी के द्वारा” का संकेत हाबिल के विश्वास या उसके बलिदान की ओर हो सकता है; यूनानी पाठ इसे पूरी तरह स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: Πίστει
  choice: विश्वास ही से
  rationale: करणवाचक दत्तिव को स्वाभाविक हिन्दी में व्यक्त करता है और इब्रानियों 11 में मनुष्य के विश्वास को प्रमुख रखता है।
- source_word: πλείονα θυσίαν
  choice: उत्तम बलिदान
  rationale: संदर्भ में कैन के बलिदान की तुलना में गुणात्मक श्रेष्ठता प्रमुख है; फिर भी ‘बड़ा/अधिक’ अर्थ की संभावना पाद-टिप्पणी में रखी गई है।
- source_word: παρὰ Κάϊν
  choice: कैन की अपेक्षा
  rationale: तुलनात्मक प्रयोग के मानक को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: προσήνεγκεν τῷ θεῷ
  choice: परमेश्वर को ... चढ़ाया
  rationale: बलिदान-संबंधी प्रसंग में προσφέρω के लिए ‘चढ़ाना’ स्वाभाविक और सटीक हिन्दी है।
- source_word: δι’ ἧς
  choice: उसी के द्वारा
  rationale: स्त्रीलिंग सम्बन्धवाचक सर्वनाम निकटवर्ती θυσίαν, अर्थात बलिदान, की ओर संकेत करता है; हिन्दी में संदर्भ से यह संबंध बना रहता है।
- source_word: ἐμαρτυρήθη εἶναι δίκαιος
  choice: उसके धर्मी होने की गवाही दी गई
  rationale: μαρτυρέω के साक्ष्य/गवाही वाले प्रमुख भाव को बनाए रखते हुए हिन्दी में स्वाभाविक निष्क्रिय रचना प्रस्तुत करता है।
- source_word: μαρτυροῦντος ἐπὶ τοῖς δώροις αὐτοῦ τοῦ θεοῦ
  choice: क्योंकि परमेश्वर ने उसकी भेंटों के विषय में गवाही दी
  rationale: सम्बन्धवाचक कृदन्तीय उपवाक्य को स्पष्ट कारणात्मक हिन्दी में व्यक्त किया गया है; δῶρα के बहुवचन को ‘भेंटों’ के रूप में रखा गया है।
- source_word: δι’ αὐτῆς
  choice: उसी के द्वारा
  rationale: मूल का स्त्रीलिंग सर्वनाम विश्वास या बलिदान, दोनों की ओर संकेत कर सकता है; हिन्दी सर्वनाम इस अस्पष्टता को यथासंभव बनाए रखता है।
- source_word: ἀποθανὼν ἔτι λαλεῖ
  choice: वह मर जाने पर भी अब तक बोलता है
  rationale: मृत्यु और जारी वाणी के बीच विरोध को ‘पर भी’ से तथा ἔτι के निरंतर भाव को ‘अब तक’ से व्यक्त करता है।
theological_decisions:
- issue: अंतिम δι’ αὐτῆς का संदर्भ
  choice: ‘उसी के द्वारा’ कहकर संदर्भ खुला रखा गया
  alternative: ‘विश्वास के द्वारा’ या ‘बलिदान के द्वारा’
  rationale: यूनानी स्त्रीलिंग सर्वनाम अध्याय के विषय ‘विश्वास’ अथवा निकटवर्ती ‘बलिदान’ की ओर जा सकता है; पाठ वास्तविक अस्पष्टता को निर्णायक रूप से नहीं सुलझाता।
- issue: ἐμαρτυρήθη का भाव
  choice: गवाही की शब्दावली रखी गई
  alternative: ‘धर्मी ठहराया गया’ या ‘सराहा गया’
  rationale: इब्रानियों 11 में μαρτυρέω की साक्ष्य-विषयक पुनरावृत्ति महत्त्वपूर्ण है; ‘धर्मी ठहराया’ न्यायिक अर्थ को आवश्यकता से अधिक निश्चित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के अनुकूल शैली। ‘हाबिल’, ‘कैन’, ‘बलिदान’, ‘भेंट’ और ‘धर्मी’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है, पर गवाही की आवृत्ति और अंतिम सर्वनाम की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
