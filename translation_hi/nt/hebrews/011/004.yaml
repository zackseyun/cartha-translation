revisions:
- from: विश्वास ही से हाबिल ने कैन की अपेक्षा परमेश्वर को उत्तम बलिदान चढ़ाया[a]। उसी के द्वारा उसके धर्मी होने की गवाही दी गई[b], क्योंकि परमेश्वर ने उसकी भेंटों के विषय में गवाही दी। और उसी के द्वारा[c] वह मर जाने पर भी अब तक बोलता है।
  to: विश्वास से हाबिल ने कैन की अपेक्षा परमेश्वर को उत्तम बलिदान चढ़ाया[a]। उसके द्वारा उसे धर्मी होने की गवाही दी गई, जब परमेश्वर ने उसकी भेंटों के विषय में गवाही दी। और उसी के द्वारा[c] वह मर जाने पर भी अभी भी बोलता है।
  rationale: The revision removes added emphasis, retains the repeated witness terminology, and renders the divine-testimony clause with a temporally/circumstantially neutral “जब” rather than a strictly causal “क्योंकि.” “उसके द्वारा” in the first clause follows the grammatically linked sacrifice, while the final “उसी के द्वारा” and its footnote preserve the source’s disputed antecedent. The verse’s public-reading register remains natural modern standard Hindi.
