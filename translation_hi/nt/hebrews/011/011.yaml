source:
  edition: SBLGNT
  text: πίστει καὶ ⸂αὐτῇ Σάρρᾳ⸃ δύναμιν εἰς καταβολὴν σπέρματος ἔλαβεν καὶ παρὰ καιρὸν ⸀ἡλικίας, ἐπεὶ πιστὸν ἡγήσατο τὸν ἐπαγγειλάμενον·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/011.yaml
  text: By faith even Sarah herself received power to conceive offspring[a], even beyond the proper time of life, because she considered the one who had promised to be faithful.
translation:
  language: hi
  text: विश्वास से स्वयं सारा ने भी संतान उत्पन्न करने की सामर्थ्य पाई[a], अपनी आयु की उचित सीमा से परे होने पर भी, क्योंकि उसने प्रतिज्ञा करनेवाले को विश्वासयोग्य माना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शब्दशः, “बीज की स्थापना के लिए सामर्थ्य पाई।” यूनानी अभिव्यक्ति असामान्य और मुहावरेदार है; प्रसंग में इसका अर्थ संतान उत्पन्न करने की क्षमता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πίστει
  choice: विश्वास से
  rationale: यह साधनवाचक प्रयोग है और इब्रानियों 11 में बार-बार आनेवाले सूत्र को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: καὶ αὐτῇ Σάρρᾳ
  choice: स्वयं सारा ने भी
  rationale: ‘भी’ सारा को विश्वास के उदाहरणों में जोड़ता है और ‘स्वयं’ αὐτῇ के बलाघात को बनाए रखता है।
- source_word: δύναμιν ... ἔλαβεν
  choice: सामर्थ्य पाई
  rationale: यह यूनानी अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है तथा δύναμις का अर्थ बनाए रखता है।
- source_word: εἰς καταβολὴν σπέρματος
  choice: संतान को गर्भ में धारण करने
  rationale: यूनानी पदबंध असामान्य है और शब्दशः पुरुष-केन्द्रित प्रतीत हो सकता है; सारा को कर्ता रखते हुए यह प्रसंगगत अर्थ को स्पष्ट करता है। अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
- source_word: καὶ παρὰ καιρὸν ἡλικίας
  choice: यद्यपि उसकी उचित आयु बीत चुकी थी
  rationale: यह सामान्य उपयुक्त जीवन-काल की सीमा पार हो जाने का भाव देता है, बिना मुख्य पाठ में यूनानी से अधिक विशिष्टता जोड़ने के।
- source_word: ἐπεὶ
  choice: क्योंकि
  rationale: यह सारा को सामर्थ्य मिलने का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: πιστὸν
  choice: विश्वासयोग्य
  rationale: यह प्रतिज्ञा करनेवाले की भरोसेमंद और निष्ठावान प्रकृति को गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἡγήσατο
  choice: समझा
  rationale: यह मूल्यांकन अथवा ठहराने के भाव को सरल आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὸν ἐπαγγειλάμενον
  choice: प्रतिज्ञा करनेवाले को
  rationale: यह संज्ञा के रूप में प्रयुक्त कृदन्त का संक्षिप्त, स्पष्ट और श्रद्धापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: व्याकरण की दृष्टि से कठिन वाक्यांश में कर्ता और सारा की क्रिया का अर्थ
  choice: सारा कर्ता है और उसने संतान को गर्भ में धारण करने की सामर्थ्य पाई।
  alternative: अब्राहम को निहित अथवा मुख्य सहभागी मानना; या वंश स्थापित करने की सामर्थ्य के अर्थ में लेना।
  rationale: इस पाठ-रूप में αὐτῇ Σάρρᾳ सबसे स्वाभाविक रूप से सारा को ἔλαβεν का कर्ता बताता है। καταβολὴ σπέρματος का शब्दशः रूप पुरुष-सम्बन्धी लग सकता है, पर प्रसंग वृद्धावस्था में सारा के विश्वास और गर्भधारण पर केन्द्रित है।
- issue: परमेश्वर के लिए πιστός का अनुवाद
  choice: विश्वासयोग्य
  alternative: भरोसेमंद; निष्ठावान
  rationale: यह सारा के विश्वास का आधार परमेश्वर के भरोसेमंद चरित्र को बताता है और पाठ से परे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘स्वयं सारा ने भी’ मूल के बलाघात को बनाए रखता है; कठिन यूनानी मुहावरे का शब्दशः रूप पादटिप्पणी में सुरक्षित है।
