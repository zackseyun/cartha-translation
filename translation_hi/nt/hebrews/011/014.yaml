lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन के साथ व्याख्यात्मक संबंध बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: τοιαῦτα
  choice: ऐसी बातें
  rationale: संदर्भ में पहले कही गई बातों की ओर संकेत करने वाले नपुंसकलिंग बहुवचन का सहज हिन्दी रूप।
- source_word: λέγοντες
  choice: जो लोग ... कहते हैं
  rationale: वर्तमान कृदन्त को स्पष्ट और पठनीय संबंधवाचक उपवाक्य के रूप में व्यक्त करता है।
- source_word: ἐμφανίζουσιν
  choice: स्पष्ट करते हैं
  rationale: कथनों से किसी बात को प्रत्यक्ष या साफ़ कर देने का अर्थ संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὅτι
  choice: कि
  rationale: जिस विषय को स्पष्ट किया गया है, उसका आशय बताने वाला उपवाक्य आरम्भ करता है।
- source_word: πατρίδα
  choice: एक स्वदेश
  rationale: अपनी भूमि या मूल देश का भाव रखता है; अनिश्चित रूप को 'एक' से बनाए रखता है और इसी पद में उसे स्वर्गीय कहकर अर्थ को समय से पहले सीमित नहीं करता।
- source_word: ἐπιζητοῦσιν
  choice: खोज में हैं
  rationale: निरंतर और सक्रिय खोज के वर्तमानकालिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पूर्वजों द्वारा खोजे जा रहे πατρίς का आशय
  choice: मुख्य पाठ में सामान्य रूप से 'एक स्वदेश'
  alternative: पृथ्वी का स्वदेश; स्वर्गीय स्वदेश
  rationale: इस पद में केवल स्वदेश की खोज कही गई है; अगला पद उसके अंतिम, स्वर्गीय आशय को स्पष्ट करता है। इसलिए मुख्य पाठ इस पद की अपनी अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। 'स्वदेश' संक्षिप्त तथा संदर्भानुकूल है, जबकि पादटिप्पणी उसके अन्य स्वाभाविक अर्थ खोलती है।
