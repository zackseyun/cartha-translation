  text: By faith Isaac blessed Jacob and Esau, even concerning things to come.
translation:
  language: hi
  text: विश्वास से इसहाक ने याकूब और एसाव को आनेवाली बातों के विषय में भी आशीर्वाद दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πίστει
  choice: विश्वास से
  rationale: करणवाचक अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: καὶ περὶ μελλόντων
  choice: आनेवाली बातों के विषय में भी
  rationale: περὶ के विषय-संबंधी अर्थ और καὶ के बलवर्धक अर्थ दोनों को बनाए रखता है; μελλόντων को जानबूझकर सामान्य रखा गया है।
- source_word: εὐλόγησεν
  choice: आशीर्वाद दिया
  rationale: इस प्रसंग में पितृसत्तात्मक आशीर्वाद की क्रिया के लिए प्रचलित और स्पष्ट हिन्दी अभिव्यक्ति।
theological_decisions:
- issue: आशीर्वाद और भविष्य की बातों का संबंध
  choice: दोनों पुत्रों को दिया गया आशीर्वाद आनेवाली बातों से संबंधित था
  alternative: केवल सामान्य रूप से भविष्यवाणी करना
  rationale: यूनानी वाक्य आशीर्वाद देने की क्रिया को περὶ μελλόντων से जोड़ता है; अनुवाद इस संबंध को रखता है, पर उन बातों का स्वरूप अतिरिक्त रूप से निर्धारित नहीं करता।
translation_notes:
