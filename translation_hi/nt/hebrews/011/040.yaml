  text: τοῦ θεοῦ περὶ ἡμῶν κρεῖττόν τι προβλεψαμένου, ἵνα μὴ χωρὶς ἡμῶν τελειωθῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/040.yaml
  text: since God had provided something better for us[b][a], so that they would not be made perfect apart from us.
translation:
  language: hi
  text: क्योंकि परमेश्वर ने हमारे लिए कुछ बेहतर पहले से प्रदान किया था[a], ताकि वे हमारे बिना सिद्ध न किए जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारे लिए कुछ बेहतर पहले से देख रखा था।” यूनानी शब्द पहले से देखने या पहले से प्रबन्ध करने—दोनों का संकेत दे सकता है; यहाँ प्रसंग परमेश्वर की योजना और व्यवस्था के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि वे हमारे बिना पूर्णता तक न पहुँचाए जाएँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: προβλεψαμένου
  choice: पहले से ठहरा रखा था
  rationale: यह रूप पूर्वदृष्टि के साथ पूर्व-व्यवस्था या योजना का भाव दे सकता है। प्रसंग में केवल पहले से देख लेना नहीं, बल्कि परमेश्वर की पूर्व-नियोजित व्यवस्था प्रमुख है; इसलिए ऐसा पद चुना गया है जो इस भाव को स्वाभाविक हिन्दी में व्यक्त करे।
- source_word: κρεῖττόν τι
  choice: कुछ बेहतर
  rationale: ‘बेहतर’ इब्रानियों में बार-बार आने वाली तुलना को बनाए रखता है, और τι का अनिश्चित भाव ‘कुछ’ से व्यक्त होता है।
- source_word: περὶ ἡμῶν
  choice: हमारे लिए
  rationale: 'इस प्रसंग में περί का सम्बन्धपरक/हितार्थक भाव है: परमेश्वर की व्यवस्था में हम भी दृष्टि में थे।'
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: यह उद्देश्य अथवा परिणामी अभिप्राय को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: χωρὶς ἡμῶν
  choice: हमसे अलग
  rationale: यह ‘हमारे बिना’ का अर्थ रखते हुए विश्वासियों की संयुक्त, न कि पृथक, पूर्णता पर बल देता है।
- source_word: τελειωθῶσιν
  choice: सिद्ध न किए जाएँ
  rationale: ‘सिद्ध किए जाएँ’ τελειόω के पूर्णता और सिद्धता—दोनों अर्थों को खुला रखता है और केवल नैतिक निष्पापता अथवा केवल कालगत समाप्ति तक अर्थ को सीमित नहीं करता।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर
  rationale: जननिवेशी स्वतंत्र रचना को हिन्दी में कारणसूचक उपवाक्य ‘क्योंकि परमेश्वर ने...’ के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: इब्रानियों के उद्धार-ऐतिहासिक प्रसंग में τελειωθῶσιν का अर्थ
  choice: मुख्य पाठ में ‘सिद्ध न किए जाएँ’ रखा गया है, जिससे सिद्धता और पूर्णता दोनों का धर्मवैज्ञानिक भार बना रहे।
  alternative: पूर्णता तक न पहुँचाए जाएँ
  rationale: इब्रानियों में τελειόω पूर्ति, परमेश्वर तक पहुँच और अंतिम सिद्धि से जुड़ा समृद्ध शब्द है। चुना हुआ अनुवाद इस तनाव को किसी एक अर्थ में सीमित नहीं करता।
- issue: προβλεψαμένου में पूर्वदृष्टि और पूर्व-व्यवस्था का सम्बन्ध
  choice: मुख्य पाठ में ‘पहले से ठहरा रखा था’ द्वारा परमेश्वर की पूर्व-योजना/व्यवस्था को प्रमुखता दी गई है।
  alternative: पहले से कुछ बेहतर देख रखा था
  rationale: यूनानी पद में पहले से देखने का शाब्दिक आयाम संभव है, पर निकट प्रसंग परमेश्वर द्वारा विश्वासियों के लिए बेहतर पूर्ति नियत करने की ओर संकेत करता है। विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और धर्मग्रंथ-संगत स्तर रखा गया है। ‘सिद्ध किए जाएँ’ परिचित धार्मिक अभिव्यक्ति है, जबकि पादटिप्पणी उसके ‘पूर्णता तक पहुँचने’ के आयाम को स्पष्ट करती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदों के तुरंत बाद दिए गए हैं।
