  text: πίστει κατέλιπεν Αἴγυπτον, μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως, τὸν γὰρ ἀόρατον ὡς ὁρῶν ἐκαρτέρησεν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/027.yaml
  text: By faith he left Egypt[a], not fearing the king’s anger[b], for he endured as seeing the One who is invisible.
translation:
  language: hi
  text: विश्वास से उसने राजा के क्रोध से न डरकर मिस्र छोड़ दिया,[a] क्योंकि वह अदृश्य परमेश्वर को मानो देख रहा हो, इस प्रकार अटल बना रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह कथन या तो फिरौन से बचकर मूसा के मिस्र से भागने (निर्गमन 2) या इस्राएलियों को लेकर उसके मिस्र से निकलने (निर्गमन 12–14) की ओर संकेत कर सकता है; यूनानी शब्द स्वयं घटना को निश्चित नहीं करते।
    reason: cross_reference
lexical_decisions:
- source_word: πίστει
  choice: विश्वास ही से
  rationale: यहाँ संबंधकारक रूप कार्य के साधन या रीति को बताता है। इब्रानियों 11 की आवर्ती शैली को स्पष्ट करने के लिए ‘विश्वास ही से’ स्वाभाविक और सुसंगत है।
- source_word: κατέλιπεν Αἴγυπτον
  choice: उसने ... मिस्र छोड़ दिया
  rationale: καταλείπω यहाँ सामान्य अर्थ में किसी स्थान को छोड़ने को व्यक्त करता है; ‘त्याग दिया’ अनावश्यक रूप से अधिक प्रबल होता।
- source_word: μὴ φοβηθεὶς τὸν θυμὸν τοῦ βασιλέως
  choice: राजा के क्रोध से न डरकर
  rationale: नकारात्मक कृदंत मुख्य क्रिया की रीति या साथ की परिस्थिति बताता है। θυμός के लिए ‘क्रोध’ आधुनिक, गरिमापूर्ण और पर्याप्त रूप से प्रबल है।
- source_word: τὸν ἀόρατον
  choice: अदृश्य परमेश्वर को
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित विशेषण एक व्यक्तिगत दैवी संदर्भ को सूचित करता है। हिंदी में केवल ‘अदृश्य को’ अस्वाभाविक और अस्पष्ट होता; ‘परमेश्वर’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: ὡς ὁρῶν
  choice: मानो देखते हुए
  rationale: ὡς की तुलनात्मक शक्ति और अदृश्य को देखने का जानबूझकर रखा गया विरोधाभास दोनों सुरक्षित रहते हैं।
- source_word: ἐκαρτέρησεν
  choice: दृढ़ बना रहा
  rationale: क्रिया कठिनाई के बीच धीरज से टिके रहने या दृढ़ता बनाए रखने को व्यक्त करती है; यह हिंदी में प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: ‘मिस्र छोड़ दिया’ किस ऐतिहासिक घटना की ओर संकेत करता है
  choice: मुख्य पाठ यह तय नहीं करता कि संकेत निर्गमन 2 में मूसा के पलायन की ओर है या निर्गमन 12–14 में इस्राएल को लेकर निकलने की ओर।
  alternative: इसे केवल मूसा के पहले पलायन अथवा केवल सामूहिक निर्गमन के रूप में स्पष्ट करना।
  rationale: यूनानी वाक्य केवल इतना कहता है कि उसने मिस्र छोड़ा और राजा के क्रोध से नहीं डरा। इसलिए वास्तविक व्याख्यात्मक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: τὸν ἀόρατον का व्यक्तिगत दैवी संदर्भ
  choice: ‘अदृश्य परमेश्वर’
  alternative: ‘अदृश्य जन’ या केवल ‘अदृश्य को’
  rationale: विशेषण निश्चित पद के साथ संज्ञावत् प्रयुक्त है और प्रसंग में परमेश्वर को सूचित करता है। ‘परमेश्वर’ जोड़ना हिंदी में निहित संदर्भ को स्पष्ट करता है, किसी संप्रदायगत विशिष्टता को नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। कृदंतीय संबंध ‘न डरकर’ और ‘देखते हुए’ से बचाए गए हैं। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी [a] मूलतः τὸν ἀόρατον की वैकल्पिक अंग्रेज़ी अभिव्यक्ति बताती प्रतीत होती है, पर वह मुख्य पाठ में ‘Egypt’ के बाद लगी है; स्रोत-साक्ष्य और दी गई व्याख्यात्मक सामग्री के अनुसार [a] को ऐतिहासिक संदर्भ की वास्तविक अनिश्चितता के लिए रखा गया है।
