base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/015.yaml
  text: And if they had been remembering that land from which they had gone out[a], they would have had opportunity to return.
translation:
  language: hi
  text: और यदि वे उस देश को याद करते रहते, जहाँ से वे निकल आए थे[a], तो उनके पास लौट जाने का अवसर होता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस मातृभूमि” या “उस भूमि।” यूनानी पाठ उस सांसारिक स्थान की ओर संकेत करता है जिसे वे पीछे छोड़ आए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: μνημονεύουσιν
  choice: याद करते रहते
  rationale: वर्तमानकालिक रूप इस अवास्तविक शर्त में निरंतर मन लगाए रहने का भाव देता है; यह केवल बीती बात याद आ जाने या भावुक लगाव का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: ἐκείνης
  choice: उस देश को
  rationale: स्त्रीलिंग संकेतवाचक सर्वनाम पिछले पद के πατρίδα की ओर संकेत करता है। हिंदी में संदर्भ स्पष्ट रखने के लिए ‘देश’ जोड़ा गया है; इसका आशय छोड़ा हुआ सांसारिक स्थान है, आधुनिक राजनीतिक राज्य आवश्यक नहीं।
- source_word: ἀφ’ ἧς
  choice: जहाँ से
  rationale: हिंदी में स्थान-स्रोत संबंध को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: ἐξέβησαν
  choice: वे निकल आए थे
  rationale: ἐκβαίνω के ‘बाहर निकलना’ भाव को बनाए रखता है और केवल सामान्य ‘छोड़ना’ से अधिक स्रोत-संगत है।
- source_word: εἶχον ἂν
  choice: उनके पास ... होता
  rationale: अपूर्ण भूतकाल और ἄν के अवास्तविक शर्तफल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: καιρὸν
  choice: अवसर
  rationale: यहाँ अर्थ केवल समय-अवधि नहीं, बल्कि लौटने का उपयुक्त मौका है।
- source_word: ἀνακάμψαι
  choice: लौट जाने का
  rationale: पीछे मुड़कर पूर्व स्थान पर वापस जाने के अर्थ को संक्षेप और सहज हिंदी में व्यक्त करता है।
- source_word: καὶ εἰ μὲν
  choice: और यदि
  rationale: पिछले कथन से संबंध बनाए रखता है; μέν को अलग भारी शब्द देकर अनावश्यक बल नहीं दिया गया।
theological_decisions:
- issue: याद किए जाने वाले ‘देश’ का स्वरूप
  choice: पहले छोड़ा हुआ सांसारिक देश
  alternative: सामान्य रूप से पुराना जीवन-मार्ग
  rationale: इब्रानियों 11:13–16 का निकट संदर्भ पूर्व सांसारिक देश की तुलना उत्तम, स्वर्गीय देश से करता है। इसलिए ठोस स्थान-संबंधी भाषा रखी गई है और उसे रूपकात्मक पुराने जीवन में नहीं बदला गया।
- issue: शर्त का स्वरूप
  choice: 'अवास्तविक/विपरीत-तथ्य शर्त: यदि वे उसे याद करते रहते, तो लौटने का अवसर होता'
  alternative: एक साधारण संभावित शर्त
  rationale: εἶχον ἂν वाला शर्तफल उस संभावना को दर्शाता है जो वास्तविक स्थिति नहीं बनी; हिंदी वाक्य-विन्यास इसे स्वाभाविक रूप से संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। ‘देश’ सामान्य भूस्थान/मातृभूमि के अर्थ में है, आवश्यक रूप से राजनीतिक राष्ट्र-राज्य के अर्थ में नहीं। ‘याद करते रहते’ निरंतर मानसिक अभिमुखता को व्यक्त करता है।
