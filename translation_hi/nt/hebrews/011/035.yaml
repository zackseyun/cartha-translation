source:
  edition: SBLGNT
  text: ἔλαβον γυναῖκες ἐξ ἀναστάσεως τοὺς νεκροὺς αὐτῶν· ἄλλοι δὲ ἐτυμπανίσθησαν, οὐ προσδεξάμενοι τὴν ἀπολύτρωσιν, ἵνα κρείττονος ἀναστάσεως τύχωσιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/035.yaml
  text: Women received back their dead by resurrection[a]; but others were tortured, not accepting release[c][b], so that they might obtain a better resurrection.
translation:
  language: hi
  text: स्त्रियों ने पुनरुत्थान के द्वारा अपने मृतकों को फिर से पाया; किन्तु दूसरों को यातना दी गई[b], और उन्होंने रिहाई स्वीकार नहीं की[a], ताकि वे एक उत्तम पुनरुत्थान प्राप्त करें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “रिहाई” का अनुवाद “छुटकारा” भी हो सकता है। यहाँ यूनानी शब्द यातना या मृत्यु से मुक्त किए जाने का संकेत देता है; आवश्यक नहीं कि इसका अर्थ उद्धार के धर्मवैज्ञानिक अर्थ में हो।
    reason: lexical_alternative
  - marker: b
    text: “यातना दी गई” के लिए प्रयुक्त यूनानी क्रिया कठोर शारीरिक यातना से जुड़ी है—सम्भवतः किसी चौखटे या ढोल-जैसे उपकरण पर पीटने से; ठीक विधि निश्चित नहीं है।
    reason: cultural_note
  - marker: c
    text: “उत्तम पुनरुत्थान” का विरोध पहले बताए गए मृतकों के सामान्य नश्वर जीवन में लौटने से है; यहाँ मृत्यु के पार एक श्रेष्ठ पुनरुत्थान की आशा का भाव है।
    reason: cross_reference
lexical_decisions:
- source_word: ἔλαβον
  choice: फिर से पाया
  rationale: मृत जनों के पुनर्जीवित होकर स्त्रियों के पास लौटने का भाव स्पष्ट करता है; केवल ‘पाया’ इस पुनर्प्राप्ति को पर्याप्त रूप से व्यक्त नहीं करता।
- source_word: γυναῖκες
  choice: स्त्रियों
  rationale: यह सामान्य बहुवचन है; संदर्भ इसे केवल पत्नियों तक सीमित नहीं करता।
- source_word: ἐξ ἀναστάσεως
  choice: पुनरुत्थान के द्वारा
  rationale: ἐξ यहाँ स्रोत अथवा माध्यम का भाव देता है; यह सहज हिन्दी में मृतकों की वापसी का साधन बताता है।
- source_word: τοὺς νεκροὺς αὐτῶν
  choice: अपने मरे हुओं को
  rationale: मूल के संबंधसूचक और व्यक्तिवाचक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄλλοι δὲ
  choice: परन्तु दूसरे लोग
  rationale: δέ पहले वर्णित छुटकारे और अब वर्णित कष्ट-सहन के बीच विरोध प्रकट करता है।
- source_word: ἐτυμπανίσθησαν
  choice: घोर यातना सहते रहे
  rationale: क्रिया कठोर शारीरिक उत्पीड़न बताती है, सम्भवतः किसी चौखटे या ढोल-जैसे उपकरण पर; निश्चित विधि न बताकर मूल की अनिश्चितता रखी गई है।
- source_word: οὐ προσδεξάμενοι
  choice: स्वीकार नहीं की
  rationale: यह प्रस्तावित रिहाई को जानबूझकर ठुकराने का भाव देता है।
- source_word: τὴν ἀπολύτρωσιν
  choice: रिहाई
  rationale: यहाँ तत्काल अर्थ यातना अथवा मृत्यु से छूटना है; ‘उद्धार’ अनावश्यक रूप से व्यापक धर्मवैज्ञानिक अर्थ ला सकता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उनके इनकार का उद्देश्य प्रस्तुत करता है।
- source_word: κρείττονος ἀναστάσεως
  choice: एक उत्तम पुनरुत्थान
  rationale: Hebrews में κρείττων का नियमित अर्थ ‘उत्तम/बेहतर’ है; ‘उत्तम’ गरिमामय और स्वाभाविक हिन्दी है।
- source_word: τύχωσιν
  choice: प्राप्त करें
  rationale: यहाँ क्रिया किसी वस्तु या दशा को पाने अथवा प्राप्त करने का अर्थ देती है।
theological_decisions:
- issue: ἀπολύτρωσιν का संदर्भगत अर्थ
  choice: यातना या मृत्यु से सांसारिक रिहाई
  alternative: व्यापक धर्मवैज्ञानिक अर्थ में छुटकारा या उद्धार
  rationale: तात्कालिक संदर्भ में विश्वासयोग्य पीड़ितों को जीवन बचाने वाली रिहाई प्रस्तावित है; ‘रिहाई’ प्रायश्चित्त अथवा अनन्त उद्धार का अर्थ आरोपित नहीं करती।
- issue: ‘उत्तम पुनरुत्थान’ का आशय
  choice: पहले खंड में नश्वर जीवन में वापस आने से श्रेष्ठ, मृत्यु के पार का पुनरुत्थान
  alternative: बिना स्पष्ट तुलना के केवल अधिक अनुकूल पुनरुत्थान
  rationale: पद की दो अर्ध-पंक्तियों का विरोध पहले अस्थायी पुनर्जीवन और फिर मृत्यु सहने वालों की श्रेष्ठ आशा के बीच तुलना सुझाता है, यद्यपि पुनरुत्थान की रीति को और परिभाषित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किन्तु सामान्य पाठकों के लिए सहज। ‘पुनरुत्थान’ धर्मग्रंथीय सटीकता के लिए रखा गया है; ‘रिहाई’ संदर्भगत और गैर-सांप्रदायिक है। सभी टिप्पणियों के चिह्न मुख्य पाठ में उपस्थित हैं।
