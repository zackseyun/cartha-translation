  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Κατὰ πίστιν ἀπέθανον οὗτοι πάντες, μὴ ⸀λαβόντες τὰς ἐπαγγελίας, ἀλλὰ πόρρωθεν αὐτὰς ἰδόντες καὶ ἀσπασάμενοι, καὶ ὁμολογήσαντες ὅτι ξένοι καὶ παρεπίδημοί εἰσιν ἐπὶ τῆς γῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/013.yaml
  text: All these died in faith[a], not having received the promises, but having seen them from afar and greeted them[c][b], and having confessed that they are strangers and exiles on the earth.
translation:
  language: hi
  text: ये सभी विश्वास में मरे। उन्होंने प्रतिज्ञाओं को प्राप्त किए बिना, बल्कि उन्हें दूर से देखकर उनका स्वागत किया और स्वीकार किया कि वे पृथ्वी पर परदेशी और प्रवासी हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रवासी’ का अर्थ ‘अस्थायी निवासी’ या ‘परदेश में रहनेवाला’ भी हो सकता है—ऐसा व्यक्ति जो किसी स्थान पर रहता है, पर वहाँ उसका स्थायी घर या पूर्ण नागरिक अधिकार नहीं होता।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κατὰ πίστιν
  choice: विश्वास में ही
  rationale: κατά + कर्मकारक यहाँ विश्वास के अनुरूप अथवा विश्वास की अवस्था में मरने का भाव देता है। ‘विश्वास में ही’ स्वाभाविक हिन्दी में उनके अंत तक बने रहे विश्वास पर बल देता है।
- source_word: μὴ λαβόντες τὰς ἐπαγγελίας
  choice: उन्होंने प्रतिज्ञाओं को पाया नहीं था
  rationale: नकारात्मक कृदन्त को स्वाभाविक हिन्दी उपवाक्य में व्यक्त किया गया है; बहुवचन ‘प्रतिज्ञाओं’ को सुरक्षित रखा गया है।
- source_word: πόρρωθεν αὐτὰς ἰδόντες
  choice: उन्हें दूर से देखकर
  rationale: दूरी के स्थानिक रूपक और पूर्वकालिक कृदन्त-सम्बन्ध, दोनों को संक्षेप और स्वाभाविकता से व्यक्त करता है।
- source_word: ἀσπασάμενοι
  choice: उनका स्वागत किया
  rationale: क्रिया का अर्थ अभिवादन करना या स्वागत करना हो सकता है। प्रतिज्ञाओं के रूपकात्मक कर्म होने पर ‘स्वागत किया’ हिन्दी में अर्थपूर्ण है और ‘गले लगाया’ से कम व्याख्यात्मक है।
- source_word: ὁμολογήσαντες
  choice: यह स्वीकार किया
  rationale: यह खुले रूप में मान लेने या घोषित करने का भाव व्यक्त करता है; यहाँ ‘अंगीकार किया’ की अपेक्षा सामान्य पाठकों के लिए अधिक सहज है।
- source_word: ξένοι καὶ παρεπίδημοί
  choice: परदेशी और प्रवासी
  rationale: 'दो अलग सामाजिक स्थितियों को बनाए रखता है: अपना देश न होने का भाव और किसी स्थान पर स्थायी अधिकार या बसाव के बिना रहना।'
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: सन्दर्भ व्यापक सांसारिक जीवन का है, किसी विशिष्ट भूभाग का नहीं; इसलिए γῆ का अनुवाद ‘पृथ्वी’ किया गया है।
theological_decisions:
- issue: Κατὰ πίστιν में विश्वास की भूमिका
  choice: विश्वास में ही
  alternative: विश्वास के अनुसार; विश्वास के कारण
  rationale: पाठ विश्वास को केवल मृत्यु का साधन नहीं, बल्कि अंत तक उनकी स्थायी दशा या मुद्रा के रूप में भी प्रस्तुत कर सकता है। ‘विश्वास में ही’ इस तनाव को अनावश्यक रूप से कारणात्मक नहीं बनाता।
- issue: ἀσπασάμενοι का प्रतिज्ञाओं के साथ रूपकात्मक प्रयोग
  choice: उनका स्वागत किया
  alternative: उनका अभिवादन किया; उन्हें गले लगाया
  rationale: ‘स्वागत किया’ सकारात्मक ग्रहणशीलता को व्यक्त करता है, जबकि प्रतिज्ञाएँ अभी प्राप्त नहीं हुई थीं। इससे प्राप्ति और स्वागत के बीच का पाठगत तनाव बना रहता है।
- issue: ξένοι καὶ παρεπίδημοί की यात्री/निर्वासन छवि
  choice: परदेशी और प्रवासी
  alternative: अजनबी और अस्थायी निवासी; परदेशी और निर्वासित
  rationale: ‘निर्वासित’ अनिवार्य निष्कासन का अतिरिक्त अर्थ जोड़ सकता है, जो παρεπίδημος में आवश्यक नहीं। ‘प्रवासी’ स्थायी अपनत्व के बिना निवास का भाव सहज हिन्दी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य गरिमापूर्ण पर सहज रखा गया है। यूनानी कृदन्त-श्रृंखला को हिन्दी के स्पष्ट समन्वित उपवाक्यों में बदला गया है। मुख्य पाठ में सभी पदचिह्नों का उल्लेख मौजूद है।
