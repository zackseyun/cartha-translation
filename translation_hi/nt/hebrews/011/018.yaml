  text: to whom it was said[a], “In Isaac your offspring will be called,”
translation:
  language: hi
  text: जिससे यह कहा गया था, “इसहाक के द्वारा तुम्हारी संतान कहलाएगी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρὸς ὃν
  choice: जिससे
  rationale: πρός और संबंधवाचक सर्वनाम यहाँ उस व्यक्ति को सूचित करते हैं जिससे बात कही गई; हिंदी में ‘जिससे’ स्वाभाविक और निकट अनुवाद है।
- source_word: ἐλαλήθη
  choice: यह कहा गया था
  rationale: λαλέω के एओरिस्ट कर्मवाच्य को अवैयक्तिक कर्मवाच्य में रखा गया है, जिससे यूनानी की निष्क्रिय अभिव्यक्ति बनी रहती है।
- source_word: ὅτι
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: ὅτι कथन की विषयवस्तु आरंभ करता है; हिंदी में उद्धरण-चिह्न इसका कार्य स्वाभाविक रूप से कर देते हैं, इसलिए अलग से ‘कि’ जोड़ना आवश्यक नहीं।
- source_word: Ἐν Ἰσαὰκ
  choice: इसहाक के द्वारा ही
  rationale: यहाँ ἐν वंश की वह निश्चित धारा बताता है जिसके द्वारा अब्राहम की प्रतिज्ञात संतान पहचानी जाएगी। ‘के द्वारा’ आधुनिक हिंदी में अर्थ स्पष्ट करता है; ‘ही’ इसहाक पर निहित बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κληθήσεταί
  choice: कहलाएगी
  rationale: καλέω के भविष्यत् कर्मवाच्य का सीधा और स्वाभाविक हिंदी रूप है; यह ‘बुलाई/नामित की जाएगी’ की अपेक्षा वंश के अभिधान का भाव बेहतर देता है।
- source_word: σοι
  choice: तुम्हारी
  rationale: यहाँ संप्रदान कारक अधिकारसूचक अर्थ रखता है और σπέρμα के साथ हिंदी में ‘तुम्हारी संतान’ बनता है।
- source_word: σπέρμα
  choice: संतान
  rationale: σπέρμα यहाँ सामूहिक एकवचन में वंश या भावी संतति को दर्शाता है। ‘संतान’ आधुनिक हिंदी में सुबोध है और ‘वंशजों’ की स्पष्ट बहुवचनात्मकता से बचता है।
theological_decisions:
- issue: इसहाक के माध्यम से प्रतिज्ञात वंश की पहचान
  choice: “इसहाक के द्वारा ही तुम्हारी संतान कहलाएगी”
  alternative: “इसहाक में तुम्हारा वंश कहलाएगा”
  rationale: चुना हुआ पाठ प्रतिज्ञात वंश की इसहाक से जुड़ी धारा को स्पष्ट करता है, पर इसे किसी विस्तृत संप्रदायगत व्याख्या में नहीं बदलता। ‘कहलाएगी’ मूल के आह्वान/अभिधान संबंधी तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और संक्षिप्त वाक्य। पूर्ववर्ती पद से संबंध बनाए रखने के लिए आरंभ में ‘जिससे’ रखा गया है।
