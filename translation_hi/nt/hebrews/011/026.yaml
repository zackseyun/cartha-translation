base_translation:
  language: en
  yaml_path: translation/nt/hebrews/011/026.yaml
  text: He considered the reproach of Messiah greater wealth than the treasures of Egypt[b][a], for he was looking to the reward.
translation:
  language: hi
  text: उसने मसीह[a] के अपमान[b] को मिस्र के खज़ानों से भी अधिक मूल्यवान धन समझा, क्योंकि वह प्रतिफल की ओर देख रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी Χριστός का अर्थ ‘अभिषिक्त जन’ है। यहाँ यह उपाधि है, इसलिए इसका अनुवाद ‘मसीह’ किया गया है।
    reason: alternative_reading
  - marker: b
    text: ‘मसीह का अपमान’ का अर्थ मसीह के लिए सहा गया अपमान, परमेश्वर के अभिषिक्त जन के साथ साझा किया गया अपमान, या वह अपमान हो सकता है जिसे इब्रानियों का लेखक मसीह में पूरा हुआ देखता है। यूनानी पदबंध इनमें से किसी एक अर्थ तक सीमित नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: μείζονα πλοῦτον
  choice: बढ़कर धन
  rationale: तुलनात्मक पदबंध मिस्र के खज़ानों की अपेक्षा अधिक मूल्यवान धन का भाव देता है। ‘बढ़कर धन’ इस मूल्यांकन को स्वाभाविक और संक्षिप्त हिन्दी में रखता है।
- source_word: ἡγησάμενος
  choice: उसने ... समझा
  rationale: ἡγέομαι यहाँ विचार करके किसी वस्तु का मूल्य आँकने के अर्थ में है। हिन्दी में स्वतंत्र क्रिया-वाक्य मूल कृदन्त का आशय स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τῶν Αἰγύπτου θησαυρῶν
  choice: मिस्र के खज़ानों से
  rationale: संबंधकारक पदबंध को तुलना के अनुरूप ‘से’ के साथ रखा गया है; इससे मिस्र की संचित संपदा का सीधा अर्थ बना रहता है।
- source_word: τὸν ὀνειδισμὸν
  choice: निन्दा
  rationale: ὀνειδισμός सार्वजनिक अपमान, तिरस्कार या बदनामी का भाव रखता है। ‘निन्दा’ आधुनिक बाइबलीय हिन्दी में गरिमापूर्ण है और अर्थ को केवल आंतरिक लज्जा तक सीमित नहीं करता।
- source_word: τοῦ Χριστοῦ
  choice: मसीह की
  rationale: Χριστός यहाँ उपाधि के रूप में प्रयुक्त है, इसलिए ‘मसीह’ चुना गया है। संबंधकारक को ‘की’ से यथावत रखा गया है ताकि मूसा और मसीह की निन्दा के बीच संबंध को व्याख्यात्मक रूप से संकीर्ण न किया जाए।
- source_word: ἀπέβλεπεν
  choice: उसकी दृष्टि ... लगी हुई थी
  rationale: अपूर्णकालिक क्रिया निरंतर ध्यान या अभिमुखता दर्शाती है। यह हिन्दी प्रयोग उस सतत दृष्टि को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μισθαποδοσίαν
  choice: प्रतिफल
  rationale: यह शब्द दिए जाने वाले फल या पुरस्कार को दर्शाता है। ‘प्रतिफल’ गरिमापूर्ण, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: मूसा के संबंध में ‘मसीह की निन्दा’ का आशय
  choice: संबंधकारक पदबंध को सीधे ‘मसीह की निन्दा’ रखा गया है।
  alternative: मसीह के लिए सही गई निन्दा; परमेश्वर के अभिषिक्त जन के साथ बाँटी गई निन्दा; या वह निन्दा जिसकी पूर्ति मसीह में दिखाई देती है।
  rationale: यूनानी पाठ संबंध की ठीक प्रकृति स्पष्ट नहीं करता। अनुवाद में किसी एक व्याख्या को मुख्य पाठ में बैठाने के बजाय मूल की धर्मवैज्ञानिक व्यापकता और तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सर्वसुलभ रूप रखा गया है। ‘खज़ाना’, ‘निन्दा’ और ‘प्रतिफल’ सामान्य पाठक के लिए स्पष्ट हैं; वाक्य-विन्यास मूल तुलना और कारण-सूचक संबंध को बनाए रखता है।
