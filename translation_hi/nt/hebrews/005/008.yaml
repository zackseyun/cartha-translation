  text: यद्यपि वह पुत्र था,[a] फिर भी उसने जो कुछ सहा,[b] उससे आज्ञाकारिता सीखी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल “पुत्र” है, कोई उपपद नहीं। सन्दर्भ के अनुसार इसका अर्थ “एक पुत्र” या “वह पुत्र” समझा जा सकता है; हिन्दी का “पुत्र” दोनों सम्भावनाओं को खुला रखता है।
