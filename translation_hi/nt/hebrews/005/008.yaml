lexical_decisions:
- source_word: καίπερ
  choice: यद्यपि … फिर भी
  rationale: 'यह रियायती विरोध को स्वाभाविक हिन्दी में व्यक्त करता है: पुत्र होने पर भी उसने दुःखों के द्वारा आज्ञाकारिता सीखी।'
- source_word: ὢν υἱός
  choice: वह पुत्र था
  rationale: कृदन्तीय यूनानी रचना को सहज हिन्दी के सीमित उपवाक्य में रखा गया है। υἱός यहाँ विधेय रूप में है; हिन्दी में लेख न होने के कारण ‘पुत्र’ मूल की अनिश्चितता/निश्चितता को खुला रखता है।
- source_word: ἔμαθεν
  choice: उसने … सीखी
  rationale: μανθάνω का सीधा अर्थ ‘सीखना’ है; कथन को धर्मवैज्ञानिक कठिनाई से बचाने के लिए नरम या विस्तृत नहीं किया गया।
- source_word: ἀφ’ ὧν ἔπαθεν
  choice: अपने दुःखों से
  rationale: ἀπό स्रोत या अनुभवगत आधार दर्शाता है, और बहुवचन सापेक्ष ὧν को हिन्दी में ‘दुःखों’ द्वारा संक्षेप और स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: τὴν ὑπακοήν
  choice: आज्ञाकारिता
  rationale: यह परमेश्वर की इच्छा के प्रति आज्ञापूर्ण समर्पण का भाव रखता है; हिन्दी में भाववाचक संज्ञा के साथ किसी लेख की आवश्यकता नहीं।
theological_decisions:
- issue: पुत्र होते हुए मसीह के सीखने का कथन
  choice: यद्यपि वह पुत्र था
  alternative: यद्यपि वह परमेश्वर का पुत्र था
  rationale: मूल में केवल υἱός है। ‘पुत्र’ मसीह-संबंधी पहचान को बनाए रखता है, पर ‘परमेश्वर का’ जोड़कर मूल से अधिक स्पष्ट नहीं करता। हिन्दी में यह रूप ‘एक पुत्र’ और ‘वह पुत्र’ के बीच यूनानी रचना की वास्तविक व्याख्यात्मक गुंजाइश भी बनाए रखता है।
- issue: ‘आज्ञाकारिता सीखी’ से पूर्व अवज्ञा का संभावित संकेत
  choice: सीधे कथन को बनाए रखा गया
  alternative: उसने अनुभव से जाना कि आज्ञाकारिता क्या होती है
  rationale: मूल स्पष्ट रूप से कहता है कि उसने आज्ञाकारिता सीखी। अनुवाद इस धर्मवैज्ञानिक तनाव को व्याख्यात्मक विस्तार से समाप्त नहीं करता; टिप्पणी स्पष्ट करती है कि आशय दुःख के बीच अनुभवगत सीख है, पूर्व अवज्ञा का सुधार नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज वाक्य-विन्यास अपनाया गया है। ‘यद्यपि … फिर भी’ विरोध को स्पष्ट करता है; ‘अपने दुःखों से’ मूल के बहुवचन और अनुभवगत स्रोत को संक्षेप में व्यक्त करता है।
