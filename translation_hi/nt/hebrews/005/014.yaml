source:
  edition: SBLGNT
  text: τελείων δέ ἐστιν ἡ στερεὰ τροφή, τῶν διὰ τὴν ἕξιν τὰ αἰσθητήρια γεγυμνασμένα ἐχόντων πρὸς διάκρισιν καλοῦ τε καὶ κακοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/014.yaml
  text: But solid food is for the mature[b][a], who because of practice have their powers of discernment trained to distinguish both good and evil.
translation:
  language: hi
  text: पर ठोस भोजन परिपक्व लोगों के लिए है, जिनकी परखने की क्षमताएँ[b] लगातार अभ्यास[a] से भले और बुरे में भेद करने के लिए प्रशिक्षित हो चुकी हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आदत के कारण” अथवा “निरंतर उपयोग से।”
    reason: lexical_alternative
  - marker: b
    text: मूल भाषा में शाब्दिक अर्थ “इंद्रियाँ” है; यहाँ यह व्यक्ति की परखने और समझने की आंतरिक क्षमताओं के लिए रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τελείων
  choice: परिपक्व लोगों
  rationale: निकटवर्ती संदर्भ में दूध पीने वाले शिशुओं के विपरीत ऐसे लोगों का संकेत है जो समझ और आत्मिक विकास में आगे बढ़ चुके हैं; यह अनुवाद पापरहित सिद्धता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: στερεὰ τροφή
  choice: ठोस भोजन
  rationale: दूध के साथ मूल रूपकात्मक विरोध को स्वाभाविक और स्पष्ट हिन्दी में बनाए रखता है।
- source_word: διὰ τὴν ἕξιν
  choice: लगातार अभ्यास से
  rationale: ἕξις आदत, अभ्यास अथवा बार-बार उपयोग से बनी दशा को व्यक्त करता है; 'लगातार अभ्यास' इस विकसित आदत को स्पष्ट करता है।
- source_word: τὰ αἰσθητήρια
  choice: परखने की क्षमताएँ
  rationale: शाब्दिक अर्थ इंद्रियाँ या अनुभूति की क्षमताएँ है, पर यहाँ रूपक रूप में नैतिक-आत्मिक परख की आंतरिक क्षमताओं का संकेत है।
- source_word: γεγυμνασμένα ἐχόντων
  choice: प्रशिक्षित हो चुकी हैं
  rationale: पूर्ण निष्क्रिय कृदंत उस वर्तमान परिणामी दशा को व्यक्त करता है जो पिछले प्रशिक्षण से बनी है।
- source_word: πρὸς διάκρισιν
  choice: भेद करने के लिए
  rationale: πρός के साथ διάκρισις यहाँ उद्देश्य अथवा परिणाम दर्शाता है; यह हिन्दी में अगली पदावली से सीधे जुड़ता है।
- source_word: καλοῦ τε καὶ κακοῦ
  choice: भले और बुरे
  rationale: τε καὶ दोनों पक्षों को साथ रखता है; हिन्दी में यह जोड़ी नैतिक भेद को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: δέ
  choice: पर
  rationale: पिछले पद में दूध और अपरिपक्वता की बात के साथ विरोध को संक्षेप और स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: आत्मिक विकास के संदर्भ में τελείων का अर्थ
  choice: परिपक्व लोगों
  alternative: सिद्ध लोगों / पूर्ण-विकसित लोगों
  rationale: संदर्भ अपरिपक्व और विकसित समझ वाले लोगों के बीच अंतर करता है, न कि आवश्यक रूप से नैतिक रूप से निष्पाप लोगों की श्रेणी स्थापित करता है। 'परिपक्व' मूल शब्द की पूर्णता/विकास की धारणा को रखते हुए किसी विशिष्ट सिद्धतावादी मत को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। दूध और ठोस भोजन का मूल रूपक सुरक्षित रखा गया है।
