    text: या, “मेल्कीसेदेक के विषय में”; यूनानी संबंधवाचक सर्वनाम मेल्कीसेदेक व्यक्ति की ओर संकेत कर सकता है, यद्यपि यहाँ वह संभवतः चर्चा के व्यापक विषय की ओर संकेत करता है।
    reason: alternative_reading
  - marker: b
    text: या, “इसे समझाना कठिन है” अथवा “इसे खोलकर बताना कठिन है।”
