theological_decisions:
- issue: Περὶ οὗ का संकेत
  choice: 'मुख्य पाठ में व्यापक विषय की ओर संकेत: ''इस विषय में'''
  alternative: 'मेल्कीसेदेक व्यक्ति की ओर संकेत: ''उसके विषय में'''
  rationale: निकटतम पूर्वपद मेल्कीसेदेक है, इसलिए व्यक्तिगत संकेत व्याकरण की दृष्टि से संभव है। फिर भी आगे की शिक्षा के व्यापक विषय को प्रस्तुत करने के कारण मुख्य पाठ में विषयगत अर्थ अधिक स्वाभाविक है; पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और शिक्षण-संदर्भ के अनुकूल रूप। 'इस विषय में' मूल की संदर्भगत अस्पष्टता को पादटिप्पणी सहित रखता है; 'सुनने में सुस्त' श्रवण के रूपक को बिना अत्यधिक व्याख्या के सुरक्षित रखता है।
