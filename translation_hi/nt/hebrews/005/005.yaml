id: HEB.5.5
reference: Hebrews 5:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οὕτως καὶ ὁ Χριστὸς οὐχ ἑαυτὸν ἐδόξασεν γενηθῆναι ἀρχιερέα, ἀλλ’ ὁ λαλήσας πρὸς αὐτόν· Υἱός μου εἶ σύ, ἐγὼ σήμερον γεγέννηκά σε·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/005.yaml
  text: 'So also the Messiah did not glorify himself to become high priest[a], but the one who spoke to him: “You are my Son[c][b]; today I have begotten you.”'
translation:
  language: hi
  text: 'इसी प्रकार मसीह ने भी महायाजक बनने के लिए अपने आप को महिमा नहीं दी,[a] बल्कि जिसने उससे कहा:


    “तुम मेरे पुत्र हो;

    आज मैंने तुम्हें उत्पन्न किया है।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को सम्मान नहीं दिया।” यूनानी क्रिया का अर्थ “महिमा देना” या “सम्मान करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: भजन 2:7 से उद्धरण।
    reason: cross_reference
lexical_decisions:
- source_word: Οὕτως καὶ
  choice: इसी प्रकार ... भी
  rationale: यह पिछले पद में याजक की नियुक्ति के विषय से तुलना जोड़ता है और यूनानी वाक्यांश की तुलनात्मक शक्ति बनाए रखता है।
- source_word: ὁ Χριστὸς
  choice: मसीह
  rationale: हिन्दी में ‘मसीह’ Χριστός के पदवी-संबंधी अर्थ को स्वाभाविक और प्रचलित ढंग से व्यक्त करता है।
- source_word: οὐχ ἑαυτὸν ἐδόξασεν
  choice: स्वयं अपनी महिमा नहीं की
  rationale: यह आत्मवाचक रचना और δοξάζω के ‘महिमा देना/सम्मानित करना’ अर्थ को बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: γενηθῆναι ἀρχιερέα
  choice: महायाजक बनने के लिए
  rationale: यह किसी पद या भूमिका में आने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀλλ’ ὁ λαλήσας πρὸς αὐτόν
  choice: बल्कि उस परमेश्वर ने उसे यह पद दिया, जिसने उससे कहा
  rationale: यूनानी में मुख्य क्रिया संदर्भ से लुप्त है; हिन्दी में स्पष्टता के लिए पद देने का भाव पूरा किया गया है। उद्धरण के संदर्भ से वक्ता परमेश्वर है।
- source_word: Υἱός μου εἶ σύ
  choice: तुम मेरे पुत्र हो
  rationale: यह मूल कथन का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ἐγὼ σήμερον γεγέννηκά σε
  choice: आज मैंने तुम्हें जन्म दिया है
  rationale: यह भजन 2:7 के उद्धरण और γεννάω की जन्म-संबंधी भाषा को बिना किसी विशेष धर्मवैज्ञानिक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: Χριστός का पदवी-संबंधी प्रयोग
  choice: मसीह
  alternative: ख्रीष्ट/क्राइस्ट
  rationale: यहाँ शब्द नियुक्त पद के तर्क में प्रयुक्त है; ‘मसीह’ हिन्दी में अभिषिक्त पदवी का स्थापित रूप है और नाम मात्र की तरह पढ़े जाने से बचाता है।
- issue: ‘आज मैंने तुम्हें जन्म दिया है’ का मसीह-संबंधी आशय
  choice: उद्धरण को बिना व्याख्यात्मक विस्तार के यथावत रखना
  alternative: मुख्य पाठ में इसे राज्याभिषेक, पुनरुत्थान या अनन्त उत्पत्ति के रूप में स्पष्ट करना
  rationale: मूल पाठ स्वयं इनमें से किसी एक धर्मवैज्ञानिक व्याख्या को यहाँ स्पष्ट नहीं करता; इसलिए उसकी वास्तविक तनावपूर्ण व्यापकता सुरक्षित रखी गई है।
- issue: वक्ता और लुप्त मुख्य क्रिया की पूर्ति
  choice: ‘उस परमेश्वर ने उसे यह पद दिया’
  alternative: केवल ‘बल्कि उसने, जिसने उससे कहा’
  rationale: यूनानी में विरोध से अपेक्षित क्रिया समझी जाती है। हिन्दी में अधूरापन टालने के लिए नियुक्ति का भाव स्पष्ट किया गया है, जबकि वक्ता की पहचान उद्धरण के संदर्भानुसार परमेश्वर के रूप में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। काव्यात्मक उद्धरण को अलग पंक्तियों में रखा गया है। ‘महायाजक’ और ‘मसीह’ जैसे स्थापित बाइबलीय पदों का प्रयोग किया गया है।
