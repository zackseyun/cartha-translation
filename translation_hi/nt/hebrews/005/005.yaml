revisions:
- from: 'इसी प्रकार मसीह ने भी महायाजक बनने के लिए स्वयं अपनी महिमा नहीं की,[a] बल्कि उस परमेश्वर ने उसे यह पद दिया, जिसने उससे कहा:

    “तुम मेरे पुत्र हो;

    आज मैंने तुम्हें जन्म दिया है।”[b]'
  to: 'इसी प्रकार मसीह ने भी महायाजक बनने के लिए अपने आप को महिमा नहीं दी,[a] बल्कि जिसने उससे कहा:


    “तुम मेरे पुत्र हो;

    आज मैंने तुम्हें उत्पन्न किया है।”[b]'
  rationale: 'The revision removes the unsupported explicit reference to परमेश्वर and “gave him this office,” retaining the Greek’s elliptical contrast. It also makes the reflexive expression more direct and uses “उत्पन्न किया है” for the Psalm citation’s formal begetting language. Footnote markers remain correctly anchored: a to the lexical rendering of ἐδόξασεν, and b to the quotation.'
  reviewer_model: gpt-5.6-terra
