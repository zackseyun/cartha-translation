review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately renders the comparison, Messiah, high-priestly role, and Psalm quotation. However, “उस परमेश्वर ने उसे यह पद दिया” explicitly identifies the speaker as God and supplies “gave him this office,” neither of which is stated in the Greek. The Greek deliberately uses an ellipsis: “but [the one] who spoke to him.” The Hindi should preserve this restrained formulation.'
  naturalness: Most wording is clear and suitably dignified. “स्वयं अपनी महिमा नहीं की” is understandable, but “अपने आप को ... महिमा नहीं दी” represents the reflexive construction more directly. “उत्पन्न किया है” is a more idiomatic formal-scriptural rendering of the Psalm’s begetting language than “जन्म दिया है,” which can suggest physical childbirth in modern Hindi.
  terminology: “मसीह” and “महायाजक” are established, appropriate terms. “पुत्र” correctly retains the filial title. No doctrinal interpretation should be added to the Psalm citation.
  issues:
  - severity: medium
    issue: The main text adds “उस परमेश्वर ने उसे यह पद दिया.”
    rationale: The source has a deliberately elliptical contrast, literally “but the one who spoke to him.” Although God and appointment are inferable from context, explicitly naming God and stating that he gave the office exceeds this verse’s wording. The supplied Hindi should preserve the ellipsis without making the implied action more specific than the Greek.
  - severity: low
    issue: “जन्म दिया है” can carry an unnecessarily physical sense in Hindi.
    rationale: For the formal quotation of Psalm 2:7, “उत्पन्न किया है” more naturally preserves the traditional and lexical sense of “begotten” without interpretive expansion.
  revised_text: 'इसी प्रकार मसीह ने भी महायाजक बनने के लिए अपने आप को महिमा नहीं दी,[a] बल्कि जिसने उससे कहा:


    “तुम मेरे पुत्र हो;

