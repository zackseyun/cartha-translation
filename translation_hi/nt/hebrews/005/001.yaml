source:
  edition: SBLGNT
  text: Πᾶς γὰρ ἀρχιερεὺς ἐξ ἀνθρώπων λαμβανόμενος ὑπὲρ ἀνθρώπων καθίσταται τὰ πρὸς τὸν θεόν, ἵνα προσφέρῃ δῶρά τε καὶ θυσίας ὑπὲρ ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/001.yaml
  text: For every high priest[a], being taken from among men, is appointed on behalf of men in the things pertaining to God, so that he may offer both gifts and sacrifices for sins,
translation:
  language: hi
  text: क्योंकि हर महायाजक मनुष्यों[a] में से लिया गया और मनुष्यों की ओर से परमेश्वर से संबंधित मामलों में नियुक्त किया जाता है, ताकि वह पापों के लिए भेंटें और बलिदान चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ यूनानी शब्द का अर्थ ‘मनुष्य’ या ‘मानव-जाति के लोग’ है। उस समय महायाजक पुरुष होता था, पर वाक्य उसे मानव समुदाय में से लिया हुआ और मनुष्यों का प्रतिनिधि बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Πᾶς γὰρ ἀρχιερεὺς
  choice: क्योंकि हर महायाजक
  rationale: Πᾶς का एकवचन प्रयोग पद के प्रत्येक धारक के विषय में सामान्य कथन करता है; γὰρ पिछले विचार का कारण अथवा समर्थन प्रस्तुत करता है; ἀρχιερεύς के लिए ‘महायाजक’ प्रचलित और सटीक धार्मिक पदनाम है।
- source_word: ἐξ ἀνθρώπων λαμβανόμενος
  choice: मनुष्यों में से लिया जाकर
  rationale: यह अनुवाद निष्क्रिय कृदंत और मनुष्य-समुदाय में से महायाजक के लिए किसी व्यक्ति को लिए जाने—दोनों भावों को बनाए रखता है। ‘चुना जाकर’ अधिक सहज होता, पर वह चयन का ऐसा स्पष्ट भाव जोड़ सकता है जो λαμβανόμενος में अनिवार्य नहीं है।
- source_word: ὑπὲρ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: यहाँ ὑπέρ प्रतिनिधित्व और हित का भाव व्यक्त करता है; ‘की ओर से’ महायाजक की मध्यस्थ भूमिका को स्वाभाविक हिंदी में प्रकट करता है।
- source_word: καθίσταται
  choice: नियुक्त किया जाता है
  rationale: संदर्भ में क्रिया किसी व्यक्ति को याजकीय पद और दायित्व में स्थापित किए जाने का संकेत देती है; ‘नियुक्त’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: τὰ πρὸς τὸν θεόν
  choice: परमेश्वर से संबंधित बातों के लिए
  rationale: यूनानी मुहावरा परमेश्वर की ओर उन्मुख उपासना और सेवा के मामलों को दर्शाता है। यह अभिव्यक्ति अर्थ को व्यापक रखती है और उसे केवल किसी एक धार्मिक कार्य तक सीमित नहीं करती।
- source_word: ἵνα προσφέρῃ
  choice: ताकि वह ... चढ़ाए
  rationale: ἵνα और विधिलिंग क्रिया प्रयोजन व्यक्त करते हैं; ‘ताकि’ इस उद्देश्य-संबंध को सहज रूप से बनाए रखता है।
- source_word: δῶρά τε καὶ θυσίας
  choice: भेंटें और बलिदान
  rationale: दोनों संज्ञाओं को अलग रखा गया है, क्योंकि वे याजकीय चढ़ावों की व्यापकता दर्शाती हैं। हिंदी में ‘और’ τε καὶ के संयुक्त भाव को पर्याप्त रूप से व्यक्त करता है।
- source_word: ὑπὲρ ἁμαρτιῶν
  choice: पापों के लिए
  rationale: बलिदान-संबंधी संदर्भ में यह स्वाभाविक हिंदी है और पापों के संबंध में चढ़ाई जाने वाली भेंटों तथा बलिदानों का भाव बनाए रखती है।
theological_decisions:
- issue: ἀνθρώπων में मानवता-सूचक प्रतिनिधिक भाषा
  choice: दोनों स्थानों पर ‘मनुष्यों’
  alternative: ‘लोगों’ अथवा संदर्भ को पुरुषों तक सीमित करने वाला ‘पुरुषों’
  rationale: ἄνθρωπος सामान्यतः ‘मनुष्य/मानव’ को दर्शाता है। ऐतिहासिक महायाजकीय पद पुरुषों का था, पर इस पद में शब्द महायाजक को मानव समुदाय में से लिया हुआ और उसी समुदाय का प्रतिनिधि बताता है। ‘मनुष्यों’ मूल की पुनरावृत्ति तथा व्यापक मानवीय आशय दोनों को सुरक्षित रखता है; फुटनोट ऐतिहासिक पुरुष-पद का संदर्भ स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लिया जाकर’ जानबूझकर कुछ औपचारिक है, क्योंकि यह मूल के निष्क्रिय कृदंत को सुरक्षित रखता है; शेष वाक्य स्वाभाविक हिंदी क्रम में है।
