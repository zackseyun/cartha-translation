id: HEB.5.4
reference: Hebrews 5:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐχ ἑαυτῷ τις λαμβάνει τὴν τιμήν, ἀλλὰ καλούμενος ὑπὸ τοῦ θεοῦ, ⸀καθώσπερ καὶ Ἀαρών.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/004.yaml
  text: And no one takes this honor for himself[a], but is called by God, just as Aaron also was.
translation:
  language: hi
  text: और कोई भी यह सम्मान[a] अपने लिए नहीं लेता, बल्कि वह परमेश्वर के द्वारा बुलाया जाता है, जैसे हारून भी बुलाया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘सम्मान’; प्रसंग में इससे याजक की गरिमा या पद का संकेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τις (with οὐχ)
  choice: कोई भी नहीं
  rationale: 'नकार के साथ यह स्वाभाविक हिन्दी में सार्वभौमिक निषेध व्यक्त करता है: ‘कोई भी … नहीं।’'
- source_word: ἑαυτῷ
  choice: अपने लिए
  rationale: सम्बन्धवाचक चतुर्थी यहाँ सम्मान को स्वयं ग्रहण करने या अपने लिए हथियाने का भाव देती है।
- source_word: λαμβάνει
  choice: लेता
  rationale: ‘लेता’ आत्म-ग्रहण और परमेश्वर के बुलावे के बीच के विरोध को बनाए रखता है; ‘पाता’ इस विरोध को कमजोर कर सकता है।
- source_word: τὴν τιμήν
  choice: यह सम्मान
  rationale: ‘सम्मान’ τιμή का सीधा अर्थ है, और ‘यह’ निकटवर्ती प्रसंग में महायाजकीय गरिमा की ओर संकेत स्पष्ट करता है, बिना इसे सीधे ‘पद’ बना देने के।
- source_word: καλούμενος ὑπὸ τοῦ θεοῦ
  choice: वह परमेश्वर के द्वारा बुलाया जाता है
  rationale: यह यूनानी के कर्मवाच्य रूप और बुलाने वाले के रूप में परमेश्वर—दोनों को सुरक्षित रखता है।
- source_word: καθώσπερ καὶ Ἀαρών
  choice: जैसे हारून भी बुलाया गया था
  rationale: तुलना को स्वाभाविक हिन्दी में पूरा करने के लिए निहित क्रिया दोहराई गई है; ‘भी’ καί का भाव रखता है।
theological_decisions:
- issue: याजकीय सम्मान की नियुक्ति
  choice: यह सम्मान स्वयं ग्रहण नहीं किया जाता; व्यक्ति परमेश्वर द्वारा बुलाया जाता है, और हारून इसका उदाहरण है।
  alternative: इसे याजकीय पद के बजाय सामान्य सम्मान के विषय में व्यापक कथन माना जाए।
  rationale: इब्रानियों 5:1–5 का तत्काल प्रसंग महायाजक के विषय में है। फिर भी τιμή का अनुवाद ‘सम्मान’ रखा गया है, ताकि मूल शब्द को व्याख्यात्मक रूप से ‘पद’ में न बदला जाए।
- issue: कृदन्त καλούμενος का सम्बन्ध
  choice: इसे मुख्य कथन के विपरीत परमेश्वर के बुलावे की अवस्था के रूप में व्यक्त किया गया है।
  alternative: ‘केवल तभी, जब परमेश्वर बुलाए’ कहकर स्पष्ट शर्त बनाई जाए।
  rationale: यूनानी में ‘केवल तभी’ के लिए अलग शब्द नहीं है; इसलिए विरोध को बनाए रखते हुए अतिरिक्त शर्तसूचक भाषा नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘परमेश्वर के द्वारा’ कर्मवाच्य और दैवी कर्तृत्व को स्पष्ट रखता है; हारून के खंड में निहित क्रिया स्वाभाविकता के लिए पूरी की गई है।
