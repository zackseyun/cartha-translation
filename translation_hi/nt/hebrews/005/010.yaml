translation:
  language: hi
  text: परमेश्वर ने उन्हें मलिकिसिदक की रीति के अनुसार महायाजक घोषित किया[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने उन्हें महायाजक कहा” अथवा “परमेश्वर ने उन्हें महायाजक नियुक्त किया।”
    reason: lexical_alternative
  - marker: b
    text: यह भजन 110:4 की प्रतिध्वनि है, जहाँ कहा गया है कि याजकत्व “मलिकिसिदक की रीति के अनुसार” है।
    reason: cross_reference
lexical_decisions:
- source_word: προσαγορευθεὶς
  choice: घोषित किया
  rationale: यह προσαγορεύω का अओरिस्ट कर्मवाच्य कृदन्त है और यहाँ परमेश्वर द्वारा यीशु को औपचारिक रूप से महायाजक कहे या घोषित किए जाने का भाव देता है। हिन्दी में सक्रिय रचना अधिक स्वाभाविक है और कर्मवाच्य अर्थ को ‘परमेश्वर ने उन्हें’ द्वारा सुरक्षित रखती है। ‘नियुक्त किया’ सम्भव है, पर वह मूल क्रिया से अधिक प्रबल पदस्थापन का भाव दे सकता है।
- source_word: ὑπὸ τοῦ θεοῦ
  choice: परमेश्वर ने
  rationale: ὑπό के साथ सम्बन्धकारक कर्मवाच्य क्रिया के व्यक्तिगत कर्ता को दर्शाता है। स्वाभाविक हिन्दी सक्रिय रचना में इसे ‘परमेश्वर ने’ कहा गया है; ‘पिता’ नहीं जोड़ा गया।
- source_word: ἀρχιερεὺς
  choice: महायाजक
  rationale: ἀρχιερεύς के लिए प्रचलित, स्पष्ट और सन्दर्भानुकूल हिन्दी पद।
- source_word: κατὰ τὴν τάξιν
  choice: की रीति के अनुसार
  rationale: κατά यहाँ अनुरूपता या समान प्रतिमान का भाव देता है। τάξις केवल क्रम नहीं, बल्कि याजकत्व की रीति, प्रकार या व्यवस्था को सूचित करता है। ‘रीति के अनुसार’ भजन 110:4 की प्रतिध्वनि और इब्रानियों की वैचारिक कड़ी बनाए रखता है।
- source_word: Μελχισέδεκ
  choice: मलिकिसिदक
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परम्परा से परिचित लिप्यन्तरण।
theological_decisions:
- issue: क्या προσαγορευθεὶς को ऐसी नियुक्ति के रूप में व्यक्त किया जाए जो स्थिति-परिवर्तन का संकेत दे, या औपचारिक नामकरण/घोषणा के रूप में
  choice: परमेश्वर ने उन्हें ... महायाजक घोषित किया
  alternative: परमेश्वर ने उन्हें ... महायाजक नियुक्त किया; परमेश्वर ने उन्हें ... महायाजक कहा
  rationale: ‘घोषित किया’ ईश्वरीय औपचारिक नामकरण को व्यक्त करता है, पर मूल क्रिया से अधिक प्रबल संस्थागत पदस्थापन या किसी अस्तित्वगत परिवर्तन को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। यूनानी कर्मवाच्य कृदन्त को हिन्दी की अधिक सहज सक्रिय रचना में व्यक्त किया गया है, बिना कर्ता या अर्थ बदले।
