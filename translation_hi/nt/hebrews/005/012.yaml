id: HEB.5.12
reference: Hebrews 5:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ γὰρ ὀφείλοντες εἶναι διδάσκαλοι διὰ τὸν χρόνον, πάλιν χρείαν ἔχετε τοῦ διδάσκειν ὑμᾶς ⸀τινὰ τὰ στοιχεῖα τῆς ἀρχῆς τῶν λογίων τοῦ θεοῦ, καὶ γεγόνατε χρείαν ἔχοντες γάλακτος, ⸀οὐ στερεᾶς τροφῆς.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/012.yaml
  text: For although by this time you ought to be teachers[a], you again need someone to teach you the basic elements of the beginning of the oracles of God, and you have come to need milk[b], not solid food.
translation:
  language: hi
  text: क्योंकि इतना समय बीत जाने पर तुम्हें शिक्षक हो जाना चाहिए था, फिर भी तुम्हें फिर से किसी ऐसे व्यक्ति की ज़रूरत है जो तुम्हें सिखाए कि परमेश्वर के वचनों की आरम्भिक शिक्षाओं के मूल तत्त्व क्या हैं। तुम ऐसी अवस्था में आ गए हो कि तुम्हें दूध की ज़रूरत है, ठोस भोजन की नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφείλοντες εἶναι
  choice: होना चाहिए था
  rationale: अपेक्षित दायित्व और अब तक उस अवस्था तक पहुँच जाने की बात स्वाभाविक हिन्दी में व्यक्त होती है।
- source_word: διδάσκαλοι
  choice: शिक्षक
  rationale: दूसरों को शिक्षा देने योग्य व्यक्तियों के लिए मानक और सहज शब्द।
- source_word: διὰ τὸν χρόνον
  choice: इतना समय बीत जाने पर
  rationale: बीते हुए समय के कारण अपेक्षित परिपक्वता का भाव स्पष्ट करता है।
- source_word: πάλιν
  choice: दोबारा
  rationale: पुनः आरम्भिक शिक्षा की आवश्यकता और पीछे लौटने का भाव बनाए रखता है।
- source_word: τοῦ διδάσκειν ὑμᾶς
  choice: किसी ऐसे व्यक्ति की ज़रूरत है जो तुम्हें ... सिखाए
  rationale: यूनानी में शिक्षक का कर्ता अनिर्दिष्ट है; हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘किसी ऐसे व्यक्ति’ कहा गया है।
- source_word: τινὰ τὰ στοιχεῖα τῆς ἀρχῆς
  choice: आरम्भिक बातों के मूल तत्त्व
  rationale: στοιχεῖα के बुनियादी घटकों और ἀρχῆς के आरम्भिक स्तर—दोनों को बिना अनावश्यक तकनीकीपन के बनाए रखता है।
- source_word: τῶν λογίων τοῦ θεοῦ
  choice: परमेश्वर के वचन
  rationale: λόγια यहाँ परमेश्वर की ओर से आए कथनों या प्रकाशनों को दर्शाता है; ‘वचन’ हिन्दी बाइबलीय प्रयोग में गरिमापूर्ण और सुबोध है।
- source_word: γεγόνατε χρείαν ἔχοντες
  choice: तुम ऐसे हो गए हो कि तुम्हें ... चाहिए
  rationale: पूर्णकालिक क्रिया से व्यक्त वर्तमान परिणामी अवस्था को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: γάλακτος, οὐ στερεᾶς τροφῆς
  choice: ठोस भोजन नहीं, बल्कि दूध
  rationale: मूल रूपक और उसके जोरदार विरोध को बनाए रखता है; हिन्दी में ‘नहीं, बल्कि’ प्रतिकूलता को स्पष्ट करता है।
theological_decisions:
- issue: दूध और ठोस भोजन का रूपक
  choice: रूपक को ज्यों का त्यों रखा गया है
  alternative: इसे ‘आरम्भिक शिक्षा’ और ‘उन्नत शिक्षा’ कहकर स्पष्ट करना
  rationale: पद स्वयं किसी विशिष्ट धार्मिक पाठ्यक्रम को परिभाषित नहीं करता; रूपक को बनाए रखना लेखक की अलंकारिक शक्ति और धर्मवैचारिक खुलापन सुरक्षित रखता है।
- issue: λόγια τοῦ θεοῦ का अर्थ
  choice: परमेश्वर के वचन
  alternative: परमेश्वर की दिव्य उक्तियाँ
  rationale: ‘वचन’ दिव्य कथनों या प्रकाशनों का भाव देता है और इसे मूर्तिपूजक भविष्यवाणी अथवा सामान्य मानवीय शब्दों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, बहुवचन अनौपचारिक ‘तुम’ के साथ। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। दो वाक्यों में विभाजन हिन्दी में स्पष्टता और मौखिक प्रवाह बढ़ाता है।
