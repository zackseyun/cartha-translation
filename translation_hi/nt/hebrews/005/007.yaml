id: HEB.5.7
reference: Hebrews 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ δεήσεις τε καὶ ἱκετηρίας πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων προσενέγκας καὶ εἰσακουσθεὶς ἀπὸ τῆς εὐλαβείας,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/007.yaml
  text: who[a], in the days of his flesh, having offered up both prayers and petitions with loud cries and tears to the one able to save him from death, and having been heard because of his reverence[b],
translation:
  language: hi
  text: उसने अपने देहधारी जीवन के दिनों में, ऊँची पुकार और आँसुओं के साथ, उसकी ओर जो उसे मृत्यु से बचाने में समर्थ था[a], प्रार्थनाएँ और विनतियाँ अर्पित कीं; और अपनी श्रद्धा के कारण उसकी सुन ली गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मृत्यु से बचाने में समर्थ था’ का अर्थ ‘मृत्यु में से निकालने में समर्थ था’ भी हो सकता है—अर्थात पुनरुत्थान के द्वारा छुड़ाना।
    reason: alternative_reading
  - marker: b
    text: या, ‘उसके परमेश्वर-भय के कारण।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τῆς σαρκὸς αὐτοῦ
  choice: अपनी देह के दिनों में
  rationale: σάρξ के ठोस, देह-संबंधी बल को बनाए रखता है और यीशु के पार्थिव देहधारी जीवन की ओर संकेत करता है।
- source_word: δεήσεις τε καὶ ἱκετηρίας
  choice: प्रार्थनाएँ और विनतियाँ
  rationale: दोनों निकटार्थी शब्दों का भेद सहज आधुनिक हिन्दी में बनाए रखता है; ‘विनतियाँ’ earnest appeals का भाव व्यक्त करता है।
- source_word: πρὸς τὸν δυνάμενον σῴζειν αὐτὸν ἐκ θανάτου
  choice: उस परमेश्वर से, जो उसे मृत्यु से बचा सकता था
  rationale: संज्ञा के रूप में प्रयुक्त participle को स्वाभाविक हिन्दी में व्यक्त करता है। संदर्भ के कारण ‘परमेश्वर’ स्पष्ट किया गया है, जबकि ‘मृत्यु से बचा’ ἐκ θανάτου की उस अस्पष्टता को रहने देता है जिसमें मृत्यु से पहले बचाना अथवा मृत्यु में से निकालना दोनों संभव हैं।
- source_word: μετὰ κραυγῆς ἰσχυρᾶς καὶ δακρύων
  choice: ऊँची पुकार और आँसुओं के साथ
  rationale: एकवचन κραυγή और उसकी तीव्रता को स्वाभाविक तथा गंभीर हिन्दी में व्यक्त करता है।
- source_word: προσενέγκας
  choice: अर्पित कीं
  rationale: प्रार्थनाएँ परमेश्वर के सामने रखने का अर्थ देता है और इब्रानियों के याजकीय संदर्भ में क्रिया की संभावित अर्पण-संबंधी अनुगूँज भी बनाए रखता है।
- source_word: εἰσακουσθεὶς
  choice: उसकी सुन ली गई
  rationale: सिर्फ ध्वनि सुनने के बजाय अनुकूल रूप से सुने जाने का भाव व्यक्त करता है, पर उत्तर के किसी विशेष रूप को निर्धारित नहीं करता।
- source_word: ἀπὸ τῆς εὐλαβείας
  choice: उसकी श्रद्धा के कारण
  rationale: εὐλάβεια के आदर, भक्ति और परमेश्वर-भय के अर्थक्षेत्र को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है, बिना ‘आज्ञाकारिता’ का अतिरिक्त अर्थ मुख्य पाठ में जोड़ने के।
theological_decisions:
- issue: ἐκ θανάτου में उद्धार का स्वरूप
  choice: मृत्यु से बचा सकता था
  alternative: मृत्यु में से निकाल सकता था
  rationale: मूल वाक्यांश मृत्यु को टालने और पुनरुत्थान के द्वारा मृत्यु में से छुड़ाए जाने—दोनों अर्थों की संभावना रखता है; मुख्य पाठ इसे किसी एक तक सीमित नहीं करता।
- issue: ἀπὸ τῆς εὐλαβείας का अर्थ
  choice: उसकी श्रद्धा के कारण
  alternative: उसके परमेश्वर-भय के कारण
  rationale: ‘श्रद्धा’ यीशु की आदरपूर्ण, भक्तिपूर्ण मुद्रा को व्यक्त करती है। वैकल्पिक ‘परमेश्वर-भय’ शब्द के पारंपरिक और शाब्दिक अर्थक्षेत्र को सुरक्षित रखता है।
- issue: εἰσακουσθεὶς का आशय
  choice: उसकी सुन ली गई
  alternative: उसकी प्रार्थना का उत्तर दिया गया
  rationale: मुख्य पाठ अनुकूल रूप से सुने जाने की पुष्टि करता है, लेकिन उत्तर किस प्रकार मिला यह निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘देह’ से σάρξ की ठोस अभिव्यक्ति बची रहती है; ‘प्रार्थनाएँ और विनतियाँ’ सहज रहते हुए मूल के दो शब्दों का भेद रखता है। हिन्दी में स्वतंत्र और स्पष्ट वाक्य के लिए आरंभिक ग्रीक संबंधवाचक ὅς को ‘उसने’ के रूप में व्यक्त किया गया है।
