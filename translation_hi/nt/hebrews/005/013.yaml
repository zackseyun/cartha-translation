  text: πᾶς γὰρ ὁ μετέχων γάλακτος ἄπειρος λόγου δικαιοσύνης, νήπιος γάρ ἐστιν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/013.yaml
  text: For everyone who partakes of milk is unskilled in the word of righteousness[b][a], for he is an infant.
translation:
  language: hi
  text: क्योंकि हर कोई जो दूध ग्रहण करता है, धार्मिकता के वचन में निपुण नहीं है, क्योंकि वह शिशु है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πᾶς ... ὁ μετέχων
  choice: जो कोई ... पीता है
  rationale: यह प्रत्येक ऐसे व्यक्ति को अलग-अलग ध्यान में रखता है। दूध के संदर्भ में ‘पीता है’ स्वाभाविक हिन्दी है और सहभागिता के भाव को भोजन-रूपक के भीतर व्यक्त करता है।
- source_word: γάλακτος
  choice: दूध
  rationale: लेखक के शिक्षण-संबंधी रूपक को ज्यों का त्यों रखा गया है।
- source_word: ἄπειρος
  choice: अनाड़ी
  rationale: यह पूर्ण अज्ञान नहीं, बल्कि अनुभव या दक्षता की कमी बताता है और शिशु के रूपक के साथ सहज बैठता है।
- source_word: λόγου δικαιοσύνης
  choice: धार्मिकता के वचन
  rationale: यूनानी की संक्षिप्त और अर्थगत रूप से खुली संबंधवाचक रचना को बनाए रखता है; इसका अर्थ धार्मिकता का संदेश अथवा धार्मिकता के विषय में वचन भी हो सकता है।
- source_word: δικαιοσύνης
  choice: धार्मिकता
  rationale: यह δικαιοσύνη का स्वाभाविक धार्मिक-नैतिक हिन्दी प्रतिशब्द है; ‘न्याय’ की संभावना टिप्पणी में सुरक्षित रखी गई है।
- source_word: νήπιος
  choice: शिशु
  rationale: यह अपरिपक्वता के तीखे रूपक को बनाए रखता है और ‘बालक’ की अपेक्षा दूध पीने वाले बहुत छोटे बच्चे का भाव अधिक स्पष्ट करता है।
- source_word: γάρ ... γάρ
  choice: क्योंकि ... क्योंकि
  rationale: दोनों प्रयोग व्याख्यात्मक हैं; हिन्दी में कारण और तर्क-संबंध स्पष्ट तथा स्वाभाविक रहता है।
theological_decisions:
- issue: δικαιοσύνη का अर्थ
  choice: धार्मिकता
  alternative: न्याय
  rationale: मुख्य पाठ में धार्मिक और नैतिक सहीपन की व्यापक धारणा रखी गई है, जबकि शब्द के न्याय-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: λόγου δικαιοσύνης में संबंधवाचक कारक का अर्थ
  choice: धार्मिकता के वचन
  alternative: धार्मिकता का संदेश; धार्मिकता के विषय में वचन
  rationale: यूनानी पदबंध यह निश्चित नहीं करता कि धार्मिकता वचन की विशेषता, विषय या आशय है; इसलिए मुख्य पाठ में उसी संक्षिप्तता और अस्पष्टता को रखा गया है।
- issue: νήπιος की सामान्य, व्याकरणतः पुल्लिंग रचना
  choice: वह शिशु है
  alternative: ऐसा व्यक्ति शिशु है
  rationale: ‘जो कोई’ और ‘वह’ हिन्दी में सामान्य व्यक्ति के लिए प्रयुक्त हो सकते हैं और अनावश्यक रूप से केवल पुरुष का अर्थ आरोपित नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और तर्कपूर्ण गद्य। ‘दूध’ और ‘शिशु’ का मूल रूपक सुरक्षित है। ‘दूध ही पीता है’ पदबंध संदर्भ में अपरिपक्व आहार पर निर्भरता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि मूल पद के अर्थ को अत्यधिक विस्तृत नहीं करता।
