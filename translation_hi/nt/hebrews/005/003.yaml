reference: Hebrews 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ⸂δι’ αὐτὴν⸃ ὀφείλει, καθὼς περὶ τοῦ λαοῦ, οὕτως καὶ περὶ ⸀αὑτοῦ προσφέρειν ⸀περὶ ἁμαρτιῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/005/003.yaml
  text: And because of this he is obligated[a], just as for the people, so also for himself, to offer for sins.
translation:
  language: hi
  text: और इसी कारण[a] वह बाध्य है कि जैसे लोगों के लिए पापों के लिए भेंट चढ़ाए, वैसे ही अपने लिए भी चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इसके कारण”; यह संभवतः पिछले पद में कही गई महायाजक की दुर्बलता की ओर संकेत करता है।
    reason: सर्वनाम के निहित पूर्वपद और शाब्दिक रूप को स्पष्ट करना।
lexical_decisions:
- source_word: δι’ αὐτὴν
  choice: इसी कारण
  rationale: διά + कर्मकारक का कारणवाचक अर्थ व्यक्त करता है। स्त्रीलिंग सर्वनाम निकटवर्ती ‘दुर्बलता’ (5:2) की ओर संकेत करता है, पर मुख्य पाठ में उसके पूर्वपद को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: ὀφείλει
  choice: बाध्य है
  rationale: यह केवल उचित होने का नहीं, बल्कि याजकीय कर्तव्य और अनिवार्यता का भाव व्यक्त करता है।
- source_word: καθὼς ... οὕτως καὶ
  choice: जैसे ... वैसे ही ... भी
  rationale: यूनानी की सहसंबंधी तुलना और लोगों तथा महायाजक के बीच समानांतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: τοῦ λαοῦ
  choice: लोगों के लिए
  rationale: लैव्यव्यवस्था की पृष्ठभूमि में यह वाचा-समुदाय को सूचित करता है; ‘लोगों’ मूल पाठ की संक्षिप्तता बनाए रखता है।
- source_word: περὶ αὑτοῦ
  choice: अपने लिए
  rationale: प्रतिवाचक अर्थ को सहज और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: προσφέρειν
  choice: भेंट चढ़ाए
  rationale: बलिदानी संदर्भ में προσφέρειν याजकीय अर्पण को सूचित करता है। ‘भेंट चढ़ाना’ हिन्दी में स्वाभाविक है और किसी विशेष प्रकार के बलिदान को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: περὶ ἁμαρτιῶν
  choice: पापों के लिए
  rationale: बलिदानी संदर्भ में περί + संबंधकारक का पापों के संबंध में अथवा उनके निमित्त अर्पण करने का अर्थ संक्षेप में व्यक्त करता है; ‘पापबलि’ कहना अपेक्षाकृत अधिक विशिष्ट होता।
theological_decisions:
- issue: ‘इसी कारण’ का पूर्वपद
  choice: इसे पिछले पद में वर्णित महायाजक की दुर्बलता की ओर संकेत करने दिया गया है।
  alternative: इसे अधिक सामान्य रूप से उसकी परिस्थिति या पद के कारण के रूप में समझा जा सकता है।
  rationale: निकटतम स्त्रीलिंग पूर्वपद ἀσθένεια (‘दुर्बलता’) है। फिर भी मुख्य पाठ में ‘दुर्बलता’ जोड़कर निहित संबंध को पूर्णतः स्पष्ट नहीं किया गया; टिप्पणी में इसे बताया गया है।
- issue: προσφέρειν के निहित बलिदानी अर्थ को व्यक्त करना
  choice: ‘भेंट चढ़ाए’ रखा गया है।
  alternative: केवल ‘चढ़ाए’ अथवा अधिक विशिष्ट ‘बलिदान चढ़ाए’ कहा जा सकता था।
  rationale: संदर्भ स्पष्ट रूप से याजकीय और बलिदानी है। ‘भेंट’ क्रिया के अर्थ को स्वाभाविक बनाती है, जबकि ‘बलिदान’ जोड़ना मूल में अनुपस्थित कर्म को अधिक विशिष्ट कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज याजकीय भाषा रखी गई है। ‘बाध्य है’ दायित्व की शक्ति बनाए रखता है; ‘भेंट चढ़ाए’ बलिदानी संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
