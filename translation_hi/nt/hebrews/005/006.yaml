    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς καὶ
  choice: जैसा कि ... भी
  rationale: तुलनात्मक सूत्र तथा καί के ‘भी’ भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है और इस उद्धरण को पिछले कथन के समानांतर जोड़ता है।
- source_word: ἐν ἑτέρῳ
  choice: एक अन्य स्थान पर
  rationale: यूनानी में विशेषण अकेला है और ‘स्थान/अंश’ निहित है; हिन्दी में ‘स्थान’ जोड़ना स्वाभाविक तथा अर्थ-स्पष्ट है।
- source_word: λέγει
  choice: वह ... कहता है
  rationale: वर्तमानकालीन व्यक्तिगत कथन को बनाए रखता है; इब्रानियों में पवित्रशास्त्र के माध्यम से परमेश्वर की जीवित वाणी का भाव निहित रहता है, पर विषय को स्पष्ट रूप से ‘परमेश्वर’ नहीं बनाया गया।
- source_word: Σὺ ἱερεὺς εἰς τὸν αἰῶνα
  choice: तुम सदा के लिए ... याजक हो
  rationale: प्रत्यक्ष एकवचन सम्बोधन, याजकीय पद और स्थायी अवधि को स्पष्ट, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: κατὰ τὴν τάξιν
  choice: की रीति के अनुसार
  rationale: τάξις यहाँ व्यवस्था, क्रम अथवा प्रकार का बोध करा सकता है। ‘रीति के अनुसार’ हिन्दी में स्वाभाविक है और केवल संस्थागत ‘याजकीय वर्ग’ का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: Μελχισέδεκ
  choice: मलिकिसिदक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: उद्धरण-सूत्र में λέγει का वक्ता
  choice: ‘वह ... कहता है’ द्वारा व्यक्तिगत वक्ता को निहित रखा गया
  alternative: ‘लिखा है’ या ‘पवित्रशास्त्र कहता है’
  rationale: यूनानी क्रिया का वर्तमानकाल और एकवचन व्यक्तिगत रूप सुरक्षित रहता है, जबकि अनुपस्थित कर्ता के रूप में ‘परमेश्वर’ को पाठ में जोड़ा नहीं जाता।
- issue: τάξις का अर्थ
  choice: ‘रीति’—मलिकिसिदक से संबद्ध याजकत्व की व्यवस्था/प्रकार
  alternative: ‘क्रम’, ‘श्रेणी’ या ‘पदक्रम’
  rationale: शब्द में व्यवस्था, क्रम और प्रकार की अर्थ-सीमा है। ‘रीति’ तुलना और याजकीय संबंध को बनाए रखती है, पर बाद की औपचारिक संस्थागत धारणाओं को पाठ पर नहीं थोपती।
- issue: εἰς τὸν αἰῶνα की अवधि
  choice: ‘सदा के लिए’
  alternative: ‘युग तक’
  rationale: भजन के उद्धरण और इब्रानियों के प्रसंग में वाक्यांश स्थायी याजकत्व बताता है; ‘सदा के लिए’ आधुनिक हिन्दी में इसका स्वाभाविक समतुल्य है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण बाइबलीय गद्य। ‘याजक’ और ‘मलिकिसिदक’ जैसे प्रचलित धर्मग्रंथीय शब्द रखे गए हैं। उद्धरण में प्रत्यक्ष सम्बोधन और वर्तमानकालीन कथन सुरक्षित हैं।
