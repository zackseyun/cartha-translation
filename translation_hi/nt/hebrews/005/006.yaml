  text: जैसा कि वह एक अन्य स्थान पर भी कहता है, “तुम सदा के लिए मलिकिसिदक की रीति के अनुसार याजक हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
