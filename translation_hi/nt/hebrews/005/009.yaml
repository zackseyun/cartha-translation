lexical_decisions:
- source_word: τελειωθεὶς
  choice: सिद्ध बनाए जाकर
  rationale: यह क्रिया इच्छित लक्ष्य या भूमिका की पूर्णता तक पहुँचाए जाने का भाव रखती है। ‘सिद्ध बनाए जाकर’ यूनानी के कर्मवाच्य रूप और पारंपरिक अर्थ को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ नैतिक दोष से सुधार का आशय आवश्यक नहीं है।
- source_word: ἐγένετο
  choice: बन गया
  rationale: यह पूर्ण किए जाने के बाद प्राप्त भूमिका या परिणामी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πᾶσιν τοῖς ὑπακούουσιν αὐτῷ
  choice: उन सबके लिए जो उसकी आज्ञा मानते हैं
  rationale: यह लाभार्थी अर्थ तथा ὑπακούω में निहित आज्ञापालन को स्पष्ट रखता है और इसे केवल विश्वास या सुनने के अर्थ में नहीं बदलता।
- source_word: αἴτιος
  choice: स्रोत
  rationale: यह उस व्यक्ति को सूचित करता है जिसके कारण उद्धार होता है। आधुनिक हिन्दी में ‘स्रोत’ सहज है; ‘कारण’ और ‘कर्ता’ भी सम्भव हैं।
- source_word: σωτηρίας
  choice: उद्धार
  rationale: इब्रानियों के धर्मवैचारिक प्रसंग में ‘उद्धार’ स्थापित और स्वाभाविक हिन्दी पद है।
- source_word: αἰωνίου
  choice: अनन्त
  rationale: यह σωτηρίας को विशेषित करता है और स्थायी, अंतहीन उद्धार का स्वाभाविक हिन्दी रूप है।
- source_word: καὶ
  choice: और
  rationale: यह कथन को पिछले प्रसंग से बिना अतिरिक्त व्याख्या जोड़े जोड़ता है।
theological_decisions:
- issue: यीशु के विषय में τελειωθεὶς का अर्थ
  choice: सिद्ध बनाए जाकर
  alternative: पूर्णता तक पहुँचाए जाकर
  rationale: मुख्य पाठ यूनानी के पारंपरिक ‘सिद्ध’ अर्थ और कर्मवाच्य को बनाए रखता है, जबकि पादटिप्पणी बताती है कि आशय उसकी याजकीय और उद्धारकारी भूमिका की पूर्णता हो सकता है, न कि पहले के किसी नैतिक दोष का सुधार।
- issue: ‘जो उसकी आज्ञा मानते हैं’ में दायरा और शर्त
  choice: आज्ञापालन की भाषा स्पष्ट रखी गई
  alternative: जो उसकी सुनते हैं
  rationale: यूनानी पाठ आज्ञा मानने वालों की बात करता है। इसे ‘विश्वास करने वालों’ से बदलना या किसी सम्प्रदायगत व्यवस्था में विस्तृत करना पाठ की धर्मवैचारिक कसावट को कम करता।
- issue: αἴτιος की कारणात्मक भूमिका
  choice: स्रोत
  alternative: कारण या कर्ता
  rationale: ‘स्रोत’ मसीह की उद्धारकारी कारणात्मक भूमिका को स्पष्ट करता है, पर पादटिप्पणी वैध विकल्पों को सुरक्षित रखती है।
