  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सहज वाक्य-विन्यास। ‘सिद्ध’ की सम्भावित गलतफहमी को पादटिप्पणी से नियंत्रित किया गया है और आज्ञापालन की स्पष्ट भाषा सुरक्षित रखी गई है।
