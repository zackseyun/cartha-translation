base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/004.yaml
  text: If he were on earth[a], he would not even be a priest, since there are those who offer the gifts according to the law.
translation:
  language: hi
  text: यदि वह पृथ्वी पर होता, तो वह याजक भी न होता, क्योंकि व्यवस्था के अनुसार भेंटें[a] चढ़ाने वाले हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चढ़ावे।’ यूनानी में शाब्दिक रूप से ‘भेंटें’ है, जो इस प्रसंग में बलिदान-संबंधी एक सामान्य शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ μὲν οὖν
  choice: यदि
  rationale: यह पदबंध तार्किक संक्रमण के साथ शर्त प्रस्तुत करता है। हिंदी में ‘यदि’ शर्त को स्वाभाविक रूप से व्यक्त करता है; अलग संयोजक जोड़ना आवश्यक नहीं है।
- source_word: ἦν
  choice: वह ... होता
  rationale: εἰ के साथ अपूर्णकाल और उत्तरवाक्य में ἄν वाला विन्यास तथ्य-विपरीत शर्त बताता है; हिंदी का ‘होता ... न होता’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: आसपास के संदर्भ में इसका विरोध स्वर्गीय क्षेत्र से है; इसलिए ‘पृथ्वी पर’ उपयुक्त है।
- source_word: οὐδ’ ἂν ἦν
  choice: तो वह ... भी न होता
  rationale: ‘भी न’ οὐδέ के बलपूर्ण निषेध को सुरक्षित रखता है, और ‘होता’ ἄν सहित तथ्य-विपरीत परिणाम को व्यक्त करता है।
- source_word: ἱερεύς
  choice: याजक
  rationale: बलिदान और व्यवस्था के संदर्भ में ἱερεύς के लिए यह प्रचलित और सटीक हिंदी शब्द है।
- source_word: ὄντων τῶν προσφερόντων
  choice: क्योंकि ... चढ़ाने वाले मौजूद हैं
  rationale: संबंधवाचक स्वतंत्र पदबंध यहाँ कारण या परिस्थिति बताता है। ‘मौजूद हैं’ वर्तमान अस्तित्व को स्पष्ट रखता है और किसी अनकहे पद या पहचान को नहीं जोड़ता।
- source_word: κατὰ νόμον
  choice: व्यवस्था के अनुसार
  rationale: यह मूसा की व्यवस्था द्वारा निर्धारित धार्मिक विधान की ओर संकेत करता है; ‘व्यवस्था के अनुसार’ स्पष्ट और परिचित अभिव्यक्ति है।
- source_word: τὰ δῶρα
  choice: भेंटें
  rationale: δῶρα का मूल अर्थ ‘भेंटें’ है और इस प्रसंग में इसका बलिदानी प्रयोग है। यह προσφερόντων के क्रियात्मक अर्थ से अनावश्यक पुनरुक्ति भी टालता है।
theological_decisions:
- issue: शर्तवाचक वाक्य का अप्रकट कर्ता
  choice: ‘वह’ रखकर निकटवर्ती संदर्भ के यीशु/मसीह की ओर संकेत किया गया है।
  alternative: कर्ता को पूरी तरह अप्रकट छोड़ना।
  rationale: ग्रीक में कर्ता संदर्भ से समझा जाता है, पर हिंदी में स्पष्ट और सहज वाक्य के लिए ‘वह’ उचित है। इससे पाठ से बाहर कोई अतिरिक्त धर्मवैज्ञानिक दावा नहीं जुड़ता।
- issue: शर्त का तथ्य-विपरीत भाव
  choice: ‘यदि वह ... होता, तो वह ... न होता’
  alternative: साधारण संभाव्य शर्त के रूप में अनुवाद करना।
  rationale: εἰ + अपूर्णकाल और ἄν + अपूर्णकाल का विन्यास तथ्य-विपरीत शर्त व्यक्त करता है; हिंदी में यह रूप उसी तर्क को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध शैली रखी गई है। ‘याजक,’ ‘व्यवस्था’ और ‘भेंटें चढ़ाना’ धार्मिक संदर्भ के परिचित शब्द हैं। पादटिप्पणी का चिह्न ‘भेंटें’ के बाद रखा गया है, क्योंकि टिप्पणी τὰ δῶρα से संबंधित है, ‘पृथ्वी पर’ से नहीं।
