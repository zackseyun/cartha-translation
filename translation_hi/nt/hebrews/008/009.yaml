id: HEB.8.9
reference: Hebrews 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ κατὰ τὴν διαθήκην ἣν ἐποίησα τοῖς πατράσιν αὐτῶν ἐν ἡμέρᾳ ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν ἐξαγαγεῖν αὐτοὺς ἐκ γῆς Αἰγύπτου, ὅτι αὐτοὶ οὐκ ἐνέμειναν ἐν τῇ διαθήκῃ μου, κἀγὼ ἠμέλησα αὐτῶν, λέγει κύριος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/009.yaml
  text: not like the covenant that I made with their fathers on the day when I took hold of their hand to bring them out of the land of Egypt[a], because they did not continue in my covenant, and I disregarded them[b], says the Lord.
translation:
  language: hi
  text: उस वाचा के समान नहीं है जो मैंने उनके पितरों के साथ उस दिन बाँधी थी, जब मैंने उन्हें मिस्र देश से बाहर निकालने के लिए उनका हाथ पकड़ा था[a]; क्योंकि वे मेरी वाचा में बने नहीं रहे, और मैंने उनकी सुधि नहीं ली[b], प्रभु कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से, “उनका हाथ पकड़कर।” अधिक मुहावरेदार रूप में: “उन्हें हाथ पकड़कर।”'
    reason: lexical_alternative
  - marker: b
    text: 'यह उद्धरण इब्रानियों में पाए जाने वाले यूनानी पाठ का अनुसरण करता है: “मैंने उनकी सुधि नहीं ली।” यिर्मयाह 31:32 के इब्रानी पाठ का भाव भिन्न है, जिसका अनुवाद प्रायः “यद्यपि मैं उनका पति था” या “यद्यपि मैं उनका स्वामी था” किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: διαθήκην
  choice: वाचा
  rationale: इब्रानियों में यह शब्द परमेश्वर के वाचागत संबंध के लिए प्रयुक्त है; ‘वाचा’ सटीक और स्थापित हिन्दी पद है।
- source_word: ἐποίησα
  choice: बाँधी
  rationale: हिन्दी में ‘वाचा बाँधना’ स्वाभाविक धार्मिक मुहावरा है और यूनानी ‘वाचा करना’ का अर्थ ठीक व्यक्त करता है।
- source_word: πατράσιν
  choice: पूर्वजों
  rationale: संदर्भ इस्राएल की पिछली पीढ़ियों से है। ‘पूर्वजों’ से सामान्य पाठक के लिए आशय स्पष्ट रहता है, यद्यपि यूनानी शब्द शाब्दिक रूप से ‘पिताओं’ है।
- source_word: ἐν ἡμέρᾳ
  choice: उस दिन
  rationale: निर्गमन की ऐतिहासिक घड़ी को व्यक्त करने वाली ठोस कालसूचक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: ἐπιλαβομένου μου τῆς χειρὸς αὐτῶν
  choice: जब मैंने उनका हाथ पकड़ा
  rationale: यह रचना एकवचन ‘हाथ’ की मूल छवि को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: ἐξαγαγεῖν
  choice: उन्हें ... से बाहर निकाला
  rationale: ἐξάγω का अर्थ बाहर ले जाना या निकालना है; यहाँ कारणसूचक उद्देश्य को हिन्दी वाक्य में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: γῆς Αἰγύπτου
  choice: मिस्र देश
  rationale: यूनानी में γῆς स्पष्ट रूप से उपस्थित है, इसलिए केवल ‘मिस्र’ के बजाय ‘मिस्र देश’ रखा गया है।
- source_word: ἐνέμειναν
  choice: बने नहीं रहे
  rationale: यह वाचा के प्रति निरंतर निष्ठा में न टिके रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κἀγὼ
  choice: और मैंने
  rationale: मूल संयोजक का साधारण अर्थ ‘और मैं’ है; इसे अनावश्यक रूप से ‘इसलिए’ बनाकर कारण-परिणाम को अधिक स्पष्ट नहीं किया गया।
- source_word: ἠμέλησα αὐτῶν
  choice: मैंने उनकी सुधि नहीं ली
  rationale: यह ἀμελέω के उपेक्षा या परवाह न करने के भाव को सहज, गरिमापूर्ण हिन्दी में रखता है, बिना सक्रिय त्याग का अधिक प्रबल अर्थ जोड़ने के।
- source_word: λέγει κύριος
  choice: प्रभु कहता है
  rationale: उद्धरण-सूत्र के वर्तमान काल और κύριος के प्रचलित वाचागत संबोधन को सुरक्षित रखा गया है।
theological_decisions:
- issue: यिर्मयाह 31:32 की इब्रानी परंपरा से भिन्न ἠμέλησα αὐτῶν का अर्थ
  choice: मैंने उनकी सुधि नहीं ली
  alternative: यद्यपि मैं उनका पति/स्वामी था
  rationale: इब्रानियों का यूनानी पाठ स्पष्ट रूप से उपेक्षा या सुधि न लेने का अर्थ देता है। अनुवाद उसी स्रोत-पाठ का अनुसरण करता है, जबकि इब्रानी यिर्मयाह का उल्लेखनीय भिन्न अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘वाचा बाँधना’, ‘हाथ पकड़ना’ और ‘बने नहीं रहे’ जैसे परिचित पद मूल की छवि और वाचागत तनाव को बनाए रखते हैं।
