source:
  edition: SBLGNT
  text: (οἵτινες ὑποδείγματι καὶ σκιᾷ λατρεύουσιν τῶν ἐπουρανίων, καθὼς κεχρημάτισται Μωϋσῆς μέλλων ἐπιτελεῖν τὴν σκηνήν, Ὅρα γάρ, φησίν, ποιήσεις πάντα κατὰ τὸν τύπον τὸν δειχθέντα σοι ἐν τῷ ὄρει)·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/005.yaml
  text: who serve a copy and shadow of the heavenly things[a], just as Moses was divinely instructed when he was about to erect the tabernacle; for he says[b], “See that you make everything according to the pattern shown to you on the mountain.”
translation:
  language: hi
  text: जो स्वर्गीय वस्तुओं की प्रतिकृति और छाया में पवित्र सेवा करते हैं, जैसा कि मूसा को परमेश्वर की ओर से निर्देश मिला था[a], जब वह पवित्र तंबू को पूरा करने वाला था[b]; क्योंकि वह कहता है, “सावधान रहना कि तुम सब कुछ उस प्रतिरूप के अनुसार बनाओ जो तुम्हें पहाड़ पर दिखाया गया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की ओर से चेतावनी दी गई थी”; यूनानी क्रिया में ईश्वरीय चेतावनी या ताकीद का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पवित्र तंबू का निर्माण करने वाला था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οἵτινες
  choice: जो
  rationale: यह पहले उल्लिखित याजकों से जुड़े संबंधवाचक उपवाक्य को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὑποδείγματι
  choice: प्रतिकृति
  rationale: यहाँ शब्द पृथ्वी के पवित्र स्थान को स्वर्गीय वस्तुओं के अनुरूप प्रतिलिपि के रूप में प्रस्तुत करता है; ‘प्रतिकृति’ उस संबंध को व्यक्त करता है और उद्धरण में आने वाले τύπος के ‘प्रतिरूप’ से भेद भी रखता है।
- source_word: σκιᾷ
  choice: छाया
  rationale: मूल रूपक को सीधे बनाए रखता है और उसे केवल भविष्यसूचक संकेत के रूप में सीमित नहीं करता।
- source_word: λατρεύουσιν
  choice: सेवा करते हैं
  rationale: यह धार्मिक और याजकीय सेवा का बोध देता है; प्रसंग इसके पवित्र-सेवा संबंधी अर्थ को स्पष्ट करता है।
- source_word: τῶν ἐπουρανίων
  choice: स्वर्गीय वस्तुओं की
  rationale: दोनों संज्ञाओं—‘प्रतिकृति’ और ‘छाया’—से इसके संबंध को बनाए रखते हुए व्यापक संदर्भ को अनावश्यक रूप से ‘वास्तविकताओं’ तक सीमित नहीं करता।
- source_word: κεχρημάτισται
  choice: परमेश्वर की ओर से निर्देश मिला था
  rationale: क्रिया में निहित ईश्वरीय संचार और निर्देश दोनों स्पष्ट होते हैं; चेतावनी का संभावित भाव पादटिप्पणी में रखा गया है।
- source_word: μέλλων
  choice: करने वाला था
  rationale: आसन्न कार्य के भाव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐπιτελεῖν
  choice: पूरा करने
  rationale: क्रिया के ‘पूर्ण करना/संपन्न करना’ भाव को बनाए रखता है; निर्माण करने का प्रसंगगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: σκηνήν
  choice: पवित्र तंबू
  rationale: मूसा के आराधना-स्थान के विशिष्ट संदर्भ को साधारण पाठक के लिए स्पष्ट करता है।
- source_word: Ὅρα
  choice: ध्यान रखना
  rationale: आज्ञा में निहित सावधानी और ताकीद को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιήσεις πάντα
  choice: तुम सब कुछ ... बनाओ
  rationale: भविष्यकालीन यूनानी रूप यहाँ आज्ञार्थक है; हिन्दी आज्ञार्थ इसे स्वाभाविक और ठीक ढंग से संप्रेषित करता है।
- source_word: τύπον
  choice: प्रतिरूप
  rationale: पहाड़ पर दिखाए गए नमूने या पैटर्न का भाव देता है और ὑπόδειγμα के लिए प्रयुक्त ‘प्रतिकृति’ से उपयोगी भेद रखता है।
theological_decisions:
- issue: पृथ्वी के पवित्र स्थान और स्वर्गीय वस्तुओं का संबंध
  choice: ‘स्वर्गीय वस्तुओं की प्रतिकृति और छाया’
  alternative: ‘स्वर्गीय वास्तविकताओं का नमूना और छाया’
  rationale: यह पृथ्वी की उपासना-व्यवस्था और स्वर्गीय संदर्भ के बीच वास्तविक अनुरूपता के साथ उसकी गौणता भी बनाए रखता है, बिना इसे केवल प्रतीक या पूरी तरह समान वस्तु ठहराए।
- issue: κεχρημάτισται में ईश्वरीय निर्देश और चेतावनी का बल
  choice: ‘परमेश्वर की ओर से निर्देश मिला था’
  alternative: ‘परमेश्वर की ओर से चेतावनी दी गई थी’
  rationale: ईश्वरीय संचार को स्पष्ट करते हुए अर्थ को केवल चेतावनी तक सीमित नहीं करता; ताकीद का संभव अर्थ पादटिप्पणी में सुरक्षित है।
- issue: ἐπιτελεῖν का कार्यगत अर्थ
  choice: ‘पवित्र तंबू को पूरा करने वाला था’
  alternative: ‘पवित्र तंबू का निर्माण करने वाला था’
  rationale: मूल क्रिया के पूर्ण करने या संपन्न करने के भाव को प्राथमिकता देता है, जबकि संदर्भानुकूल निर्माण का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘पवित्र तंबू’ सामान्य पाठक के लिए Mosaic tabernacle को स्पष्ट करता है; ‘प्रतिकृति’, ‘छाया’ और ‘प्रतिरूप’ मूल तर्क और रूपकों के भेद को बनाए रखते हैं।
