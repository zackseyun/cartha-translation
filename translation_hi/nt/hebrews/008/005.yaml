review_pass:
  verdict: revise
  source_fidelity: 'The draft preserves the key correspondences: the earthly cultic service is related to a copy and shadow of heavenly things; Moses receives divine instruction while about to complete the tabernacle; and the quotation requires conformity to the mountain-shown pattern. The rendering of λατρεύουσιν as simply “सेवा करते हैं” with “की प्रतिकृति और छाया की” creates an unintended object relationship in Hindi. Rendering the dative phrase as the sphere of sacred service more faithfully reflects the Greek construction.'
  naturalness: The opening phrase “स्वर्गीय वस्तुओं की प्रतिकृति और छाया की सेवा करते हैं” is syntactically possible but unnatural and semantically misleading in modern Hindi, as though the priests serve the copy and shadow themselves. “प्रतिकृति और छाया में पवित्र सेवा करते हैं” is clear, idiomatic, and preserves the cultic register. The remaining wording is suitable for modern standard Hindi.
  terminology: “स्वर्गीय वस्तुओं,” “प्रतिकृति,” “छाया,” “पवित्र तंबू,” and “प्रतिरूप” appropriately preserve the verse’s terminology and its distinctions. “पवित्र सेवा” makes the religious sense of λατρεύω explicit without doctrinal expansion. The existing alternatives for κεχρημάτισται and ἐπιτελεῖν remain useful and correctly anchored.
  issues:
  - severity: medium
    issue: The opening construction makes “प्रतिकृति और छाया” appear to be the direct object of “सेवा करते हैं.”
    rationale: Greek λατρεύω with the dative here describes cultic service rendered in connection with an earthly copy and shadow, not service directed toward an abstract “copy and shadow.” The current Hindi wording is therefore both awkward and potentially misleading.
  revised_text: जो स्वर्गीय वस्तुओं की प्रतिकृति और छाया में पवित्र सेवा करते हैं, जैसा कि मूसा को परमेश्वर की ओर से निर्देश मिला था[a], जब वह पवित्र तंबू को पूरा करने वाला था[b]; क्योंकि वह कहता है, “सावधान रहना कि तुम सब कुछ उस प्रतिरूप के अनुसार बनाओ जो तुम्हें पहाड़ पर दिखाया गया था।”
