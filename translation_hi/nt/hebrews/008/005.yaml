- from: जो स्वर्गीय वस्तुओं की प्रतिकृति और छाया की सेवा करते हैं, ठीक वैसे ही जैसे मूसा को, जब वह पवित्र तंबू को पूरा करने वाला था[b], परमेश्वर की ओर से निर्देश मिला था[a]; क्योंकि वह कहता है, “ध्यान रखना कि तुम सब कुछ उस प्रतिरूप के अनुसार बनाओ जो तुम्हें पहाड़ पर दिखाया गया था।”
  to: जो स्वर्गीय वस्तुओं की प्रतिकृति और छाया में पवित्र सेवा करते हैं, जैसा कि मूसा को परमेश्वर की ओर से निर्देश मिला था[a], जब वह पवित्र तंबू को पूरा करने वाला था[b]; क्योंकि वह कहता है, “सावधान रहना कि तुम सब कुछ उस प्रतिरूप के अनुसार बनाओ जो तुम्हें पहाड़ पर दिखाया गया था।”
  rationale: The revision corrects the Hindi syntax and clarifies the cultic force of λατρεύουσιν by rendering the copy-and-shadow phrase as the setting or sphere of sacred service. It retains the draft’s source-sensitive choices for divine instruction, the prospective sense of μέλλων, completion of the tabernacle, and the pattern shown on the mountain. Footnote anchors and content remain structurally valid.
