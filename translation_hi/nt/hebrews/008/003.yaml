source:
  edition: SBLGNT
  text: πᾶς γὰρ ἀρχιερεὺς εἰς τὸ προσφέρειν δῶρά τε καὶ θυσίας καθίσταται· ὅθεν ἀναγκαῖον ἔχειν τι καὶ τοῦτον ὃ προσενέγκῃ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/003.yaml
  text: For every high priest is appointed to offer both gifts and sacrifices[a]; therefore it is necessary for this one also to have something that he may offer.
translation:
  language: hi
  text: क्योंकि हर महायाजक भेंटें और बलिदान दोनों चढ़ाने के लिए नियुक्त किया जाता है; इसलिए इस व्यक्ति के पास भी चढ़ाने के लिए कुछ होना आवश्यक है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस व्यक्ति के पास भी कुछ हो, जिसे वह चढ़ाए।” यूनानी वाक्य में इस व्यक्ति का संदर्भ स्पष्ट रूप से नामित नहीं है; प्रसंग में यह यीशु, महायाजक, की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς γὰρ ἀρχιερεὺς
  choice: क्योंकि हर महायाजक
  rationale: एकवचन संज्ञा के साथ πᾶς का वितरणात्मक अर्थ ‘हर’ है; γάρ पिछले कथन का कारण स्पष्ट करता है, इसलिए ‘क्योंकि’ स्वाभाविक है। ἀρχιερεύς के लिए ‘महायाजक’ मानक और संदर्भानुकूल पद है।
- source_word: εἰς τὸ προσφέρειν
  choice: चढ़ाने के लिए
  rationale: εἰς के साथ सप्रत्यय क्रियार्थक संज्ञा उद्देश्य व्यक्त करती है; ‘चढ़ाने के लिए’ हिंदी में स्वाभाविक रूप से वही प्रयोजन बताता है।
- source_word: δῶρά τε καὶ θυσίας
  choice: भेंटें और बलिदान दोनों
  rationale: τε καὶ से जुड़े दोनों अलग उपासना-संबंधी वर्गों को ‘दोनों’ द्वारा स्पष्ट रखा गया है; δῶρα के लिए ‘भेंटें’ और θυσίας के लिए ‘बलिदान’ चुना गया है।
- source_word: καθίσταται
  choice: नियुक्त किया जाता है
  rationale: याजकीय पद के संदर्भ में निष्क्रिय रूप किसी को पद पर ठहराए या नियुक्त किए जाने का अर्थ देता है।
- source_word: ὅθεν
  choice: इसलिए
  rationale: यह पिछले कथन से निकलने वाला निष्कर्ष प्रस्तुत करता है; ‘इसलिए’ आधुनिक हिंदी में तर्क-संबंध साफ रखता है।
- source_word: ἀναγκαῖον ἔχειν
  choice: यह आवश्यक है कि ... पास ... हो
  rationale: यह रचना आवश्यकता व्यक्त करती है; हिंदी में ‘यह आवश्यक है कि’ के साथ ‘पास होना’ सहज समतुल्य है।
- source_word: τι
  choice: कुछ
  rationale: अनिश्चित सर्वनाम किसी अनिर्दिष्ट चढ़ावे की ओर संकेत करता है।
- source_word: καὶ τοῦτον
  choice: इनके पास भी
  rationale: ‘इनके’ से τοῦτον का संकेतवाचक बल और सम्मानपूर्ण हिंदी शैली बनी रहती है; ‘भी’ καί को व्यक्त करता है। संदर्भ में संकेत यीशु की ओर है, पर नाम मूल वाक्य में स्पष्ट रूप से नहीं दिया गया।
- source_word: ὃ προσενέγκῃ
  choice: चढ़ाने के लिए
  rationale: सापेक्ष सर्वनाम और संभावनार्थक क्रिया का आशय ऐसी वस्तु से है जिसे वह चढ़ाए; हिंदी का क्रियार्थक रूप इस अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: τοῦτον (‘इस व्यक्ति’) का संदर्भ
  choice: मुख्य पाठ में संकेतवाचक रूप ‘इनके’ रखा गया है; संदर्भ से यह यीशु महायाजक की ओर संकेत करता है।
  alternative: मुख्य पाठ में सीधे ‘यीशु’ या ‘मसीह’ जोड़ना।
  rationale: आस-पास का प्रसंग संदर्भ को स्पष्ट करता है, लेकिन यूनानी पाठ नाम के स्थान पर संकेतवाचक सर्वनाम रखता है। अनावश्यक स्पष्टता जोड़ने के बजाय मूल की अंतर्निहितता सुरक्षित रखी गई है।
- issue: δῶρα और θυσίαι की याजकीय शब्दावली
  choice: ‘भेंटें और बलिदान’ को दो अलग वर्गों के रूप में रखा गया है।
  alternative: दोनों को मिलाकर ‘बलिदानी भेंटें’ कहना।
  rationale: इब्रानियों में इन दोनों उपासना-संबंधी पदों का भेद अर्थपूर्ण है; यहाँ मसीह के चढ़ावे की विस्तृत धर्मवैज्ञानिक व्याख्या जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘महायाजक,’ ‘भेंटें,’ और ‘बलिदान’ जैसी स्थापित बाइबलीय-याजकीय शब्दावली बनाए रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि संकेतवाचक अस्पष्टता मुख्य पाठ में ही सुरक्षित है।
