lexical_decisions:
- source_word: τῶν ἁγίων
  choice: पवित्र स्थानों
  rationale: संदर्भ इब्रानियों के स्वर्गीय पवित्रस्थान और याजकीय सेवा का है। बहुवचन रूप को बनाए रखते हुए यह अनुवाद पवित्र लोगों के बजाय आराधना-स्थान का अर्थ स्पष्ट करता है।
- source_word: λειτουργὸς
  choice: सेवक
  rationale: यह शब्द धार्मिक और सार्वजनिक सेवा करने वाले व्यक्ति को दर्शाता है। हिंदी में ‘सेवक’ सहज और गरिमापूर्ण है तथा यहाँ की याजकीय सेवा के संदर्भ में स्वाभाविक है।
- source_word: σκηνῆς
  choice: मिलापवाले तंबू
  rationale: इब्रानियों में यह मूसा के तंबू और उसके स्वर्गीय प्रतिरूप की ओर संकेत करता है। ‘मिलापवाला तंबू’ हिंदी बाइबलीय परंपरा में इस उपासना-स्थल का परिचित नाम है।
- source_word: ἀληθινῆς
  choice: सच्चे
  rationale: यह सांसारिक प्रतिरूप के विपरीत वास्तविक और परम तंबू का बोध देता है; ‘सच्चा’ संक्षिप्त रहते हुए उस तनाव को बनाए रखता है।
- source_word: ἔπηξεν
  choice: खड़ा किया
  rationale: क्रिया का अर्थ तंबू को गाड़ना या स्थापित करना है। ‘खड़ा किया’ आधुनिक हिंदी में स्वाभाविक है और तंबू की छवि बनाए रखता है।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: κύριος के लिए प्रचलित, गरिमापूर्ण और संदर्भानुकूल हिंदी रूप।
- source_word: οὐκ ἄνθρωπος
  choice: किसी मनुष्य ने नहीं
  rationale: यह प्रभु के कार्य की तुलना मानवीय कार्य से करता है। यह रूप यूनानी के संक्षिप्त विरोध को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: τῶν ἁγίων का संकेत और स्वर्गीय पवित्रस्थान से संबंध
  choice: पवित्र लोगों के बजाय आराधना के पवित्र स्थान
  alternative: पवित्र जन; पवित्रस्थान
  rationale: इब्रानियों 8:1-5 में मसीह की महायाजकीय सेवा और स्वर्गीय तंबू की चर्चा है। ‘पवित्र स्थानों’ से बहुवचन और उपासना-संबंधी अर्थ दोनों सुरक्षित रहते हैं, जबकि ‘पवित्र जन’ संदर्भ को लोगों की सेवा की ओर मोड़ देगा।
- issue: οὐκ ἄνθρωπος का सामान्य मानवीय अर्थ
  choice: किसी मनुष्य ने नहीं
  alternative: मनुष्य ने नहीं; किसी इंसान ने नहीं
  rationale: मुख्य विरोध प्रभु और मानवीय कर्ता के बीच है। ‘किसी मनुष्य ने नहीं’ इस सामान्य अर्थ को स्पष्ट करता है, बिना किसी विशिष्ट पुरुष तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और बाइबलीय-उपासना संबंधी शैली रखी गई है। ‘मिलापवाला तंबू’ परिचित धार्मिक पद है; पादटिप्पणी शाब्दिक ‘तंबू’ और वैकल्पिक ‘पवित्रस्थान’ को सामने रखती है।
