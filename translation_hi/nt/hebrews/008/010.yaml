source:
  edition: SBLGNT
  text: ὅτι αὕτη ἡ διαθήκη ἣν διαθήσομαι τῷ οἴκῳ Ἰσραὴλ μετὰ τὰς ἡμέρας ἐκείνας, λέγει κύριος, διδοὺς νόμους μου εἰς τὴν διάνοιαν αὐτῶν, καὶ ἐπὶ καρδίας αὐτῶν ἐπιγράψω αὐτούς, καὶ ἔσομαι αὐτοῖς εἰς θεόν καὶ αὐτοὶ ἔσονταί μοι εἰς λαόν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/010.yaml
  text: 'For this is the covenant that I will make with the house of Israel after those days[a], says the Lord: putting my laws into their minds, and I will write them on their hearts; and I will be their God, and they will be my people.'
translation:
  language: hi
  text: 'क्योंकि यह वह वाचा है जिसे मैं उन दिनों के बाद इस्राएल के घराने के साथ बाँधूँगा, प्रभु कहता है: अपने नियमों को उनके मनों में रखते हुए, मैं उन्हें उनके हृदयों पर लिखूँगा।[a] मैं उनका परमेश्वर होऊँगा, और वे मेरी प्रजा होंगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज रूप में: “मैं अपने नियम उनके मनों में रखूँगा और उन्हें उनके हृदयों पर लिखूँगा।” यूनानी में पहले कृदन्त (“रखते/देते हुए”) और फिर भविष्यकालीन क्रिया (“मैं लिखूँगा”) है।'
    reason: मूल यूनानी के मिश्रित क्रियारूप और उसके अधिक सहज हिन्दी विकल्प को स्पष्ट करना।
lexical_decisions:
- source_word: διαθήκη
  choice: वाचा
  rationale: यहाँ यिर्मयाह की नई वाचा की पृष्ठभूमि है; ‘वाचा’ पारस्परिक, प्रतिज्ञात्मक संबंध को स्पष्ट रूप से व्यक्त करती है।
- source_word: διαθήσομαι
  choice: वाचा बाँधूँगा
  rationale: वाचा के संदर्भ में यह क्रिया ‘वाचा करना/स्थापित करना’ बताती है; आधुनिक हिन्दी में ‘वाचा बाँधना’ स्वाभाविक और गरिमापूर्ण है।
- source_word: οἴκῳ Ἰσραήλ
  choice: इस्राएल के घराने
  rationale: ‘घराना’ भविष्यद्वाणी में प्रयुक्त सामूहिक वाचागत अभिव्यक्ति को सुरक्षित रखता है।
- source_word: μετὰ τὰς ἡμέρας ἐκείνας
  choice: उन दिनों के बाद
  rationale: यह सीधा कालवाचक अनुवाद है और यिर्मयाह के साथ अंतर्पाठीय संबंध बनाए रखता है।
- source_word: κύριος
  choice: प्रभु
  rationale: यूनानी पाठ के κύριος का मानक और प्रसंगानुकूल हिन्दी रूप।
- source_word: διδοὺς
  choice: रखते हुए
  rationale: कृदन्त के रूप को सुरक्षित रखते हुए यह मन में नियम दिए/रखे जाने का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νόμους
  choice: नियमों
  rationale: यूनानी में स्पष्ट बहुवचन है, इसलिए उसे हिन्दी में भी बनाए रखा गया है।
- source_word: διάνοιαν
  choice: मनों
  rationale: यह समझने और विचार करने की भीतरी क्षमता को सूचित करता है; बहुवचन सर्वनाम के संदर्भ में ‘उनके मनों में’ प्रत्येक व्यक्ति की अंत:चेतना को स्पष्ट करता है।
- source_word: ἐπὶ καρδίας αὐτῶν
  choice: उनके हृदयों पर
  rationale: ‘पर’ लिखने के रूपक को बनाए रखता है और भीतरी नैतिक-आत्मिक आयाम को व्यक्त करता है।
- source_word: ἐπιγράψω
  choice: मैं उन्हें ... लिखूँगा
  rationale: ‘लिखूँगा’ स्पष्ट, वर्तमान हिन्दी है और अंकित करने के रूपक को पर्याप्त रूप से सुरक्षित रखता है।
- source_word: ἔσομαι αὐτοῖς εἰς θεόν
  choice: मैं उनका परमेश्वर होऊँगा
  rationale: यह वाचा-सूत्र का स्वाभाविक और परिचित हिन्दी रूप है।
- source_word: αὐτοὶ ἔσονταί μοι εἰς λαόν
  choice: वे मेरी प्रजा होंगे
  rationale: ‘प्रजा’ सामूहिक पहचान और परमेश्वर के साथ वाचागत संबंध दोनों को व्यक्त करती है।
theological_decisions:
- issue: यिर्मयाह की वाचा-संबंधी भाषा के साथ अंतर्पाठीय निरंतरता
  choice: ‘इस्राएल के घराने’, ‘मेरे नियमों’, ‘हृदयों’, ‘मैं उनका परमेश्वर’ और ‘मेरी प्रजा’ जैसी वाचागत भाषा को सुरक्षित रखा गया।
  alternative: अधिक मुक्त समकालीन भावानुवाद, जिसमें भविष्यद्वाणी की औपचारिक प्रतिध्वनि कम हो जाती।
  rationale: इब्रानियों में इस उद्धरण की धर्मवैज्ञानिक शक्ति यिर्मयाह के वाचा-वचन से उसके स्पष्ट संबंध पर निर्भर है।
- issue: διδοὺς कृदन्त और ἐπιγράψω भविष्यकाल के मिश्रित निर्माण को बनाए रखना
  choice: ‘रखते हुए, मैं ... लिखूँगा’
  alternative: ‘मैं अपने नियम उनके मनों में रखूँगा और उन्हें उनके हृदयों पर लिखूँगा।’
  rationale: मुख्य पाठ यूनानी के कृदन्त और उसके बाद आए भविष्यकालीन क्रिया-रूप के तनाव को सुरक्षित रखता है; अधिक सहज विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। भविष्यद्वाणी की वाचागत भाषा को बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
