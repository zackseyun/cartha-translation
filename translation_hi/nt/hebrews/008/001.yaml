source:
  edition: SBLGNT
  text: Κεφάλαιον δὲ ἐπὶ τοῖς λεγομένοις, τοιοῦτον ἔχομεν ἀρχιερέα, ὃς ἐκάθισεν ἐν δεξιᾷ τοῦ θρόνου τῆς μεγαλωσύνης ἐν τοῖς οὐρανοῖς,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/001.yaml
  text: 'The main point in what is being said is this: we have such a high priest[a], who sat down at the right hand of the throne of the Majesty in the heavens[b],'
translation:
  language: hi
  text: 'कही जा रही बातों में मुख्य बात[a] यह है: हमारे पास ऐसा महायाजक है, जो स्वर्गों[b] में महामहिम के सिंहासन की दाहिनी ओर बैठ गया,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सार” अथवा “प्रधान बात”।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग में”; यूनानी में “स्वर्गों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Κεφάλαιον
  choice: मुख्य बात
  rationale: यहाँ यह शब्द चर्चा के प्रधान बिंदु या सार को दर्शाता है, न कि शाब्दिक रूप से किसी ‘अध्याय’ को। ‘मुख्य बात’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: δὲ
  choice: अलग शब्द से व्यक्त नहीं किया गया
  rationale: यहाँ δέ हल्के विषयांतर का संकेत देता है। हिन्दी वाक्य की संरचना स्वयं इस परिवर्तन को स्पष्ट करती है; ‘अब’ जोड़ने से अनावश्यक काल-सूचक अर्थ उभर सकता है।
- source_word: ἐπὶ τοῖς λεγομένοις
  choice: जो बातें कही जा रही हैं, उनमें
  rationale: यह अनुवाद वर्तमान कर्मवाच्य भाव को बनाए रखते हुए चल रही चर्चा की ओर स्वाभाविक हिन्दी में संकेत करता है।
- source_word: τοιοῦτον ἔχομεν ἀρχιερέα
  choice: हमारे पास ऐसा महायाजक है
  rationale: ‘हमारे पास’ ἔχομεν के अधिकार/प्राप्तता के भाव को और ‘ऐसा’ पहले वर्णित महायाजक के प्रकार की ओर संकेत को सुरक्षित रखता है।
- source_word: ἐκάθισεν
  choice: बैठ गया है
  rationale: यह बैठने की पूर्ण हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना उसके धर्मवैचारिक निहितार्थों को अनुवाद में विस्तार से जोड़े।
- source_word: ἐν δεξιᾷ τοῦ θρόνου
  choice: सिंहासन की दाहिनी ओर
  rationale: यह सम्मान और अधिकार के स्थान से जुड़ी बाइबलीय छवि तथा सिंहासन के साथ संबंध को बनाए रखता है।
- source_word: τῆς μεγαλωσύνης
  choice: महामहिम
  rationale: यह परमेश्वर के लिए प्रयुक्त श्रद्धापूर्ण परोक्ष संबोधन को बनाए रखता है और स्रोत से अधिक स्पष्टता नहीं जोड़ता।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: यूनानी बहुवचन को सुरक्षित रखने के लिए ‘स्वर्गों’ चुना गया है; एकवचन हिन्दी विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: τῆς μεγαλωσύνης में निहित संदर्भ को स्पष्ट रूप से ‘परमेश्वर’ कहना या न कहना
  choice: परोक्ष श्रद्धासूचक संबोधन ‘महामहिम’ रखा गया।
  alternative: परमेश्वर के सिंहासन
  rationale: मूल पाठ θεός नहीं कहता, बल्कि एक ऊँचा परोक्ष संबोधन देता है। इसे बनाए रखने से मूल की आलंकारिक और धर्मवैचारिक अभिव्यक्ति सुरक्षित रहती है।
- issue: ἐκάθισεν में मसीह के पूरे हुए याजकीय कार्य का अर्थ स्पष्ट रूप से जोड़ना
  choice: केवल ‘बैठ गया है’ अनूदित किया गया।
  alternative: अपना कार्य पूरा करके विराजमान हो गया है
  rationale: इब्रानियों के व्यापक संदर्भ में बैठना पूरे हुए याजकीय कार्य से जुड़ा है, पर इस पद में उस व्याख्या को अतिरिक्त शब्दों द्वारा जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘महायाजक,’ ‘महामहिम’ और ‘सिंहासन की दाहिनी ओर’ जैसे पदों द्वारा मूल का गरिमापूर्ण धार्मिक और राजकीय स्वर बनाए रखा गया है। वाक्य के अंत में अल्पविराम रखा गया है क्योंकि विचार अगले पद में जारी रहता है।
