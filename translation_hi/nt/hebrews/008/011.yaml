id: HEB.8.11
reference: Hebrews 8:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ οὐ μὴ διδάξωσιν ἕκαστος τὸν πολίτην αὐτοῦ καὶ ἕκαστος τὸν ἀδελφὸν αὐτοῦ, λέγων· Γνῶθι τὸν κύριον, ὅτι πάντες εἰδήσουσίν με ἀπὸ ⸀μικροῦ ἕως μεγάλου αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/011.yaml
  text: And they will certainly not teach[a], each one his fellow citizen and each one his brother, saying, ‘Know the Lord,’ because they will all know me, from the least of them to the greatest.
translation:
  language: hi
  text: और उनमें से हर एक व्यक्ति अपने सहनागरिक[a] को और अपने भाई को यह कहते हुए बिलकुल नहीं सिखाएगा, “प्रभु को जानो,” क्योंकि उनमें छोटे से लेकर बड़े तक सभी मुझे जानेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पड़ोसी।” इब्रानियों के यूनानी पाठ में “सहनागरिक” है, जबकि यिर्मयाह के मूल अंश का अनुवाद सामान्यतः “पड़ोसी” किया जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐ μὴ διδάξωσιν
  choice: शिक्षा कदापि न देगा
  rationale: οὐ μή के साथ aorist subjunctive प्रबल निषेध व्यक्त करता है। ‘कदापि न देगा’ इस बल को गरिमापूर्ण और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ἕκαστος
  choice: हर एक
  rationale: यह चुनाव वाचा-समुदाय के प्रत्येक सदस्य पर लागू होने वाले वितरणात्मक भाव को स्पष्ट रखता है।
- source_word: πολίτην
  choice: सहनागरिक
  rationale: इब्रानियों के उपलब्ध यूनानी पाठ में πολίτην का मूल अर्थ साथ का नागरिक है; इसलिए मुख्य पाठ में ‘सहनागरिक’ रखा गया है, न कि यिर्मयाह के प्रचलित अनुवाद से आया ‘पड़ोसी’।
- source_word: ἀδελφόν
  choice: भाई
  rationale: यूनानी शब्द पुल्लिंग एकवचन है और पारिवारिक वाचा-संबंधी भाषा को व्यक्त करता है; ‘भाई’ उसके रूप और अर्थ को सीधे सुरक्षित रखता है।
- source_word: Γνῶθι
  choice: जानो
  rationale: यह aorist imperative का सीधा, स्वाभाविक और उद्धरण के अनुकूल आज्ञार्थक अनुवाद है।
- source_word: κύριον
  choice: प्रभु
  rationale: ‘प्रभु’ κύριος का मानक हिन्दी धार्मिक प्रतिशब्द है और यिर्मयाह से लिए गए वाचा-संबंधी उद्धरण के अनुरूप है।
- source_word: πάντες εἰδήσουσίν με
  choice: सभी मुझे जानेंगे
  rationale: यह πάντες की समग्रता, भविष्यकाल और स्पष्ट कर्म ‘मुझे’—तीनों को बनाए रखता है।
- source_word: ἀπὸ μικροῦ ἕως μεγάλου αὐτῶν
  choice: उनमें छोटे से लेकर बड़े तक
  rationale: यह मुहावरा समुदाय के भीतर सबसे छोटे से सबसे बड़े तक सबको समेटता है और इसे केवल आयु या पद तक सीमित नहीं करता।
theological_decisions:
- issue: यिर्मयाह 31:34 के उद्धरण में वाचा-समुदाय के लिए πολίτην का अनुवाद
  choice: सहनागरिक
  alternative: पड़ोसी
  rationale: पुराने नियम की पृष्ठभूमि के कारण ‘पड़ोसी’ परिचित है, पर इब्रानियों का उपलब्ध यूनानी पाठ πολίτην पढ़ता है। मूल-भाषा की प्रधानता के कारण मुख्य पाठ में ‘सहनागरिक’ और परिचित विकल्प को पादटिप्पणी में रखा गया है।
- issue: ἀδελφόν की लिंग-सूचक पारिवारिक भाषा
  choice: भाई
  alternative: भाई या बहन
  rationale: स्रोत पाठ पुल्लिंग एकवचन और वितरणात्मक है। ‘भाई’ स्रोत के व्याकरणिक रूप तथा वाचा की पारिवारिक भाषा को सुरक्षित रखता है, जबकि प्रतिज्ञा का व्यापक समुदाय पर लागू होना संदर्भ से स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘कदापि’ प्रबल यूनानी निषेध को संक्षेप में व्यक्त करता है; ‘सहनागरिक’ कुछ औपचारिक होते हुए भी स्रोत की विशिष्ट नागरिकता-संबंधी शब्दावली को सुरक्षित रखता है।
