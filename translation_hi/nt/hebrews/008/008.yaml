  text: μεμφόμενος γὰρ ⸀αὐτοὺς λέγει· Ἰδοὺ ἡμέραι ἔρχονται, λέγει κύριος, καὶ συντελέσω ἐπὶ τὸν οἶκον Ἰσραὴλ καὶ ἐπὶ τὸν οἶκον Ἰούδα διαθήκην καινήν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/008.yaml
  text: For in finding fault with them he says, “Look, days are coming, says the Lord, when I will establish a new covenant with the house of Israel and with the house of Judah,”
translation:
  language: hi
  text: क्योंकि वह उनमें दोष पाकर कहता है, “देखो, वे दिन आ रहे हैं,” प्रभु कहता है, “जब मैं इस्राएल के घराने और यहूदा के घराने के साथ एक नई वाचा स्थापित करूँगा,”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεμφόμενος ... αὐτοὺς
  choice: उनमें दोष पाकर
  rationale: कृदंत और उसके कर्म को स्वाभाविक हिन्दी में रखते हुए यह अर्थ सुरक्षित किया गया है कि दोष लोगों में पाया गया; पाठ में ‘उसे’ वाला वैकल्पिक पाठ नहीं अपनाया गया।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का सरल, वर्तमान और प्रत्यक्ष हिन्दी रूप।
- source_word: συντελέσω ... διαθήκην καινήν
  choice: एक नई वाचा बाँधूँगा
  rationale: इस संदर्भ में क्रिया का आशय वाचा को संपन्न/स्थापित करना है; हिन्दी में ‘वाचा बाँधना’ स्वाभाविक बाइबलीय प्रयोग है और संज्ञा के संबंधपरक अर्थ को बनाए रखता है।
- source_word: οἶκον Ἰσραὴλ ... οἶκον Ἰούδα
  choice: इस्राएल के घराने ... यहूदा के घराने
  rationale: ‘घराना’ यहाँ सामूहिक वंशीय-राष्ट्रीय समुदाय का अर्थ स्पष्ट करता है और स्रोत की समानांतर संरचना बचाता है।
theological_decisions:
- issue: μεμφόμενος का लक्ष्य
  choice: उनमें दोष पाकर
  alternative: उस वाचा में दोष पाकर
  rationale: दिए गए SBLGNT पाठ में αὐτούς स्पष्ट रूप से ‘उन्हें’ को कर्म बनाता है; इसलिए दोष को पुरानी वाचा पर स्थानांतरित नहीं किया गया।
- issue: διαθήκη का अनुवाद
  choice: वाचा
  alternative: करार
  rationale: ‘वाचा’ गंभीर, व्यापक रूप से समझा जाने वाला धार्मिक-संबंधपरक शब्द है; यह केवल कानूनी अनुबंध का संकुचित भाव नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण पर सरल शैली। स्रोत की कारणसूचक शुरुआत, भविष्यवाणी की प्रत्यक्ष वाणी और इस्राएल/यहूदा की समानांतर रचना सुरक्षित रखी गई है। पद अगले वाक्यांश में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है।
