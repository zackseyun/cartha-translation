source:
  edition: SBLGNT
  text: ἐν τῷ λέγειν Καινὴν πεπαλαίωκεν τὴν πρώτην, τὸ δὲ παλαιούμενον καὶ γηράσκον ἐγγὺς ἀφανισμοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/013.yaml
  text: By saying[a], “new,” he has made the first obsolete[c][b]. And what is becoming obsolete and growing old is near to disappearing.
translation:
  language: hi
  text: “नई” कहकर[a] उसने पहली को अप्रचलित कर दिया है[b]। और जो पुरानी पड़ती और बूढ़ी होती जा रही है, वह लुप्त होने के निकट है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उसने ‘नई’ कहा” अथवा “जिस समय वह ‘नई’ कहता है।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में केवल “नई” कहा गया है; यह पिछले उद्धरण में आए “नई वाचा” पदबंध की ओर संकेत करता है (यिर्मयाह 31:31; इब्रानियों 8:8)।
    reason: cross_reference
  - marker: c
    text: या, “विलुप्त होने के निकट है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τῷ λέγειν
  choice: कहकर
  rationale: पूर्वसर्ग ἐν के साथ संज्ञार्थक क्रियारूप यहाँ परिस्थिति या साधन व्यक्त कर सकता है। ‘कहकर’ स्वाभाविक हिन्दी में साधनात्मक भाव रखता है और पिछले उद्धरण से सीधा संबंध दिखाता है।
- source_word: Καινὴν
  choice: “नई”
  rationale: यूनानी में केवल विशेषण है, जो पिछले उद्धरण के ‘नई वाचा’ पदबंध की ओर संकेत करता है। केवल ‘नई’ रखने से मूल की संक्षिप्तता बनी रहती है।
- source_word: πεπαλαίωκεν
  choice: पुरानी ठहरा दिया है
  rationale: पूर्णकाल किसी संपन्न क्रिया के वर्तमान परिणाम को दर्शाता है। ‘पुरानी ठहरा दिया है’ पहली वाचा की बदली हुई स्थिति को स्पष्ट करता है, पर उससे आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- source_word: τὴν πρώτην
  choice: पहली को
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और संदर्भ से पहली वाचा की ओर संकेत करता है। मूल की तरह मुख्य पाठ में ‘वाचा’ को दोहराया नहीं गया।
- source_word: τὸ ... παλαιούμενον
  choice: जो पुरानी पड़ती जा रही है
  rationale: वर्तमान कृदन्त जारी प्रक्रिया व्यक्त करता है। ‘पुरानी पड़ती जा रही है’ इस क्रमिक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γηράσκον
  choice: बूढ़ी हो रही है
  rationale: यह साथ लगे कृदन्त में उम्र बढ़ने का रूपक है। ‘बूढ़ी हो रही है’ उस सजीव रूपक को बनाए रखता है।
- source_word: ἐγγὺς
  choice: के निकट है
  rationale: संबंधकारक के साथ यह निकटता व्यक्त करता है; ‘के निकट है’ औपचारिक किंतु सामान्य आधुनिक हिन्दी है।
- source_word: ἀφανισμοῦ
  choice: लुप्त होने
  rationale: शब्द का अर्थ ओझल हो जाना, मिट जाना या समाप्त हो जाना हो सकता है। ‘लुप्त होने’ संक्षिप्त, गरिमापूर्ण और संदर्भानुकूल है।
theological_decisions:
- issue: ‘नई’ कहने वाले निहित कर्ता की पहचान
  choice: ‘उसने’ रखा गया, पर मुख्य पाठ में परमेश्वर या पवित्रशास्त्र के रूप में स्पष्ट नहीं किया गया।
  alternative: ‘परमेश्वर ने’ या ‘पवित्रशास्त्र ने’
  rationale: यूनानी में कर्ता निहित है और यिर्मयाह के उद्धरण में बोलने वाले की ओर लौटता है। ‘उसने’ पाठ की संक्षिप्तता और निहित संदर्भ को सुरक्षित रखता है।
- issue: पहली वाचा की स्थिति का आशय
  choice: ‘पहली को पुरानी ठहरा दिया है’
  alternative: ‘पहली को अप्रचलित कर दिया है’
  rationale: संदर्भ पहली और नई वाचा के बीच अंतर बताता है। चुना हुआ रूप मूल के ‘पुराना करना’ भाव और अगले वाक्य के वृद्ध होने के रूपक से शब्दगत संबंध बनाए रखता है, बिना व्यवस्था के बारे में अतिरिक्त doctrinal निष्कर्ष जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘पुरानी ठहरा दिया’ और ‘पुरानी पड़ती जा रही’ के द्वारा यूनानी παλαιόω की पुनरावृत्ति और पूर्णकाल बनाम जारी प्रक्रिया का अंतर यथासंभव रखा गया है। ‘बूढ़ी हो रही’ मूल के वृद्धावस्था-रूपक को सुरक्षित रखता है।
