source:
  edition: SBLGNT
  text: ὅτι ἵλεως ἔσομαι ταῖς ἀδικίαις αὐτῶν, καὶ τῶν ἁμαρτιῶν ⸀αὐτῶν οὐ μὴ μνησθῶ ἔτι.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/012.yaml
  text: For I will be merciful toward their unrighteousness[b][a], and I will remember their sins no more.
translation:
  language: hi
  text: क्योंकि मैं उनके अधर्मों के विषय में दयालु रहूँगा[a], और उनके पापों को फिर कभी याद नहीं करूँगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनके अन्यायों के विषय में कृपालु रहूँगा।” यूनानी शब्द ἀδικίαις अधर्मों, गलत कामों या अन्याय के कृत्यों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं उनके पापों को निश्चय ही अब और याद नहीं करूँगा।” यह वाचा के संदर्भ में पूर्ण क्षमा का मुहावरा है; इसका अर्थ यह नहीं कि परमेश्वर उन्हें जानना भूल जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले वाचा-संबंधी कथन का कारण या आधार प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक बल को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: ἵλεως ἔσομαι
  choice: मैं ... दया करूँगा
  rationale: यूनानी मुहावरे का भाव कृपालु अथवा क्षमाशील होने का है। हिंदी में ‘दया करूँगा’ सहज है और ईश्वरीय क्षमा का आशय व्यक्त करता है।
- source_word: ταῖς ἀδικίαις αὐτῶν
  choice: उनके अधर्म के कामों पर
  rationale: ἀδικίαις बहुवचन में अन्याय, अधर्म या गलत कामों को सूचित कर सकता है। ‘अधर्म के कामों’ से नैतिक अर्थ और ठोस कृत्यों का बहुवचन दोनों स्पष्ट रहते हैं।
- source_word: τῶν ἁμαρτιῶν αὐτῶν
  choice: उनके पापों को
  rationale: ἁμαρτιῶν का सामान्य और संदर्भानुकूल हिंदी समतुल्य ‘पापों’ है।
- source_word: οὐ μὴ μνησθῶ ἔτι
  choice: फिर कभी याद नहीं करूँगा
  rationale: οὐ μή प्रबल निषेध है और ἔτι आगे जारी न रहने का भाव देता है। ‘फिर कभी ... नहीं’ इस बल को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर द्वारा पापों को याद न करने का आशय
  choice: बाइबलीय वाचा-मुहावरे को मुख्य पाठ में ज्यों का त्यों रखना
  alternative: इसे सीधे ‘उनके पाप उनके विरुद्ध नहीं गिनूँगा’ कहना, अथवा शाब्दिक विस्मरण मानना
  rationale: मूल कथन निर्णायक क्षमा और पापों को आगे न धरने का वाचा-संबंधी भाव रखता है। अनुवाद ‘याद नहीं करूँगा’ की मूल छवि और उसके धर्मवैचारिक तनाव को बनाए रखता है; पादटिप्पणी आवश्यक स्पष्टीकरण देती है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘अधर्म के कामों’ में मूल बहुवचन की ठोस नैतिक क्रियाओं का भाव रखा गया है, जबकि पादटिप्पणी ‘अन्यायों’ की वैकल्पिक अर्थ-छाया बताती है।
