  text: Εἰ γὰρ ἡ πρώτη ἐκείνη ἦν ἄμεμπτος, οὐκ ἂν δευτέρας ἐζητεῖτο τόπος·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/007.yaml
  text: For if that first covenant had been faultless[b][a], no place would have been sought for a second.
translation:
  language: hi
  text: क्योंकि यदि वह पहली वाचा निर्दोष होती, तो दूसरी के लिए स्थान न खोजा जाता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘स्थान’ का अर्थ यहाँ ‘अवसर’ या ‘गुंजाइश’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἰ γὰρ
  choice: क्योंकि यदि
  rationale: γάρ पिछले तर्क का कारण या स्पष्टीकरण देता है और Εἰ शर्त प्रस्तुत करता है; इसलिए ‘क्योंकि यदि’ दोनों संबंधों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἡ πρώτη ἐκείνη
  choice: वह पहली वाचा
  rationale: यूनानी में शाब्दिक रूप से ‘वह पहली’ है, पर स्त्रीलिंग पदबंध संदर्भ में वाचा की ओर संकेत करता है। हिन्दी में ‘वाचा’ जोड़ने से आशय स्पष्ट और वाक्य स्वाभाविक होता है।
- source_word: ἦν ἄμεμπτος
  choice: निर्दोष होती
  rationale: ἄμεμπτος का अर्थ ऐसा होना है जिसमें दोष निकालने का आधार न हो। ‘निर्दोष’ संक्षिप्त है और शर्त की अवास्तविकता को ‘होती’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὐκ ἂν
  choice: न ... जाता
  rationale: οὐκ ἂν शर्त के परिणाम में अवास्तविक या प्रतिकल्पित भाव देता है; हिन्दी का ‘न ... जाता’ इस भाव को सहजता से व्यक्त करता है।
- source_word: δευτέρας
  choice: दूसरी के लिए
  rationale: यहाँ ‘दूसरी’ का आशय संदर्भ से दूसरी वाचा है। पहले खंड में ‘वाचा’ स्पष्ट कर देने के बाद दूसरे खंड में संक्षिप्तता बनाए रखी गई है।
- source_word: ἐζητεῖτο τόπος
  choice: स्थान न खोजा जाता
  rationale: यह वाक्यांश शाब्दिक रूप से ‘स्थान खोजा जाता’ है और प्रसंग में अवसर या गुंजाइश खोजने का भाव रखता है। मुख्य पाठ स्रोत की ठोस अभिव्यक्ति बनाए रखता है, जबकि पादटिप्पणी मुहावरेदार विकल्प बताती है।
theological_decisions:
- issue: यूनानी में दोबारा न आए ‘वाचा’ शब्द को स्पष्ट करना
  choice: ‘वह पहली वाचा’ में ‘वाचा’ को संदर्भानुसार जोड़ा गया
  alternative: ‘वह पहली’ या ‘पहली’
  rationale: निकटवर्ती संदर्भ पहली और नई/दूसरी वाचा की तुलना करता है। ‘वाचा’ जोड़ना निहित संदर्भ को स्पष्ट करता है, कोई नया धर्मवैज्ञानिक दावा नहीं जोड़ता।
- issue: पहली वाचा में दोष होने के निहितार्थ
  choice: ἄμεμπτος को केवल ‘निर्दोष’ कहा गया, दोष की प्रकृति नहीं समझाई गई
  alternative: दोष को व्यवस्था, उसके प्रबंध या लोगों से स्पष्ट रूप से जोड़ना
  rationale: यह पद प्रतिकल्पित तर्क देता है, पर दोष का सटीक स्थान स्वयं इस वाक्य में नहीं बताता। अनुवाद अगले पद की व्याख्या को पहले से आरोपित किए बिना तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘वाचा’ बाइबलीय संदर्भ में स्थापित शब्द है; वाक्यरचना स्रोत के प्रतिकल्पित तर्क को स्पष्ट रखती है।
