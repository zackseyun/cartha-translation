id: HEB.8.6
reference: Hebrews 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀νυνὶ δὲ διαφορωτέρας τέτυχεν λειτουργίας, ὅσῳ καὶ κρείττονός ἐστιν διαθήκης μεσίτης, ἥτις ἐπὶ κρείττοσιν ἐπαγγελίαις νενομοθέτηται.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/008/006.yaml
  text: But as it is[a], he has obtained a more excellent ministry, by as much as he is also the mediator of a better covenant[c][b], which has been enacted on better promises.
translation:
  language: hi
  text: परन्तु अब उसे अधिक उत्कृष्ट सेवा प्राप्त हुई है, क्योंकि वह एक बेहतर वाचा[a] का मध्यस्थ भी है; वह वाचा बेहतर प्रतिज्ञाओं के आधार पर स्थापित की गई है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘वाचा’ है और कुछ संदर्भों में ‘वसीयतनामा’ भी हो सकता है; यहाँ आगे उद्धृत यिर्मयाह की नई वाचा की प्रतिज्ञा के कारण ‘वाचा’ उपयुक्त है।
    reason: alternative_reading
  - marker: b
    text: या, “बेहतर प्रतिज्ञाओं के आधार पर प्रभावी की गई है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: νυνὶ δὲ
  choice: पर अब
  rationale: वर्तमान स्थिति और पहले वर्णित पृथ्वी के याजकों के बीच कालगत तथा विरोधात्मक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διαφορωτέρας
  choice: श्रेष्ठ
  rationale: तुलनात्मक श्रेष्ठता को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है; तुलना की मात्रा आगे के ‘जितनी… उतना ही’ विन्यास में स्पष्ट है।
- source_word: τέτυχεν
  choice: प्राप्त की है
  rationale: पूर्णकाल के उस भाव को सुरक्षित रखता है जिसमें पूर्व में प्राप्त सेवा का वर्तमान अधिकार और परिणाम बना हुआ है।
- source_word: λειτουργίας
  choice: सेवा
  rationale: पवित्र अथवा याजकीय कार्य का अर्थ संदर्भ से स्पष्ट है; ‘सेवा’ सामान्य पाठक के लिए सहज है और स्रोत से अधिक विशिष्टता नहीं जोड़ता।
- source_word: ὅσῳ καὶ
  choice: जितनी… उतना ही… भी
  rationale: मसीह की सेवा और उसके द्वारा मध्यस्थता की जाने वाली वाचा की श्रेष्ठता के बीच अनुपातात्मक तुलना को हिन्दी में स्पष्ट रूप से बनाए रखता है।
- source_word: κρείττονός ... διαθήκης
  choice: एक बेहतर वाचा
  rationale: इब्रानियों में बार-बार आने वाली श्रेष्ठता की तुलना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वाचा’ आगामी यिर्मयाह उद्धरण के संदर्भ के अनुकूल है।
- source_word: μεσίτης
  choice: मध्यस्थ
  rationale: दो पक्षों के बीच संबंध स्थापित कराने वाले व्यक्ति के विधिक और वाचागत आशय के लिए सटीक तथा प्रचलित शब्द है।
- source_word: ἥτις
  choice: ऐसी वाचा, जो
  rationale: पूर्वोक्त वाचा को फिर स्पष्ट करता है और संबंधवाचक उपवाक्य को हिन्दी में असंदिग्ध बनाता है।
- source_word: ἐπὶ κρείττοσιν ἐπαγγελίαις
  choice: बेहतर प्रतिज्ञाओं के आधार पर
  rationale: ἐπί के आधार अथवा नींव के भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: νενομοθέτηται
  choice: विधिपूर्वक स्थापित की गई है
  rationale: पूर्ण कर्मवाच्य तथा विधिक रूप से प्रभावी किए जाने के भाव को बनाए रखता है, जबकि केवल ‘विधान बनाया गया’ जैसी अस्वाभाविक हिन्दी से बचता है।
theological_decisions:
- issue: इब्रानियों 8:6 में διαθήκη का अनुवाद
  choice: वाचा
  alternative: वसीयतनामा
  rationale: अगली आयतों में यिर्मयाह की नई वाचा की प्रतिज्ञा उद्धृत होती है और प्रसंग याजकीय मध्यस्थता का है; इसलिए यहाँ ‘वाचा’ तत्काल पुराने नियम की पृष्ठभूमि को सबसे अच्छी तरह व्यक्त करता है।
- issue: νενομοθέτηται का विधिक बल
  choice: विधिपूर्वक स्थापित की गई है
  alternative: स्थापित की गई है
  rationale: क्रिया में केवल सामान्य स्थापना नहीं, बल्कि विधि या प्रावधान द्वारा प्रभावी किए जाने का संकेत है; ‘विधिपूर्वक’ इस सूक्ष्मता को बिना किसी विशेष साम्प्रदायिक अर्थ के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जितनी… उतना ही’ मूल यूनानी के तुलनात्मक-सहसंबंधी तर्क को सुरक्षित रखता है। ‘बेहतर’ की पुनरावृत्ति लेखक की जानबूझकर की गई तुलनात्मक भाषा को दर्शाती है।
