id: HEB.4.3
reference: Hebrews 4:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰσερχόμεθα γὰρ ⸀εἰς κατάπαυσιν οἱ πιστεύσαντες, καθὼς εἴρηκεν· Ὡς ὤμοσα ἐν τῇ ὀργῇ μου, Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου, καίτοι τῶν ἔργων ἀπὸ καταβολῆς κόσμου γενηθέντων,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/003.yaml
  text: For we who have believed enter the rest[a], just as he has said, “As I swore in my wrath[b], ‘If they shall enter my rest,’” although his works were finished from the foundation of the world.
translation:
  language: hi
  text: 'क्योंकि हम, जिन्होंने विश्वास किया है, उस विश्राम में प्रवेश करते हैं, जैसा कि उसने कहा है, “जैसा मैंने अपने क्रोध में शपथ खाई थी: ‘यदि वे मेरे विश्राम में प्रवेश करेंगे!’”[a] यद्यपि उसके काम संसार की नींव रखे जाने से ही पूरे हो चुके थे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से, “यदि वे मेरे विश्राम में प्रवेश करेंगे!” यह एक शपथ-सूत्र है, जिसका अर्थ है, “वे निश्चय ही मेरे विश्राम में प्रवेश नहीं करेंगे” या “वे मेरे विश्राम में कभी प्रवेश नहीं करेंगे।”
    reason: alternative_reading
  - marker: b
    text: या, “यद्यपि उसके काम संसार की नींव रखे जाने से ही पूरे किए जा चुके थे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχόμεθα
  choice: प्रवेश करते हैं
  rationale: वर्तमान काल को वर्तमान/सामान्य बल के साथ रखा गया है; यह विश्वासियों के अभी परमेश्वर के विश्राम में प्रवेश करने की बात कहता है और भावी पूर्णता को नकारता नहीं।
- source_word: κατάπαυσιν
  choice: उस विश्राम
  rationale: संदर्भ में पहले से चर्चा किए जा रहे परमेश्वर के विशिष्ट विश्राम को स्वाभाविक हिन्दी में सूचित करता है।
- source_word: οἱ πιστεύσαντες
  choice: हम जिन्होंने विश्वास किया है
  rationale: 'एओरिस्ट कृदंत और प्रथम पुरुष बहुवचन दोनों सुरक्षित रहते हैं: लेखक स्वयं को उन लोगों में शामिल करता है जिन्होंने विश्वास किया है।'
- source_word: καθὼς εἴρηκεν
  choice: जैसा उसने कहा है
  rationale: पूर्णकालीन क्रिया के स्थायी प्रभाव को हिन्दी के ‘कहा है’ से व्यक्त किया गया है।
- source_word: Ὡς ὤμοσα ἐν τῇ ὀργῇ μου
  choice: जैसा मैंने अपने क्रोध में शपथ खाई
  rationale: ‘क्रोध’ ὀργή के गंभीर न्यायिक भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: Εἰ εἰσελεύσονται εἰς τὴν κατάπαυσίν μου
  choice: यदि वे मेरे विश्राम में प्रवेश करेंगे!
  rationale: यूनानी में सुरक्षित शर्तसूचक शपथ-वाक्य को मुख्य पाठ में यथासंभव औपचारिक रूप से रखा गया है; विस्मयादिबोधक चिह्न उसके अधूरे किंतु शपथात्मक स्वर को दर्शाता है, जबकि अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: καίτοι
  choice: यद्यपि
  rationale: 'यह रियायती संबंध को स्पष्ट करता है: विश्राम से संबंधित शपथ के बावजूद सृष्टि के काम पहले ही पूरे हो चुके थे।'
- source_word: τῶν ἔργων ... γενηθέντων
  choice: उसके काम ... पूरे हो चुके थे
  rationale: संबंधकारक निरपेक्ष रचना कामों के संपन्न हो जाने को बताती है; ‘उसके’ संदर्भ से परमेश्वर के कामों को स्पष्ट करता है।
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: संसार की नींव डाले जाने के समय से ही
  rationale: सृष्टि/संसार की स्थापना के यूनानी मुहावरे को अर्थपूर्ण और परिचित हिन्दी रूप में प्रस्तुत करता है।
theological_decisions:
- issue: भजन 95 के उद्धरण में शपथ-वाक्य का बल
  choice: मुख्य पाठ में ‘यदि वे मेरे विश्राम में प्रवेश करेंगे!’ रखकर शाब्दिक शर्तसूचक रूप सुरक्षित किया गया और पादटिप्पणी में उसका निश्चित निषेधात्मक अर्थ बताया गया।
  alternative: ‘वे मेरे विश्राम में कभी प्रवेश नहीं करेंगे।’
  rationale: यूनानी पाठ सेमिटिक शपथ-सूत्र की सतही शर्तसूचक रचना को सुरक्षित रखता है। यह चयन वास्तविक भाषिक तनाव को मुख्य पाठ में बनाए रखता है, पर पादटिप्पणी पाठक को उसके अभिप्रेत निषेधात्मक अर्थ से अवगत कराती है।
- issue: विश्वासियों के विश्राम में प्रवेश का कालगत पक्ष
  choice: ‘प्रवेश करते हैं’ वर्तमान काल में।
  alternative: ‘प्रवेश करेंगे’ अथवा ‘प्रवेश कर रहे हैं।’
  rationale: वर्तमान काल विश्वास के द्वारा अभी के प्रवेश को व्यक्त करता है, बिना भावी परिपूर्णता को केवल वर्तमान में समेटे या केवल भविष्य तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। ‘विश्राम’, ‘शपथ’ और ‘संसार की नींव’ जैसे बाइबलीय पद बनाए गए हैं, पर वाक्य-विन्यास को सामान्य पाठक के लिए स्वाभाविक रखा गया है।
