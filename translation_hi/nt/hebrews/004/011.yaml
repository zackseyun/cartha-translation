base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/011.yaml
  text: Therefore[a], let us make every effort to enter that rest, so that no one may fall by the same pattern of disobedience.
translation:
  language: hi
  text: इसलिए हम उस विश्राम में प्रवेश करने का हर सम्भव प्रयत्न करें, ताकि कोई भी अवज्ञा[a] के उसी ढंग में पड़कर गिर न पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अविश्वास।” जंगल की पीढ़ी ने परमेश्वर पर भरोसा करने से इनकार किया था, इसलिए प्रसंग में यह अर्थ भी निहित हो सकता है; पर यूनानी शब्द का अधिक सीधा अर्थ “अवज्ञा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: σπουδάσωμεν
  choice: हम ... हर सम्भव प्रयत्न करें
  rationale: यह आग्रहसूचक प्रथम-पुरुष बहुवचन रूप है। ‘हर सम्भव प्रयत्न करें’ तत्परता, परिश्रम और गंभीर प्रयास—तीनों का स्वाभाविक आधुनिक हिन्दी में बोध कराता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को स्पष्ट रूप से जोड़ता है।
- source_word: εἰσελθεῖν
  choice: प्रवेश करने
  rationale: मूल क्रिया का सीधा और स्वाभाविक हिन्दी रूप, जो प्रयत्न के लक्ष्य को व्यक्त करता है।
- source_word: ἐκείνην τὴν κατάπαυσιν
  choice: उस विश्राम में
  rationale: ‘उस’ पहले से वर्णित परमेश्वर के विश्राम की ओर संकेत करता है; ‘विश्राम’ उसके स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἵνα μὴ
  choice: ताकि ... न
  rationale: नकारात्मक उद्देश्य अथवा परिणाम और चेतावनी—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ αὐτῷ ... ὑποδείγματι
  choice: उसी उदाहरण का अनुसरण करके
  rationale: ὑπόδειγμα यहाँ जंगल की पीढ़ी द्वारा स्थापित चेतावनीपूर्ण मिसाल या ढंग को दर्शाता है। ‘अनुसरण करके’ ἐν के प्रसंगगत माध्यम/ढंग के भाव को पठनीय हिन्दी में व्यक्त करता है।
- source_word: πέσῃ
  choice: गिर न पड़े
  rationale: मूल पाठ की गंभीर चेतावनी और ‘गिरने’ के रूपक को सुरक्षित रखता है।
- source_word: τῆς ἀπειθείας
  choice: आज्ञा न मानने
  rationale: ἀπείθεια का अधिक सीधा अर्थ अवज्ञा या आज्ञा न मानना है। साधारण पाठक के लिए ‘आज्ञा न मानना’ ‘अवज्ञा’ से अधिक सहज है, जबकि ‘अविश्वास’ को प्रसंगगत विकल्प के रूप में टिप्पणी में रखा गया है।
theological_decisions:
- issue: ἀπείθεια और जंगल की पीढ़ी के अविश्वास के बीच संबंध
  choice: मुख्य पाठ में ‘आज्ञा न मानने’ और टिप्पणी में ‘अविश्वास’
  alternative: मुख्य पाठ में ‘अविश्वास’
  rationale: इब्रानियों में विश्वास न करना और आज्ञा न मानना घनिष्ठ रूप से जुड़े हैं, फिर भी ἀπείθεια का अधिक प्रत्यक्ष शाब्दिक अर्थ आज्ञा न मानना है। यह चयन दोनों धारणाओं को एक में मिला देने के बजाय पाठ का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हर सम्भव प्रयत्न करें’ आग्रह की शक्ति को और ‘गिर न पड़े’ चेतावनी के रूपक को सुरक्षित रखता है।
