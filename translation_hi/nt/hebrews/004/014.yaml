source:
  edition: SBLGNT
  text: Ἔχοντες οὖν ἀρχιερέα μέγαν διεληλυθότα τοὺς οὐρανούς, Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ, κρατῶμεν τῆς ὁμολογίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/014.yaml
  text: Therefore[a], since we have a great high priest who has passed through the heavens—Jesus the Son of God—let us hold fast to our confession.
translation:
  language: hi
  text: अतः, चूँकि हमारे पास एक महान महायाजक है, जो स्वर्गों में से होकर गुजर चुका है[a]—यीशु, परमेश्वर का पुत्र—आओ, हम अपने अंगीकार को दृढ़ता से थामे रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो स्वर्गों में से होकर गया है।” यूनानी मूल में “स्वर्गों” बहुवचन में है।
    reason: क्रिया के एक स्वाभाविक वैकल्पिक अनुवाद को और मूल के बहुवचन रूप को स्पष्ट करता है।
lexical_decisions:
- source_word: Ἔχοντες οὖν
  choice: इसलिए, जब हमारा ... है
  rationale: कृदंत Ἔχοντες उपदेश का आधार बताता है और οὖν पिछले तर्क से निष्कर्ष जोड़ता है। यह हिंदी रचना दोनों संबंधों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀρχιερέα μέγαν
  choice: एक महान महायाजक
  rationale: ‘महायाजक’ प्रचलित और सटीक धार्मिक पद है; ‘महान’ यीशु के महायाजकत्व की विशिष्ट महिमा पर बल देता है।
- source_word: διεληλυθότα τοὺς οὐρανούς
  choice: जो स्वर्गों को पार कर गया है
  rationale: पूर्णकालिक कृदंत पूरे हो चुके कार्य और उसके वर्तमान महत्त्व को व्यक्त करता है। ‘स्वर्गों’ मूल के बहुवचन को सुरक्षित रखता है।
- source_word: Ἰησοῦν τὸν υἱὸν τοῦ θεοῦ
  choice: अर्थात् परमेश्वर का पुत्र यीशु
  rationale: समानाधिकरण में आया नाम महायाजक की पहचान स्पष्ट करता है; ‘परमेश्वर का पुत्र’ मसीही उपाधि को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: κρατῶμεν
  choice: आइए, हम ... दृढ़ता से थामे रहें
  rationale: उपदेशात्मक संभावनार्थक का सामूहिक आह्वान और वर्तमान पक्ष का निरंतर बने रहने वाला भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: τῆς ὁμολογίας
  choice: अपने अंगीकार को
  rationale: ὁμολογία समुदाय द्वारा स्वीकार और घोषित विश्वास को सूचित करता है। ‘अपने’ यूनानी संबंधवाचक पद के सामुदायिक संदर्भ को हिंदी में स्पष्ट और सहज बनाता है।
theological_decisions:
- issue: υἱὸς τοῦ θεοῦ की मसीही उपाधि
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का बेटा
  rationale: ‘पुत्र’ औपचारिक उपाधि का धार्मिक भार और गरिमा बनाए रखता है, जबकि किसी अतिरिक्त सिद्धांतगत व्याख्या को पाठ में नहीं जोड़ता।
- issue: τοὺς οὐρανούς की ब्रह्मांड-संबंधी बहुवचन छवि
  choice: स्वर्गों
  alternative: स्वर्ग
  rationale: मूल पाठ के बहुवचन को बनाए रखने से यीशु के स्वर्गीय क्षेत्रों को पार करने की छवि सुरक्षित रहती है और उसे एक व्यवस्थित ब्रह्मांड-विज्ञान में नहीं बदला जाता।
- issue: ὁμολογία में निहित अंगीकार की विषयवस्तु
  choice: अपने अंगीकार
  alternative: अपने विश्वास के अंगीकार
  rationale: मूल में ‘विश्वास’ के लिए अलग शब्द नहीं है; इसलिए ‘अंगीकार’ पाठ की संक्षिप्तता और संभावित व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘आइए, हम’ सामुदायिक उपदेश को स्पष्ट करता है; डैश के भीतर का वाक्यांश महायाजक की पहचान पर मूल पाठ जैसा बल देता है।
