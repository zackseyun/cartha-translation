  text: So then[a], a Sabbath rest remains for the people of God.
translation:
  language: hi
  text: इसलिए परमेश्वर की प्रजा के लिए सब्त का विश्राम[a] अब भी बाकी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब्त का पालन।” यूनानी शब्द σαββατισμός दुर्लभ है और स्पष्ट रूप से सब्त की भाषा की प्रतिध्वनि करता है; यहाँ सम्भवतः उसका अर्थ परमेश्वर की प्रजा के लिए बाकी सब्त-जैसा विश्राम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρα
  choice: इसलिए
  rationale: यह निष्कर्षसूचक अव्यय पिछले तर्क से निकलने वाला परिणाम बताता है; ‘इसलिए’ आधुनिक हिन्दी में उसका तार्किक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπολείπεται
  choice: अब भी बाकी है
  rationale: वर्तमान रूप किसी ऐसी वस्तु को दर्शाता है जो बनी हुई या उपलब्ध है; ‘अब भी बाकी है’ निरंतरता और शेष रहने, दोनों भावों को स्पष्ट करता है।
- source_word: σαββατισμός
  choice: सब्त का विश्राम
  rationale: यह दुर्लभ संज्ञा स्पष्ट रूप से सब्त की भाषा को प्रतिध्वनित करती है और प्रसंग में विश्राम पर बल देती है। यह चयन साप्ताहिक पालन और भावी/परम विश्राम के बीच के तनाव को बिना संकुचित किए सुरक्षित रखता है।
- source_word: τῷ λαῷ
  choice: प्रजा के लिए
  rationale: सम्प्रदान कारक यहाँ लाभ अथवा उपलब्धता का भाव देता है; ‘के लिए’ सहज हिन्दी है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर की
  rationale: सम्बन्ध अथवा अधिकार बताने वाले सम्बन्धकारक का स्वाभाविक हिन्दी रूप, जो इस प्रजा की पहचान परमेश्वर से जोड़ता है।
theological_decisions:
- issue: इब्रानियों 4:9 में σαββατισμός का अर्थ
  choice: ‘सब्त का विश्राम’—परमेश्वर की प्रजा के लिए बना हुआ सब्त-जैसा विश्राम
  alternative: ‘सब्त का पालन’—विशेषतः सब्त मनाने की क्रिया
  rationale: शब्द स्वयं सब्त की स्पष्ट प्रतिध्वनि रखता है, जबकि निकटवर्ती प्रसंग परमेश्वर के विश्राम, सातवें दिन और प्रतिज्ञात विश्राम को जोड़ता है। मुख्य पाठ और पादटिप्पणी दोनों सम्भावनाओं को रखते हैं, पर अर्थ को केवल साप्ताहिक अनुष्ठान या केवल असम्बद्ध आत्मिक रूपक तक सीमित नहीं करते।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सब्त’ बाइबलीय शब्द-संबंध को बनाए रखता है; ‘अब भी बाकी है’ मूल के वर्तमान और निरंतर भाव को स्वाभाविक रूप से व्यक्त करता है।
