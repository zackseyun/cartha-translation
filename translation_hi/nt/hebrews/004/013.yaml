source:
  edition: SBLGNT
  text: καὶ οὐκ ἔστιν κτίσις ἀφανὴς ἐνώπιον αὐτοῦ, πάντα δὲ γυμνὰ καὶ τετραχηλισμένα τοῖς ὀφθαλμοῖς αὐτοῦ, πρὸς ὃν ἡμῖν ὁ λόγος.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/013.yaml
  text: And no creature is hidden from his sight[a], but all things are naked and laid bare to his eyes[b], to whom we must give account.
translation:
  language: hi
  text: और कोई भी सृजी हुई वस्तु उसकी दृष्टि से छिपी नहीं है, बल्कि सब कुछ उसकी आँखों के सामने नग्न और पूरी तरह उजागर है[b]; जिसे हमें लेखा देना है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का अधिक शाब्दिक अर्थ हो सकता है, “जिससे हमारा वास्ता है”; इसे “जिसकी ओर हमारा वचन या मामला है” भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “पूरी तरह उजागर” के लिए प्रयुक्त दुर्लभ यूनानी क्रिया गर्दन के खुल जाने या पीछे झुका दिए जाने का बिंब दे सकती है; मुख्य भाव परमेश्वर के सामने पूर्णतः उजागर होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κτίσις
  choice: सृजा हुआ प्राणी
  rationale: एकवचन संज्ञा यहाँ सामान्य रूप से किसी भी सृजे हुए जीव या वस्तु के लिए है। ‘सृजा हुआ प्राणी’ सृष्टिकर्ता-सृष्टि संबंध को स्पष्ट रखते हुए हिंदी में स्वाभाविक है।
- source_word: ἀφανὴς
  choice: छिपा
  rationale: संदर्भ में अर्थ अदृश्य होने का नहीं, बल्कि परमेश्वर की जाँचती दृष्टि से छिपे होने का है।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसकी दृष्टि से
  rationale: शाब्दिक अर्थ ‘उसके सामने’ है; अगले वाक्यांश में आँखों का उल्लेख होने के कारण ‘उसकी दृष्टि से’ देखने और प्रकट होने की कड़ी को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक और सर्वसमावेशी अर्थ सहज आधुनिक हिंदी में व्यक्त होता है।
- source_word: γυμνὰ
  choice: नंगा
  rationale: यह पूर्ण अनावरण का सजीव रूपक बनाए रखता है; ‘सब कुछ’ के साथ एकवचन विशेषण हिंदी में स्वाभाविक है।
- source_word: τετραχηλισμένα
  choice: पूरी तरह खुला
  rationale: दुर्लभ पूर्णकालिक कृदंत पूर्णतः उजागर अवस्था बताता है और संभवतः गर्दन खुली या पीछे झुकी होने का बिंब रखता है। मुख्य पाठ में विवादित बिंब को बाध्य किए बिना परिणाम स्पष्ट किया गया है।
- source_word: τοῖς ὀφθαλμοῖς αὐτοῦ
  choice: उसकी आँखों के सामने
  rationale: ईश्वरीय दृष्टि के सामने पूर्ण अनावरण का भाव स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: πρὸς ὃν ἡμῖν ὁ λόγος
  choice: उसी को हमें लेखा देना है
  rationale: संक्षिप्त यूनानी पदबंध संदर्भ में परमेश्वर के सामने जवाबदेही का संकेत देता है। ‘लेखा देना’ चेतावनी की शक्ति को स्पष्ट रखता है, जबकि संभावित अधिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: πρὸς ὃν ἡμῖν ὁ λόγος का अर्थ
  choice: उसी को हमें लेखा देना है
  alternative: जिससे हमारा वास्ता है; जिसकी ओर हमारा वचन/मामला है
  rationale: निकट संदर्भ परमेश्वर के भेदने वाले ज्ञान और न्यायिक जाँच पर बल देता है, इसलिए जवाबदेही प्रमुख संभावित अर्थ है। फिर भी यूनानी पदबंध संक्षिप्त और अर्थ-संभावना वाला है; अन्य पाठ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली। ‘नंगा’ मूल रूपक की तीव्रता बनाए रखता है, और ‘पूरी तरह खुला’ दुर्लभ यूनानी शब्द के परिणामसूचक भाव को स्पष्ट करता है। पादटिप्पणी [b] संबंधित शब्द के तुरंत बाद और [a] अर्थगत रूप से अंतिम पदबंध के बाद रखी गई है।
