reference: Hebrews 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἴρηκεν γάρ που περὶ τῆς ἑβδόμης οὕτως· Καὶ κατέπαυσεν ὁ θεὸς ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ ἀπὸ πάντων τῶν ἔργων αὐτοῦ,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/004.yaml
  text: 'For he has spoken somewhere about the seventh day in this way: “And God rested on the seventh day from all his works,”[a][b]'
translation:
  language: hi
  text: 'क्योंकि सातवें दिन के विषय में उसने कहीं इस प्रकार कहा है: “और परमेश्वर ने सातवें दिन अपने सब कामों से विश्राम किया।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी स्थान पर।” यूनानी में शाब्दिक भाव “कहीं” है। यह पवित्रशास्त्र के उद्धरण का अनिर्दिष्ट परिचय है, उसके अधिकार के विषय में अनिश्चितता नहीं।
    reason: lexical_alternative
  - marker: b
    text: या, “काम करना बंद किया।” यहाँ प्रयुक्त क्रिया काम से रुकने पर बल दे सकती है; मुख्य पाठ में “विश्राम किया” उत्पत्ति 2:2 और इब्रानियों 3–4 में परमेश्वर के विश्राम से संबंध बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἴρηκεν
  choice: कहा है
  rationale: पूर्णकालिक क्रिया भूतकाल में कहे गए वचन की वर्तमान प्रासंगिकता दिखाती है; ‘कहा है’ हिन्दी में इस भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन के समर्थन में कारण या व्याख्या प्रस्तुत करता है।
- source_word: που
  choice: कहीं
  rationale: यह पवित्रशास्त्र के किसी अनिर्दिष्ट स्थान का परिचय देता है; इससे कथन के अधिकार के विषय में अनिश्चितता सूचित नहीं होती।
- source_word: περὶ τῆς ἑβδόμης
  choice: सातवें दिन के विषय में
  rationale: स्त्रीलिंग क्रमवाचक विशेषण में प्रसंगानुसार निहित ‘दिन’ को स्पष्ट किया गया है।
- source_word: οὕτως
  choice: इस प्रकार
  rationale: यह आने वाले उद्धरण के शब्दों का परिचय देता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: Καὶ
  choice: और
  rationale: उत्पत्ति के उद्धरण का आरंभिक संयोजक होने के कारण इसे सुरक्षित रखा गया है।
- source_word: κατέπαυσεν
  choice: विश्राम किया
  rationale: यह काम बंद करने का भाव रखता है और साथ ही उत्पत्ति 2:2 तथा इब्रानियों 3–4 में ‘विश्राम’ की मुख्य वैचारिक कड़ी को बनाए रखता है।
- source_word: ὁ θεὸς
  choice: परमेश्वर
  rationale: ईश्वर के लिए प्रचलित, गरिमापूर्ण और सामान्य हिन्दी पद।
- source_word: ἐν τῇ ἡμέρᾳ τῇ ἑβδόμῃ
  choice: सातवें दिन
  rationale: दिन के समय-संदर्भ को आधुनिक हिन्दी में इसी रूप में स्वाभाविक ढंग से व्यक्त किया जाता है।
- source_word: ἀπὸ πάντων τῶν ἔργων αὐτοῦ
  choice: अपने सब कामों से
  rationale: ἀπό से कामों से निवृत्त होने का भाव और πάντων की समग्रता सुरक्षित रहती है; आत्मवाचक ‘अपने’ हिन्दी में स्वाभाविक संबंध व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के सब्त-संबंधी काम से रुकने और इब्रानियों में ‘विश्राम’ की धर्मवैचारिक कड़ी
  choice: विश्राम किया
  alternative: काम करना बंद किया / रुक गया
  rationale: ‘विश्राम किया’ उत्पत्ति 2:2 के उद्धरण तथा इब्रानियों 3–4 के तर्क में बार-बार आने वाले विश्राम के विषय को सुरक्षित रखता है। इसका आशय थकान मानना आवश्यक नहीं; क्रिया काम से निवृत्त होने को भी व्यक्त करती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘कहा है’ मूल के पूर्णकाल का वर्तमान-संबंध बनाए रखता है। ‘विश्राम’ को प्रमुख शब्द के रूप में रखा गया है ताकि निकटवर्ती तर्क की शब्दगत एकता बनी रहे; संभावित ‘काम बंद किया’ अर्थ पादटिप्पणी में दिया गया है।
