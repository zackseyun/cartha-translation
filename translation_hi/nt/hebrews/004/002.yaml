source:
  edition: SBLGNT
  text: καὶ γάρ ἐσμεν εὐηγγελισμένοι καθάπερ κἀκεῖνοι, ἀλλ’ οὐκ ὠφέλησεν ὁ λόγος τῆς ἀκοῆς ἐκείνους, μὴ ⸀συγκεκερασμένους τῇ πίστει τοῖς ἀκούσασιν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/002.yaml
  text: For indeed[a], we also have had good news proclaimed to us, just as they did; but the message they heard did not benefit them[b], because it was not united by faith with those who heard.
translation:
  language: hi
  text: क्योंकि हमें भी शुभ समाचार सुनाया गया है, ठीक वैसे ही जैसे उन्हें सुनाया गया था; पर जो संदेश उन्होंने सुना, उससे उन्हें कोई लाभ नहीं हुआ, क्योंकि वे विश्वास[b] के द्वारा उन लोगों के साथ जुड़े नहीं थे जिन्होंने सुना था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'एक पाठांतर के अनुसार इसका अनुवाद हो सकता है: “क्योंकि सुना हुआ संदेश सुननेवालों के विश्वास के साथ नहीं मिला था।”'
    reason: textual_variant
  - marker: b
    text: यूनानी शब्द का अर्थ “भरोसा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐηγγελισμένοι
  choice: हमें भी शुभ समाचार सुनाया गया है
  rationale: 'ἐσμεν के साथ यह पूर्ण निष्क्रिय भाव देता है: घोषणा हो चुकी है और उसका वर्तमान महत्त्व बना हुआ है। ‘शुभ समाचार सुनाया गया’ क्रियात्मक अर्थ को स्वाभाविक हिन्दी में रखता है और यहाँ निर्गमन-पीढ़ी से की गई तुलना में बाद की तकनीकी शब्दावली को अनावश्यक रूप से नहीं थोपता।'
- source_word: καθάπερ κἀκεῖνοι
  choice: ठीक वैसे ही जैसे उन्हें सुनाया गया था
  rationale: यह वर्तमान पाठकों और जंगल की पीढ़ी के बीच इस बात की समानता स्पष्ट करता है कि दोनों ने परमेश्वर का संदेश पाया था।
- source_word: ὁ λόγος τῆς ἀκοῆς
  choice: जो संदेश उन्होंने सुना
  rationale: शाब्दिक ‘सुनने का वचन’ आधुनिक हिन्दी में अस्वाभाविक है। यह चयन λόγος को संदेश की विषयवस्तु और ἀκοή को सुनी हुई बात के रूप में व्यक्त करता है।
- source_word: ὠφέλησεν
  choice: कोई लाभ नहीं हुआ
  rationale: यह संदेश के उनके लिए फलदायक या हितकारी न होने का भाव सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: συγκεκερασμένους
  choice: एक न हुए
  rationale: यह कृदन्त मिलाए जाने या संयुक्त होने का बिंब रखता है। उपलब्ध SBLGNT पाठ में इसका कर्मकारक बहुवचन रूप ἐκείνους से मेल खाता है, इसलिए मुख्य पाठ लोगों के एक न होने को व्यक्त करता है।
- source_word: πίστει
  choice: विश्वास
  rationale: संदर्भ में केवल सुनने के विपरीत विश्वासपूर्ण प्रत्युत्तर अभिप्रेत है। करण कारक का भाव ‘विश्वास के द्वारा’ से व्यक्त किया गया है; ‘भरोसा’ भी सम्भव है।
- source_word: τοῖς ἀκούσασιν
  choice: उन लोगों के साथ ... जिन्होंने सुना था
  rationale: यह ἀκούω के मूल श्रवण-अर्थ को सुरक्षित रखता है और ‘ध्यान से माना’ जैसी व्याख्या को मुख्य पाठ में नहीं जोड़ता।
theological_decisions:
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा
  rationale: यहाँ विरोध संदेश सुनने और उस पर विश्वासपूर्ण प्रत्युत्तर देने के बीच है। ‘विश्वास’ अर्थ को सुरक्षित रखता है, जबकि ‘भरोसा’ को पादटिप्पणी में सम्भव विकल्प के रूप में दिया गया है।
- issue: अंतिम उपवाक्य का पाठ और व्याकरण
  choice: वे विश्वास के द्वारा उन लोगों के साथ एक न हुए जिन्होंने सुना था
  alternative: सुना हुआ संदेश सुननेवालों में विश्वास के साथ नहीं मिला था
  rationale: SBLGNT में कर्मकारक बहुवचन συγκεκερασμένους सबसे स्वाभाविक रूप से ἐκείνους को विशेषित करता है। एक प्रसिद्ध पाठांतर एकवचन रूप द्वारा संदेश को कर्ता मानने वाली पारम्परिक व्याख्या का समर्थन करता है; उसे पारदर्शिता के लिए पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शुभ समाचार’ सामान्य पाठक के लिए स्पष्ट है; ‘सुसमाचार’ जैसा बाद में अधिक तकनीकी बना पद यहाँ जंगल की पीढ़ी से तुलना के कारण नहीं चुना गया। कठिन अंतिम वाक्यांश की वास्तविक पाठगत और व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
