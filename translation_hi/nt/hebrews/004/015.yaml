language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐ γὰρ ἔχομεν ἀρχιερέα μὴ δυνάμενον συμπαθῆσαι ταῖς ἀσθενείαις ἡμῶν, ⸀πεπειρασμένον δὲ κατὰ πάντα καθ’ ὁμοιότητα χωρὶς ἁμαρτίας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/015.yaml
  text: For we do not have a high priest unable to sympathize with our weaknesses, but one who has been tested in every way according to likeness, yet without sin.
translation:
  language: hi
  text: क्योंकि हमारा महायाजक ऐसा नहीं है जो हमारी दुर्बलताओं के प्रति सहानुभूति न रख सके, बल्कि वह ऐसा है जो हर प्रकार से हमारी ही तरह परखा गया है[a], फिर भी निष्पाप है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर प्रकार से हमारी ही तरह प्रलोभित किया गया।”
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “पाप से रहित।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀρχιερέα
  choice: महायाजक
  rationale: इब्रानियों में यीशु की याजकीय मध्यस्थता के लिए यह मानक और सटीक पद है।
- source_word: μὴ δυνάμενον συμπαθῆσαι
  choice: हमारे साथ सहानुभूति न रख सके
  rationale: 'οὐ ... μὴ δυνάμενον की नकारात्मक अलंकारिक रचना को बनाए रखता है: वह ऐसा नहीं जो सहानुभूति रखने में असमर्थ हो। ‘हमारे साथ’ συμπαθέω में निहित साथ अनुभव करने के भाव को व्यक्त करता है।'
- source_word: ταῖς ἀσθενείαις ἡμῶν
  choice: हमारी दुर्बलताओं में
  rationale: ἀσθένεια यहाँ केवल बीमारी नहीं, बल्कि मानवीय कमजोरी और भंगुरता को व्यापक रूप से दर्शाता है। ‘दुर्बलताओं’ गरिमापूर्ण और सुबोध है।
- source_word: πεπειρασμένον
  choice: परखा गया
  rationale: πειράζω के ‘परखना’ और ‘परीक्षा/प्रलोभन में डालना’ दोनों अर्थ हो सकते हैं। मुख्य पाठ में ‘परखा गया’ वास्तविक कसौटी को व्यक्त करता है; ‘परीक्षा में डाला गया’ पादटिप्पणी में रखा गया है।
- source_word: κατὰ πάντα
  choice: हर प्रकार से
  rationale: परीक्षा की व्यापकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καθ’ ὁμοιότητα
  choice: हमारी ही समानता में
  rationale: ‘समानता के अनुसार’ की अपेक्षा अधिक स्वाभाविक हिन्दी है, फिर भी ὁμοιότητα की समानता-भाषा को बनाए रखता है। ‘हमारी’ संदर्भ से निहित तुलना को स्पष्ट करती है।
- source_word: χωρὶς ἁμαρτίας
  choice: फिर भी निष्पाप रहा
  rationale: निर्णायक अपवाद और मसीह की पापरहितता को स्वाभाविक हिन्दी में स्पष्ट करता है; शाब्दिक रूप ‘पाप से रहित’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मसीह की पापरहितता के संबंध में πεπειρασμένον का अनुवाद
  choice: परखा गया
  alternative: परीक्षा में डाला गया
  rationale: ‘परखा गया’ वास्तविक और पूर्ण कसौटी को स्वीकार करता है, पर अपने आप में आंतरिक पापमय लालसा का संकेत नहीं देता। स्रोत शब्द की अर्थगत व्यापकता को पादटिप्पणी सुरक्षित रखती है।
- issue: καθ’ ὁμοιότητα में निहित तुलना को कितना स्पष्ट किया जाए
  choice: हमारी ही समानता में
  alternative: समानता के अनुसार
  rationale: यूनानी में समानता स्पष्ट है, पर तुलना का दूसरा पक्ष प्रत्यक्ष रूप से नहीं दोहराया गया। सन्दर्भगत ‘हमारी’ जोड़ने से हिन्दी स्वाभाविक बनती है, जबकि समानता और पूर्ण अभिन्नता के बीच का भेद बना रहता है।
- issue: χωρὶς ἁμαρτίας की वाक्यगत भूमिका
  choice: फिर भी निष्पाप रहा
  alternative: पाप से रहित
  rationale: 'इसे पिछले कथन पर निर्णायक सीमा/अपवाद के रूप में रखा गया है: उसकी परीक्षा वास्तविक थी, पर उसमें पाप नहीं था।'
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। यूनानी की नकारात्मक अलंकारिक रचना को मुख्य पाठ में सुरक्षित रखा गया है। ‘महायाजक’ और ‘निष्पाप’ जैसे स्थापित बाइबलीय-धार्मिक शब्द संदर्भ की गंभीरता बनाए रखते हैं।
