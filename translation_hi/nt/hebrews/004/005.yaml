  text: 'और फिर इस स्थान पर: “वे मेरे विश्राम में निश्चय ही प्रवेश नहीं करेंगे।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शब्दशः, “यदि वे मेरे विश्राम में प्रवेश करेंगे”; यह शपथसूचक शैली है, जिसका अर्थ है, “वे मेरे विश्राम में निश्चय ही प्रवेश नहीं करेंगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: इसी स्थान पर
  rationale: यह वाक्यांश पवित्रशास्त्र के उद्धरण-स्थान की ओर संकेत करता है। ‘इसी स्थान पर’ लेखक की उद्धरण-शैली को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάλιν
  choice: फिर
  rationale: यह पवित्रशास्त्र से दोबारा उद्धरण दिए जाने का संकेत देता है; ‘फिर’ संक्षिप्त और सहज है।
- source_word: Εἰ εἰσελεύσονται
  choice: वे ... कभी प्रवेश नहीं करेंगे
  rationale: यूनानी में यह शर्तसूचक रूप से बना सेमेटिक शपथ-वाक्य है, जो प्रसंग में प्रबल निषेध व्यक्त करता है। हिन्दी में ‘कभी ... नहीं’ उस बल को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: κατάπαυσίν
  choice: विश्राम
  rationale: इब्रानियों 3–4 में यह परमेश्वर के विश्राम के लिए प्रयुक्त प्रमुख शब्द है। ‘विश्राम’ अर्थ और प्रसंग दोनों को बनाए रखता है।
- source_word: μου
  choice: मेरे
  rationale: प्रथम पुरुष संबंधसूचक रूप को सीधे रखा गया है, क्योंकि उद्धरण में परमेश्वर अपने विश्राम की बात करते हैं।
theological_decisions:
- issue: शपथ-सदृश शर्तसूचक वाक्य Εἰ εἰσελεύσονται का अनुवाद
  choice: वे मेरे विश्राम में कभी प्रवेश नहीं करेंगे
  alternative: यदि वे मेरे विश्राम में प्रवेश करेंगे
  rationale: यद्यपि यूनानी संरचना शब्दशः शर्तसूचक है, यह भजन-संहिता के उद्धरण में इब्रानी शपथ-प्रयोग से आया प्रबल निषेध है। अर्थानुसार अनुवाद उसके वास्तविक बल को सुरक्षित रखता है, जबकि पादटिप्पणी मूल संरचना को दर्शाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘कहा गया है’ उद्धरण की प्रकृति को स्वाभाविक बनाता है; ‘कभी ... नहीं’ मूल शपथ-वाक्य के प्रबल निषेध को व्यक्त करता है।
