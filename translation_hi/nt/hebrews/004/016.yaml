id: HEB.4.16
reference: Hebrews 4:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: προσερχώμεθα οὖν μετὰ παρρησίας τῷ θρόνῳ τῆς χάριτος, ἵνα λάβωμεν ἔλεος καὶ χάριν εὕρωμεν εἰς εὔκαιρον βοήθειαν.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/016.yaml
  text: Therefore[a], let us approach the throne of grace with boldness[b], so that we may receive mercy and find grace for timely help.
translation:
  language: hi
  text: इसलिए हम साहस के साथ[a] अनुग्रह के सिंहासन के निकट आएँ, ताकि हम दया प्राप्त करें और ठीक समय पर सहायता के लिए अनुग्रह पाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरे भरोसे के साथ।” यूनानी शब्द निर्भीकता, खुलेपन और भरोसे से बोलने या निकट आने का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आवश्यकता के समय सहायता के लिए।” यूनानी अभिव्यक्ति अधिक शाब्दिक रूप से ऐसी सहायता की ओर संकेत करती है जो ठीक समय पर मिलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσερχώμεθα
  choice: हम ... निकट आएँ
  rationale: वर्तमानकालिक संभावनार्थक रूप यहाँ सामूहिक आग्रह व्यक्त करता है। ‘हम निकट आएँ’ इस आग्रह और परमेश्वर के पास पहुँचने की धारणा, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन—यीशु के महायाजक होने—से निकलने वाले निष्कर्ष को स्पष्ट करता है।
- source_word: μετὰ παρρησίας
  choice: साहस के साथ
  rationale: παρρησία निर्भीकता, खुलापन और भरोसे से पहुँचने का भाव दे सकता है। ‘साहस के साथ’ इसके प्रबल भाव को बनाए रखता है, पर धृष्टता का अर्थ नहीं देता।
- source_word: τῷ θρόνῳ τῆς χάριτος
  choice: अनुग्रह के सिंहासन
  rationale: यह संबंधकारक रचना और सिंहासन के रूपक को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λάβωμεν ἔλεος
  choice: हम दया प्राप्त करें
  rationale: λαμβάνω के ‘प्राप्त करना’ और ἔλεος के ‘दया’ अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: χάριν εὕρωμεν
  choice: अनुग्रह पाएँ
  rationale: ‘अनुग्रह’ χάρις की प्रमुख धार्मिक और संदर्भगत ध्वनि बनाए रखता है। ‘पाएँ’ मूल के εὕρωμεν (‘पाएँ/खोजकर पाएँ’) को दर्शाता और पिछले ‘प्राप्त करें’ से शब्दगत भेद बनाए रखता है।
- source_word: εἰς εὔκαιρον βοήθειαν
  choice: ठीक समय पर सहायता के लिए
  rationale: εὔκαιρος सहायता के उचित अथवा अनुकूल समय पर मिलने पर बल देता है। यह अनुवाद उस समयोचितता को बनाए रखता है और केवल मनुष्य की आवश्यकता की दशा तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर के निकट आने में παρρησία का भाव
  choice: साहस के साथ
  alternative: पूरे भरोसे के साथ
  rationale: पद यीशु की महायाजकीय सेवा के कारण परमेश्वर तक निर्बाध पहुँच पर बल देता है। ‘साहस’ इस प्रबल भाव को बनाए रखता है; पादटिप्पणी ‘भरोसे’ के वैध अर्थ को भी सामने रखती है।
- issue: दूसरे उपवाक्य में χάρις का अनुवाद
  choice: अनुग्रह
  alternative: कृपा
  rationale: ‘अनुग्रह’ इब्रानियों में दैवी उपकार की धार्मिक गहराई और इसी पद के ‘अनुग्रह के सिंहासन’ से शब्दगत संबंध बनाए रखता है, बिना अर्थ में कोई सांप्रदायिक विशिष्टता जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अनुग्रह का सिंहासन’ रूपक तथा ‘दया प्राप्त करें/अनुग्रह पाएँ’ का मूल शब्दगत अंतर सुरक्षित है। पादटिप्पणी-चिह्न उन्हीं पदबंधों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
