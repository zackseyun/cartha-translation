source:
  edition: SBLGNT
  text: Φοβηθῶμεν οὖν μήποτε καταλειπομένης ἐπαγγελίας εἰσελθεῖν εἰς τὴν κατάπαυσιν αὐτοῦ δοκῇ τις ἐξ ὑμῶν ὑστερηκέναι·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/001.yaml
  text: Therefore[a], let us fear lest, while the promise of entering his rest still remains[c][b], any one of you should seem to have fallen short.
translation:
  language: hi
  text: इसलिए, जब उसके विश्राम में प्रवेश करने की प्रतिज्ञा अब भी बनी हुई है[b], तो हम डरें[a] कि कहीं तुममें से कोई उसमें प्रवेश करने से वंचित रह गया प्रतीत न हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम भय मानें।” यूनानी क्रिया केवल “सावधान रहें” से अधिक प्रबल है और चेतावनी की गंभीरता बनाए रखती है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “जब उसके विश्राम में प्रवेश करने की एक प्रतिज्ञा शेष है।” यूनानी वाक्य-रचना संक्षिप्त है और प्रतिज्ञा के अब भी कायम रहने का भाव देती है।
    reason: alternative_reading
  - marker: c
    text: या, “तुममें से कोई उस तक पहुँचने में विफल हुआ दिखाई न दे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Φοβηθῶμεν
  choice: हम डरें
  rationale: यह सीधा सामूहिक आग्रह है और यूनानी क्रिया की गंभीर चेतावनी को ‘सावधान रहें’ जैसे नरम अनुवाद से अधिक स्पष्ट रूप में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निकाले गए निष्कर्ष और इस चेतावनी के तार्किक संबंध को दर्शाता है।
- source_word: μήποτε
  choice: कि ... न
  rationale: आधुनिक हिंदी में यह नकारात्मक आशंका और चेतावनी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: καταλειπομένης ἐπαγγελίας
  choice: प्रतिज्ञा अब भी बनी हुई है
  rationale: यह संबंधवाचक निरपेक्ष रचना उस साथ-साथ विद्यमान परिस्थिति को बताती है कि प्रतिज्ञा अभी समाप्त नहीं हुई, बल्कि कायम है।
- source_word: ἐπαγγελίας
  choice: प्रतिज्ञा
  rationale: यह परमेश्वर द्वारा दिए गए आश्वासन के लिए प्रचलित, गरिमापूर्ण और प्रसंगानुकूल शब्द है।
- source_word: εἰσελθεῖν
  choice: प्रवेश करने की
  rationale: इसे ‘प्रतिज्ञा’ से जोड़कर अनंत क्रिया का संबंध स्वाभाविक हिंदी में सुरक्षित रखा गया है।
- source_word: κατάπαυσιν
  choice: विश्राम
  rationale: इब्रानियों 3–4 में परमेश्वर के विश्राम के लिए यही स्थापित और प्रसंगानुकूल अर्थ है; इसे केवल काम से रुकने तक सीमित नहीं किया गया।
- source_word: αὐτοῦ
  choice: उसके
  rationale: यूनानी सर्वनाम को बनाए रखा गया है; इसका पूर्वपद प्रसंग में स्पष्ट है।
- source_word: δοκῇ
  choice: प्रतीत न हो
  rationale: यह दिखाई देने या समझे जाने की अर्थ-छाया को बनाए रखता है और उसे निश्चित अंतिम निर्णय में नहीं बदलता।
- source_word: τις ἐξ ὑμῶν
  choice: तुममें से कोई
  rationale: यह एकवचन अनिश्चित व्यक्ति और समूह में से होने, दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: ὑστερηκέναι
  choice: पीछे रह गया
  rationale: यह लक्ष्य तक न पहुँच पाने या उससे वंचित रह जाने का भाव देता है, साथ ही यूनानी पूर्णकालिक अनंत क्रिया के परिणामी पक्ष को ‘रह गया’ से व्यक्त करता है।
theological_decisions:
- issue: चेतावनी को वास्तविक भय के रूप में रखना या केवल सावधानी के रूप में नरम करना
  choice: ‘हम डरें’ के रूप में प्रबल आग्रह बनाए रखा गया
  alternative: ‘हम सावधान रहें’
  rationale: φοβηθῶμεν स्पष्ट रूप से भय की भाषा है। अनुवाद चेतावनी की तीव्रता को बनाए रखता है, पर धीरज या धर्मत्याग संबंधी किसी सिद्धान्त का निर्णय इसमें नहीं जोड़ता।
- issue: ‘उसके विश्राम’ की पहचान मुख्य पाठ में स्पष्ट रूप से परमेश्वर के अंतिमकालीन विश्राम के रूप में करना या सर्वनाम बनाए रखना
  choice: ‘उसके विश्राम’
  alternative: ‘परमेश्वर के विश्राम’ अथवा ‘उसके सब्त के विश्राम’
  rationale: मूल पद में सर्वनाम है और संदर्भ उसका संकेत देता है। सर्वनाम बनाए रखने से अध्याय में आगे विकसित अर्थ को पहले से सीमित नहीं किया जाता।
- issue: δοκῇ को केवल बाहरी आभास मानना या वास्तविक विफलता का निर्णय समझना
  choice: ‘प्रतीत न हो’ द्वारा मूल की अर्थगत खुलावट बनाए रखी गई
  alternative: ‘न पहुँच पाया हो’
  rationale: δοκέω में प्रतीत होने या समझे जाने का भाव है। मुख्य पाठ इस तनाव को निर्णायक रूप से किसी एक दिशा में नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिंदी, देवनागरी में; शैली गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज है। ‘हम डरें’ चेतावनी की शक्ति रखता है। ‘पीछे रह गया’ लक्ष्य से चूकने के रूपक को स्वाभाविक हिंदी में व्यक्त करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
