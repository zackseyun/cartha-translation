  edition: SBLGNT
  text: ὁ γὰρ εἰσελθὼν εἰς τὴν κατάπαυσιν αὐτοῦ καὶ αὐτὸς κατέπαυσεν ἀπὸ τῶν ἔργων αὐτοῦ ὥσπερ ἀπὸ τῶν ἰδίων ὁ θεός.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/010.yaml
  text: For the one who has entered his rest has himself also rested from his works[b][a], just as God did from his own.
translation:
  language: hi
  text: क्योंकि जिसने उसके विश्राम में प्रवेश किया है[a], उसने स्वयं भी अपने कामों से विश्राम किया है[b], जैसे परमेश्वर ने अपने कामों से विश्राम किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के विश्राम में।” यहाँ “उसके” का संकेत सबसे अधिक संभावना से परमेश्वर की ओर है, जैसा इब्रानियों 3–4 के प्रसंग से प्रकट होता है।
    reason: alternative_reading
  - marker: b
    text: या, “अपने कामों से विराम लिया है।” यूनानी में यहाँ प्रयुक्त क्रिया इसी अनुच्छेद में “विश्राम” के लिए प्रयुक्त संज्ञा से संबंधित है; इसलिए मुख्य पाठ में विश्राम की पुनरावृत्ति रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ ... εἰσελθὼν
  choice: जो ... प्रवेश कर चुका है
  rationale: संज्ञा की तरह प्रयुक्त आओरिस्ट कृदंत किसी ऐसे व्यक्ति को दर्शाता है जिसका प्रवेश पूरा हो चुका है। यह हिंदी रूप सामान्य एकवचन भाव और पूर्ण हो चुके प्रवेश—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार या स्पष्टीकरण प्रस्तुत करता है; आधुनिक हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और सहज बनाता है।
- source_word: κατάπαυσιν
  choice: विश्राम
  rationale: इब्रानियों 3–4 में यह मुख्य विषयगत शब्द है और परमेश्वर के विश्राम तथा उत्पत्ति 2 की पृष्ठभूमि से जुड़ा है।
- source_word: αὐτοῦ (after κατάπαυσιν)
  choice: उसके
  rationale: सर्वनाम का रूप बनाए रखने से यूनानी की वास्तविक संदर्भगत अस्पष्टता बनी रहती है; प्रसंग में इसका सबसे संभावित संकेत परमेश्वर की ओर है।
- source_word: καὶ αὐτὸς
  choice: उसने भी
  rationale: ‘भी’ तुलना और सहभागिता को व्यक्त करता है, जबकि कर्ता-सर्वनाम का स्पष्ट प्रयोग αὐτός के बल को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: κατέπαυσεν
  choice: विश्राम किया है
  rationale: ‘विश्राम’ की पुनरावृत्ति κατάπαυσις के साथ यूनानी शब्द-संबंध को बनाए रखती है; ‘काम करना छोड़ दिया’ अर्थ की दृष्टि से संभव है, पर विषयगत प्रतिध्वनि को कम कर देता है।
- source_word: ἀπὸ τῶν ἔργων αὐτοῦ
  choice: अपने कामों से
  rationale: ‘काम’ ἔργα का व्यापक और सामान्य हिंदी रूप है तथा इसे किसी खास प्रकार के धार्मिक या पुण्य-कर्म तक सीमित नहीं करता।
- source_word: ὥσπερ
  choice: ठीक वैसे ही जैसे
  rationale: यह परमेश्वर के विश्राम के साथ स्पष्ट और बलयुक्त तुलना को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: ἀπὸ τῶν ἰδίων ὁ θεός
  choice: जैसे परमेश्वर ने अपने कामों से किया था
  rationale: यूनानी में ‘कामों’ शब्द दूसरी बार लुप्त है, पर हिंदी में पहले खंड से उसे दोहराना अर्थ को स्पष्ट करता है। ‘अपने’ ἰδίων के निजवाचक बल को व्यक्त करता है।
theological_decisions:
- issue: ‘उसके विश्राम’ (αὐτοῦ) का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ रखा गया है; प्रसंग में इसे परमेश्वर का विश्राम समझना सबसे संभावित है।
  alternative: इसे प्रवेश करने वाले व्यक्ति का अपना विश्राम समझा जा सकता है।
  rationale: इब्रानियों 3–4 में बार-बार परमेश्वर के विश्राम की बात आती है, और अंतिम तुलना परमेश्वर के अपने कामों से विश्राम करने से है। फिर भी मुख्य पाठ में ‘परमेश्वर के’ जोड़ने के बजाय सर्वनाम रखने से मूल की अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विश्राम’ की विषयगत पुनरावृत्ति जानबूझकर सुरक्षित है। ‘उसके’ मूल सर्वनाम की अस्पष्टता बनाए रखता है, जबकि पादटिप्पणी सबसे संभावित संदर्भ स्पष्ट करती है।
