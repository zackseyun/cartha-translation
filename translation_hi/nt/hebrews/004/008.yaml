  text: εἰ γὰρ αὐτοὺς Ἰησοῦς κατέπαυσεν, οὐκ ἂν περὶ ἄλλης ἐλάλει μετὰ ταῦτα ἡμέρας.
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/008.yaml
  text: For if Joshua had given them rest[a], he would not have spoken later about another day.
translation:
  language: hi
  text: क्योंकि यदि यहोशू[a] ने उन्हें विश्राम दिया होता, तो बाद में किसी और दिन के बारे में बात न कही जाती।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में नामरूप ‘यीशु’ है। Ἰησοῦς यीशु या यहोशू, दोनों के लिए हो सकता है; यहाँ प्रसंग नून के पुत्र यहोशू की ओर संकेत करता है।
    reason: मूल यूनानी नामरूप की समानता और उसके संभावित वैकल्पिक नाम-संदर्भ को पारदर्शी रखना।
lexical_decisions:
- source_word: Ἰησοῦς
  choice: यहोशू
  rationale: यूनानी नामरूप Ἰησοῦς यीशु और यहोशू—दोनों के लिए प्रयुक्त हो सकता है; यहाँ इस्राएल के कनान में प्रवेश और भजन 95 में बाद में किए गए विश्राम के वादे का संदर्भ नून के पुत्र यहोशू की ओर संकेत करता है।
- source_word: κατέπαυσεν
  choice: विश्राम दे दिया होता
  rationale: यह क्रिया किसी को रुकने या विश्राम में पहुँचाने का कारक भाव रखती है। यह हिंदी अभिव्यक्ति उस भाव और इस अनुच्छेद में बार-बार आने वाले ‘विश्राम’ शब्द को बनाए रखती है।
- source_word: οὐκ ἂν ... ἐλάλει
  choice: न बोलता
  rationale: ἄν के साथ अपूर्णकालीन क्रिया भूतकाल की तथ्य-विपरीत शर्त का परिणाम व्यक्त करती है; ‘यदि ... दे दिया होता, तो ... न बोलता’ स्वाभाविक हिंदी में वही अर्थ देता है।
- source_word: περὶ ἄλλης ... ἡμέρας
  choice: किसी दूसरे दिन के विषय में
  rationale: यह वाक्यांश बाद में बताए गए एक अन्य दिन को सूचित करता है और लेखक के तर्क में उस प्रतिज्ञा के शेष रहने को खुला रखता है।
- source_word: μετὰ ταῦτα
  choice: इसके बाद
  rationale: यह पदबंध समयगत क्रम बताता है—यहोशू के समय के बाद कही गई बात।
- source_word: γὰρ
  choice: क्योंकि
  rationale: γάρ पिछले कथन के समर्थन में व्याख्या प्रस्तुत करता है; ‘क्योंकि’ हिंदी में इस तार्किक संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: इब्रानियों 4:8 में Ἰησοῦς का संदर्भ
  choice: नून का पुत्र यहोशू
  alternative: यीशु
  rationale: प्रसंग इस्राएल को देश में ले जाने वाले यहोशू और उसके बहुत बाद भजन 95 में घोषित विश्राम के दिन की तुलना करता है। इसलिए मुख्य पाठ में ‘यहोशू’ अभिप्रेत ऐतिहासिक व्यक्ति को स्पष्ट करता है, जबकि यूनानी नामरूप की वास्तविक समानता पादटिप्पणी में सुरक्षित रखी गई है।
- issue: ἐλάλει का अप्रकट कर्ता
  choice: वह
  alternative: परमेश्वर
  rationale: यूनानी क्रिया में कर्ता स्पष्ट संज्ञा के रूप में नहीं दिया गया है। पूर्व प्रसंग परमेश्वर के दाऊद के द्वारा बोलने की ओर संकेत करता है, पर मुख्य पाठ में ‘वह’ रखने से मूल की अप्रकटता बनी रहती है और अनावश्यक स्पष्टता नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘विश्राम’ को अनुच्छेद के प्रमुख धर्मवैचारिक शब्द के रूप में लगातार रखा गया है। तथ्य-विपरीत शर्त को ‘यदि ... होता, तो ... न बोलता’ संरचना से व्यक्त किया गया है।
