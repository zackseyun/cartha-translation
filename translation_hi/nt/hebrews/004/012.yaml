id: HEB.4.12
reference: Hebrews 4:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ζῶν γὰρ ὁ λόγος τοῦ θεοῦ καὶ ἐνεργὴς καὶ τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον καὶ διϊκνούμενος ἄχρι μερισμοῦ ψυχῆς ⸀καὶ πνεύματος, ἁρμῶν τε καὶ μυελῶν, καὶ κριτικὸς ἐνθυμήσεων καὶ ἐννοιῶν καρδίας·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/012.yaml
  text: For the word of God is living and active[a], and sharper than any double-edged sword, piercing to the division of soul and spirit, of joints and marrow[c][b], and able to judge the thoughts and intentions of the heart.
translation:
  language: hi
  text: क्योंकि परमेश्वर का वचन जीवित और सक्रिय है, और हर दोधारी तलवार से भी अधिक धारदार है। वह प्राण और आत्मा को, और जोड़ों और अस्थि-मज्जा को अलग करने तक भीतर आर-पार पहुँचता है,[a][b] और हृदय के विचारों और इरादों को परखने में समर्थ है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गहराई तक प्रवेश करता है”; यूनानी शब्द भीतर से होकर जाने या बहुत गहराई तक पहुँचने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “प्राण और आत्मा” का उल्लेख अपने आप में मनुष्य की संरचना के किसी खास सिद्धान्त को अनिवार्य नहीं करता; प्रसंग परमेश्वर के वचन की भीतरी जीवन की गहराइयों तक पहुँच पर बल देता है।
    reason: alternative_reading
  - marker: c
    text: या, “हृदय के विचारों और अभिप्रायों का विवेचन करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Ζῶν
  choice: जीवित
  rationale: यह ὁ λόγος का विधेयात्मक विशेषण है और वचन की निरंतर सजीवता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसका व्याख्यात्मक संबंध स्पष्ट रखता है।
- source_word: ὁ λόγος τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह प्रचलित और पारदर्शी अनुवाद है, जो अर्थ को केवल पवित्रशास्त्र, प्रचारित संदेश या व्यक्तिगत ‘वचन’ तक सीमित नहीं करता।
- source_word: ἐνεργὴς
  choice: सक्रिय
  rationale: यह वचन के कार्यरत और प्रभाव डालने वाले स्वभाव को संक्षेप में व्यक्त करता है, बिना इसे केवल ‘शक्तिशाली’ अर्थ तक सीमित किए।
- source_word: τομώτερος ὑπὲρ πᾶσαν μάχαιραν δίστομον
  choice: हर दोधारी तलवार से भी अधिक धारदार
  rationale: तुलनात्मक रचना और तलवार की दोनों धारों वाली सजीव उपमा को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: διϊκνούμενος
  choice: भीतर आर-पार पहुँचता है
  rationale: वर्तमान कृदन्त गहराई तक प्रवेश करने या पार जाने का भाव देता है; यह अभिव्यक्ति तलवार की उपमा और गहन पहुँच दोनों को रखती है।
- source_word: ἄχρι μερισμοῦ
  choice: अलग करने तक
  rationale: ἄχρι सीमा या विस्तार और μερισμός विभाजन का भाव देता है; हिन्दी में यह उस पहुँच की चरम सीमा स्पष्ट करता है।
- source_word: ψυχῆς καὶ πνεύματος
  choice: प्राण और आत्मा
  rationale: शब्द-युग्म को अलग-अलग रखते हुए ψυχή के लिए आधुनिक सन्दर्भ में समझ आने वाला ‘प्राण’ चुना गया है; इससे किसी निश्चित मानव-संरचना का सिद्धान्त आरोपित नहीं होता।
- source_word: ἁρμῶν τε καὶ μυελῶν
  choice: जोड़ों और गूदे
  rationale: यह शारीरिक गहराई का समानांतर चित्र बनाए रखता है; μυελός के लिए ‘गूदा’ आम हिन्दी में अस्थि-मज्जा के भीतरी पदार्थ को सहज रूप से व्यक्त करता है।
- source_word: κριτικὸς
  choice: परखने में समर्थ
  rationale: विशेषण मूल्यांकन या न्याय करने की क्षमता बताता है; ‘परखने में समर्थ’ विधेयात्मक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἐνθυμήσεων
  choice: विचारों
  rationale: यह भीतर के सोच-विचार और मनन को व्यापक, सहज हिन्दी में व्यक्त करता है।
- source_word: ἐννοιῶν
  choice: इरादों
  rationale: यह ἐνθυμήσεων से भेद रखते हुए भीतर के उद्देश्य, अभिप्राय या मानसिक संकल्प को व्यक्त करता है।
theological_decisions:
- issue: ‘परमेश्वर का वचन’ किसे सूचित करता है
  choice: ‘परमेश्वर का वचन’ को व्यापक रूप में रखा गया है।
  alternative: इसे केवल पवित्रशास्त्र, परमेश्वर की बोली हुई प्रतिज्ञा/न्याय-वाणी, प्रचारित संदेश, या पुत्र/लोगोस के रूप में स्पष्ट करना।
  rationale: इब्रानियों के निकटवर्ती प्रसंग में परमेश्वर के बोलने और उसकी वाणी की प्रभावशीलता पर बल है, पर यूनानी पदबंध किसी एक तात्पर्य को अनिवार्य नहीं बनाता।
- issue: ‘प्राण और आत्मा’ का मानव-विज्ञान संबंधी अर्थ
  choice: दोनों शब्दों को ज्यों का त्यों अलग रखा गया है, पर किसी निश्चित द्विभागी या त्रिभागी मानव-संरचना का संकेत नहीं जोड़ा गया।
  alternative: इन्हें मनुष्य के तकनीकी रूप से अलग किए जा सकने वाले घटकों की घोषणा मानना, या केवल ‘भीतरी जीवन’ के रूप में मिला देना।
  rationale: यह पद गहराई तक भेदने की आलंकारिक शृंखला में इस युग्म का प्रयोग करता है। अनुवाद शब्दों को सुरक्षित रखता है, पर पाठ से आगे कोई सिद्धान्त नहीं बनाता।
- issue: ‘अलग करने तक’ का आशय
  choice: वचन की अत्यंत गहरी पहुँच बताने वाली उपमा के रूप में अनुवाद किया गया है।
  alternative: यह कहना कि वचन वास्तव में प्राण को आत्मा से या जोड़ों को गूदे से भौतिक रूप से अलग करता है।
  rationale: ἄχρι μερισμοῦ पहुँच की सीमा व्यक्त करता है; वाक्य तलवार की उपमा के माध्यम से परमेश्वर के वचन की भेदक और परखने वाली सामर्थ्य दिखाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘दोधारी तलवार’, ‘आर-पार पहुँचता है’ और ‘परखने में समर्थ’ मूल के चित्र और विधेयात्मक बल को स्वाभाविक हिन्दी में सँभालते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
