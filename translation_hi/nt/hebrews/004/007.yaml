source:
  edition: SBLGNT
  text: πάλιν τινὰ ὁρίζει ἡμέραν, Σήμερον, ἐν Δαυὶδ λέγων μετὰ τοσοῦτον χρόνον, καθὼς ⸀προείρηται, Σήμερον ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε, μὴ σκληρύνητε τὰς καρδίας ὑμῶν·
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/007.yaml
  text: 'Again he appoints a certain day[a], “Today,” saying through David after so long a time, just as has been said before: “Today, if you hear his voice, do not harden your hearts.”'
translation:
  language: hi
  text: 'वह फिर एक विशिष्ट दिन ठहराता है—“आज”—और इतने लंबे समय के बाद दाऊद के द्वारा[a] कहता है, जैसा पहले कहा गया है:


    “आज यदि तुम उसकी आवाज़ सुनो,

    तो अपने हृदयों को कठोर न करो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद में,” अर्थात दाऊद से जुड़े भजन में।
    reason: यूनानी ἐν Δαυὶδ का शाब्दिक रूप “दाऊद में” है और यह दाऊद से जुड़े भजन में कही गई बात का संकेत हो सकता है।
lexical_decisions:
- source_word: πάλιν
  choice: फिर
  rationale: यह तर्क में पुनरारंभ और परमेश्वर द्वारा एक दिन को नए सिरे से ठहराए जाने का भाव व्यक्त करता है।
- source_word: τινὰ ἡμέραν
  choice: एक विशेष दिन
  rationale: यह किसी विशिष्ट, पर आरंभ में अनाम दिन की ओर संकेत करता है; आगे उसकी पहचान “आज” के रूप में होती है।
- source_word: ὁρίζει
  choice: ठहराता है
  rationale: संदर्भ में अधिकारपूर्वक किसी दिन को निश्चित या निर्धारित करने का भाव है।
- source_word: Σήμερον
  choice: आज
  rationale: भजन के उद्धरण में इसी शब्द से निर्धारित दिन की पहचान होती है; उद्धरण-चिह्न इसकी विशेष आलंकारिक शक्ति बनाए रखते हैं।
- source_word: ἐν Δαυὶδ λέγων
  choice: दाऊद के द्वारा कहता है
  rationale: यह स्वाभाविक हिन्दी में दाऊद के माध्यम से परमेश्वर के बोलने का भाव देता है, पर दाऊद से जुड़े भजन के भीतर कहे जाने की सम्भावना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: μετὰ τοσοῦτον χρόνον
  choice: इतने लंबे समय के बाद
  rationale: जंगल की पीढ़ी और दाऊद के समय के बीच के बड़े अंतराल पर बल बनाए रखता है।
- source_word: καθὼς προείρηται
  choice: जैसा पहले कहा गया है
  rationale: पूर्ण निष्क्रिय क्रिया का पहले कही गई और अब भी प्रासंगिक बात का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐὰν τῆς φωνῆς αὐτοῦ ἀκούσητε
  choice: यदि तुम उसकी आवाज़ सुनो
  rationale: सुनने के मूल बिंब को बनाए रखता है और उसे व्याख्यात्मक रूप से केवल “आज्ञा मानने” तक सीमित नहीं करता।
- source_word: μὴ σκληρύνητε
  choice: कठोर न करो
  rationale: हठीले प्रतिरोध के विरुद्ध निषेध को सीधा और परिचित रूप देता है।
- source_word: τὰς καρδίας ὑμῶν
  choice: अपने हृदयों को
  rationale: मनुष्य के भीतरी स्वभाव, इच्छा और रुझान के बाइबलीय बिंब को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के विश्राम के तर्क में “आज” का अर्थ
  choice: “आज” को उत्तर देने के लिए परमेश्वर द्वारा ठहराए गए वर्तमान अवसर के रूप में खुला रखा गया है।
  alternative: इसे केवल भजनकार का ऐतिहासिक दिन या केवल अंतिम युग का दिन मानना।
  rationale: पद जंगल की पीढ़ी के बहुत बाद भी उत्तर देने के एक दिन को ठहराए जाने की बात करता है; अनुवाद समय के विषय में इससे अधिक व्यवस्थित निष्कर्ष नहीं थोपता।
- issue: ἐν Δαυὶδ का आशय
  choice: दाऊद के द्वारा
  alternative: “दाऊद में,” अर्थात दाऊद से जुड़े भजन में
  rationale: मुख्य पाठ में यह परमेश्वर के दाऊद के माध्यम से बोलने का स्वाभाविक अर्थ देता है, जबकि यूनानी वाक्यांश की दूसरी सम्भावना पादटिप्पणी में सुरक्षित है।
- issue: अप्रत्यक्ष कर्ता की पहचान
  choice: वह
  alternative: परमेश्वर
  rationale: यूनानी पाठ में कर्ता स्पष्ट संज्ञा के रूप में नहीं दोहराया गया है; “वह” संदर्भगत पहचान को बनाए रखते हुए पाठ से अधिक स्पष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य शैली रखी गई है। कविता-सदृश पंक्ति-विन्यास भजन के उद्धरण को स्पष्ट करता है; “हृदय” जैसे स्थापित बाइबलीय बिंब को बनाए रखा गया है।
