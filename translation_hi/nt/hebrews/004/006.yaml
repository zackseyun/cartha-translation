  text: ἐπεὶ οὖν ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν, καὶ οἱ πρότερον εὐαγγελισθέντες οὐκ εἰσῆλθον δι’ ἀπείθειαν,
base_translation:
  language: en
  yaml_path: translation/nt/hebrews/004/006.yaml
  text: Therefore[a], since it remains for some to enter it, and those who formerly had the good news proclaimed to them did not enter because of disobedience,
translation:
  language: hi
  text: अतः, चूँकि कुछ लोगों के लिए उसमें प्रवेश करना शेष है, और जिन्हें पहले शुभ समाचार सुनाया गया था, उन्होंने अवज्ञा[a] के कारण प्रवेश नहीं किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अविश्वास।’ यूनानी शब्द विश्वास करने से इनकार को सूचित कर सकता है, जो अवज्ञा में प्रकट होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπεὶ οὖν
  choice: इसलिए, जब कि
  rationale: यह संयोजन पिछले तर्क से निष्कर्ष भी जोड़ता है और आगे के कथन का आधार भी बताता है; हिन्दी में यह दोनों बलों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπολείπεται τινὰς εἰσελθεῖν εἰς αὐτήν
  choice: कुछ लोगों का उसमें प्रवेश करना अभी बाकी है
  rationale: वर्तमान निष्क्रिय क्रिया निरंतर शेष अवसर को दर्शाती है। ‘अभी बाकी है’ उपलब्धता के बने रहने का भाव देता है, और ‘उसमें’ पूर्वोक्त विश्राम की ओर संकेत बनाए रखता है।
- source_word: οἱ πρότερον εὐαγγελισθέντες
  choice: जिन्हें पहले शुभ समाचार सुनाया गया था
  rationale: यह निष्क्रिय कृदन्त का बल सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है; ‘शुभ समाचार’ εὐαγγελίζω के संदेश-संबंधी अर्थ को व्यक्त करता है।
- source_word: οὐκ εἰσῆλθον
  choice: प्रवेश नहीं कर सके
  rationale: संदर्भ में परिणामतः प्रवेश न पाने को सहज हिन्दी में व्यक्त करता है, यद्यपि यूनानी का सीधा रूप ‘प्रवेश नहीं किया’ है।
- source_word: δι’ ἀπείθειαν
  choice: अवज्ञा के कारण
  rationale: ἀπείθεια का मुख्य अर्थ आज्ञा न मानना या अवज्ञा है; संदर्भ में इसका अविश्वास से घनिष्ठ संबंध है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: विश्राम की चेतावनी के संदर्भ में ἀπείθεια का अनुवाद
  choice: अवज्ञा के कारण
  alternative: अविश्वास के कारण
  rationale: यह शब्द परमेश्वर के वचन पर विश्वास न करने और उसके अनुसार न चलने, दोनों से जुड़ा है। मुख्य पाठ में ‘अवज्ञा’ उसके क्रियात्मक बल को रखता है, जबकि पादटिप्पणी वास्तविक अर्थगत विस्तार को बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण। पूर्ववर्ती संदर्भ के ‘विश्राम’ को स्पष्ट करके जोड़ने के बजाय यूनानी सर्वनाम के अनुरूप ‘उसमें’ रखा गया है। वाक्य के अंत का अल्पविराम अगले पद में जारी रहने वाले तर्क को दर्शाता है।
