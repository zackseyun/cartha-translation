id: LUK.17.33
reference: Luke 17:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὃς ἐὰν ζητήσῃ τὴν ψυχὴν αὐτοῦ ⸀περιποιήσασθαι ἀπολέσει αὐτήν, ⸂ὃς δ’ ἂν⸃ ⸀ἀπολέσῃ ζῳογονήσει αὐτήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/033.yaml
  text: Whoever seeks to preserve his life will lose it[b][a], but whoever loses it will preserve it alive.
translation:
  language: hi
  text: जो कोई अपना जीवन[a] बचाए रखने की कोशिश करेगा, वह उसे खो देगा; पर जो कोई उसे खो देगा, वह उसे जीवित रखेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘जीवन’ के स्थान पर ‘प्राण’ भी हो सकता है; यूनानी शब्द ψυχή यहाँ संभवतः व्यक्ति के जीवन या स्वयं व्यक्ति को सूचित करता है, न कि केवल अमूर्त आत्मा को।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसका जीवन बनाए रखेगा’; यूनानी क्रिया का शाब्दिक अर्थ ‘जीवित रखना’ है। परंपरागत रूप से इसका अनुवाद ‘उसे बचाएगा’ भी किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ζητήσῃ
  choice: कोशिश करेगा
  rationale: यहाँ ζητέω केवल इच्छा नहीं, बल्कि उद्देश्यपूर्ण प्रयास को व्यक्त करता है; आधुनिक हिन्दी में ‘कोशिश करेगा’ इसे स्वाभाविक रूप से बताता है।
- source_word: ψυχὴν
  choice: जीवन
  rationale: इस प्रसंग में ψυχή मनुष्य के जीवन या स्वयं को सूचित करता है, न कि अनिवार्य रूप से देह से अलग किसी अमूर्त आत्मा को।
- source_word: περιποιήσασθαι
  choice: बचाए रखने
  rationale: मध्यवाच्य रूप अपने लिए जीवन सुरक्षित रखने या बचाने के प्रयास का भाव देता है; ‘बचाए रखने’ में आत्म-सुरक्षा का यह भाव बना रहता है।
- source_word: ἀπολέσει / ἀπολέσῃ
  choice: खो देगा
  rationale: दोनों रूपों को समान रूप से प्रस्तुत करने से कथन का जानबूझकर रखा गया विरोधाभास स्पष्ट और अक्षुण्ण रहता है।
- source_word: ζῳογονήσει
  choice: जीवित रखेगा
  rationale: ζῳογονέω का सीधा अर्थ जीवित रखना या जीवन बनाए रखना है; यह सामान्य ‘बचाएगा’ की अपेक्षा यूनानी क्रिया का विशिष्ट और सजीव अर्थ बेहतर सुरक्षित रखता है।
- source_word: ὃς ἐὰν ... ὃς δ’ ἂν
  choice: जो कोई ... पर जो कोई
  rationale: यह रचना सामान्य शर्त व्यक्त करती है और δέ दोनों स्थितियों के बीच विरोध दिखाता है।
theological_decisions:
- issue: ψυχή का अर्थ
  choice: ‘जीवन’
  alternative: ‘प्राण’ या ‘आत्मा’
  rationale: निकटवर्ती प्रसंग न्याय के समय अपने जीवन को सुरक्षित करने और उसे खोने की बात करता है। ‘जीवन’ इस अर्थ को स्पष्ट रखता है और अनावश्यक देह-आत्मा द्वैत नहीं जोड़ता।
- issue: ζῳογονήσει का अनुवाद
  choice: ‘उसे जीवित रखेगा’
  alternative: ‘उसे बचाएगा’ या ‘उसका जीवन सुरक्षित रखेगा’
  rationale: मूल में सामान्यतः प्रयुक्त ‘उद्धार करना’ वाली क्रिया नहीं, बल्कि जीवित रखने वाली क्रिया है। चुना हुआ अनुवाद इस भेद और कथन के तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उसे जीवित रखेगा’ हिन्दी में कुछ असामान्य लग सकता है, पर यह मूल यूनानी की विशिष्ट क्रिया और कथन के जानबूझकर रखे गए विरोधाभास को सुरक्षित रखता है।
