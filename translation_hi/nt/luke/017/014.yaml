  text: καὶ ἰδὼν εἶπεν αὐτοῖς· Πορευθέντες ἐπιδείξατε ἑαυτοὺς τοῖς ἱερεῦσιν. καὶ ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς ἐκαθαρίσθησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/014.yaml
  text: And when he saw them[a], he said to them, “Go and show yourselves to the priests.” And as they were going[b], they were cleansed.
translation:
  language: hi
  text: उसने उन्हें देखकर कहा, “जाओ और अपने आप को याजकों को दिखाओ।”[a] और जब वे जा रहे थे, तो वे शुद्ध हो गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: याजकों को अपने आप को दिखाने की यह आज्ञा त्वचा के रोग से चंगे हुए व्यक्ति की याजकीय जाँच से संबंधित है; देखें लैव्यव्यवस्था 14।
    reason: cross_reference
  - marker: b
    text: यूनानी क्रिया शारीरिक और अनुष्ठानिक—दोनों अर्थों में शुद्ध होने का बोध करा सकती है; अथवा, “वे शुद्ध कर दिए गए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: उन्हें देखकर
  rationale: ὁράω के एओरिस्ट कृदंत को मुख्य क्रिया εἶπεν से जोड़ते हुए स्वाभाविक हिन्दी में क्रियापूर्वक रूप दिया गया है। “उन्हें” निकटवर्ती αὐτοῖς और प्रसंग से स्पष्ट है।
- source_word: Πορευθέντες
  choice: जाओ
  rationale: यह एओरिस्ट कृदंत अगले आदेश ἐπιδείξατε के साथ आदेशात्मक बल रखता है। “जाओ और…” हिन्दी में क्रम तथा आज्ञा दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐπιδείξατε ἑαυτοὺς
  choice: अपने आपको … दिखाओ
  rationale: पुरोहितीय जाँच के प्रसंग में यह सीधा और साधारण हिन्दी प्रयोग है; “अपने आपको प्रस्तुत करो” अपेक्षाकृत औपचारिक और कम स्पष्ट होता।
- source_word: τοῖς ἱερεῦσιν
  choice: याजकों को
  rationale: बहुवचन को सुरक्षित रखा गया है। “याजक” तोराह में निर्धारित जाँच और शुद्ध घोषित करने की भूमिका के लिए प्रचलित तथा उपयुक्त शब्द है।
- source_word: ἐγένετο ἐν τῷ ὑπάγειν αὐτοὺς
  choice: और ऐसा हुआ कि जाते-जाते
  rationale: ἐγένετο को पूरी तरह हटाए बिना “ऐसा हुआ कि” से घटना-वर्णन रखा गया है, और ἐν τῷ ὑπάγειν की समकालिकता को “जाते-जाते” स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκαθαρίσθησαν
  choice: वे शुद्ध हो गए
  rationale: καθαρίζω का निष्क्रिय रूप यहाँ शारीरिक रोग-मुक्ति और धार्मिक शुद्धता दोनों की ओर संकेत कर सकता है। “शुद्ध हो गए” आधुनिक हिन्दी में स्वाभाविक है और केवल “चंगे हो गए” कहने की अपेक्षा इस द्विअर्थी आयाम को बेहतर सुरक्षित रखता है।
theological_decisions:
- issue: त्वचा-रोग के प्रसंग में καθαρίζω की शुद्धता-संबंधी भाषा
  choice: वे शुद्ध हो गए
  alternative: वे चंगे हो गए
  rationale: यूनानी क्रिया केवल स्वास्थ्य-लाभ नहीं, बल्कि याजकीय जाँच से संबंधित धार्मिक शुद्धता भी व्यक्त कर सकती है। इसलिए मुख्य पाठ में “शुद्ध” रखा गया है, जिससे शारीरिक और अनुष्ठानिक दोनों आयाम खुले रहते हैं।
- issue: याजकों को दिखाने की आज्ञा का आशय
  choice: मुख्य पाठ में केवल प्रत्यक्ष आज्ञा; पृष्ठभूमि पादटिप्पणी में
  alternative: मुख्य पाठ में जाँच या प्रमाणित किए जाने की व्याख्या जोड़ना
  rationale: यूनानी पाठ जाँच या प्रमाणन को स्पष्ट रूप से नहीं कहता। लैव्यव्यवस्था 14 की पृष्ठभूमि सहायक है, पर उसे मुख्य पाठ में जोड़ने से अनुवाद व्याख्यात्मक रूप से अधिक निश्चित हो जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “याजक” और “शुद्ध” जैसे बाइबलीय शब्द प्रसंग की सांस्कृतिक तथा धार्मिक गहराई बनाए रखते हैं, जबकि वाक्य-विन्यास साधारण पाठक के लिए स्वाभाविक है।
