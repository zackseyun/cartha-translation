source:
  edition: SBLGNT
  text: Τίς δὲ ἐξ ὑμῶν δοῦλον ἔχων ἀροτριῶντα ἢ ποιμαίνοντα, ὃς εἰσελθόντι ἐκ τοῦ ἀγροῦ ἐρεῖ ⸀αὐτῷ· Εὐθέως παρελθὼν ἀνάπεσε,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/007.yaml
  text: But which of you[a], having a servant plowing or shepherding, will say to him when he has come in from the field[b], ‘Come at once and recline at the table’?
translation:
  language: hi
  text: “तुम में से ऐसा कौन है, जिसके पास हल चलाने या रेवड़ चराने वाला एक ग़ुलाम[a] हो, और वह उससे, जब वह खेत से आएगा, कहेगा, ‘तुरंत आकर भोजन के लिए टेक लगाकर बैठ जा[b]’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दास”; यूनानी शब्द ऐसे व्यक्ति को दर्शाता है जो अपने स्वामी के अधिकार में बँधा था, न कि केवल मज़दूरी पर रखा गया सेवक।
    reason: alternative_reading
  - marker: b
    text: 'प्राचीन काल में लोग भोजन करते समय गद्दों पर टेक लगाकर या अधलेटे होते थे। सरल अर्थ: “भोजन करने बैठ जा।”'
    reason: cultural_note
lexical_decisions:
- source_word: δοῦλον
  choice: ग़ुलाम
  rationale: यह शब्द किसी मज़दूरी पर रखे गए कामगार के बजाय स्वामी के अधिकार में बँधे व्यक्ति को दर्शाता है। इस दृष्टान्त में स्वामी और अधीन कामगार के बीच की असमान स्थिति महत्त्वपूर्ण है, इसलिए ‘ग़ुलाम’ उसके सामाजिक और आलंकारिक बल को ‘सेवक’ से अधिक स्पष्ट रखता है।
- source_word: ἀροτριῶντα
  choice: हल चलाते हुए
  rationale: यह कृषि के विशिष्ट काम, अर्थात् हल चलाने, को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιμαίνοντα
  choice: रेवड़ चराते हुए
  rationale: क्रिया का अर्थ चरवाहे का काम करना अथवा किसी झुंड की देखभाल करना है। ‘रेवड़ चराना’ हिन्दी में स्वाभाविक है और मूल में न बताए गए किसी खास पशु को निश्चित नहीं करता।
- source_word: εἰσελθόντι ἐκ τοῦ ἀγροῦ
  choice: उसके खेत से लौटने पर
  rationale: 'दत्तिव कृदन्त समय बताता है: स्वामी यह बात उस ग़ुलाम के खेत से भीतर आने के बाद कहता है। ‘लौटने पर’ हिन्दी में इस क्रम को संक्षेप और सहजता से व्यक्त करता है।'
- source_word: ἐρεῖ αὐτῷ
  choice: उससे ... कहेगा
  rationale: भविष्यकालीन यूनानी क्रिया और उसके अप्रत्यक्ष कर्म का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: Εὐθέως
  choice: तुरन्त
  rationale: यह बिना देर किए कार्य करने की आज्ञा को स्पष्ट रूप से व्यक्त करता है।
- source_word: παρελθὼν
  choice: आकर
  rationale: ἀνάπεσε के साथ यह कृदन्त आज्ञा के साथ जुड़ी गति को व्यक्त करता है; ‘आकर’ हिन्दी में उसी क्रम को सहज रूप देता है।
- source_word: ἀνάπεσε
  choice: भोजन के लिए टेक लगाकर बैठ जा
  rationale: यह क्रिया प्राचीन भोजन-प्रथा के अनुसार टेक लगाकर या अधलेटा होकर भोजन करने का स्थान ग्रहण करने को दर्शाती है। यह अनुवाद ऐतिहासिक मुद्रा को बनाए रखते हुए हिन्दी पाठक के लिए अर्थ स्पष्ट करता है।
theological_decisions:
- issue: दृष्टान्त के घरेलू परिवेश में δοῦλος का अनुवाद
  choice: ग़ुलाम
  alternative: दास; सेवक
  rationale: कथन का प्रभाव स्वामी और ग़ुलाम के असमान अधिकार-संबंध पर निर्भर है। ‘ग़ुलाम’ इस सामाजिक वास्तविकता को स्पष्ट रखता है, पर इससे बाद की कोई विशिष्ट धर्मवैज्ञानिक व्यवस्था निष्कर्षित नहीं की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण प्रश्न-वाक्य रखा गया है। ‘ग़ुलाम’ मूल सामाजिक संबंध का बल बनाए रखता है; ‘टेक लगाकर बैठना’ प्राचीन भोजन-मुद्रा को बिना अत्यधिक शाब्दिक या विचित्र बने व्यक्त करता है।
