  text: न ही लोग कहेंगे, ‘देखो, यहाँ है!’ या ‘वहाँ है!’ क्योंकि देखो, परमेश्वर का राज्य तुम्हारे बीच में है[a]।”
  philosophy: optimal-equivalence
  footnotes:
