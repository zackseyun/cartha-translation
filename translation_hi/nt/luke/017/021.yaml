    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲ ἐροῦσιν
  choice: और लोग यह नहीं कहेंगे
  rationale: οὐδὲ पिछले निषेध को आगे बढ़ाता है; हिन्दी में ‘और ... नहीं’ प्रसंगगत प्रवाह को स्वाभाविक ढंग से बनाए रखता है। ἐροῦσιν भविष्यकाल है।
- source_word: Ἰδοὺ ὧδε ἤ· Ἐκεῖ
  choice: ‘देखो, यहाँ है!’ या ‘वहाँ है!’
  rationale: ἰδού ध्यान खींचने वाला पद है और ὧδε/ἐκεῖ परस्पर विरोधी स्थानवाचक क्रियाविशेषण हैं। स्पष्ट हिन्दी के लिए निहित ‘है’ जोड़ा गया है।
- source_word: ἰδοὺ γὰρ
  choice: क्योंकि देखो
  rationale: γάρ पिछले कथन का कारण बताता है; दूसरा ἰδού कथन पर विशेष ध्यान दिलाता है। ‘क्योंकि देखो’ दोनों तत्वों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह पारदर्शी और प्रचलित हिन्दी रूप राजकीय शासन तथा राज्य—दोनों अर्थ-आयामों को खुला रखता है।
- source_word: ἐντὸς ὑμῶν
  choice: तुम्हारे बीच में
  rationale: बहुवचन ὑμῶν और स्थान-संबंधी प्रसंग में यह सामूहिक अर्थ स्वाभाविक है। फिर भी ‘तुम्हारे भीतर’ शाब्दिक रूप से संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: ἐστιν
  choice: है
  rationale: εἰμί के साधारण वर्तमानकाल का सीधा और पर्याप्त हिन्दी अनुवाद।
theological_decisions:
- issue: ἐντὸς ὑμῶν का अर्थ
  choice: परमेश्वर का राज्य तुम्हारे बीच में है
  alternative: परमेश्वर का राज्य तुम्हारे भीतर है
  rationale: यीशु बहुवचन श्रोताओं से बोल रहे हैं और निकट प्रसंग दिखाई देने वाले स्थान या चिह्न की बात करता है, इसलिए मुख्य पाठ में सामूहिक ‘बीच में’ को वरीयता दी गई है। किंतु आंतरिक अर्थ वास्तविक भाषिक संभावना है; उसे पादटिप्पणी में रखकर व्याख्यात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘देखो’ ἰδού को वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है; मुख्य पाठ में ‘तुम्हारे बीच में’ और पादटिप्पणी में ‘तुम्हारे भीतर’ रखकर मूल की वास्तविक अस्पष्टता बनाए रखी गई है।
