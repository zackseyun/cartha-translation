  text: μὴ ⸂ἔχει χάριν⸃ τῷ ⸀δούλῳ ὅτι ἐποίησεν τὰ ⸀διαταχθέντα;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/009.yaml
  text: Does he thank the servant because he did what was commanded?[a]
translation:
  language: hi
  text: क्या वह उस दास का धन्यवाद करता है क्योंकि उसने वही किया जो उसे करने की आज्ञा दी गई थी?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दास’ के लिए यूनानी शब्द ‘δοῦλος’ है; इसका अनुवाद ‘सेवक’, ‘गुलाम’ या ‘बंधुआ सेवक’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: μὴ
  choice: क्या ...?
  rationale: μή के साथ यह प्रश्न नकारात्मक उत्तर की अपेक्षा करता है। हिन्दी में प्रसंग-सम्मत सामान्य प्रश्नवाचक रचना इस अलंकारिक बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἔχει χάριν
  choice: धन्यवाद देता है
  rationale: ἔχειν χάριν τινί का अर्थ किसी के प्रति कृतज्ञ होना या उसे धन्यवाद देना है; यहाँ ‘धन्यवाद देता है’ संक्षिप्त और स्वाभाविक है।
- source_word: τῷ δούλῳ
  choice: उस दास को
  rationale: δοῦλος यहाँ स्वामी के अधिकार के अधीन और उसकी आज्ञा मानने के लिए बाध्य व्यक्ति को दर्शाता है। ‘दास’ इस सामाजिक असमानता को ‘सेवक’ से अधिक स्पष्ट रूप में बनाए रखता है।
- source_word: ὅτι
  choice: इसलिए ... कि
  rationale: ὅτι कथित धन्यवाद का कारण प्रस्तुत करता है। हिन्दी की ‘इसलिए ... कि’ रचना कारण-संबंध को सहज ढंग से व्यक्त करती है।
- source_word: ἐποίησεν τὰ διαταχθέντα
  choice: उसने वे काम किए जिनकी उसे आज्ञा दी गई थी
  rationale: यह अनुवाद क्रिया के सामान्य अर्थ तथा पूर्ण निष्क्रिय कृदंत के भाव—पहले दी जा चुकी आज्ञा—दोनों को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: स्वामी-दास के दृष्टान्त में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक; गुलाम; बंधुआ सेवक
  rationale: पद का तर्क इस बात पर निर्भर है कि वह व्यक्ति स्वामी की आज्ञा के अधीन है और आदेश का पालन उसका दायित्व है। ‘दास’ इस अधीनता को बनाए रखता है, जबकि पाद-टिप्पणी सम्भव विकल्प बताती है।
- issue: अलंकारिक प्रश्न में अपेक्षित उत्तर
  choice: सामान्य प्रश्नवाचक वाक्य, जिसका प्रसंगानुसार उत्तर ‘नहीं’ है
  alternative: वह दास को धन्यवाद तो नहीं देता, है न?
  rationale: μή नकारात्मक उत्तर की अपेक्षा का संकेत देता है, पर मूल पाठ सीधे उत्तर नहीं देता। सामान्य हिन्दी प्रश्न अस्पष्टता और अलंकारिक तनाव को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दास’ पद दृष्टान्त की सामाजिक और अधिकारगत असमानता को सुरक्षित रखता है; प्रश्न में निहित अपेक्षित नकारात्मक उत्तर को अनुवाद में स्पष्ट उत्तर बनाकर नहीं जोड़ा गया।
