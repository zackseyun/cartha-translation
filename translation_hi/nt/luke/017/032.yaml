    reason: cross_reference
lexical_decisions:
- source_word: μνημονεύετε
  choice: याद रखो
  rationale: यह वर्तमान काल का कर्तृवाच्य आज्ञार्थक, द्वितीय पुरुष बहुवचन रूप है। ‘याद रखो’ सीधी और स्वाभाविक हिन्दी आज्ञा है, जो केवल किसी बात को स्मरण कर लेने के बजाय उसे चेतावनी के रूप में मन में बनाए रखने का भाव भी व्यक्त करती है।
- source_word: τῆς γυναικὸς
  choice: पत्नी को
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; पर Λώτ के संबंधसूचक प्रयोग के साथ यहाँ वैवाहिक संबंध स्पष्ट है। यूनानी में μνημονεύω के साथ संबंधकारक है, जबकि स्वाभाविक हिन्दी में ‘याद रखना’ का कर्म ‘को’ के साथ आता है।
- source_word: Λώτ
  choice: लूत
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप ‘लूत’ में रखा गया है।
theological_decisions:
- issue: चेतावनी के रूप में उत्पत्ति-वृत्तांत की ओर संकेत
  choice: संक्षिप्त और सीधी आज्ञा—‘लूत की पत्नी को याद रखो।’
  alternative: ‘लूत की पत्नी का स्मरण करो।’
  rationale: मूल वाक्य यीशु की संक्षिप्त चेतावनी को बिना व्याख्या जोड़े प्रस्तुत करता है और उत्पत्ति 19:26 की घटना की ओर संकेत करता है। ‘याद रखो’ आधुनिक हिन्दी में ‘स्मरण करो’ से अधिक सहज है और चेतावनी का बल बनाए रखता है।
translation_notes:
  register: भाषा संक्षिप्त, सीधी, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। बहुवचन आज्ञा का आशय हिन्दी के ‘याद रखो’ में स्वाभाविक रूप से बना रहता है।
