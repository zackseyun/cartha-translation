    reason: lexical_alternative
lexical_decisions:
- source_word: ἐροῦσιν
  choice: वे तुमसे कहेंगे
  rationale: भविष्यकालीन क्रिया और प्रत्यक्ष कथन की भूमिका को सहज हिंदी में बनाए रखता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचने वाला शब्द है; ‘देखो’ आधुनिक, स्वाभाविक और संक्षिप्त है।
- source_word: ἐκεῖ / ὧδε
  choice: वहाँ / यहाँ
  rationale: दोनों स्थानवाचक शब्दों के स्पष्ट और संक्षिप्त विरोध को सुरक्षित रखता है।
- source_word: μὴ ἀπέλθητε
  choice: तुम चले मत जाना
  rationale: ἀπέρχομαι के वहाँ से निकल जाने या किसी बताई हुई जगह की ओर चले जाने के भाव को स्वाभाविक निषेध के रूप में व्यक्त करता है।
- source_word: μηδὲ διώξητε
  choice: और न उनके पीछे दौड़ना
  rationale: διώκω के पीछा करने के भाव को बोलचाल की स्पष्ट हिंदी में व्यक्त करता है; ‘उनके’ को हिंदी की सहजता के लिए जोड़ा गया है, जबकि यूनानी में कर्म अनकहा है।
theological_decisions:
- issue: διώξητε के अनकहे कर्म को स्पष्ट करना
  choice: ‘उनके पीछे दौड़ना’—दावा करने वालों को संभावित संदर्भ मानते हुए
  alternative: ‘और न पीछा करना’—कर्म को पूरी तरह अनकहा रखना
  rationale: मूल यूनानी कर्म नहीं बताता। मुख्य पाठ में स्वाभाविक हिंदी के लिए ‘उनके’ दिया गया है, पर पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है और इसे किसी निश्चित अंत-समय संबंधी पहचान तक सीमित नहीं करती।
- issue: Ἰδοὺ ἐκεῖ· Ἰδοὺ ὧδε में क्रिया का अभाव
  choice: “देखो, वहाँ!” / “देखो, यहाँ!”
  alternative: “देखो, वह वहाँ है!” / “देखो, वह यहाँ है!”
  rationale: मूल में ‘वह है’ जैसा स्पष्ट कर्ता और क्रिया नहीं है। संक्षिप्त रूप स्थानसूचक पुकार की तीव्रता और वास्तविक अस्पष्टता दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सीधी चेतावनी के लिए सहज किंतु गरिमापूर्ण भाषा। ‘देखो, वहाँ/यहाँ’ की संक्षिप्तता मूल की आकस्मिक पुकार को बनाए रखती है।
