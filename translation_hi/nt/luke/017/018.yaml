    issue: The verbal phrase ‘लौटकर परमेश्वर की महिमा करता’ does not clearly express the completed return and purpose infinitive.
    rationale: ὑποστρέψαντες δοῦναι means ‘having returned to give glory.’ The present-style ‘करता’ can suggest ongoing action rather than the past action under discussion. ‘लौटकर परमेश्वर को महिमा देने आया हो’ expresses both return and purpose naturally.
