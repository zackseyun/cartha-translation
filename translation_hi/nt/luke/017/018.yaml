lexical_decisions:
- source_word: εὑρέθησαν
  choice: और कोई नहीं मिला
  rationale: यूनानी अओरिस्ट कर्मवाच्य को स्वाभाविक हिन्दी के अस्तित्वसूचक प्रश्न में व्यक्त किया गया है; इससे मूल का आलंकारिक प्रश्न बना रहता है।
- source_word: ὑποστρέψαντες
  choice: लौटकर
  rationale: कृदन्त पूर्ववर्ती क्रिया को दर्शाता है—वह लौट आया और तब परमेश्वर की महिमा की; ‘लौटकर’ आधुनिक हिन्दी में सहज है।
- source_word: δοῦναι δόξαν
  choice: महिमा करता
  rationale: शाब्दिक मुहावरे ‘महिमा देना’ का आशय हिन्दी में स्वाभाविक रूप से ‘महिमा करना’ से व्यक्त होता है और बाइबिलीय धार्मिक अर्थ सुरक्षित रहता है।
- source_word: τῷ θεῷ
  choice: परमेश्वर की
  rationale: हिन्दी मुहावरे ‘परमेश्वर की महिमा करना’ में संबंधकारक प्रयोग स्वाभाविक रूप से यूनानी सम्प्रदान का अर्थ देता है।
- source_word: εἰ μὴ
  choice: के सिवा
  rationale: यह बहिष्कारी संरचना है; ‘के सिवा’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἀλλογενής
  choice: परदेशी
  rationale: यह शब्द दूसरे जनसमूह या जाति के व्यक्ति, अर्थात इस्राएल के बाहरी व्यक्ति, को सूचित करता है। ‘परदेशी’ आधुनिक हिन्दी में गरिमापूर्ण है और केवल अपरिचित व्यक्ति का अर्थ नहीं देता।
- source_word: οὗτος
  choice: इस
  rationale: संकेतवाचक सर्वनाम का बल ‘इस परदेशी’ में सुरक्षित रखा गया है।
theological_decisions:
- issue: चंगे हुए व्यक्ति की जातीय और धार्मिक बाहरी स्थिति
  choice: इस परदेशी
  alternative: इस दूसरी जाति के व्यक्ति / इस अजनबी
  rationale: सन्दर्भ की विडम्बना यह है कि परमेश्वर का आदर करने लौटने वाला व्यक्ति इस्राएल के समुदाय से बाहर था। ‘परदेशी’ इस विरोध को बनाए रखता है, पर पद में ‘सामरी’ शब्द स्पष्ट रूप से नहीं जोड़ता।
