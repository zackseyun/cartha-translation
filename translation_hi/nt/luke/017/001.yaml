  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητὰς ⸀αὐτοῦ· Ἀνένδεκτόν ἐστιν τοῦ ⸂τὰ σκάνδαλα μὴ ἐλθεῖν⸃, ⸂πλὴν οὐαὶ⸃ δι’ οὗ ἔρχεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/001.yaml
  text: Then he said to his disciples[a], “It is impossible for stumbling blocks not to come, but woe to the one through whom they come.”
translation:
  language: hi
  text: फिर उसने अपने चेलों से कहा, “ठोकर के अवसरों[a] का आना न हो, यह असंभव है; परन्तु धिक्कार है उस व्यक्ति पर, जिसके द्वारा वे आते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ठोकर के अवसरों’ का अनुवाद ‘अपराध’, ‘पाप में गिराने वाली बातें’, या ‘पाप के प्रलोभन’ भी हो सकता है। यूनानी शब्द उन बातों या परिस्थितियों का संकेत करता है जो किसी को नैतिक या आत्मिक रूप से ठोकर खाने या गिरने का कारण बनें।
    reason: lexical_alternative
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: फिर उसने कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘फिर’ स्वाभाविक प्रवाह देता है, बिना प्रबल विरोध दिखाए।
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: अपने चेलों से
  rationale: αὐτοῦ को ‘अपने’ से व्यक्त किया गया है। ‘चेले’ आधुनिक हिन्दी में यीशु के μαθηταί के लिए सहज और प्रचलित है।
- source_word: Ἀνένδεκτόν ἐστιν
  choice: असंभव है
  rationale: यह यूनानी अभिव्यक्ति असंभवता बताती है; आगे का नकारात्मक क्रियारूप स्पष्ट करता है कि इन कारणों का न आना असंभव है।
- source_word: τοῦ τὰ σκάνδαλα μὴ ἐλθεῖν
  choice: ठोकर के कारणों का न आना
  rationale: यह रचना मूल के नकारात्मक भाव और σκάνδαλα की ठोकर वाली मूर्त उपमा, दोनों को बनाए रखती है।
- source_word: σκάνδαλα
  choice: ठोकर के कारण
  rationale: यह चयन उन बातों या परिस्थितियों की व्यापक धारणा रखता है जो किसी को नैतिक या आत्मिक पतन की ओर ले जाएँ; केवल मन दुखाने या केवल प्रलोभन तक अर्थ को सीमित नहीं करता।
- source_word: πλὴν οὐαὶ
  choice: फिर भी हाय
  rationale: πλήν अनिवार्यता के कथन से व्यक्तिगत उत्तरदायित्व और धिक्कार की ओर तीखा मोड़ लाता है; ‘फिर भी’ उस तनाव को स्पष्ट रखता है।
- source_word: δι’ οὗ
  choice: उस व्यक्ति पर, जिसके द्वारा
  rationale: पुल्लिंग एकवचन संबंधवाचक रूप व्यक्ति की ओर संकेत करता है। ‘उस व्यक्ति’ प्रतिनिधिक एकवचन को स्वाभाविक हिन्दी में रखता है।
- source_word: ἔρχεται
  choice: वे आते हैं
  rationale: यूनानी क्रिया एकवचन है, पर उसका वैचारिक संबंध बहुवचन σκάνδαλα से है; हिन्दी में ‘वे आते हैं’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: नैतिक शिक्षा में σκάνδαλα का अर्थ
  choice: मुख्य पाठ में ‘ठोकर के कारण’
  alternative: ‘पाप में गिराने वाली बातें’, ‘अपराध’, या ‘पाप के प्रलोभन’
  rationale: 'यह उपमा और अर्थ की व्यापकता बचाता है: ऐसी बातें जो किसी को नैतिक या आत्मिक रूप से गिरा सकती हैं। यह समय से पहले तय नहीं करता कि जोर प्रलोभन, फंदे या पतन के अवसर पर है।'
- issue: अनिवार्यता और मानवीय उत्तरदायित्व का तनाव
  choice: ‘असंभव है; फिर भी हाय’
  alternative: ‘उनका आना अवश्यंभावी है, परन्तु हाय’
  rationale: मूल पाठ एक ओर σκάνδαλα के न आने की असंभवता और दूसरी ओर उन्हें लाने वाले पर धिक्कार—दोनों को साथ रखता है। अनुवाद इस तनाव को हल नहीं करता।
- issue: δι’ οὗ में प्रतिनिधिक एकवचन
  choice: ‘उस व्यक्ति पर, जिसके द्वारा’
  alternative: ‘उस पर, जिसके द्वारा’
  rationale: यह व्यक्तिगत उत्तरदायित्व को स्पष्ट रखते हुए मूल के एकवचन संबंध को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ठोकर के कारण’ मूल रूपक को बचाता है; पादटिप्पणी उसके नैतिक और आत्मिक आशय को स्पष्ट करती है।
