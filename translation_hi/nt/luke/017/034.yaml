  text: λέγω ὑμῖν, ταύτῃ τῇ νυκτὶ ἔσονται δύο ἐπὶ κλίνης μιᾶς, ⸀ὁ εἷς παραλημφθήσεται καὶ ὁ ἕτερος ἀφεθήσεται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/034.yaml
  text: I tell you[a], on that night there will be two on one bed; one will be taken[b], and the other will be left.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, उस रात दो लोग एक बिस्तर पर होंगे; एक को ले लिया जाएगा[a], और दूसरे को छोड़ दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने साथ ले लिया जाएगा’; παραλημφθήσεται यहाँ अपने आप यह स्पष्ट नहीं करता कि यह ले जाना उद्धार के लिए है या न्याय के लिए।
    reason: lexical_alternative
  - marker: b
    text: या ‘पीछे छोड़ दिया जाएगा’; मुख्य पाठ में संक्षिप्त ‘छोड़ दिया जाएगा’ रखा गया है, ताकि यूनानी में स्पष्ट न होने वाली बाद की युगांत-संबंधी धारणाएँ इसमें न जोड़ी जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह सीधे और बलपूर्वक संबोधन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ταύτῃ τῇ νυκτί
  choice: उस रात
  rationale: कालवाचक दत्तिव और संकेतवाचक पद किसी विशेष, संदर्भित रात की ओर संकेत करते हैं।
- source_word: ἔσονται δύο
  choice: दो जन ... होंगे
  rationale: भविष्यकाल और दो व्यक्तियों का उल्लेख स्पष्ट रखते हुए यह हिन्दी में स्वाभाविक है।
- source_word: ἐπὶ κλίνης μιᾶς
  choice: एक ही बिस्तर पर
  rationale: रात के संदर्भ में κλίνη के लिए ‘बिस्तर’ उपयुक्त है; ‘एक ही’ साझा बिस्तर पर बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: παραλημφθήσεται
  choice: ले लिया जाएगा
  rationale: भविष्यत् कर्मवाच्य को बनाए रखता है और अपने आप यह निर्धारित नहीं करता कि ले जाना उद्धार के लिए है या न्याय के लिए।
- source_word: ὁ ἕτερος
  choice: दूसरे को
  rationale: दो व्यक्तियों के बीच स्पष्ट विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀφεθήσεται
  choice: छोड़ दिया जाएगा
  rationale: यहाँ παραλημφθήσεται के विरोध में अर्थ ‘छोड़ना’ है; यह अनुवाद ‘पीछे’ जोड़कर बाद की युगांत-संबंधी धारणाएँ पाठ में नहीं लाता।
theological_decisions:
- issue: ले लिए जाने और छोड़ दिए जाने का उद्धार या न्याय से संबंध
  choice: 'मुख्य पाठ तटस्थ रखा गया है: एक को ले लिया जाएगा और दूसरे को छोड़ दिया जाएगा।'
  alternative: ले लिया जाना उद्धार को दर्शाता है; अथवा ले लिया जाना न्याय को दर्शाता है।
  rationale: इस पद में प्रयुक्त यूनानी क्रियाएँ स्वयं यह तय नहीं करतीं कि किस व्यक्ति का परिणाम उद्धार है और किसका न्याय; इसलिए मूल पाठ की धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दो जन’ व्यक्तियों का बोध कराता है, जबकि कर्मवाच्य रचना मूल यूनानी के रूप और उसकी अस्पष्टता को सुरक्षित रखती है।
