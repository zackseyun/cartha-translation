id: LUK.17.26
reference: Luke 17:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ καθὼς ἐγένετο ἐν ταῖς ἡμέραις Νῶε, οὕτως ἔσται καὶ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/026.yaml
  text: And just as it happened in the days of Noah[a], so it will be also in the days of the Son of Man.
translation:
  language: hi
  text: और जैसा नूह के दिनों में हुआ था, वैसा ही मनुष्य के पुत्र[a] के दिनों में भी होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मानव-पुत्र।” यूनानी पदनाम का पारंपरिक अनुवाद “मनुष्य का पुत्र” है। संभवतः यह दानिय्येल 7 की प्रतिध्वनि है और यहाँ इसकी स्थापित मसीही तथा अंत-कालीन अर्थ-छाया को बनाए रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καθὼς
  choice: जैसा
  rationale: यह तुलना आरम्भ करता है; ‘जैसा…वैसा ही’ हिन्दी में यूनानी तुलनात्मक रचना को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: ἐγένετο
  choice: हुआ था
  rationale: यह नूह के समय घटित परिस्थिति की ओर संकेत करता है। भूतकालीन संदर्भ को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘हुआ था’ उपयुक्त है।
- source_word: ἐν ταῖς ἡμέραις Νῶε
  choice: नूह के दिनों में
  rationale: यह निकट, प्रचलित और स्वाभाविक काल-सूचक अभिव्यक्ति है; नाम Νῶε को हिन्दी के स्थापित रूप ‘नूह’ में लिप्यंतरित किया गया है।
- source_word: οὕτως
  choice: वैसा ही
  rationale: यह καθὼς के साथ तुलना का उत्तरपक्ष बनाता है; ‘जैसा…वैसा ही’ यूनानी संरचना के बल को बनाए रखता है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकालीन अस्तित्व अथवा परिस्थिति को बिना अतिरिक्त व्याख्या जोड़े सीधे व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: दूसरा καί दोनों कालों के बीच समानता को आगे बढ़ाता है; हिन्दी में ‘भी’ इस अर्थ को स्वाभाविक रूप से रखता है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: यह सुसमाचारों में यीशु का स्थापित पदनाम है। विभक्ति-संगति के कारण यहाँ ‘मनुष्य का पुत्र’ का रूप ‘मनुष्य के पुत्र’ हुआ है; इससे शाब्दिक रूप और दानिय्येल 7 से जुड़ी मसीही तथा प्रलय-संबंधी प्रतिध्वनि बनी रहती है।
theological_decisions:
- issue: τοῦ υἱοῦ τοῦ ἀνθρώπου पदनाम का अनुवाद
  choice: मनुष्य के पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ हिन्दी में स्थापित मसीही पदनाम है और यूनानी वाक्यांश के संबंधसूचक रूप को निकटता से सुरक्षित रखता है। ‘मानव-पुत्र’ अधिक संक्षिप्त है, पर स्थापित धर्मवैचारिक और शास्त्रीय प्रतिध्वनि को कुछ हद तक बदल सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जैसा…वैसा ही’ तुलना को स्पष्ट बनाता है, जबकि ‘के दिनों में’ मूल की काल-सूचक अभिव्यक्ति को बनाए रखता है। पाद-टिप्पणी का चिह्न संबंधित पदनाम ‘मनुष्य के पुत्र’ के तुरंत बाद रखा गया है।
