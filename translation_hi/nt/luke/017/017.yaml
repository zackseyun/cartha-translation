  text: Then Jesus answered[a], “Were not the ten cleansed? But where are the nine?”
translation:
  language: hi
  text: तब यीशु ने उत्तर दिया, “क्या वे दसों शुद्ध नहीं हुए थे? पर वे नौ कहाँ हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ὁ Ἰησοῦς εἶπεν
  choice: तब यीशु ने कहा
  rationale: यह यूनानी कथन-सूत्र उत्तर अथवा प्रसंगानुकूल प्रतिक्रिया देते हुए बोलने को दर्शाता है। हिंदी में ‘तब यीशु ने कहा’ स्वाभाविक है और ‘उत्तर देकर कहा’ जैसी अनावश्यक पुनरुक्ति से बचता है।
- source_word: Οὐχὶ
  choice: क्या ... नहीं
  rationale: οὐχί ऐसा आलंकारिक प्रश्न आरंभ करता है जिसमें हाँ की अपेक्षा है; ‘क्या ... नहीं’ हिंदी में यही बल बनाए रखता है।
- source_word: οἱ δέκα
  choice: वे दसों
  rationale: संज्ञा-सूचक लेख के साथ संख्या पहले से ज्ञात दस व्यक्तियों की ओर संकेत करती है। ‘वे दसों’ पूरे परिचित समूह को स्वाभाविक हिंदी में दर्शाता है।
- source_word: ἐκαθαρίσθησαν
  choice: शुद्ध नहीं किए गए
  rationale: καθαρίζω का कर्मवाच्य रूप ‘शुद्ध करना’ है। कोढ़ के प्रसंग में इसमें शारीरिक बहाली और धार्मिक शुद्धता दोनों की प्रतिध्वनि बनी रहती है; केवल ‘चंगे’ कहना अर्थ को संकुचित कर देता।
- source_word: οἱ δὲ ἐννέα ποῦ
  choice: फिर वे नौ कहाँ हैं?
  rationale: यहाँ δέ लौटे हुए एक व्यक्ति और शेष नौ के बीच विरोध को आगे बढ़ाता है। ‘फिर’ हिंदी में प्रश्न के निष्कर्षात्मक तथा विरोधात्मक भाव को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: कोढ़ से जुड़े प्रसंग में καθαρίζω का अर्थ
  choice: ‘शुद्ध किए गए’
  alternative: ‘चंगे किए गए’ अथवा ‘साफ किए गए’
  rationale: ‘शुद्ध’ यूनानी क्रिया के धार्मिक और शारीरिक दोनों आयाम सुरक्षित रखता है, जबकि ‘चंगे’ इसे केवल रोगमुक्ति तक सीमित कर सकता है और ‘साफ’ आधुनिक हिंदी में बाहरी सफाई का आभास दे सकता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। आलंकारिक प्रश्न का अपेक्षित सकारात्मक उत्तर और लौटे हुए व्यक्ति के विपरीत नौ की अनुपस्थिति स्पष्ट रखी गई है।
