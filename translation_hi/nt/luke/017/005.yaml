reference: Luke 17:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ εἶπαν οἱ ἀπόστολοι τῷ κυρίῳ· Πρόσθες ἡμῖν πίστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/005.yaml
  text: And the apostles said to the Lord[b][a], “Increase our faith.”
translation:
  language: hi
  text: और प्रेरितों ने प्रभु से कहा, “हमारा विश्वास बढ़ा।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हममें विश्वास जोड़।” यहाँ इसका भाव विश्वास को बढ़ाना है।
    reason: lexical_alternative
  - marker: b
    text: “विश्वास” का अर्थ “भरोसा” भी हो सकता है; कुछ संदर्भों में यह शब्द “निष्ठा” भी दर्शाता है, पर यहाँ यह अर्थ कम संभावित है।
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य कथात्मक संयोजक है; ‘और’ यूनानी के सरल संबंध को बिना अतिरिक्त कालगत अर्थ जोड़े बनाए रखता है।
- source_word: εἶπαν
  choice: कहा
  rationale: एओरिस्ट सूचक क्रिया को सरल भूतकालीन कथन के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: οἱ ἀπόστολοι
  choice: प्रेरितों
  rationale: लूका-प्रेरितों के काम में यीशु द्वारा भेजे गए विशेष शिष्य-समूह के लिए ‘प्रेरित’ स्थापित और सटीक हिन्दी पद है।
- source_word: τῷ κυρίῳ
  choice: प्रभु से
  rationale: κύριος के सम्मानसूचक और मसीह-संबंधी दोनों अर्थ-संकेतों को ‘प्रभु’ सुरक्षित रखता है; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: Πρόσθες
  choice: बढ़ा
  rationale: क्रिया का मूल अर्थ ‘जोड़’ है, पर πίστιν के साथ यहाँ भाव विश्वास की मात्रा बढ़ाने का है; आज्ञार्थक एकवचन को ‘बढ़ा’ व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमारा
  rationale: यूनानी में शाब्दिक रूप से ‘हमको/हमारे लिए’ है, पर हिन्दी में ‘हमारा विश्वास बढ़ा’ इस संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: इस संदर्भ में प्रेरित अपने विश्वास या भरोसे की वृद्धि माँगते हैं; ‘विश्वास’ व्यापक और स्थापित हिन्दी रूप है।
theological_decisions:
- issue: यीशु के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ संबोधन के सम्मान और लूका में उसके मसीह-संबंधी भार, दोनों को बनाए रखता है; ‘स्वामी’ उस व्यापक अनुगूँज को कुछ सीमित कर सकता है।
- issue: πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; निष्ठा
  rationale: यहाँ माँगी गई वस्तु सबसे स्वाभाविक रूप से परमेश्वर पर विश्वास/भरोसा है। ‘निष्ठा’ शब्द की अर्थ-सीमा में आता है, पर इस प्रसंग में कम संभावित है; इसलिए विकल्प टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज कथात्मक शैली। मुख्य पाठ में स्वाभाविक हिन्दी वाक्य-विन्यास रखा गया है, जबकि यूनानी की शाब्दिक रचना और πίστις की अर्थ-सीमा पादटिप्पणियों में सुरक्षित की गई है।
