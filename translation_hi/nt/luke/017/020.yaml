source:
  edition: SBLGNT
  text: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων πότε ἔρχεται ἡ βασιλεία τοῦ θεοῦ ἀπεκρίθη αὐτοῖς καὶ εἶπεν· Οὐκ ἔρχεται ἡ βασιλεία τοῦ θεοῦ μετὰ παρατηρήσεως,
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/020.yaml
  text: When he was asked by the Pharisees when the kingdom of God was coming[a], he answered them and said, “The kingdom of God does not come with observable signs,”
translation:
  language: hi
  text: जब फरीसियों ने उनसे पूछा कि परमेश्वर का राज्य कब आएगा, तो उन्होंने उन्हें उत्तर दिया, “परमेश्वर का राज्य इस तरह नहीं आता कि उसके आने को देखकर पहचाना जा सके[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देखने-परखने के साथ,” “ऐसे ढंग से कि उसे देखा जा सके,” या “ध्यानपूर्वक देखने पर।”
    reason: παρατήρησις के अर्थ-क्षेत्र में निरीक्षण, ध्यानपूर्वक देखना और निगरानी करना सम्मिलित हैं; हिन्दी में एक ही अभिव्यक्ति इन सभी संभावनाओं को पूर्णतः नहीं समेटती।
lexical_decisions:
- source_word: Ἐπερωτηθεὶς δὲ ὑπὸ τῶν Φαρισαίων
  choice: जब फरीसियों ने उनसे पूछा
  rationale: कर्मवाच्य कृदंत का अर्थ स्वाभाविक हिन्दी कालवाचक उपवाक्य में व्यक्त किया गया है। δέ का हल्का संक्रमण ‘तो’ से अगले मुख्य वाक्य में प्रकट होता है; अनावश्यक ‘अब’ नहीं जोड़ा गया।
- source_word: πότε ἔρχεται
  choice: कब आ रहा है
  rationale: वर्तमानकालीन क्रिया के आगमन-संबंधी, भविष्याभिमुख भाव को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: नए नियम की इस प्रमुख अभिव्यक्ति का पारदर्शी और प्रचलित हिन्दी रूप।
- source_word: ἀπεκρίθη αὐτοῖς καὶ εἶπεν
  choice: उन्होंने उन्हें उत्तर दिया
  rationale: यूनानी के दोहरे कथन-प्रयोग का आशय स्वाभाविक हिन्दी में दिया गया है; ‘उत्तर देकर कहा’ भी संभव है, पर यहाँ अनावश्यक पुनरुक्ति से बचा गया है।
- source_word: Οὐκ ἔρχεται
  choice: नहीं आता
  rationale: राज्य के आने के ढंग के विषय में वर्तमानकालीन सामान्य कथन को बनाए रखता है।
- source_word: μετὰ παρατηρήσεως
  choice: इस तरह नहीं आता कि उसे देखकर उसका पता लगाया जा सके
  rationale: παρατήρησις में निहित देखने, निगरानी करने या सावधानी से निरीक्षण करके पहचानने के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह निश्चित किए कि संज्ञा का अर्थ केवल ‘चिह्न’ है।
theological_decisions:
- issue: परमेश्वर के राज्य के आने के विषय में यीशु के निषेध का अर्थ
  choice: राज्य ऐसे ढंग से नहीं आता कि बाहरी निरीक्षण के द्वारा उसके आगमन का पता लगाया जा सके।
  alternative: यीशु हर प्रकार के अंतकालीन चिह्न या हर प्रकार की मानवीय अनुभूति का पूर्ण निषेध कर रहे हैं।
  rationale: μετὰ παρατηρήσεως मुख्यतः देखने, निगरानी रखने या सावधानी से निरीक्षण करने योग्य ढंग की ओर संकेत करता है। अनुवाद इस पद से आगे बढ़कर सभी चिह्नों का निषेध या किसी पूर्ण विकसित युगांत-विषयक मत का समर्थन नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परमेश्वर का राज्य’ पारंपरिक रूप से पहचानी जाने वाली अभिव्यक्ति है। मुख्य पाठ में ‘प्रत्यक्ष चिह्न’ जोड़ने के बजाय मूल यूनानी की शाब्दिक अनिश्चितता को कुछ अधिक सुरक्षित रखा गया है।
