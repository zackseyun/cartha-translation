  text: προσέχετε ἑαυτοῖς. ἐὰν ⸀ἁμάρτῃ ὁ ἀδελφός σου ἐπιτίμησον αὐτῷ, καὶ ἐὰν μετανοήσῃ ἄφες αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/003.yaml
  text: Pay attention to yourselves[a]. If your brother sins, rebuke him, and if he repents[b], forgive him.
translation:
  language: hi
  text: अपनी चौकसी करते रहो। यदि तुम्हारा भाई पाप करे[a], तो उसे डाँटो; और यदि वह मन फिराए, तो उसे क्षमा कर दो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में है, “यदि तुम्हारा भाई तुम्हारे विरुद्ध पाप करे, तो उसे डाँटो।”
    reason: textual_variant
  - marker: b
    text: यूनानी में “भाई” पुल्लिंग एकवचन है और यहाँ इसका संकेत अधिक व्यापक रूप से किसी सहशिष्य की ओर हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε ἑαυτοῖς
  choice: अपने विषय में सावधान रहो
  rationale: वर्तमानकालीन आज्ञार्थक निरंतर सजगता का आह्वान करता है। यह अभिव्यक्ति आत्म-सावधानी का भाव रखती है और व्यक्तिगत तथा सामुदायिक, दोनों संदर्भों के लिए खुली रहती है।
- source_word: ἁμάρτῃ
  choice: पाप करे
  rationale: SBLGNT के संक्षिप्त पाठ में ‘तुम्हारे विरुद्ध’ जैसा कोई कर्म नहीं है; इसलिए अनुवाद व्यापक अर्थ को बनाए रखता है।
- source_word: ὁ ἀδελφός σου
  choice: तुम्हारा भाई
  rationale: यूनानी पद पुल्लिंग एकवचन है। स्रोत की व्याकरणिक आकृति रखी गई है, जबकि संभावित व्यापक शिष्य-सामुदायिक अर्थ को पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἐπιτίμησον αὐτῷ
  choice: उसे डाँटो
  rationale: यह सीधी और गंभीर मौखिक सुधार की आज्ञा है। ‘डाँटो’ सामान्य आधुनिक हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: μετανοήσῃ
  choice: मन फिराए
  rationale: यह नैतिक और संबंधपरक परिवर्तन का भाव व्यक्त करता है और केवल बौद्धिक मत-परिवर्तन तक सीमित नहीं है।
- source_word: ἄφες αὐτῷ
  choice: उसे क्षमा कर दो
  rationale: पारस्परिक संबंध के इस संदर्भ में ἀφίημι का स्वाभाविक अर्थ क्षमा करना है; ‘कर दो’ आज्ञा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ‘पाप करे’ के बाद ‘तुम्हारे विरुद्ध’ जोड़ा जाए
  choice: मुख्य पाठ में ‘तुम्हारे विरुद्ध’ न जोड़ना
  alternative: यदि तुम्हारा भाई तुम्हारे विरुद्ध पाप करे
  rationale: प्रदत्त SBLGNT पाठ में εἰς σέ अथवा उसका कोई समानार्थी पद नहीं है। व्यापक संक्षिप्त पाठ मुख्य अनुवाद में रखा गया है और दीर्घ पाठ को पाठांतर की पाद-टिप्पणी में दिया गया है।
- issue: ἀδελφός का लैंगिक और सामुदायिक अर्थ
  choice: तुम्हारा भाई
  alternative: तुम्हारा भाई या बहन / तुम्हारा सहविश्वासी
  rationale: यूनानी शब्द व्याकरणतः पुल्लिंग एकवचन है। मुख्य पाठ स्रोत के रूप को बनाए रखता है; यह किसी सहशिष्य को व्यापक रूप से सूचित कर सकता है, जिसे पाद-टिप्पणी में बताया गया है।
- issue: μετανοέω का अनुवाद
  choice: मन फिराए
  alternative: पश्चाताप करे
  rationale: ‘मन फिराना’ दिशा और आचरण के परिवर्तन को व्यक्त करता है तथा क्षमा से जुड़े संबंधपरक तनाव को बनाए रखता है; यह केवल भावना या खेद तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, स्पष्ट और गरिमापूर्ण शैली। ‘सावधान रहो’, ‘डाँटो’ और ‘क्षमा कर दो’ साधारण पाठक के लिए सीधे हैं, जबकि स्रोत के आज्ञात्मक बल को बनाए रखते हैं। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं; [a] संबंधित पाठांतर के ठीक बाद और [b] पद के अंत में व्यापक सामुदायिक अर्थ के लिए रखा गया है।
