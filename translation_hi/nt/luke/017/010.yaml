revisions:
- from: इसी प्रकार तुम भी, जब वह सब कर चुको जिसकी तुम्हें आज्ञा दी गई है, तो कहो, ‘हम अयोग्य दास हैं[a]; जिसे करने के लिए हम बाध्य थे, हमने वही किया है[b]।’
  to: इसी प्रकार तुम भी, जब वह सब कर चुको जिसकी तुम्हें आज्ञा दी गई है, तो कहो, ‘हम अनुपयोगी दास हैं[a]; जो करना हमारा दायित्व था, हमने वही किया है[b]।’
  rationale: The revision replaces a misleading Hindi adjective with one that better reflects the lexical range of ἀχρεῖοι, while retaining an alternative and the contextual sense in a footnote. It also makes the final obligation clause more natural in modern standard Hindi without adding ‘केवल’ or any doctrinal inference.
