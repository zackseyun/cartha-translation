review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the conditional-completed action, the comprehensive scope of what was commanded, the imperative to speak, the slave/master imagery, and the concluding assertion that the speakers have done what they were obligated to do. However, ‘अयोग्य’ normally means ‘not qualified’ or ‘incompetent’ in modern Hindi and does not adequately convey ἀχρεῖοι (‘unprofitable/useless,’ with the contextual implication of having no claim on the master).
  naturalness: The sentence is generally fluent and appropriately dignified. Recasting the final relative clause as ‘जो करना हमारा दायित्व था’ is more idiomatic Hindi than ‘जिसे करने के लिए हम बाध्य थे,’ while retaining the sense of obligation.
  terminology: ‘दास’ appropriately preserves δοῦλοι in this master-slave illustration. ‘अनुपयोगी’ is a formal but natural enough modern-Hindi rendering of ἀχρεῖοι and is semantically safer than ‘अयोग्य.’ The footnote supplies the more idiomatic and stronger alternative ‘निकम्मे’ and explains the contextual implication without making it part of the text.
  issues:
  - severity: medium
    issue: ‘अयोग्य दास’ is not an accurate primary rendering of ἀχρεῖοι.
    rationale: In current standard Hindi, अयोग्य chiefly denotes someone unqualified or incapable. The Greek adjective denotes being unprofitable/useless; in context it supports the point that obedience gives no claim to special reward. ‘अनुपयोगी’ preserves the lexical sense without importing incompetence.
  - severity: low
    issue: The final clause is slightly stiff in Hindi.
    rationale: ‘जो करना हमारा दायित्व था, हमने वही किया है’ more naturally expresses ὃ ὠφείλομεν ποιῆσαι πεποιήκαμεν and retains the Greek perfect’s completed-action sense.
  revised_text: इसी प्रकार तुम भी, जब वह सब कर चुको जिसकी तुम्हें आज्ञा दी गई है, तो कहो, ‘हम अनुपयोगी दास हैं[a]; जो करना हमारा दायित्व था, हमने वही किया है[b]।’
  revised_footnotes:
