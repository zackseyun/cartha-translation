id: LUK.17.10
reference: Luke 17:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὕτως καὶ ὑμεῖς, ὅταν ποιήσητε πάντα τὰ διαταχθέντα ὑμῖν, λέγετε ὅτι Δοῦλοι ἀχρεῖοί ἐσμεν, ⸂ὃ ὠφείλομεν⸃ ποιῆσαι πεποιήκαμεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/010.yaml
  text: So also you[a], when you have done all that was commanded you, say, ‘We are unworthy servants[b]; we have done what we were obligated to do.’
translation:
  language: hi
  text: इसी प्रकार तुम भी, जब वह सब कर चुको जिसकी तुम्हें आज्ञा दी गई है, तो कहो, ‘हम अनुपयोगी दास हैं[a]; जो करना हमारा दायित्व था, हमने वही किया है[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निकम्मे दास।’ यूनानी विशेषण का अर्थ ‘अनुपयोगी’ या ‘लाभ न पहुँचाने वाला’ हो सकता है; इस प्रसंग में इसका आशय यह भी है कि उन्हें विशेष प्रतिफल का दावा नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हमने वही किया है जो हमारा कर्तव्य था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: οὕτως καὶ ὑμεῖς
  choice: इसी प्रकार तुम भी
  rationale: यह पद पिछले उदाहरण को सीधे शिष्यों पर लागू करता है; यह वाक्यांश उस संबंध और निष्कर्षात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ὅταν ποιήσητε
  choice: जब ... कर चुको
  rationale: ὅταν के साथ एओरिस्ट सब्जंक्टिव यहाँ अपेक्षित भावी स्थिति में काम पूरा हो जाने को दर्शाता है; ‘कर चुको’ उस पूर्णता को स्पष्ट करता है।
- source_word: πάντα τὰ διαταχθέντα ὑμῖν
  choice: वह सब ... जिसकी तुम्हें आज्ञा दी गई है
  rationale: διατάσσω अधिकारपूर्वक आदेश देने का भाव रखता है; ‘आज्ञा दी गई’ इसे ‘सौंपे गए काम’ जैसे नरम विकल्प से बेहतर सुरक्षित रखता है।
- source_word: λέγετε
  choice: कहो
  rationale: वर्तमान आज्ञार्थक का सरल और स्वाभाविक हिन्दी समतुल्य; प्रसंग में सामान्य निर्देश का भाव पर्याप्त रूप से व्यक्त होता है।
- source_word: Δοῦλοι
  choice: दास
  rationale: पिछले पदों का सामाजिक चित्र स्वामी और दास का है, इसलिए ‘दास’ बंधी हुई अधीन स्थिति को ‘सेवक’ की अपेक्षा अधिक ठीक ढंग से बनाए रखता है।
- source_word: ἀχρεῖοί
  choice: अयोग्य
  rationale: शब्द का अर्थ अनुपयोगी या लाभ न पहुँचाने वाला हो सकता है, पर यहाँ कथन का बल विशेष श्रेय या प्रतिफल का दावा न होने पर है। ‘अयोग्य’ उस विनम्रता को व्यक्त करता है, जबकि अधिक कठोर विकल्पों को पादटिप्पणी में रखा गया है।
- source_word: ὃ ὠφείλομεν ποιῆσαι
  choice: जिसे करने के लिए हम बाध्य थे
  rationale: ὀφείλω दायित्व या ऋणस्वरूप बाध्यता व्यक्त करता है। यह अनुवाद उस बल को स्पष्ट, आधुनिक हिन्दी में बनाए रखता है।
- source_word: πεποιήκαμεν
  choice: हमने वही किया है
  rationale: ग्रीक परफेक्ट पूरी की गई क्रिया की वर्तमान प्रासंगिकता रखता है; हिन्दी पूर्ण वर्तमान इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शिष्यत्व के दृष्टांत में δοῦλοι का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: तात्कालिक प्रसंग स्वामी-दास संबंध पर आधारित है। ‘दास’ मूल सामाजिक और आलंकारिक बल को सुरक्षित रखता है, बिना उससे आगे कोई सांप्रदायिक निष्कर्ष जोड़े।
- issue: ἀχρεῖοι का आशय
  choice: अयोग्य
  alternative: अनुपयोगी / निकम्मे / किसी पुरस्कार के अधिकारी नहीं
  rationale: मूल शब्द में अनुपयोगिता का अर्थ संभव है, जबकि प्रसंग आज्ञापालन के आधार पर अतिरिक्त श्रेय का दावा न होने पर बल देता है। मुख्य पाठ में ‘अयोग्य’ और पादटिप्पणी में अन्य अर्थ देकर वास्तविक अर्थ-सीमा और धर्मवैचारिक तनाव दोनों सुरक्षित रखे गए हैं।
- issue: आज्ञापालन और प्रतिफल के दावे का संबंध
  choice: बाध्यता की भाषा को स्पष्ट रखना, पर ‘केवल’ न जोड़ना
  alternative: हमने केवल अपना कर्तव्य किया है
  rationale: पद दायित्व पर बल देता है, पर मूल में ‘केवल’ के लिए अलग शब्द नहीं है। उसे न जोड़ने से कथन का बल बना रहता है और व्याख्यात्मक विस्तार से बचा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ है। शैली सरल और गरिमापूर्ण रखी गई है। ‘दास’ प्रसंग की ऐतिहासिक-सामाजिक तीक्ष्णता बनाए रखता है, और कठिन विशेषण ἀχρεῖοι के विकल्प पादटिप्पणी में दिए गए हैं।
