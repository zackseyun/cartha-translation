  yaml_path: translation/nt/luke/017/013.yaml
  text: And they raised their voices[a], saying, “Jesus, Master[b], have mercy on us!”
translation:
  language: hi
  text: और उन्होंने ऊँची आवाज़ में पुकारा, “यीशु, स्वामी[a], हम पर दया कीजिए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “स्वामी” यूनानी शब्द एपिस्ताता का अनुवाद है। यह अधिकार रखने वाले व्यक्ति के लिए संबोधन है; यहाँ वह शब्द क्यूरियोस नहीं है, जिसका अनुवाद सामान्यतः “प्रभु” किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक है और कथा के प्रवाह को बिना अतिरिक्त कालगत अर्थ जोड़े आगे बढ़ाता है।
- source_word: αὐτοὶ
  choice: उन्होंने
  rationale: यूनानी में सर्वनाम स्पष्ट है, पर हिन्दी में अलग से ‘उन्होंने स्वयं’ कहना अनावश्यक बल जोड़ता; कर्ता क्रियारूप में स्वाभाविक रूप से व्यक्त है।
- source_word: ἦραν φωνὴν
  choice: ऊँची आवाज़ में पुकारकर
  rationale: शाब्दिक अर्थ ‘आवाज़ उठाई’ है, पर सन्दर्भ में यह दूर से ज़ोर से पुकारने का मुहावरा है। चुना हुआ रूप स्वाभाविक हिन्दी में ऊँची आवाज़ और पुकार—दोनों भाव रखता है।
- source_word: λέγοντες
  choice: कहा
  rationale: यूनानी कृदन्त को हिन्दी में ‘पुकारकर कहा’ की क्रमिक संरचना सहज रूप से व्यक्त करती है।
- source_word: Ἰησοῦ
  choice: यीशु
  rationale: सम्बोधन रूप में आए व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यन्तरण।
- source_word: ἐπιστάτα
  choice: स्वामी
  rationale: लूका में यह अधिकार और नेतृत्व रखने वाले व्यक्ति के लिए आदरसूचक सम्बोधन है। ‘स्वामी’ आधुनिक हिन्दी में इस सम्बन्ध को व्यक्त करता है, जबकि इसे ‘प्रभु’ कहने से κύριος के साथ निहित भेद मिट सकता है।
- source_word: ἐλέησον
  choice: दया कर
  rationale: एकवचन आज्ञार्थक रूप तत्काल करुणापूर्ण सहायता की विनती है; हिन्दी में यीशु से सीधे सम्बोधन के साथ ‘दया कर’ स्वाभाविक और गंभीर है।
- source_word: ἡμᾶς
  choice: हम पर
  rationale: ‘दया करना’ के साथ हिन्दी में कर्म-सम्बन्ध स्वाभाविक रूप से ‘पर’ द्वारा व्यक्त होता है।
theological_decisions:
- issue: यीशु के लिए ἐπιστάτα पदवी का अनुवाद
  choice: स्वामी
  alternative: प्रभु
  rationale: मूल शब्द ἐπιστάτης है, κύριος नहीं। ‘स्वामी’ सम्मान और अधिकार का भाव बनाए रखता है, जबकि ‘प्रभु’ इस स्थान पर मूल से अधिक विशिष्ट मसीही धर्मवैज्ञानिक अर्थ ला सकता और दोनों यूनानी पदों का भेद धुँधला कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘ऊँची आवाज़ में पुकारकर कहा’ यूनानी मुहावरे को प्राकृतिक हिन्दी में व्यक्त करता है। एकवचन सम्बोधन के अनुरूप ‘दया कर’ रखा गया है; यह अनादर नहीं, बल्कि सीधे और अत्यावश्यक निवेदन का स्वर है।
