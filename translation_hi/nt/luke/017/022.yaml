id: LUK.17.22
reference: Luke 17:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν δὲ πρὸς τοὺς μαθητάς· Ἐλεύσονται ἡμέραι ὅτε ἐπιθυμήσετε μίαν τῶν ἡμερῶν τοῦ υἱοῦ τοῦ ἀνθρώπου ἰδεῖν καὶ οὐκ ὄψεσθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/022.yaml
  text: Then he said to the disciples[a], “Days are coming when you will long to see one of the days of the Son of Man[b], and you will not see it.”
translation:
  language: hi
  text: फिर उसने चेलों से कहा, “दिन आएँगे जब तुम मनुष्य के पुत्र के दिनों[a] में से एक दिन देखने के लिए तरसोगे, और उसे नहीं देखोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मनुष्य के पुत्र के दिन” उसके उपस्थित रहने और कार्य करने के समय की ओर, या अधिक विशेष रूप से उसके भावी प्रकट होने की ओर संकेत कर सकते हैं; यूनानी अभिव्यक्ति इसका दायरा खुला छोड़ती है।
    reason: alternative_reading
lexical_decisions:
- source_word: Εἶπεν δὲ
  choice: फिर उसने कहा
  rationale: δέ एक हल्का कथात्मक संयोजक है; ‘फिर’ स्वाभाविक हिन्दी प्रवाह देता है और अनावश्यक विरोध नहीं जोड़ता।
- source_word: πρὸς τοὺς μαθητάς
  choice: चेलों से
  rationale: मूल यूनानी में स्वत्वसूचक सर्वनाम नहीं है; इसलिए ‘अपने चेलों से’ न जोड़कर पाठ की सटीकता रखी गई है।
- source_word: Ἐλεύσονται ἡμέραι
  choice: वे दिन आएँगे
  rationale: यह भविष्य के एक आने वाले समय को सूचित करने वाला भविष्यसूचक मुहावरा है; हिन्दी में ‘वे दिन आएँगे जब’ स्वाभाविक और स्पष्ट है।
- source_word: ἐπιθυμήσετε
  choice: तरसोगे
  rationale: यह क्रिया प्रबल इच्छा या लालसा व्यक्त करती है; ‘तरसोगे’ आधुनिक हिन्दी में इसकी भावात्मक तीव्रता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: μίαν τῶν ἡμερῶν
  choice: दिनों में से किसी एक दिन को
  rationale: यह अंशात्मक संबंध को स्पष्ट रखता है—एक दिन, जो दिनों के एक व्यापक समूह में से है।
- source_word: τοῦ υἱοῦ τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र के
  rationale: यीशु की इस उपाधि का शाब्दिक रूप रखा गया है, जिससे उसका बाइबलीय और दानिय्येल-संबंधी प्रतिध्वनि सुरक्षित रहती है।
- source_word: ἰδεῖν
  choice: देखने के लिए
  rationale: यह ἐπιθυμήσετε के साथ देखने की अभिलाषा व्यक्त करता है; हिन्दी में यह सरल और स्वाभाविक है।
- source_word: καὶ οὐκ ὄψεσθε
  choice: पर उसे देख नहीं पाओगे
  rationale: καί को यहाँ प्रसंगगत विरोध दर्शाने वाले स्वाभाविक हिन्दी ‘पर’ से व्यक्त किया गया है। ‘उसे’ पहले उल्लिखित किसी एक दिन की ओर संकेत करता है; ‘नहीं पाओगे’ भावी अनुपलब्धता को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘मनुष्य के पुत्र के दिनों’ का आशय
  choice: वाक्यांश को खुला और युगांत-संबंधी अर्थभार सहित ज्यों का त्यों रखा गया है।
  alternative: इसे केवल यीशु की पृथ्वी पर उपस्थिति के दिनों अथवा केवल उसके भावी प्रकट होने के समय तक सीमित करना।
  rationale: मूल शब्दावली का दायरा खुला है और आसपास का प्रसंग भावी प्रकाशन की ओर भी संकेत करता है। अनुवाद इस तनाव को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘चेलों’ और ‘मनुष्य के पुत्र’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं।
