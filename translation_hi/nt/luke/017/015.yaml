  yaml_path: translation/nt/luke/017/015.yaml
  text: But one of them[a], seeing that he had been healed, returned, glorifying God with a loud voice,
translation:
  language: hi
  text: परन्तु उनमें से एक ने यह देखकर कि वह चंगा हो गया था, ऊँचे स्वर से परमेश्वर की महिमा करते हुए लौट आया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἷς δὲ ἐξ αὐτῶν
  choice: परन्तु उनमें से एक
  rationale: यह अंश स्पष्ट रूप से समूह में से एक व्यक्ति को दर्शाता है। δέ यहाँ शेष नौ से हल्का कथात्मक विरोध प्रकट करता है, इसलिए ‘परन्तु’ स्वाभाविक है।
- source_word: ἰδὼν ὅτι ἰάθη
  choice: यह देखकर कि वह चंगा हो गया है
  rationale: ἰδών को क्रियाविशेषणात्मक कृदन्त के रूप में रखा गया है और ἰάθη के पूर्ण हो चुके उपचार को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: ὑπέστρεψεν
  choice: लौट आया
  rationale: संदर्भ में यह क्रिया यीशु के पास वापस आने की गति बताती है; हिन्दी में ‘लौट आया’ स्वाभाविक और स्पष्ट है।
- source_word: μετὰ φωνῆς μεγάλης
  choice: ऊँचे स्वर से
  rationale: यूनानी मुहावरे का आशय जोर से बोलना या पुकारना है; ‘ऊँचे स्वर से’ निकट और सहज हिन्दी अभिव्यक्ति है।
- source_word: δοξάζων τὸν θεόν
  choice: परमेश्वर की महिमा करते हुए
  rationale: δοξάζω के ‘महिमा करना’ अर्थ और महिमा-संबंधी शब्दावली को बनाए रखता है; प्रसंग में इसमें स्तुति करना भी सम्मिलित है।
theological_decisions:
- issue: τὸν θεόν का अनुवाद
  choice: परमेश्वर
  alternative: ईश्वर
  rationale: यह पद केवल इतना कहता है कि चंगा हुआ व्यक्ति परमेश्वर की महिमा कर रहा था। ‘परमेश्वर’ θεός का मानक, सटीक अनुवाद है और इसमें कोई अनावश्यक धर्मवैज्ञानिक विस्तार नहीं जोड़ा गया।
- issue: δοξάζων में महिमा और स्तुति का संबंध
  choice: महिमा करते हुए
  alternative: स्तुति करते हुए
  rationale: मुख्य पाठ में ‘महिमा’ यूनानी क्रिया का अधिक सीधा शाब्दिक संबंध सुरक्षित रखता है, जबकि पाद-टिप्पणी उसका वैध ‘स्तुति’ अर्थ बताती है और अर्थगत व्यापकता को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। यूनानी कृदन्तीय प्रवाह को हिन्दी में स्वाभाविक रखते हुए उपचार, लौटने और ऊँचे स्वर से परमेश्वर की महिमा करने के क्रम को सुरक्षित रखा गया है।
