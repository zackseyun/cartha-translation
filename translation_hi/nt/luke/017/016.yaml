review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the prostrated posture and identifies the man as a Samaritan. However, “धन्यवाद देने लगा” is inceptive (“began to thank”), whereas the present participle εὐχαριστῶν marks attendant, contemporaneous action without indicating its beginning. “पाँवों पर” can suggest falling onto someone’s feet; παρά is better represented here by “पाँवों के पास.”
  naturalness: “उसके पाँवों के पास मुँह के बल गिर पड़ा” is natural, clear modern Hindi for the reverential posture. “उसे धन्यवाद देते हुए” naturally expresses the concurrent participial action without adding aspectual meaning.
  terminology: “सामरी” is an established Hindi biblical designation for Σαμαρίτης and should be retained. No theological interpretation is added.
  issues:
  - severity: medium
    issue: “धन्यवाद देने लगा” adds an inceptive nuance.
    rationale: The Greek εὐχαριστῶν means “thanking/giving thanks,” as an action accompanying the falling; it does not state that he began to thank.
  - severity: low
    issue: “उसके पाँवों पर” is less precise for the spatial expression.
    rationale: In Hindi this can imply falling directly onto the feet, while “उसके पाँवों के पास” clearly conveys the intended posture at/beside his feet.
  revised_text: और वह उसे धन्यवाद देते हुए उसके पाँवों के पास मुँह के बल गिर पड़ा। वह सामरी था।
  revised_footnotes: []
