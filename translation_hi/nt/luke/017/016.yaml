  text: καὶ ἔπεσεν ἐπὶ πρόσωπον παρὰ τοὺς πόδας αὐτοῦ εὐχαριστῶν αὐτῷ· καὶ αὐτὸς ἦν Σαμαρίτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/016.yaml
  text: And he fell on his face at his feet, thanking him. And he was a Samaritan.
translation:
  language: hi
  text: और वह उसे धन्यवाद देते हुए उसके पाँवों के पास मुँह के बल गिर पड़ा। वह सामरी था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν
  choice: गिरकर
  rationale: πίπτω के अओरिस्ट रूप का मूल अर्थ ‘गिरा’ है; साथ का वाक्यांश ‘मुँह के बल’ दण्डवत् मुद्रा स्पष्ट करता है, इसलिए क्रिया में अलग से व्याख्या नहीं जोड़ी गई।
- source_word: ἐπὶ πρόσωπον
  choice: मुँह के बल
  rationale: यह स्वाभाविक आधुनिक हिन्दी में भूमि की ओर मुख करके विनम्रतापूर्वक गिरने की शारीरिक मुद्रा को स्पष्ट और सजीव रूप से व्यक्त करता है।
- source_word: παρὰ τοὺς πόδας αὐτοῦ
  choice: उसके पाँवों पर
  rationale: παρά का स्थानीय भाव यहाँ यीशु के चरणों के निकट विनम्र मुद्रा का है। हिन्दी का प्रचलित ‘पाँवों पर गिरना’ इस दृश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: εὐχαριστῶν αὐτῷ
  choice: उसे धन्यवाद देने लगा
  rationale: वर्तमान कृदन्त गिरने के साथ चल रही धन्यवाद की क्रिया बताता है। ‘देने लगा’ हिन्दी में इस सहभागी क्रिया को सहजता से व्यक्त करता है और धन्यवाद का लक्ष्य उसी व्यक्ति को बनाए रखता है।
- source_word: Σαμαρίτης
  choice: सामरी
  rationale: यह उस जातीय-धार्मिक समुदाय का हिन्दी में स्थापित नाम है और कथा में उसकी सामाजिक पहचान का महत्त्व सुरक्षित रखता है।
- source_word: καὶ αὐτὸς ἦν Σαμαρίτης
  choice: वह सामरी था
  rationale: αὐτός का स्पष्ट सर्वनाम बना रहता है, जबकि सरल कथन उस आश्चर्यजनक पहचान को बिना व्याख्यात्मक विस्तार के सामने रखता है।
theological_decisions:
- issue: चंगे हुए व्यक्ति की सामरी पहचान पर कथात्मक बल
  choice: सरल कथन ‘वह सामरी था’ रखा गया।
  alternative: ‘और यह व्यक्ति सामरी था’ अथवा ‘वास्तव में वह सामरी था।’
  rationale: पद की सामाजिक और धर्मवैचारिक तीक्ष्णता इस संयत उद्घाटन में है कि धन्यवाद देने वाला व्यक्ति सामरी था। अनुवाद इस तनाव को रखता है, पर कोई टिप्पणी या निष्कर्ष मूल पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘पाँवों पर मुँह के बल गिरकर’ मूल की सजीव दण्डवत् मुद्रा को सामान्य हिन्दी में रखता है; ‘सामरी’ प्रचलित बाइबलीय जातीय-धार्मिक पद है।
