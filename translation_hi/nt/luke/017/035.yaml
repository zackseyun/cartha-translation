source:
  edition: SBLGNT
  text: ⸂ἔσονται δύο⸃ ἀλήθουσαι ἐπὶ τὸ αὐτό, ⸀ἡ μία παραλημφθήσεται ⸂ἡ δὲ⸃ ἑτέρα ⸀ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/035.yaml
  text: There will be two women grinding together[a]; one will be taken[b], but the other will be left.
translation:
  language: hi
  text: दो स्त्रियाँ एक साथ चक्की पीस रही होंगी[a]; एक उठा ली जाएगी[b], पर दूसरी छोड़ दी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक ही स्थान पर।” यूनानी पदबंध का अर्थ “एक साथ” या “एक ही स्थान पर” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उठा ली जाएगी” अपने आप यह स्पष्ट नहीं करता कि उसे उद्धार के लिए उठाया जाएगा या न्याय के लिए; यूनानी पाठ इसका निर्णय व्यापक प्रसंग पर छोड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔσονται
  choice: होंगी
  rationale: εἰμί का भविष्यकाल दृश्य को भविष्य में रखता है; स्त्रीलिंग बहुवचन कर्ता के साथ ‘होंगी’ स्वाभाविक हिन्दी है।
- source_word: δύο … ἀλήθουσαι
  choice: दो स्त्रियाँ … चक्की पीस रही
  rationale: स्त्रीलिंग बहुवचन कृदन्त ἀλήθουσαι बताता है कि ये दो स्त्रियाँ हैं और वे पीसने का काम कर रही हैं। ‘चक्की पीसना’ सामान्य हिन्दी में इस घरेलू कार्य को स्पष्ट करता है।
- source_word: ἐπὶ τὸ αὐτό
  choice: एक साथ
  rationale: यह यूनानी पदबंध साथ होने या एक ही स्थान पर होने का भाव दे सकता है। मुख्य पाठ में ‘एक साथ’ सर्वाधिक स्वाभाविक है; स्थान-संबंधी अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: ἡ μία
  choice: एक
  rationale: दो स्त्रियों में से पहली को अलग दिखाने के लिए हिन्दी का स्वाभाविक विरोधात्मक रूप ‘एक’ है।
- source_word: παραλημφθήσεται
  choice: उठा ली जाएगी
  rationale: भविष्यकालीन कर्मवाच्य को बनाए रखते हुए यह παραλαμβάνω के ‘साथ ले लिए जाने’ के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, पर यह अपने आप नहीं बताता कि ले जाना उद्धार के लिए है या न्याय के लिए।
- source_word: ἡ δὲ ἑτέρα
  choice: पर दूसरी
  rationale: δέ के विरोधात्मक भाव और ἑτέρα द्वारा दूसरी स्त्री के भेद को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀφεθήσεται
  choice: छोड़ दी जाएगी
  rationale: भविष्यकालीन कर्मवाच्य ἀφίημι यहाँ किसी के वहीं छोड़ दिए जाने का भाव देता है। यह अनुवाद ‘त्याग देना’ जैसी अतिरिक्त नकारात्मक व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: उठा ली जाने और छोड़ दी जाने का धार्मिक परिणाम
  choice: ‘एक उठा ली जाएगी, पर दूसरी छोड़ दी जाएगी’—दोनों क्रियाओं का मूल्यांकन खुला रखा गया है।
  alternative: उठाई गई स्त्री को उद्धार के लिए या न्याय के लिए ले जाया जाना स्पष्ट कर देना।
  rationale: पद स्वयं केवल अलग किए जाने की बात कहता है; παραλημφθήσεται यह निश्चित नहीं करता कि उठा लिया जाना उद्धार है या न्याय। इसलिए व्यापक प्रसंग में मौजूद व्याख्यात्मक तनाव को अनुवाद में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथात्मक रूप अपनाया गया है। ‘चक्की पीसना’ सामान्य पाठक के लिए घरेलू पीसने के काम को सहज रूप से व्यक्त करता है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
