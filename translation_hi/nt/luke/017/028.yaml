  yaml_path: translation/nt/luke/017/028.yaml
  text: 'Likewise[a], just as it happened in the days of Lot: they were eating, drinking, buying, selling, planting, and building.'
translation:
  language: hi
  text: 'उसी तरह[a], जैसा लूत के दिनों में हुआ था: लोग खाते-पीते, खरीदते-बेचते, पौधे लगाते और निर्माण करते थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “इसी प्रकार, जैसा लूत के दिनों में हुआ था: लोग खाते-पीते, खरीदते-बेचते, पौधे लगाते और निर्माण करते थे।”'
    reason: ὁμοίως के लिए ‘उसी तरह’ का स्वाभाविक वैकल्पिक रूप ‘इसी प्रकार’ है।
lexical_decisions:
- source_word: ὁμοίως
  choice: उसी तरह
  rationale: यह क्रियाविशेषण पिछले उदाहरण से समानता जोड़ता है; ‘उसी तरह’ आधुनिक और स्वाभाविक हिंदी में तुलनात्मक बल बनाए रखता है।
- source_word: καθὼς
  choice: जैसा
  rationale: यह रीति अथवा समानता का उपवाक्य आरंभ करता है; ‘जैसा’ हिंदी में स्पष्ट और सहज है।
- source_word: ἐγένετο
  choice: हुआ था
  rationale: γίνομαι यहाँ घटनात्मक अर्थ में है; ‘हुआ था’ पूर्वकालीन ऐतिहासिक परिस्थिति को सहज हिंदी में व्यक्त करता है।
- source_word: ἐν ταῖς ἡμέραις Λώτ
  choice: लूत के दिनों में
  rationale: यह लूत से संबद्ध समयावधि का पारंपरिक और सामान्य हिंदी मुहावरा है।
- source_word: ἤσθιον, ἔπινον
  choice: खाते-पीते
  rationale: दोनों अपूर्णकालिक क्रियाएँ चलती और सामान्य गतिविधियों को दर्शाती हैं; संयुक्त पद हिंदी में सूची को स्वाभाविक रखता है।
- source_word: ἠγόραζον, ἐπώλουν
  choice: खरीदते-बेचते
  rationale: ये सामान्य व्यापारिक गतिविधियाँ हैं; युग्म रूप मूल की समानांतरता और अपूर्णकालिक भाव रखता है।
- source_word: ἐφύτευον
  choice: बोते
  rationale: कृषि-संदर्भ में ‘बोते’ सामान्य हिंदी अभिव्यक्ति है और पौधे या फसल लगाने की गतिविधि को सहज रूप से व्यक्त करती है।
- source_word: ᾠκοδόμουν
  choice: घर बनाते थे
  rationale: क्रिया यहाँ वास्तविक निर्माण के अर्थ में है; ‘घर बनाते थे’ केवल ‘बनाते थे’ की अपेक्षा हिंदी पाठक के लिए अधिक पूर्ण और स्वाभाविक है।
