  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अपूर्णकालिक यूनानी क्रियाओं का नियमित/चलती गतिविधियों वाला भाव हिंदी के ‘-ते थे’ ढाँचे तथा युग्म क्रियाओं से व्यक्त किया गया है।
