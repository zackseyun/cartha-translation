  text: πρῶτον δὲ δεῖ αὐτὸν πολλὰ παθεῖν καὶ ἀποδοκιμασθῆναι ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/025.yaml
  text: But first he must suffer many things and be rejected by this generation.
translation:
  language: hi
  text: परन्तु पहले उसे बहुत दुःख सहना और इस पीढ़ी द्वारा ठुकराया जाना आवश्यक है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πρῶτον
  choice: पहले
  rationale: यह क्रियाविशेषण आगे बताई गई घटनाओं से पूर्व की समय-क्रमिक प्राथमिकता व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यहाँ δέ पिछले कथन से हल्का विरोध अथवा संक्रमण दिखाता है; ‘परन्तु’ उस भाव को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: δεῖ
  choice: आवश्यक है
  rationale: यह अनिवार्यता व्यक्त करता है और लूका में निहित ईश्वरीय प्रयोजन की संभावना को बनाए रखता है, पर उसे अनुवाद में स्पष्ट व्याख्या बनाकर नहीं जोड़ता।
- source_word: αὐτὸν
  choice: उसे
  rationale: यूनानी में यह अनंत क्रियाओं का कर्ता होते हुए कर्मकारक में है; ‘उसे ... सहना ... आवश्यक है’ स्वाभाविक हिन्दी रचना है।
- source_word: πολλὰ παθεῖν
  choice: बहुत दुःख सहना
  rationale: πολλά भावी कष्टों की व्यापकता बताता है और παθεῖν को ‘दुःख सहना’ सहज तथा गंभीर हिन्दी में व्यक्त करता है।
- source_word: ἀποδοκιμασθῆναι
  choice: ठुकराया जाना
  rationale: क्रिया जाँच या विचार के बाद अस्वीकार किए जाने का भाव रखती है; ‘ठुकराया जाना’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी द्वारा
  rationale: निष्क्रिय क्रिया के साथ ἀπό अस्वीकार करने वाले कारक को सूचित करता है; ‘इस पीढ़ी द्वारा’ समकालीन सामूहिक संदर्भ और कर्तृत्व दोनों बचाता है।
theological_decisions:
- issue: मनुष्य के पुत्र के दुःख के संबंध में δεῖ की शक्ति
  choice: ‘आवश्यक है’ के द्वारा अनिवार्यता को सुरक्षित रखा गया है।
  alternative: ‘होना ही है’ अथवा परमेश्वर की योजना की पूर्ति को स्पष्ट रूप से जोड़ना
  rationale: लूका में δεῖ प्रायः ईश्वरीय उद्देश्य के अनुसार घटने वाली घटनाओं की ओर संकेत करता है। पद स्वयं उस उद्देश्य को स्पष्ट नहीं करता, इसलिए अनुवाद निहित धार्मिक भार को बनाए रखता है, पर उसकी व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य है। समानांतर अनंत क्रियात्मक रचना मूल वाक्य की एक ही अनिवार्यता के अधीन दुःख सहने और ठुकराए जाने—दोनों को रखती है।
