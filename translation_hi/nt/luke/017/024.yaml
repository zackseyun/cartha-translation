id: LUK.17.24
reference: Luke 17:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὥσπερ γὰρ ἡ ⸀ἀστραπὴ ἀστράπτουσα ἐκ τῆς ⸂ὑπὸ τὸν⸃ οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν λάμπει, οὕτως ἔσται ὁ υἱὸς τοῦ ἀνθρώπου ⸂ἐν τῇ ἡμέρᾳ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/024.yaml
  text: For just as lightning, flashing from one part under heaven to the other part under heaven, shines[b][a], so will the Son of Man be in his day.
translation:
  language: hi
  text: क्योंकि जैसे बिजली आकाश के एक छोर से दूसरे छोर तक कौंधती हुई चमकती है[a], वैसे ही मनुष्य का पुत्र अपने दिन में होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “आकाश के नीचे के एक भाग से आकाश के नीचे के दूसरे भाग तक।” यूनानी में दोनों ओर “आकाश के नीचे” दोहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने दिन पर।” यह वाक्यांश मनुष्य के पुत्र से जुड़े समय की ओर संकेत करता है और यहाँ जानबूझकर व्यापक रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὥσπερ γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और ὥσπερ द्वारा आरम्भ की गई तुलना—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀστραπὴ ἀστράπτουσα
  choice: बिजली ... कौंधती हुई
  rationale: संज्ञा और उससे जुड़े कृदन्त को जीवंत क्रिया-चित्र के रूप में रखता है; ‘कौंधती हुई’ अचानक और प्रत्यक्ष दिखाई देने वाली बिजली को व्यक्त करता है।
- source_word: ἐκ τῆς ὑπὸ τὸν οὐρανὸν εἰς τὴν ὑπ’ οὐρανὸν
  choice: आकाश के एक छोर से दूसरे छोर तक
  rationale: मूल में ‘आकाश के नीचे’ की पुनरावृत्ति है, पर हिन्दी में यह मुहावरेदार अभिव्यक्ति उसी व्यापक, एक ओर से दूसरी ओर तक दिखाई देने वाले विस्तार को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है; अधिक शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: λάμπει
  choice: चमकती है
  rationale: पहले प्रयुक्त ἀστράπτουσα से अलग क्रिया को ‘कौंधती हुई चमकती है’ द्वारा बनाए रखता है।
- source_word: οὕτως ἔσται
  choice: वैसे ही ... होगा
  rationale: उपमा की संरचना और साधारण भविष्यकाल दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु के इस पदनाम का स्थापित, पारदर्शी और रूपगत रूप से निकट हिन्दी अनुवाद है।
- source_word: ἐν τῇ ἡμέρᾳ αὐτοῦ
  choice: अपने दिन में
  rationale: αὐτοῦ के संबंधसूचक अर्थ को बनाए रखते हुए उस समय को जानबूझकर व्यापक छोड़ता है जो मनुष्य के पुत्र से संबद्ध है।
theological_decisions:
- issue: अंतकाल-संबंधी प्रसंग में ‘मनुष्य का पुत्र ... अपने दिन में’ का अर्थ
  choice: अपने दिन में
  alternative: अपने आगमन पर; न्याय के दिन
  rationale: प्रसंग अंतकाल-संबंधी है, पर यूनानी पाठ केवल ‘उसके दिन में’ कहता है। इसे ‘आगमन’ या ‘न्याय’ के रूप में विस्तार देना पाठ में निहित से अधिक व्याख्यात्मक विशिष्टता जोड़ देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘कौंधती हुई चमकती है’ मूल की दो संबंधित पर अलग क्रियाओं को बनाए रखता है। ‘आकाश के एक छोर से दूसरे छोर तक’ सामान्य पाठक के लिए स्वाभाविक है, जबकि मूल की पुनरावृत्ति पाद-टिप्पणी में सुरक्षित है।
