id: LUK.17.29
reference: Luke 17:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ᾗ δὲ ἡμέρᾳ ἐξῆλθεν Λὼτ ἀπὸ Σοδόμων, ἔβρεξεν πῦρ καὶ θεῖον ἀπ’ οὐρανοῦ καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/029.yaml
  text: but on the day Lot went out from Sodom[a], fire and sulfur rained from heaven and destroyed them all.
translation:
  language: hi
  text: पर जिस दिन लूत सदोम से बाहर निकला, उस दिन आकाश से आग और गंधक बरसे और सबको नष्ट कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾗ δὲ ἡμέρᾳ
  choice: पर जिस दिन … उस दिन
  rationale: यह संबंधवाचक दत्तिव पद समय बताता है। दोहरावयुक्त हिन्दी रचना मूल के ‘जिस दिन’ संबंध को स्पष्ट और स्वाभाविक बनाती है; ‘पर’ δέ के हल्के विरोध/क्रमविकास को बनाए रखता है।
- source_word: ἐξῆλθεν
  choice: बाहर निकला
  rationale: ἐξέρχομαι की ठोस गतिशीलता को सीधे व्यक्त करता है और केवल ‘छोड़ दिया’ की अपेक्षा मूल के अधिक निकट है।
- source_word: Λὼτ
  choice: लूत
  rationale: हिन्दी बाइबिल परंपरा में प्रचलित और पहचाना जाने वाला नाम-रूप।
- source_word: ἀπὸ Σοδόμων
  choice: सदोम से
  rationale: स्थानवाचक नाम को हिन्दी में प्रचलित एकवचन रूप में रखते हुए ἀπό का स्रोतार्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἔβρεξεν
  choice: बरसे
  rationale: ग्रीक में क्रिया एकवचन और निर्वैयक्तिक रूप से प्रयुक्त है, पर हिन्दी में संयुक्त कर्ता ‘आग और गंधक’ के साथ ‘बरसे’ स्वाभाविक है; कोई अतिरिक्त कर्ता नहीं जोड़ा गया।
- source_word: πῦρ καὶ θεῖον
  choice: आग और गंधक
  rationale: θεῖον का सीधा आधुनिक हिन्दी अर्थ ‘गंधक’ है; यह न्याय की तीव्र छवि बनाए रखता है और किसी पुराने मुहावरे पर निर्भर नहीं करता।
- source_word: ἀπ’ οὐρανοῦ
  choice: आकाश से
  rationale: οὐρανός यहाँ उस ऊपर के क्षेत्र को सूचित करता है जहाँ से आग और गंधक बरसते हैं। ‘आकाश’ दृश्य और प्राकृतिक अर्थ को स्पष्ट रखता है, जबकि ‘स्वर्ग’ भी संभव धार्मिक-पारंपरिक विकल्प है।
- source_word: ἀπώλεσεν πάντας
  choice: सबको नष्ट कर दिया
  rationale: ἀπόλλυμι का विनाशकारी अर्थ और πάντας का सभी व्यक्तियों की ओर संकेत संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रहता है।
theological_decisions:
- issue: θεῖον का न्याय-संदर्भ में अनुवाद
  choice: गंधक
  alternative: पुराने धार्मिक मुहावरे पर आधारित कोई पारंपरिक पद
  rationale: ‘गंधक’ मूल शब्द का स्पष्ट पदार्थवाचक अर्थ है और आधुनिक पाठक के लिए समझने योग्य है; न्याय की छवि को न तो हल्का करता है, न बढ़ाता है।
- issue: οὐρανός का अनुवाद
  choice: आकाश
  alternative: स्वर्ग
  rationale: इस वर्षा-सदृश घटना में ‘आकाश से’ सहज और अर्थ-संगत है। ‘स्वर्ग से’ उत्पत्ति 19:24 की पारंपरिक धार्मिक अनुगूँज को अधिक स्पष्ट कर सकता है, पर मूल शब्द दोनों अर्थों की अनुमति देता है; मुख्य पाठ दृश्य अर्थ को चुनता है।
- issue: ἀπώλεσεν का निहित कर्ता
  choice: कर्त्ता को व्यक्त किए बिना ‘नष्ट कर दिया’
  alternative: परमेश्वर ने सबको नष्ट कर दिया
  rationale: ग्रीक में क्रिया का स्पष्ट नामित कर्ता नहीं है। दिव्य न्याय का प्रसंग स्पष्ट है, पर ‘परमेश्वर’ जोड़ना मूल की व्याकरणिक अस्पष्टता को व्याख्यात्मक रूप से सुलझा देता; इसलिए उसे नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल। वाक्य में ‘जिस दिन … उस दिन’ रचना स्पष्टता देती है। ‘सदोम’, ‘लूत’, ‘गंधक’ और ‘नष्ट’ व्यापक रूप से समझे जाने वाले रूप हैं।
