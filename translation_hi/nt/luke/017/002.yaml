id: LUK.17.2
reference: Luke 17:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λυσιτελεῖ αὐτῷ εἰ ⸂λίθος μυλικὸς⸃ περίκειται περὶ τὸν τράχηλον αὐτοῦ καὶ ἔρριπται εἰς τὴν θάλασσαν ἢ ἵνα σκανδαλίσῃ ⸂τῶν μικρῶν τούτων ἕνα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/002.yaml
  text: It would be better for him if a millstone were hung around his neck and he were thrown into the sea than that he should cause one of these little ones to stumble[a][b].
translation:
  language: hi
  text: उसके लिए यह अच्छा होता कि उसके गले में चक्की का पाट लटका दिया जाता और उसे समुद्र में फेंक दिया जाता, बजाय इसके कि वह इन छोटों में से किसी एक को ठोकर खिलाए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विशेष रूप से, “चक्की का बड़ा पाट।” यूनानी पदबंध चक्की में प्रयुक्त भारी पाट का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “इन छोटों में से किसी एक को पाप में गिराए।” यूनानी क्रिया में किसी को पाप या आत्मिक विनाश की ओर ले जाने का भाव शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λυσιτελεῖ
  choice: उसके लिए यह अच्छा होता
  rationale: यह पदबंध किसी परिणाम को दूसरे परिणाम से बेहतर या श्रेयस्कर बताता है; आधुनिक हिन्दी में यह स्वाभाविक है और तुलनात्मक भाव बनाए रखता है।
- source_word: λίθος μυλικὸς
  choice: चक्की का पाट
  rationale: यह चक्की में प्रयुक्त पत्थर को दर्शाता है। हिन्दी में ‘चक्की का पाट’ स्पष्ट और प्रचलित है; उसके बड़े या भारी होने की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: περίκειται περὶ τὸν τράχηλον αὐτοῦ
  choice: उसके गले में ... लटका दिया जाता
  rationale: यूनानी रूप गले के चारों ओर रखे होने की दशा बताता है; हिन्दी में निष्क्रिय प्रयोग उस परिणामी अवस्था को सहज रूप से व्यक्त करता है।
- source_word: ἔρριπται εἰς τὴν θάλασσαν
  choice: उसे समुद्र में फेंक दिया जाता
  rationale: पूर्ण निष्क्रिय रूप पूरे किए गए कार्य और उसकी परिणति पर बल देता है; समानान्तर हिन्दी रचना इसे स्वाभाविक ढंग से व्यक्त करती है।
- source_word: σκανδαλίσῃ
  choice: ठोकर खिलाए
  rationale: यह रूपक किसी को पाप में गिराने या आत्मिक विनाश की ओर ले जाने का भाव रखता है। ‘ठोकर खिलाए’ रूपक को सुरक्षित रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: τῶν μικρῶν τούτων ἕνα
  choice: इन छोटों में से किसी एक को
  rationale: मूल शब्दावली केवल ‘इन छोटे जनों में से एक’ कहती है और आयु अथवा पहचान निश्चित नहीं करती। यह अनुवाद उस व्यापकता को बनाए रखता है।
- source_word: ἢ ἵνα
  choice: बजाय इसके कि
  rationale: यह दोनों परिणामों के बीच तुलना व्यक्त करता है और हिन्दी में वाक्य का तुलनात्मक सम्बन्ध स्पष्ट करता है।
theological_decisions:
- issue: ‘इन छोटों’ का अभिप्राय
  choice: ‘इन छोटों’ कहकर पहचान को अनिर्धारित रखा गया है।
  alternative: ‘इन बच्चों’ अथवा ‘इन छोटे/दीन विश्वासियों’
  rationale: तात्कालिक यूनानी पाठ इन्हें केवल बच्चे या केवल शिष्य/विश्वासी नहीं ठहराता; इसलिए अनुवाद व्याख्यात्मक और धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। मूल रूपक और ‘छोटों’ की अनिश्चित पहचान सुरक्षित रखी गई है।
