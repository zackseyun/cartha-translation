id: LUK.17.4
reference: Luke 17:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐὰν ἑπτάκις τῆς ἡμέρας ⸀ἁμαρτήσῃ εἰς σὲ καὶ ⸀ἑπτάκις ἐπιστρέψῃ ⸂πρὸς σὲ⸃ λέγων· Μετανοῶ, ἀφήσεις αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/004.yaml
  text: And if he sins against you seven times in a day[a], and seven times returns to you saying[c][b], ‘I repent,’ you shall forgive him.
translation:
  language: hi
  text: और यदि वह एक दिन में सात बार तुम्हारे विरुद्ध पाप करे, और सात बार तुम्हारे पास लौटकर कहे, ‘मैं पश्चाताप करता हूँ,’ तो तुम उसे क्षमा करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑπτάκις
  choice: सात बार
  rationale: यह क्रियाविशेषण ठीक सात बार की पुनरावृत्ति बताता है; आधुनिक हिन्दी में ‘सात बार’ स्वाभाविक और सटीक है।
- source_word: τῆς ἡμέρας
  choice: एक दिन में
  rationale: यह समय-सीमा के भीतर होने का संबंधसूचक प्रयोग है। हिन्दी में ‘एक दिन में’ स्वाभाविक रूप से उसी अर्थ को व्यक्त करता है; ‘एक’ अलग यूनानी शब्द का अनुवाद नहीं, बल्कि हिन्दी की आवश्यक मुहावरेदार अभिव्यक्ति है।
- source_word: ἁμαρτήσῃ εἰς σὲ
  choice: तुम्हारे विरुद्ध पाप करे
  rationale: εἰς σέ यहाँ संबोधित व्यक्ति के विरुद्ध किए गए अपराध को दर्शाता है। ‘तुम्हारे विरुद्ध पाप करे’ अर्थ और नैतिक भार दोनों बनाए रखता है।
- source_word: ἐπιστρέψῃ πρὸς σὲ
  choice: तुम्हारे पास लौटकर
  rationale: ἐπιστρέφω में ‘मुड़ना’ और ‘लौटना’ दोनों अर्थ संभव हैं। बार-बार अपराध करने और फिर संबोधित व्यक्ति के पास आने के प्रसंग में ‘लौटकर’ सर्वाधिक स्वाभाविक है।
- source_word: λέγων
  choice: कहे
  rationale: वर्तमान कृदंत को हिन्दी की संयुक्त क्रिया ‘लौटकर कहे’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: Μετανοῶ
  choice: मैं पश्चाताप करता हूँ
  rationale: यह केवल खेद या क्षमा-याचना नहीं, बल्कि पश्चाताप की स्पष्ट घोषणा है; इसलिए इसके नैतिक और धर्मवैचारिक भार को सुरक्षित रखा गया है।
- source_word: ἀφήσεις
  choice: तुम उसे क्षमा करना
  rationale: यूनानी भविष्यकालीन रूप यहाँ निर्देशात्मक/आज्ञार्थक बल रखता है। हिन्दी का ‘क्षमा करना’ स्पष्ट आदेश देता है और कृत्रिम भविष्यवाची अनुवाद से बचता है।
- source_word: αὐτῷ
  choice: उसे
  rationale: यह उसी अपराध करने वाले व्यक्ति की ओर संकेत करने वाला दत्तिव सर्वनाम है; हिन्दी में ‘उसे’ स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ἀφήσεις के भविष्यकालीन रूप का बल
  choice: इसे निर्देश के रूप में ‘तुम उसे क्षमा करना’ अनूदित किया गया है।
  alternative: ‘तुम उसे क्षमा करोगे’ या ‘तुम्हें उसे क्षमा करना चाहिए।’
  rationale: शिक्षात्मक प्रसंग में यह रूप केवल भविष्यवाणी नहीं, दायित्व व्यक्त करता है। चुना हुआ हिन्दी रूप आज्ञार्थक बल को स्पष्ट रखता है, जबकि ‘चाहिए’ अपेक्षाकृत कमजोर पड़ सकता है।
- issue: Μετανοῶ का अर्थ
  choice: ‘मैं पश्चाताप करता हूँ।’
  alternative: ‘मुझे खेद है’ या ‘मैंने अपना मन बदल लिया है।’
  rationale: मूल पाठ पश्चाताप की बात करता है, केवल भावनात्मक खेद या सामान्य मन-परिवर्तन की नहीं; इसलिए उसके नैतिक और आत्मिक आशय को कम नहीं किया गया।
- issue: क्षमा और घोषित पश्चाताप का संबंध
  choice: वाक्य की शर्तात्मक संरचना ज्यों की त्यों रखी गई है।
  alternative: पश्चाताप की सच्चाई, प्रमाण या सीमा के बारे में व्याख्यात्मक शब्द जोड़ना।
  rationale: पद में अपराधी के लौटकर ‘मैं पश्चाताप करता हूँ’ कहने पर क्षमा करने का निर्देश है। अनुवाद किसी अतिरिक्त धर्मसैद्धांतिक कसौटी को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘एक दिन में’, ‘तुम्हारे पास लौटकर’ और ‘तुम उसे क्षमा करना’ मुहावरेदार हिन्दी हैं। मूल की शर्त, पुनरावृत्ति और आदेशात्मक बल सुरक्षित रखे गए हैं।
