  yaml_path: translation/nt/luke/017/030.yaml
  text: It will be the same on the day when the Son of Man is revealed[a].
translation:
  language: hi
  text: जिस दिन मनुष्य का पुत्र प्रकट होगा, उस दिन भी ऐसा ही होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसी प्रकार।” यूनानी मुहावरा पिछले उदाहरणों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ τὰ αὐτά
  choice: भी ऐसा ही
  rationale: यह यूनानी मुहावरा पिछले उदाहरणों की ओर संकेत करके समान रीति या परिणाम व्यक्त करता है। ‘भी ऐसा ही’ सहज हिन्दी में उसके तुलनात्मक बल को बनाए रखता है।
- source_word: ἔσται
  choice: होगा
  rationale: εἰμί का भविष्यकाल यहाँ सीधे भविष्य की स्थिति बताता है; ‘होगा’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: ᾗ ἡμέρᾳ
  choice: जिस दिन … उस दिन
  rationale: समयवाचक संबंध को हिन्दी में ‘जिस दिन … उस दिन’ की संरचना स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यह सुसमाचारों में यीशु की स्थापित उपाधि है और दानिय्येल 7 से जुड़ी उसकी मसीही तथा प्रलयकालीन प्रतिध्वनि को सुरक्षित रखती है।
- source_word: ἀποκαλύπτεται
  choice: प्रकट होगा
  rationale: यूनानी वर्तमानकाल रूप भावी प्रलयकालीन घटना के संदर्भ में है। हिन्दी में ‘प्रकट होगा’ सार्वजनिक प्रकटीकरण का अर्थ और भविष्य-संदर्भ दोनों स्वाभाविक रूप से व्यक्त करता है; केवल ‘आएगा’ कहना मूल क्रिया के प्रकाशन वाले भाव को खो देगा।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου की प्रलयकालीन उपाधि
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र
  rationale: ‘मनुष्य का पुत्र’ पारंपरिक और पहचानी जाने वाली बाइबलीय उपाधि है तथा दानिय्येल 7 से उसका अंतरपाठीय संबंध बनाए रखती है।
- issue: ἀποκαλύπτεται का संदर्भगत बल
  choice: प्रकट होगा
  alternative: आएगा
  rationale: मूल क्रिया प्रकट या अनावृत होने को व्यक्त करती है, केवल आगमन को नहीं। भविष्यकालीन हिन्दी रूप संदर्भगत समय को स्पष्ट करता है, बिना क्रिया को ‘आना’ में बदलने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिन्दी की स्वाभाविक ‘जिस दिन … उस दिन’ संरचना अपनाई गई है और स्थापित बाइबलीय उपाधि ‘मनुष्य का पुत्र’ सुरक्षित रखी गई है।
