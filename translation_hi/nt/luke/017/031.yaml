id: LUK.17.31
reference: Luke 17:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐν ἐκείνῃ τῇ ἡμέρᾳ ὃς ἔσται ἐπὶ τοῦ δώματος καὶ τὰ σκεύη αὐτοῦ ἐν τῇ οἰκίᾳ, μὴ καταβάτω ἆραι αὐτά, καὶ ὁ ⸀ἐν ἀγρῷ ὁμοίως μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/031.yaml
  text: On that day, whoever is on the housetop, with his belongings in the house, must not go down to take them away; and likewise, the one in the field must not turn back to the things behind.
translation:
  language: hi
  text: उस दिन जो कोई घर की छत[b] पर हो और उसका सामान घर के भीतर हो, वह उसे लेने के लिए नीचे न उतरे। उसी तरह, जो खेत में हो, वह पीछे छूटी हुई चीज़ों के लिए न लौटे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक संक्षेप में, “वह पीछे न लौटे।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “घर की छत” से आशय उस समय के घर की समतल छत से है, जहाँ सामान्यतः आया-जाया और काम किया जा सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: ἐν ἐκείνῃ τῇ ἡμέρᾳ
  choice: उस दिन
  rationale: यह स्वाभाविक हिन्दी कालवाचक प्रयोग है और संकेतवाचक बल को बनाए रखता है।
- source_word: ὃς ἔσται
  choice: जो कोई ... हो
  rationale: भविष्यकाल सहित सम्बन्धवाचक रूप यहाँ सामान्य प्रतिनिधि व्यक्ति का बोध कराता है; हिन्दी में यह प्रयोग उसी अर्थ को सहजता से व्यक्त करता है।
- source_word: ἐπὶ τοῦ δώματος
  choice: घर की छत पर
  rationale: δώμα उस परिवेश की समतल और उपयोग में आने वाली छत को दर्शाता है; सांस्कृतिक संदर्भ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τὰ σκεύη αὐτοῦ
  choice: उसका सामान
  rationale: σκεύη यहाँ घर में रखी चल संपत्ति या निजी वस्तुओं को दर्शाता है; ‘सामान’ आधुनिक हिन्दी में व्यापक और स्वाभाविक है।
- source_word: μὴ καταβάτω
  choice: नीचे न उतरे
  rationale: तीसरे पुरुष का निषेधात्मक आज्ञार्थ तत्काल और दृढ़ मनाही व्यक्त करता है; यह हिन्दी रूप उस बल को बनाए रखता है।
- source_word: ἆραι αὐτά
  choice: उसे लेने के लिए
  rationale: αἴρω यहाँ भीतर रखे सामान को उठा लेने या साथ ले जाने के लिए नीचे उतरने का अर्थ देता है; हिन्दी में सर्वनाम ‘उसे’ सामूहिक ‘सामान’ से मेल खाता है।
- source_word: ὁ ἐν ἀγρῷ
  choice: जो खेत में हो
  rationale: यह प्रतिनिधि व्यक्ति को पहचानने वाला संक्षिप्त और पहले खंड के समानांतर रूप है।
- source_word: ὁμοίως
  choice: उसी तरह
  rationale: यह दूसरे निषेध को पहले से स्वाभाविक और स्पष्ट ढंग से जोड़ता है।
- source_word: μὴ ἐπιστρεψάτω εἰς τὰ ὀπίσω
  choice: पीछे छूटी हुई चीज़ों के लिए न लौटे
  rationale: ἐπιστρέφω लौटने का और εἰς τὰ ὀπίσω पीछे की ओर अथवा पीछे की वस्तुओं का बोध देता है। यह अनुवाद हिन्दी में स्वाभाविक रहते हुए वस्तु-सदृश बहुवचन τὰ ὀπίσω के निहित संकेत को बचाता है; केवल ‘पीछे न लौटे’ भी संभव है।
theological_decisions:
- issue: अंत-कालीन तात्कालिकता का दृश्य
  choice: छत से नीचे न उतरने और पीछे छूटी चीज़ों के लिए न लौटने की ठोस आज्ञाओं को बनाए रखा गया है।
  alternative: इसे सामान्य रूप से संपत्ति से मोह न रखने की शिक्षा के रूप में भावानुवाद करना।
  rationale: यूनानी पाठ ‘उस दिन’ से जुड़ा एक सजीव और तात्कालिक दृश्य प्रस्तुत करता है। ठोस आज्ञाओं को बनाए रखने से पाठ का तनाव सुरक्षित रहता है और कोई व्यापक नैतिक व्याख्या अनुवाद में नहीं जोड़ी जाती।
- issue: εἰς τὰ ὀπίσω का अर्थ
  choice: पीछे छूटी हुई चीज़ों के लिए
  alternative: पीछे न लौटे
  rationale: मूल पद का शाब्दिक स्वरूप ‘पीछे की ओर/पीछे की चीज़ों की ओर’ दोनों की गुंजाइश रखता है। मुख्य पाठ में प्रसंगानुकूल वस्तु-संबंधी संकेत रखा गया है और संक्षिप्त विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और तात्कालिक शैली। ‘घर की छत’ साधारण पाठक के लिए स्पष्ट है; ‘पीछे छूटी हुई चीज़ों’ से यूनानी अभिव्यक्ति की संभावित वस्तु-संबंधी धारणा बचती है, जबकि पादटिप्पणी अधिक संक्षिप्त पाठ देती है।
