source:
  edition: SBLGNT
  text: καὶ ἀποκριθέντες λέγουσιν αὐτῷ· Ποῦ, κύριε; ὁ δὲ εἶπεν αὐτοῖς· Ὅπου τὸ σῶμα, ἐκεῖ ⸂καὶ οἱ ἀετοὶ ἐπισυναχθήσονται⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/037.yaml
  text: And answering[a], they say to him, “Where, Lord?” And he said to them, “Where the body is[b], there also the vultures will be gathered.”
translation:
  language: hi
  text: उन्होंने उत्तर दिया, “प्रभु, कहाँ?” उसने उनसे कहा, “जहाँ शरीर[a] है, वहाँ गिद्ध[b] भी इकट्ठे हो जाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शरीर” का अनुवाद “शव” भी किया जा सकता है; इससे मृत देह का चित्र अधिक स्पष्ट हो जाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उकाब।” यूनानी शब्द उकाब को भी सूचित कर सकता है, पर शरीर के पास पक्षियों के एकत्र होने के इस प्रसंग में “गिद्ध” सम्भावित आशय अधिक स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθέντες
  choice: उत्तर में
  rationale: यह कृदन्त शिष्यों की प्रतिक्रिया का परिचय देता है। ‘उत्तर में’ हिन्दी में स्वाभाविक है और वाक्य को अनावश्यक रूप से भारी बनाए बिना यूनानी रचना का भाव रखता है।
- source_word: λέγουσιν
  choice: वे उससे कहते हैं
  rationale: यूनानी का ऐतिहासिक वर्तमान कथा की सजीवता बनाए रखता है; इसलिए हिन्दी में भी वर्तमान काल रखा गया है।
- source_word: Ποῦ
  choice: कहाँ
  rationale: यह स्थान पूछने वाला संक्षिप्त क्रियाविशेषण है; ‘कहाँ?’ उसका सीधा और स्वाभाविक रूप है।
- source_word: κύριε
  choice: प्रभु
  rationale: यीशु को संबोधित करते समय κύριε के लिए ‘प्रभु’ वर्तमान हिन्दी बाइबलीय प्रयोग में स्वाभाविक और गरिमापूर्ण है।
- source_word: Ὅπου
  choice: जहाँ
  rationale: यह लोकोक्तिपरक कथन की सामान्य स्थान-सूचक रचना को बनाए रखता है, बिना ‘जहाँ कहीं’ जैसी अतिरिक्त व्यापकता जोड़े।
- source_word: σῶμα
  choice: शरीर
  rationale: σῶμα का सीधा अर्थ ‘शरीर’ है। प्रसंग मृत शरीर का संकेत देता है, पर मुख्य पाठ में ‘शव’ करने से अधिक स्पष्टता जुड़ जाती; उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: ἀετοὶ
  choice: गिद्ध
  rationale: शरीर के पास एकत्र होने वाले पक्षियों के इस चित्र में ‘गिद्ध’ सम्भावित आशय को आधुनिक पाठक तक अधिक स्पष्ट रूप से पहुँचाता है। यूनानी शब्द ‘उकाब’ भी सूचित कर सकता है, इसलिए वह विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἐπισυναχθήσονται
  choice: इकट्ठे हो जाएँगे
  rationale: यह हिन्दी में स्वाभाविक ढंग से भविष्यकालीन एकत्रीकरण व्यक्त करता है और कर्ता या कराने वाले को निर्दिष्ट नहीं करता। इस प्रकार यूनानी कर्मवाच्य की अनिर्दिष्टता बनी रहती है।
theological_decisions:
- issue: न्याय-संबंधी लोकोक्ति के संकेत का अर्थ
  choice: चित्र को ज्यों का त्यों रखा गया है और उसके ऐतिहासिक या युगान्तकारी संकेत को स्पष्ट नहीं किया गया।
  alternative: इसे रोमी सेनाओं, अन्तिम न्याय, या न्याय और विनाश की अनिवार्यता के किसी सामान्य सिद्धान्त का स्पष्ट संकेत बताना।
  rationale: यूनानी पाठ स्वयं इस चित्र के सटीक संकेत की पहचान नहीं करता। किसी एक व्याख्या को अनुवाद में जोड़ने से वास्तविक धर्मवैचारिक तनाव समाप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले कथन में यूनानी ऐतिहासिक वर्तमान को बनाए रखा गया है, जबकि यीशु के उत्तर में यूनानी भूतकाल के अनुसार ‘कहा’ है। लोकोक्तिपरक और रहस्यमय स्वर को किसी विशिष्ट व्याख्या से नहीं बाँधा गया।
