source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος· Εἰ ἔχετε πίστιν ὡς κόκκον σινάπεως, ἐλέγετε ἂν τῇ συκαμίνῳ ταύτῃ· Ἐκριζώθητι καὶ φυτεύθητι ἐν τῇ θαλάσσῃ· καὶ ὑπήκουσεν ἂν ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/006.yaml
  text: And the Lord said[a], “If you had faith like a mustard seed, you would say to this mulberry tree, ‘Be uprooted and be planted in the sea,’ and it would obey you.”
translation:
  language: hi
  text: प्रभु ने कहा, “यदि तुममें राई के दाने जैसा विश्वास होता, तो तुम इस शहतूत के पेड़[a] से कहते, ‘जड़ से उखड़ जा और समुद्र में रोप दिया जा,’ और वह तुम्हारी बात मान लेता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द शहतूत की एक जाति के पेड़ के लिए है; परंपरागत अनुवाद में इसे कभी-कभी ‘सिकामीन का पेड़’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: लूका के वर्णन में यह यीशु के लिए प्रयुक्त सम्मानसूचक और मसीही पदवी है; आधुनिक हिन्दी बाइबल-भाषा में ‘प्रभु’ इसका स्वाभाविक समतुल्य है।
- source_word: πίστιν
  choice: विश्वास
  rationale: यहाँ आशय परमेश्वर पर भरोसे से है, न कि मुख्यतः निष्ठा या विश्वसनीयता से; ‘विश्वास’ अर्थ और धार्मिक संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὡς κόκκον σινάπεως
  choice: राई के दाने जैसा
  rationale: ὡς की उपमा को बनाए रखा गया है; ‘जितना छोटा’ जोड़कर तुलना को केवल आकार तक सीमित नहीं किया गया।
- source_word: συκαμίνῳ
  choice: शहतूत का पेड़
  rationale: συκάμινος शहतूत की जाति के पेड़ को सूचित करता है; ‘शहतूत’ आधुनिक हिन्दी पाठक के लिए स्पष्ट है और इसे गूलर अथवा सिकमोर-अंजीर से नहीं मिलाता।
- source_word: ἐλέγετε ἂν
  choice: तुम ... कहते
  rationale: अपूर्ण भूतकाल के साथ ἄν काल्पनिक परिणाम व्यक्त करता है; हिन्दी में ‘यदि ... होता, तो ... कहते’ उसी संभाव्य/प्रतितथ्यात्मक बल को स्वाभाविक रूप से दर्शाता है।
- source_word: Ἐκριζώθητι
  choice: जड़ से उखड़ जा
  rationale: यह यूनानी निष्क्रिय आज्ञार्थ का स्पष्ट और मुहावरेदार हिन्दी रूप है तथा जड़ समेत उखड़ने की तीव्र छवि बनाए रखता है।
- source_word: φυτεύθητι ἐν τῇ θαλάσσῃ
  choice: समुद्र में लग जा
  rationale: ‘लग जा’ हिन्दी में पेड़ लगाए जाने का स्वाभाविक निष्क्रिय भाव देता है और समुद्र में रोपे जाने की विरोधाभासी छवि को बिना व्याख्या जोड़े सुरक्षित रखता है।
- source_word: ὑπήκουσεν ἂν ὑμῖν
  choice: वह तुम्हारी बात मान लेता
  rationale: यह आज्ञा मानने के अर्थ को सहज हिन्दी में व्यक्त करता है और पेड़ के मानवीकरण को बनाए रखता है।
theological_decisions:
- issue: चमत्कार-वचन में πίστις का अर्थ
  choice: विश्वास
  alternative: भरोसा; निष्ठा
  rationale: संदर्भ असंभव प्रतीत होने वाली बात के लिए परमेश्वर पर भरोसे की ओर संकेत करता है; यहाँ नैतिक स्थिरता या वाचा-निष्ठा प्रमुख अर्थ नहीं है।
- issue: शर्त का प्रतितथ्यात्मक या खुला स्वर
  choice: यदि तुममें ... विश्वास होता, तो ... कहते
  alternative: यदि तुममें ... विश्वास है, तो ... कहोगे
  rationale: εἰ ἔχετε में वर्तमान सूचक रूप है, पर परिणाम-वाक्यों में अपूर्ण भूतकाल और ἄν काल्पनिक, संभवतः प्रतितथ्यात्मक, बल देते हैं। हिन्दी का यह रूप उस तनाव को स्वाभाविक ढंग से व्यक्त करता है, बिना यह घोषित किए कि शिष्यों में कोई विश्वास था ही नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘राई के दाने जैसा’ उपमा को अक्षुण्ण रखता है, जबकि ‘जड़ से उखड़ जा’ और ‘समुद्र में लग जा’ आज्ञाओं की सजीवता तथा असंभवता को सामान्य हिन्दी में व्यक्त करते हैं।
