  text: And he said to him[a], “Rise and go[b]; your faith has saved you.”
translation:
  language: hi
  text: और उसने उससे कहा, “उठकर जा; तेरे विश्वास[b] ने तेरा उद्धार किया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरे विश्वास ने तुझे स्वस्थ किया है” अथवा “तेरे विश्वास ने तुझे चंगा किया है।” यूनानी क्रिया बचाव, चंगाई या उद्धार का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरे भरोसे ने।” “विश्वास” के लिए प्रयुक्त यूनानी शब्द भरोसा या विश्वासयोग्यता भी व्यक्त कर सकता है, यद्यपि यहाँ “विश्वास” मुख्य अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν αὐτῷ
  choice: उसने उससे कहा
  rationale: साधारण कथात्मक अभिव्यक्ति है; सर्वनाम चंगा किए गए सामरी की ओर संकेत करता है, बिना अनावश्यक व्याख्या जोड़े।
- source_word: Ἀναστὰς πορεύου
  choice: उठकर जा
  rationale: ἀναστάς का क्रियाविशेषणात्मक-आज्ञार्थक बल और πορεύου की सीधी आज्ञा संक्षिप्त तथा स्वाभाविक हिन्दी में सुरक्षित रहती है।
- source_word: πίστις
  choice: विश्वास
  rationale: इस प्रसंग में यह यीशु पर उस व्यक्ति के भरोसे को व्यक्त करता है; ‘भरोसा’ सम्भव है, जबकि ‘विश्वासयोग्यता’ यहाँ कम सम्भावित है।
- source_word: σέσωκέν σε
  choice: तेरा उद्धार किया है
  rationale: σῴζω बचाने, चंगा करने या स्वस्थ करने का अर्थ दे सकता है। पूर्णकाल के स्थायी परिणाम और दसों के शुद्ध होने के बाद इस एक व्यक्ति से कही गई बात के व्यापक अर्थ को बनाए रखने के लिए ‘उद्धार किया है’ चुना गया।
theological_decisions:
- issue: चंगाई के प्रसंग में σέσωκέν σε का अर्थ
  choice: तेरा उद्धार किया है
  alternative: तुझे स्वस्थ किया है; तुझे चंगा किया है
  rationale: क्रिया शारीरिक चंगाई भी बता सकती है, पर कथा में दसों के शुद्ध होने और केवल इस व्यक्ति के लौटकर परमेश्वर की महिमा करने के बीच का अंतर व्यापक उद्धारार्थक संकेत की सम्भावना बनाए रखता है। मुख्य पाठ उस तनाव को संकुचित नहीं करता।
- issue: πίστις का आशय
  choice: विश्वास
  alternative: भरोसा; विश्वासयोग्यता
  rationale: ‘विश्वास’ प्रचलित और पर्याप्त व्यापक हिन्दी समतुल्य है। यहाँ ‘भरोसा’ अर्थतः सम्भव है; ‘विश्वासयोग्यता’ व्याकरणतः सम्भव होते हुए भी प्रसंग में कम सम्भावित है।
