  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। यीशु और उस व्यक्ति के बीच एकवचन निकट संबोधन के लिए ‘तेरा/तुझे’ रखा गया है। पादटिप्पणी-चिह्न वाक्य के अंत में रखे गए हैं क्योंकि वे क्रमशः ‘उद्धार’ और ‘विश्वास’ की व्याख्या करते हैं।
