  text: Καὶ ἐγένετο ἐν τῷ ⸀πορεύεσθαι εἰς Ἰερουσαλὴμ καὶ αὐτὸς διήρχετο διὰ ⸀μέσον Σαμαρείας καὶ Γαλιλαίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/011.yaml
  text: And it happened that[a], as he was going to Jerusalem, he was passing through the midst of Samaria and Galilee.
translation:
  language: hi
  text: और ऐसा हुआ कि यरूशलेम जाते समय वह सामरिया और गलील के बीच से होकर[a] जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पदबंध का अर्थ दोनों प्रदेशों के बीच से जाना या उन्हें अलग करनेवाले सीमावर्ती क्षेत्र से होकर जाना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: यह लूका की सामान्य कथात्मक भूमिका है। ‘ऐसा हुआ’ उसके घटना-परिचायक कार्य को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ πορεύεσθαι
  choice: जाते समय
  rationale: ἐν के साथ प्रयुक्त संज्ञार्थक धातुरूप साथ-साथ चल रही क्रिया का समय बताता है; ‘जाते समय’ इस निरंतर यात्रा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: εἰς गंतव्य की ओर गति दिखाता है; ‘यरूशलेम जाते समय’ हिन्दी में उस दिशा और गंतव्य दोनों को स्पष्ट करता है।
- source_word: αὐτός
  choice: वह
  rationale: यूनानी में कर्ता-सर्वनाम स्पष्ट है और हल्का बल दे सकता है, पर यहाँ ‘वह स्वयं’ कहना हिन्दी में अनावश्यक जोर पैदा करेगा।
- source_word: διήρχετο
  choice: से होकर जा रहा था
  rationale: अपूर्ण भूतकाल निरंतर गतिशील क्रिया को दिखाता है; यह चयन प्रगतिशील पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: διὰ μέσον
  choice: के बीच से होकर
  rationale: यह पदबंध दो प्रदेशों के बीच अथवा उनके सीमावर्ती क्षेत्र से होकर जाने का भाव दे सकता है। मुख्य पाठ में सुबोध अभिव्यक्ति रखी गई है और भौगोलिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: Σαμαρείας καὶ Γαλιλαίας
  choice: सामरिया और गलील
  rationale: स्थान-नामों का प्रचलित हिन्दी रूप और यूनानी क्रम बनाए रखा गया है।
