  source_fidelity: ‘और ऐसा हुआ कि’ adequately reflects Luke’s narrative formula Καὶ ἐγένετο. ‘यरूशलेम जाते समय’ correctly conveys the contemporaneous articular infinitive ἐν τῷ πορεύεσθαι, and ‘जा रहा था’ appropriately represents the imperfect διήρχετο. ‘सामरिया और गलील के बीच से होकर’ preserves the Greek word order and the geographically disputed force of διὰ μέσον without resolving it beyond the evidence.
