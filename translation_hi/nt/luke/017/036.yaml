  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह पद सबसे प्राचीन यूनानी हस्तलिपियों में नहीं मिलता—इनमें चौथी शताब्दी की सिनैटिकस और वैटिकनस हस्तलिपियाँ भी शामिल हैं—और आरंभिक कॉप्टिक अनुवादों में भी अनुपस्थित है। पर यह पश्चिमी पाठ-परंपरा (जैसे पाँचवीं शताब्दी की कोडेक्स बेज़े), अधिकांश बाइज़न्टाइन हस्तलिपियों और लैटिन वुल्गाता में मिलता है। संभवतः बाद के नकलनवीसों ने इसे मत्ती 24:40 के अनुरूप बनाने के लिए जोड़ा।
