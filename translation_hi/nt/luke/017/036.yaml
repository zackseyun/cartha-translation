lexical_decisions:
- source_word: δύο
  choice: दो
  rationale: यूनानी में संज्ञा व्यक्त नहीं है; ‘दो’ अपने आप व्यक्तियों का बोध कराता है और अनावश्यक रूप से ‘पुरुष’ जोड़ने से बचता है।
- source_word: παραληφθήσεται
  choice: साथ ले लिया जाएगा
  rationale: भविष्यकालीन कर्मवाच्य रूप निकट संगति में साथ लिए जाने या ग्रहण किए जाने का संकेत दे सकता है; ‘साथ ले लिया जाएगा’ इस अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना गंतव्य या अंतिम परिणाम निश्चित किए।
- source_word: ἀφεθήσεται
  choice: छोड़ दिया जाएगा
  rationale: यहाँ कर्मवाच्य रूप पहले व्यक्ति को साथ लिए जाने के विपरीत दूसरे के वहीं छोड़ दिए जाने को व्यक्त करता है।
- source_word: ὁ ἕτερος
  choice: दूसरे को
  rationale: पहले बताए गए दो व्यक्तियों में से शेष व्यक्ति का स्पष्ट संकेत है; हिन्दी में विभक्ति-संगति के लिए ‘दूसरे को’ स्वाभाविक है।
theological_decisions:
- issue: किसे उद्धार या न्याय के लिए लिया अथवा छोड़ा जाता है
  choice: अनुवाद में परिणाम को अनिर्धारित रखा गया है
  alternative: ‘बचा लिया जाएगा’ या ‘न्याय के लिए उठा लिया जाएगा’ जैसे व्याख्यात्मक अनुवाद
  rationale: पद के क्रियापद स्वयं लिए और छोड़े गए व्यक्ति के अंतिम भाग्य को स्पष्ट नहीं करते; इसलिए वास्तविक व्याख्यात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यूनानी पाठ की संक्षिप्त समांतर रचना सुरक्षित रखी गई है। ‘दो पुरुष’ के बजाय केवल ‘दो’ रखा गया है, क्योंकि मूल में लिंग-सूचक संज्ञा नहीं है।
