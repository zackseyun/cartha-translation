  text: ἤσθιον, ἔπινον, ἐγάμουν, ⸀ἐγαμίζοντο, ἄχρι ἧς ἡμέρας εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν, καὶ ἦλθεν ὁ κατακλυσμὸς καὶ ἀπώλεσεν ⸀πάντας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/027.yaml
  text: They were eating[a], they were drinking, they were marrying, they were being given in marriage, until the day Noah entered into the ark, and the flood came and destroyed them all.
translation:
  language: hi
  text: वे खाते थे, पीते थे, विवाह करते थे और विवाह के लिए दिए जाते थे[a], उस दिन तक जब नूह ने जहाज़ में प्रवेश किया; फिर जलप्रलय आया और उसने उन सबको नष्ट कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक संक्षेप में, “विवाह करते थे और उनका विवाह कराया जाता था।” यूनानी में दो अलग क्रियाएँ हैं: एक सक्रिय (“विवाह करते थे”) और दूसरी निष्क्रिय (“विवाह के लिए दिए जाते थे”)।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἤσθιον, ἔπινον
  choice: वे खाते थे, पीते थे
  rationale: दोनों अपूर्णकालिक क्रियाएँ अतीत में चलती या बार-बार होती सामान्य गतिविधियों को दिखाती हैं; हिन्दी में ‘खाते थे, पीते थे’ उसी पक्ष को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐγάμουν
  choice: विवाह करते थे
  rationale: सक्रिय क्रिया विवाह करने को व्यक्त करती है। बहुवचन प्रसंग में इसे लिंग-विशेष तक सीमित किए बिना सामान्य रूप में रखा गया है।
- source_word: ἐγαμίζοντο
  choice: विवाह में दिए जाते थे
  rationale: निष्क्रिय रूप को बनाए रखने से पहले विवाह-संबंधी क्रिया से इसका भेद सुरक्षित रहता है और यूनानी पाठ की सामाजिक अभिव्यक्ति अनावश्यक रूप से एक ही वाक्यांश में नहीं समाती।
- source_word: ἄχρι ἧς ἡμέρας
  choice: उस दिन तक जब
  rationale: यह पदबंध सामान्य जीवन की इन गतिविधियों की समय-सीमा बताता है और आधुनिक हिन्दी में सहज है।
- source_word: εἰσῆλθεν Νῶε εἰς τὴν κιβωτόν
  choice: नूह जहाज़ में गया
  rationale: यह पूर्ण कथात्मक घटना है। नूह के प्रसंग में ‘जहाज़’ κιβωτός के पारंपरिक और स्पष्ट आशय को व्यक्त करता है; हिन्दी में ‘में गया’ स्वाभाविक है।
- source_word: ὁ κατακλυσμός
  choice: जलप्रलय
  rationale: यह शब्द नूह से जुड़े महाविनाशकारी बाढ़-प्रसंग को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἀπώλεσεν πάντας
  choice: उसने उन सबको नष्ट कर दिया
  rationale: क्रिया का कर्ता जलप्रलय है और πάντας सभी लोगों की समग्रता बताता है; ‘उन सबको’ निहित मानवीय कर्म को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: विवाह से जुड़ी दोनों यूनानी क्रियाओं का अलग-अलग अनुवाद
  choice: विवाह करते थे और विवाह में दिए जाते थे
  alternative: विवाह करते थे और उनके विवाह होते थे
  rationale: मूल पाठ एक सक्रिय और एक निष्क्रिय क्रिया का प्रयोग करता है। दोनों का भेद बनाए रखने से सामान्य सामाजिक जीवन के चलते रहने का चित्र सुरक्षित रहता है और पाठ में अतिरिक्त धर्मवैचारिक अर्थ नहीं जोड़ा जाता।
- issue: आरंभिक क्रियाओं का अपूर्णकालिक पक्ष
  choice: खाते थे, पीते थे, विवाह करते थे, दिए जाते थे
  alternative: खाया, पिया, विवाह किया, विवाह में दिए गए
  rationale: यूनानी अपूर्णकाल यहाँ जारी या प्रचलित गतिविधियों को चित्रित करता है। हिन्दी का ‘करते थे’ वाला रूप इस बात को बनाए रखता है कि सामान्य जीवन अचानक आए न्याय तक चलता रहा।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। क्रियाओं की पुनरावृत्ति मूल के अपूर्णकालिक प्रभाव को बनाए रखती है; विवाह-संबंधी निष्क्रिय अभिव्यक्ति कुछ औपचारिक होते हुए भी मूल का महत्वपूर्ण भेद सुरक्षित करती है।
