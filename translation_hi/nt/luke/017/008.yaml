reference: Luke 17:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀλλ’ οὐχὶ ἐρεῖ αὐτῷ· Ἑτοίμασον τί δειπνήσω καὶ περιζωσάμενος διακόνει μοι ἕως φάγω καὶ πίω, καὶ μετὰ ταῦτα φάγεσαι καὶ πίεσαι σύ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/017/008.yaml
  text: On the contrary[a], will he not say to him, ‘Prepare my supper, and gird yourself and serve me until I have eaten and drunk[b], and after that you will eat and drink’?”
translation:
  language: hi
  text: बल्कि क्या वह उससे यह नहीं कहेगा, “मेरे लिए रात का भोजन तैयार करो, कमर कसकर[a] मेरी सेवा करो, जब तक मैं खा-पी न चुकूँ[b], और उसके बाद तुम खाओगे और पियोगे”?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी कमर बाँधकर।” इसका आशय काम करने के लिए अपने लंबे वस्त्रों को समेटकर कमर पर बाँधना है।
    reason: cultural_note
  - marker: b
    text: इसका अनुवाद “जब तक मैं खाऊँ और पीऊँ” भी हो सकता है। “खा-पी न चुकूँ” सेवक की बारी आने से पहले इन कार्यों के पूरा होने का भाव स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλ’ οὐχὶ
  choice: बल्कि क्या ... नहीं
  rationale: ἀλλά पिछले कथन के विपरीत सामान्यतः अपेक्षित व्यवहार प्रस्तुत करता है, और οὐχί वाला प्रश्न सकारात्मक उत्तर की अपेक्षा रखता है। यह हिन्दी संरचना दोनों बातों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ἐρεῖ αὐτῷ
  choice: वह उससे यह नहीं कहेगा
  rationale: भविष्यकाल और अप्रत्यक्ष कर्म दोनों को स्पष्ट रखते हुए प्रत्यक्ष कथन की भूमिका स्वाभाविक हिन्दी में दी गई है।
- source_word: Ἑτοίμασον τί δειπνήσω
  choice: मेरे लिए रात का भोजन तैयार करो
  rationale: δειπνέω सामान्यतः दिन के मुख्य या संध्याकालीन भोजन को सूचित करता है। प्रसंग में भोजन तैयार करने का आदेश है; यह रूप हिन्दी में स्पष्ट और सहज है।
- source_word: περιζωσάμενος
  choice: कमर कसकर
  rationale: यह कपड़ों को काम के लिए कमर पर बाँधने की ठोस प्राचीन क्रिया को हिन्दी के निकटतम स्वाभाविक मुहावरे में व्यक्त करता है; सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: διακόνει μοι
  choice: मेरी सेवा करो
  rationale: यहाँ क्रिया भोजन परोसने और मेज़ पर सेवा करने के अर्थ में है। ‘सेवा करो’ स्पष्ट है और अनावश्यक धार्मिक अर्थ नहीं जोड़ता।
- source_word: ἕως φάγω καὶ πίω
  choice: जब तक मैं खा-पी न चुकूँ
  rationale: ἕως के साथ आए अओरिस्ट सब्जंक्टिव सेवक की बारी से पहले मालिक के खाने-पीने की पूर्णता को लक्ष्य बनाते हैं। ‘न चुकूँ’ उस परिणति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: μετὰ ταῦτα
  choice: उसके बाद
  rationale: कालक्रम को संक्षिप्त और सहज रूप से व्यक्त करता है।
- source_word: φάγεσαι καὶ πίεσαι σύ
  choice: तुम खाओगे और पियोगे
  rationale: दोनों क्रियाओं का भविष्यकाल बनाए रखा गया है। स्पष्ट σύ का बल ‘तुम’ द्वारा सामने आता है और मालिक के बाद सेवक की बारी को रेखांकित करता है।
theological_decisions:
- issue: दृष्टान्त में सामाजिक भूमिका का नाम
  choice: इस पद में ‘दास’ या ‘सेवक’ संज्ञा न जोड़कर केवल सर्वनाम और आदेश रखे गए हैं।
  alternative: संदर्भ की स्पष्टता के लिए ‘उस सेवक’ या ‘उस दास’ जोड़ना।
  rationale: आसपास का प्रसंग δοῦλος के विषय में है, पर इस पद में स्वयं संज्ञा नहीं, केवल αὐτῷ और σύ हैं। मूल पद की अभिव्यक्ति बनाए रखने से सामाजिक संबंध आदेशों और क्रम से स्पष्ट होता है, बिना कोई अनुपस्थित संज्ञा जोड़े।
- issue: मालिक और अधीनस्थ के बीच हिन्दी संबोधन
  choice: ‘तुम’ और उसके अनुरूप क्रियारूप
  alternative: सामाजिक दूरी दिखाने के लिए ‘तू’ का प्रयोग।
  rationale: ग्रीक एकवचन और भूमिका-संबंध को बनाए रखते हुए ‘तुम’ आधुनिक मानक हिन्दी में स्वाभाविक और पठनीय है। ‘तू’ मूल पाठ में निहित से अधिक अपमानजनक भाव ला सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में आदेश स्पष्ट हैं; ‘कमर कसकर’ प्राचीन सांस्कृतिक चित्र को परिचित हिन्दी मुहावरे के माध्यम से सुरक्षित रखता है।
