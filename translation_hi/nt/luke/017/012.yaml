  yaml_path: translation/nt/luke/017/012.yaml
  text: And as he was entering a certain village[a], ten leprous men met him, who stood at a distance[b],
translation:
  language: hi
  text: जब वह किसी गाँव में प्रवेश कर रहा था, तो कोढ़ से पीड़ित दस पुरुष[a] उससे मिले, जो दूर खड़े थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दस कोढ़ी पुरुष।” यूनानी में शाब्दिक रूप से “दस कोढ़ी पुरुष” है; यह पद आधुनिक चिकित्सीय निदान के समान सटीक नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “कुछ दूरी पर” या “दूर से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰσερχομένου αὐτοῦ
  choice: जब वह … प्रवेश कर रहा था
  rationale: वर्तमान कृदंत के साथ संबंधकारक स्वतंत्र वाक्यांश समकालीन और जारी क्रिया व्यक्त करता है; यह रूप उस अपूर्ण पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: εἴς τινα κώμην
  choice: किसी गाँव में
  rationale: τινα अनिश्चितता व्यक्त करता है। आधुनिक हिन्दी में ‘किसी गाँव में’ स्वाभाविक है और किसी अज्ञात अथवा अनिर्दिष्ट गाँव का भाव बनाए रखता है।
- source_word: ἀπήντησαν
  choice: उससे मिले
  rationale: ἀπαντάω का सामान्य अर्थ ‘मिलना’ या ‘मिलने आना’ है। प्रसंग से अधिक गति आरोपित किए बिना ‘मिले’ संक्षिप्त और स्वाभाविक है।
- source_word: δέκα λεπροὶ ἄνδρες
  choice: कोढ़ से पीड़ित दस पुरुष
  rationale: यह व्यक्ति-केंद्रित और सहज आधुनिक हिन्दी है, जबकि पादटिप्पणी यूनानी के विशेषणात्मक रूप तथा प्राचीन रोग-श्रेणी की व्यापकता स्पष्ट करती है।
- source_word: οἳ ἔστησαν
  choice: वे … खड़े हो गए
  rationale: ἵστημι के भूतकालिक रूप को यहाँ ‘खड़े हो गए’ करना उनके दूरी बनाकर स्थान ग्रहण करने का स्वाभाविक हिन्दी वर्णन है; संबंधवाचक उपवाक्य को अलग वाक्य बनाने से पठनीयता बढ़ती है।
- source_word: πόρρωθεν
  choice: दूर ही
  rationale: यह स्थानिक दूरी को सहज हिन्दी में व्यक्त करता है; ‘ही’ उनके पास न आने पर हल्का स्वाभाविक बल देता है, बिना दूरी को निश्चित किए।
theological_decisions:
- issue: λεπροί में रोग का नाम
  choice: कोढ़ से पीड़ित
  alternative: कोढ़ी पुरुष; गंभीर चर्मरोग से पीड़ित पुरुष
  rationale: ‘कोढ़’ पाठकों के लिए पहचाना हुआ बाइबलीय पद है, पर इसे आधुनिक हैन्सन रोग का सटीक चिकित्सीय निदान नहीं माना जाना चाहिए। व्यक्ति-केंद्रित वाक्यांश कलंककारी संज्ञा से बचता है, और पादटिप्पणी मूल शब्द की व्यापक प्राचीन रोग-श्रेणी को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संयुक्त यूनानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, पर घटनाक्रम और संबंध सुरक्षित हैं। रोग-संबंधी पद को व्यक्ति-केंद्रित बनाया गया है और चिकित्सा-संबंधी संभावित अतिनिर्धारण पादटिप्पणी में स्पष्ट किया गया है।
