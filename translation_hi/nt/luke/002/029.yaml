reference: Luke 2:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Νῦν ἀπολύεις τὸν δοῦλόν σου, δέσποτα, κατὰ τὸ ῥῆμά σου ἐν εἰρήνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/029.yaml
  text: Now you are dismissing your servant[a], Master, according to your word[b], in peace.
translation:
  language: hi
  text: “हे स्वामी, अब आप अपने वचन के अनुसार अपने दास[a] को शांति से विदा कर रहे हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’। यूनानी शब्द δοῦλος का अर्थ ‘दास’ या ‘सेवक’ हो सकता है; यहाँ ‘स्वामी’ संबोधन के साथ दास और स्वामी का संबंध विशेष रूप से स्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: भाव यह है कि शिमोन अब शांति से इस जीवन से विदा होने के लिए तैयार है; फिर भी यूनानी में अधिक शाब्दिक रूप से ‘छोड़ना’, ‘मुक्त करना’ या ‘विदा करना’ कहा गया है, ‘मरना’ नहीं।
    reason: alternative_reading
lexical_decisions:
- source_word: Νῦν
  choice: अब
  rationale: यह समयवाचक क्रिया-विशेषण शिमोन की प्रतीक्षा के वर्तमान में पूरा होने को दर्शाता है; ‘अब’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ἀπολύεις
  choice: विदा कर रहे हैं
  rationale: वर्तमानकालीन क्रिया का मूल भाव छोड़ने, मुक्त करने या विदा करने का है। इस प्रसंग में ‘विदा कर रहे हैं’ स्वाभाविक हिन्दी है और मृत्यु का संकेत बनाए रखता है, पर उसे मूल यूनानी से अधिक स्पष्ट नहीं करता।
- source_word: τὸν δοῦλόν σου
  choice: अपने दास
  rationale: δοῦλος सेवा के साथ अधीनता और स्वामित्व-संबंध भी व्यक्त कर सकता है। निकटवर्ती संबोधन δέσποτα (‘स्वामी’) के साथ ‘दास’ इस संबंध को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: δέσποτα
  choice: हे स्वामी
  rationale: δέσποτα अधिकार रखने वाले स्वामी के लिए संबोधन है। ‘हे स्वामी’ प्रार्थना में स्वाभाविक है और ‘दास’ के साथ मूल पाठ का संबंध बनाए रखता है।
- source_word: κατὰ τὸ ῥῆμά σου
  choice: आपके वचन के अनुसार
  rationale: κατά यहाँ अनुरूपता दर्शाता है और ῥῆμα बोले गए वचन या प्रतिज्ञा की ओर संकेत कर सकता है। यह रूप निकटार्थी होने के साथ हिन्दी में सहज है।
- source_word: ἐν εἰρήνῃ
  choice: शांति से
  rationale: यूनानी पदबंध का भाव शांतिपूर्ण विदाई है। हिन्दी में ‘शांति से’ स्वाभाविक है और शांति के धार्मिक-भावात्मक संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: क्या शिमोन के कथन को मृत्यु का स्पष्ट उल्लेख बनाकर अनूदित किया जाए
  choice: मुख्य पाठ में ‘विदा कर रहे हैं’ रखकर प्रस्थान/मुक्ति का रूपक सुरक्षित रखा गया है।
  alternative: ‘अब आप अपने दास को शांति से मरने दे रहे हैं।’
  rationale: प्रसंग में शिमोन की मृत्यु के लिए तत्परता निहित है, पर ἀπολύω स्वयं ‘मरना’ नहीं, बल्कि छोड़ना, मुक्त करना या विदा करना कहता है। इसलिए मृत्यु को मुख्य पाठ में स्पष्ट कर देना मूल की काव्यात्मक और धर्मवैचारिक व्यापकता को अनावश्यक रूप से सीमित करेगा।
- issue: δοῦλος और δέσποτα के पारस्परिक संबंध को हिन्दी में कैसे रखा जाए
  choice: ‘दास’ और ‘स्वामी’
  alternative: ‘सेवक’ और ‘प्रभु’
  rationale: ‘दास–स्वामी’ युग्म मूल पाठ में व्यक्त अधीनता और अधिकार के संबंध को स्पष्ट रखता है, जबकि ‘सेवक–प्रभु’ उस विशेष पारस्परिकता को कुछ हल्का कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ प्रयोग हुआ है। वाक्य सहज बनाने के लिए संबोधन आरम्भ में रखा गया है; अर्थगत क्रम और सभी प्रमुख यूनानी तत्व सुरक्षित हैं।
