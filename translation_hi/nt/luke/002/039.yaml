  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ὡς ἐτέλεσαν ⸀πάντα τὰ κατὰ τὸν νόμον κυρίου, ⸀ἐπέστρεψαν εἰς τὴν Γαλιλαίαν ⸀εἰς πόλιν ἑαυτῶν Ναζαρέθ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/039.yaml
  text: And when they had completed everything according to the law of the Lord[a], they returned to Galilee, to their own town[b], Nazareth.
translation:
  language: hi
  text: जब वे प्रभु की व्यवस्था के अनुसार सब कुछ पूरा कर चुके थे, तब वे गलील में अपने नगर[a] नासरत लौट गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द का अर्थ ‘नगर’ या ‘कस्बा’ हो सकता है; नासरत एक छोटी बस्ती थी।
    reason: cultural_note
lexical_decisions:
- source_word: ὡς
  choice: जब
  rationale: अओरिस्ट क्रिया के साथ यह मुख्य घटना का समय बताता है। ‘जब’ स्वाभाविक है और ‘जैसे ही’ जैसी अनावश्यक तात्कालिकता नहीं जोड़ता।
- source_word: ἐτέλεσαν
  choice: पूरा कर चुके
  rationale: यह निर्धारित कार्यों को पूर्ण करने का भाव देता है; यह ‘पूर्ति की’ जैसे संभावित भविष्यवाणी-संबंधी अर्थ से बचता है।
- source_word: πάντα τὰ κατὰ τὸν νόμον κυρίου
  choice: प्रभु की व्यवस्था के अनुसार सब कुछ
  rationale: यह यूनानी वाक्यांश के रूप और अर्थ के निकट रहते हुए उन सभी निर्धारित धार्मिक कार्यों की समग्रता व्यक्त करता है।
- source_word: νόμον κυρίου
  choice: प्रभु की व्यवस्था
  rationale: यह स्वाभाविक आधुनिक हिन्दी है और पवित्रशास्त्रीय भाषा का गरिमापूर्ण स्वर बनाए रखती है।
- source_word: κυρίου
  choice: प्रभु
  rationale: यहाँ शब्द परमेश्वर के लिए प्रयुक्त है; यूनानी κύριος का सीधा और प्रचलित हिन्दी रूप ‘प्रभु’ है।
- source_word: ἐπέστρεψαν
  choice: लौट गए
  rationale: यात्रा के संदर्भ में इसका स्वाभाविक अर्थ अपने स्थान को वापस जाना है।
- source_word: εἰς τὴν Γαλιλαίαν
  choice: गलील में
  rationale: हिन्दी में किसी क्षेत्र के भीतर स्थित गंतव्य की ओर लौटने के लिए ‘गलील में ... लौट गए’ अधिक स्वाभाविक है।
- source_word: εἰς πόλιν ἑαυτῶν
  choice: अपने नगर
  rationale: ἑαυτῶν का आत्मवाचक-स्वामित्व ‘अपने’ से सुरक्षित है। πόλις का मूल नगर-सूचक भाव मुख्य पाठ में रखा गया है।
- source_word: Ναζαρέθ
  choice: नासरत
  rationale: यह स्थान-नाम का मानक हिन्दी रूप है।
theological_decisions:
- issue: ‘प्रभु की व्यवस्था’ में ‘प्रभु’ का संदर्भ
  choice: ‘प्रभु’ यहाँ पवित्रशास्त्र में दी गई परमेश्वर की व्यवस्था के संदर्भ में परमेश्वर को दर्शाता है।
  alternative: इस प्रसंग में कोई महत्वपूर्ण वैकल्पिक धर्मवैज्ञानिक संदर्भ नहीं है।
  rationale: वाक्यांश को सीधे रूप में रखने से परिवार की व्यवस्था-अनुसार आज्ञाकारिता स्पष्ट होती है और कोई अतिरिक्त सिद्धान्त आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘व्यवस्था’ बाइबलीय νόμος के लिए परिचित शब्द है। ‘अपने नगर नासरत’ यूनानी संरचना को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
