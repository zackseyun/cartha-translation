    text: या ‘राष्ट्रों’। यूनानी शब्द सामान्य रूप से ‘राष्ट्रों’ को दर्शा सकता है, पर यहाँ इस्राएल के साथ रखे जाने के कारण सम्भवतः अन्यजातियों पर विशेष बल है।
