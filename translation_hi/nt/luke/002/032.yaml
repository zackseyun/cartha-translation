lexical_decisions:
- source_word: φῶς
  choice: एक ज्योति
  rationale: ‘ज्योति’ काव्यात्मक और गरिमापूर्ण रहते हुए सामान्य हिन्दी में बोधगम्य है; ‘एक’ इस विधेयात्मक वर्णन को स्वाभाविक हिन्दी रूप देता है।
- source_word: εἰς ἀποκάλυψιν
  choice: प्रकाश प्रकट करने के लिए
  rationale: यह पदबंध उद्देश्य/परिणाम और ἀποκάλυψις के अनावरण अथवा प्रकट किए जाने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐθνῶν
  choice: अन्यजातियों
  rationale: अगले पदबंध में इस्राएल के साथ स्पष्ट समानांतर-विरोध के कारण यहाँ गैर-यहूदी लोगों का आशय प्रमुख है।
- source_word: δόξαν
  choice: महिमा
  rationale: यह δόξα के गौरव और तेज दोनों से जुड़े बाइबलीय अर्थ-क्षेत्र को सुरक्षित रखता है।
- source_word: λαοῦ σου Ἰσραήλ
  choice: आपकी प्रजा इस्राएल
  rationale: यह इस्राएल को परमेश्वर की प्रजा के रूप में पहचानने वाली संबंधसूचक-अन्वयात्मक रचना को संक्षेप और स्पष्टता से रखता है।
- source_word: καὶ
  choice: और
  rationale: दो समानांतर वर्णनों को सीधे जोड़ता है।
theological_decisions:
- issue: ἐθνῶν का इस्राएल के संबंध में अर्थ
  choice: अन्यजातियों
  alternative: राष्ट्रों
  rationale: ἐθνῶν सामान्यतः ‘राष्ट्रों’ का अर्थ भी दे सकता है, पर ‘आपकी प्रजा इस्राएल’ के साथ इसका समानांतर प्रयोग यहाँ गैर-यहूदियों और इस्राएल के बीच संदर्भगत भेद को प्रमुख बनाता है। पादटिप्पणी व्यापक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शिमोन के काव्यात्मक कथन के अनुरूप गरिमापूर्ण शैली। ‘ज्योति’ और ‘महिमा’ बाइबलीय अनुगूँज बनाए रखते हैं, जबकि वाक्य सामान्य पाठक के लिए स्पष्ट है।
