  to: तब चरवाहे लौट गए[a] और जो कुछ उन्होंने सुना और देखा था, जैसा उनसे कहा गया था[c], उस सब के लिए[b] परमेश्वर की महिमा करते और उसकी स्तुति करते रहे।
