reference: Luke 2:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ὑπέστρεψαν οἱ ποιμένες δοξάζοντες καὶ αἰνοῦντες τὸν θεὸν ἐπὶ πᾶσιν οἷς ἤκουσαν καὶ εἶδον καθὼς ἐλαλήθη πρὸς αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/020.yaml
  text: And the shepherds returned[a], glorifying and praising God for all that they had heard and seen[c][b], just as it had been told to them.
translation:
  language: hi
  text: तब चरवाहे लौट गए[a] और जो कुछ उन्होंने सुना और देखा था, जैसा उनसे कहा गया था[c], उस सब के लिए[b] परमेश्वर की महिमा करते और उसकी स्तुति करते रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वापस चले गए।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘उस सब के कारण।’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘जैसा उनसे बोला गया था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπέστρεψαν
  choice: लौट गए
  rationale: यह क्रिया बताती है कि चरवाहे उस स्थान या काम की ओर वापस गए जहाँ से वे आए थे। ‘लौट गए’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी भूतकालीन क्रिया का अर्थ ठीक से व्यक्त करता है।
- source_word: οἱ ποιμένες
  choice: चरवाहे
  rationale: कथा में पहले उल्लेखित भेड़ों की रखवाली करनेवाले पुरुषों के लिए यह प्रचलित और स्पष्ट हिन्दी शब्द है।
- source_word: δοξάζοντες
  choice: महिमा ... करते रहे
  rationale: वर्तमान कृदंत लौटने के साथ जारी क्रिया को व्यक्त करता है। ‘महिमा करना’ δόξα से जुड़े भाव को बनाए रखता है।
- source_word: αἰνοῦντες
  choice: स्तुति करते रहे
  rationale: यह δοξάζοντες के निकटार्थी होते हुए भी अलग क्रिया है; इसलिए दोनों को एक ही अभिव्यक्ति में मिलाने के बजाय ‘महिमा और स्तुति’ रखा गया है।
- source_word: τὸν θεὸν
  choice: परमेश्वर
  rationale: यह दोनों कृदंतों का कर्म है। बाइबिलीय सन्दर्भ में ‘परमेश्वर’ स्वाभाविक, गरिमापूर्ण और स्पष्ट है।
- source_word: ἐπὶ πᾶσιν οἷς
  choice: उस सब के लिए
  rationale: ἐπί यहाँ स्तुति के आधार या अवसर का बोध कराता है। ‘के लिए’ मुख्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘के कारण’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: ἤκουσαν καὶ εἶδον
  choice: उन्होंने सुना और देखा था
  rationale: ‘था’ कथा के क्रम में इन अनुभवों का लौटने और स्तुति करने से पहले होना स्पष्ट करता है; यूनानी के दोनों अलग क्रियापद ‘सुना’ और ‘देखा’ सुरक्षित रखे गए हैं।
- source_word: καθὼς ἐλαλήθη πρὸς αὐτούς
  choice: ठीक वैसा ही जैसा उनसे कहा गया था
  rationale: ‘ठीक वैसा ही’ καθώς की अनुरूपता पर बल देता है। कर्मवाच्य प्रयोग वक्ता को अनकहा छोड़ता है, जैसा यूनानी पाठ में है।
theological_decisions:
- issue: क्या उस वक्ता को स्पष्ट रूप से ‘स्वर्गदूत’ कहा जाए जिसने चरवाहों से बात की थी
  choice: ‘जैसा उनसे कहा गया था’ कहकर कर्मवाच्य और अनकहे कर्ता को बनाए रखा गया है।
  alternative: ‘जैसा स्वर्गदूत ने उनसे कहा था’ या ‘जैसा स्वर्गदूतों ने उनसे कहा था।’
  rationale: निकटवर्ती सन्दर्भ स्वर्गदूतीय सन्देश की ओर संकेत करता है, पर इस पद के यूनानी वाक्य में बोलनेवाले का नाम नहीं है। इसलिए अनुवाद सन्दर्भ से मिलनेवाली पहचान को पद के शब्दों में जोड़कर अस्पष्टता को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। वाक्य को स्वाभाविक रखने के लिए मुख्य घटना पहले दी गई है और डैशों के भीतर καθώς वाला अनुरूपता-वाक्यांश रखा गया है। ‘करते रहे’ दोनों वर्तमान कृदंतों की साथ-साथ जारी क्रिया को व्यक्त करता है। ‘महिमा’ और ‘स्तुति’ का युग्म गरिमापूर्ण है, पर सामान्य हिन्दी पाठक के लिए परिचित भी है।
