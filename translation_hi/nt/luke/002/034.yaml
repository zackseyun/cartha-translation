language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εὐλόγησεν αὐτοὺς Συμεὼν καὶ εἶπεν πρὸς Μαριὰμ τὴν μητέρα αὐτοῦ· Ἰδοὺ οὗτος κεῖται εἰς πτῶσιν καὶ ἀνάστασιν πολλῶν ἐν τῷ Ἰσραὴλ καὶ εἰς σημεῖον ἀντιλεγόμενον,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/034.yaml
  text: And Simeon blessed them and said to Mary his mother, “Look, this one is appointed for the fall and rise of many in Israel, and for a sign that is opposed,[a]”
translation:
  language: hi
  text: और शिमोन ने उन्हें आशीर्वाद दिया और उसकी माता मरियम से कहा, “देखो, यह बालक इस्राएल में बहुतों के गिरने और उठने के लिए ठहराया गया है, और वह ऐसे चिन्ह के लिए भी ठहराया गया है जिसका विरोध किया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλόγησεν
  choice: आशीष दी
  rationale: यह सामान्य और गरिमापूर्ण हिन्दी में यूनानी क्रिया का सीधा अर्थ व्यक्त करता है।
- source_word: Ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले उद्गार का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: οὗτος
  choice: यह बालक
  rationale: संदर्भ में संकेत यीशु की ओर है; हिन्दी में केवल ‘यह’ की अपेक्षा ‘यह बालक’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: κεῖται εἰς
  choice: का कारण ठहराया गया है
  rationale: यह मुहावरा किसी नियत भूमिका या परिणाम के लिए रखे/ठहराए जाने का भाव देता है, जबकि गिरने-उठने का कर्ता स्वयं बालक नहीं बल्कि ‘बहुतों’ को रहने देता है।
- source_word: πτῶσιν καὶ ἀνάστασιν
  choice: गिरने और उठने
  rationale: मूल के ठोस और संभावित रूप से बहुअर्थी शब्दों को बिना धर्मवैज्ञानिक अर्थ सीमित किए समानांतर रूप में रखा गया है।
- source_word: σημεῖον ἀντιλεγόμενον
  choice: ऐसा चिन्ह ... जिसका विरोध किया जाएगा
  rationale: वर्तमान कृदंत का अर्थ विरोध का पात्र होने/बनने से है; हिन्दी में कर्मवाच्य वाक्यांश स्वाभाविक है और मूल तनाव बनाए रखता है।
theological_decisions:
- issue: ‘गिरने और उठने’ का आशय
  choice: रूपक को अनिर्दिष्ट रखा गया
  alternative: ‘पतन और उद्धार’ अथवा ‘मृत्यु और पुनरुत्थान’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि ये शब्द न्याय, उद्धार, पुनर्स्थापन या पुनरुत्थान में से किस विशेष अर्थ तक सीमित हैं; इसलिए धर्मवैज्ञानिक तनाव सुरक्षित रखा गया।
- issue: केῖται में नियति या नियुक्ति
  choice: ‘ठहराया गया है’
  alternative: ‘नियुक्त किया गया है’ या ‘रखा गया है’
  rationale: ‘ठहराया गया’ दैवी उद्देश्य की संभावना व्यक्त करता है, पर कर्ता का नाम जोड़कर मूल से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण बाइबलीय शैली। वाक्य-संरचना मूल यूनानी के समानांतर विचारों को बनाए रखते हुए हिन्दी में स्वाभाविक रखी गई है।
