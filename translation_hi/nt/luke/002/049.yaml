source:
  edition: SBLGNT
  text: καὶ εἶπεν πρὸς αὐτούς· Τί ὅτι ἐζητεῖτέ με; οὐκ ᾔδειτε ὅτι ἐν τοῖς τοῦ πατρός μου δεῖ εἶναί με;
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/049.yaml
  text: And he said to them[a], “Why were you looking for me? Did you not know that I must be in my Father’s house?”
translation:
  language: hi
  text: उसने उनसे कहा, “आप मुझे क्यों ढूँढ़ रहे थे? क्या आप नहीं जानते थे कि मुझे मेरे पिता के घर में[a] होना ही चाहिए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मुझे मेरे पिता के कामों या मामलों में होना चाहिए।” यूनानी में यहाँ संज्ञा अनकही है; शाब्दिक रूप से, “मेरे पिता की [चीज़ों] में।” इसलिए इसका अर्थ पिता का घर भी हो सकता है और पिता के काम या मामले भी।
    reason: alternative_reading
lexical_decisions:
- source_word: Τί ὅτι
  choice: क्यों
  rationale: यह यूनानी मुहावरा कारण पूछता है। सरल ‘क्यों’ आधुनिक हिन्दी में स्वाभाविक है और प्रश्न की शक्ति बनाए रखता है।
- source_word: ἐζητεῖτέ
  choice: ढूँढ़ रहे थे
  rationale: कथा के संदर्भ में माता-पिता यीशु को खोज रहे थे; अपूर्ण भूतकाल का भाव ‘ढूँढ़ रहे थे’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: οὐκ ᾔδειτε
  choice: क्या आप नहीं जानते थे
  rationale: यह मूल पाठ के ज्ञान अथवा जागरूकता-संबंधी आलंकारिक प्रश्न को सीधे बनाए रखता है।
- source_word: ἐν τοῖς τοῦ πατρός μου
  choice: अपने पिता के घर में
  rationale: यूनानी पदबंध में संज्ञा अनकही है। मंदिर के तत्काल प्रसंग में ‘पिता के घर में’ सबसे सम्भावित और सुबोध अर्थ है; ‘पिता के कामों/बातों में’ का सम्भव अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: δεῖ
  choice: होना ही चाहिए
  rationale: ‘ही चाहिए’ उस अनिवार्यता को व्यक्त करता है जो δεῖ में निहित है, और सामान्य हिन्दी में गरिमापूर्ण तथा स्वाभाविक है।
- source_word: εἶναί με
  choice: मुझे … होना
  rationale: δεῖ के साथ आए कर्मकारक कर्ता और infinitive को हिन्दी में स्वाभाविक रूप से ‘मुझे … होना चाहिए’ कहा गया है।
- source_word: πατρός μου
  choice: अपने पिता
  rationale: हिन्दी में कर्ता की ओर लौटता सम्बन्ध ‘अपने’ से स्वाभाविक रूप से व्यक्त होता है। प्रसंग में यह परमेश्वर की ओर संकेत करता है; अनुवाद इस पहचान को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
theological_decisions:
- issue: ἐν τοῖς τοῦ πατρός μου की दीर्घवृत्तात्मक और अस्पष्ट अभिव्यक्ति
  choice: मुख्य पाठ में ‘अपने पिता के घर में’
  alternative: ‘अपने पिता के कामों में लगा होना’ अथवा अधिक शाब्दिक रूप में ‘अपने पिता की बातों में होना’
  rationale: यीशु मंदिर में मिला है, इसलिए घर/स्थान का अर्थ प्रसंगानुकूल है। फिर भी यूनानी व्याकरण ‘पिता के विषयों या कामों’ का अर्थ भी स्वीकार करता है; वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: ‘मेरे पिता’ का संदर्भ
  choice: परमेश्वर को यीशु के पिता के रूप में इंगित करने वाला कथन
  alternative: यूसुफ को सांसारिक पिता मानना
  rationale: मंदिर का प्रसंग और यूसुफ तथा मरियम से कही गई बात ‘पिता’ को परमेश्वर के रूप में पहचानती है। अनुवाद मूल कथन से आगे कोई मतगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ रखा गया है, क्योंकि बालक यीशु अपने माता-पिता से बात कर रहा है। भाषा सरल, वर्तमान और गरिमापूर्ण है। ‘पिता’ के लिए देवनागरी में बड़े अक्षर का भेद उपलब्ध नहीं है; दिव्य संदर्भ प्रसंग से स्पष्ट होता है।
