  text: And there were shepherds in that same region[b][a], staying out in the fields and keeping watch over their flock by night.
translation:
  language: hi
  text: और उसी इलाके में कुछ चरवाहे थे। वे खुले मैदान में रात बिता रहे थे[a] और रात के पहरों में अपने झुंड की रखवाली कर रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुले में रह रहे थे।’ यूनानी क्रिया इस बात पर बल देती है कि चरवाहे रात को बाहर मैदानों में बिता रहे थे।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘अपने झुंड पर रात के पहर रख रहे थे’; इससे संभवतः बारी-बारी से रात में निगरानी करने का संकेत मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιμένες
  choice: चरवाहे
  rationale: यह भेड़ों की देखभाल करने वालों के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: ἐν τῇ χώρᾳ τῇ αὐτῇ
  choice: उसी इलाके में
  rationale: χώρα यहाँ हाल में बताए गए स्थान के आसपास के क्षेत्र को दर्शाता है; ‘इलाका’ सहज आधुनिक हिन्दी है और अनावश्यक रूप से व्यापक नहीं है।
- source_word: ἀγραυλοῦντες
  choice: खुले मैदान में रात बिता रहे थे
  rationale: क्रिया का बल रात को घर से बाहर, खुले खेतों या मैदान में ठहरने पर है। यह अनुवाद उस रात्रिकालीन अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: φυλάσσοντες φυλακὰς τῆς νυκτὸς
  choice: रात के पहरों में ... रखवाली कर रहे थे
  rationale: यूनानी सजातीय पद-रचना रात के पहर रखने, संभवतः बारी-बारी से निगरानी करने, का संकेत देती है। ‘रात के पहरों में’ मूल की इस विशेषता को बनाए रखता है।
- source_word: ἐπὶ τὴν ποίμνην αὐτῶν
  choice: अपने झुंड की
  rationale: ποίμνη सामूहिक रूप से भेड़ों के झुंड को दर्शाता है; ‘अपने झुंड की रखवाली’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: Καὶ
  choice: और
  rationale: यह लूका के वृत्तांत में सामान्य कथात्मक संयोजक है; ‘और’ उसके सरल संबंध को बनाए रखता है।
- source_word: ἦσαν
  choice: थे
  rationale: ‘उसी इलाके में कुछ चरवाहे थे’ हिन्दी में नए पात्रों और दृश्य का स्वाभाविक परिचय देता है।
