reference: Luke 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ εἶπεν αὐτοῖς ὁ ἄγγελος· Μὴ φοβεῖσθε, ἰδοὺ γὰρ εὐαγγελίζομαι ὑμῖν χαρὰν μεγάλην ἥτις ἔσται παντὶ τῷ λαῷ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/010.yaml
  text: And the angel said to them[a], “Do not be afraid, for behold, I bring you good news of great joy that will be for all the people,”
translation:
  language: hi
  text: और स्वर्गदूत ने उनसे कहा, “मत डरो, क्योंकि देखो, मैं तुम्हें बड़े आनन्द का शुभ समाचार सुनाता हूँ; यह आनन्द सारी प्रजा[a] के लिए होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब लोगों के लिए।” यूनानी में अधिक शाब्दिक अर्थ “सारी प्रजा के लिए” है; लूका में प्रसंग के अनुसार यह पद प्रायः किसी निश्चित प्रजा की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ ἄγγελος
  choice: स्वर्गदूत
  rationale: निश्चित उपपद पहले से उल्लिखित स्वर्गदूत की ओर संकेत करता है। हिन्दी में प्रसंग के कारण अलग से ‘वह’ जोड़ना आवश्यक नहीं है।
- source_word: Μὴ φοβεῖσθε
  choice: मत डरो
  rationale: यह बहुवचन निषेध है। ‘मत डरो’ आधुनिक हिन्दी में स्वाभाविक, सीधा और अर्थ की दृष्टि से सटीक है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह श्रोताओं का ध्यान आगे कही जाने वाली बात पर खींचने वाला उद्गार है; ‘देखो’ उसके बल को सरल और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह बताता है कि चरवाहों को क्यों नहीं डरना चाहिए और पिछले निषेध के साथ कारणात्मक सम्बन्ध स्पष्ट करता है।
- source_word: εὐαγγελίζομαι ὑμῖν
  choice: मैं तुम्हें ... शुभ समाचार सुनाता हूँ
  rationale: क्रिया का मूल अर्थ शुभ समाचार घोषित करना है। यह रूप व्यक्तिगत बहुवचन ‘तुम्हें’ को सुरक्षित रखता है और अनावश्यक पारिभाषिक अर्थ नहीं जोड़ता।
- source_word: χαρὰν μεγάλην
  choice: बड़े आनन्द
  rationale: यह शुभ समाचार से उत्पन्न अथवा उसमें निहित महान आनन्द को व्यक्त करता है; सम्बन्धसूचक रचना में ‘बड़े आनन्द का शुभ समाचार’ स्वाभाविक हिन्दी है।
- source_word: ἥτις ἔσται
  choice: जो ... होगा
  rationale: यह सम्बन्धवाचक उपवाक्य आनन्द की ओर लौटता है और भविष्यकाल को स्पष्ट रूप से बनाए रखता है।
- source_word: παντὶ τῷ λαῷ
  choice: सारी प्रजा के लिए
  rationale: उपपद सहित λαός यहाँ किसी निश्चित जनसमुदाय, तत्काल प्रसंग में सम्भवतः इस्राएल की प्रजा, की ओर संकेत करता है। ‘सारी प्रजा’ निश्चितता को बनाए रखता है और इसी पद में समय से पहले सार्वभौमिक अर्थ आरोपित नहीं करता।
theological_decisions:
- issue: παντὶ τῷ λαῷ का दायरा
  choice: सारी प्रजा के लिए
  alternative: सब लोगों के लिए
  rationale: यूनानी में λαός के साथ निश्चित उपपद है और लूका के तत्काल कथानक में इसका संकेत सम्भवतः इस्राएल की प्रजा की ओर है। मुख्य पाठ यह निश्चितता बनाए रखता है, जबकि पादटिप्पणी व्यापक समझ की सम्भावना बताती है; इससे लूका के आगे के सार्वभौमिक उद्धार-विषय को न तो नकारा जाता है, न इस पद में पहले से डाल दिया जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, मौखिक रूप अपनाया गया है। ‘मत डरो’ और ‘शुभ समाचार सुनाता हूँ’ सामान्य पाठकों के लिए सहज हैं, जबकि ‘देखो’ मूल के ध्यानाकर्षक और गम्भीर स्वर को बनाए रखता है। ‘आनन्द’ और ‘प्रजा’ पाठ को गरिमापूर्ण रखते हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं बनाते।
