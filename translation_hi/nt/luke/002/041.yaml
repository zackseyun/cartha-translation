  text: Καὶ ἐπορεύοντο οἱ γονεῖς αὐτοῦ κατ’ ἔτος εἰς Ἰερουσαλὴμ τῇ ἑορτῇ τοῦ πάσχα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/041.yaml
  text: And his parents went to Jerusalem year by year for the Feast of the Passover.
translation:
  language: hi
  text: उसके माता-पिता हर वर्ष फसह के पर्व के लिए यरूशलेम जाते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: जाते थे
  rationale: अपूर्ण भूतकाल यहाँ अतीत में नियमित रूप से दोहराई जाने वाली क्रिया बताता है। ‘हर वर्ष’ के साथ ‘जाते थे’ आधुनिक हिन्दी में इस अभ्यास को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἱ γονεῖς αὐτοῦ
  choice: उसके माता-पिता
  rationale: γονεῖς का सीधा और स्वाभाविक अर्थ ‘माता-पिता’ है; αὐτοῦ का संबंध ‘उसके’ से स्पष्ट होता है।
- source_word: κατ’ ἔτος
  choice: हर वर्ष
  rationale: κατά + कर्मकारक का यह प्रयोग प्रति वर्ष होने वाली नियमितता व्यक्त करता है। ‘हर वर्ष’ हिन्दी में सटीक और सहज है।
- source_word: Ἰερουσαλὴμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: τῇ ἑορτῇ
  choice: पर्व के लिए
  rationale: यात्रा के संदर्भ में चतुर्थी पर्व को यात्रा के अवसर अथवा उद्देश्य के रूप में दिखाती है। ‘के लिए’ हिन्दी में इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦ πάσχα
  choice: फसह के
  rationale: πάσχα यहूदी फसह पर्व का नाम है। ‘फसह के पर्व’ नाम और उत्सव के संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: यीशु के पारिवारिक संबंध का उल्लेख
  choice: उसके माता-पिता
  alternative: उसके पिता और माता
  rationale: यूनानी पाठ सामान्य पारिवारिक शब्द ‘माता-पिता’ का प्रयोग करता है। इसे यथावत रखना कथा के सहज अर्थ को सुरक्षित रखता है और कुँवारी से गर्भधारण के विषय में न तो कोई अतिरिक्त निष्कर्ष जोड़ता है, न उसे नकारता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। नियमित अतीत की क्रिया के लिए ‘जाते थे’ तथा पर्व के अवसर/उद्देश्य के लिए ‘के लिए’ चुना गया है।
