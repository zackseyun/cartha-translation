  text: καθὼς γέγραπται ἐν νόμῳ κυρίου ὅτι Πᾶν ἄρσεν διανοῖγον μήτραν ἅγιον τῷ κυρίῳ κληθήσεται,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/023.yaml
  text: as it is written in the Law of the Lord[a], that every male opening the womb shall be called holy to the Lord[c][b],
translation:
  language: hi
  text: 'जैसा कि प्रभु की व्यवस्था में लिखा है: “हर वह नर-संतान जो गर्भ खोलती है, प्रभु के लिए पवित्र कहलाएगी,”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् पहली पहलौठी नर-संतान प्रभु के लिए पवित्र, यानी अलग ठहराई हुई, मानी जाती है; देखें निर्गमन 13:2, 12।
    reason: मुहावरे की व्याख्या और क्रॉस-संदर्भ
lexical_decisions:
- source_word: καθὼς γέγραπται
  choice: जैसा … लिखा है
  rationale: यह पवित्रशास्त्र के उद्धरण का प्रचलित सूत्र है और यूनानी पूर्णकाल के वर्तमान में बने हुए लिखित अधिकार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐν νόμῳ κυρίου
  choice: प्रभु की व्यवस्था में
  rationale: νόμος यहाँ मूसा की व्यवस्था को लिखित प्रामाणिक स्रोत के रूप में दर्शाता है; ‘प्रभु की व्यवस्था’ आधुनिक हिन्दी में सहज और अर्थतः स्पष्ट है।
- source_word: Πᾶν ἄρσεν
  choice: हर नर-संतान
  rationale: ἄρσεν के स्पष्ट पुल्लिंग अर्थ को सुरक्षित रखते हुए ‘संतान’ जन्म-संदर्भ को स्पष्ट करता है; हिन्दी वाक्य में व्याकरणिक अन्वय ‘संतान’ के अनुसार स्त्रीलिंग रखा गया है।
- source_word: διανοῖγον μήτραν
  choice: गर्भ खोलने वाली
  rationale: मूल के मूर्त बाइबलीय मुहावरे को बनाए रखता है; इसका आशय पहली नर-संतान से है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: ἅγιον τῷ κυρίῳ
  choice: प्रभु के लिए पवित्र
  rationale: ἅγιον के मूल पवित्रता-वाचक शब्द को सुरक्षित रखता है और समर्पण के संबंध को ‘के लिए’ द्वारा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κληθήσεται
  choice: कहलाएगी
  rationale: भविष्यत् कर्मवाच्य का सीधा, वर्तमान मानक हिन्दी रूप है।
theological_decisions:
- issue: इस्राएल की व्यवस्था के उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: अनुवाद का प्रत्यक्ष स्रोत यूनानी κύριος है; इसलिए ‘प्रभु’ रखा गया है, यद्यपि निर्गमन की इब्रानी पृष्ठभूमि में परमेश्वर का व्यक्तिगत नाम आता है।
- issue: ἅγιον को पवित्रता या समर्पण की व्याख्या से व्यक्त करना
  choice: पवित्र
  alternative: समर्पित / अलग ठहराई हुई
  rationale: मूल पाठ स्पष्ट रूप से ἅγιον कहता है। ‘पवित्र’ उस शब्दावली और उसके धर्मवैचारिक तनाव को सुरक्षित रखता है; समर्पण का भाव संदर्भ से समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। उद्धरण से पहले विसर्ग लगाया गया है। ‘गर्भ खोलने वाली’ मूल से निकट बाइबलीय अभिव्यक्ति है; उसकी सहज व्याख्या पादटिप्पणी में दी गई है।
