source:
  edition: SBLGNT
  text: καὶ τοῦ δοῦναι θυσίαν κατὰ τὸ εἰρημένον ἐν ⸀τῷ νόμῳ κυρίου, ζεῦγος τρυγόνων ἢ δύο νοσσοὺς περιστερῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/024.yaml
  text: 'and to offer a sacrifice according to what had been said in the Law of the Lord: a pair of turtledoves or two young pigeons[a].'
translation:
  language: hi
  text: 'और प्रभु की व्यवस्था में जो कहा गया था[a], उसके अनुसार बलिदान चढ़ाने के लिए: पंडुकों का एक जोड़ा या कबूतर के दो बच्चे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की व्यवस्था में जो कहा गया है, उसके अनुसार।”
    reason: यूनानी पूर्ण निष्क्रिय कृदन्त का अर्थ पहले कही गई बात तथा अब भी प्रामाणिक रूप से विद्यमान कथन—दोनों रूपों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: τοῦ δοῦναι θυσίαν
  choice: बलिदान चढ़ाने के लिए
  rationale: सप्रत्यय क्रियार्थक संज्ञा यहाँ उद्देश्य व्यक्त करती है। δίδωμι का मूल अर्थ ‘देना’ है, पर θυσία के साथ हिन्दी में ‘बलिदान चढ़ाना’ स्वाभाविक और यज्ञ-संबंधी भाव के अनुरूप है।
- source_word: κατὰ τὸ εἰρημένον
  choice: जो कहा गया था, उसके अनुसार
  rationale: पूर्ण निष्क्रिय कृदन्त उस बात की ओर संकेत करता है जो कही जा चुकी है और प्रामाणिक रूप से विद्यमान है। यह अनुवाद ‘ठहराया गया’ जैसी अतिरिक्त व्याख्या जोड़े बिना वाचिक भाव बनाए रखता है।
- source_word: ἐν τῷ νόμῳ κυρίου
  choice: प्रभु की व्यवस्था में
  rationale: νόμος यहाँ मूसा की ईश्वरीय व्यवस्था को सूचित करता है; ‘प्रभु की व्यवस्था’ आधुनिक हिन्दी में स्वाभाविक है और शास्त्रीय सूत्र की पहचान बनाए रखती है।
- source_word: ζεῦγος τρυγόνων
  choice: पंडुकों का एक जोड़ा
  rationale: ζεῦγος पक्षियों के एक जोड़े को दर्शाता है और τρυγών विशेषतः turtledove है, जिसके लिए ‘पंडुक’ सटीक हिन्दी पक्षी-नाम है।
- source_word: δύο νοσσοὺς περιστερῶν
  choice: कबूतर के दो बच्चे
  rationale: νοσσός किसी पक्षी के बच्चे को और περιστερά यहाँ कबूतर/फाख्ता जाति के पक्षी को दर्शाता है। ‘कबूतर के दो बच्चे’ स्पष्ट और सामान्य हिन्दी है।
theological_decisions:
- issue: शास्त्रीय व्यवस्था के सूत्र में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριος है। ‘प्रभु’ उसका सीधा और मानक नए नियम का अनुवाद है; यहाँ पीछे निहित इब्रानी दिव्य नाम को पाठ में स्पष्ट रूप से जोड़ना उचित नहीं।
- issue: κατὰ τὸ εἰρημένον का कालगत भाव
  choice: जो कहा गया था
  alternative: जो कहा गया है
  rationale: पूर्ण कृदन्त कही जा चुकी और स्थायी रूप से प्रामाणिक बात—दोनों भाव रख सकता है। मुख्य पाठ पूर्वकथन का भाव देता है और पादटिप्पणी वर्तमान स्थायी भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पंडुक’ विशिष्ट पक्षी-नाम होने के कारण कुछ पाठकों के लिए कम परिचित हो सकता है, पर यह τρυγών की सटीकता बनाए रखता है। उद्धरण-चिह्न व्यवस्था से लिए गए बलिदानी सूत्र को स्पष्ट करते हैं।
