source:
  edition: SBLGNT
  text: καὶ ἔτεκεν τὸν υἱὸν αὐτῆς τὸν πρωτότοκον, καὶ ἐσπαργάνωσεν αὐτὸν καὶ ἀνέκλινεν αὐτὸν ⸀ἐν φάτνῃ, διότι οὐκ ἦν αὐτοῖς τόπος ἐν τῷ καταλύματι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/007.yaml
  text: And she gave birth to her firstborn son[a], and wrapped him in cloths and laid him in a feeding trough[c][b], because there was no place for them in the guest room.
translation:
  language: hi
  text: और उसने अपने पहलौठे पुत्र को जन्म दिया, उसे कपड़ों में लपेटा[a] और चारे की नाँद में लिटा दिया[b], क्योंकि अतिथि-कक्ष में उनके लिए जगह नहीं थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात नवजात शिशु को कपड़े की पट्टियों में लपेटा।
    reason: lexical_alternative
  - marker: b
    text: या ‘चरनी में।’ यूनानी शब्द पशुओं के चारा खाने की जगह या पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: पारंपरिक अनुवाद ‘सराय में।’ यूनानी κατάλυμα का अर्थ अतिथि-कक्ष या ठहरने की जगह हो सकता है; लूका 10:34 में व्यावसायिक सराय के लिए एक अलग शब्द का प्रयोग हुआ है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἔτεκεν
  choice: जन्म दिया
  rationale: प्रसव के संदर्भ में यह आधुनिक हिन्दी की स्वाभाविक और स्पष्ट अभिव्यक्ति है।
- source_word: πρωτότοκον
  choice: पहलौठे
  rationale: यहाँ शब्द जन्म-क्रम बताता है; यह अनुवाद निकट प्रसंग से आगे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- source_word: ἐσπαργάνωσεν
  choice: कपड़ों में लपेटा
  rationale: क्रिया नवजात शिशु को कपड़ों से लपेटने का बोध कराती है। यह सामान्य पाठक के लिए सहज है; अधिक विशिष्ट पारंपरिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: ἀνέκλινεν
  choice: लिटा दिया
  rationale: शिशु के संदर्भ में नीचे रखने या लिटाने का यही स्वाभाविक हिन्दी रूप है।
- source_word: φάτνῃ
  choice: चारे की नाँद
  rationale: यह पशुओं के चारा खाने की जगह या पात्र का ठोस अर्थ स्पष्ट करता है और केवल पारंपरिक चित्रण पर निर्भर नहीं रहता।
- source_word: τόπος
  choice: जगह
  rationale: τόπος के व्यापक अर्थ ‘स्थान/जगह’ को प्रसंगानुकूल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καταλύματι
  choice: अतिथि-कक्ष
  rationale: यह शब्द अतिथियों के ठहरने के कमरे या ठहरने की जगह का अर्थ दे सकता है। लूका 22:11 में इसी शब्द का प्रयोग अतिथि-कक्ष के लिए है, जबकि लूका 10:34 में व्यावसायिक सराय के लिए अलग यूनानी शब्द आता है।
theological_decisions:
- issue: κατάλυμα को पारंपरिक ‘सराय’ के रूप में अनूदित किया जाए या घर के अतिथि-स्थान को दर्शाने वाले शब्द से
  choice: अतिथि-कक्ष
  alternative: सराय; ठहरने की जगह
  rationale: यूनानी शब्द किसी व्यावसायिक सराय को अनिवार्य नहीं करता। लूका की शब्दावली में κατάλυμα अतिथि-कक्ष के लिए भी आता है, जबकि व्यावसायिक सराय के लिए वह πανδοχεῖον का प्रयोग करता है। ‘अतिथि-कक्ष’ पाठ में ऐसी पारंपरिक जन्म-कथा की परिस्थिति नहीं जोड़ता जिसकी यूनानी मूलपाठ माँग नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पहलौठे पुत्र’ बाइबलीय संदर्भ में परिचित है, जबकि ‘चारे की नाँद’ मूल शब्द का ठोस अर्थ सामान्य पाठक के लिए स्पष्ट करती है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
