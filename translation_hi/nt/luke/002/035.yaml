source:
  edition: SBLGNT
  text: καὶ σοῦ ⸀δὲ αὐτῆς τὴν ψυχὴν διελεύσεται ῥομφαία, ὅπως ἂν ἀποκαλυφθῶσιν ἐκ πολλῶν καρδιῶν διαλογισμοί.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/035.yaml
  text: and a sword will pass through your own soul also[b][a], so that the thoughts of many hearts may be revealed.
translation:
  language: hi
  text: और तुम्हारे अपने प्राण को भी एक तलवार आर-पार कर जाएगी[a][b], ताकि बहुत-से हृदयों के विचार प्रकट हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बेध जाएगी।’ यूनानी क्रिया का अधिक शाब्दिक अर्थ ‘आर-पार होकर गुजरना’ है, जबकि तलवार का चित्र स्वाभाविक रूप से बेधने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘तलवार’ को सामान्यतः मरियम द्वारा अनुभव की जाने वाली गहरी पीड़ा का रूपक समझा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: σοῦ ... αὐτῆς
  choice: तुम्हारे अपने
  rationale: सम्बन्धकारक सर्वनाम के साथ प्रयुक्त बलसूचक αὐτῆς मरियम पर व्यक्तिगत जोर देता है; ‘तुम्हारे अपने’ इसे स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: ψυχή
  choice: प्राण
  rationale: यहाँ ψυχή केवल शारीरिक जीवन नहीं, बल्कि भीतर के व्यक्ति और गहरी पीड़ा के अनुभव को सूचित करता है। ‘प्राण’ रूपक की गरिमा और व्यापकता बनाए रखता है।
- source_word: διελεύσεται
  choice: आर-पार कर जाएगी
  rationale: क्रिया का मूल अर्थ ‘होकर गुजरना’ है। तलवार के साथ ‘आर-पार कर जाएगी’ हिन्दी में स्वाभाविक है और ‘बेध देगी’ की अपेक्षा मूल क्रिया के चित्र को अधिक सीधे सुरक्षित रखता है।
- source_word: ῥομφαία
  choice: तलवार
  rationale: यह शब्द बड़ी या विकराल तलवार का संकेत दे सकता है, पर मुख्य पाठ में ‘तलवार’ स्पष्ट, स्वाभाविक और पर्याप्त है।
- source_word: ὅπως ἂν
  choice: ताकि
  rationale: यह उद्देश्य अथवा परिणामी अभिप्राय का सम्बन्ध व्यक्त करता है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἀποκαλυφθῶσιν
  choice: प्रकट हो जाएँ
  rationale: यह निष्क्रिय भाव और छिपी बातों के उजागर होने का अर्थ सुरक्षित रखता है।
- source_word: ἐκ πολλῶν καρδιῶν
  choice: बहुत-से हृदयों के
  rationale: ἐκ भीतर से स्रोत का भाव देता है, पर διαλογισμοί के साथ स्वाभाविक हिन्दी में ‘हृदयों के विचार’ उसी आन्तरिक उद्गम को व्यक्त करता है।
- source_word: διαλογισμοί
  choice: विचार
  rationale: यह शब्द मन के विचार, तर्क या मनन को सूचित कर सकता है। ‘विचार’ जानबूझकर व्यापक है और उनके नैतिक स्वरूप को अनावश्यक रूप से निर्धारित नहीं करता।
theological_decisions:
- issue: मरियम को सीधे सम्बोधन और तलवार के रूपक का आशय
  choice: मरियम के अपने प्राण से तलवार के आर-पार होने की भविष्यवाणी को गहरी व्यक्तिगत पीड़ा के रूपक के रूप में रखा गया है, पर उसकी पूर्ति का विशिष्ट ऐतिहासिक रूप मुख्य पाठ में तय नहीं किया गया।
  alternative: इसे विशेष रूप से यीशु के क्रूस पर चढ़ाए जाने के समय मरियम के शोक, अथवा यीशु की सेवकाई से उत्पन्न व्यापक विभाजन की पीड़ा के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ मरियम को सीधे सम्बोधित करता है और गहन पीड़ा का संकेत देता है, किन्तु उस पीड़ा की ठीक प्रकृति को स्पष्ट नहीं करता। अनुवाद उसी तनाव और अनिश्चितता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्राण’ काव्यात्मक-धार्मिक प्रसंग के अनुकूल है, जबकि वाक्य-विन्यास समकालीन हिन्दी का है।
