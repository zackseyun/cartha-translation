base_translation:
  language: en
  yaml_path: translation/nt/luke/002/021.yaml
  text: And when eight days were fulfilled for circumcising him[a], his name was called Jesus[c][b], the name called by the angel before he was conceived in the womb.
translation:
  language: hi
  text: जब उसके खतने के लिए आठ दिन पूरे हुए[a], तो उसका नाम यीशु रखा गया[b]—वही नाम जो उसके गर्भ में आने से पहले स्वर्गदूत ने बताया था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब आठ दिन पूरे हो गए।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका नाम यीशु कहलाया गया।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात, मरियम के गर्भ में उसके आने से पहले; देखें लूका 1:31।
    reason: cross_reference
lexical_decisions:
- source_word: ἐπλήσθησαν ἡμέραι ὀκτὼ
  choice: आठ दिन पूरे हुए
  rationale: यह यूनानी की पूर्णता-सूचक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में रखता है; केवल ‘आठ दिन बीत गए’ की अपेक्षा मूल की शैली भी अधिक सुरक्षित रहती है।
- source_word: τοῦ περιτεμεῖν αὐτόν
  choice: उसके खतने के लिए
  rationale: सम्बन्धित उद्देश्य को स्पष्ट करता है और हिन्दी में स्वाभाविक है। ‘खतना’ सामान्य पाठक के लिए प्रचलित और सटीक धार्मिक-सांस्कृतिक शब्द है।
- source_word: ἐκλήθη τὸ ὄνομα αὐτοῦ Ἰησοῦς
  choice: उसका नाम यीशु रखा गया
  rationale: यूनानी के निष्क्रिय भाव और स्पष्ट ‘नाम’ संज्ञा दोनों को मुहावरेदार हिन्दी में व्यक्त करता है; शाब्दिक ‘उसका नाम यीशु कहलाया गया’ अस्वाभाविक होता।
- source_word: Ἰησοῦς
  choice: यीशु
  rationale: नए नियम में इस नाम का मानक हिन्दी रूप यही है; इसे अर्थानुवाद या ‘यहोशू’ के रूप में देना यहाँ उचित नहीं।
- source_word: τὸ κληθὲν ὑπὸ τοῦ ἀγγέλου
  choice: वही नाम जो स्वर्गदूत ने बताया था
  rationale: कृदन्त का सम्बन्ध ‘नाम’ से स्पष्ट रखते हुए अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘स्वर्गदूत’ निश्चित सन्दर्भ को बनाए रखता है, जबकि हिन्दी में अनिवार्य निश्चित उपपद नहीं होता।
- source_word: πρὸ τοῦ συλλημφθῆναι αὐτὸν ἐν τῇ κοιλίᾳ
  choice: उसके गर्भ में आने से पहले
  rationale: यह गर्भधारण के अर्थ को सरल, सम्मानजनक और सामान्य हिन्दी में व्यक्त करता है। मूल में माता का नाम यहाँ नहीं है, इसलिए मुख्य पाठ में ‘मरियम के गर्भ’ को नहीं जोड़ा गया।
theological_decisions:
- issue: गर्भधारण-वाक्यांश का मसीह-विज्ञान से सम्बन्ध
  choice: उसके गर्भ में आने से पहले
  alternative: गर्भ में उसका गर्भधारण होने से पहले
  rationale: अनुवाद यीशु के मानवीय गर्भधारण की ऐतिहासिक बात को स्पष्ट रखता है, पर मूल से परे कोई उत्तरकालीन धर्मवैज्ञानिक शब्दावली या व्याख्या नहीं जोड़ता।
- issue: नाम बताने और नाम रखे जाने के बीच सम्बन्ध
  choice: वही नाम जो स्वर्गदूत ने बताया था
  alternative: वही नाम जो स्वर्गदूत ने रखा था
  rationale: लूका 1:31 में स्वर्गदूत नाम रखने का निर्देश देता है; यह कहना कि स्वर्गदूत ने स्वयं नाम रखा, कर्ता की भूमिका को आवश्यकता से अधिक निश्चित कर सकता है। ‘बताया था’ उस पूर्व घोषणा को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। ‘खतना’, ‘गर्भ’ और ‘स्वर्गदूत’ जैसे व्यापक रूप से समझे जाने वाले शब्द चुने गए हैं। यूनानी की निष्क्रिय और कुछ हद तक सामी शैली को जहाँ आवश्यक था वहाँ स्वाभाविक हिन्दी में बदला गया है, बिना कथ्य या धर्मवैज्ञानिक तनाव को विस्तार देकर सुलझाए।
