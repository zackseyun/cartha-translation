  text: καὶ πάντες οἱ ἀκούσαντες ἐθαύμασαν περὶ τῶν λαληθέντων ὑπὸ τῶν ποιμένων πρὸς αὐτούς,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/018.yaml
  text: And all who heard it were amazed about what had been told to them by the shepherds,[a]
translation:
  language: hi
  text: और जितनों ने यह सुना, वे उन बातों पर चकित हुए जो चरवाहों ने उनसे कही थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अचम्भित हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सरल संयोजक पिछले वर्णन से पद को जोड़ता और लूका की कथात्मक धारा बनाए रखता है।
- source_word: πάντες οἱ ἀκούσαντες
  choice: जितनों ने यह सुना
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का अर्थ ‘सुनने वाले सभी लोग’ है। सहज हिन्दी के लिए संदर्भित विषय को ‘यह’ से स्पष्ट किया गया है।
- source_word: ἐθαύμασαν
  choice: चकित हुए
  rationale: यह सुनकर उत्पन्न विस्मय को व्यक्त करता है; ‘चकित हुए’ आधुनिक, स्वाभाविक और गरिमापूर्ण है।
- source_word: περὶ τῶν λαληθέντων
  choice: उन बातों पर … जो … कही थीं
  rationale: περί कथन की विषय-वस्तु के संबंध में प्रतिक्रिया दर्शाता है। हिन्दी में ‘उन बातों पर चकित हुए’ स्वाभाविक है और बहुवचन कथनों का भाव बनाए रखता है।
- source_word: ὑπὸ τῶν ποιμένων
  choice: चरवाहों ने
  rationale: मूल यूनानी के कर्मवाच्य में ὑπό कर्ता को चिह्नित करता है। हिन्दी में स्वाभाविक सक्रिय रचना उसी कर्तृत्व को स्पष्ट रूप से व्यक्त करती है।
- source_word: πρὸς αὐτούς
  choice: उनसे
  rationale: वाणी की दिशा सुनने वालों की ओर है। ‘उनसे कही थीं’ सर्वनाम का संदर्भ बनाए रखता है और श्रोताओं की पहचान को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: ἐθαύμασαν द्वारा वर्णित प्रतिक्रिया का स्वरूप
  choice: सुनने वालों के चकित होने या विस्मित होने की सूचना देना, बिना यह बताए कि उन्होंने विश्वास किया या अविश्वास
  alternative: इसे उद्धारकारी विश्वास अथवा केवल जिज्ञासा की प्रतिक्रिया मानना
  rationale: θαυμάζω आश्चर्य या विस्मय की प्रतिक्रिया बताता है। पद यह निर्धारित नहीं करता कि यह प्रतिक्रिया विश्वास में बदली या नहीं; इसलिए अनुवाद उस खुलापन को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, कथात्मक और गरिमापूर्ण है। मूल की संरचना और आशय को रखते हुए निष्क्रिय यूनानी वाक्यांश को स्वाभाविक हिन्दी सक्रिय रचना में व्यक्त किया गया है।
