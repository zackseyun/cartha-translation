translation:
  language: hi
  text: जब वे वहाँ थे, तो उसके प्रसव का समय पूरा हो गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके प्रसव के दिन पूरे हो गए।”
    reason: मूल यूनानी के ‘दिन’ और बहुवचन ‘पूरे हो गए’ को दिखाने वाला अधिक शाब्दिक विकल्प।
lexical_decisions:
- source_word: ἐγένετο δὲ
  choice: '[अलग शब्दों में व्यक्त नहीं; वाक्य की कथात्मक प्रगति में समाहित]'
  rationale: यह यूनानी मुहावरा यहाँ कथा को आगे बढ़ाता है। हिन्दी में ‘और ऐसा हुआ कि’ कहना संभव है, पर इस छोटे वाक्य में वह अनावश्यक रूप से भारी लगता; ‘जब… तभी…’ से कथात्मक और कालगत संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: ἐν τῷ εἶναι αὐτοὺς ἐκεῖ
  choice: जब वे वहाँ थे
  rationale: ἐν के साथ यह infinitive रचना समकालिक समय व्यक्त करती है। चुना हुआ रूप आधुनिक हिन्दी में सहज है और ‘उनके वहाँ रहते हुए’ की अपेक्षा अधिक सामान्य है।
- source_word: ἐπλήσθησαν
  choice: पूरा हो गया
  rationale: यहाँ क्रिया किसी अवधि के अपनी पूर्णता तक पहुँचने को दर्शाती है। एकवचन ‘हो गया’ हिन्दी के स्वाभाविक पदबंध ‘समय पूरा हो गया’ के अनुरूप है; पादटिप्पणी स्रोत के बहुवचन रूप को सुरक्षित रखती है।
- source_word: αἱ ἡμέραι
  choice: समय
  rationale: यूनानी में शाब्दिक रूप से ‘दिन’ हैं, पर यह प्रसव के निर्धारित समय के पूरा होने का मुहावरा है। मुख्य पाठ में ‘समय’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; ‘दिन’ पादटिप्पणी में दिया गया है।
- source_word: τοῦ τεκεῖν αὐτήν
  choice: उसके जन्म देने का
  rationale: यह रचना उस समय को बताती है जिसमें उसे जन्म देना था। ‘जन्म देने’ से क्रियात्मक अर्थ बना रहता है और मूल में स्पष्ट न किए गए ‘बच्चे’ को अनावश्यक रूप से नहीं जोड़ा जाता।
theological_decisions:
- issue: ἐπλήσθησαν αἱ ἡμέραι में पूर्णता अथवा नियत समय का संभावित संकेत
  choice: ‘समय पूरा हो गया’ कहकर पूर्णता का भाव बनाए रखा गया।
  alternative: ‘उसके जन्म देने का समय आ गया’
  rationale: वैकल्पिक रूप घटना का सामान्य अर्थ देता है, किंतु पूर्णता की लूकीय शब्दावली को समतल कर देता है। चुना हुआ पाठ गर्भावधि की पूर्णता स्पष्ट करता है, पर किसी विशेष ईश्वरीय व्यवस्था का दावा जोड़ता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘दिन’ के स्थान पर ‘समय’ रखा गया है, जबकि स्रोत की संरचना पादटिप्पणी में सुरक्षित है।
