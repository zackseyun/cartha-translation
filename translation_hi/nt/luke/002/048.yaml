base_translation:
  language: en
  yaml_path: translation/nt/luke/002/048.yaml
  text: And when they saw him[a], they were astonished, and his mother said to him, “Child, why have you done this to us? Look, your father and I have been anxiously looking for you.”
translation:
  language: hi
  text: जब उन्होंने उसे देखा, तो वे चकित रह गए। उसकी माँ ने उससे कहा, “बेटे, तुमने हमारे साथ ऐसा क्यों किया? देखो, तुम्हारे पिता और मैं व्याकुल होकर[a] तुम्हें ढूँढ़ रहे थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “व्याकुल होकर” का अर्थ “गहरी पीड़ा में” या “बहुत दुखी होकर” भी हो सकता है; यूनानी शब्द खोज के दौरान हुई भावनात्मक पीड़ा को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: जब उन्होंने उसे देखा
  rationale: कालवाचक रूप स्वाभाविक हिन्दी में घटनाक्रम को स्पष्ट रखता है।
- source_word: ἐξεπλάγησαν
  choice: वे चकित रह गए
  rationale: यह तीव्र आश्चर्य को व्यक्त करता है और सामान्य आधुनिक हिन्दी में सहज है।
- source_word: Τέκνον
  choice: बेटे
  rationale: संबोधन स्नेहपूर्ण है; प्रसंग में बालक यीशु के लिए ‘बेटे’ स्वाभाविक है, बिना ‘मेरे’ जैसा अनुपस्थित शब्द जोड़े।
- source_word: τί ἐποίησας ἡμῖν οὕτως
  choice: तुमने हमारे साथ ऐसा क्यों किया?
  rationale: मुहावरेदार हिन्दी में शिकायत और ἡμῖν के संबंधपरक भाव दोनों बने रहते हैं।
- source_word: ἰδοὺ
  choice: देखो
  rationale: प्रत्यक्ष कथन में ध्यान आकर्षित करने वाला स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: ὁ πατήρ σου
  choice: तुम्हारे पिता
  rationale: यूनानी के सीधे कथन को बिना ‘सांसारिक’ जैसी व्याख्यात्मक विशेषता जोड़े सुरक्षित रखता है।
- source_word: ὀδυνώμενοι
  choice: व्याकुल होकर
  rationale: खोज के दौरान भावनात्मक पीड़ा और गहरी बेचैनी को व्यक्त करता है; केवल सामान्य चिंता तक अर्थ को सीमित नहीं करता।
- source_word: ἐζητοῦμέν σε
  choice: तुम्हें ढूँढ़ रहे थे
  rationale: अपूर्ण भूतकाल जारी खोज को दर्शाता है; हिन्दी का यह रूप स्वाभाविक और सटीक है।
theological_decisions:
- issue: यीशु के लिए यूसुफ का उल्लेख ‘तुम्हारे पिता’ के रूप में
  choice: मुख्य पाठ में बिना विशेषण के ‘तुम्हारे पिता’
  alternative: तुम्हारे सांसारिक पिता
  rationale: मूल पाठ मरियम के शब्दों में यूसुफ को सीधे ‘तुम्हारे पिता’ कहता है। ‘सांसारिक’ जोड़ना अनुवाद के बजाय व्याख्या होगा और अगले पद के साथ उपस्थित कथात्मक-धर्मवैचारिक तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; पारिवारिक संवाद के लिए स्वाभाविक, किंतु गरिमापूर्ण शैली। ‘बेटे’ मातृ-संबोधन को सहज बनाता है। पाद-टिप्पणी चिह्न संबंधित वाक्यांश के बाद रखा गया है।
