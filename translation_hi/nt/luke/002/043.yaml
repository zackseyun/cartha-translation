language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τελειωσάντων τὰς ἡμέρας, ἐν τῷ ὑποστρέφειν αὐτοὺς ὑπέμεινεν Ἰησοῦς ὁ παῖς ἐν Ἰερουσαλήμ, καὶ οὐκ ⸂ἔγνωσαν οἱ γονεῖς⸃ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/043.yaml
  text: And when they had completed the days[a], as they were returning, Jesus the boy remained in Jerusalem[b], and his parents did not know it.
translation:
  language: hi
  text: जब वे पर्व के दिन पूरे कर चुके थे, तब उनके लौटते समय बालक यीशु यरूशलेम में रह गया[a], और उसके माता-पिता[b] को इसका पता नहीं चला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पीछे रह गया।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “उसके माता-पिता।” यहाँ लूका की सामान्य पारिवारिक भाषा सुसमाचार में पहले बताए गए कुँवारी से गर्भधारण का खंडन नहीं करती।
    reason: cross_reference
lexical_decisions:
- source_word: τελειωσάντων τὰς ἡμέρας
  choice: जब पर्व के दिन पूरे हो गए
  rationale: यह संबंधवाचक स्वतंत्र पदबंध मुख्य घटना से पहले पूरी हुई परिस्थिति बताता है। प्रसंग में ये फसह के पर्व के दिन हैं; ‘पर्व के दिन’ हिन्दी में अर्थ स्वाभाविक रूप से स्पष्ट करता है, जबकि दिनों की संख्या या अवधि नहीं जोड़ता।
- source_word: ἐν τῷ ὑποστρέφειν αὐτοὺς
  choice: वे लौटने लगे
  rationale: ἐν के साथ प्रयुक्त संज्ञार्थक क्रियारूप समकालीन, जारी क्रिया व्यक्त करता है। ‘लौटने लगे’ वापसी आरम्भ होने के समय यीशु के वहीं रह जाने को सहज हिन्दी में प्रकट करता है।
- source_word: ὑπέμεινεν
  choice: वहीं रह गया
  rationale: इस प्रसंग में ὑπομένω का अर्थ किसी स्थान पर पीछे रह जाना है। ‘वहीं रह गया’ यरूशलेम में बने रहने का भाव स्वाभाविक हिन्दी में देता है; ‘पीछे रह गया’ वैकल्पिक रूप से पादटिप्पणी में रखा गया है।
- source_word: ὁ παῖς
  choice: बालक यीशु
  rationale: παῖς आयु और प्रसंग के अनुसार बालक या लड़का हो सकता है। बारह वर्षीय यीशु के लिए ‘बालक’ वर्तमान, गरिमापूर्ण और स्वाभाविक चयन है।
- source_word: ἐν Ἰερουσαλήμ
  choice: यरूशलेम में
  rationale: स्थानसूचक ἐν का सीधा और प्रचलित हिन्दी रूप।
- source_word: οὐκ ἔγνωσαν
  choice: को इसका पता नहीं चला
  rationale: यहाँ γινώσκω किसी तथ्य को जानने या भाँपने का अर्थ देता है। ‘इसका पता नहीं चला’ स्पष्ट करता है कि माता-पिता यीशु के वहीं रह जाने से अनजान थे।
- source_word: οἱ γονεῖς αὐτοῦ
  choice: उसके माता-पिता
  rationale: γονεῖς का सीधा अर्थ ‘माता-पिता’ है। यह लूका की सामान्य पारिवारिक भाषा को बिना विस्तार या सामंजस्यकारी बदलाव के सुरक्षित रखता है।
theological_decisions:
- issue: मरियम और यूसुफ के लिए यीशु के γονεῖς का प्रयोग
  choice: उसके माता-पिता
  alternative: उसकी माता और यूसुफ
  rationale: यूनानी पाठ स्पष्ट रूप से ‘उसके माता-पिता’ कहता है। यही अनुवाद लूका की भाषा और सुसमाचार में पहले कही गई कुँवारी से गर्भधारण की बात के साथ विद्यमान तनाव को सुरक्षित रखता है; उसे चुपचाप सामंजस्यपूर्ण नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘पर’ वाक्य के विरोधात्मक मोड़ को स्वाभाविक बनाता है, और ‘ही’ यीशु के यरूशलेम में बने रहने पर हल्का प्रसंगानुकूल बल देता है।
