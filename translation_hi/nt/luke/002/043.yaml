review_pass:
  verdict: revise
  source_fidelity: Draft conveys the central event accurately, including Jesus remaining in Jerusalem and his parents' lack of awareness. However, “वे लौटने लगे” can imply merely the beginning of their return, whereas ἐν τῷ ὑποστρέφειν αὐτούς denotes the time while/as they were returning. The added emphatic “ही” in “यरूशलेम में ही” is not required by ἐν Ἰερουσαλήμ, and “पर” introduces a contrast stronger than the Greek connective καί.
  naturalness: The Hindi is generally natural and suitable for a dignified modern narrative. “जब ... पूरे कर चुके थे, तब उनके लौटते समय” is both idiomatic and more precise for the Greek temporal construction.
  terminology: “बालक यीशु” appropriately renders ὁ παῖς in this twelve-year-old context, and “उसके माता-पिता” directly renders οἱ γονεῖς αὐτοῦ. The explanatory footnote appropriately preserves Luke’s ordinary family terminology without doctrinally recasting it.
  issues:
  - severity: medium
    issue: The return is rendered as beginning rather than ongoing.
    rationale: '“वे लौटने लगे” may mean ‘they began to return.’ The articular infinitive ἐν τῷ ὑποστρέφειν expresses the contemporaneous setting: while/as they were returning.'
  - severity: low
    issue: “ही” adds emphasis to Jerusalem.
    rationale: The Greek simply says ‘in Jerusalem’; it does not explicitly mark Jerusalem with an emphatic particle.
  - severity: low
    issue: “पर” overstates the force of καί.
    rationale: The Greek coordinates the final clause with καί (‘and’). The parents’ ignorance is narratively unexpected, but no adversative conjunction is used.
  revised_text: जब वे पर्व के दिन पूरे कर चुके थे, तब उनके लौटते समय बालक यीशु यरूशलेम में रह गया[a], और उसके माता-पिता[b] को इसका पता नहीं चला।
