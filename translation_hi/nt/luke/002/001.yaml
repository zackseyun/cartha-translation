source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν ταῖς ἡμέραις ἐκείναις ἐξῆλθεν δόγμα παρὰ Καίσαρος Αὐγούστου ἀπογράφεσθαι πᾶσαν τὴν οἰκουμένην·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/001.yaml
  text: It happened in those days that a decree went out from Caesar Augustus that all the inhabited world should be registered[a].
translation:
  language: hi
  text: उन दिनों ऐसा हुआ कि कैसर औगुस्तुस की ओर से राजाज्ञा निकली कि सारे बसे हुए संसार के निवासियों का पंजीकरण किया जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारे रोमी संसार के निवासियों का’ अथवा ‘पूरे साम्राज्य के निवासियों का।’ यूनानी पद प्रायः रोमी साम्राज्य के संदर्भ में समझे गए बसे हुए संसार को दर्शाता है।
    reason: वैकल्पिक संदर्भगत अर्थ
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह यूनानी कथात्मक सूत्र नई घटना आरम्भ करता है। ‘ऐसा हुआ कि’ उसका स्वाभाविक आधुनिक हिन्दी रूप है; δὲ के हल्के संक्रमण को अलग भारी संयोजक से व्यक्त करना आवश्यक नहीं।
- source_word: ἐν ταῖς ἡμέραις ἐκείναις
  choice: उन दिनों
  rationale: समय-सूचक पद का निकट और स्वाभाविक हिन्दी रूप।
- source_word: ἐξῆλθεν δόγμα
  choice: राजाज्ञा निकली
  rationale: δόγμα यहाँ सम्राट का आधिकारिक आदेश है और ἐξῆλθεν उसके जारी होकर प्रसारित होने को दर्शाता है। ‘राजाज्ञा निकली’ दोनों का सहज तथा गरिमापूर्ण संयुक्त रूप है।
- source_word: παρὰ Καίσαρος Αὐγούστου
  choice: कैसर औगुस्तुस की ओर से
  rationale: παρά के संबंधकारक रूप से आदेश के स्रोत का बोध होता है। ‘की ओर से’ इस स्रोत-संबंध को स्पष्ट रखता है।
- source_word: ἀπογράφεσθαι
  choice: पंजीकरण किया जाए
  rationale: क्रिया आधिकारिक अभिलेखन अथवा नाम-दर्ज करने को सूचित करती है। यह अनुवाद जनगणना या कराधान जैसी ऐसी विशिष्टता नहीं जोड़ता जिसे इस पद में स्वयं स्पष्ट नहीं किया गया।
- source_word: πᾶσαν τὴν οἰκουμένην
  choice: सारे बसे हुए संसार
  rationale: οἰκουμένη का मूल अर्थ बसा हुआ या आबाद संसार है; रोमी संदर्भ में इसका आशय रोमी जगत भी हो सकता है। मुख्य पाठ व्यापक अभिव्यक्ति सुरक्षित रखता है।
theological_decisions:
- issue: οἰκουμένη का भौगोलिक और राजनीतिक विस्तार
  choice: सारे बसे हुए संसार
  alternative: सारा रोमी संसार; पूरा साम्राज्य
  rationale: यह मुख्यतः ऐतिहासिक-शाब्दिक प्रश्न है। मुख्य पाठ यूनानी पद की व्यापकता और संभावित अतिशयोक्तिपूर्ण सार्वभौमिक दृष्टि को बनाए रखता है, जबकि पादटिप्पणी रोमी साम्राज्य-संदर्भ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, स्पष्ट और गरिमापूर्ण शैली। ‘कैसर औगुस्तुस’ मूल नामों के निकट लिप्यंतरण हैं। पादटिप्पणी-चिह्न संबंधित वाक्य के अंत में रखा गया है।
