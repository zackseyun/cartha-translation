    reason: lexical_alternative
lexical_decisions:
- source_word: αὕτη
  choice: यह
  rationale: यह संकेतवाचक शब्द पद 1 में बताई गई नाम-लिखाई की ओर लौटता है।
- source_word: ἀπογραφὴ
  choice: नाम-लिखाई
  rationale: यह सरकारी अभिलेख में लोगों के नाम दर्ज करने की प्रक्रिया को सहज हिन्दी में व्यक्त करता है और कर-संबंधी जनगणना से अधिक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: πρώτη
  choice: पहली बार
  rationale: मुख्य पाठ में इसके सामान्य क्रमवाचक अर्थ ‘पहली’ को रखा गया है; ‘पहले’ वाला तुलनात्मक-कालिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: ἐγένετο
  choice: हुई
  rationale: प्रशासनिक घटना के घटित होने के लिए संक्षिप्त और स्वाभाविक हिन्दी।
- source_word: ἡγεμονεύοντος
  choice: शासन कर रहा था
  rationale: समकालिक परिस्थिति बताने वाले यूनानी कृदन्त का अर्थ सुरक्षित रहता है और कुरेनियुस के विशिष्ट आधिकारिक पदनाम को मूल से अधिक निश्चित नहीं किया जाता।
- source_word: τῆς Συρίας
  choice: सीरिया पर
  rationale: स्थान-नाम का मानक हिन्दी रूप; ‘शासन करना’ के साथ ‘पर’ स्वाभाविक है।
- source_word: Κυρηνίου
  choice: कुरेनियुस
  rationale: यूनानी व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ऐतिहासिक रूप से विवादित वाक्यांश में πρώτη का अर्थ
  choice: 'मुख्य पाठ में सामान्य क्रमवाचक अर्थ: ‘पहली बार’'
  alternative: ‘यह नाम-लिखाई कुरेनियुस के सीरिया पर शासन करने से पहले हुई।’
  rationale: πρώτη का सीधा अर्थ क्रमवाचक ‘पहली’ है। तुलनात्मक-कालिक ‘पहले’ व्याख्या संभव मानी गई है, इसलिए ऐतिहासिक और वाक्यगत तनाव को मिटाए बिना उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। कोष्ठक मूल यूनानी पाठ में उपस्थित कोष्ठकीय रूप को दर्शाते हैं। ‘नाम-लिखाई’ सामान्य पाठक के लिए बोधगम्य प्रशासनिक अभिव्यक्ति है; पादटिप्पणी में पारंपरिक विकल्प ‘जनगणना’ दिया गया है।
