  rationale: στρατιά के सैन्य अर्थ और οὐράνιος के स्वर्गीय संदर्भ दोनों को सुरक्षित रखता है। केवल ‘स्वर्गदूतों का समूह’ कहना मूल की सैन्य छवि को मिटा देता।
- source_word: αἰνούντων τὸν θεόν
  choice: परमेश्वर की स्तुति करते हुए
  rationale: वर्तमान कृदंत उनकी जारी गतिविधि को व्यक्त करता है; ‘परमेश्वर की स्तुति करना’ αἰνέω का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: καὶ λεγόντων
  choice: और यह कहते हुए
  rationale: दूसरा समन्वित कृदंत अगले पद में आने वाले कथन का परिचय देता है; ‘यह’ हिन्दी में उद्धरण की सहज भूमिका बनाता है।
theological_decisions:
- issue: στρατιᾶς οὐρανίου का अनुवाद
  choice: स्वर्गीय सेना
  alternative: स्वर्ग की सेना; स्वर्गीय सेनादल
  rationale: यह चयन एक व्यवस्थित स्वर्गीय समुदाय की सैन्य छवि को बनाए रखता है, जबकि प्रसंग में उसका कार्य युद्ध करना नहीं बल्कि परमेश्वर की स्तुति करना है। इस तनाव को सामान्यीकृत ‘बहुत-से स्वर्गदूत’ से समाप्त नहीं किया गया।
