  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘स्वर्गीय सेना’ मूल की सैन्य उपमा को बनाए रखता है; ‘विशाल समूह’ πλῆθος की बड़ी संख्या को स्वाभाविक ढंग से व्यक्त करता है। पद अगले वचन के उद्धरण की भूमिका होने के कारण अंत में द्विबिंदु रखा गया है।
