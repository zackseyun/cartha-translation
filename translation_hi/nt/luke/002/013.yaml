  rationale: यह क्रियाविशेषण घटना के एकाएक घटित होने और कथा में उत्पन्न आश्चर्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἐγένετο
  choice: प्रकट हुआ
  rationale: यहाँ γίνομαι किसी समूह के वहाँ उपस्थित हो जाने का परिचय देता है। हिन्दी में ‘प्रकट हुआ’ दृश्य के अनुरूप स्वाभाविक है, यद्यपि यूनानी क्रिया अपने-आप में केवल दृश्य दिखाई देने पर बल नहीं देती।
- source_word: σὺν τῷ ἀγγέλῳ
