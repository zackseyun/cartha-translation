source:
  edition: SBLGNT
  text: Τὸ δὲ παιδίον ηὔξανεν καὶ ἐκραταιοῦτο ⸂πληρούμενον σοφίᾳ⸃, καὶ χάρις θεοῦ ἦν ἐπ’ αὐτό.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/040.yaml
  text: And the child grew and became strong[a], being filled with wisdom, and the favor of God was upon him.
translation:
  language: hi
  text: और वह बालक बढ़ता गया और बलवान होता गया, बुद्धि से परिपूर्ण होता गया; और परमेश्वर की कृपा[a] उस पर थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, परमेश्वर का अनुग्रह; अथवा, परमेश्वर की कृपादृष्टि।
    reason: lexical_alternative
lexical_decisions:
- source_word: Τὸ δὲ παιδίον
  choice: और वह बालक
  rationale: παιδίον यहाँ शैशवावस्था के संदर्भ में बच्चे को दर्शाता है; आधुनिक हिन्दी में ‘वह बालक’ कथानक की कड़ी और विषय, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ηὔξανεν
  choice: बढ़ता गया
  rationale: अपूर्ण भूतकाल निरंतर विकास को दर्शाता है; ‘बढ़ता गया’ इस प्रगतिशील भाव को सहज हिन्दी में बनाए रखता है।
- source_word: ἐκραταιοῦτο
  choice: बलवान होता गया
  rationale: क्रिया क्रमिक रूप से सामर्थ्य बढ़ने का भाव देती है; यह पद शारीरिक और व्यापक मानवीय सुदृढ़ता के बीच स्रोत की खुली अर्थ-सीमा को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: πληρούμενον σοφίᾳ
  choice: बुद्धि से परिपूर्ण होता गया
  rationale: वर्तमान कृदन्त बालक के विकास के साथ चल रही प्रक्रिया को व्यक्त करता है, और σοφίᾳ को परिपूर्णता की विषय-वस्तु के रूप में प्रस्तुत करता है।
- source_word: χάρις θεοῦ
  choice: परमेश्वर की कृपा
  rationale: χάρις में कृपा, अनुग्रह और कृपापूर्ण प्रसन्नता के अर्थ शामिल हो सकते हैं। ‘कृपा’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है; वैध वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: ἦν ἐπ’ αὐτό
  choice: उस पर थी
  rationale: यह अभिव्यक्ति परमेश्वर की कृपा की उस पर बनी हुई उपस्थिति को सरल, प्रतिष्ठित और स्रोत-सन्निकट हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: मसीह के मानवीय विकास के वर्णन में χάρις θεοῦ का अनुवाद
  choice: परमेश्वर की कृपा
  alternative: परमेश्वर का अनुग्रह / परमेश्वर की कृपादृष्टि
  rationale: पद यीशु के वास्तविक मानवीय विकास का वर्णन करता है। ‘कृपा’ स्रोत के अर्थ-विस्तार को बनाए रखती है और इसे केवल अनुमोदन अथवा किसी कथित कमी की पूर्ति के अर्थ तक सीमित नहीं करती; ‘अनुग्रह’ और ‘कृपादृष्टि’ वैध विकल्प हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘बढ़ता गया’, ‘बलवान होता गया’ और ‘परिपूर्ण होता गया’ से यूनानी अपूर्ण भूतकाल तथा वर्तमान कृदन्त का निरंतर विकास वाला भाव सुरक्षित रखा गया है। वाक्य की गरिमा बनाए रखते हुए शब्दावली सामान्य पाठक के लिए सुबोध रखी गई है।
