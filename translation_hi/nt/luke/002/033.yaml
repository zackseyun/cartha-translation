  text: καὶ ἦν ⸂ὁ πατὴρ αὐτοῦ⸃ καὶ ἡ ⸀μήτηρ θαυμάζοντες ἐπὶ τοῖς λαλουμένοις περὶ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/033.yaml
  text: And his father and mother were marveling at the things being said about him[a].
translation:
  language: hi
  text: और उसके पिता और माता उसके विषय में कही जा रही बातों पर आश्चर्य कर रहे थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से ‘उसके पिता’ है। कथा में इसका संकेत यूसुफ की ओर सामान्य पारिवारिक या कानूनी अर्थ में है। कुछ अनुवाद, लूका द्वारा पहले बताए गए कुँवारी के गर्भधारण के विषय में भ्रम से बचने के लिए, ‘यूसुफ और उसकी माता’ अनुवाद करते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: ὁ πατὴρ αὐτοῦ
  choice: उसके पिता
  rationale: यूनानी पाठ का सीधा अर्थ ‘उसके पिता’ है। कथा में यह यूसुफ के लिए सामान्य पारिवारिक और कानूनी अर्थ में प्रयुक्त है; इसे ‘यूसुफ’ करके पाठ में निहित तनाव को हटाया नहीं गया।
- source_word: μήτηρ
  choice: माता
  rationale: μήτηρ का मानक और गरिमापूर्ण हिन्दी रूप ‘माता’ है; यहाँ यह ‘उसके पिता और माता’ की संयुक्त अभिव्यक्ति का भाग है।
- source_word: θαυμάζοντες
  choice: अचम्भा कर रहे थे
  rationale: ἦν के साथ वर्तमान कृदन्त भूतकाल में जारी प्रतिक्रिया को व्यक्त करता है। ‘अचम्भा कर रहे थे’ उस निरन्तर भाव और विस्मय, दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: ἐπὶ τοῖς λαλουμένοις
  choice: कही जा रही बातों पर
  rationale: बहुवचन निष्क्रिय कृदन्त का रूप ‘कही जा रही बातों’ में सुरक्षित है और ἐπί के कारण उनकी प्रतिक्रिया का आधार ‘पर’ से व्यक्त होता है।
- source_word: περὶ αὐτοῦ
  choice: उसके विषय में
  rationale: περί के सम्बन्धसूचक अर्थ को आधुनिक, गरिमापूर्ण हिन्दी में ‘उसके विषय में’ व्यक्त किया गया है।
theological_decisions:
- issue: कुँवारी से गर्भधारण के प्रसंग में यूसुफ के लिए ‘उसके पिता’ का प्रयोग
  choice: मुख्य पाठ में यूनानी के अनुसार ‘उसके पिता’ रखा गया और पारिवारिक/कानूनी आशय पादटिप्पणी में स्पष्ट किया गया।
  alternative: ‘यूसुफ और उसकी माता’ अथवा ‘उसका कानूनी पिता’
  rationale: मूल पाठ स्वयं ‘उसके पिता’ कहता है। लूका की कथा में यह सामान्य पारिवारिक या कानूनी सम्बोधन हो सकता है और इससे पहले वर्णित कुँवारी से गर्भधारण का निषेध नहीं होता। अनुवाद में इस वास्तविक पाठगत और धर्मवैचारिक तनाव को कृत्रिम रूप से नहीं मिटाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य। ‘अचम्भा कर रहे थे’ जारी भूतकालीन प्रतिक्रिया को व्यक्त करता है; ‘कही जा रही बातों’ से यूनानी बहुवचन और निष्क्रियता दोनों सुरक्षित हैं।
