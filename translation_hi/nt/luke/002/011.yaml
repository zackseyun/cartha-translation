base_translation:
  language: en
  yaml_path: translation/nt/luke/002/011.yaml
  text: because today a Savior was born for you in the city of David[a], who is Messiah the Lord.
translation:
  language: hi
  text: क्योंकि आज दाऊद के नगर में तुम्हारे लिए एक उद्धारकर्ता जन्मा है, जो मसीहा और प्रभु है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु का मसीहा।” यूनानी पदावली χριστὸς κύριος का शाब्दिक रूप “मसीहा प्रभु” है और इसे सामान्यतः “मसीहा और प्रभु” के अर्थ में समझा जाता है। पारंपरिक अनुवाद “मसीह प्रभु” है।
    reason: χριστὸς κύριος की सघन यूनानी पदावली के वैकल्पिक संबंध और पारंपरिक रूप को दर्ज करना।
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पिछले पद में स्वर्गदूत द्वारा सुनाए गए बड़े आनंद के समाचार का कारण और विषय स्पष्ट करता है।
- source_word: ἐτέχθη
  choice: जन्मा है
  rationale: यूनानी अओरिस्ट को वर्तमान घोषणा के स्वाभाविक हिन्दी रूप में व्यक्त किया गया है; इससे हाल में घटित जन्म की सूचना स्पष्ट रहती है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: यहाँ दत्तिव कारक लाभ का भाव देता है—यह जन्म सुनने वालों के हित में हुआ है।
- source_word: σήμερον
  choice: आज
  rationale: आधुनिक हिन्दी में समयसूचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद।
- source_word: σωτὴρ
  choice: उद्धारकर्ता
  rationale: यह शब्द बचाने और छुड़ाने वाले की भूमिका के साथ इस प्रसंग का राजकीय-मसीहाई महत्व भी बनाए रखता है।
- source_word: ὅς ἐστιν
  choice: जो … है
  rationale: यह संबंधवाचक उपवाक्य उद्धारकर्ता की पहचान आगे दिए गए पदों से कराता है।
- source_word: χριστὸς
  choice: मसीहा
  rationale: यहाँ Χριστός नाम नहीं, दाऊदी अपेक्षा से जुड़ी उपाधि है; इसलिए अर्थसूचक ‘मसीहा’ चुना गया है।
- source_word: κύριος
  choice: प्रभु
  rationale: यह अधिकार और गहरे धर्मवैज्ञानिक महत्व वाली उपाधि है; ‘स्वामी’ इस संदर्भ में अपेक्षाकृत कमजोर होगा।
- source_word: ἐν πόλει Δαυίδ
  choice: दाऊद के नगर में
  rationale: यह मूल संबंधवाचक संरचना और दाऊद से जुड़ी राजकीय पृष्ठभूमि को सुरक्षित रखता है; संदर्भ में नगर बेतलेहेम है।
theological_decisions:
- issue: χριστὸς κύριος का अनुवाद
  choice: मसीहा प्रभु
  alternative: प्रभु का मसीहा; पारंपरिक रूप में ‘मसीह प्रभु’
  rationale: यूनानी में दोनों शब्द प्रथमा विभक्ति में साथ रखे गए हैं और सामान्यतः उद्धारकर्ता की दो उपाधियों—मसीहा और प्रभु—के रूप में समझे जाते हैं। हिन्दी में ‘मसीहा प्रभु’ मूल क्रम और सघनता बनाए रखता है; ‘प्रभु का मसीहा’ एक संभव किंतु अधिक व्याख्यात्मक संबंध है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘तुम्हारे लिए’ संदर्भानुसार बहुवचन श्रोताओं को संबोधित करता है। ‘मसीहा प्रभु’ की असामान्य किंतु मूल-सन्निकट सघनता को पादटिप्पणी से स्पष्ट किया गया है।
