  text: और सब लोग पंजीकृत होने के लिए जा रहे थे, हर एक अपने नगर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπορεύοντο
  choice: जा रहे थे
  rationale: अपूर्ण भूतकाल की जारी या क्रमिक गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πάντες
  choice: सब लोग
  rationale: यूनानी बहुवचन ‘सब’ को स्पष्ट और सहज हिन्दी में प्रस्तुत करता है।
- source_word: ἀπογράφεσθαι
  choice: अपना नाम दर्ज कराने
  rationale: जनगणना के संदर्भ में आधिकारिक पंजीकरण का अर्थ स्पष्ट करता है; हिन्दी में यह प्रयोग स्वाभाविक है और कर्मवाच्य अर्थ को प्रयोजक रचना से व्यक्त करता है।
- source_word: ἕκαστος
  choice: हर एक
  rationale: व्यक्तिगत और वितरणात्मक बल को बनाए रखता है।
- source_word: ἑαυτοῦ
  choice: अपने
  rationale: ‘हर एक’ के साथ हिन्दी का निजवाचक ‘अपने’ स्वाभाविक रूप से उसी व्यक्ति के नगर को सूचित करता है; हिन्दी में यहाँ अलग लिंगसूचक सर्वनाम आवश्यक नहीं है।
- source_word: πόλιν
  choice: नगर
  rationale: πόλις का औपचारिक किंतु सामान्य हिन्दी समकक्ष है और ‘पैतृक नगर’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: ἕκαστος ... ἑαυτοῦ की एकवचन पुल्लिंग वितरणात्मक अभिव्यक्ति
  choice: ‘हर एक अपने नगर में’
  alternative: ‘हर व्यक्ति अपने नगर में’ अथवा लिंगसूचक ‘हर एक उसके अपने नगर में’
  rationale: हिन्दी में ‘हर एक अपने’ स्रोत के एकवचन वितरणात्मक अर्थ को ठीक रखता है, जबकि अस्वाभाविक लिंगसूचक सर्वनाम जोड़े बिना निजवाचक संबंध स्पष्ट करता है। यह पाठ को लिंग-निरपेक्ष बनाने के लिए बहुवचन में नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अपना नाम दर्ज कराने’ सामान्य पाठक के लिए प्रशासनिक पंजीकरण को स्पष्ट करता है। डैश यूनानी के वितरणात्मक अगले खंड को स्वाभाविक रूप से उभारता है।
