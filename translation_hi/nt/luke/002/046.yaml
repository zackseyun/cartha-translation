id: LUK.2.46
reference: Luke 2:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐγένετο μετὰ ἡμέρας τρεῖς εὗρον αὐτὸν ἐν τῷ ἱερῷ καθεζόμενον ἐν μέσῳ τῶν διδασκάλων καὶ ἀκούοντα αὐτῶν καὶ ἐπερωτῶντα αὐτούς·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/046.yaml
  text: And it happened that after three days they found him in the temple[b][a], sitting among the teachers and listening to them and asking them questions.
translation:
  language: hi
  text: और ऐसा हुआ कि तीन दिनों के बाद उन्होंने उसे मंदिर[a] में शिक्षकों के बीच बैठे हुए, उनकी बातें सुनते और उनसे प्रश्न करते[b] पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी शब्द ἱερόν पूरे मंदिर-परिसर या उसके प्रांगणों को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
  - marker: b
    text: या, “उनसे सवाल करते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: यह लूका की सामान्य कथात्मक अभिव्यक्ति है। ‘ऐसा हुआ’ घटना का परिचय देने वाली उसकी शक्ति को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: μετὰ ἡμέρας τρεῖς
  choice: तीन दिनों के बाद
  rationale: μετά के साथ कर्मकारक समय की उत्तरवर्तिता दिखाता है; यह अनुवाद यूनानी शब्दक्रम और अर्थ दोनों के निकट है।
- source_word: εὗρον
  choice: उन्होंने ... पाया
  rationale: यह सामान्य कथात्मक भूतकालीन क्रिया है; हिन्दी वाक्य-संरचना के अनुसार क्रिया को अंत में रखकर अर्थ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ἐν τῷ ἱερῷ
  choice: मंदिर
  rationale: ἱερόν पूरे मंदिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। मुख्य पाठ में प्रचलित और सुबोध ‘मंदिर’ रखा गया है तथा विस्तार पाद-टिप्पणी में दिया गया है।
- source_word: καθεζόμενον
  choice: बैठे हुए
  rationale: वर्तमान कृदन्त उस समय यीशु की जारी मुद्रा का वर्णन करता है जब वे उसे पाते हैं।
- source_word: ἐν μέσῳ τῶν διδασκάλων
  choice: शिक्षकों के बीच
  rationale: ἐν μέσῳ का अर्थ ‘बीच में’ है और διδάσκαλοι का सीधा अर्थ ‘शिक्षक’ है। ‘व्यवस्था के शिक्षक’ जैसी अधिक विशिष्ट पहचान मूल पाठ में स्पष्ट नहीं है।
- source_word: ἀκούοντα αὐτῶν
  choice: उनकी बातें सुनते
  rationale: यहाँ ἀκούω ध्यानपूर्वक सुनने की जारी क्रिया बताता है। ‘बातें’ जोड़ने से हिन्दी स्वाभाविक बनती है और आशय नहीं बदलता।
- source_word: ἐπερωτῶντα αὐτούς
  choice: उनसे प्रश्न करते
  rationale: ἐπερωτάω का अर्थ पूछना या प्रश्न करना हो सकता है। यह चयन सक्रिय संवाद दिखाता है, पर विरोध या कठोर पूछताछ का अनावश्यक भाव नहीं लाता।
theological_decisions:
- issue: शिक्षकों के साथ यीशु के संवाद का स्वरूप
  choice: ‘उनकी बातें सुनते और उनसे प्रश्न करते’—सीखने और संवाद में सक्रिय भागीदारी
  alternative: ‘उनसे सवाल करते’ या ऐसा अधिक तीखा रूप, जिससे चुनौती देने अथवा परीक्षा लेने का भाव निकल सकता है
  rationale: मूल पाठ यीशु को ध्यान से सुनते और प्रश्न करते दिखाता है। अनुवाद न तो उसकी बुद्धि को घटाता है, न इस संवाद को अनावश्यक रूप से टकरावपूर्ण बनाता है; इस प्रकार पद में उपस्थित विनम्रता और असाधारण समझ के बीच का तनाव बना रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिक्षक’ मूल के अनुरूप व्यापक पद है; ‘शास्त्री’ या ‘व्यवस्था के शिक्षक’ जैसी अधिक विशिष्ट पहचान नहीं जोड़ी गई। दोनों पाद-टिप्पणी चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
