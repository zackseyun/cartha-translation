  text: And they did not understand the statement that he spoke to them[a].
translation:
  language: hi
  text: और वे उस बात को नहीं समझे जो उसने उनसे कही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वचन,” “कथन,” या “विषय।”
    reason: lexical_alternative
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: सामान्य संयोजक के रूप में यह कथा-प्रवाह बनाए रखता है और यूनानी में स्पष्ट रूप से निहित न होने वाला विरोधसूचक भाव नहीं जोड़ता।
- source_word: αὐτοὶ
  choice: वे
  rationale: संदर्भ में यह यीशु के माता-पिता की ओर संकेत करता है। यूनानी सर्वनाम में बल संभव है, पर यहाँ स्वाभाविक हिन्दी में अलग से “वे स्वयं” कहना आवश्यक नहीं।
- source_word: οὐ συνῆκαν
  choice: नहीं समझे
  rationale: यह συνίημι के सीधे अर्थ ‘समझना’ को सहज, आधुनिक हिन्दी में व्यक्त करता है; इसमें न तो आंशिक समझ और न अस्वीकार का भाव जोड़ा गया है।
- source_word: τὸ ῥῆμα
  choice: उस बात
  rationale: ῥῆμα किसी शब्द, कही हुई बात, कथन या विषय को सूचित कर सकता है। यहाँ यह यीशु की ठीक पहले कही हुई बात को दर्शाता है; “उस बात” स्वाभाविक हिन्दी है और मूल की अर्थ-व्याप्ति को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: ὃ ἐλάλησεν αὐτοῖς
  choice: जो उसने उनसे कही थी
  rationale: सापेक्ष उपवाक्य को “बात” से स्पष्ट रूप से जोड़ता है। “कही थी” हिन्दी में पूर्ववर्ती कथन और उसके बाद माता-पिता की नासमझी के कालक्रम को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यीशु के माता-पिता की प्रतिक्रिया का कथात्मक चित्रण
  choice: स्पष्ट रूप से कहा गया है कि वे यीशु की कही बात नहीं समझे।
  alternative: वे पूरी तरह नहीं समझे; अथवा उन्होंने उसकी बात स्वीकार नहीं की।
  rationale: यूनानी पाठ समझ के अभाव को बताता है, न कि केवल अधूरी समझ या अस्वीकार को। यह रूप यीशु की पहचान और कार्य से जुड़ा कथात्मक और धर्मवैचारिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। “उस बात” सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी ῥῆμα के अन्य सम्भव अर्थों को सुरक्षित रखती है।
