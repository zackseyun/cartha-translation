lexical_decisions:
- source_word: ἐδέξατο
  choice: लिया
  rationale: δέχομαι का अर्थ ‘ग्रहण करना’ या ‘स्वागत करना’ हो सकता है, पर εἰς τὰς ἀγκάλας (‘बाँहों में’) के साथ यहाँ बच्चे को बाँहों में लेने की शारीरिक क्रिया स्वाभाविक अर्थ है।
- source_word: αὐτό
  choice: उसे
  rationale: यूनानी सर्वनाम नपुंसकलिंग रूप में है क्योंकि वह शिशु यीशु का उल्लेख करता है; हिन्दी में व्यक्ति के लिए ‘उसे’ स्वाभाविक और स्पष्ट है।
- source_word: εἰς τὰς ἀγκάλας
  choice: अपनी बाँहों में
  rationale: ἀγκάλαι आलिंगन करने या उठाकर रखने वाली बाँहों को दर्शाता है। प्रसंग से बाँहें शिमोन की हैं, इसलिए हिन्दी में ‘अपनी’ जोड़ना स्वाभाविक है।
- source_word: εὐλόγησεν τὸν θεόν
  choice: परमेश्वर को धन्य कहा
  rationale: यह अनुवाद परमेश्वर को कर्ता नहीं बल्कि εὐλογέω के कर्म के रूप में बनाए रखता है और ‘स्तुति की’ की अपेक्षा मूल क्रिया की ‘धन्य कहना’ वाली अभिव्यक्ति को सुरक्षित रखता है।
- source_word: καὶ εἶπεν
  choice: और बोला,
  rationale: यह आगे आने वाले प्रत्यक्ष कथन का सरल कथात्मक परिचय है। ‘बोला’ आधुनिक हिन्दी में स्वाभाविक है और कर्ता पहले ही स्पष्ट है।
- source_word: αὐτός
  choice: उसने
  rationale: कर्तृवाचक सर्वनाम को हिन्दी के परसर्गीय भूतकालीन निर्माण में ‘उसने’ से व्यक्त किया गया है; ‘उसने स्वयं’ कहना यहाँ यूनानी के हल्के बलाघात को आवश्यकता से अधिक उभारता।
theological_decisions:
- issue: नपुंसकलिंग सर्वनाम αὐτό का संदर्भ
  choice: शिशु यीशु के व्यक्तिगत संदर्भ को ‘उसे’ से व्यक्त किया गया है।
  alternative: व्याकरणिक लिंग का अत्यधिक शाब्दिक अनुसरण करते हुए निर्जीव वस्तु-सूचक अभिव्यक्ति देना।
  rationale: यूनानी सर्वनाम का रूप उसके पूर्वपद के व्याकरणिक लिंग के अनुरूप है, पर उसका संदर्भ एक व्यक्ति—शिशु यीशु—से है। हिन्दी में ‘उसे’ कहना कथा के संदर्भ को ठीक और बिना अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के व्यक्त करता है।
- issue: εὐλόγησεν τὸν θεόν का अर्थ
  choice: ‘परमेश्वर को धन्य कहा’ रखा गया है।
  alternative: ‘परमेश्वर की स्तुति की।’
  rationale: ‘स्तुति की’ प्रसंगगत अर्थ को सहज बनाता, पर ‘धन्य कहा’ मूल क्रिया की विशिष्ट अभिव्यक्ति और परमेश्वर के कर्मरूप को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परमेश्वर को धन्य कहा’ जानबूझकर कुछ बाइबलीय गरिमा रखता है, जबकि वाक्य-विन्यास सरल और बोलचाल से निकट है।
