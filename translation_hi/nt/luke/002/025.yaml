  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἰδοὺ ⸂ἄνθρωπος ἦν⸃ ἐν Ἰερουσαλὴμ ᾧ ὄνομα Συμεών, καὶ ὁ ἄνθρωπος οὗτος δίκαιος καὶ εὐλαβής, προσδεχόμενος παράκλησιν τοῦ Ἰσραήλ, καὶ πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/025.yaml
  text: And behold[a], there was a man in Jerusalem whose name was Simeon, and this man was righteous and devout, waiting for the consolation of Israel[b], and the Holy Spirit was upon him.
translation:
  language: hi
  text: और देखो, यरूशलेम में शिमोन नाम का एक मनुष्य था। वह मनुष्य धर्मी और भक्त था और इस्राएल की सांत्वना[a] की प्रतीक्षा कर रहा था; और पवित्र आत्मा[b] उस पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएल को मिलने वाला दिलासा।’ यह वाक्यांश उस दैवी सांत्वना और पुनर्स्थापना की ओर संकेत करता है जिसकी इस्राएल को आशा थी।
    reason: lexical_alternative
  - marker: b
    text: संभवतः ‘एक पवित्र आत्मा उस पर था’; फिर भी लूका के प्रसंग में इसका सबसे स्वाभाविक संदर्भ पवित्र आत्मा से है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह लूका के सजीव परिचयात्मक कथन-चिह्न को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक भी है।
- source_word: ἄνθρωπος
  choice: मनुष्य
  rationale: यहाँ शब्द एक पुरुष, शिमोन, के लिए प्रयुक्त है; ‘मनुष्य’ मूल शब्द की व्यापकता और प्रसंगगत पुरुष-संदर्भ दोनों को सहज रूप से व्यक्त करता है।
- source_word: ᾧ ὄνομα Συμεών
  choice: शिमोन नाम का
  rationale: यह यूनानी पहचान-सूचक वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: δίκαιος
  choice: धर्मी
  rationale: यह शिमोन के नैतिक और परमेश्वर-संबंधी चरित्र, दोनों को व्यक्त करता है।
- source_word: εὐλαβής
  choice: भक्त
  rationale: यह परमेश्वर के प्रति श्रद्धा और सावधान धार्मिक जीवन को साधारण आधुनिक हिन्दी में संक्षेप से व्यक्त करता है।
- source_word: προσδεχόμενος
  choice: प्रतीक्षा कर रहा था
  rationale: यह कृदंत में निहित निरंतर और आशापूर्ण प्रतीक्षा को व्यक्त करता है।
- source_word: παράκλησιν τοῦ Ἰσραήλ
  choice: इस्राएल की सांत्वना
  rationale: यह परमेश्वर से मिलने वाली सांत्वना और पुनर्स्थापना की आशा को बनाए रखता है तथा संबंधकारक की संक्षिप्तता को अनावश्यक रूप से नहीं खोलता।
- source_word: πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: यद्यपि यूनानी में यहाँ निश्चयवाचक उपपद नहीं है, लूका के निकटवर्ती प्रसंग और प्रयोग में स्वाभाविक संकेत पवित्र आत्मा की ओर है।
- source_word: ἐπ’ αὐτόν
  choice: उस पर था
  rationale: यह आत्मा की उपस्थिति अथवा सामर्थ्य के मूल बाइबलीय मुहावरे को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: πνεῦμα ἦν ἅγιον ἐπ’ αὐτόν का अभिप्रेत संदर्भ
  choice: पवित्र आत्मा उस पर था
  alternative: कोई पवित्र आत्मा उस पर था
  rationale: लूका 2:26–27 का निकट प्रसंग इसे परमेश्वर के पवित्र आत्मा के संदर्भ में समझने का प्रबल आधार देता है; फिर भी उपपद के अभाव से उत्पन्न व्याकरणिक संभावना को पादटिप्पणी में रखा गया है।
- issue: παράκλησιν τοῦ Ἰσραήλ का अर्थ-क्षेत्र
  choice: इस्राएल की सांत्वना
  alternative: इस्राएल को मिलने वाला दिलासा
  rationale: ‘सांत्वना’ शोक में दिलासा देने से अधिक व्यापक, प्रतिज्ञात दैवी राहत और पुनर्स्थापना का भाव रखती है; पादटिप्पणी इस आशय को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘देखो’ कथात्मक उभार देता है; ‘धर्मी’, ‘भक्त’ और ‘पवित्र आत्मा’ जैसे परिचित बाइबलीय पद मूल के अर्थ और शैली को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
