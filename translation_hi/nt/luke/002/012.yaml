id: LUK.2.12
reference: Luke 2:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ τοῦτο ὑμῖν ⸀τὸ σημεῖον, εὑρήσετε βρέφος ἐσπαργανωμένον ⸀καὶ κείμενον ἐν φάτνῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/012.yaml
  text: 'And this will be the sign for you: you will find a baby wrapped in cloths and lying in a manger[a][b].'
translation:
  language: hi
  text: 'और तुम्हारे लिए यह चिन्ह होगा: तुम एक शिशु को कपड़ों में लिपटा हुआ[a] और चरनी में पड़ा हुआ[b] पाओगे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पोतड़ों में लिपटा हुआ।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘पशुओं की नाँद में पड़ा हुआ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: σημεῖον
  choice: चिन्ह
  rationale: यह शब्द यहाँ उस पहचान-सूचक बात को दर्शाता है जिससे चरवाहे शिशु को पहचान सकेंगे; ‘चिन्ह’ उसके अर्थ को बिना चमत्कारी प्रमाण का भाव जोड़े सुरक्षित रखता है।
- source_word: εὑρήσετε
  choice: तुम ... पाओगे
  rationale: भविष्यकाल का यह रूप चरवाहों से सीधे कही गई भविष्यवाणी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: βρέφος
  choice: एक शिशु
  rationale: βρέφος बहुत छोटे बच्चे को दर्शाता है; ‘शिशु’ सटीक, प्रतिष्ठित और सामान्यतः समझ में आने वाला हिन्दी शब्द है।
- source_word: ἐσπαργανωμένον
  choice: कपड़ों में लिपटा हुआ
  rationale: यह कृदन्त शिशु को कपड़े या कपड़े की पट्टियाँ लपेटने की दशा बताता है। मुख्य पाठ में सरल और स्पष्ट अभिव्यक्ति रखी गई है; अधिक पारंपरिक ‘पोतड़ों में’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: κείμενον
  choice: पड़ा हुआ
  rationale: κεῖμαι शिशु की वर्तमान अवस्था या स्थिति बताता है। ‘पड़ा हुआ’ पूर्व में रखे जाने की क्रिया के बजाय उस समय की स्थिति को व्यक्त करता है।
- source_word: φάτνῃ
  choice: चरनी में
  rationale: φάτνη पशुओं के चारा खाने के पात्र को दर्शा सकता है। जन्म-वृत्तांत में ‘चरनी’ स्थापित और संक्षिप्त हिन्दी पर्याय है; उसका अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: τοῦτο ὑμῖν τὸ σημεῖον
  choice: तुम्हारे लिए यह चिन्ह होगा
  rationale: यूनानी वाक्यांश में संयोजक क्रिया व्यक्त नहीं है। सन्दर्भ के अनुसार भविष्यकालीन ‘होगा’ जोड़ना हिन्दी में स्वाभाविक है और आगे बताए गए पहचान-सूचक चिन्ह का परिचय देता है।
theological_decisions:
- issue: चरवाहों को दिए गए चिन्ह का स्वरूप
  choice: पद इसे मुख्यतः शिशु की पहचान कराने वाले चिन्ह के रूप में प्रस्तुत करता है।
  alternative: इसे परमेश्वर की ओर से व्यापक धार्मिक पुष्टि या चमत्कारी चिन्ह भी समझा जा सकता है।
  rationale: अनुवाद केवल ‘चिन्ह’ कहता है और कोई व्याख्यात्मक विस्तार नहीं जोड़ता। इससे कथा में उसकी ठोस पहचान-सूचक भूमिका स्पष्ट रहती है, जबकि उसका सम्भावित गहरा धार्मिक महत्त्व खुला रहता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शिशु’, ‘चिन्ह’ और ‘चरनी’ सामान्य बाइबलीय हिन्दी से परिचित शब्द हैं, जबकि पादटिप्पणियाँ मूल शब्दों के अधिक ठोस सांस्कृतिक अर्थ को स्पष्ट करती हैं।
