  text: And Jesus kept increasing in wisdom and stature[b][a], and in favor with God and men.
translation:
  language: hi
  text: और यीशु बुद्धि और कद-काठी[a] में, तथा परमेश्वर और लोगों की कृपादृष्टि में बढ़ते गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आयु” अथवा “परिपक्वता”; यूनानी शब्द ἡλικία का अर्थ शारीरिक कद-काठी या आयु हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προέκοπτεν
  choice: निरन्तर बढ़ते गए
  rationale: अपूर्ण भूतकाल की क्रिया समय के साथ जारी वास्तविक प्रगति दिखाती है; यह हिन्दी में उसके कालगत और विकासात्मक भाव को स्वाभाविक रूप से व्यक्त करती है।
- source_word: σοφίᾳ
  choice: बुद्धि
  rationale: यह σοφία का मानक और सहज हिन्दी प्रतिरूप है, जिसमें समझ और विवेक दोनों समाहित हैं।
- source_word: ἡλικίᾳ
  choice: डील-डौल
  rationale: यहाँ शब्द आयु अथवा शारीरिक कद-काठी दोनों का संकेत दे सकता है। मुख्य पाठ में 'डील-डौल' दृश्यमान शारीरिक वृद्धि को स्वाभाविक रूप से व्यक्त करता है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: χάριτι
  choice: कृपा
  rationale: इस सम्बन्धपरक प्रसंग में χάρις का अर्थ अनुग्रह, प्रसन्नता या स्वीकार्यता है। 'कृपा में बढ़ना' हिन्दी बाइबलीय शैली में सहज है और परमेश्वर तथा लोगों—दोनों के साथ समान रूप से जुड़ता है।
- source_word: παρὰ θεῷ
  choice: परमेश्वर की कृपा में
  rationale: παρά के साथ सम्प्रदान यहाँ किसी के समक्ष अथवा उसके साथ अनुकूल सम्बन्ध का भाव देता है; समानान्तर पदों के कारण हिन्दी में सम्बन्धसूचक षष्ठी स्वाभाविक है।
- source_word: ἀνθρώποις
  choice: लोगों
  rationale: ἄνθρωποι यहाँ सामान्यतः मनुष्यों को सूचित करता है, केवल पुरुषों को नहीं; 'लोगों' आधुनिक हिन्दी में इस प्रतिनिधि अर्थ को स्पष्ट और स्वाभाविक ढंग से पहुँचाता है।
theological_decisions:
- issue: यीशु का वास्तविक मानवीय विकास
  choice: पद को सीधे इस प्रकार अनूदित किया गया है कि यीशु बुद्धि, शारीरिक विकास और कृपा में निरन्तर बढ़ते गए।
  alternative: धर्मवैज्ञानिक तनाव से बचने के लिए उनके विकास के कथन को हल्का या अस्पष्ट कर देना।
  rationale: यूनानी पाठ यीशु की जारी प्रगति को स्पष्ट रूप से कहता है। उनके वास्तविक मानवीय विकास को बिना नरम किए सुरक्षित रखना मूल पाठ के प्रति निष्ठावान है और धर्मवैज्ञानिक तनाव का स्वयं समाधान नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। 'निरन्तर बढ़ते गए' जारी प्रगति को व्यक्त करता है। 'डील-डौल' बोलचाल में समझ आने वाला है, जबकि पादटिप्पणी मूल शब्द की वास्तविक अर्थगत अस्पष्टता बनाए रखती है।
