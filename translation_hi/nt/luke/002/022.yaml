source:
  edition: SBLGNT
  text: Καὶ ὅτε ἐπλήσθησαν αἱ ἡμέραι τοῦ καθαρισμοῦ αὐτῶν κατὰ τὸν νόμον Μωϋσέως, ἀνήγαγον αὐτὸν εἰς Ἱεροσόλυμα παραστῆσαι τῷ κυρίῳ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/022.yaml
  text: And when the days of their purification were fulfilled according to the law of Moses[a], they brought him up to Jerusalem to present him to the Lord,
translation:
  language: hi
  text: और जब मूसा की व्यवस्था के अनुसार उनके शुद्धीकरण के दिन पूरे हुए[a], तो वे उसे प्रभु के सामने प्रस्तुत करने के लिए यरूशलेम ले गए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में ‘उनके शुद्धीकरण’ के स्थान पर ‘उसकी शुद्धि’ पढ़ा जाता है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐπλήσθησαν
  choice: पूरे हुए
  rationale: समयावधि के अपनी निर्धारित पूर्णता तक पहुँचने का स्वाभाविक और सटीक हिन्दी रूप।
- source_word: καθαρισμοῦ
  choice: शुद्धीकरण
  rationale: प्रसव के बाद मूसा की व्यवस्था से संबंधित अनुष्ठानिक शुद्धि के लिए स्पष्ट और गरिमापूर्ण पद।
- source_word: αὐτῶν
  choice: उनके
  rationale: प्रदत्त यूनानी पाठ के बहुवचन सर्वनाम को बनाए रखता है और उसे संदर्भ के आधार पर एकवचन में नहीं बदलता।
- source_word: κατὰ τὸν νόμον Μωϋσέως
  choice: मूसा की व्यवस्था के अनुसार
  rationale: व्यवस्था के विधान के अनुरूप होने का औपचारिक अर्थ पारदर्शी ढंग से व्यक्त करता है।
- source_word: ἀνήγαγον
  choice: ले गए
  rationale: यरूशलेम की ओर ले जाने का स्वाभाविक आधुनिक हिन्दी रूप; हिन्दी में ‘ऊपर ले गए’ अनावश्यक रूप से भौगोलिक दिशा पर बल दे सकता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय प्रचलित रूप।
- source_word: παραστῆσαι
  choice: सामने प्रस्तुत करने
  rationale: आराधनात्मक और विधिक संदर्भ में किसी को परमेश्वर के सम्मुख अर्पणात्मक ढंग से उपस्थित करने का अर्थ बनाए रखता है।
- source_word: κυρίῳ
  choice: प्रभु
  rationale: κύριος का श्रद्धापूर्ण और हिन्दी में सुस्थापित समतुल्य; ‘के सामने’ संबंध को स्वाभाविक बनाता है।
theological_decisions:
- issue: ‘उनके शुद्धीकरण’ में सर्वनाम का वचन
  choice: मुख्य पाठ में बहुवचन ‘उनके’ रखा गया
  alternative: ‘उसके शुद्धीकरण’ अथवा ‘उसकी शुद्धि’
  rationale: SBLGNT का प्रदत्त पाठ αὐτῶν, अर्थात बहुवचन ‘उनके’, पढ़ता है। लैव्यव्यवस्था की पृष्ठभूमि या वैकल्पिक पाठ के आधार पर इसे चुपचाप एकवचन नहीं किया गया; पाठांतर पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। ‘शुद्धीकरण’ विधिक-अनुष्ठानिक संदर्भ को बनाए रखता है। वाक्य के अंत का अल्पविराम अगले पद से इसके वाक्यगत जुड़ाव को दर्शाता है।
