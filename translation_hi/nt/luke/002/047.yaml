  rationale: The revision removes the added noun “बातें,” uses idiomatic modern Hindi for the cause of astonishment, and refines the lexical-alternative footnote. It retains the imperfect contextual sense through “उसे सुन रहे,” the universal scope of the listeners, and the twofold focus on understanding and answers.
