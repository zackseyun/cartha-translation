lexical_decisions:
- source_word: ἐξίσταντο
  choice: चकित थे
  rationale: यह अपूर्णकालीन रूप वहाँ उपस्थित लोगों की जारी तीव्र विस्मय-प्रतिक्रिया व्यक्त करता है। ‘चकित थे’ स्वाभाविक आधुनिक हिन्दी है और भ्रामक अत्यधिक शाब्दिक मुहावरे से बचता है।
- source_word: δὲ
  choice: और
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; ‘और’ प्रसंग के प्रवाह को सहज रूप से आगे बढ़ाता है।
- source_word: πάντες οἱ ἀκούοντες αὐτοῦ
  choice: जितने लोग उसकी बातें सुन रहे थे, वे सभी
  rationale: यह पदबंध सुनने में लगे समस्त लोगों को सामूहिक रूप से दर्शाता है। ‘सभी’ πάντες की व्यापकता और ‘सुन रहे थे’ वर्तमान कृदंत की जारी क्रिया को सुरक्षित रखते हैं।
- source_word: ἐπὶ τῇ συνέσει καὶ ταῖς ἀποκρίσεσιν αὐτοῦ
  choice: उसकी समझ और उसके उत्तरों पर
  rationale: ἐπί के साथ दत्तिव यहाँ विस्मय के आधार या कारण को दर्शाता है। ‘पर’ हिन्दी में ‘चकित’ के साथ स्वाभाविक है; ‘समझ’ और ‘उत्तर’ क्रमशः σύνεσις और ἀπόκρισις के स्पष्ट, सामान्य अर्थ देते हैं।
