source:
  edition: SBLGNT
  text: ⸀καὶ ἄγγελος κυρίου ἐπέστη αὐτοῖς καὶ δόξα κυρίου περιέλαμψεν αὐτούς, καὶ ἐφοβήθησαν φόβον μέγαν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/009.yaml
  text: And an angel of the Lord stood before them[a], and the glory of the Lord shone around them[b], and they feared a great fear.
translation:
  language: hi
  text: और प्रभु का एक स्वर्गदूत उनके पास आ खड़ा हुआ[a], और प्रभु की महिमा उनके चारों ओर चमकी, और वे अत्यन्त भयभीत हो गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उनके पास आ गया’ या ‘उनके निकट खड़ा हो गया’ भी हो सकता है। यूनानी क्रिया अचानक उपस्थित होने के साथ-साथ पास खड़े होने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में शाब्दिक रूप से, ‘वे बड़े भय से डरे’ है। क्रिया और उसी मूल की संज्ञा का यह प्रयोग अत्यन्त भय को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄγγελος κυρίου
  choice: प्रभु का एक स्वर्गदूत
  rationale: इस स्वर्गीय जन्म-वृत्तांत में ἄγγελος का स्वाभाविक अर्थ ‘स्वर्गदूत’ है। यूनानी पदबंध में निश्चित उपपद नहीं है, इसलिए ‘एक स्वर्गदूत’ उपयुक्त है, न कि ‘वही/उस स्वर्गदूत’ जैसा निश्चित रूप।
- source_word: ἐπέστη αὐτοῖς
  choice: उनके पास आ खड़ा हुआ
  rationale: ἐφίστημι यहाँ पास आ जाने और उपस्थित होकर खड़े होने, दोनों भावों को व्यक्त कर सकता है। यह रूप ठोस दृश्य को बनाए रखता है और क्रिया में निहित आकस्मिक उपस्थिति को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: δόξα κυρίου
  choice: प्रभु की महिमा
  rationale: यह संबंधकारक पदबंध δόξα के दिव्य तेज और प्रताप के अर्थ को सहज तथा धर्मवैचारिक रूप से भारपूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: περιέλαμψεν αὐτούς
  choice: उनके चारों ओर चमक उठी
  rationale: περιλάμπω का अर्थ चारों ओर प्रकाश देना या प्रकाश से घेर लेना है। ‘चमक उठी’ घटना की सजीवता और प्रकाश के आरम्भ होने का भाव व्यक्त करता है।
- source_word: ἐφοβήθησαν φόβον μέγαν
  choice: वे अत्यन्त भयभीत हो गए
  rationale: क्रिया और उसी मूल की संज्ञा का यूनानी प्रयोग भय की तीव्रता बढ़ाता है। शाब्दिक पुनरुक्ति हिन्दी में अस्वाभाविक होगी; ‘अत्यन्त भयभीत’ वही तीव्रता स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: इस पद में κύριος का संदर्भ परमेश्वर से है। ‘प्रभु’ हिन्दी बाइबलीय प्रयोग में दिव्य संबोधन और अधिकार, दोनों को सुरक्षित रखता है; ‘स्वामी’ यहाँ अपेक्षाकृत सामान्य और मानवीय लग सकता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और कथात्मक रखी गई है। ‘स्वर्गदूत’, ‘प्रभु’ और ‘महिमा’ जैसे प्रचलित बाइबलीय शब्द बनाए गए हैं; यूनानी की अस्वाभाविक पुनरुक्ति को अर्थ-समान स्वाभाविक हिन्दी में व्यक्त किया गया है।
