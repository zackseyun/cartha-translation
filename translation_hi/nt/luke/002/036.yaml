  text: And there was a prophetess[a], Anna, the daughter of Phanuel, from the tribe of Asher. She was advanced in years, having lived with her husband seven years from her virginity[b],
translation:
  language: hi
  text: और आशेर के गोत्र में से फनूएल की बेटी हन्ना नाम की एक भविष्यद्वक्त्री थी। वह बहुत वृद्ध हो चुकी थी। अपने कुँवारेपन के बाद वह सात वर्ष अपने पति के साथ रही थी,[a]
  philosophy: optimal-equivalence
  footnotes:
