- source_word: ἔτη ἑπτὰ
  choice: सात वर्ष
  rationale: अवधि का सीधा अनुवाद।
- source_word: ἀπὸ τῆς παρθενίας αὐτῆς
  choice: अपने कुँवारेपन के बाद
  rationale: παρθενία का अर्थ कुँवारापन है और ἀπό यहाँ उस अवस्था से आगे की अवधि को सूचित करता है। मुख्य पाठ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी वैकल्पिक अधिक शाब्दिक रूप दर्ज करती है।
theological_decisions:
- issue: हन्नाह की भूमिका προφῆτις
  choice: भविष्यद्वक्त्री
  alternative: धार्मिक सेविका अथवा केवल सम्मानसूचक उपाधि
  rationale: मूल पाठ सामान्य बाइबलीय अर्थ वाली स्त्रीलिंग संज्ञा का प्रयोग करता है; इसे कमजोर या अस्पष्ट करने का कोई पाठगत कारण नहीं है।
- issue: हन्नाह की आयु का वर्णन
  choice: बहुत वृद्ध हो चुकी थी
  alternative: बहुत दिनों में आगे बढ़ चुकी थी
  rationale: यह वृद्धावस्था का मुहावरा है। स्वाभाविक हिन्दी में अर्थ दिया गया है, बिना अगले पद की आयु-संबंधी गणना को यहाँ आयात किए।
- issue: सात वर्षों की गणना
  choice: कुँवारेपन के बाद पति के साथ सात वर्ष
  alternative: कुँवारेपन से पति के साथ सात वर्ष
  rationale: यूनानी अभिव्यक्ति संक्षिप्त है और विवाह के बाद के सात वर्षों की ओर संकेत करती है। अनुवाद इस अर्थ को स्पष्ट करता है, पर इससे अधिक कालक्रम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘भविष्यद्वक्त्री’ स्त्रीलिंग को सुरक्षित रखता है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘हन्नाह’, ‘पनूएल’ और ‘आशेर’ प्रयुक्त हैं। पद मूल वाक्य के आगे जारी रहने के बावजूद हिन्दी में पठनीय पूर्ण वाक्यों के रूप में प्रस्तुत है।
