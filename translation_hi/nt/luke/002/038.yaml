source:
  edition: SBLGNT
  text: ⸀καὶ αὐτῇ τῇ ὥρᾳ ἐπιστᾶσα ἀνθωμολογεῖτο τῷ ⸀θεῷ καὶ ἐλάλει περὶ αὐτοῦ πᾶσιν τοῖς προσδεχομένοις ⸀λύτρωσιν Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/038.yaml
  text: And at that very hour[a], coming up[c][b], she began giving thanks to God and speaking about him to all who were waiting for the redemption of Jerusalem.
translation:
  language: hi
  text: और उसी घड़ी[a] वह आ पहुँची और परमेश्वर को धन्यवाद देने[b] तथा उन सब लोगों से उसके बारे में बात करने लगी जो यरूशलेम के छुटकारे की बाट जोह रहे थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठीक उसी समय।”
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर की स्तुति करने।” यूनानी क्रिया धन्यवाद और स्तुति, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: “उसके” का संकेत प्रसंग में सबसे स्वाभाविक रूप से बालक यीशु की ओर है, यद्यपि यूनानी में निकटतम स्पष्ट पूर्वपद “परमेश्वर” है।
    reason: alternative_reading
lexical_decisions:
- source_word: αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह कालवाचक पद उसी समय और घटना की तात्कालिकता पर बल देता है; आधुनिक हिन्दी में ‘उसी घड़ी’ स्वाभाविक और गरिमापूर्ण है।
- source_word: ἐπιστᾶσα
  choice: वह वहाँ आ पहुँची
  rationale: कृदन्त यहाँ हन्ना के उसी दृश्य पर आ जाने या निकट आने को व्यक्त करता है; ‘वहाँ आ पहुँची’ स्थान या ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀνθωμολογεῖτο
  choice: परमेश्वर को धन्यवाद देने लगी
  rationale: क्रिया परमेश्वर के प्रति धन्यवाद या स्तुति व्यक्त कर सकती है। अपूर्णकाल को आगमन के बाद आरम्भ हुई जारी क्रिया के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: τῷ θεῷ
  choice: परमेश्वर को
  rationale: सम्प्रदान कारक यहाँ धन्यवाद के प्राप्तकर्ता को दर्शाता है; हिन्दी में ‘परमेश्वर को’ सहज रूप है।
- source_word: ἐλάλει περὶ αὐτοῦ
  choice: उसके बारे में बात करने लगी
  rationale: मूल का पुल्लिंग सर्वनाम बनाए रखा गया है ताकि उसके संदर्भ को मुख्य पाठ में व्याख्यात्मक संज्ञा से न बदला जाए; अपूर्णकाल निरन्तर बोलने का भाव देता है।
- source_word: πᾶσιν τοῖς προσδεχομένοις
  choice: उन सब लोगों से ... जो ... बाट जोह रहे थे
  rationale: προσδέχομαι आशाभरी प्रतीक्षा को दर्शाता है। ‘बाट जोहना’ इस भाव को स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: λύτρωσιν
  choice: छुटकारे
  rationale: λύτρωσις मुक्ति, उद्धार या बन्धन से छुड़ाए जाने का व्यापक अर्थ रखता है। ‘छुटकारा’ साधारण पाठक के लिए सहज रहते हुए मूल की व्यापकता बनाए रखता है।
- source_word: Ἰερουσαλήμ
  choice: यरूशलेम
  rationale: स्थान-नाम का हिन्दी बाइबलीय प्रचलित रूप।
theological_decisions:
- issue: ἐλάλει περὶ αὐτοῦ में αὐτοῦ का संदर्भ
  choice: मुख्य पाठ में ‘उसके’ सर्वनाम को बनाए रखा गया; प्रसंग में इसका सबसे स्वाभाविक संकेत बालक यीशु की ओर है।
  alternative: निकटतम स्पष्ट पूर्वपद होने के कारण इसे परमेश्वर के संदर्भ में भी समझा जा सकता है।
  rationale: कथा का तत्काल केन्द्र बालक यीशु है, फिर भी यूनानी सर्वनाम स्वयं संदर्भ को स्पष्ट नाम से नहीं खोलता। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और पादटिप्पणी दोनों सम्भावनाएँ बताती है।
- issue: λύτρωσιν Ἰερουσαλήμ का अर्थ
  choice: ‘यरूशलेम का छुटकारा’ बिना किसी अतिरिक्त राजनीतिक या आत्मिक व्याख्या के रखा गया।
  alternative: ‘यरूशलेम का उद्धार’ या ‘यरूशलेम की मुक्ति’।
  rationale: यह पद परमेश्वर द्वारा अपने लोगों के लिए किए जाने वाले उद्धारकारी कार्य को सामुदायिक, मसीही और अन्तकालीन आशा सहित व्यक्त कर सकता है; अनुवाद इस अर्थ-व्याप्ति को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और जनसुलभ रूप अपनाया गया है। ‘बाट जोह रहे थे’ आशापूर्ण प्रतीक्षा का भाव देता है। मूल के सर्वनाम और ‘यरूशलेम के छुटकारे’ की अर्थगत व्यापकता को जानबूझकर सुरक्षित रखा गया है।
