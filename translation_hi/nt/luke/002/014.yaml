  text: Δόξα ἐν ὑψίστοις θεῷ καὶ ἐπὶ γῆς εἰρήνη ἐν ἀνθρώποις ⸀εὐδοκίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/014.yaml
  text: Glory to God in the highest[c][b][a], and on earth peace among people of good pleasure.
translation:
  language: hi
  text: '“सर्वोच्च स्वर्ग में परमेश्वर की महिमा हो,

    और पृथ्वी पर उन लोगों में शांति हो जिनसे वह प्रसन्न है।”[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन लोगों में जिन पर उसकी प्रसन्नता है।”
    reason: lexical_alternative
  - marker: b
    text: कुछ पांडुलिपियों में पाठ है, “और पृथ्वी पर शांति, मनुष्यों में सद्भावना।”
    reason: textual_variant
lexical_decisions:
- source_word: Δόξα
  choice: महिमा
  rationale: यहाँ शब्द परमेश्वर को महिमा अर्पित करने वाली उद्घोषणा है; ‘महिमा’ इसके उपासना-संबंधी और धर्मवैचारिक भार को बनाए रखता है।
- source_word: ἐν ὑψίστοις
  choice: सर्वोच्च स्वर्ग में
  rationale: बहुवचन रूप सर्वोच्च स्वर्गीय क्षेत्र की ओर संकेत करता है। यह हिन्दी में स्पष्ट है और पृथ्वी के साथ स्थानगत विरोध बनाए रखता है।
- source_word: θεῷ
  choice: परमेश्वर की
  rationale: यूनानी सम्प्रदान कारक यहाँ महिमा को परमेश्वर से संबद्ध करता है; हिन्दी की स्वाभाविक स्तुतिपरक अभिव्यक्ति ‘परमेश्वर की महिमा हो’ है।
- source_word: ἐπὶ γῆς
  choice: पृथ्वी पर
  rationale: यह सर्वोच्च स्वर्ग के साथ सीधा स्थानगत विरोध व्यक्त करने वाला सहज आधुनिक हिन्दी रूप है।
- source_word: εἰρήνη
  choice: शांति
  rationale: यह यूनानी शब्द के व्यापक बाइबलीय अर्थ को बिना अनावश्यक संकुचन के व्यक्त करता है।
- source_word: ἐν ἀνθρώποις
  choice: लोगों में
  rationale: ἀνθρώποις यहाँ सामान्य रूप से मानव व्यक्तियों को दर्शाता है; ‘लोगों’ आधुनिक हिन्दी में स्वाभाविक और लिंग-समावेशी है।
- source_word: εὐδοκίας
  choice: उसकी प्रसन्नता के पात्र
  rationale: सम्बन्धकारक εὐδοκίας लोगों को प्रसन्नता अथवा अनुग्रह से चिह्नित बताता है। सन्दर्भ में यह प्रसन्नता परमेश्वर की है; यह रूप उस सम्बन्ध को सहज हिन्दी में व्यक्त करता है, जबकि अधिक वाक्यात्मक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: εὐδοκίας सम्बन्धकारक का अर्थ
  choice: शांति उन लोगों में है जो परमेश्वर की प्रसन्नता के पात्र हैं।
  alternative: ‘उन लोगों में जिनसे वह प्रसन्न है’; अथवा पाठांतर के अनुसार ‘पृथ्वी पर शांति और मनुष्यों के प्रति सद्भावना।’
  rationale: SBLGNT में सम्बन्धकारक εὐδοκίας है, जो ‘लोगों’ को प्रसन्नता या अनुग्रह से सम्बद्ध करता है; इसलिए इसे उद्घोषणा की स्वतंत्र तीसरी वस्तु ‘सद्भावना’ नहीं बनाया गया। अनुवाद यह निर्धारित नहीं करता कि वे लोग किस रीति से ऐसे पात्र बनते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। काव्यात्मक समानांतरता दिखाने के लिए पद को दो पंक्तियों में रखा गया है। ‘सर्वोच्च स्वर्ग’ पारंपरिक ‘परम ऊँचाइयों’ की अपेक्षा सामान्य पाठक के लिए अधिक स्पष्ट है।
