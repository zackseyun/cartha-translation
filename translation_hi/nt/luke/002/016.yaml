  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘वहाँ पहुँचे’ प्रसंगगत गंतव्य को स्वाभाविक रूप से व्यक्त करता है, और ‘शिशु’ नवजात के लिए स्पष्ट तथा सम्मानजनक शब्द है। पादटिप्पणी का चिह्न अर्थ-संबंध के अनुसार ‘चरनी’ पर रखा गया है।
