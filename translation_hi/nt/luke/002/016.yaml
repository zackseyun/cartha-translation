  text: καὶ ἦλθαν σπεύσαντες καὶ ἀνεῦραν τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ καὶ τὸ βρέφος κείμενον ἐν τῇ φάτνῃ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/016.yaml
  text: And they came in haste and found Mary and Joseph[a], and the baby lying in the manger.
translation:
  language: hi
  text: वे जल्दी-जल्दी वहाँ पहुँचे और उन्होंने मरियम और यूसुफ को तथा चरनी[a] में लेटे हुए शिशु को पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पशुओं के चारा खाने की नाँद।’ यूनानी शब्द φάτνη का अर्थ चरनी या चारा रखने की नाँद हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦλθαν
  choice: वहाँ पहुँचे
  rationale: संदर्भ में चरवाहों की उस स्थान की ओर गति और वहाँ पहुँचने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। ‘वहाँ’ पिछले पदों में बताए गए गंतव्य को स्पष्ट रूप से ग्रहण करता है।
- source_word: σπεύσαντες
  choice: जल्दी-जल्दी
  rationale: यह सहभागी क्रिया मुख्य क्रिया के ढंग को बताती है और चरवाहों की तत्परता को सहज आधुनिक हिन्दी में व्यक्त करती है।
- source_word: ἀνεῦραν
  choice: पाया
  rationale: क्रिया खोजने के बाद मिल जाने का भाव रखती है; संदर्भ में ‘पाया’ स्वाभाविक है और सफल खोज का भाव पर्याप्त रूप से संप्रेषित करता है।
- source_word: τήν τε Μαριὰμ καὶ τὸν Ἰωσὴφ
  choice: मरियम और यूसुफ को
  rationale: व्यक्तिनामों के प्रचलित हिन्दी रूप रखे गए हैं; τε और καί के समन्वय को स्वाभाविक हिन्दी संयोजन से व्यक्त किया गया है।
- source_word: τὸ βρέφος
  choice: शिशु
  rationale: βρέφος यहाँ नवजात या बहुत छोटे बच्चे को दर्शाता है। ‘शिशु’ स्पष्ट, प्रतिष्ठित और जन्म-वृत्तांत के अनुकूल है।
- source_word: κείμενον
  choice: लेटे हुए
  rationale: κεῖμαι शिशु की अवस्था और स्थिति बताता है, उसे वहाँ लिटाने की क्रिया नहीं; इसलिए ‘लेटे हुए’ उस स्थिर अवस्था को सुरक्षित रखता है।
- source_word: ἐν τῇ φάτνῃ
  choice: चरनी में
  rationale: φάτνη पशुओं के चारा खाने की नाँद या चरनी को दर्शा सकता है। ‘चरनी’ हिन्दी बाइबलीय प्रयोग में परिचित और संदर्भानुकूल है; अधिक स्पष्ट शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: καὶ ... καὶ ... καὶ
  choice: और ... तथा
  rationale: यूनानी के सरल योगात्मक क्रम को बनाए रखते हुए हिन्दी में अत्यधिक दोहराव से बचने के लिए स्वाभाविक समन्वय अपनाया गया है।
