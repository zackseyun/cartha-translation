  text: Καὶ ἐγένετο ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν οἱ ἄγγελοι, ⸀οἱ ποιμένες ⸀ἐλάλουν πρὸς ἀλλήλους· Διέλθωμεν δὴ ἕως Βηθλέεμ καὶ ἴδωμεν τὸ ῥῆμα τοῦτο τὸ γεγονὸς ὃ ὁ κύριος ἐγνώρισεν ἡμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/015.yaml
  text: And it happened that when the angels had gone away from them into heaven[a], the shepherds said to one another, “Let us go now to Bethlehem and see this thing that has happened[b], which the Lord has made known to us.”
translation:
  language: hi
  text: जब स्वर्गदूत उनके पास से स्वर्ग को चले गए, तो चरवाहे आपस में कहने लगे, “आओ, अब हम बैतलहम तक चलें और यह बात जो घटित हुई है[a], उसे देखें, जिसे प्रभु ने हमें ज्ञात कराया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह घटना जो घटी है”; यूनानी ῥῆμα का अर्थ “वचन,” “बात” या “विषय” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: मुख्य वाक्य में अलग से अनूदित नहीं
  rationale: लूका का यह कथात्मक सूत्र हिन्दी में ‘जब... तो...’ की स्वाभाविक संरचना से व्यक्त हो जाता है; ‘और ऐसा हुआ कि’ जोड़ने पर शैली अनावश्यक रूप से बोझिल होती।
- source_word: ὡς ἀπῆλθον ἀπ’ αὐτῶν εἰς τὸν οὐρανὸν
  choice: जब ... उनके पास से स्वर्ग को चले गए
  rationale: ὡς का कालवाचक अर्थ ‘जब’ से और गमन की दिशा εἰς का अर्थ ‘स्वर्ग को’ से व्यक्त किया गया है।
- source_word: οἱ ἄγγελοι
  choice: स्वर्गदूत
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रचलित समतुल्य।
- source_word: οἱ ποιμένες ἐλάλουν πρὸς ἀλλήλους
  choice: चरवाहे आपस में कहने लगे
  rationale: प्रत्यक्ष कथन की भूमिका में स्वाभाविक हिन्दी; अपूर्णकाल की प्रवाहात्मकता ‘कहने लगे’ से हल्के रूप में बनी रहती है।
- source_word: Διέλθωμεν δὴ ἕως Βηθλέεμ
  choice: आओ, अब हम बैतलहम तक चलें
  rationale: hortatory subjunctive को सामूहिक आग्रह ‘आओ... चलें’ से, δὴ को ‘अब’ से, और ἕως को अधिक औपचारिक ‘तक’ से व्यक्त किया गया है।
- source_word: ἴδωμεν
  choice: उसे देखें
  rationale: पहले आए ‘यह बात’ की ओर संकेत करते हुए समन्वित आग्रह को स्वाभाविक हिन्दी में रखा गया है।
- source_word: τὸ ῥῆμα τοῦτο τὸ γεγονός
  choice: यह बात जो घटित हुई है
  rationale: ῥῆμα यहाँ कही गई सूचना और घटित विषय—दोनों की छाया रख सकता है। ‘बात’ इस बहुअर्थता को ‘घटना’ की तुलना में बेहतर बचाती है; τὸ γεγονός को ‘जो घटित हुई है’ से व्यक्त किया गया है।
- source_word: ὃ ὁ κύριος ἐγνώρισεν ἡμῖν
  choice: जिसे प्रभु ने हम पर प्रकट किया है
  rationale: γνωρίζω का अर्थ यहाँ जान करा देना है। ‘हम पर प्रकट किया’ वर्तमान हिन्दी में समझने योग्य है और केवल ‘बताया’ की अपेक्षा दैवी जानकारी दिए जाने की छाया बनाए रखता है।
theological_decisions:
- issue: ὁ κύριος का अभिप्राय
  choice: प्रभु
  alternative: परमेश्वर; या नवजात प्रभु मसीह की ओर अप्रत्यक्ष संकेत
  rationale: निकट संदर्भ में सूचना का स्रोत परमेश्वर है, पर मूल पाठ केवल κύριος कहता है। ‘प्रभु’ उस संदर्भ और लूका के व्यापक धार्मिक अनुनाद—दोनों को बिना संकुचित किए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बैतलहम तक’ मूल ἕως की सीमा/गंतव्य की अभिव्यक्ति को बनाए रखता है; अधिक बोलचाल का विकल्प ‘बैतलहम चलें’ है।
