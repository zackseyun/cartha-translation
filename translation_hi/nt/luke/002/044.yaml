  text: But supposing him to be in the traveling group[a], they went a day's journey[b], and they began searching for him among their relatives and acquaintances.
translation:
  language: hi
  text: पर वे यह मानकर कि वह यात्रियों के दल में है,[a] उन्होंने एक दिन की यात्रा की और उसे अपने रिश्तेदारों और परिचितों के बीच ढूँढ़ने लगे।[b]
  philosophy: optimal-equivalence
  footnotes:
