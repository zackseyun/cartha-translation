    text: या “काफ़िले में”; यूनानी शब्द का अर्थ साथ यात्रा करने वाले लोगों का समूह है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “वे उसे ढूँढ़ते रहे” भी हो सकता है; यूनानी क्रिया खोज के जारी रहने पर बल दे सकती है।
    reason: lexical_alternative
