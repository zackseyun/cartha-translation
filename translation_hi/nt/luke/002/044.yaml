- source_word: συγγενεῦσιν
  choice: रिश्तेदारों
  rationale: यह पारिवारिक संबंधियों के व्यापक समूह के लिए स्वाभाविक और समावेशी आधुनिक हिन्दी शब्द है।
- source_word: γνωστοῖς
  choice: परिचितों
  rationale: यह केवल घनिष्ठ मित्रों तक सीमित न होकर जाने-पहचाने लोगों के व्यापक अर्थ को सुरक्षित रखता है।
