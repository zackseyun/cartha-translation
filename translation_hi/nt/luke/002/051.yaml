id: LUK.2.51
reference: Luke 2:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κατέβη μετ’ αὐτῶν καὶ ἦλθεν εἰς Ναζαρέθ, καὶ ἦν ὑποτασσόμενος αὐτοῖς. καὶ ἡ μήτηρ αὐτοῦ διετήρει πάντα τὰ ῥήματα ⸀ταῦτα ἐν τῇ καρδίᾳ αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/051.yaml
  text: And he went down with them and came to Nazareth[a], and he was subject to them[b]. And his mother kept all these things in her heart.
translation:
  language: hi
  text: फिर वह उनके साथ नीचे उतरकर नासरत आया और उनके अधीन रहता था।[a] उसकी माता ने ये सारी बातें[b] अपने हृदय में सँभालकर रखीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह लगातार उनके अधीन रहकर उनकी आज्ञा मानता था।
    reason: aspectual_clarification
  - marker: b
    text: या “ये सारे वचन” अथवा “ये सारी कही हुई बातें।” यूनानी शब्द बोले गए शब्दों, कथनों या उनसे संबंधित बातों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέβη μετ’ αὐτῶν
  choice: वह उनके साथ नीचे उतरकर
  rationale: ‘नीचे उतरकर’ यरूशलेम से नासरत की भौगोलिक यात्रा का भाव बनाए रखता है; ‘उनके साथ’ सामान्य सहयात्रा को सीधे व्यक्त करता है।
- source_word: ἦλθεν εἰς Ναζαρέθ
  choice: नासरत आया
  rationale: ἔρχομαι संदर्भ के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ ‘नासरत आया’ हिन्दी कथन में स्वाभाविक है और गंतव्य स्पष्ट रखता है।
- source_word: ἦν ὑποτασσόμενος αὐτοῖς
  choice: उनके अधीन रहता था
  rationale: परिप्रयुक्त अपूर्णकाल निरंतर अवस्था और आचरण दर्शाता है। ‘अधीन रहता था’ स्वाभाविक हिन्दी में यीशु की लगातार आज्ञाकारिता और अधीनता दोनों व्यक्त करता है।
- source_word: διετήρει
  choice: सँभालकर रखीं
  rationale: διατηρέω सावधानी से सुरक्षित रखने और मन में बनाए रखने का भाव देता है। ‘सँभालकर रखीं’ साधारण ‘रखीं’ से इस सूक्ष्मता को अधिक स्वाभाविक ढंग से प्रकट करता है।
- source_word: πάντα τὰ ῥήματα ταῦτα
  choice: ये सारी बातें
  rationale: ῥήματα का अर्थ शब्द, कथन या कही/घटी बातें हो सकता है। इस प्रसंग में ‘बातें’ हिन्दी में स्वाभाविक है और अर्थ को केवल शब्दों तक सीमित नहीं करता।
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: अपने हृदय में
  rationale: यह भीतर स्मरण और मनन करने का बाइबलीय रूपक है; हिन्दी में ‘अपने हृदय में’ इसे बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
theological_decisions:
- issue: अपने सांसारिक माता-पिता के प्रति यीशु का संबंध
  choice: उनके अधीन रहता था
  alternative: उनकी आज्ञा मानता रहता था
  rationale: यूनानी पाठ मरियम और यूसुफ के प्रति यीशु की निरंतर अधीनता को स्पष्ट करता है। चुना हुआ पाठ इस कथन को बनाए रखता है, पर उसके ईश्वरीय स्वरूप के विषय में कोई अतिरिक्त व्याख्या जोड़कर पाठ के धर्मवैज्ञानिक तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अधीन रहता था’ में निरंतरता है, जबकि ‘अपने हृदय में सँभालकर रखीं’ स्मरण और मनन के भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
