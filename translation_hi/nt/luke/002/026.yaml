  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἦν αὐτῷ κεχρηματισμένον ὑπὸ τοῦ πνεύματος τοῦ ἁγίου μὴ ἰδεῖν θάνατον πρὶν ⸂ἢ ἂν⸃ ἴδῃ τὸν χριστὸν κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/026.yaml
  text: And it had been revealed to him by the Holy Spirit that he would not see death before he had seen the Lord’s Messiah[a].
translation:
  language: hi
  text: और पवित्र आत्मा ने उसे यह प्रकट किया था कि वह प्रभु के मसीह[a] को देख लेने से पहले मृत्यु नहीं देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक पारंपरिक रूप में, “प्रभु का ख्रीस्त।”
    reason: ‘प्रभु के मसीह’ के लिए पारंपरिक वैकल्पिक अनुवाद; यह अंग्रेज़ी POB audit trail के “the Lord’s Christ” के अनुरूप है।
lexical_decisions:
- source_word: κεχρηματισμένον
  choice: उस पर प्रकट किया था
  rationale: निष्क्रिय रूप यहाँ परमेश्वर की ओर से प्राप्त प्रकाशन को व्यक्त करता है। ‘उस पर प्रकट किया था’ आधुनिक हिन्दी में स्वाभाविक है और साथ आए कर्ता ‘पवित्र आत्मा’ के साथ स्पष्ट बैठता है।
- source_word: ὑπὸ τοῦ πνεύματος τοῦ ἁγίου
  choice: पवित्र आत्मा ने
  rationale: ὑπό के साथ संबंधकारक व्यक्तिगत कर्तृत्व दर्शाता है। हिन्दी में सक्रिय रचना अधिक स्वाभाविक है और पवित्र आत्मा के व्यक्तिगत कर्तृत्व को बनाए रखती है।
- source_word: μὴ ἰδεῖν θάνατον
  choice: मृत्यु नहीं देखेगा
  rationale: मूल का शब्दचित्र अक्षुण्ण रखा गया है; हिन्दी में ‘मृत्यु देखना’ समझ में आने वाला और गरिमापूर्ण मुहावरा है।
- source_word: πρὶν ἢ ἂν ἴδῃ
  choice: देख लेने से पहले
  rationale: यह भावी घटना के पहले न मरने की समय-सीमा बताता है। ‘देख लेने से पहले’ अपेक्षित घटना के पूरा होने को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸν χριστὸν κυρίου
  choice: प्रभु के मसीह
  rationale: Χριστός यहाँ उपाधि है, इसलिए ‘मसीह’ चुना गया। संबंधकारक κυρίου को ‘प्रभु के’ के रूप में रखा गया है, जो प्रभु से संबद्ध अथवा प्रभु द्वारा भेजे अभिषिक्त जन का भाव देता है।
- source_word: κυρίου
  choice: प्रभु के
  rationale: κύριος का मानक और गरिमापूर्ण हिन्दी रूप ‘प्रभु’ है; संबंधकारक रचना मूल के संबंध को बिना अनावश्यक व्याख्या के सुरक्षित रखती है।
theological_decisions:
- issue: उपाधि के रूप में Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त; प्रभु का अभिषिक्त जन
  rationale: यहाँ Χριστός नाम-सदृश प्रयोग नहीं, बल्कि मसीही उपाधि है। ‘मसीह’ हिन्दी बाइबलीय प्रयोग में परिचित है और यहूदी मसीही संदर्भ बनाए रखता है। ‘अभिषिक्त जन’ अर्थ स्पष्ट करता है, इसलिए पादटिप्पणी में दिया गया है।
- issue: τὸν χριστὸν κυρίου में संबंधकारक का अर्थ
  choice: प्रभु के मसीह
  alternative: प्रभु द्वारा भेजे गए मसीह
  rationale: मूल संबंधकारक स्वामित्व, संबंध या स्रोत की कुछ खुली गुंजाइश रखता है। मुख्य पाठ में संक्षिप्त संबंधकारक रचना रखकर उस अस्पष्टता को व्याख्यात्मक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। मूल के ‘मृत्यु देखना’ शब्दचित्र और ‘प्रभु के मसीह’ संबंधकारक रचना को सुरक्षित रखा गया है।
