  text: And he came in the Spirit into the temple[a]; and when the parents brought in the child Jesus to do for him according to the custom of the law[b],
translation:
  language: hi
  text: और वह पवित्र आत्मा की प्रेरणा से मंदिर में आया[a]। और जब माता-पिता बालक यीशु को भीतर लाए, ताकि वे उसके लिए व्यवस्था की प्रचलित रीति पूरी करें[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आत्मा में।” यूनानी पदबंध का अनुवाद “पवित्र आत्मा के द्वारा” भी किया जा सकता है। इस प्रसंग में लूका पवित्र आत्मा का बार-बार उल्लेख करता है।
    reason: lexical_alternative
