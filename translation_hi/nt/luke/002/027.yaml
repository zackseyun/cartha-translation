- source_word: κατὰ τὸ εἰθισμένον τοῦ νόμου
  choice: व्यवस्था की रीति के अनुसार
  rationale: εἰθισμένον प्रचलित या निर्धारित रीति का बोध देता है; यह पदबंध मूसा की व्यवस्था से सम्बद्ध प्रथा को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शिमोन के आने में ‘आत्मा’ का सन्दर्भ
  choice: ‘आत्मा’ को पवित्र आत्मा के रूप में समझना, पर ‘आत्मा में होकर’ द्वारा यूनानी रचना बनाए रखना
  alternative: ‘आत्मा की प्रेरणा से’ या शिमोन की अपनी आत्मिक दशा
  rationale: लूका 2:25–27 में पवित्र आत्मा का बार-बार उल्लेख इसी अर्थ का प्रबल समर्थन करता है; फिर भी मुख्य पाठ ‘में’ और पादटिप्पणी साधनात्मक सम्भावना को सुरक्षित रखते हैं।
- issue: मरियम और यूसुफ के लिए γονεῖς
  choice: सीधे ‘माता-पिता’ अनुवाद करना
  alternative: ‘अभिभावक’ अथवा ‘यूसुफ और मरियम’
  rationale: लूका यहाँ सामान्य पारिवारिक भाषा प्रयोग करता है। इसे बदलना यूनानी को अनावश्यक रूप से कमजोर या विस्तृत करेगा; यह यीशु के कुँवारी से जन्म के विषय में अलग कथनों का निषेध नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘व्यवस्था’ मूसा की व्यवस्था के लिए स्थापित बाइबिलीय शब्द है। ‘करें’ जानबूझकर सामान्य रखा गया है क्योंकि इस पद में अनुष्ठान का विशिष्ट कार्य नहीं बताया गया।
