- source_word: γονεῖς
  choice: माता-पिता
  rationale: यह यूनानी शब्द का सीधा, सामान्य पारिवारिक अर्थ है और मरियम तथा यूसुफ की कथात्मक-सामाजिक भूमिका व्यक्त करता है।
- source_word: παιδίον Ἰησοῦν
  choice: बालक यीशु
