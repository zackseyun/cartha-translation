- source_word: κατὰ τὸ ἔθος
  choice: रीति के अनुसार
  rationale: यह वाक्यांश स्थापित प्रथा के अनुरूप कार्य करने का भाव देता है। ‘रीति के अनुसार’ आधुनिक हिन्दी में स्पष्ट, संक्षिप्त और मूल के निकट है।
- source_word: τῆς ἑορτῆς
  choice: पर्व की
  rationale: ἑορτή धार्मिक पर्व या उत्सव को दर्शाता है। तत्काल पूर्वप्रसंग में यह फसह है; ‘पर्व’ हिन्दी बाइबलीय संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: καὶ ὅτε
  choice: और जब
  rationale: καί कथा को आगे बढ़ाता है और ὅτε समयसूचक उपवाक्य आरम्भ करता है। ‘और जब’ दोनों कार्यों को बनाए रखता है।
