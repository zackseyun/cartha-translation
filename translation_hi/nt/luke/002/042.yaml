- source_word: ἀναβαινόντων
  choice: ऊपर जा रहे थे
  rationale: ἀναβαίνω का मूल अर्थ ‘ऊपर जाना’ है और यरूशलेम की यात्रा के लिए यह प्रचलित क्रिया है। वर्तमान कृदन्त की समकालिक और जारी क्रिया को ‘जा रहे थे’ बनाए रखता है; ‘यरूशलेम’ पिछले पद से समझ में आता है, इसलिए यहाँ जोड़ा नहीं गया।
- source_word: αὐτῶν
  choice: वे
