  text: अपनी मंगेतर, गर्भवती मरियम के साथ नाम लिखवाने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπογράψασθαι
  choice: नाम लिखवाने के लिए
  rationale: जनगणना के प्रशासनिक संदर्भ में यह स्वाभाविक आधुनिक हिन्दी है। मध्यमवाच्य रूप यहाँ अपना पंजीकरण कराने का भाव देता है।
- source_word: σὺν Μαριὰμ
  choice: मरियम के साथ
  rationale: σύν साथ होने का सामान्य अर्थ व्यक्त करता है; Μαριάμ को प्रचलित हिन्दी रूप ‘मरियम’ में रखा गया है।
- source_word: ἐμνηστευμένῃ αὐτῷ
  choice: जिसकी मंगनी उससे हुई थी
  rationale: यह अनुवाद मरियम और यूसुफ के औपचारिक विवाह-वचन के संबंध को व्यक्त करता है और उसे आधुनिक अर्थ में केवल अनौपचारिक सगाई या पूर्ण विवाह नहीं बना देता।
- source_word: οὔσῃ ἐγκύῳ
  choice: जो गर्भवती थी
  rationale: यह मरियम की उस समय की अवस्था को स्पष्ट, स्वाभाविक और वर्तमान हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यूसुफ के संबंध में मरियम की वैवाहिक स्थिति
  choice: जिसकी मंगनी उससे हुई थी
  alternative: उसकी पत्नी / जिसकी सगाई उससे हुई थी
  rationale: यूनानी μνηστεύομαι औपचारिक और सामाजिक-कानूनी रूप से बंधनकारी विवाह-वचन बताता है, पर यह वाक्य पूर्ण विवाह को स्पष्ट रूप से नहीं कहता। ‘मंगनी’ इस तनाव को अपेक्षाकृत अच्छी तरह बनाए रखती है; पादटिप्पणी इसके प्राचीन संदर्भ की शक्ति स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। पद मूल यूनानी वाक्य की तरह पिछले पद से व्याकरणिक रूप से जुड़ा हुआ है, इसलिए आरंभ में निहित कर्ता या ‘गया’ नहीं जोड़ा गया।
