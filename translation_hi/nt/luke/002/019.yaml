base_translation:
  language: en
  yaml_path: translation/nt/luke/002/019.yaml
  text: But Mary was treasuring up all these words[b][a], pondering them in her heart.
translation:
  language: hi
  text: पर मरियम इन सब बातों को सँजोए रखती और अपने मन में उन पर विचार करती थी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन सब बातों को सावधानी से सुरक्षित रखती थी।”
    reason: lexical_alternative
  - marker: b
    text: “विचार करती” का भाव इन बातों को आपस में मिलाकर तौलने या एक साथ समझने का प्रयास करने का भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले पद में लोगों की प्रकट प्रतिक्रिया और मरियम की भीतरी प्रतिक्रिया के बीच हल्का विरोध या कथात्मक मोड़ दिखाता है।
- source_word: Μαρία
  choice: मरियम
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: πάντα ... τὰ ῥήματα ταῦτα
  choice: इन सब बातों को
  rationale: ῥήματα का अर्थ यहाँ कही गई बातें, वचन या उनसे संबंधित घटनाएँ हो सकता है। संदर्भ में 'बातों' स्वाभाविक है और मूल की अर्थ-व्याप्ति बनाए रखता है।
- source_word: συνετήρει
  choice: सँजोए रखती
  rationale: अपूर्ण भूतकाल निरंतर क्रिया का भाव देता है और क्रिया सावधानी से सुरक्षित रखने को व्यक्त करती है; 'सँजोए रखती' स्मरण मात्र से अधिक आत्मीय संरक्षण दर्शाता है।
- source_word: συμβάλλουσα
  choice: उन पर विचार करती रही
  rationale: यह विभिन्न बातों को मन में साथ रखकर मिलाने, तौलने और समझने का प्रयास सूचित करता है। 'विचार करती रही' स्वाभाविक हिन्दी में चिंतन का भाव देता है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐν τῇ καρδίᾳ αὐτῆς
  choice: अपने मन में
  rationale: यूनानी 'हृदय' भीतरी सोच और चिंतन का केंद्र है। आधुनिक हिन्दी में 'मन में' यही अर्थ स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: मरियम की प्रतिक्रिया का स्वरूप
  choice: वह बातों को भीतर सँजोकर उन पर लगातार विचार करती रही।
  alternative: उसने केवल घटनाएँ याद रखीं, या वह उसी समय उनका पूरा अर्थ समझ गई।
  rationale: मूल पाठ सावधानी से सुरक्षित रखने और मन में बातों को मिलाकर विचार करने को बताता है, पर पूर्ण समझ का दावा नहीं करता। अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। 'मन में' सामान्य पाठक के लिए स्वाभाविक है, जबकि मूल के हृदय-संबंधी मुहावरे का आंतरिक चिंतन वाला आशय सुरक्षित रहता है।
