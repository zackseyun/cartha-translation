lexical_decisions:
- source_word: ὃ
  choice: जिसे
  rationale: नपुंसकलिंग एकवचन संबंधवाचक सर्वनाम पिछले पद के ‘उद्धार’ की ओर संकेत करता है; हिन्दी में कर्म के रूप में ‘जिसे’ स्वाभाविक है।
- source_word: ἡτοίμασας
  choice: तूने तैयार किया है
  rationale: यह परमेश्वर को संबोधित द्वितीय पुरुष एकवचन क्रिया है। पूर्ण वर्तमान हिन्दी में उस पूरी की गई तैयारी और उसके वर्तमान परिणाम, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατὰ πρόσωπον
  choice: के सामने
  rationale: यूनानी मुहावरा किसी वस्तु को सबकी दृष्टि या उपस्थिति में खुले रूप से रखे जाने का भाव देता है; ‘के सामने’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: πάντων
  choice: सब
  rationale: यह λαῶν को विशेषित करता हुआ सार्वभौमिक विस्तार व्यक्त करता है।
- source_word: τῶν λαῶν
  choice: जातियों
  rationale: बहुवचन λαῶν अलग-अलग जनसमुदायों को दर्शाता है। ‘जातियाँ’ आधुनिक बाइबलीय हिन्दी में बहु-जनसमूह का अर्थ रखता है, यद्यपि सामान्य हिन्दी में इसके अन्य सामाजिक अर्थ भी हो सकते हैं; इसलिए विकल्प को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: अगले पद के संदर्भ में λαῶν का दायरा
  choice: सब जातियों
  alternative: सब जनसमुदायों; सब लोगों
  rationale: बहुवचन को बनाए रखने से अनेक समुदायों का सामूहिक दायरा सुरक्षित रहता है और पद 32 में अन्यजातियों तथा इस्राएल के स्पष्ट उल्लेख को समय से पहले इस पद में नहीं डाला जाता।
