  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। परमेश्वर के प्रति प्रार्थनात्मक संबोधन में निकटता बनाए रखने के लिए ‘तू’ रखा गया है। मुख्य पाठ में बहुवचन जनसमूह सुरक्षित है और यूनानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है।
