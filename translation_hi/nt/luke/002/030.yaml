  text: ὅτι εἶδον οἱ ὀφθαλμοί μου τὸ σωτήριόν σου
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/030.yaml
  text: because my eyes have seen your salvation[a]
translation:
  language: hi
  text: क्योंकि मेरी आँखों ने आपके उद्धार को देख लिया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आपके उद्धारकर्ता को।’ यूनानी पाठ में ‘आपके उद्धार’ है, पर इस प्रसंग में परमेश्वर का उद्धार यीशु के व्यक्तित्व में उपस्थित है।
    reason: alternative_reading
lexical_decisions:
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह शिमोन के पिछले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ कारण-संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: εἶδον
  choice: देख लिया है
  rationale: यूनानी एओरिस्ट पूर्ण हुई घटना को बताता है, जिसका वर्तमान परिणाम यहाँ महत्त्वपूर्ण है। ‘देख लिया है’ शिशु को अभी देख लेने और उससे उत्पन्न वर्तमान निश्चय—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ ὀφθαλμοί μου
  choice: मेरी आँखों ने
  rationale: मूल पाठ में ‘मेरी आँखें’ स्पष्ट और सजीव शारीरिक अभिव्यक्ति है; इसे केवल ‘मैंने’ कर देना अनावश्यक रूप से उस बल को घटा देगा।
- source_word: τὸ σωτήριόν σου
  choice: आपके उद्धार को
  rationale: σωτήριον यहाँ सीधे ‘उद्धारकर्ता’ का व्यक्तिगत पद नहीं, बल्कि ‘उद्धार’ या उद्धार के साधन को सूचित करता है। ‘आपके उद्धार’ से मूल शब्दावली और यह संदर्भगत गहराई दोनों बनी रहती हैं कि परमेश्वर का उद्धार यीशु में सामने उपस्थित है।
theological_decisions:
- issue: क्या τὸ σωτήριόν σου को अमूर्त ‘आपका उद्धार’ कहा जाए या उपस्थित शिशु के कारण व्यक्तिगत ‘आपके उद्धारकर्ता’ के रूप में अनूदित किया जाए
  choice: आपके उद्धार को
  alternative: आपके उद्धारकर्ता को
  rationale: यूनानी में सामान्य व्यक्तिगत संज्ञा σωτήρ (‘उद्धारकर्ता’) नहीं, बल्कि σωτήριον है, जो अधिक स्वाभाविक रूप से उद्धार या उद्धार के साधन को दर्शाता है। चुना हुआ अनुवाद लूका की शब्दावली को बनाए रखते हुए पाठक को यह समझने देता है कि यह उद्धार यीशु के व्यक्तित्व में उपस्थित है, पर उस संदर्भगत अर्थ को मूल शब्द के स्थान पर नहीं रखता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य। परमेश्वर को संबोधन होने के कारण आदरसूचक ‘आपके’ रखा गया है। ‘मेरी आँखों ने’ मूल की सजीव अभिव्यक्ति को सुरक्षित रखता है।
