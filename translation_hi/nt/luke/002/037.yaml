source:
  edition: SBLGNT
  text: καὶ αὐτὴ χήρα ⸀ἕως ἐτῶν ὀγδοήκοντα τεσσάρων,) ἣ οὐκ ⸀ἀφίστατο τοῦ ἱεροῦ νηστείαις καὶ δεήσεσιν λατρεύουσα νύκτα καὶ ἡμέραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/037.yaml
  text: and then as a widow until she was eighty-four years old[a]. She did not depart from the temple[c][b], worshiping with fastings and prayers night and day.
translation:
  language: hi
  text: और वह चौरासी वर्ष की आयु तक विधवा रही[a]। वह मन्दिर को नहीं छोड़ती थी[b], और उपवासों तथा प्रार्थनाओं[c] के साथ रात-दिन उपासना करती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह चौरासी वर्ष तक विधवा रही।” यूनानी वाक्यांश अन्ना की आयु या उसके विधवापन की अवधि—दोनों में से किसी को बता सकता है।
    reason: alternative_reading
  - marker: b
    text: यहाँ यूनानी शब्द पूरे मन्दिर-परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
  - marker: c
    text: या, “विनतियों” अथवा “याचनाओं”।
    reason: lexical_alternative
lexical_decisions:
- source_word: χήρα
  choice: विधवा
  rationale: यह उस स्त्री के लिए स्वाभाविक और मानक हिन्दी शब्द है जिसके पति की मृत्यु हो चुकी हो। यहाँ यह अन्ना की वैवाहिक स्थिति का वर्णन जारी रखता है।
- source_word: ἕως ἐτῶν ὀγδοήκοντα τεσσάρων
  choice: चौरासी वर्ष की आयु तक
  rationale: संक्षिप्त यूनानी पदबंध को मुख्य पाठ में अन्ना की आयु के रूप में लिया गया है। यूनानी में यह उसकी विधवा-अवस्था की अवधि भी बता सकता है, इसलिए उस अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: ἀφίστατο τοῦ ἱεροῦ
  choice: मन्दिर से कभी दूर नहीं रहती थी
  rationale: अपूर्ण भूतकाल का रूप उसकी नियमित और निरन्तर रीति को दर्शाता है। यह हिन्दी अभिव्यक्ति स्वाभाविक है और अनिवार्य रूप से यह संकेत नहीं देती कि वह सचमुच मन्दिर के भीतर निवास करती थी।
- source_word: ἱεροῦ
  choice: मन्दिर
  rationale: ἱερόν पूरे मन्दिर-परिसर को सूचित करता है, केवल भीतरी पवित्रस्थान को नहीं। मुख्य पाठ में सहज 'मन्दिर' रखा गया है और सटीक भेद पादटिप्पणी में बताया गया है।
- source_word: νηστείαις
  choice: उपवासों
  rationale: बहुवचन मूल पाठ में बार-बार किए जाने वाले उपवासों की प्रथा को व्यक्त करता है; हिन्दी बहुवचन इसे बनाए रखता है।
- source_word: δεήσεσιν
  choice: प्रार्थनाओं
  rationale: सन्दर्भ में यह सहज और स्पष्ट हिन्दी है। यूनानी शब्द में विनती या याचना का विशेष भाव हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- source_word: λατρεύουσα
  choice: उपासना करती थी
  rationale: यह कृदन्त परमेश्वर के प्रति उसकी भक्तिपूर्ण धार्मिक सेवा बताता है। 'उपासना' आधुनिक हिन्दी में इस धार्मिक अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करती है।
- source_word: νύκτα καὶ ἡμέραν
  choice: रात-दिन
  rationale: यह निरन्तर भक्ति को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है और यूनानी शब्दक्रम भी बनाए रखता है।
theological_decisions:
- issue: अन्ना की आयु अथवा उसके विधवापन की अवधि
  choice: 'मुख्य पाठ में पदबंध को अन्ना की आयु बताते हुए समझा गया है: वह चौरासी वर्ष की आयु तक विधवा रही।'
  alternative: यह भी अर्थ सम्भव है कि वह चौरासी वर्ष तक विधवा रही थी।
  rationale: यूनानी वाक्यरचना दोनों अर्थों की अनुमति देती है। यह सिद्धान्तगत निर्णय नहीं, बल्कि वास्तविक पाठगत अस्पष्टता है; इसलिए वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। 'मन्दिर' सामान्य पाठक के लिए सहज है, जबकि उसके व्यापक परिसर का अर्थ पादटिप्पणी में स्पष्ट किया गया है। 'कभी दूर नहीं रहती थी' निरन्तर प्रथा को स्वाभाविक रूप से व्यक्त करता है और उसे अनिवार्य रूप से मन्दिर में निवास करने के अर्थ तक सीमित नहीं करता।
