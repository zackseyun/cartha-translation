source:
  edition: SBLGNT
  text: ἰδόντες δὲ ⸀ἐγνώρισαν περὶ τοῦ ῥήματος τοῦ λαληθέντος αὐτοῖς περὶ τοῦ παιδίου τούτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/017.yaml
  text: And when they saw it[a], they made known the message that had been spoken to them about this child.
translation:
  language: hi
  text: जब उन्होंने उसे देखा, तो उन्होंने वह बात[a] बता दी जो इस बालक के विषय में उनसे कही गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वचन” अथवा “संदेश।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδόντες
  choice: जब उन्होंने उसे देखा
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई घटना को समयसूचक रूप में व्यक्त करता है। यूनानी में कर्म निहित है; हिन्दी में स्वाभाविकता के लिए संदर्भानुसार ‘उसे’ रखा गया है, जो बालक की ओर संकेत करता है।
- source_word: δὲ
  choice: तो
  rationale: यहाँ δέ कथा को आगे बढ़ाने वाला हल्का संयोजक है, न कि प्रबल विरोधसूचक। ‘जब…तो’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से जोड़ता है।
- source_word: ἐγνώρισαν
  choice: बता दी
  rationale: γνωρίζω का अर्थ किसी बात को ज्ञात कराना या प्रकट करना है। ‘बता दी’ आधुनिक हिन्दी में सहज है और औपचारिक प्रचार का अतिरिक्त भाव नहीं जोड़ता।
- source_word: περὶ τοῦ ῥήματος
  choice: वह बात
  rationale: ῥῆμα यहाँ बोले गए कथन या संदेश की विषयवस्तु को दर्शाता है। ‘वह बात’ स्पष्ट और स्वाभाविक है; ‘वचन’ और ‘संदेश’ भी संभव हैं, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: τοῦ λαληθέντος αὐτοῖς
  choice: जो … उनसे कही गई थी
  rationale: यह पदबंध ῥήματος का विशेषण है। निष्क्रिय वाच्य और पहले कही जा चुकी बात—दोनों को हिन्दी में सुरक्षित रखा गया है।
- source_word: περὶ τοῦ παιδίου τούτου
  choice: इस बालक के विषय में
  rationale: παιδίον छोटे बालक को सूचित करता है और यहाँ नवजात यीशु का उल्लेख है। ‘इस बालक’ सटीक तथा गरिमापूर्ण आधुनिक हिन्दी है।
theological_decisions:
- issue: स्वर्गदूत द्वारा कही गई घोषणा के संबंध में ῥῆμα का अनुवाद
  choice: वह बात
  alternative: वचन; संदेश; कही हुई बात
  rationale: संदर्भ में यह बालक के विषय में चरवाहों से कही गई घोषणा की विषयवस्तु है। ‘वह बात’ अर्थ को स्पष्ट रखती है और ῥῆμα में निहित ‘वचन/कथन/संदेश’ की व्यापकता को पादटिप्पणी द्वारा सुरक्षित रखती है।
- issue: ἰδόντες के निहित कर्म की पहचान
  choice: उसे
  alternative: कर्म को अव्यक्त रखते हुए ‘देखने के बाद’
  rationale: यूनानी पाठ कर्म को व्यक्त नहीं करता, पर निकट संदर्भ बालक की ओर संकेत करता है। हिन्दी में ‘उसे’ स्वाभाविक है और ‘इस बालक’ की पुनरावृत्ति से बचता है, जबकि किसी अतिरिक्त दृश्य या चिह्न को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, कथात्मक और गरिमापूर्ण शैली। ‘विषय में’ बाइबलीय कथन की गंभीरता बनाए रखता है, जबकि ‘बता दी’ वाक्य को सामान्य पाठक के लिए सहज बनाता है।
