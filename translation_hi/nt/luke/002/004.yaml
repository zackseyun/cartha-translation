  text: Ἀνέβη δὲ καὶ Ἰωσὴφ ἀπὸ τῆς Γαλιλαίας ἐκ πόλεως Ναζαρὲθ εἰς τὴν Ἰουδαίαν εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ, διὰ τὸ εἶναι αὐτὸν ἐξ οἴκου καὶ πατριᾶς Δαυίδ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/002/004.yaml
  text: And Joseph also went up from Galilee[a], from the town of Nazareth, to Judea, to the city of David which is called Bethlehem, because he was from the house and family line of David,
translation:
  language: hi
  text: और यूसुफ भी गलील के नासरत नगर से यहूदिया में दाऊद के उस नगर को, जो बेतलेहेम कहलाता है, चढ़कर गया, क्योंकि वह दाऊद के घराने और कुल से था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद के घराने और वंश से।” यूनानी में पूर्वज-संबंध बताने वाले दो निकटार्थक शब्द हैं, जो यूसुफ के दाऊदी वंश पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀνέβη
  choice: ऊपर ... गया
  rationale: यात्रा की भौगोलिक ऊर्ध्व दिशा को बनाए रखता है; केवल ‘गया’ कहने से यह संकेत मिट जाता।
- source_word: δὲ καὶ
  choice: और ... भी
  rationale: हल्के कथात्मक संयोजक और यूसुफ की सम्मिलित यात्रा—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκ πόλεως Ναζαρὲθ
  choice: नासरत नगर से
  rationale: πόλις के सामान्य स्थान-सूचक अर्थ को आधुनिक हिन्दी के स्वाभाविक ‘नगर’ से व्यक्त करता है।
- source_word: εἰς τὴν Ἰουδαίαν
  choice: यहूदिया में
  rationale: रोमी काल के भौगोलिक प्रदेश के लिए प्रचलित हिन्दी नाम रखता है।
- source_word: εἰς πόλιν Δαυὶδ ἥτις καλεῖται Βηθλέεμ
  choice: दाऊद के नगर को गया, जो बेतलेहेम कहलाता है
  rationale: ‘दाऊद का नगर’ पदवी और बेतलेहेम की व्याख्यात्मक पहचान, दोनों को मूल वाक्य-संबंध सहित सुरक्षित रखता है।
- source_word: διὰ τὸ εἶναι αὐτὸν
  choice: क्योंकि वह ... था
  rationale: διά सहित articular infinitive के कारणवाचक अर्थ को सहज हिन्दी उपवाक्य में व्यक्त करता है।
- source_word: ἐξ οἴκου καὶ πατριᾶς Δαυίδ
  choice: दाऊद के घराने और कुल से
  rationale: οἶκος और πατριά—वंश-संबंधी दोनों अलग किंतु निकट पदों—को एक में मिलाए बिना स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: दाऊद से यूसुफ के वंशगत संबंध की दोहरी शब्दावली
  choice: दाऊद के घराने और कुल से
  alternative: दाऊद के घराने और वंश से
  rationale: ‘घराना’ राजवंशीय संबंध को और ‘कुल’ विस्तृत पैतृक समूह को व्यक्त करता है। दोनों यूनानी पदों को बनाए रखने से दाऊदी वंश पर लूका का बल सुरक्षित रहता है, पर पाठ से आगे कोई धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘ऊपर ... गया’ मूल के भौगोलिक संकेत को रखता है; ‘घराने और कुल’ औपचारिक होते हुए भी सहज वंशावली भाषा है।
