  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मन्दिर’ और ‘शास्त्री’ जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि तकनीकी सूक्ष्मता पादटिप्पणी में दी गई है। पादटिप्पणी-चिह्न उन शब्दों के पास रखे गए हैं जिनसे वे वास्तव में संबंधित हैं।
