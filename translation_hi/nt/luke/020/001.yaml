source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ⸀ἡμερῶν διδάσκοντος αὐτοῦ τὸν λαὸν ἐν τῷ ἱερῷ καὶ εὐαγγελιζομένου ἐπέστησαν οἱ ⸀ἀρχιερεῖς καὶ οἱ γραμματεῖς σὺν τοῖς πρεσβυτέροις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/001.yaml
  text: And it happened[a], on one of those days, while he was teaching the people in the temple and proclaiming the good news, that the chief priests and the scribes, together with the elders, came up to him[b],
translation:
  language: hi
  text: उन दिनों में से एक दिन, जब वह मंदिर[b] में लोगों को शिक्षा दे रहा था और शुभ समाचार सुना रहा था[a], तब प्रमुख याजक और शास्त्री बुज़ुर्गों के साथ उसके पास आ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सुसमाचार का प्रचार कर रहा था।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ यूनानी शब्द पूरे मंदिर परिसर को दर्शाता है, केवल भीतरी पवित्रस्थान को नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य कथात्मक संक्रमण-शैली को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है और अनावश्यक रूप से पुरातन अभिव्यक्ति से बचता है।
- source_word: ἐν μιᾷ τῶν ἡμερῶν
  choice: उन दिनों में से एक दिन
  rationale: यह अनिश्चित दिन और यूनानी पदबंध के अंशवाची भाव—कई दिनों में से एक—दोनों को सुरक्षित रखता है।
- source_word: διδάσκοντος αὐτοῦ
  choice: जब वह ... शिक्षा दे रहा था
  rationale: समकालिक परिस्थिति बताने वाले यूनानी संबंधविहीन संबंधकारक पदबंध को सहज हिन्दी आश्रित उपवाक्य में व्यक्त किया गया है।
- source_word: τὸν λαὸν
  choice: लोगों को
  rationale: यहाँ λαός सामान्य रूप से उपस्थित लोगों को सूचित करता है; इसे केवल भीड़ तक सीमित नहीं किया गया।
- source_word: ἐν τῷ ἱερῷ
  choice: मन्दिर में
  rationale: मुख्य पाठ में संक्षिप्त और स्वाभाविक प्रयोग रखा गया है; पादटिप्पणी स्पष्ट करती है कि यूनानी शब्द पूरे मन्दिर परिसर को दर्शाता है।
- source_word: εὐαγγελιζομένου
  choice: शुभ समाचार सुना रहा था
  rationale: यह क्रिया के शुभ समाचार घोषित करने के अर्थ को साधारण आधुनिक हिन्दी में व्यक्त करता है और बाद की कलीसियाई तकनीकी शब्दावली को अनिवार्य नहीं बनाता।
- source_word: ἐπέστησαν
  choice: उसके पास आ गए
  rationale: यह उनके सीधे आगमन को व्यक्त करता है, पर ‘सामना किया’ जैसे अनुवाद से शत्रुता को मूल से अधिक स्पष्ट नहीं करता।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन यहाँ प्रधान-याजकीय नेतृत्व-वर्ग को दर्शाता है, न कि एक ही समय में अनेक औपचारिक महायाजकों को।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह ऐतिहासिक समूह के लिए प्रचलित, सीधा और संक्षिप्त हिन्दी पद है।
- source_word: σὺν τοῖς πρεσβυτέροις
  choice: पुरनियों के साथ
  rationale: ‘के साथ’ यूनानी σύν द्वारा व्यक्त सहभागिता को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: गैर-तकनीकी कथात्मक प्रसंग में εὐαγγελιζομένου का अनुवाद
  choice: शुभ समाचार सुना रहा था
  alternative: सुसमाचार का प्रचार कर रहा था
  rationale: चुना हुआ पाठ यीशु की सार्वजनिक सेवकाई में शुभ समाचार सुनाने की क्रिया को सुलभ भाषा में रखता है और बाद की संस्थागत या कलीसियाई शब्दावली को मूल पर आरोपित नहीं करता।
