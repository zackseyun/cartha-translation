source:
  edition: SBLGNT
  text: καὶ ἐζήτησαν οἱ ⸂γραμματεῖς καὶ οἱ ἀρχιερεῖς⸃ ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας ἐν αὐτῇ τῇ ὥρᾳ, καὶ ἐφοβήθησαν ⸂τὸν λαόν⸃, ἔγνωσαν γὰρ ὅτι πρὸς αὐτοὺς ⸂εἶπεν τὴν παραβολὴν ταύτην⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/019.yaml
  text: And the scribes and the chief priests sought to lay hands on him in that very hour[a], but they feared the people[b], for they knew that he had told this parable against them.
translation:
  language: hi
  text: तब शास्त्रियों और प्रधान याजकों ने उसी घड़ी उस पर हाथ डालने की कोशिश की[a], पर वे लोगों से डरते थे; क्योंकि वे जान गए थे कि उसने यह दृष्टान्त उनके विरुद्ध[b] कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसे पकड़ने की कोशिश की’ अथवा ‘उसे गिरफ़्तार करने की कोशिश की’; मूल में शाब्दिक अर्थ ‘उस पर हाथ डालना’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनसे’; प्रसंग में सम्भवतः भाव यह है कि दृष्टान्त उन्हीं को लक्ष्य करके, उनके विरुद्ध कहा गया था।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐζήτησαν
  choice: चाहा
  rationale: यहाँ क्रिया उनके तत्काल इरादे और प्रयास को संक्षेप में व्यक्त करती है; ‘चाहा’ सफलता का दावा किए बिना उद्देश्य को स्वाभाविक हिन्दी में रखता है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के ऐतिहासिक और धार्मिक संदर्भ में यह इस विशिष्ट समूह के लिए प्रचलित तथा संक्षिप्त हिन्दी पद है।
- source_word: ἀρχιερεῖς
  choice: प्रधान याजक
  rationale: बहुवचन यहाँ याजकीय नेतृत्व-वर्ग को सूचित करता है, न कि एक ही समय पद पर आसीन अनेक महायाजकों को।
- source_word: ἐπιβαλεῖν ἐπ’ αὐτὸν τὰς χεῖρας
  choice: उस पर हाथ डालना
  rationale: यह यूनानी मुहावरे का चित्र बनाए रखता है और पकड़ने अथवा गिरफ़्तार करने की प्रसंगगत संभावना को अनावश्यक रूप से सीमित नहीं करता।
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह मूल वाक्यांश के तत्काल समय और बलाघात, दोनों को स्वाभाविक तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: ἐφοβήθησαν τὸν λαόν
  choice: वे लोगों से डरते थे
  rationale: λαός सामान्य जनसमुदाय की ओर संकेत करता है; ‘लोगों’ कहना इसे केवल मौके पर उपस्थित भीड़ तक सीमित नहीं करता।
- source_word: ἔγνωσαν
  choice: वे जान गए थे
  rationale: यह उस पहचान या बोध को व्यक्त करता है कि दृष्टान्त का निशाना वे स्वयं थे।
- source_word: πρὸς αὐτοὺς
  choice: उनके विरुद्ध
  rationale: प्रसंग में धार्मिक अगुओं ने दृष्टान्त को अपने विरुद्ध आरोप के रूप में समझा; फिर भी अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: यह सुसमाचारों में παραβολή के लिए स्थापित, समझने योग्य और साहित्यिक रूप से उपयुक्त हिन्दी पद है।
theological_decisions:
- issue: πρὸς αὐτοὺς का भाव—दृष्टान्त का धार्मिक अगुओं से संबंध
  choice: दृष्टान्त ‘उनके विरुद्ध’ कहा गया था
  alternative: दृष्टान्त ‘उनसे’ कहा गया था अथवा ‘उनके विषय में’ था
  rationale: पिछले दृष्टान्त पर उनकी प्रतिक्रिया से विरोधात्मक अर्थ प्रबल है, लेकिन यूनानी पूर्वसर्ग की व्यापकता को पादटिप्पणी में बनाए रखा गया है; इससे न तो टकराव का भाव मिटता है, न वास्तविक भाषिक अस्पष्टता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘शास्त्री’, ‘प्रधान याजक’ और ‘दृष्टान्त’ जैसे परिचित बाइबलीय पद ऐतिहासिक समूहों और साहित्यिक विधा की पहचान बनाए रखते हैं। पादटिप्पणी [b] को अर्थगत रूप से सम्बद्ध ‘उनके विरुद्ध’ के बाद रखा गया है।
