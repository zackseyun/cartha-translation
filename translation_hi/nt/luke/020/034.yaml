  text: And Jesus said to them[a], “The sons of this age marry and are given in marriage,”
translation:
  language: hi
  text: और यीशु ने उनसे कहा, “इस युग के पुत्र[a] विवाह करते हैं और विवाह के लिए दिए जाते हैं।”
