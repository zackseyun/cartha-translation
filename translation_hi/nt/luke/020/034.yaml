    text: या “इस युग के लोग।” यूनानी में “इस युग के पुत्र,” जो वर्तमान युग से संबंध रखने वाले लोगों के लिए प्रयुक्त प्रतिनिधिक पुल्लिंग अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: सरल कथात्मक संयोजक को बिना अतिरिक्त कालगत अर्थ जोड़े सुरक्षित रखता है।
- source_word: εἶπεν αὐτοῖς
  choice: उनसे कहा
  rationale: λέγω के सामान्य अर्थ और बहुवचन संप्रदान αὐτοῖς को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Οἱ υἱοὶ τοῦ αἰῶνος τούτου
  choice: इस युग के पुत्र
  rationale: यूनानी के शाब्दिक, प्रतिनिधिक पुरुषवाची मुहावरे तथा वर्तमान युग से संबंध—दोनों को सुरक्षित रखता है।
- source_word: γαμοῦσιν
  choice: विवाह करते हैं
  rationale: सक्रिय क्रिया का सामान्य और गरिमापूर्ण हिन्दी रूप है।
- source_word: γαμίσκονται
  choice: विवाह में दिए जाते हैं
  rationale: यूनानी कर्मवाच्य को बनाए रखते हुए पहली और दूसरी वैवाहिक क्रिया के रूपगत भेद को सुरक्षित रखता है।
theological_decisions:
- issue: प्रतिनिधिक पुरुषवाची अभिव्यक्ति
  choice: इस युग के पुत्र
  alternative: इस युग के लोग
  rationale: υἱοὶ स्पष्टतः ‘पुत्र’ है, पर यहाँ केवल पुरुषों के बजाय वर्तमान युग से संबंधित लोगों के लिए प्रतिनिधिक रूप में प्रयुक्त हुआ है; मुख्य पाठ स्रोत-रूप को और पादटिप्पणी उसके व्यापक आशय को बताती है।
- issue: αἰών की युगांतशास्त्रीय अर्थ-छाया
  choice: इस युग
  alternative: इस संसार
  rationale: ‘युग’ वर्तमान व्यवस्था और आने वाले युग के बीच संदर्भगत विरोध को सुरक्षित रखता है; ‘संसार’ भौतिक जगत का अर्थ सुझा सकता है।
- issue: विवाह-संबंधी सक्रिय और कर्मवाच्य क्रियाओं का भेद
  choice: विवाह करते हैं और विवाह में दिए जाते हैं
  alternative: विवाह करते हैं
  rationale: दोनों यूनानी क्रियाओं को एक सामान्य वाक्यांश में मिलाने के बजाय उनके सक्रिय-कर्मवाच्य तनाव को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘विवाह में दिए जाते हैं’ कुछ औपचारिक है, पर मूल के कर्मवाच्य और जोड़ीदार अभिव्यक्ति को जानबूझकर सुरक्षित रखता है।
