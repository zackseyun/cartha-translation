source:
  edition: SBLGNT
  text: καὶ προσέθετο ⸂ἕτερον πέμψαι⸃ δοῦλον· οἱ δὲ κἀκεῖνον δείραντες καὶ ἀτιμάσαντες ἐξαπέστειλαν κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/011.yaml
  text: And he proceeded to send another servant; but they also beat and dishonored that one[a], and sent him away empty-handed.
translation:
  language: hi
  text: फिर उसने एक और दास[a] को भेजा; पर उन्होंने उसे भी पीटा, उसका अपमान किया और खाली हाथ लौटा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’; यूनानी शब्द δοῦλος किसी स्वामी के अधिकार में रहने वाले दास या सेवक को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: फिर उसने ... भेजा
  rationale: प्रस्तुत मुहावरा किसी कार्य को आगे जारी रखने का भाव देता है। हिंदी में ‘फिर’ पिछले भेजे जाने के बाद अगला दास भेजने की स्वाभाविक कथात्मक अभिव्यक्ति है।
- source_word: ἕτερον
  choice: एक और
  rationale: यह पहले दास से भिन्न एक अतिरिक्त दास को सूचित करता है; ‘एक और’ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: δοῦλον
  choice: दास
  rationale: दृष्टान्त में यह व्यक्ति दाख की बारी के स्वामी के अधिकार में रहने वाला प्रतिनिधि है। ‘दास’ उसके बंधुआ सामाजिक दर्जे को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: κἀκεῖνον
  choice: उसे भी
  rationale: यह पिछले दास के साथ हुए व्यवहार की समानता और पुनरावृत्ति व्यक्त करता है।
- source_word: δείραντες
  choice: पीटा
  rationale: क्रिया शारीरिक मारपीट को सूचित करती है; ‘पीटा’ मारने के किसी विशेष साधन का अनावश्यक अनुमान नहीं लगाता।
- source_word: ἀτιμάσαντες
  choice: उसका अपमान किया
  rationale: यह सम्मान छीनने और लज्जित करने के सामाजिक भाव को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: ἐξαπέστειλαν κενόν
  choice: खाली हाथ लौटा दिया
  rationale: यह बताता है कि उसे अपेक्षित फल दिए बिना वापस भेज दिया गया। ‘खाली हाथ’ κενόν का स्वाभाविक हिंदी मुहावरा है।
theological_decisions:
- issue: दृष्टान्त में δοῦλος का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: स्वामी के साथ व्यक्ति का अधिकाराधीन संबंध इस प्रसंग में प्रमुख है। ‘दास’ प्राचीन सामाजिक स्थिति को बनाए रखता है, जबकि पादटिप्पणी सामान्य वैकल्पिक अनुवाद बताती है; इससे कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘फिर’ कथानक की निरंतरता व्यक्त करता है, और क्रमबद्ध क्रियाएँ मूल यूनानी के घटनाक्रम को स्पष्ट रूप से बनाए रखती हैं।
