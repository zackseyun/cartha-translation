  yaml_path: translation/nt/luke/020/045.yaml
  text: 'And while all the people were listening[a], he said to the disciples:'
translation:
  language: hi
  text: 'जब सब लोग सुन रहे थे[a], तब उसने शिष्यों से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब सब लोग सुन रहे थे, उसने शिष्यों से कहा।” यूनानी में ऐसा व्याकरणिक निर्माण है जो उसके बोलने के समय की परिस्थिति बताता है।
    reason: व्याकरणिक विकल्प
lexical_decisions:
- source_word: Ἀκούοντος
  choice: जब ... सुन रहे थे
  rationale: वर्तमान कृदन्त वाला संबंधकारक निरपेक्ष प्रयोग मुख्य कथन के साथ चल रही परिस्थिति बताता है। यह रूप हिन्दी में स्वाभाविक है और सुनने की जारी क्रिया को बनाए रखता है।
- source_word: δὲ
  choice: तब
  rationale: यहाँ δέ हल्का कथात्मक संयोजक है। हिन्दी वाक्य-विन्यास में ‘जब ... तब’ प्रसंग और मुख्य कथन का स्वाभाविक संबंध स्पष्ट करता है, बिना किसी प्रबल विरोध का संकेत दिए।
- source_word: παντὸς τοῦ λαοῦ
  choice: सब लोग
  rationale: एकवचन λαός के साथ πᾶς लोगों की समग्रता व्यक्त करता है। ‘सब लोग’ आधुनिक हिन्दी में सहज है और इसे केवल ‘भीड़’ तक सीमित नहीं करता।
- source_word: λαοῦ
  choice: लोग
  rationale: इस प्रसंग में λαός उपस्थित जनसमुदाय को दर्शाता है। ‘लोग’ सीधा और स्वाभाविक अनुवाद है तथा ‘भीड़’ की अपेक्षा यूनानी शब्द की व्यापकता बनाए रखता है।
- source_word: εἶπεν
  choice: उसने ... कहा
  rationale: λέγω के अओरिस्ट रूप का सीधा और स्वाभाविक हिन्दी कथात्मक समतुल्य ‘कहा’ है। कर्ता प्रसंग से यीशु है, इसलिए ‘उसने’ प्रयुक्त है।
- source_word: τοῖς μαθηταῖς
  choice: शिष्यों से
  rationale: μαθηταί के लिए सुसमाचारों के संदर्भ में स्थापित और अर्थपूर्ण हिन्दी शब्द ‘शिष्य’ है। यूनानी में स्वत्वसूचक शब्द नहीं है, इसलिए ‘अपने’ नहीं जोड़ा गया। हिन्दी में ‘किसी से कहा’ स्वाभाविक प्रयोग है।
theological_decisions:
- issue: दृश्य में श्रोताओं का भेद
  choice: यीशु सब लोगों के सुनते हुए शिष्यों को सीधे संबोधित करता है।
  alternative: यीशु सीधे सब लोगों को संबोधित करता है; अथवा भीड़ से अलग निजी रूप से शिष्यों से कहता है।
  rationale: संबंधकारक निरपेक्ष पदबंध सार्वजनिक परिस्थिति—सब लोगों का सुनना—बताता है, जबकि सम्प्रदान कारक ‘शिष्यों से’ सीधे संबोधित समूह की पहचान करता है। अनुवाद दोनों को अलग रखते हुए साथ प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘जब ... तब’ जारी परिस्थिति और मुख्य कथन का संबंध सहज बनाता है; पद में मौजूद प्रत्यक्ष श्रोता और व्यापक सुननेवाले समुदाय का भेद सुरक्षित रखा गया है।
