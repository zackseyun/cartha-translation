  text: For they no longer dared to ask him anything.
translation:
  language: hi
  text: क्योंकि वे अब उससे कुछ भी पूछने का साहस नहीं करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκέτι
  choice: इसके बाद ... नहीं
  rationale: यह क्रिया-विशेषण उस समय से आगे किसी काम के बंद हो जाने का भाव देता है; संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: γάρ
  choice: क्योंकि
  rationale: यह पिछले कथन की व्याख्या या उसका आधार प्रस्तुत करने वाला संबंधसूचक शब्द है।
- source_word: ἐτόλμων
  choice: साहस नहीं करते थे
  rationale: अपूर्ण भूतकाल का रूप बीते समय की जारी या सामान्य प्रवृत्ति को दर्शा सकता है; यह हिन्दी अभिव्यक्ति उस पहलू को स्वाभाविक रूप से बनाए रखती है।
- source_word: ἐπερωτᾶν
  choice: पूछने
  rationale: यह ἐτόλμων का पूरक अनंत क्रियारूप है; सार्वजनिक प्रश्नोत्तर के इस संदर्भ में ‘पूछना’ सहज और पर्याप्त है।
- source_word: αὐτὸν
  choice: उससे
  rationale: सर्वनाम यीशु की ओर संकेत करता है; हिन्दी में ‘पूछना’ के साथ व्यक्ति को ‘से’ द्वारा व्यक्त करना स्वाभाविक है।
- source_word: οὐδέν
  choice: कुछ भी
  rationale: निषेध के साथ यह किसी भी प्रकार का प्रश्न न पूछने की पूर्णता व्यक्त करता है।
