lexical_decisions:
- source_word: συνελογίσαντο πρὸς ἑαυτοὺς
  choice: वे आपस में विचार करने लगे
  rationale: यह पदबंध समूह के भीतर सोच-विचार और सलाह-मशविरा करने को दर्शाता है। ‘आपस में विचार करने लगे’ यूनानी की विचारपूर्ण, हिसाबी deliberation को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λέγοντες
  choice: प्रत्यक्ष कथन में समाहित
  rationale: यूनानी कृदंत मुख्य क्रिया के साथ चल रहे कथन को बताता है। हिन्दी में ‘विचार करने लगे, “यदि…”’ कहना स्वाभाविक है; अलग से ‘कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता।
- source_word: Ἐὰν εἴπωμεν
  choice: यदि हम कहें
  rationale: यह शर्त और संभाव्यता दोनों को सहज, मानक हिन्दी में बनाए रखता है।
- source_word: Ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह यूनानी शब्दावली और दैवी स्रोत के संकेत को बनाए रखता है, बिना उसे व्याख्यात्मक रूप से ‘परमेश्वर से’ कर देने के।
- source_word: ἐρεῖ
  choice: वह कहेगा
  rationale: यद्यपि आगे प्रश्न है, यूनानी क्रिया सामान्यतः ‘कहेगा’ है; उद्धृत प्रश्न स्वयं प्रश्नवाचक बल प्रकट करता है।
- source_word: ἐπιστεύσατε αὐτῷ
  choice: तुमने उस पर विश्वास क्यों नहीं किया
  rationale: πιστεύω के साथ संप्रदान कारक किसी व्यक्ति की बात को सच मानने या उस पर भरोसा करने का अर्थ दे सकता है। ‘उस पर विश्वास’ इस व्यापकता को बनाए रखता है और ‘उसमें विश्वास’ से बचता है, जो अधिक प्रबल व्यक्तिगत-आस्था का भाव दे सकता था।
theological_decisions:
- issue: ‘स्वर्ग से’ में निहित स्रोत और अधिकार
  choice: ‘स्वर्ग से’ को ज्यों का त्यों बनाए रखा गया
  alternative: ‘परमेश्वर से’
  rationale: सन्दर्भ में अभिप्राय दैवी स्रोत या अधिकार है, पर यूनानी पाठ ‘स्वर्ग’ कहता है। मूल मुहावरे को रखना धर्मवैज्ञानिक संकेत को सुरक्षित रखता है और अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- issue: यूहन्ना पर विश्वास करने का आशय
  choice: ‘उस पर विश्वास’
  alternative: ‘उसकी बात पर विश्वास’ अथवा ‘उस पर भरोसा’
  rationale: मूल अभिव्यक्ति व्यक्ति को संप्रदान कारक में रखती है और विश्वास तथा भरोसे के बीच अर्थगत विस्तार की अनुमति देती है। मुख्य पाठ में अपेक्षाकृत औपचारिक ‘विश्वास’ रखा गया और विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘विचार करने लगे’ समूह की सोची-समझी आपसी मंत्रणा को व्यक्त करता है; ‘स्वर्ग से’ मूल की संक्षिप्तता और धार्मिक संकेत दोनों को सुरक्षित रखता है।
