  text: पर वे आपस में विचार करने लगे, “यदि हम कहें, ‘स्वर्ग से,’ तो वह कहेगा, ‘तुमने उसकी बात पर विश्वास क्यों नहीं किया?’”[a]
  philosophy: optimal-equivalence
