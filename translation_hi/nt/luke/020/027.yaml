id: LUK.20.27
reference: Luke 20:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Προσελθόντες δέ τινες τῶν Σαδδουκαίων, οἱ ⸀ἀντιλέγοντες ἀνάστασιν μὴ εἶναι, ἐπηρώτησαν αὐτὸν
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/027.yaml
  text: Then some of the Sadducees[a], who deny that there is a resurrection, came up and questioned him,
translation:
  language: hi
  text: फिर सदूकियों में से कुछ लोग, जो पुनरुत्थान के होने से इनकार करते हैं,[a] उसके पास आए और उससे प्रश्न किया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कहते हैं कि पुनरुत्थान नहीं है।”
    reason: ἀντιλέγω यहाँ विरोध या इनकार का भाव रखता है; इसे उनके प्रत्यक्ष कथन के रूप में भी अनुवाद किया जा सकता है।
lexical_decisions:
- source_word: Προσελθόντες
  choice: उसके पास आए
  rationale: यह क्रिया यीशु की ओर आने को व्यक्त करती है और मुख्य क्रिया ‘प्रश्न किया’ से पहले की क्रिया के रूप में स्वाभाविक हिन्दी देती है।
- source_word: δέ
  choice: फिर
  rationale: यहाँ δέ प्रबल विरोध के बजाय कथा को आगे बढ़ाता है; ‘फिर’ आधुनिक हिन्दी में इस प्रवाह को सहज रूप से व्यक्त करता है।
- source_word: τινες τῶν Σαδδουκαίων
  choice: सदूकियों में से कुछ लोग
  rationale: यह यूनानी के अंशवाचक भाव को स्पष्ट रखता है कि सभी नहीं, बल्कि उस समूह के कुछ लोग आए थे।
- source_word: οἱ ἀντιλέγοντες
  choice: जो कहते हैं
  rationale: ἀντιλέγω विरोध या खंडन का भाव रख सकता है, पर इसके साथ आया कथन उनकी मान्यता को बताता है। ‘जो कहते हैं’ उस कथनात्मक रूप को बिना अनावश्यक तीखेपन के सुरक्षित रखता है।
- source_word: ἀνάστασιν μὴ εἶναι
  choice: कि पुनरुत्थान नहीं होता
  rationale: यह नकारात्मक infinitive clause पुनरुत्थान के अस्तित्व या वास्तविकता से इनकार व्यक्त करता है। ‘पुनरुत्थान नहीं होता’ हिन्दी में संक्षिप्त, स्वाभाविक और धर्मवैज्ञानिक रूप से अनावश्यक विस्तार से मुक्त है।
- source_word: ἐπηρώτησαν αὐτόν
  choice: उससे प्रश्न किया
  rationale: ἐπερωτάω यहाँ पूछने या सवाल करने को व्यक्त करता है; आगे का प्रसंग चुनौतीपूर्ण प्रश्न है, इसलिए ‘प्रश्न किया’ उपयुक्त और गरिमापूर्ण है।
theological_decisions:
- issue: पुनरुत्थान के विषय में सदूकियों की मान्यता
  choice: जो कहते हैं कि पुनरुत्थान नहीं होता
  alternative: जो पुनरुत्थान को नहीं मानते
  rationale: चुना हुआ रूप यूनानी कथन की संरचना और स्पष्ट निषेध—पुनरुत्थान का न होना—दोनों को बनाए रखता है। इसमें पुनरुत्थान की प्रकृति या सीमा के बारे में कोई अतिरिक्त धर्मसैद्धांतिक विवरण नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल और गरिमापूर्ण रखी गई है। ‘सदूकी’ प्रचलित बाइबलीय समुदाय-नाम है और ‘पुनरुत्थान’ इस प्रसंग के लिए परिचित तथा सटीक धार्मिक शब्द है।
