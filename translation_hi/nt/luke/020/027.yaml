review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the narrative sequence, the partitive reference to some Sadducees, their approach to Jesus, and their questioning of him. However, “पुनरुत्थान नहीं होता” can suggest that resurrection does not occur, whereas ἀνάστασιν μὴ εἶναι more directly denies the existence/reality of resurrection. “पुनरुत्थान के होने से इनकार करते हैं” preserves this distinction and the force of ἀντιλέγοντες.
  naturalness: The sentence is fluent modern standard Hindi. The revised wording is also idiomatic and avoids the slightly event-focused sense of “नहीं होता.”
  terminology: “सदूकी” and “पुनरुत्थान” are established, appropriate biblical terms. “इनकार करते हैं” suitably conveys the contextual force of ἀντιλέγοντες without imposing further theological interpretation.
  issues:
  - severity: medium
    issue: “पुनरुत्थान नहीं होता” is less precise for ἀνάστασιν μὴ εἶναι.
    rationale: The Greek infinitive εἶναι concerns whether resurrection exists/is real. Hindi “नहीं होता” can naturally be heard as denying that a resurrection event happens. Recasting it as denial of resurrection’s being more closely follows the source.
  revised_text: फिर सदूकियों में से कुछ लोग, जो पुनरुत्थान के होने से इनकार करते हैं,[a] उसके पास आए और उससे प्रश्न किया,
  revised_footnotes:
  - marker: a
    text: या, “जो कहते हैं कि पुनरुत्थान नहीं है।”
    reason: ἀντιλέγω यहाँ विरोध या इनकार का भाव रखता है; इसे उनके प्रत्यक्ष कथन के रूप में भी अनुवाद किया जा सकता है।
  revision_rationale: The revision preserves the Greek claim that the Sadducees deny that resurrection is, rather than potentially implying only that resurrection does not happen. It also makes the main text reflect the contextual force of ἀντιλέγοντες, while the footnote retains the more direct speech-like alternative. The existing footnote anchor is retained.
