- from: फिर सदूकियों में से कुछ लोग, जो कहते हैं कि पुनरुत्थान नहीं होता,[a] उसके पास आए और उससे प्रश्न किया,
  to: फिर सदूकियों में से कुछ लोग, जो पुनरुत्थान के होने से इनकार करते हैं,[a] उसके पास आए और उससे प्रश्न किया,
  rationale: The revision preserves the Greek claim that the Sadducees deny that resurrection is, rather than potentially implying only that resurrection does not happen. It also makes the main text reflect the contextual force of ἀντιλέγοντες, while the footnote retains the more direct speech-like alternative. The existing footnote anchor is retained.
