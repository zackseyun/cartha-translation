lexical_decisions:
- source_word: κατανοήσας
  choice: भाँपकर
  rationale: यह क्रिया यहाँ बोलने से पहले उनकी मंशा और चालाकी को पहचान लेने का भाव देती है। ‘भाँपकर’ मानसिक पहचान और सूक्ष्म समझ—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह अव्यय हल्का विरोध अथवा कथानक में मोड़ दिखाता है; यहाँ उनकी चाल और यीशु की उसे पहचान लेने वाली प्रतिक्रिया के बीच विरोध उपयुक्त है।
- source_word: αὐτῶν
  choice: उनकी
  rationale: सम्बन्धकारक सर्वनाम πανουργίαν को विशेषित करता है; हिन्दी में ‘उनकी’ स्वाभाविक और सटीक है।
- source_word: πανουργίαν
  choice: धूर्तता
  rationale: यह शब्द चतुर किन्तु नैतिक रूप से गलत और छलपूर्ण षड्यंत्रकारी व्यवहार को सूचित करता है। ‘धूर्तता’ उस नकारात्मक अर्थ और सोची-समझी चालाकी को संक्षेप में बनाए रखता है।
- source_word: εἶπεν
  choice: उसने ... कहा
  rationale: लेγω के सामान्य कथात्मक भूतकाल का सहज हिन्दी रूप।
- source_word: πρὸς αὐτούς
  choice: उनसे
  rationale: वाणी-सूचक क्रिया के साथ πρός और कर्मकारक सम्बोधित व्यक्तियों को दर्शाते हैं; ‘उनसे कहा’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
