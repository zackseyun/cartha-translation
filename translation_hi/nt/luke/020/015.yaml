source:
  edition: SBLGNT
  text: καὶ ἐκβαλόντες αὐτὸν ἔξω τοῦ ἀμπελῶνος ἀπέκτειναν. τί οὖν ποιήσει αὐτοῖς ὁ κύριος τοῦ ἀμπελῶνος;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/015.yaml
  text: And after throwing him out of the vineyard[a], they killed him. What then will the owner of the vineyard do to them?
translation:
  language: hi
  text: और उसे दाख की बारी[a] से बाहर निकालकर उन्होंने उसे मार डाला। तब दाख की बारी का मालिक उनके साथ क्या करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दाख की बारी का स्वामी।’ यूनानी शब्द क्यूरियोस है, जिसका उपाधि के रूप में प्रायः ‘प्रभु’ अनुवाद किया जाता है; पर यहाँ दृष्टांत में यह दाख की बारी के मानवीय मालिक के लिए है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐκβαλόντες
  choice: बाहर निकालकर
  rationale: अओरिस्ट कृदंत मुख्य क्रिया से पहले हुई कार्रवाई बताता है। ‘बाहर निकालकर’ निष्कासन का बल और क्रियाओं का क्रम स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἔξω τοῦ ἀμπελῶνος
  choice: दाख की बारी से बाहर
  rationale: यह वाक्यांश भीतर से बाहर की ओर गति दर्शाता है; हिन्दी में ‘से बाहर’ इसका सीधा और स्वाभाविक रूप है।
- source_word: ἀπέκτειναν
  choice: उन्होंने मार डाला
  rationale: क्रिया का मूल अर्थ ‘जान से मारना’ है। ‘मार डाला’ स्पष्ट और सहज है तथा ‘हत्या की’ जैसी अतिरिक्त विधिक या नैतिक छाया नहीं जोड़ता।
- source_word: τί οὖν
  choice: इसलिए ... क्या
  rationale: οὖν पिछले घटनाक्रम से निकले परिणामसूचक प्रश्न को जोड़ता है। ‘इसलिए’ इसका तार्किक संबंध सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: ποιήσει ... αὐτοῖς
  choice: उनके साथ क्या करेगा
  rationale: संदर्भ में प्रश्न यह है कि स्वामी उन काश्तकारों के विरुद्ध क्या कार्रवाई करेगा। ‘उनके साथ क्या करेगा’ स्वाभाविक हिन्दी है और αὐτοῖς के संबंध को स्पष्ट रखता है।
- source_word: ὁ κύριος τοῦ ἀμπελῶνος
  choice: दाख की बारी का मालिक
  rationale: κύριος यहाँ दृष्टांत के भीतर दाख की बारी के मानवीय स्वामी या स्वामित्वाधिकारी को सूचित करता है। ‘मालिक’ इस संदर्भगत अर्थ को बिना दिव्य उपाधि का भ्रम पैदा किए स्पष्ट करता है।
theological_decisions:
- issue: दृष्टांत में मानवीय संदर्भ वाले κύριος का अनुवाद
  choice: मालिक
  alternative: स्वामी
  rationale: यद्यपि κύριος अनेक स्थानों पर दिव्य उपाधि ‘प्रभु’ है, यहाँ व्याकरण और दृष्टांत का निकट संदर्भ दाख की बारी के स्वामित्वाधिकारी की ओर संकेत करता है। ‘मालिक’ तत्काल अर्थ को स्पष्ट करता है; ‘स्वामी’ भी संभव है, पर आधुनिक पाठक उसे धार्मिक उपाधि के रूप में सुन सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और मौखिक पाठ के अनुकूल। ‘दाख की बारी’ बाइबलीय संदर्भ में परिचित है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सीधी रखी गई है।
