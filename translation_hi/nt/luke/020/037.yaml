source:
  edition: SBLGNT
  text: ὅτι δὲ ἐγείρονται οἱ νεκροὶ καὶ Μωϋσῆς ἐμήνυσεν ἐπὶ τῆς βάτου, ὡς λέγει κύριον τὸν θεὸν Ἀβραὰμ ⸀καὶ θεὸν Ἰσαὰκ ⸁καὶ θεὸν Ἰακώβ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/037.yaml
  text: But that the dead are raised[a], even Moses made known in the passage about the bush[b], where he calls the Lord the God of Abraham and the God of Isaac and the God of Jacob.
translation:
  language: hi
  text: और यह कि मरे हुओं को जीवित किया जाता है, मूसा ने भी झाड़ी वाले प्रसंग में प्रकट किया,[a] जहाँ वह प्रभु[b] को अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर कहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झाड़ी के पास।” यूनानी वाक्यांश उस दृश्य का उल्लेख कर सकता है, अथवा मुहावरे के रूप में जलती हुई झाड़ी से संबंधित शास्त्र के प्रसंग (निर्गमन 3) का।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में “प्रभु”; यह निर्गमन 3 के यूनानी अनुवाद में परमेश्वर के दिव्य नाम के लिए सामान्यतः प्रयुक्त प्रतिनिधि रूप को दर्शाता है।
    reason: cross_reference
lexical_decisions:
- source_word: ἐγείρονται
  choice: जिलाए जाते हैं
  rationale: वर्तमानकालीन कर्मवाच्य रूप को बनाए रखता है और पुनरुत्थान में निहित परमेश्वर के कार्य को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: οἱ νεκροὶ
  choice: मरे हुए
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का स्वाभाविक और सामूहिक हिन्दी रूप है।
- source_word: ἐμήνυσεν
  choice: प्रकट किया है
  rationale: मूसा द्वारा इस सत्य को ज्ञात कराने या प्रमाणित करने का भाव देता है, पर इसे औपचारिक घोषणा बनाकर अर्थ को अधिक प्रबल नहीं करता।
- source_word: ἐπὶ τῆς βάτου
  choice: झाड़ी वाले प्रसंग में
  rationale: यह वाक्यांश जलती हुई झाड़ी के दृश्य के साथ-साथ निर्गमन 3 के उस शास्त्रीय प्रसंग का संकेत भी दे सकता है; मुख्य पाठ में साहित्यिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: ὡς λέγει
  choice: जहाँ वह ... कहता है
  rationale: यहाँ λέγει शास्त्र के कथन का परिचय देता है और κύριον के साथ प्रयुक्त विधेयात्मक संरचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κύριον
  choice: प्रभु
  rationale: दैवी उपाधि के रूप में κύριος का मानक हिन्दी प्रतिरूप है; निर्गमन में परमेश्वर के नाम से इसके संबंध को पादटिप्पणी में रखा गया है।
- source_word: θεὸν Ἀβραὰμ καὶ θεὸν Ἰσαὰκ καὶ θεὸν Ἰακώβ
  choice: अब्राहम का परमेश्वर, इसहाक का परमेश्वर और याकूब का परमेश्वर
  rationale: हर पूर्वज के साथ θεόν की पुनरावृत्ति को बनाए रखता है, जिससे यूनानी पाठ और निर्गमन के उद्धरण का बल तथा लय सुरक्षित रहते हैं।
theological_decisions:
- issue: सदूकियों के विरुद्ध यीशु के तर्क में पुनरुत्थान की भाषा
  choice: मरे हुए जिलाए जाते हैं
  alternative: मरे हुए जी उठते हैं
  rationale: चुना हुआ रूप यूनानी कर्मवाच्य को सुरक्षित रखता है और परमेश्वर के निहित कार्य की ओर संकेत करता है, जबकि वैकल्पिक रूप इसे कर्तृवाच्य बना सकता है।
- issue: इस्राएल के परमेश्वर से संबंधित उद्धरण में κύριος का अनुवाद
  choice: प्रभु
  alternative: यहोवा
  rationale: यूनानी पाठ में κύριον है, इसलिए मुख्य पाठ में उसी उपाधि का अनुवाद रखा गया है। निर्गमन 3 में इसके पीछे स्थित दिव्य नाम की परंपरा को पादटिप्पणी में स्पष्ट किया गया है, मुख्य पाठ में प्रतिस्थापित नहीं किया गया।
- issue: ἐπὶ τῆς βάτου का स्थानगत अथवा साहित्यिक अर्थ
  choice: झाड़ी वाले प्रसंग में
  alternative: झाड़ी के पास
  rationale: संदर्भ में मूसा के लिखित साक्ष्य का उल्लेख होने के कारण साहित्यिक अर्थ अधिक स्वाभाविक है, पर यूनानी वाक्यांश की वास्तविक स्थानगत संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “जिलाए जाते हैं” कर्मवाच्य को सुरक्षित रखता है; पूर्वजों के साथ “परमेश्वर” की पुनरावृत्ति मूल पाठ के बल और लय के अनुसार जानबूझकर बनाए रखी गई है। पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद रखे गए हैं।
