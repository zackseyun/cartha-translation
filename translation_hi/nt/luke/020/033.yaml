  yaml_path: translation/nt/luke/020/033.yaml
  text: In the resurrection[a], then[c][b], whose wife does the woman become? For the seven had her as wife.
translation:
  language: hi
  text: तो पुनरुत्थान में[a] वह स्त्री उन सातों में से किसकी पत्नी बनेगी?[b] क्योंकि वह उन सातों की पत्नी रह चुकी थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पुनरुत्थान के समय।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘वह उनमें से किसकी पत्नी होगी?’
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘क्योंकि उन सातों ने उसे अपनी पत्नी माना था’; अथवा, ‘उन सातों ने उससे विवाह किया था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ἡ γυνή
  choice: वह स्त्री
  rationale: पहला प्रयोग पहले से चर्चित स्त्री की ओर संकेत करता है; यहाँ ‘स्त्री’ स्वाभाविक है, जबकि आगे γυνή वैवाहिक अर्थ में ‘पत्नी’ है।
- source_word: οὖν
  choice: तो
  rationale: यह सदूकियों के तर्क का निष्कर्ष या अगला चरण दिखाता है; आधुनिक हिन्दी में ‘तो’ इसकी शक्ति को सहज रूप से व्यक्त करता है।
- source_word: ἐν τῇ ἀναστάσει
  choice: पुनरुत्थान में
  rationale: यूनानी पूर्वसर्गीय वाक्यांश का निकट और धर्मवैज्ञानिक रूप से निष्पक्ष अनुवाद; पद में अनुपस्थित ‘मरे हुओं का’ नहीं जोड़ा गया।
- source_word: τίνος αὐτῶν
  choice: उन सातों में से किसकी
  rationale: सम्बन्धवाचक प्रश्न का स्पष्ट हिन्दी रूप है और पूर्वप्रसंग के सात भाइयों की ओर संकेत करता है।
- source_word: γίνεται γυνή
  choice: पत्नी बनेगी
  rationale: γίνεται के ‘बनना’ भाव को बनाए रखा गया है; काल्पनिक पुनरुत्थान-स्थिति के लिए हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: οἱ γὰρ ἑπτὰ
  choice: क्योंकि ... उन सातों
  rationale: निश्चित पद के साथ संख्या पूर्वोक्त सात भाइयों को दर्शाती है; हिन्दी का ‘उन सातों’ इसी निश्चित सामूहिक सन्दर्भ को स्पष्ट करता है।
- source_word: ἔσχον αὐτὴν γυναῖκα
  choice: वह उन सातों की पत्नी रह चुकी थी
  rationale: यूनानी मुहावरे ‘उसे पत्नी के रूप में रखा/पाया था’ का स्वाभाविक हिन्दी रूप, जो वैवाहिक सम्बन्ध की स्थिति व्यक्त करता है और अनावश्यक रूप से केवल विवाह की क्रिया पर बल नहीं देता।
theological_decisions:
- issue: सदूकियों के प्रश्न में पुनरुत्थान का अर्थ
  choice: ἀνάστασις का केवल ‘पुनरुत्थान’ अनुवाद किया गया है।
  alternative: ‘मरे हुओं का पुनरुत्थान’
  rationale: इस पद में केवल ἀνάστασις है। व्यापक प्रसंग की व्याख्यात्मक शब्दावली जोड़ने के बजाय प्रश्न में निहित धर्मवैज्ञानिक तनाव को यथावत रखा गया है।
- issue: पुनरुत्थान में वैवाहिक स्थिति की काल्पनिक परिणति
  choice: ‘पत्नी बनेगी’
  alternative: ‘पत्नी होगी’
  rationale: ‘बनेगी’ γίνομαι के परिणामी भाव को बचाता है और सदूकियों के काल्पनिक तर्क को बिना सुलझाए प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तो’ तर्क की कड़ी को स्वाभाविक बनाता है; ‘रह चुकी थी’ क्रमशः सात भाइयों के साथ रहे वैवाहिक सम्बन्ध को संक्षेप और सहज रूप में व्यक्त करता है।
