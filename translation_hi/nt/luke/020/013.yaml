reference: Luke 20:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος τοῦ ἀμπελῶνος· Τί ποιήσω; πέμψω τὸν υἱόν μου τὸν ἀγαπητόν· ἴσως ⸀τοῦτον ἐντραπήσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/013.yaml
  text: Then the owner of the vineyard said[a], ‘What shall I do? I will send my beloved son[b]; perhaps they will respect him.’
translation:
  language: hi
  text: तब दाख की बारी के मालिक ने कहा[a], “मैं क्या करूँ? मैं अपने प्रिय पुत्र को भेजूँगा; शायद वे उसका आदर करेंगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “दाख की बारी के स्वामी ने।”'
    reason: lexical_alternative
  - marker: b
    text: “आदर करेंगे” के लिए प्रयुक्त यूनानी क्रिया का अर्थ “उसके सामने लज्जित होंगे” या “उसके प्रति लिहाज़ दिखाएँगे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος τοῦ ἀμπελῶνος
  choice: दाख की बारी का मालिक
  rationale: इस कृषि-संबंधी दृष्टान्त में यह पद दाख की बारी पर अधिकार रखने वाले व्यक्ति को बताता है। ‘मालिक’ आधुनिक हिन्दी में स्वाभाविक है और कथा के पात्र पर अनावश्यक रूप से ईश्वरीय उपाधि आरोपित नहीं करता।
- source_word: ἀμπελῶνος
  choice: दाख की बारी
  rationale: ἀμπελών का मानक और सामान्य हिन्दी कृषि-संबंधी पर्याय।
- source_word: Τί ποιήσω;
  choice: मैं क्या करूँ?
  rationale: विचार-विमर्श सूचक aorist subjunctive को स्वगत प्रश्न के रूप में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πέμψω
  choice: मैं ... भेजूँगा
  rationale: भविष्यकाल मालिक के अब निश्चित किए गए कदम को व्यक्त करता है।
- source_word: τὸν υἱόν μου τὸν ἀγαπητόν
  choice: अपने प्रिय पुत्र को
  rationale: ‘पुत्र’ लिंग-विशिष्ट अर्थ को बनाए रखता है और ‘प्रिय’ स्नेह तथा लूका में संभावित मसीही प्रतिध्वनि, दोनों को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: ἴσως
  choice: शायद
  rationale: अनिश्चित आशा या संभावना को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοῦτον
  choice: उसका
  rationale: यूनानी संकेतवाचक सर्वनाम पुत्र की ओर संकेत करता है; हिन्दी में संबंध-चिह्नित ‘उसका आदर’ अधिक स्वाभाविक है।
- source_word: ἐντραπήσονται
  choice: आदर करेंगे
  rationale: इस प्रसंग में क्रिया किसी के प्रति सम्मान या संकोचपूर्ण लिहाज़ दिखाने को व्यक्त करती है। ‘आदर करेंगे’ सर्वाधिक स्पष्ट है, जबकि ‘उसके सामने लज्जित होंगे’ अधिक शब्दशः पर कम स्वाभाविक विकल्प है।
theological_decisions:
- issue: दृष्टान्त में κύριος का अनुवाद, जहाँ पात्र प्रतीकात्मक रूप से परमेश्वर की ओर संकेत कर सकता है
  choice: मालिक
  alternative: दाख की बारी का स्वामी
  rationale: तात्कालिक कथा में पात्र संपत्ति का मालिक है। ‘मालिक’ कथा-स्तर का अर्थ सुरक्षित रखता है और पाठक को प्रतीकात्मक अर्थ समझने देता है, पर अनुवाद स्वयं उसे ‘प्रभु’ जैसी धार्मिक उपाधि से बाध्य नहीं करता।
- issue: ‘प्रिय पुत्र’ की संभावित मसीही प्रतिध्वनि
  choice: अपने प्रिय पुत्र को
  alternative: अपने पुत्र को, जो मेरा प्रिय है
  rationale: यूनानी पदबंध दृष्टान्त के साधारण अर्थ और लूका में यीशु के बपतिस्मे/रूपान्तरण की संभावित प्रतिध्वनि, दोनों को वहन कर सकता है। संक्षिप्त हिन्दी पदबंध इस तनाव को बिना अतिरिक्त व्याख्या के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘दाख की बारी’, ‘प्रिय पुत्र’ और ‘आदर करेंगे’ सामान्य पाठक के लिए बोधगम्य हैं; विराम-चिह्न मूल वाक्य की विचारात्मक गति बनाए रखते हैं।
