source:
  edition: SBLGNT
  text: ⸀καὶ καιρῷ ἀπέστειλεν πρὸς τοὺς γεωργοὺς δοῦλον, ἵνα ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος ⸀δώσουσιν αὐτῷ· οἱ δὲ γεωργοὶ ⸂ἐξαπέστειλαν αὐτὸν δείραντες⸃ κενόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/010.yaml
  text: And at the proper time he sent a servant to the vine-growers[a], so that they would give him some of the fruit of the vineyard[b]. But the vine-growers sent him away empty after beating him.
translation:
  language: hi
  text: और उचित समय पर उसने दाख की बारी के किसानों के पास एक दास[a] भेजा, ताकि वे उसे दाख की बारी की उपज में से कुछ दें। पर किसानों ने उसे पीटकर खाली हाथ[b] वहाँ से भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक’। यूनानी शब्द δοῦλος दोनों अर्थों में अनूदित हो सकता है, पर ‘दास’ यहाँ उसकी दासत्व की स्थिति को अधिक स्पष्ट रूप से बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से ‘खाली’; अर्थात दाख की बारी की उपज में से कुछ भी दिए बिना।
    reason: lexical_alternative
lexical_decisions:
- source_word: καιρῷ
  choice: उचित समय पर
  rationale: यह कालवाचक दत्तिव उचित या नियत अवसर को दर्शाता है; ‘उचित समय पर’ स्वाभाविक है और यूनानी पाठ से आगे बढ़कर इसे स्पष्ट रूप से कटनी का समय नहीं कहता।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: ἀποστέλλω के सामान्य अर्थ को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γεωργούς
  choice: दाख की बारी के किसानों
  rationale: γεωργοί खेती करने वालों को दर्शाता है। दाख की बारी का संदर्भ कृषि की विशिष्टता स्पष्ट करता है, जबकि ‘पट्टेदार’ जैसा कानूनी दर्जा मूल शब्द में स्वयं स्पष्ट नहीं है।
- source_word: δοῦλον
  choice: दास
  rationale: δοῦλος की बंधुआ सामाजिक स्थिति को ‘दास’ अधिक सीधे सुरक्षित रखता है; केवल परंपरागत सहजता के लिए इसे ‘सेवक’ नहीं बनाया गया।
- source_word: ἵνα ... δώσουσιν αὐτῷ
  choice: ताकि वे उसे ... दें
  rationale: ἵνα के प्रयोजनार्थक बल को वर्तमान, सहज हिन्दी में व्यक्त करता है।
- source_word: ἀπὸ τοῦ καρποῦ τοῦ ἀμπελῶνος
  choice: दाख की बारी की उपज में से कुछ
  rationale: ἀπό के साथ संबंधवाचक रूप यहाँ उपज के एक हिस्से का बोध कराता है; ‘कुछ’ इस अंशवाचक अर्थ को स्पष्ट करता है, बिना किसी निश्चित कानूनी हिस्से को जोड़ने के।
- source_word: ἐξαπέστειλαν
  choice: वापस भेज दिया
  rationale: यौगिक क्रिया में किसी को वहाँ से विदा कर देने का भाव है; प्रसंग में ‘वापस भेज दिया’ गंतव्य को अनावश्यक रूप से निश्चित किए बिना यह भाव व्यक्त करता है।
- source_word: δείραντες
  choice: पीटकर
  rationale: पूर्वकालिक कृदंत को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है; ‘कोड़े लगाकर’ मूल से अधिक विशिष्ट होता।
- source_word: κενόν
  choice: खाली हाथ
  rationale: κενός का शाब्दिक अर्थ ‘खाली’ है; हिन्दी मुहावरा ‘खाली हाथ’ प्रसंग में स्पष्ट करता है कि दास को उपज में से कुछ नहीं मिला।
