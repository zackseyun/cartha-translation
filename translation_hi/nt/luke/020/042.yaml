id: LUK.20.42
reference: Luke 20:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸂αὐτὸς γὰρ⸃ Δαυὶδ λέγει ἐν βίβλῳ ψαλμῶν· ⸀Εἶπεν κύριος τῷ κυρίῳ μου· Κάθου ἐκ δεξιῶν μου
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/042.yaml
  text: For David himself says in the Book of Psalms[a], ‘The Lord said to my Lord, “Sit at my right hand”’
translation:
  language: hi
  text: क्योंकि दाऊद स्वयं भजनों की पुस्तक में कहता है, “प्रभु ने मेरे प्रभु से कहा, ‘मेरे दाहिने बैठो।’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, भजन 110:1 के इब्रानी पाठ के अनुसार, “यहोवा ने मेरे प्रभु से कहा।”
    reason: अंतर्निहित इब्रानी स्रोत में पहले ‘प्रभु’ के स्थान पर परमेश्वर का नाम YHWH है।
lexical_decisions:
- source_word: αὐτὸς γὰρ
  choice: क्योंकि ... स्वयं
  rationale: γάρ पिछले कथन का आधार प्रस्तुत करता है, इसलिए ‘क्योंकि’; αὐτός का बल ‘स्वयं’ से सुरक्षित रहता है।
- source_word: Δαυὶδ
  choice: दाऊद
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप।
- source_word: λέγει
  choice: कहता है
  rationale: उद्धरण-सूत्र के वर्तमान काल को हिन्दी में स्वाभाविक साहित्यिक वर्तमान से व्यक्त किया गया है।
- source_word: ἐν βίβλῳ ψαλμῶν
  choice: भजनों की पुस्तक में
  rationale: βίβλος और ψαλμῶν के संबंध को स्रोत-संगत तथा सहज हिन्दी में व्यक्त करता है।
- source_word: Εἶπεν
  choice: कहा
  rationale: एओरिस्ट को उद्धृत कथन में सामान्य भूतकाल के रूप में प्रस्तुत किया गया है।
- source_word: κύριος
  choice: प्रभु
  rationale: यूनानी κύριος का सीधा और गरिमापूर्ण हिन्दी समतुल्य; मुख्य पाठ यूनानी स्रोत का अनुसरण करता है।
- source_word: τῷ κυρίῳ μου
  choice: मेरे प्रभु से
  rationale: सम्प्रदान कारक को हिन्दी कथन-रचना ‘से कहा’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है; ‘प्रभु’ मसीही उद्धरण की अर्थगत गंभीरता बनाए रखता है।
- source_word: Κάθου
  choice: बैठो
  rationale: आज्ञार्थक रूप का संक्षिप्त और स्वाभाविक हिन्दी अनुवाद।
- source_word: ἐκ δεξιῶν μου
  choice: मेरे दाहिने
  rationale: यह यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है, जो सम्मान और अधिकार के स्थान को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: भजन 110:1 के उद्धरण में पहले κύριος का अनुवाद, जहाँ मूल इब्रानी में परमेश्वर का नाम YHWH है
  choice: प्रभु
  alternative: यहोवा
  rationale: लूका के यूनानी पाठ में κύριος है, इसलिए मुख्य पाठ में ‘प्रभु’ रखा गया है। अंतर्निहित इब्रानी भजन का ‘यहोवा’ पाठांतर पादटिप्पणी में दिया गया है, जिससे अंतरपाठीय जानकारी सुरक्षित रहती है।
- issue: मसीह-संबंधी तर्क में दूसरे κύριος का अनुवाद
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: ‘मेरे प्रभु’ यूनानी शब्द और उद्धरण की धर्मवैचारिक गंभीरता दोनों को सुरक्षित रखता है, पर यह स्वयं यह निर्धारित नहीं करता कि दाऊद जिसे संबोधित करता है उसकी प्रकृति क्या है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। ‘भजनों की पुस्तक’ स्रोत की रचना को स्पष्ट रखता है; उद्धरण के भीतर ‘प्रभु’ की पुनरावृत्ति जानबूझकर सुरक्षित रखी गई है।
