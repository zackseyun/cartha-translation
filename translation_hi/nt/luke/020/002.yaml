source:
  edition: SBLGNT
  text: καὶ εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃· Εἰπὸν ἡμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιεῖς, ἢ τίς ἐστιν ὁ δούς σοι τὴν ἐξουσίαν ταύτην;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/002.yaml
  text: And they said to him, “Tell us, by what authority are you doing these things? Or who is the one who gave you this authority?”
translation:
  language: hi
  text: और उन्होंने उससे कहा, “हमें बताओ, तुम ये काम किस अधिकार से कर रहे हो? या वह कौन है जिसने तुम्हें यह अधिकार दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले प्रसंग से प्रश्न को जोड़ता है और बिना अतिरिक्त कालगत अर्थ जोड़े सहज कथा-प्रवाह बनाए रखता है।
- source_word: εἶπαν ⸂λέγοντες πρὸς αὐτόν⸃
  choice: उन्होंने उससे कहा
  rationale: यूनानी में मुख्य क्रिया और कृदंत का कुछ दोहराव है; हिन्दी में यह स्वाभाविक वाक्यांश संबोधन और कथन—दोनों का अर्थ संप्रेषित करता है।
- source_word: Εἰπὸν ἡμῖν
  choice: हमें बताओ
  rationale: आज्ञार्थक रूप का वर्तमान हिन्दी में स्वाभाविक और सीधा अनुवाद है।
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: यहाँ ἐξουσία वैध अधिकार या प्राधिकरण को दर्शाता है; ‘किस अधिकार से’ चुनौतीपूर्ण प्रश्न का स्वाभाविक हिन्दी रूप है।
- source_word: ταῦτα ποιεῖς
  choice: तुम ये काम ... कर रहे हो
  rationale: बहुवचन ταῦτα को ‘ये काम’ से बनाए रखा गया है और वर्तमान क्रिया की तात्कालिकता ‘कर रहे हो’ से स्वाभाविक रूप में व्यक्त होती है।
- source_word: ἢ
  choice: या
  rationale: यह उसी चुनौती का दूसरा, वैकल्पिक रूप प्रस्तुत करता है।
- source_word: τίς ἐστιν ὁ δούς σοι
  choice: वह कौन है जिसने तुम्हें ... दिया
  rationale: यह रचना संज्ञात्मक कृदंत ὁ δούς की स्पष्टता बनाए रखते हुए हिन्दी में सहज है।
- source_word: τὴν ἐξουσίαν ταύτην
  choice: यह अधिकार
  rationale: संकेतवाचक बल सुरक्षित रहता है और ἐξουσία को केवल सामर्थ्य नहीं, बल्कि प्रदत्त वैध अधिकार के रूप में व्यक्त किया जाता है।
theological_decisions:
- issue: मन्दिर के प्रसंग में ἐξουσία का अर्थ
  choice: अधिकार
  alternative: सामर्थ्य; हक
  rationale: धार्मिक अगुवे यीशु की क्षमता नहीं, बल्कि उसके कार्यों की वैधता और उस अधिकार के स्रोत पर प्रश्न उठा रहे हैं। ‘अधिकार’ संस्थागत और धर्मवैचारिक तनाव को बिना किसी अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में प्रसंगानुकूल अनौपचारिक ‘तुम’, जो प्रश्न की सीधी चुनौती को व्यक्त करता है। भाषा सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है।
