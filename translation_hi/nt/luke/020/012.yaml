  text: And he sent a third[a]; but they wounded this one also and threw him out.
translation:
  language: hi
  text: और उसने तीसरे सेवक को भेजा[a]; लेकिन उन्होंने उसे भी घायल करके बाहर निकाल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी वाक्यांश का शाब्दिक अर्थ है, ‘उसने तीसरे को भेजने का काम और आगे बढ़ाया’; यह एक मुहावरा है, जिसका अर्थ है, ‘उसने तीसरे को भेजा’ या ‘फिर उसने तीसरे को भेजा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: προσέθετο
  choice: उसने ... भेजा
  rationale: प्रसंग में προστίθημι + क्रियार्थक रूप किसी काम को आगे जारी रखने का मुहावरा है। सहज हिन्दी में ‘भेजा’ और ‘तीसरे’ से पुनरावृत्ति स्पष्ट हो जाती है।
- source_word: τρίτον πέμψαι
  choice: तीसरे सेवक को भेजा
  rationale: यूनानी में केवल ‘तीसरे को भेजना’ है; पिछले पदों के आधार पर ‘सेवक’ निहित है। हिन्दी में संदर्भ की स्पष्टता और स्वाभाविकता के लिए इसे व्यक्त किया गया है।
- source_word: οἱ δὲ
  choice: लेकिन उन्होंने
  rationale: δέ यहाँ मालिक के भेजने और दाख की बारी के किसानों की प्रतिक्रिया के बीच विरोधात्मक मोड़ दिखाता है। ‘उन्होंने’ का संकेत प्रसंग में उन्हीं किसानों की ओर है।
- source_word: καὶ τοῦτον
  choice: उसे भी
  rationale: καί यह बताता है कि तीसरे सेवक के साथ भी पहले सेवकों जैसा दुर्व्यवहार हुआ।
- source_word: τραυματίσαντες
  choice: घायल करके
  rationale: τραυματίζω का सीधा अर्थ घाव पहुँचाना या घायल करना है; यह सामान्य ‘चोट पहुँचाने’ की तुलना में हिंसा को अधिक सटीक रूप से व्यक्त करता है।
- source_word: ἐξέβαλον
  choice: बाहर निकाल दिया
  rationale: ἐκβάλλω यहाँ बलपूर्वक बाहर निकालने को दर्शाता है। ‘बाहर निकाल दिया’ वर्तमान मानक हिन्दी में स्वाभाविक है और हिंसक प्रसंग के अनुकूल है।
