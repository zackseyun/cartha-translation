  text: οἳ κατεσθίουσιν τὰς οἰκίας τῶν χηρῶν καὶ προφάσει μακρὰ προσεύχονται· οὗτοι λήμψονται περισσότερον κρίμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/047.yaml
  text: who devour widows’ houses and for a pretense pray at length[b][a]. These will receive greater condemnation.
translation:
  language: hi
  text: जो विधवाओं के घरों को हड़प लेते हैं और दिखावे के लिए लंबी प्रार्थनाएँ करते हैं। उन्हें और भी कठोर दण्ड मिलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεσθίουσιν
  choice: निगल जाते हैं
  rationale: यहाँ क्रिया शाब्दिक रूप से खाने के लिए नहीं, बल्कि निर्दयतापूर्वक हड़पने और शोषण करने के लिए प्रयुक्त है। ‘निगल जाते हैं’ यूनानी की सजीव और निंदात्मक शक्ति बनाए रखता है।
- source_word: τὰς οἰκίας τῶν χηρῶν
  choice: विधवाओं के घर
  rationale: ‘घर’ οἰκία का निकट अर्थ है और प्रसंग में संपत्ति अथवा गृहस्थी का लाक्षणिक संकेत भी दे सकता है; अनुवाद उस विस्तार को खुला रखता है।
- source_word: προφάσει
  choice: दिखावे के लिए
  rationale: यह वाक्यांश झूठे बाहरी धार्मिक प्रदर्शन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘बहाने के रूप में’ भी संभव है, पर यहाँ कम सहज है।
- source_word: μακρὰ προσεύχονται
  choice: लंबी-लंबी प्रार्थनाएँ करते हैं
  rationale: μακρά क्रियाविशेषणीय रूप से प्रार्थना की लंबी अवधि बताता है। यह हिन्दी में स्वाभाविक और अर्थ की दृष्टि से स्पष्ट है।
- source_word: λήμψονται περισσότερον κρίμα
  choice: उन्हें और भी कठोर दण्ड मिलेगा
  rationale: तुलनात्मक περισσότερον न्यायिक परिणाम की अधिक कठोरता बताता है। प्रसंग में κρίμα प्रतिकूल न्याय-दण्ड है; हिन्दी में यह वाक्यांश स्वाभाविक है और केवल न्याय-प्रक्रिया के बजाय उसके दण्डात्मक परिणाम को स्पष्ट करता है।
theological_decisions:
- issue: κρίμα का स्वरूप
  choice: दण्ड
  alternative: न्याय / दण्डाज्ञा
  rationale: प्रसंग धार्मिक अगुओं की निंदा और उनके विरुद्ध आने वाले प्रतिकूल ईश्वरीय निर्णय का है। ‘दण्ड’ उस न्यायिक परिणाम को स्पष्ट करता है, जबकि ‘न्याय’ हिन्दी में निष्पक्षता अथवा न्याय-प्रक्रिया भी समझा जा सकता है।
- issue: προφάσει का आशय
  choice: दिखावे के लिए
  alternative: बहाने के रूप में / आड़ में
  rationale: यूनानी शब्द झूठे प्रस्तुतिकरण या आड़—दोनों की छाया रख सकता है। मुख्य पाठ धार्मिक प्रदर्शन को सामने रखता है, बिना किसी विशिष्ट शोषण-प्रणाली को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सजीव, गंभीर और सामान्य पाठक के लिए सहज रखी गई है। ‘निगल जाते हैं’ मूल रूपक को और ‘लंबी-लंबी प्रार्थनाएँ’ कपटपूर्ण धार्मिक प्रदर्शन को स्वाभाविक हिन्दी में बनाए रखते हैं।
