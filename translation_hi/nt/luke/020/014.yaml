  text: पर जब दाख की बारी में काम करने वालों[a] ने उसे देखा, तो वे आपस में यह विचार करने लगे, “यह वारिस है। आओ, हम इसे मार डालें, ताकि विरासत हमारी हो जाए।”
  philosophy: optimal-equivalence
  footnotes:
