    reason: lexical_alternative
lexical_decisions:
- source_word: γεωργοὶ
  choice: दाख की बारी में काम करने वाले
  rationale: यह यूनानी संज्ञा खेती का काम करने वालों को सूचित करती है। इस दृष्टान्त में वे विशेष रूप से दाख की बारी में काम करते हैं; इसलिए यह अनुवाद कृषि और तत्काल प्रसंग दोनों को स्पष्ट रखता है, जबकि केवल ‘किसान’ अधिक सामान्य और ‘पट्टेदार’ अधिक कानूनी अर्थ जोड़ता।
- source_word: διελογίζοντο πρὸς ἀλλήλους
  choice: वे आपस में विचार करने लगे
  rationale: अपूर्णकालीन क्रिया और पारस्परिक पदबंध मिलकर उनके बीच चल रहे सोच-विचार और सुनियोजित विमर्श को व्यक्त करते हैं। ‘विचार करने लगे’ संघर्ष का अतिरिक्त भाव जोड़े बिना उस गणनापूर्ण deliberation को स्वाभाविक हिन्दी में रखता है।
- source_word: κληρονόμος
  choice: वारिस
  rationale: ‘वारिस’ आधुनिक हिन्दी में कानूनी और कथात्मक दोनों संदर्भों के लिए संक्षिप्त और सहज समतुल्य है।
- source_word: ἀποκτείνωμεν
  choice: आओ, हम इसे मार डालें
  rationale: प्रथम पुरुष बहुवचन विधिलिंग का यहाँ प्रेरणार्थक बल है। ‘आओ, हम…’ साझा प्रस्ताव को स्पष्ट करता है, और ‘मार डालें’ क्रिया की सीधी तीव्रता को बिना ‘हत्या’ का अतिरिक्त कानूनी-मूल्यांकन जोड़े व्यक्त करता है।
- source_word: ἵνα ἡμῶν γένηται ἡ κληρονομία
  choice: ताकि विरासत हमारी हो जाए
  rationale: ‘ताकि’ उद्देश्यवाचक ἵνα को और ‘हो जाए’ γένηται के ‘बनने/हो जाने’ के भाव को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
- source_word: ἰδόντες δὲ αὐτὸν
  choice: पर जब … ने उसे देखा
  rationale: δέ कथा में हल्का विरोधात्मक मोड़ लाता है, और अओरिस्ट कृदन्त को कालवाचक उपवाक्य ‘जब … देखा’ के रूप में देना हिन्दी में सहज है।
theological_decisions:
- issue: दाख की बारी के दृष्टान्त में γεωργοὶ की भूमिका
  choice: ‘दाख की बारी में काम करने वाले’
  alternative: ‘पट्टेदार’ या ‘किसान’
  rationale: मूल शब्द सीधे कृषि-कर्मियों को बताता है, और तत्काल प्रसंग दाख की बारी का है। व्यापक कथा से उनके पट्टेदार होने का संकेत मिल सकता है, पर इस पद में संज्ञा स्वयं उस कानूनी संबंध को स्पष्ट नहीं करती; इसलिए अनुवाद उसे अनावश्यक रूप से निश्चित नहीं करता।
- issue: विरासत पाने के लिए हत्या का उद्देश्य
  choice: ‘ताकि विरासत हमारी हो जाए’
  alternative: ‘और विरासत हमारी हो जाएगी’
  rationale: उद्देश्यवाचक रचना पात्रों की मंशा व्यक्त करती है, परिणाम की निश्चितता नहीं। इस प्रकार उनके तर्क को उद्धृत किया गया है, उसे कथाकार की पुष्टि नहीं बनाया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दाख की बारी’ बाइबलीय प्रसंग में परिचित तथा सामान्य पाठक के लिए बोधगम्य है। संवाद सीधा रखा गया है; ‘आओ’ सामूहिक प्रस्ताव का स्वाभाविक हिन्दी रूप है।
