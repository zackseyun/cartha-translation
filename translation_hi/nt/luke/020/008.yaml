  edition: SBLGNT
  text: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς· Οὐδὲ ἐγὼ λέγω ὑμῖν ἐν ποίᾳ ἐξουσίᾳ ταῦτα ποιῶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/008.yaml
  text: And Jesus said to them[a], “Neither will I tell you by what authority I do these things.”
translation:
  language: hi
  text: और यीशु ने उनसे कहा, “तो मैं भी तुम्हें नहीं बताऊँगा कि मैं ये काम किस अधिकार से करता हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καὶ ὁ Ἰησοῦς εἶπεν αὐτοῖς
  choice: और यीशु ने उनसे कहा
  rationale: यह सहज हिन्दी में यूनानी कथात्मक आरम्भ, कर्ता और बहुवचन सम्प्रदान को सीधे व्यक्त करता है।
- source_word: Οὐδὲ ἐγὼ
  choice: तो मैं भी ... नहीं
  rationale: οὐδέ पिछले पद में अगुवों के उत्तर न देने से यीशु के प्रत्युत्तर को जोड़ता है। हिन्दी में ‘तो मैं भी नहीं’ उस प्रतिक्रियात्मक संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: λέγω ὑμῖν
  choice: तुम्हें नहीं बताऊँगा
  rationale: यहाँ λέγω का आशय उनसे अपेक्षित जानकारी प्रकट करना है, इसलिए ‘बताना’ स्वाभाविक है। प्रसंगानुसार भविष्यकालीन रूप हिन्दी में प्रत्यक्ष इनकार का बल ठीक से देता है।
- source_word: ἐν ποίᾳ ἐξουσίᾳ
  choice: किस अधिकार से
  rationale: यह मुहावरा उस अधिकार या वैध आधार को पूछता है जिसके अंतर्गत यीशु कार्य करते हैं। ‘किस अधिकार से’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: ἐξουσίᾳ
  choice: अधिकार
  rationale: यहाँ शब्द केवल सामर्थ्य नहीं, बल्कि कार्य करने के वैध अधिकार को दर्शाता है।
- source_word: ταῦτα ποιῶ
  choice: मैं ये काम ... करता हूँ
  rationale: ‘ये काम’ यूनानी बहुवचन को बनाए रखता है और ‘करता हूँ’ वर्तमानकाल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अगुवों को उत्तर देने से यीशु का इनकार
  choice: यीशु का सीधा इनकार प्रस्तुत किया गया है, बिना उसका कारण समझाए।
  alternative: अनुवाद में यह जोड़ना कि यीशु प्रश्न टाल रहे थे या उनके अविश्वास का न्याय कर रहे थे।
  rationale: पद केवल इतना कहता है कि यीशु उन्हें अपने अधिकार का स्रोत नहीं बताएँगे; उनके उद्देश्य की अतिरिक्त व्याख्या मूल पाठ में नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज है। ‘ये काम’ सामान्य पाठक के लिए ‘ये बातें’ से अधिक स्पष्ट है, क्योंकि ποιῶ क्रियात्मक कार्यों की ओर संकेत करता है। किसी पादटिप्पणी की आवश्यकता नहीं है; हिन्दी का ‘किस अधिकार से’ अंग्रेज़ी के ‘by/with what authority’ दोनों अर्थ-छायाओं को स्वाभाविक रूप से समेटता है।
