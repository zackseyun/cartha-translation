  text: But in reply he said to them[a], “I also will ask you a question, and you tell me:”
translation:
  language: hi
  text: पर उसने उत्तर में उनसे कहा, “मैं भी तुमसे एक प्रश्न पूछूँगा; मुझे बताओ:”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν πρὸς αὐτούς
  choice: पर उसने उन्हें उत्तर दिया
  rationale: उत्तर देने वाले कृदंत और मुख्य क्रिया ‘कहा’ को स्वाभाविक हिन्दी में एक साथ व्यक्त किया गया है। δέ का हल्का विरोध प्रसंगानुसार ‘पर’ से प्रकट होता है।
- source_word: Ἐρωτήσω ὑμᾶς
  choice: मैं तुमसे ... पूछूँगा
  rationale: ἐρωτάω के भाव और बहुवचन सम्बोधन को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: κἀγὼ
  choice: मैं भी
  rationale: 'καὶ ἐγώ की संक्षिप्त रूप-रचना में निहित पारस्परिक बल को बनाए रखता है: जैसे उन्होंने यीशु से पूछा, वैसे वह भी उनसे पूछेगा।'
- source_word: λόγον
  choice: एक प्रश्न
  rationale: λόγος का मूल अर्थ ‘बात/वचन’ हो सकता है, पर ἐρωτάω के साथ यहाँ यह पूछी जाने वाली बात, अर्थात प्रश्न, के अर्थ में प्रयुक्त है।
- source_word: καὶ εἴπατέ μοι
  choice: मुझे बताओ
  rationale: बहुवचन आज्ञार्थक और μοι को सीधे, स्वाभाविक हिन्दी में प्रस्तुत करता है; ‘उत्तर दो’ की अपेक्षा यूनानी के ‘कहो/बताओ’ को निकटता से रखता है।
