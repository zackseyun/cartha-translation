translation_notes:
  register: आधुनिक मानक हिन्दी; सम्बोधन के लिए प्रसंगानुकूल बहुवचन ‘तुम’ और सीधी, गरिमापूर्ण वाक्य-रचना। मूल के विरामात्मक प्रवाह को बनाए रखने के लिए अंत में द्विबिंदु रखा गया है, क्योंकि अगली आयत में प्रश्न आता है।
