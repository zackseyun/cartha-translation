source:
  edition: SBLGNT
  text: οἱ δὲ καταξιωθέντες τοῦ αἰῶνος ἐκείνου τυχεῖν καὶ τῆς ἀναστάσεως τῆς ἐκ νεκρῶν οὔτε γαμοῦσιν οὔτε ⸀γαμίζονται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/035.yaml
  text: But those who are considered worthy to attain that age and the resurrection from the dead neither marry nor are given in marriage[a][b].
translation:
  language: hi
  text: परन्तु जो उस युग[b] को प्राप्त करने और मरे हुओं में से पुनरुत्थान पाने के योग्य ठहराए गए हैं[a], वे न तो विवाह करते हैं और न उनका विवाह कराया जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘योग्य माने गए हैं।’ यूनानी में यह कर्मवाच्य है और यह भाव देता है कि उन्हें योग्य ठहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आने वाला युग।’ शाब्दिक अर्थ है ‘उस युग।’
    reason: lexical_alternative
lexical_decisions:
- source_word: καταξιωθέντες
  choice: योग्य ठहराए जाते हैं
  rationale: 'यह यूनानी का कर्मवाच्य भाव सुरक्षित रखता है: वे अपने आप को योग्य सिद्ध नहीं करते, बल्कि योग्य माने या ठहराए जाते हैं। साथ ही यह वाक्यांश योग्यता के आधार को अनावश्यक रूप से स्पष्ट नहीं करता।'
- source_word: τοῦ αἰῶνος ἐκείνου
  choice: उस युग
  rationale: यह ἐκείνου के संकेतवाचक अर्थ को सीधे सुरक्षित रखता है और वर्तमान युग से भावी युग के विरोध को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
- source_word: τυχεῖν
  choice: पाने
  rationale: संदर्भ में इसका अर्थ प्राप्त करना या उसमें भाग पाना है। ‘पाने’ साधारण आधुनिक हिन्दी में स्वाभाविक है और ‘उस युग’ तथा पुनरुत्थान—दोनों के साथ उपयुक्त बैठता है।
- source_word: ἀναστάσεως τῆς ἐκ νεκρῶν
  choice: मरे हुओं में से जी उठने
  rationale: यह वाक्यांश ἐκ νεκρῶν का ‘मरे हुओं में से’ अर्थ बनाए रखता है और ‘पुनरुत्थान’ की अपेक्षा आम पाठक के लिए अधिक सहज है।
- source_word: γαμοῦσιν
  choice: विवाह करते हैं
  rationale: यह क्रिया के सामान्य अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: γαμίζονται
  choice: उनका विवाह कराया जाता है
  rationale: यह पहली क्रिया से भिन्न कर्मवाच्य सामाजिक अभिव्यक्ति को सुरक्षित रखता है और आधुनिक हिन्दी में ‘विवाह में दिए जाते हैं’ की तुलना में अधिक स्वाभाविक है।
theological_decisions:
- issue: क्या καταξιωθέντες अपने पुण्य से पुनरुत्थान का जीवन अर्जित करने का संकेत देता है
  choice: योग्य ठहराए जाते हैं
  alternative: जो उस युग के योग्य हैं
  rationale: चुना हुआ अनुवाद किसी के द्वारा किए गए मूल्यांकन का कर्मवाच्य भाव बनाए रखता है, पर मूल्यांकनकर्ता या योग्यता के आधार को पाठ में जोड़ता नहीं। इस प्रकार न तो मानवीय अर्जन का सिद्धान्त आरोपित होता है, न यूनानी की वास्तविक धार्मिक कसावट मिटती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। ‘मरे हुओं में से जी उठना’ आम पाठकों के लिए स्पष्ट है, जबकि ‘योग्य ठहराए जाते हैं’ मूल के कर्मवाच्य और धार्मिक तनाव को सुरक्षित रखता है।
