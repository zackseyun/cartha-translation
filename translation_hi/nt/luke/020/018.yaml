  yaml_path: translation/nt/luke/020/018.yaml
  text: Everyone who falls on that stone will be broken to pieces[a], but the one on whom it falls[b], it will crush him.
translation:
  language: hi
  text: जो कोई उस पत्थर पर गिरेगा, वह चकनाचूर हो जाएगा[a]; पर वह पत्थर जिस किसी पर गिरेगा, उसे पीस डालेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “टुकड़े-टुकड़े हो जाएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसे धूल में मिला देगा” अथवा “उसे भूसी के समान बिखेर देगा”; यूनानी क्रिया केवल टक्कर लगने से अधिक प्रबल अर्थ रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὁ πεσὼν
  choice: जो कोई ... गिरेगा
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत सामान्य और व्यापक अर्थ देता है। ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है और प्रत्येक व्यक्ति को समेटता है।
- source_word: ἐπ’ ἐκεῖνον τὸν λίθον
  choice: उस पत्थर पर
  rationale: ἐπί और कर्मकारक यहाँ पत्थर पर गिरने की दिशा बताते हैं; ‘उस’ से यूनानी संकेतवाचक ἐκεῖνον का बल बना रहता है।
- source_word: συνθλασθήσεται
  choice: चकनाचूर हो जाएगा
  rationale: भविष्यत् कर्मवाच्य रूप टूटकर टुकड़े-टुकड़े हो जाने का गंभीर परिणाम व्यक्त करता है। ‘चकनाचूर’ इस तीव्रता को सहज और स्पष्ट हिन्दी में रखता है।
- source_word: ἐφ’ ὃν δ’ ἂν πέσῃ
  choice: पर वह पत्थर जिस किसी पर गिरेगा
  rationale: ἄν के साथ संभावनार्थक संबंधवाचक उपवाक्य अनिश्चित व्यक्ति, अर्थात ‘जिस किसी पर’, को सूचित करता है। स्पष्टता के लिए निहित कर्ता ‘वह पत्थर’ दोहराया गया है।
- source_word: λικμήσει
  choice: पीस डालेगा
  rationale: λικμάω कुचलकर या ओसाकर बिखेर देने का प्रबल चित्र दे सकता है। ‘पीस डालेगा’ साधारण टक्कर से अधिक विनाशकारी अर्थ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: αὐτόν
  choice: उसे
  rationale: एकवचन सर्वनाम सामान्य रूप से उस व्यक्ति की ओर संकेत करता है जिस पर पत्थर गिरता है। हिन्दी का ‘उसे’ लिंग को अनावश्यक रूप से उभारे बिना मूल के एकवचन संदर्भ को बनाए रखता है।
theological_decisions:
- issue: पत्थर द्वारा न्याय का विनाशकारी चित्र
  choice: पत्थर को निर्णायक और विनाशकारी क्रिया करने वाले के रूप में बनाए रखा गया है।
  alternative: इसे केवल ठोकर लगने या मामूली चोट का चित्र मानकर हल्का करना।
  rationale: संदर्भ में पत्थर न्याय का रूपक है, और συνθλασθήσεται तथा λικμήσει दोनों तीव्र विनाश व्यक्त करते हैं। अनुवाद इस बल को बनाए रखता है, पर पद से बाहर कोई अतिरिक्त पहचान या व्याख्या नहीं जोड़ता।
- issue: दूसरे उपवाक्य में सामान्य एकवचन व्यक्ति
  choice: ‘जिस किसी’ और ‘उसे’ का प्रयोग।
  alternative: बहुवचन ‘जिन लोगों’ और ‘उन्हें’ का प्रयोग।
  rationale: मूल पाठ अनिश्चित किंतु एकवचन संबंधवाचक रूप और एकवचन सर्वनाम रखता है। हिन्दी में ‘जिस किसी ... उसे’ उसी सामान्य एकवचन संरचना को स्वाभाविक रूप से सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चकनाचूर’ और ‘पीस डालेगा’ न्याय के चित्र की तीव्रता बनाए रखते हैं; वैकल्पिक अर्थ पादटिप्पणियों में दिए गए हैं।
