id: LUK.20.21
reference: Luke 20:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐπηρώτησαν αὐτὸν λέγοντες· Διδάσκαλε, οἴδαμεν ὅτι ὀρθῶς λέγεις καὶ διδάσκεις καὶ οὐ λαμβάνεις πρόσωπον, ἀλλ’ ἐπ’ ἀληθείας τὴν ὁδὸν τοῦ θεοῦ διδάσκεις·
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/021.yaml
  text: And they questioned him[a], saying, “Teacher, we know that you speak and teach rightly, and you do not show partiality[b], but truly teach the way of God.”
translation:
  language: hi
  text: और उन्होंने उनसे पूछा, “गुरु, हम जानते हैं कि आप सही कहते और सिखाते हैं और किसी का पक्ष नहीं लेते,[a] बल्कि सच्चाई से परमेश्वर का मार्ग सिखाते हैं।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “चेहरा ग्रहण नहीं करते”; यह किसी की हैसियत या बाहरी पहचान से प्रभावित होकर पक्षपात करने के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “सत्य में परमेश्वर का मार्ग सिखाते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπηρώτησαν
  choice: पूछा
  rationale: क्रिया का मूल अर्थ पूछना या प्रश्न करना है। प्रसंग में प्रश्न परीक्षा लेने के उद्देश्य से है, पर क्रिया स्वयं शत्रुतापूर्ण ‘जिरह’ को अनिवार्य नहीं बनाती।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में यह आधुनिक हिन्दी में शिक्षक और मान्य धार्मिक उपदेशक—दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὀρθῶς
  choice: सही
  rationale: यह कथन और शिक्षा की शुद्धता को सरल, वर्तमान हिन्दी में व्यक्त करता है; ‘उचित रीति से’ अपेक्षाकृत कृत्रिम होता।
- source_word: λέγεις καὶ διδάσκεις
  choice: कहते और सिखाते हैं
  rationale: दोनों यूनानी क्रियाओं को अलग रखते हुए हिन्दी में उनके अलंकारिक दोहराव को सुरक्षित रखा गया है।
- source_word: οὐ λαμβάνεις πρόσωπον
  choice: किसी का पक्ष नहीं लेते
  rationale: शाब्दिक रूप से ‘चेहरा ग्रहण नहीं करते’ एक मुहावरा है, जिसका आशय पद, प्रतिष्ठा या बाहरी पहचान के कारण पक्षपात न करना है। हिन्दी का चुना हुआ मुहावरा अर्थ को स्पष्ट रखता है।
- source_word: ἐπ’ ἀληθείας
  choice: सच्चाई से
  rationale: यह शिक्षा देने की रीति को सत्य के अनुरूप बताता है और अगले पदबंध के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: τὴν ὁδὸν τοῦ θεοῦ
  choice: परमेश्वर का मार्ग
  rationale: ‘मार्ग’ मूल रूपक और उसके नैतिक-धार्मिक अर्थ—परमेश्वर की इच्छा के अनुसार जीवन—दोनों को बनाए रखता है।
theological_decisions:
- issue: निष्पक्षता का मुहावरा
  choice: किसी का पक्ष नहीं लेते
  alternative: चेहरा देखकर व्यवहार नहीं करते
  rationale: मूल मुहावरे को शब्दशः रखने से हिन्दी में अर्थ अस्पष्ट होता। चुना हुआ पाठ सामाजिक प्रतिष्ठा से अप्रभावित निष्पक्षता व्यक्त करता है, बिना यह तय किए कि ध्यान केवल बाहरी रूप पर है या व्यापक सामाजिक हैसियत पर।
- issue: ἐπ’ ἀληθείας का सम्बन्ध
  choice: सच्चाई से परमेश्वर का मार्ग सिखाते हैं
  alternative: सत्य में परमेश्वर का मार्ग सिखाते हैं
  rationale: वाक्यांश मुख्यतः सिखाने की रीति को विशेषित करता है। ‘सच्चाई से’ यही सम्बन्ध सहज हिन्दी में रखता है, जबकि ‘सत्य में’ मूल संरचना के अधिक निकट पर कम स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यीशु के लिए आदरसूचक बहुवचन का प्रयोग किया गया है। आरम्भिक καί को ‘और’ के रूप में रखा गया है ताकि कथात्मक जुड़ाव बना रहे।
