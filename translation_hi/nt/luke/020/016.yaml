source:
  edition: SBLGNT
  text: ἐλεύσεται καὶ ἀπολέσει τοὺς γεωργοὺς τούτους, καὶ δώσει τὸν ἀμπελῶνα ἄλλοις. ἀκούσαντες δὲ εἶπαν· Μὴ γένοιτο.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/016.yaml
  text: He will come and destroy these tenant farmers[a], and will give the vineyard to others.” But when they heard this, they said[b], “May it never be!”
translation:
  language: hi
  text: “वह आएगा और इन काश्तकारों[a] का नाश कर देगा और अंगूर का बाग दूसरों को दे देगा।” यह सुनकर उन्होंने कहा, “ऐसा कभी न हो!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसानों” अथवा “पट्टेदार किसानों”; यूनानी शब्द यहाँ उन लोगों के लिए है जो किसी दूसरे की भूमि पर खेती करते थे।
    reason: lexical_alternative
  - marker: b
    text: या “कदापि नहीं!” अथवा “हरगिज़ नहीं!” यूनानी अभिव्यक्ति तीव्र अस्वीकृति प्रकट करती है; इसका शाब्दिक भाव है, “ऐसा न हो।”
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεύσεται
  choice: वह आएगा
  rationale: भविष्यकाल का सीधा और स्वाभाविक अनुवाद है; स्वामी के ‘लौटने’ का भाव संदर्भ में संभव है, पर यूनानी क्रिया में ‘वापस’ अलग से नहीं कहा गया।
- source_word: ἀπολέσει
  choice: नाश कर देगा
  rationale: यह ἀπόλλυμι की कठोर न्याय-संबंधी शक्ति को बनाए रखता है और केवल ‘मार डालेगा’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: γεωργοὺς
  choice: काश्तकारों
  rationale: दृष्टांत में ये अपनी भूमि पर काम करनेवाले सामान्य किसान नहीं, बल्कि किसी दूसरे के अंगूरों के बाग को लेकर उसकी खेती करनेवाले लोग हैं। ‘काश्तकार’ इस भूमिका को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: τούτους
  choice: इन
  rationale: निकटवाची संकेतवाचक का बल सुरक्षित रहता है और चर्चा में आए उन्हीं विशेष काश्तकारों की ओर संकेत करता है।
- source_word: δώσει
  choice: दे देगा
  rationale: δίδωμι का सरल अर्थ बनाए रखता है; प्रबंधन सौंपने या हस्तांतरण का भाव संदर्भ से समझ आता है, उसे पाठ में अतिरिक्त रूप से नहीं जोड़ा गया।
- source_word: τὸν ἀμπελῶνα
  choice: अंगूरों का बाग
  rationale: आधुनिक सामान्य हिन्दी में यह स्पष्ट और सहज है तथा दृष्टांत की कृषि-संबंधी छवि को बनाए रखता है।
- source_word: ἄλλοις
  choice: दूसरों को
  rationale: यूनानी की तरह नए प्राप्तकर्ताओं की पहचान को अनिर्दिष्ट रखता है।
- source_word: ἀκούσαντες
  choice: यह सुनकर
  rationale: कालसूचक कृदंत को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है और घटनाक्रम का क्रम सुरक्षित रखता है।
- source_word: Μὴ γένοιτο
  choice: ऐसा कभी न हो!
  rationale: यह प्रबल, भावात्मक अस्वीकृति और इच्छा-सदृश optative अभिव्यक्ति—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: श्रोताओं की प्रतिक्रिया Μὴ γένοιτο का बल
  choice: 'इच्छा-सदृश तीव्र प्रतिवाद: “ऐसा कभी न हो!”'
  alternative: “कदापि नहीं!” या “हरगिज़ नहीं!”
  rationale: यहाँ प्रतिक्रिया केवल किसी कथन का तार्किक खंडन नहीं, घोषित परिणाम के प्रति स्तब्ध और भावात्मक अस्वीकृति है। चुना गया रूप यूनानी optative की ‘ऐसा घटित न हो’ वाली छाया को सुरक्षित रखता है।
- issue: अंगूरों का बाग ‘दूसरों को’ दिए जाने वालों की पहचान
  choice: ‘दूसरों’ को अनिर्दिष्ट रखा गया
  alternative: किसी विशेष समुदाय या समूह की व्याख्यात्मक पहचान जोड़ना
  rationale: ἄλλοις स्वयं प्राप्तकर्ताओं की पहचान नहीं बताता; इसलिए पाठ में कोई सांप्रदायिक या धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘दाख की बारी’ की अपेक्षा ‘अंगूरों का बाग’ सामान्य पाठक के लिए अधिक सहज है। ‘काश्तकार’ के सामाजिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
