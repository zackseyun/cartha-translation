source:
  edition: SBLGNT
  text: ⸀Δείξατέ μοι δηνάριον· τίνος ἔχει εἰκόνα καὶ ἐπιγραφήν; ⸀ἀποκριθέντες δὲ εἶπαν· Καίσαρος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/024.yaml
  text: Show me a denarius. Whose image and inscription does it have? And they answered[a], 'Caesar's.'
translation:
  language: hi
  text: “मुझे एक दीनार[a] दिखाओ। इस पर किसकी छवि और किसका लेख है?” उन्होंने उत्तर दिया, “कैसर का।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार उस समय प्रचलित एक रोमी सिक्का था। ऐतिहासिक परिवेश बनाए रखने के लिए सिक्के का नाम ज्यों का त्यों रखा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: Δείξατέ μοι
  choice: मुझे ... दिखाओ
  rationale: प्रत्यक्ष आज्ञा का बल रखते हुए यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: δηνάριον
  choice: एक दीनार
  rationale: सिक्के के ऐतिहासिक नाम को बनाए रखने से रोमी काल की विशिष्ट पृष्ठभूमि सुरक्षित रहती है; पाठक की सहायता के लिए पाद-टिप्पणी दी गई है।
- source_word: τίνος
  choice: किसकी ... किसका
  rationale: यूनानी में एक ही संबंधवाचक प्रश्न दोनों संज्ञाओं से जुड़ता है; हिन्दी में ‘छवि’ और ‘लेख’ के भिन्न लिंग के कारण प्रश्नवाचक रूप को दोहराना अधिक स्वाभाविक है।
- source_word: εἰκόνα
  choice: छवि
  rationale: यह सिक्के पर अंकित प्रतिरूप के लिए सटीक, गरिमापूर्ण और पर्याप्त रूप से व्यापक शब्द है।
- source_word: ἐπιγραφήν
  choice: लेख
  rationale: सिक्के पर अंकित लिखित सामग्री को संक्षिप्त और सहज हिन्दी में व्यक्त करता है; ‘अभिलेख’ की अपेक्षा सामान्य पाठक के लिए अधिक सुलभ है।
- source_word: ἀποκριθέντες δὲ εἶπαν
  choice: उन्होंने उत्तर दिया
  rationale: कृदंत और मुख्य क्रिया के यूनानी संयोजन को स्वाभाविक हिन्दी कथन में व्यक्त करता है, बिना अर्थ खोए।
- source_word: Καίσαρος
  choice: कैसर का
  rationale: यूनानी के संक्षिप्त संबंधकारक उत्तर को हिन्दी में उसी संक्षिप्तता से रखा गया है। ‘कैसर’ उस समय के रोमी सम्राट की उपाधि/नाम का पारंपरिक बाइबलीय रूप है।
