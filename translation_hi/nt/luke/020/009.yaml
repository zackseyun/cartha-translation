  register: आधुनिक मानक हिन्दी; वाक्य सरल, मौखिक कथा के अनुकूल और गरिमापूर्ण रखा गया है। ‘दृष्टान्त’, ‘अंगूर का बाग’ और ‘पट्टे पर’ जैसे शब्द सामान्य पाठक के लिए स्पष्ट हैं।
