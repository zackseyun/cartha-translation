base_translation:
  language: en
  yaml_path: translation/nt/luke/020/009.yaml
  text: 'Then he began to tell the people this parable: “A man planted a vineyard[a], and leased it to farmers, and went away for a considerable time.”'
translation:
  language: hi
  text: 'तब वह लोगों को यह दृष्टान्त सुनाने लगा: “एक आदमी ने अंगूर का बाग लगाया, उसे किसानों को पट्टे पर दे दिया और बहुत समय के लिए चला गया[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत समय के लिए दूसरे देश चला गया।” यूनानी क्रिया का अर्थ अपने घर या क्षेत्र से दूर जाना भी हो सकता है, जिसमें विदेश जाना शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἤρξατο δὲ
  choice: तब वह … लगा
  rationale: δέ कथा को आगे बढ़ाता है, और ἤρξατο के आरम्भसूचक भाव को स्वाभाविक हिन्दी की ‘लगा’ संरचना व्यक्त करती है।
- source_word: πρὸς τὸν λαὸν λέγειν τὴν παραβολὴν ταύτην
  choice: लोगों को यह दृष्टान्त सुनाने
  rationale: πρός के साथ यह श्रोताओं की ओर सम्बोधन है; παραβολή के लिए स्थापित और गरिमापूर्ण हिन्दी शब्द ‘दृष्टान्त’ रखा गया है।
- source_word: Ἄνθρωπος
  choice: एक मनुष्य
  rationale: कथा में एक विशिष्ट पुरुष पात्र का परिचय है; ‘मनुष्य’ स्रोत के अर्थ को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ἐφύτευσεν ἀμπελῶνα
  choice: अंगूर का बाग लगाया
  rationale: φυτεύω का मूल भाव ‘लगाना/रोपना’ है और ἀμπελών के लिए ‘अंगूर का बाग’ सामान्य पाठकों के लिए स्पष्ट है।
- source_word: ἐξέδετο αὐτὸν γεωργοῖς
  choice: उसे किसानों को पट्टे पर दे दिया
  rationale: ἐκδίδωμι यहाँ संपत्ति पट्टे पर देने को दर्शाता है; γεωργοί का सीधा अर्थ खेती करने वाले ‘किसान’ है।
- source_word: ἀπεδήμησεν
  choice: परदेश चला गया
  rationale: ἀποδημέω अपने गृह-क्षेत्र से दूर जाने या बाहर रहने का भाव रखता है; ‘परदेश चला गया’ उस भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: χρόνους ἱκανούς
  choice: बहुत समय के लिए
  rationale: बहुवचन χρόνους के साथ ἱκανούς पर्याप्त या लंबी अवधि सूचित करता है; हिन्दी में ‘बहुत समय के लिए’ सहज है।
theological_decisions:
- issue: Ἄνθρωπος में पात्र का लिंग
  choice: एक मनुष्य
  alternative: एक व्यक्ति
  rationale: स्रोत का पुल्लिंग एक विशिष्ट पुरुष भूस्वामी को प्रस्तुत करता है; इसे लिंग-निरपेक्ष करने की आवश्यकता नहीं है।
- issue: ἀπεδήμησεν में दूरी का स्वरूप
  choice: परदेश चला गया
  alternative: दूर चला गया
  rationale: क्रिया गृह-प्रदेश से बाहर जाने का भाव दे सकती है, पर किसी निश्चित विदेशी देश का उल्लेख नहीं करती; ‘परदेश’ इस तनाव को बनाए रखता है।
