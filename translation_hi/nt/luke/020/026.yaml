  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मुख्य पाठ में मूल के ‘पकड़ने’ वाले बिंब को रखा गया है, जबकि पादटिप्पणी उसका स्वाभाविक प्रसंगानुकूल अर्थ देती है।
