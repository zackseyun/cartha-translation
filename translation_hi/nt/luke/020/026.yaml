base_translation:
  language: en
  yaml_path: translation/nt/luke/020/026.yaml
  text: And they were not able to seize on his statement before the people[a], and marveling at his answer, they became silent.
translation:
  language: hi
  text: वे जनता के सामने उसकी बात को पकड़कर उसे फँसा न सके[a]। उसके उत्तर पर चकित होकर वे चुप हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उसकी बात को पकड़ न सके।
    reason: यूनानी अभिव्यक्ति का अधिक शाब्दिक विकल्प; प्रसंग में आशय उसके कथन के आधार पर उसे फँसाना है।
lexical_decisions:
- source_word: ἴσχυσαν
  choice: सके
  rationale: सामर्थ्य या क्षमता के अभाव को आधुनिक और स्वाभाविक हिन्दी में संक्षेप से व्यक्त करता है।
- source_word: ἐπιλαβέσθαι
  choice: पकड़ न सके
  rationale: मूल क्रिया के ‘पकड़ने/थामने’ के बिंब को बनाए रखता है और इस प्रसंग में किसी के कथन को उसके विरुद्ध इस्तेमाल करने का भाव देता है।
- source_word: τοῦ ῥήματος
  choice: उसकी कही बात
  rationale: यहाँ ῥῆμα बोले गए कथन को सूचित करता है; ‘उसकी’ प्रसंग से स्पष्ट यीशु की ओर संकेत करता है और हिन्दी में स्वाभाविक है।
- source_word: ἐναντίον τοῦ λαοῦ
  choice: लोगों के सामने
  rationale: ἐναντίον का ‘सामने/उपस्थिति में’ और λαός का सार्वजनिक जनसमुदाय वाला अर्थ सीधे व्यक्त करता है।
- source_word: θαυμάσαντες
  choice: चकित होकर
  rationale: उत्तर के कारण हुए आश्चर्य को सहभागी क्रिया की स्वाभाविक हिन्दी संरचना में रखता है।
- source_word: ἀποκρίσει
  choice: उत्तर
  rationale: विवाद और प्रश्नोत्तर के प्रसंग में सीधा तथा सामान्य हिन्दी पर्याय है।
- source_word: ἐσίγησαν
  choice: चुप हो गए
  rationale: सिर्फ मौन रहने की स्थिति नहीं, बल्कि उत्तर सुनकर मौन हो जाने के परिणामी परिवर्तन को व्यक्त करता है।
