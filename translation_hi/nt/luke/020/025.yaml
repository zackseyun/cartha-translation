base_translation:
  language: en
  yaml_path: translation/nt/luke/020/025.yaml
  text: But he said to them[a], “Then give back to Caesar the things that are Caesar’s, and to God the things that are God’s.”
translation:
  language: hi
  text: पर उसने उनसे कहा, “तो जो कैसर का है, उसे कैसर को लौटा दो, और जो परमेश्वर का है, उसे परमेश्वर को लौटा दो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कैसर को वह दे दो जो उसका देय है … और परमेश्वर को वह दे दो जो उसका देय है।” इस क्रिया का अर्थ देना, चुकाना, या जो देय है उसे लौटा देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ εἶπεν πρὸς αὐτούς
  choice: पर उसने उनसे कहा
  rationale: δέ यहाँ हल्का विरोध या वार्तालाप की अगली कड़ी दर्शाता है; संदर्भ में ‘पर’ स्वाभाविक है। πρὸς αὐτούς को λέγω के साथ मुहावरेदार रूप में ‘उनसे’ किया गया है।
- source_word: Τοίνυν
  choice: तो
  rationale: यह पिछले उत्तर से निकला निष्कर्ष प्रस्तुत करता है; आधुनिक हिन्दी में ‘तो’ संक्षिप्त और स्वाभाविक ढंग से वही तर्कसूचक बल रखता है।
- source_word: ἀπόδοτε
  choice: लौटा दो
  rationale: क्रिया का अर्थ वह देना, चुकाना या वापस करना हो सकता है जो किसी का है या उसे देय है। ‘लौटा दो’ इस प्रत्यर्पण/देयता के भाव को स्पष्ट रखता है।
- source_word: τὰ Καίσαρος Καίσαρι
  choice: जो कैसर का है, वह कैसर को
  rationale: यह यूनानी के व्यापक अर्थ और समानांतर वाक्य-रचना को बनाए रखता है तथा कथन को केवल कर चुकाने तक सीमित नहीं करता।
- source_word: Καίσαρος / Καίσαρι
  choice: कैसर
  rationale: Καῖσαρ रोमी शासक की उपाधि/नाम है; लिप्यंतरण मूल अभिव्यक्ति को ‘सम्राट’ जैसी व्याख्यात्मक सामान्य संज्ञा से अधिक निकटता से सुरक्षित रखता है।
- source_word: τὰ τοῦ θεοῦ τῷ θεῷ
  choice: जो परमेश्वर का है, वह परमेश्वर को
  rationale: यह कैसर वाले खंड के साथ मूल का संतुलित समानांतर बनाए रखता है और परमेश्वर के अधिकार की सीमा को अनावश्यक रूप से परिभाषित नहीं करता।
- source_word: θεοῦ / θεῷ
  choice: परमेश्वर
  rationale: संदर्भ में यह इस्राएल के एकमात्र परमेश्वर को सूचित करता है; आधुनिक हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित है।
theological_decisions:
- issue: नागरिक सत्ता और परमेश्वर के प्रति दायित्वों का दायरा
  choice: अनुवाद दोनों के प्रति देय बात देने का समानांतर कथन सुरक्षित रखता है, पर दोनों क्षेत्रों की सटीक सीमाएँ निर्धारित नहीं करता।
  alternative: इसे केवल कर चुकाने की आज्ञा, धर्म और राज्य के कठोर पृथक्करण, या राज्य के असीम अधिकार की स्वीकृति के रूप में स्पष्ट करना।
  rationale: यूनानी पाठ व्यापक सिद्धांत कहता है, लेकिन पूर्ण राजनीतिक धर्मशास्त्र नहीं गढ़ता। अतः मूल की व्यापकता और धर्मवैचारिक तनाव को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जो … का है, वह … को’ मूल के संतुलित समानांतर को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में पादटिप्पणी चिह्न [a] जोड़ा गया है।
