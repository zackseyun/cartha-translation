lexical_decisions:
- source_word: ἀποκριθέντες
  choice: उत्तर दिया
  rationale: ἀποκρίνομαι का कृदन्त यहाँ पहले कही गई बात के प्रत्युत्तर में वचन आरम्भ कराता है; स्वाभाविक हिन्दी में इसे सीमित क्रिया के रूप में रखना उचित है।
- source_word: δέ
  choice: तब
  rationale: δέ हल्के कथानक-संक्रमण को सूचित करता है; पिछले संवाद के बाद ‘तब’ प्रवाह को स्वाभाविक रखता है और प्रबल विरोध नहीं जोड़ता।
- source_word: τινες τῶν γραμματέων
  choice: शास्त्रियों में से कुछ
  rationale: τινες के साथ सम्बन्धकारक बहुवचन की अंशवाचक रचना स्पष्ट करती है कि सभी नहीं, बल्कि उस समूह में से कुछ बोले।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: सुसमाचारों के यहूदी संदर्भ में γραμματεῖς के लिए ‘शास्त्री’ प्रचलित, संक्षिप्त और उपयुक्त पद है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन रूप διδάσκαλε का अर्थ शिक्षक है; हिन्दी बाइबलीय और सामान्य धार्मिक संदर्भ में ‘गुरु’ स्वाभाविक सम्मानसूचक सम्बोधन है और यहाँ किसी अतिरिक्त अधिकार-दावे को अनिवार्य नहीं करता।
- source_word: καλῶς
  choice: ठीक
  rationale: καλῶς कथन की प्रशंसनीयता अथवा शुद्धता व्यक्त कर सकता है; ‘ठीक’ सहज हिन्दी में दोनों के बीच की व्यापक अर्थ-सीमा को पर्याप्त रूप से रखता है।
- source_word: εἶπας
  choice: आपने ... कहा
  rationale: द्वितीय पुरुष एकवचन भूतकालीन कथन को हिन्दी में आदरसूचक ‘आपने कहा’ स्वाभाविक ढंग से व्यक्त करता है।
