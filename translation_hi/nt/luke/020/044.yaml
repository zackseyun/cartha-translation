  text: David therefore calls him Lord[a], so how is he his son?
translation:
  language: hi
  text: इसलिए दाऊद उसे प्रभु कहता है; फिर वह दाऊद का पुत्र[a] कैसे है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दाऊद का वंशज।’ यूनानी में शाब्दिक रूप से ‘दाऊद का पुत्र’ है; यहाँ ‘पुत्र’ का अर्थ राजवंशीय वंशज भी हो सकता है, पर मुख्य पाठ तर्क की स्पष्ट शब्दावली को बनाए रखता है।
