lexical_decisions:
- source_word: Δαυὶδ
  choice: दाऊद
  rationale: बाइबिलीय नाम का हिन्दी में प्रचलित और मानक रूप।
- source_word: οὖν
  choice: इसलिए
  rationale: यह शब्द पिछले उद्धरण से निकले निष्कर्ष को सूचित करता है; ‘इसलिए’ उसके तार्किक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: αὐτὸν κύριον
  choice: उसे ‘प्रभु’
  rationale: κύριος का मूल अर्थ और इस मसीही तर्क में सम्मान तथा श्रेष्ठता का भाव ‘प्रभु’ से सुरक्षित रहता है। उद्धरण-चिह्न बताते हैं कि दाऊद उसे इस पदवी से पुकारता है।
- source_word: καλεῖ
  choice: कहता है
  rationale: ‘उसे प्रभु कहता है’ हिन्दी में स्वाभाविक रूप से किसी को एक पदवी से संबोधित करने का अर्थ व्यक्त करता है।
- source_word: πῶς
  choice: कैसे
  rationale: रूपकात्मक प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: αὐτοῦ υἱός
  choice: उसका पुत्र
  rationale: यूनानी में स्पष्ट रूप से ‘पुत्र’ है। यह वंशज के व्यापक अर्थ में प्रयुक्त हो सकता है, पर मुख्य पाठ मूल शब्दावली और तर्क के तनाव को बनाए रखता है।
- source_word: ἐστιν
  choice: है
  rationale: वर्तमानकालीन εἰμί का सीधा हिन्दी समतुल्य।
theological_decisions:
- issue: मसीही तर्क में κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ पदवी के सम्मान, श्रेष्ठता और प्रसंगगत धर्मवैचारिक भार को सुरक्षित रखती है, बिना पद के आशय को मूल कथन से आगे बढ़ाए।
- issue: υἱός को वंशगत अर्थ में विस्तृत करना या नहीं
  choice: उसका पुत्र
  alternative: उसका वंशज
  rationale: यीशु के प्रश्न का बल स्पष्ट पुत्र-संबंधी शब्द पर टिका है। ‘वंशज’ संभावित आशय स्पष्ट करता, पर मुख्य पाठ में ऐसा करने से मूल की जानबूझकर बनी हुई वैचारिक कसावट कम हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘तो’ दूसरे खंड में प्रश्न के निष्कर्षात्मक प्रवाह को स्वाभाविक बनाता है।
