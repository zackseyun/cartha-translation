  text: θεὸς δὲ οὐκ ἔστιν νεκρῶν ἀλλὰ ζώντων, πάντες γὰρ αὐτῷ ζῶσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/038.yaml
  text: He is not God of the dead[a], but of the living, for all live to him.
translation:
  language: hi
  text: वह मरे हुओं का नहीं, बल्कि जीवितों का परमेश्वर है, क्योंकि सभी उसके लिए जीवित हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि सभी उसके सामने जीवित हैं।”
    reason: αὐτῷ का अर्थ ‘उसके लिए’ अथवा ‘उसके सामने/उसकी दृष्टि में’ समझा जा सकता है।
lexical_decisions:
- source_word: θεὸς
  choice: परमेश्वर
  rationale: यहाँ θεός यहूदी एकेश्वरवादी संदर्भ में निश्चित अर्थ रखता है; इसलिए आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण रूप ‘परमेश्वर’ है।
- source_word: δὲ
  choice: नहीं, बल्कि की वाक्य-संरचना में निहित
  rationale: δέ हल्का संक्रमण या विरोध सूचित करता है। हिन्दी में अलग से ‘परन्तु’ जोड़ने पर οὐκ ... ἀλλὰ के स्पष्ट ‘नहीं, बल्कि’ विरोध की अनावश्यक पुनरावृत्ति होती; वाक्य-संरचना ही इसका प्रवाह पर्याप्त रूप से व्यक्त करती है।
- source_word: νεκρῶν
  choice: मरे हुओं
  rationale: सम्बन्धकारक बहुवचन का संज्ञात्मक अर्थ है—‘मरे हुए लोग’; ‘मरे हुओं का परमेश्वर’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ζώντων
  choice: जीवितों
  rationale: यह संज्ञात्मक वर्तमान कृदन्त है और ‘मरे हुओं’ के साथ मूल पाठ का संक्षिप्त विरोध बनाए रखता है।
- source_word: πάντες
  choice: सभी
  rationale: यह व्यापक शब्द है। संदर्भ में पूर्वजों की ओर संकेत रहते हुए भी इसका दायरा अनावश्यक रूप से उन्हीं तक सीमित नहीं किया गया।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सम्प्रदान कारक का संक्षिप्त सम्बन्धपरक भाव बनाए रखा गया है। हिन्दी में यह मूल की अस्पष्टता को काफी हद तक रहने देता है; ‘उसके सामने’ सम्भव वैकल्पिक अर्थ है।
- source_word: ζῶσιν
  choice: जीवित हैं
  rationale: वर्तमान काल का स्वाभाविक हिन्दी रूप; इस प्रसंग में केवल गतिविधि ‘जीते हैं’ की अपेक्षा जीवित अवस्था अधिक स्पष्ट करता है।
theological_decisions:
- issue: πάντες γὰρ αὐτῷ ζῶσιν में αὐτῷ का अर्थ
  choice: क्योंकि उसके लिए सभी जीवित हैं
  alternative: क्योंकि उसके सामने सभी जीवित हैं
  rationale: सम्प्रदान कारक अर्थ की दृष्टि से संक्षिप्त और बहुअर्थी है। मुख्य पाठ परमेश्वर के साथ सम्बन्ध में जीवित होने का भाव रखता है, जबकि पादटिप्पणी ‘उसके सामने’ अर्थात उसकी दृष्टि या उपस्थिति में जीवित होने की सम्भावना दिखाती है। इस प्रकार पुनरुत्थान के विषय में यीशु के तर्क को किसी अधिक विकसित धर्मसैद्धान्तिक सूत्र में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘मरे हुओं’ और ‘जीवितों’ का समानान्तर रूप यूनानी विरोध को स्पष्ट रखता है।
