translation:
  language: hi
  text: क्या हमारे लिए कैसर को कर देना उचित है[a], या नहीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राज-कर।” यूनानी शब्द उस कर को दर्शाता है जो किसी शासक सत्ता को दिया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔξεστιν
  choice: उचित है
  rationale: यहाँ शब्द सामर्थ्य नहीं, धार्मिक या कानूनी रूप से अनुमत होने का प्रश्न उठाता है। ‘उचित’ स्वाभाविक हिन्दी में इस अनुमति-बोध को व्यक्त करता है और यह तय नहीं करता कि किस व्यवस्था का नियम अभिप्रेत है।
- source_word: ἡμᾶς
  choice: हमारे लिए
  rationale: ἔξεστιν के साथ प्रयुक्त कर्मकारक और infinitive की रचना हिन्दी में स्वाभाविक रूप से ‘हमारे लिए ... उचित है’ बनती है; मूल में निहित न होने के कारण ‘हम यहूदियों’ नहीं जोड़ा गया।
- source_word: Καίσαρι
  choice: कैसर को
  rationale: यह रोमी शासक का ऐतिहासिक नाम/पदवी है। ‘कैसर’ राजनीतिक और ऐतिहासिक विशिष्टता बनाए रखता है।
- source_word: φόρον
  choice: कर
  rationale: φόρος अधीन शासक सत्ता को दिए जाने वाले कर या राज-कर को दर्शाता है। मुख्य पाठ में ‘कर’ सहज और स्पष्ट है; राजनीतिक अधीनता की छाया पादटिप्पणी में दी गई है।
- source_word: δοῦναι
  choice: देना
  rationale: δίδωμι का मूल अर्थ ‘देना’ है और हिन्दी में ‘कर देना’ स्वाभाविक प्रयोग है, जिसका अर्थ कर चुकाना है।
- source_word: ἢ οὔ
  choice: या नहीं
  rationale: विकल्पसूचक प्रश्न का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘उचित’ होने की कसौटी
  choice: प्रश्न को सामान्य अनुमति/वैधता के रूप में रखा गया है, बिना यह तय किए कि रोमी नागरिक कानून या परमेश्वर की व्यवस्था में से कौन-सी कसौटी अभिप्रेत है।
  alternative: ‘क्या रोमी कानून के अनुसार...’ अथवा ‘क्या परमेश्वर की व्यवस्था के अनुसार...’
  rationale: यूनानी पाठ कसौटी को स्पष्ट नहीं करता। प्रसंग में प्रश्न धार्मिक और राजनीतिक दोनों तनाव रखता है, इसलिए अस्पष्टता को बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘क्या हमारे लिए ... उचित है’ मूल की अनुमति-संबंधी अस्पष्टता बनाए रखता है; ‘कर देना’ सामान्य पाठक के लिए स्वाभाविक है।
