  choice: मुख्य पाठ में ‘स्वर्ग की ओर से’ बनाए रखा गया।
  alternative: परमेश्वर की ओर से
  rationale: पदबंध दैवी उद्गम या अधिकार का संकेत देता है, पर यूनानी में स्पष्ट शब्द ‘स्वर्ग’ है। मूल श्रद्धापूर्ण मुहावरे को बनाए रखने से अर्थ की व्याख्या अनावश्यक रूप से निश्चित नहीं की जाती।
