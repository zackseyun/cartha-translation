- source_word: Ἰωάννου
  choice: यूहन्ना का
  rationale: सम्बन्धकारक रूप उस बपतिस्मे को यूहन्ना से जोड़ता है; हिन्दी में ‘यूहन्ना का’ स्वाभाविक है।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग की ओर से
  rationale: यह यूनानी के शाब्दिक ‘स्वर्ग से’ को स्वाभाविक हिन्दी में रखते हुए दैवी उद्गम या अधिकार के श्रद्धापूर्ण संकेत को सुरक्षित रखता है।
- source_word: ἐξ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: ἀνθρώπων सामान्य रूप से मानवों को सूचित करता है, केवल पुरुषों को नहीं; यह दैवी और मानवीय उद्गम अथवा अधिकार का विरोध स्पष्ट रखता है।
- source_word: ἦν
  choice: था
  rationale: यूनानी में स्रोत-सूचक पदबंधों के साथ स्पष्टतः संबंधवाचक क्रिया है; हिन्दी में ‘था’ उसी संरचना को सहजता से व्यक्त करता है।
- source_word: ἢ
  choice: या
  rationale: यह प्रश्न में दिए गए दो विकल्पों को अलग करने वाला सामान्य विकल्पवाचक संयोजक है।
