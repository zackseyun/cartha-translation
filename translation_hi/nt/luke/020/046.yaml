  text: Προσέχετε ἀπὸ τῶν γραμματέων τῶν θελόντων περιπατεῖν ἐν στολαῖς καὶ φιλούντων ἀσπασμοὺς ἐν ταῖς ἀγοραῖς καὶ πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς καὶ πρωτοκλισίας ἐν τοῖς δείπνοις,
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/046.yaml
  text: Beware of the scribes[a], who want to walk around in long robes, and who love greetings in the marketplaces and the best seats in the synagogues and places of honor at banquets[d][c][b],
translation:
  language: hi
  text: शास्त्रियों से सावधान रहो[a], जो लंबे वस्त्रों में[b] घूमना चाहते हैं और बाज़ारों में अभिवादन, आराधनालयों में प्रमुख आसन[c], और भोजों में सम्मान के स्थान[d] पसंद करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शास्त्रियों से सचेत रहो।”
    reason: lexical_alternative
  - marker: b
    text: “लंबे वस्त्र” ऐसे विशिष्ट वस्त्र थे जिनसे प्रतिष्ठा और ऊँचा सामाजिक दर्जा प्रदर्शित होता था।
    reason: cultural_note
  - marker: c
    text: या, “सबसे प्रतिष्ठित आसन।”
    reason: lexical_alternative
  - marker: d
    text: या, “सबसे प्रमुख स्थान।” प्राचीन भोजों में बैठने या लेटकर खाने के कुछ स्थान विशेष सम्मान के माने जाते थे।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: Προσέχετε ἀπὸ
  choice: से सावधान रहो
  rationale: यह बहुवचन आज्ञार्थक चेतावनी है। προσέχω के साथ ἀπό उस व्यक्ति या समूह को बताता है जिससे सचेत रहना है; आधुनिक हिन्दी में ‘से सावधान रहो’ स्वाभाविक और प्रभावपूर्ण है।
- source_word: γραμματέων
  choice: शास्त्रियों
  rationale: सुसमाचारों के यहूदी संदर्भ में यह धर्मशास्त्र और व्यवस्था के विद्वान व्याख्याकारों के लिए प्रचलित संक्षिप्त पद है; ‘व्यवस्था के शिक्षक’ अर्थ को कुछ अधिक व्याख्यायित कर देता।
- source_word: τῶν θελόντων περιπατεῖν
  choice: वे ... पहनकर घूमना चाहते हैं
  rationale: θέλω उनकी इच्छा या रुचि को और περιπατέω सार्वजनिक रूप से घूमने को व्यक्त करता है। वाक्य को हिन्दी में स्पष्ट बनाने के लिए सम्बन्धवाचक कृदन्त को नए वाक्य में खोला गया है।
- source_word: ἐν στολαῖς
  choice: लम्बे चोगे पहनकर
  rationale: στολή लम्बे, विशिष्ट और प्रतिष्ठा दर्शाने वाले बाहरी वस्त्र का संकेत दे सकता है। ‘चोगे’ वस्त्र के प्रकार को साधारण पाठक के लिए मूर्त बनाता है।
- source_word: φιλούντων
  choice: पाना पसन्द करते हैं
  rationale: यहाँ ‘प्रेम करना’ सम्मानसूचक अभिवादन और प्रतिष्ठित स्थानों के प्रति प्रबल लगाव का मुहावरेदार वर्णन है। हिन्दी में ‘पाना पसन्द करते हैं’ लक्ष्य-भाषा में स्वाभाविक है और तीनों कर्मों पर लागू होता है।
- source_word: ἀσπασμοὺς ἐν ταῖς ἀγοραῖς
  choice: बाज़ारों में सम्मानपूर्वक अभिवादन पाना
  rationale: ἀσπασμός सार्वजनिक अभिवादन है; प्रसंग में वह सामाजिक मान्यता और आदर से जुड़ा है। ‘सम्मानपूर्वक’ उस प्रसंगगत भाव को स्पष्ट करता है, जबकि ‘बाज़ार’ सार्वजनिक बाजार-क्षेत्र को सहज हिन्दी में व्यक्त करता है।
- source_word: πρωτοκαθεδρίας ἐν ταῖς συναγωγαῖς
  choice: यहूदी आराधनालयों में प्रमुख आसन
  rationale: πρωτοκαθεδρία सबसे प्रतिष्ठित या मुख्य आसन को दर्शाता है। ‘यहूदी आराधनालय’ συναγωγή का सांस्कृतिक आशय सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: πρωτοκλισίας ἐν τοῖς δείπνοις
  choice: भोजों में सम्मान के स्थान
  rationale: πρωτοκλισία प्राचीन भोज में सबसे प्रतिष्ठित बैठने या लेटकर खाने के स्थान को दर्शाता है। ‘सम्मान के स्थान’ उसके सामाजिक कार्य को समझने योग्य ढंग से व्यक्त करता है, बिना प्राचीन भोजन-मुद्रा को मुख्य पाठ में थोपे।
theological_decisions:
- issue: शास्त्रियों पर सामाजिक-धार्मिक आलोचना का दायरा
  choice: चेतावनी को उन शास्त्रियों के वर्णित आडम्बर और सम्मान-लालसा से जोड़ा गया है।
  alternative: इसे प्रत्येक शास्त्री की बिना अपवाद सम्पूर्ण निन्दा, या केवल उनके वस्त्रों की आलोचना मानना।
  rationale: यूनानी पाठ ‘शास्त्रियों’ के बाद उनकी इच्छाओं और सम्मान-प्रिय व्यवहारों का वर्णन करता है। अनुवाद चेतावनी की तीक्ष्णता बनाए रखता है, पर पाठ से आगे बढ़कर हर व्यक्ति के विषय में सार्वभौमिक doctrinal निष्कर्ष नहीं जोड़ता।
- issue: φιλούντων की नैतिक तीव्रता
  choice: ‘पाना पसन्द करते हैं’ के द्वारा सम्मान की चाह को व्यवहारगत लगाव के रूप में व्यक्त किया गया है।
  alternative: ‘प्रेम करते हैं’ का शब्दशः रूप, जो हिन्दी में अभिवादन और आसनों के साथ अस्वाभाविक लग सकता है।
  rationale: मूल का नैतिक आलोचनात्मक भाव बनाए रखते हुए आधुनिक हिन्दी की स्वाभाविक अभिव्यक्ति चुनी गई है; इसे किसी विशिष्ट सम्प्रदायगत शिक्षा में विस्तृत नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘शास्त्री’ जैसे स्थापित बाइबलीय पद को बनाए रखते हुए ‘यहूदी आराधनालय’ से सांस्कृतिक संदर्भ स्पष्ट किया गया है। यूनानी के लम्बे कृदन्तीय वाक्य को सहज हिन्दी के लिए दो वाक्यों में बाँटा गया, पर चेतावनी और उसके बाद दिए गए तीन समानान्तर सम्मान-लोलुप व्यवहार सुरक्षित रखे गए हैं।
