  yaml_path: translation/nt/luke/020/043.yaml
  text: until I make your enemies a footstool for your feet[a].
translation:
  language: hi
  text: जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों की चौकी न बना दूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: ‘जब तक कि मैं तुम्हारे शत्रुओं को तुम्हारे पाँवों की चौकी के रूप में रख न दूँ।’'
    reason: मूल यूनानी में क्रिया का मूल अर्थ ‘रखना’ है और पदबंध शाब्दिक रूप से ‘तुम्हारे पाँवों की चौकी’ है; मुख्य पाठ में अधिक स्वाभाविक परिणामसूचक हिन्दी दी गई है।
lexical_decisions:
- source_word: ἕως ἂν
  choice: जब तक कि ... न
  rationale: यह यूनानी पदबंध भविष्य में होने वाली उस घटना तक की अवधि बताता है; हिन्दी में ‘जब तक कि ... न’ इसका स्वाभाविक और सटीक रूप है।
- source_word: θῶ
  choice: बना दूँ
  rationale: τίθημι का मूल अर्थ ‘रखना’ है, पर इस भजनात्मक रूपक में परिणामसूचक अर्थ है; ‘चौकी बना दूँ’ हिन्दी में स्वाभाविक रहते हुए आशय सुरक्षित रखता है।
- source_word: τοὺς ἐχθρούς σου
  choice: तुम्हारे शत्रुओं को
  rationale: यह कर्मकारक पद और संबंधवाचक सर्वनाम का सीधा अनुवाद है; शत्रुता के अर्थ को न नरम किया गया है, न बढ़ाया गया है।
- source_word: ὑποπόδιον
  choice: चौकी
  rationale: यह पाँव रखने की चौकी को दर्शाता है। साथ आए ‘पाँवों की’ से वस्तु स्पष्ट होती है और हिन्दी में अनावश्यक पुनरुक्ति से बचा जाता है।
- source_word: τῶν ποδῶν σου
  choice: तुम्हारे पाँवों की
  rationale: यह यूनानी संबंधकारक का निकट और सहज हिन्दी रूप है तथा मूल रूपक को ‘पाँवों के नीचे’ जैसी व्याख्यात्मक अभिव्यक्ति में नहीं बदलता।
theological_decisions:
- issue: भजन 110:1 में अधीनता का राजकीय-मसीही रूपक
  choice: ‘तुम्हारे शत्रुओं को तुम्हारे पाँवों की चौकी बना दूँ’ रूपक को बनाए रखा गया है।
  alternative: ‘तुम्हारे शत्रुओं को तुम्हारे पाँवों के नीचे कर दूँ’
  rationale: मूल वचन शत्रुओं की अधीनता को पाँवों की चौकी के चित्र द्वारा व्यक्त करता है। इसे सीधे ‘पराजित’ या ‘पाँवों के नीचे’ कहने से निहितार्थ स्पष्ट तो होता, पर मूल रूपक की बनावट और उसका धर्मवैचारिक तनाव घट जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रूप अपनाया गया है। ‘शत्रु’ शास्त्रीय संदर्भ के अनुकूल और सामान्यतः बोधगम्य है; ‘पाँवों की चौकी’ रूपक को स्पष्ट रखता है।
