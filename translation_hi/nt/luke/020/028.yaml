source:
  edition: SBLGNT
  text: λέγοντες· Διδάσκαλε, Μωϋσῆς ἔγραψεν ἡμῖν, ἐάν τινος ἀδελφὸς ἀποθάνῃ ἔχων γυναῖκα, καὶ οὗτος ἄτεκνος ⸀ᾖ, ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα καὶ ἐξαναστήσῃ σπέρμα τῷ ἀδελφῷ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/028.yaml
  text: saying[a], “Teacher, Moses wrote for us that if someone's brother dies having a wife, and he is childless[b], his brother should take the wife and raise up offspring for his brother.”
translation:
  language: hi
  text: उन्होंने कहा, “हे गुरु, मूसा ने हमारे लिए लिखा है कि यदि किसी का भाई पत्नी रखते हुए मर जाए[a] और निःसंतान हो, तो उसका भाई उसकी पत्नी को पत्नी के रूप में ग्रहण करे और अपने मृत भाई के लिए संतान उत्पन्न करे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पत्नी रखते हुए मर जाए”; प्रसंग में इसका अर्थ है कि उसकी मृत्यु के समय उसकी पत्नी जीवित हो।
    reason: lexical_alternative
  - marker: b
    text: '“मृत भाई के लिए संतान उत्पन्न करे” व्यवस्थाविवरण 25:5 की विधिक भाषा की प्रतिध्वनि है: संतान मृत भाई के नाम को बनाए रखने के लिए मानी जाती थी। यूनानी में शाब्दिक अभिव्यक्ति है, “उसके लिए बीज खड़ा करे।”'
    reason: cross_reference
lexical_decisions:
- source_word: Διδάσκαλε
  choice: हे गुरु
  rationale: यीशु को किए गए सीधे संबोधन के लिए यह स्वाभाविक और आदरपूर्ण आधुनिक हिन्दी है; यहाँ इसका अर्थ शिक्षक है, स्वामी नहीं।
- source_word: Μωϋσῆς ἔγραψεν ἡμῖν
  choice: मूसा ने हमारे लिए लिखा है
  rationale: ἡμῖν व्यवस्था के इस्राएल के हित और संबंध को व्यक्त करता है; ‘हमारे लिए’ इसे सीधे पत्र लिखने के अर्थ में लेने से बचाता है।
- source_word: ἐάν τινος ἀδελφὸς ἀποθάνῃ
  choice: यदि किसी का भाई … मर जाए
  rationale: यह अनिश्चित और सामान्य शर्त को सहज हिन्दी में बनाए रखता है।
- source_word: ἔχων γυναῖκα
  choice: अपने पीछे पत्नी छोड़कर
  rationale: यूनानी का रूप शाब्दिक रूप से ‘पत्नी रखते हुए’ है, पर मृत्यु के प्रसंग में हिन्दी का यह मुहावरा आशय को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: οὗτος ἄτεκνος ᾖ
  choice: और निःसंतान हो
  rationale: οὗτος उसी मृत भाई की ओर संकेत करता है; हिन्दी में कर्ता को दोहराए बिना अर्थ स्पष्ट रहता है और ἄτεκνος का अर्थ ठीक व्यक्त होता है।
- source_word: ἵνα λάβῃ ὁ ἀδελφὸς αὐτοῦ τὴν γυναῖκα
  choice: तो उसका भाई उस स्त्री को पत्नी के रूप में ग्रहण करे
  rationale: विधिक दायित्व को व्यक्त करने के लिए ‘करे’ उपयुक्त है। ‘पत्नी के रूप में’ लेना प्रसंगगत वैवाहिक अर्थ स्पष्ट करता है, बिना अनावश्यक सांस्कृतिक विस्तार के।
- source_word: ἐξαναστήσῃ σπέρμα
  choice: वंश चलाए
  rationale: यह व्यवस्थाविवरण 25:5 की विधिक अभिव्यक्ति का स्वाभाविक हिन्दी रूप है; शाब्दिक ‘बीज खड़ा करे’ आधुनिक पाठक के लिए भ्रामक होगा।
- source_word: τῷ ἀδελφῷ αὐτοῦ
  choice: अपने भाई के लिए
  rationale: सम्प्रदान कारक बताता है कि होने वाली संतान मृत भाई के नाम और हित में मानी जाएगी; ‘के लिए’ इसे संक्षेप और स्पष्ट रूप से रखता है।
theological_decisions:
- issue: देवर-विवाह संबंधी मूसा की व्यवस्था की भाषा को बिना अतिरिक्त सांस्कृतिक या साम्प्रदायिक व्याख्या के प्रस्तुत करना
  choice: “उस स्त्री को पत्नी के रूप में ग्रहण करे और अपने भाई के लिए वंश चलाए”
  alternative: “विधवा से विवाह करे और अपने भाई के लिए संतान उत्पन्न करे”
  rationale: चुना हुआ रूप विधिक आशय और बाइबलीय वंश-संबंधी मुहावरे को बनाए रखता है, जबकि ‘विधवा’ जैसे प्रसंग से निकले पर स्रोत में अनुपस्थित संज्ञात्मक विस्तार को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हे गुरु’ सम्मानपूर्ण संबोधन है; ‘ग्रहण करे’ विधिक प्रसंग की गंभीरता बनाए रखता है, और ‘वंश चलाए’ प्राचीन कानूनी मुहावरे को सहज हिन्दी में व्यक्त करता है।
