base_translation:
  language: en
  yaml_path: translation/nt/luke/020/041.yaml
  text: But he said to them[b][a], “How do they say that the Messiah is David’s son?”
translation:
  language: hi
  text: पर उसने उनसे कहा, “लोग कैसे कहते हैं कि मसीह[a] दाऊद का पुत्र[b] है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ख्रीस्त।” यूनानी उपाधि Χριστός का अर्थ “अभिषिक्त” है; यहाँ प्रसंग अपेक्षित दाऊदी उद्धारकर्ता का है।
    reason: alternative_reading
  - marker: b
    text: इसका अनुवाद “दाऊद का एक पुत्र” भी किया जा सकता है। यूनानी में शाब्दिक रूप से “दाऊद का पुत्र” है और इसमें निश्चितता या अनिश्चितता को अलग से चिह्नित नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह हल्का विरोध अथवा संवाद में नया मोड़ दिखाने वाला संयोजक है; यहाँ ‘पर’ पिछले प्रसंग से जुड़ाव और प्रश्न की चुनौती, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: πρὸς αὐτούς
  choice: उनसे
  rationale: किसी से कुछ कहने के अर्थ में यह स्वाभाविक और संक्षिप्त हिन्दी प्रयोग है।
- source_word: Πῶς
  choice: कैसे
  rationale: यह कथन के आधार या उसकी संगति पर प्रश्न उठाता है और यूनानी की खुली प्रश्नात्मकता बनाए रखता है।
- source_word: λέγουσιν
  choice: लोग कहते हैं
  rationale: यूनानी में कर्ता अनिर्दिष्ट बहुवचन है। हिन्दी में केवल ‘कहते हैं’ की अपेक्षा ‘लोग कहते हैं’ अधिक स्वाभाविक है और किसी विशेष समूह को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: τὸν χριστόν
  choice: मसीह
  rationale: यहाँ शब्द दाऊदी उद्धारकर्ता की उपाधि के रूप में प्रयुक्त है; ‘मसीह’ उसके यहूदी-मसीही संदर्भ को स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: εἶναι
  choice: है
  rationale: λέγουσιν के बाद आए infinitive को हिन्दी में स्वाभाविक परोक्ष कथन ‘कहते हैं कि … है’ के रूप में प्रस्तुत किया गया है।
- source_word: Δαυὶδ υἱόν
  choice: दाऊद का पुत्र
  rationale: यह यूनानी संबंधवाचक पदबंध का सीधा और स्वाभाविक रूप है। इससे दाऊद के वंश से संबंध का दावा बना रहता है, पर निश्चित उपाधि के रूप में उससे अधिक अर्थ नहीं जोड़ा जाता।
theological_decisions:
- issue: Χριστός का अनुवाद
  choice: मसीह
  alternative: ख्रीस्त
  rationale: प्रसंग अपेक्षित दाऊदी राजा और उद्धारकर्ता के विषय में है, इसलिए नाम-सदृश रूप की अपेक्षा उपाधि का मसीही अर्थ प्रमुख है।
- issue: दाऊदी पुत्रत्व की भाषा
  choice: दाऊद का पुत्र
  alternative: दाऊद का एक पुत्र; दाऊद का वह पुत्र
  rationale: मूल यूनानी में पदबंध अनिर्दिष्ट लेख के बिना है। ‘दाऊद का पुत्र’ हिन्दी में इस अस्पष्टता को पर्याप्त रूप से बनाए रखता है और आगे आने वाले तर्क के धर्मवैचारिक तनाव को पहले से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक संवाद के अनुकूल शैली रखी गई है। ‘लोग’ अनिर्दिष्ट बहुवचन कर्ता को स्वाभाविक बनाता है; ‘मसीह’ और ‘दाऊद का पुत्र’ परिचित धार्मिक शब्दावली रखते हुए मूल की अस्पष्टता और प्रश्न के तनाव को सुरक्षित रखते हैं।
