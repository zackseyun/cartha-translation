id: LUK.20.17
reference: Luke 20:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἐμβλέψας αὐτοῖς εἶπεν· Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο· Λίθον ὃν ἀπεδοκίμασαν οἱ οἰκοδομοῦντες, οὗτος ἐγενήθη εἰς κεφαλὴν γωνίας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/017.yaml
  text: 'But he looked at them and said[a], “What then is this that has been written: ‘The stone that the builders rejected, this one has become the head of the corner’?”'
translation:
  language: hi
  text: 'पर उसने उनकी ओर ध्यान से देखकर कहा, “तो फिर यह क्या है जो लिखा हुआ है: ‘जिस पत्थर को राजमिस्त्रियों ने ठुकरा दिया था, वही कोने का सिरा[a] बन गया’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “कोने का सिरा।” इसका अर्थ “कोने का प्रधान पत्थर” भी हो सकता है; कुछ इसे “आधारशिला” या “शिखर-पत्थर” समझते हैं।
    reason: मूल यूनानी स्थापत्य अभिव्यक्ति की व्याख्या अनिश्चित है।
lexical_decisions:
- source_word: ἐμβλέψας
  choice: उनकी ओर ध्यान से देखकर
  rationale: यह क्रिया उनकी ओर किए गए जानबूझकर और सीधे दृष्टिपात को व्यक्त करती है; ‘ध्यान से देखकर’ स्वाभाविक हिन्दी में इसकी अपेक्षाकृत प्रबलता बनाए रखता है।
- source_word: Τί οὖν ἐστιν τὸ γεγραμμένον τοῦτο
  choice: तो फिर यह जो लिखा है, उसका क्या अर्थ है
  rationale: शब्दशः संरचना हिन्दी में अस्वाभाविक होती; यह रूप यीशु के आलंकारिक प्रश्न और लिखे हुए वचन की व्याख्यात्मक चुनौती को स्वाभाविक ढंग से व्यक्त करता है। γεγραμμένον की स्थायी लिखित स्थिति ‘लिखा है’ में बनी रहती है।
- source_word: Λίθον
  choice: जिस पत्थर को
  rationale: उद्धरण एक विशिष्ट पत्थर की ओर संकेत करता है; सम्बन्धवाचक रचना हिन्दी में यूनानी वाक्यक्रम को स्पष्ट और स्वाभाविक बनाती है।
- source_word: ἀπεδοκίμασαν
  choice: ठुकरा दिया था
  rationale: क्रिया जाँचकर अनुपयुक्त मानने और अस्वीकार करने का भाव रखती है; ‘ठुकरा दिया’ सामान्य पाठक के लिए स्पष्ट और प्रभावी है।
- source_word: οἱ οἰκοδομοῦντες
  choice: राजमिस्त्रियों ने
  rationale: निर्माण के रूपक में यह हिन्दी का स्वाभाविक पद है और सामान्य ‘बनानेवालों’ की अपेक्षा पत्थर से भवन बनाने वालों को अधिक स्पष्ट करता है।
- source_word: οὗτος
  choice: वही
  rationale: यूनानी संकेतवाचक का बल ‘वही’ से स्वाभाविक हिन्दी में सुरक्षित रहता है और अनावश्यक रूप से उसे व्यक्तिवाचक नहीं बनाया जाता।
- source_word: ἐγενήθη εἰς
  choice: बन गया
  rationale: परिणामी परिवर्तन को सरल और स्वाभाविक हिन्दी में व्यक्त करता है; उद्धरण के कथात्मक भूतकाल के अनुकूल है।
- source_word: κεφαλὴν γωνίας
  choice: कोने का सिरा
  rationale: यह मूल रूपक के ‘कोने के सिर/प्रमुख भाग’ को अपेक्षाकृत पारदर्शी रखता है और आधारशिला बनाम शीर्ष-पत्थर के विवाद को मुख्य पाठ में पूरी तरह तय नहीं करता।
theological_decisions:
- issue: भजन 118:22 के उद्धरण में स्थापत्य रूपक
  choice: कोने का सिरा
  alternative: कोने का प्रधान पत्थर; कोने की आधारशिला; शिखर-पत्थर
  rationale: κεφαλὴ γωνίας की सटीक स्थापत्य पहचान विवादित है। मुख्य पाठ मूल मुहावरे के निकट रहकर उसकी अस्पष्टता बचाता है, जबकि पादटिप्पणी प्रचलित सम्भावनाएँ देती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। प्रत्यक्ष वचन में स्वाभाविक प्रश्न-विन्यास रखा गया है; स्थापत्य रूपक की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
