translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘भाई’ जैसा प्रसंग-सिद्ध शब्द मुख्य पाठ में नहीं जोड़ा गया, जबकि विवाह-संबंधी यूनानी मुहावरे का स्वाभाविक हिन्दी अर्थ मुख्य पाठ में और उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
