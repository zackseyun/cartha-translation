  yaml_path: translation/nt/luke/020/031.yaml
  text: And the third took her[a], and likewise all seven left no children and died.
translation:
  language: hi
  text: फिर तीसरे ने भी उससे विवाह किया[a]। इसी प्रकार सातों कोई संतान छोड़े बिना मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे लिया”; इस प्रसंग में यह किसी स्त्री को पत्नी के रूप में ग्रहण करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ τρίτος
  choice: तीसरे
  rationale: यूनानी में केवल ‘तीसरा’ है; प्रसंग से भाई स्पष्ट है। हिन्दी में ‘तीसरे’ कहने से यह लोप स्वाभाविक रूप से बना रहता है।
- source_word: ἔλαβεν αὐτήν
  choice: उससे विवाह किया
  rationale: इस देवर-विवाह के प्रसंग में यूनानी पदबंध का अर्थ उस स्त्री को पत्नी के रूप में ग्रहण करना है। आधुनिक हिन्दी में ‘उससे विवाह किया’ इसका स्पष्ट और स्वाभाविक अर्थ देता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: ὡσαύτως δὲ καὶ
  choice: इसी प्रकार
  rationale: यह पदबंध आगे के सभी भाइयों के साथ वही क्रम घटित होने को सूचित करता है। ‘इसी प्रकार’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: οἱ ἑπτὰ
  choice: सातों
  rationale: यह सात भाइयों के पूरे समूह को दर्शाता है। ‘सातों’ हिन्दी में समग्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οὐ κατέλιπον τέκνα
  choice: कोई संतान छोड़े बिना
  rationale: καταλείπω यहाँ मृत्यु के समय पीछे संतान न छोड़ने का भाव रखता है। यह अनुवाद उस भाव को ‘उनकी कोई संतान नहीं थी’ की अपेक्षा अधिक ठीक से बनाए रखता है।
- source_word: ἀπέθανον
  choice: मर गए
  rationale: यूनानी क्रिया मृत्यु को सीधे व्यक्त करती है; ‘मर गए’ उसका सामान्य, स्पष्ट हिन्दी रूप है।
