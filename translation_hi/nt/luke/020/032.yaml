  text: Later[a], the woman also died.
translation:
  language: hi
  text: बाद में[a] वह स्त्री भी मर गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके बाद वह स्त्री भी मर गई।’
    reason: lexical_alternative
lexical_decisions:
- source_word: ὕστερον
  choice: बाद में
  rationale: यह क्रियाविशेषण कथा-क्रम में उसके बाद का समय बताता है। ‘बाद में’ स्वाभाविक आधुनिक हिन्दी है और समय-क्रम को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ καί केवल जोड़ने वाला ‘और’ नहीं, बल्कि यह बताता है कि भाइयों की तरह स्त्री भी मरी; इसलिए ‘भी’ प्रसंगानुकूल है।
- source_word: ἡ γυνή
  choice: वह स्त्री
  rationale: γυνή का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। इस बहुविवाहिक उत्तराधिकार-विवाह प्रसंग में ‘वह स्त्री’ संदर्भित व्यक्ति को स्पष्ट रखता है और उसे किसी एक भाई की पत्नी तक सीमित नहीं करता।
- source_word: ἀπέθανεν
  choice: मर गई
  rationale: क्रिया भूतकाल में मृत्यु की सीधी सूचना देती है। ‘मर गई’ मूल यूनानी की सादगी और स्पष्टता बनाए रखता है।
