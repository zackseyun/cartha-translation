  yaml_path: translation/nt/luke/020/006.yaml
  text: But if we say, ‘From men,’ all the people will stone us, for they are convinced that John was a prophet.
translation:
  language: hi
  text: लेकिन यदि हम कहें, ‘मनुष्यों की ओर से,’ तो सारे लोग हमें पत्थर मारेंगे, क्योंकि उन्हें पूरा विश्वास है कि यूहन्ना भविष्यद्वक्ता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि यूहन्ना भविष्यद्वक्ता था।” यूनानी infinitive का निरपेक्ष काल स्वयं निर्धारित नहीं होता; वर्तमान रूप यहाँ विश्वास के समय के साथ समकालिकता का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐὰν δὲ εἴπωμεν
  choice: लेकिन यदि हम कहें
  rationale: ἐὰν के साथ aorist subjunctive एक संभावित शर्त व्यक्त करता है; δέ का विरोधसूचक बल ‘लेकिन’ से स्वाभाविक रूप में आता है।
- source_word: Ἐξ ἀνθρώπων
  choice: मनुष्यों की ओर से
  rationale: यह संक्षिप्त वाक्यांश पिछले संदर्भ में यूहन्ना के बपतिस्मे के स्रोत की ओर संकेत करता है। यह ‘मानवीय मूल का’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचते हुए समानांतर संरचना बनाए रखता है।
- source_word: ὁ λαὸς ἅπας
  choice: सारे लोग
  rationale: λαός सामूहिक रूप से लोगों को और ἅπας उनकी समग्रता को व्यक्त करता है; आधुनिक हिन्दी में ‘सारे लोग’ स्वाभाविक और स्पष्ट है।
- source_word: καταλιθάσει
  choice: पत्थरवाह करेंगे
  rationale: क्रिया का अर्थ पत्थर मारना है। ‘पत्थरवाह करेंगे’ गंभीरता को बनाए रखता है, पर स्रोत से आगे बढ़कर ‘मार डालेंगे’ नहीं जोड़ता।
- source_word: πεπεισμένος γάρ ἐστιν
  choice: क्योंकि उन्हें पूरा विश्वास है
  rationale: यूनानी में एकवचन रूप सामूहिक संज्ञा ὁ λαὸς ἅπας से मेल खाता है; हिन्दी में बहुवचन भाव के साथ ‘उन्हें’ स्वाभाविक है। पूर्ण कृदंत की दृढ़ धारणा को ‘पूरा विश्वास’ व्यक्त करता है।
- source_word: Ἰωάννην προφήτην εἶναι
  choice: कि यूहन्ना भविष्यद्वक्ता था
  rationale: Accusative-infinitive रचना हिन्दी में ‘कि’ उपवाक्य से स्वाभाविक बनती है। εἶναι स्वयं काल निर्धारित नहीं करता; कथा के प्रसंग में ‘था’ सहज है, जबकि वैकल्पिक ‘है’ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: यूहन्ना के विषय में लोगों की धारणा का काल
  choice: कि यूहन्ना भविष्यद्वक्ता था
  alternative: कि यूहन्ना भविष्यद्वक्ता है
  rationale: εἶναι infinitive स्वयं काल नहीं बताता। प्रसंगगत हिन्दी में ‘था’ स्वाभाविक है, पर ‘है’ भी सम्भव है; इसलिए वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है और यूहन्ना की स्थिति पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यूहन्ना’ और ‘भविष्यद्वक्ता’ बाइबलीय हिन्दी में परिचित रूप हैं।
