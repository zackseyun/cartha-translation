source:
  edition: SBLGNT
  text: ⸀οὐδὲ γὰρ ἀποθανεῖν ἔτι δύνανται, ἰσάγγελοι γάρ εἰσιν καὶ υἱοί ⸀εἰσιν θεοῦ τῆς ἀναστάσεως υἱοὶ ὄντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/036.yaml
  text: For they cannot die anymore[a], because they are like the angels and are sons of God[b], being sons of the resurrection.
translation:
  language: hi
  text: क्योंकि वे अब आगे मर नहीं सकते, क्योंकि वे स्वर्गदूतों के समान[a] हैं और पुनरुत्थान के पुत्र होने के नाते परमेश्वर के पुत्र[b] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्गदूतों के बराबर।”
    reason: lexical_alternative
  - marker: b
    text: यूनानी में यहाँ “परमेश्वर के पुत्र” और “पुनरुत्थान के पुत्र” हैं। पुल्लिंग बहुवचन रूप यहाँ पदवी और पहचान व्यक्त करता है; इसका आशय केवल पुरुषों तक सीमित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποθανεῖν ἔτι δύνανται
  choice: अब वे मर ही नहीं सकते
  rationale: δύνανται के साथ infinitive सामर्थ्य या संभावना व्यक्त करता है, और ἔτι का निषेध बताता है कि मृत्यु अब आगे संभव नहीं है। ‘मर ही नहीं सकते’ आधुनिक हिन्दी में इस पूर्ण असमर्थता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἰσάγγελοι
  choice: स्वर्गदूतों के समान
  rationale: यह विशेषण स्वर्गदूतों के समान या उनके बराबर होने का भाव देता है, न कि स्वयं स्वर्गदूत बन जाने का। मुख्य पाठ में ‘समान’ तुलना को स्पष्ट और स्वाभाविक रखता है।
- source_word: υἱοί ... θεοῦ
  choice: परमेश्वर के पुत्र
  rationale: यूनानी में स्पष्ट रूप से υἱοί है। ‘पुत्र’ मूल के पारिवारिक और प्रतिष्ठासूचक रूपक को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि इसका आशय केवल पुरुषों तक सीमित नहीं है।
- source_word: τῆς ἀναστάσεως υἱοὶ ὄντες
  choice: पुनरुत्थान के पुत्र होने के कारण
  rationale: यह अनुवाद ‘पुनरुत्थान के पुत्र’ रूपक को सुरक्षित रखते हुए participle ὄντες की यहाँ उपस्थित व्याख्यात्मक-कारणसूचक छाया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: γάρ ... γάρ
  choice: क्योंकि ... क्योंकि
  rationale: 'दोनों γάρ को रखना पद के दोहरे व्याख्यात्मक प्रवाह को स्पष्ट करता है: पहला पिछले कथन का कारण देता है और दूसरा अमरता का आधार समझाता है।'
theological_decisions:
- issue: अंतकालीन संदर्भ में पुत्र-संबंधी भाषा
  choice: मुख्य पाठ में ‘परमेश्वर के पुत्र’ और ‘पुनरुत्थान के पुत्र’ बनाए रखना
  alternative: ‘परमेश्वर की संतान’ और ‘पुनरुत्थान की संतान’
  rationale: मूल पाठ υἱοί को दोहराकर पदवी, संबंध और पहचान पर बल देता है। ‘पुत्र’ इस अलंकारिक पुनरावृत्ति को सुरक्षित रखता है, जबकि पादटिप्पणी बताती है कि यहाँ पुरुष-मात्र का समावेश अभिप्रेत नहीं है।
- issue: ἰσάγγελοι में तुलना का स्वरूप
  choice: ‘स्वर्गदूतों के समान’
  alternative: ‘स्वर्गदूतों के बराबर’
  rationale: ‘समान’ पुनरुत्थित लोगों और स्वर्गदूतों के बीच तुलना व्यक्त करता है, पर दोनों की पहचान को एक नहीं करता। ‘बराबर’ भी शाब्दिक रूप से संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘पुनरुत्थान के पुत्र’ जानबूझकर कुछ औपचारिक है, क्योंकि यह मूल यूनानी के विशिष्ट रूपक और उसकी पुनरावृत्ति को सुरक्षित रखता है।
