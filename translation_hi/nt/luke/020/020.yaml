source:
  edition: SBLGNT
  text: Καὶ παρατηρήσαντες ἀπέστειλαν ἐγκαθέτους ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι, ἵνα ἐπιλάβωνται αὐτοῦ λόγου, ⸀ὥστε παραδοῦναι αὐτὸν τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ τοῦ ἡγεμόνος.
base_translation:
  language: en
  yaml_path: translation/nt/luke/020/020.yaml
  text: And after watching him closely[a], they sent spies who pretended to be righteous, so that they might catch him in something he said[b], and thus hand him over to the rule and authority of the governor.
translation:
  language: hi
  text: और उस पर कड़ी नज़र रखने के बाद, उन्होंने ऐसे भेदिए भेजे जो धर्मी होने का ढोंग करते थे, ताकि वे उसकी किसी बात में उसे पकड़ सकें[a] और इस तरह उसे राज्यपाल की शासन-सत्ता और अधिकार के हवाले कर दें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसकी बात को पकड़ लें” या “उसके किसी कथन को धर लें”; आशय है उसकी कही बात के आधार पर उसे फँसाना।
    reason: lexical_alternative
  - marker: b
    text: या, “राज्यपाल की शासकीय सत्ता और अधिकार के हवाले कर दें।” दोनों पद संभवतः उसके आधिकारिक क्षेत्राधिकार और शक्ति पर बल देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: παρατηρήσαντες
  choice: उस पर कड़ी नज़र रखे हुए थे
  rationale: यह शत्रुतापूर्ण ढंग से ध्यानपूर्वक निगरानी करने का भाव व्यक्त करता है। यूनानी कृदंत मुख्य क्रिया से जुड़ी परिस्थिति अथवा पूर्ववर्ती कार्य को दर्शाता है; स्वाभाविक हिन्दी में इसे आरंभिक वाक्य के रूप में रखा गया है।
- source_word: ἐγκαθέτους
  choice: भेदिए
  rationale: यह उन लोगों को सूचित करता है जिन्हें छिपे उद्देश्य से जाल बिछाने के लिए भेजा गया था। ‘भेदिए’ आधुनिक हिन्दी में गुप्तचर और शत्रुतापूर्ण मंशा दोनों को संक्षेप में व्यक्त करता है।
- source_word: ὑποκρινομένους ἑαυτοὺς δικαίους εἶναι
  choice: जो धर्मी होने का ढोंग करते थे
  rationale: यह झूठे आत्म-प्रस्तुतीकरण को स्पष्ट करता है और δίκαιος के नैतिक-धार्मिक अर्थ को ‘धर्मी’ द्वारा सुरक्षित रखता है।
- source_word: ἵνα ἐπιλάβωνται αὐτοῦ λόγου
  choice: ताकि उसकी किसी बात को पकड़ सकें
  rationale: यह यूनानी रूपक के निकट रहते हुए बोलचाल में कही गई किसी बात को आरोप का आधार बनाने और इस प्रकार फँसाने का आशय व्यक्त करता है।
- source_word: ὥστε παραδοῦναι
  choice: और इस तरह ... हवाले कर दें
  rationale: ὥστε का परिणाम अथवा अभिप्रेत परिणाम और παραδοῦναι का न्यायिक रूप से सौंप देने का भाव सहज हिन्दी में सुरक्षित है।
- source_word: τῇ ἀρχῇ καὶ τῇ ἐξουσίᾳ
  choice: शासन और अधिकार
  rationale: 'दोनों अलग यूनानी संज्ञाओं को बनाए रखा गया है: ἀρχή शासकीय व्यवस्था या शासन और ἐξουσία वैध अधिकार अथवा सत्ता को सूचित करती है।'
- source_word: τοῦ ἡγεμόνος
  choice: राज्यपाल के
  rationale: रोमी प्रांतीय शासक के लिए ‘राज्यपाल’ स्पष्ट, मानक और सामान्य पाठक के लिए सुबोध पद है।
theological_decisions:
- issue: दिखावटी नैतिक-धार्मिक स्थिति के संदर्भ में δίκαιος का अनुवाद
  choice: धर्मी
  alternative: न्यायी / खरा
  rationale: ‘धर्मी’ शब्द नैतिक और धार्मिक दोनों रंगों को बनाए रखता है; ‘खरा’ अर्थ को केवल ईमानदार प्रतीत होने तक सीमित कर सकता है।
- issue: ἀρχή और ἐξουσία की युग्मित अभिव्यक्ति
  choice: शासन और अधिकार
  alternative: शासकीय अधिकार / अधिकार और सत्ता
  rationale: दो पदों को अलग रखकर आधिकारिक क्षेत्राधिकार और उसे लागू करने की वैध शक्ति के बीच संभावित अर्थ-भेद तथा युग्म के बलाघात को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘कड़ी नज़र’, ‘ढोंग’, और ‘हवाले कर दें’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि ‘धर्मी’, ‘शासन’, और ‘अधिकार’ मूल के नैतिक तथा न्यायिक आयाम बनाए रखते हैं।
