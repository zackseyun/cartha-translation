  rationale: यहाँ καὶ कथा को आगे बढ़ाता है और पिछले विचार-विमर्श के परिणामस्वरूप दिए गए उत्तर को प्रस्तुत करता है; इसलिए स्वाभाविक हिन्दी में “इसलिए” प्रसंग का हल्का निष्कर्षात्मक भाव व्यक्त करता है।
- source_word: ἀπεκρίθησαν
  choice: उन्होंने उत्तर दिया
  rationale: ἀποκρίνομαι का यह रूप सामान्यतः उत्तर देने को व्यक्त करता है; “उन्होंने उत्तर दिया” सीधा और गरिमापूर्ण कथात्मक प्रयोग है।
- source_word: μὴ εἰδέναι
  choice: कि वे नहीं जानते
  rationale: उत्तर देने की क्रिया के बाद निषेधयुक्त infinitive यहाँ परोक्ष कथन है; हिन्दी में उपवाक्य “कि वे नहीं जानते” इसका स्वाभाविक रूप है।
- source_word: πόθεν
  choice: कहाँ से
  rationale: πόθεν किसी बात के उद्गम या स्रोत के विषय में पूछता है। प्रसंग में निहित कर्ता यूहन्ना का बपतिस्मा है, जिसे हिन्दी में “वह” से स्वाभाविक रूप से संदर्भित किया गया है।
