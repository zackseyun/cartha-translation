source:
  edition: SBLGNT
  text: Καὶ διεπορεύετο κατὰ πόλεις καὶ κώμας διδάσκων καὶ πορείαν ποιούμενος εἰς ⸀Ἱεροσόλυμα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/022.yaml
  text: And he was traveling through towns and villages[a], teaching and making his way toward Jerusalem.
translation:
  language: hi
  text: और वह नगर-नगर और गाँव-गाँव होकर शिक्षा देता हुआ यरूशलेम की ओर[a] बढ़ता जा रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरूशलेम को।”
    reason: εἰς का अधिक सीधा गंतव्य-सूचक अनुवाद भी संभव है।
lexical_decisions:
- source_word: διεπορεύετο
  choice: होकर ... बढ़ता जा रहा था
  rationale: अपूर्ण भूतकाल की क्रिया निरंतर यात्रा का भाव देती है। हिंदी में “बढ़ता जा रहा था” उस जारी गति को स्वाभाविक रूप से व्यक्त करता है, जबकि “होकर” अलग-अलग स्थानों से गुजरने का भाव देता है।
- source_word: κατὰ πόλεις καὶ κώμας
  choice: नगर-नगर और गाँव-गाँव होकर
  rationale: κατά के वितरणात्मक भाव को यह प्रयोग स्पष्ट करता है और बड़े तथा छोटे निवास-स्थानों का भेद बनाए रखता है।
- source_word: διδάσκων
  choice: शिक्षा देता हुआ
  rationale: वर्तमान कृदंत यात्रा के साथ-साथ चल रही गतिविधि बताता है; यह रूप उसी सहवर्ती क्रिया को संक्षेप में रखता है।
- source_word: πορείαν ποιούμενος
  choice: बढ़ता जा रहा था
  rationale: यह मुहावरा उद्देश्यपूर्ण ढंग से यात्रा आगे जारी रखने का अर्थ देता है। शब्दशः अनुवाद की अस्वाभाविकता से बचते हुए यह निरंतर प्रगति का भाव बनाए रखता है।
- source_word: εἰς Ἱεροσόλυμα
  choice: यरूशलेम की ओर
  rationale: εἰς यहाँ गंतव्य की दिशा बताता है। यात्रा-वृत्तांत में अभी पहुँचने के बजाय यरूशलेम की ओर जारी प्रगति को “की ओर” स्वाभाविक रूप से व्यक्त करता है।
- source_word: Ἱεροσόλυμα
  choice: यरूशलेम
  rationale: यह स्थान-नाम का हिंदी बाइबलीय रूप है।
theological_decisions:
- issue: यीशु की यरूशलेम-यात्रा की कथात्मक दिशा
  choice: यरूशलेम की ओर
  alternative: यरूशलेम को
  rationale: पद जारी यात्रा और गंतव्य की दिशा पर बल देता है, तत्काल आगमन पर नहीं। यह कथात्मक तनाव को बनाए रखता है और कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “नगर-नगर और गाँव-गाँव” वितरणात्मक यात्रा को सामान्य पाठक के लिए स्पष्ट करता है; “शिक्षा देता हुआ” और “बढ़ता जा रहा था” साथ-साथ चल रही शिक्षा तथा निरंतर यात्रा को व्यक्त करते हैं।
