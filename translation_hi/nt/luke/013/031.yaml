review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the timing, the indefinite group of Pharisees, their approach to Jesus, the paired command to leave, the causal clause, and Herod's desire to kill Jesus. It does not add an interpretation of the Pharisees' motive. The phrase “उसी घड़ी” appropriately preserves the specific, emphatic temporal reference.
  naturalness: 'The wording is clear and appropriately modern and respectful. However, “कुछ फ़रीसी यीशु के पास आए और उनसे कहा” is not fully idiomatic standard Hindi: with this construction, “कहा” is awkward without an ergative-marked subject. Recasting the speech verb as “उनसे बोले” resolves this naturally without changing the meaning.'
  terminology: “फ़रीसी,” “यीशु,” and “हेरोदेस” are suitable established Hindi biblical forms. “मार डालना चाहता है” faithfully represents θέλει ... ἀποκτεῖναι and does not imply a judicial execution. The honorific forms for Jesus are natural in modern Hindi.
  issues:
  - severity: low
    issue: The clause “कुछ फ़रीसी यीशु के पास आए और उनसे कहा” is grammatically and idiomatically awkward in standard Hindi.
    rationale: The perfective transitive verb “कहा” normally calls for an ergative-marked speaker (for example, “फ़रीसियों ने ... कहा”). Using “उनसे बोले” retains the coordinated structure and reports their speech naturally.
  revised_text: उसी घड़ी कुछ फ़रीसी यीशु के पास आए और उनसे बोले, “यहाँ से निकलकर चले जाइए, क्योंकि हेरोदेस आपको मार डालना चाहता है।”
