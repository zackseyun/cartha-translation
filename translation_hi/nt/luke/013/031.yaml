id: LUK.13.31
reference: Luke 13:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ⸀ὥρᾳ προσῆλθάν τινες Φαρισαῖοι λέγοντες αὐτῷ· Ἔξελθε καὶ πορεύου ἐντεῦθεν, ὅτι Ἡρῴδης θέλει σε ἀποκτεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/031.yaml
  text: At that very hour some Pharisees came up and said to him[a], “Leave and go away from here[b], because Herod wants to kill you.”
translation:
  language: hi
  text: उसी घड़ी कुछ फ़रीसी यीशु के पास आए और उनसे बोले, “यहाँ से निकलकर चले जाइए, क्योंकि हेरोदेस आपको मार डालना चाहता है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह वाक्यांश निश्चित और तत्काल समय पर बल देता है। ‘उसी घड़ी’ आधुनिक हिन्दी में स्वाभाविक रहते हुए αὐτῇ की बलवत्ता को बनाए रखता है।
- source_word: προσῆλθάν
  choice: पास आए
  rationale: προσέρχομαι यहाँ किसी के निकट आने का भाव रखता है; ‘पास आए’ सरल और स्वाभाविक हिन्दी है।
- source_word: τινες Φαρισαῖοι
  choice: कुछ फ़रीसी
  rationale: τινες अनिश्चित संख्या और पहचान बताता है; ‘कुछ’ बिना अतिरिक्त अर्थ जोड़े इसे ठीक व्यक्त करता है।
- source_word: λέγοντες αὐτῷ
  choice: उनसे कहा
  rationale: समकालिक कृदन्त को हिन्दी में पठनीयता के लिए मुख्य क्रिया के रूप में व्यक्त किया गया है। आदरसूचक बहुवचन यीशु के प्रति स्वाभाविक हिन्दी प्रयोग है।
- source_word: Ἔξελθε καὶ πορεύου ἐντεῦθεν
  choice: यहाँ से निकलकर चले जाइए
  rationale: दोनों आज्ञार्थक क्रियाओं—निकलने और आगे चले जाने—को बनाए रखते हुए हिन्दी में अनावश्यक कठोरता से बचाया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह चेतावनी का कारण प्रस्तुत करता है; ‘क्योंकि’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: Ἡρῴδης
  choice: हेरोदेस
  rationale: यह नाम हिन्दी बाइबल परम्परा में प्रचलित और पहचाना जाने वाला लिप्यंतरण है।
- source_word: θέλει
  choice: चाहता है
  rationale: θέλω इच्छा या चाह व्यक्त करता है। ‘चाहता है’ स्वाभाविक है और इसे अधिक निश्चित ‘इरादा रखता है’ में नहीं बदलता।
- source_word: ἀποκτεῖναι
  choice: मार डालना
  rationale: यह हत्या करने का स्पष्ट अर्थ देता है और औपचारिक न्यायिक मृत्युदण्ड का अनावश्यक संकेत नहीं जोड़ता।
theological_decisions:
- issue: फ़रीसियों की चेतावनी का अभिप्राय
  choice: कथन को सीधे चेतावनी के रूप में रखा गया है, पर फ़रीसियों की मंशा के विषय में कोई संकेत नहीं जोड़ा गया।
  alternative: उन्हें सच्चे शुभचिंतक या यीशु को डराकर हटाने वाले षड्यंत्रकारी बताना।
  rationale: यूनानी पाठ उनके कथन को दर्ज करता है, पर उनकी मंशा स्पष्ट नहीं करता; इसलिए अनुवाद इस कथात्मक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। यीशु के लिए ‘आप/जाइए’ का आदरसूचक प्रयोग सामान्य आधुनिक हिन्दी के अनुरूप है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई, क्योंकि स्रोत की अर्थगत बारीकियाँ मुख्य पाठ में स्वाभाविक रूप से व्यक्त हो जाती हैं।
