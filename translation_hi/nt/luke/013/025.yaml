id: LUK.13.25
reference: Luke 13:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀφ’ οὗ ἂν ἐγερθῇ ὁ οἰκοδεσπότης καὶ ἀποκλείσῃ τὴν θύραν, καὶ ἄρξησθε ἔξω ἑστάναι καὶ κρούειν τὴν θύραν λέγοντες· ⸀Κύριε, ἄνοιξον ἡμῖν· καὶ ἀποκριθεὶς ἐρεῖ ὑμῖν· Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/025.yaml
  text: Once the master of the house has risen and shut the door[a], and you begin to stand outside and knock on the door, saying, ‘Lord, open to us,’ then he will answer you, ‘I do not know you[c][b], where you are from.’
translation:
  language: hi
  text: जब घर का स्वामी उठकर द्वार बंद कर देगा[a], और तुम बाहर खड़े होकर द्वार खटखटाने लगोगे और कहोगे, ‘प्रभु[b], हमारे लिए द्वार खोल दीजिए,’ तब वह तुम्हें उत्तर देगा, ‘मैं तुम्हें नहीं जानता; मैं नहीं जानता कि तुम कहाँ के हो।’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “जब घर का स्वामी उठकर द्वार बंद कर दे।”'
    reason: कालवाचक यूनानी रचना ἀφ’ οὗ ἂν का अधिक औपचारिक विकल्प देना।
  - marker: b
    text: यूनानी κύριε का पारंपरिक अनुवाद “प्रभु” है; इस दृष्टान्त में इसका अर्थ “स्वामी” या सम्मानसूचक “श्रीमान” भी हो सकता है।
    reason: संबोधन के लौकिक और धार्मिक, दोनों सम्भव अर्थ सुरक्षित रखना।
  - marker: c
    text: 'यूनानी का अधिक शाब्दिक क्रम है: “मैं तुम्हें नहीं जानता, तुम कहाँ के हो।”'
    reason: मूल वाक्य में ‘तुम्हें’ और ‘कहाँ के हो’, दोनों उपस्थित होने तथा उसकी असामान्य संरचना को दिखाना।
lexical_decisions:
- source_word: ἀφ’ οὗ ἂν
  choice: जब
  rationale: यह अनिश्चित कालवाचक उपवाक्य आरम्भ करता है। हिंदी में ‘जब ... तब’ इसकी समयगत क्रमबद्धता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐγερθῇ
  choice: उठकर
  rationale: यहाँ अर्थ बैठी या लेटी अवस्था से उठना है, पुनरुत्थान नहीं। संयुक्त क्रिया ‘उठकर ... बंद कर देगा’ घटनाक्रम को स्पष्ट रखती है।
- source_word: οἰκοδεσπότης
  choice: घर का स्वामी
  rationale: यह घर पर अधिकार रखने वाले व्यक्ति को दर्शाता है। ‘घर का स्वामी’ आधुनिक हिंदी में गरिमापूर्ण है और अधिकार का भाव बनाए रखता है।
- source_word: ἀποκλείσῃ τὴν θύραν
  choice: द्वार बंद कर देगा
  rationale: क्रिया द्वार को बंद करके प्रवेश रोकने का निर्णायक भाव रखती है; संदर्भ से बहिष्करण स्पष्ट है।
- source_word: ἄρξησθε ἔξω ἑστάναι
  choice: तुम बाहर खड़े होकर ... लगोगे
  rationale: ‘लगोगे’ आरम्भ का भाव और ‘बाहर खड़े होकर’ बाहर स्थित रहने की अवस्था, दोनों को स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: κρούειν τὴν θύραν
  choice: द्वार खटखटाने
  rationale: यह बार-बार प्रवेश माँगने की सामान्य क्रिया का सहज हिंदी रूप है; ‘पीटने’ से अनावश्यक तीव्रता आती।
- source_word: Κύριε
  choice: प्रभु
  rationale: κύριος का सामान्य धार्मिक अनुवाद ‘प्रभु’ है। दृष्टान्त में ‘स्वामी’ या सम्मानसूचक संबोधन भी सम्भव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
- source_word: ἄνοιξον ἡμῖν
  choice: हमारे लिए द्वार खोल दीजिए
  rationale: यूनानी में ‘द्वार’ दूसरी बार स्पष्ट नहीं है, पर हिंदी में विनती को स्वाभाविक और स्पष्ट बनाने के लिए उसे प्रसंग से पूरा किया गया है; सम्मानसूचक आज्ञार्थक संबोधन के अनुरूप है।
- source_word: ἀποκριθεὶς ἐρεῖ
  choice: वह तुम्हें उत्तर देगा
  rationale: कृदन्त और मुख्य क्रिया की यूनानी रचना को हिंदी में एक स्वाभाविक कथन के रूप में व्यक्त किया गया है।
- source_word: Οὐκ οἶδα ὑμᾶς πόθεν ἐστέ
  choice: मैं तुम्हें नहीं जानता कि तुम कहाँ के हो
  rationale: इसमें स्पष्ट कर्म ‘तुम्हें’ और मूल या पहचान बताने वाला ‘कहाँ के हो’, दोनों सुरक्षित हैं। कुछ असामान्य हिंदी संरचना मूल यूनानी की तनावपूर्ण और कुछ हद तक असमंजसपूर्ण अभिव्यक्ति को बनाए रखती है।
theological_decisions:
- issue: दृष्टान्त में κύριος का संबोधन
  choice: प्रभु
  alternative: स्वामी; श्रीमान
  rationale: ‘प्रभु’ लूका में इस शब्द की व्यापक धार्मिक अनुगूँज को खुला रखता है, जबकि पादटिप्पणी यह स्पष्ट करती है कि दृष्टान्त के स्तर पर सामान्य सम्मानसूचक अर्थ भी सम्भव है।
- issue: οὐκ οἶδα ὑμᾶς πόθεν ἐστέ की संरचना
  choice: मैं तुम्हें नहीं जानता कि तुम कहाँ के हो
  alternative: मैं नहीं जानता कि तुम कहाँ के हो; मैं तुम्हें नहीं जानता—तुम कहाँ के हो
  rationale: चुना हुआ रूप ὑμᾶς को लोप नहीं करता और πόθεν ἐστέ को केवल भौगोलिक जानकारी तक सीमित किए बिना मूल की पहचान-संबंधी अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल लेकिन गरिमापूर्ण शैली रखी गई है। ‘द्वार’, ‘स्वामी’ और ‘प्रभु’ पाठ के दृष्टान्तात्मक तथा धार्मिक स्वर के अनुकूल हैं। विनती में ‘खोल दीजिए’ स्वाभाविक सम्मानसूचक प्रयोग है; बाहर वालों के लिए ‘तुम’ मूल बहुवचन संबोधन को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
