lexical_decisions:
- source_word: ἐπέθηκεν αὐτῇ τὰς χεῖρας
  choice: उसने उस पर अपने हाथ रखे
  rationale: हाथ रखने की यूनानी अभिव्यक्ति का यह स्वाभाविक और ठोस हिन्दी रूप है; कर्ता यीशु है और αὐτῇ का संबंध स्पष्ट रूप से स्त्री से है।
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रिया-विशेषण बिना विलंब के घटित होने को व्यक्त करता है; ‘तुरन्त’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: ἀνωρθώθη
  choice: सीधी हो गई
  rationale: निष्क्रिय क्रिया यहाँ झुकी हुई स्त्री के शरीर के सीधा किए जाने/सीधा हो जाने को बताती है। हिन्दी में ‘सीधी हो गई’ स्वाभाविक है और यूनानी में स्पष्ट न होने के कारण ‘फिर से’ नहीं जोड़ती।
- source_word: ἐδόξαζεν
  choice: महिमा करने लगी
  rationale: अपूर्णकाल उसके आरम्भ होकर जारी रहने वाले प्रत्युत्तर का संकेत दे सकता है। ‘करने लगी’ इस पक्ष को स्वाभाविक हिन्दी में रखता है, जबकि ‘महिमा’ क्रिया का धार्मिक भार बनाए रखती है।
- source_word: τὸν θεόν
  choice: परमेश्वर
  rationale: θεός के लिए मानक, गरिमापूर्ण हिन्दी शब्द और यहाँ क्रिया का सीधा कर्म।
theological_decisions:
- issue: ἀνωρθώθη में चंगाई के परिणाम का वर्णन
  choice: वह सीधी हो गई
  alternative: वह सीधी कर दी गई / वह तनकर खड़ी हो गई
  rationale: संदर्भ शारीरिक बहाली का है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी यूनानी निष्क्रिय रूप और खड़े होने की संभावित अभिव्यक्ति को सुरक्षित रखती है; ‘फिर से’ यूनानी में प्रत्यक्ष नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘उस पर अपने हाथ रखे’ बाइबलीय हाथ रखने की ठोस क्रिया को बनाए रखता है, और ‘महिमा करने लगी’ अपूर्णकाल की प्रगतिशील/आरम्भिक छाया को स्वाभाविक रूप से व्यक्त करता है।
