  text: τότε ἄρξεσθε λέγειν· Ἐφάγομεν ἐνώπιόν σου καὶ ἐπίομεν, καὶ ἐν ταῖς πλατείαις ἡμῶν ἐδίδαξας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/026.yaml
  text: Then you will begin to say[a], ‘We ate and drank in your presence, and you taught in our streets.’
translation:
  language: hi
  text: तब तुम कहने लगोगे, “हमने तेरे सामने खाया और पिया, और तूने हमारी सड़कों[a] पर शिक्षा दी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे सार्वजनिक चौकों में”; यूनानी शब्द नगर की चौड़ी सड़कों या खुले सार्वजनिक स्थानों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह वार्तालाप में अगले घटनाक्रम को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: ἄρξεσθε λέγειν
  choice: तुम कहने लगोगे
  rationale: भविष्यकालीन क्रिया और उसके साथ आए infinitive का आरंभसूचक भाव स्पष्ट रखता है; केवल ‘तुम कहोगे’ कहना इस सूक्ष्मता को खो देता।
- source_word: Ἐφάγομεν ... καὶ ἐπίομεν
  choice: हमने ... खाया और पिया
  rationale: दोनों aorist क्रियाओं को साधारण भूतकाल में रखते हुए साझा भोजन के सीधे दावे को सुरक्षित रखता है।
- source_word: ἐνώπιόν σου
  choice: तेरे सामने
  rationale: यह निकट उपस्थिति और बाहरी संगति के दावे को स्वाभाविक हिन्दी में व्यक्त करता है, पर स्वीकृत आत्मीय संबंध का अर्थ नहीं जोड़ता।
- source_word: ἐν ταῖς πλατείαις ἡμῶν
  choice: हमारी सड़कों पर
  rationale: πλατεῖα नगर की चौड़ी सड़क या खुले सार्वजनिक स्थान का बोध करा सकता है। ‘सड़कों पर’ सहज हिन्दी है और सार्वजनिक, स्थानीय परिवेश बनाए रखता है।
- source_word: ἐδίδαξας
  choice: तूने ... शिक्षा दी
  rationale: aorist को साधारण भूतकाल में प्रस्तुत करता है और उनके बीच सार्वजनिक रूप से शिक्षा दिए जाने के ऐतिहासिक दावे को स्पष्ट रखता है।
theological_decisions:
- issue: वक्ताओं द्वारा यीशु से संबंध का दावा
  choice: वचन केवल उनके बाहरी संपर्क के दावे को व्यक्त करता है—उन्होंने उसके सामने खाया-पिया और उसने उनकी सड़कों पर शिक्षा दी।
  alternative: ऐसी ढीली अभिव्यक्ति जो स्वीकृत संगति, आत्मीय संबंध या उद्धारकारी पहचान का संकेत दे।
  rationale: मूल पाठ निकटता पर आधारित उनकी दलील और प्रभु द्वारा वास्तविक पहचान के बीच तनाव रखता है; अनुवाद इस दावे को न तो पुष्ट करता है, न पहले से खारिज।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष संबोधन में एकवचन ‘तू/तेरे’ मूल यूनानी के एकवचन को सुरक्षित रखता है। ‘सड़कों पर’ हिन्दी मुहावरे के अनुसार है, जबकि पादटिप्पणी यूनानी शब्द की दूसरी वास्तविक संभावना बताती है।
