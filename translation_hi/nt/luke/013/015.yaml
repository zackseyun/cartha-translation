reference: Luke 13:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀπεκρίθη ⸀δὲ αὐτῷ ὁ κύριος καὶ εἶπεν· Ὑποκριταί, ἕκαστος ὑμῶν τῷ σαββάτῳ οὐ λύει τὸν βοῦν αὐτοῦ ἢ τὸν ὄνον ἀπὸ τῆς φάτνης καὶ ⸀ἀπαγαγὼν ποτίζει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/015.yaml
  text: But the Lord answered him and said[a], “Hypocrites! Does not each of you on the Sabbath untie his ox or donkey from the feeding trough and lead it away to water it?”
translation:
  language: hi
  text: परन्तु प्रभु ने उसे उत्तर देकर कहा, “हे कपटियो! क्या तुममें से हर एक सब्त के दिन अपने बैल या गधे को चरनी[a] से खोलकर पानी पिलाने नहीं ले जाता?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नाँद।” यूनानी शब्द पशुओं के चारा खाने के स्थान या पात्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: लूका के वृत्तांत में यह यीशु के लिए प्रयुक्त कथावाचकीय उपाधि है; ‘प्रभु’ इसके सम्मान और मसीही आशय को बनाए रखता है।
- source_word: Ὑποκριταί
  choice: हे कपटियो
  rationale: संबोधन बहुवचन की तीखी फटकार को स्वाभाविक और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: ἕκαστος ὑμῶν
  choice: तुममें से हर एक
  rationale: यूनानी पदबंध के वितरणात्मक बल को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τῷ σαββάτῳ
  choice: सब्त के दिन
  rationale: समय-सूचक पद का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: λύει
  choice: खोलकर
  rationale: चरनी के पास बँधे पशु की रस्सी खोलने की क्रिया को सन्दर्भानुकूल ढंग से व्यक्त करता है।
- source_word: βοῦν
  choice: बैल
  rationale: कृषि-कार्य से जुड़े गोवंशीय पशु के लिए पारम्परिक और सन्दर्भानुकूल हिन्दी शब्द।
- source_word: ὄνον
  choice: गधा
  rationale: आधुनिक हिन्दी का स्पष्ट और सामान्य समतुल्य।
- source_word: φάτνης
  choice: चरनी
  rationale: पशु के चारा खाने के स्थान या पात्र का परिचित हिन्दी नाम; ‘नाँद’ भी सम्भव है।
- source_word: ἀπαγαγὼν
  choice: ले जाता
  rationale: पशु को वहाँ से आगे ले जाने की क्रिया को मुख्य क्रिया के साथ स्वाभाविक हिन्दी वाक्य-विन्यास में जोड़ता है।
- source_word: ποτίζει
  choice: पानी पिलाने
  rationale: पशु को पीने के लिए पानी देने का सीधा और स्वाभाविक हिन्दी प्रयोग।
theological_decisions:
- issue: यीशु के लिए कथावाचकीय उपाधि κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ लूका के कथन में उपाधि के मसीही भार को बनाए रखता है, जबकि ‘स्वामी’ यहाँ अनावश्यक रूप से सामान्य मानवीय अधिकार-सूचक लग सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। यूनानी के अलंकारिक प्रश्न को प्रश्न रूप में तथा संबोधन की तीखी फटकार को बिना नरम किए सुरक्षित रखा गया है।
