  yaml_path: translation/nt/luke/013/005.yaml
  text: No[a], I tell you; but unless you repent, you will all likewise perish.
translation:
  language: hi
  text: नहीं, मैं तुमसे कहता हूँ; पर यदि तुम मन न फिराओ, तो तुम सब भी इसी प्रकार[a] नाश हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम सब भी वैसे ही नाश हो जाओगे।” पिछले उदाहरणों के संदर्भ में यूनानी शब्द किसी तुलनीय प्रकार के न्याय की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: नहीं
  rationale: यह पिछले प्रसंग में निहित प्रश्न का सीधा और बलपूर्ण निषेध है; आधुनिक हिन्दी में ‘नहीं’ स्वाभाविक है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह लूका में प्रयुक्त सामान्य कथन-सूत्र का निकट और स्वाभाविक हिन्दी रूप है।
- source_word: ἀλλ’ ἐὰν μὴ
  choice: पर यदि ... न
  rationale: यह विरोध और नकारात्मक शर्त दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: μετανοῆτε
  choice: मन फिराओ
  rationale: यह परमेश्वर की ओर पश्चातापपूर्ण आंतरिक और जीवनगत परिवर्तन का संकेत देता है, पर अर्थ को केवल पछतावे या बौद्धिक मत-परिवर्तन तक सीमित नहीं करता।
- source_word: πάντες
  choice: तुम सब
  rationale: यह चेतावनी की सार्वभौमिकता को स्पष्ट करता है और πάντες को सम्बोधित लोगों के साथ जोड़ता है।
- source_word: ὡσαύτως
  choice: भी इसी प्रकार
  rationale: यह पूर्ववर्ती उदाहरणों से तुलना बनाए रखता है, जबकि तुलना के सटीक आधार—रीति, निश्चितता या न्याय—को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ἀπολεῖσθε
  choice: नाश हो जाओगे
  rationale: यह ἀπόλλυμι की विनाश और अनिष्ट की गंभीरता को बनाए रखता है तथा अर्थ को केवल शारीरिक मृत्यु तक सीमित नहीं करता।
theological_decisions:
- issue: यीशु की चेतावनी में μετανοέω का अर्थ
  choice: ‘मन फिराओ’ द्वारा पश्चाताप और दिशा-परिवर्तन का व्यापक अर्थ बनाए रखा गया है।
  alternative: ‘पश्चाताप करो’ या ‘अपना मन बदलो’
  rationale: ‘अपना मन बदलो’ अर्थ को अत्यधिक बौद्धिक बना सकता है, जबकि ‘मन फिराओ’ भीतर के परिवर्तन और परमेश्वर की ओर मुड़ने की धारणा को संक्षेप में रखता है, बिना किसी सम्प्रदायगत परिभाषा के।
- issue: ὡσαύτως ἀπολεῖσθε का बल
  choice: ‘भी इसी प्रकार नाश हो जाओगे’
  alternative: ‘वैसे ही नाश हो जाओगे’ या केवल ‘नाश हो जाओगे’
  rationale: यह तुलना को सुरक्षित रखता है, पर यह तय नहीं करता कि समानता मृत्यु की रीति, न्याय की निश्चितता, आकस्मिकता या किसी अन्य पहलू में है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तुम’ मूल बहुवचन सम्बोधन के अनुरूप है; ‘मन फिराओ’ सामान्य पाठक के लिए बोधगम्य रहते हुए पद के धार्मिक भार को बनाए रखता है।
