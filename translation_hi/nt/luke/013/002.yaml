source:
  edition: SBLGNT
  text: καὶ ⸀ἀποκριθεὶς εἶπεν αὐτοῖς· Δοκεῖτε ὅτι οἱ Γαλιλαῖοι οὗτοι ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο, ὅτι ⸀ταῦτα πεπόνθασιν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/002.yaml
  text: And answering, he said to them, “Do you think that these Galileans became sinners beyond all the Galileans, because they have suffered these things?”
translation:
  language: hi
  text: उसने उनसे कहा, “क्या तुम समझते हो कि ये गलीलवासी सभी गलीलवासियों से अधिक पापी बन गए, क्योंकि उन्होंने यह सब सहा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने ... कहा
  rationale: यह सामी प्रभाव वाला यूनानी कथन-सूत्र है। प्रसंग में सीधे और स्वाभाविक हिन्दी ‘उसने ... कहा’ अर्थ को पर्याप्त रूप से व्यक्त करती है; अलग से ‘उत्तर देते हुए’ कहना अनावश्यक रूप से भारी होता।
- source_word: ἁμαρτωλοὶ παρὰ πάντας τοὺς Γαλιλαίους ἐγένοντο
  choice: बाकी सब गलीलियों से बढ़कर पापी निकले
  rationale: παρά तुलनात्मक अर्थ देता है और ἐγένοντο यहाँ घटना से उनके वास्तविक चरित्र के प्रकट/सिद्ध होने की धारणा को वहन कर सकता है। ‘पापी निकले’ इसे स्वाभाविक हिन्दी में रखता है, बिना यह कहे कि दुख सहने के कारण वे पापी बन गए।
- source_word: ταῦτα πεπόνθασιν
  choice: उन्होंने ये दुख सहे
  rationale: परिपूर्ण काल उनके द्वारा भुगती गई घटनाओं और उनके वर्तमान परिणाम पर ध्यान रखता है। ‘ये दुख सहे’ प्रसंगानुकूल और सहज है।
theological_decisions:
- issue: क्या विपत्ति असाधारण पाप का प्रमाण है
  choice: 'प्रश्न को खुला और चुनौतीपूर्ण रखा गया है: ‘क्या तुम समझते हो...?’'
  alternative: ऐसा कथन जो पहले ही स्पष्ट कर दे कि वे दूसरों से अधिक दोषी नहीं थे
  rationale: इस पद में यीशु श्रोताओं की धारणा पर प्रश्न करते हैं; स्पष्ट नकार अगले पद में आता है। उसे समय से पहले यहाँ नहीं जोड़ा गया।
- issue: ἐγένοντο का अर्थ
  choice: ‘पापी निकले’
  alternative: ‘पापी बन गए’ या केवल ‘पापी थे’
  rationale: ‘बन गए’ हिन्दी में यह गलत संकेत दे सकता है कि कष्ट ने उन्हें पापी बनाया, जबकि ‘थे’ यूनानी क्रिया की सूक्ष्मता मिटा देता है। ‘निकले’ तुलना और अनुमान के संदर्भ में दोनों के बीच उपयुक्त संतुलन रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक, संक्षिप्त और गरिमापूर्ण है। ‘गलीली’ तथा ‘पापी’ सामान्य बाइबलीय शब्दावली के अनुरूप हैं।
