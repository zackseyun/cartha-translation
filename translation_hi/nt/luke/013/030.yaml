source:
  edition: SBLGNT
  text: καὶ ἰδοὺ εἰσὶν ἔσχατοι οἳ ἔσονται πρῶτοι, καὶ εἰσὶν πρῶτοι οἳ ἔσονται ἔσχατοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/030.yaml
  text: And behold[a], there are last who will be first, and there are first who will be last.
translation:
  language: hi
  text: और देखो, कुछ लोग जो अंतिम हैं, प्रथम होंगे; और कुछ लोग जो प्रथम हैं, अंतिम होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आधुनिक हिन्दी में ध्यान आकर्षित करने वाला स्वाभाविक और संक्षिप्त प्रयोग है; यह मूल के विमर्शगत बल को बनाए रखता है, बिना अत्यधिक पुरातन शैली अपनाए।
- source_word: ἔσχατοι
  choice: अंतिम
  rationale: यह स्थान या दर्जे में पीछे होने का अर्थ रखता है और πρῶτοι के साथ मूल का तीखा विरोध सुरक्षित रखता है; ‘तुच्छ’ कहने से अनावश्यक नैतिक अर्थ जुड़ सकता था।
- source_word: πρῶτοι
  choice: प्रथम
  rationale: यह ἔσχατοι के प्रतिलोम के रूप में संक्षिप्त और गरिमापूर्ण है तथा सूत्रात्मक कथन की समानांतरता बनाए रखता है।
- source_word: εἰσὶν
  choice: कुछ लोग ... हैं
  rationale: यूनानी अस्तित्वसूचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है। ‘कुछ’ यह नहीं कहता कि संख्या कितनी है, बल्कि अनिर्दिष्ट व्यक्तियों के अस्तित्व को दर्शाता है।
- source_word: οἳ ἔσονται
  choice: जो ... होंगे
  rationale: संबंधवाचक उपवाक्य और भविष्यकाल को सीधे, स्पष्ट आधुनिक हिन्दी में रखा गया है।
- source_word: καὶ
  choice: और
  rationale: दोनों विपरीत किंतु समानांतर खंडों को जोड़ने वाली मूल संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: उलटाव के कथन का दायरा
  choice: इसे स्थिति या दर्जे के उलटाव का व्यापक कथन रखा गया है।
  alternative: इसे विशेष रूप से यहूदियों और अन्यजातियों, नम्रता और घमंड, अथवा अंतिम न्याय में पदक्रम के विषय में सीमित करना।
  rationale: निकटवर्ती प्रसंग परमेश्वर के राज्य में प्रवेश से जुड़ा है, पर यूनानी वाक्य स्वयं किसी एक सामाजिक, जातीय या अंतकालीन वर्ग को निर्दिष्ट नहीं करता। सामान्य शब्दावली इसकी वास्तविक व्यापकता और धर्मवैचारिक तनाव को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। ‘प्रथम/अंतिम’ की संक्षिप्त जोड़ी मूल कथन की सूत्रात्मक लय बनाए रखती है; अर्धविराम दोनों संतुलित खंडों को स्पष्ट करता है।
