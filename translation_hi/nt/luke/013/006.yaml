source:
  edition: SBLGNT
  text: Ἔλεγεν δὲ ταύτην τὴν παραβολήν. Συκῆν εἶχέν τις ⸂πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ⸃, καὶ ἦλθεν ζητῶν καρπὸν ἐν αὐτῇ καὶ οὐχ εὗρεν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/006.yaml
  text: 'And he was telling this parable: “A man had a fig tree planted in his vineyard[a], and he came looking for fruit on it and found none.”'
translation:
  language: hi
  text: 'और उसने यह दृष्टान्त सुनाया: “किसी मनुष्य[a] की दाख की बारी में अंजीर का एक पेड़ लगा हुआ था। वह उस पर फल ढूँढ़ने आया, पर उसे एक भी फल नहीं मिला।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी व्यक्ति की दाख की बारी में।” यूनानी अनिश्चित सर्वनाम को अधिक सामान्य रूप में भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἔλεγεν δὲ
  choice: तब उसने ... सुनाया
  rationale: अपूर्ण भूतकाल यहाँ दृष्टान्त के आरम्भ की कथात्मक क्रिया व्यक्त करता है। ‘सुनाया’ आधुनिक हिन्दी में स्वाभाविक है; ‘तब’ δέ के हल्के कथात्मक संक्रमण को दर्शाता है।
- source_word: ταύτην τὴν παραβολήν
  choice: यह दृष्टान्त
  rationale: ‘दृष्टान्त’ यीशु की शिक्षाप्रद रूपक-कथा के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: Συκῆν
  choice: एक अंजीर का पेड़
  rationale: शब्द विशेष रूप से अंजीर के वृक्ष को सूचित करता है; ‘पेड़’ जोड़ने से सामान्य पाठक के लिए अर्थ तुरन्त स्पष्ट होता है।
- source_word: εἶχέν τις
  choice: किसी मनुष्य ने ... लगवा रखा था
  rationale: τις अनिश्चित व्यक्ति को सूचित करता है। ‘किसी मनुष्य’ उसकी अनिश्चितता बनाए रखता है, जबकि πεφυτευμένην के साथ ‘लगवा रखा था’ वृक्ष की पहले से स्थापित, रोपी हुई अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πεφυτευμένην ἐν τῷ ἀμπελῶνι αὐτοῦ
  choice: अपनी दाख की बारी में ... लगवा रखा था
  rationale: पूर्ण निष्क्रिय कृदन्त रोपे जाने के परिणामस्वरूप बनी हुई अवस्था दिखाता है। ‘अपनी’ स्वामी और बारी के सम्बन्ध को सहज हिन्दी में व्यक्त करता है; ἀμπελών के लिए ‘दाख की बारी’ मानक बाइबलीय हिन्दी है।
- source_word: ἦλθεν ζητῶν
  choice: फल ढूँढ़ने आया
  rationale: मुख्य क्रिया और वर्तमान कृदन्त मिलकर आने के साथ उद्देश्यपूर्ण खोज को व्यक्त करते हैं; यह हिन्दी रूप संक्षिप्त और स्वाभाविक है।
- source_word: καρπὸν ἐν αὐτῇ
  choice: उस पर फल
  rationale: पेड़ पर लगे फल के लिए हिन्दी में ‘उस पर’ स्वाभाविक है और आगे के रूपकात्मक अर्थ के लिए ‘फल’ को सुरक्षित रखता है।
- source_word: οὐχ εὗρεν
  choice: उसे एक भी फल नहीं मिला
  rationale: यह न मिलने को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है; ‘एक भी’ पूर्ण अभाव पर उचित बल देता है, बिना कोई नया अर्थ जोड़े।
theological_decisions:
- issue: दृष्टान्त में अनिश्चित कर्ता τις
  choice: किसी मनुष्य
  alternative: किसी व्यक्ति / एक मनुष्य
  rationale: मूल यूनानी केवल एक अनिश्चित मानवीय पात्र प्रस्तुत करता है और उसकी कोई धर्मवैज्ञानिक पहचान निश्चित नहीं करता। ‘किसी मनुष्य’ इस अनिश्चितता और कथात्मक शैली दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य कथात्मक है और सामान्य पाठक के लिए स्पष्ट रखा गया है। ‘दाख की बारी’ बाइबलीय प्रयोग में परिचित है, जबकि शेष भाषा अनावश्यक रूप से पुरातन नहीं है।
