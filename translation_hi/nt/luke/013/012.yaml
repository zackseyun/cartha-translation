  yaml_path: translation/nt/luke/013/012.yaml
  text: But when Jesus saw her[a], he called her over and said to her, “Woman, you are freed from your weakness.”
translation:
  language: hi
  text: पर जब यीशु ने उसे देखा, तो उसे पुकारकर उससे कहा, “स्त्री, तुम्हें अपनी दुर्बलता से मुक्त कर दिया गया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें अपनी अशक्तता से छुटकारा दे दिया गया है।”
    reason: यह वैकल्पिक रूप ἀπολέλυσαι के कर्मवाच्य भाव और ἀσθένεια के ‘अशक्तता’ अर्थ को अधिक स्पष्टता से दिखाता है।
lexical_decisions:
- source_word: ἰδὼν δὲ αὐτὴν
  choice: पर जब यीशु ने उसे देखा
  rationale: क्रियाविशेषणीय एओरिस्ट कृदन्त ἰδών को स्वाभाविक कालवाचक उपवाक्य के रूप में व्यक्त किया गया है। δέ कथा में आगे बढ़ने के साथ हल्का विरोध दर्शाता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: προσεφώνησεν
  choice: उसे अपने पास बुलाकर
  rationale: προσφωνέω किसी को पुकारने या सीधे संबोधित करने का अर्थ दे सकता है। प्रसंग में यीशु की पहल और स्त्री को बुलाना स्वाभाविक रूप से व्यक्त होता है।
- source_word: Γύναι
  choice: स्त्री
  rationale: सम्बोधन γύναι सीधा और सम्मानजनक है। ‘स्त्री’ मूल शब्द के निकट रहते हुए ऐसा स्नेह या सामाजिक पद नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: ἀπολέλυσαι
  choice: तुम ... मुक्त हो गई हो
  rationale: यह ἀπολύω का पूर्णकालिक कर्मवाच्य रूप है, जो पूरी हो चुकी मुक्ति और उसकी वर्तमान परिणति—दोनों को व्यक्त करता है। हिंदी की पूर्ण क्रिया ‘मुक्त हो गई हो’ इस भाव को स्वाभाविक रूप से रखती है।
- source_word: τῆς ἀσθενείας σου
  choice: अपनी दुर्बलता से
  rationale: ἀσθένεια का अर्थ दुर्बलता, बीमारी या अशक्तता हो सकता है। ‘दुर्बलता’ मूल की व्यापक अर्थ-सीमा बनाए रखती है और किसी आधुनिक चिकित्सकीय निदान को आरोपित नहीं करती।
theological_decisions:
- issue: स्त्री की दशा के लिए ἀσθένεια का अर्थ
  choice: व्यापक अर्थ वाला ‘दुर्बलता’
  alternative: ‘बीमारी’ या ‘अशक्तता’
  rationale: निकटवर्ती प्रसंग शारीरिक कष्ट की ओर संकेत करता है, लेकिन यूनानी शब्द स्वयं अधिक व्यापक है। ‘दुर्बलता’ इस अर्थगत खुलेपन को बनाए रखती है।
- issue: ἀπολέλυσαι में मुक्ति की वाच्यता और परिणाम
  choice: ‘मुक्त हो गई हो’ द्वारा पूर्ण कर्म और वर्तमान परिणति को बनाए रखना
  alternative: ‘मुक्त हो’ या ‘छुटकारा पा चुकी हो’
  rationale: पूर्णकालिक कर्मवाच्य रूप किसी संपन्न मुक्ति को उसके वर्तमान परिणाम सहित व्यक्त करता है। अनुवाद यह तय नहीं करता कि कर्मकर्ता को व्याकरण में स्पष्ट किया जाए, क्योंकि मूल में वह अनकहा है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हे स्त्री’ की अपेक्षा सीधे ‘स्त्री’ से संबोधन कम पुरातन है; ‘तुम’ सम्मान और सामान्य आधुनिक प्रयोग के बीच उपयुक्त संतुलन रखता है।
