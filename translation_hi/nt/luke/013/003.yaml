  text: No, I tell you; but unless you change your thinking, you will all likewise perish.
translation:
  language: hi
  text: नहीं, मैं तुमसे कहता हूँ; पर यदि तुम मन न फिराओ, तो तुम सब भी वैसे ही[a] नाश हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसी प्रकार।” “वैसे ही” का संकेत उसी तरह अचानक आने वाले न्याय की ओर हो सकता है; इसका अर्थ यह आवश्यक नहीं कि मृत्यु का ढंग बिल्कुल एक जैसा होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐχί
  choice: नहीं
  rationale: पिछले प्रसंग में निहित धारणा का स्पष्ट और स्वाभाविक निषेध करता है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: लूका में प्रयुक्त प्रत्यक्ष और बलपूर्ण संबोधन को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἀλλ’
  choice: पर
  rationale: नकार दी गई धारणा और आगे दी गई चेतावनी के बीच विरोध दर्शाता है।
- source_word: ἐὰν μὴ
  choice: यदि ... न
  rationale: यूनानी की नकारात्मक शर्त को स्वाभाविक हिन्दी में व्यक्त करता है; अर्थ 'जब तक नहीं' अथवा 'यदि नहीं' है।
- source_word: μετανοῆτε
  choice: मन न फिराओ
  rationale: यह केवल बौद्धिक विचार बदलने के बजाय परमेश्वर की ओर पश्चात्तापपूर्ण आंतरिक परिवर्तन और दिशा-परिवर्तन का संकेत देता है।
- source_word: πάντες
  choice: तुम सब
  rationale: चेतावनी के व्यापक दायरे को स्पष्ट करता है कि वह सभी श्रोताओं पर लागू होती है।
- source_word: ὁμοίως
  choice: भी वैसे ही
  rationale: पिछली घटनाओं से तुलना बनाए रखता है, पर मृत्यु के बिल्कुल समान ढंग को अनिवार्य नहीं ठहराता।
- source_word: ἀπολεῖσθε
  choice: नाश हो जाओगे
  rationale: आने वाले विनाश या सर्वनाश की गंभीर चेतावनी व्यक्त करता है, बिना इसे केवल शारीरिक मृत्यु या स्पष्टतः अनन्त दण्ड तक सीमित किए।
theological_decisions:
- issue: μετανοέω में पश्चात्ताप और मन-परिवर्तन का संबंध
  choice: मन फिराना
  alternative: पश्चात्ताप करना / सोच बदलना
  rationale: '''मन फिराना'' आंतरिक परिवर्तन और जीवन की दिशा बदलने दोनों को समेटता है; केवल ''सोच बदलना'' अर्थ को बौद्धिक पुनर्विचार तक संकुचित कर सकता है।'
- issue: ἀπολεῖσθε के नाश का दायरा
  choice: नाश हो जाओगे
  alternative: मर जाओगे / अनन्त दण्ड पाओगे
  rationale: यूनानी पद न्याय के अधीन नाश की गंभीरता रखता है, लेकिन इस पद में उसके सटीक प्रकार या अवधि को निर्धारित नहीं करता; इसलिए अस्पष्टता और धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष चेतावनी वाला रूप। 'तुम' बहुवचन श्रोताओं के लिए है; 'मन फिराना' धार्मिक पारिभाषिकता और सामान्य बोधगम्यता के बीच संतुलन रखता है।
