source:
  edition: SBLGNT
  text: ⸀Καὶ πάλιν εἶπεν· Τίνι ὁμοιώσω τὴν βασιλείαν τοῦ θεοῦ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/020.yaml
  text: And again he said, “To what shall I compare the kingdom of God?”
translation:
  language: hi
  text: और उसने फिर कहा, “मैं परमेश्वर के राज्य की तुलना किससे करूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: यह सामान्य संयोजक पिछले कथन से सरल संबंध बनाए रखता है और यूनानी पाठ से अधिक कोई समय-संबंध नहीं जोड़ता।
- source_word: πάλιν
  choice: फिर
  rationale: यह कथन की पुनरावृत्ति बताता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक और सीधा है।
- source_word: εἶπεν
  choice: उसने कहा
  rationale: प्रत्यक्ष कथन का परिचय देने वाले λέγω के कथात्मक प्रयोग का यह स्वाभाविक हिन्दी रूप है; संदर्भ में कर्ता यीशु है।
- source_word: Τίνι
  choice: किससे
  rationale: यहाँ नपुंसकलिंग प्रश्नवाचक रूप तुलना के आधार के विषय में पूछता है; हिन्दी में ‘किससे’ वस्तु और व्यक्ति दोनों के लिए प्रयुक्त हो सकता है, पर इस तुलना-सूचक संरचना में अर्थ स्वाभाविक रूप से स्पष्ट है।
- source_word: ὁμοιώσω
  choice: मैं ... तुलना ... करूँ
  rationale: यूनानी भविष्यत् रूप यहाँ विचारात्मक प्रश्न का बल रखता है; हिन्दी संभावनार्थक ‘करूँ’ उसी भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὴν βασιλείαν τοῦ θεοῦ
  choice: परमेश्वर के राज्य
  rationale: ‘परमेश्वर का राज्य’ βασιλεία की राजकीय सत्ता और क्षेत्र—दोनों की अर्थ-व्याप्ति को सुरक्षित रखने वाला स्थापित और सुबोध बाइबलीय पद है।
theological_decisions:
- issue: परमेश्वर की राजकीय सत्ता के संदर्भ में βασιλεία का अनुवाद
  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: ‘राज्य’ यूनानी पद की व्यापकता को सुरक्षित रखता है, जिसमें परमेश्वर का शासन करना और उसके शासन का क्षेत्र दोनों सम्मिलित हो सकते हैं; ‘शासन’ अर्थ को केवल सक्रिय राजकीय क्रिया तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और बोलचाल में स्वाभाविक प्रत्यक्ष कथन। ‘और ... फिर’ मूल के Καὶ πάλιν दोनों को सुरक्षित रखता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
