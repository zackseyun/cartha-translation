id: LUK.13.33
reference: Luke 13:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πλὴν δεῖ με σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ πορεύεσθαι, ὅτι οὐκ ἐνδέχεται προφήτην ἀπολέσθαι ἔξω Ἰερουσαλήμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/033.yaml
  text: Nevertheless[a], I must go on my way today and tomorrow and the next day[b], because it is not possible for a prophet to perish outside Jerusalem.
translation:
  language: hi
  text: फिर भी मुझे आज, कल और उसके अगले दिन[a] अपनी राह पर चलते जाना है, क्योंकि यह संभव नहीं कि कोई भविष्यद्वक्ता यरूशलेम के बाहर नाश हो जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “आज, कल और उसके अगले दिन” का प्रयोग संभवतः ठीक तीन कैलेंडर दिनों के बजाय आगे के एक छोटे, निश्चित समय या निर्धारित क्रम के लिए मुहावरे के रूप में हुआ है।
    reason: cultural_note
  - marker: b
    text: “यह संभव नहीं” का अनुवाद “ऐसा हो ही नहीं सकता” या “यह सोचा भी नहीं जा सकता” भी हो सकता है; इस कथन में तीखी विडंबना हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: फिर भी
  rationale: यह पिछले कथन के साथ प्रबल विरोध या सीमा-सूचक संबंध व्यक्त करता है; ‘फिर भी’ आधुनिक हिन्दी में स्वाभाविक रूप से उस प्रतिकूल बल को बनाए रखता है।
- source_word: δεῖ με
  choice: मुझे … रहना है
  rationale: δεῖ बाध्यता या आवश्यकता व्यक्त करता है। इस वाक्य-विन्यास में ‘मुझे … आगे बढ़ते रहना है’ स्वाभाविक हिन्दी है और आवश्यकता को स्पष्ट करता है, पर उसके स्रोत को अनावश्यक रूप से परिभाषित नहीं करता।
- source_word: σήμερον καὶ αὔριον καὶ τῇ ἐχομένῃ
  choice: आज, कल और उसके अगले दिन
  rationale: यह यूनानी के तीन चरणों वाले काल-सूचक क्रम को स्पष्ट रूप से बनाए रखता है और हिन्दी में सहज है। मुहावरेदार संभाव्यता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: πορεύεσθαι
  choice: अपनी राह पर आगे बढ़ते रहना
  rationale: πορεύομαι जाने, यात्रा करने या आगे बढ़ने का अर्थ दे सकता है। यह चयन यात्रा के प्रसंग और निरंतर आगे बढ़ने, दोनों को व्यक्त करता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करने वाला सबसे स्पष्ट और सामान्य आधुनिक हिन्दी संयोजक है।
- source_word: οὐκ ἐνδέχεται
  choice: यह संभव नहीं
  rationale: यह असंभवता अथवा असंगति की मूल अभिव्यक्ति को बनाए रखता है, बिना विडंबना को मुख्य पाठ में जरूरत से अधिक स्पष्ट किए।
- source_word: προφήτην
  choice: कोई भविष्यद्वक्ता
  rationale: अनिश्चित, एकवचन संज्ञा यहाँ सामान्य या कहावत-सदृश अर्थ रखती है; ‘कोई भविष्यद्वक्ता’ उस सामान्यता को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: ἀπολέσθαι
  choice: नाश हो
  rationale: यह ‘मरना’, ‘नष्ट होना’ और ‘प्राण गंवाना’ की अर्थ-सीमा तथा कथन की गंभीरता को बनाए रखता है।
- source_word: ἔξω Ἰερουσαλήμ
  choice: यरूशलेम के बाहर
  rationale: यह मूल स्थान-सूचक अभिव्यक्ति का सीधा, सटीक और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: यरूशलेम के बाहर किसी भविष्यद्वक्ता के नाश होने के बारे में यीशु के कथन का बल
  choice: इसे असंभवता या तीखी असंगति के कथन के रूप में अनूदित किया गया है, पर इसे निरपेक्ष आध्यात्मिक नियम नहीं बनाया गया।
  alternative: ‘यह सोचा भी नहीं जा सकता’ या ‘भला कोई भविष्यद्वक्ता यरूशलेम के बाहर कैसे मर सकता है?’ कहकर विडंबना को अधिक स्पष्ट किया जा सकता था।
  rationale: οὐκ ἐνδέχεται ऐसी बात का बोध करा सकता है जो असंभव, अनुपयुक्त या परंपरागत दृष्टि से अकल्पनीय हो। मुख्य पाठ मूल तनाव को बनाए रखता है और संभावित भविष्यद्वक्तीय विडंबना का निर्णय पाठक पर छोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अपनी राह पर आगे बढ़ते रहना’ यात्रा और निर्धारित कार्य की निरंतरता को व्यक्त करता है। मुख्य पाठ में मूल यूनानी की असंभवता/असंगति और संभावित विडंबना के बीच का तनाव सुरक्षित है।
