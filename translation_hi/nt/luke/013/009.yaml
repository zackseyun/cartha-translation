base_translation:
  language: en
  yaml_path: translation/nt/luke/013/009.yaml
  text: And if it bears fruit in the future—well and good; but if not[a], you will cut it down.
translation:
  language: hi
  text: और यदि वह आने वाले समय में फल दे—तो अच्छा है; पर यदि नहीं[a], तो आप उसे काट डालेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अगले वर्ष’। कुछ अनुवाद पिछले पद के आधार पर यह अधिक निश्चित समय देते हैं, पर यहाँ यूनानी पदबंध का अधिक शाब्दिक अर्थ ‘भविष्य के लिए’ या ‘आने वाले समय में’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: κἂν μὲν
  choice: और यदि
  rationale: κἄν (καί + ἐάν) संबंध और शर्त दोनों व्यक्त करता है; μέν आगे आने वाले δέ के साथ विरोध की पहली ओर रखता है। ‘और यदि’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: ποιήσῃ καρπὸν
  choice: फल दे
  rationale: καρπός के साथ ποιέω का अर्थ फल उत्पन्न करना या फलना है। हिन्दी में पेड़ के लिए ‘फल देना’ स्वाभाविक है और कृषि-रूपक बनाए रखता है।
- source_word: εἰς τὸ μέλλον
  choice: आने वाले समय में
  rationale: यह पदबंध सामान्यतः भविष्य या आने वाले समय की ओर संकेत करता है; यूनानी पाठ में यहाँ ‘अगले वर्ष’ स्पष्ट रूप से नहीं कहा गया है।
- source_word: εἰ δὲ μήγε
  choice: पर यदि नहीं
  rationale: यह पहले रखी गई शर्त के निषेध को विरोधात्मक ढंग से प्रस्तुत करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: ἐκκόψεις αὐτήν
  choice: आप उसे काट डालेंगे
  rationale: बाग़बानी के इस संदर्भ में ἐκκόπτω का अर्थ पेड़ को काट डालना है। भविष्यकाल और एकवचन संबोधन दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: मालिक द्वारा स्थगित न्याय का समय
  choice: मुख्य पाठ में समय को सामान्य रूप से ‘आने वाले समय में’ रखा गया है।
  alternative: ‘अगले वर्ष’
  rationale: पिछले पद के संदर्भ से ‘अगले वर्ष’ समझना संभव है, पर इस पद का यूनानी वाक्यांश स्वयं उतना निश्चित समय नहीं बताता। इसलिए दृष्टान्त की मोहलत और आने वाले न्याय के तनाव को बिना अतिरिक्त विशिष्टता के बनाए रखा गया है।
- issue: पहली शर्त के परिणाम में निहित लोप
  choice: ‘तो ठीक’ जोड़कर यूनानी वाक्य के निहित सकारात्मक परिणाम को स्वाभाविक हिन्दी में व्यक्त किया गया है।
  alternative: ‘और यदि वह आने वाले समय में फल दे—; पर यदि नहीं...’ जैसे अपूर्ण वाक्य को ज्यों का त्यों रखना
  rationale: यूनानी में पहली शर्त के बाद परिणाम-वाक्य निहित है। ‘तो ठीक’ कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता, बल्कि हिन्दी में उसी लोप को स्पष्ट और पठनीय बनाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मालिक के प्रति एकवचन यूनानी संबोधन को हिन्दी में सम्मानसूचक ‘आप’ से व्यक्त किया गया है; अंजीर के पेड़ के लिए स्वाभाविक ‘वह/उसे’ प्रयुक्त है।
