source:
  edition: SBLGNT
  text: ταύτην δὲ θυγατέρα Ἀβραὰμ οὖσαν, ἣν ἔδησεν ὁ Σατανᾶς ἰδοὺ δέκα καὶ ὀκτὼ ἔτη, οὐκ ἔδει λυθῆναι ἀπὸ τοῦ δεσμοῦ τούτου τῇ ἡμέρᾳ τοῦ σαββάτου;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/016.yaml
  text: And ought not this woman, being a daughter of Abraham, whom Satan bound for eighteen years—look—be released from this bond on the Sabbath day?
translation:
  language: hi
  text: तो क्या इस स्त्री को, जो अब्राहम की बेटी है और जिसे शैतान ने—देखो—अठारह वर्षों से बाँध रखा है, सब्त के दिन इस बंधन से मुक्त नहीं किया जाना चाहिए था?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θυγατέρα Ἀβραὰμ
  choice: अब्राहम की बेटी
  rationale: यूनानी संबंधवाचक अभिव्यक्ति का सीधा और स्वाभाविक रूप; यह स्त्री की वाचा-समुदाय से संबद्धता को बनाए रखता है।
- source_word: ἔδησεν / λυθῆναι / δεσμοῦ
  choice: बाँध रखा था / मुक्त की जानी / बंधन
  rationale: मूल पाठ में बाँधने, खोले जाने और बंधन की परस्पर जुड़ी रूपक-श्रृंखला को हिन्दी में यथासंभव सुरक्षित रखा गया है।
- source_word: ἰδού
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले मूल अव्यय को छोड़ा नहीं गया; डैश के बीच रखकर वाक्य के प्रवाह में उसका बल बनाए रखा गया है।
- source_word: δέκα καὶ ὀκτὼ ἔτη
  choice: अठारह वर्ष से
  rationale: अवधि को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है और दीर्घकालिक बंधन का अर्थ स्पष्ट रखता है।
- source_word: τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: सब्त के दिन
  rationale: यहूदी धार्मिक-सांस्कृतिक पद को पारंपरिक और व्यापक रूप से समझे जाने वाले हिन्दी रूप में रखा गया है।
theological_decisions:
- issue: स्त्री की पहचान और प्रतिष्ठा
  choice: अब्राहम की बेटी
  alternative: अब्राहम की वंशज
  rationale: शाब्दिक पारिवारिक रूपक को बनाए रखना यीशु के तर्क और स्त्री को दी गई प्रतिष्ठित सामुदायिक पहचान—दोनों को सुरक्षित रखता है।
- issue: शैतान और रोग के बीच संबंध
  choice: जिसे शैतान ने ... बाँध रखा था
  alternative: जो शैतान के कारण रोगी थी
  rationale: मूल पाठ शैतान के बाँधने की भाषा बोलता है; अनुवाद न तो इस कथन को कमजोर करता है, न इससे रोग-विज्ञान संबंधी कोई व्यापक सिद्धांत निकालता है।
- issue: कर्तव्यसूचक प्रश्न
  choice: मुक्त नहीं की जानी चाहिए थी?
  alternative: क्या उसे मुक्त करना उचित नहीं था?
  rationale: οὐκ ἔδει की आवश्यकता/कर्तव्य की शक्ति और λυθῆναι के कर्मवाच्य रूप को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, मौखिक रूप से सहज और मूल यूनानी की अलंकारिक प्रश्न-रचना के निकट। ‘देखो’ को जानबूझकर रखा गया है, क्योंकि यह SBLGNT में उपस्थित ἰδού का स्पष्ट संकेत है।
