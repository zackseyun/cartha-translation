  text: ὁ δὲ ἀποκριθεὶς λέγει αὐτῷ· Κύριε, ἄφες αὐτὴν καὶ τοῦτο τὸ ἔτος, ἕως ὅτου σκάψω περὶ αὐτὴν καὶ βάλω κόπρια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/008.yaml
  text: But he answered and said to him[a], ‘Lord, leave it alone this year also[b], until I dig around it and put manure on it.’
translation:
  language: hi
  text: पर उसने उसे उत्तर में कहा, “मालिक, इसे इस वर्ष भी रहने दे[a], जब तक मैं इसके चारों ओर मिट्टी खोदूँ और इसके चारों ओर गोबर की खाद डालूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसे छोड़ दे” या “इसे बख्श दे।”
    reason: lexical_alternative
  - marker: b
    text: या अधिक सामान्य रूप में, “इसके चारों ओर खाद डालूँ।” यूनानी शब्द विशेष रूप से गोबर अथवा पशु-मल से बनी खाद का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς λέγει αὐτῷ
  choice: उसने उसे उत्तर दिया
  rationale: यूनानी का शाब्दिक ढाँचा ‘उत्तर देकर उससे कहता है’ है, पर यह सामी प्रभाव वाली सामान्य कथात्मक अभिव्यक्ति है। ‘उसने उसे उत्तर दिया’ दोनों क्रियाओं का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: Κύριε
  choice: मालिक
  rationale: दृष्टान्त में माली दाख की बारी के स्वामी को आदरपूर्वक संबोधित कर रहा है। इस संदर्भ में ‘मालिक’ स्वाभाविक है और संबोधन को अनावश्यक रूप से प्रत्यक्ष ईश्वरीय उपाधि नहीं बनाता।
- source_word: ἄφες αὐτὴν
  choice: इसे … रहने दे
  rationale: यहाँ ἀφίημι का अर्थ पेड़ को अभी वैसा ही रहने देना और न काटना है। ‘रहने दे’ मूल क्रिया को सहज हिन्दी में रखता है; ‘बख्श दे’ संदर्भगत मोहलत को अधिक स्पष्ट करता, पर क्रिया से कुछ अधिक व्याख्यात्मक होता।
- source_word: καὶ τοῦτο τὸ ἔτος
  choice: इस वर्ष भी
  rationale: 'καί अतिरिक्त अवधि का भाव देता है: पहले की अवधि के बाद यह वर्ष भी। ‘एक वर्ष और’ अर्थ की व्याख्या है, जबकि ‘इस वर्ष भी’ यूनानी अभिव्यक्ति के अधिक निकट है।'
- source_word: ἕως ὅτου
  choice: जब तक कि
  rationale: यह वाक्यांश मोहलत की अवधि को माली द्वारा किए जाने वाले कामों तक ले जाता है। ‘जब तक कि’ सटीक और स्वाभाविक हिन्दी संयोजक है।
- source_word: σκάψω περὶ αὐτὴν
  choice: मैं इसके चारों ओर खोदूँ
  rationale: σκάπτω का ठोस अर्थ ‘खोदना’ है। यह अनुवाद मिट्टी को ढीला करने जैसी संभावित कृषि-क्रिया की व्याख्या जोड़े बिना मूल चित्र बनाए रखता है।
- source_word: βάλω κόπρια
  choice: इसमें गोबर की खाद डालूँ
  rationale: κόπρια पशु-मल अथवा उससे बनी खाद को सूचित करता है। ‘गोबर की खाद’ मूल की ठोस कृषि-छवि बचाती है, और ‘इसमें … डालूँ’ पेड़ के चारों ओर खोदी गई मिट्टी के संदर्भ में स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दृष्टान्त में κύριος का संबोधन
  choice: मालिक
  alternative: प्रभु
  rationale: यहाँ वक्ता दृष्टान्त के भीतर दाख की बारी के स्वामी से बोलता है। ‘मालिक’ उस सामाजिक और कृषि-संदर्भ को स्पष्ट रखता है, जबकि ‘प्रभु’ सम्भव और पारंपरिक है, पर हिन्दी पाठक के लिए प्रत्यक्ष ईश्वरीय पहचान का अतिरिक्त संकेत दे सकता है। मूल में सम्मानसूचक संबोधन और स्वामित्व दोनों सम्भव हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। पेड़ के लिए व्याकरणिक रूप से पुल्लिंग ‘इसे’ प्रयुक्त हुआ है। संबोधन में ‘मालिक’ दृष्टान्त के कृषि-संदर्भ के अनुकूल है। ‘गोबर की खाद’ मूल की ठोस अभिव्यक्ति को बनाए रखती है।
