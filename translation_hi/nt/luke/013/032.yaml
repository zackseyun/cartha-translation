  text: καὶ εἶπεν αὐτοῖς· Πορευθέντες εἴπατε τῇ ἀλώπεκι ταύτῃ· Ἰδοὺ ἐκβάλλω δαιμόνια καὶ ἰάσεις ⸀ἀποτελῶ σήμερον καὶ αὔριον, καὶ τῇ τρίτῃ τελειοῦμαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/032.yaml
  text: And he said to them[a], “Go and tell that fox, ‘Look, I cast out demons and accomplish healings today and tomorrow, and on the third day I am brought to completion.’”
translation:
  language: hi
  text: उसने उनसे कहा, “जाकर उस लोमड़ी से कहो, ‘देखो, मैं आज और कल दुष्टात्माओं को निकालता और चंगाई के कार्य सम्पन्न करता हूँ, और तीसरे दिन मुझे पूर्णता तक पहुँचाया जाता है।’[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मैं अपनी मंज़िल तक पहुँचता हूँ,” “मैं पूर्ण किया जाता हूँ,” या “मैं अपना कार्य पूरा करता हूँ” भी हो सकता है। यूनानी शब्द का अर्थ पूर्णता तक पहुँचाया जाना या कार्य का पूरा होना हो सकता है; यहाँ संभवतः यीशु के लिए ठहराए गए मिशन की समाप्ति की ओर संकेत है।
    reason: τελειοῦμαι के अर्थ-विकल्प और उसके कर्मवाच्य स्वरूप को स्पष्ट करना।
lexical_decisions:
- source_word: ἀλώπεκι
  choice: लोमड़ी
  rationale: मूल पशु-रूपक को ज्यों का त्यों रखा गया है; ‘धूर्त’ जैसे अर्थ को स्पष्ट जोड़कर रूपक की व्याख्या नहीं की गई। ταύτῃ का संकेत ‘उस’ से व्यक्त होता है।
- source_word: Ἰδοὺ
  choice: देख
  rationale: यह आगे की बात पर ध्यान खींचने वाला सहज, आधुनिक और अनौपचारिक आदेश है।
- source_word: ἐκβάλλω δαιμόνια
  choice: दुष्टात्माओं को निकालता हूँ
  rationale: सुसमाचारों में झाड़ने या बाहर निकालने की क्रिया के लिए यह स्वाभाविक हिन्दी अभिव्यक्ति है और ἐκβάλλω की शक्ति बनाए रखती है।
- source_word: ἰάσεις ἀποτελῶ
  choice: चंगा करने के काम पूरे करता हूँ
  rationale: ἰάσεις को चंगा करने के कार्यों और ἀποτελῶ को उन्हें पूरा करने के रूप में व्यक्त किया गया है। इससे पूर्ववर्ती ‘निकालता’ से क्रियात्मक भेद बना रहता है, यद्यपि सहज हिन्दी के लिए ‘काम’ जोड़ा गया है।
- source_word: σήμερον καὶ αὔριον
  choice: आज और कल
  rationale: सीधे समय-सूचक शब्द मूल के शाब्दिक अर्थ तथा एक छोटी, निश्चित अवधि के संभावित मुहावरेदार भाव—दोनों को खुला रखते हैं।
- source_word: τῇ τρίτῃ
  choice: तीसरे दिन
  rationale: क्रमवाचक दत्तिव का स्वाभाविक कालवाचक हिन्दी रूप।
- source_word: τελειοῦμαι
  choice: मुझे पूर्णता तक पहुँचाया जाता है
  rationale: यह रूप यूनानी के वर्तमान कर्मवाच्य को बनाए रखता है और लक्ष्य तक पहुँचने, कार्य पूरा होने या पूर्ण किए जाने के बीच मूल अर्थगत विस्तार को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: τελειοῦμαι का यीशु के मिशन, मृत्यु और संभावित पुनरुत्थान-संकेत से संबंध
  choice: मुझे पूर्णता तक पहुँचाया जाता है
  alternative: मैं अपनी मंज़िल तक पहुँचता हूँ; मैं पूर्ण किया जाता हूँ; मेरा कार्य पूरा होता है
  rationale: पद यीशु के नियुक्त कार्य की परिणति की ओर संकेत कर सकता है, जिसमें उसकी मृत्यु और परमेश्वर द्वारा पुष्टि निहित हो सकती है; पर यूनानी यहाँ पुनरुत्थान या महिमा का स्पष्ट उल्लेख नहीं करता। इसलिए मुख्य पाठ कर्मवाच्य और धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लोमड़ी’ का रूपक बिना व्याख्यात्मक विशेषण के सुरक्षित है। अंतिम वाक्यांश जानबूझकर कुछ औपचारिक है, ताकि यूनानी कर्मवाच्य और उसके खुले धर्मवैज्ञानिक अर्थ को बनाए रखा जा सके।
