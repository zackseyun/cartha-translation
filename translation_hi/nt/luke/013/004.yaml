  text: ἢ ἐκεῖνοι οἱ ⸀δεκαοκτὼ ἐφ’ οὓς ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ καὶ ἀπέκτεινεν αὐτούς, δοκεῖτε ὅτι ⸀αὐτοὶ ὀφειλέται ἐγένοντο παρὰ πάντας ⸀τοὺς ἀνθρώπους τοὺς ⸀κατοικοῦντας Ἰερουσαλήμ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/004.yaml
  text: Or those eighteen on whom the tower in Siloam fell and killed them—do you think that they became debtors beyond all the men living in Jerusalem?[a][b]
translation:
  language: hi
  text: या उन अठारह लोगों को, जिन पर शीलोह में वह बुर्ज गिर पड़ा और उन्हें मार डाला—क्या तुम समझते हो कि वे यरूशलेम में रहनेवाले सभी लोगों से अधिक दोषी थे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अधिक दोषी” के स्थान पर शाब्दिक रूप से “अधिक ऋणी”; यूनानी शब्द ὀφειλέται का मूल अर्थ “ऋणी” है, पर यहाँ संभवतः नैतिक दोष या जवाबदेही का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἢ
  choice: या
  rationale: यह पिछले उदाहरण के साथ एक और वैकल्पिक उदाहरण जोड़ता है और यीशु के तर्क का प्रश्नात्मक प्रवाह बनाए रखता है।
- source_word: ἐκεῖνοι οἱ δεκαοκτώ
  choice: उन अठारह लोगों
  rationale: संकेतवाचक पद और संख्या को स्वाभाविक हिन्दी में व्यक्त करता है; 'लोगों' से मानव-संदर्भ स्पष्ट होता है, पर केवल पुरुष होने का अनावश्यक दावा नहीं किया जाता।
- source_word: ἔπεσεν ὁ πύργος ἐν τῷ Σιλωὰμ
  choice: शीलोह का बुर्ज गिर पड़ा
  rationale: ग्रीक में बुर्ज के गिरने का सीधा कथन है। संबंधसूचक हिन्दी स्थान को सहज ढंग से व्यक्त करती है; 'ढह गया' की अपेक्षा 'गिर पड़ा' स्रोत के अधिक निकट है।
- source_word: ἀπέκτεινεν αὐτούς
  choice: उन्हें मार डाला
  rationale: निर्जीव कर्ता के कारण हुई मृत्यु को सरल और स्पष्ट हिन्दी में व्यक्त करता है, बिना न्यायिक दंड का भाव जोड़े।
- source_word: δοκεῖτε ὅτι
  choice: क्या तुम समझते हो कि
  rationale: यीशु की सीधी चुनौती और प्रश्नात्मक रूप को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: ὀφειλέται
  choice: दोषी
  rationale: शब्द का मूल अर्थ 'ऋणी' है, पर इस प्रसंग में नैतिक देयता या अपराध का भाव है। मुख्य पाठ में 'दोषी' हिन्दी में अर्थसंगत है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: ἐγένοντο παρὰ πάντας
  choice: बाकी सब ... से अधिक ... थे
  rationale: γίνομαι को यहाँ हिन्दी में अलग से 'बन गए' कहना भ्रामक लग सकता है; तुलनात्मक आशय को स्वाभाविक ढंग से व्यक्त किया गया है। 'बाकी' तुलना में मारे गए अठारह लोगों और अन्य निवासियों का संबंध स्पष्ट करता है।
- source_word: τοὺς ἀνθρώπους τοὺς κατοικοῦντας Ἰερουσαλήμ
  choice: यरूशलेम में रहनेवाले बाकी सब लोगों
  rationale: ἄνθρωποι यहाँ यरूशलेम के निवासियों को सामान्यतः दर्शाता है, इसलिए समावेशी 'लोगों' उपयुक्त है; वर्तमान कृदंत का भाव 'रहनेवाले' से बना रहता है।
theological_decisions:
- issue: इस प्रसंग में ὀφειλέται का अर्थ
  choice: अधिक दोषी
  alternative: अधिक ऋणी; बड़े पापी; अधिक अपराधी
  rationale: वचन 2 के 'पापी' को यांत्रिक रूप से यहाँ आयात नहीं किया गया। 'दोषी' नैतिक देयता का अर्थ संप्रेषित करता है और 'अधिक' παρά की तुलना को व्यक्त करता है; शाब्दिक 'ऋणी' पादटिप्पणी में दिया गया है ताकि मूल रूपक न खोए।
- issue: ἀνθρώπους का लिंग-संदर्भ
  choice: लोगों
  alternative: मनुष्यों; पुरुषों
  rationale: यहाँ संदर्भ यरूशलेम में रहने वाले मानव समुदाय का है, केवल पुरुषों का नहीं। इसलिए 'लोगों' सटीक और स्वाभाविक है।
- issue: ἐγένοντο की क्रियात्मक बारीकी
  choice: थे
  alternative: हो गए थे; ठहरे थे
  rationale: ग्रीक में γίνομαι है, किंतु हिन्दी में 'अधिक दोषी हो गए' दुर्घटना द्वारा उनके दोषी बनने का गलत कारणात्मक संकेत दे सकता है। प्रश्न का आशय उनकी तुलनात्मक दोषिता के विषय में धारणा को चुनौती देना है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। 'शीलोह' प्रचलित बाइबलीय स्थान-नाम है और 'बुर्ज' πύργος के लिए सहज शब्द है। वाक्य को बोलचाल की अनौपचारिकता से बचाते हुए यीशु के तीखे आलंकारिक प्रश्न के रूप में रखा गया है।
