  yaml_path: translation/nt/luke/013/011.yaml
  text: And behold[a], there was a woman who had a spirit of infirmity for eighteen years, and she was bent over and unable to straighten up completely.
translation:
  language: hi
  text: और देखो, एक स्त्री थी, जिसमें अठारह वर्षों से दुर्बलता की आत्मा थी[a]। वह झुकी हुई थी और पूरी तरह सीधी हो पाने में असमर्थ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दुर्बल करने वाली आत्मा’ या ‘दुर्बलता की आत्मा।’ यूनानी में ‘आत्मा’ का स्पष्ट उल्लेख है, जो उसकी पीड़ा में किसी आत्मिक कारक की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह कथावृत्त में ध्यान आकर्षित करने वाली जीवंत अभिव्यक्ति है; आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल का बल बनाए रखती है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: प्रसंग में पहली बार एक स्त्री का परिचय कराया जा रहा है, इसलिए अनिश्चित अर्थ स्वाभाविक है।
- source_word: πνεῦμα ἔχουσα ἀσθενείας
  choice: जिसमें ... दुर्बलता की आत्मा थी
  rationale: मूल में ‘आत्मा’ स्पष्ट रूप से है और ‘दुर्बलता’ संबंधवाचक पद के रूप में जुड़ा है। यह अनुवाद आत्मिक कारक की संभावना को बनाए रखता है, पर इससे अधिक विशिष्ट दुष्टात्मा-संबंधी निष्कर्ष नहीं जोड़ता।
- source_word: ἀσθενείας
  choice: दुर्बलता
  rationale: यह शारीरिक अशक्तता या रोगग्रस्तता के व्यापक अर्थ को बनाए रखता है; ‘बीमारी’ अर्थ को कुछ अधिक सीमित कर देती।
- source_word: ἔτη δεκαοκτώ
  choice: अठारह वर्षों से
  rationale: हिन्दी में अवधि और लगातार बनी अवस्था व्यक्त करने का स्वाभाविक रूप।
- source_word: συγκύπτουσα
  choice: झुककर दोहरी हो गई थी
  rationale: शब्द शरीर के आगे झुक जाने की प्रबल अवस्था बताता है; यह हिन्दी में स्पष्ट और चित्रात्मक है।
- source_word: μὴ δυναμένη ἀνακύψαι
  choice: सीधी नहीं हो सकती थी
  rationale: उसकी असमर्थता और फिर से सीधा होने की शारीरिक क्रिया, दोनों स्पष्ट होते हैं।
- source_word: εἰς τὸ παντελές
  choice: पूरी तरह
  rationale: यह उसकी सीधी न हो पाने की असमर्थता को पूर्ण रूप से तीव्र करता है।
theological_decisions:
- issue: क्या πνεῦμα ἀσθενείας में आत्मिक कारक को मुख्य पाठ में बनाए रखा जाए
  choice: ‘दुर्बलता की आत्मा’ को मुख्य पाठ में रखा गया
  alternative: ‘दुर्बल करने वाली आत्मा’ अथवा केवल ‘बीमारी’
  rationale: यूनानी पाठ πνεῦμα (‘आत्मा’) का स्पष्ट उल्लेख करता है। ‘दुर्बलता की आत्मा’ मूल की संरचना और उसकी धर्मवैचारिक अस्पष्टता को बनाए रखती है तथा इसे न केवल चिकित्सकीय दशा बनाती है, न स्पष्ट रूप से दुष्टात्मा का अधिकार घोषित करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘देखो’ कथन की जीवंतता बनाए रखता है; ‘दुर्बलता की आत्मा’ मूल की असामान्य अभिव्यक्ति और निहित धर्मवैचारिक तनाव को जानबूझकर सुरक्षित रखता है।
