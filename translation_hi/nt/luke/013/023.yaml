lexical_decisions:
- source_word: δέ
  choice: तब / इस पर
  rationale: दोनों स्थानों पर δέ कथा और संवाद को हल्के संयोजक के रूप में आगे बढ़ाता है; हिन्दी में प्रसंगानुसार ये रूप स्वाभाविक हैं और अनावश्यक विरोध नहीं दर्शाते।
- source_word: τις
  choice: किसी ने
  rationale: यह अनिश्चित व्यक्ति का संकेत है; उसका परिचय या लिंग पाठ में स्पष्ट नहीं किया गया है।
- source_word: αὐτῷ
  choice: उनसे
  rationale: यूनानी में सर्वनाम ‘उससे’ है; यीशु के लिए हिन्दी का आदरसूचक बहुवचन स्वाभाविक है और इस पद में उनका नाम जोड़ने से बचता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह सम्मानसूचक संबोधन भी हो सकता है और अधिक गहरा प्रभुत्व-सूचक पद भी; ‘प्रभु’ लूका के प्रयोग की इस खुली धार्मिक अर्थ-छाया को बनाए रखता है।
- source_word: εἰ ὀλίγοι
  choice: क्या केवल थोड़े ही
  rationale: εἰ यहाँ प्रश्न आरम्भ करता है और ὀλίγοι छोटी संख्या पर बल देता है; यह हिन्दी रूप प्रश्न की सीमित संख्या वाली धारणा को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: οἱ σῳζόμενοι
  choice: लोगों का उद्धार हो रहा है
  rationale: सवर्णयुक्त वर्तमान कर्मवाच्य कृदन्त का अर्थ ‘वे जिनका उद्धार हो रहा है’ है; चुना हुआ रूप जारी प्रक्रिया और कर्मवाच्यता दोनों को स्पष्ट, स्वाभाविक हिन्दी में रखता है।
- source_word: πρὸς αὐτούς
  choice: उन लोगों से
  rationale: यूनानी सर्वनाम स्पष्ट रूप से बहुवचन है; यह उत्तर को केवल प्रश्न पूछनेवाले व्यक्ति तक सीमित नहीं करता।
theological_decisions:
- issue: Κύριε संबोधन का आशय
  choice: प्रभु
  alternative: महोदय / स्वामी
  rationale: पाठ स्वयं यह निश्चित नहीं करता कि संबोधन केवल शिष्टाचार है या मसीही प्रभुत्व की स्वीकृति भी; ‘प्रभु’ इस धार्मिक तनाव को खुला रखता है।
- issue: σῳζόμενοι का काल-पक्ष और कर्मवाच्यता
  choice: लोगों का उद्धार हो रहा है
  alternative: उद्धार पानेवाले लोग
  rationale: वर्तमान कर्मवाच्य रूप को चल रही प्रक्रिया के रूप में रखा गया है, बिना उद्धार के क्रम या सिद्धान्त के विषय में कोई अतिरिक्त धार्मिक निष्कर्ष जोड़े।
- issue: उत्तर का बहुवचन श्रोता-समूह
  choice: उन लोगों से
  alternative: उनसे
  rationale: αὐτούς बहुवचन है; स्पष्ट हिन्दी शब्दावली उस परिवर्तन को बचाती है जिसमें प्रश्न एक व्यक्ति पूछता है, पर उत्तर अनेक लोगों को दिया जाता है।
