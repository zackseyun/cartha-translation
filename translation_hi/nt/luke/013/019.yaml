id: LUK.13.19
reference: Luke 13:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁμοία ἐστὶν κόκκῳ σινάπεως, ὃν λαβὼν ἄνθρωπος ἔβαλεν εἰς κῆπον ἑαυτοῦ, καὶ ηὔξησεν καὶ ἐγένετο εἰς ⸀δένδρον, καὶ τὰ πετεινὰ τοῦ οὐρανοῦ κατεσκήνωσεν ἐν τοῖς κλάδοις αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/019.yaml
  text: It is like a mustard seed[a], which a man took and threw into his garden, and it grew and became a tree[b], and the birds of the sky nested in its branches.
translation:
  language: hi
  text: वह राई के एक दाने के समान है, जिसे एक आदमी ने लेकर अपने बगीचे में डाल दिया। वह बढ़ा और एक पेड़[a] बन गया, और आकाश के पक्षियों[b] ने उसकी डालियों में बसेरा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में स्पष्टतः ‘पेड़ बन गया’ है; यह दृष्टान्त में वृद्धि की विस्तृत छवि को बनाए रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘स्वर्ग के पक्षियों’; पर यहाँ ‘आकाश’ स्थान-संबंधी अर्थ को अधिक स्वाभाविक ढंग से व्यक्त करता है। परम्परागत रूप से ‘हवा के पक्षी’ भी कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία ἐστὶν
  choice: के समान है
  rationale: यह राज्य के दृष्टान्तों में प्रयुक्त सामान्य उपमा-सूत्र है; यह हिन्दी में स्वाभाविक है और तुलना को स्पष्ट रखता है।
- source_word: κόκκῳ σινάπεως
  choice: राई के एक दाने
  rationale: κόκκος का अर्थ दाना या बीज हो सकता है; राई के संदर्भ में ‘दाना’ आधुनिक हिन्दी का परिचित और स्वाभाविक प्रयोग है।
- source_word: ὃν λαβὼν ἄνθρωπος
  choice: जिसे एक आदमी ने लेकर
  rationale: दृष्टान्त में एक पुरुष पात्र का उल्लेख है; ‘एक आदमी’ स्रोत के एकवचन और पुरुष-संदर्भ को बनाए रखता है।
- source_word: ἔβαλεν εἰς κῆπον ἑαυτοῦ
  choice: अपने बगीचे में डाल दिया
  rationale: βάλλω के ‘डालना’ अर्थ को रखा गया है; ‘बोया’ कहना स्रोत में निहित क्रिया से अधिक व्याख्यात्मक होता। κῆπος के लिए विशिष्ट ‘बगीचा’ उपयुक्त है।
- source_word: ηὔξησεν
  choice: वह बढ़ा
  rationale: यह पौधे की वृद्धि का सीधा और स्वाभाविक हिन्दी वर्णन है।
- source_word: ἐγένετο εἰς δένδρον
  choice: एक पेड़ बन गया
  rationale: δένδρον का सीधा अर्थ ‘पेड़’ है; यह दृष्टान्त की आश्चर्यजनक रूप से बड़ी वृद्धि की छवि को सुरक्षित रखता है।
- source_word: τὰ πετεινὰ τοῦ οὐρανοῦ
  choice: आकाश के पक्षियों
  rationale: यह τοῦ οὐρανοῦ के स्थान-संबंधी अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: κατεσκήνωσεν
  choice: बसेरा किया
  rationale: पक्षियों के संदर्भ में यह बसने या टिकने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अनिवार्य रूप से घोंसला बनाने की अतिरिक्त विशिष्टता जोड़ने के।
- source_word: ἐν τοῖς κλάδοις αὐτοῦ
  choice: उसकी डालियों में
  rationale: κλάδοις के लिए ‘डालियाँ’ साधारण पाठकों के लिए सहज है और सर्वनाम पेड़ की ओर स्पष्ट संकेत करता है।
theological_decisions:
- issue: ἄνθρωπος का लिंग-संबंधी अनुवाद
  choice: एक आदमी
  alternative: कोई व्यक्ति
  rationale: यहाँ शब्द किसी सामान्य मानव-समूह के बजाय दृष्टान्त के एकवचन पुरुष पात्र को प्रस्तुत करता है; इसलिए पुरुष-संदर्भ को बनाए रखा गया है।
- issue: राई के दृष्टान्त में δένδρον की छवि
  choice: पेड़
  alternative: बड़ा पौधा या झाड़ी
  rationale: यूनानी पाठ स्पष्ट रूप से δένδρον, अर्थात ‘पेड़’, कहता है। वनस्पति-विज्ञान के आधार पर छवि को नरम करने के बजाय दृष्टान्त की अतिशयोक्तिपूर्ण या विस्तृत वृद्धि को ज्यों का त्यों रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘डाल दिया’ मूल क्रिया की सजीवता रखता है, जबकि ‘बसेरा किया’ पक्षियों के बसने की छवि को अनावश्यक व्याख्यात्मक विस्तार के बिना व्यक्त करता है।
