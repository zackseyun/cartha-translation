id: LUK.13.14
reference: Luke 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀποκριθεὶς δὲ ὁ ἀρχισυνάγωγος, ἀγανακτῶν ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς, ἔλεγεν τῷ ὄχλῳ ⸀ὅτι Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι· ἐν ⸀αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/014.yaml
  text: But the synagogue ruler answered[a], indignant because Jesus had healed on the Sabbath, and said to the crowd, “There are six days in which it is necessary to work; so come on those days and be healed, and not on the day of the Sabbath.”
translation:
  language: hi
  text: पर आराधनालय के प्रधान ने, इस बात पर क्रोधित होकर कि यीशु ने सब्त के दिन चंगा किया था, भीड़ से जवाब में कहा, “छह दिन हैं जिनमें काम करना आवश्यक है; इसलिए उन्हीं दिनों में आकर चंगे हो जाओ, सब्त के दिन नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ
  choice: पर ... उसने ... कहा
  rationale: δέ पिछले चंगाई-वृत्तांत के प्रति विरोध का मोड़ दिखाता है। ἀποκριθείς यहाँ प्रतिक्रिया में बोलने का सूत्र है; हिंदी में अलग से ‘उत्तर देकर’ कहना अप्राकृतिक होता, इसलिए ‘उसने ... कहा’ में उसका वाक्य-कार्य समाहित है।
- source_word: ἀρχισυνάγωγος
  choice: आराधनालय का अगुआ
  rationale: यह आराधनालय के कामकाज की देखरेख करने वाले पदाधिकारी को सूचित करता है; ‘अगुआ’ नागरिक शासक का भाव दिए बिना भूमिका स्पष्ट करता है।
- source_word: ἀγανακτῶν
  choice: क्रोधित था
  rationale: यह प्रबल रोष या नाराज़गी व्यक्त करता है। वर्तमान कृदंत की समकालिक अवस्था हिंदी में ‘क्रोधित था’ से स्वाभाविक रूप में आती है।
- source_word: ὅτι τῷ σαββάτῳ ἐθεράπευσεν ὁ Ἰησοῦς
  choice: इस बात से ... कि यीशु ने सब्त के दिन चंगा किया था
  rationale: ὅτι कारण बताता है और चंगा करने की घटना उसके बोलने से पहले हुई थी; ‘किया था’ उस पूर्वता को स्पष्ट करता है।
- source_word: ἔλεγεν τῷ ὄχλῳ
  choice: उसने भीड़ से कहा
  rationale: इम्परफेक्ट ἔλεγεν को इस प्रसंग में सरल हिंदी कथात्मक भूतकाल स्वाभाविक ढंग से व्यक्त करता है; ‘कह रहा था’ अनावश्यक रूप से दृश्य को खींच सकता है।
- source_word: Ἓξ ἡμέραι εἰσὶν ἐν αἷς δεῖ ἐργάζεσθαι
  choice: छः दिन हैं जिनमें काम करना आवश्यक है
  rationale: यह यूनानी संरचना और δεῖ के आवश्यकता/बाध्यता के भाव को निकटता से रखता है, जबकि हिंदी सुबोध रहती है।
- source_word: ἐν αὐταῖς οὖν ἐρχόμενοι θεραπεύεσθε
  choice: इसलिए उन्हीं दिनों में आकर चंगे होओ
  rationale: οὖν निष्कर्ष सूचित करता है, ἐρχόμενοι आने की क्रिया और θεραπεύεσθε चंगा किए जाने का भाव रखता है। ‘चंगे होओ’ हिंदी में स्वाभाविक निष्क्रिय अर्थ देता है।
- source_word: καὶ μὴ τῇ ἡμέρᾳ τοῦ σαββάτου
  choice: सब्त के दिन नहीं
  rationale: संक्षिप्त निषेध मूल कथन के तीखे विरोध को बनाए रखता है और हिंदी में अनावश्यक पुनरुक्ति से बचता है।
theological_decisions:
- issue: काम और चंगाई के उचित दिनों के विषय में आराधनालय के अगुए का दावा
  choice: 'उसकी बाध्यतामूलक आपत्ति को सीधे उद्धृत किया गया है: ‘छः दिन हैं जिनमें काम करना आवश्यक है।’'
  alternative: कथन को ढीले रूप में ऐसा कहना कि वह स्पष्टतः पाखंडी नियम बना रहा था।
  rationale: पद उसके दृष्टिकोण को रिपोर्ट करता है, उसका समर्थन नहीं करता। अनुवाद उसके नियमबद्ध तर्क और कथानक के तनाव को बनाए रखता है, पर व्याख्यात्मक निंदा नहीं जोड़ता।
- issue: सब्त का नाम
  choice: सब्त
  alternative: विश्राम-दिन
  rationale: ‘सब्त’ ऐतिहासिक यहूदी दिन का स्थापित और विशिष्ट नाम है। ‘विश्राम-दिन’ अर्थ समझा सकता है, पर इस संदर्भ में नाम की सांस्कृतिक-धार्मिक विशिष्टता कुछ कम कर देता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य को अत्यधिक संस्कृतनिष्ठ बनाने से बचते हुए ‘आवश्यक’ से δεῖ की बाध्यता सुरक्षित रखी गई है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
