source:
  edition: SBLGNT
  text: Παρῆσαν δέ τινες ἐν αὐτῷ τῷ καιρῷ ἀπαγγέλλοντες αὐτῷ περὶ τῶν Γαλιλαίων ὧν τὸ αἷμα Πιλᾶτος ἔμιξεν μετὰ τῶν θυσιῶν αὐτῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/001.yaml
  text: Some were present at that very time reporting to him about the Galileans whose blood Pilate had mixed with their sacrifices[a].
translation:
  language: hi
  text: उसी समय कुछ लोग उपस्थित थे, जो उसे उन गलीलियों के बारे में बता रहे थे, जिनका लहू पिलातुस ने उनके बलिदानों के साथ मिला दिया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके बलिदानों में मिला दिया था।’
    reason: μίγνυμι और μετά की रचना को हिन्दी में ‘के साथ मिलाना’ अथवा ‘में मिलाना’ दोनों प्रकार से व्यक्त किया जा सकता है; दूसरा रूप अधिक घनिष्ठ मिश्रण पर बल देता है।
lexical_decisions:
- source_word: Παρῆσαν
  choice: मौजूद थे
  rationale: अपूर्णकालिक क्रिया यहाँ कुछ लोगों के वहाँ उपस्थित होने की स्थिति बताती है; ‘मौजूद थे’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: δέ
  choice: अलग शब्द से व्यक्त नहीं; वाक्य-संक्रमण ‘उसी समय’ में निहित
  rationale: δέ हल्का कथात्मक संक्रमण सूचित करता है। हिन्दी में अलग से ‘अब’ या ‘परन्तु’ जोड़ना अनावश्यक और अर्थ से अधिक प्रबल होता।
- source_word: τινες
  choice: कुछ लोग
  rationale: अनिश्चित बहुवचन को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: ἐν αὐτῷ τῷ καιρῷ
  choice: उसी समय
  rationale: αὐτῷ का विशिष्ट और पूर्व प्रसंग से जुड़ा समय-संकेत संक्षेप में सुरक्षित रहता है।
- source_word: ἀπαγγέλλοντες αὐτῷ
  choice: जो उसे ... बता रहे थे
  rationale: कृदन्त का समकालिक, जारी प्रतिवेदन हिन्दी में स्वाभाविक रूप से व्यक्त होता है; ‘उसे’ मूल के सर्वनाम को बिना अनावश्यक नाम जोड़े सुरक्षित रखता है।
- source_word: περὶ τῶν Γαλιλαίων
  choice: उन गलीलियों के बारे में
  rationale: περί के विषयसूचक अर्थ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: ὧν τὸ αἷμα
  choice: जिनका लहू
  rationale: सम्बन्धवाचक रचना और रक्त के स्पष्ट अर्थ को संक्षिप्त, गरिमापूर्ण हिन्दी में रखता है।
- source_word: Πιλᾶτος
  choice: पिलातुस
  rationale: नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण है।
- source_word: ἔμιξεν
  choice: मिला दिया था
  rationale: μίγνυμι के ‘मिलाना’ अर्थ और सूचना दिए जाने से पहले घट चुकी घटना—दोनों को व्यक्त करता है।
- source_word: μετὰ τῶν θυσιῶν αὐτῶν
  choice: उनके बलिदानों के साथ
  rationale: μετά के ‘साथ’ अर्थ और αὐτῶν के सम्बन्ध को सुरक्षित रखता है तथा यह नहीं बताता कि वे ठीक उसी क्षण बलिदान चढ़ा रहे थे या नहीं।
theological_decisions:
- issue: पिलातुस के कृत्य का ऐतिहासिक और नैतिक स्वरूप
  choice: गलीलियों का लहू उनके बलिदानों के साथ मिलाने की घटना को उसी कठोर, संक्षिप्त रूप में रखा गया है।
  alternative: व्याख्यात्मक रूप से कहना कि पिलातुस ने उन्हें बलिदान चढ़ाते समय मरवा डाला।
  rationale: यूनानी पाठ घटना की प्रक्रिया या उसका धर्मवैज्ञानिक अर्थ स्पष्ट नहीं करता। अनुवाद उस अस्पष्टता और आघात को बनाए रखता है तथा अतिरिक्त ऐतिहासिक विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। ‘लहू’ सामान्यतः समझ में आने वाला तथा बलिदान-संदर्भ के अनुकूल शब्द है। मूल के सर्वनाम ‘उसे’ को बनाए रखा गया है और यीशु का नाम व्याख्यात्मक रूप से नहीं जोड़ा गया।
