source:
  edition: SBLGNT
  text: ἰδοὺ ἀφίεται ὑμῖν ὁ οἶκος ⸀ὑμῶν. λέγω ⸀δὲ ⸀ὑμῖν, οὐ μὴ ⸂ἴδητέ με⸃ ἕως ⸂ἥξει ὅτε⸃ εἴπητε· Εὐλογημένος ὁ ἐρχόμενος ἐν ὀνόματι κυρίου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/035.yaml
  text: Look[a], your house is left to you. And I tell you, you will certainly not see me until the time comes when you say[d][c][b], ‘Blessed is the one who comes in the name of the Lord.’
translation:
  language: hi
  text: देखो, तुम्हारा घर[b] तुम्हारे ही लिए छोड़ दिया जाता है।[a] और मैं तुमसे कहता हूँ, तुम मुझे तब तक बिलकुल भी नहीं देखोगे, जब तक वह समय न आ जाए जब तुम कहोगे,[d] ‘धन्य है वह जो प्रभु के नाम से आता है।’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “त्याग दिया जाता है” अथवा “परित्यक्त छोड़ दिया जाता है।” यूनानी कर्मवाच्य में न्यायस्वरूप छोड़ दिए जाने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तुम्हारा घर” संभवतः यरूशलेम, विशेषकर उसके मंदिर, की ओर संकेत करता है; पर यूनानी पाठ केवल “तुम्हारा घर” कहता है।
    reason: alternative_reading
  - marker: c
    text: “धन्य है वह जो प्रभु के नाम से आता है” भजन 118:26 की प्रतिध्वनि है।
    reason: cross_reference
  - marker: d
    text: कुछ व्याख्याकार इसे यीशु के विजयी प्रवेश से जोड़ते हैं, जबकि दूसरे इसे भविष्य में उसे स्वीकार किए जाने से जोड़ते हैं। यूनानी पाठ स्वयं किसी एक समय को अनिवार्य नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचते हुए एक गंभीर घोषणा का परिचय देता है; ‘देखो’ आधुनिक और स्वाभाविक हिंदी में इसके उद्बोधन-बल को बनाए रखता है।
- source_word: ἀφίεται
  choice: छोड़ दिया जाता है
  rationale: वर्तमान कर्मवाच्य को बनाए रखते हुए यह ‘छोड़ दिए जाने’ का अर्थ देता है और मुख्य पाठ में ‘उजाड़’ या ‘त्यागा हुआ’ जैसी अधिक व्याख्यात्मक तीव्रता नहीं जोड़ता।
- source_word: ὁ οἶκος ὑμῶν
  choice: तुम्हारा घर
  rationale: यूनानी का सीधा अर्थ यही है। संदर्भ में यरूशलेम और विशेषतः मंदिर का संकेत संभव है, पर मुख्य पाठ में उसे संकीर्ण रूप से निर्दिष्ट नहीं किया गया।
- source_word: λέγω δὲ ὑμῖν
  choice: और मैं तुमसे कहता हूँ
  rationale: यहाँ δέ कथन को आगे बढ़ाता है; ‘और’ अनावश्यक रूप से प्रबल विरोध जोड़े बिना संक्रमण को स्वाभाविक बनाता है।
- source_word: οὐ μὴ ἴδητέ με
  choice: तुम मुझे ... कदापि नहीं देखोगे
  rationale: οὐ μή की प्रबल भविष्यात्मक नकारात्मकता को आधुनिक, गरिमापूर्ण हिंदी में स्पष्ट करता है।
- source_word: ἕως ἥξει ὅτε
  choice: जब तक वह समय न आए जब
  rationale: यूनानी कालवाचक मुहावरे का अर्थ स्वाभाविक हिंदी में व्यक्त करता है, बिना घटना का विशिष्ट समय तय किए।
- source_word: εἴπητε
  choice: तुम कहोगे
  rationale: भविष्य में होने वाले कथन को हिंदी में स्पष्ट और स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: Εὐλογημένος ὁ ἐρχόμενος
  choice: धन्य है वह जो ... आता है
  rationale: आशीर्वाद-सूत्र और भजन 118:26 की शास्त्रीय प्रतिध्वनि को सुरक्षित रखता है।
- source_word: ἐν ὀνόματι κυρίου
  choice: प्रभु के नाम से
  rationale: ‘नाम में/नाम से’ के प्रतिनिधित्व और अधिकार के भाव को स्वाभाविक हिंदी बाइबलीय प्रयोग में व्यक्त करता है।
theological_decisions:
- issue: ‘तुम्हारा घर’ का संदर्भ
  choice: मुख्य पाठ में ‘तुम्हारा घर’ रखा गया
  alternative: मंदिर; यरूशलेम; इस्राएल का घर/राष्ट्र
  rationale: निकट संदर्भ सामूहिक रूप से यरूशलेम और संभवतः मंदिर की ओर संकेत करता है, पर यूनानी केवल ‘तुम्हारा घर’ कहता है। इसलिए संभावित संदर्भ को पादटिप्पणी में रखा गया है।
- issue: अंतिम उद्धरण का समय और आशय
  choice: भविष्य की स्वीकृति को व्यापक रूप में रखा गया, समय निश्चित नहीं किया गया
  alternative: विजयी प्रवेश; यरूशलेम/इस्राएल का भविष्य का मन-फिराव; यीशु के पुनरागमन पर अंतिम स्वीकृति
  rationale: यूनानी वाक्य किसी एक व्याख्यात्मक समय-सरणी को अनिवार्य नहीं करता; इसलिए मुख्य पाठ वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन में बहुवचन ‘तुम’ रखा गया है क्योंकि ὑμῖν/ὑμῶν बहुवचन हैं। शैली सरल, गंभीर और शास्त्रीय प्रतिध्वनि के अनुरूप है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में संबद्ध पदांशों के बाद दिए गए हैं।
