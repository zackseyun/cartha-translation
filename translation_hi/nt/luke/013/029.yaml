  yaml_path: translation/nt/luke/013/029.yaml
  text: And they will come from east and west[a], and from north and south, and will recline at table in the kingdom of God.
translation:
  language: hi
  text: और लोग पूर्व और पश्चिम से, उत्तर और दक्षिण से आएँगे और परमेश्वर के राज्य में भोज में बैठेंगे।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘मेज़ पर टेक लगाकर बैठेंगे’; यूनानी क्रिया विशेष रूप से भोज के लिए लेटकर या टेक लगाकर भोजन करने की प्राचीन प्रथा को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἥξουσιν
  choice: आएँगे
  rationale: ἥκω का भविष्यकाल यहाँ दिशासूचक वाक्यांशों के साथ स्वाभाविक रूप से ‘आएँगे’ है।
- source_word: ἀπὸ ἀνατολῶν καὶ δυσμῶν
  choice: पूर्व और पश्चिम से
  rationale: बहुवचन शब्दों का शाब्दिक अर्थ ‘सूर्योदयों’ और ‘सूर्यास्तों’ से जुड़ा है, पर यहाँ वे दिशाओं के प्रचलित मुहावरे हैं।
- source_word: ἀπὸ βορρᾶ καὶ νότου
  choice: उत्तर और दक्षिण से
  rationale: ἀπό के साथ ये शब्द चारों दिशाओं से आने के व्यापक भौगोलिक चित्र को पूरा करते हैं।
- source_word: ἀνακλιθήσονται
  choice: भोज के लिए लेटेंगे
  rationale: ἀνακλίνω भोज के प्रसंग में मेज़ के पास टिककर या लेटकर भोजन करने को दर्शाता है; यह चयन प्राचीन भोज-प्रथा की ठोस छवि को बनाए रखते हुए आधुनिक हिन्दी पाठक के लिए प्रसंग स्पष्ट करता है।
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: यह पारदर्शी और प्रचलित हिन्दी रूप है, जो βασιλεία τοῦ θεοῦ के धार्मिक और भविष्यकालीन महत्व को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के राज्य में भोज की छवि
  choice: ‘भोज के लिए लेटेंगे’ द्वारा भोजन की ठोस छवि बनाए रखना
  alternative: ‘बैठेंगे’ या केवल ‘प्रवेश करेंगे’
  rationale: क्रिया अंतिम समय के भोज में सहभागिता की छवि जगाती है। केवल ‘प्रवेश करेंगे’ इसे मिटा देता, जबकि ‘बैठेंगे’ आधुनिक व्यवहार के अनुसार स्वाभाविक होते हुए भी यूनानी क्रिया की विशिष्ट सांस्कृतिक छवि को कम कर देता।
- issue: चारों दिशाओं से लोगों का आना
  choice: चार दिशाओं को सीधे प्रस्तुत करना, पर लोगों की जातीय पहचान न जोड़ना
  alternative: स्पष्ट रूप से ‘गैर-यहूदी सब जातियों से आएँगे’ कहना
  rationale: वचन विश्वव्यापी विस्तार का संकेत देता है, पर स्वयं यूनानी पाठ किसी जातीय समूह का स्पष्ट नाम नहीं लेता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठकों के लिए स्पष्ट रखी गई है। कर्ता यूनानी क्रिया में निहित है; हिन्दी में स्वाभाविक स्पष्टता के लिए ‘लोग’ जोड़ा गया है। ‘भोज के लिए लेटेंगे’ सांस्कृतिक रूप से अपरिचित हो सकता है, पर प्रसंग सहित यह मूल भोज-छवि को ‘मेज़ पर लेटेंगे’ जैसे संभावित भ्रामक वाक्यांश से बेहतर व्यक्त करता है।
