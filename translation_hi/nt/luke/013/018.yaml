lexical_decisions:
- source_word: Ἔλεγεν
  choice: वह कह रहा था
  rationale: अपूर्ण भूतकाल चल रहे या बार-बार किए जा रहे कथन का संकेत दे सकता है; यह रूप उस पक्ष को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से निष्कर्ष अथवा कथन की निरंतरता जोड़ता है; ‘इसलिए’ इसके संयोजक बल को स्पष्ट रखता है।
- source_word: Τίνι ὁμοία ἐστὶν
  choice: किसके समान है
  rationale: यूनानी वाक्यांश तुलना पूछता है; यह हिन्दी में सीधा और गरिमापूर्ण समतुल्य है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित बाइबलीय अभिव्यक्ति है और राज्य-क्षेत्र तथा परमेश्वर के शासन—दोनों अर्थ-संभावनाओं को पूरी तरह बंद नहीं करती।
- source_word: καὶ
  choice: और
  rationale: दो समानांतर प्रश्नों को जोड़ने वाला सरल समुच्चयबोधक।
- source_word: τίνι ὁμοιώσω αὐτήν
  choice: मैं उसकी तुलना किससे करूँ
  rationale: भविष्यकालीन रूप यहाँ विचारात्मक आलंकारिक प्रश्न का काम करता है; ‘करूँ’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
