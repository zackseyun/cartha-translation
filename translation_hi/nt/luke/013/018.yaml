  choice: परमेश्वर का राज्य
  alternative: परमेश्वर का शासन
  rationale: यूनानी पद राज्य और शासन दोनों को सूचित कर सकता है। मुख्य पाठ में प्रचलित अभिव्यक्ति रखी गई है और गतिशील ‘शासन’ अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
