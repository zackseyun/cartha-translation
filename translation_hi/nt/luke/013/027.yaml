lexical_decisions:
- source_word: ἐρεῖ λέγων ὑμῖν
  choice: वह तुमसे कहेगा
  rationale: मुख्य क्रिया और अर्थ की दृष्टि से पुनरुक्त कृदंत को स्वाभाविक हिन्दी में एक ही वाक्-परिचय में समेटा गया है; इससे आशय पूरा रहता है और असहज पुनरुक्ति नहीं आती।
- source_word: οἶδα
  choice: मैं नहीं जानता
  rationale: यह मूल क्रिया के सामान्य अर्थ को सीधे रखता है और संदर्भगत ‘पहचानने’ या संबंध से इनकार के अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: πόθεν ἐστέ
  choice: तुम कहाँ के हो
  rationale: यह उद्गम या मूल स्थान पूछने वाले यूनानी पद का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἀπόστητε ἀπ’ ἐμοῦ
  choice: मेरे पास से दूर हो जाओ
  rationale: यह निर्णायक अलगाव की आज्ञा को स्पष्ट, स्वाभाविक और गंभीर हिन्दी में व्यक्त करता है।
- source_word: πάντες ἐργάται ἀδικίας
  choice: तुम सब अधर्म करनेवालो
  rationale: सम्बोधन का बल ‘तुम सब’ से सामने आता है, जबकि ‘अधर्म करनेवाले’ ऐसे लोगों को दर्शाता है जो अन्याय या बुराई को व्यवहार में लाते हैं।
theological_decisions:
- issue: न्याय के कथन में ἀδικίας का अनुवाद
  choice: अधर्म
  alternative: अन्याय; बुराई; गलत काम
  rationale: ‘अधर्म’ नैतिक और धार्मिक व्यापकता बनाए रखता है, पर मूल में निहित न होने वाली व्यवस्था-विरोध की अधिक विशिष्ट धारणा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सहज रखी गई है। ‘कहेगा’ प्रत्यक्ष कथन का स्वाभाविक परिचय देता है; ‘करनेवालो’ सम्बोधन रूप में लिखा गया है।
