- source_word: Ἦν δὲ διδάσκων
  choice: वह ... शिक्षा दे रहा था
  rationale: εἰμί का अपूर्णकाल और वर्तमान कृदन्त मिलकर जारी भूतकालीन क्रिया व्यक्त करते हैं। δέ यहाँ हल्का कथात्मक संक्रमण है; हिन्दी में अलग संयोजक जोड़ना आवश्यक नहीं।
- source_word: ἐν μιᾷ τῶν συναγωγῶν
  choice: आराधनालयों में से एक में
  rationale: यह अंशात्मक अभिव्यक्ति मूल के ‘आराधनालयों में से एक’ को स्वाभाविक हिन्दी में बनाए रखती है। συναγωγή के ऐतिहासिक यहूदी संस्थागत अर्थ के लिए ‘आराधनालय’ चुना गया है।
- source_word: ἐν τοῖς σάββασιν
  choice: सब्त के दिन
  rationale: σάββασιν रूप की दृष्टि से बहुवचन है, पर इस प्रसंग में यूनानी मुहावरे के अनुसार एकवचन ‘सब्त’ का अर्थ दे सकता है। मुख्य पाठ में स्वाभाविक हिन्दी एकवचन रखा गया है और बहुवचन संभावना पाद-टिप्पणी में दी गई है।
