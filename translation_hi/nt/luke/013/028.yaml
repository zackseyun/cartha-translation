source:
  edition: SBLGNT
  text: ἐκεῖ ἔσται ὁ κλαυθμὸς καὶ ὁ βρυγμὸς τῶν ὀδόντων, ὅταν ⸀ὄψησθε Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ καὶ πάντας τοὺς προφήτας ἐν τῇ βασιλείᾳ τοῦ θεοῦ, ὑμᾶς δὲ ἐκβαλλομένους ἔξω.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/028.yaml
  text: There will be weeping and gnashing of teeth there[a], when you see Abraham and Isaac and Jacob and all the prophets in the kingdom of God[c][b], but you yourselves thrown out.
translation:
  language: hi
  text: वहाँ रोना और दाँत पीसना होगा, जब तुम अब्राहम, इसहाक, याकूब और सभी भविष्यद्वक्ताओं को परमेश्वर के राज्य में देखोगे, लेकिन स्वयं को बाहर निकाले जाते हुए देखोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκεῖ
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण उस बहिष्कार और न्याय के स्थान की ओर संकेत करता है; ‘वहाँ’ स्वाभाविक और सीधा है।
- source_word: ὁ κλαυθμὸς
  choice: रोना
  rationale: यह दुःख और विलाप को व्यक्त करता है; ‘रोना’ आधुनिक हिन्दी में स्पष्ट है और यूनानी से अधिक तीव्र अर्थ नहीं जोड़ता।
- source_word: ὁ βρυγμὸς τῶν ὀδόντων
  choice: दाँत पीसना
  rationale: यह पीड़ा अथवा क्रोध की प्रबल अभिव्यक्ति का परिचित और सटीक हिन्दी मुहावरा है।
- source_word: ὅταν ὄψησθε
  choice: जब तुम ... देखोगे
  rationale: ὅταν के साथ aorist subjunctive यहाँ भविष्य की एक निश्चित परिस्थिति प्रस्तुत करता है; हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: πάντας τοὺς προφήτας
  choice: सब भविष्यद्वक्ताओं
  rationale: πάντας के व्यापक बल को बनाए रखते हुए पद का सीधा अनुवाद।
- source_word: ἐν τῇ βασιλείᾳ τοῦ θεοῦ
  choice: परमेश्वर के राज्य में
  rationale: मुख्य बाइबलीय अभिव्यक्ति को औपचारिक, परिचित और अर्थगत रूप से यथावत रखता है।
- source_word: ὑμᾶς δὲ
  choice: पर अपने आप को
  rationale: δέ का विरोध ‘पर’ से और स्पष्ट ὑμᾶς का बल आत्मवाचक ‘अपने आप को’ से व्यक्त होता है; यह ὄψησθε के साथ स्वाभाविक हिन्दी वाक्य बनाता है।
- source_word: ἐκβαλλομένους ἔξω
  choice: बाहर निकाला जाता हुआ
  rationale: वर्तमान कर्मवाच्य कृदन्त और ἔξω दोनों को बनाए रखता है तथा बलपूर्वक बहिष्कार का भाव देता है।
theological_decisions:
- issue: न्याय के चित्रण का स्वरूप
  choice: बहिष्कार और पीड़ा की ठोस भाषा को बिना नरम किए बनाए रखना
  alternative: ‘गहरा दुःख’ या ‘अन्तिम दण्ड’ जैसी व्याख्यात्मक शब्दावली
  rationale: पद परमेश्वर के राज्य से बाहर किए जाने और उससे जुड़ी व्यथा का चित्र देता है, पर न्याय के पूर्ण धर्मवैज्ञानिक स्वरूप को परिभाषित नहीं करता। इसलिए अनुवाद चित्रात्मक भाषा को सुरक्षित रखता है।
- issue: ὑμᾶς δὲ ἐκβαλλομένους का वाक्यगत सम्बन्ध
  choice: ‘अपने आप को बाहर निकाला जाता हुआ देखोगे’
  alternative: 'स्वतंत्र खंड: ‘पर तुम स्वयं बाहर निकाल दिए जाओगे’'
  rationale: Accusative participial phrase को ὄψησθε के दूसरे कर्म के रूप में ग्रहण करना व्याकरणतः स्वाभाविक है और यह अर्थ सुरक्षित रखता है कि वे पितृपुरुषों और भविष्यद्वक्ताओं को भीतर तथा स्वयं को बाहर किया जाता हुआ देखेंगे।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और मौखिक पाठ में सहज है। ‘परमेश्वर का राज्य’, ‘भविष्यद्वक्ता’ और ‘दाँत पीसना’ जैसी स्थापित बाइबलीय अभिव्यक्तियाँ बनाए रखी गई हैं।
