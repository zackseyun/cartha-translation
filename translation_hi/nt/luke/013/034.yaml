  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और भावपूर्ण विलाप-रजिस्टर रखा गया है। ‘हे’ संबोधन को स्वाभाविक बनाता है; ‘पंखों तले’ काव्यात्मक होते हुए भी सामान्य पाठक के लिए सहज है। मूल के एकवचन से बहुवचन परिवर्तन को जानबूझकर बनाए रखा गया है।
