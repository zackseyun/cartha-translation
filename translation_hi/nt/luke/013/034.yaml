source:
  edition: SBLGNT
  text: Ἰερουσαλὴμ Ἰερουσαλήμ, ἡ ἀποκτείνουσα τοὺς προφήτας καὶ λιθοβολοῦσα τοὺς ἀπεσταλμένους πρὸς αὐτήν— ποσάκις ἠθέλησα ἐπισυνάξαι τὰ τέκνα σου ὃν τρόπον ὄρνις τὴν ἑαυτῆς νοσσιὰν ὑπὸ τὰς πτέρυγας, καὶ οὐκ ἠθελήσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/034.yaml
  text: Jerusalem[a], Jerusalem, the one killing the prophets and stoning those sent to her—how often I wanted to gather your children the way a hen gathers her brood under her wings[b], and you were not willing.
translation:
  language: hi
  text: हे यरूशलेम[a], हे यरूशलेम! तू भविष्यद्वक्ताओं को मार डालती है और अपने पास भेजे हुओं को पत्थरों से मार डालती है। कितनी ही बार मैंने चाहा कि तेरे बच्चों को इकट्ठा करूँ, जिस प्रकार मुर्गी अपने बच्चों को अपने पंखों तले समेटती है[b], पर तुम लोगों ने नहीं चाहा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ वर्तमान कृदंत हैं; वे यरूशलेम को परमेश्वर के भेजे हुओं के साथ ऐसा व्यवहार करनेवाले नगर के रूप में चित्रित करते हैं। इसे ‘जो भविष्यद्वक्ताओं को मार डालती और भेजे हुओं को पत्थरों से मार डालती है’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी शब्द का अर्थ अधिक सामान्य रूप से ‘पक्षी’ भी हो सकता है, और ‘अपने बच्चों’ का अनुवाद ‘अपने चूज़ों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यूनानी में ‘तेरे बच्चों’ एकवचन संबोधन है, लेकिन ‘तुम लोगों ने नहीं चाहा’ बहुवचन है।
    reason: source_form
lexical_decisions:
- source_word: Ἰερουσαλὴμ Ἰερουσαλήμ
  choice: हे यरूशलेम, हे यरूशलेम
  rationale: नाम की पुनरावृत्ति विलाप और भावपूर्ण संबोधन को बनाए रखती है; हिन्दी में संबोधन को स्वाभाविक बनाने के लिए ‘हे’ जोड़ा गया है।
- source_word: ἡ ἀποκτείνουσα ... καὶ λιθοβολοῦσα
  choice: तू ... मार डालती है और ... पत्थर मारती है
  rationale: वर्तमान कृदंत यरूशलेम के विशिष्ट और बार-बार होनेवाले व्यवहार का चित्र खींचते हैं। स्त्रीलिंग एकवचन क्रियाएँ नगर के मानवीकरण को सुरक्षित रखती हैं।
- source_word: τοὺς ἀπεσταλμένους πρὸς αὐτήν
  choice: अपने पास भेजे हुओं को
  rationale: पूर्ण निष्क्रिय कृदंत का निष्क्रिय अर्थ बना रहता है और यह नहीं जोड़ा जाता कि भेजनेवाला कौन है।
- source_word: ποσάκις ἠθέλησα
  choice: कितनी ही बार मैंने चाहा
  rationale: यह विलाप की तीव्रता और θέλω के इच्छा-संबंधी अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπισυνάξαι τὰ τέκνα σου
  choice: तेरे बच्चों को ... इकट्ठा करूँ
  rationale: ‘बच्चों’ से नगर की संतान का रूपक और उसके संदर्भ की व्यापकता बनी रहती है; उसे केवल निवासियों या किसी विशेष समूह तक सीमित नहीं किया गया।
- source_word: ὄρνις τὴν ἑαυτῆς νοσσιὰν
  choice: मुर्गी अपने बच्चों को
  rationale: ὄρνις सामान्यतः पक्षी भी हो सकता है, पर अपने बच्चों को पंखों तले समेटनेवाली मातृ-छवि में ‘मुर्गी’ सबसे स्वाभाविक है। νοσσιά के सामूहिक अर्थ को सहज हिन्दी में ‘बच्चों’ से व्यक्त किया गया है।
- source_word: ὑπὸ τὰς πτέρυγας
  choice: अपने पंखों तले
  rationale: यह संरक्षण और समेटने की मूल दृश्यात्मक छवि को संक्षिप्त तथा काव्यात्मक हिन्दी में बनाए रखता है।
- source_word: καὶ οὐκ ἠθελήσατε
  choice: पर तुम लोगों ने नहीं चाहा
  rationale: बहुवचन क्रिया को स्पष्ट रूप से सुरक्षित रखते हुए वही इच्छा-संबंधी शब्दावली रखी गई है जो पहले ‘मैंने चाहा’ में है।
theological_decisions:
- issue: ‘तेरे बच्चों’ का संदर्भ
  choice: ‘तेरे बच्चों’ को बिना अतिरिक्त व्याख्या के रखा गया
  alternative: यरूशलेम के निवासी; यरूशलेम अथवा इस्राएल से संबंधित लोग
  rationale: यूनानी पाठ नगर को माता के रूप में संबोधित करता है और संदर्भ को स्वयं स्पष्ट रूप से सीमित नहीं करता; अनुवाद उस मानवीकरण और व्याख्यात्मक खुलेपन को बनाए रखता है।
- issue: θέλω / ἠθελήσατε में इच्छा का विरोध
  choice: ‘मैंने चाहा ... तुम लोगों ने नहीं चाहा’
  alternative: ‘मैं तैयार था ... तुम तैयार नहीं हुए’; ‘मेरी इच्छा थी ... तुम्हारी इच्छा नहीं थी’
  rationale: समान धातु से व्यक्त इच्छा के प्रत्यक्ष विरोध को सुरक्षित रखा गया है और इससे आगे ईश्वरीय या मानवीय इच्छा के विषय में कोई सिद्धान्तगत निष्कर्ष नहीं जोड़ा गया।
- issue: एकवचन नगर और बहुवचन उत्तरदाताओं के बीच परिवर्तन
  choice: ‘तू/तेरे’ से ‘तुम लोगों ने’ की ओर मूल व्याकरणिक परिवर्तन बनाए रखा गया
  alternative: पूरे वाक्य में एकवचन ‘तूने नहीं चाहा’
  rationale: यूनानी में यरूशलेम को एकवचन में संबोधित करने के बाद अंतिम क्रिया बहुवचन है। इसे समतल करने से नगर और उसके बच्चों/लोगों के बीच निहित आलंकारिक तनाव मिट जाता।
