source:
  edition: SBLGNT
  text: καὶ ταῦτα λέγοντος αὐτοῦ κατῃσχύνοντο πάντες οἱ ἀντικείμενοι αὐτῷ, καὶ πᾶς ὁ ὄχλος ἔχαιρεν ἐπὶ πᾶσιν τοῖς ἐνδόξοις τοῖς γινομένοις ὑπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/017.yaml
  text: And as he was saying these things[a], all who were opposing him were put to shame[b], and the whole crowd was rejoicing over all the glorious things being done by him.
translation:
  language: hi
  text: और जब वह ये बातें कह रहा था, तो उसका विरोध करने वाले[a] सभी लोग लज्जित हो रहे थे, और सारी भीड़ उन सब महिमामय कार्यों[b] के कारण आनन्द मना रही थी, जो उसके द्वारा किए जा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके सभी विरोधी।”
    reason: lexical_alternative
  - marker: b
    text: या, “अद्भुत कार्य” अथवा “शानदार कार्य।” यूनानी में व्यापक अभिव्यक्ति “महिमामय कार्य” है, जिसमें उसके सामर्थ्य के कार्य भी सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ταῦτα λέγοντος αὐτοῦ
  choice: जब वह ये बातें कह रहा था
  rationale: वर्तमान कृदन्त वाले संबंधविहीन षष्ठी-वाक्यांश की समकालिक और जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ἀντικείμενοι αὐτῷ
  choice: उसका विरोध करनेवाले
  rationale: कृदन्त के सक्रिय और जारी विरोध के भाव को बनाए रखता है; केवल संज्ञा ‘विरोधी’ की अपेक्षा यूनानी की क्रियात्मकता अधिक स्पष्ट करता है।
- source_word: κατῃσχύνοντο
  choice: लज्जित हो रहे थे
  rationale: अपूर्णकाल की जारी अवस्था और सार्वजनिक रूप से लज्जित होने के भाव को स्वाभाविक हिन्दी में रखता है। ‘लज्जित किए जा रहे थे’ अधिक स्पष्ट कर्मवाच्य होता, पर हिन्दी में अनावश्यक रूप से भारी और यांत्रिक लगता।
- source_word: πᾶς ὁ ὄχλος
  choice: सारी भीड़
  rationale: एकवचन सामूहिक अभिव्यक्ति का सहज हिन्दी रूप है और भीड़ की समग्र प्रतिक्रिया दिखाता है।
- source_word: ἔχαιρεν
  choice: आनन्द मना रही थी
  rationale: अपूर्णकाल में जारी आनन्द को व्यक्त करता है, न कि केवल एक क्षणिक प्रतिक्रिया को।
- source_word: ἐπὶ πᾶσιν τοῖς ἐνδόξοις
  choice: उन सब महिमामय कामों के कारण
  rationale: ἐπί के आधार अथवा कारण के भाव और ἔνδοξος की व्यापक ‘महिमामय’ अर्थ-सीमा को बनाए रखता है; इसे केवल चमत्कारों तक सीमित नहीं करता।
- source_word: τοῖς γινομένοις ὑπ’ αὐτοῦ
  choice: जो उसके द्वारा किए जा रहे थे
  rationale: वर्तमान कृदन्त की जारी क्रिया तथा ὑπό के स्पष्ट कर्तृत्व को सुरक्षित रखता है।
theological_decisions:
- issue: ‘महिमामय कामों’ का स्वरूप
  choice: ἐνδόξοις को व्यापक अर्थ में ‘महिमामय कामों’ के रूप में प्रस्तुत किया गया है।
  alternative: ‘अद्भुत कामों’ या विशेष रूप से ‘चमत्कारों’
  rationale: प्रसंग में चंगाई अवश्य है, पर यूनानी विशेषण स्वयं कामों को केवल चमत्कार नहीं कहता। व्यापक अनुवाद सामर्थ्यपूर्ण, शानदार और सम्मान योग्य कार्यों की अर्थ-संभावना खुली रखता है।
- issue: ὑπ’ αὐτοῦ में कर्तृत्व
  choice: ‘उसके द्वारा किए जा रहे थे’
  alternative: ‘उसके माध्यम से हो रहे थे’
  rationale: ὑπό के साथ संबंधकारक यहाँ यीशु को कामों का कर्ता बताता है। ‘द्वारा’ इस सीधे कर्तृत्व को व्यक्त करता है और अनावश्यक रूप से उसे केवल माध्यम नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। अपूर्णकाल की जारी क्रियाओं के लिए ‘कह रहा था,’ ‘लज्जित हो रहे थे,’ ‘आनन्द मना रही थी’ और ‘किए जा रहे थे’ का प्रयोग किया गया है। फुटनोट चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
