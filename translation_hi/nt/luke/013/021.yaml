  yaml_path: translation/nt/luke/013/021.yaml
  text: It is like leaven[c][b][a], which a woman took and hid in three measures of flour until it was all leavened.
translation:
  language: hi
  text: वह खमीर[a] के समान है, जिसे एक स्त्री ने लेकर तीन सआ आटे में छिपा दिया[c], जब तक कि सारा आटा खमीर से भर न गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘खमीर उठाने वाला पदार्थ।’ यहाँ यूनानी शब्द आटे को खमीर उठाने के लिए इस्तेमाल किए जाने वाले पदार्थ को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘मिला दिया।’ यूनानी क्रिया का शाब्दिक अर्थ ‘छिपा दिया’ या ‘गुप्त कर दिया’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοία
  choice: के समान
  rationale: यह विधेय विशेषण दृष्टान्त की तुलना आरम्भ करता है; ‘के समान है’ स्वाभाविक हिन्दी है।
- source_word: ζύμῃ
  choice: खमीर
  rationale: यह प्राचीन आटे को खमीर उठाने वाले पदार्थ को दर्शाता है और बाइबलीय बिंब को बनाए रखता है।
- source_word: λαβοῦσα
  choice: लेकर
  rationale: पूर्वकालिक कृदन्त को हिन्दी में मुख्य क्रिया से पहले ‘लेकर’ कहना सहज और क्रम-संगत है।
- source_word: γυνὴ
  choice: एक स्त्री
  rationale: दृष्टान्त में संज्ञा अनिश्चित अर्थ में है; आधुनिक मानक हिन्दी में ‘एक स्त्री’ स्वाभाविक है।
- source_word: ἔκρυψεν
  choice: छिपा दिया
  rationale: यूनानी क्रिया का मूल अर्थ ‘छिपाना’ या ‘गुप्त कर देना’ है; अनुवाद उस सजीव बिंब को बनाए रखता है, जबकि व्यावहारिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: εἰς ἀλεύρου σάτα τρία
  choice: तीन सआ आटे में
  rationale: ‘सआ’ प्राचीन सामी सूखे माप को सुरक्षित रखता है; इसकी सांस्कृतिक अपरिचितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: ἕως οὗ
  choice: जब तक कि
  rationale: यह समय की सीमा बताने वाले यूनानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: ἐζυμώθη ὅλον
  choice: सारा आटा खमीरयुक्त न हो गया
  rationale: यह निष्क्रिय क्रिया और ὅλον के सम्पूर्ण मात्रा पर बल—दोनों को बनाए रखता है, बिना प्रतीक का अर्थ व्याख्यायित किए।
theological_decisions:
- issue: दृष्टान्त में खमीर का प्रतीकात्मक अर्थ
  choice: खमीर के बिंब को तटस्थ रूप से रखा गया है।
  alternative: इसे स्पष्टतः बुराई का प्रतीक या स्पष्टतः परमेश्वर के राज्य की सकारात्मक वृद्धि का प्रतीक बताना।
  rationale: पद स्वयं बिंब प्रस्तुत करता है, पर उसके व्यापक धर्मवैज्ञानिक मूल्यांकन को सीधे नहीं समझाता; अनुवाद को उस व्याख्यात्मक तनाव का निर्णय नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण रूप अपनाया गया है। मुख्य पाठ में मूल यूनानी का ‘छिपाने’ वाला बिंब और प्राचीन माप सुरक्षित हैं; आवश्यक व्यावहारिक तथा सांस्कृतिक स्पष्टता पादटिप्पणियों में दी गई है।
