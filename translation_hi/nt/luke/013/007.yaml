  edition: SBLGNT
  text: εἶπεν δὲ πρὸς τὸν ἀμπελουργόν· Ἰδοὺ τρία ἔτη ⸂ἀφ’ οὗ⸃ ἔρχομαι ζητῶν καρπὸν ἐν τῇ συκῇ ταύτῃ καὶ οὐχ εὑρίσκω· ⸀ἔκκοψον αὐτήν· ἱνατί καὶ τὴν γῆν καταργεῖ;
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/007.yaml
  text: Then he said to the vine-dresser[a], ‘Look, for three years now I have come seeking fruit on this fig tree and have found none. Cut it down. Why should it even keep using up the ground?’
translation:
  language: hi
  text: तब उसने अंगूर की बारी के माली से कहा, ‘देखो, तीन साल से मैं इस अंजीर के पेड़ पर फल ढूँढ़ने आता रहा हूँ, पर मुझे एक भी फल नहीं मिला। इसे काट डाल। यह भूमि को भी क्यों अनुपयोगी बनाए?’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह जमीन भी क्यों घेरे रहे?” यूनानी क्रिया का मुख्य अर्थ भूमि को अनुपयोगी या अनुत्पादक बनाना है; इस प्रसंग में पेड़ के फल न देने पर भी भूमि घेरे रहने का भाव भी निहित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀμπελουργόν
  choice: अंगूर की बारी के माली
  rationale: यह शब्द अंगूर की बारी की खेती और देखभाल करनेवाले व्यक्ति को दर्शाता है। यह अभिव्यक्ति प्रसंग को बनाए रखते हुए आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: Ἰδοὺ
  choice: देख
  rationale: यह सामने वाले का ध्यान जोर देकर खींचता है और पुरातन शैली अपनाए बिना यूनानी पद का बल व्यक्त करता है।
- source_word: τρία ἔτη ἀφ’ οὗ
  choice: तीन साल से
  rationale: यह अतीत से वर्तमान तक चली आ रही अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔρχομαι ζητῶν
  choice: फल ढूँढ़ने आता रहा हूँ
  rationale: यह तीन साल के दौरान बार-बार आकर खोजने की जारी क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: καρπὸν
  choice: फल
  rationale: दृष्टांत की कृषि-संबंधी छवि को बिना आध्यात्मिक अर्थ जोड़े ज्यों का त्यों रखा गया है।
- source_word: συκῇ
  choice: अंजीर के पेड़
  rationale: यह शब्द का मानक और प्रसंगानुकूल अर्थ है।
- source_word: οὐχ εὑρίσκω
  choice: मुझे एक भी फल नहीं मिला
  rationale: यह लगातार निष्फल रही खोज का स्वाभाविक हिन्दी सार प्रस्तुत करता है; ‘एक भी’ पूर्ण अभाव को स्पष्ट करता है।
- source_word: ἔκκοψον
  choice: इसे काट डाल
  rationale: पेड़ को काटकर गिराने की सीधी आज्ञा को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἱνατί
  choice: क्यों
  rationale: कारण पूछनेवाले सीधे प्रश्न का सरल समतुल्य है।
- source_word: καὶ
  choice: भी
  rationale: यह इस बात पर बल देता है कि फल न देने के अतिरिक्त पेड़ मिट्टी पर भी प्रतिकूल प्रभाव डाल रहा है।
- source_word: γῆν
  choice: मिट्टी
  rationale: कृषि के इस प्रसंग में भूमि के उपजाऊ भाग के लिए ‘मिट्टी’ स्वाभाविक है और अगले क्रियापद के साथ स्पष्ट अर्थ देता है।
- source_word: καταργεῖ
  choice: बेकार करता रहे
  rationale: यूनानी क्रिया जमीन को अनुपयोगी या अनुत्पादक बनाने का अर्थ दे सकती है। हिन्दी चयन इस अर्थ को बनाए रखता है, जबकि केवल जगह घेरने वाला अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दृष्टांत की कृषि-संबंधी छवि बनाम उसकी स्पष्ट धर्मवैज्ञानिक व्याख्या
  choice: कृषि-संबंधी भाषा को प्रत्यक्ष रूप में बनाए रखना
  alternative: अनुवाद में आध्यात्मिक निष्फलता का अर्थ स्पष्ट रूप से जोड़ना
  rationale: मूल पाठ स्वयं इस पद में दृष्टांत की व्याख्या नहीं करता। इसलिए अनुवाद छवि और उसके धर्मवैज्ञानिक तनाव को बनाए रखता है तथा पाठक पर कोई संप्रदायगत अर्थ नहीं थोपता।
- issue: καταργεῖ में भूमि को अनुपयोगी बनाना या केवल घेरना
  choice: मुख्य पाठ में ‘मिट्टी को भी बेकार करता रहे’
  alternative: ‘यह जमीन भी क्यों घेरे रहे?’
  rationale: क्रिया में भूमि को निष्फल या अनुपयोगी बनाने का अधिक प्रबल अर्थ संभव है, पर केवल जगह घेरे रहने का प्रसंगानुकूल अर्थ भी वास्तविक है; इसलिए विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली अपनाई गई है। ‘साल’ और ‘देख’ जैसे प्रचलित शब्द स्वाभाविकता बनाए रखते हैं, जबकि दृष्टांत की कृषि-संबंधी शब्दावली को स्पष्ट रूप से सुरक्षित रखा गया है।
