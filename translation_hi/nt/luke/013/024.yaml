source:
  edition: SBLGNT
  text: Ἀγωνίζεσθε εἰσελθεῖν διὰ τῆς στενῆς ⸀θύρας, ὅτι πολλοί, λέγω ὑμῖν, ζητήσουσιν εἰσελθεῖν καὶ οὐκ ἰσχύσουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/013/024.yaml
  text: Strive to enter through the narrow door[a], because many, I tell you, will seek to enter and will not be able.
translation:
  language: hi
  text: “संकरे द्वार[a] से प्रवेश करने का भरसक प्रयत्न करो, क्योंकि मैं तुमसे कहता हूँ कि बहुत-से लोग प्रवेश करने का प्रयत्न करेंगे, पर प्रवेश न कर सकेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संकरे दरवाज़े से।” लूका के यूनानी पाठ में θύρα है, जिसका अर्थ सामान्यतः “द्वार” या “दरवाज़ा” होता है; मत्ती के समानांतर कथन में “फाटक” के लिए अलग शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀγωνίζεσθε
  choice: पूरा संघर्ष करो
  rationale: वर्तमानकालीन आज्ञार्थक क्रिया गंभीर और निरंतर प्रयत्न अथवा संघर्ष का भाव रखती है। ‘पूरा संघर्ष करो’ इसकी तीव्रता बनाए रखता है और इसे केवल सामान्य ‘कोशिश’ तक सीमित नहीं करता।
- source_word: εἰσελθεῖν
  choice: प्रवेश करने
  rationale: दोनों स्थानों पर εἰσέρχομαι का स्वाभाविक और गरिमापूर्ण हिन्दी रूप ‘प्रवेश करना’ है।
- source_word: διὰ τῆς στενῆς θύρας
  choice: संकरे द्वार से
  rationale: θύρα का सामान्य अर्थ ‘द्वार’ है; ‘फाटक’ मत्ती के समानांतर कथन की शब्दावली को यहाँ ले आएगा। στενῆς का स्थानगत और रूपक भाव ‘संकरे’ से सुरक्षित रहता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में कारण-संबंध स्पष्ट रखता है।
- source_word: πολλοί
  choice: बहुत-से लोग
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘बहुत-से लोग’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यह यूनानी कथन-सूत्र का सीधा, स्वाभाविक और गरिमापूर्ण हिन्दी रूप है।
- source_word: ζητήσουσιν
  choice: चाहेंगे
  rationale: इस प्रसंग में ζητέω प्रवेश पाने की चेष्टा या इच्छा को व्यक्त करता है। ‘चाहेंगे’ Ἀγωνίζεσθε के प्रबल संघर्ष और बाद में अनेक लोगों की अपर्याप्त चेष्टा के बीच का अंतर बनाए रखता है, यद्यपि ‘प्रयत्न करेंगे’ भी संभव है।
- source_word: οὐκ ἰσχύσουσιν
  choice: कर नहीं सकेंगे
  rationale: यह आवश्यक सामर्थ्य या क्षमता न होने का स्वाभाविक हिन्दी मुहावरा है और ‘सफल नहीं होंगे’ जैसी परिणाम-केंद्रित व्याख्या से बचता है।
theological_decisions:
- issue: मानवीय प्रयास और उद्धार की भाषा
  choice: ‘पूरा संघर्ष करो’ के रूप में आज्ञा की पूरी गंभीरता बनाए रखी गई है।
  alternative: ‘पूरा प्रयास करो’ या ‘कोशिश करो’
  rationale: पद स्वयं गंभीर प्रयास की आज्ञा देता और बाद में असमर्थता की चेतावनी देता है। अनुवाद इस तनाव को बनाए रखता है, पर योग्यता, कर्म, मानवीय उत्तरदायित्व या परमेश्वर की प्रभुता पर कोई अतिरिक्त सांप्रदायिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गंभीर और सामान्य पाठक के लिए सुबोध स्तर रखा गया है। ‘द्वार’ धार्मिक प्रसंग में स्वाभाविक गरिमा देता है; पादटिप्पणी अधिक बोलचाल के ‘दरवाज़े’ को बताती और मत्ती की शब्दावली से भेद स्पष्ट करती है।
