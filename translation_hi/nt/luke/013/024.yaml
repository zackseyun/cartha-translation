review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies θύρα as ‘door’ rather than importing Matthew’s ‘gate,’ and it retains the causal warning and future inability. However, ‘चाहेंगे’ renders ζητήσουσιν as mere desire rather than ‘will seek/attempt,’ and thus understates the Greek verb’s active sense.
  naturalness: ‘पूरा संघर्ष करो’ is not idiomatic modern standard Hindi as an imperative. ‘भरसक प्रयत्न करो’ is natural, serious, and suitably conveys the sustained exertion of ἀγωνίζεσθε. Explicitly repeating ‘प्रवेश’ in the final clause avoids an overly elliptical ‘कर नहीं सकेंगे.’
  terminology: ‘संकरे द्वार’ is an appropriate elevated but intelligible rendering in this context. The footnote must give a singular alternative (‘दरवाज़े से’), not the plural ‘दरवाज़े।’
  issues:
  - severity: medium
    issue: ζητήσουσιν is translated ‘प्रवेश करना चाहेंगे.’
    rationale: ζητέω means ‘seek’ and in this construction denotes an active attempt or pursuit, not merely wanting. ‘प्रवेश करने का प्रयत्न करेंगे’ preserves this sense without conflating it with the stronger imperative.
  - severity: medium
    issue: Ἀγωνίζεσθε is translated ‘पूरा संघर्ष करो.’
    rationale: The phrase is awkward in modern Hindi. ‘भरसक प्रयत्न करो’ naturally communicates earnest, strenuous effort while avoiding a misleadingly combative sense.
  - severity: low
    issue: 'The footnote alternative has a number/construction error: ‘संकरे दरवाज़े।’'
    rationale: The Greek phrase is singular and includes the preposition. The Hindi alternative should be ‘संकरे दरवाज़े से।’
  revised_text: “संकरे द्वार[a] से प्रवेश करने का भरसक प्रयत्न करो, क्योंकि मैं तुमसे कहता हूँ कि बहुत-से लोग प्रवेश करने का प्रयत्न करेंगे, पर प्रवेश न कर सकेंगे।”
