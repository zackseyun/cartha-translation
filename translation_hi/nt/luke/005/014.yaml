source:
  edition: SBLGNT
  text: καὶ αὐτὸς παρήγγειλεν αὐτῷ μηδενὶ εἰπεῖν, ἀλλὰ ἀπελθὼν δεῖξον σεαυτὸν τῷ ἱερεῖ, καὶ προσένεγκε περὶ τοῦ καθαρισμοῦ σου καθὼς προσέταξεν Μωϋσῆς εἰς μαρτύριον αὐτοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/014.yaml
  text: And he ordered him to tell no one[a], but go and show yourself to the priest, and offer for your cleansing as Moses commanded[b], for a testimony to them.
translation:
  language: hi
  text: और उसने उसे आदेश दिया कि किसी से कुछ न कहना, बल्कि जाकर अपने आप को याजक को दिखाना, और अपने शुद्धीकरण के लिए वही भेंट चढ़ाना जिसकी आज्ञा मूसा ने दी थी[b], ताकि उनके लिए गवाही हो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके सामने गवाही के रूप में’; यह वाक्यांश याजकों या दूसरे लोगों के लिए गवाही का संकेत हो सकता है, और कुछ लोग इसे उनके विरुद्ध प्रमाण के अर्थ में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: कोढ़ से शुद्धीकरण के लिए मूसा द्वारा निर्धारित भेंट के विषय में लैव्यव्यवस्था 14 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: παρήγγειλεν
  choice: आदेश दिया
  rationale: यह क्रिया अधिकारपूर्ण निर्देश व्यक्त करती है; ‘आदेश दिया’ मूल का बल बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
- source_word: μηδενὶ εἰπεῖν
  choice: किसी से कुछ न कहना
  rationale: यूनानी निषेध का सहज और स्पष्ट हिन्दी रूप, जो किसी को भी बताने से रोकता है।
- source_word: ἀπελθὼν
  choice: जाकर
  rationale: यह पूर्ववर्ती क्रिया और उसके बाद याजक को स्वयं दिखाने की क्रमिकता को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: δεῖξον σεαυτὸν τῷ ἱερεῖ
  choice: अपने आप को याजक को दिखाना
  rationale: मूल आज्ञा और आत्मवाचक सर्वनाम का निकट अनुवाद; विधिक निरीक्षण का भाव बिना अतिरिक्त व्याख्या के बना रहता है।
- source_word: προσένεγκε
  choice: भेंट चढ़ाना
  rationale: बलिदानी और उपासना-संबंधी प्रसंग में केवल ‘लाना’ की तुलना में ‘भेंट चढ़ाना’ अभिप्रेत कार्य को स्पष्ट करता है।
- source_word: περὶ τοῦ καθαρισμοῦ σου
  choice: अपने शुद्धीकरण के लिए
  rationale: περί यहाँ उस विषय या प्रयोजन को बताता है जिसके संबंध में भेंट चढ़ाई जानी है; ‘शुद्धीकरण’ धार्मिक-विधिक संदर्भ को ठीक से व्यक्त करता है।
- source_word: καθὼς προσέταξεν Μωϋσῆς
  choice: वही ... जिसकी आज्ञा मूसा ने दी थी
  rationale: मूसा की व्यवस्था में निर्धारित भेंट की ओर संकेत को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: εἰς μαρτύριον αὐτοῖς
  choice: ताकि उनके लिए गवाही हो
  rationale: उद्देश्य/परिणाम और अस्पष्ट बहुवचन सर्वनाम दोनों को सुरक्षित रखता है, बिना यह तय किए कि ‘उनके’ से कौन अभिप्रेत हैं या गवाही का भाव अनुकूल है अथवा प्रतिकूल।
theological_decisions:
- issue: εἰς μαρτύριον αὐτοῖς में ‘उनके’ का संदर्भ और गवाही का स्वरूप
  choice: ‘उनके लिए गवाही’ कहकर संदर्भ और स्वरूप को अनिर्धारित रखा गया।
  alternative: ‘याजकों के लिए गवाही’, ‘लोगों के लिए गवाही’, अथवा ‘उनके विरुद्ध प्रमाण’।
  rationale: यूनानी पाठ αὐτοῖς के संदर्भित समूह को स्पष्ट नहीं करता और μαρτύριον अपने आप यह निर्धारित नहीं करता कि गवाही अनुकूल है या प्रतिकूल; इसलिए मूल की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध शैली अपनाई गई है। ‘याजक’, ‘शुद्धीकरण’ और ‘भेंट चढ़ाना’ विधिक-उपासना संदर्भ को बनाए रखते हैं। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न उपस्थित हैं।
