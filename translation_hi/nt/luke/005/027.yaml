- source_word: καθήμενον
  choice: बैठे
  rationale: लेवी को अपनी चौकी पर बैठे होने की अवस्था में चित्रित करने वाले वर्तमान कृदंत को सुरक्षित रखता है।
- source_word: ἐπὶ τὸ τελώνιον
  choice: कर-वसूली की चौकी पर
  rationale: τελώνιον कर, चुंगी या सीमा-शुल्क वसूले जाने के स्थान को दर्शाता है; ‘चौकी’ दृश्य को ठोस रखते हुए व्यापक ऐतिहासिक संभावना को समेटती है।
- source_word: Ἀκολούθει μοι
  choice: मेरे पीछे चलो
