- source_word: ἐθεάσατο
  choice: देखा
  rationale: θεάομαι ध्यान से देखने या गौर करने का भाव दे सकता है, पर प्रसंग में ‘देखा’ सर्वाधिक स्वाभाविक है; संभावित अतिरिक्त सूक्ष्मता को पादटिप्पणी में रखा गया है।
- source_word: τελώνην
  choice: कर-वसूलने वाला
  rationale: उस व्यक्ति की सामाजिक और प्रशासनिक भूमिका को साधारण आधुनिक पाठक के लिए स्पष्ट करता है, बिना अनावश्यक तकनीकी शब्दावली के।
- source_word: ὀνόματι Λευὶν
  choice: लेवी नाम के
