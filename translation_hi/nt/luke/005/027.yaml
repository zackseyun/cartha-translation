  alternative: “मेरे शिष्य बनो” या “मेरे पीछे मेरे शिष्य के रूप में चलो”
  rationale: प्रसंग में आज्ञा शिष्यत्व का आह्वान है, पर यूनानी पाठ स्वयं केवल अनुसरण करने की आज्ञा देता है। अनुवाद उस अर्थ को व्याख्यात्मक शब्द जोड़कर सीमित नहीं करता।
