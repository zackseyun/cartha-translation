  text: But he would withdraw in the wilderness and pray[a].
translation:
  language: hi
  text: परन्तु वह निर्जन स्थानों में चला जाया करता था और प्रार्थना करता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “वह स्वयं निर्जन स्थानों में हट रहा था और प्रार्थना कर रहा था।” यूनानी में अपूर्णकालिक सहायक क्रिया के साथ वर्तमान कृदन्तों का विन्यास है, जो जारी या बार-बार होने वाली क्रिया व्यक्त कर सकता है।
    reason: व्याकरणिक और शाब्दिक विकल्प
lexical_decisions:
- source_word: αὐτὸς
  choice: वह
  rationale: यूनानी में सर्वनाम स्पष्ट और कुछ बलयुक्त है; हिन्दी में अलग से ‘वह स्वयं’ कहना यहाँ अनावश्यक रूप से अधिक जोर देगा। δὲ के ‘परन्तु’ से प्रसंगगत विरोध पर्याप्त रूप से प्रकट होता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले प्रसंग—यीशु की बढ़ती प्रसिद्धि और उमड़ती भीड़—के विपरीत उसकी नियमित एकांत-प्रार्थना को सामने लाता है।
- source_word: ἦν ὑποχωρῶν
  choice: अलग चला जाता
  rationale: ἦν के साथ वर्तमान कृदन्त का अपूर्णकालिक विन्यास बीते समय की जारी या प्रायः होने वाली क्रिया बताता है। ‘चला जाता’ आधुनिक हिन्दी में उस नियमित अभ्यास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐν ταῖς ἐρήμοις
  choice: निर्जन स्थानों में
  rationale: बहुवचन ἐρήμοις का आशय आबादी से दूर, सुनसान क्षेत्रों से है; ‘निर्जन स्थानों’ से किसी विशेष रेगिस्तानी भू-दृश्य का अनावश्यक संकेत नहीं मिलता और ἐν का ‘में’ भी सुरक्षित रहता है।
- source_word: καὶ
  choice: और
  rationale: दो नियमित, परस्पर संबद्ध क्रियाओं का सरल समन्वय।
- source_word: προσευχόμενος
  choice: प्रार्थना करता था
  rationale: यह सहभागी क्रिया पीछे हटने के साथ होने वाली नियमित प्रार्थना को बताती है; ‘करता था’ हिन्दी में उसकी अभ्यस्त प्रकृति स्पष्ट करता है।
theological_decisions:
- issue: यीशु की क्रिया का कालगत पक्ष
  choice: वचन यीशु के निर्जन स्थानों में अलग जाकर प्रार्थना करने के नियमित अभ्यास का वर्णन करता है।
  alternative: यह केवल एक विशेष अवसर पर अलग जाने और प्रार्थना करने का वर्णन है।
  rationale: ἦν + वर्तमान कृदन्तों का अपूर्णकालिक विन्यास प्रायः जारी या अभ्यस्त क्रिया व्यक्त करता है। अनुवाद इसी व्याकरणिक संभावना को प्रमुख रखता है, पर पादटिप्पणी अधिक शाब्दिक रूप भी देती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘निर्जन स्थानों’ बहुवचन मूल के अनुरूप है; ‘अलग चला जाता’ भीड़ से हटने और नियमित अभ्यास—दोनों भावों को स्वाभाविक रूप से रखता है।
