  yaml_path: translation/nt/luke/005/020.yaml
  text: And seeing their faith[a], he said, “Man[c][b], your sins are forgiven.”
translation:
  language: hi
  text: और उनका विश्वास[a] देखकर उसने कहा, “मनुष्य, तुम्हारे पाप क्षमा हो गए हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
