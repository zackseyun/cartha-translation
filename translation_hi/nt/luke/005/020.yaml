    text: या “क्षमा किए गए हैं।” यूनानी का पूर्ण कर्मवाच्य पूर्ण हुई क्रिया से उत्पन्न वर्तमान दशा पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: देखकर
  rationale: क्रियाविशेषणात्मक कृदन्त को स्वाभाविक हिन्दी में रखते हुए मुख्य क्रिया के साथ इसका निकट कालगत संबंध बनाए रखता है।
- source_word: πίστιν
  choice: विश्वास
  rationale: यहाँ यह शब्द उस भरोसे को बताता है जो लकवे के रोगी और उससे जुड़े लोगों के कार्य में प्रकट हुआ; ‘विश्वास’ मानक और प्रसंगानुकूल हिन्दी है।
- source_word: αὐτῶν
  choice: उनका
  rationale: मूल पाठ के बहुवचन को सुरक्षित रखता है और यह तय नहीं करता कि विश्वास केवल उठाकर लाने वालों का था या रोगी सहित पूरे समूह का।
- source_word: Ἄνθρωπε
  choice: हे मनुष्य
  rationale: पुल्लिंग एकवचन संबोधन को सीधे सुरक्षित रखता है। ‘मित्र’ जैसी अभिव्यक्ति मूल में निहित आत्मीयता से अधिक अर्थ जोड़ देती।
- source_word: ἀφέωνταί
  choice: क्षमा हो गए हैं
  rationale: यूनानी पूर्णकालीन कर्मवाच्य से व्यक्त उस वर्तमान दशा को दर्शाता है जो पूर्ण हुई क्रिया का परिणाम है; हिन्दी में यह सहज और स्पष्ट है।
- source_word: ἁμαρτίαι
  choice: पाप
  rationale: नैतिक और धर्मवैचारिक अर्थ को बिना हल्का किए शब्द का सीधा, प्रचलित अनुवाद है।
- source_word: σοι ... σου
  choice: तुम्हारे
  rationale: ‘तुम्हारे पाप’ स्वाभाविक हिन्दी में पापों और संबोधित व्यक्ति—दोनों के संबंध को स्पष्ट करता है; अलग से ‘तुम्हें’ जोड़ना अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ‘उनका विश्वास’ का दायरा
  choice: बहुवचन ‘उनका’ ज्यों का त्यों रखा गया है।
  alternative: इसे केवल रोगी को उठाकर लाने वाले लोगों का विश्वास, अथवा रोगी और उसके साथियों का साझा विश्वास माना जा सकता है।
  rationale: यूनानी बहुवचन संदर्भित समूह को और संकीर्ण नहीं करता; अनुवाद भी इस कथात्मक और धर्मवैचारिक अस्पष्टता को बनाए रखता है।
- issue: क्षमा की घोषणा का कालगत बल
  choice: ‘क्षमा हो गए हैं’ पूर्ण हुई क्रिया से उत्पन्न वर्तमान दशा व्यक्त करता है।
  alternative: इसे उसी क्षण प्रभावी हुई क्षमा की घोषणा, या पहले से दी जा चुकी क्षमा की घोषणा समझा जा सकता है।
  rationale: यूनानी पूर्णकालीन कर्मवाच्य क्षमा की वास्तविकता बताता है, पर उसके सटीक कालगत-धर्मवैचारिक ढंग को निर्णायक रूप से नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। ‘हे मनुष्य’ सामान्य बातचीत की अपेक्षा अधिक औपचारिक है, पर मूल के सीधे पुल्लिंग संबोधन को बिना अतिरिक्त आत्मीयता जोड़े सुरक्षित रखता है।
