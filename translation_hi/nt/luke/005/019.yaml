base_translation:
  language: en
  yaml_path: translation/nt/luke/005/019.yaml
  text: And not finding a way to bring him in because of the crowd[a], they went up on the roof and lowered him with his mat through the tiles into the middle[c][b], in front of Jesus.
translation:
  language: hi
  text: उसे भीतर ले जाने का कोई रास्ता न मिलने पर[a], वे छत पर चढ़ गए और छत की खपरैलों[b] के बीच से उसे उसकी चटाई[c] समेत नीचे उतारकर बीच में, यीशु के सामने रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे भीतर कैसे ले जाएँ, इसका कोई उपाय नहीं मिला।” यूनानी मुहावरा प्रवेश के रास्ते और ले जाने के तरीके—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात छत की खपरैलों के बीच से। लूका के शब्द मिट्टी की खपरैलों वाली छत का संकेत देते हैं।
    reason: cultural_note
  - marker: c
    text: “चटाई” के लिए प्रयुक्त यूनानी शब्द का अनुवाद “छोटी खाट” या “बिछौना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποίας εἰσενέγκωσιν
  choice: भीतर ले जाने का कोई रास्ता
  rationale: यह यूनानी मुहावरा ‘किस रास्ते से’ अथवा ‘कैसे’ का भाव दे सकता है। प्रसंग में भीड़ के कारण प्रवेश का मार्ग न मिलना प्रमुख है; इसलिए यह स्वाभाविक हिन्दी उस स्थानगत अर्थ को बनाए रखती है।
- source_word: διὰ τὸν ὄχλον
  choice: भीड़ के कारण
  rationale: διά के साथ कर्मकारक यहाँ कारण बताता है, न कि भीड़ के बीच से जाने का स्थानगत अर्थ।
- source_word: ἀναβάντες ἐπὶ τὸ δῶμα
  choice: वे छत पर चढ़ गए
  rationale: δῶμα घर की छत को दर्शाता है और ἀναβάντες ऊपर जाने की क्रिया को; यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: διὰ τῶν κεράμων
  choice: खपरैलों के बीच से
  rationale: κέραμοι मिट्टी की छत की पट्टियों अथवा खपरैलों को दर्शाता है। ‘खपरैलों के बीच से’ लूका के स्थापत्य-विवरण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καθῆκαν
  choice: नीचे उतारकर
  rationale: क्रिया का अर्थ ऊपर से नीचे उतारना है; हिन्दी वाक्यक्रम में संयोजक कृदंत घटना की गति को सहज रखता है।
- source_word: σὺν τῷ κλινιδίῳ
  choice: उसकी चटाई समेत
  rationale: κλινίδιον एक छोटी खाट, बिछौने या ले जाने योग्य चटाई का संकेत देता है। ‘चटाई’ सरल है और आधुनिक चिकित्सकीय ‘स्ट्रेचर’ का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: εἰς τὸ μέσον
  choice: सबके बीच
  rationale: शाब्दिक भाव ‘बीच में’ है। सभा के केंद्रीय स्थान का अर्थ हिन्दी में ‘सबके बीच’ से स्पष्ट होता है।
- source_word: ἔμπροσθεν τοῦ Ἰησοῦ
  choice: यीशु के सामने
  rationale: यह यीशु के आगे स्थित स्थान को बताता है; ‘सामने’ आधुनिक हिन्दी में स्पष्ट स्थानगत अभिव्यक्ति है।
