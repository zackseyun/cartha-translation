  choice: ज़बदी के बेटे
  rationale: पारिवारिक पहचान को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κοινωνοὶ
  choice: साझेदार
  rationale: मछली पकड़ने के व्यवसाय के संदर्भ में यह केवल साथियों के बजाय व्यावसायिक साझेदारी का सबसे स्वाभाविक संकेत देता है।
- source_word: Μὴ φοβοῦ
  choice: मत डर
  rationale: यीशु द्वारा शमौन को एकवचन में दिए गए आश्वासन को सीधी, स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: शमौन के बुलावे में आरम्भ होने वाले निर्णायक परिवर्तन को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἀνθρώπους
  choice: लोगों को
  rationale: यहाँ शब्द समस्त मनुष्यों को सूचित करता है, केवल पुरुषों को नहीं; ‘लोगों’ से आशय स्वाभाविक और लिंग-सटीक रहता है।
- source_word: ζωγρῶν
  choice: जीवित पकड़ा करेगा
  rationale: क्रिया में निहित ‘जीवित पकड़ने’ के अर्थ को बनाए रखता है और लूका की विशिष्ट शब्दावली को मत्ती तथा मरकुस के ‘मनुष्यों के मछुए’ वाले रूप से नहीं मिलाता।
theological_decisions:
- issue: यीशु के बुलावे में ζωγρέω के रूपक का अनुवाद
  choice: तू लोगों को जीवित पकड़ा करेगा
  alternative: तू लोगों को पकड़ा करेगा; तू मनुष्यों का मछुआरा होगा
  rationale: लूका ने ऐसी क्रिया प्रयुक्त की है जिसका अर्थ जीवित पकड़ना है। मुख्य पाठ में इसे बनाए रखने से लूका का विशिष्ट रूपक और उसका जीवन-संरक्षक तनाव सुरक्षित रहता है; समानांतर पदों की अधिक परिचित भाषा यहाँ आरोपित नहीं की गई।
- issue: ἀνθρώπους का लिंग-सटीक अनुवाद
  choice: लोगों को
  alternative: मनुष्यों को; पुरुषों को
  rationale: संदर्भ में लक्ष्य सामान्यतः मानव लोग हैं, केवल पुरुष नहीं। ‘लोगों’ से अर्थ स्पष्ट और आधुनिक हिन्दी स्वाभाविक रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सीधी और गरिमापूर्ण शैली। शमौन के लिए एकवचन निकट संबोधन ‘तू’ मूल यूनानी एकवचन को स्पष्ट रखता है। आरम्भ में ‘चकित हुए’ पिछले पद की लुप्त क्रिया को हिन्दी में पूरा करता है, क्योंकि यूनानी वाक्य भी पद 9 की प्रतिक्रिया को याकूब और यूहन्ना पर लागू करता है।
