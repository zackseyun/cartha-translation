  text: and likewise also James and John, Zebedee’s sons, who were partners with Simon. And Jesus said to Simon, “Do not be afraid; from now on you will be catching people alive.”
translation:
  language: hi
  text: और इसी तरह ज़बदी के बेटे याकूब और यूहन्ना भी चकित हुए, जो शमौन के साझेदार थे। और यीशु ने शमौन से कहा, “मत डर; अब से तू लोगों को जीवित पकड़ेगा।”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी क्रिया का अर्थ किसी को “जीवित पकड़ना” या “जीवित बंदी बनाना” है। इसलिए यहाँ केवल सामान्य रूप से पकड़ने की नहीं, जीवित पकड़ने की छवि है।
    reason: lexical_alternative
  - marker: b
    text: मत्ती 4:19 और मरकुस 1:17 से तुलना करें, जहाँ यीशु कहते हैं, “मैं तुम्हें मनुष्यों के मछुए बनाऊँगा।” लूका की शब्दावली यहाँ भिन्न है।
    reason: cross_reference
