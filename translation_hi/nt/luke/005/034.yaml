  text: ὁ ⸀δὲ εἶπεν πρὸς αὐτούς· Μὴ δύνασθε τοὺς υἱοὺς τοῦ νυμφῶνος ἐν ᾧ ὁ νυμφίος μετ’ αὐτῶν ἐστιν ποιῆσαι ⸀νηστεῦσαι;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/034.yaml
  text: And he said to them[a], “You cannot make the wedding guests fast while the bridegroom is with them, can you?”
translation:
  language: hi
  text: तब उसने उनसे कहा, “जब तक दूल्हा विवाह के अतिथियों[a] के साथ है, तब तक तुम उनसे उपवास नहीं करवा सकते, है न?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “विवाह-कक्ष के पुत्र”; यह दूल्हे के साथियों या विवाह के अतिथियों के लिए प्रयुक्त एक मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μὴ δύνασθε
  choice: क्या तुम ... करवा सकते हो?
  rationale: μή के साथ संकेतार्थक क्रिया वाला प्रश्न नकारात्मक उत्तर की अपेक्षा रखता है। हिंदी में संदर्भ सहित यह प्रश्न स्वाभाविक रूप से उसी अलंकारिक बल को व्यक्त करता है।
- source_word: τοὺς υἱοὺς τοῦ νυμφῶνος
  choice: विवाह के अतिथियों
  rationale: शाब्दिक अभिव्यक्ति ‘विवाह-कक्ष के पुत्र’ एक मुहावरा है, जो विवाह-उत्सव में दूल्हे के साथ रहने वालों को दर्शाता है। ‘विवाह के अतिथि’ आधुनिक हिंदी में इसका स्पष्ट और स्वाभाविक अर्थ देता है।
- source_word: ὁ νυμφίος
  choice: दूल्हा
  rationale: यह सामान्य आधुनिक हिंदी में bridegroom का स्पष्ट समतुल्य है और विवाह संबंधी रूपक को बनाए रखता है।
- source_word: μετ’ αὐτῶν ἐστιν
  choice: उनके साथ है
  rationale: मूल वाक्यांश दूल्हे की उनके साथ वर्तमान उपस्थिति बताता है; यह उसका सीधा और स्वाभाविक अनुवाद है।
- source_word: ποιῆσαι νηστεῦσαι
  choice: उनसे उपवास करवा सकते हो
  rationale: ποιέω के बाद infinitive यहाँ प्रेरणार्थक अर्थ देता है। ‘उपवास करवा सकते हो’ उस causative भाव को सुरक्षित रखता है, जिसे केवल ‘वे उपवास कर सकते हैं’ कहने से खो दिया जाता।
- source_word: νηστεῦσαι
  choice: उपवास
  rationale: धार्मिक संदर्भ में यह मानक, संक्षिप्त और सहज हिंदी शब्द है।
theological_decisions:
- issue: यीशु की दूल्हे के रूप में रूपकात्मक पहचान
  choice: ‘दूल्हा’ की छवि को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: मुख्य पाठ में स्पष्ट कर देना कि यीशु अपने को दूल्हे के रूप में प्रस्तुत कर रहा है।
  rationale: पद स्वयं रूपक प्रस्तुत करता है और यीशु की विशेष भूमिका का संकेत देता है, पर अनुवाद में उसके धर्मवैज्ञानिक आशय को अतिरिक्त शब्दों से निश्चित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘जब तक ... तब तक’ की रचना ने ἐν ᾧ के समय-संबंध को स्पष्ट रखा है; प्रश्न का अपेक्षित उत्तर ‘नहीं’ है।
