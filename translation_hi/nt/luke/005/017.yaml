  text: Καὶ ἐγένετο ἐν μιᾷ τῶν ἡμερῶν καὶ αὐτὸς ἦν διδάσκων, καὶ ἦσαν καθήμενοι Φαρισαῖοι καὶ νομοδιδάσκαλοι οἳ ἦσαν ἐληλυθότες ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ· καὶ δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι ⸀αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/017.yaml
  text: And it happened on one of those days that he was teaching[a], and Pharisees and teachers of the law were sitting there, who had come from every village of Galilee and Judea and from Jerusalem; and the power of the Lord was there for him to heal.
translation:
  language: hi
  text: एक दिन ऐसा हुआ कि वह शिक्षा दे रहा था। वहाँ फ़रीसी और व्यवस्था के शिक्षक बैठे हुए थे, जो गलील और यहूदिया के हर गाँव से और यरूशलेम से आए थे। और प्रभु की सामर्थ्य वहाँ थी, ताकि वह चंगा करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पांडुलिपियों में “वह चंगा करे” के स्थान पर “उन्हें चंगा करे” है।
    reason: textual_variant
lexical_decisions:
- source_word: ἐγένετο ἐν μιᾷ τῶν ἡμερῶν
  choice: एक दिन ऐसा हुआ
  rationale: लूका की प्रचलित कथात्मक भूमिका को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; शब्दशः बोझिलता से बचते हुए घटना के आरम्भ का भाव बनाए रखता है।
- source_word: αὐτὸς ἦν διδάσκων
  choice: वह शिक्षा दे रहा था
  rationale: परिभाषात्मक अपूर्णकाल जारी क्रिया को दर्शाता है; αὐτός को यहाँ अनावश्यक रूप से बलाघाती ‘वह स्वयं’ नहीं बनाया गया।
- source_word: Φαρισαῖοι καὶ νομοδιδάσκαλοι
  choice: फ़रीसी और व्यवस्था के शिक्षक
  rationale: फ़रीसी स्थापित हिन्दी रूप है और ‘व्यवस्था के शिक्षक’ मूसा की व्यवस्था सिखाने वालों के अर्थ को सीधे व्यक्त करता है।
- source_word: ἐκ πάσης κώμης τῆς Γαλιλαίας καὶ Ἰουδαίας καὶ Ἰερουσαλήμ
  choice: गलील और यहूदिया के हर गाँव से और यरूशलेम से
  rationale: κώμη को ‘गाँव’ और πάσης को ‘हर’ से दर्शाया गया है; यरूशलेम नगर होने के कारण उसके पहले ‘से’ दोहराना हिन्दी में भूगोल स्पष्ट करता है।
- source_word: δύναμις κυρίου
  choice: प्रभु की सामर्थ्य
  rationale: सम्बन्धकारक रचना और दैवी शक्ति का धार्मिक भार सुरक्षित रहता है; κύριος के लिए परियोजना का सामान्य रूप ‘प्रभु’ रखा गया है।
- source_word: ἦν εἰς τὸ ἰᾶσθαι αὐτόν
  choice: उसके चंगा करने के लिए उपस्थित थी
  rationale: प्रदत्त पाठ αὐτόν के अनुसार यीशु को चंगा करने की क्रिया का कर्ता समझते हुए प्रयोजन व्यक्त किया गया है; मुख्य पाठ में अनुपस्थित बहुवचन कर्म ‘उन्हें’ नहीं जोड़ा गया।
theological_decisions:
- issue: δύναμις κυρίου ἦν εἰς τὸ ἰᾶσθαι αὐτόν का आशय और αὐτόν का सम्बन्ध
  choice: प्रभु की सामर्थ्य यीशु के चंगा करने के लिए उपस्थित थी
  alternative: प्रभु की सामर्थ्य उन्हें चंगा करने के लिए उपस्थित थी
  rationale: SBLGNT के दिए हुए पाठ में αὐτόν है, इसलिए मुख्य पाठ यीशु की चंगा करने की क्रिया को व्यक्त करता है और ‘उन्हें’ नहीं जोड़ता। पाठान्तर को पादटिप्पणी में रखा गया है, जिससे वास्तविक पाठगत अनिश्चितता बनी रहती है।
- issue: κύριος का सन्दर्भ
  choice: प्रभु
  alternative: स्वामी
  rationale: यहाँ शब्द सबसे स्वाभाविक रूप से परमेश्वर की उस सामर्थ्य की ओर संकेत करता है जो यीशु की सेवा में कार्यरत है; ‘प्रभु’ सन्दर्भ को उससे अधिक संकीर्ण नहीं करता जितना यूनानी पाठ करता है।
