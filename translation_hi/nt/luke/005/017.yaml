  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘व्यवस्था’ और ‘सामर्थ्य’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठक के लिए स्पष्ट बनाया गया है।
