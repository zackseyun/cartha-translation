  edition: SBLGNT
  text: οὐκ ἐλήλυθα καλέσαι δικαίους ἀλλὰ ἁμαρτωλοὺς εἰς μετάνοιαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/032.yaml
  text: I have not come to call the righteous, but sinners to a change of mind.
translation:
  language: hi
  text: मैं धर्मियों को नहीं, बल्कि पापियों को मन फिराने के लिए[a] बुलाने आया हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पश्चाताप के लिए।” यूनानी वाक्यांश εἰς μετάνοιαν उद्देश्य या लक्ष्य व्यक्त करता है।
    reason: शब्दार्थ का प्रचलित वैकल्पिक अनुवाद तथा εἰς μετάνοιαν की उद्देश्यसूचक भूमिका स्पष्ट करना।
lexical_decisions:
- source_word: ἐλήλυθα
  choice: आया हूँ
  rationale: ἔρχομαι के पूर्णकाल रूप में आने से उत्पन्न वर्तमान स्थिति और यीशु के मिशन—दोनों का भाव है। हिंदी में ‘आया हूँ’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: καλέσαι
  choice: बुलाने
  rationale: यह उद्देश्यसूचक अनंत क्रिया है। ‘बुलाना’ निमंत्रण और अधिकारपूर्ण पुकार, दोनों की गुंजाइश बनाए रखता है।
- source_word: δικαίους
  choice: धर्मियों
  rationale: यह विशेषण संज्ञा के रूप में प्रयुक्त है। ‘धर्मियों’ नैतिक-धार्मिक वर्ग को बिना यह तय किए व्यक्त करता है कि वे सचमुच धर्मी हैं या अपने को धर्मी मानते हैं।
- source_word: ἁμαρτωλοὺς
  choice: पापियों
  rationale: यह संज्ञावत प्रयोग उन लोगों को दर्शाता है जिन्हें पापी कहा या माना जाता है; ‘पापियों’ इसका सीधा और प्रचलित हिंदी रूप है।
- source_word: εἰς μετάνοιαν
  choice: मन फिराने के लिए
  rationale: εἰς उद्देश्य या लक्ष्य दर्शाता है, और μετάνοια मन तथा जीवन-दिशा के परिवर्तन की ओर संकेत करता है। ‘मन फिराने के लिए’ केवल भावनात्मक पछतावे तक अर्थ को सीमित नहीं करता; प्रचलित विकल्प ‘पश्चाताप के लिए’ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या ‘धर्मियों’ का अर्थ सचमुच धर्मी लोग है या अपने को धर्मी मानने वाले लोग
  choice: पाठ में केवल ‘धर्मियों’ रखा गया है
  alternative: ‘अपने को धर्मी समझने वालों’ या ‘धर्मी माने जाने वालों’
  rationale: यूनानी वाक्य स्वयं कोई व्याख्यात्मक विशेषण नहीं जोड़ता। इसलिए उसका तनाव बनाए रखा गया है और यह तय नहीं किया गया कि कथन वास्तविक धार्मिकता के विषय में है या सामाजिक/आत्मधार्मिक पहचान के विषय में।
- issue: μετάνοια को केवल पछतावे के रूप में समझना या व्यापक मन-परिवर्तन के रूप में
  choice: मन फिराने के लिए
  alternative: पश्चाताप के लिए
  rationale: मूल शब्द में मन और दिशा बदलने का व्यापक भाव हो सकता है। मुख्य पाठ इसे खुला रखता है, जबकि परिचित धार्मिक पद ‘पश्चाताप’ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। वाक्य-विन्यास हिंदी के स्वाभाविक क्रम में है; ‘धर्मियों’ और ‘पापियों’ का मूल विरोध बिना व्याख्यात्मक विस्तार के रखा गया है।
