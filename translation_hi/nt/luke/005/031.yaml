  text: καὶ ἀποκριθεὶς ὁ Ἰησοῦς εἶπεν πρὸς αὐτούς· Οὐ χρείαν ἔχουσιν οἱ ὑγιαίνοντες ἰατροῦ ἀλλὰ οἱ κακῶς ἔχοντες·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/031.yaml
  text: And Jesus answered them[a], “Those who are healthy have no need of a physician, but those who are sick do.”
translation:
  language: hi
  text: यीशु ने उन्हें उत्तर दिया, “जो स्वस्थ हैं उन्हें चिकित्सक की आवश्यकता नहीं होती, बल्कि जो बीमार हैं उन्हें होती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς ... εἶπεν πρὸς αὐτούς
  choice: यीशु ने उन्हें उत्तर दिया
  rationale: यूनानी कथा-विन्यास में कृदंत और मुख्य क्रिया मिलकर उत्तर देने का प्रचलित सूत्र बनाते हैं। हिन्दी में दोनों क्रियाओं को अलग-अलग दोहराने के बजाय यह स्वाभाविक रूप प्रतिक्रियात्मक भाव और संबोधित लोगों—दोनों को सुरक्षित रखता है।
- source_word: Οὐ χρείαν ἔχουσιν
  choice: आवश्यकता नहीं होती
  rationale: यह χρεία और ἔχω के ‘आवश्यकता होना’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है; सामान्य सत्य के रूप में कथन होने के कारण ‘होती’ उपयुक्त है।
- source_word: οἱ ὑγιαίνοντες
  choice: जो स्वस्थ हैं
  rationale: वर्तमान कृदंत स्वास्थ्य की अवस्था में रहने वाले लोगों के वर्ग को दर्शाता है। ‘जो स्वस्थ हैं’ स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी है।
- source_word: ἰατροῦ
  choice: वैद्य
  rationale: ἰατρός का अर्थ रोग का उपचार करने वाला चिकित्सक है। ‘वैद्य’ संक्षिप्त और लोकोक्तिपरक शैली के अनुकूल है तथा आधुनिक हिन्दी पाठकों के लिए बोधगम्य है।
- source_word: οἱ κακῶς ἔχοντες
  choice: जो बीमार हैं
  rationale: κακῶς ἔχειν यहाँ बीमारी के लिए प्रयुक्त यूनानी मुहावरा है। शाब्दिक ‘जो बुरी दशा में हैं’ संदर्भ में अस्पष्ट होता; ‘जो बीमार हैं’ उसका स्थापित आशय ठीक व्यक्त करता है।
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पहले वर्ग के विपरीत दूसरे वर्ग को स्पष्ट रूप से प्रस्तुत करता है। हिन्दी में ‘बल्कि’ इस विरोधात्मक और सुधारात्मक संबंध को स्वाभाविक ढंग से बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य को सहज लोकोक्तिपरक लय में रखा गया है। ‘वैद्य’ गरिमापूर्ण और परिचित शब्द है। यूनानी के अंतिम खंड में निहित ‘आवश्यकता होती है’ को हिन्दी में स्पष्ट दोहराया गया है, ताकि वाक्य अधूरा न लगे।
