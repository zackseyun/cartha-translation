id: LUK.5.23
reference: Luke 5:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: τί ἐστιν εὐκοπώτερον, εἰπεῖν· Ἀφέωνταί σοι αἱ ἁμαρτίαι σου, ἢ εἰπεῖν· ⸀Ἔγειρε καὶ περιπάτει;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/023.yaml
  text: 'Which is easier: to say[a], ‘Your sins are forgiven you,’ or to say, ‘Rise and walk’?”'
translation:
  language: hi
  text: 'कौन-सी बात कहना अधिक आसान है: ‘तुम्हारे पाप क्षमा हो गए हैं,’[a] या यह कहना, ‘उठो और चलो’?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे पाप क्षमा किए गए हैं।”
    reason: यूनानी perfect passive को हिन्दी में क्रिया की पूर्णता और निष्क्रियता पर कुछ अधिक बल देकर भी व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: τί ἐστιν εὐκοπώτερον
  choice: कौन-सी बात ... अधिक आसान है
  rationale: यह तुलनात्मक प्रश्न के स्वाभाविक हिन्दी रूप को व्यक्त करता है और दोनों कथनों के बीच तुलना बनाए रखता है।
- source_word: εἰπεῖν
  choice: कहना
  rationale: दोनों वैकल्पिक कथनों की विषयवस्तु प्रस्तुत करने वाले infinitive का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: Ἀφέωνταί
  choice: क्षमा हो गए हैं
  rationale: ἀφίημι यहाँ पापों की क्षमा के लिए प्रयुक्त है। यह रूप पूर्ण हुई क्रिया से उत्पन्न वर्तमान अवस्था को व्यक्त करता है और कर्ता को अनिर्दिष्ट रखता है।
- source_word: σοι
  choice: तुम्हारे
  rationale: हिन्दी में पापों के साथ संबंध व्यक्त करने वाला यह स्वाभाविक विन्यास है; अगले σου के साथ अलग-अलग अनुवाद करने पर होने वाली असहज पुनरुक्ति से बचता है।
- source_word: αἱ ἁμαρτίαι σου
  choice: तुम्हारे पाप
  rationale: स्वामित्व-सूचक यूनानी पदबंध का सीधा, स्पष्ट और मुहावरेदार हिन्दी रूप।
- source_word: ἢ
  choice: या
  rationale: दो वैकल्पिक कथनों को जोड़ने वाला सामान्य विकल्पसूचक संयोजक।
- source_word: Ἔγειρε
  choice: उठो
  rationale: आदेश का संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: καὶ περιπάτει
  choice: और चलो
  rationale: यहाँ περιπατέω शाब्दिक रूप से चलने को दर्शाता है; ‘चलो’ आदेशात्मक अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: यूनानी perfect passive में क्षमा की घोषणा और उसके कर्ता को कैसे व्यक्त किया जाए
  choice: तुम्हारे पाप क्षमा हो गए हैं
  alternative: तुम्हारे पाप क्षमा किए गए हैं
  rationale: चुना हुआ रूप पूर्ण हुई क्षमा के परिणामस्वरूप वर्तमान अवस्था को व्यक्त करता है, साथ ही निष्क्रिय क्रिया के कर्ता को अनिर्दिष्ट रखता है। यह क्षमा की कार्यविधि या कर्तृत्व के विषय में पाठ से अधिक नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक प्रश्न के रूप में स्वाभाविक। ‘उठो और चलो’ संक्षिप्त आज्ञार्थक लय को बनाए रखता है।
