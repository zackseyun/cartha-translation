source:
  edition: SBLGNT
  text: ἐλεύσονται δὲ ἡμέραι, καὶ ὅταν ἀπαρθῇ ἀπ’ αὐτῶν ὁ νυμφίος τότε νηστεύσουσιν ἐν ἐκείναις ταῖς ἡμέραις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/035.yaml
  text: But days will come[a], and when the bridegroom is taken away from them, then they will fast in those days.
translation:
  language: hi
  text: परन्तु वे दिन आएँगे, और जब दूल्हे को उनसे अलग कर दिया जाएगा, तब वे उन दिनों में उपवास करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλεύσονται ... ἡμέραι
  choice: वे दिन आएँगे
  rationale: यूनानी मुहावरे की भावी और कुछ हद तक गंभीर ध्वनि को स्वाभाविक हिन्दी में बनाए रखता है। हिन्दी में ‘वे’ आगे उल्लिखित विशिष्ट समय की ओर संकेत करता है।
- source_word: δὲ
  choice: परन्तु
  rationale: पिछले प्रसंग की वर्तमान आनंदपूर्ण स्थिति और आने वाले उपवास के बीच हल्का विरोध प्रकट करता है।
- source_word: ὅταν
  choice: जब
  rationale: भविष्य में घटने वाली घटना के समय को सहज और सटीक हिन्दी में व्यक्त करता है।
- source_word: ἀπαρθῇ
  choice: छीन लिया जाएगा
  rationale: निष्क्रिय रूप और किसी के द्वारा बलपूर्वक अलग किए जाने की अशुभ ध्वनि दोनों को सुरक्षित रखता है; इसे केवल स्वेच्छा से चले जाने के अर्थ तक सीमित नहीं करता।
- source_word: ἀπ’ αὐτῶν
  choice: उनसे
  rationale: दूल्हे और उसके साथियों के बीच होने वाले अलगाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὁ νυμφίος
  choice: दूल्हा
  rationale: आधुनिक सामान्य हिन्दी में विवाह-रूपक के लिए स्पष्ट, स्वाभाविक और सम्मानजनक शब्द है।
- source_word: τότε
  choice: तब
  rationale: दूल्हे के छीन लिए जाने के बाद के समय और परिणाम पर स्पष्ट बल देता है।
- source_word: νηστεύσουσιν
  choice: वे ... उपवास करेंगे
  rationale: धार्मिक उपवास के विशिष्ट अर्थ को बनाए रखता है, केवल भोजन न करने का सामान्य अर्थ नहीं देता।
- source_word: ἐν ἐκείναις ταῖς ἡμέραις
  choice: उन दिनों में
  rationale: यूनानी पाठ में ‘दिनों’ की पुनरावृत्ति और उससे उत्पन्न बल को सुरक्षित रखता है।
theological_decisions:
- issue: क्या ἀπαρθῇ के निष्क्रिय और बलपूर्ण अर्थ को नरम करके केवल प्रस्थान बताया जाए
  choice: दूल्हा उनसे छीन लिया जाएगा
  alternative: दूल्हा उनसे चला जाएगा
  rationale: यूनानी क्रिया दूल्हे के मात्र स्वेच्छापूर्वक चले जाने के बजाय उसे उनसे हटा दिए जाने का संकेत देती है। यह अनिष्टसूचक तनाव को बनाए रखती है, बिना भावी घटना की व्याख्या पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण बाइबिलीय शैली। वाक्य की समन्वयी रचना, ‘तब’ और ‘उन दिनों में’ की पुनरावृत्ति मूल यूनानी के बल को यथासंभव बनाए रखती है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘छीन लिया जाएगा’ मूल क्रिया की महत्वपूर्ण ध्वनि को सीधे मुख्य पाठ में व्यक्त करता है।
