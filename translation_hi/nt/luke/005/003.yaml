- from: फिर वह नावों में से एक पर चढ़ गया, जो शमौन की थी, और उससे कहा कि नाव को किनारे से थोड़ा दूर ले चले। तब वह बैठकर नाव में से भीड़ों को शिक्षा देने लगा।
  to: फिर वह नावों में से एक पर चढ़ गया, जो शमौन की थी, और उससे अनुरोध किया कि वह नाव को किनारे से थोड़ा दूर ले जाए। तब वह बैठ गया और नाव से भीड़ों को शिक्षा दे रहा था।
  rationale: 'The revision removes the added ingressive meaning, more faithfully renders Jesus’ request, and uses idiomatic Hindi for teaching from the boat. No footnote is required: “किनारे से” is a clear contextual rendering of ἀπὸ τῆς γῆς, while the source’s land/shore nuance does not create a material ambiguity in Hindi.'
  reviewer_model: gpt-5.6-terra
