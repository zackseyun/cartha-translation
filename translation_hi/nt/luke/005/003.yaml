id: LUK.5.3
reference: Luke 5:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐμβὰς δὲ εἰς ἓν τῶν πλοίων, ὃ ⸀ἦν Σίμωνος, ἠρώτησεν αὐτὸν ἀπὸ τῆς γῆς ἐπαναγαγεῖν ὀλίγον, ⸂καθίσας δὲ ἐκ τοῦ πλοίου ἐδίδασκεν⸃ τοὺς ὄχλους.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/003.yaml
  text: Then he got into one of the boats[a], which belonged to Simon, and asked him to put out a little from the land. Then he sat down and was teaching the crowds from the boat.
translation:
  language: hi
  text: फिर वह नावों में से एक पर चढ़ गया, जो शमौन की थी, और उससे अनुरोध किया कि वह नाव को किनारे से थोड़ा दूर ले जाए। तब वह बैठ गया और नाव से भीड़ों को शिक्षा दे रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμβὰς
  choice: पर चढ़ गया
  rationale: नाव में प्रवेश करने की पूर्ववर्ती क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: πλοίων / πλοίου
  choice: नावों / नाव
  rationale: झील की मछली पकड़ने वाली छोटी नौकाओं के संदर्भ में ‘नाव’ उपयुक्त है; यूनानी के बहुवचन और एकवचन को सुरक्षित रखा गया है।
- source_word: ὃ ἦν Σίμωνος
  choice: जो शमौन की थी
  rationale: सम्बन्धकारक Σίμωνος के स्वामित्व-बोध को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠρώτησεν
  choice: उससे कहा
  rationale: इस प्रसंग में ἐρωτάω विनम्र अनुरोध को दर्शाता है; ‘कहा कि’ हिन्दी में अगले क्रियार्थक वाक्यांश के साथ अधिक सहज है और आदेश की कठोरता नहीं लाता।
- source_word: ἐπαναγαγεῖν
  choice: नाव को ... दूर ले चले
  rationale: नौका को सूखी भूमि से कुछ दूरी पर जल में ले जाने का प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: ἀπὸ τῆς γῆς
  choice: किनारे से
  rationale: γῆ का मूल अर्थ ‘भूमि’ है, पर नाव के संदर्भ में आशय जल के किनारे की सूखी भूमि से है; ‘किनारे से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὀλίγον
  choice: थोड़ा दूर
  rationale: स्थानगत छोटी दूरी को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: καθίσας
  choice: बैठकर
  rationale: मुख्य शिक्षण-क्रिया से पहले बैठने की क्रमिक क्रिया को हिन्दी के स्वाभाविक पूर्वकालिक कृदन्त से व्यक्त करता है।
- source_word: ἐκ τοῦ πλοίου
  choice: नाव में से
  rationale: 'ἐκ के स्रोत-बोध को बनाए रखता है: यीशु नाव के भीतर बैठकर वहीं से लोगों को सिखा रहा था।'
- source_word: ἐδίδασκεν
  choice: शिक्षा देने लगा
  rationale: अपूर्ण भूतकाल की चलती हुई क्रिया को प्रसंग में स्वाभाविक हिन्दी से व्यक्त करता है; यह आरम्भ-बोध संदर्भगत है, यद्यपि यूनानी में अलग से ‘आरम्भ करना’ क्रिया नहीं है।
- source_word: τοὺς ὄχλους
  choice: भीड़ों को
  rationale: यूनानी बहुवचन ὄχλους को बनाए रखता है और अनेक समूहों अथवा बड़ी जनसमष्टि का संकेत देता है।
