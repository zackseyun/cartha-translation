source:
  edition: SBLGNT
  text: ⸀καὶ οὐδεὶς πιὼν ⸀παλαιὸν θέλει νέον· λέγει γάρ· Ὁ παλαιὸς ⸀χρηστός ἐστιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/039.yaml
  text: And no one[a], after drinking old wine, wants new, for he says, ‘The old is good.’
translation:
  language: hi
  text: और कोई भी पुराना दाखरस पीने के बाद नया नहीं चाहता, क्योंकि वह कहता है, “पुराना अच्छा[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में है, “पुराना बेहतर है।”
    reason: textual_variant
lexical_decisions:
- source_word: οὐδεὶς
  choice: कोई भी...नहीं
  rationale: यह किसी भी व्यक्ति के विषय में सामान्य निषेध व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और सर्वसमावेशी है।
- source_word: πιὼν
  choice: पीने के बाद
  rationale: अओरिस्ट कृदन्त की मुख्य क्रिया से पहले पूरी हुई क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: παλαιὸν
  choice: पुराना दाखरस
  rationale: यूनानी में संज्ञा संदर्भ से निहित है; पिछले पदों के दाखरस-विषयक संदर्भ को स्पष्ट रखने के लिए हिन्दी में ‘दाखरस’ जोड़ा गया है।
- source_word: θέλει
  choice: चाहता
  rationale: यहाँ θέλω इच्छा अथवा पसंद को व्यक्त करता है; ‘चाहता’ सरल और समकालीन हिन्दी है।
- source_word: νέον
  choice: नया
  rationale: यूनानी की तरह संज्ञा को निहित रखा गया है; निकटवर्ती ‘दाखरस’ से अर्थ स्पष्ट है।
- source_word: λέγει γάρ
  choice: क्योंकि वह कहता है
  rationale: γάρ पिछले कथन का कारण बताता है और λέγει प्रत्यक्ष कथन की भूमिका बाँधता है।
- source_word: Ὁ παλαιὸς
  choice: पुराना
  rationale: यूनानी के संक्षिप्त, लोकोक्तिपरक रूप के अनुरूप ‘दाखरस’ को यहाँ निहित रखा गया है।
- source_word: χρηστός
  choice: अच्छा
  rationale: χρηστός का यहाँ सामान्य सकारात्मक अर्थ ‘अच्छा/सुखद’ है; मूल पाठ में तुलनात्मक ‘बेहतर’ नहीं है।
theological_decisions:
- issue: पुराने दाखरस के विषय में χρηστός का अनुवाद
  choice: अच्छा
  alternative: बेहतर
  rationale: मुद्रित यूनानी पाठ में χρηστός है, जिसका सीधा अर्थ ‘अच्छा’ या ‘सुखद’ है, न कि तुलनात्मक ‘बेहतर’। इसलिए पारंपरिक वैकल्पिक पाठ को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। ‘दाखरस’ बाइबलीय संदर्भ में प्रचलित तथा स्पष्ट है; वाक्य का संक्षिप्त लोकोक्तिपरक स्वर बनाए रखा गया है।
