  text: καὶ καταγαγόντες τὰ πλοῖα ἐπὶ τὴν γῆν ἀφέντες ⸀πάντα ἠκολούθησαν αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/011.yaml
  text: And after bringing the boats to land[b][a], they left everything and followed him.
translation:
  language: hi
  text: और नावों को किनारे पर ले आने के बाद, वे सब कुछ छोड़कर उसके पीछे हो लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταγαγόντες
  choice: ले आने के बाद
  rationale: अोरिस्ट कृदंत मुख्य क्रिया से पहले पूरी हुई क्रिया को दर्शाता है; यह हिन्दी में उस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τὰ πλοῖα
  choice: नावों
  rationale: गलील की झील में मछली पकड़ने के प्रसंग में πλοῖα के लिए ‘नावों’ सटीक और स्वाभाविक है।
- source_word: ἐπὶ τὴν γῆν
  choice: किनारे पर
  rationale: शाब्दिक अर्थ ‘भूमि पर’ है; नावों के संदर्भ में ‘किनारे पर’ आधुनिक हिन्दी में स्वाभाविक है और नावों को पानी से स्थल तक लाने का आशय रखता है।
- source_word: ἀφέντες
  choice: छोड़कर
  rationale: यह अोरिस्ट कृदंत किसी वस्तु को पीछे छोड़ देने का अर्थ देता है; संयुक्त क्रिया-रचना हिन्दी में मूल के क्रियाक्रम को बनाए रखती है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का व्यापक अर्थ है; ‘सब कुछ’ बिना अतिरिक्त व्याख्या जोड़े उसकी समग्रता व्यक्त करता है।
- source_word: ἠκολούθησαν αὐτῷ
  choice: उसके पीछे हो लिए
  rationale: यह वाक्यांश वास्तविक रूप से साथ चलने और शिष्य बनकर अनुसरण करने—दोनों अर्थ-संकेतों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: πάντα में त्याग का विस्तार
  choice: सब कुछ छोड़कर
  alternative: सारी चीज़ें छोड़कर
  rationale: पाठ त्याग की व्यापकता पर बल देता है, पर यह स्पष्ट नहीं करता कि वह सम्पत्ति का स्थायी परित्याग था या नहीं; अनुवाद इस तनाव को बिना सुलझाए बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘उसके पीछे हो लिए’ में अनुसरण और शिष्यत्व का संकेत है, पर कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
