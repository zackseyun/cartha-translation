reference: Luke 5:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδὼν δὲ Σίμων Πέτρος προσέπεσεν τοῖς γόνασιν Ἰησοῦ λέγων· Ἔξελθε ἀπ’ ἐμοῦ, ὅτι ἀνὴρ ἁμαρτωλός εἰμι, κύριε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/008.yaml
  text: But when Simon Peter saw it[a], he fell at Jesus’s knees, saying, “Go away from me, because I am a sinful man[b], Lord.”
translation:
  language: hi
  text: पर जब शमौन पतरस ने यह देखा[a], तो वह यीशु के घुटनों के सामने गिर पड़ा और कहते हुए बोला, “मेरे पास से चले जाइए, क्योंकि मैं पापी मनुष्य[b] हूँ, प्रभु!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में ‘देखा’ का कर्म व्यक्त नहीं है; ‘यह’ प्रसंग के आधार पर जोड़ा गया है।
    reason: implicit_object
  - marker: b
    text: यूनानी में यहाँ पुरुष के लिए प्रयुक्त विशिष्ट शब्द है, जो स्वयं शमौन पतरस की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδὼν
  choice: जब ... ने यह देखा
  rationale: अओरिस्ट कृदन्त को सहज हिन्दी में कालवाचक उपवाक्य बनाया गया है। यूनानी में कर्म व्यक्त नहीं है; प्रसंग के आधार पर ‘यह’ उस असाधारण मछली-पकड़ की ओर संकेत करता है।
- source_word: δὲ
  choice: पर
  rationale: यह कथा में अगले घटनाक्रम की ओर बढ़ते हुए हल्का विरोध अथवा मोड़ दिखाता है।
- source_word: Σίμων Πέτρος
  choice: शमौन पतरस
  rationale: मूल पाठ में दोनों नाम हैं, इसलिए दोनों को रखा गया है।
- source_word: προσέπεσεν τοῖς γόνασιν Ἰησοῦ
  choice: वह यीशु के घुटनों के पास गिर पड़ा
  rationale: प्रसπίπτω के साथ दत्तिव पद यीशु के घुटनों की ओर अथवा उनके पास गिरने की सजीव मुद्रा व्यक्त करता है। ‘घुटनों पर’ हिन्दी में सीधे घुटनों के ऊपर गिरने का भ्रामक अर्थ दे सकता था।
- source_word: λέγων
  choice: और कहने लगा
  rationale: वर्तमान कृदन्त को मुख्य क्रिया के साथ जुड़ी हुई वाणी के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: Ἔξελθε ἀπ’ ἐμοῦ
  choice: मेरे पास से चले जाइए
  rationale: यह अलग हो जाने का आग्रह करने वाला अओरिस्ट आज्ञार्थक है। आदरसूचक रूप यीशु को ‘प्रभु’ कहकर संबोधित करने के अनुरूप है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह पतरस के आग्रह का कारण प्रस्तुत करता है।
- source_word: ἀνὴρ ἁμαρτωλός
  choice: पापी मनुष्य
  rationale: विशेषण ἁμαρτωλός पुरुषवाचक संज्ञा ἀνήρ का विधेय है। यह रूप पतरस के अपने पापी होने की स्वीकारोक्ति को निकटता से और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριε का अनुवाद
  choice: प्रभु
  alternative: स्वामी; महोदय
  rationale: चमत्कार के सामने पतरस के भय और पाप-स्वीकार के प्रसंग में ‘प्रभु’ श्रद्धा, अधिकार और संभावित गहरे धर्मवैचारिक आशय—तीनों को खुला रखता है। ‘महोदय’ आशय को बहुत हल्का कर देता, जबकि ‘स्वामी’ यहाँ कम उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चले जाइए’ में आदरसूचकता है, जबकि पतरस की तीव्र प्रतिक्रिया और आत्मस्वीकार की शक्ति बनी रहती है।
