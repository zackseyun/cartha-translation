review_pass:
  verdict: revise
  source_fidelity: 'The draft retains the full Greek sense, including both names, the implicit object of ‘saw,’ Simon Peter’s confession, and κύριε as ‘प्रभु.’ However, ‘यीशु के घुटनों के पास’ weakens the directional/postural force of προσέπεσεν τοῖς γόνασιν Ἰησοῦ: it can merely mean that he fell somewhere near Jesus’s knees. ‘कहने लगा’ can also suggest that he began speaking, an aspect not marked by the Greek participle.'
  naturalness: The Hindi is generally modern and clear. ‘यीशु के घुटनों के सामने गिर पड़ा’ is both more idiomatic in this scene and more precise. Rendering λέγων with ‘कहते हुए’ avoids adding an inceptive nuance while preserving the closely connected speech.
  terminology: ‘शमौन पतरस,’ ‘पापी मनुष्य,’ and ‘प्रभु’ are appropriate. ‘पापी मनुष्य’ preserves the explicitly masculine ἀνήρ without making the Hindi unnatural. The existing notes are correctly anchored and remain needed.
  issues:
  - severity: medium
    issue: ‘यीशु के घुटनों के पास’ is spatially imprecise for προσέπεσεν τοῖς γόνασιν Ἰησοῦ.
    rationale: The Greek depicts Simon Peter falling before Jesus, at his knees. ‘के पास’ may describe simple proximity rather than this act of abasement.
  - severity: low
    issue: ‘कहने लगा’ adds a possible ‘began to say’ nuance.
    rationale: λέγων is a present participle accompanying the main verb. ‘कहते हुए’ represents the attendant action without implying a beginning.
  revised_text: पर जब शमौन पतरस ने यह देखा[a], तो वह यीशु के घुटनों के सामने गिर पड़ा और कहते हुए बोला, “मेरे पास से चले जाइए, क्योंकि मैं पापी मनुष्य[b] हूँ, प्रभु!”
