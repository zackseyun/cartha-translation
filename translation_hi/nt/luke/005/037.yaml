source:
  edition: SBLGNT
  text: καὶ οὐδεὶς βάλλει οἶνον νέον εἰς ἀσκοὺς παλαιούς· εἰ δὲ μήγε, ῥήξει ὁ ⸂οἶνος ὁ νέος⸃ τοὺς ἀσκούς, καὶ αὐτὸς ἐκχυθήσεται καὶ οἱ ἀσκοὶ ἀπολοῦνται·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/037.yaml
  text: And no one puts new wine into old wineskins[a]. Otherwise, the new wine will burst the wineskins, and it will be spilled[c][b], and the wineskins will be ruined.
translation:
  language: hi
  text: और कोई भी नया दाखरस पुरानी मशकों[a] में नहीं डालता। नहीं तो नया दाखरस मशकों को फाड़ देगा, और दाखरस भी बह जाएगा, और मशकें नष्ट हो जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पशु की खाल से बने पुराने पात्र, जिनमें दाखरस रखा जाता था।
    reason: lexical_clarification
lexical_decisions:
- source_word: βάλλει
  choice: रखता
  rationale: सामान्य अर्थ ‘रखना/डालना’ है। ‘रखता’ यूनानी क्रिया की व्यापकता बनाए रखता है और पात्र में दाखरस रखने के संदर्भ में स्वाभाविक है।
- source_word: οἶνον νέον
  choice: नया दाखरस
  rationale: ‘दाखरस’ बाइबलीय संदर्भ में wine का स्पष्ट और प्रचलित हिन्दी रूप है; ‘नया’ किण्वन से जुड़े दृष्टांत को सुरक्षित रखता है।
- source_word: ἀσκοὺς παλαιούς
  choice: पुरानी मशकों
  rationale: ἀσκός पशु-चर्म से बना तरल रखने का पात्र है। ‘मशक’ आधुनिक हिन्दी में अपेक्षाकृत संक्षिप्त और सटीक शब्द है; पादटिप्पणी इसका आशय स्पष्ट करती है।
- source_word: εἰ δὲ μήγε
  choice: नहीं तो
  rationale: पहले कथन के विपरीत करने का परिणाम बताने वाले इस यूनानी मुहावरे का सहज हिन्दी समतुल्य है।
- source_word: ῥήξει
  choice: फाड़ देगा
  rationale: यह सकर्मक क्रिया दाखरस द्वारा मशकों को चीर देने को बताती है। ‘फाड़ देगा’ हिन्दी में कारण और परिणाम दोनों स्पष्ट रखता है।
- source_word: ἐκχυθήσεται
  choice: बह जाएगा
  rationale: फटी मशकों से दाखरस के निकलकर व्यर्थ हो जाने का स्वाभाविक चित्र देता है और कर्मवाच्य यूनानी के परिणामगत भाव को हिन्दी मुहावरे में व्यक्त करता है।
- source_word: ἀπολοῦνται
  choice: नष्ट हो जाएँगी
  rationale: पात्रों के संदर्भ में उनके अनुपयोगी और बरबाद हो जाने को व्यक्त करता है, बिना पूर्ण विनाश से अधिक कुछ आरोपित किए।
- source_word: καὶ αὐτός
  choice: और वह
  rationale: सर्वनाम नए दाखरस की ओर लौटता है। ‘वह’ उसका संदर्भ बनाए रखता है; यूनानी का बल प्रसंग से समझ में आता है।
- source_word: οὐδεὶς
  choice: कोई भी…नहीं
  rationale: सार्वभौमिक निषेध को स्वाभाविक आधुनिक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
