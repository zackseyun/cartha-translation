  text: ὡς δὲ ἐπαύσατο λαλῶν, εἶπεν πρὸς τὸν Σίμωνα· Ἐπανάγαγε εἰς τὸ βάθος καὶ χαλάσατε τὰ δίκτυα ὑμῶν εἰς ἄγραν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/004.yaml
  text: When he had finished speaking[a], he said to Simon, “Put out into the deep water, and let down your nets for a catch.”
translation:
  language: hi
  text: जब वह बोलना समाप्त कर चुका था, तो उसने शमौन से कहा, “नाव को गहरे पानी में ले चलो[a] और तुम लोग मछलियाँ पकड़ने के लिए अपने जाल डालो।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक रूप से “गहराई में”; यहाँ आशय गहरे पानी से है।
    reason: lexical_alternative
  - marker: b
    text: “ले चलो” का यूनानी आदेश एकवचन में, केवल शमौन से है; “तुम लोग ... डालो” बहुवचन में है।
    reason: grammatical_clarification
lexical_decisions:
- source_word: ὡς δὲ ἐπαύσατο λαλῶν
  choice: जब वह बोलना समाप्त कर चुका
  rationale: यह वाक्यांश पहले चल रही बोलने की क्रिया के समाप्त होने और उसके बाद अगली घटना होने का स्वाभाविक काल-संबंध व्यक्त करता है। δέ को अलग शब्द से व्यक्त करना हिन्दी में आवश्यक नहीं है।
- source_word: εἶπεν πρὸς τὸν Σίμωνα
  choice: उसने शमौन से कहा
  rationale: यह λέγω का सीधा और स्वाभाविक हिन्दी रूप है तथा कथन में अनावश्यक आदेशात्मक व्याख्या नहीं जोड़ता।
- source_word: Ἐπανάγαγε εἰς τὸ βάθος
  choice: नाव को गहरे पानी में ले चलो
  rationale: मछली पकड़ने के प्रसंग में क्रिया का अर्थ किनारे से नाव आगे ले जाना है, और βάθος यहाँ पानी की गहराई को सूचित करता है। ‘समुद्र’ कहना झील के प्रसंग में अत्यधिक विशिष्ट होता।
- source_word: χαλάσατε τὰ δίκτυα ὑμῶν
  choice: तुम लोग ... अपने जाल डालो
  rationale: χαλάω यहाँ नाव से जाल नीचे पानी में डालने को दर्शाता है। ‘तुम लोग’ बहुवचन आदेश को स्पष्ट करता है, और ὑμῶν का स्वाभाविक हिन्दी रूप ‘अपने’ है।
- source_word: εἰς ἄγραν
  choice: मछलियाँ पकड़ने के लिए
  rationale: ἄγρα इस प्रसंग में मछलियों की पकड़ को दर्शाता है। हिन्दी में उद्देश्य को इस क्रियात्मक रूप में कहना ‘एक पकड़ के लिए’ की अपेक्षा अधिक स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: पहले आदेश के एकवचन और दूसरे आदेश के बहुवचन का परिवर्तन
  choice: मुख्य पाठ में दूसरे आदेश के साथ ‘तुम लोग’ रखकर बहुवचन स्पष्ट किया और पादटिप्पणी में व्याकरणिक परिवर्तन बताया
  alternative: दोनों आदेशों का सामान्य आदरसूचक बहुवचन रूप देकर परिवर्तन को अनकहा छोड़ना
  rationale: यूनानी पाठ पहले शमौन को एकवचन में संबोधित करता है, फिर जाल डालने का आदेश बहुवचन में देता है। यह कथात्मक सूक्ष्मता संभावित सहभागियों की ओर संकेत करती है, पर उनकी पहचान निश्चित नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। ‘शमौन’ प्रचलित बाइबलीय नामरूप है। आदेशों में अनावश्यक कठोरता से बचते हुए यूनानी के एकवचन से बहुवचन में परिवर्तन को यथासंभव स्पष्ट रखा गया है।
