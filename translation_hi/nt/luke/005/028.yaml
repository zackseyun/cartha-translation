  text: καὶ καταλιπὼν ⸀πάντα ἀναστὰς ⸀ἠκολούθει αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/028.yaml
  text: And leaving everything behind[a], he got up and followed him.
translation:
  language: hi
  text: और वह सब कुछ छोड़कर[a] उठा और उसके पीछे हो लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सब कुछ छोड़ देने के बाद वह उठा और उसके पीछे चलता रहा।”
    reason: कृदंतों के कालगत संबंध और ἠκολούθει के अपूर्ण भूतकाल को अधिक स्पष्ट रूप से दिखाने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: καταλιπὼν
  choice: छोड़कर
  rationale: यह καταλείπω का एओरिस्ट कृदंत है और मुख्य क्रिया से पहले की निर्णायक क्रिया बताता है। ‘छोड़कर’ स्वाभाविक हिन्दी में इस क्रम को स्पष्ट रखता है, बिना ‘त्याग दिया’ जैसी अधिक व्याख्यात्मक धारणा जोड़ने के।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन यहाँ समग्र अर्थ में है। ‘सब कुछ’ स्रोत की व्यापकता और अनिर्दिष्टता दोनों बनाए रखता है।
- source_word: ἀναστὰς
  choice: उठा
  rationale: ἀνίστημι का एओरिस्ट कृदंत कथात्मक प्रसंग में उठकर कार्य करने का भाव देता है। ‘उठा’ संक्षिप्त, स्वाभाविक और स्रोत के निकट है।
- source_word: ἠκολούθει
  choice: पीछे हो लिया
  rationale: ἀκολουθέω का अपूर्ण भूतकाल निरंतर अथवा आरंभिक अनुसरण का संकेत दे सकता है। हिन्दी का ‘पीछे हो लिया’ इस प्रसंग में यीशु का अनुसरण आरंभ करने और शिष्य के रूप में साथ चलने का स्वाभाविक भाव देता है।
- source_word: αὐτῷ
  choice: उसके पीछे
  rationale: दत्तिवाचक सर्वनाम का संदर्भ निकटवर्ती प्रसंग में यीशु से है। हिन्दी में ἀκολουθέω का स्वाभाविक रूप ‘उसके पीछे’ है; नाम दोहराए बिना यूनानी सर्वनाम की पाठ-संगति बनी रहती है।
- source_word: καὶ
  choice: और
  rationale: यह पिछले कथन से सरल संयोजन करता है। ‘और’ बिना अतिरिक्त कारणात्मक या कालगत अर्थ जोड़े यूनानी संबंध को बनाए रखता है।
theological_decisions:
- issue: लेवी के सब कुछ छोड़ने की सीमा
  choice: पद को यह कहते हुए रखा गया है कि उसने ‘सब कुछ’ छोड़ा, पर यह स्पष्ट नहीं किया गया कि इसका अर्थ उसकी सारी संपत्ति का स्थायी परित्याग था।
  alternative: इसे केवल काम का अस्थायी विराम या सारी संपत्ति का स्थायी त्याग समझना।
  rationale: πάντα की समग्र भाषा निर्णायक प्रत्युत्तर पर बल देती है, लेकिन पद स्वयं संपत्ति अथवा पेशे के विषय में कोई विस्तृत सिद्धांत नहीं बताता।
- issue: ἠκολούθει के अपूर्ण भूतकाल का पक्ष
  choice: ‘पीछे हो लिया’ द्वारा अनुसरण के आरंभ और आगे जारी रहने—दोनों के लिए स्थान रखा गया है।
  alternative: ‘पीछे चलता रहा’ द्वारा केवल निरंतरता पर बल देना।
  rationale: अपूर्ण भूतकाल यहाँ निरंतर या आरंभिक पक्ष लिए हो सकता है। चुना हुआ हिन्दी मुहावरा प्रसंग की शिष्यत्व-संबंधी गति व्यक्त करता है, पर पक्षगत अर्थ को अत्यधिक निश्चित नहीं बनाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘पीछे हो लिया’ सामान्य पाठक के लिए स्वाभाविक है और शिष्य के रूप में अनुसरण का प्रसंगगत अर्थ व्यक्त करता है।
