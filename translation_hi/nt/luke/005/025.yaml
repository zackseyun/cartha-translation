lexical_decisions:
- source_word: παραχρῆμα
  choice: तुरन्त
  rationale: यह क्रियाविशेषण बिना किसी देरी के हुई घटना को व्यक्त करता है; ‘तुरन्त’ लूका के चंगाई के तत्काल प्रभाव पर दिए बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἀναστὰς
  choice: उठ खड़ा हुआ
  rationale: यूनानी में यह एओरिस्ट कृदन्त है, पर हिन्दी कथा-क्रम में सीमित क्रिया ‘उठ खड़ा हुआ’ अधिक स्वाभाविक है और शारीरिक रूप से खड़े होने का भाव स्पष्ट करती है।
- source_word: ἐνώπιον αὐτῶν
  choice: उनके सामने
  rationale: यह वाक्यांश उपस्थित लोगों के समक्ष सार्वजनिक रूप से हुई क्रिया बताता है; ‘उनके सामने’ संक्षिप्त, स्वाभाविक और अर्थनिष्ठ है।
- source_word: ἄρας
  choice: उठा लिया
  rationale: αἴρω यहाँ उस वस्तु को उठाकर साथ लेने का बोध देता है जिस पर वह लेटा था; ‘उठा लिया’ हिन्दी में दोनों पक्षों को सहज रूप से व्यक्त करता है।
- source_word: ἐφ’ ὃ κατέκειτο
  choice: जिस पर वह लेटा था
  rationale: यूनानी पाठ किसी खाट, बिस्तर या चटाई का स्पष्ट संज्ञा-प्रयोग नहीं करता, बल्कि शाब्दिक रूप से ‘जिस पर वह लेटा था’ कहता है; यही अस्पष्टता मुख्य पाठ में रखी गई है।
- source_word: ἀπῆλθεν εἰς τὸν οἶκον αὐτοῦ
  choice: अपने घर चला गया
  rationale: यह पदबंध वहाँ से प्रस्थान करके अपने घर जाने को व्यक्त करता है; ‘अपने घर चला गया’ आधुनिक हिन्दी में स्वाभाविक है और ἀπῆλθεν की प्रस्थान-सूचक छाया बनाए रखता है।
- source_word: δοξάζων τὸν θεόν
  choice: परमेश्वर की महिमा करता हुआ
  rationale: यह अनुवाद δοξάζω के परमेश्वर को आदर और महिमा देने के व्यापक भाव को बनाए रखता है; केवल ‘स्तुति करता हुआ’ कहना अर्थ को मौखिक प्रशंसा तक सीमित कर सकता है।
theological_decisions:
- issue: उठाई गई वस्तु को मुख्य पाठ में ‘चटाई’, ‘खाट’ या ‘बिस्तर’ कहना या अनिर्दिष्ट रखना
  choice: मुख्य पाठ में ‘जिस पर वह लेटा था’ रखकर यूनानी की अनिर्दिष्ट अभिव्यक्ति बनाए रखना
  alternative: ‘वह चटाई जिस पर वह लेटा था’ या ‘वह बिस्तर जिस पर वह लेटा था’
  rationale: इस पद में वस्तु के लिए स्पष्ट संज्ञा नहीं है। किसी विशेष वस्तु को मुख्य पाठ में जोड़ना संदर्भानुकूल हो सकता है, पर स्रोत से अधिक निश्चितता लाएगा; इसलिए स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
