  text: But new wine must be put into fresh wineskins[a].
translation:
  language: hi
  text: बल्कि नया दाखरस नई मशकों में डालना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी में ‘नया’ के लिए दो अलग शब्द हैं: दाखरस के लिए νέος, जो विशेष रूप से समय की दृष्टि से नया होने पर बल देता है, और मशकों के लिए καινός, जो विशेष रूप से दशा या गुण की दृष्टि से नया—अर्थात नई और लचीली—होने पर बल दे सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀλλὰ
  choice: बल्कि
  rationale: यह पिछले पद में बताई गई अनुचित रीति के विपरीत उचित रीति प्रस्तुत करता है; हिन्दी में ‘बल्कि’ इस सुधारात्मक विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: οἶνον νέον
  choice: नया दाखरस
  rationale: νέον समय की दृष्टि से नए, अर्थात हाल में बने दाखरस को सूचित करता है; ‘नया दाखरस’ सटीक और परिचित बाइबलीय अभिव्यक्ति है।
- source_word: εἰς ἀσκοὺς
  choice: मशकों में
  rationale: εἰς पात्र के भीतर रखने की दिशा बताता है। ‘मशक’ पशु-चर्म से बने तरल-पात्र का संक्षिप्त और सटीक हिन्दी नाम है।
- source_word: καινοὺς
  choice: नई
  rationale: καινός यहाँ दशा या गुण की दृष्टि से नई और उपयोग योग्य मशकों को सूचित करता है। मुख्य पाठ में सहज हिन्दी के लिए ‘नई’ रखा गया है, जबकि νέος और καινός का सूक्ष्म भेद पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: βλητέον
  choice: भरना चाहिए
  rationale: यह क्रियाविशेषणात्मक रूप आवश्यकता या उचित कर्तव्य व्यक्त करता है। दाखरस और पात्र के संदर्भ में ‘भरना चाहिए’ शाब्दिक ‘डालना चाहिए’ से अधिक स्वाभाविक है और भाव को बनाए रखता है।
theological_decisions:
- issue: νέος और καινός के बीच शब्दार्थगत भेद
  choice: मुख्य पाठ में ‘नया दाखरस’ और ‘नई मशकें’, तथा पाद-टिप्पणी में भेद की व्याख्या
  alternative: καινούς को ‘ताज़ी’ या ‘नई और लचीली’ कहना
  rationale: 'यूनानी दो अलग विशेषणों का प्रयोग करता है: νέος मुख्यतः समय की नवीनता और καινός दशा या गुण की नवीनता पर बल दे सकता है। हिन्दी में ‘ताज़ी मशकें’ अप्राकृतिक लग सकती हैं, इसलिए सहज मुख्य पाठ के साथ पाद-टिप्पणी वास्तविक भेद सुरक्षित रखती है।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘दाखरस’ और ‘मशक’ सांस्कृतिक वस्तुओं को संक्षेप में ठीक पहचानते हैं; आवश्यक शब्दार्थगत अंतर पाद-टिप्पणी में सुरक्षित है।
