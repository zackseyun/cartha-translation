source:
  edition: SBLGNT
  text: ἐπιγνοὺς δὲ ὁ Ἰησοῦς τοὺς διαλογισμοὺς αὐτῶν ἀποκριθεὶς εἶπεν πρὸς αὐτούς· Τί διαλογίζεσθε ἐν ταῖς καρδίαις ὑμῶν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/022.yaml
  text: But Jesus[a], perceiving their thoughts, answered and said to them, “Why are you reasoning in your hearts?”
translation:
  language: hi
  text: पर यीशु ने उनके विचारों को जानकर उन्हें उत्तर दिया, “तुम अपने हृदयों में यह तर्क-वितर्क क्यों कर रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιγνοὺς
  choice: जानकर
  rationale: यह क्रिया यीशु की उनके भीतरी विचारों के प्रति स्पष्ट और पूर्ण जानकारी व्यक्त करती है; ‘जानकर’ स्वाभाविक हिन्दी है और यह नहीं बताती कि उन्होंने किस प्रकार जाना।
- source_word: δὲ
  choice: पर
  rationale: δέ यहाँ पिछले प्रसंग से हल्का विरोध और कथा में मोड़ दिखाता है; ‘पर’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τοὺς διαλογισμοὺς αὐτῶν
  choice: उनके मन के विचार
  rationale: संज्ञा यहाँ भीतर चल रहे विचार-विमर्श या आपत्तिपूर्ण सोच को सूचित करती है। ‘मन के विचार’ सामान्य हिन्दी में स्पष्ट है और आंतरिकता को सामने लाता है।
- source_word: ἀποκριθεὶς εἶπεν πρὸς αὐτούς
  choice: उनसे कहा
  rationale: यूनानी का शाब्दिक रूप ‘उत्तर देकर उनसे कहा’ है, पर हिन्दी में बिना मुखर प्रश्न के वह असहज लगता है। ‘उनसे कहा’ उत्तरात्मक प्रसंग को स्वाभाविक रूप में व्यक्त करता है।
- source_word: Τί
  choice: क्यों
  rationale: διαλογίζεσθε के साथ τί यहाँ उनके ऐसा सोचने का कारण पूछता है; हिन्दी में ‘क्यों’ अर्थानुकूल और स्वाभाविक है।
- source_word: διαλογίζεσθε
  choice: तर्क-वितर्क कर रहे हो
  rationale: वर्तमान काल का यह रूप चल रहे आंतरिक विचार-विमर्श को दर्शाता है। ‘तर्क-वितर्क’ साधारण ‘सोचने’ की अपेक्षा सक्रिय विवेचना का भाव सुरक्षित रखता है।
- source_word: ἐν ταῖς καρδίαις ὑμῶν
  choice: अपने हृदयों में
  rationale: ‘हृदयों में’ बाइबलीय रूपक को बनाए रखता है, जहाँ हृदय विचार और इच्छा सहित भीतरी व्यक्ति का केंद्र है।
theological_decisions:
- issue: दूसरों के भीतरी विचारों के विषय में यीशु के ज्ञान का स्वरूप
  choice: पाठ में केवल यह कहना कि यीशु ने उनके मन के विचार जान लिए थे
  alternative: इसे स्पष्टतः अलौकिक ज्ञान कहना, या केवल अनुमान लगाना कहना
  rationale: यूनानी पाठ यीशु की जानकारी को स्पष्ट करता है, पर उसके साधन की व्याख्या नहीं करता। अनुवाद न तो उसमें अलौकिकता का अतिरिक्त वर्णन जोड़ता है, न उसे अनुमान तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘हृदयों में’ मूल के बाइबलीय मानव-विज्ञान को बनाए रखता है, जबकि ‘मन के विचार’ आरंभिक पदबंध को सामान्य पाठक के लिए स्पष्ट करता है।
