source:
  edition: SBLGNT
  text: καὶ ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ ⸀εἰπών· Θέλω, καθαρίσθητι· καὶ εὐθέως ἡ λέπρα ἀπῆλθεν ἀπ’ αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/013.yaml
  text: And stretching out his hand[a], he touched him, saying, “I am willing; be cleansed.” And immediately the leprosy left him.
translation:
  language: hi
  text: और उसने हाथ बढ़ाकर उसे छुआ और कहा, “मैं चाहता हूँ; शुद्ध हो जा।” और तुरन्त उसका कोढ़[a] दूर हो गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक व्यापक अर्थ में, “गंभीर चर्मरोग।” बाइबिल में यूनानी शब्द λέπρα कई प्रकार के गंभीर त्वचा-रोगों के लिए प्रयुक्त हो सकता है, केवल आज के हैनसेन रोग के लिए नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: ἐκτείνας τὴν χεῖρα
  choice: हाथ बढ़ाकर
  rationale: यह यूनानी कृदंत के पूर्ववर्ती शारीरिक कार्य को स्वाभाविक हिन्दी में व्यक्त करता है और स्पर्श करने की सचेत क्रिया को बनाए रखता है।
- source_word: ἥψατο αὐτοῦ
  choice: उसे छुआ
  rationale: ἅπτομαι के साथ आए संबंधकारक कर्म का हिन्दी में स्वाभाविक सीधा-कर्म रूप है; इससे उस अशुद्ध माने गए व्यक्ति के साथ यीशु का वास्तविक शारीरिक संपर्क स्पष्ट रहता है।
- source_word: εἰπών
  choice: और कहा
  rationale: यूनानी कृदंत को शब्दशः रखने के बजाय समन्वित क्रिया हिन्दी में अधिक स्वाभाविक है और घटनाक्रम को यथावत रखती है।
- source_word: Θέλω
  choice: मैं चाहता हूँ
  rationale: यह यीशु की इच्छा और तत्परता दोनों को सीधे व्यक्त करता है; इसे केवल भविष्यकाल के अर्थ में नहीं बदलता।
- source_word: καθαρίσθητι
  choice: शुद्ध हो जा
  rationale: यह अओरिस्ट कर्मवाच्य आज्ञार्थक के शुद्ध किए जाने के भाव को हिन्दी की स्वाभाविक अभिव्यक्ति में रखता है तथा शारीरिक चंगाई के साथ धार्मिक-सामाजिक शुद्धता का आयाम भी बचाए रखता है।
- source_word: εὐθέως
  choice: तुरन्त
  rationale: समय की तत्कालता का संक्षिप्त और प्रचलित हिन्दी रूप।
- source_word: ἡ λέπρα
  choice: कोढ़
  rationale: सुसमाचारों के इस प्रसंग में यह परिचित पारंपरिक शब्द है; प्राचीन यूनानी शब्द का आधुनिक हैनसेन रोग से व्यापक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: ἀπῆλθεν ἀπ’ αὐτοῦ
  choice: उसका … दूर हो गया
  rationale: रोग के उससे चले जाने को स्वाभाविक हिन्दी में व्यक्त करता है और पूर्ण, तत्काल मुक्ति का भाव बनाए रखता है।
theological_decisions:
- issue: कोढ़ से पीड़ित व्यक्ति के लिए καθαρίσθητι का अनुवाद
  choice: शुद्ध हो जा
  alternative: चंगा हो जा / साफ़ हो जा
  rationale: यूनानी शब्द केवल चिकित्सकीय चंगाई नहीं, बल्कि अशुद्धता से शुद्ध होने का धार्मिक और सामाजिक आयाम भी रखता है। चुना गया रूप इस बहुस्तरीय अर्थ को सपाट किए बिना स्पष्ट हिन्दी देता है।
- issue: Θέλω में इच्छा और तत्परता का संबंध
  choice: मैं चाहता हूँ
  alternative: मैं तैयार हूँ / मेरी इच्छा है
  rationale: यह कथन यीशु की सकारात्मक इच्छा को सीधे रखता है और इसे केवल अनुमति, क्षमता या भविष्यवाणी में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। यूनानी वाक्य के क्रम और दो बार आए καί (“और”) को बनाए रखा गया है, जबकि कृदंत εἰπών को स्वाभाविक हिन्दी के लिए “और कहा” किया गया है।
