source:
  edition: SBLGNT
  text: καὶ ἀποκριθεὶς ⸀Σίμων ⸀εἶπεν· Ἐπιστάτα, δι’ ⸀ὅλης νυκτὸς κοπιάσαντες οὐδὲν ἐλάβομεν, ἐπὶ δὲ τῷ ῥήματί σου χαλάσω ⸂τὰ δίκτυα⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/005.yaml
  text: And Simon answered[a], “Master, we worked hard all night and caught nothing[b]; but at your word I will let down the nets.”
translation:
  language: hi
  text: शमौन ने उत्तर दिया, “गुरु, हमने सारी रात कड़ी मेहनत की और कुछ नहीं पकड़ा; पर आपके कहने पर मैं जाल डालूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποκριθεὶς … εἶπεν
  choice: ने उत्तर दिया
  rationale: यूनानी का यह प्रचलित कथन-सूचक प्रयोग हिन्दी में स्वाभाविक रूप से एक ही सीमित क्रिया से व्यक्त होता है।
- source_word: Ἐπιστάτα
  choice: गुरु
  rationale: लूका में यह संबोधन यीशु के अधिकार को स्वीकार करता है, पर κύριος (‘प्रभु’) का विशिष्ट शब्द नहीं है। आधुनिक हिन्दी में ‘गुरु’ यहाँ सम्मान और अधिकार दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δι’ ὅλης νυκτός
  choice: सारी रात
  rationale: यह पूरी रात की अवधि को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: κοπιάσαντες
  choice: कड़ी मेहनत की
  rationale: क्रिया श्रमसाध्य और थका देने वाले प्रयास पर बल देती है; ‘कड़ी मेहनत’ सामान्य पाठक के लिए सहज है।
- source_word: οὐδὲν ἐλάβομεν
  choice: कुछ नहीं पकड़ा
  rationale: मछली पकड़ने के प्रसंग में λαμβάνω का स्वाभाविक अर्थ ‘पकड़ना’ है; वस्तु संदर्भ से स्पष्ट है।
- source_word: ἐπὶ δὲ τῷ ῥήματί σου
  choice: लेकिन आपके कहने पर
  rationale: ἐπί सहित यह रचना यीशु के कथन को कार्रवाई का आधार बताती है। ‘आपके कहने पर’ कारण/आधार और आज्ञापालन, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: χαλάσω
  choice: मैं … डालूँगा
  rationale: जाल को पानी में नीचे करने के लिए हिन्दी में ‘जाल डालना’ सबसे स्वाभाविक मछली पकड़ने की अभिव्यक्ति है।
- source_word: τὰ δίκτυα
  choice: जाल
  rationale: हिन्दी में ‘जाल’ रूप एकवचन और बहुवचन दोनों में समान रहता है; क्रिया और संदर्भ यहाँ सामूहिक/बहुवचन अर्थ को सहज रूप से वहन करते हैं।
- source_word: δὲ
  choice: लेकिन
  rationale: यह निष्फल श्रम और फिर भी यीशु के कहने पर कार्य करने के बीच हल्का विरोध स्पष्ट करता है।
theological_decisions:
- issue: यीशु के संबोधन Ἐπιστάτα का अनुवाद
  choice: गुरु
  alternative: प्रभु / स्वामी
  rationale: मूल पाठ में κύριος नहीं, बल्कि लूका का विशिष्ट ἐπιστάτης है। ‘गुरु’ यीशु के मान्य अधिकार को व्यक्त करता है, बिना इस स्थान पर मूल से अधिक पूर्ण मसीह-विषयक उपाधि आरोपित किए।
- issue: ἐπὶ τῷ ῥήματί σου में कार्रवाई का आधार
  choice: आपके कहने पर
  alternative: आपके वचन के आधार पर
  rationale: यूनानी रचना आधार या कारण दोनों की छाया रख सकती है। चुना हुआ रूप इसे सहज हिन्दी में खुला रखता है और इसे किसी विशेष सिद्धान्तगत ‘वचन’ अवधारणा तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक ‘आप’ के साथ गरिमापूर्ण पर सामान्य बोलचाल की सहजता। ‘फिर भी’ यूनानी δέ के प्रसंगगत विरोध को स्पष्ट करता है, जबकि वाक्य को अनावश्यक रूप से शाब्दिक नहीं बनाता।
