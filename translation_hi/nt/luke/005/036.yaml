  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथन रखा गया है। ‘वस्त्र’, ‘दृष्टान्त’ और ‘पैबंद’ सामान्य बाइबलीय शब्दावली के साथ अर्थ-स्पष्ट भी हैं। मूल पाठ की व्यावहारिक असंगति को बिना किसी विशेष रूपकात्मक या सम्प्रदायगत व्याख्या जोड़े सुरक्षित रखा गया है।
