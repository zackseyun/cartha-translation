id: LUK.5.36
reference: Luke 5:36
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἔλεγεν δὲ καὶ παραβολὴν πρὸς αὐτοὺς ὅτι Οὐδεὶς ἐπίβλημα ⸀ἀπὸ ἱματίου καινοῦ ⸀σχίσας ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν· εἰ δὲ μήγε, καὶ τὸ καινὸν ⸀σχίσει καὶ τῷ παλαιῷ οὐ ⸂συμφωνήσει τὸ ἐπίβλημα⸃ τὸ ἀπὸ τοῦ καινοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/036.yaml
  text: 'He was also telling them a parable: “No one tears a patch from a new garment and puts it on an old garment[a]. Otherwise, he will tear the new one[b], and the patch from the new will not match the old.”'
translation:
  language: hi
  text: 'वह उनसे एक दृष्टान्त भी कह रहा था: “कोई भी नए वस्त्र में से टुकड़ा फाड़कर पुराने वस्त्र पर नहीं लगाता। यदि ऐसा करे, तो वह नए वस्त्र को भी फाड़ डालेगा, और नए वस्त्र से लिया गया पैबंद पुराने से मेल भी नहीं खाएगा।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγεν δὲ καὶ
  choice: वह ... एक दृष्टान्त भी कह रहा था
  rationale: अपूर्ण भूतकाल ἔλεγεν की जारी अथवा प्रसंगगत क्रिया को ‘कह रहा था’ स्वाभाविक रूप से व्यक्त करता है; δὲ καὶ का संबंधसूचक और योगात्मक बल ‘भी’ से आता है।
- source_word: παραβολὴν
  choice: दृष्टान्त
  rationale: यह लूका में प्रचलित साहित्यिक और शिक्षात्मक श्रेणी को दर्शाने वाला मानक, गरिमापूर्ण हिन्दी शब्द है।
- source_word: ἐπίβλημα
  choice: पैबंद
  rationale: वस्त्र के संदर्भ में यह मरम्मत के लिए लगाए जाने वाले टुकड़े को सूचित करता है; अंतिम खंड में ‘पैबंद’ अर्थ को सबसे स्पष्ट करता है।
- source_word: ἀπὸ ἱματίου καινοῦ σχίσας
  choice: नए वस्त्र में से टुकड़ा फाड़कर
  rationale: अओरिस्ट कृदन्त σχίσας की पूर्ववर्ती क्रिया को हिन्दी का ‘फाड़कर’ स्वाभाविक और क्रम-संगत ढंग से व्यक्त करता है।
- source_word: ἐπιβάλλει ἐπὶ ἱμάτιον παλαιόν
  choice: पुराने वस्त्र पर नहीं लगाता
  rationale: ἐπιβάλλω का सामान्य अर्थ ‘ऊपर रखना/लगाना’ है। ‘लगाता’ स्वाभाविक है और सिलने की ऐसी विधि नहीं जोड़ता जो यूनानी में स्पष्ट नहीं है।
- source_word: εἰ δὲ μήγε
  choice: यदि ऐसा करे
  rationale: यह कथित निषेध के विपरीत काम करने की स्थिति और उसके परिणाम को हिन्दी में स्पष्ट करता है।
- source_word: καὶ τὸ καινὸν σχίσει
  choice: वह नए वस्त्र को भी फाड़ डालेगा
  rationale: भविष्यकालीन सक्रिय क्रिया का निहित कर्ता वही व्यक्ति है; ‘फाड़ डालेगा’ नए वस्त्र को पहुँचाई गई क्षति स्पष्ट करता है।
- source_word: οὐ συμφωνήσει
  choice: मेल नहीं खाएगा
  rationale: वस्त्रों के संदर्भ में συμφωνέω की अनुरूपता अथवा उपयुक्तता का स्वाभाविक हिन्दी रूप है, जबकि अर्थ को केवल आकार या रंग तक सीमित नहीं करता।
theological_decisions: []
