id: LUK.5.1
reference: Luke 5:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἐγένετο δὲ ἐν τῷ τὸν ὄχλον ἐπικεῖσθαι αὐτῷ ⸀καὶ ἀκούειν τὸν λόγον τοῦ θεοῦ καὶ αὐτὸς ἦν ἑστὼς παρὰ τὴν λίμνην Γεννησαρέτ,
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/001.yaml
  text: It happened that while the crowd was pressing in on him and listening to the word of God[a], he was standing by the lake of Gennesaret[b],
translation:
  language: hi
  text: ऐसा हुआ कि जब भीड़ उन पर दबाव डाल रही थी और परमेश्वर का वचन सुन रही थी[a], तब वे गन्नेसरत झील के किनारे खड़े थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “जब भीड़ उन पर उमड़ रही थी और परमेश्वर का वचन सुन रही थी।”'
    reason: lexical_alternative
  - marker: b
    text: गन्नेसरत वह झील है जिसे गलील की झील भी कहा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य घटना-आरंभ करने वाली कथात्मक अभिव्यक्ति है। यह अनुवाद उसके कार्य को स्वाभाविक हिन्दी में व्यक्त करता है और δέ के लिए कोई अनावश्यक कालवाचक शब्द नहीं जोड़ता।
- source_word: ἐν τῷ ... ἐπικεῖσθαι ... καὶ ἀκούειν
  choice: जब ... उमड़ी पड़ रही थी और ... सुन रही थी
  rationale: ἐν के साथ संयुक्त क्रियार्थक संज्ञाएँ समय का बोध कराती हैं। ‘जब’ और अपूर्ण वर्तमान क्रिया-रूप दोनों साथ-साथ चल रही गतिविधियों को स्पष्ट रखते हैं।
- source_word: ἐπικεῖσθαι αὐτῷ
  choice: उन पर उमड़ी पड़ रही थी
  rationale: क्रिया किसी व्यक्ति पर भीड़ के शारीरिक रूप से दबते या चढ़े आने का भाव देती है। ‘उमड़ी पड़ रही थी’ आधुनिक हिन्दी में स्वाभाविक और सजीव है।
- source_word: ἀκούειν
  choice: सुन रही थी
  rationale: यह भीड़ द्वारा ध्यान देकर सुनने की जारी क्रिया को सीधे और सहज ढंग से व्यक्त करता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह मूल वाक्यांश की व्यापकता और उसके धर्मवैचारिक तथा अंतर्पाठीय महत्व को बनाए रखने वाली प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: καὶ αὐτὸς ἦν ἑστὼς
  choice: तब वे ... खड़े थे
  rationale: परिधीय क्रिया-रचना जारी शारीरिक अवस्था बताती है। हिन्दी में यीशु के लिए आदरसूचक बहुवचन स्वाभाविक है; इससे मूल का अर्थ नहीं बदलता।
- source_word: παρὰ τὴν λίμνην
  choice: झील के किनारे
  rationale: παρά यहाँ झील के पास या बगल में स्थित होने का बोध कराता है।
- source_word: Γεννησαρέτ
  choice: गन्नेसरत
  rationale: मूल पाठ में आए स्थान-नाम का हिन्दी लिप्यंतरण किया गया है; उसे व्याख्यात्मक नाम ‘गलील की झील’ से नहीं बदला गया।
theological_decisions:
- issue: τὸν λόγον τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का वचन
  alternative: परमेश्वर का संदेश
  rationale: ‘वचन’ घोषित संदेश के अर्थ को समेटते हुए मूल अभिव्यक्ति की धर्मवैचारिक व्यापकता और परिचित बाइबलीय प्रतिध्वनि को सुरक्षित रखता है।
- issue: Γεννησαρέτ की पहचान
  choice: गन्नेसरत
  alternative: गलील की झील
  rationale: मूल यूनानी इस झील को गन्नेसरत कहता है। मुख्य पाठ में दूसरा नाम रख देना व्याख्यात्मक सामंजस्य जोड़ता; इसलिए पहचान को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। यीशु के लिए स्वाभाविक आदरसूचक ‘वे/उन’ का प्रयोग किया गया है। वाक्य ने मूल की समय-संबंधी रचना और भीड़ की दोनों समानांतर गतिविधियों को बनाए रखा है।
