  text: For astonishment had seized him and all those with him because of the catch of fish that they had taken,[a]
translation:
  language: hi
  text: क्योंकि शमौन और उसके साथ के सभी लोग मछलियों की उस पकड़ के कारण, जिन्हें उन्होंने पकड़ा था, विस्मय से भर गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θάμβος
  choice: विस्मय
  rationale: यह शब्द अचानक हुए गहरे अचरज और अभिभूत कर देने वाली प्रतिक्रिया को व्यक्त करता है; आधुनिक हिंदी में ‘विस्मय’ गरिमापूर्ण और स्वाभाविक है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले पद में शमौन की प्रतिक्रिया का कारण बताता है और हिंदी में कारणसूचक संबंध को स्पष्ट रखता है।
- source_word: περιέσχεν
  choice: से भर गए थे
  rationale: मूल क्रिया का भाव किसी भावना द्वारा चारों ओर से घेर लिए जाने या पूरी तरह वश में हो जाने का है। ‘विस्मय से भर गए थे’ हिंदी में स्वाभाविक रूप से उस प्रबल प्रतिक्रिया को व्यक्त करता है।
- source_word: πάντας τοὺς σὺν αὐτῷ
  choice: उसके साथ के सभी लोग
  rationale: यह शमौन के साथ उपस्थित पूरे समूह को समावेशी और सहज हिंदी में व्यक्त करता है।
- source_word: ἐπὶ τῇ ἄγρᾳ τῶν ἰχθύων
  choice: मछलियों के इतने बड़े जाल पर
  rationale: ἐπί यहाँ प्रतिक्रिया के कारण या आधार को दर्शाता है; प्रसंग से पकड़ की असाधारण विशालता स्पष्ट है, इसलिए ‘इतने बड़े जाल पर’ स्वाभाविक हिंदी में कारण और परिमाण दोनों को सामने लाता है।
- source_word: ὧν συνέλαβον
  choice: जितनी मछलियाँ उन्होंने पकड़ी थीं
  rationale: संबंधवाचक वाक्यांश मछलियों की ओर लौटता है और बहुवचन क्रिया समूह की सहभागिता दिखाती है। ‘जितनी’ असाधारण मात्रा से स्वाभाविक रूप से जुड़ती है।
