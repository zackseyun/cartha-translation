  register: आधुनिक मानक हिंदी; कथात्मक, सहज और गरिमापूर्ण शैली। ‘शमौन’ को स्पष्टता के लिए जोड़ा गया है, क्योंकि यूनानी सर्वनाम αὐτόν का पूर्वपद पिछले पद में शमौन है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि अंग्रेज़ी में दिया गया lexical alternative हिंदी में स्वतंत्र अर्थभेद उत्पन्न नहीं करता।
