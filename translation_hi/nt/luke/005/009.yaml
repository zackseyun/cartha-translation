review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the explanatory γάρ, the overwhelming astonishment, Simon, and all those with him. However, “मछलियों के इतने बड़े जाल” changes ἄγρα (‘catch/haul’) into ‘net’ and adds the unexpressed idea that it was large. The relative clause ὧν συνέλαβον refers to the fish and should remain explicit.
  naturalness: The draft’s word order is understandable, but “जितनी मछलियाँ… उनके इतने बड़े जाल पर” is syntactically strained and does not read naturally in modern Hindi. The revision uses an idiomatic narrative construction while retaining the source’s causal relationship.
  terminology: “विस्मय से भर गए थे” suitably renders θάμβος περιέσχεν. “मछलियों की उस पकड़” is a concise modern Hindi rendering of the fishing catch/haul and avoids confusing the catch with a fishing net. “शमौन” appropriately identifies the antecedent of αὐτόν.
  issues:
  - severity: high
    issue: “मछलियों के इतने बड़े जाल” renders the catch as a net and adds size.
    rationale: ἄγρα means a catch/haul, not δίχτυον (‘net’), and the Greek text does not say ‘large’ in this verse.
  - severity: medium
    issue: The relative clause is attached awkwardly and the causal phrase is unclear.
    rationale: ὧν συνέλαβον qualifies the fish that the group caught; the Hindi should make this relationship clear without altering the referent.
  revised_text: क्योंकि शमौन और उसके साथ के सभी लोग मछलियों की उस पकड़ के कारण, जिन्हें उन्होंने पकड़ा था, विस्मय से भर गए थे।
  revised_footnotes: []
  revision_rationale: 'The revision removes the unsupported ‘large net,’ restores the sense of the catch/haul of fish, and explicitly preserves that the fish were caught by the group. No footnote is required: the English alternative ‘which they had caught’ does not create a distinct, necessary ambiguity in Hindi.'
