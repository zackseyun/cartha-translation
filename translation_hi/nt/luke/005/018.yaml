base_translation:
  language: en
  yaml_path: translation/nt/luke/005/018.yaml
  text: And behold[a], men were carrying on a bed a man who was paralyzed[b], and they were seeking to bring him in and set him before him.
translation:
  language: hi
  text: और देखो, कुछ आदमी एक लकवाग्रस्त आदमी को खाट[a] पर लिए जा रहे थे। वे उसे भीतर ले जाने और उसके[b] सामने रखने की कोशिश कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिस्तर पर” अथवा “चौकी पर”; यूनानी शब्द κλίνη किसी बिस्तर, खाट या पलंगनुमा चौकी को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यीशु के सामने।
    reason: referent_clarification
lexical_decisions:
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाले कथात्मक संकेत और दृश्य की सजीवता को बनाए रखता है।
- source_word: ἄνδρες
  choice: कुछ आदमी
  rationale: ἀνήρ यहाँ वयस्क पुरुषों को दर्शाता है; ‘कुछ आदमी’ आधुनिक हिन्दी में स्वाभाविक और लिंग की दृष्टि से सटीक है।
- source_word: φέροντες
  choice: उठाए हुए थे
  rationale: वर्तमान कृदन्त की जारी क्रिया को व्यक्त करता है और बताता है कि वे उस व्यक्ति को खाट सहित उठा रहे थे।
- source_word: ἐπὶ κλίνης
  choice: खाट पर
  rationale: κλίνη बिस्तर, चौकी या पलंगनुमा साधन हो सकता है। इस प्रसंग में ‘खाट’ साधारण, उठाकर ले जाने योग्य बिस्तर का स्वाभाविक हिन्दी रूप है, पर अन्य अर्थों की संभावना पादटिप्पणी में रखी गई है।
- source_word: ἄνθρωπον
  choice: एक ... व्यक्ति
  rationale: यहाँ एक मनुष्य का उल्लेख है; ‘व्यक्ति’ निकटवर्ती ‘आदमी’ की अनावश्यक पुनरावृत्ति से बचते हुए अर्थ को स्पष्ट रखता है।
- source_word: παραλελυμένος
  choice: लकवाग्रस्त
  rationale: पूर्ण निष्क्रिय कृदन्त लकवे के परिणामस्वरूप बनी हुई अवस्था बताता है; ‘लकवाग्रस्त’ इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἐζήτουν
  choice: कोशिश कर रहे थे
  rationale: अपूर्णकाल जारी प्रयास को दिखाता है। आधुनिक हिन्दी में ‘कोशिश कर रहे थे’ इसी प्रसंग में ‘ढूँढ़ रहे थे’ की अपेक्षा आशय अधिक स्पष्ट करता है।
- source_word: εἰσενεγκεῖν
  choice: भीतर ले जाने
  rationale: εἰσφέρω का दिशात्मक अर्थ ‘भीतर ले जाना’ है; उठाकर ले जाने का ढंग पहले वाक्य से स्पष्ट है।
- source_word: θεῖναι
  choice: रखने
  rationale: τίθημι के सामान्य अर्थ ‘रखना/स्थापित करना’ को व्यक्त करता है और व्यक्ति की मुद्रा को स्रोत से अधिक निश्चित नहीं बनाता।
- source_word: ἐνώπιον αὐτοῦ
  choice: उसके सामने
  rationale: यूनानी पाठ के सर्वनाम को सुरक्षित रखता है; प्रसंग में उसका संकेत यीशु की ओर है।
theological_decisions:
- issue: अंतिम αὐτοῦ का संदर्भ
  choice: उसके सामने
  alternative: यीशु के सामने
  rationale: कथा के प्रसंग में संदर्भ यीशु है, पर मूल पाठ नाम के बजाय सर्वनाम का प्रयोग करता है। मुख्य पाठ में सर्वनाम बनाए रखने और पादटिप्पणी में संदर्भ स्पष्ट करने से स्रोत की अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखो’ मूल के ध्यानाकर्षक कथात्मक संकेत को बनाए रखता है; ‘कोशिश कर रहे थे’ जारी प्रयास को स्वाभाविक हिन्दी में व्यक्त करता है। पादटिप्पणी-चिह्न उन्हीं शब्दों पर लगाए गए हैं जिनसे उनकी व्याख्या संबंधित है।
