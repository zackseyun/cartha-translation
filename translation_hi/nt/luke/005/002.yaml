  text: καὶ εἶδεν ⸂δύο πλοῖα⸃ ἑστῶτα παρὰ τὴν λίμνην, οἱ δὲ ἁλιεῖς ⸂ἀπ’ αὐτῶν ἀποβάντες⸃ ⸀ἔπλυνον τὰ δίκτυα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/002.yaml
  text: And he saw two boats standing by the lake[a], but the fishermen, having gotten out of them, were washing the nets.
translation:
  language: hi
  text: और उसने झील के किनारे दो नावें खड़ी देखीं, पर मछुआरे उन नावों से उतरकर जाल धो रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδεν
  choice: देखीं
  rationale: कथात्मक एओरिस्ट को सामान्य भूतकाल में रखना स्वाभाविक है; क्रिया का स्त्रीलिंग बहुवचन रूप ‘नावें’ के अनुसार है।
- source_word: δύο πλοῖα
  choice: दो नावें
  rationale: झील में मछली पकड़ने के प्रसंग में πλοῖα के लिए आधुनिक हिन्दी में ‘नावें’ स्वाभाविक और सटीक है।
- source_word: ἑστῶτα παρὰ τὴν λίμνην
  choice: झील के किनारे … खड़ी
  rationale: ἑστῶτα नावों की स्थिर अवस्था बताता है; ‘खड़ी’ इसे व्यक्त करता है, जबकि ‘बंधी’ मूल में निहित नहीं है। παρά यहाँ झील के पास या किनारे की स्थिति दर्शाता है।
- source_word: οἱ δὲ ἁλιεῖς
  choice: पर मछुआरे
  rationale: δέ नावों और मछुआरों की स्थिति के बीच हल्का विरोध अथवा दृश्य-परिवर्तन दिखाता है; ‘पर’ इसे संक्षेप में बनाए रखता है।
- source_word: ἀπ’ αὐτῶν ἀποβάντες
  choice: उन नावों से उतरकर
  rationale: एओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया दर्शाता है। ‘उन नावों’ से αὐτῶν का संदर्भ स्पष्ट रहता है, और ‘उतरकर’ सामान्य, सहज हिन्दी है।
- source_word: ἔπλυνον τὰ δίκτυα
  choice: जाल धो रहे थे
  rationale: अपूर्ण भूतकाल चल रही क्रिया को दर्शाता है, जिसे ‘धो रहे थे’ स्वाभाविक रूप से व्यक्त करता है। यूनानी में स्वामित्वसूचक शब्द नहीं है, इसलिए ‘अपने’ नहीं जोड़ा गया।
