source:
  edition: SBLGNT
  text: καὶ ἤρξαντο διαλογίζεσθαι οἱ γραμματεῖς καὶ οἱ Φαρισαῖοι λέγοντες· Τίς ἐστιν οὗτος ὃς λαλεῖ βλασφημίας; τίς δύναται ⸂ἁμαρτίας ἀφεῖναι⸃ εἰ μὴ μόνος ὁ θεός;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/021.yaml
  text: And the scribes and the Pharisees began to reason among themselves, saying, “Who is this who speaks blasphemies? Who can forgive sins except God alone?”
translation:
  language: hi
  text: और शास्त्री और फ़रीसी विचार करने लगे और कहने लगे, “यह कौन है, जो ईशनिंदा की बातें करता है? अकेले परमेश्वर के सिवा कौन पापों को क्षमा कर सकता है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρξαντο διαλογίζεσθαι
  choice: विचार करने लगे
  rationale: ἄρχομαι और infinitive को ‘करने लगे’ से व्यक्त किया गया है। διαλογίζομαι के विचार-विमर्श या मन में तर्क करने के अर्थ को ‘विचार करना’ स्वाभाविक ढंग से रखता है, बिना यह तय किए कि यह केवल मन में हुआ या आपसी चर्चा थी।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के संदर्भ में यह मूसा की व्यवस्था के मान्य विशेषज्ञों के लिए प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: यह समूह-नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: λαλεῖ βλασφημίας
  choice: परमेश्वर की निंदा की बातें कहता है
  rationale: βλασφημίας के बहुवचन और धार्मिक संदर्भ दोनों को स्पष्ट तथा साधारण आधुनिक हिन्दी में व्यक्त करता है। ‘ईशनिंदा करता है’ अधिक संक्षिप्त होता, पर बहुवचन ‘बातें’ की छाया मिटा देता।
- source_word: ἁμαρτίας ἀφεῖναι
  choice: पापों को क्षमा कर सकता है
  rationale: पापों के साथ ἀφίημι का स्वाभाविक अर्थ ‘क्षमा करना’ है; हिन्दी में कर्मचिह्न ‘को’ वाक्य को सहज बनाता है।
- source_word: εἰ μὴ μόνος ὁ θεός
  choice: अकेले परमेश्वर के सिवा कौन
  rationale: ‘अकेले’ μόνος की अनन्यता को सुरक्षित रखता है और ‘के सिवा’ अपवादसूचक εἰ μή का स्वाभाविक हिन्दी रूप है।
- source_word: Τίς ἐστιν οὗτος
  choice: यह कौन है
  rationale: मूल में ‘मनुष्य’ जैसा कोई संज्ञा-पद नहीं है; संक्षिप्त प्रश्न मूल के तीखे, आपत्तिपूर्ण स्वर को बनाए रखता है।
theological_decisions:
- issue: पाप क्षमा करने के यीशु के अधिकार का निहितार्थ
  choice: वक्ताओं का दावा ज्यों का त्यों रखा गया है कि अकेला परमेश्वर ही पापों को क्षमा कर सकता है।
  alternative: यहाँ स्पष्ट रूप से कोई मसीही निष्कर्ष जोड़ना, या अनन्यता के दावे को नरम करना।
  rationale: पद स्वयं शास्त्रियों और फ़रीसियों की आपत्ति बताता है। लूका की कथा में इसका मसीह-संबंधी निहितार्थ महत्वपूर्ण है, पर अनुवाद को उस निष्कर्ष को पद में जोड़कर तनाव का समाधान नहीं करना चाहिए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शास्त्री’ और ‘फ़रीसी’ बाइबलीय संदर्भ में परिचित पद हैं। ‘परमेश्वर की निंदा की बातें’ सामान्य पाठक के लिए ‘ईशनिंदाएँ’ से अधिक स्पष्ट है और यूनानी बहुवचन को भी दर्शाता है।
