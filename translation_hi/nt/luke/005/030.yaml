  text: καὶ ἐγόγγυζον οἱ ⸂Φαρισαῖοι καὶ οἱ γραμματεῖς αὐτῶν⸃ πρὸς τοὺς μαθητὰς αὐτοῦ λέγοντες· Διὰ τί μετὰ τῶν τελωνῶν καὶ ἁμαρτωλῶν ἐσθίετε καὶ πίνετε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/030.yaml
  text: And the Pharisees and their scribes were grumbling to his disciples[a], saying, “Why do you eat and drink with tax collectors and sinners?”
translation:
  language: hi
  text: और फरीसी और उनके शास्त्री उसके चेलों से बड़बड़ाते हुए कह रहे थे[a], “तुम चुंगी लेनेवालों और पापियों के साथ क्यों खाते-पीते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शिकायत कर रहे थे।’ यूनानी क्रिया केवल औपचारिक आपत्ति नहीं, बल्कि दबे स्वर में बड़बड़ाने या शिकायत करने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγόγγυζον
  choice: कुड़कुड़ाते हुए कहने लगे
  rationale: अपूर्ण भूतकाल चलती या बार-बार की जा रही दबे स्वर की शिकायत दिखाता है। ‘कुड़कुड़ाते हुए’ नकारात्मक बड़बड़ाहट का भाव रखता है, और ‘कहने लगे’ हिन्दी में वाक्य को स्वाभाविक बनाता है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: यह ऐतिहासिक समूह-पद का सीधा और हिन्दी बाइबल-परंपरा में समझा जाने वाला समतुल्य है; ‘व्यवस्था के शिक्षक’ उसके कार्य की व्याख्या होगी।
- source_word: αὐτῶν
  choice: उनके
  rationale: 'यूनानी वाक्य-विन्यास में सर्वनाम सबसे स्वाभाविक रूप से फरीसियों के साथ शास्त्रियों का संबंध व्यक्त करता है: ‘उनके शास्त्री।’'
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ
  choice: उसके चेलों से
  rationale: यहाँ πρός कर्मकारक के साथ वाणी की दिशा बताता है। हिन्दी में ‘चेलों से ... कहने लगे’ स्वाभाविक है।
- source_word: Διὰ τί
  choice: क्यों
  rationale: कारण पूछने वाला सीधा और स्वाभाविक हिन्दी प्रश्नवाचक रूप।
- source_word: τελωνῶν
  choice: चुंगी लेनेवालों
  rationale: सुसमाचारों के ऐतिहासिक संदर्भ में कर या मार्ग-शुल्क वसूलने वाले सामाजिक रूप से कलंकित वर्ग के लिए प्रचलित और विशिष्ट पद।
- source_word: ἁμαρτωλῶν
  choice: पापियों
  rationale: सीधा समतुल्य, जो वक्ताओं की दृष्टि में नैतिक और सामाजिक रूप से चिह्नित वर्ग का बल बनाए रखता है।
- source_word: ἐσθίετε καὶ πίνετε
  choice: खाते-पीते हो
  rationale: दोनों ठोस क्रियाओं को बनाए रखते हुए वर्तमानकालीन सामान्य व्यवहार पर प्रश्न को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: καὶ
  choice: और
  rationale: यूनानी कथात्मक संयोजक को बिना अतिरिक्त व्याख्या के बनाए रखता है।
theological_decisions:
- issue: ‘चुंगी लेनेवालों और पापियों’ के साथ भोजन-संगति का सामाजिक-धार्मिक अर्थ
  choice: आरोप को उसके ठोस रूप—उनके साथ खाना-पीना—में ही रखा गया है।
  alternative: अनुष्ठानिक अशुद्धता या नैतिक अनुमोदन का कथित अपराध स्पष्ट करते हुए व्याख्यात्मक अनुवाद करना।
  rationale: पद स्वयं आपत्ति को समूह-पदों और साथ खाने-पीने के रूप में प्रस्तुत करता है। अनुवाद ऐतिहासिक और धर्मवैचारिक तनाव को बनाए रखता है, पर वह कारण नहीं जोड़ता जो मूल में स्पष्ट रूप से नहीं कहा गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘फरीसी,’ ‘शास्त्री,’ ‘चेले’ और ‘चुंगी लेनेवाले’ ऐतिहासिक संदर्भ को संक्षेप में बनाए रखते हैं। मुख्य पाठ में [a] चिह्न संबंधित क्रिया-प्रयोग के तुरंत बाद दिया गया है।
