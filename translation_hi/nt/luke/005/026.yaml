base_translation:
  language: en
  yaml_path: translation/nt/luke/005/026.yaml
  text: And amazement seized them all[a], and they were glorifying God, and they were filled with fear, saying, “We have seen extraordinary things today.”
translation:
  language: hi
  text: और विस्मय ने सबको आ घेरा। वे परमेश्वर की महिमा कर रहे थे और भय से भर गए थे। वे कहने लगे, “आज हमने असाधारण बातें[a] देखी हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अद्भुत बातें” अथवा “अनहोनी बातें”; यूनानी शब्द का अर्थ ऐसी बातें हैं जो सामान्य अपेक्षा से परे हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔκστασις
  choice: विस्मय
  rationale: यहाँ शब्द रहस्यमय समाधि नहीं, बल्कि चमत्कार से उत्पन्न अत्यंत गहरे आश्चर्य को व्यक्त करता है। ‘विस्मय’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: ἔλαβεν ἅπαντας
  choice: सबको आ घेरा
  rationale: यूनानी मुहावरे की सजीवता को बनाए रखते हुए यह स्वाभाविक हिन्दी में बताता है कि विस्मय ने उपस्थित सभी लोगों को अपने वश में कर लिया।
- source_word: ἐδόξαζον τὸν θεόν
  choice: वे परमेश्वर की महिमा कर रहे थे
  rationale: अपूर्ण भूतकाल की जारी क्रिया को ‘कर रहे थे’ स्पष्ट रूप से व्यक्त करता है, और δοξάζω के लिए ‘महिमा करना’ निकट तथा प्रचलित बाइबलीय अभिव्यक्ति है।
- source_word: ἐπλήσθησαν φόβου
  choice: भय से भर गए थे
  rationale: मूल के निष्क्रिय भाव और φόβος के सीधे अर्थ ‘भय’ को सुरक्षित रखता है; इसे केवल ‘श्रद्धामिश्रित विस्मय’ बनाकर नरम नहीं किया गया।
- source_word: λέγοντες
  choice: वे कहने लगे
  rationale: उद्धरण का स्वाभाविक हिन्दी परिचय देता है और भीड़ की तत्काल प्रतिक्रिया व्यक्त करता है।
- source_word: Εἴδομεν
  choice: हमने … देखी हैं
  rationale: अभी-अभी देखी गई घटनाओं पर वर्तमान प्रतिक्रिया के कारण हिन्दी का पूर्ण वर्तमान रूप स्वाभाविक है और तात्कालिकता बनाए रखता है।
- source_word: παράδοξα
  choice: असाधारण बातें
  rationale: यह उन बातों को दर्शाता है जो सामान्य अपेक्षा से परे हैं। ‘असाधारण’ आश्चर्यजनक स्वर को रखता है, जबकि ‘अजीब’ अनचाहा नकारात्मक भाव ला सकता है।
- source_word: σήμερον
  choice: आज
  rationale: समय-सूचक क्रियाविशेषण का सीधा और स्वाभाविक अनुवाद है।
theological_decisions:
- issue: दिव्य कार्य के प्रत्युत्तर में φόβος का भाव
  choice: ‘भय’ के रूप में सीधा अनुवाद
  alternative: ‘श्रद्धामिश्रित विस्मय’ या ‘भक्ति-भाव’
  rationale: यह पद यीशु के अधिकार के सामने उपजे स्तुतिपूर्ण किंतु विचलित कर देने वाले प्रत्युत्तर को साथ रखता है। ‘भय’ मूल पाठ की धार्मिक और भावात्मक तनावपूर्णता को बिना व्याख्यात्मक रूप से नरम किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘आ घेरा’ मूल मुहावरे की सजीवता रखता है; ‘महिमा कर रहे थे’ जारी क्रिया को दर्शाता है। छोटे वाक्यों से घटनाक्रम और भीड़ की तत्काल प्रतिक्रिया स्पष्ट रहती है।
