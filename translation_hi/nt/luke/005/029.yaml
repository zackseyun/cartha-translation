  text: Καὶ ἐποίησεν δοχὴν μεγάλην Λευὶς αὐτῷ ἐν τῇ οἰκίᾳ αὐτοῦ· καὶ ἦν ὄχλος ⸂πολὺς τελωνῶν⸃ καὶ ἄλλων οἳ ἦσαν μετ’ αὐτῶν κατακείμενοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/029.yaml
  text: And Levi made a great banquet for him in his house[b][a], and there was a large crowd of tax collectors and others who were reclining at table with them.
translation:
  language: hi
  text: तब लेवी ने अपने घर में उसके लिए एक बड़ी दावत दी। वहाँ चुंगी लेनेवालों और अन्य लोगों की बड़ी भीड़ थी; वे उनके साथ भोज में टेक लगाए हुए थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘भोज में टेक लगाए हुए’ उस समय के औपचारिक भोजन की प्रथा को दर्शाता है, जिसमें लोग मेज़ के पास टेक लगाकर लेटते थे।
    reason: cultural_note
lexical_decisions:
- source_word: δοχὴν μεγάλην
  choice: एक बड़ी दावत
  rationale: δοχή यहाँ आयोजित भोज या दावत को दर्शाता है; यह चयन आधुनिक हिन्दी में स्वाभाविक है और आयोजन की महत्ता बनाए रखता है।
- source_word: αὐτῷ
  choice: उसके लिए
  rationale: सर्वनाम निकटवर्ती संदर्भ में यीशु की ओर संकेत करता है; मूल की सर्वनामिक अभिव्यक्ति को बनाए रखा गया है।
- source_word: ἐν τῇ οἰκίᾳ αὐτοῦ
  choice: अपने घर में
  rationale: कर्ता लेवी होने के कारण हिन्दी में ‘अपने’ स्वाभाविक और अर्थ की दृष्टि से स्पष्ट है।
- source_word: ὄχλος πολὺς
  choice: एक बड़ी भीड़
  rationale: ὄχλος के सामूहिक अर्थ और πολύς से व्यक्त बड़ी संख्या को सीधा तथा सहज रूप दिया गया है।
- source_word: τελωνῶν
  choice: चुंगी लेनेवालों
  rationale: सुसमाचारों के ऐतिहासिक-सामाजिक संदर्भ में τελώνης के लिए यह प्रचलित और सामान्य पाठकों के लिए बोधगम्य हिन्दी पद है।
- source_word: ἄλλων
  choice: दूसरे लोगों
  rationale: मूल की अनिश्चितता को बनाए रखते हुए हिन्दी में संज्ञात्मक स्पष्टता के लिए ‘लोगों’ जोड़ा गया है।
- source_word: μετ’ αὐτῶν
  choice: उनके साथ
  rationale: मूल में बहुवचन सर्वनाम है; अनुवाद उसे बिना एकवचन में बदले सुरक्षित रखता है।
- source_word: κατακείμενοι
  choice: भोजन करने के लिए लेटी हुई थी
  rationale: यह औपचारिक भोजन के समय टेक लगाकर लेटने की प्राचीन मुद्रा को दर्शाता है। हिन्दी में केवल ‘बैठी’ कहना सांस्कृतिक विवरण खो देता; स्त्रीलिंग एकवचन ‘भीड़’ के अनुसार है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण गद्य। ‘चुंगी लेनेवाले’ पारंपरिक बाइबलीय शब्दावली और सामान्य बोधगम्यता के बीच संतुलन रखता है। यूनानी बहुवचन ‘उनके साथ’ को सुरक्षित रखा गया है; संदर्भ में यह भोजन कर रहे समूह की ओर संकेत करता है।
