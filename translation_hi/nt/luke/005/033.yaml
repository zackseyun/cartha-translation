id: LUK.5.33
reference: Luke 5:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Οἱ δὲ εἶπαν πρὸς αὐτόν· ⸀Οἱ μαθηταὶ Ἰωάννου νηστεύουσιν πυκνὰ καὶ δεήσεις ποιοῦνται, ὁμοίως καὶ οἱ τῶν Φαρισαίων, οἱ δὲ σοὶ ἐσθίουσιν καὶ πίνουσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/033.yaml
  text: And they said to him[a], “John’s disciples fast often and make prayers; likewise also those of the Pharisees[b], but yours eat and drink.”
translation:
  language: hi
  text: तब उन्होंने उससे कहा, “यूहन्ना के शिष्य अक्सर उपवास रखते और प्रार्थनाएँ करते हैं; वैसे ही फरीसियों के शिष्य भी,[a] लेकिन तुम्हारे शिष्य[b] खाते-पीते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल यूनानी में शाब्दिक रूप से ‘फरीसियों के’ है; ‘शिष्य’ पिछले वाक्यांश से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: मूल यूनानी में शाब्दिक रूप से केवल ‘तुम्हारे’ है; संदर्भ से ‘शिष्य’ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οἱ δὲ εἶπαν πρὸς αὐτόν
  choice: तब उन्होंने उससे कहा
  rationale: δέ हल्का कथात्मक संयोजक है। ‘तब’ प्रसंग का प्रवाह स्वाभाविक रखता है और अनावश्यक तीखा विरोध नहीं जोड़ता।
- source_word: μαθηταὶ Ἰωάννου
  choice: यूहन्ना के शिष्य
  rationale: सम्बन्धसूचक यूनानी रचना को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: νηστεύουσιν πυκνά
  choice: अक्सर उपवास रखते हैं
  rationale: पυκνά यहाँ बारंबारता बताता है; ‘अक्सर’ आधुनिक हिन्दी में सहज है। ‘उपवास रखना’ प्रचलित हिन्दी मुहावरा है।
- source_word: δεήσεις ποιοῦνται
  choice: प्रार्थनाएँ करते हैं
  rationale: यह बहुवचन संज्ञात्मक अभिव्यक्ति को बनाए रखता है और हिन्दी में स्वाभाविक है; δεήσεις में विनती का भाव निहित है।
- source_word: ὁμοίως καὶ
  choice: वैसे ही … भी
  rationale: यह ὁμοίως और καί दोनों के समानता तथा समावेश के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: οἱ τῶν Φαρισαίων
  choice: फरीसियों के शिष्य
  rationale: यूनानी में ‘शिष्य’ पिछले खंड से समझा जाता है। हिन्दी में उसे स्पष्ट करना अर्थ को बिना बदले अधिक स्वाभाविक और बोधगम्य है।
- source_word: οἱ δὲ σοὶ
  choice: लेकिन तुम्हारे शिष्य
  rationale: यूनानी में केवल ‘तुम्हारे’ है, पर संदर्भ से ‘शिष्य’ अभिप्रेत है। हिन्दी में संज्ञा जोड़ने से संदर्भ स्पष्ट रहता है और विरोध भी ठीक व्यक्त होता है।
- source_word: ἐσθίουσιν καὶ πίνουσιν
  choice: खाते-पीते हैं
  rationale: वर्तमान काल यहाँ सामान्य या नियमित व्यवहार बताता है; हिन्दी का संयुक्त प्रयोग संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: दूसरे और तीसरे खंड में निहित ‘शिष्य’ को स्पष्ट करना
  choice: मुख्य पाठ में दोनों स्थानों पर ‘शिष्य’ जोड़ा गया
  alternative: यूनानी दीर्घवृत्त को ‘फरीसियों के लोग’ और ‘तुम्हारे लोग’ जैसे रूपों में बनाए रखना
  rationale: यह कोई सिद्धान्तगत निर्णय नहीं, बल्कि हिन्दी की स्पष्टता का प्रश्न है। यूनानी में संज्ञा पहले खंड से सहज रूप से समझी जाती है; हिन्दी में ‘शिष्य’ की पुनरावृत्ति अर्थ को स्पष्ट करती है, जबकि पादटिप्पणियाँ मूल की संक्षिप्त रचना बताती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उपवास रखते’, ‘प्रार्थनाएँ करते’ और ‘खाते-पीते’ धार्मिक संदर्भ में परिचित तथा स्वाभाविक प्रयोग हैं।
