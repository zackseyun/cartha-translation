id: LUK.5.7
reference: Luke 5:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ κατένευσαν τοῖς ⸀μετόχοις ἐν τῷ ἑτέρῳ πλοίῳ τοῦ ἐλθόντας συλλαβέσθαι αὐτοῖς· καὶ ἦλθον, καὶ ἔπλησαν ἀμφότερα τὰ πλοῖα ὥστε βυθίζεσθαι αὐτά.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/007.yaml
  text: So they signaled to their partners in the other boat to come and help them[a]. And they came and filled both boats[c][b], so that they began to sink.
translation:
  language: hi
  text: तब उन्होंने दूसरी नाव में अपने साझेदारों को इशारा किया[a] कि वे आकर उनकी मदद करें[b]। वे आए और उन्होंने दोनों नावों को इतना भर दिया कि वे डूबने लगीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “संकेत किया” अथवा “हाथ से बुलाया।”
    reason: lexical_alternative
  - marker: b
    text: या, “वे आकर उनके साथ हाथ बँटाएँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “कि वे डूब रही थीं।”
    reason: aspectual_alternative
lexical_decisions:
- source_word: κατένευσαν
  choice: इशारा किया
  rationale: क्रिया दूर से संकेत या हाव-भाव करने को दर्शाती है; पानी पर दूसरी नाव से संपर्क के प्रसंग में ‘इशारा किया’ स्वाभाविक और स्पष्ट है।
- source_word: μετόχοις
  choice: साझेदारों
  rationale: मछली पकड़ने के इस प्रसंग में यह शब्द केवल साथियों के बजाय काम या व्यवसाय में भागीदार लोगों को सूचित करता है।
- source_word: ἐν τῷ ἑτέρῳ πλοίῳ
  choice: दूसरी नाव में
  rationale: यह पद दृश्य में उपस्थित दूसरी नाव को अलग पहचानता है; हिन्दी में ‘दूसरी नाव में’ सहज है।
- source_word: τοῦ ἐλθόντας
  choice: कि वे आकर
  rationale: यह रचना उद्देश्य व्यक्त करती है; ‘कि वे आकर’ हिन्दी में संकेत किए जाने के उद्देश्य को स्वाभाविक रूप से जोड़ती है।
- source_word: συλλαβέσθαι αὐτοῖς
  choice: उनकी मदद करें
  rationale: यहाँ अर्थ किसी काम में साथ लगकर सहायता करना है; ‘मदद करें’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘उनके साथ हाथ बँटाएँ’ को पादटिप्पणी में अधिक चित्रात्मक विकल्प के रूप में रखा गया है।
- source_word: ἔπλησαν
  choice: भर दिया
  rationale: मूल क्रिया ‘भरना’ बताती है। मछलियों से भरना पिछले प्रसंग से स्पष्ट है, इसलिए उसे अनावश्यक रूप से नहीं जोड़ा गया।
- source_word: ἀμφότερα τὰ πλοῖα
  choice: दोनों नावों को
  rationale: ἀμφότερα का विशिष्ट अर्थ ‘दोनों’ है, जिसे सीधे सुरक्षित रखा गया है।
- source_word: ὥστε βυθίζεσθαι αὐτά
  choice: कि वे डूबने लगीं
  rationale: वर्तमान infinitive परिणामस्वरूप चल रही प्रक्रिया को व्यक्त करता है। ‘डूबने लगीं’ यह स्पष्ट करता है कि नावें डूबने की स्थिति में पहुँच गई थीं, न कि आवश्यक रूप से पूरी तरह डूब चुकी थीं।
