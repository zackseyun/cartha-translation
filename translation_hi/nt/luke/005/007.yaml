  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘साझेदार’ व्यावसायिक संबंध को, ‘इशारा किया’ दूर से किए गए हाव-भाव को, और ‘डूबने लगीं’ परिणामस्वरूप आरम्भ हुई प्रक्रिया को व्यक्त करता है।
