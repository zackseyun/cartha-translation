  yaml_path: translation/nt/luke/005/024.yaml
  text: But so that you may know that the Son of Man has authority on earth to forgive sins—he said to the paralyzed man[a], “I say to you, rise, pick up your mat[b], and go to your house.”
translation:
  language: hi
  text: परन्तु इसलिए कि तुम जान लो कि मनुष्य के पुत्र को पृथ्वी पर पाप क्षमा करने का अधिकार है—उसने लकवे से पीड़ित व्यक्ति से कहा, “मैं तुमसे कहता हूँ, उठो, अपनी चटाई[a] उठाओ और अपने घर चले जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना बिछौना।” यूनानी शब्द κλινίδιον का अर्थ छोटी खाट, बिछौना या चटाई हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα δὲ εἰδῆτε
  choice: पर इसलिए कि तुम जान लो
  rationale: δέ हल्का विरोध/संक्रमण और ἵνα उद्देश्य प्रकट करता है; हिंदी में यह विन्यास अगले प्रदर्शन के उद्देश्य को स्वाभाविक रूप से जोड़ता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: यीशु की आत्म-पदवी और दानिय्येल 7 की संभावित प्रतिध्वनि को बिना व्याख्यात्मक सरलीकरण के सुरक्षित रखता है।
- source_word: ἐξουσίαν ἔχει
  choice: अधिकार है
  rationale: ἐξουσία केवल सामर्थ्य नहीं, बल्कि वैध अधिकार या विशेषाधिकार बताता है; प्रसंग में पाप क्षमा करने के अधिकार पर ही प्रश्न है।
- source_word: ἐπὶ τῆς γῆς
  choice: पृथ्वी पर
  rationale: मूल के सीधे स्थानवाचक अर्थ को बनाए रखता है और किसी अतिरिक्त व्याख्या को नहीं जोड़ता।
- source_word: ἀφιέναι ἁμαρτίας
  choice: पाप क्षमा करने
  rationale: इस प्रसंग में ἀφίημι का अर्थ पापों को क्षमा या माफ करना है; यह स्पष्ट और प्रचलित हिंदी है।
- source_word: τῷ παραλελυμένῳ
  choice: लकवे से पीड़ित व्यक्ति से
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को व्यक्ति-केंद्रित, सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: Σοὶ λέγω
  choice: मैं तुमसे कहता हूँ
  rationale: Σοί की प्रत्यक्ष और बलयुक्त संबोधन-भावना को सुरक्षित रखता है।
- source_word: ἔγειρε
  choice: उठो
  rationale: आज्ञार्थक तत्काल क्रिया को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: ἄρας τὸ κλινίδιόν σου
  choice: अपनी चटाई उठाओ
  rationale: αἴρω उठाकर ले जाने का भाव देता है और κλινίδιον छोटी शय्या, बिछौना या चटाई हो सकती है; प्रसंग में ‘चटाई’ सहज है।
- source_word: πορεύου εἰς τὸν οἶκόν σου
  choice: अपने घर चले जाओ
  rationale: गंतव्य सहित गति की आज्ञा को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ὁ υἱὸς τοῦ ἀνθρώπου का अनुवाद
  choice: मनुष्य का पुत्र
  alternative: मानव-पुत्र / वह मनुष्य
  rationale: परंपरागत बाइबलीय पदवी दानिय्येल 7 की अंतर्पाठीय प्रतिध्वनि और अभिव्यक्ति की वास्तविक अस्पष्टता को बनाए रखती है।
- issue: पाप क्षमा के संदर्भ में ἐξουσία
  choice: अधिकार
  alternative: सामर्थ्य
  rationale: यहाँ विवाद केवल चंगा करने की क्षमता पर नहीं, पाप क्षमा करने के वैध अधिकार पर है; इसलिए ‘अधिकार’ अधिक सटीक है।
- issue: ἐπὶ τῆς γῆς का आशय
  choice: पृथ्वी पर
  alternative: सांसारिक क्षेत्र में
  rationale: सीधा अनुवाद कथन को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मनुष्य का पुत्र’ स्थापित बाइबलीय पदवी के रूप में रखा गया है। मुख्य वाक्य में मूल यूनानी का नाटकीय व्यवधान—‘उसने ... से कहा’—डैश द्वारा बनाए रखा गया है।
