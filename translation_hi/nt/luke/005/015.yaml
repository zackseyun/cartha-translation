  text: διήρχετο δὲ μᾶλλον ὁ λόγος περὶ αὐτοῦ, καὶ συνήρχοντο ὄχλοι πολλοὶ ἀκούειν καὶ ⸀θεραπεύεσθαι ἀπὸ τῶν ἀσθενειῶν αὐτῶν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/015.yaml
  text: But the report about him spread even more[a], and large crowds were gathering to hear and to be healed of their sicknesses.
translation:
  language: hi
  text: लेकिन उसके बारे में खबर और भी फैलती गई[a], और लोगों की बड़ी-बड़ी भीड़ें उसे सुनने और अपनी बीमारियों से चंगा होने के लिए इकट्ठी होती रहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके बारे में बात” या “उसके बारे में समाचार”।
    reason: lexical_alternative
lexical_decisions:
- source_word: διήρχετο
  choice: फैलती गई
  rationale: अपूर्ण भूतकाल का रूप खबर के लगातार और बढ़ते हुए प्रसार को व्यक्त करता है; यह हिंदी में स्वाभाविक भी है।
- source_word: μᾶλλον
  choice: और भी
  rationale: यह पिछले प्रसंग की तुलना में प्रसार की बढ़ती मात्रा को बनाए रखता है।
- source_word: ὁ λόγος περὶ αὐτοῦ
  choice: उसके बारे में खबर
  rationale: यहाँ λόγος यीशु के विषय में फैल रही सूचना या चर्चा को दर्शाता है, न कि किसी विशेष पारिभाषिक धार्मिक अर्थ में ‘वचन’ को।
- source_word: συνήρχοντο
  choice: इकट्ठी होती रहीं
  rationale: अपूर्ण भूतकाल बार-बार या लगातार लोगों के जमा होते रहने का भाव देता है।
- source_word: ὄχλοι πολλοὶ
  choice: लोगों की बड़ी-बड़ी भीड़ें
  rationale: यह बहुवचन भीड़ और उनकी बड़ी संख्या—दोनों को बनाए रखता है, यद्यपि हिंदी में ‘भीड़ें’ सामान्य बोलचाल से कुछ कम प्रचलित है।
- source_word: ἀκούειν
  choice: उसे सुनने
  rationale: यूनानी में सुनने का विषय प्रसंग से स्पष्ट है; हिंदी में ‘उसे’ जोड़ना वही निहित अर्थ स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: θεραπεύεσθαι
  choice: चंगी की जाने
  rationale: यह वर्तमान कर्मवाच्य क्रिया के उपचार पाए जाने के अर्थ और स्त्रीलिंग बहुवचन ‘बीमारियों’ से जुड़े हिंदी प्रयोग को बनाए रखता है।
- source_word: ἀπὸ τῶν ἀσθενειῶν αὐτῶν
  choice: अपनी बीमारियों से
  rationale: उपचार के इस प्रसंग में ἀσθένεια शारीरिक रोगों को सूचित करता है; ‘से’ ἀπό के छुटकारे के भाव को व्यक्त करता है।
theological_decisions:
- issue: चंगाई की प्रकृति
  choice: शारीरिक बीमारियों से चंगा किए जाने की सीधी भाषा
  alternative: ‘संपूर्ण किए जाने’ जैसी व्यापक भाषा, जिसमें आत्मिक पुनर्स्थापना भी समझी जा सकती है
  rationale: निकटवर्ती प्रसंग शारीरिक रोगों के उपचार का है; पद स्पष्ट रूप से आत्मिक चंगाई नहीं कहता, इसलिए ऐसा अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी रखी गई है। ‘चंगी की जाने’ कर्मवाच्य अर्थ को सुरक्षित रखता है; ‘खबर’ सामान्य पाठक के लिए λόγος के प्रसंगगत अर्थ को स्पष्ट करता है।
