    text: या “उन्होंने बहुत बड़ी संख्या में मछलियाँ पकड़ लीं।” यूनानी क्रिया का अधिक शाब्दिक अर्थ “घेर लेना” या “भीतर बंद कर लेना” है, जो जालों में मछलियों को चारों ओर से घेरने के दृश्य को उभारता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके जाल फटने लगे थे।” यूनानी की अपूर्ण भूतकाल क्रिया फटने की प्रक्रिया को जारी दिखाती है; इसका यह अर्थ आवश्यक नहीं कि जाल पूरी तरह फट चुके थे।
    reason: lexical_alternative
