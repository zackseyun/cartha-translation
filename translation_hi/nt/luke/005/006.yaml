- source_word: συνέκλεισαν
  choice: जालों में घेर लिया
  rationale: क्रिया का मूल बिंब मछलियों को चारों ओर से घेरने या भीतर बन्द कर लेने का है। “पकड़ लिया” सम्भव है, पर वह इस दृश्यात्मक बिंब को कम कर देता है। “जालों में” प्रसंग से स्पष्ट साधन को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: πλῆθος ἰχθύων πολύ
  choice: बहुत बड़ी संख्या में मछलियों को
  rationale: πλῆθος और πολύ दोनों मिलकर असाधारण बहुतायत पर बल देते हैं। यह प्रयोग उस बल को रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: διερρήσσετο
  choice: फट रहे थे
  rationale: अपूर्ण भूतकाल रूप फटने की जारी प्रक्रिया दिखाता है, पूर्णतः फट चुकने की स्थिति नहीं। मध्यम/कर्मवाच्य रूप को हिन्दी में स्वाभाविक अकर्मक ढंग से व्यक्त किया गया है।
- source_word: τὰ δίκτυα αὐτῶν
  choice: उनके जाल
  rationale: यूनानी के बहुवचन और सम्बन्धसूचक सर्वनाम दोनों को सीधे और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
