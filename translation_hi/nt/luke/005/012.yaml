source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν μιᾷ τῶν πόλεων καὶ ἰδοὺ ἀνὴρ πλήρης λέπρας· ⸂καὶ ἰδὼν⸃ τὸν Ἰησοῦν πεσὼν ἐπὶ πρόσωπον ἐδεήθη αὐτοῦ λέγων· Κύριε, ἐὰν θέλῃς δύνασαί με καθαρίσαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/005/012.yaml
  text: And it happened that while he was in one of the towns[a], behold, there was a man full of leprosy. And when he saw Jesus, he fell on his face and begged him, saying, “Lord, if you are willing[b], you can cleanse me.”
translation:
  language: hi
  text: और ऐसा हुआ कि जब वह किसी एक नगर में था, तो देखो, वहाँ एक आदमी था जो कुष्ठ रोग से पूरी तरह ग्रस्त था[a]। यीशु को देखकर वह मुँह के बल गिर पड़ा और उससे विनती की, “प्रभु, यदि आप चाहें, तो मुझे शुद्ध कर सकते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कुष्ठ से भरा हुआ।” इससे उसकी दशा की गंभीरता पर बल पड़ता है। बाइबल के समय ‘कुष्ठ’ कहलाने वाला रोग आधुनिक हैन्सन रोग के अतिरिक्त कुछ अन्य गंभीर चर्म रोगों को भी समेट सकता था।
    reason: lexical_alternative
  - marker: b
    text: या, “मुझे स्वच्छ कर सकते हैं।” यहाँ प्रयुक्त क्रिया शारीरिक रोगमुक्ति के साथ धार्मिक और सामाजिक शुद्धता का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐγένετο
  choice: ऐसा हुआ
  rationale: लूका के दृश्य आरम्भ करने वाले कथात्मक सूत्र को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: ἐν τῷ εἶναι αὐτὸν
  choice: जब वह … था
  rationale: कालवाचक यूनानी रचना को सहज हिन्दी उपवाक्य में व्यक्त करता है।
- source_word: μιᾷ τῶν πόλεων
  choice: उन नगरों में से किसी एक में
  rationale: πόλις के लिए ‘नगर’ ऐसा व्यापक और स्वाभाविक शब्द है जो अनावश्यक रूप से किसी बड़े महानगर का संकेत नहीं देता।
- source_word: ἰδοὺ
  choice: देखो
  rationale: दृश्य में अचानक आए व्यक्ति की ओर ध्यान खींचने वाली कथात्मक सजीवता को सुरक्षित रखता है।
- source_word: πλήρης λέπρας
  choice: कुष्ठ रोग से पूरी तरह ग्रस्त
  rationale: शब्दशः असहज ‘कुष्ठ से भरा’ के बजाय πλήρης द्वारा व्यक्त रोग की गंभीरता को स्पष्ट, स्वाभाविक हिन्दी में देता है; शाब्दिक रूप और प्राचीन शब्द की व्यापकता पादटिप्पणी में दी गई है।
- source_word: ἰδὼν τὸν Ἰησοῦν
  choice: यीशु को देखकर
  rationale: कृदन्त को घटनाक्रम के अनुरूप संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: πεσὼν ἐπὶ πρόσωπον
  choice: मुँह के बल गिर पड़ा
  rationale: उसकी दीनता और अत्यन्त आग्रह प्रकट करने वाली शारीरिक मुद्रा को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: ἐδεήθη αὐτοῦ
  choice: उससे विनती करने लगा
  rationale: साधारण निवेदन से अधिक गहरी और व्याकुल याचना का भाव व्यक्त करता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: सम्मानसूचक सम्बोधन और सम्भावित मसीही निहितार्थ, दोनों को बिना आवश्यकता से अधिक निश्चित किए बनाए रखता है।
- source_word: ἐὰν θέλῃς
  choice: यदि आप चाहें
  rationale: इच्छा या तत्परता की शर्त को आधुनिक हिन्दी में सहजता से व्यक्त करता है।
- source_word: δύνασαί με καθαρίσαι
  choice: मुझे शुद्ध कर सकते हैं
  rationale: यीशु की सामर्थ्य और καθαρίζω के शारीरिक, धार्मिक तथा सामाजिक शुद्धता से जुड़े अर्थों को सुरक्षित रखता है।
theological_decisions:
- issue: λέπρα और καθαρίζω को केवल चिकित्सकीय चंगाई तक सीमित करना
  choice: ‘कुष्ठ रोग’ और ‘मुझे शुद्ध कर सकते हैं’
  alternative: ‘चर्म रोग’ और ‘मुझे चंगा कर सकते हैं’
  rationale: मूल पाठ रोग के साथ शुद्ध किए जाने की भाषा उपयोग करता है, जिसमें शारीरिक स्वास्थ्य के अतिरिक्त धार्मिक और सामाजिक पुनर्स्थापना के संकेत भी हो सकते हैं। ‘शुद्ध’ उस अर्थ-व्याप्ति को सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि प्राचीन λέπρα आधुनिक हैन्सन रोग से व्यापक हो सकता था।
- issue: यीशु के लिए सम्बोधन Κύριε
  choice: प्रभु
  alternative: स्वामी / महोदय
  rationale: ‘प्रभु’ सम्मान और सम्भावित मसीही प्रतिध्वनि दोनों को बनाए रखता है, पर तत्काल प्रसंग में वक्ता की पूरी मसीह-विषयक समझ को निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘देखो’ मूल कथात्मक बल को बनाए रखने के लिए जानबूझकर रखा गया है। यीशु के लिए आदरसूचक ‘आप’ और बहुवचन क्रियारूप प्रयुक्त हुए हैं।
