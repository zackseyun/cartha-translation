source:
  edition: SBLGNT
  text: Μετὰ δὲ ταῦτα ἀνέδειξεν ὁ κύριος ⸀καὶ ἑτέρους ἑβδομήκοντα ⸀δύο καὶ ἀπέστειλεν αὐτοὺς ἀνὰ δύο ⸁δύο πρὸ προσώπου αὐτοῦ εἰς πᾶσαν πόλιν καὶ τόπον οὗ ἤμελλεν αὐτὸς ἔρχεσθαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/001.yaml
  text: After these things[a], the Lord appointed seventy-two others also, and sent them two by two ahead of him into every town and place where he himself was about to go.
translation:
  language: hi
  text: इन बातों के बाद प्रभु ने बहत्तर[a] अन्य लोगों को भी नियुक्त किया और उन्हें दो-दो करके अपने आगे हर नगर और स्थान को भेजा, जहाँ वह स्वयं आने वाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में ‘बहत्तर’ के स्थान पर ‘सत्तर’ है।
    reason: textual_variant
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: इन बातों के बाद
  rationale: बहुवचन संकेतवाचक को बनाए रखते हुए यह स्वाभाविक और स्पष्ट काल-संक्रमण देता है।
- source_word: ἀνέδειξεν
  choice: नियुक्त किया
  rationale: यहाँ क्रिया किसी कार्य के लिए लोगों को ठहराने या नामित करने का भाव देती है, केवल चुनने या प्रकट करने का नहीं।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: लूका के इस प्रसंग में यह उपाधि यीशु को सूचित करती है; ‘प्रभु’ मानक और गरिमापूर्ण हिन्दी रूप है।
- source_word: καὶ ἑτέρους ἑβδομήκοντα δύο
  choice: बहत्तर और लोगों को
  rationale: ἑτέρους अतिरिक्त या अन्य लोगों को दर्शाता है और καί जोड़ने का भाव देता है। मुख्य पाठ में SBLGNT का ‘बहत्तर’ रखा गया है।
- source_word: ἀπέστειλεν
  choice: भेजा
  rationale: यह सरल रूप मूल क्रिया को बिना अनावश्यक धार्मिक अर्थ जोड़े ठीक प्रकार व्यक्त करता है।
- source_word: ἀνὰ δύο δύο
  choice: दो-दो करके
  rationale: यह यूनानी के वितरणात्मक भाव और पुनरुक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: πρὸ προσώπου αὐτοῦ
  choice: अपने आगे
  rationale: इसका आशय प्रभु के पहुँचने से पहले अग्रिम रूप से भेजना है; ‘अपने आगे’ संक्षिप्त और स्वाभाविक है।
- source_word: εἰς πᾶσαν πόλιν καὶ τόπον
  choice: हर नगर और स्थान में
  rationale: दोनों संज्ञाओं को बनाए रखा गया है; ‘नगर’ πόλις के लिए सामान्य, आधुनिक और प्रसंगानुकूल है।
- source_word: οὗ ἤμελλεν αὐτὸς ἔρχεσθαι
  choice: जहाँ वह स्वयं जानेवाला था
  rationale: यह μέλλω के निकट भविष्य या अभिप्रेत कार्य को व्यक्त करता है और αὐτός के बल को ‘स्वयं’ से सुरक्षित रखता है।
theological_decisions:
- issue: नियुक्त किए गए लोगों की संख्या का पाठांतर
  choice: बहत्तर
  alternative: सत्तर
  rationale: प्रदत्त SBLGNT पाठ में ἑβδομήκοντα δύο अर्थात ‘बहत्तर’ है। ‘सत्तर’ एक महत्वपूर्ण प्राचीन पाठांतर है, इसलिए उसे पाद-टिप्पणी में सुरक्षित रखा गया है; यह पाठालोचन का प्रश्न है, न कि किसी सिद्धान्त को निश्चित करने का।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘जानेवाला’ को संयुक्त रूप में रखा गया है। वाक्य मूल की क्रमिक गति और ‘स्वयं’ के बल को बनाए रखता है।
