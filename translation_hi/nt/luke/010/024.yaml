id: LUK.10.24
reference: Luke 10:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω γὰρ ὑμῖν ὅτι πολλοὶ προφῆται καὶ βασιλεῖς ἠθέλησαν ἰδεῖν ἃ ὑμεῖς βλέπετε καὶ οὐκ εἶδαν, καὶ ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/024.yaml
  text: For I tell you that many prophets and kings desired to see what you see and did not see it[a], and to hear what you hear and did not hear it.
translation:
  language: hi
  text: क्योंकि मैं तुमसे कहता हूँ कि बहुत-से भविष्यद्वक्ताओं और राजाओं ने जो कुछ तुम देखते हो, उसे देखने की इच्छा की[a], पर उसे देखा नहीं; और जो कुछ तुम सुनते हो, उसे सुनने की इच्छा की, पर उसे सुना नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखना चाहा।”
    reason: ἠθέλησαν के लिए ‘इच्छा की’ और ‘चाहा’ दोनों स्वाभाविक अर्थ हैं।
lexical_decisions:
- source_word: λέγω γὰρ ὑμῖν
  choice: क्योंकि मैं तुमसे कहता हूँ
  rationale: ‘क्योंकि’ γάρ के पिछले कथन से व्याख्यात्मक संबंध को बनाए रखता है, और ‘मैं तुमसे कहता हूँ’ आधुनिक हिन्दी में λέγω ... ὑμῖν का स्वाभाविक रूप है।
- source_word: πολλοὶ προφῆται καὶ βασιλεῖς
  choice: बहुत-से भविष्यद्वक्ताओं और राजाओं
  rationale: दोनों ऐतिहासिक श्रेणियों को बिना व्याख्यात्मक विस्तार के सीधे रखा गया है; βασιλεῖς का अर्थ यहाँ ‘राजाओं’ है, केवल व्यापक ‘शासकों’ का नहीं।
- source_word: ἠθέλησαν
  choice: इच्छा की
  rationale: θέλω यहाँ चाह या इच्छा व्यक्त करता है। ‘इच्छा की’ गरिमापूर्ण और स्वाभाविक है तथा ‘लालसा की’ जैसी अधिक तीव्र भावना अनिवार्य रूप से नहीं जोड़ता।
- source_word: ἰδεῖν ἃ ὑμεῖς βλέπετε
  choice: जो कुछ तुम देखते हो, उसे देखने
  rationale: भूतकालीन इच्छा और शिष्यों के वर्तमान अनुभव का अंतर स्पष्ट रखते हुए यूनानी संबंधवाचक संरचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: καὶ οὐκ εἶδαν
  choice: पर उसे देखा नहीं
  rationale: साधारण ऐतिहासिक निषेध को बनाए रखा गया है; ‘देख नहीं सके’ कहने से असमर्थता का ऐसा भाव जुड़ सकता था जो यूनानी में स्पष्ट नहीं है।
- source_word: ἀκοῦσαι ἃ ἀκούετε καὶ οὐκ ἤκουσαν
  choice: जो कुछ तुम सुनते हो, उसे सुनने की इच्छा की, पर उसे सुना नहीं
  rationale: देखने और सुनने की समानांतर रचना को सुरक्षित रखा गया है और वर्तमान ‘सुनते हो’ तथा अतीत ‘सुना नहीं’ का कालगत विरोध स्पष्ट है।
theological_decisions:
- issue: ‘भविष्यद्वक्ताओं और राजाओं’ की पहचान
  choice: ऐतिहासिक श्रेणियों को केवल ‘भविष्यद्वक्ताओं और राजाओं’ के रूप में बनाए रखना
  alternative: ‘पुराने समय के भविष्यद्वक्ताओं और राजाओं’ या ‘भविष्यद्वक्ताओं और शासकों’ के रूप में विस्तार करना
  rationale: पद इन व्यक्तियों की पहचान या काल को स्पष्ट नहीं करता। अनुवाद शिष्यों को मिले प्रकाशन और पहले के प्रतिष्ठित लोगों की अधूरी इच्छा के बीच तनाव को बनाए रखता है, पर अतिरिक्त पहचान नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सामान्य और गरिमापूर्ण रखी गई है। ‘तुम’ बहुवचन श्रोताओं को संबोधित करता है। समानांतर वाक्य-विन्यास मूल पद की देखने और सुनने वाली दोहरी संरचना को बनाए रखता है।
