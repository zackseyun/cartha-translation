  text: κατὰ συγκυρίαν δὲ ἱερεύς τις κατέβαινεν ἐν τῇ ὁδῷ ἐκείνῃ, καὶ ἰδὼν αὐτὸν ἀντιπαρῆλθεν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/031.yaml
  text: By chance a certain priest was going down on that road[a], and when he saw him, he passed by on the opposite side.
translation:
  language: hi
  text: संयोग से एक याजक उसी मार्ग से नीचे जा रहा था। उस मनुष्य को देखकर वह मार्ग की दूसरी ओर से होकर आगे निकल गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह पास से निकल गया”; पर यूनानी क्रिया दूसरी ओर रहते हुए निकल जाने का संकेत देती है, जिससे जानबूझकर बचने का भाव प्रकट हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατὰ συγκυρίαν
  choice: संयोग से
  rationale: यह यूनानी मुहावरा किसी घटना के संयोगवश घटने को व्यक्त करता है। ‘संयोग से’ स्वाभाविक हिन्दी है और दार्शनिक रूप से पूर्ण अनियतता का अनावश्यक दावा नहीं करता।
- source_word: δὲ
  choice: अलग शब्द के रूप में व्यक्त नहीं किया
  rationale: यहाँ δέ कथा को हल्के ढंग से आगे बढ़ाने वाला संयोजक है। हिन्दी में नया वाक्य और घटनाक्रम स्वयं यह काम करते हैं; ‘परन्तु’ विरोध का भाव अधिक प्रबल कर देता।
- source_word: ἱερεύς τις
  choice: एक याजक
  rationale: τις एक अनाम, अनिश्चित व्यक्ति को सूचित करता है। आधुनिक हिन्दी में ‘एक याजक’ यही अर्थ स्वाभाविक रूप से देता है; ‘कोई एक याजक’ अनावश्यक रूप से भारी होता।
- source_word: κατέβαινεν
  choice: नीचे जा रहा था
  rationale: अपूर्ण भूतकालीन क्रिया चल रही यात्रा की पृष्ठभूमि प्रस्तुत करती है। ‘जा रहा था’ उसके अपूर्णतापरक पक्ष को बनाए रखता है, और ‘नीचे’ κατ- के दिशात्मक भाव को व्यक्त करता है।
- source_word: ἐν τῇ ὁδῷ ἐκείνῃ
  choice: उसी मार्ग से
  rationale: मार्ग के साथ ἐν का हिन्दी में स्वाभाविक रूप ‘मार्ग से’ है। ‘उसी’ पहले उल्लिखित मार्ग की ओर संकेत करता है।
- source_word: ἰδὼν αὐτὸν
  choice: उस मनुष्य को देखकर
  rationale: अओरिस्ट कृदंत को कालगत संबंध के रूप में प्रस्तुत किया गया है। संदर्भगत संज्ञा जोड़ने से हिन्दी में यह स्पष्ट रहता है कि याजक ने पड़े हुए व्यक्ति को देखा।
- source_word: ἀντιπαρῆλθεν
  choice: मार्ग की दूसरी ओर से होकर आगे निकल गया
  rationale: क्रिया केवल पास से निकलने के बजाय सामने की विपरीत ओर होकर निकल जाने का भाव रखती है। यह अनुवाद उस स्थानिक दूरी और संभावित जानबूझकर बचने के संकेत को सुरक्षित रखता है।
