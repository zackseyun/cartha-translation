base_translation:
  language: en
  yaml_path: translation/nt/luke/010/018.yaml
  text: And he said to them[a], “I was watching Satan fall like lightning from heaven.”
translation:
  language: hi
  text: तब उसने उनसे कहा, “मैं शैतान को बिजली की तरह स्वर्ग से गिरते देख रहा था।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने शैतान को बिजली की तरह स्वर्ग से गिरते देखा।” यूनानी अपूर्ण भूतकाल का अनुवाद साधारण भूतकाल में भी किया जा सकता है, यद्यपि “देख रहा था” जारी क्रिया के भाव को अधिक स्पष्ट रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἶπεν
  choice: उसने कहा
  rationale: λέγω के अओरिस्ट को सामान्य कथात्मक भूतकाल में रखना स्वाभाविक है।
- source_word: δὲ
  choice: तब
  rationale: δέ हल्का कथात्मक संयोजक है; यहाँ ‘तब’ पिछले प्रसंग से सहज संबंध बनाता है, बिना किसी प्रबल तार्किक संबंध को आरोपित किए।
- source_word: αὐτοῖς
  choice: उनसे
  rationale: बहुवचन संप्रदानवाचक सर्वनाम लौटे हुए शिष्यों की ओर संकेत करता है; ‘उनसे कहा’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: Ἐθεώρουν
  choice: देख रहा था
  rationale: θεωρέω का अपूर्ण भूतकाल जारी या प्रगतिशील दृष्टि को व्यक्त कर सकता है; ‘देख रहा था’ इस पक्ष को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: τὸν Σατανᾶν
  choice: शैतान को
  rationale: Σατανᾶς यहाँ व्यक्तिगत नाम/उपाधि के रूप में है; हिन्दी में स्थापित रूप ‘शैतान’ उपयुक्त है।
- source_word: ὡς ἀστραπὴν
  choice: बिजली की तरह
  rationale: ὡς उपमा प्रस्तुत करता है; यह वाक्यांश मूल बिंब को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: ἐκ τοῦ οὐρανοῦ
  choice: स्वर्ग से
  rationale: οὐρανός का अर्थ आकाश या स्वर्ग हो सकता है; शैतान के पतन के इस संदर्भ में ‘स्वर्ग’ आध्यात्मिक-कॉस्मिक अर्थ को बेहतर बनाए रखता है।
- source_word: πεσόντα
  choice: गिरते
  rationale: अओरिस्ट कृदंत Σατανᾶν को विशेषित करता है और देखने की क्रिया का दृश्य-विषय बताता है; ‘गिरते देख रहा था’ हिन्दी में घटना को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शैतान के पतन के विषय में यीशु के कथन का काल और पक्ष
  choice: ‘मैं शैतान को ... गिरते देख रहा था’ कहकर जारी दर्शन या अवलोकन का भाव रखना, पर यह निर्धारित न करना कि घटना आदिकालीन पतन, शिष्यों की वर्तमान सेवा, या भावी पराजय का दर्शन है।
  alternative: ‘मैंने शैतान को बिजली की तरह स्वर्ग से गिरते देखा।’
  rationale: यूनानी अपूर्ण भूतकाल प्रगतिशील पक्ष की अनुमति देता है, लेकिन घटना की विशिष्ट धर्मवैज्ञानिक समयरेखा तय नहीं करता। अनुवाद इस अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बिजली की तरह’ मूल उपमा को बनाए रखता है; ‘स्वर्ग’ संदर्भ के आध्यात्मिक-कॉस्मिक आयाम को सुरक्षित रखता है।
