review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the two present imperatives, the sick persons located in the previously mentioned town, and the perfect Ἤγγικεν as a completed approach with present relevance. “परमेश्वर का राज्य” appropriately preserves the established biblical expression and does not resolve the kingdom’s eschatological tension.
  naturalness: “उस नगर के बीमारों को” is understandable, but in modern standard Hindi it can sound possessive (“the town’s sick”) rather than plainly locative. Recasting it as “उस नगर में जो बीमार हैं” is more natural while directly representing ἐν αὐτῇ.
  terminology: “चंगा करो” is a well-established and suitably dignified Hindi biblical rendering of θεραπεύετε. “परमेश्वर का राज्य” is consistent, clear, and theologically noninterpretive. The footnote offers a valid Hindi alternative for the arrival/approach nuance.
  issues:
  - severity: low
    issue: Locative phrasing of the sick persons
    rationale: “उस नगर के बीमारों को” communicates the intended sense, but “उस नगर में जो बीमार हैं, उन्हें” more transparently reflects the Greek locative phrase τοὺς ἐν αὐτῇ ἀσθενεῖς and is smoother modern Hindi.
