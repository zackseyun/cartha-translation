id: LUK.10.9
reference: Luke 10:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ θεραπεύετε τοὺς ἐν αὐτῇ ἀσθενεῖς, καὶ λέγετε αὐτοῖς· Ἤγγικεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/009.yaml
  text: And heal the sick in it[a], and say to them, ‘The kingdom of God has come near to you.’
translation:
  language: hi
  text: और उस नगर में जो बीमार हैं, उन्हें चंगा करो और उनसे कहो, “परमेश्वर का राज्य तुम्हारे निकट आ गया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का राज्य तुम्हारे पास आ पहुँचा है।”
    reason: Ἤγγικεν ἐφ’ ὑμᾶς के आगमन-सूचक भाव को अधिक स्पष्ट करनेवाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: θεραπεύετε
  choice: चंगा करो
  rationale: वर्तमान काल का आज्ञार्थक रूप निरंतर सेवाकार्य का आह्वान करता है। बीमारी के संदर्भ में ‘चंगा करो’ स्वाभाविक और स्पष्ट है; ‘देखभाल करो’ अर्थ में अत्यधिक व्यापक होता।
- source_word: τοὺς ἐν αὐτῇ ἀσθενεῖς
  choice: उस नगर के बीमारों को
  rationale: ἀσθενεῖς का अर्थ ‘निर्बल’ भी हो सकता है, पर θεραπεύετε के साथ यहाँ शारीरिक रूप से बीमार लोग अभिप्रेत हैं। स्त्रीलिंग सर्वनाम αὐτῇ पिछले पद में आए नगर को सूचित करता है, इसलिए हिंदी में उसे स्पष्ट किया गया है।
- source_word: λέγετε αὐτοῖς
  choice: उनसे कहो
  rationale: यह सरल आज्ञार्थक कथन है। हिंदी में संबोधित व्यक्तियों के लिए ‘उनसे कहो’ स्वाभाविक है।
- source_word: Ἤγγικεν
  choice: निकट आ गया है
  rationale: पूर्णकालीन क्रिया किसी निकट आने की घटना और उसके वर्तमान परिणाम—दोनों को व्यक्त करती है। ‘निकट आ गया है’ केवल भावी निकटता कहने के बजाय इस पक्ष को बनाए रखता है।
- source_word: ἐφ’ ὑμᾶς
  choice: तुम्हारे निकट
  rationale: ἐγγίζω के साथ यह पदबंध सुननेवालों के संबंध में राज्य के पास आने को व्यक्त करता है। ‘तुम्हारे निकट’ सहज है और ‘तुम पर’ से उत्पन्न होनेवाली अनावश्यक प्रतिकूल ध्वनि से बचता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह स्थापित, सुबोध बाइबलीय पदबंध है और ‘राज्य’ के व्यापक अर्थ को बनाए रखता है; केवल ‘शासन’ कहना अर्थक्षेत्र को संकुचित कर सकता है।
theological_decisions:
- issue: परमेश्वर के राज्य की निकटता का आशय
  choice: घोषणा बताती है कि परमेश्वर का राज्य सुननेवालों के निकट आ गया है, पर यह निर्धारित नहीं करती कि वह अभी पूर्णतः उपस्थित है या उसकी अंतिम पूर्णता भविष्य में है।
  alternative: राज्य अभी पूरी तरह उपस्थित है; अथवा राज्य केवल निकट भविष्य में आनेवाला है।
  rationale: Ἤγγικεν निकट आने और उसकी वर्तमान प्रासंगिकता को व्यक्त करता है, लेकिन पद स्वयं वर्तमान और भावी पूर्णता के बीच के तनाव का अंतिम समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सीधी आज्ञार्थक शैली रखी गई है। पिछले पद के नगर को हिंदी में स्पष्ट करने के लिए ‘उस नगर’ कहा गया है।
