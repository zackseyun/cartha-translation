source:
  edition: SBLGNT
  text: Ἐν αὐτῇ τῇ ὥρᾳ ἠγαλλιάσατο ⸀τῷ πνεύματι ⸂τῷ ἁγίῳ⸃ καὶ εἶπεν· Ἐξομολογοῦμαί σοι, πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς, ὅτι ἀπέκρυψας ταῦτα ἀπὸ σοφῶν καὶ συνετῶν, καὶ ἀπεκάλυψας αὐτὰ νηπίοις· ναί, ὁ πατήρ, ὅτι οὕτως ⸂εὐδοκία ἐγένετο⸃ ἔμπροσθέν σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/021.yaml
  text: In that same hour he rejoiced in the Holy Spirit and said[a], “I praise you, Father, Lord of heaven and earth, because you hid these things from the wise and understanding, and revealed them to little children. Yes, Father[c][b], because this was well-pleasing in your sight.”
translation:
  language: hi
  text: उसी घड़ी यीशु पवित्र आत्मा में आनन्दित हुए और कहा, “हे पिता, स्वर्ग और पृथ्वी के प्रभु, मैं आपकी स्तुति करता हूँ[a], क्योंकि आपने इन बातों को ज्ञानियों और समझदारों से छिपाया और छोटे बच्चों[b] को प्रकट किया। हाँ, हे पिता, क्योंकि यही आपकी दृष्टि में भला लगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं आपको धन्यवाद देता हूँ।” यूनानी क्रिया प्रार्थना में स्तुति के साथ धन्यवाद का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “शिशुओं।” यहाँ यह सम्भवतः उन लोगों के लिए रूपक है जो आश्रित, दीन या सामाजिक दृष्टि से साधारण हैं, न कि केवल कम आयु के बच्चों के लिए।
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि ऐसी ही आपकी कृपालु इच्छा थी,” अथवा “क्योंकि यही आपकी प्रसन्नता थी।”
    reason: alternative_reading
lexical_decisions:
- source_word: Ἐν αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: यह यूनानी कालवाचक मुहावरे और उसके बल को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἠγαλλιάσατο
  choice: आनन्दित हुए
  rationale: क्रिया प्रबल आनन्द या हर्ष को दर्शाती है; यह चयन वर्तमान मानक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: τῷ πνεύματι τῷ ἁγίῳ
  choice: पवित्र आत्मा में
  rationale: संज्ञा और विशेषण के साथ निश्चित उपपद पवित्र आत्मा की ओर संकेत करता है। “में” दत्तिव के क्षेत्र या माध्यम—दोनों संभावित भावों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: Ἐξομολογοῦμαί σοι
  choice: मैं आपकी स्तुति करता हूँ
  rationale: पिता से की गई इस प्रार्थना में क्रिया स्तुति और धन्यवाद दोनों का भाव रख सकती है। मुख्य पाठ में “स्तुति” उपासना-संबंधी प्रसंग के अनुकूल है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: πάτερ κύριε τοῦ οὐρανοῦ καὶ τῆς γῆς
  choice: हे पिता, स्वर्ग और पृथ्वी के प्रभु
  rationale: दोनों संबोधनों को बनाए रखते हुए κύριος का सामान्य और धर्मवैज्ञानिक रूप से तटस्थ हिन्दी समतुल्य “प्रभु” रखा गया है।
- source_word: ἀπέκρυψας
  choice: आपने ... छिपा रखा
  rationale: यह परमेश्वर को कर्ता रखते हुए यूनानी सक्रिय क्रिया का सीधा अर्थ देता है; “छिपा रखा” हिन्दी में परिणामी अवस्था को भी सहज रूप से व्यक्त करता है।
- source_word: σοφῶν καὶ συνετῶν
  choice: ज्ञानियों और समझदारों
  rationale: यह युग्म बुद्धिमान और विवेकी समझे जाने वालों को दर्शाता है; चयन शिक्षा या सामाजिक पद को अनावश्यक रूप से नहीं जोड़ता।
- source_word: ἀπεκάλυψας
  choice: प्रकट किया
  rationale: यह “छिपा” के साथ मूल विरोध को बनाए रखता है और प्रकाशन के धर्मवैज्ञानिक भार को भी व्यक्त करता है।
- source_word: νηπίοις
  choice: छोटे बच्चों
  rationale: शब्द का मूल चित्र शिशुओं या छोटे बच्चों का है और यहाँ आश्रित, दीन या साधारण लोगों के लिए रूपक हो सकता है; मुख्य पाठ चित्र को सुरक्षित रखता है।
- source_word: οὕτως εὐδοκία ἐγένετο ἔμπροσθέν σου
  choice: क्योंकि यही आपकी दृष्टि में भला लगा
  rationale: यह वाक्य परमेश्वर की प्रसन्नता या सदिच्छा को व्यक्त करता है और ἔμπροσθέν σου को स्वाभाविक हिन्दी “आपकी दृष्टि में” से सुरक्षित रखता है, बिना उसे केवल पूर्वनिश्चित इच्छा के रूप में सीमित किए।
theological_decisions:
- issue: τῷ πνεύματι τῷ ἁγίῳ का संदर्भ
  choice: पवित्र आत्मा में
  alternative: अपनी आत्मा में / आत्मा से
  rationale: यूनानी निश्चित उपपद-सहित पदबंध स्वाभाविक रूप से पवित्र आत्मा की ओर संकेत करता है। “में” क्षेत्र और माध्यम की सम्भावित अस्पष्टता को बनाए रखता है।
- issue: पिता के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: “प्रभु” दिव्य सार्वभौमिकता का स्वाभाविक हिन्दी पद है और मूल के धार्मिक स्तर को बिना किसी सांप्रदायिक विशेषता के बनाए रखता है।
- issue: परमेश्वर द्वारा छिपाने और प्रकट करने का कथन
  choice: सक्रिय कर्तृत्व को ज्यों का त्यों रखा गया
  alternative: निष्क्रिय या अनुमतिपरक रूप—बातें उनसे छिपी रहीं
  rationale: मूल पाठ में दोनों क्रियाओं का कर्ता पिता है। इसे नरम करके केवल अनुमति या मानवीय प्रतिक्रिया बना देना पाठ के धर्मवैज्ञानिक तनाव को मिटा देता।
- issue: εὐδοκία का भाव
  choice: यही आपकी दृष्टि में भला लगा
  alternative: ऐसी ही आपकी कृपालु इच्छा थी / यही आपकी प्रसन्नता थी
  rationale: मुख्य चयन मूल के ‘भला लगने’ और ‘दृष्टि में’ के भाव को बनाए रखता है। वैकल्पिक अनुवाद सम्भव हैं, पर “कृपालु इच्छा” εὐδοκία को अधिक व्याख्यात्मक ढंग से निश्चित कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक “आप” और गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। “उसी घड़ी,” “प्रभु,” “प्रकट किया” और “आपकी दृष्टि में भला लगा” जैसे पद सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की संरचना और धर्मवैज्ञानिक तनाव को बनाए रखते हैं। स्पष्टता के लिए विषय “यीशु” जोड़ा गया है, क्योंकि पृथक पद के रूप में हिन्दी में केवल “वे” संदर्भ-विहीन लग सकता है।
