lexical_decisions:
- source_word: Ἐν δὲ τῷ πορεύεσθαι αὐτοὺς
  choice: जब वे मार्ग में जा रहे थे
  rationale: ἐν के साथ articular infinitive समकालिक क्रिया बताता है; बहुवचन αὐτούς पूरे यात्रा-दल को सूचित करता है। δέ का हल्का कथात्मक संक्रमण हिन्दी में अलग शब्द जोड़े बिना स्वाभाविक वाक्य-प्रवाह से व्यक्त है।
- source_word: αὐτὸς
  choice: वह
  rationale: यह बलयुक्त एकवचन सर्वनाम बहुवचन यात्रा-दल से मुख्य पात्र को अलग करता है। संदर्भ में ‘वह’ पर्याप्त है; ‘यीशु’ जोड़ना अनावश्यक व्याख्यात्मक विस्तार होता।
- source_word: εἰσῆλθεν εἰς κώμην τινά
  choice: एक गाँव में गया
  rationale: κώμη का सामान्य अर्थ ‘गाँव’ है और τινά की अनिश्चितता ‘एक’ से स्वाभाविक रूप में व्यक्त होती है। हिन्दी में ‘गाँव में गया’ यहाँ ‘प्रवेश किया’ से अधिक सहज है और वही गति व्यक्त करता है।
- source_word: γυνὴ δέ τις ὀνόματι Μάρθα
  choice: वहाँ मार्था नाम की एक स्त्री
  rationale: ὀνόματι Μάρθα का स्वाभाविक हिन्दी रूप ‘मार्था नाम की’ है। δέ नए पात्र को सामने लाता है; ‘वहाँ’ स्थल-संबंध स्पष्ट करता है, जबकि τις की अनिश्चितता ‘एक स्त्री’ में बनी रहती है।
- source_word: ὑπεδέξατο αὐτόν
  choice: ने उसका स्वागत किया
  rationale: ὑποδέχομαι अतिथि के रूप में आदरपूर्वक ग्रहण करने या स्वागत करने का भाव रखता है। ‘स्वागत किया’ इसे स्वाभाविक हिन्दी में व्यक्त करता है; यूनानी पाठ में स्पष्ट न होने के कारण ‘अपने घर में’ मुख्य पाठ में नहीं जोड़ा गया।
