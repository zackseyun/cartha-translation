id: LUK.10.15
reference: Luke 10:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ σύ, Καφαρναούμ, ⸂μὴ ἕως οὐρανοῦ ὑψωθήσῃ⸃; ἕως ⸀τοῦ ᾅδου ⸀καταβιβασθήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/015.yaml
  text: And you[a], Capernaum, will you be exalted to heaven? You will be brought down to Hades.
translation:
  language: hi
  text: और तू, कफरनहूम, क्या तुझे स्वर्ग तक ऊँचा उठाया जाएगा? तुझे अधोलोक[a] तक नीचे उतारा जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृतकों के लोक तक।” यूनानी शब्द “हेडीस” है; यह गेहन्ना (“नरक”) नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Καφαρναούμ
  choice: कफरनहूम
  rationale: स्थान-नाम को हिन्दी बाइबल परंपरा में प्रचलित और मूल यूनानी उच्चारण के निकट रूप में लिप्यंतरित किया गया है।
- source_word: μὴ ... ὑψωθήσῃ
  choice: क्या तुझे ... ऊँचा उठाया जाएगा?
  rationale: μή के साथ प्रश्न नकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है। प्रश्नात्मक रूप मूल की तीक्ष्णता और निहित निषेध दोनों को बनाए रखता है; ‘ऊँचा उठाया’ ὑψόω के ऊर्ध्व और प्रतिष्ठात्मक दोनों भावों को व्यक्त करता है।
- source_word: ἕως οὐρανοῦ
  choice: स्वर्ग तक
  rationale: ἕως और संबंधकारक यहाँ सीमा या विस्तार बताते हैं। ‘स्वर्ग तक’ अधोलोक तक उतरने के साथ मूल के ऊर्ध्व-अधो विरोध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἕως τοῦ ᾅδου
  choice: अधोलोक तक
  rationale: ᾅδης मृतकों के लोक को सूचित करता है और गेहन्ना से भिन्न है। ‘अधोलोक’ हिन्दी में संक्षिप्त और बोधगम्य है; पादटिप्पणी इसके यूनानी अर्थ और ‘नरक’ से भेद को स्पष्ट करती है।
- source_word: καταβιβασθήσῃ
  choice: तुझे ... नीचे उतारा जाएगा
  rationale: यह भविष्यकालीन कर्मवाच्य रूप है और किसी के द्वारा नीचे पहुँचाए जाने का भाव रखता है। यह अनुवाद कर्मवाच्य, नीचे जाने की दिशा और अपमान/न्याय के संकेत को सुरक्षित रखता है।
theological_decisions:
- issue: ᾅδης का अनुवाद
  choice: अधोलोक
  alternative: मृतकों का लोक; हेडीस; नरक
  rationale: ‘अधोलोक’ मुख्य पाठ में पठनीय रहते हुए मृतकों के लोक का संकेत देता है। इसे ‘नरक’ कहना ᾅδης और गेहन्ना के बीच का शब्दगत तथा धर्मवैज्ञानिक भेद मिटा सकता है; इसलिए उस भेद को पादटिप्पणी में स्पष्ट किया गया है।
- issue: μή वाले प्रश्न का बल
  choice: नकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न
  alternative: तुझे स्वर्ग तक ऊँचा नहीं उठाया जाएगा
  rationale: स्पष्ट निषेध अर्थ की व्याख्या तो सही कर सकता है, पर यूनानी के प्रश्नात्मक रूप और उसकी आलंकारिक धार को हटा देता है। प्रश्न को बनाए रखने से मूल की वास्तविक अभिव्यक्ति सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। नगर को एक व्यक्ति की तरह संबोधित करने के कारण एकवचन ‘तू/तुझे’ रखा गया है। ‘स्वर्ग तक’ और ‘अधोलोक तक’ मूल के ऊर्ध्व-अधो विरोध को स्पष्ट करते हैं।
