id: LUK.10.5
reference: Luke 10:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰς ἣν δ’ ἂν ⸂εἰσέλθητε οἰκίαν⸃ πρῶτον λέγετε· Εἰρήνη τῷ οἴκῳ τούτῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/005.yaml
  text: Into whatever house you enter[a], first say, ‘Peace to this house.’
translation:
  language: hi
  text: जिस किसी घर में तुम प्रवेश करो, पहले कहो, “इस घर पर शांति हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस घर को शांति मिले।” यूनानी में यह एक संक्षिप्त आशीर्वचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν … οἰκίαν
  choice: जिस किसी घर में
  rationale: εἰς के दिशात्मक भाव और ἄν सहित अनिश्चित संबंधवाचक रचना को स्वाभाविक हिन्दी में व्यक्त करता है; ‘जिस किसी’ हर संभावित घर को सम्मिलित करता है।
- source_word: εἰσέλθητε
  choice: तुम प्रवेश करो
  rationale: अओरिस्ट सब्जंक्टिव यहाँ सामान्य, भावी संभावना व्यक्त करता है। ‘प्रवेश करो’ क्रिया को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: πρῶτον λέγετε
  choice: पहले कहो
  rationale: πρῶτον क्रम में प्राथमिकता बताता है और λέγετε निर्देश के रूप में बोला जाने वाला वचन है।
- source_word: Εἰρήνη τῷ οἴκῳ τούτῳ
  choice: इस घर पर शांति हो
  rationale: यह संक्षिप्त अभिवादन और आशीर्वचन है। ‘पर’ घर को शांति के प्राप्तकर्ता/विषय के रूप में रखता है, जबकि ‘हो’ हिन्दी में सूत्र को पूर्ण और स्वाभाविक बनाता है।
theological_decisions:
- issue: शांति-वचन का स्वरूप
  choice: 'इसे बोले जाने वाले आशीर्वचन के रूप में रखना: ‘इस घर पर शांति हो।’'
  alternative: ‘इस घर को शांति मिले’ अथवा अधिक शाब्दिक, किंतु हिन्दी में अधूरा-सा, ‘इस घर को शांति।’
  rationale: यूनानी वाक्य एक संक्षिप्त सामी अभिवादन/आशीर्वचन को सुरक्षित रखता है। चुना हुआ रूप इसे केवल साधारण नमस्कार में नहीं बदलता और न कोई अतिरिक्त सांप्रदायिक या धर्मविधिक अर्थ जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘जिस किसी’ मूल की अनिश्चित व्यापकता को और ‘इस घर पर शांति हो’ संक्षिप्त आशीर्वचन के भाव को बनाए रखता है।
