  text: καὶ τῇδε ἦν ἀδελφὴ καλουμένη ⸀Μαριάμ, ἣ καὶ ⸂παρακαθεσθεῖσα πρὸς⸃ τοὺς πόδας τοῦ ⸀Ἰησοῦ ἤκουεν τὸν λόγον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/039.yaml
  text: And she had a sister called Mary[a], who also sat at Jesus’ feet and was listening to his word.
translation:
  language: hi
  text: और उसकी एक बहन थी, जिसका नाम मरियम था। वह यीशु[a] के चरणों के पास बैठकर उनका वचन सुन रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में “यीशु” के स्थान पर “प्रभु” है।
    reason: textual_variant
lexical_decisions:
- source_word: τῇδε
  choice: उसकी
  rationale: यह स्त्रीलिंग संकेतवाचक रूप पिछले पद की मार्था की ओर संकेत करता है; हिन्दी में संबंधसूचक ‘उसकी’ स्वाभाविक रूप से बहन का परिचय देता है।
- source_word: ἀδελφὴ
  choice: बहन
  rationale: यह सीधा और स्वाभाविक संबंधसूचक अनुवाद है।
- source_word: καλουμένη Μαριάμ
  choice: जिसका नाम मरियम था
  rationale: नाम का परिचय देने वाले कृदंत को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: παρακαθεσθεῖσα πρὸς τοὺς πόδας
  choice: चरणों के पास बैठकर
  rationale: बैठने की स्थिति और पैरों के निकट होने का अर्थ सुरक्षित रखता है; ‘चरणों’ से आदर और शिष्य की मुद्रा स्वाभाविक रूप से व्यक्त होती है।
- source_word: τοῦ Ἰησοῦ
  choice: यीशु के
  rationale: दिए गए SBLGNT पाठ में स्पष्ट रूप से Ἰησοῦ है, इसलिए मुख्य पाठ में व्यक्तिगत नाम रखा गया है।
- source_word: ἤκουεν
  choice: सुन रही थी
  rationale: अपूर्ण भूतकाल की जारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸν λόγον αὐτοῦ
  choice: उनका वचन
  rationale: λόγος की व्यापकता को बनाए रखता है और इसे केवल ‘शिक्षा’ या ‘संदेश’ तक सीमित नहीं करता; आदरसूचक सर्वनाम आधुनिक मानक हिन्दी के अनुरूप है।
theological_decisions:
- issue: ‘के चरणों’ से पहले नाम या उपाधि का पाठ
  choice: यीशु
  alternative: प्रभु
  rationale: प्रस्तुत मूल-पाठ SBLGNT में τοῦ Ἰησοῦ (‘यीशु के’) है। अर्थपूर्ण वैकल्पिक पांडुलिपि-पाठ ‘प्रभु’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। वाक्य को हिन्दी की स्वाभाविक लय के लिए दो वाक्यों में रखा गया है; ‘चरणों’ और आदरसूचक ‘उनका’ से प्रसंगानुकूल सम्मान व्यक्त होता है।
