base_translation:
  language: en
  yaml_path: translation/nt/luke/010/030.yaml
  text: Jesus replied, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who also stripped him, beat him, and went away, leaving him half dead.”
translation:
  language: hi
  text: यीशु ने उत्तर दिया, “एक मनुष्य यरूशलेम से यरीहो की ओर नीचे जा रहा था। रास्ते में वह लुटेरों के हाथ पड़ गया। उन्होंने उसके कपड़े भी उतार लिए, उसे मारा-पीटा और अधमरा छोड़कर चले गए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπολαβὼν δὲ
  choice: ने उत्तर दिया
  rationale: यहाँ क्रिया का अर्थ बातचीत के क्रम में उत्तर देना है; सरल हिंदी में कर्ता के साथ यही स्वाभाविक है।
- source_word: κατέβαινεν
  choice: जा रहा था
  rationale: यरूशलेम से यरीहो की ओर उतरने का भौगोलिक भाव संदर्भ में निहित है; आधुनिक हिंदी में केवल ‘नीचे जा रहा था’ अस्वाभाविक लग सकता है।
- source_word: λῃσταῖς περιέπεσεν
  choice: लुटेरों के हाथ पड़ गया
  rationale: यह स्वाभाविक हिंदी मुहावरा अचानक लुटेरों से घिर जाने और उनका शिकार बनने का भाव व्यक्त करता है।
- source_word: ἐκδύσαντες αὐτὸν
  choice: उसके कपड़े उतार लिए
  rationale: क्रिया का सीधा अर्थ उसे निर्वस्त्र करना है; ‘कपड़े लूट लिए’ की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: πληγὰς ἐπιθέντες
  choice: उसे मारा-पीटा
  rationale: शाब्दिक रूप से ‘घाव पहुँचाए’; हिंदी का यह प्रचलित प्रयोग हिंसक प्रहारों को सहजता से व्यक्त करता है।
- source_word: ἡμιθανῆ
  choice: अधमरा
  rationale: यह मूल के ‘आधा मरा हुआ’ भाव का संक्षिप्त, स्वाभाविक और सटीक हिंदी रूप है।
