  register: आधुनिक, सहज और गरिमापूर्ण कथा-शैली रखी गई है। लंबे यूनानी वाक्य को हिंदी की स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। καί की पुनरावृत्ति को हर स्थान पर अलग ‘भी’ से नहीं दर्शाया गया, क्योंकि हिंदी में घटनाओं का क्रम स्वयं उसका संयोजक बल प्रकट करता है।
