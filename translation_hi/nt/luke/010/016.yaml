  yaml_path: translation/nt/luke/010/016.yaml
  text: The one who hears you hears me[a], and the one who rejects you rejects me; but the one who rejects me rejects the one who sent me.
translation:
  language: hi
  text: जो तुम्हें सुनता है, वह मुझे सुनता है; और जो तुम्हें अस्वीकार करता है[a], वह मुझे अस्वीकार करता है; पर जो मुझे अस्वीकार करता है, वह उसे अस्वीकार करता है जिसने मुझे भेजा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनदेखा करता है’ अथवा ‘दरकिनार करता है’; यूनानी क्रिया ἀθετέω।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁ ἀκούων ὑμῶν
  choice: जो तुम्हारी सुनता है
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त सामान्य रूप से ऐसे किसी भी व्यक्ति को दर्शाता है जो सुनता है। ‘तुम्हारी सुनता है’ व्यक्ति को ही कर्म-संबंध में रखता है और मूल में न आए ‘संदेश’ या ‘बात’ को नहीं जोड़ता।
- source_word: ἐμοῦ ἀκούει
  choice: वह मेरी सुनता है
  rationale: यह पहले खंड की व्यक्तिगत और वाक्यगत समानता बनाए रखता है तथा यीशु और उसके भेजे हुओं के बीच के प्रतिनिधिक संबंध को स्पष्ट रहने देता है।
- source_word: ἀθετέω
  choice: अस्वीकार करता है
  rationale: इस प्रसंग में यह क्रिया किसी व्यक्ति को उसके प्रतिनिधिक अधिकार सहित न मानने या ठुकराने का भाव रखती है। ‘अस्वीकार करता है’ तीनों प्रयोगों में स्वाभाविक ढंग से दोहराया जा सकता है और यूनानी की आलंकारिक पुनरावृत्ति बचाता है।
- source_word: ὑμᾶς / ἐμέ
  choice: तुम्हें / मुझे
  rationale: मूल पाठ व्यक्तियों को प्रत्यक्ष कर्म बनाता है; इसलिए ‘तुम्हारे संदेश’ या ‘मेरी शिक्षा’ जैसे अर्थ-विस्तार नहीं जोड़े गए।
- source_word: δὲ
  choice: पर
  rationale: यह अंतिम, चरम खंड की ओर हल्का विरोध अथवा प्रगति दिखाता है; ‘पर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τὸν ἀποστείλαντά με
  choice: उसे ... जिसने मुझे भेजा है
  rationale: संज्ञा के रूप में प्रयुक्त कृदन्त का यह स्वाभाविक हिन्दी रूप है। इससे भेजने वाले का व्यक्तिगत उल्लेख बना रहता है, पर मूल से आगे बढ़कर ‘पिता’ नहीं जोड़ा जाता।
theological_decisions:
- issue: यीशु और उसके भेजे हुए शिष्यों के बीच प्रतिनिधिक पहचान
  choice: 'व्यक्तिगत क्रम को सीधे रखा गया है: शिष्यों की सुनना यीशु की सुनना है, और उन्हें अस्वीकार करना यीशु को अस्वीकार करना है।'
  alternative: इसे केवल शिष्यों के संदेश या शिक्षा को सुनने अथवा अस्वीकार करने के रूप में कहना।
  rationale: यूनानी पाठ अमूर्त ‘संदेश’ या ‘शिक्षा’ के बजाय ‘तुम्हें’ और ‘मुझे’ जैसे व्यक्तिगत सर्वनामों का प्रयोग करता है।
- issue: ‘जिसने मुझे भेजा है’ का संदर्भ
  choice: संदर्भ को मूल की तरह अप्रकट रखा गया है।
  alternative: ‘पिता, जिसने मुझे भेजा है’ या ‘परमेश्वर, जिसने मुझे भेजा है’ कहना।
  rationale: प्रसंग में संकेत पिता परमेश्वर की ओर है, किन्तु इस पद में यूनानी पाठ स्वयं ‘पिता’ या ‘परमेश्वर’ नहीं कहता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जो ... वह ...’ की संरचना यूनानी के प्रतिनिधिक एकवचन और तीन चरणों वाले कथन की लय को बचाती है।
