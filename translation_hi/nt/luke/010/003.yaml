  text: ὑπάγετε· ⸀ἰδοὺ ἀποστέλλω ὑμᾶς ὡς ἄρνας ἐν μέσῳ λύκων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/003.yaml
  text: Go[a]; behold[b], I am sending you out as lambs in the midst of wolves.
translation:
  language: hi
  text: जाओ! देखो, मैं तुम्हें भेड़ियों के बीच मेमनों[a] के समान भेज रहा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में यहाँ विशेष रूप से ‘मेमने’ कहा गया है, सामान्यतः ‘भेड़ें’ नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὑπάγετε
  choice: जाओ
  rationale: द्वितीय पुरुष बहुवचन वर्तमान आज्ञार्थक रूप है। मिशन पर भेजने की संक्षिप्त आज्ञा के लिए ‘जाओ’ स्वाभाविक और सटीक है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह आगे कही जाने वाली गंभीर बात की ओर ध्यान खींचने वाला अव्यय है। ‘देखो’ आधुनिक हिन्दी में इसका सहज और गरिमापूर्ण रूप है।
- source_word: ἀποστέλλω ὑμᾶς
  choice: मैं तुम्हें ... भेज रहा हूँ
  rationale: वर्तमानकालीन क्रिया और बहुवचन कर्मवाचक सर्वनाम को स्वाभाविक हिन्दी में व्यक्त करता है। सन्दर्भ से ‘तुम्हें’ का बहुवचन स्पष्ट है; ‘बाहर’ जोड़ना आवश्यक नहीं।
- source_word: ὡς
  choice: के समान
  rationale: यह पहचान नहीं, उपमा प्रकट करता है। ‘के समान’ मूल तुलना को स्पष्ट और औपचारिक-स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἄρνας
  choice: मेमनों
  rationale: ἀρήν का अर्थ विशेष रूप से ‘मेमना’ है, सामान्यतः ‘भेड़’ नहीं। यह शिष्यों की असुरक्षा और निर्बलता के चित्र को सुरक्षित रखता है।
- source_word: ἐν μέσῳ λύκων
  choice: भेड़ियों के बीच
  rationale: वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप है, जो चारों ओर उपस्थित खतरे के चित्र को बनाए रखता है।
theological_decisions:
- issue: शिष्यों के मिशन के लिए पशु-उपमा
  choice: ‘भेड़ियों के बीच मेमनों के समान’
  alternative: ‘भेड़ियों के बीच भेड़ों के समान’
  rationale: यूनानी पाठ में ἄρνας अर्थात ‘मेमने’ है, न कि सामान्य शब्द ‘भेड़ें’। इसलिए समानान्तर या परिचित अनुवादों से सामंजस्य बैठाने के बजाय मूल पाठ में निहित अधिक तीव्र असुरक्षा को रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘देखो’ ने ἰδοὺ की ध्यानाकर्षक शक्ति को रखा है, और ‘मेमनों’ ने मूल यूनानी की विशिष्ट पशु-छवि को सुरक्षित रखा है।
