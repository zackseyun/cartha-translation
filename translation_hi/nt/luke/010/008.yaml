review_pass:
  verdict: revise
  source_fidelity: The indefinite construction and imperative are conveyed accurately. However, in this hospitality context δέχωνται is more naturally and specifically rendered as ‘तुम्हारा स्वागत करें’; ‘तुम्हें स्वीकार करें’ can suggest personal approval or acceptance rather than receiving travellers. ‘तुम्हारे सामने रखा जाए’ closely retains the passive, meal-context sense of παρατιθέμενα without adding more than the Greek states.
  naturalness: The draft is generally clear and modern, but ‘वहाँ के लोग तुम्हें स्वीकार करें’ is less idiomatic in this context. The revision is smoother Hindi while retaining a dignified register.
  terminology: ‘नगर,’ ‘प्रवेश करो,’ and ‘खाओ’ are appropriate. A lexical-alternative footnote preserves the broader literal possibility of δέχομαι (‘स्वीकार करना’).
  issues:
  - severity: medium
    issue: ‘तुम्हें स्वीकार करें’ is potentially misleading for δέχωνται in context.
    rationale: The instruction concerns reception in a city and the food offered to travelling disciples. Modern Hindi ‘स्वीकार करना’ commonly denotes acceptance/approval, whereas ‘स्वागत करना’ naturally conveys hospitable reception. A note can preserve the lexical alternative.
  revised_text: और जिस किसी नगर में तुम प्रवेश करो और वहाँ के लोग तुम्हारा स्वागत करें[a], तो जो कुछ तुम्हारे सामने रखा जाए, उसे खाओ।
  revised_footnotes:
