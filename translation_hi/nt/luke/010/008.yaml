lexical_decisions:
- source_word: εἰς ἣν ἂν πόλιν
  choice: जिस किसी नगर में
  rationale: सापेक्ष सर्वनाम के साथ ἄν अनिश्चित और सामान्य अर्थ देता है। हिंदी में ‘जिस किसी नगर में’ ‘whatever city’ के भाव को स्वाभाविक रूप से व्यक्त करता है; ‘में’ प्रवेश की दिशा को क्रिया के साथ स्पष्ट करता है।
- source_word: εἰσέρχησθε
  choice: तुम प्रवेश करो
  rationale: वर्तमान संभावनार्थक रूप सामान्य परिस्थिति को दर्शाता है। ‘प्रवेश करो’ आधुनिक, स्पष्ट और नगर में भीतर जाने की गति के अनुरूप है।
- source_word: δέχωνται ὑμᾶς
  choice: वहाँ के लोग तुम्हें स्वीकार करें
  rationale: δέχομαι का अर्थ ग्रहण करना या स्वागत करना हो सकता है। ‘स्वीकार करें’ मूल की व्यापकता बनाए रखता है, जबकि निहित बहुवचन कर्ता को हिंदी में ‘वहाँ के लोग’ कहकर स्पष्ट किया गया है।
- source_word: ἐσθίετε
  choice: उसे खाओ
  rationale: वर्तमान आज्ञार्थक यहाँ सीधा निर्देश देता है। ‘खाओ’ स्वाभाविक हिंदी आज्ञा है; ‘उसे’ पहले आए भोजन-संबंधी वाक्यांश से जुड़ता है।
- source_word: τὰ παρατιθέμενα ὑμῖν
  choice: जो कुछ तुम्हारे सामने परोसा जाए
  rationale: παρατίθημι भोजन के प्रसंग में सामने रखने या परोसने को दर्शाता है। ‘परोसा जाए’ हिंदी में स्वाभाविक है और कर्मवाच्य भाव बनाए रखता है; ‘जो कुछ’ नपुंसक बहुवचन के समष्टिगत अर्थ को व्यक्त करता है।
