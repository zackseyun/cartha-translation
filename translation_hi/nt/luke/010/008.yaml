  register: भाषा आधुनिक मानक हिंदी की, सहज और गरिमापूर्ण रखी गई है। ‘स्वीकार करें’ को ‘स्वागत करें’ पर प्राथमिकता देकर δέχομαι की व्यापक शाब्दिक संभावना सुरक्षित रखी गई है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि चुने हुए हिंदी पद मूल अर्थ को पर्याप्त रूप से व्यक्त करते हैं।
