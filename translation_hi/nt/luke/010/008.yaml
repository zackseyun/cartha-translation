  yaml_path: translation/nt/luke/010/008.yaml
  text: And into whatever city you enter[a], if they receive you, eat what is set before you[b],
translation:
  language: hi
  text: और जिस किसी नगर में तुम प्रवेश करो और वहाँ के लोग तुम्हारा स्वागत करें[a], तो जो कुछ तुम्हारे सामने रखा जाए, उसे खाओ।
