language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἡ δὲ Μάρθα περιεσπᾶτο περὶ πολλὴν διακονίαν· ἐπιστᾶσα δὲ εἶπεν· Κύριε, οὐ μέλει σοι ὅτι ἡ ἀδελφή μου μόνην με ⸀κατέλειπεν διακονεῖν; ⸀εἰπὲ οὖν αὐτῇ ἵνα μοι συναντιλάβηται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/040.yaml
  text: But Martha was distracted with much serving. And she came up and said[a], “Lord, does it not matter to you that my sister has left me to serve alone? Tell her, then, to help me.”
translation:
  language: hi
  text: पर मार्था बहुत-से सेवा-सत्कार के कामों में उलझी हुई थी। वह पास आकर बोली, “प्रभु, क्या आपको इसकी चिंता नहीं कि मेरी बहन ने सेवा करने के लिए मुझे अकेला छोड़ दिया है? इसलिए उससे कहिए कि वह मेरी सहायता करे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιεσπᾶτο
  choice: उलझी हुई थी
  rationale: अपूर्णकाल निरंतर स्थिति दिखाता है, और क्रिया का भाव अनेक कामों में खिंचकर ध्यान बँटने का है। ‘उलझी हुई थी’ आधुनिक और स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: περὶ πολλὴν διακονίαν
  choice: बहुत सेवा करने में
  rationale: घरेलू प्रसंग में διακονία व्यावहारिक सेवा-सत्कार को दर्शाता है, औपचारिक सेवकाई को नहीं। यह अनुवाद क्रिया की व्यापकता बनाए रखता है और इसे केवल भोजन की तैयारियों तक सीमित नहीं करता।
- source_word: ἐπιστᾶσα
  choice: वह पास आकर
  rationale: कृदन्त यहाँ बोलने से पहले निकट आने का भाव देता है। ‘पास आकर’ सहज आधुनिक हिन्दी है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु के लिए आदरसूचक संबोधन तथा लूका में κύριος के व्यापक प्रयोग—दोनों को ‘प्रभु’ सुरक्षित रखता है।
- source_word: οὐ μέλει σοι
  choice: क्या आपको इसकी चिंता नहीं
  rationale: यूनानी मुहावरा किसी बात के सरोकार या परवाह का प्रश्न करता है। यह हिन्दी मार्था की शिकायत को स्पष्ट रखती है, बिना उसे अत्यधिक कठोर बनाए।
- source_word: μόνην με κατέλειπεν διακονεῖν
  choice: सेवा करने के लिए मुझे अकेला छोड़ दिया है
  rationale: यह μόνην के ‘अकेला’ और διακονεῖν के ‘सेवा करने’—दोनों भावों को संरक्षित करता है।
- source_word: εἰπὲ οὖν αὐτῇ
  choice: इसलिए उससे कहिए
  rationale: ‘कहिए’ प्रत्यक्ष आज्ञा को सम्मानसूचक हिन्दी में व्यक्त करता है और ‘इसलिए’ οὖν के निष्कर्षसूचक बल को रखता है।
- source_word: συναντιλάβηται
  choice: वह मेरी सहायता करे
  rationale: क्रिया का अर्थ किसी के साथ मिलकर उसका भार सँभालना या सहायता करना है। ‘मेरी सहायता करे’ स्पष्ट और स्वाभाविक है; साझा काम का भाव प्रसंग से मिलता है।
theological_decisions:
- issue: मार्था द्वारा यीशु के लिए κύριος का संबोधन
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानपूर्ण प्रत्यक्ष संबोधन और लूका में यीशु के लिए प्रयुक्त उपाधि की व्यापक धार्मिक प्रतिध्वनि दोनों को बनाए रखता है; प्रसंग इसे केवल घरेलू अर्थ में ‘स्वामी’ तक सीमित करने की माँग नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘सेवा’ को घरेलू आतिथ्य-सत्कार के प्रसंग में रखा गया है, पर यूनानी की अपेक्षा अधिक संकीर्ण ‘बहुत-सी तैयारियाँ’ नहीं किया गया। सम्मानसूचक संबोधन के कारण ‘आपको’ और ‘कहिए’ प्रयुक्त हैं।
