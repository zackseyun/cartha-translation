  text: ἀποκριθεὶς δὲ εἶπεν αὐτῇ ὁ ⸀κύριος· Μάρθα Μάρθα, μεριμνᾷς καὶ ⸀θορυβάζῃ περὶ πολλά,
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/041.yaml
  text: But the Lord answered her[a], “Martha, Martha, you are anxious and troubled about many things,”
translation:
  language: hi
  text: परन्तु प्रभु ने उसे उत्तर दिया, “मार्था, मार्था, तुम बहुत-सी बातों को लेकर चिंता करती और व्याकुल होती हो[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम बहुत-सी बातों को लेकर चिंतित और परेशान हो।”
    reason: μεριμνᾷς और θορυβάζῃ के लिए अधिक बोलचाल की निकटवर्ती शब्दावली देने हेतु।
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ εἶπεν αὐτῇ
  choice: परन्तु प्रभु ने उसे उत्तर दिया
  rationale: ἀποκριθεὶς और εἶπεν का संयोजन यूनानी कथात्मक मुहावरा है; हिन्दी में इसे स्वाभाविक रूप से एक ही क्रिया ‘उत्तर दिया’ में व्यक्त किया गया है। δὲ यहाँ मार्था की बात के प्रत्युत्तर में हल्का विरोध दिखाता है, इसलिए ‘परन्तु’ चुना गया।
- source_word: ὁ κύριος
  choice: प्रभु
  rationale: लूका के वृत्तांत में यह यीशु के लिए आदरपूर्ण और मसीही अर्थ वाला प्रचलित शीर्षक है; ‘स्वामी’ की अपेक्षा ‘प्रभु’ उसके व्यापक अर्थ को बेहतर बनाए रखता है।
- source_word: Μάρθα Μάρθα
  choice: मार्था, मार्था
  rationale: नाम की पुनरावृत्ति को ज्यों का त्यों रखा गया है, क्योंकि इसमें सम्बोधन का जोर और स्नेहपूर्ण गम्भीरता दोनों हैं।
- source_word: μεριμνᾷς
  choice: चिन्ता करती
  rationale: यह क्रिया भीतर की चिन्ता या व्यग्रता व्यक्त करती है। ‘चिन्ता करती’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: θορυβάζῃ
  choice: व्याकुल होती
  rationale: यह शब्द अशान्त, परेशान या भीतर से विचलित होने का भाव देता है। ‘व्याकुल होती’ पहले पद की ‘चिन्ता’ से भिन्न भाव रखते हुए उसकी तीव्रता को व्यक्त करता है।
- source_word: περὶ πολλά
  choice: बहुत-सी बातों को लेकर
  rationale: यह वाक्यांश मार्था की अनेक चिन्ताओं के व्यापक विषय को दर्शाता है। ‘को लेकर’ आधुनिक हिन्दी में स्वाभाविक रूप से περί का सम्बन्ध व्यक्त करता है।
theological_decisions:
- issue: यीशु के लिए κύριος शीर्षक का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ आदरपूर्ण सम्बोधन के साथ लूका में इस शीर्षक की मसीही अनुगूँज भी सुरक्षित रखता है; ‘स्वामी’ यहाँ उसके अर्थ को अपेक्षाकृत सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रत्यक्ष सम्बोधन की पुनरावृत्ति तथा दोनों भावात्मक क्रियाओं के बीच का अन्तर सुरक्षित रखा गया है।
