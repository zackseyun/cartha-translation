id: LUK.10.19
reference: Luke 10:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἰδοὺ ⸀δέδωκα ὑμῖν τὴν ἐξουσίαν τοῦ πατεῖν ἐπάνω ὄφεων καὶ σκορπίων, καὶ ἐπὶ πᾶσαν τὴν δύναμιν τοῦ ἐχθροῦ, καὶ οὐδὲν ὑμᾶς οὐ μὴ ⸀ἀδικήσῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/019.yaml
  text: Behold[a], I have given you the authority to tread on snakes and scorpions, and over all the power of the enemy[b], and nothing will ever harm you.
translation:
  language: hi
  text: देखो, मैंने तुम्हें साँपों और बिच्छुओं पर चलने[a] और शत्रु की सारी सामर्थ्य पर अधिकार दिया है; और कोई भी चीज़ तुम्हें किसी भी तरह हानि नहीं पहुँचाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘साँपों’ का अनुवाद ‘सर्पों’ भी किया जा सकता है। प्रसंग में यह बिंब विरोधी आत्मिक शक्तियों की ओर भी संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘कोई भी चीज़ तुम्हें कभी हानि नहीं पहुँचाएगी’ या ‘तुम्हें किसी भी रीति से हानि नहीं पहुँचाएगी’ भी हो सकता है। यूनानी में यहाँ अत्यंत प्रबल निषेधात्मक रचना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἰδού
  choice: देखो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में ध्यान आकर्षित करने वाले यूनानी उद्गार का बल बनाए रखता है।
- source_word: δέδωκα
  choice: मैंने ... दिया है
  rationale: पूर्ण काल किसी पूरे हो चुके कार्य के वर्तमान प्रभाव को व्यक्त करता है; हिन्दी का पूर्ण वर्तमान इस भाव को स्वाभाविक रूप से रखता है।
- source_word: ἐξουσίαν
  choice: अधिकार
  rationale: यह सौंपे गए अधिकार को व्यक्त करता है और आगे आए δύναμις (‘सामर्थ्य’) से शब्दार्थगत भेद बनाए रखता है।
- source_word: τοῦ πατεῖν
  choice: पैर रखने
  rationale: यह मूल चलने या पाँव रखने की छवि को बिना अनावश्यक रूप से ‘कुचलने’ का तीखा भाव जोड़े सुरक्षित रखता है।
- source_word: ἐπάνω ὄφεων καὶ σκορπίων
  choice: साँपों और बिच्छुओं पर
  rationale: यह स्थान-संबंधी छवि का स्पष्ट और आधुनिक हिन्दी रूप है।
- source_word: ἐπὶ πᾶσαν τὴν δύναμιν
  choice: सारी सामर्थ्य पर
  rationale: यह शत्रु की समस्त शक्ति पर प्राप्त प्रभुत्व या अधिकार का भाव व्यक्त करता है।
- source_word: δύναμιν
  choice: सामर्थ्य
  rationale: यह ἐξουσία के लिए प्रयुक्त ‘अधिकार’ से भेद रखते हुए शत्रु की प्रभावी शक्ति को दर्शाता है।
- source_word: τοῦ ἐχθροῦ
  choice: शत्रु
  rationale: मूल पाठ के एकवचन और व्यक्तिवाचक संकेत को बनाए रखता है, पर उसे स्पष्ट रूप से ‘शैतान’ कहकर अधिक निर्धारित नहीं करता।
- source_word: οὐδὲν ... οὐ μὴ ἀδικήσῃ
  choice: कोई भी वस्तु तुम्हें कभी हानि नहीं पहुँचाएगी
  rationale: ‘कोई भी’ और ‘कभी ... नहीं’ मिलकर यूनानी की अत्यंत प्रबल निषेधात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करते हैं।
theological_decisions:
- issue: ‘शत्रु’ का संदर्भ
  choice: मुख्य पाठ में केवल ‘शत्रु’ रखा गया है।
  alternative: ‘शैतान’ या ‘शैतान अर्थात शत्रु’
  rationale: निकटवर्ती प्रसंग शैतानी विरोध की ओर संकेत करता है, पर यूनानी पाठ स्वयं केवल ‘शत्रु’ कहता है; इसलिए अनुवाद उस पहचान को स्पष्ट करके अर्थ को सीमित नहीं करता।
- issue: ‘साँपों और बिच्छुओं’ का शाब्दिक अथवा प्रतीकात्मक अर्थ
  choice: मुख्य पाठ में मूल दृश्यात्मक भाषा ज्यों की त्यों रखी गई है।
  alternative: इसे सीधे दुष्ट आत्मिक शक्तियों के रूपक के रूप में खोलकर लिखना
  rationale: शब्द अपने प्रत्यक्ष अर्थ में साँपों और बिच्छुओं को दर्शाते हैं, जबकि प्रसंग आत्मिक विरोध की ओर भी संकेत कर सकता है। अनुवाद इस व्याख्यात्मक तनाव को खुला रखता है।
- issue: हानि न पहुँचने के आश्वासन का विस्तार
  choice: मूल की प्रबल निषेधात्मक भाषा को बिना व्याख्यात्मक सीमा जोड़े प्रस्तुत किया गया है।
  alternative: इसे केवल आत्मिक या अंतिम हानि तक सीमित करके अनुवाद करना
  rationale: पद स्वयं ऐसी सीमा स्पष्ट नहीं करता; अतः अनुवाद आश्वासन की व्यापक और तनावपूर्ण भाषा को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अधिकार’ और ‘सामर्थ्य’ द्वारा ἐξουσία तथा δύναμις का महत्वपूर्ण भेद सुरक्षित है। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के साथ मुख्य पाठ में दिए गए हैं।
