id: LUK.10.11
reference: Luke 10:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ τὸν κονιορτὸν τὸν κολληθέντα ἡμῖν ἐκ τῆς πόλεως ὑμῶν ⸂εἰς τοὺς πόδας⸃ ἀπομασσόμεθα ὑμῖν· πλὴν τοῦτο γινώσκετε ὅτι ⸀ἤγγικεν ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/011.yaml
  text: 'Even the dust from your city that clung to our feet[a], we wipe off against you[d][c][b]. Nevertheless know this: the kingdom of God has come near.'
translation:
  language: hi
  text: “तुम्हारे नगर की जो धूल हमारे पाँवों से चिपक गई है, उसे भी हम तुम्हारे विरुद्ध पोंछ देते हैं।[a] फिर भी यह जान लो कि परमेश्वर का राज्य निकट आ गया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में भाव है कि उनके नगर की धूल दूतों के पाँवों पर चिपक गई थी। यहाँ प्रयुक्त क्रिया का अधिक विशिष्ट अर्थ ‘पोंछ देना’ है, न कि ‘झाड़ देना’।
    reason: lexical_alternative
  - marker: b
    text: या “निकट आ पहुँचा है।” यूनानी पूर्णकाल ऐसी निकटता बताता है जो आ चुकी है और जिसका महत्व अब भी बना हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κονιορτός
  choice: धूल
  rationale: यह शब्द सामान्य मिट्टी के बजाय विशेष रूप से धूल को दर्शाता है और इस प्रतीकात्मक कार्य की शक्ति बनाए रखता है।
- source_word: κολληθέντα
  choice: चिपक गई है
  rationale: कृदंत किसी वस्तु के लगकर रह जाने का भाव देता है; आधुनिक हिन्दी में धूल के लिए यह स्वाभाविक अभिव्यक्ति है।
- source_word: εἰς τοὺς πόδας
  choice: हमारे पाँवों से
  rationale: यूनानी पदबंध शब्दशः असहज है और इस प्रसंग में पाँवों पर लगी धूल को सूचित करता है। हिन्दी में ‘पाँवों से चिपक गई’ उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀπομασσόμεθα
  choice: पोंछ देते हैं
  rationale: क्रिया का विशिष्ट अर्थ झाड़ने के बजाय पोंछकर हटाना है; इसलिए परंपरागत ‘झाड़ देते हैं’ की अपेक्षा यह स्रोत के अधिक निकट है।
- source_word: ὑμῖν
  choice: तुम्हारे विरुद्ध
  rationale: इस प्रसंग में संप्रदान कारक उस नगर के विरुद्ध गवाही या न्यायसूचक दिशा प्रकट करता है, न कि केवल श्रोताओं के सामने किया गया कार्य।
- source_word: πλήν
  choice: फिर भी
  rationale: यह न्यायसूचक कार्य के बावजूद आगे कही जाने वाली अटल बात पर बल देने वाला स्वाभाविक हिन्दी संयोजक है।
- source_word: γινώσκετε
  choice: यह जान लो
  rationale: वर्तमान आज्ञार्थक यहाँ पहचानने और निश्चित रूप से मान लेने का सीधा आह्वान करता है।
- source_word: ἤγγικεν
  choice: निकट आ गया है
  rationale: पूर्णकाल उस निकटता को व्यक्त करता है जो घटित हो चुकी है और जिसका प्रभाव वर्तमान में बना हुआ है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह मानक, स्पष्ट और धर्मवैज्ञानिक रूप से अनावश्यक व्याख्या से मुक्त हिन्दी रूप है।
theological_decisions:
- issue: धूल पोंछने के कार्य का आशय
  choice: अस्वीकार करने वाले नगर के विरुद्ध गवाही और न्याय का प्रतीकात्मक कार्य
  alternative: केवल यात्रा या स्वच्छता से संबंधित कार्य
  rationale: ὑμῖν और मिशन-वृत्तांत का प्रसंग इस कार्य को विरोधी नगर के विरुद्ध साक्ष्य बनाते हैं; ‘तुम्हारे विरुद्ध’ इस शक्ति को बिना विस्तार के सुरक्षित रखता है।
- issue: परमेश्वर के राज्य की निकटता
  choice: राज्य निकट आ चुका है और उसकी निकटता का वर्तमान महत्व बना हुआ है
  alternative: राज्य केवल भविष्य में शीघ्र आने वाला है, या राज्य की अंतिम पूर्णता पहले ही हो चुकी है
  rationale: ἤγγικεν का पूर्णकाल वास्तविक और स्थायी निकटता बताता है, पर अंतिम परिपूर्णता का दावा नहीं करता; अनुवाद इस युगांतकारी तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पाँवों’ और ‘पोंछ देते हैं’ जैसे सामान्य शब्द स्रोत की ठोस क्रिया को स्पष्ट रखते हैं, जबकि ‘परमेश्वर का राज्य’ स्थापित बाइबलीय पदावली को बनाए रखता है।
