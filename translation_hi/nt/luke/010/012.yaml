  text: I tell you[b][a], it will be more bearable for Sodom on that day than for that city.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, उस दिन उस नगर की अपेक्षा सदोम के लोगों के लिए सहना अधिक आसान होगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधिक सहनीय होगा।” यूनानी तुलनात्मक शब्द का अनुवाद दोनों प्रकार से किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उस दिन” से ईश्वरीय न्याय के दिन का संकेत मिलता है; कुछ समानांतर पद इसे स्पष्ट रूप से कहते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: वर्तमान काल में किया गया सीधा और गंभीर कथन; यह आधुनिक हिन्दी में स्वाभाविक है और प्रत्यक्ष संबोधन बनाए रखता है।
- source_word: Σοδόμοις
  choice: सदोम के लिए
  rationale: यूनानी बहुवचन दत्तिव यहाँ स्थान-नाम के द्वारा वहाँ के लोगों का सामूहिक उल्लेख करता है; हिन्दी में स्थान-नाम को उसी रूप में रखना संक्षिप्त और स्वाभाविक है।
- source_word: ἐν τῇ ἡμέρᾳ ἐκείνῃ
  choice: उस दिन
  rationale: मूल पाठ का सामान्य कालवाचक प्रयोग सुरक्षित रहता है; मुख्य पाठ में ‘न्याय’ जोड़कर आशय को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- source_word: ἀνεκτότερον
  choice: सहना अधिक आसान
  rationale: तुलनात्मक अर्थ ‘अधिक सहनीय’ को साधारण आधुनिक हिन्दी में स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: ἔσται
  choice: होगा
  rationale: भविष्यकाल के ‘होना’ का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἢ τῇ πόλει ἐκείνῃ
  choice: उस नगर की अपेक्षा
  rationale: तुलना और संकेतवाचक पद दोनों को बनाए रखता है तथा पहले संदर्भित नगर की ओर संकेत करता है।
theological_decisions:
- issue: ‘उस दिन’ का स्वरूप
  choice: मुख्य पाठ में केवल ‘उस दिन’ रखा गया।
  alternative: ‘न्याय के दिन’
  rationale: संदर्भ ईश्वरीय न्याय की ओर संकेत करता है, पर इस पद में ‘न्याय’ शब्द स्पष्टतः नहीं है; इसलिए मूल की संक्षिप्तता और निहित तनाव सुरक्षित रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘नगर’ और ‘उस दिन’ जैसे पद मूल की औपचारिक संरचना और आशयगत खुलापन बनाए रखते हैं।
