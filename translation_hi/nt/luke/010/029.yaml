  text: Ὁ δὲ θέλων ⸀δικαιῶσαι ἑαυτὸν εἶπεν πρὸς τὸν Ἰησοῦν· Καὶ τίς ἐστίν μου πλησίον;
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/029.yaml
  text: But he[a], wanting to justify himself, said to Jesus, “And who is my neighbor?”
translation:
  language: hi
  text: पर अपने आप को सही ठहराने की इच्छा रखते हुए उसने यीशु से कहा, “और मेरा पड़ोसी कौन है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θέλων
  choice: इच्छा से
  rationale: वर्तमान कृदन्त व्यक्ति की मंशा बताता है; हिंदी में ‘इच्छा से’ वाक्य को स्वाभाविक रखते हुए उद्देश्य का भाव व्यक्त करता है।
- source_word: δικαιῶσαι ἑαυτὸν
  choice: अपने आपको सही ठहराने
  rationale: यहाँ वाक्यांश का अर्थ स्वयं को ठीक या निर्दोष सिद्ध करना है, न कि पौलुस के पत्रों में मिलने वाले धार्मिक-न्यायिक अर्थ को अनिवार्य रूप से आरोपित करना। ‘सही ठहराने’ मूल क्रिया का संबंध भी बनाए रखता है।
- source_word: εἶπεν πρὸς τὸν Ἰησοῦν
  choice: यीशु से कहा
  rationale: यह सीधा और स्वाभाविक हिंदी कथन-सूत्र है तथा Ἰησοῦς के प्रचलित हिंदी रूप ‘यीशु’ का प्रयोग करता है।
- source_word: Καὶ
  choice: तो
  rationale: संवाद में यह संयोजक पिछले कथन से जुड़ा हुआ अगला प्रश्न प्रस्तुत करता है; हिंदी में ‘तो’ उस प्रवाह को ‘और’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τίς ἐστίν μου πλησίον
  choice: मेरा पड़ोसी कौन है
  rationale: πλησίον यहाँ संज्ञा की तरह प्रयुक्त है और निकटवर्ती व्यवस्था-उद्धरण के कारण ‘पड़ोसी’ उपयुक्त तथा परिचित बाइबलीय शब्द है। सीधा प्रश्न इस बात को खुला रखता है कि वह पहचान पूछ रहा है या पात्रता की सीमा।
theological_decisions:
- issue: δικαιῶσαι ἑαυτόν का आशय
  choice: अपने आपको सही ठहराने का प्रयत्न
  alternative: अपने आपको धार्मिक ठहराना; लोगों के सामने स्वयं को निर्दोष सिद्ध करना
  rationale: तात्कालिक संदर्भ व्यवस्था और नैतिक उत्तरदायित्व पर संवाद का है। अनुवाद आत्म-समर्थन का भाव व्यक्त करता है, पर इसे तकनीकी धार्मिक सिद्धान्त तक सीमित नहीं करता।
- issue: πλησίον के प्रश्न की सीमा
  choice: 'सीधा प्रश्न: ‘मेरा पड़ोसी कौन है?’'
  alternative: ‘किसे मेरा पड़ोसी माना जाए?’
  rationale: सीधा रूप यूनानी की संक्षिप्तता और वास्तविक अस्पष्टता बचाता है; अधिक व्याख्यात्मक विकल्प व्यक्ति की सीमा-निर्धारण वाली मंशा को स्पष्ट कर देता, जिसे कथा स्वयं आगे उजागर करती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। ‘परन्तु’ δέ के विरोधात्मक कथात्मक मोड़ को और ‘तो’ Καὶ के संवादात्मक संबंध को व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं रखी गई, क्योंकि संभावित व्याख्यात्मक विकल्प को मुख्य पाठ में आरोपित करने के बजाय मूल प्रश्न की अस्पष्टता सुरक्षित है।
