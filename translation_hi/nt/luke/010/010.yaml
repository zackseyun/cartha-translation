  text: εἰς ἣν δ’ ἂν πόλιν ⸀εἰσέλθητε καὶ μὴ δέχωνται ὑμᾶς, ἐξελθόντες εἰς τὰς πλατείας αὐτῆς εἴπατε·
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/010.yaml
  text: But whatever city you enter and they do not receive you[a], go out into its streets and say,
translation:
  language: hi
  text: लेकिन जिस किसी नगर में तुम प्रवेश करो और वहाँ के लोग तुम्हें स्वीकार न करें, तो उसकी चौड़ी सड़कों[a] पर निकलकर कहो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सार्वजनिक चौकों।” यूनानी शब्द का अर्थ चौड़ी, खुली सार्वजनिक सड़कें या चौक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰς ἣν δ’ ἂν πόλιν
  choice: लेकिन जिस किसी नगर में
  rationale: ἄν के साथ संबंधवाचक रचना अनिश्चित और सामान्य स्थिति व्यक्त करती है; ‘जिस किसी नगर में’ इस खुले संभाव्य अर्थ को स्वाभाविक हिन्दी में रखता है। δέ का प्रसंगगत विरोध ‘लेकिन’ से व्यक्त हुआ है।
- source_word: εἰσέλθητε
  choice: तुम प्रवेश करो
  rationale: अनिश्चित संबंधवाचक उपवाक्य में आया एओरिस्ट सब्जंक्टिव नगर में प्रवेश करने की संभावित घटना बताता है; ‘प्रवेश करो’ संक्षिप्त और स्पष्ट है।
- source_word: μὴ δέχωνται ὑμᾶς
  choice: वहाँ के लोग तुम्हें स्वीकार न करें
  rationale: δέχομαι यहाँ संदेशवाहकों को ग्रहण करने या उनका स्वागत करने का व्यापक भाव रखता है। ‘स्वीकार’ उस व्यापकता को बनाए रखता है; कर्ता को स्वाभाविक हिन्दी के लिए ‘वहाँ के लोग’ के रूप में स्पष्ट किया गया है।
- source_word: ἐξελθόντες
  choice: निकलकर
  rationale: यह कृदंत मुख्य आज्ञा εἴπατε से पहले की सहगामी क्रिया बताता है। ‘निकलकर ... कहो’ क्रम और आशय दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τὰς πλατείας αὐτῆς
  choice: उसकी चौड़ी सड़कों
  rationale: πλατεῖα खुली, चौड़ी सार्वजनिक सड़क या चौक का बोध करा सकता है। ‘चौड़ी सड़कों’ नगर के सार्वजनिक मार्गों का मूल दृश्य बनाए रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: εἴπατε
  choice: कहो
  rationale: λέγω का एओरिस्ट आज्ञार्थक रूप अगले पद के कथन का परिचय देता है; ‘कहो’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
