reference: Luke 10:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ ἐὰν ⸂ᾖ ἐκεῖ⸃ υἱὸς εἰρήνης, ἐπαναπαήσεται ἐπ’ αὐτὸν ἡ εἰρήνη ὑμῶν· εἰ δὲ μήγε, ἐφ’ ὑμᾶς ἀνακάμψει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/006.yaml
  text: And if a son of peace is there[a], your peace will rest upon him; but if not, it will return to you.
translation:
  language: hi
  text: और यदि वहाँ कोई शान्ति का पुत्र हो[a], तो तुम्हारी शान्ति उस पर ठहर जाएगी; लेकिन यदि न हो, तो वह तुम्हारे पास लौट आएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शान्ति को ग्रहण करने वाला व्यक्ति”—अर्थात ऐसा व्यक्ति जो शान्ति लाने वाले संदेश को स्वीकार करे।
    reason: lexical_alternative
lexical_decisions:
- source_word: υἱὸς εἰρήνης
  choice: शान्ति का पुत्र
  rationale: यह सामी शैली का संबंधसूचक मुहावरा है, जो शान्ति से पहचाने जाने वाले या शान्ति के संदेश को ग्रहण करने वाले व्यक्ति की ओर संकेत करता है। मुख्य पाठ में स्रोत की पुरुषवाची एकवचन अभिव्यक्ति और उसका बिंब सुरक्षित रखा गया है; स्वाभाविक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐπαναπαήσεται
  choice: ठहर जाएगी
  rationale: यह क्रिया किसी पर आकर विश्राम करने या टिक जाने का भाव देती है। स्त्रीलिंग रूप हिन्दी के ‘शान्ति’ के अनुरूप है और मूल बिंब बनाए रखता है।
- source_word: ἡ εἰρήνη ὑμῶν
  choice: तुम्हारी शान्ति
  rationale: प्रत्यक्ष संबंधसूचक रचना को बनाए रखते हुए शिष्यों द्वारा बोले गए शान्ति-अभिवादन अथवा आशीष की ओर संकेत किया गया है, बिना अर्थ को केवल अभिवादन तक सीमित किए।
- source_word: μήγε
  choice: यदि न हो
  rationale: बलयुक्त नकारात्मक शर्त को प्रसंग के अनुसार संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀνακάμψει
  choice: लौट आएगी
  rationale: यह वापस मुड़ने या लौटने का अर्थ देता है। यहाँ शान्ति के वापस आने के बिंब को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐφ’ ὑμᾶς
  choice: तुम्हारे पास
  rationale: मूल पूर्वसर्ग का शाब्दिक अर्थ ‘तुम पर’ हो सकता है, पर ‘लौट आएगी’ के साथ ‘तुम्हारे पास’ स्वाभाविक हिन्दी है और दिशा का आशय स्पष्ट रखता है।
- source_word: καὶ ἐὰν ᾖ ἐκεῖ
  choice: और यदि वहाँ ... हो
  rationale: καί के संयोजक भाव, शर्त और ἐκεῖ के स्थान-सूचक बल—तीनों को बनाए रखता है।
theological_decisions:
- issue: υἱὸς εἰρήνης के पुरुषवाची मुहावरे को तटस्थ बनाया जाए या नहीं
  choice: मुख्य पाठ में ‘शान्ति का पुत्र’ रखा गया
  alternative: ‘शान्ति को ग्रहण करने वाला व्यक्ति’ अथवा ‘शान्तिप्रिय व्यक्ति’
  rationale: यूनानी पाठ पुरुषवाची एकवचन में एक सामी मुहावरा इस्तेमाल करता है। उसका रूप और स्रोत-पाठ का सांस्कृतिक रंग मुख्य पाठ में सुरक्षित रखा गया है, जबकि पादटिप्पणी उसका अधिक स्वाभाविक आशय बताती है। ‘शान्तिप्रिय’ अकेले ग्रहणशीलता के संभव अर्थ को संकुचित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शान्ति का पुत्र’ जानबूझकर स्रोत का मुहावरा सुरक्षित रखता है; उसकी संभावित अस्पष्टता पादटिप्पणी से स्पष्ट की गई है।
