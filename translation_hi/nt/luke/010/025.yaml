  yaml_path: translation/nt/luke/010/025.yaml
  text: And behold[a], a lawyer stood up, testing him, saying, “Teacher, what must I do to inherit eternal life?”
translation:
  language: hi
  text: और देखो, व्यवस्था का एक विशेषज्ञ[a] उसे परखने के लिए उठा और बोला, “गुरु, अनन्त जीवन विरासत में पाने के लिए मैं क्या करूँ?”
  philosophy: optimal-equivalence
  footnotes:
