lexical_decisions:
- source_word: Καὶ ἰδοὺ
  choice: और देखो
  rationale: संयोजक और ध्यान आकर्षित करने वाले कथात्मक संकेत—दोनों को बनाए रखता है; ‘देखो’ दृश्य में आए अचानक मोड़ और सजीवता को व्यक्त करता है।
- source_word: νομικός τις
  choice: व्यवस्था का एक विशेषज्ञ
  rationale: यहाँ νομικός आधुनिक दीवानी वकील नहीं, बल्कि मूसा की व्यवस्था का जानकार है। यह चयन उस ऐतिहासिक अर्थ को सामान्य हिन्दी में सीधे स्पष्ट करता है।
- source_word: ἀνέστη
  choice: उठा
  rationale: क्रिया के सामान्य कथात्मक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκπειράζων αὐτὸν
  choice: उसे परखते हुए
  rationale: प्रश्न पूछने के साथ जारी जाँचने या कसौटी पर रखने की क्रिया को व्यक्त करता है। ‘लुभाते हुए’ पाप के लिए उकसाने का अनुचित अर्थ दे सकता था।
- source_word: λέγων
  choice: बोला
  rationale: यूनानी कृदन्त को हिन्दी के स्वाभाविक कथात्मक प्रवाह के अनुसार मुख्य क्रिया के रूप में व्यक्त किया गया है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में शिक्षक के सम्मानित अर्थ को आधुनिक, सहज हिन्दी में व्यक्त करता है।
- source_word: τί ποιήσας
  choice: मैं क्या करूँ
  rationale: यूनानी कृदन्तीय रचना के साधन या अपेक्षित कार्य के भाव को स्वाभाविक हिन्दी प्रश्न में व्यक्त करता है, बिना उस व्यक्ति की कर्म-केंद्रित प्रश्नावली की धार को मिटाए।
- source_word: ζωὴν αἰώνιον
  choice: अनन्त जीवन
  rationale: अवधि और युग-संबंधी पृष्ठभूमि वाले पद का स्थापित, स्पष्ट और प्रसंगानुकूल हिन्दी रूप है।
- source_word: κληρονομήσω
  choice: विरासत में पाने के लिए
  rationale: ‘विरासत’ मूल यूनानी की उत्तराधिकार-संबंधी उपमा को सुरक्षित रखती है; इसे केवल ‘प्राप्त करना’ कहकर सपाट नहीं किया गया।
theological_decisions:
- issue: दूसरे मन्दिर-कालीन यहूदी प्रसंग में νομικός का अर्थ
  choice: ‘व्यवस्था का विशेषज्ञ’—अर्थात मूसा की व्यवस्था का जानकार
  alternative: वकील; व्यवस्था का विद्वान
  rationale: ‘वकील’ आधुनिक न्यायालय और दीवानी कानून का भ्रम पैदा कर सकता है। चुना हुआ रूप तोराह की व्याख्या में उसकी विशेषज्ञता को स्पष्ट करता है, बिना उसे किसी विशेष धार्मिक दल से जोड़ने के।
- issue: τί ποιήσας ... κληρονομήσω की कर्म और विरासत के बीच तनावपूर्ण रचना
  choice: ‘अनन्त जीवन विरासत में पाने के लिए मैं क्या करूँ?’
  alternative: ‘क्या करके मैं अनन्त जीवन का वारिस होऊँगा?’
  rationale: यह व्यक्ति के प्रश्न में उपस्थित ‘करने’ की धारणा और ‘विरासत’ की उपमा—दोनों को रखता है। अनुवाद इस पद में ही यह तय नहीं करता कि अनन्त जीवन कर्म से अर्जित होता है या अनुग्रह से मिलता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘और देखो’ मूल के कथात्मक ध्यान-संकेत को कुछ औपचारिकता सहित बनाए रखता है। ‘उसे परखते हुए’ उद्देश्य को अत्यधिक स्पष्ट या शत्रुतापूर्ण ठहराए बिना मूल की संभावित जाँचने वाली मंशा को सुरक्षित रखता है।
