id: LUK.10.4
reference: Luke 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: μὴ βαστάζετε βαλλάντιον, μὴ πήραν, ⸀μὴ ὑποδήματα, καὶ μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/004.yaml
  text: Do not carry a money bag[a], a travel bag, or sandals[b], and greet no one along the road.
translation:
  language: hi
  text: पैसों की थैली, यात्रा का झोला[a] या सैंडल साथ मत ले जाना; और रास्ते में किसी का अभिवादन मत करना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यात्रा का झोला’ का अनुवाद ‘सामान का थैला’ भी किया जा सकता है; इसमें यात्रा के लिए भोजन या दूसरी सामग्री रखी जाती थी।
    reason: lexical_alternative
  - marker: b
    text: संभवतः इसका आशय सामान्य शिष्टाचार को पूरी तरह मना करना नहीं, बल्कि उस समय के लंबे, औपचारिक अभिवादनों में रुककर मिशन में देर न करना है। फिर भी मूल पाठ सीधा कहता है, ‘किसी का अभिवादन मत करना।’
    reason: cultural_note
lexical_decisions:
- source_word: βαστάζετε
  choice: साथ मत ले जाना
  rationale: यात्रा-संबंधी इस निर्देश में βαστάζω का अर्थ सामान उठाकर या साथ लेकर चलना है। यह वाक्यांश निषेध को तीनों वस्तुओं पर स्वाभाविक रूप से लागू करता है।
- source_word: βαλλάντιον
  choice: पैसों की थैली
  rationale: यह शब्द धन रखने की थैली को दर्शाता है। आधुनिक हिन्दी में यह अर्थ स्पष्ट है और ‘बटुआ’ की अपेक्षा प्राचीन यात्रा-संदर्भ से अधिक मेल खाता है।
- source_word: πήραν
  choice: यात्रा का झोला
  rationale: πήρα यात्रा में भोजन या अन्य सामग्री रखने के झोले को दर्शाता है। ‘यात्रा का झोला’ उसके उपयोग को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: ὑποδήματα
  choice: सैंडल
  rationale: ὑπόδημα पैरों में पहनी जाने वाली वस्तु को दर्शाता है और प्राचीन भूमध्यसागरीय संदर्भ में प्रायः सैंडल अभिप्रेत हैं। ‘सैंडल’ आधुनिक हिन्दी में स्वाभाविक और ऐतिहासिक दृश्य के अनुरूप है।
- source_word: μηδένα
  choice: किसी का … मत
  rationale: μηδείς यहाँ अभिवादन की क्रिया का कर्म है। हिन्दी की निषेधात्मक रचना ‘किसी का अभिवादन मत करना’ मूल के ‘किसी को नहीं’ वाले अर्थ को सहज रूप देती है।
- source_word: κατὰ τὴν ὁδόν
  choice: रास्ते में
  rationale: यह पदबंध यात्रा करते समय मार्ग में मिलने वालों की ओर संकेत करता है। ‘रास्ते में’ संक्षिप्त, प्राकृतिक और संदर्भानुकूल है।
- source_word: ἀσπάσησθε
  choice: अभिवादन मत करना
  rationale: ἀσπάζομαι का सामान्य अर्थ अभिवादन करना या स्वागत करना है। औपचारिक निषेध को बिना व्याख्यात्मक विस्तार के रखा गया है।
theological_decisions:
- issue: रास्ते में लोगों का अभिवादन न करने के निषेध का आशय
  choice: 'मुख्य पाठ में सीधे निषेध के रूप में रखा गया: ‘किसी का अभिवादन मत करना।’'
  alternative: ‘लंबी बातचीत में समय मत लगाना’ या ‘अभिवादन के कारण मत रुकना।’
  rationale: यूनानी पाठ सीधा निषेध देता है; इसलिए मुख्य पाठ में उसकी तीव्रता को नरम नहीं किया गया। सांस्कृतिक अभिवादन लंबा हो सकता था और मिशन की तात्कालिकता से ध्यान हटा सकता था—यह संभावित आशय पादटिप्पणी में दिया गया है, अनुवाद में आरोपित नहीं किया गया।
- issue: सैंडल न ले जाने के निर्देश का स्वरूप
  choice: ‘सैंडल साथ मत ले जाना,’ अर्थात βαστάζετε के अधीन यात्रा-सामान के रूप में प्रस्तुत किया गया।
  alternative: ‘सैंडल मत पहनना।’
  rationale: मूल क्रिया ‘उठाना/साथ ले जाना’ है, इसलिए पाठ को नंगे पैर यात्रा करने की स्पष्ट आज्ञा में नहीं बदला गया। यह अतिरिक्त सैंडल या यात्रा-सामान न ले जाने की ओर संकेत कर सकता है, पर मूल में यह बात पूर्णतः स्पष्ट नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पैसों की थैली’ और ‘यात्रा का झोला’ सामान्य पाठक के लिए सहज हैं। ‘अभिवादन’ औपचारिक किंतु प्रचलित शब्द है और यूनानी निषेध की संक्षिप्तता बनाए रखता है।
