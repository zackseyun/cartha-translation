  source_fidelity: 'The Hindi text accurately represents the coordinated prohibitions in μὴ βαστάζετε: money bag, travel bag, and sandals are not to be carried/taken along. “रास्ते में किसी का अभिवादन मत करना” faithfully renders μηδένα κατὰ τὴν ὁδὸν ἀσπάσησθε as a direct prohibition without importing an interpretive paraphrase. “साथ मत ले जाना” appropriately reflects the travel-supply sense of βαστάζετε and does not turn the instruction into an explicit command not to wear sandals.'
