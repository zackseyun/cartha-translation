id: LUK.10.17
reference: Luke 10:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὑπέστρεψαν δὲ οἱ ἑβδομήκοντα ⸀δύο μετὰ χαρᾶς λέγοντες· Κύριε, καὶ τὰ δαιμόνια ὑποτάσσεται ἡμῖν ἐν τῷ ὀνόματί σου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/017.yaml
  text: Then the seventy-two returned with joy[a], saying, “Lord, even the demons submit to us in your name.”
translation:
  language: hi
  text: तब वे बहत्तर[a] आनन्द के साथ लौटे और कहने लगे, “प्रभु, आपके नाम से दुष्टात्माएँ भी हमारे अधीन हो जाती हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ हस्तलिपियों में “बहत्तर” के स्थान पर “सत्तर” है।
    reason: textual_variant
lexical_decisions:
- source_word: Ὑπέστρεψαν
  choice: लौटे
  rationale: यह क्रिया उनके मिशन से वापस आने को बताती है; ‘लौटे’ सहज और सटीक हिन्दी है।
- source_word: δὲ
  choice: तब
  rationale: यह कथा में अगले घटनाक्रम की ओर बढ़ने का संकेत देता है; यहाँ ‘तब’ स्वाभाविक है।
- source_word: οἱ ἑβδομήκοντα δύο
  choice: वे बहत्तर
  rationale: मुख्य पाठ SBLGNT के ‘बहत्तर’ पाठांतर का अनुसरण करता है; ‘सत्तर’ को महत्वपूर्ण पाठांतर के रूप में पादटिप्पणी में रखा गया है।
- source_word: μετὰ χαρᾶς
  choice: आनन्द के साथ
  rationale: यह मूल संज्ञात्मक अभिव्यक्ति को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
- source_word: λέγοντες
  choice: और कहने लगे
  rationale: ग्रीक कृदन्त को हिन्दी कथा-शैली में सहज रूप से व्यक्त करता है और लौटने के बाद उनके बोलने से जोड़ता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को संबोधित κύριος का मानक और धर्मवैज्ञानिक रूप से तटस्थ हिन्दी अनुवाद है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ καί आश्चर्य और बल व्यक्त करता है—दुष्टात्माएँ ‘भी’ उनके अधीन होती हैं।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माएँ
  rationale: यह शत्रुतापूर्ण अलौकिक प्राणियों के लिए प्रचलित और साधारण पाठकों को स्पष्ट नया नियमीय हिन्दी पद है।
- source_word: ὑποτάσσεται ἡμῖν
  choice: हमारे अधीन हो जाती हैं
  rationale: यह वर्तमानकालीन अधीनता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह तय किए कि क्रिया को मध्यवाच्य माना जाए या कर्मवाच्य।
- source_word: ἐν τῷ ὀνόματί σου
  choice: आपके नाम से
  rationale: यह यीशु के नाम से जुड़ी सामर्थ्य या अधिकार के माध्यम को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शिष्यों की संख्या से संबंधित पाठांतर
  choice: बहत्तर
  alternative: सत्तर
  rationale: प्रदत्त SBLGNT मूलपाठ ‘बहत्तर’ पढ़ता है। ‘सत्तर’ प्राचीन हस्तलिपियों में पाया जाने वाला महत्वपूर्ण पाठांतर है, इसलिए उसे चुपचाप हटाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। सम्मानसूचक संबोधन ‘आपके’ प्रयुक्त है। पादटिप्पणी-चिह्न को उसी शब्द के बाद रखा गया है जिससे पाठांतर संबंधित है।
