review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the two statements and rightly avoids expanding ζήσῃ to ‘eternal life’ in the main text. However, ‘ऐसा ही करते रहो’ makes the ongoing force of the present imperative more explicit than the Greek requires. The present imperative can carry a customary/continuing nuance, but the concise command should remain open in Hindi as it is in Greek.
  naturalness: ‘उसने उससे कहा’ and ‘तुमने ठीक उत्तर दिया’ are natural modern standard Hindi. ‘यह करो और तुम जीवित रहोगे’ is concise, idiomatic, and preserves the Greek coordination more closely than the conditional ‘तो’.
  terminology: ‘जीवित रहोगे’ is a transparent rendering of ζήσῃ. The contextual reference to ‘अनन्त जीवन’ belongs in the footnote, not in the verse text. No theological terminology needs to be added.
  issues:
  - severity: medium
    issue: The main text over-specifies the aspect of ποίει.
    rationale: ‘करते रहो’ commits the translation to an explicitly continuous command. Although that nuance is possible for a present imperative, it is not obligatory; ‘यह करो’ better preserves the source’s brevity and interpretive openness.
  - severity: low
    issue: ‘तो’ recasts καί as an explicit conditional-result connector.
    rationale: The result relationship is natural in context, but ‘और’ more directly reflects καί and remains fully natural in Hindi.
  revised_text: उसने उससे कहा, “तुमने ठीक उत्तर दिया। यह करो और तुम जीवित रहोगे।”
