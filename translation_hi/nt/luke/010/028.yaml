  to: उसने उससे कहा, “तुमने ठीक उत्तर दिया। यह करो और तुम जीवित रहोगे।”
  rationale: The revision removes an unnecessary explicit durative reading of ποίει and retains the simple Greek coordination. The footnote on the broader context is retained, while the former aspectual-alternative footnote is no longer needed because the main rendering does not overstate the aspect.
