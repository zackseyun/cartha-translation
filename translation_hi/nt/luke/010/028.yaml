base_translation:
  language: en
  yaml_path: translation/nt/luke/010/028.yaml
  text: And he said to him[a], “You have answered correctly. Do this[b], and you will live.”
translation:
  language: hi
  text: उसने उससे कहा, “तुमने ठीक उत्तर दिया। यह करो और तुम जीवित रहोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶπεν δὲ αὐτῷ
  choice: उसने उससे कहा
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; हिन्दी में अलग से ‘और’ या ‘तब’ जोड़ना आवश्यक नहीं। αὐτῷ को स्वाभाविक रूप से ‘उससे’ कहा गया है।
- source_word: Ὀρθῶς ἀπεκρίθης
  choice: तुमने ठीक उत्तर दिया है
  rationale: Ὀρθῶς का अर्थ ‘ठीक/सही ढंग से’ है। अओरिस्ट क्रिया पूर्ण हो चुके उत्तर को बताती है; हिन्दी का पूर्ण पक्ष वर्तमान प्रसंग में उसके मूल्यांकन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: τοῦτο ποίει
  choice: ऐसा ही करते रहो
  rationale: τοῦτο पीछे उद्धृत आज्ञा की ओर संकेत करता है। वर्तमान काल की आज्ञा ποίει निरंतर आचरण का भाव दे सकती है; ‘करते रहो’ उस पहलू को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: καὶ ζήσῃ
  choice: तो तुम जीवित रहोगे
  rationale: आज्ञा के बाद καί परिणाम का भाव देता है, जिसे हिन्दी में ‘तो’ स्वाभाविक रूप से व्यक्त करता है। ζήσῃ का सीधा अर्थ ‘जीवित रहोगे’ है; मुख्य पाठ में ‘अनन्त जीवन पाओगे’ जोड़ना मूल से अधिक स्पष्ट व्याख्या होती।
theological_decisions:
- issue: ζήσῃ के ‘जीवित रहने’ का दायरा
  choice: मुख्य पाठ में ‘तुम जीवित रहोगे’
  alternative: ‘तुम अनन्त जीवन पाओगे’ अथवा ‘तुम अनन्त जीवन के अधिकारी होगे’
  rationale: पद 25 का प्रसंग अनन्त जीवन का है, लेकिन इस वाक्यांश में यूनानी केवल ‘तुम जीवित रहोगे’ कहता है। इसलिए व्यापक संकेत को पाद-टिप्पणी में रखा गया है और मूल की संक्षिप्तता तथा धर्मवैचारिक तनाव सुरक्षित रखा गया है।
- issue: ποίει का पक्षगत बल
  choice: ‘ऐसा ही करते रहो’
  alternative: ‘ऐसा ही करो’
  rationale: वर्तमान आज्ञार्थक रूप निरंतर अभ्यास का भाव दे सकता है। पाद-टिप्पणी संक्षिप्त विकल्प देती है ताकि पक्षगत अर्थ को आवश्यकता से अधिक निश्चित न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ठीक उत्तर दिया है’ सामान्य पाठक के लिए स्वाभाविक है। ‘जीवित रहोगे’ मूल की शब्दावली को बिना धर्मवैचारिक विस्तार के सुरक्षित रखता है।
