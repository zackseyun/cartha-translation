  yaml_path: translation/nt/luke/010/033.yaml
  text: But a Samaritan[a], as he traveled, came to where he was, and when he saw him, he was moved with compassion.
translation:
  language: hi
  text: लेकिन एक सामरी, यात्रा करते हुए, वहाँ पहुँचा जहाँ वह था। उसे देखकर वह करुणा से भर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σαμαρίτης
  choice: एक सामरी
  rationale: स्थापित हिन्दी जातीय-धार्मिक पद है और दृष्टान्त में निहित सामाजिक विरोध को सुरक्षित रखता है।
- source_word: δέ
  choice: परन्तु
  rationale: पिछले पदों के याजक और लेवी के व्यवहार के साथ स्पष्ट विरोध दर्शाता है।
- source_word: τις
  choice: एक
  rationale: अनिश्चितता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘कोई एक’ अनावश्यक रूप से भारी होता।
- source_word: ὁδεύων
  choice: यात्रा करते हुए
  rationale: वर्तमान कृदन्त की पृष्ठभूमिगत, जारी क्रिया को सहज रूप में रखता है।
- source_word: ἦλθεν κατ’ αὐτόν
  choice: उस जगह पहुँचा जहाँ वह पड़ा था
  rationale: घायल व्यक्ति के स्थान तक पहुँचने का प्रसंगगत अर्थ स्पष्ट करता है; ‘पड़ा था’ निकटवर्ती कथा-संदर्भ से स्वाभाविक रूप से निहित है।
- source_word: ἰδών
  choice: उसे देखकर
  rationale: मुख्य क्रिया से पहले देखने की क्रिया को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐσπλαγχνίσθη
  choice: वह करुणा से भर गया
  rationale: क्रिया में निहित गहरी, अंतरंग करुणा की भावात्मक शक्ति को साधारण आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: सामरी की करुणामय प्रतिक्रिया को बाद की नैतिक या सिद्धान्तगत व्याख्या जोड़े बिना व्यक्त करना
  choice: वह करुणा से भर गया
  alternative: उसने उस पर दया की
  rationale: चुना हुआ रूप यूनानी क्रिया की गहरी भावात्मक प्रतिक्रिया को रखता है, पर अनुग्रह, पड़ोसी-प्रेम या किसी अन्य व्याख्यात्मक धारणा को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘सामरी’ स्थापित बाइबलीय पद है। वाक्य में विरोध, यात्रा की पृष्ठभूमि और करुणा की तीव्रता सुरक्षित रखी गई है।
