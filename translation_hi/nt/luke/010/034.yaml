translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ग्रीक कृदन्तों के क्रम को हिन्दी के ‘जाकर’, ‘डालकर’ और ‘बैठाकर’ रूपों से स्वाभाविक बनाया गया है। किसी पशु-विशेष या तेल के प्रकार को मूल से अधिक स्पष्ट नहीं किया गया।
