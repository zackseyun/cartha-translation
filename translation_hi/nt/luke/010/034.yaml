source:
  edition: SBLGNT
  text: καὶ προσελθὼν κατέδησεν τὰ τραύματα αὐτοῦ ἐπιχέων ἔλαιον καὶ οἶνον, ἐπιβιβάσας δὲ αὐτὸν ἐπὶ τὸ ἴδιον κτῆνος ἤγαγεν αὐτὸν εἰς πανδοχεῖον καὶ ἐπεμελήθη αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/034.yaml
  text: And coming near[a], he bound up his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn[b], and took care of him.
translation:
  language: hi
  text: और उसके पास जाकर उसने उसके घावों पर तेल और दाखरस डालते हुए पट्टियाँ बाँधीं। फिर उसे अपने पशु पर बैठाकर एक सराय में ले गया और उसकी देखभाल की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθὼν
  choice: उसके पास जाकर
  rationale: यह क्रिया घायल व्यक्ति की ओर बढ़कर उसके निकट पहुँचने को स्वाभाविक हिन्दी में व्यक्त करती है और कृदन्त का संबंध अगले कार्य से बनाए रखती है।
- source_word: κατέδησεν
  choice: पट्टियाँ बाँधीं
  rationale: घावों को बाँधने के विशेष अर्थ को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: τραύματα
  choice: घावों
  rationale: हमले से लगी शारीरिक चोटों के लिए सटीक और सामान्य हिन्दी शब्द।
- source_word: ἐπιχέων
  choice: डालकर
  rationale: तेल और दाखरस को घावों पर उँडेलने या लगाने की सहवर्ती क्रिया को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: ἔλαιον
  choice: तेल
  rationale: मूल शब्द का सीधा समतुल्य; प्राचीन संदर्भ में जैतून का तेल संभावित है, पर मूल पाठ इसे अलग से निर्दिष्ट नहीं करता।
- source_word: οἶνον
  choice: दाखरस
  rationale: मदिरायुक्त अंगूरी पेय के लिए बाइबलीय हिन्दी में परिचित, गरिमापूर्ण और सटीक शब्द।
- source_word: ἐπιβιβάσας
  choice: बैठाकर
  rationale: घायल मनुष्य को सवारी के पशु पर चढ़ाने की क्रिया को सहज हिन्दी में बताता है।
- source_word: ἴδιον
  choice: अपने
  rationale: व्यक्तिगत स्वामित्व पर मूल के बल को सुरक्षित रखता है।
- source_word: κτῆνος
  choice: पशु
  rationale: भार ढोने या सवारी के काम आने वाले पशु के व्यापक अर्थ को बिना किसी विशिष्ट जाति का अनुमान लगाए व्यक्त करता है।
- source_word: πανδοχεῖον
  choice: सराय
  rationale: यात्रियों के ठहरने के स्थान के लिए संक्षिप्त, प्रचलित और सांस्कृतिक रूप से उपयुक्त शब्द।
- source_word: ἐπεμελήθη
  choice: देखभाल की
  rationale: व्यक्तिगत ध्यान और सेवा के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
