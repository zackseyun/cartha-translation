id: LUK.10.22
reference: Luke 10:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀πάντα μοι παρεδόθη ὑπὸ τοῦ πατρός μου, καὶ οὐδεὶς γινώσκει τίς ἐστιν ὁ υἱὸς εἰ μὴ ὁ πατήρ, καὶ τίς ἐστιν ὁ πατὴρ εἰ μὴ ὁ υἱὸς καὶ ᾧ ⸀ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/022.yaml
  text: All things have been handed over to me by my Father[a], and no one knows who the Son is except the Father[b], and who the Father is except the Son and anyone to whom the Son chooses to reveal him.
translation:
  language: hi
  text: सब कुछ मुझे मेरे पिता ने सौंप दिया है।[a] कोई नहीं जानता कि पुत्र कौन है, केवल पिता; और कोई नहीं जानता कि पिता कौन है, केवल पुत्र और वह व्यक्ति, जिसे पुत्र पिता को प्रकट करना चाहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर एक वस्तु मुझे मेरे पिता ने सौंप दी है।”
    reason: πάντα के व्यापक अर्थ को व्यक्त करने का वैकल्पिक हिन्दी रूप।
  - marker: b
    text: या, “जिसे पुत्र पिता को प्रकट करने की इच्छा करे।”
    reason: βούληται में व्यक्त इच्छा या संकल्प का अधिक औपचारिक वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन का दायरा व्यापक है। ‘सब कुछ’ आधुनिक हिन्दी में स्वाभाविक रहते हुए कथन की समग्रता बनाए रखता है।
- source_word: παρεδόθη
  choice: सौंप दिया है
  rationale: यह παραδίδωμι का अओरिस्ट कर्मवाच्य रूप है। हिन्दी में कर्तृवाच्य रचना अधिक स्वाभाविक है; ‘सौंप दिया है’ पूर्ण हुई क्रिया और उसके वर्तमान परिणाम, दोनों को व्यक्त करता है, बिना ‘उत्तरदायित्व देकर सौंपने’ जैसी संकीर्ण व्याख्या जोड़े।
- source_word: ὑπὸ τοῦ πατρός μου
  choice: मेरे पिता ने
  rationale: ὑπό के साथ संबंधकारक कर्मवाच्य क्रिया के व्यक्तिगत कर्ता को दिखाता है। हिन्दी की स्वाभाविक कर्तृवाच्य रचना में इसे ‘मेरे पिता ने’ कहा गया है।
- source_word: γινώσκει
  choice: जानता
  rationale: मूल क्रिया सामान्यतः ‘जानना’ व्यक्त करती है। प्रसंग में ज्ञान की अद्वितीयता प्रबल है, पर ‘पूरी तरह जानता’ जोड़ना मूल शब्द से आगे जाना होता।
- source_word: τίς ἐστιν ὁ υἱὸς
  choice: पुत्र कौन है
  rationale: यह मूल प्रश्नवाचक संरचना की व्यक्तिगत और संबंधपरक शक्ति को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ὁ υἱός
  choice: पुत्र
  rationale: संदर्भ में यह मसीही उपाधि और पिता-पुत्र संबंध का विशिष्ट पद है; हिन्दी में ‘पुत्र’ इसकी गरिमा और पहचाने हुए संदर्भ को बनाए रखता है।
- source_word: ὁ πατήρ
  choice: पिता
  rationale: यहाँ शब्द विशिष्ट संबंधपरक उपाधि है। ‘पिता’ स्वाभाविक हिन्दी में उसी निश्चित संदर्भ को व्यक्त करता है।
- source_word: ᾧ ἐὰν βούληται ὁ υἱὸς ἀποκαλύψαι
  choice: वह व्यक्ति, जिसे पुत्र पिता को प्रकट करना चाहे
  rationale: यूनानी में प्राप्तकर्ता अनिश्चित है और उसका संबंध पुत्र की इच्छा से है। हिन्दी में स्पष्टता के लिए पिछले खंड से निहित कर्म ‘पिता’ दोहराया गया है; इससे पुत्र की प्रकाशनकारी भूमिका बनी रहती है।
- source_word: βούληται
  choice: चाहे
  rationale: ‘चाहे’ आधुनिक हिन्दी में इच्छा और संकल्प, दोनों को प्रसंगानुसार व्यक्त कर सकता है। इससे पुत्र की निर्णायक भूमिका बनी रहती है, पर कोई व्यवस्थित धर्मवैज्ञानिक अर्थ अतिरिक्त रूप से नहीं जोड़ा जाता।
- source_word: ἀποκαλύψαι
  choice: प्रकट करना
  rationale: ‘प्रकट करना’ दिव्य प्रकाशन के अर्थ और धर्मवैज्ञानिक अनुगूँज को बनाए रखने वाला प्रचलित तथा बोधगम्य हिन्दी पद है।
theological_decisions:
- issue: पिता और पुत्र का परस्पर अद्वितीय ज्ञान
  choice: ‘कोई नहीं जानता… केवल पिता’ और ‘कोई नहीं जानता… केवल पुत्र’ की समानांतर और अनन्य संरचना रखी गई।
  alternative: ‘पूरी तरह जानता’ या ‘वास्तव में जानता’ जैसे व्याख्यात्मक शब्द जोड़ना।
  rationale: पद स्वयं पिता और पुत्र के अद्वितीय पारस्परिक ज्ञान का प्रबल दावा करता है। γινώσκει में निहित से अधिक तीव्र शब्द जोड़ने के बजाय मूल वाक्य-संरचना को उसका धर्मवैज्ञानिक भार वहन करने दिया गया है।
- issue: पुत्र की प्रकाशनकारी इच्छा और अधिकार
  choice: ‘जिसे पुत्र पिता को प्रकट करना चाहे’ कहा गया।
  alternative: ‘इच्छा करे’, ‘चुन ले’, अथवा पुत्र की सक्रिय भूमिका को नरम करने वाली व्याख्यात्मक पुनर्रचना।
  rationale: यूनानी पाठ पिता को प्रकट करने में पुत्र की इच्छा और निर्णायक भूमिका को सामने रखता है। ‘चाहे’ इसे सुरक्षित रखता है, पर चुनाव, अभिलाषा या किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को आवश्यकता से अधिक निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। पहली पंक्ति में स्वाभाविक हिन्दी के लिए यूनानी कर्मवाच्य को कर्तृवाच्य बनाया गया है। दूसरी पंक्ति में पिता और पुत्र के परस्पर ज्ञान की समानांतरता यथासंभव सुरक्षित है। अंतिम खंड में निहित कर्म ‘पिता’ स्पष्ट रूप से दोहराया गया है ताकि हिन्दी में सर्वनाम-संदेह न रहे।
