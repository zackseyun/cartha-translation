  text: Οὐαί σοι, Χοραζίν· οὐαί σοι, Βηθσαϊδά· ὅτι εἰ ἐν Τύρῳ καὶ Σιδῶνι ⸀ἐγενήθησαν αἱ δυνάμεις αἱ γενόμεναι ἐν ὑμῖν, πάλαι ἂν ἐν σάκκῳ καὶ σποδῷ ⸀καθήμενοι μετενόησαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/013.yaml
  text: Woe to you[a], Chorazin! Woe to you, Bethsaida! For if the mighty works that happened among you had happened in Tyre and Sidon, long ago they would have repented[b], sitting in sackcloth and ashes.
translation:
  language: hi
  text: “खोराज़ीन, तुझ पर हाय! बैतसैदा, तुझ पर हाय! क्योंकि यदि सामर्थ्य के वे कार्य[a] जो तुम्हारे बीच हुए, सूर और सीदोन में हुए होते, तो वे बहुत पहले ही टाट ओढ़े और राख में बैठे हुए पश्चाताप कर चुके होते[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चमत्कार”; यूनानी में “सामर्थ्य के कार्य” या “शक्ति के कार्य।”
    reason: lexical_alternative
  - marker: b
    text: या “बहुत पहले ही टाट ओढ़े और राख में बैठे हुए अपनी सोच बदल चुके होते।”
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐαί σοι
  choice: हाय तुम पर
  rationale: यह अभिव्यक्ति भविष्यद्वक्ताओं जैसी चेतावनी, शोक और न्याय-घोषणा—तीनों का बल बनाए रखती है; केवल ‘हाय’ कहने से सीधा संबोधन कम स्पष्ट होता।
- source_word: Χοραζίν / Βηθσαϊδά / Τύρῳ / Σιδῶνι
  choice: खुराजीन / बैतसैदा / सूर / सीदोन
  rationale: ये आधुनिक हिन्दी बाइबल-पाठकों में प्रचलित स्थान-नाम हैं।
- source_word: δυνάμεις
  choice: सामर्थ्य के काम
  rationale: यह यूनानी शब्द के ‘शक्तिशाली कार्य’ के भाव को सुरक्षित रखता है और उसे केवल तकनीकी अर्थ वाले ‘चमत्कार’ तक सीमित नहीं करता।
- source_word: ἐγενήθησαν ... αἱ γενόμεναι
  choice: हुए ... हुए
  rationale: γίνομαι की पुनरावृत्ति और कार्यों के घटित होने का भाव सरल, स्वाभाविक हिन्दी में बना रहता है।
- source_word: ἐν ὑμῖν
  choice: तुम्हारे बीच
  rationale: बहुवचन संबोधन में यह नगरों और उनके निवासियों के बीच कार्यों के घटित होने का स्वाभाविक अर्थ देता है।
- source_word: πάλαι
  choice: बहुत पहले ही
  rationale: यह बीते हुए पर्याप्त समय और प्रतिकल्पित परिणाम के जोर को स्पष्ट करता है।
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: टाट ओढ़े और राख में बैठे हुए
  rationale: यह पश्चाताप और शोक की ठोस प्राचीन छवि को बनाए रखते हुए हिन्दी में स्पष्ट करता है कि टाट वस्त्र के रूप में पहना गया था।
- source_word: καθήμενοι
  choice: बैठे हुए
  rationale: मूल पाठ में दी गई शोक की शारीरिक मुद्रा को अमूर्त किए बिना सुरक्षित रखा गया है।
- source_word: μετενόησαν
  choice: मन फिरा चुके होते
  rationale: लूका के सन्दर्भ में यह सोच, दिशा और आचरण के पश्चातापपूर्ण परिवर्तन को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु की सेवकाई में δυνάμεις का स्वरूप
  choice: सामर्थ्य के काम
  alternative: चमत्कार
  rationale: मूल शब्द असाधारण और सामर्थ्य प्रकट करने वाले कार्यों को सूचित करता है। चुना हुआ अनुवाद कार्य और सामर्थ्य दोनों पहलुओं को बनाए रखता है, बिना शब्द को अपेक्षाकृत संकीर्ण तकनीकी श्रेणी में सीमित किए।
- issue: पश्चाताप की प्रतिकल्पित बात
  choice: ‘मन फिरा चुके होते’ के साथ मूल की प्रतिकल्पित शर्त बनाए रखी गई
  alternative: वे अवश्य मन फिराते
  rationale: εἰ ... ἂν और भूतकालीन क्रियाओं की रचना उस बात को प्रस्तुत करती है जो वास्तव में नहीं हुई, पर दूसरी परिस्थिति में हो चुकी होती; अनुवाद इसे ऐतिहासिक तथ्य या सार्वभौमिक सिद्धान्त नहीं बनाता।
- issue: टाट और राख में बैठने की छवि
  choice: ठोस शोक-मुद्रा को मुख्य पाठ में रखा गया
  alternative: वे गहरा पश्चाताप करते
  rationale: मूल का सहभागी रूप पश्चाताप को दृश्य शोक-चिह्नों के साथ प्रस्तुत करता है; इसे केवल अमूर्त कथन में बदलना पाठ की भविष्यद्वक्तात्मक छवि को घटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के योग्य रखी गई है। ‘हाय तुम पर’ न्याय और शोक के संयुक्त भविष्यद्वक्तात्मक स्वर को बनाए रखता है। ‘टाट’ जैसे बाइबलीय-सांस्कृतिक शब्द को स्पष्ट क्रिया ‘ओढ़े’ के साथ रखा गया है।
