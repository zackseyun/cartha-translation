  yaml_path: translation/nt/luke/010/036.yaml
  text: Which of these three seems to you to have become a neighbor to the man who fell among the robbers?[a]
translation:
  language: hi
  text: तुम्हें इन तीनों में से कौन उस मनुष्य का पड़ोसी बना हुआ लगता है, जो लुटेरों के बीच पड़ गया था?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे विचार में, इन तीनों में से कौन उस मनुष्य का पड़ोसी था जो लुटेरों के बीच पड़ गया था?” यूनानी में अधिक शाब्दिक रूप से, “तुम्हें ... पड़ोसी बना हुआ लगता है,” जो पड़ोसी बनने और वैसा व्यवहार करने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίς τούτων τῶν τριῶν
  choice: इन तीनों में से कौन
  rationale: यह निश्चित तीन व्यक्तियों में से एक के चयन का प्रश्न है। हिन्दी में यह स्वाभाविक रूप से व्यक्त होता है और यूनानी अंशात्मक संबंध को बनाए रखता है।
- source_word: πλησίον
  choice: पड़ोसी
  rationale: यहाँ शब्द संज्ञा के रूप में उस व्यक्ति को बताता है जिसने दूसरे के प्रति पड़ोसी जैसा व्यवहार किया।
- source_word: δοκεῖ σοι
  choice: तुम्हें ऐसा लगता है
  rationale: यह δοκεῖ और σοι दोनों को स्पष्ट रखता है और इसे केवल ‘तुम क्या सोचते हो’ में नहीं बदलता।
- source_word: γεγονέναι
  choice: बना
  rationale: γίνομαι का पूर्ण infinitive केवल स्थिर ‘था’ नहीं, बल्कि पड़ोसी बनने की क्रिया पर बल देता है। हिन्दी में ‘बना’ इस नैतिक उलटाव को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: τοῦ ἐμπεσόντος
  choice: उस मनुष्य का ... जो ... जा पड़ा था
  rationale: संज्ञीकृत कृदंत प्रसंग के घायल व्यक्ति को सूचित करता है; ‘उस मनुष्य’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: εἰς τοὺς λῃστάς
  choice: लुटेरों के बीच जा पड़ा था
  rationale: यूनानी मुहावरे का अर्थ लुटेरों के बीच अथवा उनके वश में पड़ना है। यह अनुवाद मूल चित्र को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: भले सामरी के दृष्टांत में प्रश्न का नैतिक केंद्र
  choice: ‘पड़ोसी बना’
  alternative: ‘पड़ोसी था’
  rationale: ‘बना’ यीशु के प्रश्न को ‘मेरा पड़ोसी कौन है?’ से हटाकर ‘कौन दूसरे का पड़ोसी बना?’ पर केंद्रित रखता है, जैसा γεγονέναι संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में प्रसंगानुसार एकवचन ‘तुम’; भाषा सरल, गरिमापूर्ण और मौखिक प्रश्न के रूप में स्वाभाविक रखी गई है।
