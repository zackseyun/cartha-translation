source:
  edition: SBLGNT
  text: πλὴν ἐν τούτῳ μὴ χαίρετε ὅτι τὰ πνεύματα ὑμῖν ὑποτάσσεται, χαίρετε δὲ ὅτι τὰ ὀνόματα ὑμῶν ⸀ἐγγέγραπται ἐν τοῖς οὐρανοῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/020.yaml
  text: Nevertheless[a], do not rejoice in this, that the spirits submit to you[c][b], but rejoice that your names have been written in the heavens.
translation:
  language: hi
  text: फिर भी, इस बात पर आनन्द मत करो कि आत्माएँ[a] तुम्हारे अधीन हैं[b], बल्कि आनन्द करो कि तुम्हारे नाम स्वर्गों में[c] लिखे हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संदर्भ से विरोधी आत्मिक प्राणी अभिप्रेत हैं; ‘दुष्टात्माएँ’ भी सम्भव है, यद्यपि यूनानी में यहाँ केवल ‘आत्माएँ’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम्हारे वश में हैं।’
    reason: lexical_alternative
  - marker: c
    text: 'अधिक पारंपरिक रूप में, ‘स्वर्ग में।’ यूनानी में बहुवचन है: ‘स्वर्गों में।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: फिर भी
  rationale: यह शिष्यों के पहले के आनन्द पर एक स्पष्ट सुधारात्मक विरोध प्रकट करता है और आधुनिक हिन्दी में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: ἐν τούτῳ
  choice: इस बात पर
  rationale: हिन्दी मुहावरे के अनुसार आनन्द के कारण पर ध्यान केंद्रित करता है और यूनानी संकेतवाचक अभिव्यक्ति को बनाए रखता है।
- source_word: μὴ χαίρετε ... χαίρετε δὲ
  choice: आनन्द मत करो ... बल्कि आनन्द करो
  rationale: दोनों आज्ञाओं में एक ही क्रिया रखकर मूल की शब्द-पुनरावृत्ति और तीखा विरोध सुरक्षित रखा गया है।
- source_word: τὰ πνεύματα
  choice: आत्माएँ
  rationale: संदर्भ में विरोधी आत्मिक प्राणी अभिप्रेत हैं, पर मूल शब्द केवल ‘आत्माएँ’ कहता है; इसलिए मुख्य पाठ में अधिक विशिष्ट ‘दुष्टात्माएँ’ या ‘दुष्टात्मा’ नहीं जोड़ा गया।
- source_word: ὑμῖν ὑποτάσσεται
  choice: तुम्हारे अधीन होती हैं
  rationale: यह वर्तमान काल में उनके शिष्यों के अधिकार के अधीन होने का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὰ ὀνόματα ὑμῶν
  choice: तुम्हारे नाम
  rationale: सम्बन्धवाचक यूनानी रचना का स्वाभाविक हिन्दी रूप।
- source_word: ἐγγέγραπται
  choice: लिखे हुए हैं
  rationale: यूनानी पूर्णकाल के संपन्न कार्य और उसके वर्तमान स्थायी परिणाम—नाम लिखे जा चुके हैं और लिखे हैं—दोनों को व्यक्त करता है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में
  rationale: मूल यूनानी के बहुवचन को जानबूझकर बनाए रखता है; अधिक प्रचलित एकवचन विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: नामों के लिखे होने का स्वर्गीय स्थान
  choice: स्वर्गों में
  alternative: स्वर्ग में
  rationale: οὐρανοῖς बहुवचन है। उसे मुख्य पाठ में सुरक्षित रखा गया है, जबकि हिन्दी की पारंपरिक और अधिक मुहावरेदार एकवचन अभिव्यक्ति को पादटिप्पणी में स्वीकार किया गया है।
- issue: आत्माओं की प्रकृति
  choice: आत्माएँ
  alternative: दुष्टात्माएँ
  rationale: निकटवर्ती संदर्भ विरोधी आत्मिक प्राणियों की ओर संकेत करता है, किन्तु इस पद में πνεύματα अपने आप में अधिक व्यापक शब्द है। अनुवाद संदर्भ को नकारे बिना मूल की शब्दार्थगत व्यापकता बनाए रखता है।
- issue: नाम लिखे जाने का कालगत भाव
  choice: लिखे हुए हैं
  alternative: लिखे गए हैं
  rationale: चुना हुआ रूप पूर्ण हो चुके लेखन और उसके बने रहने वाले परिणाम दोनों को उभारता है, बिना यह निर्धारित किए कि लेखन ठीक कब हुआ।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। ‘आनन्द’ धार्मिक संदर्भ में परिचित है और मूल की दोहरी χαίρετε-पुनरावृत्ति को स्पष्ट रखता है। बहुवचन ‘स्वर्गों’ सामान्य बोलचाल में कम प्रचलित है, पर स्रोत की वास्तविक संख्या को सुरक्षित रखने के लिए चुना गया है और एकवचन विकल्प पादटिप्पणी में दिया गया है।
