source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ. εἶπεν ⸀δὲ αὐτῷ ὁ Ἰησοῦς· Πορεύου καὶ σὺ ποίει ὁμοίως.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/037.yaml
  text: And he said, “The one who showed mercy to him.” Then Jesus said to him, “Go, and you do likewise.”
translation:
  language: hi
  text: उसने कहा, “वही जिसने उस पर दया की।” तब यीशु ने उससे कहा, “जाओ, और तुम भी ऐसा ही करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ποιήσας τὸ ἔλεος μετ’ αὐτοῦ
  choice: वही जिसने उस पर दया की
  rationale: यूनानी मुहावरे ‘उसके साथ दया करना’ का स्वाभाविक आधुनिक हिन्दी रूप; कृपालु कार्य पर बल सुरक्षित रहता है।
- source_word: Πορεύου
  choice: जाओ
  rationale: वर्तमान आज्ञार्थक का सीधा और स्वाभाविक अनुवाद।
- source_word: καὶ σὺ
  choice: और तुम भी
  rationale: स्पष्ट सर्वनाम σὺ के बल को बनाए रखता है और श्रोता को उदाहरण का अनुकरण करने के लिए सीधे संबोधित करता है।
- source_word: ποίει ὁμοίως
  choice: ऐसा ही करो
  rationale: निरंतर/सामान्य आचरण की आज्ञा को सहज हिन्दी में व्यक्त करता है, बिना अनावश्यक व्याख्या जोड़े।
theological_decisions:
- issue: दया करने वाले की पहचान
  choice: ‘वही जिसने उस पर दया की’
  alternative: ‘वह सामरी’
  rationale: उत्तर में व्यक्ति की जातीय पहचान दोहराई नहीं गई; मूल पाठ की परोक्ष अभिव्यक्ति और दया के कार्य पर उसका बल सुरक्षित रखा गया है।
- issue: यीशु की आज्ञा में स्पष्ट ‘तुम’
  choice: ‘और तुम भी ऐसा ही करो’
  alternative: ‘और ऐसा ही करो’
  rationale: यूनानी καὶ σὺ में व्यक्त और बलयुक्त ‘तुम भी’ को हिन्दी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, dignified और मौखिक संवाद के लिए स्वाभाविक। ‘दया की’ सामान्य पाठक के लिए स्पष्ट है और मूल के कार्यप्रधान कथन को बनाए रखता है।
