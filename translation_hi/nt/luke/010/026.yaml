  yaml_path: translation/nt/luke/010/026.yaml
  text: And he said to him[a], “What is written in the Law? How do you read it?”
translation:
  language: hi
  text: तब उसने उससे कहा, “व्यवस्था में क्या लिखा है? तुम उसे कैसे पढ़ते हो?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उसका क्या अर्थ समझते हो?” यूनानी में अधिक शाब्दिक रूप से “तुम उसे कैसे पढ़ते हो?” है; इसमें समझने या अर्थ लगाने का भाव भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁ δὲ
  choice: तब उसने
  rationale: δέ एक हल्का कथात्मक संयोजक है। यहाँ ‘तब’ स्वाभाविक हिन्दी प्रवाह देता है और अनावश्यक विरोध नहीं जोड़ता; लेख का प्रयोग सर्वनामवत होकर कर्ता ‘उसने’ का संकेत करता है।
- source_word: εἶπεν πρὸς αὐτόν
  choice: उससे कहा
  rationale: λέγω के साथ πρός और कर्मकारक सीधे संबोधित व्यक्ति को दर्शाते हैं; ‘उससे कहा’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: Ἐν τῷ νόμῳ
  choice: व्यवस्था में
  rationale: νόμος यहाँ इस्राएल को दी गई मान्य धर्मशास्त्रीय व्यवस्था को सूचित करता है, न कि सामान्य नियम-कानून को। हिन्दी बाइबलीय प्रयोग में ‘व्यवस्था’ इस विशिष्ट अर्थ को स्पष्ट रखती है।
- source_word: τί γέγραπται
  choice: क्या लिखा है
  rationale: पूर्णकालिक कर्मवाच्य γέγραπται लिखे हुए और अब भी प्रमाणस्वरूप विद्यमान पाठ पर बल देता है; ‘क्या लिखा है’ स्वाभाविक हिन्दी में वही भाव रखता है।
- source_word: πῶς
  choice: कैसे
  rationale: πῶς रीति या समझ के विषय में प्रश्न करता है। ‘कैसे’ प्रश्न को खुला रखता है।
- source_word: ἀναγινώσκεις
  choice: पढ़ते हो
  rationale: ἀναγινώσκω का मूल और सामान्य अर्थ ‘पढ़ना’ है। प्रसंग में समझने या अर्थ लगाने की छाया संभव है, पर मुख्य पाठ में ‘पढ़ते हो’ मूल शब्दार्थ और उसकी अर्थगत खुलावट दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: यीशु के प्रश्न में νόμος का आशय
  choice: इस्राएल को दी गई मान्य धर्मशास्त्रीय व्यवस्था के अर्थ में ‘व्यवस्था’
  alternative: ‘तोराह’ अथवा सामान्य अर्थ में ‘कानून’
  rationale: प्रसंग यहूदी व्यवस्था के एक ज्ञाता के साथ संवाद का है। ‘व्यवस्था’ मूल के विशिष्ट धर्मशास्त्रीय संदर्भ को सामान्य नियम-कानून से अलग रखती है, बिना मुख्य पाठ में लिप्यंतरण थोपे।
- issue: πῶς ἀναγινώσκεις की व्याख्यात्मक छाया
  choice: मुख्य पाठ में ‘तुम उसे कैसे पढ़ते हो?’
  alternative: ‘तुम उसका क्या अर्थ समझते हो?’ अथवा ‘तुम उसकी व्याख्या कैसे करते हो?’
  rationale: प्रश्न में पाठ को समझने या उसका अर्थ लगाने का भाव शामिल हो सकता है, किन्तु यूनानी क्रिया प्रत्यक्ष रूप से ‘पढ़ना’ कहती है। शाब्दिक रूप को बनाए रखना कथन की अलंकारिक और धर्मशास्त्रीय खुलावट को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण संवाद। ‘व्यवस्था’ स्थापित बाइबलीय पद है; वाक्यरचना सामान्य पाठक के लिए सरल रखी गई है।
