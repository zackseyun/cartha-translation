  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὁ δὲ ἀποκριθεὶς εἶπεν· Ἀγαπήσεις κύριον τὸν θεόν σου ἐξ ὅλης ⸀τῆς καρδίας σου καὶ ⸂ἐν ὅλῃ τῇ ψυχῇ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ ἰσχύϊ⸃ σου καὶ ⸂ἐν ὅλῃ τῇ διανοίᾳ⸃ σου, καὶ τὸν πλησίον σου ὡς σεαυτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/027.yaml
  text: And he answered, “You shall love the Lord your God from all your heart and with all your soul and with all your strength and with all your mind, and your neighbor as yourself.”
translation:
  language: hi
  text: उसने उत्तर दिया, “तू अपने प्रभु परमेश्वर से अपने सारे हृदय से[a], और अपने सारे प्राण से, और अपनी सारी शक्ति से, और अपनी सारी बुद्धि से प्रेम कर; और अपने पड़ोसी से अपने समान प्रेम कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में पहले पद में ἐξ (‘से/में से’) है, जबकि अगले तीन पदों में ἐν (‘में’) है। हिन्दी में इन चारों पदों का स्वाभाविक अनुवाद ‘से’ होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀποκριθεὶς εἶπεν
  choice: उसने उत्तर दिया
  rationale: यूनानी कृदन्त और समापिका क्रिया के स्वाभाविक हिन्दी कथात्मक संक्षेप को व्यक्त करता है।
- source_word: Ἀγαπήσεις
  choice: प्रेम रखना
  rationale: भावी निर्देशात्मक रूप यहाँ उद्धृत आज्ञा का बल रखता है; हिन्दी में ‘प्रेम रखना’ आज्ञार्थक संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: κύριον τὸν θεόν σου
  choice: अपने प्रभु परमेश्वर
  rationale: κύριος को दिव्य उपाधि ‘प्रभु’ और θεός को ‘परमेश्वर’ के रूप में रखते हुए इस शास्त्रीय उद्धरण का वाचाई स्वर सुरक्षित रहता है।
- source_word: ἐξ ὅλης τῆς καρδίας σου
  choice: अपने सारे हृदय से
  rationale: हिन्दी का ‘हृदय से’ समर्पण के स्रोत और साधन दोनों को स्वाभाविक रूप से व्यक्त करता है; पादटिप्पणी यूनानी ἐξ और बाद के ἐν का अंतर बताती है।
- source_word: ἐν ὅλῃ τῇ ψυχῇ σου
  choice: अपने सारे प्राण से
  rationale: ψυχή के जीवन/अंतरात्मिक स्व के व्यापक भाव को पारंपरिक किन्तु बोधगम्य ‘प्राण’ से व्यक्त किया गया है, बिना कठोर मानवशास्त्रीय विभाजन थोपे।
- source_word: ἐν ὅλῃ τῇ ἰσχύϊ σου
  choice: अपनी सारी शक्ति से
  rationale: ἰσχύς का सीधा और वर्तमान हिन्दी समतुल्य है।
- source_word: ἐν ὅλῃ τῇ διανοίᾳ σου
  choice: अपनी सारी बुद्धि से
  rationale: διάνοια यहाँ सोचने-समझने की क्षमता को दर्शाता है; ‘बुद्धि’ स्वाभाविक और सटीक है।
- source_word: τὸν πλησίον σου ὡς σεαυτόν
  choice: अपने पड़ोसी से अपने समान
  rationale: स्थापित नैतिक-संबंधपरक अर्थ और ὡς की तुलनात्मक शक्ति दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: इस्राएल के परमेश्वर के लिए κύριος का अनुवाद
  choice: प्रभु
  alternative: स्वामी
  rationale: शास्त्रीय उद्धरण में ‘प्रभु’ दिव्य उपाधि और उसका धार्मिक भार सुरक्षित रखता है।
- issue: καρδία, ψυχή, ἰσχύς और διάνοια की चारfold अभिव्यक्ति
  choice: हृदय, प्राण, शक्ति और बुद्धि—चारों को अलग रखना
  alternative: पूरे अस्तित्व जैसे एक संयुक्त पद में समेटना
  rationale: मूल की संचयी वाक्पटुता और पूर्ण समर्पण का भाव सुरक्षित रहता है, पर इन पदों से कोई कठोर मानवशास्त्रीय संरचना निष्कर्षित नहीं की जाती।
- issue: Ἀγαπήσεις का आज्ञात्मक बल
  choice: प्रेम रखना
  alternative: तू प्रेम करेगा
  rationale: यूनानी रूप व्याकरणतः भविष्यत् है, पर उद्धृत व्यवस्था में उसका कार्य आज्ञात्मक है; हिन्दी में शाब्दिक भविष्यत् अनपेक्षित भविष्यवाणी जैसा लग सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण शास्त्रीय-पाठ रजिस्टर अपनाया गया है। उद्धृत आज्ञा के एकवचन संबोधन को बनाए रखने के लिए ‘तू/अपने’ का प्रयोग है। ‘सारे/सारी’ सामान्य पाठकों के लिए ‘समस्त’ की अपेक्षा अधिक सहज है।
