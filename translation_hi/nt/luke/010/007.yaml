  text: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε, ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν, ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ ⸀αὐτοῦ. μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/007.yaml
  text: Stay in that same house[a], eating and drinking what they provide, for the worker is worthy of his wages. Do not move from house to house.
translation:
  language: hi
  text: उसी घर में ठहरे रहो और जो कुछ वे दें, खाओ-पियो, क्योंकि मज़दूर अपनी मज़दूरी का हकदार है[a]। एक घर से दूसरे घर में मत जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मज़दूर अपनी मज़दूरी के योग्य है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐν αὐτῇ δὲ τῇ οἰκίᾳ μένετε
  choice: उसी घर में ठहरे रहो
  rationale: αὐτῇ पहले बताए गए, मेज़बानी स्वीकार करने वाले घर की ओर संकेत करते हुए उसी स्थान पर बने रहने पर बल देता है। वर्तमान काल की आज्ञा μένετε निरंतर वहीं ठहरे रहने का भाव रखती है।
- source_word: ἐσθίοντες καὶ πίνοντες τὰ παρ’ αὐτῶν
  choice: और जो कुछ वे दें, वही खाओ-पियो
  rationale: कृदंत मुख्य आज्ञा के साथ-साथ चलने वाली क्रिया बताते हैं। τὰ παρ’ αὐτῶν का स्वाभाविक अर्थ मेज़बानों द्वारा दी गई खाने-पीने की वस्तुएँ है; अनुवाद निकटवर्ती समानांतर अंशों की अतिरिक्त भाषा नहीं जोड़ता।
- source_word: ἄξιος γὰρ ὁ ἐργάτης τοῦ μισθοῦ αὐτοῦ
  choice: क्योंकि मज़दूर अपनी मज़दूरी पाने का हकदार है
  rationale: ἐργάτης के लिए सामान्य और आधुनिक ‘मज़दूर’ उपयुक्त है। μισθός यहाँ काम के बदले मिलने वाली मज़दूरी है। ‘अपनी’ यूनानी के पुल्लिंग एकवचन αὐτοῦ को हिन्दी में स्वाभाविक रीति से व्यक्त करता है, और ‘हकदार’ ἄξιος का प्रसंगानुकूल अर्थ देता है।
- source_word: μὴ μεταβαίνετε ἐξ οἰκίας εἰς οἰκίαν
  choice: एक घर से दूसरे घर में मत जाओ
  rationale: यह आज्ञा ठहरने का स्थान बार-बार बदलने से रोकती है। हिन्दी में यह अभिव्यक्ति स्पष्ट और स्वाभाविक है तथा मूल के ‘घर से घर’ जाने के भाव को बनाए रखती है।
theological_decisions:
- issue: τοῦ μισθοῦ αὐτοῦ में पुल्लिंग एकवचन संबंध
  choice: मज़दूर अपनी मज़दूरी पाने का हकदार है
  alternative: मज़दूर उनकी मज़दूरी पाने के हकदार हैं
  rationale: यूनानी पाठ में ὁ ἐργάτης और αὐτοῦ दोनों पुल्लिंग एकवचन हैं। कथन सामान्य सिद्धांत व्यक्त करता है, फिर भी अनुवाद उसकी व्याकरणिक एकवचन-पुल्लिंग संरचना को अनावश्यक रूप से बहुवचन या लिंग-निरपेक्ष नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सरल किंतु गरिमापूर्ण है। ‘ठहरे रहो’ निरंतर रहने की आज्ञा को, ‘खाओ-पियो’ सामान्य बोलचाल की सहजता को, और ‘हकदार’ श्रम के उचित प्रतिफल के भाव को स्पष्ट करता है।
