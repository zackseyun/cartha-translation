source:
  edition: SBLGNT
  text: Καὶ στραφεὶς πρὸς τοὺς μαθητὰς κατ’ ἰδίαν εἶπεν· Μακάριοι οἱ ὀφθαλμοὶ οἱ βλέποντες ἃ βλέπετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/023.yaml
  text: And turning to the disciples privately[a], he said, “Blessed are the eyes that see what you see.”
translation:
  language: hi
  text: और चेलों की ओर मुड़कर उसने अलग से[a] कहा, “धन्य हैं वे आँखें जो वही देखती हैं जो तुम देखते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एकांत में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: στραφεὶς
  choice: मुड़कर
  rationale: अओरिस्ट कृदंत यीशु के बोलने से पहले की क्रिया बताता है। ‘मुड़कर’ इस संबंध को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: κατ’ ἰδίαν
  choice: एकांत में
  rationale: यह मुहावरा दूसरों से अलग, निजी रूप से बात करने का भाव देता है। ‘एकांत में’ आधुनिक हिन्दी में स्वाभाविक है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: μαθητάς
  choice: चेलों
  rationale: ‘चेला’ μαθητής के लिए प्रचलित बाइबलीय हिन्दी शब्द है और सीखने तथा अनुसरण करने के संबंध को व्यक्त करता है।
- source_word: Μακάριοι
  choice: धन्य
  rationale: यह केवल भावनात्मक प्रसन्नता नहीं, बल्कि विशेष कृपा और सौभाग्य की घोषणा है; ‘धन्य’ इस आशीर्वचनात्मक बल को बनाए रखता है।
- source_word: ὀφθαλμοὶ
  choice: आँखें
  rationale: यूनानी पाठ का स्पष्ट और सजीव रूपक बनाए रखा गया है, जिसमें आँखें देखने वालों का प्रतिनिधित्व करती हैं।
- source_word: οἱ βλέποντες
  choice: जो ... देखती हैं
  rationale: संज्ञा को विशेषित करने वाले वर्तमान कृदंत को स्वाभाविक हिन्दी संबंधवाचक वाक्यांश में व्यक्त किया गया है।
- source_word: ἃ βλέπετε
  choice: वह सब ... जो तुम देखते हो
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम का व्यापक अर्थ ‘वह सब’ से स्पष्ट होता है, बिना यह निर्धारित किए कि किन घटनाओं या सत्यों की बात है।
theological_decisions:
- issue: आशीर्वचन का बल
  choice: चेलों को मिली विशेष दृष्टि को धन्यता की घोषणा के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल प्रसन्नता या भाग्य का कथन माना जा सकता है।
  rationale: μακάριοι आशीर्वचन-जैसी घोषणा है। ‘धन्य’ ईश्वरीय अनुग्रह और विशेषाधिकार का भार रखता है, पर पाठ से आगे बढ़कर उसका कारण नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘चेलों’ और ‘धन्य’ जैसे परिचित बाइबलीय शब्द मूल के संबंधपरक और आशीर्वचनात्मक अर्थ को बनाए रखते हैं।
