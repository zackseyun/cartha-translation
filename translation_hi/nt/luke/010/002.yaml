  text: ἔλεγεν ⸀δὲ πρὸς αὐτούς· Ὁ μὲν θερισμὸς πολύς, οἱ δὲ ἐργάται ὀλίγοι· δεήθητε οὖν τοῦ κυρίου τοῦ θερισμοῦ ὅπως ⸂ἐργάτας ἐκβάλῃ⸃ εἰς τὸν θερισμὸν αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/002.yaml
  text: And he said to them[a], “The harvest is plentiful, but the workers are few. Therefore pray to the Lord of the harvest that he would send out workers into his harvest.”
translation:
  language: hi
  text: उसने उनसे कहा, “फसल तो बहुत है, पर मज़दूर थोड़े हैं। इसलिए फसल के प्रभु से विनती करो कि वह अपनी फसल में मज़दूर भेजे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाहर भेजे”; यूनानी क्रिया में केवल ‘भेजने’ से अधिक प्रबल भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔλεγεν
  choice: उसने कहा
  rationale: यूनानी अपूर्णकाल यहाँ कथात्मक भूमिका में है; आधुनिक हिन्दी में सामान्य भूतकाल स्वाभाविक है और अर्थ की कोई महत्त्वपूर्ण हानि नहीं करता।
- source_word: δὲ
  choice: अलग शब्द के रूप में अनूदित नहीं
  rationale: यह हल्का कथात्मक संयोजक है। इस एक-पद उद्धरण में हिन्दी का सीधा आरम्भ अधिक स्वाभाविक है; विरोध का भाव आगे μέν…δέ में स्पष्ट किया गया है।
- source_word: Ὁ μὲν θερισμὸς πολύς
  choice: फसल तो बहुत है
  rationale: ‘फसल’ कृषि-रूपक को आधुनिक और सहज हिन्दी में बनाए रखता है; ‘तो’ μέν से आरम्भ होने वाले विरोध को स्वाभाविक रूप देता है।
- source_word: οἱ δὲ ἐργάται ὀλίγοι
  choice: पर मज़दूर थोड़े हैं
  rationale: ‘मज़दूर’ कटाई का काम करने वालों के लिए सामान्य आधुनिक शब्द है, और ‘पर’ यूनानी विरोध को स्पष्ट रखता है।
- source_word: δεήθητε οὖν
  choice: इसलिए … विनती करो
  rationale: δεήθητε आग्रहपूर्ण प्रार्थना या याचना को व्यक्त करता है; ‘विनती करो’ उसकी गंभीरता रखता है, जबकि ‘इसलिए’ οὖν के निष्कर्षसूचक संबंध को दिखाता है।
- source_word: τοῦ κυρίου τοῦ θερισμοῦ
  choice: फसल के प्रभु से
  rationale: ‘प्रभु’ κύριος की अधिकारपूर्ण और सम्भावित धर्मवैज्ञानिक प्रतिध्वनि को बनाए रखता है; ‘फसल के’ स्वामित्व और अधिकार के रूपक को सुरक्षित रखता है।
- source_word: ὅπως ἐργάτας ἐκβάλῃ
  choice: कि वह … मज़दूर भेजे
  rationale: मुख्य पाठ में ‘भेजे’ आधुनिक हिन्दी में स्वाभाविक है। ἐκβάλῃ में साधारण भेजने से अधिक प्रबल भाव हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: εἰς τὸν θερισμὸν αὐτοῦ
  choice: अपनी फसल में
  rationale: यह यूनानी के दिशा-सूचक ‘अपनी फसल में’ और स्वामित्व दोनों को निकटता से रखता है, बिना ‘खेत’ या ‘काटने के लिए’ जैसी अनकही बात जोड़े।
theological_decisions:
- issue: ‘फसल के प्रभु’ का अभिप्रेत व्यक्ति और धर्मवैज्ञानिक आशय
  choice: रूपकात्मक उपाधि ‘फसल के प्रभु’ को बिना व्याख्यात्मक विस्तार के रखा गया।
  alternative: इसे स्पष्ट रूप से ‘परमेश्वर, जो मिशन का स्वामी है’ कहना, या यहाँ यीशु के दिव्य अधिकार का संकेत स्पष्ट करना।
  rationale: पाठ फसल पर अधिकार रखने और मज़दूर भेजने वाले प्रभु को प्रस्तुत करता है, पर इस पद में उसके मसीह-विषयक आशय को स्पष्ट नहीं करता। अनिर्णीत तनाव बनाए रखना अधिक स्रोत-संगत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘फसल’, ‘मज़दूर’ और ‘विनती करो’ कृषि-रूपक तथा आग्रहपूर्ण प्रार्थना—दोनों को स्पष्ट रखते हैं; ‘कटनी’ जैसे अपेक्षाकृत पुराने शब्द से बचा गया है।
