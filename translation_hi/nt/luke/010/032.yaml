  yaml_path: translation/nt/luke/010/032.yaml
  text: Likewise[a], a Levite also came to the place, and when he saw him[b], he passed by on the opposite side.
translation:
  language: hi
  text: इसी प्रकार एक लेवी भी उस स्थान पर आया और उसे देखकर रास्ते की दूसरी ओर से आगे निकल गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पास से आगे निकल गया।” यौगिक क्रिया में विपरीत ओर से गुजरने, और संभवतः जानबूझकर टालने, का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὁμοίως
  choice: इसी प्रकार
  rationale: यह क्रिया को पिछले पद में याजक के व्यवहार के समानांतर रखता है; आधुनिक हिन्दी में तुलना का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: δὲ καὶ
  choice: भी
  rationale: δέ हल्का संयोजक है, जबकि καί लेवी को पिछले उदाहरण के साथ जोड़ता है; हिन्दी में ‘भी’ दोनों के प्रवाह को पर्याप्त रूप से व्यक्त करता है।
- source_word: Λευίτης
  choice: एक लेवी
  rationale: ऐतिहासिक यहूदी धार्मिक-सामाजिक पहचान को सामान्यीकृत किए बिना प्रचलित लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: κατὰ τὸν τόπον ἐλθὼν
  choice: उस स्थान पर आया
  rationale: वाक्यांश संबंधित घटना-स्थल तक पहुँचने को दर्शाता है; ‘उस स्थान पर आया’ प्रसंग-संगत और सहज है।
- source_word: ἰδὼν
  choice: उसे देखकर
  rationale: पूर्ववर्ती घायल व्यक्ति के लिए संदर्भानुसार ‘उसे’ जोड़ा गया है और कृदंत की मुख्य क्रिया से पहले की परिस्थिति सुरक्षित रखी गई है।
- source_word: ἀντιπαρῆλθεν
  choice: सड़क की दूसरी ओर से निकल गया
  rationale: यौगिक क्रिया केवल पास से गुजरने के बजाय विपरीत ओर होकर जानबूझकर बच निकलने का संकेत देती है; ‘सड़क’ तत्काल प्रसंग से स्वाभाविक रूप से स्पष्ट है।
theological_decisions:
- issue: Λευίτης की सामाजिक-धार्मिक पहचान
  choice: लेवी
  alternative: मन्दिर का सेवक / लेवी गोत्र का व्यक्ति
  rationale: मूल पाठ विशिष्ट ऐतिहासिक समूह का नाम देता है। ‘लेवी’ उस विशिष्टता को बनाए रखता है और मुख्य पाठ में अतिरिक्त व्याख्या नहीं जोड़ता।
- issue: ἀντιπαρῆλθεν में टालने की भाव-छाया
  choice: सड़क की दूसरी ओर से निकल गया
  alternative: पास से निकल गया
  rationale: यौगिक क्रिया में विपरीत दिशा से आगे निकलने अथवा बचने का भाव संभव है। मुख्य अनुवाद उस भाव को व्यक्त करता है, जबकि पादटिप्पणी अधिक सामान्य अनुवाद की संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘एक लेवी’ ऐतिहासिक पहचान बनाए रखता है; ‘सड़क की दूसरी ओर से निकल गया’ दृश्य और क्रिया की संभावित टालने वाली भाव-छाया को सामान्य पाठक के लिए स्पष्ट करता है।
