source:
  edition: SBLGNT
  text: καὶ ἐπὶ τὴν ⸀αὔριον ἐκβαλὼν ⸂δύο δηνάρια ἔδωκεν⸃ τῷ πανδοχεῖ καὶ ⸀εἶπεν· Ἐπιμελήθητι αὐτοῦ, καὶ ὅ τι ἂν προσδαπανήσῃς ἐγὼ ἐν τῷ ἐπανέρχεσθαί με ἀποδώσω σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/035.yaml
  text: And on the next day[a], taking out two denarii, he gave them to the innkeeper and said, ‘Take care of him, and whatever more you spend, I will repay you when I return.’
translation:
  language: hi
  text: अगले दिन उसने दो दीनार[a] निकालकर सरायवाले को दिए और कहा, “इसकी देखभाल करना, और इसके अतिरिक्त तुम जो कुछ खर्च करोगे, जब मैं लौटूँगा तब तुम्हारा वह खर्च चुका दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दीनार एक प्रचलित रोमी चाँदी का सिक्का था, जो लगभग एक मजदूर की एक दिन की मजदूरी के बराबर था।
    reason: cultural_note
lexical_decisions:
- source_word: ἐπὶ τὴν αὔριον
  choice: अगले दिन
  rationale: यह यूनानी कालवाचक पद अगले दिन को सूचित करता है; यह रूप आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: ἐκβαλών
  choice: निकालकर
  rationale: यहाँ कृदन्त का अर्थ अपने पास से सिक्के निकालना है; ‘निकालकर’ प्रसंगानुकूल है और मूल क्रिया के अनावश्यक रूप से प्रबल शाब्दिक अर्थ से बचता है।
- source_word: δύο δηνάρια
  choice: दो दीनार
  rationale: मूल पाठ ऐतिहासिक सिक्के का नाम देता है, इसलिए अनुमानित मूल्य ‘दो दिन की मजदूरी’ लिखने के बजाय सिक्के का नाम रखा गया है।
- source_word: πανδοχεῖ
  choice: सरायवाले
  rationale: यह शब्द सराय चलाने या संभालने वाले व्यक्ति को दर्शाता है। ‘सरायवाले’ सामान्य पाठक के लिए सहज है और भवन के बजाय व्यक्ति को स्पष्ट करता है।
- source_word: Ἐπιμελήθητι αὐτοῦ
  choice: इसकी देखभाल करना
  rationale: आज्ञार्थक क्रिया ध्यानपूर्वक सेवा और देखरेख की माँग करती है; यह हिन्दी अभिव्यक्ति उस बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: ὅ τι ἂν προσδαπανήσῃς
  choice: इससे अधिक तुम्हारा जो भी खर्च होगा
  rationale: वाक्यांश दी गई रकम से अतिरिक्त, अनिश्चित मात्रा के खर्च को व्यक्त करता है। ‘इससे अधिक’ προσ- के अतिरिक्तता के भाव को स्पष्ट रखता है।
- source_word: ἐν τῷ ἐπανέρχεσθαί με
  choice: जब मैं लौटूँगा
  rationale: सव्यय क्रियार्थक संज्ञा यहाँ कालवाचक है; हिन्दी का यह उपवाक्य अर्थ को सहजता से व्यक्त करता है।
- source_word: ἀποδώσω σοι
  choice: तुम्हें चुका दूँगा
  rationale: वित्तीय प्रसंग में क्रिया का अर्थ खर्च की रकम वापस देना है; ‘चुका दूँगा’ स्पष्ट, प्रचलित और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में आदरार्थी रूप के बजाय एकवचन निकट संबोधन रखा गया है, जो यूनानी एकवचन और कथा के सामाजिक प्रसंग के अनुरूप है। सांस्कृतिक टिप्पणी से संबंधित [a] चिह्न ‘दीनार’ के बाद रखा गया है।
