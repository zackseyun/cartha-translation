base_translation:
  language: en
  yaml_path: translation/nt/luke/010/014.yaml
  text: But it will be more bearable for Tyre and Sidon in the judgment than for you[a].
translation:
  language: hi
  text: पर न्याय में सोर और सीदोन की दशा तुम्हारी दशा से अधिक सहनीय होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अधिक सहने योग्य होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: πλὴν
  choice: पर
  rationale: यह पिछले कथन के साथ प्रबल विरोध प्रकट करता है; ‘पर’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: Τύρῳ καὶ Σιδῶνι
  choice: सोर और सीदोन की दशा
  rationale: यूनानी सम्प्रदान कारक तुलनात्मक विशेषण के साथ उन नगरों को सूचित करता है जिनके लिए न्याय अधिक सहनीय होगा। हिन्दी में ‘की दशा’ जोड़ने से तुलना स्पष्ट और स्वाभाविक बनती है।
- source_word: ἀνεκτότερον
  choice: अधिक सहने योग्य
  rationale: यह ἀνεκτός का तुलनात्मक रूप है और ‘अधिक सहनीय/सहने योग्य’ का अर्थ देता है। चुना हुआ रूप सामान्य पाठक के लिए स्पष्ट है।
- source_word: ἔσται
  choice: होगी
  rationale: भविष्यकालीन योजक क्रिया को हिन्दी वाक्य की स्त्रीलिंग संज्ञा ‘दशा’ के अनुरूप व्यक्त किया गया है।
- source_word: ἐν τῇ κρίσει
  choice: न्याय के दिन
  rationale: संदर्भ अंतिम दैवी न्याय की ओर संकेत करता है। ‘न्याय के दिन’ हिन्दी में स्वाभाविक है और निश्चित न्याय-अवसर का भाव व्यक्त करता है, यद्यपि ‘दिन’ यूनानी में अंतर्निहित रूप से नहीं है।
- source_word: ἢ ὑμῖν
  choice: तुम्हारी दशा से
  rationale: यह तुलनात्मक संरचना को पूरा करता है। हिन्दी में ‘की दशा ... से’ संरचना सम्प्रदान और तुलना दोनों को साफ़ व्यक्त करती है।
theological_decisions:
- issue: κρίσις का संदर्भगत अर्थ
  choice: अंतिम दैवी न्याय की ओर संकेत करने वाला ‘न्याय के दिन’
  alternative: सामान्य अर्थ में ‘न्याय में’
  rationale: पश्चाताप न करने वाले नगरों की सोर और सीदोन से तुलना अंतिम न्याय की प्रबल संभावना बताती है। अनुवाद विस्तृत धर्मशास्त्रीय व्याख्या जोड़े बिना उस संदर्भगत अर्थ को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘सोर’ और ‘सीदोन’ प्रचलित हिन्दी बाइबलीय स्थान-नाम हैं।
