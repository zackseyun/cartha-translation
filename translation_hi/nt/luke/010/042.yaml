  text: ⸂ὀλίγων δέ ἐστιν χρεία ἢ ἑνός⸃· ⸂Μαριὰμ γὰρ⸃ τὴν ἀγαθὴν μερίδα ἐξελέξατο ἥτις οὐκ ἀφαιρεθήσεται ⸀αὐτῆς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/010/042.yaml
  text: But few things are needed—or one[a]. For Mary has chosen the good portion[b], which will not be taken away from her.
translation:
  language: hi
  text: पर कुछ ही चीज़ों की आवश्यकता है—या एक की[a]। क्योंकि मरियम ने अच्छा हिस्सा[b] चुन लिया है, जो उससे नहीं छीना जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “केवल एक ही बात आवश्यक है।” भोजन के प्रसंग में यूनानी वाक्य का अधिक विशिष्ट अर्थ यह भी हो सकता है: “कुछ ही व्यंजनों की आवश्यकता है—या केवल एक की।”'
    reason: alternative_reading
  - marker: b
    text: या, “अच्छा भाग।” “हिस्सा” भोजन के हिस्से और रूपक रूप में उस हिस्सेदारी—जो सचमुच मूल्यवान है—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὀλίγων δέ ἐστιν χρεία ἢ ἑνός
  choice: पर कुछ ही चीज़ों की आवश्यकता है—या एक की
  rationale: यह वाक्यांश ‘कुछ’ और ‘एक’ के बीच के संक्षिप्त विरोध को बनाए रखता है। ‘चीज़ों’ को जोड़ने से हिन्दी स्वाभाविक बनती है, फिर भी यह तय नहीं किया जाता कि आशय भोजन के व्यंजनों से है या अधिक व्यापक रूप से आवश्यक बातों से।
- source_word: Μαριὰμ
  choice: मरियम
  rationale: यह हिन्दी बाइबिल परंपरा में इस नाम का प्रचलित रूप है।
- source_word: τὴν ἀγαθὴν μερίδα
  choice: अच्छा हिस्सा
  rationale: ‘हिस्सा’ μερίς के ‘भाग/अंश’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और भोजन के हिस्से तथा सचमुच मूल्यवान वस्तु में भाग—दोनों संभावित संकेतों को बनाए रखता है। ‘अच्छा’ ἀγαθή का सीधा अर्थ है; ‘बेहतर’ मूल यूनानी में निहित न होने वाला तुलनात्मक भाव जोड़ देता।
- source_word: ἐξελέξατο
  choice: चुन लिया है
  rationale: यह मरियम के अपने लिए किए गए सोच-समझकर चुनाव और उसके बने रहने वाले परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: ἥτις οὐκ ἀφαιρεθήσεται αὐτῆς
  choice: जो उससे नहीं छीना जाएगा
  rationale: यह भावी कर्मवाच्य को स्पष्ट रखता है और उस हिस्से के स्थायी रूप से उसके पास बने रहने की बात व्यक्त करता है।
theological_decisions:
- issue: ‘कुछ ही चीज़ों ... या एक’ का मार्था की सेवा और मरियम के चुनाव से संबंध
  choice: मुख्य पाठ में ‘कुछ ही चीज़ों की आवश्यकता है—या एक की’ रखकर यह खुला छोड़ा गया है कि यीशु कुछ व्यंजनों, एक व्यंजन, या एकमात्र आवश्यक बात की ओर संकेत कर रहे हैं।
  alternative: ‘केवल एक ही बात आवश्यक है’ अथवा ‘कुछ ही व्यंजन चाहिए—या केवल एक।’
  rationale: यूनानी पाठ भोजन की तत्काल परिस्थिति और एक व्यापक आत्मिक अर्थ—दोनों की संभावना देता है। अनुवाद किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली रखी गई है। ‘आवश्यकता’ प्रसंग की गंभीरता बनाए रखता है, जबकि ‘चीज़ों’ और ‘हिस्सा’ सामान्य पाठक के लिए स्वाभाविक हैं।
