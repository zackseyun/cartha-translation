  text: ἐπειδὴ φίλος ⸀μου παρεγένετο ἐξ ὁδοῦ πρός με καὶ οὐκ ἔχω ὃ παραθήσω αὐτῷ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/006.yaml
  text: because a friend of mine has come to me from a journey[a], and I have nothing to set before him.
translation:
  language: hi
  text: क्योंकि मेरा एक मित्र यात्रा से मेरे पास आया है,[a] और मेरे पास उसे परोसने के लिए कुछ भी नहीं है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मार्ग से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπειδὴ
  choice: क्योंकि
  rationale: यह दृष्टान्त में अनुरोध का कारण बताता है; आधुनिक हिन्दी में स्वाभाविक कारणसूचक संयोजक।
- source_word: φίλος μου
  choice: मेरा एक मित्र
  rationale: अनिश्चित φίλος और सम्बन्धवाचक μου का स्वाभाविक हिन्दी रूप, जो किसी एक मित्र का भाव बनाए रखता है।
- source_word: παρεγένετο
  choice: आया है
  rationale: आगमन की पूर्ण घटना और मित्र की वर्तमान उपस्थिति—दोनों को हिन्दी का पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἐξ ὁδοῦ
  choice: यात्रा से
  rationale: शाब्दिक अर्थ ‘मार्ग से’ है, पर प्रसंग में यात्रा करके आने का मुहावरेदार भाव है।
- source_word: πρός με
  choice: मेरे पास
  rationale: वक्ता की ओर आगमन को व्यक्त करता है और ‘घर’ या ‘भेंट करने’ जैसी अनकही सूचना नहीं जोड़ता।
- source_word: οὐκ ἔχω
  choice: मेरे पास ... कुछ भी नहीं है
  rationale: अभाव को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ὃ παραθήσω αὐτῷ
  choice: उसे परोसने के लिए
  rationale: आतिथ्य और भोजन के प्रसंग में παρατίθημι का अर्थ किसी के सामने भोजन रखना या परोसना है; हिन्दी में ‘परोसना’ स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। आतिथ्य के प्रसंग को ‘परोसने’ से स्पष्ट किया गया है, जबकि ἐξ ὁδοῦ का अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
