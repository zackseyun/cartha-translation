base_translation:
  language: en
  yaml_path: translation/nt/luke/011/044.yaml
  text: Woe to you, because you are like unmarked tombs, and the men walking over them do not know it.
translation:
  language: hi
  text: तुम पर हाय! क्योंकि तुम ऐसी अनचिह्नित कब्रों के समान हो जिन पर लोग चलते हैं और उन्हें इसका पता नहीं होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: हाय तुम पर!
  rationale: न्याय और शोक की भविष्यवाणी-सदृश घोषणा को स्वाभाविक तथा गंभीर हिन्दी में व्यक्त करता है।
- source_word: τὰ μνημεῖα τὰ ἄδηλα
  choice: अनचिह्नित कब्रों
  rationale: ἄδηλα का अर्थ ऐसी कब्रें है जो दिखाई या पहचानी नहीं जातीं; ‘अनचिह्नित’ इस प्रसंग में संक्षिप्त और स्पष्ट है।
- source_word: οἱ ἄνθρωποι οἱ περιπατοῦντες ἐπάνω
  choice: जिनके ऊपर चलते हुए लोगों
  rationale: ἄνθρωποι यहाँ सामान्य रूप से मनुष्यों/लोगों को सूचित करता है, केवल पुरुषों को नहीं; सम्बन्धवाचक रचना हिन्दी में वाक्य को स्वाभाविक बनाती है।
- source_word: οὐκ οἴδασιν
  choice: पता नहीं होता
  rationale: अज्ञान की निरंतर स्थिति को सहज आधुनिक हिन्दी में व्यक्त करता है; आशय है कि उन्हें कब्रों के ऊपर चलने का बोध नहीं।
theological_decisions:
- issue: अनजाने में कब्र के ऊपर चलने से अशुद्ध होने का सांस्कृतिक-धार्मिक संकेत
  choice: मुख्य पाठ में संकेत को न समझाकर मूल उपमा को यथावत रखा गया।
  alternative: ‘और अनजाने में अशुद्ध हो जाते हैं’ जोड़ना।
  rationale: मूल यूनानी केवल यह कहता है कि लोगों को पता नहीं; अशुद्धता का परिणाम प्रसंग में निहित है, पर उसे पाठ में जोड़ना व्याख्यात्मक विस्तार होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गंभीर, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध। ‘लोगों’ का चयन यूनानी ἄνθρωποι की समावेशी सामान्यता बनाए रखता है।
