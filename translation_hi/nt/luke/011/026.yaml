source:
  edition: SBLGNT
  text: τότε πορεύεται καὶ παραλαμβάνει ⸂ἕτερα πνεύματα πονηρότερα ἑαυτοῦ ἑπτά⸃, καὶ ⸀εἰσελθόντα κατοικεῖ ἐκεῖ, καὶ γίνεται τὰ ἔσχατα τοῦ ἀνθρώπου ἐκείνου χείρονα τῶν πρώτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/026.yaml
  text: Then it goes and takes along seven other spirits more evil than itself[a], and they enter and live there[c][b]; and the last state of that man becomes worse than the first.
translation:
  language: hi
  text: तब वह जाकर सात और आत्माओं को, जो अपने से अधिक दुष्ट हैं, अपने साथ ले लेता है[a], और वे उसमें प्रवेश करके वहीं रहने लगती हैं[b]। तब उस मनुष्य की बाद की दशा उसकी पहली दशा से भी बुरी हो जाती है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दुष्ट’ का अनुवाद ‘बुरी’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी पाठ में यहाँ केवल ‘आत्माएँ’ कहा गया है, ‘दुष्टात्माएँ’ या ‘अशुद्ध आत्माएँ’ नहीं; फिर भी प्रसंग से उनका बुरा स्वभाव स्पष्ट है। यूनानी में εἰσελθόντα (‘प्रवेश करके’) बहुवचन है, पर κατοικεῖ (‘निवास करता है’) एकवचन रूप में है।
    reason: lexical_and_grammatical_ambiguity
  - marker: c
    text: या, ‘उस मनुष्य की अन्तिम दशा उसकी पहली दशा से भी बुरी हो जाती है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: τότε
  choice: तब
  rationale: यह कथा में घटनाओं का क्रम बताने वाला स्वाभाविक कालसूचक शब्द है।
- source_word: πορεύεται καὶ παραλαμβάνει
  choice: जाकर ... अपने साथ ले लेता है
  rationale: πορεύεται गति को और παραλαμβάνει किसी को अपने साथ लेने को व्यक्त करता है; संयुक्त हिन्दी वाक्यांश दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: ἕτερα πνεύματα ... ἑπτά
  choice: सात और आत्माओं
  rationale: πνεύματα का सीधा अर्थ ‘आत्माएँ’ है; इस पद में ‘दुष्टात्माएँ’ या ‘दुष्ट दूत’ स्पष्ट रूप से नहीं कहा गया, इसलिए विशेषण को अलग रखा गया है।
- source_word: πονηρότερα ἑαυτοῦ
  choice: अपने से अधिक दुष्ट
  rationale: तुलना लौटने वाली आत्मा और साथ लाई गई आत्माओं के बीच है। ‘दुष्ट’ नैतिक और शत्रुतापूर्ण भाव को बनाए रखता है।
- source_word: εἰσελθόντα κατοικεῖ ἐκεῖ
  choice: वे भीतर जाकर वहीं बस जाती हैं
  rationale: बहुवचन कृदन्त εἰσελθόντα सात अन्य आत्माओं की ओर संकेत करता है; ‘बस जाती हैं’ κατοικεῖ के स्थायी रूप से रहने के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τὰ ἔσχατα ... τῶν πρώτων
  choice: बाद की दशा ... पहली दशा से
  rationale: यह मुहावरेदार तुलना उस मनुष्य की बाद की स्थिति और आरम्भिक स्थिति के बीच है; ‘दशा’ हिन्दी में परिणामगत हालत को स्पष्ट करता है।
theological_decisions:
- issue: क्या πνεύματα को मुख्य पाठ में ‘दुष्टात्माएँ’ या ‘दुष्ट दूत’ कहा जाए
  choice: आत्माओं
  alternative: दुष्टात्माओं
  rationale: इस पद में संज्ञा केवल πνεύματα है। प्रसंग और πονηρότερα उनका दुष्ट स्वभाव स्पष्ट करते हैं, इसलिए संज्ञा में अतिरिक्त धार्मिक पहचान नहीं जोड़ी गई।
- issue: ἀνθρώπου का लिंग-सटीक अनुवाद
  choice: उस मनुष्य
  alternative: उस व्यक्ति
  rationale: यूनानी पाठ एक विशिष्ट पुरुषवाचक उदाहरण की बात करता है; ‘मनुष्य’ मूल अभिव्यक्ति के अनुरूप और हिन्दी में स्वाभाविक है।
- issue: κατοικεῖ के व्याकरणिक एकवचन और अर्थगत बहुवचन के बीच तनाव
  choice: वे ... बस जाती हैं
  alternative: वह ... बस जाती है
  rationale: प्रवेश करने वाला कृदन्त बहुवचन है और निकटतम कर्ता सात आत्माएँ हैं। हिन्दी में बहुवचन अर्थ अधिक स्पष्ट है, जबकि यूनानी क्रिया के एकवचन रूप की सूचना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बस जाती हैं’ साधारण ‘रहती हैं’ की अपेक्षा स्थायी निवास के भाव को अधिक स्पष्ट करता है। वाक्य में आत्माओं के लिए हिन्दी का स्वाभाविक स्त्रीलिंग बहुवचन प्रयोग हुआ है।
