    issue: The rendering “पसंद करते हो” weakens ἀγαπᾶτε.
    rationale: 'In this context the verb denotes more than an ordinary preference: it conveys a pronounced desire for public honor. “बहुत चाहते हो” better preserves that force in idiomatic Hindi.'
  - severity: low
    issue: “सम्मान के प्रमुख आसन” is stylistically cumbersome.
    rationale: πρωτοκαθεδρία refers directly to the foremost or most honored seats. “प्रमुख आसनों” is concise, natural, and preserves the status implication; the alternative footnote can make the nuance explicit.
  - severity: low
    issue: “आदर भरे अभिवादन” makes the honorific nuance explicit in the main text.
    rationale: The source says “greetings”; their socially honorific character is contextual and is appropriately explained by the cultural footnote. A neutral main-text rendering better maintains the source’s wording.
