id: LUK.11.43
reference: Luke 11:43
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀγαπᾶτε τὴν πρωτοκαθεδρίαν ἐν ταῖς συναγωγαῖς καὶ τοὺς ἀσπασμοὺς ἐν ταῖς ἀγοραῖς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/043.yaml
  text: Woe to you Pharisees[b][a], because you love the best seats in the synagogues and greetings in the marketplaces.
translation:
  language: hi
  text: हे फरीसियो, तुम पर हाय! क्योंकि तुम आराधनालयों में प्रमुख आसनों[a] और बाज़ारों में अभिवादनों[b] को बहुत चाहते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुख्य आसन” अथवा “सम्मान के स्थान।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसे सार्वजनिक अभिवादन जिनसे सामाजिक सम्मान और पहचान प्रकट होती थी।
    reason: cultural_note
lexical_decisions:
- source_word: οὐαὶ ὑμῖν τοῖς Φαρισαίοις
  choice: हे फरीसियो, तुम पर हाय!
  rationale: प्रत्यक्ष संबोधन और भविष्यद्वक्ताओं जैसी कड़ी धिक्कार—दोनों को स्वाभाविक तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह स्पष्ट करता है कि आगे कही गई बात धिक्कार का कारण है।
- source_word: ἀγαπᾶτε
  choice: पसंद करते हो
  rationale: इस प्रसंग में क्रिया सम्मान पाने की प्रबल चाह या रुचि बताती है; ‘प्रेम करते हो’ शाब्दिक होते हुए भी आधुनिक हिन्दी में यहाँ अस्वाभाविक और भ्रामक लग सकता है।
- source_word: τὴν πρωτοκαθεδρίαν
  choice: सम्मान के प्रमुख आसन
  rationale: यह आराधनालय के केवल सुविधाजनक या सामने वाले स्थान नहीं, बल्कि प्रतिष्ठा-सूचक प्रमुख आसन को व्यक्त करता है।
- source_word: ἐν ταῖς συναγωγαῖς
  choice: आराधनालयों में
  rationale: ‘आराधनालय’ सामान्य हिन्दी पाठक के लिए बोधगम्य है और यहूदी सामुदायिक उपासना-स्थल के आशय को संदर्भ में व्यक्त करता है।
- source_word: τοὺς ἀσπασμοὺς
  choice: आदर भरे अभिवादन
  rationale: मूल शब्द अभिवादन को दर्शाता है; प्रसंग में उससे मिलने वाली सार्वजनिक प्रतिष्ठा निहित है, जिसे संक्षिप्त विशेषण से स्पष्ट किया गया है।
- source_word: ἐν ταῖς ἀγοραῖς
  choice: बाज़ारों में
  rationale: ἀγορά के सार्वजनिक बाज़ार अथवा नगर-चौक के सामाजिक परिवेश को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु की धिक्कार का स्वरूप
  choice: फरीसियों की सार्वजनिक प्रतिष्ठा की चाह के विरुद्ध भविष्यद्वक्ताओं जैसी नैतिक-आध्यात्मिक धिक्कार
  alternative: केवल सामाजिक शिष्टाचार की आलोचना
  rationale: οὐαί और उसके बाद दिया गया कारण कथन को साधारण व्यवहार-सुधार से अधिक गंभीर बनाते हैं; अनुवाद इस तीव्रता को बनाए रखता है, पर अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘हे फरीसियो’ प्रत्यक्ष संबोधन को, और ‘तुम पर हाय’ मूल की गंभीर भविष्यद्वक्तात्मक धिक्कार को सुरक्षित रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्मिलित हैं।
