source:
  edition: SBLGNT
  text: ὅταν ὁ ἰσχυρὸς καθωπλισμένος φυλάσσῃ τὴν ἑαυτοῦ αὐλήν, ἐν εἰρήνῃ ἐστὶν τὰ ὑπάρχοντα αὐτοῦ·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/021.yaml
  text: When the strong man[a], fully armed, guards his own courtyard[b], his possessions are secure.
translation:
  language: hi
  text: जब बलवान व्यक्ति पूरी तरह हथियारबंद होकर अपने आँगन[a] की रखवाली करता है, तब उसकी संपत्ति सुरक्षित रहती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने निवास” अथवा “अपने अहाते”; यूनानी शब्द आँगन के साथ-साथ उससे जुड़े निवास या पूरे परिसर को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “शांति में रहती है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: ὅταν
  choice: जब ... तब
  rationale: यह सामान्य समय-सापेक्ष परिस्थिति प्रस्तुत करता है; हिन्दी में ‘जब ... तब’ इस दृष्टांतात्मक कथन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ὁ ἰσχυρός
  choice: कोई बलवान व्यक्ति
  rationale: विशेषण यहाँ संज्ञा के रूप में एक बलवान पुरुष को सूचित करता है। सामान्य दृष्टांतात्मक परिस्थिति में ‘कोई’ हिन्दी में स्वाभाविक है, जबकि ‘बलवान व्यक्ति’ शक्ति के मूल भाव को बनाए रखता है।
- source_word: καθωπλισμένος
  choice: पूरी तरह हथियारबंद होकर
  rationale: पूर्ण कृदंत हथियारों से सुसज्जित होने की परिणामी वर्तमान अवस्था बताता है; यह चयन तैयारी की पूर्णता और चालू अवस्था दोनों व्यक्त करता है।
- source_word: φυλάσσῃ
  choice: रखवाली करता है
  rationale: यह पहरा देने और सुरक्षित रखने की निरंतर क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: τὴν ἑαυτοῦ αὐλήν
  choice: अपने आँगन
  rationale: ἑαυτοῦ का बल ‘अपने’ से व्यक्त होता है। αὐλή का सीधा अर्थ आँगन है, यद्यपि यह उससे जुड़े निवास या पूरे अहाते को भी सूचित कर सकता है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: ἐν εἰρήνῃ
  choice: सुरक्षित रहती है
  rationale: शाब्दिक ‘शांति में’ यहाँ संपत्ति की निर्विघ्न और सुरक्षित दशा का मुहावरेदार वर्णन है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: τὰ ὑπάρχοντα αὐτοῦ
  choice: उसकी संपत्ति
  rationale: यह अभिव्यक्ति उस व्यक्ति की वस्तुओं, माल या संपत्ति को सामूहिक रूप से बताती है; ‘संपत्ति’ स्पष्ट, व्यापक और वर्तमान हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: संदर्भ में दृष्टांत का रूपकात्मक आशय
  choice: बलवान व्यक्ति की छवि को सीधे रूप में रखा गया है; उसकी पहचान मुख्य पाठ में स्पष्ट नहीं की गई।
  alternative: मुख्य पाठ में बलवान व्यक्ति को स्पष्ट रूप से शैतान कहना।
  rationale: यह पद स्वयं रूपक की छवि प्रस्तुत करता है, जबकि उसका संकेत आसपास के संदर्भ से समझ में आता है। अनुवाद में संकेतित पहचान जोड़ने से पद की मूल रूपकात्मकता और व्याख्यात्मक तनाव समय से पहले समाप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘हथियारबंद’, ‘रखवाली’ और ‘सुरक्षित’ सामान्य पाठक के लिए स्पष्ट हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उनके संबंधित पदों के तुरंत बाद रखे गए हैं।
