source:
  edition: SBLGNT
  text: εἶπεν δὲ ὁ κύριος πρὸς αὐτόν· Νῦν ὑμεῖς οἱ Φαρισαῖοι τὸ ἔξωθεν τοῦ ποτηρίου καὶ τοῦ πίνακος καθαρίζετε, τὸ δὲ ἔσωθεν ὑμῶν γέμει ἁρπαγῆς καὶ πονηρίας.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/039.yaml
  text: But the Lord said to him[a], “Now you Pharisees clean the outside of the cup and the dish, but your inside is full of greed and wickedness.”
translation:
  language: hi
  text: पर प्रभु ने उससे कहा, “अब तुम फ़रीसी प्याले और थाली को बाहर से तो साफ़ करते हो, पर तुम्हारे भीतर लूट-खसोट[a] और दुष्टता भरी हुई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लूट,” “हड़पना,” अथवा “जबरन वसूली।”
    reason: ἁρπαγή के ठोस वैकल्पिक अर्थों को दर्शाता है।
lexical_decisions:
- source_word: κύριος
  choice: प्रभु
  rationale: यहाँ κύριος यीशु के लिए प्रयुक्त मानक उपाधि है; ‘प्रभु’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: Νῦν
  choice: अब
  rationale: यह यीशु की तीखी फटकार आरम्भ करने वाला संवाद-सूचक है; ‘अब’ उसके आलंकारिक बल को बनाए रखता है।
- source_word: ὑμεῖς οἱ Φαρισαῖοι
  choice: तुम फ़रीसी
  rationale: सर्वनाम और संज्ञा का संयोजन बलाघातपूर्ण है; हिन्दी में ‘तुम फ़रीसी’ इसे सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: τὸ ἔξωθεν ... καθαρίζετε
  choice: बाहर से तो साफ़ करते हो
  rationale: ‘बाहर से’ बाहरी सतह का बोध कराता है और ‘तो’ आगे आने वाले आंतरिक विरोध को स्वाभाविक हिन्दी में उभारता है।
- source_word: ποτηρίου
  choice: कटोरे
  rationale: ποτήριον पीने के पात्र को दर्शाता है; इस प्रसंग में ‘कटोरा’ सामान्य, ठोस और सुबोध हिन्दी विकल्प है।
- source_word: πίνακος
  choice: थाली
  rationale: πίναξ भोजन रखने की थाली या बड़े पात्र को सूचित करता है; ‘थाली’ आधुनिक हिन्दी में सहज है और अनावश्यक विशिष्टता नहीं जोड़ता।
- source_word: τὸ δὲ ἔσωθεν ὑμῶν
  choice: पर तुम्हारा भीतर
  rationale: मूल पाठ बाहरी पात्र से फ़रीसियों की आंतरिक दशा की ओर मुड़ता है। ‘तुम्हारा भीतर’ रूपक को बनाए रखता है और ‘हृदय’ जैसी व्याख्यात्मक विशिष्टता नहीं जोड़ता।
- source_word: γέμει
  choice: भरा है
  rationale: एकवचन ‘भीतर’ के साथ यह γέμει का स्वाभाविक हिन्दी समतुल्य है।
- source_word: ἁρπαγῆς
  choice: लूट-खसोट
  rationale: ἁρπαγή में लालच के साथ बलपूर्वक हड़पने, लूटने या शोषण का ठोस भाव है। ‘लूट-खसोट’ इस सक्रिय, शोषक अर्थ को सुरक्षित रखता है; वैकल्पिक व्यापक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: πονηρίας
  choice: दुष्टता
  rationale: πονηρία व्यापक नैतिक बुराई को व्यक्त करता है; ‘दुष्टता’ फटकार की गंभीरता को बनाए रखता है।
theological_decisions:
- issue: ‘भीतर’ का रूपकात्मक संकेत
  choice: ‘तुम्हारा भीतर’ कहकर रूपक को यथावत रखा गया है।
  alternative: ‘तुम्हारा हृदय’ या ‘तुम्हारा मन’
  rationale: यूनानी पाठ किसी विशेष मनोवैज्ञानिक अंग को नहीं बताता, बल्कि बाहरी शुद्धता और आंतरिक नैतिक भ्रष्टता के बीच तनाव रखता है।
- issue: ἁρπαγή का नैतिक अर्थ
  choice: मुख्य पाठ में ‘लूट-खसोट’
  alternative: ‘लालच’, ‘लूट’, ‘डकैती’ या ‘जबरन वसूली’
  rationale: यह शब्द हड़पने और शोषणकारी लोभ दोनों का अर्थ दे सकता है। ‘लूट-खसोट’ ठोस कर्म और उसके पीछे की लोलुपता के संबंध को बनाए रखता है, जबकि पादटिप्पणी अर्थ-सीमा को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘फ़रीसी’, ‘कटोरा’, ‘थाली’ और ‘साफ़’ सामान्य पाठक के लिए सहज हैं। ‘तुम्हारा भीतर’ सामान्य गद्य से कुछ अधिक रूपकात्मक है, पर मूल पाठ की जानबूझकर रखी गई बाहरी-भीतरी समानता और अस्पष्टता को सुरक्षित करता है।
