source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν· Καὶ ὑμῖν τοῖς νομικοῖς οὐαί, ὅτι φορτίζετε τοὺς ἀνθρώπους φορτία δυσβάστακτα, καὶ αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε τοῖς φορτίοις.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/046.yaml
  text: But he said[a], “Woe also to you lawyers, because you load people with burdens hard to bear[b], and you yourselves do not touch the burdens with one of your fingers.”
translation:
  language: hi
  text: पर उसने कहा, “व्यवस्था के विशेषज्ञों, तुम पर भी हाय! क्योंकि तुम लोगों पर ऐसे बोझ लादते हो जिन्हें उठाना कठिन है, और तुम स्वयं अपनी एक उँगली से भी उन बोझों को नहीं छूते।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उन बोझों को नहीं छूते’ का अर्थ यह भी हो सकता है कि वे अपने लगाए हुए बोझों को उठाने में लोगों की थोड़ी-सी सहायता भी नहीं करते।
    reason: lexical_alternative
lexical_decisions:
- source_word: νομικοῖς
  choice: व्यवस्था के जानकारो
  rationale: यह शब्द मूसा की व्यवस्था के विशेषज्ञों को सूचित करता है, आधुनिक अर्थ के वकीलों को नहीं। यह अनुवाद संदर्भ को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: οὐαί
  choice: तुम पर भी हाय
  rationale: यह भविष्यद्वक्ताओं जैसी चेतावनी और न्याय-घोषणा की प्रबलता को बनाए रखता है; केवल दुःख व्यक्त करने वाला पद नहीं है।
- source_word: φορτίζετε ... φορτία
  choice: बोझ लादते हो
  rationale: क्रिया और संज्ञा की ठोस भार-वहन उपमा को सुरक्षित रखता है।
- source_word: δυσβάστακτα
  choice: जिन्हें उठाना कठिन है
  rationale: अर्थ कठिनाई से उठाए या सहे जा सकने वाले बोझ का है; ‘असहनीय’ कहना मूल से अधिक प्रबल होता।
- source_word: ἀνθρώπους
  choice: लोगों
  rationale: यहाँ शब्द सभी मनुष्यों के लिए सामान्य अर्थ में है, केवल पुरुषों के लिए नहीं।
- source_word: αὐτοὶ ἑνὶ τῶν δακτύλων ὑμῶν οὐ προσψαύετε
  choice: स्वयं अपनी एक उँगली से भी ... नहीं छूते
  rationale: ‘स्वयं’ विरोध और बल को, तथा ‘एक उँगली से भी’ न्यूनतम सहभागिता तक न होने की सजीव उपमा को बनाए रखता है।
theological_decisions:
- issue: νομικοῖς की पहचान
  choice: व्यवस्था के जानकार
  alternative: वकील; शास्त्री; व्यवस्था के विशेषज्ञ
  rationale: लूका में ये यहूदी व्यवस्था के विशेषज्ञ हैं। ‘वकील’ आधुनिक नागरिक न्याय-व्यवस्था का भ्रम पैदा कर सकता है और ‘शास्त्री’ निकट होते हुए भी मूल के भिन्न पद को मिला सकता है।
- issue: अंतिम वाक्यांश का आशय
  choice: बोझों को एक उँगली से भी न छूने की मूल उपमा सुरक्षित रखी गई
  alternative: उनकी सहायता के लिए उँगली तक नहीं उठाते
  rationale: मूल पाठ सीधे ‘सहायता’ नहीं कहता, यद्यपि संदर्भ में यह निहित हो सकता है। ठोस उपमा को मुख्य पाठ में रखना वास्तविक अर्थगत खुलापन सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। ‘व्यवस्था’ बाइबलीय संदर्भ में मूसा की व्यवस्था को दर्शाती है। संबोधन और ‘हाय’ भविष्यद्वक्ताओं जैसी कड़ी चेतावनी का स्वर बनाए रखते हैं।
