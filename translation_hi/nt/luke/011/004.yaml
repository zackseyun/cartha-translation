source:
  edition: SBLGNT
  text: καὶ ἄφες ἡμῖν τὰς ἁμαρτίας ἡμῶν, καὶ γὰρ αὐτοὶ ἀφίομεν παντὶ ὀφείλοντι ἡμῖν· καὶ μὴ εἰσενέγκῃς ἡμᾶς εἰς ⸀πειρασμόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/004.yaml
  text: And forgive us our sins[a], for we ourselves also forgive everyone indebted to us[c][b]. And do not bring us into temptation.
translation:
  language: hi
  text: और हमारे पापों को क्षमा कर, क्योंकि हम स्वयं भी अपने हर कर्ज़दार[a] को क्षमा करते हैं। और हमें परीक्षा[b] में न ला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘हर उस व्यक्ति को, जो हमारा कुछ देनदार है’; यहाँ यूनानी में कर्ज़ की भाषा है, जबकि पहले उपवाक्य में ‘पाप’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रलोभन’ अथवा ‘परख’; यूनानी शब्द इन अर्थों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἄφες
  choice: क्षमा कर
  rationale: प्रार्थना में ἀφίημι का स्वाभाविक अर्थ ‘क्षमा करना’ है। एकवचन आज्ञार्थक रूप को परमेश्वर से सीधे संबोधन के अनुरूप रखा गया है।
- source_word: τὰς ἁμαρτίας ἡμῶν
  choice: हमारे पापों को
  rationale: ἁμαρτίας स्पष्ट रूप से ‘पाप’ कहता है, ‘ऋण’ नहीं; इसलिए पहले उपवाक्य में पाप की भाषा सुरक्षित रखी गई है।
- source_word: καὶ γὰρ αὐτοὶ
  choice: क्योंकि हम स्वयं भी
  rationale: γὰρ पूर्व निवेदन का आधार बताता है, αὐτοὶ का बल ‘स्वयं’ से और καί का समावेशी भाव ‘भी’ से व्यक्त होता है।
- source_word: ἀφίομεν
  choice: क्षमा करते हैं
  rationale: पहले उपवाक्य के ἄφες से क्रियात्मक संबंध बनाए रखता है और पारस्परिक संबंधों के संदर्भ में स्वाभाविक हिन्दी है।
- source_word: παντὶ ὀφείλοντι ἡμῖν
  choice: अपने हर कर्ज़दार को
  rationale: ὀφείλω में देनदारी की भाषा है। ‘कर्ज़दार’ इस बिंब को सुरक्षित रखते हुए सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: μὴ εἰσενέγκῃς ἡμᾶς εἰς πειρασμόν
  choice: हमें परीक्षा में न ला
  rationale: εἰσφέρω का मूल भाव ‘अंदर लाना’ है, इसलिए ‘न ला’ निकट और स्वाभाविक है। ‘परीक्षा’ πειρασμός के परीक्षण/संकट और प्रलोभन की ओर खुली अर्थ-सीमा को हिन्दी में यथासंभव बनाए रखता है।
theological_decisions:
- issue: πειρασμός वाली अंतिम विनती का अर्थ और परमेश्वर से उसका संबंध
  choice: हमें परीक्षा में न ला
  alternative: हमें प्रलोभन में न ला / हमें परख में न ला
  rationale: यूनानी कथन की धार्मिक तनावपूर्ण अभिव्यक्ति को किसी व्याख्यात्मक नरमी से नहीं बदला गया। मुख्य पाठ में विनती ज्यों की त्यों रखी गई है और शब्द की अर्थ-सीमा पादटिप्पणी में दी गई है।
- issue: ‘पाप’ और ‘कर्ज़दार’ के बीच रूपक-संबंध
  choice: पहले उपवाक्य में ‘पाप’, दूसरे में ‘कर्ज़दार’
  alternative: दोनों उपवाक्यों को केवल पाप/अपराध की भाषा में समान कर देना
  rationale: यूनानी पाठ पहले ἁμαρτίας और फिर ὀφείλοντι प्रयोग करता है। दोनों को समान कर देने के बजाय उसका जानबूझकर किया गया शब्द-परिवर्तन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रार्थनात्मक शैली रखी गई है। परमेश्वर के लिए एकवचन सीधा संबोधन (‘कर’, ‘ला’) यूनानी व्याकरण और निकट प्रार्थना-भाषा के अनुरूप है। ‘कर्ज़दार’ सामान्य पाठक के लिए ‘ऋणी’ से अधिक सहज है, जबकि पादटिप्पणी मूल ऋण-बिंब स्पष्ट करती है।
