  text: αὐτὸς δὲ εἰδὼς αὐτῶν τὰ διανοήματα εἶπεν αὐτοῖς· Πᾶσα βασιλεία ἐφ’ ἑαυτὴν διαμερισθεῖσα ἐρημοῦται, καὶ οἶκος ἐπὶ οἶκον πίπτει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/017.yaml
  text: But he[a], knowing their thoughts, said to them, “Every kingdom divided against itself is laid waste, and a house falls upon a house.”
translation:
  language: hi
  text: परन्तु उसने उनके विचार जानकर उनसे कहा, “हर वह राज्य जो अपने ही विरुद्ध बँट जाता है, उजाड़ हो जाता है, और एक घर[a] दूसरे घर पर गिरता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घर’ का अर्थ ‘घराना’ या ‘परिवार’ भी हो सकता है। यूनानी οἶκος भौतिक घर और घराने/परिवार, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδὼς
  choice: जानकर
  rationale: यह कृदन्त यीशु की संज्ञानात्मक जानकारी को व्यक्त करता है और मुख्य क्रिया ‘कहा’ से उसका संबंध बनाए रखता है।
- source_word: διανοήματα
  choice: विचार
  rationale: यह उनके भीतर के सोच-विचार को बिना उनकी मंशा को आवश्यकता से अधिक निश्चित किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: Πᾶσα βασιλεία
  choice: हर वह राज्य
  rationale: यह सामान्य सिद्धान्त में πᾶσα के वितरणात्मक अर्थ को बनाए रखता है और आगे आने वाले विशेषणात्मक कृदन्त के साथ सहज हिन्दी बनाता है।
- source_word: ἐφ’ ἑαυτὴν
  choice: अपने ही विरुद्ध
  rationale: διαμερισθεῖσα के साथ यह आन्तरिक विरोध का भाव देता है; ‘ही’ राज्य के अपने भीतर के विरोध पर बल देता है।
- source_word: διαμερισθεῖσα
  choice: बँट जाता है
  rationale: यह राज्य के भीतर फूट या विभाजन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: ἐρημοῦται
  choice: उजाड़ हो जाता है
  rationale: यह क्रिया विनाश और निर्जनता की गंभीर परिणति को व्यक्त करती है; हिन्दी में यह रूप स्रोत के परिणामात्मक निष्क्रिय भाव को सहज ढंग से प्रकट करता है।
- source_word: οἶκος ἐπὶ οἶκον
  choice: एक घर दूसरे घर पर
  rationale: यह कठिन और संक्षिप्त यूनानी अभिव्यक्ति की ठोस छवि को पठनीय हिन्दी में रखता है, जबकि ‘घर’ के भवन अथवा घराने—दोनों सम्भव अर्थों को पादटिप्पणी में सुरक्षित करता है।
- source_word: πίπτει
  choice: गिर पड़ता है
  rationale: यह वर्तमानकालीन लोकोक्तिपरक कथन और गिरने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दूसरे उपवाक्य में οἶκος का अर्थ
  choice: मुख्य पाठ में ‘घर’
  alternative: ‘घराना’ या ‘परिवार’
  rationale: οἶκος किसी भौतिक घर या घराने/परिवार, दोनों को सूचित कर सकता है। संक्षिप्त यूनानी कथन किसी एक अर्थ को निर्णायक रूप से अनिवार्य नहीं करता, इसलिए मुख्य पाठ ठोस शब्द ‘घर’ रखता है और सामाजिक अर्थ को पादटिप्पणी में सुरक्षित करता है।
- issue: οἶκος ἐπὶ οἶκον में ἐπί का संबंध
  choice: ‘एक घर दूसरे घर पर गिर पड़ता है’
  alternative: ‘एक घराना दूसरे घराने के विरुद्ध होकर गिर जाता है’
  rationale: ἐπί यहाँ ‘पर’ अथवा विरोधात्मक ‘के विरुद्ध’ समझा जा सकता है। मुख्य पाठ स्थानिक छवि को बनाए रखता है, पर पादटिप्पणी सामाजिक-विरोधात्मक समझ को दर्शाती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘अपने ही विरुद्ध बँट जाता है’ सामान्य पाठक के लिए आन्तरिक विभाजन स्पष्ट करता है, जबकि अंतिम उपवाक्य की मूल रूपकात्मक संक्षिप्तता और वास्तविक अर्थगत अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
