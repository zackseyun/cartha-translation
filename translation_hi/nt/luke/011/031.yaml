source:
  edition: SBLGNT
  text: βασίλισσα νότου ἐγερθήσεται ἐν τῇ κρίσει μετὰ τῶν ἀνδρῶν τῆς γενεᾶς ταύτης καὶ κατακρινεῖ αὐτούς· ὅτι ἦλθεν ἐκ τῶν περάτων τῆς γῆς ἀκοῦσαι τὴν σοφίαν Σολομῶνος, καὶ ἰδοὺ πλεῖον Σολομῶνος ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/031.yaml
  text: The queen of the South will rise up in the judgment with the men of this generation and will condemn them[a], because she came from the ends of the earth to hear the wisdom of Solomon, and behold[b], something greater than Solomon is here.
translation:
  language: hi
  text: दक्षिण की रानी न्याय में इस पीढ़ी के पुरुषों के साथ उठ खड़ी होगी और उन्हें दोषी ठहराएगी[a], क्योंकि वह पृथ्वी के छोरों से सुलैमान की बुद्धि सुनने आई थी; और देखो[b], यहाँ सुलैमान से बढ़कर कुछ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह स्त्री जिसे सामान्यतः शीबा की रानी माना जाता है (देखें 1 राजा 10:1–13; 2 इतिहास 9:1–12)।
    reason: cross_reference
  - marker: b
    text: या, ‘सुलैमान से महान कोई।’ यूनानी में नपुंसकलिंग अभिव्यक्ति है, जिसका शाब्दिक अर्थ ‘सुलैमान से बढ़कर कुछ’ है; यह केवल दो व्यक्तियों की सीधी तुलना से अधिक व्यापक बात पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: βασίλισσα νότου
  choice: दक्षिण की रानी
  rationale: यूनानी संबंधवाचक रचना को स्वाभाविक हिन्दी में रखते हुए पुराने नियम के संकेत को सुरक्षित किया गया है, पर मुख्य पाठ में ‘शीबा की रानी’ की व्याख्यात्मक पहचान नहीं जोड़ी गई।
- source_word: ἐγερθήσεται
  choice: उठ खड़ी होगी
  rationale: यह न्याय के दृश्य में उपस्थित होकर खड़े होने का स्वाभाविक अर्थ देता है और साथ ही संभावित पुनरुत्थान-संबंधी अनुगूँज को मिटाता नहीं।
- source_word: ἐν τῇ κρίσει
  choice: न्याय के दिन
  rationale: निश्चित अंतकालीन न्याय को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक ‘न्याय में’ हिन्दी में कम सहज होता।
- source_word: μετὰ τῶν ἀνδρῶν
  choice: पुरुषों के साथ
  rationale: ἀνδρῶν के स्पष्ट पुल्लिंग अर्थ को ‘लोगों’ जैसा सामान्यीकृत किए बिना बनाए रखा गया है।
- source_word: τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी के
  rationale: यीशु के समकालीन वर्तमान वंश-समूह के अर्थ को मानक और सटीक हिन्दी में व्यक्त करता है।
- source_word: κατακρινεῖ αὐτούς
  choice: उन्हें दोषी ठहराएगी
  rationale: κατακρίνω के केवल न्याय करने से अधिक प्रबल, दंडात्मक निर्णय अथवा दोषसिद्धि के भाव को व्यक्त करता है।
- source_word: ἐκ τῶν περάτων τῆς γῆς
  choice: पृथ्वी के छोरों से
  rationale: बहुत दूर स्थान के लिए प्रयुक्त यूनानी मुहावरे की वैश्विक और अलंकारिक शक्ति को सुरक्षित रखता है।
- source_word: ἀκοῦσαι
  choice: सुनने
  rationale: ἦλθεν के साथ प्रयोजन बताने वाले अनंत रूप को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὴν σοφίαν Σολομῶνος
  choice: सुलैमान की बुद्धि
  rationale: सम्बन्ध और अर्थ दोनों को सहज हिन्दी में व्यक्त करते हुए ‘बुद्धि’ को सुनने के उद्देश्य के रूप में बनाए रखता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले प्रवचन-सूचक की बलाघाती भूमिका को वर्तमान, गरिमापूर्ण और समझने योग्य हिन्दी में व्यक्त करता है।
- source_word: πλεῖον Σολομῶνος
  choice: सुलैमान से भी बढ़कर कुछ
  rationale: नपुंसकलिंग πλεῖον को व्यक्तिपरक ‘कोई’ में बदलने के बजाय ‘कुछ’ द्वारा उसकी वास्तविक अस्पष्टता और व्यापक धर्मवैचारिक बल सुरक्षित रखा गया है।
- source_word: ὧδε
  choice: यहाँ ... है
  rationale: वर्तमान स्थानीय उपस्थिति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: रानी की पहचान को मुख्य पाठ में शीबा की रानी के रूप में स्पष्ट करना
  choice: मुख्य पाठ में ‘दक्षिण की रानी’ रखा गया
  alternative: शीबा की रानी
  rationale: पुराने नियम की ओर संकेत प्रबल है, फिर भी यूनानी पाठ स्वयं ‘दक्षिण की रानी’ कहता है। पहचान को पादटिप्पणी में बताना मूल पाठ और व्याख्या का उचित भेद बनाए रखता है।
- issue: πλεῖον Σολομῶνος को किसी व्यक्ति तक सीमित करना
  choice: ‘सुलैमान से भी बढ़कर कुछ’ रखा गया
  alternative: सुलैमान से भी महान कोई
  rationale: यूनानी विशेषण नपुंसकलिंग है। यह यीशु के व्यक्तित्व के साथ-साथ उनकी उपस्थिति, कार्य, राज्य या संदेश की व्यापक वास्तविकता की ओर संकेत कर सकता है; अनुवाद इस तनाव को हल नहीं करता।
- issue: ἐγερθήσεται में पुनरुत्थान को स्पष्ट रूप से जोड़ना
  choice: ‘उठ खड़ी होगी’ रखा गया
  alternative: जिलाई जाएगी
  rationale: अंतकालीन न्याय के संदर्भ में क्रिया पुनरुत्थान की अनुगूँज रख सकती है, पर न्याय में साक्षी के रूप में उठकर खड़े होने का अर्थ भी स्वाभाविक है। चुना गया रूप दोनों संभावनाओं को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘न्याय के दिन’ निश्चित अंतकालीन न्याय को मुहावरेदार हिन्दी में व्यक्त करता है। ‘उठ खड़ी होगी’ और ‘बढ़कर कुछ’ मूल की अर्थगत तथा धर्मवैचारिक खुलावट को सुरक्षित रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
