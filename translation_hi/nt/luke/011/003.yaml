  text: Give us each day our daily bread[a].
translation:
  language: hi
  text: हमारी प्रतिदिन की रोटी हमें हर दिन दे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आने वाले दिन की रोटी,’ ‘जीवन के लिए आवश्यक रोटी,’ या, यहाँ कम संभव, ‘अतिसारभूत रोटी।’ यूनानी विशेषण दुर्लभ है और उसके अर्थ पर मतभेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄρτον
  choice: रोटी
  rationale: यह शब्द मूलतः रोटी को दर्शाता है और यहाँ बुनियादी जीवन-निर्वाह का भी संकेत दे सकता है। ‘रोटी’ ठोस चित्र और प्रार्थना की पारंपरिक शक्ति दोनों बनाए रखती है।
- source_word: ἡμῶν
  choice: हमारी
  rationale: यह ‘रोटी’ से जुड़ा सीधा संबंधवाचक सर्वनाम है।
- source_word: ἐπιούσιον
  choice: प्रतिदिन की
  rationale: यह अत्यंत दुर्लभ और विवादित विशेषण है। लूका में साथ आए τὸ καθ’ ἡμέραν के कारण नियमित दैनिक प्रावधान का अर्थ संदर्भ में स्वाभाविक है; अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: δίδου
  choice: दिया कर
  rationale: वर्तमान काल की आज्ञार्थक क्रिया निरंतर या बार-बार किए जाने वाले कार्य का भाव दे सकती है। ‘दिया कर’ इस प्रार्थना में उस आवर्ती भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἡμῖν
  choice: हमें
  rationale: यह आज्ञार्थक क्रिया का सीधा संप्रदान कारक है।
- source_word: τὸ καθ’ ἡμέραν
  choice: हर दिन
  rationale: यह पदबंध दिन-प्रतिदिन मिलने वाले प्रावधान पर स्पष्ट बल देता है। ‘हर दिन’ लूका के आवर्ती भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: प्रभु की प्रार्थना में ἐπιούσιον का अर्थ
  choice: प्रतिदिन की
  alternative: आनेवाले दिन की; हमारी आवश्यकता की; या, यहाँ कम संभव, अलौकिक रोटी
  rationale: विशेषण का अर्थ विवादित है, पर लूका का τὸ καθ’ ἡμέραν साधारण दैनिक प्रावधान की ओर संकेत करता है। मुख्य पाठ किसी संस्कारगत या तत्त्वमीमांसक अर्थ को आरोपित नहीं करता और वास्तविक अनिश्चितता पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रोटी’ सामान्य पाठक के लिए स्वाभाविक है; ‘दिया कर’ यूनानी वर्तमान आज्ञार्थक के आवर्ती भाव को प्रकट करता है। मुख्य पाठ में ‘प्रतिदिन’ और ‘हर दिन’ की पुनरुक्ति मूल यूनानी के ἐπιούσιον तथा τὸ καθ’ ἡμέραν—दोनों को दृश्यमान रखती है।
