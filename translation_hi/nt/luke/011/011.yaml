  text: τίνα δὲ ⸀ἐξ ὑμῶν τὸν πατέρα αἰτήσει ὁ ⸀υἱὸς ἰχθύν, ⸀καὶ ἀντὶ ἰχθύος ὄφιν ⸂αὐτῷ ἐπιδώσει⸃;
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/011.yaml
  text: What father among you[a], if his son asks for a fish, will give him a snake instead of a fish?
translation:
  language: hi
  text: तुम में ऐसा कौन-सा पिता है कि उसका बेटा उससे मछली माँगे, और वह उसे मछली के बदले साँप[a] दे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सर्प’।
    reason: lexical_alternative
lexical_decisions:
- source_word: τίνα δὲ ἐξ ὑμῶν τὸν πατέρα
  choice: तुम में ऐसा कौन पिता है
  rationale: यह स्वाभाविक हिन्दी में यूनानी मुहावरे और उसके अलंकारिक प्रश्न की शक्ति को बनाए रखता है।
- source_word: αἰτήσει
  choice: माँगे
  rationale: यह भविष्यकालीन यूनानी क्रिया को इस सामान्य, परिकल्पित प्रश्न के अनुरूप सहज हिन्दी में व्यक्त करता है।
- source_word: ὁ υἱὸς
  choice: उसका बेटा
  rationale: संदर्भ में पिता-पुत्र का संबंध निहित है; ‘उसका’ उसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: ἰχθύν / ἰχθύος
  choice: मछली / मछली
  rationale: मूल के एकवचन ठोस उदाहरण को बनाए रखा गया है।
- source_word: ἀντὶ
  choice: के बदले
  rationale: यह प्रतिस्थापन के अर्थ को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ὄφιν
  choice: साँप
  rationale: ‘साँप’ आधुनिक सामान्य हिन्दी का सहज शब्द है और यहाँ अनावश्यक प्रतीकात्मक अर्थ नहीं जोड़ता।
- source_word: αὐτῷ ἐπιδώσει
  choice: उसे … दे
  rationale: यह देने या थमाने के अर्थ और पुत्र को प्राप्तकर्ता के रूप में स्पष्ट रूप से बनाए रखता है।
