translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दरवाज़ा’ के स्थान पर ‘द्वार’ पद्य के अनुरूप संक्षिप्त औपचारिकता देता है। प्रत्यक्ष कथन में विनम्र बहुवचन नहीं, बल्कि प्रसंगानुकूल एकवचन ‘तुम’ रखा गया है।
