source:
  edition: SBLGNT
  text: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ· Μή μοι κόπους πάρεχε· ἤδη ἡ θύρα κέκλεισται, καὶ τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν· οὐ δύναμαι ἀναστὰς δοῦναί σοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/007.yaml
  text: and he from inside answers and says, ‘Do not trouble me. The door has already been shut, and my children are with me in bed. I am not able to get up and give you anything.’
translation:
  language: hi
  text: और वह भीतर से उत्तर में कहता है, ‘मुझे परेशान मत करो। द्वार पहले ही बंद हो चुका है,[a] और मेरे बच्चे मेरे साथ बिस्तर पर हैं।[b] मैं उठकर तुम्हें नहीं दे सकता।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “द्वार पहले ही बंद है।” यूनानी पूर्णकालिक क्रिया बंद करने की पूरी हो चुकी क्रिया या उसके परिणामस्वरूप बनी वर्तमान अवस्था पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “बिस्तर” से आशय घर के सदस्यों की साझा शयन-व्यवस्था से है, वैवाहिक अंतरंगता से नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: κἀκεῖνος ἔσωθεν ἀποκριθεὶς εἴπῃ
  choice: और वह भीतर से उत्तर देता है
  rationale: यूनानी वाक्यांश भीतर से आने वाले उत्तर को और कथा के प्रवाह को व्यक्त करता है। हिन्दी में ‘उत्तर देता है’ कृदन्त और मुख्य क्रिया के संयुक्त भाव को स्वाभाविक रूप से समेटता है।
- source_word: Μή μοι κόπους πάρεχε
  choice: मुझे परेशान मत करो
  rationale: यह यूनानी मुहावरा किसी को कष्ट या असुविधा देने के अर्थ में है; चुना हुआ रूप आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: ἤδη ἡ θύρα κέκλεισται
  choice: द्वार पहले ही बंद हो चुका है
  rationale: पूर्णकालिक क्रिया पहले पूरी हुई क्रिया और उसकी वर्तमान परिणामी अवस्था, दोनों का संकेत दे सकती है। ‘बंद हो चुका है’ उस पूर्णता को बनाए रखता है, जबकि ‘द्वार’ गरिमापूर्ण और सहज है।
- source_word: τὰ παιδία μου μετ’ ἐμοῦ εἰς τὴν κοίτην εἰσίν
  choice: मेरे बच्चे मेरे साथ सोने की जगह पर हैं
  rationale: κοίτη यहाँ घर की साझा शयन-व्यवस्था या सोने की जगह को सूचित करता है। यह रूप आधुनिक पाठक के लिए सांस्कृतिक आशय स्पष्ट करता है और वैवाहिक अंतरंगता का अनुचित संकेत टालता है।
- source_word: οὐ δύναμαι ἀναστὰς δοῦναί σοι
  choice: मैं उठकर तुम्हें नहीं दे सकता
  rationale: ‘उठकर’ सहायक कृदन्त की पूर्ववर्ती क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है। यूनानी में दी जाने वाली वस्तु का कर्म प्रसंग से समझा जाता है, इसलिए पाठ में ‘कुछ’ नहीं जोड़ा गया।
