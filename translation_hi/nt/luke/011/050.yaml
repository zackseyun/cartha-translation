source:
  edition: SBLGNT
  text: ἵνα ἐκζητηθῇ τὸ αἷμα πάντων τῶν προφητῶν τὸ ἐκκεχυμένον ἀπὸ καταβολῆς κόσμου ἀπὸ τῆς γενεᾶς ταύτης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/050.yaml
  text: so that the blood of all the prophets[a], shed from the foundation of the world, may be required of this generation,
translation:
  language: hi
  text: ताकि संसार की नींव डाले जाने के समय से बहाए गए सभी भविष्यद्वक्ताओं के लहू का हिसाब[a] इस पीढ़ी से लिया जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लहू की जवाबदेही इस पीढ़ी से माँगी जाए।” यहाँ प्रयुक्त क्रिया में रक्तपात के लिए किसी को जवाबदेह ठहराने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἵνα
  choice: ताकि
  rationale: यह पिछले कथन से जुड़े उद्देश्य या परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐκζητηθῇ
  choice: हिसाब ... लिया जाए
  rationale: इस प्रसंग में क्रिया का भाव न्यायिक जवाबदेही ठहराने का है; यह प्रयोग रक्तपात के लिए लेखा माँगे जाने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: τὸ αἷμα
  choice: लहू
  rationale: मूल पाठ के ठोस रूपक को बनाए रखता है; यहाँ लहू भविष्यद्वक्ताओं की हत्या और उससे उत्पन्न दोष की ओर संकेत करता है।
- source_word: πάντων τῶν προφητῶν
  choice: सभी भविष्यद्वक्ताओं के
  rationale: समस्त भविष्यद्वक्ताओं को समेटने वाले यूनानी पदबंध का सीधा और स्पष्ट अनुवाद है।
- source_word: τὸ ἐκκεχυμένον
  choice: बहाए गए
  rationale: लहू के साथ यह स्वाभाविक हिन्दी प्रयोग है और हिंसक मृत्यु का अर्थ स्पष्ट करता है।
- source_word: ἀπὸ καταβολῆς κόσμου
  choice: संसार की नींव डाले जाने के समय से
  rationale: ‘संसार की नींव’ वाले मूल बिंब को सुरक्षित रखते हुए आरम्भ-बिंदु का अर्थ स्पष्ट करता है।
- source_word: ἀπὸ τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी से
  rationale: दूसरा ἀπό उस पक्ष को बताता है जिससे जवाबदेही माँगी जाती है; ‘इस पीढ़ी से’ इसे सीधे रूप में बनाए रखता है।
theological_decisions:
- issue: भविष्यद्वक्ताओं के लहू का हिसाब लिए जाने का स्वरूप
  choice: इसे इस पीढ़ी को रक्तपात के लिए न्यायिक रूप से जवाबदेह ठहराने वाले कथन के रूप में अनूदित किया गया है।
  alternative: इसे केवल परमेश्वर के दूतों को ठुकराने की ऐतिहासिक निरंतरता बताने वाला आलंकारिक कथन समझा जा सकता है।
  rationale: रक्तपात के संदर्भ में ἐκζητέω का कर्मवाच्य प्रयोग हिसाब माँगने या जवाबदेही ठहराने का प्रबल अर्थ रखता है। अनुवाद उस न्यायिक भाव को रखता है, पर सामूहिक दोष के स्वरूप को पद से आगे जाकर परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लहू’ मूल के बिंब और बाइबलीय गंभीरता को बनाए रखता है, जबकि ‘हिसाब लिया जाए’ न्यायिक अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
