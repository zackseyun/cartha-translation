    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνεδρεύοντες
  choice: घात में लगे थे
  rationale: यह पद शत्रुतापूर्ण ढंग से अवसर की प्रतीक्षा करने और फँसाने के इरादे को व्यक्त करता है; ‘घात में लगे थे’ इस भाव को स्वाभाविक और सजीव हिन्दी में बनाए रखता है।
- source_word: αὐτόν
  choice: उसकी
  rationale: सर्वनाम का संदर्भ यीशु से है। ‘उसकी घात में’ हिन्दी मुहावरे के अनुसार यूनानी कर्मवाचक सर्वनाम को स्वाभाविक रूप में व्यक्त करता है।
- source_word: θηρεῦσαί
  choice: पकड़ सकें
  rationale: क्रिया में शिकार पकड़ने का रूपक है; यहाँ इसका आशय यीशु की कही हुई किसी बात को उनके विरुद्ध पकड़ लेने से है।
- source_word: τι
  choice: किसी बात को
  rationale: अनिश्चित सर्वनाम का अर्थ ‘कुछ’ है; प्रसंग में वह बोली गई कोई बात है, इसलिए ‘किसी बात’ स्पष्ट और स्वाभाविक है।
- source_word: ἐκ τοῦ στόματος αὐτοῦ
  choice: उसके मुँह से निकली
  rationale: यह अभिव्यक्ति बोले हुए शब्दों को दर्शाती है। चयन मूल की ‘मुँह’ वाली ठोस छवि को रखते हुए हिन्दी में वाक्य को स्वाभाविक बनाता है।
