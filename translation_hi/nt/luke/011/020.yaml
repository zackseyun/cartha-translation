id: LUK.11.20
reference: Luke 11:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ἐν δακτύλῳ ⸀θεοῦ ἐκβάλλω τὰ δαιμόνια, ἄρα ἔφθασεν ἐφ’ ὑμᾶς ἡ βασιλεία τοῦ θεοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/020.yaml
  text: But if I cast out the demons by the finger of God[b][a], then the kingdom of God has come upon you.
translation:
  language: hi
  text: लेकिन यदि मैं परमेश्वर की उँगली से[a] दुष्टात्माओं को निकालता हूँ, तो परमेश्वर का राज्य तुम पर आ पहुँचा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘परमेश्वर की उँगली के द्वारा।’ यह वाक्यांश परमेश्वर की प्रत्यक्ष सामर्थ्य का चित्र है और निर्गमन 8:19 की प्रतिध्वनि है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुम तक पहुँच चुका है’; अथवा ‘तुम्हें आ पकड़ा है।’
    reason: alternative_reading
lexical_decisions:
- source_word: ἐν δακτύλῳ θεοῦ
  choice: परमेश्वर की उँगली से
  rationale: ‘से’ साधन अथवा कर्तृत्व का भाव व्यक्त करता है और यूनानी के सजीव रूपक को बनाए रखता है। यह वाक्यांश परमेश्वर की प्रत्यक्ष सामर्थ्य की ओर संकेत करता है और निर्गमन 8:19 की प्रतिध्वनि भी सुरक्षित रखता है।
- source_word: ἐκβάλλω
  choice: निकालता हूँ
  rationale: सुसमाचारों में दुष्टात्माओं को किसी व्यक्ति से बाहर करने के लिए यह स्वाभाविक और स्पष्ट आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं
  rationale: यह δαιμόνια का प्रचलित और सीधा हिन्दी समतुल्य है; ‘अशुद्ध आत्माएँ’ यूनानी के एक अलग पदबंध का अनुवाद होता।
- source_word: ἄρα
  choice: तो
  rationale: यह शर्त से निकलने वाले निष्कर्ष को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἔφθασεν ἐφ’ ὑμᾶς
  choice: तुम पर आ पहुँचा है
  rationale: यह राज्य के निर्णायक रूप से पहुँच जाने का भाव तथा श्रोताओं की ओर उसकी गति—दोनों को बनाए रखता है।
- source_word: ἡ βασιλεία τοῦ θεοῦ
  choice: परमेश्वर का राज्य
  rationale: यह परिचित और सटीक अभिव्यक्ति βασιλεία में निहित राज्य और शासन—दोनों पहलुओं के लिए खुली रहती है।
theological_decisions:
- issue: ‘परमेश्वर की उँगली’ का अर्थ
  choice: परमेश्वर की प्रत्यक्ष सामर्थ्य अथवा क्रियाशीलता का रूपक, जिसे मुख्य पाठ में उसी चित्रात्मक रूप में रखा गया है।
  alternative: मत्ती 12:28 से तुलना करके इसे मुख्य पाठ में सीधे ‘पवित्र आत्मा’ कहना।
  rationale: लूका की विशिष्ट शब्दावली और निर्गमन की प्रतिध्वनि को सुरक्षित रखना चाहिए; अनुवाद व्याख्या को पाठ में मिलाकर रूपक को समाप्त नहीं करता।
- issue: ‘परमेश्वर का राज्य तुम पर आ पहुँचा है’ का बल
  choice: यीशु की सेवकाई में परमेश्वर के राज्य के वर्तमान और निर्णायक आगमन की घोषणा।
  alternative: राज्य को केवल भविष्य की घटना मानना, अथवा इस वाक्यांश को केवल प्रतिकूल अर्थ में ‘तुम्हें आ पकड़ा है’ समझना।
  rationale: ἔφθασεν यहाँ पहुँच जाने का पूर्ण और निर्णायक भाव देता है। हिन्दी पाठ इस वर्तमान आगमन को व्यक्त करता है, पर किसी विस्तृत युगांत-विषयक प्रणाली को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सहज बोधगम्य रूप अपनाया गया है। ‘लेकिन यदि … तो’ यूनानी की शर्त और निष्कर्ष की संरचना को स्वाभाविक हिन्दी में रखता है; रूपक और राज्य के आगमन से जुड़ी अर्थगत तीव्रता को बिना अनावश्यक व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
