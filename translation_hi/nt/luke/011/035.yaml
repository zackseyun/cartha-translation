  text: σκόπει οὖν μὴ τὸ φῶς τὸ ἐν σοὶ σκότος ἐστίν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/035.yaml
  text: Therefore[a], watch out lest the light in you be darkness.
translation:
  language: hi
  text: इसलिए सावधान रहो कि तुम्हारे भीतर का उजियाला कहीं अँधेरा न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σκόπει
  choice: सावधान रहो
  rationale: वर्तमान काल का आज्ञार्थक रूप निरंतर सतर्कता और चेतावनी का भाव देता है। ‘सावधान रहो’ आधुनिक हिन्दी में स्वाभाविक है और यूनानी क्रिया का चेतावनीपूर्ण बल बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले कथन—आँख, ज्योति और शरीर—से निकलने वाले निष्कर्ष को स्पष्ट करता है।
- source_word: μὴ
  choice: कहीं ... न हो
  rationale: आज्ञार्थक क्रिया के साथ μή किसी अवांछित संभावना के प्रति चेतावनी देता है; हिन्दी में ‘कहीं ... न हो’ इसका स्वाभाविक समतुल्य है।
- source_word: τὸ φῶς τὸ ἐν σοὶ
  choice: तुम्हारे भीतर का उजियाला
  rationale: यह वाक्यांश भीतर विद्यमान ज्योति को दर्शाता है। ‘उजियाला’ प्रकाश-अँधकार के रूपक को स्पष्ट और गरिमापूर्ण हिन्दी में सुरक्षित रखता है, बिना उसका अर्थ विवेक, समझ या आत्मिक दशा तक सीमित किए।
- source_word: σκότος
  choice: अँधेरा
  rationale: यह ‘उजियाला’ के सीधे विरोध को बनाए रखता है और मूल के व्यापक नैतिक तथा आत्मिक रूपक को अनिर्धारित छोड़ता है।
- source_word: ἐστίν
  choice: हो
  rationale: निषेधात्मक चेतावनी की हिन्दी संरचना ‘कहीं ... न हो’ में सामान्य संयोजक क्रिया का स्वाभाविक रूप है।
theological_decisions:
- issue: ‘उजियाला’ और ‘अँधेरा’ का रूपकात्मक अर्थ
  choice: मुख्य पाठ में रूपक को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
  alternative: ‘तुम्हारी समझ’, ‘तुम्हारा अंतर्मन’ या ‘तुम्हारा विवेक’
  rationale: यूनानी पाठ रूपक का अर्थ किसी एक मनोवैज्ञानिक, नैतिक या आत्मिक धारणा तक सीमित नहीं करता। इसलिए उसकी व्यापकता और धार्मिक तनाव को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण है। एकवचन संबोधन के लिए ‘तुम्हारे’ और ‘रहो’ प्रयुक्त हुए हैं। ‘उजियाला’ तथा ‘अँधेरा’ तत्काल संदर्भ के प्रकाश-अँधकार विरोध को स्वाभाविक हिन्दी में बनाए रखते हैं।
