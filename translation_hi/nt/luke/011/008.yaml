id: LUK.11.8
reference: Luke 11:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: λέγω ὑμῖν, εἰ καὶ οὐ δώσει αὐτῷ ἀναστὰς διὰ τὸ εἶναι ⸂φίλον αὐτοῦ⸃, διά γε τὴν ἀναίδειαν αὐτοῦ ἐγερθεὶς δώσει αὐτῷ ⸀ὅσων χρῄζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/008.yaml
  text: I tell you[a], even if he will not get up and give him anything because he is his friend, yet because of his shameless persistence he will get up and give him whatever he needs.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, भले ही वह उसका मित्र होने के कारण उठकर उसे कुछ न दे, फिर भी उसके बेशर्म आग्रह[a] के कारण वह उठेगा और उसे जो कुछ चाहिए, दे देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी धृष्टता,’ ‘उसके साहस,’ अथवा अधिक शाब्दिक रूप से ‘उसकी निर्लज्जता।’
    reason: ἀναίδεια के अर्थ-क्षेत्र और इस प्रसंग में उसके संभावित अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: λέγω ὑμῖν
  choice: मैं तुमसे कहता हूँ
  rationale: यीशु के सीधे संबोधन का मानक और स्वाभाविक हिन्दी रूप; मूल के बहुवचन ‘तुमसे’ को बनाए रखता है।
- source_word: εἰ καὶ οὐ δώσει αὐτῷ
  choice: भले ही ... उसे कुछ न दे
  rationale: εἰ καί के रियायती भाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘कुछ’ मूल में निहित कर्म को संदर्भ के अनुसार स्पष्ट करता है।
- source_word: ἀναστὰς
  choice: उठकर
  rationale: घरेलू प्रसंग में बिस्तर से शारीरिक रूप से उठने का स्वाभाविक अर्थ देता है।
- source_word: διὰ τὸ εἶναι φίλον αὐτοῦ
  choice: उसका मित्र होने के कारण
  rationale: कारणसूचक रचना और व्यक्तिगत मित्र-संबंध, दोनों को सीधे बनाए रखता है।
- source_word: διά γε
  choice: फिर भी ... के कारण
  rationale: मित्रता से अपेक्षित सहायता और वास्तव में प्रभावी कारण के बीच जोरदार विरोध को व्यक्त करता है।
- source_word: ἀναίδειαν
  choice: बेशर्म आग्रह
  rationale: ἀναίδεια के ‘लज्जा का अभाव’ वाले तीखे शाब्दिक भाव को ‘बेशर्म’ से और प्रसंगगत लगातार माँगने के भाव को ‘आग्रह’ से व्यक्त करता है।
- source_word: ἐγερθεὶς
  choice: वह उठेगा
  rationale: इस प्रसंग में बिस्तर से उठने की क्रिया है; हिन्दी में मुख्य क्रिया के रूप में रखने से वाक्य स्वाभाविक रहता है।
- source_word: ὅσων χρῄζει
  choice: जो कुछ उसे चाहिए
  rationale: आवश्यक सभी वस्तुओं या पूरी अपेक्षित मात्रा को सहज और व्यापक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दृष्टांत में ἀναίδεια का अर्थ
  choice: ‘बेशर्म आग्रह’—माँगने वाले का संकोच छोड़कर आग्रह करते रहना
  alternative: ‘निर्लज्जता’, ‘धृष्टता’ या ‘साहस’
  rationale: यह पद केवल सद्गुण के रूप में साहस नहीं कहता; शब्द में सामाजिक लज्जा या संकोच की सीमा लाँघने का नुकीला भाव है। साथ ही, ‘आग्रह’ प्रसंग में उसकी लगातार माँग को स्पष्ट करता है, बिना इस तनाव को मिटाए कि व्यवहार को बेशर्म माना जा सकता था।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेशर्म आग्रह’ सामान्य पाठक के लिए स्पष्ट है और मूल शब्द की तीक्ष्णता भी बनाए रखता है। सर्वनाम ‘उसका/उसके/उसे’ मूल की सर्वनामगत संरचना को अनावश्यक व्याख्या के बिना बनाए रखते हैं।
