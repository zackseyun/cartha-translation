language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἀλλὰ οὐαὶ ὑμῖν τοῖς Φαρισαίοις, ὅτι ἀποδεκατοῦτε τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον, καὶ παρέρχεσθε τὴν κρίσιν καὶ τὴν ἀγάπην τοῦ θεοῦ· ταῦτα ⸀δὲ ἔδει ποιῆσαι κἀκεῖνα μὴ ⸀παρεῖναι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/042.yaml
  text: But woe to you Pharisees, because you tithe mint and rue and every herb, and you pass by justice and the love of God. These things you ought to have done, without neglecting those things.
translation:
  language: hi
  text: पर हे फ़रीसियो, तुम पर हाय! क्योंकि तुम पुदीने, सुदाब और हर तरह के साग-पात का दसवाँ अंश तो देते हो, पर न्याय और परमेश्वर के प्रेम को अनदेखा कर देते हो। तुम्हें ये बातें करनी चाहिए थीं और वे भी नहीं छोड़नी चाहिए थीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: तुम पर हाय
  rationale: यह भविष्यदर्शी चेतावनी और दुःख-घोषणा की तीव्रता बनाए रखता है; केवल ‘धिक्कार’ कहने से निंदा का भाव अधिक संकीर्ण हो सकता है।
- source_word: ἀποδεκατοῦτε
  choice: दसवाँ अंश देते हो
  rationale: क्रिया का धार्मिक-सांस्कृतिक अर्थ स्पष्ट और सामान्य हिन्दी में व्यक्त होता है।
- source_word: τὸ ἡδύοσμον καὶ τὸ πήγανον καὶ πᾶν λάχανον
  choice: पुदीने, सुदाब और हर तरह के साग-पात
  rationale: पौधों की ठोस सूची को बनाए रखा गया है; λάχανον यहाँ व्यापक रूप से बगीचे की खाद्य वनस्पति या साग को सूचित करता है।
- source_word: παρέρχεσθε
  choice: अनदेखा कर देते हो
  rationale: मूल क्रिया का अर्थ ‘पास से निकल जाना/उपेक्षा करना’ है; हिन्दी में यह स्वाभाविक रूप से जानबूझकर ध्यान न देने का भाव देता है, बिना उसे केवल भूलवश हुई उपेक्षा तक सीमित किए।
- source_word: τὴν κρίσιν
  choice: न्याय
  rationale: κρίσις का यहाँ नैतिक और सामाजिक न्याय का अर्थ प्रसंगानुकूल है।
- source_word: τὴν ἀγάπην τοῦ θεοῦ
  choice: परमेश्वर के प्रेम
  rationale: 'यूनानी संबंधकारक की वास्तविक अस्पष्टता को बनाए रखता है: यह परमेश्वर के प्रति प्रेम या परमेश्वर से आनेवाले प्रेम—दोनों की ओर संकेत कर सकता है।'
- source_word: ταῦτα ... κἀκεῖνα
  choice: इन्हें ... उन्हें भी
  rationale: निकटवर्ती ‘न्याय और परमेश्वर के प्रेम’ को प्राथमिक ‘इन्हें’ तथा पहले कही दशमांश-प्रथा को ‘उन्हें भी’ से दर्शाया गया है।
theological_decisions:
- issue: ‘परमेश्वर के प्रेम’ में संबंधकारक की दिशा
  choice: अस्पष्ट संबंध को यथावत रखा गया
  alternative: ‘परमेश्वर से प्रेम’ या ‘परमेश्वर का तुम्हारे प्रति प्रेम’
  rationale: τοῦ θεοῦ व्याकरणतः वस्तुवाचक या कर्तृवाचक संबंधकारक हो सकता है; पाठ स्वयं किसी एक अर्थ को निर्णायक रूप से नहीं चुनता।
- issue: दशमांश देने और न्याय/प्रेम के बीच संबंध
  choice: न्याय और प्रेम को करना आवश्यक बताया, साथ ही दशमांश को न छोड़ने की बात रखी
  alternative: दशमांश को निरस्त या गौण आज्ञा के रूप में प्रस्तुत करना
  rationale: ἔδει और μὴ παρεῖναι दोनों दायित्वों को व्यक्त करते हैं, जबकि वाक्य का बल न्याय और प्रेम की उपेक्षा पर है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में ‘फ़रीसियो’ और चेतावनी में ‘तुम पर हाय’ से बाइबलीय गरिमा रखी गई है। ‘सुदाब’ अपेक्षाकृत अपरिचित वनस्पति-नाम है, पर मूल की विशिष्ट सूची को सुरक्षित रखने के लिए रखा गया है।
