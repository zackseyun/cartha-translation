source:
  edition: SBLGNT
  text: καθὼς γὰρ ἐγένετο ⸀Ἰωνᾶς ⸂τοῖς Νινευίταις σημεῖον⸃, οὕτως ἔσται καὶ ὁ υἱὸς τοῦ ἀνθρώπου τῇ γενεᾷ ταύτῃ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/030.yaml
  text: For just as Jonah became a sign to the Ninevites[a], so also the Son of Man will be to this generation.
translation:
  language: hi
  text: क्योंकि जैसे योना नीनवे के लोगों के लिए एक चिन्ह बना, वैसे ही मनुष्य का पुत्र भी इस पीढ़ी के लिए एक चिन्ह होगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में दूसरे उपवाक्य में “चिन्ह” शब्द दोहराया नहीं गया है; “इस पीढ़ी के लिए एक चिन्ह होगा” का भाव योना के साथ की गई समानता से समझ में आता है।
    reason: मूल पाठ में निहित विधेय को स्पष्ट करना
lexical_decisions:
- source_word: καθὼς γὰρ
  choice: क्योंकि जैसे
  rationale: γάρ के व्याख्यात्मक संबंध और καθώς की तुलना—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγένετο
  choice: बना
  rationale: यहाँ γίνομαι का भाव केवल अस्तित्व का नहीं, बल्कि चिन्ह के रूप में प्रकट या कार्यरत होने का है; “बना” इस परिणामसूचक अर्थ को व्यक्त करता है।
- source_word: Ἰωνᾶς
  choice: योना
  rationale: इस बाइबिलीय व्यक्ति के नाम का प्रचलित हिन्दी रूप।
- source_word: τοῖς Νινευίταις
  choice: नीनवे के लोगों के लिए
  rationale: सम्बन्धसूचक सम्प्रदान कारक को सहज हिन्दी में व्यक्त करता है। “नीनवेवासी” सम्भव है, पर “नीनवे के लोग” सामान्य पाठकों के लिए अधिक स्वाभाविक है।
- source_word: σημεῖον
  choice: एक चिन्ह
  rationale: लूका में यह प्रकाशनात्मक महत्त्व रखने वाले संकेत को दर्शाता है; “चिन्ह” मानक और प्रसंगानुकूल शब्द है।
- source_word: οὕτως ... καὶ
  choice: वैसे ही ... भी
  rationale: καθώς के साथ तुलनात्मक सहसम्बन्ध और καί के योगात्मक बल को स्पष्ट रूप से बनाए रखता है।
- source_word: ἔσται
  choice: होगा
  rationale: εἰμί के भविष्यत् रूप का सीधा अनुवाद है; पहले उपवाक्य से “चिन्ह” का विधेय स्वतः समझा जाता है।
- source_word: ὁ υἱὸς τοῦ ἀνθρώπου
  choice: मनुष्य का पुत्र
  rationale: सुसमाचारों में प्रयुक्त इस उपाधि का स्थापित हिन्दी रूप है और इसके शाब्दिक तथा मसीही/प्रलयकालीन अनुनाद को सुरक्षित रखता है।
- source_word: τῇ γενεᾷ ταύτῃ
  choice: इस पीढ़ी के लिए
  rationale: सम्बन्ध या संदर्भ व्यक्त करने वाले सम्प्रदान कारक को स्वाभाविक हिन्दी में रखता है और γενεά के पीढ़ीगत तथा भविष्यद्वक्तीय बल को बनाए रखता है।
theological_decisions:
- issue: दूसरे उपवाक्य में निहित विधेय
  choice: “मनुष्य का पुत्र भी इस पीढ़ी के लिए होगा,” जिसमें पहले उपवाक्य से “एक चिन्ह” निहित समझा जाता है।
  alternative: “मनुष्य का पुत्र भी इस पीढ़ी के लिए एक चिन्ह होगा।”
  rationale: यूनानी पाठ दूसरे उपवाक्य में σημεῖον को दोहराता नहीं है, यद्यपि समानान्तर रचना उसका अर्थ स्पष्ट करती है। मुख्य पाठ की हिन्दी इस निहित अर्थ को स्वाभाविक रूप से ग्रहण करने देती है और मूल की संक्षिप्तता भी बनाए रखती है।
- issue: “मनुष्य का पुत्र” का अर्थ
  choice: पारम्परिक उपाधि “मनुष्य का पुत्र” को बिना व्याख्यात्मक विस्तार के बनाए रखना।
  alternative: “मानव-पुत्र” या “वह मानव”
  rationale: मूल पद शाब्दिक भी है और उपाधि-सदृश भी। स्थापित रूप इसकी धर्मवैज्ञानिक और अन्तर्पाठीय अर्थ-सम्भावनाओं को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। “नीनवे के लोगों” को अपेक्षाकृत सहज अभिव्यक्ति के रूप में चुना गया है; वाक्य की समानान्तर संरचना मूल यूनानी की तुलना और निहित विधेय दोनों को सुरक्षित रखती है।
