id: LUK.11.33
reference: Luke 11:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀Οὐδεὶς λύχνον ἅψας εἰς κρύπτην τίθησιν οὐδὲ ὑπὸ τὸν μόδιον ἀλλ’ ἐπὶ τὴν λυχνίαν, ἵνα οἱ εἰσπορευόμενοι τὸ ⸀φέγγος βλέπωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/033.yaml
  text: No one[a], after lighting a lamp, puts it in a hidden place or under a basket, but on a lampstand[b], so that those who enter may see the light.
translation:
  language: hi
  text: कोई भी व्यक्ति दीपक जलाकर उसे किसी छिपी जगह[a] में या अनाज नापने की टोकरी[b] के नीचे नहीं रखता, बल्कि दीपदान पर रखता है, ताकि भीतर आनेवाले उसका प्रकाश देख सकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तहखाने में’ अथवा ‘किसी गुप्त स्थान में’; यूनानी κρύπτη किसी छिपे स्थान को दर्शा सकता है, जिसमें भूमिगत भंडारण-स्थान भी शामिल है।
    reason: lexical_alternative
  - marker: b
    text: यूनानी μόδιος सूखी वस्तु नापने की एक इकाई और उस माप के पात्र को भी दर्शाता है; परंपरागत अनुवादों में इसे कभी-कभी ‘बुशल’ या ‘बुशल की टोकरी’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Οὐδεὶς
  choice: कोई भी व्यक्ति नहीं
  rationale: सार्वभौमिक निषेध को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है। वाक्य में ‘कोई भी व्यक्ति ... नहीं रखता’ के रूप में व्यवस्थित किया गया है।
- source_word: λύχνον
  choice: दीपक
  rationale: यह शब्द हाथ में उठाए जा सकने वाले तेल के दीपक को सूचित करता है; ‘दीपक’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: ἅψας
  choice: जलाकर
  rationale: अओरिस्ट कृदन्त मुख्य क्रिया से पहले हुई क्रिया बताता है; ‘जलाकर’ उसी क्रम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: εἰς κρύπτην
  choice: किसी छिपी जगह में
  rationale: κρύπτη छिपे स्थान, तहखाने या भंडारण-स्थान का बोध करा सकता है। व्यापक अभिव्यक्ति उस वास्तविक अस्पष्टता को बनाए रखते हुए छिपाने के भाव पर ध्यान रखती है।
- source_word: τίθησιν
  choice: रखता
  rationale: स्थान पर रखने की साधारण क्रिया के लिए स्पष्ट और स्वाभाविक हिन्दी क्रिया।
- source_word: ὑπὸ τὸν μόδιον
  choice: अनाज नापने की टोकरी के नीचे
  rationale: μόδιος सूखी वस्तु नापने की इकाई और उस माप के पात्र दोनों को दर्शाता है। यह चयन आधुनिक पाठक के लिए वस्तु और उसके प्रयोजन को स्पष्ट करता है, बिना अंग्रेज़ी ‘बुशल’ माप आयात किए।
- source_word: ἐπὶ τὴν λυχνίαν
  choice: दीपदान पर
  rationale: λυχνία विशेष रूप से दीपक रखने के आधार को दर्शाता है; ‘दीपदान’ संक्षिप्त, प्रतिष्ठित और अर्थ-सटीक है।
- source_word: ἵνα
  choice: ताकि
  rationale: उद्देश्यसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ εἰσπορευόμενοι
  choice: भीतर आनेवाले
  rationale: संज्ञा के रूप में प्रयुक्त वर्तमान कृदन्त को सहज रूप देता है और प्रवेश करने वाले लोगों की सामान्य श्रेणी बनाए रखता है।
- source_word: τὸ φέγγος
  choice: उसका प्रकाश
  rationale: φέγγος का अर्थ प्रकाश या चमक है। दीपक के संदर्भ में ‘प्रकाश’ स्वाभाविक है; ‘उसका’ हिन्दी में दीपक से संबंध स्पष्ट करता है।
- source_word: βλέπωσιν
  choice: देख सकें
  rationale: ἵνα के बाद का विधिलिंग उद्देश्य और अपेक्षित संभावना व्यक्त करता है; ‘देख सकें’ आधुनिक हिन्दी में दोनों को स्वाभाविक रूप से संप्रेषित करता है।
theological_decisions:
- issue: κρύπτη की स्थान-संबंधी अस्पष्टता
  choice: मुख्य पाठ में व्यापक ‘छिपी जगह’
  alternative: तहखाना; गुप्त स्थान; भंडारघर
  rationale: कथन का बल प्रकाश छिपाने की असंगति पर है, किसी निश्चित वास्तु-स्थान पर नहीं। व्यापक अनुवाद यूनानी शब्द की अर्थ-सीमा को अनावश्यक रूप से संकीर्ण नहीं करता।
- issue: μόδιος का वस्तु और माप दोनों होना
  choice: मुख्य पाठ में ‘अनाज नापने की टोकरी’
  alternative: नापने का पात्र; मोदियोस माप का पात्र; बुशल
  rationale: यह रूप पात्र के मापने वाले कार्य और दीपक को ढकने वाली ठोस वस्तु, दोनों को स्पष्ट करता है। किसी आधुनिक या अंग्रेज़ी माप-इकाई से इसकी गलत समानता नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘दीपक’, ‘दीपदान’ और ‘प्रकाश’ परिचित शब्दावली रखते हैं। पाद-टिप्पणी चिह्न उन्हीं शब्दों के बाद लगाए गए हैं जिनकी वैकल्पिक व्याख्या दी गई है।
