  text: διὰ τοῦτο καὶ ἡ σοφία τοῦ θεοῦ εἶπεν· Ἀποστελῶ εἰς αὐτοὺς προφήτας καὶ ἀποστόλους, καὶ ἐξ αὐτῶν ἀποκτενοῦσιν καὶ ⸀διώξουσιν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/049.yaml
  text: For this reason also the wisdom of God said[a], ‘I will send to them prophets and apostles, and some of them they will kill and persecute,’
translation:
  language: hi
  text: इसी कारण परमेश्वर की बुद्धि ने भी कहा[a], “मैं उनके पास भविष्यद्वक्ताओं और प्रेरितों को भेजूँगा, और उनमें से कुछ को वे मार डालेंगे और सताएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की प्रज्ञा।” इस पदबंध को दिव्य बुद्धि के व्यक्तिकरण, परमेश्वर के बुद्धिमान निर्णय, या यीशु के अप्रत्यक्ष आत्म-संदर्भ के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διὰ τοῦτο
  choice: इसी कारण
  rationale: यह स्वाभाविक हिन्दी में पिछले कथन से कारणात्मक और निष्कर्षात्मक संबंध बनाए रखता है।
- source_word: καὶ
  choice: भी
  rationale: यहाँ इसका योगात्मक बल है; ‘ने भी कहा’ हिन्दी में स्वाभाविक है।
- source_word: ἡ σοφία τοῦ θεοῦ
  choice: परमेश्वर की बुद्धि
  rationale: मूल के संबंधसूचक पदबंध को निकटता से रखते हुए यह व्यक्तिकरण, परमेश्वर के बुद्धिमान निर्णय, अथवा यीशु के अप्रत्यक्ष आत्म-संदर्भ की संभावनाएँ खुली छोड़ता है।
- source_word: εἶπεν
  choice: कहा
  rationale: सरल भूतकालीन क्रिया का सहज और न्यूनतम व्याख्यात्मक अनुवाद।
- source_word: Ἀποστελῶ
  choice: मैं ... भेजूँगा
  rationale: भविष्यकाल और प्रेषण का सीधा अर्थ सुरक्षित रहता है।
- source_word: εἰς αὐτούς
  choice: उनके पास
  rationale: भेजने की क्रिया के साथ लक्ष्य को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: προφήτας
  choice: भविष्यद्वक्ताओं
  rationale: प्रचलित और संदर्भानुकूल धार्मिक पद।
- source_word: ἀποστόλους
  choice: प्रेरितों
  rationale: लूका-प्रेरितों के काम में प्रयुक्त विशिष्ट भूमिका/पद को सामान्य ‘दूतों’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: ἐξ αὐτῶν
  choice: उनमें से कुछ
  rationale: मूल के अंशवाचक अर्थ को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: ἀποκτενοῦσιν
  choice: मार डालेंगे
  rationale: हत्या/प्राण लेने का सीधा और स्वाभाविक अर्थ देता है।
- source_word: διώξουσιν
  choice: सताएँगे
  rationale: इस शत्रुतापूर्ण संदर्भ में उत्पीड़न का अर्थ स्पष्ट करता है और आधुनिक हिन्दी में सहज है।
theological_decisions:
- issue: ‘परमेश्वर की बुद्धि’ का आशय
  choice: वाक्यांश को ‘परमेश्वर की बुद्धि’ ही रखा गया है, बिना इसे स्पष्ट रूप से यीशु, पवित्रशास्त्र, या किसी पृथक व्यक्त सत्ता के रूप में पहचानने के।
  alternative: इसे दिव्य बुद्धि का व्यक्तिकरण, परमेश्वर का बुद्धिमान निर्णय, या यीशु का अप्रत्यक्ष आत्म-संदर्भ समझा जा सकता है।
  rationale: यूनानी पदबंध और संदर्भ एक से अधिक व्याख्याओं की अनुमति देते हैं; अनुवाद किसी एक को अनावश्यक रूप से निश्चित नहीं करता।
- issue: दो क्रियाओं के साथ अंशवाचक समूह का संबंध
  choice: ‘कुछ को ... और कुछ को ...’
  alternative: ‘उनमें से कुछ को वे मार डालेंगे और सताएँगे’
  rationale: यूनानी में ἐξ αὐτῶν दोनों भविष्यकालीन क्रियाओं के साथ है और यह अनिश्चित है कि वही व्यक्ति दोनों कार्रवाइयों का शिकार हैं या समूह के अलग-अलग सदस्य। हिन्दी में दो बार ‘कुछ को’ कहना स्वाभाविक रूप से समूह के भीतर भिन्न संभावित पीड़ितों को व्यक्त करता है, पर सभी को एक ही परिणाम देना आवश्यक नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भविष्यद्वक्ता’ और ‘प्रेरित’ स्थापित बाइबलीय पद हैं। प्रत्यक्ष कथन में स्वाभाविक हिन्दी शब्दक्रम अपनाया गया है।
