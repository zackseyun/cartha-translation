  text: Καὶ εἶπεν πρὸς αὐτούς· Τίς ἐξ ὑμῶν ἕξει φίλον καὶ πορεύσεται πρὸς αὐτὸν μεσονυκτίου καὶ εἴπῃ αὐτῷ· Φίλε, χρῆσόν μοι τρεῖς ἄρτους,
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/005.yaml
  text: And he said to them[a], “Which of you who has a friend will go to him at midnight and say to him, ‘Friend, lend me three loaves,’”
translation:
  language: hi
  text: फिर उसने उनसे कहा, “तुम में से कौन ऐसा है जिसका कोई मित्र हो और जो आधी रात को उसके पास जाकर उससे कहे, ‘मित्र, मुझे तीन रोटियाँ उधार दे,’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εἶπεν πρὸς αὐτούς
  choice: फिर उसने उनसे कहा
  rationale: καί कथा को आगे बढ़ाता है; हिन्दी में ‘फिर’ स्वाभाविक है। सर्वनाम पूर्ववर्ती संदर्भ में यीशु की ओर संकेत करता है, पर स्रोत की सर्वनामात्मक अभिव्यक्ति बनाए रखी गई है।
- source_word: Τίς ἐξ ὑμῶν ἕξει φίλον
  choice: मान लो, तुममें से किसी का एक मित्र हो
  rationale: यूनानी भविष्यकालीन रूप के साथ आरंभ हुई अलंकारिक प्रश्न-रचना हिन्दी में शब्दशः रखने पर अस्वाभाविक होती। ‘मान लो’ काल्पनिक परिस्थिति और श्रोताओं से सीधे संबोधन को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: φίλον / Φίλε
  choice: मित्र / मित्र
  rationale: दोनों स्थानों पर एक ही शब्द रखकर यूनानी की शब्द-पुनरावृत्ति सुरक्षित की गई है। ‘मित्र’ आधुनिक, गरिमापूर्ण और व्यापक रूप से बोधगम्य है।
- source_word: πορεύσεται πρὸς αὐτὸν
  choice: वह ... उसके पास जाकर
  rationale: गति और अगले कथन के क्रम को स्वाभाविक हिन्दी कृदंत-रचना में व्यक्त किया गया है; कोई अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: μεσονυκτίου
  choice: आधी रात को
  rationale: यह कालवाचक प्रयोग का सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: εἴπῃ αὐτῷ
  choice: उससे कहे
  rationale: अलंकारिक काल्पनिक परिस्थिति के अनुरूप हिन्दी संभावनार्थक रूप चुना गया है।
- source_word: χρῆσόν μοι
  choice: मुझे ... उधार दे
  rationale: χράω यहाँ किसी वस्तु को उपयोग के लिए देने, अर्थात उधार देने, की माँग व्यक्त करता है। आदेशात्मक एकवचन को सीधे संबोधन में रखा गया है।
- source_word: τρεῖς ἄρτους
  choice: तीन रोटियाँ
  rationale: पहली सदी के सामान्य छोटे पाव/रोटी-सदृश खाद्य के लिए ‘रोटियाँ’ साधारण हिन्दी पाठक को स्वाभाविक रूप से समझ आता है और गिनने योग्य बहुवचन बनाए रखता है।
