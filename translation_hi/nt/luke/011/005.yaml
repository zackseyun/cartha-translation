  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। पद अगले पद में जारी रहने वाला अधूरा अलंकारिक प्रश्न है, इसलिए अंत में अल्पविराम रखा गया है। ‘मान लो’ यूनानी के भविष्यकालीन अलंकारिक विन्यास को हिन्दी में स्वाभाविक काल्पनिक स्थिति के रूप में प्रस्तुत करता है।
