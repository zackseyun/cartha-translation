base_translation:
  language: en
  yaml_path: translation/nt/luke/011/038.yaml
  text: But the Pharisee, when he saw it, was astonished that he had not first washed before the meal.
translation:
  language: hi
  text: पर जब फ़रीसी ने यह देखा, तो उसे आश्चर्य हुआ कि यीशु ने भोजन से पहले शुद्धि-विधि के अनुसार धुलाई नहीं की थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यीशु ने भोजन से पहले अपने को नहीं धोया था।” यहाँ प्रयुक्त यूनानी क्रिया का प्रयोग प्रायः “बपतिस्मा देना” के लिए भी होता है, पर इस प्रसंग में यह फ़रीसी शुद्धता-प्रथा से जुड़ी अनुष्ठानिक धुलाई को बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: δὲ
  choice: पर
  rationale: यह पिछले प्रसंग से हल्का विरोध या नया घटनाक्रम दिखाता है; आधुनिक हिन्दी में ‘पर’ स्वाभाविक है।
- source_word: Φαρισαῖος
  choice: फ़रीसी
  rationale: समूह-संज्ञा का प्रचलित हिन्दी रूप; निश्चितता प्रसंग से स्पष्ट है।
- source_word: ἰδὼν
  choice: जब ... ने यह देखा
  rationale: यह एओरिस्ट कृदंत मुख्य क्रिया से पहले की परिस्थिति बताता है; ‘यह’ का संकेत पिछले पद में वर्णित यीशु के व्यवहार की ओर है।
- source_word: ἐθαύμασεν
  choice: उसे आश्चर्य हुआ
  rationale: यह फ़रीसी की चकित प्रतिक्रिया व्यक्त करता है और हिन्दी में सहज है; प्रसंग में असहमति का भाव हो सकता है, पर उसे क्रिया में आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- source_word: οὐ πρῶτον ἐβαπτίσθη
  choice: पहले शुद्धि के लिए हाथ नहीं धोए थे
  rationale: भोजन और फ़रीसी शुद्धता-प्रथा के संदर्भ में क्रिया सामान्य स्वच्छता नहीं, अनुष्ठानिक धुलाई सूचित करती है। हिन्दी में हाथ धोना इस भोजन-पूर्व क्रिया को स्वाभाविक रूप से व्यक्त करता है; फुटनोट मूल क्रिया की व्यापकता सुरक्षित रखता है।
- source_word: πρὸ τοῦ ἀρίστου
  choice: भोजन से पहले
  rationale: ἄριστον प्रायः दिन के पहले या मध्याह्न भोजन को कह सकता है; ‘भोजन’ समय को अनावश्यक रूप से निश्चित किए बिना अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: फ़रीसी भोजन-संदर्भ में ἐβαπτίσθη का अर्थ
  choice: शुद्धि के लिए हाथ धोना
  alternative: बपतिस्मा लेना; स्वयं को डुबोना; अनुष्ठानिक धुलाई करना
  rationale: तात्कालिक संदर्भ भोजन से पहले फ़रीसी शुद्धता-रीति का है, मसीही बपतिस्मे का नहीं। मुख्य पाठ प्रसंगगत अर्थ स्पष्ट करता है, जबकि फुटनोट यूनानी क्रिया के अधिक शाब्दिक और व्यापक अर्थ की जानकारी देता है।
- issue: ἐβαπτίσθη का व्याकरणिक कर्ता
  choice: स्पष्टता के लिए ‘यीशु ने’
  alternative: ‘उसने’ या कर्मवाच्य ‘वह नहीं धुला था’
  rationale: यूनानी में निहित कर्ता पिछले पद से यीशु है। हिन्दी में ‘उसने’ निकटतम संज्ञा ‘फ़रीसी’ से भ्रम पैदा कर सकता था, इसलिए संदर्भगत कर्ता स्पष्ट किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘शुद्धि के लिए हाथ धोए’ सामान्य सफ़ाई और अनुष्ठानिक धुलाई का अंतर स्पष्ट करता है; फुटनोट मूल यूनानी क्रिया की शब्दार्थगत व्यापकता बनाए रखता है।
