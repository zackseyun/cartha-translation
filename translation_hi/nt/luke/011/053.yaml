  language: en
  yaml_path: translation/nt/luke/011/053.yaml
  text: And after he left there[a], the scribes and the Pharisees began to press him hard and to provoke him to speak about many things,
translation:
  language: hi
  text: वह वहाँ से निकलने के बाद, शास्त्री और फ़रीसी उस पर बहुत दबाव डालने और अनेक बातों के बारे में उससे पूछताछ करने लगे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे बोलने के लिए उकसाने” या “उससे बिना तैयारी के बोलने को कहने।” यूनानी क्रिया दुर्लभ है और आक्रामक ढंग से उससे उत्तर निकलवाने का संकेत दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀκεῖθεν ἐξελθόντος αὐτοῦ
  choice: जब वह वहाँ से बाहर निकला
  rationale: समुच्चयबोधक अव्यय, स्थानवाचक क्रियाविशेषण और संबंधकारक स्वतंत्र कृदन्त-रचना मिलकर मुख्य क्रिया से पहले घटी परिस्थिति बताते हैं। यह हिन्दी में स्वाभाविक रूप से समय और स्थान दोनों को बनाए रखता है।
- source_word: ἤρξαντο
  choice: लगे
  rationale: पूरक क्रियाओं के साथ आरम्भसूचक अर्थ को हिन्दी की स्वाभाविक संयुक्त क्रिया में व्यक्त किया गया है।
- source_word: γραμματεῖς
  choice: शास्त्री
  rationale: सुसमाचारों के यहूदी धार्मिक-सामाजिक संदर्भ में यह स्थापित और स्रोत-श्रेणी के निकट हिन्दी पद है।
- source_word: Φαρισαῖοι
  choice: फ़रीसी
  rationale: समूह के नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: δεινῶς ἐνέχειν
  choice: उसके विरुद्ध बहुत आक्रामक हो गए
  rationale: यह संयुक्त अभिव्यक्ति तीव्र शत्रुता और दबाव का बोध कराती है। हिन्दी में केवल ‘दबाने’ की तुलना में यह व्यक्तिगत विरोध को अधिक स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀποστοματίζειν
  choice: उससे जबरन उत्तर निकलवाने
  rationale: यह दुर्लभ क्रिया आक्रामक ढंग से किसी को बोलने या उत्तर देने के लिए उकसाने/खंगालने का संकेत देती है। ‘जबरन उत्तर निकलवाने’ विरोधी मंशा को रखता है, पर पूछताछ की सटीक विधि तय नहीं करता।
- source_word: περὶ πλειόνων
  choice: अनेक बातों के विषय में
  rationale: यहाँ वाक्यांश अनेक विषयों या मामलों को सूचित करता है; इसे तुलनात्मक ‘और अधिक’ नहीं बनाया गया।
