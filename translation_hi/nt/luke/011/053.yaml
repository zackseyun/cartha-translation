- from: जब वह वहाँ से बाहर निकला, तो शास्त्री और फ़रीसी उसके विरुद्ध बहुत आक्रामक हो गए और अनेक बातों के विषय में उससे जबरन उत्तर निकलवाने लगे[a],
  to: वह वहाँ से निकलने के बाद, शास्त्री और फ़रीसी उस पर बहुत दबाव डालने और अनेक बातों के बारे में उससे पूछताछ करने लगे[a],
  rationale: The revision renders the genitive absolute as a prior temporal circumstance, gives ἤρξαντο clear scope over both coordinated actions, and avoids making the disputed rare verb more coercive or resultative than the Greek requires. The footnote retains the relevant lexical uncertainty.
