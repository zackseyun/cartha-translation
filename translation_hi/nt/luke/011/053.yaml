review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the participants, temporal setting, hostile intensity, and breadth of questioning. However, “उसके विरुद्ध बहुत आक्रामक हो गए” weakens the explicit ingressive construction governing both infinitives: the scribes and Pharisees *began* to act. “जबरन उत्तर निकलवाने” also implies actual coercion and extracted answers more strongly than the rare, disputed ἀποστοματίζειν securely warrants.'
  naturalness: 'The proposed revision is idiomatic modern standard Hindi and makes the coordinated actions parallel: they began to press him and to question him closely.'
  terminology: “शास्त्री” and “फ़रीसी” are appropriate established Hindi biblical terms. “पूछताछ करना” is a suitably noncommittal main-text rendering of the rare verb; the footnote preserves the aggressive/drawing-out nuance and alternatives.
  issues:
  - severity: medium
    issue: The ingressive force of ἤρξαντο is not clearly applied to the first coordinated action.
    rationale: In “आक्रामक हो गए और ... निकलवाने लगे,” only the latter overtly has ‘began,’ whereas ἤρξαντο governs both ἐνέχειν and ἀποστοματίζειν.
  - severity: medium
    issue: “जबरन उत्तर निकलवाने” over-specifies coercion and successful extraction of answers.
    rationale: ἀποστοματίζειν is rare and its precise sense is debated; it can denote aggressive close questioning or drawing someone out, without necessarily asserting that answers were forcibly obtained.
  revised_text: वह वहाँ से निकलने के बाद, शास्त्री और फ़रीसी उस पर बहुत दबाव डालने और अनेक बातों के बारे में उससे पूछताछ करने लगे[a],
  revised_footnotes:
  - marker: a
    text: या, “उसे बोलने के लिए उकसाने” या “उससे बिना तैयारी के बोलने को कहने।” यूनानी क्रिया दुर्लभ है और आक्रामक ढंग से उससे उत्तर निकलवाने का संकेत दे सकती है।
    reason: lexical_alternative
  revision_rationale: The revision renders the genitive absolute as a prior temporal circumstance, gives ἤρξαντο clear scope over both coordinated actions, and avoids making the disputed rare verb more coercive or resultative than the Greek requires. The footnote retains the relevant lexical uncertainty.
