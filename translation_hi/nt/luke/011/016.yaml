  text: ἕτεροι δὲ πειράζοντες σημεῖον ⸂ἐξ οὐρανοῦ ἐζήτουν παρ’ αὐτοῦ⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/016.yaml
  text: But others[a], testing him, were seeking from him a sign from heaven.
translation:
  language: hi
  text: पर दूसरे लोग उसे परखने के लिए उससे स्वर्ग से एक चिन्ह[a] माँग रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक स्वर्गीय चिन्ह।’
    reason: ἐξ οὐρανοῦ का विशेषणात्मक अर्थ भी लिया जा सकता है; यह वैकल्पिक अभिव्यक्ति उस संभावना को दर्ज करती है।
lexical_decisions:
- source_word: ἕτεροι
  choice: कुछ दूसरे लोग
  rationale: यह पद पिछले वक्ताओं से एक अलग समूह का संकेत देता है; ‘कुछ दूसरे लोग’ आधुनिक हिन्दी में इस भेद को स्वाभाविक रूप से व्यक्त करता है।
- source_word: δὲ
  choice: पर
  rationale: यहाँ δέ पिछले प्रसंग से हल्का विरोध अथवा परिवर्तन दिखाता है; ‘पर’ उस संबंध को संक्षेप में बनाए रखता है।
- source_word: πειράζοντες
  choice: उसे परखने के लिए
  rationale: संदर्भ में क्रिया का भाव निष्पक्ष जाँच नहीं, बल्कि प्रतिकूल मंशा से परीक्षा लेना है। ‘परखने के लिए’ उद्देश्य और नकारात्मक प्रसंग दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: σημεῖον
  choice: कोई चिन्ह
  rationale: ‘चिन्ह’ यूनानी शब्द का सीधा और धर्मशास्त्रीय रूप से संयत अनुवाद है; प्रसंग स्वयं उसके असाधारण स्वरूप का संकेत देता है, इसलिए ‘चमत्कारी’ जोड़ना आवश्यक नहीं।
- source_word: ἐξ οὐρανοῦ
  choice: स्वर्ग से
  rationale: यह पदबंध चिन्ह के स्वर्गीय स्रोत को व्यक्त करता है; ‘स्वर्ग से’ सीधा और स्वाभाविक अनुवाद है।
- source_word: ἐζήτουν
  choice: माँग रहे थे
  rationale: अपूर्ण काल जारी अथवा बार-बार की जा रही माँग का संकेत देता है। इस संदर्भ में ‘माँग रहे थे’ हिन्दी में ‘खोज रहे थे’ से अधिक स्वाभाविक है।
- source_word: παρ’ αὐτοῦ
  choice: उससे
  rationale: παρά के साथ संबंधकारक यहाँ स्रोत बताता है—वे वह चिन्ह यीशु से माँग रहे थे। ‘उससे’ इस संबंध को स्पष्ट रखता है।
theological_decisions:
- issue: माँगे गए चिन्ह का स्वरूप
  choice: स्वर्ग से कोई चिन्ह
  alternative: कोई स्वर्गीय चिन्ह
  rationale: मुख्य पाठ यूनानी पदबंध के अनुसार चिन्ह के स्वर्ग से आने या स्वर्गीय प्रमाणीकरण के भाव को खुला रखता है और उससे अधिक विशिष्ट धर्मशास्त्रीय अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखा गया है। ‘उसे’ और ‘उससे’ की निकट पुनरावृत्ति मूल में परीक्षा के लक्ष्य और माँग के स्रोत—दोनों अलग संबंधों—को सुरक्षित रखती है।
