lexical_decisions:
- source_word: Ἀποκριθεὶς δέ
  choice: तब ... ने कहा
  rationale: उत्तर देने वाले कृदंत और हल्के कथात्मक संयोजक को स्वाभाविक हिन्दी कथन में समाहित किया गया है; प्रसंग स्पष्ट करता है कि यह यीशु की बात के प्रत्युत्तर में कहा गया।
- source_word: τις τῶν νομικῶν
  choice: व्यवस्था के जानकारों में से एक
  rationale: νομικός यहाँ मूसा की व्यवस्था के विशेषज्ञ को दर्शाता है, आधुनिक पेशेवर वकील को नहीं। यह अनुवाद उस ऐतिहासिक-धार्मिक अर्थ को स्पष्ट और संक्षिप्त रखता है।
- source_word: λέγει αὐτῷ
  choice: उससे कहा
  rationale: यूनानी ऐतिहासिक वर्तमान को हिन्दी की स्वाभाविक कथात्मक भूतकाल शैली में व्यक्त किया गया है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन के रूप में διδάσκαλος का प्रचलित, सम्मानसूचक और सहज हिन्दी समतुल्य।
- source_word: ταῦτα λέγων
  choice: ये बातें कहकर
  rationale: कृदंत उस कथन को अपमान के अनुभव का साधन या कारण बताता है; ‘कहकर’ हिन्दी में इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: καὶ ἡμᾶς
  choice: हमारा भी
  rationale: 'καί का योगात्मक बल सुरक्षित है: वक्ता स्वयं और अपने समूह को पहले सम्बोधित लोगों के साथ जोड़ता है।'
- source_word: ὑβρίζεις
  choice: अपमान करते हैं
  rationale: ὑβρίζω यहाँ केवल बुरा लगने से अधिक, अपमानित करने या तिरस्कारपूर्ण व्यवहार का भाव रखता है।
