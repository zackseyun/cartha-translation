id: LUK.11.28
reference: Luke 11:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: αὐτὸς δὲ εἶπεν· ⸀Μενοῦν μακάριοι οἱ ἀκούοντες τὸν λόγον τοῦ θεοῦ καὶ ⸀φυλάσσοντες.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/028.yaml
  text: But he said[a], “Rather, blessed are those who hear the word of God and keep it.”
translation:
  language: hi
  text: पर उसने कहा, “बल्कि[a] धन्य हैं वे, जो परमेश्वर का वचन सुनते और उसका पालन करते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निश्चय ही धन्य हैं …” अथवा “हाँ, बल्कि धन्य हैं …।” यूनानी अव्यय पिछली बात को स्वीकार करते हुए बल को दूसरी ओर मोड़ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Μενοῦν
  choice: बल्कि
  rationale: यह अव्यय पिछली स्त्री की बात को केवल नकारता नहीं, बल्कि बल देते हुए ध्यान को सच्ची धन्यता के आधार की ओर मोड़ता है। ‘बल्कि’ इस पुनर्निर्देशन को स्वाभाविक हिन्दी में व्यक्त करता है; पादटिप्पणी इसके स्वीकारात्मक भाव को सुरक्षित रखती है।
- source_word: μακάριοι
  choice: धन्य
  rationale: ‘धन्य’ यीशु के धन्यता-वचनों में इस शब्द के धार्मिक और वाचा-संबंधी वजन को बनाए रखता है; ‘सुखी’ इसे मनोदशा तक और ‘भाग्यशाली’ परिस्थिति तक सीमित कर सकता है।
- source_word: οἱ ἀκούοντες
  choice: वे, जो … सुनते
  rationale: वर्तमान कृदंत ऐसे लोगों के वर्ग को दर्शाता है जिनकी विशेषता लगातार सुनना है। यह हिन्दी में सहज है और उस चरित्रगत भाव को बनाए रखता है।
- source_word: τὸν λόγον τοῦ θεοῦ
  choice: परमेश्वर का वचन
  rationale: यह पद परमेश्वर के बोले हुए संदेश या प्रकाशन को सूचित करता है। ‘परमेश्वर का वचन’ अर्थ और बाइबलीय अनुगूँज दोनों को सुरक्षित रखता है।
- source_word: φυλάσσοντες
  choice: उसका पालन करते
  rationale: φυλάσσω में रखने, सँभालने और मानने का अर्थक्षेत्र है। इस संदर्भ में ‘पालन करते’ वचन को व्यवहार में मानने का भाव स्वाभाविक रूप से व्यक्त करता है; ‘उसका’ पूर्वोक्त वचन को स्पष्ट करता है।
- source_word: αὐτὸς δὲ εἶπεν
  choice: पर उसने कहा
  rationale: δέ यहाँ पिछली पुकार के साथ हल्का विरोध या संक्रमण दिखाता है। ‘पर उसने कहा’ निकट और स्वाभाविक है; ‘उत्तर दिया’ सम्भव है, पर εἶπεν से अधिक व्याख्यात्मक होगा।
theological_decisions:
- issue: स्त्री के धन्य कहने पर यीशु के उत्तर का बल
  choice: यीशु जैविक संबंध से ध्यान हटाकर परमेश्वर का वचन सुनने और उसका पालन करने में निहित सच्ची धन्यता पर केंद्रित करते हैं, बिना यह स्पष्ट रूप से नकारे कि उनकी माता धन्य थीं।
  alternative: यीशु स्त्री की बात को पूरी तरह अस्वीकार करते हैं; अथवा वे बिना किसी सुधार के केवल एक और धन्यता जोड़ते हैं।
  rationale: μενοῦν स्वीकार और सुधार अथवा बलवृद्धि—दोनों का भाव रख सकता है। ‘बल्कि’ पुनर्निर्देशन को व्यक्त करता है, जबकि पादटिप्पणी स्वीकारात्मक संभावना को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘धन्य’ और ‘परमेश्वर का वचन’ परिचित बाइबलीय पदावली हैं; वाक्य-संरचना सामान्य पाठक के लिए सीधी रखी गई है।
