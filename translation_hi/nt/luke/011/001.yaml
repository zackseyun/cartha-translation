id: LUK.11.1
reference: Luke 11:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ ἐγένετο ἐν τῷ εἶναι αὐτὸν ἐν τόπῳ τινὶ προσευχόμενον, ὡς ἐπαύσατο, εἶπέν τις τῶν μαθητῶν αὐτοῦ πρὸς αὐτόν· Κύριε, δίδαξον ἡμᾶς προσεύχεσθαι, καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/001.yaml
  text: And it happened that while he was praying in a certain place, when he stopped, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”
translation:
  language: hi
  text: एक बार यीशु किसी स्थान पर प्रार्थना कर रहे थे। जब उन्होंने प्रार्थना करना बंद किया, तो उनके शिष्यों में से एक ने उनसे कहा, “प्रभु, हमें प्रार्थना करना सिखाइए, जैसे यूहन्ना ने भी अपने शिष्यों को सिखाया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ἐγένετο
  choice: एक बार
  rationale: यह लूका का घटना आरंभ करने वाला कथात्मक सूत्र है। आधुनिक हिन्दी में ‘एक बार’ प्रसंग का स्वाभाविक आरंभ करता है; अत्यधिक शाब्दिक ‘और ऐसा हुआ’ यहाँ बोझिल होता।
- source_word: ἐν τῷ εἶναι αὐτὸν ... προσευχόμενον
  choice: यीशु ... प्रार्थना कर रहे थे
  rationale: यह रचना साथ-साथ चल रही परिस्थिति और प्रार्थना की जारी क्रिया व्यक्त करती है। हिन्दी का अपूर्ण भूतकाल इसे स्वाभाविक ढंग से सुरक्षित रखता है। स्पष्टता के लिए सर्वनाम के स्थान पर ‘यीशु’ रखा गया है।
- source_word: ἐν τόπῳ τινὶ
  choice: किसी स्थान पर
  rationale: τινί की अनिश्चितता को बिना स्थान की पहचान जोड़े सुरक्षित रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: ὡς ἐπαύσατο
  choice: जब उन्होंने प्रार्थना करना बंद किया
  rationale: ἐπαύσατο का मूल भाव ‘रुकना/बंद करना’ है। ‘प्रार्थना करना’ दोहराने से हिन्दी में आशय स्पष्ट होता है और ‘समाप्त की’ की अपेक्षा यूनानी शब्द का सीधा बल बना रहता है।
- source_word: τις τῶν μαθητῶν αὐτοῦ
  choice: उनके शिष्यों में से एक
  rationale: विभाजक रचना का स्वाभाविक हिन्दी रूप है और अज्ञात शिष्य की अनिश्चित पहचान बनाए रखता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यह κύριος के सम्मानसूचक और शीर्षकीय दोनों अर्थों को खुला रखता है तथा हिन्दी बाइबलीय प्रयोग में प्रतिष्ठित है।
- source_word: δίδαξον ἡμᾶς προσεύχεσθαι
  choice: हमें प्रार्थना करना सिखाइए
  rationale: यूनानी infinitive complement का सीधा और स्वाभाविक हिन्दी रूप है; ‘कैसे’ जोड़कर मूल से अधिक स्पष्टता आरोपित नहीं की गई।
- source_word: καθὼς καὶ Ἰωάννης ἐδίδαξεν τοὺς μαθητὰς αὐτοῦ
  choice: जैसे यूहन्ना ने भी अपने शिष्यों को सिखाया था
  rationale: ‘जैसे’ तुलना और ‘भी’ καί का समावेशी बल सुरक्षित रखते हैं। ‘सिखाया था’ पूर्वकालिक घटना को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: यीशु को संबोधित करते हुए κύριος का अनुवाद
  choice: प्रभु
  alternative: गुरु / स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन और लूका में इस पद की व्यापक मसीही ध्वनि—दोनों को सुरक्षित रखता है, पर इस एक प्रसंग में उसके धर्मवैज्ञानिक आशय को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक क्रिया-रूपों और सहज कथात्मक प्रवाह के साथ। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सरल रखी गई है; कोई पंथ-विशेष शब्दावली नहीं जोड़ी गई।
