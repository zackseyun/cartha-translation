source:
  edition: SBLGNT
  text: ἄνδρες ⸀Νινευῖται ἀναστήσονται ἐν τῇ κρίσει μετὰ τῆς γενεᾶς ταύτης καὶ κατακρινοῦσιν αὐτήν· ὅτι μετενόησαν εἰς τὸ κήρυγμα Ἰωνᾶ, καὶ ἰδοὺ πλεῖον Ἰωνᾶ ὧδε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/032.yaml
  text: The men of Nineveh will rise up in the judgment with this generation and will condemn it[a], because they repented at the proclamation of Jonah, and behold, something greater than Jonah is here.
translation:
  language: hi
  text: नीनवे के पुरुष न्याय के समय इस पीढ़ी के साथ उठ खड़े होंगे और इसे दोषी ठहराएँगे, क्योंकि उन्होंने योना के प्रचार के प्रत्युत्तर में मन फिराया; और देखो, यहाँ योना से भी बढ़कर कुछ है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ योना से बड़ा कोई व्यक्ति है,” अथवा “यहाँ योना से अधिक है।” यूनानी में ‘बढ़कर/अधिक’ शब्द नपुंसकलिंग रूप में है; इसलिए यह केवल किसी व्यक्ति से तुलना न करके यीशु और उनकी सेवकाई में उपस्थित बड़ी वास्तविकता की ओर अधिक व्यापक रूप से संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἄνδρες Νινευῖται
  choice: नीनवे के पुरुष
  rationale: ἄνδρες स्पष्ट रूप से पुल्लिंग बहुवचन है और Νινευῖται नीनवे के निवासियों को सूचित करता है; इसलिए लिंग-सटीकता बनाए रखते हुए ‘लोगों’ के बजाय ‘पुरुष’ रखा गया।
- source_word: ἀναστήσονται
  choice: उठ खड़े होंगे
  rationale: न्याय के भावी संदर्भ में यह उठने को व्यक्त करता है। यह पुनरुत्थान का संकेत बनाए रखता है, पर अनुवाद में उससे अधिक स्पष्टता नहीं जोड़ता जितनी यूनानी पाठ में है।
- source_word: ἐν τῇ κρίσει
  choice: न्याय के समय
  rationale: κρίσις यहाँ अंतिम न्याय की घटना को सूचित करता है; आधुनिक हिन्दी में ‘न्याय के समय’ स्वाभाविक और स्पष्ट है।
- source_word: μετὰ τῆς γενεᾶς ταύτης
  choice: इस पीढ़ी के साथ
  rationale: μετά संबंध या साथ होने का अर्थ देता है और ‘इस पीढ़ी’ सुसमाचारों की नैतिक-ऐतिहासिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: κατακρινοῦσιν αὐτήν
  choice: इसे दोषी ठहराएँगे
  rationale: κατακρίνω केवल न्याय करने के बजाय दोषी ठहराने का अर्थ देता है; ‘इसे’ का संदर्भ ‘इस पीढ़ी’ से है।
- source_word: μετενόησαν
  choice: उन्होंने ... मन फिराया था
  rationale: μετανοέω यहाँ योना के संदेश के प्रत्युत्तर में नैतिक और आत्मिक पश्चात्ताप को व्यक्त करता है; ‘मन फिराया’ हिन्दी बाइबलीय प्रयोग में स्वाभाविक और अर्थपूर्ण है।
- source_word: εἰς τὸ κήρυγμα Ἰωνᾶ
  choice: योना के प्रचार पर
  rationale: κήρυγμα घोषित संदेश या प्रचार है और εἰς यहाँ उस प्रचार के प्रत्युत्तर में हुए मन-फिराव का भाव देता है।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला गंभीर उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्पष्ट रहते हुए उसका आलंकारिक बल सुरक्षित रखता है।
- source_word: πλεῖον Ἰωνᾶ ὧδε
  choice: यहाँ योना से भी बढ़कर कुछ है
  rationale: πλεῖον नपुंसकलिंग एकवचन है। ‘कुछ’ उस रूप को सुरक्षित रखता है और कथन को केवल एक व्यक्तिगत तुलना तक सीमित नहीं करता।
theological_decisions:
- issue: πλεῖον Ἰωνᾶ का संकेत और विस्तार
  choice: यहाँ योना से भी बढ़कर कुछ है
  alternative: यहाँ योना से भी बड़ा एक जन है; यहाँ योना से भी अधिक है
  rationale: 'नपुंसकलिंग πλεῖον को ‘कुछ’ से व्यक्त करने पर मूल पाठ की व्यापकता और तनाव बने रहते हैं: संकेत यीशु की ओर है, पर अभिव्यक्ति उनके व्यक्तित्व के साथ उनकी सेवकाई और उनके द्वारा उपस्थित बड़ी वास्तविकता को भी समेट सकती है।'
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘मन फिराया’, ‘न्याय’ और ‘दोषी ठहराएँगे’ बाइबलीय अर्थभार को स्वाभाविक हिन्दी में बनाए रखते हैं।
