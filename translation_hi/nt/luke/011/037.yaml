base_translation:
  language: en
  yaml_path: translation/nt/luke/011/037.yaml
  text: While he was speaking[a], a Pharisee asks him to dine with him[b]; so he went in and reclined at the table.
translation:
  language: hi
  text: जब वह बोल रहा था, तब एक फ़रीसी ने उससे अपने यहाँ भोजन करने के लिए अनुरोध किया; तब वह भीतर गया और भोजन के लिए टेक लगाकर लेट गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उस समय की प्रथा के अनुसार भोजन करते समय टेक लगाकर लेट गया।
    reason: cultural_note
lexical_decisions:
- source_word: Ἐν δὲ τῷ λαλῆσαι
  choice: जब वह बोल ही रहा था
  rationale: ἐν + आर्टिक्युलर इनफ़िनिटिव समकालीन क्रिया व्यक्त करता है। यह हिन्दी रूप जारी क्रिया और कथा के संक्रमण—दोनों को स्वाभाविक ढंग से रखता है।
- source_word: ἐρωτᾷ
  choice: अनुरोध किया
  rationale: क्रिया का मूल अर्थ पूछना या अनुरोध करना है; अगले उद्देश्यवाचक खंड से भोजन के निमंत्रण का आशय स्पष्ट होता है। यूनानी ऐतिहासिक वर्तमान को स्वाभाविक हिन्दी कथा-शैली में भूतकाल से व्यक्त किया गया है।
- source_word: Φαρισαῖος
  choice: एक फ़रीसी
  rationale: अनिश्चित एकवचन समूह-संज्ञा के लिए आधुनिक हिन्दी का स्वाभाविक रूप।
- source_word: ὅπως ἀριστήσῃ
  choice: भोजन करने
  rationale: ἀριστάω प्रातः या दिन के आरंभिक भोजन का संकेत दे सकता है, पर यहाँ समय अनिश्चित है; सामान्य ‘भोजन करने’ अनावश्यक अतिस्पष्टता से बचता है।
- source_word: παρ’ αὐτῷ
  choice: अपने यहाँ
  rationale: शाब्दिक अर्थ ‘उसके साथ/उसके यहाँ’ है। भोजन के आतिथ्य-संदर्भ में ‘अपने यहाँ’ स्थान और मेज़बानी का स्वाभाविक हिन्दी संकेत देता है, बिना ‘घर’ को स्पष्ट रूप से जोड़ने के।
- source_word: εἰσελθὼν
  choice: वह भीतर गया
  rationale: एओरिस्ट कृदंत मुख्य क्रिया से पहले प्रवेश की क्रिया दर्शाता है; स्वतंत्र हिन्दी उपवाक्य क्रम को स्पष्ट रखता है।
- source_word: ἀνέπεσεν
  choice: भोजन के लिए लेट गया
  rationale: ἀναπίπτω औपचारिक भोजन के समय प्रचलित टेक लगाकर लेटने की मुद्रा बताता है। ‘बैठ गया’ सांस्कृतिक चित्र मिटा देता, जबकि यह रूप मूल क्रिया को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने यहाँ भोजन करने का अनुरोध’ मूल के अनुरोध और आतिथ्य—दोनों को रखता है। सांस्कृतिक रूप से असामान्य ‘लेट गया’ को पाठ में सुरक्षित रखते हुए पादटिप्पणी में स्पष्ट किया गया है।
