revisions:
- from: इसलिए तुम गवाह हो और अपने पूर्वजों के कामों से सहमत हो, क्योंकि उन्होंने नबियों को मार डाला, और तुम उनकी कब्रें बनाते हो।
  to: इसलिए तुम गवाह हो और तुम्हारे पूर्वजों के कामों का समर्थन करते हो, क्योंकि उन्होंने नबियों को मार डाला, पर तुम उनकी कब्रें[क] बनाते हो।
