review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the inferential ἄρα, the predicate expression “you are witnesses,” the approval implied by συνευδοκεῖτε, and the contrast between the ancestors’ killing and the audience’s building. However, it supplies both “prophets” and “their tombs” without marking either as contextual supplementation. The antecedents are secure from Luke 11:47, but a footnote should document the supplied object, especially because οἰκοδομεῖτε is bare in the Greek of this verse.
  naturalness: The Hindi is clear and suitably dignified. “अपने पूर्वजों के कामों से सहमत हो” is understandable, but “तुम्हारे पूर्वजों के कामों का समर्थन करते हो” more naturally conveys active moral approval. “पर” better represents the μὲν ... δέ contrast than the unqualified additive “और,” without implying that the current generation is morally better.
  terminology: “पूर्वजों” is a natural contextual rendering of πατέρων. “नबियों” and “कब्रें” correctly draw on the immediately preceding verse; the latter is retained in the main text for complete idiomatic Hindi and documented in a note.
  issues:
  - severity: medium
    issue: The supplied contextual objects are not documented.
    rationale: The Greek says only “they killed them, but you build”; “the prophets” and especially “their tombs” are recovered from verse 47. The supplementation is safe but should be transparent to readers.
  - severity: low
    issue: “सहमत हो” can sound like mere agreement rather than active approval.
    rationale: συνευδοκεῖτε expresses concurrence/approval of the ancestors’ deeds. “समर्थन करते हो” is more idiomatic and retains the ethical force.
  - severity: low
    issue: The contrastive δέ is rendered simply as “और.”
    rationale: The coordinated μὲν ... δέ construction is better reflected by “पर,” which preserves the rhetorical contrast while leaving the verse’s ironic implication intact.
  revised_text: इसलिए तुम गवाह हो और तुम्हारे पूर्वजों के कामों का समर्थन करते हो, क्योंकि उन्होंने नबियों को मार डाला, पर तुम उनकी कब्रें[क] बनाते हो।
  revised_footnotes:
