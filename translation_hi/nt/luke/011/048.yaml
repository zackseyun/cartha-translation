id: LUK.11.48
reference: Luke 11:48
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἄρα ⸂μάρτυρές ἐστε⸃ καὶ συνευδοκεῖτε τοῖς ἔργοις τῶν πατέρων ὑμῶν, ὅτι αὐτοὶ μὲν ἀπέκτειναν αὐτοὺς ὑμεῖς δὲ ⸀οἰκοδομεῖτε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/048.yaml
  text: So you are witnesses and approve of the deeds of your fathers[a], because they killed them, but you build their tombs.
translation:
  language: hi
  text: इसलिए तुम गवाह हो और तुम्हारे पूर्वजों के कामों का समर्थन करते हो, क्योंकि उन्होंने नबियों को मार डाला, पर तुम उनकी कब्रें[क] बनाते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: अर्थात पिछले पद में उल्लिखित नबियों की कब्रें। यूनानी पाठ में इस पद के अंत में “बनाते हो” का कर्म स्पष्ट रूप से नहीं दोहराया गया है।
    reason: cross_reference
lexical_decisions:
- source_word: ἄρα
  choice: इसलिए
  rationale: यह पिछले कथन से निकला निष्कर्ष प्रकट करता है और आधुनिक हिन्दी में तर्क-संबंध स्पष्ट रखता है।
- source_word: μάρτυρές ἐστε
  choice: तुम गवाह हो
  rationale: संज्ञात्मक रचना को सीधे रखता है; प्रसंग में उनके अपने काम उनके विरुद्ध गवाही देते हैं।
- source_word: συνευδοκεῖτε
  choice: सहमत हो
  rationale: यह पूर्वजों के कामों के साथ नैतिक सहमति या अनुमोदन व्यक्त करता है; साधारण हिन्दी में स्वाभाविक है।
- source_word: τοῖς ἔργοις τῶν πατέρων ὑμῶν
  choice: अपने पूर्वजों के कामों से
  rationale: πατέρων यहाँ पिछली पीढ़ियों के पुरुष पुरखों को सूचित करता है, पर आधुनिक हिन्दी में ‘पूर्वज’ वंशगत संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: αὐτοὶ μὲν ἀπέκτειναν αὐτούς
  choice: उन्होंने नबियों को मार डाला
  rationale: पहला ‘उन्होंने’ पूर्वजों की ओर और ‘नबियों को’ पिछले पद के स्पष्ट संदर्भ की ओर संकेत करता है; हिन्दी में दोहरे अस्पष्ट सर्वनाम से बचते हुए अर्थ सुरक्षित रहता है।
- source_word: ὑμεῖς δὲ οἰκοδομεῖτε
  choice: और तुम उनकी कब्रें बनाते हो
  rationale: δέ यहाँ दोनों पीढ़ियों के परस्पर पूरक कामों का विरोधात्मक-संबंध जोड़ता है। ‘उनकी कब्रें’ पिछले पद से निहित कर्म को पूरा करता है और हिन्दी में अपूर्ण वाक्य से बचाता है।
theological_decisions:
- issue: οἰκοδομεῖτε के निहित कर्म को मुख्य पाठ में स्पष्ट करना
  choice: ‘उनकी कब्रें’ को पिछले पद के आधार पर मुख्य पाठ में जोड़ा गया है।
  alternative: केवल ‘और तुम बनाते हो’ कहकर कर्म को अनकहा छोड़ना।
  rationale: यूनानी में कर्म पद 47 से समझा जाता है। आधुनिक हिन्दी में उसे छोड़ना अस्वाभाविक और अर्थ की दृष्टि से अधूरा लगेगा; स्पष्ट किया गया कर्म तत्काल संदर्भ से निश्चित है, कोई साम्प्रदायिक व्याख्या नहीं।
- issue: सहमति और गवाही के आरोप का संबंध
  choice: 'दोनों क्रियाओं को समानांतर रखा गया: ‘गवाह हो और ... सहमत हो’।'
  alternative: गवाही को केवल मौखिक साक्ष्य या आत्म-दोषस्वीकार के रूप में विस्तार देना।
  rationale: मूल पाठ दोनों आरोप साथ रखता है, पर उनके ठीक वैचारिक संबंध की व्याख्या नहीं करता; अनुवाद उसी तनाव को बनाए रखता है।
- issue: δέ का अनुवाद
  choice: ‘और’
  alternative: ‘लेकिन’ अथवा ‘जबकि’
  rationale: पूर्वजों के मारने और श्रोताओं के कब्रें बनाने में बाहरी विरोध के साथ गहरी मिलीभगत भी निहित है। ‘और’ उस विडंबनापूर्ण जोड़ को बनाए रखता है; ‘लेकिन’ अनचाहे रूप से वर्तमान पीढ़ी को पूर्वजों से अलग या बेहतर दिखा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पूर्वज’ आज की हिन्दी में ‘तुम्हारे पिता’ की तुलना में यहाँ अधिक स्पष्ट है, क्योंकि संकेत पिछली पीढ़ियों और पुरखों की ओर है। तत्काल संदर्भ से ‘नबियों’ और ‘उनकी कब्रें’ स्पष्ट किए गए हैं।
