source:
  edition: SBLGNT
  text: ἐπὰν ⸀δὲ ἰσχυρότερος ⸀αὐτοῦ ἐπελθὼν νικήσῃ αὐτόν, τὴν πανοπλίαν αὐτοῦ αἴρει ἐφ’ ᾗ ἐπεποίθει, καὶ τὰ σκῦλα αὐτοῦ διαδίδωσιν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/022.yaml
  text: But when one stronger than he comes upon him and overpowers him[a], he takes away his full armor on which he had relied[c][b], and distributes his plunder.
translation:
  language: hi
  text: पर जब उससे अधिक बलवान कोई उस पर आ पड़ता है और उसे हरा देता है[a], तो वह उसका पूरा कवच छीन लेता है, जिस पर उसे भरोसा था[b], और उसकी लूट बाँट देता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस पर विजय पा लेता है’ अथवा ‘उसे परास्त कर देता है’।
    reason: lexical_alternative
  - marker: b
    text: ‘पूरा कवच’ के लिए मूल शब्द युद्ध में पहने जाने वाले पूरे कवच-साज को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसकी लूट का माल’।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπὰν δὲ
  choice: पर जब
  rationale: δέ पिछले पद की स्थिति के साथ विरोध दिखाता है, और ἐπὰν का काल-सापेक्ष भाव आधुनिक हिन्दी में स्वाभाविक रूप से ‘जब’ से व्यक्त होता है।
- source_word: ἰσχυρότερος αὐτοῦ
  choice: उससे अधिक बलवान कोई
  rationale: तुलनात्मक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; ‘कोई’ स्वाभाविक हिन्दी देता है और यूनानी में निहित न होने के कारण ‘मनुष्य’ नहीं जोड़ता।
- source_word: ἐπελθὼν
  choice: उस पर चढ़ आता है
  rationale: यह आने के साथ विरोध या आक्रमण का प्रसंग व्यक्त करता है; ‘चढ़ आता है’ संघर्ष की छवि बनाए रखता है, पर उसे अनावश्यक सैन्य तकनीकी भाषा में नहीं बदलता।
- source_word: νικήσῃ αὐτόν
  choice: उसे काबू में कर लेता है
  rationale: यहाँ विजय का व्यावहारिक परिणाम दूसरे को वश में करना और निःशस्त्र करना है; यह पदबंध उस ठोस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: τὴν πανοπλίαν αὐτοῦ
  choice: उसके वे सारे हथियार
  rationale: πανοπλία युद्ध के पूरे साज-सामान को दर्शाता है। ‘सारे हथियार’ साधारण पाठक के लिए स्पष्ट है और समग्रता भी व्यक्त करता है।
- source_word: αἴρει
  choice: उतार लेता है
  rationale: पराजित व्यक्ति के युद्ध-साज को उससे हटा लेने की दृश्यात्मक क्रिया के लिए यह प्रसंगानुकूल और स्वाभाविक है।
- source_word: ἐφ’ ᾗ ἐπεποίθει
  choice: जिन पर उसे भरोसा था
  rationale: पूर्णकालिक अर्थ वाले रूप में पहले से बना हुआ भरोसा व्यक्त है; हिन्दी में ‘भरोसा था’ इस स्थिर निर्भरता को सहजता से बताता है।
- source_word: τὰ σκῦλα αὐτοῦ
  choice: उससे लूटा हुआ माल
  rationale: σκῦλα पराजित शत्रु से लिए गए युद्ध-लाभ या लूट को दर्शाता है। यह अनुवाद अधिकार-संबंध को स्पष्ट रखते हुए युद्ध की छवि बचाता है।
- source_word: διαδίδωσιν
  choice: बाँट देता है
  rationale: क्रिया का अर्थ कई लोगों में हिस्सा करके देना है; ‘बाँट देता है’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
theological_decisions:
- issue: क्या अधिक बलवान पात्र को स्पष्ट रूप से ‘मनुष्य’ कहा जाए
  choice: ‘उससे अधिक बलवान कोई’ रखा गया है।
  alternative: ‘उससे अधिक बलवान मनुष्य’
  rationale: यूनानी में यहाँ ‘मनुष्य’ संज्ञा नहीं है, यद्यपि पिछले पद से वह छवि समझी जा सकती है। संज्ञा न जोड़ने से मूल की अभिव्यक्ति और व्याख्यात्मक खुलापन सुरक्षित रहते हैं।
- issue: νικάω में विजय की तीव्रता कैसे व्यक्त हो
  choice: ‘काबू में कर लेता है’
  alternative: ‘हरा देता है’ या ‘जीत लेता है’
  rationale: तत्काल प्रसंग में विजय के फलस्वरूप हथियार छीन लिए जाते हैं; चुना हुआ रूप इस ठोस वशीकरण को व्यक्त करता है, बिना पात्रों की धार्मिक पहचान को अनुवाद में स्पष्ट किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उस पर चढ़ आता है’ संघर्ष की रूपकात्मक छवि बनाए रखता है; ‘काबू में कर लेता है’ और ‘बाँट देता है’ सामान्य पाठक के लिए स्पष्ट हैं।
