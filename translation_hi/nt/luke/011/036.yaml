source:
  edition: SBLGNT
  text: εἰ οὖν τὸ σῶμά σου ὅλον φωτεινόν, μὴ ἔχον ⸂μέρος τι⸃ σκοτεινόν, ἔσται φωτεινὸν ὅλον ὡς ὅταν ὁ λύχνος τῇ ἀστραπῇ φωτίζῃ σε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/036.yaml
  text: If[a], then, your whole body is full of light, having no dark part, it will be wholly full of light, as when a lamp lights you with its brightness.
translation:
  language: hi
  text: इसलिए यदि तुम्हारा सारा शरीर प्रकाशमय हो और उसका कोई भी भाग अँधेरा न हो, तो वह पूरी तरह प्रकाशमय होगा, जैसे दीपक अपनी चमक[a] से तुम्हें प्रकाशित करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी कौंध से”; यूनानी शब्द बिजली की कौंध या चमक को सूचित कर सकता है, पर यहाँ संभवतः आशय दीपक की चमक से है, न कि बिजली की चमक से।
    reason: lexical_alternative
lexical_decisions:
- source_word: σῶμά
  choice: शरीर
  rationale: मूल शब्द का सीधा अर्थ ‘शरीर’ है। प्रसंग में यह व्यक्ति की दशा का रूपक है, पर ‘शरीर’ रखने से आँख, दीपक और प्रकाश की मूल बिंबावली बनी रहती है।
- source_word: ὅλον
  choice: सारा / पूरी तरह
  rationale: इस शब्द की दोनों आवृत्तियों में समग्रता का बल है। पहली जगह ‘सारा शरीर’ और दूसरी जगह स्वाभाविक हिन्दी के लिए ‘पूरी तरह प्रकाशमय’ किया गया है।
- source_word: φωτεινόν
  choice: प्रकाशमय
  rationale: यह विशेषण अँधेरे के विपरीत प्रकाश से भरी अथवा उजली दशा बताता है। ‘प्रकाशमय’ संक्षिप्त, गरिमापूर्ण और बिंब के अनुकूल है।
- source_word: μὴ ἔχον μέρος τι σκοτεινόν
  choice: उसका कोई भी भाग अँधेरा न हो
  rationale: नकारात्मक कृदन्तीय वाक्यांश को स्वाभाविक हिन्दी में रखते हुए ‘भाग’ और ‘अँधेरा’ की ठोस बिंबावली सुरक्षित रखी गई है।
- source_word: ἔσται
  choice: होगा
  rationale: εἰμί के सामान्य भविष्यकाल को आधुनिक हिन्दी के सरल भविष्यकाल में व्यक्त किया गया है।
- source_word: ὡς ὅταν
  choice: जैसे उस समय जब
  rationale: यह तुलनात्मक और कालवाचक दोनों संबंध व्यक्त करता है; हिन्दी वाक्य में तुलना स्पष्ट रखने के लिए दोनों पक्ष सुरक्षित रखे गए हैं।
- source_word: λύχνος
  choice: दीपक
  rationale: यह किसी अमूर्त प्रकाश या दीपदान के बजाय ठोस, जलने वाले दीपक को सूचित करता है।
- source_word: τῇ ἀστραπῇ
  choice: अपनी चमक से
  rationale: ἀστραπή का अर्थ बिजली की कौंध, चमक या तेज हो सकता है। यहाँ कर्ता दीपक है, इसलिए ‘अपनी चमक से’ प्रसंगानुकूल है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: φωτίζῃ σε
  choice: तुम्हें प्रकाशित करता है
  rationale: क्रिया का अर्थ प्रकाश देना या प्रकाशित करना है और σε व्यक्तिगत कर्म है; यह अनुवाद दोनों बातों को स्पष्ट रखता है।
theological_decisions:
- issue: ‘शरीर’ और ‘प्रकाश’ की रूपकात्मक शक्ति
  choice: शरीर, अँधेरे और प्रकाश की बिंबावली को बिना व्याख्यात्मक विस्तार के बनाए रखना
  alternative: ‘शरीर’ को ‘मनुष्य का भीतरी जीवन’, ‘आत्मा’ या ‘आत्मिक दशा’ कहकर स्पष्ट करना
  rationale: यह कथन पिछले पद में आँख को शरीर का दीपक कहे जाने से जुड़ा है। मूल रूपक को किसी निश्चित मनोवैज्ञानिक या सिद्धान्तगत व्याख्या में बदलना पाठ की वास्तविक अर्थगत खुलावट को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण रूप अपनाया गया है। ‘प्रकाशमय’ और ‘प्रकाशित’ मूल की प्रकाश-संबंधी पुनरावृत्ति को बनाए रखते हैं; वाक्यरचना को हिन्दी में सहज बनाने के लिए कृदन्तीय खंड को समन्वित उपवाक्य के रूप में रखा गया है।
