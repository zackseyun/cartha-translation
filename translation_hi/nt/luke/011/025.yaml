  text: καὶ ἐλθὸν ⸀εὑρίσκει σεσαρωμένον καὶ κεκοσμημένον.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/025.yaml
  text: And when it comes[a], it finds it swept and put in order.
translation:
  language: hi
  text: और जब वह आती है, तो वह उसे बुहारा हुआ और व्यवस्थित[a] पाती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बुहारा हुआ और सजाया हुआ।”
    reason: κεκοσμημένον का अर्थ ‘व्यवस्थित’ के साथ-साथ ‘सजाया हुआ’ भी हो सकता है।
lexical_decisions:
- source_word: ἐλθὸν
  choice: जब वह आता है
  rationale: अओरिस्ट कृदंत को प्रसंगानुकूल कालवाचक उपवाक्य बनाया गया है। ‘वह’ पिछले पद की अशुद्ध आत्मा को दर्शाता है; ‘लौटता है’ प्रसंग से स्पष्ट है, पर मूल क्रिया में केवल आने का भाव होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: εὑρίσκει
  choice: वह ... पाता है
  rationale: वर्तमानकालीन क्रिया की सजीव कथात्मक शैली को स्वाभाविक हिन्दी वर्तमान काल में रखा गया है।
- source_word: σεσαρωμένον
  choice: बुहारा हुआ
  rationale: पूर्ण कर्मवाच्य कृदंत घर की उस बनी हुई दशा को व्यक्त करता है जो बुहार दिए जाने के बाद है। ‘साफ़’ मूल में अलग से नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: κεκοσμημένον
  choice: व्यवस्थित
  rationale: घर के प्रसंग में κοσμέω सुव्यवस्थित किए जाने या सजाए जाने, दोनों का भाव दे सकता है। मुख्य पाठ में ‘व्यवस्थित’ घरेलू व्यवस्था के भाव को स्वाभाविक ढंग से व्यक्त करता है; सजावट वाला सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: εὑρίσκει का कर्ता और निहित कर्म
  choice: वह उसे ... पाता है
  alternative: अशुद्ध आत्मा उस घर को ... पाती है
  rationale: यूनानी में कर्ता पिछले पद की अशुद्ध आत्मा है और कर्म प्रसंग से समझा जाने वाला घर है। सर्वनामों द्वारा मूल की संक्षिप्तता और प्रसंगगत निहितता बनाए रखी गई है। हिन्दी में ‘आत्मा’ स्त्रीलिंग है, फिर भी ‘वह’ रूप लिंग-निरपेक्ष है और अनावश्यक व्याख्या नहीं जोड़ता।
- issue: κεκοσμημένον का अर्थ
  choice: व्यवस्थित
  alternative: सजाया हुआ
  rationale: शब्द में क्रम से लगाए जाने और सजाए जाने दोनों की अर्थ-सम्भावना है। घर के प्रसंग में व्यवस्था का अर्थ मुख्य पाठ में उपयुक्त है, पर सजावट की वास्तविक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बुहारा हुआ’ सामान्य घरेलू बिंब को बनाए रखता है, जबकि ‘व्यवस्थित’ कृत्रिम या अत्यधिक अलंकृत भाषा से बचते हुए परिणामी दशा व्यक्त करता है।
