source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν, ὅτι οἰκοδομεῖτε τὰ μνημεῖα τῶν προφητῶν οἱ δὲ πατέρες ὑμῶν ἀπέκτειναν αὐτούς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/047.yaml
  text: Woe to you[b][a], because you build the tombs of the prophets whom your fathers killed.
translation:
  language: hi
  text: तुम पर धिक्कार है, क्योंकि तुम भविष्यद्वक्ताओं की कब्रें[a] बनाते हो, मगर तुम्हारे पुरखों[b] ने उन्हें मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र-स्मारक।” यूनानी शब्द कब्र या कब्र पर बने स्मारक—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पूर्वजों।” यूनानी शब्द का शाब्दिक अर्थ “पिताओं” है, पर यहाँ वह पिछली पीढ़ियों के पुरखों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαὶ ὑμῖν
  choice: धिक्कार है तुम पर
  rationale: यह यीशु की सीधी, भविष्यद्वक्ताओं जैसी न्याय-घोषणा का प्रबल भाव व्यक्त करता है; केवल शोकसूचक ‘हाय’ यहाँ अपेक्षाकृत कमजोर पड़ सकता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह धिक्कार का कारण प्रस्तुत करने वाले स्पष्ट कारणवाचक अर्थ को व्यक्त करता है।
- source_word: οἰκοδομεῖτε
  choice: बनाते हो
  rationale: यूनानी वर्तमान काल को किसी वर्तमान या सामान्य प्रथा के रूप में सहज हिन्दी में रखता है, बिना निरंतर क्रिया का अनावश्यक बल जोड़े।
- source_word: τὰ μνημεῖα
  choice: कब्रें
  rationale: μνημεῖον यहाँ दफनाने के स्थान अथवा कब्र-स्मारक को सूचित करता है; ‘कब्रें’ सामान्य पाठक के लिए सबसे स्पष्ट और स्वाभाविक मुख्य-पाठ विकल्प है।
- source_word: τῶν προφητῶν
  choice: भविष्यद्वक्ताओं की
  rationale: सम्बन्धवाचक यूनानी पदबंध को सीधी और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ δὲ πατέρες ὑμῶν
  choice: मगर तुम्हारे पुरखों
  rationale: δέ से उपस्थित विरोध अथवा तनाव को ‘मगर’ बनाए रखता है; ‘पुरखे’ πατέρες के पारिवारिक और वंशगत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἀπέκτειναν αὐτούς
  choice: ने उन्हें मार डाला था
  rationale: ‘उन्हें’ का संकेत भविष्यद्वक्ताओं की ओर है। ‘मार डाला’ हत्या के सीधे अर्थ को रखता है, और ‘था’ पूर्वजों के अतीत के कार्य को वर्तमान कब्र-निर्माण के मुकाबले सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: कब्रें बनाने और पुरखों द्वारा भविष्यद्वक्ताओं को मार डालने के बीच निहित पाखंड या सहभागिता को कितना स्पष्ट किया जाए
  choice: 'दोनों कार्यों को विरोधी उपवाक्यों में साथ रखकर निहित तनाव को बनाए रखना: ‘तुम ... कब्रें बनाते हो, मगर तुम्हारे पुरखों ने उन्हें मार डाला था।’'
  alternative: ‘तुम उन भविष्यद्वक्ताओं की कब्रें बनाते हो जिन्हें तुम्हारे पुरखों ने मार डाला था।’
  rationale: यूनानी δέ दोनों कथनों के बीच हल्का विरोध उपस्थित करता है, पर इस पद में उसका पूरा धार्मिक निष्कर्ष स्पष्ट नहीं किया गया; वह अगले पद में विकसित होता है। इसलिए अनुवाद निहित आरोप को स्वयं से विस्तार नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सीधा, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘धिक्कार है तुम पर’ भविष्यद्वक्ताओं जैसी न्याय-घोषणा की गंभीरता रखता है; ‘मगर’ δέ के विरोधी तनाव को स्वाभाविक हिन्दी में व्यक्त करता है।
