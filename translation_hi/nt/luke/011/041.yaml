  yaml_path: translation/nt/luke/011/041.yaml
  text: But give as alms the things that are within[a], and behold, everything is clean for you.
translation:
  language: hi
  text: पर जो चीज़ें भीतर हैं, उन्हें दान में दे दो[a]; और देखो, सब कुछ तुम्हारे लिए स्वच्छ है।
  philosophy: optimal-equivalence
