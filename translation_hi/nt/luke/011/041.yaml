    reason: alternative_reading
lexical_decisions:
- source_word: πλὴν
  choice: पर
  rationale: यह पिछले कथन के विपरीत सुधारात्मक बात प्रस्तुत करता है। ‘पर’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: τὰ ἐνόντα
  choice: जो भीतर है
  rationale: यूनानी पद का शाब्दिक अर्थ भीतर उपस्थित वस्तुओं की ओर संकेत करता है। निकटवर्ती प्रसंग में कटोरे और थाली के बाहर तथा भीतर का विरोध होने के कारण यह अनुवाद उस संबंध को बनाए रखता है, जबकि सम्पत्ति-संबंधी वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: δότε
  choice: दे दो
  rationale: यह आदेश निर्णायक कार्य का आह्वान करता है। ‘दे दो’ सहज हिन्दी आज्ञार्थ है और यूनानी क्रिया में अनावश्यक अर्थ नहीं जोड़ता।
- source_word: ἐλεημοσύνην
  choice: दान में
  rationale: यह शब्द जरूरतमंदों की सहायता के लिए दिए जाने वाले दान को व्यक्त करता है। ‘दान में दे दो’ हिन्दी में स्वाभाविक है; मूल में ग्रहणकर्ता स्पष्ट न होने के कारण ‘गरीबों को’ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ἰδοὺ
  choice: देखो
  rationale: यह ध्यान खींचते हुए परिणाम पर बल देता है। ‘देखो’ आधुनिक हिन्दी में स्पष्ट है और मूल की आलंकारिक शक्ति बनाए रखता है।
- source_word: πάντα
  choice: सब कुछ
  rationale: नपुंसकलिंग बहुवचन यहाँ व्यापक अर्थ रखता है; ‘सब कुछ’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: καθαρὰ
  choice: शुद्ध
  rationale: प्रसंग में यह धार्मिक और नैतिक शुद्धता की चर्चा से जुड़ा है। ‘शुद्ध’ पिछले पदों में बाहरी सफाई तथा भीतरी अशुद्धता के बीच संबंध बनाए रखता है।
- source_word: ὑμῖν
  choice: तुम्हारे लिए
  rationale: सम्प्रदान कारक यहाँ सम्बन्ध या लाभ को दर्शाता है। ‘तुम्हारे लिए’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: τὰ ἐνόντα का शुद्धता और दान से संबंध
  choice: 'भीतरी बात का अर्थ: ‘जो भीतर है’'
  alternative: ‘जो कुछ तुम्हारे पास है’ अर्थात अपनी उपलब्ध सम्पत्ति
  rationale: लूका 11:39 में बर्तन के बाहर और भीतर का स्पष्ट विरोध है, इसलिए मुख्य पाठ में भीतरी अर्थ रखने से यीशु की नैतिक फटकार और प्रसंगगत शब्द-संबंध सुरक्षित रहते हैं। फिर भी यूनानी पद को उपलब्ध सम्पत्ति के अर्थ में भी समझा जा सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दान में दे दो’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘शुद्ध’ प्रसंग की धार्मिक और नैतिक अर्थ-छाया को बनाए रखता है।
