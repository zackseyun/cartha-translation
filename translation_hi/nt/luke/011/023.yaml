  text: ὁ μὴ ὢν μετ’ ἐμοῦ κατ’ ἐμοῦ ἐστιν, καὶ ὁ μὴ συνάγων μετ’ ἐμοῦ σκορπίζει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/023.yaml
  text: The one who is not with me is against me[a], and the one who does not gather with me scatters.
translation:
  language: hi
  text: जो मेरे साथ नहीं है, वह मेरे विरुद्ध है; और जो मेरे साथ इकट्ठा नहीं करता, वह तितर-बितर करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μὴ ὢν
  choice: जो ... नहीं है
  rationale: लेख के साथ वर्तमान कृदन्त यहाँ व्यक्ति-सूचक और सामान्य अर्थ रखता है। हिंदी में ‘जो ... नहीं है’ इस सामान्य एकवचन भाव को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: μετ’ ἐμοῦ
  choice: मेरे साथ
  rationale: जनन कारक के साथ μετά संगति और पक्षधरता का भाव देता है। ‘मेरे साथ’ संबंध और संरेखण दोनों को सहज रूप से बनाए रखता है।
- source_word: κατ’ ἐμοῦ
  choice: मेरे विरुद्ध
  rationale: यहाँ जनन कारक के साथ κατά विरोध व्यक्त करता है। ‘मेरे विरुद्ध’ ‘मेरे साथ’ के स्पष्ट प्रतिपक्ष को सुरक्षित रखता है।
- source_word: συνάγων
  choice: इकट्ठा करता
  rationale: यह शब्द एकत्र करने या साथ लाने का अर्थ देता है। ‘इकट्ठा करता’ सामान्य आधुनिक हिंदी में स्वाभाविक है और सामने कोई स्पष्ट कर्म न होने की मूल अस्पष्टता को बनाए रखता है।
- source_word: σκορπίζει
  choice: तितर-बितर करता है
  rationale: σκορπίζω बिखेरने या छितराने को दर्शाता है। ‘तितर-बितर करता है’ ‘इकट्ठा करता’ के साथ सजीव और स्पष्ट विरोध बनाता है।
- source_word: καὶ
  choice: और
  rationale: संयोजक दोनों समानांतर कथनों को सीधे जोड़ता है; ‘और’ इसका स्वाभाविक हिंदी समतुल्य है।
theological_decisions:
- issue: यीशु के प्रति तटस्थता के विषय में कथन का बल
  choice: जो यीशु के साथ नहीं है, उसे उनके विरुद्ध बताया गया है; कथन का कठोर द्विभाजन ज्यों का त्यों रखा गया है।
  alternative: इसे केवल समर्थन की कमी बताकर नरम करना, या इसके सामान्य शब्दों को केवल दुष्टात्मा निकालने की तत्काल स्थिति तक सीमित कर देना।
  rationale: यूनानी कथन निरपेक्ष रूप में है। अनुवाद किसी बाद की मत-संबंधी व्याख्या को जोड़े बिना उसके सीधे दावे और धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक कथन के अनुकूल। समानांतर रचना—‘जो ... नहीं है, वह ... है’ और ‘जो ... नहीं करता, वह ... करता है’—को बनाए रखा गया है।
