  yaml_path: translation/nt/luke/011/014.yaml
  text: And he was casting out a mute demon. Then[a], when the demon had gone out, the mute man spoke, and the crowds marveled.
translation:
  language: hi
  text: वे एक गूँगी[a] दुष्टात्मा को निकाल रहे थे। तब, दुष्टात्मा के निकल जाने पर, वह गूँगा व्यक्ति बोला और भीड़ के लोग चकित रह गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बहरी’; यूनानी विशेषण का अर्थ ‘बहरा’ या ‘गूँगा’ हो सकता है, पर यहाँ ‘गूँगी’ प्रसंग के अधिक अनुकूल है, क्योंकि दुष्टात्मा के निकलने के बाद वह व्यक्ति बोलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἦν ἐκβάλλων
  choice: निकाल रहे थे
  rationale: ἦν के साथ वर्तमान कृदंत भूतकाल में चल रही क्रिया व्यक्त करता है; इसलिए अपूर्ण पक्ष को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: δαιμόνιον
  choice: दुष्टात्मा
  rationale: यह यूनानी शब्द सीधे एक दुष्ट अलौकिक आत्मा को दर्शाता है। ‘अशुद्ध आत्मा’ इस पद में प्रयुक्त न हुए शब्दों को आयात करता।
- source_word: κωφόν
  choice: गूँगी
  rationale: κωφός का अर्थ ‘बहरा’ या ‘गूँगा’ हो सकता है। यहाँ दुष्टात्मा के निकलने पर व्यक्ति बोलता है, इसलिए प्रसंग में गूँगेपन पर बल है। विशेषण मूल पाठ की तरह दुष्टात्मा के साथ रखा गया है।
- source_word: ἐγένετο δὲ τοῦ δαιμονίου ἐξελθόντος
  choice: दुष्टात्मा के निकल जाने पर
  rationale: यह अगले घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है और मुख्य क्रिया से पहले दुष्टात्मा के निकल जाने की पूर्णता बनाए रखता है।
- source_word: ἐλάλησεν
  choice: बोला
  rationale: सरल भूतकाल यूनानी क्रिया का सीधा अर्थ देता है; ‘बोलने लगा’ पाठ में निहित आरंभिक पक्ष जोड़ देता।
- source_word: ὁ κωφός
  choice: वह गूँगा व्यक्ति
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्ति के लिए प्रस्तुत किया गया है, बिना उसके लिंग को अनावश्यक रूप से निश्चित किए।
- source_word: ἐθαύμασαν
  choice: चकित रह गए
  rationale: यह विस्मय और आश्चर्य की प्रतिक्रिया को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἱ ὄχλοι
  choice: भीड़ के लोग
  rationale: यूनानी बहुवचन सामूहिक जनसमूहों को दर्शाता है। हिन्दी में ‘भीड़ें’ अस्वाभाविक लग सकता है; ‘भीड़ के लोग’ अर्थ को सहज रूप में व्यक्त करता है।
theological_decisions:
- issue: पीड़ा का स्वरूप और दुष्टात्मा-निष्कासन की भाषा
  choice: वर्णन को वास्तविक दुष्टात्मा के निकाले जाने और उसके बाद व्यक्ति के बोलने के रूप में रखा गया है।
  alternative: इसे केवल रोग का प्रेक्षणात्मक वर्णन मानना या अलौकिक संदर्भ को अस्पष्ट करना।
  rationale: यूनानी पाठ स्पष्ट रूप से δαιμόνιον कहता है और उसके निकलने के बाद व्यक्ति के बोलने का वर्णन करता है; अनुवाद को इस दावे को न घटाना चाहिए, न बढ़ाना।
translation_notes:
  register: आधुनिक मानक हिन्दी की सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। यीशु के लिए प्रसंगानुसार सम्मानसूचक बहुवचन ‘वे’ रखा गया है। मुख्य पाठ में पादटिप्पणी-चिह्न उसी अस्पष्ट यूनानी विशेषण पर लगाया गया है जिससे टिप्पणी संबंधित है।
