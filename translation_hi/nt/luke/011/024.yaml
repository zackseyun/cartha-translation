id: LUK.11.24
reference: Luke 11:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ὅταν τὸ ἀκάθαρτον πνεῦμα ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου, διέρχεται δι’ ἀνύδρων τόπων ζητοῦν ἀνάπαυσιν, καὶ μὴ ⸀εὑρίσκον λέγει· Ὑποστρέψω εἰς τὸν οἶκόν μου ὅθεν ἐξῆλθον·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/024.yaml
  text: When the unclean spirit has gone out from the man[a], it passes through waterless places seeking rest, and not finding any, it says, ‘I will return to my house, from which I came out.’
translation:
  language: hi
  text: “जब अशुद्ध आत्मा मनुष्य में से निकल जाती है, तो वह विश्राम की खोज में निर्जल स्थानों[a] से होकर गुजरती है। और जब उसे विश्राम नहीं मिलता, तो वह कहती है, ‘मैं अपने उस घर में लौट जाऊँगी, जहाँ से निकली थी।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सूखे स्थानों।” यूनानी शब्द का शाब्दिक अर्थ “जलरहित” है।
    reason: ἀνύδρων के शाब्दिक अर्थ और उसके स्वाभाविक वैकल्पिक अनुवाद को दर्ज करना।
lexical_decisions:
- source_word: Ὅταν
  choice: जब
  rationale: ὅταν के साथ संभावनार्थक क्रिया एक सामान्य समय-संबंधी स्थिति व्यक्त करती है। आधुनिक हिन्दी में ‘जब’ इस दृष्टांतात्मक कथन को स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: τὸ ἀκάθαρτον πνεῦμα
  choice: अशुद्ध आत्मा
  rationale: यह सुसमाचारों में दुष्ट आत्मा के लिए प्रचलित अभिव्यक्ति है। ‘अशुद्ध’ नैतिक और धार्मिक अशुद्धता के भाव को बनाए रखता है।
- source_word: ἐξέλθῃ ἀπὸ τοῦ ἀνθρώπου
  choice: मनुष्य में से निकल जाती है
  rationale: यह प्रतिनिधिक एकवचन स्थिति को बनाए रखता है। हिन्दी में किसी आत्मा के व्यक्ति से बाहर आने के लिए ‘में से निकलना’ स्वाभाविक है।
- source_word: διέρχεται δι’ ἀνύδρων τόπων
  choice: निर्जल स्थानों से होकर गुजरती है
  rationale: ‘निर्जल’ ἀνύδρων का शाब्दिक जल-विहीन बिंब सुरक्षित रखता है, और ‘से होकर गुजरती है’ διέρχεται की स्थानों के बीच से जाने की धारणा स्पष्ट करता है।
- source_word: ζητοῦν ἀνάπαυσιν
  choice: विश्राम की खोज में
  rationale: यह कृदंत के प्रयोजन अथवा साथ-साथ चल रही क्रिया के भाव को सहज हिन्दी में व्यक्त करता है और ἀνάπαυσις को ‘विश्राम’ के रूप में बनाए रखता है।
- source_word: καὶ μὴ εὑρίσκον
  choice: और जब उसे विश्राम नहीं मिलता
  rationale: निहित कर्म ‘विश्राम’ को हिन्दी में स्पष्ट करना अर्थ को बदले बिना वाक्य को स्वाभाविक बनाता है।
- source_word: λέγει
  choice: वह कहती है
  rationale: यूनानी का वर्तमान काल कथन को सजीव रखता है। ‘आत्मा’ हिन्दी में स्त्रीलिंग है, इसलिए स्त्रीलिंग क्रिया व्याकरणसम्मत है।
- source_word: Ὑποστρέψω εἰς τὸν οἶκόν μου
  choice: मैं अपने उस घर में लौट जाऊँगी
  rationale: ‘लौट जाऊँगी’ भविष्यकालीन निश्चय को व्यक्त करता है। ‘घर’ अगले पद में जारी ठोस रूपक को सुरक्षित रखता है; ‘उस’ पहले छोड़े गए घर की पहचान स्पष्ट करता है।
- source_word: ὅθεν ἐξῆλθον
  choice: जहाँ से निकली थी
  rationale: यह मूल के स्थान-संबंधी अर्थ और पहले प्रयुक्त ‘निकल’ की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ‘अशुद्ध आत्मा’ का स्वरूप
  choice: इसे बोलने, निकलने और लौटने वाली व्यक्तिगत दुष्ट आत्मा के रूप में अनूदित किया गया है।
  alternative: इसे केवल नैतिक पतन के रूपक या किसी निर्वैयक्तिक शक्ति के रूप में प्रस्तुत करना।
  rationale: संदर्भ और व्याकरण आत्मा को सक्रिय व्यक्तिगत कर्ता के रूप में प्रस्तुत करते हैं; अनुवाद इस प्रस्तुति को न तो रूपकमात्र बनाता है, न अतिरिक्त व्याख्या जोड़ता है।
- issue: ἀνθρώπου का प्रतिनिधिक अर्थ
  choice: ‘मनुष्य’
  alternative: ‘व्यक्ति’ या ‘किसी’
  rationale: यूनानी पुल्लिंग एकवचन एक प्रतिनिधिक स्थिति दर्शाता है। ‘मनुष्य’ मूल रूप को बनाए रखते हुए हिन्दी में सामान्य मानव-संदर्भ भी व्यक्त कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य-विन्यास को हिन्दी की स्वाभाविक धारा के अनुसार हल्का रूप दिया गया है, जबकि निर्जल स्थान, विश्राम, घर, निकलना और लौटना जैसे मूल बिंब सुरक्षित हैं।
