source:
  edition: SBLGNT
  text: εἰ οὖν ὑμεῖς πονηροὶ ὑπάρχοντες οἴδατε δόματα ἀγαθὰ διδόναι τοῖς τέκνοις ὑμῶν, πόσῳ μᾶλλον ὁ πατὴρ ὁ ἐξ οὐρανοῦ δώσει πνεῦμα ἅγιον τοῖς αἰτοῦσιν αὐτόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/013.yaml
  text: If you[a], then, being evil, know how to give good gifts to your children[b], how much more will the Father from heaven give the Holy Spirit to those who ask him.
translation:
  language: hi
  text: 'इसलिए यदि तुम बुरे होते हुए भी अपने बच्चों को अच्छे उपहार देना जानते हो, तो वह पिता, जो स्वर्ग से है[a], उससे माँगने वालों को पवित्र आत्मा कितना अधिक देगा!


    [a] कुछ अनुवाद मत्ती 7:11 के समान यहाँ “तुम्हारा स्वर्गीय पिता” कहते हैं, लेकिन लूका के यूनानी पाठ में शाब्दिक रूप से “वह पिता, जो स्वर्ग से है” लिखा है।


    [b] मत्ती 7:11 में यहाँ के “पवित्र आत्मा” के स्थान पर “अच्छी वस्तुएँ” है। इस प्रकार दोनों सुसमाचारों की अपनी-अपनी विशिष्ट शब्दावली बनी रहती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद मत्ती 7:11 के समान यहाँ “तुम्हारा स्वर्गीय पिता” कहते हैं, लेकिन लूका के यूनानी पाठ में शाब्दिक रूप से “वह पिता, जो स्वर्ग से है” लिखा है।
    reason: alternative_reading
  - marker: b
    text: मत्ती 7:11 में यहाँ के “पवित्र आत्मा” के स्थान पर “अच्छी वस्तुएँ” है। इस प्रकार दोनों सुसमाचारों की अपनी-अपनी विशिष्ट शब्दावली बनी रहती है।
    reason: cross_reference
lexical_decisions:
- source_word: πονηροὶ ὑπάρχοντες
  choice: बुरे होते हुए भी
  rationale: यह कृदन्तीय पद मनुष्य की नैतिक दशा बताता है और संदर्भ में रियायती भाव रखता है; “भी” उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οἴδατε ... διδόναι
  choice: देना जानते हो
  rationale: पूरक infinitive के साथ οἴδατε व्यावहारिक ज्ञान या क्षमता दर्शाता है; हिन्दी में “देना जानते हो” इसका सहज रूप है।
- source_word: δόματα ἀγαθὰ
  choice: अच्छे उपहार
  rationale: δόματα सामान्य “वस्तुओं” के बजाय दी जाने वाली भेंटों को दर्शाता है; “उपहार” ठोस संज्ञार्थ बनाए रखता है।
- source_word: τέκνοις ὑμῶν
  choice: अपने बच्चों को
  rationale: पारिवारिक संदर्भ में τέκνα का स्वाभाविक आधुनिक हिन्दी रूप “बच्चे” है; “अपने” सम्बन्ध को सहजता से व्यक्त करता है।
- source_word: πόσῳ μᾶλλον
  choice: कितना अधिक
  rationale: यह कमतर से बढ़कर निष्कर्ष निकालने वाली तुलना का मानक हिन्दी रूप है।
- source_word: ὁ πατὴρ ὁ ἐξ οὐρανοῦ
  choice: वह पिता, जो स्वर्ग से है
  rationale: यह रूप ἐξ οὐρανοῦ के “स्वर्ग से” भाव को बचाता है और मत्ती 7:11 के समान “तुम्हारा स्वर्गीय पिता” बनाकर सामंजस्य नहीं करता।
- source_word: πνεῦμα ἅγιον
  choice: पवित्र आत्मा
  rationale: लूका के इस संदर्भ में यह परमेश्वर के दिव्य आत्मा को सूचित करता है; हिन्दी में निश्चित दिव्य नाम के रूप में “पवित्र आत्मा” स्वाभाविक है।
- source_word: τοῖς αἰτοῦσιν αὐτόν
  choice: उन लोगों को ... जो उससे माँगते हैं
  rationale: वर्तमान कृदन्त को लोगों के एक वर्ग के रूप में व्यक्त किया गया है और स्पष्ट αὐτόν को “उससे” द्वारा बनाए रखा गया है।
theological_decisions:
- issue: πνεῦμα ἅγιον का अभिप्राय
  choice: व्यक्तिगत दिव्य पवित्र आत्मा
  alternative: कोई पवित्र आत्मा या पवित्र मनोभाव
  rationale: यूनानी पद में उपपद न होने पर भी लूका के संदर्भ में पिता द्वारा दिए जाने वाले परमेश्वर के आत्मा का संकेत है; अनुवाद पाठ से आगे कोई अतिरिक्त सिद्धान्त नहीं जोड़ता।
- issue: मत्ती 7:11 के समानांतर कथन से सम्बन्ध
  choice: लूका की विशिष्ट शब्दावली—“वह पिता, जो स्वर्ग से है” और “पवित्र आत्मा”—को बनाए रखना
  alternative: “तुम्हारा स्वर्गीय पिता” और “अच्छी वस्तुएँ” जैसे मत्ती-सम्मत रूप
  rationale: अनुवाद लूका के उपलब्ध यूनानी पाठ का अनुसरण करता है और समानांतर सुसमाचार के अनुसार उसे चुपचाप नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। वाक्य की यदि–तो संरचना और कमतर से बढ़कर तर्क सुरक्षित है। “वह पिता, जो स्वर्ग से है” सामान्य हिन्दी से कुछ अधिक औपचारिक है, पर यह लूका की विशिष्ट यूनानी अभिव्यक्ति को मत्ती के शब्दों में बदलने से बचाता है।
