id: LUK.11.19
reference: Luke 11:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ ἐγὼ ἐν Βεελζεβοὺλ ἐκβάλλω τὰ δαιμόνια, οἱ υἱοὶ ὑμῶν ἐν τίνι ἐκβάλλουσιν; διὰ τοῦτο ⸂αὐτοὶ ὑμῶν κριταὶ⸃ ἔσονται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/019.yaml
  text: But if I cast out the demons by Beelzebul[b][a], by whom do your sons cast them out? Therefore they will be your judges.
translation:
  language: hi
  text: पर यदि मैं बालज़बूल के द्वारा दुष्टात्माओं को निकालता हूँ, तो तुम्हारे बेटे किसके द्वारा उन्हें निकालते हैं?[a] इसलिए वे स्वयं तुम्हारे न्यायाधीश होंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘किस साधन से’ अथवा ‘किस शक्ति से’।
    reason: lexical_alternative
  - marker: b
    text: यूनानी में ‘वे’ पर बल है; इसलिए ‘वे स्वयं’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰ δὲ
  choice: पर यदि
  rationale: δέ यहाँ यीशु के प्रतिवाद में हल्का विरोध दिखाता है; ‘पर यदि’ तर्क के इस मोड़ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ἐγὼ
  choice: मैं
  rationale: यूनानी में व्यक्त सर्वनाम स्पष्ट रूप से आया है और यीशु तथा विरोधियों से जुड़े झाड़-फूँक करनेवालों के बीच तुलना को उभारता है।
- source_word: ἐν Βεελζεβοὺλ
  choice: बालज़बूल के द्वारा
  rationale: इस प्रसंग में ἐν साधन अथवा कर्ता को सूचित करता है। ‘के द्वारा’ बिना ‘शक्ति’ शब्द जोड़े इस अर्थ को व्यक्त करता है, और नाम को लिप्यंतरित रखा गया है।
- source_word: ἐκβάλλω τὰ δαιμόνια
  choice: दुष्टात्माओं को निकालता हूँ
  rationale: ἐκβάλλω का अर्थ इस भूत-निष्कासन प्रसंग में बाहर निकालना है। ‘दुष्टात्माएँ’ δαιμόνια को सामान्य बुरे प्रभावों के बजाय आत्मिक प्राणियों के रूप में स्पष्ट और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: οἱ υἱοὶ ὑμῶν
  choice: तुम्हारे बेटे
  rationale: υἱοί का सीधा अर्थ ‘बेटे’ है। सम्भावित सांकेतिक अर्थ—अनुयायी, शिष्य या अपने समुदाय के लोग—को मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: ἐν τίνι
  choice: किसके द्वारा
  rationale: यह प्रश्न कर्ता या माध्यम पूछता है। बालज़बूल जैसे व्यक्तिगत संदर्भ के समानांतर ‘किसके द्वारा’ उपयुक्त है; ‘किस शक्ति से’ सम्भव है, पर अधिक व्याख्यात्मक है।
- source_word: ἐκβάλλουσιν
  choice: उन्हें निकालते हैं
  rationale: पहले आए ἐκβάλλω के साथ शब्दगत संगति रखी गई है; ‘उन्हें’ का संदर्भ दुष्टात्माओं से स्वाभाविक रूप से मिलता है।
- source_word: διὰ τοῦτο
  choice: इसलिए
  rationale: यह वाक्यांश पिछले प्रश्न से निकला निष्कर्ष प्रस्तुत करता है; ‘इसलिए’ संक्षिप्त और स्वाभाविक है।
- source_word: αὐτοὶ ὑμῶν κριταὶ ἔσονται
  choice: वे स्वयं तुम्हारे न्यायाधीश होंगे
  rationale: ‘स्वयं’ स्पष्ट सर्वनाम αὐτοί के बलाघात को सुरक्षित रखता है, और ‘न्यायाधीश’ κριταί का स्पष्ट आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: ‘तुम्हारे बेटे’ की पहचान
  choice: मुख्य पाठ में शाब्दिक अभिव्यक्ति ‘तुम्हारे बेटे’ रखी गई है।
  alternative: ‘तुम्हारे अनुयायी’, ‘तुम्हारे शिष्य’ या ‘तुम्हारे अपने लोग’
  rationale: यूनानी पाठ सम्बद्ध व्यक्तियों की सटीक पहचान तय नहीं करता। अनुवाद में किसी एक व्याख्या को निश्चित करने के बजाय मूल अभिव्यक्ति और उसकी व्याख्यात्मक खुली जगह सुरक्षित रखी गई है।
- issue: αὐτοί का बलाघात
  choice: ‘वे स्वयं’
  alternative: केवल ‘वे’
  rationale: 'यूनानी का स्पष्ट और बलाघाती सर्वनाम यीशु के निष्कर्ष को तीखा करता है: उन्हीं विरोधियों से जुड़े लोग उनके दावे को दोषी ठहराएँगे।'
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बेटे’ मूल की प्रत्यक्ष पारिवारिक अभिव्यक्ति को बनाए रखता है, जबकि ‘न्यायाधीश’ सामान्य पाठक के लिए ‘न्यायी’ की अपेक्षा अधिक स्पष्ट है।
