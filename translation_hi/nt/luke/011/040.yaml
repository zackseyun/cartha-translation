  yaml_path: translation/nt/luke/011/040.yaml
  text: Fools! Did not the one who made the outside also make the inside?[a]
translation:
  language: hi
  text: मूर्खो! जिसने बाहर का बनाया, क्या उसी ने भीतर का भी नहीं बनाया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाहरी भाग ... भीतरी भाग।” ये शब्द निकट प्रसंग में पात्र के बाहर और भीतर, और विस्तृत अर्थ में मनुष्य के बाहरी तथा भीतरी जीवन—दोनों की ओर संकेत कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἄφρονες
  choice: मूर्खो
  rationale: सम्बोधन में प्रयुक्त बहुवचन विशेषण यहाँ संज्ञा की तरह है। ‘मूर्खो’ यीशु की फटकार की तीक्ष्णता को स्वाभाविक और संक्षिप्त हिन्दी में बनाए रखता है।
- source_word: οὐχ ... ἐποίησεν;
  choice: क्या ... नहीं बनाया?
  rationale: नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है। यह हिन्दी संरचना यूनानी आलंकारिक प्रश्न का बल सुरक्षित रखती है।
- source_word: ὁ ποιήσας
  choice: जिसने ... बनाया
  rationale: संज्ञा की तरह प्रयुक्त निश्चित कृदन्त का स्वाभाविक हिन्दी रूप है। यह कर्ता को परमेश्वर कहकर स्पष्ट किए बिना निहित व्यक्तिगत संकेत बनाए रखता है।
- source_word: τὸ ἔξωθεν
  choice: बाहर का
  rationale: यह बाहरी भाग या पहलू को दर्शाता है। ‘बाहर का’ निकट प्रसंग में पात्र के बाहरी भाग और व्यापक अर्थ में मनुष्य के बाहरी जीवन—दोनों की गुंजाइश रखता है।
- source_word: τὸ ἔσωθεν
  choice: भीतर का
  rationale: यह τὸ ἔξωθεν के समानान्तर आन्तरिक भाग या पहलू को दर्शाता है। ‘भीतर का’ पात्र के भीतरी भाग तथा मनुष्य की आन्तरिक नैतिक दशा—दोनों पर लागू हो सकता है।
- source_word: καὶ
  choice: भी
  rationale: आलंकारिक प्रश्न में ‘भी’ इस तर्क को स्पष्ट करता है कि बाहर का बनाने वाले ने भीतर का भी बनाया, जबकि मूल के बल से आगे नहीं जाता।
theological_decisions:
- issue: ‘जिसने ... बनाया’ का संकेत किसकी ओर है
  choice: परमेश्वर सृष्टिकर्ता की ओर निहित संकेत को स्पष्ट विस्तार किए बिना रखा गया है।
  alternative: इसे केवल पात्र या कटोरे को बनाने वाले कारीगर के तात्कालिक संदर्भ तक सीमित समझना।
  rationale: कथन पात्र के उदाहरण के स्तर पर काम करता है और साथ ही बाहर तथा भीतर दोनों के रचयिता की व्यापक सच्चाई पर आधारित है। यूनानी में ‘परमेश्वर’ जोड़े बिना अनुवाद दोनों स्तरों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और तीखी फटकार वाला स्वर। ‘बाहर का/भीतर का’ बोलचाल में सहज हैं और मूल की अर्थगत व्यापकता बनाए रखते हैं।
