id: LUK.11.51
reference: Luke 11:51
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀ἀπὸ αἵματος Ἅβελ ⸀ἕως αἵματος Ζαχαρίου τοῦ ἀπολομένου μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου· ναί, λέγω ὑμῖν, ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/051.yaml
  text: from the blood of Abel to the blood of Zechariah[a], who perished between the altar and the house. Yes, I tell you[b], it will be required from this generation.
translation:
  language: hi
  text: हाबिल के लहू से लेकर जकर्याह[b] के लहू तक, जो वेदी और भवन[a] के बीच मारा गया था। हाँ, मैं तुमसे कहता हूँ, इसका हिसाब इस पीढ़ी से लिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेदी और मंदिर के बीच”; यूनानी में शाब्दिक रूप से “वेदी और घर के बीच।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ बताए गए जकर्याह की पहचान विवादित है। संभावनाओं में यहोयादा का पुत्र जकर्याह (2 इतिहास 24:20–22) और बेरेक्याह का पुत्र जकर्याह शामिल हैं।
    reason: cross_reference
lexical_decisions:
- source_word: ἀπὸ αἵματος Ἅβελ … ἕως αἵματος Ζαχαρίου
  choice: हाबिल के लहू से लेकर जकर्याह के लहू तक
  rationale: ‘से लेकर … तक’ यूनानी ἀπό … ἕως की सीमा-सूचक संरचना और उसके आलंकारिक प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है। ‘लहू’ यहाँ रक्तपात और उससे जुड़े दोष का बाइबलीय भाव भी वहन करता है।
- source_word: τοῦ ἀπολομένου
  choice: जो … मारा गया था
  rationale: संदर्भ हिंसक मृत्यु का है। यह हिन्दी में स्वाभाविक है और कर्ता की पहचान जोड़े बिना जकर्याह की मृत्यु को व्यक्त करता है।
- source_word: μεταξὺ τοῦ θυσιαστηρίου καὶ τοῦ οἴκου
  choice: वेदी और भवन के बीच
  rationale: θυσιαστήριον के लिए ‘वेदी’ और οἶκος के मूल अर्थ के लिए ‘भवन’ रखा गया है। मंदिर-संदर्भ में इसका अभिप्राय परमेश्वर के भवन या मंदिर से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: ναί, λέγω ὑμῖν
  choice: हाँ, मैं तुमसे कहता हूँ
  rationale: यह यीशु के गंभीर, बलयुक्त कथन को निकटता और स्वाभाविकता से व्यक्त करता है।
- source_word: ἐκζητηθήσεται ἀπὸ τῆς γενεᾶς ταύτης
  choice: इसका हिसाब इस पीढ़ी से लिया जाएगा
  rationale: न्यायिक उत्तरदायित्व के भाव और यूनानी कर्मवाच्य को सुरक्षित रखता है, पर न्याय लेने वाले कर्ता को स्पष्ट रूप से नहीं जोड़ता। ‘इस पीढ़ी’ γενεά के समकालीन सामूहिक संकेत को बनाए रखता है।
theological_decisions:
- issue: जकर्याह की पहचान
  choice: मुख्य पाठ में केवल ‘जकर्याह’ रखा गया और संभावित पहचानें पादटिप्पणी में दी गईं।
  alternative: उसे यहोयादा का पुत्र जकर्याह या बेरेक्याह का पुत्र जकर्याह मानकर स्पष्ट पहचान देना।
  rationale: इस पद का यूनानी पाठ जकर्याह के पिता या अन्य पहचान का उल्लेख नहीं करता; इसलिए विवादित ऐतिहासिक पहचान को मुख्य पाठ में निश्चित करना उचित नहीं है।
- issue: ‘इस पीढ़ी’ से उत्तरदायित्व लिया जाना
  choice: कथन को उसी न्यायिक कर्मवाच्य और अनिर्दिष्ट कर्ता के साथ रखा गया है।
  alternative: परमेश्वर को स्पष्ट कर्ता बनाना या उत्तरदायित्व का दायरा किसी व्यापक धर्मवैज्ञानिक व्यवस्था के अनुसार समझाना।
  rationale: पाठ न्यायपूर्ण हिसाब लिए जाने की बात करता है, पर इस पद में कर्ता को नाम से नहीं बताता। अनुवाद उस तनाव और सीमित कथन को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘लहू’, ‘वेदी’ और ‘पीढ़ी’ परिचित बाइबलीय शब्दावली हैं; ‘भवन’ मूल ‘घर’ के भाव को रखते हुए मंदिर-संदर्भ में अधिक स्वाभाविक है। पादटिप्पणी-चिह्न उनके वास्तविक संदर्भों के पास रखे गए हैं।
