source:
  edition: SBLGNT
  text: Κἀγὼ ὑμῖν λέγω, αἰτεῖτε, καὶ δοθήσεται ὑμῖν· ζητεῖτε, καὶ εὑρήσετε· κρούετε, καὶ ἀνοιγήσεται ὑμῖν·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/009.yaml
  text: And I tell you[a], ask, and it will be given to you; seek, and you will find; knock, and it will be opened to you.
translation:
  language: hi
  text: और मैं तुमसे कहता हूँ:[a] माँगो, तो तुम्हें दिया जाएगा; खोजो, तो तुम पाओगे; खटखटाओ, तो तुम्हारे लिए खोला जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यूनानी वर्तमान आज्ञार्थों को अधिक स्पष्ट रूप से इस प्रकार भी व्यक्त किया जा सकता है: “माँगते रहो … खोजते रहो … खटखटाते रहो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: Κἀγὼ ὑμῖν λέγω
  choice: और मैं तुमसे कहता हूँ
  rationale: यह καὶ ἐγώ के संबंधसूचक और बलात्मक स्वर को स्वाभाविक हिन्दी में बनाए रखता है; λέγω का वर्तमानकालीन परिचय सीधे कथन को आरम्भ करता है।
- source_word: αἰτεῖτε
  choice: माँगो
  rationale: प्रार्थना के संदर्भ में यह सरल, स्वाभाविक आज्ञार्थ है। यूनानी वर्तमान आज्ञार्थ की संभावित निरंतरता को मुख्य पाठ में अनिवार्य रूप से स्पष्ट नहीं किया गया।
- source_word: δοθήσεται ὑμῖν
  choice: तुम्हें दिया जाएगा
  rationale: भविष्यत् कर्मवाच्य और दत्तिव ὑμῖν दोनों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ζητεῖτε
  choice: खोजो
  rationale: ζητέω की वास्तविक और रूपक दोनों व्यापकताओं को बनाए रखता है तथा समानांतर आज्ञाओं की संक्षिप्तता बचाता है।
- source_word: εὑρήσετε
  choice: तुम पाओगे
  rationale: भविष्यत् कर्तृवाच्य प्रतिज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है; यहाँ 'पाना' खोज के परिणाम के लिए स्वाभाविक है।
- source_word: κρούετε
  choice: खटखटाओ
  rationale: द्वार पर दस्तक देने की क्रिया का सटीक और मुहावरेदार हिन्दी रूप है।
- source_word: ἀνοιγήσεται ὑμῖν
  choice: तुम्हारे लिए खोला जाएगा
  rationale: यूनानी में द्वार स्पष्ट रूप से नहीं कहा गया है, इसलिए हिन्दी में भी निहित कर्म को अनकहा रखते हुए भविष्यत् कर्मवाच्य सुरक्षित रखा गया है।
theological_decisions:
- issue: वर्तमान आज्ञार्थ αἰτεῖτε, ζητεῖτε, κρούετε का पक्ष
  choice: मुख्य पाठ में सरल आज्ञार्थ—'माँगो, खोजो, खटखटाओ'
  alternative: माँगते रहो, खोजते रहो, खटखटाते रहो
  rationale: यूनानी वर्तमान आज्ञार्थ निरंतर या बार-बार की जाने वाली क्रिया का संकेत दे सकते हैं, पर वह अर्थ केवल इसी क्रियारूप से अनिवार्य नहीं है। इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है और अधिक स्पष्ट विकल्प पादटिप्पणी में देता है।
- issue: ἀνοιγήσεται का निहित कर्ता/कर्म
  choice: तुम्हारे लिए खोला जाएगा
  alternative: तुम्हारे लिए द्वार खोला जाएगा
  rationale: मूल यूनानी 'द्वार' शब्द नहीं जोड़ता; वह खटखटाने की क्रिया से समझा जाता है। अनावश्यक स्पष्टता से बचने के लिए मुख्य पाठ में उसे निहित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण संबोधन। 'तुम' बहुवचन ὑμῖν के अनुरूप है। तीनों आज्ञाओं और प्रतिज्ञाओं का समानांतर विन्यास सुरक्षित रखा गया है।
