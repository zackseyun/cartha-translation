base_translation:
  language: en
  yaml_path: translation/nt/luke/011/027.yaml
  text: And it happened[a], as he was saying these things, that a woman from the crowd raised her voice and said to him, “Blessed is the womb that carried you[b], and the breasts that nursed you.”
translation:
  language: hi
  text: जब वह ये बातें कह रहा था, तभी भीड़ में से एक स्त्री ने अपनी आवाज़ उठाकर उससे कहा, “धन्य है वह कोख जिसने तुझे धारण किया,[a] और वे स्तन जिनसे तूने दूध पिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसने तुझे जन्म दिया।” यूनानी क्रिया का मुख्य अर्थ गर्भ में धारण करना है; संदर्भ में “जन्म दिया” भी एक संभव अनुवाद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: तभी
  rationale: लूका के घटनासूचक संक्रमण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘और ऐसा हुआ कि’ अधिक शब्दशः होता, पर इस वाक्य में बोझिल लगता।
- source_word: ἐν τῷ λέγειν αὐτὸν ταῦτα
  choice: जब वह ये बातें कह रहा था
  rationale: ἐν के साथ वर्तमानकालिक articular infinitive समकालीन और जारी क्रिया दर्शाता है; ‘कह रहा था’ उस पक्ष को सुरक्षित रखता है।
- source_word: ἐπάρασά ... φωνὴν
  choice: ऊँची आवाज़ में
  rationale: यूनानी मुहावरे का अर्थ आवाज़ उठाकर या पुकारकर बोलना है; यह हिन्दी में स्वाभाविक ढंग से वही भाव देता है।
- source_word: τις ... γυνὴ ἐκ τοῦ ὄχλου
  choice: भीड़ में से एक स्त्री
  rationale: τις को अनिश्चित ‘एक’ से और ἐκ को स्रोत/स्थान के अर्थ में ‘में से’ द्वारा व्यक्त किया गया है।
- source_word: Μακαρία
  choice: धन्य है
  rationale: यह केवल निजी प्रसन्नता नहीं, बल्कि सम्मानित और अनुगृहीत दशा का कथन है; ‘धन्य’ बाइबलीय गरिमा और अर्थ दोनों बनाए रखता है।
- source_word: ἡ κοιλία
  choice: वह कोख
  rationale: मातृत्व के प्रसंग में κοιλία गर्भ या कोख को सूचित करता है; ‘कोख’ स्वाभाविक, ठोस और सम्मानपूर्ण हिन्दी है।
- source_word: ἡ βαστάσασά σε
  choice: जिसने तुझे धारण किया
  rationale: βαστάζω यहाँ गर्भ में उठाए रखने/धारण करने के अर्थ में है। ‘धारण किया’ गर्भावस्था का भाव रखता है और ‘जन्म दिया’ की तुलना में क्रिया की वास्तविक व्यापकता को अधिक सुरक्षित रखता है।
- source_word: μαστοὶ οὓς ἐθήλασας
  choice: वे स्तन जिनसे तूने दूध पिया
  rationale: यूनानी मातृ-स्तनों और शिशु के दूध पीने की ठोस छवि रखता है। हिन्दी में ‘जिनसे तूने दूध पिया’ ‘जिन्हें तूने चूसा’ से अधिक स्वाभाविक और गरिमापूर्ण है।
theological_decisions:
- issue: यीशु की माता को सम्मानित करने वाले कथन में Μακαρία का अनुवाद
  choice: धन्य है वह कोख जिसने तुझे धारण किया, और वे स्तन जिनसे तूने दूध पिया
  alternative: सुखी है वह कोख… / सौभाग्यशाली है वह कोख…
  rationale: ‘धन्य’ स्त्री के सम्मानसूचक उद्गार को न घटाता है, न बाद की किसी मरियम-संबंधी धर्मसैद्धान्तिक व्याख्या को पाठ में जोड़ता है। कथन की मूल धार्मिक और भावात्मक शक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखा गया है। यीशु के लिए ‘तू/तुझे’ मूल एकवचन संबोधन की निकटता और प्रचलित हिन्दी बाइबल शैली के अनुरूप है। शारीरिक मातृत्व की मूल ठोस छवि को किसी व्यंजना या मतगत विस्तार से नहीं बदला गया।
