source:
  edition: SBLGNT
  text: τινὲς δὲ ἐξ αὐτῶν εἶπον· Ἐν Βεελζεβοὺλ ⸀τῷ ἄρχοντι τῶν δαιμονίων ἐκβάλλει τὰ δαιμόνια·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/015.yaml
  text: But some of them said[a], “By Beelzebul, the ruler of the demons, he casts out demons.”
translation:
  language: hi
  text: परन्तु उनमें से कुछ ने कहा, “यह दुष्टात्माओं के शासक बेलज़बूल[a] के द्वारा दुष्टात्माओं को निकालता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'बेलज़बूब: इस नाम का एक पारम्परिक रूप; यहाँ यूनानी पाठ के अनुसार ‘बेलज़बूल’ लिखा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: τινὲς δὲ ἐξ αὐτῶν
  choice: परन्तु उनमें से कुछ
  rationale: δὲ पिछले प्रसंग की प्रतिक्रिया से विरोध दिखाता है, और ἐξ αὐτῶν का अंशवाचक भाव ‘उनमें से’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: Ἐν Βεελζεβοὺλ
  choice: बालज़बूल की शक्ति से
  rationale: यहाँ ἐν साधन अथवा प्रभावकारी सामर्थ्य का संकेत देता है। केवल ‘बालज़बूल से’ की अपेक्षा यह हिन्दी में आरोप का आशय अधिक स्पष्ट करता है, जबकि व्यक्ति और उसकी कथित शक्ति के बीच कोई अतिरिक्त धर्मवैज्ञानिक भेद नहीं गढ़ता।
- source_word: τῷ ἄρχοντι τῶν δαιμονίων
  choice: दुष्टात्माओं के शासक
  rationale: ἄρχων अधिकार रखने वाले शासक को सूचित करता है; ‘शासक’ आधुनिक और स्पष्ट है। τῶν δαιμονίων उन दुष्टात्माओं को बताता है जिन पर उसका अधिकार माना गया है।
- source_word: ἐκβάλλει τὰ δαιμόνια
  choice: दुष्टात्माओं को निकालता है
  rationale: ἐκβάλλω झाड़-फूँक अथवा दुष्टात्मा-निष्कासन के प्रसंग में बाहर निकालने का अर्थ रखता है। ‘निकालता है’ स्वाभाविक हिन्दी है और δαιμόνια को सीधे ‘दुष्टात्माएँ’ के रूप में रखता है।
theological_decisions:
- issue: Βεελζεβούλ नाम का रूप
  choice: बालज़बूल
  alternative: बालज़बूब
  rationale: मुख्य पाठ यूनानी Βεελζεβούλ के रूप का लिप्यंतरण करता है। परिचित पारम्परिक रूप ‘बालज़बूब’ को पाठ में प्रतिस्थापित करने के बजाय पाद-टिप्पणी में रखा गया है।
- issue: ἄρχων की उपाधि
  choice: शासक
  alternative: प्रधान
  rationale: ‘शासक’ अधिकार का सामान्य और स्पष्ट अर्थ देता है तथा पद में न दी गई किसी विस्तृत दानव-व्यवस्था को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; वाक्य संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखा गया है। आरोप को प्रत्यक्ष कथन के रूप में सुरक्षित रखा गया है।
