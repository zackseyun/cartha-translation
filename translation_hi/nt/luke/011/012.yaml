  yaml_path: translation/nt/luke/011/012.yaml
  text: Or if he asks for an egg, will he give him a scorpion?
translation:
  language: hi
  text: या यदि वह अंडा माँगे, तो क्या वह उसे बिच्छू देगा?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἢ καὶ
  choice: या यदि
  rationale: यह यीशु के समानांतर उदाहरणों की अगली कड़ी प्रस्तुत करता है। हिंदी में “या यदि” स्वाभाविक है और καί का अनावश्यक अलग अनुवाद किए बिना क्रम को बनाए रखता है।
- source_word: αἰτήσει
  choice: वह … माँगे
  rationale: भविष्यत् सूचक रूप यहाँ शर्त-सदृश आलंकारिक प्रश्न में है; हिंदी में संभावनार्थक “माँगे” स्वाभाविक रूप से किसी पिता से वस्तु माँगने का भाव व्यक्त करता है।
- source_word: ᾠόν
  choice: अंडा
  rationale: यह यूनानी संज्ञा का सीधा और प्रचलित हिंदी अर्थ है।
- source_word: ἐπιδώσει
  choice: क्या … देगा
  rationale: संदर्भ में क्रिया का अर्थ माँगी गई वस्तु के उत्तर में कुछ देना है; “देगा” सामान्य और स्वाभाविक हिंदी है।
- source_word: αὐτῷ
  choice: उसे
  rationale: यह दत्तिव एकवचन सर्वनाम का स्वाभाविक हिंदी रूप है और पाने वाले व्यक्ति को दर्शाता है।
- source_word: σκορπίον
  choice: बिच्छू
  rationale: यह मानक अर्थ है और अंडे के साथ किया गया तीखा तथा असंगत विरोध सुरक्षित रखता है।
theological_decisions:
- issue: पिता-संतान की उपमा का आलंकारिक बल
  choice: इसे बिना व्याख्यात्मक विस्तार के सीधे आलंकारिक प्रश्न के रूप में रखा गया है।
  alternative: अंतर्निहित विरोध स्पष्ट करने के लिए “उसके बदले” जोड़ना।
  rationale: यूनानी पाठ इस असंगत विरोध को निहित छोड़ता है। हिंदी पाठक प्रश्न का आशय सहज समझ सकते हैं; इसलिए अतिरिक्त व्याख्या जोड़े बिना पिता की भलाई की ओर संकेत करने वाला तर्क सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक शिक्षा के संदर्भ में स्वाभाविक। “माँगे” शर्त-सदृश भाव को और “क्या … देगा?” अपेक्षित नकारात्मक उत्तर वाले आलंकारिक प्रश्न को स्पष्ट रखता है।
