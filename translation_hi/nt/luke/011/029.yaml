source:
  edition: SBLGNT
  text: Τῶν δὲ ὄχλων ἐπαθροιζομένων ἤρξατο λέγειν· Ἡ γενεὰ αὕτη ⸀γενεὰ πονηρά ἐστιν· σημεῖον ⸀ζητεῖ, καὶ σημεῖον οὐ δοθήσεται αὐτῇ εἰ μὴ τὸ σημεῖον ⸀Ἰωνᾶ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/029.yaml
  text: As the crowds were gathering[a], he began to say, “This generation is an evil generation. It seeks a sign[b], and no sign will be given to it except the sign of Jonah.”
translation:
  language: hi
  text: जब भीड़ें इकट्ठी हो रही थीं, तो वह कहने लगा, “यह पीढ़ी बुरी[a] पीढ़ी है। यह एक चिह्न खोजती है, और योना के चिह्न[b] को छोड़ इसे कोई चिह्न नहीं दिया जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुष्ट’।
    reason: lexical_alternative
  - marker: b
    text: ‘योना का चिह्न’ योना के भविष्यद्वक्ताई कार्य के द्वारा उसके स्वयं एक चिह्न होने की ओर संकेत कर सकता है; सुसमाचारों के समानान्तर अंशों के प्रकाश में यह यीशु की मृत्यु और पुनरुत्थान के साथ प्रतिरूपात्मक सम्बन्ध की ओर भी संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπαθροιζομένων
  choice: इकट्ठी होती जा रही थीं
  rationale: वर्तमानकालिक कृदंत जारी और बढ़ती हुई सभा का भाव देता है; यह रूप उस प्रगतिशील क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἤρξατο λέγειν
  choice: कहने लगा
  rationale: यह आरम्भसूचक यूनानी रचना के पहलू को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: γενεά
  choice: पीढ़ी
  rationale: यह सामान्य हिन्दी समतुल्य है और यीशु के समकालीन लोगों के सामूहिक कालगत तथा नैतिक संदर्भ को खुला रखता है।
- source_word: πονηρά
  choice: बुरी
  rationale: यह स्पष्ट, आधुनिक और सहज नैतिक मूल्यांकन है; ‘दुष्ट’ अधिक प्रबल किंतु सम्भव विकल्प है।
- source_word: σημεῖον
  choice: चिह्न
  rationale: यह किसी प्रमाणित करने वाले संकेत या अद्भुत कार्य, दोनों की सम्भावना को बनाए रखता है और मूल में निहित न होने पर ‘चमत्कारी’ नहीं जोड़ता।
- source_word: ζητεῖ
  choice: खोजती है
  rationale: यह क्रिया के मूल अर्थ के निकट है; प्रसंग में निहित माँगपूर्ण रवैये को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ा गया।
- source_word: δοθήσεται
  choice: दिया जाएगा
  rationale: यह भविष्यत् कर्मवाच्य का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: εἰ μὴ
  choice: को छोड़
  rationale: नकारात्मक कथन के बाद यह अपवाद को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: τὸ σημεῖον Ἰωνᾶ
  choice: योना का चिह्न
  rationale: सम्बन्धकारक पदबंध को जानबूझकर खुला रखा गया है, ताकि वह योना स्वयं, उसके नबूवत के कार्य, या व्यापक सुसमाचार-सन्दर्भ में प्रतिरूपात्मक अर्थ की सम्भावना को समय से पहले निश्चित न करे।
theological_decisions:
- issue: ‘यह पीढ़ी’ की निन्दा का विस्तार
  choice: यीशु के समकालीन लोगों का व्यापक सामूहिक नैतिक मूल्यांकन
  alternative: केवल वहाँ उपस्थित कुछ विशेष विरोधियों के लिए सीमित संकेत
  rationale: ‘यह पीढ़ी बुरी पीढ़ी है’ में संज्ञा की पुनरावृत्ति व्यापक सामूहिक निन्दा पर बल देती है; अनुवाद उसके संदर्भ को मूल से अधिक संकरा नहीं करता।
- issue: ‘योना के चिह्न’ का अर्थ
  choice: मुख्य पाठ में सम्बन्धकारक अभिव्यक्ति को व्याख्यात्मक रूप से खुला रखा गया
  alternative: केवल योना का प्रचार और लोगों का मन फिराना; अथवा केवल यीशु की मृत्यु और पुनरुत्थान का प्रतिरूप
  rationale: लूका का निकटवर्ती प्रसंग योना के नबूवत के कार्य पर प्रकाश डालता है, जबकि अन्य सुसमाचारों के समानान्तर अंश मृत्यु और पुनरुत्थान से प्रतिरूपात्मक सम्बन्ध भी सुझाते हैं। मुख्य पाठ किसी एक अर्थ को अनावश्यक रूप से निर्णायक नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मौखिक रूप से स्पष्ट शैली अपनाई गई है। ‘भीड़ें’ यूनानी बहुवचन को दर्शाता है; ‘चिह्न’ धार्मिक रूप से परिचित होने के साथ मूल की अर्थगत खुलावट बनाए रखता है।
