  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἰ δὲ καὶ ὁ Σατανᾶς ἐφ’ ἑαυτὸν διεμερίσθη, πῶς σταθήσεται ἡ βασιλεία αὐτοῦ; ὅτι λέγετε ἐν Βεελζεβοὺλ ἐκβάλλειν με τὰ δαιμόνια.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/018.yaml
  text: But if Satan also is divided against himself[a], how will his kingdom stand? For you say that I cast out the demons by Beelzebul.
translation:
  language: hi
  text: पर यदि शैतान भी अपने ही विरुद्ध बँट गया है, तो उसका राज्य कैसे टिका रहेगा? क्योंकि तुम कहते हो कि मैं बेलज़ेबूल[a] के द्वारा दुष्टात्माओं को निकालता हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी पाठ में नाम का रूप ‘बेलज़ेबूल’ है; कुछ अनुवाद-परंपराओं में ‘बेलज़ेबूब’ मिलता है।
    reason: यूनानी पाठ के नाम-रूप और उसके प्रचलित वैकल्पिक रूप की जानकारी देना।
lexical_decisions:
- source_word: Σατανᾶς
  choice: शैतान
  rationale: यह इस व्यक्तिगत नाम/उपाधि का आधुनिक मानक हिन्दी रूप है।
- source_word: ἐφ’ ἑαυτὸν διεμερίσθη
  choice: अपने ही विरुद्ध बँट गया है
  rationale: ἐπί के साथ आत्मवाचक सर्वनाम यहाँ आंतरिक विरोध व्यक्त करता है; पूर्ण क्रिया वर्तमान में बनी हुई विभाजित दशा को सामने रखती है।
- source_word: πῶς σταθήσεται
  choice: कैसे टिका रहेगा
  rationale: यह राज्य के बने रहने या स्थिर रहने की भावी क्षमता को व्यक्त करता है और मूल रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: βασιλεία
  choice: राज्य
  rationale: संदर्भ में यह शैतान के अधिकार-क्षेत्र या प्रभुत्व को दर्शाता है; ‘राज्य’ विभाजित राज्य के रूपक को सुरक्षित रखता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह विरोधियों के आरोप को पिछले तर्क के आधार के रूप में प्रस्तुत करता है।
- source_word: ἐν Βεελζεβοὺλ
  choice: बालज़बूल के द्वारा
  rationale: ἐν यहाँ साधन अथवा कर्तृत्व का भाव रखता है; ‘के द्वारा’ आरोप को स्पष्ट करता है, पर ‘उसकी शक्ति से’ जैसी व्याख्यात्मक वृद्धि नहीं जोड़ता।
- source_word: ἐκβάλλειν
  choice: निकालता हूँ
  rationale: दुष्टात्मा निकालने के संदर्भ में यह सहज, प्रचलित और मूल क्रिया के बल के अनुरूप हिन्दी है।
- source_word: τὰ δαιμόνια
  choice: दुष्टात्माओं
  rationale: आधुनिक हिन्दी बाइबलीय प्रयोग में यह δαιμόνια का स्पष्ट और सामान्य अर्थ देता है।
theological_decisions:
- issue: यीशु के विरोधियों के आरोप का स्वरूप
  choice: आरोप को इस रूप में रखा गया है कि यीशु बालज़बूल के द्वारा दुष्टात्माओं को निकालते हैं।
  alternative: बालज़बूल की शक्ति से अथवा उसके साथ मिलकर दुष्टात्माओं को निकालते हैं।
  rationale: मूल यूनानी साधन या कर्तृत्व का संकेत देता है, पर सहयोग अथवा शक्ति के स्वरूप की विस्तृत व्याख्या नहीं करता; इसलिए अनावश्यक धर्मवैज्ञानिक विस्तार नहीं जोड़ा गया।
- issue: शैतान के राज्य की आंतरिक विभाजित दशा
  choice: ‘अपने ही विरुद्ध बँट गया है’
  alternative: ‘अपने आप में बँटा हुआ है’
  rationale: चुना हुआ रूप आंतरिक विरोध की धार को बनाए रखता है और यीशु के तर्क को किसी व्यवस्थित धर्मवैज्ञानिक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टिका रहेगा’ सामान्य पाठक के लिए स्वाभाविक है और राज्य के स्थिर रहने का मूल रूपक भी बचाता है। पाद-टिप्पणी का चिह्न उसी नाम के बाद रखा गया है जिससे वह संबंधित है।
