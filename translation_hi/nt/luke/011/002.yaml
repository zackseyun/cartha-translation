  edition: SBLGNT
  text: εἶπεν δὲ αὐτοῖς· Ὅταν προσεύχησθε, λέγετε· ⸀Πάτερ, ἁγιασθήτω τὸ ὄνομά σου· ἐλθέτω ἡ βασιλεία ⸀σου·
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/002.yaml
  text: 'And he said to them[a], “When you pray, say: ‘Father, hallowed be your name[b]. Your kingdom come.’”'
translation:
  language: hi
  text: 'और उसने उनसे कहा, “जब तुम प्रार्थना करो, तो कहो: ‘पिता[a], आपका नाम पवित्र माना जाए। आपका राज्य आए।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ परंपराओं में मत्ती 6:9 के समान “हमारे पिता” मिलता है, पर यहाँ यूनानी पाठ में केवल “पिता” है।
    reason: alternative_reading
lexical_decisions:
- source_word: Ὅταν προσεύχησθε
  choice: जब तुम प्रार्थना करो
  rationale: सामान्य काल-संबंधी शर्त और बार-बार होने वाली प्रार्थना के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: λέγετε
  choice: तो कहो
  rationale: वर्तमान आज्ञार्थक का निर्देशात्मक भाव सरल और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: Πάτερ
  choice: पिता
  rationale: यूनानी पाठ में केवल सम्बोधन ‘पिता’ है; मत्ती 6:9 के समान ‘हमारे पिता’ जोड़ना पाठों का सामंजस्य करना होगा।
- source_word: ἁγιασθήτω τὸ ὄνομά σου
  choice: आपका नाम पवित्र माना जाए
  rationale: निष्क्रिय आज्ञार्थक की प्रार्थनात्मक शक्ति को बनाए रखता है और यह स्पष्ट करता है कि विनती परमेश्वर के नाम को पवित्र मानने और आदर देने की है, न कि उसमें पहले से अनुपस्थित पवित्रता उत्पन्न करने की।
- source_word: ἐλθέτω ἡ βασιλεία σου
  choice: आपका राज्य आए
  rationale: प्रार्थनात्मक आज्ञार्थक को संक्षिप्त और सहज हिन्दी में रखता है। ‘राज्य’ βασιλεία के शासन तथा भावी राज्य—दोनों आयामों को खुला रखता है।
theological_decisions:
- issue: परमेश्वर को ‘पिता’ कहना, ‘हमारे पिता’ नहीं
  choice: पिता
  alternative: हमारे पिता
  rationale: प्रदत्त SBLGNT पाठ में Πάτερ ही है। अनुवाद मत्ती 6:9 या प्रार्थना-परंपरा के आधार पर इसे विस्तृत नहीं करता।
- issue: परमेश्वर के नाम के पवित्र किए जाने की विनती
  choice: आपका नाम पवित्र माना जाए
  alternative: आपका नाम पवित्र हो
  rationale: चुना हुआ रूप यूनानी निष्क्रियता और नाम के प्रति मनुष्यों के आदर के सम्भावित भाव को स्पष्ट करता है, फिर भी यह निर्धारित नहीं करता कि कर्ता केवल मनुष्य हैं या परमेश्वर स्वयं अपने नाम को पवित्र ठहराते हैं।
- issue: βασιλεία का अर्थ
  choice: राज्य
  alternative: शासन
  rationale: ‘राज्य’ सुसमाचारों की परिचित भाषा है और परमेश्वर के सक्रिय शासन तथा उसके पूर्ण भावी प्रकट होने के बीच की धर्मवैज्ञानिक व्यापकता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रार्थना के अनुकूल है। शिष्यों के लिए बहुवचन ‘तुम’ और परमेश्वर के लिए आदरसूचक ‘आपका’ रखा गया है।
