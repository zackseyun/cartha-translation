base_translation:
  language: en
  yaml_path: translation/nt/luke/011/010.yaml
  text: For everyone who asks receives[a], and the one who seeks finds, and to the one who knocks it will be opened.
translation:
  language: hi
  text: क्योंकि जो कोई माँगता है, उसे मिलता है; जो खोजता है, वह पाता है; और जो खटखटाता है, उसके लिए खोला जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंग के अनुसार अधिक स्पष्ट रूप से, “जो खटखटाता है, उसके लिए दरवाज़ा खोला जाएगा।” यूनानी में खोली जाने वाली वस्तु नहीं बताई गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς
  choice: जो कोई
  rationale: यह पदबंध कृदंत के साथ प्रयुक्त πᾶς के वितरणात्मक और सार्वभौमिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले उपदेश के कारण या स्पष्टीकरण के रूप में इस कथन का संबंध स्पष्ट करता है।
- source_word: ὁ αἰτῶν
  choice: जो ... माँगता है
  rationale: वर्तमान कृदंत के सामान्य और निरंतर चरित्र को सहज हिन्दी में बनाए रखता है।
- source_word: λαμβάνει
  choice: उसे मिलता है
  rationale: माँगने के उत्तर में प्राप्त होने का अर्थ व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: ὁ ζητῶν
  choice: जो खोजता है
  rationale: खोजने की सामान्य या जारी क्रिया को ठीक प्रकार से व्यक्त करता है।
- source_word: εὑρίσκει
  choice: वह पा लेता है
  rationale: खोज के परिणामस्वरूप मिलने का सीधा और मुहावरेदार हिन्दी रूप है; यह पहले खंड के ‘मिलता है’ से आवश्यक शैलीगत भेद भी रखता है।
- source_word: τῷ κρούοντι
  choice: जो खटखटाता है, उसके लिए
  rationale: सम्प्रदान कारक और निष्क्रिय क्रिया के संबंध को हिन्दी में स्पष्ट तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἀνοιγήσεται
  choice: खोला जाएगा
  rationale: भविष्यत् निष्क्रिय रूप को बनाए रखता है और यूनानी पाठ में अनकहे कर्म को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: प्रतिज्ञा का सार्वभौमिक दायरा और बल
  choice: कथन को बिना किसी जोड़ी हुई शर्त के सामान्य सार्वभौमिक सिद्धांत के रूप में प्रस्तुत किया गया है।
  alternative: इसे केवल अतिशयोक्तिपूर्ण प्रोत्साहन मानना या ‘जो ठीक रीति से माँगता है’ जैसी व्याख्यात्मक शर्त जोड़ना।
  rationale: यूनानी पाठ प्रार्थना के प्रसंग में बिना व्यक्त शर्त के सार्वभौमिक कथन करता है; अनुवाद इस धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: ἀνοιγήσεται का अनकहा कर्म
  choice: मुख्य पाठ में केवल ‘खोला जाएगा’ रखा गया है।
  alternative: ‘दरवाज़ा खोला जाएगा’ लिखकर कर्म को स्पष्ट करना।
  rationale: प्रसंग से दरवाज़ा समझ में आता है, पर यूनानी पाठ कर्म को व्यक्त नहीं करता; इसलिए उसे पादटिप्पणी में स्पष्ट करना अधिक स्रोत-संगत है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘जो कोई’ सार्वभौमिकता व्यक्त करता है; तीनों समानांतर कथनों की लय अर्धविरामों द्वारा स्पष्ट की गई है।
