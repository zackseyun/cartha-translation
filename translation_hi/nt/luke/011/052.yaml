source:
  edition: SBLGNT
  text: οὐαὶ ὑμῖν τοῖς νομικοῖς, ὅτι ἤρατε τὴν κλεῖδα τῆς γνώσεως· αὐτοὶ οὐκ εἰσήλθατε καὶ τοὺς εἰσερχομένους ἐκωλύσατε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/052.yaml
  text: Woe to you lawyers[a], because you took away the key of knowledge; you yourselves did not enter[b], and you hindered those who were entering.
translation:
  language: hi
  text: “तुम पर हाय, हे व्यवस्था के विशेषज्ञों[a]! क्योंकि तुमने ज्ञान की कुंजी[b] हटा दी। तुम स्वयं भीतर नहीं गए, और जो भीतर जा रहे थे, उन्हें तुमने रोक दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् यहूदी व्यवस्था के विद्वान; यहाँ आधुनिक अर्थ में वकीलों की बात नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या, “ज्ञान तक पहुँचने की कुंजी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: οὐαί
  choice: तुम पर हाय
  rationale: यह अभिव्यक्ति भविष्यद्वक्ताओं जैसी कठोर भर्त्सना और आने वाले संकट की चेतावनी—दोनों भावों को बनाए रखती है।
- source_word: νομικοῖς
  choice: व्यवस्था के विशेषज्ञो
  rationale: यहाँ आशय यहूदी धार्मिक व्यवस्था के विद्वानों से है, आधुनिक दीवानी या फौजदारी वकीलों से नहीं। यह अनुवाद आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: ἤρατε
  choice: छीन ली
  rationale: संदर्भ में αἴρω केवल उठाने के बजाय किसी वस्तु को दूसरों की पहुँच से हटा लेने का भाव देता है; ‘छीन ली’ उस आरोप और पहुँच से वंचित करने की छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: κλεῖδα τῆς γνώσεως
  choice: ज्ञान की कुंजी
  rationale: यह यूनानी संबंधवाचक रचना और उसकी रूपकात्मकता को निकटता से बनाए रखता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: αὐτοὶ
  choice: तुम स्वयं
  rationale: स्वतंत्र सर्वनाम का बल सुरक्षित रहता है और विशेषज्ञों तथा प्रवेश करने वालों के बीच आरोपपूर्ण विरोध उभरता है।
- source_word: οὐκ εἰσήλθατε
  choice: भीतर नहीं गए
  rationale: प्रवेश के रूपक को बिना यह जोड़े बनाए रखता है कि वे किसमें प्रवेश नहीं किए।
- source_word: τοὺς εἰσερχομένους
  choice: जो भीतर जा रहे थे
  rationale: वर्तमान कृदंत की जारी क्रिया को व्यक्त करता है, पर ‘प्रयास कर रहे थे’ जैसी अतिरिक्त धारणा नहीं जोड़ता।
- source_word: ἐκωλύσατε
  choice: रोक दिया
  rationale: यह प्रवेश में बाधा पहुँचाने का सीधा और स्वाभाविक हिन्दी रूप है; संदर्भ में इसका परिणामात्मक बल भी उपयुक्त है।
theological_decisions:
- issue: ‘ज्ञान की कुंजी’ और ‘भीतर जाने’ के रूपक का अभिप्राय
  choice: मुख्य पाठ में प्रवेश और पहुँच के रूपक को बिना किसी स्पष्ट कर्म के बनाए रखा गया है।
  alternative: इसे परमेश्वर के राज्य में प्रवेश या परमेश्वर के सच्चे ज्ञान में प्रवेश के रूप में स्पष्ट किया जा सकता था।
  rationale: यूनानी पाठ यह नहीं बताता कि वे ठीक किसमें प्रवेश नहीं किए। किसी एक धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ने के बजाय मूल अस्पष्टता और उसका तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तुम पर हाय’ भविष्यद्वक्ताओं जैसी भर्त्सना का गंभीर स्वर रखता है, जबकि ‘व्यवस्था के विशेषज्ञ’ आज के पाठक को अभिप्रेत समूह स्पष्ट करता है। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न [a] और [b] संबंधित पदों के तुरंत बाद दिए गए हैं।
