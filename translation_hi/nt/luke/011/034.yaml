source:
  edition: SBLGNT
  text: ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός ⸀σου. ⸀ὅταν ὁ ὀφθαλμός σου ἁπλοῦς ᾖ, καὶ ὅλον τὸ σῶμά σου φωτεινόν ἐστιν· ἐπὰν δὲ πονηρὸς ᾖ, καὶ τὸ σῶμά σου σκοτεινόν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/011/034.yaml
  text: The lamp of your body is your eye[a]. When your eye is healthy, your whole body also is full of light; but when it is bad[b], your body also is dark.
translation:
  language: hi
  text: तुम्हारे शरीर का दीपक तुम्हारी आँख है। जब तुम्हारी आँख स्वस्थ[a] होती है, तो तुम्हारा पूरा शरीर भी प्रकाश से भरा होता है; लेकिन जब वह बुरी[b] होती है, तो तुम्हारा शरीर भी अँधकारमय होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साफ़,” “ठीक,” अथवा पारंपरिक रूप से “अविभाजित।” यूनानी विशेषण में अविभाजित या ठीक होने का भाव हो सकता है; यहाँ यह “बुरी” आँख के विपरीत आँख का वर्णन करता है।
    reason: lexical_alternative
  - marker: b
    text: या “खराब” अथवा “दुष्ट।” यूनानी शब्द शारीरिक दोष और नैतिक बुराई—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: λύχνος
  choice: दीपक
  rationale: यह शब्द अमूर्त ‘प्रकाश’ नहीं, बल्कि प्रकाश देने वाले ठोस दीपक को दर्शाता है; इससे मूल रूपक बना रहता है।
- source_word: σῶμα
  choice: शरीर
  rationale: यहाँ सामान्य अर्थ भौतिक शरीर है, जिसे दृष्टि और आंतरिक नैतिक या आत्मिक दशा के रूपक में रखा गया है।
- source_word: ὀφθαλμός
  choice: आँख
  rationale: शारीरिक अंग का सीधा अर्थ रखा गया है, क्योंकि इसी से आंतरिक दृष्टि का रूपक बनता है।
- source_word: ἁπλοῦς
  choice: स्वस्थ
  rationale: आँख और शरीर के प्रकाश वाले निकट संदर्भ में यह ठीक तरह काम करने वाली, सही या अखंड आँख का स्वाभाविक हिन्दी संकेत देता है; अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: φωτεινόν
  choice: प्रकाश से भर जाता है
  rationale: यह विशेषण ‘प्रकाशमय’ या ‘प्रकाश से भरा’ होने का भाव देता है; यह हिन्दी में सहज है और प्रकाश के बिंब को स्पष्ट रखता है।
- source_word: πονηρός
  choice: बुरी
  rationale: यह चुनाव शारीरिक रूप से खराब और नैतिक रूप से बुरी दृष्टि—दोनों संभावनाओं को खुला रखता है, बिना इसे केवल रोगग्रस्त या केवल दुष्ट ठहराए।
- source_word: σκοτεινόν
  choice: अँधेरा
  rationale: यह φωτεινόν के साथ सीधा विरोध बनाए रखता है और हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: ‘ἁπλοῦς’ का अर्थ
  choice: मुख्य पाठ में ‘स्वस्थ’
  alternative: साफ़, ठीक, एकनिष्ठ/अविभाजित
  rationale: आँख के दीपक होने और पूरे शरीर के प्रकाशमय या अँधेरा होने के तात्कालिक रूपक में कार्यात्मक अर्थ सबसे सहज है। फिर भी यूनानी शब्द में एकनिष्ठता या अविभाजित दशा का भाव हो सकता है, जिसे पादटिप्पणी में रखा गया है।
- issue: ‘πονηρός’ का शारीरिक और नैतिक आशय
  choice: ‘बुरी’
  alternative: खराब, अस्वस्थ, दुष्ट
  rationale: ‘बुरी’ मूल शब्द की व्यापकता को बनाए रखती है और दोषपूर्ण आँख तथा नैतिक रूप से विकृत दृष्टि के बीच की वास्तविक अस्पष्टता को समाप्त नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण शैली रखी गई है। ‘दीपक,’ ‘आँख,’ ‘शरीर,’ ‘प्रकाश’ और ‘अँधेरा’ के ठोस रूपक सुरक्षित हैं। स्त्रीलिंग ‘वह’ का निकट संदर्भ ‘आँख’ है।
