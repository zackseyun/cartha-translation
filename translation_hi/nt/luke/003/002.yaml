  text: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα, ἐγένετο ῥῆμα θεοῦ ἐπὶ Ἰωάννην τὸν Ζαχαρίου υἱὸν ἐν τῇ ἐρήμῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/002.yaml
  text: during the high priesthood of Annas and Caiaphas[a], the word of God came to John, the son of Zechariah, in the wilderness.
translation:
  language: hi
  text: हन्ना और कैफा के महायाजकत्व के समय[a], परमेश्वर का वचन जंगल में जकरयाह के पुत्र यूहन्ना के पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “हन्ना और कैफा के महायाजकत्व में।” लूका दोनों व्यक्तियों का नाम लेता है, यद्यपि यूनानी में “महायाजक” एकवचन है।
    reason: alternative_reading
lexical_decisions:
- source_word: ἐπὶ ἀρχιερέως Ἅννα καὶ Καϊάφα
  choice: हन्ना और कैफा के महायाजकत्व के समय
  rationale: ἐπί के साथ संबंधकारक यहाँ समय का संकेत देता है। ‘महायाजकत्व’ को एकवचन रखकर यूनानी ἀρχιερέως और दो नामों के बीच विद्यमान तनाव सुरक्षित रखा गया है।
- source_word: ἐγένετο ῥῆμα θεοῦ
  choice: परमेश्वर का वचन ... आया
  rationale: यह भविष्यद्वक्ताओं को मिले प्रकाशन का परिचित बाइबलीय मुहावरा है। ‘आया’ ἐγένετο की घटनात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐπὶ Ἰωάννην
  choice: यूहन्ना के पास
  rationale: प्रकाशन के आने के संदर्भ में ἐπί के साथ कर्मकारक लक्ष्य को दर्शाता है; ‘के पास आया’ आधुनिक हिन्दी में स्वाभाविक है और ‘पर उतरा’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: τὸν Ζαχαρίου υἱὸν
  choice: जकरयाह के पुत्र
  rationale: यह समानाधिकरण पद यूहन्ना की पहचान बताता है। यह रूप लूका की औपचारिक कथाशैली के अनुकूल है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: जंगल में
  rationale: ἔρημος यहाँ निर्जन या विरल आबादी वाले प्रदेश को दर्शाता है, अनिवार्यतः रेतीले मरुस्थल को नहीं। ‘जंगल’ सामान्य हिन्दी बाइबल-प्रयोग में इस अर्थ को सहजता से व्यक्त करता है।
theological_decisions:
- issue: एकवचन ἀρχιερέως के साथ हन्ना और कैफा दोनों का उल्लेख
  choice: हन्ना और कैफा के महायाजकत्व के समय
  alternative: जब हन्ना और कैफा महायाजक थे
  rationale: चुना हुआ अनुवाद पद को संस्थागत रूप में एकवचन रखता है और दो व्यक्तियों के उल्लेख से उत्पन्न ऐतिहासिक-साहित्यिक तनाव को सुलझाए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘महायाजकत्व’ कुछ औपचारिक है, पर मूल पाठ की एकवचन संस्थागत अभिव्यक्ति और उसके निहित तनाव को सुरक्षित रखने के लिए आवश्यक है।
