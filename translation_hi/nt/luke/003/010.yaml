  text: Καὶ ἐπηρώτων αὐτὸν οἱ ὄχλοι λέγοντες· Τί οὖν ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/010.yaml
  text: And the crowds were asking him[a], saying, “What then should we do?”
translation:
  language: hi
  text: और भीड़ उससे पूछती रही, “तो फिर हम क्या करें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπηρώτων
  choice: पूछती रही
  rationale: अपूर्णकाल चलती या बार-बार होने वाली क्रिया को व्यक्त करता है; ‘पूछती रही’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οἱ ὄχλοι
  choice: भीड़
  rationale: यूनानी में शब्द बहुवचन है और एकत्र जनसमूहों को दर्शाता है। इस प्रसंग में हिन्दी का सामूहिक एकवचन ‘भीड़’ अधिक स्वाभाविक है और अर्थ को सुरक्षित रखता है।
- source_word: λέγοντες
  choice: प्रत्यक्ष प्रश्न के रूप में अंतर्निहित
  rationale: यूनानी कृदंत प्रश्न की विषयवस्तु प्रस्तुत करता है। हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता; सीधे उद्धरण से वही संबंध स्पष्ट है।
- source_word: Τί οὖν
  choice: तो फिर ... क्या
  rationale: ‘तो फिर’ यूहन्ना की पिछली बात से निकले व्यावहारिक निष्कर्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ποιήσωμεν
  choice: हम क्या करें
  rationale: विचारार्थक एओरिस्ट सब्जंक्टिव को हिन्दी में ‘हम क्या करें?’ स्वाभाविक और सटीक ढंग से व्यक्त करता है।
theological_decisions: []
