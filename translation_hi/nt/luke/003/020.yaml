  choice: जोड़ दिया
  rationale: यहाँ क्रिया का भाव पिछले कामों में एक और काम जोड़ने का है; ‘जोड़ दिया’ संचयी अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: τοῦτο
  choice: यह भी
  rationale: संकेतवाचक शब्द आगामी काम की ओर इशारा करता है, और ‘भी’ उसके अतिरिक्त होने का भाव व्यक्त करता है।
- source_word: ἐπὶ πᾶσιν
  choice: अपने सभी बुरे कामों में
  rationale: निकटवर्ती सन्दर्भ में हेरोदेस के बुरे कामों की चर्चा है। हिन्दी में यह रूप निहित सम्बन्ध को स्पष्ट करते हुए वाक्य का संचयी अर्थ स्वाभाविक ढंग से देता है।
- source_word: κατέκλεισεν
  choice: बन्द कर दिया
  rationale: मूल क्रिया किसी को भीतर बन्द कर देने या कैद करने का ठोस भाव रखती है; इसके बाद आने वाले ‘बन्दीगृह में’ के साथ यह अर्थ सुरक्षित रहता है।
- source_word: Ἰωάννην
  choice: यूहन्ना
  rationale: यह नाम हिन्दी बाइबल परम्परा में प्रचलित मानक रूप में दिया गया है।
- source_word: ἐν φυλακῇ
  choice: बन्दीगृह में
  rationale: यह पद यहाँ कैद रखने के स्थान को सूचित करता है; ‘बन्दीगृह’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: ἐπὶ πᾶσιν का सम्बन्ध और अर्थ
  choice: हेरोदेस ने यूहन्ना को बन्दीगृह में डालने का यह काम अपने पिछले सभी बुरे कामों में और जोड़ दिया।
  alternative: 'अधिक शाब्दिक रूप: ‘उसने इन सबके ऊपर यह भी जोड़ दिया।’'
  rationale: पद 19–20 का निकटवर्ती सन्दर्भ हेरोदेस के बुरे कामों को गिनाता है। चुना गया रूप संचयी अर्थ स्पष्ट करता है, पर कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
