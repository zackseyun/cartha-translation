  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘बन्दीगृह में बन्द’ की हल्की पुनरुक्ति मूल के ठोस ‘भीतर बन्द किया’ और स्थानवाचक पद, दोनों को सुरक्षित रखती है।
