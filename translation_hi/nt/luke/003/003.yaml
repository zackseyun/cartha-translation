source:
  edition: SBLGNT
  text: καὶ ἦλθεν εἰς ⸀πᾶσαν περίχωρον τοῦ Ἰορδάνου κηρύσσων βάπτισμα μετανοίας εἰς ἄφεσιν ἁμαρτιῶν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/003.yaml
  text: And he came into all the surrounding region of the Jordan[a], proclaiming a baptism of repentance for the forgiveness of sins[b],
translation:
  language: hi
  text: और वह यरदन के आस-पास के सारे क्षेत्र में पहुँचा[a] और पापों की क्षमा के लिए मन फिराव के बपतिस्मे का प्रचार करता रहा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के आस-पास के पूरे प्रदेश में।”
    reason: περίχωρος के लिए ‘क्षेत्र’ के स्थान पर ‘प्रदेश’ भी कहा जा सकता है; πᾶσαν की समग्रता बनी रहती है।
  - marker: b
    text: या, “सार्वजनिक रूप से घोषणा करता रहा।”
    reason: κηρύσσων में प्रचार के साथ सार्वजनिक उद्घोषणा का भाव है।
lexical_decisions:
- source_word: ἦλθεν
  choice: गया
  rationale: हिन्दी कथन में यूहन्ना की गतिविधि को आगे बढ़ाते हुए ‘गया’ स्वाभाविक है; यूनानी ἔρχομαι प्रसंगानुसार ‘आया’ या ‘गया’ हो सकता है।
- source_word: εἰς πᾶσαν περίχωρον τοῦ Ἰορδάνου
  choice: यरदन के आस-पास के सारे क्षेत्र में
  rationale: यह περίχωρος के ‘आस-पास का क्षेत्र’ और πᾶσαν के समग्रता-बोध को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है; εἰς यहाँ क्षेत्र में प्रवेश और वहाँ भ्रमण का संकेत देता है।
- source_word: κηρύσσων
  choice: प्रचार करने लगा
  rationale: κηρύσσω सार्वजनिक रूप से घोषणा करने को दर्शाता है। ‘प्रचार करना’ सामान्य हिन्दी में सुबोध है, जबकि वैकल्पिक ‘घोषणा करना’ उसके उद्घोषणात्मक बल को अधिक सीधे व्यक्त करता है।
- source_word: βάπτισμα
  choice: बपतिस्मा
  rationale: यह βάπτισμα के लिए प्रचलित और व्यापक रूप से पहचाना जाने वाला हिन्दी बाइबलीय शब्द है।
- source_word: μετανοίας
  choice: मन फिराव का
  rationale: μετάνοια सोच, मनोवृत्ति और जीवन-दिशा के परिवर्तन को सूचित करता है। ‘मन फिराव’ इस बाइबलीय अर्थ को संक्षेप में रखता है; केवल ‘पश्चाताप’ कहने पर दुःख की भावना प्रमुख हो सकती है।
- source_word: εἰς ἄφεσιν ἁμαρτιῶν
  choice: पापों की क्षमा के लिए
  rationale: ἄφεσις का प्रसंगगत अर्थ ‘क्षमा’ है और εἰς को ‘के लिए’ कहना लक्ष्य/परिणाम का संबंध बनाए रखता है, बिना उस संबंध की धर्मवैज्ञानिक रीति निश्चित किए।
theological_decisions:
- issue: बपतिस्मे, मन फिराव और पापों की क्षमा का परस्पर संबंध
  choice: ‘पापों की क्षमा के लिए मन फिराव के बपतिस्मे’ के रूप में पारदर्शी अनुवाद
  alternative: ‘ऐसा बपतिस्मा जो क्षमा की ओर ले जाने वाले मन फिराव को प्रकट करे’
  rationale: यूनानी वाक्यांश संबंध को बताता है, पर यह स्पष्ट नहीं करता कि बपतिस्मा क्षमा का साधन, चिह्न, सार्वजनिक अभिव्यक्ति या घोषणा है। इसलिए अनुवाद उस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘मन फिराव’ अर्थगत परिवर्तन को उभारता है; ‘बपतिस्मा’ परिचित बाइबलीय पद के रूप में रखा गया है।
