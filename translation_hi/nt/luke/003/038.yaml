lexical_decisions:
- source_word: τοῦ Ἐνὼς
  choice: एनोश का पुत्र
  rationale: वंशावली में संबंधसूचक संज्ञा लुप्त है; प्रसंग से ‘पुत्र’ समझा जाता है। Ἐνώς को उसके इब्रानी नाम के प्रचलित हिन्दी रूप ‘एनोश’ में रखा गया है।
- source_word: τοῦ Σὴθ
  choice: शेत का पुत्र
  rationale: संबंधकारक की वही वंशावली-संरचना यहाँ भी पुत्र-संबंध बताती है। Σήθ के लिए प्रचलित हिन्दी नाम ‘शेत’ चुना गया है।
- source_word: τοῦ Ἀδὰμ
  choice: आदम का पुत्र
  rationale: Ἀδάμ यहाँ व्यक्ति का नाम है, इसलिए इसका अनुवाद ‘मनुष्य’ न करके प्रचलित नाम ‘आदम’ रखा गया है; निहित पुत्र-संबंध स्पष्ट किया गया है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर का पुत्र
  rationale: अंतिम संबंधकारक भी उसी दोहराई गई वंशावली-संरचना में है। ‘परमेश्वर’ θεός के दिव्य संदर्भ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आदम की वंशावली में अंतिम पद τοῦ θεοῦ का अनुवाद
  choice: परमेश्वर का पुत्र
  alternative: परमेश्वर का / परमेश्वर से
  rationale: यूनानी में केवल संबंधकारक पद है, किंतु पूरी वंशावली की संरचना में ‘पुत्र’ निहित है। यह रूप साहित्यिक क्रम और आदम की परमेश्वर से सीधी उत्पत्ति के भाव को बनाए रखता है, पर आदम के पुत्रत्व को किसी बाद की विशिष्ट मसीह-विषयक धारणा से परिभाषित नहीं करता।
