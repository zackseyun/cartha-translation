id: LUK.3.17
reference: Luke 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὗ τὸ πτύον ἐν τῇ χειρὶ αὐτοῦ ⸀διακαθᾶραι τὴν ἅλωνα αὐτοῦ καὶ ⸀συναγαγεῖν τὸν σῖτον εἰς τὴν ἀποθήκην αὐτοῦ, τὸ δὲ ἄχυρον κατακαύσει πυρὶ ἀσβέστῳ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/017.yaml
  text: His winnowing fork is in his hand to thoroughly clear his threshing floor and to gather the wheat into his storehouse[c][b][a], but the chaff he will burn up with unquenchable fire.
translation:
  language: hi
  text: उसका सूप[a] उसके हाथ में है, ताकि वह अपने खलिहान को पूरी तरह साफ करे और गेहूँ को अपने भंडार[b] में इकट्ठा करे; पर भूसी को वह ऐसी आग में पूरी तरह जला देगा जो बुझाई नहीं जा सकती[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सूप’ उस उपकरण को कहते हैं जिससे अनाज को हवा में उछालकर दाने और भूसी अलग किए जाते थे। इसे ‘ओसाने का फावड़ा’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कोठार’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘न बुझने वाली आग में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: πτύον
  choice: सूप
  rationale: यह अनाज को हवा में उछालकर दाने और भूसी अलग करने के उपकरण का प्रचलित हिन्दी नाम है; आधुनिक पाठक की सहायता के लिए पादटिप्पणी दी गई है।
- source_word: διακαθᾶραι
  choice: पूरी तरह साफ करे
  rationale: क्रिया में निहित गहन और संपूर्ण सफाई का भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: ἅλωνα
  choice: खलिहान
  rationale: अनाज की मड़ाई और ओसाई के स्थान के लिए मानक और सहज हिन्दी शब्द है।
- source_word: συναγαγεῖν
  choice: इकट्ठा करे
  rationale: अलग किए गए उपयोगी अनाज को एक स्थान में जमा करने की क्रिया को स्पष्ट रूप से व्यक्त करता है।
- source_word: σῖτον
  choice: गेहूँ
  rationale: यद्यपि शब्द सामान्यतः अनाज का अर्थ दे सकता है, भूसी के साथ यह विरोध और पारंपरिक कृषि-बिंब यहाँ गेहूँ को स्वाभाविक बनाते हैं।
- source_word: ἀποθήκην
  choice: भंडार
  rationale: भंडारण-स्थान का व्यापक और सटीक अर्थ देता है, बिना भवन के स्वरूप को अनावश्यक रूप से निश्चित किए।
- source_word: ἄχυρον
  choice: भूसी
  rationale: ओसाई के प्रसंग में दाने से अलग होने वाले अनुपयोगी हल्के अंश को दर्शाता है; ‘पुआल’ यहाँ कम सटीक होगा।
- source_word: κατακαύσει
  choice: जला देगा
  rationale: हिन्दी में परिणामकारी रूप से पूर्ण जलाए जाने का भाव संदर्भ से स्पष्ट है; वाक्य को अनावश्यक रूप से भारी नहीं बनाया गया।
- source_word: πυρὶ ἀσβέστῳ
  choice: ऐसी आग में ... जो बुझाई नहीं जा सकती
  rationale: आग के न बुझ सकने का मूल भाव स्पष्ट, स्वाभाविक हिन्दी में रखता है और न्याय की तीव्रता को कम नहीं करता।
- source_word: οὗ
  choice: उसका
  rationale: संबंधवाचक सर्वनाम को पिछले पद में वर्णित आनेवाले व्यक्ति की ओर संकेत करने वाले सहज हिन्दी अधिकारवाचक रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: कृषि-रूपक में न्याय और अलगाव
  choice: गेहूँ के एकत्र किए जाने और भूसी के न बुझ सकने वाली आग में जलाए जाने—दोनों बिंबों को उनके पूरे बल के साथ रखा गया है।
  alternative: इसे केवल इस्राएल पर ऐतिहासिक न्याय मानना, या इस एक पद में अंतिम दंड का पूर्ण व्यवस्थित सिद्धांत स्पष्ट करना।
  rationale: पद निर्णायक अलगाव, संरक्षण और न्याय को व्यक्त करता है, पर न्याय के समय, स्वरूप या व्यापक धर्मसैद्धांतिक विवरण को स्वयं निश्चित नहीं करता; इसलिए अनुवाद उससे आगे नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। कृषि-संबंधी पारंपरिक शब्द ‘सूप’ और ‘खलिहान’ संदर्भ की ठोस छवि बनाए रखते हैं; कम परिचित ‘सूप’ को पादटिप्पणी में समझाया गया है।
