  verdict: revise
  source_fidelity: The draft accurately preserves the axe-and-tree metaphor, the inference marked by οὖν, the good-fruit criterion, and the present passive judgment imagery. However, ‘अभी से’ normally means ‘from now on’ in Hindi and does not best represent ἤδη (‘already/now’). ‘अब तो’ more naturally conveys the urgent, already-present situation without adding a durative sense.
  naturalness: The phrasing is otherwise clear, modern, and appropriately grave. ‘अब तो कुल्हाड़ी…’ is idiomatic Hindi and gives the warning its intended immediacy.
  terminology: ‘कुल्हाड़ी,’ ‘जड़,’ ‘अच्छा फल,’ ‘काट डाला जाता,’ and ‘आग में फेंक दिया जाता है’ are suitable, natural renderings. The text retains the judgment metaphor without specifying what the fire denotes.
  issues:
  - severity: medium
    issue: ‘अभी से’ for ἤδη δὲ καὶ
    rationale: In modern Hindi, ‘अभी से’ commonly indicates a point from which something begins (‘from now on’). The Greek describes the axe as already in position. ‘अब तो’ conveys the present urgency and rhetorical force more naturally.
