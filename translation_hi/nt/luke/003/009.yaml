id: LUK.3.9
reference: Luke 3:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἤδη δὲ καὶ ἡ ἀξίνη πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται· πᾶν οὖν δένδρον μὴ ποιοῦν καρπὸν καλὸν ἐκκόπτεται καὶ εἰς πῦρ βάλλεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/009.yaml
  text: And already the ax is laid at the root of the trees[c][b][a]. Therefore every tree not producing good fruit is cut down and thrown into the fire.
translation:
  language: hi
  text: अब तो कुल्हाड़ी पेड़ों की जड़ पर रखी हुई है। इसलिए हर वह पेड़ जो अच्छा फल नहीं लाता, काट डाला जाता और आग में फेंक दिया जाता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤδη δὲ καὶ
  choice: अभी से
  rationale: ἤδη की तात्कालिकता और आसन्न न्याय की चेतावनी को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; δὲ καὶ का प्रवाह अलग, बोझिल संयोजक जोड़े बिना वाक्य-संबंध में बना रहता है।
- source_word: ἡ ἀξίνη
  choice: कुल्हाड़ी
  rationale: पेड़ काटने के औज़ार और न्याय के रूपक, दोनों के लिए सामान्य और स्पष्ट हिन्दी शब्द।
- source_word: πρὸς τὴν ῥίζαν τῶν δένδρων κεῖται
  choice: पेड़ों की जड़ पर रखी हुई है
  rationale: πρός की स्थान-सन्निकटता तथा κεῖται की स्थित अवस्था को सुरक्षित रखता है और काटे जाने की तैयारी का चित्र स्वाभाविक हिन्दी में देता है।
- source_word: πᾶν οὖν δένδρον
  choice: इसलिए हर वह पेड़
  rationale: οὖν के निष्कर्षसूचक बल को ‘इसलिए’ से और πᾶν की व्यापकता को ‘हर’ से स्पष्ट किया गया है।
- source_word: μὴ ποιοῦν καρπὸν καλὸν
  choice: जो अच्छा फल नहीं लाता
  rationale: फल के साथ ποιέω का स्वाभाविक हिन्दी प्रयोग ‘फल लाना’ है; यह नैतिक-आध्यात्मिक रूपक को बिना व्याख्या जोड़े बनाए रखता है।
- source_word: ἐκκόπτεται
  choice: काट डाला जाता
  rationale: पेड़ के संदर्भ में पूर्णतः काट गिराने की कठोरता को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: εἰς πῦρ βάλλεται
  choice: आग में फेंक दिया जाता है
  rationale: लक्ष्यसूचक εἰς और वर्तमान कर्मवाच्य βάλλεται को स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: न्याय का रूपक
  choice: कुल्हाड़ी, निष्फल पेड़ और आग के कृषि-रूपक को यथावत रखा गया है; आग का आशय पाठ से अधिक संकीर्ण नहीं किया गया।
  alternative: ‘आग’ को स्पष्ट रूप से नरक कहना, या पूरे चित्र को केवल इस्राएल के ऐतिहासिक न्याय तक सीमित करना।
  rationale: पद आसन्न और कठोर न्याय की चेतावनी देता है, पर आग के पूर्ण संदर्भ को स्वयं परिभाषित नहीं करता; इसलिए वास्तविक धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
- issue: वर्तमानकालीन कर्मवाच्य का बल
  choice: ‘काट डाला जाता और आग में फेंक दिया जाता है’
  alternative: भविष्यकाल ‘काटा जाएगा और फेंका जाएगा’।
  rationale: यूनानी वर्तमान कर्मवाच्य रूपों को बनाए रखते हुए यह कथन को सामान्य और निश्चित न्याय-विधान के रूप में प्रस्तुत करता है, बिना समय-संबंध को भविष्यकाल में बदलने के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण है। ‘अभी से’ आसन्नता को उभारता है; ‘जड़ पर रखी हुई’ मूल चित्र को बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि प्रमुख विकल्प मुख्य पाठ में स्वाभाविक रूप से व्यक्त हो जाते हैं।
