  choice: SBLGNT के अनुसार कैनान को मुख्य पाठ में रखा गया है।
  alternative: कुछ पाठ-परंपराएँ पुराने नियम की कुछ वंशावलियों से अधिक निकट सामंजस्य बैठाने के लिए यहाँ कैनान को छोड़ देती हैं।
  rationale: दिए गए यूनानी पाठ में Καϊνάμ स्पष्ट रूप से उपस्थित है। इसलिए लूका के पाठ का अनुवाद किया गया है, उत्पत्ति की अन्य वंशावली के अनुरूप बनाने के लिए उसमें परिवर्तन नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। यह पद पिछले और अगले पदों से जुड़ी वंशावली का खंड है, इसलिए मूल की संबंधकारक शृंखला को ‘का’ से बनाए रखा गया है। सभी पाठ-टिप्पणी चिह्न संबंधित नामों के पास रखे गए हैं।
