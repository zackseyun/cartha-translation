lexical_decisions:
- source_word: τοῦ
  choice: का
  rationale: इस वंशावली में बार-बार आया संबंधकारक पद पिछले पदों से स्थापित वंश-संबंध को आगे बढ़ाता है। हिन्दी में प्रत्येक नाम के बाद ‘का’ उस शृंखला को संक्षिप्त और स्वाभाविक रूप से बनाए रखता है; ‘पुत्र’ जोड़ने से मूल में निहित संबंध अनावश्यक रूप से अधिक निश्चित हो जाता।
- source_word: Καϊνὰμ
  choice: कैनान
  rationale: यूनानी नाम Καϊνάμ का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; ‘काइनाम’ अधिक अक्षरानुगामी विकल्प हो सकता है।
- source_word: Ἀρφαξὰδ
  choice: अरफक्सद
  rationale: लूका के यूनानी रूप Ἀρφαξάδ को दर्शाने वाला हिन्दी लिप्यंतरण; इब्रानी पुराने नियम का रूप प्रायः ‘अर्पक्षद’ लिखा जाता है।
- source_word: Σὴμ
  choice: शेम
  rationale: यूनानी Σήμ के पीछे स्थित परिचित बाइबलीय नाम का मानक हिन्दी रूप।
- source_word: Νῶε
  choice: नूह
  rationale: यूनानी Νῶε के लिए हिन्दी में स्थापित बाइबलीय नाम, जो सीधे ध्वन्यात्मक ‘नोए’ की अपेक्षा अधिक पहचाना जाता है।
- source_word: Λάμεχ
  choice: लामेक
  rationale: यूनानी Λάμεχ का स्वाभाविक हिन्दी लिप्यंतरण और प्रचलित बाइबलीय रूप।
