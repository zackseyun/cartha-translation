source:
  edition: SBLGNT
  text: ὁ δὲ εἶπεν πρὸς αὐτούς· Μηδὲν πλέον παρὰ τὸ διατεταγμένον ὑμῖν πράσσετε.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/013.yaml
  text: And he said to them[a], “Collect no more than what has been ordered for you.”
translation:
  language: hi
  text: उसने उनसे कहा, “तुम्हारे लिए जो निर्धारित किया गया है, उससे अधिक कर मत वसूलो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δὲ
  choice: उसने
  rationale: δέ यहाँ हल्का कथात्मक संयोजक है; हिन्दी में अलग से ‘और’ या ‘तब’ जोड़ना आवश्यक नहीं, क्योंकि प्रवाह स्वाभाविक बना रहता है।
- source_word: εἶπεν πρὸς αὐτούς
  choice: उनसे कहा
  rationale: λέγω + πρός का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: Μηδὲν πλέον
  choice: अधिक ... मत
  rationale: यह संयोजन निर्धारित सीमा से आगे बढ़ने का निषेध व्यक्त करता है।
- source_word: παρὰ τὸ διατεταγμένον ὑμῖν
  choice: तुम्हारे लिए जो निर्धारित किया गया है, उससे
  rationale: διατεταγμένον का पूर्ण निष्क्रिय भाव और आधिकारिक रूप से तय की गई सीमा—दोनों ‘निर्धारित किया गया है’ में सुरक्षित रहते हैं।
- source_word: πράσσετε
  choice: कर वसूलो
  rationale: πράσσω सामान्यतः ‘करना’ हो सकता है, पर तत्काल संदर्भ में संबोधित लोग कर-वसूलने वाले हैं; इसलिए यहाँ उनके कर-वसूली के कार्य को स्पष्ट करना स्वाभाविक और स्रोत-संगत है।
theological_decisions:
- issue: πράσσετε में निहित कार्य को संदर्भानुसार स्पष्ट करना
  choice: ‘कर मत वसूलो’ कहकर कर-वसूली की गतिविधि स्पष्ट की गई।
  alternative: ‘उससे अधिक कुछ मत करो।’
  rationale: पद 12 के तत्काल संदर्भ में श्रोता कर-वसूलने वाले हैं। स्पष्ट रूप किसी सिद्धान्तगत अर्थ को नहीं जोड़ता, बल्कि प्रसंग में निहित कर्म को आधुनिक हिन्दी में स्वाभाविक बनाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रत्यक्ष कथन। ‘निर्धारित’ आधिकारिक सीमा का भाव देता है, जबकि ‘कर वसूलो’ सामान्य पाठक के लिए प्रसंग स्पष्ट रखता है।
