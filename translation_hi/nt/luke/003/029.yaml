translation:
  language: hi
  text: येशू का पुत्र, एलीएज़र का पुत्र, योरीम का पुत्र, मत्तात का पुत्र, लेवी का पुत्र,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰησοῦ
  choice: येशू
  rationale: यूनानी नाम Ἰησοῦ का यहाँ वंशावली में स्वाभाविक हिंदी लिप्यंतरण; इसे इसी नाम वाले अधिक प्रसिद्ध व्यक्ति से अलग दिखाने के लिए कृत्रिम रूप से नहीं बदला गया।
- source_word: Ἐλιέζερ
  choice: एलीएज़र
  rationale: यूनानी उच्चारण और प्रचलित बाइबलीय नाम-रूप के निकट लिप्यंतरण।
- source_word: Ἰωρὶμ
  choice: योरीम
  rationale: यूनानी Ἰωρίμ का सीधा और हिंदी में उच्चारणयोग्य लिप्यंतरण।
- source_word: Μαθθὰτ
  choice: मत्तात
  rationale: दोहरे θθ को हिंदी के स्वाभाविक बाइबलीय लिप्यंतरण में ‘त्त’ से दर्शाया गया है।
- source_word: Λευὶ
  choice: लेवी
  rationale: इस बाइबलीय नाम का मानक और परिचित हिंदी रूप।
- source_word: τοῦ
  choice: का पुत्र
  rationale: वंशावली में बार-बार आने वाला संबंधकारक लेख पूर्वपद के साथ पितृवंशीय संबंध व्यक्त करता है; हिंदी में स्पष्टता के लिए ‘का पुत्र’ दोहराया गया।
