source:
  edition: SBLGNT
  text: Προσδοκῶντος δὲ τοῦ λαοῦ καὶ διαλογιζομένων πάντων ἐν ταῖς καρδίαις αὐτῶν περὶ τοῦ Ἰωάννου, μήποτε αὐτὸς εἴη ὁ χριστός,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/015.yaml
  text: As the people were waiting expectantly[a], and all were reasoning in their hearts about John, whether perhaps he might be the Messiah,
translation:
  language: hi
  text: जब लोग बड़ी आशा से प्रतीक्षा कर रहे थे और सब अपने मन में यूहन्ना के विषय में सोच-विचार कर रहे थे कि कहीं वही मसीह[a] तो नहीं है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “अभिषिक्त जन।” यूनानी: हो ख्रिस्तोस।'
    reason: उपाधि के मूल अर्थ और वैकल्पिक प्रस्तुति को स्पष्ट करना।
lexical_decisions:
- source_word: Προσδοκῶντος
  choice: बड़ी आशा से प्रतीक्षा कर रहे थे
  rationale: यह चल रही उत्सुक और आशापूर्ण प्रतीक्षा को व्यक्त करता है, केवल समय बीतने की प्रतीक्षा को नहीं।
- source_word: δὲ
  choice: जब
  rationale: δέ एक हल्का कथात्मक जोड़ है; हिन्दी में संबंधवाचक दृश्य-स्थापना के साथ इसे अलग संयोजक से व्यक्त करना आवश्यक नहीं, और ‘जब’ दोनों संबंधवाचक कृदंतों की पृष्ठभूमि स्वाभाविक रूप से स्थापित करता है।
- source_word: τοῦ λαοῦ
  choice: लोग
  rationale: यहाँ सामूहिक जनसमुदाय अभिप्रेत है; आधुनिक हिन्दी में ‘लोग’ सीधा और स्वाभाविक है।
- source_word: διαλογιζομένων πάντων
  choice: सब ... सोच-विचार कर रहे थे
  rationale: क्रिया आंतरिक विचार-विमर्श को दर्शाती है; ‘सोच-विचार’ उसके मननशील अर्थ को बनाए रखता है।
- source_word: ἐν ταῖς καρδίαις αὐτῶν
  choice: अपने मन में
  rationale: यूनानी ‘हृदयों में’ आंतरिक विचार का मुहावरा है; हिन्दी में ‘अपने मन में’ उसी अर्थ को सहज रूप से व्यक्त करता है।
- source_word: περὶ τοῦ Ἰωάννου
  choice: यूहन्ना के विषय में
  rationale: περί के संबंधसूचक अर्थ का स्पष्ट और गरिमापूर्ण हिन्दी रूप।
- source_word: μήποτε ... εἴη
  choice: कि कहीं ... तो नहीं है
  rationale: यह हिन्दी संरचना परोक्ष प्रश्न में संभावना और संदेह दोनों को बनाए रखती है, जो μήποτε और संभावनासूचक optative से व्यक्त हैं।
- source_word: ὁ χριστός
  choice: मसीह
  rationale: यहाँ शब्द अपेक्षित अभिषिक्त जन की उपाधि है; ‘मसीह’ हिन्दी बाइबलीय प्रयोग में स्थापित और संदर्भानुकूल है।
theological_decisions:
- issue: Χριστός को उपाधि के रूप में प्रस्तुत करना
  choice: मसीह
  alternative: ख्रीस्त / अभिषिक्त जन
  rationale: यहाँ लोग यूहन्ना की पहचान के विषय में अपेक्षित मसीही उपाधि पर विचार कर रहे हैं। ‘मसीह’ इस यहूदी अपेक्षा को दर्शाता है और इसे व्यक्ति-नाम की तरह नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘अपने मन में सोच-विचार’ आंतरिक मनन को स्वाभाविक हिन्दी में रखता है, और ‘कहीं वही ... तो नहीं’ मूल की अनिश्चितता को सुरक्षित रखता है।
