  rationale: ऐतिहासिक पदवी की विशिष्टता बचाने और सामान्य पाठक के लिए अर्थ स्पष्ट करने हेतु अर्थानुवाद किया गया है।
- source_word: τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας
  choice: इतूरिया और त्रखोनीतिस प्रदेश
  rationale: χώρα का प्रादेशिक भाव ‘प्रदेश’ से व्यक्त किया गया है और दोनों भौगोलिक नाम सुरक्षित रखे गए हैं।
- source_word: Φιλίππου ... τοῦ ἀδελφοῦ αὐτοῦ
  choice: उसका भाई फिलिप्पुस
  rationale: αὐτοῦ का स्वाभाविक संदर्भ हेरोदेस है; हिन्दी में संबंध को संक्षिप्त और स्पष्ट रखा गया है।
theological_decisions:
- issue: τετρααρχοῦντος की ऐतिहासिक पदवी
  choice: चौथाई शासक
  alternative: चतुरांशपति / अधीनस्थ शासक / शासक
  rationale: मूल पदवी का विशिष्ट अर्थ सामान्य ‘शासक’ में समतल नहीं किया गया। ‘चौथाई शासक’ आधुनिक पाठक को पद के शाब्दिक-ऐतिहासिक स्वरूप के निकट रखता है; पादटिप्पणी रोमी अधीनता स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सुबोध ऐतिहासिक वर्णन। व्यक्तिनाम और स्थाननाम प्रचलित हिन्दी बाइबलीय लिप्यंतरण के निकट रखे गए हैं। पद मूल वाक्य की तरह अगले पद में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
