  text: Ἐν ἔτει δὲ πεντεκαιδεκάτῳ τῆς ἡγεμονίας Τιβερίου Καίσαρος, ἡγεμονεύοντος Ποντίου Πιλάτου τῆς Ἰουδαίας, καὶ τετρααρχοῦντος τῆς Γαλιλαίας Ἡρῴδου, Φιλίππου δὲ τοῦ ἀδελφοῦ αὐτοῦ τετρααρχοῦντος τῆς Ἰτουραίας καὶ Τραχωνίτιδος χώρας, καὶ Λυσανίου τῆς Ἀβιληνῆς τετρααρχοῦντος,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/001.yaml
  text: In the fifteenth year of the reign of Tiberius Caesar[a], while Pontius Pilate was governing Judea, and Herod was tetrarch of Galilee, and Philip his brother was tetrarch of the region of Iturea and Trachonitis, and Lysanias was tetrarch of Abilene[b],
translation:
  language: hi
  text: तिबेरियुस कैसर के शासन के पंद्रहवें वर्ष में[a], जब पोंतियुस पिलातुस यहूदिया पर शासन कर रहा था, हेरोदेस गलील का तेत्रार्ख था, उसका भाई फिलिप्पुस इतूरिया और त्रखोनीतिस प्रदेश का तेत्रार्ख था, और लुसानियास अबिलेने का तेत्रार्ख था[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शासन के पंद्रहवें वर्ष के दौरान।”
    reason: कालसूचक यूनानी संरचना के वैकल्पिक स्वाभाविक अनुवाद को दर्शाने के लिए।
  - marker: b
    text: “तेत्रार्ख” एक प्रादेशिक शासक की राजनीतिक पदवी थी; यहाँ यह रोमी सत्ता के अधीन पद को सूचित करती है।
    reason: प्राचीन राजनीतिक पदवी की सांस्कृतिक-ऐतिहासिक व्याख्या के लिए।
