  rationale: यह उत्पत्ति की वंशावली के इब्रानी פֶּלֶג से संबंधित है। ‘पेलेग’ दोनों नियमों के बीच नाम की पहचान सुरक्षित रखता है।
- source_word: Ἔβερ
  choice: एबेर
  rationale: यूनानी नाम उत्पत्ति 10–11 के इब्रानी עֵבֶר से मेल खाता है। ‘एबेर’ इस कुलपिता का स्पष्ट और परिचित हिन्दी रूप है।
- source_word: Σαλὰ
