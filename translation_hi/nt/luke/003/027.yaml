lexical_decisions:
- source_word: τοῦ
  choice: का पुत्र
  rationale: वंशावली के आसपास के स्पष्ट ढाँचे के आधार पर बार-बार आए संबंधकारक τοῦ में पुत्र-संबंध निहित है। हिंदी में केवल ‘का’ की शृंखला अस्वाभाविक होगी, इसलिए ‘का पुत्र’ देना आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: Ἰωανὰν
  choice: योआनान
  rationale: यूनानी नाम का देवनागरी लिप्यंतरण; यह इसे ‘यूहन्ना’ जैसे अन्य प्रचलित नाम-रूपों से अलग भी रखता है।
- source_word: Ῥησὰ
  choice: रेसा
  rationale: यूनानी Ῥησά का सरल और स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: Ζοροβαβὲλ
  choice: जरुब्बाबेल
  rationale: पुराने नियम के इसी परिचित व्यक्ति के लिए हिंदी बाइबलीय परंपरा में पहचाने जाने योग्य नाम-रूप अपनाया गया है, न कि यूनानी रूप का कठोर प्रत्यक्ष लिप्यंतरण।
- source_word: Σαλαθιὴλ
  choice: शालतीएल
  rationale: यूनानी सलाथीएल के पीछे स्थित पुराने नियम के नाम से पहचान बनाए रखने वाला प्रचलित हिंदी रूप।
- source_word: Νηρὶ
  choice: नेरी
  rationale: यूनानी Νηρί का सीधा, पठनीय देवनागरी लिप्यंतरण।
theological_decisions:
- issue: वंशावली में लुप्त पद की पूर्ति
  choice: हर नाम के साथ ‘का पुत्र’ दिया गया है।
  alternative: केवल संबंधकारक ‘का’ के साथ नामों की शृंखला देना।
  rationale: यूनानी में प्रत्येक नाम से पहले केवल संबंधकारक लेख दोहराया गया है, पर आसपास की वंशावली से पुत्र-संबंध स्पष्ट रूप से निहित है। हिंदी में उसकी पूर्ति अर्थ का विस्तार नहीं, बल्कि निहित वाक्य-संबंध का स्वाभाविक अनुवाद है।
- issue: Σαλαθιὴλ की नामगत पहचान
  choice: शालतीएल
  alternative: सलाथीएल
  rationale: मूल यूनानी रूप को टिप्पणी में सुरक्षित रखते हुए मुख्य पाठ में पुराने नियम से पहचाना जाने वाला नाम रखा गया है; इससे वंशावली का धर्मग्रंथीय संबंध दिखता है, बिना दोनों रूपों के संबंध को मूल पाठ से अधिक निश्चित बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों में जहाँ संभव है सीधा यूनानी लिप्यंतरण किया गया है; पुराने नियम से स्पष्ट रूप से जुड़े परिचित नामों के लिए पहचान योग्य हिंदी बाइबलीय रूप चुने गए हैं।
