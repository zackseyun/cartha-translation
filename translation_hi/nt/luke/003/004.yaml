source:
  edition: SBLGNT
  text: ὡς γέγραπται ἐν βίβλῳ λόγων Ἠσαΐου τοῦ ⸀προφήτου· Φωνὴ βοῶντος ἐν τῇ ἐρήμῳ· Ἑτοιμάσατε τὴν ὁδὸν κυρίου, εὐθείας ποιεῖτε τὰς τρίβους αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/004.yaml
  text: 'as it is written in the book of the words of Isaiah the prophet[a], “A voice of one crying in the wilderness: ‘Prepare the way of the Lord[b]; make his paths straight.’”'
translation:
  language: hi
  text: 'जैसा कि यशायाह भविष्यद्वक्ता के वचनों की पुस्तक में लिखा है: “निर्जन प्रदेश में[b] पुकारने वाले की आवाज़: ‘प्रभु[a] का मार्ग तैयार करो; उसके रास्ते सीधे बनाओ।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा।” यह उद्धरण यशायाह 40:3 की प्रतिध्वनि है, जहाँ इब्रानी पाठ में परमेश्वर का नाम YHWH है।
    reason: alternative_reading
  - marker: b
    text: '“निर्जन प्रदेश में” को यहाँ “पुकारने वाले” के साथ जोड़ा गया है। इसे अगली आज्ञा के साथ भी समझा जा सकता है: “पुकारने वाले की आवाज़: ‘निर्जन प्रदेश में प्रभु का मार्ग तैयार करो।’”'
    reason: alternative_reading
lexical_decisions:
- source_word: γέγραπται
  choice: लिखा है
  rationale: पवित्रशास्त्र के उद्धरण का परिचित सूत्र है; यूनानी पूर्णकाल के वर्तमान में बने परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: βίβλῳ λόγων
  choice: वचनों की पुस्तक
  rationale: दोनों संज्ञाओं को बनाए रखता है और आधुनिक हिन्दी में गरिमापूर्ण तथा बोधगम्य है; प्राचीन भौतिक रूप ‘पुस्तक’ के बजाय ‘ग्रंथ-पट’ कहना अनावश्यक रूप से तकनीकी होता।
- source_word: Ἠσαΐου τοῦ προφήτου
  choice: यशायाह भविष्यद्वक्ता
  rationale: यशायाह की पहचान बताने वाले यूनानी पदबंध का स्वाभाविक हिन्दी रूप।
- source_word: Φωνὴ βοῶντος
  choice: पुकारने वाले की आवाज़
  rationale: संबंधकारक कृदंत की व्यक्तिगत भावना और ऊँची पुकार का अर्थ सुरक्षित रखता है।
- source_word: ἐν τῇ ἐρήμῳ
  choice: निर्जन प्रदेश में
  rationale: ἔρημος का व्यापक अर्थ व्यक्त करता है; केवल रेतीले ‘रेगिस्तान’ तक सीमित नहीं करता और यूहन्ना के निर्जन स्थान वाले संदर्भ के अनुकूल है।
- source_word: Ἑτοιμάσατε
  choice: तैयार करो
  rationale: बहुवचन आज्ञार्थ को सीधा, स्वाभाविक और स्पष्ट रखता है।
- source_word: τὴν ὁδὸν κυρίου
  choice: प्रभु का मार्ग
  rationale: भविष्यद्वाणी के मार्ग-रूपक और κύριος की उपाधि दोनों को सुरक्षित रखता है।
- source_word: εὐθείας ποιεῖτε
  choice: सीधे बनाओ
  rationale: विशेषण और क्रिया के यूनानी निर्माण को सहज हिन्दी आज्ञा में व्यक्त करता है।
- source_word: τὰς τρίβους αὐτοῦ
  choice: उसके रास्ते
  rationale: ὁδός के ‘मार्ग’ के समानांतर τρίβοι के लिए सहज भिन्न शब्द देता है और बहुवचन बनाए रखता है।
theological_decisions:
- issue: यशायाह के उस उद्धरण में κύριος का अनुवाद जिसका इब्रानी मूल YHWH है
  choice: प्रभु
  alternative: यहोवा
  rationale: लूका के उपलब्ध यूनानी पाठ में κύριος है, इसलिए मुख्य पाठ उसी उपाधि का अनुवाद करता है। इब्रानी यशायाह 40:3 में दिव्य नाम की पृष्ठभूमि पाद-टिप्पणी में दी जाती है, जिससे मसीह-संबंधी संकेत को न तो दबाया जाता है, न अनुवाद में आवश्यकता से अधिक स्पष्ट किया जाता है।
- issue: ἐν τῇ ἐρήμῳ को किस पदांश से जोड़ना है
  choice: ‘पुकारने वाले’ के साथ
  alternative: 'अगली आज्ञा के साथ: ‘निर्जन प्रदेश में प्रभु का मार्ग तैयार करो’'
  rationale: लूका के यूनानी विराम-विन्यास और निकट पद-संबंध के अनुरूप मुख्य पाठ में इसे ‘पुकारने’ से जोड़ा गया है, पर उद्धरण के वाक्य-विन्यास में वास्तविक द्व्यर्थकता है, जिसे पाद-टिप्पणी सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण भविष्यद्वाणी-शैली। ‘निर्जन प्रदेश’ सामान्य पाठक के लिए स्पष्ट है और ἔρημος को केवल रेतीले मरुस्थल तक सीमित नहीं करता। दोनों पाद-टिप्पणी चिह्न संबंधित पदों के तुरंत बाद रखने के बजाय उद्धरण के अंत में दिए गए हैं; वे पूरे उद्धरण के भीतर क्रमशः ‘प्रभु’ और वाक्य-विन्यास पर लागू होते हैं।
