lexical_decisions:
- source_word: ὄψεται
  choice: देखेगा
  rationale: ὁράω का भविष्यकालीन रूप यहाँ सीधे भविष्य का भाव देता है। ‘देखेगा’ स्वाभाविक आधुनिक हिन्दी है और मूल के दृश्य-बिंब को बनाए रखता है।
- source_word: πᾶσα σὰρξ
  choice: हर एक प्राणी
  rationale: शाब्दिक रूप ‘सारा मांस’ हिन्दी में यहाँ अस्वाभाविक और भ्रामक होगा। यशायाह 40:5 की भविष्यद्वाणी की प्रतिध्वनि को ध्यान में रखते हुए ‘हर एक प्राणी’ व्यापक मानवीय आशय को व्यक्त करता है, जबकि पादटिप्पणी मूल मुहावरे को सुरक्षित रखती है।
- source_word: σωτήριον
  choice: उद्धार
  rationale: यह शब्द यहाँ संज्ञा के रूप में प्रयुक्त है। ‘उद्धार’ परमेश्वर के बचाने के कार्य की व्यापकता और यशायाह से संबंध को स्वाभाविक, स्थापित हिन्दी में बनाए रखता है।
- source_word: τοῦ θεοῦ
  choice: परमेश्वर के
  rationale: सम्बन्धकारक संरचना को औपचारिक रूप से रखा गया है। हिन्दी में यह परमेश्वर से संबंधित अथवा परमेश्वर द्वारा दिए गए उद्धार—दोनों की गुंजाइश बनाए रखता है।
theological_decisions:
- issue: πᾶσα σὰρξ का आशय
  choice: सभी मनुष्यों को समेटने वाला सार्वभौमिक मानवीय दायरा
  alternative: देहधारी प्राणियों पर केंद्रित अधिक शाब्दिक अर्थ
  rationale: यशायाह के उद्धरण और लूका के संदर्भ में यह सामी भविष्यद्वाणी-मुहावरा समस्त मानवजाति की ओर संकेत करता है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और पादटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
- issue: τοῦ θεοῦ में सम्बन्ध अथवा स्रोत
  choice: परमेश्वर के उद्धार
  alternative: परमेश्वर से मिलने वाले उद्धार
  rationale: यूनानी सम्बन्धकारक स्रोत, स्वामित्व या संबंध का भाव दे सकता है। मुख्य पाठ अधिक औपचारिक और खुला है; स्रोत का स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हर एक प्राणी’ भविष्यद्वाणी की व्यापकता को व्यक्त करता है; मूल ‘सारा मांस’ को पादटिप्पणी में रखा गया है ताकि उसका अंतरपाठीय और रूपकात्मक स्वर लुप्त न हो।
