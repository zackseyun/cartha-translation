translation:
  language: hi
  text: और सभी मनुष्य परमेश्वर के उद्धार को देखेंगे[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘सारा मांस’; यह यशायाह 40:5 की प्रतिध्वनि है और यहाँ सभी मनुष्यों की ओर संकेत करता है।
