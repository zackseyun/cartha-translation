base_translation:
  language: en
  yaml_path: translation/nt/luke/003/033.yaml
  text: the son of Amminadab[a], the son of Admin, the son of Arni, the son of Hezron, the son of Perez, the son of Judah,
translation:
  language: hi
  text: अम्मीनादाब का पुत्र[a], अदमीन का पुत्र, अरनी का पुत्र, हेस्रोन का पुत्र, पेरेस का पुत्र, यहूदा का पुत्र,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों में है, “अम्मीनादाब का पुत्र, अदमीन का पुत्र, अराम का पुत्र,” जबकि अन्य पांडुलिपियों में “अदमीन” नहीं है और उनमें है, “अम्मीनादाब का पुत्र, अराम का पुत्र।”
    reason: textual_variant
lexical_decisions:
- source_word: τοῦ
  choice: का पुत्र
  rationale: वंशावली में बार-बार आया संबंधकारक लेख पिछले पद से चली आ रही वंश-सूत्र की संक्षिप्त अभिव्यक्ति है। हिन्दी में केवल ‘का’ अस्वाभाविक होगा; ‘का पुत्र’ निहित संबंध को स्पष्ट और प्रवाहपूर्ण बनाता है।
- source_word: Ἀμιναδάβ
  choice: अम्मीनादाब
  rationale: मूल यूनानी नाम का पहचाना हुआ हिन्दी बाइबलीय रूप, जो इसके सामी नाम से भी मेल रखता है।
- source_word: Ἀδμίν
  choice: अदमीन
  rationale: SBLGNT के मुख्य पाठ में आए यूनानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: Ἀρνί
  choice: अरनी
  rationale: SBLGNT के मुख्य पाठ की वर्तनी का सीधा लिप्यंतरण; पाठांतर ‘अराम’ को पादटिप्पणी में रखा गया है।
- source_word: Ἑσρώμ
  choice: हेस्रोन
  rationale: पुराने नियम में पहचाने जाने वाले नाम के अनुरूप हिन्दी रूप, जिससे वंशावली की पहचान बनी रहती है।
- source_word: Φαρές
  choice: पेरेस
  rationale: पुराने नियम में प्रचलित और मूल सामी नाम के निकट हिन्दी रूप।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: वंशावली और पुराने नियम के पूर्वज के संदर्भ में स्थापित हिन्दी नाम; इसे ‘यहूदास’ जैसे नए नियम के नामों से अलग रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; वंशावली की आवृत्तिमूलक संरचना को ‘का पुत्र’ द्वारा स्पष्ट रखा गया है। व्यक्तिनामों में जहाँ संभव है, हिन्दी बाइबल में पहचाने जाने वाले पुराने नियम-संगत रूप अपनाए गए हैं।
