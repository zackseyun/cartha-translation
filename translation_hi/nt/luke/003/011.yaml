base_translation:
  language: en
  yaml_path: translation/nt/luke/003/011.yaml
  text: And answering[a], he said to them, “The one who has two tunics must share with the one who has none, and the one who has food must do likewise.”
translation:
  language: hi
  text: उसने उन्हें उत्तर दिया, “जिसके पास दो कुर्ते[a] हों, वह उसके साथ बाँटे जिसके पास एक भी न हो; और जिसके पास भोजन हो, वह भी ऐसा ही करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी χιτών शरीर के निकट पहना जाने वाला बुनियादी वस्त्र, अर्थात् ट्यूनिक, था।
    reason: cultural_note
lexical_decisions:
- source_word: ἀποκριθεὶς δὲ ἔλεγεν αὐτοῖς
  choice: उसने उन्हें उत्तर दिया
  rationale: कृदन्त और अपूर्णकालीन मुख्य क्रिया मिलकर यूहन्ना के प्रत्युत्तर को प्रस्तुत करते हैं। आधुनिक हिन्दी में यह संक्षिप्त रूप स्वाभाविक है; δέ यहाँ हल्का कथात्मक संयोजक है, जिसे अलग शब्द से व्यक्त करना आवश्यक नहीं।
- source_word: Ὁ ἔχων δύο χιτῶνας
  choice: जिसके पास दो कुरते हों
  rationale: यह सामान्य अर्थ वाला एकवचन कृदन्तीय वाक्यांश है। ‘जिसके पास’ हिन्दी में लिंग-समावेशी और स्वाभाविक है। χιτών शरीर के पास पहना जाने वाला मूल वस्त्र था; ‘कुरता’ उसके कार्य का निकट और सहज आधुनिक समतुल्य है, जबकि ऐतिहासिक भेद पादटिप्पणी में स्पष्ट किया गया है।
- source_word: μεταδότω
  choice: वह ... बाँटे
  rationale: तृतीय पुरुष आज्ञार्थक का निर्देशात्मक बल ‘वह ... बाँटे’ से स्वाभाविक और स्पष्ट रूप में व्यक्त होता है।
- source_word: τῷ μὴ ἔχοντι
  choice: उसके साथ ... जिसके पास एक भी न हो
  rationale: नकारात्मक कृदन्त में वस्तु संदर्भ से निहित है। ‘एक भी’ यह स्पष्ट करता है कि अभिप्राय उसी वस्त्र से है, बिना अर्थ बढ़ाए।
- source_word: βρώματα
  choice: भोजन
  rationale: बहुवचन βρώματα खाने की वस्तुओं के व्यापक अर्थ में है; हिन्दी में सामूहिक संज्ञा ‘भोजन’ स्पष्ट और स्वाभाविक है।
- source_word: ὁμοίως ποιείτω
  choice: वह भी ऐसा ही करे
  rationale: यह पहले निर्देश को भोजन रखने वाले व्यक्ति पर समान रूप से लागू करता है और आज्ञार्थक बल बनाए रखता है।
theological_decisions:
- issue: सामान्य एकवचन और लिंग-संबंधी अभिव्यक्ति
  choice: जिसके पास ... वह
  alternative: जिस मनुष्य के पास ... वह / जिसके पास भी ...
  rationale: यूनानी पुल्लिंग एकवचन कृदन्त यहाँ किसी भी व्यक्ति के लिए सामान्य रूप से प्रयुक्त हैं। ‘जिसके पास ... वह’ प्रतिनिधिक एकवचन को बनाए रखते हुए आधुनिक हिन्दी में अनावश्यक लैंगिक सीमांकन से बचता है।
- issue: साझा करने की आज्ञा का स्वरूप
  choice: उसके साथ बाँटे
  alternative: उसे एक दे दे
  rationale: μεταδίδω का मूल भाव किसी को अपने पास की वस्तु में सहभागी करना या हिस्सा देना है। ‘बाँटे’ उस व्यापक अर्थ को सुरक्षित रखता है; पाठ यह निर्धारित नहीं करता कि बाँटने की व्यावहारिक रीति केवल एक वस्त्र सौंपना ही हो।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘कुरता’ सामान्य पाठक के लिए बोधगम्य सांस्कृतिक समतुल्य है; पादटिप्पणी प्राचीन χιτών की प्रकृति स्पष्ट करती है। वाक्य का समानांतर आज्ञार्थक ढाँचा सुरक्षित रखा गया है।
