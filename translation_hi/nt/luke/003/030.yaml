lexical_decisions:
- source_word: τοῦ
  choice: का पुत्र
  rationale: लूका की वंशावली में संबंधकारक उपपद पहले से चल रहे वंशावली-सूत्र को संक्षिप्त रूप में आगे बढ़ाता है। हिन्दी में केवल ‘का’ अस्पष्ट और अस्वाभाविक होता; ‘का पुत्र’ निहित संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: Συμεὼν
  choice: शिमोन
  rationale: यह इस बाइबिलीय सामी नाम का हिन्दी में प्रचलित और सुबोध रूप है।
- source_word: Ἰούδα
  choice: यहूदा
  rationale: यूनानी रूप Ἰούδα यहूदा/यहूदा-नाम का संबंधकारक रूप है। इस वंशावली-संदर्भ में ‘यहूदा’ मूल यहूदी नाम को स्पष्ट रूप से दर्शाता है और ‘यहूदा इस्करियोती’ से अनावश्यक संबंध नहीं जोड़ता।
- source_word: Ἰωσὴφ
  choice: यूसुफ़
  rationale: यह नाम का आधुनिक हिन्दी में परिचित बाइबिलीय रूप है।
- source_word: Ἰωνὰμ
  choice: योनाम
  rationale: SBLGNT के पाठ Ἰωνάμ का निकट और स्वाभाविक देवनागरी लिप्यंतरण ‘योनाम’ है।
- source_word: Ἐλιακὶμ
  choice: एल्याकीम
  rationale: यह सामी नाम का हिन्दी में पठनीय लिप्यंतरण है और उसके यूनानी स्वरूप को पर्याप्त निकटता से दर्शाता है।
