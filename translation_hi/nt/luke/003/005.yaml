  text: πᾶσα φάραγξ πληρωθήσεται καὶ πᾶν ὄρος καὶ βουνὸς ταπεινωθήσεται, καὶ ἔσται τὰ σκολιὰ εἰς ⸀εὐθείαν καὶ αἱ τραχεῖαι εἰς ὁδοὺς λείας·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/005.yaml
  text: Every valley will be filled[a], and every mountain and hill will be made low, and the crooked places will become straight[b], and the rough ways smooth roads.
translation:
  language: hi
  text: हर घाटी भर दी जाएगी, और हर पहाड़ और हर पहाड़ी नीची कर दी जाएगी; जो टेढ़ा है वह सीधा हो जाएगा, और ऊबड़-खाबड़ रास्ते समतल सड़कें बन जाएँगे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘हर खड्ड भर दिया जाएगा।’
    reason: lexical_alternative
  - marker: b
    text: यह पंक्ति यशायाह 40:4 की प्रतिध्वनि है और प्रभु के मार्ग की तैयारी के लिए सड़क बनाने की छवि का प्रयोग करती है।
    reason: cross_reference
lexical_decisions:
- source_word: πᾶσα φάραγξ
  choice: हर एक घाटी
  rationale: φάραγξ घाटी, खड्ड या गहरी सँकरी घाटी को सूचित कर सकता है। सामान्य आधुनिक हिन्दी में ‘घाटी’ स्वाभाविक है और यशायाह से ली गई भू-दृश्य की छवि को बनाए रखता है; अधिक सँकरे अर्थ की संभावना पाद-टिप्पणी में दी गई है।
- source_word: πληρωθήσεται
  choice: भर दी जाएगी
  rationale: यह πληρόω का भविष्यत् कर्मवाच्य रूप है। भूभाग समतल करने की छवि में ‘भर दी जाएगी’ स्पष्ट और स्वाभाविक है।
- source_word: πᾶν ὄρος καὶ βουνός
  choice: हर एक पहाड़ और पहाड़ी
  rationale: दोनों निकटार्थी संज्ञाओं को अलग रखते हुए ὄρος के लिए ‘पहाड़’ और βουνός के लिए अपेक्षाकृत छोटी ऊँचाई दर्शाने वाला ‘पहाड़ी’ चुना गया है।
- source_word: ταπεινωθήσεται
  choice: नीची कर दी जाएगी
  rationale: इस स्थलाकृतिक संदर्भ में क्रिया ऊँचे भूभाग को नीचे किए जाने का बोध देती है। यह भौतिक छवि को सुरक्षित रखती है, जबकि ‘दीन किया जाएगा’ अनावश्यक रूप से नैतिक अर्थ जोड़ता।
- source_word: τὰ σκολιά
  choice: जो टेढ़ा है
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञावत् प्रयुक्त है। हिन्दी में यह सामूहिक एकवचन रचना स्वाभाविक है और ‘रास्ते’ शब्द को वहाँ नहीं जोड़ती जहाँ यूनानी पाठ उसे स्पष्ट रूप से नहीं देता।
- source_word: εἰς εὐθείαν
  choice: सीधा हो जाएगा
  rationale: εἰς के साथ यह परिणति या रूपांतरण व्यक्त करता है। ‘सीधा हो जाएगा’ आधुनिक हिन्दी में सहज है और मूल की अस्पष्ट संज्ञावत् अभिव्यक्ति को अति-विशिष्ट नहीं बनाता।
- source_word: αἱ τραχεῖαι
  choice: ऊबड़-खाबड़ रास्ते
  rationale: स्त्रीलिंग बहुवचन विशेषण संज्ञावत् है और अगले पद में आए ὁδούς से मार्गों का आशय स्पष्ट होता है। ‘ऊबड़-खाबड़’ सड़क-निर्माण की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: εἰς ὁδοὺς λείας
  choice: चिकनी सड़कें बन जाएँगे
  rationale: ὁδούς स्पष्ट रूप से सड़कों या मार्गों को और λείας चिकने अथवा समतल होने को दर्शाता है। ‘चिकनी सड़कें’ मूल की ठोस सड़क-सुधार छवि को बनाए रखता है।
theological_decisions:
- issue: लूका में उद्धृत यशायाह 40:4 की भविष्यसूचक भू-दृश्य और मार्ग-निर्माण छवि
  choice: ठोस घाटी, पहाड़ और सड़क की छवि को बनाए रखना
  alternative: इसे सीधे नैतिक या आध्यात्मिक अर्थ में रूपांतरित करना, जैसे ‘दीन लोग ऊँचे और घमंडी नीचे किए जाएँगे’
  rationale: पद का शब्दांकन ठोस भूभाग और प्रभु के मार्ग की तैयारी की छवि देता है। उसके संभावित धर्मवैचारिक निहितार्थों को अनुवाद में आरोपित करने के बजाय काव्यात्मक तनाव और मूल रूपक को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। भविष्यत् कर्मवाच्य संरचनाएँ मूल के व्याकरण और भविष्यसूचक लय को बनाए रखती हैं। ‘पहाड़ और पहाड़ी’ तथा ‘ऊबड़-खाबड़ रास्ते’ ठोस स्थलाकृतिक समानांतरता को सुरक्षित रखते हैं।
