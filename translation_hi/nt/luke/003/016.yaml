  text: ἀπεκρίνατο ⸂λέγων πᾶσιν ὁ Ἰωάννης⸃· Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς· ἔρχεται δὲ ὁ ἰσχυρότερός μου, οὗ οὐκ εἰμὶ ἱκανὸς λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ· αὐτὸς ὑμᾶς βαπτίσει ἐν πνεύματι ἁγίῳ καὶ πυρί·
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/016.yaml
  text: John answered them all[a], saying, “I indeed baptize you with water, but one stronger than I is coming, whose sandal strap I am not worthy to untie[d][c][b]. He will baptize you in the Holy Spirit and fire.”
translation:
  language: hi
  text: यूहन्ना ने उन सबको उत्तर दिया, “मैं तो तुम्हें पानी से बपतिस्मा देता हूँ; परन्तु मुझसे अधिक सामर्थी आने वाला है। मैं उसके सैंडलों की पट्टी खोलने योग्य भी नहीं हूँ। वह तुम्हें पवित्र आत्मा और आग में बपतिस्मा देगा।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पवित्र आत्मा और आग में” का अनुवाद “पवित्र आत्मा और आग से” भी हो सकता है। यहाँ “आग” शुद्धिकरण, न्याय, या आत्मा और आग की एक संयुक्त छवि को सूचित कर सकती है; मूल कथन इसे स्पष्ट नहीं करता।
    reason: lexical_and_theological_alternative
lexical_decisions:
- source_word: ἀπεκρίνατο λέγων πᾶσιν ὁ Ἰωάννης
  choice: यूहन्ना ने उन सबको उत्तर दिया
  rationale: यूनानी उत्तर देने और कहने की संयुक्त कथात्मक अभिव्यक्ति का स्वाभाविक हिन्दी रूप है; ‘उन सबको’ πᾶσιν को स्पष्ट रखता है।
- source_word: Ἐγὼ μὲν ὕδατι βαπτίζω ὑμᾶς
  choice: मैं तो तुम्हें पानी से बपतिस्मा देता हूँ
  rationale: ‘तो’ μέν द्वारा तैयार किए गए विरोध को सहज हिन्दी में व्यक्त करता है। ὕδατι में साधन या तत्व दोनों की छाया हो सकती है; ‘पानी से’ सामान्य और स्वाभाविक है।
- source_word: βαπτίζω / βαπτίσει
  choice: बपतिस्मा देता हूँ / बपतिस्मा देगा
  rationale: सुसमाचार के धार्मिक प्रसंग में यह प्रचलित, स्पष्ट और तटस्थ हिन्दी पद है; ‘डुबोना’ किसी विशिष्ट रीति को अनावश्यक रूप से निश्चित कर सकता है।
- source_word: ὁ ἰσχυρότερός μου
  choice: मुझसे अधिक सामर्थी
  rationale: तुलनात्मक अर्थ को स्पष्ट रखते हुए ἰσχυρός की शक्ति और सामर्थ्य संबंधी व्यापकता बनाए रखता है।
- source_word: ἔρχεται
  choice: आनेवाला है
  rationale: वर्तमान काल की निकट और आसन्न भावना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὗ οὐκ εἰμὶ ἱκανὸς
  choice: मैं ... योग्य भी नहीं हूँ
  rationale: इस विनम्रता-सूचक कथन में ἱκανός का आशय पर्याप्तता के साथ योग्यता से भी है; ‘भी’ तुलना की तीव्रता सहज रूप से दिखाता है।
- source_word: λῦσαι τὸν ἱμάντα τῶν ὑποδημάτων αὐτοῦ
  choice: उसकी जूतियों का फीता खोलने
  rationale: यह निम्न सेवकाई के काम को वर्तमान पाठक के लिए स्पष्ट बनाता है और बहुवचन τῶν ὑποδημάτων को ‘जूतियों’ से बनाए रखता है।
- source_word: αὐτὸς ὑμᾶς βαπτίσει
  choice: वह तुम्हें ... बपतिस्मा देगा
  rationale: ‘वह’ यूहन्ना और आनेवाले के बीच जोरदार विरोध को प्रसंग में पर्याप्त रूप से व्यक्त करता है।
- source_word: ἐν πνεύματι ἁγίῳ καὶ πυρί
  choice: पवित्र आत्मा और आग में
  rationale: ‘में’ ἐν को निकटता से दर्शाता है और साधन, क्षेत्र या तत्व के अर्थ को अनावश्यक रूप से तय नहीं करता। ‘आग’ को बिना व्याख्यात्मक विस्तार के रखा गया है।
theological_decisions:
- issue: ‘पवित्र आत्मा और आग में बपतिस्मा’ का अभिप्राय
  choice: मूल अभिव्यक्ति को ज्यों का त्यों रखते हुए आग को शुद्धिकरण, न्याय अथवा एक संयुक्त आत्मा-और-आग बपतिस्मे के रूप में निश्चित नहीं किया गया।
  alternative: इसे केवल शुद्ध करने वाली आग कहना, अथवा आत्मा और न्याय की आग को दो अलग समूहों के लिए स्पष्ट करना।
  rationale: पद स्वयं इन संभावनाओं में से किसी एक को खुलकर निश्चित नहीं करता; निकटवर्ती प्रसंग न्याय की छवि जोड़ता है, फिर भी अनुवाद को व्याख्यात्मक निष्कर्ष नहीं थोपना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बपतिस्मा’ और ‘पवित्र आत्मा’ जैसे परिचित बाइबलीय पद रखे गए हैं, जबकि वाक्य-विन्यास को सामान्य पाठकों के लिए स्वाभाविक बनाया गया है।
