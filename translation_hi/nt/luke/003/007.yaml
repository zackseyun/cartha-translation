id: LUK.3.7
reference: Luke 3:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Ἔλεγεν οὖν τοῖς ἐκπορευομένοις ὄχλοις βαπτισθῆναι ὑπ’ αὐτοῦ· Γεννήματα ἐχιδνῶν, τίς ὑπέδειξεν ὑμῖν φυγεῖν ἀπὸ τῆς μελλούσης ὀργῆς;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/007.yaml
  text: So he was saying to the crowds coming out to be baptized by him[a], “Offspring of vipers[b], who warned you to flee from the coming wrath?”
translation:
  language: hi
  text: तब वह उन भीड़ों से, जो निकलकर उससे बपतिस्मा लेने आ रही थीं, कहता था, “हे विषधर साँपों की संतान![a] आने वाले क्रोध से भागने की चेतावनी तुम्हें किसने दी?[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे विषधर साँपों के बच्चो!”
    reason: γέννημα के लिए अधिक बोलचाल का शाब्दिक विकल्प।
  - marker: b
    text: या, “उस क्रोध से, जो आने वाला है?”
    reason: यूनानी कृदंत μελλούσης की वैकल्पिक, अधिक विस्तृत अभिव्यक्ति।
lexical_decisions:
- source_word: Ἔλεγεν
  choice: कहा करता था
  rationale: अपूर्णकाल का रूप निरंतर अथवा बार-बार कहने का भाव दे सकता है; ‘कहा करता था’ इस पक्ष को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: οὖν
  choice: इसलिए
  rationale: यह पिछले प्रसंग से कथात्मक और तार्किक संबंध दिखाता है।
- source_word: τοῖς ἐκπορευομένοις ὄχλοις
  choice: उन भीड़ों से, जो ... निकलकर आ रही थीं
  rationale: कृदंत भीड़ों के बाहर निकलकर यूहन्ना की ओर आने को दर्शाता है; हिन्दी में दिशात्मक भाव स्पष्ट रखने के लिए यह अभिव्यक्ति चुनी गई है।
- source_word: βαπτισθῆναι ὑπ’ αὐτοῦ
  choice: उससे बपतिस्मा लेने के लिए
  rationale: यूनानी कर्मवाच्य का स्वाभाविक हिन्दी रूप है; उद्देश्य और यूहन्ना की कर्तृ-भूमिका दोनों बने रहते हैं।
- source_word: Γεννήματα ἐχιδνῶν
  choice: हे विषधर साँपों की संतान
  rationale: γέννημα जन्मी हुई संतान को और ἐχιδνῶν विषधर साँपों को सूचित करता है; संबोधन का तीखा रूपक अक्षुण्ण रखा गया है।
- source_word: τίς ὑπέδειξεν ὑμῖν
  choice: चेतावनी तुम्हें किसने दी
  rationale: इस न्याय-संबंधी प्रसंग में ὑποδείκνυμι का आशय केवल दिखाना नहीं, आनेवाले संकट से सावधान करना है।
- source_word: φυγεῖν
  choice: भागने
  rationale: यह खतरे से दूर भागने की सजीव छवि को बनाए रखता है और इसे केवल ‘बचने’ तक सीमित नहीं करता।
- source_word: ἀπὸ τῆς μελλούσης ὀργῆς
  choice: आनेवाले क्रोध से
  rationale: μέλλουσα निकट अथवा भावी आगमन को व्यक्त करता है; ‘आनेवाला क्रोध’ व्यापक न्याय-संबंधी अर्थ को बिना अधिक व्याख्या के सुरक्षित रखता है।
theological_decisions:
- issue: ὀργή का स्वरूप
  choice: ‘क्रोध’ को आनेवाले ईश्वरीय न्याय के व्यापक संकेत के रूप में रखा गया है
  alternative: इसे विशेष रूप से अंतिम न्याय अथवा किसी ऐतिहासिक दंड के रूप में स्पष्ट करना
  rationale: तात्कालिक प्रसंग पश्चाताप और परमेश्वर के न्याय से संबंधित है, पर यह पद स्वयं उस न्याय को किसी संकीर्ण कालक्रम या मत-सिद्धांत तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘बपतिस्मा’ स्थापित बाइबलीय शब्दावली के रूप में रखा गया है; संबोधन की कठोरता और आनेवाले न्याय की अनिर्दिष्ट व्यापकता सुरक्षित है।
