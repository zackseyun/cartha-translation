review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Jesus' approximate age, the contextual but unstated object of 'beginning,' and the parenthetical qualification that he was publicly regarded as Joseph's son. It also reasonably makes explicit the genealogical ellipsis in 'Joseph of Heli.' However, the dash construction makes the final genealogical link read as an abrupt explanatory addition rather than the continuing genealogy signaled by the Greek participial structure.
  naturalness: Most wording is natural modern Hindi, including respectful plural forms for Jesus. The sequence 'यूसुफ के पुत्र थे—यूसुफ एली का पुत्र था' is needlessly repetitive and stylistically abrupt. A semicolon better presents the successive genealogical statements in clear Hindi.
  terminology: ‘यीशु,’ ‘यूसुफ,’ and ‘एली’ are suitable established Hindi biblical forms. ‘जैसा समझा जाता था’ accurately retains the public-assumption sense without asserting biological paternity. ‘आरम्भ किया’ is acceptable provided the note explains that the object is not explicit.
  issues:
  - severity: medium
    issue: The final dash-separated clause is awkward genealogy formatting.
    rationale: 'Greek continues the genealogical chain elliptically: Jesus, regarded as Joseph''s son, [Joseph] of Heli. The current dash creates an overly detached and repetitive explanatory sentence. Using a semicolon preserves the chain while allowing the necessary Hindi clarification that Joseph was Heli''s son.'
  - severity: low
    issue: The parenthetical qualification is separated from ‘यूसुफ के पुत्र’ by surrounding commas.
    rationale: Parentheses more clearly show, as in Greek and the English audit trail, that the phrase qualifies the assertion of Josephian sonship rather than functioning as a general comment.
  revised_text: और यीशु स्वयं, जब उन्होंने आरम्भ किया[a], लगभग तीस वर्ष के थे और (जैसा समझा जाता था[b]) यूसुफ के पुत्र थे; यूसुफ एली का पुत्र था।
  revised_footnotes:
