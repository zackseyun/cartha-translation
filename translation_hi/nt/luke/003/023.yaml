  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Καὶ αὐτὸς ⸀ἦν Ἰησοῦς ⸂ἀρχόμενος ὡσεὶ ἐτῶν τριάκοντα⸃, ὢν ⸂υἱός, ὡς ἐνομίζετο⸃, Ἰωσὴφ τοῦ Ἠλὶ
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/023.yaml
  text: And Jesus himself[a], when he began, was about thirty years old, being the son (as was supposed) of Joseph[c][b], of Heli.
translation:
  language: hi
  text: और यीशु स्वयं, जब उन्होंने आरम्भ किया[a], लगभग तीस वर्ष के थे और (जैसा समझा जाता था[b]) यूसुफ के पुत्र थे; यूसुफ एली का पुत्र था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में केवल ‘आरम्भ किया’ है; संदर्भ से यीशु के सार्वजनिक कार्य के आरम्भ का अर्थ निकलता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात यीशु को सामान्यतः यूसुफ का पुत्र माना जाता था।
    reason: alternative_reading
lexical_decisions:
- source_word: Καὶ
  choice: और
  rationale: पूर्ववर्ती बपतिस्मा-वृत्तांत से कथा की निरंतरता बनाए रखने वाला सामान्य संयोजक।
- source_word: αὐτὸς
  choice: स्वयं
  rationale: बलाघाती सर्वनाम का जोर सुरक्षित रहता है।
- source_word: ἀρχόμενος
  choice: जब उन्होंने आरम्भ किया
  rationale: संदर्भ में सार्वजनिक कार्य का आरम्भ अभिप्रेत है, पर यूनानी में ‘सेवकाई’ जैसा संज्ञा-पद स्पष्ट रूप से नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: ὡσεὶ ἐτῶν τριάκοντα
  choice: लगभग तीस वर्ष के
  rationale: आयु बताने की स्वाभाविक हिन्दी अभिव्यक्ति, जो ὡσεὶ की अनुमानसूचकता बनाए रखती है।
- source_word: ὡς ἐνομίζετο
  choice: जैसा समझा जाता था
  rationale: यह लोक-मान्यता दर्शाता है, जैविक पितृत्व का सीधा दावा नहीं।
- source_word: Ἰωσὴφ
  choice: यूसुफ
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: τοῦ Ἠλὶ
  choice: यूसुफ एली का पुत्र था
  rationale: यूनानी वंशावली की संक्षिप्त संबंधकारक शृंखला को साधारण हिन्दी में स्पष्ट किया गया; ‘पुत्र’ निहित है।
theological_decisions:
- issue: ‘जैसा समझा जाता था’ का यीशु और यूसुफ के पुत्र-संबंध से जुड़ाव
  choice: वाक्यांश को यूसुफ के पुत्र माने जाने की लोक-धारणा से स्पष्ट रूप से जोड़ा गया।
  alternative: इसे बिना विरामों के रखकर संबंध को कम स्पष्ट छोड़ना।
  rationale: यह लूका के पूर्ववर्ती कुँवारी गर्भधारण-वृत्तांत के साथ पाठ का तनाव सुरक्षित रखता है, पर इस पद से आगे बढ़कर कोई जैविक या वैधानिक विवरण नहीं जोड़ता।
- issue: क्या ‘सेवकाई’ जोड़ा जाए
  choice: मुख्य पाठ में केवल ‘आरम्भ किया’ रखा गया।
  alternative: ‘अपनी सेवकाई आरम्भ की’।
  rationale: संदर्भ सार्वजनिक कार्य के आरम्भ की ओर संकेत करता है, किंतु मूल यूनानी में ‘सेवकाई’ शब्द नहीं है।
- issue: Ἠλὶ के संबंध की व्याख्या
  choice: एली को यूसुफ का पिता बताने वाली सामान्य वंशावली-संरचना अपनाई गई।
  alternative: ‘यूसुफ का, एली का’ जैसी अत्यधिक शाब्दिक और हिन्दी में अस्पष्ट शृंखला।
  rationale: निकटतम और सामान्य व्याकरणिक पठन यही है, फिर भी वंशावली के व्यापक संबंधों के विषय में अतिरिक्त सिद्धांत नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सम्मानसूचक बहुवचन क्रिया-रूपों के साथ स्वाभाविक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। वंशावली की संक्षिप्त यूनानी रचना को हिन्दी में एक स्वतंत्र स्पष्ट उपवाक्य बनाया गया है।
