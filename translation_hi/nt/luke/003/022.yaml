id: LUK.3.22
reference: Luke 3:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: καὶ καταβῆναι τὸ πνεῦμα τὸ ἅγιον σωματικῷ εἴδει ⸀ὡς περιστερὰν ἐπ’ αὐτόν, καὶ φωνὴν ἐξ οὐρανοῦ ⸀γενέσθαι· Σὺ εἶ ὁ υἱός μου ὁ ἀγαπητός, ἐν σοὶ εὐδόκησα.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/022.yaml
  text: 'and the Holy Spirit descended on him in bodily form like a dove[a], and a voice came from heaven: “You are my beloved Son; in you I am well pleased.”'
translation:
  language: hi
  text: 'और पवित्र आत्मा कबूतर के समान शारीरिक रूप में उस पर उतरा, और स्वर्ग से यह वाणी हुई: “तू मेरा प्रिय पुत्र है; तुझसे मैं प्रसन्न हूँ।”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “तुझमें मैं प्रसन्न हुआ।”'
    reason: εὐδόκησα के एओरिस्ट रूप और ἐν σοὶ के अधिक रूपात्मक अनुवाद को सुरक्षित रखने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: καταβῆναι
  choice: उतरा
  rationale: यह क्रिया नीचे आने की गति को सीधे व्यक्त करती है और हिन्दी कथात्मक क्रम में स्वाभाविक है।
- source_word: τὸ πνεῦμα τὸ ἅγιον
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में इस निश्चित यूनानी पद का मानक, स्पष्ट और धर्मवैज्ञानिक रूप से सटीक अनुवाद है।
- source_word: σωματικῷ εἴδει
  choice: शारीरिक रूप में
  rationale: यह पद दृश्य और देह-सदृश प्रकट रूप को व्यक्त करता है; अनुवाद मूल कथन को बनाए रखता है, बिना उसके स्वरूप की अतिरिक्त व्याख्या किए।
- source_word: ὡς περιστερὰν
  choice: कबूतर के समान
  rationale: ὡς यहाँ तुलना सूचित करता है। ‘के समान’ उपमा को सुरक्षित रखता है और यह दावा नहीं करता कि आत्मा सचमुच कबूतर बन गया।
- source_word: ἐπ’ αὐτόν
  choice: उस पर
  rationale: यह यीशु की ओर और उन पर उतरने का सरल तथा स्वाभाविक हिन्दी निरूपण है।
- source_word: φωνὴν ἐξ οὐρανοῦ γενέσθαι
  choice: स्वर्ग से यह वाणी हुई
  rationale: φωνή के साथ γενέσθαι घटना के घटित होने का मुहावरा है। ‘वाणी हुई’ हिन्दी बाइबलीय गद्य में स्पष्ट और गरिमापूर्ण है; ‘यह’ आगे आने वाले प्रत्यक्ष कथन की ओर संकेत करता है।
- source_word: Σὺ εἶ
  choice: तू ... है
  rationale: प्रत्यक्ष दैवी संबोधन में ‘तू’ निकटता और एकवचन को स्वाभाविक हिन्दी में व्यक्त करता है; वाक्य-विन्यास स्पष्ट सर्वनाम के बल को पर्याप्त रूप से बनाए रखता है।
- source_word: ὁ υἱός μου
  choice: मेरा ... पुत्र
  rationale: यह संबंधवाचक यूनानी पद का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: ὁ ἀγαπητός
  choice: प्रिय
  rationale: ‘प्रिय’ ἀγαπητός का संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी रूप है, जो विशेष प्रेम को व्यक्त करता है।
- source_word: ἐν σοὶ
  choice: तुझसे
  rationale: यद्यपि यूनानी में शाब्दिक रूप से ‘तुझमें’ है, εὐδοκέω के साथ आधुनिक हिन्दी का स्वाभाविक मुहावरा ‘तुझसे प्रसन्न’ है; इससे अर्थ बना रहता है।
- source_word: εὐδόκησα
  choice: मैं प्रसन्न हूँ
  rationale: यूनानी रूप एओरिस्ट है, पर इस घोषणा में आधुनिक हिन्दी का वर्तमान-स्थिति वाला मुहावरा स्थायी स्वीकृति को स्वाभाविक ढंग से व्यक्त करता है। अधिक रूपात्मक भूतकालीन विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: पवित्र आत्मा के प्रकट होने का स्वरूप
  choice: आत्मा शारीरिक रूप में उतरा और उसके उतरने की तुलना कबूतर से की गई है।
  alternative: आत्मा वास्तविक कबूतर के रूप में उतरा।
  rationale: σωματικῷ εἴδει दृश्य रूप को और ὡς περιστερὰν उपमा को व्यक्त करता है। ‘कबूतर के समान’ मूल की तुलना बनाए रखता है और आत्मा के सचमुच कबूतर बन जाने का अतिरिक्त दावा नहीं करता।
- issue: εὐδόκησα का काल और भाव
  choice: मुख्य पाठ में ‘मैं प्रसन्न हूँ’, और पादटिप्पणी में अधिक रूपात्मक ‘मैं प्रसन्न हुआ’।
  alternative: तुझमें मैं प्रसन्न हुआ / मैंने तुझमें आनन्द पाया।
  rationale: एओरिस्ट रूप भूतकालीन ढंग से अनूदित हो सकता है, किन्तु दैवी घोषणा में हिन्दी का वर्तमान मुहावरा स्वाभाविक रूप से स्वीकृति की वर्तमान अवस्था बताता है। पादटिप्पणी मूल के कालगत रूप को दृश्यमान रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय गद्य। दैवी प्रत्यक्ष संबोधन में ‘तू/तुझसे’ निकट और एकवचन संबोधन को व्यक्त करता है। उपमा को स्पष्ट रखा गया है और एओरिस्ट की कालगत बारीकी पादटिप्पणी में संरक्षित है।
