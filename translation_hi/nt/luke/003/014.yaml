  text: ἐπηρώτων δὲ αὐτὸν καὶ στρατευόμενοι λέγοντες· ⸂Τί ποιήσωμεν καὶ ἡμεῖς⸃; καὶ εἶπεν ⸀αὐτοῖς· Μηδένα διασείσητε μηδὲ συκοφαντήσητε, καὶ ἀρκεῖσθε τοῖς ὀψωνίοις ὑμῶν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/014.yaml
  text: And soldiers also were asking him[a], saying, “What should we also do?” And he said to them, “Do not extort money from anyone, nor accuse anyone falsely[c][b], and be content with your wages.”
translation:
  language: hi
  text: और सैनिक भी उससे पूछते थे, “और हम क्या करें?” उसने उनसे कहा, “किसी से ज़बरदस्ती धन मत ऐंठो[a], न किसी पर झूठा आरोप लगाओ, और अपने वेतन से संतुष्ट रहो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस क्रिया का शाब्दिक बिंब किसी को झकझोरने या धमकाने का है; यहाँ आशय दबाव अथवा अधिकार के दुरुपयोग से धन ऐंठने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: στρατευόμενοι
  choice: सैनिक
  rationale: यह कृदंत सैन्य सेवा में लगे लोगों को दर्शाता है; प्रसंग में ‘सैनिक’ स्वाभाविक और सटीक है।
- source_word: Τί ποιήσωμεν καὶ ἡμεῖς
  choice: और हम क्या करें?
  rationale: विचारार्थक प्रश्न को सहज हिन्दी में व्यक्त करते हुए ‘और हम’ यूनानी καὶ ἡμεῖς का यह बल बनाए रखता है कि दूसरे समूहों की तरह वे भी पूछ रहे हैं।
- source_word: διασείσητε
  choice: ज़बरदस्ती धन मत ऐंठो
  rationale: क्रिया का मूल बिंब झकझोरने या धमकाने का है, पर यहाँ सत्ता अथवा भय का दुरुपयोग करके लाभ लेने का अर्थ है; यह हिन्दी प्रयोग उसी आशय को स्पष्ट करता है।
- source_word: συκοφαντήσητε
  choice: झूठा आरोप मत लगाओ
  rationale: यहाँ क्रिया किसी को झूठे ढंग से दोषी ठहराने को दर्शाती है; ‘ब्लैकमेल’ जैसे अधिक संकीर्ण अर्थ को थोपे बिना कानूनी-सामाजिक आशय सुरक्षित रहता है।
- source_word: ἀρκεῖσθε
  choice: संतुष्ट रहो
  rationale: वर्तमान आज्ञार्थक रूप निरंतर संतोष की वृत्ति का निर्देश देता है; ‘संतुष्ट रहो’ स्वाभाविक और नैतिक बलयुक्त है।
- source_word: ὀψωνίοις
  choice: वेतन
  rationale: यह शब्द सैनिकों के पारिश्रमिक अथवा रसद के लिए प्रयुक्त होता था; यहाँ ‘वेतन’ व्यापक और आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: सैनिकों को दिया गया नैतिक निर्देश
  choice: पाठ सैनिकों को अपनी स्थिति में रहते हुए ज़बरदस्ती, झूठे आरोप और लोभ से बचने का निर्देश देता है।
  alternative: इसे सैन्य सेवा छोड़ने की अप्रत्यक्ष आज्ञा मानना।
  rationale: यूहन्ना सैनिकों को सीधे संबोधित करके अधिकार के दुरुपयोग और असंतोष पर रोक लगाता है; पद स्वयं न तो सैन्य सेवा की व्यापक स्वीकृति घोषित करता है, न उसे छोड़ने की आज्ञा देता है। अनुवाद इस सीमा और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष नैतिक रजिस्टर अपनाया गया है। ‘और हम क्या करें?’ मूल के बल को स्वाभाविक हिन्दी में रखता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
