  yaml_path: translation/nt/luke/003/021.yaml
  text: It happened that when all the people were baptized[a], and Jesus also had been baptized and was praying, heaven was opened,
translation:
  language: hi
  text: ऐसा हुआ कि जब सब लोग बपतिस्मा पा चुके थे और यीशु भी बपतिस्मा पा चुके थे और प्रार्थना कर रहे थे, तब स्वर्ग[a] खुल गया,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आकाश’। यूनानी शब्द दृश्य आकाश या स्वर्ग—दोनों को दर्शा सकता है; यहाँ प्रकाशन के प्रसंग में ‘स्वर्ग’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐγένετο δὲ
  choice: ऐसा हुआ कि
  rationale: यह लूका की सामान्य घटनात्मक कथन-शैली को व्यक्त करता है। δέ की हल्की कथात्मक प्रगति को हिंदी वाक्य-प्रवाह में समाहित किया गया है, बिना कोई स्पष्ट विरोध या ‘अब’ जोड़ने के।
- source_word: ἐν τῷ βαπτισθῆναι ἅπαντα τὸν λαὸν
  choice: जब सब लोगों ने बपतिस्मा ले लिया था
  rationale: ἐν के साथ articular infinitive यहाँ समय-सूचक है। ‘जब’ स्वाभाविक हिंदी है; ‘सब लोगों’ से ἅπαντα τὸν λαόν का सामूहिक विस्तार बना रहता है।
- source_word: καὶ Ἰησοῦ βαπτισθέντος
  choice: और यीशु भी बपतिस्मा पा चुके थे
  rationale: Genitive absolute समयगत पृष्ठभूमि देता है और καί का योगात्मक अर्थ ‘भी’ से व्यक्त होता है। ‘बपतिस्मा पा चुके थे’ मूल के कर्मवाच्य और मुख्य घटना से पहले पूर्ण हुई क्रिया, दोनों को बनाए रखता है।
- source_word: καὶ προσευχομένου
  choice: और प्रार्थना कर रहे थे
  rationale: यह सहभागी रूप उस समय जारी क्रिया बताता है जब स्वर्ग खुला। हिंदी में अपूर्ण वर्तमान-भूत रूप इसकी निरंतरता स्पष्ट करता है।
- source_word: ἀνεῳχθῆναι
  choice: खुल गया
  rationale: अकर्मक हिंदी अभिव्यक्ति यूनानी कर्मवाच्य का स्वाभाविक समतुल्य है और मरकुस के अधिक प्रबल ‘फट गया’ जैसे चित्र को यहाँ नहीं लाती।
- source_word: τὸν οὐρανὸν
  choice: स्वर्ग
  rationale: आगामी आत्मा के उतरने और दिव्य वाणी के प्रकाशनात्मक प्रसंग में ‘स्वर्ग’ प्राथमिक अर्थ के रूप में सबसे उपयुक्त है; फिर भी ‘आकाश’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: बपतिस्मा के प्रसंग में οὐρανός का संकेत
  choice: स्वर्ग
  alternative: आकाश
  rationale: प्रसंग एक दिव्य प्रकाशन का है, इसलिए ‘स्वर्ग’ उस ऊर्ध्व और ईश्वरीय अर्थ को स्वाभाविक रूप से व्यक्त करता है। फिर भी यूनानी शब्द दृश्य आकाश भी दर्शा सकता है, अतः इस अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: यीशु के बपतिस्मा और प्रार्थना का समयगत संबंध
  choice: यीशु बपतिस्मा पा चुके थे और प्रार्थना कर रहे थे
  alternative: जब यीशु भी बपतिस्मा पा रहे थे और प्रार्थना कर रहे थे
  rationale: पहला participle बपतिस्मा को पूर्ण घटना और दूसरा प्रार्थना को जारी क्रिया के रूप में प्रस्तुत करने देता है। यह वाक्यगत क्रम को स्पष्ट करता है, पर किसी अतिरिक्त धर्मवैज्ञानिक कारण या व्याख्या को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बपतिस्मा’ प्रचलित बाइबलीय धार्मिक पद है। यीशु के लिए आदरसूचक बहुवचन क्रिया-रूप प्रयुक्त हुए हैं। पादटिप्पणी-चिह्न को उसके वास्तविक शब्द ‘स्वर्ग’ के साथ रखा गया है। अंतिम अल्पविराम अगले पद में जारी वाक्य को सूचित करता है।
