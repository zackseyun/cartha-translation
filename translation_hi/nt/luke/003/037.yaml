  text: the son of Methuselah[a], the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan,
translation:
  language: hi
  text: मतूशेलह का पुत्र, हनोक का पुत्र, यारेद का पुत्र, महललेल का पुत्र, कैनान[a] का पुत्र,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में Καϊνάμ है, जिसका लिप्यंतरण ‘कैनान’ या ‘काइनान’ किया जाता है। पुराने नियम की वंशावलियों के साथ सामंजस्य बैठाने के लिए इसे ‘केनान’ भी लिखा जाता है। लूका के यूनानी पाठ में यह नाम उपस्थित है।
    reason: alternative_reading
lexical_decisions:
- source_word: τοῦ
  choice: का पुत्र
  rationale: लूका की वंशावली में प्रत्येक नाम से पहले आया संबंधकारक पद पिछले वाक्यांश से चली आ रही वंशसूचक रचना को आगे बढ़ाता है। हिन्दी में ‘का पुत्र’ संबंध को स्वाभाविक और स्पष्ट बनाता है।
- source_word: Μαθουσαλὰ
  choice: मतूशेलह
  rationale: पुराने नियम के संबंधित व्यक्ति के लिए प्रचलित हिन्दी बाइबलीय नाम रखा गया है।
- source_word: Ἑνὼχ
  choice: हनोक
  rationale: संबंधित पुराने नियम के व्यक्ति का परिचित हिन्दी रूप चुना गया है।
- source_word: Ἰάρετ
  choice: यारेद
  rationale: यूनानी नाम और पुराने नियम के संबंधित नाम के अनुरूप परिचित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: Μαλελεὴλ
  choice: महललेल
  rationale: पुराने नियम की वंशावली से पहचाने जाने वाले नाम का प्रचलित हिन्दी रूप चुना गया है।
- source_word: Καϊνὰμ
  choice: केनान
  rationale: यूनानी Καϊνάμ को पुराने नियम के संबंधित वंशावली-नाम के परिचित हिन्दी रूप ‘केनान’ से व्यक्त किया गया है; यूनानी-आधारित वैकल्पिक लिप्यंतरण पादटिप्पणी में दिया गया है और नाम को मुख्य पाठ से हटाया नहीं गया।
theological_decisions:
- issue: लूका की वंशावली में संबंधकारक पदों का अध्याहार
  choice: हर नाम के साथ ‘का पुत्र’ जोड़ना
  alternative: केवल ‘का’ की शृंखला रखना
  rationale: मूल यूनानी में संबंध वंशावली के संदर्भ से समझा जाता है। हिन्दी में ‘का पुत्र’ जोड़ना निहित अर्थ को स्पष्ट करता है, कोई अतिरिक्त वंशगत दावा नहीं जोड़ता।
- issue: Καϊνὰμ का निरूपण
  choice: मुख्य पाठ में ‘केनान’ नाम बनाए रखना
  alternative: कैनाम अथवा काइनान; या पुराने नियम से सामंजस्य बैठाने के लिए नाम हटाना
  rationale: SBLGNT के यूनानी पाठ में यह नाम स्पष्ट रूप से उपस्थित है, इसलिए इसे हटाया नहीं गया। हिन्दी पाठकों के लिए परिचित रूप मुख्य पाठ में और अधिक निकट यूनानी लिप्यंतरण पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। नामों के परिचित हिन्दी बाइबलीय रूप रखे गए हैं और मूल पाठ की पुनरावृत्त संरचना सुरक्षित है।
