  verdict: revise
  source_fidelity: The draft accurately represents Herod, Herodias as his brother's wife, and the broad reference to all Herod's evil deeds. However, ‘फटकारा था’ makes the Greek present passive participle ἐλεγχόμενος a completed past action. A progressive/habitual Hindi form better preserves its contemporaneous, ongoing force. The historical title is more safely retained as ‘टेट्रार्क’ rather than interpreted as a ruler of an actual quarter-region.
  naturalness: The revised wording is natural modern standard Hindi and retains the deliberately incomplete syntax of this verse, which continues into verse 20. ‘उसे ... फटकार रहा था’ is clearer and more idiomatic than the relative-clause construction in the draft.
  terminology: ‘टेट्रार्क’ preserves the specific historical-political title without implying that Herod literally ruled one fourth of a region. ‘फटकार रहा था’ preserves the moral censure conveyed by ἐλεγχόμενος. The wording ‘हेरोदेस के भाई की पत्नी हेरोदियास’ retains the source’s stated relationship without adding historical identification.
  issues:
  - severity: medium
    issue: The rendering ‘जिसे उसने ... फटकारा था’ uses completed past tense for ἐλεγχόμενος.
    rationale: The Greek is a present passive participle, indicating that Herod was being reproved as the narrative proceeds. ‘उसे ... फटकार रहा था’ preserves this ongoing/contemporaneous aspect.
  - severity: low
    issue: ‘चौथाई प्रदेश का शासक’ over-specifies the literal etymology of τετραάρχης.
    rationale: τετραάρχης is a historical title and does not safely assert that the territory was literally a fourth part. ‘टेट्रार्क’ retains the title faithfully.
