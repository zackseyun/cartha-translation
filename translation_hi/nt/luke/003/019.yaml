  text: ὁ δὲ Ἡρῴδης ὁ τετραάρχης, ἐλεγχόμενος ὑπ’ αὐτοῦ περὶ Ἡρῳδιάδος τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν ὁ Ἡρῴδης,
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/019.yaml
  text: But Herod the tetrarch[a], being rebuked by him concerning Herodias, his brother’s wife, and concerning all the evil things Herod had done,
translation:
  language: hi
  text: परन्तु टेट्रार्क हेरोदेस को वह हेरोदियास, हेरोदेस के भाई की पत्नी, के विषय में और हेरोदेस के किए हुए सभी बुरे कामों के विषय में फटकार रहा था[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दोष बता रहा था’ अथवा ‘उसके बुरे काम उजागर कर रहा था।’ यूनानी शब्द में नैतिक फटकार देने और गलत काम को उजागर करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: τετραάρχης
  choice: चौथाई प्रदेश का शासक
  rationale: यह विशिष्ट ऐतिहासिक-राजनीतिक पद था। अर्थपूर्ण हिन्दी रूप सामान्य पाठक के लिए केवल लिप्यंतरण ‘टेट्रार्क’ से अधिक स्पष्ट है और इसे सामान्य ‘राजा’ भी नहीं बनाता।
- source_word: ἐλεγχόμενος
  choice: जिसे … फटकारा था
  rationale: संदर्भ में यह नैतिक दोष दिखाते हुए डाँटने या भर्त्सना करने का भाव रखता है। सम्बन्धवाचक उपवाक्य हिन्दी में यूनानी कर्मवाच्य कृदन्त का स्वाभाविक रूप देता है।
- source_word: ὑπ’ αὐτοῦ
  choice: उसने
  rationale: सर्वनाम का संकेत पिछले सन्दर्भ के यूहन्ना की ओर है। मूल पाठ की तरह मुख्य पाठ में नाम स्पष्ट रूप से जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: περὶ Ἡρῳδιάδος
  choice: हेरोदियास के विषय में
  rationale: यह περὶ के सम्बन्धसूचक अर्थ को व्यक्त करता है और अगले समानान्तर पद के साथ औपचारिक समानता बनाए रखता है।
- source_word: τῆς γυναικὸς τοῦ ἀδελφοῦ αὐτοῦ
  choice: हेरोदेस के भाई की पत्नी
  rationale: मूल सम्बन्ध को स्पष्ट रखते हुए ‘उसके’ से उत्पन्न सम्भावित सर्वनाम-संदेह को टाला गया है।
- source_word: καὶ περὶ πάντων ὧν ἐποίησεν πονηρῶν
  choice: और हेरोदेस के किए हुए सभी बुरे कामों के विषय में
  rationale: यह सभी दुष्कर्मों के व्यापक बहुवचन अर्थ तथा दोहराए गए περὶ की समानान्तर रचना दोनों को सुरक्षित रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: यह पिछले वर्णन से कथात्मक विरोध और मोड़ को स्वाभाविक हिन्दी में प्रकट करता है।
theological_decisions:
- issue: यूहन्ना द्वारा हेरोदेस की नैतिक भर्त्सना का बल
  choice: फटकारा था
  alternative: दोष जताया था; उसके बुरे काम उजागर किए थे
  rationale: ‘फटकारा’ भविष्यद्वक्ताई नैतिक भर्त्सना को बनाए रखता है, पर इसे कानूनी अभियोग या किसी अतिरिक्त धर्मसैद्धान्तिक दावे में नहीं बदलता।
- issue: भाई की पत्नी से सम्बन्ध
  choice: हेरोदेस के भाई की पत्नी हेरोदियास
  alternative: उसके भाई की पत्नी हेरोदियास
  rationale: मूल पाठ वैवाहिक सम्बन्ध को आरोप के केन्द्र में रखता है। नाम दोहराने से हिन्दी में कर्ता-सर्वनाम की अस्पष्टता दूर होती है, बिना आरोप का विस्तार किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद मूल वाक्य का अधूरा खण्ड है और अगले पद में पूरा होता है, इसलिए अन्त में अल्पविराम रखा गया है। ‘चौथाई प्रदेश का शासक’ ऐतिहासिक पद का अर्थ खोलता है; नामों की पुनरावृत्ति हिन्दी में सर्वनाम-संदेह घटाती है।
