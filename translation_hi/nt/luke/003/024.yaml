lexical_decisions:
- source_word: τοῦ
  choice: का पुत्र
  rationale: वंशावली के प्रसंग में बार-बार आया संबंधकारक पद पूर्ववर्ती पुत्र-संबंध को निहित रूप से दोहराता है। हिन्दी में स्पष्टता और स्वाभाविकता के लिए ‘का पुत्र’ जोड़ा गया है।
- source_word: Μαθθὰτ
  choice: मत्तत
  rationale: यूनानी व्यक्तिगत नाम का निकट और हिन्दी-पाठक के लिए सहज लिप्यंतरण।
- source_word: Λευὶ
