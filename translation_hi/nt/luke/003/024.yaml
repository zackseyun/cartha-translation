- source_word: Μελχὶ
  choice: मलकी
  rationale: यूनानी Μελχί का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
- source_word: Ἰανναὶ
  choice: यन्नै
  rationale: यूनानी Ἰανναί के अंतिम द्विस्वर और व्यंजन-रूप को यथासंभव सुरक्षित रखने वाला लिप्यंतरण।
- source_word: Ἰωσὴφ
  choice: योसेफ़
  rationale: यूनानी Ἰωσήφ का प्रचलित और स्रोत-सन्निकट हिन्दी रूप।
theological_decisions:
- issue: वंशावली में संबंधकारक पदों का लोपयुक्त प्रयोग
  choice: हर नाम से पहले निहित संबंध को ‘का पुत्र’ के रूप में स्पष्ट किया गया।
  alternative: अधिक शाब्दिक रूप में ‘मत्तत का, लेवी का, मलकी का, यन्नै का, योसेफ़ का’ रखा जा सकता है।
  rationale: यूनानी में प्रत्येक नाम संबंधकारक रूप में है और पुत्र-संबंध आसपास के वंशावली-संदर्भ से समझा जाता है। हिन्दी में केवल संबंधकारक शृंखला अस्वाभाविक और अस्पष्ट होगी; ‘का पुत्र’ मूल में निहित संबंध को बिना अतिरिक्त धर्मवैज्ञानिक अर्थ जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। नामों को अनूदित नहीं, देवनागरी में लिप्यंतरित किया गया है। वंशावली की स्पष्टता के लिए दोहराव बनाए रखा गया है।
