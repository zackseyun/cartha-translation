reference: Luke 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ποιήσατε οὖν καρποὺς ἀξίους τῆς μετανοίας· καὶ μὴ ἄρξησθε λέγειν ἐν ἑαυτοῖς· Πατέρα ἔχομεν τὸν Ἀβραάμ, λέγω γὰρ ὑμῖν ὅτι δύναται ὁ θεὸς ἐκ τῶν λίθων τούτων ἐγεῖραι τέκνα τῷ Ἀβραάμ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/008.yaml
  text: Therefore produce fruits worthy of repentance[a], and do not begin to say among yourselves[b], ‘We have Abraham as our father,’ for I tell you that God is able to raise up children for Abraham from these stones.
translation:
  language: hi
  text: इसलिए मन फिराव के योग्य फल उत्पन्न करो[a], और आपस में यह कहना आरम्भ न करो[b], ‘हमारा पिता अब्राहम है,’ क्योंकि मैं तुमसे कहता हूँ कि परमेश्वर इन पत्थरों से अब्राहम के लिए सन्तान उत्पन्न कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मन फिराव के अनुरूप फल उत्पन्न करो।” यूनानी में “फल” बहुवचन है और ऐसे आचरण पर बल है जो वास्तविक मन फिराव से मेल खाते हों।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने मन में।” यूनानी वाक्यांश भीतर-ही-भीतर कहने या अपने समूह में एक-दूसरे से कहने—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ποιήσατε
  choice: लाओ
  rationale: फल के साथ हिन्दी में ‘फल लाओ’ स्वाभाविक मुहावरा है और निर्णायक आज्ञा का बल बनाए रखता है।
- source_word: οὖν
  choice: इसलिए
  rationale: पिछली चेतावनी से निकले निष्कर्ष का तार्किक सम्बन्ध स्पष्ट करता है।
- source_word: καρποὺς ἀξίους τῆς μετανοίας
  choice: मन फिराव के योग्य फल
  rationale: ग्रीक के बहुवचन ‘फल’ और आचरण का वास्तविक पश्चात्ताप/मन फिराव के अनुरूप होना, दोनों सुरक्षित रहते हैं; ‘मन फिराव’ दिशा-परिवर्तन के नैतिक और आत्मिक भाव को व्यक्त करता है।
- source_word: μὴ ἄρξησθε λέγειν
  choice: यह कहना आरम्भ न करो
  rationale: ἄρξησθε के आरम्भ करने वाले पहलू और निषेध के बल को सीधे व्यक्त करता है।
- source_word: ἐν ἑαυτοῖς
  choice: आपस में
  rationale: बहुवचन प्रतिवाचक पद का सामूहिक अर्थ स्वाभाविक हिन्दी में देता है, जबकि भीतर-ही-भीतर कहने की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: Πατέρα ἔχομεν τὸν Ἀβραάμ
  choice: हमारा पिता अब्राहम है
  rationale: वंशगत दावे को स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἐγεῖραι τέκνα τῷ Ἀβραάμ
  choice: अब्राहम के लिए सन्तान उत्पन्न कर सकता है
  rationale: यहाँ ἐγείρω का आशय सन्तान को अस्तित्व में लाने या खड़ा करने से है; ‘उत्पन्न’ हिन्दी में प्रसंगानुकूल है और परमेश्वर की सामर्थ्य को सुरक्षित रखता है।
theological_decisions:
- issue: ‘मन फिराव के योग्य फल’ का अर्थ
  choice: ऐसे प्रत्यक्ष आचरण जो वास्तविक मन फिराव के अनुरूप हों और उसे प्रकट करें
  alternative: ‘मन फिराव के अनुरूप फल’
  rationale: ἀξίους मेल या अनुरूपता बताता है; अनुवाद कर्मों को क्षमा अर्जित करने का साधन नहीं बनाता, पर मन फिराव और जीवन-व्यवहार के बीच आवश्यक सम्बन्ध बनाए रखता है।
- issue: अब्राहम की वंशावली पर भरोसा
  choice: यूहन्ना परमेश्वर के सामने सुरक्षा के पर्याप्त आधार के रूप में शारीरिक वंश पर निर्भरता को चुनौती देता है
  alternative: वंशगत सम्बन्ध को पूर्णतः अस्वीकार करना
  rationale: पद अब्राहम से सम्बन्ध के अस्तित्व को नहीं, उस पर आत्मसुरक्षा के भरोसे को चुनौती देता है और परमेश्वर की स्वतंत्र सामर्थ्य पर बल देता है।
- issue: ‘आपस में’ अथवा ‘अपने मन में’
  choice: मुख्य पाठ में सामूहिक कथन, साथ में आन्तरिक आत्म-कथन की सम्भावना
  alternative: केवल ‘अपने मन में’
  rationale: ἐν ἑαυτοῖς दोनों अर्थों की अनुमति देता है; पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सहज। ‘मन फिराव’ बाइबलीय अर्थ में सोच, इच्छा और जीवन-दिशा के परिवर्तन को संक्षेप में व्यक्त करता है। ‘सन्तान’ को सामूहिक अर्थ में रखा गया है और वंशगत दावे तथा परमेश्वर की सामर्थ्य के बीच मूल तनाव सुरक्षित है।
