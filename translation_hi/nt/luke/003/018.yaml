  text: So with many other exhortations as well[a], he was proclaiming the good news to the people.
translation:
  language: hi
  text: इस प्रकार यूहन्ना बहुत-सी और बातों के द्वारा लोगों को उपदेश देते हुए उन्हें शुभ समाचार सुनाता रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὰ ... καὶ ἕτερα
  choice: और भी बहुत-सी बातों से
  rationale: नपुंसकलिंग बहुवचन विशेषण यहाँ संज्ञा की तरह प्रयुक्त हैं और यूहन्ना द्वारा कही गई अनेक अतिरिक्त बातों की ओर संकेत करते हैं। हिंदी में ‘बातों’ जोड़ना स्वाभाविक है और निहित अर्थ को स्पष्ट करता है।
- source_word: μὲν οὖν
  choice: इसलिए
  rationale: यह पदबंध पिछले कथन से निष्कर्ष और आगे की कथा में संक्रमण दोनों दिखाता है; ‘इसलिए’ इस प्रवाह को संक्षेप में व्यक्त करता है।
- source_word: παρακαλῶν
  choice: समझाता रहा
  rationale: संदर्भ में क्रिया का अर्थ आग्रह, प्रोत्साहन और नैतिक चेतावनी देना है। ‘समझाता रहा’ साधारण आधुनिक हिंदी में इन भावों को समेटता है और कृदंत की जारी क्रिया को व्यक्त करता है।
- source_word: εὐηγγελίζετο
  choice: शुभ समाचार सुनाता रहा
  rationale: अपूर्ण भूतकाल निरंतर क्रिया सूचित करता है। ‘शुभ समाचार सुनाता रहा’ यूहन्ना की घोषणा को स्वयं पाठ के अनुसार शुभ समाचार के रूप में बनाए रखता है।
- source_word: τὸν λαόν
  choice: लोगों को
  rationale: λαός का सीधा और स्वाभाविक हिंदी रूप ‘लोग’ है; पद में इस्राएल या भीड़ जैसा कोई अधिक संकीर्ण विशेषण स्पष्टतः नहीं दिया गया।
theological_decisions:
- issue: यूहन्ना की चेतावनी और उपदेश को εὐηγγελίζετο द्वारा शुभ समाचार कहना
  choice: ‘शुभ समाचार सुनाता रहा’
  alternative: ‘उपदेश देता रहा’ या ‘घोषणा करता रहा’
  rationale: यद्यपि आसपास के उपदेश में चेतावनी भी है, यूनानी क्रिया स्वयं उसके संदेश को शुभ समाचार की घोषणा बताती है। इस तनाव को सामान्य ‘उपदेश’ में समतल नहीं किया गया।
- issue: παρακαλῶν और मुख्य क्रिया के बीच संबंध
  choice: दो समन्वित जारी क्रियाओं के रूप में स्वाभाविक हिंदी—‘समझाता रहा और ... सुनाता रहा’
  alternative: ‘समझाते हुए ... शुभ समाचार सुनाता रहा’
  rationale: यूनानी में παρακαλῶν कृदंत है, पर हिंदी में समन्वित निरंतर क्रियाएँ संबंध को स्पष्ट और सहज रखती हैं, बिना यह तय किए कि ‘बहुत-सी बातें’ केवल उपदेशों की गिनती हैं या उपदेश की विषयवस्तु।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिंदी। ‘शुभ समाचार’ सामान्य पाठक के लिए बोधगम्य है; निरंतरता के लिए ‘रहा’ रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि निहित कर्म को ‘बातों’ के रूप में व्यक्त करना हिंदी में स्वाभाविक है और अर्थगत अस्पष्टता को अनुचित रूप से संकीर्ण नहीं करता।
