revisions:
- from: इसलिए यूहन्ना और भी बहुत-सी बातों से लोगों को समझाता रहा और उन्हें शुभ समाचार सुनाता रहा।
  to: इस प्रकार यूहन्ना बहुत-सी और बातों के द्वारा लोगों को उपदेश देते हुए उन्हें शुभ समाचार सुनाता रहा।
  rationale: The revision softens the causal force of the opening connective, renders παρακαλῶν more accurately in its exhortatory context, and preserves its participial relation to the ongoing proclamation of good news. “बहुत-सी और बातों” reflects the substantival πολλὰ and καὶ ἕτερα without claiming a more specific object than the Greek supplies.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-14T20:42:38Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly retains the ongoing sense of εὐηγγελίζετο and renders τὸν λαόν broadly as “लोगों.” However, “इसलिए” makes μὲν οὖν overly causal; here the particles primarily continue and transition the narrative. “समझाता रहा” is weaker and less specific than παρακαλῶν, which in this context conveys exhorting/urging as he addressed the people. The participial relation is better retained in Hindi with a participial construction.
  naturalness: The proposed revision is natural modern standard Hindi. “इस प्रकार” provides an idiomatic transitional rendering, and “उपदेश देते हुए” clearly relates the exhortation to the main action without an awkward duplication of ongoing verbs.
  terminology: “शुभ समाचार” appropriately renders εὐηγγελίζετο without importing a denominational formulation and preserves Luke’s characterization of John’s proclamation. “लोगों” remains suitably broad for τὸν λαόν.
  issues:
  - severity: medium
    issue: “इसलिए” is too strongly causal for μὲν οὖν.
    rationale: The Greek particle combination marks a narrative transition/consequence from the preceding account, not a strict logical cause. “इस प्रकार” better preserves this restraint.
  - severity: medium
    issue: “समझाता रहा” underrepresents παρακαλῶν.
    rationale: In this preaching context παρακαλέω denotes exhorting, urging, or encouraging. “उपदेश देते हुए” more faithfully conveys the public moral-religious exhortation while remaining idiomatic Hindi.
  - severity: low
    issue: The coordinate finite verbs obscure the Greek participial relationship.
    rationale: Using “उपदेश देते हुए” preserves the subordinate participle in a natural Hindi form and avoids presenting both actions as equally independent assertions.
  revised_text: इस प्रकार यूहन्ना बहुत-सी और बातों के द्वारा लोगों को उपदेश देते हुए उन्हें शुभ समाचार सुनाता रहा।
  revised_footnotes: []
  revision_rationale: The revision softens the causal force of the opening connective, renders παρακαλῶν more accurately in its exhortatory context, and preserves its participial relation to the ongoing proclamation of good news. “बहुत-सी और बातों” reflects the substantival πολλὰ and καὶ ἕτερα without claiming a more specific object than the Greek supplies.
