source:
  edition: SBLGNT
  text: ἦλθον δὲ καὶ τελῶναι βαπτισθῆναι καὶ εἶπαν πρὸς αὐτόν· Διδάσκαλε, τί ⸀ποιήσωμεν;
base_translation:
  language: en
  yaml_path: translation/nt/luke/003/012.yaml
  text: Even tax collectors came to be baptized[a], and they said to him, “Teacher, what should we do?”
translation:
  language: hi
  text: यहाँ तक कि कर वसूलनेवाले भी बपतिस्मा लेने आए[a] और उन्होंने उससे कहा, “गुरु, हम क्या करें?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कर वसूलनेवाले भी बपतिस्मा लेने आए।”
    reason: δέ और καί के संयुक्त बल को हिन्दी में ‘यहाँ तक कि ... भी’ अथवा साधारण योगसूचक ‘भी’ से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: ἦλθον
  choice: आए
  rationale: ἔρχομαι का एओरिस्ट रूप यहाँ सामान्य भूतकालीन घटना बताता है; इसलिए संक्षिप्त और स्वाभाविक ‘आए’ उपयुक्त है।
- source_word: δὲ καὶ τελῶναι
  choice: यहाँ तक कि चुंगी लेनेवाले भी
  rationale: δέ कथन को आगे बढ़ाता है और καί समावेश पर बल देता है। ‘यहाँ तक कि ... भी’ इस आश्चर्यजनक समावेश को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: τελῶναι
  choice: चुंगी लेनेवाले
  rationale: यह शब्द रोमी व्यवस्था में कर/चुंगी वसूलनेवालों को सूचित करता है। ‘चुंगी लेनेवाले’ सामान्य बाइबलीय हिन्दी में परिचित और ऐतिहासिक संदर्भ के अनुकूल है।
- source_word: βαπτισθῆναι
  choice: बपतिस्मा लेने
  rationale: एओरिस्ट कर्मवाच्य infinitive ἦλθον के साथ उद्देश्य व्यक्त करता है। हिन्दी में प्रचलित ‘बपतिस्मा लेने आए’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है, यद्यपि यूनानी रूप शाब्दिक रूप से ‘बपतिस्मा दिए जाने’ का भाव रखता है।
- source_word: εἶπαν πρὸς αὐτόν
  choice: उन्होंने उससे कहा
  rationale: मूल पाठ में ‘कहा’ क्रिया है, केवल ‘पूछा’ नहीं; प्रश्नवाचक कथन होने पर भी यह रूप मूल अभिव्यक्ति को बनाए रखता है।
- source_word: Διδάσκαλε
  choice: गुरु
  rationale: सम्बोधन में διδάσκαλος शिक्षक को दर्शाता है। ‘गुरु’ आधुनिक हिन्दी में संक्षिप्त, आदरपूर्ण और स्वाभाविक सम्बोधन है, बिना ‘रब्बी’ जैसा लिप्यंतरण जोड़े।
- source_word: τί ποιήσωμεν
  choice: हम क्या करें?
  rationale: विचारात्मक एओरिस्ट subjunctive उचित कार्य के विषय में मार्गदर्शन माँगता है; ‘हम क्या करें?’ इसका सीधा और वर्तमान हिन्दी रूप है।
theological_decisions:
- issue: यूहन्ना की पश्चाताप की पुकार पर सामाजिक रूप से बदनाम समूह की प्रतिक्रिया
  choice: ‘यहाँ तक कि चुंगी लेनेवाले भी’ द्वारा उनके बलयुक्त समावेश को स्पष्ट रखना
  alternative: ‘चुंगी लेनेवाले भी बपतिस्मा लेने आए’
  rationale: पद इस बात पर बल देता है कि समाज में नैतिक रूप से संदिग्ध माने जानेवाले लोग भी यूहन्ना के संदेश पर प्रतिक्रिया करते हैं। अनुवाद इस बल को बनाए रखता है, पर उनके विषय में अतिरिक्त नैतिक टिप्पणी नहीं जोड़ता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘चुंगी लेनेवाले’ परिचित बाइबलीय पदावली है; वाक्यरचना बोलचाल में समझने योग्य रखते हुए मूल यूनानी के कथन और बल को सुरक्षित करती है।
