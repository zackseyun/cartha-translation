  text: εἶπεν δὲ πρὸς αὐτούς· Ὁρᾶτε καὶ φυλάσσεσθε ἀπὸ ⸀πάσης πλεονεξίας, ὅτι οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ ⸀αὐτοῦ ἐστιν ἐκ τῶν ὑπαρχόντων ⸀αὐτῷ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/015.yaml
  text: Then he said to them, “Watch out and guard yourselves from every kind of greed, because a person’s life does not consist in the abundance of his possessions.”
translation:
  language: hi
  text: फिर उसने उनसे कहा, “सावधान रहो और हर प्रकार के लोभ[a] से अपने आप को बचाए रखो, क्योंकि किसी का जीवन इस पर निर्भर नहीं है कि उसके पास कितनी संपत्ति है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लालच।” यूनानी शब्द अधिक पाने की लालसा, लोभ या लालच को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: सावधान रहो
  rationale: बहुवचन आज्ञार्थक यहाँ चेतावनी देता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: φυλάσσεσθε
  choice: अपने आपको बचाए रखो
  rationale: मध्यवाच्य आज्ञार्थक का आत्म-सुरक्षा संबंधी भाव बनाए रखता है और पहले चेतावनी-वाचक पद से भेद भी दिखाता है।
- source_word: ἀπὸ πάσης πλεονεξίας
  choice: हर प्रकार के लोभ
  rationale: πάσης चेतावनी की व्यापकता व्यक्त करता है, जबकि πλεονεξία अधिक पाने की लालसा, लालच या लोभ को दर्शाता है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: चेतावनी का कारण प्रस्तुत करने वाले संयोजक का स्वाभाविक हिन्दी रूप।
- source_word: οὐκ ἐν τῷ περισσεύειν τινὶ ἡ ζωὴ αὐτοῦ ἐστιν
  choice: किसी का जीवन ... बहुतायत से नहीं बनता
  rationale: यूनानी कथन का आशय है कि जीवन का स्वरूप या आधार किसी के पास बहुत अधिक होने में नहीं है; यह हिन्दी में उसी संबंध को सहज ढंग से व्यक्त करता है।
- source_word: ἐκ τῶν ὑπαρχόντων αὐτῷ
  choice: उसकी सम्पत्ति की
  rationale: ὑπάρχοντα यहाँ किसी की मिल्कियत या उसके पास की वस्तुओं को सूचित करता है; ‘सम्पत्ति’ संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: πλεονεξία की नैतिक व्यापकता
  choice: हर प्रकार का लोभ
  alternative: सारा लालच; अधिक पाने की हर लालसा
  rationale: चेतावनी केवल दूसरे की वस्तु चाहने के संकीर्ण अर्थ तक सीमित नहीं, बल्कि संचय और अधिक पाने की व्यापक लालसा के विरुद्ध है।
- issue: जीवन और सम्पत्ति के बीच संबंध
  choice: जीवन उसकी सम्पत्ति की बहुतायत से नहीं बनता
  alternative: जीवन उसकी सम्पत्ति की बहुतायत में नहीं है; जीवन उसकी भरपूर सम्पत्ति पर निर्भर नहीं करता
  rationale: यह कथन सम्पत्ति को जीवन का गठनकारी आधार मानने से इनकार करता है; इसे केवल जीवन की अवधि या आजीविका तक सीमित नहीं किया गया।
- issue: अनिश्चित सामान्य व्यक्ति का उल्लेख
  choice: किसी का जीवन ... उसकी सम्पत्ति
  alternative: मनुष्य का जीवन ... उसकी सम्पत्ति
  rationale: τινὶ और αὐτοῦ/αὐτῷ का सामान्य, प्रतिनिधिक भाव सुरक्षित रहता है और कथन किसी विशेष लिंग तक सीमित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; चेतावनी के दोनों आज्ञार्थक पद अलग-अलग रखे गए हैं। भाषा साधारण पाठक के लिए स्पष्ट, पर गरिमापूर्ण है।
