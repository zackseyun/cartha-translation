source:
  edition: SBLGNT
  text: ἔσονται γὰρ ἀπὸ τοῦ νῦν πέντε ἐν ⸂ἑνὶ οἴκῳ⸃ διαμεμερισμένοι, τρεῖς ἐπὶ δυσὶν καὶ δύο ἐπὶ τρισίν,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/052.yaml
  text: For from now on there will be five in one house divided[a], three against two and two against three,
translation:
  language: hi
  text: क्योंकि अब से एक ही घर[a] में पाँच जन आपस में बँटे होंगे—तीन दो के विरुद्ध और दो तीन के विरुद्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिवार” अथवा “घराना।” यूनानी शब्द भौतिक घर या उसमें रहने वाली पारिवारिक इकाई—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἔσονται
  choice: होंगे
  rationale: εἰμί के भविष्यत्काल को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पाँच जन’ स्पष्ट कर्ता है।
- source_word: γὰρ
  choice: क्योंकि
  rationale: पिछले कथन में कही गई फूट का कारण या स्पष्टीकरण प्रस्तुत करने वाली संयोजक शक्ति को स्पष्ट करता है।
- source_word: ἀπὸ τοῦ νῦν
  choice: अब से
  rationale: आगे आने वाले समय का बोध कराने वाला संक्षिप्त और प्रचलित हिन्दी मुहावरा है।
- source_word: πέντε
  choice: पाँच जन
  rationale: संख्या पाँच मनुष्यों के लिए है; ‘जन’ जोड़ने से हिन्दी में आशय सहज और स्पष्ट होता है।
- source_word: ἐν ἑνὶ οἴκῳ
  choice: एक ही घर में
  rationale: οἶκος का ठोस अर्थ ‘घर’ सुरक्षित रहता है, जबकि ‘एक ही’ साझा घरेलू इकाई पर बल देता है; परिवार/घराने का अर्थ पादटिप्पणी में रखा गया है।
- source_word: διαμεμερισμένοι
  choice: आपस में बँटे
  rationale: पूर्ण निष्क्रिय कृदन्त विभाजन से उत्पन्न स्थायी दशा बताता है; ‘आपस में’ संबंधगत फूट को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: τρεῖς ἐπὶ δυσὶν
  choice: तीन दो के विरुद्ध
  rationale: ἐπί के यहाँ विरोधसूचक अर्थ को सीधे और समांतर ढंग से व्यक्त करता है।
- source_word: καὶ δύο ἐπὶ τρισίν
  choice: और दो तीन के विरुद्ध
  rationale: पहले खंड की विरोधात्मक समरूपता को बनाए रखता है।
theological_decisions:
- issue: οἶκος को ठोस ‘घर’ या सामाजिक ‘परिवार/घराना’ के रूप में व्यक्त करना
  choice: मुख्य पाठ में ‘घर’
  alternative: ‘परिवार’ या ‘घराना’
  rationale: यूनानी शब्द दोनों अर्थ दे सकता है। अगले पद में पारिवारिक संबंध स्पष्ट हैं, फिर भी मुख्य पाठ में मूल की ठोस अभिव्यक्ति रखकर व्यापक सामाजिक अर्थ पादटिप्पणी में देना वास्तविक अर्थगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल। ‘आपस में बँटे’ संबंधगत विभाजन को स्पष्ट करता है, और डैश संख्या-विरोध की व्याख्या को सहज बनाता है।
