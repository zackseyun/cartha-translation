id: LUK.12.3
reference: Luke 12:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἀνθ’ ὧν ὅσα ἐν τῇ σκοτίᾳ εἴπατε ἐν τῷ φωτὶ ἀκουσθήσεται, καὶ ὃ πρὸς τὸ οὖς ἐλαλήσατε ἐν τοῖς ταμείοις κηρυχθήσεται ἐπὶ τῶν δωμάτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/003.yaml
  text: Therefore[a], whatever you said in the darkness will be heard in the light, and what you spoke into the ear in the inner rooms will be proclaimed on the housetops.
translation:
  language: hi
  text: इसलिए, जो कुछ तुमने अँधेरे में कहा, वह उजाले में सुना जाएगा; और जो तुमने भीतरी कमरों में किसी के कान में कहा, वह छतों पर घोषित किया जाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छतों पर से घोषित किया जाएगा।” यहाँ प्राचीन घरों की सपाट छतों से सार्वजनिक घोषणा करने की छवि है।
    reason: ἐπὶ τῶν δωμάτων का मूल अर्थ ‘छतों पर’ है; हिन्दी में ‘छतों पर से’ सार्वजनिक प्रसारण की छवि को उभारने वाला स्वाभाविक वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: ἀνθ’ ὧν
  choice: इसलिए
  rationale: यह पद 2 में छिपी बातों के प्रकट होने से निष्कर्ष निकालता है; ‘इसलिए’ उस तार्किक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ὅσα
  choice: जो कुछ
  rationale: यह व्यापक और अनिश्चित संबंधवाचक अर्थ बनाए रखता है—गुप्त रूप से कही गई हर बात।
- source_word: ἐν τῇ σκοτίᾳ … ἐν τῷ φωτί
  choice: अँधेरे में … उजाले में
  rationale: यह मूल का सशक्त विरोध और गोपनीयता से सार्वजनिक प्रकटीकरण तक का रूपक सुरक्षित रखता है।
- source_word: ἀκουσθήσεται
  choice: सुना जाएगा
  rationale: भविष्यत् कर्मवाच्य को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: πρὸς τὸ οὖς
  choice: किसी के कान में
  rationale: मूल की निजी फुसफुसाहट वाली सजीव छवि को मुहावरेदार हिन्दी में स्पष्ट करता है; ‘किसी के’ प्रसंग से निहित श्रोता को व्यक्त करता है।
- source_word: ἐν τοῖς ταμείοις
  choice: भीतरी कमरों में
  rationale: ταμεῖον के भीतरी, निजी अथवा भंडार-कक्ष होने की अर्थ-सीमा में प्रसंगानुकूल गोपनीय स्थान को दर्शाता है, बिना उसे केवल भंडार-कक्ष तक सीमित किए।
- source_word: κηρυχθήσεται
  choice: उसकी घोषणा … की जाएगी
  rationale: सार्वजनिक रूप से घोषित किए जाने का भाव देता है और इसे केवल धार्मिक ‘प्रचार’ तक सीमित नहीं करता।
- source_word: ἐπὶ τῶν δωμάτων
  choice: छतों पर से
  rationale: प्राचीन घरों की सपाट छतों से सार्वजनिक घोषणा की छवि को स्वाभाविक हिन्दी में सामने लाता है; ἐπί यहाँ स्थान या वहाँ से घोषणा—दोनों की छाया रख सकता है।
theological_decisions:
- issue: छिपी बातों के प्रकट होने का समय और माध्यम
  choice: वचन को व्यापक चेतावनी के रूप में रखना कि गुप्त बातें सार्वजनिक होंगी
  alternative: इसे केवल अंतिम न्याय अथवा केवल वर्तमान इतिहास में पाखंड के खुलासे तक सीमित करना
  rationale: निकटवर्ती प्रसंग छिपे पाखंड के खुलने की बात करता है, पर यह पद प्रकटीकरण के समय या माध्यम को निश्चित नहीं करता; अनुवाद उसी तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’। भाषा सरल, गरिमापूर्ण और श्रव्य है। ‘अँधेरा/उजाला’ का रूपक तथा भीतरी कमरों और छतों की स्थानिक छवियाँ सुरक्षित रखी गई हैं।
