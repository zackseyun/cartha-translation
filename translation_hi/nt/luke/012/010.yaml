source:
  edition: SBLGNT
  text: καὶ πᾶς ὃς ἐρεῖ λόγον εἰς τὸν υἱὸν τοῦ ἀνθρώπου, ἀφεθήσεται αὐτῷ τῷ δὲ εἰς τὸ ἅγιον πνεῦμα βλασφημήσαντι οὐκ ἀφεθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/010.yaml
  text: And everyone who speaks a word against the Son of Man[a], it will be forgiven him[b]; but the one who blasphemes against the Holy Spirit will not be forgiven.
translation:
  language: hi
  text: और जो कोई मनुष्य के पुत्र के विरुद्ध कोई बात कहेगा, उसे क्षमा किया जाएगा[a]; पर जो पवित्र आत्मा की निंदा करेगा, उसे क्षमा नहीं किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यूनानी में शाब्दिक भाव है, ‘उसे क्षमा किया जाएगा’; क्षमा की जाने वाली बात, अर्थात अपराध, वाक्य में निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: πᾶς ὃς
  choice: जो कोई
  rationale: यह प्रयोग प्रत्येक व्यक्ति पर लागू होने वाला सामान्य कथन है। ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है और इसके व्यापक अर्थ को बनाए रखता है।
- source_word: ἐρεῖ λόγον
  choice: कोई बात कहेगा
  rationale: λόγον को ‘बात’ के रूप में व्यक्त करने से यूनानी अभिव्यक्ति का आशय बना रहता है और हिन्दी में वाक्य स्वाभाविक सुनाई देता है।
- source_word: εἰς
  choice: के विरुद्ध
  rationale: विरोधपूर्ण वाणी और अगले खंड में निंदा के संदर्भ में εἰς दिशा मात्र नहीं, बल्कि विरोध का भाव व्यक्त करता है।
- source_word: τὸν υἱὸν τοῦ ἀνθρώπου
  choice: मनुष्य के पुत्र
  rationale: ‘मनुष्य का पुत्र’ इस पदवी का स्थापित हिन्दी रूप है; परसर्ग ‘के विरुद्ध’ के कारण यहाँ इसका oblique रूप ‘मनुष्य के पुत्र’ आया है।
- source_word: ἀφεθήσεται αὐτῷ
  choice: उसे क्षमा किया जाएगा
  rationale: यह आधुनिक हिन्दी में स्वाभाविक निष्क्रिय प्रयोग है। यूनानी में क्षमा की जाने वाली बात—अपराध—अव्यक्त है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: τῷ ... βλασφημήσαντι
  choice: जो ... निंदा करेगा
  rationale: संज्ञात्मक कृदंत को भविष्यकालीन मुख्य क्रिया के संदर्भ में सामान्य शर्त के रूप में व्यक्त किया गया है। इससे किसी विवादित पूर्ण-अवस्था संबंधी अर्थ को अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: τὸ ἅγιον πνεῦμα
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में इस दिव्य पदनाम का मानक और स्पष्ट रूप है।
- source_word: οὐκ ἀφεθήσεται
  choice: उसे क्षमा नहीं किया जाएगा
  rationale: यह भविष्यकालीन निष्क्रिय निषेध को सीधे और गंभीरता सहित व्यक्त करता है।
theological_decisions:
- issue: मनुष्य के पुत्र के विरुद्ध बोलने और पवित्र आत्मा की निंदा करने के बीच अंतर
  choice: पाठ में बताए गए क्षमायोग्यता के अंतर को बिना अतिरिक्त व्याख्या के बनाए रखा गया है।
  alternative: पहले कार्य को अज्ञान से किया गया छोटा अपराध और दूसरे को अंतिम अपश्चात्ताप मानकर अनुवाद में ही समझाना।
  rationale: यह पद दोनों के बीच स्पष्ट अंतर रखता है, पर इस कथन में उसके धर्मवैज्ञानिक कारण या प्रक्रिया की परिभाषा नहीं देता। इसलिए अनुवाद उस तनाव को सुलझाने के बजाय सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कोई बात कहेगा’ मूल के λόγον को दर्शाता है, जबकि ‘निंदा करेगा’ βλασφημέω की गंभीरता को बिना अतिरिक्त सांप्रदायिक व्याख्या के व्यक्त करता है।
