id: LUK.12.53
reference: Luke 12:53
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ⸀διαμερισθήσονται πατὴρ ἐπὶ υἱῷ καὶ υἱὸς ἐπὶ πατρί, μήτηρ ⸀ἐπὶ ⸀θυγατέρα καὶ θυγάτηρ ἐπὶ ⸂τὴν μητέρα⸃, πενθερὰ ἐπὶ τὴν νύμφην αὐτῆς καὶ νύμφη ἐπὶ τὴν ⸀πενθεράν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/053.yaml
  text: 'They will be divided: father against son and son against father[a], mother against daughter and daughter against mother[c][b], mother-in-law against her daughter-in-law and daughter-in-law against her mother-in-law.'
translation:
  language: hi
  text: 'वे आपस में बँट जाएँगे: पिता पुत्र के विरुद्ध और पुत्र पिता के विरुद्ध, माँ बेटी के विरुद्ध और बेटी माँ के विरुद्ध, सास अपनी बहू के विरुद्ध और बहू अपनी सास के विरुद्ध।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहू” के लिए प्रयुक्त यूनानी शब्द का अर्थ दूसरे संदर्भों में “दुलहन” भी हो सकता है; यहाँ “सास” के साथ संबंधसूचक युग्म होने के कारण “बहू” उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: διαμερισθήσονται
  choice: वे आपस में बँट जाएँगे
  rationale: भविष्यत् कर्मवाच्य रूप घर-परिवार के भीतर उत्पन्न विभाजन की दशा बताता है। ‘आपस में बँट जाएँगे’ स्वाभाविक हिन्दी में पारस्परिक पारिवारिक फूट को व्यक्त करता है, बिना उसके कारण को अनावश्यक रूप से स्पष्ट किए।
- source_word: ἐπὶ
  choice: के विरुद्ध
  rationale: व्यक्तियों के इन बार-बार आने वाले संबंधसूचक युग्मों में ἐπί विरोध का भाव रखता है; ‘के विरुद्ध’ उसके तीखेपन और समानांतर रचना को बनाए रखता है।
- source_word: πατήρ / υἱός
  choice: पिता / पुत्र
  rationale: यूनानी शब्द पुरुष अभिभावक और पुरुष संतान के विशिष्ट, परस्पर संबंध को बताते हैं; ‘पिता’ और ‘पुत्र’ dignified तथा स्पष्ट आधुनिक हिन्दी हैं।
- source_word: μήτηρ / θυγάτηρ
  choice: माँ / बेटी
  rationale: ये स्त्री अभिभावक और स्त्री संतान को स्पष्ट रूप से दर्शाते हैं। ‘माँ’ और ‘बेटी’ वर्तमान सामान्य हिन्दी में स्वाभाविक और स्पष्ट हैं।
- source_word: πενθερά
  choice: सास
  rationale: यह विवाह-संबंध से बनी माँ के लिए मानक और स्वाभाविक हिन्दी संबंधसूचक शब्द है।
- source_word: νύμφη
  choice: बहू
  rationale: νύμφη अन्य संदर्भों में ‘दुलहन’ हो सकता है, पर यहाँ πενθερά (‘सास’) के साथ परस्पर युग्म होने के कारण ‘बहू’ अपेक्षित संबंध है।
- source_word: αὐτῆς
  choice: अपनी
  rationale: पहले सास-बहू खंड में यूनानी अधिकारवाचक सर्वनाम स्पष्ट है। हिन्दी में ‘अपनी’ उसी संबंध को स्वाभाविक ढंग से व्यक्त करता है; अंतिम परस्पर खंड में स्पष्टता और समानांतरता के लिए इसे दोहराया गया है।
theological_decisions:
- issue: वर्णित विभाजन का स्वरूप
  choice: यीशु के मिशन के परिणामस्वरूप होने वाले सामाजिक और पारिवारिक विरोध का कठोर वर्णन
  alternative: पारिवारिक शत्रुता का अनुमोदन, अथवा सामान्य पारिवारिक तनाव की मात्र कहावत
  rationale: पूर्ववर्ती प्रसंग इस विरोध को आने वाले विभाजन के रूप में प्रस्तुत करता है। अनुवाद उसके तीखे पारस्परिक शब्दों को बनाए रखता है, पर यह अतिरिक्त दावा नहीं जोड़ता कि ऐसी शत्रुता नैतिक रूप से अनुमोदित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठक के लिए सहज, पर गरिमापूर्ण। पारिवारिक संबंधों के लिए प्रचलित ‘माँ’, ‘बेटी’, ‘सास’ और ‘बहू’ चुने गए हैं। पद की लय और पारस्परिक विरोध को समानांतर वाक्यरचना से सुरक्षित रखा गया है।
