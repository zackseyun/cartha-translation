  yaml_path: translation/nt/luke/012/023.yaml
  text: For life is more than food[a], and the body more than clothing.
translation:
  language: hi
  text: क्योंकि जीवन भोजन से बढ़कर है और शरीर वस्त्र से बढ़कर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले आदेश का आधार बताता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक कारण-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ψυχή
  choice: जीवन
  rationale: भोजन, चिंता और शारीरिक आवश्यकताओं के संदर्भ में यहाँ ψυχή का अर्थ व्यक्ति का जीवन है; ‘प्राण’ या ‘आत्मा’ इस प्रसंग में अनावश्यक रूप से संकीर्ण अथवा धर्मवैज्ञानिक अर्थ दे सकते हैं।
- source_word: πλεῖόν
  choice: से बढ़कर
  rationale: तुलनात्मक अर्थ और मूल्यगत श्रेष्ठता—दोनों को सहज हिन्दी में व्यक्त करता है, बिना ‘अधिक महत्त्वपूर्ण’ जैसी व्याख्या जोड़ने के।
- source_word: τροφή
  choice: भोजन
  rationale: संदर्भ में पोषण के लिए खाए जाने वाले आहार का सीधा और सामान्य आधुनिक हिन्दी पर्याय।
- source_word: σῶμα
  choice: शरीर
  rationale: वस्त्र के साथ जोड़े गए भौतिक शरीर का मानक और स्पष्ट हिन्दी रूप।
- source_word: ἔνδυμα
  choice: वस्त्र
  rationale: शरीर को ढकने वाली पहनने की चीज़ का व्यापक, गरिमापूर्ण और सुबोध हिन्दी रूप।
theological_decisions:
- issue: चिंता और प्रावधान की शिक्षा में ψυχή का अर्थ
  choice: ψυχή का अनुवाद ‘जीवन’ किया गया है।
  alternative: आत्मा; प्राण
  rationale: भोजन के साथ ψυχή और वस्त्र के साथ शरीर का समानांतर संबंध सांसारिक जीवन और शारीरिक अस्तित्व की ओर संकेत करता है। यह चयन यहाँ अमर आत्मा के विषय में ऐसा दावा जोड़ने से बचता है जो पद स्वयं नहीं करता, जबकि शब्द की अन्य प्रसंगों में सम्भव व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। दूसरे खंड में ‘है’ का लोप हिन्दी के समानांतर वाक्य-विन्यास में स्वाभाविक है, जबकि ‘से बढ़कर’ दोहराकर यूनानी तुलना स्पष्ट रखी गई है।
