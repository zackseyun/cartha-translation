base_translation:
  language: en
  yaml_path: translation/nt/luke/012/043.yaml
  text: Blessed is that servant whom his master[a], when he comes, will find doing thus.
translation:
  language: hi
  text: धन्य है वह दास, जिसे उसका स्वामी[a] आने पर ऐसा ही करते हुए पाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘प्रभु’। यूनानी शब्द इस घरेलू दृष्टांत में ‘स्वामी’ और व्यापक अर्थ में ‘प्रभु’—दोनों को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: μακάριος
  choice: धन्य
  rationale: यह शब्द आशीष-वचन की धार्मिक और मूल्यांकनात्मक शक्ति को बनाए रखता है; केवल मनोभाव बताने वाला ‘खुश’ या परिस्थितिजन्य ‘भाग्यशाली’ यहाँ कम उपयुक्त है।
- source_word: δοῦλος
  choice: दास
  rationale: यूनानी शब्द अधीनता और स्वामी के प्रति बाध्य सेवा का संबंध व्यक्त करता है। ‘दास’ घरेलू दृष्टांत की सामाजिक भूमिका को स्पष्ट रखता है।
- source_word: ἐκεῖνος
  choice: वह
  rationale: संकेतवाचक शब्द किसी सामान्य दास के बजाय उस विशिष्ट दास पर बल देता है।
- source_word: κύριος
  choice: स्वामी
  rationale: दृष्टांत के घरेलू परिवेश में यह दास के अधिकार-संपन्न स्वामी को दर्शाता है। साथ ही ‘स्वामी’ व्यापक धार्मिक संकेत को पूरी तरह बंद नहीं करता; ‘प्रभु’ विकल्प पादटिप्पणी में रखा गया है।
- source_word: ἐλθὼν
  choice: आने पर
  rationale: अओरिस्ट कृदंत को मुख्य क्रिया से पहले की परिस्थिति बताने वाले स्वाभाविक कालवाचक पदबंध के रूप में प्रस्तुत किया गया है।
- source_word: εὑρήσει
  choice: पाएगा
  rationale: भविष्यत्काल को स्पष्ट रूप से व्यक्त करता है और हिंदी में किसी को किसी काम में लगा हुआ मिलने का स्वाभाविक प्रयोग है।
- source_word: ποιοῦντα οὕτως
  choice: ऐसा ही करते
  rationale: यह पिछले पदों में बताए गए आचरण की ओर संक्षेप में संकेत करता है और आधुनिक हिंदी में सहज है।
theological_decisions:
- issue: लौटने वाले κύριος का घरेलू ‘स्वामी’ और मसीही ‘प्रभु’—दोनों अर्थों से संभावित संबंध
  choice: मुख्य पाठ में ‘स्वामी’
  alternative: मुख्य पाठ में ‘प्रभु’
  rationale: दृष्टांत का प्रत्यक्ष दृश्य घर के दास और उसके स्वामी का है, इसलिए ‘स्वामी’ सतही कथार्थ के लिए सबसे स्वाभाविक है। फिर भी लूका के व्यापक संदर्भ में प्रभु के आगमन का संकेत संभव है, इसलिए ‘प्रभु’ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। वाक्य-रचना मूल के जोर को यथासंभव बनाए रखते हुए स्वाभाविक हिंदी क्रम में रखी गई है।
