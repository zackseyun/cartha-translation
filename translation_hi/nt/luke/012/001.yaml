source:
  edition: SBLGNT
  text: Ἐν οἷς ἐπισυναχθεισῶν τῶν μυριάδων τοῦ ὄχλου, ὥστε καταπατεῖν ἀλλήλους, ἤρξατο λέγειν πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον· Προσέχετε ἑαυτοῖς ἀπὸ τῆς ζύμης, ⸂ἥτις ἐστὶν ὑπόκρισις, τῶν Φαρισαίων⸃.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/001.yaml
  text: Meanwhile[a], when the many thousands of the crowd had gathered together, so that they were trampling one another, he began to say first to his disciples, “Beware of the leaven of the Pharisees[b], which is hypocrisy.”
translation:
  language: hi
  text: इस बीच, जब भीड़ के दसियों हज़ार लोग इकट्ठे हो गए, यहाँ तक कि वे एक-दूसरे को कुचल रहे थे, तो यीशु पहले अपने चेलों से कहने लगे, “फ़रीसियों के ख़मीर से सावधान रहो[a], जो पाखंड है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप पर ध्यान रखो; फ़रीसियों के ख़मीर से सावधान रहो।”
    reason: Προσέχετε ἑαυτοῖς की प्रत्यावर्ती चेतावनी को व्यक्त करने का वैकल्पिक ढंग।
lexical_decisions:
- source_word: Ἐν οἷς
  choice: इसी बीच, जब
  rationale: यह पदबंध यहाँ स्थान नहीं, बल्कि पिछले प्रसंग से जुड़ा समय और परिस्थिति दर्शाता है।
- source_word: τῶν μυριάδων τοῦ ὄχλου
  choice: लोगों की भीड़ के हज़ारों-हज़ार लोग
  rationale: μυριάδες बहुत बड़ी संख्या, कभी दसियों हज़ार, सूचित कर सकता है; ‘हज़ारों-हज़ार’ बिना अनावश्यक गणितीय निश्चितता के विशाल भीड़ का भाव देता है।
- source_word: ὥστε καταπατεῖν ἀλλήλους
  choice: यहाँ तक कि वे एक-दूसरे को कुचल रहे थे
  rationale: ὥστε के परिणामसूचक अर्थ और भीड़ में चल रही अव्यवस्थित क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πρὸς τοὺς μαθητὰς αὐτοῦ πρῶτον
  choice: सबसे पहले अपने चेलों से
  rationale: πρῶτον को मुख्यतः संबोधन की प्राथमिकता से जोड़ता है, पर आगे के क्रम के विषय में अतिरिक्त दावा नहीं करता।
- source_word: Προσέχετε ἑαυτοῖς ἀπὸ
  choice: अपने आप को ... से सावधान रखो
  rationale: प्रत्यावर्ती ἑαυτοῖς और चेतावनी/सुरक्षा के भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: ζύμη
  choice: ख़मीर
  rationale: मूल रूपक और उसके बाइबलीय साहित्यिक संबंधों को बनाए रखता है; इसे ‘प्रभाव’ या ‘शिक्षा’ कहकर व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: ὑπόκρισις
  choice: पाखंड
  rationale: दिखावे और वास्तविकता के अंतर को व्यक्त करने वाला प्रचलित, गरिमापूर्ण हिन्दी शब्द है।
- source_word: τῶν Φαρισαίων
  choice: फ़रीसियों के
  rationale: सम्बन्धकारक को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘ख़मीर’ के रूपक का आशय
  choice: रूपक को बनाए रखते हुए पाठ के अनुसार उसकी पहचान ‘पाखंड’ के रूप में करना
  alternative: इसे सीधे ‘शिक्षा’, ‘बुरा प्रभाव’ या ‘भ्रष्टता’ कहना
  rationale: लूका स्वयं रूपक की व्याख्या ‘पाखंड’ के रूप में करता है; इसलिए रूपक को हटाना साहित्यिक और धर्मवैचारिक तनाव को अनावश्यक रूप से सुलझा देगा।
- issue: πρῶτον का संबंध
  choice: यीशु ने सबसे पहले अपने चेलों को संबोधित किया
  alternative: ‘सबसे पहली बात यह है’ जैसे प्रवचन-सूचक अर्थ में लेना
  rationale: यूनानी में कुछ अस्पष्टता है, पर शब्द-क्रम श्रोताओं की प्राथमिकता का अर्थ स्वाभाविक बनाता है; अनकहे आगामी भाषण-क्रम को स्पष्ट रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘चेलों’, ‘फ़रीसियों’, ‘ख़मीर’ और ‘पाखंड’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। विशाल संख्या को ‘हज़ारों-हज़ार’ कहा गया है ताकि μυριάδες की व्यापकता रहे, पर ठीक संख्या आरोपित न हो।
