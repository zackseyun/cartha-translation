  yaml_path: translation/nt/luke/012/014.yaml
  text: But he said to him, “Man, who appointed me a judge or divider over you?”
translation:
  language: hi
  text: पर उसने उससे कहा, “आदमी, किसने मुझे तुम लोगों पर न्यायाधीश या बँटवारा करने वाला नियुक्त किया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄνθρωπε
  choice: भाई
  rationale: प्रत्यक्ष संबोधन में शाब्दिक ‘मनुष्य’ आधुनिक हिन्दी में अस्वाभाविक और रूखा लगता है; ‘भाई’ यहाँ सामान्य पुरुष-संबोधन का भाव स्वाभाविक रूप से देता है, बिना पारिवारिक संबंध जोड़ने के।
- source_word: κατέστησεν
  choice: नियुक्त किया है
  rationale: क्रिया किसी व्यक्ति को पद या भूमिका में ठहराने/नियुक्त करने का अर्थ देती है; हिन्दी में ‘नियुक्त किया’ स्पष्ट और स्वाभाविक है।
- source_word: κριτὴν
  choice: न्यायाधीश
  rationale: विवाद का निर्णय देनेवाले अधिकारी की भूमिका को सीधे व्यक्त करता है।
- source_word: μεριστὴν
  choice: बँटवारा करनेवाला
  rationale: यह दुर्लभ शब्द संपत्ति या विरासत बाँटनेवाले व्यक्ति को दर्शाता है; ‘मध्यस्थ’ या ‘पंच’ कहने से न्याय-निर्णय का अर्थ जुड़ सकता है और κριτής से भेद घट सकता है।
- source_word: ἐφ’ ὑμᾶς
  choice: तुम लोगों पर
  rationale: बहुवचन सर्वनाम को सुरक्षित रखता है और दोनों पक्षों पर अधिकार की धारणा व्यक्त करता है।
theological_decisions:
- issue: यीशु के प्रश्न का आशय
  choice: प्रश्न को उसके अलंकारिक और अधिकार-संबंधी तनाव सहित रखा गया है
  alternative: इसे यीशु द्वारा हर प्रकार के न्यायिक अधिकार का स्पष्ट निषेध मानकर व्याख्यात्मक अनुवाद करना
  rationale: मूल पाठ केवल पूछता है कि उन्हें इस विशेष विवाद में किसने न्यायाधीश या बाँटनेवाला नियुक्त किया; वह व्यापक धर्मशास्त्रीय निष्कर्ष को स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और बोलचाल में स्वाभाविक हिन्दी। ‘भाई’ संबोधन को सहज बनाने के लिए चुना गया है; ‘तुम लोगों’ से यूनानी बहुवचन स्पष्ट रखा गया है।
