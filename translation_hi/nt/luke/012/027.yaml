  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: κατανοήσατε τὰ κρίνα πῶς αὐξάνει· οὐ κοπιᾷ οὐδὲ νήθει· λέγω δὲ ὑμῖν, οὐδὲ Σολομὼν ἐν πάσῃ τῇ δόξῃ αὐτοῦ περιεβάλετο ὡς ἓν τούτων.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/027.yaml
  text: 'Consider the lilies[a], how they grow: they do not labor or spin; yet I tell you[b], not even Solomon in all his glory was clothed like one of these.'
translation:
  language: hi
  text: सोसन के फूलों[a] पर ध्यान दो कि वे कैसे बढ़ते हैं। वे न तो परिश्रम करते हैं, न सूत कातते हैं। फिर भी मैं तुमसे कहता हूँ, सुलैमान भी अपने सारे वैभव में उनमें से किसी एक के समान वस्त्र पहने हुए न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वनफूलों” अथवा “फूलों”; यूनानी में विशेष रूप से “लिली/सोसन के फूल” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κατανοήσατε
  choice: ध्यान दो
  rationale: आज्ञार्थक क्रिया केवल देखने नहीं, बल्कि ध्यानपूर्वक देखकर विचार करने का आह्वान करती है। ‘ध्यान दो’ आधुनिक और सहज हिन्दी में यही बल रखता है।
- source_word: τὰ κρίνα
  choice: सोसन के फूलों
  rationale: κρίνα विशेष रूप से लिली/सोसन के फूलों को सूचित करता है। मुख्य पाठ में स्रोत की विशिष्टता रखी गई है, जबकि व्यापक वनफूल अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: πῶς αὐξάνει
  choice: कि वे कैसे बढ़ते हैं
  rationale: यूनानी में नपुंसकलिंग बहुवचन कर्ता के साथ क्रिया एकवचन है, पर स्वाभाविक हिन्दी में बहुवचन प्रयोग उचित है। πῶς का रीति-सूचक अर्थ ‘कैसे’ से सुरक्षित है।
- source_word: οὐ κοπιᾷ
  choice: वे न तो परिश्रम करते हैं
  rationale: κοπιάω कठिन श्रम या परिश्रम करने को दर्शाता है। ‘परिश्रम करते हैं’ गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: οὐδὲ νήθει
  choice: न सूत कातते हैं
  rationale: νήθω रेशा या सूत कातने की क्रिया है। हिन्दी में केवल ‘कातना’ की अपेक्षा ‘सूत कातना’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: λέγω δὲ ὑμῖν
  choice: फिर भी मैं तुमसे कहता हूँ
  rationale: δέ यहाँ हल्का विरोध और कथन की ओर संक्रमण दिखाता है। ‘फिर भी’ फूलों के श्रम न करने और उनके वस्त्र-सौंदर्य के निष्कर्ष के बीच का अलंकारिक विरोध स्पष्ट करता है।
- source_word: οὐδὲ Σολομὼν
  choice: सुलैमान भी ... न था
  rationale: οὐδέ का अर्थ ‘यहाँ तक कि ... भी नहीं’ है। हिन्दी की स्वाभाविक वाक्य-रचना में ‘भी’ और अंतिम निषेध इस बल को व्यक्त करते हैं।
- source_word: ἐν πάσῃ τῇ δόξῃ αὐτοῦ
  choice: अपने सारे वैभव में
  rationale: इस संदर्भ में δόξα राजकीय ठाट-बाट और चमक को दर्शाता है। ‘वैभव’ हिन्दी में इस ठोस संदर्भ को ‘महिमा’ से अधिक सहजता से व्यक्त करता है।
- source_word: περιεβάλετο
  choice: वस्त्र पहने हुए न था
  rationale: मध्य/कर्मवाच्य रूप को हिन्दी में स्वाभाविक अवस्था-वर्णन के रूप में दिया गया है। इससे वस्त्र की उपमा बनी रहती है और कर्ता या अभिकर्ता अनावश्यक रूप से निश्चित नहीं होता।
- source_word: ὡς ἓν τούτων
  choice: उनमें से किसी एक के समान
  rationale: तुलना समूह के एक फूल से है। ‘किसी एक’ हिन्दी में अनिश्चित ἕν का स्वाभाविक प्रतिनिधित्व करता है।
theological_decisions:
- issue: पुष्प-संदर्भ की विशिष्टता
  choice: मुख्य पाठ में ‘सोसन के फूल’ रखा गया।
  alternative: ‘वनफूल’ या सामान्यतः ‘फूल’
  rationale: यूनानी κρίνα विशिष्ट रूप से लिली/सोसन कहता है। पौधे की सटीक आधुनिक पहचान पूरी तरह निश्चित न होने पर भी स्रोत को बिना कारण सामान्य नहीं किया गया; विकल्प पादटिप्पणी में सुरक्षित है।
- issue: सुलैमान के वर्णन में δόξα
  choice: ‘वैभव’
  alternative: ‘महिमा’
  rationale: इस प्रसंग में शब्द सुलैमान के राजकीय ठाट और सुंदर वस्त्रों को सूचित करता है। ‘वैभव’ उस संदर्भगत अर्थ को स्पष्ट करता है, जबकि ‘महिमा’ भी शाब्दिक रूप से संभव है।
- issue: περιεβάλετο की वाच्यता
  choice: ‘वस्त्र पहने हुए न था’
  alternative: ‘ऐसे वस्त्र नहीं पहने थे’ या ‘उसे ऐसे वस्त्र नहीं पहनाए गए थे’
  rationale: यूनानी रूप मध्य अथवा कर्मवाच्य ढंग से समझा जा सकता है। हिन्दी अनुवाद वस्त्रधारण की अवस्था बताता है और अभिकर्ता के विषय में पाठ से अधिक नहीं कहता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘सोसन’ अपेक्षाकृत साहित्यिक शब्द है, इसलिए उसके साथ ‘के फूलों’ और एक स्पष्ट पादटिप्पणी दी गई है। वाक्य-विन्यास मौखिक शिक्षा की लय बनाए रखता है।
