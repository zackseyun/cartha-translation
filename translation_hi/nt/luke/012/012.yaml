  text: for the Holy Spirit will teach you in that very hour what you must say[a].
translation:
  language: hi
  text: क्योंकि पवित्र आत्मा तुम्हें उसी घड़ी सिखाएगा कि क्या कहना चाहिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस समय” अथवा “उस घड़ी।” यूनानी पदबंध आवश्यकता के ठीक समय पर विशेष बल देता है।
    reason: ἐν αὐτῇ τῇ ὥρᾳ के वैकल्पिक कालवाचक अनुवादों और उसके बल को स्पष्ट करने के लिए अंग्रेज़ी POB ऑडिट-ट्रेल की lexical-alternative टिप्पणी का अनुरूप रूप।
lexical_decisions:
- source_word: γὰρ
  choice: क्योंकि
  rationale: यह पिछले वचन में दी गई आश्वस्ति का कारण बताता है और हिन्दी में स्पष्ट व्याख्यात्मक संबंध बनाता है।
- source_word: τὸ ἅγιον πνεῦμα
  choice: पवित्र आत्मा
  rationale: यह आधुनिक हिन्दी में इस निश्चित पदबंध का मानक और स्वाभाविक अनुवाद है।
- source_word: διδάξει
  choice: सिखाएगा
  rationale: भविष्यकालीन क्रिया उस सहायता की प्रतिज्ञा व्यक्त करती है जो ठीक आवश्यकता के समय मिलेगी।
- source_word: ὑμᾶς
  choice: तुम्हें
  rationale: द्वितीय पुरुष बहुवचन का स्वाभाविक हिन्दी रूप; संदर्भ में यह चेलों के समूह को संबोधित करता है।
- source_word: ἐν αὐτῇ τῇ ὥρᾳ
  choice: उसी घड़ी
  rationale: αὐτῇ के बल को सुरक्षित रखते हुए यह ठीक उसी आवश्यक समय की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: ἃ
  choice: क्या
  rationale: नपुंसकलिंग बहुवचन संबंधवाचक सर्वनाम को इस आशयवाचक वाक्य में हिन्दी में स्वाभाविक रूप से ‘क्या’ कहा जाता है।
- source_word: δεῖ
  choice: चाहिए
  rationale: यह परिस्थिति में निहित आवश्यकता को व्यक्त करता है; हिन्दी में ‘क्या कहना चाहिए’ स्वाभाविक है और बाध्यता को बिना अनावश्यक कठोरता के बनाए रखता है।
- source_word: εἰπεῖν
  choice: कहना
  rationale: यहाँ आशय उस कथन से है जो पूछताछ या बचाव के समय बोलना है; ‘कहना’ सर्वाधिक स्वाभाविक समतुल्य है।
theological_decisions:
- issue: पवित्र आत्मा का कर्ता के रूप में उल्लेख
  choice: पवित्र आत्मा को सक्रिय रूप से चेलों को सिखाने वाला व्यक्तिगत कर्ता प्रस्तुत किया गया है।
  alternative: इसे केवल एक अवैयक्तिक ईश्वरीय प्रभाव या प्रेरणा मानना।
  rationale: मूल पाठ में ‘पवित्र आत्मा’ भविष्यकालीन सक्रिय क्रिया ‘सिखाएगा’ का स्पष्ट कर्ता है; अनुवाद इस व्याकरणिक प्रस्तुति को रखता है, पर बाद की धर्मवैज्ञानिक शब्दावली नहीं जोड़ता।
- issue: δεῖ में आवश्यकता का स्वरूप
  choice: ‘क्या कहना चाहिए’ के द्वारा आवश्यक या उचित कथन व्यक्त किया गया है।
  alternative: ‘क्या कहना ही होगा’ के द्वारा अधिक कठोर अनिवार्यता व्यक्त करना।
  rationale: δεῖ आवश्यकता दर्शाता है, लेकिन इस प्रसंग में हिन्दी का ‘चाहिए’ अर्थ को स्वाभाविक ढंग से रखता है और यह तय नहीं करता कि बल नैतिक कर्तव्य, परिस्थितिजन्य आवश्यकता या ईश्वरीय निर्देशन में से किस पर है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘उसी घड़ी’ मूल यूनानी की सटीक समयगत बलवत्ता को पर्याप्त रूप से व्यक्त करता है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं समझी गई।
