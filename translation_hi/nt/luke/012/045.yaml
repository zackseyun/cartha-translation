- from: लेकिन यदि वह गुलाम[a] अपने मन में कहे, ‘मेरा मालिक[b] आने में देर कर रहा है,’ और नौकरों और नौकरानियों को पीटना तथा खाना-पीना और मतवाला होना शुरू कर दे,
  to: लेकिन यदि वह गुलाम[a] अपने मन में कहे, ‘मेरा मालिक[b] आने में देर कर रहा है,’ और नौकरों और नौकरानियों को पीटने, खाने-पीने और नशे में धुत्त होने लगे,
