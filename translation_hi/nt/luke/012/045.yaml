review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional statement, the inward thought, the master’s delayed arrival, abuse of both male and female household workers, and ensuing eating, drinking, and drunkenness. ‘गुलाम’ appropriately renders δοῦλος in this parabolic household setting, while ‘नौकरों और नौकरानियों’ suitably renders the distinct pair παῖδες/παιδίσκαι without unnecessarily identifying those terms as δοῦλοι.
  naturalness: ‘मतवाला होना’ is intelligible but somewhat literary and less idiomatic in modern standard Hindi for μεθύσκεσθαι. The construction ‘पीटना तथा खाना-पीना और मतवाला होना शुरू कर दे’ is also awkward because ‘शुरू कर दे’ is postponed over a long coordinated series. A more direct infinitival series is natural and retains the ingressive force.
  terminology: '‘गुलाम’ and ‘मेरा मालिक’ are contextually sound. ‘प्रभु’ is appropriately retained only as a footnoted alternative, since κύριος refers at the narrative level to the household superior. The footnote for δοῦλος needs a minor grammatical correction: ‘हो’ should be ‘होता है.’'
  issues:
  - severity: low
    issue: ‘मतवाला होना’ is less natural than an ordinary modern expression for becoming drunk.
    rationale: μεθύσκεσθαι denotes becoming intoxicated/getting drunk. ‘नशे में धुत्त होना’ is clear, current Hindi and reflects the strongly negative context.
  - severity: low
    issue: The placement of ‘शुरू कर दे’ makes the coordinated Hindi phrasing heavy.
    rationale: Using ‘पीटने, खाने-पीने और नशे में धुत्त होने लगे’ expresses ἄρξηται with all three following actions more smoothly.
  - severity: low
    issue: Footnote a has a grammatical error.
    rationale: In ‘ऐसे व्यक्ति को दर्शाता है जो ... गुलाम या दास हो,’ the habitual descriptive verb should be ‘होता है।’
  revised_text: लेकिन यदि वह गुलाम[a] अपने मन में कहे, ‘मेरा मालिक[b] आने में देर कर रहा है,’ और नौकरों और नौकरानियों को पीटने, खाने-पीने और नशे में धुत्त होने लगे,
