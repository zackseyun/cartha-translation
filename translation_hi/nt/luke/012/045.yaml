id: LUK.12.45
reference: Luke 12:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἐὰν δὲ εἴπῃ ὁ δοῦλος ἐκεῖνος ἐν τῇ καρδίᾳ αὐτοῦ· Χρονίζει ὁ κύριός μου ἔρχεσθαι, καὶ ἄρξηται τύπτειν τοὺς παῖδας καὶ τὰς παιδίσκας, ἐσθίειν τε καὶ πίνειν καὶ μεθύσκεσθαι,
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/045.yaml
  text: But if that servant says in his heart[a], ‘My master delays in coming,’ and begins to beat the male servants and the female servants, and to eat and drink and get drunk[b],
translation:
  language: hi
  text: लेकिन यदि वह गुलाम[a] अपने मन में कहे, ‘मेरा मालिक[b] आने में देर कर रहा है,’ और नौकरों और नौकरानियों को पीटने, खाने-पीने और नशे में धुत्त होने लगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दास’। यूनानी शब्द δοῦλος ऐसे व्यक्ति को दर्शाता है जो अपने मालिक के अधिकार के अधीन गुलाम या दास होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘प्रभु’। यहाँ यूनानी κύριος दृष्टांत के भीतर घर के प्रधान या मालिक के लिए प्रयुक्त हुआ है।
    reason: alternative_reading
lexical_decisions:
- source_word: δοῦλος
  choice: गुलाम
  rationale: यहाँ घरेलू स्वामी के अधीन बँधी हुई स्थिति और उत्तरदायित्व प्रमुख हैं; इसलिए अपेक्षाकृत नरम ‘सेवक’ के बजाय ‘गुलाम’ सामाजिक संबंध को अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: ἐν τῇ καρδίᾳ αὐτοῦ
  choice: अपने मन में
  rationale: हिन्दी का स्वाभाविक मुहावरा है, जो भीतर के निजी विचार का अर्थ बनाए रखता है।
- source_word: Χρονίζει … ἔρχεσθαι
  choice: आने में देर कर रहा है
  rationale: वर्तमान काल में जारी विलंब को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: κύριός μου
  choice: मेरा मालिक
  rationale: दृष्टांत में यह घर के मानवीय स्वामी के लिए है; ‘मालिक’ अधिकार-संबंध को स्पष्ट करता है और इसे सीधे ईश्वरीय उपाधि नहीं बनाता।
- source_word: ἄρξηται
  choice: शुरू कर दे
  rationale: आगे बताए गए दुर्व्यवहार और आत्मलिप्त आचरण के आरम्भ को व्यक्त करता है।
- source_word: τύπτειν
  choice: पीटना
  rationale: संदर्भ में बार-बार किए जाने वाले हिंसक दुर्व्यवहार के लिए ‘मारना’ की अपेक्षा अधिक सटीक है।
- source_word: τοὺς παῖδας καὶ τὰς παιδίσκας
  choice: नौकरों और नौकरानियों
  rationale: यूनानी पाठ में पुरुष और स्त्री घरेलू कर्मियों के स्पष्ट युग्म को सहज हिन्दी में सुरक्षित रखता है।
- source_word: ἐσθίειν τε καὶ πίνειν
  choice: खाना-पीना
  rationale: युग्मित क्रियाओं का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: μεθύσκεσθαι
  choice: मतवाला होना
  rationale: नशे की अवस्था में पहुँचने का अर्थ गरिमापूर्ण और स्पष्ट हिन्दी में देता है।
theological_decisions:
- issue: दृष्टांत में κύριος का अनुवाद, जहाँ वह सीधे परमेश्वर या मसीह की उपाधि नहीं बल्कि घर के मानवीय प्रधान को दर्शाता है
  choice: मालिक
  alternative: प्रभु
  rationale: कथानक के स्तर पर संदर्भ मानवीय घरेलू स्वामी का है। ‘मालिक’ उस अधिकार-संबंध को बनाए रखता है, जबकि ‘प्रभु’ पाठक को समय से पहले ईश्वरीय उपाधि की ओर ले जा सकता है।
- issue: इस घरेलू दृष्टांत में δοῦλος की सामाजिक स्थिति
  choice: गुलाम
  alternative: दास; सेवक
  rationale: पद में अधीनता, कठोर अधिकार और जवाबदेही उभरते हैं; ‘गुलाम’ बँधी हुई सामाजिक स्थिति को नरम किए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। ‘अपने मन में’ मूल मुहावरे का स्वाभाविक रूप है। पद अगले पद में जारी रहने वाले वाक्य का अंश है, इसलिए अंत में अल्पविराम रखा गया है।
