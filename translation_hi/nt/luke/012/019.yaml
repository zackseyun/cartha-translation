source:
  edition: SBLGNT
  text: καὶ ἐρῶ τῇ ψυχῇ μου· Ψυχή, ἔχεις πολλὰ ἀγαθὰ κείμενα εἰς ἔτη πολλά· ἀναπαύου, φάγε, πίε, εὐφραίνου.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/019.yaml
  text: And I will say to my soul[a], ‘Soul, you have many good things laid up for many years. Rest, eat, drink[b], be merry.’
translation:
  language: hi
  text: और मैं अपने प्राण से कहूँगा, ‘हे प्राण[a], तेरे पास बहुत वर्षों के लिए बहुत-सी अच्छी चीज़ें जमा हैं। आराम कर, खा, पी और मौज कर।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आप”; यूनानी ψυχή का अर्थ संदर्भ के अनुसार “प्राण,” “स्वयं” या “जीवन” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐρῶ
  choice: कहूँगा
  rationale: λέγω का भविष्यत् रूप है; हिन्दी में सीधा और स्वाभाविक भविष्यकालीन कथन।
- source_word: ψυχῇ / Ψυχή
  choice: अपने प्राण से / हे प्राण
  rationale: यह व्यक्ति का स्वयं अपने भीतरी अस्तित्व को संबोधन है। ‘प्राण’ यूनानी ψυχή की साहित्यिक गूँज और आत्म-संबोधन को बनाए रखता है, जबकि संदर्भ में इसका अर्थ ‘स्वयं’ या ‘जीवन’ भी हो सकता है।
- source_word: ἀγαθὰ
  choice: अच्छी वस्तुएँ
  rationale: संदर्भ में भौतिक संपत्ति और उपज अभिप्रेत है, पर यूनानी शब्द की व्यापकता बनाए रखने के लिए सामान्य अभिव्यक्ति चुनी गई है।
- source_word: κείμενα
  choice: जमा हैं
  rationale: κεῖμαι यहाँ रखी या भंडारित वस्तुओं का बोध कराता है; ‘जमा हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: εἰς ἔτη πολλά
  choice: बहुत वर्षों के लिए
  rationale: भविष्य में लंबी अवधि तक उपलब्ध रहने का अर्थ सीधे व्यक्त करता है।
- source_word: ἀναπαύου
  choice: आराम कर
  rationale: विश्राम या निश्चिंत होकर रहने की आज्ञा का सहज आधुनिक हिन्दी रूप।
- source_word: φάγε
  choice: खा
  rationale: सरल आज्ञार्थक रूप का सीधा अनुवाद।
- source_word: πίε
  choice: पी
  rationale: सरल आज्ञार्थक रूप का सीधा अनुवाद।
- source_word: εὐφραίνου
  choice: मौज कर
  rationale: यहाँ आनंद मनाने और सुख भोगने का भाव है; ‘मौज कर’ आत्मतुष्ट उत्सवधर्मिता को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दृष्टान्त में आत्म-संबोधन के रूप में ψυχή का अनुवाद
  choice: प्राण
  alternative: स्वयं / जीवन / मन
  rationale: पद कोई तकनीकी मानवशास्त्रीय परिभाषा नहीं देता, बल्कि व्यक्ति को अपने भीतरी अस्तित्व से बात करते दिखाता है। ‘प्राण’ मूल शब्द की साहित्यिक और धर्मवैचारिक गूँज को बचाता है, और पादटिप्पणी उसकी संदर्भगत व्यापकता स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आत्म-संबोधन में ‘हे प्राण’ कुछ साहित्यिक है, पर मूल की अलंकारिक शक्ति बनाए रखता है। आज्ञाओं की संक्षिप्त शृंखला मूल पाठ की लय के अनुरूप रखी गई है।
