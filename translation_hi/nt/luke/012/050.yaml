  text: βάπτισμα δὲ ἔχω βαπτισθῆναι, καὶ πῶς συνέχομαι ἕως ⸀ὅτου τελεσθῇ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/050.yaml
  text: But I have a baptism to undergo[c][b][a], and how distressed I am until it is accomplished.
translation:
  language: hi
  text: पर मुझे एक बपतिस्मा से होकर गुजरना है[a][b], और जब तक वह पूरा न हो जाए, मैं कितना व्याकुल हूँ![c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, ‘मेरे लिए एक बपतिस्मा है जिससे मुझे बपतिस्मा दिया जाना है।’ यूनानी पाठ बपतिस्मे की छवि को स्पष्ट रखता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘बपतिस्मा’ रूपक है और उस अत्यधिक दुःख की ओर संकेत करता है जिसे यीशु शीघ्र सहने वाले हैं।
    reason: alternative_reading
  - marker: c
    text: या, ‘जब तक वह पूरा न हो जाए, मैं कितना दबा हुआ हूँ’ अथवा ‘जब तक वह पूरा न हो जाए, मैं कितने दबाव में हूँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: βάπτισμα
  choice: एक बपतिस्मा
  rationale: मूल रूपक को बनाए रखने के लिए ‘दुःख’ या ‘मृत्यु’ जैसा व्याख्यात्मक शब्द नहीं रखा गया। ‘बपतिस्मा’ डुबोए जाने अथवा किसी प्रबल अनुभव से घिर जाने की छवि को सुरक्षित रखता है।
- source_word: ἔχω βαπτισθῆναι
  choice: मुझे ... लेना है
  rationale: ἔχω के साथ infinitive निकट आती आवश्यकता या दायित्व प्रकट करता है। हिंदी में ‘बपतिस्मा लेना’ स्वाभाविक धार्मिक प्रयोग है और अत्यधिक कृत्रिम शब्द-पुनरावृत्ति से बचता है।
- source_word: πῶς
  choice: कितना
  rationale: यह विस्मयात्मक प्रयोग है, जो यीशु की मनःस्थिति की तीव्रता व्यक्त करता है।
- source_word: συνέχομαι
  choice: व्याकुल हूँ
  rationale: यहाँ क्रिया दबे, जकड़े या आंतरिक दबाव में होने का भाव दे सकती है। ‘व्याकुल’ सहज आधुनिक हिंदी में भावनात्मक तीव्रता व्यक्त करता है, जबकि अन्य संभावित अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: ἕως ὅτου
  choice: जब तक ... न हो जाए
  rationale: यह उस समय-सीमा को दर्शाता है जहाँ तक वर्तमान व्याकुलता बनी रहती है; हिंदी में यह स्वाभाविक संरचना है।
- source_word: τελεσθῇ
  choice: पूरा न हो जाए
  rationale: τελέω का कर्मवाच्य रूप किसी घटना के अपने निर्धारित अंत तक पहुँचने का भाव देता है। ‘पूरा’ इस अर्थ को रखता है और यूहन्ना 19:30 की विशिष्ट शब्दावली को यहाँ आयात नहीं करता।
theological_decisions:
- issue: ‘बपतिस्मा’ के रूपक का आशय
  choice: मुख्य पाठ में बपतिस्मे की छवि को बनाए रखा गया है; संदर्भ में यह यीशु पर आने वाले दुःख और मृत्यु की ओर संकेत करती है।
  alternative: इसे सीधे ‘दुःख’, ‘मृत्यु’ या केवल शाब्दिक जल-बपतिस्मा कहना।
  rationale: निकटवर्ती संदर्भ यीशु के आगामी दुःख की ओर संकेत करता है, पर मूल पाठ जानबूझकर बपतिस्मे का रूपक रखता है। अनुवाद में इस साहित्यिक और धर्मवैचारिक तनाव को सपाट व्याख्या में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बपतिस्मा लेना’ प्रचलित हिंदी प्रयोग है; मूल यूनानी की शब्द-पुनरावृत्ति पादटिप्पणी में सुरक्षित है।
