reference: Luke 12:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πλὴν ζητεῖτε τὴν βασιλείαν ⸀αὐτοῦ, καὶ ⸀ταῦτα προστεθήσεται ὑμῖν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/031.yaml
  text: But seek his kingdom[b][a], and these things will be added to you.
translation:
  language: hi
  text: परन्तु उसके राज्य[a][b] की खोज में लगे रहो, और ये वस्तुएँ भी तुम्हें दे दी जाएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर के राज्य’; यूनानी में ‘उसके राज्य’ है, और ‘उसके’ का संदर्भ प्रसंग से समझ में आता है।
    reason: lexical_alternative
  - marker: b
    text: कुछ पाण्डुलिपियों में ‘उसके राज्य’ के स्थान पर ‘परमेश्वर के राज्य’ है।
    reason: textual_variant
lexical_decisions:
- source_word: πλὴν
  choice: परन्तु
  rationale: यह पिछली चिंता और भौतिक आवश्यकताओं के पीछे भागने की मनाही के विपरीत सही प्राथमिकता प्रस्तुत करता है; ‘परन्तु’ विरोध का भाव स्वाभाविक और संक्षिप्त रूप में रखता है।
- source_word: ζητεῖτε
  choice: खोज में लगे रहो
  rationale: वर्तमानकालीन आज्ञार्थक रूप निरन्तर प्रयत्न और जीवन की दिशा का संकेत देता है। ‘खोज में लगे रहो’ आधुनिक हिन्दी में इस सतत भाव को स्पष्ट करता है।
- source_word: βασιλείαν
  choice: राज्य
  rationale: ‘राज्य’ परिचित बाइबलीय पद है और यहाँ परमेश्वर के शासन तथा उसके अधीन क्षेत्र—दोनों की सम्भावना को खुला रखता है।
- source_word: αὐτοῦ
  choice: उसके
  rationale: यूनानी सर्वनाम को सर्वनाम ही रखकर मूल की अभिव्यक्ति सुरक्षित की गई है; प्रसंग से इसका संकेत परमेश्वर की ओर है।
- source_word: ταῦτα
  choice: ये वस्तुएँ
  rationale: यह आसपास के प्रसंग में भोजन और वस्त्र जैसी आवश्यकताओं को सूचित करता है। यूनानी पाठ में ‘सब’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: προστεθήσεται
  choice: भी तुम्हें दे दी जाएँगी
  rationale: यूनानी भविष्यत् कर्मवाच्य का मूल भाव है कि ये आवश्यकताएँ अतिरिक्त रूप से मिलेंगी। शाब्दिक ‘जोड़ दी जाएँगी’ की तुलना में यह हिन्दी में अधिक स्वाभाविक है, जबकि ‘भी’ अतिरिक्त मिलने का भाव सुरक्षित रखता है।
- source_word: ὑμῖν
  choice: तुम्हें
  rationale: सम्प्रदान कारक का सहज और सीधा हिन्दी रूप।
theological_decisions:
- issue: αὐτοῦ का संदर्भ
  choice: ‘उसके राज्य’ रखा गया है, जिसका संदर्भ प्रसंग में परमेश्वर है।
  alternative: अनुवाद में स्पष्ट करके ‘परमेश्वर के राज्य’ कहा जा सकता है।
  rationale: निकटवर्ती प्रसंग में पिता और परमेश्वर की देखभाल का उल्लेख संदर्भ स्पष्ट करता है। सर्वनाम बनाए रखने से मूल पाठ का रूप और उसकी प्रसंगाधीनता दोनों सुरक्षित रहते हैं।
- issue: ‘राज्य’ का अर्थ-क्षेत्र
  choice: ‘राज्य’
  alternative: ‘शासन’ या ‘राज’
  rationale: βασιλεία परमेश्वर के सक्रिय शासन और उसके राज्य-क्षेत्र दोनों को व्यक्त कर सकता है; केवल ‘शासन’ कहने से अर्थ अनावश्यक रूप से संकरा हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। सतत आज्ञा को ‘खोज में लगे रहो’ से व्यक्त किया गया है। पादटिप्पणी-चिह्न सम्बद्ध पद ‘उसके राज्य’ के तुरंत बाद रखे गए हैं।
