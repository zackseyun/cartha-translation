source:
  edition: SBLGNT
  text: ⸂κἂν ἐν τῇ δευτέρᾳ κἂν⸃ ἐν τῇ τρίτῃ φυλακῇ ἔλθῃ καὶ εὕρῃ οὕτως, μακάριοί ⸀εἰσιν ἐκεῖνοι.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/038.yaml
  text: Even if he comes in the second watch[a], or even in the third, and finds them so[b], blessed are those servants.
translation:
  language: hi
  text: चाहे वह रात के दूसरे पहर[a] में आए, या चाहे तीसरे पहर में आए, और उन्हें ऐसा ही पाए, तो वे धन्य हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, रात की दूसरी निगरानी-अवधि में, या तीसरी निगरानी-अवधि में।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे धन्य हैं।” यहाँ “वे” निकट संदर्भ में बताए गए सेवकों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: κἂν ... κἂν
  choice: चाहे ... या
  rationale: दोहराया हुआ κἄν अनिश्चित और रियायती शर्त व्यक्त करता है। हिन्दी में ‘चाहे ... या’ दोनों संभावित समयों पर समान बल देते हुए स्वाभाविक है।
- source_word: δευτέρᾳ ... τρίτῃ φυλακῇ
  choice: रात के दूसरे पहर ... तीसरे पहर
  rationale: φυλακή यहाँ रात की निगरानी-अवधि है। ‘पहर’ सामान्य हिन्दी में रात के समय-विभाजन को स्वाभाविक रूप से व्यक्त करता है; स्पष्टता के लिए पहली बार ‘रात के’ कहा गया है।
- source_word: ἔλθῃ
  choice: आए
  rationale: इस शर्तीय रचना में एओरिस्ट सब्जंक्टिव अनिश्चित भावी संभावना बताता है, जिसे हिन्दी का ‘आए’ ठीक ढंग से व्यक्त करता है।
- source_word: εὕρῃ οὕτως
  choice: उन्हें इसी तरह पाए
  rationale: οὕτως पिछले पद में वर्णित सेवकों की तैयार अवस्था की ओर संकेत करता है। ‘उन्हें’ निकट संदर्भ से निहित कर्म को स्पष्ट करता है।
- source_word: μακάριοί
  choice: धन्य
  rationale: μακάριος परमेश्वर की दृष्टि में अनुगृहीत और सराहनीय दशा को दर्शाता है; ‘धन्य’ इसका बाइबलीय और धर्मवैचारिक भार बनाए रखता है।
- source_word: ἐκεῖνοι
  choice: वे सेवक
  rationale: यूनानी में शाब्दिक अर्थ ‘वे’ है, पर निकट संदर्भ में संकेत स्वामी के सेवकों की ओर है। ‘सेवक’ जोड़ने से बिना नया अर्थ लाए संदर्भ स्पष्ट होता है।
theological_decisions:
- issue: ἐκεῖνοι के पूर्वपद को स्पष्ट करना
  choice: वे सेवक
  alternative: वे
  rationale: मूल पाठ केवल संकेतवाचक सर्वनाम प्रयोग करता है, पर पिछले पदों में उसके स्पष्ट पूर्वपद स्वामी के सेवक हैं। हिन्दी में उसे व्यक्त करने से संदर्भ साफ होता है; चूँकि इस पद में δοῦλος नहीं है, यह दास/सेवक शब्दावली पर स्वतंत्र निर्णय नहीं है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पहर’ को समय-सूचक लोकप्रचलित शब्द के रूप में चुना गया है, जबकि पादटिप्पणी उसके निगरानी-अवधि वाले अर्थ को स्पष्ट करती है।
