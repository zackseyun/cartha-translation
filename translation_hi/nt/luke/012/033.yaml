  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: πωλήσατε τὰ ὑπάρχοντα ὑμῶν καὶ δότε ἐλεημοσύνην· ποιήσατε ἑαυτοῖς βαλλάντια μὴ παλαιούμενα, θησαυρὸν ἀνέκλειπτον ἐν τοῖς οὐρανοῖς, ὅπου κλέπτης οὐκ ἐγγίζει οὐδὲ σὴς διαφθείρει·
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/033.yaml
  text: Sell your possessions and give alms[a]. Make for yourselves money bags that do not wear out, an unfailing treasure in the heavens[b], where no thief comes near and no moth destroys.
translation:
  language: hi
  text: अपनी संपत्ति बेचकर ज़रूरतमंदों को दान दो। अपने लिए ऐसी थैलियाँ बनाओ जो पुरानी न हों—स्वर्गों में ऐसा खज़ाना जो कभी समाप्त न हो, जहाँ न कोई चोर पास आता है और न कोई पतंगा नष्ट करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πωλήσατε
  choice: बेचकर
  rationale: बहुवचन आज्ञार्थक क्रिया का निर्णायक आह्वान अगले आदेश के साथ स्वाभाविक हिन्दी वाक्य में जोड़ा गया है; इससे सब कुछ बेच डालने का अतिरिक्त अर्थ नहीं जोड़ा जाता।
- source_word: τὰ ὑπάρχοντα ὑμῶν
  choice: अपनी सम्पत्ति
  rationale: यह पद लोगों की मिल्कियत या साधनों को दर्शाता है; ‘सम्पत्ति’ आधुनिक हिन्दी में संक्षिप्त और व्यापक है।
- source_word: δότε ἐλεημοσύνην
  choice: ज़रूरतमन्दों को दान दो
  rationale: ἐλεημοσύνη दया से प्रेरित होकर अभावग्रस्त लोगों को दी जाने वाली सहायता है। यह रूप लक्ष्य और ठोस उदारता दोनों स्पष्ट करता है।
- source_word: ποιήσατε ἑαυτοῖς
  choice: अपने लिए ... बनाओ
  rationale: 'आत्मवाचक सम्प्रदान का आशय सुरक्षित है: श्रोता अपने हित के लिए यह करें।'
- source_word: βαλλάντια μὴ παλαιούμενα
  choice: ऐसी थैलियाँ ... जो पुरानी न हों
  rationale: धन रखने की थैली का ठोस रूपक और παλαιόω का ‘पुराना होना’ दोनों बनाए गए हैं; ‘बटुए’ से आने वाली आधुनिक वस्तु-विशेष की छवि से बचा गया है।
- source_word: θησαυρὸν ἀνέκλειπτον
  choice: ऐसा खज़ाना जो कभी समाप्त न हो
  rationale: ἀνέκλειπτος का अर्थ न चुकने या विफल न होने वाला है; यह सहज हिन्दी में खज़ाने की अक्षयता व्यक्त करता है।
- source_word: ἐν τοῖς οὐρανοῖς
  choice: स्वर्गों में रखा
  rationale: यूनानी बहुवचन सुरक्षित रखा गया है। ‘रखा’ हिन्दी में स्थानगत सम्बन्ध स्पष्ट करता है, पर अलग धर्मवैज्ञानिक दावा नहीं जोड़ता।
- source_word: ὅπου κλέπτης οὐκ ἐγγίζει
  choice: जहाँ न कोई चोर पास आता है
  rationale: ἐγγίζω की निकट आने की स्थानगत छवि सीधे बनी रहती है।
- source_word: οὐδὲ σὴς διαφθείρει
  choice: और न कीड़ा नष्ट करता है
  rationale: σής वस्त्र आदि को खाने वाला पतंगा/कीड़ा है। सामान्य पाठक के लिए ‘कीड़ा’ स्वाभाविक है; अधिक सटीक पहचान पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ἐλεημοσύνη को सामान्य दान अथवा ज़रूरतमन्दों की सहायता के रूप में व्यक्त करना
  choice: ज़रूरतमन्दों को दान दो
  alternative: दान दो / भिक्षा दो
  rationale: शब्द दया से प्रेरित होकर अभावग्रस्त लोगों को देने का बोध कराता है। चुना हुआ रूप सामाजिक लक्ष्य स्पष्ट करता है, पर पद से परे कोई आर्थिक व्यवस्था निर्धारित नहीं करता।
- issue: ἐν τοῖς οὐρανοῖς का बहुवचन
  choice: स्वर्गों में
  alternative: स्वर्ग में
  rationale: मूल यूनानी का बहुवचन संरक्षित है, यद्यपि हिन्दी में एकवचन अधिक प्रचलित है; इससे प्राचीन यहूदी और नए नियम की भाषिक बनावट बनी रहती है।
- issue: थैलियों और अक्षय खज़ाने के रूपकों का सम्बन्ध
  choice: डैश द्वारा निकट सम्बन्ध, बिना उन्हें पूर्णतः समान घोषित किए
  alternative: ‘अर्थात्’ लगाकर थैलियों को खज़ाने के समान ठहराना
  rationale: यूनानी में दोनों कर्मपद साथ रखे गए हैं, पर उनके ठीक वाक्यगत सम्बन्ध को स्पष्ट करने वाला ‘अर्थात्’ नहीं है। डैश सम्बन्ध दिखाता है और कुछ अस्पष्टता बचाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञार्थक बहुवचन प्रयोग किया गया है। ‘ज़रूरतमन्द’, ‘थैलियाँ’ और ‘खज़ाना’ सामान्य पाठकों के लिए सहज हैं। मूल के ‘स्वर्गों’ बहुवचन को जानबूझकर बनाए रखा गया है।
