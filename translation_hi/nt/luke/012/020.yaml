reference: Luke 12:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: εἶπεν δὲ αὐτῷ ὁ θεός· ⸀Ἄφρων, ταύτῃ τῇ νυκτὶ τὴν ψυχήν σου ⸀ἀπαιτοῦσιν ἀπὸ σοῦ· ἃ δὲ ἡτοίμασας, τίνι ἔσται;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/020.yaml
  text: But God said to him, ‘Fool! This very night your life is being demanded back from you, and the things you prepared—whose will they be?’
translation:
  language: hi
  text: परन्तु परमेश्वर ने उससे कहा, “मूर्ख! इसी रात तेरा जीवन[a] तुझसे वापस माँगा जा रहा है; और जो कुछ तूने तैयार किया है, वह किसका होगा?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्राण।” यूनानी शब्द का अर्थ प्रसंग के अनुसार “जीवन” या “प्राण” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἄφρων
  choice: मूर्ख
  rationale: सम्बोधन में प्रयुक्त यह शब्द कठोर नैतिक फटकार देता है। ‘मूर्ख’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: ταύτῃ τῇ νυκτί
  choice: इसी रात
  rationale: संकेतवाचक पद और कालवाचक दत्तिव तत्कालता तथा बल व्यक्त करते हैं; ‘इसी रात’ इसे स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: ψυχήν
  choice: जीवन
  rationale: यहाँ प्रसंग उस मनुष्य की आसन्न मृत्यु का है, इसलिए ‘जीवन’ प्राथमिक अर्थ को स्पष्ट करता है। ‘प्राण’ की सम्भावना पादटिप्पणी में रखी गई है ताकि यूनानी शब्द की व्यापक अर्थ-सीमा बनी रहे।
- source_word: ἀπαιτοῦσιν ἀπὸ σοῦ
  choice: तुझसे वापस माँगा जा रहा है
  rationale: ἀπαιτέω किसी वस्तु को वापस माँगने या उसका लेखा माँगने का भाव रख सकता है। यूनानी में कर्ता अनिर्दिष्ट बहुवचन है; हिन्दी का भाववाच्य अज्ञात कर्ताओं को जोड़े बिना इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: ἃ δὲ ἡτοίμασας
  choice: और जो कुछ तूने तैयार किया है
  rationale: यह मनुष्य द्वारा इकट्ठी और तैयार की गई वस्तुओं की ओर संकेत करता है। ‘जो कुछ’ हिन्दी में नपुंसक बहुवचन सम्बन्धवाचक की सामूहिकता को सहजता से व्यक्त करता है।
- source_word: τίνι ἔσται
  choice: वह किसका होगा?
  rationale: दत्तिव प्रश्नवाचक यहाँ स्वामित्व का भाव देता है। यह संक्षिप्त हिन्दी प्रश्न मूल की आलंकारिक तीक्ष्णता बनाए रखता है।
theological_decisions:
- issue: मृत्यु के प्रसंग में ψυχή का अनुवाद
  choice: जीवन
  alternative: प्राण
  rationale: वचन मनुष्य की निकट आती मृत्यु और उसके सांसारिक जीवन के उससे लिए जाने की बात करता है। ‘जीवन’ किसी विशिष्ट शरीर-आत्मा सिद्धान्त को अनावश्यक रूप से आरोपित नहीं करता; ‘प्राण’ पादटिप्पणी में देकर मूल शब्द की सम्भव व्यापकता सुरक्षित रखी गई है।
- issue: ἀπαιτοῦσιν के अनिर्दिष्ट बहुवचन कर्ता
  choice: 'हिन्दी भाववाच्य: ‘माँगा जा रहा है’'
  alternative: ‘वे तुझसे वापस माँग रहे हैं’
  rationale: मूल में माँगने वालों की पहचान नहीं बताई गई। भाववाच्य इस अस्पष्टता को बनाए रखता है और स्वर्गदूतों या किसी अन्य कर्ता को पाठ में नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। परमेश्वर के सीधे सम्बोधन में ‘तेरा/तुझसे/तूने’ मूल के एकवचन और फटकार की सीधाई को व्यक्त करते हैं। अनिर्दिष्ट यूनानी बहुवचन को हिन्दी भाववाच्य से प्रस्तुत किया गया है।
