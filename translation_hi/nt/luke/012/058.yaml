id: LUK.12.58
reference: Luke 12:58
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ὡς γὰρ ὑπάγεις μετὰ τοῦ ἀντιδίκου σου ἐπ’ ἄρχοντα, ἐν τῇ ὁδῷ δὸς ἐργασίαν ἀπηλλάχθαι ἀπ’ αὐτοῦ, μήποτε κατασύρῃ σε πρὸς τὸν κριτήν, καὶ ὁ κριτής σε ⸀παραδώσει τῷ πράκτορι, καὶ ὁ πράκτωρ σε ⸀βαλεῖ εἰς φυλακήν.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/058.yaml
  text: For as you are going with your accuser before a magistrate[a], make an effort on the way to be released from him, lest he drag you to the judge, and the judge hand you over to the officer, and the officer throw you into prison.
translation:
  language: hi
  text: क्योंकि जब तुम अपने विरुद्ध मुकदमा करनेवाले के साथ अधिकारी के पास जा रहे हो, तो रास्ते में ही उससे छुटकारा पाने की पूरी कोशिश करो[a], कहीं ऐसा न हो कि वह तुम्हें घसीटकर न्यायाधीश के पास ले जाए, न्यायाधीश तुम्हें अधिकारी के हवाले कर दे, और वह अधिकारी तुम्हें जेल में डाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके साथ मामला सुलझाने की।” यूनानी में अक्षरशः “उससे मुक्त हो जाने की” है; इस प्रसंग में आशय संभवतः न्यायाधीश तक मामला पहुँचने से पहले उसे सुलझाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ὡς γὰρ
  choice: क्योंकि जब
  rationale: ‘क्योंकि’ γάρ के व्याख्यात्मक संबंध को और ‘जब’ ὡς द्वारा प्रस्तुत परिस्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: ἀντιδίκου
  choice: अपने विरुद्ध मुकदमा करनेवाले
  rationale: यह कानूनी विवाद के विरोधी पक्ष को स्पष्ट करता है और ‘वादी’ जैसे अपेक्षाकृत तकनीकी शब्द की तुलना में सामान्य पाठक के लिए अधिक सहज है।
- source_word: ἄρχοντα
  choice: अधिकारी
  rationale: यहाँ शब्द नागरिक अथवा प्रशासनिक प्राधिकारी को सूचित करता है। ‘अधिकारी’ व्यापक स्रोतार्थ को बनाए रखता है और आगे आनेवाले ‘न्यायाधीश’ से उसे अलग रखता है।
- source_word: δὸς ἐργασίαν
  choice: पूरी कोशिश करो
  rationale: यह मुहावरा सक्रिय और गंभीर प्रयत्न का आग्रह करता है; यह हिन्दी अभिव्यक्ति उसकी तात्कालिकता और बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: ἀπηλλάχθαι ἀπ’ αὐτοῦ
  choice: उससे छुटकारा पाने
  rationale: यह यूनानी के ‘उससे मुक्त हो जाने’ के निकट रहता है और समझौते को मुख्य पाठ में निश्चित अर्थ बनाकर नहीं जोड़ता। प्रसंगगत वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: ἐν τῇ ὁδῷ
  choice: रास्ते में ही
  rationale: ‘ही’ इस बात की तात्कालिकता उभारता है कि औपचारिक न्यायिक कार्रवाई से पहले कदम उठाया जाए।
- source_word: κατασύρῃ
  choice: घसीटकर
  rationale: यह क्रिया के बलपूर्ण और विवश करके ले जानेवाले भाव को बनाए रखता है।
- source_word: κριτήν / κριτής
  choice: न्यायाधीश
  rationale: कानूनी प्रसंग में यह मानक और स्पष्ट हिन्दी समतुल्य है।
- source_word: παραδώσει
  choice: हवाले कर दे
  rationale: यह न्यायिक अधिकार के अधीन किसी दूसरे अधिकारी को सौंपे जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: πράκτορι / πράκτωρ
  choice: न्यायिक अधिकारी / वह अधिकारी
  rationale: यह आदेश लागू करनेवाले अधिकारी की भूमिका को व्यक्त करता है, पर किसी आधुनिक देश की विशिष्ट कानूनी पदवी को प्राचीन प्रसंग पर आरोपित नहीं करता। दूसरी बार सर्वनामात्मक पदबंध अनावश्यक पुनरुक्ति से बचाता है।
- source_word: βαλεῖ εἰς φυλακήν
  choice: जेल में डाल दे
  rationale: यह βάλλω की बलपूर्णता को बनाए रखते हुए आधुनिक और सहज हिन्दी प्रयोग है।
theological_decisions:
- issue: कानूनी दृष्टांत की आध्यात्मिक पहचान
  choice: पद में उपस्थित कानूनी दृश्य को ही अनूदित किया गया है; पात्रों को किसी विशिष्ट आध्यात्मिक सत्ता से नहीं जोड़ा गया।
  alternative: वादी को परमेश्वर अथवा शैतान, न्यायाधीश को परमेश्वर, और जेल को अंतिम दंड के रूप में स्पष्ट करके अनुवाद करना।
  rationale: मूल पद ऐसी पहचानों को प्रत्यक्ष रूप से नहीं बताता। व्यापक प्रसंग अंतिम न्याय की तात्कालिकता सुझा सकता है, पर अनुवाद को उस निहितार्थ को सिद्धांतगत व्याख्या बनाकर पाठ में नहीं जोड़ना चाहिए।
- issue: ἀπηλλάχθαι का प्रसंगगत अर्थ
  choice: मुख्य पाठ में अपेक्षाकृत शाब्दिक ‘उससे छुटकारा पाने’ रखा गया और समझौते का अर्थ पादटिप्पणी में दिया गया।
  alternative: मुख्य पाठ में ‘उससे समझौता कर लो’ लिखना।
  rationale: समझौता करना इस कानूनी प्रसंग में संभावित और संभवतः अभिप्रेत व्यावहारिक अर्थ है, किंतु यूनानी अभिव्यक्ति अक्षरशः ‘उससे मुक्त हो जाना’ कहती है। मुख्य पाठ और पादटिप्पणी मिलकर इस अर्थगत तनाव को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कानूनी वर्णन रखा गया है। ‘मजिस्ट्रेट’, ‘बेलिफ़’ और ‘वादी’ जैसे अधिक तकनीकी अथवा किसी विशिष्ट व्यवस्था से जुड़े पदों से बचते हुए भूमिकाएँ सामान्य पाठक के लिए स्पष्ट की गई हैं।
