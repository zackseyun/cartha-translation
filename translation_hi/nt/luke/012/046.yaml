id: LUK.12.46
reference: Luke 12:46
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: ἥξει ὁ κύριος τοῦ δούλου ἐκείνου ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ καὶ ἐν ὥρᾳ ᾗ οὐ γινώσκει, καὶ διχοτομήσει αὐτὸν καὶ τὸ μέρος αὐτοῦ μετὰ τῶν ἀπίστων θήσει.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/046.yaml
  text: the master of that servant will come on a day when he does not expect him and at an hour he does not know[b][a], and will cut him in pieces and assign his place with the unfaithful.
translation:
  language: hi
  text: उस दास का स्वामी उस दिन आएगा जिस दिन वह उसकी अपेक्षा नहीं करता, और उस घड़ी जिसे वह नहीं जानता; और वह उसे दो टुकड़े कर देगा[a] और उसका भाग उन लोगों के साथ निर्धारित करेगा जो विश्वासयोग्य नहीं हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे चीरकर दो भाग कर देगा”; कुछ लोग इस अभिव्यक्ति को मुहावरे के रूप में “उसे बहुत कठोर दण्ड देगा” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “अविश्वासियों के साथ।”
    reason: alternative_reading
lexical_decisions:
- source_word: κύριος
  choice: स्वामी
  rationale: दृष्टान्त में यह दास के स्वामी को दर्शाता है; ‘स्वामी’ घरेलू अधिकार-संबंध को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक रूप से प्रत्यक्ष मसीही उपाधि नहीं बनाता।
- source_word: δοῦλος
  choice: दास
  rationale: यह शब्द अधीनता और स्वामित्व के संबंध को स्पष्ट रखता है; आधुनिक हिन्दी में ‘दास’ इस दृष्टान्त के ऐतिहासिक सामाजिक संबंध के लिए संक्षिप्त और गरिमापूर्ण है।
- source_word: ἥξει
  choice: आएगा
  rationale: भविष्यकाल में स्वामी के आगमन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: ἐν ἡμέρᾳ ᾗ οὐ προσδοκᾷ
  choice: ऐसे दिन ... जब वह उसकी बाट नहीं जोह रहा होगा
  rationale: προσδοκάω की अपेक्षा/प्रतीक्षा की धारणा को व्यक्त करता है; ‘उसकी’ का संदर्भ स्वामी से है।
- source_word: ἐν ὥρᾳ ᾗ οὐ γινώσκει
  choice: ऐसी घड़ी में जिसे वह नहीं जानता
  rationale: γινώσκω का मूल अर्थ ‘जानना’ सुरक्षित है, जिससे पहले खंड की ‘प्रतीक्षा’ और इस खंड के ‘ज्ञान’ का भेद बना रहता है।
- source_word: διχοτομήσει
  choice: दो टुकड़े कर देगा
  rationale: क्रिया का प्रत्यक्ष अर्थ ‘दो भागों में काटना’ है। हिन्दी में यह यूनानी की कठोर न्याय-छवि को सटीकता से बनाए रखता है।
- source_word: τὸ μέρος αὐτοῦ
  choice: उसका भाग
  rationale: μέρος का सामान्य अर्थ ‘भाग/हिस्सा’ है; यहाँ नियत परिणाम या हिस्सा अर्थगत रूप से निहित है, पर अनुवाद मूल रूपक को बनाए रखता है।
- source_word: ἀπίστων
  choice: विश्वासघातियों
  rationale: दृष्टान्त का निकट संदर्भ सौंपे गए दायित्व के प्रति अविश्वस्त होने का है। यह शब्द उस संबंधपरक बेवफाई को व्यक्त करता है, जबकि ‘अविश्वासियों’ का सम्भव अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: θήσει
  choice: ठहराएगा
  rationale: τίθημι यहाँ किसी का भाग या नियति किसी समूह के साथ निर्धारित करने के अर्थ में है; ‘ठहराएगा’ न्यायिक निर्धारण को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: διχοτομήσει की दण्ड-छवि को शाब्दिक रखा जाए या मुहावरेदार कठोर दण्ड के रूप में नरम किया जाए
  choice: मुख्य पाठ में ‘दो टुकड़े कर देगा’
  alternative: ‘बहुत कठोर दण्ड देगा’
  rationale: यूनानी की तीखी और सम्भवतः प्रत्यक्ष छवि को मुख्य पाठ में सुरक्षित रखना उचित है; मुहावरेदार समझ सम्भव होने के कारण उसे पादटिप्पणी में दिया गया है।
- issue: ἀπίστων का अर्थ निष्ठाहीन लोगों से है या अविश्वासियों से
  choice: मुख्य पाठ में ‘विश्वासघातियों’
  alternative: ‘अविश्वासियों’
  rationale: दास की निष्ठा इस दृष्टान्त का तात्कालिक विषय है, इसलिए संबंधपरक अर्थ मुख्य पाठ में उपयुक्त है; फिर भी यूनानी शब्द अविश्वास को भी दर्शा सकता है, अतः उस अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘बाट जोहना’ अपेक्षा और प्रतीक्षा दोनों का स्वाभाविक, किंचित साहित्यिक पर सामान्यतः बोधगम्य रूप है। कठोर दण्ड-छवि को नरम नहीं किया गया, और ἀπίστων की अर्थगत द्विविधा पादटिप्पणी में सुरक्षित रखी गई है।
