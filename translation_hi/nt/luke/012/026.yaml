  text: εἰ οὖν ⸀οὐδὲ ἐλάχιστον δύνασθε, τί περὶ τῶν λοιπῶν μεριμνᾶτε;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/026.yaml
  text: If[a], then, you are not able to do even the smallest thing, why are you anxious about the rest?
translation:
  language: hi
  text: इसलिए यदि तुम छोटे-से-छोटा काम भी नहीं कर सकते, तो बाकी बातों की चिंता क्यों करते हो?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰ οὖν
  choice: इसलिए यदि
  rationale: εἰ की शर्त और οὖν के पिछले तर्क से निकले निष्कर्ष—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: οὐδὲ ἐλάχιστον
  choice: छोटे-से-छोटा काम भी नहीं
  rationale: ἐλάχιστον नपुंसकलिंग एकवचन में संज्ञा की तरह प्रयुक्त है। ‘काम’ जोड़ने से यूनानी की संक्षिप्त अभिव्यक्ति हिन्दी में स्पष्ट होती है और क्षमता के संदर्भ से स्वाभाविक रूप से जुड़ती है।
- source_word: δύνασθε
  choice: नहीं कर सकते
  rationale: δύναμαι की सामर्थ्य या क्षमता का सीधा और सहज हिन्दी रूप है।
- source_word: τί
  choice: क्यों
  rationale: περὶ और चिंता करने की क्रिया के साथ τί यहाँ आलंकारिक कारणवाचक प्रश्न बनाता है।
- source_word: περὶ τῶν λοιπῶν
  choice: बाकी बातों की
  rationale: λοιπός छोटे-से-छोटे काम के अतिरिक्त शेष मामलों की ओर संकेत करता है; ‘बाकी बातें’ संक्षिप्त और स्वाभाविक है।
- source_word: μεριμνᾶτε
  choice: चिंता करते हो
  rationale: μεριμνάω यहाँ लगातार चिंतित रहने या चिंता करने को व्यक्त करता है; यह आधुनिक मानक हिन्दी में सहज है और केवल विवेकपूर्ण परवाह को निषिद्ध नहीं बताता।
theological_decisions:
- issue: परमेश्वर पर निर्भरता की शिक्षा में μεριμνάω का अर्थ
  choice: चिंता करते हो
  alternative: फिक्र करते हो; चिंतित रहते हो; परवाह करते हो
  rationale: ‘चिंता’ अनुचित व्याकुलता को व्यक्त करती है, पर आधुनिक चिकित्सकीय अर्थ तक सीमित नहीं होती। ‘परवाह’ विवेकपूर्ण देखभाल को भी निषिद्ध बताने का भ्रम पैदा कर सकती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में है, जो आसपास के शिष्यों को दिए गए उपदेश के अनुकूल है। वाक्य गरिमापूर्ण, बोलचाल में समझने योग्य और यूनानी के शर्तात्मक-निष्कर्षात्मक तनाव को सुरक्षित रखता है।
