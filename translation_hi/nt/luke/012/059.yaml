  edition: SBLGNT
  text: λέγω σοι, οὐ μὴ ἐξέλθῃς ἐκεῖθεν ἕως ⸂καὶ τὸ⸃ ἔσχατον λεπτὸν ἀποδῷς.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/059.yaml
  text: I tell you[a], you will certainly not get out of there until you have paid even the last lepton.
translation:
  language: hi
  text: मैं तुमसे कहता हूँ, तुम वहाँ से किसी भी तरह बाहर नहीं निकलोगे, जब तक कि तुम आखिरी लेप्टोन[a] भी न चुका दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आखिरी छोटा सिक्का।” यूनानी लेप्टोन बहुत कम मूल्य का सिक्का था।
    reason: ऐतिहासिक यूनानी सिक्के λεπτόν की विशिष्टता बनाए रखते हुए उसका मूल्य-संबंधी अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: λέγω σοι
  choice: मैं तुमसे कहता हूँ
  rationale: यह सीधे संबोधन का स्वाभाविक आधुनिक हिन्दी रूप है और वर्तमानकालीन कथन का बल बनाए रखता है।
- source_word: οὐ μὴ ἐξέλθῃς
  choice: तुम किसी भी तरह बाहर नहीं निकलोगे
  rationale: οὐ μή के साथ एओरिस्ट सब्जंक्टिव भविष्य के विषय में प्रबल निषेध व्यक्त करता है; यह हिन्दी वाक्यांश उसी निश्चित और जोरदार निषेध को स्वाभाविक रूप में देता है।
- source_word: ἐκεῖθεν
  choice: वहाँ से
  rationale: यह स्थान से अलग होने या निकलने का सीधा अर्थ व्यक्त करता है।
- source_word: ἕως
  choice: जब तक ... तब तक
  rationale: यह उस समय-बिंदु तक लागू रहने वाली नकारात्मक स्थिति को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: καὶ τὸ ἔσχατον
  choice: आखिरी ... तक
  rationale: यहाँ καί का समावेशी-जोरदार भाव और ἔσχατον की अंतिमता, 'तक' के साथ मिलकर पूर्ण भुगतान पर बल देती है।
- source_word: λεπτόν
  choice: लेप्टोन
  rationale: ऐतिहासिक सिक्के की विशिष्टता बनाए रखने के लिए यूनानी नाम का लिप्यंतरण किया गया है; पादटिप्पणी उसका अर्थ समझाती है।
- source_word: ἀποδῷς
  choice: चुका दो
  rationale: कानूनी और ऋण-संबंधी प्रसंग में यह भुगतान पूरा करने का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: कथन में ऋण और कारावास के चित्र का आशय
  choice: ऋण और कारावास के चित्र को बिना किसी अतिरिक्त व्याख्या के बनाए रखा गया है।
  alternative: इसे केवल सांसारिक कानूनी परिणाम, ईश्वरीय न्याय, या शोधन-स्थान संबंधी दंड के रूप में स्पष्ट करना।
  rationale: पद स्वयं कारावास और पूरा भुगतान होने तक न छूटने की बात करता है, पर उसके संकेतार्थ को स्पष्ट नहीं करता। इसलिए अनुवाद वास्तविक धर्मवैचारिक तनाव को बनाए रखता है और बाद की किसी विशिष्ट धार्मिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'किसी भी तरह ... नहीं' प्रबल यूनानी निषेध को व्यक्त करता है; 'लेप्टोन' ऐतिहासिक विशिष्टता बनाए रखता है और पादटिप्पणी सामान्य पाठक के लिए उसका अर्थ स्पष्ट करती है।
