review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys the direct address, emphatic future negation, departure from that place, and release only after complete payment. However, “आखिरी लेप्टोन तक” can suggest payment up to a monetary amount rather than the Greek emphasis that even the final small coin must be paid. “भी” directly represents intensive καί.
  naturalness: The conditional-first structure is understandable, but placing the emphatic denial first and using “जब तक कि” produces smoother modern Hindi. “आखिरी लेप्टोन भी” is idiomatic and clear.
  terminology: “लेप्टोन” appropriately retains the historically specific coin name. The footnote should present the small-coin rendering as an alternative and explain the term, rather than defining it with “अर्थात,” which can make the historical name seem fully interchangeable.
  issues:
  - severity: low
    issue: “आखिरी लेप्टोन तक” does not clearly express the intensive force of καὶ.
    rationale: The source means payment of even the last lepton, not merely payment ‘up to’ the last lepton.
  - severity: low
    issue: Footnote wording is less precise than the audit-trail note.
    rationale: An alternative rendering plus a brief explanation of the Greek coin better preserves both historical specificity and reader clarity.
