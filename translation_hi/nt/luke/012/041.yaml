id: LUK.12.41
reference: Luke 12:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: Εἶπεν ⸀δὲ ὁ Πέτρος· Κύριε, πρὸς ἡμᾶς τὴν παραβολὴν ταύτην λέγεις ἢ καὶ πρὸς πάντας;
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/041.yaml
  text: Then Peter said[a], “Lord, are you telling this parable to us, or also to everyone?”
translation:
  language: hi
  text: तब पतरस ने कहा, “प्रभु, क्या आप यह दृष्टान्त हमसे कह रहे हैं या सब लोगों से भी?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν
  choice: ने कहा
  rationale: λέγω के अओरिस्ट रूप का सीधा अर्थ ‘कहा’ है; प्रश्नवाचक आशय वाक्य की रचना और प्रश्नचिह्न से स्पष्ट होता है।
- source_word: δὲ
  choice: तब
  rationale: δέ यहाँ कथन को पिछले प्रसंग से जोड़ते हुए कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक संक्रमण देता है।
- source_word: Κύριε
  choice: प्रभु
  rationale: यीशु को सीधे संबोधित करते समय κύριος के आदरपूर्ण अर्थ और सम्भावित मसीही गूँज—दोनों को ‘प्रभु’ सुरक्षित रखता है।
- source_word: πρὸς ἡμᾶς
  choice: हमसे
  rationale: λέγεις के साथ πρός कथन के श्रोताओं की ओर संकेत करता है; ‘हमसे कह रहे हैं’ हिन्दी में ‘हम लोगों को संबोधित करके कह रहे हैं’ का स्वाभाविक रूप है।
- source_word: τὴν παραβολὴν ταύτην
  choice: यह दृष्टान्त
  rationale: सुसमाचारों में παραβολή यीशु की आलंकारिक शिक्षाओं का प्रचलित पद है; ‘दृष्टान्त’ हिन्दी बाइबलीय प्रयोग में परिचित और अर्थ-संगत है।
- source_word: λέγεις
  choice: कह रहे हैं
  rationale: वर्तमानकालीन λέγεις को चल रहे कथन के विषय में तत्काल प्रश्न के रूप में हिन्दी का अपूर्ण वर्तमान स्वाभाविक ढंग से व्यक्त करता है।
- source_word: ἢ καὶ
  choice: या ... भी
  rationale: ‘या’ विकल्प और ‘भी’ καί की योगात्मक शक्ति—दोनों को बनाए रखते हैं।
- source_word: πρὸς πάντας
  choice: सब लोगों से
  rationale: πάντας यहाँ व्यापक श्रोता-समूह के लिए सामान्य रूप में प्रयुक्त है; ‘सब लोगों’ से उसका समावेशी आशय स्वाभाविक हिन्दी में स्पष्ट होता है।
theological_decisions:
- issue: यीशु के लिए संबोधन κύριος
  choice: प्रभु
  alternative: स्वामी
  rationale: ‘प्रभु’ सम्मानसूचक संबोधन और सम्भावित मसीही महत्त्व दोनों को खुला रखता है; ‘स्वामी’ अर्थतः सम्भव है, पर यहाँ अनावश्यक रूप से केवल सांसारिक अधिकार का भाव दे सकता है।
- issue: πάντας का सामान्य पुल्लिंग बहुवचन
  choice: सब लोगों
  alternative: सब पुरुषों
  rationale: सन्दर्भ में विरोध ‘हम’ और व्यापक श्रोता-समूह के बीच है, केवल पुरुषों के बीच नहीं; इसलिए लिंग-सीमा आरोपित किए बिना सामान्य आशय व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और बोलचाल में सहज रखी गई है। ‘आप’ के साथ बहुवचन आदरसूचक क्रिया का प्रयोग हुआ है। ‘दृष्टान्त’ बाइबलीय साहित्य में परिचित पद होने के साथ सामान्य पाठक के लिए भी बोधगम्य है।
