id: LUK.12.2
reference: Luke 12:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: SBLGNT
  text: οὐδὲν δὲ συγκεκαλυμμένον ἐστὶν ὃ οὐκ ἀποκαλυφθήσεται, καὶ κρυπτὸν ὃ οὐ γνωσθήσεται.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/002.yaml
  text: But nothing is covered up that will not be revealed[c][b][a], and hidden that will not be known.
translation:
  language: hi
  text: परन्तु ऐसा कुछ भी ढका हुआ नहीं है जो प्रकट नहीं किया जाएगा,[a][c] और कुछ भी छिपा हुआ नहीं है जो ज्ञात नहीं होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ढका हुआ’ के स्थान पर ‘छिपाया हुआ’ भी अनुवाद किया जा सकता है; यूनानी में किसी वस्तु के ढके होने और फिर प्रकट किए जाने का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: ‘छिपा हुआ’ के स्थान पर ‘गुप्त’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: यह कथन सामान्य रूप से अंततः होने वाले प्रकटीकरण की ओर संकेत कर सकता है—चाहे वर्तमान में हो या अंतिम न्याय के समय।
    reason: alternative_reading
lexical_decisions:
- source_word: οὐδὲν
  choice: ऐसा कुछ भी नहीं
  rationale: नपुंसकलिंग एकवचन नकारात्मक सर्वनाम का स्वाभाविक हिन्दी रूप; कथन की पूर्ण व्यापकता बनाए रखता है।
- source_word: δὲ
  choice: परन्तु
  rationale: δέ यहाँ पिछले संदर्भ से हल्का विरोध अथवा आगे बढ़ता हुआ संबंध दिखाता है; ‘परन्तु’ इस सूक्ष्म विरोध को स्पष्ट रखता है।
- source_word: συγκεκαλυμμένον
  choice: ढका हुआ
  rationale: पूर्णकालिक कर्मवाच्य कृदन्त किसी वस्तु की वर्तमान ढकी हुई अवस्था बताता है। ‘ढका हुआ’ मूल आवरण-रूपक को बचाता है और ἀποκαλυφθήσεται के साथ स्वाभाविक विरोध बनाता है।
- source_word: ἀποκαλυφθήσεται
  choice: प्रकट न किया जाएगा
  rationale: भविष्यत् कर्मवाच्य रूप और संबंधित οὐκ दोनों सुरक्षित हैं; यह ढकी वस्तु के बाद में उजागर होने का भाव व्यक्त करता है।
- source_word: κρυπτὸν
  choice: छिपा हुआ
  rationale: विशेषण का अर्थ ‘छिपा हुआ’ या ‘गुप्त’ है। ‘छिपा हुआ’ समानांतर रचना बनाए रखता है और संज्ञा ‘भेद’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: γνωσθήσεται
  choice: जाना न जाएगा
  rationale: भविष्यत् कर्मवाच्य का निकट और गरिमापूर्ण हिन्दी रूप; यह स्वयं यह तय नहीं करता कि बात किस समय या किसके द्वारा जानी जाएगी।
theological_decisions:
- issue: कथन का कालगत और न्याय-संबंधी दायरा
  choice: जो अभी ढका या छिपा है, वह आगे चलकर प्रकट और ज्ञात होगा—पर अनुवाद समय या प्रसंग को निश्चित नहीं करता।
  alternative: इसे केवल अंतिम न्याय में होने वाले प्रकाशन, अथवा केवल वर्तमान जीवन में पाखंड के खुलने, तक सीमित करना।
  rationale: यूनानी भविष्यत् कर्मवाच्य रूप भावी प्रकटीकरण बताते हैं, किन्तु उसका ठीक समय नहीं बताते। इसलिए व्यापक कथन और उसकी धर्मवैचारिक तनातनी सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और समानांतर वाक्य-विन्यास रखा गया है। ‘प्रकट न किया जाएगा’ मूल के कर्मवाच्य को सुरक्षित रखता है; ‘जाना न जाएगा’ उसके समानांतर औपचारिक किन्तु सुबोध रूप है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
