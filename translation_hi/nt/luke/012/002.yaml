review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the two parallel Greek negated relative clauses, the future passive sense, and the open-ended scope of eventual disclosure. ‘प्रकट न किया जाएगा’ faithfully renders ἀποκαλυφθήσεται. The second clause’s ‘जाना न जाएगा,’ though comprehensible, is not idiomatic modern standard Hindi for γνωσθήσεται.
  naturalness: The wording is generally clear and dignified, but ‘जाना न जाएगा’ sounds archaic and can momentarily be read with the unrelated sense of ‘go.’ Replacing it with ‘ज्ञात नहीं होगा’ gives a natural modern Hindi passive/resultative expression while retaining the source’s non-specific agent and future sense. Using ‘नहीं’ rather than post-verbal ‘न’ is also more natural in modern prose.
  terminology: ‘ढका हुआ,’ ‘प्रकट,’ ‘छिपा हुआ,’ and ‘ज्ञात’ accurately maintain the source’s paired concealment/disclosure imagery without importing a doctrinal interpretation. The notes appropriately retain lexical and temporal alternatives.
  issues:
  - severity: low
    issue: The phrase ‘जाना न जाएगा’ is stylistically archaic and potentially ambiguous in modern Hindi.
    rationale: γνωσθήσεται means ‘will be known / become known.’ ‘ज्ञात नहीं होगा’ is the standard modern Hindi expression and maintains the future passive/resultative force.
  - severity: low
    issue: Post-verbal negation (‘प्रकट न किया जाएगा,’ ‘ज्ञात न होगा’) is more literary than contemporary standard prose.
    rationale: ‘नहीं’ before the finite verb is smoother modern Hindi and does not alter the double-negative structure or meaning.
