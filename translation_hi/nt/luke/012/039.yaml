source:
  edition: SBLGNT
  text: Τοῦτο δὲ γινώσκετε ὅτι εἰ ᾔδει ὁ οἰκοδεσπότης ποίᾳ ὥρᾳ ὁ κλέπτης ἔρχεται, ⸂οὐκ ἂν⸃ ἀφῆκεν ⸀διορυχθῆναι τὸν οἶκον αὐτοῦ.
base_translation:
  language: en
  yaml_path: translation/nt/luke/012/039.yaml
  text: 'But know this: if the master of the house had known at what hour the thief was coming[a], he would not have allowed his house to be broken into.'
translation:
  language: hi
  text: 'पर यह जान लो: यदि घर के स्वामी को पता होता कि चोर किस घड़ी आने वाला है, तो वह अपने घर में सेंध लगने[a] न देता।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “खोदकर या भेदकर प्रवेश किया जाना”; यह घर की दीवार में सेंध करके भीतर घुसने के चित्र की ओर संकेत करता है।'
    reason: cultural_note
lexical_decisions:
- source_word: Τοῦτο δὲ γινώσκετε
  choice: पर यह जान लो
  rationale: वर्तमान सक्रिय आज्ञार्थक बहुवचन γινώσκετε को सीधे और स्वाभाविक हिंदी आज्ञार्थक रूप में रखा गया है; δέ का संक्रमण और हल्का विरोध ‘पर’ से व्यक्त होता है।
- source_word: οἰκοδεσπότης
  choice: घर का स्वामी
  rationale: यह शब्द घर या परिवार के मुखिया को सूचित करता है। ‘घर का स्वामी’ उसके अधिकार-संबंधी भाव को स्पष्ट और गरिमापूर्ण ढंग से बनाए रखता है।
- source_word: ποίᾳ ὥρᾳ
  choice: किस घड़ी
  rationale: ὥρα की समय-विशिष्टता और जागते रहने के प्रसंग को बनाए रखते हुए यह आधुनिक हिंदी में सहज है।
- source_word: ὁ κλέπτης ἔρχεται
  choice: चोर ... आ रहा है
  rationale: ग्रीक वर्तमानकाल को बनाए रखा गया है; हिंदी में यह उस प्रत्याशित आगमन को स्वाभाविक रूप से व्यक्त करता है जिसके समय का स्वामी को ज्ञान नहीं था।
- source_word: οὐκ ἂν ἀφῆκεν
  choice: न देता
  rationale: ἄν सहित भूतकालीन क्रिया की अवास्तविक, प्रतितथ्यात्मक परिणति हिंदी की शर्तीय संरचना ‘यदि ... होता ... तो ... न देता’ से स्पष्ट होती है।
- source_word: διορυχθῆναι
  choice: सेंध लगने
  rationale: क्रिया का शाब्दिक चित्र दीवार को खोदकर या तोड़कर भीतर घुसने का है। ‘सेंध लगना’ हिंदी में इस प्राचीन प्रवेश-विधि और चोरी के आशय दोनों को संक्षेप में व्यक्त करता है।
- source_word: τὸν οἶκον αὐτοῦ
  choice: अपने घर
  rationale: कर्ता के साथ स्वाभाविक हिंदी संबंध के कारण αὐτοῦ को ‘अपने’ से व्यक्त किया गया है; ‘घर’ भौतिक भवन के चित्र को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। प्रतितथ्यात्मक शर्त को स्वाभाविक हिंदी वाक्य-विन्यास में व्यक्त किया गया है और प्राचीन दीवार में सेंध लगाने का सांस्कृतिक चित्र मुख्य पाठ तथा पाद-टिप्पणी में सुरक्षित रखा गया है।
