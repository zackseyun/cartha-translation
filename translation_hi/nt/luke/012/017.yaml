  text: And he reasoned within himself[a], saying, ‘What will I do[b], since I have nowhere to gather my crops?’
translation:
  language: hi
  text: और वह मन-ही-मन विचार कर रहा था, ‘मैं क्या करूँ? क्योंकि मेरे पास अपनी उपज इकट्ठी करने के लिए जगह नहीं है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελογίζετο
  choice: विचार करने लगा
  rationale: अपूर्णकाल भीतर चल रही विचार-विमर्श की प्रक्रिया दिखाता है; यह प्रयोग आधुनिक हिन्दी में स्वाभाविक रहते हुए उस जारी मनन को व्यक्त करता है।
- source_word: ἐν ἑαυτῷ
  choice: मन-ही-मन
  rationale: यह स्पष्ट करता है कि विचार भीतर हो रहा था, आवश्यक नहीं कि शब्द ऊँचे स्वर में बोले गए हों।
- source_word: λέγων
  choice: ‘…’
  rationale: हिन्दी में ‘मन-ही-मन विचार करने लगा’ के बाद सीधा कथन स्वाभाविक रूप से सहभागी λέγων का कार्य पूरा करता है; अलग से ‘कहते हुए’ जोड़ना बोझिल होता।
- source_word: Τί ποιήσω
  choice: मैं क्या करूँ?
  rationale: विचारार्थक एओरिस्ट सब्जंक्टिव को वर्तमान मानक हिन्दी में स्वाभाविक अनिर्णयात्मक प्रश्न के रूप में व्यक्त किया गया है।
- source_word: ὅτι
  choice: क्योंकि
  rationale: यह उसके प्रश्न का कारण प्रस्तुत करता है और हिन्दी में स्पष्ट तथा सहज कारण-सूचक है।
- source_word: οὐκ ἔχω ποῦ
  choice: मेरे पास … जगह नहीं है
  rationale: यूनानी मुहावरे का स्वाभाविक हिन्दी रूप है, जो स्थान के अभाव को स्पष्ट रखता है।
- source_word: συνάξω
  choice: इकट्ठी करने
  rationale: मूल क्रिया के ‘एकत्र करने’ के अर्थ को सुरक्षित रखता है; अगले पदों के संदर्भ से भंडारण का आशय विकसित होता है, इसलिए यहाँ उसे अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: τοὺς καρπούς μου
  choice: अपनी उपज
  rationale: कृषि-संदर्भ में καρποί खेत की पैदावार को सूचित करता है; ‘उपज’ व्यापक, स्वाभाविक और ‘फलों’ से अधिक संदर्भानुकूल है।
theological_decisions: []
